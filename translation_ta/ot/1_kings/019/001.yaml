source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: ta
  text: எலியா செய்த எல்லாவற்றையும், அவர் தீர்க்கதரிசிகள் அனைவரையும் வாளால் கொன்றதையும் ஆகாப் யேசபேலிடம் தெரிவித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: ஒருவரிடம் நிகழ்ந்தவற்றை எடுத்துச் சொல்வதைக் குறிக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் வினைச்சொல்.
- source_word: הָרַג
  choice: கொன்றதையும்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளைத் தணிக்காமல் வழங்குகிறது.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: கருவியைக் குறிக்கும் எபிரெய முன்னிடைச்சொல் அமைப்பைச் சுருக்கமாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: כָּל הַנְּבִיאִים
  choice: தீர்க்கதரிசிகள் அனைவரையும்
  rationale: மூலத்தில் உள்ள வரையறுக்கப்பட்ட முழுமையைக் காக்கிறது; இவ்வசனத்திலேயே இல்லாத ‘பாகாலின்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தீர்க்கதரிசிகளைக் கொன்றவர் யார்?
  choice: ‘அவர்’ என்பது எலியாவைக் குறிக்குமாறு வாக்கியம் அமைக்கப்பட்டது.
  alternative: எழுவாயைக் குறிப்பிடாமல் வைத்து, ஆகாபா எலியாவா என்ற செய்பவர் மயக்கத்தைத் தமிழிலும் விடுதல்.
  rationale: முதல் தொடர்புச் சொற்றொடரில் எலியா வெளிப்படையாக எழுவாயாகக் குறிப்பிடப்படுகிறார்; அதனைத் தொடரும் கொலைச் செயலுக்கும் அவரே இயல்பான எழுவாய். முந்தைய நிகழ்வுச் சூழலும் இதை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான சொல் வரிசையும், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையும் பயன்படுத்தப்பட்டுள்ளன.
