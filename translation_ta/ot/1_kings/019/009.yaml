  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: ta
  text: அங்கே அவன் அந்தக் குகைக்கு வந்து, அங்கே இரவைக் கழித்தான். இதோ, யாவேவின் வார்த்தை அவனுக்கு வந்தது; அது அவனிடம், “எலியா, நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்?[a]” என்று கேட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எலியா, நீ ஏன் இங்கே இருக்கிறாய்?” எபிரெய மரபுத்தொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “எலியா, இங்கே உனக்கு என்ன?” என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பது வருதல் அல்லது சென்று சேருதல் என்னும் பொதுவான இயக்க வினை. குகையை அடைந்ததை இயல்பான தமிழில் தெரிவிக்க ‘வந்து’ பொருத்தமாக உள்ளது.
- source_word: הַמְּעָרָה
  choice: அந்தக் குகை
  rationale: מְעָרָה என்பதன் வழக்கமான பொருள் ‘குகை.’ எபிரெய definite article-ஐச் சூழலுக்கு இயல்பாக ‘அந்த’ என்று வெளிப்படுத்துகிறது.
- source_word: וַיָּלֶן
  choice: இரவைக் கழித்தான்
  rationale: לון/לין என்பது இரவில் தங்குதல் அல்லது இரவைக் கழித்தல். ‘இரவைக் கழித்தான்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְהִנֵּה
  choice: அப்போது, இதோ
  rationale: הִנֵּה திடீர் கவன ஈர்ப்பையும் நிகழ்வின் உயிரோட்டத்தையும் குறிக்கிறது. ‘இதோ’ அந்த உரையாடல் வலிமையைத் தக்கவைக்கிறது; ‘அப்போது’ தமிழ் நடைக்கு இணைப்பளிக்கிறது.
- source_word: דְבַר יְהוָה
  choice: யாவேவின் வார்த்தை
  rationale: இது தீர்க்கதரிசன வெளிப்பாட்டுக்குரிய நிலையான சொற்றொடர். ‘வார்த்தை’ அதன் அடையாளத்தையும் இறையியல் நிறையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பட்ட உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מַה לְּךָ פֹה
  choice: நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்?
  rationale: சொல்லுக்குச் சொல் ‘இங்கே உனக்கு என்ன?’ எனும் எபிரெய மரபுத்தொடர், இச்சூழலில் எலியாவின் இங்கிருப்பை ஆராயும் கேள்வியாக உள்ளது. தேர்ந்த மொழிபெயர்ப்பு அதன் பரந்த சூழ்நிலை சார்ந்த கேள்வித்தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: பெயரைத் தமிழில் நிலைபெற்ற வேதாகம வழக்கின்படி ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராகத் தக்கவைக்கிறது.
- issue: דְבַר יְהוָה என்ற வெளிப்பாட்டு வாய்பாட்டை மொழிபெயர்த்தல்
  choice: யாவேவின் வார்த்தை
  alternative: யாவேவிடமிருந்து ஒரு செய்தி
  rationale: ‘வார்த்தை’ என்பது மூலத்தின் நிலையான தீர்க்கதரிசன வாய்பாட்டையும் அதன் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; ‘செய்தி’ என்பது பொருளை முன்கூட்டியே விளக்கிவிடும்.
- issue: וַיֹּאמֶר என்பதன் எழுவாய்
  choice: யாவேவின் வார்த்தை ... கேட்டது
  alternative: யாவே அவனிடம் கேட்டார்
  rationale: எபிரெய இலக்கணத்தில் அருகிலுள்ள ஆண்பால் பெயர்ச்சொல்லான ‘வார்த்தை’ வினையின் எழுவாயாகப் புரிந்துகொள்ள முடியும். யாவேவை மறைமுக எழுவாயாக மாற்றாமல், மூலத்தின் தொடரமைப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பதன் மூலம் மூலத்தின் திடீர் கவன ஈர்ப்பு காக்கப்பட்டுள்ளது. கேள்வியின் நோக்கம் காரணத்தை மட்டும் குறிக்காமல், எலியாவின் அங்கிருப்பு மற்றும் செயலை விசாரிக்கும் வகையில் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
