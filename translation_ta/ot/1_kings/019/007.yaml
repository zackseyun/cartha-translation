source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: ta
  text: அப்போது யாவேவின் தூதர்[a] இரண்டாம் முறையாகத் திரும்பிவந்து, அவனைத் தொட்டு, “எழுந்து சாப்பிடு; ஏனெனில் பயணம் உன் ஆற்றலுக்கு மிஞ்சுகிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் செய்தியாளர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிவந்து
  rationale: சூழலில் שׁוב என்பது முன்பு வந்த தூதர் மீண்டும் வந்ததைக் குறிக்கிறது; தமிழ்க் கதைநடையில் ‘திரும்பிவந்து’ இயல்பாக உள்ளது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேவின் தூதர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இங்கு தெய்வீகத் தூதரைக் குறிக்கிறது. יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: பொதுவான ‘மீண்டும்’ என்பதைவிட, எபிரேயச் சொல்லில் உள்ள இரண்டாவது முறை என்ற குறிப்பைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וַיִּגַּע בּוֹ
  choice: அவனைத் தொட்டு
  rationale: נגע உடன் வரும் சுட்டுப்பெயர் நேரடியாக ‘அவனைத் தொட்டார்’ எனப் பொருள்படும்; மறுபடியும் என்ற கருத்து ஏற்கெனவே முந்தைய தொடரில் உள்ளது.
- source_word: קוּם אֱכֹל
  choice: எழுந்து சாப்பிடு
  rationale: இரு நேரடி கட்டளைகளையும், பழமையான நடையின்றி இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: பயணம் உன் சக்திக்கு மிஞ்சியது
  rationale: சொற்றொடர் பயணம் எலியாவின் திறனை அல்லது வலிமையை மீறுவதாகக் கூறுகிறது. வெறும் தொலைவை மட்டும் குறிக்கும் ‘மிக நீளமானது’ என்பதைத் தவிர்த்து, சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאָךְ என்பதன் பொருள்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: எபிரேயச் சொல் ‘தூதர்/செய்தியாளர்’ என்ற பரப்பைக் கொண்டது. சூழல் தெய்வீகத் தூதரைச் சுட்டினாலும், ‘தூதர்’ என்பது மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. ‘சாப்பிடு’ என்பது இன்றைய வாசகருக்கு இயல்பான நேரடி கட்டளை; ‘உன் சக்திக்கு மிஞ்சியது’ என்பது பயணம் எலியாவின் ஆற்றலை மீறுகிறது என்ற எபிரேய மொழிநயத்தைத் தெளிவாகக் காட்டுகிறது.
