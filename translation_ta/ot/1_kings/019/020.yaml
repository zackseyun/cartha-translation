base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: ta
  text: அவன் எருதுகளை விட்டுவிட்டு எலியாவின் பின்னால் ஓடிப்போய், “தயவுசெய்து, என் தந்தையையும் என் தாயையும் முத்தமிட என்னை அனுமதியுங்கள்; பின்னர் நான் உம்மைப் பின்தொடர்வேன்” என்றான். அதற்கு எலியா, “போ, திரும்பிச் செல்[b]; ஏனெனில் நான் உனக்கு என்ன செய்தேன்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எலியாவின் பதிலின் பொருள் தெளிவாக இல்லை. இது, “போ, திரும்பிச் செல்; நான் உனக்காக என்ன செய்தேன்?” என்றும் மொழிபெயர்க்கப்படலாம்; அல்லது முடிவை எலிசாவிடமே விட்டுவிடும் சுருக்கமான கூற்றாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: விட்டுவிட்டு
  rationale: இந்தச் சூழலில் עזב என்பது மாடுகளை அங்கே விட்டுச் செல்வதைக் குறிக்கிறது; நிரந்தரமாகக் கைவிட்டான் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: הַבָּקָר
  choice: மாடுகளை
  rationale: בקר பொதுவாக மாடுகளைக் குறிக்கும்; முந்தைய வசனத்தின் உழவுச் சூழலில் தமிழில் இயல்பான பொதுப்பெயராக ‘மாடுகள்’ பொருந்துகிறது.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: பின்னால் ஓடிப்போய்
  rationale: ஒருவரைப் பின்தொடர்ந்து ஓடிச் செல்லும் நேரடியான இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶשְּׁקָה נָּא
  choice: தயவுசெய்து ... முத்தமிட்டு விடைபெற அனுமதியும்
  rationale: נשק என்பதன் நேரடிப் பொருளான ‘முத்தமிடு’ என்பதைக் காக்கிறது; சூழலில் அது விடைபெறும் செயல் என்பதைத் தெளிவுபடுத்துகிறது. נָא மரியாதையான வேண்டுகோளாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְאָבִי וּלְאִמִּי
  choice: என் தகப்பனையும் என் தாயையும்
  rationale: எபிரெய உரையைப் போலவே இருவரையும் தனித்தனியாகக் குறிப்பிடுகிறது; ‘பெற்றோர்’ என்று சுருக்கவில்லை.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: அதன்பின் நான் உம்மைப் பின்தொடர்வேன்
  rationale: הלך אחרי என்பதிலுள்ள ஒருவருக்குப் பின்னால் செல்வது என்ற உருவகத்தையும், இச்சூழலில் தொடர்ந்துசெல்லும் நோக்கத்தையும் இயல்பாகத் தருகிறது.
- source_word: לֵךְ שׁוּב
  choice: போ, திரும்பிச் செல்
  rationale: இரண்டு எபிரெய கட்டளைகளின் சுருக்கமான, திடீர் நடையைத் தமிழிலும் காக்கிறது; அவற்றை ஒரே கட்டளையாகச் சுருக்கவில்லை.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: ஏனெனில் நான் உனக்கு என்ன செய்தேன்?
  rationale: கடினமும் பலவிதமாகப் புரிந்துகொள்ளத்தக்கதுமான கேள்வியை விளக்கவுரையால் தீர்மானிக்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: כִּי מֶה עָשִׂיתִי לָךְ என்ற எலியாவின் பதிலின் பொருள்
  choice: ‘ஏனெனில் நான் உனக்கு என்ன செய்தேன்?’ என்ற நேரடியான கேள்வியை முதன்மை உரையில் வைத்தல்
  alternative: ‘நான் உனக்காக என்ன செய்தேன்?’ அல்லது எலிசா தானே முடிவெடுக்கட்டும் என விடும் சுருக்கமான பதில்
  rationale: இக்கூற்று அனுமதி, கண்டிப்பு, அல்லது எலியா செய்த அடையாளச் செயலின் நினைவூட்டல் எனப் பலவாறு புரிந்துகொள்ளப்பட்டுள்ளது. ஒரு விளக்கத்தை மட்டும் உரைக்குள் புகுத்தாமல் அதன் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எலிசா எலியாவிடம் பேசும்போது மரியாதைப் பன்மையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; எலியா எலிசாவிடம் ‘உனக்கு’ என்று உரையாடுகிறார். எபிரெய மூலத்தின் சுருக்கமும் இறுதிக் கேள்வியின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
