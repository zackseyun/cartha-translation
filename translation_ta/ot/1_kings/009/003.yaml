base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: ta
  text: யாவே அவனிடம், “என் முன்னிலையில் நீ ஏறெடுத்த உன் ஜெபத்தையும் அருளுக்கான உன் மன்றாட்டையும்[a] நான் கேட்டேன். நீ கட்டிய இந்த வீட்டை[b], என் பெயரை என்றென்றும் அங்கே வைப்பதற்காகப் பரிசுத்தமாக்கியிருக்கிறேன். என் கண்களும் என் இதயமும் எல்லா நாட்களிலும் அங்கே இருக்கும்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மன்றாட்டு’ என்பது அருள் அல்லது தயவை நாடி ஏறெடுக்கப்படும் தாழ்மையான வேண்டுகோளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘இந்த வீடு’; இது சாலொமோன் கட்டிய ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘என் கண்களும் என் இதயமும் எல்லா நாட்களிலும் அங்கே இருக்கும்’ என்பது யாவேயின் தொடர்ந்த கவனத்தையும் அக்கறையையும் மனித உறுப்புகளால் உருவகப்படுத்தும் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பொதுப்பட்டப் பட்டமாக மாற்றாமல், எபிரெய உச்சரிப்பிற்கு நெருக்கமான தமிழாக்கமாக வழங்குகிறது.
- source_word: שָׁמַעְתִּי
  choice: நான் கேட்டேன்
  rationale: இறைவன் சாலொமோனின் வேண்டுதலைக் கேட்டுவிட்டார் என்ற நிறைவுற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְּפִלָּתְךָ
  choice: உன் விண்ணப்பம்
  rationale: மன்றாட்டிலிருந்து வேறுபடுத்திக்காட்டி, வேண்டுதல் சார்ந்த ஜெபத்தின் பொருளைத் தருகிறது.
- source_word: תְּחִנָּתְךָ
  choice: அருளுக்கான உன் மன்றாட்டு
  rationale: அருள் அல்லது தயவை நாடும் தாழ்மையான வேண்டுகோள் என்ற தனித்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לְפָנַי
  choice: என் முன்னிலையில்
  rationale: இறைச் சமூகத்தில் வேண்டுதல் ஏறெடுக்கப்பட்டது என்ற எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது.
- source_word: הִקְדַּשְׁתִּי
  choice: பரிசுத்தமாக்கியிருக்கிறேன்
  rationale: இறைவனுக்குரிய புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைத்தல் என்ற வழிபாட்டுச் சார்ந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த வீடு
  rationale: இங்கு சாலொமோன் கட்டிய ஆலயம் குறிக்கப்பட்டாலும், மூலத்தின் ‘வீடு’ என்ற உருவகத்தையும் இறையியல் ஒலிப்பையும் பாதுகாக்கிறது.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: என் பெயரை அங்கே வைப்பதற்காக
  rationale: இறைவனுடைய பெயரை ஆலயத்தில் வைக்கும் உடன்படிக்கை சார்ந்த மரபுத்தொடரை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிலைத்தன்மையைச் சுட்டும் மூல மரபுத்தொடருக்கான இயல்பான தமிழ் இணை.
- source_word: עֵינַי וְלִבִּי
  choice: என் கண்களும் என் இதயமும்
  rationale: இறைவனுடைய தொடர்ந்த கவனத்தையும் அக்கறையையும் உடல் உறுப்புகளால் உருவகப்படுத்தும் மூல மொழியை அப்படியே பாதுகாக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: ‘எப்போதும்’ என்று சுருக்காமல் மூலத்தின் தெளிவான கால உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘என் கண்களும் என் இதயமும் அங்கே இருக்கும்’ என்பதில் இறைவனை மனித உருவில் பேசும் மொழி
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘என் கவனமும் அக்கறையும் எப்போதும் அங்கே இருக்கும்’ என்று பொருள்விரித்தல்
  rationale: மூலம் இறைவனுடைய தொடர்ந்த கவனத்தையும் உடன்படிக்கை சார்ந்த அக்கறையையும் உடல் சார்ந்த உருவகத்தால் திட்டமிட்டே தெரிவிக்கிறது; அதைத் தட்டையாக்காமல் பாதுகாக்க வேண்டும்.
- issue: ‘என் பெயரை என்றென்றும் அங்கே வைப்பது’ என்பதன் பொருள்
  choice: ஆலயம்–பெயர் மரபுத்தொடரை விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: ‘நான் என்றென்றும் அங்கே குடியிருப்பதற்காக’ அல்லது ‘அங்கே என்றென்றும் வழிபடப்படுவதற்காக’
  rationale: மூலம் இறைவனையே இடத்திற்குள் வரையறுத்துக் கூறாமல், அவருடைய பெயரை அங்கே வைப்பதாகத் துல்லியமாகச் சொல்கிறது; அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன பொதுத் தமிழில் வாசிக்க இயலும் மரியாதையான, வேதாகமத்திற்கேற்ற நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’, ‘என் பெயரை வைப்பது’, ‘என் கண்களும் என் இதயமும்’, ‘எல்லா நாட்களிலும்’ ஆகிய மூல உருவகங்கள் விளக்கவுரையாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
