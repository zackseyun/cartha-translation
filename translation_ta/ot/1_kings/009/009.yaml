base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: ta
  text: அதற்கு அவர்கள், “எகிப்து நாட்டிலிருந்து தங்கள் தந்தையரை வெளியே கொண்டுவந்த தங்கள் கடவுளாகிய யாவேவை அவர்கள் கைவிட்டு, வேறு தெய்வங்களை உறுதியாகப் பற்றிக்கொண்டு, அவற்றுக்கு முன்பாகப் பணிந்து, அவற்றுக்குப் பணிவிடை செய்தார்கள். அதனால்தான் யாவே இந்த எல்லாப் பேரழிவுகளையும் அவர்கள் மேல் கொண்டுவந்தார்” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: அதற்கு அவர்கள் ... என்று சொல்வார்கள்
  rationale: முந்தைய வசனத்தில் எழும் கேள்விக்கான பதிலை அறிமுகப்படுத்துகிறது; எபிரெய வினை வடிவின் எதிர்காலச் சூழலையும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: … செய்தார்கள்
  rationale: காரணத்தை மேற்கோளின் முதல் வாக்கியமாகக் கூறி, עַל כֵּן உடன் காரண–விளைவு தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָזְבוּ
  choice: கைவிட்டு
  rationale: வெறுமனே ‘விட்டுச் சென்றனர்’ என்பதைக் காட்டிலும் உறவு மற்றும் உடன்படிக்கைச் சார்ந்த புறக்கணிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: யாவேவையே குறிக்கும் ஒருமைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து ... வெளியே கொண்டுவந்த
  rationale: விடுதலைப் பயணத்தைக் குறிக்கும் மூலமொழி அமைப்பை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֲבֹתָם
  choice: தங்கள் தந்தையரை
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையைத் தக்கவைத்து, முந்தைய தலைமுறையின் தந்தையரைக் குறிக்கிறது.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை உறுதியாகப் பற்றிக்கொண்டு
  rationale: חזק ב என்பதிலுள்ள உறுதியான பற்றுதல் மற்றும் விசுவாசத்தை மாற்றிக் கொடுத்தல் ஆகிய நுண்ணுணர்வுகளை வெளிப்படுத்துகிறது.
- source_word: וישתחו להם
  choice: அவற்றுக்கு முன்பாகப் பணிந்து
  rationale: வணக்கத்தின் உடல்சார் செயலான பணிதலைக் காக்கிறது; அடுத்துள்ள ‘பணிவிடை செய்தார்கள்’ என்பதுடன் பொருள் வேறுபாட்டையும் பேணுகிறது.
- source_word: וַיַּעַבְדֻם
  choice: அவற்றுக்குப் பணிவிடை செய்தார்கள்
  rationale: விக்கிரக வழிபாட்டுச் சூழலில் மதச் சேவையைச் சுட்டுகிறது; முந்தைய பணிதல் வினையிலிருந்து தனித்தன்மையைப் பேணுகிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: முன்னே கூறப்பட்ட துரோகத்திற்கும் அதன் விளைவான தீர்ப்பிற்கும் உள்ள காரணத் தொடர்பை வலியுறுத்துகிறது.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: இந்தப் பேரழிவு அனைத்தையும் அவர்கள்மேல் வரச்செய்தார்
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை அல்ல, தீர்ப்பாக வந்த கடும் அழிவைக் குறிக்கிறது; காரணவினை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பேணுகிறது.
- issue: אֲבֹתָם என்ற பாலினம் குறிக்கப்பட்ட மூதாதைச் சொல்
  choice: தங்கள் தந்தையரை
  alternative: தங்கள் மூதாதையரை
  rationale: மூலத்தின் ஆண்பால் பன்மையைத் தக்கவைக்கிறது; சூழலில் எகிப்திலிருந்து வெளியே கொண்டுவரப்பட்ட முன்னோர்களைக் குறிக்கிறது.
- issue: தீர்ப்பில் கடவுளின் செயற்பாடு
  choice: யாவே ... அவர்கள்மேல் வரச்செய்தார்
  alternative: அவர்கள்மேல் ... வர அனுமதித்தார்
  rationale: הֵבִיא என்பது யாவே பேரழிவைக் கொண்டுவந்தார் என்று நேரடியாகக் கூறுகிறது; ‘அனுமதித்தார்’ எனத் தணிப்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. காரண–விளைவு அமைப்பு தெளிவாக இருக்க மேற்கோள் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. தெய்வங்களுக்கு உயிரற்ற பன்மைக்குரிய ‘அவற்றுக்கு’ பயன்படுத்தப்பட்டுள்ளது; இது இயல்பான தமிழிலும் பேச்சாளரின் நிராகரிப்புச் சூழலிலும் பொருந்துகிறது.
