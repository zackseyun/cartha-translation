  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: ta
  text: அவன், “என் சகோதரனே, நீ எனக்குக் கொடுத்த இந்தப் பட்டணங்கள் எப்படிப்பட்டவை?” என்று கேட்டான். ஆகவே அவன் அவற்றுக்கு ‘காபூல் நாடு’[a] என்று பெயரிட்டான்; இன்றுவரை அவை அவ்வாறே அழைக்கப்படுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காபூல்” என்பது பெரும்பாலும் ஓர் இடப்பெயர். ஆனால் எபிரெய மொழியில் இது இகழ்ச்சியான ஒரு சொல்விளையாட்டையும் கொண்டிருக்கலாம்; “பயனற்றது” அல்லது “கட்டுப்பட்டது/வரையறுக்கப்பட்டது” போன்ற பொருளைச் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்கள் எப்படிப்பட்டவை?
  rationale: מָה இங்கு வெறும் அடையாளக் கேள்வியல்ல; தரத்தைப் பற்றிய அதிருப்தியுடன் கூடிய கேள்வியாக உள்ளது. இயல்பான தமிழில் அந்தத் தொனியைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: நீ எனக்குக் கொடுத்த
  rationale: நிறைவேறிய கொடுக்கும் செயலை நேரடியான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אָחִי
  choice: என் சகோதரனே
  rationale: முதலாம் நபர் உடைமைப் பின்னொட்டையும், அரசர்களுக்கிடையேயான உறவு அல்லது தூதரக அழைப்புமுறையையும் அப்படியே பாதுகாக்கிறது.
- source_word: וַיִּקְרָא לָהֶם
  choice: அவன் அவற்றுக்கு … என்று பெயரிட்டான்
  rationale: קרא + ל என்பதன் பெயரிடுதல் சார்ந்த பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֶרֶץ כָּבוּל
  choice: ‘காபூல் நாடு’
  rationale: כָּבוּל இங்கு இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்படுகிறது; சாத்தியமான இகழ்ச்சியான சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அவை அவ்வாறே அழைக்கப்படுகின்றன
  rationale: எபிரெய காலக் குறிப்பின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தி, அந்தப் பெயர் தொடர்ந்து நிலவுவதைத் தெளிவாக்குகிறது.
