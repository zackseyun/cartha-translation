  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: ta
  text: பாலாத்தையும், நாட்டின் வனாந்தரத்தில் உள்ள தாமாரையும்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயப் பாடம்: “தாமார்”; 2 நாளாகமம் 8:4-இல் உள்ள இணைப் பகுதி “தத்மோர்” என்று வாசிக்கிறது.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: אֵת குறிக்கும் நேரடிச் செயப்படுபொருளைத் தமிழின் வேற்றுமை உருபான ‘-ஐ’ வெளிப்படுத்துகிறது; וְ குறிக்கும் பட்டியல் இணைப்பை ‘-உம்’ இயல்பாகத் தருகிறது.
- source_word: בַּעֲלָת
  choice: பாலாத்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: תמר
  choice: தாமார்
  rationale: WLC மெய்யெழுத்துப் பாடம் תמר என்பதால் ‘தாமார்’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளது. 2 நாளாகமம் 8:4-இல் காணப்படும் ‘தத்மோர்’ என்ற இணைப்பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּ/מִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியேற்றம் குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ இந்தப் புவியியல் பொருளைச் சுருக்கமாகவும் மரியாதைமிக்க நடையிலும் தருகிறது.
- source_word: בָּ/אָֽרֶץ
  choice: நாட்டின்
  rationale: אֶרֶץ இங்கு பரந்த நிலப்பரப்பு அல்லது நாட்டைக் குறிக்கிறது. தமிழில் ‘நாட்டின் வனாந்தரத்தில்’ என்பது இரு இடக்குறிப்புகளின் உறவை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: முந்தைய வசனத்தில் தொடங்கிய கட்டுமானப் பட்டியலைத் தொடரும் வாக்கியத் துணுக்காகவே மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தில் இவ்வசனத்துக்குள் இல்லாத வினைச்சொல் சேர்க்கப்படவில்லை. இடப்பெயர்கள் நவீனத் தரத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
