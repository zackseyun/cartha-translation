  choice: விவரம்
  rationale: இந்தக் கட்டுமானப் பணிக்காக விதிக்கப்பட்ட கட்டாய வேலை பற்றிய விளக்கக் குறிப்பை அறிமுகப்படுத்துவதால், நவீன தமிழில் இயல்பான “விவரம்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמַּס
  choice: கட்டாய வேலை
  rationale: இங்கு பணவரி அல்ல, அரச கட்டுமானங்களுக்காக விதிக்கப்பட்ட கட்டாயப் பணிச் சேவையே குறிக்கப்படுகிறது. தொழில்நுட்பச் சொல்லைவிட இது பொதுவாசகருக்குத் தெளிவானது.
- source_word: הֶעֱלָה
  choice: ஆட்களைத் திரட்டிய
  rationale: ஹிப்இல் வடிவம் இச்சூழலில் வேலைப்படையை விதித்து எழுப்புதல் அல்லது திரட்டுதல் என்ற நிர்வாகப் பொருளைக் கொண்டுள்ளது. தமிழில் மனிதர்கள்மீது கட்டாய வேலையை விதித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנוֹת
  choice: கட்டுவதற்காக
  rationale: மூலத்தின் நோக்கத்தைக் குறிக்கும் வினையெச்சப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: “வீடு” என்பதே நேரடிப் பொருள் என்றாலும், இங்கு யாவேக்காகக் கட்டப்பட்ட வழிபாட்டுக் கட்டடம் குறிக்கப்படுவதால் “ஆலயம்” நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵּיתוֹ
  choice: தனது அரண்மனை
  rationale: சாலொமோனின் அரச இல்ல வளாகம் குறிக்கப்படுகிறது. “தனது வீடு” என்பதைவிட “அரண்மனை” சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּלּוֹא
  choice: மில்லோ
  rationale: குறிப்பிட்ட கட்டட அல்லது நிலஅமைப்பைத் துல்லியமாக அடையாளம் காண முடியாததால் பொருளை ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது; சாத்திய விளக்கம் அடிக்குறிப்பில் தரப்பட்டது.
