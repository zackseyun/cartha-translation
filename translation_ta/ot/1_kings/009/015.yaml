  alternative: “யாவேயின் இல்லம்” மற்றும் “தனது இல்லம்”
  rationale: மூலத்தின் சொல் மீளுருவாக்கத்தைத் தமிழில் அப்படியே வைத்தால் இரு கட்டடங்களின் தன்மை பொதுவாசகருக்குத் தெளிவாகாமல் போகலாம். சூழலுக்கேற்ற சொற்கள் பயன்படுத்தப்பட்டாலும், இரண்டுமே בַּיִת என்பதிலிருந்து வந்தவை என்ற கருத்து மறுக்கப்படவில்லை.
