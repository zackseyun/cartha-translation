  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: ta
  text: சாலொமோன் அரசன் யாவேயின் ஆலயத்தையும், தனது அரண்மனையையும், மில்லோவையும்[b], எருசலேமின் மதிலையும், ஹாசோர், மெகிதோ, கேசேர் ஆகியவற்றையும் கட்டுவதற்காக விதித்த கட்டாய உழைப்புச் சேவையின்[a] விவரம் இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை “உழைப்புவரி” அல்லது “கட்டாய அரசுப் பணி” என்றும் மொழிபெயர்க்கலாம். இது பணமாகச் செலுத்தும் வரி அல்ல; அரசின் பணிகளுக்காக விதிக்கப்படும் கட்டாய உழைப்பாகும்.
    reason: lexical_alternative
  - marker: b
    text: “மில்லோ” என்பது எருசலேமில் இருந்த ஒரு கோட்டைப் பாதுகாப்பு அமைப்பையோ அல்லது மண்ணால் நிரப்பப்பட்ட படித்தள அமைப்பையோ குறித்திருக்கலாம். இந்த எபிரெயச் சொல்லுக்கு “நிரப்பப்பட்ட பகுதி” என்ற பொருளும் இருக்கலாம்.
    reason: cultural_note
