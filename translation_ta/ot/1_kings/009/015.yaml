- from: 'சாலொமோன் அரசன் யாவேயின் ஆலயத்தையும், தனது அரண்மனையையும், மில்லோவையும்[b], எருசலேமின் மதிலையும், ஆத்சோர், மெகிதோ, கேசேர் ஆகிய நகரங்களையும் கட்டுவதற்காகக் கட்டாய வேலைக்கு[a] ஆட்களைத் திரட்டியதன் விவரம் இதுவே.


    [a] இதை “கட்டாய உழைப்புச் சேவை” என்றும் மொழிபெயர்க்கலாம். இது பணமாகச் செலுத்தும் வரி அல்ல; அரசின் பணிகளுக்காக மக்கள் கட்டாயமாகச் செய்ய வேண்டிய வேலை.


    [b] “மில்லோ” என்பது எருசலேமிலிருந்த நன்கு அறியப்பட்ட ஒரு கோட்டை அமைப்பையோ, மண்ணால் நிரப்பப்பட்ட படிக்கட்டு போன்ற தள அமைப்பையோ குறித்திருக்கலாம். இந்த எபிரெயச் சொல்லுக்கு “நிரப்பப்பட்ட பகுதி” என்ற பொருளும் இருக்கலாம்.'
