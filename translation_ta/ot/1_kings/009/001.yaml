base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: ta
  text: சாலொமோன் யாவேயின் ஆலயத்தையும் அரசனின் மாளிகையையும் கட்டி, தான் செய்ய விரும்பிய அனைத்தையும் செய்து முடித்தபோது,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: கட்டி முடித்தபோது
  rationale: וַיְהִי அறிமுகப்படுத்தும் நிகழ்வுச் சூழலும், כְּ + כלה என்பதன் காலப்பொருளும் தமிழில் இயல்பான ஒரே காலத் தொடராகக் கொடுக்கப்பட்டுள்ளன; அடுத்த வசனத்தில் முதன்மை வாக்கியம் தொடர்வதால் தனியே ‘அது நடந்தது’ என்று சேர்க்கப்படவில்லை.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரெயப் பெயரின் பரவலாக அறியப்பட்ட நவீனத் தமிழ் வடிவம்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், இங்கு கடவுளுக்காகக் கட்டப்பட்ட ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ சாதாரண வாசகருக்கு இயல்பாகவும் சூழலுக்கு தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச மாளிகை
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’ என்றாலும், இச்சூழலில் அரசனுடைய அரண்மனையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: தான் செய்ய விரும்பிய அனைத்தையும்
  rationale: חֵשֶׁק என்பது விருப்பத்தையோ விரும்பப்பட்டவற்றையோ குறிக்கலாம்; பின்வரும் தொடர்புச் சொற்றொடருடன் சேர்ந்து, ‘சாலொமோன் செய்ய விரும்பிய அனைத்தும்’ என்பது இயல்பான தமிழ்.
- source_word: לִבְנוֹת ... לַעֲשׂוֹת
  choice: கட்டி ... செய்ய
  rationale: முதலாவது வினை கட்டுமானத்தைத் தெளிவாகக் குறிக்கிறது; עשה என்பதன் விரிந்த ‘செய்/உருவாக்கு’ பொருளை இரண்டாவது இடத்தில் ‘செய்ய’ பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ என்பது எபிரெய வடிவத்துக்கு நெருக்கமான நவீனத் தமிழ் நடை.
- issue: בֵּית என்பதன் உருவகமும் சூழற்பொருளும்
  choice: யாவேயின் ஆலயம்; அரச மாளிகை
  alternative: யாவேயின் வீடு; அரசனின் வீடு
  rationale: எபிரெயத்தில் ஒரே ‘வீடு’ சொல் இரண்டிலும் வரும் இணை அமைப்பு உள்ளது. ஆயினும் தமிழில் ‘ஆலயம்’ மற்றும் ‘அரச மாளிகை’ சூழலைத் தவறாகப் புரிந்துகொள்ளாமல் தெளிவுபடுத்துகின்றன; எந்தத் தனிப்பட்ட சமயக் கோட்பாடும் இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் வாக்கியம் நிறைவடைவதால் இவ்வசனத்தின் இறுதிக் காற்புள்ளி பாதுகாக்கப்பட்டுள்ளது. ‘வீடு’ என்ற சொல் உருவாக்கக்கூடிய தவறான நேரடிப் புரிதலைத் தவிர்க்க சூழலுக்கேற்ற ‘ஆலயம்’, ‘அரச மாளிகை’ பயன்படுத்தப்பட்டுள்ளன.
