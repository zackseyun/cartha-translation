base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: ta
  text: அப்போது நான் அவர்களுக்குக் கொடுத்த நாட்டிலிருந்து இஸ்ரவேலை அகற்றிவிடுவேன். என் பெயருக்காக நான் புனிதப்படுத்திய வீட்டை[a] என் முன்னிலையிலிருந்து தள்ளிவிடுவேன்[b]. இஸ்ரவேல் எல்லா மக்களினங்களிடையிலும் பழமொழியாகவும் இகழ்ச்சிச் சொல்லாகவும்[c] ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தை.” எபிரெயத்தில், “வீடு.” இங்கு அது ஆலயத்தைக் குறிக்கிறது. “என் பெயருக்காக” என்பது கடவுளின் பெயரைத் தாங்கி அதை மகிமைப்படுத்துவதற்கென அர்ப்பணிக்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: அல்லது, “என் முன்னிலையிலிருந்து அனுப்பிவிடுவேன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பழமொழியாகவும் வசைச்சொல்லாகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: அறுத்துப்போடுவேன்
  rationale: כרת என்பதன் ‘அறுத்துப்போடுதல்/அகற்றுதல்’ என்ற உடன்படிக்கைத் தீர்ப்பு வலிமையைப் பேணுகிறது; முற்றழிப்பைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: நாட்டின் மேற்பரப்பிலிருந்து
  rationale: ‘நிலத்தின் முகத்திலிருந்து’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் பேணுகிறது; சூழலில் אֲדָמָה வாக்குத்தத்த நாடாகும்.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: சொல்லளவில் ‘வீடு’ என்றாலும், இச்சூழலில் சாலொமோனின் ஆலயமே தெளிவான குறிப்பு. நவீன தமிழ் வாசகருக்காக இயல்பான குறிப்புச்சொல் பயன்படுத்தப்பட்டு, அடிக்குறிப்பில் மூல வடிவம் தரப்படுகிறது.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: என் பெயருக்காக நான் புனிதப்படுத்திய
  rationale: ஆலயம் கடவுளின் பெயரைத் தாங்கி மகிமைப்படுத்துவதற்கெனத் தனியே ஒதுக்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பேணுகிறது.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: என் திருமுன்னிலிருந்து அகற்றிவிடுவேன்
  rationale: שׁלח இங்கு அனுப்பிவிடுதல் அல்லது நிராகரித்து அகற்றுதல் என்ற பொருளை உடையது. ‘திருமுன்னிலை’ கடவுளைக் குறிக்கும் மரியாதையான தமிழாகவும் ‘என் முகத்திற்கு முன்பிருந்து’ என்ற உருவகத்தின் கருத்தைத் தாங்குவதாகவும் உள்ளது.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: பழமொழியாகவும் கேலிப்பேச்சாகவும்
  rationale: முதல் சொல் எடுத்துக்காட்டாகச் சொல்லப்படும் பழமொழியையும், இரண்டாவது சொல் நிந்தனை அல்லது ஏளனப் பேச்சையும் குறிக்கும் வேறுபாட்டைப் பேணுகிறது.
- source_word: בְּכָל הָעַמִּים
  choice: எல்லா மக்களினங்களிடையிலும்
  rationale: עַמִּים என்பது நவீன அரசியல் நாடுகளை மட்டும் அல்லாமல் பல்வேறு மக்கள் குழுக்களைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தீர்ப்பை முற்றழிப்பாக மிகைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: இஸ்ரவேலை அறுத்துப்போடுவேன்
  alternative: இஸ்ரவேலை அழித்துவிடுவேன் / வேரோடு பிடுங்கிவிடுவேன்
  rationale: வசனம் வாக்குத்தத்த நாட்டிலிருந்து அகற்றப்படும் கடுமையான தீர்ப்பைக் கூறுகிறது; தீர்ப்பின் துல்லியமான முறையை மொழிபெயர்ப்பு தேவையின்றி நிர்ணயிக்கவில்லை.
- issue: הַבַּיִת என்பதைக் ‘வீடு’ அல்லது ‘ஆலயம்’ என வழங்குதல்
  choice: ஆலயம்
  alternative: வீடு
  rationale: மூலச்சொல் ‘வீடு’ என்றாலும், இவ்வசனத்தின் நேரடிச் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. இயல்பான தமிழ் முதன்மை உரையில் ‘ஆலயம்’ பயன்படுத்தப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘என் பெயருக்காக’ என்ற எபிரெய இறையியல் மரபுத்தொடரைப் பேணுதல்
  choice: என் பெயருக்காக
  alternative: என் பெயரைத் தாங்குவதற்காக
  rationale: அசல் மொழியின் சுருக்கமான மரபுத்தொடரும் அதிலுள்ள இறையியல் செறிவும் பேணப்படுகின்றன; அதன் கருத்து அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுன்னிலை’ இறைவனைச் சுட்டும் மரியாதைத் தன்மையைக் கொண்டுள்ளது. எபிரெய உருவகங்களும் தீர்ப்பின் வலிமையும் இயன்றவரை பேணப்பட்டுள்ளன; ‘ஆலயம்’ மட்டும் சூழல் தெளிவுக்காக இயல்பாக்கப்பட்டுள்ளது.
