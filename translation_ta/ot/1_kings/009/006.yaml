base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ta
  text: ஆனால், நீயோ உன் மகன்களோ என்னைப் பின்பற்றுவதிலிருந்து முற்றிலும் விலகி[a], நான் உங்கள் முன் வைத்த என் கட்டளைகளையும் நியமங்களையும் கடைப்பிடிக்காமல், போய் வேறு தெய்வங்களுக்குச் சேவை செய்து அவற்றின் முன் பணிந்துகொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நீங்களும் உங்கள் மகன்களும்.” எபிரேயச் சொற்றொடர் சாலொமோனையும் அவனுடைய வழித்தோன்றல்களையும் சேர்த்தே அழைப்பதாகப் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை, இந்த நிபந்தனை சாலொமோனுக்கோ அவனுடைய அரச வழித்தோன்றல்களுக்கோ பொருந்தலாம் என்பதைத் தெரிவிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ஆனால் ... என்றால்
  rationale: אִם நிபந்தனையை அறிமுகப்படுத்துகிறது; முந்தைய வாக்குறுதிக்கு மாறான எச்சரிக்கை தொடங்குவதால் உரையோட்டத்திற்காக ‘ஆனால்’ சேர்க்கப்பட்டுள்ளது.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: முற்றிலும் விலகி
  rationale: வினையெச்ச முழுவடிவமும் வினைச்சொல்லும் இணைந்த அமைப்பு செயலின் வலிமையை வலியுறுத்துகிறது. מֵאַחֲרַי உடன் இது மனந்திரும்புதலை அல்ல, ஆண்டவரைப் பின்பற்றுவதிலிருந்து விலகுவதைச் சுட்டுகிறது.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: நீயோ உன் மகன்களோ
  rationale: சூழலில் சாலொமோனுக்கும் அவனுடைய அரச வம்சத்தாருக்கும் எச்சரிக்கை விடுக்கப்படுகிறது. நிபந்தனை சாலொமோனிடமோ அவன் மகன்களிடமோ நிறைவேறலாம் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரேயத்தின் இணைப்புச் சொல் குறித்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מֵאַחֲרַי
  choice: என்னைப் பின்பற்றுவதிலிருந்து
  rationale: ஆண்டவரைப் பின்பற்றுவதை நிறுத்துதல் என்ற உடன்படிக்கைச் சார்ந்த எபிரேய மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: கடைப்பிடிக்காமல்
  rationale: கட்டளைகள் தொடர்பில் שׁמר என்பது அவற்றைக் காத்துக் கடைப்பிடிப்பதைக் குறிக்கிறது; நவீன தமிழில் ‘கடைப்பிடி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: என் கட்டளைகளையும் நியமங்களையும்
  rationale: இரு சட்டச் சொற்களுக்கிடையிலான வேறுபாட்டைப் பேணுவதற்காக தனித்தனி தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: நான் உங்கள் முன் வைத்த
  rationale: נתן + לפני என்ற மரபுத்தொடர் ‘ஒருவரின் முன் வைத்தல்’ என்று பொருள்படும்; உடன்படிக்கைக் கடமைகள் அவர்களுக்கு முன்வைக்கப்பட்டதைக் காட்டுகிறது.
- source_word: וַהֲלַכְתֶּם
  choice: போய்
  rationale: அடுத்துவரும் உருவ வழிபாட்டுச் செயல்களை அறிமுகப்படுத்தும் இயல்பான தமிழ் வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்குச் சேவை செய்து
  rationale: עבד என்பதன் ‘சேவை செய்’ என்ற தனிப்பொருளைப் பேணி, அடுத்த השתחוה வினையிலிருந்து வேறுபடுத்துகிறது.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: அவற்றின் முன் பணிந்துகொண்டால்
  rationale: உடலைத் தாழ்த்திப் பணிதல் என்ற தெளிவான காட்சியைப் பேணுகிறது; முந்தைய ‘சேவை செய்து’ என்பதுடன் ஒன்றாக்கப்படவில்லை.
theological_decisions:
- issue: எச்சரிக்கையின் அரச வம்ச நோக்கம்
  choice: சாலொமோன் அல்லது அவனுடைய மகன்கள் எனப் பொருள்படும் வகையில் ‘நீயோ உன் மகன்களோ’
  alternative: ‘நீங்களும் உங்கள் மகன்களும்’
  rationale: சூழலில் ஆண்டவர் சாலொமோனிடம் தாவீதின் அரச குடும்பத்தையும் ஆலயத்தையும் குறித்து பேசுகிறார். ஆகவே பொதுவான மக்கள் அனைவரையும் குறிப்பதாக விரிவுபடுத்தாமல், சாலொமோனையும் அவனுடைய அரச வழித்தோன்றல்களையும் குறிக்கும் வம்சப் பரப்பை மொழிபெயர்ப்பு பேணுகிறது; இணைப்பின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘கட்டளைகள்/நியமங்கள்’ மற்றும் ‘சேவை செய்/முன் பணிந்துகொள்’ என்ற எபிரேய வேறுபாடுகள் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன. வாக்கியம் அடுத்த வசனத்தில் தொடரும் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
