  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: ta
  text: நீயோ, உன் தந்தை தாவீது நடந்ததுபோல், உள்ளத்தின் உத்தமத்தோடும்[a] நேர்மையோடும் என் முன்னிலையில் நடந்து, நான் உனக்குக் கட்டளையிட்ட அனைத்தின்படியும் செய்து, என் நியமங்களையும் நீதித் தீர்ப்புகளையும்[b] கைக்கொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குற்றமற்ற உள்ளத்தோடு.’ எபிரெயச் சொல் முற்றிலும் பாவமற்ற நிலையைக் கட்டாயமாகக் குறிக்காமல், முழுமையையும் உத்தமத்தையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் நியமங்களையும் சட்ட விதிகளையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: நேரடி அழைப்பில் ஏற்படும் மெல்லிய வலியுறுத்தலையும் கருத்து மாற்றத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: אִם
  choice: கைக்கொண்டால்
  rationale: எபிரெய நிபந்தனை முழு வாக்கியத்தையும் ஆளுவதால், தமிழில் இயல்பாக இறுதி வினையில் ‘-ஆல்’ விகுதியால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: תֵּלֵךְ לְפָנַי
  choice: என் முன்னிலையில் நடந்து
  rationale: தேவனுடைய சந்நிதியில் வாழும் நடத்தையைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: உன் தந்தை தாவீது நடந்ததுபோல
  rationale: தாவீதின் வாழ்க்கை நடத்தையோடு செய்யப்படும் ஒப்பீட்டையும் ‘நடத்தல்’ என்ற மூல உருவகத்தையும் பாதுகாக்கிறது.
- source_word: בְּתָם לֵבָב
  choice: இதய உத்தமத்துடன்
  rationale: முழுமை, உண்மைத்தன்மை, ஒருமுகப்பட்ட நேர்மை ஆகிய நுண்ணர்த்தங்களைத் தருகிறது; முற்றிலும் பாவமற்ற நிலை என்று மிகைப்படுத்தவில்லை.
- source_word: וּבְיֹשֶׁר
  choice: நேர்மையாக
  rationale: ஒழுக்க ரீதியான செம்மையையும் நேரான நடத்தையையும் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: நான் உனக்குக் கட்டளையிட்ட அனைத்தின்படியும் செய்து
  rationale: கீழ்ப்படிதலின் செயற்பாட்டையும் כְּכֹל என்பதன் முழுமையான பரப்பையும் வெளிப்படுத்துகிறது.
- source_word: חֻקַּי
  choice: என் நியமங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் நிலைநிறுத்தப்பட்ட விதிகளைக் குறிக்கிறது; அடுத்த சட்டச் சொல்லிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וּמִשְׁפָּטַי
  choice: நீதித் தீர்ப்புகள்
  rationale: מִשְׁפָּט என்பதிலுள்ள நீதித்துறை மற்றும் ஒழுங்குமுறை நுண்ணர்த்தத்தைத் தக்கவைக்கிறது.
- source_word: תִּשְׁמֹר
  choice: கைக்கொண்டால்
  rationale: உடன்படிக்கைச் சூழலில் ‘கவனமாகப் பின்பற்று/கடைப்பிடி’ என்ற பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: தாவீதின் முன்மாதிரியான நடத்தை
  choice: ‘இதய உத்தமத்துடன்’ என்று மொழிபெயர்த்து, உண்மையான முழுமையையும் நேர்மையையும் வலியுறுத்துதல்
  alternative: ‘குற்றமற்ற இதயத்துடன்’ என்று வலுவாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் தாவீதை உடன்படிக்கைக்கு உண்மையுள்ள முன்மாதிரியாக முன்வைக்கிறது; அவர் ஒவ்வொரு வகையிலும் பாவமற்றவர் என்று கூறுவதில்லை. இத்தேர்வு பாராட்டின் வலிமையையும் இறையியல் பதற்றத்தையும் ஒருங்கே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் ‘என் முன்னிலையில் நட’ என்ற உருவகமும், நியமங்கள்/நீதித் தீர்ப்புகள் என்ற சட்டச் சொற்களின் வேறுபாடும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
