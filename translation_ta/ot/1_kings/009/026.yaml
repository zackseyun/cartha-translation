  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: ta
  text: சாலொமோன் அரசன் ஏதோம் நாட்டில், செங்கடலின்[a] கரையில் ஏலோத்துக்கு அருகே இருந்த எசியோன்-கேபேரில் ஒரு கப்பற்படையையும் உருவாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “நாணல் கடல்”; மரபாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: ஒரு கப்பற்படையையும்
  rationale: אֳנִי இச்சூழலில் தனிக் கப்பலைவிடக் கப்பல்களின் தொகுப்பைக் குறிக்கிறது. முன்னுள்ள நிகழ்வுடன் இணைக்கும் וָ என்பதைக் ‘-யும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָשָׂה
  choice: உருவாக்கினான்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்தான்’. கப்பற்படையைத் தமிழில் ‘கட்டினான்’ என்று சொல்வதைவிட ‘உருவாக்கினான்’ என்பது இயல்பாகவும், கப்பல்களைக் கட்டி ஒரு படையை ஏற்படுத்திய கருத்தை உள்ளடக்குவதாகவும் உள்ளது.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: எசியோன்-கேபேரில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; בְּ என்ற இடவியல் முன்னொட்டு தமிழின் ‘-இல்’ வேற்றுமையால் குறிக்கப்படுகிறது.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: ஏலோத்துக்கு அருகே இருந்த
  rationale: இந்த அமைப்பு எசியோன்-கேபேருக்கும் ஏலோத்துக்கும் இடையிலான அருகாமையைச் சுட்டுகிறது. நவீன தமிழில் தெளிவாக இருக்க ‘அருகே இருந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל שְׂפַת יַם סוּף
  choice: செங்கடலின்[a] கரையில்
  rationale: שְׂפַת என்பதன் இடவியல் பொருள் ‘கரை’. יַם סוּף மரபாகவும் இப்புவியியல் சூழலில் எளிதில் புரியும்படியும் ‘செங்கடல்’ என வழங்கப்பட்டு, அதன் நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டில்
  rationale: ‘ஏதோம் தேசத்தில்’ என்ற எபிரெயச் சொற்றொடரின் புவியியல் வலியுறுத்தலை இயல்பான நவீன தமிழில் முழுமையாகக் காக்கிறது.
