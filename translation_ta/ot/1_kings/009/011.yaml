  source_fidelity: முக்கிய நிகழ்வுவரிசையும் பொருட்களின் பட்டியலும் சரியாக உள்ளன. ஆனால் ‘அவன் விரும்பியபடியெல்லாம்’ என்பது தமிழில் ஈராமையோ சாலொமோனையோ சுட்டக்கூடியதாக இருப்பதால், எபிரெயச் சூழலில் குறிக்கப்படும் சாலொமோனின் விருப்பம் வெளிப்படையாகக் குறிப்பிடப்பட வேண்டும். ‘மரக்கட்டைகள்’ என்பது עֵץ இங்கு குறிக்கும் மரப்பொருள்/கட்டுமான மரம் என்பதைவிடக் குறிப்பான ‘logs’ பொருளைத் தரலாம்.
