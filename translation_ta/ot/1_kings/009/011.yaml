base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: ta
  text: தீருவின் அரசன் ஈராம், சாலொமோன் விரும்பிய அனைத்திற்கும் ஏற்ப கேதுரு மரப்பொருளையும், தேவதாரு[a] மரப்பொருளையும், பொன்னையும் சாலொமோனுக்கு வழங்கியிருந்தான். அப்போது சாலொமோன் அரசன் ஈராமுக்குக் கலிலேயா நாட்டில் இருபது நகரங்களைக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘சைப்ரஸ்,’ ‘ஜூனிப்பர்,’ ‘ஃபிர்,’ அல்லது வேறொரு ஊசியிலை மரம்; எபிரெயச் சொல்லான ‘பெரோஷ்’ குறிக்கும் துல்லியமான மர இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: வழங்கியிருந்தான்
  rationale: வினையின் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’ என்றாலும், ஒருவருக்கு பொருட்களைக் கொண்டு ஆதரவளிக்கும் இக்கட்டமைப்பில் ‘வழங்குதல்’ என்பதே சூழலுக்கேற்ற பொருள். அடுத்த முக்கிய நிகழ்வுக்கு முந்திய பின்னணிச் செயலைத் தமிழில் இறந்தகால நிறைவுவினை இயல்பாகக் காட்டுகிறது.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகளையும்
  rationale: עֵץ இங்கு உயிருள்ள மரங்களைவிட கட்டுமானத்திற்குரிய மரப்பொருளைக் குறிக்கிறது; ‘மரக்கட்டைகள்’ அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: தேவதாரு[a] மரக்கட்டைகளையும்
  rationale: בְּרוֹשׁ குறிக்கும் துல்லியமான ஊசியிலை மர இனம் உறுதியில்லை. நவீன தமிழில் அறியப்பட்ட பொதுவான பெயராக ‘தேவதாரு’ பயன்படுத்தப்பட்டு, நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּבַזָּהָב
  choice: பொன்னையும்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளை விரிவாக்கமின்றி வழங்குகிறது.
- source_word: לְכָל חֶפְצוֹ
  choice: அவன் விரும்பியபடியெல்லாம்
  rationale: சாலொமோன் விரும்பிய அல்லது வேண்டிய முழு அளவையும் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: ஈராம் வழங்கிய பின்னணிச் செயலிலிருந்து சாலொமோன் கொடுத்த நிகழ்வுக்கு நகர்த்தும் காலத் தொடர்பைத் தெளிவுபடுத்துகிறது.
- source_word: יִתֵּן
  choice: கொடுத்தான்
  rationale: வடிவில் நிறைவுறா வினையாக இருந்தாலும் אָז என்பதற்குப் பின் வரும் கதைநடையில் கடந்த நிகழ்வாகச் செயல்படுவதால் தமிழ் எளிய இறந்தகாலம் பொருத்தமானது.
- source_word: עֶשְׂרִים עִיר
  choice: இருபது நகரங்கள்
  rationale: עִיר என்பதற்கான வழக்கமான பொருள் ‘நகரம்’; அரசியல்-புவியியல் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: கலிலேயா நாட்டில்
  rationale: אֶרֶץ என்பதன் ‘நாடு/நிலப்பகுதி’ என்ற பொருளையும் கலிலேயா என்ற இடப்பெயரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: ஈராம் ... சாலொமோன் ... தீர் ... கலிலேயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
