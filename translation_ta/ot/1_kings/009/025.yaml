base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: ta
  text: ஆண்டுக்கு மூன்று முறை சாலொமோன், யாவேக்காகத் தான் கட்டிய பலிபீடத்தின்மேல் தகனபலிகளையும் சமாதானப் பலிகளையும் செலுத்தினான். மேலும், யாவேக்கு முன்பாக இருந்த அதனோடு தூபம் எரித்தான்.[a] இவ்வாறு அவன் அந்த வீட்டை[b] நிறைவுசெய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதனோடு பலிகளைப் புகையாக எழச்செய்தான்.” எபிரெய வினைச்சொல் தூபம் எரிப்பதை மட்டுமல்லாமல், பலியைப் புகையாக எழச்செய்வதையும் விரிவாகக் குறிக்கலாம். “அதனோடு” என்பதிலுள்ள எபிரெயச் சுட்டுப்பெயரின் துல்லியமான தொடர்பும் விவாதத்துக்குரியது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “வீடு”; இங்கு ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: செலுத்தினான்
  rationale: עלה என்பதன் Hiphil வடிவம் பலியிடும் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் பலிச் செயலைத் தெளிவாகச் சொல்கிறது; சாலொமோன் நேரடியாகவே சடங்கைச் செய்தான் என்ற கூடுதல் முடிவையும் கட்டாயப்படுத்தாது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: பலிபீடத்தில் முழுமையாக எரிக்கப்படும் பலிவகைக்கான வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: நல்லுறவு, நலநிலை, பங்குறவு ஆகிய கருத்துகளை உள்ளடக்கிய பலிவகை. தமிழில் பரவலாக அறியப்பட்ட மரபுச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ஆண்டுக்கு மூன்று முறை
  rationale: எபிரெய காலக் குறிப்பின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: யாவேக்காகத் தான் கட்டிய பலிபீடத்தின்மேல்
  rationale: உறவுநிலை வாக்கியத்தையும் பலியின் இடத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהַקְטֵיר
  choice: தூபம் எரித்தான்
  rationale: קטר என்பதன் Hiphil வடிவம் தூபம் எரிப்பதையோ, இன்னும் விரிவாக ஒரு பலிப்பொருளைப் புகையாக எழச்செய்வதையோ குறிக்கலாம். ஆலயச் சூழலில் இயல்பான முதன்மை வாசகமாக ‘தூபம் எரித்தான்’ கொள்ளப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִתּוֹ
  choice: அதன்மேல்
  rationale: இலக்கண ரீதியாகக் கடினமான இந்த வடிவத்தின் சுட்டுப்பெயர் முன்வந்த பலிபீடத்தைக் குறிப்பதாகக் கொண்டு, தமிழில் இயல்பாக ‘அதன்மேல்’ என வழங்கப்படுகிறது.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: சடங்கு நடைபெற்ற இடம் யாவேக்கு முன்பாக இருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழெழுத்துப் பெயர்ப்பை வழங்குகிறது.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: இவ்வாறு அவன் அந்த வீட்டை நிறைவுசெய்தான்
  rationale: שלם என்பதன் Piel வடிவத்திலுள்ள நிறைவு/முடித்தல் பொருளையும், הַבָּיִת என்பதன் சொற்பொருளான ‘வீடு’ என்பதையும் பாதுகாக்கிறது; இங்கு அது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: சாலொமோன் பலி மற்றும் தூபச் செயல்களை நேரடியாகச் செய்தானா, அல்லது அரச ஆதரவுடன் செய்யவைத்தானா?
  choice: எபிரெய உரையைப் போலவே செயல்கள் சாலொமோனுக்குச் சார்த்தப்படுகின்றன; அவன் நேரடியாகச் சடங்குகளைச் செய்தானா என்பது மொழிபெயர்ப்பில் தீர்மானிக்கப்படவில்லை.
  alternative: சாலொமோன் தன் கைகளால் எல்லாச் சடங்குகளையும் செய்தான்; அல்லது ஆசாரியர்களைக் கொண்டு மட்டும் செய்யவைத்தான் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: அரச வரலாற்றுச் சுருக்கநடையில் ஒரு அரசனுக்குச் செயல் சார்த்தப்படுவது அவனது நேரடிச் செயலையோ அவன் ஏற்பாடு செய்த செயலையோ குறிக்கலாம். மூலத்தில் உள்ள இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: וְהַקְטֵיר என்பதன் சடங்குசார் பொருள்
  choice: முதன்மை உரையில் ‘தூபம் எரித்தான்’; பலிப்பொருளைப் புகையாக எழச்செய்தல் என்ற விரிவான பொருள் அடிக்குறிப்பில்.
  alternative: ‘பலிப்பொருளைப் புகையாக எழச்செய்தான்’ என்று முதன்மை உரையில் வழங்குதல்.
  rationale: ஆலயச் சூழலில் தூபம் என்பது இயல்பான வாசிப்பு; ஆயினும் எபிரெய வினைச்சொல்லின் விரிவான பலிசார் பொருளை மறைக்காமல் அடிக்குறிப்பில் தருவது உண்மையான ambiguity-ஐ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘தகனபலிகள்’, ‘சமாதானப் பலிகள்’, ‘பலிபீடம்’, ‘தூபம்’ போன்ற அறிமுகமான வழிபாட்டுச் சொற்கள் வைக்கப்பட்டுள்ளன. மூலத்தின் ‘வீடு’ பிரதான உரையில் தக்கவைக்கப்பட்டு அதன் ஆலயக் குறிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
