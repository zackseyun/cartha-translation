  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: ta
  text: ஈராம் அரசனுக்கு நூற்றிருபது தாலந்து தங்கத்தை அனுப்பினான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தாலந்து என்பது பண்டைக்காலத்தில் பயன்படுத்தப்பட்ட ஒரு பெரிய எடை அலகு; இங்கு நூற்றிருபது தாலந்து எடையுள்ள தங்கம் என்று பொருள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘சாலொமோன் அரசனுக்கு’; எபிரெய மூலத்தில் ‘அரசனுக்கு’ என்று மட்டுமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: வாவ் தொடருடன் வரும் வினைச்சொல் கதையை முன்னெடுத்துச் செல்லும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் இயல்பாக ‘அனுப்பினான்’ என வழங்கப்படுகிறது.
- source_word: חִירָם
  choice: ஈராம்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுக்கு
  rationale: எபிரெயத்தில் பெயரைக் குறிப்பிடாமல் திட்டவட்டமாக ‘அரசனுக்கு’ என்றே உள்ளது; சூழலில் அது சாலொமோனைக் குறித்தாலும் மூலத்தின் சொல்வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: நூற்றிருபது
  rationale: எண்ணிக்கையைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: כִּכַּר
  choice: தாலந்து
  rationale: பண்டைய பெரிய எடை அலகான כִּכָּר என்பதற்குத் தமிழில் பரவலாக அறியப்பட்ட மரபுச் சொல்; பண அலகாகத் தவறாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பு விளக்குகிறது.
- source_word: זָהָב
  choice: தங்கத்தை
  rationale: זָהָב என்பதன் நேரடியான பொருள் ‘தங்கம்’; தமிழ் வாக்கிய அமைப்பில் செயப்படுபொருள் வேற்றுமையுடன் வழங்கப்பட்டுள்ளது.
