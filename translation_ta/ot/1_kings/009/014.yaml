translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வரலாற்று உரைநடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தாலந்து’ என்ற பண்பாட்டுச் சொல்லின் எடைப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது; சூழலிலுள்ள சாலொமோனின் பெயர் முதன்மை உரையில் சேர்க்கப்படவில்லை.
