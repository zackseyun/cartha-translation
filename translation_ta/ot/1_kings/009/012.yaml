  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: ta
  text: ஈராம் தீரிலிருந்து புறப்பட்டு, சாலொமோன் தனக்குக் கொடுத்திருந்த நகரங்களைப் பார்க்கச் சென்றான்; ஆனால் அவை அவன் பார்வையில் உகந்தவையாக இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் அவை அவனுக்குப் பிடிக்கவில்லை.” எபிரேய மரபுத்தொடரைச் சொற்சொல்லாக மொழிபெயர்த்தால், “அவை அவன் கண்களில் நேரானவையாக இருக்கவில்லை” என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு ... சென்றான்
  rationale: יצא என்பதன் வெளியேறுதல் அல்லது புறப்படுதல் என்ற திசைசார்ந்த பொருளை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: מִצֹּר
  choice: தீரிலிருந்து
  rationale: מן என்னும் முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; தமிழில் ‘தீரிலிருந்து’ என்பது இயல்பான வடிவம்.
- source_word: לִרְאוֹת
  choice: பார்க்க
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதை வைத்திருக்கிறது; ‘ஆய்வுசெய்ய’ என்ற சூழல்சார் நுணுக்கத்தை தேவையின்றி சேர்க்கவில்லை.
- source_word: הֶעָרִים
  choice: நகரங்களை
  rationale: עיר என்பதற்கான வழக்கமான பொருள் ‘நகரம்’; இங்குள்ள பன்மையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: சாலொமோன் தனக்குக் கொடுத்திருந்த
  rationale: நகரங்களைக் காண ஈராம் புறப்படுவதற்கு முன்பே அவை கொடுக்கப்பட்டிருந்ததை ‘கொடுத்திருந்த’ இயல்பாகக் காட்டுகிறது; לוֹ என்பதன் பெறுநர் ஈராம் என்பதால் தமிழ் தற்சுட்டு ‘தனக்கு’ பொருந்துகிறது.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: ஆனால் அவை அவன் பார்வைக்கு உகந்தவையாக இருக்கவில்லை
  rationale: ישר בעיני என்ற எபிரேய மரபுத்தொடரில் உள்ள ‘அவன் பார்வையில்’ என்ற உருவகத்தை ஓரளவு பாதுகாத்து, இச்சூழலில் அவை அவனுக்கு ஏற்றதாகவோ திருப்தியளிப்பதாகவோ இல்லை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
