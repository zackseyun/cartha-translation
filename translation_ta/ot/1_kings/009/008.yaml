  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: ta
  text: இந்த ஆலயம் பாழாகிவிடும்[a]. அதைக் கடந்து செல்லும் ஒவ்வொருவரும் அதிர்ச்சியடைந்து சீட்டியடிப்பார்கள்[b]. அவர்கள், ‘யாவே ஏன் இந்த நாட்டுக்கும் இந்த ஆலயத்துக்கும் இவ்வாறு செய்தார்?’ என்று கேட்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை நேரடியாக, “இந்த ஆலயம் உயர்ந்ததாக இருக்கும்” என்று வாசிக்கிறது. இச்சூழலில் பலர் இதை ஆலயம் பாழாகி, அச்சமூட்டும் காட்சியாக மாறும் என்ற பொருளில் புரிந்துகொள்கிறார்கள்; 2 நாளாகமம் 7:21-ஐ ஒப்பிடுக.
    reason: textual_variant
  - marker: b
    text: அல்லது, “சீறுவார்கள்.” எபிரெய வினைச்சொல் திகைப்பு அல்லது இகழ்ச்சியைக் காட்டும் கூரிய ஒலியை எழுப்புவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: இந்த ஆலயம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; இச்சூழலில் அது யாவேக்காகக் கட்டப்பட்ட ஆலயத்தைக் குறிப்பதால், நவீனத் தமிழில் தெளிவாக ‘ஆலயம்’ என வழங்கப்பட்டது.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: பாழடைந்ததாகும்
  rationale: மசோரா உரையின் עֶלְיוֹן என்பது நேரடியாக ‘உயர்ந்தது’ என்று பொருள்படும்; ஆனால் நியாயத்தீர்ப்புச் சூழலும் 2 நாளாகமம் 7:21 இணைப்பகுதியும் பாழ்நிலையைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன. உரைச்சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: כָּל עֹבֵר עָלָיו
  choice: அதைக் கடந்து செல்லும் ஒவ்வொருவரும்
  rationale: வழியாகச் செல்லும் அனைவரையும் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: יִשֹּׁם
  choice: திகிலடைந்து
  rationale: அழிவைக் கண்டு ஏற்படும் அதிர்ச்சியையும் அச்சத்தையும் இந்த வினை வெளிப்படுத்துகிறது; ‘திகிலடைந்து’ அதன் உணர்ச்சி வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: וְשָׁרָק
  choice: ஏளனமாகச் சீட்டியடிப்பார்கள்
  rationale: அதிர்ச்சி அல்லது இகழ்ச்சியைக் காட்டும் கூரிய ஒலியை எழுப்புவதைக் குறிக்கிறது. இச்சூழலில் அதன் ஏளனத் தன்மையைத் தெளிவுபடுத்தி வழங்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: עַל מֶה
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொற்றொடருக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: כָּכָה
  choice: இப்படி
  rationale: நியாயத்தீர்ப்பின் விதத்தைச் சுட்டும் சொல்லுக்கு இயல்பான நவீனத் தமிழ்.
- source_word: לָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டுக்கும்
  rationale: אֶרֶץ இங்கு இஸ்ரவேலின் நிலப்பரப்பைக் குறிக்கிறது; கேள்வி வாக்கியத்தில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְלַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்துக்கும்
  rationale: முதல் கூறுடன் உள்ள சொல்லுருவ ஒற்றுமையைப் பாதுகாத்தபடி, சூழலில் ஆலயமே குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையிலுள்ள உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் அதன் தனிப்பெயர் இயல்பைத் தக்கவைக்கிறது.
- issue: நியாயத்தீர்ப்புச் சூழலில் עֶלְיוֹן என்பதன் பொருள்
  choice: பாழடைந்ததாகும்
  alternative: உயர்ந்ததாக இருக்கும்
  rationale: மெய்யெழுத்து உரை ‘உயர்ந்தது’ என்ற வாசிப்பைத் தருகிறது; ஆயினும் உடனடிச் சூழலும் 2 நாளாகமம் 7:21 இணைப்பகுதியும் ஆலயத்தின் பாழ்நிலையைச் சுட்டுகின்றன. உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆலயம்,’ ‘திகிலடைந்து,’ ‘சீட்டியடிப்பார்கள்’ போன்ற சொற்கள் சூழலைத் தெளிவாக்குகின்றன; மசோரா உரையிலுள்ள முக்கியமான பொருள் நெருக்கடி அடிக்குறிப்பில் மறைக்காமல் பாதுகாக்கப்பட்டுள்ளது.
