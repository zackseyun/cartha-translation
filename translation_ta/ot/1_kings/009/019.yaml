base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: ta
  text: மேலும், சாலொமோனுக்குச் சொந்தமான எல்லாக் களஞ்சிய நகரங்களையும்[a], தேர்ப்படை நகரங்களையும், குதிரைப்படை வீரர்களுக்கான நகரங்களையும்[b], எருசலேமிலும் லெபனோனிலும் தனது ஆட்சிக்குட்பட்ட நாடு முழுவதிலும் கட்டுவதற்குச் சாலொமோன் விரும்பிய அனைத்தையும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேமிப்புக்கான நகரங்கள்’ அல்லது ‘பொருள் குவிப்பு நகரங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொருட்களையோ உணவுப் பொருட்களையோ சேமித்து வைப்பதற்காக ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் பொதுவாகக் குதிரைகளை மட்டும் அல்ல, குதிரைமேல் செல்லும் வீரர்களை அல்லது குதிரைப்படையைக் குறிக்கிறது. ஆகவே ‘குதிரைப்படை நகரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: மாற்றாக, ‘சாலொமோன் கட்ட விரும்பிய அனைத்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘விருப்பம்’ மற்றும் ‘விரும்பினார்’ என்ற ஒரே வேர்ச் சொல்லின் வடிவங்கள் இணைக்கப்பட்டுள்ளன; இது சாலொமோனின் கட்டுமான விருப்பத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: களஞ்சிய நகரங்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் பொருட்களையும் உணவுப் பொருட்களையும் சேமித்து வைப்பதற்காக ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கிறது. ‘களஞ்சிய நகரங்கள்’ என்பது நிர்வாக மற்றும் சேமிப்புப் பயன்பாட்டைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: சாலொமோனுக்குச் சொந்தமான
  rationale: לְ என்னும் தொடர்புருபு இங்கு உடைமை அல்லது சாலொமோனுக்காக ஒதுக்கப்பட்ட நிலை ஆகியவற்றைக் குறிக்கலாம். ‘சொந்தமான’ என்பது முதன்மையான உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עָרֵי הָרֶכֶב
  choice: தேர்ப்படை நகரங்கள்
  rationale: רֶכֶב என்பது இச்சூழலில் அரசனின் தேர்களையும் தேர்ப்படை அமைப்பையும் குறிக்கிறது. வெறும் தேர்களைச் சேமிக்கும் இடங்கள் என்ற அளவில் சுருக்காமல் அதன் இராணுவப் பயன்பாட்டை ‘தேர்ப்படை’ வெளிப்படுத்துகிறது.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: குதிரைப்படை வீரர்களுக்கான நகரங்கள்
  rationale: פָּרָשִׁים என்பது பொதுவாகக் குதிரைகளை அல்ல, குதிரைமேல் செல்லும் வீரர்களை அல்லது குதிரைப்படையைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘குதிரைப்படை வீரர்களுக்கான’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: சாலொமோன் விரும்பிய அனைத்தையும்
  rationale: எபிரெயத்தில் ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் சேர்ந்து விருப்பத்தை வலியுறுத்துகின்றன. தமிழில் செயற்கையான மறுகூறலைத் தவிர்த்து, அதன் முழுமையையும் வலியுறுத்தலையும் ‘விரும்பிய அனைத்தையும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: எருசலேமிலும் லெபனோனிலும்
  rationale: இரண்டு இடங்களையும் நேரடியான இடப்பொருளில் மொழிபெயர்க்கிறது. லெபனோன் என்பது இங்கு வெறும் கேதுரு மரப் பொருளை அல்ல, கட்டுமானப் பணி நடைபெற்ற பகுதியைக் குறிப்பதாக வாசிக்கப்படுகிறது.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: தனது ஆட்சிக்குட்பட்ட நாடு முழுவதிலும்
  rationale: מֶמְשָׁלָה என்பது ஆட்சி அல்லது அதிகாரத்தையும், אֶרֶץ என்பது நிலப்பரப்பையும் குறிக்கின்றன. இந்தத் தமிழ் நடை இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
