translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெய வசனம் முந்தைய வசனத்தின் வினையுடன் தொடரும் நேர்முகச் செயப்படுபொருள் பட்டியலாக இருப்பதால், இல்லாத ‘கட்டினான்’ என்ற வினை இங்கு சேர்க்கப்படவில்லை; தொடர்ச்சியை ‘மேலும்’ என்பதும் இறுதி முற்றுப்புள்ளிக்கு முன் நிற்கும் பட்டியல் அமைப்பும் காக்கின்றன.
