  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: ta
  text: அப்போது உன் அரசின் அரியணையை இஸ்ரவேலின்மேல் என்றென்றும் நிலைநிறுத்துவேன். உன் தந்தையான தாவீதைப் பற்றி நான் சொன்னபடியே, ‘உனக்குரிய ஒருவனும் இஸ்ரவேலின் அரியணையிலிருந்து துண்டிக்கப்பட மாட்டான்’ என்று செய்வேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: அப்போது ... நிலைநிறுத்துவேன்
  rationale: தொடர்ச்சியையும் நிபந்தனையின் விளைவையும் காட்டும் வாவையும், அரியணையை உறுதியாக நிறுவுதல் என்ற வினையின் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: உன் அரசின் அரியணை
  rationale: ‘உன் ராஜ்யத்தின் சிங்காசனம்’ என்ற சொல்லமைப்பின் அரசாட்சி சார்ந்த பொருளை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: காலவரையற்ற நீடிப்பைக் குறிக்கும் எபிரேயச் சொல்லின் வலிமையை நேரடியாகக் காக்கிறது.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: உனக்குரிய ஆண் ஒருவன் அறுபட்டுப்போக மாட்டான்
  rationale: כרת என்பதன் ‘அறுபடுதல்/துண்டிக்கப்படுதல்’ உருவகத்தையும், לְךָ என்பதன் ‘உனக்குரிய’ உறவையும் விடாமல் காக்கிறது; வழக்கமான ‘ஒருவன் இல்லாமல் போகமாட்டான்’ என்ற விளக்கமாக மட்டும் மாற்றவில்லை.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையிலிருந்து
  rationale: מֵעַל என்பதன் ‘அரியணையின்மேலிருந்து/அரியணையிலிருந்து’ என்ற இடவியல் உருவகத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தாவீதின் வம்ச ஆட்சியைப் பற்றிய வாக்குறுதியின் கால அளவு
  choice: ‘என்றென்றும்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘எப்போதும்’ அல்லது நிபந்தனையை விளக்கும் விரிவாக்கம்
  rationale: இந்த வசனத்திலுள்ள לְעֹלָם என்பதன் வலிமையையும், சுற்றியுள்ள நிபந்தனைக்கும் நீடித்த வாக்குறுதிக்கும் இடையிலான வேதாகமத் த tension-ஐயும் விளக்கி ஒழிக்காமல் காக்கிறது.
- issue: ‘ஒருவன் அறுபடமாட்டான்’ என்ற மரபுவழி வாரிசுரிமை மொழி
  choice: உருவகத்தைத் தக்கவைத்து ‘உனக்குரிய ஆண் ஒருவன் அறுபட்டுப்போக மாட்டான்’
  alternative: ‘உனக்கு ஒருவன் இல்லாமல் போகமாட்டான்’
  rationale: மூலத்தின் கடுமையான כרת மொழியை மென்மையாக்காமல், அது அரச வம்ச வாரிசைக் குறிப்பதை வாசகர் உணருமாறு தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அரியணை’, ‘நிலைநிறுத்துவேன்’ போன்ற சொற்கள் அரசவாக்குறுதியின் உயர்ந்த பதிவைத் தக்கவைக்கின்றன. மூலத்தில் இல்லாத விளக்கவுரையோ சமயப்பிரிவு சார்ந்த கருத்தோ சேர்க்கப்படவில்லை.
