base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: ta
  text: அவர்கள் ஓபீருக்குச் சென்றார்கள்[a]. அங்கிருந்து நானூற்று இருபது தாலந்து தங்கத்தை எடுத்து, அதைச் சாலொமோன் அரசனிடம் கொண்டு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓபீருக்கு வந்தார்கள்.” எபிரெய வினைச்சொல்லை இவ்வாறும் மொழிபெயர்க்கலாம்; ஆனால் கதைத்தொடரில் “சென்றார்கள்” என்பது இயல்பாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: சென்று
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/செல்லுதல்’ என நோக்குநிலைக்கேற்ப அமையும். ஓபீரை நோக்கிய பயணத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாகச் சொல்ல ‘சென்று’ பொருத்தமானது.
- source_word: אוֹפִירָה
  choice: ஓபீருக்கு
  rationale: ஓபீர் என்ற இடப்பெயருடன் உள்ள திசைகாட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘-க்கு’ வேற்றுமையால் இது வெளிப்படுத்தப்படுகிறது.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: அங்கிருந்து ... எடுத்துக்கொண்டு
  rationale: לקח என்பதற்கு இச்சூழலில் ‘எடுத்தல்’ இயல்பானது; מן முன்னொட்டின் ‘அங்கிருந்து’ என்ற மூலப்பொருளும் காக்கப்படுகிறது. அடுத்த வினையுடன் இயல்பாகத் தொடர ‘எடுத்துக்கொண்டு’ பயன்படுத்தப்பட்டது.
- source_word: זָהָב
  choice: தங்கத்தை
  rationale: இது பொதுவாகத் தங்கத்தைக் குறிக்கும் சொல்; செயப்படுபொருள் உருபுடன் தமிழில் வழங்கப்பட்டது.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: நானூற்று இருபது தாலந்து
  rationale: எண்ணிக்கை முழுமையாகக் காக்கப்பட்டு, பண்டைய எடை அலகான ככר மரபாகவும் தெளிவாகவும் ‘தாலந்து’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיָּבִאוּ
  choice: கொண்டு வந்து ... கொடுத்தார்கள்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும். தமிழில் இலக்கை நோக்கிய ஒப்படைப்பை இயல்பாக வெளிப்படுத்த ‘கொண்டு வந்து ... கொடுத்தார்கள்’ என வழங்கப்பட்டது; பொருள் சாலொமோனிடம் சென்றது என்பது தெளிவாகிறது.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனிடம்
  rationale: எபிரெய apposition-ஐ நவீனத் தமிழின் இயல்பான பெயர்-பட்டம் வரிசையில் வழங்கி, אֶל என்பதன் இலக்கை ‘-இடம்’ மூலம் காத்துள்ளது.
