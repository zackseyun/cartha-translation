translation_notes:
  register: நவீன பொதுத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை பயன்படுத்தப்பட்டது. ‘சென்று’ என்பது தமிழின் கதைநோக்கில் இயல்பானது; ‘வந்து’ என்ற தொடர்ச்சி புறப்பாட்டிடத்தை நோக்கிய திரும்புகையை இயல்பாகக் காட்டுகிறது. பண்டைய அளவையை நவீன மதிப்பாக மாற்றாமல் ‘தாலந்து’ என வைத்துள்ளதால் மூலத்தின் வரலாற்றுத் தன்மை பாதுகாக்கப்படுகிறது.
