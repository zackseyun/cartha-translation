source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்களில் எவரையும் சாலொமோன் அடிமையாக்கவில்லை. ஏனெனில் அவர்கள் போர்வீரர்களாகவும், அவனுடைய பணியாளர்களாகவும், படைத்தலைவர்களாகவும், அதிகாரிகளாகவும்[a], அவனுடைய தேர்ப்படைத் தலைவர்களாகவும் குதிரைவீரர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘அதிகாரிகள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், உயர்நிலை இராணுவ உதவியாளர்களையோ தேர்ப்படை அதிகாரிகளையோ குறித்திருக்கலாம்; அந்தப் பதவியின் துல்லியமான பொறுப்பு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேல் மக்களில் எவரையும்
  rationale: முந்தைய வசனத்தில் இஸ்ரவேலர் அல்லாதவர்களுக்கு விதிக்கப்பட்ட கட்டாய உழைப்புடன் உள்ள முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கூட்டு அடையாளத்தைத் தெளிவாகவும் தருகிறது.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: சாலொமோன் அடிமையாக்கவில்லை
  rationale: ‘ஒருவரை அடிமையாகக் கொடுத்தல்/வைத்தல்’ என்ற எபிரெய மொழிநடையை இயல்பான தமிழில் தருகிறது; சுற்றியுள்ள கட்டாய உழைப்புச் சூழலில் அடிமை நிலையை மென்மைப்படுத்தாமல் காட்டுகிறது.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்கள்
  rationale: போருக்குரிய ஆண் பணியாளர்களைக் குறிக்கும் வழக்குச் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַעֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசவைக் சூழலில் עבד என்பது அடிமையை மட்டுமல்லாமல் அரசனுக்குச் சேவை செய்யும் பணியாளர்களையும் குறிக்கலாம். இங்கு தொடர்ந்து வரும் பதவிப் பட்டியலுக்கு ‘பணியாளர்கள்’ பொருந்துகிறது.
- source_word: וְשָׂרָיו
  choice: படைத்தலைவர்கள்
  rationale: שׂר என்பதன் தலைவர் அல்லது அதிகாரி என்ற பொருளை இந்த இராணுவப் பட்டியலின் சூழலுக்கேற்பத் தருகிறது.
- source_word: וְשָׁלִשָׁיו
  choice: அதிகாரிகள்[a]
  rationale: שָׁלִישׁ குறித்த துல்லியமான வரலாற்றுப் பதவி உறுதியில்லை. எனவே பொதுவான ‘அதிகாரிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, சாத்தியமான குறிப்பான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: அவனுடைய தேர்ப்படைத் தலைவர்கள்
  rationale: சாலொமோனின் தேர்ப்படையை வழிநடத்திய அதிகாரிகளைக் குறிக்கும் கட்டமைப்பைத் தெளிவான தமிழில் தருகிறது.
- source_word: וּפָרָשָׁיו
  choice: குதிரைவீரர்கள்
  rationale: குதிரைமேல் போரிடும் படையினரை நேரடியாகவும் காலச்சூழலுக்கு ஏற்றவாறும் குறிக்கிறது.
theological_decisions:
- issue: עָבֶד குறிக்கும் சமூக நிலை
  choice: அடிமையாக்கவில்லை
  alternative: வேலையாட்களாக நியமிக்கவில்லை
  rationale: முந்தைய வசனத்தின் கட்டாய உழைப்புச் சூழல், சாதாரண வேலை அல்லது சேவையைக் காட்டிலும் அடிமை நிலையைச் சுட்டுகிறது. எனவே அதன் கடுமையை மென்மைப்படுத்தாத சொல் தேர்ந்தெடுக்கப்பட்டது.
- issue: וַעֲבָדָיו என்பதன் அரசவைப் பொருள்
  choice: அவனுடைய பணியாளர்கள்
  alternative: அவனுடைய அடிமைகள்
  rationale: அதே எபிரெயச் சொல் வேறு சூழலில் வேறு சமூகப் பங்கைச் சுட்டலாம். இங்கு இராணுவ மற்றும் அரச நிர்வாகப் பதவிகளின் பட்டியலில் வருவதால், அரசனுக்குச் சேவை செய்யும் பணியாளர்கள் என்ற பொருள் பொருத்தமானது; முதல் பாதியில் உள்ள அடிமை நிலையும் இங்குள்ள அரசப்பணியும் செயற்கையாக ஒன்றாக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம வரலாற்று நடையும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெயப் பட்டியல் தமிழில் தெளிவாக வாசிக்க இணைநிலை ‘-ஆகவும்’ அமைப்பில் தரப்பட்டுள்ளது; உறுதியற்ற இராணுவப் பதவி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
