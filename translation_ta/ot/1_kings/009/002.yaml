base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: ta
  text: அப்போது யாவே சாலொமோனுக்கு இரண்டாம் முறையாக[a] தோன்றினார்; கிபியோனில் அவருக்குத் தோன்றியிருந்ததைப் போலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும்”; எபிரெய மொழியில் சொல்லர்த்தமாக, “இரண்டாம் முறையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றினார்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு இறைவெளிப்பாட்டுத் தோற்றத்தைக் குறிக்கிறது; ‘தோன்றினார்’ என்பது இயல்பான தமிழாகவும், பின்னர் வரும் அதே வேர்ச்சொல்லுடனான இணைப்பையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் தமிழ்ச் சொல்மாற்றாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: இது நிகழ்வுகளின் வரிசையைத் தெளிவாகக் குறிக்கிறது; ‘மீண்டும்’ என்பதைவிட எபிரெயச் சொல்லின் குறிப்பான பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: போலவே
  rationale: கிபியோனில் நிகழ்ந்த முந்தைய தோற்றத்தோடு ஒப்பிடும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִרְאָה
  choice: தோன்றியிருந்ததை
  rationale: இது முன்னர் கிபியோனில் நிகழ்ந்த தோற்றத்தைக் குறிப்பதால், தமிழில் முன்நிகழ்வைத் தெளிவுபடுத்தும் நிறைவுற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵלָיו
  choice: அவருக்கு
  rationale: אֶל உடன் சேர்ந்த சுட்டுப்பெயர் இங்கு உறவு/நோக்குத் திசையைக் குறிக்கிறது; ‘அவருக்கு’ என்பது மிக நேரடியான இயல்பான தமிழ்.
- source_word: בְּגִבְעוֹן
  choice: கிபியோனில்
  rationale: בְּ என்ற இடப்பொருளைத் தமிழின் ‘-இல்’ வேற்றுமையால் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தோன்றினார்’ என்ற ஒரே சொல்லாக்கம் இரு எபிரெய நிஃபால் வடிவங்களின் இணைப்பைப் பாதுகாக்கிறது; அரைப்புள்ளி முதன்மை நிகழ்வையும் முந்தைய கிபியோன் நிகழ்வுடனான ஒப்பீட்டையும் தெளிவாக இணைக்கிறது.
