  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: ta
  text: நாட்டில் அவர்களுக்குப் பின்னர் மீதியாக இருந்த அவர்களுடைய பிள்ளைகளை—இஸ்ரவேல் மக்கள் அழிவுக்கென அர்ப்பணிக்க[a] முடியாமல் போனவர்களை—சாலொமோன் கட்டாய உழைப்புக்கு உட்படுத்தினான்; அவர்கள் இன்றுவரை அப்படியே இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல்லை “முற்றிலும் அழிக்க” அல்லது “தடையின்கீழ் ஒப்படைக்க” என்றும் மொழிபெயர்க்கலாம். חרם என்பதன் கீழ் மக்களையோ பொருள்களையோ தீர்ப்புக்காக மீளப்பெற முடியாதவாறு அர்ப்பணிப்பதை இந்த வினை குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகள்
  rationale: בֵּן என்பதன் பன்மை இங்கு முந்தைய தலைமுறையினரின் பிள்ளைகள் அல்லது வழிவந்தோர் என்ற விரிவான பொருளைக் கொள்ளலாம். “பிள்ளைகள்” என்பது ஆண்களை மட்டும் குறுக்காமல், அதன் குடும்பத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின் ... எஞ்சியிருந்த
  rationale: முந்தைய தலைமுறைக்குப் பின்னரும் மீந்திருந்தவர்களைக் குறிக்கும் விளைவு மற்றும் காலத் தொடர்பு இரண்டையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: இச்சரித்திரச் சூழலில் אֶרֶץ என்பது பொதுவான ஒரு தேசத்தை மட்டுமல்ல, இஸ்ரவேல்/கானான் நாட்டைக் குறிக்கிறது; நவீன தமிழில் “நாட்டில்” இயல்பாக உள்ளது.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: அழிவுக்கென அர்ப்பணிக்க முடியாமல் போன
  rationale: חרם தொடர்புடைய வினை அழித்தல் மட்டுமன்றி, தீர்ப்புக்காக மீட்க முடியாதவாறு ஒதுக்கி அர்ப்பணித்தல் என்ற கருத்தையும் கொண்டுள்ளது. “அழிவுக்கென அர்ப்பணிக்க” என்பது அதன் அழிவு மற்றும் அர்ப்பணிப்பு ஆகிய இரு கூறுகளையும் பாதுகாக்கிறது.
- source_word: וַיַּעֲלֵם
  choice: அமர்த்தினான்
  rationale: לְמַס עֹבֵד என்பதுடன் வரும் இந்த ஹிஃபில் வடிவம், அவர்களை நிர்வாக ரீதியாகக் கட்டாயப் பணியில் சேர்த்ததைக் குறிக்கிறது. “அமர்த்தினான்” என்பது அந்த காரணவினைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמַס עֹבֵד
  choice: கட்டாய வேலைக்கு
  rationale: מַס என்பது வரியாக விதிக்கப்படும் உழைப்பு அல்லது கட்டாய வேலை; עֹבֵד அதன் வேலைசெய்யும் தன்மையைத் தெளிவாக்குகிறது. “கட்டாய வேலை” என்பது சட்டப்பூர்வ அடிமை நிலையைத் தேவையின்றி சேர்க்காமல் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: அவர்கள் இன்றுவரை அவ்வாறே இருக்கிறார்கள்
  rationale: “இன்றுவரை” என்ற எபிரேயக் கால வாய்பாட்டை இயல்பான முழுத் தமிழ் வாக்கியமாக்குகிறது; கட்டாய வேலை நிலை தொடர்ந்ததையே “அவ்வாறே” சுட்டுகிறது.
theological_decisions:
- issue: வெற்றிகொள்ளல்/தீர்ப்புச் சூழலில் החרים என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென அர்ப்பணிக்க
  alternative: முற்றிலும் அழிக்க; தடைக்கு உட்படுத்தி ஒதுக்கிவைக்க
  rationale: எபிரேயச் சொல் அழிவையும் கடவுளுடைய தீர்ப்புக்கென மீட்க முடியாத அர்ப்பணிப்பையும் ஒன்றாகத் தாங்குகிறது. தேர்ந்த மொழிபெயர்ப்பு அதை வெறும் இராணுவக் கொலையாகச் சுருக்காமலும், புரியாத தொழில்நுட்பச் சொல்லால் மறைக்காமலும் அந்த இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “இஸ்ரவேல் மக்கள்” என்பது பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல் בְּנֵי יִשְׂרָאֵל என்பதன் சமூகப் பொருளைத் தருகிறது. எபிரேயத்தின் நீண்ட தொடர்புச் சொற்றொடரை வாசிப்புத் தெளிவுக்காக இடைக்கோடுகளால் பிரித்துள்ளோம்; இறுதிக் கால வாய்பாடு தமிழில் முழுமையான தொடர்நிலை வாக்கியமாக வழங்கப்பட்டுள்ளது.
