  edition: WLC
  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: ta
  text: எகிப்தின் அரசனான பார்வோன் முன்பு படையெடுத்து வந்து கேசேரைக் கைப்பற்றி, அதைத் தீயிட்டு எரித்தான். அந்த நகரத்தில் குடியிருந்த கானானியர்களைக் கொன்றுவிட்டு, சாலொமோனின் மனைவியான தன் மகளுக்கு அதைக் சீதனமாக[a] கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணத்துடன் தொடர்புடைய பரிசாக.” எபிரெயச் சொல் திருமண உறவின் சூழலில் வழங்கப்படும் கொடையைக் குறிக்கிறது; அதன் துல்லியமான சமூக நடைமுறை தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: முன்பு படையெடுத்துவந்து
  rationale: சாலொமோனின் கட்டுமானப் பணிக்கு முந்திய நிகழ்வை இவ்வாக்கியம் விளக்குவதால் ‘முன்பு’ சேர்க்கப்பட்டது; இராணுவ முன்னேற்றத்தைக் குறிக்கும் சூழல்சார் பொருளை ‘படையெடுத்துவந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: ஒரு நகரை இராணுவ நடவடிக்கையால் பிடித்துக்கொண்டதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: அதைத் தீயிட்டு எரித்தான்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ‘நெருப்பால் எரித்தான்’ என்ற வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: அந்த நகரத்தில் குடியிருந்த கானானியர்களை
  rationale: ஒருமை வடிவம் இங்கு கூட்டுப்பொருளில் நகரின் கானானிய மக்களைக் குறிப்பதால் தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָרָג
  choice: கொன்றுவிட்டு
  rationale: הרג என்பதன் நேரடியான பொருளைப் பேணுகிறது; தொடர்ந்த நிகழ்வுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיִּתְּנָהּ
  choice: அதைக் ... கொடுத்தான்
  rationale: பெண்பால் பின்னொட்டு கேசேர் நகரத்தைக் குறிப்பதைத் தமிழில் சுட்டுப்பெயரால் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שִׁלֻּחִים
  choice: திருமணப் பரிசாக
  rationale: மண உறவின் சூழலில் வழங்கப்படும் பரிசு என்ற பொருளை நவீன வாசகர்களுக்குத் தெளிவாகக் கூறுகிறது; ‘சீதனம்’ என்ற சொல்லின் குறிப்பிட்ட சமூக மற்றும் சட்டப் பொருளை முதன்மை உரையில் திணிப்பதைத் தவிர்க்கிறது.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: சாலொமோனின் மனைவியான தன் மகளுக்கு
  rationale: பார்வோனின் மகளே சாலொமோனின் மனைவி என்ற இடைச்சொல் அடையாளத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
