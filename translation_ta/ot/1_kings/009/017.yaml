source:
  edition: WLC
  text: וַ/יִּ֤בֶן שְׁלֹמֹה֙ אֶת גָּ֔זֶר וְ/אֶת בֵּ֥ית חֹרֹ֖ן תַּחְתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/017.yaml
  text: And Solomon built Gezer and Lower Beth-horon,[a]
translation:
  language: ta
  text: சாலொமோன் கேசேரையும் கீழ் பெத்-ஓரோனையும்[a] கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழேயுள்ள பெத்-ஓரோன்.”
    reason: תַּחְתּוֹן என்ற அடைமொழியை இடப்பெயருக்கு முன் ‘கீழ்’ என்று வழங்குவதற்குப் பதிலாக, அதன் பின் விளக்க அடைமொழியாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: בנה என்பதன் கால் வடிவம் பொதுவாக ‘கட்டினான்’ என்று பொருள்படும். அரச கட்டுமானச் சூழலில் இது மறுகட்டுதல் அல்லது அரணாக்குதலையும் உள்ளடக்கக்கூடும்; எனினும் மூலத்தின் இயல்பான பரந்த பொருளை முதன்மை உரை காக்கிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: גָּזֶר
  choice: கேசேர்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பை நவீன தமிழில் இயன்றவரை அண்மையாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: கீழ் பெத்-ஓரோன்
  rationale: תַּחְתּוֹן என்பது இரண்டு பெத்-ஓரோன் ஊர்களில் கீழ்ப்பகுதியில் இருந்ததை அடையாளப்படுத்துகிறது. ‘கீழ் பெத்-ஓரோன்’ இயல்பான தமிழில் அந்தப் புவியியல் வேறுபாட்டைப் பேணுகிறது.
- source_word: אֶת / וְאֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இவை நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளங்கள்; தமிழ் வாக்கிய அமைப்பில் ‘-ஐ/-ஐயும்’ வேற்றுமை உருபுகளால் அவற்றின் செயல்பாடு வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. இடப்பெயர்கள் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; ‘கட்டினான்’ என்பது மூல வினையின் பொருள் பரப்பைத் தேவையின்றிக் குறுக்காமல் காக்கிறது.
