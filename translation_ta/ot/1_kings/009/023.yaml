  to: 'சாலொமோனுக்கான பணியை மேற்பார்வையிட்ட நியமிக்கப்பட்ட அதிகாரிகளின்[a] தலைவர்கள் இவர்களே: ஐந்நூற்று ஐம்பது பேர். அவர்கள் அந்தப் பணியைச் செய்த மக்கள்மீது அதிகாரம் செலுத்தினார்கள்.[b]'
  rationale: The revision removes the potentially completive sense introduced by “செய்யப்பட்ட,” while retaining the source’s administrative hierarchy, the relation of the work to Solomon, the stated number, and the force of the verb for exercising rule. Footnote markers have been relocated to their respective lexical anchors; footnote content is retained.
