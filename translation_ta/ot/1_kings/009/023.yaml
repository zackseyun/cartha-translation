base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: ta
  text: 'சாலொமோனுக்கான பணியை மேற்பார்வையிட்ட நியமிக்கப்பட்ட அதிகாரிகளின்[a] தலைவர்கள் இவர்களே: ஐந்நூற்று ஐம்பது பேர். அவர்கள் அந்தப் பணியைச் செய்த மக்கள்மீது அதிகாரம் செலுத்தினார்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நியமிக்கப்பட்ட அதிகாரிகள்” என்பதற்கு “மேற்பார்வையாளர்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒரு பொறுப்பில் அமர்த்தப்பட்ட அதிகாரிகளையோ, பிறர்மேல் நியமிக்கப்பட்டவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அதிகாரம் செலுத்தினார்கள்” என்பதற்கு “பொறுப்பேற்று நடத்தினார்கள்” அல்லது “மேற்பார்வையிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை ஆட்சி செய்தல், பொறுப்பு வகித்தல், அதிகாரம் செலுத்துதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: நியமிக்கப்பட்ட அதிகாரிகளின் தலைவர்கள்
  rationale: எபிரெயக் கட்டமைப்பில் שָׂרֵי என்பது ‘தலைவர்கள்’ என்றும், הַנִּצָּבִים என்பது ஒரு பொறுப்பில் நியமிக்கப்பட்ட அதிகாரிகள் என்றும் பொருள்படுகிறது. இரு கூறுகளையும் விடாமல் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: சாலொமோனுக்காகச் செய்யப்பட்ட வேலையை மேற்பார்வையிட்ட
  rationale: ‘வேலையின்மேல் இருந்த’ என்ற மூலப் படிமத்தை, சாலொமோனின் பணிக்குப் பொறுப்பாக இருந்த நிர்வாகச் சூழலில் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: ஐந்நூற்று ஐம்பது பேர்
  rationale: எபிரெய எண்ணிக்கையின் இயல்பான தமிழாக்கம்; மனிதர்களைக் குறிக்கும் என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָרֹדִים
  choice: அதிகாரம் செலுத்தினார்கள்
  rationale: רדה என்பதன் ஆட்சி செய்தல், அதிகாரம் செலுத்துதல் என்ற வலிமையைத் தக்கவைக்கிறது; ‘மேற்பார்வையிட்டார்கள்’ என்பதைவிட மூலத்தின் அதிகாரத் தன்மையை நன்கு வெளிப்படுத்துகிறது.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: அந்த வேலையைச் செய்த மக்கள்மேல்
  rationale: עָם என்பதை ‘மக்கள்’ எனப் பொதுவாகவே வைத்து, தொடர்ந்து வரும் செயப்பெயரெச்சத் தொடர் அவர்கள் வேலை செய்தவர்கள் என்பதை விளக்க அனுமதிக்கிறது.
