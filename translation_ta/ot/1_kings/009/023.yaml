translation_notes:
  register: நவீனத் தரத் தமிழில், நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நியமிக்கப்பட்ட அதிகாரிகளின் தலைவர்கள்’ என்பது எபிரெயக் கட்டமைப்பின் இரு பெயர்ச்சொற்களையும் காக்கிறது; ‘அதிகாரம் செலுத்தினார்கள்’ என்பது רדה வினையின் வலிமையைத் தணிக்காமல் தருகிறது.
