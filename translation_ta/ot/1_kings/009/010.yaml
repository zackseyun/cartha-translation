  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுவான பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘வீடு’ உருவகத்தை வெளிப்படுத்தல்
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் இல்லம்
  rationale: ‘இல்லம்’ மூலச் சொல்லுக்கு நெருக்கமானது; ஆனால் இங்கு குறிக்கப்படுவது ஆலயக் கட்டிடம் என்பதால் ‘ஆலயம்’ சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘இரண்டு மாளிகைகள்’ என்ற முன்சொல் கட்டிட இணைப்பைத் தக்கவைக்கிறது.
