revisions:
- from: ஆனால் பார்வோனின் மகள், தாவீதின் நகரத்திலிருந்து தனக்காக அவன் கட்டியிருந்த மாளிகைக்குச் சென்றாள். அதன் பிறகு அவன் மில்லோவைக்[a] கட்டினான்.
  to: ஆனால் பார்வோனின் மகள் தாவீதின் நகரத்திலிருந்து தனக்காக அவன் கட்டியிருந்த வீட்டிற்கு மேலே சென்றாள். அதன் பிறகு அவன் மில்லோவைக்[a] கட்டினான்.
  rationale: The revision restores the explicit ‘upward’ movement in עָלְתָה and replaces the interpretively narrow “மாளிகை” with “வீடு,” preserving the source’s ordinary term and its contextual ambiguity. The Millo is retained as a transliteration, with a smoother and still noncommittal lexical note.
