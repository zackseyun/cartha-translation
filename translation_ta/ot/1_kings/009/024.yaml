base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: ta
  text: ஆனால் பார்வோனின் மகள் தாவீதின் நகரத்திலிருந்து தனக்காக அவன் கட்டியிருந்த வீட்டிற்கு மேலே சென்றாள். அதன் பிறகு அவன் மில்லோவைக்[a] கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிரப்புக் கட்டு” அல்லது “படித்தளங்கள்.” “மில்லோ” என்ற எபிரெயச் சொல் கோட்டை அமைப்பையோ, மண்ணால் நிரப்பப்பட்ட தாங்கு அமைப்பையோ, படித்தள அமைப்பையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: சுற்றியுள்ள நிகழ்வுகளுடன் தொடர்புடைய மாறுபாடு அல்லது மாற்றத்தைச் சுட்டும் இடைச்சொல்லாக இருப்பதால், இயல்பான தமிழில் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּת פַּרְעֹה
  choice: பார்வோனின் மகள்
  rationale: எபிரெயக் கூட்டுப்பெயரின் உறவுமுறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עָלְתָה
  choice: சென்றாள்
  rationale: எபிரெயச் சொல் சொற்பட ‘மேலே சென்றாள்’ எனப் பொருள்பட்டாலும், இலக்கு நோக்கிய நகர்வை நவீன தமிழில் இயல்பாகக் கூற ‘சென்றாள்’ பயன்படுத்தப்பட்டது; உயர்நில நகர்வு இங்கு மையப் பொருள் அல்ல.
- source_word: מֵעִיר דָּוִד
  choice: தாவீதின் நகரத்திலிருந்து
  rationale: இடப்பெயரையும் ‘இருந்து’ என்ற மூல முன்னிடைச்சொல்லின் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶל בֵּיתָהּ
  choice: தனக்காக ... கட்டியிருந்த மாளிகைக்கு
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; ஆனால் அரச குடும்பச் சூழலிலும் சாலொமோன் கட்டிய தனிக் குடியிருப்பைக் குறிக்கும் நிலையிலும் ‘மாளிகை’ நவீன தமிழில் இயல்பானது.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: தனக்காக அவன் கட்டியிருந்த
  rationale: அவள் அங்கு செல்வதற்கு முன்பே கட்டிடம் கட்டப்பட்டிருந்த நிகழ்வுவரிசையை ‘கட்டியிருந்த’ தெளிவாகக் காட்டுகிறது; ‘அவன்’ என்பதன் குறிப்பு மூலத்தில் வெளிப்படையாகப் பெயரிடப்படவில்லை.
- source_word: אָז
  choice: அதன் பிறகு
  rationale: நிகழ்வுகளின் காலவரிசையை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: בָּנָה
  choice: கட்டினான்
  rationale: எளிய நிறைவுற்ற செயலைக் காட்டுகிறது; ‘கட்டத் தொடங்கினான்’ போன்ற ஆதாரமற்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: הַמִּלּוֹא
  choice: மில்லோ
  rationale: எருசலேமிலிருந்த குறிப்பிட்ட கட்டுமானம் அல்லது நிலத்தாங்கு அமைப்பைக் குறிக்கும் விவாதத்திற்குரிய தொழில்நுட்பப் பெயர் என்பதால், அதன் சரியான வடிவத்தைத் தீர்மானிக்காமல் ஒலிபெயர்ப்பு பாதுகாக்கப்பட்டது.
