theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களைக் குறிக்கும் பாலினச் சொற்றொடர்
  choice: இஸ்ரவேலரைச் சேர்ந்தவர்கள் அல்ல
  alternative: இஸ்ரவேலின் மகன்களில் சேர்ந்தவர்கள் அல்ல
  rationale: இங்கு ‘மகன்கள்’ என்பது ஆண்களை மட்டும் பிரித்துக் காட்டாமல் இஸ்ரவேல் மக்களை வம்ச/இன அடையாளத்தால் குறிக்கிறது. ஆகவே பிரதான உரையில் இயல்பான கூட்டுப் பொருள் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: הֵמָּה என்ற தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தல்
  choice: இவர்கள்
  alternative: தனியாக மொழிபெயர்க்காமல் விடுதல்
  rationale: சுட்டுப்பெயரை வெளிப்படையாக மொழிபெயர்ப்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; இறுதிக் கோடு அடுத்த வசனத்தில் தொடரும் இலக்கண அமைப்பையும் காட்டுகிறது.
translation_notes:
