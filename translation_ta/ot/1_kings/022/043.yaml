  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: ta
  text: அவன் தன் தந்தை ஆசாவின் வழியை முற்றிலும் பின்பற்றினான்[a]; அதை விட்டு விலகவில்லை; யாவேயின் பார்வையில் சரியானதைச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் தந்தை ஆசாவின் முழு வழியிலும் நடந்தான்” அல்லது “அவன் தன் தந்தை ஆசாவின் வழியை முழுமையாகப் பின்பற்றினான்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “யாவேயின் கண்களில்”; இது யாவேயின் மதிப்பீட்டில் அல்லது பார்வையில் என்பதைக் குறிக்கும் மொழிமரபாகும்.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: வழியிலெல்லாம் நடந்தான்
  rationale: הלך என்பதன் ‘நட/செல்’ என்ற அடிப்படை உருவகத்தையும், דֶּרֶךְ குறிக்கும் வாழ்க்கை நடத்தை அல்லது வழிமுறையையும் இயல்பான தமிழில் பாதுகாக்கிறது. எபிரெயில் ‘வழி’ ஒருமையில் இருந்தாலும், ‘வழியிலெல்லாம்’ என்பது அதன் முழுமையைக் காட்டுகிறது.
- source_word: אָסָא אָבִיו
  choice: தன் தந்தை ஆசாவின்
  rationale: உறவையும் பெயரையும் நவீனத் தமிழின் இயல்பான சொல் வரிசையில் தெளிவாக வழங்குகிறது.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: அதைவிட்டு விலகாமல்
  rationale: סור என்பதன் ‘விலகு/வழிதவறு’ என்ற பொருளைத் தருவதோடு, முன்னுள்ள ஒருமை ‘வழி’யைக் குறிக்கும் பின்னொட்டையும் ‘அதை’ எனப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: நேர்மையானதைச் செய்தான்
  rationale: ‘சரியானதை/நேரானதைச் செய்’ என்ற அரசர்களை மதிப்பிடும் வழக்குச் சொல்லை கண்ணியமான, புரிந்துகொள்ளக்கூடிய தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: சொல்லர்த்தமான ‘கண்களில்’ என்ற உருவகத்தின் கருத்தான தெய்வீக மதிப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: அரசனுடைய நடத்தையை மதிப்பிடும் வாய்பாடு
  choice: தன் தந்தை ஆசாவின் வாழ்க்கை வழியிலிருந்து விலகாமல், யெகோவாவின் பார்வையில் நேர்மையானதைச் செய்தான் என்ற மதிப்பீட்டை நேரடியாகப் பாதுகாத்தல்
  alternative: இதைப் பொதுவாக ‘அவன் உண்மையுள்ள நல்ல அரசனாக வாழ்ந்தான்’ என்று விரிவாகப் பொருளுரைத்தல்
  rationale: மூலவசனம் அரசாட்சியைப் பற்றிய விரிவான இறையியல் முடிவைச் சொல்லாமல், வழி, விலகாமை, யெகோவாவின் பார்வையில் நேர்மை ஆகிய குறிப்பிட்ட உருவகங்களால் மதிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழி—நடத்தல்—விலகுதல்’ என்ற மூல உருவகத் தொடர்ச்சி இயன்றவரை காக்கப்பட்டுள்ளது; ‘பார்வையில்’ என்பது எபிரெய ‘கண்களில்’ என்ற மொழிமரபை இயல்பாகத் தருகிறது.
