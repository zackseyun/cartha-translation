  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/בֹ֣א בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּב֖וֹא בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் யோசபாத்திடம், “நான் மாறுவேடம் பூண்டு போருக்குச் செல்வேன்[a]; நீரோ உமது உடைகளை அணிந்துகொள்ளுங்கள்” என்றான். பின்னர் இஸ்ரவேலின் அரசன் மாறுவேடம் பூண்டு போருக்குச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைவடிவத்தை, “நீ மாறுவேடம் பூண்டு போருக்குச் செல்” என்ற கட்டளையாகவும் வாசிக்கலாம். ஆனால் அடுத்த வாக்கியத்தில் இஸ்ரவேலின் அரசனே மாறுவேடம் பூண்டதாகக் கூறப்படுவதால், “நான் மாறுவேடம் பூண்டு போருக்குச் செல்வேன்” என்ற பொருள் இங்கு சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבֹא
  choice: நான் மாறுவேடம் பூண்டு போருக்குச் செல்வேன்
  rationale: முதல் வினைவடிவம் தனியாகப் பார்க்கும்போது இரண்டாம் நபர் கட்டளையாகப் புரிந்துகொள்ளப்படலாம். ஆனால் அடுத்துள்ள ‘நீரோ’ என்ற முரண்பாட்டுச் சுட்டும், பின்னர் அரசனே மாறுவேடம் பூண்டான் என்ற விவரமும், இது அரசன் தன் திட்டத்தைச் சொல்வதாகப் புரிந்துகொள்ள வலுவாக ஆதரிக்கின்றன.
- source_word: בַמִּלְחָמָה
  choice: போருக்கு
  rationale: בוא என்ற இயக்க வினையுடன் சேர்ந்து, போர்க்களச் செயலுக்குள் செல்வதைக் காட்டுகிறது; நவீனத் தமிழில் ‘போருக்குச் செல்வது’ இயல்பான நடை.
- source_word: וְאַתָּה
  choice: நீரோ
  rationale: வலியுறுத்தப்பட்ட தனிப்பெயர் அரசனின் மாறுவேடத்துக்கும் யோசபாத்தின் வெளிப்படையான அரச ஆடைக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது. ‘நீர்’ மரியாதையான ஒருமையைப் பேணுகிறது.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: உமது அரச உடைகளை அணிந்துகொள்ளும்
  rationale: בְּגָדִים பொதுவாக உடைகளைக் குறித்தாலும், இச்சூழலில் யோசபாத்தை அரசனாகத் தெளிவாக அடையாளப்படுத்தும் ஆடைகளே கருத்தில் உள்ளன; ‘அரச உடைகள்’ அந்தச் சூழல்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתְחַפֵּשׂ
  choice: மாறுவேடம் பூண்டு
  rationale: அரசன் தன் அடையாளம் தெரியாதபடி வேறு தோற்றம் எடுத்ததை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: போருக்குச் சென்றான்
  rationale: முன்னர் கூறிய திட்டத்தின் சொற்தொடர்பைத் தக்கவைத்தபடி, நிகழ்ந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: הִתְחַפֵּשׂ என்பதன் நபர் குறித்த இலக்கண–சூழல் இழுபறி
  choice: முதன்மை உரையில் ‘நான் மாறுவேடம் பூண்டு... செல்வேன்’
  alternative: ‘நீ மாறுவேடம் பூண்டு போருக்குச் செல்’
  rationale: எழுத்துவடிவம் கட்டளையாக வாசிக்க இடமளித்தாலும், உடன்வரும் ‘நீரோ உமது ... உடைகளை அணிந்துகொள்ளும்’ என்பதும், அரசனே மாறுவேடம் பூண்டதாக அடுத்த வாக்கியம் கூறுவதும் முதல் நபர் நோக்கத்தை ஆதரிக்கின்றன. மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசர்களுக்கிடையிலான நேரடி உரையில் ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளன; ‘மாறுவேடம் பூண்டு’ என்பது பொதுவாகப் புரியும் இயல்பான சொற்றொடர்.
