base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் யோசபாத்திடம், “அவன் என்னைக் குறித்து நன்மையான இறைவாக்கு உரைக்க மாட்டான்; தீமையை[a] மட்டுமே உரைப்பான் என்று நான் உங்களிடம் சொல்லவில்லையா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரழிவை.” எபிரெயத்தில் சொல்லுக்கு சொல் “நன்மை ... தீமை மட்டுமே” என்று உள்ளது. இங்குள்ள இந்தக் கூர்மையான முரண், சாதகமற்ற அல்லது பேரழிவை அறிவிக்கும் இறைவாக்கைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ காட்டுகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: பேசுபவரை எபிரெய மூலத்தைப் போலவே பதவிப்பெயரால் குறிப்பிடுகிறது; ‘ஆகாப்’ என்ற பெயர் சேர்க்கப்படவில்லை.
- source_word: אֶל יְהוֹשָׁפָט
  choice: யோசபாத்திடம்
  rationale: நேரடியாக யாரிடம் பேசப்பட்டது என்பதை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத அரச பட்டம் சேர்க்கப்படவில்லை.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: நான் உங்களிடம் சொல்லவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் கண்டிப்புத் தொனியுள்ள எதிர்மறை வினாவைத் தெளிவாகத் தருகிறது. யோசபாத்தை நோக்கிய மரியாதை ஒருமையை நவீன தமிழின் ‘உங்களிடம்’ வெளிப்படுத்துகிறது.
- source_word: לֹא יִתְנַבֵּא
  choice: இறைவாக்காக உரைப்பான்
  rationale: נבא வினையின் தீர்க்கதரிசனச் செயலை இயல்பாகக் குறிக்கிறது; முந்தைய ‘சொன்னேன்’ என்பதற்குள் எதிர்பார்க்கப்பட்ட தொடர்ச்சியான நடத்தை என்ற நுணுக்கத்தை எதிர்கால வடிவம் தக்கவைக்கிறது.
- source_word: עָלַי
  choice: என்னைக் குறித்து
  rationale: பேச்சு அல்லது இறைவாக்கின் பொருளைக் குறிக்கும் עַל என்பதன் சூழல்சார் பொருளை நேராகத் தருகிறது.
- source_word: טוֹב
  choice: நன்மையை
  rationale: பெயர்ச்சொல் போலப் பயன்படும் பெயரடையின் ‘நல்லது/நன்மை’ என்ற பொதுப் பொருளைத் தக்கவைத்து, எதிரிலுள்ள ‘தீமை’ என்பதுடன் உள்ள வலுவான முரணையும் காக்கிறது.
- source_word: כִּי אִם
  choice: அல்ல, ... மட்டுமே
  rationale: மறுப்புக்குப் பின் வரும் தனிப்படுத்தும் முரணை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רָע
  choice: தீமையை
  rationale: טוֹב–רָע என்ற ‘நன்மை–தீமை’ நேர்முரணைத் தக்கவைக்கிறது; இச்சூழலில் ‘பேரழிவு’ அல்லது பாதகமான செய்தி என்பது சாத்தியமான விளக்கம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ரָע என்ற சொல்லை அரசனின் இறைவாக்குக் குற்றச்சாட்டில் மொழிபெயர்த்தல்
  choice: தீமை
  alternative: பேரழிவு
  rationale: அரசன் தனக்குச் சாதகமான இறைவாக்கை மீகாயா உரைப்பதில்லை என்று குற்றஞ்சாட்டும் இடத்தில் טוֹב மற்றும் רָע நேர்முரணாக வருகின்றன. ‘தீமை’ அந்த மூல முரணையும் அதன் பரந்த பொருளையும் காக்கிறது; ‘பேரழிவு’ சூழலுக்கு ஏற்றதாக இருந்தாலும் அதிகக் குறிப்பான விளக்கம் என்பதால் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, நிலையான, கண்ணியமான தமிழில் அமைக்கப்பட்டுள்ளது. மரபுவழிப் பயன்பாட்டை முற்றிலும் கைவிடாமல், பொதுவாசகருக்கு தெளிவாக இருக்க ‘இறைவாக்காக உரைப்பான்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘தீமையை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
