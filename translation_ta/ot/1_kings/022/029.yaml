translation:
  language: ta
  text: இஸ்ரவேலின் அரசனும் யூதாவின் அரசனான யோசபாத்தும் ராமோத்-கீலேயாத்துக்கு ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்.’ இங்கு இரு அரசர்களும் ஓர் இடத்தை நோக்கிப் படையெடுத்துச் செல்லும் சூழலில், தமிழில் இயல்பான ‘புறப்பட்டுச் சென்றார்கள்’ என்பதைத் தேர்ந்தெடுத்தோம்; ‘படையெடுத்தார்கள்’ என்று மொழிபெயர்த்து இராணுவ நுட்பத்தைச் சொல்லுக்குள் அதிகமாகச் சேர்க்கவில்லை.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: மூலத்தில் ஆகாபின் பெயருக்குப் பதிலாக அரசப் பட்டமே உள்ளது; அதைப் பாதுகாக்கிறது.
- source_word: וִיהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரான יְהוֹשָׁפָט என்பதற்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான
  rationale: யோசபாத்தை விளக்கும் இணைநிலைப் பட்டத்தை இயல்பான தமிழ் தொடராக வழங்குகிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்
  rationale: இது ‘கீலேயாத்தின் ராமோத்’ எனப் பொருள்படும் கூட்டிடப்பெயர். நவீனத் தமிழில் இடத்தின் தொடர்பைத் தெளிவாகக் காட்ட ‘கீலேயாத்திலுள்ள ராமோத்’ என வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வினை ஒருமையில் இருந்தாலும், கூட்டெழுவாயைக் கருத்தில் கொண்டு இயல்பான தமிழ் இலக்கணப்படி பன்மை வினை பயன்படுத்தப்பட்டது.
