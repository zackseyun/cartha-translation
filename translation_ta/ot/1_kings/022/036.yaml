translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணை அமைப்பும் ஆண்பால் இராணுவச் சூழலும் காக்கப்பட்டுள்ளன; ஆனால் வினையில்லாத மூல அறிவிப்பு தமிழில் தெளிவாக இருக்க “திரும்பட்டும்” சேர்க்கப்பட்டுள்ளது.
