source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר הָ/רִנָּה֙ בַּֽ/מַּחֲנֶ֔ה כְּ/בֹ֥א הַ/שֶּׁ֖מֶשׁ לֵ/אמֹ֑ר אִ֥ישׁ אֶל עִיר֖/וֹ וְ/אִ֥ישׁ אֶל אַרְצֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: ta
  text: 'சூரியன் மறையும் வேளையில், பாளயமெங்கும் ஒரு முழக்கம்[a] பரவியது: “ஒவ்வொருவனும் தன் நகரத்துக்கு; ஒவ்வொருவனும் தன் நாட்டுக்கு!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முழக்கம்” என்பதற்கு “கூக்குரல்” அல்லது “உரத்த அறிவிப்பு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாளயம் முழுவதும் கேட்கும்படியான உரத்த குரலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: பரவியது
  rationale: עבר என்ற வினை கூக்குரல் பாளயத்தினூடே சென்றதைச் சுட்டுகிறது. தமிழில் செய்தியோ கூக்குரலோ எல்லாரிடமும் சென்றடைந்ததைக் கூற “பரவியது” இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: הָרִנָּה
  choice: ஒரு கூக்குரல்
  rationale: רִנָּה என்பது உரத்த குரல் அல்லது முழக்கத்தைக் குறிக்கலாம். இங்கு மகிழ்ச்சி ஆரவாரம் அல்ல, பாளயம் முழுவதற்குமான அறிவிப்பு என்பதால் “கூக்குரல்” நடுநிலையாகப் பொருந்துகிறது.
- source_word: בַּמַּחֲנֶה
  choice: பாளயமெங்கும்
  rationale: சொல்லளவில் “பாளயத்தில்” என்றாலும், עבר என்பதுடன் சேர்ந்து கூக்குரல் பாளயம் முழுவதும் சென்றதைக் குறிக்கிறது; “பாளயமெங்கும்” அந்த இயக்கத்தையும் பரவலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறையும் வேளையில்
  rationale: “சூரியன் வருதல்/உட்புகுதல்” என்ற எபிரெய மரபுத்தொடர் சூரிய மறைவைக் குறிக்கிறது. இந்தத் தமிழாக்கம் காலத்தையும் நிகழ்ந்துகொண்டிருந்த சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: அறிவிப்பின் உள்ளடக்கத்தை நேரடி மேற்கோளாகத் தொடரும் இரட்டைப்புள்ளி
  rationale: לֵאמֹר அடுத்து வரும் சொற்களை கூக்குரலின் உள்ளடக்கமாக அறிமுகப்படுத்துகிறது. தமிழில் “என்று சொல்லி” என்பதைக் காட்டிலும் இரட்டைப்புள்ளியுடன் நேரடி மேற்கோள் இயல்பாக உள்ளது.
- source_word: אִישׁ ... וְאִישׁ
  choice: ஒவ்வொருவனும் ... ஒவ்வொருவனும்
  rationale: இருமுறை வரும் אִישׁ பகிர்ந்தளிக்கும் வலியுறுத்தலைக் கொண்டுள்ளது. இது போர்வீரர்களுக்கான பாளய அறிவிப்பு என்பதால் ஆண்பால் வடிவமும் மீளுரையும் காக்கப்பட்டுள்ளன.
- source_word: אֶל עִירוֹ
  choice: தன் நகரத்திற்கு
  rationale: עִיר என்பதன் நேரான பொருள் “நகரம்”; உடைமைப் பின்னொட்டு “தன்” எனத் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: ஒவ்வொருவனும் தன் நாட்டிற்கு
  rationale: אֶרֶץ இங்கு ஒருவனுடைய சொந்த நிலப்பகுதி அல்லது நாடு என்ற விரிந்த பொருளைக் கொண்டுள்ளது. “நாடு” அந்த விரிவைக் காத்து “நகரம்” என்பதுடன் உள்ள இணை அமைப்பையும் பேணுகிறது.
