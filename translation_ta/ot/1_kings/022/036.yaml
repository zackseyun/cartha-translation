  to: 'சூரியன் மறையும் வேளையில், பாளயமெங்கும் ஒரு முழக்கம்[a] பரவியது: “ஒவ்வொருவனும் தன் நகரத்துக்கு; ஒவ்வொருவனும் தன் நாட்டுக்கு!”'
  rationale: The revision removes the supplied verb so that the Tamil quotation retains the Hebrew’s verbless, formulaic dismissal. It also uses the more neutral “முழக்கம்” for the camp-wide cry. Footnote b is retained as a cultural explanation but no longer claims that a non-source verb has been added for clarity.
