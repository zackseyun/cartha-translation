base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: ta
  text: சமாரியாவின் குளத்தருகே அந்தத் தேரைக் கழுவினார்கள். நாய்கள் அவனுடைய இரத்தத்தை நக்கின; பாலியல் தொழிலாளிகளும் அங்கே கழுவினார்கள்[a]. இவ்வாறு, யாவே உரைத்திருந்த வார்த்தையின்படியே நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாலியல் தொழிலாளிகளும் அங்கே தங்களைக் கழுவிக்கொண்டார்கள்,” அல்லது “குளித்தார்கள்.” எபிரெய வினை எதைக் கழுவினார்கள் என்பதை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: அவர்கள் கழுவினார்கள்
  rationale: எபிரெய வினை இலக்கணத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், செய்பவர் குறிப்பிடப்படாத இச்சூழலில் தமிழில் இயல்பான பொதுப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: הָרֶכֶב
  choice: அந்தத் தேர்
  rationale: சூழலில் ஆகாபின் இரத்தம் படிந்த குறிப்பிட்ட போர்த்தேரைக் குறிக்கும் ஒருமைச் சொல்.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: சமாரியாவின் குளத்தருகே
  rationale: עַל இங்கு குளத்தின் அருகிலுள்ள இடத்தைக் குறிக்கிறது; தமிழில் ‘குளத்தருகே’ இயல்பாக உள்ளது.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת דָּמוֹ
  choice: நாய்கள் அவனுடைய இரத்தத்தை நக்கின
  rationale: நக்குதல் அல்லது நாவால் பருகுதல் என்ற தெளிவான காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וְהַזֹּנוֹת
  choice: பாலியல் தொழிலாளிகளும்
  rationale: זוֹנָה என்பதற்கான துல்லியமான, தற்போதைய தமிழ்ச் சொல்; இழிவுபடுத்தும் அல்லது தொன்மையான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: רָחָצוּ
  choice: அங்கே குளித்தார்கள்
  rationale: வினைக்கு வெளிப்படையான செயப்படுபொருள் இல்லை. இங்கு செய்பவர்கள் தங்களைக் கழுவினர் அல்லது குளித்தனர் என்னும் இயல்பான வாசிப்பைத் தருகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: யெகோவா உரைத்திருந்த வார்த்தையின்படியே
  rationale: தீர்க்கதரிசன நிறைவேற்றச் சூத்திரத்தைப் பேணுகிறது; יְהוָה என்ற திருப்பெயர் தமிழில் வழக்கமான ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது.
- issue: וְהַזֹּנוֹת רָחָצוּ என்பதன் பொருள்
  choice: பாலியல் தொழிலாளிகளும் அங்கே குளித்தார்கள்
  alternative: பாலியல் தொழிலாளிகளும் அங்கே கழுவினார்கள்; அவர்கள் தங்களைக் கழுவிக்கொண்டார்கள்
  rationale: பெயர்ச்சொல்லை வினையின் எழுவாயாக வைத்தும், வினையின் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள் சார்ந்த தெளிவின்மையை அடிக்குறிப்பில் குறிப்பிட்டும் மூலத்தின் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், மூலத்தின் சுருக்கமும் தீர்க்கதரிசன நிறைவேற்றத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
