id: 1KI.22.9
reference: 1 Kings 22:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் ஓர் அரண்மனை அதிகாரியை[a] அழைத்து, “இம்லாவின் மகன் மீகாயாவை விரைவாக அழைத்து வா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான சாரீஸ் என்பதற்கு ‘அண்ணகன்’ என்றும், பொதுவாக ‘அரண்மனை அதிகாரி’ என்றும் பொருள் இருக்கலாம். இங்கு பதவிசார் பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: கதைச் சூழலில் קרא என்பது ஒருவரை அழைப்பதையோ வரவழைப்பதையோ குறிக்கிறது. தமிழில் ‘அழைத்து’ என்பது அடுத்துவரும் பேச்சுவினையுடன் இயல்பாக இணைகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: אֶל סָרִיס אֶחָד
  choice: ஓர் அரண்மனை அதிகாரியை
  rationale: סָרִיס என்பதற்கு ‘அலி’ என்ற நேரடிப் பொருளும் ‘அரசவை/அரண்மனை அதிகாரி’ என்ற பதவிசார் பொருளும் உண்டு. இங்கு அவனுடைய பணியே முன்னிலைப்படுவதால் ‘அரண்மனை அதிகாரி’ தெளிவான முதன்மை மொழிபெயர்ப்பு; மற்ற பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מַהֲרָה
  choice: சீக்கிரமாக அழைத்து வா
  rationale: מַהֲרָה அவசரத்தைத் தெரிவிக்கிறது. எபிரெயத்தில் அழைத்துவரும் செயல் சூழலால் உணர்த்தப்பட்டாலும், இயல்பான தமிழில் ‘அழைத்து வா’ என வெளிப்படுத்துவது கட்டளையின் பொருளைத் தெளிவாக்குகிறது.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶן יִמְלָה
  choice: இம்லாவின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரெயத் தொடரை இயல்பான தமிழில் வழங்குகிறது.
