translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசவைக் கதைநடைக்கு ஏற்ற ‘அரசன்’, ‘அரண்மனை அதிகாரி’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெயத்தின் சுருக்கமான அவசரக் கட்டளை தமிழில் தெளிவாகப் புரியுமாறு வழங்கப்பட்டுள்ளது.
