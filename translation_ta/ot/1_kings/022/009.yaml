    issue: Personal name spelling
    rationale: The Hebrew מִיכָיְהוּ begins with a long /i/ vowel. “மீகாயா” is a closer transliteration and the conventional Tamil biblical form.
  - severity: low
    issue: Register and lexical-note precision
    rationale: “விரைவாக” better matches formal narrative style than “சீக்கிரமாக.” In the footnote, “அண்ணகன்” identifies the historical sense ‘eunuch’ more precisely and avoids ambiguity associated with “அலி” in modern Tamil.
