source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ta
  text: 'தீர்க்கதரிசிகள் அனைவரும் இவ்வாறே தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்: “ராமோத்-கிலேயாத்துக்குப் போய் வெற்றிபெறுங்கள்[a]; யாவே அதை அரசனின் கையில் கொடுப்பார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செழியுங்கள்.”
    reason: צלח என்ற வினை வெற்றிபெறுதல் அல்லது செழித்தல் என்ற பொருளையும் தரக்கூடியதால், மாற்றுப் பொருள் குறிப்பிடப்பட்டுள்ளது.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: தீர்க்கதரிசிகள் அனைவரும்
  rationale: கூட்டுமொத்தத் தீர்க்கதரிசிகளையும் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: נִבְּאִים
  choice: தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்
  rationale: பங்கேற்புவினை வடிவம் அப்போது தொடர்ந்து நடைபெற்றுக்கொண்டிருந்த செயலைக் காட்டுவதால் தொடர்நிலை வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: அவர்கள் அனைவரும் ஒரே விதமாக உரைத்ததைச் சுருக்கமாகவும் இயல்பாகவும் சுட்டுகிறது.
- source_word: עֲלֵה
  choice: போய்
  rationale: மூலத்தின் ‘மேலே போ’ என்ற அடிப்படைப் பொருளை, தமிழில் இலக்கை நோக்கிச் செல்லும் இயல்பான கட்டளையாகத் தருகிறது; உரையில் வெளிப்படையாக இல்லாத ‘தாக்குங்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்
  rationale: கூட்டுப் புவிப்பெயரின் இரு கூறுகளையும் தெளிவாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְ/הַצְלַח
  choice: வெற்றிபெறுங்கள்
  rationale: צלח என்பதன் இச்சூழலுக்குரிய வெற்றிகரமான முடிவைச் சுருக்கமாகக் காட்டுகிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וְ/נָתַן
  choice: கொடுப்பார்
  rationale: வாவ் இணைப்புடன் வரும் வினையை உறுதியான எதிர்கால வாக்காகக் காக்கிறது; தமிழில் தனி வாக்கியப் பிரிப்பு இணைப்பின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகக் காக்கிறது.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: அரசனின் கையில்
  rationale: ஒருவரது அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘கை’ உருவகத்தைத் தமிழிலும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: தீர்க்கதரிசிகளின் கூற்றின் உண்மைநிலையை மொழிபெயர்ப்பில் மதிப்பிடுதல்
  choice: தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்
  alternative: பொய்த்தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: இந்த வசனம் அவர்களது பேச்சைத் ‘தீர்க்கதரிசித்தல்’ என்றே விவரிக்கிறது; அருகிலுள்ள கதைக்களத்தின் அடிப்படையில் மொழிபெயர்ப்புக்குள்ளேயே ‘பொய்’ என்ற மதிப்பீட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசனை நோக்கிய ஒருமைக் கட்டளை தமிழின் மரியாதைப் பன்மை வடிவமான “போய் வெற்றிபெறுங்கள்” என்று தரப்பட்டுள்ளது. தொடர்நிலைச் செயலும் ‘கை’ உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
