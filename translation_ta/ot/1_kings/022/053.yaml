source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்; தன் தந்தையின் வழியிலும், தன் தாயின் வழியிலும், இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாமின் வழியிலும் நடந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்து
  rationale: עשה + הרע என்ற எபிரெய மரபுத்தொடர், ‘தீமையானதைச் செய்தான்’ என்ற பொருளைத் தருகிறது; தமிழில் இயல்பாகவும் மூலத்தின் ஒழுக்க மதிப்பீட்டைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற சொல்லுக்குச் சொல் வடிவத்தை விட, எபிரெய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தையும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் எபிரெய மெய்யெழுத்து வடிவமான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்தான்
  rationale: வாழ்க்கை நடத்தை குறிக்கும் ‘வழியில் நடத்தல்’ என்ற மூல உருவகத்தையும் மும்முறை வரும் அமைப்பையும் காக்கிறது.
- source_word: אָבִיו ... אִמּוֹ
  choice: தன் தந்தை ... தன் தாய்
  rationale: இரு பெற்றோரையும் தனித்தனியாகக் குறிப்பிடும் மூலத்தின் வலியுறுத்தலை அப்படியே காக்கிறது; எதிரெதிர் உடைமைத் தெளிவுக்காக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: חטא என்பதன் ஹிஃபீல் வினைவடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகக் காக்கிறது; ‘பாவத்திற்கு வழிநடத்திய’ என்பதைவிட மூல வடிவுக்கு நெருக்கமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக இருப்பதால், அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: அரசனின் தீய செல்வாக்கின் காரணவினை
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  alternative: இஸ்ரவேலைப் பாவத்திற்கு வழிநடத்திய
  rationale: மாற்று வாசகம் பொறுப்பின் செயல்முறையை மென்மையாக்கக்கூடும்; தேர்ந்த வாசகம் எபிரெய காரணவினையின் வலிமையைப் பாதுகாக்கிறது, ஆனால் இஸ்ரவேலரின் சொந்த ஒழுக்கப் பொறுப்பைப் பற்றி உரை கூறாததைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ‘வழி’ மும்முறை வருவது நோக்கமுள்ள இணை அமைப்பு என்பதால் தமிழிலும் மீளுரைப்பாகக் காக்கப்பட்டுள்ளது. வசனத்தின் நீண்ட ஒருங்கிணைந்த வாக்கிய அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
