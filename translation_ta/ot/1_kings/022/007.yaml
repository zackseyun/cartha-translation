source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: ta
  text: ஆனால் யோசபாத், “யாவேயின் தீர்க்கதரிசி ஒருவர் இன்னும்[a] இங்கே இல்லையா? நாம் அவரிடம் விசாரிக்கலாமே?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வேறொரு தீர்க்கதரிசி இங்கே இல்லையா? நாம் அவரிடம் விசாரிக்கலாமே?”
    reason: עוֹד என்பதற்கு ‘இன்னும்/எஞ்சியிருக்கும்’ என்றும், சூழலில் ‘வேறொரு/கூடுதல்’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்றை பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய தீர்க்கதரிசிகளின் பதிலில் யோசபாத் திருப்தியடையாத சூழலில் எதிர்மாற்றத்தைத் தெளிவாகக் காட்ட ‘ஆனால்’ இயல்பாக உள்ளது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: הַאֵין
  choice: இல்லையா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எதிர்மறைக் கேள்வியின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: פֹּה
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடைச்சொல்லின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: נָבִיא לַיהוָה
  choice: யாவேயின் தீர்க்கதரிசி
  rationale: לְ இங்கு யாவேக்கு உரியவர் அல்லது அவருக்காகப் பேசுபவர் என்ற உறவைச் சுட்டுகிறது; ‘யாவேயின் தீர்க்கதரிசி’ தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עוֹד
  choice: இன்னும் யாராவது
  rationale: ஏற்கெனவே அழைக்கப்பட்டவர்களைத் தவிர, எஞ்சியிருக்கும் கூடுதல் தீர்க்கதரிசி ஒருவர் உண்டா என்ற சூழல்சார்ந்த பொருளைத் தெரிவிக்கிறது; ‘வேறொரு’ என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְנִדְרְשָׁה
  choice: நாம் ... விசாரிப்பதற்கு
  rationale: முதல் நபர் பன்மை விருப்பவினையின் நோக்கம் அல்லது விருப்ப நுட்பத்தை, கேள்வியுடன் இயல்பாக இணைக்கிறது.
- source_word: מֵאוֹתוֹ
  choice: அவரிடம்
  rationale: எபிரெயத்தில் சொற்பட ‘அவரிடமிருந்து’ என்றாலும், ஒரு தீர்க்கதரிசியிடம் இறைவாக்கை விசாரிப்பதைத் தமிழில் ‘அவரிடம் விசாரிப்பது’ இயல்பாகவும் பொருள்துல்லியமாகவும் கூறுகிறது.
theological_decisions:
- issue: இறைப்பெயர் יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதைப் பெயராகவே காட்டும் தமிழ் ஒலிபெயர்ப்பு; பட்டப்பெயராக மாற்றுவதையோ ‘Jehovah’ மரபுவடிவத்தை ஏற்றுக்கொள்வதையோ தவிர்க்கிறது.
- issue: தீர்க்கதரிசியிடம் விசாரிப்பதில் இடைநிலைப் பங்கு
  choice: அவரிடம் விசாரிப்பதற்கு
  alternative: அவர்மூலம் விசாரிப்பதற்கு
  rationale: מֵאֹתוֹ தீர்க்கதரிசியிடமிருந்து பதில் தேடுதலைக் குறிக்கிறது. ‘அவரிடம்’ மூலத்தின் திசைச்சார்ந்த பொருளை காக்கிறது; ‘அவர்மூலம்’ என்பது அவரது இடைநிலைப் பங்கை வெளிப்படையாக்கினாலும், மூலத்தில் உள்ளதைவிட அதைப் பலப்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ என்ற பரவலாக அறியப்படும் வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு தமிழில் இயல்பாக அமைய நோக்கக் கூறு கேள்விக்கு முன் வைக்கப்பட்டுள்ளது.
