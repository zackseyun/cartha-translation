revisions:
- from: 'ஆனால் யோசபாத், “நாம் அவரிடம் விசாரிப்பதற்கு, யாவேயின் தீர்க்கதரிசி இன்னும் யாராவது இங்கே இல்லையா?[a]” என்றார்.


    [a] அல்லது, “நாம் அவரிடம் விசாரிப்பதற்கு, யாவேயின் வேறொரு தீர்க்கதரிசி இங்கே இல்லையா?”'
  to: ஆனால் யோசபாத், “யாவேயின் தீர்க்கதரிசி ஒருவர் இன்னும்[a] இங்கே இல்லையா? நாம் அவரிடம் விசாரிக்கலாமே?” என்றார்.
