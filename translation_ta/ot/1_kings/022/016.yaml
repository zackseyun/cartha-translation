  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ta
  text: அப்போது அரசன் அவனை நோக்கி, “யாவேவின் பெயரில் உண்மையை மட்டுமே என்னிடம் பேசும்படி நான் உன்னை இன்னும் எத்தனை முறை ஆணைக்குட்படுத்த வேண்டும்?” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னிடம் இன்னும் எத்தனை முறை சத்தியம் வாங்க வேண்டும்?” எபிரெய வினைச்சொல் ஒருவரைச் சத்தியம் செய்யவைத்தல் அல்லது ஆணைக்குட்படுத்துதல் என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பான நிகழ்வுத் தொடரைத் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் பெயருக்குப் பதிலாக பட்டமே பயன்படுத்தப்பட்டுள்ளது; அதையே தக்கவைக்கிறது.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: எத்தனை முறை
  rationale: திரும்பத் திரும்ப ஏற்பட்டதால் உண்டான அரசனின் எரிச்சலை வெளிப்படுத்தும் இயல்பான தமிழ் வினாத்தொடர்.
- source_word: מַשְׁבִּעֶךָ
  choice: உன்னை ஆணையிடச் செய்ய வேண்டும்
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவம் ஒருவரைச் சத்தியம் செய்யவைத்தல் அல்லது ஆணைக்குட்படுத்துதல் என்பதைக் குறிக்கிறது; காரணவினைப் பொருளை இத்தேர்வு தக்கவைக்கிறது.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: உண்மையைத் தவிர வேறெதையும் என்னிடம் பேசக்கூடாது என்று
  rationale: எதிர்மறை வினையும் רַק אֱמֶת என்ற விலக்குத் தொடரும் இணைந்து ‘உண்மையை மட்டுமே’ என்ற பொருளைத் தருகின்றன; דּבר என்பதற்கான ‘பேசு’ என்பதையும் தக்கவைக்கிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேவின் பெயரில்
  rationale: בְּשֵׁם என்பது பெயரின் அதிகாரத்தின்கீழ் அல்லது அதனை அழைத்து உரைப்பதைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்க ‘யாவே’ என வழங்கப்படுகிறது.
- issue: அரசனின் கேள்வியில் உள்ள கட்டாயம் மற்றும் எரிச்சல்
  choice: நான் ... செய்ய வேண்டும்?
  alternative: நான் ... செய்கிறேன்?
  rationale: எபிரெயத்தில் வெளிப்படையான ‘வேண்டும்’ இல்லாவிட்டாலும், עַד כַּמֶּה פְעָמִים என்ற சூழல்சார் வினா மீண்டும் மீண்டும் ஆணையிட வேண்டிய நிலையைப் பற்றிய எரிச்சலைக் காட்டுகிறது. தமிழ் வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது; அடிப்படை அர்த்தத்தை மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் தெளிவான நடையில் அமைக்கப்பட்டுள்ளது. ‘அவனை நோக்கி’ என்பது இயல்பான வேதாகமக் கதைநடையைத் தக்கவைக்கிறது; ‘ஆணையிடச் செய்ய’ என்பது அரிதாகத் தோன்றினாலும் மூலத்தின் காரணவினைத் தன்மையைப் பாதுகாக்கிறது.
