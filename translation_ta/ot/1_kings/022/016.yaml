revisions:
- from: அப்போது அரசன் அவனை நோக்கி, “யாவேவின் பெயரில் உண்மையைத் தவிர வேறெதையும் என்னிடம் பேசக்கூடாது என்று நான் எத்தனை முறை உன்னை ஆணையிடச் செய்ய வேண்டும்?[a]” என்றான்.
  to: அப்போது அரசன் அவனை நோக்கி, “யாவேவின் பெயரில் உண்மையை மட்டுமே என்னிடம் பேசும்படி நான் உன்னை இன்னும் எத்தனை முறை ஆணைக்குட்படுத்த வேண்டும்?” என்றான்.[a]
  rationale: The revision replaces the inaccurate causative expression with ‘ஆணைக்குட்படுத்த,’ which faithfully conveys the Hebrew oath-setting verb. It also uses ‘பேசும்படி’ to attach the content clause naturally to the king’s adjuration, while retaining the repeated-question force, the exclusive ‘only truth,’ and the rendering யாவே for יהוה. The footnote is revised so that its alternative is idiomatic Tamil and accurately explains the Hebrew verb.
