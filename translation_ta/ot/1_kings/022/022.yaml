base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: ta
  text: அவன், “நான் புறப்பட்டுப் போய், அவனுடைய எல்லாத் தீர்க்கதரிசிகளின் வாயிலும் பொய் சொல்லும் ஆவியாக[a] இருப்பேன்” என்றான். அவர், “நீ அவனைக் கவர்ந்திழுப்பாய்[b]; அதில் வெற்றியும் பெறுவாய். புறப்பட்டுப் போய் அப்படியே செய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்மையின் ஆவியாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை ஏமாற்றுவாய்” அல்லது “அவனை இணங்கச் செய்வாய்.” எபிரெய வினைச்சொல் சூழலுக்கேற்ப கவர்ந்திழுத்தல், இணங்கச் செய்தல், அல்லது ஏமாற்றுதல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: நான் புறப்பட்டுப் போய்
  rationale: יצא என்பதன் இயக்கப் பொருளையும் முன்மொழியப்படும் எதிர்காலச் செயலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; பின்னர் வரும் கட்டளையுடனான சொல் ஒத்திசைவையும் காக்கிறது.
- source_word: וְהָיִיתִי
  choice: இருப்பேன்
  rationale: היה இங்கு ஆவி ஏற்க முன்வரும் பங்கைக் குறிக்கிறது. ‘ஆவேன்’ என்பதைக் காட்டிலும் ‘இருப்பேன்’ இயல்பாகவும் மூலத்தின் நேரடித் தன்மையைப் பேணுவதாகவும் உள்ளது.
- source_word: רוּחַ שֶׁקֶר
  choice: பொய் சொல்லும் ஆவி
  rationale: שֶׁקֶר ஆவியின் வஞ்சகப் பேச்சுத் தன்மையைச் சுட்டுகிறது. தீர்க்கதரிசிகளின் வாயில் செயல்படும் சூழலில் ‘பொய் சொல்லும் ஆவி’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘பொய்மையின் ஆவி’ என்ற வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּפִי
  choice: வாயிலும்
  rationale: பேச்சு தீர்க்கதரிசிகளின் வாயிலாக வெளிப்படுவதைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: כָּל נְבִיאָיו
  choice: அவனுடைய எல்லாத் தீர்க்கதரிசிகளின்
  rationale: כָּל என்பதன் முழுமையையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: תְּפַתֶּה
  choice: நீ அவனை வசப்படுத்துவாய்
  rationale: פתה என்பதன் பியேல் வடிவம் சூழலுக்கேற்ப கவர்தல், இணங்கச் செய்தல், ஏமாற்றுதல் ஆகிய பொருள் பரப்பைக் கொண்டுள்ளது. ‘வசப்படுத்துவாய்’ அவனை ஒரு குறிப்பிட்ட நடவடிக்கைக்கு இணங்கச் செய்யும் கருத்தைத் தருகிறது; பொருள் பரப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְגַם תּוּכָל
  choice: அதில் வெற்றியும் பெறுவாய்
  rationale: יכל இங்கு வெறும் திறனை மட்டுமல்ல, முயற்சி பலிக்கும் என்பதையும் குறிக்கிறது. ‘வெற்றியும் பெறுவாய்’ எதிர்பார்க்கப்படும் விளைவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: צֵא
  choice: புறப்பட்டுப் போய்
  rationale: முன்னர் வந்த אֵצֵא உடனான வினைச்சொல் ஒத்திசைவைப் பேணி, கட்டளையின் இயக்கப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וַעֲשֵׂה כֵן
  choice: அப்படியே செய்
  rationale: עשה כן என்ற ‘கூறிய விதத்தில் செய்’ என்னும் மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: வஞ்சகத்தை உள்ளடக்கிய பரலோக உரையாடலில் தெய்வ அனுமதி அல்லது ஆணையை மொழிபெயர்த்தல்
  choice: ஆவி முன்மொழிவதும், அது வசப்படுத்தி வெற்றிபெறும் எனக் கூறப்பட்டு ‘அப்படியே செய்’ என்ற நேரடியான கட்டளை பெறுவதும் உரையில் உள்ளபடியே வழங்கப்படுகிறது.
  alternative: இதை வெறும் செயலற்ற அனுமதியாகத் தோன்றுமாறு மென்மைப்படுத்துதல்.
  rationale: எபிரெய வினைகள் நேரடியானவை. தெய்வ இறையாண்மை, வஞ்சகம், இரண்டாம் நிலைச் செயற்பாட்டாளர் ஆகியவற்றுக்கிடையிலான இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கவோ மென்மைப்படுத்தவோ கூடாது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வாய்’ என்ற எபிரெய உருவகம் பேணப்பட்டுள்ளது. மேற்கோளில் பேசுபவர்களை வேறுபடுத்த ‘அவன்’ மற்றும் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளன; முந்தைய சூழலில் இரண்டாவது பேச்சாளர் ஆண்டவர் என்பதைக் கருத்தில் கொண்டு மரியாதை ஒருமை வழங்கப்பட்டுள்ளது.
