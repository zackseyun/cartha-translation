- from: இஸ்ரவேலின் ராஜா யோசபாத்திடம், “அவர் மூலமாக யாவேவிடம் விசாரிப்பதற்கு இன்னும் ஒருவன் இருக்கிறான்[a]. அவன் இம்லாவின் மகன் மிகாயா. ஆனால் நான் அவனை வெறுக்கிறேன். ஏனென்றால், அவன் என்னைக் குறித்து நன்மையானதைத் தீர்க்கதரிசனமாக உரைப்பதில்லை; தீமையானதை மட்டுமே உரைக்கிறான்” என்றான். அதற்கு யோசபாத், “ராஜா அப்படிச் சொல்ல வேண்டாம்” என்றான்.
  to: இஸ்ரவேலின் ராஜா யோசபாத்திடம், “அவன் மூலமாக[a] யாவேவிடம் விசாரிப்பதற்கு இன்னும் ஒருவன் இருக்கிறான்; ஆனால் நான் அவனை வெறுக்கிறேன். ஏனென்றால், அவன் என்னைக் குறித்து நன்மையானதைத் தீர்க்கதரிசனமாக உரைப்பதில்லை; தீமையானதை மட்டுமே உரைக்கிறான்—அவன் இம்லாவின் மகன் மீகாயா” என்றான். அதற்கு யோசபாத், “ராஜா அப்படிச் சொல்ல வேண்டாம்” என்றான்.
  rationale: 'திருத்தம் மூலத்தின் தகவல் வரிசையை மீட்டெடுக்கிறது: மீதமுள்ள மனிதன், அவனை ராஜா வெறுப்பதற்கான காரணம், பின்னர் அவனுடைய அடையாளம். ஒரே நபருக்கான சுட்டுப்பெயர் ஒரே விதமாக வைக்கப்பட்டுள்ளது. பெயர் வழக்கமான தமிழ் வேதாகம வடிவமான “மீகாயா” எனத் தரப்பட்டுள்ளது. அடிக்குறிப்பு இலக்கணத் தெளிவுடன், எபிரெயத்தின் மாற்று சொற்சொல்லான வாசிப்பைத் தருகிறது.'
