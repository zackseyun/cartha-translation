base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: ta
  text: இஸ்ரவேலின் ராஜா யோசபாத்திடம், “அவன் மூலமாக[a] யாவேவிடம் விசாரிப்பதற்கு இன்னும் ஒருவன் இருக்கிறான்; ஆனால் நான் அவனை வெறுக்கிறேன். ஏனென்றால், அவன் என்னைக் குறித்து நன்மையானதைத் தீர்க்கதரிசனமாக உரைப்பதில்லை; தீமையானதை மட்டுமே உரைக்கிறான்—அவன் இம்லாவின் மகன் மீகாயா” என்றான். அதற்கு யோசபாத், “ராஜா அப்படிச் சொல்ல வேண்டாம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனிடமிருந்து யாவேவை நாடுவதற்கு.”
    reason: மூலத்தின் מֵאֹתוֹ (“அவனிடமிருந்து”) மற்றும் דָּרַשׁ אֶת־יְהוָה (“யாவேவை நாடுதல்/விசாரித்தல்”) என்ற சொற்சொல்லான அமைப்பை வெளிப்படுத்தும் மாற்று.
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: இன்னும் ஒருவன் இருக்கிறான்
  rationale: עוֹד என்பதன் ‘இன்னும்’ என்ற கூட்டல் பொருளையும், אִישׁ אֶחָד குறிக்கும் கூடுதலான ஒரே நபரையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: அவர் மூலமாக யாவேவிடம் விசாரிப்பதற்கு
  rationale: தீர்க்கதரிசனச் சூழலில் דָּרַשׁ என்பது இறைவனிடம் விசாரிப்பதைக் குறிக்கிறது; מֵאֹתוֹ அந்த மனிதர் விசாரணைக்கான இடைத்தரகராக இருப்பதைக் காட்டுகிறது. ராஜாவுடன் பேசும் சூழலுக்கேற்ற மரியாதைப் பன்மையாக ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: שְׂנֵאתִיו
  choice: நான் அவனை வெறுக்கிறேன்
  rationale: முற்றுவினை வடிவம் ராஜாவின் நிலைத்த தற்போதைய மனப்பான்மையைச் சுட்டுவதால், இயல்பான தமிழ் நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: அவன் என்னைக் குறித்து நன்மையானதைத் தீர்க்கதரிசனமாக உரைப்பதில்லை; தீமையானதை மட்டுமே உரைக்கிறான்
  rationale: עָלַי என்பதன் ‘என்னைக் குறித்து’ என்ற பொருளையும், negation-ஐத் தொடரும் כִּי אִם என்பதன் ‘மட்டுமே’ என்ற விலக்குப் பொருளையும் காக்கிறது. רָע என்பதைக் குறிப்பாகப் ‘பேரழிவு’ என்று குறுக்காமல், அதன் பரந்த பொருளை ‘தீமையானது’ எனப் பாதுகாக்கிறது.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: இம்லாவின் மகன் மிகாயா
  rationale: பெயர்களைத் தமிழில் புரியத்தக்க மரபான ஒலிவடிவில் தருவதோடு, எபிரெயத் தந்தைவழி அடையாளத்தை இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: ராஜா அப்படிச் சொல்ல வேண்டாம்
  rationale: אַל உடன் வரும் வேண்டுகோள்/தடைப் பொருளையும், யோசபாத் சக ராஜாவிடம் பேசும் மரியாதையான அரசவைத் தொனியையும் இயல்பான நவீன தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கு எழுத்து கொண்ட தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்பதால் மாற்றாமல் பாதுகாக்கிறது.
- issue: רָע என்பதன் பொருள்
  choice: தீமையானதை
  alternative: பேரழிவை / கேடானதை
  rationale: இங்கு ராஜா தீர்க்கதரிசனத்தின் உள்ளடக்கத்தைத் தன் பார்வையில் மதிப்பிடுகிறான். எபிரெயச் சொல் ஒழுக்கத் தீமை அல்லது கேடு/துன்பம் என்ற இரு நிழல்களையும் கொள்ளக்கூடியதால், அதனை ‘பேரழிவு’ என்று மட்டும் தீர்மானிக்காமல் பரந்த ‘தீமையானது’ என வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவைத் தொனி பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய நேர்கூற்றை தமிழின் இயல்புக்கேற்ப குறுகிய வாக்கியங்களாகப் பிரித்தாலும், கருத்துகளின் வரிசையும் எதிர்மறைத் தீவிரமும் காக்கப்பட்டுள்ளன. ‘ராஜா’ என்பது யோசபாத்தின் மரியாதையான மூன்றாம் நபர் உரையைத் தெளிவாகத் தக்கவைக்கிறது.
