translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதிலாக நிலையான தமிழ் அரசியல் சொல்லான ‘அரசன்’ பயன்படுத்தப்பட்டுள்ளது; அரசாண்டுக் கால ஒத்திசைவு தெளிவாக வைக்கப்பட்டுள்ளது.
