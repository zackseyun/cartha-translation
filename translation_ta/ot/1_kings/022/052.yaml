source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: ta
  text: ஆகாபின் மகன் அகசியா, யூதாவின் அரசன் யோசபாத்தின் ஆட்சியின் பதினேழாம் ஆண்டில் சமாரியாவில் இஸ்ரவேலின் அரசனானான். அவன் இஸ்ரவேலை இரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: இங்கு qatal வடிவம் அகசியா அரியணை ஏறியதைக் குறிக்கிறது; ‘அரசனானான்’ என்பது அந்தத் தொடக்க நிகழ்வை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனானான் / இஸ்ரவேலை ... ஆட்சி செய்தான்
  rationale: מָלַךְ உடன் עַל என்பது ஒரு மக்கள்மீது அரசாட்சி செய்வதைக் குறிக்கிறது. முதல் வாக்கியத்தில் இயல்பான தமிழுக்காக உறவுமுறை அமைப்பும், இரண்டாவது வாக்கியத்தில் நேரடி செயப்படுபொருள் அமைப்பும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு அரசாட்சி நடைபெற்ற தலைநகரின் இடத்தைக் குறிக்கிறது; ‘சமாரியாவில்’ என்பது நேரான, இயல்பான இடவியல் மொழிபெயர்ப்பு.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה
  choice: ஆட்சியின் பதினேழாம் ஆண்டில்
  rationale: இது அரசாண்டுக் கணக்கைக் குறிக்கும் வழக்கமான காலக் குறிப்பு. தமிழில் யாருடைய ஆட்சியாண்டு என்பது தெளிவாக இருக்க ‘ஆட்சியின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לִיהוֹשָׁפָט
  choice: யோசபாத்தின்
  rationale: அரசாண்டுக் காலக்கணிப்பு சூத்திரத்தில் לְ, எந்த அரசனின் ஆண்டுகள் கணக்கிடப்படுகின்றன என்பதைக் காட்டுகிறது; தமிழில் உடைமை வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: அரியணை ஏறிய செய்திக்குப் பின் வரும் இவ்வினைச்சொல் அவனுடைய ஆட்சிக்காலத்தைச் சுருக்கமாகக் கூறுகிறது; ‘ஆட்சி செய்தான்’ மறுபடியும் ‘அரசனானான்’ என்று கூறுவதைத் தவிர்க்கிறது.
- source_word: שְׁנָתָיִם
  choice: இரண்டு ஆண்டுகள்
  rationale: எபிரெய இருமை வடிவம் இரண்டு ஆண்டுகளைக் குறிக்கிறது; காலநீட்சியைத் தமிழில் இயல்பாக இவ்வாறு கூறலாம்.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: ஆகாபின் மகன் அகசியா
  rationale: எபிரெய உறவுத் தொடரை இயல்பான தமிழ் சொல் வரிசையில் வழங்கி, இரு நபர்பெயர்களும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: இந்த இணைப்புப் பட்டம் யோசபாத்தை அடையாளப்படுத்துகிறது; ‘யூதாவின் அரசன்’ என்பது துல்லியமும் இயல்பும் கொண்ட தமிழாக்கம்.
