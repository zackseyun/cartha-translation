  source_fidelity: 'மொத்தத்தில் மூல எபிரெயத்தின் காட்சியமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: இரு அரசர்கள், தத்தம் அரியணைகள், ஆடைகள், போரடிக்கும் களம், சமாரியாவின் வாசல் நுழைவிடம், மற்றும் அவர்கள் முன்னிலையில் தீர்க்கதரிசிகள் நிகழ்த்திய செயல் அனைத்தும் இடம்பெறுகின்றன. ஆனால் ‘ஆடைகளை அணிந்துகொண்டு ... அமர்ந்திருந்தார்கள்’ என்பது தமிழில் ஆடை அணியும் செயலும் அமர்ந்திருப்பதும் ஒரே நேரத்தில் நடந்ததாகப் பொருள்படலாம்; மூலத்தில் அவர்கள் ஆடை அணிந்த நிலையிலிருந்தனர். இடச்சொற்றொடரையும் சிறிது தெளிவாக்குவது நன்று.'
