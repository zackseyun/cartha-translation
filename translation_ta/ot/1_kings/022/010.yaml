  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனும் யூதாவின் அரசனாகிய யோசபாத்தும் தத்தம் அரியணையில் ஆடைகளை அணிந்திருந்தபடி[a], சமாரியாவின் வாசல் நுழைவிடத்தில் உள்ள போரடிக்கும் களத்தில் அமர்ந்திருந்தார்கள். தீர்க்கதரிசிகள் அனைவரும் அவர்கள் முன்னிலையில் இறைவாக்கு உரைத்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அரச உடைகள்’ என்று வெளிப்படையாகக் கூறப்படவில்லை; சொற்சொல்லாக, ‘ஆடைகளை அணிந்திருந்தார்கள்.’ அரசவைக் காட்சியால் சிறப்பு அல்லது அரச உடைகள் குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனும்
  rationale: வாவ் இணைப்பை ‘-உம்’ மூலம் இயல்பாகக் காத்து, மூலத்தில் இல்லாத காலக் குறியீட்டைச் சேர்க்கவில்லை.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனாகிய யோசபாத்தும்
  rationale: பெயரையும் அதனோடு வரும் அரச பட்டத்தையும் நவீன தமிழில் இயல்பான இணைப்பாக வழங்குகிறது.
- source_word: יֹשְׁבִים אִישׁ עַל־כִּסְאוֹ
  choice: தத்தம் அரியணையில் ... அமர்ந்திருந்தார்கள்
  rationale: பன்மை நிகழ்நிலைப் பங்கேற்புச் சொல்லின் நீடிக்கும் காட்சித் தன்மையை ‘அமர்ந்திருந்தார்கள்’ காக்கிறது; பகிர்வுப் பொருளுடைய אִישׁ என்பதை ‘தத்தம்’ தெளிவாக வெளிப்படுத்துகிறது; அரசச் சூழலில் כִּסֵּא என்பது ‘அரியணை’.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: ஆடைகளை அணிந்துகொண்டு[a]
  rationale: எபிரெயம் பொதுவாக ‘ஆடைகளை அணிந்திருந்தவர்கள்’ என்றே கூறுவதால், ‘அரச உடைகள்’ என மூலத்தில் இல்லாத குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּגֹרֶן
  choice: போரடிக்கும் களத்தில்
  rationale: גֹּרֶן என்பது தானியத்தைப் போரடிக்கும் களம்; தமிழில் செயல்பாட்டை விளக்கும் இச்சொற்றொடர் தெளிவானது.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: சமாரியாவின் வாசல் நுழைவிடத்திலிருந்த
  rationale: சமாரியாவின் வாசல், அதன் நுழைவிடம் ஆகிய கட்டமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: தீர்க்கதரிசிகள் அனைவரும் அவர்கள் முன்னிலையில் இறைவாக்கு உரைத்துக்கொண்டிருந்தார்கள்
  rationale: ‘அனைவரும்’ என்ற முழுமையையும், அவர்கள் முன்னிலையில் தொடர்ந்து நிகழ்ந்த தீர்க்கதரிசனச் செயலையும் காக்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசிகள் கூறிய செய்தியின் தெய்வீக நம்பகத்தன்மை
  choice: ‘இறைவாக்கு உரைத்துக்கொண்டிருந்தார்கள்’ என அவர்களின் தீர்க்கதரிசனச் செயலை மட்டும் மொழிபெயர்த்தல்
  alternative: ‘கடவுளிடமிருந்து வந்த உண்மையான செய்தியைச் சொன்னார்கள்’ என விளக்குதல்
  rationale: מִתְנַבְּאִים அவர்களின் செயலையே குறிக்கிறது; இச்சூழலில் அந்தச் செய்தியின் உண்மை அல்லது பொய்மை பற்றிய கதையின் பதற்றத்தை மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்தியது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; காட்சியின் ஒருமை மற்றும் தொடர்ச்சியான செயல் தக்கவைக்கப்பட்டன.
