source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּבֹ֛א חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/025.yaml
  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: ta
  text: அப்போது மீகாயா, “இதோ, நீ ஒளிந்துகொள்வதற்காக ஓர் உள்ளறைக்குள் செல்லும் அந்த நாளில் காண்பாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடர்ச்சியை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது; நிகழ்வுகளின் தொடர்பை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: தமிழில் அறிமுகமான வேதாகமப் பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: הִנְּךָ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையையும் உரையின் கண்ணியமான நடையையும் காக்கிறது.
- source_word: רֹאֶה
  choice: நீயே காண்பாய்
  rationale: இலக்கண வடிவம் நிகழ்காலப் பெயரெச்சமாக இருந்தாலும், ‘அந்த நாளில்’ என்ற எதிர்காலக் காலக்குறிப்புடன் இது முன்னறிவிப்பாகச் செயல்படுகிறது. ‘நீயே’ என்பது הִנְּךָ உடன் வரும் இரண்டாம் நபர் வலியுறுத்தலை இயல்பாக உணர்த்துகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெயக் காலச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: אֲשֶׁר
  choice: '... செல்லும்'
  rationale: காண்பதற்கான காலச் சூழலைத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பால் தெரிவிக்கிறது.
- source_word: תָּבֹא
  choice: செல்லும்
  rationale: בוא என்பது சூழலுக்கேற்ப வருதல், செல்லுதல், நுழைதல் எனப் பொருள்படும்; மறைவதற்காக உள்ளே நகர்வதை இங்கு ‘செல்லும்’ இயல்பாகக் காட்டுகிறது.
- source_word: חֶדֶר בְּחֶדֶר
  choice: அறையிலிருந்து அறைக்குள்
  rationale: ‘அறை’ என்ற சொல்லைத் திரும்பக் கூறும் மூலமொழி அமைப்பை ஓரளவு காத்து, மறைவதற்காக மேலும் உள்ளே பின்வாங்கிச் செல்வதைக் காட்டுகிறது; ‘உள்ளறைக்குள்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְהֵחָבֵה
  choice: ஒளிந்துகொள்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தையும், செய்பவர் தம்மையே மறைத்துக்கொள்ளும் பொருளையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
