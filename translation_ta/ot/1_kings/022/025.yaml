translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ தீர்க்கமான எதிர்கொள்ளலின் தொனியைக் காக்கிறது. חֶדֶר בְּחֶדֶר என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
