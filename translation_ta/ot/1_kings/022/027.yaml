  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: ta
  text: '‘அரசர் கூறுவது இதுவே: இந்த மனிதனைச் சிறையில் அடைத்து, அவனுக்குத் துன்ப அப்பமும் துன்பத் தண்ணீரும் கொடுங்கள்; நான் சமாதானத்துடன் திரும்பிவரும்வரை’ என்று சொல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: அரசர் கூறுவது இதுவே
  rationale: எபிரெயத் தூதுச் செய்தி அறிவிப்பு முறையை இயல்பான, மரியாதையான நவீனத் தமிழில் காக்கிறது.
- source_word: שִׂימוּ אֶת זֶה בֵּית הַכֶּלֶא
  choice: இந்த மனிதனைச் சிறையில் அடைத்து
  rationale: சொல்லுக்குச் சொல் ‘இந்தவனைச் சிறை வீட்டில் வையுங்கள்’ என்பதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சூழலில் இது மிகாயாவைக் குறிக்கிறது.
- source_word: וְהַאֲכִילֻהוּ
  choice: அவனுக்குக் ... கொடுங்கள்
  rationale: உண்பிக்கச் செய்வதைக் குறிக்கும் காரணவினை; அப்பமும் தண்ணீரும் இணைந்திருப்பதால் தமிழில் ‘கொடுங்கள்’ என்பது இயல்பாக உள்ளது.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: துன்பத்தின் அப்பத்தையும் துன்பத்தின் தண்ணீரையும்
  rationale: לַחַץ என்பதின் நெருக்கடி/துன்பம் என்ற வலிமையையும், எபிரெய இணை அமைப்பையும் காக்கிறது; அதன் நடைமுறைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: நான் சமாதானத்துடன் திரும்பிவரும்வரை
  rationale: בְשָׁלוֹם என்பதைக் ‘சமாதானத்துடன்’ எனப் பாதுகாத்து, பாதுகாப்பாகத் திரும்புதல் என்ற சாத்தியமான நுண்பொருளையும் கதையின் நையாண்டித் தொனியையும் முடிவு செய்யாமல் விடுகிறது; தமிழ்ச் சூழலுக்காக வருகை என்பது திரும்பிவருகையாக இயல்பாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஆகாபின் கூற்றிலுள்ள בְשָׁלוֹם என்பதின் உட்குறிப்பு
  choice: சமாதானத்துடன்
  alternative: பத்திரமாக / வெற்றியுடன்
  rationale: எபிரெயச் சொல் பாதுகாப்பாகவும் சேதமின்றியும் திரும்புவதைக் குறிக்கக்கூடும். ‘சமாதானத்துடன்’ என்பது அந்தப் பல்பொருளையும், தீர்க்கதரிசனத்துடனான கதையியல் பதற்றத்தையும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; அரச அறிவிப்புக்கேற்ற கண்ணியமான நடை. மூலத்தின் கடுமையான இணைச்சொற்றொடரும் ‘சமாதானத்துடன்’ என்பதிலுள்ள கதையியல் இரட்டைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
