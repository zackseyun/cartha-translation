base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: ta
  text: யோசபாத் இஸ்ரவேலின் அரசனிடம், “தயவுசெய்து, இன்று யாவேயின் வார்த்தையை விசாரித்தறியுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வார்த்தையைத் தேடுங்கள்”; அல்லது, “யாவேயிடம் ஒரு வார்த்தைக்காக விசாரியுங்கள்.”
    reason: דרש மற்றும் אֶת דְּבַר יְהוָה ஆகியவற்றின் இணைப்பு, இறைச் செய்தியை நாடுதல் அல்லது இறைவனிடம் ஒரு செய்திக்காக விசாரித்தல் என இருவகையில் இயல்பாகப் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது. தமிழில் உரையாடலுக்குப் பின் வரும் ‘என்றார்’ இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது; தனியாக ‘பின்பு’ சேர்ப்பது அவசியமில்லை.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனிடம்
  rationale: எபிரெய முன்னிலைத் தொடரையும் அரசப் பட்டத்தையும் இயல்பான நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: דְּרָשׁ
  choice: நாடிக் கேளுங்கள்
  rationale: இச்சூழலில் דרש என்பது இறைவனிடமிருந்து வெளிப்பாட்டையோ வழிகாட்டுதலையோ நாடி விசாரிப்பதைக் குறிக்கிறது. ‘நாடிக் கேளுங்கள்’ என்பது தேடுதல் மற்றும் விசாரித்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுகோளின் பணிவை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַיּוֹם
  choice: இன்று
  rationale: கோரிக்கையின் உடனடித் தன்மையைச் சுட்டும் காலக் குறிப்பைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: אֶת דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தையை
  rationale: ‘வார்த்தை’ என்பதைக் ‘சித்தம்’ அல்லது ‘ஆலோசனை’ என்று விளக்கமாக மாற்றாமல், மூலத்தின் דְּבַר என்ற சொல்லைத் தக்கவைக்கிறது; வினையுடன் சேர்ந்து இறைவனிடமிருந்து செய்தியை நாடும் பொருளை அளிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வாசகர்களிடையே நிலைபெற்றுள்ள திருப்பெயர் வடிவமான ‘யெகோவா’ மூலம் நான்கு எழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கப்படுகிறது. ‘யாவே’ என்பது சாத்தியமான ஒலிப்புமுறை; ‘யெகோவா’ தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது.
- issue: דְּרָשׁ ... אֶת דְּבַר என்ற தொடரின் பொருள்
  choice: வார்த்தையை நாடிக் கேளுங்கள்
  alternative: யெகோவாவிடம் ஒரு வார்த்தைக்காக விசாரியுங்கள்; யெகோவாவின் வார்த்தையைத் தேடுங்கள்
  rationale: இத்தொடர் இறைச் செய்தியை நாடுவதையும் இறைவனிடம் விசாரிப்பதையும் உள்ளடக்க முடியும். முதன்மை உரை இரு நுணுக்கங்களையும் இணைத்து வழங்குகிறது; அடிக்குறிப்பு மாற்று அமைப்புகளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க அரசவைக் கோரிக்கையை ‘தயவுசெய்து’ மற்றும் பன்மை மரியாதை வினைமுற்று மூலம் வெளிப்படுத்துகிறது. மிகப் பழமையான நடை தவிர்க்கப்பட்டு, ‘வார்த்தை’ என்ற வேதாகமச் சொல்லாட்சி தக்கவைக்கப்பட்டுள்ளது.
