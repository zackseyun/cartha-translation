translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘துயிலடைந்தான்’ என்பதன் மூலம் எபிரேய மரண உருவகம் காக்கப்படுகிறது; அடிக்குறிப்பு அதன் வழக்குப் பொருளைத் தெளிவுபடுத்துகிறது.
