base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: ta
  text: ஆகாப் தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவனுக்குப் பதிலாக அவன் மகன் அகசியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “தன் முன்னோர்களோடு துயிலடைந்தான்”; இது அவன் இறந்தான் என்பதைக் குறிக்கும் வழக்கமான அரச மரபுச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: இது அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரேயச் சொற்றொடர். ‘இறந்தான்’ என்று பொருளை மட்டும் வெளிப்படுத்தாமல், மூலத்தின் உருவகத்தையும் அரச மரபுச் சூத்திரத்தின் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு தொடர்ந்து ஆட்சி செய்ததைக் காட்டிலும் அரியணை ஏறிய வாரிசுரிமை நிகழ்வே குறிக்கப்படுகிறது; ‘அரசனானான்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் பதவியை மகன் ஏற்ற வாரிசுரிமையைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: אֲחַזְיָהוּ
  choice: அகசியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: மகன் என்ற உறவையும் அரச வம்ச வாரிசுரிமையையும் மூலத்தைப் போல வெளிப்படையாகக் காக்கிறது.
