  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: ta
  text: இப்போது, இதோ, யாவே பொய்யுரைக்கும் ஓர் ஆவியை[a] உன்னுடைய இந்தத் தீர்க்கதரிசிகள் அனைவரின் வாயிலும் வைத்திருக்கிறார்; யாவே உனக்கு எதிராகப் பேரழிவை[b] உரைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொய்மையின் ஆவி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கேட்டை.’ எபிரெயச் சொல் நியாயத்தீர்ப்புச் சூழலில் கேடு, பேரிடர் அல்லது பேரழிவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இணைப்புடன் கூடிய உடனடி உரைமாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தனியே ‘இப்போது’ என்பதே சூழலில் இணைப்புணர்வையும் தக்கவைக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தும் எபிரெயச் சொல்லின் தீர்க்கதரிசனத் தீவிரத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: נָתַן
  choice: வைத்திருக்கிறார்
  rationale: ‘ஆவியை வாயில் வைத்தல்’ என்ற எபிரெய உருவகத்தை நேரடியாகக் காத்து, முடிந்த செயல் தற்போதும் விளைவுடையது என்பதைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், அதன் தனிப்பெயர் இயல்பை ஒலிபெயர்ப்பில் காக்கிறது.
- source_word: רוּחַ שֶׁקֶר
  choice: பொய்யுரைக்கும் ஓர் ஆவி
  rationale: ஆவியைச் செயல்படும் தனிப்பட்ட முகவராகக் காட்டுவதுடன், שֶׁקֶר என்பதன் வஞ்சகமான பொய்மைப் பண்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּפִי
  choice: வாயிலும்
  rationale: எபிரெயில் ஒருமை வடிவம் பன்மைக் குழுவுக்குப் பகிர்ந்தளிக்கும் பொருளில் வருகிறது; தமிழில் ‘அனைவரின் வாயிலும்’ என்பது அந்தப் பகிர்ந்தளிப்பு உணர்வைத் தெளிவாக்குகிறது.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: உன்னுடைய இந்தத் தீர்க்கதரிசிகள் அனைவரின்
  rationale: இரண்டாம் நபர் உடைமையையும் ‘இந்த’ என்ற சுட்டுவலியுறுத்தலையும் முழுமையாகக் காக்கிறது.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: உனக்கு எதிராகப் பேரழிவை உரைத்திருக்கிறார்
  rationale: עַל என்பதன் எதிர்மறை நோக்கையும், רָעָה என்பதன் நியாயத்தீர்ப்புச் சூழலிலான அழிவையும் காக்கிறது; ‘உரைத்திருக்கிறார்’ என்பது மூலத்தின் பேச்சுச் செயலை ‘தீர்மானித்தார்’ என விளக்கிவிடாமல் விடுகிறது.
theological_decisions:
- issue: யாவேயின் செயலுடன் தொடர்புடைய רָעָה என்பதன் பொருள்
  choice: பேரழிவு
  alternative: தீமை; கேடு; பேரிடர்
  rationale: இச்சூழலில் இச்சொல் ஒழுக்கரீதியான தீமையைவிட வரவிருக்கும் தீங்கான நியாயத்தீர்ப்பைக் குறிக்கிறது. ‘பேரழிவு’ அதன் கடுமையை வெளிப்படுத்தி, கடவுள் ஒழுக்கத் தீமை செய்கிறார் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- issue: பொய்யுரைக்கும் ஆவியின் மீது தெய்வீகச் செயலாண்மை
  choice: யாவே ... வைத்திருக்கிறார்
  alternative: யாவே ... அனுமதித்திருக்கிறார்
  rationale: נָתַן நேரடியாக யாவேயின் செயலைக் கூறுகிறது. ‘அனுமதித்தார்’ என்று மென்மைப்படுத்தாமல், மூலத்தில் உள்ள தெய்வீக இறையாண்மைக்கும் பொய்யுரைக்கும் ஆவியின் செயலுக்கும் இடையிலான பதற்றம் அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான தீர்க்கதரிசன நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘உரைத்திருக்கிறார்’ ஆகியவை வசனத்தின் solemn வலியுறுத்தலைக் காக்கின்றன; தேவையற்ற பழந்தமிழ் அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
