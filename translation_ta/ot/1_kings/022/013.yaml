base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: ta
  text: மிகாயாவை அழைக்கச் சென்ற தூதன் அவரிடம், “இதோ, தீர்க்கதரிசிகளின் வார்த்தைகள் எல்லாம் ஒரே குரலாக[a] அரசனுக்குச் சாதகமாக இருக்கின்றன. தயவுசெய்து, உமது வார்த்தையும் அவர்களில் ஒருவருடைய வார்த்தையைப் போல இருக்கட்டும்; நீரும் சாதகமாகப் பேசுவீராக” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “ஒரே வாயால்”; அதாவது, “ஒரே குரலில்” அல்லது “ஒருமனதாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: தூதன்
  rationale: இச்சூழலில் இது மிகாயாவை அழைக்க அனுப்பப்பட்ட மனிதத் தூதரைக் குறிக்கிறது; வானதூதனை அல்ல.
- source_word: לִקְרֹא
  choice: அழைக்க
  rationale: அரசனிடம் வரும்படி மிகாயாவை அழைக்கும் அதிகாரபூர்வமான சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘அழைத்துவர’ என்று மூலத்தில் இல்லாத இயக்கக் கருத்தைச் சேர்க்கவில்லை.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் வார்த்தைகள்
  rationale: ‘செய்தி’ அல்லது ‘தீர்க்கதரிசனங்கள்’ என்று முன்கூட்டியே விளக்காமல், மூலத்தின் ‘வார்த்தைகள்’ என்ற வடிவத்தைப் பேணுகிறது.
- source_word: פֶּה אֶחָד
  choice: ஒரே வாயாக
  rationale: ‘ஒரே வாய்’ என்ற எபிரெய உருவகத்தை முதன்மைப் பிரதியில் பேணுகிறது; அதன் ஒருமித்த கருத்து அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: அரசனுக்குச் சாதகமாக
  rationale: அரசனைப் பற்றிய நேர்மறையான, அவனுக்கு விருப்பமான பேச்சைக் குறிக்கும் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהִי נָא דבריך
  choice: தயவுசெய்து, உமது வார்த்தையும் … இருந்து
  rationale: נָא என்பதன் வேண்டுகோள் தொனியையும், ‘உமது வார்த்தை’ என்ற ஒருமை வடிவத்தையும் பேணுகிறது.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: அவர்களில் ஒருவருடைய வார்த்தையைப்போல்
  rationale: மூலத்தின் ஒருமை அமைப்பையும், மற்ற தீர்க்கதரிசிகளில் ஒருவரது செய்தியோடு ஒத்துப்போகுமாறு விடுக்கப்பட்ட அழுத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: சாதகமாகப் பேசுவீராக
  rationale: ‘நல்லதைப் பேசு’ என்ற சொல்லர்த்தத்தை இச்சூழலுக்கேற்ற இயல்பான தமிழில் வழங்குகிறது; வேண்டுகோளின் மரியாதையான கட்டளைத் தொனியையும் தக்கவைக்கிறது.
