translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையும் உரையாடலுக்கேற்ற இயல்பான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மிகாயாவிடம் தூதன் பேசும் மரியாதைத் தொனியை ‘உமது’ மற்றும் ‘பேசுவீராக’ என்பவை பேணுகின்றன.
