base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ta
  text: ஆனால் உயர்ந்த வழிபாட்டு இடங்கள்[a] அகற்றப்படவில்லை; மக்கள் இன்னும் அந்த உயர்ந்த வழிபாட்டு இடங்களில் பலியிட்டும் தூபங்காட்டியும் வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயர்ந்த வழிபாட்டு இடங்கள்” என்பதற்கான எபிரெயச் சொல், பொதுவாக உயரமான இடங்களில் அமைந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கிறது. இதை “உள்ளூர் வழிபாட்டுத் தலங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்தப் பலிகளையும் தூபங்காட்டுதலையும் கர்த்தருக்கு அனுமதியற்ற இடங்களில் செய்தார்களா, அல்லது வேறு தெய்வ வழிபாட்டின் ஒரு பகுதியாகச் செய்தார்களா என்பதை இவ்வசனம் குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய நேர்மறையான மதிப்பீட்டுடன் உள்ள முரண்பாட்டை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: உயரமான இடங்களில் அமைந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கும் எபிரெயச் சொல்லுக்கு வேதாகமச் சூழலில் சுருக்கமான, மரபான இணைச்சொல்; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: மேடைகள் தொடர்ந்து இருந்தன என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; சொற்சொல்லான ‘விலகவில்லை’ இங்கு இயல்பாகாது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: செயல் தொடர்ந்து நடந்ததைக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மக்களைக் கூட்டாகக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: מְזַבְּחִים
  choice: பலியிட்டும் ... வந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான அல்லது வழக்கமான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמְקַטְּרִים
  choice: தூபங்காட்டியும் வந்தார்கள்
  rationale: வழிபாட்டுச் சூழலில் தூபத்தை எரித்துப் புகை எழுப்புவதை இயல்பான தமிழில் குறிக்கிறது; முந்தைய வினையுடன் சேர்ந்து தொடர்ச்சியான வழக்கத்தைப் பாதுகாக்கிறது.
- source_word: בַּבָּמוֹת
  choice: அந்த மேடைகளில்
  rationale: வழிபாடு நடைபெற்ற இடத்தைச் சுட்டுகிறது; ‘அந்த’ என்பது முன்பு குறிப்பிடப்பட்ட மேடைகளையே இயல்பாகத் திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: மேடைகளில் நடைபெற்ற வழிபாட்டின் தன்மை
  choice: பலிகளும் தூபமும் யாருக்குச் செலுத்தப்பட்டன என்பதை முதன்மை உரையில் குறிப்பிடாமல் விவரிப்பது
  alternative: அவை கர்த்தருக்குச் செலுத்தப்பட்ட அனுமதியற்ற வழிபாடு என்றோ, பிற தெய்வங்களுக்கான விக்கிரக வழிபாடு என்றோ வெளிப்படையாகக் குறிப்பிடுவது
  rationale: எபிரெய உரை வழிபாட்டின் இலக்கைச் சொல்லவில்லை. எனவே மேடைகள் நீடித்ததைக் குறை கூறும் கருத்தைப் பாதுகாத்தபடியே, வழிபாட்டின் தன்மை குறித்த உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். ‘பலியிட்டும் தூபங்காட்டியும் வந்தார்கள்’ என்பது எபிரெயப் பங்கேற்புவினைகளின் தொடர்ச்சியான, வழக்கமான செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
