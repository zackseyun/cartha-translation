base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: ta
  text: அவன் பாகாலைச் சேவித்தான்; அவனுக்கு வணங்கினான். தன் தந்தை செய்த எல்லாவற்றின்படியும், இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை வழிபட்டான்”; எபிரெய வினைச்சொல் நேரடியாகத் தாழ்ந்து வணங்குவதையோ தரையில் விழுந்து வணங்குவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: பணிசெய்து
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணிசெய்தல்/சேவித்தல்’; சிலைவழிபாட்டுச் சூழலில் வழிபாட்டுச் சேவையைக் குறிக்கும். அடுத்த வினைச்சொல்லின் தனித்துவத்தையும் இது காக்கிறது.
- source_word: הַבַּעַל
  choice: பாகால்
  rationale: இச்சூழலில் தெய்வத்தின் பெயர்/பட்டமாக வருவதால், தமிழில் வழக்கமான பெயர்வடிவமான ‘பாகால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: அவனைப் பணிந்துகொண்டான்
  rationale: שׁחה உடலைத் தாழ்த்திப் பணிதல் அல்லது சாஷ்டாங்கமாக விழுதல் என்னும் செயலைக் குறிக்கிறது; வழிபாடு என்ற பொருளும் சூழலில் அடங்கும். ‘பணிந்துகொண்டான்’ konkretமான செயலையும் வழிபாட்டு நோக்கையும் இயல்பாகத் தருகிறது.
- source_word: וַיַּכְעֵס
  choice: கோபமூட்டினான்
  rationale: כעס என்பதன் ஹிஃபீல் வடிவம் ஒருவரைக் கோபப்படுத்துதல் அல்லது கோபத்திற்குத் தூண்டுதல் என்று பொருள்; ‘கோபமூட்டினான்’ காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பொதுப்பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இந்த எபிரெய இணைப்புத் தொடர் நேரடியாக ‘இஸ்ரவேலின் கடவுள்’ என்று அடையாளப்படுத்துகிறது; வாக்கியத்தில் ‘இஸ்ரவேலின் கடவுளாகிய’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: தன் தந்தை செய்த எல்லாவற்றையும் போலவே
  rationale: மூலத்தின் ‘அவன் தந்தை செய்த அனைத்தின்படியும்’ என்ற ஒப்பீட்டு வலிமையையும் ‘எல்லாவற்றையும்’ என்ற முழுமையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இவ்வசனம் யாவே என்னும் இஸ்ரவேலின் கடவுளை பாகாலுடன் வேறுபடுத்துகிறது. தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது அந்த வேறுபாட்டையும் மூல உரையின் பெயரிடுதலையும் காக்கிறது.
- issue: וַיִּשְׁתַּחֲוֶה לוֹ என்பதிலுள்ள உடல் செயலும் வழிபாட்டுப் பொருளும்
  choice: அவனைப் பணிந்துகொண்டான்
  alternative: அவனை வழிபட்டான்
  rationale: இச்சொல் வழிபாட்டைக் குறிக்கக்கூடியதாயினும், அதன் நேரடியான பணிதல்/உடலைத் தாழ்த்துதல் என்ற உருவகச் செயலை முதன்மை உரையில் காப்பதால் முந்தைய ‘பணிசெய்தான்’ என்பதுடன் ஒன்றாக்கப்படுவது தவிர்க்கப்படுகிறது.
