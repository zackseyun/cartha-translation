  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘பணிசெய்து’ மற்றும் ‘பணிந்துகொண்டான்’ என்பவை தொடர்ச்சியான இரண்டு வேறுபட்ட எபிரெய வினைகளைக் காக்கின்றன; ‘கோபமூட்டினான்’ இயல்பான காரணவினை வடிவம்.
