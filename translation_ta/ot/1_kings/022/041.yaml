translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசவைக் குறிப்புக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தகவல் வரிசை தமிழின் இயல்பான ஓட்டத்திற்காக மாற்றப்பட்டாலும், காலம், வம்சம், ஆட்சிப் பகுதி ஆகிய அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
