source:
  edition: WLC
  text: וִ/יהֽוֹשָׁפָט֙ בֶּן אָסָ֔א מָלַ֖ךְ עַל יְהוּדָ֑ה בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/אַחְאָ֖ב מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: ta
  text: மேலும், இஸ்ரவேலின் அரசனாகிய ஆகாபின் ஆட்சியின் நான்காம் ஆண்டில், ஆசாவின் மகனான யோசபாத் யூதாவின் அரசனானார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: யோசபாத்
  rationale: ו முன்னைய நிகழ்வோடு கதைத்தொடர்பை ஏற்படுத்துகிறது; தமிழில் காலக் குறிப்பை முதலில் அமைத்த வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை. பெயர் மரபான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: בֶּן אָסָא
  choice: ஆசாவின் மகன்
  rationale: இந்த இணைப்புச் சொற்றொடர் யோசபாத்தின் தந்தைவழி அடையாளத்தை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: מָלַךְ
  choice: அரசனானார்
  rationale: இங்குள்ள வினை ஆட்சி செய்த காலப்பரப்பை மட்டும் அல்லாமல் அரசாட்சிக்கு வந்ததைக் குறிக்கிறது; ‘அரசனானார்’ அதன் தொடக்கநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל יְהוּדָה
  choice: யூதாவின் அரசனானார்
  rationale: עַל என்பது யூதாவின்மீது செலுத்திய அரச அதிகாரத்தைக் குறிக்கிறது. தமிழில் ‘யூதாவின் அரசன்’ என்பது இயல்பான அரசாட்சிக் கூறு.
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: நான்காம் ஆண்டில்
  rationale: அரசாண்டுக் கணக்கைக் குறிக்கும் வழக்கமான காலக்கூறு; தமிழில் வரிசை எண்ணுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: לְ/אַחְאָב
  choice: ஆகாபின் ஆட்சியின்
  rationale: இந்த அரசாண்டுக் காலக்கணிப்பு அமைப்பில் לְ ஆகாபின் ஆட்சியைக் குறிப்புப் புள்ளியாகக் காட்டுகிறது. ‘ஆட்சியின்’ என்று வெளிப்படுத்துவது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய
  rationale: இது ஆகாபை அடையாளப்படுத்தும் பட்டம்; தமிழில் பெயருக்கு முன் இயல்பாக இணைக்கப்பட்டுள்ளது.
