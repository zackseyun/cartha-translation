  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: ஆகாபின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவன் கட்டிய யானைத்தந்த வீடும்[a], அவன் கட்டிய எல்லா நகரங்களும்—இஸ்ரவேல் அரசர்களின் நாள்குறிப்புப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “தந்த வீடு.” இது முழுவதும் யானைத்தந்தத்தால் கட்டப்பட்ட கட்டடத்தைக் குறிப்பதைவிட, யானைத்தந்தத்தால் அலங்கரிக்கப்பட்ட ஒரு கட்டடத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் அரசர்களின் நாள்குறிப்புப் புத்தகம்” என்பது அரசர்கள் நூலில் மேற்கோள் காட்டப்படும் ஓர் அரச ஆவணத் தொகுப்பு; இது வேதாகமத்தின் நாளாகமப் புத்தகத்தையே குறிக்க வேண்டியதில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: ஆகாபின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது; அரசர் குறித்த வரலாற்றுச் சுருக்கத்தில் דִּבְרֵי என்பது வெறும் ‘சொற்கள்’ அல்ல, அவரது செயல்கள் அல்லது நிகழ்வுகள் என்று பொருள்படும்.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: עָשָׂה என்பதன் பரந்த பொருளை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: וּבֵית הַשֵּׁן
  choice: தந்த மாளிகையும்
  rationale: சொல்லர்த்தமாக ‘தந்த வீடு.’ அரசருக்குரிய சிறப்பு வாய்ந்த கட்டடம் என்ற சூழலைத் தமிழில் இயல்பாகக் காட்ட ‘மாளிகை’ பயன்படுத்தப்பட்டுள்ளது; அது முழுவதும் தந்தத்தால் கட்டப்பட்டது என்று கூறாமல் மூலத்தின் சுருக்கமான அமைப்பு காக்கப்படுகிறது.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: அவன் கட்டிய எல்லா நகரங்களும்
  rationale: עָרִים என்பதற்கான வழக்கமான பொருள் ‘நகரங்கள்’; அவை கோட்டை நகரங்கள் என்று தேவையின்றி குறுக்கப்படவில்லை.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: הֲלוֹא நேர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது; தமிழ் வினா வடிவம் அந்த வலியுறுத்தலை இயல்பாகக் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாள்குறிப்புப் புத்தகத்தில்
  rationale: எழுதப்பட்ட அரச ஆவணத் தொகுப்பைக் குறிக்கும் தலைப்பைத் தமிழில் தெளிவாகத் தருகிறது. עַל என்பதற்கு இச்சூழலில் தமிழ் ஆவண வழக்குப்படி ‘புத்தகத்தில்’ பொருத்தமானது.
