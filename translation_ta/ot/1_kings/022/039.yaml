translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் இறுதி வினாவும் காக்கப்பட்டுள்ளன; ஆங்கில ஆலோசனை உரையில் இடம் மாறியிருந்த அடிக்குறிப்பு குறிகள் பொருத்தமான சொற்றொடர்களோடு இணைக்கப்பட்டுள்ளன.
