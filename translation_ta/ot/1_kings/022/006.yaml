source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: ta
  text: இஸ்ரவேலின் ராஜா இறைவாக்கினர்களை—ஏறக்குறைய நானூறு பேரை—ஒன்றுகூட்டி, அவர்களிடம், “நான் ராமோத்-கிலேயாதுக்கு எதிராகப் போரிடப் போகலாமா, வேண்டாமா?” என்று கேட்டான். அதற்கு அவர்கள், “போங்கள்; ஆண்டவர் அதை ராஜாவின் கையில் ஒப்புக்கொடுப்பார்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போங்கள்; என் ஆண்டவர் அதை ராஜாவின் கையில் ஒப்புக்கொடுப்பார்.” இங்குள்ள எபிரேயச் சொல் சில சூழல்களில் “என் ஆண்டவர்” என்று வாசிக்கப்படலாம்; ஆனால் இங்கே அது இறைப்பட்டமான “ஆண்டவர்” என்பதைக் குறிப்பதே அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பதன் Qal வடிவம் மக்களை ஒரே இடத்தில் கூட்டுவதைக் குறிக்கிறது; ‘ஒன்றுகூட்டி’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַנְּבִיאִים
  choice: இறைவாக்கினர்களை
  rationale: נביאים என்பதற்கான தெளிவான, சமயப் பிரிவுச் சார்பற்ற தமிழ்; இவர்கள் அரசனால் ஆலோசனைக்காகக் கூட்டப்பட்ட தீர்க்கதரிசனப் பணியாளர்கள்.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ஏறக்குறைய நானூறு பேரை
  rationale: כ முன்னொட்டு தோராய எண்ணைக் குறிக்கிறது; ‘ஏறக்குறைய’ அந்தத் தோராயத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: הַאֵלֵךְ
  choice: நான் ... போகலாமா
  rationale: கேள்விக்குறியுடன் வரும் முதலாம் நபர் imperfect ஆலோசனை நாடும் கேள்வியை வெளிப்படுத்துகிறது; தமிழில் ‘போகலாமா’ இயல்பானது.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: கிலேயாத்திலுள்ள ராமோத்தின்மேல் போருக்குப்
  rationale: עַל இலக்கான இடத்துக்கு எதிரான ராணுவ நடவடிக்கையையும் לַמִּלְחָמָה போரின் நோக்கத்தையும் குறிக்கிறது; இடப்பெயரின் கூறுகளும் பாதுகாக்கப்படுகின்றன.
- source_word: אִם אֶחְדָּל
  choice: வேண்டாமா
  rationale: חדל இங்கு செயலைத் தவிர்ப்பது அல்லது நிறுத்திக்கொள்வது எனப் பொருள்படும்; முந்தைய ‘போகலாமா’ என்பதுடன் இணைந்த ‘வேண்டாமா’ தமிழில் இயல்பாக ஆலோசனைக்குரிய மாற்றைத் தருகிறது.
- source_word: עֲלֵה
  choice: போங்கள்
  rationale: עלה என்ற ராணுவ வழக்குச் சொல் ‘மேலே போ’ என நேரடியாக மொழிபெயர்க்கப்படலாம்; ஆனால் இலக்கு ஏற்கெனவே கூறப்பட்டுள்ளதால் ‘போங்கள்’ நவீனத் தமிழில் இயல்பாகவும் பொருள் மாறாமலும் உள்ளது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: மசோரா உயிர்க்குறிப்புடன் உள்ள אֲדֹנָי இச்சூழலில் இறைப்பட்டமாகப் புரிவது அதிக வாய்ப்புள்ளது; அது יהוה என்னும் தனிப்பெயர் அல்ல என்பதால் அதனுடன் ஒன்றாக்கப்படவில்லை. ‘என் ஆண்டவர்’ என்ற மாற்று வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: ராஜாவின் கையில்
  rationale: ‘கையில் கொடுத்தல்’ என்பது ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்; தமிழிலும் புரியக்கூடியதால் ‘கை’ பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: אֲדֹנָי என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: என் ஆண்டவர்
  rationale: சூழலில் இது வெற்றியை உறுதிப்படுத்தும் இறைப்பட்டமாக இருப்பதே அதிக வாய்ப்புள்ளது. ஆயினும் அச்சொல் சில சூழல்களில் மனித அரசனை நோக்கிய ‘என் ஆண்டவர்’ என்றும் பொருள்படக்கூடியதால் அந்த உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ராஜா’ மற்றும் ‘ஆண்டவர்’ ஆகியவை சூழலுக்கு ஏற்ற பரிச்சயமான வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; அசல் உரையின் இறையியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
