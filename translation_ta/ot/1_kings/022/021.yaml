base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: ta
  text: அப்போது அந்த ஆவி முன்வந்து யாவேவின் முன் நின்று, “நான் அவனைத் தூண்டுவேன்[a]” என்றது. யாவே அதனிடம், “எந்த வழியில்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இணங்கவைப்பேன்,’ ‘கவர்ந்திழுப்பேன்,’ அல்லது ‘வஞ்சிப்பேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை தூண்டுதல், இணங்கச் செய்தல், அல்லது கவர்ந்திழுத்தல் ஆகிய பொருள்களைக் குறிக்கலாம்; பயன்படுத்தப்படும் முறை அடுத்த வசனத்தில் விளக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: அந்த ஆவி
  rationale: இச்சொல்லில் உள்ள குறிப்புச் சுட்டும் உருபையும், பரலோக அவைக் காட்சியில் குறிப்பிட்ட ஓர் ஆவிக்குரிய உயிர் முன்வருவதையும் வெளிப்படுத்துகிறது. ‘தூய ஆவியானவர்’ என்று பொருள் கொள்ளத் தூண்டும் ‘ஆவியானவர்’ தவிர்க்கப்படுகிறது.
- source_word: וַיֵּצֵא
  choice: முன்னே வந்து
  rationale: அடிப்படைப் பொருள் ‘வெளியே சென்றது/வந்தது’; இங்கு பரலோகப் படையினரிடமிருந்து ஒருவர் முன்வந்து தன்னை அளிக்கும் அவைக் காட்சியை இயல்பாகக் காட்டுகிறது.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: முன்பாக நின்று
  rationale: மேலான ஒருவரின் முன்னிலையில் நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் முறையான தன்மையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲפַתֶּנּוּ
  choice: நான் அவனை இணங்கவைப்பேன்
  rationale: פִּתָּה என்பதன் பியேல் வடிவம் இணங்கச் செய்தல், தூண்டுதல், வஞ்சித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. அடுத்த வசனம் முறையை விளக்குவதால், இங்கே வஞ்சனையை முன்கூட்டியே தீர்மானிக்காமல் நோக்கமுள்ள இணக்கப்படுத்தலைக் காட்டுகிறது.
- source_word: בַּמָּה
  choice: எவ்வாறு?
  rationale: செயல் நிறைவேற்றப்படும் முறை அல்லது வழியைக் கேட்கும் சுருக்கமான, இயல்பான நவீனத் தமிழ் வினா.
theological_decisions:
- issue: பரலோக அவையில் הָרוּחַ என்பதன் அடையாளம்
  choice: குறிப்பிட்ட ஓர் ஆவிக்குரிய உயிரைக் குறிக்கும் ‘அந்த ஆவி’
  alternative: ‘ஆவியானவர்’ (தூய ஆவி எனப் புரிந்துகொள்ளப்படலாம்) அல்லது ‘ஓர் ஆவி’
  rationale: சூழலில் பரலோகப் படையிலிருந்து ஒருவர் முன்வருகிறார். எபிரெய மொழியின் குறிப்புத்தன்மையைப் பாதுகாக்கும் அதேவேளையில், அது தூய ஆவிதான் என்று மூலவசனம் கூறாத முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: פִּתָּה வினையின் ஒழுக்கவியல் மற்றும் இறையியல் நுணுக்கம்
  choice: ‘இணங்கவைப்பேன்’ என்று மொழிபெயர்த்து பொருள் அகலத்தைப் பாதுகாத்தல்
  alternative: ‘வஞ்சிப்பேன்’ அல்லது ‘தூண்டுவேன்’
  rationale: வினை வஞ்சனை, கவர்ச்சி, சம்மதிக்கச் செய்தல் ஆகியவற்றைக் குறிக்கலாம்; பொய்யுரைக்கும் ஆவி பற்றிய அடுத்த வசனமே குறிப்பான முறையை வெளிப்படுத்துகிறது. ஆகவே இவ்வசனத்தில் உள்ள பதற்றத்தை முன்கூட்டியே தீர்க்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பரலோக அவைக் காட்சியின் முறையான தொனி காக்கப்பட்டுள்ளது. ஆவியைக் குறிக்கும் அஃறிணைப் பயன்பாடு தமிழில் இயல்பாக இருப்பதால் ‘அதனிடம்’ பயன்படுத்தப்பட்டது.
