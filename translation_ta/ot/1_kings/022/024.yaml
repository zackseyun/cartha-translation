  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: ta
  text: அப்போது கெனானாவின் மகன் சிதேக்கியா அருகே வந்து, மீகாயாவின் கன்னத்தில் அடித்து, “யாவேயின் ஆவி என்னிடமிருந்து எந்த வழியாகக் கடந்து சென்று உன்னிடம் பேசினார்?” என்று கேட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் ஆவி என்னிடமிருந்து உன்னிடம் பேச எந்த வழியாகக் கடந்து சென்றார்?”
    reason: אֵי זֶה என்ற சொற்றொடரை ‘எந்தப் பக்கமாக’ அல்லது ‘எந்த வழியாக’ எனப் புரிந்துகொள்ளக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அருகே வந்து
  rationale: נגשׁ குறிக்கும் உடல்சார்ந்த அணுகுதலையும் மோதலான சூழலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: கெனானாவின் மகன் சிதேக்கியா
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை–மகன் உறவு இயல்பான தமிழ் உடைமைத் தொடரால் தரப்படுகிறது.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: மிகாயாவின் கன்னத்தில் அடித்து
  rationale: נכה என்பது அடித்தலைப் பொதுவாகக் குறிக்கிறது; அறைந்தான் என்று முறையைத் தீர்மானிக்காமல், לֶחִי என்பதைக் ‘கன்னம்’ என நேரடியாகத் தருகிறது.
- source_word: אֵי זֶה
  choice: எந்தப் பக்கமாக
  rationale: ஆவி சிதேக்கியாவைவிட்டு மிகாயாவிடம் சென்றதாகக் கேலி செய்து கேட்கும் பாதைசார் கேள்வியை இயல்பாகப் பாதுகாக்கிறது; ‘எங்கே’ என்று மட்டும் மொழிபெயர்ப்பதைவிட மூலத்தின் இயக்க உணர்வைத் தருகிறது.
- source_word: עָבַר
  choice: கடந்து சென்று
  rationale: עבר என்பதன் ‘கடந்து செல்லுதல்’ என்ற இயக்கத்தைத் தெளிவாக வெளிப்படுத்தி, சிதேக்கியாவிடமிருந்து மிகாயாவிடம் ஆவி சென்றார் என்ற கிண்டலான சவாலைப் பாதுகாக்கிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேயின் ஆவி
  rationale: தீர்க்கதரிசனச் சூழலில் இது இறைவனுடைய ஆவியைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מֵאִתִּי
  choice: என்னைவிட்டு
  rationale: புறப்படும் மூலத்தைக் குறிக்கும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְדַבֵּר אֹתָךְ
  choice: உன்னிடம் பேசினார்
  rationale: சுருக்கமான எபிரெயக் கட்டமைப்பின் திசைசார் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் பொருளும் மரியாதை வினை வடிவமும்
  choice: யாவேயின் ஆவி ... பேசினார்
  alternative: யாவேயின் ஆவி ... பேசியது
  rationale: தீர்க்கதரிசன அதிகாரத்தைப் பற்றிய சர்ச்சையில் இந்தச் சொற்றொடர் இறைவனுடைய ஆவியைக் குறிக்கிறது. ‘பேசினார்’ என்பது தமிழில் தெய்வீக ஆளுமைக்குரிய மரியாதையை வெளிப்படுத்துகிறது; ஆனால் வசனம் சிதேக்கியாவின் கூற்றை உண்மையென உறுதிப்படுத்துவதாக கூடுதல் விளக்கம் சேர்க்கவில்லை.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாள்கிறது. சிதேக்கியாவின் கேலி கலந்த சவாலும், ஆவி அவரைவிட்டு மிகாயாவிடம் சென்றாரா என்ற தீர்க்கப்படாத வாதத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
