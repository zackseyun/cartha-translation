translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான அரசவைக் கூற்றாக வடிவமைக்கப்பட்டது. சொல்லாட்சிக் கேள்வியின் வலிமையும் מַחְשִׁים என்பதிலுள்ள குற்றம்சாட்டும் செயலின்மையும் காக்கப்பட்டுள்ளன. அராம் என்ற மூலப் பெயர் பயன்படுத்தப்பட்டது.
