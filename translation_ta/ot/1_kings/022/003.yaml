  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: ta
  text: இஸ்ரவேல் அரசன் தன் ஊழியர்களிடம், “ராமோத்-கீலேயாத் நமக்குரியது என்பது உங்களுக்குத் தெரியுமல்லவா? ஆனால், அராம் அரசனின் கையிலிருந்து அதை எடுத்துக்கொள்ள நாம் ஒன்றும் செய்யாமல் இருக்கிறோமே![a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒன்றும் செய்யாமல் இருக்கிறோம்” என்பதற்கான எபிரெயச் சொற்றொடரின் நேரடியான பொருள், “அதை எடுத்துக்கொள்ளாமல் நாம் மௌனமாக இருக்கிறோம்” என்பதாகும்; இங்கு அது நடவடிக்கை எடுக்காததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: தன் ஊழியர்களிடம்
  rationale: עבד என்பதற்கு பணியாளர்கள் அல்லது அரசவையில் அரசனுக்குப் பணிபுரியும் அதிகாரிகள் என்ற பொருள் அமையலாம். ‘ஊழியர்கள்’ என்பது எபிரெயச் சொல்லின் பரப்பை அளவுக்கு மீறிக் குறுக்காமல் காக்கிறது.
- source_word: הַיְדַעְתֶּם
  choice: உங்களுக்குத் தெரியுமல்லவா?
  rationale: எதிர்மறைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் இது அனைவரும் அறிந்த ஒன்றை வலியுறுத்தும் சொல்லாட்சிக் கேள்வி; நவீன தமிழில் ‘தெரியுமல்லவா?’ அதன் இயல்பான வலிமையைத் தருகிறது.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத் நமக்குச் சொந்தமானது
  rationale: לָנוּ இங்கு உரிமைக் கோரிக்கையை உணர்த்துகிறது. இடப்பெயரின் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்ட ‘கீலேயாத்திலுள்ள ராமோத்’ பயன்படுத்தப்பட்டது.
- source_word: רָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்
  rationale: கூட்டு இடப்பெயரின் கூறுகள் ஒலிபெயர்க்கப்பட்டுள்ளன; தமிழில் இடத் தொடர்பு தெளிவாகத் தெரிய இலக்கண உறவு வெளிப்படுத்தப்பட்டது.
- source_word: מַחְשִׁים
  choice: ஒன்றும் செய்யாமல் இருக்கிறோமே
  rationale: சொல்லின் அடிப்படைப் படிமம் மௌனமாக இருப்பது; இச்சூழலில் அது குற்றம்சாட்டத்தக்க செயலின்மையைக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு அந்த இடியோமின் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִקַּחַת אֹתָהּ
  choice: அதைக் கைப்பற்ற
  rationale: கோட்டை நகரத்தை எதிரி அரசனின் கட்டுப்பாட்டிலிருந்து மீண்டும் பெறும் சூழலில் ‘கைப்பற்ற’ என்பது நடவடிக்கையின் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய மரபுத்தொடர் உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கிறது; தமிழிலும் அது புரிந்துகொள்ளத்தக்க வேதாகம நடையைத் தக்கவைக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்காலப் புவியியல் பெயரான ‘சிரியா’ என்பதற்குப் பதிலாக மூலமொழிப் பெயர் ஒலிபெயர்க்கப்பட்டது.
