translation:
  language: ta
  text: தன் தந்தையான ஆசாவின் காலத்தில் இருந்துவந்த வழிபாட்டுப் பாலியல் தொழிலாளர்களில் மீதமிருந்தவர்களையும் அவன் நாட்டிலிருந்து அகற்றினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר
  choice: மீதியானவர்களையும்
  rationale: יֶתֶר என்பது எஞ்சிய பகுதியைக் குறிக்கிறது. முந்தைய காலத்திலிருந்து இன்னும் இருந்த குழுவில் மீதியானவர்களை இயல்பான தமிழில் இவ்வாறு தெரிவிக்கிறது; וְ என்பதன் தொடர்ச்சிப் பொருளை ‘-உம்’ காக்கிறது.
- source_word: הַקָּדֵשׁ
  choice: வழிபாட்டுப் பாலியல் தொழிலாளர்கள்
  rationale: இந்த வரலாற்றுச் சூழலில் קָדֵשׁ என்பது முறைகேடான வழிபாட்டுடன் தொடர்புடைய பாலியல் செயல்பாட்டில் ஈடுபட்ட ஆணைக் குறிக்கிறது; பொதுவான ‘பரிசுத்தமானவன்’ என்பது இங்கு பொருந்தாது. எபிரெய ஒருமை ஒரு குழுவைச் சுட்டுவதால் தமிழில் பன்மை இயல்பாக உள்ளது.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: எஞ்சியிருந்த
  rationale: நִשְׁאַר முந்தைய காலத்திலிருந்து தொடர்ந்து மீந்திருந்த நிலையைச் சுட்டுகிறது. ‘எஞ்சியிருந்த’ அதன் விளைவு-நிலைப் பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: தன் தந்தை ஆசாவின் நாட்களில்
  rationale: குறிப்பிட்டவர்கள் ஆசாவின் ஆட்சிக்காலத்திலிருந்து எஞ்சியிருந்ததை காலக் குறிப்பாக நெருக்கமாகத் தெரிவிக்கிறது. தமிழில் ‘தன் தந்தை’ என்பது எழுவாயுடனான உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּעֵר
  choice: அகற்றினான்
  rationale: בער இச்சூழலில் நாட்டிலிருந்து ஒழித்தல் அல்லது அகற்றுதலைக் குறிக்கிறது. எரித்தல் அல்லது கொன்றொழித்தல் என மூலவசனம் குறிப்பிடாத முறையைச் சேர்க்காமல் உள்ளது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: הָאָרֶץ இங்கு முழு பூமியையல்ல, யூதாவின் ஆட்சிப் பரப்பைச் சுட்டுகிறது. ‘நாட்டிலிருந்து’ என்பது அந்த அரசியல்-புவியியல் பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: קָדֵשׁ என்ற பண்பாட்டு மற்றும் அறநெறி சார்ந்த சொல்லின் மொழிபெயர்ப்பு
  choice: வழிபாட்டுப் பாலியல் தொழிலாளர்கள்
  alternative: ஆண் வழிபாட்டுப் பாலியல் தொழிலாளர்கள்; வழிபாட்டுப் பணியாளர்கள்
  rationale: சொல்லின் வழிபாட்டு மற்றும் பாலியல் பரிமாணங்கள் இரண்டையும் வெளிப்படுத்துகிறது; பிற்கால மதவாதச் சொற்களைத் திணிப்பதில்லை. எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருப்பதால் பாலினத்தைத் தெளிவுபடுத்தும் மாற்றை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பாலியல் சார்ந்த சொல்லை மறைக்காமலும் இழிவான அல்லது மரபுவழிப் polemical சொல்லைப் பயன்படுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தொழிலாளர்’ என்பது இங்கு தொழிலின் சட்டபூர்வத்தன்மையை மதிப்பிடாமல் செயல்பாட்டைக் குறிக்கிறது.
