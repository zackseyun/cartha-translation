  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: ta
  text: அந்த நாளில் போர் தீவிரமடைந்தது[a]. அரசன் ஆராமுக்கு எதிரே தேரில் நிறுத்திவைக்கப்பட்டிருந்தான்[b]. மாலையில் அவன் இறந்தான்; காயத்திலிருந்து வழிந்த இரத்தம் தேரின் அடிப்பகுதியில் சேர்ந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அன்று போர் வலுத்தது”; சொல்லுக்குச் சொல்: “போர் மேலே சென்றது.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “அரசன் தேரில் நின்றுகொண்டிருந்தான்.” எபிரெய வினைவடிவம், அவன் நிற்கவைக்கப்பட்டான் அல்லது நின்ற நிலையில் தாங்கப்பட்டான் என்பதையும் உணர்த்தலாம்.'
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “தேரின் மடியில்.” இது தேரின் உட்புறத் தாழ்வான பகுதியையோ அடிப்பகுதியையோ குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: போர் தீவிரமடைந்தது
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’ என்றாலும், ‘போர்’ என்பதுடன் இது சண்டை வலுப்பட்டதைச் சுட்டும் மரபுத்தொடர். ‘தீவிரமடைந்தது’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מָעֳמָד
  choice: நிறுத்திவைக்கப்பட்டிருந்தான்
  rationale: இந்தச் செயலற்ற வினைவடிவம், அரசன் வெறுமனே நின்றான் என்பதைக் காட்டிலும், பிறரால் நிற்கவைக்கப்பட்டான் அல்லது நின்ற நிலையில் தாங்கப்பட்டான் என்ற காரணப்படுத்தப்பட்ட நிலையை உணர்த்தக்கூடும்.
- source_word: בַּמֶּרְכָּבָה
  choice: தேரில்
  rationale: போர்த்தேருக்குள் அரசன் இருந்த நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נֹכַח אֲרָם
  choice: ஆராமை எதிர்நோக்கியவாறு
  rationale: נֹכַח என்பது எதிரே அல்லது எதிர்நோக்கிய நிலையைச் சுட்டுகிறது. அசல் உரையிலுள்ள நாட்டுப் பெயரான ‘ஆராம்’ பாதுகாக்கப்படுகிறது.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: மாலையில் அவன் இறந்தான்
  rationale: காலக் குறிப்பையும் நிகழ்வையும் நேரடியாகவும் இயல்பான தமிழ் வாக்கிய அமைப்பிலும் தருகிறது.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: காயத்திலிருந்து வழிந்த இரத்தம்
  rationale: יצק என்பதன் அடிப்படைப் பொருள் ‘ஊற்று’ என்றாலும், காயத்திலிருந்து இரத்தம் நகர்வதைத் தமிழில் ‘வழிந்த’ என்பது இயல்பாகவும் காட்சித்தன்மையுடனும் தெரிவிக்கிறது.
- source_word: חֵיק הָרָכֶב
  choice: தேரின் அடிப்பகுதி
  rationale: חֵיק என்பதற்கு நேரடியாக ‘மடி/மார்பு’ என்று பொருள்; தேரைப் பொறுத்தவரை அது உள்ளேயுள்ள தாழ்வான அல்லது கீழ்ப்பகுதியைக் குறிக்கும் உருவகப் பயன்பாடு. ‘அடிப்பகுதி’ concrete sense-ஐ தெளிவாக்குகிறது.
