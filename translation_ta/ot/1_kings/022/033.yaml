  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதைத் தொடரின் இயல்பும் இராணுவச் சூழலும் பாதுகாக்கப்பட்டுள்ளன.
