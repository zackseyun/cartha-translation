id: 1KI.22.33
reference: 1 Kings 22:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: ta
  text: அப்போது, தேர்ப்படைத் தலைவர்கள் அவன் இஸ்ரவேலின் அரசன் அல்ல என்று கண்டபோது, அவனைப் பின்தொடர்வதை விட்டுத் திரும்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுக்குப் பின்னால் இருந்து” என்று உள்ளது; இது அவனைப் பின்தொடர்வதையோ துரத்துவதையோ நிறுத்தியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது
  rationale: היה என்பதன் தொடர்நிகழ்வு வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான கதைத் தொடரைக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: כִּרְאוֹת
  choice: கண்டதும்
  rationale: כְּ உடன் வரும் வினையெச்சப் பெயர்வடிவம் காலச் சூழலைக் குறிக்கிறது. இங்கு கண்டதைத் தொடர்ந்து உடனே அவர்கள் திரும்பியதால் ‘கண்டதும்’ பொருத்தமானது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும் הָרֶכֶב என்பது தேர்களையோ தேர்ப்படையையோ குறிக்கிறது. சூழலுக்கேற்ற தெளிவான தமிழாக ‘தேர்ப்படைத் தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: அவன் இஸ்ரவேலின் அரசன் அல்ல என்று
  rationale: הוּא ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; அவர்கள் துரத்திய நபரையே குறிக்கிறது. உட்பொருள் வாக்கியத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּשׁוּבוּ
  choice: திரும்பினார்கள்
  rationale: שׁוּב இச்சூழலில் ஏற்கெனவே மேற்கொண்ட துரத்தலைக் கைவிட்டுத் திரும்புவதைக் குறிக்கிறது.
- source_word: מֵאַחֲרָיו
  choice: அவனைத் துரத்துவதை நிறுத்தி
  rationale: சொல்லுக்குச் சொல் ‘அவனுக்குப் பின்னாலிருந்து’ என்றாலும், போர்ச் சூழலில் அவனைப் பின்தொடர்வதை அல்லது துரத்துவதை நிறுத்தியதைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதன் பொருள் இயல்பான தமிழில் தரப்பட்டது.
