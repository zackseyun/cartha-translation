base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: ta
  text: 'அராம் அரசன் தனக்கிருந்த முப்பத்திரண்டு தேர்ப்படைத் தலைவர்களுக்குக் கட்டளையிட்டான்: “சிறியவரோ பெரியவரோ[a] எவரையும் எதிர்த்துப் போரிடாதீர்கள்; இஸ்ரவேலின் அரசனை மட்டும் எதிர்த்துப் போரிடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறியவரோ பெரியவரோ” என்பது எந்தத் தரத்தையோ அந்தஸ்தையோ சேர்ந்தவராக இருந்தாலும் என்பதைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: அராம் அரசன்
  rationale: ו־ தொடர்ச்சியைத் தமிழ் கதைநடையின் இயல்பான இணைப்பில் வெளிப்படையாக மொழிபெயர்க்காமல் விடலாம்; אֲרָם என்ற இடப்பெயர் ‘சிரியா’ என மாற்றப்படாமல் ‘அராம்’ என வைக்கப்படுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டு … சொல்லியிருந்தான்
  rationale: கட்டளையிடுதல் என்பதே வினையின் பொருள்; அடுத்துவரும் போர்நிகழ்வுக்கு முன்பே கொடுக்கப்பட்ட கட்டளையைத் தமிழ் இறந்தகால நிறைவுவடிவம் காட்டுகிறது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும், הָרֶכֶב என்பது தேர்ப்படையையும் குறிக்கிறது; இச்சேர்க்கை நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்கிருந்த
  rationale: அவர்கள் அரசனுக்குரியவர்கள் அல்லது அவனுடன் இணைந்தவர்கள் என்ற உடைமை/தொடர்பு பொருளை இயல்பாகக் காட்டுகிறது; கட்டளை அமைப்பைப் பற்றி மேலதிகமாக ஊகிக்கவில்லை.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: முப்பத்திரண்டு
  rationale: மூலத்தின் எண்ணிக்கையை நேரடியாகத் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: לֹא תִּלָּחֲמוּ
  choice: போரிட வேண்டாம்
  rationale: பன்மை நோக்கிய தடைக் கட்டளையை இயல்பான மரியாதைப் பன்மை/பன்மைக் கட்டளை வடிவில் தருகிறது.
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  choice: சிறியவனோ பெரியவனோ எவனுடனும்
  rationale: ‘சிறியவன்—பெரியவன்’ என்ற மூல மொழியுருவைத் தக்கவைத்து, அது எந்த நிலைமையினரையும் குறிக்கும் என்பதை ‘எவனுடனும்’ தெளிவாக்குகிறது.
- source_word: כִּי אִם
  choice: மட்டும்
  rationale: விலக்கி ஒருவரை மட்டும் இலக்காக்கும் கட்டளையின் கட்டுப்படுத்தும் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனுடன் … போரிடுங்கள்
  rationale: இங்கு אֶת போரின் இலக்கைக் குறிக்கிறது; ‘உடன் போரிடு’ என்பது தமிழில் எதிர்த்துப் போரிடுதல் என இயல்பாகப் புரிகிறது.
- source_word: לְבַדּוֹ
  choice: மட்டும்
  rationale: இஸ்ரவேல் அரசன் ஒருவனே தாக்குதலின் இலக்கு என்ற தனித்துவத்தைத் தெளிவாகக் காட்டுகிறது; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
