base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: ta
  text: யோசபாத், பொன்னைப் பெறுவதற்காக ஓப்பீருக்குச் செல்ல தர்சீசுக் கப்பல்களை[a] செய்தான். ஆனால் அவை செல்லவில்லை[b]; ஏனெனில் அந்தக் கப்பல்கள் எசியோன்-கேபேரில் உடைந்துபோயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தர்சீசின் கப்பல்கள்.’ இது தர்சீசுடன் தொடர்புடைய கப்பல்களைக் குறிக்கலாம்; அல்லது தர்சீசிலிருந்து வந்த கப்பல்கள் என்று அவசியமில்லை, பெரிய கடற்பயணக் கப்பல் வகையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘செல்லவில்லை’ என்பதற்கான வினை ஒருமையில் உள்ளது; கப்பல்கள் அல்லது கப்பற்படை கூட்டாகக் குறிக்கப்படுவதாகப் பொருள் கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: செய்தான்
  rationale: மெய்யெழுத்து உரை சூழலில் ‘செய்தான்/தயாரித்தான்’ என்ற வினையாகப் புரிந்துகொள்ளப்படுகிறது; யோசபாத் எழுவாயாகவும் கப்பல்கள் செயப்படுபொருளாகவும் அமைவது இயல்பானது.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: தர்சீசுக் கப்பல்களை
  rationale: எபிரெயச் சேர்க்கைத் தொடரைச் சுருக்கமாகப் பாதுகாக்கிறது. இது தர்சீசுடன் தொடர்புடைய கப்பல்களையோ பெரிய கடற்பயணக் கப்பல் வகையையோ குறிக்கலாம்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: ஓப்பீருக்குச் செல்ல
  rationale: நோக்கத்தையும் திசையைக் குறிக்கும் இடப்பெயர் வடிவத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לַזָּהָב
  choice: பொன் கொண்டுவருவதற்காக
  rationale: ל முன்னிடைச்சொல் இங்கு பயணத்தின் நோக்கத்தைச் சுட்டுகிறது; தமிழில் வெறும் ‘பொன்னுக்காக’ என்பதைக் காட்டிலும் பொருள் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְלֹא הָלָךְ
  choice: ஆனால் அவை செல்லவில்லை
  rationale: வினை ஒருமையில் இருந்தாலும், சூழலில் கப்பல்கள் அல்லது கப்பற்படை கூட்டுப்பொருளாகக் குறிக்கப்படுகிறது; யோசபாத் செல்லவில்லை என்ற தவறான புரிதலைத் தவிர்க்கப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: נשברה
  choice: உடைந்து நாசமாயின
  rationale: שבר என்பதன் நிபால் வடிவம் ‘உடைந்தது’ என்று பொருள்படும்; கப்பல் சூழலில் விபத்தால் பயன்படாதபடி அழிந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: எசியோன் கேபேரில்
  rationale: ב இடத்தைக் குறிக்கிறது; துறைமுக இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
