  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: ta
  text: அப்போது ஆகாபின் மகன் அகசியா யோசபாத்திடம், “என் பணியாளர்கள் உங்கள் பணியாளர்களுடன் கப்பல்களில் செல்லட்டும்” என்றான். ஆனால் யோசபாத் அதற்கு சம்மதிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கால/தொடர்ச்சி குறிப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: ஆகாபின் மகன் அகசியா
  rationale: உறவுமுறையை இயல்பான தமிழ் உடைமைத் தொடரால் காட்டி, பெயர்களை வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தருகிறது.
- source_word: יֵלְכוּ
  choice: செல்லட்டும்
  rationale: இங்கு உள்ள விருப்ப/முன்மொழிவு நுணுக்கத்தை நேரடியான கட்டளையாக வலுப்படுத்தாமல் இயல்பாகக் காட்டுகிறது.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  choice: என் பணியாளர்கள் / உங்கள் பணியாளர்கள்
  rationale: அரசர்களின் கடற்பயணப் பணியாளர்களைக் குறிக்கும் சூழலில், அடிமைத்தனத்தை தேவையின்றி வலியுறுத்தாமல் எபிரெயச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בָּאֳנִיּוֹת
  choice: கப்பல்களில்
  rationale: கப்பல்களை குறிக்கும் பெயர்ச்சொல்லையும் בְּ முன்னிடைச்சொல்லையும் இயல்பான தமிழ் இடவேற்றுமையில் தருகிறது; தமிழில் இது கப்பலில் பயணிப்பதைக் குறிக்கும் வழக்கமான வடிவம்.
- source_word: וְלֹא אָבָה
  choice: ஆனால் ... அதற்கு விரும்பவில்லை
  rationale: ‘மறுத்துவிட்டான்’ என்று வலுப்படுத்தாமல், ‘விருப்பம்/இணக்கம் கொள்ளவில்லை’ என்ற எபிரெய வினையின் அடிப்படை உணர்வைத் தக்கவைக்கிறது.
