translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. அரசரின் பணியாளர்களைக் குறிக்க ‘பணியாளர்கள்’ எனத் தேர்ந்தெடுக்கப்பட்டுள்ளது. எபிரெயத்தில் உள்ள ‘கப்பல்களில்’ என்ற முன்னிடைச்சொல் தமிழில் இயல்பாக இருப்பதால் ‘கப்பல்களின்மேல்’ போன்ற தேவையற்ற மாற்றுக் குறிப்பைச் சேர்க்கவில்லை.
