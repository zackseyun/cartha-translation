  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: ta
  text: ஏதோமில் அரசன் இல்லை; நியமிக்கப்பட்ட ஒரு அதிகாரியே[a] அரசனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு ஆளுநர்’ அல்லது ‘ஒரு அரசுப் பிரதிநிதி.’ எபிரெயச் சொல் נִצָּב சொற்பொருளில் நிறுத்தப்பட்ட அல்லது நியமிக்கப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ
  choice: அரசன்
  rationale: וְ தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் அரைப்புள்ளியால் வாக்கியத் தொடர்பு இயல்பாக வெளிப்படுவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை. מֶלֶךְ என்பதற்கு ‘அரசன்’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֵין
  choice: ஒருவனும் இல்லை
  rationale: இது இல்லாமையைச் சுட்டுகிறது. வரலாற்று உரைச்சூழலில் ‘இல்லை’ இயல்பாக உள்ளது; ‘ஒருவனும்’ என்பது அரசன் இல்லாத நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בֶּאֱדוֹם
  choice: ஏதோமில்
  rationale: בְ என்ற இடப்பொருள் முன்னொட்டும் אֱדוֹם என்ற இடப்பெயரும் நேரடியாக ‘ஏதோமில்’ என வழங்கப்பட்டன.
- source_word: נִצָּב
  choice: நியமிக்கப்பட்ட ஓர் அதிகாரி
  rationale: נצב வேரின் இப்பெயரெச்ச வடிவம் நிறுத்தப்பட்ட அல்லது நியமிக்கப்பட்ட ஒருவரைக் குறிக்கிறது. அரசியல் சூழலில் கீழ்நிலை ஆட்சிப் பொறுப்பில் நியமிக்கப்பட்டவரைக் குறிக்கும் வகையில், தேவையற்ற தொழில்நுட்பத் துல்லியத்தைத் திணிக்காமல் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ
  choice: அரசனாக இருந்தான்
  rationale: இறுதியில் வரும் מֶלֶךְ, נִצָּב என்பவரின் ஆட்சிப் பங்கை பயனிலையாகக் குறிப்பிடுகிறது. எபிரெயத்தின் சுருக்கத்தையும் அவர் அரசனுடைய நிலையில் இருந்ததையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
