  text: And Jehoshaphat made peace with the king of Israel[a].
translation:
  language: ta
  text: யோசபாத் இஸ்ரவேல் அரசனுடன் சமாதானம் செய்துகொண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசபாத் இஸ்ரவேல் அரசனுடன் சமாதானமாக இருந்தான்.” எபிரேய வினைச்சொல், சமாதான உறவை ஏற்படுத்தியதையோ சமாதான நிலையில் இருந்ததையோ குறிக்கலாம்; முதன்மைப் பாடம் நிகழ்வைக் குறிக்கும் பொருளைத் தேர்ந்தெடுக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יַּשְׁלֵם
  choice: சமாதானம் செய்துகொண்டான்
  rationale: שׁלם என்பதன் ஹிஃபில் வடிவம் இங்கு சமாதான உறவை ஏற்படுத்துவதையோ சமாதான உடன்பாட்டுக்குள் வருவதையோ குறிக்கிறது. நிகழ்வைக் குறிக்கும் பொருளை இயல்பான நவீனத் தமிழில் இச்சொற்றொடர் வெளிப்படுத்துகிறது; நிலைத்திருக்கும் சமாதான நிலையைக் குறிக்கும் வாசிப்பும் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் வழக்குப் பெற்ற ஒலிபெயர்ப்பு.
- source_word: עִם
  choice: உடன்
  rationale: உறவு அல்லது கூட்டிணைப்பில் இருக்கும் மற்றொரு தரப்பைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரை நேர்த்தியாக மொழிபெயர்க்கிறது; சூழலில் அப்போது ஆட்சி செய்த வடக்கு ராஜ்யத்தின் அரசனைக் குறிக்கிறது.
