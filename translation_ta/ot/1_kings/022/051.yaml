translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘துயிலடைந்தான்’ என்ற மரபுருவகம் பாதுகாக்கப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது; ‘தந்தை’ என்ற எபிரேய வம்சவழிப் பயன்பாடும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டுள்ளது.
