source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: ta
  text: யோசபாத் தன் முன்னோர்களோடு துயிலடைந்தான்[a]. தன் தந்தையாகிய தாவீதின் நகரத்தில்[b] அவன் தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் யோராம் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்பது இறந்துபோனதைக் குறிக்கும் வழக்கமான எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘தந்தை’ என்பதற்கான எபிரேயச் சொல் வம்சவழி மொழிநடையில் ‘முன்னோர்’ அல்லது ‘மூதாதை’ என்றும் பொருள்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: அரசர்களின் மறைவைப் பதிவு செய்யும் எபிரேய மரபுத்தொடரின் ‘துயில்’ உருவகத்தைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אבות என்பது இங்கு உடனடி தந்தையரை மட்டும் அல்லாமல் வம்ச முன்னோர்களைக் குறிக்கிறது; ‘முன்னோர்கள்’ தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிபால் வினைவடிவின் செயப்பாட்டு பொருளைத் துல்லியமாகக் காட்டுகிறது; மூலத்தில் இல்லாத கல்லறை வகை போன்ற விவரங்களைச் சேர்க்கவில்லை.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயரான எபிரேயச் சேர்க்கையை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: אָבִיו
  choice: தன் தந்தையாகிய
  rationale: மூலத்தின் ‘அவன் தந்தை’ என்ற வம்சவழிப் பயன்பாட்டைத் தக்கவைக்கிறது; இங்கு ‘முன்னோர்’ என்ற விரிந்த பொருள் இருப்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: முழு ஆட்சிக்காலத்தைவிட அரியணை ஏற்ற வாரிசுரிமை நிகழ்வையே இங்கு வினை குறிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தில் மகன் ஆட்சிப் பொறுப்பை ஏற்ற வாரிசுரிமைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
