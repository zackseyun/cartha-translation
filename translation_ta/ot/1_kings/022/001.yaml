  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: ta
  text: அராமுக்கும் இஸ்ரவேலுக்கும் இடையே போர் இல்லாமல் மூன்று ஆண்டுகள் கழிந்தன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அராமுக்கும் இஸ்ரவேலுக்கும் இடையே போர் இல்லாத நிலையில் அவர்கள் மூன்று ஆண்டுகள் இருந்தார்கள்.”
    reason: எபிரெய வினைச்சொல்லின் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: ‘அராம்’ என்பது பல மொழிபெயர்ப்புகளில் ‘சீரியா’ என்று வழங்கப்படும் எபிரெயப் பெயர்.
    reason: பெயரியல் விளக்கம்.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: கழிந்தன
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘உட்காருதல்/தங்கியிருத்தல்.’ ஆனால் ‘மூன்று ஆண்டுகள்’ என்ற காலநீட்சியோடு வரும் இவ்வரலாற்று வாக்கியத்தில், போர் இல்லாத நிலை தொடர்ந்து நீடித்ததைக் குறிக்கிறது. தமிழில் ‘மூன்று ஆண்டுகள் கழிந்தன’ என்பது இயல்பாகவும் தெளிவாகவும் அப்பொருளைத் தருகிறது.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகள்
  rationale: குறிப்பிட்ட நிலை நீடித்த கால அளவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵין מִלְחָמָה
  choice: போர் இல்லாமல்
  rationale: எபிரெயச் சொற்றொடரின் ‘போர் இல்லை’ என்ற பொருளை, தமிழில் காலநீட்சி வாக்கியத்துடன் இயல்பாக இணைக்கிறது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையே
  rationale: இரு தரப்புகளுக்கிடையிலான உறவைத் தெரிவிக்கும் எபிரெயக் கட்டமைப்புக்கு இயல்பான தமிழ்ச் சமவுரு.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்காலப் புவியியல் பெயரான ‘சீரியா’ என்பதைப் பதிலாக இடாமல், எபிரெயப் பெயரை நேரடியாக எழுத்துப்பெயர்க்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவம்.
