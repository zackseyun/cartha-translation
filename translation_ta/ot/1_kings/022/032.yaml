  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தேர் தலைவர்கள்’ என்பதற்குப் பதிலாக இராணுவப் பிரிவைக் குறிக்கும் ‘தேர்ப்படைத் தலைவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
