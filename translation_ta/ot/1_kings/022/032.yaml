base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: ta
  text: அப்போது, ரதப்படைத் தலைவர்கள் யோசபாத்தைக் கண்டதும், “நிச்சயமாக இவர்தான் இஸ்ரவேலின் அரசன்” என்று சொல்லி, அவருடன் போரிடுவதற்காக அவரை நோக்கித் திரும்பினார்கள்[a]. ஆனால் யோசபாத் கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு எதிராகத் திரும்பினார்கள்.” எபிரெய வினைச்சொல், ஒருவருடன் போரிடுவதற்காக அவரை நோக்கி அல்லது அவருக்கு எதிராகத் திரும்புவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது
  rationale: எபிரெயக் கதைத் தொடரின் அறிமுகத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; ‘அது நடந்தது’ என்ற சொற்சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: כִּרְאוֹת
  choice: கண்டதும்
  rationale: כְּ உடன் வரும் infinitive construct இங்கு காலத் தொடர்பைக் காட்டுகிறது; நிகழ்வுகள் உடனுக்குடன் தொடர்வதையும் ‘கண்டதும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும் הָרֶכֶב என்பது தேர்களைக் கொண்ட படைப்பிரிவையும் குறிக்கிறது; இந்தத் தேர்வு சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: இங்கு கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட, அவர்கள் உறுதியாகச் செய்த தவறான அடையாளப்படுத்துதலை வலியுறுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: இவன்தான் இஸ்ரவேலின் அரசன்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயரையும் அடையாளப்படுத்துதலின் வலியுறுத்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: அவனை நோக்கித் திரும்பினார்கள்
  rationale: סור உடன் עַל வரும்போது ஒருவரை நோக்கி அல்லது அவருக்கு எதிராகத் திரும்புதல் எனப் பொருள்படலாம். திசை சார்ந்த அடிப்படைப் பொருளை முதன்மை உரை தக்கவைக்கிறது; அடுத்த சொற்றொடர் பகைமையான நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: לְהִלָּחֵם
  choice: அவனுடன் போரிடுவதற்காக
  rationale: לחם வினையின் Niphal infinitive இங்கு போரில் ஈடுபடுவதைக் குறிக்கிறது; ‘தாக்க’ என்பதைவிட ‘போரிட’ மூலத்தின் விரிவான பொருளைத் தக்கவைக்கிறது.
- source_word: וַיִּזְעַק
  choice: கூக்குரலிட்டான்
  rationale: זעק என்பது பொதுவாக உரத்த, அவசரமான அல்லது துயரமிக்க கூக்குரலைக் குறிக்கிறது; வசனத்தில் இல்லாத சொற்களைச் சேர்க்காமல் அதன் தீவிரத்தை வெளிப்படுத்துகிறது.
