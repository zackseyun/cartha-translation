  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: ta
  text: மூன்றாம் ஆண்டில், யூதாவின் அரசனான யோசபாத் இஸ்ரவேலின் அரசனிடம் இறங்கிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறங்கி வந்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘இறங்குதல்’; அது சாதாரணப் பயணத்துடன் நிலவியல் உயர வேறுபாட்டையும் சுட்டிக்காட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: மூன்றாம் ஆண்டில்
  rationale: היה என்பதன் தொடர்கதை வடிவம் இங்கு காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட, காலக் குறிப்போடு நேரடியாகத் தொடங்குவது இயல்பாகவும் அதன் செயல்பாட்டைத் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: மூன்றாம் ஆண்டில்
  rationale: எபிரெய மூலத்தின் வரிசை எண்ணையும் குறிப்பிட்ட ஆண்டு என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றார்
  rationale: ירד என்பதன் அடிப்படைப் பொருளான கீழ்நோக்கிய பயணத்தை ‘இறங்கி’ என்பதும், பேசுபவரிடமிருந்து வேறோர் இடத்துக்குச் செல்லும் நிகழ்வை ‘சென்றார்’ என்பதும் காக்கின்றன. இது வெறும் ‘சென்றார்’ என்பதைவிட மூலத்தின் நிலவியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான
  rationale: இது யோசபாத்தின் அரசப் பதவியைக் குறிக்கும் இணைப்புச் சொற்றொடர். ‘அரசனான’ என்பது தமிழில் பெயருடன் இயல்பாக இணைகிறது.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனிடம்
  rationale: אֶל குறிக்கும் ஒருவரை நோக்கிய இயக்கத்தை ‘அரசனிடம்’ நேரடியாக வெளிப்படுத்துகிறது; அரசியல் அடையாளமும் காக்கப்படுகிறது.
