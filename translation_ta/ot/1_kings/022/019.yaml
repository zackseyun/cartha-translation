  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: ta
  text: 'அப்போது அவன் கூறினான்: “ஆகவே, யாவேயின் வார்த்தையைக் கேளும்: யாவே தமது அரியணையில் அமர்ந்திருப்பதையும், வானத்தின் படை அனைத்தும்[a] அவருக்கு அருகில்[b], அவரது வலப்பக்கத்திலும் இடப்பக்கத்திலும் நிற்பதையும் நான் கண்டேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்தின் முழுச் சேனை” அல்லது “வானுலகப் படை அனைத்தும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “அவர்மேல் நின்று”; இச்சூழலில், அவரது வலப்பக்கத்திலும் இடப்பக்கத்திலும் பணிவிடைக்காக நிற்பதை இது குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் முடிவு அல்லது விளைவைச் சுட்டும் இணைப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שְׁמַע
  choice: கேளும்
  rationale: ஒருமையில் நேரடியாகக் கூறப்படும் கட்டளையின் தீர்க்கதரிசனத் தீவிரத்தையும் மரியாதைமிக்க நடையையும் காக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: வழக்கமான தீர்க்கதரிசனச் சொற்றொடரைப் பாதுகாத்து, தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: רָאִיתִי
  choice: நான் கண்டேன்
  rationale: மீகாயா அறிவிக்கும் தரிசன அனுபவத்தை இயல்பான இறந்தகாலத்தில் தருகிறது.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: தமது அரியணையில் அமர்ந்திருப்பது
  rationale: தொடர்நிலைப் பங்கேற்புவினை காட்டும் அரியணைக் காட்சியை மிகைப்படுத்தாமல் தெளிவாகக் காக்கிறது.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: வானத்தின் படையனைத்தும்
  rationale: பரலோக அரசவையையோ படையையையோ குறிக்கக்கூடிய கூட்டுப்படிமத்தை ‘தேவதூதர்கள்’ என்று குறுக்காமல் பாதுகாக்கிறது.
- source_word: עֹמֵד
  choice: நிற்பது
  rationale: கூட்டுப் பெயருடன் வரும் எபிரெய ஒருமைப் பங்கேற்புவினைக்கு இணையாகக் காட்சியின் தொடர்நிலையைத் தருகிறது.
- source_word: עָלָיו
  choice: அவருக்கு அருகில்
  rationale: சொல்லுக்கு சொல் ‘அவர்மேல்’ என்றாலும், வலப்பக்கத்திலும் இடப்பக்கத்திலும் நிற்கும் அரசவைச் சூழலில் உடனிருப்பதைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: அவரது வலப்பக்கத்திலும் இடப்பக்கத்திலும்
  rationale: எபிரெயத்தின் இடவியல் சமச்சீரைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: அரியணைத் தரிசனத்தில் יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் காக்கிறது.
- issue: כָל צְבָא הַשָּׁמַיִם என்பதன் பரலோக அரசவை/படைப் படிமம்
  choice: வானத்தின் படையனைத்தும்
  alternative: வானத்தின் தேவதூதர்கள் அனைவரும்
  rationale: இச்சொற்றொடரை தேவதூதர்களுக்கு மட்டும் வரையறுக்காமல், அதன் படை மற்றும் அரசவை சார்ந்த உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
- issue: עָלָיו என்பதன் இடவியல் பொருள்
  choice: அவருக்கு அருகில்
  alternative: அவர்மேல்
  rationale: அடுத்துவரும் ‘வலப்பக்கத்திலும் இடப்பக்கத்திலும்’ என்பது அரசருக்கு அருகில் பணிவிடைக்காக நிற்கும் காட்சியை விளக்குகிறது; அதேவேளை சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தீர்க்கதரிசன உரைக்கு ஏற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. கடவுளைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பரலோகப் படையின் இயல்பு தேவதூதர்கள் எனத் தனிப்படுத்தப்படவில்லை.
