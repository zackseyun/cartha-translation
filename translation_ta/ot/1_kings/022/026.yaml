base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் ராஜா, “மிகாயாவை அழைத்துக்கொண்டு, நகர அதிகாரியான[a] ஆமோனிடமும் ராஜாவின் மகன் யோவாஸிடமும் திரும்பக் கொண்டுபோ” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நகரத்தின் படைத்தளபதி” அல்லது “நகரத்தின் தலைமை அதிகாரி.” இந்த எபிரெயப் பட்டம் நகர நிர்வாகத்திலோ இராணுவத்திலோ தலைமை வகித்த ஓர் அதிகாரியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ராஜா
  rationale: எபிரெய உரை ஆகாபின் பெயரைக் குறிப்பிடாமல் அவரது பட்டத்தையே பயன்படுத்துவதால் அதையே தக்கவைக்கிறது.
- source_word: קַח אֶת מִיכָיְהוּ
  choice: மிகாயாவை அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்/கொண்டுசெல்’ என்பதை இயல்பான தமிழில் தருகிறது; ‘பிடித்து’ என்று மொழிபெயர்த்து வன்முறையை மேலதிகமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַהֲשִׁיבֵהוּ
  choice: திரும்பக் கொண்டுபோ
  rationale: שוב என்பதன் ஹிஃபீல் வடிவிலுள்ள ‘அவனைத் திரும்பச் செல்லச் செய்/திரும்பக் கொண்டுபோ’ என்ற காரணவினைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: שַׂר הָעִיר
  choice: நகர அதிகாரி
  rationale: שַׂר என்பது நிர்வாக அல்லது இராணுவத் தலைமை அதிகாரியைக் குறிக்கக்கூடும். சூழல் அதைத் துல்லியமாக வரையறுக்காததால், பொதுவான ‘நகர அதிகாரி’ என்பதை முதன்மை உரையில் பயன்படுத்தி மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: ராஜாவின் மகன்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பாகவும் நேரடியாகவும் தருகிறது; மூலத்தில் இல்லாத ‘இளவரசன்’ என்ற பட்டத்தைச் சேர்க்கவில்லை.
