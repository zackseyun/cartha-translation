source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: ta
  text: 'மிகாயா கூறினார்: “யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக, யாவே என்னிடம் எதைச் சொல்வாரோ, அதையே நான் பேசுவேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறினார்
  rationale: வழக்கமான எபிரெயக் கதைநடை வினை; தமிழில் இயல்பான கதைத் தொடராக அமைகிறது.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: இந்தத் தனிப்பெயரின் தமிழில் அறியப்பட்ட, இயல்பான ஒலிபெயர்ப்பு.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  rationale: இது ஓர் ஆணையுறுதி மொழி. சொற்சொல்லான வடிவத்தைவிட அதன் உறுதியான சத்தியப்பிரமாண வலிமையை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: כִּי אֶת אֲשֶׁר
  choice: என்ன ... ஓ, அதையே
  rationale: உறுதிமொழியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் தொடர்புக் கட்டமைப்பையும், பின்னர் வரும் மீள்சுட்டுப் பெயரையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: יֹאמַר יְהוָה אֵלַי
  choice: யாவே என்னிடம் என்ன சொல்கிறாரோ
  rationale: முடிவுறாத வினையின் சூழல்சார் எதிர்கால/பொதுப்பொருளைத் தமிழ் தொடர்புவினை அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: அதையே நான் பேசுவேன்
  rationale: אֹתוֹ வின் வலியுறுத்தப்பட்ட மீள்சுட்டுப் பொருளை ‘அதையே’ காக்கிறது; דבר என்பதற்கு ‘பேசுவேன்’ நேரான பொருத்தம்.
theological_decisions:
- issue: இறைப்பெயர் יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதற்கான பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பு; பட்டப்பெயரைப் பதிலிடுவதில்லை.
- issue: חַי יהוה என்ற ஆணையுறுதி மொழி
  choice: உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  alternative: யாவே உயிரோடிருக்கிறார் என்பதின்மேல் ஆணையாக
  rationale: இது வெறும் இறையியல் கூற்றல்ல, தீர்க்கதரிசியின் solemn oath என்பதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது; அதேவேளை உறுதிமொழியின் ஆதாரம் யாவேயின் உயிருள்ள தன்மை என்பதையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் ஆணையுறுதி நயமும், ‘அதையே’ என்ற வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
