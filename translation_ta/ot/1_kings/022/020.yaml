base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: ta
  text: யாவே[a], “ஆகாப் ராமோத்-கீலேயாத்துக்குப் போய் அங்கே வீழும்படி அவனை யார் தூண்டுவார்?” என்றார். ஒருவர் இவ்வாறு கூறினார்; மற்றொருவர் அவ்வாறு கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூண்டுவார்” என்பதற்குப் பதிலாக “இணங்கச் செய்வார்” என்றும், இச்சூழலில் “ஏமாற்றுவார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְפַתֶּה
  choice: தூண்டிவிட்டு
  rationale: பியேல் வடிவம் தூண்டுதல், இணங்கச் செய்தல், ஏமாற்றுதல் ஆகிய பொருள் நிழல்களைக் கொண்டிருக்கலாம். முதன்மை உரையில் நேரடியாக ‘ஏமாற்றுதல்’ என்று தீர்மானிக்காமல், ஒருவரை ஒரு செயலுக்குத் தூண்டும் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: וְיַעַל
  choice: போய்
  rationale: ராமோத் உயர்நிலப் பகுதியாக இருந்ததால் எபிரெயில் ‘ஏறிப்போதல்’ வருகிறது; இலக்கை நோக்கிச் செல்வதை நவீனத் தமிழில் இயல்பாகக் கூற ‘போய்’ பயன்படுத்தப்படுகிறது.
- source_word: וְיִפֹּל
  choice: வீழும்படி
  rationale: נפל என்பதன் அடிப்படைப் பொருளான ‘விழுதல்/வீழ்தல்’ காக்கப்படுகிறது; போர்ச் சூழலில் உள்ள தோல்வி அல்லது மரணக் குறிப்பை விரிவுபடுத்தவில்லை.
- source_word: בְּרָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்தில்
  rationale: இடப்பெயரின் இரு கூறுகளையும் தெளிவாக அடையாளப்படுத்தும் இயல்பான தமிழாக்கம்; בְ முன்னிடைச்சொல்லின் இடப்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: ஒருவர் ஒரு விதமாகவும், மற்றொருவர் வேறொரு விதமாகவும் சொன்னார்கள்
  rationale: வெவ்வேறு பேச்சாளர்கள் வெவ்வேறு ஆலோசனைகளை முன்வைத்தனர் என்ற எபிரெயச் சொற்றொடரின் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆகாபின் வீழ்ச்சியில் யாவேயின் நேரடியான பங்கு
  choice: ஆகாபைத் தூண்டி அவன் சென்று வீழும்படி செய்வது யார் என்று யாவே கேட்பதாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இறைச் செயலாண்மையைக் குறைக்கும் வகையில் ‘ஆகாபின் மனத்தில் எண்ணத்தை ஏற்படுத்துவது யார்?’ என்று மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை யாவேயே பரலோக ஆலோசனையில் இந்தக் கேள்வியைத் தொடங்குவதாகச் சொல்கிறது. அதிலுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ என்ற இறைப்பெயர் பாதுகாக்கப்பட்டுள்ளது; வாக்கியத்தின் தெய்வீகச் செயலாண்மையும் ‘வீழ்தல்’ என்ற போர்ச் சூழல் உருவகமும் மென்மைப்படுத்தப்படவில்லை.
