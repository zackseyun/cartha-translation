source:
  edition: WLC
  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ta
  text: யோசபாத் அரசனாகத் தொடங்கியபோது அவருக்கு முப்பத்தைந்து வயது இருந்தது. அவர் எருசலேமில் இருபத்தைந்து ஆண்டுகள் ஆட்சி செய்தார். அவருடைய தாயின் பெயர் அசூபாள்; அசூபாள் சில்கியின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தனிப்பெயர் தமிழில் வழக்கிலுள்ள வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டது.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: அவருக்கு முப்பத்தைந்து வயது
  rationale: ‘முப்பத்தைந்து ஆண்டுகளின் மகன்’ என்ற எபிரேய வயதுக் குறிப்பை இயல்பான நவீன தமிழில் பொருளுக்கு இணையாக வழங்குகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: இங்கு அரசாட்சியின் தொடக்க நேரத்தைக் குறிக்கும் வடிவம்; ‘அரசனானபோது’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: இருபத்தைந்து ஆண்டுகள்
  rationale: ஆட்சிக்கால அளவை நேரடியாகக் குறிக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: அரசர் குறித்த வரலாற்றுச் செய்தியில் מלך என்பதற்கு இயல்பான தமிழ் வினைச்சொல்.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடப்பெயரும் அதனுடன் சேர்ந்த இடவேற்றுமையும் தெளிவாக வழங்கப்பட்டுள்ளன.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: அரச மரபுச் செய்தியின் பொருளையும் வடிவத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עֲזוּבָה
  choice: அசுபாள்
  rationale: தனிப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: בַּת שִׁלְחִי
  choice: சில்கியின் மகள்
  rationale: எபிரேய மரபுவழிக் குறிப்பை நேரடியாக வழங்கி, சில்கி என்ற தனிப்பெயரை ஒலிபெயர்க்கிறது.
