translation_notes:
  register: நவீன தரமான தமிழில், வரலாற்று நூலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் அரச ஆட்சிச் சுருக்கச் சூத்திரமும் இறுதியிலுள்ள வினாவடிவமும் பாதுகாக்கப்பட்டுள்ளன; வெளிப்படையான காலச் சொல்லில்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை.
