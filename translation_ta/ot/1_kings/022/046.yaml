base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோசபாத்தின் மற்ற செயல்களும், அவர் வெளிப்படுத்திய வல்லமையும்[a], அவர் எவ்வாறு போரிட்டார் என்பதும் யூதாவின் அரசர்களுடைய நாளாகமப் புத்தகத்தில் எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் செய்த வீரச் செயல்களும்.” எபிரெய மொழியில் “அவருடைய வல்லமை” என்பதுடன் “அவர் செய்த” என்பது இணைக்கப்பட்டுள்ளது; இது செயலில் வெளிப்பட்ட வலிமை அல்லது வீரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்களும்
  rationale: அரசரின் ஆட்சிச் சுருக்கச் சூத்திரத்தில் יֶתֶר דִּבְרֵי என்பது எஞ்சிய சொற்களை அல்ல, பதிவாகியுள்ள மற்ற செயல்களை அல்லது நிகழ்வுகளைக் குறிக்கிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பைத் தொடர்கிறது.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: அவர் வெளிப்படுத்திய வல்லமையும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர் செய்த வல்லமை’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பாக இல்லை; இச்சொற்றொடர் செயலில் காட்டப்பட்ட வலிமை அல்லது வீரத்தைச் சுட்டுவதால் ‘வெளிப்படுத்திய வல்லமை’ என வழங்கப்படுகிறது.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: அவர் எவ்வாறு போர் செய்தார் என்பதும்
  rationale: נלחם என்பதன் போரிடுதல் என்ற பொருளையும், தொடர்புத் தொடரின் விரிவான வரலாற்றுச் சுட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: மூலத்தின் எதிர்மறை வினாவடிவத்தையும் ஆதார நூலைச் சுட்டும் வழக்கமான வரலாற்றுச் சூத்திரத்தையும் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்களுடைய நாளாகமப் புத்தகத்தில்
  rationale: அரசர்களைப் பற்றிய அதிகாரப்பூர்வ நிகழ்வுப் பதிவைக் குறிக்கும் நூற்பெயரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
