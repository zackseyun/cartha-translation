  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: ta
  text: அரசன் இறந்தான்; அவனுடைய உடல் சமாரியாவுக்குக் கொண்டுவரப்பட்டது[a]. அவர்கள் அரசனைச் சமாரியாவில் அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அரசன் இறந்தான்; அவன் சமாரியாவுக்கு வந்தான்.” அரசன் இறந்தபின் அவனுடைய உடல் சமாரியாவுக்குக் கொண்டுவரப்பட்டது என்பதே இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் Qal தொடர் இறந்தகால வடிவம் கதையின் அடுத்த நிகழ்வாக மரணத்தைக் குறிக்கிறது; நவீன தமிழில் ‘இறந்தான்’ இயல்பான நேரடி இணை.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட ஆகாபைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல். மூலத்தில் தனிப்பெயர் இல்லாததால் ‘ஆகாப்’ என்று சேர்க்காமல் ‘அரசன்’ எனவே வைக்கப்பட்டது.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: அவனுடைய உடல் சமாரியாவுக்குக் கொண்டுவரப்பட்டது
  rationale: எபிரெய வடிவம் சொல்லுக்குச் சொல் ‘அவன் சமாரியாவுக்கு வந்தான்’ என்றாலும், அரசன் இறந்தபின் அவனது உடல் அங்கு எடுத்துவரப்பட்டது என்பதே சூழல்சார் பொருள். தமிழில் குழப்பமின்றி இயல்பாகத் தெரிவிக்க உடலும் கொண்டுவரப்படுதலும் வெளிப்படுத்தப்பட்டன; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַיִּקְבְּרוּ
  choice: அவர்கள் ... அடக்கம் செய்தார்கள்
  rationale: மூன்றாம் நபர் பன்மை வினைக்கு மூலத்தில் செய்பவர்கள் குறிப்பிடப்படவில்லை; ‘அவர்கள்’ அந்தக் குறிப்பிடப்படாத பன்மை எழுவாயைப் பாதுகாக்கிறது.
- source_word: אֶת הַמֶּלֶךְ
  choice: அரசனை
  rationale: மூலத்தில் ‘அரசன்’ மீண்டும் சொல்லப்படுவதால், ‘அவனை’ என்று மாற்றாமல் அந்த மறுபயன்பாடு பாதுகாக்கப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு அடக்கம் நிகழ்ந்த இடத்தைக் குறிக்கிறது; ‘சமாரியாவில்’ அதன் நேரடியான தமிழ் இணை.
