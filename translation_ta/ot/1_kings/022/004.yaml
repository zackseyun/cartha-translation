  text: וַ/יֹּ֨אמֶר֙ אֶל יְה֣וֹשָׁפָ֔ט הֲ/תֵלֵ֥ךְ אִתִּ֛/י לַ/מִּלְחָמָ֖ה רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר יְהֽוֹשָׁפָט֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: ta
  text: அவன் யோசபாத்திடம், “ராமோத்-கிலேயாத்திற்குப் போரிட என்னுடன் செல்லுவீர்களா?” என்று கேட்டான். யோசபாத் இஸ்ரவேலின் அரசனிடம், “நான் உம்மைப்போலவே இருக்கிறேன்; என் மக்கள் உமது மக்களைப்போலவே; என் குதிரைகள் உமது குதிரைகளைப்போலவே[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “என் மக்கள் உமது மக்களைப்போலவும், என் குதிரைகள் உமது குதிரைகளைப்போலவும் [இருக்கிறார்கள்]” எனலாம். எபிரேயத்தில் இது வினைச்சொல் இல்லாத, கூட்டுறவைச் சுட்டும் சுருக்கமான ஒப்புமைத் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: என்னுடன் வருவீர்களா?
  rationale: கேள்வித் துகளுடன் வரும் வினைச்சொல் நேரடியான அழைப்பைக் குறிக்கிறது. இலக்கு இடத்துக்கான கூட்டுப் பயணத்தை இயல்பான தமிழில் ‘வருவீர்களா’ என்று கூறுவது பொருத்தமானது; ‘என்னுடன்’ என்பது உடன்செல்லுதலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: இங்கு போருக்குச் சென்று அதில் ஈடுபடுதல் பொருள். ‘போரிட’ என்பது அந்த நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்
  rationale: எபிரெய இடப்பெயரின் இரு கூறுகளையும் காக்கிறது; நவீன தமிழில் இடத்தின் தொடர்பைத் தெளிவாக்க ‘கிலேயாத்திலுள்ள’ பயன்படுத்தப்பட்டது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் உறவை நேரடியாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: நான் உம்மைப்போல்
  rationale: வினைச்சொல் இல்லாத சுருக்கமான ஒப்புமைத் தொடரைத் தமிழிலும் சுருக்கமாகக் காக்கிறது; இது தன்மையிலான முழு ஒற்றுமையைக் காட்டுவதாக விளக்காமல் கூட்டுறவு அறிவிப்பின் நெருக்கத்தைப் பாதுகாக்கிறது.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: என் மக்களும் உமது மக்களைப்போல்
  rationale: மூலத்தின் இணையான, வினையற்ற அமைப்பைப் பாதுகாத்து, தொடர்ச்சியை இயல்பாக்க ‘உம்’ சேர்க்கப்பட்டது.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: என் குதிரைகளும் உமது குதிரைகளைப்போல்
  rationale: சוּס என்பதன் நேரடியான ‘குதிரைகள்’ என்ற பொருளைக் காக்கிறது; ‘குதிரைப்படை’ அல்லது ‘இராணுவம்’ என்று பொருளை விரிவாக்கவில்லை.
theological_decisions:
- issue: யோசபாத்தின் பதிலில் வெளிப்படும் ஒற்றுமையின் பரப்பு
  choice: மூலத்தின் சுருக்கமான ஒப்புமைத் தொடர்களை அப்படியே பாதுகாத்தல்
  alternative: ‘நானும் என் படைகளும் முழுமையாக உமக்குத் துணைநிற்போம்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்தக் கூற்று அரசியல் மற்றும் இராணுவக் கூட்டுறவைச் சுட்டினாலும், எபிரெய உரை அதன் துல்லியமான வரம்பை விளக்கவில்லை. ஆகவே அதன் செறிவையும் உள்ளார்ந்த பதற்றத்தையும் மொழிபெயர்ப்பு தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அரசவைக் கூற்று. அரசர்களுக்கிடையேயான உரையாடல் என்பதால் ‘நீர்/உமது’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மும்மடங்கு இணை அமைப்பும் செறிவும் இயன்றவரை காக்கப்பட்டுள்ளன.
