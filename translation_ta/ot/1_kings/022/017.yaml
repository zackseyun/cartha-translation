source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: ta
  text: 'அவர் கூறினார்: “மேய்ப்பன் இல்லாத ஆடுகளைப் போல இஸ்ரவேலர் அனைவரும் மலைகளில் சிதறியிருப்பதை நான் கண்டேன். அப்போது யாவே, ‘இவர்களுக்கு எஜமான் இல்லை[a]; ஒவ்வொருவனும்[b] தன் வீட்டுக்குச் சமாதானத்துடன் திரும்பட்டும்’ என்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இச்சொல் வடிவில் பன்மையாக இருப்பதால், “எஜமான்கள் இல்லை” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் ஆளும் தலைவன் இல்லாத நிலையை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒவ்வொருவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: சிதறியிருப்பதை
  rationale: பוץ வேரிலிருந்து வரும் இச்சொல் பல இடங்களில் பரவிச் சிதறியிருக்கும் நிலையைக் குறிக்கிறது. தோல்வியுற்று தலைவனின்றி சிதறிய படை என்ற காட்சியை இயல்பான தமிழில் இது தக்கவைக்கிறது.
- source_word: אֶל הֶהָרִים
  choice: மலைகளில்
  rationale: אֶל பொதுவாக ‘நோக்கி’ எனப் பொருள்படலாம்; ஆனால் சிதறியிருக்கும் நிலையை விவரிக்கும் இச்சூழலில் இடத்தைக் குறிக்கும் ‘மலைகளில்’ என்பது இயல்பாகவும் காட்சிக்கு ஏற்றதாகவும் உள்ளது.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: மேய்ப்பன் இல்லாத ஆடுகளைப் போல
  rationale: மூலத்திலுள்ள நேரடியான உவமையையும் மேய்ப்பனற்ற மந்தையின் காட்சியையும் தெளிவான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; அதை ஒரு பட்டப்பெயரால் மாற்றவில்லை.
- source_word: אֲדֹנִים
  choice: எஜமான்
  rationale: எபிரெயச் சொல் வடிவில் பன்மையாக இருந்தாலும், சூழலில் படையை ஆளும் தலைவனாகிய அரசன் இல்லாத நிலையே சுட்டப்படுகிறது. ‘எஜமான்’ அதிகார உறவைத் தக்கவைத்து தமிழில் இயல்பாக ஒலிக்கிறது; பன்மை வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ஒவ்வொருவனும் தன் வீட்டுக்குத் திரும்பட்டும்
  rationale: இங்குள்ள வினை வடிவத்தின் அனுமதி அல்லது கட்டளை நுணுக்கத்தை ‘திரும்பட்டும்’ வெளிப்படுத்துகிறது. אִישׁ ஆண்பால் ஒருமை பகிர்வுச் சொல்லாக இருப்பதால் ‘ஒவ்வொருவனும்’ என்று தரப்பட்டுள்ளது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: மூலத்தின் ‘சமாதானத்தில்’ என்ற வழக்குச் சொல்லை நெருக்கமாகத் தக்கவைக்கிறது; பாதுகாப்பாகத் திரும்புதல் என்ற உட்பொருளையும் முற்றிலும் நீக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரைப் பதிலிடாமல் தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אֲדֹנִים என்பதன் எண்ணும் பொருளும்
  choice: இவர்களுக்கு எஜமான் இல்லை
  alternative: இவர்களுக்கு எஜமான்கள் இல்லை
  rationale: எபிரெய வடிவம் பன்மை; எனினும் உடனடி சூழல் இஸ்ரவேல் படையின் ஆளும் தலைவனாகிய அரசனை இழப்பதைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான ஒருமை வைக்கப்பட்டு, உண்மையான வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பகிர்வுப் பொருளுடைய ஆண்பால் אִישׁ
  choice: ஒவ்வொருவனும்
  alternative: ஒவ்வொருவரும்
  rationale: மூலச் சொல் ஆண்பால் ஒருமையில் உள்ளது. படைவீரர்களைக் குறிக்கும் சூழலிலும் இந்த வடிவம் பொருந்துவதால் பாலினச் சுட்டை நீக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிதறியிருப்பதை’, ‘மேய்ப்பன் இல்லாத ஆடுகளைப் போல’ ஆகியவை தீர்க்கதரிசனக் காட்சியை இயல்பாகக் காக்கின்றன. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. ஆட்சியதிகாரத்தைக் குறிக்கும் ‘எஜமான்’ என்ற சொல் சூழலுக்கேற்ப ஒருமையில் தரப்பட்டாலும், மூலத்தின் பன்மை வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
