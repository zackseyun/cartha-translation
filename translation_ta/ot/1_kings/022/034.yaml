base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: ta
  text: ஆனால் ஒருவன் குறிப்பிட்ட இலக்கை நோக்காமல்[a] வில்லை இழுத்து எய்தினான்; அவன் இஸ்ரயேலின் அரசனை கவசத்தின் இணைப்புகளுக்கும் உடற்கவசத்துக்கும் இடையில்[b] தாக்கினான். அப்போது அரசன் தன் தேரோட்டியிடம், “தேரைத் திருப்பி[c], என்னைப் படையிலிருந்து வெளியே கொண்டுபோ; ஏனெனில் நான் காயமடைந்திருக்கிறேன்[d]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: לְתֻמּוֹ என்ற எபிரெயச் சொற்றொடரை “தன் குற்றமின்மையில்,” “குறிவைக்காமல்,” அல்லது “தற்செயலாக” என்றும் மொழிபெயர்க்கலாம். இங்கு வில்லாளி குறிப்பிட்ட ஒருவரை இலக்காகக் கொள்ளாமல் எய்தினான் என்பதே வாய்ப்புள்ள பொருள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “தெவாக்கீம் என்பவற்றுக்கும் ஷிர்யோனுக்கும் இடையில்” என்று உள்ளது. இவை கவசத்தின் வெவ்வேறு பகுதிகளையோ அவற்றுக்கு இடையிலுள்ள இடுக்கையையோ குறிக்கலாம்; இத்தொழில்நுட்பச் சொற்களின் துல்லியமான பொருள் உறுதியில்லை.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் நேரடியாக “உன் கையைத் திருப்பு” என்று உள்ளது; இது தேரைத் திருப்பி இயக்குவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: d
    text: இங்குள்ள எபிரெய வினைச்சொல் “நோயுற்றிருக்கிறேன்” அல்லது “காயமடைந்திருக்கிறேன்” என்று பொருள்படலாம்; அம்பு தாக்கிய இச்சூழலில் காயத்தையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஆனால் ஒருவன்
  rationale: וְ என்ற இணைப்பை முந்தைய நிகழ்வுடன் உள்ள எதிர்மாற்றைக் காட்ட ‘ஆனால்’ என்றும், אִישׁ என்பதை இயல்பாக ‘ஒருவன்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: வில்லை எய்தான்
  rationale: சொல்லுக்குச் சொல் ‘வில்லில் இழுத்தான்’ என்றாலும், இச்சூழலில் வில்லை இழுத்து அம்பு எய்திய முழுச் செயலை இயல்பான தமிழில் ‘வில்லை எய்தான்’ எனக் கூறுகிறது.
- source_word: לְתֻמּוֹ
  choice: குறிப்பிட்ட இலக்கை நோக்காமல்
  rationale: இப்போர்ச் சூழலில் இது அறநெறிசார் ‘குற்றமற்ற தன்மையை’ விட, குறிப்பிட்ட ஒருவரைக் குறிவைக்காமல் எய்தியதைக் குறிக்கிறது; எய்தல் தற்செயலாக நடந்தது என்ற தவறான எண்ணத்தைத் தவிர்க்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּכֶּה
  choice: அந்த அம்பு ... தாக்கியது
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘தாக்கு’ என்பதைக் காக்கிறது. தமிழில் நிகழ்வைத் தெளிவாகவும் இயல்பாகவும் சொல்ல, மூலத்தில் உள்ளடங்கிய அம்பு வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: கவசத்தின் இணைப்புகளுக்கும் மார்புக்கவசத்துக்கும் இடையில்
  rationale: முதற்சொல் இணைக்கப்பட்ட அல்லது பொருத்தப்பட்ட கவசப் பகுதிகளைக் குறிக்கலாம்; இரண்டாவது உடற்கவசத்தைக் குறிக்கிறது. தொழில்நுட்பப் பொருள் உறுதியற்றதால் வாசிக்கத்தக்க பொதுவான சொற்கள் பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: לְרַכָּבוֹ
  choice: தன் தேரோட்டியிடம்
  rationale: இது தேரையே அல்ல, அதைச் செலுத்துபவரைக் குறிக்கிறது; ‘தேரோட்டி’ தற்போதைய தமிழில் தெளிவான இணைச்சொல்.
- source_word: הֲפֹךְ יָדְךָ
  choice: தேரைத் திருப்பி
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘உன் கையைத் திருப்பு’ என்று இருந்தாலும், தேரை இயக்கித் திருப்புமாறு கூறும் மரபுத்தொடராக இங்கு செயல்படுகிறது. இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடிச் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: என்னைப் படையிலிருந்து வெளியே கொண்டுபோ
  rationale: מַחֲנֶה என்பது பாளையத்தையோ படையையோ குறிக்கலாம். போர் நடந்துகொண்டிருக்கும் இச்சூழலில் ‘படையிலிருந்து’ என்பது பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי הָחֳלֵיתִי
  choice: ஏனெனில் நான் காயமடைந்திருக்கிறேன்
  rationale: வினைச்சொல் நோயுற்றிருத்தல் அல்லது பலவீனமடைதல் என்றும் பொருள்படலாம்; அம்பு தாக்கிய உடனடியான சூழலில் அது காயமடைந்த நிலையைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘மிகவும்’ போன்ற தீவிரச் சொல் சேர்க்கப்படவில்லை.
