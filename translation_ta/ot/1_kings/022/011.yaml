  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: ta
  text: 'அப்போது கெனானாவின் மகன் சிதேக்கியா தனக்காக இரும்புக் கொம்புகளைச் செய்து, “யெகோவா இவ்வாறு கூறுகிறார்: இவற்றால் நீ அராமியரை அவர்களை அழித்துமுடிக்கும்வரை முட்டித் தாக்குவாய்” என்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: இரும்புக் கொம்புகள்
  rationale: எபிரெய உருவகச் செயலின் கண்கூடான பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲרָם
  choice: சீரியர்கள்
  rationale: இங்கு போர் எதிரியாகக் குறிப்பிடப்படுவது அராம் தேசத்தாராக இருப்பதால், நவீன வாசகருக்குத் தெளிவாக மக்களைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תְּנַגַּח
  choice: முட்டித் தள்ளுவாய்
  rationale: கொம்புகளால் தாக்குதல் அல்லது முட்டுதல் என்ற வினையின் வலிமையையும், செய்யப்பட்ட இரும்புக் கொம்புகளுடனான சொல்லோவியத்தையும் தக்கவைக்கிறது.
- source_word: עַד כַּלֹּתָם
  choice: முற்றிலும் அழிக்கும்வரை
  rationale: எதிரிகளை முடிவுக்குக் கொண்டுவருதல் என்ற போர்ச் சூழலிலான பொருளை இயல்பான தமிழில் தருகிறது; வினைச்சொல்லின் இரண்டாம் நபர் செய்பாட்டையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தேவனுடைய தனிப்பட்ட பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசன உரையின் உண்மைநிலை
  choice: “யெகோவா கூறுவது இதுவே” என்று சிதேக்கியாவின் கூற்றாகவே வழங்கப்பட்டது
  alternative: இது உண்மையான தெய்வீக அறிவிப்பு என்று மொழிபெயர்ப்பிலேயே உறுதிப்படுத்துதல்
  rationale: வசனம் சிதேக்கியா கூறிய வார்த்தையைப் பதிவு செய்கிறது; அதன் நம்பகத்தன்மையை இவ்வசனத்தின் மொழிபெயர்ப்பு தனியே தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. நேரடி உரைக்குள் உள்ள தெய்வீக அறிவிப்பு தனி மேற்கோளாக அமைக்கப்பட்டது; மூலத்தின் நாடகத் தன்மையும் வலிமையான போருருவகமும் பாதுகாக்கப்பட்டன.
