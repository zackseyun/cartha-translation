base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ta
  text: அவன் அரசனிடம் வந்தான். அரசன் அவனை நோக்கி, “மிகாயா, நாம் ராமோத்-கிலேயாத்துக்குப் போருக்குச் செல்லலாமா, அல்லது விலகியிருக்கலாமா?” என்று கேட்டான். அதற்கு அவன், “போங்கள், வெற்றிபெறுங்கள்; யாவே அதை அரசனின் கையில் ஒப்புக்கொடுப்பார்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலைப் பார்க்கும்போது மிகாயாவின் பதில் ஏளனமாகச் சொல்லப்பட்டிருக்கலாம்; ஆனால் எபிரேய உரை அந்த ஏளனத்தை வெளிப்படையாகக் குறிக்கவில்லை.
    reason: மூலத்தில் வெளிப்படையாகக் குறிக்கப்படாத, சூழலால் உணரப்படும் தொனியை விளக்குதல்.
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַמֶּלֶךְ
  choice: அவன் அரசனிடம் வந்தபோது
  rationale: தொடர்ச்சியான கதையோட்டத்தை இயல்பான நவீனத் தமிழில் தருகிறது; எழுவாய் சூழலிலிருந்து மிகாயாவைக் குறிக்கிறது.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: הֲנֵלֵךְ ... אִם־נֶחְדָּל
  choice: நாம் ... போகலாமா, வேண்டாமா?
  rationale: ஆலோசனை கோரும் முதல் நபர் பன்மை வினாவையும், செல்லாமல் விலகியிருக்கும் மாற்றுத் தேர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்து
  rationale: இடப்பெயரின் இரு கூறுகளையும் காத்து, அவற்றின் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: நோக்கத்தைக் குறிக்கும் முன்னொட்டையும் போரின் செயற்பொருளையும் சுருக்கமாகத் தருகிறது.
- source_word: עֲלֵה וְהַצְלַח
  choice: போங்கள், வெற்றிபெறுங்கள்
  rationale: மேலே செல்லுதல்/படையெடுத்துச் செல்லுதல் என்ற சூழல்சார் பொருளையும் வெற்றியடைவதையும் கண்ணியமான தமிழில் தருகிறது; கேலித் தொனியை உரையில் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் நான்கெழுத்துத் திருப்பெயரைத் தருகிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றவில்லை.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: அரசனின் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற எபிரேய உருவகத்தைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: מִיכָיְהוּ கூறிய பதிலின் தொனி
  choice: முதன்மை உரையில் சொற்களை நேரடியாக மொழிபெயர்த்து, கேலியை வெளிப்படையாகச் சேர்க்காமல் வைத்தல்
  alternative: “போங்கள், நிச்சயம் வெற்றிபெறுங்கள்!” போன்ற சொற்கள் அல்லது நிறுத்தக்குறிகளால் கேலித் தொனியை வெளிப்படுத்துதல்
  rationale: விரிந்த சூழல் பதில் ஏளனமாக இருந்திருக்கலாம் என வலுவாகக் காட்டினாலும், எபிரேயச் சொற்கள் தாமாகவே கேலியை இலக்கணமாகக் குறிக்கவில்லை. எனவே தெளிவின்மையும் கதையின் பதற்றமும் காக்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் வைத்திருக்கிறது. ‘யெகோவா’ என்பது நவீனத் தமிழ்ப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்; ‘யாவே’ மூல உச்சரிப்பை அண்மித்த மாற்று.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் காட்சிக்குரிய ‘அரசன்’ என்ற சொல்லும் மரியாதைப் பன்மை வினைமுற்றுகளும் பேணப்பட்டுள்ளன; மூலத்தின் உருவகமும் தொனித் தெளிவின்மையும் இயன்றவரை காக்கப்பட்டுள்ளன.
