revisions:
- from: 'மீகாயா சொன்னான்: “நீ உண்மையாகவே நலமுடன் திரும்பிவந்தால், யாவே என் மூலமாகப் பேசியிருக்கவில்லை.[a]” மேலும் அவன், “மக்களினங்களே, நீங்கள் அனைவரும் கேளுங்கள்![b]” என்றான்.'
  to: 'மீகாயா சொன்னான்: “நீ உண்மையாகவே நலமுடன் திரும்பிவந்தால், யாவே என் மூலமாகப் பேசவில்லை.” அவன் மேலும் சொன்னான்: “எல்லா மக்களினங்களே, கேளுங்கள்!”'
