reference: 1 Kings 22:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: ta
  text: 'மீகாயா சொன்னான்: “நீ உண்மையாகவே நலமுடன் திரும்பிவந்தால், யாவே என் மூலமாகப் பேசவில்லை.” அவன் மேலும் சொன்னான்: “எல்லா மக்களினங்களே, கேளுங்கள்!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: மீகாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: நீ உண்மையாகவே … திரும்பிவந்தால்
  rationale: வினையெச்ச மூலவடிவமும் வினைமுற்றும் இணைந்து தரும் வலியுறுத்தலை, இயல்பான தமிழில் ‘உண்மையாகவே’ என்பதன் மூலம் காக்கிறது.
- source_word: בְּשָׁלוֹם
  choice: நலமுடன்
  rationale: பாதிப்பின்றி, பாதுகாப்பாகத் திரும்புவதைக் குறிக்கும் שָׁלוֹם என்ற எபிரெயச் சொல்லின் சூழல்சார் பொருளையும் அதன் நல்வாழ்வு நுண்ணுணர்வையும் காக்கிறது.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: யாவே என் மூலமாகப் பேசியிருக்கவில்லை
  rationale: בִּי என்ற முன்னிடைச்சொல் தீர்க்கதரிசியை இறைவாக்கின் கருவியாகக் காட்டும் மரபுத்தொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் இறைப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: கவனம் செலுத்தும்படி அழைக்கும் பன்மை ஏவலை இயல்பாகவும், பொதுப் பிரகடனத்தின் தொனியுடனும் தருகிறது.
- source_word: עַמִּים כֻּלָּם
  choice: மக்களினங்களே, நீங்கள் அனைவரும்
  rationale: עַמִּים என்பதன் பன்மையையும் כֻּלָּם என்பதன் முழுமையையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் திருநான்கெழுத்துப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: இறுதி וַיֹּאמֶר என்பதன் பேச்சாளர்
  choice: மீகாயாவே தொடர்ந்து பேசுகிறார்
  alternative: தொகுப்பாசிரியரின் இடைக்குறிப்பாகவோ வேறொரு குரலாகவோ கொள்ளுதல்
  rationale: உடனடி இலக்கணத் தொடர்ச்சியில் முந்தைய பேச்சாளரான மீகாயாவே பொதுமக்களைச் சாட்சியாக அழைப்பது மிகவும் நேரடியான வாசிப்பு; வேறு பேச்சாளரை ஊகிக்கத் தேவையில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குத் தெளிவாகவும் தீர்க்கதரிசன அறிவிப்புக்குரிய கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. ‘நலமுடன்’ என்பது சொற்பொருள் நிழலையும் சூழலில் உள்ள ‘பாதுகாப்பாக’ என்ற கருத்தையும் இணைக்கிறது; ‘மக்களினங்களே’ என்பது மூலத்தின் பன்மையைத் தெளிவாக வைத்திருக்கிறது.
