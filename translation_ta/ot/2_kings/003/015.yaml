base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: ta
  text: ஆனால் இப்போது, ஓர் இசைக்கலைஞனை என்னிடம் அழைத்து வாருங்கள்.[a] அந்த இசைக்கலைஞன் இசைத்தபோது, யாவேயின் கை[b] எலிசாவின்மேல் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பொதுவாக இசைக்கருவி வாசிப்பவரைக் குறிக்கிறது; எந்த இசைக்கருவி என்பது குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “யாவேயின் கை” என்பது தெய்வீக வல்லமையையோ தீர்க்கதரிசனத் தூண்டுதலையையோ குறிக்கக்கூடிய எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய பேச்சிலிருந்து உடனடியான கோரிக்கைக்குத் திரும்புவதைக் காட்டுகிறது; சூழலில் உள்ள எதிர்மறைத் திருப்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קְחוּ לִי
  choice: என்னிடம் அழைத்து வாருங்கள்
  rationale: பேசுகிறவருக்காக ஒருவரைக் கொண்டுவர வேண்டும் என்ற கட்டளையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מְנַגֵּן
  choice: ஓர் இசைக்கலைஞர்
  rationale: எபிரெயச் சொல் இசைக்கருவி வாசிப்பவரைக் குறிக்கிறது; எந்தக் கருவி என்பது குறிப்பிடப்படாததால் பொதுவான சொல்லே பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: அந்த இசைக்கலைஞர் இசைத்தபோது
  rationale: அடுத்த நிகழ்வு நடந்த காலச்சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; எபிரெயக் கதைநடை வாய்பாட்டைச் சொற்சொல்லாகப் பிரதிபலிக்கவில்லை.
- source_word: יַד יְהוָה
  choice: யாவேயின் கை
  rationale: தெய்வீக வல்லமை அல்லது தீர்க்கதரிசனத் தூண்டுதலைக் குறிக்கக்கூடிய எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַתְּהִי עָלָיו
  choice: அவர்மேல் வந்தது
  rationale: தெய்வீகச் செயலின் தொடக்கத்தை உணர்த்தும் நிகழ்வுத் தன்மையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: יַד יְהוָה என்ற சொற்றொடரின் பொருள்
  choice: யாவேயின் கை அவர்மேல் வந்தது
  alternative: யாவேயின் வல்லமை அவர்மேல் வந்தது
  rationale: இது தீர்க்கதரிசனத் தூண்டுதலையோ தெய்வீக வல்லமையையோ குறிக்கலாம்; ஆனால் குறிப்பிட்ட பொருளைத் தீர்மானிக்காமல் எபிரெய உருவகமும் அதன் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, மரியாதைமிக்க நடை. இசைக்கருவியைத் தேவையின்றிக் குறிப்பாக்காமல், ‘யாவேயின் கை’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
