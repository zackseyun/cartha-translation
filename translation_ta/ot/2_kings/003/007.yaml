base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: ta
  text: அவன் சென்று, யூதாவின் அரசன் யோசபாத்துக்கு செய்தி அனுப்பி, “மோவாபின் அரசன் எனக்கு எதிராகக் கலகம் செய்திருக்கிறான்.[a] மோவாபுக்கு எதிராகப் போரிட நீர் என்னோடு வருவீரா?” என்று கேட்டான். அதற்கு யோசபாத், “நான் வருவேன்.[b] நான் உம்மைப்போலவே; என் மக்கள் உம் மக்களைப்போலவே; என் குதிரைகள் உம் குதிரைகளைப்போலவே,” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்னிடமிருந்து பிரிந்து சென்றிருக்கிறான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் அரசியல் கலகத்தையோ விசுவாச உறவை முறித்துக்கொள்வதையோ குறிக்கலாம்; இங்கு மோவாப் இஸ்ரவேலின் ஆட்சிக்கு எதிராகக் கலகம் செய்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நான் மேலே செல்வேன்.” இந்த வினைச்சொல் போருக்குச் செல்வதையோ உயரமான நிலப்பகுதியை நோக்கிச் செல்வதையோ அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவன் புறப்பட்டு
  rationale: தொடர்ந்து நிகழும் செயலைக் குறிக்கும் எபிரெயக் கதையோட்டத்தை இயல்பான தமிழில் தருகிறது; வெறும் ‘சென்று’ என்பதைவிட அடுத்த நடவடிக்கைக்காகப் புறப்படுவதைத் தெளிவாக்குகிறது.
- source_word: וַיִּשְׁלַח אֶל
  choice: ஆள் அனுப்பி
  rationale: தொடர்ந்து மேற்கோளாகச் செய்தி வருவதால், அரசனிடம் தூதர் அல்லது ஆள் மூலம் செய்தி அனுப்பிய கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் யோசபாத்
  rationale: பெயரையும் அரச பதவியையும் நவீனத் தமிழின் இயல்பான வரிசையில் தருகிறது.
- source_word: פָּשַׁע בִּי
  choice: எனக்கு எதிராகக் கலகம் செய்திருக்கிறான்
  rationale: இந்த அரசியல் சூழலில் வஸ்ஸல் அரசன் மேலாதிக்கத்துக்கு எதிராக எழுந்ததைக் குறிக்கும் פשע என்பதன் முதன்மைப் பொருளைத் தருகிறது.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: நீர் என்னோடு வருவீரா?
  rationale: அரசரிடம் பேசும் மரியாதை ஒருமையையும், ‘என்னுடன் செல்வீரா’ என்ற கேள்வியின் இயல்பான தமிழ்ச் சொல்லாட்சியையும் காக்கிறது.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: மோவாபோடு போரிட
  rationale: மோவாபை நோக்கிய போர்ப் பயணத்தையும் பகைமை நோக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶעֱלֶה
  choice: நான் வருவேன்
  rationale: சூழலில் அழைப்பை ஏற்றுக்கொண்டு உடன் செல்வதாகப் பதிலளிப்பதை இயல்பான தமிழில் தருகிறது; ‘மேலே செல்வேன்’ என்ற சொல்லடியான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: நான் உம்மோடு இருப்பதுபோல் என் மக்களும் உம் மக்களோடு இருப்பார்கள்; என் குதிரைகளும் உம் குதிரைகளோடு இருக்கும்
  rationale: எபிரெயத்தில் உள்ள சுருக்கமான இணை அமைப்பை, படை மற்றும் அரசியல் ஒற்றுமைக்கான உறுதிமொழியாகப் புரியக்கூடிய இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யோசபாத்தின் ஒற்றுமை உறுதிமொழியின் பொருள்
  choice: அரசியல் மற்றும் இராணுவ ஒற்றுமையை வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘நானும் நீரும் ஒன்றே’ என்று சொல்லடியான வடிவில் தருதல்
  rationale: כָּמוֹנִי כָמוֹךָ என்ற சுருக்கமான எபிரெய வாக்கியம் அடையாளம் முழுவதும் ஒன்றாதல் என்ற இறையியல் கருத்தை அவசியமாகக் கூறாது; இச்சூழலில் கூட்டணிக்கான முழு ஆதரவையே குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசர்களுக்கிடையிலான உரையாடலுக்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. கதையோட்டம் எளிமையாகவும் கண்ணியமாகவும் வைக்கப்பட்டு, எபிரெயத்தின் அரசியல் மற்றும் இராணுவ நுணுக்கங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
