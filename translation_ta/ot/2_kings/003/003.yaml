source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: ta
  text: ஆயினும், இஸ்ரவேலைப் பாவம் செய்ய வைத்த[a] நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களை அவன் விடாமல் பற்றிக்கொண்டான்; அவற்றைவிட்டு விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் மூலம் அவன் இஸ்ரவேலைப் பாவத்தில் வழிநடத்தினான்.” எபிரேய காரணவினை, யெரொபெயாமின் செயல்களால் இஸ்ரவேல் பாவத்தில் ஈடுபட்டதைக் குறிக்கிறது.
    reason: தொடர்புச் சொற்றொடரின் முன்னிலையும் காரணவினையின் வெளிப்பாடும் குறித்த சொற்பொருள் மாற்று
lexical_decisions:
- source_word: רַק
  choice: ஆயினும்
  rationale: முந்தைய நேர்மறை மதிப்பீட்டுக்கு ஒரு வரம்பையோ விதிவிலக்கையோ அறிமுகப்படுத்துகிறது; இவ்விடத்தில் தொடக்கத்தில் ‘மட்டும்’ என்பதைக் காட்டிலும் ‘ஆயினும்’ இயல்பான நவீனத் தமிழாக உள்ளது.
- source_word: בְּחַטֹּאות
  choice: பாவங்களை
  rationale: דבק என்ற வினையுடன் வரும் בְּ பற்றிக்கொள்ளும் பொருளைத் தருகிறது; தமிழில் வினையின் நேரடிச் செயப்படுபொருளாக வழங்குவது இயல்பானது.
- source_word: חַטֹּאות
  choice: பாவங்கள்
  rationale: யெரொபெயாமின் சமய மீறல்களை உரையின் வெளிப்படையான அறநெறித் தீர்ப்போடு ‘பாவங்கள்’ எனக் காட்டுகிறது; ‘பழக்கங்கள்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரேய தந்தைவழி அடையாளத்தை இயல்பான தமிழ் சொல்லமைப்பில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: חטא என்பதன் Hiphil காரணவினைப் பொருளைப் பாதுகாக்கிறது. தொடர்புச் சொற்றொடர் யெரொபெயாமை நேரடியாக விவரிக்கும் இயல்பான எபிரேய வாசிப்பை முதன்மை உரையில் தருகிறது.
- source_word: דָּבֵק
  choice: விடாமல் பற்றிக்கொண்டான்
  rationale: தொடர்ந்து உறுதியாகப் பற்றியிருத்தல் என்ற வலுவான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא סָר
  choice: விலகவில்லை
  rationale: ஒரு தவறான போக்கை விட்டுத் திரும்பாதிருத்தல் என்ற வழக்குச் சொற்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִמֶּנָּה
  choice: அவற்றைவிட்டு
  rationale: வடிவில் பெண்பால் ஒருமை பின்னொட்டு இருந்தாலும், பொருளில் முன்வரும் பன்மையான ‘பாவங்கள்’ என்பதைக் குறிப்பதால் தமிழில் பன்மையாக வழங்கப்படுகிறது.
theological_decisions:
- issue: அரசனின் விசுவாசவிலகலை மதிப்பிடும் சூத்திரம்
  choice: ‘பாவங்கள்’, ‘பாவம் செய்ய வைத்த’ என்ற வெளிப்படையான அறநெறி மொழியைத் தக்கவைத்தல்
  alternative: ‘பழக்கங்கள்’ அல்லது ‘தவறுகள்’ என்று நடுநிலைப்படுத்துதல்
  rationale: இங்கு எபிரேய உரையே யெரொபெயாமின் வழியைப் பாவம் எனத் தெய்வீக-அறநெறி மதிப்பீடு செய்கிறது; அதை அரசியல் அல்லது வழிபாட்டு வேறுபாடாக மட்டும் மென்மைப்படுத்தக் கூடாது.
- issue: אֲשֶׁר என்ற தொடர்புச் சொல்லின் முன்னிலை
  choice: யெரொபெயாமே இஸ்ரவேலைப் பாவம் செய்ய வைத்தான் என முதன்மை உரையில் காட்டுதல்
  alternative: யெரொபெயாமின் பாவங்களின் மூலமாக அவன் இஸ்ரவேலைப் பாவத்தில் வழிநடத்தினான் எனப் புரிந்துகொள்ளுதல்
  rationale: எபிரேயத்தில் தொடர்புச் சொற்றொடர் அருகிலுள்ள யெரொபெயாமை இயல்பாக விவரிக்கலாம்; அதேவேளையில் அவனுடைய பாவச் செயல்கள் கருவியாக இருந்தன என்ற பொருளும் சூழலில் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று-இறையியல் நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆயினும்’ முந்தைய வசனத்தின் நேர்மறை மதிப்பீட்டுக்கான வரம்பை இயல்பாகச் சுட்டுகிறது; ‘விடாமல் பற்றிக்கொண்டான்’ தொடர்ச்சியான பற்றுதலின் வலிமையை வெளிப்படுத்துகிறது.
