base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: ta
  text: அப்போது அவன், தனக்குப் பதிலாக அரசாளவிருந்த தன் முதற்பேறான மகனை எடுத்து, மதிலின்மேல் அவனைத் தகனபலியாகச் செலுத்தினான். அப்பொழுது இஸ்ரவேலுக்கு எதிராகப் பெரும் சினம்[a] உண்டாயிற்று. பின்னர் அவர்கள் அவனைவிட்டு விலகித் தங்கள் நாட்டிற்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலுக்கு எதிராகப் பெரும் சீற்றம்’ என்றும் மொழிபெயர்க்கலாம். இந்தச் சினம் யாருடையது என்று எபிரெய உரை குறிப்பிடவில்லை. இது கடவுளின் சினமா, மோவாபியரின் சீற்றமா, அல்லது அந்தப் பலியால் இஸ்ரவேலருக்கு ஏற்பட்ட மனக்கலக்கமா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: மூலத்தில் சினத்தின் மூலம் குறிப்பிடப்படாததால் நிலவும் மாற்று வாசிப்புகளைச் சுட்டிக்காட்டுதல்.
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: தன் முதற்பேறான மகன்
  rationale: בְּכוֹר என்பது வயதில் மூத்தவன் என்பதை மட்டும் அல்லாமல் முதற்பேறானவன் என்பதைக் குறிக்கிறது; அரசுரிமைத் தொடர்ச்சியுடன் தொடர்புடைய குடும்பநிலையையும் இச்சொல் காக்கிறது.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: தனக்குப் பதிலாக அரசாளவிருந்த
  rationale: இவன் அரசனுக்குப் பின் ஆட்சியேற்க நியமிக்கப்பட்ட வாரிசு என்பதைச் சொற்றொடர் காட்டுகிறது; תַּחְתָּיו என்பதன் ‘அவனுக்குப் பதிலாக’ என்ற பொருளும் இயல்பான தமிழில் தக்கவைக்கப்படுகிறது.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/கொண்டுசெல்’. இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது தேவையற்ற வன்முறை விவரத்தைச் சேர்க்காமல் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: அவனைத் தகனபலியாகச் செலுத்தினான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவமும் עֹלָה என்பதும் பலியிடுதல் சார்ந்த தொழில்நுட்ப மொழி. ‘தகனபலி’ பலி முழுவதும் எரிக்கப்படுவதைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்; நிகழ்வின் கொடுமையை மறைக்கவில்லை.
- source_word: עַל הַחֹמָה
  choice: மதிலின்மேல்
  rationale: הַחֹמָה இயல்பாக நகர மதிலைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘நகரம்’ என்பதைச் சேர்க்காமல் ‘மதில்’ சூழலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: קֶצֶף גָּדוֹל
  choice: பெரும் சினம்
  rationale: קֶצֶף கடுமையான சினம் அல்லது சீற்றத்தைக் குறிக்கிறது. ‘பெரும் சினம்’ அதன் தீவிரத்தைத் தக்கவைத்து, அந்தச் சினம் யாருடையது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: קֶצֶף உடன் வரும் עַל, சினம் இஸ்ரவேலை நோக்கி இருந்ததைக் குறிக்கிறது; ‘எதிராக’ இதைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: அவர்கள் அவனைவிட்டு விலகி
  rationale: נסע என்பதற்கு முகாமைப் பெயர்த்துப் புறப்படுதல் என்ற பொருள் உண்டு. போர் சூழலில் தாக்குதலைக் கைவிட்டு விலகியதை இத்தமிழாக்கம் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: தங்கள் நாட்டிற்குத் திரும்பினார்கள்
  rationale: கூட்டணிப் படையினரே எழுவாய் என்பதால் சூழலில் உட்பொதிந்துள்ள உடைமைப் பொருளை ‘தங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலுக்கு எதிராகப் பெரும் சினம்’ என்பதன் மூலம் அல்லது உரியவர்
  choice: சினம் யாருடையது என்று குறிப்பிடாமல் மூலத்தின் தெளிவின்மையைத் தக்கவைத்தல்
  alternative: அது கடவுளின் கோபம், மோவாபியரின் சீற்றம், அல்லது பலியைக் கண்ட இஸ்ரவேலரின் மனக்கலக்கம் என்று குறிப்பாக விளக்குதல்
  rationale: எபிரெய உரை அந்தச் சினம் யாரிடமிருந்து வந்தது என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே விவாதத்திற்குரிய இறையியல் மற்றும் கதைசார் பதற்றத்தை முதன்மை உரை தீர்த்து வைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசாளவிருந்த’, ‘தகனபலி’, ‘மதில்’ போன்ற சொற்கள் வேதாகமச் சூழலின் செறிவைக் காக்கின்றன; அதேவேளையில் மூலத்தின் தெளிவின்மை சினத்தின் உரியவரைச் சேர்க்காமல் பாதுகாக்கப்பட்டுள்ளது.
