base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: ta
  text: அரணமைக்கப்பட்ட நகரங்கள் அனைத்தையும், சிறந்த நகரங்கள் அனைத்தையும்[a] நீங்கள் தாக்குவீர்கள்; நல்ல மரங்கள் அனைத்தையும் வெட்டி வீழ்த்துவீர்கள்; நீரூற்றுகள் அனைத்தையும் அடைத்துவிடுவீர்கள்; நல்ல வயல்கள் அனைத்தையும் கற்களால் பாழாக்குவீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேர்ந்தெடுக்கப்பட்ட நகரங்கள் அனைத்தையும்’ அல்லது ‘மிகச் சிறந்த நகரங்கள் அனைத்தையும்.’
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘கற்களால் வலியுண்டாக்குவீர்கள்.’ வயல்மீது கற்களைப் பரப்பி அதைப் பயிரிட முடியாதபடி பாழாக்குவதை இச்சொற்றொடர் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: நீங்கள் தாக்குவீர்கள்
  rationale: נכה என்பதன் ஹிஃபீல் வடிவம் இராணுவச் சூழலில் ‘தாக்குதல்’ என்ற நேரடியான பொருளைத் தருகிறது. நகரங்களைக் கைப்பற்றுவீர்கள் என்று விளக்கமாக விரிவுபடுத்தாமல் மூலத்தின் செயலைப் பேணுகிறது.
- source_word: עִיר מִבְצָר
  choice: அரண்சூழ்ந்த நகரம்
  rationale: מִבְצָר என்பது அரணமைப்பால் பாதுகாக்கப்பட்ட இடத்தைக் குறிக்கிறது; ‘அரண்சூழ்ந்த நகரம்’ இயல்பான தமிழில் அதன் இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עִיר מִבְחוֹר
  choice: சிறந்த நகரம்
  rationale: מִבְחוֹר என்பது தேர்ந்தெடுக்கப்பட்டது, சிறப்பானது அல்லது மிகச் சிறந்தது என்ற பொருள் கொண்டது. ‘சிறந்த நகரம்’ அதன் மதிப்பையும் முக்கியத்துவத்தையும் இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל עֵץ טוֹב
  choice: நல்ல மரங்கள் அனைத்தும்
  rationale: טוֹב என்பதன் பரந்த ‘நல்ல’ என்ற பொருளைப் பேணுகிறது; ‘கனிதரும்’ அல்லது ‘பயனுள்ள’ என்று சூழலிலிருந்து கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: תַּפִּילוּ
  choice: வெட்டி வீழ்த்துவீர்கள்
  rationale: נפל என்பதன் ஹிஃபீல் இங்கு மரங்களை விழச் செய்வதைக் குறிக்கிறது. தமிழில் மரங்களைப் பற்றிய இந்தச் செயலை ‘வெட்டி வீழ்த்துதல்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מַעְיְנֵי מַיִם
  choice: நீரூற்றுகள்
  rationale: இச்சொற்றொடர் இயற்கையான நீரூற்றுகளைக் குறிக்கிறது; ‘நீரூற்றுகள்’ சுருக்கமானதும் துல்லியமானதும் ஆகும்.
- source_word: תִּסְתֹּמוּ
  choice: அடைத்துவிடுவீர்கள்
  rationale: நீரூற்றுகளையோ கிணறுகளையோ மூடி, அவற்றிலிருந்து நீர் கிடைக்காதபடி செய்வதே இவ்வினையின் பொருள்; ‘அடைத்துவிடுதல்’ இதை இயல்பாகத் தருகிறது.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: நல்ல வயல்கள் அனைத்தும்
  rationale: חֶלְקָה என்பது நிலப்பகுதி அல்லது பயிரிடும் வயலைக் குறிக்கலாம். வேளாண்மைச் சூழலில் ‘வயல்’ இயல்பானது; טוֹב என்பதற்கான ‘நல்ல’ என்பதும் பேணப்பட்டுள்ளது.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: கற்களால் பாழாக்குவீர்கள்
  rationale: כאב என்பதன் ஹிஃபீல் வடிவம் இங்கு அபூர்வமான பயன்பாடு; சொற்படியாக ‘கற்களால் வலியுண்டாக்குதல்’ எனலாம். வயலில் கற்களைப் பரப்பி அதைப் பயனற்றதாக்கும் விளைவை ‘பாழாக்குதல்’ தெளிவாகத் தெரிவிக்கிறது; சொற்படியான தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
