base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: ta
  text: 'அவன் சொன்னான்: “யாவே இவ்வாறு கூறுகிறார்: இந்த ஓடையில் ஏராளமான குழிகளைத் தோண்டுங்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “இந்த ஓடையை குழிகள், குழிகளாக ஆக்குங்கள்.” ‘ஓடை’ என்பது பருவகால நீரோடை, அதன் படுகை, அல்லது பள்ளத்தாக்கையும் குறிக்கலாம். ‘குழிகள்’ என்ற சொல் மறுமுறை வருவது ஏராளமான குழிகள் அல்லது ஓடை முழுவதும் குழிகள் இருக்க வேண்டும் என்பதைக் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் சொன்னது
  rationale: எபிரெயக் கதையோட்டத்தில் வரும் வழக்கமான wayyiqtol வடிவை இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய சூழலிலிருந்து எழுவாயான எலிசா புரிந்துகொள்ளப்படுகிறார்.
- source_word: כֹּה אָמַר יְהוָה
  choice: யெகோவா இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுரைச் சூத்திரத்தின் அதிகாரபூர்வத் தொனியைப் பேணுகிறது; יהוה என்பதைத் தலைப்பாக மாற்றாமல் தெய்வீகப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: עָשֹׂה
  choice: தோண்டுங்கள்
  rationale: அடிப்படைப் பொருள் ‘செய்/உருவாக்கு’ என்றாலும், ஓடை முழுவதும் குழிகள் ஏற்படுத்தப்பட வேண்டும் என்ற இச்சூழலில் இயல்பான தமிழில் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: הַנַּחַל הַזֶּה
  choice: இந்த ஓடையை
  rationale: נחל என்பது இச்சூழலில் பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கிறது; ‘ஓடை’ பொதுவாசகருக்குப் புரியும் இயல்பான புவியியல் சொல்.
- source_word: גֵּבִים גֵּבִים
  choice: எங்கும் குழிகளாக
  rationale: ‘குழிகள், குழிகள்’ என்ற எபிரெய மறுபடியுரைத்தல் பலவாகவும் பரவலாகவும் குழிகள் அமைக்கப்படுவதை வலியுறுத்துகிறது; தமிழில் ‘எங்கும் குழிகளாக’ அந்தப் பகிர்வுப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது; எபிரெய உயிரெழுத்தாக்கத்தின் துல்லிய உச்சரிப்பு விவாதத்துக்குரியது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. தீர்க்கதரிசன அறிவிப்பின் அதிகாரபூர்வத் தொனி பேணப்பட்டுள்ளது; அரிதான ‘வாடி’ என்பதற்குப் பதில் புரிந்துகொள்ள எளிய ‘ஓடை’ பயன்படுத்தப்பட்டுள்ளது.
