source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: ta
  text: மேலும், இது யாவேவின் பார்வையில் ஒரு சிறிய காரியம்தான்[a]; அவர் மோவாபையும் உங்கள் கையில் ஒப்புக்கொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது யாவேவின் பார்வையில் எளிதான காரியம்.”
    reason: וְנָקַל என்பது ‘சிறியதாக/அற்பமாக இருக்கிறது’ என்றும் ‘எளிதாக இருக்கிறது’ என்றும் பொருள் தரக்கூடியதால் இந்தச் சொற்பொருள் மாற்று வழங்கப்படுகிறது.
lexical_decisions:
- source_word: וְנָקַל
  choice: ஒரு சிறிய காரியம்தான்
  rationale: קל என்பதன் இங்குள்ள நிலைசார் பொருள் எடை குறைந்தது, அற்பமானது அல்லது எளிதானது என்பதாக இருக்கலாம். ‘ஒரு சிறிய காரியம்தான்’ என்பது யாவேவின் மதிப்பீட்டில் இது கடினமோ பெரிதோ அல்ல என்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘எளிதான காரியம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: זֹאת
  choice: இது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தண்ணீர் வழங்கப்படுவதைக் குறிக்கும் நேரடியான சுட்டுப்பெயர்.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தைச் சொற்சொல்லாக அல்லாமல், மதிப்பீடு அல்லது கணிப்பு என்ற அதன் இயல்பான தமிழ்ப் பொருளில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் வரும் இறைநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְנָתַן
  choice: அவர் ... ஒப்புக்கொடுப்பார்
  rationale: தீர்க்கதரிசனச் சூழலில் இவ்வினைமுற்று எதிர்கால உறுதியைக் குறிக்கிறது. ‘ஒப்புக்கொடுப்பார்’ என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் வழங்குதல் என்ற சூழ்நிலைப் பொருளைத் தெளிவாக்குகிறது.
- source_word: אֶת מוֹאָב
  choice: மோவாபையும்
  rationale: மூலத்தில் உள்ள நாடு அல்லது மக்கள்தொகுதியின் பெயரை ‘மோவாப்’ எனவே வைத்திருக்கிறது. ‘-உம்’ என்பது தண்ணீர் வழங்குதலோடு கூடுதலாக நிகழும் அடுத்த செயலை இயல்பாகக் காட்டுகிறது.
- source_word: בְּיֶדְכֶם
  choice: உங்கள் கையில்
  rationale: அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் ஒப்புக்கொடுத்தல் என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை, தமிழிலும் புரியக்கூடிய வேதாகம நடையில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமம் நேரடியாக வருகிறது. ஆகவே அதை மறைக்காமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: קל என்ற சொல்லின் மதிப்பீட்டு நுணுக்கம்
  choice: ஒரு சிறிய காரியம்தான்
  alternative: எளிதான காரியம்
  rationale: இரண்டு வாசிப்புகளும் யாவேவுக்கு இச்செயல் கடினமல்ல என்பதைக் காட்டுகின்றன. முதன்மை உரை ‘சிறிய’ என்ற எடை/முக்கியத்துவ உருவகத்தைப் பாதுகாக்கிறது; ‘எளிதான’ என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேவின் பார்வையில்’ மற்றும் ‘உங்கள் கையில்’ ஆகியவை மூல உருவகத்தை அளவோடு காக்கின்றன; ‘ஒப்புக்கொடுப்பார்’ சூழ்நிலைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
