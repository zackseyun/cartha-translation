  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: ta
  text: ஆகாப் இறந்தபோது[a], மோவாபின் அரசன் இஸ்ரவேலின் அரசனுக்கு எதிராகக் கிளர்ச்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, ‘ஆகாபின் மரணத்தின்போது.’ எபிரெயக் காலக் குறிப்பு இவ்விரு விதங்களிலும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: இறந்தபோது
  rationale: וַיְהִי என்ற எபிரெயக் கதைத் தொடர்ச்சி வடிவத்தைத் தமிழில் தனியே மொழிபெயர்த்தால் இயல்பற்றதாகும்; כְּמוֹת உடன் சேர்ந்த இதன் காலச்சூழலை ‘இறந்தபோது’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டுள்ளது.
- source_word: וַיִּפְשַׁע
  choice: கிளர்ச்சி செய்தான்
  rationale: இந்த அரசியல் சூழலில் פשע என்பது மேலாதிக்க ஆட்சிக்கு எதிராகக் கலகம் அல்லது கிளர்ச்சி செய்வதைக் குறிக்கிறது.
- source_word: מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் உடைமைத் தொடர்பாகத் தருகிறது.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனுக்கு எதிராக
  rationale: פשע உடன் வரும் בְּ, கிளர்ச்சி யாருக்கு எதிராகச் செய்யப்பட்டதோ அந்தத் தரப்பைக் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பது தெளிவான இயல்பான இணை.
