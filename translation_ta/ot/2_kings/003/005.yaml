translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைத் தொடக்கமான וַיְהִי தமிழில் தேவையற்ற ‘அப்போது நிகழ்ந்தது’ என்ற மரத்துப் போன சொற்றொடராகத் தரப்படாமல், காலவாக்கியத்தின் ஓட்டத்தில் இயல்பாக இணைக்கப்பட்டுள்ளது.
