  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: ta
  text: மோவாபியர் அனைவரும், அரசர்கள் தங்களுக்கு எதிராகப் போரிட வந்திருப்பதைக் கேள்விப்பட்டார்கள். இடுப்புக்கச்சை கட்டும் வயதிலுள்ளவர்கள் முதல் அதற்கு மேற்பட்ட அனைவரும்[a] அழைத்துத் திரட்டப்பட்டார்கள்; அவர்கள் எல்லையில் நிலைகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு சொல், “இடுப்புக்கச்சை கட்டுகிற ஒவ்வொருவரிலிருந்தும் அதற்கு மேலும்.” இது பொதுவாகப் போரிடும் வயதை அடைந்தவர்களையும் அதற்கு மேற்பட்டவர்களையும் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: மோவாபியர் அனைவரும்
  rationale: மோவாப் என்ற கூட்டுப்பெயர் இங்கு அந்த நாட்டு மக்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: ஒரு செய்தியை அறிந்தார்கள் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: அந்த அரசர்கள் ... வந்திருப்பதை
  rationale: עלה என்பதன் இயக்க நுணுக்கத்தை ‘வந்திருந்தார்கள்’ என்பதன் மூலம் காக்கிறது; தமிழ் வாக்கிய அமைப்புக்கேற்ப வினையெச்சத் தொடராக அமைக்கப்பட்டது.
- source_word: לְהִלָּחֶם בָּם
  choice: தங்களுக்கு எதிராகப் போரிட
  rationale: לחם + ב என்பதன் ‘ஒருவருக்கு எதிராகப் போரிடுதல்’ என்ற பொருளை நேரடியாகத் தருகிறது.
- source_word: וַיִּצָּעֲקוּ
  choice: படைக்குத் திரட்டப்பட்டு
  rationale: இச்சூழலில் இது வெறுமனே கூக்குரலிடுதலை அல்ல, எதிரிப் படையெடுப்பைச் சந்திக்க மக்களை அழைத்துத் திரட்டுவதைச் சுட்டுகிறது; செயப்பாட்டு நுணுக்கமும் காக்கப்படுகிறது.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: இடுப்புக்கச்சை கட்டும் வயதுள்ளவர்கள் தொடங்கி அதற்கு மேற்பட்ட அனைவரும்
  rationale: ‘இடுப்புக்கச்சை கட்டுகிறவன் முதல் அதற்கு மேல்’ என்ற எபிரேய உருவகத்தையும், அது குறிப்பிடும் வயது எல்லையையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: எல்லையில் நிலைகொண்டார்கள்
  rationale: עמד என்பதன் நிற்றல் பொருளையும், இராணுவச் சூழலில் நிலை எடுத்தல் என்ற நுணுக்கத்தையும் இயல்பாகத் தருகிறது.
