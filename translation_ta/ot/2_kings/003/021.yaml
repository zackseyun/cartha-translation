translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேயக் கூட்டுப்பெயர் தமிழில் மக்களைக் குறிக்கும் வடிவில் தரப்பட்டுள்ளது; படைத்திரட்டல் மற்றும் எல்லையில் நிலை எடுத்தல் ஆகிய சூழல்சார் நுணுக்கங்கள் காக்கப்பட்டுள்ளன.
