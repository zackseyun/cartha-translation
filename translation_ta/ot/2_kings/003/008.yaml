  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: ta
  text: அவர், “நாம் எந்த வழியாகப் போவோம்?” என்றார். அவர், “ஏதோம் வனாந்தரத்தின் வழியாக[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏதோம் வனாந்தரத்தின் பாதை வழியாக.”
    reason: דֶּרֶךְ என்பது ‘வழி’ அல்லது ‘பாதை’ என மொழிபெயர்க்கப்படலாம்; மִדְבַּר אֱדוֹם என்பதன் வழியாகச் செல்லும் பாதை என்ற நுணுக்கத்தையும் இந்த மாற்று வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான் / என்றான்
  rationale: אמר என்பதன் இரு நிகழ்வுகளும் எளிய இறந்தகாலக் கதைநடையாக மொழிபெயர்க்கப்பட்டுள்ளன; முதலாவது உரை கேள்வியாக இருப்பதால் இயல்பான தமிழுக்காக ‘கேட்டான்’ எனவும், இரண்டாவது ‘என்றான்’ எனவும் வழங்கப்பட்டுள்ளது.
- source_word: אֵי זֶה
  choice: எந்த
  rationale: הַדֶּרֶךְ என்பதற்கு முன் வரும் இச்சொற்றொடர் இடத்தை மட்டும் கேட்காமல், வழிகளில் எதனைத் தேர்ந்தெடுப்பது என்று கேட்பதால் ‘எந்த’ என்பது இயல்பான தமிழ்.
- source_word: הַדֶּרֶךְ
  choice: வழி
  rationale: דֶּרֶךְ என்பதன் ‘வழி/பாதை/மார்க்கம்’ என்ற பொருள்களில், பயணப் பாதையையும் செல்லும் முறையையும் இயல்பாகக் குறிக்கும் ‘வழி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: נַעֲלֶה
  choice: நாம் போக வேண்டும்
  rationale: עלה இங்கு பயணம் அல்லது படையெடுப்பின் சூழலில் ‘மேலே போதல்/புறப்பட்டுச் செல்லுதல்’ எனப் பொருள்படும். தமிழில் இலக்கை நோக்கிச் செல்லும் வழியைக் கேட்கும்போது ‘நாம் போக வேண்டும்’ என்பது இயல்பாக உள்ளது; உரையில் வெளிப்படையாக இல்லாத இராணுவ நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: ஏதோம் வனாந்தரத்தின் வழியாகப் போக வேண்டும்
  rationale: வினைச்சொல் இல்லாத எபிரெயப் பதில் செல்ல வேண்டிய பாதையைச் சுட்டுகிறது. இயல்பான தமிழுக்காக ‘போக வேண்டும்’ சேர்க்கப்பட்டது; construct தொடர் ‘ஏதோம் வனாந்தரம்’ என்ற உறவைப் பாதுகாக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
