translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘வனாந்தரம்’ வேதாகமப் பயன்பாட்டில் அறிமுகமானதுடன், மக்கள் வசிப்பில்லாத வறண்ட நிலப்பகுதியைக் குறிக்கிறது. பேச்சாளர்களின் பெயர்கள் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் ‘அவன்’ என்ற மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
