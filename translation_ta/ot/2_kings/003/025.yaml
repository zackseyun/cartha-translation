  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: ta
  text: அவர்கள் நகரங்களை இடித்துத் தள்ளினார்கள். வளமான ஒவ்வொரு நிலப்பகுதியிலும்[a] ஒவ்வொருவனும் தன் கல்லை எறிந்து, அதைக் கற்களால் நிரப்பினான். எல்லா நீரூற்றுகளையும் அடைத்தார்கள்; நல்ல மரங்களையெல்லாம்[b] வெட்டி வீழ்த்தினார்கள். கீர்-ஹரேசெத் நகரத்தின் கற்கள் மட்டுமே எஞ்சும்வரை இப்படிச் செய்தார்கள்[c]. பிறகு கவணெறிவோர் அதைச் சுற்றிவளைத்துத் தாக்கினார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வளமான ஒவ்வொரு வயலிலும்.’ எபிரெயச் சொல் ஒரு நிலப்பகுதியையோ நிலத்தின் ஒரு பங்கையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘ஒவ்வொரு நல்ல மரத்தையும்’; இது மதிப்புமிக்க அல்லது நல்ல பலன் தரும் மரங்களைச் சிறப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: கீர்-ஹரேசெத் என்பது ஓர் இடப்பெயர்; இச்சூழலில் அது மோவாபின் முதன்மையான அரண் சூழ்ந்த நகரமாக இருந்திருக்கலாம்.
    reason: cultural_note
  - marker: d
    text: அல்லது, ‘அதை அடித்தார்கள்.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘அடித்தல்’; இங்கு அது நகரத்தின் மீதான இராணுவத் தாக்குதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: அவர்கள் நகரங்களை இடித்துத் தள்ளினார்கள்
  rationale: הרס என்பது கட்டமைப்புகளை இழுத்து அல்லது இடித்து அழிப்பதைக் குறிக்கிறது; ‘இடித்துத் தள்ளினார்கள்’ அதன் தெளிவான, செயற்பூர்வமான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְכָל חֶלְקָה טוֹבָה
  choice: வளமான ஒவ்வொரு நிலப்பகுதியிலும்
  rationale: חֶלְקָה என்பது பிரிக்கப்பட்ட நிலப்பகுதி; வேளாண் அழிவுச் சூழலில் טוֹבָה என்பதை ‘வளமான’ என வழங்குவது அதன் உற்பத்தித்தன்மையை இயல்பாக வெளிப்படுத்துகிறது, ‘வயல்’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: ஒவ்வொருவனும் தன் கல்லை எறிந்து, அதைக் கற்களால் நிரப்பினான்
  rationale: எபிரெயத்தின் பகிர்மான ஒருமை ‘ஒவ்வொருவனும் தன் கல்’ என்பதாகப் பாதுகாக்கப்பட்டுள்ளது. நிலத்தைப் பாழாக்கும் விளைவு தெளிவாக இருக்க ‘கற்களால்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְכָל מַעְיַן מַיִם יִסְתֹּמוּ
  choice: எல்லா நீரூற்றுகளையும் அடைத்தார்கள்
  rationale: מַעְיַן என்பது இயற்கை நீரூற்று; סתם இங்கு நீரோட்டத்தைத் தடுத்தல் அல்லது அடைத்தலைக் குறிக்கிறது.
- source_word: וְכָל עֵץ טוֹב יַפִּילוּ
  choice: நல்ல மரங்களையெல்லாம் வெட்டி வீழ்த்தினார்கள்
  rationale: עֵץ טוֹב என்பதன் பொதுவான ‘நல்ல மரம்’ என்ற சொல்லாக்கம் பாதுகாக்கப்படுகிறது; யַפִּילוּ என்பது அவற்றை விழச் செய்வதைச் சொல்கிறது, சூழலில் ‘வெட்டி வீழ்த்துதல்’ இயல்பான தமிழ்.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: கீர்-கரேசெத்தில் அதன் கற்கள் மட்டுமே எஞ்சியிருக்கும்வரை இப்படிச் செய்தார்கள்
  rationale: எபிரெயத்தில் உள்ள ஒருமை-பன்மை மாற்றத்தை தமிழில் இயல்பாக்கி, அழிவின் முடிவாக அங்கிருந்த கற்கள் மட்டுமே எஞ்சியதை வெளிப்படுத்துகிறது. பெண்பால் பின்னொட்டு நகரத்தைக் குறிக்கும் வகையில் ‘அதன்’ என வைக்கப்பட்டுள்ளது.
- source_word: הַקַּלָּעִים
  choice: கவணெறிவோர்
  rationale: இது போரில் கவண் பயன்படுத்திக் கற்களை எறிந்தவர்களைக் குறிக்கும் துல்லியமான தமிழ்ச் சொல்.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: அதைச் சுற்றிவளைத்துத் தாக்கினார்கள்
  rationale: סבב முற்றுகைச் சூழலில் சுற்றிவளைத்தலைக் குறிக்கிறது; נכה என்பதன் அடிப்படைப் பொருள் ‘அடித்தல்’ என்றாலும், நகரத்தின் மீதான இராணுவ நடவடிக்கையில் ‘தாக்கினார்கள்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
