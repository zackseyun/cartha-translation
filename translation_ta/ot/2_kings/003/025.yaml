translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கவணெறிவோர்’ என்ற வரலாற்றுப் போர்ச்சொல் சூழலுக்குத் தேவையான துல்லியத்தைக் காக்கிறது. வாக்கியங்கள் நீளமடையாமல் பிரிக்கப்பட்டுள்ளன; மூலத்தின் செயல் வரிசையும் அழிவின் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன.
