translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. தெளிவற்ற சுட்டுப்பெயரால் வாசிப்பு குழம்பாதபடி சில இடங்களில் ‘இஸ்ரவேலர்’, ‘மோவாபியர்’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது; ஆனால் בָּהּ என்பதன் தெளிவற்ற முன்னிலைச் சுட்டு ‘அதற்குள்’ எனப் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
