base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேலின் முகாமுக்கு வந்தபோது, இஸ்ரவேலர் எழுந்து மோவாபைத் தாக்கினர்; மோவாபியர் அவர்களிடமிருந்து தப்பியோடினர். பின்பு இஸ்ரவேலர் அதற்குள் சென்று[a], மோவாபைத் தொடர்ந்து தாக்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதற்குள்” என்பதை “அந்த நாட்டுக்குள் சென்றார்கள்” அல்லது “மோவாபுக்குள் முன்னேறினார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயில், “அதற்குள் சென்றார்கள்” என்று உள்ளது; அங்குள்ள பெண்பால் ஒருமைச் சுட்டு, மக்களை நேரடியாகக் குறிப்பதைவிட அந்த நாட்டையோ நிலப்பரப்பையோ குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: முகாம்
  rationale: இச்சூழலில் இது படை தங்கியிருந்த இடத்தைக் குறிக்கிறது; ‘முகாம்’ என்பது இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்ற வினை இங்கு போரில் உடனடியாகச் செயல்படத் தொடங்கியதைச் சித்தரிக்கிறது; ‘எழுந்து’ மூலத்தின் உயிரோட்டமான நிகழ்வுப்போக்கைக் காக்கிறது.
- source_word: וַיַּכּוּ
  choice: தாக்கினர்
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்ற பொருளுடையது. போர்ச் சூழலில் ‘தாக்கினர்’ இயல்பாக உள்ளது; ‘தோற்கடித்தனர்’ என்று விளைவை மிகைப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: அவர்களிடமிருந்து தப்பியோடினர்
  rationale: எபிரெயச் சொற்றொடர் ஒருவரின் முன்னிலையிலிருந்து ஓடுவதைக் குறிக்கிறது; தமிழில் இந்தத் தேர்வு படை முறியோடிய பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיָּבֹאוּ בָהּ
  choice: அதற்குள் சென்று
  rationale: בוא என்பது உள்ளே வருதல் அல்லது செல்லுதல். בָּהּ என்பதன் முன்னிலைச் சுட்டு வெளிப்படையாகக் கூறப்படாததால், ‘அதற்குள்’ என்று மொழிபெயர்த்து மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: וְהַכּוֹת
  choice: தொடர்ந்து தாக்கினர்
  rationale: இணைப்புடன் வரும் வினையெச்ச வடிவம் தொடரும் அல்லது உடன்நிகழும் தாக்குதலைக் குறிக்கிறது; ‘தொடர்ந்து தாக்கினர்’ அந்த நீடித்த செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹאָב
  choice: மோவாப் / மோவாபியர்
  rationale: மூலத்தில் ஒரே பெயர் நாடு, மக்கள், படை ஆகியவற்றைக் கூட்டாகக் குறிக்கிறது. தமிழில் வாக்கியப் பங்குக்கு ஏற்ப ‘மோவாபை’ என்றும், தப்பியோடும் மக்களைத் தெளிவுபடுத்த ‘மோவாபியர்’ என்றும் வழங்கப்பட்டுள்ளது.
