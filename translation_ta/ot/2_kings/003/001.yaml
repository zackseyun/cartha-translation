base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: ta
  text: ஆகாபின் மகன் யோராம்[a], யூதாவின் அரசன் யோசபாத்தின் ஆட்சியின் பதினெட்டாம் ஆண்டில், சமாரியாவில் இஸ்ரவேலின் அரசனானான்; அவன் பன்னிரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிகச் சொற்சொல்லாக, “மேலும், ஆகாபின் மகன் யோராம்…” என்று மொழிபெயர்க்கலாம். எபிரெய இணைப்புச்சொல்லை “மேலும்” அல்லது “மற்றும்” என்று மொழிபெயர்க்கலாம்; அது கதைத்தொடர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹרָם
  choice: யோராம்
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்றுள்ள வடிவில் ஒலிபெயர்க்கப்பட்டது. முன்னொட்டான וְ கதைத்தொடர்ச்சியைக் குறிக்கிறது; இயல்பான தமிழ் நடையில் அது முதன்மை உரையில் வெளிப்படையாக மொழிபெயர்க்கப்படாமல், அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: בֶּן אַחְאָב
  choice: ஆகாபின் மகன்
  rationale: தந்தை–மகன் உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு அரசனானான்
  rationale: இங்கு מָלַךְ ஆட்சிக்காலத்தின் நீளத்தை அல்ல, அரசபதவி ஏற்றதைச் சுட்டுகிறது. பின்னர் வரும் ஆட்சிக்காலக் குறிப்பிலிருந்து இதை வேறுபடுத்த ‘அரசனானான்’ பயன்படுத்தப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடத்தைக் குறிக்கும் בְ இயல்பாக ‘-இல்’ என்று மொழிபெயர்க்கப்படுகிறது; இங்கு சமாரியா தலைநகரைக் குறிக்கிறது.
- source_word: בִּשְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் யோசபாத்தின் ஆட்சியின் பதினெட்டாம் ஆண்டில்
  rationale: அரசர்களின் ஆட்சியாண்டுகளை ஒப்பிட்டு காலத்தைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவான தமிழ் அமைப்பில் வழங்குகிறது.
- source_word: וַיִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: அவன் பன்னிரண்டு ஆண்டுகள் ஆட்சி செய்தான்
  rationale: இங்கு מָלַךְ ஆட்சியின் காலநீளத்தைக் குறிக்கிறது; ‘ஆட்சி செய்தான்’ என்பது இயல்பான, தெளிவான தமிழ்表达ாகும்.
