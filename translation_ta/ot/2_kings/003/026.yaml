  source_fidelity: 'முக்கிய கருத்து மூலத்துடன் பொருந்துகிறது: மோவாப் அரசன் போரில் பின்தங்கியதை உணர்ந்து, வாள் உருவிய எழுநூறு பேருடன் ஏதோம் அரசனை நோக்கி முற்றுகையை உடைத்துச் செல்ல முயற்சித்தும் வெற்றியடையவில்லை. இருப்பினும், மூலத்தின் நோக்க-வினையெச்சமான לְהַבְקִיעַ-ஐ ‘செல்ல முயன்றான்’ என வழங்குவது ‘முயற்சி’ என்ற சொல்லை வெளிப்படையாகச் சேர்க்கிறது. அது சூழலில் நியாயமான ஊகமாயினும், அவசியமற்ற சேர்க்கை.'
  naturalness: ‘போர் தனக்கு மிஞ்சிய வலிமையடைந்தது’ நவீன தரத் தமிழில் சற்றே இயல்பற்றதாக உள்ளது. ‘போர் தனக்கு மேலோங்கிவிட்டது’ என்பது மூலத்தின் இராணுவத் தோல்வி/பின்தங்கல் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது. ‘ஊடறுத்துச் செல்ல’ என்பது இராணுவ வரிசை அல்லது முற்றுகையை உடைத்துச் செல்லும் கருத்தை, குறிப்பிடப்படாத ‘படையணி’யைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
  terminology: ‘மோவாப்,’ ‘ஏதோம்,’ ‘அரசன்,’ மற்றும் ‘வாளை உருவிய’ ஆகியவை வரலாற்று மற்றும் வேதாகம நடைக்குப் பொருத்தமானவை. אֶל என்ற முன்னிடைச்சொல்லின் ‘நோக்கி/எதிராக’ இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட வேண்டும்.
