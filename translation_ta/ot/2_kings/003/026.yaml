  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: ta
  text: மோவாப் அரசன், போர் தனக்கு மேலோங்கிவிட்டதைக் கண்டபோது, வாளை உருவிய எழுநூறு பேரைத் தன்னுடன் அழைத்துக்கொண்டு, ஏதோம் அரசனை நோக்கி ஊடறுத்துச் செல்ல முயன்றான்; ஆனால் அவர்களால் முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏதோம் அரசனுக்கு எதிராக ஊடறுத்துச் செல்ல முயன்றான்.” இந்த இராணுவச் சூழலில் எபிரெய முன்னிடைச்சொல் திசையைக் (“நோக்கி”) குறிக்கலாம்; அல்லது பகைமையைக் (“எதிராக”) குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: போர் தனக்கு மிஞ்சிய வலிமையடைந்தது
  rationale: מן உடன் வரும் חזק என்ற எபிரெயச் சொற்றொடர், போர் ராஜாவின் ஆற்றலை மிஞ்சி அவனை மேலோங்கியது என்பதைக் குறிக்கிறது. இத்தமிழாக்கம் அந்த ஒப்பீட்டையும் இராணுவ நெருக்கடியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתוֹ
  choice: தன்னுடன் அழைத்துக்கொண்டு
  rationale: לקח என்பதுடன் இங்கு வரும் குறியீடு, படைவீரர்களைத் தன்னோடு கூட்டிச் சென்றதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க இணைச்செயல் வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: எழுநூறு பேர்
  rationale: இராணுவச் சூழலில் எண்ணப்படும் ஆண்களைச் சுட்டுகிறது. அடுத்துள்ள 'வாளை உருவிய' என்ற சொற்றொடர் அவர்கள் போர்வீரர்கள் என்பதைத் தெளிவாக்குவதால், இயல்பான தமிழில் 'பேர்' போதுமானது.
- source_word: שֹׁלֵף חֶרֶב
  choice: வாளை உருவிய
  rationale: சொல்லெழுத்தாக 'வாளை உருவுகிற' என்ற எபிரெயப் படிமத்தைச் சுருக்கமான, கண்ணியமான தமிழில் காக்கிறது; ஆயுதமேந்திய போர்வீரர்கள் என்ற பொருளையும் தருகிறது.
- source_word: לְהַבְקִיעַ
  choice: படையணியைப் பிளந்துகொண்டு செல்ல
  rationale: בקע என்பதன் ஹிஃபில் வடிவம் எதிரிப் படைவரிசையில் பிளவை உண்டாக்கி ஊடுருவுவதைக் குறிக்கிறது. தமிழில் செயல் தெளிவாக இருக்க 'படையணி' சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ஏதோம் ராஜாவை நோக்கி
  rationale: אֶל என்பது இங்கு 'நோக்கி/அருகே' என்றும் இராணுவச் சூழலில் 'எதிராக' என்றும் கொள்ளப்படலாம். முதன்மை உரை திசைசார்ந்த பொருளை வைத்திருக்கிறது; பகைமைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא יָכֹלוּ
  choice: ஆனால் அவர்களால் முடியவில்லை
  rationale: பன்மை வினை ராஜாவையும் அவனுடைய வீரர்களையும் ஒரு குழுவாகக் குறிக்கிறது. முயற்சி வெற்றியடையவில்லை என்பதை மூலத்தின் சுருக்கத்தோடு காக்கிறது.
