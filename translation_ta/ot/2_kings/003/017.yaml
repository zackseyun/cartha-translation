source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: ta
  text: 'ஏனெனில் யாவே இவ்வாறு கூறுகிறார்: ‘நீங்கள் காற்றையும் காணமாட்டீர்கள்; மழையையும் காணமாட்டீர்கள். ஆனாலும் அந்த ஓடைப்படுகை[a] தண்ணீரால் நிரம்பும். நீங்களும் உங்கள் கால்நடைகளும் உங்கள் விலங்குகளும் குடிப்பீர்கள்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பள்ளத்தாக்கு’ அல்லது ‘வறண்ட ஓடைப்படுகை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נחל ஓடை, ஓடைப்படுகை, அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்; வறண்ட பகுதிகளில் இது பெரும்பாலும் பருவகால நீரோடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமாகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: כִּי כֹה אָמַר
  choice: ஏனெனில் ... இவ்வாறு கூறுகிறார்
  rationale: כִּי என்பதன் விளக்கத் தொடர்பையும் தீர்க்கதரிசன அறிவிப்பு முறையையும் பாதுகாக்கிறது.
- source_word: תִרְאוּ
  choice: காணமாட்டீர்கள்
  rationale: சூழலில் இது எதிர்காலத்தில் கண்ணுக்குப் புலப்படாதவற்றைக் குறிக்கிறது.
- source_word: רוּחַ
  choice: காற்று
  rationale: மழையுடன் இணைந்த வானிலைச் சூழலில் இச்சொல் ஆவி அல்லது மூச்சு என்பதல்ல, காற்றைக் குறிக்கிறது.
- source_word: גֶשֶׁם
  choice: மழை
  rationale: வானிலைச் சூழலுக்குரிய இயல்பான தமிழ் சொல்.
- source_word: הַנַּחַל הַהוּא
  choice: இந்த ஓடைப்படுகை
  rationale: נחל என்பது வறண்ட நிலப்பகுதியில் பருவகாலமாக நீர் ஓடும் ஓடை அல்லது அதன் படுகையைக் குறிக்கலாம். தமிழில் புரிந்துகொள்ளக்கூடிய வகையில் நிலவியல் பொருள் வெளிப்படுத்தப்பட்டுள்ளது; எபிரெயச் சுட்டுப்பெயர் சூழலில் பேசுபவருக்கு முன் உள்ள இடத்தைக் காட்டுவதால் ‘இந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: יִמָּלֵא מָיִם
  choice: தண்ணீரால் நிரம்பும்
  rationale: நிஃபால் வினையின் செயப்பாட்டு அல்லது விளைவு நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: וּשְׁתִיתֶם
  choice: குடிப்பீர்கள்
  rationale: வாக்குறுதியளிக்கப்பட்ட நிகழ்வுகளின் தொடரில் உள்ள எளிய எதிர்காலத்தைத் தெரிவிக்கிறது.
- source_word: מִקְנֵיכֶם
  choice: உங்கள் கால்நடைகள்
  rationale: உடைமையாக வளர்க்கப்படும் மந்தைகள் மற்றும் கால்நடைகளை இச்சூழலில் குறிக்கிறது.
- source_word: בְהֶמְתְּכֶם
  choice: மற்ற விலங்குகள்
  rationale: முந்தைய கால்நடைச் சொல்லுடன் உள்ள வேறுபாட்டைப் பாதுகாத்து, ஒரே பொருளின் தேவையற்ற மறுபதிப்பைத் தவிர்க்க ‘மற்ற’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: YHWH என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: தண்ணீர் வருவதற்கான காணக்கூடிய இயற்கைக் காரணம்
  choice: காற்றோ மழையோ காணப்படாது; ஆனாலும் படுகை நிரம்பும்
  alternative: மழையே பெய்யாது என்று வெளிப்படையாகக் கூறுதல்
  rationale: மூலம் ‘காணமாட்டீர்கள்’ என்றே இருமுறை கூறுகிறது; காற்றோ மழையோ முற்றிலும் நிகழாது என்று அதற்கு அப்பால் முடிவுசெய்யாமல் அந்த மொழித் தளர்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தீர்க்கதரிசன அறிவிப்பின் முறைநடை காக்கப்பட்டாலும் அரிதான ‘வாடி’ என்ற கடன்சொல்லுக்குப் பதிலாக ‘ஓடைப்படுகை’ பயன்படுத்தப்பட்டுள்ளது.
