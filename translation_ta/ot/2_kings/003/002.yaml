  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்; ஆனால், தன் தந்தையையும் தாயையும் போலத் தீமை செய்யவில்லை[a]. மேலும், தன் தந்தை செய்திருந்த பாகாலின் தூணை[b] அவன் அகற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆனால்’ என்பதற்கான எபிரெயச் சொல் எழுத்துப்படி ‘மட்டும்’ அல்லது ‘ஆனால்’ என்றும் மொழிபெயர்க்கப்படலாம். அவன் தீமை செய்தான் என்ற தீர்ப்பை அது வரம்புபடுத்துகிறது; ஆனால் எந்த வகையில் பெற்றோரைப் போல இல்லை என்பதை உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘தூண்’ என்பது பாகால் வழிபாட்டுடன் தொடர்புடைய, செங்குத்தாக நிறுத்தப்பட்ட வழிபாட்டுக் கல் அல்லது புனிதத் தூணைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: עשה + הרע என்ற எபிரெய மரபுத்தொடரின் ஒழுக்க மதிப்பீட்டை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளைத் தமிழில் தெளிவாகவும் நெருக்கமாகவும் வழங்குகிறது; יְהוָה என்பது பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: எனினும், தன் தந்தையையும் தாயையும் போல அல்ல
  rationale: רַק முந்தைய தீர்ப்பை வரம்புபடுத்தும் concessive நுணுக்கத்தைக் கொண்டுள்ளது; அவன் தீமை செய்தாலும் பெற்றோரைப் போன்ற அளவிலோ முறையிலோ இல்லை என்ற பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: וַיָּסַר
  choice: அவன் அகற்றினான்
  rationale: ‘அகற்று, நீக்கு’ என்ற வினைப் பொருளை நேரடியாகத் தருகிறது. எபிரெய இணைப்பை கட்டாயமாகக் காரணவாக்கியமாக மாற்றாமல், அடுத்த செயலாக வழங்குகிறது.
- source_word: מַצְּבַת הַבַּעַל
  choice: பாகாலின் தூண்
  rationale: מַצֵּבָה என்பது நிறுத்தப்பட்ட கல் அல்லது வழிபாட்டுத் தூணைக் குறிக்கிறது. முதன்மை உரையில் சுருக்கமான ‘தூண்’ பயன்படுத்தப்பட்டு, வழிபாட்டுச் சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: தன் தந்தை செய்திருந்த
  rationale: தூணைத் தந்தை முன்பே செய்திருந்தார் என்பதைத் தமிழின் இறந்தகால வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிவடிவமாகத் தருகிறது.
- issue: அவன் பெற்றோரைப் போல இல்லை என்பதன் அளவு
  choice: ஒப்பீட்டை விளக்காமல் அப்படியே பாதுகாத்தல்
  alternative: அவன் பெற்றோரைவிடக் குறைவாகவே தீமை செய்தான்
  rationale: அளவா, விதமா என்பதைக் எபிரெய உரை வெளிப்படையாகக் கூறவில்லை. ஆகவே ‘போல அல்ல’ என்ற உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: தூணை அகற்றியது முந்தைய கூற்றுக்கான காரணமா
  choice: தொடர்ச்சியான செயலாக வழங்குதல்
  alternative: ‘ஏனெனில் அவன் அகற்றினான்’ என்று வெளிப்படையான காரணமாக்குதல்
  rationale: וַיָּסַר என்பதில் ‘மற்றும்/அப்போது’ என்ற கதைத் தொடர்ச்சி நேரடியாக உள்ளது; காரண உறவு சூழலில் சாத்தியமானதாயினும் இலக்கணத்தில் வெளிப்படையாகக் குறிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’, ‘பாகால்’ ஆகியவை பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன; வழிபாட்டுத் தொழில்நுட்பச் சொல்லின் கூடுதல் விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
