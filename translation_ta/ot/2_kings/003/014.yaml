- issue: யோசபாத்தின் முகத்தை உயர்த்துதல் என்ற மரபுத்தொடர்
  choice: யோசபாத்தை நான் மதிக்காமல் இருந்திருந்தால்
  alternative: யோசபாத்தின் முகத்தை நான் உயர்த்தாமல் இருந்திருந்தால்
  rationale: சொல்லுக்குச் சொல் வடிவம் தமிழில் தவறாகப் புரியக்கூடும்; சூழலில் அது யோசபாத்துக்கு மதிப்பு அல்லது சாதகமான கவனம் கொடுப்பதைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. உறுதிமொழியின் வலிமை, தீர்க்கதரிசியின் கடுமையான மறுப்பு, இரட்டை வினை அமைப்பு ஆகியவை காக்கப்பட்டுள்ளன.
