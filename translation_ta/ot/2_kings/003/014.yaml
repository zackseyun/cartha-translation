  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: ta
  text: 'எலிசா கூறினார்: “நான் யாருக்கு முன்னிலையில் நிற்கிறேனோ அந்தப் படைகளின் யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாகச் சொல்கிறேன்: யூதாவின் அரசன் யோசபாத்துக்கு நான் மதிப்பு காட்டாமல் இருந்திருந்தால், உன்னை நோக்கவும் மாட்டேன்; உன்னைப் பார்க்கவும் மாட்டேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: படைகளின் யெகோவா உயிரோடிருப்பது உறுதி
  rationale: எபிரெய உறுதிமொழி வடிவத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; தெய்வப் பெயரையும் צְבָאוֹת என்பதன் பரந்த ‘படைகள்’ என்ற பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: யார் முன்னிலையில் நான் நிற்கிறேனோ
  rationale: தேவனுடைய முன்னிலையில் நிற்கும் நேரடியான காட்சியையும், தீர்க்கதரிசியாகப் பணிபுரியும் உட்பொருளையும் ஒருசேரத் தக்கவைக்கிறது.
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: யோசபாத்தை நான் மதிக்காமல் இருந்திருந்தால்
  rationale: ‘முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவருக்கு மதிப்பும் சாதகமான கவனமும் அளிப்பதைக் குறிக்கிறது; தமிழில் அதன் பொருள் இயல்பாக வழங்கப்படுகிறது.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: உன்னை நோக்கவும் மாட்டேன்; உன்னைப் பார்க்கவும் மாட்டேன்
  rationale: உறுதிமொழிக் கட்டமைப்பில் மறைமுகமாக உள்ள எதிர்மறையை வெளிப்படையாக்கி, ‘நோக்கு’ மற்றும் ‘பார்’ என்ற இணை வினைகளின் வலியுறுத்தலைக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்பால் மாற்றாமல், எபிரெய நான்கெழுத்துத் தெய்வப் பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வப் பெயரை மொழிபெயர்த்தல்
