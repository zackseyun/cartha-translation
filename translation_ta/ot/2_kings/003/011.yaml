base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: ta
  text: அப்போது யோசபாத், “அவர் மூலமாக நாம் யெகோவாவிடம் விசாரிக்க, இங்கே யெகோவாவின் இறைவாக்கினர் யாரும் இல்லையா?” என்றார்.[a] அதற்கு இஸ்ரவேல் அரசனின் பணியாளர்களில் ஒருவன், “சாப்பாத்தின் மகன் எலிசா இங்கே இருக்கிறார்; அவர் எலியாவின் கைகள்மேல் தண்ணீர் ஊற்றியவர்”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “அவரிடமிருந்து நாம் யெகோவாவைத் தேடுவோம்.” இங்கு யெகோவாவின் இறைவாக்கினர் மூலமாக அவரிடம் விசாரிப்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: இது எலிசா, எலியாவின் கைகளைக் கழுவத் தண்ணீர் ஊற்றி அவருக்குத் தனிப்பட்ட பணிவிடை செய்ததைக் குறிக்கலாம்; எபிரெய மொழியின் உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
    reason: cultural_note
