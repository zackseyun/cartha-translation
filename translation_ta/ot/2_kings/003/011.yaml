  choice: யெகோவாவின் இறைவாக்கினர்
  rationale: லாமேத் குறிக்கும் உறவு அல்லது சார்பை இயல்பான உடைமைத் தொடரால் காட்டுகிறது; נָבִיא என்பதற்கு dignified and current Tamil term 'இறைவாக்கினர்' பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள இறைபெயரைப் பெயராகவே பாதுகாக்கிறது.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאֹתוֹ
  choice: அவர் மூலமாக நாம் யெகோவாவிடம் விசாரிக்கலாமே
  rationale: דרשׁ என்பதன் விசாரித்தல்/வழிகேட்டல் பொருளையும், தீர்க்கதரிசி வழியான நடுநிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசனின் பணியாளர்களில் ஒருவன்
  rationale: அரண்மனைச் சூழலில் עֶבֶד என்பது அடிமை என்பதைக் காட்டிலும் பணியாளர் அல்லது சேவகர் என்ற பொருளில் வருவதால் இத்தேர்வு செய்யப்பட்டது.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: அவர் எலியாவின் கைகளில் தண்ணீர் ஊற்றியவர்
  rationale: எலிசா எலியாவுக்குச் செய்த தனிப்பட்ட பணிவிடையைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது; வினையின் நிறைவேற்றப்பட்ட வடிவத்தில் இல்லாத வழக்கமான செயல் என்ற நுணுக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: இறைபெயர் יְהוָה-வை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் வழங்குகிறது.
- issue: தீர்க்கதரிசி வழியாக யெகோவாவிடம் விசாரித்தல்
  choice: அவர் மூலமாக நாம் யெகோவாவிடம் விசாரிக்கலாமே
  alternative: அவரிடமிருந்து யெகோவாவைத் தேடுவோம்
  rationale: מֵאֹתוֹ குறிக்கும் தீர்க்கதரிசி வழியான விசாரணையைத் தெளிவாக்குகிறது; அதேவேளை தீர்க்கதரிசியே விசாரணையின் இறுதி இலக்கு எனப் பொருள்படுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் யோசபாத், எலிசா, சாப்பாத், எலியா என வழக்கமான தமிழ் வேதாகம ஒலிப்பெயர்ப்புகளுக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன. மூலத்தின் பணிவிடை உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பண்பாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
