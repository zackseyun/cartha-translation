  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: ta
  text: யோசபாத், “யாவேயின் வார்த்தை அவரிடம் இருக்கிறது,” என்றார். எனவே இஸ்ரவேலின் அரசனும் யோசபாத்தும் ஏதோமின் அரசனும் அவரிடம் இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்ற வழக்கமான எபிரெயக் கதைநடை வினைச்சொல்லை நேரடியான உரையின் இயல்பான தமிழ் அறிமுகமாகத் தருகிறது.
- source_word: יֵשׁ אֹתוֹ
  choice: அவரிடம் இருக்கிறது
  rationale: יֵשׁ உடன் אֹתוֹ வருவது உடைமை அல்லது ஒருவரிடத்தில் இருப்பதைக் குறிக்கும். ‘அவரிடம் இருக்கிறது’ என்பது இந்த எபிரெய அமைப்பை இயல்பான தமிழில் காத்து, எலிசாவிடம் இறைவாக்கு கிடைக்கிறது என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் வரும் நிலையான சொற்றொடரின் வேதாகமத் தன்மையைக் காக்கிறது; அதேவேளை ‘யாவேயிடமிருந்து ஒரு வார்த்தை’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான YHWH-ஐ ‘Yahweh’ என்ற ஒலிப்புக்கு ஏற்ற நவீன தமிழ் வடிவில் நேரடியாகக் குறிக்கிறது.
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகக் காக்கிறது; தமிழில் இயல்பான இயக்கவினைத் தொடராக உள்ளது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: ‘அவரை நோக்கி/அவரிடம்’ என்ற இலக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: முறையான அரசப் பட்டத்தைத் தெளிவாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: וִיהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: ஏதோமின் அரசன்
  rationale: எபிரெய இணை அமைப்பையும் முறையான அரசப் பட்டத்தையும் காக்கிறது.
theological_decisions:
- issue: דְּבַר יְהוָה என்பது எலிசாவுடன் கொண்டுள்ள தொடர்பு
  choice: “யாவேயின் வார்த்தை அவரிடம் இருக்கிறது” என்று மொழிபெயர்த்து, உண்மையான இறைவாக்கு எலிசாவிடம் கிடைக்கிறது என்ற பொருளை முன்வைத்தல்
  alternative: “யாவேயிடமிருந்து ஒரு வார்த்தை அவரிடம் இருக்கிறது” அல்லது “அவரிடம் யாவேயின் செய்தி இருக்கிறது”
  rationale: எபிரெயில் உள்ள உடைமை/உடனிருப்பு அமைப்பு, இது குறிப்பிட்ட ஒரு செய்தியையா அல்லது தீர்க்கதரிசன வார்த்தை அவரிடம் இருப்பதையா குறிக்கிறது என்பதை முழுமையாகத் தீர்மானிக்கவில்லை. முதன்மை உரை நிலையான தீர்க்கதரிசனச் சொல்லாட்சியைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற திருநாமத்தின் வழங்கல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை’ தீர்க்கதரிசனச் சொல்லாட்சியைத் தக்கவைக்கிறது; ‘இறங்கிச் சென்றார்கள்’ மூலத்தின் திசைநுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது. அரசர்களின் பட்டியல் எபிரெய மூலத்தின் வரிசையிலேயே வைக்கப்பட்டுள்ளது.
