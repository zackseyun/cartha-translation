base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: ta
  text: மோவாபின் அரசனான மேஷா செம்மறியாடுகளை வளர்ப்பவனாக இருந்தான். அவன் இஸ்ரவேலின் அரசனுக்கு ஒரு லட்சம் ஆட்டுக்குட்டிகளையும், ஒரு லட்சம் செம்மறியாட்டுக் கடாக்களின் கம்பளி மயிரையும்[a] கப்பமாகச் செலுத்திவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு லட்சம் கடாக்கள், கம்பளி மயிர்.” இச்சொற்றொடர் சுருக்கமானது; இது “கம்பளி மயிருள்ள ஒரு லட்சம் கடாக்கள்” என்றும் பொருள்படலாம். ஆனால் சூழலைக் கருத்தில் கொண்டால், “ஒரு லட்சம் கடாக்களின் கம்பளி மயிர்” என்பதே அதிகம் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: ஆடு வளர்ப்பவன்
  rationale: ஆடுகளை வளர்த்துப் பெருக்கும் தொழிலில் ஈடுபட்ட ஒருவனைக் குறிக்கும் எபிரெயச் சொல்லை, இன்றைய வாசகர்களுக்கு இயல்பாகவும் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கிறது.
- source_word: וְהֵשִׁיב
  choice: கப்பமாகச் செலுத்திவந்தான்
  rationale: இங்கு שוב என்பதன் ஹிஃபில் வடிவம் அரசனுக்குத் தொடர்ந்து செலுத்தப்பட்ட திறை அல்லது கப்பத்தைக் குறிக்கிறது; ‘செலுத்திவந்தான்’ அதன் வழக்கமான, தொடர்ச்சியான தன்மையை வெளிப்படுத்துகிறது.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: ஒரு லட்சம் ஆட்டுக்குட்டிகள்
  rationale: כָּרִים என்பது ஆட்டுக்குட்டிகளை அல்லது இளம் ஆண் ஆடுகளைக் குறிக்கலாம்; கப்பப் பட்டியலின் சூழலில் ‘ஆட்டுக்குட்டிகள்’ இயல்பான பொதுவான மொழிபெயர்ப்பு.
- source_word: מֵאָה אֶלֶף אֵילִים צָמֶר
  choice: ஒரு லட்சம் செம்மறியாட்டுக் கடாக்களின் கம்பளி மயிர்
  rationale: எபிரெயில் ‘ஒரு லட்சம் கடாக்கள், கம்பளி மயிர்’ எனச் சுருக்கமாக அமைந்துள்ள சொற்றொடரின் சூழல்சார் பொருளைத் தமிழில் தெளிவாக்குகிறது; மூலத்தின் வேறு சாத்தியமான வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: மோவாபின் அரசன் / இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கட்டிணை அமைப்பை இயல்பான நவீனத் தமிழில் வழங்கும் நிலையான மொழிபெயர்ப்பு.
