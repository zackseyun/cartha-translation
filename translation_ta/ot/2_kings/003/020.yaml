  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: ta
  text: 'காலையில், தானியக் காணிக்கையைச் செலுத்தும் வேளையில்[a], இதோ, ஏதோம் திசையிலிருந்து[b] தண்ணீர் வந்துகொண்டிருந்தது; நிலம் தண்ணீரால் நிரம்பியது.[c]


    [a] எபிரெய மொழியில், “தானியக் காணிக்கையை மேலே ஏற்றும் வேளையில்” என்று சொல்லப்பட்டுள்ளது. இது பலிபீடத்தில் காணிக்கையைச் செலுத்துவதைக் குறிக்கும் பலியிடுதல் சார்ந்த சொல்லாட்சி.


    [b] அல்லது, “ஏதோம் வழியிலிருந்து” / “ஏதோம் வழியாக.”


    [c] எபிரெய மொழியில், “நிலம் அந்தத் தண்ணீரால் நிரம்பியது” என்று உள்ளது; தமிழில் இயல்பாக, “நிலம் தண்ணீரால் நிரம்பியது” என்றும் சொல்லலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “தானியக் காணிக்கையை மேலே ஏற்றும் வேளையில்” என்று சொல்லப்பட்டுள்ளது. இது பலிபீடத்தில் காணிக்கையைச் செலுத்துவதைக் குறிக்கும் பலியிடுதல் சார்ந்த சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏதோம் வழியிலிருந்து” / “ஏதோம் வழியாக.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழியில், “நிலம் அந்தத் தண்ணீரால் நிரம்பியது” என்று உள்ளது; தமிழில் இயல்பாக, “நிலம் தண்ணீரால் நிரம்பியது” என்றும் சொல்லலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: வַיְהִי என்பது கதைத் தொடரை முன்னெடுக்கும் வழக்கமான எபிரெய அமைப்பு; தமிழில் தனியாக ‘நிகழ்ந்தது’ என்று சேர்க்காமல் காலக்குறிப்புடன் தொடங்குவது இயல்பானது.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: தானியக் காணிக்கை செலுத்தப்படும் வேளையில்
  rationale: עָלָה என்பதன் சொற்பொருள் ‘மேலே எழுதல்’; பலியிடுதல் சூழலில் அது பலிபீடத்தில் காணிக்கையைச் செலுத்துவதைக் குறிக்கிறது. מִנְחָה இங்கு பொதுவான பரிசை அல்ல, தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத காட்சியின்மீது வாசகரின் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: מַיִם בָּאִים
  choice: தண்ணீர் வந்துகொண்டிருந்தது
  rationale: בָּאִים என்பது நிகழ்ந்துகொண்டிருக்கும் அல்லது கண்முன் தென்படும் இயக்கத்தைக் காட்டும் பங்கேற்புவினை வடிவம்; அதனால் தொடர்நிலை தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: ஏதோம் திசையிலிருந்து
  rationale: דֶּרֶךְ என்பதற்கு ‘வழி’ என்பது அடிப்படைப் பொருள்; இக்கட்டமைப்பில் தண்ணீர் வந்த திசை அல்லது பாதையைக் குறிக்கிறது. முதன்மை உரை இயல்பாகத் திசையைச் சொல்கிறது; ‘வழி’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: அந்த நிலப்பகுதி அந்தத் தண்ணீரால் நிரம்பியது
  rationale: הָאָרֶץ இங்கு முழு பூமியைக் காட்டிலும் சுற்றியுள்ள நிலம் அல்லது பகுதியைக் குறிக்கிறது. הַמָּיִם முன் குறிப்பிடப்பட்ட குறிப்பிட்ட தண்ணீரை மீண்டும் சுட்டுவதால் ‘அந்தத் தண்ணீர்’ என வழங்கப்பட்டுள்ளது.
