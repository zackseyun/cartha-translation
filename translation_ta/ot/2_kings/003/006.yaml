  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. ‘மஸ்டர் செய்தான்’ போன்ற அயல்மொழிச் சொல்லைத் தவிர்த்து, இராணுவச் சூழலைத் தெளிவாக்கும் ‘படைக்காகத் திரட்டினான்’ பயன்படுத்தப்பட்டது.
