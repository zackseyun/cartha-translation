  text: וַ/יֵּצֵ֞א הַ/מֶּ֧לֶךְ יְהוֹרָ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא מִ/שֹּׁמְר֑וֹן וַ/יִּפְקֹ֖ד אֶת כָּל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: ta
  text: அந்த நாளில் யோராம் அரசன் சமாரியாவிலிருந்து புறப்பட்டு, இஸ்ரவேலர் அனைவரையும் அணிதிரட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் அனைவரையும் எண்ணிக்கையிட்டான்” அல்லது “ஆய்வு செய்தான்.” இந்த எபிரெய வினைச்சொல் எண்ணிக்கையிடுதலையையோ இராணுவ அணிதிரட்டலையையோ ஆய்வையையோ குறிக்கலாம்; இங்கேயுள்ள சூழல் இராணுவப் பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு
  rationale: יצא என்பதன் அடிப்படை இயக்கப் பொருளான ‘வெளியே செல்/புறப்படு’ என்பதை இயல்பான தமிழ் நடையில் தருகிறது; இதற்கு தனியே இராணுவ அணிவகுப்பு என்ற மிகைநுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: யோராம் அரசன்
  rationale: எபிரெயப் பெயரையும் அரசப் பட்டத்தையும் நவீனத் தமிழின் இயல்பான வரிசையில் வழங்குகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற காலக்குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; சூழலில் உடனடியாக மேற்கொண்ட நடவடிக்கையையும் ‘ஏ’ வலியுறுத்தல் வெளிப்படுத்துகிறது.
- source_word: מִשֹּׁמְרוֹן
  choice: சமாரியாவிலிருந்து
  rationale: מן குறிக்கும் புறப்படும் இடத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּפְקֹד
  choice: படைக்காகத் திரட்டினான்
  rationale: פקד என்பது எண்ணுதல், கணக்கெடுத்தல், ஆய்வு செய்தல், படையைத் திரட்டுதல் ஆகிய பொருள்களைக் கொள்ளலாம். போர்ப்பயணச் சூழலில் இராணுவப் பொருளைத் தெளிவாகக் கொடுக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: இங்கு வடக்கு அரசின் மக்களை, குறிப்பாகத் திரட்டப்பட்ட போர்வீரர்களை, கூட்டாகக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது.
