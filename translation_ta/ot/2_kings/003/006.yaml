- from: அன்றே யோராம் அரசன் சமாரியாவிலிருந்து புறப்பட்டு, இஸ்ரவேலர் அனைவரையும் படைக்காகத் திரட்டினான்.[a]
  to: அந்த நாளில் யோராம் அரசன் சமாரியாவிலிருந்து புறப்பட்டு, இஸ்ரவேலர் அனைவரையும் அணிதிரட்டினான்.[a]
