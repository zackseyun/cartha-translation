  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன், யூதாவின் அரசனுடனும் ஏதோமின் அரசனுடனும் புறப்பட்டுச் சென்றான். அவர்கள் ஏழு நாள் பயணத் தூரமுள்ள சுற்றுவழியில் சென்றார்கள். ஆனால் முகாமுக்கோ அவர்களைப் பின்தொடர்ந்த கால்நடைகளுக்கோ[a] தண்ணீர் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவர்களுடைய காலடியில் இருந்த கால்நடைகள்”; இது அவர்களுடன் சென்ற விலங்குகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டுச் சென்றான்
  rationale: הלך என்பதன் அடிப்படை நகர்வுப் பொருளைத் தருகிறது; சூழலில் உள்ள படையெடுப்பு நுணுக்கத்தை வினைச்சொல்லுக்குள் தேவையின்றி சேர்க்கவில்லை.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: இஸ்ரவேலின் அரசன், யூதாவின் அரசனுடனும் ஏதோமின் அரசனுடனும்
  rationale: மூன்று அரசர்களையும் தெளிவாகக் குறிப்பிடுகிறது; எபிரெய வாக்கியத்தின் ஒருமை வினை முதன்மையாக இஸ்ரவேலின் அரசனுடன் பொருந்துவதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיָּסֹבּוּ
  choice: சுற்றிச் சென்றார்கள்
  rationale: סבב குறிக்கும் நேரடியல்லாத, சுற்றிச் செல்லும் நகர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ஏழு நாள் பயண வழியாக
  rationale: דֶּרֶךְ என்பதிலுள்ள ‘வழி/பயணம்’ பொருள் பரப்பையும் ஏழு நாளுடன் அதன் தொடர்பையும் முற்றிலும் ஒரு கால அளவாக மட்டும் சுருக்காமல் காக்கிறது.
- source_word: וְלֹא הָיָה מַיִם
  choice: தண்ணீர் இல்லை
  rationale: இருப்பின்மையைக் குறிக்கும் எளிய எபிரெய கூற்றை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לַמַּחֲנֶה
  choice: முகாமுக்கு
  rationale: מַחֲנֶה என்பதன் பொதுவான பொருளைத் தருகிறது; ‘படை முகாம்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: וְלַבְּהֵמָה
  choice: கால்நடைகளுக்கு
  rationale: படையுடன் சென்ற சுமை மற்றும் வீட்டு விலங்குகளைக் கூட்டாகக் குறிக்கும் בְּהֵמָה என்பதற்கு சூழலுக்கு ஏற்ற இயல்பான சொல்.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: அவர்களைப் பின்தொடர்ந்த
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய காலடியில் இருந்த’ என்ற மரபுத்தொடரின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
