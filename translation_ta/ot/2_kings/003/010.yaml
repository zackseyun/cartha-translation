id: 2KI.3.10
reference: 2 Kings 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன், “ஐயோ! யாவே இந்த மூன்று அரசர்களையும் மோவாபின் கையில் ஒப்புக்கொடுப்பதற்காக அழைத்திருக்கிறாரே![a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோவாபின் கையில்” என்பது “மோவாபின் அதிகாரத்துக்குள்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ காட்டுகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: பெயர் இவ்வசனத்தில் குறிப்பிடப்படாததால், மூலத்திலுள்ள பட்டம் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: אֲהָהּ
  choice: ஐயோ!
  rationale: துயரத்தையும் அச்சத்தையும் வெளிப்படுத்தும் இயல்பான, கண்ணியமான தமிழ் இடைச்சொல்.
- source_word: קָרָא
  choice: அழைத்திருக்கிறார்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘அழைத்தல்’ தக்கவைக்கப்படுகிறது; ‘ஒன்றுகூட்டினார்’ என்று சூழலை விளக்கி விரிவாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: இந்த மூன்று அரசர்களையும்
  rationale: குறிப்பிட்ட கூட்டணியைக் குறிக்கும் எண்ணும் சுட்டுப்பெயரும் இயல்பான தமிழில் வழங்கப்படுகின்றன; ‘அழைத்தல்’ வினைக்கேற்ப இரண்டாம் வேற்றுமை பயன்படுத்தப்படுகிறது.
- source_word: לָתֵת אֹתָם בְּיַד מוֹאָב
  choice: மோவாபின் கையில் ஒப்புக்கொடுப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐ ‘-தற்காக’ எனவும், பகைவரின் அதிகாரத்துக்கு ஒப்படைத்தலைக் குறிக்கும் கை மரபுத்தொடரைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலம் தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது; ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: קָרָא என்பது அழைப்பையா, ஒன்றுகூட்டுதலையா குறிக்கிறது
  choice: அழைத்திருக்கிறார்
  alternative: ஒன்றுகூட்டியிருக்கிறார்
  rationale: வினையின் நேரடியான பொருளைத் தக்கவைத்து, அரசனின் சூழ்நிலை விளக்கத்தை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: அரசனின் கூற்றை உண்மையான தெய்வ நோக்கமாக உறுதிப்படுத்துவதா
  choice: அரசனின் அச்சமிகுந்த மதிப்பீடாகவே நேரடி உரையில் வைத்தல்
  alternative: யாவேயின் உறுதிப்படுத்தப்பட்ட நோக்கமாக விளக்குதல்
  rationale: இது இஸ்ரவேல் அரசனின் கூற்று; கதையாசிரியர் இங்கே அதைத் தனியாக உறுதிப்படுத்தவில்லை. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், எபிரெய கை மரபுத்தொடரும் அரசனின் அச்சமிகுந்த குரலும் தக்கவைக்கப்பட்டுள்ளன. ‘ஐயோ ... இருக்கிறாரே’ என்ற அமைப்பு אֲהָהּ என்பதன் புலம்பல் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
