base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ta
  text: எலிசா இஸ்ரவேலின் அரசனிடம், “உனக்கும் எனக்கும் என்ன தொடர்பு?[a] உன் தகப்பனின் தீர்க்கதரிசிகளிடமும் உன் தாயின் தீர்க்கதரிசிகளிடமும் போ” என்றார். ஆனால் இஸ்ரவேலின் அரசன் அவரிடம், “இல்லை;[b] யாவே இந்த மூன்று அரசர்களையும் மோவாபின் கையில் கொடுப்பதற்காக அழைத்திருக்கிறார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மரபுத்தொடரின் நேரடிப் பொருள்: “எனக்கும் உனக்கும் என்ன?” இது விலகல் அல்லது மறுப்பை வெளிப்படுத்தும் ஒரு சொல்லாட்சி.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அப்படிச் செய்யாதீர்; ஏனெனில் யாவே இந்த மூன்று அரசர்களையும் அழைத்திருப்பது...” எபிரெய சொற்றொடர் பொருள் தீர்மானிக்கக் கடினமானது; அது கடுமையான மறுப்பாக அல்லாமல் ஒரு வேண்டுகோளாகவும் வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: உனக்கும் எனக்கும் என்ன தொடர்பு?
  rationale: இது பகிர்ந்த உடைமையைப் பற்றிய நேரடியான கேள்வி அல்ல; விலகல் அல்லது மறுப்பை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். தமிழில் இயல்பாகவும் அதன் கடுமை குறையாமலும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לֵךְ
  choice: போ
  rationale: எபிரெய மூலத்தின் எளிய ஒருமை ஆண்பால் கட்டளையை விரிவாக்கமின்றி நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: உன் தகப்பனின் தீர்க்கதரிசிகள் ... உன் தாயின் தீர்க்கதரிசிகள்
  rationale: அரச குடும்பத்தோடு தொடர்புடைய தீர்க்கதரிசிகளைச் சுட்டும் மூலத்தின் கூர்மையான குறிப்பை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אַל כִּי
  choice: இல்லை; ...
  rationale: தெளிவுபடுத்தக் கடினமான இந்தச் சுருக்கமான சொற்றொடர் சூழலில் மறுப்பு அல்லது எதிர்ப்பாகப் புரிந்துகொள்ளப்படலாம். பிரதான உரை அந்தப் பொருளைச் சுருக்கமாகத் தருகிறது; வேண்டுகோள் என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: קָרָא
  choice: அழைத்திருப்பது
  rationale: இங்கே மூன்று அரசர்களையும் யாவே அழைத்தார் அல்லது ஒன்றுகூட்டினார் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; தொடர்ந்து வரும் நோக்கவினை அதன் விளைவைக் கூறுகிறது.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: இந்த மூன்று அரசர்களையும்
  rationale: சுட்டுப்பெயர், எண், அரசர்கள் ஆகிய மூலக்கூறுகள் இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לָתֵת אוֹתָם
  choice: அவர்களை ... கொடுப்பதற்காக
  rationale: அழைத்ததன் நோக்கம் அல்லது விளைவைக் காட்டும் எபிரெய வினையெச்ச அமைப்பை நெருக்கமாகத் தருகிறது.
- source_word: בְּיַד מוֹאָב
  choice: மோவாபின் கையில்
  rationale: மோவாபின் அதிகாரத்திற்கு உட்படுத்தப்படுதல் என்ற பொருளுடைய எபிரெய 'கை' உருவகத்தை தமிழிலும் புரிந்துகொள்ளக்கூடிய வகையில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: அரசனின் אַל כִּי என்ற பதிலின் வலிமை
  choice: 'மறுப்பு அல்லது எதிர்ப்பு: “இல்லை; ...”'
  alternative: 'வேண்டுகோள்: “அப்படிச் செய்யாதீர்; ஏனெனில் ...”'
  rationale: எபிரெய தொடர் சுருக்கமானதும் பொருள் தீர்மானிக்கக் கடினமானதும் ஆகும். சூழல் எலிசாவின் புறக்கணிப்புக்கு அரசன் எதிர்ப்புத் தெரிவிப்பதை ஆதரிக்கிறது; எனினும் வேண்டுகோள் வாசிப்பும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எலிசாவின் திட்டவட்டமான மறுப்பை உணர்த்த ஒருமை ‘உன்/போ’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; அரசன் எலிசாவைக் குறிப்பிடும் இடத்தில் மரியாதை வடிவமான ‘அவரிடம்’ பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’, ‘யாவே’, ‘மோவாப்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
