base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: ta
  text: அவர்கள், “இது இரத்தம்! அரசர்கள் நிச்சயமாகத் தங்களுக்குள் போரிட்டு, ஒருவரை ஒருவர் தாக்கியிருக்கிறார்கள்.[a] இப்போது, மோவாபே,[b] கொள்ளைப் பொருளை எடுக்கப் புறப்படு!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசர்கள் முற்றிலும் அழிந்துவிட்டார்கள்.” ‘அழிக்கப்படுதல்/பாழாக்கப்படுதல்’ என்பதற்கான எபிரெய வினை இங்கு வலியுறுத்தும் வடிவில் உள்ளது; சூழலில், அரசர்கள் ஒருவருக்கு எதிராக ஒருவர் திரும்பியதாக மோவாபியர் கருதியதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மோவாபியர்களே, கொள்ளையடிக்கப் புறப்படுங்கள்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: இது இரத்தம்!
  rationale: வினைச்சொல் இல்லாத எபிரெய ஆச்சரியக் கூற்றில் உள்ள זֶה என்பதன் சுட்டும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: ஒருவரோடு ஒருவர் போரிட்டு ... என்பது உறுதி
  rationale: חרב என்பதன் வினையெச்ச முழுவடிவமும் முடிவுற்ற வினையும் சேர்ந்த அமைப்பு வலியுறுத்தலைக் குறிக்கிறது. அடுத்துள்ள பரஸ்பரத் தாக்குதல் கூற்றின் அடிப்படையில், அரசர்கள் தங்களுக்குள் போரிட்டதாக மோவாபியர் ஊகிப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நேரடியான ‘முற்றிலும் அழிந்தார்கள்’ என்ற மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַמְּלָכִים
  choice: அரசர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட கூட்டணியின் அரசர்களைக் குறிக்கும் திட்டமான பன்மை.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: ஒருவரை ஒருவர் வெட்டிச் சாய்த்திருக்கிறார்கள்
  rationale: אִישׁ אֶת־רֵעֵהוּ பரஸ்பரச் செயலைக் குறிக்கிறது; போர் சூழலில் נכה என்பதற்கு ‘வெட்டிச் சாய்த்தல்’ தெளிவான, இயல்பான தமிழ்.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: கண்டதைப் பற்றிய முடிவிலிருந்து அவசரமான செயலுக்கான அழைப்புக்கு மாறுவதைக் குறிக்கிறது.
- source_word: לַשָּׁלָל
  choice: கொள்ளைப் பொருளை எடுக்கப் புறப்படு
  rationale: לְ என்பதன் திசைநோக்கிய வலிமையையும், கொள்ளையைக் கைப்பற்றச் செல்லும் போர்க்கூச்சின் அவசரத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: מוֹאָב
  choice: மோவாபே
  rationale: நாட்டின் பெயரை நேரடி விளியாகப் பயன்படுத்தும் எபிரெய வடிவத்தையும் கூர்மையான போர்க்கூச்சையும் காக்கிறது.
