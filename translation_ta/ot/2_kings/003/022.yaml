base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்தார்கள். சூரியன் தண்ணீரின்மேல் ஒளிவீசியது; மோவாப் மக்கள் தங்களுக்கு எதிரே இருந்த தண்ணீர் இரத்தத்தைப்போல் சிவப்பாக இருப்பதைக் கண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மோவாப்’ என்பது மோவாப் மக்களைத் தொகுப்பாகக் குறிக்கிறது. இடத்தைக் குறிக்கும் சொற்றொடரை ‘தங்களுக்கு எதிரே’ அல்லது ‘தங்களுக்கு மறுபுறத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: அவர்கள் அதிகாலையில் எழுந்தார்கள்
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַבֹּקֶר உடன் சேர்ந்து வரும் காலக் குறிப்பை இயல்பான நவீன தமிழில் இவ்வாறு தருகிறது.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: சூரியன் தண்ணீரின்மேல் ஒளிவீசியது
  rationale: זרח என்பது உதித்தல் அல்லது ஒளிவீசுதல் என்ற பொருள்களைத் தரலாம்; இச்சூழலில் தண்ணீர்மீது பட்ட சூரிய ஒளியால் ஏற்பட்ட காட்சியே முன்னிலைப்படுவதால் ‘ஒளிவீசியது’ பொருத்தமானது.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: மோவாப் மக்கள் ... கண்டார்கள்
  rationale: மோவாப் என்ற ஒருமை நாட்டுப்பெயர் இங்கு அந்த மக்களைத் தொகுப்பாகக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க ‘மோவாப் மக்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מִנֶּגֶד
  choice: தங்களுக்கு எதிரே இருந்த
  rationale: இந்தச் சொல் எதிரில் அல்லது மறுபுறத்தில் அமைந்த இடத்தொடர்பைக் குறிக்கிறது; ‘தங்களுக்கு எதிரே இருந்த’ என்பது அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: தண்ணீர் இரத்தத்தைப்போல் சிவப்பாக இருப்பதை
  rationale: אֲדֻמִּים என்பது ‘சிவப்பான’ என்றும் כַּדָּם என்பது ‘இரத்தத்தைப்போல்’ என்ற உவமையையும் தருகின்றன; காட்சியின் உயிரோட்டத்தை இச்சொற்றொடர் இயல்பான தமிழில் பாதுகாக்கிறது.
