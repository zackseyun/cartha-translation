  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יְדַבֵּ֣ר וַ/יֹּ֔אמֶר שִׁמְע֛וּ דְּבַר הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: ta
  text: 'அப்போது ரப்சாக்கே நின்று, யூதாவின் மொழியில்[a] உரத்த குரலில் கூப்பிட்டுப் பேசிச் சொன்னான்: “மகா அரசராகிய அசீரியா அரசரின் வார்த்தையைக் கேளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிரேய மொழியில்.” இங்குள்ள எபிரேயச் சொல் குறிப்பாக யூதா நாட்டின் மொழியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்று
  rationale: עמד என்பதன் இயல்பான கதைநடைப் பொருளான ‘நின்றான்’ என்பதை, தொடர்வினை அமைப்புக்கு ஏற்றவாறு ‘நின்று’ என்று வழங்குகிறது.
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது அசீரிய அரசவையின் பதவிப்பெயராக இருக்கலாம்; வரலாற்றுச் சிறப்புப் பெயரின் வடிவத்தைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: உரத்த குரலில் கூப்பிட்டு
  rationale: பொதுமக்கள் கேட்கும்படி குரலை உயர்த்தி அழைத்துப் பேசும் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוּדִית
  choice: யூத மொழியில்
  rationale: இச்சொல் பொதுவாக எபிரெய மொழி முழுவதையும் குறிப்பிடாமல், குறிப்பாக யூதா நாட்டின் மொழி அல்லது பேச்சுவழக்கைக் குறிக்கிறது.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: பேசிச் சொன்னான்
  rationale: மூலத்தில் உள்ள இரட்டை பேச்சு அறிமுகத்தையும் தமிழில் அளவுக்கு மீறிய செயற்கைத்தன்மை இல்லாமல் பாதுகாக்கிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் அதிகாரப்பூர்வ அறிவிப்பின் நேரடித் தொனியையும் காக்கிறது.
- source_word: דְּבַר
  choice: வார்த்தை
  rationale: அரசரின் அதிகாரப்பூர்வ அறிவிப்பு அல்லது உரையைச் சுட்டும் மூலச்சொல்லின் மரபான, முறையான பொருளைத் தருகிறது.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: மகா அரசர்
  rationale: அசீரிய அரச பட்டப்பெயரின் நேரடியான ‘பெரிய/மகா அரசர்’ என்ற கருத்தை முறையான தமிழில் பாதுகாக்கிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரியாவின் அரசர்
  rationale: எபிரெய இணைப்புத் தொடரைத் தெளிவான, இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
