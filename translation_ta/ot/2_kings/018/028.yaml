  register: நவீனத் தரத் தமிழில் பொதுவாகப் புரியும், அதேவேளையில் அரச அறிவிப்புக்குரிய கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘பேசினான், சொன்னான்’ என்ற இரட்டை அமைப்பு ‘பேசிச் சொன்னான்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
