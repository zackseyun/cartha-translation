source:
  edition: WLC
  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: ta
  text: அசீரிய அரசனின் கையிலிருந்து தேசங்களின் தெய்வங்கள் ஒவ்வொன்றும் தத்தம் நாட்டை உண்மையிலேயே விடுவித்ததுண்டா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் வினை வலியுறுத்தப்பட்டுள்ளது; சொல்லுக்கு நெருக்கமாக, ‘தேசங்களின் தெய்வங்கள் தத்தம் நாட்டை விடுவிக்கத்தான் விடுவித்தனவா?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: உண்மையிலேயே விடுவித்ததுண்டா?
  rationale: நצל வேரின் வினையெச்சப் பெயருடன் முற்றுவினை இணையும் எபிரெய வலியுறுத்தலை, சவாலான வினாவின் இயல்பைத் தக்கவைக்கும் நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: தேசங்களின் தெய்வங்கள்
  rationale: பன்மை இணைப்புநிலையையும், வெவ்வேறு தேசங்களுக்குரிய தெய்வங்களைப் பற்றிய அசீரியப் பேச்சாளரின் குறிப்பையும் நேரடியாகக் காக்கிறது.
- source_word: אִישׁ
  choice: ஒவ்வொன்றும்
  rationale: இங்கு ஆண் நபரைக் குறிக்காமல் பகிர்நிலைப் பொருளில் வரும் சொல்லை, தெய்வங்கள் ஒவ்வொன்றையும் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶת אַרְצוֹ
  choice: தத்தம் நாட்டை
  rationale: பகிர்நிலை ஒருமைப் பின்னொட்டின் பொருளைத் தமிழின் ‘தத்தம்’ மூலம் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ஒவ்வொரு தெய்வத்திற்கும் உரிய நாட்டைக் குறிக்கிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ஆற்றல் அல்லது ஆதிக்கத்திலிருந்து விடுவித்தல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய வேதாகம மொழிநடையில் காக்கிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
