translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் வினாவுருவ ஏளனச் சவாலும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன; ‘ஒவ்வொன்றும் தத்தம்’ பகிர்நிலை அமைப்பை இயல்பாகத் தெரிவிக்கிறது.
