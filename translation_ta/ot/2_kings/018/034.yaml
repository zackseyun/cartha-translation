base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: ta
  text: ஹமாத், அர்ப்பாத் ஆகிய இடங்களின் தெய்வங்கள் எங்கே? செப்பர்வாயீம், ஹேனா, இவ்வா[a] ஆகிய இடங்களின் தெய்வங்கள் எங்கே? அந்தத் தெய்வங்கள் சமாரியாவை என் கையிலிருந்து விடுவித்தனவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த இடப்பெயரின் எழுத்துவடிவம் மொழிபெயர்ப்பு மரபுகளில் மாறுபடுகிறது; இது “அவ்வா” அல்லது “இவ்வா/அவ்வா” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இடத்தை வினவும் சொல்லை, பட்டியலிடப்பட்ட தெய்வங்களை ஏளனமாகச் சவால் செய்யும் வினாவாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֱלֹהֵי
  choice: தெய்வங்கள்
  rationale: இது אֱלֹהִים என்பதன் construct வடிவம்; இச்சூழலில் குறிப்பிடப்பட்ட நகரங்கள் அல்லது நாடுகளின் பல தெய்வங்களைக் குறிக்கிறது.
- source_word: חֲמָת וְאַרְפָּד
  choice: ஆமாத், அர்ப்பாத்
  rationale: எபிரேய இடப்பெயர்களின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் பெயர்ப்பு.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: செப்பர்வாயீம், ஏனா, இவ்வா
  rationale: எபிரேய மெய்யெழுத்து மற்றும் உயிரொலிக் குறிகளுக்கு அண்மையாக இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; கடைசிப் பெயரின் மரபுவழி மாறுபாடுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כִּי
  choice: வினாவை அறிமுகப்படுத்தும் பொருள் தமிழில் தனிச்சொல்லின்றி வெளிப்படுத்தப்பட்டது
  rationale: இங்கு כִּי முந்தைய ஏளனத்துடன் இணைந்த சொல்லாட்சிவினாவை அறிமுகப்படுத்துகிறது; தமிழில் ‘அவை ... விடுவித்தனவா?’ என்பதே இயல்பாக அந்தப் பொருளைக் கொடுக்கிறது.
- source_word: הִצִּילוּ
  choice: விடுவித்தனவா
  rationale: נצל என்பதன் Hiphil வடிவம் ஆபத்து அல்லது அதிகாரத்திலிருந்து மீட்பதை/விடுவிப்பதைக் குறிக்கிறது; இராணுவச் சூழலில் ‘விடுவித்தனவா’ பொருத்தமானது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: புறமதத் தெய்வங்களைப் பற்றிய பேச்சாளரின் சவால்
  choice: வெற்றிகொள்ளப்பட்ட நகரங்களின் தெய்வங்களால் சமாரியாவை அசீரிய அரசனின் கையிலிருந்து விடுவிக்க முடியவில்லை என்று பெருமை பேசும் சொல்லாட்சிவினாவாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை அந்தக் குறிப்பிட்ட தெய்வங்களைப் பற்றிய நேரடி வரலாற்றுக் கூற்றைவிட, எல்லா தேசியத் தெய்வங்களையும் பொதுவாக இகழும் சவாலாகக் கொள்ளலாம்.
  rationale: எபிரேயம் பல இடங்களின் தெய்வங்களை நேரடியாகக் குறிப்பிட்டு, அவை சமாரியாவை ‘என் கையிலிருந்து’ விடுவித்தனவா என்று கேட்கிறது. அவற்றின் இருப்பையோ வல்லமையையோ ஆதரிக்கும் அல்லது மறுக்கும் கூடுதல் கோட்பாட்டைச் சேர்க்காமல், உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் புரியக்கூடிய, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஏளனத் தொனியுடைய சொல்லாட்சிவினாக்களும் ‘என் கையிலிருந்து’ என்ற எபிரேய உருவகமும் பாதுகாக்கப்பட்டுள்ளன; இடப்பெயர்கள் மூலமொழி ஒலிப்பை அணுகும் வகையில் வழங்கப்பட்டுள்ளன.
