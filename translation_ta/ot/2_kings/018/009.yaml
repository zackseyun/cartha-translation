  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: ta
  text: எசேக்கியா அரசனின் நான்காம் ஆண்டில்—அது ஏலாவின் மகனும் இஸ்ரவேலின் அரசனுமான ஓசேயாவின் ஏழாம் ஆண்டு—அசீரிய அரசன் சல்மனேசர் சமாரியாவுக்கு எதிராகப் படையெடுத்து வந்து, அதை முற்றுகையிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வினைத்தொடராக மொழிபெயர்க்காமல் காலக் குறிப்புடன் இணைத்தல்]'
  rationale: இது எபிரெய வரலாற்று உரையின் வழக்கமான நிகழ்வறிமுகச் சொல். தமிழில் ‘நிகழ்ந்ததாவது’ என்று தனியே சேர்ப்பது செயற்கையாக இருப்பதால், காலக் குறிப்பிலிருந்து நேரடியாக வாக்கியத்தைத் தொடங்குவது அதன் உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: எசேக்கியா அரசனின் நான்காம் ஆண்டில்
  rationale: அரசாட்சிக் காலக் கணக்கைக் குறிக்கும் சூத்திரத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית
  choice: அது ... ஏழாம் ஆண்டு
  rationale: இரு அரசர்களின் ஆட்சியாண்டுகளை ஒத்திசைக்கும் எபிரெய சுட்டுப்பெயரின் தொடர்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: ஏலாவின் மகனும் இஸ்ரவேலின் அரசனுமான ஓசேயா
  rationale: மகன் மற்றும் அரசன் என்ற இரு அடையாளங்களையும் இயல்பான தமிழ் அடைமொழித் தொடரில் வைத்துள்ளது.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: சமாரியாவுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: இராணுவச் சூழலில் עלה என்பது பகைமை நோக்குடன் ஒரு நகரைத் தாக்க முன்னேறுவதைக் குறிக்கிறது; ‘படையெடுத்து வந்து’ அந்தச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன் சல்மனேசர்
  rationale: அரசப் பட்டத்தையும் பெயரையும் நவீன தமிழின் இயல்பான வரிசையில் தருகிறது.
- source_word: וַיָּצַר עָלֶיהָ
  choice: அதை முற்றுகையிட்டான்
  rationale: צור வினையின் நகரைச் சூழ்ந்து முற்றுகையிடுதல் என்ற பொருளைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
