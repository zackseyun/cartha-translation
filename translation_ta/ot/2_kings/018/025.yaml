  to: இப்போது, யாவே இல்லாமலா[a] நான் இந்த இடத்தின்மேல் படையெடுத்து, அதை அழிக்க வந்தேன்? யாவே என்னிடம், ‘இந்த நாட்டிற்கு எதிராகப் படையெடுத்துப் போய், அதை அழித்துவிடு’ என்று சொன்னார்.
