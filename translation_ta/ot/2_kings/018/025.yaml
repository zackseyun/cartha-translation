base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: ta
  text: இப்போது, யாவே இல்லாமலா[a] நான் இந்த இடத்தின்மேல் படையெடுத்து, அதை அழிக்க வந்தேன்? யாவே என்னிடம், ‘இந்த நாட்டிற்கு எதிராகப் படையெடுத்துப் போய், அதை அழித்துவிடு’ என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு அப்பாற்பட்டா?” அல்லது “யாவேயைச் சாராமலா?”
    reason: מִבַּלְעֲדֵי என்பது ‘இல்லாமல்,’ ‘அப்பாற்பட்டு,’ அல்லது ‘சாராமல்/தன்னிச்சையாக’ என்ற நுணுக்கங்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: இல்லாமலா
  rationale: வினாவிடைத் துகள் הֲ மற்றும் מִבַּלְעֲדֵי இணைந்து, பேச்சாளர் யாவேக்கு அப்பாற்பட்டு அல்லது அவருடைய அனுமதியின்றி செயல்பட்டாரா என்ற சொல்லாட்சிக் கேள்வியை உருவாக்குகின்றன. ‘இல்லாமலா’ என்பது தமிழில் இயல்பாக அந்தக் கேள்வியைத் தக்கவைக்கிறது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: עָלִיתִי
  choice: படையெடுத்து வந்தேன்
  rationale: עלה என்பதன் அடிப்படை ‘ஏறிச் செல்/வரு’ என்ற பொருளை, இங்குள்ள படையெடுப்புச் சூழலில் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘வந்தேன்’ என்பதில் மறையும் இராணுவ இயக்கத்தையும் காக்கிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: מָקוֹם என்பதன் பொதுவான பொருளைத் தக்கவைத்து, அதை ‘எருசலேம்’ அல்லது ‘நகரம்’ என்று விளக்கி விரிவுபடுத்தவில்லை.
- source_word: לְהַשְׁחִיתוֹ
  choice: அதை அழிக்க
  rationale: שׁחת என்பதன் ஹிஃபில் வடிவம் அழிவை ஏற்படுத்தும் செயலைக் குறிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு ‘இந்த இடம்’ என்பதைக் குறிக்கிறது.
- source_word: אָמַר אֵלַי
  choice: என்னிடம் ... சொன்னார்
  rationale: பொதுவான பேச்சுச் சூத்திரத்தை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: עֲלֵה
  choice: படையெடுத்துப் போ
  rationale: עלה கட்டளை வடிவத்தின் முன்னேறும் இயக்கத்தை இங்குள்ள இராணுவச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நாடு
  rationale: אֶרֶץ இங்கு படையெடுக்கப்படும் நிலப்பரப்பையோ நாட்டையோ குறிக்கிறது. ‘நாடு’ நவீனத் தமிழில் இயல்பாக உள்ளது; ‘இந்த இடம்’ என்பதிலிருந்து மூலத்தின் சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: וְהַשְׁחִיתָהּ
  choice: அதை அழித்துவிடு
  rationale: பெண்பால் ஒருமை பின்னொட்டு אֶרֶץ என்பதைக் குறிக்கிறது. முன் வந்த שׁחת வேருடனான சொல்லிணைப்பை ‘அழி’ என்று மீண்டும் பயன்படுத்திக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: அசீரியப் பேச்சாளரின் தெய்வீக ஆணைக் கூற்றின் உண்மைத்தன்மை
  choice: அவர் கூறிய கூற்றை நேரடி உரையாகவே வைத்தல்
  alternative: அந்தக் கூற்று உண்மை அல்லது பொய் என மொழிபெயர்ப்பிலேயே குறித்தல்
  rationale: வசனம் பேச்சாளரின் கூற்றைத் தெரிவிக்கிறது; அதை உரையாசிரியரின் உறுதிப்படுத்தலாகவோ மறுப்பாகவோ தீர்மானிக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
- issue: ‘இந்த இடம்’ மற்றும் ‘இந்த நாடு’ என்பவற்றின் குறிப்பிட்ட பொருள்
  choice: மூலத்தின் பொதுப் பெயர்களையே தக்கவைத்தல்
  alternative: எருசலேம் / யூதா
  rationale: மூலம் מָקוֹם மற்றும் אֶרֶץ என்ற இரு வேறு சொற்களைப் பயன்படுத்துகிறது. குறிப்பிட்ட இடப்பெயர்களைச் சேர்ப்பது மூலத்தைவிட விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான இராணுவப் பேச்சின் வலிமையும் காக்கப்பட்டுள்ளன. இறைவனைச் சுட்டும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘படையெடுத்து’ என்பது சூழலால் ஆதரிக்கப்படும் இயல்பான விளக்க மொழிபெயர்ப்பு; ‘இடம்’ மற்றும் ‘நாடு’ என்ற மூலச் சொல் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
