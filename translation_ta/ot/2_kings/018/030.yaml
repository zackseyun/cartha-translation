base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: ta
  text: “யாவே நம்மை நிச்சயமாக விடுவிப்பார்[a]; இந்த நகரம் அசீரிய அரசனின் கையில் ஒப்புக்கொடுக்கப்படாது” என்று சொல்லி, எசேக்கியா உங்களை யாவே மீது நம்பிக்கை வைக்கச் செய்ய விடாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “விடுவித்தே விடுவிப்பார்” என்ற வலியுறுத்தும் அமைப்பு உள்ளது; இதன் பொருள் “நிச்சயமாக விடுவிப்பார்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: உங்களை ... நம்பிக்கை வைக்கச் செய்ய இடங்கொடுக்காதீர்கள்
  rationale: בטח என்பதன் ஹிஃபில் வடிவம் இங்கு பிறரை நம்பச் செய்யும் காரணவினைப் பொருளைக் கொண்டுள்ளது. தமிழ் மொழியில் இயல்பாகவும் அந்தக் காரணவினைப் பொருள் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: אֶל יְהוָה
  choice: யாவே மீது
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி’ என்றாலும், בטח உடன் வரும்போது ஒருவர்மீது நம்பிக்கை வைப்பதைக் குறிக்கிறது; தமிழில் ‘மீது’ இயல்பான இணைப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: எசேக்கியாவின் மேற்கோள் கூற்றை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: நம்மை நிச்சயமாக விடுவிப்பார்
  rationale: வினையெச்சப் பெயர்வடிவமும் வினைமுற்றும் அடுத்தடுத்து வரும் எபிரெய அமைப்பு வினையின் உறுதியை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא תִנָּתֵן
  choice: ஒப்புக்கொடுக்கப்படாது
  rationale: נתן என்பதன் செயப்பாட்டு வடிவம் இங்கு நகரம் எதிரியின் அதிகாரத்துக்குள் கொடுக்கப்படுவதைக் குறிக்கிறது.
- source_word: הָעִיר הַזֹּאת
  choice: இந்த நகரம்
  rationale: பெயர்ச்சொல்லுடன் வரும் சுட்டுப்பெயரின் இயல்பான தமிழ் அமைப்பு.
- source_word: בְּיַד
  choice: கையில்
  rationale: எபிரெய மொழியின் ‘கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: பண்டைய அசீரிய நாட்டின் அரசனைக் குறிக்கும் தமிழில் வழக்கமான வரலாற்றுப் பெயர்.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைபெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உரையின் இராணுவ-அரசியல் சூழலும் காக்கப்பட்டுள்ளன. காரணவினை, வலியுறுத்தும் எபிரெய அமைப்பு, ‘கையில்’ என்ற உருவகம் ஆகியவை முடிந்தவரை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
