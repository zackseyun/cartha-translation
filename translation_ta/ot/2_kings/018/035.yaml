  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: ta
  text: எல்லா நாடுகளின் தெய்வங்களில் எந்தத் தெய்வமாவது தன் நாட்டை என் கையிலிருந்து மீட்டதுண்டா[a]? அப்படியானால், யாவே எருசலேமை என் கையிலிருந்து எப்படி விடுவிப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “எல்லா நாடுகளின் தெய்வங்களில் யார் தங்கள் நாடுகளை என் கையிலிருந்து மீட்டார்கள்? யாவே எருசலேமை என் கையிலிருந்து விடுவிப்பாரா?”'
    reason: முதல் வினாவில் உள்ள எபிரெய பன்மை வினைச்சொல் மற்றும் ‘அவர்களுடைய நாடு’ என்ற பகிர்ந்தளிப்புப் பொருளை வெளிப்படையாகக் காட்டும் மாற்று வடிவம்.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: நாடுகளின் எல்லாத் தெய்வங்களிலும் எது
  rationale: மִי என்பது இங்கு பல தெய்வங்களில் ஒன்றைச் சவாலாகக் கேட்பதால், தமிழில் இயல்பான பங்கீட்டுப் பொருளுடன் ‘எல்லாத் தெய்வங்களிலும் எது’ என வழங்கப்பட்டது. הָאֲרָצוֹת என்பது முழு பூமியைக் காட்டிலும் பல நாடுகளைக் குறிக்கிறது.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: தன் நாட்டை ... விடுவித்தது
  rationale: נצל என்பதன் இராணுவச் சூழலுக்குரிய ‘விடுவி/மீட்டு’ பொருள் காக்கப்பட்டது. எபிரெய 3ஆம் நபர் பன்மை உருபு பகிர்ந்தளிக்கும் பொருளில் இருப்பதால், தமிழில் ‘எது தன் நாட்டை’ என்ற ஒருமை வினாக்கட்டமைப்பு இயல்பாக உள்ளது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: כִּי יַצִּיל
  choice: அப்படியிருக்க ... விடுவிப்பாரா
  rationale: כִּי உடன் வரும் வினா ரப்சாக்கேயின் இகழ்ச்சியான முடிவுச் சவாலை அறிமுகப்படுத்துகிறது. தமிழில் ‘அப்படியிருக்க’ அந்தத் தொடர்பையும் வினைமுற்று எதிர்காலச் சவாலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; குறிப்பிட்ட சமயப்பிரிவின் தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
- issue: ரப்சாக்கேயின் கூற்றின் இகழ்ச்சியான வினாத்தன்மை
  choice: ‘அப்படியிருக்க ... விடுவிப்பாரா?’ என்ற சவால் வினா
  alternative: ‘ஆகவே ... விடுவிக்கமாட்டார்’ என்ற வெளிப்படையான மறுப்பு
  rationale: பேச்சாளரின் எதிர்மறை நோக்கம் தெளிவாக இருந்தாலும், மூலத்தில் அது வினா வடிவிலேயே உள்ளது. அதனால் மறுப்பை உரையில் வெளிப்படையாகச் சேர்க்காமல் இறையியல் பதற்றம் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘விடுவி’ என்பது இராணுவ மீட்புப் பொருளைத் தருகிறது. முதல் வினாவில் தமிழின் இயல்புக்காக பகிர்ந்தளிக்கும் ஒருமை அமைப்பு பயன்படுத்தப்பட்டு, எபிரெய பன்மை அமைப்பு அடிக்குறிப்பில் காக்கப்பட்டது.
