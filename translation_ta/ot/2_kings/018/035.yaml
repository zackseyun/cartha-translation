  to: எல்லா நாடுகளின் தெய்வங்களில் எந்தத் தெய்வமாவது தன் நாட்டை என் கையிலிருந்து மீட்டதுண்டா[a]? அப்படியானால், யாவே எருசலேமை என் கையிலிருந்து எப்படி விடுவிப்பார்?
  rationale: மூலத்தின் பகிர்ந்தளிப்புத் தொடர்பை (‘ஒவ்வொரு தெய்வமும் தன் நாடு’) தமிழில் இயல்பாகக் காட்டும் வகையில் முதல் வினா மாற்றப்பட்டது. இரண்டாம் வினாவில் மூலத்தின் சவால்-வினா மற்றும் இகழ்ச்சித் தொனி வெளிப்பட, ஆனால் வெளிப்படையான மறுப்பைச் சேர்க்காமல், ‘எப்படி ... விடுவிப்பார்?’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு அங்கர் பாதுகாக்கப்பட்டு, அதன் மாற்று வாசகம் இலக்கணத் தெளிவுக்காகச் சீரமைக்கப்பட்டது.
