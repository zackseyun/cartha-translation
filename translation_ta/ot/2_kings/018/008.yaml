  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கேற்ற கண்ணியமான நடை. எபிரெயத்தின் இராணுவ வினைப்படிமமும், גְּבוּל என்பதிலுள்ள ‘எல்லை/நிலப்பரப்பு’ தெளிவின்மையும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
