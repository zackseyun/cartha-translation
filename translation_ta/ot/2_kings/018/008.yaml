  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: ta
  text: காசா வரையிலும் அதனைச் சேர்ந்த பகுதிகளிலும் இருந்த பெலிஸ்தியர்களை அவன் தாக்கினான்—காவற்கோபுரம் முதல் அரணமைந்த நகரம் வரை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் எல்லைகள் வரை.” எபிரெயச் சொல் எல்லைக்கோடுகளையோ ஒரு நகரத்துக்குச் சொந்தமான நிலப்பரப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காவற்கோபுரம் முதல் அரணமைந்த நகரம் வரை” என்பது சிறிய புறக்காவல் இடத்திலிருந்து பெரிய பாதுகாப்புள்ள குடியிருப்பு வரை முழுப் பகுதியையும் குறிக்கும் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: அவன்
  rationale: எபிரெய உரையில் வலியுறுத்தலுடன் வரும் வெளிப்படையான எழுவாய்ச் சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: הִכָּה
  choice: தாக்கினான்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடி/தாக்கு’ என்ற படிமத்தைப் பாதுகாத்து, இராணுவச் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது; ‘தோற்கடித்தான்’ என்று விளைவை மிகத் திட்டவட்டமாக்கவில்லை.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இனக்குழுவுக்கான வழக்கமான தமிழ் வேதாகமப் பெயர்.
- source_word: עַד עַזָּה
  choice: காசா வரையிலும்
  rationale: עַד குறிக்கும் பரப்பின் எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: அதன் எல்லைப் பகுதி முழுவதிலும்
  rationale: גְּבוּל என்பது எல்லைக்கோட்டையோ அதற்குட்பட்ட நிலப்பரப்பையோ குறிக்கலாம். இச்சூழலில் காசாவைச் சேர்ந்த நிலப்பரப்பு என்ற பொருள் இயல்பானது; ‘எல்லைப் பகுதி’ மூலத்தின் நெகிழ்வையும் ஓரளவு தக்கவைக்கிறது.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: காவற்கோபுரம் தொடங்கி
  rationale: காவலர்கள் கண்காணிக்கும் கோபுரத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; எபிரெய ஒருமையும் தக்கவைக்கப்படுகிறது.
- source_word: עַד עִיר מִבְצָר
  choice: அரண்சூழ்ந்த நகரம் வரையிலும்
  rationale: பாதுகாப்பு அரண்களைக் கொண்ட நகரம் என்ற பொருளைத் தெளிவாக வழங்கி, முந்தைய சொற்றொடருடன் சேர்ந்த முழுமைப் பரப்புச் சொல்லாட்சியைப் பாதுகாக்கிறது.
