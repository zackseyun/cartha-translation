  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: ta
  text: இப்போது, தயவுசெய்து, என் தலைவரான அசீரியா அரசனோடு பந்தயம் செய்[a]. உன்னால் அவற்றின்மேல் ஏறுவதற்கு குதிரை வீரர்களை வழங்க முடிந்தால், நான் உனக்கு இரண்டாயிரம் குதிரைகளைத் தருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தலைவரோடு ஓர் உடன்பாடு செய்துகொள்,” அல்லது “என் தலைவரிடம் உன்னை உறுதிப்படுத்து.” எபிரெய வினைச்சொல் ஓர் உடன்பாட்டில் ஈடுபடுவதையோ தன்னையே பணயமாக்குவதையோ குறிக்கலாம்; இங்கே அது பெரும்பாலும் கேலியான பந்தயம் அல்லது சவாலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: பந்தயம் வைத்துப் பார்
  rationale: இந்த இகழ்ச்சியான சவாலின் சூழலில், வினைச்சொல் வெறும் ஒப்பந்தத்தைக் காட்டுவதைவிடப் பந்தயம் அல்லது சவால் விடும் பொருளைத் தருகிறது. נָא கட்டளையை மென்மைப்படுத்தினாலும் இங்கு கேலியான தொனி உள்ளது; இயல்பான தமிழில் ‘வைத்துப் பார்’ அதை வெளிப்படுத்துகிறது.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: என் தலைவராகிய அசீரிய அரசனோடு
  rationale: אֶת இங்கு ‘உடன்/ஓடு’ என்ற உறவைக் குறிக்கிறது. אֲדֹנִי மனித மேலதிகாரியைக் குறிப்பதால், இறைப்பட்டம் எனத் தவறாகப் புரியாதவாறு ‘என் தலைவர்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶתְּנָה לְךָ
  choice: நான் உனக்கு ... தருகிறேன்
  rationale: சூழலில் இது நிபந்தனையுடன் கூடிய கேலியான முன்வைப்பு. தமிழ் பேச்சியல்பில் நிகழ்கால வடிவம் உறுதியான முன்வைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: אַלְפַּיִם סוּסִים
  choice: இரண்டாயிரம் குதிரைகள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டன.
- source_word: אִם תּוּכַל
  choice: உன்னால் ... முடிந்தால்
  rationale: திறனைச் சோதிக்கும் நிபந்தனையையும் அதிலுள்ள ஏளனத்தையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: அவற்றின்மேல் ஏற்றுவதற்கு வீரர்களை ஏற்பாடு செய்ய
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவற்றின்மேல் சவாரி செய்பவர்களை உனக்காகக் கொடுக்க’. குதிரைகளுக்குத் தேவையான சவாரி வீரர்களை யூதாவால் வழங்க முடியாது என்பதே கருத்து; ‘ஏற்பாடு செய்ய’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது.
