  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: ta
  text: அவன் ஆட்சியைத் தொடங்கியபோது அவனுக்கு இருபத்தைந்து வயது. அவன் எருசலேமில் இருபத்தொன்பது ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் அபி; அவள் சகரியாவின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: அவனுக்கு இருபத்தைந்து வயது
  rationale: எபிரெய மொழியின் வயதைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் பொருளுக்குச் சமமாக வழங்குகிறது.
- source_word: הָיָה בְמָלְכוֹ
  choice: அவன் அரசனானபோது
  rationale: இந்த அமைப்பு அரசாட்சியின் தொடக்கத்தில் அவனுக்கு இருந்த வயதைக் குறிக்கிறது; ‘அரசனானபோது’ என்பது காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரச அதிகாரத்தைச் செலுத்தியதைக் குறிக்கும் வினையின் நேரடியான, பொதுவாகப் புரியக்கூடிய தமிழ் இணை.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: அவனுடைய ஆட்சியின் இருப்பிடத்தைக் குறிக்கும் இடவேற்றுமையை நேரடியாக வழங்குகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: தாயின் பெயரை அறிமுகப்படுத்தும் எபிரெயக் கூற்றை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אֲבִי
  choice: அபி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת זְכַרְיָה
  choice: அவள் சகரியாவின் மகள்
  rationale: பெற்றோர் உறவைத் தெளிவாகக் காட்டுகிறது; தமிழில் குழப்பமின்றி வாசிக்க ஒரு தனிக் கூறாக வழங்கப்பட்டுள்ளது.
