base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: ta
  text: அக்காலத்தில் யூதாவின் அரசன் எசேக்கியா, தான் தகடு பதித்திருந்த யாவேவின் ஆலயக் கதவுகளையும் கதவு நிலைகளையும்[a] வெட்டி அகற்றி, அவற்றை அசீரிய அரசனுக்குக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கதவுச் சட்டங்கள்” அல்லது “தூண்கள்” என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் அரிதானது. ஆலயக் கதவுகளோடு தொடர்புடைய கட்டட ஆதாரங்களை இது விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: எபிரெயக் கதைநடையின் காலக் குறிப்பை இயல்பான, சுருக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: קִצַּץ
  choice: வெட்டி அகற்றி
  rationale: வெட்டிப் பிரித்தெடுக்கும் உறுதியான செயலைக் காட்டுகிறது; வெறுமனே கழற்றியதாக மென்மைப்படுத்தவில்லை.
- source_word: דַּלְתוֹת
  choice: கதவுகள்
  rationale: ஆலயத்தின் கதவுகள் அல்லது கதவுப் பலகைகள் என்பதற்கான தெளிவான பொதுவழக்கு.
- source_word: הֵיכַל יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: இச்சூழலில் הֵיכַל எருசலேம் ஆலயத்தைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: הָאֹמְנוֹת
  choice: கதவு நிலைகள்
  rationale: அரிதான இச்சொல் கதவுகளுடன் தொடர்புடைய கட்டட உறுப்புகளைக் குறிக்கிறது; சூழலுக்கேற்ற முதன்மைத் தேர்வு இது, ஆனால் அதன் துல்லிய வடிவம் உறுதியில்லை.
- source_word: צִפָּה
  choice: தகடு பதித்திருந்த
  rationale: ஒரு மேற்பரப்பை, பொதுவாக உலோகத் தகட்டால், மூடிப் பதித்தல் என்ற பொருளைக் காக்கிறது; இவ்வசனத்தில் கூறப்படாத உலோக வகையைச் சேர்க்கவில்லை.
- source_word: וַיִּתְּנֵם
  choice: அவற்றைக் கொடுத்தான்
  rationale: எளிய எபிரெயக் கதைவினையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுக்கு
  rationale: எபிரெயச் சொற்றொடரின் தெளிவான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிவடிவில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘தகடு பதித்திருந்த’ என்பது உலோகத்தின் வகையை வசனத்திற்குள் ஊகித்துச் சேர்க்காமல் צִפָּה என்பதன் பொருளை வெளிப்படுத்துகிறது; அரிதான கட்டடக்கலைச் சொல் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டது.
