base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: ta
  text: அவனே உயர்ந்த வழிபாட்டு இடங்களை அகற்றி, வழிபாட்டுத் தூண்களை உடைத்து, அசேராவை வெட்டி வீழ்த்தினான்.[a] மோசே செய்திருந்த வெண்கலப் பாம்பையும் துண்டுதுண்டாக நொறுக்கினான்; ஏனெனில் அந்த நாட்கள்வரை இஸ்ரவேலின் மகன்கள் அதற்குத் தூபம் எரித்துவந்தார்கள். அது “நெகுஸ்தான்” என்று அழைக்கப்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா” என்பது அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருளைக் குறிக்கலாம்; “அசேரா கம்பம்” அல்லது “புனிதக் கம்பம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நெகுஸ்தான்” என்ற பெயர் “வெண்கலம்” என்பதற்கான எபிரெயச் சொல்லுடன் அமைந்த சொல்விளையாட்டாக இருக்கலாம்; “வெறும் வெண்கலத் துண்டு” போன்ற இழிவான நயத்தையும் கொண்டிருக்கக்கூடும். “அவன் அதற்கு நெகுஸ்தான் என்று பெயரிட்டான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: மேடைகளை அகற்றி
  rationale: ‘மேடைகள்’ என்பது உள்ளூர் வழிபாட்டிடங்களைக் குறிக்கும் எபிரெய வழிபாட்டுச் சொல்லின் உருவகத்தைப் பாதுகாக்கிறது; ‘அகற்றி’ சீர்திருத்தச் சூழலில் இயல்பாக உள்ளது.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: வழிபாட்டுத் தூண்களை உடைத்து
  rationale: מַצֵּבוֹת என்பது வழிபாட்டிற்காக நிறுத்தப்பட்ட கற்கள் அல்லது தூண்கள். வெறும் ‘தூண்கள்’ என்பதைக் காட்டிலும் ‘வழிபாட்டுத் தூண்கள்’ சூழலைத் தெளிவாக்குகிறது.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: அசேராவை வெட்டி வீழ்த்தினான்
  rationale: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருளைச் சொல் குறிக்கலாம். பெயரை ஒலிபெயர்த்து வைத்திருப்பது அதன் பண்டைய சமயக் குறிப்பை மிகையாகக் குறுக்காமல் காக்கிறது; כרת என்பதன் செயலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִתַּת
  choice: துண்டுதுண்டாக நொறுக்கினான்
  rationale: சாதாரணமாக உடைப்பதைக் காட்டிலும் முழுமையாகச் சிதைத்தலை இந்த வினை உணர்த்துகிறது.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: வெண்கலப் பாம்பு
  rationale: சொற்றொடரின் நேரடியான பொருளையும் எண்ணாகமப் பின்னணியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַד הַיָּמִים הָהֵמָּה
  choice: அந்த நாட்கள்வரை
  rationale: எசேக்கியாவின் காலம்வரை நீடித்த செயலைக் குறிக்கும் எபிரெய காலத் தொடருக்கு நெருக்கமான, இயல்பான தமிழ்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் குடும்பவழி ஆண்பால் பன்மை வெளிப்பாட்டைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: מְקַטְּרִים לוֹ
  choice: அதற்குத் தூபம் காட்டிவந்தார்கள்
  rationale: தொடர்ச்சியாகத் தூபப்புகை செலுத்திய வழிபாட்டுச் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: அது “நெகுஸ்தான்” என்று அழைக்கப்பட்டது
  rationale: எபிரெய வாக்கியத்தில் பெயரிட்டவர் யார் என்பது வெளிப்படையாக இல்லாததால், தமிழின் செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் பொருள்
  choice: அசேரா
  alternative: அசேரா கம்பம்; புனிதக் கம்பம்
  rationale: இங்கு வெட்டி வீழ்த்தக்கூடிய வழிபாட்டுப் பொருள் கருத்தில் உள்ளது; எனினும் சொல்லை வெறும் ‘கம்பம்’ என்று குறுக்காமல் பண்டைய சமயக் குறிப்பை முதன்மை உரையில் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- issue: וַיִּקְרָא לוֹ என்பதன் எழுவாய்
  choice: அது “நெகுஸ்தான்” என்று அழைக்கப்பட்டது
  alternative: அவன் அதற்கு “நெகுஸ்தான்” என்று பெயரிட்டான்
  rationale: பெயரிட்டவர் எசேக்கியாவா அல்லது பொதுவாக மக்கள் அப்படிச் சொன்னார்களா என்பதை எபிரெயம் கட்டாயமாகத் தீர்மானிக்கவில்லை; செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- issue: நெகுஸ்தான் என்ற பெயரின் நயப்பொருள்
  choice: பெயரை ஒலிபெயர்த்து முதன்மை உரையில் வைத்தல்
  alternative: ‘வெறும் வெண்கலத் துண்டு’ என்று பொருளாக்குதல்
  rationale: பெயரில் נְחֹשֶׁת (‘வெண்கலம்’) என்பதுடனான சொல்விளையாட்டு இருக்கலாம்; ஆனால் சரியான பொருள் உறுதியற்றதால் விளக்கத்தை அடிக்குறிப்பில் மட்டும் தருவது ஏற்றது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. பண்டைய வழிபாட்டுச் சொற்களை மிகையாக விளக்காமல், தேவையான இடங்களில் குறுகிய விளக்கச் சொற்களும் அடிக்குறிப்புகளும் பயன்படுத்தப்பட்டுள்ளன.
