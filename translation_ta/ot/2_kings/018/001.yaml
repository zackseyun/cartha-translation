translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்று அரசாட்சிக் குறிப்புக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது; பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான வடிவங்களில் தரப்பட்டுள்ளன.
