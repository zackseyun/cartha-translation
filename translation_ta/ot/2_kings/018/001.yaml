base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசரான ஏலாவின் மகன் ஓசேயாவின் ஆட்சியின் மூன்றாம் ஆண்டில், ஆகாசின் மகன் எசேக்கியா யூதாவின் அரசரானார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் நேரடியான மொழிபெயர்ப்பு: ‘ஆட்சி செய்யத் தொடங்கினார்.’ இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல், அரசாட்சிக் குறிப்புகளில் எசேக்கியா அரியணை ஏற்றதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இந்த வடிவம் ஒரு புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடர் இணைப்பாகச் செயல்படுகிறது. தமிழில் தனியாக ‘அப்போது’ அல்லது ‘நடந்ததாவது’ என்று சேர்க்காமல் காலக் குறிப்புடன் தொடங்குவது இயல்பாகவும் மூலத்தின் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ஆட்சியின் மூன்றாம் ஆண்டில்
  rationale: இது அரசர்களின் ஆட்சியாண்டைக் கொண்டு காலத்தைக் குறிக்கும் வழக்கமான சொற்றொடர். தமிழில் யாருடைய மூன்றாம் ஆண்டு என்பது தெளிவாக இருக்க ‘ஆட்சியின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: ஏலாவின் மகன் ஓசேயாவின்
  rationale: לְ என்ற முன்னொட்டு இங்கு காலக்கணக்கின் குறிப்புப் புள்ளியைக் காட்டுகிறது. உறவுமுறையை நவீன தமிழின் இயல்பான சொல் வரிசையில் வழங்குகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசரான
  rationale: ஓசேயாவின் பதவியையும் அவர் ஆட்சி செய்த நாட்டையும் நேரடியாக அடையாளப்படுத்துகிறது.
- source_word: מָלַךְ
  choice: அரசரானார்
  rationale: அரசர் பட்டம் ஏற்ற நிகழ்வைக் குறிக்கும் இந்த ஆட்சித் தொடக்கச் சூத்திரத்தின் உட்புகும் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חִזְקִיָּה
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: בֶן אָחָז
  choice: ஆகாசின் மகன்
  rationale: தந்தை–மகன் அடையாளத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசரானார்
  rationale: எபிரெயில் எசேக்கியாவுடன் இணைநிலையாக வரும் அரசுப் பட்டத்தை, தமிழில் அரியணை ஏற்றதைக் குறிக்கும் இயல்பான பயனிலையாக வழங்குகிறது.
