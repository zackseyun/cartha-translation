base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: ta
  text: இதோ, நீ எகிப்தை—ஒடிந்த நாணலாகிய அந்த ஊன்றுகோலை—நம்பியிருக்கிறாய்.[a] ஒருவன் அதன்மேல் சாய்ந்தால், அது அவனுடைய உள்ளங்கைக்குள் சென்று, அதைக் குத்தும்.[b] எகிப்தின் அரசனாகிய பார்வோன் தன்னை நம்புகிற அனைவருக்கும் இப்படித்தான் இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒடிந்த நாணல்’ என்பதற்கு ‘நசுங்கிய நாணல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நசுங்கிய, காயப்பட்ட அல்லது ஒடிந்த நிலையைக் குறிக்கக்கூடும்; சாய்பவரின் கையைக் குத்தும் ஆதாரம் என்ற உருவகத்திற்கு ‘ஒடிந்த’ என்பது நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஒருவன் அதன்மேல் சாய்ந்தால்’ என்று உள்ளது; ஆண்பால் ஒருமை இங்கு பொதுவான பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: நீ எகிப்தை ... நம்பியிருக்கிறாய்
  rationale: בטח என்பது நம்பிக்கையுடன் சார்ந்திருப்பதைக் குறிக்கிறது. சூழலில் நிறைவேற்றுவினை தற்போதைய நம்பிக்கையை ஏளனமாகச் சுட்டுவதால், தமிழில் ‘நம்பியிருக்கிறாய்’ என வழங்கப்பட்டது.
- source_word: מִשְׁעֶנֶת
  choice: ஊன்றுகோல்
  rationale: சாய்ந்து ஆதரவு பெறும் பொருளை இச்சொல் குறிக்கிறது; உருவகத்தின் பொருளையும் இயல்பான தமிழையும் ‘ஊன்றுகோல்’ காக்கிறது.
- source_word: הַקָּנֶה הָרָצוּץ
  choice: ஒடிந்த நாணல்
  rationale: קנה என்பது ‘நாணல்’; רצוץ என்பது நொறுங்கிய, நசுங்கிய அல்லது ஒடிந்த நிலையைக் குறிக்கலாம். சாய்பவரின் கையைக் குத்தும் ஆதாரம் என்ற உருவகத்தில் ‘ஒடிந்த’ என்பது தெளிவாகப் பொருந்துகிறது.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: ஒருவன் அதன்மேல் சாய்ந்தால்
  rationale: Niphal வடிவிலுள்ள סמך ஆதரவுக்காகச் சாய்வதைக் குறிக்கிறது. உறவுத்தொடரின் உட்கிடையான நிபந்தனைத் தன்மையை ‘சாய்ந்தால்’ வெளிப்படுத்துகிறது; איש என்பதன் ஒருமை வடிவம் ‘ஒருவன்’ எனக் காக்கப்பட்டது.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: அவனுடைய உள்ளங்கைக்குள் பாய்ந்து அதைக் குத்தித் துளைக்கும்
  rationale: כף இங்கு உள்ளங்கையைக் குறிக்கிறது; בוא ஊடுருவி உள்ளே செல்வதையும் נקב துளைப்பதையும் காட்டுகின்றன. காயப்படுத்தும் காட்சியின் தீவிரத்தை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: כֵּן
  choice: இப்படித்தான்
  rationale: முன் சொல்லப்பட்ட உருவகத்துக்கும் பார்வோனுக்கும் இடையிலான நேரடி ஒப்புமையை இயல்பாகக் காட்டுகிறது.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனாகிய பார்வோன்
  rationale: அரச பட்டத்தையும் பெயரையும் தெளிவான தமிழ் உடன்பாட்டில் வழங்குகிறது.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: தன்னை நம்புகிற அனைவருக்கும்
  rationale: லாமேத் குறிக்கும் உறவு அல்லது விளைவை ‘அனைவருக்கும்’ காக்கிறது; பங்கேற்புவினையின் பொதுப்படுத்தும் தன்மையையும் வெளிப்படுத்துகிறது.
