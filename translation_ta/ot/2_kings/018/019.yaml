  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: ta
  text: 'அப்போது ரப்சாக்கே அவர்களிடம், “எசேக்கியாவிடம் தயவுசெய்து இப்படிச் சொல்லுங்கள்: ‘மகா அரசன், அசீரியாவின் அரசன் கூறுவது இதுவே: நீ நம்பிக்கை வைத்திருக்கும் இந்த நம்பிக்கை என்ன?’” என்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது அசீரிய அரசவையின் ஒரு பதவிப் பெயர்; ஊகமான பொருள் மொழிபெயர்ப்பைத் தவிர்த்து வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: மகா அரசர்
  rationale: அசீரிய அரசரின் மேன்மையை வலியுறுத்தும் பட்டப்பெயரின் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: நீ வைத்திருக்கும் இந்த நம்பிக்கை என்ன?
  rationale: பெயர்ச்சொல் மற்றும் அதே வேர் கொண்ட வினைச்சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; எதை அல்லது யாரை நம்பினார் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அதைக் குறிப்பிட்டு நிரப்பவில்லை.
theological_decisions:
- issue: எசேக்கியாவின் நம்பிக்கையின் பொருள்
  choice: நம்பிக்கையின் இலக்கைச் சேர்க்காமல் விடுதல்
  alternative: ‘நீ எதன்மேல் நம்பிக்கை வைத்திருக்கிறாய்?’
  rationale: எபிரெய உரை இவ்வசனத்தில் நம்பிக்கையின் இலக்கைத் தெளிவாகக் குறிப்பிடவில்லை; அடுத்துவரும் உரையாடலை முன்கூட்டியே விளக்காமல் அதன் திறந்த தன்மை காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் கூற்றுக்கேற்ற கண்ணியமான நடை. உள்ளடங்கிய மேற்கோள்கள் தெளிவாக அமைக்கப்பட்டுள்ளன; ‘தயவுசெய்து’ என்பது נָא என்பதன் பணிவுக் குறியைப் பிரதிபலிக்கிறது.
