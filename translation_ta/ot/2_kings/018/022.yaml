base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: ta
  text: “ஆனால் நீங்கள் என்னிடம், ‘எங்கள் கடவுளாகிய ஆண்டவரில் நம்பிக்கை வைத்திருக்கிறோம்’ என்று சொன்னால், எசேக்கியா அவருடைய மேட்டுத் திருத்தலங்களையும் பலிபீடங்களையும் அகற்றிவிட்டு, யூதாவுக்கும் எருசலேமுக்கும், ‘எருசலேமிலுள்ள இந்தப் பலிபீடத்தின் முன்பு நீங்கள் பணிந்து வணங்க வேண்டும்’ என்று சொன்னவன் அவரல்லவா?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம வழக்கில் இறைத் திருப்பெயரைக் குறிக்கும் மரியாதையான வடிவம்; இங்கு பேச்சாளன் இஸ்ரவேலின் கடவுளைக் குறிப்பது தெளிவாக உள்ளது.
- source_word: בָּמֹתָיו
  choice: அவருடைய மேட்டுத் திருத்தலங்கள்
  rationale: במה என்பது பொதுவாக உயரமான இடங்களில் அல்லது உள்ளூர் வழிபாட்டு மையங்களில் அமைந்த திருத்தலத்தைக் குறிக்கிறது. வெறும் ‘மேடைகள்’ என்பதைக் காட்டிலும் வழிபாட்டுச் சூழலை இது தெளிவுபடுத்துகிறது; ‘அவருடைய’ என்பது பேச்சாளனின் கூற்றை அப்படியே தக்கவைக்கிறது.
- source_word: תִּשְׁתַּחֲווּ
  choice: நீங்கள் பணிந்து வணங்க வேண்டும்
  rationale: வினைச்சொல்லின் உடல் பணிவையும் வழிபாட்டு அர்த்தத்தையும் இணைத்துக் காட்டுகிறது.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: இந்தப் பலிபீடத்தின் முன்பே
  rationale: לִפְנֵי என்பதன் இடவியல் பொருளையும், ஒரே பலிபீடத்தை வலியுறுத்தும் எதிர்மறைப் பேச்சின் நயத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: எசேக்கியா அகற்றிய மேட்டுத் திருத்தலங்களும் பலிபீடங்களும் ஆண்டவருக்குரியவை என்ற ரப்சாக்கேயின் கூற்று
  choice: ‘அவருடைய’ என்பதை உரையில் தக்கவைத்தல்
  alternative: அவை முறைகேடான உள்ளூர் வழிபாட்டு இடங்கள் என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இவ்வசனம் ரப்சாக்கேயின் கேலியான வாதத்தைப் பதிவு செய்கிறது; அவன் கூற்றை மொழிபெயர்ப்பாளர் திருத்தக் கூடாது. எசேக்கியாவின் சீர்திருத்தத்தைப் பற்றிய நூலின் மதிப்பீட்டுக்கும் இப்பேச்சாளனின் தவறான புரிதலுக்கும் இடையிலான பதற்றம் தக்கவைக்கப்படுகிறது.
- issue: ஒரே எருசலேம் பலிபீடத்தில் வழிபடுதல்
  choice: ‘இந்தப் பலிபீடத்தின் முன்பே’ என்ற வலியுறுத்தலைப் பாதுகாத்தல்
  alternative: ‘இந்தப் பலிபீடத்தில் மட்டும்’ என்று நேரடியாக விரிவாக்குதல்
  rationale: ‘மட்டும்’ என்பது கருத்தில் உட்பொருந்தினாலும் எபிரெய உரையில் தனிச் சொல்லாக இல்லை; ‘முன்பே’ என்பது வலியுறுத்தலைக் காத்தபடி தேவையற்ற விரிவாக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசத் தூதரின் கேலியும் சவாலும் வெளிப்படும் வகையில் இறுதியில் ‘சொன்னானே!’ பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் எசேக்கியாவை ‘அவன்’ என்று குறிப்பிடுவது எதிரியின் அவமதிப்பான பேச்சுநிலையை இயல்பாகப் பிரதிபலிக்கிறது. வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
