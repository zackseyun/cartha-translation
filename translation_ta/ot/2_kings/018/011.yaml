  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: ta
  text: அசீரிய அரசன் இஸ்ரவேலை அசீரியாவுக்கு நாடுகடத்தி, அவர்களை ஆலாவிலும்[a], கோசானின் நதியான ஆபோரின் கரையிலும், மேதியரின் நகரங்களிலும் குடியமர்த்தினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலை அசீரியாவுக்குக் கொண்டு போய், அவர்களை ஆலாவிலும், கோசானிலுள்ள ஆபோர் நதிக்கரையிலும், மேதியா நாட்டின் நகரங்களிலும் அமர்த்தினான்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே “இஸ்ரவேல்” என்பது வடக்கு அரசையும் நாடுகடத்தப்பட்ட அதன் மக்களையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: சிறைபிடித்துக் கொண்டுபோய்
  rationale: גלה என்பதன் ஹிஃபில் வடிவம் கட்டாயமாக நாடுகடத்துவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நாடுகடத்தலின் வலுக்கட்டாயத் தன்மையைத் தெளிவாகவும் வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: இங்கு வடக்கு அரசையும் நாடுகடத்தப்பட்ட அதன் மக்களையும் ஒருங்கே குறிக்கும் கூட்டு அரசியல் பெயராக ‘இஸ்ரவேல்’ தக்கவைக்கப்படுகிறது.
- source_word: אַשּׁוּרָה
  choice: அசீரியாவுக்கு
  rationale: திசையைக் குறிக்கும் ־ָה பின்னொட்டு அசீரியாவை நோக்கிய நகர்வைக் காட்டுகிறது.
- source_word: וַיַּנְחֵם
  choice: அவர்களைக் குடியமர்த்தினான்
  rationale: காரணவினைப் பயன்பாடு, நாடுகடத்தப்பட்டவர்களை குறிப்பிட்ட இடங்களில் வாழும்படி அமர்த்தியதைக் குறிக்கிறது.
- source_word: בַּחְלַח
  choice: ஆலாகிலும்
  rationale: חלח என்ற இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, בְּ முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ மூலம் தரப்படுகிறது.
- source_word: וּבְחָבוֹר
  choice: ஆபோரின் அருகிலும்
  rationale: அடுத்து அது ஓர் ஆறு என அடையாளப்படுத்தப்படுவதால், ஆற்றங்கரையை அல்லது ஆற்றை ஒட்டிய பகுதியைக் குறிக்கும் இயல்பான தமிழாக ‘அருகில்’ பயன்படுத்தப்படுகிறது.
- source_word: נְהַר גּוֹזָן
  choice: கோசானின் ஆறாகிய
  rationale: எபிரெயக் கட்டுச் சொற்றொடரின் உறவைத் தெளிவாக வைத்தபடி, ஆபோரை கோசானுடன் தொடர்புடைய ஆறாக அடையாளப்படுத்துகிறது.
- source_word: וְעָרֵי מָדָי
  choice: மேதியரின் நகரங்களிலும்
  rationale: מָדָי என்பது மேதிய மக்களை அல்லது அவர்களின் நாட்டைக் குறிக்கலாம்; சொற்றொடரின் நேரான மக்கள்-சார்ந்த வடிவம் தக்கவைக்கப்படுகிறது.
