translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. அசீரியா, இஸ்ரவேல், ஆலா, ஆபோர், கோசான், மேதியர் ஆகிய பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிவடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் புவியியல் கட்டமைப்பில் உள்ள சிறிய தெளிவின்மை அடிக்குறிப்பில் மாற்று வடிவமாகப் பாதுகாக்கப்பட்டுள்ளது.
