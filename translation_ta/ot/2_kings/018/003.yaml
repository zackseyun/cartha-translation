  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: ta
  text: அவன் தன் தந்தையான தாவீது செய்த எல்லாவற்றின்படியும், யாவேயின் பார்வையில் சரியானதைச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தந்தை” என்பது உடனடித் தந்தையைக் குறிக்காமல், தாவீதின் அரச வம்சத்தில் வந்த முன்னோரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் கதை நிகழ்வைத் தொடர்கிறது. தமிழில் வசனத்தை இயல்பாகத் தொடங்குவதற்கு இணைப்புச் சொல்லை வெளிப்படையாகச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: உருபுடன் வரும் ישר இங்கு பெயர்ச்சொல் தன்மையில், ஒழுக்க ரீதியாகச் சரியான செயலைக் குறிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: இது யெகோவாவின் மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் பொருள் தெளிவாகவும் மரபுத்தொடரின் உருவகம் ஓரளவு நிலைக்கவும் இவ்வாறு வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயர் ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்கப்பட்டது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: כְּ plus כֹל plus אֲשֶׁר முன்மாதிரியுடன் முழுமையாக ஒத்துச் செயல்பட்டதைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் இயல்பாக அமைய வினைத் தொகுதியுடன் இணைக்கப்பட்டது.
- source_word: דָּוִד אָבִיו
  choice: தன் தந்தையாகிய தாவீது
  rationale: எபிரெய அரச மரபுச் சூத்திரத்தில் אָב முன்னோரையும் குறிக்கலாம். தாவீதுடனான வம்ச மற்றும் முன்மாதிரி உறவைப் பாதுகாக்க ‘தந்தை’ முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘தாவீது அவன் தந்தை’ என்பதில் தந்தை என்ற சொல்லின் பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’ என்பதைத் தக்கவைத்து, அடிக்குறிப்பில் வம்ச முன்னோர் என விளக்குதல்
  alternative: அவனுடைய முன்னோரான தாவீது
  rationale: ‘தந்தை’ என்ற அரச மரபுச் சொற்றொடர் எசேக்கியாவை தாவீதின் வம்சத்துடனும் நடத்தை முன்மாதிரியுடனும் இணைக்கிறது. நேரடித் தந்தை என்ற தவறான புரிதலை அடிக்குறிப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மதிப்பீட்டு மரபுத்தொடரும் தாவீதிய அரச வம்சச் சூத்திரமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
