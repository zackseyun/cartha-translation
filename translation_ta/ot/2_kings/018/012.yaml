  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் தங்கள் கடவுளாகிய யாவேயின் குரலுக்குச் செவிகொடுக்காமல்[a], அவருடைய உடன்படிக்கையை—யாவேயின் ஊழியரான மோசே கட்டளையிட்ட அனைத்தையும்—மீறினார்கள்[b]. அவர்கள் செவிகொடுக்கவும் இல்லை, அதன்படி செய்யவும் இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை’ என்பதை ‘யாவேக்குக் கீழ்ப்படியவில்லை’ என்றும் பொருள்கொள்ளலாம். எபிரெய மொழியில் ‘குரலுக்குச் செவிகொடுத்தல்’ என்பது பெரும்பாலும் கீழ்ப்படிதலையும் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: ‘உடன்படிக்கையை மீறினார்கள்’ என்பதற்கு ‘உடன்படிக்கையை உடைத்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். தொடர்ந்து வரும் சொற்கள் அந்த உடன்படிக்கையை மோசே கட்டளையிட்ட அனைத்தோடும் தொடர்புபடுத்துகின்றன.
    reason: lexical_and_syntactic_note
  - marker: c
    text: ‘செவிகொடுக்கவில்லை’ என்ற கருத்து எபிரெய மூலத்தில் மீண்டும் வருகிறது. இது ஒரே ஒரு தவறை மட்டுமல்ல, தொடர்ந்து கீழ்ப்படிய மறுத்ததையும் வலியுறுத்துகிறது.
    reason: discourse_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிகழ்வுக்கான காரணத்தை இத்தொடர் அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காரண இணைப்புச் சொல் பயன்படுத்தப்பட்டது.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: குரலுக்குச் செவிகொடுக்க
  rationale: இந்த எபிரெய மரபுத்தொடர் கேட்டலையும் கீழ்ப்படிதலையும் உள்ளடக்குகிறது. ‘செவிகொடுக்க’ என்பது குரல் என்ற உருவகத்தைத் தக்கவைத்தபடியே கீழ்ப்படிதல் சார்ந்த பொருளையும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: அவருடைய உடன்படிக்கையை மீறினார்கள்
  rationale: உடன்படிக்கைச் சூழலில் עבר என்பது எல்லையைக் கடத்தல் என்ற நேரடிப் பொருளைவிட உடன்படிக்கையை மீறுதல் என்று பொருள்படுகிறது.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: கட்டளையிட்ட அனைத்தையும்
  rationale: கட்டளையிடப்பட்டவற்றின் முழுமையான பரப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியரான மோசே
  rationale: עֶבֶד இங்கு அடிமைநிலையை வலியுறுத்தாமல், யாவேக்கு உரிய மதிப்புக்குரிய பணியையும் அதிகாரப்பூர்வ உறவையும் குறிக்கிறது.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: அவர்கள் செவிகொடுக்கவும் இல்லை, அதன்படி செய்யவும் இல்லை
  rationale: மூலத்தின் இரட்டை மறுப்பையும் ‘செவிகொடுத்தல்’ என்ற மீளுரையையும் தக்கவைக்கிறது; ‘அதன்படி’ என்பது மோசே கட்டளையிட்ட அனைத்தையும் செயல்படுத்துவதை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: שׁמע என்பதை வெளிப்படையாக ‘கீழ்ப்படி’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: செவிகொடுக்க
  alternative: கீழ்ப்படிய
  rationale: இம்மரபுத்தொடரில் கீழ்ப்படிதல் அடங்கியிருந்தாலும், ‘செவிகொடுக்க’ என்பது குரல் பற்றிய எபிரெய உருவகத்தையும் வசன முடிவிலுள்ள மீளுரையையும் காக்கிறது; உடன்படிக்கையை மீறினார்கள் என்ற அடுத்த கூற்று கீழ்ப்படியாமையைத் தெளிவுபடுத்துகிறது.
- issue: ‘அவருடைய உடன்படிக்கை’க்கும் ‘மோசே கட்டளையிட்ட அனைத்துக்கும்’ இடையிலான தொடர்பு
  choice: விளக்கமான இடைச்செருகலாகக் காட்டப்பட்டது
  alternative: இரண்டு தனித்தனி செயப்படுபொருள்களாக அமைத்தல்
  rationale: אֵת כָּל אֲשֶׁר என்ற தொடர், முன் குறிப்பிடப்பட்ட உடன்படிக்கையின் உள்ளடக்கத்தை விளக்குவதாக இயல்பாகப் புரிந்துகொள்ள முடியும். கோடுகள் அந்தத் தொடர்பைத் தெளிவாக்குகின்றன; இரண்டையும் முற்றிலும் பிரிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. அரிதான வடிவங்கள் தவிர்க்கப்பட்டு, ‘செவிகொடுக்க’, ‘உடன்படிக்கை’, ‘ஊழியர்’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. இறைத் திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
