translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, புரிந்துகொள்ள எளிய நடையைப் பயன்படுத்துகிறது. ஏளனமிக்க வினாவின் வலிமை காக்கப்பட்டுள்ளது; எபிரெய மரபுத்தொடரின் இயல்பற்ற நேரடி வடிவத்துக்குப் பதிலாக அதன் பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
