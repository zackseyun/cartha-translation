base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: ta
  text: அப்படியானால், தேர்களையும் குதிரைவீரர்களையும் பெறுவதற்காக நீ எகிப்தை நம்பியிருக்கும்போது, என் எஜமானின் தாழ்நிலை ஊழியர்களில் ஒருவனான ஒரு ஆளுநரைக்கூட[a] உன்னால் எப்படி எதிர்த்து நிற்க முடியும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆளுநர்” என்பதை “தளபதி” அல்லது “அதிகாரி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் மாகாண ஆட்சியாளரையோ படை அல்லது நிர்வாக அதிகாரியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “முகத்தைத் திருப்பச் செய்ய முடியும்?” இது ஒருவரைத் தடுத்து நிறுத்துவதையோ முறியடிப்பதையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: எதிர்த்து நிற்க
  rationale: இந்த எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘முகத்தைத் திருப்பச் செய்’ என்பதாக இருந்தாலும், இங்கு ஒருவரைத் தடுத்து நிறுத்துதல் அல்லது முறியடித்தல் என்ற படைச்சூழல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פַחַת
  choice: ஆளுநர்
  rationale: இச்சொல் மாகாண ஆட்சியாளரையோ படை அல்லது நிர்வாக அதிகாரியையோ குறிக்கலாம். அசீரியப் பதவியைக் காட்ட ‘ஆளுநர்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; சூழலுக்குரிய பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אַחַד
  choice: ஒருவனான ஓர் … கூட
  rationale: ‘ஒரே ஒருவனைக்கூட எதிர்க்க முடியாது’ என்ற ஏளனக் கேள்வியின் வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: என் எஜமானின் மிகத் தாழ்ந்த ஊழியர்கள்
  rationale: הַקְּטַנִּים என்பது உடல் அளவை அல்ல, பதவி அல்லது முக்கியத்துவத்தில் தாழ்ந்த நிலையைக் குறிக்கிறது. אֲדֹנִי இங்கு தெய்வீகப் பட்டம் அல்ல; பேசுபவரின் எஜமானைக் குறிக்கிறது.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: நீ எகிப்தை நம்பியிருக்கிறாயே
  rationale: בטח על என்பதன் ‘நம்பியிரு/சார்ந்திரு’ என்ற பொருளையும், சூழலிலுள்ள ஏளனத் தொனியையும் இயல்பாகக் கொண்டுவருகிறது.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: தேர்களுக்காகவும் குதிரைவீரர்களுக்காகவும்
  rationale: எகிப்திடமிருந்து எதிர்பார்க்கப்படும் இராணுவ வளங்களை לְ முன்னிடைச்சொல்லுடன் நெருக்கமாகப் பிரதிபலிக்கிறது.
