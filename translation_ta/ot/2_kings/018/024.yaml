  terminology: “ஆளுநர்” என்பது פחת என்பதற்கு ஏற்ற முதன்மைத் தேர்வாகும்; படைச்சூழலுக்குரிய “தளபதி,” பொதுவான “அதிகாரி” ஆகிய மாற்றுகளும் அடிக்குறிப்பில் பொருத்தமாக உள்ளன. “எதிர்த்து நிற்க” என்பது ‘பின்வாங்கச் செய்தல்/முறியடித்தல்’ என்ற மரபுத்தொடரின் பொருளைச் சரியாகத் தருகிறது. “எஜமான்” இங்கு தெய்வீகப் பட்டமாக அல்லாமல் பேசுபவரின் தலைவனைக் குறிக்கிறது.
