base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: ta
  text: அப்போது இல்க்கியாவின் மகன் எலியாக்கீமும், செப்னாவும், யோவாவும் ரப்சாக்கேயிடம், “தயவுசெய்து உம் பணியாளர்களாகிய எங்களோடு அரமேய மொழியில் பேசுங்கள்; ஏனெனில் எங்களுக்கு அது புரியும். மதிலின்மேல் இருக்கும் மக்கள் கேட்கும் வகையில் எங்களோடு யூதா நாட்டின் மொழியில்[a] பேச வேண்டாம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிரெய மொழியில்.” எபிரெயச் சொல் יְהוּדִית என்பதன் நேரடிப் பொருள் “யூதேய மொழி”; அது யூதா நாட்டின் மொழியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது ஓர் அசீரிய அரசவைக் கூடுதல் பதவிப்பெயராக இருக்கலாம்; அதன் துல்லியமான பணியை ஊகித்து மொழிபெயர்க்காமல், அடையாளம் காணத்தக்க மரபுவழி ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது.
- source_word: דַּבֶּר נָא
  choice: தயவுசெய்து ... பேசுங்கள்
  rationale: கட்டளை வடிவத்துடன் வரும் נָא மரியாதையான வேண்டுகோளை வெளிப்படுத்துகிறது; நவீன தமிழில் இதை இயல்பாகக் காட்டுகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களிடம்
  rationale: இராஜதந்திரச் சூழலில் இது அடிமைத்தனத்தை வலியுறுத்துவதைவிட தங்களைத் தாழ்த்திக் கூறும் அரசவைச் சொல்வழக்கு; ‘பணியாளர்கள்’ அந்தப் பதிவுநிலையைத் தக்கவைக்கிறது.
- source_word: אֲרָמִית
  choice: அரமேய மொழியில்
  rationale: இங்கு இச்சொல் பேசப்பட வேண்டிய மொழியைக் குறிக்கும் வினையடைப் பயன்பாட்டில் வருகிறது; தமிழில் மொழியை வெளிப்படையாகக் குறிப்பிடுவது இயல்பானது.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: ஏனெனில் எங்களுக்கு அது புரியும்
  rationale: שׁמע என்பதற்கு ‘கேள்’ என்றும் ‘புரிந்துகொள்’ என்றும் பொருள் உண்டு; மொழித்திறன் பற்றிய இச்சூழலில் ‘புரியும்’ என்பதே நோக்கத்தைத் தெளிவாக அளிக்கிறது.
- source_word: יְהוּדִית
  choice: யூத மொழியில்
  rationale: இது யூதா நாட்டின் மொழி அல்லது பேச்சுவழக்கைக் குறிக்கிறது; தொழில்நுட்ப மொழியியல் அடையாளமாக ‘எபிரெயம்’ என்று மட்டும் தீர்மானிக்காமல் மூலச்சொல்லின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: בְּאָזְנֵי
  choice: கேட்கும்படி
  rationale: சொல்லுக்கு சொல் ‘காதுகளில்’ என்றாலும், மக்கள் கேட்கும் வகையில் பேசுவதைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: மதில்மேல் இருக்கும் மக்கள்
  rationale: மூலத்தில் ‘மக்கள்’ என்றே உள்ளது; அவர்களைப் படைவீரர்கள் என்று குறுக்காமல் உறவுத்தொடரின் காட்சியையும் தக்கவைக்கிறது.
- source_word: וַיֹּאמֶר ... אֶל
  choice: அப்போது ... ரப்சாக்கேயிடம் ... என்றார்கள்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; பல பெயர்கள் எழுவாயாக இருப்பதால் தமிழில் இயல்பாகப் பன்மை வினை பயன்படுத்தப்படுகிறது.
