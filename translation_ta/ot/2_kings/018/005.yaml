source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: ta
  text: அவர் இஸ்ரவேலின் இறைவனாகிய யாவேமீது நம்பிக்கை வைத்தார். அவருக்குப் பின்வந்த யூதாவின் அரசர்கள் அனைவரிலும் அவரைப் போன்றவர் எவரும் இருக்கவில்லை; அவருக்கு முன்பிருந்தவர்களிலும் எவரும் அவரைப் போன்றவர் இருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: யாவேமீது
  rationale: ב முன்னொட்டு நம்பிக்கையின் சார்புப் பொருளை, ‘மீது’ என இயல்பான தமிழில் காட்டுகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் இறைவனாகிய
  rationale: எபிரெயக் கட்டிணைத் தொடர் யாவேவை இஸ்ரவேலின் இறைவன் என்று அடையாளப்படுத்துகிறது; தமிழில் இயல்பான இணைப்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בָּטָח
  choice: நம்பிக்கை வைத்தார்
  rationale: בטח என்பதன் Qal நிறைவுவினை ‘நம்புதல், சார்ந்திருத்தல்’ என்று பொருள்படும்; ‘நம்பிக்கை வைத்தார்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וְאַחֲרָיו
  choice: அவருக்குப் பின்வந்த
  rationale: கால வரிசையில் அவருக்குப் பிறகு ஆட்சி செய்தவர்களைக் குறிக்கும் பொருள் தெளிவாக வெளிப்படுத்தப்படுகிறது.
- source_word: לֹא הָיָה כָמֹהוּ
  choice: அவரைப் போன்றவர் எவரும் இருக்கவில்லை
  rationale: ஒப்புமையற்ற தன்மையைச் சொல்லும் எபிரெய மரபுத்தொடரை நேர்த்தியான தமிழில் காக்கிறது.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்கள் அனைவரிலும்
  rationale: ב இங்கு ஒப்பிடப்படும் குழுவுக்குள் ‘அனைவரிலும்’ என்ற பொருளைக் குறிக்கிறது.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: அவருக்கு முன்பிருந்தவர்களிலும்
  rationale: முன்னிருந்த யூதா அரசர்களுக்கும் ஒப்பீட்டை விரிவுபடுத்தும் சார்புவாக்கியத்தின் பொருள் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கெழுத்துத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகக் காக்கிறது.
- issue: எசேக்கியாவின் ஒப்பற்ற தன்மையின் வரம்பு
  choice: அவருக்கு முன்னும் பின்னும் இருந்த யூதா அரசர்களுக்குள் ஒப்பீடு
  alternative: எல்லாக் காலத்திலும் முற்றிலும் ஒப்பற்றவர்
  rationale: வசனத்தின் இலக்கண வரம்பு யூதாவின் அரசர்களே; அதைக் கடந்து பொதுவான அல்லது முழுமையான மேன்மைக் கூற்றாக விரிவுபடுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அரச வரலாற்றுக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதில் நிலையான தமிழ்ச் சொல்லான ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது.
