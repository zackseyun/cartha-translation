  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: ta
  text: அப்போது ரப்சாக்கே அவர்களிடம்[a], “இந்த வார்த்தைகளைப் பேசுவதற்காக என் எஜமான் என்னை உன் எஜமானிடமும் உன்னிடமும் மட்டுமா அனுப்பினார்? உங்களோடு சேர்ந்து தங்கள் மலத்தைத் தின்றும் தங்கள் சிறுநீரைக் குடித்தும் வாழ வேண்டியிருக்கும், மதில்மேல் உட்கார்ந்திருக்கும் மனிதர்களிடமும் அல்லவா அனுப்பினார்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் முற்றுகையின் கொடுமையை வெளிப்படுத்தும் கடுமையான சொற்கள் உள்ளன: “தங்கள் மலத்தைத் தின்று, தங்கள் சிறுநீரைக் குடிக்க.” சில கையெழுத்துப் பிரதிகளிலும் வாசிப்பு மரபுகளிலும் இரண்டாவது சொற்றொடர் மென்மையாக்கப்பட்டு, “தங்கள் கால்களின் நீரைக் குடிக்க” என்று உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: அசீரிய உயரதிகாரியின் பதவிப்பெயர் இக்கதையில் பெயரைப்போலப் பயன்படுகிறது. அலுவலின் துல்லியமான தன்மை உறுதியற்றதால், பொருளை மிகையாகக் குறிப்பதற்குப் பதிலாக மரபான ஒலிபெயர்ப்பு வைக்கப்பட்டது.
- source_word: הַעַל ... שְׁלָחַנִי אֲדֹנִי
  choice: என் எஜமான் என்னை ... மட்டுமா அனுப்பினார்?
  rationale: הַ...עַל தொடர் எதிர்பார்க்கப்படும் மறுப்புப் பதிலைக் கொண்ட வினாவை உருவாக்குகிறது. அடுத்துள்ள הֲלֹא வினாவுடனான ‘இவர்களிடம் மட்டுமா—அவர்களிடமும் அல்லவா’ என்ற முரணை இயல்பான தமிழில் வெளிப்படுத்த ‘மட்டுமா’ சேர்க்கப்பட்டது.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: உன் எஜமான் / என் எஜமான்
  rationale: இங்கு அரசியல் சூழலில் மனித அரசர்களைக் குறிக்கிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரியாதபடி ‘எஜமான்’ பயன்படுத்தப்பட்டது.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளைப் பேசுவதற்காக
  rationale: எபிரெய உரையின் சொல் சார்ந்த வெளிப்பாட்டைப் பேணுவதோடு தற்போதைய தமிழிலும் இயல்பாக உள்ளது.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: மதில்மேல் உட்கார்ந்திருக்கிற மனிதர்களிடமும் அல்லவா அனுப்பினார்?
  rationale: הֲלֹא உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினா. முந்தைய வினாவுடனான தொடர்பைத் தெளிவாக்க ‘-உம் அல்லவா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: தின்று ... குடிக்கப்போகிறார்கள்
  rationale: முற்றுகையின் வரவிருக்கும் கொடூர விளைவை எபிரெய infinitive தொடர்கள் சுட்டுகின்றன. ‘குடிக்கப்போகிறார்கள்’ என்பது அந்த prospective force-ஐ இயல்பான தமிழில் காட்டுகிறது; இரண்டு வினைகளும் ஒரே கட்டமைப்பில் இணைக்கப்பட்டுள்ளன.
- source_word: חרי/הם
  choice: தங்கள் மலம்
  rationale: கெதீவ் கடுமையான கழிவைக் குறிக்கும் சொல்லைப் பாதுகாக்கிறது. இழிவான முற்றுகை மிரட்டலை மென்மையாக்காமல், நவீன வாசகருக்குத் தெளிவாக ‘மலம்’ என வழங்கப்பட்டது.
- source_word: שיני/הם
  choice: தங்கள் சிறுநீர்
  rationale: மசோரா மரபில் வாசிப்பு மென்மையாக்கப்பட்டிருந்தாலும், இச்சூழலின் நேரடியான பொருள் சிறுநீர். மிரட்டலின் கொடுமையைத் தெளிவாகத் தெரிவிக்க நேரடிச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עִמָּכֶם
  choice: உங்களோடு சேர்ந்து
  rationale: மதிலிலுள்ளவர்களும் உரையாடப்படுகிற அதிகாரிகளும் ஒரே முற்றுகைத் துன்பத்தில் பங்குபெறுவதைத் தெளிவாகக் காட்டுகிறது.
