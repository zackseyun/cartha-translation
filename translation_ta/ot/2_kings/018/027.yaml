  register: நவீன தரமான தமிழ்; அரசவைக் காட்சிக்கேற்ற கண்ணியமான நடை பேணப்பட்டுள்ளது. ஆனால் பேச்சாளரின் இழிவான முற்றுகை மிரட்டல் மென்மையாக்கப்படவில்லை. ஒருமை ‘உன்/உன்னிடம்’ மற்றும் பன்மை ‘உங்களோடு’ என்ற மூலமொழி மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
