translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தில் முதலில் எலியாக்கீம் ஒருமை வினையுடன் வருவதைத் தொடர்ந்து மற்ற அதிகாரிகள் இணைக்கப்படுகிறார்கள்; தமிழில் மூவரும் ஒரே கூட்டெழுவாயாக அமைக்கப்பட்டு பன்மை வினை பயன்படுத்தப்பட்டுள்ளது. நிர்வாகப் பதவிகள் சாதாரண வாசகருக்குத் தெளிவாக மொழிபெயர்க்கப்பட்டு, மூலத்தின் சொல்லடியான வடிவமும் மாற்று அர்த்தங்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
