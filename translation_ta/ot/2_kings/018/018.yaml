base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: ta
  text: அவர்கள் ராஜாவை அழைத்தனர். இல்க்கியாவின் மகனும் அரண்மனைப் பொறுப்பாளருமான[a] எலியாக்கீம், எழுத்தராகிய[b] செப்னா, ஆசாபின் மகனும் பதிவாளருமான யோவாக் ஆகியோர் அவர்களிடம் வெளியே வந்தனர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லடியாக, ‘வீட்டின்மேல் இருந்தவர்’; இது அரச இல்லம் அல்லது அரண்மனை நிர்வாகத்துக்குப் பொறுப்பான பதவியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘செயலர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர்களிடம் வெளியே சென்றனர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: அவர்கள் ராஜாவை அழைத்தனர்
  rationale: קרא உடன் אֶל இங்கு ராஜாவை வருமாறு அழைப்பதைச் சுட்டுகிறது. தமிழில் ‘ராஜாவை அழைத்தனர்’ என்பது இயல்பாகவும், முறையான கட்டளை என்று மிகைப்படுத்தாமலும் உள்ளது.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: அவர்களிடம் வெளியே வந்தனர்
  rationale: יצא என்பது ‘வெளியே வருதல்/செல்லுதல்’ என இருவித நோக்குநிலையிலும் சொல்லப்படலாம். சந்திக்க வந்த அதிகாரிகள் அனைவரையும் உள்ளடக்கத் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: இல்க்கியாவின் மகன் எலியாக்கீம்
  rationale: எபிரேயத் தந்தைவழி அடையாள அமைப்பு இயல்பான தமிழில் பாதுகாக்கப்படுகிறது; பெயர்கள் ஒலிபெயர்க்கப்படுகின்றன.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: அரண்மனைப் பொறுப்பாளர்
  rationale: சொல்லடியாக ‘வீட்டின்மேல் இருந்தவர்’ என்றாலும் இது அரச நிர்வாகப் பதவி. சூழலில் ‘அரண்மனைப் பொறுப்பாளர்’ தெளிவான, இயல்பான தமிழாக்கம்; பதவியின் சொல்லடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַסֹּפֵר
  choice: எழுத்தர்
  rationale: סֹפֵר இங்கு அரச அலுவலரைக் குறிக்கிறது. ‘எழுத்தர்’ மூலச்சொல்லுக்கு நெருக்கமானதும் தமிழில் புரிந்துகொள்ளத்தக்கதுமான பதவிப்பெயர்.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: ஆசாபின் மகன் யோவாக்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டு, தந்தைவழி அடையாளம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: הַמַּזְכִּיר
  choice: பதிவாளர்
  rationale: இது அரச ஆவணங்கள் அல்லது நினைவுக் குறிப்புகளுக்குப் பொறுப்பான அலுவலரைக் குறிக்கிறது; ‘பதிவாளர்’ பழமையான அல்லது தெளிவற்ற சொல்லைத் தவிர்த்து பதவியின் அடிப்படைப் பணியைத் தெரிவிக்கிறது.
