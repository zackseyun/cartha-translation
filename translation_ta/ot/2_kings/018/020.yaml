  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ta
  text: “இது வெறும் உதட்டளவுப் பேச்சுதான்” என்று நீ சொல்கிறாய்; ஆனால் போருக்கு ஆலோசனையும் வலிமையும் தேவை. இப்போது நீ யாரை நம்பி எனக்கு எதிராகக் கலகம் செய்தாய்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: உதட்டளவுப் பேச்சு
  rationale: சொல்லளவில் மட்டுமே இருந்து நடைமுறை வல்லமை இல்லாத பேச்சைக் குறிக்கும் எபிரெயச் சொற்றொடரின் உருவகத்தையும் இயல்பான நவீன தமிழையும் இணைக்கிறது.
- source_word: עֵצָה
  choice: ஆலோசனை
  rationale: போருக்கான திட்டமிடல், தந்திரம் ஆகியவற்றை உள்ளடக்கக்கூடிய பொதுவான சொல்லாக மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: גְבוּרָה
  choice: வலிமை
  rationale: இராணுவ வல்லமை அல்லது ஆற்றல் என்ற பொருளை மிகையாகக் குறிப்பாக்காமல் வழங்குகிறது.
- source_word: בָטַחְתָּ
  choice: நம்பி
  rationale: ஒருவர்மீது பாதுகாப்புக்காக அல்லது உதவிக்காகச் சார்ந்திருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָרַדְתָּ
  choice: கலகம் செய்தாய்
  rationale: அரசாட்சிக்கு எதிரான கிளர்ச்சி அல்லது கீழ்ப்படியாமை என்ற அரசியல் நுண்ணுணர்வைத் தக்கவைக்கிறது.
theological_decisions:
- issue: முதல் வாக்கியத்தின் தொடரியல் தெளிவின்மை
  choice: “வெறும் உதட்டளவுப் பேச்சே போதும்” என்று நீ சொல்கிறாய். ஆனால் போருக்கு ஆலோசனையும் வலிமையும் வேண்டும்.
  alternative: “வெறும் உதட்டளவுப் பேச்சு!” என்று நீ சொல்கிறாய்; போருக்கு ஆலோசனையும் வலிமையும் உன்னிடம் உள்ளனவா?
  rationale: மசோரா உரையின் சுருக்கமான அமைப்பு பலவாறு புரிந்துகொள்ளப்படலாம். கொடுக்கப்பட்ட ஆலோசனை மொழிபெயர்ப்புடன் ஒத்த வாசிப்பை முதன்மை உரையில் இயல்பான தமிழில் தருகிறது; எந்தக் குறிப்பிட்ட இறையியல் முடிவையும் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசர் உரையாடலுக்கேற்ற கண்ணியமான ஆனால் நேரடியான நடை. “உதட்டளவுப் பேச்சு” என்பது பொதுவாகப் புரியும் இயல்பான உருவகம்; “எனக்கு எதிராக” என்பது בִּי என்ற உறவைக் தெளிவாக வழங்குகிறது.
