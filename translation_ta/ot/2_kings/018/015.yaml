  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: ta
  text: எசேக்கியா, யாவேவின் ஆலயத்திலும்[a] அரச அரண்மனையின் கருவூலங்களிலும்[b] காணப்பட்ட வெள்ளி அனைத்தையும்[c] கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘யாவேவின் வீட்டிலும்.’'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘அரசனின் வீட்டின் கருவூலங்களிலும்.’'
    reason: lexical_alternative
  - marker: c
    text: ‘வெள்ளி’ என்பது இங்கு ‘பணம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
