base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: ta
  text: 'எசேக்கியாவுக்குச் செவிகொடுக்காதீர்கள்; ஏனெனில் அசீரியாவின் அரசன் இவ்வாறு கூறுகிறான்: ‘என்னோடு சமாதானம் செய்துகொள்ளுங்கள்[a]; வெளியே வந்து என்னிடம் வாருங்கள். ஒவ்வொருவரும் தம் திராட்சைக்கொடியிலிருந்தும் தம் அத்திமரத்திலிருந்தும் உண்ணுங்கள்; தம் நீர்த்தொட்டியின் தண்ணீரைக் குடியுங்கள்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “என்னோடு ஒரு ஆசீர்வாதத்தைச் செய்யுங்கள்.” இது சமாதானம் செய்வதை அல்லது உடன்பாட்டு நிபந்தனைகளுக்கு வருவதைச் குறிக்கும் வழக்குத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: செவிகொடுக்காதீர்கள்
  rationale: שׁמע உடன் אֶל என்பது ஒருவரது சொல்லைக் கேட்டு ஏற்றுக்கொள்வதை அல்லது கவனிப்பதைக் குறிக்கிறது. இச்சூழலில் ‘செவிகொடுக்காதீர்கள்’ என்பது ‘கேட்காதீர்கள்’ என்பதைவிட நோக்கத்தைத் தெளிவாகவும், ‘கீழ்ப்படியாதீர்கள்’ என்பதைவிட குறைவாக விளக்கமளிப்பதாகவும் உள்ளது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כִּי כֹה אָמַר
  choice: ஏனெனில் ... கூறுவது இதுதான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயச் சார்புத்தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: என்னோடு சமாதானம் செய்துகொள்ளுங்கள்
  rationale: சொல்லளவில் ‘என்னோடு ஓர் ஆசீர்வாதத்தைச் செய்யுங்கள்’ என்ற அபூர்வமான சொற்றொடர், இம்முற்றுகைச் சூழலில் சாதகமான உடன்பாட்டுக்கு அல்லது சமாதான நிபந்தனைகளுக்கு வருவதைச் சுட்டுகிறது. மூலத்தின் அபூர்வ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וּצְאוּ אֵלַי
  choice: என்னிடம் வெளியே வாருங்கள்
  rationale: יצא என்பதன் ‘வெளியே வருதல்’ என்ற concrete பொருளைப் பாதுகாக்கிறது; முற்றுகைச் சூழலில் உள்ள சரணடைதல் என்ற உட்குறிப்பை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: உங்களில் ஒவ்வொருவரும் தமது திராட்சைக்கொடியின் கனியையும் தமது அத்திமரத்தின் கனியையும் உண்டு
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என இயங்குகிறது. எபிரெயத்தில் ‘கொடியை/மரத்தை உண்ணுதல்’ என்பது அதன் கனியை உண்பதைக் குறிக்கும் இயல்பான சுருக்கம்; தமிழில் பொருள் தெளிவுக்காக ‘கனி’ சேர்க்கப்பட்டது.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: தமது நீர்த்தொட்டியின் தண்ணீரைக் குடிக்கலாம்
  rationale: בּוֹר இங்கு ஊற்று-கிணற்றைவிட மழைநீர் சேமிக்கும் தொட்டி அல்லது cistern-ஐக் குறிக்கிறது. ‘நீர்த்தொட்டி’ நவீன வாசகருக்கு புரியும் துல்லியமான சொல்.
theological_decisions:
- issue: אִישׁ என்ற ஆண்பால் ஒருமை பகிர்வுச் சொல் மீண்டும் வருதல்
  choice: உங்களில் ஒவ்வொருவரும் ... தமது
  alternative: ஒவ்வொரு ஆணும் ... அவனது
  rationale: இங்கு אִישׁ தனிப்பட்ட ஆண்களைப் பிரித்துக் காட்டுவதைவிட, நகரவாசிகளைப் பகிர்வாகக் குறிக்கிறது. இயல்பான தமிழில் ‘ஒவ்வொருவரும்’ மூலத்தின் பொதுப்படுத்தும் வலிமையைக் காக்கிறது; பாலினத்தைத் தேவையின்றி குறுக்குவதில்லை.
- issue: עֲשׂוּ אִתִּי בְרָכָה என்ற அரசியல் வழக்குத்தொடர்
  choice: என்னோடு சமாதானம் செய்துகொள்ளுங்கள்
  alternative: என்னோடு ஓர் ஆசீர்வாதத்தைச் செய்யுங்கள் / என்னோடு உடன்பாட்டுக்கு வாருங்கள்
  rationale: சூழலில் இது அசீரிய அரசனின் நிபந்தனைகளை ஏற்று பகைமையை முடிப்பதைக் குறிக்கிறது. ‘சமாதானம்’ அதன் நடைமுறை வலிமையைத் தெரிவிக்கிறது; ஆனால் எபிரெயத்தின் அபூர்வமான ‘ஆசீர்வாதம்’ என்ற சொல்லமைப்பு அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
- issue: וּצְאוּ אֵלַי என்பதில் சரணடைதல் உட்குறிப்பு
  choice: என்னிடம் வெளியே வாருங்கள்
  alternative: என்னிடம் சரணடையுங்கள்
  rationale: முற்றுகைச் சூழல் சரணடைதலைக் குறிப்பிட்டாலும், மூலவினை நேரடியாக ‘வெளியே வாருங்கள்’ என்கிறது. அரசியல் உட்குறிப்பை மௌனமாகத் தீர்மானிக்காமல் concrete மொழி பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. அரசனின் பிரசார வாக்குறுதியைத் தெளிவாக்க ‘அப்போது’ மற்றும் அனுமதி/வாக்குறுதி நுணுக்கத்திற்காக ‘குடிக்கலாம்’ பயன்படுத்தப்பட்டன. ‘திராட்சைக்கொடி–அத்திமரம்’ என்ற எபிரெயப் படிமம் அப்படியே காக்கப்பட்டது; அதன் கனியை உண்பது தமிழில் தெளிவாகச் சொல்லப்பட்டது.
