  revised_text: அப்போது யூதாவின் அரசனான எசேக்கியா, லாகீசில் இருந்த அசீரிய அரசனிடம்[a] ஆளனுப்பி, “நான் பாவம் செய்தேன்.[b] என்னைவிட்டு விலகிச் செல்லுங்கள். நீங்கள் என்மேல் எதைச் சுமத்தினாலும், அதை நான் சுமப்பேன்[c]” என்று சொன்னான். அசீரிய அரசன் யூதாவின் அரசனான எசேக்கியாவின்மேல் முந்நூறு தாலந்து வெள்ளியையும் முப்பது தாலந்து தங்கத்தையும் சுமத்தினான்.
