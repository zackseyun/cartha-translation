  revision_rationale: חָטָאתִי என்பதற்கு மூலத்தின் வழக்கமான பொருளான “பாவம் செய்தேன்” முதன்மை உரையில் மீட்டெடுக்கப்பட்டுள்ளது; தூதரகச் சூழலில் சாத்தியமான மென்மையான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. நடையொற்றுமைக்காக “ராஜா” “அரசன்” என மாற்றப்பட்டுள்ளது. மற்ற எல்லாச் சொற்றொடர்களும் மூலத்தின் திறந்த தன்மையையும் பொருளாதாரச் சுமை உருவகத்தையும் தக்கவைக்கின்றன.
