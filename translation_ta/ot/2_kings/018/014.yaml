  source_fidelity: முதன்மை உரை வாக்கிய அமைப்பு, லாகீசில் இருந்த அசீரிய அரசன் என்ற சூழல்சார் புரிதல், விதிக்கப்படும் சுமை, வெள்ளி மற்றும் தங்கத்தின் அளவுகள் ஆகியவற்றைத் துல்லியமாகக் காட்டுகிறது. ஆனால் חָטָאתִי என்பதன் வழக்கமான, அறநெறி நிறைந்த பொருளை முதன்மை உரையில் “குற்றம் செய்துவிட்டேன்” எனச் சொல்வது சற்றுத் தளர்த்துகிறது. “பாவம் செய்தேன்” என்பது மூலத்தின் முதன்மைப் பொருளைத் தக்கவைக்கிறது; அரசியல்-தூதரக நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடலாம்.
  naturalness: உரை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “ராஜா” என்பதற்குப் பதில் “அரசன்” என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் ஒரே மாதிரியான நடையிலும் அமைகிறது. “ஆளனுப்பி” என்பது இச்சூழலில் தூதரை அனுப்பியதைக் குறிக்க இயல்பானது.
  terminology: “லாகீஸ்,” “அசீரியா,” “எசேக்கியா,” “தாலந்து,” “வெள்ளி,” “தங்கம்” ஆகியவை பொருத்தமானவை. “சுமத்தினாலும் / சுமப்பேன்” என்பது נתן על மற்றும் נשא ஆகியவற்றின் உருவகத் தொடர்பையும், பொருளை மிகையாகக் குறிப்பாக்காமலும் காக்கிறது.
