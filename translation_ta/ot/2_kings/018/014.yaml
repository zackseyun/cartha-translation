  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: ta
  text: அப்போது யூதாவின் அரசனான எசேக்கியா, லாகீசில் இருந்த அசீரிய அரசனிடம்[a] ஆளனுப்பி, “நான் பாவம் செய்தேன்.[b] என்னைவிட்டு விலகிச் செல்லுங்கள். நீங்கள் என்மேல் எதைச் சுமத்தினாலும், அதை நான் சுமப்பேன்[c]” என்று சொன்னான். அசீரிய அரசன் யூதாவின் அரசனான எசேக்கியாவின்மேல் முந்நூறு தாலந்து வெள்ளியையும் முப்பது தாலந்து தங்கத்தையும் சுமத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லாகீசுக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெய வடிவம் லாகீசை நோக்கிய இயக்கத்தைக் குறிக்கக்கூடும்; இங்கு அது அசீரிய அரசன் இருந்த இடத்தைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் தவறு செய்தேன்” அல்லது “நான் குற்றம் செய்தேன்.” எபிரெயச் சொல் பொதுவாகப் பாவம் செய்வதைக் குறிக்கிறது; இச்சூழலில் அரசியல் தவறை ஒப்புக்கொள்வதையும் உணர்த்தலாம்.
    reason: genuine_ambiguity
  - marker: c
    text: அதாவது, “அதை நான் ஏற்றுக்கொள்வேன்” அல்லது இச்சூழலில் “அதை நான் செலுத்துவேன்.” எபிரெயம் விதிக்கப்பட்ட சுமையைச் சுமக்கும் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: நேரடிப் பேச்சு தொடர்ந்து வருவதால், செய்தியையோ தூதர்களையோ அனுப்பிய செயலை இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: לָכִישָׁה
  choice: லாகீசில் இருந்த
  rationale: இடப்பெயருடன் சேர்ந்த திசைச் சுட்டு வடிவம் ‘லாகீசுக்கு’ என்ற இயக்கத்தைக் குறிக்கக்கூடும்; இச்சூழலில் அசீரிய ராஜா இருந்த இடத்தைக் குறிப்பதாகப் புரிந்துகொள்வது வாக்கிய ஓட்டத்துக்கும் பின்னணிக்கும் பொருந்துகிறது.
- source_word: חָטָאתִי
  choice: நான் குற்றம் செய்துவிட்டேன்
  rationale: அரசியல் அடிபணிதல் சூழலில் செய்த தவறு அல்லது குற்றத்தை ஒப்புக்கொள்ளும் பொருளை இயல்பாகத் தருவதோடு, எபிரெயச் சொல்லின் அறநெறி சார்ந்த கனத்தையும் முற்றிலும் நீக்கவில்லை; ‘பாவம் செய்தேன்’ என்பது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שׁוּב מֵעָלַי
  choice: என்னைவிட்டு விலகிச் செல்லுங்கள்
  rationale: தன் மீது வந்திருக்கும் பகைமை அழுத்தத்தை நீக்கிக்கொண்டு திரும்பிச் செல்லுமாறு கேட்பதை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: நீங்கள் என்மேல் எதைச் சுமத்தினாலும்
  rationale: נתן על இங்கு ஒருவர்மேல் வரி, அபராதம் அல்லது வேறு சுமையை விதிப்பதைக் குறிக்கிறது; குறிப்பிட்ட வகையை ஊகித்து சேர்க்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֶשָּׂא
  choice: அதை நான் சுமப்பேன்
  rationale: נשא என்பதன் ‘சுமத்தல்/தாங்குதல்’ உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் விதிக்கப்பட்ட தொகையை ஏற்றுச் செலுத்துவதும் உட்பொருளாக உள்ளது.
- source_word: וַיָּשֶׂם ... עַל
  choice: எசேக்கியாவின்மேல் ... சுமத்தினான்
  rationale: ஒரு கட்டாயப் பொருளாதாரச் சுமையை விதித்ததைத் தெரிவிப்பதோடு, முந்தைய ‘என்மேல் எதைச் சுமத்தினாலும்’ என்ற சொல்லாட்சியுடனான தொடர்பையும் காக்கிறது.
- source_word: כִּכַּר
  choice: தாலந்து
  rationale: பண்டைய எடை அலகான ככר என்பதற்குப் பரவலாக அறியப்பட்ட வேதாகமத் தமிழ்ச் சொல்; அளவை நவீன மதிப்பாக ஊகித்து மாற்றவில்லை.
- source_word: כֶּסֶף / זָהָב
  choice: வெள்ளி / தங்கம்
  rationale: எடையால் அளக்கப்பட்ட இரு உலோகங்களையும் மூலத்தின் நேரடியான பொருளின்படி குறிப்பிடுகிறது.
theological_decisions:
- issue: எசேக்கியாவின் ஒப்புக்கொள்ளுதலில் உள்ள அறநெறி மற்றும் அரசியல் நுணுக்கம்
  choice: ‘நான் குற்றம் செய்துவிட்டேன்’ என்று முதன்மை உரையில் கொடுத்து, ‘நான் பாவம் செய்துவிட்டேன்’ என்பதை அடிக்குறிப்பில் வைத்தல்
  alternative: ‘நான் பாவம் செய்துவிட்டேன்’
  rationale: חטא என்பது பொதுவாகப் பாவம் செய்வதைக் குறித்தாலும், இங்கு மேலரசனுக்கு எதிரான அரசியல் தவறை ஒப்புக்கொள்ளும் தூதரகச் சூழல் உள்ளது. ‘குற்றம்’ இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது; அடிக்குறிப்பு வலுவான சமய-அறநெறி மொழிபெயர்ப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: விதிக்கப்பட்ட சுமையின் தன்மை
  choice: வரி, கப்பம் அல்லது அபராதம் என்று முதன்மை உரையில் குறிப்பாக்காமல் ‘சுமத்தினாலும் / சுமப்பேன்’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘எவ்வளவு கப்பம் விதித்தாலும் அதைச் செலுத்துவேன்’
  rationale: எபிரெய உரை சுமையை விதித்து அதைத் தாங்கும் பரந்த உருவகத்தையே பயன்படுத்துகிறது. அடுத்த வாக்கியத்தில் வெள்ளியும் தங்கமும் குறிப்பிடப்படுவதால் பொருளாதாரக் கப்பம் என்பது தெளிவாகிறது; முதன்மை உரையில் அதை முன்கூட்டியே குறுக்க வேண்டியதில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ராஜாவிடம் பேசும் இடத்தில் மரியாதைப் பன்மையான ‘நீங்கள்/செல்லுங்கள்’ இடம்பெறுகிறது. ‘தாலந்து’ என்ற மரபான எடைப்பெயர் தக்கவைக்கப்பட்டுள்ளது; அதன் நவீன எடை உரையில் ஊகிக்கப்படவில்லை.
