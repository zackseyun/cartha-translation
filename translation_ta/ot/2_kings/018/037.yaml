  register: நவீனத் தரத் தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. அதிகாரப் பதவிகள் சாதாரண வாசகர்களுக்குப் புரியுமாறு வழங்கப்பட்டுள்ளன; உறுதியற்ற அசீரியப் பட்டம் விளக்கமின்றி குறிப்பிட்ட ஓர் அலுவலாக மாற்றப்படவில்லை.
