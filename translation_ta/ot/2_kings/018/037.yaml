  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣ה אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סֹּפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣דוּ ל֔/וֹ דִּבְרֵ֖י רַב שָׁקֵֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: ta
  text: அப்போது, அரண்மனைப் பொறுப்பாளராக இருந்த இல்க்கியாவின் மகன் எலியாக்கீமும், எழுத்தராகிய செப்னாவும், பதிவாளராகிய ஆசாபின் மகன் யோவாகும் உடைகள் கிழிந்த நிலையில் எசேக்கியாவிடம் வந்து, ரப்சாக்கேயின்[a] வார்த்தைகளை அவரிடம் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரப்சாக்கே” என்பது அசீரிய அரசவையின் ஓர் அதிகாரப் பட்டம்; அது தலைமைப் பானபாத்திரக்காரர் அல்லது அரசரின் உயர்நிலைப் பிரதிநிதி போன்ற ஓர் அதிகாரியைக் குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: தொடர்கதைச் சூழலில் வாவ் இணைப்பை இயல்பான நவீன தமிழில் ‘அப்போது’ எனக் காட்டுகிறது. எபிரெய வினை ஒருமையில் இருந்தாலும், அதைத் தொடர்ந்து கூட்டெழுவாய் வருவது வழக்கமான எபிரெய அமைப்பு; தமிழில் முழுக் கூட்டெழுவாய்க்கேற்ற பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: அரண்மனைப் பொறுப்பாளராக இருந்த
  rationale: இது அரச வீட்டையும் அரண்மனை நிர்வாகத்தையும் மேற்பார்வையிட்ட அதிகாரப் பதவியைக் குறிக்கிறது. சொற்சொல்லான ‘வீட்டின்மேல் இருந்த’ என்பதைக் காட்டிலும் பதவியின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַסֹּפֵר
  choice: எழுத்தர்
  rationale: அரசவையில் எழுத்து மற்றும் செயலர் பணிகளை மேற்கொண்ட அதிகாரியைக் குறிக்கும் சொல்லுக்கு மரியாதையான, பரவலாகப் புரியும் தமிழ்ச் சொல்.
- source_word: הַמַּזְכִּיר
  choice: பதிவாளர்
  rationale: நினைவுப் பதிவுகள் அல்லது அரச அலுவல் விவரங்களைப் பதிவு செய்த அதிகாரியின் பணியை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; ‘வரலாற்றாசிரியர்’ என்று தேவையின்றி குறுக்கவில்லை.
- source_word: קְרוּעֵי בְגָדִים
  choice: உடைகள் கிழிந்த நிலையில்
  rationale: அவர்கள் வந்து சேர்ந்தபோதைய நிலையை நேரடியாக விவரிக்கிறது. இது துயரம் அல்லது அதிர்ச்சியின் பண்பாட்டு அடையாளமாயினும், மூலத்தில் வெளிப்படையாக இல்லாத காரண விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: וַיַּגִּדוּ לוֹ
  choice: அவரிடம் தெரிவித்தார்கள்
  rationale: அரசரிடம் ஓர் உரையை முறையாக அறிவிக்கும் சூழலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: அவர்கள் ரப்சாக்கேயின் உரையை எடுத்துச் சொன்னார்கள் என்ற மூலத்தின் நேரடியான அமைப்பையும் அதிகாரப்பூர்வத் தொனியையும் காக்கிறது.
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது அசீரிய அதிகாரப் பட்டம். அதன் துல்லியமான பணியை உறுதியாகக் குறுக்காமல் ஒலிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
