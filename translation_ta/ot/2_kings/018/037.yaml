  source_fidelity: மூல எபிரெயத்தின் கூட்டெழுவாய், எலியாக்கீமுக்குரிய அரண்மனை நிர்வாகப் பதவி, செப்னாவின் எழுத்தர் பதவி, யோவாவின் பதிவாளர் பதவி, கிழிந்த உடைகளுடனான வருகை, எசேக்கியாவுக்குச் செய்த அறிக்கை, ரப்சாக்கேயின் வார்த்தைகள் ஆகிய அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன. ஒருமை வினைக்குப் பின்னர் வரும் கூட்டெழுவாயின் எபிரெய அமைப்பைத் தமிழ் பன்மை வினை இயல்பாகக் கையாள்கிறது.
