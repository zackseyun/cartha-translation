base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: ta
  text: 'அரசன் இவ்வாறு கூறுகிறான்: “எசேக்கியா உங்களை ஏமாற்ற இடம் கொடுக்காதீர்கள்; ஏனெனில், அவனுடைய கையிலிருந்து உங்களை விடுவிக்க எசேக்கியாவால் முடியாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுதான்
  rationale: அரச அறிவிப்பை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் அதிகாரபூர்வத் தன்மையைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைச் சுட்டும் சொல்லை, தனிப்பெயரைச் சேர்க்காமல் மூலத்தின் தலைப்புப்படியே மொழிபெயர்க்கிறது.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: உங்களை ஏமாற்றுவதற்கு இடம் கொடுக்காதீர்கள்
  rationale: தவறான நம்பிக்கையை ஏற்படுத்தி வழிதவறச் செய்தல் என்ற வினையின் பொருளையும், எதிர்மறைக் கட்டளையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாகத் தெளிவாக அமைகிறது.
- source_word: לֹא יוּכַל
  choice: அவனால் முடியாது
  rationale: יכולת வினையின் இயலாமைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְהַצִּיל
  choice: விடுவிக்க
  rationale: ஆபத்து அல்லது பகைவரின் அதிகாரத்திலிருந்து மீட்பதைச் சுட்டும் இராணுவ-அரசியல் சூழலுக்கு ஏற்ற தேர்வு.
- source_word: מִיָּדוֹ
  choice: அவனுடைய கையிலிருந்து
  rationale: மூலத்தில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உருபையும் ‘கை’ என்ற அதிகார உருவகத்தையும் மாற்றாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: מִיָּדוֹ என்பதில் ‘அவனுடைய கை’ யாரைக் குறிக்கிறது?
  choice: மூல உரைப்படி ‘அவனுடைய கையிலிருந்து’ என்று மொழிபெயர்க்கப்பட்டது; சூழலில் அது முன்னர் குறிப்பிடப்பட்ட அரசனின் அதிகாரத்தைக் குறிக்கிறது.
  alternative: ஏசாயா 36:14-இன் இணை உரையைப் பின்பற்றி ‘என்னுடைய கையிலிருந்து’ என வாசித்தல்; அல்லது உருவகத்தை விளக்கி ‘அவனுடைய அதிகாரத்திலிருந்து’ என மொழிபெயர்த்தல்.
  rationale: கொடுக்கப்பட்ட WLC உரையில் மூன்றாம் நபர் ஒருமை பின்னொட்டு உள்ளது. ஆகவே இணை உரையோடு ஒத்திசைக்காமல் அதையே பின்பற்றி, உண்மையான உரை வேறுபாட்டைக் குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் அரச அறிவிப்பின் தீவிரத் தொனியும் காக்கப்பட்டுள்ளன. பழமையான ‘மோசம்போக்க’ போன்ற சொற்கள் தவிர்க்கப்பட்டு, தெளிவான ‘ஏமாற்ற’ பயன்படுத்தப்பட்டுள்ளது; ‘கை’ உருவகம் மூலத்தோடு நெருக்கமாகப் பாதுகாக்கப்பட்டுள்ளது.
