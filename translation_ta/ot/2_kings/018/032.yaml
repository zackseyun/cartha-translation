id: 2KI.18.32
reference: 2 Kings 18:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: ta
  text: நான் வந்து, உங்களை உங்கள் நாட்டைப் போன்ற ஒரு நாட்டுக்கு அழைத்துச் செல்லும்வரை—தானியமும் புதுத் திராட்சரசமும்[a] நிறைந்த நாடு, அப்பமும் திராட்சைத்தோட்டங்களும் நிறைந்த நாடு, ஒலிவ எண்ணெயும் தேனும் நிறைந்த நாடு[b]—வாழுங்கள்; சாகாதிருங்கள். எசேக்கியாவுக்குச் செவிசாய்க்காதீர்கள். ஏனெனில், ‘யாவே நம்மை விடுவிப்பார்’ என்று சொல்லி அவன் உங்களைத் தவறாக வழிநடத்துகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புதுத் திராட்சரசம்” என்பதற்குப் பதிலாக “திராட்சரசம்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பொதுவாகப் புதிய அல்லது இளம் திராட்சரசத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ஒலிவ மரத்தின் விளைபொருளையும் எண்ணெயையும் இணைக்கும் சுருக்கமான சொற்றொடர் உள்ளது; பொருள் “ஒலிவ எண்ணெயும் தேனும் நிறைந்த நாடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי וְלָקַחְתִּי אֶתְכֶם
  choice: நான் வந்து, உங்களை ... அழைத்துச் செல்லும்வரை
  rationale: עַד marks the endpoint introduced in the preceding context, while לקח in this deportation setting means taking the people to another land. The Tamil retains the verse’s dependent ‘until’ construction without adding an unstated command.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: உங்கள் நாட்டைப் போன்ற ஒரு நாட்டுக்கு
  rationale: כְ expresses comparison rather than identity; this wording preserves the speaker’s promise that the destination will resemble their own land.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: தானியமும் புதுத் திராட்சரசமும் நிறைந்த நாடு
  rationale: דָּגָן refers broadly to grain, and תִּירוֹשׁ more specifically to fresh or new wine. ‘நிறைந்த’ supplies natural Tamil for the Hebrew nominal description without changing its sense.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: அப்பமும் திராட்சைத்தோட்டங்களும் நிறைந்த நாடு
  rationale: The concrete senses ‘bread’ and ‘vineyards’ are retained, emphasizing agricultural abundance.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: ஒலிவ எண்ணெயும் தேனும் நிறைந்த நாடு
  rationale: The Hebrew expression involving זֵית and יִצְהָר is compressed; the Tamil communicates its natural referent, olive oil, while noting the compression.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: வாழுங்கள்; சாகாதிருங்கள்
  rationale: וִחְיוּ is morphologically imperative, followed by the negative ‘do not die.’ The direct exhortation is therefore retained rather than converted into a future promise.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: எசேக்கியாவுக்குச் செவிசாய்க்காதீர்கள்
  rationale: שׁמע אל here means to heed or listen to someone; ‘செவிசாய்க்காதீர்கள்’ is natural, dignified Tamil.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: ஏனெனில் ... அவன் உங்களைத் தவறாக வழிநடத்துகிறான்
  rationale: The Hiphil of סות can mean entice, incite, or mislead. The chosen wording preserves the hostile speaker’s accusation without intensifying it into explicit fraud.
- source_word: יְהוָה
  choice: யாவே
  rationale: The personal divine name represented by the Tetragrammaton is transliterated rather than replaced with a title.
- source_word: יַצִּילֵנוּ
  choice: நம்மை விடுவிப்பார்
  rationale: The Hiphil of נצל denotes rescue or deliverance from danger; ‘விடுவிப்பார்’ fits the military threat in context.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: The source directly uses the divine name YHWH. ‘யாவே’ preserves it as a personal name and does not substitute a title.
- issue: வாழ்வது குறித்த வாக்கியத்தின் இலக்கண வலிமை
  choice: வாழுங்கள்; சாகாதிருங்கள்
  alternative: நீங்கள் வாழ்வீர்கள்; சாகமாட்டீர்கள்
  rationale: The first Hebrew verb is imperative. Retaining the exhortation avoids turning the Assyrian speaker’s appeal into an unqualified predictive promise.
translation_notes:
  register: நவீன பொதுத்தமிழில், அரசியல் மிரட்டலும் வளமான நாட்டைப் பற்றிய கவர்ச்சிகரமான வாக்குறுதியும் இரண்டும் கேட்கும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்வதால், தொடக்கத்திலுள்ள ‘வரும்வரை’ அமைப்பு அப்படியே காக்கப்பட்டுள்ளது.
