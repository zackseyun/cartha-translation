source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: ta
  text: 'ஆனால் மக்கள் மௌனமாக இருந்தார்கள்; அவனுக்கு ஒரு வார்த்தையும் பதிலளிக்கவில்லை[a]. ஏனெனில் அரசரின் கட்டளை இதுவாக இருந்தது: “அவனுக்குப் பதிலளிக்காதீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவனுக்கு ஒரு வார்த்தையும் பதிலளிக்கவில்லை”; அதாவது, அவர்கள் எந்தப் பதிலும் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: மௌனமாக இருந்து
  rationale: חרשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு தொடர்ந்து அமைதியாக இருப்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதன் இயல்பான பொருள் ‘மக்கள்’; சூழலில் மதில்மேல் கேட்டுக்கொண்டிருந்த யூதா மக்களைக் குறித்தாலும், மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் பொதுவாகவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: அவனுக்கு ஒரு வார்த்தையும் பதிலளிக்கவில்லை
  rationale: ‘அவனுக்கு ஒரு வார்த்தை பதிலளிக்கவில்லை’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை வாசிக்கத்தக்க தமிழில் காத்து, அவர்கள் முற்றிலும் பதில் கூறவில்லை என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மக்கள் மௌனமாக இருந்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: அரசர் கட்டளையிட்டிருந்தார்
  rationale: מִצְוָה அரச அதிகாரத்துடன் வழங்கப்பட்ட கட்டளையைக் குறிக்கிறது; தமிழ் வாக்கிய ஓட்டத்திற்காக பெயர்ச்சொல் அமைப்பு வினை அமைப்பாக இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: הִיא לֵאמֹר
  choice: என்று
  rationale: மேற்கோள் கட்டளையை அறிமுகப்படுத்தும் எபிரெய அமைப்பு தமிழில் இயல்பாக ‘என்று’ மூலம் வெளிப்படுகிறது.
- source_word: לֹא תַעֲנֻהוּ
  choice: அவனுக்குப் பதிலளிக்காதீர்கள்
  rationale: இது பலரிடம் கூறப்பட்ட நேரடி தடை; மரியாதை/பன்மை கட்டளை வடிவம் அந்த இலக்கண எண்ணையும் அரச கட்டளையின் தன்மையையும் காக்கிறது.
