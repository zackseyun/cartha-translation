translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரசன்’ என்பதற்குப் பதிலாக மரியாதைமிக்க இயல்பான ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ‘ஒரு வார்த்தையும்’ என்ற மரபுத்தொடர் அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
