revisions:
- from: ஆனால் மக்கள் மௌனமாக இருந்து, அவனுக்கு ஒரு வார்த்தையும் பதிலளிக்கவில்லை[a]. ஏனெனில், “அவனுக்குப் பதிலளிக்காதீர்கள்” என்று அரசர் கட்டளையிட்டிருந்தார்.
  to: 'ஆனால் மக்கள் மௌனமாக இருந்தார்கள்; அவனுக்கு ஒரு வார்த்தையும் பதிலளிக்கவில்லை[a]. ஏனெனில் அரசரின் கட்டளை இதுவாக இருந்தது: “அவனுக்குப் பதிலளிக்காதீர்கள்.”'
  rationale: The revision retains the draft’s accurate wording while rendering the Hebrew nominal clause about the king’s command more directly. It also makes the first clause idiomatic Tamil without altering the meaning or the explanatory footnote.
