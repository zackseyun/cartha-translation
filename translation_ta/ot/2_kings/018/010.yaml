  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: ta
  text: மூன்று ஆண்டுகளின் முடிவில் அவர்கள் அதைக் கைப்பற்றினார்கள்.[a] எசேக்கியாவின் ஆட்சியின் ஆறாம் ஆண்டில்—அதாவது இஸ்ரவேலின் அரசன் ஓசேயாவின் ஆட்சியின் ஒன்பதாம் ஆண்டில்—சமாரியா கைப்பற்றப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்று ஆண்டுகளுக்குப் பிறகு.” எபிரெய மரபுத்தொடர் இன்னும் நேரடியாக, “மூன்று ஆண்டுகளின் முடிவில்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: அவர்கள் அதைப் பிடித்தார்கள்
  rationale: לכד என்பதன் Qal வடிவம் பன்மை எழுவாயையும் பெண்பால் ஒருமை பின்னொட்டையும் கொண்டுள்ளது; முந்தைய சூழலில் உள்ள சமாரியாவையே ‘அது’ குறிக்கிறது. எபிரெய செயல்வினை அமைப்பு காக்கப்பட்டது.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகளின் முடிவில்
  rationale: கால அளவுடன் வரும் מקצה என்ற மரபுத்தொடர் ‘அந்தக் காலத்தின் முடிவில்’ எனப் பொருள்படும்; அதன் துல்லியம் தமிழிலும் காக்கப்படுகிறது.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: எசேக்கியாவின் ஆட்சியின் ஆறாம் ஆண்டில்
  rationale: இது அரசாட்சி ஆண்டைக் குறிக்கும் வழக்கமான காலக்குறிப்பு. தமிழில் குழப்பமின்றி இருக்க ‘ஆட்சியின்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: הִיא
  choice: அதாவது
  rationale: இந்தச் சுட்டுப்பெயர் இரு அரசாட்சி ஆண்டுக் கணக்குகளையும் ஒரே காலமாக இணைக்கிறது; ‘அதாவது’ அதன் விளக்கவுரைச் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன் ஓசேயாவின் ஆட்சியின் ஒன்பதாம் ஆண்டில்
  rationale: இரண்டாவது அரசாட்சி ஆண்டுக் காலஒத்திசைவு முழுமையாகக் காக்கப்பட்டுள்ளது; ‘இஸ்ரவேலின் அரசன்’ என்ற அடையாளமும் விடப்படவில்லை.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: சமாரியா பிடிக்கப்பட்டது
  rationale: Niphal நிறைவுவினையின் செயப்பாட்டு/விளைவு தன்மை செயப்பாட்டு வாக்கியமாகக் காக்கப்படுகிறது. முதல் வாக்கியத்திலுள்ள לכד வேருடன் ஒற்றுமையாக ‘பிடி’ மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: நகரத்தின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
