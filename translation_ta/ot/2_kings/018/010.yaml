- from: மூன்று ஆண்டுகளின் முடிவில் அவர்கள் அதைப் பிடித்தார்கள். எசேக்கியாவின் ஆட்சியின் ஆறாம் ஆண்டில்—அதாவது இஸ்ரவேலின் அரசன் ஓசேயாவின் ஆட்சியின் ஒன்பதாம் ஆண்டில்—சமாரியா பிடிக்கப்பட்டது.
