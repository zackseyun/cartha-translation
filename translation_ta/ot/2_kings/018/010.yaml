translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் முதற்கூற்றிலுள்ள செயல்வினையும் இறுதிக்கூற்றிலுள்ள செயப்பாட்டு வினையும், וכן பிடித்தல் என்ற வேர்ச்சொல்லின் மீளுரைப்பும் காக்கப்பட்டுள்ளன. ஆங்கிலக் குறிப்பில் காணப்படும் அடிக்குறிப்பு குறியீடு பொருந்தாத இடத்தில் இருந்ததால், மூல எபிரெயத்தில் உண்மையான மாற்றுப் பொருள் தேவையில்லாத நிலையில் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
