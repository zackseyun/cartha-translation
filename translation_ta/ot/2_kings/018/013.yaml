  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗ה עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: ta
  text: எசேக்கியா அரசனின் பதினான்காம் ஆண்டில், அசீரிய அரசன் சனகெரிப் யூதாவின் அரண்களால் வலுப்படுத்தப்பட்ட எல்லா நகரங்களுக்கும் எதிராகப் படையெடுத்து வந்து, அவற்றைக் கைப்பற்றினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: பதினான்காம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயத் தொடரை இயல்பான தமிழில் தருகிறது. தொடக்க וּ־வின் தொடர்ச்சிப் பொருள் சூழலில் உணரப்படுவதால் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: לַמֶּלֶךְ חִזְקִיָּה
  choice: எசேக்கியா அரசனுடைய
  rationale: அரசாட்சிக் கால ஆண்டைக் குறிப்பிடும் தொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: עָלָה ... עַל
  choice: எதிராகப் படையெடுத்து வந்து
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’; עַל உடன் வரும் இப்போர்ச் சூழலில் பகைவருக்கு எதிராக முன்னேறுவதைச் சுட்டுகிறது. தமிழில் ‘படையெடுத்து வந்து’ என்பது அந்த இராணுவப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סַנְחֵרִיב
  choice: சனகெரிப்
  rationale: எபிரெய வடிவத்திற்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க பெயரெழுத்தாக்கம்.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: அரசனின் பதவியையும் ஆட்சிப்பகுதியையும் குறிக்கும் எபிரெய இணைப்புத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: யூதாவிலிருந்த அரண்சூழ்ந்த நகரங்கள் அனைத்துக்கும் எதிராக
  rationale: הַבְּצֻרוֹת என்பது பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கிறது. ‘அரண்சூழ்ந்த நகரங்கள்’ தெளிவான இராணுவப் பொருளைத் தருகிறது.
- source_word: וַיִּתְפְּשֵׂם
  choice: அவற்றைக் கைப்பற்றினான்
  rationale: நகரங்களைப் போரில் தன் கட்டுப்பாட்டுக்குள் கொண்டுவருவதைச் சுட்டும் வினையையும், நகரங்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரையும் துல்லியமாகத் தருகிறது.
