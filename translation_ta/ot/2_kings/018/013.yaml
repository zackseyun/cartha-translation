revisions:
- from: எசேக்கியா அரசனுடைய பதினான்காம் ஆண்டில், அசீரிய அரசன் சனகெரிப் யூதாவிலிருந்த அரண்சூழ்ந்த நகரங்கள் அனைத்துக்கும் எதிராகப் படையெடுத்து வந்து, அவற்றைக் கைப்பற்றினான்.
  to: எசேக்கியா அரசனின் பதினான்காம் ஆண்டில், அசீரிய அரசன் சனகெரிப் யூதாவின் அரண்களால் வலுப்படுத்தப்பட்ட எல்லா நகரங்களுக்கும் எதிராகப் படையெடுத்து வந்து, அவற்றைக் கைப்பற்றினான்.
  rationale: The revision retains the draft’s faithful rendering of the historical and military sequence, while replacing an imprecise description of the cities with wording that directly reflects the Hebrew term for fortified cities. The genitive regnal expression has also been made more idiomatic in modern standard Tamil.
