translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் குறிப்புக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. எபிரெய போரியல் சொற்றொடரின் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது; தேவையற்ற விளக்கமோ சமயப் பிரிவுசார் சொல்லாட்சியோ சேர்க்கப்படவில்லை.
