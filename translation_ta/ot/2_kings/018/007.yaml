source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: ta
  text: யாவே அவனோடு இருந்தார்; அவன் மேற்கொண்ட எல்லாவற்றிலும்[a] வெற்றி பெற்றான். அவன் அசீரிய அரசனுக்கு எதிராகக் கிளர்ச்சி செய்து, அவனுக்குச் சேவை செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் சென்ற இடமெல்லாம்”; அல்லது, “அவன் செய்த எல்லாவற்றிலும் விவேகமாக நடந்துகொண்டான்.” எபிரேயச் சொற்றொடர் விவேகமாகச் செயல்படுதல், வெற்றியடைதல் ஆகிய இரு கருத்துகளையும் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரைப் பொதுவாக அறியப்பட்ட தமிழ் வடிவில் நேரடியாகக் கொடுக்கிறது.
- source_word: וְהָיָה ... עִמּוֹ
  choice: அவனோடு இருந்தார்
  rationale: தொடர்ந்த இறைப் பிரசன்னத்தையும் ஆதரவையும் குறிக்கும் எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: அவன் எதை மேற்கொண்டாலும்
  rationale: சொல்லளவில் ‘அவன் புறப்பட்டுச் சென்ற எல்லாவற்றிலும்’; இச்சூழலில் அவனுடைய செயல்கள் அல்லது படையெடுப்புகள் அனைத்தையும் விரிவாகக் குறிக்கிறது.
- source_word: יַשְׂכִּיל
  choice: வெற்றி பெற்றான்
  rationale: இந்த ஹிஃபில் வடிவம் விவேகமாகச் செயல்படுதல், வெற்றியடைதல் ஆகிய இரு கருத்துகளையும் கொண்டிருக்கலாம்; அரச வரலாற்றுச் சூழலில் விளைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּמְרֹד
  choice: கிளர்ச்சி செய்து
  rationale: பேரரசு அதிகாரத்திற்கு எதிரான அரசியல் கலகத்தைக் குறிக்கும் இயல்பான சொல்.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுக்கு எதிராக
  rationale: கிளர்ச்சியின் அரசியல் இலக்கைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: וְלֹא עֲבָדוֹ
  choice: அவனுக்குப் பணிசெய்யவில்லை
  rationale: ‘சேவித்தல்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது; சூழலில் இது சிற்றரசனாகக் கீழ்ப்படிந்து சேவை அல்லது கப்பம் செலுத்துவதை உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேய உரையில் உள்ள தனிப்பட்ட இறைத் திருப்பெயரை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே பேணுகிறது; ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிசெய்யவில்லை’ என்பது அரசியல் கீழ்ப்படிதல் அல்லது சிற்றரசுச் சேவை என்ற சூழற்பொருளையும் திறந்தவாறு வைத்திருக்கிறது.
