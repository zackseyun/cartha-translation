revisions:
- from: யெகோவா அவனோடு இருந்தார்; அவன் எதை மேற்கொண்டாலும்[a] வெற்றி பெற்றான். அவன் அசீரிய அரசனுக்கு எதிராகக் கிளர்ச்சி செய்து, அவனுக்குப் பணிசெய்யவில்லை.
  to: யாவே அவனோடு இருந்தார்; அவன் மேற்கொண்ட எல்லாவற்றிலும்[a] வெற்றி பெற்றான். அவன் அசீரிய அரசனுக்கு எதிராகக் கிளர்ச்சி செய்து, அவனுக்குச் சேவை செய்யவில்லை.
  rationale: ‘யெகோவா’ என்பதற்குப் பதிலாக, திட்டத்தின் யெகோவா/Yahweh தீர்மானத்துக்கு ஏற்ப ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது. வாக்கிய அமைப்பு நவீனத் தமிழில் இயல்பாகவும், எபிரேயத்தின் ‘அவன் மேற்கொண்ட எல்லாவற்றிலும்’ என்ற பரந்த பொருளைத் தக்கவைத்தும் மாற்றப்பட்டுள்ளது. அரசனுக்குச் சேவை செய்யாததன் அரசியல்-சிற்றரசு நுணுக்கம் முதன்மை உரையில் திறந்தவாறே விடப்பட்டுள்ளது.
