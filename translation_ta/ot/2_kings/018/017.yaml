  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: ta
  text: அப்போது அசீரிய அரசன் தர்த்தான், ரப்-சாரிஸ், ரப்-சாக்கே ஆகியோரை[a] பெரும் படையுடன்[b] லாகீசிலிருந்து எருசலேமில் இருந்த எசேக்கியா அரசனிடம் அனுப்பினான். அவர்கள் எருசலேமுக்கு ஏறிச் சென்று வந்தார்கள்; அவர்கள் ஏறிச் சென்று வந்து, துணி வெளுப்பவரின் வயலின் பெருவழியில் அமைந்திருந்த மேல் குளத்தின் நீர்க்கால்வாயருகே நின்றார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தர்த்தான்,’ ‘ரப்-சாரிஸ்,’ ‘ரப்-சாக்கே’ என்பவை தனிப்பட்ட பெயர்களாக அல்லாமல் அசீரிய அதிகாரிகளின் பதவிப் பெயர்களாக இருக்கலாம். அவை முறையே ‘தலைமைத் தளபதி,’ ‘தலைமை அரண்மனை அதிகாரி’ அல்லது ‘தலைமை அண்ணகன்,’ ‘தலைமைப் பானபாத்திரக்காரர்’ அல்லது வேறொரு உயரதிகாரி எனப் பொருள்படக்கூடும்.
    reason: cultural_note
  - marker: b
    text: 'வேறு விதமாக: ‘மிகப் பெரிய படைபலத்துடன்’ அல்லது ‘வலிமைமிக்க படையுடன்.’'
    reason: lexical_alternative
  - marker: c
    text: 'வேறு விதமாக: ‘சலவைக்காரரின் வயல்’; பாரம்பரியமாக: ‘துணி பதனிடுபவரின் வயல்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: தர்த்தான் / ரப்-சாரிஸ் / ரப்-சாக்கே
  rationale: இவை தனிப்பட்ட பெயர்களைவிட அசீரிய அரசுப் பதவிப் பெயர்களாக இருக்கக்கூடும். அவற்றின் துல்லியமான பணிகள் உறுதியற்றதால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּחֵיל כָּבֵד
  choice: பெரும் படையுடன்
  rationale: חַיִל இச்சூழலில் போர்ப்படையைக் குறிக்கிறது; כָּבֵד அதன் பெருமையையும் வலிமையையும் தீவிரப்படுத்துகிறது. இயல்பான நவீனத் தமிழில் ‘பெரும் படை’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ
  choice: ஏறிச் சென்று அங்கு வந்தார்கள்; பின்பு அவர்கள் ஏறிச் சென்று ... வந்து
  rationale: எருசலேமை நோக்கிச் செல்வதற்கான ‘ஏறுதல்’ என்ற மூலமொழிப் படிமத்தையும், எபிரெய உரையின் மீளுரைப்பையும் இயன்றவரை காக்கிறது.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: மேல் குளத்தின் நீர்க்கால்வாய்
  rationale: תְעָלָה என்பது நீர் செல்லும் கால்வாய் அல்லது வடிகாலையும், בְּרֵכָה என்பது குளம் அல்லது நீர்த்தேக்கத்தையும் குறிக்கிறது.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: துணி வெளுப்பவரின் வயலுக்குச் செல்லும் பெருவழி
  rationale: מְסִלָּה அமைக்கப்பட்ட பெருவழியைக் குறிக்கிறது; כּוֹבֵס துணிகளைத் துவைத்து அல்லது வெளுத்துத் தூய்மைப்படுத்தும் தொழிலாளியைக் குறிக்கிறது.
