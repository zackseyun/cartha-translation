translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. அசீரியப் பதவிகளின் நிச்சயமற்ற பொருள் ஒலிபெயர்ப்பாலும் அடிக்குறிப்பாலும் காக்கப்பட்டது; எபிரெய உரையிலுள்ள ‘ஏறிச் சென்று/வந்து’ என்ற மீளுரை முற்றிலும் நீக்கப்படாமல், தமிழில் வாசிக்கத்தக்க அளவுக்கு அமைக்கப்பட்டது.
