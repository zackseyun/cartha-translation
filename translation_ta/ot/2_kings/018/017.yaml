- from: அப்போது அசீரிய அரசன், தர்த்தான், ரப்-சாரிஸ், ரப்-சாக்கே ஆகியோரை[a] பெரும் படையுடன்[b] லாகீசிலிருந்து எருசலேமிலிருந்த எசேக்கியா அரசனிடம் அனுப்பினான். அவர்கள் எருசலேமுக்கு ஏறிச் சென்று அங்கு வந்தார்கள்; பின்பு அவர்கள் ஏறிச் சென்று, துணி வெளுப்பவரின் வயலுக்குச் செல்லும் பெருவழியருகே இருந்த மேல் குளத்தின் நீர்க்கால்வாய்க்குப் பக்கத்தில்[c] வந்து நின்றார்கள்.
  to: அப்போது அசீரிய அரசன் தர்த்தான், ரப்-சாரிஸ், ரப்-சாக்கே ஆகியோரை[a] பெரும் படையுடன்[b] லாகீசிலிருந்து எருசலேமில் இருந்த எசேக்கியா அரசனிடம் அனுப்பினான். அவர்கள் எருசலேமுக்கு ஏறிச் சென்று வந்தார்கள்; அவர்கள் ஏறிச் சென்று வந்து, துணி வெளுப்பவரின் வயலின் பெருவழியில் அமைந்திருந்த மேல் குளத்தின் நீர்க்கால்வாயருகே நின்றார்கள்[c].
  rationale: ரப்-சாரிஸ் பதவிக்கான அடிக்குறிப்பில் இருந்த தவறான நவீன பாலின அடையாளச் சொல்லை நீக்கி, மூலச்சொல்லின் வரலாற்று மற்றும் சொற்பொருள் இருமுகத் தெளிவின்மையை ‘அரண்மனை அதிகாரி’ / ‘அண்ணகன்’ என்று காக்கப்பட்டது. அடிக்குறிப்பு c உரிய சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டது. பெருவழி-வயல் உறவு மூலத்துக்கு நெருக்கமாக மாற்றப்பட்டது; மற்ற எல்லா பொருளியல் கூறுகளும் பாதுகாக்கப்பட்டுள்ளன.
