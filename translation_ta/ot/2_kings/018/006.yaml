base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர் யாவேயை உறுதியாகப் பற்றிக்கொண்டார்[a]; அவரைப் பின்பற்றுவதிலிருந்து விலகவில்லை. யாவே மோசேக்குக் கட்டளையிட்ட கட்டளைகளைக் கடைப்பிடித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல்லை ‘ஒட்டிக்கொண்டார்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது உறுதியான உடன்படிக்கைப் பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: உறுதியாகப் பற்றிக்கொண்டார்
  rationale: דבק என்பது வெறும் உடல்சார்ந்த ஒட்டிக்கொள்ளுதலை மட்டுமல்லாமல், யாவேயிடம் உறுதியான பற்றும் உடன்படிக்கை விசுவாசமும் கொண்டிருப்பதைக் குறிக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேயை
  rationale: בְּ முன்னொட்டு இங்கு பற்றுதல் செலுத்தப்படும் நபரைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: அவரைப் பின்பற்றுவதைவிட்டு விலகவில்லை
  rationale: סור מן + אחר என்ற அமைப்பு ஒருவரைப் பின்பற்றுவதிலிருந்தும் அவருக்கான விசுவாசத்திலிருந்தும் விலகுவதைக் குறிக்கிறது; தமிழ் சொற்றொடர் அந்த இயக்கத்தையும் பற்றுறுதியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁמֹר
  choice: கடைப்பிடித்தார்
  rationale: שׁמר என்பது கட்டளைகளுடன் வரும்போது அவற்றைக் கவனமாகப் பின்பற்றி நடப்பதைக் குறிக்கிறது; ‘கடைப்பிடித்தார்’ என்பது நவீனத் தமிழில் இயல்பான சட்ட-உடன்படிக்கைச் சொல்.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகளை
  rationale: מִצְוֹת என்பது அதிகாரபூர்வமான இறைக் கட்டளைகளைக் குறிக்கிறது; உடைமைப் பின்னொட்டு யாவேயைக் சுட்டுவதால் ‘அவருடைய’ எனப் பெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்ட
  rationale: இந்த உறவுச்சொற்றொடர், எசேக்கியா கடைப்பிடித்த கட்டளைகள் யாவே மோசேக்குக் கொடுத்தவையே என்று அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ‘யாவே’ என்ற தமிழ் ஒலிபெயர்ப்பில் வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: דבק என்பதிலுள்ள உடன்படிக்கைப் பற்றுறுதி
  choice: உறுதியாகப் பற்றிக்கொண்டார்
  alternative: ஒட்டிக்கொண்டார்; இணைந்திருந்தார்
  rationale: இவ்வினை உடல்சார்ந்த ஒட்டுதலாகவும் பொருள்படலாம்; ஆனால் இச்சூழலில் எசேக்கியா யாவேயைப் பின்பற்றி அவர் கட்டளைகளைக் கடைப்பிடித்ததுடன் இணைந்து வருவதால், உறுதியான பற்றுறுதியை வெளிப்படுத்தும் மொழி பொருத்தமானது. அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மூன்று தொடர்ச்சியான செயல்கள்—பற்றிக்கொள்ளுதல், விலகாமை, கட்டளைகளைக் கடைப்பிடித்தல்—தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
