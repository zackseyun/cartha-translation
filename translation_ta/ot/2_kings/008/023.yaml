base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோராமின்[b] மற்ற செயல்களும், அவன் செய்த அனைத்தும் யூதா அரசர்களின் நாள்குறிப்பு நூலில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதா அரசர்களின் வரலாற்றுப் பதிவேட்டில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் யோராம்; மரபாக யெகோராம் என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்களும்
  rationale: יֶתֶר என்பது ‘மீதியானவை/மற்றவை’ என்றும், דִּבְרֵי என்பது இந்த அரசாட்சிச் சுருக்கச் சூத்திரத்தில் அரசனின் செயல்கள் அல்லது ஆட்சிநிகழ்வுகள் என்றும் பொருள்படும். ‘மற்ற செயல்களும்’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: יוֹרָם
  choice: யோராம்
  rationale: எபிரெயப் பெயரான יוֹרָם என்பதன் ஒலிக்கு நேரடியாகப் பொருந்தும் தமிழெழுத்துப்பெயர்ப்பு.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: மூலத்தின் தொடர்புவாக்கிய அமைப்பையும் ‘அனைத்தும்’ என்ற முழுமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழில் இயல்பான வினாவாகப் பாதுகாக்கிறது; பன்மை எழுவாய்க்கும் பொருந்துகிறது.
- source_word: עַל סֵפֶר
  choice: நூலில்
  rationale: சொல்லுக்கு சொல் ‘நூல்/சுருளின்மேல்’ என இருந்தாலும், ஒரு பதிவில் உள்ள தகவலைக் குறிப்பிட நவீன தமிழில் ‘நூலில்’ என்பதே இயல்பானது.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாள்குறிப்பு நூல்
  rationale: இது யூதா அரசர்களைப் பற்றிய அதிகாரப்பூர்வ அரசவைப் பதிவைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘நாள்குறிப்பு நூல்’ என்பது பதிவின் தன்மையைத் தெளிவாகக் காட்டுவதோடு, வேதாகமத்தின் வேறொரு நூலைத் தவறாக அடையாளப்படுத்துவதையும் தவிர்க்கிறது.
