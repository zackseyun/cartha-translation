translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. மூலத்தில் உள்ள அரசாட்சிச் சுருக்கச் சூத்திரமும் உடன்பாடான பதிலை எதிர்பார்க்கும் வினாவும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
