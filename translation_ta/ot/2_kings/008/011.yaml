  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: ta
  text: அவர் தம் முகத்தை நிலையாக வைத்துக்கொண்டு, வெட்கம் ஏற்படும்வரை நோக்கிக்கொண்டிருந்தார்[a]; தேவனுடைய மனிதர் அழுதார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஹசாயேல் வெட்கமடையும்வரை.” வெட்கமடைந்தவர் யார் என்பதை எபிரெய உரை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: அவர் தம் முகத்தை அசையாமல் வைத்து
  rationale: எபிரெய மொழியில் ‘தமது முகத்தை நிலைநிறுத்தினார்’ என்ற உருவகம் உள்ளது. தமிழில் இயல்பாகவும் அந்த உடல் சார்ந்த உருவகத்தைத் தக்கவைக்கவும் ‘முகத்தை அசையாமல் வைத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּשֶׂם
  choice: உற்றுப் பார்த்தார்
  rationale: முந்தைய வினையுடன் இணைந்து, முகத்தைத் திருப்பாமல் தொடர்ந்து நோக்குவதை இச்சூழலில் குறிக்கிறது. சொற்சொல்லான ‘வைத்தார்’ என்பதை மீண்டும் கூறுவதைவிட ‘உற்றுப் பார்த்தார்’ இயல்பான தமிழைத் தருகிறது.
- source_word: עַד־בֹּשׁ
  choice: வெட்கம் உண்டாகும்வரை
  rationale: בוש என்பது வெட்கம் அல்லது சங்கடத்தை உணர்வதைக் குறிக்கிறது. யார் வெட்கமடைந்தார் என்பதைத் தமிழில் தீர்மானித்துவிடாமல் இருக்க ஆளற்ற வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיֵּבְךְּ
  choice: அழுதார்
  rationale: בכה என்பதன் நேரான பொருள் ‘அழுதல்’; இங்கு மரியாதை ஒருமை வடிவம் இயல்பானது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: தீர்க்கதரிசியான எலிசாவுக்குப் பயன்படுத்தப்படும் மூலமொழித் தலைப்பை ‘தீர்க்கதரிசி’ என்று விளக்கிப் பெயர்க்காமல் அப்படியே தக்கவைக்கிறது.
theological_decisions:
- issue: עַד־בֹּשׁ என்பதில் வெட்கமடைந்தவரின் அடையாளம்
  choice: ‘வெட்கம் உண்டாகும்வரை’ என்று எழுவாயை வெளிப்படையாகக் குறிப்பிடாமல் மொழிபெயர்த்தல்
  alternative: ‘அசகேல் வெட்கமடையும்வரை’ அல்லது ‘அவர் வெட்கமடையும்வரை’
  rationale: எபிரெய உரை வெட்கமடைந்தவர் எலிசாவா அசகேலா என்பதை முற்றிலும் வெளிப்படையாக்கவில்லை. ஆகவே பிரதான உரை அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது; சாத்தியமான அசகேல் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. எலிசாவைக் குறிக்கும் வினைகளில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான செயற்பாட்டை தமிழில் இயல்பாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
