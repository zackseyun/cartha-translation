  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: ta
  text: 'எலிசா, தன் மகனை உயிர்ப்பித்த பெண்ணிடம் முன்பே இவ்வாறு சொல்லியிருந்தார்: “எழுந்து, நீயும் உன் வீட்டாரும் புறப்பட்டுப்போய், எங்கே தங்க முடியுமோ அங்கே தற்காலிகமாகக் குடியிரு[a]. ஏனெனில், யாவே பஞ்சத்தை வரவழைத்திருக்கிறார்; அது நாட்டின்மேல் வந்து ஏழு ஆண்டுகள் நீடிக்கும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தற்காலிகமாகக் குடியிரு” என்பதற்கான எபிரெய வினைச்சொல், ஒருவர் தமது சொந்த இடத்திற்கு வெளியே அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע דִּבֶּר
  choice: எலிசா ... முன்பே ... சொல்லியிருந்தார்
  rationale: முற்றுவினையான דִּבֶּר, சுற்றியுள்ள நிகழ்வுகளுக்கு முந்திய உரையைச் சுட்டுவதால், தமிழில் இயல்பான இறந்தகால முன்னிலை வடிவம் பயன்படுத்தப்பட்டது. தொடக்க ו தனியாக ‘இப்போது’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: தான் உயிரோடு எழுப்பிய மகனின் தாய்
  rationale: הֶחֱיָה என்பதன் காரணவினைப் பொருளான உயிரை மீட்டளித்தலைத் தெளிவாகக் காட்டுகிறது; பெண்ணை அவளுடைய மகன் வழியாக அடையாளப்படுத்தும் எபிரெய உறவும் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: קוּמִי וּלְכִי אַתְּ וּבֵיתֵךְ
  choice: நீ உன் வீட்டாரோடு புறப்பட்டுப்போய்
  rationale: பெண் ஒருவரை நோக்கிய ஒருமை கட்டளையையும், அவளுடன் செல்லும் குடும்பத்தார்/வீட்டாரையும் தெளிவாகக் காக்கிறது. ‘எழுந்து போ’ என்பதைக் காட்டிலும் ‘புறப்பட்டுப்போ’ இச்சூழலில் இயல்பான தமிழ்.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: எங்கே தங்க முடியுமோ அங்கே தற்காலிகமாகக் குடியிரு
  rationale: גור என்பது வெறுமனே தங்குவதை மட்டுமல்லாமல், சொந்த இடத்திற்கு வெளியே தற்காலிகமாக வசிப்பதையும் குறிக்கலாம். முதன்மை உரை இயல்பாகவும் அந்த நுணுக்கம் தெளிவாகவும் அமைக்கப்பட்டது.
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: ஏனெனில், யாவே பஞ்சத்தை வரவழைத்திருக்கிறார்
  rationale: קרא ל־ என்பதிலுள்ள ‘அழைத்தல்/வருமாறு கட்டளையிடுதல்’ என்ற உருவகத்தை தமிழில் புரியத்தக்க ‘வரவழைத்திருக்கிறார்’ என வழங்குகிறது; יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: அது நாட்டின்மேல் வந்து ஏழு ஆண்டுகள் நீடிக்கும்
  rationale: பஞ்சம் நாட்டை அடைந்து ஏழு ஆண்டுகள் நிலைக்கும் என்ற காலவிரிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய முற்றுவினையின் உறுதிப்பாட்டை எதிர்வரும் நிகழ்வாகச் சூழலுக்கு ஏற்ப அளிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்து இறைபெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: பஞ்சத்தின் மீது கடவுளுடைய செயற்பாடு
  choice: பஞ்சத்தை வரவழைத்திருக்கிறார்
  alternative: பஞ்சத்தை அறிவித்திருக்கிறார்
  rationale: קרא לָרָעָב என்பதிலுள்ள செயற்பாட்டையும் உருவகத்தையும் காக்கிறது; வெறும் அறிவிப்பாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான மொழிநடை. பெண்ணை நோக்கிய எபிரெய ஒருமைக் கட்டளைகள் தமிழிலும் ஒருமையாக வைக்கப்பட்டுள்ளன; தேவையற்ற மரியாதைப் பன்மை தவிர்க்கப்பட்டுள்ளது.
