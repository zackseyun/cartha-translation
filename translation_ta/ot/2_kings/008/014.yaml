base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: ta
  text: அவன் எலிசாவிடமிருந்து புறப்பட்டுத் தன் எஜமானிடம் வந்தான். அவன் எஜமான் அவனிடம், “எலிசா உன்னிடம் என்ன சொன்னார்?” என்று கேட்டான். அதற்கு அவன், “நீர் நிச்சயமாகக் குணமடைவீர்[a] என்று அவர் என்னிடம் சொன்னார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் நிச்சயமாக உயிர்வாழ்வீர்.” எபிரெய மொழியில் வலியுறுத்துவதற்காக ஒரே வினைச்சொல் திரும்பக் கூறப்படுகிறது; சொல்லுக்குச் சொல், “வாழ்ந்து, வாழ்வீர்.” இச்சூழலில் இது நோயிலிருந்து குணமடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: அவன் எலிசாவிடமிருந்து புறப்பட்டு
  rationale: הלך உடன் מן/מֵאֵת பிரிவையும் நகர்வையும் குறிக்கிறது; நவீன தமிழில் ‘புறப்பட்டு’ என்பது எலிசாவின் முன்னிலையிலிருந்து சென்றதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: தன் எஜமானிடம் வந்தான்
  rationale: בוא אֶל என்பதற்கு ‘வந்தான்’ இயல்பான இணை. אֲדֹנָיו இங்கு ஆசகேலின் மனித மேலதிகாரியான பெனாதாத்தைக் குறிக்கிறது; தெய்வீகப் பட்டம் அல்ல.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: எலிசா உன்னிடம் என்ன சொன்னார்?
  rationale: எபிரெயக் கேள்வியின் பொருளையும் நேரடியான உரையையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: אָמַר לִי
  choice: அவர் என்னிடம் சொன்னார்
  rationale: மூலத்தின் ‘என்னிடம் சொன்னார்’ என்ற நேரடி அமைப்பைப் பேணுகிறது; எலிசாவைக் குறிக்கும் மரியாதைப் பன்மை நவீன தமிழுக்கு இயல்பானது.
- source_word: חָיֹה תִחְיֶה
  choice: நீர் நிச்சயமாகக் குணமடைவீர்
  rationale: வினையின் absolute infinitive + imperfect அமைப்பு வலியுறுத்தலைக் காட்டுவதால் ‘நிச்சயமாக’ பயன்படுத்தப்பட்டுள்ளது. நோயின் சூழலில் חיה என்பது உயிரோடிருப்பதை மட்டுமல்ல, நோயிலிருந்து மீள்வதையும் குறிக்கிறது; அதனால் ‘குணமடைவீர்’ வாசகருக்கு இயல்பாகப் பொருளைத் தருகிறது.
theological_decisions:
- issue: אֲדֹנָיו என்பதன் மனித ஆட்சியாளர் சார்ந்த பொருள்
  choice: தன் எஜமான்
  alternative: தன் ஆண்டவன்
  rationale: இங்கு சொல் ஆசகேலின் மனித மேலதிகாரியைக் குறிக்கிறது. ‘ஆண்டவன்’ தெய்வீகப் பட்டமாகப் புரிந்துகொள்ளப்படக்கூடும்; ‘எஜமான்’ அரண்மனைச் சார்ந்த கீழ்-மேல் உறவைத் தெளிவாகக் காட்டுகிறது.
- issue: חָיֹה תִחְיֶה என்பதிலுள்ள ‘வாழ்தல்’ மற்றும் ‘குணமடைதல்’ நுணுக்கம்
  choice: நீர் நிச்சயமாகக் குணமடைவீர்
  alternative: நீர் நிச்சயமாக உயிர்வாழ்வீர்
  rationale: நோயுற்ற அரசனைப் பற்றிய உடனடி சூழல் ‘குணமடைதல்’ என்ற பொருளை ஆதரிக்கிறது. இருப்பினும் மூலத்தின் நேரடியான ‘வாழ்வீர்’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; வாக்கியத்தின் பின்னணியிலுள்ள பதற்றத்தை மேலதிக விளக்கத்தால் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசன் தன் ஊழியனிடம் பேசுவதால் ‘நீர்’ என்றும், எலிசாவைப் பற்றி மரியாதையுடன் ‘அவர்’ என்றும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடரின் பின்னரே வைக்கப்பட்டுள்ளது.
