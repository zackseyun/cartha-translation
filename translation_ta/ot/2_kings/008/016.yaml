source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனாகிய ஆகாபின் மகன் யோராமின் ஆட்சியின் ஐந்தாம் ஆண்டில், யோசபாத் யூதாவின் அரசனாக இருந்தபோது[a], யோசபாத்தின் மகனாகிய யெகோராம்[b], யூதாவின் அரசன், ஆட்சி செய்யத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் சொற்சொல்லாக, “யூதாவின் அரசன் யோசபாத்தும்” என்று மொழிபெயர்க்கலாம். எபிரெயத் தொடர் சுருக்கமாக உள்ளது; சிலர் இதை இணை அரசாட்சியைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் இஸ்ரவேலின் அரசன் பெயர் “யோராம்” (יוֹרָם) என்றும், யோசபாத்தின் மகனாகிய யூதாவின் அரசன் பெயர் “யெகோராம்” (יְהוֹרָם) என்றும் வேறுபடுத்தப்பட்டுள்ளது; இரண்டும் நெருங்கிய தொடர்புடைய பெயர் வடிவங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: ஆட்சியின் ஐந்தாம் ஆண்டில்
  rationale: எபிரெய அரசாண்டுக் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; தொடக்க இணைப்புச் சொல் தமிழில் தனியே தேவைப்படாததால் விடப்பட்டுள்ளது.
- source_word: לְ/יוֹרָם בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய ஆகாபின் மகன் யோராமின்
  rationale: அரசாண்டு யோராமை அடிப்படையாகக் கொண்டு கணக்கிடப்படுவதையும், அவரது தந்தை மற்றும் அரசாட்சியையும் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யோசபாத் யூதாவின் அரசனாக இருந்தபோது
  rationale: வினையில்லாமல் சுருக்கமாக அமைந்த எபிரெயத் தொடரை காலச் சூழலாக இயல்பாகத் தருகிறது; இணை ஆட்சி இருந்ததாக முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: מָלַךְ
  choice: ஆட்சிசெய்யத் தொடங்கினார்
  rationale: அரச பதவியேற்பைக் குறிக்கும் அரசாண்டு அறிவிப்பின் பொருளைத் தெளிவாகக் காட்டுகிறது; முழு ஆட்சிக்காலத்தையும் பொதுவாகச் சொல்வதாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: יְהוֹרָם
  choice: யெகோராம்
  rationale: இங்கு வரும் யூதா அரசனின் பெயரான יְהוֹרָם என்பதை, முன்பு வரும் இஸ்ரவேல் அரசன் יוֹרָם என்பதற்கான ‘யோராம்’ என்பதிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யோசபாத்தின் மகனாகிய யெகோராம், யூதாவின் அரசன்
  rationale: தந்தைவழி அடையாளத்தையும் இறுதி அரச பட்டத்தையும் எபிரெய மூலத்திற்கேற்பத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோசபாத்தின் ஆட்சிக்கும் யெகோராமின் ஆட்சித் தொடக்கத்திற்கும் இடையிலான சுருக்கமான காலக்குறிப்பு
  choice: ‘யோசபாத் யூதாவின் அரசனாக இருந்தபோது’ என்று காலச் சூழலாக மொழிபெயர்த்து, இணை ஆட்சி என்ற முடிவை முதன்மை உரையில் சேர்க்காமல் விடுதல்
  alternative: ‘யூதாவின் அரசன் யோசபாத்தும்’ என்று சொற்சொல்லாகத் தருதல் அல்லது இணை ஆட்சியை வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரை இணை ஆட்சியை வெளிப்படையாகக் கூறவில்லை. ஆகவே காலவரிசைச் சிக்கலைத் தீர்த்துவிடாமல், உரையின் உண்மையான சுருக்கத்தையும் பதற்றத்தையும் அடிக்குறிப்புடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. அரசாண்டுக் குறிப்பின் தெளிவுக்காக ‘ஆட்சியின் ஐந்தாம் ஆண்டில்’ என்றும், பதவியேற்பின் பொருளுக்காக ‘ஆட்சிசெய்யத் தொடங்கினார்’ என்றும் தரப்பட்டுள்ளது. பெயர்களின் எபிரெய எழுத்துவடிவ வேறுபாடு தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
