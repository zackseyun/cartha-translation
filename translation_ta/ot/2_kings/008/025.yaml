  text: בִּ/שְׁנַת֙ שְׁתֵּים עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֥ם בֶּן אַחְאָ֖ב מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: ta
  text: ஆகாபின் மகனும் இஸ்ரவேலின் அரசனுமான யோராமின் பன்னிரண்டாம் ஆட்சியாண்டில்[a], யூதாவின் அரசன் யெகோராமின் மகன் அகசியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இஸ்ரவேலின் அரசனுக்கு எபிரெய மூலத்தில் ‘யோராம்’ என்றும், யூதாவின் அரசனுக்கு ‘யெகோராம்’ என்றும் பெயர் வடிவங்கள் உள்ளன; இவை ஒன்றோடொன்று தொடர்புடைய பெயர் வடிவங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: பன்னிரண்டாம் ஆட்சியாண்டில்
  rationale: எபிரெய ஆட்சிக்காலக் கணிப்பு மரபுத்தொடரை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; ‘ஆட்சி’ என்பது சூழலால் உள்ளடங்கிய பொருளை வெளிப்படையாக்குகிறது.
- source_word: לְ/יוֹרָם
  choice: யோராமின்
  rationale: ஆட்சியாண்டு யாருக்குரியது என்பதைக் குறிக்கும் לְ முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் உடைமை வடிவம்.
- source_word: בֶּן אַחְאָב
  choice: ஆகாபின் மகன்
  rationale: வழக்கமான தந்தை–மகன் உறவுத் தொடரை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: அரச பட்டத்தை நவீன, கண்ணியமான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: இந்த அரியணையேற்ற அறிவிப்பில் வினைச்சொல் ஆட்சியின் தொடக்கத்தைக் குறிக்கிறது; தொடர்ந்த ஆட்சியைக் குறிக்கும் ‘ஆட்சி செய்தான்’ என்பதைவிட இது துல்லியமானது.
- source_word: אֲחַזְיָהוּ
  choice: அகசியா
  rationale: தமிழ் வேதாகமப் பெயர்ப்பு மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: בֶן יְהוֹרָם
  choice: யெகோராமின் மகன்
  rationale: יְהוֹרָם என்ற முழுப் பெயர் வடிவத்தை யோராம் என்பதிலிருந்து வேறுபடுத்திக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அரச பட்டத்தை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
