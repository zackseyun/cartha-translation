translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்று அரச அறிவிப்புக்கு ஏற்ற கண்ணியமான, தெளிவான நடை. ‘பன்னிரண்டாம் ஆட்சியாண்டில்’ என்பது எபிரெய மரபுத்தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் உள்ள யோராம்/யெகோராம் பெயர் வேறுபாடு உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
