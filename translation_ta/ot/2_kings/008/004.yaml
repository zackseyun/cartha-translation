lexical_decisions:
- source_word: מְדַבֵּר
  choice: பேசிக்கொண்டிருந்தான்
  rationale: எபிரெயப் பெயரெச்ச வடிவம் கதையின் பின்னணி நிகழ்வாகத் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுவதால், இறந்தகாலத் தொடர்நிலையாக மொழிபெயர்க்கப்பட்டது.
- source_word: גֵּחֲזִי
  choice: கேயாசி
  rationale: தனிப்பெயர் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டது.
- source_word: נַעַר
  choice: பணியாளன்
  rationale: இந்தச் சூழலில் இச்சொல் வயதைவிட, தேவனுடைய மனிதருடன் கேயாசிக்கிருந்த பணிசார்ந்த உறவைக் குறிக்கிறது; மூலச்சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: தீர்க்கதரிசியைக் குறிக்கும் வழக்கமான எபிரெயப் பட்டத்தை விளக்கமாக மாற்றாமல், அதன் தனித்துவமான வேதாகமச் சொல்லாட்சியுடன் பாதுகாக்கிறது.
- source_word: סַפְּרָה נָּא לִי
  choice: தயவுசெய்து எனக்குச் சொல்
  rationale: ספר என்பதன் ‘சொல்/விவரி’ என்ற கட்டளையையும், נָא தரும் பணிவான வேண்டுகோள் நயத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַגְּדֹלוֹת
  choice: மகத்தான காரியங்கள் அனைத்தையும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழி குறிப்பிடத்தக்க பெரிய செயல்கள் அல்லது காரியங்களை விரிவாகக் குறிக்கிறது; ‘காரியங்கள்’ அந்த விரிவைத் திறந்தவாறு வைக்கிறது.
- source_word: עָשָׂה
