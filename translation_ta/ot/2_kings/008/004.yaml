translation:
  language: ta
  text: அரசன் தேவனுடைய மனிதரின் பணியாளனான கேயாசியிடம், “எலிசா செய்த மகத்தான காரியங்கள் அனைத்தையும் தயவுசெய்து எனக்குச் சொல்” என்று பேசிக்கொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவனுடைய மனிதரின் உதவியாளர்’ அல்லது ‘தேவனுடைய மனிதரின் இளைஞன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נַעַר சூழலுக்கேற்ப பணியாளன், உதவியாளர் அல்லது இளைஞன் எனப் பொருள்படும்.
