- source_word: וְהַמֶּלֶךְ
  choice: அரசன்
  rationale: வாவ் கதைத் தொடர்ச்சியை இணைக்கிறது; தமிழில் தேவையற்ற ‘இப்போது’ அல்லது இயல்பற்ற தொடக்க ‘மற்றும்’ சேர்க்காமல் வாக்கியத் தொடர்ச்சியால் அதன் பணி வெளிப்படுகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: தேவனுடைய மனிதர்
  alternative: தேவனுடைய தீர்க்கதரிசி
  rationale: ‘தீர்க்கதரிசி’ என்பது சூழலுக்கு ஏற்ப உண்மையான விளக்கமாக இருந்தாலும், மூலத்தில் உள்ள தனிப்பட்ட பட்டத்தைவிட குறிப்பானது. ஆகவே மூலத்தின் சொல்லாட்சியும் அதன் திறந்த நயமும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய மனிதர்’ என்ற வேதாகமப் பட்டம் பாதுகாக்கப்பட்டாலும், மற்ற சொற்றொடர்கள் பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் வகையில் அமைக்கப்பட்டுள்ளன.
