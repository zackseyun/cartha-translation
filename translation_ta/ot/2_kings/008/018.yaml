source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: ta
  text: அவன் இஸ்ரவேல் அரசர்களின் வழியில் நடந்தான்; ஆகாபின் வம்சத்தார்[a] செய்ததுபோலவே செய்தான். ஏனெனில், ஆகாபின் மகள் அவனுக்கு மனைவியாக இருந்தாள். அவன் யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வம்சத்தார்” என்பது எபிரெயத்தில் நேரடியாக “ஆகாபின் வீடு” என உள்ளது; இங்கு அது ஆகாபின் அரச குடும்பத்தையும் வம்சத்தையும் குறிக்கிறது.
    reason: அரசச் சூழலில் בֵּית என்ற சொல்லின் உருவகப் பொருளை விளக்கி, மூல உருவத்தையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்தான்
  rationale: ஒருவரின் வாழ்க்கை முறை அல்லது நடத்தையைப் பின்பற்றுவதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்கள்
  rationale: வடக்கு அரசின் ஆட்சியாளர்களைக் குறிக்கும் நேரடியான மரபுத்தொடர்.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் வம்சத்தார்
  rationale: அரச குடும்பச் சூழலில் בַּיִת என்பது ஆகாபின் அரச வம்சத்தையும் குடும்பத்தாரையும் குறிக்கிறது; ‘வம்சத்தார்’ நவீன தமிழில் இந்தக் கருத்தைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நடத்தைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக உள்ளது.
- source_word: בַּת אַחְאָב
  choice: ஆகாபின் மகள்
  rationale: எபிரெய மூலத்தின் உறவுமுறைக் குறிப்பை விளக்கமோ சமரசமோ செய்யாமல் நேரடியாகத் தருகிறது.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: அவனுக்கு மனைவியாக இருந்தாள்
  rationale: ‘அவனுக்கு மனைவியாக இருந்தாள்’ என்ற எபிரெய அமைப்பின் பொருளையும் அப்போதைய திருமண நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: רַע என்பதற்கு முன் உள்ள குறிப்புச் சுட்டை பிரதிபலித்து, வழக்கமான அரசர் மதிப்பீட்டு வாய்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: இறைவனின் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்து, יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், வழக்கமான நவீன ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- issue: ஆகாபின் மகள் என்ற உறவுமுறைக் குறிப்பு
  choice: ஆகாபின் மகள்
  alternative: ஆகாபின் பேத்தி அல்லது ஆகாபின் சந்ததியைச் சேர்ந்த பெண்
  rationale: பிற வம்சவரலாற்றுச் சான்றுகளுடன் ஒத்திசைக்க முயலாமல், இவ்வசனத்தின் வெளிப்படையான எபிரெய வாசகத்தை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழியில் நடந்தான்’ மற்றும் ‘பார்வையில்’ ஆகியவை எபிரெய உருவகங்களைத் தக்கவைக்கின்றன; அளவுக்கு மீறிய விளக்கவுரை முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
