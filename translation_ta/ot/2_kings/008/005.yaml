translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்பெறச் செய்தான்’ மூல எபிரெய காரணவினையைத் தக்கவைக்கிறது; ‘முறையிட்டுக்கொண்டிருந்தாள்’ அவளுடைய நீதிக்கான அவசர வேண்டுகோளை இயல்பாகத் தெரிவிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
