  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: ta
  text: கேயாசி, எலிசா இறந்தவரை எப்படி உயிர்பெறச் செய்தார்[a] என்பதை அரசனிடம் விவரித்துக்கொண்டிருந்தபோது, இதோ[b], எலிசா அவளுடைய மகனை உயிர்பெறச் செய்த அந்தப் பெண் தன் வீட்டையும் வயலையும் குறித்து அரசனிடம் முறையிட்டுக்கொண்டிருந்தாள். கேயாசி, “என் ஆண்டவராகிய அரசரே, இவள்தான் அந்தப் பெண்; இவன்தான் எலிசா உயிர்பெறச் செய்த அவளுடைய மகன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்பெறச் செய்தார்” என்பதற்கு “மீண்டும் உயிரோடு எழச் செய்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘வாழ்’ என்ற வினையின் காரணவினை வடிவம் (החיה) பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “இதோ” என்பது அந்தப் பெண் சரியாக அந்நேரத்தில் வந்த வியப்பூட்டும் தற்செயல் நிகழ்வை வலியுறுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: அவன் ... அரசனிடம் விவரித்துக்கொண்டிருந்தபோது
  rationale: מְסַפֵּר என்பது தொடர்ந்து நடைபெற்றுக்கொண்டிருந்த செயலைக் குறிக்கிறது; וַיְהִי அமைக்கும் காலச் சூழலை இயல்பான நவீன தமிழில் ‘...கொண்டிருந்தபோது’ வெளிப்படுத்துகிறது. முந்தைய சூழலிலிருந்து ‘அவன்’ என்பது கேயாசியைக் குறிக்கிறது என்பதால் பெயர் தெளிவுக்காகச் சேர்க்கப்பட்டது.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: இறந்தவரை எப்படி உயிர்பெறச் செய்தான்
  rationale: הֶחֱיָה என்பது ‘வாழச் செய்/உயிர்பெறச் செய்’ என்ற காரணவினை. הַמֵּת ஒருமை வடிவை ‘இறந்தவர்’ என்று காத்து, אֲשֶׁר என்பதன் இச்சூழல் பொருளை ‘எப்படி’ என வழங்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீரென நிகழும் வியப்பூட்டும் சந்திப்பை வாசகரின் கவனத்திற்குக் கொண்டுவருகிறது; ‘இதோ’ அதன் உரையாடல்-நடை விளைவைத் தக்கவைக்கிறது.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: அவன் மகனை உயிர்பெறச் செய்திருந்த அந்தப் பெண்
  rationale: எபிரெய மொழியின் தொடர்பு அமைப்பை தமிழில் இயல்பான அடைமொழித் தொடராக மாற்றி, காரணவினையின் பொருளைக் காக்கிறது.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: அரசனிடம் முறையிட்டுக்கொண்டிருந்தாள்
  rationale: צעק இங்கு உதவி அல்லது நீதி கேட்டு வலியுறுத்தும் விண்ணப்பத்தைக் குறிக்கிறது. சொற்பொருளான ‘கத்திக்கொண்டிருந்தாள்’ என்பதைக் காட்டிலும் அரசவையில் சொத்து மீட்புக்காகச் செய்யப்பட்ட அவசர முறையீட்டை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: தன் வீட்டையும் வயலையும் குறித்து
  rationale: עַל முறையீட்டின் பொருளை அறிமுகப்படுத்துகிறது; שָׂדֶה என்பதன் குறிப்பான பொருளான ‘வயல்’ பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: அரசராகிய என் ஆண்டவரே
  rationale: அரசருக்கு வழங்கப்படும் மரியாதையான நேரடி அழைப்பை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: இவள்தான் அந்தப் பெண்; இவன்தான் ... அவளுடைய மகன்
  rationale: முன்னிலையில் உள்ளவர்களைச் சுட்டி அடையாளப்படுத்தும் demonstrative வலிமையை ‘இவள்தான்/இவன்தான்’ காக்கிறது.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: எலிசா உயிர்பெறச் செய்த
  rationale: வசனத்தில் மீண்டும் வரும் அதே காரணவினைக்கு ஒரே தமிழ் சொற்றொடர் பயன்படுத்தப்பட்டு தொடர்ச்சியும் மூலத்தின் வலிமையும் காக்கப்படுகின்றன.
