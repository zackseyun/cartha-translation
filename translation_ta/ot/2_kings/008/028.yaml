base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: ta
  text: அவன் ஆகாபின் மகன் யோராமுடன் அராமின் அரசன் அசகேலுக்கு எதிராக ராமோத்-கீலேயாத்தில் போருக்குச் சென்றான். அராமியர்கள் யோராமைக் காயப்படுத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோராமைத் தாக்கினார்கள்.” எபிரெய வினைச்சொல் பொதுவாக ‘தாக்குதல்’ அல்லது ‘அடித்தல்’ என்பதைக் குறிக்கலாம்; போர்ச் சூழலும் இணை நிகழ்வுக் குறிப்பும் யோராம் காயமடைந்ததைக் காட்டுவதால், “காயப்படுத்தினார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவன் சென்றான்
  rationale: הלך என்பதன் எளிய கதைநடைப் பொருள் ‘சென்றான்’; இராணுவச் சூழலைத் தொடர்ந்து வரும் சொற்றொடர் தெளிவுபடுத்துகிறது.
- source_word: אֶת יוֹרָם
  choice: யோராமுடன்
  rationale: הלך என்பதற்குப் பின் אֵת உடன்செல்லுதலைக் குறிக்கிறது; இயல்பான தமிழில் ‘யோராமுடன்’ என வழங்கப்படுகிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்கு
  rationale: போரிடுவதற்காகச் செல்வதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: עִם חֲזָהאֵל
  choice: அசகேலுக்கு எதிராக
  rationale: போர் சார்ந்த சூழலில் עִם எதிர்த்து மோதுவதைக் குறிக்கலாம்; இங்கு அசகேல் எதிரி என்பது சூழலால் தெளிவு.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: எபிரெய ethnogeographic பெயரான ‘அராம்’ மூலமொழிக்கேற்ப தக்கவைக்கப்படுகிறது; ‘சீரியா’ என மாற்றப்படவில்லை.
- source_word: בְּרָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்தில்
  rationale: போரின் இடத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் குறிக்கிறது; இரண்டு இடப்பெயர்களின் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּכּוּ
  choice: காயப்படுத்தினார்கள்
  rationale: נכה பொதுவாக ‘அடி/தாக்கு’ எனப் பொருள்படலாம்; இப்போர்ச் சூழலும் தொடரும் நிகழ்வுகளும் உயிரிழப்பு அல்ல, காயம் ஏற்பட்டதைக் காட்டுகின்றன.
- source_word: אֲרַמִּים
  choice: அராமியர்கள்
  rationale: இது இனத்தைக் குறிக்கும் பன்மைப் பெயர்; ‘அராம்’ என்ற பெயருடன் ஒத்த மூலநெருக்கமான வடிவம்.
- source_word: אֶת יוֹרָם
  choice: யோராமை
  rationale: இரண்டாவது இடத்தில் אֵת நேரடி செயப்படுபொருளைக் குறிக்கிறது; יוֹרָם என்ற வடிவம் ‘யோராம்’ என ஒலிபெயர்க்கப்படுகிறது.
