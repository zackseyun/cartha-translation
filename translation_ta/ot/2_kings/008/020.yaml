  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: ta
  text: அவனுடைய நாட்களில், ஏதோமியர் யூதாவின் கைக்குக் கீழிருந்த அதிகாரத்திலிருந்து கிளர்ச்சி செய்து, தங்கள்மேல் ஆட்சி செய்ய ஒரு அரசனை ஏற்படுத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் கட்டுப்பாட்டிலிருந்து கிளர்ச்சி செய்தார்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “யூதாவின் கைக்குக் கீழிருந்து கிளர்ச்சி செய்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: அரசனுடைய ஆட்சிக்காலத்தைக் குறிக்கும் எபிரெய கால வழக்கை நெருக்கமாகவும் தமிழில் புரியத்தக்க வகையிலும் காக்கிறது.
- source_word: פָּשַׁע
  choice: கிளர்ச்சி செய்து
  rationale: இங்கு அறநெறி மீறலை அல்ல, யூதாவின் அரசியல் ஆதிக்கத்திலிருந்து ஏதோம் விலகியதைக் குறிக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: இடத்தையும் மக்களையும் குறிக்கும் பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: யூதாவின் கைக்குக் கீழிருந்து
  rationale: அரசியல் அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் மூலமொழியின் உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: ராஜ்யம் அல்லது கோத்திர அரசமைப்பைக் குறிக்கும் பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: தங்களுக்கென ஒரு அரசனை ஏற்படுத்திக்கொண்டார்கள்
  rationale: ஹிஃபில் வினை இங்கு ஒருவரை அரசனாக்குதல் அல்லது ஆட்சி செய்ய நிறுவுதல் எனப் பொருள்படும்; ஏதோமியர் தங்களுக்குச் சொந்த அரசனை நிறுவியதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “கைக்குக் கீழிருந்து” என்ற எபிரெய அரசியல் உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
