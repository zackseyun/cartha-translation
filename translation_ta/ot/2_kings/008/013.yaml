  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: ta
  text: அசகேல், “இந்த நாயான உமது அடியேன் எம்மாத்திரம்? இந்தப் பெரிய காரியத்தைச் செய்ய என்னால் எப்படி முடியும்?” என்றான். அதற்கு எலிசா, “நீ அராமின்மேல் அரசனாவாய்[a] என்று யாவே எனக்குக் காட்டியிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அராமின் அரசனாவாய்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல், “அராமின்மேல் அரசன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: எம்மாத்திரம்?
  rationale: அசகேலின் வியப்பும் மறுப்புணர்வும் கலந்த கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் உள்ள எதிர்மறை உரையாடல் வலிமையையும் தக்கவைக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேன்
  rationale: அரண்மனைச் சூழலுக்குரிய தன்னடக்கமான சுயகுறிப்பை இயல்பாகக் காட்டுகிறது; சட்டரீதியான அடிமை நிலையைக் தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: הַכֶּלֶב
  choice: இந்த நாயான
  rationale: எபிரெயச் சொல்லின் இழிவான, தன்னைத் தாழ்த்தும் உருவகத்தைத் தக்கவைத்து, עַבְדְּךָ என்பதுடன் இயல்பான இணைப்பாக அமைகிறது.
- source_word: כִּי יַעֲשֶׂה
  choice: அவன் செய்வதற்கு?
  rationale: மூலத்தில் உள்ள மூன்றாம் நபர் சொல்லமைப்பையும், அத்தகைய செயலைத் தான் செய்வது எப்படி என்ற நம்பமுடியாமையையும் பாதுகாக்கிறது.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: இவ்வளவு பெரிய செயலை
  rationale: דָּבָר என்பதன் பரந்த பொருளில் இச்சூழலுக்கு ஏற்ற ‘செயல்’ என்பதைத் தேர்ந்தெடுத்து, גָּדוֹל என்பதன் அளவு அல்லது கொடுமை குறித்த உள்ளார்ந்த பதற்றத்தைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: הִרְאַנִי
  choice: எனக்குக் காட்டியிருக்கிறார்
  rationale: தீர்க்கதரிசன வெளிப்பாடு ஏற்கெனவே அளிக்கப்பட்டு அதன் விளைவு தற்போதும் பொருந்துகிறது என்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: அராமின்மேல் அரசனாவாய்
  rationale: עַל என்பதன் ‘மேல்’ என்ற நேரடிப் பொருளையும், אֲרָם என்ற எபிரெய இடப்பெயரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் இறைப்பட்டப் பெயரைக் காட்டிலும் நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ என்பது அந்தப் பெயரைத் தமிழில் ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: முன்னறிவிப்பு அரசாட்சியை எவ்வாறு விவரிக்கிறது
  choice: நீ அராமின்மேல் அரசனாவாய்
  alternative: நீ அராமின் அரசனாவாய்
  rationale: மூலத்தின் עַל (‘மேல்’) என்ற முன்னிடைச்சொல்லை முதன்மை உரையில் தக்கவைக்கிறது; இது தெய்வீக அங்கீகாரம் அல்லது நெறியியல் ஒப்புதல் என்று மேலதிகமாக விளக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரையாடலுக்குரிய கண்ணியமும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது அடியேன்’ என்பது பணிவான அரசவை மொழியைப் பேணுகிறது; மூலத்தின் மூன்றாம் நபர் வினையமைப்பு திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘அராமின்மேல் அரசனாவாய்’ என்ற சொற்றொடருக்குப் பின்பு வைக்கப்பட்டுள்ளது.
