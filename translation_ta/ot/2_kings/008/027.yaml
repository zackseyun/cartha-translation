base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: ta
  text: அவன் ஆகாபின் குடும்பத்தின் வழியில் நடந்து, ஆகாபின் குடும்பத்தைப் போல யாவேவின் பார்வையில் தீமையானதைச் செய்தான்; ஏனெனில் அவன் ஆகாபின் குடும்பத்தின் மருமகனாக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாபின் குடும்பத்துடன் திருமண உறவுடையவனாக இருந்தான்.” எபிரேயச் சொல் பரந்த பொருளில் திருமணத்தால் ஏற்பட்ட உறவைக் குறிக்கலாம்; ஆயினும் இச்சூழலில் “மருமகன்” என்பது மிகக் குறிப்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்து
  rationale: எபிரேய மொழியின் நடத்தையைக் குறிக்கும் உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பத்தார்
  rationale: בַּיִת இங்கு வெறும் கட்டடத்தை அல்ல, ஆகாபின் குடும்பம் அல்லது அரச வம்சத்தைச் சுட்டுகிறது; ‘குடும்பத்தார்’ அந்தக் கூட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: அரசர்கள் நூலின் வழக்கமான ஒழுக்க மதிப்பீட்டு வாய்பாட்டையும் எபிரேய கட்டமைப்பையும் தெளிவாகக் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற மூல உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகத் தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
- source_word: כְּבֵית אַחְאָב
  choice: ஆகாபின் குடும்பத்தாரைப் போலவே
  rationale: ஒப்புமையைக் காத்து, அவர்கள் செய்ததைப் போன்ற நடத்தையை இயல்பாக உணர்த்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய ஒழுக்க மதிப்பீட்டுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பத்தாருடன் திருமண உறவுடையவன்
  rationale: חֲתַן என்பது குறிப்பாக ‘மருமகன்’ என்றும், விரிவாக திருமணத்தால் உறவான ஆண் என்றும் அமையலாம்; இவ்வாக்கியம் மூலத்தின் பரந்த சாத்தியத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- issue: חֲתַן குறிக்கும் திருமண உறவின் துல்லியம்
  choice: திருமண உறவுடையவன்
  alternative: மருமகன்
  rationale: வரலாற்றுச் சூழலில் ‘மருமகன்’ பொருந்தினாலும், எபிரேயச் சொல் திருமணத்தால் ஏற்பட்ட உறவைச் சற்றுப் பரந்த வகையிலும் குறிக்கலாம்; ஆகவே பிரதான உரையில் அந்தத் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘வழியில் நடந்து’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; குடும்பம்/வம்சம் என்ற பொருளில் ‘ஆகாபின் குடும்பத்தார்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய திருமண உறவுச் சொல்லின் பின்னர் வைக்கப்பட்டுள்ளது.
