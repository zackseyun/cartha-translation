    rationale: וַתָּגָר has the woman as its singular subject. Her household is included as accompanying her in the departure clause, but the narrative predicate remains singular.
  - severity: low
    issue: The footnote's wording 'தற்காலிகமாக' may overstate a nuance not explicitly encoded by גור.
    rationale: גור denotes residence as an outsider/sojourner; duration or temporary status may be contextually compatible but should not be presented as the primary lexical alternative.
