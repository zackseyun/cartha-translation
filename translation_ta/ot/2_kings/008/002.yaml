- from: அப்போது அந்தப் பெண் எழுந்து, தேவனுடைய மனிதர் சொன்னபடியே செய்தாள். அவளும் அவளுடைய வீட்டாரும் சென்று, பெலிஸ்தியரின் நாட்டில் ஏழு ஆண்டுகள் அந்நியர்களாகக் குடியிருந்தார்கள்.[a]
  to: அப்போது அந்தப் பெண் எழுந்து, தேவனுடைய மனிதர் சொன்னபடியே செய்தாள். அவள் தன் வீட்டாருடன் புறப்பட்டுச் சென்று, பெலிஸ்தியரின் நாட்டில் ஏழு ஆண்டுகள் அந்நியராகக் குடியிருந்தாள்.[a]
