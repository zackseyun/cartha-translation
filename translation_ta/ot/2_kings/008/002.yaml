base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: ta
  text: அப்போது அந்தப் பெண் எழுந்து, தேவனுடைய மனிதர் சொன்னபடியே செய்தாள். அவள் தன் வீட்டாருடன் புறப்பட்டுச் சென்று, பெலிஸ்தியரின் நாட்டில் ஏழு ஆண்டுகள் அந்நியராகக் குடியிருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் நாட்டில் ஏழு ஆண்டுகள் அந்நியராகத் தங்கியிருந்தாள்.”
    reason: גור என்பதற்கான மாற்று இயல்பான தமிழ் வெளிப்பாட்டை வழங்குகிறது; அந்நியர்/சொந்த நாட்டவர் அல்லாதவர் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம், அந்தப் பெண் அறிவுறுத்தலுக்குப் பதிலளித்து செயல்படத் தொடங்கியதைச் சுட்டுகிறது; ‘எழுந்து’ என்பது எபிரெய நடையையும் இயல்பான தமிழ் தொடரையும் காக்கிறது.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: சொன்னபடியே செய்தாள்
  rationale: ஒருவர் கூறிய அறிவுறுத்தலின்படி நடப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: தெய்வீகப் பணிக்காக நியமிக்கப்பட்டவரைக் குறிக்கும் வேதாகமப் பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கிவிடாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: அவளும் அவளுடைய வீட்டாரும் சென்று
  rationale: בַּיִת இங்கு கட்டடத்தை அல்ல, அவளுடைய குடும்பத்தாரையும் வீட்டைச் சேர்ந்தவர்களையும் குறிக்கிறது; வெளிப்படையான இணைப்புச் சொல்லமைப்பையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַתָּגָר
  choice: அந்நியர்களாகக் குடியிருந்தார்கள்
  rationale: גור என்பது வெறுமனே வசிப்பதைவிட, சொந்த நாட்டினராக அல்லாமல் அந்நியக் குடியிருப்பாளர்களாக வாழ்வதைக் குறிக்கிறது; குழுவைக் குறிக்கும் தமிழ் எழுவாய்க்கேற்ப பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாட்டில்
  rationale: எபிரெய இன-புவியியல் சொற்றொடரைத் தெளிவாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: வசித்த காலத்தின் முழு நீளத்தை இயல்பான தமிழ் காலவளவுச் சொற்றொடராக வழங்குகிறது.
