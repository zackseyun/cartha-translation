  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: ta
  text: ஏதோம் யூதாவின் ஆட்சிக்கு எதிராகக் கிளர்ந்தது; அது இன்றுவரை தொடர்கிறது[a]. அந்தக் காலத்திலேயே லிப்னாவும் கிளர்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிளர்ந்தது’ என்பதற்கு ‘கலகம் செய்தது’ அல்லது ‘ஆட்சியிலிருந்து விலகியது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இங்கு நிலைநிறுத்தப்பட்ட ஆட்சிக்கு எதிரான அரசியல் கிளர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  choice: கிளர்ச்சி செய்து / கிளர்ச்சி செய்தது
  rationale: פשע என்பது இங்கு ஓர் ஆட்சிக்கு எதிரான அரசியல் கிளர்ச்சியைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே தமிழ் சொல்லைப் பயன்படுத்துவது மூலத்தின் சொல் ஒற்றுமையைப் பேணுகிறது.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: யூதாவின் ஆட்சிக்குக் கீழிருந்து
  rationale: எபிரெய மொழியின் ‘கைக்குக் கீழ்’ என்ற உருவகம் கீழ்ப்படிதல் அல்லது ஆட்சிக்குட்பட்டிருத்தலைக் குறிக்கிறது. நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘ஆட்சிக்குக் கீழிருந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: இந்த நிலை நூலாசிரியரின் காலம்வரை தொடர்ந்ததைச் சுட்டும் வழக்கமான காலக் குறிப்பு.
- source_word: אָז / בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: இரு காலக் குறிப்புகளையும் இயல்பான தமிழில் ஒருங்கிணைத்து, லிப்னாவின் கிளர்ச்சி அதே வரலாற்றுக் காலத்தில் நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִבְנָה
  choice: லிப்னா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
