  register: நவீன பொதுத்தமிழில், வரலாற்று விவரிப்புக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆட்சிக்குக் கீழிருந்து’ என்பது எபிரெய மரபுத்தொடரின் பொருளைப் பேணுகிறது; ‘பிரிந்திருக்கிறது’ என்பது அந்த நிலை இன்றுவரை தொடர்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
