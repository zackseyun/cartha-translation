base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: ta
  text: மறுநாள், அவன் அந்த மூடுதுணியை[a] எடுத்து, தண்ணீரில் தோய்த்து, அவருடைய முகத்தின்மேல் விரித்தான்; அவர் இறந்தார்.[b] பின்பு ஆசகேல் அவருக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படுக்கை விரிப்பு,” “போர்வை,” அல்லது “வலைபோல் நெய்யப்பட்ட துணி” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அரிதானது; அது துல்லியமாக எத்தகைய துணி என்பது உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: இச்செயல்களைச் செய்தவர் யார் என்பதை எபிரெய உரை பெயரால் குறிப்பிடவில்லை. சூழலின் அடிப்படையில் அவர் ஆசகேல் என்று பலர் புரிந்துகொள்கிறார்கள்; ஆனால் இறுதிப் பிரிவில்தான் ஆசகேலின் பெயர் வெளிப்படையாக வருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: முந்தைய நிகழ்வுக்கு அடுத்த நாளைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் காலச்சொல்.
- source_word: הַמַּכְבֵּר
  choice: அந்த மூடுதுணி
  rationale: அரிதான எபிரெயச் சொல் எத்தகைய துணியைத் துல்லியமாகக் குறிக்கிறது என்பது உறுதியில்லை. குறிப்பிட்ட நவீன பொருளாக முடிவுசெய்யாமல், அதன் மூடும் பயன்பாட்டை இது தெரிவிக்கிறது.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: தண்ணீரில் நனைத்து
  rationale: தண்ணீரில் அமிழ்த்துதல் அல்லது தோய்த்தல் என்ற செயலை இச்சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: அவருடைய முகத்தின்மேல் விரித்தான்
  rationale: துணியை முகத்தின்மேல் பரப்புதல் என்ற உடல் செயலை நேரடியாகக் கூறுகிறது.
- source_word: וַיָּמֹת
  choice: அவர் இறந்தார்
  rationale: எபிரெய உரையின் எளிய தொடர் நிகழ்வை அப்படியே காக்கிறது; வெளிப்படையாக இல்லாத நோக்கம் அல்லது காரணத் தொடர்பைச் சேர்க்கவில்லை.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: பின்பு ஆசகேல் அவருக்குப் பதிலாக அரசாண்டான்
  rationale: அரசாட்சியின் தொடர்ச்சியையும் ஆசகேல் முந்தைய அரசனின் இடத்தைப் பெற்றதையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘எடுத்தான்,’ ‘நனைத்தான்,’ ‘விரித்தான்’ ஆகிய செயல்களைச் செய்தவர் பெயரால் குறிப்பிடப்படாமை
  choice: முதன்மை உரையில் செய்பவரை ‘அவன்’ என்று மட்டும் குறிப்பிட்டு, ஆசகேல் என்று பெயரிடவில்லை
  alternative: செய்பவர் ஆசகேல் என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெய வினை வடிவங்களில் எழுவாய் பெயரால் சொல்லப்படவில்லை; சூழலிலிருந்து பலர் ஆசகேலைப் புரிந்துகொண்டாலும், இறுதி வாக்கியத்தில்தான் அவரது பெயர் வருகிறது. ஆகவே மூலத்தின் தெளிவின்மையை அடிக்குறிப்புடன் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், இயல்பான கதையோட்டத்துடனும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையுடனும் வடிவமைக்கப்பட்டது. அரசனை மரியாதைப் பன்மையில் குறிப்பது தமிழ் வழக்குக்கு ஏற்றது; பெயரிடப்படாத செய்பவருக்கு ஒருமை வடிவம் பயன்படுத்தப்பட்டதால் செய்பவரையும் இறந்தவரையும் குழப்பாமல், செய்பவரின் பெயர் குறித்த மூல உரையின் தெளிவின்மையும் காக்கப்படுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
