- from: அசகேல் அவரைச் சந்திக்கச் சென்றான். தன் கையில் ஓர் அன்பளிப்பையும், தமஸ்குவின் சிறந்த பொருள்கள் அனைத்தையும் எடுத்துக்கொண்டான்; அவை நாற்பது ஒட்டகங்கள் சுமக்கும் அளவுக்கு இருந்தன. அவன் வந்து அவருக்கு முன்பாக நின்று, “உங்கள் மகனான[a] ஆராம் அரசன் பெனாதாத், ‘இந்த நோயிலிருந்து நான் குணமடைவேனா?’[b] என்று உங்களிடம் கேட்பதற்காக என்னை அனுப்பியிருக்கிறார்” என்றான்.
  to: ஹசாயேல் அவரைச் சந்திக்கச் சென்றான். தன் கையில் ஓர் அன்பளிப்பையும், தமஸ்குவின் சிறந்த பொருள்கள் அனைத்தையும்—நாற்பது ஒட்டகச் சுமையளவானவற்றை—எடுத்துக்கொண்டான். அவன் வந்து அவருக்கு முன்பாக நின்று, “உங்கள் மகனான[a] ஆராம் அரசன் பென்-ஹதாத், ‘இந்த நோயிலிருந்து நான் குணமடைவேனா?’[b] என்று உங்களிடம் கேட்பதற்காக என்னை அனுப்பியிருக்கிறார்” என்றான்.
  rationale: The revision corrects the transliteration of Hazael and Ben-hadad to retain consonants present in the Hebrew source, while preserving the draft’s meaning, register, direct-speech structure, and footnote anchors. The load expression is made more directly appositional without altering its sense.
