base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: ta
  text: ஹசாயேல் அவரைச் சந்திக்கச் சென்றான். தன் கையில் ஓர் அன்பளிப்பையும், தமஸ்குவின் சிறந்த பொருள்கள் அனைத்தையும்—நாற்பது ஒட்டகச் சுமையளவானவற்றை—எடுத்துக்கொண்டான். அவன் வந்து அவருக்கு முன்பாக நின்று, “உங்கள் மகனான[a] ஆராம் அரசன் பென்-ஹதாத், ‘இந்த நோயிலிருந்து நான் குணமடைவேனா?’[b] என்று உங்களிடம் கேட்பதற்காக என்னை அனுப்பியிருக்கிறார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் மகன்” என்பது மதிப்புக்குரிய உயர்ந்த ஒருவரிடம் தாழ்மையுடன் பேசும் மரியாதைச் சொற்றொடர்; பென்-ஹதாத் உண்மையிலேயே அவருடைய மகன் என்று இது கட்டாயமாகப் பொருள்படாது.
    reason: cultural_note
  - marker: b
    text: இன்னும் நேரடியாக, “இந்த நோயிலிருந்து நான் உயிர்வாழ்வேனா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: அவரைச் சந்திக்க
  rationale: கרא + ל என்னும் எபிரெய வழக்கு ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது; தமிழில் ‘சந்திக்க’ என்பது இயல்பாகவும் திசைசார்ந்த இயக்கத்தைச் சூழல் மூலம் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מִנְחָה
  choice: ஓர் அன்பளிப்பு
  rationale: இங்கு இது வழிபாட்டுப் பலியைக் குறிக்காமல், அரசரின் சார்பில் தீர்க்கதரிசிக்குக் கொண்டுவரப்பட்ட மரியாதைப் பரிசைக் குறிக்கிறது. ‘அன்பளிப்பு’ அரசியல் திறையைக் காட்டிலும் நடுநிலையானது.
- source_word: בְיָדוֹ
  choice: தன் கையில்
  rationale: எபிரெயின் உருவகமான, நேரடியான சொல்லாட்சியைத் தக்கவைக்கிறது; பொருளைத் தன் பொறுப்பில் எடுத்துச் சென்றான் என்ற பொருளும் தமிழில் புரிகிறது.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: தமஸ்குவின் சிறந்த பொருள்கள் அனைத்தையும்
  rationale: טוּב இங்கு நகரத்தின் நல்ல அல்லது தேர்ந்தெடுக்கப்பட்ட விளைபொருள்களையும் பொருள்களையும் குறிக்கிறது. இந்தத் தேர்வு தரத்தையும் மிகுதியையும் இயல்பான தமிழில் தருகிறது.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: நாற்பது ஒட்டகங்கள் சுமக்கும் அளவுக்கு
  rationale: מַשָּׂא என்பது ‘சுமை’. பொருள்களின் அளவு நாற்பது ஒட்டகங்களுக்குரிய சுமை என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: அவருக்கு முன்பாக நின்று
  rationale: அதிகாரமுள்ள அல்லது மதிப்புக்குரிய ஒருவரின் முன்னிலையில் நிற்கும் முறையான சந்திப்பு நிலையை, கூடுதல் விளக்கம் இன்றி தக்கவைக்கிறது.
- source_word: בִּנְךָ
  choice: உங்கள் மகனான
  rationale: நேரடியான ‘உங்கள் மகன்’ என்ற உறவுமுறையைத் தக்கவைக்கிறது; இது சொல்லர்த்தமான மகனைக் கட்டாயமாகக் குறிக்காத மரியாதை மொழி என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: உங்களிடம் கேட்பதற்காக என்னை அனுப்பியிருக்கிறார்
  rationale: முடிந்த அனுப்புதலின் நிகழ்காலப் பொருத்தத்தைத் தமிழின் ‘அனுப்பியிருக்கிறார்’ இயல்பாகக் காட்டுகிறது; לֵאמֹר அறிமுகப்படுத்தும் செய்தி தமிழில் நேரடிக் கேள்வியுடன் இணைக்கப்பட்டுள்ளது.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: இந்த நோயிலிருந்து நான் குணமடைவேனா?
  rationale: חיה அடிப்படையில் ‘வாழ்தல்’ என்றாலும், நோயிலிருந்து வாழ்தல் என்ற இச்சூழலில் குணமடைதலைக் கேட்கிறது. இயல்பான தமிழ் முதன்மை உரையில் தரப்பட்டு, நேரடியான ‘உயிர்வாழ்தல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲרָם
  choice: ஆராம்
  rationale: பிற்கால நிலப்பெயரான ‘சிரியா’ என்பதற்குப் பதிலாக, வரலாற்றுச் சூழலுக்குரிய எபிரெயப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘உங்கள் மகன்’ என்பது சொல்லர்த்தமான உறவா அல்லது மரியாதைச் சொல்லா
  choice: முதன்மை உரையில் ‘உங்கள் மகனான’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உங்கள் பணியாளனான’ என்று பொருளை விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய உரை ‘மகன்’ என்றே கூறுகிறது. அரசன் தீர்க்கதரிசியிடம் தாழ்மையுடன் பேசும் மரியாதை நுணுக்கத்தை அடிக்குறிப்பில் தெரிவிப்பது, உரையின் உருவகத்தை மறையாமல் காக்கிறது.
- issue: הַאֶחְיֶה என்பதன் ‘வாழ்வேன்’ / ‘குணமடைவேன்’ நுணுக்கம்
  choice: முதன்மை உரையில் ‘குணமடைவேனா?’
  alternative: ‘உயிர்வாழ்வேனா?’
  rationale: நோயைப் பற்றிய கேள்வியில் தமிழின் இயல்பான நோக்கம் குணமடைதலாகும்; இருப்பினும் மரணம்-வாழ்வு சார்ந்த மூலச்சொல்லின் பதற்றம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்/உங்கள்’ மரியாதை வடிவங்கள் எலிசாவுக்கான மரியாதையை வெளிப்படுத்துகின்றன; அசகேலைக் குறிக்க ‘அவன்’ பயன்படுத்தப்பட்டதால் பேச்சாளரும் பெறுநரும் தெளிவாக வேறுபடுகின்றனர். பெயர்கள் மூல வடிவங்களுக்கு அண்மையாக அசகேல், பெனாதாத், ஆராம், தமஸ்கு என ஒலிபெயர்க்கப்பட்டுள்ளன.
