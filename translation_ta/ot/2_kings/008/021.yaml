translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் வேகமான வரலாற்றுக் கதைநடை காக்கப்பட்டுள்ளது. ‘மக்கள்’ யாரைக் குறிக்கிறது என்பதை உரைத் தெளிவுபடுத்தாததால், ‘படைவீரர்கள்’ என விளக்கமாக மாற்றாமல் அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
