  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: ta
  text: யோராம் தன்னுடன் இருந்த எல்லாத் தேர்களோடும் சாயீருக்குக்[a] கடந்து சென்றான். பின்பு அவன் இரவில் எழுந்து, தன்னைச் சுற்றிவளைத்திருந்த ஏதோமியரையும் தேர்ப்படைத் தலைவர்களையும் தாக்கினான். மக்கள் தங்கள் கூடாரங்களுக்கு ஓடிப்போனார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேயீருக்கு’ என்றும் இருக்கலாம். צָעִירָה என்ற எபிரெய இடப்பெயரின் வாசிப்பு கடினமானது; சிலர் இதைத் தனி இடப்பெயரான சாயீர் என்பதற்குப் பதிலாக சேயீர்/ஏதோமுடன் தொடர்புடைய ஒரு வடிவமாகக் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: ‘தங்கள் கூடாரங்களுக்கு ஓடிப்போனார்கள்’ என்பது அவர்கள் கலைந்து தங்கள் வீடுகளுக்குத் திரும்பியதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்து சென்றான்
  rationale: עבר என்பதன் ‘கடந்து செல்லுதல்’ என்ற அடிப்படை இயக்கப் பொருளை இராணுவச் சூழலில் இயல்பான தமிழில் தருகிறது; பயணப் பாதையைப் பற்றி தேவையற்ற விளக்கம் சேர்க்கவில்லை.
- source_word: צָעִירָה
  choice: சாயீருக்கு
  rationale: மசோரெட்டிக் உயிர்க்குறிப்பைத் தொடர்ந்து இதை இடப்பெயராக ஒலிபெயர்க்கிறது. சேயீர்/ஏதோமுடன் தொடர்புடைய மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: தன்னுடன் இருந்த எல்லாத் தேர்களோடும்
  rationale: רכב என்பதை இங்கு தேர்ப்படை என விரிவுபடுத்தாமல், எபிரெய வடிவத்துக்கு நெருக்கமாக ‘தேர்கள்’ என்று வழங்குகிறது.
- source_word: קָם לַיְלָה
  choice: இரவில் எழுந்து
  rationale: இரவில் நடவடிக்கை தொடங்கியதைச் சொல்லும் எபிரெய தொடர்; நவீன தமிழில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיַּכֶּה
  choice: தாக்கினான்
  rationale: נכה இங்கு இராணுவத் தாக்குதலைக் குறிக்கிறது. ‘தோற்கடித்தான்’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத முழுமையான வெற்றியை உணர்த்தக்கூடும்.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: தன்னைச் சுற்றிவளைத்திருந்த ஏதோமியரை
  rationale: ஏதோம் ஒரு மக்கள்/படைக்குழுவாகச் செயல்படுவதையும், அவர்கள் யோராமைச் சூழ்ந்திருந்ததையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שׂרים என்பதன் இராணுவச் சூழலிலான ‘தலைவர்கள்/தளபதிகள்’ என்ற பொருளையும் רכב என்பதன் கூட்டுப்படைப் பொருளையும் சுருக்கமான தமிழில் தருகிறது.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: மக்களோ தங்கள் கூடாரங்களுக்கு ஓடிப்போனார்கள்
  rationale: העם என்ற பொதுச் சொல்லை ‘மக்கள்’ எனப் பாதுகாக்கிறது; கூடாரங்களுக்கு ஓடுதல் என்ற எபிரெய உருவகத்தையும் வைத்திருக்கிறது. சூழல் அவர்களைப் படைவீரர்கள் எனக் காட்டினாலும் அதை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
