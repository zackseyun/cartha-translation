base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: ta
  text: 'அசகேல், “என் ஆண்டவரே, நீங்கள் ஏன் அழுகிறீர்கள்?” என்று கேட்டான். அதற்கு எலிசா, “நீ இஸ்ரவேல் மக்களுக்குச்[a] செய்யப்போகும் தீமையை நான் அறிந்திருக்கிறேன்: அவர்களுடைய அரண்களுக்குத் தீயிட்டு எரிப்பாய்[b]; அவர்களுடைய இளைஞர்களை வாளால் கொல்வாய்; அவர்களுடைய சிறு குழந்தைகளை நொறுக்குவாய்; அவர்களுடைய கர்ப்பிணிப் பெண்களைக் கிழித்துப்போடுவாய்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்களுக்கு.” இச்சொற்றொடர் இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவர்களுடைய அரண்களை நெருப்புக்குள் அனுப்புவாய்”; அல்லது, “அவர்களுடைய கோட்டைகளை எரிப்பாய்.”
    reason: lexical_alternative
