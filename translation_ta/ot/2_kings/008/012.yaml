- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: நீ ... செய்யப்போகும் தீமையை
  rationale: רָעָה என்பதன் அறச்சுமையைத் தக்கவைத்து, தொடர்புச் சொல்லாட்சியை இயல்பான தமிழில் அமைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் மக்களையும் குறிக்கும் எபிரெய மரபுத்தொடரை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: அவர்களுடைய அரண்களைத் தீக்கிரையாக்குவாய்
  rationale: ‘நெருப்புக்குள் அனுப்புதல்’ என்ற எபிரெய சொல்லாட்சியின் பொருளைத் தெளிவாகவும் வலிமையாகவும் தருகிறது.
- source_word: וּבַחֻרֵיהֶם
  choice: அவர்களுடைய இளைஞர்களை
  rationale: போரிடும் வயதில் உள்ள இளம் ஆண்களை நேரடியாகக் குறிக்கிறது; போர் சார்ந்த பொருள் அடுத்துள்ள ‘வாளால்’ என்பதால் தெளிவாகிறது.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: வாளால் கொல்வாய்
