- source_word: עֹלְלֵיהֶם תְּרַטֵּשׁ
  choice: அவர்களுடைய சிறு குழந்தைகளைத் தரையில் மோதி சிதைப்பாய்
  rationale: பச்சிளம் அல்லது மிகச் சிறிய குழந்தைகள்மீது நிகழும் கொடூரமான நொறுக்குதலை மறைக்காமல் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהָרֹתֵיהֶם תְּבַקֵּעַ
  choice: அவர்களுடைய கர்ப்பிணிப் பெண்களைக் கிழித்துப்போடுவாய்
  rationale: கர்ப்பிணிப் பெண்களைப் பிளக்கும் கொடுமையை மூடிமறைக்காமல், தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்களுக்கு
  alternative: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெய சொற்றொடர் இலக்கணரீதியாக ஆண்பால் பன்மையாக இருந்தாலும், இங்கு உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கிறது. தமிழில் சொல்லர்த்த வடிவம் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும்; அடிக்குறிப்பில் மூல வடிவம் தெரிவிக்கப்படுகிறது.
- issue: தீர்க்கதரிசன உரையிலுள்ள வெளிப்படையான வன்முறை
  choice: கொடுமைகளை மென்மைப்படுத்தாமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தீங்கு செய்வாய்’ அல்லது ‘தாக்குவாய்’ போன்ற மென்மையான பொதுச் சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரெய உரை திட்டமிட்டே கொடூரத்தையும் அறச்சுமையையும் வெளிப்படையாகக் காட்டுகிறது; அதை மறைப்பது உரையின் தாக்கத்தையும் பொருளையும் குறைக்கும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. அசகேலின் மரியாதை அழைப்புக்கு ‘என் ஆண்டவரே’ என்றும், எலிசாவுக்கான உரையாடலில் மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசனத்தின் அதிர்ச்சியூட்டும் வன்முறை மறைக்கப்படவில்லை; அதேவேளை தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
