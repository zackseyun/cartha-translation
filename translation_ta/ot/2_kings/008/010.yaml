base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: ta
  text: எலிசா அவனிடம், “நீ போய் அவனிடம், ‘நீ நிச்சயமாகக் குணமடைவாய்’ என்று சொல்[a]. ஆனால் அவன் நிச்சயமாக இறப்பான் என்று யாவே எனக்குக் காட்டியிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையைச் சொற்சொல்லாக வாசித்தால், “நீ நிச்சயமாக வாழ மாட்டாய்” என்று வருகிறது. இங்குள்ள எபிரெய உரை கடினமானது; அடுத்த வாக்கியத்துடன் உள்ள முரண்பாட்டைக் கருத்தில் கொண்டு, பலர் இதன் பொருளை “நீ நிச்சயமாகக் குணமடைவாய்” எனப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: எலிசா அவனிடம் ... என்றார்
  rationale: எபிரெய வாக்கியத்தில் எழுவாயாக எலிசாவின் பெயர் வெளிப்படையாக உள்ளது; தமிழின் இயல்பான மேற்கோள் அமைப்புக்கேற்ப ‘என்றார்’ இறுதியில் வைக்கப்பட்டது.
- source_word: לֵךְ אֱמָר
  choice: நீ போய் ... சொல்
  rationale: தொடர்ந்து வரும் இரண்டு கட்டளைகளின் செயற்பொருளும் காக்கப்படுகிறது; இது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לא חָיֹה תִחְיֶה
  choice: நீ நிச்சயமாகக் குணமடைவாய்
  rationale: חיה என்பதன் அடிப்படைப் பொருள் ‘வாழ்தல்’ என்றாலும், நோயைப் பற்றிய சூழலில் ‘குணமடைதல்’ இயல்பான பொருளைத் தருகிறது. வினையெச்சப் பெயருரு + முற்றுவினை அமைப்பின் வலியுறுத்தல் ‘நிச்சயமாக’ என்பதால் வெளிப்படுத்தப்படுகிறது. மசோரா உரையின் לא காரணமாக உண்டாகும் எதிர்மறை வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְהִרְאַנִי יְהוָה
  choice: ஆனால் ... யாவே எனக்குக் காட்டியிருக்கிறார்
  rationale: וְ இங்கு முன் சொல்லப்பட்ட செய்திக்கும் தீர்க்கதரிசிக்கு வெளிப்படுத்தப்பட்ட முடிவுக்கும் உள்ள முரண்பாட்டைக் குறிக்கிறது; ஆகவே ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. இறைபெயர் ஒலிபெயர்ப்பாக ‘யாவே’ எனத் தரப்பட்டது.
- source_word: כִּי מוֹת יָמוּת
  choice: அவன் நிச்சயமாகச் சாவான் என்று
  rationale: מות என்பதன் வினையெச்சப் பெயருரு + முற்றுவினை அமைப்பு மரணத்தின் உறுதியை வலியுறுத்துகிறது; ‘நிச்சயமாகச் சாவான்’ அந்த வலிமையை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: לא חיה תחיה என்ற கடினமான சொற்றொடரின் வாசிப்பு
  choice: முதன்மை உரையில் நோயிலிருந்து குணமடைவான் என்று அறிவிக்கும்படியான கட்டளையாக மொழிபெயர்த்து, மசோரா உரையின் நேரடி எதிர்மறை வாசிப்பை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘நீ நிச்சயமாக உயிர்வாழ மாட்டாய்’ அல்லது ‘நீ நிச்சயமாக வாழ்வாய்’
  rationale: WLC-யின் சுட்டெழுத்திடப்பட்ட לא என்பது ‘இல்லை/அல்ல’ என்ற எதிர்மறைப் பொருளைத் தருவதால் நேரடியாக வாசித்தால் ‘நீ நிச்சயமாக வாழ மாட்டாய்’ என வருகிறது. ஆனால் அடுத்துள்ள ‘ஆனால்’ என்ற கருத்து முரண்பாடும், நோயிலிருந்து மீள முடிந்தாலும் பின்னர் கொல்லப்படுவான் என்ற கதைச் சூழலும், நேர்மறையான அறிவிப்பை நோக்கிய உரைச்சிக்கல் இருப்பதைக் காட்டுகின்றன. எனவே சூழலுக்கேற்ற பொருள் முதன்மை உரையில் தரப்பட்டு, உண்மையான உரை ambiguity அடிக்குறிப்பில் மறைக்காமல் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மேற்கோள் அமைப்பு தமிழின் இயல்பான சொல்லொழுங்குக்கு மாற்றப்பட்டது. ‘குணமடைவாய்’ நோய் சார்ந்த சூழலைத் தெளிவாக்குகிறது; ‘யாவே’ இறைபெயரை மறைக்காமல் ஒலிபெயர்க்கிறது.
