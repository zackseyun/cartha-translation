  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: ta
  text: அகசியா அரசனானபோது அவனுக்கு இருபத்திரண்டு வயது; அவன் எருசலேமில் ஓராண்டு ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் அத்தாலியா; அவள் இஸ்ரவேலின் அரசனான ஒம்ரியின் மகள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒம்ரியின் பெண் சந்ததி.” எபிரெயத்தில் “மகள்” என்பது சில வேளைகளில் உடனடி மகளை மட்டுமல்லாமல் பெண் சந்ததியையோ ஒரு வம்சத்தைச் சேர்ந்த பெண்ணையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: இருபத்திரண்டு வயதாயிருந்தான்
  rationale: ‘இருபத்திரண்டு ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறுமுறையை, சரியான வயதைப் பாதுகாத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: அரசாட்சியைத் தொடங்கிய காலத்தைக் குறிக்கும் எபிரெய அரசர் பதவியேற்புச் சொல்லாக்கத்தை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: ஓராண்டு ஆட்சி செய்தான்
  rationale: ஆட்சிக்காலத்தின் கால அளவை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ்ப் பெயர்ப்பு.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: எபிரெய மரபுச் சூத்திரத்தின் பொருளைப் பாதுகாத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: עֲתַלְיָהוּ
  choice: அத்தாலியா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: בַּת עָמְרִי
  choice: ஒம்ரியின் மகள்
  rationale: בַּת என்பதன் நேரடியான உறவுப்பொருளை முதன்மை உரையில் வைத்திருக்கிறது; அது பெண் வழித்தோன்றல் அல்லது வம்ச உறுப்பினரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனான
  rationale: ஒம்ரியின் அரசப் பதவியைத் தெளிவாக அடையாளப்படுத்தும் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: “ஒம்ரியின் மகள்” என்ற வம்சாவளிச் சொல்லாக்கம்
  choice: முதன்மை உரையில் நேரடியான ‘மகள்’ என்பதைக் காத்து, விரிவான வம்சப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ஒம்ரியின் பெண் வழித்தோன்றல்
  rationale: எபிரெய உறவுமுறைச் சொல் உடனடி மகளையும் விரிவான வழித்தோன்றலையும் குறிக்கக்கூடும். உரையில் நேரடிப் பொருளையும் அடிக்குறிப்பில் உண்மையான மாற்றுச் சாத்தியத்தையும் வைத்திருப்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் பொருள் காக்கப்பட்டாலும், தமிழுக்கு இயல்பில்லாத சொல் வரிசை தவிர்க்கப்பட்டுள்ளது.
