base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: ta
  text: ஆனாலும், தம் பணியாளரான தாவீதுக்காக யெகோவா யூதாவை அழிக்க விரும்பவில்லை; தாவீதுக்கு, அவருடைய மகன்களுக்காக, எல்லாக் காலத்திலும் ஒரு விளக்கைக் கொடுப்பதாக அவரிடம் சொல்லியிருந்தபடியே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விளக்கு” என்பது தாவீதின் அரச வம்சம் தொடர்ந்து நிலைப்பதைக் குறிக்கும் அரசகுல உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: ஆனாலும் ... விரும்பவில்லை
  rationale: முந்தைய நியாயத்தீர்ப்புச் சூழலுடன் உள்ள முரண்பாட்டை ‘ஆனாலும்’ இயல்பாகக் காட்டுகிறது; אָבָה என்பது வெறும் எதிர்கால மறுப்பை அல்ல, மனவிருப்பம் அல்லது சம்மதத்தைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: யூதாவை அழிக்க
  rationale: இங்கு שׁחת என்பதன் ஹிஃபில் வடிவம் யூதாவுக்கு எதிரான அழிவுத் தீர்ப்பைக் குறிக்கிறது; ‘அழிக்க’ என்பது தெளிவான, இயல்பான இணைச்சொல்.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: தம் பணியாளரான தாவீதுக்காக
  rationale: לְמַעַן என்பது தாவீதின் பொருட்டு அல்லது அவரைக் கருத்திற்கொண்டு என்பதைக் காட்டுகிறது; עֶבֶד என்பதற்கு இன்றைய கண்ணியமான தமிழில் ‘பணியாளர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: அவரிடம் சொல்லியிருந்தபடியே
  rationale: மூலத்தில் உள்ள ‘சொன்னார்’ என்ற பொருளைத் தக்கவைத்து, சூழலில் அது வாக்குறுதியாகச் செயல்படுவதை உரை இயல்பாக உணர்த்துகிறது.
- source_word: נִיר
  choice: ஒரு விளக்கு
  rationale: தாவீதின் அரச வம்சம் தொடர்வதைக் குறிக்கும் கண்கூடான அரசகுல உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: לְבָנָיו
  choice: தாவீதின் மகன்களுக்கு
  rationale: மூலத்தின் ‘அவனுடைய மகன்களுக்கு’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; தெளிவுக்காக முன்னிலைப் பெயர் மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: כָּל־הַיָּמִים
  choice: எல்லாக் காலத்திலும்
  rationale: ‘எல்லா நாட்களிலும்’ என்ற எபிரெய வழக்கை இயல்பான தமிழில் அளிக்கிறது; ‘என்றென்றும்’ என்று பொருளை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: נִיר என்ற தாவீதிய அரசவம்ச உருவகம்
  choice: ஒரு விளக்கு
  alternative: ஒரு வெளிச்சம்; தொடரும் அரச வம்சம்
  rationale: உருவகத்தை நேரடியாக ‘அரச வம்சம்’ என்று விளக்கிவிடாமல் பாதுகாப்பது, தாவீதிய உடன்படிக்கையுடனான வேதாகமத் தொடர்பையும் மூலத்தின் இறையியல் செறிவையும் தக்கவைக்கிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பெயர் உள்ளது. தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் ‘யெகோவா’ என்பதைப் பயன்படுத்துவது அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தாவீதுக்கு அளிக்கப்பட்ட உரையின் தன்மை
  choice: சொல்லியிருந்தபடியே
  alternative: வாக்குறுதி அளித்திருந்தபடியே
  rationale: אָמַר என்பதன் நேரடிப் பொருள் ‘சொல்’ என்பதால் அதையே உரையில் வைத்திருக்கிறது; சூழல் அதை வாக்குறுதியாக உணர்த்தினாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. நீளமான எபிரெய வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; உருவகமும் மூலத்தின் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டன.
