translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை. எலிசாவுக்கும் ‘தேவனுடைய மனிதர்’ என்ற பட்டத்திற்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; அரசனைச் சுட்டும் உரைநடைப் பிரதிப்பெயர் மூலக் கதையின் நேரடியான நடைக்கு ஏற்ப ஒருமையில் உள்ளது. மூலத்தில் ‘ஆராம்’ இருப்பதால் ‘சீரியா’ என்ற மாற்றுப் பெயருக்கான ஆங்கிலக் குறிப்பைத் தமிழில் தவறாக ‘நோயுற்றிருந்தான்’ என்பதுடன் இணைக்காமல், உரையிலேயே ‘ஆராம்’ எனத் தெளிவாக வழங்கியதால் அடிக்குறிப்பு தேவையில்லை.
