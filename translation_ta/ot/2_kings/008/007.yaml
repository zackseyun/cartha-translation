reference: 2 Kings 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: ta
  text: பின்பு எலிசா தமஸ்குவுக்கு வந்தார். ஆராமின் அரசன் பென்-அதாத் நோயுற்றிருந்தான். “அந்த தேவ மனிதர் இங்கே வந்திருக்கிறார்” என்று அவனுக்கு அறிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: பின்பு ... வந்தார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: דַּמֶּשֶׂק
  choice: தமஸ்கு
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבֶן־הֲדַד
  choice: அப்போது ... பென்-அதாத்
  rationale: இங்குள்ள வாவ் அடுத்த நிகழ்வை மட்டும் கூறாமல் பின்னணிச் சூழலை அறிமுகப்படுத்துகிறது; ‘அப்போது’ அந்த மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: ஆராமின் ராஜா
  rationale: எபிரெய மூலத்தின் இன-புவியியல் பெயரான ‘ஆராம்’ நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; பிற்கால ‘சீரியா’ என்ற அடையாளம் புகுத்தப்படவில்லை.
- source_word: חֹלֶה
  choice: நோயுற்றிருந்தான்
  rationale: பென்-அதாதின் அப்போதைய நீடித்த நிலையைக் குறிக்கும் பெயரெச்சப் பயனைக் காலச்சூழலுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֻּגַּד לוֹ
  choice: அவனுக்கு அறிவிக்கப்பட்டது
  rationale: ஹொஃபால் வினையின் செயப்பாட்டு மற்றும் குறிப்பற்ற அறிவிப்பாளர் தன்மையைப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: எபிரெய மேற்கோள் அறிமுகச் சூத்திரத்தை நவீன தமிழில் இயல்பாகத் தருகிறது; தனியே ‘சொல்லி’ என மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: בָּא
  choice: வந்திருக்கிறார்
  rationale: அவர் வந்து இப்போது அங்கே இருப்பதைக் குறிக்கும் நிறைவு வினையின் நிகழ்கால விளைவைத் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது தீர்க்கதரிசிக்கான பட்டமாக இருந்தாலும், மூலத்தின் தனித்துவமான ‘தேவனுடைய மனிதர்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: עַד הֵנָּה
  choice: இங்கே
  rationale: பேசுபவரின் இடம்வரை வந்திருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
