base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: ta
  text: யோராம்[b] தன் முன்னோர்களுடன் துயிலடைந்தான்[a]. அவன் தாவீதின் நகரத்தில் தன் முன்னோர்களுடன் அடக்கம் செய்யப்பட்டான். அவனுடைய மகன் அகசியா அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “தன் முன்னோர்களுடன் படுத்தான்.” இது அரசரின் இறப்பைக் குறிக்கும் எபிரெய மரபுவழிச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “யோராம்”; சில மொழிபெயர்ப்பு மரபுகளில் இப்பெயர் “யெகோராம்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்தல்’; அரசர்களின் இறப்பைக் குறிக்கும் மரபுவழிச் சொற்றொடரில் அது இறப்பைக் குறிக்கிறது. ‘துயிலடைந்தான்’ என்பது அந்த உருவகத்தை இயல்பான, கண்ணியமான தமிழில் காக்கிறது; நேரடியாக ‘இறந்தான்’ என்று விளக்கிவிடவில்லை.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களுடன்
  rationale: ‘தந்தையர்களுடன்’ என்ற சொற்சொற் மொழிபெயர்ப்பைவிட, வம்ச முன்னோர்களைக் குறிக்கும் இச்சொற்றொடரின் பொருளை நவீனத் தமிழில் ‘முன்னோர்களுடன்’ தெளிவாகத் தருகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: எபிரெய நிபால் வடிவின் செயல்பாட்டு (passive) பொருளையும் நிகழ்வுகளின் தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: அங்கீகரிக்கப்பட்ட இடப்பெயர் சார்ந்த சொல்லாட்சியைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்ற வினையின் அரசாட்சி பொருளை வாரிசுரிமைச் சூழலில் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசு முன்னிருந்த அரசனின் இடத்தை ஏற்றதை நவீனத் தமிழில் நேராக வெளிப்படுத்துகிறது.
- source_word: יוֹרָם
  choice: யோராம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவத்தை நேரடியாக ஒலிபெயர்க்கிறது; மரபுவழி மாற்றுப் பெயரால் அதை ஒத்திசைக்கவில்லை.
- source_word: אֲחַזְיָהוּ
  choice: அகசியா
  rationale: எபிரெயப் பெயரின் பரவலாக அறியப்படும் நவீனத் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: அரசரின் இறப்பைக் குறிக்கும் எபிரெய மரபுவழிச் சொற்றொடர்
  choice: ‘தன் முன்னோர்களுடன் துயிலடைந்தான்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘இறந்தான்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் மரபுவழி உருவகத்தையும் அதன் உள்ளார்ந்த தெளிவின்மையையும் காக்கிறது; உயிர்த்தெழுதல் அல்லது மறுமை குறித்த பிற்கால இறையியல் கருத்தை வசனத்துக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘பிதாக்கள்’, ‘நித்திரையடைந்தான்’ போன்ற பழைய சமய வழக்குச் சொற்கள் தவிர்க்கப்பட்டன; அதே நேரத்தில் எபிரெய அரச மரணச் சூத்திரத்தின் உருவகம் அடிக்குறிப்புடன் காக்கப்பட்டது.
