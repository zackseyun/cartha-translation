  choice: அரசன் அந்தப் பெண்ணிடம் விசாரித்தான்
  rationale: שׁאל என்பது கேட்பதைக் குறிக்கிறது; உரிமைக் கோரிக்கை குறித்து அரசன் கேட்டறியும் சூழலில் ‘விசாரித்தான்’ இயல்பாக உள்ளது. முன்னரே குறிப்பிடப்பட்ட சூனேமியப் பெண்ணைச் சுட்டுவதால் ‘அந்தப் பெண்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתְּסַפֶּר לוֹ
  choice: அவள் அவனுக்கு விவரித்துச் சொன்னாள்
  rationale: பியேல் வடிவிலுள்ள ספר நிகழ்ந்ததை எடுத்துரைத்தல் அல்லது விவரித்தல் என்ற பொருளைக் கொண்டதால், வெறும் ‘சொன்னாள்’ என்பதைவிட இச்சொற்றொடர் மூலத்தின் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: அரசன் அவளுக்காக ஓர் அரண்மனை அதிகாரியை நியமித்து
  rationale: இங்கு נתן என்பது அந்தப் பெண்ணின் சொத்துகளை மீட்டளிக்க ஒருவரை நியமிப்பதைக் குறிக்கிறது. סָרִיס அரசவையில் பணிபுரியும் அதிகாரியையோ உடலளவில் அலியாக்கப்பட்டவரையோ குறிக்கலாம்; முதன்மை உரையில் பணிசார் பொருள் இயல்பாகத் தரப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: அவளுக்குச் சொந்தமான அனைத்தையும் ... அவளுக்குத் திருப்பிக் கொடு
  rationale: שוב என்பதன் ஹிஃபில் கட்டளை வடிவம், அவளுடைய உடைமைகளை மீண்டும் அவளிடம் சேர்க்குமாறு உத்தரவிடுகிறது. ‘திருப்பிக் கொடு’ நவீனத் தமிழில் நேரடியும் இயல்புமானது.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: அந்த வயலில் கிடைத்த விளைச்சல் முழுவதையும்
  rationale: תְּבוּאָה வயலின் வேளாண் விளைச்சல் அல்லது அதிலிருந்து கிடைக்கும் வருவாயைக் குறிக்கலாம். ‘விளைச்சல்’ அதன் வேளாண் அடிப்படையைத் தெளிவாக வைத்திருக்கிறது; כָּל என்பதன் முழுமை ‘முழுவதையும்’ மூலம் தெரிவிக்கப்படுகிறது.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: அவள் இந்த நாட்டைவிட்டுச் சென்ற நாள்முதல் இன்றுவரை
  rationale: אֶרֶץ இச்சூழலில் அவள் விட்டுச் சென்ற தாய்நாடு அல்லது ஆட்சிப்பகுதியைக் குறிக்கிறது. தமிழில் ‘இந்த நாடு’ சூழல்சார் சுட்டுதலை இயல்பாக வெளிப்படுத்துகிறது; கால எல்லை ‘நாள்முதல் இன்றுவரை’ எனத் துல்லியமாகப் பாதுகாக்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்று கட்டளையிட்டான்
  rationale: எபிரேயக் கதைநடையில் இது நேரடி உரையை அறிமுகப்படுத்துகிறது. உரை அரசன் அதிகாரிக்குக் கொடுத்த கட்டளை என்பதால் தமிழில் ‘என்று கட்டளையிட்டான்’ என்பது செயற்பாட்டைத் தெளிவுபடுத்துகிறது.
