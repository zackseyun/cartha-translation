  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: ta
  text: அரசன் அந்தப் பெண்ணிடம் விசாரித்தான்; அவள் அவனுக்கு விவரித்துச் சொன்னாள். பின்பு அரசன் அவளுக்காக ஓர் அரண்மனை அதிகாரியை[a] நியமித்து, “அவளுக்குச் சொந்தமான அனைத்தையும், அவள் நாட்டைவிட்டுச் சென்ற நாள்முதல் இன்றுவரை அந்த வயலில் கிடைத்த விளைச்சல் முழுவதையும் அவளுக்குத் திருப்பிக் கொடு” என்று கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் அலியை.’ இங்குள்ள அரசவைப் பதவிச்சொல் உடலளவில் அலியாக்கப்பட்ட ஒருவரையோ, பொதுவாக ஓர் அரண்மனை அதிகாரியையோ குறிக்கலாம்.
    reason: lexical_alternative
