base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: ta
  text: அரசன் ஆசகேலிடம், “உன் கையில் ஒரு பரிசை எடுத்துக்கொண்டு, தேவனுடைய மனிதரைச் சந்திக்கச் செல். அவர்மூலம் யாவேயிடம், ‘இந்த நோயிலிருந்து நான் குணமடைவேனா?[a]’ என்று விசாரி” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நோயிலிருந்து நான் உயிர்பிழைப்பேனா?” எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் “வாழ்வது”; இங்கு அது உயிர்பிழைப்பதையோ குணமடைவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: பரிசு
  rationale: இங்கு தீர்க்கதரிசியைச் சந்தித்து விசாரிக்கும்போது கொண்டுசெல்லப்படும் அன்பளிப்பைக் குறிக்கிறது; வழிபாட்டுப் பலி அல்லது அரசியல் கப்பம் என்ற பொருளைத் தவிர்த்து, இயல்பான தமிழில் ‘பரிசு’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּיָדְךָ
  choice: உன் கையில்
  rationale: தனிப்பட்ட முறையில் எடுத்துச் செல்வதைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தமிழிலும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: ‘போ’ என்பதற்குப் பின் வரும் நோக்கத்தைக் குறிக்கும் வினையெச்சமாக, அந்த மனிதரைச் சந்திப்பதற்காகச் செல்ல வேண்டும் என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது தீர்க்கதரிசியைக் குறிக்கும் நிலையான எபிரேயப் பட்டம். வெறுமனே ‘தீர்க்கதரிசி’ என்று மாற்றாமல் மூலத்தின் இலக்கிய மற்றும் இறையியல் ஒலியைப் பாதுகாக்கிறது.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: அவர் மூலமாக யாவேயிடம் ... விசாரி
  rationale: דרשׁ இங்கு தெய்வீகப் பதிலை நாடுவதையும், מֵאֹתוֹ அந்தப் பதில் தேவனுடைய மனிதர் வழியாகப் பெறப்படுவதையும் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַאֶחְיֶה
  choice: நான் குணமடைவேனா?
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வாழ்வது’ என்றாலும், நோயின் சூழலில் உயிர்பிழைத்து நலம்பெறுவதை இயல்பான தமிழில் குறிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֵחֳלִי זֶה
  choice: இந்த நோயிலிருந்து
  rationale: அரசனுக்கு ஏற்பட்டுள்ள தற்போதைய நோயிலிருந்து மீள்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: הַאֶחְיֶה என்பதிலுள்ள வாழ்தல்–குணமடைதல் நுட்பம்
  choice: முதன்மை உரையில் ‘குணமடைவேனா?’; அடிக்குறிப்பில் ‘உயிர்பிழைப்பேனா?’
  alternative: முதன்மை உரையில் ‘நான் வாழ்வேனா?’
  rationale: நோயிலிருந்து மீள்வதே சூழல்சார் கேள்வி; அதேவேளையில் எபிரேயச் சொல்லின் நேரடிப் பொருளும் மரணம் குறித்த உட்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கண்ணியத்தைத் தக்கவைக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. உரையாடல் இயல்பாக அமைக்கப்பட்டு, எபிரேய மரபுத்தொடர்களில் தமிழில் பொருந்தக்கூடியவை பாதுகாக்கப்பட்டுள்ளன.
