translation:
  language: ta
  text: அவன் அரசனானபோது முப்பத்திரண்டு வயதாயிருந்தான்; எருசலேமில் எட்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: முப்பத்திரண்டு வயதாயிருந்தான்
  rationale: בֶּן + எண் + שָׁנָה என்பது வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் இயல்பாகவும் துல்லியமாகவும் வயதைக் குறிப்பிட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הָיָה בְמָלְכוֹ
  choice: அவன் அரசனானபோது
  rationale: இத்தொடர் அவன் அரியணையேறிய நேரத்தில் இருந்த வயதைக் குறிக்கிறது; நவீன தமிழில் தெளிவான காலத் தொடராக வழங்கப்பட்டது.
- source_word: וּשְׁמֹנֶה שנה
  choice: எட்டு ஆண்டுகள்
  rationale: ஆட்சிக்காலத்தின் துல்லியமான கால அளவை நேரடியாகக் காட்டுகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: வினைச்சொல் அரச பதவியை வெறுமனே வகித்ததை அல்ல, அரசனாக ஆட்சி புரிந்ததைச் சுட்டுகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கும் இடவேற்றுமையை இயல்பான தமிழில் தருகிறது.
