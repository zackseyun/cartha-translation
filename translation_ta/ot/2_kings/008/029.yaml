- from: அரசன் யோராம், ஆராம் நாட்டினருடன் போரிட்டபோது அவர்கள் ராமாவில் தனக்கு ஏற்படுத்திய காயங்களிலிருந்து குணமடைவதற்காக யெஸ்ரயேலுக்குத் திரும்பினான். அவன் ஆராமின் அரசன் அசகேலுக்கு எதிராகப் போரிட்டிருந்தான். ஆகவே, யோராம் நோயுற்றிருந்ததால், யூதாவின் அரசனான யெகோராமின் மகன் அகசியா, ஆகாபின் மகன் யோராமைப் பார்க்க[a] யெஸ்ரயேலுக்கு இறங்கிச் சென்றான்.
