translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அரசர் பெயர்கள் தமிழ் வேதாகம மரபுடன் பொதுவாக ஒத்த வடிவங்களில் தரப்பட்டுள்ளன; ‘ஆராம்’ என்ற பண்டைய நாட்டுப்பெயர் காக்கப்பட்டுள்ளது.
