base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: ta
  text: அரசன் யோராம், ராமாவில் ஆராமின் அரசன் ஹசாயேலுக்கு எதிராகப் போரிட்டபோது ஆராமியர் அவனைத் தாக்கி ஏற்படுத்திய காயங்களிலிருந்து குணமடைய[a] யெஸ்ரயேலுக்குத் திரும்பினான்[b]. யூதாவின் அரசனான யெகோராமின் மகன் அகசியா, யோராம் நோயுற்றிருந்ததால், ஆகாபின் மகன் யோராமைப் பார்க்க[c] யெஸ்ரயேலுக்கு இறங்கிச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குணமாக.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஆராமியர்”; மரபுவழியாக, “சீரியர்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “யோராமைச் சந்திக்க.” எபிரெயத்தில் நேரடியாக, “யோராமைப் பார்க்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினான்
  rationale: שוב என்பதன் தொடர்கதை வடிவம், போர்க்களத்திலிருந்து யெஸ்ரயேலுக்கு மீண்டும் சென்றதைக் குறிக்கிறது.
- source_word: לְהִתְרַפֵּא
  choice: குணமடைவதற்காக
  rationale: רפא என்பதன் hitpael வடிவம் இங்கு காயங்களிலிருந்து மீண்டு வருவதைக் குறிக்கிறது; தானே தன்னைக் குணப்படுத்திக்கொண்டான் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: מִן הַמַּכִּים
  choice: காயங்களிலிருந்து
  rationale: மூலச்சொல் நேரடியாக அடிகள் அல்லது தாக்குதல்களைக் குறித்தாலும், மருத்துவ மற்றும் போர்ச் சூழலில் அவற்றால் ஏற்பட்ட காயங்களைக் குறிக்கிறது.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: ஆராம் நாட்டினர் தனக்கு ஏற்படுத்திய
  rationale: அவர்கள் அவனைத் தாக்கியதால் ஏற்பட்ட காயங்கள் என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; אֲרַמִּים என்பதற்கு வரலாற்றுச் சூழலுக்கேற்ற ‘ஆராம் நாட்டினர்’ பயன்படுத்தப்பட்டது.
- source_word: בָּרָמָה
  choice: ராமாவில்
  rationale: ב முன்னிடைச்சொல் இங்கு போரின் இடத்தைக் குறிக்கிறது.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: அசகேலுக்கு எதிராகப் போரிட்டிருந்தான்
  rationale: இறந்தகாலச் சூழ்நிலையைத் தெளிவாக்குகிறது; הלחם உடன் வரும் אֶת எதிர்த்துப் போரிடுதலைக் குறிக்கிறது.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: அகசியா...இறங்கிச் சென்றான்
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய திசைநுட்பத்தையும் தொடர்கதை நகர்வையும் காக்கிறது.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: யோராமைப் பார்க்க
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘பார்க்க’ என்பதைத் தக்கவைத்து, நோயுற்றவரைச் சந்திக்கும் சூழற்பொருளையும் தமிழில் இயல்பாக அனுமதிக்கிறது.
- source_word: כִּי חֹלֶה הוּא
  choice: யோராம் நோயுற்றிருந்ததால்
  rationale: חֹלֶה என்பது காயமடைந்த காரணத்தை அல்ல, அப்போதைய உடல்நிலையைச் சுட்டுகிறது.
