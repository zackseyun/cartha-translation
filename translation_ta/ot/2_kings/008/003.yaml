base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: ta
  text: ஏழு ஆண்டுகள் முடிவடைந்தபோது, அந்தப் பெண் பெலிஸ்தியரின் நாட்டிலிருந்து திரும்பிவந்தாள். அவள் தன் வீட்டுக்காகவும் தன் வயலுக்காகவும் அரசனிடம் முறையிட[a] புறப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனிடம் கூக்குரலிட.”
    reason: צָעַק என்ற எபிரெய வினைச்சொல் நேரடியாக ‘கூக்குரலிடு’ என்றும், நீதி கேட்கும் சூழலில் ‘முறையிடு’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள் முடிவடைந்தபோது
  rationale: காலப்பகுதியின் முடிவைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַתָּשָׁב
  choice: திரும்பிவந்தாள்
  rationale: முந்தைய தங்குமிடமான பெலிஸ்தியரின் நாட்டிலிருந்து அந்தப் பெண் மீண்டும் வந்ததைக் கதைநடைக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாடு
  rationale: ‘பெலிஸ்தியரின் நாடு’ என்ற மூலமொழியின் வெளிப்படையான புவியியல் சொல்லாக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַתֵּצֵא
  choice: புறப்பட்டாள்
  rationale: יָצָא என்பதிலுள்ள வெளியே செல்வது அல்லது ஒரு நோக்கத்திற்காகப் புறப்படுவது என்ற இயக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִצְעֹק
  choice: முறையிட
  rationale: அரசனிடம் சொத்து தொடர்பாக நீதி கோரும் இச்சூழலில் צָעַק என்பதன் வேண்டுகோள் அல்லது நீதிமுறையீட்டுப் பொருளைத் தெளிவாக வழங்குகிறது; அதன் நேரடியான ‘கதறிக் கூப்பிடுதல்’ சார்ந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל־הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: வேண்டுகோள் செலுத்தப்படும் நபரைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בֵּיתָהּ
  choice: தன் வீடு
  rationale: ‘வயல்’ என்பதுடன் இணைந்து வருவதால், குடும்பத்தார் என்ற பொருளைவிட நிலையான சொத்தாகிய வீட்டைக் குறிப்பது பொருத்தமானது.
- source_word: שָׂדָהּ
  choice: தன் வயல்
  rationale: பொதுவான ‘நிலம்’ என்பதைவிட மூலத்தின் குறிப்பான பயிர்நிலப் பொருளைப் பாதுகாக்கிறது.
