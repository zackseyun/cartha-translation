base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: ta
  text: அவன் மேடைகளிலும், குன்றுகளின்மேலும், பசுமையான ஒவ்வொரு மரத்தின் கீழும்[a] பலியிட்டுத் தூபம் எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தழைகள் நிறைந்த ஒவ்வொரு மரத்தின் கீழும்” அல்லது “செழித்து வளர்ந்த ஒவ்வொரு மரத்தின் கீழும்.” எபிரெயப் பெயரடை பசுமையான, புத்துணர்ச்சியுள்ள அல்லது செழிப்பான ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: பலியிட்டான்
  rationale: זבח என்பது பலி செலுத்தும் வழிபாட்டுச் செயலைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல், தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וַיְקַטֵּר
  choice: தூபம் எரித்தான்
  rationale: קטר என்பதன் பியேல் வடிவம் வழிபாட்டுச் சூழலில் பொதுவாகத் தூபத்தை எரிப்பதையோ காணிக்கையைப் புகையாக்குவதையோ குறிக்கும். இச்சூழலில் “தூபம் எரித்தான்” இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: בַּבָּמוֹת
  choice: மேடைகளிலும்
  rationale: במות என்பது உள்ளூர் வழிபாட்டு மேடுகளையோ வழிபாட்டிடங்களையோ குறிக்கிறது. “மேடைகள்” என்ற மரபான சொல் அதன் வழிபாட்டுச் சார்பைச் சூழலிலிருந்து உணர இடமளிக்கிறது; “அந்நிய தெய்வ வழிபாட்டிடங்கள்” போன்ற விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- source_word: וְעַל הַגְּבָעוֹת
  choice: குன்றுகளின்மேலும்
  rationale: גבעות என்பது நிலவியல் குன்றுகளைக் குறிக்கிறது. இதை “மேடைகள்” என்பதிலிருந்து வேறுபடுத்தி மொழிபெயர்ப்பது மூலத்தின் இரு தனித்த இடக்குறிப்புகளையும் காக்கிறது.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: பசுமையான ஒவ்வொரு மரத்தின் கீழும்
  rationale: רענן என்பது பசுமை, புத்துணர்ச்சி அல்லது செழிப்பு உடையதைக் குறிக்கலாம். “பசுமையான” என்பது மூலத்தின் தெளிவான காட்சியைக் காத்து, நவீன தமிழில் இயல்பாக உள்ளது; பிற சாத்தியங்களை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: முறையற்ற வழிபாட்டைக் குறிக்கும் நிலையான சொற்றொடரின் மொழிபெயர்ப்பு
  choice: பலியிடுதல், தூபம் எரித்தல், மேடைகள், குன்றுகள், மரங்களின் கீழ் ஆகிய துல்லியமான செயல்களையும் இடங்களையும் அப்படியே வைத்தல்
  alternative: “அவன் குன்றுக் கோயில்களில் புறமத வழிபாடு செய்தான்” போன்ற விளக்கவுரை மொழிபெயர்ப்பு
  rationale: இந்த வசனம் செயல்களையும் இடங்களையும் பட்டியலிடுகிறதே தவிர, அவற்றை இங்கே நேரடியாக “புறமதம்” என்று பெயரிடவில்லை. எதிர்மறையான மதிப்பீட்டை விரிந்த சூழல் வழங்கட்டும் என்பதற்காக மூலத்தின் குறிப்பான மொழி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இணையான இடக்குறிப்புகள் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன; தமிழில் செயல்வரிசை இயல்பாக அமைய “பலியிட்டுத் தூபம் எரித்தான்” என அமைக்கப்பட்டது.
