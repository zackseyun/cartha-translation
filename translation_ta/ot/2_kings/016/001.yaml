  to: ரெமலியாவின் மகன் பெக்காவின் ஆட்சியின் பதினேழாம் ஆண்டில், யோதாமின் மகன் ஆகாஸ், யூதாவின் அரசன், ஆட்சி செய்யத் தொடங்கினான்.
