base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: ta
  text: ரெமலியாவின் மகன் பெக்காவின் ஆட்சியின் பதினேழாம் ஆண்டில், யோதாமின் மகன் ஆகாஸ், யூதாவின் அரசன், ஆட்சி செய்யத் தொடங்கினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: ஆட்சியின் பதினேழாம் ஆண்டில்
  rationale: בִּשְׁנַת என்ற காலக் குறிப்பும் எண்ணும் சேர்ந்து அரசாட்சியின் பதினேழாம் ஆண்டைக் குறிக்கின்றன. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘ஆட்சியின்’ என்பது வெளிப்படுத்தப்பட்டது.
- source_word: לְפֶקַח בֶּן־רְמַלְיָהוּ
  choice: ரெமலியாவின் மகன் பெக்காவின்
  rationale: לְ இங்கு யாருடைய ஆட்சியாண்டு கணக்கிடப்படுகிறது என்பதைச் சுட்டுகிறது; בֶּן patronymic உறவை ‘மகன்’ என நேரடியாகக் காக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்யத் தொடங்கினான்
  rationale: அரசர் காலக்கணிப்பு வாய்பாட்டில் מלך என்பதன் நிறைவேற்ற வினை வடிவம் பொதுவாக அரியணையேறி ஆட்சியைத் தொடங்கிய நிகழ்வைக் குறிக்கிறது.
- source_word: אָחָז בֶּן־יוֹתָם
  choice: யோதாமின் மகன் ஆகாஸ்
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை–மகன் உறவு இயல்பான தமிழ் உடைமைத் தொடரால் தரப்பட்டது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான
  rationale: இந்தப் பெயரடைத் தொடர் ஆகாஸை அடையாளப்படுத்துகிறது; தமிழில் ‘அரசனான’ என இணைப்பது வாக்கிய உறவைத் தெளிவாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசர் காலக்கணிப்பு தெளிவாகப் புரியும்படி dignified நடை பயன்படுத்தப்பட்டது. ‘ராஜா’ என்பதற்குப் பதில் பொதுவான தமிழ் வடிவமான ‘அரசன்’ தேர்ந்தெடுக்கப்பட்டது; வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
