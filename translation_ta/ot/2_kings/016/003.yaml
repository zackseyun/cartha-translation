base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ta
  text: அவன் இஸ்ரவேலின் அரசர்களின் வழியில் நடந்தான்; அதுமட்டுமல்ல, இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து யெகோவா விரட்டியிருந்த பிறதேச மக்களின் அருவருப்பான செயல்களின்படி, தன் மகனை நெருப்பினூடே கடக்கச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மகனை நெருப்பில் பலியிட்டான்.” எபிரெயத்தில் சொல்லுக்கு சொல், “தன் மகனை நெருப்பினூடே கடக்கச் செய்தான்”; இது கண்டிக்கப்பட்ட பிறமதச் சடங்குடன் தொடர்புடைய ஒரு மரபுத்தொடர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்தான்
  rationale: הלך உடன் בְּדֶרֶךְ என்பது ஒருவரின் நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கும் உருவகம். தமிழிலும் “வழியில் நடந்தான்” என்பது அந்த உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்கள்
  rationale: வடக்கு அரசின் ஆட்சியாளர்களை ஒழுக்கநெறி ஒப்பீடாகக் குறிப்பிடும் நேரடியான உடைமைத் தொடர்.
- source_word: וְגַם
  choice: அதுமட்டுமல்ல
  rationale: גַּם இங்கு வெறும் இணைப்பை விட தீவிரப்படுத்தும் வலியுறுத்தலைக் கொண்டுள்ளது; அவன் இஸ்ரவேல் அரசர்களைப் பின்பற்றியதோடு மேலும் இந்தக் கொடிய செயலையும் செய்தான் என்பதைக் காட்டுகிறது.
- source_word: אֶת־בְּנוֹ
  choice: தன் மகனை
  rationale: ஒருமை ஆண்பால் பெயர்ச்சொல்லையும், வாக்கியத்தின் எழுவாயையே குறிக்கும் இயல்பான தமிழ் தற்சுட்டுப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: நெருப்பினூடே கடக்கச் செய்தான்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான வடிவத்தையும் சடங்கின் விவரங்களைப் பற்றிய அதன் தெளிவின்மையையும் தக்கவைக்கிறது; இது கண்டிக்கப்பட்ட பிறசமயச் சடங்குடன் தொடர்புடையது.
- source_word: כְּתֹעֲבוֹת
  choice: அருவருப்பான பழக்கங்களின்படி
  rationale: כְּ குறிக்கும் ஒப்புமை அல்லது ஒத்த நடத்தைத் தெரிவிக்கிறது. תֹּועֵבָה என்பதன் மத-ஒழுக்க வெறுப்புணர்வை “அருவருப்பான” என்பதும், இங்கு நடைமுறைகளைக் குறிக்கும் பன்மையை “பழக்கங்கள்” என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: הַגּוֹיִם
  choice: பிற தேசத்தார்
  rationale: இச்சூழலில் இஸ்ரவேலரல்லாத தேசங்களின் மக்களைக் குறிக்கிறது; “பிற தேசத்தார்” என்பது இயல்பான, நடுநிலையான நவீனத் தமிழ்.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: துரத்தியிருந்த
  rationale: הורישׁ இங்கு நாட்டிலிருந்து அகற்றுதல் அல்லது விரட்டுதல் என்ற பொருள் தருகிறது; முற்காலச் செயலைத் தமிழ் இறந்தகால முற்றுவினை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு முன்பாக இருந்து
  rationale: வார்த்தைநிலையிலுள்ள “இஸ்ரவேலின் மகன்கள்” என்பது இங்கு முழு இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீனத் தமிழில் “இஸ்ரவேல் மக்கள்” இயல்பாக அதையே தெரிவிக்கிறது; מִפְּנֵי-யின் அகற்றல் கருத்தை “முன்பாக இருந்து” தக்கவைக்கிறது.
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ என்பதை வெளிப்படையான குழந்தைப் பலியாக மொழிபெயர்ப்பதா, அல்லது எபிரெய மரபுத்தொடரைத் தக்கவைப்பதா
  choice: முதன்மை உரையில் “தன் மகனை நெருப்பினூடே கடக்கச் செய்தான்” என்று மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: “தன் மகனை நெருப்பில் பலியிட்டான்” அல்லது “தன் மகனை நெருப்பில் எரித்தான்”
  rationale: வசனம் கண்டிக்கப்பட்ட பிறசமயச் சடங்கைக் குறிப்பது தெளிவு. ஆயினும், இந்த எபிரெயச் சொற்றொடர் தனியாகவே சடங்கின் எல்லா விவரங்களையும் உறுதிப்படுத்தாது. ஆகவே அதன் உண்மையான தெளிவின்மையை முதன்மை உரை காக்கிறது; விளக்கவுரை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையுடனும் அமைக்கப்பட்டது. எபிரெய உருவகமும் சடங்கைச் சார்ந்த உண்மையான பொருள் தெளிவின்மையும் தக்கவைக்கப்பட்டுள்ளன.
