source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: ta
  text: ஆகாஸ் அசீரியாவின் அரசன் திக்லத்-பிலேசரிடம் தூதர்களை அனுப்பி, “உமது பணியாளனும் உமது மகனும் நான்.[a] வந்து, எனக்கு எதிராக எழுந்து நிற்கும் ஆராம் அரசனும் இஸ்ரவேல் அரசனும் ஆகியோரின் கையிலிருந்து[c] என்னைக் காப்பாற்றும்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமது பணியாளனும் உமது மகனும்” என்பது கீழ்ப்படிதலைத் தெரிவிக்கும் அரசியல் தூதரக மொழி; பொருள், “உமக்குக் கீழ்ப்பட்டவன்.”
    reason: lexical_alternative
  - marker: c
    text: “கையிலிருந்து” என்பது “அதிகாரத்திலிருந்து” அல்லது “பிடியிலிருந்து” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்தும் வினையெச்ச வடிவம்.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: அரசியல் சூழலில் மனிதச் செய்தியாளர்கள் அல்லது அரசத் தூதர்களைக் குறிக்கிறது; தேவதூதர்கள் அல்ல.
- source_word: תִּגְלַת פְּלֶסֶר מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன் திக்லத்-பிலேசர்
  rationale: அரசனின் பெயரையும் ஆட்சிப் பகுதியையும் தெளிவாகவும் தமிழில் இயல்பான சொல் வரிசையிலும் தருகிறது.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: உமது பணியாளனும் உமது மகனும்
  rationale: அரசியல் கீழ்ப்படிதலைக் குறிக்கும் பணிவுச் சொற்களை விளக்கமாக மாற்றாமல், மூலத்தின் பணியாளர் மற்றும் மகன் உருவகங்களைக் காக்கிறது.
- source_word: עֲלֵה
  choice: நீர் வந்து
  rationale: உதவிக்காகத் தன்னிடம் வருமாறு விடுக்கும் வேண்டுகோளை இயல்பான தமிழில் தருகிறது; ‘படையெடுத்து’ என்று மூலத்தில் வெளிப்படையாக இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: וְהוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: இங்கு அரசியல் மற்றும் இராணுவ ஆபத்திலிருந்து விடுவித்தலைக் குறிக்கும் எபிரெய வினையின் நேரடியான பொருளைத் தருகிறது.
- source_word: מִכַּף
  choice: கையிலிருந்தும்
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்கவாறு காக்கிறது.
- source_word: אֲרָם
  choice: ஆராம்
  rationale: பிற்கால ‘சிரியா’ என்ற பெயரை முதன்மை உரையில் இடாமல், மூலமொழியின் பண்டைய நிலப்பெயரைப் பாதுகாக்கிறது.
- source_word: הַקּוֹמִים עָלָי
  choice: எனக்கு எதிராக எழுந்து நிற்கிற
  rationale: தொடர்ந்து நடைபெறும் பகைமைச் செயலைக் காட்டும் எபிரெயப் பெயரெச்ச வடிவத்தையும் அதன் உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: ஆகாஸின் அரசியல் கீழ்ப்படிதலை வெளிப்படுத்தும் பணிவுச் சொற்கள்
  choice: ‘உமது பணியாளனும் உமது மகனும்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உமக்குக் கீழ்ப்பட்ட சிற்றரசன்’ அல்லது ‘உமது அடிமை’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: சூழல் அரசியல் கீழ்ப்படிதலை உணர்த்தினாலும், மூல உரை பணியாளர் மற்றும் மகன் என்ற இரு உறவுச் சொற்களையே பயன்படுத்துகிறது; அவற்றின் சொல்லாட்சியையும் உள்ளார்ந்த அழுத்தத்தையும் முதன்மை உரை காக்கிறது.
- issue: ‘காப்பாற்றும்’ என்பதன் பொருள்
  choice: விரிவான வேதாகமச் சொற்பொருள் தொடர்பைத் தக்கவைக்கும் வகையில் ‘காப்பாற்றும்’ பயன்படுத்தப்பட்டது.
  alternative: ‘இராணுவத் தாக்குதலிலிருந்து விடுவியும்’ அல்லது ‘மீட்டுக்கொள்ளும்’.
  rationale: இந்தச் சூழலில் வேண்டப்படுவது அரசியல்-இராணுவ விடுதலை; எனினும் மூல வினையின் பொருளைத் தேவையின்றி குறுக்காமல் ‘காப்பாற்றும்’ எனத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ மற்றும் வேண்டுகோள் வினைமுற்றான ‘காப்பாற்றும்’ அரசனிடம் பேசும் மரியாதைத் தொனியைப் பேணுகின்றன. பண்டைய பெயர்களுக்கு ‘அசீரியா,’ ‘ஆராம்,’ ‘திக்லத்-பிலேசர்’ என்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
