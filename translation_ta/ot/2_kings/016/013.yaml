base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: ta
  text: அவன் தனது தகனபலியையும் தானியபலியையும் எரித்தான்; தனது பானபலியை ஊற்றினான்; தனக்குரிய சமாதானப் பலிகளின்[a] இரத்தத்தைப் பலிபீடத்தின் மீது வீசினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்.’ எபிரெயச் சொல் (שְׁלָמִים) ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: பலிபீடத்தில் எரித்தான்
  rationale: கטר என்பதன் ஹிஃபில் வடிவம் பலியைப் பலிபீடத்தில் புகையாக எழச் செய்வதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்கும்படி ‘எரித்தான்’ என மொழிபெயர்க்கப்பட்டு, சடங்குச் சூழலைத் தெளிவாக்க ‘பலிபீடத்தில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: עֹלָתוֹ
  choice: தனது தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் குறிப்பிட்ட பலிவகை. தமிழில் நிலைபெற்ற ‘தகனபலி’ அந்தச் சடங்குப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: מִנְחָתוֹ
  choice: தனது தானியபலி
  rationale: இப்பலிச் சூழலில் מִנְחָה பொதுவான காணிக்கையை அல்ல, தானியத்தால் செய்யப்படும் பலிவகையைக் குறிக்கிறது.
- source_word: וַיַּסֵּךְ
  choice: ஊற்றினான்
  rationale: נסך பலிச் சடங்கில் திரவக் காணிக்கையை ஊற்றுவதைக் குறிக்கிறது; ‘ஊற்றினான்’ செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נִסְכּוֹ
  choice: தனது பானபலி
  rationale: נֶסֶךְ என்பது ஊற்றப்படும் திரவப் பலி. ‘பானபலி’ அதன் தனிப்பட்ட பலிவகையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וַיִּזְרֹק
  choice: வீசினான்
  rationale: זרק என்பது இரத்தத்தை மெதுவாகத் தெளிப்பதைவிட பலிபீடத்தின் மீது அல்லது அதற்கு எதிராக வீசும் செயலைக் குறிக்கலாம். ‘வீசினான்’ மூலவினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: דַּם הַשְּׁלָמִים
  choice: சமாதானப் பலிகளின் இரத்தம்
  rationale: שְׁלָמִים என்பது ஒரு குறிப்பிட்ட பலிவகை. ‘சமாதானப் பலிகள்’ மரபாக அறியப்படும் சொல்லாக இருப்பதால் முதன்மை உரையில் வைக்கப்பட்டு, பொருள்சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்குரிய
  rationale: இந்த எபிரெயச் சொற்றொடர் அவை அவனுக்குரிய பலிகள் என்பதைக் குறிக்கிறது. ‘தனக்குரிய’ என்பது உடைமை அல்லது தொடர்பை மிகைப்படுத்தாமல் சுருக்கமாகக் காக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் மீது
  rationale: זרק உடன் வரும் עַל, இரத்தம் பலிபீடத்தின் மீது அல்லது அதற்கு எதிராக வீசப்பட்டதைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘மீது’ தேர்ந்தெடுக்கப்பட்டுள்ளது; வினைச்சொல் செயல்வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: இந்த எபிரெயப் பெயருக்கு சமாதானம், உறவு, நல்வாழ்வு ஆகியவற்றோடு தொடர்புடைய பொருள்நிழல்கள் உள்ளன. எந்த ஒரு விளக்கத்தையும் இறுதியானதாகத் திணிக்காமல் மரபான பெயர் உரையில் வைக்கப்பட்டு மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பலிவகைகளுக்கான துல்லியமான சொற்கள் காக்கப்பட்டுள்ளன; சடங்குச் செயலை மென்மையாக்காமல் ‘வீசினான்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சமாதானப் பலிகள்’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
