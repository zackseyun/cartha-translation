  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: ta
  text: யாவேக்கு முன்பாக இருந்த வெண்கலப் பலிபீடத்தை[a] அவன் ஆலயத்தின் முன்புறத்திலிருந்து, பலிபீடத்திற்கும் யாவேயின் ஆலயத்திற்கும் நடுவிலிருந்து அப்புறப்படுத்தி, பலிபீடத்தின் வடக்குப் பக்கத்தில் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செம்புப் பலிபீடம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: נְחֹשֶׁת என்பது செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; ஆலயப் பொருட்களின் சூழலில் மரபாகவும் இயல்பாகவும் ‘வெண்கலம்’ பொருந்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக இருந்த
  rationale: לִפְנֵי என்பதன் இடம்சார் ‘முன்பாக’ என்ற பொருளைப் பேணுகிறது; יְהוָה என்பது ‘யாவே’ என்று பெயரெழுத்தாக்கப்படுகிறது.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: அவன் ஆலயத்தின் முன்புறத்திலிருந்து ... அகற்றி
  rationale: קרב அடிப்படையில் ‘அருகே கொண்டுவருதல்’ என்றாலும், இங்கு ஓர் இடத்திலிருந்து பலிபீடத்தை மாற்றியமைப்பதைக் குறிக்கிறது. ‘அகற்றி’ என்பது தொடக்க இடத்திலிருந்து நகர்த்திய செயலை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: அந்தப் பலிபீடத்திற்கும் யாவேயின் ஆலயத்திற்கும் நடுவிலிருந்து
  rationale: மீண்டும் வரும் מִבֵּין குறிக்கும் இடத்தைத் துல்லியமாகப் பேணுகிறது. בֵּית יְהוָה என்பதற்கு சூழலுக்கேற்ற இயல்பான தமிழாக ‘யாவேயின் ஆலயம்’ பயன்படுத்தப்படுகிறது.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: வைத்தான்
  rationale: נתן இங்கு ஒரு பொருளை ஓரிடத்தில் அமைத்தல் என்ற பொருளில் வருகிறது; ‘வைத்தான்’ எளிமையும் இயல்பும் உடையது.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: புதிய பலிபீடத்தின் வடக்குப் பக்கத்தில்
  rationale: יֶרֶךְ என்பதன் ‘பக்கம்’ மற்றும் צָפוֹנָה என்பதன் வடக்குத் திசை ஆகியவற்றைப் பேணுகிறது. எபிரெய உரையில் இரண்டாவது ‘பலிபீடம்’ வெளிப்படையாக ‘புதியது’ எனப்படாவிட்டாலும், முந்தைய வசனத்தின் சூழலில் அது ஆகாசு அமைத்த புதிய பலிபீடம் என்பதால், தமிழில் குறிப்புத் தெளிவுக்காக ‘புதிய’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறைநாமமான יְהוָה-வை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைநாமம் நேரடியாக உள்ளது; அதனை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று பெயரெழுத்தாக்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: לִפְנֵי יְהוָה என்பதன் இடம்சார் மற்றும் வழிபாட்டுச் சார்ந்த நுட்பம்
  choice: யாவேக்கு முன்பாக
  alternative: யாவேயின் சந்நிதியில்
  rationale: ‘முன்பாக’ என்பது பலிபீடத்தின் உடல் அமைவிடத்தையும், யாவேயின் முன்னிலையில் இருப்பதன் வழிபாட்டுச் சாயலையும் தீர்மானித்து விடாமல் பேணுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ஒரே வசனத்தில் பல ‘பலிபீடங்கள்’ வருவதால், முந்தைய சூழலை அடிப்படையாகக் கொண்டு இறுதி குறிப்பில் ‘புதிய பலிபீடம்’ எனத் தெளிவாக்கப்பட்டுள்ளது. ‘வீடு’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக ஆலயச் சூழலை இயல்பாக வெளிப்படுத்த ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
