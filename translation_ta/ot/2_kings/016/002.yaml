  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: ta
  text: ஆகாஸ் அரசனானபோது இருபது வயதுடையவனாக இருந்தான்; அவன் எருசலேமில் பதினாறு ஆண்டுகள் ஆட்சி செய்தான். அவன் தன் தந்தையான தாவீதைப் போல்[a], தன் கடவுளான யாவேவின் பார்வையில் சரியானதைச் செய்யவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தந்தை” என்பது ஆகாஸின் உடனடித் தந்தையை அல்ல, அவனுடைய முன்னோரான அரச வம்ச மூதாதை தாவீதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “யாவேவின் பார்வையில் செம்மையானதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: இருபது வயதுடையவனாக இருந்தான்
  rationale: எபிரேய வயதைக் குறிக்கும் மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: ஆகாஸ் அரசாட்சியைத் தொடங்கிய காலத்தைக் குறிக்கும் சொற்றொடர்; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரச பதவியை வெறுமனே வகித்ததைக் காட்டிலும் அரசனாக ஆட்சி புரிந்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ஆட்சியின் இடத்தைக் குறிக்கும் நேரடியான இடவியல் மொழிபெயர்ப்பு.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: நேர்மையானதைச் செய்யவில்லை
  rationale: அரசர்களில் மீண்டும் வரும் ஒழுக்க மதிப்பீட்டு வாய்பாட்டைப் புரியக்கூடிய, கண்ணியமான தமிழில் தருகிறது; ‘நேரானது/செம்மையானது’ என்ற சொல்லியல் நிழலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘கண்களில்’ என்று மொழிபெயர்ப்பதைவிட, ஒருவருடைய மதிப்பீட்டின்படி என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: ஆகாஸைக் குறிக்கும் ஒருமை ஆண்பால் உடைமைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: כְּדָוִד אָבִיו
  choice: தன் தந்தையான தாவீதைப் போல்
  rationale: மூலத்தின் ‘தந்தை’ என்ற உறவுச் சொல்லைப் பாதுகாக்கிறது; இங்கு அது உடனடித் தந்தையை அல்ல, அரச மரபின் முன்னோரைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல எபிரேய உரை நான்கெழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் தனிப்பட்ட பெயரை ஒலிபெயர்க்கிறது.
- issue: ‘அவன் தந்தையான தாவீது’ என்பதன் பொருள்
  choice: மூலத்தின் ‘தந்தை’ என்ற மொழியை முதன்மை உரையில் வைத்து, அது அரச மரபின் முன்னோரைக் குறிக்கும் என அடிக்குறிப்பில் விளக்குதல்
  alternative: அவன் முன்னோரான தாவீது
  rationale: ஆבִיו என்பதன் வடிவத்தை வெளிப்படையாகப் பாதுகாப்பதோடு, அரச வம்சச் சூழலில் உள்ள பொருளையும் தவறான உடனடி உறவாகப் புரிந்துகொள்ளாமல் விளக்குகிறது.
- issue: ‘யாவேவின் பார்வையில் நேர்மையானது’ என்ற மதிப்பீட்டு வாய்பாடு
  choice: உருவகத்தை இயல்பான தமிழில் ‘பார்வையில்’ எனக் காத்தல்
  alternative: யாவே சரியென்று கருதியதை
  rationale: இறை மதிப்பீட்டையே அளவுகோலாக வைக்கும் மூலத்தின் மொழியையும் அதன் இறையியல் அழுத்தத்தையும் விளக்கிப் பரப்பாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். அரசர் காலக்கணக்கு வாய்பாட்டின் சுருக்கமும், மூலத்தின் இறை மதிப்பீடும், ‘தந்தை’ என்ற வம்சவழிச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன.
