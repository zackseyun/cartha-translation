  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: ta
  text: பின்பு ஆகாஸ் அரசன் அசீரிய அரசனான திகிலாத்-பிலேசரைச் சந்திக்கத் தமஸ்குவுக்குச் சென்றான். தமஸ்குவில் இருந்த பலிபீடத்தை அவன் பார்த்தான். ஆகாஸ் அரசன் அந்தப் பலிபீடத்தின் மாதிரியையும், அதன் எல்லா வேலைப்பாடுகளின்படியான வடிவமைப்பையும் ஆசாரியனான உரியாவுக்கு அனுப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் மாதிரி
  rationale: דמות இங்கு நகலெடுக்க உதவும் தோற்றமாதிரி அல்லது வரைபடத்தைக் குறிக்கிறது; ‘மாதிரி’ என்பது பொருளைத் தீர்மானமாக்காமல் இயல்பாகத் தருகிறது.
- source_word: תַּבְנִיתוֹ
  choice: அதன் ... வடிவமைப்பு
  rationale: கட்டமைப்பு, வடிவம், திட்டம் ஆகிய நெருங்கிய கருத்துகளை உள்ளடக்கும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: அதன் எல்லா வேலைப்பாடுகளுக்கும் ஏற்ற
  rationale: பலிபீடம் செய்யப்பட்ட விதத்தின் முழு விவரத்தையும் குறிக்கும் எபிரெயச் சொற்றொடரின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் நிகழ்வுவரிசை மற்றும் அரசன், ஆசாரியன் ஆகிய பதவிப் பெயர்கள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
