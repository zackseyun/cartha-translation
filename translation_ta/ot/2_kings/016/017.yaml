base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: ta
  text: பின்பு ஆகாஸ் அரசன் தாங்கிகளின் சட்டக் கட்டமைப்புகளை வெட்டி அகற்றினான்; அவற்றின்மேலிருந்த கழுவுதொட்டியை[a] எடுத்துவிட்டான். மேலும், வெண்கல எருதுகளின்[b] மேல் இருந்த “கடல்”[c] என்பதை இறக்கி, கற்கள் பதித்த தரையின்மேல் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘கழுவுவதற்கான கலம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆலயப் பணியில் பயன்படுத்தப்பட்ட கழுவும் தொட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் பொதுவாக மாடுகளைக் குறிக்கக்கூடும்; இங்கு ‘வெண்கலக் காளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கடல்” என்பது சாலொமோனின் ஆலயத்திற்காகச் செய்யப்பட்ட மிகப்பெரிய தொட்டியின் பெயர் (1 இராஜாக்கள் 7:23–26 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: வெட்டி அகற்றி
  rationale: קצץ என்பது வெட்டித் துண்டித்தல் அல்லது வெட்டி அகற்றுதல் என்பதைக் குறிக்கிறது; இங்கு ஆலயப் பொருளின் பகுதிகளைப் பிரித்தெடுக்கும் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַמִּסְגְּרוֹת
  choice: சட்டங்களை
  rationale: מִסְגְּרוֹת என்பது தாங்கிகளிலுள்ள சட்டம் அல்லது விளிம்புச் சட்ட அமைப்புகளைக் குறிக்கிறது; ‘சட்டங்கள்’ நடுநிலையான கட்டமைப்புச் சொல்.
- source_word: הַמְּכֹנוֹת
  choice: தாங்கிகளின்
  rationale: ஆலயத் தொட்டிகளைத் தாங்கிய சக்கர அமைப்புள்ள அடித்தளங்களை இச்சொல் குறிக்கிறது; நவீன தமிழில் ‘தாங்கிகள்’ அவற்றின் பணியைத் தெளிவாகச் சொல்கிறது.
- source_word: הַכִּיּוֹר
  choice: கழுவுதொட்டியை
  rationale: ஆலயப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பாத்திரம் என்பதால், பொதுவான ‘தொட்டி’ என்பதைவிட ‘கழுவுதொட்டி’ அதன் பயன்பாட்டையும் தெளிவுபடுத்துகிறது.
- source_word: הַיָּם
  choice: “கடல்” தொட்டியை
  rationale: இது சாலொமோனின் ஆலயத்திலிருந்த மிகப்பெரிய தொட்டியின் பெயர்; ‘கடல்’ என்ற பெயரைப் பாதுகாத்தபடியே, அது ஒரு தொட்டி என்பதை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: הוֹרִד
  choice: இறக்கி
  rationale: ירד என்பதன் causative வடிவம் ஆதரவின் மேலிருந்து கீழே கொண்டுவருதலைக் குறிக்கிறது; ‘இறக்கி’ நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: வெண்கல எருதுகள்
  rationale: בָּקָר பொதுவாக மாடுகளைக் குறிக்கக்கூடும்; ஆலயத் தாங்கு உருவங்களின் சூழலில் மரபான ‘எருதுகள்’ பொருத்தமானது. נְחֹשֶׁת இங்கு ‘வெண்கலம்’.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: கற்கள் பதித்த தரையின்மேல்
  rationale: מַרְצֶפֶת என்பது கற்களால் பாவப்பட்ட அல்லது பதிக்கப்பட்ட பரப்பைக் குறிக்கிறது; உயர்ந்த மேடை என்ற கருத்தைச் சேர்க்காமல் சொல்கிறது.
