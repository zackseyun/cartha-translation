base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: ta
  text: அரசன் தமஸ்குவிலிருந்து வந்தான். அரசன் பலிபீடத்தைக் கண்டான். அரசன் பலிபீடத்தை நெருங்கி, அதன்மேல் ஏறினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசன் பலிபீடத்தை நெருங்கி, அதன்மேல் பலியிட்டான்.” “அதன்மேல் ஏறினான்” என்பது பலி செலுத்தத் தொடங்கியதைக் குறிக்கும் சுருக்கமான வெளிப்பாடு என்று சிலர் புரிந்துகொள்கிறார்கள். ஆனால் எபிரெயச் சொற்கள் மிக நேரடியாக பலிபீடத்தின்மேல் ஏறுதலைக் குறிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’. அடுத்தடுத்த செயல்களை இயல்பான தமிழ் உரைநடையில் இணைக்க, காலவினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் இச்சொல் மூன்று முறை வந்தாலும், இயல்பான தமிழுக்காக முதல் இரண்டு செயற்பாடுகள் ஒரே வாக்கியத்தில் இணைக்கப்பட்டன; அடுத்த முக்கிய செயலுக்கு ‘அரசன்’ மீண்டும் வைக்கப்பட்டது.
- source_word: מִדַּמֶּשֶׂק
  choice: தமஸ்குவிலிருந்து
  rationale: מִן தோற்ற இடத்தைக் குறிக்கிறது; דַּמֶּשֶׂק என்ற இடப்பெயர் வழக்கமான தமிழ்ப் பெயர்ப்பான ‘தமஸ்கு’ என வழங்கப்பட்டது.
- source_word: וַיַּרְא
  choice: பார்த்தான்
  rationale: ראה இங்கு நேரடியான பார்வையைக் குறிக்கிறது; ‘பார்த்தான்’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான தெளிவான, பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொல் ‘பலிபீடம்’.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தை நெருங்கி
  rationale: קרב என்பது ‘நெருங்குதல்’; அதனுடன் வரும் עַל இங்கு அணுகும் இலக்கைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் ‘பலிபீடத்தை நெருங்கி’ இயல்பாக உள்ளது.
- source_word: וַיַּעַל עָלָיו
  choice: அதன்மேல் ஏறினான்
  rationale: עלה உடன் עַל சேர்ந்திருப்பது மிக நேரடியாக மேலே/அதன்மேல் ஏறுவதைச் சுட்டுகிறது. பலியிடுதல் என்ற மறைபொருளை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: וַיַּעַל עָלָיו என்பது உடல்ரீதியாக ஏறியதைக் குறிக்கிறதா, அல்லது பலியிட்டதைக் குறிக்கும் சுருக்கமான வழக்கா?
  choice: ‘அதன்மேல் ஏறினான்’ என்ற நேரடிப் பொருள்
  alternative: ‘அதன்மேல் பலியிட்டான்’ அல்லது ‘அதனருகே ஏறிச் சென்றான்’
  rationale: עלה + עַל என்ற அமைப்பு நேரடியாக மேலே ஏறுவதை ஆதரிக்கிறது. பலிச் செயல் அடுத்த வசனத்தில் தெளிவாக வருகிறது; ஆகவே அதை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்க்காமல், மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிமையானதும் கண்ணியமானதும். மூல எபிரெயின் செயல் வரிசை காக்கப்பட்டுள்ளது; அதேவேளை மூன்று முறை வரும் ‘அரசன்’ என்பதைத் தமிழில் தேவையற்ற கடினமான மறுமொழியாக்காமல், முக்கிய இடத்தில் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
