base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: ta
  text: ஆகாஸ், யாவேயின் ஆலயத்திலும் அரச அரண்மனையின் கருவூலங்களிலும் இருந்த வெள்ளியையும் தங்கத்தையும் எடுத்து, அதை அசீரிய அரசனுக்கு கையூட்டாக[a] அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கப்பமாக” அல்லது “பரிசாக”; எபிரெயச் சொல் பொதுவாகக் கையூடு அல்லது லஞ்சம் என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருளான ‘எடுத்தான்’ என்பதைத் தமிழில் தொடர்வினையெச்சமாக இயல்பாக வழங்குகிறது.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: எபிரெய மூலத்தில் உள்ள இரு விலைமதிப்புள்ள உலோகங்களையும் உறுதியான பெயர்ச்சொற்களாகவே காக்கிறது.
- source_word: הַנִּמְצָא
  choice: இருந்த
  rationale: சொல்லுக்கு நேரடியாக ‘காணப்பட்ட’ எனினும், அந்த இடங்களில் கையிருப்பாக இருந்தவற்றைக் குறிக்கும் சூழலில் ‘இருந்த’ என்பது தெளிவான இயல்புத் தமிழ்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லளவில் ‘யாவேயின் வீடு’; இங்கு வழிபாட்டு ஆலயத்தைக் குறிப்பதால் ‘ஆலயம்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் பரவலான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனையின் கருவூலங்களிலும்
  rationale: אֹצְרוֹת என்பதன் பன்மையை ‘கருவூலங்கள்’ காக்கிறது; ‘அரசனின் வீடு’ என்பதன் சூழல்பொருளை இயல்பான தமிழில் ‘அரச அரண்மனை’ என வழங்குகிறது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: கதைநடையில் உள்ள எளிய இறந்தகாலச் செயலைத் தெளிவாக வழங்குகிறது.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுக்கு
  rationale: எபிரெய இணைப்புத் தொடரின் பொருளை இயல்பான தமிழ் வேற்றுமை அமைப்பில் தருகிறது.
- source_word: שֹׁחַד
  choice: கையூட்டாக
  rationale: இந்தச் சொல் பொதுவாக முறைகேடாக ஒருவரின் ஆதரவைப் பெற அளிக்கப்படும் லஞ்சம் அல்லது கையூட்டைக் குறிக்கிறது; அரசியல் சூழலில் ‘கையூடு’ பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலம் தனிப்பட்ட திருநாமத்தையே பயன்படுத்துவதால், அதைப் பட்டப்பெயராக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் காக்கிறது.
- issue: שֹׁחַד என்ற கொடுப்பனவின் ஒழுக்க மற்றும் அரசியல் நுண்ணுணர்வு
  choice: கையூடு
  alternative: கப்பம் அல்லது அன்பளிப்பு
  rationale: மூலச்சொல்லின் வழக்கமான எதிர்மறை நுண்ணுணர்வை மறைக்காமல் காக்கிறது; இருப்பினும் இச்சூழலில் அரசியல் கொடுப்பனவு அல்லது கப்பம் என்ற வாசிப்புக்கும் இடமுண்டு.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘யாவேயின் வீடு’ என்ற சொல்லளவிலான வடிவத்திற்குப் பதிலாக சூழலுக்கேற்ற ‘யாவேயின் ஆலயம்’ என்றும், ‘அரசனின் வீடு’ என்பதற்கு ‘அரச அரண்மனை’ என்றும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு [a] உரையில் இடம்பெற்றுள்ளது.
