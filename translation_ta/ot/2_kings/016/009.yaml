  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: ta
  text: எனவே அசீரிய அரசன் அவனுக்குச் செவிகொடுத்தான்[a]. அசீரிய அரசன் தமஸ்குவுக்கு எதிராகப் படையெடுத்துச் சென்று, அதைக் கைப்பற்றி, அதன் மக்களைக் கீருக்கு நாடுகடத்தி[b], ரெத்சீனைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய வேண்டுகோளை ஏற்றுக்கொண்டான்.’ எபிரெய வினைச்சொல், கேட்டதற்கு இணங்கச் செயல்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அதை கீருக்கு நாடுகடத்தினான்.’ இங்கு நகரம் அதன் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: அவனுக்குச் செவிகொடுத்தான்
  rationale: שׁמע + אֶל என்பது ஒருவரது வேண்டுகோளைக் கேட்டு அதற்கேற்ப செயல்படுவதைக் குறிக்கலாம். ‘செவிகொடுத்தான்’ என்பது பதிலளிக்கும் செயலின் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கூட்டுச்சொல்லின் நேரான, இயல்பான தமிழாக்கம். மூலத்தில் உள்ள மீளுரைப்பைத் தக்கவைக்க இரு இடங்களிலும் முழுச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: தமஸ்குவுக்கு எதிராகப் படையெடுத்துச் சென்று
  rationale: இராணுவச் சூழலில் עלה ... אֶל ஒரு நகருக்கு எதிராக முன்னேறிச் செல்வதைக் குறிக்கிறது; தொடரும் கைப்பற்றுதல், நாடுகடத்துதல் ஆகிய செயல்களும் இதை உறுதிப்படுத்துகின்றன.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: அதைக் கைப்பற்றி
  rationale: תפשׂ இங்கு நகரைக் கைப்பற்றி கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் குறிக்கிறது. பெண்பால் பின்னொட்டு தமஸ்குவைக் குறிக்கிறது.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: அதன் மக்களைக் கீருக்கு நாடுகடத்தி
  rationale: சொல்லளவில் ‘அதை கீருக்கு நாடுகடத்தினான்’ என்றிருந்தாலும், நகரம் அதன் குடிமக்களைக் குறிக்கும் ஆகுபெயராக உள்ளது. இயல்பான தமிழுக்காக ‘அதன் மக்களை’ என்று வெளிப்படுத்தப்பட்டது; திசைநோக்குப் பின்னொட்டு ‘கீருக்கு’ எனக் காட்டப்பட்டது.
- source_word: קִירָה
  choice: கீர்
  rationale: இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת רְצִין הֵמִית
  choice: ரெத்சீனைக் கொன்றுபோட்டான்
  rationale: המית என்பது ‘சாகச் செய்தல், கொல்லுதல்’ என்று பொருள்படும். அரசனால் நிறைவேற்றப்பட்ட திட்டமிட்ட கொலையின் வலிமையை ‘கொன்றுபோட்டான்’ இயல்பாக வெளிப்படுத்துகிறது.
