translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-விவரிப்பு நடை பயன்படுத்தப்பட்டது. மூலத்தின் ‘அசீரிய அரசன்’ என்ற மீளுரை பாதுகாக்கப்பட்டது; நகரைக் குடிமக்களுக்கான ஆகுபெயராகப் பயன்படுத்தும் எபிரெய அமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
