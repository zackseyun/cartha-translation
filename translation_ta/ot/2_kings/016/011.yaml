- from: ஆகவே ஆசாரியனாகிய உரியா அந்தப் பலிபீடத்தைக் கட்டினான். தமஸ்குவிலிருந்து அரசன் ஆகாஸ் அனுப்பியிருந்த எல்லா விவரங்களின்படியே, அரசன் ஆகாஸ் தமஸ்குவிலிருந்து திரும்பிவருவதற்குள் ஆசாரியனாகிய உரியா அதைச் செய்து முடித்தான்.[a]
  to: ஆசாரியன் உரியா அந்தப் பலிபீடத்தை, அரசன் ஆகாஸ் தமஸ்குவிலிருந்து அனுப்பிய எல்லாவற்றின்படியும் கட்டினான். அரசன் ஆகாஸ் தமஸ்குவிலிருந்து வரும்வரை ஆசாரியன் உரியா அவ்வாறே செய்தான்.[a]
  rationale: மூலத்தின் செயல்வரிசை, மீண்டும் வரும் பெயரடைத் தொடர்கள், மற்றும் ‘வரும்வரை’ என்ற கால எல்லை ஆகியவை காக்கப்பட்டுள்ளன. நிறைவுறுத்தல், திரும்பி வருதல், மற்றும் ‘விவரங்கள்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத விளக்கச் சேர்க்கைகள் நீக்கப்பட்டுள்ளன. அடிக்குறிப்பு כֵּן עָשָׂה என்பதன் வலியுறுத்தலைச் சுருக்கமாகத் தெளிவுபடுத்துகிறது.
