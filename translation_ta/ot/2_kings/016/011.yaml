- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: בנה என்பதன் இயல்பான பொருள் ‘கட்டு’; பலிபீடத்தை அமைத்த செயலை நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: כהן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணைச்சொல் ‘ஆசாரியன்’. எபிரெய மூலத்தில் உரியாவுடன் இருமுறை வரும் அடைமொழி இரு இடங்களிலும் தக்கவைக்கப்பட்டது.
- source_word: הַמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்தை
  rationale: מזבח என்பது பலி செலுத்தும் பீடம். முந்தைய சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட பலிபீடத்தைச் சுட்டுவதால் எபிரெய வரையறைச் சுட்டு ‘அந்த’ என வெளிப்படுத்தப்பட்டது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனுப்பியிருந்த எல்லா விவரங்களின்படியே
  rationale: இந்தத் தொடர் முழுமையான ஒத்திசைவைச் சுட்டுகிறது. முந்தைய வசனத்தில் அனுப்பப்பட்டது பலிபீடத்தின் வடிவமும் மாதிரியும் என்பதால், தமிழில் இயல்பாக ‘எல்லா விவரங்கள்’ எனக் கூறப்பட்டுள்ளது; ‘-படியே’ துல்லியமான பின்பற்றலை வலியுறுத்துகிறது.
- source_word: שָׁלַח
  choice: அனுப்பியிருந்த
  rationale: பலிபீடம் கட்டப்படுவதற்கு முன்னரே ஆகாஸ் அனுப்பிய செயலை நிறைவுற்ற முன்நிகழ்வாகக் காட்டுகிறது.
- source_word: מִדַּמֶּשֶׂק / מִדַּמָּשֶׂק
  choice: தமஸ்குவிலிருந்து
  rationale: מִן மூலத்தையோ புறப்பட்ட இடத்தையோ குறிக்கிறது; இரு நிகழ்வுகளிலும் ‘தமஸ்குவிலிருந்து’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: כֵּן עָשָׂה
  choice: அதைச் செய்து முடித்தான்
  rationale: இத்தொடர் உரியா அரசனின் விவரங்களுக்கு ஏற்ப செயல்பட்டதை வலியுறுத்துகிறது. עַד בּוֹא உடன் இணைந்த சூழலில், அரசன் வருமுன் கட்டுமானத்தை நிறைவேற்றியதாக இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַד בּוֹא
  choice: திரும்பிவருவதற்குள்
  rationale: עַד + בוא அரசன் வருகையை கால எல்லையாகக் குறிக்கிறது. தமஸ்குவிலிருந்து வந்ததால் தமிழில் இயல்பாக ‘திரும்பிவருவதற்குள்’ என வழங்கப்பட்டது.
- source_word: הַמֶּלֶךְ אָחָז
  choice: அரசன் ஆகாஸ்
  rationale: மன்னருக்கான பட்டமும் இயற்பெயரும் நவீனத் தமிழின் இயல்பான வரிசையில் வழங்கப்பட்டன.
