translation:
  language: ta
  text: ஆசாரியன் உரியா அந்தப் பலிபீடத்தை, அரசன் ஆகாஸ் தமஸ்குவிலிருந்து அனுப்பிய எல்லாவற்றின்படியும் கட்டினான். அரசன் ஆகாஸ் தமஸ்குவிலிருந்து வரும்வரை ஆசாரியன் உரியா அவ்வாறே செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படியே செய்தான்.” எபிரெயத் தொடர், ஆகாஸ் அனுப்பியதற்கு உரியா முழுமையாக இணங்கிச் செயல்பட்டதை வலியுறுத்துகிறது.
    reason: lexical_alternative
