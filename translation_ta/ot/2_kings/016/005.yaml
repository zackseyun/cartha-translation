base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: ta
  text: அப்போது அராம் அரசன் ரெசீனும், ரெமலியாவின் மகனும் இஸ்ரவேல் அரசனுமான பெக்காவும் போர் செய்வதற்காக எருசலேமுக்கு வந்தனர். அவர்கள் ஆகாசுக்கு எதிராக முற்றுகையிட்டனர்; ஆனால் அவர்களால் போரிட முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் “போரிட” என்ற வினைக்குப் பின் அதன் பொருள் குறிப்பிடப்படவில்லை. அது ஆகாசையையோ எருசலேமையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: தொடர்ந்து நிகழும் சம்பவத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் காலச் சுட்டு.
- source_word: יַעֲלֶה
  choice: வந்தனர்
  rationale: எருசலேமை நோக்கிய இராணுவ நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெய உரையில் வினை ஒருமையில் இருந்தாலும், இணைந்த இரு எழுவாய்களுக்கு ஏற்ப தமிழில் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: அராம் அரசன் ரெசீன்
  rationale: אֲרָם என்பதைக் ‘சீரியா’ என்று காலத்திற்குப் பிந்தைய பெயரால் மாற்றாமல், மூலத்தின் இன-புவியியல் பெயராகவே தருகிறது.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: ரெமலியாவின் மகனான இஸ்ரவேல் அரசன் பெக்கா
  rationale: தந்தை வழிப் பெயரையும் அரச பட்டத்தையும் தெளிவான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: போர் செய்வதற்காக எருசலேமுக்கு
  rationale: செல்லும் இடத்தையும் இராணுவ நோக்கத்தையும், மூலத்தில் இல்லாத கூடுதல் விளக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: וַיָּצֻרוּ עַל־אָחָז
  choice: அவர்கள் ஆகாசை முற்றுகையிட்டனர்
  rationale: צור என்பதன் இராணுவச் சூழலுக்குரிய ‘முற்றுகையிடு’ என்ற பொருளையும், ஆகாசை நேரடி பொருளாகக் கொண்ட தமிழ் வாக்கிய அமைப்பையும் பயன்படுத்துகிறது.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: ஆனால் அவர்களுக்கு எதிராகப் போரிட முடியவில்லை
  rationale: இயலாமையைத் தெரிவிக்கிறது; எபிரெய இறுதி வினைக்குப் பின் பொருள் வெளிப்படையாக மீண்டும் கூறப்படாததால், தமிழில் பன்மைப் பிரதிப்பெயர் மூலம் அந்தத் தெளிவின்மையை ஓரளவு தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதி ‘போரிட’ வினையின் மறைந்த பொருள்
  choice: ‘அவர்களுக்கு எதிராக’ என்று பன்மைப் பிரதிப்பெயரைப் பயன்படுத்தி, ஆகாசையோ எருசலேமையோ மட்டும் தீர்மானிக்காமல் விடப்பட்டது.
  alternative: ‘அவனுக்கு எதிராக’ என்று ஆகாசைக் குறிப்பது; அல்லது ‘அதற்கு எதிராக’ என்று எருசலேமைக் குறிப்பது.
  rationale: எபிரெய உரை לְהִלָּחֵם என்பதற்குப் பின் பொருளை வெளிப்படையாகக் கூறவில்லை. உடனடி இலக்கணச் சூழல் ஆகாசை நோக்கலாம்; இணைச் செய்தியான ஏசாயா 7:1 எருசலேமை நோக்குகிறது. ஆகவே உண்மையான உரைத் தெளிவின்மையை அடிக்குறிப்புடன் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் வடிவமைக்கப்பட்டது. அரச பட்டங்களும் இடப்பெயர்களும் நேரடியாகவும் இயல்பாகவும் தரப்பட்டுள்ளன; இறுதி வாக்கியத்தின் மூலமொழித் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
