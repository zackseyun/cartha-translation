  text: וַ/יִּשְׁכַּ֤ב אָחָז֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ חִזְקִיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: ta
  text: ஆகாஸ் தன் முன்னோர்களோடு துயிலடைந்து, தாவீதின் நகரத்தில் தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டான்.[a] அவனுக்குப் பதிலாக அவன் மகன் எசேக்கியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களோடு துயிலடைந்தான்” என்பது ஆகாஸ் இறந்து தன் முன்னோர்களுடன் சேர்ந்ததைக் குறிக்கும் வழக்கமான எபிரெய அரச மரண அறிவிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்து
  rationale: இது அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். ‘இறந்தான்’ என்று பொருளை மட்டும் கூறாமல், மூலத்தின் உருவகத்தையும் அரச வரலாற்றுச் சூத்திரத்தின் தன்மையையும் காக்கிறது; ‘பிதாக்கள்’ என்பதைக் காட்டிலும் ‘முன்னோர்கள்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிஃபால் வினை வடிவத்தின் செயப்பாட்டு பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயரின் பொருளையும் எபிரெய இணைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: வாரிசுரிமை அறிவிப்பில் מלך அரசாட்சியை ஏற்றதைக் குறிக்கிறது. ‘அரசாண்டான்’ என்பதும் சாத்தியம்; ஆனால் תַּחְתָּיו உடன் ‘அவனுக்குப் பதிலாக ... அரசனானான்’ என்பது தமிழில் இயல்பாக அரச வாரிசுமுறையை வெளிப்படுத்துகிறது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: בְּנוֹ
  choice: அவன் மகன்
  rationale: மூலத்தில் உள்ள தந்தை–மகன் உறவை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுச் சூழலில் ஒருவரின் இடத்தை மற்றவர் ஏற்றுக்கொள்வதை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ‘முன்னோர்களோடு துயிலடைந்தான்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: உருவக மரபுத்தொடரை முதன்மை உரையில் வைத்தல்
  alternative: ‘இறந்தான்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயத்தின் நிலையான அரச மரண அறிவிப்பையும் அதன் இலக்கியத் தொடர்புகளையும் காக்கிறது; மரணத்திற்குப் பிந்தைய நிலை குறித்த மேலதிக கோட்பாட்டை உரையில் புகுத்தாமல், பொருளை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். அரச வரலாற்றின் சுருக்கமான அறிவிப்பு நடை காக்கப்பட்டுள்ளது; எபிரெய மரபுத்தொடர் இயல்பான தமிழில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
