  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: ta
  text: ஆலயத்தில் அவர்கள் கட்டியிருந்த ஓய்வுநாளுக்கான மூடப்பட்ட அமைப்பையும்[a], அரசனின் வெளிப்புற நுழைவாயிலையும்[b], அசீரிய அரசன் காரணமாக[d], அவன் யாவேயின் ஆலயத்திலிருந்து மாற்றினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாளுக்கான மூடப்பட்ட கட்டமைப்பு,” “ஓய்வுநாள் மண்டபம்,” அல்லது “ஓய்வுநாள் முகப்பு மண்டபம்.” இதற்கான எபிரெயக் கட்டடக்கலைச் சொல்லின் துல்லியப் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசனுக்குரிய வெளிப்புற நுழைவாயில்” அல்லது “அரசனுக்கான வெளிப்புற நுழைவிடம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “திருப்பிவிட்டான்,” “விலக்கினான்,” அல்லது “இடமாற்றினான்.” இங்கு வரும் எபிரெய வினைச்சொல், முற்றிலும் அகற்றுவதை மட்டுமல்லாமல் ஒன்றைத் திருப்புவதையோ அதன் இடம் அல்லது அமைப்பை மாற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “அசீரிய அரசனை முன்னிட்டு”; ஒருவேளை, “அசீரிய அரசனுக்குப் பயந்து.”
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: ஓய்வுநாளுக்கான மூடப்பட்ட நடைவழி
  rationale: מיסך என்பது அரிதான கட்டடக்கலைச் சொல். மூடிய அமைப்பு அல்லது நடைவழி என்ற பொதுவான கருத்தை இச்சொற்றொடர் இயல்பான தமிழில் தருகிறது; அதன் துல்லியமான வடிவம் உறுதியற்றதால் அடிக்குறிப்பில் மாற்றுகள் தரப்படுகின்றன.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: ஆலயத்தில் அவர்கள் கட்டியிருந்த
  rationale: בָּנוּ என்பதிலுள்ள குறிப்பிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ எனத் தக்கவைத்து, சூழலில் בַבַּיִת குறிக்கும் ஆலயத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: அரசனுக்குரிய வெளிப்புற நுழைவாயில்
  rationale: מְבוֹא என்பது நுழைவிடம் அல்லது நுழைவாயில். அரசன் பயன்படுத்திய வெளிப்புற அணுகுவழி என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֵסֵב
  choice: மாற்றினான்
  rationale: סבב என்பதன் ஹிஃபீல் வடிவம் திருப்புதல், விலக்குதல், இடமாற்றுதல் அல்லது அமைப்பை மாற்றுதல் ஆகியவற்றைக் குறிக்கலாம். ‘மாற்றினான்’ என்பது முழுமையாக அகற்றினான் என்று மிகைப்படுத்தாமல் இவ்வர்த்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בית יהוה என்பதை நவீன தமிழில் இயல்பாகவும் சூழலுக்கேற்றவாறும் தருகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனின் காரணமாக
  rationale: מִפְּנֵי இங்கு காரணத்தையோ ஒருவரின் முன்னிலையில் ஏற்பட்ட அழுத்தத்தையோ குறிக்கலாம். ‘காரணமாக’ என்பது பயம் என்ற நோக்கத்தைத் தீர்மானித்துச் சேர்க்காத பரந்த மொழிபெயர்ப்பு.
theological_decisions:
- issue: அசீரிய அரசனால் ஏற்பட்ட காரணம் அல்லது உந்துதல்
  choice: அசீரிய அரசனின் காரணமாக
  alternative: அசீரிய அரசனுக்குப் பயந்து
  rationale: மூலமொழி காரணத்தைக் காட்டுகிறது; ஆனால் ஆகாசின் உள்ளார்ந்த நோக்கம் பயம்தான் என்று கட்டாயப்படுத்தவில்லை.
- issue: ஆலய அம்சங்களுக்கு செய்யப்பட்ட மாற்றத்தின் தன்மை
  choice: மாற்றினான்
  alternative: அகற்றினான் / திருப்பிவிட்டான் / இடமாற்றினான்
  rationale: הֵסֵב என்பதன் பரந்த பொருளையும், செய்யப்பட்ட கட்டட மாற்றத்தின் துல்லிய தன்மை குறித்த தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான கட்டடக்கலைச் சொல்லும் ஆகாசின் நோக்கமும் உறுதியாகத் தீர்மானிக்கப்படாமல், மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
