    reason: דִּבְרֵי הַיָּמִים என்ற சொற்றொடரை ‘நாளாகமம்’ என்றும் ‘வரலாற்றுப் பதிவேடு’ என்றும் பொருத்தமாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אָחָז אֲשֶׁר עָשָׂה
  choice: ஆகாஸ் செய்த மற்ற செயல்கள்
  rationale: יֶתֶר என்பது எஞ்சியவற்றை அல்லது மற்றவற்றைக் குறிக்கிறது; דִּבְרֵי என்பது இந்த அரச வரலாற்றுச் சுருக்கச் சூத்திரத்தில் அரசனின் செயல்களைக் குறிக்கிறது. אֲשֶׁר עָשָׂה என்ற உறவுத்தொடரை இயல்பான நவீன தமிழில் பெயரெச்சத் தொடராக அமைத்துள்ளது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய வினாவையும், כְּתוּבִים என்பதன் எழுத்துப்பூர்வமான பதிவு என்ற பொருளையும் காக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொல்லளவில் ‘புத்தகத்தின்/சுருளின் மேல்’ என்றிருந்தாலும், ஆவணத்தில் உள்ள பதிவைக் குறிப்பிடுவதற்கு ‘புத்தகத்தில்’ என்பது இயல்பான தமிழ்.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகம்
  rationale: அரசர்களைப் பற்றிய காலவரிசைப் பதிவைக் குறிக்கும் தலைப்புப் போன்ற தொடரைத் தெளிவாகவும் மரபான வேதாகமத் தமிழுக்கு இணக்கமாகவும் தருகிறது; לְ இங்கு தொடர்பைச் சுட்டுவதால் ‘அரசர்களின்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָחָז
  choice: ஆகாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது.
