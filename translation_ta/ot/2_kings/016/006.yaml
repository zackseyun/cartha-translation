base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: ta
  text: அந்தக் காலத்தில் அராமின் அரசன் ரெசீன், ஏலாத்தை மீண்டும் அராமின் கட்டுப்பாட்டுக்குள் கொண்டுவந்தான். அவன் ஏலாத்திலிருந்து[a] யூதா மக்களைத் துரத்திவிட்டான். அராமியர்கள்[b] ஏலாத்துக்கு வந்து, இந்நாள்வரை அங்கே குடியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் இவ்விடப்பெயர் இங்கு எபிரெயத்தில் ‘ஏலோத்’ என்ற மாற்று எழுத்துவடிவத்தில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மசோரா மெய்யெழுத்துப் பாடம்: ‘அராமியர்கள்.’ சில பழைய சாட்சிகளும் உரைவிளக்குநர்களும் ‘ஏதோமியர்கள்’ என்ற வாசிப்பை ஆதரிக்கின்றனர்; 2 நாளாகமம் 28:17-ன் இணைச் சூழலும் அந்த வாசிப்புக்கு ஏற்றதாகக் கருதப்படுகிறது.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵשִׁיב ... אֶת־אֵילַת לַאֲרָם
  choice: ஏலாத்தை மீண்டும் அராமின் கட்டுப்பாட்டுக்குள் கொண்டுவந்தான்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு ஏலாத்தை அராமின் ஆட்சிக்கோ கட்டுப்பாட்டுக்கோ திரும்பக் கொண்டுவருவதைக் குறிக்கிறது. சொற்சொல்லான ‘திரும்பச் செய்தான்’ என்பதைக் காட்டிலும் இத்தேர்வு அரசியல்-இராணுவச் சூழலை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֵילַת / אֵילוֹת
  choice: ஏலாத்
  rationale: ஒரே இடப்பெயர் இவ்வசனத்தில் இரண்டு எபிரெய எழுத்துவடிவங்களில் வருகிறது. தமிழில் பரவலாகவும் தெளிவாகவும் ஒலிபெயர்க்கக்கூடிய ‘ஏலாத்’ முதன்மை வடிவமாக வைக்கப்பட்டு, ‘ஏலோத்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַאֲרָם
  choice: அராமின் கட்டுப்பாட்டுக்குள்
  rationale: இச்சொற்றொடர் உடைமை அல்லது அரசியல் கட்டுப்பாடு அராமுக்குத் திரும்பியதைச் சுட்டுகிறது. ‘சீரியா’ என்ற பிற்காலப் பெயருக்குப் பதிலாக எபிரெயப் பெயரான ‘அராம்’ பாதுகாக்கப்படுகிறது.
- source_word: וַיְנַשֵּׁל
  choice: துரத்திவிட்டான்
  rationale: இவ்வினை ஒரு இடத்தின் உடைமை அல்லது குடியிருப்பிலிருந்து மக்களை அகற்றுவதைக் குறிக்கிறது. ‘துரத்திவிட்டான்’ அதன் வலிமையையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: הַיְהוּדִים
  choice: யூதா மக்கள்
  rationale: அரசாட்சி காலச் சூழலில் இது யூதா நாட்டைச் சேர்ந்த மக்களைக் குறிக்கிறது. பிற்கால சமய-இனப் பொருளை முன்னிறுத்தக்கூடிய ‘யூதர்கள்’ என்பதற்குப் பதிலாக வரலாற்றுச் சுட்டைத் தெளிவாக்கும் ‘யூதா மக்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: וַאֲרָמִים
  choice: அராமியர்கள்
  rationale: மசோரா மெய்யெழுத்துப் பாடம் ‘அராமியர்கள்’ என்று வாசிக்கிறது. ‘ஏதோமியர்கள்’ என்ற குறிப்பிடத்தக்க மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை அங்கே குடியிருக்கிறார்கள்
  rationale: நிகழ்வு நடந்த காலத்திலிருந்து நூலாசிரியரின் காலம்வரை தொடர்ந்த குடியிருப்பை எபிரெயச் சொற்றொடர் குறிக்கிறது. தமிழ் நிகழ்கால வடிவம் அந்தத் தொடர்ச்சியான நிலையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றிலுள்ள இனப்பெயரின் பாடவேறுபாடு
  choice: அராமியர்கள் ஏலாத்துக்கு வந்தார்கள்
  alternative: ஏதோமியர்கள் ஏலாத்துக்கு வந்தார்கள்
  rationale: மசோரா மெய்யெழுத்துப் பாடத்தில் ‘அராமியர்கள்’ உள்ளது; ஆகவே அதுவே முதன்மை உரையில் வைக்கப்படுகிறது. ஆயினும், சில பழைய சாட்சிகளும் 2 நாளாகமம் 28:17-ன் சூழலும் ‘ஏதோமியர்கள்’ என்ற வாசிப்புக்கு ஆதரவாகக் கருதப்படுவதால், வரலாற்றுத் தெளிவின்மையை மறைக்காமல் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அராம்,’ ‘அராமியர்கள்,’ ‘யூதா மக்கள்’ ஆகிய வடிவங்கள் பண்டைய அரசியல்-இனச் சூழலைப் பாதுகாக்கின்றன; பாடவேறுபாடு முதன்மை உரையில் தீர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
