base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: ta
  text: 'பின்பு அகாஸ் அரசன் ஊரியா ஆசாரியருக்குக் கட்டளையிட்டு, கூறினான்: “பெரிய பலிபீடத்தின்மேல் காலையின் தகனபலியையும் மாலையின் தானியக் காணிக்கையையும், அரசனுடைய தகனபலியையும் அவனுடைய தானியக் காணிக்கையையும், நாட்டின் மக்கள் அனைவருடைய தகனபலியையும் அவர்களுடைய தானியக் காணிக்கைகளையும் பானக் காணிக்கைகளையும் செலுத்து. தகனபலியின் இரத்தம் முழுவதையும் பலியின் இரத்தம் முழுவதையும் அதன்மேல் தெளி. ஆனால் வெண்கலப் பலிபீடம் நான் விசாரிப்பதற்காக இருக்கட்டும்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பரிசோதிப்பதற்காக,” “கவனிப்பதற்காக,” அல்லது “வழிகாட்டுதல் தேடுவதற்காக.” இங்குள்ள எபிரெயச் சொற்றொடர் புரிந்துகொள்ளக் கடினமானது; வெண்கலப் பலிபீடத்திற்கு அகாஸ் ஒதுக்கிய துல்லியமான பணி உறுதியாகத் தெரியவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: பின்பு அகாஸ் அரசன் ஊரியா ஆசாரியனுக்குக் கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளைப் பொருளைத் தக்கவைத்து, தமிழில் இயல்பான அரசப் பட்டப்பெயர் மற்றும் மறைமுக உரை அறிமுக அமைப்பைப் பயன்படுத்துகிறது.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: பெரிய பலிபீடத்தின்மேல்
  rationale: புதிதாக அமைக்கப்பட்ட பலிபீடத்தை வெண்கலப் பலிபீடத்திலிருந்து வேறுபடுத்தும் גדל என்ற பெயரடையையும் על என்ற இடப்பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַקְטֵר
  choice: செலுத்து
  rationale: Hiphil வடிவம் பலியைப் பலிபீடத்தில் எரித்துப் புகையாக எழச்செய்வதைக் குறிக்கிறது; பட்டியலிடப்பட்ட பலிவகைகளுடன் இயல்பாகப் பொருந்தும் பொதுவான பலியிடும் வினையாக ‘செலுத்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֹלַת הַבֹּקֶר וְאֶת מִנְחַת הָעֶרֶב
  choice: காலையின் தகனபலியையும் மாலையின் தானியக் காணிக்கையையும்
  rationale: עֹלָה என்பதை முழுவதும் எரிக்கப்படும் பலியாக ‘தகனபலி’ என்றும், பலிச் சூழலில் מִנְחָה என்பதைத் தெளிவாக ‘தானியக் காணிக்கை’ என்றும் வேறுபடுத்துகிறது.
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: அரசனுடைய தகனபலியையும் அவனுடைய தானியக் காணிக்கையையும்
  rationale: எபிரெய உரையின் உடைமைத் தொடர்பையும், பின்னொட்டு அரசனையே சுட்டுவதையும் பாதுகாக்கிறது.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவருடைய தகனபலியையும்
  rationale: עם הארץ என்பதை இங்கு ஒரு குறிப்பிட்ட சமூக வகுப்பாகக் குறுக்காமல், நாட்டின் மொத்த மக்களைக் குறிக்கும் கூட்டுப்பெயராக மொழிபெயர்க்கிறது.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: அவர்களுடைய தானியக் காணிக்கைகளையும் பானக் காணிக்கைகளையும்
  rationale: பன்மை உடைமைப் பின்னொட்டுகளையும் காணிக்கை வகைகளுக்கிடையேயான வேறுபாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: தகனபலியின் இரத்தம் முழுவதையும் மற்ற பலிகளின் இரத்தம் முழுவதையும்
  rationale: இரு இரத்த வகைகளின் இணை அமைப்பைப் பாதுகாக்கிறது; זֶבַח இங்கு தகனபலியிலிருந்து வேறுபடும் பலிகளைப் பொதுவாகக் குறிப்பதால் ‘மற்ற பலிகள்’ எனத் தரப்பட்டுள்ளது.
- source_word: עָלָיו תִּזְרֹק
  choice: அதன்மேல் தெளி
  rationale: זרק பலியிரத்தத்தைப் பலிபீடத்தின் மீது செலுத்தும் செயலைக் குறிக்கிறது. ‘தெளி’ என்பது நவீன தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலில் புரியத்தக்கதாகவும் உள்ளது; சுட்டுப்பெயர் பெரிய பலிபீடத்தைக் குறிக்கிறது.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה לִּי לְבַקֵּר
  choice: ஆனால் வெண்கலப் பலிபீடம் நான் விசாரிப்பதற்காக இருக்கட்டும்
  rationale: புதிய பலிபீடத்தின் வழக்கமான பலிப்பயன்பாட்டுடன் பழைய வெண்கலப் பலிபீடத்தின் தனிப்பட்ட நோக்கத்தை எதிர்நிறுத்துகிறது; கடினமான לבקר என்பதன் உறுதியற்ற பொருளைத் தீர்மானமாக்காமல் ‘விசாரிப்பது’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: வெண்கலப் பலிபீடத்தின் நோக்கத்தைக் குறிக்கும் לְבַקֵּר என்பதன் பொருள்
  choice: நான் விசாரிப்பதற்காக
  alternative: நான் பரிசோதிப்பதற்காக / கவனிப்பதற்காக / வழிகாட்டுதல் தேடுவதற்காக
  rationale: இந்தச் சொற்றொடரின் துல்லியமான பொருள் உறுதியற்றது. அரசன் அந்தப் பலிபீடத்தைத் தனக்குரிய எதிர்கால ஆலோசனை அல்லது ஆய்வுக்காக ஒதுக்குவதாகச் சூழல் காட்டலாம்; ஆனால் எந்தச் சடங்கு அல்லது குறிகேட்பு முறையையும் எபிரெய உரை வெளிப்படையாகக் குறிப்பிடாததால் மொழிபெயர்ப்பு அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. பலி தொடர்பான முக்கிய சொற்களுக்கு நிலையான தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; இறுதி எபிரெயச் சொற்றொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
