  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: ta
  text: ஆசாரியன் உரியா, அரசன் அகாஸ் கட்டளையிட்ட அனைத்தின்படியும் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. இங்கு தொடர்ந்து வரும் இணக்கத்தைக் குறிக்கும் சொற்றொடருடன், ‘செய்தான்’ என்பதே இயல்பானதும் நேரடியானதும் ஆகும்.
- source_word: אוּרִיָּה
  choice: உரியா
  rationale: எபிரேயப் பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனான
  rationale: உரியாவின் பணிப்பதவியைச் சுட்டும் வரையறுக்கப்பட்ட பெயர்ச்சொல். தமிழில் பெயருடன் இயல்பாக இணையும் வகையில் ‘ஆசாரியனான’ என வழங்கப்பட்டுள்ளது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: அடுத்து கூறப்படும் கட்டளையின் எல்லா அம்சங்களுக்கும் முழுமையாக இணங்கியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் கட்டளையிடுதல் என்ற வலிமையைப் பாதுகாக்கிறது; தமிழில் பெயரெச்ச வடிவம் செயல் அதற்கு முன் நிகழ்ந்ததை இயல்பாக உணர்த்துகிறது.
- source_word: הַמֶּלֶךְ אָחָז
  choice: அகாஸ் அரசன்
  rationale: எபிரேயத்தில் பட்டத்துக்குப் பின் பெயர் வருவதைப் பிரதிபலிப்பதோடு, தமிழிலும் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: உரியா கட்டளைக்குக் கீழ்ப்படிந்ததற்கான கதையாசிரியரின் மதிப்பீடு
  choice: வசனத்தை எந்த வெளிப்படையான அறநெறித் தீர்ப்பும் சேர்க்காமல் விவரிப்பாக மொழிபெயர்த்தல்
  alternative: எபிரேய மூலத்தில் இல்லாத பாராட்டு அல்லது கண்டனத்தைச் சொற்களில் சேர்த்தல்
  rationale: எபிரேய உரை, அகாஸின் கட்டளைக்கு ஏற்ப உரியா செயல்பட்டான் என்று மட்டுமே தெரிவிக்கிறது. விரிவான சூழல் எதிர்மறையான மதிப்பீட்டைத் தூண்டினாலும், இவ்வசனம் அதை வெளிப்படையாகக் கூறாததால் அதன் கட்டுப்பாடான தொனி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று உரைநடை. ‘ஆகவே’ என்பது வַ־ என்னும் தொடர்ச்சிச் சொல்லைச் சூழலுக்கு ஏற்ற விளைவுத் தொடர்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத நெறித் தீர்ப்பு எதுவும் சேர்க்கப்படவில்லை.
