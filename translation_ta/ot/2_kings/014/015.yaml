base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: யெகோவாஷ் செய்த மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவனுடைய வல்லமையும், யூதாவின் அரசன் அமத்சியாவோடு[a] அவன் போரிட்டதும் இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதாவின் அரசன் அமத்சியாவுக்கு எதிராக.’ எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘உடன்’; ஆனால் போர்ச் சூழலில் அது பகைமை எதிர்ப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேல் அரசர்களின் ஆட்சிக்கால நிகழ்வுப் பதிவுப் புத்தகத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ
  choice: யெகோவாஸ் செய்த மற்ற செயல்களும்
  rationale: அரசர்களின் ஆட்சிச் சுருக்கத்தில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ அல்ல, அரசனின் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது. וְיֶתֶר என்பதன் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் ‘மற்ற’ எனக் கொடுத்துள்ளது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள தொடர்புச் சொற்றொடரைத் தவிர்க்காமல் மொழிபெயர்க்கிறது; முந்தைய ‘செயல்கள்’ என்பதுடன் காணப்படும் வலியுறுத்தும் மீளுரையையும் பாதுகாக்கிறது.
- source_word: וּגְבוּרָתוֹ
  choice: அவனுடைய வல்லமையும்
  rationale: גְּבוּרָה வலிமை, வீரத்திறம், வல்ல செயல்கள் ஆகிய பரப்பைக் கொண்டது. ‘வல்லமை’ இங்கு அரச மற்றும் படைத் திறனைச் சுருக்கமாகவும் பரந்ததாகவும் வெளிப்படுத்துகிறது.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: அமத்சியாவோடு அவன் போரிட்டதும்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைப் பாதுகாக்கிறது; ‘போரிட்டான்’ என்பதால் பகைமைச் சூழல் தமிழில் தெளிவாகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: மூலத்தின் எதிர்பார்க்கப்பட்ட உடன்பாட்டைக் கோரும் வினா வடிவத்தையும் அரசர் நூல்களின் வழக்கமான நிறைவு நடையையும் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: சொல்லுக்கு சொல் ‘நாட்களின் நிகழ்வுகளைக் குறித்த புத்தகம்’ என்ற கருத்தை, அரசர்களின் ஆண்டு நிகழ்வுப் பதிவைக் குறிக்கும் இயல்பான தமிழ் நூற்பெயராக வழங்குகிறது.
