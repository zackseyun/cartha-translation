translation_notes:
  register: நவீன பொதுத்தமிழில், அரசர் வரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் பட்டியல் அமைப்பும் இறுதி வினா வடிவமும் பாதுகாக்கப்பட்டுள்ளன. பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ‘யெகோவாஸ்’, ‘அமத்சியா’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
