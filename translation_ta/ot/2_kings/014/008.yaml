  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: ta
  text: அப்போது அமத்சியா, யெகூவின் மகனான யோவாகாசின் மகனும் இஸ்ரவேலின் அரசனுமான யோவாசிடம் தூதுவர்களை அனுப்பி, “வா, நாம் நேருக்கு நேர் சந்திப்போம்[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “நாம் முகங்களைப் பார்ப்போம்.” இங்கு இது நேரடியாகச் சந்திப்பதைக் குறிக்கும்; சூழலில் போருக்கான சவாலாகப் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலத் தொடர் இணைப்பாக உள்ளது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இங்கு செய்தியை எடுத்துச் செல்லும் மனிதப் பிரதிநிதிகளைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: יְהוֹאָשׁ
  choice: யோவாஸ்
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் அறியப்பட்ட வடிவத்தைப் பயன்படுத்தி, எபிரெயப் பெயரையும் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: யெகூவின் மகனான யோவாகாசின் மகன்
  rationale: எபிரெய உரையிலுள்ள வம்சத் தொடரை மாற்றாமல், இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது.
- source_word: לְכָה
  choice: வா
  rationale: எதிரிலுள்ள அரசனை நேரடியாகச் சந்திக்க அழைக்கும் அல்லது சவால் விடுக்கும் ஒருமை ஏவல் வடிவம்.
- source_word: נִתְרָאֶה פָנִים
  choice: நாம் நேருக்கு நேர் சந்திப்போம்
  rationale: சொல்லாட்சியின் ‘முகங்களைப் பார்ப்போம்’ என்ற படிமத்தை இயல்பான தமிழில் காத்து, நேரடியான மோதல் என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
