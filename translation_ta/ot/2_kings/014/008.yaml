translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் சுருக்கமான அரச சவால் இயல்பாக ஒலிக்கச் செய்யப்பட்டுள்ளது; ‘போரிடுவோம்’ என்பதை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் உருவகத்தையும் அதன் சிறு அளவிலான தெளிவின்மையையும் காத்துள்ளது.
