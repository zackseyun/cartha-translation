source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனான யோவாகாசின் மகன் யோவாஷின் ஆட்சியின் இரண்டாம் ஆண்டில், யூதாவின் அரசனாக யோவாஷின் மகன் அமத்சியா பதவியேற்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: ஆட்சியின் இரண்டாம் ஆண்டில்
  rationale: எபிரெய ஆட்சியாண்டுக் கணிப்பு மரபில், சொல்லளவில் ‘இரண்டு’ என்ற எண்ணாக இருந்தாலும் இங்கு ‘இரண்டாம் ஆண்டு’ என்ற வரிசை எண்ணுப் பொருள் இயல்பானது. அரசனின் ஆட்சியாண்டு என்பதைத் தமிழில் தெளிவுபடுத்த ‘ஆட்சியின்’ சேர்க்கப்பட்டது.
- source_word: לְ/יוֹאָשׁ
  choice: யோவாஷின்
  rationale: இந்த ஆட்சியாண்டு வாய்பாட்டில் לְ என்பது யாருடைய ஆட்சியாண்டு கணக்கிடப்படுகிறது என்பதைக் குறிக்கிறது; தமிழில் உடைமை வேற்றுமை இயல்பானது.
- source_word: בֶּן יוֹאָחָז
  choice: யோவாகாசின் மகன்
  rationale: தந்தை வழி அடையாளத்தை நேரடியாகவும் இயல்பான தமிழ் சொல்லமைப்பிலும் தருகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: அரச பட்டத்தையும் ஆளப்பட்ட நாட்டையும் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מָלַךְ
  choice: அரசனாக ... பதவியேற்றார்
  rationale: இச்சூழலில் வினை ஆட்சியின் தொடக்கத்தைச் சுட்டுகிறது. ‘பதவியேற்றார்’ என்பது வெறுமனே ‘ஆட்சி செய்தார்’ என்பதைக் காட்டிலும் அரியணை ஏற்ற நிகழ்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க இயலும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶן יוֹאָשׁ
  choice: யோவாஷின் மகன்
  rationale: அமத்சியாவின் தந்தை வழி அடையாளத்தை நேரடியாக வழங்குகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனாக
  rationale: மூலத்தில் அமத்சியாவை ‘யூதாவின் அரசன்’ என்று அடையாளப்படுத்தும் சொற்றொடர், மָלַךְ என்பதோடு இணைந்து தமிழில் இயல்பாக ‘யூதாவின் அரசனாக ... பதவியேற்றார்’ என வழங்கப்பட்டுள்ளது.
