translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசவைக் குறிப்புக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒரே வசனத்தில் வரும் இரு யோவாஷ்களையும் அவரவர் தந்தை மற்றும் நாட்டின் அடையாளங்களால் தெளிவாக வேறுபடுத்துகிறது. அடிக்குறிப்புகள் தேவையில்லை.
