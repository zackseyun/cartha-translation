theological_decisions:
- issue: இஸ்ரவேலின் பாதுகாப்பில் இறை நோக்கமும் செயலும்
  choice: இஸ்ரவேலை அழித்துவிடுவதாக யெகோவா சொல்லியிருக்கவில்லை; ஆகவே யெரொபெயாமை முகவராகக் கொண்டு அவர்களை மீட்டார்.
  alternative: இரு கூற்றுகளையும் காரணத் தொடர்பைக் காட்டாமல் ‘மேலும்/அவர்’ என்று இணைத்தல்.
  rationale: எபிரேய உரையில் அழிப்பு அறிவிப்பு இல்லாமையைத் தொடர்ந்து மீட்புச் செயல் வருகிறது. ‘ஆகவே’ இந்தக் கதைத் தொடர்பைத் தெளிவாக்குகிறது; குறைபாடுள்ள ஒரு அரசன் வழியாக இறைவன் மீட்பதிலுள்ள பதற்றத்தை மதிப்பீட்டால் தீர்த்துவிடாமல் காக்கிறது.
