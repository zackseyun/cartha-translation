  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இஸ்ரவேலின் பெயர்’, ‘வானத்தின் கீழிருந்து’, ‘கையால்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டு, தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
