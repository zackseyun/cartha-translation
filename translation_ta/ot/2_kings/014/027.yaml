  text: ஆனால் இஸ்ரவேலின் பெயரை வானத்தின் கீழிலிருந்து அழித்துவிடுவதாக யெகோவா சொல்லியிருக்கவில்லை[a]. ஆகவே யோவாசின் மகன் யெரொபெயாமின் கையால்[b] அவர்களை மீட்டார்.
  philosophy: optimal-equivalence
