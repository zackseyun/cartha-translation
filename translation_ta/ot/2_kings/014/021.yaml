lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: தேர்ந்தெடுத்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’. அரசரை நிறுவும் இச்சூழலில், தமிழில் வெறுமனே ‘எடுத்து’ என்பது இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், மக்களின் கூட்டுத் தேர்வு மற்றும் முன்னிறுத்தலை இயல்பாகக் காட்ட ‘தேர்ந்தெடுத்து’ பயன்படுத்தப்பட்டது.
- source_word: כָּל עַם יְהוּדָה
  choice: யூதாவின் மக்கள் அனைவரும்
  rationale: ‘யூதாவின் மக்கள் அனைவரும்’ என்ற வெளிப்படையான மக்களைக் குறிக்கும் பொருளையும் அவர்களின் கூட்டுச் செயலையும் காக்கிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: இவ்வசனத்தின் எபிரெய உரையில் உள்ள பெயர்வடிவத்தையே பின்பற்றுகிறது; வேறிடங்களில் காணப்படும் உசியா என்ற பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: பதினாறு வயதான
  rationale: வயதைக் குறிப்பிடும் உட்பொருளைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: அவரை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆட்சி செய்யச் செய்தல், அதாவது அரசனாக்குதல் என்று பொருள்படும். முடிசூட்டும் சடங்கோ வெறும் அறிவிப்போ உரையில் குறிப்பிடப்படாததால் அவை சேர்க்கப்படவில்லை.
- source_word: תַּחַת אָבִיו
  choice: அவருடைய தந்தை அமத்சியாவுக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியில் תחת குறிக்கும் ‘இடத்தில்/பதிலாக’ என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
