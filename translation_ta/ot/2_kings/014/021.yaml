translation:
  language: ta
  text: அப்போது யூதாவின் மக்கள் அனைவரும் பதினாறு வயதுடைய அசரியாவை அழைத்துக்கொண்டு வந்து, அவருடைய தந்தை அமத்சியாவுக்குப் பதிலாக அவரை அரசனாக்கினார்கள்.[a]
  philosophy: optimal-equivalence
