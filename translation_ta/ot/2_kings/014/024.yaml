  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேபாத்தின் மகன் யெரொபெயாமின் பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை; அவற்றால் யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்ய வைத்தான்.” எபிரேயச் சார்பு வாக்கியத்தை யெரொபெயாமை நேரடியாகக் குறிப்பதாகவோ, அவனுடைய பாவச்செயல்களைச் சாதனமாகக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: அவன் தீமையானதைச் செய்தான்
  rationale: עשה הרע என்ற எபிரேய மரபுத்தொடரின் ஒழுக்க மதிப்பீட்டை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தெளிவாகக் காக்கிறது; יהוה என்பது பதவிப்பெயராக அல்லாமல் ‘யாவே’ என்ற தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை
  rationale: மறுப்பு வாக்கியத்தில் מִכָּל குறிக்கும் முழுமையான பரப்பை இயல்பான தமிழில் ‘எதிலிருந்தும் … விலகவில்லை’ என்று வெளிப்படுத்துகிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரேயப் பெயர்களைத் தமிழில் அடையாளம் காணத்தக்க வகையில் ஒலிபெயர்த்து, construct உறவை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: חטא என்பதன் Hiphil வடிவிலுள்ள ‘பாவம் செய்யக் காரணமாக இரு/செய்’ என்ற காரணவினைப் பொருளைக் காக்கிறது. ஆண்பால் ஒருமை சார்புப்பெயர் யெரொபெயாமைக் குறிப்பதாக முதன்மையாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל என்ற சார்பு வாக்கியத்தின் தொடர்பு
  choice: 'யெரொபெயாமை நேரடியாகக் குறிக்கும்: ‘இஸ்ரவேலைப் பாவம் செய்ய வைத்த [யெரொபெயாம்]’'
  alternative: 'யெரொபெயாமின் பாவச்செயல்களைச் சாதனமாகக் குறிக்கும்: ‘அவற்றால் அவன் இஸ்ரவேலைப் பாவம் செய்ய வைத்தான்’'
  rationale: אֲשֶׁר மற்றும் הֶחֱטִיא ஆகியவை ஆண்பால் ஒருமை அமைப்பைக் கொண்டிருப்பதால் யெரொபெயாமை நேரடியாகக் குறிப்பது இலக்கண ரீதியாக வலுவானது. இருப்பினும், உடனடி சூழலில் ‘பாவங்கள்’ வருவதால் செயல்களைச் சாதனமாகப் புரிந்துகொள்ளும் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. பழமையான ‘பொல்லாப்பு செய்தான்’ போன்ற சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் ஒழுக்கத் தீர்ப்பும் காக்கப்பட்டுள்ளன.
