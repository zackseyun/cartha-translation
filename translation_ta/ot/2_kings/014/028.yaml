  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: யெரொபெயாமின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவனுடைய வல்லமையும், அவன் எவ்வாறு போரிட்டான் என்பதும், தமஸ்குவையும் ஆமாத்தையும் இஸ்ரவேலில் யூதாவுக்குத் திரும்பக் கொண்டுவந்ததும்[a] இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில் எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “இஸ்ரவேலில் யூதாவுக்கு.” இச்சொற்றொடர் பொருள் தெளிவற்றது. முன்பு யூதாவுக்குச் சொந்தமாக இருந்த நிலப்பகுதியை இஸ்ரவேலுக்காக மீட்டதைக் குறிக்கலாம்; அல்லது பழைய ஓர் அரசியல்-புவியியல் பெயரிடலைப் பாதுகாத்திருக்கலாம். இந்தத் தெளிவின்மையைத் தீர்மானிக்காமல் முதன்மை உரை எபிரெயச் சொற்களை இயன்றவரை நெருக்கமாகத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்களும்
  rationale: இது அரசர்களைப் பற்றிய தொகுப்புரைகளில் வழக்கமாக வரும் சொற்றொடர். דִּבְרֵי என்பதற்கு சொற்படியாக ‘வார்த்தைகள்/காரியங்கள்’ என்று பொருள் இருந்தாலும், இங்கே அரசனுடைய செயல்களையே குறிக்கிறது.
- source_word: וּגְבוּרָתוֹ
  choice: அவனுடைய வல்லமையும்
  rationale: גְּבוּרָה வலிமை, வீரம் அல்லது வல்ல செயல்களைக் குறிக்கலாம். தொடர்ந்து போரிடுதல் குறிப்பிடப்படுவதால், சுருக்கமான ‘வல்லமை’ மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר נִלְחָם
  choice: அவன் எவ்வாறு போரிட்டான் என்பதும்
  rationale: முந்தைய ‘வல்லமை’ எவ்வாறு வெளிப்பட்டது என்பதை விளக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: திரும்பக் கொண்டுவந்ததும்
  rationale: הֵשִׁיב என்பதன் அடிப்படைப் பொருளான ‘திரும்பக் கொண்டுவருதல்/மீட்டல்’ என்பதைக் காக்கிறது; நிலப்பகுதிகளை அரசியல் கட்டுப்பாட்டுக்குள் மீண்டும் கொண்டுவந்த சூழலுக்கும் பொருந்துகிறது.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் யூதாவுக்கு
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் பொருள் தெளிவற்றதாகவும் உள்ளது. வரலாற்று அல்லது புவியியல் உறவை ஊகித்து விளக்காமல், அதன் அசாதாரண அமைப்பைத் தமிழில் இயன்றவரை தக்கவைக்கிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: அரசர்கள் நூலில் வரும் வழக்கமான வினாவடிவ நிறைவையும் செயலப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: அரச ஆவணத் தொகுப்பைக் குறிக்கும் தலைப்பை இயல்பான, மரியாதையான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலில் யூதாவுக்கு’ என்ற தெளிவற்ற வரலாற்று-புவியியல் சொற்றொடர்
  choice: மூலத்தின் சொல் வரிசையையும் தெளிவின்மையையும் நெருக்கமாகத் தக்கவைத்தல்
  alternative: முன்பு யூதாவுக்குச் சொந்தமான பகுதிகளை இஸ்ரவேலுக்காக மீட்டான் என்று விளக்குதல்
  rationale: மூல உரை எந்த வரலாற்று உறவைக் குறிக்கிறது என்பதைத் தெளிவாகத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு ஒரு குறிப்பிட்ட அரசியல் அல்லது வேதாகம ஒத்திசைவு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், அரச வரலாற்றுத் தொகுப்புரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாளாகமப் புத்தகம்’ என்பது ஆவணத் தலைப்பின் மரபான, வாசிக்க எளிய வடிவம். மூலத்தில் இல்லாத தொடக்கக் காலக் குறியீடு எதுவும் சேர்க்கப்படவில்லை.
