  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் சரியானதைச் செய்தான். ஆனாலும்[a] அவன் தன் தந்தையான தாவீதைப் போலச் செய்யவில்லை[b]; தன் தந்தையான யோவாஸ் செய்த எல்லாவற்றின்படியும் செய்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் רַק என்பதற்கு இங்கு “மட்டும்” என்றும் மொழிபெயர்க்கலாம்; அது முந்தைய பாராட்டிற்கு ஒரு வரம்பை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தன் தந்தையான தாவீது” என்பதில் “தந்தை” என்பது உடனடி தந்தையை அல்ல, அரச வம்சத்தின் மூதாதையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: யோவாஸ் என்ற பெயர் சில மொழிபெயர்ப்புகளில் யெகோவாஸ் என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: எபிரெயக் கதைநடையின் தொடர்வினை வடிவம் அரசனின் நடத்தையை விவரிக்கிறது. இயல்பான தமிழுக்காகத் தொடக்க இணைப்புச்சொல் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הַיָּשָׁר
  choice: நேர்மையானதை
  rationale: பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டுள்ள இப்பெயரடை, அரசனைக் குறித்த மதிப்பீட்டுச் சூத்திரத்தில் சரியானதும் நெறிக்குட்பட்டதுமான செயலைக் குறிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: இறைவனின் மதிப்பீட்டைக் குறிக்கும் எபிரெய மொழிமரபை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரின் தனிப்பெயர் இயல்பைப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: רַק
  choice: ஆனாலும்
  rationale: முந்தைய நேர்மறை மதிப்பீட்டிற்கு வரம்பை அறிமுகப்படுத்தும் எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது; ‘மட்டும்’ என்ற நேரடியான மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: தன் தந்தையான தாவீதைப் போல அல்ல
  rationale: அமத்சியா தாவீதின் அளவுகோலை எட்டவில்லை என்ற ஒப்பீட்டைத் தக்கவைக்கிறது. ‘தந்தை’ என்பது இங்கு வம்ச மூதாதையைக் குறித்தாலும், மூலத்தின் குடும்பச் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: כְּ + כֹל + אֲשֶׁר அமைப்பு காட்டும் விரிவான ஒப்புமையை நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יוֹאָשׁ אָבִיו
  choice: தன் தந்தை யோவாஸ்
  rationale: இச்சூழலில் அமத்சியாவின் உடனடி தந்தையையும் முன்னோடி அரசனையும் குறிக்கிறது; יוֹאָשׁ என்பது ‘யோவாஸ்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: எபிரெயத்தில் அதே வினைச்சொல் மீண்டும் வருவதைக் காக்கிறது. தமிழில் காலவரிசை சூழலால் தெளிவாக இருப்பதால் இறந்தகால வினை போதுமானது.
theological_decisions:
- issue: நேர்மறையான அரச மதிப்பீடும் அதற்கு விதிக்கப்படும் வரம்பும்
  choice: அமத்சியா யாவேவின் பார்வையில் நேர்மையானதைச் செய்தான் என்ற உண்மையான பாராட்டு முதலில் தரப்பட்டு, தாவீதைப் போல இல்லாமல் யோவாசைப் பின்பற்றினான் என்ற வரம்பும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
  alternative: தாவீதுடனான வேறுபாட்டைத் தணித்து வலுவான பாராட்டாக வாசிப்பது; அல்லது தொடக்கப் பாராட்டை வெறும் வழக்குச் சூத்திரமாகக் கருதி கடுமையான கண்டனமாக வாசிப்பது.
  rationale: எபிரெய வாக்கிய அமைப்பு நேர்மறை மதிப்பீட்டிற்குப் பின் רַק மூலம் ஒரு தெளிவான தகுதிப்படுத்தலை வைக்கிறது. இரு கூறுகளுக்கிடையேயான இறையியல் இழுவிசையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேவின் பார்வையில்’ என்ற எபிரெய மொழிமரபும், தாவீது மற்றும் யோவாஸ் இருவருக்கும் வரும் ‘தந்தை’ என்ற சொல்லின் திட்டமிட்ட வேறுபட்ட உறவுப்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
