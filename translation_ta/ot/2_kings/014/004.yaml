base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ta
  text: ஆயினும், உயர்ந்த வழிபாட்டு இடங்கள்[a] அகற்றப்படவில்லை; மக்கள் இன்னும் அந்த உயர்ந்த இடங்களில் பலியிட்டு, தூபம்[b] எரித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்ந்த வழிபாட்டு இடங்கள்’ என்பதற்கான எபிரெயச் சொல், பெரும்பாலும் உயரமான இடங்களில் அமைந்திருந்த உள்ளூர் பலி மற்றும் வழிபாட்டுத் தலங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காணிக்கைகளைப் புகையெழ எரித்துக்கொண்டிருந்தார்கள்.’
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רַק
  choice: ஆயினும்
  rationale: முந்தைய அரச மதிப்பீட்டுக்கு விதிவிலக்காக அல்லது வரம்பாக இக்கூற்றை அறிமுகப்படுத்தும் எதிர்மறை இணைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: வழிபாட்டு மேடைகள் / அந்த மேடைகளில்
  rationale: במות என்பது உள்ளூர் பலி மற்றும் வழிபாடு நடைபெற்ற cultic தலங்களைக் குறிக்கும். வெறும் ‘மேடைகள்’ என்பதன் தெளிவின்மையைத் தவிர்க்க ‘வழிபாட்டு’ சேர்க்கப்பட்டது; அவை அங்கீகரிக்கப்படாதவை என்ற விளக்கம் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: வழிபாட்டு மேடைகளை எழுவாயாகக் கொண்ட இச்சூழலில் סור அவை ஒழிக்கப்படவில்லை அல்லது அகற்றப்படவில்லை என்பதைக் குறிக்கிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: மக்களின் வழக்கமான செயல் தொடர்ந்து நடந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מְזַבְּחִים
  choice: பலிகளைச் செலுத்தி
  rationale: வழிபாட்டுச் சூழலிலான பலியிடுதலைக் குறிக்கிறது; எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது வழக்கமான செயல்பொருள் இறுதி தொடர்வினை வடிவத்தின் மூலம் வெளிப்படுகிறது.
- source_word: וּמְקַטְּרִים
  choice: தூபம் எரித்துக்கொண்டிருந்தார்கள்
  rationale: קטר வழிபாட்டுச் சூழலில் தூபத்தையோ வேறு காணிக்கையையோ புகையெழ எரிப்பதைக் குறிக்கலாம். இங்கு ‘பலிகளைச் செலுத்தி’ என்பதுடன் இணைந்திருப்பதால் தூபம் எரித்தல் சூழலுக்கு ஏற்ற முதன்மை மொழிபெயர்ப்பு; தொடர்வினை வழக்கமான செயலைக் காக்கிறது.
theological_decisions:
- issue: வழிபாட்டு மேடைகளில் நடைபெற்ற வழிபாட்டின் மதிப்பீடு
  choice: வரலாற்று வழிபாட்டிடங்களைக் குறிக்கும் ‘வழிபாட்டு மேடைகள்’ என்ற சொல்லை மட்டும் பயன்படுத்தி, அவற்றை நேரடியாக ‘தடைசெய்யப்பட்ட’ அல்லது ‘விக்கிரக’ வழிபாட்டிடங்கள் என்று விரிவாக்கவில்லை.
  alternative: அங்கீகரிக்கப்படாத வழிபாட்டிடங்கள்
  rationale: இந்நூலின் பரந்த சூழல் இவ்வழிபாட்டை எதிர்மறையாக மதிப்பிட்டாலும், இவ்வசனம் மேடைகள் அகற்றப்படாததையும் மக்கள் அங்கு வழிபாட்டுச் செயல்களைத் தொடர்ந்ததையும் மட்டுமே நேரடியாகக் கூறுகிறது.
- issue: קטר என்பதன் வழிபாட்டுச் செயற்பொருள்
  choice: முதன்மை உரையில் ‘தூபம் எரித்தல்’ என மொழிபெயர்த்து, பரந்த மாற்றுப் பொருளை அடிக்குறிப்பில் தக்கவைத்தல்.
  alternative: காணிக்கைகளைப் புகையெழ எரித்தல்
  rationale: சொல் தூபத்தைக் குறிப்பாகவும் பலிப்பொருட்களைப் பொதுவாகப் புகையாக்குவதையும் குறிக்கக்கூடும்; சூழல் முதன்மைத் தேர்வை ஆதரித்தாலும் சொற்பொருள் ஐயத்தை முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்று நூலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெயப் பங்கேற்புவினைகள் குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான செயல் ‘எரித்துக்கொண்டிருந்தார்கள்’ என்ற வடிவத்திலும் இணைந்த வினைத்தொடரிலும் வெளிப்படுத்தப்பட்டுள்ளது.
