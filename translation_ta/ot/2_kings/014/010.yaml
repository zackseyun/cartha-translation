base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: ta
  text: நீ ஏதோமை நிச்சயமாக முறியடித்தாய்; உன் மனம் பெருமிதம் கொண்டது.[a] அதில் பெருமைகொள்; உன் வீட்டிலேயே இரு.[b] நீயும் உன்னோடு யூதாவும் வீழும்படியாக, கேட்டை ஏன் வரவழைத்துக்கொள்கிறாய்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்சொல்லில், “உன் இதயம் உன்னை உயர்த்தியது”; இது பெருமிதம் அல்லது தற்பெருமையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “அதில் பெருமைகொள்” என்பதற்கு, “புகழைப் பெறு,” “புகழை அனுபவி,” அல்லது “மேன்மை பாராட்டு” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: நிச்சயமாக முறியடித்தாய்
  rationale: வினையெச்ச மூலவடிவமும் முற்றுவினையும் இணைந்து தரும் வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது. போர்ச் சூழலில் ‘முறியடித்தாய்’ என்பது இயல்பான தமிழ்; எபிரெய வினையின் தாக்குதல்/தோற்கடித்தல் பொருளையும் தெரிவிக்கிறது.
- source_word: אֶת אֱדוֹם
  choice: ஏதோமை
  rationale: நேரடி செயப்படுபொருளான ஏதோம் நாட்டைப் பொருத்தமான தமிழ் வேற்றுமையுடன் வழங்குகிறது.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: உன் உள்ளம் உன்னைத் தற்பெருமைகொள்ளச் செய்தது
  rationale: ‘உன் இதயம் உன்னை உயர்த்தியது’ என்ற எபிரெய உருவகத்தின் பொருள் தற்பெருமை அடைதல். தமிழில் புரியும்படி பொருளை வெளிப்படுத்தி, ‘உள்ளம்’ என்ற மூலப் படிமத்தின் கூறையும் தக்கவைக்கிறது.
- source_word: הִכָּבֵד
  choice: அந்தப் பெருமையோடு
  rationale: כבד என்ற கட்டளை வடிவம் இங்கு பெற்ற வெற்றியின் பெருமையை எடுத்துக்கொள்ளுதல் அல்லது அதிலேயே மகிழ்தல் எனப் பொருள்படலாம். அடுத்த கட்டளையுடன் இயல்பாக இணைத்து வழங்கப்பட்டுள்ளது; பொருள் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: உன் வீட்டிலேயே இரு
  rationale: மேலும் போருக்குச் செல்லாமல் தன் இடத்திலேயே இருக்கும்படி கூறும் எச்சரிக்கையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: பேரழிவைத் தூண்டிவிட்டு
  rationale: התגרה என்பது தன்னைச் சண்டையில் ஈடுபடுத்துதல் அல்லது தூண்டுதல்; רעה இச்சூழலில் ஒழுக்கத் தீமையைவிட அழிவு அல்லது கேடு. ‘பேரழிவைத் தூண்டு’ என்பது இரண்டையும் போர்ச் சூழலில் இயல்பாக இணைக்கிறது.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: நீயும் உன்னோடு யூதாவும் வீழ வேண்டும்
  rationale: அரசனின் பொறுப்பற்ற நடவடிக்கை அவனையும் யூதாவையும் வீழ்ச்சிக்குக் கொண்டுசெல்லும் என்ற எச்சரிப்பையும் மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
