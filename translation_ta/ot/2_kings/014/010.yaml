review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Amaziah’s victory over Edom, the warning against pride, the command to remain at home, and the threatened downfall of both king and Judah. However, it adds an explicit causal link (“அதனால்”) not stated in the Hebrew, turns the imperative הִכָּבֵד into a mere adverbial phrase, and renders the final consequence with “வேண்டும்,” which can sound like obligation rather than the anticipated result of provoking calamity.
  naturalness: The present wording is generally understandable, but “உன் உள்ளம் உன்னைத் தற்பெருமைகொள்ளச் செய்தது” is less idiomatic than “உன் மனம் பெருமிதம் கொண்டது,” and “பேரழிவைத் தூண்டிவிட்டு” is less natural in this warning context than “கேட்டை ஏன் வரவழைத்துக்கொள்கிறாய்?” The revision retains a dignified, direct modern Tamil register.
  terminology: “ஏதோம்” and “யூதா” are appropriate established biblical names. “பெருமிதம்” accurately conveys the idiomatic sense of the lifted heart without importing a doctrinal interpretation. “கேடு” appropriately represents רָעָה here as calamity/harm rather than moral evil.
  issues:
  - severity: medium
    issue: The causal connective “அதனால்” is interpretive.
    rationale: 'The Hebrew uses a simple conjunction: Amaziah struck Edom and his heart was lifted up. The sequence implies a connection, but does not explicitly state “therefore.”'
  - severity: medium
    issue: “அந்தப் பெருமையோடு” does not preserve the imperative הִכָּבֵד.
    rationale: The Hebrew gives a separate command, variously understood as “be honored,” “take glory,” or “boast.” An imperative such as “அதில் பெருமைகொள்” better retains its force while the footnote records alternatives.
  - severity: medium
    issue: “வீழ வேண்டும்” can imply obligation or necessity.
    rationale: The Hebrew perfect following the rhetorical question expresses the disastrous expected outcome. “வீழும்படியாக” naturally expresses the consequence without suggesting that they ought to fall.
  revised_text: நீ ஏதோமை நிச்சயமாக முறியடித்தாய்; உன் மனம் பெருமிதம் கொண்டது.[a] அதில் பெருமைகொள்; உன் வீட்டிலேயே இரு.[b] நீயும் உன்னோடு யூதாவும் வீழும்படியாக, கேட்டை ஏன் வரவழைத்துக்கொள்கிறாய்?
