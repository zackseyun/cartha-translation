base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: ta
  text: அவன் உப்புப் பள்ளத்தாக்கில் ஏதோமியரில் பத்தாயிரம் பேரை வீழ்த்தினான்; போரில் சேலாவைக்[a] கைப்பற்றி, அதற்கு யொக்தேயேல் என்று பெயரிட்டான்; அந்த நாள்வரை அதுவே அதன் பெயராக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேலா” என்பதை அதன் சொற்பொருளின்படி “பாறை” அல்லது “செங்குத்துப் பாறை” என்றும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு அது சேலா என்ற இடப்பெயராக இருப்பதற்கே வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: போர்ச் சூழலில் נכה தாக்கி வீழ்த்துவதைக் குறிக்கிறது; உயிரிழப்பை வெளிப்படையாகக் கூறாமல் அதன் தீவிரமான இராணுவப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோமியரில்
  rationale: எபிரெயத்தில் சொற்படியாக ‘ஏதோம்’ என்றிருந்தாலும், பத்தாயிரம் என்ற மனிதர் எண்ணிக்கையுடன் வருவதால் ஏதோம் மக்களைக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּגֵיא הַמֶּלַח
  choice: உப்புப் பள்ளத்தாக்கில்
  rationale: புவியியல் பெயரின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: பத்தாயிரம் பேர்
  rationale: மனிதர்களின் எண்ணிக்கை என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וְתָפַשׂ
  choice: கைப்பற்றி
  rationale: போரில் ஓர் இடத்தைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவரும் பொருளைச் சரியாக வெளிப்படுத்துகிறது.
- source_word: הַסֶּלַע
  choice: சேலா
  rationale: இங்கு அறியப்பட்ட இடப்பெயராக இருப்பதற்கே வாய்ப்பு அதிகம்; சொல்லின் பொதுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּמִּלְחָמָה
  choice: போரில்
  rationale: அந்த இடம் போரின்போது கைப்பற்றப்பட்டது என்ற சூழலைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: அதற்கு ... என்று பெயரிட்டான்
  rationale: எபிரெயப் பெயரிடும் சொற்றொடரின் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יָקְתְאֵל
  choice: யொக்தேயேல்
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அதுவே அதன் பெயராக உள்ளது
  rationale: அந்தப் பெயர் எழுத்தாளரின் காலம்வரை நீடித்தது என்ற எபிரெயக் காலச் சொற்றொடரின் முழுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
