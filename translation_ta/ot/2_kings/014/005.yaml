  source_fidelity: எபிரெய மூலத்தின் காலத் தொடர்பும் பொருளும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. “அரசாட்சி அவன் கையில் உறுதிப்பட்டபோது” என்பது חָזְקָה הַמַּמְלָכָה בְּיָדוֹ என்ற அரச அதிகாரம் உறுதிப்படும் உருவகத்தை நன்றாகக் காக்கிறது. וַיַּךְ மற்றும் הַמַּכִּים ஆகிய ஒரே வேர்ச் சொல்லின் மீள்பயன்பாடு “கொன்றான் … கொன்ற” எனத் தக்கவைக்கப்பட்டுள்ளது; இச்சூழலில் கொலை என்ற பொருள் தெளிவானது.
  naturalness: நவீன நிலையான தமிழில் வாசகம் இயல்பாகவும் தெளிவாகவும் உள்ளது. “தன் தந்தையான அரசனைக்” என்பது எபிரெய இணைப்பைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது. தொடக்க எபிரெயக் கதைச்சொல் வினையைத் தனியாக மொழிபெயர்க்காமல் காலவாக்கியத்தில் இணைத்திருப்பது தமிழில் இயல்பானது.
  terminology: “அரசாட்சி,” “பணியாளர்கள்,” “அரசன்” ஆகியவை சூழலுக்கு ஏற்றவை. “பணியாளர்கள்” என்பது עֲבָדָיו என்பதன் அரசவையிலுள்ள சேவகர்கள்/அலுவலர்கள் என்ற விரிவான பொருளைத் தேவையற்ற வகையில் குறிப்பாக்காமல் தருகிறது. அடிக்குறிப்புகள் சரியான இடங்களில் இணைக்கப்பட்டு, மூலத்தின் உருவகத்தையும் வினைச்சொல் மீள்பயன்பாட்டையும் விளக்குகின்றன.
