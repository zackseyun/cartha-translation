source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה בְּ/יָד֑/וֹ וַ/יַּךְ֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: ta
  text: அரசாட்சி அவன் கையில் உறுதிப்பட்டபோது[a], தன் தந்தையான அரசனைக் கொன்ற தன் பணியாளர்களை அவன் கொன்றான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘அரசாட்சி அவன் கையில் வலுப்பெற்றபோது.’ ‘அவன் கையில்’ என்பது அரச அதிகாரம் அவனுடைய கட்டுப்பாட்டில் உறுதியாக நிலைபெற்றதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: 'அமத்சியாவின் செயலுக்கும் அவன் பணியாளர்களின் முந்தைய செயலுக்கும் எபிரெயத்தில் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது: தன் தந்தையைக் ‘கொன்ற’வர்களை அவன் ‘கொன்றான்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: உறுதிப்பட்டபோது
  rationale: வசனத்தின் தொடக்கத்தில் வரும் எபிரெயக் கதைத் தொடரையும் காலத் தொடர்பையும் இயல்பான தமிழில் ஒரே காலவாக்கியமாக அளிக்கிறது. உடனடித் தொடர்ச்சி சாத்தியமானாலும், כַּאֲשֶׁר கட்டாயமாக ‘உடனே’ என்று பொருள்படுவதில்லை.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: அரசாட்சி அவன் கையில் உறுதிப்பட்டது
  rationale: அரச அதிகாரம் பாதுகாப்பாகவும் நிலையாகவும் அவன் கட்டுப்பாட்டில் வந்ததைக் குறிக்கிறது. ‘அவன் கையில்’ என்பதன் எபிரெய உருவகத்தைத் தக்கவைத்துள்ளது.
- source_word: וַיַּךְ ... הַמַּכִּים
  choice: கொன்றான் ... கொன்ற
  rationale: נכה என்ற ஒரே வேர்ச்சொல் இரு செயல்களுக்கும் பயன்படுத்தப்பட்டுள்ளதைத் தமிழிலும் ஒரே வினைச்சொல்லைத் திரும்பப் பயன்படுத்திக் காட்டுகிறது. சூழலில் இரு செயல்களும் உயிரைக் கொல்லுதலைக் குறிக்கின்றன.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: அரச சேவையில் இருந்தவர்களைக் குறிக்கும் עבד என்பதற்கு, நவீன தமிழில் புரியக்கூடியதும் ‘அதிகாரிகள்’ என்று அளவுக்கு மீறிக் குறிப்பாக்காததுமான மொழிபெயர்ப்பு.
- source_word: הַמֶּלֶךְ אָבִיו
  choice: தன் தந்தையான அரசன்
  rationale: ‘அரசன், அவனுடைய தந்தை’ என்ற எபிரெய இணைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
