base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: ta
  text: அரசன் தன் முன்னோர்களோடு துயிலடைந்த பிறகு, அவன் ஏலாத்தைத் திரும்பக் கட்டி, அதை யூதாவுக்குத் திரும்பச் சேர்த்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: திரும்பக் கட்டி
  rationale: இங்கு ஏலாத் மீண்டும் யூதாவின் கட்டுப்பாட்டுக்குக் கொண்டுவரப்படுவதால், சூழலுக்கேற்றபடி ‘மறுபடியும் கட்டினான்/புதுப்பித்தான்’ என்ற பொருளைத் தருகிறது; தமிழில் இயல்பாக ‘திரும்பக் கட்டி’ என வழங்கப்பட்டது.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: அதை யூதாவுக்குத் திரும்பச் சேர்த்தான்
  rationale: ‘அதை யூதாவுக்குத் திருப்பினான்’ என்ற மூலத்தின் பொருளை, அரசியல் ஆட்சிப்பகுதியாக மீண்டும் இணைத்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׁכַב הַמֶּלֶךְ עִם אֲבֹתָיו
  choice: அரசன் தன் முன்னோர்களோடு துயிலடைந்த பிறகு
  rationale: மரணத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தையும் கண்ணியமான தொனியையும் காக்கிறது.
theological_decisions:
- issue: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்ற மரண மரபுத்தொடர்
  choice: உருவகத்தை அப்படியே பாதுகாத்தல்
  alternative: ‘அரசன் இறந்த பிறகு’
  rationale: மூல உரையின் அடக்கமான மரண மொழியையும் அதன் வேதாகமத் தொடர்புகளையும் காக்கிறது; மறுமை நிலை பற்றிய கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான வரலாற்று நடையுடன், மூலத்தின் தெளிவின்மையைத் தீர்க்காமல் ‘அரசன்’ மற்றும் ‘அவன்’ என்ற குறிப்புகள் பாதுகாக்கப்பட்டுள்ளன.
