base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் துன்பம் மிகவும் கொடியதாக இருந்ததையும்[a], கட்டுண்டவனும் விடப்பட்டவனும் எவரும் இல்லாததையும்[b], இஸ்ரவேலுக்கு உதவி செய்பவன் எவனும் இல்லாததையும் யாவே கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் கசப்பானதாக இருந்ததையும்” அல்லது “மிகவும் கடுமையாக இருந்ததையும்.” இங்குள்ள எபிரேயச் சொற்றொடர் கடினமானது; ஆனால் இஸ்ரவேலின் துன்பம் மிகுந்திருந்ததை அது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கட்டுண்டவனும் விடப்பட்டவனும்” என்பது பொருள் காண்பதற்குக் கடினமான எபிரேய இணைச்சொல். “அடைக்கப்பட்டவனும் விடுவிக்கப்பட்டவனும்” என்றும் மொழிபெயர்க்கலாம். உதவுவதற்கு எவருமே எஞ்சியிருக்கவில்லை அல்லது எல்லாத் தரப்பினரும் வலுவிழந்திருந்தனர் என்பது இதன் கருத்தாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் இறைப்பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், எபிரேய இறைப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֳנִי
  choice: துன்பம்
  rationale: தேசிய அளவிலான இஸ்ரவேலின் ஒடுக்கத்தையும் அவலநிலையையும் குறிக்கும் பரந்த, இயல்பான தமிழ் சொல்.
- source_word: מֹרֶה מְאֹד
  choice: மிகவும் கொடியதாக இருந்தது
  rationale: சொற்றொடரின் சரியான நுண்பொருள் கடினமானதாயினும், இங்கு துன்பத்தின் மிகுதியை வலியுறுத்துவது தெளிவு; ‘கொடியதாக’ என்பது அந்தத் தீவிரத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶפֶס
  choice: ஒருவன்கூட இல்லாதது
  rationale: முழுமையான இன்மையை வலியுறுத்தும் எபிரேய அமைப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָצוּר
  choice: அடைக்கப்பட்டவன்
  rationale: கட்டுப்பாட்டில் அல்லது காவலில் வைக்கப்பட்ட ஒருவரைக் குறிக்கும் சொல்லின் அடிப்படை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עָזוּב
  choice: விடுவிக்கப்பட்டவன்
  rationale: இணைச்சொல்லான עָצוּר என்பதற்கு எதிர்நிலையாக விடப்பட்ட அல்லது விடுதலையான ஒருவரைக் குறிக்கிறது; விவாதத்திற்குரிய மரபுத்தொடரைத் தீர்மானமாக விளக்காமல் காக்கிறது.
- source_word: עֹזֵר
  choice: உதவி செய்பவன்
  rationale: செயற்பாட்டுப் பங்கேற்புச் சொல்லின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: עָצוּר וְעָזוּב என்ற கடினமான மரபுத்தொடர்
  choice: அடைக்கப்பட்டவனும் விடுவிக்கப்பட்டவனும் ஒருவன்கூட இல்லை
  alternative: கட்டுண்டவனும் விடுதலையானவனும் இல்லை; அல்லது உதவுவதற்கு எவருமே எஞ்சியிருக்கவில்லை
  rationale: இரு எதிர்நிலைச் சொற்களையும் பிரதான உரையில் பாதுகாத்து, அவை எல்லாரையும் உள்ளடக்கி ‘ஒருவருமே இல்லை’ என்று உணர்த்தக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது; குறிப்பிட்ட சமூக அல்லது இறையியல் பிரிவை உரைக்குள் இறக்குமதி செய்வதில்லை.
- issue: מֹרֶה מְאֹד என்பதன் தெளிவற்ற நுண்பொருள்
  choice: மிகவும் கொடியதாக இருந்தது
  alternative: மிகவும் கசப்பானதாக இருந்தது; மிகவும் கடுமையாக இருந்தது
  rationale: இஸ்ரவேலின் அவலத்தின் தீவிரத்தை வெளிப்படுத்துகிறது; எபிரேயச் சொல்லின் அரிதான அல்லது கடினமான வடிவத்தால் ஏற்படும் பொருள் ஐயத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரேய வாக்கியத்தின் காரணவிளக்க ஓட்டத்தைத் தமிழில் தெளிவாக்க வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது. கடினமான இரு எபிரேய வெளிப்பாடுகளின் ஐயம் பிரதான உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது.
