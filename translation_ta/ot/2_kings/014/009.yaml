translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் உருவக முரண்பாடு, லெபனோன் என்ற சொல்லின் மறுபயன்பாடு, மற்றும் இறுதி நிகழ்வை இணைக்கும் எளிய ‘וַ’ என்பதன் தொடர்ச்சி ஆகியவை பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
