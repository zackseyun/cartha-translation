  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: ta
  text: 'அப்போது இஸ்ரவேலின் அரசன் யோவாஸ் யூதாவின் அரசன் அமத்சியாவுக்கு இவ்வாறு செய்தி அனுப்பினான்: “லெபனோனில் இருந்த முட்புதர்[a], லெபனோனில் இருந்த கேதுரு மரத்துக்குச் செய்தி அனுப்பி, ‘உன் மகளை என் மகனுக்கு மனைவியாகக் கொடு’ என்றது. லெபனோனில் இருந்த ஒரு காட்டு விலங்கு[b] கடந்து சென்று அந்த முட்புதரை மிதித்தது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு குறிப்பிடப்படும் முட்செடியை “முள்ளுச்செடி” அல்லது “முட்கொடி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் “வயல்வெளியின் விலங்கு”; அதாவது, ஒரு காட்டு விலங்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: இங்கு ஒருவரிடம் சொல்லி அனுப்பும் அரசரின் தகவல் பரிமாற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது; தொடரும் לֵאמֹר-ஐ நேரடிப் பேச்சுடன் இணைக்கிறது.
- source_word: הַחוֹחַ
  choice: முட்புதர்
  rationale: தாழ்ந்த, முட்கள் நிறைந்த செடியைக் குறிக்கும் பொதுவான சொல்லாகவும் உயர்ந்த கேதுரு மரத்துடனான உருவக முரண்பாட்டைப் பாதுகாக்கும் சொல்லாகவும் உள்ளது.
- source_word: הָאֶרֶז
  choice: கேதுரு மரம்
  rationale: אֶרֶז என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணை; மரம் என்பதைச் சேர்ப்பது சாதாரண வாசகருக்குத் தெளிவளிக்கிறது.
- source_word: בַּלְּבָנוֹן
  choice: லெபனோனில்
  rationale: இடத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; எபிரெய உரையின் வலியுறுத்தும் மறுபயன்பாடும் காக்கப்பட்டுள்ளது.
- source_word: תְּנָה
  choice: கொடு
  rationale: திருமண உறவுக்காக மகளைக் கொடுக்குமாறு கேட்கும் கட்டளையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: உன் மகளை என் மகனுக்கு மனைவியாகக் கொடு
  rationale: குடும்ப உறவையும் திருமண நோக்கத்தையும் மூலத்தின் வரிசைக்கு நெருக்கமாகத் தெளிவாகக் காக்கிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்கு
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘வயல்வெளியின் விலங்கு’; சூழலில் பொதுவாக காட்டில் வாழும் விலங்கைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וַתַּעֲבֹר
  choice: அந்த வழியாகச் சென்று
  rationale: விலங்கு கடந்து செல்லும் இயக்கத்தையும் நிகழ்வின் தற்செயலான தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתִּרְמֹס
  choice: மிதித்துப்போட்டது
  rationale: ரמס என்பதன் காலால் மிதித்து நசுக்கும் வலிமையான காட்சியை இயல்பான தமிழில் தருகிறது.
