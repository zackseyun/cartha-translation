translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘குதிரைகளின்மேல்’ என்ற நேரடி வடிவம் மூலத்தின் தெளிவின்மையைக் காக்கிறது; ‘தம் தந்தையரோடு’ என்பது பழமையான அடக்கச் சூத்திரத்தின் வம்சத் தொனியைத் தக்கவைக்கிறது. அடிக்குறி குறியீடுகள் உரையில் [a], [b] என முறையாக இடம்பெற்றுள்ளன.
