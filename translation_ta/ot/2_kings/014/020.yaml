  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: ta
  text: அவர்கள் அவரைக் குதிரைகளின்மேல் சுமந்து சென்றார்கள்[a]. அவர் தம் தந்தையரோடு[b] எருசலேமில், தாவீதின் நகரத்தில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழிப்படி, “குதிரைகளின்மேல்.” இது அவரது உடல் குதிரைகள் தொடர்பான ஏதோ ஒரு ஏற்பாட்டில் எடுத்துச் செல்லப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தம் தந்தையரோடு” என்பது அரச வம்சத்தின் முன்னோர்களோடு அடக்கம் செய்யப்பட்டதைக் குறிக்கும் வழக்கமான அடக்கச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: அவர்கள் அவரைச் சுமந்துகொண்டுவந்தார்கள்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருளான ‘சுமத்தல்/சுமந்து செல்லுதல்’ என்பதைக் காத்து, முந்தைய இடத்திலிருந்து எருசலேமுக்குக் கொண்டுவரப்பட்ட நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַסּוּסִים
  choice: குதிரைகளின்மேல்
  rationale: עַל என்ற முன்னிடைச்சொல்லின் நேரடியான ‘மேல்’ என்ற பொருளைக் காக்கிறது; உடல் எவ்வகையான குதிரை சார்ந்த ஏற்பாட்டில் எடுத்துவரப்பட்டது என்பதைத் தெளிவுபடுத்தாமல் மூலத்தின் சுருக்கத்தையும் ambiguity-யையும் விடுகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: நிஃபால் வினையின் செயப்பாட்டு வடிவத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தரும் நிலையான தமிழ் வடிவம்.
- source_word: עִם אֲבֹתָיו
  choice: தம் தந்தையரோடு
  rationale: பாரம்பரிய அடக்கச் சூத்திரத்தின் குடும்ப/வம்சத் தொனியைப் பாதுகாக்க ‘மூதாதையரோடு’ என்று விளக்கமாக மாற்றாமல் நேரடி வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: எருசலேமுக்குள் உள்ள குறிப்பிட்ட அடக்க இடத்தைச் சுட்டும் இடப்பெயரின் இயல்பான தமிழ் வடிவம்.
