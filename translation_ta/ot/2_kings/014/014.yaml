  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: ta
  text: அவன் தங்கம், வெள்ளி அனைத்தையும், யெகோவாவின் ஆலயத்திலும் அரசனின் அரண்மனைக் கருவூலங்களிலும் இருந்த அனைத்துப் பொருள்களையும், பணயக் கைதிகளையும்[a] எடுத்துக்கொண்டு சமாரியாவுக்குத் திரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பிணைகளின் மகன்கள்” அல்லது “உத்தரவாதங்களின் மகன்கள்”; பாதுகாப்பாகப் பிடித்து வைக்கப்பட்டவர்களை, அதாவது பணயக் கைதிகளை, இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: அவன் எடுத்துக்கொண்டு
  rationale: எபிரெயக் கதைத் தொடரில் வரும் வினையை இயல்பான தமிழ் இறந்தகாலத் தொடர்வினையாக வழங்குகிறது.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: தங்கம், வெள்ளி அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையைக் காத்து, நவீன தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: காணப்பட்ட பொருள்கள் அனைத்தையும்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், உடைமைகள் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவான சொல்; ஆலயமும் அரண்மனையும் சேர்ந்த சூழலில் ‘பொருள்கள்’ தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: ‘யெகோவாவின் வீடு’ என்ற சொற்பொருளை, இங்கு குறிக்கப்படும் ஆலயத்தை நவீன தமிழில் தெளிவாகச் சொல்கிறது; திருப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனையின் கருவூலங்களிலும்
  rationale: ‘ராஜாவின் வீட்டின் கருவூலங்கள்’ என்பதன் சூழல்சார்ந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: பிணைக்கைதிகளையும்
  rationale: சொல்லுக்கு சொல் அமைப்பு தெளிவற்றது; பாதுகாப்பு உத்தரவாதமாகப் பிடித்து வைக்கப்பட்ட நபர்கள் என்ற சூழல்பொருளைத் தருகிறது. நேரடி மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: சமாரியாவுக்குத் திரும்பினான்
  rationale: שוב வினையையும் இடத்தை நோக்கிய திசைமுடிவையும் இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் இருப்பதால், பொதுப் பட்டத்தால் மாற்றாமல் தமிழ் வாசகருக்குப் பரிச்சயமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. ‘ஆலயம்’ மற்றும் ‘அரண்மனை’ என்பவை எபிரெய ‘வீடு’ என்ற சொற்றொடர்களின் சூழல்பொருளைத் தெளிவாக்குகின்றன; கடினமான בְּנֵי הַתַּעֲרֻבוֹת என்பதன் ambiguity அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
