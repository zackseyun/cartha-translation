  text: וַ/יִּשְׁכַּ֤ב יָֽרָבְעָם֙ עִם אֲבֹתָ֔י/ו עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ זְכַרְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: ta
  text: யெரொபெயாம் தன் முன்னோர்களோடும் இஸ்ரவேலின் அரசர்களோடும் துயில்கொண்டார்[a]. அவருடைய மகன் சகரியா அவருக்குப் பதிலாக அரசாண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “தன் முன்னோர்களோடும், இஸ்ரவேலின் அரசர்களோடும் படுத்தார்.” இது அரசரின் மரணத்தைக் குறிக்கும் வழக்கமான மரபுத்தொடர். “இஸ்ரவேலின் அரசர்களோடு” என்பதற்கு “இஸ்ரவேலின் அரசர்களிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: மரண மரபுத்தொடரின் சொற்சார்ந்த வடிவத்தையும், இரண்டாவது ‘உடன்’ என்பதற்கான சாத்தியமான மாற்று மொழிபெயர்ப்பையும், அடக்கம் பற்றிய கூடுதல் தகவல் சேர்க்காமல் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடும் ... மரணத்தில் சேர்ந்தார்
  rationale: இது அரசரின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய அரசாட்சி நிறைவு வாய்பாடு. சொல்லுக்குச் சொல் ‘தன் முன்னோர்களோடு படுத்தார்’ என்பது இன்றைய தமிழில் இயல்பற்றதாகவும் தவறாகப் புரிந்துகொள்ளத்தக்கதாகவும் இருப்பதால், அதன் மரணப் பொருளையும் ‘உடன்’ என்ற தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்களோடும்
  rationale: மீண்டும் வரும் עִם என்பதன் ‘உடன்’ தொடர்பைத் தக்கவைத்து, முந்தைய தொடரோடு இணையான அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: அரசாட்சி குறிப்புகளில் வினையின் சுருக்கமான, இயல்பான தமிழ்ச் சமமான சொல்.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: בְנוֹ
  choice: அவருடைய மகன்
  rationale: மகன் என்ற உறவைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியின் சூழலில், முந்தைய அரசரின் இடத்தை மகன் ஏற்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: மரண வாய்பாட்டில் ‘தூங்கினார்’ என்ற உருவகத்தைப் பாதுகாப்பதா அல்லது பொருளைத் தெளிவாக்குவதா
  choice: மரணத்தில் சேர்ந்தார்
  alternative: தன் முன்னோர்களோடு துயில்கொண்டார்
  rationale: இங்கு שׁכב என்பது உயிர்த்தெழுதல் அல்லது மரணத்திற்குப் பிந்தைய நிலை குறித்த தனிப்பட்ட கோட்பாட்டை நிறுவாமல், அரசரின் மரணத்தைச் சொல்லும் மரபுவழி வாய்பாடாக உள்ளது. ‘மரணத்தில் சேர்ந்தார்’ என்பது அந்தச் செயல்பாட்டைத் தெளிவாக்கி, தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. அரசாட்சி நிறைவு வாய்பாட்டின் இலக்கியத் தன்மை முற்றிலும் மறையாதபடி ‘மரணத்தில் சேர்ந்தார்’ என மொழிபெயர்க்கப்பட்டு, சொற்சார்ந்த எபிரெய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
