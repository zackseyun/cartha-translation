  to: அவன் இஸ்ரவேலின் எல்லையை லெபோ-ஆமாத்திலிருந்து[a] அரபாவின் கடல் வரை[b] மீண்டும் நிலைநாட்டினான். கத்-ஹேப்பேரைச் சேர்ந்த அமித்தாயின் மகனான யோனா தீர்க்கதரிசி என்ற தம் ஊழியர் மூலம் இஸ்ரவேலின் கடவுளாகிய யாவே உரைத்த வார்த்தையின்படியே அவன் இதைச் செய்தான்.
  rationale: The revision preserves the source sequence and meaning while explicitly linking Yahweh with ‘his servant’ Jonah, retaining the Hebrew geographical designation in the main text, and making the tentative Dead Sea identification idiomatic Tamil. It also improves the place-name transliteration and the flow of the closing clause.
