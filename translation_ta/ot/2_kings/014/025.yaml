  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: ta
  text: அவன் இஸ்ரவேலின் எல்லையை லெபோ-ஆமாத்திலிருந்து[a] அரபாவின் கடல் வரை[b] மீண்டும் நிலைநாட்டினான். கத்-ஹேப்பேரைச் சேர்ந்த அமித்தாயின் மகனான யோனா தீர்க்கதரிசி என்ற தம் ஊழியர் மூலம் இஸ்ரவேலின் கடவுளாகிய யாவே உரைத்த வார்த்தையின்படியே அவன் இதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “ஆமாத்தின் நுழைவிடத்திலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இது சவக்கடலாக இருக்கக்கூடும்.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: மீண்டும் நிலைநாட்டினான்
  rationale: இங்கு வினைச்சொல் இஸ்ரவேலின் அரசியல்-புவியியல் எல்லையை முன்பிருந்த நிலைக்கு மீட்டதைக் குறிக்கிறது; ‘மீண்டும் நிலைநாட்டினான்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: இது நாட்டின் புவியியல் வரம்பைக் குறிக்கிறது; ‘எல்லை’ தெளிவான நவீனத் தமிழ் சொல்.
- source_word: מִלְּבוֹא חֲמָת
  choice: லெபோ-ஆமாத்திலிருந்து
  rationale: வேதாகமப் பயன்பாட்டில் இது நிலையான இடப்பெயராகச் செயல்படுவதால், பொருளைத் தீர்மானித்து விடாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יָם הָעֲרָבָה
  choice: அரபாவின் கடல்
  rationale: எபிரெயச் சொற்றொடரின் வடிவம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; அது சவக்கடலைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: כִּדְבַר
  choice: வார்த்தையின்படியே
  rationale: முன்னர் உரைக்கப்பட்ட இறைவார்த்தைக்கு ஏற்ப நிகழ்ந்ததை இந்தச் சொற்றொடர் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: இந்த எபிரெய மரபுத்தொடர் கருவியாக அல்லது தூதராகச் செயல்பட்டவரைக் குறிக்கிறது; தமிழில் ‘மூலம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியர்
  rationale: தீர்க்கதரிசனப் பணியளிப்பு சூழலில் கடவுளுக்குச் சேவை செய்பவரையும் அவருக்குரியவரையும் ‘ஊழியர்’ பொருத்தமாகக் குறிக்கிறது.
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி
  rationale: யோனாவின் பங்கை அடையாளப்படுத்தும் வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: מִגַּת הַחֵפֶר
  choice: காத்தேப்பேரைச் சேர்ந்த
  rationale: முன்னொட்டு பிறப்பிடம் அல்லது ஊரைச் சுட்டுகிறது; தமிழில் ‘சேர்ந்த’ இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள இறைவனுடைய தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: יָם הָעֲרָבָה என்ற புவியியல் பெயரின் அடையாளம்
  choice: அரபாவின் கடல்
  alternative: சவக்கடல்
  rationale: முதன்மை உரை எபிரெயச் சொல்லின் உண்மையான வடிவத்தைப் பாதுகாக்கிறது; பெரும்பாலும் குறிக்கப்படும் புவியியல் அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּיַד என்ற மரபுத்தொடரின் வெளிப்பாடு
  choice: மூலம்
  alternative: கையினால்
  rationale: ‘கையினால்’ என்பது மூலவடிவத்திற்கு நெருக்கமானாலும் தமிழில் தவறாக உடல்சார்ந்த செயலாகப் புரியலாம்; ‘மூலம்’ தீர்க்கதரிசி இறைச்செய்தியின் தூதர் என்பதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மூலத்தின் புவியியல் வடிவத்தைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருந்தாத இடங்களில் இருந்ததால், [a] லெபோ-ஆமாத்திற்கும் [b] அரபாவின் கடலுக்கும் பொருளின்படி இணைக்கப்பட்டுள்ளன.
