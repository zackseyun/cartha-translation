base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: ta
  text: ஆனால், கொன்றவர்களின் மகன்களை அவன் மரணதண்டனைக்கு உட்படுத்தவில்லை.[a] “தந்தையர் மகன்களுக்காகக் கொல்லப்படக் கூடாது; மகன்களும் தந்தையருக்காகக் கொல்லப்படக் கூடாது. மாறாக, ஒவ்வொருவனும் தன் பாவத்திற்காகவே சாவான்” என்று யாவே கட்டளையிட்ட மோசேயின் சட்ட நூலில் எழுதப்பட்டிருந்தபடியே அவன் செய்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொலையாளிகளின் பிள்ளைகளை.” எபிரெயத்தில் சொல்லுக்குச் சொல், “கொன்றவர்களின் மகன்களை.”
    reason: lexical_alternative
  - marker: b
    text: இந்த மேற்கோள் உபாகமம் 24:16-ஐச் சார்ந்தது.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: கொன்றவர்களின் மகன்கள்
  rationale: בְּנֵי என்பதன் ஆண்பால் பொருளான ‘மகன்கள்’ என்பதையும், נכה என்ற வினையின் இச்சூழலுக்குரிய ‘கொன்றவர்கள்’ என்ற பொருளையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: לֹא הֵמִית
  choice: கொல்லவில்லை
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தல்/கொல்லுதல்’ என்று பொருள்படும். அரச நீதித்துறைச் சூழலில் இது மரணதண்டனையைக் குறிக்கிறது; தமிழில் ‘கொல்லவில்லை’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டிருந்தது
  rationale: எழுத்தில் பதிவான சட்டத்துடன் அரசனின் செயல் ஒத்திருந்ததைத் தெரிவிக்கிறது. தமிழ் வாக்கிய அமைப்பில் காரணத் தொடர்பைத் தெளிவாக்க ‘ஏனெனில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: மோசேயின் சட்ட நூலில்
  rationale: סֵפֶר என்பதற்கு ‘நூல்’ என்றும் תּוֹרָה என்பதற்கு இச்சட்டச் சூழலில் ‘சட்டம்’ என்றும் மொழிபெயர்த்து, தேவையற்ற சமய மரபுச் சொல்லைச் சேர்க்காமல் மூலத்தைப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹא יוּמְתוּ
  choice: கொல்லப்படக் கூடாது
  rationale: இது சட்டரீதியான தடை கூறும் காரணவினைச் செயப்பாட்டு வடிவம்; வெறும் இயற்கை மரணத்தை அல்ல, பிறரால் கொல்லப்படுவதைச் சுட்டுகிறது.
- source_word: אָבוֹת ... בָּנִים
  choice: தந்தையர் ... மகன்கள்
  rationale: மூல எபிரெயத்தின் ஆண்பால் பன்மையைப் பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: עַל
  choice: …க்காக
  rationale: மற்றொருவரின் குற்றத்தை அடிப்படையாகக் கொண்டு தண்டிக்கப்படுதல் என்ற சட்டப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי אִם
  choice: மாறாக
  rationale: முந்தைய தடைகளுக்கு எதிராக அடுத்த தனிப்பட்ட பொறுப்புக் கோட்பாட்டை அறிமுகப்படுத்தும் மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: பகிர்ந்தளிக்கும் ஒருமைப் பொருளையும் மூலத்தின் ஆண்பால் வடிவையும் காக்கிறது.
- source_word: בְּחֶטְאוֹ
  choice: தன் பாவத்திற்காகவே
  rationale: உடைமைப் பின்னொட்டை ‘தன்’ என்பதால் வெளிப்படுத்தி, பிறருடைய பாவத்திற்காக அல்ல என்ற முரண்பாட்டை ‘வே’ வலியுறுத்துகிறது.
- source_word: יָמוּת
  choice: சாவான்
  rationale: முந்தைய காரணவினைச் செயப்பாட்டு வடிவத்திலிருந்து வேறுபட்ட எளிய Qal வினையான ‘சாவான்’ என்பதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் தனிநபர் பொறுப்பும் குடும்பப் பொறுப்பும்
  choice: தந்தையின் குற்றத்திற்காக மகனையோ மகனின் குற்றத்திற்காகத் தந்தையையோ மரணதண்டனைக்கு உட்படுத்தக் கூடாது; ஒவ்வொருவனும் தன் பாவத்திற்காகவே சாவான் என்ற நீதித்துறைச் சட்டக் கோட்பாடாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பாவத்தினால் எந்தவிதக் குடும்ப அல்லது சமூக விளைவுகளும் ஏற்படாது என்ற விரிவான இறையியல் கூற்றாக வாசித்தல்.
  rationale: இவ்வசனத்தின் சொற்கள் நீதித்துறை சார்ந்த மரணதண்டனையையும் தனிப்பட்ட குற்றப்பொறுப்பையும் குறிக்கின்றன. வேதாகமத்தின் பிற இடங்களில் கூறப்படும் பாவத்தின் சமூக விளைவுகளை இவ்வசனம் மறுப்பதாக மொழிபெயர்ப்பு விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமச் சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தந்தையர்,’ ‘மகன்கள்,’ ‘ஒவ்வொருவனும்’ என்பவை மூலத்தின் ஆண்பால் வடிவத்தைப் பாதுகாக்கின்றன. ‘யாவே’ என்பது இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு. மேற்கோளின் இறுதி வினையில் உள்ள ‘சாவான்’ என்பது முன்னுள்ள ‘கொல்லப்படக் கூடாது’ என்பதிலிருந்து மூலத்தில் காணப்படும் வினைமுறை மாற்றத்தைக் காக்கிறது.
