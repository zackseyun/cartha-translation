    issue: Unsupported addition in the opening phrase
    rationale: “தன் தந்தையைக் கொன்றவர்களின்” adds both “his father” and an explicit object not present in בְּנֵי הַמַּכִּים. The translation should state only “the sons of the killers/those who struck down.”
