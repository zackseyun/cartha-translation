  source_fidelity: 'The draft introduces an unsupported possessive and object in its opening phrase: “தன் தந்தையைக் கொன்றவர்களின்” means “the sons of those who killed his father,” whereas the Hebrew says only “the sons of the killers/those who struck down.” The judicial sense of the main verb should also be expressed as not putting them to death.'
  naturalness: The revised ordering is natural modern standard Tamil and retains the formal legal register appropriate to the verse. “மரணதண்டனைக்கு உட்படுத்தவில்லை” clearly conveys the judicial Hiphil, while the quoted legal principle remains direct and readable.
  terminology: “யாவே,” “மோசேயின் சட்ட நூல்,” “தந்தையர்,” “மகன்கள்,” and “பாவம்” are suitable. The masculine terms in the Hebrew are retained. The final “சாவான்” preserves the source’s shift from passive execution language to the simple verb “die.”
