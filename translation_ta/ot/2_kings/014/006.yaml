- from: ஆனால், தன் தந்தையைக் கொன்றவர்களின் மகன்களை அவன் கொல்லவில்லை.[a] ஏனெனில், “தந்தையர் மகன்களுக்காகக் கொல்லப்படக் கூடாது; மகன்களும் தந்தையருக்காகக் கொல்லப்படக் கூடாது. மாறாக, ஒவ்வொருவனும் தன் பாவத்திற்காகவே சாவான்” என்று யாவே கட்டளையிட்டபடி, மோசேயின் சட்ட நூலில் எழுதப்பட்டிருந்தது.[b]
  to: ஆனால், கொன்றவர்களின் மகன்களை அவன் மரணதண்டனைக்கு உட்படுத்தவில்லை.[a] “தந்தையர் மகன்களுக்காகக் கொல்லப்படக் கூடாது; மகன்களும் தந்தையருக்காகக் கொல்லப்படக் கூடாது. மாறாக, ஒவ்வொருவனும் தன் பாவத்திற்காகவே சாவான்” என்று யாவே கட்டளையிட்ட மோசேயின் சட்ட நூலில் எழுதப்பட்டிருந்தபடியே அவன் செய்தான்.[b]
