translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரச மரண அறிவிப்பின் எபிரெய உருவகத்தை ‘துயிலடைந்தான்’ என்று காத்து, சொற்சொற் மொழிபெயர்ப்பால் ஏற்படக்கூடிய ‘தந்தையரோடு’ என்ற தவறான குறுகிய புரிதலைத் தவிர்க்க ‘முன்னோர்களோடு’ பயன்படுத்தப்பட்டுள்ளது.
