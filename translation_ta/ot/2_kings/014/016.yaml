  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: ta
  text: யோவாஸ் தன் முன்னோர்களோடு துயிலடைந்தான்; சமாரியாவில் இஸ்ரவேலின் அரசர்களோடு அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் யெரொபெயாம் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: இது அரசர்களின் மரணத்தைப் பற்றிய வழக்கமான மறைவுச் சூத்திரம். வெறுமனே ‘இறந்தான்’ என்று விளக்கிவிடாமல், எபிரெய மொழியின் ‘துயில்’ உருவகத்தையும் மரியாதையான தொனியையும் காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: இங்கு אָבוֹת என்பது தந்தையரை மட்டும் அல்லாமல் இறந்துபோன முன்னோரைக் குறிக்கிறது. நவீனத் தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிஃபால் வினை வடிவத்தின் செயப்பாட்டு பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; அதனால் ‘சமாரியாவில்’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்களோடு
  rationale: עִם என்பதன் ‘உடன்/ஓடு’ பொருளையும், முந்தைய இஸ்ரவேல் அரசர்களுடன் அடக்கம் செய்யப்பட்ட தொடர்பையும் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: מלך வினையின் அரசாட்சிப் பொருளை நேரடியாகத் தருகிறது; இது அரச வாரிசுரிமை அறிவிப்பின் சூத்திரத் தன்மைக்கும் பொருந்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: வெறும் காலவரிசையான ‘அவனுக்குப் பின்’ என்பதைக் காட்டிலும், முந்தைய அரசனின் இடத்தை மகன் ஏற்ற வாரிசுரிமைப் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
