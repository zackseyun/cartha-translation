  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: ta
  text: ஆனால் அமத்சியா செவிகொடுக்கவில்லை[a]. ஆகவே இஸ்ரவேலின் அரசன் யோவாஸ் மேலே சென்றான். அவனும் யூதாவின் அரசன் அமத்சியாவும் யூதாவுக்குச் சொந்தமான பெத்-ஷெமேசில் நேருக்கு நேர் சந்தித்தனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்டு நடக்கவில்லை” / “கீழ்ப்படியவில்லை.” எபிரெயச் சொல் வெறுமனே கேட்பதை மட்டுமல்ல, கேட்டதற்கு ஏற்பச் செயல்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “முகங்களைப் பார்த்தார்கள்”; இது நேரடியான சந்திப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: செவிகொடுக்கவில்லை
  rationale: எச்சரிப்பைக் கேட்டு அதற்கேற்ப நடப்பதை இச்சொல் இங்கு குறிக்கிறது. வெறும் ஒலி கேட்டலைவிட ‘செவிகொடுக்கவில்லை’ என்பது சூழலுக்குப் பொருத்தமானது; ‘கீழ்ப்படியவில்லை’ என்பது மேலதிகாரியின் கட்டளை என்ற பொருளை அளிக்கக்கூடும்.
- source_word: וַיַּעַל
  choice: படையெடுத்து வந்தான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே சென்றான்.’ இங்கு இரு அரசர்களின் போர் மோதல் சூழலில் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘படையெடுத்து வந்தான்’ என வழங்கப்பட்டது.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: நேருக்கு நேர் சந்தித்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘முகங்களைப் பார்த்தார்கள்’ என்ற எபிரெய மரபுத்தொடர், இச்சூழலில் நேரடியான மோதலுக்காகச் சந்தித்ததைக் குறிக்கிறது.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷெமேஷ்
  rationale: இடப்பெயர் பொருள் மொழிபெயர்ப்பு செய்யப்படாமல், நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவுக்குச் சொந்தமான
  rationale: இது ஊர் யூதா நாட்டின் எல்லைக்குள் இருப்பதை மட்டும் அல்லாமல் அதன் ஆட்சிப் பகுதியைச் சேர்ந்ததையும் குறிக்கிறது.
- source_word: וְלֹא
  choice: ஆனால்
  rationale: முந்தைய எச்சரிப்புக்கும் அமத்சியாவின் மறுப்புக்கும் இடையிலான முரண்பாட்டை இணைப்புச்சொல் இங்கு வெளிப்படுத்துகிறது.
