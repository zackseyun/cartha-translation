  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசப் பட்டங்கள் இயல்பான தமிழ் சொற்றொடர் வரிசையில் அமைக்கப்பட்டுள்ளன; போர்ச் சூழல் தெளிவாக ‘படையெடுத்து வந்தான்’ என வெளிப்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
