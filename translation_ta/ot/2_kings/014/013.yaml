  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் யோவாஸ், அகசியாவின் மகனான யோவாசின் மகனும் யூதாவின் அரசனுமான அமத்சியாவைப் பெத்-ஷெமேஷில் பிடித்தான். பின்பு அவன் எருசலேமுக்கு வந்தான்[a]; எருசலேமின் மதிலில் எப்பிராயீம் வாசலிலிருந்து மூலை வாசல்வரை நானூறு முழம் அளவுக்கு இடித்துத் தகர்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மெய்யெழுத்துப் பாடத்தில், ‘அவர்கள் எருசலேமுக்கு வந்தார்கள்’ என்று உள்ளது. ஆனால் சூழலும் அடுத்து வரும் ஒருமை வினைச்சொல்லும், யோவாசைக் குறிப்பிட்டு ‘அவன் எருசலேமுக்கு வந்தான்’ என்ற பொருளை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: பிடித்தான்
  rationale: போரின் பின்னணியில் ஓர் அரசனைச் சிறைப்பிடித்ததைக் குறிக்கும் இயல்பான தமிழ் வினை; ‘கைப்பற்றினான்’ என்பது பொதுவாக இடம் அல்லது பொருளுக்குப் பொருத்தமாக இருப்பதால் இங்கு தவிர்க்கப்பட்டது.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: பெத்-ஷெமேஷில்
  rationale: בְּ என்ற இடப்பொருளைத் தமிழின் இயல்பான ‘-இல்’ வேற்றுமை உருபால் வெளிப்படுத்துகிறது; ஊர்ப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: ו/יבאו
  choice: பின்பு அவன் ... வந்தான்[a]
  rationale: எழுத்துரு மெய்யெழுத்துப் பாடம் பன்மையைச் சுட்டினாலும், அடுத்துள்ள ஒருமை வினையும் கதைத் தொடர்ச்சியும் யோவாசைக் குறிக்கும் ஒருமைப் பொருளை ஆதரிக்கின்றன. பாட வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַיִּפְרֹץ
  choice: இடித்துத் தகர்த்தான்
  rationale: மதிலில் உடைப்பு ஏற்படுத்துதல் அல்லது ஒரு பகுதியை இடித்தல் என்ற இராணுவச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: எருசலேமின் மதிலில்
  rationale: எபிரெய முன்னிடைச்சொல்லை மதிலின் குறிப்பிட்ட பகுதியில் நிகழ்ந்த இடிப்பாகத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: எப்பிராயீம் வாசலிலிருந்து மூலை வாசல்வரை
  rationale: இடிக்கப்பட்ட பகுதியின் தொடக்கத்தையும் எல்லையையும் ‘-இலிருந்து ... -வரை’ என்ற தெளிவான தமிழ் அமைப்பில் தருகிறது.
- source_word: הַפִּנָּה
  choice: மூலை வாசல்
  rationale: வாசலின் பெயராக உள்ள ‘Corner Gate’ என்பதன் நேரடியான, புரிந்துகொள்ளக்கூடிய தமிழ் வடிவம்.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: நானூறு முழம் அளவுக்கு
  rationale: பண்டைய அளவான ‘முழம்’ என்பதைக் காக்கிறது; இங்கு மதிலில் இடிக்கப்பட்ட தூரத்தை அளவு குறிக்கிறது என்பதை ‘அளவுக்கு’ தெளிவாக்குகிறது.
- source_word: בֶּן יְהוֹאָשׁ בֶּן אֲחַזְיָהוּ
  choice: அகசியாவின் மகனான யோவாசின் மகன்
  rationale: இருமுறை வரும் בֶּן உறவுமுறையைத் தக்கவைத்து, தமிழில் வம்சத் தொடர்பு தெளிவாக அமையச் செய்கிறது.
