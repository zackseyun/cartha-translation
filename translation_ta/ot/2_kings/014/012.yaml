  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: ta
  text: இஸ்ரவேலிடம் யூதா தோற்கடிக்கப்பட்டது; ஒவ்வொருவனும் தன் கூடாரத்திற்குத் தப்பியோடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொருவனும் தன் வீட்டிற்குத் தப்பியோடினான்.” எபிரெயத்தில் சொல்லுக்கு நேராக, “ஒவ்வொருவனும் தன் கூடாரத்திற்கு” என்று உள்ளது; இது அவரவர் இருப்பிடத்திற்குச் சிதறிச் செல்வதைக் குறிக்கும் வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
