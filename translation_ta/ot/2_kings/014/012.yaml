- source_word: לְאָהֳלוֹ
  choice: தன் கூடாரத்திற்கு
  rationale: சொல்லுக்கு நேரான பொருள் ‘அவனுடைய கூடாரத்திற்கு’; சூழலில் இது ஒருவன் தன் இருப்பிடத்திற்குத் திரும்புவதைக் குறிக்கும் மரபுத்தொடராகவும் இருக்கலாம்.
