- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: வடக்கு அரசின் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவம்.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினான்
  rationale: נוּס என்பது ஓடித் தப்புவதைக் குறிக்கிறது; தொடர்ந்துவரும் பகிர்ந்தளிக்கும் ஒருமையோடு பொருந்த ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
