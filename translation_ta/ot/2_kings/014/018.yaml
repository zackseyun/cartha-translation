lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: יֶתֶר என்பது எஞ்சியவை அல்லது மற்றவை என்பதையும், இந்த அரச வரலாற்றுச் சூத்திரத்தில் דִּבְרֵי என்பது வெறும் சொற்களை அல்லாமல் அரசனின் செயல்களையும் ஆட்சிச் சம்பவங்களையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘மற்ற செயல்கள்’ இந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் வினாவாகப் பாதுகாக்கிறது.
- source_word: הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: செயப்பாட்டு எச்சத்தின் ‘எழுதப்பட்டு இப்போது பதிவாக உள்ளன’ என்ற விளைவு நிலையை நெருக்கமாகக் காட்டுகிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: எழுத்துப்பூர்வமான பதிவில் இருப்பதைக் குறிக்கும் இச்சூழலில் עַל என்பதற்கு தமிழில் ‘புத்தகத்தில்’ என்பது இயல்பான இடவியல் வடிவம்.
- source_word: דִּבְרֵי הַיָּמִים
  choice: நாளாகமம்
  rationale: அரசர்களைப் பற்றிய காலவரிசைப் பதிவைக் குறிக்கும் மரபான, பொருத்தமான தமிழ் சொல்; ‘ஆண்டுக் குறிப்பேடு’ என்பதும் சாத்தியம்.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின்
  rationale: ஆவணத்தின் தலைப்பில் உள்ள לְ உறவை இயல்பான தமிழ் உடைமைத் தொடராக வெளிப்படுத்துகிறது.
