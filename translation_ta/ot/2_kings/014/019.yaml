revisions:
- from: எருசலேமில் அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள். அவன் லாகீசுக்குத் தப்பியோடினான்; அவர்கள் அவனுக்குப் பின்னால் லாகீசுக்கு அனுப்பினார்கள்[a]. அங்கே அவனைக் கொன்றுபோட்டார்கள்.
  to: எருசலேமில் அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்; அவன் லாகீசுக்குத் தப்பியோடினான். அவர்கள் அவனைப் பின்தொடர்ந்து லாகீசுக்கு ஆட்களை அனுப்பினார்கள்[a]; அங்கே அவனைக் கொன்றார்கள்.
  rationale: The revision retains the sequence and political sense of the Hebrew while making the pursuit clause grammatical and transparent in modern Tamil. The supplied “ஆட்களை” is limited to what the act of sending after a fugitive necessarily implies and is disclosed by a footnote preserving the literal Hebrew wording. The final verb is made register-neutral without weakening the sense that he was killed there.
