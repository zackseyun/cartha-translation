base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: ta
  text: எருசலேமில் அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்; அவன் லாகீசுக்குத் தப்பியோடினான். அவர்கள் அவனைப் பின்தொடர்ந்து லாகீசுக்கு ஆட்களை அனுப்பினார்கள்[a]; அங்கே அவனைக் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பின்னால் லாகீசுக்கு அனுப்பினார்கள்.” எபிரெய மொழியில் சொல்லர்த்தமாக, “அவனுக்குப் பின்னால் அனுப்பினார்கள்”; அனுப்பப்பட்டவர்கள் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்
  rationale: வினைச்சொல்லும் அதே வேரைச் சேர்ந்த பெயர்ச்சொல்லும் இணைந்து அரசியல் சதியைக் குறிக்கும் எபிரெய மொழிவழக்கை, இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னிடைச்சொல்லையும் இடப்பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: וַיָּנָס
  choice: தப்பியோடினான்
  rationale: נוּס என்பதன் ‘ஆபத்திலிருந்து ஓடுதல்’ என்ற பொருளை இயல்பான கதைநடைத் தமிழில் தருகிறது.
- source_word: לָכִישָׁה
  choice: லாகீசுக்கு
  rationale: இடப்பெயருடன் வரும் திசைகாட்டும் ה, அந்த நகரை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: அவனுக்குப் பின்னால் ... அனுப்பினார்கள்
  rationale: ‘அவனுக்குப் பின்னால் அனுப்பினார்கள்’ என்ற எபிரெயச் சொற்றொடரின் சுருக்கத்தையும், அனுப்பப்பட்ட நபர்கள் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததையும் காக்கிறது; சூழலில் இது பின்தொடர்ந்து செல்வதைக் குறிக்கிறது.
- source_word: וַיְמִתֻהוּ
  choice: அவனைக் கொன்றுபோட்டார்கள்
  rationale: מות என்பதன் காரணவினை வடிவம் நோக்கத்துடன் உயிரைக் கொல்வதைக் குறிக்கிறது; ‘கொன்றுபோட்டார்கள்’ என்பது இயல்பான தமிழில் அதன் திட்டமிட்ட செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட லாகீசைக் குறிக்கும் இடவினையடை.
