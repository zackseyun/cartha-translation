translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைப்புச் சொற்களின் தொடர்ச்சியைப் பேணியபோதும், தமிழில் தெளிவுக்காக வாக்கியங்கள் பிரிக்கப்பட்டுள்ளன. அனுப்பப்பட்டவர்கள் யார் என்பதை மூலத்தை மீறி ‘ஆட்கள்’ என்று சேர்க்காமல் விடப்பட்டுள்ளது.
