base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: ta
  text: யூதாவின் அரசனாகிய யோவாசின் மகன் அமத்சியாவின் பதினைந்தாம் ஆட்சியாண்டில், இஸ்ரவேலின் அரசனாகிய யோவாசின் மகன் யெரொபெயாம் சமாரியாவில் அரசனானான்; அவன் நாற்பத்தொன்று ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: ஆட்சி செய்த பதினைந்தாம் ஆண்டில்
  rationale: அரசாண்டுக் காலக் கணக்கைக் குறிக்கும் எபிரெய மரபுச் சொற்றொடரைத் தமிழில் தெளிவாகக் காட்ட ‘ஆட்சி செய்த’ என்பது சேர்க்கப்பட்டது; எண்ணிக்கை இங்கு காலநீளமல்ல, பதினைந்தாம் ஆட்சியாண்டைக் குறிக்கிறது.
- source_word: לַאֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான யோவாசின் மகன் அமத்சியா
  rationale: முன்னிலை ל அரசாண்டுக் காலத்தின் தொடர்பைக் குறிக்கிறது. தந்தை மற்றும் அரசுப் பதவி பற்றிய அடையாளங்களை இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
- source_word: מָלַךְ
  choice: அரசனாகி
  rationale: இங்கு வினை அரசாட்சியின் தொடக்கத்தைக் குறிக்கிறது; பின்னர் வரும் ஆட்சிக்கால நீளத்திலிருந்து இதை வேறுபடுத்த ‘அரசனாகி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָרָבְעָם בֶּן־יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனான யோவாசின் மகன் யெரொபெயாம்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு, தந்தை மற்றும் அரசுப் பதவி பற்றிய கூறுகள் இயல்பான தமிழ் வரிசையில் அமைக்கப்பட்டன.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னிலையைத் தலைநகரான சமாரியாவில் என்று இயல்பாக வழங்குகிறது.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: நாற்பத்தோரு ஆண்டுகள்
  rationale: எபிரெய எண்ணிக்கைக் கட்டமைப்பின் பொருளை நவீனத் தமிழின் வழக்கமான எண்ணிக்கை வடிவில் வழங்குகிறது.
