translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்தியுள்ளது. ‘அரசனாகி’ என்பது அரியணையேற்றத்தையும், ‘ஆட்சி செய்தான்’ என்பது ஆட்சிக்கால நீளத்தையும் தெளிவாக வேறுபடுத்துகிறது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
