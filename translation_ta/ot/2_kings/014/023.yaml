- from: யூதாவின் அரசனான யோவாசின் மகன் அமத்சியா ஆட்சி செய்த பதினைந்தாம் ஆண்டில், இஸ்ரவேலின் அரசனான யோவாசின் மகன் யெரொபெயாம் சமாரியாவில் அரசனாகி, நாற்பத்தோரு ஆண்டுகள் ஆட்சி செய்தான்.
  to: யூதாவின் அரசனாகிய யோவாசின் மகன் அமத்சியாவின் பதினைந்தாம் ஆட்சியாண்டில், இஸ்ரவேலின் அரசனாகிய யோவாசின் மகன் யெரொபெயாம் சமாரியாவில் அரசனானான்; அவன் நாற்பத்தொன்று ஆண்டுகள் ஆட்சி செய்தான்.
