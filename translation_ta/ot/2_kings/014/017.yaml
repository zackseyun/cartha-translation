  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: ta
  text: யூதாவின் அரசனான யோவாசின் மகன் அமத்சியா, இஸ்ரவேலின் அரசனான யெகோவாகாசின் மகன் யெகோவாஸ் இறந்தபின் பதினைந்து ஆண்டுகள் வாழ்ந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: உயிர்வாழ்ந்தார்
  rationale: மற்றொரு அரசன் இறந்தபின் குறிப்பிட்ட காலம் தொடர்ந்து வாழ்ந்ததை இச்சொல் தெரிவிக்கிறது. ‘வாழ்ந்தார்’ என்பதும் சாத்தியம்; ஆனால் இச்சூழலில் ‘உயிர்வாழ்ந்தார்’ என்பது காலவரிசை உறவை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: בֶן יוֹאָשׁ
  choice: யோவாசின் மகன்
  rationale: அரசரை அடையாளப்படுத்தும் தந்தை–மகன் உறவை நேரடியாகக் காட்டுகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அமத்சியாவின் அரச பதவியையும் ஆட்சிப் பகுதியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֵי מוֹת
  choice: இறந்தபின்
  rationale: ‘மரணத்திற்குப் பின்’ என்ற பெயர்ச்சொல் வடிவமும் சாத்தியம்; ‘இறந்தபின்’ என்பது பொருளை மாற்றாமல் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: יְהוֹאָשׁ
  choice: யெகோவாஸ்
  rationale: இவ்வசனத்தில் உள்ள நீளமான எபிரெய எழுத்துவடிவத்தை பிரதிபலித்து, அமத்சியாவின் தந்தையான யோவாசிடமிருந்து இஸ்ரவேல் அரசனை வேறுபடுத்துகிறது.
- source_word: בֶן יְהוֹאָחָז
  choice: யெகோவாகாசின் மகன்
  rationale: தந்தை–மகன் உறவை நேரடியாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: வடக்கு அரசின் அரச பதவியையும் ஆட்சிப் பகுதியையும் தெளிவாகக் காட்டுகிறது.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: பதினைந்து ஆண்டுகள்
  rationale: காலநீளத்தைக் குறிக்கும் எபிரெய எண்ணுத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
