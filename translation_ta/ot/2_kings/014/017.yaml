translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் காலக்குறிப்புக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே வசனத்தில் வேறுபட்ட எபிரெய எழுத்துவடிவங்களில் வரும் יוֹאָשׁ மற்றும் יְהוֹאָשׁ ஆகிய பெயர்கள் குழப்பம் தவிர்க்க முறையே ‘யோவாஸ்’, ‘யெகோவாஸ்’ என்று வேறுபடுத்தப்பட்டுள்ளன; இதை விளக்கத் தனி அடிக்குறிப்பு அவசியமில்லை.
