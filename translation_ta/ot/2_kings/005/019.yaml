  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: ta
  text: அவர் அவனிடம், “சமாதானமாகப் போ” என்றார். அவன் அவரைவிட்டுச் சில தூரம்[a] சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் துல்லியமான அளவைக் குறிப்பிடாமல், ஒரு பயணத் தொலைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: அவர் அவனிடம் … என்றார்
  rationale: எபிரெய உரையில் இருவரும் பதிற்பெயர்களால் குறிக்கப்படுகின்றனர். தமிழில் எலிசாவுக்கு மரியாதைப் பன்மையையும் நாமானுக்கு ஒருமையையும் பயன்படுத்துவது, பெயர்களைச் சேர்க்காமல் உரையாடுபவர்களை இயல்பாக வேறுபடுத்துகிறது.
- source_word: לֵךְ לְשָׁלוֹם
  choice: சமாதானத்துடன் போ
  rationale: இது ஆசீர்வாதத்தோடு வழியனுப்பும் வழக்கமான எபிரெயச் சொற்றொடர். שָׁלוֹם என்பதன் சமாதானம், நலம் ஆகிய பொருள் வளத்தை ஓரளவு காக்கிறது.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: அவன் அவரைவிட்டுச் … சென்றான்
  rationale: தொடர்ந்து நிகழும் செயலை இயல்பான தமிழ் கதைநடையில் தெரிவித்து, நாமான் எலிசாவின் முன்னிலையிலிருந்து புறப்பட்டதைத் தெளிவாக்குகிறது.
- source_word: כִּבְרַת אָרֶץ
  choice: சிறிது தொலைவு
  rationale: குறிப்பிட்ட அளவைக் கூறாமல் பயணித்த ஒரு தொலைவைக் குறிக்கும் எபிரெயத் தொடர்; தொலைவை மிகைப்படுத்தாமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ரிம்மோனின் கோவிலில் நாமான் நடந்துகொள்ளப்போவது குறித்த அவனுடைய வேண்டுகோளுக்கு எலிசா அளித்த பதில்
  choice: “சமாதானத்துடன் போ” என்ற சுருக்கமான ஆசீர்வாதம் அல்லது வழியனுப்பும் சொல்லாகவே மொழிபெயர்த்தல்
  alternative: நாமானின் முன்மொழிவுக்கு எலிசா வெளிப்படையாக ஒப்புதல் அளித்தார் என்றோ, அறநெறி சாராத வெறும் விடைபெறுதலாக மட்டுமே கூறினார் என்றோ விரித்துரைத்தல்
  rationale: எபிரெய உரை வழக்கமான ஆசீர்வாத அல்லது வழியனுப்பும் சொற்றொடரை மட்டுமே தருகிறது. ஒப்புதல் அல்லது கண்டனம் எதையும் மொழிபெயர்ப்பில் சேர்க்காமல், உரையின் இறையியல் பதற்றமும் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எலிசாவையும் நாமானையும் இயல்பாக வேறுபடுத்த மரியாதை ஒருமை/பன்மை வேறுபாடு பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத விளக்கப் பெயர்கள் சேர்க்கப்படவில்லை.
