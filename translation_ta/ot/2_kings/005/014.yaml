base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: ta
  text: ஆகவே அவன் இறங்கிச் சென்று, கடவுளின் மனிதர் சொன்னபடியே யோர்தானில் ஏழு முறை தன்னை மூழ்கடித்துக்கொண்டான்.[a] அப்போது அவனுடைய சதை ஒரு சிறுவனின் சதைபோல் மீண்டும் மாறியது; அவன் தூய்மையானான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைத் தோய்த்துக்கொண்டான்.” எபிரேய வினைச்சொல் தோய்த்தலையோ மூழ்குதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் தூய்மையடைந்தான்.” எபிரேய வினைச்சொல் தூய நிலைக்கு வந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ஆகவே அவன் இறங்கிப்போய்
  rationale: தொடர்கதை வாவ் நிகழ்வை முன்னெடுத்துச் செல்கிறது; முந்தைய அறிவுறுத்தலுக்கான நாகமானின் பதிலை ‘ஆகவே’ வெளிப்படுத்துகிறது. ירד என்பதன் கீழ்நோக்கிய இயக்கத்தையும் ‘இறங்கிப்போய்’ காக்கிறது.
- source_word: וַיִּטְבֹּל
  choice: மூழ்கினான்
  rationale: טבל என்பது தோய்தல் அல்லது மூழ்குதல் எனப் பொருள்படும். இங்கு ஆற்றில் தன்னையே மூழ்கடித்த செயலை இயல்பான தமிழில் ‘மூழ்கினான்’ தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּיַּרְדֵּן
  choice: யோர்தானில்
  rationale: ஆற்றின் பெயரைத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்த்து, இடவேற்றுமையுடன் வழங்குகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: மீண்டும் செய்யப்பட்ட செயலைக் குறிக்கும் எளிய, நேரான தமிழ் எண்ணுத் தொடர்.
- source_word: כִּדְבַר
  choice: சொன்னபடியே
  rationale: דבר இங்கு இறைவனுடைய மனிதர் கூறிய அறிவுறுத்தலைக் குறிக்கிறது. சொல்/கட்டளை என்று அளவுக்கு மீறித் தீர்மானிக்காமல், அதற்கு இணங்கச் செய்ததை இயல்பாகச் சொல்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: எபிரேய வேதாகமத்தின் தீர்க்கதரிசனப் பட்டத்தை நெருக்கமாகவும் கண்ணியமாகவும் காக்கிறது.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: அவனுடைய சதை மீண்டும் ஆனது
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ கருத்தையும் בשר என்பதன் உடல்சார்ந்த ‘சதை’ படிமத்தையும் காக்கிறது; தமிழில் ஒப்புமையுடன் இயல்பாக இணைகிறது.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: ஒரு சிறுவனின் சதையைப்போல்
  rationale: נער קטן குறிக்கும் இளம் சிறுவனையும், முன் வந்த בשר என்ற சொல்லின் மீளுரைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּטְהָר
  choice: அவன் தூய்மையாக்கப்பட்டான்
  rationale: טהר இங்கு தூய நிலைக்கு வந்த முடிவைக் குறிக்கிறது. உடல் குணமடைதலும் சடங்குசார் தூய்மையும் கொண்டுள்ள உரையின் பதற்றத்தை ‘தூய்மையாக்கப்பட்டான்’ தக்கவைக்கிறது; நிலைமையைக் குறிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: நாகமானின் மீட்பின் இயல்பு
  choice: உடலின் மீட்பை ‘சதை மீண்டும் ஆனது’ என்றும், தூய்மையின் விளைவை ‘தூய்மையாக்கப்பட்டான்’ என்றும் தனித்தனியாகக் கூறுதல்
  alternative: முழுவதையும் மருத்துவ மொழியில் ‘குணமடைந்தான்’ என்று மட்டும் வழங்குதல், அல்லது சடங்குத் தூய்மையை மட்டும் முன்னிறுத்துதல்
  rationale: எபிரேய உரை உடல்சார்ந்த புதுப்பிப்பையும் தூய்மையையும் இரண்டையும் கூறுகிறது. எந்தச் சாக்கிரமெந்த அல்லது முன்நிழல் விளக்கத்தையும் உரைக்குள் சேர்க்காமல் இரு பரிமாணங்களையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இறைவனுடைய மனிதர்’ என்ற தீர்க்கதரிசனப் பட்டமும், ‘சதை’ என்ற உடல்சார்ந்த படிமமும் பாதுகாக்கப்பட்டுள்ளன; மருத்துவ அல்லது சமயக் கோட்பாட்டு விளக்கங்கள் மேலதிகமாகச் சேர்க்கப்படவில்லை.
