base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: ta
  text: அப்போது அவனுடைய பணியாளர்கள் அவனருகே வந்து அவனிடம் பேசினார்கள். அவர்கள், “என் தந்தையே, இறைவாக்கினர் உம்மிடம் ஏதாவது பெரிய காரியத்தைச் செய்யச் சொல்லியிருந்தால், நீர் அதைச் செய்திருக்க மாட்டீரா? அப்படியிருக்க, ‘குளித்து, தூய்மையாவீர்’[a] என்று அவர் உம்மிடம் சொல்லும்போது, அதைச் செய்ய வேண்டாமா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுவீர்.” எபிரெயச் சொல் தூய்மையாகுதல் அல்லது தூய்மைப்படுதல் என்னும் பொருளில் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: அவனருகே வந்து
  rationale: நגשׁ என்பதன் அணுகுதல் என்ற இயக்கப் பொருளை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: இச்சூழலில் நாகமானுக்குக் கீழ்ப்பட்டுப் பணியாற்றும் ஆட்களைக் குறிக்கிறது; அடிமை நிலையைத் தேவையின்றி முன்னிறுத்தாமல் உறவைத் தெளிவாக்குகிறது.
- source_word: אָבִי
  choice: என் தந்தையே
  rationale: இது நேரடியான தந்தை உறவல்ல; கீழ்நிலையிலுள்ளோர் மேலதிகாரியை அன்பும் மரியாதையும் கலந்து அழைக்கும் உருவகச் சொல்லை அப்படியே காக்கிறது.
- source_word: דָּבָר גָּדוֹל
  choice: ஏதாவது கடினமான செயல்
  rationale: இங்கு גָּדוֹל வெறும் அளவுப் பெருமையைவிடச் செய்யக் கடினமான அல்லது பெரிய கோரிக்கையைக் குறிக்கிறது; எளிய கட்டளையுடன் உள்ள எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: எலிசாவைக் குறிக்கும் வரையறுக்கப்பட்ட தீர்க்கதரிசி பட்டத்துக்கு நவீன, மரியாதையான தமிழ் இணை.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: நீர் அதைச் செய்திருக்க மாட்டீரா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய வினாவின் சொல்லாட்சிச் சக்தியைக் காக்கிறது.
- source_word: וְאַף כִּי
  choice: அப்படியிருக்க ... அதைச் செய்வது எவ்வளவு எளிது!
  rationale: பெரியதிலிருந்து சிறியதுக்குச் செல்லும் வலியுறுத்திய தர்க்கத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: רְחַץ
  choice: குளியும்
  rationale: யோர்தானில் உடலைக் கழுவும் சூழலில் வெறும் ‘கழுவும்’ என்பதைவிட இயல்பாகவும் குறிப்பாகவும் உள்ளது.
- source_word: וּטְהָר
  choice: தூய்மையாவீர்
  rationale: உடல் நலமடைதல் மற்றும் தூய்மை ஆகிய இரு எதிரொலிகளையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: טהר என்பதன் குணமாதல்–தூய்மை சார்ந்த நுட்பம்
  choice: தூய்மையாவீர்
  alternative: தூய்மைப்படுத்தப்படுவீர்
  rationale: எபிரெய வினை தூய நிலையை அடைதல் அல்லது தூய்மைப்படுத்தப்படுதல் ஆகிய நெருங்கிய பொருட்களை ஏற்கக்கூடும். முதன்மை உரை விளைவு நிலையை இயல்பாகக் கூறுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. பணியாளர்களின் துணிவானதாயினும் மரியாதைமிக்க உரையாடல் காக்கப்பட்டுள்ளது; இறுதி வாக்கியம் சொல்லுக்குச் சொல் வடிவத்தைவிட எபிரெய ‘எவ்வளவு அதிகமாக’ என்ற தர்க்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
