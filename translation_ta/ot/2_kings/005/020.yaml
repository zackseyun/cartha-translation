review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sense, roles, ethnic designation, pursuit, and intended acquisition. However, the rendering of the Hebrew oath formula as “யாவே உயிருடன் இருப்பது உறுதி!” recasts an oath as a simple assertion and should be made explicitly oath-like.
  naturalness: The narrative is generally clear modern Tamil. “யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக” is more idiomatic in context than the current exclamatory assertion and integrates naturally with Gehazi’s resolve.
  terminology: “பணியாளன்,” “எஜமான்,” “அரமேயன்,” and “யாவே” are suitable. “இறைவனுடைய மனிதர்” is clearer and more natural in modern standard Tamil than the compressed compound “இறைமனிதர்,” while retaining the established prophetic title.
  issues:
  - severity: medium
    issue: The oath formula is not adequately represented as an oath.
    rationale: חַי־יְהוָה is an oath formula, literally and idiomatically ‘As YHWH lives.’ “யாவே உயிருடன் இருப்பது உறுதி!” means roughly ‘It is certain that Yahweh is alive,’ which loses Gehazi’s self-binding oath before his stated intention.
  - severity: low
    issue: The prophetic title is overly compressed.
    rationale: “இறைமனிதர்” is understandable, but “இறைவனுடைய மனிதர்” more transparently represents אִישׁ הָאֱלֹהִים and is smoother in standard Tamil prose.
  revised_text: ஆனால், இறைவனுடைய மனிதரான எலிசாவின் பணியாளன் கேயாசி, “இதோ, என் எஜமான் இந்த அரமேயனான நாமானிடமிருந்து அவன் கொண்டுவந்ததைப் பெற்றுக்கொள்ளாமல் அவனை விட்டுவிட்டார். யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக, நான் அவன் பின்னால் ஓடிப்போய், அவனிடமிருந்து ஏதாவது பெற்றுக்கொள்வேன்” என்று சொன்னான்.
  revised_footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இது ஒரு ஆணைச் சூத்திரம்: “யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக.” தொடர்ந்து கூறப்படும் செயலை உறுதிப்படுத்த இது பயன்படுத்தப்படுகிறது.'
