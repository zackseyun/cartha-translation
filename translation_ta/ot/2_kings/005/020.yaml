source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: ta
  text: ஆனால், இறைவனுடைய மனிதரான எலிசாவின் பணியாளன் கேயாசி, “இதோ, என் எஜமான் இந்த அரமேயனான நாமானிடமிருந்து அவன் கொண்டுவந்ததைப் பெற்றுக்கொள்ளாமல் அவனை விட்டுவிட்டார். யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக, நான் அவன் பின்னால் ஓடிப்போய், அவனிடமிருந்து ஏதாவது பெற்றுக்கொள்வேன்” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: பணியாளன்
  rationale: இங்கு வயதைவிட எலிசாவிடம் கேயாசி வகித்த பணிசார் நிலையே கருத்தில் உள்ளது; ஆகவே ‘இளைஞன்’ என்பதற்குப் பதிலாக இயல்பான ‘பணியாளன்’ பயன்படுத்தப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைமனிதர்
  rationale: தீர்க்கதரிசிக்குரிய நிலையான எபிரெயப் பட்டத்தைச் சுருக்கமாகவும் வெளிப்படையாகவும் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேயாசியின் உணர்ச்சிமிகு கவன ஈர்ப்பைத் தக்கவைக்கும், தமிழில் கண்ணியமான உரையாடல் வடிவம்.
- source_word: חָשַׂךְ
  choice: அவனை விட்டுவிட்டார்
  rationale: எலிசா நாமானிடமிருந்து காணிக்கையைப் பெறாமல் அவனுக்கு விலக்களித்தார் என்ற சூழல்சார் பொருளை, கேயாசியின் குறைகூறும் பார்வையுடன் இயல்பாகத் தருகிறது.
- source_word: הָאֲרַמִּי הַזֶּה
  choice: இந்த அரமேயனான
  rationale: ‘இந்த’ என்ற சுட்டுச் சொல்லையும் ‘அரமேயன்’ என்ற வரலாற்று இன-அரசியல் குறிப்பையும் தக்கவைக்கிறது.
- source_word: מִקַּחַת מִיָּדוֹ אֵת אֲשֶׁר הֵבִיא
  choice: அவன் கொண்டுவந்ததை அவனிடமிருந்து பெற்றுக்கொள்ளாமல்
  rationale: ‘அவன் கையிலிருந்து’ என்ற எபிரெய மரபுத்தொடரை சொற்சொல்லாகக் கடினப்படுத்தாமல், அதன் பெறுதல் சார்ந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிருடன் இருப்பது உறுதி
  rationale: தெய்வீகப் பெயரைப் பெயராகவே தக்கவைத்து, எபிரெய ஆணைச் சூத்திரத்தின் வலிமையை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: רַצְתִּי אַחֲרָיו
  choice: அவன் பின்னால் ஓடிப்போய்
  rationale: உடனடியான விரட்டிச் செல்லுதலை உயிரோட்டமாகவும் மூலத்துக்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: அவனிடமிருந்து ஏதாவது பெற்றுக்கொள்வேன்
  rationale: இங்கு ‘எதையாவது எடுத்தல்’ என்பது ஒரு பரிசையோ பொருளையோ பெற்றுக்கொள்வதைக் குறிக்கிறது; தமிழில் ‘பெற்றுக்கொள்வேன்’ அந்த நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக வருகிறது. அதை ஒரு பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ‘Yahweh’ உச்சரிப்புக்கு நெருக்கமான தமிழாக்கமாக ‘யாவே’ தரப்பட்டது.
- issue: חַי־יְהוָה என்ற ஆணை மொழி
  choice: யாவே உயிருடன் இருப்பது உறுதி!
  alternative: யாவே உயிரோடிருப்பதுபோல
  rationale: இது யாவேயின் உயிரைச் சுட்டும் சாதாரண கூற்று அல்ல; கேயாசி தனது அடுத்த செயலுக்கு உறுதியளிக்கும் ஆணைச் சூத்திரம். அந்தச் செயல்பாட்டைத் தெளிவாக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கேயாசியின் குறைகூறும் தொனியும் உடனடியாகப் பின்தொடரத் தீர்மானிக்கும் வேகமும் தக்கவைக்கப்பட்டுள்ளன; எபிரெயச் சொற்றொடரின் இயல்பற்ற சொல் வரிசை தமிழுக்கேற்றவாறு மென்மைப்படுத்தப்பட்டுள்ளது.
