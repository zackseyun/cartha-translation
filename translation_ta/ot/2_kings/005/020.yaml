revisions:
- from: ஆனால் இறைமனிதரான எலிசாவின் பணியாளன் கேயாசி, “இதோ, என் எஜமான் இந்த அரமேயனான நாமான் கொண்டுவந்ததை அவனிடமிருந்து பெற்றுக்கொள்ளாமல் அவனை விட்டுவிட்டார். யாவே உயிருடன் இருப்பது உறுதி![a] நான் அவன் பின்னால் ஓடிப்போய், அவனிடமிருந்து ஏதாவது பெற்றுக்கொள்வேன்” என்று சொன்னான்.
  to: ஆனால், இறைவனுடைய மனிதரான எலிசாவின் பணியாளன் கேயாசி, “இதோ, என் எஜமான் இந்த அரமேயனான நாமானிடமிருந்து அவன் கொண்டுவந்ததைப் பெற்றுக்கொள்ளாமல் அவனை விட்டுவிட்டார். யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக, நான் அவன் பின்னால் ஓடிப்போய், அவனிடமிருந்து ஏதாவது பெற்றுக்கொள்வேன்” என்று சொன்னான்.
  rationale: The revision makes the oath force of חַי יְהוָה explicit without adding doctrinal interpretation. It also expands the standard prophetic title for clarity. The phrase about not receiving what Naaman brought is retained in a natural Tamil form and continues to express Elisha’s refraining from taking the offered gift.
