base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: ta
  text: அப்போது நாகமான், “அப்படியில்லையெனில், தயவுசெய்து ஒரு ஜோடி கோவேறு கழுதைகள் சுமக்கக்கூடிய அளவு மண்[a][b] உமது அடியேனுக்குக் கொடுக்கப்படட்டும். ஏனெனில், இனி உமது அடியேன் மற்ற தெய்வங்களுக்குத் தகனபலியையோ பலியையோ செலுத்தாமல், யாவேவுக்கு[c] மட்டுமே செலுத்துவான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை “ஒரு ஜோடி கோவேறு கழுதைகளின் சுமை” அல்லது “இரண்டு கோவேறு கழுதைகள் சுமக்கும் அளவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நாகமான் இஸ்ரவேல் மண்ணைக் கேட்டது, ஒரு தெய்வத்தை ஒரு நாட்டோடு தொடர்புபடுத்திய பண்டைய கருத்தை பிரதிபலிக்கலாம்; அல்லது இஸ்ரவேல் மண்ணின்மேல் யாவேவை வழிபட அவன் விரும்பியிருக்கலாம். அவன் காரணத்தை உரை வெளிப்படையாகக் கூறவில்லை.
    reason: cultural_note
  - marker: c
    text: “யாவே” என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וָלֹא
  choice: அப்படியென்றால்
  rationale: முந்தைய வசனத்தில் எலிசா பரிசை ஏற்க மறுத்ததற்கு நாகமான் அளிக்கும் நிபந்தனை சார்ந்த பதிலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: தயவுசெய்து ... உமது அடியேனுக்குக் கொடுக்கப்படட்டும்
  rationale: נָא காட்டும் பணிவான வேண்டுகோளையும் எபிரெய வினையின் செயப்பாட்டு வடிவையும் காக்கிறது.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: ஒரு ஜோடி கோவேறு கழுதைகள் சுமக்கக்கூடிய அளவு மண்
  rationale: சொல்லுக்குச் சொல் அமைப்பால் தமிழில் ஏற்படும் தெளிவின்மையைத் தவிர்த்து, ஒரு ஜோடி கோவேறு கழுதைகள் சுமக்கும் மண்ணின் அளவு என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עֹלָה וָזֶבַח
  choice: தகனபலியையோ வேறு பலியையோ
  rationale: עֹלָה என்பதன் குறிப்பான முழுமையாக எரிக்கப்படும் பலி வகையை ‘தகனபலி’ எனவும், זֶבַח என்பதன் பொதுவான பலிப்பொருளை வேறுபடுத்த ‘வேறு பலி’ எனவும் வழங்குகிறது.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: மற்ற தெய்வங்களுக்கு
  rationale: பலிகள் செலுத்தப்படும் பெறுநர்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כִּי אִם לַיהוָה
  choice: யாவேவுக்கு மட்டுமே
  rationale: כִּי אִם குறிக்கும் வலுவான விலக்கையும் தனிப்பட்ட அர்ப்பணிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரான YHWH-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: நாகமான் இஸ்ரவேல் நாட்டின் மண்ணைக் கேட்பதற்கான காரணம்
  choice: மண்ணுக்கான வேண்டுகோளை நேரடியாக மொழிபெயர்த்து, அதன் நோக்கத்தை முதன்மை உரையில் விளக்கவில்லை
  alternative: ஒரு பலிபீடத்தின் அடித்தளத்திற்காகவோ இஸ்ரவேல் மண்ணிலேயே யாவேவை வழிபடுவதற்காகவோ கேட்டதாக வெளிப்படையாக விளக்குதல்
  rationale: அவன் வேண்டுகோளையும் யாவேவுக்கு மட்டுமே பலி செலுத்தும் தீர்மானத்தையும் வசனம் இணைக்கிறது; ஆனால் மண்ணைக் கேட்டதற்கான சரியான காரணத்தைச் சொல்லவில்லை. ஆகவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: יהוה என்ற இறைத் திருப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, YHWH என்ற தனிப்பட்ட இறைத் திருப்பெயரே இடம்பெறுவதால் அதை பெயராகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பணிவும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. “உமது அடியேன்” என்பது நாகமானின் தாழ்மையான மூன்றாம் நபர் சுயக்குறிப்பைத் தக்கவைக்கிறது; மற்ற வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குத் தெளிவாக வைக்கப்பட்டுள்ளது.
