base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: ta
  text: ஆனால் அவன், “நான் யாருடைய முன்னிலையில் நிற்கிறேனோ அந்த யாவே உயிரோடிருக்கிறார் என்ற ஆணையாக, இதை நான் பெற்றுக்கொள்ளவே மாட்டேன்”[a] என்றான். அதை பெற்றுக்கொள்ளும்படி நாமான் அவனை மிகவும் வற்புறுத்தினான்; ஆனாலும் அவன் மறுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் இது ஓர் உறுதிமொழிச் சூத்திரம். சொல்லுக்குச் சொல்: “யாவே உயிரோடிருக்கிறார் ... நான் இதைப் பெற்றுக்கொண்டால்”; இங்கு “பெற்றுக்கொண்டால்” என்பது வலிமையான மறுப்பைக் குறிக்கிறது: “நான் நிச்சயமாக இதைப் பெற்றுக்கொள்ள மாட்டேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: அந்த யெகோவா உயிரோடிருப்பது உறுதி
  rationale: எபிரெய உறுதிமொழிச் சூத்திரத்தின் solemn force-ஐ இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘யெகோவா உயிருள்ளவர்’ என்பதைக் காட்டிலும் இச்சூழலில் உறுதிமொழித் தன்மை தெளிவாகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்புப் பெயரால் மாற்றாமல், மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: நான் யாருடைய முன்னிலையில் நிற்கிறேனோ
  rationale: தேவனுடைய முன்னிலையில் நிற்பது என்ற அரண்மனை/தீர்க்கதரிசி ஊழியச் சொல்லோவியத்தைப் பாதுகாக்கிறது; ‘நான் சேவிக்கிற’ என்று விளக்கமாகச் சுருக்கவில்லை.
- source_word: אִם אֶקָּח
  choice: இதை நான் ஏற்றுக்கொள்ளவே மாட்டேன்
  rationale: உறுதிமொழியில் אִם மறைமுகமான வலிய மறுப்பைக் குறிக்கிறது. சூழலில் பொருள் நாமானின் பரிசாதலால் ‘இதை’ சேர்க்கப்பட்டது; ‘ஏற்றுக்கொள்’ தமிழில் பரிசைப் பெறுவதை இயல்பாகக் குறிக்கிறது.
- source_word: וַיִּפְצַר בּוֹ
  choice: அவனை மிகவும் வற்புறுத்தினான்
  rationale: פצר சொல்லின் தீவிரமான வற்புறுத்தலை ‘மிகவும்’ என்பதுடன் தெளிவாகத் தருகிறது.
- source_word: לָקַחַת
  choice: அதை ஏற்றுக்கொள்ளும்படி
  rationale: முன்னைய לקח உடனான கருத்துத் தொடர்பைத் தக்கவைத்து, பரிசை ஏற்றுக்கொள்ளுதல் என்ற சூழலுக்கேற்ற இயல்பான தமிழை வழங்குகிறது.
- source_word: וַיְמָאֵן
  choice: மறுத்துவிட்டான்
  rationale: திடமான மறுப்பை நேரடியான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: தீர்க்கதரிசி தேவனுக்கு முன்பாக ‘நிற்பது’
  choice: நான் யாருடைய முன்னிலையில் நிற்கிறேனோ
  alternative: நான் யாருக்குப் பணிசெய்கிறேனோ
  rationale: மூல உருவகத்தையும், அது குறிக்கக்கூடிய முன்னிலை மற்றும் ஊழியம் ஆகிய இரு நுணுக்கங்களையும் பாதுகாக்கிறது; ஒரே விளக்கத்துக்குள் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடைத் தெளிவும் கொண்ட நடை. ‘முன்னிலையில் நிற்கிறேன்’ என்ற மூலச் சொல்லோவியம் பாதுகாக்கப்பட்டுள்ளது. தெளிவுக்காக நாமானின் பெயர் இரண்டாம் வாக்கியத்தில் வெளிப்படுத்தப்பட்டுள்ளது; எபிரெயில் எழுவாய் சுட்டுப்பெயரால் மட்டும் புரிகிறது.
