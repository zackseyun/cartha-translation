  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: ta
  text: ஆனால் நாமான் கடுங்கோபமடைந்து அங்கிருந்து சென்றுவிட்டான். அவன், “இதோ, ‘அவர் நிச்சயமாக என்னிடம் வெளியே வந்து நின்று, தம் கடவுளாகிய யாவேயின் பெயரை வேண்டிக்கொண்டு, பாதிக்கப்பட்ட இடத்தின்மேல் தன் கையை அசைத்து, தொழுநோயால் பாதிக்கப்பட்டவரைக் குணமாக்குவார்[a]’ என்று எனக்குள் சொல்லிக்கொண்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘குணமாக்குவார்’ என்பதற்கான வினைச்சொல் அடிப்படையில் ‘சேர்த்துக்கொள்’ அல்லது ‘திரும்பப் பெறு’ என்ற பொருளுடையது; இச்சூழலில் அது நோயிலிருந்து மீட்டுக் குணமாக்குதலைக் குறிக்கிறது. இறுதிச் சொல் தொழுநோயால் பாதிக்கப்பட்ட நபரைக் குறிக்கிறது. ‘தொழுநோய்’ என்பது நவீன மருத்துவத்தில் அப்பெயரால் அழைக்கப்படும் நோயை மட்டும் அல்லாமல் பலவகைத் தோல் பாதிப்புகளையும் குறிக்கக்கூடும்.
    reason: எபிரெய வினைச்சொல்லின் பொருள்வீச்சையும் הַמְּצֹרָע குறிக்கும் பாதிக்கப்பட்ட நபரையும் துல்லியமாகக் காட்டி, மருத்துவ அடையாளப்படுத்தலைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: கடுங்கோபமடைந்து
  rationale: קצף கடுமையான கோபத்தைக் குறிக்கிறது; சூழலில் நாமானின் தீவிர எதிர்வினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֵּלַךְ
  choice: அங்கிருந்து சென்றுவிட்டான்
  rationale: வெறும் நடப்பதை அல்ல, எலிசாவின் வீட்டைவிட்டு கோபத்துடன் புறப்பட்டுச் சென்றதைச் சூழல் காட்டுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: நாமான் தன் எதிர்பார்ப்பை வலியுறுத்திக் கூறுவதை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אָמַרְתִּי אֵלַי
  choice: என்று எனக்குள் சொல்லிக்கொண்டேன்
  rationale: ‘என்னிடமே சொன்னேன்’ என்ற எபிரெய மரபுத்தொடரின் கருத்தை, வெறும் ‘நினைத்தேன்’ என்று சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: יֵצֵא יָצוֹא
  choice: நிச்சயமாக ... வெளியே வந்து
  rationale: வினையெச்சத்துடன் வரும் infinitive absolute அளிக்கும் வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: וְקָרָא בְּשֵׁם
  choice: பெயரைச் சொல்லிக் கூப்பிட்டு
  rationale: தெய்வத்தின் பெயரை உச்சரித்து அழைத்தல் அல்லது வேண்டுதல் என்ற மரபுத்தொடரின் இரு கூறுகளையும் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: நோயுள்ள இடத்தின்மேல் தன் கையை அசைத்து
  rationale: הניף குறிக்கும் அசைவு மற்றும் הַמָּקוֹם குறிக்கும் பாதிக்கப்பட்ட இடம் ஆகியவற்றை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: தொழுநோயால் பாதிக்கப்பட்டவரைக் குணமாக்குவார்
  rationale: மெய்யெழுத்தும் உயிர்க்குறிகளும் הַמְּצֹרָע என்பதை நோயுற்ற நபராகக் காட்டுகின்றன. אסף இங்கு நோயை அகற்றி அந்த நபரை நலப்படுத்துதல் என்ற சூழல்சார் பொருளைக் கொண்டதால், பிரதான உரையில் இயல்பான தமிழாக ‘குணமாக்குவார்’ பயன்படுத்தப்படுகிறது; சொற்பொருள் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: הַמְּצֹרָע குறிக்கும் நபரும் நோய்வகையும்
  choice: தொழுநோயால் பாதிக்கப்பட்டவர்
  alternative: கடுமையான தோல் நோயால் பாதிக்கப்பட்டவர்
  rationale: பாரம்பரியமாகப் புரிந்துகொள்ளப்படும் சொல்லை பிரதான உரையில் வைத்தாலும், இது அவசியமாக நவீன மருத்துவத்தில் Hansen நோயை மட்டுமே குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: וְאָסַף என்பதன் சூழல்சார் பொருள்
  choice: குணமாக்குவார்
  alternative: அகற்றுவார் / சேர்த்துக்கொள்வார்
  rationale: אסף என்பதன் அடிப்படைப் பொருள் ‘சேர்த்தல்’ என்றாலும், இங்கு நோயுற்ற நபரை நோயிலிருந்து விடுவித்தல் என்ற மரபுசார் பயன்பாடு உள்ளது. தெளிவான தமிழ் வாசிப்புக்காக ‘குணமாக்குவார்’ தேர்ந்தெடுக்கப்பட்டு, மொழியியல் தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான கதைநடை. நேரடி உரையின் வலியுறுத்தலும் நாமானின் எதிர்பார்ப்பும் பாதுகாக்கப்பட்டுள்ளன. பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
