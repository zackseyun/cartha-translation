    rationale: וְאָסַף הַמְּצֹרָע-இல் இறுதி சொல் இலக்கணப்படி தொழுநோயால் பாதிக்கப்பட்ட நபரைக் குறிக்கிறது. ‘அவரை அகற்றுதல்’ இச்சூழலில் பொருத்தமற்றது; வினைச்சொல்லின் அடிப்படைப் பொருளை அப்படியே பயன்படுத்துவது தவறான விளக்கத்தை உருவாக்குகிறது.
  revised_text: ஆனால் நாமான் கடுங்கோபமடைந்து அங்கிருந்து சென்றுவிட்டான். அவன், “இதோ, ‘அவர் நிச்சயமாக என்னிடம் வெளியே வந்து நின்று, தம் கடவுளாகிய யாவேயின் பெயரை வேண்டிக்கொண்டு, பாதிக்கப்பட்ட இடத்தின்மேல் தன் கையை அசைத்து, தொழுநோயால் பாதிக்கப்பட்டவரைக் குணமாக்குவார்[a]’ என்று எனக்குள் சொல்லிக்கொண்டேன்” என்றான்.
