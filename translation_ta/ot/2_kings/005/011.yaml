  terminology: ‘யாவே’ மூலத்தின் தனிப்பட்ட இறைப்பெயரைப் பாதுகாக்கிறது. ‘தொழுநோயால் பாதிக்கப்பட்டவர்’ என்பது பாரம்பரிய சொல்லாட்சியைத் தக்கவைத்துக்கொண்டு மருத்துவ அடையாளப்படுத்தலைத் தவிர்க்கிறது. அடிக்குறிப்பு, வினைச்சொல்லின் பொருள்வீச்சையும் ‘தொழுநோய்’ என்ற சொல்லின் மருத்துவத் தெளிவின்மையையும் சரியாக விளக்குமாறு திருத்தப்பட்டுள்ளது.
  issues:
  - severity: medium
