    rationale: וְקָרָא בְּשֵׁם יְהוָה என்பது ‘யாவேயின் பெயரை வேண்டி அழைத்தல்/அழைத்துப் பிரார்த்தித்தல்’ என்ற மரபுத்தொடர். தற்போதைய சொற்றொடர் பெயரை உச்சரிப்பதையே முதன்மையாகக் குறிக்கிறது.
