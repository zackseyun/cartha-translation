translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பண்டைய எடை அலகான ‘தாலந்து’ தக்கவைக்கப்பட்டு, விளக்க முடியாத இடங்களில் அடிக்குறிப்புகள் மூலம் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
