  source_fidelity: மூலத்தின் அளவுகள், பொருட்கள், அரசர்களுக்கிடையேயான கடிதம், மற்றும் ஆடைத் தொகுப்புகள் ஆகியவை துல்லியமாக உள்ளன. ஆனால் ‘எனவே அவன்’ என்பது தமிழில் உடனடியான முன்னிலைப் பெயரான அராமின் அரசனைக் குறிக்கக்கூடிய தேவையற்ற தெளிவின்மையை உருவாக்குகிறது; சூழலில் தெளிவாகக் குறிக்கப்படும் நாமானின் பெயரைப் பயன்படுத்துவது பாதுகாப்பானது. மேலும், இரண்டு எபிரெயக் கட்டளைகளைத் தமிழில் இயல்பாகக் காக்க ‘போ, செல்’ பொருத்தமானது.
