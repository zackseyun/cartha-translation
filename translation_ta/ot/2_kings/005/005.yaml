base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: ta
  text: அப்போது அராமின் அரசன்[c], “போ, செல்[a]; நான் இஸ்ரவேலின் அரசனுக்கு ஒரு கடிதம் அனுப்புகிறேன்” என்றான். எனவே நாமான் புறப்பட்டு, பத்து தாலந்து வெள்ளியையும், ஆறாயிரம் தங்கத் துண்டுகளையும்[b], பத்து மாற்று ஆடைகளையும் தன் கையில் எடுத்துச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘போ, வா’ என்று இரண்டு கட்டளைகள் உள்ளன; இவை உடனே புறப்படுவதற்கான அனுமதி அல்லது ஊக்கத்தைத் தெரிவிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் ‘ஆறாயிரம் தங்கம்’ என்று உள்ளது; எண்ணப்பட்ட குறிப்பிட்ட அலகு வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: ‘அராம்’ என்பது எபிரெயப் பெயர்; சில பாரம்பரிய மொழிபெயர்ப்புகளில் இது ‘சீரியா’ என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: போ, புறப்படு
  rationale: எபிரெய மூலத்தில் உள்ள இரண்டு கட்டளை வினைகளையும் இயன்றவரை காக்கிறது; தமிழில் இது உடனடியாகப் புறப்பட அனுமதித்து ஊக்குவிக்கும் கட்டளையாக இயல்பாக ஒலிக்கிறது.
- source_word: סֵפֶר
  choice: ஒரு கடிதம்
  rationale: இரு அரசர்களுக்கிடையிலான இந்தத் தூதரகச் சூழலில், எழுத்து மூலமான செய்தி என்ற பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּיָדוֹ
  choice: தன் கையில் எடுத்துச் சென்றான்
  rationale: ‘அவன் கையில்’ என்ற மூல உருவகத்தைத் தக்கவைத்தபடியே, அவன் அவற்றைத் தன்னுடன் எடுத்துச் சென்றான் என்ற உடைமை மற்றும் சுமந்து செல்லுதல் சார்ந்த பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: כִּכְּרֵי כֶסֶף
  choice: தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது பெரிய பண்டைய எடை அலகு. ஊகமான நவீன மாற்றீட்டைத் தவிர்த்து, வழக்கமான வேதாகம அலகான ‘தாலந்து’ தக்கவைக்கப்படுகிறது.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: ஆறாயிரம் தங்கத் துண்டுகள்
  rationale: மூலத்தில் ‘ஆறாயிரம் தங்கம்’ என்று எண்ணிக்கை இருந்தாலும் எண்ணப்படும் அலகின் பெயர் வெளிப்படையாக இல்லை. வாசிக்க இயல்பாக ‘துண்டுகள்’ சேர்க்கப்பட்டுள்ளது; அது குறிப்பிட்ட நாணயமோ எடை அலகோ என்று தீர்மானிக்கவில்லை.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: மாற்று உடைகள்
  rationale: மாற்றிப் பயன்படுத்துவதற்கான முழு ஆடைத் தொகுப்புகளைச் சுருக்கமாகவும் நவீன தமிழில் இயல்பாகவும் குறிக்கிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: אֲרָם என்ற மூல இடப்பெயரைப் பிற்காலப் பெயரான ‘சீரியா’ என்று மாற்றாமல் ‘அராம்’ எனத் தக்கவைக்கிறது.
