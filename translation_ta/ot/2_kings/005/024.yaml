base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: ta
  text: அவன் அந்த மேட்டிற்கு[a] வந்தபோது, அவர்களுடைய கைகளிலிருந்து அவற்றை எடுத்துக்கொண்டு வீட்டில் வைத்தான்[b]. பிறகு அந்த மனிதர்களை அனுப்பிவிட்டான்; அவர்களும் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மண் மேடு’ அல்லது ‘அரணமைந்த மேடு’; எபிரெயத்தில் ‘ஓபேல்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வீட்டில் சேமித்து வைத்தான்’ அல்லது ‘வீட்டில் ஒதுக்கி வைத்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: அந்த மேடு
  rationale: עֹפֶל என்பது உயர்ந்த இடம், மேடு, அல்லது அரணமைந்த மேடு என்பதைக் குறிக்கலாம். இச்சூழலில் இட அமைப்பைக் குறிக்கும் ‘அந்த மேடு’ இயல்பாகப் பொருந்துகிறது; இதைத் தேவையின்றி ‘ஓபேல்’ என்ற இடப்பெயராகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: מִיָּדָם
  choice: அவர்களுடைய கைகளிலிருந்து
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அவர்களுடைய கையிலிருந்து’ என்ற உருவகத்தைக் கொண்டுள்ளது. பலரைச் சுட்டுவதால் நவீனத் தமிழில் ‘கைகளிலிருந்து’ என்பது இயல்பாகவும், நேரடியாக அவர்களிடமிருந்து பெற்றதையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיִּפְקֹד
  choice: பத்திரமாக வைத்தான்
  rationale: פקד என்ற வினைச்சொல்லுக்குப் பல பொருள்கள் உள்ளன; இங்கு பெற்ற பொருட்களை வீட்டில் ஒதுக்கி அல்லது சேமித்து வைப்பதே சூழலுக்குப் பொருந்துகிறது. ‘பத்திரமாக வைத்தான்’ என்பது பாதுகாப்பாக வைத்தல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; சொல்லின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: בַּבָּיִת
  choice: வீட்டில்
  rationale: இங்கு בית என்பது பொருட்கள் வைக்கப்பட்ட இடமான வீட்டைக் குறிக்கும் நேரடியான இடப்பொருள் பயன்பாடு.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆட்கள்
  rationale: முந்தைய சூழலில் அறிமுகமானவர்களை எபிரெயம் பொதுவாக ‘ஆட்கள்’ என்றே குறிப்பிடுகிறது. அவர்கள் நாமானின் பணியாளர்களாக இருந்தாலும், மூலவசனம் இங்கு குறிப்பான ‘பணியாளர்கள்’ என்ற சொல்லைப் பயன்படுத்தவில்லை.
