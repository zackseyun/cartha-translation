  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: ta
  text: அவனோ வந்து தன் எஜமானின் முன் நின்றான். அப்போது எலிசா அவனிடம், “கேயாசி, நீ எங்கிருந்து வந்தாய்[a]?” என்றார். அதற்கு அவன், “உங்கள் பணியாளன் எங்கும் போகவில்லை[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “எங்கிருந்து, கேயாசி?”'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மரபுத்தொடர்: “உங்கள் பணியாளன் இங்கோ அங்கோ போகவில்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא בָא
  choice: அவனோ வந்து
  rationale: וְהוּא இங்கு முந்தைய இரகசியச் செயல்களிலிருந்து காட்சியைத் திருப்பும் மென்மையான எதிர்மறைத் தொனியைக் கொண்டுள்ளது; ‘அவனோ’ அதை இயல்பாகக் காட்டுகிறது. בָא என்பதன் அடிப்படைப் பொருளான ‘வந்தான்’ தேவையற்ற இடவிவரத்தைச் சேர்க்காமல் ‘வந்து’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: தன் எஜமானின் முன் நின்றான்
  rationale: இது மேலதிகாரியின் முன்னிலையில் பணியாளன் நிற்பதைக் குறிக்கும் சொற்றொடர். אֲדֹנָיו மனித எஜமானாகிய எலிசாவைக் குறிக்கிறது; தெய்வீகப் பட்டம் அல்ல.
- source_word: מֵאָן
  choice: எங்கிருந்து வந்தாய்
  rationale: எபிரெயச் சொல் நேரடியாக ‘எங்கிருந்து?’ என்று கேட்கிறது. தமிழில் சூழலுக்கேற்ற முழுமையான கேள்வியாக ‘எங்கிருந்து வந்தாய்?’ என்பது இயல்பாகவும் திசை சார்ந்த பொருளைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: גֵּחֲזִי
  choice: கேயாசி
  rationale: பெயர் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: உங்கள் பணியாளன் ... போகவில்லை
  rationale: கேயாசி தன்னைத் தாழ்மையுடன் ‘உங்கள் பணியாளன்’ என்று குறிப்பிடும் எபிரெய வடிவம் ‘நான்’ என்று எளிமைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אָנֶה וָאָנָה
  choice: எங்கும்
  rationale: ‘இங்கோ அங்கோ’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் ‘எந்த இடத்திற்கும்’ என்ற முழுமையான மறுப்பைக் குறிக்கிறது; ‘எங்கும் போகவில்லை’ என்பது இயல்பான நவீனத் தமிழ்.
