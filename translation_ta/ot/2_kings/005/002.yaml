translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் இறந்தகால நிறைவு வடிவம், இச்சம்பவம் பின்னணித் தகவலாக வழங்கப்படுவதை உணர்த்துகிறது. ‘கொள்ளைக் குழுக்கள்’ படைசார்ந்த பொருளைத் தெளிவாக்குகிறது; ‘பணிவிடை’ என்பது לִפְנֵי என்ற வழக்குச் சொல்லின் சேவைப் பொருளை அளிக்கிறது.
