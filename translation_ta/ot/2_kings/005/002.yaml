  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: ta
  text: அராமியக் கொள்ளைக் குழுக்கள் புறப்பட்டுச் சென்று, இஸ்ரவேல் நாட்டிலிருந்து ஒரு சிறுமியை[a] சிறைபிடித்தன. அவள் நாமானின் மனைவிக்குப் பணிவிடை செய்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சின்னப் பெண்பிள்ளையை.’ נַעֲרָה קְטַנָּה என்ற எபிரெயச் சொற்றொடர் அவள் இளையவள் என்பதையும் சிறியவள் என்பதையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவள் நாமானின் மனைவிக்கு முன்பாக இருந்தாள்’; அதாவது, அவளுக்குப் பணிவிடை செய்தாள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: அராமியர்கள் கொள்ளைக் குழுக்களாக
  rationale: ‘அராம்’ என்பது இங்கு நாட்டின் பெயராக இருந்தாலும், பன்மை வினைச்சொல்லுடன் வருவதால் அராமியப் படையினரைக் குறிக்கிறது. גְדוּדִים என்பது சிறு படைக் குழுக்களை, இச்சூழலில் கொள்ளையிடும் படையெடுப்புக் குழுக்களை, குறிக்கிறது.
- source_word: יָצְאוּ
  choice: புறப்பட்டுச் சென்று
  rationale: முந்தைய பின்னணிச் செயலை இயல்பான தமிழ் நடையில் காட்டுகிறது; வெறுமனே ‘வெளியே சென்றனர்’ என்பதைக் காட்டிலும் படையெடுப்புக்காகச் சென்ற சூழலுக்கு ஏற்றது.
- source_word: וַיִּשְׁבּוּ
  choice: சிறைபிடித்திருந்தார்கள்
  rationale: இந்த வினை வெறுமனே பிடித்தலை அல்ல, ஒருவரைச் சிறைக்கைதியாகப் பிடித்தலைக் குறிக்கிறது. பின்னணிச் சம்பவம் என்பதால் ‘இருந்தார்கள்’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டிலிருந்து
  rationale: ‘இஸ்ரவேல் தேசத்திலிருந்து’ என்ற எபிரெய புவியியல் சொல்லாட்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַעֲרָה קְטַנָּה
  choice: ஒரு சிறுமியை
  rationale: இரு சொற்களும் சேர்ந்து வயதில் இளைய, சிறிய பெண்பிள்ளையைக் குறிக்கின்றன. ‘வேலைக்காரச் சிறுமி’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத பணிநிலையை இச்சொற்றொடருக்குள் சேர்த்துவிடும்.
- source_word: וַתְּהִי לִפְנֵי
  choice: பணிவிடை செய்துவந்தாள்
  rationale: சொல்லுக்குச் சொல் ‘முன்பாக இருந்தாள்’; இங்கு அது ஒருவரின் முன்னிலையில் இருந்து அவருக்குப் பணிசெய்தல் அல்லது உதவிசெய்தல் என்ற வழக்குப் பொருளைக் கொண்டுள்ளது.
- source_word: אֵשֶׁת נַעֲמָן
  choice: நாமானின் மனைவிக்கு
  rationale: எபிரெய இணைப்புச் சொல்லமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
