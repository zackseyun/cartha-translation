translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. பழமையான எடை அலகான ‘தாலந்து’ தக்கவைக்கப்பட்டு விளக்கப்பட்டுள்ளது. இறுதி பிரதிப்பெயரின் மூலமொழிச் சிறிய தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலுக்கு மிகவும் பொருத்தமான குறிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
