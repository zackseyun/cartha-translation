base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: ta
  text: நாகமான், “தயவுசெய்து இரண்டு தாலந்து[a] எடுத்துக்கொள்” என்றான். அவன் கெகாசியை வற்புறுத்தினான்[b]. இரண்டு பைகளில் இரண்டு தாலந்து வெள்ளியைக் கட்டி, இரண்டு மாற்று உடைகளையும் சேர்த்து, தன் இரு பணியாளர்களிடம் கொடுத்தான். அவர்கள் அவற்றை அவனுக்கு முன்னால்[c] சுமந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தாலந்து என்பது பழங்கால எடை அலகு.
    reason: cultural_note
  - marker: b
    text: அதாவது, அவற்றை ஏற்றுக்கொள்ளும்படி அவனை வலியுறுத்தினான்.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள “அவனுக்கு” என்பது பெரும்பாலும் கெகாசியைக் குறிக்கிறது; நாகமானின் பணியாளர்கள் பரிசுப் பொருட்களைக் கெகாசிக்கு முன்னால் சுமந்து சென்றார்கள்.
    reason: referent_clarification
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: தயவுசெய்து ... எடுத்துக்கொள்
  rationale: הוֹאֵל இங்கு வேண்டுகோளை வலுப்படுத்தும் மரியாதையான சொல்லாகவும், קַח நேரடி கட்டளையாகவும் வருகிறது. நவீனத் தமிழில் இந்த இணைப்பு இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: כִּכָּרָיִם / כִּכְּרַיִם כֶּסֶף
  choice: இரண்டு தாலந்து / இரண்டு தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது பழங்கால எடை அலகு. பரவலாக அறியப்படும் வேதாகமச் சொல்லான ‘தாலந்து’ பயன்படுத்தப்பட்டு, அது பணமதிப்பு அல்ல எடை அலகு என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַיִּפְרָץ בּוֹ
  choice: அவன் கெகாசியை வற்புறுத்தி
  rationale: இந்தச் சொற்றொடர், நாகமான் கெகாசியை அதிகமான அளவை ஏற்றுக்கொள்ளும்படி வலியுறுத்தியதைக் குறிக்கிறது. ‘வற்புறுத்தி’ என்பது அதன் தீவிரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּצַר
  choice: கட்டினான்
  rationale: வெள்ளியைப் பைகளில் வைத்து இறுக்கிக் கட்டிப் பாதுகாத்த செயலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: חֲרִטִים
  choice: பைகள்
  rationale: பணம் அல்லது விலையுயர்ந்த பொருட்களை வைக்கும் உறைகளைக் குறிக்கும் பொதுவான, தெளிவான தமிழ்ச் சொல்.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: இரண்டு மாற்று உடைகள்
  rationale: மாற்றிக்கொள்ளக்கூடிய இரண்டு முழு உடைத் தொகுப்புகள் என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: שְׁנֵי נְעָרָיו
  choice: தன் பணியாளர்கள் இருவர்
  rationale: נַעַר என்பதற்கு இங்கு இளைஞர்கள் என்ற வயதுசார் பொருளைவிட, நாகமானுக்குக் கீழ்ப்பட்டு சுமை சுமக்கும் பணியாளர்கள் என்ற செயல்சார் பொருள் பொருந்துகிறது.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: அவர்கள் அவற்றை அவனுக்கு முன்னால் சுமந்துகொண்டு சென்றார்கள்
  rationale: மூலத்தின் பிரதிப்பெயரைத் தக்கவைத்து, பரிசுப் பொருட்களை ஒருவருக்கு முன்னால் எடுத்துச் சென்ற இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
