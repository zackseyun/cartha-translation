  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: ta
  text: அவன் அந்தக் கடிதத்தை இஸ்ரவேலின் அரசனிடம் கொண்டுவந்து, “இப்போது, இந்தக் கடிதம் உம்மிடம் வந்து சேரும்போது, இதோ, என் பணியாளனான நாமானை அவனுடைய தோல் நோயிலிருந்து[a] குணமாக்கும்படி உம்மிடம் அனுப்பியிருக்கிறேன்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய தொழுநோயிலிருந்து குணமாக்கும்படி.” எபிரெயத்தில் இங்கு வழக்கத்திற்கு மாறான ஒரு சொற்றொடர் உள்ளது; சொல்லுக்குச் சொல் அது, “அவனுடைய தோல் நோயிலிருந்து அவனைச் சேர்த்துக்கொள்” எனும் அமைப்பைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கடிதத்தை’ செயப்படுபொருளாகக் கொண்டுள்ளது; ஆகவே காரணவினைத் தன்மையை இயல்பான தமிழில் ‘கொண்டுவந்து’ என்பது வெளிப்படுத்துகிறது.
- source_word: הַסֵּפֶר
  choice: அந்தக் கடிதம்
  rationale: இரு அரசர்களுக்கிடையிலான இச்சூழலில் סֵפֶר என்பது எழுதப்பட்ட அரசத் தகவலைக் குறிக்கிறது; நவீன தமிழில் ‘கடிதம்’ இயல்பான இணைச்சொல்.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அரசக் கடிதத்தின் அடுத்த கருத்தை அறிமுகப்படுத்தும் உரையாடல் குறியைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: இந்தக் கடிதம் உம்மிடம் வந்து சேரும்போது
  rationale: כְּ உடனான infinitive construct காலப்பொருளைக் குறிக்கிறது. ‘வந்து சேரும்போது’ என்பது தமிழில் கடிதம் சென்றடைவதை இயல்பாகச் சொல்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயத் துகளின் வலிமையையும் அரசக் கடிதத்தின் உயர்ந்த நடையையும் காக்கிறது.
- source_word: שָׁלַחְתִּי
  choice: அனுப்பியிருக்கிறேன்
  rationale: கடிதம் பெறப்படும் தருணத்தில் விளைவு தொடரும் நிறைவேற்றப்பட்ட செயலைத் தமிழின் நிகழ்நிறை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדִּי
  choice: என் பணியாளனாகிய
  rationale: עבד இங்கு அரசனுக்குக் கீழ்ப்பட்ட அதிகாரியைக் குறிக்கலாம். ‘பணியாளன்’ மூலச்சொல்லின் பரப்பைத் தக்கவைத்துக்கொண்டு, ‘அடிமை’ அல்லது ‘அதிகாரி’ என்று நிலையை மிகையாகக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: அவனுடைய தோல் நோயிலிருந்து மீட்டெடுக்கும்படி
  rationale: אסף என்பதன் அடிப்படை ‘சேர்த்தல்/கூட்டுதல்’ என்றாலும், מן + நோய் என்ற இவ்வழக்கத்திற்கு ‘நோயிலிருந்து மீட்டெடுத்தல்’ என்பது தமிழில் புரியக்கூடியதாக இருந்து, நோயிலிருந்து ஒருவரைப் பிரித்தெடுக்கும் எபிரெய உருவகத்தையும் ஓரளவு காக்கிறது. வழக்கமான ‘குணமாக்குதல்’ மற்றும் சொல்லுக்குச் சொல் பொருள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מִצָּרַעְתּוֹ
  choice: அவனுடைய தோல் நோயிலிருந்து
  rationale: צָרַעַת என்பது நவீன ஹான்சன் நோயுடன் மட்டும் துல்லியமாக ஒத்துப்போவதில்லை; ‘தோல் நோய்’ தேவையற்ற மருத்துவக் குறிப்பாக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: எபிரெயச் சொல் நவீன ‘தொழுநோய்’ என்பதைக் காட்டிலும் பரந்த வகைத் தோல் பாதிப்புகளைக் குறிக்கக்கூடும். ஆகவே முதன்மை உரை மருத்துவ ரீதியாகக் குறுகச் சொல்லாமல், மரபுவழி மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: וַאֲסַפְתּוֹ என்ற அபூர்வமான சொற்றொடர்
  choice: நோயிலிருந்து மீட்டெடுக்கும்படி
  alternative: குணமாக்கும்படி
  rationale: சூழலில் குணப்படுத்துதலே நோக்கம் என்றாலும், אסף என்ற வினையின் ‘சேர்த்தல்/திரட்டுதல்’ உருவகம் அபூர்வமாக உள்ளது. முதன்மை உரை பொருளையும் பிரித்தெடுக்கும் உருவகத்தையும் சமநிலைப்படுத்துகிறது; வழக்கமான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசனுக்கான கடிதம் என்பதால் ‘உம்மிடம்’ என்ற மரியாதை வடிவமும் ‘இதோ’ என்ற சற்றே உயர்ந்த கவன ஈர்ப்புச் சொல்லும் வைக்கப்பட்டுள்ளன. புரியாத சொல்லுக்குச் சொல் நடையை முதன்மை உரையில் தவிர்த்து, மூலத்தின் அபூர்வ உருவகத்தை ‘மீட்டெடுக்கும்படி’ என்பதாலும் அடிக்குறிப்பாலும் பாதுகாத்துள்ளோம்.
