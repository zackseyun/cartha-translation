  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: ta
  text: “தமஸ்குவின் ஆறுகளான அபானாவும்[a] பர்பாரும் இஸ்ரவேலின் எல்லா நீரையும் விடச் சிறந்தவை அல்லவா? நான் அவற்றில் குளித்துச் சுத்தமடைய[b] முடியாதா?” என்று அவன் திரும்பிக் கடும் கோபத்தோடு போய்விட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சிலர் இந்த ஆற்றின் பெயரின் மாற்று மரபு வடிவத்தைப் பின்பற்றி, ‘அமானா’ என்று வழங்குகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: ‘தூய்மையடைய’ அல்லது ‘சுத்தமாக ஆக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் உடல்சார் சுத்தத்தையும் விரிந்த தூய்மை நிலையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா? / முடியாதா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் இரண்டு வினாக்களையும் இயல்பான தமிழ் சொல்லாட்சியில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: טוֹב ... מִכֹּל
  choice: எல்லா ... விடச் சிறந்தவை
  rationale: ஒப்பீட்டுக் கட்டமைப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אבנה
  choice: அபானா
  rationale: மசோரெட்டிக் எபிரெய உரையிலுள்ள ஆற்றின் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; மாற்று மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּפַרְפַּר
  choice: பர்பார்
  rationale: எபிரெய புவியியல் பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: தமஸ்குவின் ஆறுகள்
  rationale: சார்பு உறவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலில் உள்ள எல்லா நீரையும்விட
  rationale: எபிரெயச் சொல்லின் பரந்த ‘நீர்’ என்ற பொருளையும் அதன் முழுமைப்படுத்தும் வலியுறுத்தலையும் காக்கிறது; ‘ஆறுகள்’ என்று குறுக்கவில்லை.
- source_word: אֶרְחַץ בָּהֶם
  choice: நான் அவற்றில் குளித்து
  rationale: இரண்டு ஆறுகளைக் குறிக்கும் பன்மைப் பதிலைப் பாதுகாத்து, இச்சூழலில் רחץ என்பதற்கு இயல்பான ‘குளித்து’ என்பதைப் பயன்படுத்துகிறது.
- source_word: וְטָהָרְתִּי
  choice: சுத்தமடைய
  rationale: உடல்நோயிலிருந்து சுத்தமாதல் மற்றும் விரிந்த தூய்மை சார்ந்த பொருள் ஆகிய இரண்டுக்கும் இடமளிக்கிறது.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: அவன் திரும்பி ... போய்விட்டான்
  rationale: இரு தொடர்ச்சியான செயல்களையும் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בְּחֵמָה
  choice: கடும் கோபத்தோடு
  rationale: חֵמָה குறிக்கும் தீவிரமான சீற்றத்தை வாசிக்க எளிய, கண்ணியமான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சுத்தமாதல் குறித்த சொல்லின் பொருள்
  choice: சுத்தமடைய
  alternative: தூய்மையடைய / சுத்தமாக்கப்பட
  rationale: இச்சூழல் நாகமானின் தோல் நோயையும் எலிசாவின் குளிக்கும் கட்டளையையும் குறிக்கிறது; அதேவேளையில் எபிரெயச் சொல் உடல்சார் சுத்தத்தையும் விரிந்த தூய்மை கருத்தையும் தாங்கலாம். ‘சுத்தமடைய’ இந்தப் பொருள் பரப்பை தேவையின்றிக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நாகமானின் சீற்றத்தைப் பேச்சின் இரண்டு எதிர்பார்ப்பு வினாக்கள் தெளிவாகத் தக்கவைக்கின்றன. அடிக்குறிப்பு [b] ஆங்கில ஆலோசனை உரையில் தவறாகத் தோன்றும் இடத்திலல்லாமல், அது விளக்கும் ‘சுத்தமடைய’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
