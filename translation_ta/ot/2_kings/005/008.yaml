  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: ta
  text: தேவனுடைய மனிதரான எலிசா, இஸ்ரவேல் அரசன் தன் ஆடைகளைக் கிழித்துக்கொண்டதைக் கேள்விப்பட்டபோது, அரசனுக்கு, “நீர் ஏன் உமது ஆடைகளைக் கிழித்துக்கொண்டீர்? தயவுசெய்து அவனை என்னிடம் வரவிடும்; அப்போது இஸ்ரவேலில் ஒரு தீர்க்கதரிசி இருக்கிறார் என்பதை அவன் அறிந்துகொள்வான்” என்று சொல்லி அனுப்பினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேட்டபோது
  rationale: எபிரெயக் கதைத் தொடரின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத தனியான ‘இப்போது’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது வெறும் பக்தியுள்ள மனிதர் என்ற வருணனை அல்ல; தேவனின் தீர்க்கதரிசனப் பிரதிநிதியைக் குறிக்கும் நிலையான பட்டம். சொல்லமைப்பையும் அதன் பணியையும் காக்கிறது.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்துக்கொண்டது
  rationale: קָרַע என்பதன் ‘கிழித்தல்’ என்ற நேரடிப் பொருளையும், துயரம் அல்லது கலக்கத்தின் அடையாளமாக ஒருவர் தமது உடையைத் தாமே கிழிக்கும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ
  choice: அரசனிடம் ஆள் அனுப்பி
  rationale: தமிழில் வெறுமனே ‘அரசனிடம் அனுப்பி’ என்பது செயப்படுபொருள் இல்லாமல் தெளிவற்றதாக இருக்கும். மூலத்தில் தூதுவர் வெளிப்படையாகக் குறிப்பிடப்படாவிட்டாலும், செய்தியை அனுப்பிய செயலை இயல்பாகத் தெரிவிக்க ‘ஆள்’ பயன்படுத்தப்படுகிறது.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: நீர் ஏன் உமது உடைகளைக் கிழித்துக்கொண்டீர்?
  rationale: அரசனை நோக்கிய மரியாதைப் பன்மையையும், அண்மையில் நிகழ்ந்த செயலின் தற்போதைய பொருத்தத்தையும் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: יָבֹא נָא אֵלַי
  choice: அவன் தயவுசெய்து என்னிடம் வரட்டும்
  rationale: மூன்றாம் நபர் ஒருமையான ‘அவன் வரட்டும்’ என்பதையும், נָא தரும் வேண்டுகோள் அல்லது மரியாதை நயத்தையும் காக்கிறது.
- source_word: וְיֵדַע
  choice: அப்போது ... அறிந்துகொள்வான்
  rationale: முன் கூறிய வருகையின் எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழில் காட்டுகிறது; இதை நோக்கமாக மட்டும் குறுக்காமல் விளைவுத் தொடர்பையும் காக்கிறது.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் ஒரு தீர்க்கதரிசி இருக்கிறார் என்பதை
  rationale: יֵשׁ என்பதன் இருப்புப் பொருளை நேரடியாகக் காக்கிறது. தீர்க்கதரிசிப் பதவிக்குரிய மரியாதையால் ‘இருக்கிறார்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற தீர்க்கதரிசனப் பட்டத்தின் வலிமை
  choice: தேவனுடைய மனிதர்
  alternative: தேவபக்தியுள்ள மனிதர்; தேவனுக்குரிய மனிதர்
  rationale: இந்தத் தொடர் எலிசாவின் பக்தி இயல்பை மட்டும் விவரிக்காமல், தேவனுடைய தீர்க்கதரிசனப் பிரதிநிதி என்ற அவரது பங்கைச் சுட்டுகிறது. தேர்ந்த வடிவம் அந்த இலக்கிய மற்றும் இறையியல் பணியைப் பராபிரேஸ் செய்யாமல் காக்கிறது.
- issue: וְיֵדַע என்பதிலுள்ள செய்பவரின் அடையாளம்
  choice: அவன் அறிந்துகொள்வான் என்று நாகமானையே சுட்டும் வகையில் மொழிபெயர்க்கப்பட்டது
  alternative: அரசன் அறிந்துகொள்வான்
  rationale: முந்தைய மூன்றாம் நபர் ஒருமை வினைச்சொல்லான ‘அவன் வரட்டும்’ என்பதன் இயல்பான தொடர்ச்சியாக அறிபவனும் நாகமானே. ஆனால் எபிரெயத்தில் பெயர் மீண்டும் சொல்லப்படாததால், மொழிபெயர்ப்பிலும் ‘அவன்’ என்பதே வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை வடிவமும், தீர்க்கதரிசியைப் பற்றி ‘இருக்கிறார்’ என்ற மரியாதை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. ‘தீர்க்கதரிசி’ மற்றும் ‘தேவனுடைய மனிதர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
