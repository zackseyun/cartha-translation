revisions:
- from: தேவனுடைய மனிதரான எலிசா, இஸ்ரவேலின் அரசன் தன் உடைகளைக் கிழித்துக்கொண்டதைக் கேட்டபோது, அரசனிடம் ஆள் அனுப்பி, “நீர் ஏன் உமது உடைகளைக் கிழித்துக்கொண்டீர்? அவன் தயவுசெய்து என்னிடம் வரட்டும்[a]; அப்போது இஸ்ரவேலில் ஒரு தீர்க்கதரிசி இருக்கிறார் என்பதை அவன் அறிந்துகொள்வான்” என்று சொன்னார்.
  to: தேவனுடைய மனிதரான எலிசா, இஸ்ரவேல் அரசன் தன் ஆடைகளைக் கிழித்துக்கொண்டதைக் கேள்விப்பட்டபோது, அரசனுக்கு, “நீர் ஏன் உமது ஆடைகளைக் கிழித்துக்கொண்டீர்? தயவுசெய்து அவனை என்னிடம் வரவிடும்; அப்போது இஸ்ரவேலில் ஒரு தீர்க்கதரிசி இருக்கிறார் என்பதை அவன் அறிந்துகொள்வான்” என்று சொல்லி அனுப்பினார்.
  rationale: The revision removes the unsupported specification that Elisha sent a person, uses an idiomatic Tamil construction for sending a message, and renders the request to allow Naaman to come in a way that preserves the Hebrew’s third-person reference and polite force. The footnote is retained and broadened to cover both pronouns in the revised wording.
