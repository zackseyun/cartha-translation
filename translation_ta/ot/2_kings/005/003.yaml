translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அதே நேரத்தில் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. விருப்பத்தை உணர்த்தும் வாக்கியம் இயல்பான தமிழ்ச் சொல்லாட்சியில் தரப்பட்டுள்ளது. ஒரே தொடரில் வரும் ஆண்பால் மரியாதைப் பெயர்ச்சொற்களால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க, இரண்டாவது வாக்கியத்தில் ‘அந்த இறைவாக்கினர்’ என எழுவாய் தெளிவாக்கப்பட்டுள்ளது.
