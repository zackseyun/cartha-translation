  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: ta
  text: அவள் தன் எஜமானியிடம், “என் எஜமான் சமாரியாவில் இருக்கும் இறைவாக்கினரின் முன்னிலையில் இருந்தால் எவ்வளவு நன்றாயிருக்கும்! அப்போது அந்த இறைவாக்கினர் அவரைத் தொழுநோயிலிருந்து[a] குணமாக்குவார்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் צָרַעַת (ட்சராஅத்); இது நவீன காலத்தில் ‘ஹான்சன் நோய்’ எனப்படும் நோயை மட்டும் அல்லாமல், வேறு கடுமையான தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு எபிரெய வினை நோயிலிருந்து மீட்டல் அல்லது குணமாக்குதலைக் குறிக்கிறது. இதன் அடிப்படைச் சொல்லில் ‘சேர்த்தல்’ என்ற கருத்து இருந்தாலும், இச்சூழலில் இயல்பான பொருள் ‘குணமாக்குதல்’ என்பதே.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: தன் எஜமானியிடம்
  rationale: வீட்டில் அதிகாரமுள்ள பெண் தலைவியைக் குறிக்கிறது; ‘எஜமானி’ சமூக நிலையையும் பெண்பாலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַחֲלֵי
  choice: …இருந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: நிறைவேற வேண்டும் என்ற ஆழ்ந்த விருப்பத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: நாமானைப் பற்றி சிறுமி மரியாதையுடனும் தன் வீட்டுத் தலைவராகவும் குறிப்பிடுவதைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ஒருவரின் சந்நிதியில் அல்லது நேரில் இருப்பதைக் குறிக்கும் எபிரெயச் சொல்லாட்சியைத் தெளிவாகத் தருகிறது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: எபிரெய உரை எலிசாவின் பெயரைச் சொல்லாமல் அவரது பணிப் பட்டத்தையே பயன்படுத்துவதால் அதையே மொழிபெயர்க்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: יֶאֱסֹף
  choice: குணமாக்கிவிடுவார்
  rationale: ‘சேர்த்துக்கொள்/அகற்று’ என்ற அடிப்படைப் பொருளுள்ள வினை இச்சூழலில் நோயிலிருந்து மீட்பதைக் குறிக்கிறது; இயல்பான தமிழுக்காகச் சூழல்சார் பொருள் முதன்மை உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִצָּרַעְתּוֹ
  choice: அவரைத் தொழுநோயிலிருந்து
  rationale: צָרַעַת என்பதற்கான மரபான வேதாகமத் தமிழ்ச் சொல் பயன்படுத்தப்படுகிறது; அது நவீன ஹான்சன் நோயை மட்டும் குறிக்க வேண்டியதில்லை என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
