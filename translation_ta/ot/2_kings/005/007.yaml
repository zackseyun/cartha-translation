  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: ta
  text: இஸ்ரவேலின் ராஜா அந்தக் கடிதத்தை வாசித்தபோது, தன் உடைகளைக் கிழித்தான். அவன், “கொல்லவும் உயிரளிக்கவும் நான் கடவுளா? ஒருவனை அவனுடைய தொழுநோயிலிருந்து[a] குணமாக்கும்படி இவன் என்னிடம் செய்தி அனுப்புகிறானே! தயவுசெய்து கவனித்துப் பாருங்கள்; இவன் எனக்கு எதிராக ஒரு சாக்கைத் தேடுகிறான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியிலுள்ள צָרַעַת என்ற சொல், குறிப்பாக ஹான்சன் நோயை மட்டும் அல்லாமல் பலவகையான கடுமையான தோல் நோய்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இவன் என்னோடு சண்டையிட ஒரு காரணத்தைத் தேடுகிறான்” / “இவன் எனக்கு எதிராகச் செயல்பட ஒரு வாய்ப்பைத் தேடுகிறான்.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: அந்தக் கடிதம்
  rationale: முந்தைய வசனத்தில் அராம் ராஜா அனுப்பிய எழுத்துச் செய்தியைக் குறிப்பதால், பொதுவான ‘ஆவணம்/சுருள்’ என்பதைக் காட்டிலும் ‘கடிதம்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்துக்கொண்டு
  rationale: கடுமையான கலக்கம் அல்லது துயரத்தை வெளிப்படுத்தும் எபிரேய மரபுச்செயலை நேரடியாகவும் நவீன தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַאֱלֹהִים אָנִי
  choice: நான் கடவுளா?
  rationale: உயிரையும் மரணத்தையும் ஆளும் தனித்த தெய்வீக அதிகாரத்துடன் ராஜா தன்னை ஒப்பிட மறுக்கும் வினாவைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: கொல்லவும் உயிர்ப்பிக்கவும்
  rationale: எபிரேய இணைச்சொல்லின் சமநிலையையும் தெய்வீக அதிகாரம் குறித்த அதன் கனத்தையும் காக்கிறது.
- source_word: שֹׁלֵחַ אֵלַי
  choice: என்னிடம் செய்தி அனுப்புகிறான்
  rationale: கடிதம் வழியாக வந்த வேண்டுகோளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; வெறும் ‘அனுப்புகிறான்’ என்றால் நபரை அனுப்புவதாகத் தவறாகப் புரிய வாய்ப்புள்ளது.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: தொழுநோயிலிருந்து ஒருவனைக் குணமாக்கும்படி
  rationale: ஆசף + מן இங்கு நோய்நிலையிலிருந்து நீக்குதல் அல்லது மீட்டல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது; தமிழில் ‘குணமாக்குதல்’ அதனை இயல்பாகத் தருகிறது.
- source_word: צָּרַעַת
  choice: தொழுநோய்
  rationale: கதையின் பாரம்பரியமாக அறியப்பட்ட சொல்லைத் தக்கவைத்தபோதிலும், எபிரேயச் சொல்லின் விரிவான தோல் நோய் சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: தயவுசெய்து கவனித்துப் பாருங்கள்
  rationale: ‘அறியுங்கள், தயவுசெய்து, பாருங்கள்’ என்ற இரட்டை வலியுறுத்தலை இயல்பான நவீன தமிழில் ஒருங்கிணைக்கிறது.
- source_word: מִתְאַנֶּה ... לִי
  choice: என்னோடு சண்டை தொடங்க ஒரு காரணத்தைத் தேடுகிறான்
  rationale: எதிராகச் செயல்பட ஒரு சந்தர்ப்பம் அல்லது சாக்கு தேடுதல் என்ற Hitpael வடிவின் பொருளை தெளிவுபடுத்துகிறது; ‘சண்டை’ மற்றும் ‘காரணம்’ ஆகிய இரு நுணுக்கங்களும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: הַאֱלֹהִים என்ற சொல்லை ராஜாவின் வினாவில் மொழிபெயர்த்தல்
  choice: நான் கடவுளா?
  alternative: நான் ஒரு தெய்வமா?
  rationale: உயிரைக் கொடுத்து மரணத்தை ஏற்படுத்தும் அதிகாரம் ஒரே கடவுளுக்குரியது என்ற இஸ்ரவேலியக் கதைச்சூழலை ‘கடவுள்’ தெளிவாகக் காக்கிறது; அதேவேளை உரையில் இல்லாத மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: צָּרַעַת என்பதன் மருத்துவ அடையாளம்
  choice: தொழுநோய்
  alternative: கடுமையான தோல் நோய்
  rationale: பழக்கமான கதைச்சொல்லையும் வாசிப்புத் தொடர்ச்சியையும் முதன்மை உரை காக்கிறது; இது குறிப்பாக ஹான்சன் நோயையே குறிக்கும் என்று அளவுக்கு மீறித் துல்லியப்படுத்தாமல், பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் தீவிரமும் காக்கப்பட்டுள்ளன. ராஜாவின் உணர்ச்சிமிக்க நேரடிப் பேச்சு இயல்பாக அமைக்கப்பட்டுள்ளது. ‘ராஜா’, ‘கடவுள்’, ‘உயிர்ப்பிக்க’ போன்ற பரவலாகப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மருத்துவத் துல்லியத்தின் நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
