source:
  edition: WLC
  text: וַ/יָּבֹ֥א נַעֲמָ֖ן ב/סוס/ו וּ/בְ/רִכְבּ֑/וֹ וַ/יַּעֲמֹ֥ד פֶּֽתַח הַ/בַּ֖יִת לֶ/אֱלִישָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: ta
  text: அப்போது நாமான் தன் குதிரைகளோடும் தேர்களோடும்[a] வந்து, எலிசாவின் வீட்டின் நுழைவாயிலில் நின்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “தன் குதிரையோடும் தன் தேரோடும்”; ஒருமை வடிவங்கள் இங்கு கூட்டுப்பொருளில் வந்திருக்கலாம். அதனால் “குதிரைகளோடும் தேர்களோடும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் எளிய கதைநடை இயக்கத்தையும், நாமான் எலிசாவின் இருப்பிடத்திற்கு வந்தடைந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נַעֲמָן
  choice: நாமான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: בְסוּסוֹ
  choice: தன் குதிரைகளோடும்
  rationale: எபிரெய வடிவம் இலக்கணரீதியாக ஒருமையாக இருந்தாலும், தேர்ப்படையோடு வரும் சூழலில் அது கூட்டுப்பொருளில் பயன்பட்டிருக்கலாம்; இதை இயல்பான தமிழில் பன்மையாக வழங்குகிறது.
- source_word: וּבְרִכְבּוֹ
  choice: தேர்களோடும்
  rationale: רֶכֶב என்பது ஒரு தேர் அல்லது தேர்ப்படை என்ற கூட்டுப்பொருளைக் குறிக்கலாம். இணையான ‘குதிரைகள்’ என்பதோடும் இராணுவச் சூழலோடும் பொருந்தப் பன்மை தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּעֲמֹד
  choice: நின்றான்
  rationale: עמד என்பதன் நேரடியான காட்சிப்பொருளைத் தக்கவைக்கிறது; ‘நிறுத்தினான்’ என்பது வாகனத்தை நிறுத்தியதாகத் தவறாகப் புரியக்கூடும்.
- source_word: פֶּתַח הַבַּיִת
  choice: வீட்டின் நுழைவாயிலில்
  rationale: פֶּתַח குறிக்கும் திறப்பு அல்லது நுழைவிடத்தை நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: לֶאֱלִישָׁע
  choice: எலிசாவின்
  rationale: இங்குள்ள ל முன்னொட்டு சூழலில் வீட்டுக்கும் எலிசாவுக்கும் உள்ள உடைமை அல்லது தொடர்பைக் குறிக்கிறது.
