  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: ta
  text: அவன் உள்ளே சென்று, தன் எஜமானிடம், “இஸ்ரவேல் நாட்டிலிருந்து வந்த அந்தப் பெண் இன்னின்ன விதமாக[a] சொன்னாள்” என்று தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இன்னின்ன விதமாக” என்பது, அவள் சொன்னதைச் சொல் சொல்லாகத் திரும்பக் கூறாமல் சுருக்கமாகக் குறிப்பிடும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: בוא என்பது பார்வைக்கோணத்திற்கேற்ப ‘வருதல்’, ‘செல்லுதல்’, ‘உள்ளே நுழைதல்’ எனப் பொருள்படும். தன் எஜமானிடம் அறிக்கை செய்யச் சென்ற நிகழ்வை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד, சொல்லுதல் அல்லது அறிவித்தல் என்ற பொருளுடையது; இச்சூழலில் ‘தெரிவித்தான்’ அறிக்கையிடும் நுண்பொருளை இயல்பாகக் காக்கிறது.
- source_word: לַאדֹנָיו
  choice: தன் எஜமானிடம்
  rationale: אָדוֹן என்பதற்கு ஆண்டவன், எஜமான், தலைவர் ஆகிய பொருள்கள் உண்டு. இங்கு நாகமானின் மேலதிகாரியைக் குறிப்பதால் ‘எஜமான்’ பொருத்தமானது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பைத் தமிழில் இயல்பான மேற்கோள் அமைப்பான ‘என்று’ வெளிப்படுத்துகிறது.
- source_word: כָּזֹאת וְכָזֹאת
  choice: இன்னின்ன விதமாக
  rationale: சொன்னதைச் சொல் சொல்லாக மீண்டும் கூறாமல் அதன் உள்ளடக்கத்தைச் சுருக்கிக் காட்டும் எபிரெய மரபுத்தொடர்; ‘இன்னின்ன விதமாக’ அந்தத் திறந்த சுருக்கத் தன்மையைத் தமிழில் காக்கிறது.
- source_word: דִּבְּרָה
  choice: சொன்னாள்
  rationale: דבר என்பது பேசுதல் அல்லது சொல்லுதல் என்ற பொதுவான வினை; பெண்பால் ஒருமை வடிவம் தமிழில் ‘சொன்னாள்’ எனத் தெளிவாக வெளிப்படுகிறது.
- source_word: הַנַּעֲרָה
  choice: அந்தப் பெண்
  rationale: נַעֲרָה ஒரு பெண் அல்லது இளம்பெண்ணைக் குறிக்கிறது. இவ்வசனச் சொல்லிலேயே பணிநிலை வெளிப்படையாக இல்லாததால் ‘பெண்’ என நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டிலிருந்து வந்த
  rationale: உரையிலுள்ள தொடர்புச் சொற்றொடரையும் אֶרֶץ என்பதன் ‘நாடு/நிலம்’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
