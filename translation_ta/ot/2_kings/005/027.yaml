  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: ta
  text: “ஆகவே, நாகமானின் தோல் நோய் உன்னையும் உன் சந்ததியினரையும் என்றென்றும் பற்றிக்கொள்ளும்” என்றார். அவன் அவருடைய முன்னிலையிலிருந்து, பனியைப்போல் வெண்மையான தோல் நோயுற்றவனாக வெளியே சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “நாகமானின் தொழுநோய் உன்னையும் உன் சந்ததியினரையும் பற்றிக்கொள்ளும் … அவன் பனியைப்போல் வெண்மையான தொழுநோயாளியாக வெளியே சென்றான்” என மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொற்களான צָרַעַת, מְצֹרָע என்பவை நவீன தொழுநோயை மட்டும் அல்லாமல், பரந்த வகையிலான கடுமையான தோல் நோய்களையோ தோல் நிலைகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת / מְצֹרָע
  choice: தோல் நோய் / தோல் நோயுற்றவன்
  rationale: இச்சொற்கள் நவீன மருத்துவத்தில் ‘தொழுநோய்’ எனப்படும் ஹான்சன் நோயை மட்டும் குறிப்பதில்லை; பலவகையான கடுமையான தோல் பாதிப்புகளையும் சடங்குசார் அசுத்த நிலைகளையும் குறிக்கக்கூடும். ஆகவே தேவையற்ற மருத்துவத் துல்லியத்தைத் தவிர்த்து, இரு எபிரெயச் சொற்களுக்குமிடையிலான தொடர்பையும் காக்கும் வகையில் பொதுவான நோய் மொழி பயன்படுத்தப்பட்டது.
- source_word: נַעֲמָן
  choice: நாகமான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תִּדְבַּק
  choice: பற்றிக்கொள்ளும்
  rationale: דבק என்பதன் ஒட்டிக்கொள்ளுதல் அல்லது நெருக்கமாகப் பற்றுதல் என்ற உயிரோட்டமான பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּךָ וּבְזַרְעֲךָ
  choice: உன்னையும் உன் சந்ததியினரையும்
  rationale: זֶרַע இங்கு ஒருவரின் பின்வரும் தலைமுறையினரைக் கூட்டாகக் குறிக்கிறது; ‘சந்ததியினர்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: இந்தத் தீர்ப்பின் நீடித்த தொடர்ச்சியை dignified contemporary Tamil-இல் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֵּצֵא מִלְּפָנָיו
  choice: அவன் அவருடைய முன்னிலையிலிருந்து ... வெளியே சென்றான்
  rationale: கதைநடையின் நேரடியான அசைவையும், எலிசாவின் முன்னிலையை விட்டு வெளியேறியதையும் பாதுகாக்கிறது; எபிரெய மூலத்திலுள்ள பிரதிப்பெயர் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: כַּשָּׁלֶג
  choice: பனியைப்போல் வெண்மையாக
  rationale: எபிரெயம் சொற்சொல்லாக ‘பனியைப்போல்’ என்கிறது; தோல் பாதிப்பின் சூழலில் ஒப்பிடப்படும் பண்பு வெண்மை என்பதால், தமிழில் இயல்பாகப் புரிய ‘வெண்மையாக’ வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: צָרַעַת / מְצֹרָע என்பவற்றை ஒரு குறிப்பிட்ட நவீன நோயாக அடையாளப்படுத்துதல்
  choice: தோல் நோய் / தோல் நோயுற்றவன்
  alternative: தொழுநோய் / தொழுநோயாளி
  rationale: இறைவனால் விதிக்கப்பட்ட தண்டனையாகவும் அது சந்ததியினருக்கும் தொடருவதாகவும் உரை கூறுகிறது; ஆனால் அதை நவீன ஹான்சன் நோயுடன் மட்டும் அடையாளப்படுத்த எபிரெயம் கட்டாயப்படுத்தவில்லை. எனவே பரந்த பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மரபுவழி மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டது.
- issue: כַּשָּׁלֶג என்ற ஒப்புமையின் வெளிப்படைப் பண்பு
  choice: பனியைப்போல் வெண்மையாக
  alternative: பனியைப்போல்
  rationale: தோல் நோயுற்ற நிலையை விவரிக்கும் சூழலில் வெண்மையே ஒப்பீட்டின் இயல்பான அம்சம். இதை வெளிப்படுத்துவது புதிய மருத்துவ விளக்கத்தைச் சேர்க்காமல் தமிழில் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் தீர்ப்புரையின் கண்ணியமும் தீவிரமும் நிலைக்குமாறு மொழிநடை அமைக்கப்பட்டது. ‘பற்றிக்கொள்ளும்’, ‘சந்ததியினர்’, ‘முன்னிலை’ ஆகிய சொற்கள் மூலத்தின் உருவகத்தையும் முறையான தொனியையும் காக்கின்றன.
