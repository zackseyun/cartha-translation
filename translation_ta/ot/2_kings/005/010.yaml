base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: ta
  text: 'எலிசா அவனிடம் ஒரு தூதுவனை அனுப்பினார். அவன், “நீ போய் யோர்தான் ஆற்றில் ஏழு முறை குளி. அப்போது உன் உடல் முன்பிருந்த நலநிலைக்குத் திரும்பும்[a]; நீ தூய்மையாவாய்[b]” என்று கூறினான்.


    [a] எபிரெய மொழியில், “உன் சதை உன்னிடம் திரும்பும்.” இது உடல் முன்பிருந்த ஆரோக்கியமான நிலைக்குத் திரும்புவதைக் குறிக்கும் மரபுத்தொடர்.


    [b] அல்லது, “நீ சுத்தமாவாய்.” இங்கு வரும் வினைச்சொல் உடல் சுத்தத்தையும் சடங்குமுறைத் தூய்மையையும் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “உன் சதை உன்னிடம் திரும்பும்.” இது உடல் முன்பிருந்த ஆரோக்கியமான நிலைக்குத் திரும்புவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ சுத்தமாவாய்.” இங்கு வரும் வினைச்சொல் உடல் சுத்தத்தையும் சடங்குமுறைத் தூய்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி ... சொல்லச் செய்தார்
  rationale: கதைநடையில் ‘அனுப்பினான்’ என்பதே அடிப்படைப் பொருள். செய்தியைக் கூறுவதற்காகத் தூதுவனை அனுப்பிய செயலை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַלְאָךְ
  choice: தூதுவன்
  rationale: இச்சூழலில் இது வானதூதரை அல்ல, மனிதச் செய்தியாளரைக் குறிக்கிறது.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: நீ போய் ... குளி
  rationale: இணைந்த கட்டளைகளின் வரிசையையும், முழு உடலை நீரில் கழுவும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையைக் கூறும் நேரடியான சொற்றொடர்.
- source_word: בַּיַּרְדֵּן
  choice: யோர்தான் ஆற்றில்
  rationale: தமிழ் வாசகருக்கு இடம் தெளிவாக இருக்க ‘ஆறு’ சேர்க்கப்பட்டுள்ளது; எபிரெயத்தில் இடப்பெயரே வருகிறது.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: உன் உடல் மீண்டும் நலம்பெறும்
  rationale: சொல்லர்த்தமாக ‘உன் சதை உன்னிடம் திரும்பும்’ என்ற எபிரெய மரபுத்தொடர், உடல் பழைய ஆரோக்கிய நிலைக்குத் திரும்புவதைக் குறிக்கிறது. இயல்பான தமிழுக்காக அதன் கருத்து முதன்மை உரையில் தரப்பட்டு, சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּטְהָר
  choice: நீ சுத்தமாவாய்
  rationale: உடல் நோயிலிருந்து சுத்தமாவதையும் தூய்மை சார்ந்த நுண்பொருளையும் ஒன்றை மட்டும் நிர்ணயிக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּשָׂרְךָ என்பதைக் ‘சதை’ என்று நேரடியாக மொழிபெயர்ப்பதா, உடல்நலம் மீள்வதைக் கருத்துப்படி சொல்வதா
  choice: முதன்மை உரையில் ‘உன் உடல் மீண்டும் நலம்பெறும்’
  alternative: ‘உன் சதை உன்னிடம் திரும்பும்’
  rationale: நேரடி வடிவம் தமிழில் இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், மரபுத்தொடரின் மீட்சி சார்ந்த கருத்து முதன்மை உரையில் தரப்பட்டுள்ளது; அதன் தெளிவான உடல் மொழி அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: טהר என்பதை உடல்நலம் சார்ந்த ‘சுத்தம்’ என்றா அல்லது சடங்குமுறை ‘தூய்மை’ என்றா வரையறுப்பது
  choice: நீ சுத்தமாவாய்
  alternative: நீ தூய்மையாக்கப்படுவாய்
  rationale: நாகமானின் தோல் நோய் குணமடையும் சூழலும் தூய்மை சார்ந்த எபிரெயச் சொல்லின் நுண்பொருளும் இரண்டும் திறந்தவையாக இருக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்க கதைநடைத் தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தூதுவன்’ மனிதச் செய்தியாளரைத் தெளிவுபடுத்துகிறது; ‘சுத்தமாவாய்’ என்ற சொல் உடல் மற்றும் சடங்குமுறைத் தூய்மை ஆகிய இரு நுண்பொருள்களையும் முற்றிலும் மூடிவிடாமல் வைத்திருக்கிறது.
