source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: ta
  text: அராம்[c] அரசனின் படைத்தலைவனான நாமான், தன் எஜமானின் பார்வையில் செல்வாக்குமிக்கவனாகவும் பெரிதும் மதிக்கப்பட்டவனாகவும் இருந்தான். ஏனெனில், அவன் மூலமாக யாவே அராமுக்கு வெற்றியை[a] அளித்திருந்தார். அவன் வலிமைமிக்க போர்வீரனாக இருந்தான்; ஆனால் அவன் தொழுநோயாளியாக இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுதலை’ அல்லது ‘மீட்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரந்த பொருள் கொண்டது; இங்கு இராணுவ வெற்றியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘தொழுநோயாளி.’ பண்டைய சூழலில் இச்சொல் கடுமையான பலவகைத் தோல் பாதிப்புகளைக் குறிக்கக்கூடும்; இன்றைய மருத்துவத்தில் தொழுநோய் எனப்படும் ஹான்சன் நோயுடன் இது முற்றிலும் ஒன்றாக இருக்க வேண்டியதில்லை.
    reason: cultural_note
  - marker: c
    text: பாரம்பரியமாக ‘சீரியா’ என வழங்கப்படுகிறது; எபிரெயில் ‘அராம்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: நாமான்
  rationale: வாவ் புதிய நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் தேவையற்ற காலச் சுட்டான ‘இப்போது’ என்பதைச் சேர்க்காமல், பெயரை நேரடியாகத் தொடங்குவது இயல்பானது.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: அராம் அரசனின் படைத்தலைவன்
  rationale: שַׂר צְבָא என்பது இராணுவத்தின் தலைமை அதிகாரியைக் குறிக்கிறது; ‘படைத்தலைவன்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது. אֲרָם வரலாற்றுப் பெயராக ‘அராம்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: தன் எஜமானின் பார்வையில் செல்வாக்குமிக்கவனாக இருந்தான்
  rationale: אִישׁ גָּדוֹל இங்கு உடல் அளவை அல்ல, உயர்ந்த சமூக நிலையையும் செல்வாக்கையும் குறிக்கிறது. לִפְנֵי אֲדֹנָיו என்பதன் அரசவைச் சார்ந்த உறவை ‘தன் எஜமானின் பார்வையில்’ காக்கிறது.
- source_word: וּנְשֻׂא פָנִים
  choice: பெரிதும் மதிக்கப்பட்டவன்
  rationale: ‘முகம் உயர்த்தப்பட்டவன்’ என்ற எபிரெய மரபுத்தொடர் மரியாதையும் உயர்ந்த மதிப்பும் பெற்றிருப்பதைக் குறிக்கிறது; இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: ஏனெனில், அவன் மூலமாக யாவே அராமுக்கு வெற்றியை அளித்திருந்தார்
  rationale: בּוֹ கருவி அல்லது வழிமுறையைக் குறிப்பதால் ‘அவன் மூலமாக’ எனப்பட்டது. תְּשׁוּעָה விடுதலை/மீட்பு என்ற பரந்த பொருளையும் கொள்ளலாம்; இவ்விராணுவச் சூழலில் ‘வெற்றி’ மிகப் பொருத்தமானது. יְהוָה தனிப்பெயராக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: גִּבּוֹר חַיִל
  choice: வலிமைமிக்க போர்வீரன்
  rationale: இச்சொற்றொடர் போரில் வல்லமையும் வீரமும் உடையவனைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: מְצֹרָע
  choice: தொழுநோயாளி
  rationale: צָרַעַת நோயால் பாதிக்கப்பட்ட ஒருவரைக் குறிக்கும் எபிரெய வடிவத்தின் நேரடியான பாரம்பரிய இணைப்பை இது காக்கிறது; அதன் பண்டைய மருத்துவ வரம்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: அராம் என்ற அந்நிய நாட்டிற்கு யாவே வெற்றி அளித்ததாகக் கூறுதல்
  choice: யாவே அராமுக்கு வெற்றியை அளித்திருந்தார்
  alternative: யாவே அராமை விடுவித்திருந்தார்
  rationale: இஸ்ரவேல் அல்லாத அராமின் இராணுவ வெற்றியையும் யாவே அளித்தார் என்று எபிரெய உரை வெளிப்படையாகக் கூறுகிறது. இந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலைக் காட்ட ‘எஜமான்,’ இராணுவப் பதவிக்குப் ‘படைத்தலைவன்’ ஆகியவை தேர்ந்தெடுக்கப்பட்டன. வாக்கியங்கள் தமிழில் இயல்பாகப் பிரிக்கப்பட்டாலும், மூலத்தின் காரண உறவும் இறுதி எதிர்மறைத் திருப்பமும் பாதுகாக்கப்பட்டுள்ளன.
