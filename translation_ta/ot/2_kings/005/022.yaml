  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: ta
  text: அவன், “எல்லாம் நலமே.[a] என் எஜமான் என்னை அனுப்பி, ‘இதோ, இப்போதுதான் எப்பிராயீம் மலைநாட்டிலிருந்து இறைவாக்கினர் குழுவைச் சேர்ந்த[b] இரண்டு இளைஞர்கள் என்னிடம் வந்திருக்கிறார்கள். அவர்களுக்கு ஒரு தாலந்து அளவு வெள்ளியையும்[c] இரண்டு மாற்று உடைகளையும் தயவுசெய்து கொடுங்கள்’ என்று சொல்லச் சொன்னார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானம்” அல்லது “நலம்தான்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல் கவலைப்பட வேண்டியது ஒன்றுமில்லை என்று உறுதியளிக்கும் மரபுத்தொடராக வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இறைவாக்கினரின் மகன்கள்.” இது இறைவாக்கினர் சமூகத்தின் உறுப்பினர்களைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: “தாலந்து” என்பது விலையுயர்ந்த உலோகங்களை அளக்கப் பயன்படுத்தப்பட்ட பெரும் எடை அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: எல்லாம் நலமே
  rationale: இச்சூழலில் இது வாழ்த்தாகவோ ‘சமாதானம்’ என்ற கருத்தாகவோ அல்லாமல், கவலைப்பட வேண்டியது ஒன்றுமில்லை என்று உறுதியளிக்கும் மரபுத்தொடராகச் செயல்படுகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: கேயாசி எலிசாவைக் குறிக்கும் பணியாளர்–எஜமான் உறவை இயல்பாக வெளிப்படுத்துகிறது; தெய்வத்தைக் குறிக்கும் மரியாதைச் சொல்லாகத் தவறாகப் புரிந்துகொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: என்னை அனுப்பி … என்று சொல்லச் சொன்னார்
  rationale: அனுப்பப்பட்ட நோக்கம் ஒரு செய்தியைச் சொல்வதே என்பதை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִנֵּה עַתָּה זֶה
  choice: இதோ, இப்போதுதான்
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה என்பதையும் நிகழ்வின் உடனடித் தன்மையையும் தக்கவைக்கிறது.
- source_word: נְעָרִים
  choice: இளைஞர்கள்
  rationale: இந்தச் சூழலில் அவர்கள் இறைவாக்கினர் சமூகத்தைச் சேர்ந்தவர்களாக அடையாளப்படுத்தப்படுவதால், ‘வேலையாட்கள்’ அல்லது ‘சிறுவர்கள்’ என்பதைவிட ‘இளைஞர்கள்’ பொருத்தமானது.
- source_word: מֵהַר אֶפְרַיִם
  choice: எப்பிராயீம் மலைநாட்டிலிருந்து
  rationale: இது பொதுவாக ஒரு தனி மலையை அல்ல, எப்பிராயீமின் மேட்டுநிலப் பகுதியைக் குறிக்கிறது.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: இறைவாக்கினர் குழுவைச் சேர்ந்த
  rationale: எபிரெய மரபுத்தொடரின் சமூகப் பொருளை இயல்பான தமிழில் தருகிறது; அவர்கள் இறைவாக்கினர்களின் உடல்சார்ந்த மகன்கள் என்று தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: תְּנָה נָּא
  choice: தயவுசெய்து கொடுங்கள்
  rationale: கட்டளையுடன் வரும் நָא காட்டும் பணிவான வேண்டுகோள் தொனியைப் பாதுகாக்கிறது.
- source_word: כִּכַּר כֶּסֶף
  choice: ஒரு தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது விலையுயர்ந்த உலோகத்தை அளக்கும் பெரும் எடை அலகு; துல்லியத்திற்காக மரபான அளவைச் சொல் தக்கவைக்கப்படுகிறது.
- source_word: חֲלִפוֹת בְּגָדִים
  choice: மாற்று உடைகள்
  rationale: மாற்றிப் பயன்படுத்துவதற்கான முழு உடைத் தொகுப்புகளைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: ‘இறைவாக்கினரின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருள்
  choice: இறைவாக்கினர் குழுவைச் சேர்ந்த
  alternative: இறைவாக்கினரின் மகன்களில் இருவர்
  rationale: இங்கு உடல்சார்ந்த வம்ச உறவு அல்ல, இறைவாக்கினர் சமூகத்தின் உறுப்பினர்கள் குறிக்கப்படுகின்றனர். மொழிபெயர்ப்பு அந்தச் சமூகப் பொருளைத் தெளிவாக்குகிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நேரடி உரை அமைப்பும் கேயாசியின் பணிவான வேண்டுகோள் தொனியும் காக்கப்பட்டுள்ளன; தெளிவற்ற அல்லது பண்பாட்டுச் சார்ந்த சொற்களுக்கு அடிக்குறிப்புகள் தரப்பட்டுள்ளன.
