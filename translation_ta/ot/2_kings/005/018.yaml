  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: ta
  text: '“இந்தக் காரியத்தில் யாவே உமது அடியானை மன்னிப்பாராக: என் எஜமான் ரிம்மோன் ஆலயத்திற்குள் சென்று அங்கே பணிந்துகொள்ளும்போது[a], அவர் என் கையை ஊன்றிக்கொண்டிருக்கையில், நானும் ரிம்மோன் ஆலயத்தில் பணிந்துகொள்ளும்போது, நான் ரிம்மோன் ஆலயத்தில் பணிந்துகொள்ளும் இந்தக் காரியத்தில் யாவே உமது அடியானைத் தயவுசெய்து மன்னிப்பாராக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிந்துகொள்ள” என்பதற்கான எபிரெய வினை, உடலைத் தாழ்த்துவதையும் வழிபடுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְלַח
  choice: மன்னிப்பாராக
  rationale: இது உறுதியான கூற்று அல்ல; நாமான் முன்வைக்கும் வேண்டுதலைக் குறிக்கும் விருப்பவினை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருமறையில் உள்ள இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: לְעַבְדֶּךָ
  choice: உமது அடியான்
  rationale: மரியாதையுடன் தன்னைத் தாழ்த்திக் குறிப்பிடும் அரசவைச் சொல்லாடலுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: בְּבוֹא אֲדֹנִי
  choice: என் எஜமான் ... சென்று ... போது
  rationale: בְּ உடனான வினையெச்ச அமைப்பின் காலச்சூழலைத் தெளிவாகத் தருகிறது; இங்கு குறிக்கப்படுவது நாமான் பணிபுரியும் அரசன் என்பதால் ‘எஜமான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵית רִמּוֹן
  choice: ரிம்மோனின் ஆலயம்
  rationale: சொல்லுக்கு சொல் ‘ரிம்மோனின் வீடு’ என்றாலும், இச்சூழலில் அது தெய்வக் கோவிலைக் குறிப்பதால் ‘ஆலயம்’ சாதாரண வாசகருக்குத் தெளிவான சமமான சொல்.
- source_word: לְהִשְׁתַּחֲוֺת / וְהִשְׁתַּחֲוֵיתִי
  choice: பணிந்துகொள்ள
  rationale: உடலைத் தாழ்த்தும் செயல் மற்றும் வழிபாட்டு வணக்கம் ஆகிய இரண்டையும் குறிக்கக்கூடிய எபிரெய வினையின் இருபொருள் வாய்ப்பை ஓரளவு தக்கவைக்கிறது; நாமானின் உள்ளார்ந்த நோக்கத்தை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: נִשְׁעָן עַל יָדִי
  choice: என் கையை ஊன்றிக்கொள்வதால்
  rationale: அரசன் நாமானின் கையை ஆதரவாகப் பயன்படுத்தும் உடல்செயலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுதலை வலுப்படுத்தும் பணிவான இடைச்சொல்லின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: הִשְׁתַּחֲוָה என்பது இங்கு வழிபாட்டையா அல்லது உடலைத் தாழ்த்தும் செயலையா குறிக்கிறது?
  choice: பணிந்துகொள்ள
  alternative: வழிபட / சாஷ்டாங்கமாக விழுந்து வணங்க
  rationale: எபிரெயச் சொல் உடலால் பணிவதையும் வழிபடுவதையும் குறிக்கலாம். நாமான் வெளிப்புற அரசவைச் செயலுக்காக மன்னிப்புக் கேட்கிறாரா அல்லது வழிபாட்டுச் செயலுக்காகக் கேட்கிறாரா என்பதை மொழிபெயர்ப்பில் முடிவுசெய்யாமல், மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வேண்டுதலின் மீள்வாக்கியம் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது. ‘பணிந்துகொள்ள’ என்ற சொல் வெளிப்புற உடல்செயலுக்கும் வழிபாட்டு வணக்கத்திற்கும் இடையிலான மூலமொழியின் திட்டமிட்ட தெளிவின்மையைத் தக்கவைக்கிறது.
