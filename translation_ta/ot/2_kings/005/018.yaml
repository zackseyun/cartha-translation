revisions:
- from: '“இந்தக் காரியத்தில் யாவே உமது அடியானை மன்னிப்பாராக: என் எஜமான் ரிம்மோனின் ஆலயத்திற்குள் சென்று அங்கே பணிந்துகொள்ளும்போது[a], அவர் என் கையை ஊன்றிக்கொள்வதால், நானும் ரிம்மோனின் ஆலயத்தில்[b] பணிந்துகொள்கிறேன். இவ்வாறு நான் ரிம்மோனின் ஆலயத்தில் பணிந்துகொள்ளும்போது, இந்தக் காரியத்தில் யாவே உமது அடியானைத் தயவுசெய்து மன்னிப்பாராக.”'
  to: '“இந்தக் காரியத்தில் யாவே உமது அடியானை மன்னிப்பாராக: என் எஜமான் ரிம்மோன் ஆலயத்திற்குள் சென்று அங்கே பணிந்துகொள்ளும்போது[a], அவர் என் கையை ஊன்றிக்கொண்டிருக்கையில், நானும் ரிம்மோன் ஆலயத்தில் பணிந்துகொள்ளும்போது, நான் ரிம்மோன் ஆலயத்தில் பணிந்துகொள்ளும் இந்தக் காரியத்தில் யாவே உமது அடியானைத் தயவுசெய்து மன்னிப்பாராக.”'
  rationale: The revision replaces the present habitual wording with prospective temporal clauses that preserve the Hebrew’s described circumstance and its emphatic repetition. It also renders the king’s reliance on Naaman’s hand as an attendant circumstance rather than a cause, and improves the cultural-note phrasing. Footnote marker b is retained in the footnote set but must be anchored in the text; therefore the complete text should include it at the second occurrence of “ரிம்மோன் ஆலயத்தில்.”
