base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: ta
  text: 'பின்பு அவன் தன் பரிவாரத்தார் அனைவரோடும் இறைவனுடைய மனிதரிடம் திரும்பி வந்தான். அவன் அவருக்கு முன்பாக நின்று, “இதோ, இப்போது நான் அறிந்துகொண்டேன்: இஸ்ரவேலில் அல்லாமல் பூமியெங்கும் இறைவன் இல்லை. இப்போது, உமது அடியான் தரும் அன்பளிப்பை[a] தயவுசெய்து ஏற்றுக்கொள்ளுங்கள்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அன்பளிப்பு” என்பதற்கான எபிரெயச் சொல் சொல்லர்த்தமாக “ஆசீர்வாதம்” என்று பொருள்படும்; இங்கு அது பரிசைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: தீர்க்கதரிசி என்ற விளக்கச் சொல்லைச் சேர்க்காமல், எபிரெய மொழியின் வழக்குத் தலைப்பையும் அதன் இலக்கிய ஒலியையும் காக்கிறது.
- source_word: מַחֲנֵהוּ
  choice: தன் பரிவாரம் முழுவதும்
  rationale: சொல்லர்த்தமாக ‘அவனுடைய முகாம்’; இந்நிகழ்ச்சியில் நாமானுடன் வந்திருந்த உடனிருப்போர் குழுவைக் குறிக்கிறது. ‘பரிவாரம்’ இயல்பான தமிழில் அந்தக் கூட்டுப் பொருளைத் தருகிறது.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: அவருக்கு முன்பாக நின்று
  rationale: ஒருவரின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִנֵּה נָא
  choice: இதோ, இப்போது
  rationale: கவனத்தை வலியுறுத்தும் இரு கூறுகளையும் நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிந்துகொண்டேன்
  rationale: அண்மையில் ஏற்பட்ட உணர்தலால் வந்த தற்போதைய அறிவுநிலையை எபிரெய நிறைவேற்றுவினை இங்கு உணர்த்துகிறது.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் இருப்பவரைத் தவிர பூமியெங்கும் இறைவன் இல்லை
  rationale: இஸ்ரவேலின் இறைவனுடைய தனித்தன்மையை வலுவாக அறிக்கையிடும் கூற்றைப் பாதுகாக்கிறது; ‘பூமி’ என்பது இங்குள்ள விரிந்த பொருளைத் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் இருப்பவரைத் தவிர
  rationale: எபிரெய உரையில் உள்ள ‘இஸ்ரவேலில்’ என்ற இடச்சுட்டைத் தக்கவைத்தபடி, தமிழில் ஒப்பீட்டுக் கட்டமைப்பு தெளிவாக இருக்க ‘இருப்பவரை’ சேர்க்கப்படுகிறது; ‘இஸ்ரவேலின் இறைவனைத் தவிர’ என உரையில் இல்லாத தொடர்புச் சொல்லைச் சேர்க்கவில்லை.
- source_word: בְרָכָה
  choice: அன்பளிப்பு
  rationale: சொல்லர்த்தமாக ‘ஆசீர்வாதம்’; பரிசளிக்கும் இச்சூழலில் கொடுக்கப்படும் பரிசைக் குறிக்கிறது. ‘அன்பளிப்பு’ அந்த வழக்குப் பொருளைத் தெளிவாகத் தருகிறது; சொல்லர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: இங்கு அடிமைநிலையை வலியுறுத்தாமல், மரியாதையுடன் தன்னைக் குறிப்பிடும் வழக்காக வருகிறது; ‘அடியான்’ அந்தப் பணிவான நேரடிப் பேச்சுப் பதிவைத் தக்கவைக்கிறது.
- source_word: קַח נָא
  choice: தயவுசெய்து ஏற்றுக்கொள்ளும்
  rationale: சொல்லர்த்தமாக ‘தயவுசெய்து எடுத்துக்கொள்ளும்’; பரிசை வழங்கும் சூழலில் நோக்கப்பட்ட பொருள் ஏற்றுக்கொள்வதாகும்.
theological_decisions:
- issue: இஸ்ரவேலைத் தவிர வேறெங்கும் இறைவன் இல்லை என்ற நாமானின் அறிக்கை
  choice: இஸ்ரவேலில் இருப்பவரைத் தவிர பூமியெங்கும் இறைவன் இல்லை என்ற வலுவான தனித்தன்மை அறிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இஸ்ரவேலின் இறைவனைத் தவிர வேறு தெய்வம் இல்லை’ என்று விரிவாக்குதல், அல்லது நாமானின் முந்தைய பன்மதப் பார்வையை முன்னிறுத்தி ‘ஒரு தெய்வமும் இல்லை’ என்று பொதுப்படுத்துதல்.
  rationale: எபிரெய உரை வலுவான தனித்தன்மை அறிக்கையை முன்வைக்கிறது. அதனை மென்மைப்படுத்தாமலும், உரையில் இல்லாத ‘இஸ்ரவேலின் இறைவன்’ என்ற விரிவாக்கத்தைச் சேர்க்காமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உரையாடலில் நாமானின் பணிவை வெளிப்படுத்த ‘உமது’, ‘அடியான்’, ‘ஏற்றுக்கொள்ளும்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘இறைவனுடைய மனிதர்’ என்ற எபிரெய மரபுத்தலைப்பு விளக்கமின்றி பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘அன்பளிப்பு’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
