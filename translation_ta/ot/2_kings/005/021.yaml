  text: וַ/יִּרְדֹּ֥ף גֵּיחֲזִ֖י אַחֲרֵ֣י נַֽעֲמָ֑ן וַ/יִּרְאֶ֤ה נַֽעֲמָן֙ רָ֣ץ אַחֲרָ֔י/ו וַ/יִּפֹּ֞ל מֵ/עַ֧ל הַ/מֶּרְכָּבָ֛ה לִ/קְרָאת֖/וֹ וַ/יֹּ֥אמֶר הֲ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: ta
  text: அப்போது கேயாசி நாமானைப் பின்தொடர்ந்து சென்றான். கேயாசி தனக்குப் பின்னால் ஓடிவருவதை நாமான் கண்டபோது, அவனைச் சந்திக்கத் தேரிலிருந்து இறங்கி, “எல்லாம் நலம்தானே?”[a] என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இங்கு பயன்படுத்தப்பட்டுள்ள ஷாலோம் என்ற சொல், வாழ்த்தாகவோ ஒருவரின் நலனை விசாரிக்கும் கேள்வியாகவோ பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: பின்தொடர்ந்து சென்றான்
  rationale: רדף என்பது துரத்துதல் அல்லது பின்தொடர்தல் எனப் பொருள்படும். இங்கு பகைமையான துரத்தலைக் குறிப்பதாகத் தெளிவில்லை; நோக்கத்துடன் பின்னால் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: தனக்குப் பின்னால் அவன் ஓடிவருவதை ... கண்டபோது
  rationale: நாமான் கேயாசி தன்னைப் பின்தொடர்ந்து ஓடிவரும் செயலைக் கண்டான் என்ற எபிரெயச் சொற்றொடரின் பார்வையையும் தொடர்ச்சியான செயலையும் காக்கிறது.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: தேரிலிருந்து இறங்கி
  rationale: נפל என்பதன் அடிப்படைப் பொருள் ‘விழுதல்’ என்றாலும், வாகனத்திலிருந்து இறங்கும் சூழலில் இது விரைவாக இறங்கியதைக் குறிக்கும் மரபுத்தொடர். விபத்தாக விழுந்தான் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘இறங்கி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க
  rationale: לקראת என்பது ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது; இச்சூழலில் ‘சந்திக்க’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הֲשָׁלוֹם
  choice: எல்லாம் நலம்தானே?
  rationale: שָׁלוֹם இங்கு வெறுமனே ‘சமாதானம்’ என்பதல்ல; நிலைமை நன்றாக உள்ளதா என்று விசாரிக்கும் வழக்கமான சொல். ‘எல்லாம் நலம்தானே?’ என்பது அதன் சுருக்கத்தையும் அக்கறை கலந்த விசாரணையையும் நவீன தமிழில் தருகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ தமிழில் நிகழ்வுத் தொடரை இயல்பாக இணைக்கிறது.
