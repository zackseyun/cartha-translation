translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் சுருக்கமான நிகழ்வோட்டம் காக்கப்பட்டு, சொற்சொல்லான மொழிபெயர்ப்பு உருவாக்கக்கூடிய தவறான பொருள் தவிர்க்கப்பட்டுள்ளது.
