  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: ta
  text: அதற்கு அவர் அவனிடம்[a], “அந்த மனிதன் தன் தேரிலிருந்து விலகி உன்னைச் சந்திக்க வந்தபோது, என் உள்ளம் உன்னோடு சென்றிருக்கவில்லையா? வெள்ளியையும் ஆடைகளையும், ஒலிவத் தோப்புகளையும் திராட்சைத்தோட்டங்களையும், ஆடுமாடுகளையும், வேலைக்காரர்களையும் வேலைக்காரிகளையும்[b] பெற்றுக்கொள்வதற்கு இது நேரமா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, விளக்கமாக: “அந்த மனிதன் தன் தேரிலிருந்து விலகி உன்னைச் சந்திக்க வந்தபோது, நான் உள்ளத்தால் அங்கே இருக்கவில்லையா?”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆண் அடிமைகளையும் பெண் அடிமைகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: என் உள்ளம் உன்னோடு செல்லவில்லையா?
  rationale: ‘என் உள்ளம் சென்றது’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, தமிழில் அதன் உடனிருப்பு அல்லது உள்ளார்ந்த அறிவுணர்வு தெளிவாக இருக்க ‘உன்னோடு’ என்பது சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது; இதன் விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: அந்த மனிதன் தன் தேரிலிருந்து திரும்பி உன்னைச் சந்திக்க வந்தபோது
  rationale: הָפַךְ என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ காக்கப்படுகிறது. אִישׁ சூழலில் நாமானைக் குறித்தாலும், மூலத்தில் பெயர் இல்லாததால் ‘அந்த மனிதன்’ என வழங்கப்படுகிறது.
- source_word: הָעֵת
  choice: இது நேரமா?
  rationale: வினாத்துகள் இல்லாவிட்டாலும் சூழலில் உள்ள கண்டன வினாவின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: வெள்ளியைப் பெற்றுக்கொள்வது
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருளான ‘வெள்ளி’ காக்கப்படுகிறது; לָקַחַת இச்சூழலில் பரிசாக ஏற்றுக்கொள்வதைக் குறிப்பதால் ‘பெற்றுக்கொள்வது’ இயல்பாக உள்ளது.
- source_word: בְּגָדִים
  choice: ஆடைகள்
  rationale: நவீனத் தமிழில் தெளிவான, கண்ணியமான பொதுப்பயன்பாட்டுச் சொல்.
- source_word: זֵיתִים
  choice: ஒலிவத் தோப்புகள்
  rationale: திராட்சைத்தோட்டங்கள் மற்றும் பிற உடைமைகளோடு வரும் பட்டியலில், பழங்களைவிட விளைச்சல் தரும் நிலவுடைமையைக் குறிக்கிறது.
- source_word: כְרָמִים
  choice: திராட்சைத்தோட்டங்கள்
  rationale: வேளாண் உடைமையைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: சிறுகால்நடைகள் மற்றும் பெருங்கால்நடைகள் என்ற இணையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: வேலைக்காரர்களும் வேலைக்காரிகளும்
  rationale: மூலத்தின் ஆண்-பெண் வேறுபாட்டைத் தக்கவைக்கிறது; அடிமைப்பட்ட சமூக நிலையைக் கூடக் குறிக்கக்கூடிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עֲבָדִים וּשְׁפָחוֹת என்ற சமூகநிலைச் சொற்களின் மொழிபெயர்ப்பு
  choice: வேலைக்காரர்களும் வேலைக்காரிகளும்
  alternative: ஆண் அடிமைகளும் பெண் அடிமைகளும்
  rationale: இந்த வசனம் ஆதாயமாகப் பெறப்படும் உடைமைகளைப் பட்டியலிடுகிறது. எபிரேயச் சொற்கள் பணியாளர் முதல் அடிமை வரை பொருள்வீச்சைக் கொண்டிருப்பதால், முதன்மை உரையில் இயல்பான சொல்லும், கட்டுப்பட்ட சமூகநிலையைத் தெளிவாக்கும் மாற்று அடிக்குறிப்பிலும் வழங்கப்படுகிறது.
- issue: לִבִּי הָלַךְ என்ற உருவகம் குறிக்கும் எலிசாவின் அறிவுணர்வு
  choice: என் உள்ளம் உன்னோடு செல்லவில்லையா?
  alternative: அந்த நிகழ்வை நான் உள்ளுணர்வால் அறியவில்லையா?
  rationale: அறிவின் வழிமுறையைத் திட்டவட்டமாகக் கோட்பாட்டாக்காமல், மூலத்தின் ‘என் உள்ளம் சென்றது’ என்ற உருவகத்தையும் அதன் மர்மத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய உருவகமும் கண்டன வினாவும் காக்கப்பட்டுள்ளன. பட்டியலின் தொடர்ச்சியைத் தமிழில் இயல்பாக அமைத்தபோதும், மூலத்தின் முக்கிய கூறுகள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
