  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: ta
  text: யூதாவின் அரசனான அகசியாவின் சகோதரர்களை[a] யெகூ கண்டான். அவன் அவர்களிடம், “நீங்கள் யார்?” என்று கேட்டான். அதற்கு அவர்கள், “நாங்கள் அகசியாவின் சகோதரர்கள். ராஜாவின் மகன்களையும் ராஜமாதாவின்[c] மகன்களையும் குறித்து நலம் விசாரிக்க[b] கீழே வந்தோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பதற்கான எபிரெயச் சொல், அரச குடும்ப வரலாற்றில் உடன்பிறந்த சகோதரர்களை மட்டுமல்லாமல் நெருங்கிய உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ராஜாவின் மகன்களும் ராஜமாதாவின் மகன்களும் நலமாக இருக்கிறார்களா என்று பார்க்க.’
    reason: lexical_alternative
  - marker: c
    text: ‘ராஜமாதா’ என்பது எபிரெய மொழியிலுள்ள கெபீரா என்ற சொல்லின் மொழிபெயர்ப்பு; இது அரசனின் தாய்க்குரிய அரசவைப் பட்டம்.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: கண்டான்
  rationale: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கண்டான்’ அல்லது ‘எதிர்ப்பட்டான்.’ இங்கு ‘கண்டான்’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: அகசியாவின் சகோதரர்கள்
  rationale: אָח என்ற சொல் நேரடியாக ‘சகோதரன்’ என்று பொருள்படும். அரச குடும்ப வரலாற்றில் அது நெருங்கிய உறவினர்களையும் குறிக்கக்கூடும் என்பதால், மூலச்சொல்正文த்தில் தக்கவைக்கப்பட்டு விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் ராஜா
  rationale: இது அகசியாவைக் குறிக்கும் நேரடியான அரச பட்டம்; நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: מִי אַתֶּם
  choice: நீங்கள் யார்?
  rationale: எபிரெயத்தின் சுருக்கமான நேரடிக் கேள்வியை இயல்பான தமிழில் அப்படியே வெளிப்படுத்துகிறது.
- source_word: וַנֵּרֶד
  choice: கீழே வந்தோம்
  rationale: இறங்கிவந்த புவியியல் இயக்கத்தைப் பேச்சாளர்களின் பார்வையிலிருந்து இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִשְׁלוֹם
  choice: நலம் விசாரிக்க
  rationale: இங்கு שָׁלוֹם என்பது வெறும் வாழ்த்தைக் குறிக்காமல் ஒருவரின் நலனை அறிந்துகொள்வதைக் குறிக்கிறது. ‘நலம் விசாரிக்க’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: ராஜாவின் மகன்கள்
  rationale: ‘மகன்கள்’ என்ற மூலத்தின் குறிப்பான பொருளைப் பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: הַגְּבִירָה
  choice: ராஜமாதா
  rationale: யூதாவின் அரசவைச் சூழலில் இச்சொல் பொதுவாக அரசனின் தாய்க்குரிய அதிகாரபூர்வ அரசவைப் பட்டத்தைக் குறிக்கிறது. ‘ராஜமாதா’ அந்தப் பதவிநிலையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: ராஜமாதாவின் மகன்கள்
  rationale: ‘ராஜாவின் மகன்கள்’ என்பதற்கு இணையான மூல வாக்கிய அமைப்பைப் பேணுகிறது; இரு குழுக்களின் உறுப்பினர்கள் ஒரேவர்களாக இருக்கக்கூடிய சாத்தியத்தை மொழிபெயர்ப்பு தீர்மானித்துவிடவில்லை.
