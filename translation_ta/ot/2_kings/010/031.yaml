base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: ta
  text: ஆனால் யெகூ, இஸ்ரவேலின் கடவுளாகிய யாவேயின் திருச்சட்டத்தின்படி முழு மனதோடு நடப்பதில் கவனமாக இருக்கவில்லை.[a] யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்யவைத்த பாவங்களைவிட்டு அவர் விலகவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் திருச்சட்டத்தின்படி நடப்பதைக் கடைப்பிடிக்கவில்லை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை கவனமான கடைப்பிடிப்பை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அரசர்கள் நூலில் மீண்டும் மீண்டும் குறிப்பிடப்படும் இச்சொற்றொடர், யெரொபெயாம் நிறுவிய விக்கிரக வழிபாட்டு முறையுடன் தொடர்புடைய பாவங்களைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: நடக்கக் கவனமாயிருக்கவில்லை
  rationale: שׁמר + வினையெச்சக் கட்டமைப்பு கவனமாகச் செயல்படுதல் அல்லது கடைப்பிடிப்பதில் அக்கறை கொள்ளுதல் என்பதைக் குறிக்கிறது; ‘கவனமாயிருக்கவில்லை’ என்பது இந்த நுணுக்கத்தையும் ‘நடக்க’ என்பது எபிரெய உருவகத்தையும் காக்கின்றன.
- source_word: תּוֹרַת
  choice: திருச்சட்டத்தின்படி
  rationale: இங்கு תּוֹרָה உடன்படிக்கை சார்ந்த இறைச்சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ இயல்பான, கண்ணியமான தமிழில் அதன் சமய மற்றும் சட்டப் பொருளை வெளிப்படுத்துகிறது; בְ முன்னிடைச்சொல்லின் வழிநடத்தும் பொருளை ‘-இன்படி’ தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பொதுவான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּכָל לְבָבוֹ
  choice: முழு மனதோடு
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לֹא סָר מֵעַל
  choice: விட்டு அவர் விலகவில்லை
  rationale: ஒரு தீய வழியிலிருந்து திரும்புதல் அல்லது அகலுதல் என்ற பொருளை தெளிவாகத் தருகிறது.
- source_word: חַטֹּאות
  choice: பாவங்கள்
  rationale: எபிரெயப் பன்மையை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: הֶחֱטִיא என்பதன் காரணவினைப் பொருளைத் துல்லியமாகக் காக்கிறது. தொடர்புப்பெயரின் இலக்கணக் குறிப்பிடம் யெரொபெயாம் என்பதால், அவனே இஸ்ரவேலைப் பாவம் செய்யவைத்தான் என்பது தெளிவாகிறது.
- source_word: וְיֵהוּא
  choice: ஆனால் யெகூ
  rationale: முந்தைய சீர்திருத்தச் செயல்களுக்கும் இங்குள்ள உடன்படிக்கை உண்மையின்மைக்கும் இடையிலான எதிர்மறைத் தொடர்பை ‘ஆனால்’ காட்டுகிறது.
theological_decisions:
- issue: யெகூவின் உடன்படிக்கை உண்மைத்தன்மை குறித்த மதிப்பீடு
  choice: அவர் செய்த முந்தைய சீர்திருத்தங்களுக்கிடையிலும், யாவேயின் திருச்சட்டத்திற்குக் முழு மனதோடு கீழ்ப்படிவதில் தவறினார் என்று வசனம் மதிப்பிடுகிறது.
  alternative: இது யெகூவின் தனிப்பட்ட அர்ப்பணிப்பை அல்ல, நிறைவுபெறாத அரசியல் சீர்திருத்தத்தை மட்டுமே குறைகூறுகிறது.
  rationale: ‘முழு மனதோடு’ என்பதும் ‘பாவங்களைவிட்டு விலகவில்லை’ என்பதும் உடன்படிக்கை சார்ந்த ஒழுக்க மற்றும் சமய மதிப்பீட்டைக் காட்டுகின்றன. மொழிபெயர்ப்பு இந்தப் பதற்றத்தைப் பாதுகாக்கிறது; உரை கூறாத மேலதிக முடிவைச் சேர்ப்பதில்லை.
- issue: அரசர்கள் நூலிலுள்ள யெரொபெயாமின் பாவங்கள்
  choice: உரையில் உள்ள பொதுவான ‘பாவங்கள்’ என்ற சொல்லை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: முதன்மை உரையிலேயே அவற்றை உருவவழிபாடு அல்லது கன்றுக்குட்டி வழிபாடு என்று விளக்குதல்
  rationale: சூழல் அவற்றின் வழிபாட்டு அமைப்பைச் சுட்டினாலும், இவ்வசனம் தானாக விவரங்களைத் தரவில்லை. எனவே விளக்கம் அடிக்குறிப்பில் மட்டும் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்தியுள்ளது. ‘நடக்க’ என்ற எபிரெய நடத்தை உருவகம் பாதுகாக்கப்படுகிறது; அதேவேளை ‘திருச்சட்டத்தின்படி’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
