translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறுத்துக் கொன்றார்கள்’ மூலவினையின் கடுமையை மறைக்காமல் தருகிறது. பன்மை எழுவாயிலிருந்து இறுதி வாக்கியத்தின் ஒருமை எழுவாயான யெகூவுக்கு மாறுவது மூலத்தைப் பின்பற்றி ‘அவர்கள்/அவன்’ எனத் தெளிவாகக் காக்கப்பட்டுள்ளது.
