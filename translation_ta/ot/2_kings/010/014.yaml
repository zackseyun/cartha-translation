  naturalness: ‘பெத்-ஏகேத்தின் குழியருகே’ என்பது உடைமையுறவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ். தேவையற்ற ‘அந்த’ நீக்கப்பட்டுள்ளது. அடிக்குறிப்பு b-யில் ‘பெயர்ச்சொல்’ என்பதற்குப் பதிலாக இடப்பெயர்/சிறப்புப்பெயர் என்ற துல்லியமான சொல் பயன்படுத்தப்பட்டுள்ளது.
  terminology: ‘அறுத்துக் கொன்றார்கள்’ שׁחט வினையின் வலிமையைப் பாதுகாக்கிறது. ‘பெத்-ஏகேத்’ இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. ‘குழி’ என்பது בּוֹר-க்கு பொருத்தமான நடுநிலைச் சொல்; ‘குழிக்குள்’ மற்றும் ‘குழியண்டையில்’ என்ற மாற்றுகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
