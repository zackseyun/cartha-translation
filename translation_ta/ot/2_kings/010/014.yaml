base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: ta
  text: அவன், “அவர்களை உயிரோடு பிடியுங்கள்” என்றான். அவர்களும் அவர்களை உயிரோடு பிடித்து, பெத்-ஏகேத்தின் குழியருகே[a] நாற்பத்திரண்டு ஆண்களையும் அறுத்துக் கொன்றார்கள். அவர்களில் ஒருவனையும் அவன் மீதியாக விடவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குழிக்குள்” அல்லது “குழியண்டையில்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய முன்னிடைச்சொல் ஒன்றுக்கு மேற்பட்ட இடஞ்சார்ந்த பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “அவர்களில் ஓர் ஆணையும் அவன் மீதியாக விடவில்லை”; ஒருவர்கூட உயிர்தப்பவில்லை என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: அவர்களைப் பிடியுங்கள்
  rationale: תפשׂ என்பது இச்சூழலில் ஒருவரைக் கைப்பற்றுதல் அல்லது பிடித்தல் என்பதைக் குறிக்கிறது. அடுத்து வரும் ‘உயிரோடு’ என்பதுடன் ‘பிடியுங்கள்’ இயல்பாக இணைகிறது.
- source_word: חַיִּים
  choice: உயிரோடு
  rationale: இங்கு இச்சொல் வினையடைப் பொருளில் வந்து, உடனே கொல்லாமல் உயிருடன் பிடிக்க வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: וַיִּשְׁחָטוּם
  choice: அறுத்துக் கொன்றார்கள்
  rationale: שׁחט என்பது பொதுவான ‘கொல்லுதல்’ என்பதைவிட வலிமையான, அறுத்துக் கொல்லும் செயலைக் குறிக்கிறது; நிகழ்வின் கொடூரத்தையும் மூலத்தின் குறிப்புத்தன்மையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: אֶל־בּוֹר
  choice: கிணற்றருகே
  rationale: אֶל என்னும் முன்னிடைச்சொல் இங்கு குழி அல்லது கிணற்றை நோக்கிய, அதன் அருகிலுள்ள இடத்தைக் குறிக்கலாம். தமிழில் இச்சூழலுக்கு ‘கிணற்றருகே’ இயல்பானது; ‘கிணற்றுக்குள்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֵּית עֵקֶד
  choice: பெத்-ஏகேத்
  rationale: இது இங்கு இடப்பெயராகச் செயல்படுவதால், அதன் சாத்தியமான சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: நாற்பத்திரண்டு ஆண்கள்
  rationale: אִישׁ ஆண்களைக் குறிக்கிறது; எண்ணிக்கையுடன் கூடிய மூலத்தின் பாலினக் குறிப்பைத் தமிழிலும் காக்கிறது.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: அவர்களில் ஒருவனையும் அவன் விட்டுவைக்கவில்லை
  rationale: ஒருமை வினையின் எழுவாய் யெகூ என்பதை ‘அவன்’ காக்கிறது. ‘ஒருவனையும் … விட்டுவைக்கவில்லை’ என்பது ஒருவர்கூட எஞ்சவில்லை என்ற முழுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
