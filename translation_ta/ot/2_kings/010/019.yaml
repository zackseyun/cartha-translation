base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: ta
  text: “இப்போது பாகாலின் தீர்க்கதரிசிகள் அனைவரையும், அவனை வழிபடுகிறவர்கள் அனைவரையும், அவனுடைய பூசாரிகள் அனைவரையும் என்னிடம் வரவழையுங்கள். ஒருவரும் வராமல் இருக்கக்கூடாது; ஏனெனில், நான் பாகாலுக்குப் பெரிய பலி செலுத்தப்போகிறேன். வராத எவரும் உயிரோடு இருக்கமாட்டார்கள்” என்றான். ஆனால் பாகாலை வழிபடுகிறவர்களை அழித்துப்போடுவதற்காக யெகூ வஞ்சகமாக[a] இப்படிச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூழ்ச்சியாக” / “தந்திரமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: எபிரெயச் சொல்லில் வெளிப்படையாக உள்ள காலக் குறிப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: נְבִיאֵי הַבַּעַל
  choice: பாகாலின் தீர்க்கதரிசிகள்
  rationale: இணைப்புச் சொல்லமைப்பையும் வழிபாட்டுச் சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: עֹבְדָיו
  choice: அவனை வழிபடுகிறவர்கள்
  rationale: עבד என்பதன் வழிபாட்டுச் சூழலிலான பொருளைத் தெளிவாக்குகிறது; வெறும் பணியாளர்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: כֹּהֲנָיו
  choice: அவனுடைய பூசாரிகள்
  rationale: பாகாலின் வழிபாட்டுச் சடங்குகளை நடத்தும் மத அலுவலர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: קִרְאוּ אֵלַי
  choice: என்னிடம் அழைத்து வாருங்கள்
  rationale: யெகூவின் முன்னிலையில் அவர்களை வரவழைக்கும்படியான பன்மை கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: ஒருவரும் வராமல் இருக்கக்கூடாது
  rationale: פקד என்பதன் இச்சூழலிலான ‘காணாமற்போதல்/வராமல் இருத்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; אִישׁ இங்கு ஒவ்வொருவரையும் பொதுவாகக் குறிக்கிறது.
- source_word: זֶבַח גָּדוֹל
  choice: பெரிய பலி
  rationale: பலியிடுதலைக் குறிக்கும் זבח என்பதையும் அதன் அளவு அல்லது முக்கியத்துவத்தைக் குறிக்கும் גָּדוֹל என்பதையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: வராத எவரும் உயிரோடு இருக்கமாட்டார்கள்
  rationale: முந்தைய פקד என்பதற்கான ‘வராமல் இருத்தல்’ என்ற பொருளைத் தொடர்ந்து வைத்து, அச்சுறுத்தலின் கடுமையையும் காக்கிறது.
- source_word: בְעָקְבָּה
  choice: வஞ்சகமாக
  rationale: ஏமாற்றுதல் அல்லது சூழ்ச்சியுடன் செயல்படுதல் என்ற சொல்லின் எதிர்மறையான கதையாளர் மதிப்பீட்டைச் சுருக்கமாகத் தருகிறது.
- source_word: לְמַעַן הַאֲבִיד
  choice: அழித்துப்போடுவதற்காக
  rationale: לְמַעַן நோக்கத்தையும் אבד என்பதன் காரணவினை வலிமையையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யெகூவின் செயலுக்கான கதையாளரின் மதிப்பீடு
  choice: யெகூ வஞ்சகமாக இப்படிச் செய்தான்
  alternative: யெகூ தந்திரமாக இப்படிச் செய்தான்
  rationale: மூலத்தின் בְעָקְבָּה அவரது செயலை வெறும் திறமையான திட்டமாக அல்லாமல் ஏமாற்றுச் செயலாகவும் குறிக்கக்கூடும். அந்த அறநெறி மற்றும் கதைத் தளர்வை மென்மைப்படுத்தாமல் காக்கிறது.
- issue: אִישׁ என்ற ஒருமை ஆண்பால் வடிவத்தின் பொதுப்பயன்பாடு
  choice: ஒருவரும் வராமல் இருக்கக்கூடாது
  alternative: ஒரு மனிதன்கூட வராமல் இருக்கக்கூடாது
  rationale: இங்கு ஆண்களைக் குறிக்கும் வடிவம் ஒவ்வொரு நபரையும் பொதுவாகச் சுட்டுகிறது. ‘ஒருவரும்’ என்பது அதன் விநியோகப் பொருளை இயல்பான தமிழில் காக்கிறது; தேவையற்ற பாலின வலியுறுத்தலைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாகால் என்ற பெயரும் யெகூ என்ற பெயரும் வழக்கமான தமிழ் வேதாகமப் பெயர்ப்பெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளன. மேற்கோள் உரையும் கதையாளரின் விளக்கமும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
