base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: ta
  text: அரண்மனைப் பொறுப்பாளரும் நகரப் பொறுப்பாளரும், மூப்பர்களும் அரச குமாரர்களின் பராமரிப்பாளர்களும்[a] யெகூவுக்குச் செய்தி அனுப்பி, “நாங்கள் உமது பணியாளர்கள். நீர் எங்களுக்குச் சொல்வதையெல்லாம் செய்வோம். யாரையும் அரசனாக்க மாட்டோம். உமது பார்வைக்கு நல்லதெனப்படுவதைச் செய்யும்” என்று கூறினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வளர்ப்புத் தந்தைகள்” அல்லது “பாதுகாவலர்கள்” என்றும் மொழிபெயர்க்கலாம். ஆகாபின் அரச குமாரர்களைப் பராமரிக்கும் பொறுப்பு ஒப்படைக்கப்பட்டவர்களை எபிரேயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: அரண்மனைப் பொறுப்பாளர்
  rationale: அரச வீட்டின் நிர்வாகப் பொறுப்பில் இருந்த அதிகாரியைச் சுட்டும் எபிரேயச் சொற்றொடரை, அரசச் சூழலுக்கேற்ற தெளிவான தமிழில் வழங்குகிறது.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: நகரப் பொறுப்பாளர்
  rationale: குறிப்பிட்ட அதிகாரப் பட்டத்தை ஊகிக்காமல், நகரத்தின் மேற்பார்வை வகித்த அலுவலைப் பாதுகாக்கிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: சமூக மற்றும் அரசியல் தலைமைப் பங்கு வகித்தவர்களைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: הָאֹמְנִים
  choice: அரச குமாரர்களின் பராமரிப்பாளர்கள்
  rationale: முந்தைய வசனத்தின் சூழலில் ஆகாபின் அரச குமாரர்கள் இவர்களிடம் ஒப்படைக்கப்பட்டிருந்தனர்; ‘பராமரிப்பாளர்கள்’ வளர்ப்போர் அல்லது பாதுகாவலர் ஆகிய இரு நிழற்பொருள்களையும் உள்ளடக்குகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: இங்கு அடிமைநிலையை வலியுறுத்தாமல், அரசியல் பணிவையும் கீழ்ப்படிதலையும் வெளிப்படுத்தும் சுயவிளக்கம்.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: நீர் எங்களுக்குச் சொல்வதையெல்லாம் செய்வோம்
  rationale: கீழ்ப்படிதலின் நேரடியான உறுதிமொழியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: யாரையும் அரசனாக்க மாட்டோம்
  rationale: מלך என்பதன் காரணவினைப் பொருளான ஒருவரை ஆட்சியில் அமர்த்துதலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: உமது பார்வைக்கு நல்லதெனப்படுவது
  rationale: ‘உமது கண்களில் நல்லது’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தைப் பெருமளவு காத்து, தமிழில் புரியத்தக்கவாறு அமைக்கிறது.
- source_word: עֲשֵׂה
  choice: செய்யும்
  rationale: செய் என்ற சுருக்கமான கட்டளையை, மரியாதைப் பன்மை ஒருமை விகுதியுடன் இயல்பான தமிழில் வழங்குகிறது.
