base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: ta
  text: அவன் சமாரியாவுக்கு வந்தபோது, சமாரியாவில் ஆகாபைச் சேர்ந்த எஞ்சியிருந்த அனைவரையும், அவர்களை முற்றிலும் அழித்தொழிக்கும் வரை கொன்றான்[a]. இது யாவே எலியாவிடம் உரைத்திருந்த வார்த்தையின்படியே நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவனை’ அல்லது ‘அதை முற்றிலும் அழித்தொழிக்கும் வரை.’ எபிரெய வினைச்சொல்லின் பின்னொட்டு ஒருமையில் உள்ளது; அது ஆகாபையையோ, ஆகாபின் வீட்டாரை ஒரு கூட்டாகவோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: அவன் சமாரியாவுக்கு வந்தபோது
  rationale: தொடர்கதை அமைப்பிலுள்ள waw-consecutive-ஐ இயல்பான தமிழில் காலத் தொடர்பாக வெளிப்படுத்துகிறது; எழுவாயை எபிரெய உரையைப் போல மூன்றாம் நபர் சுட்டுப்பெயராகவே வைத்திருக்கிறது.
- source_word: וַיַּךְ
  choice: வெட்டிக் கொன்றான்
  rationale: இந்தச் சூழலில் נכה உயிரைப் பறிக்கும் வன்முறையைக் குறிக்கிறது. ‘தாக்கினான்’ என்பதைக் காட்டிலும் முடிவைத் தெளிவாகவும், ‘அடித்து வீழ்த்தினான்’ என்பதைக் காட்டிலும் இயல்பாகவும் கூறுகிறது.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: ஆகாபைச் சேர்ந்தவர்களில் எஞ்சியிருந்த அனைவரையும்
  rationale: לְ குறிக்கும் உறவு அல்லது சார்பைத் தெளிவாக வெளிப்படுத்துகிறது; ‘மீதியானோர்’ என்ற இறையியல் நுண்ணுணர்வை தேவையின்றி ஏற்றாமல், எஞ்சியிருந்த நபர்களைக் குறிக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டையும், மூலத்தில் வரும் ‘சமாரியா’ என்ற பெயரின் மறுமுறையையும் காக்கிறது.
- source_word: עַד הִשְׁמִידוֹ
  choice: அவர்களை முற்றிலும் அழித்தொழித்தான்[a]
  rationale: שׁמד-இன் முழுமையான அழிவு உணர்வை ‘முற்றிலும் அழித்தொழித்தான்’ வெளிப்படுத்துகிறது. எபிரெய ஒருமை பின்னொட்டின் சாத்தியமான கூட்டுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே ... உரைத்திருந்த வார்த்தையின்படியே
  rationale: דבר என்பதன் தீர்க்கதரிசன நிறைவேற்றச் சூத்திரத்தை ‘வார்த்தை’ காக்கிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: எலியாவிடம் உரைத்திருந்த
  rationale: முன்னரே உரைக்கப்பட்ட தீர்க்கதரிசன வார்த்தை இப்போது நிறைவேறுவதால், தமிழில் இறந்தகால முன்நிலையை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் அதன் பரவலான ஒலிப்புக்கு நெருக்கமாக வழங்குகிறது.
- issue: עַד הִשְׁמִידוֹ என்பதிலுள்ள ஒருமை பின்னொட்டின் குறிப்பு
  choice: முதன்மை உரையில் ‘அவர்களை’ என்று இயல்பாக வழங்கி, ஒருமை வடிவத்தை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: ‘அவனை அழித்தொழிக்கும் வரை’ அல்லது ‘அதை அழித்தொழிக்கும் வரை’
  rationale: அருகிலுள்ள நேரடி பொருள் பன்மையில் உள்ள மனிதர்களைக் குறித்தாலும், எபிரெய பின்னொட்டு ஒருமையில் உள்ளது; அது ஆகாபையோ ஆகாபின் வீட்டாரை ஒரு கூட்டலகாகவோ குறிக்கக்கூடும். பொருள் தெளிவையும் மூலத்தின் உண்மையான தெளிவின்மையையும் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சமாரியா’ என்ற இடப்பெயர் மூலத்தைப் போல இருமுறை வைக்கப்பட்டுள்ளது. வன்முறையின் தன்மை மென்மையாக்கப்படவில்லை; அதேவேளை தேவையற்ற விரிவுரையும் சேர்க்கப்படவில்லை.
