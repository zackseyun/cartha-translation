source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֔א וַ/יֵּ֖לֶךְ שֹׁמְר֑וֹן ה֛וּא בֵּֽית עֵ֥קֶד הָרֹעִ֖ים בַּ/דָּֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: ta
  text: பின்பு அவன் எழுந்து புறப்பட்டு, சமாரியாவுக்குச் சென்றான். வழியில் அவன் மேய்ப்பர்களின் பேத்-ஏகேதில்[a] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேத்-ஏகேத்” என்பதற்கு ஏறத்தாழ “கூடுகையின் வீடு” என்று பொருள் இருக்கலாம்; வேறு விளக்கங்களில், மேய்ப்பர்கள் ஆடுகளின் மயிர் கத்தரிக்கும் அல்லது கட்டும் இடத்துடன் இப்பெயர் தொடர்புபடுத்தப்படுகிறது. எபிரெய உரையில் இதை ஓர் இடப்பெயராகக் கருதுவதே சிறந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: பின்பு அவன் எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் அடுத்தடுத்த கதை நிகழ்வைக் குறிக்கிறது; ‘எழுந்து’ என்பது அதன் அடிப்படைச் செயற்பொருளையும் எபிரெயக் கதைநடையையும் காக்கிறது.
- source_word: וַיָּבֹא
  choice: புறப்பட்டு
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். தொடர்ந்து வரும் பயண இலக்குடன் இயல்பாக இணைவதற்கும் வினைச்சொல் மீளுரைப்பைத் தவிர்ப்பதற்கும் இங்கு ‘புறப்பட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיֵּלֶךְ שֹׁמְרוֹן
  choice: சமாரியாவை நோக்கிச் சென்றான்
  rationale: הלך உடன் வரும் இடப்பெயர் சமாரியாவை இலக்காகக் கொண்ட இயக்கத்தைக் குறிக்கிறது. எபிரெயத்தில் திசையைக் குறிக்கும் முன்னிடைச்சொல் வெளிப்படையாக இல்லாததால், சென்றடைந்தான் என்று கூறாமல் ‘நோக்கிச் சென்றான்’ என வழங்குவது கவனமான மொழிபெயர்ப்பு.
- source_word: הוּא
  choice: அவன் ... இருந்தான்
  rationale: தனி ஆண்பால் சுட்டுப்பெயர் இங்கு அடுத்த இடநிலைக் கூற்றின் எழுவாயாகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘அவன் ... இருந்தான்’ என வழங்கப்பட்டுள்ளது.
- source_word: בֵּית עֵקֶד
  choice: பேத்-ஏகேத்
  rationale: இது ஓர் இடப்பெயராகச் செயல்படுகிறது. עקד என்பதன் பெயர்ப்பொருள் உறுதியற்றதால், முதன்மை உரையில் பொருள் மொழிபெயர்ப்பைத் திணிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָרֹעִים
  choice: மேய்ப்பர்களின்
  rationale: רֹעִים என்பதன் நேரடியான பொருள் ‘மேய்ப்பர்கள்’; முழு இடப்பெயரின் துல்லிய அமைப்பு விவாதத்திற்குரியதாக இருந்தாலும், எளிய உடைமைத் தொடர்பை இது காக்கிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: இந்தச் சொற்றொடர் பயணப்பாதையில் அந்த இடம் அமைந்திருந்ததையோ அங்கே நிகழ்ந்த இடைநிலையையோ குறிக்கிறது; ‘வழியில்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
