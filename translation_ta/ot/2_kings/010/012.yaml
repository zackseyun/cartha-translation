  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் எபிரெய வினைகள் தமிழில் இயல்பாக ‘எழுந்து புறப்பட்டு ... சென்றான்’ என இணைக்கப்பட்டுள்ளன. உரையிலுள்ள உண்மையான திசை மற்றும் இடப்பெயர் ஐயங்கள் மிகைப்படுத்தித் தீர்க்கப்படவில்லை.
