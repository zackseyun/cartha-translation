translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசவைக் சூழலில் רָצִים என்பதன் பணியைத் தெளிவாக்க ‘மெய்க்காவலர்கள்’ என்றும், உறுதியற்ற கோவில் கட்டிடச் சொல்லை முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் மாற்றுகளுடனும் வழங்கப்பட்டுள்ளது.
