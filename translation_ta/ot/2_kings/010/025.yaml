base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: ta
  text: அவன் தகனபலியைச் செலுத்தி முடித்தபோது, யெகூ மெய்க்காவலர்களிடமும் படைத்தலைவர்களிடமும், “உள்ளே சென்று அவர்களை வெட்டி வீழ்த்துங்கள்; ஒருவனும் வெளியே வரக்கூடாது” என்றான். அவர்கள் அவர்களை வாளால் வெட்டி வீழ்த்தினார்கள். பிறகு மெய்க்காவலர்களும் படைத்தலைவர்களும் அவர்களைத் தூக்கி எறிந்துவிட்டு, பாகால் கோவிலின் உட்பகுதி[a] வரை சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பாகால் கோவிலின் நகரம்” அல்லது “கோட்டைப் பகுதி.” இது கோவில் வளாகத்திலிருந்த பாதுகாப்பான உட்பகுதியையோ புனித உட்பகுதியையோ குறிக்கலாம்.
    reason: עִיר பொதுவாக ‘நகரம்’ என்று பொருள்படும்; ஆனால் இந்தக் கடினமான கட்டிடவியல் சொற்றொடரில் அது கோட்டைப் பகுதியையோ உட்பகுதியையோ குறிக்கலாம். துல்லியமான குறிப்பு உறுதியற்றது.
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: அவன் தகனபலியைச் செலுத்தி முடித்தபோது
  rationale: כְּ + infinitive construct marks the time when the preceding action was completed; ‘தகனபலி’ preserves the specific sacrificial term עֹלָה, while ‘செலுத்தி முடித்தபோது’ is natural Tamil.
- source_word: לָרָצִים
  choice: மெய்க்காவலர்களிடம்
  rationale: רָצִים literally denotes ‘runners’ but commonly refers in royal narratives to the king’s guard or attendants. ‘மெய்க்காவலர்கள்’ conveys their function clearly in modern Tamil without the misleading literal ‘ஓட்டக்காரர்கள்’.
- source_word: לַשָּׁלִשִׁים
  choice: படைத்தலைவர்களிடம்
  rationale: שָׁלִישׁ denotes a military officer, possibly originally a chariot officer or adjutant. ‘படைத்தலைவர்கள்’ preserves the military role without assigning an uncertain precise rank.
- source_word: בֹּאוּ
  choice: உள்ளே சென்று
  rationale: The command directs the armed men into the temple area. ‘உள்ளே சென்று’ expresses the contextual direction naturally in Tamil.
- source_word: הַכּוּם
  choice: அவர்களை வெட்டி வீழ்த்துங்கள்
  rationale: נכה here has lethal force. ‘வெட்டி வீழ்த்துங்கள்’ retains the physical and military force of the command rather than reducing it to a result-only verb.
- source_word: אִישׁ אַל־יֵצֵא
  choice: ஒருவனும் வெளியே வரக்கூடாது
  rationale: The singular אִישׁ under negation is distributive. ‘ஒருவனும்’ reflects the source’s masculine singular form and the likely male participants.
- source_word: לְפִי חָרֶב
  choice: வாளால் வெட்டி வீழ்த்தினார்கள்
  rationale: The Hebrew idiom is literally ‘by the mouth/edge of the sword.’ Tamil naturally incorporates the sword and cutting force into the verbal expression.
- source_word: וַיַּשְׁלִכוּ
  choice: அவர்களை வெளியே எறிந்துவிட்டு
  rationale: The verb means ‘throw/cast’; the victims are the contextually supplied object. ‘வெளியே’ conveys the likely disposal movement while retaining the force of the verb.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: பாகால் கோவிலின் உட்பகுதி வரை
  rationale: 'The surface phrase is difficult: עִיר normally means ‘city’ and may here denote a citadel-like or inner area within the temple complex. ‘உட்பகுதி’ fits the immediate architectural movement without presenting a disputed reconstruction as certain; the ambiguity is retained in a footnote.'
