  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: ta
  text: யெகூ தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவனைச் சமாரியாவில் அடக்கம் செய்தார்கள். அவனுடைய மகன் யோவாகாஸ் அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். சொற்சொல்லாக, “தன் தந்தையரோடு படுத்தான்.”
    reason: மூலமொழியின் உருவகத்தை வாசகர் அறியச் செய்வதோடு, முதன்மை உரையில் இயல்பான நவீன தமிழை வழங்குகிறது.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்’; அரசர்களின் மரணக் குறிப்புகளில் இது மரணத்தைக் குறிக்கும் மரபுத்தொடராக வருகிறது. ‘துயிலடைந்தான்’ என்பது அந்த உருவகத்தைத் தக்கவைத்தபடியே தமிழில் மரணக் குறிப்பாக இயல்பாகப் புரிகிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: எபிரெய மரபுத்தொடரின் வம்சாவளி சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது. ‘தன் தந்தையரோடு’ என்பது சொற்சொல்லானாலும், ஒருவரின் நேரடி தந்தையரை மட்டும் குறிப்பதாகத் தவறாகப் புரியக்கூடும்.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை வினை உள்ளது. செய்பவர்களை ஊகித்துச் சேர்க்காமல் அதன் செயப்பாட்டு அமைப்பைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; ‘சமாரியாவில்’ என்பது இயல்பான தமிழ் இடவெற்றுமை வடிவம்.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இந்த அரசுரிமைத் தொடர்ச்சிக் குறிப்பில் מלך ஆட்சிக்காலம் முழுவதையும் அல்லாமல் அரசனாகப் பதவியேற்ற மாற்றத்தைக் குறிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசரின் இடத்தை மகன் ஏற்று அரசனானதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்; எபிரெயப் பெயரின் ஒலியையும் அண்மையாகக் காட்டுகிறது.
- source_word: יְהוֹאָחָז
  choice: யோவாகாஸ்
  rationale: தமிழ் வாசகர்களிடையே நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
