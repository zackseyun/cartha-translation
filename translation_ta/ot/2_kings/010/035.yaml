translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மதிப்புமிக்க வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மரணத்தைக் குறிக்கும் எபிரெய உருவகம் ‘துயிலடைந்தான்’ எனத் தக்கவைக்கப்பட்டு, அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
