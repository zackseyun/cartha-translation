revisions:
- from: யோர்தானிலிருந்து கிழக்கே இருந்த கீலேயாத் நாடு முழுவதையும்—காதியர், ரூபனியர், மனாசேயர் ஆகியோரின் பகுதிகளையும்—அர்னோன் பள்ளத்தாக்கின்[a] அருகிலுள்ள அரோவேர் தொடங்கி, கீலேயாத் மற்றும் பாசான் வரையிலும் கைப்பற்றினார்.
  to: 'ஹசாயேல் இஸ்ரவேலின் நிலப்பரப்பைக் குறைக்கத் தொடங்கினார்: யோர்தானுக்குக் கிழக்கே உள்ள கீலேயாத் நாடு முழுவதையும்—காதியர், ரூபனியர், மனாசேயர் ஆகியோரின் பகுதிகளையும்—அர்னோன் பள்ளத்தாக்கில் அமைந்துள்ள அரோவேர் தொடங்கி, கீலேயாத் மற்றும் பாசான் வரையிலும்.'
  rationale: 'The principal correction restores the action and subject that the Hebrew grammar carries forward from the preceding verse: Hazael began to reduce Israel’s territory. The territorial list, tribal references, boundary point, and additive ending are retained. The footnote’s lexical alternatives remain appropriate, but its anchor is omitted because the revised wording does not include a footnote marker; to retain the required anchor, the text should carry [a] immediately after “அர்னோன் பள்ளத்தாக்கில்.”'
