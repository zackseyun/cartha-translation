    text: ‘அர்னோன் நீரோடைப் படுகை’ அல்லது ‘அர்னோன் ஓடை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பள்ளத்தாக்கு, வற்றிய ஓடை அல்லது நீரோடைப் படுகையைக் குறிக்கலாம்.
