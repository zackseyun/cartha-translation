base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: ta
  text: 'ஹசாயேல் இஸ்ரவேலின் நிலப்பரப்பைக் குறைக்கத் தொடங்கினார்: யோர்தானுக்குக் கிழக்கே உள்ள கீலேயாத் நாடு முழுவதையும்—காதியர், ரூபனியர், மனாசேயர் ஆகியோரின் பகுதிகளையும்—அர்னோன் பள்ளத்தாக்கில் அமைந்துள்ள அரோவேர் தொடங்கி, கீலேயாத் மற்றும் பாசான் வரையிலும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: யோர்தானிலிருந்து கிழக்கே இருந்த
  rationale: மொழிபெயர்த்தால் சொற்சொல்லாக ‘யோர்தானிலிருந்து சூரியன் உதிக்கும் திசையில்’ என வரும்; புவியியல் சூழலில் ‘கிழக்கே’ என்பது இயல்பான நவீனத் தமிழ். מִן குறிக்கும் எல்லைத் தொடக்கமும் ‘யோர்தானிலிருந்து’ என்பதால் தக்கவைக்கப்படுகிறது.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: கீலேயாத் நாடு முழுவதையும்
  rationale: אֵת முன் வசனத்திலுள்ள செயப்பாட்டின் நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; כָּל אֶרֶץ என்பதன் முழுமையான பரப்பை ‘நாடு முழுவதையும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: காதியர், ரூபனியர், மனாசேயர் ஆகியோரின் பகுதிகளையும்
  rationale: இந்த ஒருமை வடிவ இனப்பெயர்கள் ஒவ்வொரு கோத்திரக் குழுவையும் கூட்டாகக் குறிக்கின்றன. நிலப்பரப்புப் பட்டியலின் சூழலில் ‘ஆகியோரின் பகுதிகள்’ என்பது தமிழ் வாசகருக்குத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: מֵעֲרֹעֵר
  choice: அரோவேர் தொடங்கி
  rationale: מִן தெற்கு எல்லையின் தொடக்கப் புள்ளியைக் குறிக்கிறது; இடப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கின் அருகிலுள்ள
  rationale: עַל இங்கு இடத்தொடர்பில் ‘அருகில்’ எனப் புரிந்துகொள்ளப்படுகிறது. נַחַל என்பது பள்ளத்தாக்கு, நீரோடைப் படுகை அல்லது வற்றிய ஓடை எனப் பொருள்படக்கூடியதால், முதன்மை உரையில் புவியியல் பெயராக இயல்பான ‘பள்ளத்தாக்கு’ பயன்படுத்தப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: கீலேயாத் மற்றும் பாசான் வரையிலும்
  rationale: எபிரெய இணைப்புச் சொல் எளிய சேர்க்கையாகவே மொழிபெயர்க்கப்படுகிறது. எல்லைப் பரப்பை விவரிக்கும் தமிழ் வாக்கியத்தில் ‘வரையிலும்’ இயல்பாக நிறைவு தருகிறது; ‘மேலும்’ அல்லது ‘ஏன், ...கூட’ போன்ற மேலதிக வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: முன் வசனத்திலிருந்து தொடரும் செயப்பாடு
  choice: கைப்பற்றினார்
  alternative: வினையின்றி நேரடிச் செயப்படுபொருள் பட்டியலாக விடுதல்
  rationale: எபிரெய உரையில் இந்த வசனம் 32ஆம் வசனத்திலுள்ள ‘வெட்டிக் குறைக்கத் தொடங்கினார்/தாக்கிக் கைப்பற்றினார்’ என்ற செயப்பாட்டை இலக்கண ரீதியாகத் தொடர்கிறது. தனியே வாசிக்கப்படும் வசனமாக தமிழில் முழுமை பெற, சூழலில் விளையும் ‘கைப்பற்றினார்’ சேர்க்கப்பட்டது; இது புதிய இறையியல் விளக்கத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதே நேரத்தில் வேதாகம வரலாற்று நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கோத்திரப் பெயர்கள் கூட்டுப் பொருளில் இயல்பாக அமைக்கப்பட்டுள்ளன; இடப்பெயர்கள் பரவலாகப் பயன்படும் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
