base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: ta
  text: அப்போது அவன், “என்னுடன் வா; யாவேக்கான என் தீவிர ஆர்வத்தைப் பார்[a]” என்றான். பின்பு அவர்கள் அவனை அவனுடைய தேரில் ஏற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கான என் பொறாமையைப் பார்.” எபிரெயச் சொல் சூழலுக்கேற்ப ‘தீவிர ஆர்வம்’ அல்லது ‘பொறாமை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: என்னுடன் வா
  rationale: הלך என்பதன் கட்டளை வடிவம் இங்கு அழைப்பாகப் பயன்படுகிறது; אִתִּי உடன்செல்லுதலைக் குறிக்கிறது. இயல்பான தமிழில் நேரடியான அழைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּרְאֵה
  choice: பார்
  rationale: ראה என்பதன் கட்டளை வடிவத்தின் நேரடித்தன்மையைப் பேணுகிறது; ‘சாட்சியாக இரு’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
- source_word: בְּקִנְאָתִי
  choice: எனக்குள்ள வைராக்கியத்தை
  rationale: קִנְאָה என்பது சூழலுக்கேற்ப வைராக்கியம் அல்லது பொறாமை எனப் பொருள்படும். யெகோவாவுக்கான தீவிர ஈடுபாட்டைப் பற்றிய கூற்றாக இருப்பதால் ‘வைராக்கியம்’ முதன்மை உரைக்கு இயல்பானது; மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: לְ இங்கு வைராக்கியத்தின் நோக்கைச் சுட்டுகிறது. יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் அறியப்பட்ட ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: அவர்கள் அவனை ... ஏற்றிக்கொண்டார்கள்
  rationale: רכב என்பதன் ஹிஃபில் வடிவம் ‘ஏறச் செய்தல்/ஏற்றுதல்’ என்ற காரணவினைப் பொருளுடையது. பன்மை வினைச்சொல்லின் வெளிப்படையான ‘அவர்கள்’ பேணப்பட்டுள்ளது.
- source_word: בְּרִכְבּוֹ
  choice: அவனுடைய தேரில்
  rationale: רֶכֶב இச்சூழலில் தேரைக் குறிக்கிறது; மூன்றாம் நபர் ஒருமை உடைமை விகுதி இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக தனிப்பெயரைப் பேணுவதற்காக, தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- issue: יֵהוּ கூறும் קִנְאָה என்பதன் மதிப்பீடு
  choice: ‘வைராக்கியம்’ என மொழிபெயர்த்து, அது அவனுடைய கூற்று என்பதைக் கதையமைப்பிலேயே விடுதல்
  alternative: அதை நீதியான பக்தி அல்லது பொறாமை என வெளிப்படையாக மதிப்பிடுதல்
  rationale: எபிரெயச் சொல் தீவிர வைராக்கியத்தையும் பொறாமையையும் குறிக்கலாம். வசனம் யேகூவின் கூற்றைத் தருகிறது; உரை நேரடியாக வழங்காத தார்மீக அல்லது இறையியல் அங்கீகாரத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கட்டளைத் தொனியும் பன்மை எழுவாயும் பேணப்பட்டுள்ளன. ‘தேரில் ஏற்றிக்கொண்டார்கள்’ என்பது காரணவினையின் பொருளை இயல்பான தமிழில் தருகிறது.
