  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: ta
  text: அவன் அங்கிருந்து தொடர்ந்து சென்று, தன்னை எதிர்கொண்டு வந்த ரேகாபின் மகன் யோனதாபைக் கண்டான். அவனை வாழ்த்தி[a], “என் உள்ளம் உன் உள்ளத்தோடு இருப்பதுபோல், உன் உள்ளம் நேர்மையாக இருக்கிறதா?”[b] என்று கேட்டான். அதற்கு யோனதாப், “ஆம், ஆம்”[c] என்றான். அப்போது யெகூ, “உன் கையைக் கொடு” என்றான். யோனதாப் தன் கையைக் கொடுத்ததும், யெகூ அவனைத் தன்னோடு தேரில் ஏற்றிக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை ஆசீர்வதித்தான்.” இங்குள்ள எபிரெய வினைச்சொல் “ஆசீர்வதித்தல்” என்றும் பொருள்படும்; ஆனால் இந்தச் சந்திப்புச் சூழலில் அது வாழ்த்து அல்லது வணக்கம் கூறுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “என் உள்ளம் உன் உள்ளத்தோடு இருப்பதுபோல், உன் உள்ளம் நேர்மையாக இருக்கிறதா?” இந்தச் சொற்றொடர் பரஸ்பரப் பற்றுறுதி அல்லது நோக்க ஒருமைப்பாட்டைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “இருக்கிறது, இருக்கிறது”—வலியுறுத்திய உறுதிமொழி.
    reason: lexical_alternative
