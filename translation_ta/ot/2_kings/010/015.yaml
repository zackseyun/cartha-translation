translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உள்ளம்’ என்ற மூல உருவகமும் அதன் உறவு சார்ந்த திட்டமிட்ட தெளிவின்மையும் காக்கப்பட்டுள்ளன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ‘ரேகாப்’, ‘யோனதாப்’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
