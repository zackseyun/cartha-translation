- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: அவன் அங்கிருந்து தொடர்ந்து சென்று
  rationale: הלך உடன் מִשָּׁם முந்தைய இடத்திலிருந்து கதையின் இயக்கம் தொடர்வதைக் குறிக்கிறது; ‘தொடர்ந்து சென்று’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן־רֵכָב
  choice: ரேகாபின் மகன் யோனதாபைக் கண்டான்
  rationale: מצא என்பதன் அடிப்படைப் பொருளான ‘கண்டான்’ என்பதைக் காத்து, சந்திப்பு என்ற சூழலை மிகையாக விளக்கவில்லை.
- source_word: לִקְרָאתוֹ
  choice: தன்னைச் சந்திக்க வந்துகொண்டிருந்த
  rationale: எதிர்கொண்டு சந்திப்பதற்கான இயக்கத்தை இச்சொற்றொடர் குறிக்கிறது; யோனதாப் அணுகிவந்ததைத் தமிழ் தெளிவாக்குகிறது.
- source_word: וַיְבָרְכֵהוּ
  choice: அவனை வாழ்த்தி
  rationale: ברך என்பதற்கு ‘ஆசீர்வதித்தல்’ என்றும் பொருள் உண்டு; இச்சந்திப்புச் சூழலில் வணக்கம் அல்லது வாழ்த்து கூறுதலை ‘வாழ்த்தி’ இயல்பாகக் காட்டுகிறது.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר
  choice: உன் உள்ளம் நேர்மையாக இருக்கிறதா?
  rationale: לֵבָב உள்ளார்ந்த மனநிலை அல்லது பற்றுறுதியையும், יָשָׁר நேரான அல்லது நேர்மையான நிலையையும் குறிக்கின்றன; உருவகத்தை ‘உள்ளம்’ எனக் காத்துள்ளது.
- source_word: כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: என் உள்ளம் உன் உள்ளத்தோடு இருப்பதுபோல்
  rationale: எபிரெய மொழியின் இருதரப்பு உள்ள உருவகத்தையும் עִם என்பதன் ‘உடன்’ உறவையும் விளக்கிச் சீராக்காமல் காக்கிறது.
- source_word: יֵשׁ וָיֵשׁ
  choice: ஆம், ஆம்
  rationale: இரட்டிப்பு வலியுறுத்திய உறுதிமொழி; தமிழில் இயல்பான மறுபதிப்பு அதே வலிமையைத் தருகிறது.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: உன் கையைக் கொடு
  rationale: மூலத்தின் நேரடியான கட்டளையையும் கை நீட்டும் உடன்பாடு அல்லது உதவி சார்ந்த செயலையும் காக்கிறது.
- source_word: וַיִּתֵּן יָדוֹ
  choice: அவன் தன் கையைக் கொடுத்ததும்
  rationale: முந்தைய கட்டளைக்கான நேரடி பதிலை வெளிப்படுத்துகிறது; ‘தன்’ தமிழில் உடைமையைத் தெளிவாக்குகிறது.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: இவன் அவனைத் தன்னோடு தேரில் ஏற்றிக்கொண்டான்
  rationale: Hiphil வடிவத்தின் ‘மேலே ஏற்றுதல்’ பொருளையும் אֵלָיו என்பதன் ‘தன்னிடம்/தன்னோடு’ கருத்தையும் இயல்பான தமிழில் தருகிறது; ‘இவன்’ செய்பவரை முந்தைய ‘அவன்’ ஆகிய யோனதாபிலிருந்து வேறுபடுத்துகிறது.
