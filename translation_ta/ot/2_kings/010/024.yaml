base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: ta
  text: அவர்கள் பலிகளையும் தகனபலிகளையும் செலுத்துவதற்காக உள்ளே சென்றார்கள். யெகூ தனக்கென வெளியே எண்பது பேரை நிறுத்தியிருந்தான். அவன், “நான் உங்கள் கையில் ஒப்புவிக்கும் இந்த மனிதர்களில் யாரையாவது தப்பிச் செல்ல விடுகிறவனுடைய உயிர், தப்பிச் செல்பவனுடைய உயிருக்குப் பதிலாக இருக்கும்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அவனுடைய உயிர் அவனுடைய உயிருக்குப் பதிலாக.” இதன் பொருள், ஒருவன் தப்பிச் செல்ல அனுமதிக்கும் காவலன், தப்பிச் செல்பவனுக்குப் பதிலாகத் தன் உயிரை இழக்க வேண்டும் என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: உள்ளே சென்றார்கள்
  rationale: בוא என்பது பார்வைக்கோணத்தின்படி வருதல், செல்லுதல், நுழைதல் எனப் பொருள்படும்; இங்கு வழிபாட்டுச் செயலைச் செய்ய ஆலயத்திற்குள் நுழைவது குறிக்கப்படுவதால் இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: பலிகளையும் தகனபலிகளையும் செலுத்துவதற்காக
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பலிகளோடு வரும்போது ‘செலுத்து/பலியிடு’ என்ற வழிபாட்டுச் சார்ந்த பொருளைக் கொண்டது; זְבָחִים பொதுவான பலிகளையும் עֹלוֹת முற்றிலும் எரிக்கப்படும் பலிகளையும் குறிக்கிறது.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: தனக்காக வெளியே எண்பது பேரை நிறுத்தியிருந்தான்
  rationale: שׂים என்பதன் ‘வை/நிறுத்து’ என்ற பொருள் இங்குள்ள காவல் சூழலில் மனிதர்களை ஒரு இடத்தில் நிறுத்தி வைத்ததைக் குறிக்கிறது. אִישׁ என்பது ‘ஆட்கள்/மனிதர்கள்’ என்பதே அன்றி அவர்களை வெளிப்படையாகப் படைவீரர்கள் எனக் குறிப்பிடவில்லை.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: இந்த மனிதர்களில் எவனையாவது தப்பிச்செல்ல விடுகிறவன்
  rationale: מלט என்ற வினை வடிவம் நேரடியாக ‘தப்புதல்’ என்று இருந்தாலும், காவலர்களுக்கு விடுக்கப்படும் எச்சரிக்கைச் சூழல் தப்புதலை அனுமதிக்கும் காவலரின் பொறுப்பைக் குறிக்கிறது; இதை இயல்பான தமிழில் வெளிப்படுத்த ‘தப்பிச்செல்ல விடுகிறவன்’ எனப்பட்டது.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: நான் உங்கள் கையில் ஒப்புவிக்கிற
  rationale: ‘கையின்மேல்/கைக்குள் கொண்டுவருதல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் அதிகாரத்திற்குள் ஒப்புவிப்பதைக் குறிக்கிறது; தமிழ் மரபுத்தொடரான ‘உங்கள் கையில் ஒப்புவிக்கிற’ அதைப் பாதுகாக்கிறது.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: அவனுடைய உயிர், தப்பியவனுடைய உயிருக்கு ஈடாகக் கொடுக்கப்பட வேண்டும்
  rationale: נפש இங்கு ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது. இரண்டு ஒரே சுட்டுப்பெயர்களால் ஏற்படும் குழப்பத்தைத் தவிர்த்து, பொறுப்பிழந்த காவலனின் உயிர் தப்பியவனுடைய உயிருக்கு மாற்றாகப் பறிக்கப்படும் என்ற தண்டனைச் சூத்திரம் தெளிவாக்கப்பட்டது.
