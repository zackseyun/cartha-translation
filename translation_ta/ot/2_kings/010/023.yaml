base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: ta
  text: பின்பு யெகூவும் ரேகாபின் மகன் யோனதாபும் பாகாலின் ஆலயத்திற்குள்[a] சென்றார்கள். யெகூ பாகாலை வழிபடுகிறவர்களிடம், “நன்றாகத் தேடிப் பாருங்கள்; உங்களிடையே யெகோவாவின் ஊழியர்களில் ஒருவரும் இங்கே இருந்துவிடாதபடி பாருங்கள்; பாகாலை வழிபடுகிறவர்கள் மட்டுமே இருக்க வேண்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பாகாலின் வீட்டிற்குள்.” இது பாகாலின் ஆலயத்தைக் குறிக்கிறது.
    reason: மூலத்தின் நேரடி சொற்றொடரையும் அதன் சூழற்பொருளையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ஆலயத்திற்குள் சென்றார்கள்
  rationale: בוא என்பது வருதல், போதல், உள்ளே செல்லுதல் ஆகிய பொருள்களைத் தரலாம். கட்டிடமாகிய ‘பாகாலின் வீடு’ இலக்காக இருப்பதால், இயல்பான தமிழில் ‘உள்ளே சென்றார்கள்’ எனப் பொருளைத் தெளிவாக்குகிறது; எபிரெய வினை ஒருமையில் இருந்தாலும் இரண்டு இணைந்த எழுவாய்களுக்கு ஏற்ற தமிழ் இலக்கணப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: בֵּית הַבָּעַל
  choice: பாகாலின் ஆலயம்
  rationale: சொல்லுக்கு சொல் ‘பாகாலின் வீடு’; சூழலில் இது வழிபாட்டுக் கட்டிடத்தைக் குறிப்பதால் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: עֹבְדֵי הַבַּעַל
  choice: பாகாலை வழிபடுகிறவர்கள்
  rationale: עבד என்பதற்கு ‘ஊழியர்கள்/பணியாளர்கள்’ என்றும் ‘வழிபடுகிறவர்கள்’ என்றும் பொருள் உண்டு. இங்கு பாகாலின் ஆலயத்தில் கூடியுள்ள சமயப் பற்றாளர்கள் குறிக்கப்படுவதால் வழிபாட்டு உணர்வு தெளிவாகத் தரப்பட்டது.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: நன்றாகத் தேடிப் பாருங்கள்
  rationale: இரு கட்டளைகளும் சோதித்துத் தேடி உறுதிசெய்யும் செயலைக் குறிக்கின்றன. தமிழில் ‘தேடிப் பாருங்கள்’ இரண்டையும் இயல்பாக இணைக்கிறது; ‘நன்றாக’ கவனமான ஆய்வின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: உங்களிடையே ... இங்கே இல்லாதபடி
  rationale: פֶּן முன்னெச்சரிக்கை அல்லது தவிர்ப்பைக் குறிக்கும் (‘இருந்துவிடாதபடி’). அதை வெறும் உண்மைக் கூற்றாக மாற்றாமல் தமிழில் முன்னெச்சரிக்கைத் தன்மை பாதுகாக்கப்பட்டது.
- source_word: מֵעַבְדֵי יְהוָה
  choice: யெகோவாவின் ஊழியர்களில் ஒருவரும்
  rationale: எபிரெயம் பகுதியைக் குறிக்கும் பன்மை வடிவில், ‘யெகோவாவின் ஊழியர்களிலிருந்து யாரும்’ என்ற கருத்தைத் தருகிறது. இயல்பான தமிழில் ‘ஊழியர்களில் ஒருவரும்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டது; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மூலத்திலுள்ள தனிப்பெயர் மறைக்கப்படவில்லை.
- source_word: כִּי אִם ... לְבַדָּם
  choice: '... மட்டுமே இருக்க வேண்டும்'
  rationale: இந்த விலக்குக் கட்டமைப்பு யெகோவாவின் ஊழியர்கள் யாரும் இல்லாமல் பாகால் வழிபாட்டாளர்கள் மட்டும் இருக்க வேண்டும் என்ற கடுமையான தனிப்படுத்தலைக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. தமிழில் வாசகர்களுக்குப் பரிச்சயமான பெயர்வடிவத்தைப் பயன்படுத்துவது அந்த வேறுபாட்டைப் பாதுகாக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தை வசனத்திற்குள் சேர்ப்பதில்லை.
- issue: עבד என்பதைக் பாகாலுக்கும் יהוה-க்கும் ஒரே தமிழ்ச் சொல்லால் வழங்கலாமா
  choice: பாகாலை ‘வழிபடுகிறவர்கள்’ என்றும் யெகோவாவை ‘ஊழியர்கள்’ என்றும் சூழலுக்கேற்ப வழங்குதல்
  alternative: இரண்டிலும் ‘ஊழியர்கள்’ என்று வழங்குதல்
  rationale: ஒரே எபிரெய வேர் இரு இடங்களிலும் இருந்தாலும், பாகால் தொடர்பில் ஆலயத்தில் கூடிய சமய வழிபாட்டாளர்கள் முன்வருகின்றனர்; יהוה தொடர்பில் நிலையான ‘இறைவனின் ஊழியர்’ உறவுமுறை முன்வருகிறது. சொல் விளையாட்டை விட இயல்பான தமிழும் சூழற்பொருளும் முன்னுரிமை பெறுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘யெகூ’, ‘யோனதாப்’, ‘ரேகாப்’, ‘பாகால்’ ஆகியவை தமிழ் வேதாகமப் பெயர்மரபுக்கு நெருக்கமான ஒலிபெயர்ப்புகள். கட்டளை நேரடியாகவும் இயல்பாகவும் உள்ளது.
