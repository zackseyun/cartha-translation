base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: ta
  text: அப்போது யெகூ, யெஸ்ரயேலில் ஆகாபின் குடும்பத்தைச் சேர்ந்த எஞ்சியிருந்த அனைவரையும், ஆகாபின் முக்கியமானவர்கள், நெருங்கியவர்கள், ஆசாரியர்கள் ஆகிய அனைவரையும் கொன்றான். அவனுக்கு ஒருவரும் உயிர்தப்பியிருக்காதபடி செய்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “அவனுக்கு” என்பது ஆகாபையோ ஆகாபின் குடும்பத்தையோ குறிக்கலாம். எபிரெயத்தில் சொல்லர்த்தமாக, “அவனுக்கு உயிர்தப்பிய ஒருவனையும் விட்டுவைக்காதவரை.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: கொன்றுபோட்டான்
  rationale: இந்தக் கதைச் சூழலில் נכה உயிரைப் பறிக்கும் தாக்குதலைக் குறிக்கிறது; நவீனத் தமிழில் அதன் விளைவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: ஆகாபின் குடும்பத்தில் எஞ்சியிருந்த அனைவரையும்
  rationale: בֵּית אַחְאָב என்பது அரச வம்சத்தையும் அதனுடன் சேர்ந்த குடும்பத்தையும் குறிக்கிறது; ‘குடும்பம்’ சாதாரண வாசகருக்குத் தெளிவானது, ‘எஞ்சியிருந்த’ என்பது שׁאר என்பதன் மீதமிருத்தல் பொருளைக் காக்கிறது.
- source_word: בְּיִזְרְעֶאל
  choice: யெஸ்ரயேலில்
  rationale: நகரைக் குறிக்கும் இடவேற்றுமையை இயல்பான தமிழில் தருகிறது.
- source_word: גְּדֹלָיו
  choice: அவனுடைய தலைவர்கள்
  rationale: ஆகாபுடன் தொடர்புடைய சமூக அல்லது அரசியல் முக்கியஸ்தர்களைக் குறிக்கும் சூழற்பொருளைத் தெளிவாக்குகிறது; ‘பிரபுக்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: מְיֻדָּעָיו
  choice: நெருங்கியவர்கள்
  rationale: ידע-இலிருந்து உருவான இச்சொல் வெறும் அறிமுகமானவர்களைவிட நெருங்கிய தொடர்புடையவர்களைக் குறிக்கலாம்; தமிழில் உறவுசார் மற்றும் அரசியல் அணுக்கம் இரண்டையும் திறந்தவாறு வைக்கிறது.
- source_word: כֹהֲנָיו
  choice: ஆசாரியர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடியான மதப் பணியாளர் பொருளை, அவர்களின் குறிப்பிட்ட வழிபாட்டு அமைப்பை மேலதிகமாக நிர்ணயிக்காமல் தருகிறது.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: அவனுக்கு ஒருவரும் உயிர்தப்பியிருக்காதபடி செய்தான்
  rationale: முழுமையாக உயிர்தப்பியோர் இல்லாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; לוֹ-வின் ஒருமைச் சுட்டை ‘அவனுக்கு’ எனக் காத்து, அதன் குறிப்பு யாருக்கு என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: முடிவுக் கூறிலுள்ள לוֹ என்ற ஒருமைச் சுட்டின் குறிப்பு
  choice: ‘அவனுக்கு’ என்று வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘ஆகாபுக்கு’ அல்லது ‘ஆகாபின் குடும்பத்திற்கு’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: எபிரெயத்தில் சுட்டுப்பெயர் சுருக்கமாக உள்ளது; அது ஆகாபையோ ஆகாபின் குடும்பத்தையோ குறிக்கலாம். பிரதான உரையில் ஒரு பொருளை மட்டும் கட்டாயப்படுத்தாமல், உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் உரைநடை. வம்சத்தைக் குறிக்கும் ‘வீடு’ என்ற சொல்லர்த்த வடிவத்திற்குப் பதிலாக இயல்பான ‘குடும்பம்’ பயன்படுத்தப்பட்டது. மூலத்தின் இறுதி சுட்டுப்பெயரிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
