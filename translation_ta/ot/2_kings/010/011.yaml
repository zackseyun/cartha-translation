revisions:
- from: அதனால் யெகூ, யெஸ்ரயேலில் ஆகாபின் குடும்பத்தில் எஞ்சியிருந்த அனைவரையும், அவனுடைய தலைவர்கள்[a], நெருங்கியவர்கள்[b], ஆசாரியர்கள் ஆகிய அனைவரையும் கொன்றுபோட்டான். அவனுக்கு ஒருவரும் உயிர்தப்பியிருக்காதபடி செய்தான்.[c]
  to: அப்போது யெகூ, யெஸ்ரயேலில் ஆகாபின் குடும்பத்தைச் சேர்ந்த எஞ்சியிருந்த அனைவரையும், ஆகாபின் முக்கியமானவர்கள், நெருங்கியவர்கள், ஆசாரியர்கள் ஆகிய அனைவரையும் கொன்றான். அவனுக்கு ஒருவரும் உயிர்தப்பியிருக்காதபடி செய்தான்.[c]
  rationale: The revision removes the misleading possible reference of the intervening possessives to Jehu by identifying the listed men, associates, and priests as Ahab’s. It retains the source’s compressed final singular pronoun as “அவனுக்கு” and explains its possible referents in the footnote. The verb is adjusted to formal, natural modern Tamil without reducing the narrative’s lethal sense.
