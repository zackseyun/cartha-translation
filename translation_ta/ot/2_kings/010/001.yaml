  register: நவீனத் தரத் தமிழ்; மரியாதையும் கதைநடைத் தெளிவும் கொண்ட நடை. மூலத்தின் இடப்பெயர் சார்ந்த சிக்கல் தீர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது. ‘பாதுகாவலர்கள்’ என்பதோடு அவர்களின் பராமரிப்புப் பங்கு முதன்மை உரையிலேயே தெளிவாக்கப்பட்டுள்ளது.
