  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: ta
  text: 'ஆகாபுக்கு சமாரியாவில் எழுபது மகன்கள் இருந்தார்கள். யெகூ கடிதங்களை எழுதி, அவற்றைச் சமாரியாவுக்கு, யெஸ்ரயேலின் ஆட்சியாளர்களிடமும்[a] மூப்பர்களிடமும் ஆகாபின் மகன்களைப் பராமரித்து வந்த பாதுகாவலர்களிடமும்[b] அனுப்பி, இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யெஸ்ரயேலின் ஆட்சியாளர்களுக்கு.” கடிதங்கள் சமாரியாவுக்கு அனுப்பப்பட்டதாகக் கூறப்படுவதால், சமாரியாவில் வசித்த யெஸ்ரயேலோடு தொடர்புடைய ஆட்சியாளர்கள் என்று சிலர் புரிந்துகொள்கிறார்கள்; சில பழங்கால மொழிபெயர்ப்புகளும் விளக்கங்களும் “சமாரியாவின் ஆட்சியாளர்கள்” என்ற வாசகத்தை ஆதரிக்கின்றன. முதன்மை உரை மசோரா வாசகத்தையே பாதுகாக்கிறது.
    reason: textual_variant
  - marker: b
    text: “வளர்ப்புத் தந்தைகள்” அல்லது “பராமரிப்பாளர்கள்” என்றும் மொழிபெயர்க்கலாம். ஆகாபின் மகன்களை வளர்க்கவோ மேற்பார்வையிடவோ பொறுப்பேற்றவர்களை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: ஆகாபுக்கு ... இருந்தார்கள்
  rationale: எபிரெய மொழியின் உரிமையைக் குறிக்கும் அமைப்பை இயல்பான தமிழில் உரிமை/உடைமை உணர்வுடன் தருகிறது; வெளிப்படையாக இல்லாத காலக் குறிச்சொல் சேர்க்கப்படவில்லை.
- source_word: שִׁבְעִים בָּנִים
  choice: எழுபது மகன்கள்
  rationale: அரச வழித்தோன்றல் சூழலில் בָּנִים என்பதன் ஆண்பால் பொருள் முக்கியமானதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; நகரத்திற்குள் அவர்கள் இருந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: கடிதங்களை எழுதி
  rationale: סְפָרִים இச்சூழலில் அனுப்பப்படும் எழுத்துப்பூர்வச் செய்திகளைக் குறிக்கிறது.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: அவற்றைச் சமாரியாவிலிருந்த ... அனுப்பி
  rationale: முந்தைய ‘கடிதங்கள்’ என்பதையே மறைமுகச் செயப்படுபொருளாக எடுத்துக் காட்டுகிறது. இலக்கு சமாரியா என்பதையும் பெறுநர்கள் அங்கே இருந்தனர் என்பதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: யெஸ்ரயேலின் ஆட்சியாளர்களிடமும்
  rationale: שָׂרֵי என்பது ஆட்சிப் பொறுப்புள்ள தலைவர்களைச் சுட்டுகிறது. சமாரியாவுக்கு அனுப்பப்பட்ட கடிதங்கள் ‘யெஸ்ரயேலின் ஆட்சியாளர்களுக்கு’ முகவரியிடப்பட்டுள்ள மூல உரையின் கடினத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்களிடமும்
  rationale: வயதானவர்களை மட்டும் அல்லாமல் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் குடிமைச் சூழல் பொருள்.
- source_word: הָאֹמְנִים אַחְאָב
  choice: ஆகாபின் மகன்களைப் பராமரித்து வந்த பாதுகாவலர்களிடமும்
  rationale: אמן வேரிலான இச்சொல் அரச குமாரர்களை வளர்த்து மேற்பார்வையிட்ட பொறுப்பாளர்களைக் குறிக்கிறது. தொடர்பைத் தெளிவாக்க ‘மகன்களை’ சூழலிலிருந்து வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: அடுத்த வசனத்தில் வரும் கடிதத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வழக்கமான எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது.
