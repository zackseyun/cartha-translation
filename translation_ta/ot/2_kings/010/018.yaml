base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: ta
  text: பின்பு யெகூ மக்கள் அனைவரையும் ஒன்றுகூட்டி, அவர்களிடம்[a], “ஆகாப் பாகாலுக்குச் சிறிதளவே பணிவிடை செய்தான்[b]; யெகூவோ அவனுக்கு மிகுதியாகப் பணிவிடை செய்வான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சூழலில் யெகூவின் இந்தக் கூற்று நையாண்டித்தன்மை கொண்டது: பாகாலுக்கு ‘மிகுதியாக’ பணிவிடை செய்வதாக அவன் கூறினாலும், பாகாலின் வழிபாட்டாளர்களை ஒன்றுகூட்டுவதற்கான சூழ்ச்சி இது என்பதைத் தொடர்ந்து வரும் நிகழ்ச்சி காட்டுகிறது.'
    reason: cross_reference
  - marker: b
    text: ‘பாகாலை வழிபட்டான்’ என்றும் மொழிபெயர்க்கலாம்; ‘பணிவிடை செய்தல்’ என்பதற்கான எபிரெய வினைச்சொல் மதச்சார்பான வழிபாட்டையும் குறிக்கப் பயன்படுகிறது. இதேபோல் அடுத்த சொற்றொடரை ‘அவனை வழிபடுவான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பது மக்களை ஓரிடத்தில் திரட்டுவதைக் குறிக்கிறது. ‘ஒன்றுகூட்டி’ என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரையும்
  rationale: எபிரெயச் சொற்றொடரின் பரந்த பொருளைச் சுருக்காமல், இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: עָבַד אֶת הַבַּעַל
  choice: பாகாலுக்குப் பணிவிடை செய்தான்
  rationale: עבד என்பது ஒரு தெய்வத்தைச் சார்ந்து வரும்போது மதச்சார்பான சேவை அல்லது வழிபாட்டைக் குறிக்கலாம். ‘பணிவிடை செய்தான்’ என்பது ‘சேவித்தான்’ என்ற அடிப்படைப் பொருளையும் மதச்சார்பான நிழற்பொருளையும் காக்கிறது.
- source_word: מְעָט
  choice: சிறிதளவே
  rationale: செயலின் அளவைக் குறிக்கும் சொல்லாகவும், தொடர்ந்து வரும் ‘மிகுதியாக’ என்பதோடு உள்ள எதிரிணையையும் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יַעַבְדֶנּוּ
  choice: அவனுக்குப் பணிவிடை செய்வான்
  rationale: வினையோடு சேர்ந்துள்ள ஒருமை ஆண்பால் சுட்டுப்பெயர் பாகாலைக் குறிக்கிறது; தமிழிலும் ‘அவனுக்கு’ என்று சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: הַרְבֵּה
  choice: மிகுதியாக
  rationale: மְעָט என்பதற்கு எதிராகச் செயலின் அளவைக் குறிக்கிறது. ‘மிகுதியாக’ என்பது ‘அதிகமாக’ என்ற ஒப்பீட்டை உரையில் இல்லாத அளவுக்குத் தெளிவுபடுத்தாமல், எபிரெய இணைப்பைத் தக்கவைக்கிறது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבַּעַל
  choice: பாகால்
  rationale: எபிரெயத்தில் சுட்டிடைச்சொல் இருந்தாலும், இங்கு தெய்வப் பெயராக வருவதால் தமிழில் இயல்பாக ‘பாகால்’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாகாலுக்குப் பணிவிடை செய்வதாக யெகூ அறிவித்தல்
  choice: யெகூ கூறியதை முதன்மை உரையில் நேரடியான கூற்றாகவே மொழிபெயர்த்தல்
  alternative: ‘பணிவிடை செய்வதாகப் பாசாங்கு செய்தான்’ அல்லது ‘கூறிக்கொண்டான்’ என ஏமாற்றத்தை உரையிலேயே வெளிப்படுத்துதல்
  rationale: சூழலில் இது பாகாலின் வழிபாட்டாளர்களை ஒன்றுகூட்டுவதற்கான யெகூவின் சூழ்ச்சி. ஆனால் இவ்வசனத்தின் எபிரெயச் சொற்கள் அவரது பேச்சை நேரடியாக மட்டுமே தருகின்றன. ஆகவே நையாண்டி அல்லது வஞ்சக நோக்கம் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிவிடை செய்தல்’ என்பது மூலத்தின் ‘சேவை செய்தல்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே மதச்சார்பான சூழலை உணர்த்துகிறது; ‘சிறிதளவே … மிகுதியாக’ என்ற எதிரிணை எபிரெய வசனத்தின் சுருக்கமான சொல்லமைப்பைப் பாதுகாக்கிறது.
