id: 2KI.10.20
reference: 2 Kings 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יֵה֗וּא קַדְּשׁ֧וּ עֲצָרָ֛ה לַ/בַּ֖עַל וַ/יִּקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: ta
  text: அப்போது யெகூ, “பாகாலுக்காக ஒரு சிறப்புக் கூட்டத்தைப் புனிதமாக ஒதுக்குங்கள்” என்றான். அவர்கள் அதை அறிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீனத் தமிழில் வரிசையை இயல்பாகக் காட்ட ‘அப்போது’ பொருத்தமானது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: எபிரேயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: קַדְּשׁוּ
  choice: கூட்டுங்கள்
  rationale: இங்கு அடுத்துவரும் ‘பேரவை’யுடன் இணைந்து, வழிபாட்டுக்கென அதிகாரபூர்வமாக ஒரு கூடுகையை ஏற்பாடு செய்யும் கட்டளையைக் குறிக்கிறது; பரிசுத்தத் தன்மை ‘பரிசுத்தப் பேரவை’ என்பதில் வெளிப்படுகிறது.
- source_word: עֲצָרָה
  choice: ஒரு பரிசுத்தப் பேரவை
  rationale: வழிபாட்டுக்குரிய முறையான, விசேஷமாக ஒதுக்கப்பட்ட கூடுகை என்ற பொருளை dignified, புரியத்தக்க தமிழில் தருகிறது.
- source_word: לַבַּעַל
  choice: பாகாலுக்காக
  rationale: 'லְ முன்னிடைச்சொல் இங்கு நோக்கம் அல்லது தொடர்பைக் குறிக்கிறது: பாகாலை வழிபடுவதற்கான பேரவை.'
- source_word: וַיִּקְרָאוּ
  choice: அதன்படியே அவர்கள் அதை அறிவித்தார்கள்
  rationale: קרא இச்சூழலில் பொதுவாக அறிவித்தல் அல்லது கூடுமாறு அழைப்பு விடுத்தல் என்று பொருள்; ‘அதை’ என்பது சூழலிலிருந்து இயல்பாக நிரப்பப்படுகிறது.
theological_decisions:
- issue: பாகாலுக்கான பேரவையை ‘பரிசுத்தமானது’ எனக் குறிப்பிடுதல்
  choice: மூலத்தின் வழிபாட்டுச் சொல்லாட்சியை மதிப்பீடு இன்றி தக்கவைத்தல்
  alternative: ‘விசேஷப் பேரவை’ என மதச்சார்ந்த நுணுக்கத்தை மங்கச் செய்தல்
  rationale: קדשׁ மற்றும் עֲצָרָה ஆகியவை சடங்கு/வழிபாட்டு தன்மையைக் கொண்டவை; மொழிபெயர்ப்பு பாகால் வழிபாட்டை அங்கீகரிக்காமல், யெகூவின் அறிவிப்பின் சொற்களை மட்டும் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பேரவை’ முறையான சமயக் கூடுகையின் உயர்ந்த பதிவைத் தக்கவைக்கிறது; ‘அறிவித்தார்கள்’ பொது அறிவிப்பின் பொருளைத் தெளிவாக்குகிறது.
