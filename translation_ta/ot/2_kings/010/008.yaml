base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: ta
  text: தூதுவன் வந்து, “அரசனுடைய மகன்களின் தலைகளைக் கொண்டுவந்திருக்கிறார்கள்” என்று அவனிடம் அறிவித்தான். அதற்கு அவன், “அவற்றை இரண்டு குவியல்களாக[a] வாசலின் நுழைவிடத்தில் காலைவரை வையுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு அடுக்குகளாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: தூதுவன்
  rationale: இச்சரித்திரச் சூழலில் செய்தி கொண்டுவரும் மனிதத் தூதனையே குறிக்கிறது; இயற்கைக்கு அப்பாற்பட்ட தேவதூதனைக் குறிக்கவில்லை.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: “…” என்று அவனிடம் அறிவித்தான்
  rationale: எபிரெய மொழியின் ‘அறிவித்து, சொல்லி’ என்ற அமைப்பை இயல்பான நவீன தமிழில் நேரடி உரையுடன் வழங்குகிறது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்திருக்கிறார்கள்
  rationale: முடிந்த செயல் தற்போதைய நிலையில் விளைவைக் கொண்டிருப்பதை நேரடி உரையில் தெளிவாக உணர்த்துகிறது.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்களின் தலைகள்
  rationale: பன்மை வடிவையும் அரசனுடைய ஆண் சந்ததியரைக் குறிக்கும் தொடரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שִׂימוּ אֹתָם
  choice: அவற்றை … வையுங்கள்
  rationale: பன்மைப் பொருட்களைக் குறிக்கும் சுட்டுப்பெயருடன் கட்டளையை இயல்பான மரியாதைப் பன்மையில் தருகிறது.
- source_word: שְׁנֵי צִבֻּרִים
  choice: இரண்டு குவியல்களாக
  rationale: צִבֻּרִים என்பதன் குவியல்/குவிப்பு என்ற காட்சிப்பூர்வமான பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: פֶּתַח הַשַּׁעַר
  choice: வாசலின் நுழைவிடத்தில்
  rationale: வாசலின் திறப்பு அல்லது நுழைவுப் பகுதி என்ற இடக்குறிப்பை, மூலத்தில் இல்லாத ‘நகர’ என்ற சொல்லைச் சேர்க்காமல் தருகிறது.
- source_word: עַד הַבֹּקֶר
  choice: காலைவரை
  rationale: அடுத்த காலை வரையிலான கால நீடிப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
