  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: ta
  text: ஆனால் அவர்கள் மிகவும் மிகவும் பயந்து, “இதோ, அந்த இரண்டு அரசர்களாலும் அவனுக்கு முன்பாக நிற்க முடியவில்லை; அப்படியிருக்க, நம்மால் எப்படி நிற்க முடியும்?” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இதை இன்னும் வெளிப்படையாகச் சொன்னால்: “அவனை எதிர்த்து நிலைநிற்க முடியவில்லை … நாம் எப்படி அவனை எதிர்த்து நிலைநிற்க முடியும்?” எபிரெயத்தில் இரு இடங்களிலும் “நில்” என்ற ஒரே வினைச்சொல் வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: அவர்கள் பயந்து
  rationale: ירא என்பதன் தொடர்நிலை கதைவடிவம் அவர்களுடைய அச்சத்தைச் சுட்டுகிறது; ‘பயந்து’ என்பது அடுத்துவரும் பேச்சுச் செயலோடு இயல்பாக இணைகிறது.
- source_word: מְאֹד מְאֹד
  choice: மிகவும் மிகவும்
  rationale: எபிரெயத்தில் இருமுறை வரும் வலியுறுத்தலைச் சுருக்காமல் அப்படியே காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: அந்த இரண்டு அரசர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட இரு அரசர்களையே குறிக்கும் உறுதியான சுட்டலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: அவனுக்கு முன்பாக நிற்க முடியவில்லை
  rationale: עמד לפני என்பதன் ‘எதிர்த்து நிலைநிற்குதல்’ என்ற சூழல்சார் பொருளையும், ‘நிற்றல்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: அப்படியிருக்க, நம்மால் எப்படி நிற்க முடியும்?
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவை இயல்பாகக் காட்டுவதோடு, இரு உட்பிரிவுகளிலும் עמד என்பதற்கான ‘நிற்க’ என்ற ஒரே சொல்லைத் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தும் இரட்டிப்பு மற்றும் ‘நிற்க’ என்ற சொல்லின் சொல்லாட்சிசார் இணைவு பாதுகாக்கப்பட்டுள்ளன.
