- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: உங்கள் எஜமானின் மகன்கள்
  rationale: இது தெய்வீகப் பட்டம் அல்லாமல் அரசியல் தலைவரைக் குறிப்பதால், אֲדֹנֵיכֶם என்பதற்கு ‘எஜமான்’ பொருத்தமானது.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: தேர்களும் குதிரைகளும்
  rationale: இராணுவ வளங்களைக் குறிக்கும் எபிரெயக் கூட்டுப்பெயர்களை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: עִיר מִבְצָר
  choice: அரண்சூழ்ந்த நகரம்
  rationale: பாதுகாப்பு அரண்களைக் கொண்ட நகரம் என்ற பொருளை நவீன வாசகருக்குத் தெளிவாக உணர்த்துகிறது.
- source_word: הַנָּשֶׁק
  choice: ஆயுதங்கள்
  rationale: பொதுவான போர்க் கருவிகளைக் குறிக்கும் சொல்லைத் தேவையின்றி ‘கவசம்’ எனக் குறுக்காமல் தருகிறது.
- source_word: וְאִתְּכֶם
  choice: உங்களோடு இருப்பதாலும் / உங்களிடம் இருப்பதாலும்
