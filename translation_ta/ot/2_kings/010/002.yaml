  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: ta
  text: “இப்போது, இந்தக் கடிதம் உங்களிடம் வந்ததும்,[a] உங்கள் எஜமானின் மகன்கள்[b] உங்களோடு இருக்க, தேர்களும் குதிரைகளும், அரணமைந்த நகரமும்[c] ஆயுதங்களும் உங்களிடம் இருக்க,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஆவணம் உங்களிடம் வந்து சேர்ந்ததும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உங்கள் எஜமானின் மகன்கள்”; அதாவது, கடிதம் பெற்றவர்கள் பணியாற்றிய அரசனின் மகன்கள்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “கோட்டை நகரம்.” இச்சொற்றொடர், அவர்கள் பயன்படுத்தக்கூடிய பாதுகாப்புமிக்க நகரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
