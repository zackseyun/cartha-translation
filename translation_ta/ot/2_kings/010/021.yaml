base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: ta
  text: எனவே, ஏகூ இஸ்ரயேல் முழுவதும் செய்தி அனுப்பினான். பாகாலை வழிபட்ட அனைவரும் வந்தார்கள்; வராமல் ஒருவன்கூட எஞ்சியிருக்கவில்லை. அவர்கள் பாகாலின் ஆலயத்திற்குள் வந்தார்கள். பாகாலின் ஆலயம் ஒரு முனையிலிருந்து மறுமுனைவரை நிரம்பியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “வாயிலிருந்து வாய்வரை”; ஆலயம் முழுவதுமாக நிரம்பியிருந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரயேல் முழுவதும் செய்தி அனுப்பினான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’; בְּכָל יִשְׂרָאֵל என்பது செய்தி அல்லது அழைப்பு இஸ்ரயேல் முழுவதும் சென்றதைச் சுட்டுகிறது. தமிழில் விடுபட்ட செயப்படுபொருளை இயல்பாக வெளிப்படுத்த ‘செய்தி’ சேர்க்கப்பட்டுள்ளது.
- source_word: עֹבְדֵי הַבַּעַל
  choice: பாகாலை வழிபட்ட அனைவரும்
  rationale: עבד என்பது பொதுவாக ‘பணிசெய்’ அல்லது ‘சேவைசெய்’ எனப் பொருள்படலாம்; இங்கு வழிபாட்டுச் சூழலில் இருப்பதால் ‘வழிபட்டவர்கள்’ என்பதே தெளிவான பொருள்.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: வராமல் ஒருவன்கூட எஞ்சியிருக்கவில்லை
  rationale: மூலத்தின் எதிர்மறை அமைப்பையும் முழுமையான வருகை என்ற வலியுறுத்தலையும் இது காக்கிறது; אִישׁ என்ற ஆண்பால் ஒருமை ‘ஒருவன்கூட’ என பிரதிபலிக்கப்படுகிறது.
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் ஆலயம்
  rationale: எபிரெயத்தில் சொற்படி ‘பாகாலின் வீடு’ என்றாலும், இங்கு வழிபாட்டுக் கட்டடமே குறிக்கப்படுவதால் நவீனத் தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּמָּלֵא
  choice: நிரம்பியது
  rationale: מלא வினையின் நிபால் வடிவம் இங்கு அந்த ஆலயம் நிறைந்த நிலையை இயல்பாகக் குறிக்கிறது.
- source_word: פֶּה לָפֶה
  choice: ஒரு முனையிலிருந்து மறுமுனைவரை
  rationale: சொற்படி ‘வாயிலிருந்து வாய்வரை’ என்ற இந்த மரபுத்தொடர், இடம் முழுவதும் நிரம்பியிருந்ததைச் சுட்டுகிறது. தமிழில் அதன் பொருளை இயல்பாகத் தரும் வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: வராமல் ஒருவன்கூட எஞ்சியிருக்கவில்லை
  alternative: வராமல் எவரும் எஞ்சியிருக்கவில்லை
  rationale: மூலத்தில் ஆண்பால் ஒருமைச் சொல் இருப்பதால் அதை ‘ஒருவன்கூட’ எனக் காத்துள்ளோம்; இங்கு அது பாகால் வழிபாட்டாளர்களில் ஒருவர்கூட விடுபடவில்லை என்பதை வலியுறுத்துகிறது, தனியான கோட்பாட்டுத் தீர்மானத்தை அல்ல.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ என்பது வழிபாட்டுக் கட்டடத்தைத் தெளிவுபடுத்துகிறது; மூலத்தின் ‘வீடு’ என்ற சொற்பொருள் பிரதான உரையில் இயல்புக்காக மொழியாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் இறுதி மரபுத்தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
