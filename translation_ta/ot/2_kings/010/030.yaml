  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: ta
  text: 'யாவே யெகூவிடம் கூறினார்: “என் பார்வையில் சரியானதைச் செய்து, என் உள்ளத்தில் இருந்தபடியெல்லாம் ஆகாபின் வீட்டாருக்குச் செய்ததினால், நீ நன்றாகச் செய்தாய். உன் மகன்கள் நான்காம் தலைமுறைவரை[a] இஸ்ரயேலின் அரியணையில் அமர்வார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நான்குகளின் மகன்கள்” எனும் மரபுத்தொடர் உள்ளது; இங்கு அது நான்கு தலைமுறைகள் நீடிக்கும் வம்ச ஆட்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெயப் பெயரின் பரவலாக அறியப்பட்ட தமிழாக்கமாக வழங்குகிறது.
- source_word: יַעַן אֲשֶׁר
  choice: செய்ததால்
  rationale: தேவ அறிவிப்புக்கான காரணத்தை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הֱטִיבֹתָ
  choice: நீ நன்றாகச் செய்தாய்
  rationale: யெகூவின் குறிப்பிட்ட செயலைப் பாராட்டும் ஹிப்இல் வினையின் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: என் பார்வையில் சரியானதைச் செயல்படுத்தி
  rationale: தேவ மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பாதுகாத்தபடி தமிழில் இயல்பாக அமைகிறது.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: என் உள்ளத்தில் இருந்த அனைத்தின்படியும்
  rationale: לֵבָב என்பதில் அடங்கிய நோக்கம் அல்லது சித்தம் என்ற கருத்தைத் தீர்த்துவிடாமல், மூலத்தின் ‘உள்ளம்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: ஆகாபின் வீட்டாருக்குச் செய்ததால்
  rationale: ‘ஆகாபின் வீடு’ என்பது வம்சத்தையும் குடும்பத்தாரையும் குறிக்கும் என்பதால், நிகழ்ந்த நியாயத்தீர்ப்பை மேலதிகமாக விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בְּנֵי רְבִעִים
  choice: உன் மகன்கள் நான்காம் தலைமுறைவரை
  rationale: ‘மகன்கள்’ என்ற மூலச் சொல்லை வைத்துக்கொண்டு, நான்கு தலைமுறை வம்சத் தொடரைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரயேலின் அரியணையில் அமர்வார்கள்
  rationale: அரசாட்சியைக் குறிக்கும் ‘அரியணையில் அமர்தல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; לְךָ-வின் வம்ச உறவு ‘உன் மகன்கள்’ என்பதிலேயே இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: யெகூவின் செயல்களுக்கு வழங்கப்படும் தேவ அங்கீகாரம்
  choice: ஆகாபின் வீட்டாருக்கு எதிராகச் செய்யப்பட்ட குறிப்பிட்ட நியாயத்தீர்ப்பை தேவன் பாராட்டுவதாக வசனத்தை வழங்குதல்
  alternative: யெகூவின் எல்லா செயல்களுக்கும் அல்லது முழு ஆட்சிக்கும் பொதுவான அங்கீகாரமாக விரிவுபடுத்துதல்; அல்லது இங்குள்ள பாராட்டை மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை ஆகாபின் வீட்டாருக்குச் செய்யப்பட்ட செயலைத் தெளிவாகப் பாராட்டுகிறது. அந்தக் கூற்றை அப்படியே பாதுகாக்க வேண்டும்; ஆனால் யெகூவின் மொத்த வாழ்க்கை மற்றும் ஆட்சியைப் பற்றிய மேலதிக முடிவை மொழிபெயர்ப்பு சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பார்வை,’ ‘உள்ளம்,’ ‘அரியணையில் அமர்தல்’ ஆகிய மூல உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
