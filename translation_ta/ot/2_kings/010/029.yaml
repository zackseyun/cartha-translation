base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: ta
  text: ஆயினும், இஸ்ரவேலைப் பாவம் செய்யவைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களை—பெத்தேலிலும் தாணிலும் இருந்த தங்கக் கன்றுகளை—பின்பற்றுவதை யெகூ நிறுத்தவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல்லாக, ‘அவற்றின் பின்னாலிருந்து விலகவில்லை’; இங்கு வரும் எபிரெய மரபுத்தொடர், அவற்றைப் பின்பற்றுவதை நிறுத்தவில்லை என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய சூழலில் யெகூ செய்தவற்றுக்கு ஒரு வரம்பான விதிவிலக்கை அறிமுகப்படுத்தும் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲטָאֵי
  choice: பாவங்களை
  rationale: யெரொபெயாமின் வழிபாட்டுக் கொள்கையுடன் தொடர்புடைய குறிப்பிட்ட பாவங்களை நேரடியாகக் குறிக்கிறது.
- source_word: הֶחֱטִיא
  choice: பாவம் செய்யவைத்த
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: அவற்றைப் பின்பற்றுவதிலிருந்து ... விலகவில்லை
  rationale: எபிரெய மரபுத்தொடரின் பொருளான ஒரு வழியைப் பின்பற்றுவதை நிறுத்தாதிருத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: עֶגְלֵי הַזָּהָב
  choice: தங்கக் கன்றுக்குட்டிகளை
  rationale: வழிபாட்டுக்குரிய உருவங்களைக் குறிக்கும் உறுதியான பெயர்ச்சொல் தொடரை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: பெத்தேலிலும் தாணிலும் இருந்த
  rationale: இரு கன்றுக்குட்டிகளின் இருப்பிடங்களைச் சுருக்கமாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: דָּן
  choice: தாண்
  rationale: இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘யெரொபெயாமின் பாவங்கள்’ என்பதற்கும் ‘தங்கக் கன்றுக்குட்டிகள்’ என்பதற்கும் உள்ள தொடர்பு
  choice: தங்கக் கன்றுக்குட்டிகள் என்ற தொடரை யெரொபெயாமின் பாவங்களை விளக்கும் இடைச்சேர்க்கையாகக் கோடுகளுக்குள் அமைத்தல்
  alternative: தங்கக் கன்றுக்குட்டிகள் என்பதை தொடரியல் இடைவெளிக்குப் பின் வரும் மறுதொடக்க விளக்கமாகக் கொள்ளலாம்.
  rationale: எபிரெய உரை பொதுவான ‘பாவங்கள்’ என்பதிலிருந்து அவற்றின் உறுதியான வழிபாட்டு வெளிப்பாடுகளுக்குச் செல்கிறது; கோடுகள் இந்த விளக்கத் தொடர்பைப் பாதுகாக்கின்றன, ஆனால் அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. காரணவினை, எதிர்மறைத் திருப்பம், மற்றும் எபிரெய மரபுத்தொடரின் இயக்க உருவகம் ஆகியவை முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
