base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: ta
  text: அவர் ஆடை அறைக்குப் பொறுப்பானவனிடம், “பாகாலை வழிபடுகிறவர்கள்[b] அனைவருக்கும் ஆடைகளை[a] வெளியே எடுத்து வா” என்றார். அவனும் அவர்களுக்காக அந்த ஆடைகளை வெளியே கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வசனம் முழுவதிலும் “உடைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பாகாலை வழிபடுகிறவர்கள்” என்பதற்கான மூலமொழித் தொடர் இன்னும் நேரடியாக “பாகாலின் பணியாளர்கள்” என்று பொருள்படும்; பாகாலின் வழிபாட்டுச் சேவையில் ஈடுபட்டவர்களே இங்கு குறிக்கப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: ஆடை அறை
  rationale: ஆடைகள் வைக்கப்பட்டு வழங்கப்படும் இடத்தைக் குறிக்கும் சொல்லாக, பிற்கால சமயக் கட்டடப் பொருளைத் தவிர்த்து, இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: ஆடை அறைக்குப் பொறுப்பாக இருந்தவனிடம்
  rationale: எபிரேய மொழியின் ‘அதன் மேல் இருந்தவர்’ என்ற நிர்வாகப் பொறுப்பைக் குறிக்கும் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹצֵא
  choice: வெளியே எடுத்துக்கொண்டு வா
  rationale: יצא வினையின் காரணவினை ஏவலைத் தெளிவாகக் காட்டி, சேமிப்பிடத்திலிருந்து ஆடைகளைக் கொண்டுவரும் சூழலுக்கும் பொருந்துகிறது.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: ஆடைகள் / அந்த ஆடைகள்
  rationale: எபிரேய ஒருமைச் சொற்கள் இங்கு தொகுப்புப் பொருளில் வருகின்றன; தமிழில் இயல்பாக இருக்கப் பன்மை பயன்படுத்தப்பட்டு, இரண்டாவது இடத்திலுள்ள சுட்டுத்தன்மை ‘அந்த’ என்பதால் காக்கப்படுகிறது.
- source_word: עֹבְדֵי הַבָּעַל
  choice: பாகாலை வழிபடுகிறவர்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணிசெய்பவர்கள்’ என்றாலும், இச்சமயச் சூழலில் பாகாலுக்குச் செய்யும் வழிபாட்டுச் சேவையே கருத்தாக இருப்பதால் இந்தத் தேர்வு நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: அவனும் அவர்களுக்காக அந்த ஆடைகளை வெளியே கொண்டுவந்தான்
  rationale: தொடர்ச்சியான நிகழ்வை ‘அவனும்’ இயல்பாக இணைக்கிறது; לָהֶם என்பதையும் ஆடைகளின் தொகுப்புப் பொருளையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: עֹבְדֵי הַבָּעַל என்பதில் பணிசெய்தல் மற்றும் வழிபடுதல் ஆகிய பொருட்கள்
  choice: பாகாலை வழிபடுகிறவர்கள்
  alternative: பாகாலின் பணியாளர்கள்
  rationale: சூழல் பாகால் ஆலயத்தில் கூடிய சமயப் பற்றாளர்களைக் குறிக்கிறது. ‘வழிபடுகிறவர்கள்’ என்பது சமயச் சேவையின் பொருளைத் தெளிவாக்குகிறது; இருப்பினும் நேரடியான ‘பணியாளர்கள்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆடை அறை’ என்பது இயல்பான இடப்பெயராகவும், ‘வெளியே எடுத்துக்கொண்டு வா’ என்பது ஏவலின் இயக்கத்தையும் திசையையும் காக்கும் சொற்றொடராகவும் தேர்ந்தெடுக்கப்பட்டன.
