  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: ta
  text: 'ஆகவே, அறிந்துகொள்ளுங்கள்: யாவே ஆகாபின் வீட்டாருக்கு எதிராக உரைத்த ஒரு வார்த்தைகூட தரையில் விழாது[a]. யாவே தம் பணியாளரான எலியாவின் மூலம்[b] உரைத்ததைச் செய்திருக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தரையில் விழாது’ என்பது ‘தவறிப்போகாது’ அல்லது ‘நிறைவேறாமல் போகாது’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படையாக, ‘தம் பணியாளரான எலியாவின் கையால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: ஆகவே, அறிந்துகொள்ளுங்கள்
  rationale: ידע என்பதன் பன்மை ஏவல்வினையை நேரடியாகக் காட்டுகிறது; אֵפוֹא தரும் முடிவுரை சார்ந்த வலியுறுத்தலை ‘ஆகவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִפֹּל ... אַרְצָה
  choice: தரையில் விழாது
  rationale: நிறைவேறாமல் போதலைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מִדְּבַר יְהוָה
  choice: யாவே ... உரைத்த வார்த்தைகளில் ஒன்றுகூட
  rationale: பகுதிப்பொருள் தரும் מִן என்பதை ‘ஒன்றுகூட’ என வெளிப்படுத்தி, தீர்க்கதரிசனத்தின் எந்தப் பகுதியும் தவறாது என்ற பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: עַל בֵּית אַחְאָב
  choice: ஆகாபின் வீட்டாருக்கு எதிராக
  rationale: עַל இச்சூழலில் நியாயத்தீர்ப்பின் எதிர்நிலையைக் குறிக்கிறது; ‘வீட்டார்’ என்பது ஆகாபின் குடும்ப வழியையும் அரச வம்சத்தையும் உள்ளடக்கி, ‘வீடு’ என்ற எபிரெய வழக்கின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: וַיהוָה עָשָׂה אֵת אֲשֶׁר דִּבֶּר
  choice: யாவே ... உரைத்ததைச் செய்திருக்கிறார்
  rationale: செயல் நிறைவேறியிருப்பதை முடிவுற்ற நிகழ்வாகக் காட்டுகிறது; ‘உரைத்தது/செய்தது’ என்ற மூலத்தின் சொல்லிணைப்பையும் காக்கிறது.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: தம் பணியாளரான எலியாவின் மூலம்
  rationale: ביד குறிக்கும் முகமை அல்லது இடைமுகப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; நேரடி ‘கையால்’ வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயக்குழுவின் தனிப்பட்ட வழக்கை முன்னிறுத்தாமல் மூல வேறுபாட்டைக் காக்கிறது.
- issue: தீர்க்கதரிசன நிறைவேற்ற உருவகம்
  choice: வார்த்தைகளில் ஒன்றுகூட தரையில் விழாது
  alternative: ஒரு வார்த்தைகூட நிறைவேறாமல் போகாது
  rationale: தீர்க்கதரிசன வார்த்தை தவறாதது என்ற பொருளுடன், மூலத்தின் உயிருள்ள உருவகத்தையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- issue: எலியாவின் வழியாக உரைக்கப்பட்டதைக் குறிக்கும் முகமை
  choice: எலியாவின் மூலம்
  alternative: எலியாவின் கையால்
  rationale: தீர்க்கதரிசி இறைவார்த்தையின் இடைமுகம் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; மூலத்தின் சொற்படையான வடிவத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. எபிரெய உருவகமான ‘தரையில் விழாது’ தக்கவைக்கப்பட்டு விளக்கப்பட்டுள்ளது; இயல்பற்ற சொற்படையான முகமைத் தொடர் முதன்மை உரையில் ‘மூலம்’ என வழங்கப்பட்டுள்ளது.
