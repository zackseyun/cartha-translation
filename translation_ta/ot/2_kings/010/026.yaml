  yaml_path: translation/ot/2_kings/010/026.yaml
  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: ta
  text: பின்பு அவர்கள் பாகாலின் வழிபாட்டு இல்லத்திலிருந்து[c] தூண்களை[b] வெளியே கொண்டுவந்து, அவற்றை எரித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை எரித்தார்கள்’ என்று எபிரெய மொழியில் ஒருமைச் செயப்படுபொருள் பின்னொட்டு உள்ளது; ஆனால் அதற்கு முன் வரும் ‘தூண்கள்’ என்பது பன்மை. இங்கு கூட்டுப் பொருள் கருதப்படுவதால் ‘அவற்றை எரித்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வழிபாட்டுத் தூண்கள்’ அல்லது ‘நிறுத்தப்பட்ட கற்கள்.’ எபிரெயச் சொல் வழிபாட்டுடன் தொடர்புடைய நிறுத்தப்பட்ட கற்றூண்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பாகாலின் கோவில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: பின்பு அவர்கள் ... வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிபீல் வடிவம் ‘வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். தொடர் வாவ் கதையின் அடுத்த நிகழ்வைக் குறிப்பதால் ‘பின்பு’ இயல்பான தமிழில் காலவரிசையை வெளிப்படுத்துகிறது.
- source_word: מַצְּבוֹת
  choice: தூண்கள்
  rationale: מַצֵּבָה என்பது நிறுத்தப்பட்ட கல் அல்லது வழிபாட்டுடன் தொடர்புடைய கற்றூணைக் குறிக்கிறது. ‘தூண்கள்’ என்பது சுருக்கமான, வாசிக்க எளிய தெரிவு; வழிபாட்டுப் பொருள் சூழலாலும் அடிக்குறிப்பாலும் தெளிவாகிறது.
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் வழிபாட்டு இல்லம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு/இல்லம்’; இவ்வழிபாட்டுச் சூழலில் அது கோவிலைக் குறிக்கிறது. ‘வழிபாட்டு இல்லம்’ மூலத்தின் உருவகத்தைத் தக்கவைத்தபடி தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַיִּשְׂרְפוּהָ
  choice: அவற்றை எரித்தார்கள்
  rationale: எபிரெயச் சொல்லில் மூன்றாம் நபர் பெண்பால் ஒருமைச் செயப்படுபொருள் பின்னொட்டு இருந்தாலும், முன்வரும் ‘தூண்கள்’ பன்மை. தமிழில் தவறான பொருள் ஏற்படாமல் கூட்டுப் பொருளின்படி ‘அவற்றை’ என வழங்கப்படுகிறது; இலக்கண முரண்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
