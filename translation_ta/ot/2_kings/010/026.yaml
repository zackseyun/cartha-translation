translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பாகால்’ என்ற பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புக்கு ஏற்ப தரப்பட்டுள்ளது. ‘வழிபாட்டு இல்லம்’ என்பது ‘வீடு’ என்ற மூலச்சொல்லையும் கோவில் என்ற சூழற்பொருளையும் இணைக்கிறது; மாற்று நேரடி வாசகம் அடிக்குறிப்பில் உள்ளது.
