base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: ta
  text: காலையில் அவன் வெளியே வந்து நின்று, மக்கள் அனைவரிடமும், “நீங்கள் குற்றமற்றவர்கள்[a]. இதோ, நான் என் எஜமானுக்கு எதிராகச் சதிசெய்து அவரைக் கொன்றேன்; ஆனால் இவர்கள் எல்லாரையும் கொன்றவர் யார்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் நீதிமான்கள்” / “நீங்கள் நீதியுள்ளவர்கள்.” எபிரெயச் சொல் நீதியுள்ளவர்களாக இருப்பதையோ பழியற்றவர்களாக இருப்பதையோ குறிக்கலாம்; இங்குள்ள பொது நீதிமுறைச் சூழலில் “குற்றமற்றவர்கள்” என்பது பொருத்தமாக உள்ளது.
    reason: மூலச்சொல்லின் அறநீதி மற்றும் நீதிமன்றப் பொருட்களுக்கிடையிலான உண்மையான நுணுக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயக் கதைநடையின் தொடக்கச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது; ‘நிகழ்ந்தது’ என்பதைச் சேர்ப்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: அவன் வெளியே வந்து நின்று
  rationale: தொடர்ச்சியான இரு செயல்களையும், மக்கள்முன் நின்று பேசும் பொதுவான நிகழ்வமைப்பையும் காக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரிடமும்
  rationale: பொதுமக்கள் முழுவதையும் நோக்கிய உரையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צַדִּקִים אַתֶּם
  choice: நீங்கள் குற்றமற்றவர்கள்
  rationale: இங்கு அறநீதிப் பண்பைப் புகழ்வதைவிட, நடந்த கொலைகளுக்கான பழியிலிருந்து மக்களை விடுவிக்கும் நீதிமன்றப் பொருள் சூழலுக்கு ஏற்றது; மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் எபிரெயச் சொல்லுக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: קָשַׁרְתִּי עַל
  choice: எதிராகச் சதிசெய்து
  rationale: ஒருவருக்கு எதிராக அரசியல் சதித்திட்டம் தீட்டுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: இது இறைப்பட்டம் அல்ல, யெகூவின் அரசத் தலைவனைக் குறிக்கிறது; ‘எஜமான்’ அந்த அரசியல்-பணிவுறவைக் குழப்பமின்றித் தருகிறது.
- source_word: וָאֶהְרְגֵהוּ
  choice: அவரைக் கொன்றேன்
  rationale: הרג என்பதன் நேரடியான உயிர்க்கொலைப் பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: ஆனால் இவர்கள் எல்லாரையும் கொன்றது யார்?
  rationale: இணைப்புச் சொல்லின் சூழல்சார் எதிர்மறை மாறுபாட்டை ‘ஆனால்’ காட்டுகிறது; נכה இங்கு மரணத்தை விளைவித்த தாக்குதலைக் குறிப்பதால் ‘கொன்றது’ பொருத்தமானது. ‘இவர்கள்’ என்பதால் மூலத்தின் சுட்டுப்பெயர் நிலை காக்கப்படுகிறது.
theological_decisions:
- issue: צַדִּיקִים என்பதன் அறநீதி அல்லது நீதிமன்றப் பொருள்
  choice: முதன்மை உரையில் ‘குற்றமற்றவர்கள்’
  alternative: ‘நீதிமான்கள்’ அல்லது ‘நியாயத்தின் பக்கம் இருப்பவர்கள்’
  rationale: யெகூ தன் ஒரே கொலைச் செயலையும் தலைகள் வெட்டப்பட்ட பெருந்தொகைக் கொலைகளையும் எதிரெதிராக வைத்து மக்களின் பழியின்மையை அறிவிக்கிறான். எனினும் மூலச்சொல்லின் அறநீதி சார்ந்த நிழற்பொருள் அடிக்குறிப்பில் விடப்படுகிறது; வசனம் யெகூவின் கூற்றை மட்டுமே பதிவு செய்கிறது, இறுதியான தெய்வீகத் தீர்ப்பாக அதை மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் உரையின் வலியுறுத்தலைக் காக்கிறது; ‘எஜமான்’ என்பது இறைவனைக் குறிக்கும் ‘ஆண்டவர்’ என்ற சொல்லுடன் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்கிறது.
