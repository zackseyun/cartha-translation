base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: ta
  text: உங்கள் எஜமானின் மகன்களில் மிகச் சிறந்தவனும் நேர்மையானவனுமான ஒருவனைத் தேர்ந்தெடுத்து[a], அவனுடைய தந்தையின் அரியணையில் அவனை அமர்த்தி, உங்கள் எஜமானின் வம்சத்திற்காகப் போரிடுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் எஜமானின் மகன்களில் நல்லவனும் நேர்மையானவனுமான ஒருவனைப் பார்த்துத் தேர்ந்தெடுத்து.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “பாருங்கள்”; இங்கு ஆராய்ந்து தெரிவுசெய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “வீடு” என்ற சொல் இங்கு அரச குடும்பத்தையோ அரச வம்சத்தையோ குறிக்கிறது; வெறும் கட்டிடத்தைக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: தேர்ந்தெடுத்து
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘பாருங்கள்’ என்றாலும், இச்சூழலில் பலரை ஆராய்ந்து ஒருவரைத் தேர்ந்தெடுப்பதைக் குறிக்கிறது.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: மிகச் சிறந்தவனும் நேர்மையானவனுமான ஒருவனை
  rationale: பல மகன்களிடையே தகுதியான ஒருவரைத் தெரிவுசெய்யும் சூழலால், இணைந்த பெயரடைகள் ஒப்பீட்டு மேன்மையையும் ஒழுக்க நேர்மையையும் தெரிவிக்கின்றன.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: உங்கள் எஜமானின் மகன்களில்
  rationale: இங்கு אֲדֹנֵיכֶם என்பது கடவுளை அல்ல, மனித அரசத் தலைவரைக் குறிக்கிறது; ‘எஜமான்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: அவனுடைய தந்தையின் அரியணையில் அவனை அமர்த்தி
  rationale: இது வெறுமனே இருக்கையில் அமரவைப்பதை அல்ல, தந்தைக்குப் பின் அரசனாக நிறுவுவதைக் குறிக்கும் இயல்பான அரச மரபுச் சொற்றொடர்.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: உங்கள் எஜமானின் வம்சத்திற்காகப் போரிடுங்கள்
  rationale: בֵּית இங்கு கட்டிடத்தைவிட அரச குடும்பத்தையும் அரச வம்சத்தையும் குறிக்கிறது; தமிழில் ‘வம்சம்’ சூழற்பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אֲדֹנֵיכֶם என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இச்சொல் இங்கு யெகோவாவை அல்ல, மனித அரசத் தலைவரைக் குறிக்கிறது; ‘ஆண்டவர்’ என மொழிபெயர்த்தால் தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- issue: בֵּית என்பதன் பொருள்
  choice: வம்சம்
  alternative: வீடு
  rationale: போரிட்டு காக்க வேண்டியது ஒரு கட்டிடம் அல்ல, எஜமானின் அரச குடும்பமும் ஆட்சிவழியுமாகும்; ஆகவே சூழற்பொருளை வெளிப்படுத்தும் ‘வம்சம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் பன்மை கட்டளைகள் தமிழில் மரியாதை/பன்மை வினைமுற்றுகளால் காக்கப்பட்டுள்ளன.
