  source_fidelity: மூல எபிரெய வாக்கியத்தின் வினை, செய்பவர், பொருள், மற்றும் ‘இஸ்ரவேலிலிருந்து’ என்ற பிரித்தல்/அகற்றல் உறவு அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அழித்தொழித்தான்’ என்பது הִשְׁמִיד (Hiphil) வினையின் அழித்தல்/ஒழித்தல் வலிமையைச் சரியாக வெளிப்படுத்துகிறது. ‘பாகால்’ என்பதை ‘பாகால் வழிபாடு’ என விளக்கவுரையாக்காமல் வைத்திருப்பது மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
  naturalness: ‘இவ்வாறு யெகூ இஸ்ரவேலிலிருந்து பாகாலை அழித்தொழித்தான்’ என்பது நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கதைநடையாக உள்ளது. சொல்வரிசையும் வேற்றுமை உருபுகளும் இயல்பாக உள்ளன.
  terminology: ‘யெகூ,’ ‘இஸ்ரவேல்,’ ‘பாகால்’ ஆகிய பெயர்கள் நிலையான தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்றவை. ‘அழித்தொழித்தான்’ மூல வினையின் பொருத்தமான வலிமையைத் தருகிறது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை.
