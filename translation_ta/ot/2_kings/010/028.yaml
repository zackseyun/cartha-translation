source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: ta
  text: இவ்வாறு யெகூ இஸ்ரவேலிலிருந்து பாகாலை[a][b] அழித்தொழித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முற்றிலும் ஒழித்தான்’ அல்லது ‘அகற்றினான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் அழிவை அல்லது அகற்றுதலை ஏற்படுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அந்தப் பாகால்’ என்று குறிப்புச் சுட்டுடன் உள்ளது; தமிழில் தெய்வத்தின் பெயருடன் அது பொதுவாகத் தனியே மொழிபெயர்க்கப்படுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: அழித்தொழித்தான்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் அழிவையோ ஒழிப்பையோ ஏற்படுத்துவதைக் குறிக்கிறது. ‘அழித்தொழித்தான்’ என்பது அதன் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடனுள்ள சூழலைத் தாண்டி முற்றிலும் நிரந்தரமாக ஒழித்ததாகத் தேவையின்றி விளக்கவில்லை.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַבַּעַל
  choice: பாகாலை
  rationale: எபிரெயத்தில் குறிப்புச் சுட்டு இருந்தாலும், தமிழில் தெய்வத்தின் பெயருடன் அதைத் தனியே வெளிப்படுத்துவது இயல்பல்ல. ‘பாகால் வழிபாட்டை’ என்பது விளக்கவுரையாகிவிடும் என்பதால், மூலத்தின் பெயர்ச்சொல் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מִן பிரித்தல் அல்லது அகற்றுதலைக் குறிக்கிறது; ‘இஸ்ரவேலிலிருந்து’ என்பது அதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַ
  choice: இவ்வாறு
  rationale: முன்னுள்ள நிகழ்வுகளின் விளைவாக இந்தச் செயல் நிறைவேறியதைத் தமிழின் இயல்பான கதைநடையில் காட்டுகிறது.
theological_decisions:
- issue: ‘பாகால்’ என்பதன் குறிப்பு
  choice: இஸ்ரவேலிலிருந்து அகற்றப்பட்ட தெய்வம் அல்லது அதன் வழிபாட்டு அமைப்பைக் குறிக்கும் பெயராக ‘பாகால்’ என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாகால் வழிபாடு’ அல்லது ‘பாகாலை வழிபடுதல்’
  rationale: எபிரெய மூலத்தில் நேரடியாக ‘பாகால்’ என்றே உள்ளது. வழிபாடு ஒழிக்கப்பட்டது என்பதைச் சூழல் உணர்த்தினாலும், மொழிபெயர்ப்பில் அந்த விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான கதைநடை. ‘அழித்தொழித்தான்’ மூல வினையின் வலிமையைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
