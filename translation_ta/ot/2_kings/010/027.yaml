source:
  edition: WLC
  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: ta
  text: அவர்கள் பாகாலின் வழிபாட்டுத் தூணை இடித்தார்கள்; பாகாலின் வழிபாட்டு இல்லத்தையும்[a] இடித்து, அதைக் கழிப்பிடமாக்கினார்கள். அது இன்றுவரை கழிப்பிடமாகவே உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாகாலின் வீடு.’ எபிரெயத்தில் சொல்லளவில் ‘பாகாலின் வீடு’; வழிபாட்டுச் சூழலில் அது அவனுடைய ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: இடித்தார்கள்
  rationale: נתץ என்பது கட்டிடத்தையோ வழிபாட்டுப் பொருளையோ வலுக்கட்டாயமாகத் தகர்ப்பதைக் குறிக்கிறது; தமிழில் இரண்டுக்கும் இயல்பாகப் பொருந்தும் சொல்.
- source_word: מַצְּבַת
  choice: வழிபாட்டுத் தூண்
  rationale: מַצֵּבָה என்பது இங்கு பாகாலுடன் தொடர்புடைய வழிபாட்டு நெடுங்கல் அல்லது தூண்; வெறும் ‘தூண்’ என்பதைவிட அதன் பண்பாட்டு செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: הַבָּעַל
  choice: பாகால்
  rationale: கானானிய தெய்வத்தின் பெயர்/பட்டம் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் கோவில்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், இவ்வழிபாட்டுச் சூழலில் அது பாகாலுக்குரிய ஆலயத்தைக் குறிக்கிறது; ‘கோவில்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיְשִׂמֻהוּ
  choice: அதை ... ஆக்கினார்கள்
  rationale: שׂוּם + ל அமைப்பு ஒன்றை வேறொன்றாக மாற்றுதல் அல்லது ஆக்குதல் என்ற பொருளைத் தருகிறது.
- source_word: למחראות
  choice: ஒரு கழிப்பிடமாக
  rationale: இந்தப் பெயர்ச்சொல் மனிதக் கழிவுக்கான இடத்தைக் குறிக்கிறது; ‘கழிப்பிடம்’ நேரடியான, தற்போதைய, தேவையற்ற மென்மையாக்கம் இல்லாத மொழிபெயர்ப்பு.
- source_word: עַד הַיּוֹם
  choice: அது இன்றுவரை அப்படியே இருக்கிறது
  rationale: கதைசொல்லியின் காலம்வரை அந்த நிலை தொடர்ந்ததைத் தெரிவிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாகாலின் ஆலயத்தைக் குறிக்கும் בֵּית הַבַּעַל
  choice: பாகாலின் கோவில்
  alternative: பாகாலின் வீடு
  rationale: சொல்லளவில் ‘வீடு’ என்றிருந்தாலும், வழிபாட்டுச் சூழலில் ஆலயம் என்பதே பொருள். ‘கோவில்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது; எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: இழிவுபடுத்தலைக் குறிக்கும் למחראות
  choice: ஒரு கழிப்பிடம்
  alternative: கழிவிடம்
  rationale: பாகாலின் வழிபாட்டுத் தலம் முழுமையாக அவமதிக்கப்பட்டதை மூலவசனம் வெளிப்படையாகக் கூறுகிறது. ‘கழிப்பிடம்’ இதை மறைக்காமலும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், நேரடியான, கண்ணியமான நடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியைப் பேணியபடி, இறுதி மொழிப்பழக்கத்தைத் தமிழில் இயல்பாக்க இரண்டு வாக்கியங்களாக வழங்கப்பட்டது.
