source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: ta
  text: அந்நாட்களில் யாவே இஸ்ரவேலின் பகுதிகளைக் குறைக்கத் தொடங்கினார்[a]; அசகேல் இஸ்ரவேலின் நிலப்பரப்பு முழுவதிலும்[b] அவர்களைத் தாக்கி வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் பகுதிகளை வெட்டியகற்றத் தொடங்கினார்.” எபிரெய வினைச்சொல் இஸ்ரவேல் படிப்படியாகக் குறைக்கப்படுவதைக் குறிக்கிறது; சூழலில் இது நிலப்பரப்பு இழப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலின் எல்லை முழுவதிலும்.” எபிரெயச் சொல் ‘எல்லை’ என்பதையும், அந்த எல்லைக்குட்பட்ட ‘நிலப்பரப்பு’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்நாட்களில்
  rationale: எபிரெய மொழியின் பன்மை காலக் குறிப்பை இயல்பான, மரியாதையான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதன் ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: הֵחֵל
  choice: தொடங்கினார்
  rationale: செயல் ஆரம்பமானதைத் தெரிவிக்கும் எபிரெய வினை வடிவத்தின் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலின் நிலப்பரப்பைக் குறைக்க
  rationale: இங்கு முழு அழிவை விட, அடுத்துவரும் நிலப்பரப்பு இழப்புகளால் இஸ்ரவேல் படிப்படியாகக் குறைக்கப்படுவதையே சூழல் சுட்டுகிறது; வெட்டியகற்றும் மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּכֵּם
  choice: அவர்களைத் தாக்கி வீழ்த்தினான்
  rationale: נכה என்பதன் இராணுவச் சூழலிலான ‘தாக்குதல்/முறியடித்தல்’ வலிமையையும், அதன் மூன்றாம் நபர் பன்மை பின்னொட்டையும் வெளிப்படுத்துகிறது.
- source_word: חֲזָאֵל
  choice: அசகேல்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நிலப்பரப்பு முழுவதிலும்
  rationale: גְּבוּל என்பது ‘எல்லை’ அல்லது ‘எல்லைக்குட்பட்ட நிலப்பரப்பு’ எனப் பொருள்படலாம்; இங்கு தாக்குதலின் விரிவை இயல்பான தமிழில் தெரிவிக்க ‘நிலப்பரப்பு முழுவதிலும்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: இஸ்ரவேலைக் ‘குறைத்தது’ எவ்வாறு நிகழ்ந்தது
  choice: நிலப்பரப்பைக் குறைக்க
  alternative: இஸ்ரவேலை வெட்டிக் குறைக்க
  rationale: அடுத்த சொற்றொடர் அசகேலின் பரவலான இராணுவத் தாக்குதலைக் குறிப்பிடுவதால் நிலப்பரப்பு இழப்பு இங்கு வலுவாகக் குறிக்கப்படுகிறது; எனினும் மூலவினையின் உருவகமும் பரந்த பொருள் சாத்தியமும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நிலப்பரப்பு’ என்ற சொல் இராணுவ-புவியியல் சூழலைத் தெளிவாக்குகிறது; மூலமொழியின் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
