    issue: The first clause specifies "territory" rather than "parts of Israel."
    rationale: The Hebrew cutting/reduction expression does not itself specify that only land is being removed. The context makes territorial losses likely, but the translation should not eliminate the broader wording of the source. "பகுதிகள்" preserves the source expression while the footnote can identify territorial loss as the likely contextual reference.
