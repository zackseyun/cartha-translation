base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: ta
  text: அந்தக் கடிதம் அவர்களிடம் வந்ததும், அவர்கள் அரசனின் மகன்களாகிய எழுபது பேரைப் பிடித்து வெட்டிக் கொன்றார்கள். பின்பு அவர்களுடைய தலைகளைக் கூடைகளில்[a] வைத்து, யெஸ்ரயேலில் இருந்த அவனிடம் அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பானைகளில்’ அல்லது ‘குடங்களில்’; எபிரெயச் சொல் பலவகையான கொள்கலன்களைக் குறிக்கலாம். அவை பின்னப்பட்ட கூடைகள்தான் என்பது உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: அந்தக் கடிதம்
  rationale: இச்சூழலில் இது யெகூ அனுப்பிய எழுத்துப்பூர்வமான செய்தியைக் குறிக்கிறது; எனவே இயல்பாகவும் குறிப்பாகவும் ‘கடிதம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்கள்
  rationale: அரசனின் ஆண் பிள்ளைகளையும் அரச வம்சத் தொடர்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁחֲטוּ
  choice: வெட்டிக் கொன்றார்கள்
  rationale: שׁחט என்பதிலுள்ள கொடூரமான படுகொலைப் பொருளைத் தட்டையாக்காமல், நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁבְעִים אִישׁ
  choice: அந்த எழுபது பேரையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட அரசனுடைய மகன்களே இந்த எழுபது பேர் என்பதைத் தமிழில் தெளிவாக இணைக்கிறது; ‘பேர்’ மனிதர்களை எண்ணுவதற்கான இயல்பான வடிவம்.
- source_word: רָאשֵׁיהֶם
  choice: அவர்களுடைய தலைகள்
  rationale: மூலத்தின் நேரடியான, கொடூரமான குறிப்பை மறைமுகமாக்காமல் அப்படியே காக்கிறது.
- source_word: בַּדּוּדִים
  choice: கூடைகளில்
  rationale: தலைகளை எடுத்துச் செல்லப் பயன்பட்ட பெரிய கொள்கலன்கள் என்ற சூழலுக்கு ‘கூடைகள்’ பொருந்துகிறது; எனினும் எபிரெயச் சொல் பானைகள் அல்லது வேறு பாத்திரங்களையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: உடனடிச் சூழலில் இச்சுட்டுப்பெயர் யெகூவைக் குறிக்கிறது; மூலத்திலுள்ள சுட்டுப்பெயர் பெயராக மாற்றப்படாமல் காக்கப்பட்டது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேலில் இருந்த
  rationale: இடத்தைக் குறிக்கும் திசை விகுதி யெஸ்ரயேலை நோக்கிய அனுப்புதலைக் காட்டுகிறது. தமிழில் பெறுநரின் இருப்பிடத்துடன் இணைத்துக் கூறுவது இயல்பானது.
