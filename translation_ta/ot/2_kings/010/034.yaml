source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: யெகூவின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவனுடைய வல்லமை அனைத்தும்[a] இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வல்லமையான செயல்கள் அனைத்தும்.”
    reason: lexical_alternative
  - marker: b
    text: இது அரசர்களின் ஆட்சிக்கால நிகழ்வுகளைப் பதிவு செய்த ஓர் ஆவணத் தொகுப்பைக் குறிக்கிறது; வேதாகமத்தில் உள்ள நாளாகமப் புத்தகத்தை அவசியம் குறிக்காது.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: யெகூவின் மற்ற செயல்களும்
  rationale: அரசாட்சிச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ என்பதைக் காட்டிலும் அரசனின் செயல்கள் அல்லது ஆட்சிக்கால நிகழ்வுகளைக் குறிக்கிறது; וְיֶתֶר என்பதன் ‘மற்றவை’ என்ற பொருளும் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: כָל என்பதன் முழுமையையும் எபிரெய உறவுநிலைத் தொடரின் நேரடியான பொருளையும் தெளிவாக வழங்குகிறது.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: அவனுடைய வல்லமை அனைத்தும்
  rationale: גְּבוּרָה வலிமை, வீரம் அல்லது அந்த வலிமையை வெளிப்படுத்திய செயல்கள் ஆகியவற்றைக் குறிக்கலாம். ‘வல்லமை’ மூலத்தின் சுருக்கத்தையும் பொருள் விரிவையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய வினாவடிவத்தை இயல்பான தமிழில் வினாவாகவே காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: இது இஸ்ரவேல் அரசர்களைச் சார்ந்த அரச ஆவணத் தொகுப்பின் தலைப்பு. ‘புத்தகத்தில்’ என்பது தமிழில் பதிவிடப்பட்ட இடத்தைக் கூறும் இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ‘நாளாகமப் புத்தகம்’ என்ற ஆவணத்தின் அடையாளம்
  choice: இஸ்ரவேல் அரசர்களின் அரசகால ஆவணத் தொகுப்பாகப் புரிந்துகொள்ளும் வகையில் தலைப்பை மொழிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: வேதாகமத்தில் உள்ள நாளாகமப் புத்தகமே இது என்று வாசிக்க இடமளித்தல்
  rationale: மூலவசனம் அரசர்களைப் பற்றிய ஓர் ஆவண ஆதாரத்தை மேற்கோளிடுகிறது; அது வேதாகமத்தின் நாளாகம நூல் என்று உரை கூறவில்லை. எனவே தேவையற்ற அடையாளப்படுத்தலைத் தவிர்க்க வேண்டும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வரலாற்று நூலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. தொடக்க וְ-க்கு மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பிறகு வைக்கப்பட்டுள்ளன.
