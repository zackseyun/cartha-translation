source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ יֵהוּא֙ עַל יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁמֹנֶֽה שָׁנָ֖ה בְּ/שֹׁמְרֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/036.yaml
  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: ta
  text: யெகூ இஸ்ரவேலின்மேல் சமாரியாவில் அரசாண்ட காலம் இருபத்தெட்டு ஆண்டுகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: காலம்
  rationale: சொல்லர்த்தமாக ‘நாட்கள்’ என்றாலும், இங்கு அரசாட்சியின் நீடிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர்; நவீன தமிழில் ‘காலம்’ இயல்பாகவும் துல்லியமாகவும் பொருளைத் தருகிறது.
- source_word: אֲשֶׁר מָלַךְ
  choice: அரசாண்ட
  rationale: יחס வாக்கியத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக மாற்றுகிறது; מלך என்பதன் மன்னராட்சி சார்ந்த பொருளையும் காக்கிறது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל என்பது இங்கு ஆட்சிக்குட்பட்ட மக்களையோ நாட்டையோ குறிக்கிறது; ‘-ன்மேல்’ அந்த ஆட்சித் தொடர்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: இருபத்தெட்டு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் இயல்பான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; சமாரியா யெகூ அரசாண்ட அரச மையம் என்பதைத் தமிழ் இடவேற்றுமை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான அரசர்-காலச் சுருக்க நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘நாட்கள்’ என்ற மரபுத்தொடர் சொல்லுக்குச் சொல் மொழிபெயர்க்கப்படாமல், அதன் காலநீடிப்பு பொருள் ‘காலம்’ என வழங்கப்பட்டுள்ளது.
