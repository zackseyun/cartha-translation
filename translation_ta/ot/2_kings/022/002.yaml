  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் சரியானதைச் செய்தான்; தன் தந்தையான தாவீதின் முழு வழியிலும் நடந்தான்[a]; வலப்புறமாகவோ இடப்புறமாகவோ விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தன் தந்தையான தாவீது’ என்று உள்ளது. இங்கு ‘தந்தை’ என்பது முன்னோர் அல்லது அரச வம்சத்தின் முற்பிதா என்ற விரிவான பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: நேர்மையானதைச் செய்து
  rationale: הַיָּשָׁר என்பது பெயர்ச்சொல் போலச் செயல்பட்டு, ஒழுக்கரீதியில் சரியானதைச் செய்தான் என்ற பொருளைத் தருகிறது; இயல்பான தமிழில் இதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: எபிரெய மதிப்பீட்டு மரபுத்தொடரின் பார்வை உருவகத்தைப் பாதுகாத்து, தெய்வீகப் பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: வழி முழுவதிலும் நடந்தான்
  rationale: நடத்தை குறிக்கும் ‘வழியில் நடத்தல்’ உருவகத்தையும், כָל தெரிவிக்கும் முழுமையான ஒத்திசைவையும் காக்கிறது.
- source_word: דָּוִד אָבִיו
  choice: தன் தந்தையாகிய தாவீது
  rationale: எபிரெய மூலத்தின் வம்ச மரபுச் சொல்லாட்சியை அப்படியே பாதுகாக்கிறது; இங்கு ‘தந்தை’ என்பது முற்பிதா என்ற விரிவான பொருளுடையது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ விலகவில்லை
  rationale: சரியான பாதையிலிருந்து எந்தத் திசையிலும் பிறழாததைச் சொல்லும் மூல உருவகத்தையும், தமிழின் இயல்பான இணை அமைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் ‘யாவே’ என்று வழங்குவது பெயரின் தனித்தன்மையை மறைக்காது.
- issue: ‘தாவீது அவன் தந்தை’ என்பதன் வம்சப் பொருள்
  choice: மூலச் சொல்லாட்சியை உரையில் வைத்து அடிக்குறிப்பில் விளக்குதல்
  alternative: தன் மூதாதையாகிய தாவீது
  rationale: אָב இங்கு உடனடி உயிரியல் தந்தையைக் குறிக்காமல் அரச வம்ச முன்னோரை குறிக்கிறது. ‘மூதாதை’ என்று உரையிலேயே தெளிவாக்குவது பொருளைத் தீர்மானித்துவிடும்; மூலத்தின் பண்பாட்டு சொல்லாட்சியை வைத்திருப்பது சிறந்தது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வழியில் நடந்தான்’ மற்றும் ‘வலப்புறமோ இடப்புறமோ விலகவில்லை’ என்பவை மூலத்தின் ஒன்றோடொன்று தொடர்புடைய பாதை உருவகங்களைப் பாதுகாக்கின்றன; உடனடியாகப் புரியாத வம்சப் பயன்பாடு மட்டும் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
