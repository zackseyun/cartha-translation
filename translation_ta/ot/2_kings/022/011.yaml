  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: ta
  text: அரசன் சட்டநூலின்[a] வார்த்தைகளைக் கேட்டபோது, தன் உடைகளைக் கிழித்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சட்டச் சுருள்.’ எபிரெயச் சொல் סֵפֶר எழுதப்பட்ட சுருளையோ நூல் வடிவ ஆவணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேட்டபோது
  rationale: வாவ் தொடருடன் வரும் כ + infinitive construct காலச் சூழலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது; தனியாக ‘அப்போது நிகழ்ந்தது’ என்று சேர்ப்பது தேவையில்லை.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைச் சுட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: வாசிக்கப்பட்ட ஆவணத்தின் சொற்கள் அல்லது உரையைக் குறிக்கிறது; எபிரெய மூலத்தின் நேரடியான தொடர்பைத் தக்கவைக்கிறது.
- source_word: סֵפֶר הַתּוֹרָה
  choice: திருச்சட்ட நூல்
  rationale: סֵפֶר என்பது நூல் அல்லது சுருள் ஆவணத்தையும், תּוֹרָה இச்சூழலில் உடன்படிக்கைச் சட்டத்தையும் குறிக்கிறது. ‘திருச்சட்ட நூல்’ என்பது நவீனத் தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது; ‘சுருள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்துக்கொண்டான்
  rationale: קרע என்பதன் ‘கிழித்தல்’ என்ற பொருளையும், துயரம் மற்றும் அதிர்ச்சியை வெளிப்படுத்தும் தன்மீது செய்யப்பட்ட செயல் என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
