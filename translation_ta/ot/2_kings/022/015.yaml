id: 2KI.22.15
reference: 2 Kings 22:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: ta
  text: 'அவள் அவர்களிடம் கூறினாள், “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: உங்களை என்னிடம் அனுப்பிய மனிதனிடம் சொல்லுங்கள்:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: அவள் அவர்களிடம்
  rationale: வழக்கமான எபிரெய கதைத் தொடரில் வரும் wayyiqtol வடிவைத் தமிழில் இயல்பான தொடர்ச்சியுடன் வழங்குகிறது; பேசுபவர் பெண் என்பதையும் வினை வடிவம் தெளிவாக்குகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரத்தையும் நேரடித் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אִמְרוּ
  choice: சொல்லுங்கள்
  rationale: குழுவினரை நோக்கிய பன்மை ஏவலை மரியாதை/பன்மை வடிவில் தெளிவாகக் காட்டுகிறது.
- source_word: לָאִישׁ
  choice: மனிதனிடம்
  rationale: אִישׁ என்பது இங்கு குறிப்பிட்ட ஆண் நபரைக் குறிக்கும் ஒருமை ஆண்பால் பெயர்ச்சொல்; பாலினக் குறிப்பை நீக்காமல் தமிழில் வழங்குகிறது.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: உங்களை என்னிடம் அனுப்பிய
  rationale: உறவுத்தொடரையும் அனுப்பப்பட்டவர்களின் பன்மையையும் இலக்கையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: אִישׁ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: மனிதன்
  alternative: நபர்
  rationale: இச்சொல் குறிப்பிட்ட ஆண் ஒருவரைக் குறிக்கிறது; சூழலில் அது அரசனைக் குறித்தாலும், மூல வசனம் பயன்படுத்தும் பொதுவான 'மனிதன்' என்ற சொல்லை 'அரசன்' என விளக்கி விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமான நடை. தீர்க்கதரிசன அறிவிப்புச் சூத்திரம் இயல்பான தமிழில் வலிமையுடன் வைக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நேரடி உரையின் அறிமுகமாக இருப்பதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
