  to: 'அவள் அவர்களிடம் கூறினாள், “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: உங்களை என்னிடம் அனுப்பிய மனிதனிடம் சொல்லுங்கள்:”'
