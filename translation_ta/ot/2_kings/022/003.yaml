  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: ta
  text: 'யோசியா அரசனுடைய ஆட்சியின் பதினெட்டாம் ஆண்டில், அரசன் மெசுல்லாமின் மகனான அசலியாவின் மகன் சாப்பான் என்னும் எழுத்தரை யாவேயின் இல்லத்திற்கு[a] அனுப்பி, இவ்வாறு சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “யாவேயின் ஆலயம்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “யாவேயின் வீடு.”
    reason: ‘இல்லம்/வீடு’ என்ற மூல உருவகம் இங்கு ஆலயத்தைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்தும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיְהִי
  choice: …ஆண்டில்
  rationale: தொடரும் வரலாற்றுக் கதைப்பகுதியை அறிமுகப்படுத்தும் எபிரெயக் கதையாடல் வடிவம். தமிழில் தனியாக ‘அப்போது நிகழ்ந்ததாவது’ என்று சேர்க்காமல், காலக் குறிப்போடு இயல்பாகத் தொடங்குவது பொருளையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: யோசியா அரசனுடைய ஆட்சியின் பதினெட்டாம் ஆண்டில்
  rationale: இது அரசாட்சிக் காலக் கணக்கைக் குறிக்கும் வழக்கமான சொற்றொடர்; ‘ஆட்சியின்’ என்பது அந்தப் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: அரசன் … அனுப்பி
  rationale: மூலத்தில் யோசியா குறிப்பிடப்பட்ட பின்னரும் ‘அரசன்’ மீண்டும் வருகிறது; அந்த மீளுரைத்தல் பாதுகாக்கப்படுகிறது.
- source_word: שָׁפָן
  choice: சாப்பான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ்ச் சொலிபெயர்ப்பு.
- source_word: בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: மெசுல்லாமின் மகனான அசலியாவின் மகன்
  rationale: எபிரெய வம்சத் தொடரைத் தெளிவான தமிழ் உறவுமுறை அமைப்பில் பாதுகாக்கிறது.
- source_word: הַסֹּפֵר
  choice: எழுத்தர்
  rationale: இந்தச் சொல் எழுத்தர் அல்லது அரசுச் செயலர் போன்ற அதிகாரியைக் குறிக்கலாம். உடனடிச் சூழல் குறிப்பிட்ட பதவியை உறுதியாக நிர்ணயிக்காததால் பரந்த, புரிந்துகொள்ளக்கூடிய ‘எழுத்தர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வீடு/இல்லம்’; இங்கு அது ஆலயத்தைக் குறிக்கிறது. மூல உருவகத்தை முதன்மை உரையில் காத்து, பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத்தில் உள்ள இறைத் தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு சொன்னார்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வடிவம்; தமிழ் நிறுத்தக்குறியுடன் இயல்பாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதன் உருவகமும் குறிக்கப்படும் இடமும்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: ‘இல்லம்’ மூலச் சொல்லமைப்பை நெருக்கமாகக் காக்கிறது; சூழலில் அது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது, இரு வாசிப்புகளையும் தேவையின்றி ஒன்றாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்றுக் குறிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுத்தர்’ பழமையான ‘எழுத்தன்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு இயல்பானது. வம்சத் தொடர் குழப்பமின்றி வாசிக்க உறவுமுறைச் சொற்கள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டுள்ளன.
