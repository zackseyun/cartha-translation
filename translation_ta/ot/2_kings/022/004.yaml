base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: ta
  text: “தலைமைக் குருவாகிய இல்க்கியாவிடம் மேலே போ. யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்பட்ட வெள்ளியை அவன் மொத்தத்தைக் கணக்கிடட்டும். அதை வாயிற்காவலர்கள்[a] மக்களிடமிருந்து திரட்டியிருக்கிறார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “வாசற்படியைக் காப்பவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: போ
  rationale: எபிரெய வினைச்சொல் நேரடியாக ‘மேலே போ’ எனப் பொருள்படலாம்; இங்கு அரசன் ஆலயத்திலுள்ள தலைமைக் குருவிடம் செல்லும்படி கட்டளையிடுவதால், இயல்பான நவீனத் தமிழில் ‘போ’ என வழங்கப்பட்டது.
- source_word: חִלְקִיָּהוּ
  choice: இல்க்கியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: முதன்மையான குருத்துவப் பதவியைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: וְיַתֵּם
  choice: கணக்கிட்டு மொத்தத் தொகையை நிர்ணயிக்கட்டும்
  rationale: இச்சூழலில் வெள்ளியை முடிவுறக் கணக்கிடுதல் அல்லது அதன் மொத்தத்தைத் தீர்மானித்தல் என்ற நிர்வாகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: மூலத்தில் உள்ள உலோகப் பெயரைப் பாதுகாக்கிறது; இங்கு அது பணமாகப் பயன்பட்டது என்பது சூழலால் தெளிவாகிறது.
- source_word: הַמּוּבָא
  choice: கொண்டுவரப்பட்ட
  rationale: Hophal பெயரெச்சத்தின் செயப்பாட்டு பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: ‘யெகோவாவின் வீடு’ என்பதே சொற்பொருள்; ஆனால் இங்கு வழிபாட்டுக் கட்டடத்தைக் குறிப்பதால் ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: אָסְפוּ
  choice: திரட்டியிருந்தார்கள்
  rationale: நிதியை மக்களிடமிருந்து சேகரித்த செயலைக் குறிக்கிறது; கட்டளைக்கு முன்பே நடந்த செயல் என்பதை இறந்தகால நிறைவு வடிவம் காட்டுகிறது.
- source_word: שֹׁמְרֵי הַסַּף
  choice: வாயிற்காவலர்கள்
  rationale: சொற்பட ‘வாசற்படியைக் காப்பவர்கள்’; ஆலய நுழைவாயிலைக் காத்த பணியாளர்களைக் குறிக்கும் இயல்பான தமிழாக்கம். சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֵאֵת הָעָם
  choice: மக்களிடமிருந்து
  rationale: மூலத்தின் பொருளை நேராகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் ‘ஆண்டவர்’ போன்ற பட்டத்தால் மாற்றப்படவில்லை. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிப்பெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசனின் நேரடி கட்டளைத் தொனி பாதுகாக்கப்பட்டது; நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டது.
