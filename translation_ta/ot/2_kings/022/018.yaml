base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: ta
  text: 'ஆனால், யாவேயிடம் விசாரிப்பதற்காக உங்களை அனுப்பிய யூதாவின் அரசனிடம் நீங்கள் இவ்வாறு சொல்ல வேண்டும்: “இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீ கேட்ட வார்த்தைகளோ—’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இந்தத் தொடர் இங்கே நிறைவுபெறாமல் நின்று, அடுத்த வசனத்தில் தொடர்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: ஆனால், ... அரசனிடம்
  rationale: முந்தைய செய்தியிலிருந்து யூதாவின் அரசனை நோக்கித் திரும்பும் உரையாடல் மாற்றத்தை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது; אֶל என்பதன் திசைநோக்கும் பொருள் ‘அரசனிடம்’ என்பதில் நிலைக்கிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளைத் தெளிவான, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: உங்களை அனுப்பிய
  rationale: அரசனை அவன் செய்த செயலால் அடையாளப்படுத்தும் பெயரெச்சத் தொடரைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: யாவேயிடம் விசாரிப்பதற்காக
  rationale: இந்தத் தீர்க்கதரிசன ஆலோசனைச் சூழலில் דרשׁ என்பது இறைவனுடைய வழிகாட்டுதலைக் கேட்டு அறிதலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட தமிழொலிப்பெயர்ப்பில் தருகிறது.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: நீங்கள் இவ்வாறு சொல்ல வேண்டும்
  rationale: செய்தியை அறிவிக்கும்படி கொடுக்கப்படும் கட்டளையின் வலிமையையும் כֹּה என்பதன் அறிமுகச் செயல்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் நிகழ்கால அறிவிப்பு வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: மூலத்தின் உடைமைத் தொடர்பையும் உடன்படிக்கை சார்ந்த அடையாளத்தையும் நேரடியாகக் காக்கிறது.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—
  rationale: அடுத்த வசனத்தில் நிறைவுபெறும் தொங்குநிலைத் தலைப்புத் தொடரை முடித்துவிடாமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமலும் ‘Jehovah’ வடிவத்தை ஏற்காமலும் ‘Yahweh’ என்பதற்குரிய தமிழொலிப்பாகத் தரப்பட்டுள்ளது.
- issue: இறுதித் தொடரின் இலக்கணத் தொங்குநிலை
  choice: ‘நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—’ என்று திறந்த நிலையில் வைத்தல்
  alternative: அடுத்த வசனத்தின் கருத்தை இங்கே சேர்த்து வாக்கியத்தை நிறைவு செய்தல்
  rationale: எபிரெய வசனம் இங்கே கருத்தை நிறைவு செய்யாமல் நிற்கிறது; அதன் பொருள்சார் எதிர்பார்ப்பையும் அடுத்த வசனத்துடனான தொடர்பையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தூதுச் சூத்திரத்தின் முறைமைத் தன்மை காக்கப்பட்டாலும் பழமையான அல்லது செயற்கையான சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன; இறுதியில் உள்ள கோடு மூலத்தின் நிறைவுறாத தொடரைக் குறிக்கிறது.
