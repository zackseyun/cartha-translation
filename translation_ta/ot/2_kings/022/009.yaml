  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: ta
  text: பின்பு எழுத்தரான சாப்பான் அரசரிடம் வந்து, அரசருக்குச் செய்தியைத் திரும்ப அறிவித்தான். அவன், “ஆலயத்தில்[b] காணப்பட்ட வெள்ளியை உமது பணியாளர்கள் கொட்டியுள்ளனர்[a]; அதை யாவேயின் ஆலயத்தின் பொறுப்பில் நியமிக்கப்பட்ட தொழிலாளர்களின் கையில் கொடுத்துள்ளனர்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காலிசெய்துள்ளனர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் நேரடியாக ‘கொட்டியுள்ளனர்’ என்ற படிமத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆலயம்; மூலமொழியில் நேரடியாக ‘இல்லம்’ என்று உள்ளது.
    reason: cultural_note
  - marker: c
    text: அதாவது, அவர்களிடம் ஒப்படைத்துள்ளனர்; மூலமொழியில் நேரடியாக ‘அவர்களுடைய கையில் கொடுத்துள்ளனர்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: எழுத்தர்
  rationale: அரசவையில் செயலர் என்ற பொருளும் இருக்கலாம்; எனினும் எபிரெயச் சொல்லின் அடிப்படைப் பொருளையும் பதவியின் தன்மையையும் ‘எழுத்தர்’ காக்கிறது.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: செய்தியைத் திரும்ப அறிவித்தான்
  rationale: திரும்ப வந்து அறிக்கை அளித்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִתִּיכוּ
  choice: கொட்டி வெளியே எடுத்துள்ளனர்
  rationale: இங்கு உலோகத்தை உருக்குவது பொருளல்ல; சேகரிக்கப்பட்ட வெள்ளியை ஒரு கொள்கலனிலிருந்து காலிசெய்து எடுப்பதைக் குறிக்கும் உருவகத்தை இத்தொடர் காக்கிறது.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: இந்தச் சொல் பணத்தைக் குறிக்கக்கூடியதாயினும், மூலமொழியின் நேரடிப் பொருளான ‘வெள்ளி’ இங்கு பொருத்தமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: ஆலயத்தில் காணப்பட்ட
  rationale: சூழலில் ‘வீடு/இல்லம்’ என்பது யாவேயின் ஆலயத்தைக் குறிப்பதால், சாதாரண வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது; நேரடிச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: அதை ... கையில் கொடுத்துள்ளனர்
  rationale: ஒருவரின் பொறுப்பில் ஒப்படைத்தல் என்ற பொருளையும் ‘கையில் கொடுத்தல்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: தொழிலாளர்கள்
  rationale: ஆலயப் பழுதுபார்ப்புப் பணியைச் செய்பவர்களைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: הַמֻּפְקָדִים
  choice: பொறுப்பாக நியமிக்கப்பட்ட
  rationale: அவர்கள் பொறுப்பில் அமர்த்தப்பட்டவர்கள் என்ற செயப்பாட்டு நுணுக்கத்தையும் மேற்பார்வைப் பொறுப்பையும் வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: ‘யாவேயின் இல்லம்’ என்பதன் சூழல்சார் பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதவாக்கியத்தில் நேரடியாக வரும் கடவுளின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு அண்மையாகத் தமிழில் வழங்குகிறது; எபிரெய உயிரொலியின் துல்லிய வடிவம் உறுதியாகத் தெரியாத நிலையையும் இது தேவையற்ற கோட்பாட்டுத் தீர்ப்பால் நிரப்புவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. அரசவைக் கூறுபாட்டை உணர்த்த ‘அரசர்’, ‘உமது பணியாளர்கள்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் மீளுரைத்தல், பணத்தை ஊற்றி/காலிசெய்து எடுத்தல் என்ற படிமம், ‘கையில் கொடுத்தல்’ என்ற நிர்வாக மரபுத்தொடர் ஆகியவை இயன்ற அளவு காக்கப்பட்டுள்ளன.
