translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. அரசனுக்கும் ஆசாரியனுக்கும் சூழலுக்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; சாப்பானைக் குறிக்கும் கதைசொல்லியின் வினைகள் மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளன.
