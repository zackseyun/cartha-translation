base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: ta
  text: பின்பு எழுத்தரான சாப்பான் அரசனிடம், “ஆசாரியனாகிய இல்க்கியா என்னிடம் ஒரு நூலை[a] கொடுத்திருக்கிறார்” என்று தெரிவித்தான். சாப்பான் அதை அரசனின் முன்னிலையில் வாசித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சுருளை.” எபிரேயச் சொல் பொதுவாக எழுதப்பட்ட ஓர் ஆவணத்தைக் குறிக்கலாம்; அது எந்த வடிவில் இருந்தது என்பதை அந்தச் சொல்லே குறிப்பாகத் தெரிவிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய்தல், தெரிவித்தல்’ என்று பொருள்படும்; அரண்மனைச் செய்தியறிவிப்பின் சூழலுக்கு ‘தெரிவித்தான்’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַסֹּפֵר
  choice: எழுத்தரான
  rationale: סֹפֵר என்பது எழுத்துப் பணியையும் அரச அலுவலர் பொறுப்பையும் குறிக்கலாம். ‘எழுத்தர்’ வரலாற்றுப் பதவியைத் தக்கவைத்தபடியே நவீனத் தமிழில் புரியக்கூடியது.
- source_word: סֵפֶר
  choice: ஒரு நூலை
  rationale: סֵפֶר என்பது பொதுவாக எழுதப்பட்ட ஆவணம் அல்லது நூலைக் குறிக்கும்; அதன் உடல் வடிவத்தைத் தானாகவே வரையறுப்பதில்லை. எபிரெயில் குறிப்புச் சுட்டி இல்லாததால் ‘ஒரு’ பயன்படுத்தப்பட்டது.
- source_word: נָתַן לִי
  choice: என்னிடம் கொடுத்திருக்கிறார்
  rationale: நிறைவுற்ற செயலுக்கு தற்போதைய தொடர்பு இருப்பதை நேர்ப்பேச்சில் இயல்பாக வெளிப்படுத்துகிறது; இல்க்கியாவைப் பற்றிய மரியாதை ஒருமை தமிழ் வழக்குக்கு ஏற்றது.
- source_word: וַיִּקְרָאֵהוּ
  choice: அதை ... வாசித்தான்
  rationale: எழுதப்பட்ட ஒன்றைக் கருப்பொருளாகக் கொண்ட קרא இங்கு சத்தமாக வாசிப்பதைக் குறிக்கிறது. அரசனின் முன்னிலையில் என்ற தொடரால் வாய்விட்டு வாசித்தது தெளிவாகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையில்
  rationale: ஒருவரின் சந்நிதியில் அல்லது முன்னிலையில் ஒரு செயலைச் செய்வதைக் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் வழங்குகிறது.
- source_word: חִלְקִיָּה
  choice: இல்க்கியா
  rationale: எபிரெயப் பெயரான חִלְקִיָּהוּ/חִלְקִיָּה என்பதன் ஒலிப்பைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: שָׁפָן
  choice: சாப்பான்
  rationale: எபிரெயப் பெயரின் நீண்ட முதல் உயிரையும் மெய்யொலியையும் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
