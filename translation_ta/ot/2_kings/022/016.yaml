revisions:
- from: 'யாவே இவ்வாறு கூறுகிறார்: “இதோ, யூதாவின் அரசன் வாசித்த புத்தகத்திலுள்ள வார்த்தைகள் அனைத்தையும் இந்த இடத்தின்மீதும் இதில் குடியிருப்பவர்கள்மீதும் பேரழிவாக[a] வரச்செய்கிறேன்.”'
  to: 'யாவே இவ்வாறு கூறுகிறார்: “இதோ, இந்த இடத்தின்மீதும் இதில் குடியிருப்பவர்கள்மீதும் பேரிடரைக் கொண்டுவருகிறேன்—யூதாவின் அரசன் வாசித்த புத்தகத்தின் எல்லா வார்த்தைகளையும்.”'
  rationale: ரָעָה-வுக்கு ‘பேரிடர்’ பயன்படுத்தப்பட்டு, மூலத்தில் பேரிடரும் புத்தகத்தின் எல்லா வார்த்தைகளும் கொண்டுள்ள நெருங்கிய appositional தொடர்பு தமிழில் கோடிட்ட இணைப்பால் காக்கப்பட்டுள்ளது. ‘நிறைவேற்றுவேன்’ அல்லது ‘அதன்படி’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு உரையில் இடப்படவில்லை; ஏனெனில் அது ‘பேரிடர்’ என்ற சொல்லுக்குப் பொருத்தப்பட வேண்டும்.
