source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: ta
  text: 'யாவே இவ்வாறு கூறுகிறார்: “இதோ, இந்த இடத்தின்மீதும் இதில் குடியிருப்பவர்கள்மீதும் பேரிடரைக் கொண்டுவருகிறேன்—யூதாவின் அரசன் வாசித்த புத்தகத்தின் எல்லா வார்த்தைகளையும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் மாண்பையும் நேரடியான இறை அறிவிப்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது; יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: வரவிருக்கும் செயலை வலியுறுத்தும் எபிரெயச் சுட்டுச்சொல்லின் solemn immediacy-ஐ சுருக்கமாகக் காக்கிறது.
- source_word: מֵבִיא
  choice: வரச்செய்கிறேன்
  rationale: எபிரெயப் பெயரெச்ச வினையின் உடனடி அல்லது நெருங்கிய செயற்பாட்டு வலிமையை நிகழ்கால வடிவில் வெளிப்படுத்துகிறது.
- source_word: רָעָה
  choice: பேரழிவாக
  rationale: இங்கு இச்சொல் ஒழுக்கத் தீமையை அல்ல, இறைத்தீர்ப்பாக வரும் அழிவைக் குறிக்கிறது. ‘பேரழிவு’ அந்தச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: இந்த இடத்தின்மீதும் இதில் குடியிருப்பவர்கள்மீதும்
  rationale: தீர்ப்பு ஓர் இடத்தையும் அதன் குடியிருப்போரையும் நோக்கி வருவதைத் தெளிவாகவும் மூலத்தின் இணை அமைப்பைக் காத்தும் தெரிவிக்கிறது.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: புத்தகத்திலுள்ள வார்த்தைகள் அனைத்தையும்
  rationale: ‘வார்த்தைகள்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; தமிழில் தொடர்பை இயல்பாக்க ‘புத்தகத்திலுள்ள’ என்று வழங்கப்படுகிறது.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் வாசித்த
  rationale: קָרָא என்பதற்கு சூழலால் சாத்தியமான ‘சத்தமாக வாசித்த’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல், மூலத்தில் வெளிப்படையாக இருப்பதையே தருகிறது.
theological_decisions:
- issue: רָעָה என்ற இறைத்தீர்ப்புச் சொல்லின் மொழிபெயர்ப்பு
  choice: பேரழிவு
  alternative: தீமை / இடர்
  rationale: உடன்படிக்கை மீறலுக்கான தீர்ப்புச் சூழலில் இச்சொல் ஒழுக்கத் தீமையை அல்ல, நேரும் அழிவைச் சுட்டுகிறது. ‘பேரழிவு’ அந்த வேறுபாட்டைக் காக்கிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: ‘புத்தகத்தின் வார்த்தைகள் அனைத்தும்’ என்பதன் வாக்கியத் தொடர்பு
  choice: அவற்றை அந்த இடத்தின்மீதும் குடியிருப்போர்மீதும் பேரழிவாக வரச்செய்வதாக அமைத்தல்
  alternative: ‘பேரழிவு..., புத்தகத்தின் வார்த்தைகள் அனைத்தும்’ என்ற இணைப்புச் சொல் இல்லாத apposition
  rationale: எபிரெயத்தில் אֵת தொடரின் துல்லிய இலக்கணப் பங்கு சற்றுக் கடினமானது; இறுதியில் கூறப்பட்ட வார்த்தைகள் அறிவிக்கப்பட்ட தீர்ப்பின் உள்ளடக்கமாக அந்த இடத்தின்மேல் வருவது என்ற இயல்பான தொடர்பைத் தமிழில் வெளிப்படுத்துகிறது, ஆனால் ‘நிறைவேற்றுவேன்’ போன்ற மூலத்தில் இல்லாத வினையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தீர்க்கதரிசன அறிவிப்புக்குரிய மாண்பான தொனி காக்கப்பட்டுள்ளது. அரிதான சமயச் சொற்களும் பழமையான வினைமுற்றுகளும் தவிர்க்கப்பட்டுள்ளன; மூலத்தின் உடனடித் தன்மையை ‘இதோ’ மற்றும் நிகழ்கால வினை காக்கின்றன.
