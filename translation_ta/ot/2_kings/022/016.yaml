  source_fidelity: 'வரைவில் தீர்ப்பாக வரும் רָעָה ‘பேரழிவு’ எனச் சரியாகப் புரிந்துகொள்ளப்பட்டுள்ளது; யாவே, இதோ, இடம், குடியிருப்போர், யூதாவின் அரசன் வாசித்த புத்தகம் ஆகிய கூறுகளும் உள்ளன. ஆனால் ‘புத்தகத்திலுள்ள வார்த்தைகள் அனைத்தையும் ... பேரழிவாக வரச்செய்கிறேன்’ என்பது எபிரெயத்தின் ‘பேரிடரை ... [அதாவது] புத்தகத்தின் எல்லா வார்த்தைகளையும் கொண்டுவருகிறேன்’ என்ற நேரடி-பொருள்/appositional அமைப்பைத் தமிழில் பொருள்மாறச் செய்கிறது: வார்த்தைகளே பேரழிவாக மாற்றப்படுவது போல ஒலிக்கிறது.'
  naturalness: ‘வரச்செய்கிறேன்’ என்பதும் ‘பேரழிவாக’ என்பதும் இவ்வாக்கியத்தில் இயல்பாக இல்லை. ‘பேரிடரைக் கொண்டுவருகிறேன்’ நவீன நிலையான தமிழில் இயல்பாகவும் தீர்க்கதரிசன அறிவிப்பின் மாண்பான தொனியுடனும் உள்ளது. பின்னுள்ள விளக்கத் தொடர் மூலம் எபிரெயத்தின் சற்றுக் கடினமான இணைநிலையைச் சேர்க்கை இல்லாமல் தெரிவிக்கலாம்.
  terminology: ‘யாவே’ மூலத்தின் இறைப்பெயருக்கு ஏற்றது. ‘பேரிடர்’ என்பது ரָעָה-வின் இச்சூழலுக்கான இயல்பான, ஒழுக்கத் தீமையைக் குறிக்காத மொழிபெயர்ப்பு. ‘புத்தகத்தின் எல்லா வார்த்தைகளும்’ மூலத்தின் ‘all the words of the book’ என்பதைப் பாதுகாக்கிறது.
