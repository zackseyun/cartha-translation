  text: לֶ/חָ֣רָשִׁ֔ים וְ/לַ/בֹּנִ֖ים וְ/לַ/גֹּֽדְרִ֑ים וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: ta
  text: கைவினைஞர்களுக்கும், கட்டடத் தொழிலாளர்களுக்கும், சுவர் கட்டுவோருக்கும்[b], கட்டுமான மரப்பொருட்களையும் கற்சுரங்கக் கற்களையும்[c] வாங்குவதற்கும், வீட்டை[a] வலுப்படுத்துவதற்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சூழலின்படி ஆண்டவருடைய வீடாகிய ஆலயம்.
    reason: cross_reference
  - marker: b
    text: மூலச்சொல் இன்னும் நேரடியாகச் சுவர்கள் அல்லது அடைப்புகளை அமைப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘செதுக்கிய கற்கள்’ / ‘வெட்டப்பட்ட கற்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: கைவினைஞர்களுக்கும்
  rationale: חָרָשִׁים என்பது தச்சர்களை மட்டும் அல்லாமல் திறன்வாய்ந்த தொழிலாளர்களைப் பொதுவாகக் குறிக்கலாம்; கட்டுமானச் சூழலில் ‘கைவினைஞர்கள்’ அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: וְלַבֹּנִים
  choice: கட்டுநர்களுக்கும்
  rationale: בנה வேரிலிருந்து வந்த இச்சொல் கட்டுமானப் பணியில் ஈடுபடுவோரைக் குறிக்கிறது; ‘கட்டுநர்கள்’ நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: וְלַגֹּדְרִים
  choice: சுவர் கட்டுவோருக்கும்
  rationale: גדר என்பது சுவர் அல்லது அடைப்பைக் கட்டுதல், செப்பனிடுதல் என்ற அடிப்படைப் பொருளுடையது; தொழிலின் தன்மையைத் தெளிவாகக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: וְלִקְנוֹת
  choice: வாங்கி ... வலுப்படுத்துவதற்கும்
  rationale: ל உடனான infinitive construct நிதி பயன்படுத்தப்படும் நோக்கத்தைத் தொடர்கிறது; தமிழில் இயல்பாக இருக்க ‘வாங்கி ... வலுப்படுத்துவதற்கும்’ என இணைக்கப்பட்டது.
- source_word: עֵצִים
  choice: மரங்களை
  rationale: கட்டுமானப் பொருட்களின் சூழலில் இது கட்டட வேலைக்கான மரத்தைக் குறிக்கிறது; சாதாரண வாசகருக்கு இயல்பான ‘மரங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: சுரங்கத்தில் வெட்டியெடுத்த கற்களையும்
  rationale: מַחְצֵב கற்சுரங்கத்திலிருந்து வெட்டியெடுக்கப்பட்ட கல்லைக் குறிக்கிறது; மூலத்தின் காட்சி தெளிவாக வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְחַזֵּק
  choice: வலுப்படுத்துவதற்கும்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலிமையாக்குதல்’; பழுதுபார்த்தல் என்ற சூழற்பொருளை மட்டும் கொண்டு அதைச் சுருக்காமல் சொற்பொருள் காக்கப்பட்டது.
- source_word: אֶת־הַבָּיִת
  choice: அந்த வீட்டை
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’; சூழலில் அது ஆண்டவருடைய ஆலயத்தைக் குறித்தாலும், மூலத்தின் சொல்லாட்சியை முதன்மை உரை காக்கிறது.
theological_decisions:
- issue: הַבָּיִת என்பதன் சூழல் சார்ந்த குறிப்பு
  choice: முதன்மை உரையில் ‘அந்த வீடு’; அடிக்குறிப்பில் ஆலயம் என விளக்கம்
  alternative: முதன்மை உரையிலேயே ‘ஆலயம்’
  rationale: எபிரெய மூலத்தில் ‘வீடு’ என்றே உள்ளது. அது ஆண்டவருடைய ஆலயத்தைக் குறிக்கிறது என்பதை மறைக்காமல் அடிக்குறிப்பில் தெரிவிப்பது மூலச் சொல்லாட்சியையும் சூழற்பொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் இணை அமைப்பையும் நிதி பயன்படுத்தப்படும் நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது. ‘வீடு’ என்ற மூல உருவகம் காக்கப்பட்டு, அதன் ஆலயக் குறிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
