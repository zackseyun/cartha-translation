base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: ta
  text: அப்போது ஆசாரியரான இல்க்கியா, அகிக்காம், அக்போர், சாப்பான், அசாயா ஆகியோர் பெண் இறைவாக்கினரான உல்தாளிடம் சென்றார்கள். அவள் ஆடைகளின் பொறுப்பாளரான சல்லூமின் மனைவி.[a] சல்லூம் திக்வாவின் மகன்; திக்வா ஹர்ஹாஸின் மகன். அவள் எருசலேமின் இரண்டாம் பகுதியில்[b] குடியிருந்தாள். அவர்கள் அவளிடம் பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “ஆடைகளைக் காப்பவர்.” இது அரச ஆடைகளுக்குப் பொறுப்பான ஓர் அலுவலரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இரண்டாம் மாவட்டத்தில்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் எருசலேமின் ஒரு குறிப்பிட்ட பகுதியைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அப்போது ... சென்றார்கள்
  rationale: தொடர்கதை முன்னேற்றத்தைக் குறிக்கும் waw-consecutive-ஐ இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ஒருமை வினைச்சொல் பட்டியலின் கூட்டுப் பொருளுக்கு ஏற்ப பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியரான
  rationale: எபிரெய உரையில் ‘தலைமை ஆசாரியர்’ என்று இல்லை; ஆகவே சூழலிலிருந்து உயர்ந்த பட்டம் சேர்க்கப்படவில்லை.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: பெண் இறைவாக்கினரான உல்தாள்
  rationale: הַנְּבִיאָה என்பது பெண்பால் வடிவம். ‘பெண் இறைவாக்கினர்’ என்பது பாலினத்தைத் தெளிவாகப் பாதுகாத்து, தீர்க்கதரிசனம் என்பது எதிர்காலக் கணிப்பு மட்டுமே என்ற தவறான குறுக்கத்தையும் தவிர்க்கிறது.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: சல்லூமின் மனைவி
  rationale: திருமண உறவைக் குறிக்கும் construct தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: சல்லூம் திக்வாவின் மகன், திக்வா அர்காசின் மகன்
  rationale: மூலத்தின் வம்சத் தொடரைத் தமிழில் யார் யாருடைய மகன் என்பது குழப்பமின்றித் தெளிவாக்குகிறது.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: ஆடைகளின் பொறுப்பாளர்
  rationale: சொல்லளவில் ‘ஆடைகளைக் காப்பவர்’; இங்கு ஓர் அலுவல் பொறுப்பைக் குறிக்கும் என்பதால் இயல்பான பணிப்பெயராக வழங்கப்பட்டுள்ளது.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: அவள் ... குடியிருந்தாள்
  rationale: יָשַׁב இங்குக் குடியிருப்பைக் குறிக்கிறது; ‘அமர்ந்திருந்தாள்’ என்பது சூழலுக்குப் பொருந்தாது.
- source_word: בַּמִּשְׁנֶה
  choice: இரண்டாம் பகுதியில்
  rationale: எருசலேமின் குறிப்பிட்ட ஒரு பகுதி அல்லது மாவட்டத்தைக் குறிக்கும் வாய்ப்பு உள்ளது; உறுதியில்லாத சிறப்புப்பெயர் தன்மையை மிகைப்படுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: அவர்கள் அவளிடம் பேசினார்கள்
  rationale: אֶל உடன் வரும் வினைச்சொல்லின் நேரடியான திசைநோக்கிய பொருளைத் தக்கவைக்கிறது; ‘கலந்தாலோசித்தார்கள்’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: இல்க்கியாவின் பட்டத்தை ‘தலைமை ஆசாரியர்’ என்று உயர்த்துவதா
  choice: ஆசாரியர்
  alternative: தலைமை ஆசாரியர்
  rationale: இந்த வசனத்தின் எபிரெய உரை הַכֹּהֵן, ‘ஆசாரியர்’, என்று மட்டுமே கூறுகிறது. வேறு வசனங்களிலுள்ள தகவலை இங்கு சேர்க்காமல் மூலத்தின் வரம்பு காக்கப்படுகிறது.
- issue: உல்தாளின் பெண்பால் இறைவாக்குப் பட்டத்தை எவ்வாறு வழங்குவது
  choice: பெண் இறைவாக்கினர்
  alternative: இறைவாக்கினர்; தீர்க்கதரிசினி
  rationale: எபிரெயப் பெயர்ச்சொல் வெளிப்படையாகப் பெண்பாலில் உள்ளது. தேர்ந்த வடிவம் அந்தத் தகவலைப் பாதுகாப்பதுடன், அவரது பணியை எதிர்காலம் உரைப்பதாக மட்டும் குறுக்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. பெயர்கள் எபிரெய ஒலிவடிவத்தை அண்மித்துத் தமிழாக்கப்பட்டுள்ளன. நீண்ட உறவுத் தொடரால் ஏற்படும் குழப்பத்தைத் தவிர்க்க வாக்கியம் பிரிக்கப்பட்டுள்ளது; ஆனால் மூலத் தகவலின் வரிசையும் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
