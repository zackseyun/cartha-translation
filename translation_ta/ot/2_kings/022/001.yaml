base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: ta
  text: யோசியா அரசனானபோது அவனுக்கு எட்டு வயது. அவன் எருசலேமில் முப்பத்தொரு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் யெதீதாள்; அவள் போஸ்காத்தைச் சேர்ந்த அதாயாவின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: அவனுக்கு எட்டு வயது
  rationale: ‘எட்டு ஆண்டுகளின் மகன்’ என்ற எபிரேய வயதுக் கூறை இயல்பான நவீன தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: ஆட்சிப் பொறுப்பேற்ற காலத்தைச் சுட்டும் எபிரேய வடிவத்தை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசப் பட்டத்தை மட்டும் அல்லாமல் அரசாட்சி செய்ததைக் குறிக்கும் வினையின் பொருளைப் பாதுகாக்கிறது.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: முப்பத்தொரு ஆண்டுகள்
  rationale: எபிரேய எண்ணிக்கையைப் பொருள் இழப்பின்றி வழக்கமான தமிழில் வழங்குகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கும் நேரடியான இடவெற்றுமை மொழிபெயர்ப்பு.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: மரபுவழிக் குறிப்புச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְדִידָה
  choice: எதீதாள்
  rationale: தனிநபர் பெயர் அதன் எபிரேய உச்சரிப்பை அண்மித்த தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בַת עֲדָיָה
  choice: அதாயாவின் மகள்
  rationale: உறவைக் குறிக்கும் ‘மகள்’ என்ற சொல்லையும் தனிநபர் பெயரின் ஒலிப்பெயர்ப்பையும் தெளிவாக வழங்குகிறது.
- source_word: מִבָּצְקַת
  choice: போஸ்காத்தைச் சேர்ந்த
  rationale: מִן முன்னொட்டு குறிக்கும் ஊர்சார்ந்த தோற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
