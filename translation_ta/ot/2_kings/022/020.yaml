  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: ta
  text: ஆகையால், இதோ, நான் உன்னை உன் முன்னோர்களோடு சேர்த்துக்கொள்வேன்; நீ சமாதானத்துடன்[a] உன் கல்லறைகளில் சேர்க்கப்படுவாய். நான் இந்த இடத்தின்மேல் கொண்டுவரும் பேரழிவு எதையும் உன் கண்கள் காணாது.” அவர்கள் அரசனிடம் செய்தியைத் திரும்பக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமைதியாக.’ எபிரெயத்தில் ‘சமாதானத்துடன்’ என்று உள்ளது. யோசியா எவ்விதமாக இறப்பார் என்பதை இது குறிப்பதாக இல்லாமல், வரவிருக்கும் தண்டனையை அவர் காண்பதற்கு முன்பே இறந்துவிடுவார் என்பதைக் குறிக்கலாம்.
    reason: சொற்பொருள் மாற்றுவாய்ப்பையும், யோசியாவின் பின்னைய போர்மரணத்தால் எழும் உரைப் பதற்றத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் யோசியா தாழ்மையுடன் நடந்துகொண்டதற்கான முடிவை அறிமுகப்படுத்தும் காரணவிளைவு இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: இறை அறிவிப்பின் கவன ஈர்ப்பையும் தீர்க்கதரிசன உரையின் கம்பீரத்தையும் காக்கிறது.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: சேர்த்துக்கொள்வேன் / சேர்க்கப்படுவாய்
  rationale: இரண்டு வடிவங்களிலும் உள்ள אסף என்ற ஒரே எபிரெய வேரின் மீளுருவாக்கத்தையும், மரணத்தின் மூலம் முன்னோர்களுடன் சேர்க்கப்படுதல் என்ற வழக்கையும் இயன்றவரை காக்கிறது.
- source_word: עַל אֲבֹתֶיךָ
  choice: உன் முன்னோர்களோடு
  rationale: இறந்த மூதாதையருடன் சேர்க்கப்படுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: קִבְרֹתֶיךָ
  choice: உன் கல்லறைகளில்
  rationale: மூலத்தில் உள்ள பன்மையைத் தக்கவைத்து நேரடியாக மொழிபெயர்க்கிறது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם என்ற பெயர்ச்சொல்லின் வடிவத்தைத் தக்கவைத்து, மரணத்தின் துல்லியமான முறையை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: உன் கண்கள் காணாது
  rationale: மூலத்தில் கண்களே எழுவாயாக வருவதால் அதன் உயிரோட்டமான வலியுறுத்தலைக் காக்கிறது.
- source_word: הָרָעָה
  choice: பேரழிவு
  rationale: இங்கு רָעָה அறநெறிசார் தீமையை அல்ல, வரவிருக்கும் தண்டனைமிக்க அழிவைக் குறிக்கிறது.
- source_word: מֵבִיא עַל
  choice: இடத்தின்மேல் கொண்டுவரும்
  rationale: விரைவில் நிகழவிருக்கும் தெய்வீகத் தீர்ப்பின் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: எருசலேம் அல்லது அதைச் சார்ந்த பரந்த பகுதியைக் குறிக்கக்கூடிய மூலத்தின் பொதுவான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: அவர்கள் அரசனிடம் செய்தியைத் திரும்பக் கொண்டுவந்தார்கள்
  rationale: பதில் செய்தியுடன் திரும்புதல் என்ற எபிரெய அறிக்கையிடும் சொற்றொடரை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: 2 இராஜாக்கள் 23:29-ல் யோசியா போரில் இறந்ததுடன் ‘சமாதானத்துடன்’ என்பதை எவ்வாறு பொருத்துவது
  choice: மூலத்திலுள்ள ‘சமாதானத்துடன்’ என்பதை அப்படியே வைத்து, அடுத்த கூற்றோடு அதன் பொருளை வாசகர் உணர இடமளித்தல்
  alternative: ‘அமைதியாக இறப்பாய்’ என்று மரணத்தின் முறையைத் தெளிவாக வரையறுத்தல்
  rationale: எபிரெய வாசகம் வரலாற்று மற்றும் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது. அடுத்த கூற்று, அந்த இடத்தின்மேல் வரும் பேரழிவை யோசியா காணமாட்டான் என்பதைக் கூறுகிறது; ஆகவே மொழிபெயர்ப்பு அவன் மரணத்தின் முறையைத் தீர்மானித்து விடக்கூடாது.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் தீர்க்கதரிசன இறை அறிவிப்புக்குரிய கம்பீரம் காக்கப்பட்டுள்ளது. ‘இதோ’, ‘உன் கண்கள் காணாது’ போன்ற மூலத்தின் வலியுறுத்தல்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
