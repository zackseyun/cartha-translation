base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: ta
  text: ஆனால், அவர்கள் கையில் ஒப்படைக்கப்படும் பணத்திற்காக[a] அவர்களிடம் கணக்குக் கேட்க வேண்டியதில்லை[b], ஏனெனில் அவர்கள் நம்பகமாக நடக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளிக்காக.” நிதிசார் சூழல்களில் “வெள்ளி” என்பதற்கான எபிரெயச் சொல் பொதுவாகப் பணத்தைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் நேரடியாக, “அது அவர்களோடு கணக்கிடப்பட வேண்டியதில்லை” என்றும் மொழிபெயர்க்கலாம். அதாவது, நிதியைக் கையாண்டவர்களிடம் கணக்கு ஒப்புவிக்கும்படி கோரப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தலுக்கு ஒரு விதிவிலக்கை அல்லது வரம்பை அறிமுகப்படுத்துவதால், எதிர்மறை இணைப்பான ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது.
- source_word: יֵחָשֵׁב אִתָּם
  choice: அவர்களிடம் கணக்குக் கேட்க வேண்டியதில்லை
  rationale: இந்த நிதிசார் சூழலில் חשׁב என்பதன் நிபால் வடிவம் கணக்கிடுதல் அல்லது கணக்கு ஒப்புவிக்கச் செய்தல் என்ற பொருளைத் தருகிறது. பணத்தைக் கையாளுகிறவர்களிடம் அதற்கான கணக்கு கோரப்படவில்லை என்பதைக் காலத்திற்கேற்ற தெளிவான தமிழில் இது வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் சற்றே மாறுபடக்கூடிய நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַכֶּסֶף
  choice: பணம்
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’ என்றாலும், இங்கு ஆலயப் பணிக்காக ஒப்படைக்கப்படும் நிதியைக் குறிப்பதால் ‘பணம்’ சூழலுக்கு இயல்பானது. ‘வெள்ளி’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַנִּתָּן עַל יָדָם
  choice: அவர்கள் கையில் ஒப்படைக்கப்படும்
  rationale: ‘அவர்களுடைய கையின்மேல் கொடுக்கப்படும்’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாத்து, அந்தப் பணம் அவர்களிடம் பொறுப்பாக ஒப்படைக்கப்படுவதைத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்களிடம் ஏன் கணக்குக் கேட்கப்படவில்லை என்பதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: בֶאֱמוּנָה
  choice: உண்மையுடன்
  rationale: இங்கு אֱמוּנָה கோட்பாட்டுச் சார்ந்த விசுவாசத்தை அல்ல, நடத்தையில் காணப்படும் நம்பகத்தன்மையையும் நேர்மையையும் குறிக்கிறது. ‘உண்மையுடன்’ அதன் வினையடைப் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֵם עֹשִׂים
  choice: அவர்கள் செயல்படுகிறார்கள்
  rationale: நேரடியாக ‘அவர்கள் செய்கிறார்கள்’ என்றாலும், இங்கு நிதியையும் பணியையும் கையாளும் அவர்களது நடத்தை குறிக்கப்படுவதால் ‘செயல்படுகிறார்கள்’ தெளிவாக உள்ளது.
