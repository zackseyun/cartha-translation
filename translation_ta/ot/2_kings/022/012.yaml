base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: ta
  text: 'அப்போது அரசன் ஆசாரியனான இல்க்கியாவுக்கும்[a], சாப்பானின் மகன் அகீக்காமுக்கும், மீகாயாவின் மகன் அக்போருக்கும், எழுத்தரான சாப்பானுக்கும்[b], அரசனின் ஊழியரான அசாயாவுக்கும்[c] கட்டளையிட்டார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு “இல்க்கியா என்னும் ஆசாரியன்” என்றே உள்ளது; “தலைமை ஆசாரியன்” என்று வெளிப்படையாக இல்லை.
    reason: lexical_alternative
  - marker: b
    text: “எழுத்தர்” என்பதற்கான எபிரெயச் சொல் அரசவையின் நிர்வாகச் செயலரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக “அரசனின் ஊழியன்” என்று உள்ளது; அரசவைச் சூழலில் இது அரசனுக்குப் பணியாற்றிய ஓர் அதிகாரியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் அரச அதிகார வலிமையை ‘கட்டளையிட்ட’ என்பதும், அடுத்த வசனத்தில் வரும் கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் לֵאמֹר என்பதை ‘சொன்னது’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: திட்டமான பெயர்ச்சொல்லை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: இல்க்கியா என்னும் ஆசாரியன்
  rationale: எபிரெயத்தில் ‘ஆசாரியன்’ என்றே உள்ளது; ‘தலைமை ஆசாரியன்’ என்று வெளிப்படையாகக் கூறப்படவில்லை. ‘என்னும்’ என்பது பெயரையும் பதவியையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: சாப்பானின் மகன் அகீக்காம்
  rationale: எபிரெய அடையாளத் தொடரை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: மிகாயாவின் மகன் அக்போர்
  rationale: பெயர்களை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, உறவுமுறையை இயல்பான தமிழில் தருகிறது.
- source_word: שָׁפָן הַסֹּפֵר
  choice: எழுத்தரான சாப்பான்
  rationale: סֹפֵר என்பதன் அடிப்படைப் பொருளான எழுதுதல் சார்ந்த அரசவைப் பதவியை ‘எழுத்தர்’ காக்கிறது; நிர்வாகச் செயலர் என்ற பொருளும் சூழலில் சாத்தியம்.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: அரசனின் பணியாளரான அசாயா
  rationale: עֶבֶד என்பதன் சேவை உறவை ‘பணியாளர்’ இயல்பாகக் காட்டுகிறது; அரசவைச் சூழலில் அது ஓர் அதிகாரியையும் குறிக்கலாம்.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கட்டளையை முன்வைக்கும் எபிரெய வடிவத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: இல்க்கியாவின் ஆசாரியப் பதவி
  choice: ஆசாரியன்
  alternative: தலைமை ஆசாரியன்
  rationale: இந்த வசனத்தின் எபிரெய மூலத்தில் הַכֹּהֵן (‘ஆசாரியன்’) மட்டுமே உள்ளது. சூழல் உயர்ந்த பதவியைச் சுட்டக்கூடியதாக இருந்தாலும், மூலத்தில் இல்லாத பட்டத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசவைக் கூறுகளின் மூலப் பொருள் காக்கப்பட்டு, சாத்தியமான நிர்வாகப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன. பட்டியலில் தமிழின் வேற்றுமை உருபுகள் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
