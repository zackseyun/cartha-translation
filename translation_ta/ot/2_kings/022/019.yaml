base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: ta
  text: “உன் உள்ளம் மென்மையாயிருந்ததாலும், இந்த இடத்திற்கும் அதன் குடியிருப்பாளர்களுக்கும் எதிராக நான் பேசியதை நீ கேட்டபோது, அவர்கள் பாழ்நிலையாகவும்[a] சாபமாகவும் ஆகும்படி யாவேக்கு முன்பாக உன்னைத் தாழ்த்திக்கொண்டு, உன் உடைகளைக் கிழித்து, என் முன்னிலையில் அழுததாலும், நானும் உனக்குச் செவிகொடுத்தேன்” என்று யாவே அறிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திகைப்பை உண்டாக்கும் நிலையாகவும்.” எபிரெயச் சொல் தீர்ப்பின் சூழலில் பாழ்நிலை, திகில், அல்லது பிறரைத் திகைக்கச் செய்யும் நிலை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
