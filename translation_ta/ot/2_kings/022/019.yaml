- source_word: רַךְ לְבָבְךָ
  choice: உன் உள்ளம் நெகிழ்ந்ததாலும்
  rationale: சொல்லாட்சியின் உருவகத்தை மரத்துப்போகாத, மனந்திரும்புதலுக்கு இணங்கும் உள்ளார்ந்த உணர்வாக இயல்பான தமிழில் எடுத்துரைக்கிறது; பலவீனம் என்று பொருள்கொள்ளவில்லை.
- source_word: וַתִּכָּנַע
  choice: உன்னைத் தாழ்த்தி
  rationale: தேவனுக்கு முன்பாகத் தன்னையே தாழ்த்திக்கொண்ட செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִפְּנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: தேவனின் சந்நிதியில் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר דִּבַּרְתִּי עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: இந்த இடமும் இதன் குடியிருப்பாளர்களும் … ஆகும் என்று நான் அவர்களுக்கு எதிராகப் பேசியதை
  rationale: தீர்ப்புரையின் சூழலில் עַל கொண்டிருக்கும் எதிர்மறை நோக்கை ‘எதிராக’ என வெளிப்படுத்துகிறது; இடத்தையும் மக்களையும் கூட்டாகக் குறிக்கிறது.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: பாழிடமாகவும்[a] சாபமாகவும் ஆகும்
  rationale: அறிவிக்கப்பட்ட தீர்ப்பின் விளைவை நேரடியாகத் தருகிறது; שַׁמָּה என்பதன் வேறு சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: உன் உடைகளைக் கிழித்து
  rationale: துக்கத்தையும் மனந்திரும்புதலையும் வெளிப்படுத்தும் வழக்கமான செயலை நவீன, எளிய தமிழில் தருகிறது.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: எனக்கு முன்பாக அழுததாலும்
  rationale: துக்கத்தோடு அழுத செயலும் நேரடியான இறைமுகப்பும் பாதுகாக்கப்படுகின்றன.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: நானும் உனக்குச் செவிகொடுத்தேன்
  rationale: வலியுறுத்தப்பட்ட ‘நானும்’ என்பதையும், சூழலில் உள்ள ஏற்றுக்கொள்ளும் இறைமறுமொழியையும் இயல்பான தமிழில் தருகிறது; ‘உன்னைக் கேட்டேன்’ என்ற தவறான பொருள் தோன்றுவதைத் தவிர்க்கிறது.
- source_word: נְאֻם יְהוָה
  choice: என்று யாவே அறிவிக்கிறார்
  rationale: தீர்க்கதரிசன அறிவிப்புச் சூத்திரத்தின் அதிகாரபூர்வமான தொனியைப் பாதுகாக்கிறது.
