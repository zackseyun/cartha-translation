- issue: וְגַם אָנֹכִי שָׁמַעְתִּי என்பதிலுள்ள இறைமறுமொழி
  choice: நானும் உனக்குச் செவிகொடுத்தேன்
  alternative: நானும் கேட்டேன்
  rationale: மூலத்தின் ‘கேட்டேன்’ என்ற மொழியை வேண்டுதல் நிறைவேற்றப்பட்டது என்று மிகுதியாக விரிவாக்காமல், தமிழில் அதன் பதிலளிக்கும் சூழலைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் தீர்க்கதரிசன அறிவிப்பின் கனமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெயக் காரண வாக்கியத்தின் தொடர்பு தமிழில் தெளிவாக இருக்க ‘…தாலும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டது.
