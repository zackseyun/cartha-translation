base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: ta
  text: “நீங்கள் போய், எனக்காகவும் மக்களுக்காகவும் யூதா முழுவதற்காகவும், கண்டெடுக்கப்பட்ட இந்தப் புத்தகத்தின் வார்த்தைகளைக் குறித்து யாவேயிடம் விசாரியுங்கள்.[a] இந்தப் புத்தகத்தில் நம்மைக் குறித்து எழுதப்பட்டுள்ள அனைத்தின்படியும் செய்யும்படி நம் தந்தையர்[b] அதன் வார்த்தைகளுக்குச் செவிகொடுக்காததால், நம்மீது மூண்டிருக்கிற யாவேயின் கடுங்கோபம் மிகப் பெரிது.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயைத் தேடுங்கள்” அல்லது “யாவேயிடம் ஆலோசனை கேளுங்கள்.” இங்கு கண்டெடுக்கப்பட்ட நூலைக் குறித்து இறைவனிடமிருந்து முறையாக வழிகாட்டல் கேட்பதே சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் முன்னோர்கள்.” எபிரெயச் சொல் சொற்சார்பாக “நம் தந்தையர்” என்று ஆண்பால் வடிவில் உள்ளது; சூழலில் அது முந்தைய தலைமுறையினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “நம்மைக் குறித்து” என்பதற்கு “நமக்காக” அல்லது “நம்மீது விதிக்கப்பட்ட” என்றும் பொருள் கொள்ளலாம். எழுதப்பட்டவை தற்போதைய சமூகத்துக்குப் பொருந்துகின்றன என்பதே அடிப்படை கருத்து.
    reason: ambiguity
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: யாவேயிடம் விசாரியுங்கள்
  rationale: இச்சூழலில் דרשׁ என்பது பொதுவாக இறைவனைத் தேடுவதைவிட, கண்டெடுக்கப்பட்ட நூலைக் குறித்து அவரிடமிருந்து வழிகாட்டல் அல்லது தீர்ப்புரை கேட்பதைக் குறிக்கிறது. ‘விசாரியுங்கள்’ என்பது அந்த முறையான இறை ஆலோசனைக் கோருதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: எனக்காகவும் மக்களுக்காகவும் யூதா முழுவதற்காகவும்
  rationale: בְּעַד இங்கு பிரதிநிதித்துவமாக அல்லது சார்பாக விசாரிப்பதைக் குறிக்கிறது. மூலத்தின் மும்மடங்கு அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: கண்டெடுக்கப்பட்ட இந்தப் புத்தகத்தின் வார்த்தைகளைக் குறித்து
  rationale: עַל விசாரணையின் பொருளை அறிமுகப்படுத்துகிறது; דִּבְרֵי என்பதன் உரைசார் கவனத்தை ‘வார்த்தைகள்’ காக்கிறது. הנמצא இயல்பான பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמַת יְהוָה
  choice: யாவேயின் கடுங்கோபம்
  rationale: חֵמָה தீவிரமான, எரியும் கோபத்தைக் குறிக்கிறது. ‘கடுங்கோபம்’ அதன் நீதித்தீர்ப்பு சார்ந்த வலிமையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: נִצְּתָה בָנוּ
  choice: நம்மீது மூண்டிருக்கிற
  rationale: יצת எரியத் தொடங்குதல் அல்லது மூளுதல் என்ற உருவகத்தைத் தருகிறது. ‘நம்மீது மூண்டிருக்கிற’ என்பது கோபத்தின் தீவிரத்தையும் அது அவர்களுக்கு எதிராகத் திரும்பியிருப்பதையும் காக்கிறது.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: நம் தந்தையர் ... செவிகொடுத்து ... செய்யவில்லை
  rationale: שׁמע கேட்டலையும் கீழ்ப்படிதலையும் உள்ளடக்க முடியும். ‘செவிகொடுத்து’ அடிப்படை கேட்கும் பொருளைக் காக்க, தொடர்ந்து வரும் ‘செய்யவில்லை’ கீழ்ப்படிதலின் குறைவை வெளிப்படுத்துகிறது. אבותינו-வின் ஆண்பால் வடிவம் ‘நம் தந்தையர்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: எழுதப்பட்டுள்ள அனைத்தின்படியும் செய்ய
  rationale: כְּ என்பதின் ‘படி’ என்ற பொருளையும், כָּל என்பதின் முழுமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עָלֵינוּ
  choice: நம்மைக் குறித்து
  rationale: עַל இங்கு எழுதப்பட்டவை தற்போதைய உடன்படிக்கைச் சமூகத்துக்குப் பொருந்துவதைச் சுட்டுகிறது. ‘நம்மைக் குறித்து’ என்பது அதை ஆசீர்வாதம், கட்டளை அல்லது தீர்ப்பு என்று முன்கூட்டியே குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலம் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், ஏற்ற எபிரெய உச்சரிப்பைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- issue: אֲבֹתֵינוּ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை வடிவில் தேசத்தின் முந்தைய தலைமுறைத் தந்தையரைக் குறிக்கிறது. முதன்மை உரை இந்த வடிவத்தைப் பாதுகாக்கிறது; விரிவான பொதுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: עָלֵינוּ என்பதன் தொடர்பு
  choice: நம்மைக் குறித்து
  alternative: நமக்காக; நம்மீது விதிக்கப்பட்ட
  rationale: இந்தத் தொடர் எழுதப்பட்டவை சமூகத்தோடு தொடர்புடையவை என்பதைக் காட்டுகிறது; அது குறிப்பாக அவர்களைப் பற்றியதா, அவர்களுக்காகவா, அல்லது அவர்கள்மீது கடமையாக விதிக்கப்பட்டதா என்பது மொழியளவில் திறந்துள்ளது. முதன்மை வாசகம் இந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் அரசனின் தீவிரமான கட்டளைக்கும் உடன்படிக்கைத் தீர்ப்பின் கனத்திற்கும் ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. காரணத்தை முதலில் கூறி முடிவைச் சொல்லும் எபிரெய வரிசை தமிழின் இயல்புக்காக மாற்றப்பட்டாலும், தர்க்கத் தொடர்பு தெளிவாகக் காக்கப்பட்டுள்ளது.
