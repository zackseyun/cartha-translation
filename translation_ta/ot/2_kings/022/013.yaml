  revised_text: “நீங்கள் போய், எனக்காகவும் மக்களுக்காகவும் யூதா முழுவதற்காகவும், கண்டெடுக்கப்பட்ட இந்தப் புத்தகத்தின் வார்த்தைகளைக் குறித்து யாவேயிடம் விசாரியுங்கள்.[a] இந்தப் புத்தகத்தில் நம்மைக் குறித்து எழுதப்பட்டுள்ள அனைத்தின்படியும் செய்யும்படி நம் தந்தையர்[b] அதன் வார்த்தைகளுக்குச் செவிகொடுக்காததால், நம்மீது மூண்டிருக்கிற யாவேயின் கடுங்கோபம் மிகப் பெரிது.”[c]
