  revision_rationale: 'மறுப்பின் பொருளைத் தெளிவுபடுத்தும் ஒரே பாதுகாப்பான திருத்தம் செய்யப்பட்டுள்ளது: தந்தையர் புத்தகத்தின் வார்த்தைகளுக்குச் செவிகொடுக்கவில்லை; எழுதப்பட்ட அனைத்தின்படியும் செய்வதே அந்தக் கேட்புடன் இணைந்த செயல் எனத் தெளிவாக்கப்பட்டுள்ளது. மற்ற சொற்தேர்வுகள், பெயர்கள், பதிவுநடை, மற்றும் அடிக்குறிப்பு அடையாளங்கள் காக்கப்பட்டுள்ளன.'
