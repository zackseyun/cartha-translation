  source_fidelity: 'முதன்மை வாசகம் மூலத்தின் முக்கிய கூறுகளைச் சரியாகக் கொண்டுள்ளது: யாவேயிடம் முறையான விசாரணை, மூவகையான ‘எனக்காகவும் ... மக்களுக்காகவும் ... யூதா முழுவதற்காகவும்’ என்ற வேண்டுகோள், கண்டெடுக்கப்பட்ட புத்தகம், யாவேயின் தீவிரக் கோபம், மற்றும் எழுதப்பட்டவற்றின்படி நடக்கத் தவறிய முந்தைய தந்தையர். ஆனால் ‘செவிகொடுத்து ... செய்யவில்லை’ என்பது தமிழில் அவர்கள் முதலில் செவிகொடுத்தார்கள், பின்னர் செய்யவில்லை என்ற பொருளையும் தரக்கூடும்; மூலத்தில் அவர்கள் செவிகொடுக்கவே இல்லை என்பதையும், அதன் நோக்கம்/விளைவு எழுதப்பட்டபடி செய்வதாகும் என்பதையும் தெளிவாக்க வேண்டும்.'
  naturalness: நடை நவீன தரத் தமிழிலும் கண்ணியமான வேதாகமப் பதிவிலும் இயல்பாக உள்ளது. காரணத் தொடரை மறுசீரமைப்பதன் மூலம் ‘செவிகொடுக்காததால்’ என்ற மறுப்பு தெளிவாகி, ‘செய்யும்படி’ மூலத்தின் infinitive தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
