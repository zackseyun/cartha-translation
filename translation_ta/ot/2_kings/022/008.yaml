base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: ta
  text: அப்போது தலைமை ஆசாரியரான இல்க்கியா, எழுத்தரான சாப்பானிடம், “யாவேயின் ஆலயத்தில்[a] திருச்சட்ட நூலைக் கண்டெடுத்தேன்[b]” என்றார். இல்க்கியா அந்த நூலைச் சாப்பானிடம் கொடுத்தார்; அவர் அதை வாசித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “யாவேயின் வீட்டில்”; அதாவது, ஆலயத்தில்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “திருச்சட்டச் சுருளைக் கண்டெடுத்தேன்.” எபிரெயச் சொல் நூலையோ சுருள் ஆவணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் வாசித்தவர் யார் என்பது பெயரிட்டு மீண்டும் சொல்லப்படவில்லை. சாப்பான் அதை வாசித்தார் என்பதே இயல்பான பொருள். “அதிலிருந்து வாசித்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்ன நகர்த்துவதால், இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என வழங்கப்பட்டது.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: இது முதன்மை ஆசாரியப் பதவியைக் குறிக்கும் நிலையான தலைப்பு; நவீனத் தமிழில் ‘தலைமைக் குரு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַסֹּפֵר
  choice: எழுத்தர்
  rationale: அரசவை அல்லது நிர்வாக எழுத்துப் பணியாளரைக் குறிக்கும் வரலாற்றுப் பங்கை, அதிக விளக்கமின்றி ‘எழுத்தர்’ தக்கவைக்கிறது.
- source_word: סֵפֶר הַתּוֹרָה
  choice: திருச்சட்ட நூல்
  rationale: סֵפֶר என்பது நூல் அல்லது சுருள் ஆவணத்தையும், תּוֹרָה இச்சூழலில் உடன்படிக்கைச் சட்டத்தையும் குறிக்கிறது. ‘திருச்சட்ட நூல்’ அதன் மதச்சார்ந்த, சட்டரீதியான தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מָצָאתִי
  choice: கண்டெடுத்தேன்
  rationale: முன்பு காணப்படாமல் இருந்த ஆவணம் கண்டுபிடிக்கப்பட்டதைக் குறிக்கும் தமிழ்ச் சொல்; எபிரெய நிறைவேற்ற வினையின் முடிவுற்ற கண்டுபிடிப்பைத் தெரிவிக்கிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: ‘யாவேயின் வீடு’ என்பதன் சூழல்சார் பொருள் ஆலயம். சாதாரண வாசகருக்கு இயல்பாக இருக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: அந்த நூலை ... கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; முன் குறிப்பிடப்பட்ட நூல் என்பதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: וַיִּקְרָאֵהוּ
  choice: அவர் அதை வாசித்தார்
  rationale: பின்னொட்டுடன் உள்ள வினை இயல்பாக ‘அதை வாசித்தார்’ எனப் பொருள்படும். அண்மைய ஆண்பால் ஒருமை நபரான சாப்பானே எழுவாய் என்பது மிக இயல்பான வாசிப்பு; இருப்பினும் எபிரெயில் பெயர் மீண்டும் சொல்லப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் வேறுபாட்டையும் காக்கிறது.
- issue: סֵפֶר הַתּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்ட நூல்
  alternative: போதனைச் சுருள்
  rationale: இந்த அரச–ஆலயச் சூழலில் תּוֹרָה உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது; எனினும் סֵפֶר நூலா சுருளா என்பதைத் துல்லியமாக நிர்ணயிக்காது என்பதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் இணைந்த நடை. வரலாற்றுப் பதவிகளுக்கு ‘தலைமைக் குரு’, ‘எழுத்தர்’ என்றும், ஆலயச் சூழலுக்கு இயல்பான ‘ஆலயம்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உண்மையான சொற்பொருள் மற்றும் எழுவாய் சார்ந்த சிறிய ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
