base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: ta
  text: அதை யாவேயின் ஆலயத்தில் பொறுப்பாக நியமிக்கப்பட்ட பணியாளர்களின் கையில் ஒப்படைக்கட்டும்[a]. அவர்கள் அதை யாவேயின் ஆலயத்தில் உள்ள பணியாளர்களிடம், ஆலயத்தின் சேதத்தைப் பழுதுபார்ப்பதற்காகக் கொடுக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “பணியாளர்களின் கையில் அதைக் கொடுக்கட்டும்.” இங்கு இந்த எபிரெய மரபுத்தொடர் அவர்களின் பொறுப்பில் ஒப்படைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆலயத்தின் சேதத்தைப் பழுதுபார்ப்பதற்கு” என்பது சொல்லுக்கு சொல், “ஆலயத்தின் பிளவை/சேதத்தை வலுப்படுத்துவதற்கு” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה עַל יַד
  choice: பணியாளர்களிடம் ஒப்படைக்கட்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; ஆனால் עַל יַד உடன் இது ஒருவரின் பொறுப்பில் அல்லது காவலில் ஒப்படைப்பதைக் குறிக்கிறது. கட்டளைச் சூழலை ‘ஒப்படைக்கட்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: பணியாளர்கள்
  rationale: சொல்லுக்கு சொல் ‘வேலையைச் செய்பவர்கள்.’ ஆலயப் பழுதுபார்ப்புப் பணியில் ஈடுபட்டவர்களை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הַמֻּפְקָדִים
  choice: பொறுப்பாக நியமிக்கப்பட்டுள்ள
  rationale: Hophal வடிவம் நியமிக்கப்பட்ட அல்லது பொறுப்பில் வைக்கப்பட்டவர்களைக் குறிக்கிறது; அவர்களின் குறிப்பிட்ட பதவியை ஊகிக்காமல் செயப்பாட்டு நுணுக்கத்தைப் பேணுகிறது.
- source_word: בבית יהוה
  choice: யெகோவாவின் ஆலயத்தில்
  rationale: בית என்பது நேரடியாக ‘வீடு’ என்றாலும், இச்சூழலில் எருசலேம் ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ சாதாரண தமிழ் வாசகருக்குத் தெளிவானது.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: அவர்கள் அதை ... கொடுத்து
  rationale: נתן வினையின் நேரடிப் பொருளைத் தக்கவைத்து, பணத்தின் பொறுப்பு ஒரு குழுவிலிருந்து மற்றொரு குழுவுக்குச் செல்வதை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּבֵית יהוה
  choice: யெகோவாவின் ஆலயத்தில் வேலை செய்கிற
  rationale: எபிரெயத்தில் இடம் மட்டும் வெளிப்படையாக இருந்தாலும், עֹשֵׂי הַמְּלָאכָה உடன் இணைந்து அங்கு வேலை செய்பவர்களைக் குறிக்கிறது; தமிழில் இயல்பான தெளிவுக்காக ‘வேலை செய்கிற’ பயன்படுத்தப்பட்டது.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: ஆலயத்தில் ஏற்பட்ட சேதங்களைப் பழுதுபார்க்கச் செய்ய
  rationale: சொல்லுக்கு சொல் ‘ஆலயத்தின் சேதத்தை/பிளவை வலுப்படுத்து.’ கட்டிடச் சூழலில் இது சேதமடைந்த பகுதிகளைச் சீரமைப்பதைக் குறிக்கிறது; causative chain-ஐ தமிழில் ‘பழுதுபார்க்கச் செய்ய’ காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராகப் பேணுகிறது; தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒரே வசனத்தில் வரும் இரண்டு பணியாளர் குழுக்களின் வேறுபாடு—பொறுப்பாக நியமிக்கப்பட்டவர்கள் மற்றும் நடைமுறைப் பணியாளர்கள்—தெளிவாக வைக்கப்பட்டுள்ளது. ‘வீடு’ என்பதற்குப் பதில் சூழலுக்குத் தெளிவான ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; இறுதியில் ‘ஆலயம்’ என்று கூறுவது மீளுரைப்பை இயல்பாக வைத்திருக்கிறது.
