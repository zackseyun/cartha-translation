  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: ta
  text: அவர்கள் என்னைக் கைவிட்டு, வேறு தெய்வங்களுக்குப் படைப்புகளை எரித்துச் செலுத்தி[a], தங்கள் கைகளின் எல்லாச் செயல்களாலும் எனக்குக் கோபமூட்டுவதற்காகச் செய்ததால், இந்த இடத்தில் என் கடுங்கோபம் பற்றியெரிந்துள்ளது; அது அணையாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, “வேறு தெய்வங்களுக்குத் தூபம் எரித்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: קטר என்ற வினை எரித்துப் படைப்பதைப் பொதுவாகக் குறிக்கலாம்; பல இடங்களில் அது குறிப்பாகத் தூபம் எரிப்பதைக் குறிக்கிறது.
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: …மூட்டியதால்
  rationale: தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲזָבוּנִי
  choice: என்னைக் கைவிட்டு
  rationale: עזב என்பதின் கைவிடுதல், உறவைத் துறத்தல் ஆகிய வலிமையைப் பேணுகிறது.
- source_word: וַיְקַטְּרוּ
  choice: பலிகளை எரித்துச் செலுத்தி
  rationale: קטר என்பதிலுள்ள எரித்துப் படைக்கும் வழிபாட்டுச் செயலைப் பேணுகிறது; அது தூபங்காட்டுதலைக் குறிப்பாகக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் அந்த மாற்று தரப்படுகிறது.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்கு
  rationale: யெகோவாவைத் தவிர பிற தெய்வங்களைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: எனக்குக் கோபமூட்டி
  rationale: הכעיס என்பதின் ‘கோபமூட்டு’ என்ற உறவுசார், உணர்வுசார் வலிமையைப் பேணுகிறது; சூழலில் நோக்கமும் விளைவும் ஒன்றோடொன்று பின்னியிருக்கும் தன்மையைத் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: தங்கள் கைகளின் செயல்கள் அனைத்தினாலும்
  rationale: அவர்கள் உருவாக்கிய அல்லது செய்த விக்கிரகாராதனைச் செயல்களைச் சுட்டும் எபிரெய உருவகத்தைப் பேணுகிறது.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: என் கடுங்கோபம் பற்றியெரியும்
  rationale: חמה என்பதின் தீவிர கோபத்தையும் יצת என்பதின் தீப்பற்றும் உருவகத்தையும் ஒன்றாகப் பேணுகிறது; அடுத்துள்ள ‘அணைக்கப்படாது’ என்பதோடும் இயல்பாக இணைகிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்துக்கு எதிராக
  rationale: இடமே தெய்வீகத் தீர்ப்பின் இலக்கு என்பதைத் தெளிவான தமிழில் காட்டுகிறது.
- source_word: וְלֹא תִכְבֶּה
  choice: அது அணைக்கப்படாது
  rationale: தீயாகப் பற்றியெரியும் கோபத்தின் உருவகத்தையும் தீர்ப்பின் மாற்றமுடியாத தன்மையையும் பேணுகிறது.
theological_decisions:
- issue: இறைவனுடைய கோபத்தை மனித உணர்வைப் போன்ற மொழியில் கூறுதல்
  choice: ‘எனக்குக் கோபமூட்டி’, ‘என் கடுங்கோபம்’ என்ற நேரடியான மொழியைத் தக்கவைத்தல்
  alternative: இதை உணர்வற்ற, பொதுவான தண்டனை மொழியாக மென்மைப்படுத்துதல்
  rationale: மூல எபிரெயம் இறைவனுடைய நியாயத்தீர்ப்பை வெளிப்படையாக உறவுசார் மற்றும் உணர்வுசார் மொழியில் கூறுகிறது; அந்த இறையியல் இழுவையை மொழிபெயர்ப்பு மறைக்கக்கூடாது.
- issue: தெய்வீகத் தீர்ப்பின் தீ உருவகம்
  choice: ‘பற்றியெரியும்; அது அணைக்கப்படாது’ என்று உருவகத்தைப் பேணுதல்
  alternative: ‘தண்டனை உறுதியாக வரும்’ என்று உருவகத்தை விளக்கமாக மாற்றுதல்
  rationale: மூலத்தில் கோபம் அணைக்க முடியாத தீயாகச் சித்தரிக்கப்படுகிறது; பின்னாளைய கோட்பாடுகளைச் சேர்க்காமல் அந்த உருவகத்தின் வலிமை பாதுகாக்கப்படுகிறது.
- issue: לְמַעַן என்பதிலுள்ள நோக்கம் அல்லது விளைவு
  choice: தொடரமைப்பில் ‘எனக்குக் கோபமூட்டி’ என்று இரண்டிற்கும் இடமளித்தல்
  alternative: ‘என்னை வேண்டுமென்றே கோபப்படுத்துவதற்காக’ என்று மனிதர்களின் உள்நோக்கத்தைத் திட்டவட்டமாக்குதல்
  rationale: לְמַעַן நோக்கம் அல்லது விளைவு நிழலைக் கொண்டிருக்கலாம். மனிதர்களின் உள்நோக்கத்தை மூலத்தைவிட அதிகமாகத் தீர்மானிக்காமல் செயலும் அதன் தெய்வீக விளைவும் கூறப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘கைவிட்டு’, ‘கைகளின் செயல்கள்’, ‘பற்றியெரியும்’, ‘அணைக்கப்படாது’ ஆகியவை மூலத்தின் உடன்படிக்கைச் சார்ந்த உறவு, விக்கிரகப் polemic, தீ உருவகம் ஆகியவற்றை இயல்பான தமிழில் பேணுகின்றன.
