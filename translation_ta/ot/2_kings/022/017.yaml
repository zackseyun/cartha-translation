  to: அவர்கள் என்னைக் கைவிட்டு, வேறு தெய்வங்களுக்குப் படைப்புகளை எரித்துச் செலுத்தி[a], தங்கள் கைகளின் எல்லாச் செயல்களாலும் எனக்குக் கோபமூட்டுவதற்காகச் செய்ததால், இந்த இடத்தில் என் கடுங்கோபம் பற்றியெரிந்துள்ளது; அது அணையாது.
  rationale: மூலத்தின் காரணத் தொடரைத் தக்கவைத்தபடி, வினைநிலையை ‘பற்றியெரிந்துள்ளது’ எனச் சரிசெய்தோம். לְמַעַן-இன் நோக்கப் பொருளை ‘கோபமூட்டுவதற்காக’ என வெளிப்படுத்தினோம். ‘இந்த இடத்தில்’ என்பது எபிரெய முன்னிடைச்சொல்லின் இடவியல் நிழலைப் பாதுகாக்கிறது. கטר-இன் பரந்த பொருளுக்கு முதன்மை உரையில் எரிப்புப் படைப்பு மொழியும், குறிப்பான தூபப் பொருளுக்கு அடிக்குறிப்பும் வழங்கப்பட்டுள்ளன.
