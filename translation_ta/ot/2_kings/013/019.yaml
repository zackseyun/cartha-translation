base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: ta
  text: அப்போது தேவனுடைய மனிதர் அவர்மீது கோபமடைந்து, “நீர் தரையை ஐந்து அல்லது ஆறு முறை தாக்கியிருக்க வேண்டும்[a]. அப்போது அராமை முற்றிலும் முடிவுக்குக் கொண்டுவரும்வரை தாக்கியிருப்பீர்[b]. ஆனால் இப்போதோ அராமை மூன்று முறை மட்டுமே தாக்குவீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இங்கு ‘தாக்க’ என்று மட்டுமே உள்ளது; ‘தரையை’ என்பது உடனடியாக முந்திய 18ஆம் வசனத்தின் செயலிலிருந்து வழங்கப்பட்டுள்ளது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘அராம் முற்றிலும் ஒழியும்வரை’; இன்னொரு சாத்தியம், ‘அராமை முற்றிலும் அழித்தொழிக்கும்வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: கோபமடைந்து
  rationale: קצף கோபம் அல்லது சினத்தைக் குறிக்கிறது. நிகழ்வுரையின் கண்டிப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தீவிரத்தை தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது; சூழலில் அவர் தீர்க்கதரிசியாக இருந்தாலும், ‘தீர்க்கதரிசி’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: לְהַכּוֹת
  choice: தரையை ... தாக்கியிருக்க வேண்டும்
  rationale: எபிரெயில் செயப்படுபொருள் இவ்வசனத்தில் வெளிப்படையாக இல்லை; முந்தைய வசனத்தின் அடையாளச் செயலிலிருந்து ‘தரையை’ வழங்குவது பொருளைத் தெளிவாக்குகிறது. ‘தாக்கு’ என்ற வினை பின்னர் அராமுக்கு எதிரான இராணுவத் தாக்குதலுடனான சொல்லியல் இணைப்பையும் காக்கிறது.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: ஐந்து அல்லது ஆறு முறை
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: நிகழாமல் போன செயலின் விளைவைக் குறிக்கும் நிபந்தனைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: அராம் ... அதைத் தாக்கியிருப்பீர்
  rationale: נכה என்ற ஒரே வினை அடையாளச் செயலுக்கும் இராணுவ விளைவுக்கும் பயன்படுத்தப்பட்டிருப்பதை ‘தாக்கு’ மூலம் காக்கிறது.
- source_word: עַד כַּלֵּה
  choice: முற்றிலும் ஒழியும்வரை
  rationale: כלה இங்கு அராமின் இராணுவ வல்லமை முழுமையாக முடிவுக்கு வருவதைக் குறிக்கிறது. ‘ஒழியும்வரை’ நிறைவு அல்லது முடிவு என்ற கருத்தைத் தெரிவிக்கிறது; அழித்தொழித்தல் என்ற மிகத் திட்டமான பொருளை பிரதான உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போதோ
  rationale: நிகழ்ந்திருக்கக்கூடிய முழுமையான வெற்றிக்கும் இப்போது வரையறுக்கப்பட்ட வெற்றிக்கும் இடையிலான எதிர்மறை வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: அராமை மூன்று முறை மட்டுமே தாக்குவீர்
  rationale: வினை வடிவத்தின் முன்னறிவிப்புத் தன்மையை எதிர்காலத்தில் தருகிறது. ‘மட்டுமே’ என்பது ஐந்து அல்லது ஆறு முறைகளுடனான சூழல் சார்ந்த முரண்பாட்டையும் கட்டுப்பாட்டையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தரையைத் தாக்குவதற்கும் அராமைத் தாக்குவதற்கும் இடையிலான அடையாளத் தொடர்பு
  choice: இரு செயல்களுக்கும் ‘தாக்கு’ என்ற ஒரே தமிழ் வினையைப் பயன்படுத்தி, முதல் இடத்தில் சூழலிலிருந்து ‘தரையை’ வழங்குதல்.
  alternative: முதல் செயலை ‘தரையை அடி’ என்றும் இரண்டாவதை ‘அராமைத் தோற்கடி’ என்றும் மொழிபெயர்த்தல்.
  rationale: அரசன் தரையைத் தாக்கிய எண்ணிக்கையும் அராம்மீது கிடைக்கவிருந்த வெற்றிகளின் எண்ணிக்கையும் தீர்க்கதரிசன அடையாளச் செயலில் இணைந்துள்ளன. ஒரே வினை அந்த இணைப்பை வாசகர் காண உதவுகிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: עַד כַּלֵּה என்பதன் தீவிரத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘முற்றிலும் ஒழியும்வரை’ என்று மொழிபெயர்த்து, முழுமையான முடிவைக் குறித்தாலும் அதன் சரியான இராணுவ விளைவை விரிவாக்காமல் விடுதல்.
  alternative: ‘அராமை முற்றிலும் அழித்தொழிக்கும்வரை’ அல்லது ‘முடிவுக்குக் கொண்டுவரும்வரை’.
  rationale: எபிரெயம் நிறைவு அல்லது முடிவை வலியுறுத்துகிறது; அது அரசியல்-இராணுவ முடிவா அல்லது முழு அழிவா என்பதை தமிழ் உரை தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட எளிய நடையைப் பயன்படுத்துகிறது. அரசனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘தாக்குவீர்’ பயன்படுத்தப்பட்டுள்ளன. ‘தேவனுடைய மனிதர்’ என்ற மரபுச் சொல்லாட்சி மூலமொழியின் பட்டப்பெயரைப் பாதுகாக்கிறது.
