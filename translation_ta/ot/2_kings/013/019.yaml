  terminology: ‘தேவனுடைய மனிதர்’ என்பது אִישׁ הָאֱלֹהִים என்ற பட்டப்பெயரை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது. ‘தாக்கு’ என்ற வினை நכה-வின் மீள்பயன்பாட்டை நன்றாகக் காட்டுகிறது. ‘முற்றிலும் முடிவுக்குக் கொண்டுவரும்வரை’ என்பது עַד כַּלֵּה-யின் முழுமை/முடிவு கருத்தைத் தருகிறது; குறிப்பிட்ட வகை அழிவைத் தேவையின்றி நிர்ணயிப்பதில்லை.
