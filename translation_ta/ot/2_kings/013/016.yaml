  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: ta
  text: பின்பு அவர் இஸ்ரவேலின் அரசனிடம், “உமது கையை வில்லின் மேல் வையுங்கள்[a]” என்றார். அரசன் தன் கையை அதன்மேல் வைத்தான். அப்போது எலிசா தமது கைகளை அரசனின் கைகளின் மேல் வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “உமது கையை வில்லின் மேல் ஏற்றுங்கள்.”
    reason: רכב வேரின் ஹிஃபில் வடிவத்திற்கான அதிக நேரடியான சொற்பொருள் மாற்றைக் காட்டுகிறது; முதன்மை உரையில் இயல்பான “வையுங்கள்” பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: הַרְכֵּב
  choice: வையும்
  rationale: ரכב என்பதன் ஹிஃபில் கட்டளை வடிவம் இங்கு கையை வில்லின்மேல் வைக்கச் சொல்கிறது. மூலத்தின் உருவகத்தைச் சொற்சொல்லாகப் பின்பற்றும் ‘ஏற்றும்’ என்பதைவிட, ‘வையும்’ என்பது செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: உமது கையை வில்லின்மேல்
  rationale: עַל குறிக்கும் இடத்தொடர்பை ‘-மேல்’ நேரடியாகக் காட்டுகிறது; ‘உமது’ என்பது அரசனிடம் உரைக்கப்படும் கண்ணியமான ஒருமை வடிவம்.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: அவன் தன் கையை அதன்மேல் வைத்தான்
  rationale: எபிரெயத்தில் ‘வில்’ மீண்டும் வெளிப்படையாகக் கூறப்படவில்லை. ‘அதன்மேல்’ என்பது முந்தைய வில்லைத் தெளிவாகச் சுட்டி, பொருளை மிகைப்படுத்தாமல் இயல்பான தமிழை வழங்குகிறது.
- source_word: וַיָּשֶׂם
  choice: வைத்தார்
  rationale: செயலை விளக்கவோ அதன் குறியீட்டுப் பொருளைச் சேர்க்கவோாமல், எலிசா தமது கைகளை அரசனின் கைகள்மேல் வைத்த செயலை எளிமையாகத் தெரிவிக்கிறது.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: தமது கைகளை அரசனின் கைகள்மேல்
  rationale: எலிசாவின் கைகளையும் அரசனின் கைகளையும் மூலத்தைப் போலவே பன்மையில் வைத்து, உடல் செயலின் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: பின்பு அவர் இஸ்ரவேலின் அரசனிடம் … என்றார்
  rationale: வாவ் தொடர்வினை காட்டும் நிகழ்வுவரிசையை ‘பின்பு’ இயல்பாக வெளிப்படுத்துகிறது; ‘அரசனிடம் … என்றார்’ என்பது தற்போதைய தரமான தமிழுக்கு ஏற்ற உரையாடல் அமைப்பு.
theological_decisions:
- issue: எலிசா தமது கைகளை அரசனின் கைகள்மேல் வைத்ததன் குறியீட்டுப் பொருள்
  choice: செயலை மட்டும் நேரடியாக மொழிபெயர்த்து, விளக்கத்தை வசனத்திற்குள் சேர்க்கவில்லை.
  alternative: இது தீர்க்கதரிசன வல்லமையளிப்பு அல்லது போரில் இறைவழிநடத்துதலின் அடையாளம் என்று வெளிப்படையாகக் கூறுதல்.
  rationale: இச்செயலின் பொருளைச் சுற்றியுள்ள வசனங்கள் விளக்குகின்றன; இந்த வசனம் அந்தச் செயலை மட்டுமே விவரிக்கிறது. ஆகவே மொழிபெயர்ப்பு எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் உரைக்குள் இறக்குமதி செய்யாமல் பதற்றத்தையும் குறியீட்டுத் திறப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனுக்கான நேரடி உரையில் ‘உமது’ என்றும், எலிசாவைக் குறிப்பிடும்போது மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளன; செயல் விவரிப்பில் தேவையற்ற பழமையான அல்லது சமயவிளக்கச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
