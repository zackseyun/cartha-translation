  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: ta
  text: எலிசா தாம் இறக்கப்போகும் நோயால் நோயுற்றிருந்தார். இஸ்ரவேலின் அரசன் யோவாஸ் அவரிடம் இறங்கிச் சென்று, அவர்மேல் கண்ணீர் சிந்தி, “என் தந்தையே[a], என் தந்தையே! இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த அழைப்பு 2 இராஜாக்கள் 2:12-இல் எலியா குறித்து எலிசா கூறிய அதே சொற்களை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: நோயால் நோயுற்றிருந்தார்
  rationale: எபிரேய மூலத்திலுள்ள வினை–பெயர்ச்சொல் மீளுருவைத் தக்கவைத்து, பின்னணி நிலையைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: தான் இறக்கக் காரணமாகவிருந்த
  rationale: அந்நோய் பின்னர் அவருடைய மரணத்துக்குக் காரணமாகும் என்ற கதைநிலையின் எதிர்நோக்கைத் தக்கவைக்கிறது.
- source_word: וַיֵּרֶד אֵלָיו
  choice: அவரிடம் இறங்கிச் சென்று
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய திசைக் குறிப்பை விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: அவர்மேல் கண்ணீர்விட்டு
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய முகத்தின்மேல் அழுதான்’ என்பது தமிழில் இயல்பற்றது; துயரத்துடன் அவர்மேல் சாய்ந்து அழுத காட்சியை அளவுக்கு மீறி விளக்காமல் இயல்பாகத் தருகிறது.
- source_word: אָבִי אָבִי
  choice: என் தந்தையே, என் தந்தையே!
  rationale: முதலாம் நபர் உடைமைப் பின்னொட்டையும் துயரமும் மரியாதையும் நிறைந்த அழைப்பின் வலிமையையும் பாதுகாக்கிறது.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்
  rationale: רֶכֶב என்பதன் ஒருமையையும் உருவகத்தின் தெளிவுபடுத்தப்படாத வலிமையையும் தக்கவைத்து, 2 இராஜாக்கள் 2:12-இன் ஒலிப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்’ என்ற உருவகத்தின் பொருள்
  choice: எலிசாவை நோக்கிய நேரடி வியப்பும் புலம்பலும் கொண்ட அழைப்பாக அப்படியே வைக்கப்பட்டது.
  alternative: எலிசாவே இஸ்ரவேலின் உண்மையான இராணுவப் பாதுகாப்பு என்று விளக்கிப் பரவலாக்குதல்; அல்லது இதை விண்ணுலகத் தேர்களின் காட்சியாகக் கூறுதல்.
  rationale: மூலவாக்கியம் தீர்மானமாக விளக்காத உருவகத்தை மொழிபெயர்ப்பு விளக்கிவிடாமல் பாதுகாக்கிறது; இது 2 இராஜாக்கள் 2:12-ஐ நினைவூட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. அரசரைக் குறிக்கவும் தீர்க்கதரிசியை அவர் அணுகும் மரியாதையை வெளிப்படுத்தவும் உயர்திணை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற தொடக்க இணைப்புச்சொல் சேர்க்கப்படவில்லை.
