  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் தீமையானதைச் செய்தான்; இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களைப் பின்பற்றினான். அவற்றைவிட்டு அவன் விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அதைவிட்டு அவன் விலகவில்லை.” எபிரெயத்தில் பெண்பால் ஒருமை பின்னொட்டு உள்ளது; அது யெரொபெயாமின் பாவ வழக்கை ஒட்டுமொத்தமாகக் குறிப்பதாக இருக்கலாம்.'
    reason: மூலத்தின் இலக்கண ஒருமைக்கும் சூழலுக்கேற்ற பன்மை மொழிபெயர்ப்புக்கும் இடையிலான வேறுபாட்டைப் பதிவு செய்தல்.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: அவன் யெகோவாவின் பார்வையில் தீமையானதைச் செய்து
  rationale: அரசர்களின் நடத்தையை மதிப்பிடும் இந்நூலின் வழக்கமான எபிரெயச் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது; வாக்கியத் தொடர்ச்சிக்காக வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்பாக மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயரைத் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: וַיֵּלֶךְ אַחַר
  choice: பின்பற்றி நடந்தான்
  rationale: ‘பின்னால் நடந்தான்’ என்ற மூல உருவகத்தையும், ஒருவரின் வழிமுறையைப் பின்பற்றுதல் என்ற பொருளையும் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: חַטֹּאת יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாமின் பாவங்கள்
  rationale: பன்மை வடிவமான ‘பாவங்கள்’ என்பதையும் எபிரெயத் தந்தைவழி அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: חטא என்பதன் ஹிஃபில் causative வினை வடிவத்தை ‘பாவம் செய்ய வைத்த’ என்று வெளிப்படையாகத் தருகிறது.
- source_word: לֹא סָר מִמֶּנָּה
  choice: அவற்றைவிட்டு அவன் விலகவில்லை
  rationale: סור என்பதற்கு ‘விலகு’ எனத் தரப்பட்டு, சூழலில் யெரொபெயாமின் பாவங்களைச் சுட்டும் பொருள் இயல்பான தமிழில் பன்மையாக வெளிப்படுத்தப்பட்டுள்ளது; மூலத்தின் ஒருமை பின்னொட்டு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பு அதைத் தனிப்பெயராகவே காக்கிறது.
- issue: מִמֶּנָּה என்பதிலுள்ள பெண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள்
  choice: சூழலுக்கேற்ப ‘அவற்றைவிட்டு’ என்று, யெரொபெயாமின் பாவங்களைச் சுட்டும் பன்மையாக மொழிபெயர்த்தல்
  alternative: ‘அதைவிட்டு’ என்று மூல இலக்கண ஒருமையை நேரடியாகக் காத்தல்
  rationale: முன்னுள்ள ‘பாவங்கள்’ யெரொபெயாமின் ஒட்டுமொத்த பாவ வழக்கத்தைக் குறிக்கின்றன. தமிழில் பன்மை சுட்டுப்பெயர் தெளிவாக உள்ளது; எனினும் எபிரெயத்தின் உண்மையான இலக்கண ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
