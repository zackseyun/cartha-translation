base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: ta
  text: அவர்கள் ஒரு மனிதனை அடக்கம் செய்துகொண்டிருந்தபோது, திடீரென்று கொள்ளையடிக்கும் ஒரு படைக்குழுவைக் கண்டார்கள். எனவே, அந்த மனிதனை எலிசாவின் கல்லறைக்குள் எறிந்தார்கள். அந்த மனிதன் சென்று எலிசாவின் எலும்புகளைத் தொட்டபோது, உயிர்பெற்று, தன் கால்களில் எழுந்து நின்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגְּדוּד
  choice: அந்தக் கொள்ளைக்கூட்டம்
  rationale: இச்சொல் ஆயுதமேந்திய திடீர்த் தாக்குதல் அல்லது சூறையாடல் குழுவைக் குறிக்கிறது; சூழலில் இயல்பான தமிழாக ‘கொள்ளைக்கூட்டம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּשְׁלִיכוּ
  choice: வீசிவிட்டார்கள்
  rationale: அச்சுறுத்தலைக் கண்டவுடன் உடலை அவசரமாகக் கல்லறைக்குள் எறிந்த செயலை வினையின் வலிமையுடன் தெரிவிக்கிறது.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: விழுந்து ... எலும்புகள்மீது பட்டதும்
  rationale: மசோரா உரையின் எழுத்துப்படி ‘சென்று, தொட்டான்’ எனப் பொருள்படலாம்; உயிரற்ற உடலின் இயக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் ‘விழுந்து ... பட்டதும்’ என்று அளிக்கிறது. உரைச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְחִי
  choice: உயிர்பெற்று
  rationale: இறந்த மனிதன் மீண்டும் உயிரடைந்ததைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיָּקָם עַל רַגְלָיו
  choice: தன் கால்களால் எழுந்து நின்றான்
  rationale: எபிரேய மொழியின் உடற்கூறு நிறைந்த வெளிப்பாட்டை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலுக்கான காரணத்தை விளக்குதல்
  choice: நிகழ்வை மட்டும் உரைக்கிறது; எலிசாவின் எலும்புகளுக்கு இயல்பான அல்லது தனித்த மந்திர ஆற்றல் இருந்ததாகக் கூறவில்லை.
  alternative: எலும்புகளின் சக்தியால் உயிர்பெற்றான் என்று காரணத்தை வெளிப்படையாகச் சேர்த்தல்.
  rationale: மூல உரை தொடுதல் மற்றும் உயிர்பெறுதல் ஆகியவற்றை அடுத்தடுத்து கூறுகிறது; ஆனால் சக்தியின் இயல்பையோ செயல்முறையையோ விளக்கவில்லை. ஆகவே அந்தத் தெய்வவியல் பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கதைநடைக்கு ஏற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘திடீரென்று’ என்பது וְהִנֵּה-யின் திடீர் காட்சிமாற்றச் செயல்பாட்டை இயல்பாகத் தருகிறது. வசனத்தில் உள்ள [a] குறி தொடர்புடைய அடிக்குறிப்புடன் பொருந்துகிறது.
