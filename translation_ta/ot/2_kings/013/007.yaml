  text: כִּ֣י לֹא֩ הִשְׁאִ֨יר לִ/יהוֹאָחָ֜ז עָ֗ם כִּ֣י אִם חֲמִשִּׁ֤ים פָּֽרָשִׁים֙ וַ/עֲשָׂ֣רָה רֶ֔כֶב וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רַגְלִ֑י כִּ֤י אִבְּדָ/ם֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יְשִׂמֵ֥/ם כֶּֽ/עָפָ֖ר לָ/דֻֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: ta
  text: ஏனெனில், அராம் அரசன் யெகோவாகாசுக்கு ஐம்பது குதிரைவீரர்கள், பத்துத் தேர்கள், பத்தாயிரம் காலாட்படை வீரர்கள் ஆகியவை தவிர வேறு படைப்பலத்தை விட்டுவைக்கவில்லை; அவர் அவர்களை அழித்து, போரடிப்பதற்கான புழுதியைப்போல் ஆக்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிதிக்கப்படுவதற்கான புழுதியைப்போல் ஆக்கினான்.” எபிரெயச் சொல் தானியத்தைப் போரடிக்கும் செயலையும் அதில் உள்ள மிதித்தல் படிமத்தையும் குறிக்கலாம்.
    reason: לָדוּשׁ என்பதற்கு ‘போரடித்தல்’ முதன்மைப் பொருளாக இருந்தாலும், அதனுடன் தொடர்புடைய மிதித்தல் படிமத்தை மாற்று மொழிபெயர்ப்பாகக் காட்டுகிறது.
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: விட்டுவைக்கவில்லை
  rationale: இந்த இடத்தில் ஹிஃபில் வடிவம் ‘மீதியாக இருக்கச் செய்தல்/விட்டுவைத்தல்’ எனப் பொருள்படுகிறது; எதிர்மறை வாக்கியத்தில் ‘விட்டுவைக்கவில்லை’ இயல்பான தமிழாகும்.
- source_word: עָם
  choice: படைவீரர்கள்
  rationale: அடிப்படைப் பொருள் ‘மக்கள்’ என்றாலும், தொடர்ந்து குதிரைவீரர்கள், தேர்கள், காலாட்படை வீரர்கள் பட்டியலிடப்படுவதால் இங்கு யெகோவாகாசின் படைப்பலத்தைக் குறிக்கிறது.
- source_word: כִּי אִם
  choice: தவிர வேறு ... யாரையும்
  rationale: எதிர்மறைக்குப் பின் எஞ்சியிருந்த ஒரே பகுதியைச் சுட்டும் ‘தவிர/மட்டுமே’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: குதிரைமேல் போரிடும் வீரர்களைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் வந்தாலும், பத்து என்ற எண்ணோடு இங்கு போர்த்தேர்களைக் குறிக்கிறது.
- source_word: רַגְלִי
  choice: காலாட்படை வீரர்கள்
  rationale: கால்நடையாகப் போரிடும் படையினரைத் தெளிவாகக் குறிக்கிறது.
- source_word: אִבְּדָם
  choice: அவர்களை அழித்து
  rationale: பியேல் வடிவத்தின் வலுவான அழித்தல் பொருளைப் பாதுகாக்கிறது; பொருள் பின்னொட்டு யெகோவாகாசின் படைவீரர்களைக் குறிக்கிறது.
- source_word: וַיְשִׂמֵם
  choice: ஆக்கியிருந்தான்
  rationale: ஒப்புமைத் தொடருடன் வரும் שׂים, ஒரு நிலைக்கு ஆக்குதல் என்ற பொருளைக் கொண்டது; முந்திய அழிவை விளக்கும் இறந்தகாலத் தொடர்பையும் தமிழ் வடிவம் காட்டுகிறது.
- source_word: כֶּעָפָר
  choice: புழுதியைப்போல்
  rationale: ஒப்புமையையும் முற்றாக மிதிக்கப்பட்டு சிதைந்த நிலையின் உருவகத்தையும் காக்கிறது.
- source_word: לָדוּשׁ
  choice: போரடிக்கும்போது உண்டாகும்
  rationale: דושׁ தானியத்தை மிதித்துப் பிரிக்கும் ‘போரடித்தல்’ செயலைக் குறிக்கிறது. தமிழ் வாசகருக்கு உருவகம் தெளிவாக அமையச் சூழலோடு வழங்கப்பட்டுள்ளது; ‘மிதிக்கப்படும் புழுதி’ என்ற மாற்று தொடர்பும் சாத்தியம்.
