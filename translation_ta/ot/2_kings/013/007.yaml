translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மக்கள்’ என்பதற்குப் பதிலாக உடனடி இராணுவச் சூழலைத் தெளிவாக்க ‘படைவீரர்கள்’ பயன்படுத்தப்பட்டது. போரடித்தல் உருவகத்தின் உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
