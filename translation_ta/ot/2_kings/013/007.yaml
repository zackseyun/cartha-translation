- from: ஏனெனில், யெகோவாகாசுக்கு ஐம்பது குதிரைவீரர்களும் பத்துத் தேர்களும் பத்தாயிரம் காலாட்படை வீரர்களும் தவிர வேறு படைவீரர்கள் யாரையும் அவன் விட்டுவைக்கவில்லை. அராம் அரசன் அவர்களை அழித்து, போரடிக்கும்போது உண்டாகும் புழுதியைப்போல் ஆக்கியிருந்தான்.[a]
  to: ஏனெனில், அராம் அரசன் யெகோவாகாசுக்கு ஐம்பது குதிரைவீரர்கள், பத்துத் தேர்கள், பத்தாயிரம் காலாட்படை வீரர்கள் ஆகியவை தவிர வேறு படைப்பலத்தை விட்டுவைக்கவில்லை; அவர் அவர்களை அழித்து, போரடிப்பதற்கான புழுதியைப்போல் ஆக்கினான்.[a]
  rationale: திருத்தம் இராணுவப் பட்டியலின் கூட்டுத்தன்மையை “படைப்பலம்” மூலம் காக்கிறது; தேர்களையும் வீரர்களையும் ஒரே இயல்பான தமிழ்த் தொடரில் உள்ளடக்குகிறது. பிரதான உரை לָדוּשׁ-இன் ‘போரடித்தலுக்கான’ படிமத்தை நேரடியாகத் தருகிறது; சாத்தியமான ‘மிதித்தல்’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
