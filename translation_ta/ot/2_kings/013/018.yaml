translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் உள்ள சுட்டுப்பெயர் தொடர்ச்சி பாதுகாக்கப்பட்டுள்ளது; சூழலில் வெளிப்படையாக இல்லாத ‘அம்புகளை எய்தல்’ போன்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
