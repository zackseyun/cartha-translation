  text: וַ/יֹּ֛אמֶר קַ֥ח הַ/חִצִּ֖ים וַ/יִּקָּ֑ח וַ/יֹּ֤אמֶר לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ הַךְ אַ֔רְצָ/ה וַ/יַּ֥ךְ שָֽׁלֹשׁ פְּעָמִ֖ים וַֽ/יַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: ta
  text: பின்பு அவர், “அம்புகளை எடு” என்றார்; அவன் அவற்றை எடுத்தான். அவர் இஸ்ரவேலின் அரசனிடம், “தரையை அடி” என்றார். அவன் மூன்று முறை அடித்துவிட்டு நிறுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நின்றுவிட்டான்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “நின்றான்”; இங்கு மூன்று முறை அடித்தபின் அவன் நிறுத்தியதைச் சூழலுக்கேற்றபடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: அம்புகளை எடு
  rationale: கட்டளையின் நேரடித்தன்மையையும், எபிரெய உரையிலுள்ள குறிப்பிட்ட அம்புகளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקָּח
  choice: அவன் அவற்றை எடுத்துக்கொண்டான்
  rationale: எபிரெயத்தில் பொருள் மீண்டும் சொல்லப்படாவிட்டாலும், தமிழில் ‘அவற்றை’ என்பது முன் குறிப்பிடப்பட்ட அம்புகளைக் இயல்பாகச் சுட்டுகிறது.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனிடம்
  rationale: மறைமுகச் செயப்படுபொருள் உறவைத் தெளிவாகவும் கண்ணியமான கதையாடல் நடையிலும் தருகிறது.
- source_word: הַךְ אַרְצָה
  choice: தரையை அடி
  rationale: נכה என்பதன் வலிமையான கட்டளையை ‘அடி’ வெளிப்படுத்துகிறது; ‘எய்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத செயலைச் சேர்த்துவிடும். אַרְצָה இங்கு கீழ்நோக்கி, தரையை நோக்கிய செயலைக் குறிக்கிறது.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: மூன்று முறை
  rationale: எண்ணிக்கையையும் திரும்ப நிகழ்ந்த செயலையும் இயல்பாகத் துல்லியமாகக் காட்டுகிறது.
- source_word: וַיַּעֲמֹד
  choice: நிறுத்தினான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘நின்றான்’ என்றாலும், இச்சூழலில் மூன்று முறை அடித்தபின் செயலைத் தொடராமல் நிறுத்தியதைக் குறிக்கிறது.
