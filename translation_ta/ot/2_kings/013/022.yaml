lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: ஆசகேல்
  rationale: வாவ் தொடரும் விவரிப்பை முன்னெடுக்கிறது; தமிழில் தனியான ‘இப்போது’ அல்லது ‘பின்பு’ என்பதைச் சேர்க்காமல் இயல்பான வாக்கியத் தொடரால் அதன் பணி வெளிப்படுகிறது. பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசனான
  rationale: אֲרָם என்ற எபிரெய இடப்பெயருக்கு மரபுவழி ‘சீரியா’ என்பதற்குப் பதிலாக மூலமொழிக்கு நெருக்கமான ‘அராம்’ பயன்படுத்தப்பட்டது; இணைநிலைச் சொற்றொடர் இயல்பான தமிழில் தரப்பட்டது.
- source_word: לָחַץ
  choice: ஒடுக்கினான்
  rationale: இவ்வினைச்சொல் தொடர்ந்து நெருக்குதல், துன்புறுத்துதல் அல்லது அடக்கி ஒடுக்குதல் என்பதைக் குறிக்கிறது. அராமிய அரசியல்-இராணுவ ஆதிக்கத்தின் தொடர்ச்சியை ‘ஒடுக்கினான்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரயேலை
  rationale: நேரடி செயப்படுபொருள் குறியுடன் வரும் தேசப்பெயர்; இச்சூழலில் வடக்கு அரசைக் குறிக்கிறது.
- source_word: כֹּל יְמֵי
  choice: காலம் முழுவதும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களிலும்’ என்றாலும், ஒருவருடைய வாழ்நாள் அல்லது ஆட்சிக்காலத்தின் முழு நீளத்தையும் குறிக்கக்கூடிய எபிரெய வழக்கை இயல்பான தமிழில் வழங்குகிறது; மூலத்தின் காலவரம்பைத் தேவையின்றி மேலும் குறிப்பாக்கவில்லை.
- source_word: יְהוֹאָחָז
  choice: யோவாகாஸ்
  rationale: தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் வடிவில் ஒலிபெயர்க்கப்பட்டது.
