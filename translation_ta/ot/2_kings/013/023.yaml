source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: ta
  text: ஆனால் யாவே அவர்களுக்கு அருள் காட்டி, அவர்கள்மேல் இரக்கம் கொண்டு, ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன் செய்த தமது உடன்படிக்கையின் காரணமாக[a] அவர்கள்பக்கம் திரும்பினார். அவர்களை அழிக்க அவர் விரும்பவில்லை; இன்றுவரை அவர்களைத் தமது முன்னிலையிலிருந்து தள்ளிவிடவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன் செய்த தமது உடன்படிக்கையின் பொருட்டு.”
    reason: לְמַעַן என்பது இங்கு ‘காரணமாக’ என்றும் ‘பொருட்டு’ என்றும் மொழிபெயர்க்கப்படலாம்; இரண்டாவது வடிவம் உடன்படிக்கையை முன்னிட்டு அவர் செயல்பட்டார் என்ற நுணுக்கத்தை வலியுறுத்துகிறது.
lexical_decisions:
- source_word: וַיָּחָן
  choice: அருள்காட்டி
  rationale: חנן என்பதன் அருளான தயவு அல்லது இரக்கம் காட்டுதல் என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיְרַחֲמֵם
  choice: அவர்கள்மேல் இரக்கம்கொண்டு
  rationale: רחם குறிக்கும் ஆழ்ந்த பரிவையும் இரக்கத்தையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: அவர்கள்பக்கம் திரும்பினார்
  rationale: சாதகமான கவனத்தை உணர்த்தும் ‘அவர்களிடம் திரும்புதல்’ என்ற எபிரேய உருவகத்தை மிகையாக விளக்காமல் காக்கிறது.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: தமது உடன்படிக்கையின் காரணமாக
  rationale: இறைச்செயலுக்கான அடிப்படை அல்லது காரணத்தை למען இங்கு குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் தரப்பட்டுள்ளது.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன் செய்த
  rationale: மூதாதையர்களுடன் ஏற்படுத்தப்பட்ட உடன்படிக்கை என்பதைச் சுருக்கமான எபிரேய தொடரின் சூழலிலிருந்து இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: அவர்களை அழிக்க அவர் மனங்கொள்ளவில்லை
  rationale: אָבָה என்பதில் உள்ள விருப்பம் அல்லது மனவொப்புதல் சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: அவர்களைத் தமது முன்னிலையிலிருந்து தள்ளிவிடவும் இல்லை
  rationale: ‘தமது முகத்திற்கு முன்பிருந்து எறிந்துவிடுதல்’ என்ற மூல உருவகத்தின் உறவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַד עָתָּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் நிகழ்கால நோக்குநிலையின்வரை நிலை தொடர்ந்ததைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: இரக்கத்திற்கான உடன்படிக்கை சார்ந்த காரணம்
  choice: தமது உடன்படிக்கையின் காரணமாக
  alternative: தமது உடன்படிக்கையின் பொருட்டு
  rationale: இறைவனின் அருளும் அழிக்காதிருக்கும் மனமும் மூதாதையர்களுடனான உடன்படிக்கையோடு தொடர்புடையவை என்பதைப் பாதுகாக்கிறது; காரணம் மற்றும் பொருட்டு ஆகிய இரு சாத்திய நுணுக்கங்களையும் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாகக் காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தமது’ என்பது இறைவனைச் சுட்டும் மரியாதை ஒருமையை இயல்பாகத் தக்கவைக்கிறது; எபிரேய வாக்கியத்தின் தொடர்ச்சியான இறைச்செயல்கள் தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன.
