base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: ta
  text: யோவாஸ் தன் முன்னோர்களோடு நித்திரையடைந்தான்[a]. யெரொபெயாம் யோவாசின் அரியணையில் அமர்ந்தான். யோவாஸ் சமாரியாவில் இஸ்ரவேலின் அரசர்களோடு அடக்கம் செய்யப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் முன்னோர்களோடு படுத்துக்கொண்டான்’; இது ஓர் அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு நித்திரையடைந்தான்
  rationale: அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடரின் உருவகத்தைப் பேணுகிறது. நவீனத் தமிழில் ‘தந்தையர்களோடு’ என்பதைவிட ‘முன்னோர்களோடு’ என்பது இயல்பாகவும் வம்ச முன்னோர்களைத் தெளிவாகவும் குறிக்கிறது.
- source_word: וְיָרָבְעָם יָשַׁב עַל כִּסְאוֹ
  choice: யெரொபெயாம் அவனுடைய அரியணையில் அமர்ந்தான்
  rationale: ‘அரியணையில் அமர்ந்தான்’ என்பது மூலத்தின் அரச வாரிசுரிமை உருவகத்தை அப்படியே பேணுகிறது; ‘அவனுக்குப் பதிலாக அரசனானான்’ என்று விளக்கமாக விரித்துரைக்கவில்லை.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: செயலைச் செய்தவர் குறிப்பிடப்படாத எபிரெய வடிவத்தைத் தமிழிலும் செயப்பாட்டு வடிவில் இயல்பாக வழங்குகிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு இடப்பொருளில் வருவதால் இயல்பான தமிழ் இடவேற்றுமையால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்களோடு
  rationale: முந்தைய இஸ்ரவேல் அரசர்களுடன் ஒரே அரச அடக்கச் சூழலில் அடக்கம் செய்யப்பட்டதைக் குறிக்கும் மூலத்தின் ‘உடன்’ பொருளைப் பேணுகிறது.
theological_decisions:
- issue: ‘முன்னோர்களோடு நித்திரையடைந்தான்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: உருவக மரபுத்தொடர் முதன்மை உரையில் பேணப்பட்டது
  alternative: ‘இறந்தான்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இந்த இடத்தில் שׁכב עם־אבות என்பது அரசனின் மரணத்தைக் குறிக்கும் நிலையான கதைநடைச் சூத்திரம். அதை ‘இறந்தான்’ என்று தட்டையாக்காமல் அதன் இலக்கிய உருவகத்தையும் சாத்தியமான நுண்ணுணர்வையும் பேணுவது பொருத்தமானது; அடிக்குறிப்பு அதன் வழக்குப் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’, ‘அடக்கம் செய்யப்பட்டான்’ ஆகியவை அரசச் சூழலுக்கு ஏற்ற இயல்பான சொற்கள். பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவங்களில் தரப்பட்டுள்ளன.
