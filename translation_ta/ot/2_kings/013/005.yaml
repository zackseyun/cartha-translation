base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: ta
  text: யெகோவா இஸ்ரவேலுக்கு விடுவிப்பவர் ஒருவரைக்[a] கொடுத்தார். அதனால் அவர்கள் அராமின் கையின்கீழிருந்து[b] வெளியேறினார்கள். இஸ்ரவேல் மக்கள் முன்புபோல்[c] தங்கள் கூடாரங்களில் வாழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரட்சகர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மீட்பு அல்லது விடுதலை கொண்டுவருகிற ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அராமின் கையின் கீழிருந்து’; இது அராமின் அதிகாரம் அல்லது ஆதிக்கத்திலிருந்து விடுபட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: ‘முந்தைய காலத்தைப்போல’ என்றும் பொருள். சொல்லர்த்தமாக, ‘நேற்றும் அதற்கு முந்தின நாளும் போல’; இது முன்பிருந்த நிலையைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவம்; பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக எபிரெய தனிப்பெயரைத் தனிப்பெயராகவே காட்டுகிறது.
- source_word: מוֹשִׁיעַ
  choice: ஒரு விடுவிப்பவர்
  rationale: அராமிய ஆதிக்கத்திலிருந்து மீட்கும் வரலாற்று-அரசியல் செயற்பாட்டாளரை இயல்பாகக் குறிக்கிறது; ‘இரட்சகர்’ என்ற சொல்லால் தேவையின்றி உருவாகக்கூடிய பிற்காலத் தெய்வவியல் சார்பைத் தவிர்க்கிறது.
- source_word: מִתַּחַת יַד אֲרָם
  choice: அராமின் கைக்குக் கீழிருந்து
  rationale: அராமின் அதிகாரம் அல்லது ஆதிக்கத்தைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்காலப் புவியியல் பெயரான ‘சீரியா’ என்பதற்குப் பதிலாக மூலத்தில் உள்ள வரலாற்று அரசின் பெயரைப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவையும் குறிக்கும் வழக்குத் தொடராக இருப்பதால் நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வழங்கப்படுகிறது.
- source_word: בְּאָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்களில்
  rationale: எபிரெய மூலத்தின் தெளிவான உருவச்சொல்லான ‘கூடாரங்கள்’ என்பதைக் காக்கிறது.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: முன்புபோல
  rationale: சொல்லர்த்தத்தில் ‘நேற்றும் முந்தின நாளும் போல’ எனும் எபிரெய மரபுத்தொடர், முந்தைய நிலை திரும்பியதைக் குறிக்கிறது; ‘முன்புபோல’ என்பது இயல்பான தமிழ் சமமானது.
- source_word: וַיֵּצְאוּ
  choice: வெளியேறினார்கள்
  rationale: יצא வினையின் அடிப்படை இயக்கப் பொருளைக் காக்கிறது; எதிலிருந்து வெளியேறினார்கள் என்பதைத் தொடர்ந்து வரும் ஆதிக்க உருவகம் விளக்குகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: வாழ்ந்தார்கள்
  rationale: ‘அமர்ந்தார்கள்/குடியிருந்தார்கள்’ என்ற அடிப்படைப் பொருள்களில், கூடாரங்களில் இயல்பான வாழ்க்கை மீண்டதைக் குறிக்க நவீனத் தமிழில் ‘வாழ்ந்தார்கள்’ பொருத்தமானது.
theological_decisions:
- issue: מוֹשִׁיעַ என்பதை ‘விடுவிப்பவர்’ என்றா ‘இரட்சகர்’ என்றா மொழிபெயர்ப்பது
  choice: விடுவிப்பவர்
  alternative: இரட்சகர்
  rationale: உடனடி சூழல் அராமிய ஆதிக்கத்திலிருந்து கிடைத்த காலச்சார்ந்த விடுதலையைப் பற்றியது. யாரை இச்சொல் குறிக்கிறது என்பதையோ பிற்கால மேசிய அடையாளத்தையோ வசனம் வெளிப்படையாகச் சொல்லாததால், ‘விடுவிப்பவர்’ அந்தத் திறந்த நிலையைக் காக்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற குடும்பவழிப் பெயரை எவ்வாறு வழங்குவது
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இத்தொடர் இங்கு ஆண் சந்ததியினரை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் நிலையான இனப்பெயர். ஆகவே தமிழில் அதன் குறிப்புப் பரப்பைத் துல்லியமாகத் தெரிவிக்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘கை’ மற்றும் ‘கூடாரங்கள்’ என்ற உருவங்கள் பாதுகாக்கப்பட்டுள்ளன; தெளிவுக்காக குறுகிய வாக்கியப் பிரிப்பு செய்யப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
