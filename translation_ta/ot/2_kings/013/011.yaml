source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை; அந்தப் பாவ வழியிலேயே அவன் நடந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேர்ச்சொல்லாக, “அதிலேயே அவன் நடந்தான்.” ஒருமையில் உள்ள “அதில்” என்பது யெரொபெயாமின் பாவ வழியை ஒட்டுமொத்தமாகச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: அவன் தீமையானதைச் செய்தான்
  rationale: அரசர்கள் நூலில் வழக்கமாக வரும் ஒழுக்க மதிப்பீட்டு வாய்பாட்டை, நவீன தமிழில் இயல்பாகவும் அதன் வலிமையைக் குறைக்காமலும் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரேய உருவகத்தை இயல்பான தமிழில் காக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை
  rationale: 'מִכָּל என்பதன் முழுமையான மறுப்புப் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது: அந்தப் பாவங்களில் ஒன்றைக்கூட அவன் கைவிடவில்லை.'
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரேய தந்தைவழிப் பெயரமைப்பை இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைக் காக்கிறது. தொடர்புச் சொல் யெரொபெயாமையோ அவனுடைய பாவங்களையோ சார்ந்து புரிந்துகொள்ளத்தக்க நிலையில் இருந்தாலும், இந்தத் தமிழாக்கம் யெரொபெயாமை செய்பொருளாக வெளிப்படுத்தி, பாவங்களோடு தொடர்பையும் தொடரச் செய்கிறது.
- source_word: בָּהּ הָלָךְ
  choice: அந்தப் பாவ வழியிலேயே அவன் நடந்தான்
  rationale: הלך என்பதிலுள்ள ‘நடத்தையில் பின்பற்றுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. ஒருமை பெண்பால் பின்னொட்டு, முன்சொல்லப்பட்ட பாவங்களை ஒரு கூட்டு பாவ வழியாகச் சுட்டுவதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: அரசனைப் பற்றிய இறை மதிப்பீடு
  choice: யாவேயின் பார்வையில் தீமையானதைச் செய்தான்
  alternative: யாவே தீயது என்று கருதியதைச் செய்தான்
  rationale: மூலத்தின் நிலையான மதிப்பீட்டு வாய்பாட்டையும் ‘கண்களில்/பார்வையில்’ என்ற உருவகத்தையும் காக்கிறது; விளக்கவுரை சேர்க்கப்படவில்லை.
- issue: בָּהּ என்ற ஒருமைச் சுட்டின் தொடர்பு
  choice: பாவங்களை ஒரு கூட்டு ‘பாவ வழி’ எனக் கொண்டு மொழிபெயர்த்தல்
  alternative: அவற்றிலேயே அவன் நடந்தான்
  rationale: எபிரேயத்தின் இலக்கண ஒருமையையும் முன்வரும் பன்மையான ‘பாவங்கள்’ என்பதையும் இணைத்து, பொருளை இயல்பான தமிழில் தருகிறது; நேர்ச்சொல் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பாவ வழியில் நடந்தான்’ என்ற சொற்றொடர் மூலத்தின் நடை உருவகத்தைத் தக்கவைக்கிறது.
