- from: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். நேபாத்தின் மகன் யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்ய வைத்த பாவங்கள் எதிலிருந்தும் அவன் விலகவில்லை; அந்தப் பாவ வழியிலேயே அவன் நடந்தான்[a].
