- source_word: בֶּן־הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெய் அரசப் பெயருக்கு ஒலிபெயர்ப்பு வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לָקַח
  choice: கைப்பற்றியிருந்தான்
  rationale: யெகோவாஸ் நகரங்களை மீட்டதற்கு முந்திய செயலைத் தமிழின் இறந்தகால நிறைவு வடிவில் தெளிவுபடுத்துகிறது.
