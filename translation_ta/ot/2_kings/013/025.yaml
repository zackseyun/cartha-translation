  choice: இஸ்ரவேலின் நகரங்களை மீட்டான்
  rationale: இங்கு שוב என்பது நகரங்களை மீண்டும் இஸ்ரவேலரின் கட்டுப்பாட்டுக்குக் கொண்டுவந்ததைச் சுட்டுகிறது; முதற்பகுதியின் கைப்பற்றுதல் மொழியிலிருந்து வேறுபடுத்தி விளக்குகிறது.
theological_decisions:
- issue: יְהוֹאָשׁ மற்றும் יוֹאָשׁ ஆகிய பெயர் வடிவங்களின் அடையாளம்
  choice: முதல் இடத்தில் ‘யெகோவாஸ்’, பின்னர் ‘யோவாஸ்’ என்று இரு வடிவங்களும் காக்கப்பட்டன.
  alternative: இரண்டு இடங்களிலும் ஒரே ‘யோவாஸ்’ வடிவத்தைப் பயன்படுத்துதல்.
  rationale: எபிரெய் உரை ஒரே அரசனின் பெயருக்கு நீண்ட வடிவத்தையும் குறுகிய வடிவத்தையும் பயன்படுத்துகிறது. அவை ஒரே நபரைக் குறிக்கின்றன என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது; உரையின் வடிவ வேறுபாடு அழிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று விவரிப்புக்கு ஏற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய் வாக்கியம் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பெயர்கள் மூலமொழி ஒலியமைப்பை நெருங்கும் வகையில் வழங்கப்பட்டுள்ளன.
