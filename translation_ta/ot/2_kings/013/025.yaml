base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: ta
  text: யெகோவாகாசின் மகன் யெகோவாஸ், ஹசாயேலின் மகன் பென்-ஹதாத்தின் கையிலிருந்து அந்த நகரங்களை மீண்டும் கைப்பற்றினான். பென்-ஹதாத் அவற்றை யெகோவாசின் தந்தையான யெகோவாகாசின் கையிலிருந்து போரில் கைப்பற்றியிருந்தான். யோவாஸ்[a] அவனை மூன்று முறை முறியடித்து[b], இஸ்ரவேலின் நகரங்களை மீட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் ஒரே அரசனின் பெயரை எபிரெய் உரை முதலில் ‘யெகோவாஸ்’ என்றும் பின்னர் அதன் குறுகிய வடிவமான ‘யோவாஸ்’ என்றும் வழங்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனைத் தாக்கினான்.’ எபிரெய் வினைச்சொல் அடிப்பதைக் குறிக்கலாம்; போர்ச் சூழலில் ஒருவரைத் தோற்கடிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
