base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: ta
  text: அப்போது யாவேயின் கோபம் இஸ்ரவேல்மீது பற்றியெரிந்தது. அவர் அவர்களை அராமின் அரசனான ஆசகேலின் கையிலும்[a], ஆசகேலின் மகன் பெனாதாத்தின் கையிலும் அந்தக் காலம் முழுவதும்[b] ஒப்புக்கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அராம்” என்பது பழைய மொழிபெயர்ப்புகள் சிலவற்றில் “சிரியா” என்று வழங்கப்பட்டுள்ள எபிரெய இடப்பெயர். “கையில்” என்பது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: alternative_reading; lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “எல்லா நாட்களிலும்”; அதாவது, அந்தக் காலப்பகுதி முழுவதும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் ... பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் உயிரோட்டமான ‘கோபம் எரிதல்’ என்ற உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய மூலத்தில் நேரடியாக வரும் இறைநாமம்; அதனைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேல்மீது
  rationale: கோபத்தைக் குறிக்கும் வினைத்தொடருடன் בְ என்பது கோபம் செலுத்தப்பட்ட இலக்கைச் சுட்டுகிறது; தமிழில் ‘மீது’ இயல்பானது.
- source_word: וַיִּתְּנֵם
  choice: அவர் அவர்களை ... ஒப்புக்கொடுத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருளையும், இங்கு பகைவரின் ஆட்சிக்குள் விடப்பட்ட இராணுவத் தீர்ப்புச் சூழலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: ‘கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் இருப்பதைக் குறிக்கிறது.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: அராம் அரசன் ஆசகேல்
  rationale: இடப்பெயரையும் ஆள்பெயரையும் எபிரெய வடிவங்களிலிருந்து தமிழில் ஒலிபெயர்த்து, மூலத்தின் சொல் உறவைத் தக்கவைக்கிறது.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: ஆசகேலின் மகன் பென்-அதாத்
  rationale: ஆள்பெயரை ஒலிபெயர்த்து, மூலத்தில் வெளிப்படையாக உள்ள தந்தை–மகன் உறவைப் பாதுகாக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: அந்தக் காலம் முழுவதும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களிலும்’ என்பதன் காலநீட்சி பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் குறிப்பிடப்படும் முழுக் காலப்பகுதியையும் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட நாமமான நான்கெழுத்துப் பெயரைப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: இஸ்ரவேல் பகைவர்களின் கையில் கொடுக்கப்படுதல்
  choice: கையில் ... ஒப்புக்கொடுத்தார்
  alternative: அதிகாரத்திற்குள் ஒப்புக்கொடுத்தார்
  rationale: இறைத்தீர்ப்பில் யாவே செயற்படும் கர்த்தா என்பதைத் தெளிவாக வைத்துக்கொண்டு, ‘கை’ என்ற மூல உருவகத்தையும் பாதுகாக்கிறது; அதேவேளையில் அதன் அதிகாரம்/கட்டுப்பாடு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கோபம் பற்றியெரிந்தது’ மற்றும் ‘கையில்’ ஆகிய மூல உருவகங்கள் புரிந்துகொள்ளக்கூடிய அளவில் தக்கவைக்கப்பட்டுள்ளன; அரிதான புவிப்பெயரும் மரபுத்தொடரும் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
