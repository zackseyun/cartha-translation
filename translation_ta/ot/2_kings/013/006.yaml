base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: ta
  text: ஆனாலும், இஸ்ரவேலைப் பாவம் செய்யவைத்த யெரொபெயாமின் வீட்டின் பாவங்களை விட்டு அவர்கள் விலகவில்லை; யோவாகாஸ் அந்தப் பாவ வழியிலேயே நடந்தான். அசேரா[a] கூட சமாரியாவில் தொடர்ந்து நின்றுகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசேரா கம்பம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கானானிய தேவியான அசேராவையோ, இங்கு பெரும்பாலும் அவளுடைய வழிபாட்டுடன் தொடர்புடைய ஒரு பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட விடுதலைக்கும், இஸ்ரவேலர் தொடர்ந்து பாவத்தில் நிலைத்ததற்கும் இடையிலான எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: பாவங்களை விட்டு அவர்கள் விலகவில்லை
  rationale: מִן உடன் வரும் סור என்பதன் ‘விட்டு விலகு’ என்ற ஒழுக்க-சமயப் பொருளையும், חַטֹּאות என்பதன் பன்மையையும் தக்கவைக்கிறது.
- source_word: בֵּית יָרָבְעָם
  choice: யெரொபெயாமின் வீட்டார்
  rationale: ‘யெரொபெயாமின் வீடு’ என்ற எபிரெய மரபுத்தொடரின் குடும்பம்/வம்சம் சார்ந்த பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதை வெறும் அரசவம்சம் என்று குறுக்கவில்லை.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: חטא வினையின் ஹிஃபில் வடிவிலுள்ள ‘பாவம் செய்யும்படி காரணமானான்’ என்ற செயப்பாட்டு பொருளை நேரடியாகத் தருகிறது.
- source_word: בָּהּ הָלָךְ
  choice: அவன் அந்தப் பாவ வழியிலேயே நடந்தான்
  rationale: הלך ב־ என்பதன் வாழ்க்கை நடத்தை அல்லது பின்பற்றுதலைக் குறிக்கும் உருவகத்தை ‘நடந்தான்’ எனத் தக்கவைக்கிறது. எபிரெய ஒருமைச் சுட்டை இயல்பாக வெளிப்படுத்த ‘அந்தப் பாவ வழி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְגַם
  choice: கூட
  rationale: இறுதிக் கூற்றின் வலியுறுத்தலை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: இந்தச் சொல் தேவியையோ அவளுடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடும்; மூலத்தில் இல்லாத ‘கம்பம்’ என்பதை முதன்மை உரையில் சேர்க்காமல் பெயரை ஒலிபெயர்க்கிறது.
- source_word: עָמְדָה
  choice: தொடர்ந்து நின்றுகொண்டிருந்தது
  rationale: ‘நின்றது’ என்ற நேரடிப் படிமத்தையும், அது அகற்றப்படாமல் அங்கே நீடித்தது என்ற சூழல்சார் பொருளையும் இணைக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: தலைநகரமான சமாரியாவைக் குறிக்கும் இயல்பான இடவேற்றுமை வடிவம்.
theological_decisions:
- issue: הָאֲשֵׁרָה என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘அசேரா’ என வைத்து, அடிக்குறிப்பில் வழிபாட்டுப் பொருள் என்ற சாத்தியத்தை விளக்குதல்
  alternative: ‘அசேரா கம்பம்’ அல்லது ‘அசேரா தேவி’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இந்த எபிரெயச் சொல் தேவியையும் அவளுடன் தொடர்புடைய வழிபாட்டுச் சின்னம் அல்லது பொருளையும் குறிக்கலாம். ‘நின்றுகொண்டிருந்தது’ என்ற சூழல் ஒரு வழிபாட்டுப் பொருளை வலுவாகச் சுட்டினாலும், முதன்மை உரை உண்மையான சொற்பொருள் இருமையைத் திறந்தே வைக்கிறது.
- issue: בָּהּ הָלָךְ என்பதில் உள்ள ஒருமைச் சுட்டும் ஆண்பால் வினையின் எழுவாயும்
  choice: ‘அவன் அந்தப் பாவ வழியிலேயே நடந்தான்’
  alternative: ‘அவன் அந்தப் பாவங்களிலேயே நடந்தான்’ அல்லது எழுவாயைப் பெயரிட்டு விளக்குதல்
  rationale: பெண்பால் ஒருமைச் சுட்டு, பாவ வழக்கை ஒட்டுமொத்தமாகச் சுட்டக்கூடும். ஆண்பால் ஒருமை எழுவாயை மூலத்தைப் போல ‘அவன்’ என்றே வைத்ததால், உரையில் இல்லாத பெயரடையாளம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பாவ வழியிலேயே நடந்தான்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘அசேரா’ குறித்த மூலத்தின் சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
