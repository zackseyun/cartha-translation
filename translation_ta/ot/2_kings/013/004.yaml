  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: ta
  text: அப்போது யோவாகாஸ் யாவேயின் தயவை நாடினான்[a]. யாவே அவனுக்குச் செவிகொடுத்தார்; ஏனெனில், அராம்[b] அரசன் அவர்களை ஒடுக்கிவந்ததால், இஸ்ரவேலுக்கு ஏற்பட்ட ஒடுக்குமுறையை அவர் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயிடம் மன்றாடினான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர், யாவேயின் தயவை நாடி வேண்டுதல்செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பது எபிரெயப் பெயர்; பழைய மொழிபெயர்ப்புகள் சிலவற்றில் இது “சிரியா” என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: யாவேயின் தயவை நாடினான்
  rationale: இந்த எபிரெய மரபுத்தொடர் ஒருவரின் முகத்தைச் சொற்பொருளில் தேடுவதைக் குறிக்காமல், அவருடைய தயவை வேண்டி மன்றாடுவதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் உறவுசார் வேண்டுதலை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், இறைநாமத்தின் பரவலான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: அவனுக்குச் செவிகொடுத்தார்
  rationale: שׁמע உடன் אֶל என்பது வெறுமனே ஒலி கேட்டதைக் காட்டாமல், ஒருவருடைய வேண்டுதலைக் கவனித்துக் கேட்டதைக் குறிக்கலாம். ‘செவிகொடுத்தார்’ பதிலின் தன்மையை அளவுக்கு மீறி விளக்காமல் இதைப் பாதுகாக்கிறது.
- source_word: לַחַץ ... לָחַץ
  choice: ஒடுக்கப்பட்ட நிலை ... ஒடுக்கிவந்ததால்
  rationale: பெயர்ச்சொல்லும் வினைச்சொல்லும் ஒரே எபிரெய வேரிலிருந்து வருவதால், தமிழிலும் ‘ஒடுக்கு’ என்ற சொல்லை மீண்டும் பயன்படுத்தி மூலத்தின் சொல் தொடர்பைப் பாதுகாக்கிறது. தொடர்ச்சியான பகைமைச் சூழலை ‘ஒடுக்கிவந்ததால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராம் அரசன்
  rationale: அசல் எபிரெய இடப்பெயரான אֲרָם என்பதைப் பிற்காலப் பெயரான ‘சிரியா’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு மூல உரை இறைநாமத்தையே நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: וַיְחַל אֶת־פְּנֵי יְהוָה என்ற வேண்டுதல் மரபுத்தொடர்
  choice: யாவேயின் தயவை நாடினான்
  alternative: யாவேயிடம் மன்றாடினான்
  rationale: மரபுத்தொடர் இறைவனுடைய தயவை வேண்டுவதைச் சுட்டுகிறது. தேர்ந்தெடுத்த வாசகம் வேண்டுதலையும் தயவை நாடும் நுணுக்கத்தையும் வெளிப்படுத்துகிறது; கடவுள் ஏற்கெனவே சினம் தணிந்தார் போன்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுத்தார்’ வேண்டுதலைக் கவனித்துக் கேட்டதைக் காட்டுகிறது; ‘ஒடுக்கப்பட்ட நிலை/ஒடுக்கிவந்ததால்’ என்ற மீளுரை எபிரெய மூலத்தின் ஒரே வேர்ச்சொல் தொடர்பை இயன்றவரைத் தக்கவைக்கிறது.
