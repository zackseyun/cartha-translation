base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: யோவாசின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், யூதாவின் அரசன் அமத்சியாவுக்கு எதிராகப் போரிட்டதில் அவன் வெளிப்படுத்திய வல்லமையும்—இஸ்ரவேல் அரசர்களின் நாட்குறிப்பு நூலில் எழுதப்பட்டுள்ளன அல்லவா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் அரசர்களின் நாட்குறிப்பு நூல்” என்பது அரசர்கள் நூலில் மேற்கோள் காட்டப்படும் ஓர் அரசவை வரலாற்று ஆவணம்; இது வேதாகமத்தின் நாளாகம நூல் அல்ல.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: யோவாசின் மற்ற செயல்களும்
  rationale: அரசாட்சி வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது சொற்களைக் காட்டிலும் செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது; וְיֶתֶר என்பதன் எஞ்சியவற்றைக் குறிக்கும் பொருளை ‘மற்ற’ இயல்பாகத் தருகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: כָל என்பதன் முழுமையான பரப்பையும் עָשָׂה என்பதன் பொதுவான செயற்பொருளையும் நேரடியாகப் பேணுகிறது.
- source_word: וּגְבוּרָתוֹ
  choice: அவன் வெளிப்படுத்திய வல்லமையும்
  rationale: גְבוּרָה வலிமை, வீரத்தன்மை அல்லது வல்ல செயல்களைக் குறிக்கலாம். தொடர்ந்து வரும் போர்ச் சொற்றொடருடன் இயல்பாக இணைய ‘வெளிப்படுத்திய வல்லமை’ என வழங்கப்படுகிறது.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: எதிராகப் போரிட்டதில்
  rationale: עִם அடிப்படையில் ‘உடன்’ என்றாலும், போர் சூழலில் எதிரியை எதிர்த்துப் போரிடுதலைக் குறிக்கிறது. இந்தத் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் அமத்சியா
  rationale: பெயரையும் அரசப் பட்டத்தையும் நவீன தமிழின் இயல்பான சொல் வரிசையில் வழங்குகிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: எபிரெய உரையின் எதிர்பார்க்கப்படும் உடன்பாட்டு விடையைக் கொண்ட வினாவையும் அதன் செயப்பாட்டு வடிவையும் பேணுகிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாட்குறிப்பு நூலில்
  rationale: இது அரசவை ஆண்டுக் குறிப்புகளைக் குறிக்கும் மூலத் தலைப்பு. ‘நாட்குறிப்பு நூல்’ என்பது வேதாகம நாளாகம நூலோடு தவறாக ஒன்றுபடுத்தாமல் annalistic record என்ற பொருளைத் தெளிவாக்குகிறது.
