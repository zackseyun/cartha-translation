base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: ta
  text: யூதாவின் அரசனாகிய யோவாஷின்[a] முப்பத்தேழாம் ஆட்சியாண்டில், யெகோவாகாசின் மகன் யெகோவாஷ் சமாரியாவில் இஸ்ரவேலின்மேல் அரசனானான்; அவன் பதினாறு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் யூதாவின் அரசன் יוֹאָשׁ (யோவாஷ்) என்றும், இஸ்ரவேலின் அரசன் יְהוֹאָשׁ (யெகோவாஷ்) என்றும் பெயர்கள் வேறுபடுத்தப்பட்டுள்ளன; சில மொழிபெயர்ப்பு மரபுகளில் இருவரின் பெயரும் ஒரே வடிவில் வழங்கப்படுகிறது.
    reason: lexical_alternative
