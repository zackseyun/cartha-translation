- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: இங்கு வினை ஆட்சியேற்றதைக் குறிக்கும் தொடக்கப் பொருளில் வருகிறது; பின்னர் ஆட்சிக்கால நீளம் தனியே கொடுக்கப்படுகிறது.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: யெகோவாகாசின் மகன் யெகோவாஷ்
  rationale: எபிரெய மூலத்தில் வடக்கு அரசனின் பெயருக்கு உள்ள தனித்த எழுத்துவடிவத்தைத் தமிழிலும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל என்பது இங்கு ஒரு மக்கள்மீது செலுத்தும் அரசாட்சியைக் குறிக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; சமாரியா வடக்கு அரசின் தலைநகராக இங்கு குறிப்பிடப்படுகிறது.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: பதினாறு ஆண்டுகள்
  rationale: ஆட்சியின் கால அளவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
