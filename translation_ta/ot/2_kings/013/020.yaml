base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: ta
  text: பின்பு எலிசா இறந்தார்; அவர்கள் அவரை அடக்கம் செய்தார்கள். மோவாபியக் கொள்ளைக் கூட்டங்கள் ஆண்டின் தொடக்கத்தில்[a] நாட்டிற்குள் வருவது வழக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டின் வசந்த காலத்தில்.” எபிரெய மொழியில் சொல்லுக்குச் சொல் “ஆண்டு வரும்போது”; இது ஆண்டின் திருப்பத்தைக் குறிக்கும் மரபுத்தொடர், பொதுவாகப் படையெடுப்புகள் தொடங்கும் பருவத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்தார்
  rationale: வாவ் தொடர் வடிவம் கதை நிகழ்வை முன்னோக்கி நகர்த்துகிறது; ‘பின்பு’ என்பது இயல்பான தமிழ் கதைத் தொடரைத் தருகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவர்கள் அவரை அடக்கம் செய்தார்கள்
  rationale: எபிரெயச் சொல் பன்மை எழுவாயுடன், மூன்றாம் நபர் ஆண்பால் ஒருமை செயப்படுபொருளைக் கொண்ட நேரடி வினை; அறியப்படாத எழுவாயை ‘அவர்கள்’ என்று வெளிப்படையாக வைத்திருக்கிறது.
- source_word: גְדוּדֵי מוֹאָב
  choice: மோவாபியக் கொள்ளைக் கூட்டங்கள்
  rationale: גְּדוּד என்பது இச்சூழலில் முறையான இராணுவத்தைவிடத் தாக்கிக் கொள்ளையிடும் குழுக்களைக் குறிப்பதாகத் தெரிகிறது; மோவாபுடனான தொடர்பையும் தெளிவாக்குகிறது.
- source_word: יָבֹאוּ
  choice: வருவது வழக்கம்
  rationale: முற்றுப்பெறா வினை இங்கு மீண்டும் மீண்டும் நிகழ்ந்த வழக்கமான செயலைக் குறிக்கிறது; நவீன தமிழில் இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָאָרֶץ
  choice: நாட்டிற்குள்
  rationale: בוא (‘வருதல்/நுழைதல்’) என்ற வினையுடன், நிலப்பகுதிக்குள் நுழைவதை இச்சொற்றொடர் குறிக்கிறது.
- source_word: בָּא שָׁנָה
  choice: ஆண்டின் தொடக்கத்தில்
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஆண்டு வரும்போது’ என்றாலும், இது ஆண்டின் திருப்பம் அல்லது தொடக்கத்தைக் குறிக்கும் சொற்றொடர். குறிப்பான பருவத்தை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
