source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ אֱלִישָׁ֔ע קַ֖ח קֶ֣שֶׁת וְ/חִצִּ֑ים וַ/יִּקַּ֥ח אֵלָ֖י/ו קֶ֥שֶׁת וְ/חִצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: ta
  text: அப்போது எலிசா அவனிடம், “ஒரு வில்லையும் அம்புகளையும் எடுத்துக்கொள்” என்றார். அவன் ஒரு வில்லையும் அம்புகளையும் எடுத்துக்கொண்டு எலிசாவிடம் வந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவரிடம்.” இது இயல்பாக எலிசாவைக் குறிக்கிறது. “தனக்காக ஒரு வில்லையும் அம்புகளையும் எடுத்துக்கொண்டான்” என்றும் பொருள்கொள்ள வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்ச்சியான கதைநிகழ்வைச் சுட்டும் வாவ் வடிவத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: ל முன்னொட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் எலிசா அரசனிடம் பேசுவதைக் குறிக்கின்றன.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: קַח
  choice: எடுத்துக்கொள்
  rationale: לקח வினையின் ஆண்பால் ஒருமை கட்டளை வடிவத்தை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: קֶשֶׁת וְחִצִּים
  choice: ஒரு வில்லையும் அம்புகளையும்
  rationale: ஆயுதமான வில்லையும் பன்மையிலுள்ள அம்புகளையும் குறிக்கும்; எபிரெய உரையில் இருமுறை வருவதால் தமிழிலும் இருமுறை விடப்பட்டுள்ளது.
- source_word: וַיִּקַּח
  choice: அவன் ... கொண்டுவந்தான்
  rationale: அடுத்த நிகழ்வையும் கட்டளைக்கான பதில்செயலையும் காட்டுகிறது; தொடர்ந்து வரும் אֵלָיו என்பதன் திசைநோக்கையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: אֵלָיו
  choice: எலிசாவிடம்
  rationale: אֶל என்பதன் அடிப்படைத் திசைநோக்குப் பொருள் ‘அவனிடம்’; சூழலில் அதன் இயல்பான முன்னிலை எலிசா என்பதால் பெயர் தெளிவாகத் தரப்பட்டுள்ளது, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
