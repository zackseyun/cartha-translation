translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் மறுபடியும் கூறும் அமைப்பு பாதுகாக்கப்பட்டுள்ளது; אֵלָיו என்பதிலுள்ள உண்மையான குறிப்பு ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
