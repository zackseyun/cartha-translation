  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: ta
  text: யூதாவின் அரசனான அகசியாவின் மகன் யோவாசின் ஆட்சியின் இருபத்துமூன்றாம் ஆண்டில், யெகூவின் மகன் யோவாகாஸ் சமாரியாவில் இஸ்ரவேல்மேல் அரசாளத் தொடங்கி, பதினேழு ஆண்டுகள் அரசாண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசாளத் தொடங்கி
  rationale: காலக்குறிப்புடன் வரும் எபிரெய அரசேற்றச் சூத்திரத்தின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறுமனே ‘அரசனானான்’ என்பதைக் காட்டிலும் ஆட்சியின் தொடக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל־יִשְׂרָאֵל
  choice: இஸ்ரவேல்மேல்
  rationale: ஆட்சிச் சார்பை குறிக்கும் עַל என்பதன் பொருளைச் சுருக்கமாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: அரசாட்சி நடைபெற்ற தலைநகரை இடவியல் பொருளில் நேரடியாகக் குறிக்கிறது.
