  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்துக்கும் அரச வாரிசுரிமையைச் சொல்லும் இரண்டாம் வாக்கியத்துக்கும் இடையே தெளிவான நிகழ்வுத் தொடர் பேணப்பட்டுள்ளது.
