reference: 2 Kings 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: ta
  text: ஆராம்[a] நாட்டின் அரசன் ஆசகேல் இறந்தான். அவனுடைய மகன் பெனாதாத் அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீரியா.” எபிரெய உரையில் அந்த அரசின் பெயர் “ஆராம்” என்று உள்ளது; பழைய மொழிபெயர்ப்புகள் சிலவற்றில் அது பாரம்பரியமாக “சீரியா” என்று வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் Qal wayyiqtol வடிவம் நிகழ்வுகளின் தொடரில் ஆசகேலின் மரணத்தை நேரடியாகக் குறிக்கிறது. தமிழில் தனியாக ‘பின்பு’ சேர்க்காமலேயே வாக்கிய வரிசை தொடர்ச்சியை இயல்பாக உணர்த்துகிறது.
- source_word: חֲזָאֵל
  choice: ஆசகேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகவும் வழக்கமான வேதாகமப் பெயர் வடிவத்தோடும் வழங்குகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: ஆராம் நாட்டின் அரசன்
  rationale: אֲרָם என்பது வரலாற்று அரசின் இயற்பெயர். ‘நாட்டின்’ என்பது தமிழில் உறவை இயல்பாகத் தெளிவுபடுத்துகிறது; ‘சீரியா’ என்ற பாரம்பரிய மாற்றுப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு מלך ஆட்சிக்காலத்தின் நீளத்தைவிட அரச வாரிசாகப் பதவியேற்றதைச் சுட்டுகிறது; எனவே ‘ஆட்சி செய்தான்’ என்பதைக் காட்டிலும் ‘அரசனானான்’ துல்லியமானது.
- source_word: בֶּן־הֲדַד
  choice: பெனாதாத்
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் வாசிக்க இயலும் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு ஆசகேலைக் குறிக்கிறது; தந்தை–மகன் உறவு மூலத்தில் உள்ளபடியே வெளிப்படையாக வைக்கப்படுகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் תחתיו முன்னைய அரசனின் இடத்தை ஏற்றுக்கொள்வதைக் குறிக்கிறது; இந்தத் தமிழாக்கம் மாற்றத்தையும் வாரிசுரிமையையும் இயல்பாக உணர்த்துகிறது.
