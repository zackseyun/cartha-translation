  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: ta
  text: பின்பு அவர், “கிழக்கு நோக்கிய சாளரத்தைத் திற” என்றார்; அவன் அதைத் திறந்தான். அப்போது எலிசா, “எய்” என்றார்; அவனும் எய்தான். அவர், “யாவேயின் வெற்றியின் அம்பு[a], அராமுக்கு எதிரான வெற்றியின் அம்பு! நீ ஆப்பெக்கில் அராமை முற்றிலும் அழிக்கும்வரைத் தாக்குவாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயிடமிருந்து வரும் மீட்பின் அம்பு, அராமுக்கு எதிரான மீட்பின் அம்பு.” எபிரேயச் சொல் “மீட்பு,” “விடுதலை,” அல்லது “வெற்றி” என்றும் பொருள்படும்.
    reason: תְּשׁוּעָה என்பதன் மாற்றுச் சொற்பொருள்களையும், לַיהוָה என்பதன் மூலம்/சார்பு உறவையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: கிழக்கு நோக்கிய சாளரத்தைத் திற
  rationale: קֵדְמָה திசையைக் குறிக்கும் சொல்லாக இருப்பதால் ‘கிழக்கு நோக்கிய’ என இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது; கட்டளையின் நேரடியான பொருளும் காக்கப்படுகிறது.
- source_word: יְרֵה
  choice: எய்
  rationale: வில்வித்தைச் சூழலில் ירה என்பதன் கட்டளை வடிவம்; மூலத்தில் வெளிப்படையாக இல்லாத ‘அம்பை’ என்ற செயப்படுபொருளைச் சேர்க்காமல், தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: யெகோவா அருளும் வெற்றியின் அம்பு
  rationale: இராணுவச் சூழலில் תְּשׁוּעָה என்பதற்கு ‘வெற்றி’ பொருத்தமானது. לַיהוָה-வின் உறவு மூலமோ செயற்பாட்டாளரோ என்ற நுணுக்கத்தைக் காட்ட, வெற்றி யெகோவாவிடமிருந்து வருவதை ‘அருளும்’ வெளிப்படுத்துகிறது.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: அராமுக்கு எதிரான வெற்றியின் அம்பு
  rationale: இரண்டாவது சொற்றொடர் முதலாவதை விளக்குகிறது; ב இங்கு எதிர்மறை உறவைக் குறிப்பதால் ‘எதிரான’ என வழங்கப்பட்டது.
- source_word: אֲרָם
  choice: அராம்
  rationale: எபிரேய இடப்பெயரை நவீன நாட்டுப் பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: בַאֲפֵק
  choice: ஆப்பெக்கில்
  rationale: போர்நிகழ்வு நடைபெறும் இடத்தைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: עַד כַּלֵּה
  choice: முற்றிலும் அழிக்கும்வரை
  rationale: כלה இங்கு எதிரிப்படையை முழுமையாக முடிவுக்குக் கொண்டுவருவதைக் குறிக்கிறது; ‘முற்றிலும்’ நிறைவின் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: தனிப்பட்ட இறைப்பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிவடிவத்தில் வழங்குகிறது.
- issue: תְּשׁוּעָה என்பதன் பொருள்
  choice: வெற்றி
  alternative: மீட்பு / இரட்சிப்பு
  rationale: அடையாளச் செயலாகிய அம்பெய்தலும் அராமுக்கு எதிரான போர் வாக்குறுதியும் உள்ள உடனடிச் சூழலில் ‘வெற்றி’ முதன்மைப் பொருளைத் தெளிவாகக் கூறுகிறது; பரந்த ‘மீட்பு’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לַיהוָה குறிக்கும் உறவு
  choice: யெகோவா அருளும்
  alternative: யெகோவாவின் / யெகோவாவிடமிருந்து வரும்
  rationale: லாமேத் உருபு உடைமை, மூலம் அல்லது சார்பு ஆகிய நுணுக்கங்களை அனுமதிக்கிறது. இங்கு வெற்றியின் மூலமும் அளிப்பவரும் யெகோவா என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கட்டளைகளின் சுருக்கமும் தீர்க்கதரிசன அறிவிப்பின் வலிமையும் காக்கப்பட்டுள்ளன.
