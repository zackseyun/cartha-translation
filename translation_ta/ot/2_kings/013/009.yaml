base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: ta
  text: யோவாகாஸ் தன் முன்னோர்களோடு துயிலடைந்தான்; அவனை சமாரியாவில் அடக்கம் செய்தார்கள். அவனுக்குப் பதிலாக அவன் மகன் யோவாஸ்[a] அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோவாஸ்’ என்ற பெயர் சில ஆங்கில மொழிபெயர்ப்புகளில் ‘யெகோவாஷ்’ என்றும் வழங்கப்படுகிறது.
    reason: பெயரின் மாற்று வடிவத்தைப் பதிவு செய்தல்.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: இது அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். ‘இறந்தான்’ என்று உருவகத்தை நீக்காமல், தமிழில் இயல்பாகவும் கண்ணியமாகவும் மரணப் பொருளை உணர்த்துகிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை மூன்றாம் நபர் பன்மையில் செயப்பாட்டு வடிவில் இருப்பதால், அதைச் செய்பவர்கள் குறிப்பிடப்படாத பன்மையாகவே மொழிபெயர்க்கப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ என்ற முன்னொட்டு இங்கு அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்பது அரசாட்சியையும் அரசுரிமை ஏற்றதையும் குறிக்கக்கூடும்; தொடர்ந்துவரும் ‘அவனுக்குப் பதிலாக’ என்பதுடன் ‘அரசாண்டான்’ இயல்பாக வாரிசுரிமையையும் ஆட்சியையும் தெரிவிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: தந்தையின் இடத்தில் மகன் அரசனாக வந்த அரச வம்ச வாரிசுரிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוֹאָחָז
  choice: யோவாகாஸ்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் நிலையான வேதாகமப் பெயர் வடிவுக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- source_word: יוֹאָשׁ
  choice: யோவாஸ்
  rationale: இவ்வசனத்தின் எபிரெய வடிவான יוֹאָשׁ என்பதன் நேரடியான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்ற அரச மரணச் சூத்திரத்தின் பொருள்
  choice: மரணத்தை உணர்த்தும் எபிரெய உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘இறந்தான்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள மரணப் பொருள் தெளிவாக இருக்கும்போதும், அதன் உருவக மொழியை நீக்காமல் காக்கிறது; மரணத்திற்குப் பிந்தைய நிலை குறித்த கூடுதல் கோட்பாட்டை இதில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். அரச மரண அறிவிப்பின் எபிரெய உருவகம் தக்கவைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் முன்னோர்களைக் குறிக்கும் சொற்றொடருக்குப் பின் இருந்த அடிக்குறிப்புக் குறி, அதன் உள்ளடக்கத்திற்கேற்ப ‘யோவாஸ்’ என்ற பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
