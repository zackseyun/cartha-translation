base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: யோவாகாஸ் செய்த மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவனுடைய வல்லமையும்[b] இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் அரசர்களின் ஆண்டுக் குறிப்புப் புத்தகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய வலிமை,’ ‘அவனுடைய வீரம்’ அல்லது ‘அவனுடைய வல்ல செயல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: யோவாகாஸ் செய்த மற்ற செயல்களும்
  rationale: அரசாட்சிச் சுருக்கங்களில் דִּבְרֵי என்பது பேச்சுகளை மட்டும் அல்லாமல் அரசனின் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; וְיֶתֶר அதன் மீதியைக் குறிக்கிறது. இயல்பான தமிழுக்காக பெயருடன் ‘செய்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: எபிரெய உறவுநிலைத் தொடரின் பரந்த பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: וּגְבוּרָתוֹ
  choice: அவனுடைய வல்லமையும்
  rationale: גְּבוּרָה என்பது வலிமை, வீரத்தன்மை அல்லது வல்ல செயல்கள் எனப் பலவாறு பொருள்படலாம். ‘வல்லமை’ அந்தப் பொருள் அகலத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் காக்கிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: பதில் ‘ஆம்’ என எதிர்பார்க்கும் எபிரெய வினாவடிவத்தையும், எழுதிப் பதிவு செய்யப்பட்டுள்ள நிலையைச் சுட்டும் வினையெச்சத்தையும் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகத்தில்
  rationale: இது அரசர் தொடர்பான பதிவுத் தொகுப்பைக் குறிக்கும் வழக்குச் சொற்றொடர். עַל என்பதைக் தமிழ் இடவழக்கிற்கு ஏற்ப ‘புத்தகத்தில்’ என்று வழங்குவது இயல்பானது.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: இங்குள்ள לְ நோக்கத்தை அல்ல, அந்தப் பதிவுக்கும் அரசர்களுக்கும் உள்ள தொடர்பைச் சுட்டுகிறது.
