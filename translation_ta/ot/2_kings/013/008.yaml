translation_notes:
  register: நவீன நிலையான தமிழில், அரசாட்சிச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தில் உள்ள வினாவடிவம் காக்கப்பட்டுள்ளது. குறிப்புக்குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன; ஆங்கில ஆலோசனை உரையில் அவை இடம்மாறியிருந்தன.
