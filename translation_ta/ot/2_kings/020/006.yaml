source:
  edition: WLC
  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: ta
  text: உன் வாழ்நாளுக்கு[a] இன்னும் பதினைந்து ஆண்டுகளைச் சேர்ப்பேன். அசீரியாவின் அரசனின் கையிலிருந்து[b] உன்னையும் இந்த நகரத்தையும் விடுவிப்பேன். என் பொருட்டும் என் ஊழியனான தாவீதின் பொருட்டும் இந்த நகரத்தைப் பாதுகாப்பேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘உன் நாட்களோடு.’'
    reason: source_idiom
  - marker: b
    text: 'அதாவது, ‘அசீரியாவின் அரசனின் அதிகாரத்திலிருந்து’ அல்லது ‘பிடியிலிருந்து.’ எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘கையிலிருந்து.’'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இந்த நகரத்தைக் காத்து நிற்பேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: உன் வாழ்நாளோடு இன்னும் பதினைந்து ஆண்டுகளைக் கூட்டுவேன்
  rationale: ‘உன் நாட்களோடு கூட்டுவேன்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் ‘உன் வாழ்நாளோடு ... கூட்டுவேன்’ என்று வழங்குகிறது; ‘இன்னும்’ என்பது காலம் கூடுதலாக அளிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழிலும் புரிந்துகொள்ளக்கூடியதால் அந்த உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: உன்னையும் இந்த நகரத்தையும் விடுவிப்பேன்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்து அல்லது பகைவரின் அதிகாரத்திலிருந்து மீட்பதைக் குறிக்கிறது; அரசியல்-இராணுவச் சூழலில் ‘விடுவிப்பேன்’ பொருத்தமானது.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: இந்த நகரத்தைப் பாதுகாப்பேன்
  rationale: גנן என்பது மூடிக் காத்தல், பாதுகாத்தல், தற்காத்தல் ஆகிய பொருள்களை உடையது. ‘பாதுகாப்பேன்’ அதன் பரந்த பாதுகாப்புச் செயலை இயல்பான தமிழில் தருகிறது.
- source_word: לְמַעֲנִי
  choice: என் பொருட்டும்
  rationale: இறைவனுடைய சொந்த நோக்கம் அல்லது நிமித்தத்தை உரையில் உள்ளபடியே சுருக்கமாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: என் ஊழியனான தாவீதின் பொருட்டும்
  rationale: தாவீதை இறைவனுடைய ‘ஊழியன்’ என்று அடையாளப்படுத்தி, அவனை முன்னிட்டும் நகரம் பாதுகாக்கப்படும் என்ற உடன்படிக்கை சார்ந்த காரணத்தை விரிவாக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: எருசலேமைப் பாதுகாப்பதற்கான இறை நோக்கம்
  choice: என் பொருட்டும் என் ஊழியனான தாவீதின் பொருட்டும்
  alternative: எனக்காகவும் என் ஊழியன் தாவீதுக்காகவும்
  rationale: எபிரெய உரை இறைவன் தம்மையே முன்னிட்டும் தமது ஊழியன் தாவீதை முன்னிட்டும் நகரத்தைக் காப்பதாகக் கூறுகிறது. அதன் இறைமைய மையத்தையும் உடன்படிக்கை சார்ந்த அழுத்தத்தையும் பிற்காலக் கோட்பாட்டு விளக்கமின்றித் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் ‘கை’ உருவகம் உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது; ‘நாட்கள்’ என்ற நேரடி மரபுத்தொடர் இயல்புக்காக ‘வாழ்நாள்’ என வழங்கப்பட்டுள்ளது. ‘என் பொருட்டும் ... தாவீதின் பொருட்டும்’ என்ற இணை அமைப்பு மூலத்தின் இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
