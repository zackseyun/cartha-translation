  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. வாக்கியப் பிரிப்பு மற்றும் “அவனுக்குப் பதிலாக” என்ற வாரிசுரிமை வெளிப்பாடு தெளிவாக உள்ளன.
  terminology: எசேக்கியா, மனாசே ஆகிய பெயர்கள் நிலைபெற்ற தமிழ் வேதாகம ஒலிபெயர்ப்புக்கு ஏற்ப உள்ளன. அரசனானான், மகன், துயிலடைந்தான் ஆகிய சொற்கள் சூழலுக்கும் பதிவுக்கும் பொருத்தமானவை.
