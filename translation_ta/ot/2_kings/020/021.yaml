  text: וַ/יִּשְׁכַּ֥ב חִזְקִיָּ֖הוּ עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: ta
  text: எசேக்கியா தன் முன்னோர்களோடு துயிலடைந்தான்[a]; அவன் மகன் மனாசே அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “தன் தந்தையரோடு படுத்துக்கொண்டான்.” எபிரெய மொழியில் இது ஓர் அரசரின் மரணத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: שׁכב என்பதன் படுத்தல்/துயிலுதல் என்ற உருவகத்தையும், இச்சூழலில் அது மரணத்தைக் குறிக்கும் வழக்கமான அரச மரணச் சொற்றொடர் என்பதையும் இயன்றவரை காக்கிறது; வெறுமனே ‘இறந்தான்’ என்று மாற்றி உருவகத்தை நீக்கவில்லை.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: சொல்லாட்சியில் ‘அவனுடைய தந்தையரோடு’ என்றிருந்தாலும், இங்கு முந்தைய தலைமுறையினரைக் குறிக்கிறது. நவீன தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; மூலத்தின் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: அரச வாரிசுரிமைச் சூத்திரத்தில் מלך ஆட்சிக்குப் பொறுப்பேற்றதை, அதாவது அரசனானதை, குறிக்கிறது; ‘ஆட்சி செய்தான்’ என்பது ஆட்சிக்காலத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: மகன் என்ற உறவுமுறையை மூலத்தைப் போலவே வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் תחתיו என்பது ஒருவரின் இடத்தை ஏற்று ஆட்சி செய்வதைக் குறிக்கிறது; ‘அவனுக்குப் பதிலாக’ இதை இயல்பான தமிழில் தெளிவாகச் சொல்கிறது.
