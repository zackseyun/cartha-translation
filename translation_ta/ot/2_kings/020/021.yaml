  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘துயிலடைந்தான்’ என்பது மூல உருவகத்தையும் மரணப் பொருளையும் இணைத்துக் காக்கிறது; ‘முன்னோர்கள்’ என்பது தமிழில் இயல்பான உறவுப்பெயராகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
