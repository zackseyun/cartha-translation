base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: ta
  text: அவர், “உன் வீட்டில்[a] அவர்கள் என்ன பார்த்தார்கள்?” என்று கேட்டார். அதற்கு எசேக்கியா, “என் வீட்டிலுள்ள எல்லாவற்றையும் அவர்கள் பார்த்தார்கள். என் கருவூலங்களில்[b] நான் அவர்களுக்குக் காட்டாதது ஒன்றும் இல்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீடு” என்பது இங்கே அரசரின் “அரண்மனை”யையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கருவூலங்கள்” என்பதற்கு “களஞ்சியங்கள்” என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெயச் சொல் மதிப்புள்ள பொருள்கள் அல்லது சேமிப்புகள் வைக்கப்படும் இடங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: அவர்கள் என்ன பார்த்தார்கள்?
  rationale: מָה என்ற நேரடி வினாப்பெயரையும் ראה என்ற பொதுவான ‘பார்’ வினையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: உன் வீட்டில் / என் வீட்டிலுள்ள
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ என்பதைக் காக்கிறது; அரசச் சூழலில் ‘அரண்மனை’ என்ற பொருளும் சாத்தியம் என்பதால் அதைக் குறிப்பில் தருகிறது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: என் வீட்டிலுள்ள எல்லாவற்றையும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையான பொருளைச் சுருக்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הִרְאִיתִם
  choice: நான் அவர்களுக்குக் காட்டாதது ஒன்றும் இல்லை
  rationale: எபிரெய எதிர்மறை இருப்புக் கட்டமைப்பையும், ראה என்பதன் ஹிஃபீல் வடிவமான ‘காட்டு’ என்பதையும், மூன்றாம் நபர் பன்மை பின்னொட்டையும் தெளிவாகக் காக்கிறது.
- source_word: בְּאֹצְרֹתָי
  choice: என் கருவூலங்களில்
  rationale: אֹצָר என்பது மதிப்புள்ள பொருட்கள் அல்லது சேமிப்புகள் வைக்கப்படும் கருவூலம்/களஞ்சியத்தைக் குறிக்கலாம்; அரசரின் செல்வம் காட்டப்பட்ட சூழலில் ‘கருவூலங்கள்’ பொருத்தமானது.
