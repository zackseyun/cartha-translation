source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: ta
  text: உன்னிடமிருந்து தோன்றும், நீ தந்தையாகப் பெறப்போகும் உன் மகன்களில் சிலர் கொண்டு செல்லப்படுவார்கள். அவர்கள் பாபிலோன் அரசனின் அரண்மனையில் அண்ணகர்களாக[a] ஆகுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசவை அதிகாரிகளாக” அல்லது “அரண்மனை அதிகாரிகளாக.” எபிரெயச் சொல் நேர்ப்பொருளில் அண்ணகர்களையோ, சில சூழல்களில் அரச அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: உன் மகன்களில் சிலர்
  rationale: מִן என்பதன் பகுதி குறிக்கும் பொருளை ‘சிலர்’ என்று இயல்பான தமிழில் வெளிப்படுத்துகிறது; בנים என்பதற்கான குறிப்பான ‘மகன்கள்’ என்பதும் தக்கவைக்கப்படுகிறது.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: உன்னிடமிருந்து தோன்றும்
  rationale: எசேக்கியாவிடமிருந்து வரும் உடல்வழி வம்சத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: உனக்குப் பிறக்கப்போகும்
  rationale: ஆண் ஒருவரிடம் கூறப்படும் தந்தைவழிப் பிறப்பைக் குறிக்கும் causative வடிவத்தை, தமிழில் தவறாக ‘நீ பெற்றெடுக்கும்’ என்று சொல்லாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יקח
  choice: கொண்டு செல்லப்படுவார்கள்
  rationale: எபிரெயத்தில் வினை வடிவம் ஒருமைச் செயப்பாட்டில் இருந்தாலும், சூழலில் செய்பவர் குறிப்பிடப்படாததால் தமிழில் செயப்பாட்டு வினை இயல்பானது; பாபிலோனுக்குக் கொண்டு செல்லப்படுதலையும் தெளிவாக்குகிறது.
- source_word: וְהָיוּ
  choice: ஆகிவிடுவார்கள்
  rationale: புதிய நிலை அல்லது பதவிக்கு மாறுவதைக் காட்டும் விளைவுப் பொருளைத் தெரிவிக்கிறது.
- source_word: סָרִיסִים
  choice: அண்ணகர்கள்
  rationale: சொல்லின் முதன்மையான நேர்ப்பொருளை முதன்மை உரையில் தக்கவைக்கிறது; அரசவை அதிகாரிகள் என்ற சாத்தியமான விரிவுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּהֵיכַל
  choice: அரண்மனையில்
  rationale: ‘பாபிலோன் அரசன்’ என்ற சூழலில் הֵיכָל என்பது கோவிலை அல்ல, அரச அரண்மனையைக் குறிக்கிறது.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் தெளிவான, வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: அரசவைச் சூழலில் סָרִיסִים என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அண்ணகர்கள்’
  alternative: அரசவை அதிகாரிகள் அல்லது அரண்மனை அதிகாரிகள்
  rationale: இச்சொல் உடல் ரீதியாக ஆண்மை நீக்கப்பட்டவர்களையோ, சில சூழல்களில் அரசவை அதிகாரிகளையோ குறிக்கலாம். சிறைபிடிக்கப்பட்ட அரச சந்ததியாரைப் பற்றிய இத்தீர்ப்பில் நேர்ப்பொருள் பொருத்தமானதாக இருப்பதால் அது முதன்மை உரையில் வைக்கப்படுகிறது; சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வம்சவழிக் கருத்தும், சָרִיסִים என்பதிலுள்ள உண்மையான பொருள் இருமையும் பாதுகாக்கப்பட்டுள்ளன.
