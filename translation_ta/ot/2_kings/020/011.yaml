  source_fidelity: மூலத்தின் நிகழ்வுவரிசை, நிழலின் பின்னோக்கிய நகர்வு, மற்றும் பத்துப் படிகள் என்ற அளவு சரியாகத் தரப்பட்டுள்ளன. ஆனால் இரண்டாவது வாக்கியத்தில் உள்ள ‘அவர்’ தமிழில் உடனடியான முன்சுட்டான ஏசாயாவையே சுட்டுவதாக இயல்பாகப் புரியும்; இதனால் நிழலைத் திருப்பியது ஏசாயா எனத் தவறாகத் தோன்றும். எபிரெயத்தில் செய்பவர் வெளிப்படையாகப் பெயரிடப்படவில்லை என்றாலும், யாவேயிடம் கூப்பிட்டதற்குப் பின் நிகழும் செயல் யாவேயுடையது என்பது சூழலில் தெளிவானது. தமிழில் ‘யாவே’ என்று வெளிப்படுத்துதல் இந்தத் தவறான சுட்டலைத் தவிர்க்கிறது.
  naturalness: நடை நவீனத் தரமானதும் கண்ணியமானதும் ஆகும். ‘யாவே நிழலை ... திரும்பச் செய்தார்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘ஆகாசின்’ என்பது தமிழ்ச் சொல்லான ‘ஆகாசம்’ உடன் குழப்பமளிக்கக்கூடியதால், பெயரை நிலையான ஒலிபெயர்ப்பான ‘ஆகாஸ்’ எனத் திருத்துவது நல்லது.
  terminology: ‘இறைவாக்கினர்’, ‘யாவே’, மற்றும் ‘படிக்கட்டுகள்’ ஆகியவை பொருத்தமானவை. מַעֲלוֹת என்பதன் உறுதியற்ற வரலாற்று அடையாளத்தை முதன்மை உரையில் ‘சூரியக் கடிகாரம்’ என முடிவுசெய்யாமல் வைத்திருப்பது சரியானது. அடிக்குறிப்பு மாற்று ‘பத்துப் பாகைகள்’ என்பதையும், படிக்கட்டு/நிழல் அளவீட்டு அமைப்பு பற்றிய மரபுவழி விளக்கத்தையும் உரிய அளவில் வழங்குகிறது.
