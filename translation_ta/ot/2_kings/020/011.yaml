  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: ta
  text: இறைவாக்கினரான ஏசாயா யாவேயை நோக்கிக் கூப்பிட்டார். யாவே, ஆகாஸின் படிக்கட்டுகளில் கீழிறங்கியிருந்த நிழலைப் பின்னோக்கிப் பத்துப் படிகள் திரும்பச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பத்துப் பாகைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் מַעֲלוֹת (மஅலோத்) என்பது ‘படிகள்/ஏற்றங்கள்’ என்று பொருள்படும். சிலர் இதை நிழலைக் கொண்டு நேரம் அளக்கும் படிக்கட்டு வடிவ அமைப்பின் பகுதியாகக் கருதுவதால், ‘ஆகாஸின் சூரியக் கடிகாரம்’ என்று மரபாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: யாவேயை நோக்கிக் கூப்பிட்டார்
  rationale: קרא אל என்பது கடவுளை நோக்கி உதவி வேண்டிக் கூப்பிடுவதைக் குறிக்கிறது. ‘மன்றாடினார்’ அல்லது ‘ஜெபித்தார்’ என்று விளக்கமாக விரிவுபடுத்தாமல், மூல வினையின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: இறைவாக்கினரான ஏசாயா
  rationale: הַנָּבִיא என்பதற்கு மதப்பிரிவுச் சார்பற்ற, பொருள்தெளிவான ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டது; பெயர் தமிழில் பரவலாக அறியப்பட்ட வடிவில் தரப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיָּשֶׁב אֶת־הַצֵּל
  choice: நிழலை ... பின்னோக்கித் திரும்பச் செய்தார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַּמַּעֲלוֹת ... בְּמַעֲלוֹת אָחָז
  choice: ஆகாசின் படிக்கட்டுகளில்
  rationale: מַעֲלוֹת என்பதன் அடிப்படைப் பொருள் ‘படிகள்/ஏற்றங்கள்.’ இது எத்தகைய அமைப்பு என்பதை ஊகித்து ‘சூரியக் கடிகாரம்’ என்று முதன்மை உரையில் குறிப்பிடவில்லை.
- source_word: אֲשֶׁר יָרְדָה
  choice: கீழிறங்கியிருந்த
  rationale: நிழல் ஏற்கெனவே படிகளில் கீழ்நோக்கிச் சென்றிருந்ததை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת
  choice: பத்துப் படிகள் பின்னோக்கி
  rationale: பின்னோக்கிய நகர்வையும் அதன் அளவான பத்துப் படிகளையும் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை பொதுப்பட்டமல்ல, உடன்படிக்கையின் தனிப்பெயரையே பயன்படுத்துகிறது; ஆகவே அதைத் தனிப்பெயராக ஒலிபெயர்த்துள்ளது.
- issue: நிழலைத் திரும்பச் செய்தவர் யார்?
  choice: அவர்
  alternative: யாவே
  rationale: எபிரெய வினை ஆண்பால் ஒருமையில் மட்டுமே உள்ளது; செய்பவரின் பெயரை மீண்டும் வெளிப்படையாகச் சொல்லவில்லை. சூழலில் யாவே இயல்பான குறிப்பு என்றாலும், தமிழிலும் பிரதிப்பெயரைப் பயன்படுத்தி மூலத்தின் வெளிப்பாட்டு முறையைப் பாதுகாக்கிறது.
- issue: מַעֲלוֹת אָחָז குறிக்கும் அமைப்பின் தன்மை
  choice: ஆகாசின் படிக்கட்டுகள்
  alternative: ஆகாசின் சூரியக் கடிகாரம் / படிக்கட்டு வடிவ நிழல் அளவுகோல்
  rationale: மூல உரை ‘படிகள்/ஏற்றங்கள்’ என்றே கூறுகிறது; வரலாற்று அமைப்பின் சரியான வடிவம் உறுதியில்லாததால் முதன்மை உரை அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டது. ‘இறைவாக்கினர்’ என்பது נביא என்பதன் செய்தி அறிவிக்கும் பணியைத் தெளிவாகச் சொல்கிறது. ‘படிக்கட்டுகள்’ என்ற சொல் வரலாற்று கருவியின் வடிவத்தைத் தேவையின்றி முடிவுசெய்யாமல், மூலச்சொல்லுக்கு நெருக்கமாக உள்ளது.
