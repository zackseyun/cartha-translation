base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: ta
  text: “யாவே, நான் உமக்கு முன்பாக உண்மையுடன்[a], முழு இருதயத்துடன்[b] நடந்துகொண்டதையும், உமது பார்வையில் நன்மையானதைச் செய்ததையும் தயவுசெய்து நினைவுகூருங்கள்.” பின்பு எசேக்கியா மிகவும் அழுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையுள்ளவனாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உண்மை அல்லது உண்மைத்தன்மையைக் குறிக்கலாம்; இங்கு அது தேவனுக்கு முன்பாக எசேக்கியா உண்மையுடன் நடந்துகொண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிளவுபடாத இருதயத்துடன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: தயவுசெய்து
  rationale: வேண்டுதலின் பணிவையும் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெயச் சொற்றொடரில் உள்ள இரு வேண்டுதல் துகள்களையும் ஒரே இயல்பான வேண்டுகோளாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: זְכָר
  choice: நினைவுகூருங்கள்
  rationale: கட்டளை வடிவிலுள்ள வேண்டுகோளை, தேவனை மரியாதையுடன் நேரடியாக அழைக்கும் தமிழில் தருகிறது.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: நான் உமக்கு முன்பாக ... நடந்துகொண்டதையும்
  rationale: தேவனுடைய முன்னிலையில் வாழ்ந்த வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழில் புரியக்கூடிய வகையில் பாதுகாக்கிறது.
- source_word: בֶּאֱמֶת
  choice: உண்மையுடன்
  rationale: இங்கு நேர்மை, நம்பகத்தன்மை, உண்மையுள்ள நடத்தை ஆகியவற்றை உள்ளடக்கும் சொல்லாக உள்ளது; மூலத்தின் பொருள் விரிவைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: முழு இருதயத்துடன்
  rationale: பாவமற்ற பரிபூரணத்தைக் கூறாமல், முழுமையான மற்றும் பிளவுபடாத அர்ப்பணிப்பைக் குறிக்கிறது.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: உமது பார்வையில் நன்மையானதைச் செய்ததையும்
  rationale: நன்மையைத் தீர்மானிப்பவர் தேவனே என்ற எபிரெயச் சொல்லாட்சியின் மையத்தைப் பாதுகாக்கிறது.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: மிகவும் அழுதான்
  rationale: ‘பெரிய அழுகை’ என்ற தீவிரப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மனங்கசந்து’ அல்லது ‘கசப்பாக’ என்ற நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் பெயர் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: நேரடி ஜெபத்தில் வரும் தேவனுடைய தனிப்பட்ட பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: שָׁלֵם என்பதிலுள்ள எசேக்கியாவின் தற்குறிப்பு
  choice: முழு இருதயத்துடன்
  alternative: பிளவுபடாத இருதயத்துடன் / பரிபூரண இருதயத்துடன்
  rationale: எசேக்கியா பாவமற்றவர் என்று மிகைப்படுத்தாமல், அவருடைய முழுமையான உள்ளார்ந்த உண்மையையும் அர்ப்பணிப்பையும் தெரிவிக்கிறது.
- issue: בֶּאֱמֶת என்பதன் நுணுக்கம்
  choice: உண்மையுடன்
  alternative: உண்மையுள்ளவனாக / மெய்ம்மையுடன்
  rationale: ‘உண்மை’ மற்றும் ‘உண்மைத்தன்மை’ ஆகிய இரு தொடர்புடைய பொருள்களையும் தாங்கக்கூடிய தேர்வு; அடிக்குறிப்பு உண்மையுள்ள நடத்தை என்ற சூழல்சார் நுணுக்கத்தை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற மரியாதையும் கண்ணியமும் காக்கப்பட்டுள்ளது. ‘நடந்துகொண்டது’ என்ற சொல் வாழ்க்கை நடத்தையைக் குறிக்கும் மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களாக ‘உமது’, ‘நினைவுகூருங்கள்’ பயன்படுத்தப்பட்டுள்ளன.
