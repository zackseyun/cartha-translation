  to: 'அப்போது ஏசாயா நடுமுற்றத்தை[a] விட்டு இன்னும் வெளியேறாதிருந்தபோது, யாவேயின் வார்த்தை அவருக்கு வந்தது:'
  rationale: The revision retains the Hebrew narrative and temporal force while making the Tamil construction smoother. It keeps the disputed sense of הָעִיר הַתִּיכֹנָה visible in the footnote and changes the divine name to “யாவே” to align with the POB audit trail's Yahweh policy. No doctrinal interpretation has been added.
