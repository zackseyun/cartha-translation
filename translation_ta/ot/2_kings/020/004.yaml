source:
  edition: WLC
  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: ta
  text: 'அப்போது ஏசாயா நடுமுற்றத்தை[a] விட்டு இன்னும் வெளியேறாதிருந்தபோது, யாவேயின் வார்த்தை அவருக்கு வந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “நடுநகர்.” இச்சொற்றொடர் இங்கு அரண்மனைப் பகுதி அல்லது முற்றத்தைக் குறிப்பதாக மரபாகப் புரிந்துகொள்ளப்படுகிறது; எனவே “நடுமுற்றம்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது
  rationale: எபிரெயக் கதைநடையில் புதிய நிகழ்வை அறிமுகப்படுத்தும் சொல்லை, தேவையற்ற பழமையான நடையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: יְשַׁעְיָהוּ
  choice: ஏசாயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: לֹא יָצָא
  choice: இன்னும் வெளியேறியிருக்கவில்லை
  rationale: அடுத்த நிகழ்வு நடந்தபோது அவர் வெளியேறும் செயல் நிறைவடையவில்லை என்ற காலத் தொடர்பையும் எதிர்மறையையும் தெளிவாகக் காக்கிறது.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: நடுமுற்றம்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘நடுநகர்’ என்றாலும், அரண்மனைச் சூழலில் இது ஒரு முற்றம் அல்லது அரண்மனைப் பகுதியைக் குறிக்கும் எனப் புரிந்துகொள்ளப்படுகிறது; மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּדְבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: தீர்க்கதரிசனச் செய்தியை அறிமுகப்படுத்தும் வழக்கமான எபிரெயச் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: הָיָה אֵלָיו
  choice: அவருக்கு வந்தது
  rationale: தெய்வீக வார்த்தை ஒருவருக்கு அருளப்படுவதைச் சுட்டும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: 'அது கூறியதாவது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; தனி வசனமாக வாசிக்கும்போதும் தமிழ் வாக்கியம் இயல்பாக முடிகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதைமிக்க மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசையும் தீர்க்கதரிசனச் சூத்திரமும் காக்கப்பட்டுள்ளன; ‘நடுமுற்றம்/நடுநகர்’ என்ற உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
