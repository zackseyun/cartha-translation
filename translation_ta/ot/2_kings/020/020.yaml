base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: எசேக்கியாவின் மற்ற செயல்களும், அவனுடைய எல்லா வல்லமையும், அவன் குளத்தையும்[a] நீர்க்கால்வாயையும்[b] அமைத்து, தண்ணீரை நகரத்திற்குள் கொண்டுவந்த விதமும்[c] யூதா அரசர்களின் நாளேட்டுப் புத்தகத்தில் எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குளம்’ என்பதற்கு ‘நீர்த்தேக்கம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் கட்டப்பட்ட நீர்த்தொட்டியைக் குறிக்கவும் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீர்க்கால்வாய்’ என்பதற்கு ‘நீர்வழி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் நீரைக் கொண்டு செல்லும் கால்வாய் அல்லது நீர்வழியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இது எருசலேமில் எசேக்கியா அமைத்ததாக நன்கு அறியப்பட்ட நீர்ப்பணிகளைக் குறிக்கக்கூடும்; 2 நாளாகமம் 32:30-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: அரசர்களைப் பற்றிய வரலாற்றுப் பதிவுகளில் வரும் வழக்கமான முடிவுரை இது. ‘மற்ற செயல்கள்’ என்பது דְּבָרִים என்பதன் பரந்த பொருளை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: גְּבוּרָתוֹ
  choice: அவனுடைய எல்லா வல்லமை
  rationale: இந்தச் சொல் வலிமை, வீரம், வல்ல செயல்கள் ஆகியவற்றைக் குறிக்கலாம். எபிரெய மூலத்தின் கருத்துப்பெயர் வடிவத்தையும் அதன் பொருள் விரிவையும் ‘வல்லமை’ காக்கிறது.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: அமைத்து ... கொண்டுவந்த விதம்
  rationale: எசேக்கியாவின் வல்லமையை எடுத்துக்காட்டும் குறிப்பிட்ட பொறியியல் செயல்களை அறிமுகப்படுத்தும் தொடர்புத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַבְּרֵכָה
  choice: குளம்
  rationale: בְּרֵכָה என்பது கட்டப்பட்ட குளத்தையோ நீர்த்தேக்கத்தையோ குறிக்கலாம். ‘குளம்’ எளிதில் புரியும் நேரடியான மொழிபெயர்ப்பு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַתְּעָלָה
  choice: நீர்க்கால்வாய்
  rationale: நீரைக் கொண்டு செல்லும் கால்வாய் அல்லது பொறியமைக்கப்பட்ட நீர்வழி என்பதே இச்சொல்லின் பொருள். ‘நீர்க்கால்வாய்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: தண்ணீரை நகரத்திற்குள் கொண்டுவந்த
  rationale: עִירָה என்பதிலுள்ள திசைகாட்டும் இறுதி உருபு நகரத்திற்குள் நிகழ்ந்த இயக்கத்தைக் குறிக்கிறது; தமிழாக்கம் அதைப் பாதுகாக்கிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: அரசர்கள் நூலில் காணப்படும் வழக்கமான வினாவடிவ முடிவுரையை உறுதிப்படுத்தும் கூற்றாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளேட்டுப் புத்தகம்
  rationale: யூதாவின் அரசர்களைப் பற்றிய அதிகாரப்பூர்வ ஆண்டுப் பதிவைக் குறிக்கும் மூலத் தலைப்பை இயல்பான தமிழில் தருகிறது; வேதாகமத்தின் ‘நாளாகமம்’ நூலோடு தேவையற்ற குழப்பத்தையும் தவிர்க்கிறது.
