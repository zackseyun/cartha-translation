  text: וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו אֶל הַ/קִּ֑יר וַ/יִּ֨תְפַּלֵּ֔ל אֶל יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: ta
  text: 'அப்போது அவர் தம் முகத்தைச் சுவரை நோக்கித் திருப்பி, யாவேயிடம்[a] இவ்வாறு வேண்டினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் יהוה (YHWH) என்ற இறைப் பெயர் உள்ளது. அதன் பழங்கால உச்சரிப்பு துல்லியமாக அறியப்படவில்லை; இங்கு அது பொதுவாக ஏற்றுக்கொள்ளப்படும் முறையில் “யாவே” என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: இறைப் பெயரின் மூல வடிவத்தையும் உச்சரிப்பில் உள்ள வரலாற்றுத் தெளிவின்மையையும் விளக்குதல்.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: அப்போது … திருப்பி
  rationale: סבב என்பதன் ஹிஃபில் தொடர்-இறந்தகால வடிவம், கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. ‘அப்போது’ நிகழ்வின் தொடர்ச்சியையும் ‘திருப்பி’ செயற்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: פָּנָיו
  choice: தம் முகத்தை
  rationale: פנים இங்கு நேரடியாக ‘முகம்’ என்று பொருள்படுகிறது. முந்தைய சூழலில் குறிப்பிடப்பட்ட அரசரைக் குறிக்கும் மரியாதை ஒருமை காரணமாக ‘தம்’ பயன்படுத்தப்பட்டது.
- source_word: אֶל הַקִּיר
  choice: சுவரை நோக்கி
  rationale: אֶל திசையையும் קִיר சுவரையும் குறிக்கின்றன. ‘சுவரை நோக்கி’ என்பது திசைநோக்கிய திருப்பத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּתְפַּלֵּל
  choice: வேண்டினார்
  rationale: פלל என்பதன் ஹித்பயேல் வடிவம் இச்சூழலில் கடவுளிடம் வேண்டுதல் செய்வதைக் குறிக்கிறது. ‘வேண்டினார்’ என்பது தற்போதைய பொதுத் தமிழில் இயல்பான, சமயச் சிறப்புச் சொல்லாடல் மிகாத மொழிபெயர்ப்பு.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: אֶל என்பது ‘இடம்/நோக்கி’ என்ற உறவைத் தருகிறது; יהוה என்ற தனிப்பெயர் அதன் பரவலான அறிவியல் உச்சரிப்பை ஒட்டி ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: אמר என்பதன் infinitive construct அடுத்த வசனத்தில் வரும் வேண்டுதலின் சொற்களை அறிமுகப்படுத்துகிறது. தமிழில் ‘இவ்வாறு …:’ என்பது அதே செயல்பாட்டை இயல்பாக நிறைவேற்றுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரேய உரை பொதுப்பட்டப் பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரையே பயன்படுத்துகிறது. அதைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; துல்லியமான பழங்கால உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படவில்லை என்பதும் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. சூழலில் உள்ள அரசரைச் சுட்டுவதால் மரியாதை ஒருமையான ‘அவர்/தம்/வேண்டினார்’ பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் வரும் நேரடி வேண்டுதலை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
