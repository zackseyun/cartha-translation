  source_fidelity: மூல எபிரேயத்தின் நிகழ்வுத் தொடர், ஏசாயாவின் அடையாளம், எசேக்கியாவிடம் கேட்கப்பட்ட இரு கேள்விகள், மற்றும் பதிலில் முதலில் தொலைதூர நாட்டையும் பின்னர் பாபிலோனையும் குறிப்பிட்டு விளக்கும் அமைப்பு அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. יָבֹאוּ என்ற நிறைவுறாத வடிவம் கதைச் சூழலுக்கு ஏற்ற இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது. பதிலில் எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘என்னிடம்’ சேர்க்கப்படவில்லை; இது மூலத்திற்கு நெருக்கமானது.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘இறைவாக்கினர் ஏசாயா’, ‘எசேக்கியா அரசனிடம்’, ‘தொலைதூர நாட்டிலிருந்து’ ஆகியவை உரைநடைக்குப் பொருத்தமானவை. பாபிலோனை இறுதியில் தனித்துச் சுட்டும் கோடுகள் மூலத்தின் விளக்க வலியுறுத்தலை வாசிக்கத்தக்க வகையில் வெளிப்படுத்துகின்றன.
  terminology: ‘இறைவாக்கினர்’ נָבִיא என்பதற்கு நவீன தமிழ் வேதாகமப் பதிவில் பொருத்தமான சொல்லாக உள்ளது. ‘ஏசாயா’, ‘எசேக்கியா’, ‘பாபிலோன்’ ஆகிய பெயர்வடிவங்கள் நிலையானவையும் அறியப்பட்டவையும் ஆகும். எந்தத் திணிப்பான இறையியல் விளக்கமும் சேர்க்கப்படவில்லை.
