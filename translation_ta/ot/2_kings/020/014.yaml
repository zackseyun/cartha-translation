translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ஏசாயாவுக்கு மரியாதைப் பன்மையும் அரசன் எசேக்கியாவுக்கு உரைநடையில் ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. கேள்விகள் எபிரேய மூலத்தின் இரு கூறுகளாகவே வைக்கப்பட்டுள்ளன; இடப்பெயரை இறுதியில் குறிப்பிடும் வலியுறுத்தல் கோடுகளால் காக்கப்பட்டுள்ளது.
