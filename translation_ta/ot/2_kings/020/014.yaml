  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: ta
  text: அப்போது இறைவாக்கினர் ஏசாயா எசேக்கியா அரசனிடம் வந்து, “இந்த மனிதர்கள் என்ன சொன்னார்கள்? இவர்கள் எங்கிருந்து உன்னிடம் வந்தார்கள்?[a]” என்று கேட்டார். அதற்கு எசேக்கியா, “தொலைதூர நாட்டிலிருந்து—பாபிலோனிலிருந்து—வந்தார்கள்”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கிருந்து உன்னிடம் வருகிறார்கள்?” என்றும் இன்னும் சொற்சொல்லாக மொழிபெயர்க்கலாம். எபிரேயத்தில் நிறைவுறாத கால வினைவடிவம் உள்ளது; ஆனால் கதைச் சூழல் இறந்தகாலப் பொருளைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எசேக்கியா முதலில் வந்தவர்களின் தொலைதூரத் தோற்றத்தை வலியுறுத்தி, பின்னர் அந்த நாட்டைப் “பாபிலோன்” என்று குறிப்பாகச் சொல்கிறான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: வாவ் தொடர் வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் ‘அப்போது’ இயல்பான நிகழ்வுத் தொடரைத் தருகிறது.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: இறைவாக்கினர் ஏசாயா
  rationale: נָבִיא என்பதன் தீர்க்கதரிசனப் பணியைத் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் ‘இறைவாக்கினர்’ தெரிவிக்கிறது; பெயருக்கு வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶל הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: எசேக்கியா அரசனிடம்
  rationale: எபிரேய மொழியின் பெயர்-பதவி இணைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் வழங்குகிறது.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: இந்த மனிதர்கள் என்ன சொன்னார்கள்?
  rationale: ஆண்பால் பன்மையான אֲנָשִׁים என்பதற்கு ‘மனிதர்கள்’ எனத் துல்லியமாகவும் பொதுவாசகர்களுக்கு இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: இவர்கள் எங்கிருந்து உன்னிடம் வந்தார்கள்?
  rationale: יָבֹאוּ வடிவம் இலக்கண ரீதியாக நிறைவுறாத கால வடிவமாயினும், நிகழ்ந்த வருகையைப் பற்றிய கதைச் சூழலில் தமிழின் இறந்தகாலம் இயல்பானது; אֵלֶיךָ என்பதிலுள்ள ‘உன்னிடம்’ வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: தொலைதூர நாட்டிலிருந்து
  rationale: புவியியல் தொலைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவித்து, பின்வரும் குறிப்பிட்ட இடப்பெயருக்கு முன்னுரையாக அமைகிறது.
- source_word: בָּאוּ מִבָּבֶל
  choice: பாபிலோனிலிருந்து—வந்தார்கள்
  rationale: முதலில் பொதுவான தொலைதூரத் தோற்றத்தையும் பின்னர் குறிப்பிட்ட இடமான பாபிலோனையும் கூறும் எபிரேய வலியுறுத்தல் பாதுகாக்கப்பட்டது.
- source_word: בָּבֶל
  choice: பாபிலோன்
  rationale: இடப்பெயரின் பரவலாக அறியப்பட்ட நவீன தமிழ் வடிவம்.
