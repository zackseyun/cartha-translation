  source_fidelity: மூல எபிரெயத்தின் காலச் சுட்டி, அனுப்பியவர், தந்தைமகன் அடையாளம், பாபிலோன் அரசப் பதவி, கடிதங்களும் பரிசும், மற்றும் எசேக்கியாவின் நோய்ச் செய்தியே அனுப்புதலுக்குக் காரணம் என்பன அனைத்தும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. «நோயுற்றிருந்ததைக் கேள்விப்பட்டு» என்பது சூழலுக்கேற்ற இயல்பான வடிவமாகும்.
