source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: ta
  text: அக்காலத்தில் பாபிலோனின் அரசனான பலாதானின் மகன் பெரோதாக்-பலாதான்[a], எசேக்கியா நோயுற்றிருந்ததைக் கேள்விப்பட்டு, அவருக்குக் கடிதங்களையும் ஓர் அன்பளிப்பையும் அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய பாடத்தில் “பெரோதாக்-பலாதான்” என்று உள்ளது; ஏசாயா 39:1-லும் பண்டைய மரபிலும் காணப்படும் மாற்று வடிவின் அடிப்படையில் சில மொழிபெயர்ப்புகள் “மெரோதாக்-பலாதான்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: கதை நிகழும் காலத்தை இயல்பாகக் குறிக்கும் எபிரெய காலச் சொற்றொடருக்கு நவீனத் தமிழில் தெளிவான இணை.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: பெரோதாக்-பலாதான்
  rationale: WLC மெய்யெழுத்துப் பாடத்தில் உள்ள பெயர்வடிவத்தை நேரடியாக ஒலிபெயர்க்கிறது; ஏசாயா 39:1-இல் காணப்படும் மெரோதாக் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֶּן בַּלְאֲדָן
  choice: பலாதானின் மகன்
  rationale: தந்தை-மகன் உறவைக் குறிக்கும் எபிரெய அமைப்பின் இயல்பான தமிழாக்கம்.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோனின் அரசன்
  rationale: அரச பதவியையும் ஆட்சிப் பகுதியையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: סְפָרִים
  choice: கடிதங்கள்
  rationale: அரசர்களுக்கிடையிலான தூதரகச் சூழலில் பொதுவான எழுத்துகள் அல்லது ஆவணங்கள் என்பதைக் காட்டிலும் கடிதங்கள் என்பதே பொருத்தமானது.
- source_word: וּמִנְחָה
  choice: ஓர் அன்பளிப்பு
  rationale: מִנְחָה என்பது காணிக்கை, பரிசு அல்லது திறை எனப் பொருள்படலாம்; இச்சூழலில் கட்டாயத் திறை என்ற கருத்தைச் சேர்க்காமல் அரச மரியாதைப் பரிசைக் குறிக்கிறது.
- source_word: כִּי שָׁמַע כִּי חָלָה חִזְקִיָּהוּ
  choice: எசேக்கியா நோயுற்றிருந்ததைக் கேள்விப்பட்டு
  rationale: முதல் כִּי காரணத்தையும் இரண்டாவது כִּי கேட்ட செய்தியின் உள்ளடக்கத்தையும் காட்டுகின்றன; தமிழில் வினையெச்ச அமைப்பு இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁלַח
  choice: அனுப்பினான்
  rationale: தூதரகக் கடிதங்களும் அன்பளிப்பும் அனுப்பப்பட்டதை நேரடியாகக் குறிக்கும் பொதுவான வினை.
