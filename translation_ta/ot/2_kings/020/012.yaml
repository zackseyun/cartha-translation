  terminology: எசேக்கியா, பாபிலோன், பலாதான் ஆகிய பெயர்வடிவங்கள் நிலையான பயன்பாட்டுக்கு ஏற்றவை. WLC-யின் பெரோதாக்-பலாதான் வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, ஏசாயா 39:1-இன் மெரோதாக்-பலாதான் மாற்றுவடிவம் அடிக்குறிப்பில் சரியாகக் குறிக்கப்பட்டுள்ளது. «அன்பளிப்பு» מִנְחָה என்பதற்கான நடுநிலையான, சூழலுக்குப் பொருத்தமான தெரிவாகும்.
