  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நிழல் கருவியின் துல்லியமான அமைப்பு மூலத்தில் விளக்கப்படாததால் ‘சூரியக் கடிகாரம்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
