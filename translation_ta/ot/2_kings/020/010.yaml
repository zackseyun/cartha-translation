base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: ta
  text: எசேக்கியா, “நிழல் பத்துப் படிகள் முன்னோக்கி நீள்வது எளிது. வேண்டாம்; நிழல் பத்துப் படிகள் பின்னோக்கித் திரும்பட்டும்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பத்துப் பாகைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ‘படிகள்’ அல்லது ‘ஏற்றங்கள்’ என்று பொருள்படும்; அது ஆகாசின் நிழல் கருவியிலிருந்த படிகளையோ அளவுக் குறிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: எளிது
  rationale: இச்சொல் எளிமை அல்லது சுலபத்தன்மையைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் ‘எளிது’ என வழங்கப்பட்டுள்ளது.
- source_word: הַצֵּל / לַצֵּל
  choice: நிழல்
  rationale: צֵל என்பதன் நேரான பொருள் ‘நிழல்’; சூழலில் குறிப்பிட்ட நிழலைக் குறித்தாலும் தமிழில் தனிக் குறிப்புச் சுட்டு தேவையில்லை.
- source_word: לִנְטוֹת
  choice: முன்னோக்கி நீள்வது
  rationale: נטה என்பதன் நீளுதல், விரிதல், சாய்தல் என்ற பொருள் வரம்பை நிழலின் இயல்பான நகர்வுக்கேற்றவாறு வழங்குகிறது. ‘முன்னோக்கி’ என்பது அடுத்துள்ள ‘பின்னோக்கி’ என்ற எதிர்மறை இயக்கத்துடன் உள்ள கருத்து வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: מַעֲלוֹת
  choice: படிகள்
  rationale: மַעֲלוֹת என்பதன் அடிப்படைப் பொருள் ஏற்றங்கள் அல்லது படிகள். ‘பாகைகள்’ என்ற மரபான மாற்றை முதன்மை உரைக்குள் கொண்டு வராமல், அதன் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: לֹא כִּי
  choice: வேண்டாம்; ... திரும்பட்டும்
  rationale: முதலில் முன்வைக்கப்பட்ட சாத்தியத்தை மறுத்து, அதற்கு மாறான விருப்பத்தைத் தெரிவிக்கும் எபிரெய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָשׁוּב
  choice: திரும்பட்டும்
  rationale: שׁוב என்பது திரும்புதல் அல்லது பின்னோக்கிச் செல்லுதல். இங்கு கோரப்படும் அடையாளத்தை விருப்பவினை வடிவில் ‘திரும்பட்டும்’ என வழங்குவது பொருத்தமானது.
- source_word: אֲחֹרַנִּית
  choice: பின்னோக்கி
  rationale: இந்த வினையடை பின்னால் நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘பின்னோக்கி’ என்பது தெளிவான நவீனத் தமிழ் வடிவம்.
