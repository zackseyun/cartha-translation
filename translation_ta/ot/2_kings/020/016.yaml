  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: ta
  text: அப்போது ஏசாயா எசேக்கியாவிடம், “யாவேவின்[a] வார்த்தையைக் கேளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் எபிரெய மூல வடிவத்தையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் அதன் தொடர்ச்சிப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְשַׁעְיָהוּ
  choice: ஏசாயா
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֶל חִזְקִיָּהוּ
  choice: எசேக்கியாவிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்படுகிறது என்பதை இயல்பான தமிழில் குறிக்கிறது; எசேக்கியா என்பது தமிழில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: שְׁמַע
  choice: கேளுங்கள்
  rationale: שמע என்பதன் ஒருமை ஏவல் வடிவத்தை, அரசனை நோக்கிய மரியாதையான நவீனத் தமிழ் ஏவலாக வழங்குகிறது.
- source_word: דְּבַר
  choice: உரைத்த வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் இது தேவனிடமிருந்து வரும் சொல்லப்பட்ட செய்தியைக் குறிக்கிறது. ‘வார்த்தை’ என்ற வேதாகமச் சொல்லாட்சியைத் தக்கவைத்தபடி தமிழில் தொடர்பைத் தெளிவாக்க ‘உரைத்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எபிரெய எழுத்துகளை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் பெயரை ஒலிபெயர்த்து, மரபான மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனை நோக்கிய ஒருமை ஏவலை மரியாதைப் பன்மையான ‘கேளுங்கள்’ என இயல்பாக வழங்குகிறது; பழமையான ‘கேளும்’ தவிர்க்கப்பட்டுள்ளது.
