base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: ta
  text: அப்போது எசேக்கியா ஏசாயாவிடம், “நீர் சொன்ன யெகோவாவின் வார்த்தை நல்லது” என்றான். அதற்கு அவன், “என் நாட்களில் அமைதியும் நிலைத்தன்மையும்[a] இருந்தால், அது நல்லதல்லவா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமைதியும் உண்மையும்.” எபிரெயச் சொல் ‘உண்மை,’ ‘உண்மைத்தன்மை,’ ‘நம்பகத்தன்மை’ அல்லது இச்சூழலில் ‘நிலைத்தன்மை’ என்று பொருள்படலாம்.
    reason: אֱמֶת என்ற சொல்லின் பொருள் வரம்பையும் பாரம்பரியமான நேரடி மொழிபெயர்ப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: טוֹב
  choice: நல்லது
  rationale: அறிவிக்கப்பட்ட இறைவார்த்தையைச் சுருக்கமாக மதிப்பிடும் எபிரெயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; எசேக்கியாவின் நோக்கத்தை ‘சாதகமானது’ என்று மிகையாக விளக்கவில்லை.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் דָּבָר என்பதன் வழக்கமான ‘வார்த்தை’ என்ற பொருளையும், יהוה என்ற இறைப்பெயரையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: דִּבַּרְתָּ
  choice: நீர் சொன்ன
  rationale: ஏசாயாவை நேரடியாக மரியாதையுடன் விளிக்கும் இயல்பான நவீனத் தமிழ்; அவர் இறைச்செய்தியை உரைத்தார் என்பதையும் தெளிவாக்குகிறது.
- source_word: שָׁלוֹם
  choice: அமைதி
  rationale: சமூக அமைதி, நலநிலை ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய பரந்த, வழக்கமான பொருளைத் தக்கவைக்கிறது.
- source_word: אֱמֶת
  choice: நிலைத்தன்மை
  rationale: இவ்வரசாட்சி மற்றும் தேசியச் சூழலில் நம்பத்தகுந்த, உறுதியான நிலை என்ற பொருளை இயல்பாகக் காட்டுகிறது; ‘உண்மை’ என்ற நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְיָמָי
  choice: என் நாட்களில்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும் எசேக்கியாவின் தன்னைக் குறித்த அக்கறையையும் பேணும் இயல்பான தமிழ்.
theological_decisions:
- issue: இறுதி கூற்று எபிரெயத்தில் இலக்கண ரீதியாகச் சுருக்கப்பட்டதாக இருப்பதால், அது எசேக்கியா வாயால் சொன்னதாகவோ அவனுடைய காரணவாதத்தை விளக்கும் எண்ணமாகவோ புரிந்துகொள்ளப்படலாம்.
  choice: וַיֹּאמֶר என்பதற்கிணங்க இரண்டாம் கூற்றையும் அவன் சொன்ன நேரடிப் பேச்சாக அளித்து, הֲלוֹא என்பதன் வினாவுணர்வை ‘இருக்குமல்லவா?’ என்று காட்டுதல்.
  alternative: “ஏனெனில், ‘என் நாட்களில் அமைதியும் நிலைத்தன்மையும் இருக்குமல்லவா?’ என்று அவன் எண்ணினான்” என அவனுடைய உள்ளார்ந்த காரணமாக அளித்தல்.
  rationale: ‘சொன்னான்’ என்பது மூலத்தின் வெளிப்படையான வினைச்சொல்லை மதிக்கிறது. இயல்பான தமிழுக்காக நீள்விட்டுள்ள வாக்கியம் நிறைவு செய்யப்பட்டாலும், எசேக்கியாவின் பதிலிலுள்ள தன்னலமா அல்லது தீர்ப்பை ஏற்றுக்கொள்ளுதலா என்ற நெறியியல் மற்றும் இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ஏசாயாவை நோக்கிய ஒருமை மரியாதை ‘நீர்’ என வழங்கப்பட்டுள்ளது; இறைப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது. இறுதி எபிரெயச் சொற்றொடரின் சுருக்கத்தை இயல்பான வினாவாக்கியமாக்கியுள்ள போதிலும் அதன் நெறியியல் இருமை தீர்க்கப்படவில்லை.
