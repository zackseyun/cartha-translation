base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: ta
  text: எசேக்கியா அவர்களுக்குச் செவிகொடுத்து[a], தன் பொக்கிஷ அறை[b] முழுவதையும்—வெள்ளி, பொன், நறுமணப் பொருள்கள், உயர்தர எண்ணெய், தன் ஆயுதசாலை[c], தன் களஞ்சியங்களில் காணப்பட்ட எல்லாவற்றையும்—அவர்களுக்குக் காட்டினான். எசேக்கியா தன் வீட்டிலோ தன் ஆட்சிப்பரப்பு முழுவதிலோ[d] அவர்களுக்குக் காட்டாதது ஒன்றும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் சொன்னதைக் கேட்டான்’ அல்லது ‘அவர்களைச் சாதகமாக ஏற்றுக்கொண்டான்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் செவிகொடுத்தல் அல்லது வரவேற்று ஏற்றுக்கொள்ளுதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘தன் பொக்கிஷக் களஞ்சியம்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘தன் படைக்கலக் களஞ்சியம்’; இன்னும் சொல்லுக்கு நெருக்கமாக, ‘தன் உபகரணங்களின் அறை.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது ‘தன் ஆளுகை முழுவதிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: அவர்களுக்குச் செவிகொடுத்து
  rationale: שׁמע על என்ற சொற்றொடர் வெறுமனே ஒலியைக் கேட்டதைக் காட்டாமல், ஒருவருக்குச் செவிகொடுத்தல் அல்லது அவர்களைச் சாதகமாக ஏற்றுக்கொள்ளுதல் என்ற பொருளையும் தரலாம். தமிழில் இயல்பாகவும் அந்தப் பொருள் விரிவைத் திறந்துவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: அவர்களுக்குக் காட்டினான்
  rationale: ראה என்பதன் ஹிஃபில் வடிவம் இங்கு ‘காட்டு’ என்று இயல்பாகப் பொருள்படுகிறது; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாட்சி வைக்கப்பட்டது.
- source_word: בֵּית נְכֹתֹה
  choice: தன் பொக்கிஷ அறை
  rationale: விலையுயர்ந்த பொருள்கள் வைக்கப்பட்ட இடத்தை இச்சொற்றொடர் குறிக்கிறது. தொடர்ந்து வரும் பொருட்பட்டியலுடன் ‘பொக்கிஷ அறை’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: வெள்ளி, பொன்
  rationale: இங்கு כֶּסֶף என்பது நவீன பொருளில் பணத்தைவிடச் சேமித்து வைக்கப்பட்ட விலையுயர்ந்த உலோகமான வெள்ளியைக் குறிக்கிறது; זָהָב நேரடியாகப் பொன்னைக் குறிக்கிறது.
- source_word: הַבְּשָׂמִים
  choice: நறுமணப் பொருள்கள்
  rationale: மதிப்புமிக்க வாசனைப் பொருள்கள், நறுமணச் சரக்குகள் ஆகியவற்றை உள்ளடக்கும் பரந்த பன்மைப் பொருளை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֶׁמֶן הַטּוֹב
  choice: உயர்தர எண்ணெய்
  rationale: சொல்லுக்கு சொல் ‘நல்ல எண்ணெய்’; சூழலில் அதன் சிறந்த தரத்தையோ மதிப்பையோ குறிக்கிறது. அதன் குறிப்பிட்ட பயன்பாட்டை ஊகிக்காமல் ‘உயர்தர’ என வழங்கப்பட்டது.
- source_word: בֵּית כֵּלָיו
  choice: தன் ஆயுதசாலை
  rationale: அரசரின் சேமிப்புப் பட்டியல் சூழலில் כֵּלִים என்பது ஆயுதங்கள் அல்லது படைக்கல உபகரணங்களைக் குறிக்கக்கூடும். அதனால் இயல்பான ‘ஆயுதசாலை’ முதன்மை உரையில் இடப்பட்டது; சொல்லாட்சியின் பரந்த தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: தன் களஞ்சியங்களில் காணப்பட்ட எல்லாவற்றையும்
  rationale: אֹצָר என்பது பொக்கிஷசாலை அல்லது களஞ்சியம் எனப் பொருள்படும். முந்தைய வேறொரு எபிரெயச் சொற்றொடருக்கு ‘பொக்கிஷ அறை’ பயன்படுத்தப்பட்டதால், இங்கு ‘களஞ்சியங்கள்’ வேறுபாட்டையும் இயல்பையும் காக்கிறது.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: அவர்களுக்குக் காட்டாதது ஒன்றும் இல்லை
  rationale: எபிரெய இரட்டை எதிர்மறை அமைப்பின் முழுமையான, வலியுறுத்தப்பட்ட கருத்தை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: בְּבֵיתוֹ
  choice: தன் அரண்மனையில்
  rationale: சொல்லுக்கு சொல் ‘தன் வீட்டில்’; அரசனாகிய எசேக்கியாவின் இல்லத்தையும் அரச சேமிப்பிடத்தையும் குறிக்கும் இச்சூழலில் ‘அரண்மனை’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: தன் ஆட்சிப்பரப்பு முழுவதிலும்
  rationale: מֶמְשָׁלָה என்பது ஆளுகை, அதிகாரம் அல்லது அந்த அதிகாரத்திற்குட்பட்ட பரப்பு எனப் பொருள்படும். ‘ஆட்சிப்பரப்பு’ புவியியல் மற்றும் நிர்வாக விரிவை இயல்பாகத் தெரிவிக்கிறது.
