  to: '“நீ திரும்பிப் போய், என் மக்களின் தலைவனாகிய எசேக்கியாவிடம் சொல்: ‘உன் மூதாதையான தாவீதின் கடவுளாகிய யாவே இவ்வாறு சொல்கிறார்: உன் மன்றாட்டைக் கேட்டேன்; உன் கண்ணீரைக் கண்டேன். இதோ, நான் உன்னைக் குணமாக்குகிறேன்.[a] மூன்றாம் நாளில் நீ யாவேயின் ஆலயத்திற்கு ஏறிச் செல்வாய்.’”'
  rationale: The revision corrects the Tamil progressive aspect, which made the healing sound continuously underway, while retaining the Hebrew participle's immediate declarative force and preserving the future alternative in the footnote. It renders the dynastic sense of “David your father” accurately for modern Tamil readers, and restores the source verb's ‘go up’ nuance. The divine name and the passage's dignified prophetic register are retained.
