base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: ta
  text: '“நீ திரும்பிப் போய், என் மக்களின் தலைவனாகிய எசேக்கியாவிடம் சொல்: ‘உன் மூதாதையான தாவீதின் கடவுளாகிய யாவே இவ்வாறு சொல்கிறார்: உன் மன்றாட்டைக் கேட்டேன்; உன் கண்ணீரைக் கண்டேன். இதோ, நான் உன்னைக் குணமாக்குகிறேன்.[a] மூன்றாம் நாளில் நீ யாவேயின் ஆலயத்திற்கு ஏறிச் செல்வாய்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னைக் குணமாக்குவேன்.” எபிரெயத்தில் இன்னும் நேரடியாக, “இதோ, நான் உன்னைக் குணமாக்குகிறேன்” என்று உள்ளது; இங்குள்ள பங்கேற்புவினை உடனடியாக நிகழவிருக்கும் செயலையும் குறிக்கலாம்.
    reason: lexical_alternative
