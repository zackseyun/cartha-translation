base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: ta
  text: ஏசாயா, “ஓர் அத்திப்பழக் கட்டியை[a] எடுத்துக்கொள்ளுங்கள்” என்றார். அவர்கள் அதை எடுத்து, அந்தக் கட்டிப்புண்ணின்மேல்[b] வைத்தார்கள்; அவன் குணமடைந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அத்திப்பழ அடை”; உலர்த்தி அழுத்தப்பட்ட அத்திப்பழத் திரள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “வீக்கமுற்ற புண்” அல்லது “தோல் உல்சர்.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “அவன் வாழ்ந்தான்”; இச்சூழலில் அவன் குணமடைந்தான் என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: தொடர்கதையின் அடுத்த நிகழ்வை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய இணைப்புச் சொல்லைத் தனியாக மொழிபெயர்க்காமல் தமிழ் உரைநடையின் ஓட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: יְשַׁעְיָהוּ
  choice: ஏசாயா
  rationale: தமிழில் பரவலாக அறியப்பட்ட தீர்க்கதரிசியின் பெயர்வடிவம்.
- source_word: קְחוּ
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: לקח என்ற வினையின் பன்மை ஏவலை மரியாதையுடனும் இயல்பாகவும் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொண்டுவாருங்கள்’ என்ற திசைநுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: ஓர் அத்திப்பழக் கட்டி
  rationale: உலர்த்தி அழுத்திச் செய்யப்பட்ட அத்திப்பழத் திரளை எளிய நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: וַיִּקְחוּ
  choice: அவர்கள் அதை எடுத்து
  rationale: பன்மை வினையைப் பாதுகாக்கிறது; முன் கூறப்பட்ட அத்திப்பழக் கட்டியே மறைமுகச் செயப்படுபொருள் என்பதால் தமிழில் ‘அதை’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: וַיָּשִׂימוּ עַל
  choice: மேல் வைத்தார்கள்
  rationale: שׂים என்ற பொதுவான ‘வை’ வினையையும் עַל என்ற இடத்தொடர்பையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַשְּׁחִין
  choice: அந்தக் கொப்புளம்
  rationale: வீக்கமுற்ற தோல் கொப்புளம் அல்லது கட்டிப்புண் என்ற சொல்லின் பொதுவான மருத்துவச் சூழலைச் சுருக்கமாகத் தருகிறது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיֶּחִי
  choice: அவன் குணமடைந்தான்
  rationale: חיה என்பதன் அடிப்படைப் பொருள் ‘வாழ்ந்தான்’ என்றாலும், இந்நோய்நீக்கச் சூழலில் உடல்நலம் மீண்டதை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சொல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: וַיֶּחִי குறிப்பிடும் விளைவு
  choice: உடல்நோயிலிருந்து குணமடைதல்
  alternative: அவன் வாழ்ந்தான் / உயிர்பெற்றான்
  rationale: சூழல் எசேக்கியாவின் தோல் நோய்க்குச் செய்யப்பட்ட சிகிச்சையையும் அதன் பின்விளைவையும் குறிக்கிறது. ஆகவே ‘குணமடைந்தான்’ என்பது உயிர்த்தெழுதல் போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் சூழல்சார் பொருளைத் தருகிறது; அதேவேளை அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை ஏவலும் பன்மைச் செயற்பாட்டாளர்களும் பாதுகாக்கப்பட்டுள்ளன. அரிதான மருத்துவச் சொற்களை முதன்மை உரையில் தவிர்த்து, தேவையான பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
