  rationale: மரணத்தை உண்டாக்கும் தீவிர நோயைக் குறிக்கும் மூலத் தொடரை நவீனத் தமிழில் இயல்பாகத் தர “சாகும் அளவுக்கு நோயுற்றான்” என மாற்றப்பட்டது. இறைவாக்கு வாய்பாடு நேரடியான தமிழ் வடிவில் அமைக்கப்பட்டு, மேற்கோள் குறிகளின் தேவையற்ற அடுக்குதல் நீக்கப்பட்டது. அடிக்குறிப்பு மூலத்தின் விவாதத்துக்குரிய நேரடிச் சொல்லமைப்பைத் தக்கவைத்துக்கொண்டு இயல்பான தமிழில் திருத்தப்பட்டது.
