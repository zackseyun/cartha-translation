source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: ta
  text: 'அந்நாட்களில் எசேக்கியா சாகும் அளவுக்கு நோயுற்றான். ஆமோசின் மகனான இறைவாக்கினர் ஏசாயா அவனிடம் வந்து, “யாவே இவ்வாறு கூறுகிறார்: உன் வீட்டுக் காரியங்களை ஒழுங்குபடுத்து; ஏனெனில் நீ சாகப்போகிறாய்[a]; நீ உயிர் பிழைக்கமாட்டாய்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “நீ சாகிறாய்” அல்லது “நீ இறந்தவன்.” எபிரேயச் சொற்றொடர் நிச்சயமானதும் உடனடியுமான மரணத்தை அறிவிக்கிறது.
    reason: מֵת אַתָּה என்ற எபிரேயத் தொடரின் நேரடிப் பொருள் மாற்றுகளையும், இச்சூழலில் அது அறிவிக்கும் உறுதியான, உடனடியான மரணத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்நாட்களில்
  rationale: கதையின் காலச் சூழலை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடரை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: எசேக்கியா மரணத்துக்கு ஏதுவான நோயுற்றான்
  rationale: חָלָה என்பதன் நோயுறுதல் என்ற பொருளையும், לָמוּת காட்டும் நோயின் உயிர்க்கொல்லும் தீவிரத்தையும் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ஆமோசின் மகனான இறைவாக்கினர் ஏசாயா
  rationale: தந்தை வழி அடையாளத்தையும் நபி என்ற பணிப்பெயரையும் தக்கவைத்து, நவீனத் தமிழின் இயல்பான சொல் வரிசையில் அமைக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: இறைச்செய்தியை அறிவிக்கும் தூதர் வாய்பாட்டை இயல்பான தமிழில் தருவதோடு, יהוה என்ற தனிப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: צַו לְבֵיתֶךָ
  choice: உன் வீட்டுக் காரியங்களை ஒழுங்குபடுத்து
  rationale: மரணத்தை எதிர்நோக்கி வீட்டாருக்கும் உடைமைகளுக்கும் தேவையான அறிவுறுத்தல்களையும் ஏற்பாடுகளையும் செய்ய வேண்டும் என்ற மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது.
- source_word: כִּי מֵת אַתָּה
  choice: ஏனெனில் நீ சாகப்போகிறாய்
  rationale: சொல்லுக்கு சொல் முடிந்துபோன மரணமாகக் காட்டாமல், உறுதியான உடனடி மரண அறிவிப்பாக இப்பெயரெச்சத் தொடரின் சூழல் சார்ந்த வலிமையைத் தருகிறது.
- source_word: וְלֹא תִחְיֶה
  choice: உயிர்வாழ மாட்டாய்
  rationale: தொடர்ந்து வாழ்வது மறுக்கப்படுவதை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைத்தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாகத் தருகிறது.
- issue: מֵת אַתָּה என்பதின் கால மற்றும் பொருள் வலிமை
  choice: நீ சாகப்போகிறாய்
  alternative: நீ சாகிறாய் / நீ இறந்தவன்
  rationale: இது ஏற்கெனவே நிகழ்ந்த மரணத்தைக் குறிப்பதல்ல; நிச்சயமாகவும் விரைவிலும் நிகழவுள்ள மரணத்தை அறிவிக்கிறது. மூலத்தின் சுருக்கமான பதற்றத்தை அடிக்குறிப்பில் மாற்றுகளுடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “இறைவாக்கினர்” என்பது הַנָּבִיא என்பதற்கான தெளிவான பணிப்பெயர்; “வீட்டுக் காரியங்களை ஒழுங்குபடுத்து” என்பது வெறும் வீட்டைச் சீர்செய்வதாகத் தவறாகப் புரியாமல் இறுதிக் குடும்ப ஏற்பாடுகளை உணர்த்துகிறது.
