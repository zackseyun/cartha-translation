base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: ta
  text: எசேக்கியா ஏசாயாவிடம், “யாவே என்னைக் குணமாக்குவார் என்றும், நான் மூன்றாம் நாளில் யாவேயின் ஆலயத்துக்கு[a] ஏறிச் செல்வேன் என்றும் காட்டும் அடையாளம் என்ன?” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “யாவேயின் வீடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: எபிரெய மொழியில் பொதுவாக ‘சொன்னான்’ என்ற பொருளுடைய வடிவம்; இங்கு நேரடிக் கேள்வியை அறிமுகப்படுத்துவதால் இயல்பான நவீன தமிழில் ‘கேட்டான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מָה אוֹת
  choice: அடையாளம் என்ன?
  rationale: אוֹת என்பது கடவுளின் வாக்குறுதியை உறுதிப்படுத்தும் அடையாளத்தைக் குறிக்கிறது; ‘அடையாளம்’ அதன் பொருள் வரம்பைச் சுருக்காமல் இயல்பாகத் தருகிறது.
- source_word: כִּי יִרְפָּא יְהוָה לִי
  choice: யாவே என்னைக் குணமாக்குவார் என்பதற்கு
  rationale: כִּי இங்கு கேட்கப்படும் அடையாளத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; imperfect வினை எதிர்கால வாக்குறுதியைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், நவீன தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாகத் தரப்பட்டுள்ளது.
- source_word: וְעָלִיתִי
  choice: நான் ... ஏறிச் செல்வேன் என்பதற்கும்
  rationale: עלה என்பதன் ‘மேலே போதல்’ என்ற படிமத்தைப் பாதுகாக்க ‘ஏறிச் செல்வேன்’ பயன்படுத்தப்பட்டது; இணைப்பு வாக்கியத்தின் இரண்டாம் உள்ளடக்கக் கூறாகத் தெளிவாக்கப்பட்டது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயத் தொடருக்கு நேர்த்தியான, இயல்பான தமிழாக்கம்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் அது வழிபாட்டு ஆலயத்தைக் குறிக்கிறது; முதன்மை உரையில் இயல்பான ‘ஆலயம்’ பயன்படுத்தப்பட்டு நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை திருநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்பது தனிப்பட்ட திருநாமத்தைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதன் குறிப்பு
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: ‘ஆலயம்’ என்பது இங்கு குறிக்கப்படும் வழிபாட்டு இடத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘வீடு’ என்ற மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணை அமைப்பைத் தெளிவாக்க ‘என்பதற்கும் ... என்பதற்கும்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஏறிச் செல்வேன்’ என்பது ஆலயத்திற்குச் செல்வதிலுள்ள மூல வினையின் உயர்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது.
