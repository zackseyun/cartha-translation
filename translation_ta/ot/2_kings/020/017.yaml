  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: ta
  text: இதோ, நாட்கள் வருகின்றன; அப்போது உன் வீட்டிலுள்ள அனைத்தும், இந்நாள்வரை உன் மூதாதையர் சேமித்து வைத்த அனைத்தும் பாபிலோனுக்குக் கொண்டுபோகப்படும். எதுவும் மீதியாக இருக்காது என்று ஆண்டவர் கூறுகிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வரவிருக்கும் தீர்ப்பை வலியுறுத்தும் எபிரெயச் சொல்லின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: בְּבֵיתֶךָ
  choice: உன் அரண்மனையில்
  rationale: அரசனாகிய எசேக்கியாவிடம் உரைக்கப்படுவதால், இங்கு בַּיִת என்பது தனிப்பட்ட வீடு மட்டுமல்லாமல் அரச அரண்மனையையும் அதன் கருவூலத்தையும் குறிக்கிறது.
- source_word: אָצְרוּ
  choice: சேமித்து வைத்த
  rationale: பொருட்களைக் கருவூலத்தில் திரட்டிப் பாதுகாத்தல் என்ற வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲבֹתֶיךָ
  choice: உன் மூதாதையர்
  rationale: இங்கு உடனடியான தந்தையரை மட்டும் அல்லாமல் முந்தைய தலைமுறையினரையும் குறிக்கும் பன்மையைத் தெளிவாகத் தருகிறது.
- source_word: וְנִשָּׂא
  choice: கொண்டுபோகப்படும்
  rationale: செல்வங்கள் பாபிலோனுக்கு எடுத்துச் செல்லப்படும் என்ற செயல்பாட்டு பொருளையும் எபிரெய நிபால் வடிவின் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: דָּבָר
  choice: ஒன்றும்
  rationale: எதுவொன்றும் மீதியிருக்காது என்ற முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் தெய்வீகப் பெயரைக் குறிக்க வழக்கமான மரியாதைமிக்க வடிவம்; அதை ஒரு பொதுவான பட்டமாக மட்டும் வாசிக்காமல் இருக்க வெளியீட்டு நடைமுறையில் தனித்துவமாக அமைக்கலாம்.
theological_decisions:
- issue: தீர்க்கதரிசனத்தின் உறுதித்தன்மை
  choice: ‘கொண்டுபோகப்படும்; ... விடப்படாது’ என்ற உறுதியான எதிர்கால வாக்கியங்கள்
  alternative: ‘கொண்டுபோகப்படலாம்’ போன்ற சாத்தியத்தைக் குறிக்கும் மொழி
  rationale: எபிரெய உரை சாத்தியத்தை அல்ல, வரவிருக்கும் தெய்வீகத் தீர்ப்பை உறுதியாக அறிவிக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதை ஏற்றுக்கொண்டபடியே, சாதாரண தமிழ் வாசகர்களுக்குப் பரிச்சயமான மரியாதைமிக்க வேதாகமப் பயன்பாட்டைத் தேர்ந்தெடுக்கிறது; எந்தப் பிரிவுசார் தனித்துவத்தையும் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘நாட்கள் வருகின்றன’ என்ற எபிரெய மொழியமைப்பின் தீர்க்கதரிசனத் தொனி பாதுகாக்கப்பட்டுள்ளது; சூழலுக்கேற்றவாறு ‘வீடு’ என்பதற்குப் பதில் ‘அரண்மனை’ பயன்படுத்தப்பட்டுள்ளது.
