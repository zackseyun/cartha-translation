base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: ta
  text: 'ஏசாயா, “யாவே தாம் சொன்ன காரியத்தைச் செய்வார் என்பதற்கு, யாவேயிடமிருந்து உமக்கான அடையாளம் இதுவே: நிழல் பத்துப் படிகள்[a] முன்னோக்கிச் செல்லட்டுமா, அல்லது பத்துப் படிகள் பின்னோக்கித் திரும்பட்டுமா?” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பத்துப் பாகைகள் (டிகிரிகள்).” எபிரெயச் சொல் நேரடியாக “படிகள்” அல்லது “ஏறும் படிநிலைகள்” என்று பொருள்படும். ஆகாஸுடன் தொடர்புடைய அமைப்பில் நிழல் நகர்வதை இங்கு குறிப்பதால், பாரம்பரியமாக இது “பாகைகள்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: அடையாளம்
  rationale: אוֹת என்பது உறுதிப்படுத்தும் அடையாளத்தை இங்கு குறிக்கிறது; எசேக்கியாவுக்குக் கொடுக்கப்படும் அற்புத உறுதிப்பாட்டுக்கு ‘அடையாளம்’ இயல்பான தமிழாக்கம்.
- source_word: מֵאֵת יְהוָה
  choice: யாவேயிடமிருந்து
  rationale: מֵאֵת என்பது மூலத்தையோ கொடுப்பவரையோ குறிக்கிறது; யְהוָה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: என்பதற்கு
  rationale: இங்கு כִּי அடையாளம் உறுதிப்படுத்தும் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கிய அமைப்பில் ‘என்பதற்கு’ அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: யாவே தாம் சொன்னதை நிறைவேற்றுவார்
  rationale: தெய்வத்தைக் குறிப்பிடும் மரியாதைப் பன்மையுடன், ‘சொன்னதை நிறைவேற்றுவார்’ என்பது செயலும் முன்பு உரைக்கப்பட்ட வாக்கும் இடையிலான உறவை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: הָלַךְ הַצֵּל
  choice: நிழல் ... முன்னே செல்ல வேண்டுமா
  rationale: வடிவில் perfect ஆக இருந்தாலும், இரண்டு மாற்று அடையாளங்களை முன்வைக்கும் வினாவில் எதிர்பார்க்கப்படும் இயக்கத்தை இது குறிக்கிறது. ‘முன்னே செல்ல’ என்பது யָשׁוּב என்பதுடனான எதிர்மறை இணையைப் பாதுகாக்கிறது.
- source_word: מַעֲלוֹת
  choice: படிகள்
  rationale: מַעֲלוֹת என்பதன் நேரடிப் பொருள் ஏறும் படிகள் அல்லது படிநிலைகள். நிழல் நகரும் அளவைக் குறிக்கும் இச்சூழலில் ‘படிகள்’ மூலத்துக்கு நெருக்கமாகவும் புரியத்தக்கதாகவும் உள்ளது.
- source_word: אִם
  choice: அல்லது
  rationale: இரண்டு மாற்று வாய்ப்புகளைக் கொண்ட கேள்வியில் אִם இரண்டாவது வாய்ப்பை அறிமுகப்படுத்துகிறது; தமிழில் ‘அல்லது’ இயல்பான இணைப்பு.
- source_word: יָשׁוּב
  choice: பின்னே திரும்ப வேண்டுமா
  rationale: שׁוּב என்பது திரும்புதல் அல்லது பின்னோக்கிச் செல்லுதல். நிழலின் திசைமாற்றத்தை ‘பின்னே திரும்ப’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரிடம் ஏசாயா பேசுவதால் ‘உமக்கு’ என்ற மரியாதை ஒருமை இடப்பட்டுள்ளது; கடவுளைக் குறிக்க ‘தாம்/நிறைவேற்றுவார்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மாற்றுத் தேர்வுக் கேள்வியும் ‘படிகள்/பாகைகள்’ என்ற சொற்பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
