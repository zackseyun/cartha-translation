  to: 'ஏசாயா, “யாவே தாம் சொன்ன காரியத்தைச் செய்வார் என்பதற்கு, யாவேயிடமிருந்து உமக்கான அடையாளம் இதுவே: நிழல் பத்துப் படிகள்[a] முன்னோக்கிச் செல்லட்டுமா, அல்லது பத்துப் படிகள் பின்னோக்கித் திரும்பட்டுமா?” என்றார்.'
