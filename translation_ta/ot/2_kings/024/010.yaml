- from: அக்காலத்தில் பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் பணியாளர்கள் எருசலேமுக்கு எதிராக ஏறிவந்தார்கள்[a]; நகரம் முற்றுகைக்குள் வந்தது[b].
  to: அக்காலத்தில் பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் சேவகர்கள் எருசலேமுக்கு எதிராக ஏறிவந்தார்கள்[a]; நகரம் முற்றுகைக்குள் வந்தது[b].
