source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: ta
  text: அக்காலத்தில் பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் சேவகர்கள் எருசலேமுக்கு எதிராக ஏறிவந்தார்கள்[a]; நகரம் முற்றுகைக்குள் வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, ‘எருசலேமுக்கு ஏறிவந்தார்கள்.’ ‘ஏறிவருதல்’ என்ற எபிரெய மரபுத்தொடர் உயரமான இடத்தை நோக்கிய பயணத்தையும் இராணுவ முன்னேற்றத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நகரம் முற்றுகையிடப்பட்டது.’ எபிரெயில் இன்னும் சொல்லுக்குச் சொல்லாக, ‘நகரம் முற்றுகைக்குள் வந்தது’ என்று உள்ளது; இது முற்றுகை தொடங்கியதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: வரலாற்று நிகழ்வின் காலச் சூழலைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: עָלָה
  choice: எதிராக ஏறிவந்தார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘மேலே போதல்/வருதல்’ என்பதையும், எருசலேமை நோக்கிய இராணுவ முன்னேற்றத்தைச் சூழல் உணர்த்துவதையும் ஒருங்கே காக்கிறது.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: இவர்கள் நேபுகாத்நேச்சாரின் அதிகாரத்துக்குக் கீழ்ப்பட்ட முகவர்கள் என்பதைக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘படை’ அல்லது ‘அதிகாரிகள்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: נְבֻכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெய அரச பட்டத்தை நேரடியாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: நகரம் முற்றுகைக்குள் வந்தது
  rationale: ‘நகரம் முற்றுகைக்குள் வந்தது’ என்ற மூலத்தின் தொடக்கநிலை நுணுக்கத்தை இயல்பான தமிழில் பாதுகாக்கிறது; வெறுமனே ‘முற்றுகையிடப்பட்டது’ என்று சமப்படுத்தவில்லை.
- source_word: מָצוֹר
  choice: முற்றுகை
  rationale: நகரைச் சூழ்ந்து அடைக்கும் இராணுவ நடவடிக்கைக்கான தெளிவான, நிலையான தமிழ் இணைச்சொல்.
