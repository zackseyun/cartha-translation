translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தின் இராணுவச் சூழலும் ‘முற்றுகைக்குள் வந்தது’ என்ற தொடக்கநிலை நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன; மூலத்தைவிடக் குறிப்பான ‘படை’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
