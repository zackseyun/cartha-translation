- from: அவன் யோயாக்கீனைப் பாபிலோனுக்குச் சிறைபிடித்துக் கொண்டுபோனான். அரசனின் தாயையும்[c], அரசனின் மனைவிகளையும், அவனுடைய அரண்மனை அதிகாரிகளையும்[a], நாட்டின் செல்வாக்குமிக்கவர்களையும்[b] எருசலேமிலிருந்து பாபிலோனுக்குச் சிறைப்பட்டவர்களாகக் கொண்டுபோனான்.
  to: அவன் யோயாக்கீனைப் பாபிலோனுக்கு நாடுகடத்தினான். அரசனின் தாயையும்[c], அரசனின் மனைவிகளையும், அரசனுடைய அரண்மனை அதிகாரிகளையும்[a], நாட்டின் செல்வாக்குமிக்கவர்களையும்[b] எருசலேமிலிருந்து பாபிலோனுக்கு நாடுகடத்தி அழைத்துச் சென்றான்.
  rationale: The revision replaces prison/capture terminology with explicit exile terminology for both Hebrew deportation expressions. It preserves the source’s twofold narration of removal, all named groups, the Jerusalem-to-Babylon movement, and each lexical-alternative footnote anchor. It also clarifies that the court officials belong to the king.
