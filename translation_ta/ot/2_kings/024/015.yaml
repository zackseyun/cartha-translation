base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: ta
  text: அவன் யோயாக்கீனைப் பாபிலோனுக்கு நாடுகடத்தினான். அரசனின் தாயையும்[c], அரசனின் மனைவிகளையும், அரசனுடைய அரண்மனை அதிகாரிகளையும்[a], நாட்டின் செல்வாக்குமிக்கவர்களையும்[b] எருசலேமிலிருந்து பாபிலோனுக்கு நாடுகடத்தி அழைத்துச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனுடைய அண்ணகர்கள்.” எபிரெயச் சொல் குறிப்பாக அண்ணகர்களையோ, பொதுவாக அரசவை அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாட்டின் வலிமைமிக்கவர்கள்” அல்லது “நாட்டின் பிரபுக்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இதனை “அரசத்தாய்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மூலத்தில் சொற்சொல்லாக “அரசனின் தாய்” என்றுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: சிறைபிடித்துக் கொண்டுபோனான்
  rationale: גלה என்பதன் காரணவினை வடிவம் ஒருவரைத் தாயகத்திலிருந்து அகற்றி நாடுகடத்துவதைக் குறிக்கிறது. தமிழ் வரலாற்று நடையில் இயக்கத்தையும் சிறையிருப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּבֶלָה
  choice: பாபிலோனுக்கு
  rationale: இறுதியில் உள்ள திசைச்சுட்டும் ה, பாபிலோனை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: אֵם הַמֶּלֶךְ
  choice: அரசனின் தாய்
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லை நேரடியாகத் தக்கவைக்கிறது; முறையான அரசவைப் பட்டத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: அரசனின் மனைவிகள்
  rationale: பன்மையையும், எபிரெய உரையில் மீண்டும் வரும் ‘அரசனின்’ என்ற தொடர்பையும் தக்கவைக்கிறது.
- source_word: סָרִיסָיו
  choice: அவனுடைய அரண்மனை அதிகாரிகள்
  rationale: סָרִיסִים என்பது குறிப்பாக அண்ணகர்களையோ, பொதுவாக அரசவை அதிகாரிகளையோ குறிக்கலாம். உடல்நிலையைத் தீர்மானிக்காமல் அரசவைப் பணியை முதன்மைப்படுத்துகிறது.
- source_word: אֵילֵי הָאָרֶץ
  choice: நாட்டின் செல்வாக்குமிக்கவர்கள்
  rationale: இந்த உருவகச் சொற்றொடர் நாட்டிலுள்ள வலிமை, உயர்நிலை அல்லது செல்வாக்குடையவர்களைக் குறிக்கிறது. இயல்பான தமிழில் சமூக முக்கியத்துவத்தை வெளிப்படுத்துகிறது.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: சிறைப்பட்டவர்களாகக் கொண்டுபோனான்
  rationale: ஒருவரை நாடுகடத்தப்பட்ட சிறைக்குழுவின் பகுதியாகக் கொண்டுசெல்லும் செயலை வெளிப்படையாகக் காட்டுகிறது; முதல் வினையின் மீளுரைப்பையும் ஓரளவு தக்கவைக்கிறது.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: எருசலேமிலிருந்து பாபிலோனுக்கு
  rationale: நாடுகடத்தலின் தொடக்க இடத்தையும் இலக்கையும் தெளிவாகக் குறிக்கிறது.
