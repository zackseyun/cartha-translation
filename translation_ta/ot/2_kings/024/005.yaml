translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் இல்லாத தொடக்கக் கால அல்லது உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை. எபிரெயத்தின் வழக்கமான சொல்லாட்சிக்குரிய வினா வடிவம் ‘அல்லவா?’ எனப் பாதுகாக்கப்பட்டுள்ளது.
