base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோயாக்கீமின் மீதமுள்ள செயல்களும், அவன் செய்த அனைத்தும், யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டுள்ளன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதா அரசர்களின் ஆண்டுக் குறிப்பேடு” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயத் தலைப்பு, அரசர்கள் நூல்களில் மேற்கோள் காட்டப்படும் அரச ஆவணத்தைக் குறிக்கிறது; அது வேதாகமத்தின் நாளாகம நூல்களையே குறிக்க வேண்டும் என்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: יֶתֶר என்பது எஞ்சியவற்றையும், அரச ஆட்சிச் சுருக்கங்களில் דִּבְרֵי என்பது அரசனைக் குறித்த செயல்கள் அல்லது நிகழ்வுகளையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இவ்விரண்டையும் தெளிவாகத் தருகிறது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: அவனுடைய செயல்களின் பரந்த வரம்பை விளக்கமாகச் சுருக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: அரசர்களைப் பற்றிய சுருக்கங்களில் வரும் எபிரெய வினாவியல் அமைப்பை இயல்பான தமிழ் சொல்லாட்சியில் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: எபிரெயச் சொல்லின் எழுத்துப்பூர்வப் பதிவு என்ற பொருளை நேரடியாக வழங்குகிறது; பன்மை எழுவாயுடனும் பொருந்துகிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொல்லெழுத்தாக ‘புத்தகத்தின்மேல்’ என்றாலும், ஒரு பதிவில் உள்ளடக்கம் எழுதப்பட்டிருப்பதைத் தமிழில் இயல்பாக ‘புத்தகத்தில்’ என்கிறோம்.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகம்
  rationale: அரசர்களைப் பற்றிய காலவரிசைப் பதிவின் தலைப்பைச் சுருக்கமாகவும் மரபாகவும் தருகிறது. இது வேதாகம நாளாகம நூலே எனத் தீர்மானிக்காமல் இருக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
