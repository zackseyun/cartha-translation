base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: ta
  text: யோயாக்கீமின் ஆட்சிக்காலத்தில் பாபிலோன் அரசன் நேபுகாத்நேச்சார் வந்தான். யோயாக்கீம் மூன்று ஆண்டுகள் அவனுக்குக் கீழ்ப்பட்டவனானான்[a]. பின்னர் அவன் திரும்பி, அவனுக்கு எதிராகக் கலகம் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுக்கு அடங்கிய சிற்றரசனானான்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவனுக்கு ஊழியக்காரனானான்’ என்று உள்ளது; அரசியல் சூழலில் இது மேலரசனுக்குக் கீழ்ப்பட்ட அரசனைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திரும்பி அவனுக்கு எதிராகக் கலகம் செய்தான்.’ ‘திரும்பி’ என்பது யோயாக்கீம் தன் முந்தைய கீழ்ப்படிதலிலிருந்து விலகியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: முன்னர் குறிப்பிடப்பட்ட அரசனுடைய ஆட்சிக்காலத்தைக் குறிக்கும் எபிரெய கால மரபுத்தொடரை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: עָלָה
  choice: படையெடுத்து வந்தான்
  rationale: அடிப்படைப் பொருள் ‘மேலே வந்தான்/சென்றான்’ என்பதாக இருந்தாலும், இங்குள்ள அரசியல்-இராணுவச் சூழலில் ஒரு நாட்டுக்கு எதிராக முன்னேறி வருவதைக் குறிக்கிறது. தமிழ் வாசகருக்கு சூழலைத் தெளிவாக வழங்குகிறது; நகரைக் கைப்பற்றினான் என்று மிகைப்படுத்துவதில்லை.
- source_word: נְבֻכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: அவனுக்குப் பணியாளனானான்
  rationale: யோயாக்கீம் கீழ்ப்பட்ட நிலைக்குள் வந்த மாற்றத்தை ‘ஆனான்’ வெளிப்படுத்துகிறது. ‘அடிமை’ என்பது இச்சூழலில் தனிநபர் அடிமைத்தனத்தைத் தவறாக உணர்த்தலாம்; ‘சிற்றரசன்’ என்பது அரசியல் பொருளை மிகத் தெளிவாக விளக்கினாலும் எபிரெய உருவகத்தை நீக்கிவிடும்.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெய சொற்றொடரின் இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וַיָּשָׁב
  choice: பின்னர் ... தன் போக்கை மாற்றி
  rationale: שׁוב என்பதன் ‘திரும்புதல்/மாறுதல்’ என்ற கருத்தையும், இங்கு முந்தைய கீழ்ப்படிதலிலிருந்து மாறியதையும் இயல்பான தமிழில் காட்டுகிறது; அடுத்த வினையான கலகத்துடன் அதை முற்றிலும் ஒன்றாக்குவதில்லை.
- source_word: וַיִּמְרָד בּוֹ
  choice: அவனுக்கு எதிராகக் கலகம் செய்தான்
  rationale: மேலதிகாரியான அரசனுக்கு எதிரான அரசியல் கிளர்ச்சியைத் தெளிவாகக் குறிக்கிறது.
