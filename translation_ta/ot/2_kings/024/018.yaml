  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: ta
  text: சிதேக்கியா அரசனானபோது இருபத்தொரு வயதுடையவனாக இருந்தான்; அவன் எருசலேமில் பதினொரு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் லிப்னாவைச் சேர்ந்த எரேமியாவின் மகளான ஹமுத்தாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் “ஹமித்தாள்” என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: இருபத்தொரு வயதுடையவனாக இருந்தான்
  rationale: ‘இருபத்தொரு ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறுமுறையின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: முடிசூடிப் பதவியேற்ற காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசனாக ஆட்சி புரிந்ததைக் குறிக்கும் வினையின் நேரடிப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב முன்னொட்டின் இடப்பொருளை நேரடியாகத் தருகிறது; பரவலாக அறியப்பட்ட தமிழ் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: அரசர் வரலாற்றில் வரும் வழக்கமான அறிமுகச் சூத்திரத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: חמיטל
  choice: அமூத்தாள்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַּת יִרְמְיָהוּ
  choice: எரேமியாவின் மகளான
  rationale: பெற்றோர் உறவைக் குறிக்கும் எபிரெய மரபுவழிக் கூறை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִלִּבְנָה
  choice: லிப்னாவைச் சேர்ந்த
  rationale: מִן முன்னொட்டு குறிக்கும் ஊர் அல்லது பிறப்பிடத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
