base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: ta
  text: அவன் எருசலேமிலிருந்த அனைவரையும், எல்லா அதிகாரிகளையும், வலிமைமிக்க போர்வீரர்கள் அனைவரையும்—மொத்தம் பத்தாயிரம் பேரை—நாடுகடத்தினான்; எல்லாக் கைவினைஞர்களையும் கொல்லர்கள்[a] அனைவரையும் அவன் நாடுகடத்தினான். நாட்டின் மக்களில் மிகவும் ஏழையானவர்களைத் தவிர வேறு யாரும் மீதியாக இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலோகத் தொழிலாளர்கள்’; ‘கொல்லர்கள்’ என்று மரபாக மொழிபெயர்க்கப்படும் எபிரெயச் சொல், உலோக வேலை செய்யும் திறனாளர்களை இன்னும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: நாடுகடத்தினான்
  rationale: גלה என்பதன் ஹிஃபில் வடிவம் கட்டாயமாகத் தாய்நாட்டிலிருந்து அகற்றி அயல்நாட்டில் வாழச் செய்வதைக் குறிக்கிறது; ‘நாடுகடத்தினான்’ வரலாற்றுச் சூழலையும் வலுக்கட்டாய அகற்றத்தையும் தெளிவாகத் தருகிறது.
- source_word: כָּל יְרוּשָׁלִַם
  choice: எருசலேமிலிருந்த அனைவரையும்
  rationale: இங்கு நகரத்தின் கட்டிடங்கள் அல்ல, அதன் குடிமக்களும் தலைமைப் பிரிவினரும் குறிக்கப்படுகிறார்கள். தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் அமைய இடப்பெயரின் ஆகுபெயர் பயன்பாடு விரித்துரைக்கப்பட்டது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שׂרים என்பது இச்சூழலில் அரச குடும்பத்தினரை மட்டும் அல்லாமல் ஆட்சி நிர்வாகத் தலைவர்களையும் குறிக்கலாம்; ‘அதிகாரிகள்’ அந்தப் பரந்த பொருளைக் காக்கிறது.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இந்தச் சொற்றொடர் திறனும் வீரமும் கொண்ட போராளிகளைக் குறிக்கிறது; தேர்வு அதன் இராணுவப் பொருளையும் உயர்ந்த நடையையும் காக்கிறது.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: நாடுகடத்தப்பட்டவர்கள் பத்தாயிரம் பேர்
  rationale: גּוֹלֶה இங்கு நாடுகடத்தப்பட்ட மக்களைத் தொகுப்பாகக் குறிக்கிறது. தனி வாக்கிய அமைப்பு எண்ணிக்கையைத் தெளிவாக்குகிறது; அதேவேளை அது அருகிலுள்ள ஒரு குழுவுக்கே உரியது என்று தேவையின்றி கட்டுப்படுத்துவதில்லை.
- source_word: הֶחָרָשׁ
  choice: கைவினைஞர்கள்
  rationale: חָרָשׁ பலவகையான திறன்சார் கைவினைத் தொழிலாளர்களைக் குறிக்கக்கூடிய பொதுச்சொல்; ‘கைவினைஞர்கள்’ அதன் பரந்த பொருளை வழங்குகிறது.
- source_word: הַמַּסְגֵּר
  choice: கொல்லர்கள்
  rationale: இச்சொல்லின் துல்லியமான தொழிற்பிரிவு உறுதியல்ல; மரபான பொருளாகிய ‘கொல்லர்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, பரந்த சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא נִשְׁאַר
  choice: வேறு யாரும் மீந்திருக்கவில்லை
  rationale: நாடுகடத்தலுக்குப் பின் எவரும் அங்கே விடப்படவில்லை என்பதைக் குறிக்கும் நிஃபால் வடிவத்தின் விளைவு நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: நாட்டின் மக்களில் மிகவும் ஏழையானவர்களைத் தவிர
  rationale: דַּלַּת சமூகத்திலும் பொருளாதாரத்திலும் தாழ்ந்த அல்லது வறிய பிரிவைக் குறிக்கிறது; இங்கு உச்சநிலை வறுமையை உணர்த்தும் ‘மிகவும் ஏழையானவர்கள்’ சூழலுக்குப் பொருந்துகிறது.
