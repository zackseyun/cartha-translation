  to: அவன் எருசலேமிலிருந்த அனைவரையும், எல்லா அதிகாரிகளையும், வலிமைமிக்க போர்வீரர்கள் அனைவரையும்—மொத்தம் பத்தாயிரம் பேரை—நாடுகடத்தினான்; எல்லாக் கைவினைஞர்களையும் கொல்லர்கள்[a] அனைவரையும் அவன் நாடுகடத்தினான். நாட்டின் மக்களில் மிகவும் ஏழையானவர்களைத் தவிர வேறு யாரும் மீதியாக இருக்கவில்லை.
