  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: ta
  text: யாவேயின் கோபத்தினால் எருசலேமிலும் யூதாவிலும் இது நிகழ்ந்தது; அவர் அவர்களைத் தம் முன்னிலையிலிருந்து வெளியேற்றும்வரை[a]. சிதேக்கியா பாபிலோன் அரசனுக்கு எதிராகக் கலகம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் கோபம் எருசலேமுக்கும் யூதாவுக்கும் எதிராக இருந்தது; அவர் அவர்களைத் தம் முன்னிலையிலிருந்து வெளியேற்றும்வரை.” முதல் கூற்றின் எபிரேய மொழிநடை சுருக்கமானது; இதை இன்னும் முறையான விதமாகவும் இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான காரண விளக்கத்தை அறிமுகப்படுத்துவதால், இயல்பான நவீன தமிழில் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל אַף יְהוָה
  choice: யாவேயின் கோபத்தினால்
  rationale: עַל אַף என்பது கடவுளின் கோபத்தைக் குறிக்கும் எபிரேய மரபுத்தொடர். יְהוָה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הָיְתָה בִירוּשָׁלִַם וּבִיהוּדָה
  choice: எருசலேமிலும் யூதாவிலும் இந்நிலை ஏற்பட்டது
  rationale: வெளிப்படையான எழுவாய் இல்லாத הָיְתָה என்ற சுருக்கமான அமைப்பைத் தெளிவான தமிழில் தர ‘இந்நிலை ஏற்பட்டது’ பயன்படுத்தப்பட்டது; ב என்பதன் இடப்பொருள் ‘-இல்’ மூலம் காக்கப்பட்டது.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: அவர் அவர்களைத் ... தள்ளிவிடும்வரை அது நீடித்தது
  rationale: עַד குறிக்கும் கால எல்லையை வெளிப்படுத்துகிறது. தமிழில் வாக்கியம் இயல்பாகவும் தொடர்பு தெளிவாகவும் இருக்க ‘அது நீடித்தது’ சேர்க்கப்பட்டது; மாற்று முறையான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֵעַל פָּנָיו
  choice: தம் முன்னிலையிலிருந்து
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய முகத்திற்கு முன்பிருந்து’ என்ற மரபுத்தொடர், ஒருவரின் சந்நிதி அல்லது முன்னிலையிலிருந்து அகற்றப்படுவதைக் குறிக்கிறது.
- source_word: וַיִּמְרֹד
  choice: கலகம் செய்தான்
  rationale: מרד என்பது ஆட்சியாளருக்கு எதிராகக் கிளர்ச்சி அல்லது கலகம் செய்வதைக் குறிக்கிறது; இச்சூழலில் ‘கலகம் செய்தான்’ இயல்பான தமிழ்.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனுக்கு எதிராக
  rationale: מרד உடன் வரும் ב எதிர்ப்புப் பொருளைக் கொண்டதால் ‘எதிராக’ எனத் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: צִדְקִיָּהוּ
  choice: சிதேக்கியா
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
theological_decisions:
- issue: முதல் கூற்றிலுள்ள காரணம்–விளைவு தொடர்பு
  choice: யாவேயின் கோபத்தினால் எருசலேமிலும் யூதாவிலும் ஏற்பட்ட நிலை, மக்களை அவர் தம் முன்னிலையிலிருந்து அகற்றும்வரை நீடித்தது
  alternative: யாவேயின் கோபம் எருசலேமுக்கும் யூதாவுக்கும் எதிராக இருந்து, அவர் அவர்களைத் தம் முன்னிலையிலிருந்து தள்ளிவிடும் அளவுக்குச் சென்றது
  rationale: எபிரேய வாக்கிய அமைப்பு சுருக்கமாகவும் ஒன்றுக்கு மேற்பட்ட முறையில் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. முதன்மை உரை இயல்பான காரண–விளைவு தொடர்பை வழங்குகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துத் திருப்பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டத்தால் மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘இந்நிலை ஏற்பட்டது’ மற்றும் ‘அது நீடித்தது’ என்பவை சுருக்கமான எபிரேய தொடரை இயல்பான தமிழாக்கமாக்குகின்றன; அதன் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
