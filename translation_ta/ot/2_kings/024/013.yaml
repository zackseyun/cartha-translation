  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: ta
  text: அவன் அங்கிருந்து யாவேவின் ஆலயத்திலிருந்த எல்லாப் பொக்கிஷங்களையும் அரச அரண்மனையிலிருந்த பொக்கிஷங்களையும் எடுத்துச் சென்றான்[a]. இஸ்ரவேலின் அரசன் சாலொமோன் யாவேவின் பரிசுத்தகத்தில் செய்திருந்த தங்கப் பாத்திரங்கள் அனைத்தையும் யாவே சொல்லியிருந்தபடியே அவன் துண்டுகளாக வெட்டினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எடுத்துச் சென்றான்” என்பதற்கு “அங்கிருந்து வெளியே கொண்டுபோனான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: வசனத்தின் தொடக்கத்தில் “ஆலயம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லிலிருந்து இங்குள்ள சொல் வேறுபட்டது; இது ஆலயக் கட்டடத்தையோ அதன் பரிசுத்தப் பகுதியையோ சிறப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: அங்கிருந்து ... எடுத்துச் சென்றான்
  rationale: ஹிஃபில் வடிவம் பொருட்களை ஓர் இடத்திலிருந்து வெளியே அகற்றுவதைக் குறிக்கிறது; கொள்ளையாக எடுத்துச் செல்லப்பட்ட சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אוֹצְרוֹת
  choice: பொக்கிஷங்கள்
  rationale: இச்சூழலில் சேமிப்பிடங்களைவிட அவற்றிலிருந்த மதிப்புமிக்க பொருட்களே குறிக்கப்படுகின்றன.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருள் 'யாவேவின் வீடு'; தமிழில் வழிபாட்டுக் கட்டடத்தைக் குறிக்க 'ஆலயம்' இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனை
  rationale: சொல்லுக்கு நேர் வடிவம் 'அரசனின் வீடு' என்றாலும், இச்சூழலில் அரச குடியிருப்பும் அதன் கருவூலமும் குறிக்கப்படுவதால் நவீன தமிழில் 'அரச அரண்மனை' தெளிவானது.
- source_word: וַיְקַצֵּץ
  choice: துண்டுகளாக வெட்டினான்
  rationale: பியேல் வடிவம் வெட்டித் துண்டாக்கும் உடல் செயலையே வலுவாகக் குறிக்கிறது.
- source_word: כְּלֵי הַזָּהָב
  choice: தங்கப் பாத்திரங்கள்
  rationale: כְּלִי என்பது பொதுவாகப் பொருட்கள் அல்லது பாத்திரங்களைக் குறிக்கும்; ஆலயச் சூழலில் 'பாத்திரங்கள்' பொருத்தமானது.
- source_word: עָשָׂה
  choice: செய்திருந்த
  rationale: சாலொமோனின் செயல் பின்னர் நடந்த துண்டாக்குதலுக்கு முற்பட்டது என்பதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בְּהֵיכַל יְהוָה
  choice: யாவேவின் பரிசுத்தகத்தில்
  rationale: הֵיכָל என்பது முன்வரும் בֵּית என்பதிலிருந்து வேறான சொல்; ஆலயக் கட்டடத்தின் பரிசுத்த இடம் அல்லது முதன்மைக் கோவில் அமைப்பைச் சிறப்பாகச் சுட்டுவதால் அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே சொல்லியிருந்தபடியே இது நடந்தது
  rationale: முன்னர் உரைக்கப்பட்ட தெய்வீக வார்த்தை நிறைவேறியதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; 'இது நடந்தது' என்பது சூழலில் உள்ள நிறைவேற்ற உணர்வைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בֵּית יְהוָה மற்றும் הֵיכַל יְהוָה இடையிலான சொல் வேறுபாடு
  choice: ஆலயம் / பரிசுத்தகம்
  alternative: இரண்டிடங்களிலும் ஆலயம்
  rationale: ஒரே வசனத்தில் மூல எபிரெயம் பயன்படுத்தும் இரண்டு வேறு சொற்களையும் முடிந்தவரை வேறுபடுத்துகிறது; הֵיכָל இங்கு ஆலயத்தின் பிரதான பரிசுத்த அமைப்பைக் குறிக்கலாம் என்ற நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. 'அரச அரண்மனை' இயல்புக்காகத் தேர்ந்தெடுக்கப்பட்டது; 'பரிசுத்தகம்' மூலச் சொல் வேறுபாட்டைக் காக்கப் பயன்படுத்தப்பட்டது. இணைக்கப்பட்ட ஒவ்வொரு அடிக்குறிப்பு குறியீடும் முதன்மை உரையில் இடம்பெற்றுள்ளது.
