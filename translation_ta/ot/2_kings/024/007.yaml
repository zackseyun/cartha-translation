base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: ta
  text: எகிப்தின் அரசன் தன் நாட்டிலிருந்து மீண்டும் புறப்படவில்லை. ஏனெனில், எகிப்தின் ஓடை[a] முதல் யூபிரத்தீஸ் ஆறுவரை எகிப்தின் அரசனுக்குச் சொந்தமான அனைத்தையும் பாபிலோனின் அரசன் கைப்பற்றியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தின் வாடி.” இங்குள்ள எபிரெயச் சொல் பருவகாலத்தில் மட்டும் நீர் பாயும் ஓடை அல்லது அதன் படுகையைக் குறிக்கலாம்; இங்கு “ஆறு” என்பது பொருத்தம் குறைந்தது, மேலும் அது நைல் ஆற்றைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: மீண்டும் புறப்படவில்லை
  rationale: הוסיף + infinitive என்ற மரபுத்தொடர், לא மற்றும் עוד உடன் வரும்போது ஒரு செயல் இனி தொடரவில்லை என்பதைக் குறிக்கிறது. அரசியல்-இராணுவச் சூழலில் יצא என்பதிலுள்ள படையெடுத்துப் புறப்படும் உட்பொருளை மிகைப்படுத்தாமல், இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: מֵאַרְצוֹ
  choice: தன் நாட்டிலிருந்து
  rationale: அரசனையே திரும்பச் சுட்டும் உடைமைப் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எகிப்தின் அரசன் மீண்டும் புறப்படாததற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: לָקַח
  choice: கைப்பற்றியிருந்தான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; இங்குள்ள அரசியல்-பிரதேசச் சூழலில் ‘கைப்பற்றுதல்’ இயல்பானது. முந்திய செயல் பின்னர் ஏற்பட்ட நிலையை விளக்குவதால் இறந்தகால நிறைவுவினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִנַּחַל מִצְרַיִם
  choice: எகிப்தின் ஓடை முதல்
  rationale: נחל என்பது பொதுவாகப் பெரிய நிரந்தர ஆற்றைக் காட்டிலும் ஓடை அல்லது பருவகால நீரோடையைக் குறிக்கும். நைல் ஆற்றோடு குழப்பம் வராதபடி ‘ஓடை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַד נְהַר פְּרָת
  choice: யூபிரத்தீஸ் ஆறுவரை
  rationale: נהר என்பது ஆறு; פרת என்பது யூபிரத்தீஸ். நவீனத் தமிழில் இயல்பான புவியியல் பெயரமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனுக்குச் சொந்தமான அனைத்தையும்
  rationale: எகிப்திய அரசனின் கட்டுப்பாட்டிலிருந்த அனைத்தையும் குறிக்கும் எபிரெயப் பொதுமையைப் பாதுகாக்கிறது; சூழல் பிரதேசங்களைக் குறிப்பதாக இருந்தாலும், மொழிபெயர்ப்பு அதை நிலப்பகுதிகள் என்று மட்டும் குறுக்கவில்லை.
