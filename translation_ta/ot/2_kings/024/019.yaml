reference: 2 Kings 24:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: ta
  text: யோயாக்கீம் செய்த எல்லாவற்றையும் போலவே, அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: வாவ் தொடர்வினையுடன் வரும் עשה கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் தொடக்க இணைப்புச்சொல் தேவையில்லாததால், எழுவாயைத் தெளிவுபடுத்தி இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה הרע என்ற எபிரெய மரபுத்தொடர், சொற்சொல்லாக ‘அந்தத் தீமையைச் செய்தான்’ என்பதைக் காட்டிலும் ‘தீமையானதைச் செய்தான்’ என்று இயல்பாகப் பொருள்படும்.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவரின் மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரெய உருவகத்தை, இயல்பான தமிழில் ‘பார்வையில்’ எனப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த எல்லாவற்றையும் போலவே
  rationale: כֹּל என்பதன் முழுமையான ஒப்புமை வலிமையை ‘எல்லாவற்றையும்’ என்பதும், כְּ என்பதைக் ‘போலவே’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: עָשָׂה
  choice: செய்த
  rationale: யோயாக்கீமின் முந்தைய செயல்களை ஒப்புமையின் அடிப்படையாகக் காட்டும் இறந்தகால வினையெச்ச வடிவம் தமிழில் இயல்பானது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் மரபான ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது சாத்தியமான உச்சரிப்பைச் சுட்டும் நவீன தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய வசனத்தின் ஒப்புமையை முன்னிலைப்படுத்தி, இறுதியில் முதன்மைச் செயலை வைப்பது தமிழில் இயல்பான வலியுறுத்தலைத் தருகிறது.
