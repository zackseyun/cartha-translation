translation_notes:
  register: நவீனத் தரத் தமிழில், அரசர் வரலாற்றுக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசனானபோது’ என்பது அரியணையேற்ற நேரத்தையும், ‘ஆட்சிசெய்தான்’ என்பது ஆட்சியின் நீடிப்பையும் வேறுபடுத்திக் காட்டுகிறது.
