base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: ta
  text: யெகோயாக்கீன் அரசனானபோது அவனுக்குப் பதினெட்டு வயது. அவன் எருசலேமில் மூன்று மாதங்கள் ஆட்சிசெய்தான். அவனுடைய தாயின் பெயர் நெகுஷ்தா; அவள் எருசலேமைச் சேர்ந்த எல்நாத்தானின் மகள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் நேரடியாக, “எருசலேமிலிருந்து வந்த எல்நாத்தானின் மகள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: அவனுக்குப் பதினெட்டு வயது
  rationale: எபிரெய மொழியின் வயதைக் குறிக்கும் வழக்கை இயல்பான நவீன தமிழில் துல்லியமாகத் தருகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: அவன் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கும் எபிரெயக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מָלַךְ
  choice: ஆட்சிசெய்தான்
  rationale: ‘அரசனாக ஆளுதல்’ என்ற வினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: மூன்று மாதங்கள்
  rationale: ஆட்சிக்காலத்தின் நீளத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: நகரத்திற்குள் நிகழ்ந்த ஆட்சியைக் குறிக்கும் இடப்பொருளை நேரடியாகத் தருகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: வம்சத் தகவலை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: נְחֻשְׁתָּא
  choice: நெகுஷ்தா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַת אֶלְנָתָן
  choice: எல்நாத்தானின் மகள்
  rationale: தந்தை–மகள் உறவைக் குறிக்கும் இணைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִירוּשָׁלָם
  choice: எருசலேமைச் சேர்ந்த
  rationale: மூலம் அல்லது ஊர்ச்சார்பைக் குறிக்கும் מִן என்பதற்கு இச்சூழலில் இயல்பான தமிழ்ச் சமமான சொற்றொடர்; இதை ‘எருசலேமிலிருந்து வந்த’ என்றும் மிக நேரடியாக மொழிபெயர்க்கலாம்.
