translation_notes:
  register: நவீன பொதுத்தமிழில், dignified வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியலை வாசிக்க எளிதாக்க இடைக்கோடுகளும் இரண்டு வாக்கியங்களும் பயன்படுத்தப்பட்டுள்ளன. ‘பாபிலோன் அரசன்’ என்பது இயல்பான தமிழ்ச் சொல் வரிசைக்காக வினைக்கு முன் வைக்கப்பட்டுள்ளது; மூலத்தின் அனைத்து குழுக்களும் எண்ணிக்கைகளும் பாதுகாக்கப்பட்டுள்ளன.
