  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: ta
  text: வலிமைமிக்க ஆண்கள் அனைவரையும்—ஏழாயிரம் பேரை—கைவினைஞர்களையும் உலோகத் தொழிலாளர்களையும்[a]—ஆயிரம் பேரை—அதாவது, போரிடத் தகுதியுள்ள வலிமைமிக்க வீரர்களான அவர்கள் அனைவரையும்,[b] பாபிலோன் அரசன் பாபிலோனுக்கு நாடுகடத்திக் கொண்டுபோனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லர்களையும்.”
    reason: הַמַּסְגֵּר என்ற தொழிற்பெயர் உலோக வேலைசெய்பவர்களைப் பொதுவாகவோ, குறிப்பாகக் கொல்லர்களையோ குறிக்கலாம்.
  - marker: b
    text: சொல்லர்த்தமாக, “போர் செய்பவர்கள்.”
    reason: עֹשֵׂי מִלְחָמָה என்ற எபிரெயச் சொற்றொடர் நேரடியாகப் போர் செய்பவர்களைக் குறிக்கிறது; இச்சூழலில் போரிடும் திறன் அல்லது இராணுவப் பயன்பாட்டுக்கான தகுதி உடையவர்கள் என்ற பொருளில் உள்ளது.
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: வலிமைமிக்க ஆண்கள்
  rationale: இந்தச் சொற்றொடர் வலிமையும் இராணுவப் பயன்பாட்டுக்கான திறனும் கொண்ட ஆண்களைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் ஆண்பால் குறிப்பைப் பேணியும் உள்ளது.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ஏழாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களைக் கணக்கிடும் இயல்பான தமிழ்ச் சொல்லாக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הֶחָרָשׁ
  choice: கைவினைஞர்கள்
  rationale: மரம், கல், உலோகம் முதலியவற்றில் திறமையுடன் வேலைசெய்யும் பலவகைத் தொழிலாளர்களைக் குறிக்கக்கூடிய பரந்த சொல்.
- source_word: הַמַּסְגֵּר
  choice: உலோகத் தொழிலாளர்கள்
  rationale: சொல்லின் துல்லியமான தொழிற்பிரிவு உறுதியற்றது; ‘உலோகத் தொழிலாளர்கள்’ என்பது கொல்லர்கள் என்பதையும் உள்ளடக்கும் இயல்பான, மிகக் குறுகாத மொழிபெயர்ப்பு.
- source_word: אֶלֶף
  choice: ஆயிரம் பேர்
  rationale: கைவினைஞர்களும் உலோகத் தொழிலாளர்களும் சேர்ந்த குழுவின் எண்ணிக்கையைத் தெளிவாகத் தருகிறது.
- source_word: הַכֹּל
  choice: அவர்கள் அனைவரும்
  rationale: முன்னர் குறிப்பிடப்பட்ட நாடுகடத்தப்பட்ட குழுக்களைத் தொகுத்துச் சுட்டுகிறது.
- source_word: גִּבּוֹרִים
  choice: வலிமைமிக்கவர்கள்
  rationale: உடல் அல்லது போர்த் திறன் கொண்ட வலியவர்களைக் குறிக்கும் மூலச்சொல்லின் பொருளைப் பேணுகிறது.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: போரிடத் தகுதியுள்ளவர்கள்
  rationale: சொல்லர்த்தமாக ‘போர் செய்பவர்கள்’; இச்சூழலில் இராணுவச் சேவைக்குத் திறனுள்ளவர்கள் என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְבִיאֵם ... גּוֹלָה
  choice: அவர்களைச் சிறைபிடித்துக் கொண்டுபோனான்
  rationale: ‘அவர்களை ... நாடுகடத்தப்பட்ட நிலையில் கொண்டுவந்தான்’ என்ற எபிரெயக் கருத்தை இயல்பான தமிழில், கட்டாய இடமாற்றத்தின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָּבֶלָה
  choice: பாபிலோனுக்கு
  rationale: திசையைக் குறிக்கும் எபிரெய இறுதியை இலக்கான இடத்தைக் குறிக்கும் தமிழ் நான்காம் வேற்றுமையால் தருகிறது.
