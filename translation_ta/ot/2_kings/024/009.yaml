- from: அவன் தன் தந்தை செய்த எல்லாவற்றையும் பின்பற்றி, யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.
  to: அவன் தன் தந்தை செய்த அனைத்தையும் போலவே, யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.
  rationale: The revision replaces the interpretive participle “பின்பற்றி” with a direct comparative expression, preserving the comprehensive force of כְּכֹל and the Hebrew syntax more closely. No footnote is needed.
