reference: 2 Kings 24:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: ta
  text: அவன் தன் தந்தை செய்த அனைத்தையும் போலவே, யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் எளிய இறந்தகால வினையாக உள்ளது. தமிழில் தனி வசனமாக இயல்பாக அமைய, தொடக்க ו தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: வரையறைச் சுட்டியுடன் வந்த பெயரடை இங்கு பெயர்ச்சொல் போலச் செயல்பட்டு, ஒழுக்கரீதியாகத் தீமையான செயலைக் குறிக்கிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவரின் மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, தமிழில் இயல்பாகவும் அதன் உருவகத்தைக் காக்கும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: செய்த எல்லாவற்றையும் பின்பற்றி
  rationale: כְּכֹל குறிக்கும் முழுமையான ஒப்புமையைத் தக்கவைத்தபடி, தமிழில் இயல்பாகப் புரியும் செயல்வடிவில் தரப்பட்டுள்ளது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டுகிறது; எழுவாயையே சுட்டுவதால் ‘தன்’ இயல்பான தமிழ் வடிவமாகும்.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, கடவுளுடைய தனிப்பெயரே இடம்பெறுகிறது. ஆகவே அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அரசர் நூல்களின் மதிப்பீட்டு நடையின் கண்ணியத்தைப் பேணும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘எல்லாவற்றையும் பின்பற்றி’ என்பது தந்தையின் செயல்களோடு உள்ள முழுமையான ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
