source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב יְהוֹיָקִ֖ים עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: ta
  text: யோயாக்கீம் தன் முன்னோர்களோடு நித்திரையடைந்தான்[a]. அவனுடைய மகன் யோயாக்கீன் அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள் விளக்கமாக, ‘இறந்தான்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘தன் முன்னோர்களோடு நித்திரையடைந்தான்’; இது ஓர் அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: நித்திரையடைந்தான்
  rationale: ‘தன் முன்னோர்களோடு’ என்பதுடன் வரும் שׁכב அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். ‘இறந்தான்’ என்று பொருளை மட்டும் வெளிப்படுத்தாமல், மூலத்தின் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אָבוֹת என்பது இங்கு உடனடியான தந்தையரை மட்டுமல்ல, முந்திய தலைமுறையினரைக் குறிக்கிறது. நவீனத் தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இவ்வினை இங்கு ஆட்சிக்காலத்தின் நீளத்தை அல்ல, அரியணை ஏறிய நிகழ்வைக் குறிக்கிறது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: நேரடியான மகன் உறவைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியில் ஒருவரின் இடத்தை மற்றவர் ஏற்றதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: யோயாக்கீம் / யோயாக்கீன்
  rationale: எபிரெயப் பெயர்களின் ஒலியை நவீனத் தமிழ் எழுத்துப்பெயர்ப்பு மரபில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: அரசரின் மரணத்தைக் குறிக்கும் மரபுச் சொற்றொடரை அடக்க விவரமாக விரிவுபடுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘தன் முன்னோர்களோடு நித்திரையடைந்தான்’ என்ற எபிரெய உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: ‘இறந்தான்’ அல்லது ‘இறந்து தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டான்’
  rationale: இவ்வசனம் மரணத்தைக் குறிக்கும் மரபுச் சொற்றொடரைப் பயன்படுத்துகிறது; ஆனால் அடக்கம் செய்யப்பட்டதை வெளிப்படையாகக் கூறவில்லை. உருவகத்தைத் தக்கவைப்பது மூல மொழியின் வடிவத்தைப் பாதுகாப்பதோடு, வசனத்தில் இல்லாத அடக்க விவரத்தையும் சேர்க்காமல் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மதிப்புமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘பிதாக்கள்’ என்பதற்குப் பதிலாக இச்சூழலில் பொருத்தமான ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது; மரண உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
