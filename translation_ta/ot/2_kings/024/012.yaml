  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: ta
  text: அப்போது யூதாவின் அரசன் யோயாக்கீன், தன் தாய், பணியாளர்கள், அதிகாரிகள், அரண்மனை அலுவலர்கள்[a] ஆகியோருடன் பாபிலோன் அரசனிடம் வெளியே சென்றான். பாபிலோன் அரசன் தன் ஆட்சியின் எட்டாம் ஆண்டில் அவனைத் தன் வசம் கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய அண்ணகர்கள்.” இதற்கான எபிரெயச் சொல் உடல் ரீதியாக ஆண்மை நீக்கப்பட்டவர்களையோ, பொதுவாக அரசவை அலுவலர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்றான்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே செல்’ என்பதைக் காக்கிறது. முற்றுகைச் சூழலில் இது சரணடைவதை உட்குறிக்கலாம்; ஆனால் ‘சரணடைந்தான்’ என்று வெளிப்படையாக மொழிபெயர்த்து மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனிடம்
  rationale: இச்சூழலில் על என்பது யோயாக்கீன் சென்றடைந்த நபரைச் சுட்டுகிறது. ‘அரசனிடம்’ என்பது நவீனத் தமிழில் இயல்பாகவும் திசைநோக்கைத் தெளிவாகவும் தருகிறது.
- source_word: הוּא וְאִמּוֹ
  choice: தன் தாய் ... ஆகியோருடன்
  rationale: எபிரெயத்தில் எழுவாய் மீண்டும் சுட்டப்பட்டு உடன் சென்றவர்கள் பட்டியலிடப்படுகிறார்கள். தமிழில் இயல்பான உடனிகழ்ச்சிக் கட்டமைப்பாக மாற்றப்பட்டுள்ளது.
- source_word: עֲבָדָיו
  choice: பணியாளர்கள்
  rationale: עבד என்பது பணியாளர், ஊழியர் அல்லது அரசவையைச் சேர்ந்த சேவகர் எனப் பொருள்படலாம். ‘பணியாளர்கள்’ இங்கு பரந்ததும் இயல்பானதும் ஆகும்.
- source_word: שָׂרָיו
  choice: அதிகாரிகள்
  rationale: שׂרים என்பது உயர்நிலைத் தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது. அரசவைச் சூழலில் ‘அதிகாரிகள்’ தெளிவான நவீனச் சொல்.
- source_word: סָרִיסָיו
  choice: அரண்மனை அலுவலர்கள்
  rationale: סָרִיס என்பது உடல் ரீதியாக ஆண்மை நீக்கப்பட்டோரையோ, விரிந்த பொருளில் அரசவை அலுவலர்களையோ குறிக்கலாம். பிரதான உரை பதவிசார் பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקַּח אֹתוֹ
  choice: அவனைத் தன் வசம் கொண்டான்
  rationale: לקח என்பதன் பொதுவான ‘எடுத்துக்கொள்/கொண்டுபோ’ என்ற பொருளையும், இச்சூழலில் காவல் அல்லது கட்டுப்பாட்டுக்குள் கொண்டுவரப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சிறைப்பிடித்தான்’ என்று மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: தன் ஆட்சியின் எட்டாம் ஆண்டில்
  rationale: அண்மைய ஒருமை ஆண்பால் எழுவாயான பாபிலோன் அரசனையே பின்னொட்டு இயல்பாகக் குறிக்கிறது. ‘ஆட்சியின் எட்டாம் ஆண்டு’ என்பது காலக்குறிப்புக்கான வழக்கமான தமிழ் நடை.
theological_decisions:
- issue: இறுதிக் காலக்குறிப்பிலுள்ள ‘அவனுடைய ஆட்சி’ யாரைக் குறிக்கிறது?
  choice: பாபிலோன் அரசனின் ஆட்சி
  alternative: யோயாக்கீனின் ஆட்சி
  rationale: உடனடியான இலக்கண முன்னிலை பாபிலோன் அரசன்; இவ்வதிகாரத்தின் வரலாற்றுக் காலக்கணக்கும் நேபுகாத்நேச்சாரின் எட்டாம் ஆட்சியாண்டுடன் பொருந்துகிறது. தமிழில் ‘தன்’ என்பது வாக்கியத்தின் எழுவாயான பாபிலோன் அரசனைத் தெளிவாகச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெளியே சென்றான்’ மற்றும் ‘தன் வசம் கொண்டான்’ என்பவை மூலத்தின் சொல்லளவுப் பொதுமையைப் பாதுகாத்து, சரணடைதல் அல்லது சிறைப்பிடித்தல் என்ற சூழல்சார் முடிவுகளை உரைக்குள் கட்டாயப்படுத்தாமல் விடுகின்றன.
