base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: ta
  text: 'உறுதியாகவே, யாவேயின் கட்டளைப்படியே இது யூதாவில் நிகழ்ந்தது: மனாசே செய்த அனைத்திற்கும் ஏற்ப அவனுடைய பாவங்களின் காரணமாக, அவர்களைத் தமது திருமுகத்தின் முன்னிலையிலிருந்து அகற்றுவதற்காகவே.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: உறுதியாகவே
  rationale: இங்கு இந்தச் சொல் கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட, முன் கூறப்பட்ட நியாயத்தீர்ப்புக்கான காரணத்தை வலியுறுத்தும் உறுதிப்பாட்டைக் காட்டுகிறது.
- source_word: עַל־פִּי יְהוָה
  choice: யெகோவாவின் கட்டளைப்படி
  rationale: ‘வாயின்படி’ என்ற எபிரெய மொழிமரபு ஒருவருடைய கட்டளை அல்லது சொல்லுக்கு ஏற்ப நிகழ்வதைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָיְתָה בִּיהוּדָה
  choice: இது யூதாவுக்கு நேரிட்டது
  rationale: பெண்பால் வினையின் எழுவாய் எபிரெயத்தில் வெளிப்படையாக இல்லை; சூழலில் முன் விவரிக்கப்பட்ட நியாயத்தீர்ப்பே குறிக்கப்படுகிறது. ‘இது’ அந்த மறைபொருளை அளவுடன் வெளிப்படுத்துகிறது.
- source_word: לְהָסִיר
  choice: அகற்றுவதற்காக
  rationale: סור என்பதன் ஹிபீல் வடிவம் இங்கு ஒருவரை விலக்கி அகற்றும் காரணவினைப் பொருளைக் கொண்டுள்ளது.
- source_word: מֵעַל פָּנָיו
  choice: தமது திருமுகத்திற்கு முன்பிருந்து
  rationale: மூலத்தின் ‘அவருடைய முகத்திற்கு முன்பிருந்து’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இறைவனை மரியாதையுடன் சுட்டும் நவீனத் தமிழில் ‘திருமுகம்’ பொருத்தமானது.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: மனாசே செய்த பாவங்களின் காரணமாக
  rationale: בְּ காரணத்தைக் குறிக்கிறது; חַטֹּאת ஒருமை/கூட்டுப்பொருள் நுணுக்கமுடைய வடிவமாக இருந்தாலும், தொடரும் ‘அவன் செய்த அனைத்தும்’ பல குற்றச்செயல்களைச் சுட்டுவதால் பன்மை தமிழில் இயல்பாகிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: மனாசே செய்த அனைத்திற்கும் ஏற்ப
  rationale: כְּכֹל உள்ள ஒப்புமை அல்லது அளவுக்கேற்ப என்ற உறவைப் பாதுகாக்கிறது; ‘அவன்’ என்பதற்குப் பதில் பெயரை மீண்டும் கூறுவது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பைக் குறிக்கும் நீள்விடுபட்ட வாக்கியத்தின் மறை எழுவாயும் செயப்படுபொருளும்
  choice: முன் சூழலில் கூறப்பட்ட நியாயத்தீர்ப்பு யூதாவுக்கு நேரிட்டது என்றும், அகற்றப்பட்டவர்கள் யூதாவின் மக்களே என்றும் ‘இது’, ‘அவர்களை’ மூலம் வெளிப்படுத்தப்பட்டது.
  alternative: மறை எழுவாயையும் செயப்படுபொருளையும் நிரப்பாமல், ‘யூதாவில் இருந்தது ... அகற்றுவதற்காக’ என்று மிகச் சொற்படியாக மொழிபெயர்த்தல்.
  rationale: எபிரெயம் இரண்டையும் வெளிப்படையாகக் கூறாவிட்டாலும், சூழல் அவற்றைத் தெளிவாக்குகிறது. தமிழ் வாக்கியத் தெளிவுக்குத் தேவையான அளவு மட்டுமே நிரப்பப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
- issue: இறைமுகம்/இறைசந்நிதி பற்றிய உருவகம்
  choice: ‘தமது திருமுகத்திற்கு முன்பிருந்து’ என்று மூலத்தின் முக உருவகம் பிரதான உரையில் தக்கவைக்கப்பட்டது.
  alternative: ‘தமது சந்நிதியிலிருந்து’ அல்லது ‘தமது முன்னிலையிலிருந்து’.
  rationale: மூலத்தின் உடலுறுப்பு சார்ந்த உருவகத்தை அழிக்காமல், அதில் உள்ள இறை முன்னிலையிலிருந்து வெளியேற்றப்படுதல் என்ற வலிமையைப் பாதுகாக்கிறது. இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பான, ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை. ‘யெகோவா’ என்பது தெய்வீகப் பெயரை பெயராகவே வழங்குகிறது. ‘தமது’ மற்றும் ‘திருமுகம்’ மரியாதையைக் காக்கின்றன; எபிரெய மூலத்தின் உறுதியுரை, காரணம், நோக்கம், ஒப்புமை ஆகிய தொடர்புகள் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
