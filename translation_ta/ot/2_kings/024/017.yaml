  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: ta
  text: பாபிலோன் அரசன், அவனுக்குப் பதிலாக அவனுடைய மாமனான மத்தனியாவை அரசனாக்கி, அவனுடைய பெயரைச் சிதேக்கியா என்று மாற்றினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: அரசனாக்கி
  rationale: மָלַךְ என்பதன் ஹிபீல் வடிவம் இங்கு காரணவினைப் பொருளில் வந்து, பாபிலோன் அரசன் மத்தனியாவை ஆட்சியில் அமர்த்தியதைக் குறிக்கிறது.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெயக் கட்டிணைத் தொடரின் இயல்பான, தெளிவான தமிழ் வடிவம்.
- source_word: מַתַּנְיָה
  choice: மத்தனியா
  rationale: ஆள்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் தரப்படுகிறது.
- source_word: דֹדוֹ
  choice: அவனுடைய சிற்றப்பன்
  rationale: இச்சூழலில் மத்தனியா யோயாக்கீனின் தந்தையின் சகோதரர்; நவீன தமிழில் அந்த உறவைத் துல்லியமாகச் சொல்லும் சொல் ‘சிற்றப்பன்’.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரியணைச் சூழலில் תחת மாற்றீடு அல்லது பதிலாக அமர்வதைக் குறிக்கிறது.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: அவனுடைய பெயரை ... என்று மாற்றினான்
  rationale: ‘பெயர்’ என்பதுடன் סבב வரும்போது பெயரை மாற்றுதல் என்ற இடைமொழிப் பொருள் தருகிறது.
- source_word: צִדְקִיָּהוּ
  choice: சிதேக்கியா
  rationale: ஆள்பெயர் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை. காரணவினைப் பொருள் ‘அரசனாக்கி’ என்பதில் நேரடியாகப் பாதுகாக்கப்பட்டதால் அடிக்குறிப்பு தேவையில்லை.
