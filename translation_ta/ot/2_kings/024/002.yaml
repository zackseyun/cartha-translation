  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: ta
  text: யாவே யோயாக்கீமுக்கு எதிராகக் கல்தேயரின் படையணிகளையும்,[a] அராமின்[b] படையணிகளையும், மோவாபின் படையணிகளையும், அம்மோனியரின் படையணிகளையும் அனுப்பினார். யூதாவை அழிப்பதற்காக[c] அவர்களை யூதாவுக்கு எதிராக அனுப்பினார்; தம் ஊழியர்களான தீர்க்கதரிசிகள் மூலம் யாவே உரைத்திருந்த வார்த்தையின்படியே அவர் இவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படையணிகள்’ என்பதை ‘கொள்ளையிடும் படையணிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அராம்’; பாரம்பரியமாக ‘சீரியா’ என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவனை அழிப்பதற்காக’; இது யூதாவுக்குப் பதிலாக யோயாக்கீமைக் குறிப்பதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பினார்
  rationale: கதைநடையில் שלח என்பதன் இயல்பான பொருளைத் தருகிறது; யாவேயே இந்தத் தாக்குதலை நிகழச் செய்தவர் என்பதையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בּוֹ
  choice: யோயாக்கீமுக்கு எதிராக
  rationale: பகைமைச் சூழலில் בְּ என்பது எதிராகச் செலுத்தப்பட்ட நடவடிக்கையைக் குறிக்கிறது; முந்தைய வசனத்திலுள்ள யோயாக்கீமைத் தெளிவாகச் சுட்டுகிறது.
- source_word: גְּדוּדֵי
  choice: படையணிகள்
  rationale: முழு தேசியப் படைகளைக் காட்டிலும் தனித்தனியாகச் செயல்படும் ஆயுதக் குழுக்களைக் குறிக்கும் இயல்பான தமிழ் சொல்; கொள்ளையிடும் படையணிகள் என்ற குறிப்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַשְׂדִּים
  choice: கல்தேயர்
  rationale: பாபிலோனியர் என்று பொதுமைப்படுத்தாமல் எபிரெய உரையின் குறிப்பான இனப்பெயரைத் தக்கவைக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பாரம்பரியமான ‘சீரியா’ என்பதற்குப் பதிலாக எபிரெயப் பெயரை நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட அந்த மக்களினத்தைக் குறிக்கும் இயல்பான தமிழ்ப் பெயர்.
- source_word: וַיְשַׁלְּחֵם
  choice: அவர்களை ... அனுப்பினார்
  rationale: எபிரெய உரையில் வினைச்சொல் மீண்டும் வருவதைத் தக்கவைத்து, அனுப்பப்பட்ட குழுக்களையும் அவர்களின் இலக்கையும் இணைக்கிறது.
- source_word: בִּיהוּדָה
  choice: யூதாவுக்கு எதிராக
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டு இங்குள்ள பகைமைமிக்க இராணுவச் சூழலில் தாக்குதலின் இலக்கை உணர்த்துகிறது.
- source_word: לְהַאֲבִידוֹ
  choice: யூதாவை அழிப்பதற்காக
  rationale: உடனடியாக முன்வரும் யூதாவையும் விரிந்த நியாயத்தீர்ப்புச் சூழலையும் முதன்மைச் சுட்டாக ஏற்கிறது; யோயாக்கீமைக் குறிக்கக்கூடிய இலக்கண வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே உரைத்திருந்த வார்த்தையின்படியே
  rationale: தீர்க்கதரிசன வார்த்தைக்கும் நிகழ்வுக்கும் உள்ள நேரடி ஒத்திசைவை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: தம் ஊழியர்களான தீர்க்கதரிசிகள் மூலம்
  rationale: ‘கையால்’ என்ற எபிரெயக் கருவிப்பொருளை தமிழில் இயல்பான ‘மூலம்’ என வழங்கி, தீர்க்கதரிசிகள் யாவேயின் ஊழியர்கள் என்பதைக் காக்கிறது.
theological_decisions:
- issue: לְהַאֲבִידוֹ என்பதிலுள்ள ஒருமை ஆண்பால் பின்னொட்டின் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் யூதாவைச் சுட்டுவதாக ‘யூதாவை அழிப்பதற்காக’ என மொழிபெயர்க்கப்பட்டது.
  alternative: அது யோயாக்கீமைச் சுட்டி, ‘அவனை அழிப்பதற்காக’ என்றும் பொருள்படலாம்.
  rationale: வினையெச்சத்திற்கு உடனடியாக முன் யூதா குறிப்பிடப்படுவதும், சுற்றியுள்ள பகுதி யூதாவின்மேல் வரும் தீர்ப்பை வலியுறுத்துவதும் முதன்மைத் தேர்வை ஆதரிக்கின்றன. எனினும் எபிரெய ஒருமை ஆண்பால் பின்னொட்டு யோயாக்கீமையும் இலக்கணப்படி சுட்டக்கூடும்; ஆகவே அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. இனப்பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. முதன்மை உரையின் இரு வாக்கிய அமைப்பு நீண்ட எபிரெய வாக்கியத்தை வாசிப்புக்கு ஏற்றவாறு பிரிக்கிறது; அதேவேளை ‘அனுப்பினார்’ என்ற மறுபடியும் வரும் வினைச்சொல் காக்கப்பட்டுள்ளது.
