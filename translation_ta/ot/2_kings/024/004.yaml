  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: ta
  text: மேலும், அவன் சிந்திய குற்றமற்ற இரத்தத்தினாலும்[a], அவன் எருசலேமை குற்றமற்ற இரத்தத்தால் நிரப்பியதாலும், யெகோவா மன்னிக்க விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் சிந்திய குற்றமற்றவர்களின் இரத்தத்தினாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: -னிமித்தமும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நியாயத்தீர்ப்புக்கான காரணங்களுடன் இதையும் கூடுதல் காரணமாக இணைக்கிறது; தமிழில் பின்னுருபுடன் வரும் ‘-உம்’ அதன் சேர்க்கைப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: דַּם הַנָּקִי
  choice: குற்றமற்றவர்களின் இரத்தம்
  rationale: அநியாயமாகக் கொல்லப்பட்ட குற்றமற்ற மக்களின் இரத்தத்தையும் அதனால் உண்டான இரத்தப்பழியையும் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: அவன் சிந்திய
  rationale: இரத்தத்துடன் שׁפך பயன்படுத்தப்படும்போது ‘இரத்தம் சிந்துதல்’ என்ற நிலையான பொருள் வருகிறது.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: எருசலேமை அவன் குற்றமற்றவர்களின் இரத்தத்தால் நிரப்பியிருந்தான்
  rationale: ‘எருசலேமை குற்றமற்ற இரத்தத்தால் நிரப்பினான்’ என்ற எபிரெய உருவகத்தையும், முந்தைய செயலை விளக்கும் சூழலையும் பாதுகாக்கிறது.
- source_word: וְלֹא אָבָה
  choice: விரும்பவில்லை
  rationale: אָבָה என்பதன் விருப்பம் அல்லது மனமிரங்கிச் சம்மதித்தல் சார்ந்த பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: לִסְלֹחַ
  choice: மன்னிக்க
  rationale: தெய்வீக மன்னிப்பைக் குறிக்கும் סלח என்பதற்கான தெளிவான, பொதுவான நவீன தமிழ்ச் சொல்.
theological_decisions:
- issue: மனாசேயின் இரத்தப்பழியின் சூழலில் கடவுள் மன்னிக்க மறுத்தல்
  choice: குற்றமற்றவர்களின் இரத்தம் எருசலேமை நிரப்பியதால், அந்தக் கட்டத்தில் யெகோவா மன்னிக்க விரும்பவில்லை என்று வசனம் கூறுகிறது.
  alternative: யெகோவா யூதாவை மன்னிக்கவே மாட்டார் என்ற பொதுவான, காலவரையற்ற கூற்றாக இதை விரிவுபடுத்துதல்.
  rationale: எபிரெய உரை மன்னிக்க விரும்பாததை நேரடியாகக் கூறி, அதைச் சேர்ந்துகுவிந்த இரத்தப்பழி மற்றும் வரவிருக்கும் நியாயத்தீர்ப்புடன் இணைக்கிறது. அதன் தீவிரத்தையும் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமலும், வசனத்திற்கு அப்பால் விரிவுபடுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட காரணத் தொடரைத் தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய உரையின் சேர்க்கை, இரத்தம் சிந்துதல் என்ற உருவகம், மற்றும் மன்னிக்க விரும்பாததாகக் கூறும் இறையியல் தீவிரம் பாதுகாக்கப்பட்டுள்ளன.
