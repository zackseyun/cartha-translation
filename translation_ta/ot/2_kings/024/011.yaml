base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: ta
  text: பாபிலோன் அரசன் நேபுகாத்நேச்சார் நகருக்கு எதிராக வந்தான்; அப்போது அவனுடைய பணியாளர்கள் அதை முற்றுகையிட்டுக்கொண்டிருந்தார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை முற்றுகை போட்டுக்கொண்டிருந்தார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய பணியாளர்கள்’ என்பது பாபிலோன் அரசனின் அதிகாரிகள், முகவர்கள் அல்லது அரசுப் பணியிலிருந்த படையினரைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பதன் வழக்கமான கதைநடைப் பொருள் ‘வந்தான்’. עַל மற்றும் முற்றுகைச் சூழல் காரணமாக எதிர்த்துவரும் இராணுவ நகர்வு அடுத்த சொற்றொடரில் வெளிப்படுத்தப்படுகிறது.
- source_word: נְבוּכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவத்துக்கு நெருக்கமான, மூலப் பெயரை அடையாளம் காண உதவும் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: அரசுப் பதவியையும் ஆட்சிப்பகுதியையும் இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: עַל הָעִיר
  choice: நகருக்கு எதிராக
  rationale: முற்றுகைச் சூழலில் עַל நடுநிலையான ‘நகருக்கு’ என்பதைக் காட்டிலும் பகைமை நோக்கிய நகர்வைக் குறிக்கிறது.
- source_word: וַעֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עבדים என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அரசச் சூழலில் இது அதிகாரிகள், முகவர்கள் அல்லது அரசுப் படையினரைக் குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: צָרִים
  choice: முற்றுகையிட்டுக்கொண்டிருந்தார்கள்
  rationale: צור என்பதன் பன்மைப் பங்கேற்புவினை இங்கு தொடர்ந்து நடந்துகொண்டிருந்த முற்றுகை நடவடிக்கையைக் குறிக்கிறது; நேபுகாத்நேச்சாரின் வருகையுடன் ஒரே நேரத்தில் நடந்த செயல் இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: עָלֶיהָ
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் ‘நகரை’ச் சுட்டுகிறது. ‘முற்றுகையிடு’ என்பதற்குப் பின் தமிழில் நேரடி செயப்படுபொருளான ‘அதை’ இயல்பாக அமைகிறது.
