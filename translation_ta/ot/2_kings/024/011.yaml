translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமான கதைநடையுடனும் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் இராணுவச் சூழலும், עבדיו என்பதன் பரந்த குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
