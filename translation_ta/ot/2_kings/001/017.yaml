base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: ta
  text: அவன் இறந்தான்; எலியா சொன்ன யாவேயின் வார்த்தையின்படியே இறந்தான். யூதாவின் அரசனான யோசபாத்தின் மகன் யோராமின் இரண்டாம் ஆண்டில், யோராம் அவனுக்குப் பதிலாக அரசனானான்; ஏனெனில் அவனுக்கு மகன் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோராம் அவனுக்குப் பதிலாக ஆட்சி செய்தான்.” எபிரெய வினைச்சொல் “ஆட்சி செய்தான்” என்றும் மொழிபெயர்க்கப்படலாம்; இச்சூழலில் ஆட்சிப் பொறுப்பேற்ற நிகழ்வைத் தெளிவுபடுத்த “அரசனானான்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: ஆகவே ... அவன் இறந்தான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடர்வினை அடுத்த நிகழ்வை முன்னெடுக்கிறது; முந்தைய தீர்க்கவாக்கின் நிறைவேற்றத் தொடர்பை இயல்பான தமிழில் காட்ட ‘ஆகவே’ பொருத்தமானது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படியே
  rationale: כִּדְבַר என்பது சொல்லப்பட்ட வார்த்தைக்கு ஏற்ப நிகழ்ந்ததைச் சுட்டுகிறது; ‘-இன்படியே’ அந்த ஒத்திசைவையும் வலியுறுத்தலையும் தெளிவாகத் தருகிறது.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: எலியா சொன்ன
  rationale: உறவுத்தொடர் முன் குறிப்பிடப்பட்ட யாவேயின் வார்த்தையைச் சுட்டுகிறது. ‘எலியா மூலமாக’ என்பது இலக்கணத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: யோராம் அவனுக்குப் பதிலாக அரசனானான்
  rationale: இங்கு מלך அரியணையேற்றத்தைச் சுட்டுகிறது; ‘அரசனானான்’ இயல்பான தமிழில் அதைத் தெளிவாக்குகிறது. תַּחְתָּיו என்பதற்கு ‘அவனுக்குப் பதிலாக’ நேர்த்தியான இணை.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: யோராமுடைய இரண்டாம் ஆண்டில்
  rationale: இது அரசாட்சிக் காலக்கணிப்பைக் குறிக்கும் கட்டமைப்பு; தமிழில் ‘இரண்டாம் ஆண்டில்’ என்பது தெளிவான வழக்கு.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான யோசபாத்தின் மகன்
  rationale: இந்த அடையாளத் தொடர் யூதாவின் யோராமையும் இஸ்ரவேலின் யோராமையும் வேறுபடுத்துகிறது. சொற்களின் உறவைத் தெளிவுபடுத்த இயல்பான தமிழ் வரிசை பயன்படுத்தப்பட்டது.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: அவனுக்கு மகன் இல்லாததால்
  rationale: כִּי இங்கு மகனுக்குப் பதிலாக வேறொருவர் ஆட்சிக்கு வந்த காரணத்தைத் தருகிறது; ‘இல்லாததால்’ அதன் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயரின் தமிழாக்கமான ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: தீர்க்கவாக்குக்கும் மரணத்துக்கும் உள்ள தொடர்பு
  choice: எலியா சொன்ன யாவேயின் வார்த்தையின்படியே
  alternative: எலியா மூலமாக யாவே சொன்ன வார்த்தையின்படியே
  rationale: மூல இலக்கணம் அந்த வார்த்தையை எலியா சொன்னதாகக் கூறுகிறது; ‘மூலமாக’ என்ற இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல், உள்ளபடியே வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ஒரே பெயருடைய இரு யோராம்களை வேறுபடுத்த அடையாளத் தொடர் தெளிவாக வைக்கப்பட்டுள்ளது.
