  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: ta
  text: அப்போது அவன் அவர்களிடம், “உங்களைச் சந்திக்க மேலே வந்து, இந்த வார்த்தைகளை உங்களிடம் பேசிய அந்த மனிதனின் அடையாள விவரம் என்ன?[a]” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எப்படிப்பட்ட மனிதன்?” எபிரெயத்தில் சொற்சொல்லாக, “அந்த மனிதனின் மிஷ்பாட் என்ன?” என்று உள்ளது. இச்சொல் முறை, விவரம் அல்லது தோற்றம் என்பவற்றைக் குறிக்கலாம்; இச்சூழலில் அந்த மனிதனை அடையாளம் காண உதவும் விவரத்தையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: அந்த மனிதனின் தோற்றம் எப்படி இருந்தது?
  rationale: מִשְׁפַּט என்பதன் வழக்கமான பொருள் ‘நியாயம்/முறை’ என்றாலும், இச்சூழலில் அடுத்த வசனத்தில் உடை மற்றும் வெளித்தோற்ற அடையாளங்கள் கூறப்படுவதால், மனிதனை அடையாளம் காண உதவும் தோற்றம் அல்லது விவரணையைக் குறிக்கிறது. கேள்வியை நவீன தமிழில் இயல்பாக அமைக்க ‘எப்படி இருந்தது?’ பயன்படுத்தப்பட்டது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: தூதர்கள் சந்தித்த குறிப்பிட்ட மனிதனைச் சுட்டுவதால் ‘அந்த மனிதன்’ என்பது இயல்பான தெளிவைத் தருகிறது.
- source_word: עָלָה לִקְרַאתְכֶם
  choice: உங்களைச் சந்திக்க வந்து
  rationale: עָלָה என்பதிலுள்ள ‘மேலே வந்தான்/சென்றான்’ என்ற திசை நுணுக்கம் இங்கு தமிழில் சொற்சொல்லாகத் தரப்பட்டால் இயல்பற்றதாகும்; சந்திப்பதற்காக அணுகிய செயலை ‘வந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை உங்களிடம் பேசிய
  rationale: דְּבָרִים என்பதன் சொற்பொருளான ‘வார்த்தைகள்’ பாதுகாக்கப்படுகிறது; பேச்சின் பெறுநரை ‘உங்களிடம்’ எனத் தெளிவாகக் காட்டுகிறது.
