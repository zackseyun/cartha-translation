  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகமக் கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. 'அரசன்' என்பதற்குப் பதில் மரியாதை கலந்த அதிகாரபூர்வச் சூழலுக்கேற்ற 'அரசர்' பயன்படுத்தப்பட்டுள்ளது; இராணுவப் பதவி சாதாரண வாசகருக்குத் தெளிவாக விரித்துரைக்கப்பட்டுள்ளது.
