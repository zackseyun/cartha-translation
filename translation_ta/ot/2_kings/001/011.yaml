  text: וַ/יָּ֜שָׁב וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֥ים אַחֵ֖ר וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֨עַן֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָ/אֱלֹהִ֔ים כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ מְהֵרָ֥ה רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: ta
  text: அவன் மீண்டும் எலியாவிடம் ஐம்பதுபேருக்குத் தலைவனாகிய வேறொருவனையும், அவனுடைய ஐம்பது வீரர்களையும் அனுப்பினான். அந்தத் தலைவன் எலியாவிடம், “தேவனுடைய மனிதரே, ‘விரைவாக இறங்கி வா[a]’ என்று அரசர் கூறுகிறார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரைவாக இறங்கிப் போ.” எபிரெய வினைச்சொல் பொதுவாக ‘இறங்கு’ என்பதையே குறிக்கிறது; கீழே இருந்த அரசரின் பிரதிநிதி மேலிருந்த எலியாவிடம் கூறிய கட்டளை என்பதால், இங்கு “இறங்கி வா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: மீண்டும் ... அனுப்பினான்
  rationale: இங்கு וַיָּשָׁב என்பது உடல்ரீதியாகத் திரும்புவதைக் குறிக்காமல், முந்தைய செயலை மறுபடியும் செய்ததைக் குறிக்கும் தொடர் பயன்பாடு.
- source_word: שַׂר חֲמִשִּׁים
  choice: ஐம்பதுபேர் படைத்தலைவன்
  rationale: ஐம்பது வீரர்களைக் கொண்ட படைப்பிரிவுக்குத் தலைமை வகிக்கும் இராணுவ அதிகாரியை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: וַחֲמִשָּׁיו
  choice: அவனுடைய ஐம்பது வீரர்களோடு
  rationale: சொல்லுக்குச் சொல் 'அவனுடைய ஐம்பது' என்றிருந்தாலும், அவர்கள் வீரர்கள் என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעַן וַיְדַבֵּר
  choice: என்றான்
  rationale: எபிரெயக் கதையாடலில் உள்ள இணை வினைச்சொல் மரபை இயல்பான தமிழில் ஒரே பேச்சு வினையாக வழங்குகிறது; இங்கு முன் கேள்வி எதுவும் இல்லாததால் 'பதிலளித்தான்' என்பது தவறான எண்ணத்தை உண்டாக்கலாம்.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரே
  rationale: எலியாவுக்கான அங்கீகரிக்கப்பட்ட பட்டத்தையும் நேரடி அழைப்பின் மரியாதை வடிவையும் காக்கிறது.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: ‘...’ என்று அரசர் சொல்கிறார்
  rationale: அரசரின் அதிகாரபூர்வத் தூதுச் சூத்திரத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְהֵרָה רֵדָה
  choice: விரைவாக இறங்கி வா
  rationale: மְהֵרָה-வின் அவசரத் தன்மையையும், உயரத்தில் இருந்த எலியா பேசுபவரை நோக்கி இறங்க வேண்டும் என்ற சூழலையும் வெளிப்படுத்துகிறது.
