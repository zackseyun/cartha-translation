source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: ta
  text: ஆனால் யாவேயின் தூதர் திஸ்பியனான எலியாவிடம், “எழுந்து, சமாரியாவின் அரசனுடைய தூதர்களைச் சந்திக்க மேலே போ. அவர்களிடம், ‘இஸ்ரவேலில் கடவுள் இல்லாததாலா நீங்கள் எக்ரோனின் தெய்வமான பாகால்-செபூபிடம் விசாரிக்கப் போகிறீர்கள்?’[a] என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் ஒரு கடவுள் இல்லாத குறையினாலா நீங்கள் எக்ரோனின் தெய்வமான பாகால்-செபூபிடம் விசாரிக்கப் போகிறீர்கள்?”
    reason: מִבְּלִי אֵין என்ற எபிரெயச் சொற்றொடரை ‘இல்லாததாலா’ என்றும் ‘இல்லாத குறையினாலா’ என்றும் புரிந்துகொள்ள முடியும்; மாற்று வடிவம் அதன் சொற்சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: ஆனால் யாவேயின் தூதர்
  rationale: וּ முந்தைய வசனத்தில் அரசன் செய்ததற்கு மாறான தெய்வீகத் தலையீட்டை அறிமுகப்படுத்துவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. מַלְאַךְ இச்சூழலில் விண்ணுலகத் தூதரைக் குறிக்கிறது; יהוה உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: திஸ்பியனான எலியா
  rationale: தனிப்பெயரும் ஊர்சார் அடையாளமும் தமிழில் இயல்பாகவும் சுருக்கமாகவும் வழங்கப்பட்டன.
- source_word: קוּם עֲלֵה
  choice: எழுந்து ... மேலே போ
  rationale: இரண்டு கட்டளைகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; עֲלֵה என்பதிலுள்ள மேல்நோக்கிய திசைப் பொருள் விடப்படவில்லை.
- source_word: לִקְרַאת מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: சமாரியாவின் அரசனுடைய தூதர்களைச் சந்திக்க
  rationale: לִקְרַאת என்பது எதிர்கொள்ளும் நோக்கில் சென்று சந்திப்பதைக் குறிக்கிறது. இங்குள்ள מַלְאֲכֵי மனிதத் தூதர்களைக் குறிக்கிறது; ‘சமாரியாவின் அரசன்’ என்ற எபிரெய வடிவமும் பாதுகாக்கப்பட்டது.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் கடவுள் இல்லாததாலா
  rationale: கண்டனத்துடன் கூடிய சொல்லாட்சிக் கேள்வியைத் தெளிவான நவீன தமிழில் தருகிறது; கடவுள் உண்மையில் இல்லை என்று உரைப்பதாக மாற்றாமல் கேள்வியின் நையாண்டித் தன்மையைப் பாதுகாக்கிறது.
- source_word: אַתֶּם הֹלְכִים לִדְרֹשׁ
  choice: நீங்கள் ... விசாரிக்கப் போகிறீர்கள்
  rationale: பங்கேற்பு வினை வடிவத்தின் நடைபெறவிருக்கும் செயற்பொருளை ‘போகிறீர்கள்’ காட்டுகிறது. தெய்வத்திடமிருந்து பதில் நாடும் சூழலில் דָּרַשׁ என்பதற்கு ‘விசாரிக்க’ துல்லியமானதும் இயல்பானதும் ஆகும்.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  choice: எக்ரோனின் தெய்வமான பாகால்-செபூப்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டன; இங்குள்ள אֱלֹהֵי அந்தப் பட்டணத்துடன் தொடர்புடைய வழிபாட்டுத் தெய்வத்தைக் குறிப்பதால் ‘தெய்வமான’ என வழங்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு ஏற்ப ஒலிபெயர்க்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் செய்தியாளர்
  rationale: மூலச் சொல்லின் தூதுப்பணி சார்ந்த பொருளைத் தக்கவைத்தபடியே இக்கதையாடல் சூழலில் இயல்பான விண்ணுலகத் தூதர் பொருளை வழங்குகிறது; அவரது இயல்பைப் பற்றிய மேலதிக கிறிஸ்தவக் கோட்பாட்டு அடையாளத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: எக்ரோனின் אֱלֹהִים குறித்த சொல் தேர்வு
  choice: தெய்வம்
  alternative: கடவுள்
  rationale: இஸ்ரவேலின் கடவுளுக்கும் எக்ரோனில் வழிபடப்பட்ட பாகால்-செபூபுக்கும் தமிழில் சூழலுக்கேற்ற வேறுபாட்டைத் தெளிவாக்குகிறது; அதேவேளை உரையில் உள்ள வழிபாட்டு உரிமைகோரலை ஆதரிப்பதாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் கட்டளைத் தொனியும் சொல்லாட்சிக் கேள்வியின் கண்டன வலிமையும் பாதுகாக்கப்பட்டுள்ளன. விண்ணுலகத் தூதருக்கும் அரசனுடைய மனிதத் தூதர்களுக்கும் ஒரே அடிப்படைச் சொல் பயன்படுத்தப்பட்டாலும், சூழல் அவற்றைத் தெளிவாக வேறுபடுத்துகிறது.
