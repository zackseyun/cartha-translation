  naturalness: The prose is clear and appropriately dignified for modern standard Tamil. “அவனிடம் ஏறிச் சென்றான்” is smoother than repeating “எலியாவிடம்” immediately after the preceding sentence, while the subsequent explicit name removes any possible ambiguity.
