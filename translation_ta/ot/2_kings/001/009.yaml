  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் அமைக்கப்பட்டது. குழப்பத்தைத் தவிர்க்க எபிரெயில் உள்ள சுட்டுப்பெயர்களுக்குப் பதிலாக தேவையான இடங்களில் ‘எலியா’ மற்றும் ‘அந்தத் தலைவன்’ பயன்படுத்தப்பட்டன. ‘இறைவனின் மனிதர்’ என்ற அடைமொழி சமயப் பிரிவுசார் விளக்கமின்றி நேரடியாகப் பாதுகாக்கப்பட்டது.
