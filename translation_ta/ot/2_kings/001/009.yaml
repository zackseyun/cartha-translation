base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: ta
  text: பின்பு அவன், ஐம்பது படைவீரர்களுக்குத் தலைவனான ஒருவனை அவனுடைய ஐம்பது படைவீரர்களோடு எலியாவிடம் அனுப்பினான். அந்தத் தலைவன் அவனிடம் ஏறிச் சென்றான். இதோ, எலியா மலையின்[a] உச்சியில் உட்கார்ந்திருந்தார். அவன் எலியாவிடம், “தேவனுடைய மனிதரே, ‘கீழே இறங்கி வா’ என்று அரசர் சொல்கிறார்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குன்றின்.” எபிரெயச் சொல் הַר சூழலைப் பொறுத்து மலையையோ குன்றையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல், “அரசர் பேசியுள்ளார்: ‘கீழே இறங்கி வா.’” எபிரெயத் தூதர் வழக்கில் ‘பேசியுள்ளார்’ என்று வரும் வடிவம், தமிழில் இயல்பாக ‘சொல்கிறார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு அவன் ... அனுப்பினான்
  rationale: Wayyiqtol கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ இயல்பான தொடர்ச்சியைத் தருகிறது.
- source_word: שַׂר חֲמִשִּׁים
  choice: ஐம்பது வீரர்களுக்குத் தலைவனான ஒருவன்
  rationale: ஐம்பது பேர் கொண்ட படைப்பிரிவுக்குப் பொறுப்பான இராணுவ அதிகாரியைக் குறிக்கிறது; ‘தலைவன்’ பதவியையும் எண்ணிக்கையையும் தெளிவாக வைத்திருக்கிறது.
- source_word: וַחֲמִשָּׁיו
  choice: அவனுடைய ஐம்பது வீரர்களோடு
  rationale: பின்னொட்டு தலைவனுக்குக் கீழிருந்த குழுவைக் குறிக்கிறது; இராணுவச் சூழலைத் தெளிவாக்க ‘வீரர்கள்’ சேர்க்கப்பட்டது.
- source_word: וַיַּעַל אֵלָיו
  choice: எலியாவிடம் ஏறிச் சென்றான்
  rationale: עלה உயரமான இடத்திலிருந்த எலியாவை நோக்கிய மேல்நோக்குச் செல்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியை உயிரோட்டத்துடன் வாசகரின் கவனத்துக்குக் கொண்டுவரும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יֹשֵׁב
  choice: உட்கார்ந்திருந்தார்
  rationale: பங்கேற்புவினை அந்நேரத்தில் தொடர்ந்திருந்த உட்கார்ந்த நிலையைச் சுட்டுகிறது.
- source_word: עַל רֹאשׁ הָהָר
  choice: மலையின் உச்சியில்
  rationale: רֹאשׁ இங்கு உச்சியைக் குறிக்கிறது; הַר மலை அல்லது குன்று என இருவகையாகப் புரியக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: அவன் எலியாவிடம் ... என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்த நவீன தமிழில் ‘என்றான்’ இயல்பானது; உரையாடல் நோக்கம் தெளிவாகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரே
  rationale: தீர்க்கதரிசிக்கான அங்கீகரிக்கப்பட்ட அடைமொழியின் சொற்சார்ந்த அமைப்பையும் அழைப்புவேற்றுமையையும் பாதுகாக்கிறது.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: அரசர் சொல்கிறார்
  rationale: எழுத்துப்படி ‘அரசர் பேசியிருக்கிறார்’; தூதர் சூத்திரத்தைத் தமிழில் இயல்பான நிகழ்கால வடிவில் வழங்குகிறது, கட்டளை என்ற கருத்தை வினைக்குள் தேவையின்றி சேர்க்கவில்லை.
- source_word: רֵדָה
  choice: கீழே இறங்கி வா
  rationale: பேசுபவன் கீழே இருந்து எலியாவைத் தன்னிடம் வருமாறு அழைப்பதால், கட்டளை வினையின் கீழ்நோக்கிய இயக்கமும் வருகை நோக்கும் இயல்பாக வெளிப்படுகின்றன.
