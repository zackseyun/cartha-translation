  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו אִ֚ישׁ בַּ֣עַל שֵׂעָ֔ר וְ/אֵז֥וֹר ע֖וֹר אָז֣וּר בְּ/מָתְנָ֑י/ו וַ/יֹּאמַ֕ר אֵלִיָּ֥ה הַ/תִּשְׁבִּ֖י הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “அவர் முடி மிகுந்த மனிதர்[a]; தோல் பட்டையை இடுப்பில் கட்டியிருந்தார்” என்றார்கள். அவன், “அவர் திஷ்பியனான எலியாதான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மயிராடை அணிந்த மனிதர்.” எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் “முடியின் உடையவர்” என்று கூறுகிறது; அது முடி மிகுந்த ஒருவரையோ மயிராடை அணிந்த ஒருவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: மனிதர்
  rationale: இங்கு வயதுவந்த ஆணைக் குறிக்கிறது; மரியாதைமிக்க நவீன தமிழில் இயல்பாக அமைவதால் ‘மனிதர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּעַל שֵׂעָר
  choice: உடல் முழுவதும் முடி நிறைந்த மனிதர்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘முடியின் உடையவர்’ எனப் பொருள்பட்டு, உடலில் அதிக முடி கொண்டவரையோ மயிராடை அணிந்தவரையோ குறிக்கக்கூடும். முதன்மை உரையில் நேரடியான உடல் வருணனை வைக்கப்பட்டு, ஆடை குறித்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְאֵזוֹר עוֹר
  choice: தோலினால் ஆன ஒரு பட்டை
  rationale: אֵזוֹר என்பது இடுப்புப் பட்டை அல்லது கச்சையையும், עוֹר அதன் பொருள் தோல் என்பதையும் குறிக்கிறது; இந்தத் தமிழ் நடை விவரத்தைத் தெளிவாகத் தருகிறது.
- source_word: אָזוּר
  choice: கட்டியிருந்தார்
  rationale: செயப்பாட்டு வினையெச்சம் பட்டை இடுப்பில் கட்டப்பட்டு அணியப்பட்டிருந்ததைக் காட்டுகிறது; தமிழில் இயல்பான செயல்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּמָתְנָיו
  choice: இடுப்பைச் சுற்றி
  rationale: מָתְנַיִם இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது; ‘இடுப்பைச் சுற்றி’ என்பது நவீன தமிழில் துல்லியமும் இயல்பும் உடையது.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: திஷ்பியனான எலியா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ‘எலியா’ எனவும், ஊர்சார்பு அடைமொழி ‘திஷ்பியன்’ எனவும் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוּא
  choice: அவர்தான்
  rationale: முன் கூறப்பட்ட அடையாள வருணனையிலிருந்து ஒருவரை உறுதியாக அடையாளம் காணும் எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் ‘அவர்தான்’ எனத் தருகிறது.
