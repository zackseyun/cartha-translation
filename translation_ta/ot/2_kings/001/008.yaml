  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனைச் சுட்டும் இடத்தில் ‘அவன்’ என்றும், எலியாவைப் பற்றிய தூதர்களின் வருணனையில் மரியாதை ஒருமையைப் பின்பற்றி ‘அவர்’ என்றும் அமைக்கப்பட்டுள்ளது. மூலத்தின் சொல்லியல் தெளிவின்மை [a] அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
