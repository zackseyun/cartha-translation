base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: ta
  text: 'அவர் அவனிடம் பேசினார்: “யாவே இவ்வாறு கூறுகிறார்: எக்ரோனின் கடவுளான பாகால்-செபூபிடம்[a] விசாரிப்பதற்காக நீ தூதர்களை அனுப்பியிருக்கிறாய். அவருடைய வார்த்தையை நாடுவதற்கு இஸ்ரவேலில் கடவுள் இல்லாததாலா? ஆகையால், நீ ஏறிய அந்தப் படுக்கை[c]—அதிலிருந்து நீ இறங்க மாட்டாய்; நீ நிச்சயமாகச் சாவாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் பெயர் ‘பாகால்-செபூப்’ என்று உள்ளது; பிற்கால மரபில் தொடர்புடைய ‘பாகால்-செபூல்’ என்ற வடிவமும் காணப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நீ அங்கே ஏறிய படுக்கை.” ‘ஏறுதல்’ என்பது படுக்கையில் ஏறிப் படுப்பதையோ மேல் அறையிலிருந்த படுக்கையை அடைவதையோ குறிக்கலாம்; மூலம் இதைத் தெளிவுபடுத்தவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: அவர் அவனிடம் பேசினார்
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘பேசு’ என்பதையும், அடுத்துவரும் தீர்க்கதரிசன அறிவிப்பு முறையிலிருந்து அதன் வேறுபாட்டையும் காக்கிறது. எபிரெய மூலத்தில் உள்ள இரு பிரதிப்பெயர்களின் தொடர்பைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; יהוה என்ற உடன்படிக்கைப் பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: நீ தூதர்களை அனுப்பியிருக்கிறாய்
  rationale: இங்கு מַלְאָכִים மனிதத் தூதர்களைக் குறிக்கிறது; எபிரெய நிறைவுற்ற வினையின் தற்போதைய விளைவையும் தமிழ் நிறைவுநிலை வெளிப்படுத்துகிறது.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: பாகால்-செபூபிடம் விசாரிப்பதற்காக
  rationale: דרש இச்சூழலில் தெய்வீகச் செய்தி அல்லது குறி நாடி ஆலோசனை கேட்பதைக் குறிக்கிறது. ‘விசாரி’ அந்த சமய ஆலோசனைப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: எக்ரோனின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் கடவுள் இல்லாததாலா
  rationale: அரசனை இடித்துரைக்கும் சொல்லாட்சிக் கேள்வியைத் தக்கவைக்கிறது; אֱלֹהִים இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: அவருடைய வார்த்தையை நாடி விசாரிக்க
  rationale: דבר (‘வார்த்தை/செய்தி’) என்பதை நீக்காமல் காக்கிறது; அதேவேளையில் தமிழில் இது கடவுளிடமிருந்து ஒரு செய்தியை நாடுவதாக இயல்பாகப் புரியும்.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם ... לֹא תֵרֵד מִמֶּנָּה
  choice: நீ ஏறிய அந்தப் படுக்கை—அதிலிருந்து நீ இறங்க மாட்டாய்
  rationale: மூலத்தின் முன்னிலைப்படுத்தப்பட்ட ‘படுக்கை’ தொடரையும், עלה/ירד ஆகிய ‘ஏறு/இறங்கு’ உருவக இணைப்பையும் காக்கிறது. שׁם இங்குள்ள மீள்சுட்டு அமைப்பு தமிழில் ‘அந்த’ மற்றும் ‘அதிலிருந்து’ மூலம் வெளிப்படுகிறது.
- source_word: מוֹת תָּמוּת
  choice: நீ நிச்சயமாகச் சாவாய்
  rationale: எபிரெய வினையெச்சம் மற்றும் வரையறுக்கப்பட்ட வினை சேர்ந்த வலியுறுத்தலை இயல்பான தமிழில் ‘நிச்சயமாக’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலம் நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக அந்தப் பெயரைத் தமிழ் ஒலிமுறையில் தருகிறது.
- issue: בִּדְבָרוֹ என்பதன் பொருள்
  choice: அவருடைய வார்த்தையை நாடி விசாரிக்க
  alternative: அவரிடம் விசாரிக்க
  rationale: ‘அவரிடம்’ என்பது கருத்தை எளிமைப்படுத்தினாலும், மூலத்தில் வெளிப்படையாக உள்ள ‘அவருடைய வார்த்தை/செய்தி’ என்பதை நீக்கிவிடும். தேர்ந்த வடிவம் தெய்வீகச் செய்தி அல்லது அருள்வாக்கை நாடும் சாத்தியத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடையில் வடிவமைக்கப்பட்டது. நேரடியான கடிந்துரைத்தல், சொல்லாட்சிக் கேள்வி, படுக்கையை முன்னிலைப்படுத்தும் எபிரெய அமைப்பு, மற்றும் ‘ஏறு/இறங்கு’ சொல் இணைப்பு இயன்றவரை காக்கப்பட்டுள்ளன.
