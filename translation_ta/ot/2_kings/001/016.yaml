  terminology: ‘யாவே’, ‘எக்ரோன்’, ‘பாகால்-செபூப்’, ‘தூதர்கள்’, ‘கடவுள்’, ‘வார்த்தை’, ‘நிச்சயமாகச் சாவாய்’ ஆகியவை பொருத்தமானவை. பாகால்-செபூப் குறித்த மாற்றுவடிவக் குறிப்பு உரிய இடத்தில் உள்ளது. ‘அவருடைய வார்த்தையை நாடுவதற்கு’ என்பது דברו மற்றும் לדרש இரண்டின் கருத்தையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
