base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: அகசியா செய்த மீதமுள்ள செயல்கள், இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டுள்ளன[a] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பதிவுசெய்யப்பட்டுள்ளன” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நேரடியாக “எழுதப்பட்டுள்ளன” என்று உள்ளது; இது அரச ஆவணங்களைக் குறிப்பிடும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகம்” என்பது அரசர்கள் நூலில் மேற்கோள் காட்டப்படும் அரச ஆட்சிக்காலப் பதிவைக் குறிக்கிறது; இது வேதாகமத்திலுள்ள நாளாகம நூலைக் கட்டாயமாகக் குறிப்பதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: அரசரது ஆட்சிக்கால முடிவுச் சுருக்கத்தில் இச்சொற்றொடர், அவரைப் பற்றிய மீதமான செய்திகள் அல்லது செயல்களைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் வரலாற்றுச் சூழலுக்கு ஏற்றவாறும் ‘மற்ற செயல்கள்’ என வழங்கப்பட்டது; தொடக்க וְ தனியாக ‘இப்போது’ என்ற காலப்பொருளை அளிப்பதில்லை.
- source_word: אֲחַזְיָהוּ
  choice: அகசியா
  rationale: எபிரெய தனிப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: அகசியாவின் செயல்களை விளக்கும் தொடர்புச் சொல்லமைப்பு தமிழில் இயல்பாகப் பெயரெச்ச வடிவில் தரப்பட்டது.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய வினாவமைப்பையும் ‘எழுதப்பட்ட’ என்ற நேரடிப் பொருளையும் காக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொல்லுக்கு ‘சுருள்/புத்தகம்’ என்ற பொருள் இருக்கலாம்; ஆவணத்தைச் சுட்டும் இவ்வழக்குச் சூத்திரத்தில் ‘புத்தகத்தில்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகம்
  rationale: இது அரசர்களைப் பற்றிய ஆண்டுவாரி ஆவணத்தின் தலைப்பாக அமைகிறது. ‘நாளாகமம்’ வரலாற்றுப் பதிவைக் குறிக்கும் வழக்கமான தமிழ் சொல்.
theological_decisions:
- issue: ‘இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகம்’ என்ற ஆவணத்தின் அடையாளம்
  choice: அரச ஆட்சிக்காலப் பதிவாகப் புரியும்படி தலைப்பை மொழிபெயர்த்து, அடிக்குறிப்பில் விளக்குதல்
  alternative: வேதாகமத்தின் ‘நாளாகமம்’ நூலே இது என்று அடையாளப்படுத்துதல்
  rationale: அரசர்கள் நூலில் மேற்கோள் காட்டப்படும் இவ்வாவணம் வேதாகமத்தின் நாளாகம நூலே என்று மூலவசனம் கூறுவதில்லை; ஆகவே தேவையற்ற அடையாளப்படுத்தலைத் தவிர்க்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் முடிவிலுள்ள உறுதிப்படுத்தும் வினா ‘அல்லவா?’ என்று காக்கப்பட்டுள்ளது; தமிழின் இயல்புக்காக தொடர்புச் சொற்றொடர் பெயரெச்சமாகச் சுருக்கப்பட்டுள்ளது.
