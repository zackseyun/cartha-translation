- from: 'ஆகையால், யாவே கூறுவது இதுதான்: “நீ ஏறிய அந்தப் படுக்கையிலிருந்து இறங்கமாட்டாய்[a]; நீ நிச்சயமாக இறந்துபோவாய்.” பின்பு எலியா புறப்பட்டுப் போனார்.'
