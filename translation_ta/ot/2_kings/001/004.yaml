source:
  edition: WLC
  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: ta
  text: 'ஆகையால், யாவே கூறுவது இதுதான்: “நீ ஏறிய அந்தப் படுக்கையிலிருந்து இறங்க மாட்டாய்[a]; நீ நிச்சயமாக இறந்துபோவாய்.” அப்போது எலியா சென்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘ஏறினாய்’ மற்றும் ‘இறங்க மாட்டாய்’ என்ற எதிரெதிரான வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் அந்தச் சொல்லோவியம் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: ஆகையால்
  rationale: முந்தைய கண்டனத்திலிருந்து வரும் தீர்ப்பின் விளைவைத் தெளிவாகக் குறிக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுதான்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைநாமத்தைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: הַמִּטָּה
  choice: அந்தப் படுக்கை
  rationale: מִטָּה என்பதன் பொதுவான பொருள் ‘படுக்கை’; ‘நோய்ப்படுக்கை’ என்பது மூலத்தைவிட விளக்கமானதாகிவிடும்.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם ... לֹא תֵרֵד מִמֶּנָּה
  choice: நீ ஏறிய அந்தப் படுக்கையிலிருந்து இறங்கமாட்டாய்
  rationale: עלה (‘ஏறு’) மற்றும் ירד (‘இறங்கு’) ஆகிய எதிரெதிர் வினைச்சொற்களைத் தக்கவைத்து, எபிரெயச் சொல்லோவியத்தை இயன்றவரை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: כִּי מוֹת תָּמוּת
  choice: நீ நிச்சயமாக இறந்துபோவாய்
  rationale: வினையெச்ச முழுவடிவத்தோடு வரும் வினைச்சொல் மரணத்தின் உறுதியை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: பின்பு எலியா புறப்பட்டுப் போனார்
  rationale: தொடர்கதை நகர்வை ‘பின்பு’ காட்டுகிறது; הלך இங்கு எலியா அங்கிருந்து சென்றதைச் சுருக்கமாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் நான்கெழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான தீர்க்கதரிசன நடையைப் பேணுகிறது. ‘ஏறிய… இறங்கமாட்டாய்’ என்ற சற்று குறியிடப்பட்ட நடை, மூல எபிரெயின் முக்கியமான எதிரிணையைப் பாதுகாப்பதற்காகத் திட்டமிட்டு வைக்கப்பட்டுள்ளது.
