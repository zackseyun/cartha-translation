translation:
  language: ta
  text: ஆகாப் இறந்தபின், மோவாப் இஸ்ரவேலுக்கு எதிராகக் கிளர்ச்சி செய்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: கிளர்ச்சி செய்தது
  rationale: அரசியல் சூழலில் פשע என்பது ஒரு மேலாதிக்க ஆட்சிக்கு எதிராகக் கிளர்ச்சி செய்வதைக் குறிக்கிறது; பொதுவான ஒழுக்கமீறலை அல்ல.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: தேசத்தின் பெயருக்கான தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: פשע என்பதோடு வரும் ב, யாருக்கு எதிராகக் கிளர்ச்சி செய்யப்பட்டது என்பதைக் குறிக்கும் மரபுத்தொடர் பயன்பாடு.
- source_word: אַחֲרֵי מוֹת
  choice: இறந்தபின்
  rationale: கால உறவை இயல்பான, சுருக்கமான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: தனிநபர் பெயருக்கான தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
