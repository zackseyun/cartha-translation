  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: ta
  text: தூதுவர்கள் அவனிடம் திரும்பி வந்தார்கள்; அவன் அவர்களிடம், “நீங்கள் ஏன் திரும்பி வந்தீர்கள்?”[a] என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இது என்ன—நீங்கள் திரும்பி வந்தீர்கள்?” இது “நீங்கள் ஏன் திரும்பி வந்தீர்கள்?” என்ற பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: திரும்பி வந்தபோது
  rationale: שׁוב என்ற வினை இங்கு அனுப்பிய அரசனிடமே மீண்டும் வருவதைக் குறிக்கிறது. அடுத்த வினையுடன் இயல்பான தமிழ் நிகழ்வோட்டத்தை உருவாக்க, தொடர்வினை காலப்பொருளுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: הַמַּלְאָכִים
  choice: தூதுவர்கள்
  rationale: இச்சூழலில் מַלְאָכִים என்பது விண்ணுலகத் தூதர்களை அல்ல, அரசனால் அனுப்பப்பட்ட மனிதத் தூதுவர்களைக் குறிக்கிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: இந்த முன்னிடைச்சொல் அரசனை நோக்கிய திசையைக் குறிக்கிறது; 'திரும்பி வந்தபோது' என்பதுடன் 'அவனிடம்' இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அவன் அவர்களிடம் ... என்று கேட்டான்
  rationale: எபிரெயத்தில் 'சொன்னான்' என்ற பொதுவினை இருந்தாலும், அதன் உள்ளடக்கம் நேரடியான கேள்வி. நவீன தமிழில் 'கேட்டான்' என்பது உரையாடலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מַה זֶּה
  choice: ஏன்
  rationale: சொல்லுக்குச் சொல் 'இது என்ன?' என்றாலும், இங்கு செய்த செயலுக்கான காரணத்தை வினவும் எபிரெய மரபுத்தொடர்; தமிழில் 'ஏன்' அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: שַׁבְתֶּם
  choice: நீங்கள் ... திரும்பி வந்தீர்கள்
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம். தமிழ் உரையாடலில் பன்மை முகவரியை 'நீங்கள்' தெளிவாகக் காட்டுகிறது.
