base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: ta
  text: 'அவன் மீண்டும் ஐம்பது பேருக்குத் தலைவரான மூன்றாவது அதிகாரியை, அவனுடன் இருந்த ஐம்பது பேரோடு அனுப்பினான். அந்த மூன்றாவது ஐம்பது பேரின் அதிகாரி ஏறி வந்து, எலியாவின் முன்னால் முழங்கால்போட்டு, அவரிடம் மன்றாடி, அவரிடம் கூறினான்: “தேவனுடைய மனிதரே, தயவுசெய்து என் உயிரும் உமது பணியாளர்களான இந்த ஐம்பது பேரின் உயிர்களும்[a] உமது பார்வையில் மதிப்புள்ளவையாக இருக்கட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ‘உயிர்’, ‘தன்னையே’, அல்லது ‘ஆத்துமா’ என்றும் சூழலுக்கேற்ப பொருள்படலாம். இங்கு உயிருக்கு ஆபத்து இருப்பதால் ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
