base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: ta
  text: 'அவர்கள் அவனிடம், “ஒரு மனிதர் எங்களைச் சந்திக்க மேலே வந்து எங்களிடம், ‘போங்கள்; உங்களை அனுப்பிய அரசனிடம் திரும்பிச் சென்று இவ்வாறு சொல்லுங்கள்: “யாவே இவ்வாறு கூறுகிறார்: இஸ்ரவேலில் கடவுள் இல்லை என்பதாலா[a] எக்ரோனின் கடவுளான பாகால்-செபூபிடம் குறி கேட்க அனுப்புகிறாய்? ஆகவே, நீ ஏறிய அந்தப் படுக்கையிலிருந்து இறங்கி வரமாட்டாய்[b]; நீ நிச்சயமாக இறப்பாய்”’ என்றார்” என்று சொன்னார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் ஒரு கடவுள் இல்லாத குறையினாலா...?”
    reason: எபிரெய வினாவிலுள்ள ‘கடவுள் இல்லாமை/குறை’ என்ற மாற்று நுணுக்கத்தை வெளிப்படுத்துகிறது.
  - marker: b
    text: நேரடியாக, “நீ அங்கே ஏறிய படுக்கையிலிருந்து இறங்கமாட்டாய்.”
    reason: எபிரெயத்தில் உள்ள ‘அங்கே’ மற்றும் ‘ஏறுதல்/இறங்குதல்’ என்ற இயக்கச் சொல்லாட்சியைச் சுட்டிக்காட்டுகிறது.
