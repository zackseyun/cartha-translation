theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே இருப்பதால் அதைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ‘இஸ்ரவேலில் கடவுள் இல்லை’ என்ற வினாவின் நோக்கம்
  choice: சொல்லாட்சியைப் பாதுகாக்கும் கண்டன வினா
  alternative: இஸ்ரவேலின் கடவுளை நீ நம்பாததாலா
  rationale: அரசனின் உள்ளார்ந்த நம்பிக்கையை விளக்கிச் சேர்க்காமல், கடவுள் இல்லாததுபோல் அவன் நடந்துகொள்வதைச் சாடும் மூலத்தின் இறுக்கத்தையும் மறைமுகத்தையும் பாதுகாக்கிறது.
- issue: பாகால்-செபூபை ‘கடவுள்’ என்று குறிப்பிடுதல்
  choice: எக்ரோனின் கடவுளான பாகால்-செபூப்
  alternative: எக்ரோனின் பொய்த்தெய்வமான பாகால்-செபூப்
  rationale: மூலம் பயன்படுத்தும் அடையாளக் குறிப்பை மட்டும் தருகிறது; ‘பொய்த்தெய்வம்’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், அரசவைக் கதையாடலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தூதர்கள் அறியாத நபரை ‘ஒரு மனிதர்’ என்று குறிப்பிடும் கதைநோக்கு காக்கப்பட்டுள்ளது. அரசனிடம் மேற்கோளாக உரைக்கப்படும் தீர்க்கதரிசனச் செய்தியில் ஒருமை ‘நீ’ பயன்படுத்தப்பட்டு, யாவேயின் நேரடியான கண்டனத் தொனி தணிக்கப்படவில்லை.
