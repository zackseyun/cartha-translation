    rationale: எபிரேயத்தில் «வெ-இம்» இவ்விடத்தில் முந்தைய கோரிக்கைக்கு எதிர்வினையாக வரும் «ஆனால்/அப்படியானால்» என்ற உரையாடல் திருப்பத்தை வழங்குகிறது. ஆங்கில POB-யும் “But if” என இதைக் காக்கிறது. தமிழில் «ஆனால்» சேர்ப்பது பாதுகாப்பானதும் மூலநேர்மையானதும்.
