  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ta
  text: 'எலியா அந்த ஐம்பது வீரர்களின் தலைவனுக்குப் பதிலளித்துச் சொன்னார்: “ஆனால் நான் கடவுளின் மனிதன் என்றால், வானத்திலிருந்து நெருப்பு இறங்கி வந்து உன்னையும் உன் ஐம்பது வீரர்களையும் எரித்து அழிக்கட்டும்.” அப்போது வானத்திலிருந்து நெருப்பு இறங்கி வந்து அவனையும் அவனுடைய ஐம்பது வீரர்களையும் எரித்து அழித்தது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: ஐம்பது வீரர்களின் தலைவன்
  rationale: ஐம்பது பேரைக் கொண்ட படைப்பிரிவின் அதிகாரி என்ற எபிரேயப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ אֱלֹהִים
  choice: கடவுளின் மனிதன்
  rationale: தீர்க்கதரிசிக்கான எபிரேய அடைமொழியின் வடிவத்தையும் வேதாகமச் சிறப்புப் பொருளையும் காக்கிறது.
- source_word: תֹאכַל / וַתֹּאכַל
  choice: எரித்துப்போடட்டும் / எரித்துப்போட்டது
  rationale: நெருப்பு ஒருவரை ‘தின்றது’ என்ற மூல உருவகத்தின் சூழல்சார் பொருளை இயல்பான தமிழில் கூறுகிறது; முழுமையான அழிவின் வலிமையையும் காக்கிறது.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: உன் ஐம்பது வீரர்கள் / அவனுடைய ஐம்பது வீரர்கள்
  rationale: எழுத்துப்படியான ‘உன் ஐம்பது’ என்பதன் மறைந்துள்ள படைவீரர் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: וְאִם என்பதிலுள்ள இணைப்புச் சொல்லின் வலிமை
  choice: நான் கடவுளின் மனிதன் என்றால்
  alternative: ஆனால் நான் கடவுளின் மனிதன் என்றால்
  rationale: וְ இங்கு உரையாடல் தொடர்ச்சியைக் குறிக்கலாம்; கட்டாயமான எதிர்மறைத் திருப்பத்தைத் தெளிவாக நிறுவாததால் தமிழில் தேவையற்ற ‘ஆனால்’ சேர்க்கப்படவில்லை. நிபந்தனையின் உண்மையான பதற்றம் காக்கப்படுகிறது.
- issue: தீர்க்கதரிசியின் அடையாளமும் நெருப்பு இறங்குவதும் இடையிலான நிபந்தனை
  choice: “என்றால் ... இறங்கி வந்து ... எரித்துப்போடட்டும்”
  alternative: “ஆகையால் ... நெருப்பு இறங்கும்”
  rationale: மூலத்தின் நிபந்தனை வடிவத்தையும் கட்டளை/விருப்ப நயத்தையும் காக்கிறது; அதை காரணவியல் உறுதிமொழியாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். உரையின் கடுமையும் மறுமொழி அமைப்பும் காக்கப்பட்டுள்ளன; படைத்துறைச் சூழல் சாதாரண வாசகருக்குத் தெளிவாக இருக்க ‘வீரர்கள்’ என வெளிப்படுத்தப்பட்டுள்ளது.
