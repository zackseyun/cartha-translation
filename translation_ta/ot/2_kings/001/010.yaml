  naturalness: நடை பொதுவாக நவீன நிலையான தமிழில் தெளிவாக உள்ளது. இருப்பினும் «எரித்துப்போடட்டும் / எரித்துப்போட்டது» என்பது சற்றே பேச்சுவழக்குத் தொனியுடையது. இவ்வகை கண்ணியமான வேதாகம உரையில் «எரித்து அழிக்கட்டும் / எரித்து அழித்தது» இயல்பாகவும் துல்லியமாகவும் அமையும்.
  terminology: «கடவுளின் மனிதன்» என்பது אִישׁ אֱלֹהִים என்ற நிலையான தீர்க்கதரிசிப் பட்டத்தை எழுத்துப்படியான, புரிந்துகொள்ளக்கூடிய முறையில் காக்கிறது. «ஐம்பது வீரர்கள்» என்பது இச்சூழலில் உள்ள படைப்பிரிவைக் தெளிவாக்குகிறது; கூடுதல் அடிக்குறிப்பு தேவையில்லை.
