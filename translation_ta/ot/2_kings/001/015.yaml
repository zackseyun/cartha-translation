base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: ta
  text: அப்போது யாவேவின் தூதர் எலியாவிடம், “அவனோடு இறங்கிப்போ; அவனைக் கண்டு அஞ்சாதே[a]” என்றார். எனவே எலியா எழுந்து, அவனோடு அரசனிடம் இறங்கிப்போனார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவனுடைய முன்னிலையிலிருந்து அஞ்சாதே”; அதாவது, “அவன் முன்னிலையில் இருப்பதால் அஞ்சாதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேவின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது வானதூதர் எனப் பொருள்படலாம். இச்சூழலில் தெய்வீகச் செய்தியையும் கட்டளையையும் கொண்டுவருபவரைக் குறிக்க இயல்பான தமிழ்ச் சொல் ‘தூதர்’; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: רֵד אֹתוֹ
  choice: அவனோடு இறங்கிப்போ
  rationale: ירד என்பதன் கட்டளை வடிவம் கீழ்நோக்கிய நகர்வைக் குறிக்கிறது; אֹתוֹ இங்கு உடன்செல்லுதலைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: אַל־תִּירָא מִפָּנָיו
  choice: அவனைக் கண்டு அஞ்சாதே
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய முகம்/முன்னிலையிலிருந்து அஞ்சாதே.’ ‘அவனைக் கண்டு அஞ்சாதே’ என்பது அந்த முன்னிலை காரணமாக அஞ்ச வேண்டாம் என்ற பொருளை இயல்பான தமிழில் தருகிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: பதில் நடவடிக்கையைத் தொடங்கும் எபிரெயக் கதைநடை வினை; தமிழில் ‘எழுந்து’ இயல்பாகவும் சுருக்கமாகவும் அமைகிறது.
- source_word: וַיֵּרֶד אֹתוֹ אֶל־הַמֶּלֶךְ
  choice: அவனோடு அரசனிடம் இறங்கிப்போனார்
  rationale: கீழிறங்கும் நகர்வு, அந்த மனிதனுடன் செல்லுதல், அரசனை இலக்காகக் கொண்டிருத்தல் ஆகிய மூன்றையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. அதனை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ என்பவர் குறித்த மொழியாக்கம்
  choice: தூதர்
  alternative: வானதூதர்
  rationale: எபிரெயச் சொல் பொதுவாக ‘தூதர்/செய்தியாளர்’ என்றும் சூழலின்படி வானுலகத் தூதர் என்றும் பொருள்படும். ‘யாவேவின் தூதர்’ என்பது தமிழில் நிலைபெற்ற, தேவையற்ற விளக்கத்தைச் சேர்க்காத வடிவம்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கிப்போ’ என்பது இடநகர்வைத் தெளிவாகக் காட்டுகிறது; மரியாதை வினைமுற்றுகள் எலியாவுக்கும் யாவேவின் தூதருக்கும் இயல்பான தமிழ்நடையை வழங்குகின்றன.
