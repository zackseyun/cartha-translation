id: 2KI.1.14
reference: 2 Kings 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: ta
  text: இதோ, வானத்திலிருந்து நெருப்பு இறங்கி, முந்தைய இரண்டு ஐம்பதுபேர் படைத்தலைவர்களையும் அவர்களுடைய ஐம்பதுபேர் அணிகளையும்[a] எரித்து அழித்தது. ஆனால் இப்போது, என் உயிர்[b] உமது பார்வையில் அருமையானதாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அவர்களுடைய ஐம்பதுகள்”; அதாவது, ஒவ்வொரு தலைவரின் கீழிருந்த ஐம்பதுபேர் குழு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் ஆத்துமா”; இங்கு எபிரெயச் சொல் பேசுபவரின் உயிரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: நடந்ததை வலியுறுத்திக் கவனத்திற்குக் கொண்டுவரும் எபிரெயச் சுட்டுதலை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து நெருப்பு இறங்கி
  rationale: நெருப்பின் மூலத்தையும் கீழ்நோக்கிய இயக்கத்தையும் எளிய நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַתֹּאכַל
  choice: எரித்து அழித்தது
  rationale: மூல வினைச்சொல் சொற்படியாக ‘தின்றது’ என்று பொருள்பட்டாலும், நெருப்பைப் பொறுத்தவரை அதன் முழுமையான அழிவுச் செயலை ‘எரித்து அழித்தது’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: முந்தைய இரண்டு ஐம்பதுபேர் படைத்தலைவர்கள்
  rationale: שַׂר என்பதன் இராணுவச் சூழலையும், ஒவ்வொருவரும் ஐம்பதுபேர் கொண்ட அணிக்குத் தலைவராக இருந்ததையும், கதையில் இவர்கள் முன்னர் வந்தவர்கள் என்பதையும் தெளிவாக்குகிறது.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: அவர்களுடைய ஐம்பதுபேர் அணிகள்
  rationale: ‘அவர்களுடைய ஐம்பதுகள்’ என்ற எபிரெயச் சுருக்கத்தை, எண்ணிக்கையையும் இராணுவக் குழு அமைப்பையும் காக்கும் புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தையவர்களுக்கு நேரிட்ட அழிவிலிருந்து பேசுபவரின் தற்போதைய வேண்டுதலுக்குச் செல்லும் எதிர்மறை மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: என் உயிர் உமது பார்வையில் அருமையானதாக இருக்கட்டும்
  rationale: יקר என்பதன் ‘அருமையானது/மதிப்புமிக்கது’ என்ற பொருளையும், בְּעֵינֶיךָ என்பதன் மதிப்பீட்டுக் கோணத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: உயிர் பிழைப்பதற்கான வேண்டுதலில் נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: முந்தைய படைக்குழுக்களைப் போலத் தானும் கொல்லப்படாதிருக்கப் பேசுபவர் வேண்டுகிறார். ஆகவே இங்கு נֶפֶשׁ என்பது உடலிலிருந்து தனியான ஓர் அங்கத்தை அல்ல, அவருடைய உயிரையே குறிக்கிறது; ‘உயிர்’ சூழலுக்கு மிகத் துல்லியமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ஒருமை ஆண்பால் அழைப்பை வெளிப்படுத்த ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; பழமையான அல்லது பிரிவுசார் சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
