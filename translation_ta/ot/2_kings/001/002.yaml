base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: ta
  text: அகசியா சமாரியாவில் இருந்த தன் மேல்மாடி அறையிலிருந்த பின்னல் தடுப்பின் வழியாக விழுந்து நோயுற்றான். ஆகவே அவன் தூதுவர்களை அனுப்பி, அவர்களிடம், “நீங்கள் போய், இந்த நோயிலிருந்து நான் பிழைப்பேனா என்று எக்ரோனின் தெய்வமான பாகால்-செபூபிடம்[a] விசாரியுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாகால்-செபூப்’ என்பது பெயரின் எபிரெய வடிவம்; பிற்கால கிரேக்கத்திலும் சில ஆங்கில மரபுகளிலும் ‘பெயெல்செபூப்’ என்ற வடிவம் காணப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: பின்னலிட்ட சாளரத் தடுப்பின் வழியாக
  rationale: שְׂבָכָה என்பது பின்னல் அல்லது வலைப்போன்ற தடுப்பைக் குறிக்கிறது; בְּעַד உடன் வரும்போது அதன் வழியாக விழுந்த இயக்கத்தை வெளிப்படுத்துகிறது. தமிழில் காட்சியைத் தெளிவாக்க ‘சாளரத் தடுப்பு’ பயன்படுத்தப்பட்டுள்ளது; வெறும் ‘சாளரம்’ என்று பொதுமைப்படுத்தப்படவில்லை.
- source_word: עֲלִיָּתוֹ
  choice: தன் மேல்மாடி அறை
  rationale: עֲלִיָּה என்பது கட்டிடத்தின் மேற்பகுதியிலுள்ள அறை; ‘மேல்மாடி அறை’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיָּחַל
  choice: நோயுற்றான்
  rationale: இந்த வினை ‘நோயுற்றான்/பலவீனமடைந்தான்’ என்ற பொருளைத் தருகிறது. முந்தைய வீழ்ச்சியே உடனடி சூழல் என்றாலும், ‘காயமடைந்தான்’ என்று மட்டும் வரையறுக்காமல் எபிரெயச் சொல்லின் நோய் சார்ந்த பொருள் காக்கப்படுகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இங்கே அரசனால் அனுப்பப்படும் மனிதச் செய்தியாளர்களே குறிக்கப்படுகின்றனர்; ஆகவே ‘தூதுவர்கள்’ சூழலுக்குப் பொருத்தமானது.
- source_word: דִרְשׁוּ
  choice: விசாரியுங்கள்
  rationale: இச்சூழலில் דרשׁ ஒரு தெய்வத்திடம் குறி அல்லது பதில் நாடுவதைக் குறிக்கிறது; ‘விசாரியுங்கள்’ அந்த ஆலோசனை நாடும் பொருளை இயல்பாகத் தருகிறது.
- source_word: בַּעַל זְבוּב
  choice: பாகால்-செபூப்
  rationale: எபிரெய மூலத்தின் பெயர்வடிவம் ஒலிபெயர்க்கப்பட்டுள்ளது; பிற்கால கிரேக்க மரபின் பெயர் முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: எக்ரோனின் தெய்வம்
  rationale: இணைப்புத் தொடர் பாகால்-செபூபை எக்ரோனோடு தொடர்புடைய தெய்வமாக நேரடியாக அடையாளப்படுத்துகிறது.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: இந்த நோயிலிருந்து நான் பிழைப்பேனா
  rationale: சொல்லுக்கு நெருக்கமாக ‘இந்த நோயிலிருந்து நான் உயிர்வாழ்வேனா’ என்பது பொருள். ‘பிழைப்பேனா’ என்பது தமிழில் இயல்பாக இருந்து, வெறும் ‘குணமடைவேனா’ என்பதைவிட உயிர்-மரண நிச்சயமின்மையையும் காக்கிறது.
- source_word: וַיִּפֹּל
  choice: கீழே விழுந்து
  rationale: எளிய கதைநடை வினை நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது; மேல்மாடிச் சூழலில் ‘கீழே’ இயல்பான இயக்கத்தைத் தெளிவாக்குகிறது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: புறமதத் தெய்வத்தின் பெயரை வழங்குதல்
  choice: பாகால்-செபூப்
  alternative: பெயெல்செபூப்
  rationale: எபிரெய உரை בַּעַל זְבוּב என்ற வடிவத்தைக் கொண்டிருப்பதால் முதன்மை உரை அதையே பின்பற்றுகிறது. பிற்காலத்தில் பரவலான கிரேக்கச் செல்வாக்குள்ள வடிவம் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
- issue: אִם אֶחְיֶה என்பதிலுள்ள உயிர்வாழ்தல் அல்லது குணமடைதல் நுணுக்கம்
  choice: நான் பிழைப்பேனா
  alternative: நான் குணமடைவேனா
  rationale: ‘பிழைப்பேனா’ என்பது எபிரெய வினையின் ‘வாழ்தல்’ பொருளையும் நோயிலிருந்து மீளும் சூழலையும் ஒன்றாகக் காக்கிறது; மரண அபாயத்தை அமைதியாக நீக்கிவிடுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆகவே’ காரணத் தொடர்பை இயல்பாகக் காட்டுகிறது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச் சொல் இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு அதற்குரிய பாகால்-செபூப் பெயருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
