  source_fidelity: முதன்மைச் சொற்தொடர்கள் பெரும்பாலும் மூலத்திற்கு உண்மையாக உள்ளன. ஆனால் இரண்டாம் வாக்கியத்தில் “கடவுளிடமிருந்து நெருப்பு வானத்திலிருந்து இறங்கி” என்பது ஒரே நெருப்பின் மூலத்தை இருமுறை குறித்துத் தமிழில் தேவையற்ற மீளுரையாகத் தோன்றுகிறது. எபிரேய אֵשׁ אֱלֹהִים என்பதன் தொடர்பு நுணுக்கத்தையும், מִן־הַשָּׁמַיִם என்பதன் ‘வானத்திலிருந்து’ என்பதையும் தனித்தனியாகக் காக்க “கடவுளின் நெருப்பு வானத்திலிருந்து” என்பது பாதுகாப்பானது.
