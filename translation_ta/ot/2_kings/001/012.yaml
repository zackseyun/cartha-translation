base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ta
  text: எலியா அவர்களுக்குப் பதிலளித்து, “நான் கடவுளின் மனிதன்[a] என்றால், வானத்திலிருந்து நெருப்பு இறங்கி, உன்னையும் உன் ஐம்பது வீரர்களையும் எரித்து அழிக்கட்டும்” என்றார். அப்போது கடவுளின் நெருப்பு[b] வானத்திலிருந்து இறங்கி, அவனையும் அவனுடைய ஐம்பது வீரர்களையும் எரித்து அழித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அந்தக் கடவுளின் மனிதன் என்றால்.”
    reason: எபிரேயத்தில் ‘கடவுளின் மனிதன்’ என்ற பட்டத்துடன் வரும் குறிப்புப் பொருளை மாற்று வாசிப்பாகக் காட்டுகிறது.
  - marker: b
    text: அல்லது, “கடவுளிடமிருந்து நெருப்பு.”
    reason: எபிரேய אֵשׁ אֱלֹהִים என்ற கட்டமைப்புச் சொற்றொடர் கடவுளுக்குரிய நெருப்பு அல்லது கடவுளிடமிருந்து வந்த நெருப்பு எனப் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: எலியா அவர்களுக்குப் பதிலளித்து … என்றார்
  rationale: எபிரேய மொழியின் இரட்டை பேச்சு அறிமுகத்தை இயல்பான நவீன தமிழில் சுருக்கமாகக் காட்டுகிறது; பதிலுரையின் தன்மை தக்கவைக்கப்படுகிறது.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: நான் கடவுளின் மனிதன் என்றால்
  rationale: தீர்க்கதரிசிக்கான எபிரேய அடைமொழியை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து நெருப்பு இறங்கி … அழிக்கட்டும்
  rationale: வினையின் வேண்டுதல் அல்லது ஆணைநிலை வலிமையை வெறும் எதிர்காலக் கணிப்பாக மாற்றாமல் காட்டுகிறது.
- source_word: וְתֹאכַל
  choice: எரித்து அழிக்கட்டும்
  rationale: நெருப்பைப் பொருளாகக் கொண்ட אכל என்பதன் ‘முற்றாக அழித்தல்’ என்ற பொருளைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: உன்னுடைய ஐம்பது பேர் / அவனுடைய ஐம்பது பேர்
  rationale: சொல்லுக்கு சொல் ‘உன் ஐம்பது’ என்பதைவிட, தலைவனுக்குக் கீழிருந்த ஐம்பது மனிதர்களைக் குறிக்கும் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אֵשׁ אֱלֹהִים
  choice: கடவுளிடமிருந்து நெருப்பு
  rationale: இச்சொற்றொடரின் மூலத்தைக் குறிக்கும் சாத்தியமான பொருளை முதன்மை உரையில் தருகிறது; மாற்றான ‘கடவுளின் நெருப்பு’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற தீர்க்கதரிசன அடைமொழி
  choice: கடவுளின் மனிதன்
  alternative: கடவுளுக்குரிய மனிதன்
  rationale: மூலத்தின் நிலையான அடைமொழியைப் பாதுகாத்து, பின்னாளைய சமயக்குழு சார்ந்த விளக்கத்தைச் சேர்க்கவில்லை.
- issue: אֵשׁ אֱלֹהִים என்பதிலுள்ள தொடர்பின் தன்மை
  choice: கடவுளிடமிருந்து நெருப்பு
  alternative: கடவுளின் நெருப்பு
  rationale: கடவுளே நெருப்பின் மூலம் என்பதைக் காட்டும் இயல்பான வாசிப்பைத் தேர்ந்தெடுக்கிறது; எபிரேய கட்டமைப்பின் உரிமை அல்லது பண்புக் கூறும் மாற்று சாத்தியத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் பொதுவாசகர்களுக்குத் தெளிவாக அமைக்கப்பட்டது. ‘ஐம்பது பேர்’ என்பது படைத்தலைவனின் ஐம்பது வீரர்களைக் குறிக்கிறது; சூழல் தெளிவாக இருப்பதால் தனி அடிக்குறிப்பு தேவையில்லை.
