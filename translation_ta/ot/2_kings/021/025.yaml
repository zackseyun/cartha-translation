source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: ஆமோன் செய்த மற்ற செயல்கள்[a] யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செயல்கள்’ என்பதற்கு ‘செய்த காரியங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் דִּבְרֵי என்பதன் நேரடிப் பொருள் ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்’; ஆனால் அரசர்களைப் பற்றிய இந்தச் சுருக்கப் பதிவில் அது அவருடைய செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள ‘புத்தகம்’ என்பது பழங்கால எழுத்துப் பதிவை, பெரும்பாலும் ஒரு சுருளை, குறிக்கிறது. இந்தத் தொடரை ‘யூதா அரசர்களின் ஆண்டுக் குறிப்பேடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: יֶתֶר என்பது எஞ்சியவற்றையும், דִּבְרֵי என்பது இங்கு அரசனின் ஆட்சிக்காலச் செயல்களைப் பற்றிய பதிவுகளையும் குறிக்கிறது. ஆகவே, இயல்பான நவீன தமிழில் ‘மற்ற செயல்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָמ֖וֹן
  choice: ஆமோன்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: ஆமோனின் செயல்களை விளக்கும் தொடர்புச் சொற்றொடரைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய வினாவடிவத்தையும் ‘எழுதப்பட்டவை’ என்ற நேரடியான பொருளையும் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: அரசர்களைப் பற்றிய ஆண்டு நிகழ்வுப் பதிவைக் குறிக்கும் மரபுச் சொற்றொடரைத் தெளிவாகவும் தலைப்புப் போன்ற வடிவிலும் வழங்குகிறது.
