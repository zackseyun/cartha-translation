translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சொல்லாட்சியை இறுக்கமாகப் பின்பற்றி செயற்கையான தொடரை உருவாக்காமல், அதன் அரசகாலச் சுருக்கவுரை வடிவமும் இறுதி வினாவின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
