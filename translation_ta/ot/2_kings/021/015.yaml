  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: ta
  text: ஏனெனில், அவர்கள் என் பார்வையில் தீமையானதைச் செய்து, அவர்களுடைய தந்தையர்[a] எகிப்திலிருந்து புறப்பட்ட நாள் முதல் இந்நாள்வரை தொடர்ந்து எனக்குக் கோபமூட்டி வந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய முன்னோர்.” எபிரெயத்தில் “அவர்களுடைய தந்தையர்” என்று உள்ளது; இங்கு அந்த ஆண்பால் உறவுமுறைச் சொல் முந்தைய தலைமுறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
