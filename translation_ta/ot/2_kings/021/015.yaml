theological_decisions:
- issue: எகிப்திலிருந்து வெளியேறிய தலைமுறை முதல் இஸ்ரவேலின் குற்றத்தின் கூட்டு வரலாற்றுத் தொடர்ச்சி
  choice: கலகத்தை அண்மைக்காலத் தனிநபர் செயல்களாக மட்டும் குறுக்காமல், முந்தைய தலைமுறைகள் முதல் தொடரும் கூட்டு வரலாற்றுச் சட்டகத்தைத் தக்கவைத்தல்
  alternative: இது அண்மைக்கால அரசர்களின் பாவங்களைப் பற்றிய சொல்லாட்சிச் சுருக்கம் மட்டுமே என வெளிப்படுத்துதல்
  rationale: வசனம் தந்தையர் எகிப்திலிருந்து புறப்பட்ட நாளிலிருந்து இந்நாள்வரை எனத் தெளிவாகக் காலத் தொடர்ச்சியைக் காட்டுகிறது; இதன் இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தவோ விரிவுரை சேர்த்து தீர்மானிக்கவோ கூடாது.
- issue: אֲבוֹתָם என்ற உறவுமுறைச் சொல்லின் பொருள்
  choice: அவர்களுடைய தந்தையர்
  alternative: அவர்களுடைய முன்னோர்
  rationale: மூல எபிரெயம் இலக்கணரீதியாக ஆண்பால் உறவுமுறைச் சொல்லைப் பயன்படுத்துகிறது. முதன்மை உரை அதைத் தக்கவைக்கிறது; பரந்த தலைமுறைப் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “தொடர்ந்து ... வந்திருக்கிறார்கள்” என்பது மூலத்தின் நீடித்த செயற்பொருளை வெளிப்படுத்துகிறது; “தந்தையர்” மூலச் சொல்லின் பாலின வடிவத்தைத் தக்கவைக்கிறது.
