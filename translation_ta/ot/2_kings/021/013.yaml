  source_fidelity: வரைவில் “சமாரியாவின்மேல் பயன்படுத்திய,” “ஆகாபின் குடும்பத்தின்மேல் பயன்படுத்திய” என்று சேர்க்கப்பட்டுள்ளது. தீர்ப்புச் சூழலில் இது சாத்தியமான விளக்கமாயினும், எபிரெயத்தின் சுருக்கமான உடைமைத் தொடர்பை நேரடியாகக் காட்டுவது சிறந்தது. மேலும், מָחָה என்ற வினை நகரத்திற்கும் தட்டிற்கும் ஒரே சொல்லால் வரும் சொல்லிணைப்பை “துடைத்தழிப்பேன்” ஓரளவு மறைக்கிறது.
  naturalness: “அளவுநூல்,” “தூக்குநூல்,” மற்றும் “கவிழ்த்துப் போடுதல்” நவீன நிலையான தமிழில் புரியக்கூடியவை. திருத்தப்பட்ட வாக்கியம் தட்டைத் துடைத்து கவிழ்க்கும் உவமையின் தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
