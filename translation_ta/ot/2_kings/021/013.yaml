- from: சமாரியாவின்மேல் பயன்படுத்திய அளவுநூலையும் ஆகாபின் குடும்பத்தின்மேல் பயன்படுத்திய தூக்குநூலையும் எருசலேமின்மேல் நீட்டுவேன்[a]. ஒருவன் ஒரு தட்டைத் துடைத்துவிட்டு அதைக் கவிழ்த்து வைப்பதுபோல, எருசலேமைத் துடைத்தழிப்பேன்[b].
  to: சமாரியாவின் அளவுநூலையும் ஆகாபின் குடும்பத்தின் தூக்குநூலையும் எருசலேமின்மேல் நீட்டுவேன்[a]. ஒருவன் ஒரு தட்டைத் துடைப்பதுபோல்—அதைத் துடைத்து, கவிழ்த்துப் போடுவதுபோல்—எருசலேமைத் துடைப்பேன்[b].
