base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: ta
  text: சமாரியாவின் அளவுநூலையும் ஆகாபின் குடும்பத்தின் தூக்குநூலையும் எருசலேமின்மேல் நீட்டுவேன்[a]. ஒருவன் ஒரு தட்டைத் துடைப்பதுபோல்—அதைத் துடைத்து, கவிழ்த்துப் போடுவதுபோல்—எருசலேமைத் துடைப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அளவுநூல்” என்பது கட்டுமானத்தில் அளக்க அல்லது நேர்கோடு இடப் பயன்படும் நூல்; “தூக்குநூல்” என்பது செங்குத்தைச் சரிபார்க்க எடை கட்டப்பட்ட நூல். இங்கு சமாரியாவுக்கும் ஆகாபின் குடும்பத்துக்கும் உரிய அளவீட்டுக் கருவிகள் எருசலேமின்மேல் தீர்ப்புக்காக நீட்டப்படுவது உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: “தட்டு” என்பதற்குப் பதிலாக “கிண்ணம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: நீட்டுவேன்
  rationale: נטה என்பதன் அடிப்படைப் பொருளான ‘நீட்டு’ என்பதையும், அளவுநூலை ஒரு நகரின்மேல் நீட்டும் உருவகத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: קָו
  choice: அளவுநூல்
  rationale: அளக்கவும் கட்டுமானத்தில் நேர்கோட்டை வரையவும் பயன்படும் நூலைக் குறிக்கிறது; நியாயத்தீர்ப்புக்கான அளவுகோல் என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: מִשְׁקֹלֶת
  choice: தூக்குநூல்
  rationale: செங்குத்தைச் சரிபார்க்க எடையுடன் பயன்படுத்தப்படும் நூலைக் குறிக்கும் எளிய தமிழ்ச் சொல்; ‘அளவுநூல்’ என்பதுடன் உள்ள இணை அமைப்பையும் காக்கிறது.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பம்
  rationale: இங்கு בית என்பது கட்டடத்தை அல்ல, ஆகாபின் அரச வம்சத்தைக் குறிக்கிறது; ‘குடும்பம்’ நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: וּמָחִיתִי
  choice: துடைத்தழிப்பேன்
  rationale: அடுத்துள்ள தட்டைத் துடைக்கும் உவமையுடன் சொல் தொடர்பைப் பாதுகாத்தபடியே, எருசலேமுக்கு நேரும் அழிவைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: ஒருவன் ஒரு தட்டைத் துடைத்துவிட்டு
  rationale: எபிரெய பொதுமைப்படுத்தும் மூன்றாம் நபர் ஒருமையை ‘ஒருவன்’ என இயல்பாக வழங்குகிறது; צלחת என்பதற்கு இச்சூழலில் ‘தட்டு’ பொருத்தமானது.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: அதைக் கவிழ்த்து வைப்பது
  rationale: சொற்படி ‘அதன் முகத்தின்மேல் திருப்புதல்’; தட்டைக் குறித்த தமிழின் இயல்பான வெளிப்பாடு ‘கவிழ்த்து வைப்பது’.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற இடப்பெயர்.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற இடப்பெயர்.
theological_decisions:
- issue: சமாரியாவையும் ஆகாபின் குடும்பத்தையும் சார்ந்த அளவிடும் உருவகத்தின் தன்மை
  choice: அவர்களுக்கு வழங்கப்பட்ட அதே நியாயத்தீர்ப்பின் அளவால் எருசலேமும் மதிப்பிடப்பட்டு அழிக்கப்படும் என்பதைச் சித்தரிக்கும் உருவகம்
  alternative: வேறு சூழல்களில் இக்கருவிகள் மறுகட்டுமானம் அல்லது சீரமைப்பைக் குறிக்கலாம்
  rationale: உடனடிச் சூழல் கண்டனத்தைப் பற்றியது; தட்டைத் துடைத்துக் கவிழ்க்கும் தொடர்ந்த உவமை இங்கு அழிவைக் குறிக்கும் பொருளை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. அளவிடும் கருவிகளின் இணை உருவகத்தைப் பாதுகாக்க ‘அளவுநூல்/தூக்குநூல்’ பயன்படுத்தப்பட்டுள்ளன. தட்டைத் துடைக்கும் உவமையையும் நகரை அழிக்கும் தீர்ப்பையும் இணைக்க ‘துடைத்தழிப்பேன்’ தேர்ந்தெடுக்கப்பட்டது.
