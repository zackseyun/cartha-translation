base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: ta
  text: அவன் செய்த அசேராவின் செதுக்கப்பட்ட உருவத்தை அந்த ஆலயத்தில் வைத்தான். அந்த ஆலயத்தைக் குறித்து யாவே தாவீதிடமும் தாவீதின் மகனான சாலொமோனிடமும், “இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நான் தேர்ந்துகொண்ட இந்த ஆலயத்திலும் எருசலேமிலும் என் பெயரை என்றென்றும் வைப்பேன்” என்று சொல்லியிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேராவின் செதுக்கப்பட்ட உருவம்” என்பது அசேராவைக் குறிக்கும் அல்லது அசேராவுடன் தொடர்புடைய செதுக்கப்பட்ட வழிபாட்டுப் படிமத்தைக் குறிக்கிறது. இதைச் சிலர் “அசேரா கம்பம்” என்று மொழிபெயர்க்கிறார்கள்; ஆனால் இங்கு எபிரெய உரை குறிப்பாக “செதுக்கப்பட்ட உருவம்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: ஒரு பொருளை ஓர் இடத்தில் வைப்பதைக் குறிக்கும் שׂוּם என்ற வினையின் இயல்பான இறந்தகாலத் தமிழ் வடிவம்.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: அசேராவின் செதுக்கப்பட்ட உருவம்
  rationale: פֶּסֶל என்பதன் செதுக்கி உருவாக்கப்பட்ட படிமம் என்ற konkrete பொருளையும், הָאֲשֵׁרָה உடனான உடைமை அல்லது தொடர்பையும் காக்கிறது; ‘அசேரா கம்பம்’ என்று தேவையற்ற வகையில் குறுக்கவில்லை.
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: அந்த ஆலயத்தில் / இந்த ஆலயத்திலும்
  rationale: בַּיִת என்பதற்கு நேரடியாக ‘வீடு’ என்று பொருள் இருந்தாலும், இச்சூழலில் சாலொமோனின் ஆலயத்தையே குறிக்கிறது. நவீனத் தமிழில் ‘ஆலயம்’ வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது மூலத்தின் மீளுரையைக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: பின்னொட்டு தாவீதைக் குறிப்பதால், சாலொமோன் தாவீதின் மகன் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நான் தேர்ந்துகொண்ட
  rationale: מן உடன் வரும் בחר, பலவற்றின் நடுவிலிருந்து தேர்ந்தெடுப்பதைச் சுட்டுகிறது; தமிழிலும் அந்தத் தேர்வு உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: என் பெயரை என்றென்றும் நிலைநிறுத்துவேன்
  rationale: சொற்படி ‘என் பெயரை வைப்பேன்’ என்பதன் ஆலயத் தேர்வு சார்ந்த நிலையான இருப்பு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இதை ‘வாசமாயிருப்பேன்’ என விரிவாக்காமல் காக்கிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதுடன் தொடர்புடைய வழிபாட்டுப் பொருள்
  choice: அசேராவின் செதுக்கப்பட்ட உருவம்
  alternative: அசேரா கம்பம்
  rationale: இவ்வசனம் வெளிப்படையாக פֶּסֶל, ‘செதுக்கப்பட்ட உருவம்,’ என்கிறது. ஆகவே அதன் வடிவத்தை வெறும் வழிபாட்டுக் கம்பமாகக் குறிப்பாக்காமல், அசேராவுடன் தொடர்புடைய செதுக்கப்பட்ட படிமம் என்ற மூலத்தின் பொருளைப் பாதுகாக்கிறது.
- issue: தெய்வீகப் பெயர் יְהוָה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் உள்ளது. ஒலிபெயர்ப்பு அந்த வேறுபாட்டைக் காக்கிறது.
- issue: ஆலயத்தில் தேவனுடைய பெயரை வைப்பது
  choice: என் பெயரை என்றென்றும் நிலைநிறுத்துவேன்
  alternative: நான் என்றென்றும் குடியிருப்பேன்
  rationale: தேவனுடைய இருப்பின் இயல்பை விளக்கி முடிவுசெய்யாமல், மூலத்தின் ‘பெயரை வைப்பது’ என்ற ஆலயத் தத்துவ மொழியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகளைத் தெளிவாக வைத்தபடியே தமிழ் மேற்கோள் அமைப்புக்கு ஏற்ற சொல்வரிசை பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
