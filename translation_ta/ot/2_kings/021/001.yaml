base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: ta
  text: மனாசே அரசனானபோது அவனுக்குப் பன்னிரண்டு வயது. அவன் எருசலேமில் ஐம்பத்தைந்து ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் எப்சிபா[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எப்சிபா” என்பதற்கு ஏறத்தாழ “அவளில் எனக்கு மகிழ்ச்சி” என்று பொருள்.
    reason: பெயரின் எபிரேயப் பொருளை விளக்கும் பண்பாட்டுக் குறிப்பு. ஆங்கில ஆலோசனை உரையில் குறியீடு தவறாக முதல் வாக்கியத்துடன் இணைந்திருந்தாலும், குறிப்பு எப்சிபா என்ற பெயரை விளக்குவதால் தமிழில் பெயருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: அவனுக்குப் பன்னிரண்டு வயது
  rationale: இது வயதைக் குறிக்கும் வழக்கமான எபிரேய மரபுத்தொடர். சொல்லுக்குச் சொல் மொழிபெயர்ப்பதைவிட இயல்பான நவீனத் தமிழில் அதன் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: இச்சொல் அவனுடைய ஆட்சி தொடங்கிய காலத்தைக் குறிக்கிறது; அரச பதவியை ஏற்றதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: ஐம்பத்தைந்து ஆண்டுகள்
  rationale: எபிரேய இணைப்பு எண்ணை இயல்பான நவீனத் தமிழ் எண்ணமைப்பில் தருகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசரின் ஆட்சிக்காலத்தைச் சுட்டும் מלך என்ற வினையின் சூழலுக்கேற்ற இயல்பான தமிழாக்கம்.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைக் குறிக்கும் ב முன்னொட்டையும் ஊர்ப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: எபிரேய அரசர் வரலாற்றுக் குறிப்பின் தகவலை இயல்பான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கிறது.
- source_word: חֶפְצִי בָהּ
  choice: எப்சிபா
  rationale: பெயரின் எபிரேய ஒலியைத் தமிழில் ஒலிபெயர்க்கிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
