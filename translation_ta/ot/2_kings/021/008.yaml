base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: ta
  text: “இஸ்ரவேலின் காலடியை, நான் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த நாட்டிலிருந்து மீண்டும் அலைந்து திரியச் செய்யமாட்டேன்[a]; ஆனால், நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தின்படியும், என் ஊழியனாகிய மோசே அவர்களுக்குக் கட்டளையிட்ட திருச்சட்டம் முழுவதின்படியும் செய்ய அவர்கள் கவனமாக இருந்தால் மட்டுமே.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, ‘இஸ்ரவேலின் காலடியை அலைந்து திரியச் செய்யமாட்டேன்.’ இது அவர்களை நாட்டிலிருந்து இடம்பெயரச் செய்வதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: மீண்டும் … செய்யமாட்டேன்
  rationale: லֹא உடன் வரும் יסף, ஒரு செயலை மறுபடியும் செய்யமாட்டேன் என்ற பொருளைத் தருகிறது; இயல்பான தமிழில் ‘மீண்டும் … செய்யமாட்டேன்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் காலடி … அலைந்து திரியும்படி
  rationale: ‘இஸ்ரவேலின் காலடி’ என்ற எபிரெய உருவகத்தையும் ஒருமை வடிவையும் காத்து, இடம்பெயரச் செய்வதைக் குறிக்கும் வினையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאֲדָמָה
  choice: நாடு
  rationale: இங்கு முன்னோர்களுக்குக் கொடுக்கப்பட்ட உடன்படிக்கைசார் பிரதேசத்தைக் குறிப்பதால் ‘மண்’ என்பதற்குப் பதில் ‘நாடு’ பொருத்தமானது.
- source_word: לַאֲבוֹתָם
  choice: அவர்களுடைய முன்னோர்கள்
  rationale: எபிரெய மொழியில் ‘தந்தையர்’ என்பது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் உடன்படிக்கைசார் சொற்றொடர்; நவீன தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רַק אִם
  choice: இருந்தால் மட்டுமே
  rationale: நிபந்தனையின் கட்டுப்படுத்தும் வலிமையை வெளிப்படையாகக் காக்கிறது.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: செய்ய அவர்கள் கவனமாக இருந்தால்
  rationale: שמר + infinitive என்பது ஒன்றைச் செய்வதில் கவனமாக இருப்பதைக் குறிக்கிறது; கீழ்ப்படிதலை மட்டும் சுருக்கமாகக் கூறாமல் கவனத்தையும் காக்கிறது.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִים
  choice: நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தின்படியும்
  rationale: כְּ முன்னொட்டு குறிக்கும் ‘அதற்கிணங்க’ என்ற பொருளையும் கட்டளையின் முழுமையையும் காக்கிறது.
- source_word: וּלְכָל הַתּוֹרָה
  choice: முழுத் திருச்சட்டத்தின்படியும்
  rationale: மோசேயுடன் தொடர்புடைய இந்தச் சூழலில் תּוֹרָה என்பது வழங்கப்பட்ட சட்டம்/போதனையின் முழுத் தொகுப்பைக் குறிக்கிறது; ‘திருச்சட்டம்’ அதன் மதச்சார்ந்த உடன்படிக்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדִּי מֹשֶׁה
  choice: என் ஊழியனாகிய மோசே
  rationale: மூலத்தின் கௌரவப் பட்டத்தை மேலதிக இறையியல் பொருள் சேர்க்காமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: நாட்டில் இஸ்ரவேல் தொடர்ந்து நிலைத்திருப்பதற்கான நிபந்தனை
  choice: கடவுளும் மோசே வழியாகக் கொடுக்கப்பட்ட திருச்சட்டமும் விதித்த அனைத்தையும் கவனமாகச் செய்வது உண்மையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இந்த நிபந்தனையை வெறும் சொல்லாட்சியாகக் கருதுதல் அல்லது நிபந்தனையற்ற வாக்குறுதியுடன் ஒத்திசைக்க அதன் வலிமையைக் குறைத்தல்.
  rationale: רַק אִם தெளிவான கட்டுப்படுத்தும் நிபந்தனையை அறிமுகப்படுத்துகிறது. வாக்குறுதியும் கீழ்ப்படிதலுக்கான நிபந்தனையும் இடையே உள்ள இறையியல் இழுபறியை வசனம் உள்ளபடியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயத்தின் ஒருமை உருவகமான ‘இஸ்ரவேலின் காலடி’ காக்கப்பட்டுள்ளது; நிபந்தனை ‘இருந்தால் மட்டுமே’ என்று வெளிப்படையாக வழங்கப்பட்டுள்ளது. முக்கிய உரையிலுள்ள [a], [b] குறிப்புகள் அடிக்குறிப்புகளுடன் சரியாகப் பொருந்துகின்றன.
