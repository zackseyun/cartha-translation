- from: “இஸ்ரவேலின் காலடி நான் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த நாட்டைவிட்டு மீண்டும் அலைந்து திரியும்படி செய்யமாட்டேன்[a]—நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தின்படியும், என் ஊழியனாகிய மோசே அவர்களுக்குக் கட்டளையிட்ட முழுத் திருச்சட்டத்தின்படியும்[b] செய்ய அவர்கள் கவனமாக இருந்தால் மட்டுமே.”
  to: “இஸ்ரவேலின் காலடியை, நான் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த நாட்டிலிருந்து மீண்டும் அலைந்து திரியச் செய்யமாட்டேன்[a]; ஆனால், நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தின்படியும், என் ஊழியனாகிய மோசே அவர்களுக்குக் கட்டளையிட்ட திருச்சட்டம் முழுவதின்படியும் செய்ய அவர்கள் கவனமாக இருந்தால் மட்டுமே.”
  rationale: Tamil grammar requires the caused noun to be marked and the causative infinitive to be formed directly. The revision therefore changes ‘காலடி ... அலைந்து திரியும்படி செய்யமாட்டேன்’ to ‘காலடியை ... அலைந்து திரியச் செய்யமாட்டேன்,’ without altering the Hebrew singular body-part image. The conditional force of רַק אִם remains explicit in ‘இருந்தால் மட்டுமே.’ Footnote b is retained as supplied, though it has no anchor in the verse because it documents the lexical decision for ‘திருச்சட்டம்.’
