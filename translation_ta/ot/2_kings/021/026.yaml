  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: ta
  text: அவனை உஸ்ஸாவின் தோட்டத்தில் உள்ள அவனுடைய கல்லறையில்[b] அடக்கம் செய்தார்கள்[a]. அவனுக்குப் பதிலாக அவனுடைய மகன் யோசியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் சொல்லுக்கு சொல், “அவன் அவனை அடக்கம் செய்தான்.” இங்கு அடக்கம் செய்தவர் யார் என்பது குறிப்பிடப்படாததால், தமிழில் இயல்பான பொதுப்பன்மை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய அடக்க இடத்தில்” அல்லது “அவனுடைய கல்லறையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை இலக்கண வடிவில் மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், சூழலில் அடக்கம் செய்தவர் யார் என்பது குறிப்பிடப்படவில்லை. நவீனத் தமிழில் இத்தகைய பொதுவான செய்பவரைக் குறிக்கப் பன்மை இயல்பாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: קְבֻרָתוֹ
  choice: அவனுடைய கல்லறை
  rationale: இச்சொல் அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கிறது. ‘கல்லறை’ என்பது சுருக்கமான, இயல்பான தமிழ்; ‘அடக்க இடம்’ என்ற பரந்த பொருள் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: גַן עֻזָּא
  choice: ஊசாவின் தோட்டம்
  rationale: எபிரெய இணைப்புத் தொடரின் உடைமை உறவு இயல்பான தமிழில் நேரடியாகத் தரப்பட்டுள்ளது. ‘ஊசா’ என்பது עֻזָּא என்பதன் ஒலிபெயர்ப்பு.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு வினை அரசாட்சிக் காலம் முழுவதையும் அல்ல, ஆட்சிப் பொறுப்பை ஏற்றதை—அரசனாகப் பதவியேற்றதை—குறிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: இச்சொற்றொடர் ஆட்சியில் ஒருவருக்குப் பின் மற்றொருவர் அவருடைய இடத்தை ஏற்ற வாரிசுரிமையைக் குறிக்கிறது; ‘அவனுக்குப் பதிலாக’ என்பது அந்த மாற்றத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
