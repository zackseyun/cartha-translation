  to: ஆமோன் அரசனானபோது அவனுக்கு இருபத்திரண்டு வயது. அவன் எருசலேமில் இரண்டு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் மெஷுல்லேமேத்; அவள் யோத்பாவைச் சேர்ந்த ஹாரூசின் மகள்.
