translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்று அரசவம்சக் குறிப்புக்கேற்ற கண்ணியமான, நேரடியான நடை. மூலத்தின் இரண்டு வாக்கிய அமைப்பைப் பேணி, இறுதி உறவுமுறை மற்றும் ஊர்த் தோற்றக் குறிப்பை தமிழில் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
