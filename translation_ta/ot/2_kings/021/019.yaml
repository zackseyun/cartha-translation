  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אָמ֣וֹן בְּ/מָלְכ֔/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מְשֻׁלֶּ֥מֶת בַּת חָר֖וּץ מִן יָטְבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: ta
  text: ஆமோன் அரசனானபோது அவனுக்கு இருபத்திரண்டு வயது. அவன் எருசலேமில் இரண்டு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் மெஷுல்லேமேத்; அவள் யோத்பாவைச் சேர்ந்த ஹாரூசின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: அவனுக்கு இருபத்திரண்டு வயது
  rationale: எபிரெய மொழியின் வழக்கமான வயதைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் ஆட்சியேற்ற காலத்தைக் குறிக்கிறது; ‘அரசனானபோது’ என்பது சுருக்கமான இயல்பான தமிழ்.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரச பட்டத்தை வெறுமனே கொண்டிருந்ததைக் காட்டிலும் அரசனாக ஆட்சி புரிந்ததைக் குறிக்கும் வினையின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தமிழின் ஏழாம் வேற்றுமை உருபுடன் இயல்பாகத் தருகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: வம்சக் குறிப்பின் பொருளைப் பேணிக்கொண்டு நவீனத் தமிழ் சொல் வரிசையைப் பயன்படுத்துகிறது.
- source_word: מְשֻׁלֶּמֶת
  choice: மெசுல்லேமேத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת חָרוּץ
  choice: ஆரூசின் மகள்
  rationale: வழக்கமான தந்தைவழி உறவுக் குறிப்பைத் தெளிவாக வழங்குகிறது; חָרוּץ பெயரின் தொடக்க மெய்யை எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘ஆ’ தொடக்கத்துடன் தருகிறது.
- source_word: מִן יָטְבָה
  choice: யாத்பாவைச் சேர்ந்த
  rationale: מִן குறிக்கும் ஊர்த் தோற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது; இவ்வமைப்பு ஊர் ஆரூசுடன் தொடர்புடையது என்பதை மூலத்தின் சொல் அண்மைக்கு ஏற்ப வைத்திருக்கிறது.
