  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: ta
  text: “யூதாவின் அரசனான மனாசே இந்த அருவருப்பான செயல்களைச் செய்ததாலும், தனக்கு முன்பிருந்த எமோரியர் அனைவரும் செய்ததைவிட அதிகத் தீமை செய்ததாலும், தன் அருவருக்கத்தக்க சிலைகளால்[a] யூதாவையும் பாவம் செய்ய வைத்ததாலும்,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருக்கத்தக்க சிலைகள்” என்பதற்கான எபிரெயச் சொல் சிலைகளை இழிவாகக் குறிப்பிடுகிறது; “அசுத்தமான சிலைகள்” அல்லது இன்னும் சொல்லுக்கு நெருக்கமாக “சாணச் சிலைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: செய்ததாலும்
  rationale: அடுத்த வசனத்தில் வரும் தீர்ப்புக்கான காரணங்களை அறிமுகப்படுத்துகிறது. மூன்று காரணக் கூறுகளையும் ‘-தாலும்’ என இணைப்பது தமிழில் இயல்பாகவும் மூலத்தின் காரணப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான மனாசே
  rationale: பெயரையும் அரச பட்டத்தையும் இயல்பான நவீனத் தமிழ் சொற்றொடரில் வைத்துள்ளது.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: இந்த அருவருப்பான செயல்கள்
  rationale: תּוֹעֵבָה என்பதிலுள்ள கடுமையான வெறுப்புக்குரிய தன்மையைத் தக்கவைக்கிறது; சூழலில் செயல்களைக் குறிக்கும் என்பதையும் தெளிவாக்குகிறது.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: அனைவரும் செய்ததைவிட அதிகத் தீமை செய்தான்
  rationale: הֵרַע என்பதன் தீமை செய்தல் என்ற வினை வலிமையையும் מִן குறிக்கும் ஒப்பீட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு கூட்டுப்பொருளில் வருவதால் தமிழின் மரியாதை/பன்மை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר לְפָנָיו
  choice: தனக்கு முன்பிருந்த
  rationale: மனாசேக்கு முன்னர் நாட்டில் இருந்த மக்களைக் குறிக்கும் கால முன்னுரிமையை, தேவையற்ற விளக்கச் சேர்க்கையின்றி வெளிப்படுத்துகிறது.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: யூதாவையும் பாவம் செய்ய வைத்தான்
  rationale: 'חטא என்பதன் ஹிஃபில் causative வடிவத்தைத் தெளிவாகக் காக்கிறது: யூதா பாவம் செய்தது மட்டுமல்ல, மனாசே அதற்கு வழிவகுத்தான்.'
- source_word: בְּגִלּוּלָיו
  choice: தன் அருவருக்கத்தக்க சிலைகளால்
  rationale: בְּ என்பதன் கருவிப் பொருளை ‘-ஆல்’ மூலம் காட்டுகிறது. גִּלּוּלִים என்பதிலுள்ள இழிவான, வெறுப்பூட்டும் தொனியை ‘அருவருக்கத்தக்க’ என முதன்மை உரையிலேயே ஓரளவு பாதுகாக்கிறது.
theological_decisions:
- issue: גִּלּוּלִים என்பதன் இழிவுபடுத்தும் வலிமை
  choice: அருவருக்கத்தக்க சிலைகள்
  alternative: சிலைகள்; அசுத்தமான சிலைகள்; சாணச் சிலைகள்
  rationale: வெறும் ‘சிலைகள்’ என்பது மூலச்சொல்லின் கடுமையான இழிவுத் தொனியை இழக்கும். ‘சாணச் சிலைகள்’ மிகச் சொற்பிறப்புசார் மற்றும் தமிழில் தவறாக நேர்ப்பொருள் கொள்ளப்படலாம். ‘அருவருக்கத்தக்க சிலைகள்’ பொருளையும் தொனியையும் இயல்பாகச் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், தீர்க்கதரிசனக் குற்றச்சாட்டின் கண்ணியமான கடுமையைத் தக்கவைத்தும் அமைக்கப்பட்டது. இது அடுத்த வசனத்தில் தொடரும் காரணத் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
