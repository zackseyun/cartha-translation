  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: ta
  text: 'யாவே தம் ஊழியர்களாகிய இறைவாக்கினர்கள் மூலம் உரைத்தார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: உரைத்தார்
  rationale: דבר என்பதன் பியேல் வடிவம் ‘பேசுதல்/உரைத்தல்’ எனப் பொருள்படும். அடுத்த வசனத்தில் தொடங்கும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் கண்ணியமான இயல்பான தமிழ் வடிவமாக ‘உரைத்தார்’ உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ என்று தருகிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: சொல்லுக்குச் சொல் ‘கையால்’ என்றாலும், இங்கு எபிரெய மொழிவழக்கு செயலாற்றும் ஊடகத்தையோ முகவரையோ குறிக்கிறது. தமிழில் ‘மூலம்’ என்பதே அதன் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: עֲבָדָיו
  choice: தமது ஊழியர்களான
  rationale: இங்கு עבד என்பது இறைவனுக்குப் பணிபுரிய நியமிக்கப்பட்டவர்களைக் குறிக்கிறது; ‘ஊழியர்கள்’ அந்தச் சேவை உறவைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது. ‘தமது’ என்பது யாவேவையே சுட்டுகிறது.
- source_word: הַנְּבִיאִים
  choice: இறைவாக்கினர்கள்
  rationale: נביאים என்பது கடவுளின் செய்தியை அறிவிக்கும் தீர்க்கதரிசிகளைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகப் புரியும் ‘இறைவாக்கினர்கள்’ தேர்ந்தெடுக்கப்பட்டது; இது ‘ஊழியர்கள்’ யார் என்பதை விளக்கும் இணைப்பெயராக அமைந்துள்ளது.
- source_word: לֵאמֹר
  choice: 'உரைத்ததாவது:'
  rationale: இந்த எபிரெய வடிவம் தொடர்ந்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. வசனம் இங்கே முடிந்தாலும் கூற்று அடுத்த வசனத்தில் வருவதால், ‘உரைத்ததாவது:’ என்ற வடிவமும் முக்காற்புள்ளியும் அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; நவீனத் தமிழில் ஏற்ற ஒலிவடிவமாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. எபிரெய மொழிவழக்கான ‘கையால்’ என்பதை அசட்டையாகச் சொல்லுக்குச் சொல் தராமல், அதன் முகவர்/ஊடகப் பொருளை ‘மூலம்’ என இயல்பாக்குகிறது. வசனம் அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
