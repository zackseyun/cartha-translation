source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: ta
  text: 'ஆகையால், இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: “இதோ, எருசலேமின் மீதும் யூதாவின் மீதும் நான் பேரழிவை வரச் செய்கிறேன்[a]. அதைப் பற்றிக் கேட்கிற ஒவ்வொருவருடைய இரு காதுகளும் கூசும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேரழிவு’ என்பதற்கு ‘கேடு’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒழுக்கரீதியான தீமையை அல்ல, தண்டனைத் தீர்ப்பாக வரும் அழிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இரு காதுகளும் கூசும்’ என்பது அந்தச் செய்தியைக் கேட்பவர் கடும் அதிர்ச்சியும் திகிலும் அடைவார் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய சூழலில் கூறப்பட்டவற்றின் விளைவாக இந்தத் தீர்ப்பு வருவதைச் சுட்டும் காரணவிளைவுத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரபூர்வமான அறிவிப்புத் தன்மையை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் நேரடியாகவும் மொழிபெயர்க்கிறது.
- source_word: הִנְנִי
  choice: இதோ, ... நான்
  rationale: வரவிருக்கும் இறைச்செயலை வலியுறுத்தி கவனத்திற்கு கொண்டுவரும் மூலத்தின் சுட்டும் ஆற்றலைப் பாதுகாக்கிறது.
- source_word: מֵבִיא
  choice: வரச் செய்கிறேன்
  rationale: הִנְנִי உடன் வரும் பங்கெச்சம் குறிக்கும் உடனடியாக நிகழவிருக்கும் செயலும், பேரழிவை யாவே கொண்டுவருகிறார் என்ற காரணவியல் பொருளும் வெளிப்படுகின்றன.
- source_word: רָעָה
  choice: பேரழிவு
  rationale: இங்கு ஒழுக்கரீதியான தீமையை அல்ல, தண்டனைத் தீர்ப்பாக வரும் கடும் அழிவைக் குறிக்கிறது.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: எருசலேமின்மீதும் யூதாவின்மீதும்
  rationale: தீர்ப்பு இந்த இடங்கள்மீது விழுவதைக் குறிக்கும் עַל என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל שֹׁמְעָיו
  choice: இதைக் கேட்கிற ஒவ்வொருவரும்
  rationale: கேட்கப்படும் செய்தி அல்லது நிகழ்வைச் சுட்டும் பின்னொட்டின் குறிப்பைத் திட்டவட்டமாக வரையறுக்காமல், மூலத்தின் பொதுவான சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: இரு காதுகளும் அதிரும்
  rationale: அதிர்ச்சியூட்டும் செய்தியைக் கேட்டவுடன் காதுகளில் ஏற்படும் உணர்வைச் சித்தரிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைத்தீர்ப்புச் சூழலில் רָעָה என்பதன் பொருள்
  choice: பேரழிவு
  alternative: தீமை; கேடு; துன்பம்
  rationale: சூழல் யாவே ஒழுக்கத் தீமையைச் செய்கிறார் என்று கூறாமல், தண்டனைத் தீர்ப்பாக அழிவைக் கொண்டுவருவதாகக் கூறுகிறது. ‘பேரழிவு’ அந்தச் சூழல்பொருளைத் தெளிவாகத் தருகிறது.
- issue: கேட்கப்படும் ‘இது’ எதைக் குறிக்கிறது
  choice: இதைக் கேட்கிற
  alternative: இந்தப் பேரழிவைப் பற்றிக் கேட்கிற; இந்தச் செய்தியைக் கேட்கிற
  rationale: எபிரெயப் பின்னொட்டின் குறிப்பு முற்றிலும் வெளிப்படையாக இல்லை. ‘இது’ என்பது பேரழிவையோ அதன் செய்தியையோ குறிக்க இடமளிப்பதால் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளையில் தீர்க்கதரிசன அறிவிப்புக்கேற்ற கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘இதோ’ என்ற உயர்நடைச் சொல் மூலத்தின் வலியுறுத்தலைப் பாதுகாப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளது; மற்ற சொற்றொடர்கள் தற்போதைய வாசகர்களுக்கு எளிதாக அமைக்கப்பட்டுள்ளன.
