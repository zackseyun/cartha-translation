  source_fidelity: 'மையக் கருத்து துல்லியமாக உள்ளது: לָכֵן-இன் காரணவிளைவு, யாவே என்ற இறைப்பெயர், எருசலேமும் யூதாவும் மேல் வரவிருக்கும் தண்டனைப் பேரழிவு, மற்றும் அதிர்ச்சியை உணர்த்தும் காதுகள் குறித்த எபிரெய மரபுத்தொடர் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் תִּצַּלְנָה என்பதற்கு ‘அதிரும்’ என்பது காதுகள் உடலளவில் அசைவதைக் குறிப்பதுபோல் இருக்கிறது; இச்சூழலின் நிலையான மரபுத்தொடர்பொருளை ‘கூசும்’ மிகச் சரியாகக் கொடுக்கிறது.'
  naturalness: ‘எருசலேமின் மீதும் யூதாவின் மீதும்’ என இடைவெளியுடன் எழுதுவது நவீன பொதுத்தமிழில் இயல்பாகும். ‘அதைப் பற்றிக் கேட்கிற’ என்பது நிகழ்வின் செய்தியைக் கேட்பதைக் காட்டுகிறது; ஆயினும் மூலத்தின் சுட்டுப்பொருளை அளவுக்கு மீறி விளக்கவில்லை. ‘இரு காதுகளும் கூசும்’ தமிழில் நிலைபெற்ற, அதிர்ச்சியூட்டும் செய்தியால் ஏற்படும் உணர்வைக் குறிக்கும் நடை.
