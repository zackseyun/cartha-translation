  terminology: Use “யாவே” for יהוה in accordance with the stated POB policy. “குற்றமற்ற இரத்தம்,” “பாவம் செய்ய வைத்து,” and “யாவேயின் பார்வையில் தீமையானதை” preserve the legal-moral, causative, and evaluative senses of the Hebrew.
