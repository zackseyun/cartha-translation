base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: ta
  text: மேலும், மனாசே குற்றமற்ற இரத்தத்தை எருசலேமை ஒரு முனையிலிருந்து மறுமுனைவரை நிரப்பும் அளவுக்கு மிக அதிகமாகச் சிந்தினான்[a]. யூதாவைப் பாவம் செய்ய வைத்து, யாவேயின் பார்வையில் தீமையானதைச் செய்யச் செய்த அவனுடைய பாவத்துக்கு அப்பாற்பட்டும் அவன் இவ்வாறு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “எருசலேமை வாயிலிருந்து வாய்வரை நிரப்பினான்.” இது நகரம் முழுவதையும், ஒரு முனையிலிருந்து மறுமுனைவரை, குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய குற்றங்களோடு இன்னொரு கடுமையான குற்றத்தைச் சேர்த்துக் கூறும் இணைப்பு மற்றும் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דָּם נָקִי
  choice: குற்றமற்றவர்களின் இரத்தம்
  rationale: மரணத் தண்டனைக்குரிய குற்றம் செய்யாதவர்களைக் கொன்ற சட்ட-அறநெறி சார்ந்த கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׁפַךְ
  choice: சிந்தினான்
  rationale: இரத்தம் சிந்துதல் என்ற எபிரெய மரபுத்தொடரின் கொலை சார்ந்த பொருளைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிக அதிகமாக
  rationale: இரட்டை வலியுறுத்தல் காட்டும் இரத்தப்பெருக்கின் அளவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: எருசலேமை ஒரு முனையிலிருந்து மறுமுனைவரை நிரப்பினான்
  rationale: ‘வாயிலிருந்து வாய்வரை’ என்ற சொல்லர்த்த மரபுத்தொடர் நகரம் முழுவதும் அல்லது ஒரு எல்லையிலிருந்து மற்ற எல்லைவரை என்பதைக் குறிக்கிறது; அதன் பொருளைத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: இது தவிர ... பாவத்தையும்
  rationale: இரத்தப்பழி, ஏற்கெனவே குறிப்பிடப்பட்ட அவனுடைய பாவத்துக்கு மேலாகச் சேரும் தனிக் குற்றம் என்பதை வெளிப்படுத்துகிறது; எபிரெய ஒருமை ‘பாவம்’ பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: யூதாவைப் பாவம் செய்யச் செய்து
  rationale: חטא என்பதன் ஹிஃபில் வினைவடிவிலுள்ள காரணவினைப் பொருளையும் மனாசேயின் செயற்பாட்டு பொறுப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்ய வைத்த
  rationale: யூதாவின் பாவத்தின் செயல்பாட்டு உள்ளடக்கம் அல்லது விளைவைத் தெரிவிக்கும் எபிரெய infinitive அமைப்பை இயல்பான தமிழ் காரணவினைத் தொடரில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: எபிரெய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தைத் தமிழில் புரியும்படி பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் திருப்பெயரைப் பட்டத்தால் மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: הֶחֱטִיא என்பதில் மனாசேயின் குற்றப்பொறுப்பின் வலிமை
  choice: யூதாவைப் பாவம் செய்யச் செய்து
  alternative: யூதாவைப் பாவத்திற்குள் வழிநடத்தி
  rationale: ஹிஃபில் காரணவினையின் வலிமையை மென்மையாக்காமல், யூதாவின் பாவத்தில் மனாசே செயற்பாட்டுக் காரணமாக இருந்ததைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இரத்தம் ‘எருசலேமை நிரப்பியது’ என்ற மூலத்தின் தீவிரமான உருவகம் பாதுகாக்கப்பட்டுள்ளது; காரணவினைத் தொடர் மனாசேயின் நேரடியான பொறுப்பைத் தெளிவாக்குகிறது.
