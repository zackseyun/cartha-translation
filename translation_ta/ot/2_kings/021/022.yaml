base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: ta
  text: அவன் தன் தந்தையரின்[b] கடவுளான யாவேவை கைவிட்டு[a], யாவேயின் வழியில் நடக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துறந்து.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவனுடைய தந்தையரின் கடவுள்’; சூழலின்படி, ‘அவனுடைய முன்னோரின் கடவுள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: கைவிட்டு
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இங்கு கடவுளுக்கு உண்மையற்றுப் போன கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: தன் தந்தையரின் கடவுள்
  rationale: எபிரெய மொழியின் ஆண்பால் பன்மை குடும்பச் சொல்லையும், உடைமை உறவையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְלֹא הָלַךְ
  choice: நடக்கவில்லை
  rationale: הלך என்பதிலுள்ள ‘நடத்தையை/வாழ்க்கை முறையைப் பின்பற்றுதல்’ என்ற உடன்படிக்கைசார் உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: யாவேயின் வழியில்
  rationale: דרך என்பதன் வாழ்க்கை முறை அல்லது கடவுள் காட்டிய பாதை என்ற உருவகப் பொருளை இயல்பாகவும் வெளிப்படையாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யாவே’ என்பது பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்புக்கு நெருக்கமான தமிழ் வடிவம்.
- issue: אֲבֹתָיו என்பதிலுள்ள முன்னோர் குறிப்பு
  choice: தன் தந்தையர்
  alternative: தன் முன்னோர்
  rationale: மூலத்தின் ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது; அதேவேளை, இச்சூழலில் அது முந்தைய தலைமுறைகளைச் சுட்டலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழியில் நடக்கவில்லை’ என்ற வேதாகம உருவகம் புரியத்தக்கவாறு அப்படியே பாதுகாக்கப்பட்டுள்ளது; ‘தன்’ என்பது கர்த்தாவை அல்ல, வாக்கியத்தின் ஆண் எழுவாயைக் குறிக்கிறது.
