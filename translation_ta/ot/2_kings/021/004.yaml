  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்தில் பலிபீடங்களைக் கட்டினான்; அதைக் குறித்து யாவே, “எருசலேமில் என் பெயரை வைப்பேன்” என்று கூறியிருந்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “யாவேயின் வீட்டில்.” இங்கே அது யாவேயின் ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயரை வைப்பேன்” என்பது, யாவே தமது பெயருடனும் பிரசன்னத்துடனும் இணைத்துத் தேர்ந்தெடுத்த இடத்தைக் குறிக்கும் ஆலய-உடன்படிக்கைச் சொல்லாக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָה
  choice: அவன் கட்டினான்
  rationale: בנה என்பதன் Qal தொடர்வினை வடிவம் கதையின் அடுத்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான கதைநடைக்காக தொடக்க இணைப்புச் சொல் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: מִזְבְּחֹת
  choice: பலிபீடங்கள்
  rationale: מִזְבֵּחַ என்பதன் பன்மை; பலி செலுத்துவதற்கான பீடங்களைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘யாவேயின் வீட்டில்.’ இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிப்பதால், நவீனத் தமிழில் தெளிவாக ‘ஆலயத்தில்’ என மொழிபெயர்க்கப்பட்டது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: யாவே ... என்று கூறியிருந்த அந்த ஆலயத்தில்
  rationale: יחסுச் சொல் אֲשֶׁר முன் வந்த ‘யாவேயின் ஆலயம்’ என்பதுடன் இணைக்கப்படுகிறது. இறைவனின் கூற்று மனாசேயின் செயலுக்கு முன்பே கூறப்பட்டதை ‘கூறியிருந்த’ வெளிப்படுத்துகிறது. இயல்பான தமிழுக்காக உறவுத்தொடர் பெயர்ச்சொல்லுக்கு முன் அமைக்கப்பட்டுள்ளது.
- source_word: בִּירוּשָׁלַם
  choice: எருசலேமில்
  rationale: ב முன்னொட்டு இடத்தைக் குறிக்கிறது; மூலத்தின் வலியுறுத்தலுக்கு ஏற்ப மேற்கோளின் தொடக்கத்தில் வைக்கப்பட்டுள்ளது.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: என் பெயரை வைப்பேன்
  rationale: மூலத்திலுள்ள ‘என் பெயரை வைப்பேன்’ என்ற ஆலய-உடன்படிக்கை மரபுச் சொல்லாக்கம் விளக்கவுரையாக விரிக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே பயன்படுத்துகிறது. அதனை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: ‘என் பெயரை வைப்பேன்’ என்பதிலுள்ள ஆலய இறையியல்
  choice: மூல உருவகத்தை ‘என் பெயரை வைப்பேன்’ என்று தக்கவைத்தல்
  alternative: என் பிரசன்னத்தை நிலைநிறுத்துவேன்; என் பெயரை அங்கே குடியிருக்கச் செய்வேன்
  rationale: இச்சொற்றொடர் தேவன் தமது பெயருடனும் பிரசன்னத்துடனும் இணைத்துத் தேர்ந்தெடுத்த இடத்தைக் குறிக்கிறது. எனினும், மூல உரை அந்தக் கருத்தை விளக்கவுரையாக விரிக்காததால் மொழிபெயர்ப்பும் அதன் இறையியல் செறிவையும் திறந்த தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தமிழின் இயல்பான உறவுத்தொடர் அமைப்புக்காக வாக்கிய வரிசை மாற்றப்பட்டாலும், எருசலேம், ஆலயம், தெய்வீகப் பெயர் ஆகியவற்றுக்கிடையிலான மூலத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
