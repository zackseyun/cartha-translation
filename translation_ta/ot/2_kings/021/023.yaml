  text: וַ/יִּקְשְׁר֥וּ עַבְדֵֽי אָמ֖וֹן עָלָ֑י/ו וַ/יָּמִ֥יתוּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/023.yaml
  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: ta
  text: ஆமோனின் ஊழியர்கள் அவருக்கு எதிராகச் சதிசெய்து[a], அரசனை அவரது வீட்டிலேயே கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு எதிராகத் திட்டமிட்டார்கள்.”
    reason: கשר என்பதற்கான “சதிசெய்து” என்ற தேர்வுடன் இணைந்துள்ள ‘plotted against him’ என்னும் சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: சதித்திட்டம் தீட்டி
  rationale: அரசியல் சூழலில் קשר என்பது ஒருவருக்கு எதிராகச் சதி செய்வதைக் குறிக்கிறது; இத்தமிழ்ச் சொற்றொடர் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַבְדֵי אָמוֹן
  choice: ஆமோனின் ஊழியர்கள்
  rationale: עבדים என்பதன் அடிப்படைப் பொருளையும் ஆமோனுடனான உடைமைத் தொடர்பையும் காக்கிறது; ‘அதிகாரிகள்’ என்பது சற்றுக் கூடுதலான விளக்கமாகிவிடும்.
- source_word: עָלָיו
  choice: அவருக்கு எதிராக
  rationale: சதியைக் குறிக்கும் வினையுடன் על, பகைமையான செயல் யாருக்கு எதிராக இருந்தது என்பதைக் காட்டுகிறது.
- source_word: וַיָּמִיתוּ
  choice: கொன்றுபோட்டார்கள்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் மரணத்தை ஏற்படுத்திய செயலைக் குறிக்கிறது; தமிழில் இது நேரடியாகவும் இயல்பாகவும் வெளிப்படுகிறது.
- source_word: אֶת־הַמֶּלֶךְ
  choice: அரசனை
  rationale: எபிரெய மூலத்தில் பெயருக்குப் பதிலாக வரும் அதிகாரப்பூர்வப் பட்டத்தை அப்படியே காக்கிறது.
- source_word: בְּבֵיתוֹ
  choice: அவனுடைய அரண்மனையிலேயே
  rationale: அரசனைப் பற்றிய சூழலில் בַּיִת என்பது அரச இல்லம் அல்லது அரண்மனையைக் குறிக்க இயலும்; ‘-இலேயே’ என்பது அவனுக்குச் சொந்தமான இடத்திலேயே கொலை நடந்ததைக் கூறும் இயல்பான தமிழ் வலியுறுத்தல்.
