revisions:
- from: ஆமோனின் ஊழியர்கள் அவருக்கு எதிராகச் சதித்திட்டம் தீட்டி, அரசனை அவனுடைய அரண்மனையிலேயே கொன்றுபோட்டார்கள்.
  to: ஆமோனின் ஊழியர்கள் அவருக்கு எதிராகச் சதிசெய்து[a], அரசனை அவரது வீட்டிலேயே கொன்றார்கள்.
  rationale: The revision removes the unsupported identification of the house as a palace, uses consistent honorific reference for Amon, and adopts a natural formal verb for the killing. It also supplies a footnote anchor for the documented lexical alternative, without adding interpretation.
  reviewer_model: gpt-5.6-terra
