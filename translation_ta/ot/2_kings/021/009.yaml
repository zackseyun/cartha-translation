base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: ta
  text: ஆனால் அவர்கள் செவிகொடுக்கவில்லை. மனாசே அவர்களை வழிதவறச் செய்து, இஸ்ரவேல் மக்களுக்கு[b] முன்னால் யாவே அழித்த தேசத்தாரைவிட அதிகத் தீமை செய்யத் தூண்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தத் தேசத்தார் செய்ததைவிடத் தீமையாக நடக்கச் செய்தான்.” எபிரெயத்தில் ஒப்பீடு ‘தேசத்தாரைவிட’ என்ற வடிவில் சுருக்கமாக உள்ளது; அது தீமை செய்தலுடனோ தீமையுடனோ இணைத்துப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்”; இங்கு இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: செவிகொடுக்கவில்லை
  rationale: இச்சொல் கேட்டலோடு அதற்கேற்பப் பதிலளித்தல் அல்லது கீழ்ப்படிதல் என்ற கருத்தையும் உள்ளடக்குகிறது. ‘செவிகொடுக்கவில்லை’ என்பது வெறும் ஒலியைக் கேட்காததைக் காட்டிலும் இந்த இரு நுணுக்கங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וַיַּתְעֵם
  choice: அவர்களை வழிதவறச் செய்து
  rationale: תעה என்பதன் காரணவினை வடிவம், மனாசே மக்களை ஒழுக்க மற்றும் ஆன்மீக வழியிலிருந்து விலகச் செய்தான் என்பதைக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: அதிகமான தீமையைச் செய்ய வைத்தான்
  rationale: சொற்றொடர் நேரடியாக ‘தீமையைச் செய்ய’ எனப் பொருள்படும்; தொடர்ந்து வரும் ஒப்பீட்டு מִן காரணமாகத் தமிழில் ‘அதிகமான’ என்பதை வெளிப்படுத்துவது பொருளை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: מִן הַגּוֹיִם
  choice: தேசத்தாரைவிட
  rationale: מִן இங்கு பிரிவைக் குறிக்காமல் ஒப்பீட்டைக் குறிக்கிறது. வரலாற்றுச் சூழலில் גּוֹיִם என்பது பிற தேசங்களை அல்லது அவற்றின் மக்களைக் குறிக்கிறது.
- source_word: הִשְׁמִיד
  choice: அழித்துப்போட்ட
  rationale: இந்த வினை அழித்தொழித்தல் என்ற வலுவான பொருளைக் கொண்டது; ‘அழித்துப்போட்ட’ என்பது முன்பு நிகழ்ந்த செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயராகிய நான்கெழுத்துப் பெயர்; பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: இஸ்ரவேலரின் முன்னிலையிலிருந்து அந்தத் தேசத்தார் அகற்றப்பட்டனர் என்ற வெற்றிகொள்ளும் சூழலுக்குரிய எபிரெய மரபுத்தொடரை இது சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கை மக்களாகிய இஸ்ரவேலரை மொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேலின் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பானதும் பொருளைச் சரியாகத் தருவதுமாகும்; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் இலக்கண வடிவம் ஆண்பாலில் இருந்தாலும், இச்சூழலில் அது இஸ்ரவேல் சமூகத்தார் அனைவரையும் குறிக்கும் பிரதிநிதித்துவச் சொல்லாக உள்ளது. இயல்பான தமிழுக்காகப் பொதுப்பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: מִן உடனான ஒப்பீட்டின் தொடர்பு
  choice: தேசத்தாரைவிட அதிகமான தீமையைச் செய்ய வைத்தான்
  alternative: தேசத்தார் செய்ததைவிடத் தீமையாக நடக்கச் செய்தான்
  rationale: எபிரெயத்தில் ஒப்பீடு சுருக்கமாகவும், ‘செய்தல்’ அல்லது ‘தீமை’ எதனுடன் ‘தேசத்தாரைவிட’ இணைகிறது என்பதில் சிறு கட்டமைப்பு நெகிழ்வுடனும் உள்ளது. முதன்மை உரை இயல்பான ஒப்பீட்டு வாசிப்பை வழங்குகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘செவிகொடுக்கவில்லை,’ ‘வழிதவறச் செய்து’ போன்ற சொற்கள் மூலத்தின் செவிசாயாமை மற்றும் செயற்படுத்தப்பட்ட வழுவுதல் ஆகிய நுணுக்கங்களைத் தக்கவைக்கின்றன. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
