  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்தின் இரண்டு முற்றங்களிலும் வானத்தின் முழுச் சேனைக்காகப் பலிபீடங்களைக் கட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்தின் முழுச் சேனைக்காக” என்பதை “வானத்தின் அனைத்துச் சேனைகளுக்காக” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய மரபுத்தொடர் வானுலகக் கூட்டத்தைக் குறிக்கிறது; இச்சூழலில், வழிபடப்பட்ட வான்கோள்களையோ வானுலக ஆற்றல்களையோ குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் கட்டினான்
  rationale: בנה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகால நிகழ்வைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்க இணைப்புச் சொல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: מִזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: பலியிடுவதற்கான பீடங்களைக் குறிக்கும் பொதுவான பன்மைச் சொல்; தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: வானத்தின் சேனைகள் அனைத்திற்கும்
  rationale: எபிரெயச் சொற்றொடரின் கூட்டுப்படை உருவகத்தையும் பன்முகத் தெளிவின்மையையும் காக்கிறது; இதை வெறும் நட்சத்திரங்கள் என்று குறுக்கவில்லை.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: இரண்டு முற்றங்களிலும்
  rationale: שְׁתֵּי குறிப்பிடும் இரண்டெண்ணை வெளிப்படையாகக் காத்து, ஆலய வளாகத்தின் இரு முற்றங்களிலும் என்ற இயல்பான தமிழ் பொருளை வழங்குகிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בֵּית என்பதன் ஆலயச் சூழல் பொருளை இயல்பான தமிழில் தருகிறது; יהוה என்ற தனிப்பெயரை யெகோவா என ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல் தனிப்பெயராகக் காக்கிறது. தமிழில் பரவலாக அறியப்படும் ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: צְבָא הַשָּׁמַיִם என்பதன் அடையாளம்
  choice: வானத்தின் சேனைகள்
  alternative: வானத்தின் எல்லா நட்சத்திரங்களும்; முழு வானுலகச் சேனை
  rationale: இச்சொற்றொடர் வான்கோள்களையோ வானுலக ஆற்றல்களையோ குறிக்கக்கூடும். குறிப்பிட்ட ஒன்றாகத் தீர்மானிக்காமல் மூலத்தின் கருத்து நெருக்கடியையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ஆலயச் சூழலுக்கு ஏற்ற ‘பலிபீடங்கள்’, ‘முற்றங்கள்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் வானுலகச் சேனை என்ற உருவகம் அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
