  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: ta
  text: அவன் தன் தந்தை நடந்த எல்லா வழிகளிலும் நடந்து, தன் தந்தை சேவித்த சிலைகளுக்கு சேவை செய்து, அவற்றுக்குப் பணிந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: அவன் தன் தகப்பன் நடந்த வழியிலெல்லாம் நடந்து
  rationale: எபிரெய மொழியின் ‘வழியில் நட’ என்ற வாழ்க்கைநடத்தைச் சுட்டும் உருவகத்தையும், ‘முழு வழி’ என்ற கருத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּעֲבֹד
  choice: வழிபட்டு
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணிசெய்’; இங்கு சிலைகளுக்குச் செய்யப்படும் சமயச் சேவையைக் குறிக்கிறது. தமிழில் ‘சிலைகளைச் சேவித்தான்’ என்பதைவிட ‘வழிபட்டான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַגִּלֻּלִים
  choice: சிலைகளை
  rationale: குறிப்பிடப்படுவது விக்கிரகங்களே என்பதைத் தெளிவாகச் சொல்லும் பொதுவான நவீனத் தமிழ் சொல். மூலச்சொல்லின் இழிவுப்படுத்தும் தொனி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: அவற்றுக்கு முன்பாகப் பணிந்தான்
  rationale: שׁחה குறிக்கும் உடலைத் தாழ்த்திப் பணியும் செயலைக் காக்கிறது; முந்தைய עבד உடன் முற்றிலும் ஒன்றாக்காமல் அதன் தனித்த செயற்பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: גִּלֻּלִים என்ற இழிவுத்தொனியுள்ள சிலைச்சொல்லின் மொழிபெயர்ப்பு
  choice: சிலைகள்
  alternative: அருவருப்பான சிலைகள்; சாணச் சிலைகள்
  rationale: மூலச்சொல் சிலைகளை இழிவாகக் குறிப்பிடுகிறது. பிரதான உரையில் இயல்பும் தெளிவும் கருதி ‘சிலைகள்’ பயன்படுத்தப்பட்டு, அதன் கடுமையான இழிவுத்தொனி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘தகப்பன்’ என்பது தலைமுறை உறவையும் உரையின் பாரம்பரியக் கண்ணியத்தையும் தெளிவாகத் தருகிறது; ஒரே சொல்லின் மீளுரைத்தல் மூலத்தின்படி காக்கப்பட்டுள்ளது.
