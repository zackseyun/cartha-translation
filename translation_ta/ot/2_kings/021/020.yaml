  source_fidelity: மூல எபிரேயத்தின் வினை, யாவேயின் மதிப்பீட்டைக் குறிக்கும் மரபுத்தொடர், மனாசேயுடனான ஒப்பீடு, மற்றும் ‘அவனுடைய தந்தை’ என்ற உறவு ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. தமிழில் ஒப்பீட்டு உட்பிரிவு முதலில் வந்தாலும் பொருளிலோ கால உறவிலோ மாற்றமில்லை.
  naturalness: ‘யாவேயின் பார்வையில் தீமையானதைச் செய்தான்’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘தன் தந்தையான மனாசே’ என்ற இணைப்பு தெளிவானது.
  terminology: யְהוָה பெயர் ‘யாவே’ எனத் தனிப்பெயராகச் சீராக வழங்கப்பட்டுள்ளது. ‘மனாசே’ பெயரொலிபெயர்ப்பும் ஏற்றது. அடிக்குறிப்பு முதன்மை உரையில் உள்ள ‘பார்வையில்’ என்பதற்கான நேரடியான எபிரேய உருவகமான ‘கண்களில்’ என்பதைச் சரியாகத் தெரிவிக்கிறது.
