source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: ta
  text: அவன் தன் தந்தையான மனாசே செய்ததைப் போலவே, யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மொழியில்: “யாவேயின் கண்களில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: வாவ் தொடர்கதை அமைப்பில் நிகழ்வை முன்னெடுக்கிறது; தமிழில் தொடக்க ‘மேலும்’ இன்றி இறந்தகால வினை இயல்பாக உள்ளது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה הרע என்ற எபிரேய மரபுத்தொடரை, பெயரடைப் பொருளையும் குறிப்பிட்ட தீய செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற மூல உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר
  choice: போலவே
  rationale: மகனின் செயலை அவன் தந்தையின் செயலோடு வலுவாக ஒப்பிடும் பொருளைத் தருகிறது.
- source_word: עָשָׂה
  choice: செய்ததை
  rationale: மனாசேயின் முந்தைய செயலை ஒப்பீட்டு உட்பிரிவாகத் தமிழில் இயல்பாகக் காட்டுகிறது; சூழல் கால முன்னுரிமையைத் தெளிவாக்குகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אָבִיו
  choice: தன் தந்தையான
  rationale: மூன்றாம் நபர் ஆண்பால் உரிமையைக் ‘தன்’ எனத் தெளிவாகக் காட்டி, மனாசே அவனுடைய தந்தை என்பதை இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, நான்கெழுத்துத் திருப்பெயரே உள்ளது; எனவே உடன்படிக்கைப் பெயரைத் தனிப்பெயராகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்துள்ளது. மூலத்தின் மதிப்பீட்டு மரபுத்தொடர் ‘பார்வையில்’ என முதன்மை உரையில் தரப்பட்டு, அதன் நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
