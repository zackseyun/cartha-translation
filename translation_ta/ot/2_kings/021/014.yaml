base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: ta
  text: என் சுதந்தரத்தில் எஞ்சியிருப்பவர்களைக் கைவிடுவேன்[a]; அவர்களை அவர்களுடைய பகைவர்களின் கையில் ஒப்புக்கொடுப்பேன். அவர்கள் தங்கள் எல்லாப் பகைவர்களுக்கும் கொள்ளைப்பொருளாகவும் சூறையாடலுக்குரிய பொருளாகவும் ஆவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விட்டுவிடுவேன்” அல்லது “கைவிட்டுவிடுவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: கைவிட்டு
  rationale: נטשׁ என்பது விட்டுவிடுதல், கைவிடுதல் என்ற நீதித்தீர்ப்பு சார்ந்த வலிமையை உடையது. ‘கைவிட்டு’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: שְׁאֵרִית
  choice: எஞ்சியவர்கள்
  rationale: שְׁאֵרִית என்பது அழிவு அல்லது தீர்ப்புக்குப் பின் மீந்துள்ள பகுதியைக் குறிக்கிறது. இங்கு மக்களைக் குறிப்பதால் ஆள்சுட்டும் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: נַחֲלָתִי
  choice: என் உரிமைப் பங்கு
  rationale: נחלה என்பது ஒதுக்கப்பட்ட உரிமைப் பங்கு அல்லது சுதந்தரத்தைக் குறிக்கிறது. கடவுளுக்குரிய மக்கள் என்ற உடைமை-உறவு நுணுக்கத்தை ‘என் உரிமைப் பங்கு’ காக்கிறது.
- source_word: וּנְתַתִּים בְּיַד
  choice: அவர்களுடைய பகைவர்களின் கையில் அவர்களை ஒப்புக்கொடுப்பேன்
  rationale: נתן ביד என்ற எபிரெய மொழிநடையில் அதிகாரத்திற்குள் ஒப்படைத்தல் அடங்கியுள்ளது. ‘கையில் ... ஒப்புக்கொடுப்பேன்’ என்பது உருவகத்தையும் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்கள் / தங்கள் பகைவர்கள்
  rationale: இரு இடங்களிலும் אויבים என்பதன் பொருள் தொடர்ந்து ‘பகைவர்கள்’ எனக் கொடுக்கப்பட்டுள்ளது; தமிழின் இயல்புக்கேற்ப உடைமைப்பெயர் மாறுகிறது.
- source_word: וְהָיוּ
  choice: ஆவார்கள்
  rationale: ஒப்புக்கொடுக்கப்பட்டதன் விளைவாக அவர்கள் கொள்ளைப்பொருளாக மாறுவதை எதிர்கால வடிவம் காட்டுகிறது.
- source_word: לְבַז
  choice: கொள்ளைப்பொருளாக
  rationale: בז என்பது பகைவர்கள் கைப்பற்றும் கொள்ளை அல்லது சூறைப்பொருளைக் குறிக்கிறது. ‘கொள்ளைப்பொருள்’ தெளிவான நவீனத் தமிழ்.
- source_word: וְלִמְשִׁסָּה
  choice: சூறையாடப்படும் பொருளாகவும்
  rationale: משסה என்பது கொள்ளையிடப்படுவதற்கு ஆளான பொருளைக் குறிக்கிறது. அருகிலுள்ள בז என்பதுடன் உள்ள ஒத்தபொருள் இரட்டிப்பை வேறுபடுத்திக் காட்ட இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: தங்கள் பகைவர்கள் அனைவருக்கும்
  rationale: לְ இங்கு அவர்களைச் சூறையாடிப் பயனடைவோருடனான உறவையும் விளைவையும் குறிக்கிறது; ‘அனைவருக்கும்’ அதன் பரந்த வரம்பைக் காக்கிறது.
theological_decisions:
- issue: ‘என் உரிமைப் பங்கு’ என்பதிலுள்ள உடன்படிக்கை சார்ந்த உடைமை நுணுக்கம்
  choice: கடவுளுக்குரிய மக்களைக் குறிக்கும் ‘என் உரிமைப் பங்கு’ என்ற சொல்லாக்கத்தை வைத்திருத்தல்
  alternative: என் சுதந்தரம் / எனக்குரிய உடைமை
  rationale: மூலச்சொல் கடவுளுக்குரிய ஒதுக்கப்பட்ட பங்கைச் சுட்டுகிறது. அதை மக்கள், நாடு அல்லது நிலம் என்று மொழிபெயர்ப்பிலேயே மேலும் குறுக்காமல், மூலத்தின் உறவுநிலையையும் இயல்பான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதைத் தொனியுடன் இயல்பாக அமைக்கப்பட்டுள்ளது. ‘கையில்’ என்ற எபிரெய உருவகம் காக்கப்பட்டாலும், அதன் அதிகாரத்திற்குள் ஒப்படைக்கும் பொருள் ‘ஒப்புக்கொடுப்பேன்’ என்பதால் தெளிவாக்கப்பட்டுள்ளது. அருகருகே வரும் இரண்டு கொள்ளைச் சொற்களின் சொல்லாட்சித் தீவிரமும் பாதுகாக்கப்பட்டுள்ளது.
