revisions:
- from: என் உரிமைப் பங்கில்[b] எஞ்சியவர்களைக் கைவிட்டு[a], அவர்களுடைய பகைவர்களின் கையில் அவர்களை ஒப்புக்கொடுப்பேன். அவர்கள் தங்கள் பகைவர்கள் அனைவருக்கும் கொள்ளைப்பொருளாகவும் சூறையாடப்படும் பொருளாகவும் ஆவார்கள்.
