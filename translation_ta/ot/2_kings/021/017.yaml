translation_notes:
  register: நவீன நிலையான தமிழில், அரச வரலாற்றுச் சூத்திரத்துக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அல்லவா?’ என்பதன் மூலம் மூலத்தின் சொல்லாட்சிசார் வினாவடிவம் காக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு தொடர்புடைய நூல் தலைப்பிற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
