base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: மனாசேயின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், அவன் செய்த பாவமும்—அவை யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதா அரசர்களின் வரலாற்றுப் பதிவேட்டில்.” எபிரெயச் சொற்றொடர் அரசர்களைப் பற்றிய அதிகாரப்பூர்வப் பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: மனாசேயின் மற்ற செயல்களும்
  rationale: அரசாட்சி நிறைவுச் சூத்திரத்தில் דִּבְרֵי என்பது வெறும் ‘சொற்கள்’ அல்ல, அரசனுடைய செயல்கள் அல்லது ஆட்சிக்கால நிகழ்வுகளைக் குறிக்கிறது. ‘மற்ற செயல்கள்’ என்பது இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: எபிரெய உறவுநிலைத் தொடரின் முழுமையைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவமும்
  rationale: எபிரெயத்தில் ஒரே வேர்ச்சொல்லைக் கொண்டு வரும் வலியுறுத்தலைத் தமிழில் இயல்பான முறையில் வழங்குகிறது; உடைமைப் பின்னொட்டின் பொருளும் காக்கப்படுகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: அவை … எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய எதிர்மறை வினாவின் வடிவத்தையும் தொனியையும் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: இது யூதா அரசர்களைப் பற்றிய காலவரிசை அரச பதிவைக் குறிக்கும் தலைப்புப்போன்ற சொற்றொடர். ‘புத்தகத்தில்’ என்பது பதிவில் எழுதப்பட்டிருப்பதைக் குறிக்கும் இயல்பான தமிழ் பயன்பாடு.
