base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: ta
  text: அவன் தன் தந்தை எசேக்கியா அழித்த மேடைகளைத் திரும்பவும் கட்டினான். பாகாலுக்குப் பலிபீடங்களை எழுப்பி, அசேராவைச் செய்தான்; இஸ்ரவேலின் அரசன் ஆகாப் செய்ததுபோல. மேலும், வானத்தின் எல்லாப் படைகளையும் வணங்கி, அவற்றுக்குப் பணிவிடை செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா” என்பது ஒரு கானானியத் தேவியையோ, அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருள் அல்லது சின்னத்தையோ குறிக்கலாம்.
    reason: எபிரெய אֲשֵׁרָה என்பதன் தேவதை/வழிபாட்டுப் பொருள் குறிப்பு நெகிழ்வை விளக்குகிறது; முதன்மை உரை ஒரு குறிப்பிட்ட வடிவத்தை நிர்ணயிக்கவில்லை.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: இது வழிபாட்டுக்காக அமைக்கப்பட்ட உயர்ந்த இடங்களைக் குறிக்கும் வழக்குச் சொல்; சூழலில் அவை முறையற்ற வழிபாட்டுத் தலங்கள்.
- source_word: לַבַּעַל
  choice: பாகாலுக்குப்
  rationale: கானானியத் தெய்வமான பாகாலைப் பெயரெழுத்தாக்கி, பலிபீடங்களின் அர்ப்பணிப்பு இலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֵׁרָה
  choice: அசேரா உருவம்
  rationale: எபிரெயச் சொல் அசேரா தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கலாம்; இங்கு 'செய்தான்' என்பதால் உருவம்/சின்னம் என்ற பொருள் இயல்பானது, ஆனால் அடிக்குறிப்பில் குழப்பவாய்ப்பு பாதுகாக்கப்படுகிறது.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: வானத்தின் படைகள் அனைத்தும்
  rationale: சூரியன், சந்திரன், விண்மீன்கள் போன்ற விண்ணுலகத் தொகுதியைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: அவற்றுக்குப் பணிவிடை செய்தான்
  rationale: עבד என்பதன் வழிபாட்டு சார்ந்த 'சேவித்தல்' பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அசேரா என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘அசேரா உருவம்’ என்று வைத்து அடிக்குறிப்பில் பொருள் வரம்பை விளக்குதல்
  alternative: ‘அசேரா கம்பம்’ அல்லது ‘அசேரா தேவி’
  rationale: மூலச்சொல் தெய்வத்தையும் அதனுடன் தொடர்புடைய வழிபாட்டுப் பொருளையும் குறிக்கக்கூடும்; குறிப்பிட்ட வடிவத்தை உறுதியாக நிர்ணயிக்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- issue: வானத்தின் படைகள்
  choice: மூல உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘விண்மீன்கள் அனைத்தும்’ அல்லது ‘வானுலகத் தெய்வங்கள்’
  rationale: இந்தச் சொற்றொடர் விண்பொருட்களையும் அவை வழிபாட்டு பொருள்களாக்கப்பட்டதையும் உள்ளடக்கலாம்; ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. தொடர்ச்சியான எபிரெய வினைத்தொடர்களை இயல்பான தமிழ் வாக்கியங்களாகப் பிரித்துள்ளோம்; செயல்களின் வரிசையும் கண்டனத் தொனியும் காக்கப்பட்டுள்ளன.
