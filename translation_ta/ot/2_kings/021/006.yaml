  source_fidelity: மூல எபிரெயத்தின் தொடர், வினைகள், மற்றும் வலியுறுத்தல் நன்றாகப் பேணப்பட்டுள்ளன. “நெருப்பினூடே கடக்கச் செய்தான்” என்பது הֶעֱבִיר ... בָּאֵשׁ என்ற மரபுத்தொடரின் வெளிப்படையான பொருளை முதன்மை உரையில் தக்கவைக்கிறது; குழந்தைப் பலி என்ற சாத்திய விளக்கம் அடிக்குறிப்பில் மட்டுமே உள்ளது. சகுனம் பார்த்தல், குறிகேட்டல், ஊடகர்கள்/ஆவியருடன் தொடர்புடையோர் எனும் தனித்த செயல்களும் வேறுபடுத்தப்பட்டுள்ளன. הִרְבָּה לַעֲשׂוֹת என்பதன் மிகுதி ‘மிகுதியாகச் செய்தான்’ என்பதில் போதுமானவாறு வெளிப்படுகிறது.
  naturalness: நடை நவீன நிலையான தமிழிலும் பொதுவாசிப்பிற்கும் ஏற்றதாகவும் உள்ளது. “ஆவிகளோடு தொடர்புகொள்வோரையும் குறிசொல்வோரையும் நாடினான்” என்பது சற்றே விளக்கமான சொல்லாக்கமாக இருந்தாலும், கடினமான எபிரெய மரபுத்தொடரின் ஈடுபாடு-சார்ந்த பரந்த பொருளை இயல்பாகத் தருகிறது. இறுதி வாக்கியத்தின் சொல் வரிசையும் தெளிவாக உள்ளது.
