base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: ta
  text: தன் மகனை நெருப்பினூடே கடக்கச் செய்தான்[a]; சகுனம் பார்த்தான், குறிகேட்டான்[b], ஆவிகளோடு தொடர்புகொள்வோரையும் குறிசொல்வோரையும் நாடினான்[c]. யாவேக்குக் கோபமூட்டும்படி, அவர் பார்வையில் தீமையானதை மிகுதியாகச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வெளிப்படையாக, “தன் மகனை நெருப்பில் பலியிட்டான்” என்றும் பொருள்கொள்ளலாம். எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “தன் மகனை நெருப்பினூடே கடக்கச் செய்தான்” என உள்ளது.
    reason: alternative_reading
  - marker: b
    text: “குறிகேட்டான்” என்பதை “சகுனங்களை விளக்கினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஆவிகளோடு தொடர்புகொள்வோரிடமும் குறிசொல்வோரிடமும் ஆலோசனை கேட்டான்.” எபிரெய சொல்லாட்சி கடினமானது; அத்தகைய நபர்களுடனான விரிவான ஈடுபாட்டையும் இது குறிக்கலாம்.
    reason: lexical_alternative
