  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். மறைஞான நடைமுறைகளுக்கான வேறுபட்ட எபிரெயச் சொற்கள் இயன்றவரை தனித்தனியாக வைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
