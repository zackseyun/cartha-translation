  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: ta
  text: ஆனால் நாட்டின் மக்கள், அமோன் அரசனுக்கு எதிராகச் சதி செய்த அனைவரையும்[a] அடித்துக் கொன்றார்கள். பின்பு நாட்டின் மக்கள் அவனுடைய மகன் யோசியாவை அவனுக்குப் பதிலாக அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமோன் அரசனுக்கு எதிரான சதிகாரர்கள் அனைவரையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: கொன்றுபோட்டார்கள்
  rationale: נכה என்ற வினை இச்சூழலில் சதிகாரர்கள்மீது நடத்தப்பட்ட உயிர்க்கொல்லும் தாக்குதலைக் குறிக்கிறது. நவீனத் தமிழில் முடிவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் பொதுமக்களையோ சமூக-அரசியல் செல்வாக்குள்ள நாட்டுமக்கள் குழுவையோ குறிக்கலாம். அதன் இயல்பான பரந்த பொருளையும் இருமுறை வரும் மீளுரைப்பையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: כָּל הַקֹּשְׁרִים
  choice: சதி செய்த அனைவரையும்
  rationale: קשר என்ற பங்கேற்புவினை சதியில் ஈடுபட்டவர்களைக் குறிக்கிறது. நிகழ்வுக்கு முன்பே அவர்கள் செய்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: அமோன் அரசனுக்கு எதிராக
  rationale: קשר என்பதுடன் வரும் עַל பகைமை நோக்குள்ள சதியைச் சுட்டுகிறது; ‘எதிராக’ என்பது அதைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיַּמְלִיכוּ
  choice: அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அரசனாக்குவதைக் குறிக்கிறது. ‘முடிசூட்டினார்கள்’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத சடங்கியல் கருத்து சேரக்கூடும்.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: அவனுடைய மகன் யோசியாவை
  rationale: உறவையும் பெயரையும் நவீனத் தமிழின் இயல்பான சொல் வரிசையில் தெளிவாகத் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தில் அடுத்தவர் ஆட்சிக்கு வந்த அரசுரிமைத் தொடர்ச்சியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וַ
  choice: ஆனால் / பின்பு
  rationale: முதல் வாவ் முந்தைய வசனத்தில் அமோன் கொல்லப்பட்டதற்கும் இங்கு மக்கள் எடுத்த எதிர்நடவடிக்கைக்கும் உள்ள முரண்பாட்டைச் சுட்ட ‘ஆனால்’ எனவும், இரண்டாவது வாவ் நிகழ்வுத் தொடரைச் சுட்ட ‘பின்பு’ எனவும் மொழிபெயர்க்கப்பட்டது.
