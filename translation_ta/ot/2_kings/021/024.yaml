translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாட்டின் மக்கள்’ என்ற மூலச் சொற்றொடர் இரு இடங்களிலும் ஒரேவிதமாக வைக்கப்பட்டுள்ளது; அதன் சமூக-அரசியல் குறிப்பு குறிப்பிட்ட ஒரு வர்க்கமாகச் சுருக்கப்படவில்லை.
