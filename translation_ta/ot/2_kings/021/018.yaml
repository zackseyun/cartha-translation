  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר בְּ/גַן בֵּית֖/וֹ בְּ/גַן עֻזָּ֑א וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: ta
  text: மனாசே தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவன் தன் வீட்டுத் தோட்டத்தில், உஸ்ஸாவின் தோட்டத்தில், அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் ஆமோன் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல் என மொழிபெயர்த்தால், “தன் முன்னோர்களோடு படுத்துக்கொண்டான்.” இது அரசரின் மரணத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: שׁכב என்ற வினை அரசர்களின் மரணக் குறிப்புகளில் மரணத்தைக் குறிக்கும் மரபுத்தொடராக வருகிறது. ‘துயிலடைந்தான்’ என்பது மரணத்தைத் தெளிவாக உணர்த்தும் இயல்பான தமிழ் மரபுத்தொடராக இருப்பதோடு, எபிரெய உருவகத்தையும் முற்றிலும் நீக்கவில்லை.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אבותיו இங்கு வம்ச முன்னோர்களைக் குறிக்கும் மரபான அரசர் வரலாற்றுச் சொற்றொடர். நவீன தமிழில் ‘முன்னோர்கள்’ என்பது இயல்பாகவும் விரிவான வம்சப் பொருளைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: קבר என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளை இயல்பான, கண்ணியமான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: בְּגַן בֵּיתוֹ
  choice: தன் வீட்டுத் தோட்டத்தில்
  rationale: ביתו என்பதை ‘அரண்மனை’ என்று குறிப்பாக்காமல், மூலத்தின் ‘அவனுடைய வீடு’ என்ற சொல்லாட்சியைப் பேணுகிறது; தமிழில் உரிமைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: בְּגַן עֻזָּא
  choice: ஊசாவின் தோட்டத்தில்
  rationale: மூலத்தில் திரும்ப வரும் இடக்குறிப்பைத் தக்கவைத்து, ஊசா என்ற பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இந்த அரசுரிமைத் தொடர்ச்சி வாய்பாட்டில் מלך ஆட்சிக்காலத்தைப் பொதுவாகச் சொல்வதைக் காட்டிலும் அரியணை ஏற்றதைக் குறிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தை மகன் ஏற்ற அரசுரிமைத் தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அரசரின் மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்
  choice: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்று உருவகத்தைப் பேணுதல்
  alternative: ‘இறந்தான்’ என்று அதன் கருத்தை மட்டும் வெளிப்படுத்துதல்
  rationale: ‘இறந்தான்’ என்பது சூழ்நிலைப் பொருளைத் தெளிவாக்கினாலும், மூலத்தில் உள்ள படுத்தல்/துயில் உருவகத்தையும் அரசர் வரலாற்றின் மரபான வாய்பாட்டையும் நீக்கிவிடும். தேர்ந்த வடிவம் எந்தப் பிறப்பிறப்புக் கோட்பாட்டையும் கூடுதலாக இறக்குமதி செய்யாமல் அந்த இலக்கியத் தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. ‘வீடு’ என்பதை ‘அரண்மனை’ என்று விளக்கமாக்காமல் மூலத்தின் பொதுத்தன்மை பேணப்பட்டுள்ளது; இருமுறை வரும் ‘தோட்டத்தில்’ என்ற இடக்குறிப்பும் நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது.
