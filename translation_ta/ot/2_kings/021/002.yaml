source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்; இஸ்ரவேல் மக்களின்[b] முன்னிலையிலிருந்து யாவே துரத்தியிருந்த பிற இனத்தாரின் அருவருப்பான பழக்கவழக்கங்களின்படி[a] நடந்துகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தாரின் அருவருப்பான செயல்களைப் போல.”
    reason: כְּתוֹעֲבֹת என்ற சொற்றொடரில் ஒப்புமை (‘போல’) அல்லது அதற்கேற்ப நடத்தல் (‘-இன்படி’) ஆகிய நெருக்கமான இரு நுணுக்கங்களும் சாத்தியம்.
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இங்கு இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுவழிக் கூட்டுச் சொற்றொடர்.
    reason: மூலத்தின் ஆண்பால், வம்சவழிச் சொல்லமைப்பை வாசகருக்குத் தெரிவிக்கிறது; முதன்மை உரையில் இயல்பான தமிழ் கூட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: அவன் ... தீமையானதைச் செய்தான்
  rationale: எபிரெய மொழியின் வழக்கமான அரசர் மதிப்பீட்டுச் சொற்றொடரை, நவீன தமிழில் இயல்பாகவும் அதன் ஒழுக்கத் தீர்ப்பைத் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற எபிரெய உருவகத்தின் தெய்வீக மதிப்பீட்டு உணர்வை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பெயரொலியை நேரடியாக வழங்குகிறது.
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: பிற இனத்தாரின் அருவருப்பான பழக்கவழக்கங்களின்படி
  rationale: תּוֹעֵבָה என்பதன் கடுமையான ஒழுக்க மற்றும் வழிபாட்டு மதிப்பீட்டை ‘அருவருப்பான’ என்பதால் காத்து, பன்மைச் செயல்பாட்டு பொருளை ‘பழக்கவழக்கங்கள்’ எனத் தெளிவாக்குகிறது; כְּ என்பதன் ஒப்புமை/ஒத்திசைவு உணர்வை ‘-இன்படி’ தருகிறது.
- source_word: הוֹרִישׁ
  choice: துரத்தியிருந்த
  rationale: இங்கு ஹிஃபில் வடிவம் அந்த மக்களை அவர்களுடைய இடத்திலிருந்து வெளியேற்றிய செயலைக் குறிக்கிறது; முந்திய நிகழ்வைத் தமிழின் இறந்தகால நிறைவுவடிவம் காட்டுகிறது.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து
  rationale: מִפְּנֵי என்பதன் ‘முன்னிலையிலிருந்து’ என்ற இடத்தொடர்பைத் தக்கவைத்து, בְּנֵי יִשְׂרָאֵל என்ற மரபுவழிக் கூட்டுப்பெயரை நவீன தமிழில் இயல்பாக ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: תּוֹעֵבָה என்பதன் மதிப்பீட்டு வலிமை
  choice: அருவருப்பான பழக்கவழக்கங்கள்
  alternative: வெறுக்கத்தக்க செயல்கள்
  rationale: இந்தச் சொல் வெறும் சமூக வேறுபாட்டையல்ல, யாவேயின் பார்வையில் கடுமையாகக் கண்டிக்கப்படும் வழிபாட்டு மற்றும் ஒழுக்க நடைமுறைகளைக் குறிக்கிறது; எந்தச் செயல்கள் என்று வசனம் குறிப்பிடாததால் அதை விளக்கிச் சேர்க்கவில்லை.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது வரலாற்றுக் கதையில் இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபுவழிக் கூட்டுப்பெயர். ‘இஸ்ரவேலின் மகன்கள்’ என்பது நவீன தமிழில் யாக்கோபின் நேரடி மகன்களை மட்டும் குறிக்கக்கூடும்; எனவே இயல்பான கூட்டுப்பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சொறான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘யாவே’ என்ற பெயர் தொடர்ந்து ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ஒருங்கிணைந்த ஓட்டத்தை அரைப்புள்ளி வழியாகக் காத்து, தமிழில் தேவையான இறுதி வினைச்சொல் சேர்க்கப்பட்டுள்ளது.
