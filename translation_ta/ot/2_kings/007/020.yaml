base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: ta
  text: 'அவனுக்கு அப்படியே நிகழ்ந்தது: நகரவாசலில்[a] மக்கள் அவனை மிதித்தார்கள்; அவன் இறந்துபோனான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நகரவாசலருகே’ அல்லது ‘நகரவாசல் நுழைவுப் பகுதியில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நகரவாசலையோ அதைச் சார்ந்த நுழைவிடப் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: அவனுக்கு அப்படியே நிகழ்ந்தது
  rationale: முன்னர் சொல்லப்பட்டபடியே அவனுக்கு நிகழ்ந்தது என்ற எபிரெய மரபுத்தொடரின் நிறைவேற்ற உணர்வை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּרְמְסוּ
  choice: மிதித்தார்கள்
  rationale: רמס என்பதன் காலால் மிதித்தல் என்ற நேரடிப் பொருளைத் தெளிவாகத் தருகிறது; ‘மிதித்துக் கொன்றார்கள்’ என்பது அடுத்த வினையின் விளைவை முன்கூட்டியே சேர்த்துவிடும்.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதற்கான நேரடியான இணை; சூழலில் திரண்டிருந்த பொதுமக்களைக் குறிக்கிறது, ஆனால் ‘கூட்டம்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: בַּשַּׁעַר
  choice: நகரவாசலில்
  rationale: שַׁעַר இங்கு நகரத்தின் வாசலையும் அதைச் சார்ந்த நுழைவிடப் பகுதியையும் குறிக்கக்கூடும். ‘நகரவாசலில்’ என்பது சூழலைத் தெளிவாக்கி, இடவியல் பரப்பைத் தேவையின்றி மிகத் துல்லியமாக்காமல் விடுகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: எபிரெய உரையின் தொடர்வினையை நேரடியாக வழங்குகிறது; மரணம் மிதிக்கப்பட்டதன் விளைவு என்பதைச் சூழலே காட்டுவதால் ‘அதனால்’ போன்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தீர்ப்பு நிறைவேறியதைக் காட்டும் சொற்றொடர்
  choice: முன்னறிவிக்கப்பட்டபடியே நிகழ்ந்ததை ‘அவனுக்கு அப்படியே நிகழ்ந்தது’ என்று கதைநடையில் கூறுதல்
  alternative: ‘இவ்வாறு அவன்மேல் தீர்ப்பு வந்தது’ என்று வெளிப்படையாகத் தெய்வீகத் தீர்ப்பை முன்னிறுத்துதல்
  rationale: உடனடியான சூழல் இது எலிசாவின் வார்த்தையின் நிறைவேற்றம் என்பதைத் தெளிவாக்குகிறது. ஆனால் இவ்வசனம் நிகழ்வை மட்டுமே விவரிப்பதால், மூலத்தில் இல்லாத விளக்கத் தெய்வவியலை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் சுருக்கமும் தொடர்ச்சியும் காக்கப்பட்டுள்ளன; உண்மையான இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
