source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: ta
  text: 'அப்போது எலிசா, “யாவேயின் வார்த்தையைக் கேளுங்கள். யாவே கூறுவது இதுவே: நாளை ஏறக்குறைய இதே நேரத்தில், சமாரியாவின் நகரவாசலில் ஒரு சேயா[a] மெல்லிய மாவு ஒரு சேக்கலுக்கும், இரண்டு சேயா வாற்கோதுமை ஒரு சேக்கலுக்கும் விற்கப்படும்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேயா” என்பது பண்டைய உலர் அளவை அலகு; எபிரெய மூலத்தில் பொதுவான ‘அளவு’ என்பதற்குப் பதிலாக இந்தக் குறிப்பிட்ட அலகே பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்ச்சியாக அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வாவ்-தொடரின் கதையோட்டத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் தீர்க்கதரிசன அறிவிப்பின் நேரடியான அழைப்பையும் காக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சூத்திரத்தின் முறையான தன்மையை ‘செய்தி’ என்று விளக்கிவிடாமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: வழக்கமான தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை முறையானதாயும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: כָּעֵת מָחָר
  choice: நாளை ஏறக்குறைய இதே நேரத்தில்
  rationale: כָּ கூறும் தோராயப் பொருளையும் மறுநாளின் இதே நேரத்தைக் குறிக்கும் சொற்றொடரையும் வெளிப்படுத்துகிறது.
- source_word: סְאָה / סָאתַיִם
  choice: ஒரு சேயா / இரண்டு சேயா
  rationale: பொதுவான ‘அளவு’ என மாற்றாமல் குறிப்பிட்ட பண்டைய உலர் அளவையின் பெயரையும் இருமை எண்ணையும் காக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: சாதாரண மாவைக் காட்டிலும் நன்கு அரைக்கப்பட்ட தரமான மாவைக் குறிக்கும் சொல்லின் வேறுபாட்டைக் காக்கிறது.
- source_word: בְּשֶׁקֶל
  choice: ஒரு சேக்கலுக்கு
  rationale: சந்தை விலையைக் குறிக்கும் בְּ முன்னிடைச்சொல்லைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: இச்சூழலில் தானியமான barley-ஐக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: சமாரியாவின் நகரவாசலில்
  rationale: שַׁעַר என்பது நகரத்தின் பொதுவணிகமும் குடிமை நடவடிக்கைகளும் நடைபெற்ற வாசலைக் குறிக்கிறது; ‘நகரவாசல்’ அதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதன் தனிப்பெயர்த் தன்மையை ஒலிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நடை நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழில் உள்ளது. தீர்க்கதரிசன அறிவிப்பின் முறையான தொனி காக்கப்பட்டுள்ளது. மூலத்தின் எதிர்கால விலை அறிவிப்பு தமிழில் இயல்பாகப் புரிய ‘விற்கப்படும்’ என வெளிப்படுத்தப்பட்டுள்ளது.
