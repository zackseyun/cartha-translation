base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: ta
  text: அவர்கள் வந்து நகர வாயிற்காவலர்களைக் கூப்பிட்டு, அவர்களிடம், “நாங்கள் ஆராமின்[b] முகாமுக்கு வந்தோம். இதோ, அங்கே ஒருவரும் இல்லை; மனித ஓசையும் இல்லை[a]. கட்டப்பட்டிருந்த குதிரைகளும் கழுதைகளும், இருந்தபடியே இருந்த கூடாரங்களும் மட்டுமே இருந்தன” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதக் குரலும் இல்லை.” எபிரெயச் சொல் குறிப்பாகக் குரலையோ, விரிவாக எந்த மனித ஓசையையுமோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: “ஆராமின் முகாம்”; மரபுவழியாக, “சீரியர்களின் முகாம்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: நகர வாயிற்காவலர்கள்
  rationale: மூலச்சொல் வடிவத்தில் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் பன்மைச் சுட்டுகளும் சூழலும் வாயிலைக் காக்கும் பணியாளர்களைக் கூட்டாகக் குறிக்கின்றன.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: அவர்களிடம் … என்று தெரிவித்தார்கள்
  rationale: எபிரெய அறிக்கைச் சூத்திரத்தின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘சொல்லி, சொன்னார்கள்’ என்ற தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: מַחֲנֵה אֲרָם
  choice: ஆராமின் முகாம்
  rationale: ‘ஆராம்’ என்பது எபிரெயப் பெயரை நேரடியாகப் பாதுகாக்கிறது; பிற்கால புவியியல் பெயரான ‘சீரியா’ என்பதை முதன்மை உரையில் பதிலீடு செய்யவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ட காட்சியை உயிரோட்டமாக முன்வைக்கும் הִנֵּה என்பதன் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֵין שָׁם אִישׁ
  choice: அங்கே ஒருவரும் இல்லை
  rationale: אִישׁ இங்கு ஆணை மட்டும் அல்ல, எந்த மனிதரையும் பொதுவாகக் குறிக்கிறது.
- source_word: וְקוֹל אָדָם
  choice: மனித ஓசையும் இல்லை
  rationale: קוֹל என்பது ‘குரல்’ அல்லது விரிவாக ‘ஓசை’ எனப் பொருள்படலாம். முதன்மை உரையில் விரிவான பொருள் வைக்கப்பட்டு, குறுகிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: முன்னர் கூறப்பட்ட முழுமையான இல்லாமைக்கு விதிவிலக்காக அங்கே இருந்தவற்றை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: கட்டப்பட்டிருந்த குதிரைகளும் கட்டப்பட்டிருந்த கழுதைகளும்
  rationale: אָסוּר என்பதன் ‘கட்டப்பட்ட’ என்ற பொருளைத் தெளிவாகத் தருகிறது; ஒருமை விலங்குப் பெயர்கள் இங்கு கூட்டுப் பொருளில் இருப்பதால் தமிழில் பன்மை இயல்பானது.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: கூடாரங்கள் இருந்தபடியே இருந்தன
  rationale: கூடாரங்கள் மாற்றமின்றி விடப்பட்டிருந்ததை மூலத்தின் சுருக்கமான அமைப்புக்கு நெருக்கமாகத் தெரிவிக்கிறது.
