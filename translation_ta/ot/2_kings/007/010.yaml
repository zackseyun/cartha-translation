translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ என்பது மூலத்தின் காட்சிப்படுத்தும் வலிமையைத் தக்கவைக்கிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், [a] ‘மனித ஓசை’ என்பதற்குப் பின்னும் [b] ‘ஆராம்’ என்பதற்குப் பின்னும் பொருளுக்கேற்றவாறு அமைக்கப்பட்டன.
