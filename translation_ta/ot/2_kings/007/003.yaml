  register: நவீன நிலையான தமிழில், கண்ணியமான அதேவேளையில் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் காட்சி அறிமுகம் இயல்பான தமிழ் சொல்வரிசைக்கு மாற்றப்பட்டுள்ளது; மருத்துவ ரீதியாகத் தவறாக வழிநடத்தக்கூடிய குறிப்பிட்ட நோய்ப்பெயர் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
