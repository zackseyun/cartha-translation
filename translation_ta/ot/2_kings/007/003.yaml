  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: ta
  text: வாசலின் நுழைவிடத்தில் தோல் நோயால் பாதிக்கப்பட்ட நான்கு ஆண்கள் இருந்தார்கள்.[a] அவர்கள் ஒருவருக்கொருவர், “நாம் இறக்கும்வரை ஏன் இங்கே உட்கார்ந்திருக்கிறோம்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “தொழுநோயாளிகள்.” எபிரெயச் சொல் צָרַעַת என்பதுடன் தொடர்புடைய ஒரு தோல் பாதிப்பைக் குறிக்கிறது; அது நவீன மருத்துவம் குறிப்பிடும் தொழுநோயுடன் (ஹான்சன் நோய்) அவசியம் ஒன்றானதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: நான்கு ஆண்கள் இருந்தார்கள்
  rationale: எபிரெய மொழியின் காட்சி அறிமுகத்தை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது. אֲנָשִׁים இங்கு குறிப்பிட்ட நான்கு ஆண்களைக் குறிக்கிறது.
- source_word: מְצֹרָעִים
  choice: தோல் நோயால் பாதிக்கப்பட்ட
  rationale: צָרַעַת தொடர்பான நிலையை நவீன தொழுநோயுடன் தவறாக ஒன்றுபடுத்தாமல், பொதுவான தோல் நோய்நிலையாகத் தெரிவிக்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פֶּתַח הַ/שָּׁעַר
  choice: வாசல் நுழைவிடத்தில்
  rationale: ‘வாசலின் திறப்பு/நுழைவிடம்’ என்ற கட்டமைப்பை இயல்பான, தெளிவான தமிழில் வழங்குகிறது.
- source_word: וַ/יֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: அவர்கள் ஒருவரையொருவர் பார்த்து ... என்று கேட்டார்கள்
  rationale: சொல்லுக்கு சொல் ‘ஒருவன் தன் தோழனிடம் சொன்னான்’ என்ற பரஸ்பர உரையாடல் மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வினாவாக இருப்பதால் ‘கேட்டார்கள்’ பொருத்தமானது.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: நாம் ஏன் இங்கேயே உட்கார்ந்திருக்க வேண்டும்?
  rationale: מָה இங்கு காரணத்தை வினவும் ‘ஏன்’ எனச் செயல்படுகிறது. தொடர்ந்த செயலற்ற இருப்பை ‘உட்கார்ந்திருக்க’ என்பதும், இட வலியுறுத்தலை ‘இங்கேயே’ என்பதும் இயல்பாகத் தருகின்றன.
- source_word: עַד מָתְנוּ
  choice: சாகும்வரை
  rationale: அங்கேயே இருப்பதன் இறுதி எல்லையான மரணத்தைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
