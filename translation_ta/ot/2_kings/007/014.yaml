base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: ta
  text: எனவே, அவர்கள் குதிரைகள் பூட்டப்பட்ட இரண்டு தேர்களை[a] எடுத்தார்கள். அரசன் அவற்றை அராமின் பாளயத்தைத் தொடர்ந்து அனுப்பி, “போய்ப் பாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “குதிரைகளின் இரண்டு தேர்கள்” என்று சுருக்கமாக உள்ளது; இது குதிரைகள் பூட்டப்பட்ட இரண்டு தேர்களையோ இரண்டு தேர்க்குழுக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எனவே, அவர்கள் எடுத்தார்கள்
  rationale: வாவ் தொடர் வடிவம் கதையை முன்னெடுக்கிறது; முந்தைய சூழலின் விளைவையும் இயல்பான தமிழ் கதைநடையையும் ‘எனவே’ வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: குதிரைகள் பூட்டப்பட்ட இரண்டு தேர்கள்
  rationale: எபிரேயத் தொடர் சுருக்கமானதும் சற்றுத் தெளிவின்மையுடையதும் ஆகும். சூழலில் இது குதிரைகள் இழுக்கும் இரண்டு தேர்களை அல்லது இரண்டு தேர்க்குழுக்களைக் குறிக்கலாம்; முதன்மை உரை இயல்பாக இருக்க இவ்வாறு மொழிபெயர்த்து, மாற்று புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: அரசன் அவற்றை அனுப்பி
  rationale: எபிரேயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் உடனடி சூழலிலுள்ள தேர்களைச் சுட்டுகிறது. ‘அவற்றை’ என்பது தமிழில் தெளிவான இயல்பான இணைப்பை அளிக்கிறது.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: அராமின் பாளயத்துக்குப் பின்னால்
  rationale: אַחֲרֵי என்பதன் திசை சார்ந்த ‘பின்னால்/பின்தொடர்ந்து’ என்ற பொருளையும், מַחֲנֶה என்பதன் ‘பாளயம்’ என்ற பொருளையும் காக்கிறது; ‘துரத்திச் செல்ல’ என நோக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: אֲרָם
  choice: அராம்
  rationale: இடம் அல்லது அரசின் பெயரை நவீன ‘சிரியா’ என மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לֵאמֹר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய அமைப்பை இயல்பான தமிழ் உரையாடல் முடிவாக வழங்குகிறது.
- source_word: לְכוּ וּרְאוּ
  choice: போய்ப் பாருங்கள்
  rationale: இரு கட்டளைகளின் சுருக்கத்தையும் நேரடித் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
