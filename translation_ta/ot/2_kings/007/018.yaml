  to: 'இறைவனுடைய மனிதர் அரசனிடம் கூறியபடியே நடந்தது: “நாளை ஏறக்குறைய இதே நேரத்தில், சமாரியாவின் நகரவாயிலில் இரண்டு சேயா[a] வாற்கோதுமை ஒரு சேக்கலுக்கும், ஒரு சேயா மெல்லிய மாவு ஒரு சேக்கலுக்கும் கிடைக்கும்.”'
