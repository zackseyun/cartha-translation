reference: 2 Kings 7:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: ta
  text: 'இறைவனுடைய மனிதர் அரசனிடம் கூறியபடியே நடந்தது: “நாளை ஏறக்குறைய இதே நேரத்தில், சமாரியாவின் நகரவாயிலில் இரண்டு சேயா[a] வாற்கோதுமை ஒரு சேக்கலுக்கும், ஒரு சேயா மெல்லிய மாவு ஒரு சேக்கலுக்கும் கிடைக்கும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேயா” என்பது பண்டைய உலர் அளவை. எபிரெய மூலத்தில் அளவுகள் நேரடியாக “இரண்டு சேயா வாற்கோதுமை,” “ஒரு சேயா மெல்லிய மாவு” என்று குறிப்பிடப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: சொன்னபடியே நடந்தது
  rationale: நிகழ்வு இறைவனின் மனிதர் கூறியதற்கு ஏற்ப நிறைவேறியதை כְּ குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் எபிரெய நிறைவேற்ற வலியுறுத்தலைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: மூலத்தின் நிலையான பட்டப்பெயரை ‘தீர்க்கதரிசி’ என்று விளக்கமளித்து மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: סָאתַיִם / סְאָה
  choice: இரண்டு சேயா / ஒரு சேயா
  rationale: பண்டைய உலர் அளவையின் பெயரையும், இரட்டைக்கும் ஒருமைக்கும் இடையிலான எண்ணியல் வேறுபாட்டையும் தக்கவைக்கிறது.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: தானியமான barley-க்கான தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: בְּשֶׁקֶל
  choice: ஒரு சேக்கலுக்கு
  rationale: விலை நிர்ணயச் சூழலில் בְּ குறிக்கும் பரிமாற்ற விலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பொதுவான மாவு அல்லாமல் நன்றாக அரைக்கப்பட்ட உயர்தர மாவு என்னும் மூலச் சொல்லின் வேறுபாட்டைப் பேணுகிறது.
- source_word: יִהְיֶה
  choice: விற்கப்படும்
  rationale: முன்னர் கூறப்பட்ட விலைகள் அப்போது சந்தையில் நிலவும் என்ற எபிரெய நீள்வட்டப் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּעֵת מָחָר
  choice: நாளை ஏறக்குறைய இதே நேரத்தில்
  rationale: כְּ என்பதன் தோராய நுணுக்கத்தையும் அடுத்த நாளின் இதே நேரம் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: சமாரியாவின் நுழைவாயிலில்
  rationale: நகர வாயிலுக்குள் அல்லது அதனைச் சார்ந்த பொது வணிக இடத்தில் எனப் பொருள்படும் எபிரெய சொல்லாட்சியை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் பண்டைய அளவு மற்றும் நாணயப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; அளவுக்கான குறிப்பு மட்டும் அடிக்குறிப்பில் தரப்பட்டுள்ளது. நகர நுழைவாயிலின் வணிகச் சூழலை ‘விற்கப்படும்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
