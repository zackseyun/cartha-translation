  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: ta
  text: அப்போது, அரசன் எவருடைய கையைச் சார்ந்திருந்தானோ அந்த அதிகாரி இறைமனிதருக்குப் பதிலளித்து, “பார், யாவே வானத்தில் சாளரங்களை உண்டாக்கினால்கூட, இப்படிப்பட்ட ஒன்று நடக்குமா?” என்றான். அதற்கு இறைமனிதர், “இதோ, நீ உன் கண்களாலேயே அதைக் காண்பாய்; ஆனால் அதிலிருந்து எதையும் உண்ணமாட்டாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: அதிகாரி
  rationale: இந்தச் சொல் உயர்நிலை இராணுவ அல்லது அரசவை அதிகாரியைக் குறிக்கலாம்; சூழலில் உறுதியாகத் தெரியாத துல்லியமான பதவிநிலையைச் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: அரசன் யாருடைய கையின்மேல் சாய்ந்துகொள்வானோ
  rationale: நம்பிக்கைக்குரிய அரசவை அதிகாரியைச் சுட்டும் உயிரோட்டமான எபிரெய உருவகத்தை, ‘கை’ என்ற சொல்லையும் சேர்த்து, தமிழில் புரியுமாறு காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைமனிதன்
  rationale: தீர்க்கதரிசிக்கான எபிரெய பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கமளித்து மாற்றாமல் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: வானத்தில் சாளரங்களை உண்டாக்கினால்கூட
  rationale: ‘சாளரங்கள்/திறப்புகள்’ என்ற மூல உருவகத்தையும் அதிகாரியின் நம்பிக்கையற்ற மிகைப்படுத்தலையும் காக்கிறது; ‘மதகுகள்’ என்பது சாத்தியமான சூழல்சார் மாற்று.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: இப்படிப்பட்ட ஒன்று நடக்குமா?
  rationale: நிகழ்வதற்கான சாத்தியத்தையே ஏளனத்துடன் மறுக்கும் கேள்வியின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: நீ உன் கண்களாலேயே அதைக் காண்பாய்
  rationale: நேரில் காண்பதை வலியுறுத்தும் எபிரெய சொல்லமைப்பைத் தமிழின் ‘-ஆலேயே’ வலியுறுத்தலால் தருகிறது.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: ஆனால் அதிலிருந்து எதையும் உண்ணமாட்டாய்
  rationale: வாக்குறுதியளிக்கப்பட்ட உணவுப் பெருக்கத்தை அவன் காண்பான், ஆனால் அதில் பங்குபெறமாட்டான் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘அங்கிருந்து’ என்ற மூல இடச்சுட்டு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: அதிகாரியின் கேள்வியின் தொனி
  choice: நம்பிக்கையற்ற, சாத்தியத்தை மறுக்கும் கேள்வியாகக் காக்கப்பட்டது
  alternative: தேவனால் இது சாத்தியம் என ஒப்புக்கொள்ளும் நடுநிலையான நிபந்தனை
  rationale: הֲיִהְיֶה என்ற கேள்வியும் சூழலும் ஏளனமான அவநம்பிக்கையைச் சுட்டுகின்றன; அதேவேளை, உரையில் இல்லாத கூடுதல் குற்றவியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இதோ’ என்பது இரு பேச்சாளர்களின் வலியுறுத்தலையும் நேரடி மோதலின் தொனியையும் தக்கவைக்கிறது; ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
