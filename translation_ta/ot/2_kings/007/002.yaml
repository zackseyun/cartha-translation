    text: அல்லது, “யாவே வானத்தில் மதகுகளைத் திறந்தால்கூட.” எபிரெயில் சொற்பட, “வானத்தில் சாளரங்களை உண்டாக்குதல்”; மேலிருந்து வரும் அசாதாரணமான வழங்கலைக் குறிக்கும் உருவகம்.
