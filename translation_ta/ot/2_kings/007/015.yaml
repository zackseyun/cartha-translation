  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: ta
  text: அவர்கள் அவர்களைப் பின்தொடர்ந்து யோர்தான்வரை சென்றார்கள். இதோ, அராம் படையினர்[b] தங்கள் அவசரத்தில் எறிந்துவிட்டிருந்த ஆடைகளாலும் உபகரணங்களாலும்[a] முழு வழியும் நிறைந்திருந்தது. பின்பு தூதர்கள்[c] திரும்பிவந்து அரசனிடம் தெரிவித்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உபகரணங்கள்” என்பதற்கான எபிரெயச் சொல் பரந்த பொருளுடையது; அதை “பொருட்கள்,” “கருவிகள்,” அல்லது “தளவாடங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக “அராம்” என்று உள்ளது; இங்கு அது அராம் படையினரை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது “ஆய்வுக்குச் சென்றவர்கள்.” எபிரெயச் சொல் நேரடியாக “தூதர்கள்” என்று பொருள்படும்; இச்சூழலில் இவர்கள் நிலைமையை ஆராய அனுப்பப்பட்டவர்கள்.
    reason: lexical_alternative
