translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘இதோ’ என்பது மூலத்தின் காட்சித் தீவிரத்தைப் பாதுகாக்கிறது. ‘அராம் படையினர்’ என்பது எபிரெயின் கூட்டுப்பெயர்ப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
