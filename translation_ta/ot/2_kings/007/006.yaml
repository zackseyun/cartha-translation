  to: ஆண்டவர் அராமின் படைமுகாமுக்கு தேர்களின் ஓசையையும், குதிரைகளின் ஓசையையும், ஒரு பெரும் படையின் ஓசையையும் கேட்கச் செய்திருந்தார். அவர்கள் ஒருவருக்கொருவர், “இதோ, இஸ்ரவேலின் அரசன் நமக்கு எதிராக வருவதற்காக ஏத்தியர்களின் அரசர்களையும் எகிப்தின் அரசர்களையும் கூலிக்கு அமர்த்தியிருக்கிறான்” என்று சொன்னார்கள்.
