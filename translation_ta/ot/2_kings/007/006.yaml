source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: ta
  text: ஆண்டவர் அராமின் படைமுகாமுக்கு தேர்களின் ஓசையையும், குதிரைகளின் ஓசையையும், ஒரு பெரும் படையின் ஓசையையும் கேட்கச் செய்திருந்தார். அவர்கள் ஒருவருக்கொருவர், “இதோ, இஸ்ரவேலின் அரசன் நமக்கு எதிராக வருவதற்காக ஏத்தியர்களின் அரசர்களையும் எகிப்தின் அரசர்களையும் கூலிக்கு அமர்த்தியிருக்கிறான்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: ஆண்டவர்
  rationale: இங்கு אֲדֹנָי இஸ்ரவேலின் இறைவனைக் குறிக்கும் தெய்வீகப் பட்டம்; நவீனத் தமிழில் இயல்பான மரியாதைமிக்க இணைச்சொல் ‘ஆண்டவர்’.
- source_word: הִשְׁמִיעַ
  choice: கேட்கச் செய்திருந்தார்
  rationale: שׁמע என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாக்கிறது; சுற்றியுள்ள நிகழ்விற்கான முன்னைய காரணத்தை விளக்கும் தன்மையையும் ‘செய்திருந்தார்’ வெளிப்படுத்துகிறது.
- source_word: מַחֲנֵה אֲרָם
  choice: அராமின் படைமுகாம்
  rationale: ‘அராம்’ என்ற எபிரெயப் பெயரை நேரடியாகப் பாதுகாத்து, சூழலில் מַחֲנֶה குறிக்கும் இராணுவ முகாமைத் தெளிவாக்குகிறது.
- source_word: קוֹל רֶכֶב ... קוֹל סוּס ... קוֹל חַיִל גָּדוֹל
  choice: தேர்களின் ஓசை ... குதிரைகளின் ஓசை ... ஒரு பெரும் படையின் ஓசை
  rationale: மூலத்தில் மும்முறை வரும் קוֹל என்ற சொல்லின் திரும்புரையைப் பாதுகாத்து இராணுவ ஒலிப்படிமத்தைத் தெளிவாக வழங்குகிறது.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: அவர்கள் ஒருவருக்கொருவர் ... சொல்லிக்கொண்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘ஒவ்வொருவனும் தன் சகோதரனிடம்’ என்றாலும், இது பரஸ்பர உரையாடலைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் இயல்பாக அதன் பொருளை வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலச் சொல்லின் சுட்டும் வலிமையை மரியாதைமிக்க, இயல்பான தமிழில் தருகிறது.
- source_word: שָׂכַר עָלֵינוּ
  choice: நமக்கு எதிராக ... கூலிக்கு அமர்த்தியிருக்கிறான்
  rationale: שׂכר என்பதன் ‘கூலிக்கு அமர்த்து’ என்ற பொருளையும், עַל என்பதன் பகைமைச் சூழலிலான ‘எதிராக’ என்ற பொருளையும் காக்கிறது; மூலத்தில் இல்லாத ‘கூலிப்படையினர்’ என்பதைச் சேர்க்கவில்லை.
- source_word: מַלְכֵי הַחִתִּים
  choice: ஏத்தியர்களின் அரசர்கள்
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, மக்கள் பெயரைத் தமிழில் நிலைபெற்ற வேதாகம வடிவில் வழங்குகிறது.
- source_word: מַלְכֵי מִצְרַיִם
  choice: எகிப்தின் அரசர்கள்
  rationale: வரலாற்று ரீதியாக எதிர்பாராததாகத் தோன்றினாலும், எபிரெய மூலத்திலுள்ள ‘அரசர்கள்’ என்ற பன்மையை மாற்றாமல் காக்கிறது.
- source_word: לָבוֹא עָלֵינוּ
  choice: நமக்கு எதிராக வருவதற்காக
  rationale: பகைமையான நகர்வைச் சொல்வதுடன், ‘தாக்குவதற்காக’ என்று பொருளை மிகுதியாகத் தீர்மானிக்காமல் மூலத்தின் வடிவத்துக்கு நெருக்கமாக உள்ளது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இந்தக் கதையாடலில் இச்சொல் இஸ்ரவேலின் இறைவனைக் குறிக்கிறது. ‘ஆண்டவர்’ என்பது தெய்வீகப் பட்டத்தை இயல்பாகத் தருகிறது; ஆனால் மூலத்தில் இல்லாத יהוה என்ற தனிப்பெயரை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை. மூலத்தின் காரணவினை, ஒலி என்ற சொல்லின் மும்முறைத் திரும்புரை, அரசர்கள் என்ற இரு பன்மைகள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. விளக்கமின்றி தேவையற்ற அடிக்குறிகள் சேர்க்கப்படவில்லை.
