base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/011.yaml
  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: ta
  text: அப்போது வாயிற்காவலர்கள் உரக்கக் கூவி, அந்தச் செய்தியை அரண்மனைக்குள் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் வீட்டுக்குள் தெரிவித்தார்கள்.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “அரசனின் வீட்டுக்கு உள்ளே” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: உரக்க அழைத்து
  rationale: קרא என்பதன் இச்சூழலிலுள்ள பொருள் செய்தியை உள்ளே கேட்குமாறு குரலெழுப்பி அழைப்பதாகும். ஒருமை வினைச்சொல் தொடர்ந்து வரும் கூட்டுப் பன்மை எழுவாயோடு அமைந்துள்ளது; தமிழில் இயல்பாகப் பன்மை வினையெச்சமாகத் தரப்பட்டுள்ளது.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: நகர வாயிலில் காவல் அல்லது பொறுப்பு வகித்தவர்களைக் குறிக்கும் நேரடியான, தற்காலத் தமிழ்ச் சொல்.
- source_word: וַיַּגִּידוּ
  choice: அந்தச் செய்தியை ... தெரிவித்தார்கள்
  rationale: נגד இங்கு அறியச் செய்தல் அல்லது தகவலை அறிவித்தல் எனப் பொருள்படுகிறது. எபிரெயத்தில் நேரடிச் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனங்களில் வந்த தகவலைக் குறிக்கத் தமிழில் ‘அந்தச் செய்தியை’ சேர்ப்பது இயல்பும் தெளிவும் தருகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரண்மனை
  rationale: சொல்லுக்குச் சொல் ‘அரசனின் வீடு’ என்றாலும், இச்சூழலில் அரசனின் இருப்பிடமான அரண்மனையைக் குறிக்கிறது. ‘அரண்மனை’ நவீனத் தமிழில் இயல்பான சமமான சொல்; குடும்பத்தாரா கட்டடமா என்ற எபிரெயத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פְּנִימָה
  choice: உள்ளே
  rationale: வாயிலிலிருந்து அரசனின் வீட்டின் உட்பகுதியை நோக்கிய தகவல் பரிமாற்றத்தின் திசையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
