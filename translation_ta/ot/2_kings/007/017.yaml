  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: ta
  text: அரசன் யாருடைய கையின்மேல் சாய்ந்துகொண்டிருந்தானோ அந்த உயரதிகாரியை[b] நகரவாயிலுக்குப் பொறுப்பாளராக நியமித்திருந்தான். ஆனால் மக்கள் நகரவாயிலில் அவனை மிதித்தார்கள்; அவன் இறந்தான். அரசன் இறைவனின் மனிதரிடம் இறங்கி வந்தபோது அவர் கூறியபடியே இது நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘உயரதிகாரி’ என்பதற்கான எபிரெயச் சொல் அரசனுக்கு நெருக்கமான உயர்நிலை இராணுவ அதிகாரி, அரசவை அதிகாரி அல்லது அரச உதவியாளரைக் குறிக்கலாம்; துல்லியமான பதவி உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: நகரவாயிலுக்குப் பொறுப்பாளராக நியமித்திருந்தான்
  rationale: הִפְקִיד என்பதன் Hiphil வடிவமும் அதனுடன் வரும் עַל என்பதும் ஒருவரிடம் மேற்பார்வைப் பொறுப்பை ஒப்படைப்பதைக் குறிக்கின்றன. முன்பு செய்யப்பட்ட நியமனத்தை இவ்வசனம் நினைவுபடுத்துவதால் ‘நியமித்திருந்தான்’ என மொழிபெயர்க்கப்பட்டது. சூழலில் இது நகரத்தின் வாயில் என்பதால் இயல்பான தமிழுக்காக ‘நகரவாயில்’ பயன்படுத்தப்பட்டது.
- source_word: הַשָּׁלִישׁ
  choice: அந்த உயரதிகாரி
  rationale: שָׁלִישׁ என்பது அரசனுக்கு நெருக்கமான உயர்நிலை இராணுவ அல்லது அரசவை அதிகாரியைக் குறிக்கலாம். துல்லியமான பதவி உறுதியாக இல்லாததால் ‘தளபதி’ போன்ற மிகக் குறிப்பான சொல்லைத் தவிர்த்து ‘உயரதிகாரி’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: தான் கையில் சாய்ந்துகொள்ளும்
  rationale: மூலத்தின் ‘அவனுடைய கையின்மேல் சாய்ந்தான்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது. தமிழ் வாக்கியத்தில் ‘தான்’ என்பது அரசனைக் குறிக்கிறது; இது அந்த அதிகாரி அரசனுக்கு நெருக்கமான உதவியாளர் என்பதைக் காட்டுகிறது.
- source_word: וַיִּרְמְסֻהוּ הָעָם בַּשַּׁעַר
  choice: மக்கள் நகரவாயிலில் அவனை மிதித்தார்கள்
  rationale: רמס என்பதன் நேரடிப் பொருளான ‘மிதித்தல்’ பாதுகாக்கப்பட்டது. הָעָם என்பதற்கு விளக்கமாக ‘கூட்டம்’ என்று மாற்றாமல் ‘மக்கள்’ என வழங்கப்பட்டது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: மூலத்தில் மரணம் தனி தொடர்வினையாக நேரடியாகக் கூறப்படுகிறது; அதே நேரடித்தன்மை தமிழிலும் பாதுகாக்கப்பட்டது.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர் ... கூறியபடியே இது நடந்தது
  rationale: முன்னர் கூறப்பட்ட இறைவாக்கு துல்லியமாக நிறைவேறியதை כַּאֲשֶׁר דִּבֶּר வலியுறுத்துகிறது. தமிழில் இயல்பாக இருக்க ‘இது நடந்தது’ சேர்க்கப்பட்டாலும், புதிய நிகழ்வு அல்லது கருத்து எதுவும் சேர்க்கப்படவில்லை.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: எபிரெய உரையின் நிலையான சிறப்புப்பெயர் முறையாகவே பாதுகாக்கப்பட்டது; அதை விளக்கமாக ‘தீர்க்கதரிசி’ என்று மாற்றவில்லை.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: அரசன் இறைவனின் மனிதரிடம் இறங்கி வந்தபோது
  rationale: בְּ + infinitive construct காலத்தைக் குறிக்கிறது. אֵלָיו என்பதன் சுட்டுப்பெயர் தமிழில் தெளிவுக்காக ‘இறைவனின் மனிதரிடம்’ என்று மீண்டும் குறிப்பிடப்பட்டது; ‘இறங்கி’ என்ற இடவியல் கூறும் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: இறைவாக்கின் நிறைவேற்றம்
  choice: அதிகாரியின் மரணம் இறைவனின் மனிதர் முன்பு கூறியதன்படியே நடந்ததாக வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: நிகழ்வை மட்டும் கூறி, முன்னைய இறைவாக்குடன் உள்ள தொடர்பை மெலிதாக்குவது.
  rationale: כַּאֲשֶׁר דִּבֶּר என்ற மூலவாக்கியம் நிகழ்வையும் முந்தைய அறிவிப்பையும் நேரடியாக இணைக்கிறது. ஆகவே நிறைவேற்றத்தின் வலியுறுத்தல் பாதுகாக்கப்பட்டது; அதற்கு அப்பாற்பட்ட இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டம்
  choice: ‘இறைவனின் மனிதர்’ என்ற மூலத்துக்கு நெருக்கமான பட்டம் பயன்படுத்தப்பட்டது.
  alternative: ‘இறைவனின் தீர்க்கதரிசி’ என்று பொருள்விளக்கமாக வழங்குவது.
  rationale: அந்த நபர் தீர்க்கதரிசியாகச் செயல்பட்டாலும், இவ்விடத்தில் எபிரெய உரை பயன்படுத்தும் குறிப்பிட்ட பட்டத்தை மாற்றாமல் வைத்திருப்பது உரையின் சொற்பாங்கையும் இறையியல் நிறத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் கதையோட்டமும் காக்கப்பட்டுள்ளன. ‘நகரவாயில்’, ‘பொறுப்பாளர்’, ‘உயரதிகாரி’ போன்ற சொற்கள் சாதாரண வாசகருக்கு தெளிவாகவும் மூலத்தின் நிர்வாக மற்றும் அரசவைச் சூழலை உணர்த்துமாறும் தேர்ந்தெடுக்கப்பட்டன. மூலத்தில் இல்லாத தொடக்கக் காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை.
