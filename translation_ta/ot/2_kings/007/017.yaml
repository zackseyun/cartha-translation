  terminology: ‘உயரதிகாரி’ என்பது שָׁלִישׁ என்பதற்குப் பாதுகாப்பான, மிகைப்படுத்தாத தெரிவாகும். ‘இறைவனின் மனிதர்’ மூலத்தில் உள்ள אִישׁ הָאֱלֹהִים என்ற பட்டத்தைப் பாதுகாக்கிறது. ‘நகரவாயில்’ சூழலுக்கு ஏற்றது; வாயிலின் பொறுப்பு மற்றும் வாயிலிலேயே நடந்த மிதித்தல் ஆகிய இரண்டையும் வேறுபடுத்திக் காட்டுகிறது.
