- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: அப்போது அரசன் இரவிலே எழுந்து
  rationale: קום என்பதன் கதைநடை வடிவம் இரவில் படுக்கை அல்லது ஓய்விலிருந்து எழுவதைக் குறிக்கிறது; ‘இரவிலே எழுந்து’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: עֲבָדָיו
  choice: தன் ஊழியர்களிடம்
  rationale: அரசவையின் பணியாளர்கள் அல்லது அதிகாரிகளை விரிவாகக் குறிக்கக்கூடிய சொல்லாக இருப்பதால், பொதுவான ‘ஊழியர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: நான் உங்களுக்குச் சொல்கிறேன், கேளுங்கள்
  rationale: கோஹார்ட்டேட்டிவ் வடிவமும் נָא துகளும் முன்மொழிவு அல்லது வலியுறுத்திய அழைப்பைக் காட்டுகின்றன. தமிழில் இயல்பற்ற ‘தயவுசெய்து நான் சொல்லட்டும்’ என்பதற்குப் பதில், மரியாதை/வலியுறுத்தலை ‘கேளுங்கள்’ வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: ஆராம் நமக்கு என்ன செய்திருக்கிறது
  rationale: אֲרָם என்பது நாட்டின் அல்லது இடத்தின் பெயர்; இங்கே அதன் மக்கள் அல்லது படையைக் குறிக்கும் ஆகுபெயராக உள்ளது. பாரம்பரிய ‘சீரியா’ என்பதற்குப் பதில் மூலப் பெயரான ‘ஆராம்’ வைக்கப்பட்டது.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: நாம் பசியாயிருக்கிறோம் என்பது அவர்களுக்குத் தெரியும்
  rationale: அரசன் எதிரிகளின் தற்போதைய அறிவை விவரிப்பதால் நிகழ்காலம் பொருத்தமானது.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: அவர்கள் முகாமைவிட்டு வெளியேறி
  rationale: சமீபத்தில் நிறைவடைந்து தற்போதைய சூழலோடு தொடர்புடைய செயலைத் தமிழ் வினையெச்ச அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: வெளியிடத்தில் பதுங்கியிருக்கிறார்கள்
  rationale: חבא தம்மை மறைத்துக்கொள்வதைக் குறிக்கிறது; பதுங்கித் தாக்கும் சூழலில் ‘பதுங்கியிருக்கிறார்கள்’ துல்லியமானது. שדה நகருக்கு வெளியிலுள்ள திறந்த நிலப்பகுதியைக் கூட்டாகக் குறிக்கக்கூடும் என்பதால் ‘வெளியிடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: அவர்கள் நகரத்திலிருந்து வெளியே வரும்போது
  rationale: எதிர்பார்க்கப்படும் பதுங்கித் தாக்கும் தருணத்தை כִּי அறிமுகப்படுத்துவதால் ‘வரும்போது’ சூழலுக்கு ஏற்றது; ‘வந்தால்’ என்பதும் சாத்தியம்.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: அவர்களை உயிரோடு பிடித்துக்கொண்டு
  rationale: תפשׂ பிடித்தல் அல்லது கைப்பற்றுதலைக் குறிக்கிறது; חַיִּים இங்கே ‘உயிரோடு’ என்ற நிலையைக் குறிக்கிறது.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: நகருக்குள் நுழைவோம்
  rationale: நகரை நோக்கிச் சென்று அதனுள் புகும் நோக்கம் சூழலில் தெளிவாக இருப்பதால் இயல்பான தமிழில் ‘நகருக்குள் நுழைவோம்’ என வழங்கப்பட்டது.
