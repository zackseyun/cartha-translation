  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: ta
  text: அப்போது அரசன் இரவில் எழுந்து, தன் ஊழியர்களிடம், “ஆராம்[a] நமக்குச் செய்ததை உங்களுக்குச் சொல்லட்டும். நாம் பசியாயிருக்கிறோம் என்பது அவர்களுக்குத் தெரியும். அதனால் அவர்கள், ‘அவர்கள் நகரத்திலிருந்து வெளியே வரும்போது, அவர்களை உயிரோடு பிடித்துக்கொண்டு நகருக்குள் நுழைவோம்’ என்று சொல்லி, வயல்வெளியில் பதுங்குவதற்காக முகாமிலிருந்து வெளியேறியிருக்கிறார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆராமியர்கள்.” எபிரெய மொழியில் நாட்டின் பெயரான “ஆராம்” என்பது இங்கே ஆராம் நாட்டின் மக்களையோ அதன் படையையோ குறிக்கிறது.
    reason: lexical_alternative
