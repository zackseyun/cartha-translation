  register: நவீனத் தரமான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அரசவைக் கூறுகளுக்கு மிகப் பழமையான சொற்களைத் தவிர்த்து, சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன. நேரடி உரையின் திட்டமிடும் தொனியும், அரசன் ஊகித்த எதிரியின் பதுங்குத் திட்டமும் பாதுகாக்கப்பட்டுள்ளன.
