base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: ta
  text: அப்போது அந்த அதிகாரி தேவனுடைய மனிதருக்குப் பதிலளித்து, “இதோ, யாவே வானத்தில் சாளரங்களை[a] உண்டாக்கினால், இப்படிப்பட்ட காரியம் நடக்குமா?” என்றான். அதற்கு அவர், “இதோ, நீ உன் கண்களாலேயே அதைக் காண்பாய்; ஆனால் அதிலிருந்து நீ சாப்பிடமாட்டாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்தின் மதகுகளை.” எபிரெய மொழியில் நேரடியாக “வானத்தில் சாளரங்கள்” என்று உள்ளது; வானத்திலிருந்து வளமோ தண்டனையோ வருவதற்கான திறப்புகளை இது உருவகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: அந்த அதிகாரி
  rationale: இச்சொல் உயர்நிலை இராணுவ அல்லது அரசவை அதிகாரியைக் குறிக்கிறது. எபிரெயச் சொல் துல்லியமான பதவிப் பெயரை நிர்ணயிக்காததால், ‘அதிகாரி’ என்பது மிகைப்படுத்தாமல் பொருளைத் தருகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: தீர்க்கதரிசிக்குரிய நிலையான எபிரெயப் பட்டத்தின் அமைப்பையும் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இடம்பெறும் தேவனுடைய தனிப்பெயரைப் பெயராகவே தருகிறது.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: வானத்தில் சாளரங்களை உண்டாக்கினால்
  rationale: ‘சாளரங்கள்’ என்ற மூல உருவகத்தையும் ‘உண்டாக்குதல்’ என்ற வினையையும் பாதுகாக்கிறது; நிபந்தனை வடிவம் அதிகாரியின் ஐயம்கலந்த எதிர்க்கேள்வையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: இப்படிப்பட்டது நடக்குமா?
  rationale: தீர்க்கதரிசனம் நிறைவேறுமா என்று சந்தேகிக்கும் சொல்லாட்சியை இயல்பான தமிழ் எதிர்க்கேள்வியாகத் தருகிறது.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: இதோ, நீ உன் கண்களாலேயே அதைக் காண்பாய்
  rationale: הִנְּךָ என்பதன் கவன ஈர்ப்பையும், சூழலில் எதிர்கால முன்னறிவிப்பாகச் செயல்படும் பங்கேற்பு வினையையும், உடைமைச் சுட்டின் வலியுறுத்தலையும் பாதுகாக்கிறது.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: ஆனால் அதிலிருந்து நீ சாப்பிடமாட்டாய்
  rationale: מִשָּׁם என்பதன் சொற்பொருள் ‘அங்கிருந்து’ என்றாலும், அது முன்சொல்லப்பட்ட உணவுப் பெருக்கைக் குறிப்பதால் ‘அதிலிருந்து’ என்பது தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கெழுத்துத் தேவநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: அதிகாரியின் கூற்றிலுள்ள ஐயமும் பரலோகச் சாளரங்களின் உருவகமும்
  choice: உருவகத்தையும் எதிர்க்கேள்வியையும் விளக்கமின்றி முதன்மை உரையில் பாதுகாத்தல்
  alternative: ‘யாவே வானத்தின் மதகுகளைத் திறந்தாலும்கூட’ என்று கருத்தை வெளிப்படையாக்குதல்
  rationale: மூலத்தின் அசாதாரண உருவகமும், அது சாத்தியமற்றது என்று கருதும் அதிகாரியின் குரலும் இறையியல் பதற்றத்தை உருவாக்குகின்றன; அவற்றை உரையிலேயே தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. அதிகாரியின் பேச்சுக்கு ‘என்றான்’ என்றும், இறைவனுடைய மனிதருக்கான மரியாதைத் தமிழாக ‘என்றார்’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
