base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: ta
  text: அப்போது அவனுடைய பணியாளர்களில் ஒருவன் பதிலளித்து, “தயவுசெய்து, அதில்[a] எஞ்சியிருக்கும் மீதமுள்ள குதிரைகளில் ஐந்தை எடுத்துக்கொள்ளட்டும். இதோ, அவை அதில் எஞ்சியிருக்கும் இஸ்ரவேல் மக்கள் திரள் முழுவதையும் போன்றவையே; இதோ, அவை அழிந்துபோன இஸ்ரவேல் மக்கள் திரள் முழுவதையும் போன்றவையே[b]. ஆகவே, நாம் அனுப்பிப் பார்ப்போம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதில்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயப் பெண்பால் ஒருமைச் சுட்டுப்பெயர் சமாரியா நகரத்தைக் குறிக்கலாம்; ஆனால் இந்த வசனத்திலேயே நகரத்தின் பெயர் மீண்டும் சொல்லப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: 'இந்த வசனத்தின் எபிரெய ஒப்பீடு கடினமாகவும் மீளுரையுடனும் உள்ளது: ‘அதில் எஞ்சியிருக்கும் இஸ்ரவேல் மக்கள் திரள் முழுவதையும் போல … அழிந்துபோன இஸ்ரவேல் மக்கள் திரள் முழுவதையும் போல.’ உரையின் இந்த மீளுரை எளிமைப்படுத்தப்படாமல் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.'
    reason: textual_variant
