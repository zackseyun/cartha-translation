theological_decisions:
- issue: எஞ்சியவர்களையும் அழிந்தவர்களையும் ஒப்பிடும் கடினமான இரட்டைக் கூற்று
  choice: இரண்டு ஒப்பீடுகளையும் மீளுரையுடன் அப்படியே காத்தல்
  alternative: ‘எப்படியும் மற்ற இஸ்ரவேலரைப் போல அவர்களும் சாவார்கள்’ என்று பொருளைச் சுருக்குதல்
  rationale: எபிரெய உரை திட்டமிட்டோ உரைச்சிக்கலாலோ கொண்டுள்ள இறுக்கத்தையும் மறுபடியும் வரும் ஒப்பீட்டையும் தீர்த்து எழுதாமல் பாதுகாக்கிறது; இங்கு குறிப்பாக ஓர் இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மறுமொழியாக’, ‘இதோ’, ‘மக்கள் திரள்’ ஆகியவை விவிலியக் கதைநடையின் மரியாதையான தொனியைத் தக்கவைக்கின்றன; அதேவேளை பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
