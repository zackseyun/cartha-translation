translation_notes:
  register: நவீன பொதுத்தமிழில், அவசரமும் உயிர் பிழைப்பதற்கான கடுமையான ஆலோசனையும் வெளிப்படும் வகையில் குறுகிய வாக்கியங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘சாவோம்’ என்பது மூலத்தின் நேரடியான மறுமொழியைத் தக்கவைக்கிறது; ‘மரிப்போம்’ என்பதைக் காட்டிலும் இச்சூழலின் உடனடி ஆபத்தை இயல்பாக வெளிப்படுத்துகிறது.
