source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: ta
  text: “‘நகருக்குள் போவோம்’ என்று நாம் சொன்னால், நகரத்தில் பஞ்சம் இருக்கிறது; அங்கே நாம் சாவோம். இங்கேயே உட்கார்ந்திருந்தால், நாம் சாவோம். ஆகவே இப்போது வாருங்கள்; அராமின்[b] முகாமுக்குச் சென்று சரணடைவோம்[a]. அவர்கள் நம்மை உயிரோடு விட்டால், நாம் வாழ்வோம்; அவர்கள் நம்மைக் கொன்றால், நாம் சாவோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சென்று சரணடைவோம்” என்பதற்கான எபிரெய மரபுத்தொடரைச் சொற்சொறாக மொழிபெயர்த்தால், “அவர்களிடம் விழுவோம்” என வரும்; இச்சூழலில் அது எதிரணியிடம் சென்று பணிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பது பொதுவாக “சிரியா” அல்லது “அராமியர்” என்று மொழிபெயர்க்கப்படும் எபிரெயப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא
  choice: நகருக்குள் போவோம்
  rationale: நிபந்தனைக்குள் மேற்கோளாக வரும் முன்மொழிவை இயல்பான தமிழ் ஏவல் வடிவில் தருகிறது.
- source_word: הָרָעָב
  choice: பஞ்சம்
  rationale: இங்கு தனிப்பட்ட பசியை அல்ல, முற்றுகையால் ஏற்பட்ட பரவலான உணவுப் பற்றாக்குறையைக் குறிக்கிறது.
- source_word: יָשַׁבְנוּ פֹה
  choice: இங்கேயே உட்கார்ந்திருந்தாலும்
  rationale: ישב என்பதன் நேரடியான ‘உட்கார்ந்திரு’ என்ற உருவகத் தெளிவையும், அங்கேயே தங்கியிருக்கும் கருத்தையும் தக்கவைக்கிறது.
- source_word: וְנִפְּלָה אֶל
  choice: போய்ச் சரணடைவோம்
  rationale: இராணுவச் சூழலில் נפל אל எதிரணியிடம் போய்ப் பணிவதை அல்லது சரணடைவதை குறிக்கும் எபிரெய மரபுத்தொடர்; சொற்சொறான ‘விழுவோம்’ தமிழில் பொருளைத் தவறாக உணர்த்தும்.
- source_word: מַחֲנֵה אֲרָם
  choice: அராமியரின் முகாம்
  rationale: אֲרָם என்பதை நவீன அரசியல் பெயரான ‘சிரியா’ என்று மாற்றாமல், அக்கால மக்களைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: יְחַיֻּנוּ
  choice: நம்மை உயிரோடு விட்டால்
  rationale: பியேல் வடிவின் ‘உயிருடன் இருக்க விடுதல்/உயிரைக் காத்தல்’ என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְמִיתֻנוּ
  choice: நம்மைக் கொன்றால்
  rationale: מות என்பதன் ஹிபீல் காரணவினைப் பொருளான ‘சாகச் செய்தல்’ என்பதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: நாம் சாவோம்
  rationale: நிபந்தனைத் தொடர்களின் தவிர்க்க முடியாத விளைவை எதிர்கால வடிவில் நேரடியாகத் தெரிவிக்கிறது; மூலத்தின் மறுபடியும் வரும் சொல்லாட்சியையும் தக்கவைக்கிறது.
