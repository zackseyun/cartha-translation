  source_fidelity: மூலத்தின் நிகழ்வோட்டம், அராமின் முகாமைக் கொள்ளையிடுதல், அளவுகள், விலைகள், யாவேயின் வார்த்தையுடனான தொடர்பு ஆகியவை பெரும்பாலும் சரியாக உள்ளன. ஆனால் இறுதியில் சேர்க்கப்பட்டுள்ள “இது நடந்தது” என்பது மூலத்தில் இல்லாத ஒரு சுட்டுப்பொருளைச் சேர்க்கிறது; மேலும் ‘யாவேயின் வார்த்தையின்படி’ என்பது விலை நிலைமை நிறைவேறியதைக் குறிக்கும் நிறைவுச் சூத்திரமாகவே அமைய வேண்டும்.
  naturalness: ‘அப்போது மக்கள் வெளியே சென்று அராமின் முகாமைக் கொள்ளையிட்டார்கள்’ இயல்பானது. விலைத் தொடரில் இரண்டு பொருட்களுக்கும் பொதுவாக வரும் வினைச்சொல்லைப் பயன்படுத்துவதும், இறுதி நிறைவுச் சொற்றொடரைத் தனியாக நிறுத்துவதும் நவீன நிலையான தமிழில் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் இருக்கும்.
