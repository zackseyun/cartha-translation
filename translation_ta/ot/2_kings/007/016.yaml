reference: 2 Kings 7:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: ta
  text: அப்போது மக்கள் வெளியே சென்று அராமின் முகாமைக் கொள்ளையிட்டார்கள். ஒரு சேயா[a] நுண்ணிய மாவும் இரண்டு சேயா வாற்கோதுமையும் ஒரு சேக்கலுக்கு[b] விற்கப்பட்டன; யாவேயின் வார்த்தையின்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேயா’ என்பது பண்டைய உலர் அளவை குறிக்கும் சொல்.
    reason: cultural_note
  - marker: b
    text: ‘சேக்கல்’ என்பது பண்டைய எடை அலகு; அது பண மதிப்பைக் குறிப்பிடவும் பயன்படுத்தப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: அப்போது மக்கள் வெளியே சென்று
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ இயல்பான தமிழ் நிகழ்வோட்டத்தைக் கொடுக்கிறது; ‘மக்கள்’ என்பது הָעָם என்பதன் நேரடியான பொருள்.
- source_word: וַיָּבֹזּוּ
  choice: கொள்ளையிட்டார்கள்
  rationale: בזז என்பது பகைவரிடமிருந்து கொள்ளைப் பொருளை எடுத்துக்கொள்வதைக் குறிக்கிறது. இச்சூழலில் ‘கொள்ளையிட்டார்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: מַחֲנֵה אֲרָם
  choice: அராமின் முகாம்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடிப் பொருள் ‘அராமின் முகாம்.’ பண்டைய இடப்பெயரான ‘அராம்’ அப்படியே ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְהִי
  choice: விற்கப்பட்டது
  rationale: விலை நிலவரத்தைக் கூறும் இச்சூழலில் பொருட்கள் அந்த விலையில் கிடைத்தன அல்லது விற்கப்பட்டன என்பதே கருத்து. தமிழில் பொருள் தெளிவாக இருக்க ‘விற்கப்பட்டது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: סְאָה / סָאתַיִם
  choice: ஒரு சேயா / இரண்டு சேயா
  rationale: சேயா என்பது குறிப்பிட்ட பண்டைய உலர் அளவை குறிக்கிறது; இருமை வடிவான סָאתַיִם துல்லியமாக ‘இரண்டு சேயா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: סֹלֶת சாதாரண மாவை அல்ல, நன்றாக அரைக்கப்பட்ட மெல்லிய மாவைக் குறிக்கிறது.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: இது barley என்னும் தானியத்தைக் குறிக்கும் வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: בְּשֶׁקֶל
  choice: ஒரு சேக்கலுக்கு
  rationale: விலைச் சூழலில் בְ என்பதைக் ‘-க்கு’ என இயல்பாக வழங்கலாம். பண்டைய எடை/பண மதிப்புப் பெயர் ‘சேக்கல்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படியே
  rationale: முன்பு அறிவிக்கப்பட்ட இறைவார்த்தை நிறைவேறியதைச் சுட்டும் மூலமொழி அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கையின் பெயரை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: כִּדְבַר יְהוָה என்பதில் நிறைவேற்றத்தின் தொடர்பு
  choice: யாவேயின் வார்த்தையின்படியே இது நடந்தது
  alternative: யாவே சொன்னபடியே
  rationale: ‘வார்த்தையின்படி’ என்ற மூலமொழி வடிவத்தையும், இங்கு முன் அறிவிப்பு நிறைவேறுகிறது என்ற கதைத் தொடர்பையும் ஒருங்கே தெளிவாக்குகிறது; யார் மூலம் அந்த வார்த்தை அறிவிக்கப்பட்டது என்பதை வசனம் தானாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. பண்டைய அளவுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன. விலைச் சொல்லாக்கத்தில் இயல்பான தமிழுக்காக ‘விற்கப்பட்டது’ சேர்க்கப்பட்டுள்ளது; இறுதிப் பகுதி மூலத்தின் நிறைவேற்றச் சூத்திரத்தைப் பாதுகாக்கிறது.
