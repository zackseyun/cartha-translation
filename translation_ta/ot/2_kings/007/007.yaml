base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: ta
  text: அப்போது அவர்கள் எழுந்து, மங்கற்பொழுதில்[a] தப்பியோடினார்கள். தங்கள் கூடாரங்களையும், குதிரைகளையும், கழுதைகளையும், முகாமை இருந்தபடியே[b] விட்டுவிட்டு, தங்கள் உயிரைக் காப்பாற்றிக்கொள்ளத் தப்பியோடினார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்திப்பொழுதில்” அல்லது “விடியற்கால மங்கலில்.” נֶשֶׁף என்பது மங்கலொளி நேரத்தைக் குறிக்கும்; இங்கு அது மாலை அல்லது விடியலைக் குறிப்பதா என்பது சொல்லியல் அளவில் தெளிவாக இல்லை.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “முகாம் இருந்தபடியே”; அதாவது, முகாமை அதன் நிலையிலேயே விட்டுச் சென்றார்கள்.
    reason: lexical_alternative
  - marker: c
    text: சொற்படியாக, “தங்கள் உயிரை நோக்கித் தப்பியோடினார்கள்”; இது உயிர் பிழைப்பதற்காக ஓடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: அந்திப்பொழுதில்
  rationale: נֶשֶׁף என்பது வெளிச்சம் மங்கும் பொழுதைக் குறிக்கிறது. சூழல் மாலை அந்தியைச் சுட்டினாலும், சொல்லின் பொதுவான ‘twilight’ நுட்பத்தைத் தக்கவைக்க ‘அந்திப்பொழுதில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּעַזְבוּ
  choice: விட்டுவிட்டு ... கைவிட்டு
  rationale: עזב என்பதன் அடிப்படைப் பொருள் ‘விடுதல்/கைவிடுதல்.’ பொருட்களுக்கு ‘விட்டுவிட்டு’ என்றும் முகாமின் முழுநிலையை வலியுறுத்த ‘கைவிட்டு’ என்றும் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்கள்
  rationale: இராணுவ முகாமின் சூழலில் אָהֶל என்பதற்கான நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: סוּסֵיהֶם
  choice: தங்கள் குதிரைகள்
  rationale: மூலச்சொல்லின் நேரடியான தமிழ் இணை.
- source_word: חֲמֹרֵיהֶם
  choice: தங்கள் கழுதைகள்
  rationale: சுமை சுமக்கும் வீட்டுவிலங்கைக் குறிக்கும் வழக்கமான நவீன தமிழ் சொல்.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: முகாமை இருந்தபடியே
  rationale: அவசரமாக ஓடியதால் முகாம் இருந்த நிலையிலேயே விடப்பட்டது என்பதை, ‘அப்படியே’ என்று விளக்கமாகச் சுருக்காமல், மூலத்தின் அமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: தங்கள் உயிரைக் காப்பாற்றிக்கொள்ளத் தப்பியோடினார்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘தங்கள் உயிரை நோக்கித் தப்பியோடினர்’; உயிர் பிழைப்பதற்காக ஓடினர் என்ற இடியத்தை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וַיָּקוּמוּ
  choice: அவர்கள் எழுந்து
  rationale: קום அவசரமான செயல் தொடங்குவதைச் சுட்டுகிறது; ‘எழுந்து’ என்பது இயல்பாகவும் மூலத்தின் கதைநடைக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: தப்பியோடினார்கள் ... தப்பியோடினார்கள்
  rationale: נוּס என்ற ஒரே வினைச்சொல் இருமுறை வருவதைத் தமிழிலும் மீளுரைப்பதன் மூலம் மூலத்தின் அவசரமும் வலியுறுத்தலும் பாதுகாக்கப்படுகின்றன.
