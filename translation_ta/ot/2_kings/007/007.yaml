translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் ‘தப்பியோடுதல்’ இருமுறை வருவது பாதுகாக்கப்பட்டுள்ளது. காலச்சொல்லின் சாத்தியமான தெளிவின்மையும் இறுதி இடியத்தின் சொற்பொருளும் அடிக்குறிப்புகளில் தெரிவிக்கப்பட்டுள்ளன.
