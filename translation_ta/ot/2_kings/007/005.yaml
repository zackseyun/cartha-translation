  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: ta
  text: அவர்கள் அந்திப் பொழுதில் எழுந்து, அராமின் முகாமுக்குச் சென்றார்கள். அவர்கள் அராமின் முகாமின் ஓரத்தை அடைந்தபோது, இதோ, அங்கே ஒருவரும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: அவர்கள் ... எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் ‘எழுந்து’ என்பது இயல்பாகவும் மூலத்தின் செயலையும் தெளிவாகவும் தருகிறது.
- source_word: בַנֶּשֶׁף
  choice: அந்திப் பொழுதில்
  rationale: இச்சூழலில் נֶשֶׁף மாலை மங்கும் நேரத்தைக் குறிக்கிறது; ‘அந்திப் பொழுது’ நவீனத் தமிழில் இயல்பான, கண்ணியமான சொல்.
- source_word: לָבוֹא אֶל־מַחֲנֵה אֲרָם
  choice: அராமின் முகாமுக்குச் சென்றார்கள்
  rationale: בוא இங்கு முகாமை நோக்கிய இயக்கத்தைச் சுட்டுகிறது. தமிழ் பார்வைநிலையில் ‘சென்றார்கள்’ இயல்பாக உள்ளது; நோக்கத்தைக் காட்டும் எபிரெய அமைப்பு தொடர்ச்சியான தமிழ் வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: עַד־קְצֵה מַחֲנֵה אֲרָם
  choice: அராமின் முகாமின் ஓரத்தை அடைந்தபோது
  rationale: קָצֶה முகாமின் வெளிப்புற எல்லை அல்லது ஓரத்தைக் குறிக்கிறது. ‘அடைந்தபோது’ அடுத்த கண்டுபிடிப்புக்கான காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה எதிர்பாராத காட்சியின்மீது கவனத்தை ஈர்க்கிறது; ‘இதோ’ அந்த உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֵין שָׁם אִישׁ
  choice: அங்கே ஒருவரும் இல்லை
  rationale: אִישׁ இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், இச்சூழலில் எந்த மனிதரும் இல்லாததையே குறிக்கிறது. ‘ஒருவரும் இல்லை’ என்பது பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல், பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: אִישׁ என்ற ஆண்பால் ஒருமைச் சொல்லின் பொதுப்பொருள்
  choice: அங்கே ஒருவரும் இல்லை
  alternative: அங்கே ஒரு மனிதனும் இல்லை
  rationale: சூழல் ஆண்கள் மட்டும் இல்லாததை அல்ல, முகாமில் எந்த நபரும் இல்லாததைச் சொல்கிறது. தமிழில் ‘ஒருவரும் இல்லை’ என்பது மூலத்தின் பொதுப்பொருளை இயல்பாகத் தக்கவைக்கிறது; இங்கு தனிப்பட்ட கோட்பாட்டு விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகருக்குப் புரியும் இயல்பான தொடர்கதை நடை. ‘இதோ’ மூலம் எபிரெய உரையின் திடீர் கண்டுபிடிப்பு வலிமை பாதுகாக்கப்பட்டுள்ளது.
