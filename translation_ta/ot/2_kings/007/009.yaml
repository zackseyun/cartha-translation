translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘நற்செய்தி’ இங்கு சமயத் தொழில்நுட்பச் சொல்லாக அல்லாமல் நல்ல செய்தி என்ற பொதுப் பொருளில் வருகிறது. எபிரெயத்தில் உள்ள குற்றம்/தண்டனை மற்றும் அரச வீடு/அரண்மனை ஆகிய பொருள் விரிவுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
