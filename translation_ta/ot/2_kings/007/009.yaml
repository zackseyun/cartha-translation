  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: ta
  text: அப்போது அவர்கள் ஒருவருக்கொருவர், “நாம் செய்வது சரியல்ல. இன்று நல்ல செய்திக்கான நாள்; நாமோ மௌனமாக இருக்கிறோம். காலை வெளிச்சம் வரும்வரை நாம் காத்திருந்தால், குற்றம் நம்மை வந்தடையும்[a]. ஆகவே, வாருங்கள்; நாம் போய் அரசரின் இல்லத்தாரிடம்[b] இதை அறிவிப்போம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தண்டனை நம்மை வந்தடையும்” அல்லது “நாம் குற்றவாளிகளாவோம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, “குற்றம்/அக்கிரமம் நம்மைக் கண்டடையும்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அரசரின் இல்லத்தார்” என்பதை “அரசரின் வீடு” அல்லது “அரண்மனை” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: நாம் செய்வது சரியல்ல
  rationale: ‘நாம் இவ்வாறு செய்வது சரியல்ல’ என்ற அறநிலை மதிப்பீட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரை இயந்திரமாகப் பின்பற்றவில்லை.
- source_word: יוֹם בְּשֹׂרָה
  choice: நற்செய்தியின் நாள்
  rationale: בְּשֹׂרָה என்பது இச்சூழலில் விடுதலை அல்லது வெற்றியைப் பற்றிய நல்ல செய்தியைக் குறிக்கிறது. ‘நற்செய்தி’ தெளிவாகவும் சுருக்கமாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: מַחְשִׁים
  choice: மௌனமாக இருக்கிறோம்
  rationale: חרשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு செய்தியை வேண்டுமென்றே சொல்லாமல் இருப்பதைக் குறிக்கிறது; தொடர்ந்திருக்கும் அந்த நிலையை இச்சொற்றொடர் இயல்பாகக் காட்டுகிறது.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: காலை வெளிச்சம் வரும்வரை நாம் காத்திருந்தால்
  rationale: சூழலில் இந்த வினை நிபந்தனைப் பொருள் பெறுகிறது. ‘காலை வெளிச்சம்’ என்பது אוֹר הַבֹּקֶר என்பதிலுள்ள விடியற்கால ஒளியின் படிமத்தைத் தக்கவைக்கிறது.
- source_word: וּמְצָאנוּ עָוֹן
  choice: குற்றம் நம்மை வந்தடையும்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘குற்றம்/அக்கிரமம் நம்மைக் கண்டடையும்’ என்கிறது. ‘வந்தடையும்’ என்ற உருவக மொழி மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது; இது குற்றப்பொறுப்பு அல்லது அதற்கான தண்டனையைக் குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: לְכוּ וְנָבֹאָה
  choice: வாருங்கள்; நாம் போய்
  rationale: கட்டளையும் ஊக்கவினையும் இணைக்கும் எபிரெயத் தொடரை உடனடி கூட்டு நடவடிக்கைக்கான இயல்பான தமிழ் அழைப்பாக வழங்குகிறது.
- source_word: וְנַגִּידָה
  choice: இதை அறிவிப்போம்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் சொல்லுதல் அல்லது அதிகாரப்பூர்வமாகத் தெரிவித்தல் என்ற பொருளுடையது; அவசரச் செய்தியைச் சென்று தெரிவிக்கும் சூழலுக்கு ‘அறிவிப்போம்’ பொருந்துகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச வீட்டாரிடம்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அரசரின் வீடு’ என இருந்தாலும், அது அரச குடும்பத்தாரையும் அரண்மனை அமைப்பையும் குறிக்கலாம். ‘அரச வீட்டார்’ அதன் நிறுவன மற்றும் மக்கள் சார்ந்த பரப்பைத் தக்கவைக்கிறது.
