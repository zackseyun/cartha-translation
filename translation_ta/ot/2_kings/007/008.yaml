base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: ta
  text: அந்தத் தோல் நோயாளிகள்[a] முகாமின் ஓரத்துக்கு வந்தபோது, ஒரு கூடாரத்துக்குள் நுழைந்து, சாப்பிட்டுக் குடித்தார்கள். பின்பு அங்கிருந்த வெள்ளி, தங்கம், உடைகள் ஆகியவற்றை எடுத்துச் சென்று மறைத்து வைத்தார்கள். பிறகு திரும்பி வந்து, வேறொரு கூடாரத்துக்குள் நுழைந்து, அங்கிருந்த பொருட்களையும் எடுத்துச் சென்று மறைத்து வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல், பாரம்பரியமாக ‘தொழுநோய்’ என மொழிபெயர்க்கப்படும் ஒரு தோல் நோயால் பாதிக்கப்பட்டவர்களைக் குறிக்கிறது; அது நவீன மருத்துவத்தில் ‘தொழுநோய்’ எனப்படும் நோயைவிடப் பரந்த வகையான தோல் பாதிப்புகளையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: அந்தத் தோல் நோயாளிகள்
  rationale: צָרַעַת என்பது நவீன மருத்துவத்தில் கூறப்படும் தொழுநோயை மட்டும் குறிக்காமல் பலவகைத் தோல் பாதிப்புகளைக் குறிக்கக்கூடும்; எனவே பொதுவாகப் புரியும், மிகையாகக் குறிப்பாக்காத மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: முகாமின் ஓரம்
  rationale: קָצֶה என்பதன் இடவியல் பொருளான எல்லை அல்லது ஓரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֹהֶל אֶחָד
  choice: ஒரு கூடாரம்
  rationale: எபிரெய உரையின் எண்ணியல் தன்மையையும் தொடர்ச்சியான கதைநடையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: சாப்பிட்டுக் குடித்தார்கள்
  rationale: எளிய தொடர்நிகழ்வைச் சுமுகமான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: அங்கிருந்தவற்றை எடுத்துச் சென்றார்கள்
  rationale: נשא இங்கு பொருட்களை எடுத்துச் செல்லுதல் என்ற பொருளில் வருகிறது; கொள்ளையிட்டார்கள் என்று நோக்கத்தை மேலதிகமாகச் சேர்க்காமல் செயலை மட்டும் தருகிறது.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: வெள்ளி, தங்கம், உடைகள்
  rationale: பொருட்களின் பட்டியலைத் தெளிவான, தற்போதைய தமிழில் வழங்குகிறது.
- source_word: וַיַּטְמִנוּ
  choice: மறைத்து வைத்தார்கள்
  rationale: வினைச்சொல் மறைத்தல் அல்லது ஒளித்து வைத்தல் என்பதைக் குறிக்கிறது; புதைத்தல் என்ற சாத்தியத்தைத் தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: וַיָּשֻׁבוּ
  choice: பிறகு திரும்பி வந்தார்கள்
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹהֶל אַחֵר
  choice: வேறொரு கூடாரம்
  rationale: אַחֵר என்பதன் ‘மற்றொரு/வேறொரு’ பொருளை இயல்பாகத் தருகிறது.
