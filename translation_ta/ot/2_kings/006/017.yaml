  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: ta
  text: அப்போது எலிசா ஜெபித்து, “யாவே,[a] அவன் காணும்படி அவனுடைய கண்களைத் திறந்தருளும்” என்றார். யாவே அந்த இளைஞனின்[b] கண்களைத் திறந்தார்; அவன் கண்டான்; இதோ, எலிசாவைச் சுற்றிலும் குதிரைகளாலும் நெருப்புத் தேர்களாலும் மலை நிறைந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறைவனுடைய தனிப்பெயர் יהוה (YHWH); இது “யாவே” என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பணியாளனின்.” எபிரெய נער (நஅர்) என்பது சூழலுக்கு ஏற்ப இளைஞனையோ பணியாளனையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: ஜெபித்து
  rationale: התפלל என்பதன் இத்பயேல் வடிவம் இங்கு கடவுளை நோக்கிச் செய்யும் வேண்டுதலைக் குறிக்கிறது; நவீன தமிழ் வேதாகம நடையில் ‘ஜெபித்து’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: פְּקַח נָא
  choice: திறந்தருளும்
  rationale: פקח என்பது கண்களைத் ‘திறத்தல்’; נא இங்கு காலப் பொருளைவிட பணிவான வேண்டுதலைக் காட்டுகிறது. ‘திறந்தருளும்’ இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִרְאֶה
  choice: காணும்படி
  rationale: கட்டளைக்குப் பின்வரும் வினை நோக்கம் அல்லது விளைவைக் குறிக்கிறது; ‘காணும்படி’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נער என்பது இளைஞனையோ பணியாளனையோ குறிக்கலாம். வசனத்தில் வெளிப்படையாக இல்லாத சமூகப் பங்கை முதன்மை உரையில் சேர்க்காமல் வயது சார்ந்த அடிப்படைப் பொருள் வைக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הנה காணப்பட்ட காட்சியின்மீது கவனத்தை ஈர்த்து வியப்பையும் திடீர் வெளிப்பாட்டையும் உணர்த்துகிறது; ‘இதோ’ அதன் இயல்பான தமிழ் இணை.
- source_word: הָהָר
  choice: அந்த மலை
  rationale: வரையறைச் சுட்டியுடன் வரும் הר, சூழலில் அறியப்பட்ட உயர்ந்த நிலப்பகுதியைக் குறிக்கிறது; ‘அந்த மலை’ தமிழில் அந்த வரையறையை வெளிப்படுத்துகிறது.
- source_word: מָלֵא
  choice: நிறைந்திருந்தது
  rationale: ‘நிறைந்த’ என்ற பயனிலைப் பொருளை இயல்பான தமிழ் கதைநடையில் ‘நிறைந்திருந்தது’ என்று வழங்குகிறது.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: நெருப்புக் குதிரைகளாலும் தேர்களாலும்
  rationale: இணைக்கப்பட்ட ‘குதிரைகள் மற்றும் நெருப்புத் தேர்/தேர்ப்படை’ என்ற சொற்றொடரில் אֵשׁ இலக்கண ரீதியாக רֶכֶב என்பதுடன் மிக நேரடியாக இணைகிறது. எனவே தமிழ் தொடரை ‘குதிரைகளாலும் நெருப்புத் தேர்களாலும்’ எனப் புரியும் வகையில் அமைப்பதே துல்லியம்.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: எலிசாவைச் சுற்றிலும்
  rationale: סביבות முழுமையாகச் சூழ்ந்திருப்பதை உணர்த்துகிறது; ‘சுற்றிலும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் இறைவரின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் தமிழ் வாசகர்களுக்கு நன்கு அறிமுகமான ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்கி, ‘யாவே’ என்ற மாற்று ஒலிபெயர்ப்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: காட்சியின் இயல்பு
  choice: இறைவனால் காணச்செய்யப்பட்ட குதிரைகளும் நெருப்புத் தேர்களும் என உரை கூறுவதை மட்டும் நிலைநிறுத்துதல்
  alternative: சொற்பொருளில் காணப்பட்ட தேவதூதர் படை; முற்றிலும் குறியீட்டு அகக்காட்சி
  rationale: இளைஞனின் கண்கள் திறக்கப்பட்டு அவன் கண்டான் என்றே எபிரெய உரை கூறுகிறது; அவை பொருள்சார்ந்தவையா, தரிசனமா, தேவதூதர்களா என்பதை விளக்கவில்லை. மொழிபெயர்ப்பு அந்த மெய்யியல் கேள்வியைத் தீர்மானிக்கவில்லை.
- issue: נער என்பவரின் அடையாளம்
  choice: இளைஞன்
  alternative: பணியாளர்; வேலைக்காரன்
  rationale: சூழலில் அவர் எலிசாவின் பணியாளராக இருக்கலாம்; ஆயினும் נער என்ற சொல்லின் வயது சார்ந்த பொருளும் உண்மையானது. முதன்மை உரை ‘இளைஞன்’ என வைத்துக் கொண்டு சூழல்சார் மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. வேண்டுதலின் பணிவு ‘திறந்தருளும்’ என்பதால் வெளிப்படுகிறது. இருப்பினும் நெருப்பு எதைத் தகுதிப்படுத்துகிறது என்பதில் முதன்மை உரை தவறாக அமையாமல் இருக்க வேண்டும்.
