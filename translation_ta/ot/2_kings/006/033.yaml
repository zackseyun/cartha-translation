source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: ta
  text: அவர் இன்னும் அவர்களுடன் பேசிக்கொண்டிருக்கையில், இதோ, அந்தத் தூதுவன் அவரிடம் இறங்கி வந்து, “இதோ, இந்தத் தீங்கு யாவேவிடமிருந்தே வருகிறது. நான் இன்னும் ஏன் யாவேவுக்காகக் காத்திருக்க வேண்டும்?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவிடமிருந்து நான் இன்னும் எதை நம்பிக்கையோடு எதிர்பார்க்க முடியும்?” எபிரெய வினைச்சொல் ‘காத்திரு’ அல்லது ‘நம்பிக்கையோடு எதிர்பார்’ என்ற இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: அவர் இன்னும் அவர்களுடன் பேசிக்கொண்டிருக்கையில்
  rationale: עוֹדֶנּוּ உடன் வரும் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது; தமிழில் ‘பேசிக்கொண்டிருக்கையில்’ அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּלְאָךְ
  choice: அந்தத் தூதுவன்
  rationale: உடனடி கதைச்சூழலில் இது அரசன் அனுப்பிய மனிதத் தூதுவனைக் குறிக்கிறது; விண்ணுலகத் தூதன் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘தூதுவன்’ பொருத்தமானது.
- source_word: יֹרֵד אֵלָיו
  choice: அவரிடம் இறங்கி வந்து
  rationale: ירד கீழ்நோக்கிய நகர்வைக் குறிக்கிறது. ‘இறங்கி வந்து’ என்பதால் மூலத்தின் திசை உணர்வும் இயல்பான தமிழ் நடையும் காக்கப்படுகின்றன.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கதைசொல்லலிலும் மேற்கோள் பேச்சிலும் வரும் கவன ஈர்ப்பு மற்றும் வலியுறுத்தலை ‘இதோ’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: זֹאת הָרָעָה
  choice: இந்தத் தீங்கு
  rationale: רָעָה என்பது தீமை, தீங்கு, பேரிடர் ஆகிய பொருள் வரம்பைக் கொண்டது. இங்கு நிகழும் துயரத்தையும் பேச்சாளரின் குற்றஞ்சாட்டும் தொனியையும் ‘தீங்கு’ காக்கிறது; ‘பேரிடர்’ என்பது சூழலைச் சற்றே அதிகமாக விளக்கிவிடும்.
- source_word: מֵאֵת יְהוָה
  choice: யாவேவிடமிருந்தே
  rationale: தெய்வீகப் பெயர் יְהוָה ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது. வாக்கியத்தின் குற்றஞ்சாட்டும் வலிமையை ‘-இருந்தே’ வெளிப்படுத்துகிறது.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: நான் இன்னும் ஏன் யாவேவுக்காகக் காத்திருக்க வேண்டும்?
  rationale: יחל என்பதற்கு ‘காத்திரு’ மற்றும் ‘நம்பிக்கையோடு எதிர்பார்’ ஆகிய இரு நெருங்கிய பொருள்கள் உள்ளன. முதன்மை உரையில் ‘காத்திருக்க’ என்பது விரக்தியுடன் தொடரும் எதிர்பார்ப்பை இயல்பாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை உடன்படிக்கைப் பெயரையே நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: יחל என்ற வினையின் பொருள் நுணுக்கம்
  choice: யாவேவுக்காகக் காத்திருக்க
  alternative: யாவேவிடம் இன்னும் என்ன நம்பிக்கை வைக்க முடியும்?
  rationale: சூழலில் பேச்சாளர் தெய்வீகத் தலையீட்டுக்காகத் தொடர்ந்து காத்திருப்பதை மறுக்கிறார். எனினும் வினையில் உள்ள ‘நம்பிக்கை கொள்ளுதல்’ என்ற நுணுக்கம் உண்மையான மாற்று வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הָרָעָה என்பதன் இறையியல் தொனி
  choice: இந்தத் தீங்கு
  alternative: இந்தப் பேரிடர் / இந்தத் தீமை
  rationale: பேச்சாளர் நிகழும் துயரத்தை யாவேவிடமிருந்து வந்ததாகக் கூறும் பதற்றத்தை மெலிதாக்காமல், அதேவேளை கடவுளின் ஒழுக்கத் தீமையை நேரடியாக வலியுறுத்தாத சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சற்றே உயர்ந்த கவன ஈர்ப்புச் சொல் மூலத்தின் இருமுறை வலியுறுத்தலைக் காக்கிறது. கதைச்சூழலில் நபரைக் குறிக்கும் சுட்டுப்பெயர் தெளிவின்மை மூலத்திலும் இருப்பதால் பெயர்களைச் சேர்த்து விளக்கவில்லை.
