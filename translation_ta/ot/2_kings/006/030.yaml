  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: ta
  text: அந்தப் பெண்ணின் வார்த்தைகளை அரசன் கேட்டபோது, அவன் மதிலின்மேல் நடந்துகொண்டிருந்தபோது தன் ஆடைகளைக் கிழித்தான். அப்போது மக்கள் பார்த்தார்கள்; இதோ, அவனுடைய ஆடைகளுக்குள், அவன் உடலின்மேல் சாக்குத்துணி இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: கேட்டபோது
  rationale: כ உடன் வரும் வினையெச்ச வடிவம் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘கேட்டபோது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: அந்தப் பெண்ணின் வார்த்தைகளை
  rationale: דָּבָר இங்கு பெண் சொன்னவற்றைக் குறிக்கிறது. ‘வார்த்தைகள்’ என்பது நேரடியான பொருளைக் காக்கிறது; முன்னுள்ள சூழலைச் சுட்ட ‘அந்தப் பெண்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: தன் ஆடைகளைக் கிழித்தான்
  rationale: துக்கம் அல்லது திகைப்பை வெளிப்படுத்தும் செயலைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: அவன் மதிலின்மேல் நடந்துகொண்டிருக்கையிலேயே
  rationale: இந்தச் சூழ்நிலை வாக்கியம் நிகழ்வின் இடத்தையும் தொடர்ந்த இயக்கத்தையும் காட்டுகிறது. ‘மதிலின்மேல்’ நகர மதிலின் மேற்பகுதியைக் குறிக்கிறது; ‘நடந்துகொண்டிருக்கையிலேயே’ ஒரே நேரத்தில் நிகழ்ந்த செயலை வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא הָעָם
  choice: மக்கள் பார்த்தார்கள்
  rationale: רָאָה என்பதன் அடிப்படைப் பொருளான ‘பார்த்தல்/காணுதல்’ காக்கப்பட்டுள்ளது; தொடர்ந்து வரும் ஆச்சரியக் குறிப்பை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீரெனக் கவனத்தை ஈர்த்து ஆச்சரியமான விவரத்தை முன்வைக்கிறது; தமிழில் ‘இதோ’ அந்த உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: הַשַּׂק
  choice: சாக்குத்துணி
  rationale: துக்கத்தின் அடையாளமாக உடலில் அணியப்பட்ட முரட்டுத் துணியைச் சுட்டும் வழக்கமான, புரிந்துகொள்ளக்கூடிய தமிழ்ச் சொல்.
- source_word: עַל־בְּשָׂרוֹ
  choice: அவன் உடலின்மேல்
  rationale: בָּשָׂר என்பதற்கு எழுத்துப்படி ‘சதை’ என்று பொருள் இருந்தாலும், இங்கு வெளி ஆடைகளுக்குக் கீழுள்ள உடலைக் குறிக்கிறது; ‘உடலின்மேல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִבָּיִת
  choice: ஆடைகளுக்கு உள்ளே
  rationale: எழுத்துப்படி ‘உள்ளிருந்து/உள்ளே’ என்று பொருள். அரசன் ஆடைகளைக் கிழித்தபோது சாக்குத்துணி தெரிந்த சூழலில், அது வெளி ஆடைகளுக்குள் அணியப்பட்டிருந்ததை இந்தத் தேர்வு தெளிவுபடுத்துகிறது.
