  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எலிசாவின் வேண்டுதலில் ‘திறந்தருளும்’ என மரியாதை காக்கப்பட்டாலும், கதைநடையில் தேவையற்ற பழந்தமிழ் வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
