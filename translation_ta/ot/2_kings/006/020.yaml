base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: ta
  text: அவர்கள் சமாரியாவுக்குள் வந்தபோது, எலிசா, “யாவே, இவர்களின் கண்களைத் திறந்தருளும்; அவர்கள் பார்க்கட்டும்” என்றான். அப்போது யாவே அவர்களுடைய கண்களைத் திறந்தார்; அவர்கள் பார்த்தார்கள். இதோ, அவர்கள் சமாரியாவின் நடுவில் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: அவர்கள் ... வந்தபோது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரையும் காலப் பொருளையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொல்லுக்குச் சொல் வரும் ‘அது நிகழ்ந்தது’ தமிழில் தேவையற்றது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இடப்பெயரின் வழக்கமான தமிழாக்கம். இச்சூழலில் இது நாட்டுப்பகுதியை அல்ல, நகரத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: கண்களைத் திறந்தருளும்
  rationale: ‘கண்களைத் திற’ என்ற மூல மொழியின் உருவகத்தையும், எலிசாவின் மரியாதையான வேண்டுதலையும் காக்கிறது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: பெயர்ச்சொல் சேர்க்கப்படாத எபிரெயச் சுட்டுப்பெயரை நேரடியாகக் காக்கிறது; இது முந்தைய சூழலில் அராமியப் படைவீரர்களைக் குறிக்கிறது.
- source_word: וְיִרְאוּ
  choice: பார்க்கும்படி
  rationale: கட்டளைக்குப் பின் வரும் வினையின் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּרְאוּ
  choice: அவர்கள் பார்த்தார்கள்
  rationale: ‘உணர்ந்தார்கள்’ என்று விளக்கமாக மாற்றாமல், மூலத்தின் நேரடியான ‘பார்த்தார்கள்’ என்பதைக் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் அடையாளத்தின் வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: சமாரியாவின் நடுவில்
  rationale: அவர்கள் நகருக்குள், அதன் மத்தியில் இருப்பதைத் திடீரெனக் கண்ட காட்சியின் நாடகத் தன்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: கண்கள் திறக்கப்படுதல் என்பதன் பொருள்
  choice: ‘கண்களைத் திற’ என்ற மூல உருவகத்தையே வைத்தல்
  alternative: பார்வையைத் திருப்பிக் கொடு; உணரச் செய்
  rationale: இச்சூழலில் தெய்வீகமாக ஏற்பட்ட பார்வையின்மை அல்லது உணராமை நீங்குவதைக் குறிக்கலாம்; எந்த வகை பார்வை என்பது பற்றிய பதற்றத்தை விளக்கமிட்டு ஒரே பொருளாகச் சுருக்காமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
