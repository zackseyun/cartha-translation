    issue: 'The main text renders אֲדֹנֵיהֶם as singular: ''தங்கள் எஜமானிடம்.'''
    rationale: The Hebrew form is plural. While a contextual singular superior may be proposed, the wording itself does not require that interpretation; the translation should retain the plural rather than resolve it in the main text.
  - severity: low
    issue: Footnote b combines an explanation of 'bread and water' with an unrelated textual/lexical note about 'masters.'
    rationale: The anchor follows 'அப்பமும் தண்ணீரும்,' so it should address that expression only. The plural can be represented directly in the text, eliminating the misplaced additional note.
  - severity: low
    issue: '''கொன்றுபோடாதே'' is somewhat colloquial and intensifies the diction.'
    rationale: In context, killing is clearly in view, but 'கொல்லாதே' is a more idiomatic and suitably dignified modern-standard Tamil rendering.
