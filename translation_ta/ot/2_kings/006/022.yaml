base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: ta
  text: ஆனால் அவர், “அவர்களைக் கொல்லாதே. உன் வாளாலும் உன் வில்லாலும் நீ சிறைபிடித்தவர்களையா கொன்றுபோடுவாய்?[a] அவர்கள் முன் அப்பமும் தண்ணீரும் வை[b]. அவர்கள் உண்டு குடித்துத் தங்கள் எஜமானர்களிடம் செல்லட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயச் சொற்றொடர் சொல்லாற்றல் வினா: “உன் வாளாலும் உன் வில்லாலும் நீ சிறைபிடித்தவர்களைக் கொன்றுபோடுவாயா?” அதாவது, அவர்களைக் கொல்லக் கூடாது என்ற கட்டளையை இது வலியுறுத்துகிறது.'
    reason: alternative_reading
  - marker: b
    text: “அப்பமும் தண்ணீரும்” என்பது அடிப்படை உணவுப் பொருள்களைப் பொதுவாகக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்; எனினும் எபிரெயம் இவ்விரண்டையும் வெளிப்படையாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: கொன்றுபோடாதே / கொன்றுபோடுவாயா
  rationale: נכה என்பது சூழலுக்கேற்ப அடித்தல் அல்லது கொல்லுதல் எனப் பொருள்படும். இங்கு அரசன் கைதிகளைக் கொல்லலாமா என்று கேட்பதால் உயிரைப் பறிக்கும் பொருள் முன்னிலையில் உள்ளது; ‘கொன்றுபோடு’ அதன் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: நீ சிறைபிடித்தவர்கள்
  rationale: שבה என்பது போர் சூழலில் ஒருவரைச் சிறைபிடிப்பதைக் குறிக்கிறது; வெறுமனே பிடித்தல் என்பதைக் காட்டிலும் இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: உன் வாளாலும் உன் வில்லாலும்
  rationale: மன்னன் இவர்களைத் தன் போராற்றலால் பிடிக்கவில்லை என்பதே கேள்வியின் வாதத்திற்கு முக்கியம்; ஆகவே இரண்டு ஆயுதங்களும் வெளிப்படையாகத் தக்கவைக்கப்பட்டன.
- source_word: שִׂים
  choice: வை
  rationale: எபிரெய நேரடிக் கட்டளையின் சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: לֶחֶם וָמַיִם
  choice: அப்பமும் தண்ணீரும்
  rationale: לֶחֶם சில இடங்களில் உணவைப் பொதுவாகக் குறிக்கலாம்; ஆனால் இங்கு அப்பமும் தண்ணீரும் தனித்தனியாகப் பெயரிடப்பட்டுள்ளதால் அவை நேரடியாக மொழிபெயர்க்கப்பட்டன.
- source_word: לִפְנֵיהֶם
  choice: அவர்கள் முன்
  rationale: உணவை ஒருவருக்கு முன்பாக வைப்பதைக் குறிக்கும் மூலமொழி உருவகம் தமிழிலும் தெளிவாக உள்ளது.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: அவர்கள் சாப்பிட்டுக் குடித்துவிட்டு … போகட்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் நோக்கத்தையும் நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: தங்கள் எஜமானிடம்
  rationale: אֲדֹנֵיהֶם வடிவில் இலக்கண ரீதியாகப் பன்மைத் தோற்றம் இருந்தாலும், அரசர் போன்ற ஒரே உயரதிகாரியையும் இவ்வடிவம் குறிக்கலாம். இச்சூழலில் அராமியப் படையினரின் அரசன் அல்லது தலைமை அதிகாரி இயல்பான குறிப்பாக இருப்பதால் ஒருமை முதன்மை உரையில் கொள்ளப்பட்டது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: எலிசாவின் கேள்வியின் சொல்லாற்றல்
  choice: மன்னன் இவர்களைக் கொல்லக் கூடாது என்பதை வலியுறுத்தும் வினாவாக மொழிபெயர்க்கப்பட்டது; குறிப்பாக அவர்கள் அவனுடைய வாள் மற்றும் வில்லால் பிடிக்கப்பட்டவர்கள் அல்லர்.
  alternative: இதை ஒரு தட்டையான கூற்றாகவோ, போரில் ஒருவன் தானே பிடித்த கைதிகளை மட்டும் பற்றிய குறுகிய விதியாகவோ வாசிக்கலாம்.
  rationale: தடைக்குப் பின் வரும் எபிரெய வினா சொல்லாற்றல் வினாவாக இயல்பாகப் புரிகிறது. இது இவ்வசனத்தைக் கடந்து ஒரு பொதுவான போர்ச் சட்டத்தை உருவாக்காமல், கதையின் உடனடி வாதத்தைப் பாதுகாக்கிறது.
- issue: אֲדֹנֵיהֶם என்பதன் எண்ணும் குறிப்பும்
  choice: முதன்மை உரையில் ‘தங்கள் எஜமானிடம்’ என ஒருமையில் தரப்பட்டது.
  alternative: ‘தங்கள் எஜமானர்களிடம்’ அல்லது ‘தங்கள் தலைவர்களிடம்’.
  rationale: மூல வடிவம் பன்மையாகப் புரிந்துகொள்ளப்படலாம்; அதேவேளை மரியாதை/மேன்மைப் பன்மையாக இருந்து அராம் அரசன் என்னும் ஒரே அதிகாரியைக் குறிக்கவும் முடியும். கதையின் சூழல் ஒருமையை ஆதரித்தாலும் உண்மையான மொழியியல் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எலிசா அரசனிடம் நேரடியாகப் பேசும் மூலத்தின் ஒருமை இரண்டாம் நபரை ‘நீ/உன்’ எனத் தக்கவைத்துள்ளோம். ‘அப்பம்’, ‘எஜமான்’ ஆகியவை இச்சூழலில் பரவலாகப் புரியும் செம்மையான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
