base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: ta
  text: அப்போது தேவனுடைய மனிதர் இஸ்ரவேலின் அரசனுக்குச் செய்தி அனுப்பி, “இந்த இடத்தின் வழியாகச் செல்லாதபடி எச்சரிக்கையாக இருங்கள்; ஏனெனில் அராமியர்கள் அங்கே இறங்குகிறார்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே இறங்கி வருகிறார்கள்.”
    reason: נְחִתִּים என்பது ‘இறங்குதல்/கீழ்நோக்கிச் செல்லுதல்’ என்பதைக் குறிக்கிறது. தமிழில் ‘இறங்கி வருகிறார்கள்’ என்று மொழிபெயர்க்கும்போது, சூழலால் ஊகிக்கப்படும் நோக்குத் திசை வெளிப்படுகிறது.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: எபிரெய வினைச்சொல் நேரடியாக ‘அனுப்பினார்’ என்று பொருள்பட்டாலும், சூழலில் அனுப்பப்பட்டது ஒரு செய்தி என்பது மறைமுகமாக உள்ளது; தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: ‘தீர்க்கதரிசி’ என்று விளக்கிப் பெயர்க்காமல், எபிரெய மூலத்திலுள்ள வழக்கமான பட்டப்பெயர் பாதுகாக்கப்பட்டது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: அரசப் பட்டமும் நாட்டின் பெயரும் நேரடியாகவும் இயல்பான தமிழ் உடைமைத் தொடரிலும் தரப்பட்டன.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: இந்த இடத்தின் வழியாகச் செல்லாதபடி கவனமாக இருங்கள்
  rationale: Niphal கட்டளை எச்சரிக்கையைக் குறிக்கிறது; מִן உடன் வரும் infinitive, அந்த இடத்தின் வழியாகச் செல்வதைத் தவிர்க்குமாறு கூறுகிறது. நவீன தமிழில் இயல்பான எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: சுட்டுப்பெயருடன் கூடிய பெயர்ச்சொல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי שָׁם
  choice: ஏனெனில் ... அங்கே
  rationale: כִּי எச்சரிக்கைக்கான காரணத்தையும் שָׁם நிகழ்விடத்தையும் குறிக்கின்றன.
- source_word: אֲרָם
  choice: அராமியர்கள்
  rationale: இராணுவச் சூழலில் ‘அராம்’ என்பது அந்நாட்டு மக்களையோ படையையோ குறிக்கிறது; காலத்திற்குப் பிந்தைய ‘சீரியர்கள்’ என்ற பெயர் தவிர்க்கப்பட்டது.
- source_word: נְחִתִּים
  choice: இறங்கி வருகிறார்கள்
  rationale: இறங்குதல் அல்லது கீழ்நோக்கி வருதல் என்ற participle பொருள், உடனடியாக நடைபெறும் எதிரிப்படை இயக்கமாக இயல்பான தமிழ் நிகழ்காலத் தொடரில் தரப்பட்டது; இயக்கத்தின் பார்வைக்கோண வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
