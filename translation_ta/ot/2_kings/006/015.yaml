  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: ta
  text: தேவனுடைய மனிதரின் பணியாளர் அதிகாலையில் எழுந்து வெளியே சென்றபோது, இதோ, குதிரைகளும் தேர்களும் கொண்ட ஒரு படை நகரத்தைச் சுற்றிக்கொண்டிருந்தது. அப்போது அவருடைய பணியாளன்[a] அவரிடம், “ஐயோ, என் எஜமானே! நாம் என்ன செய்வோம்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய இளைஞன்’ அல்லது ‘அவருடைய இளம் பணியாளன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இளைஞனையோ பணியாளனையோ உதவியாளனையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிப்இல் வடிவம் அதிகாலையிலேயே செயலைத் தொடங்குவதைக் குறிக்கிறது; தொடரும் קום உடன் சேர்த்து இயல்பான தமிழில் ஒரே நிகழ்வாக வழங்கப்பட்டுள்ளது.
- source_word: מְשָׁרֵת
  choice: பணியாளர்
  rationale: தனிப்பட்ட அல்லது அலுவல்சார்ந்த முறையில் சேவை செய்பவரைக் குறிக்கும் சொல்; இச்சூழலில் ‘பணியாளர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: எபிரெய வேதாகமத்தில் தீர்க்கதரிசிக்குப் பயன்படும் நிலையான அடைமொழியின் அமைப்பையும் மரியாதையான தமிழ் நடையையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் பட்ட காட்சியையும் அதனால் உண்டான வியப்பையும் வெளிப்படுத்தும் உரையாடல் சுட்டியைப் பாதுகாக்கிறது.
- source_word: חַיִל סוֹבֵב אֶת־הָעִיר
  choice: ஒரு படை நகரத்தைச் சுற்றியிருந்தது
  rationale: இராணுவச் சூழலில் חַיִל என்பது படையைக் குறிக்கிறது; சுழ்ந்திருக்கும் நிலையைப் பங்கேற்புவினை காட்டுவதால் ‘சுற்றியிருந்தது’ என வழங்கப்பட்டுள்ளது.
- source_word: וְסוּס וָרָכֶב
  choice: குதிரைகளும் தேர்களும்கொண்ட
  rationale: அந்தப் படையின் இராணுவ வளங்களை விளக்கும் இணைப்பாக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: נַעֲרוֹ
  choice: அவருடைய பணியாளன்
  rationale: נַעַר என்பது இளைஞன், பணியாளன், உதவியாளன் ஆகிய பொருள்களை ஏற்கலாம். முன்பே மְשָׁרֵת எனச் சேவைப் பங்கு தெளிவுபடுத்தப்பட்டுள்ளதால் இங்கு ‘பணியாளன்’ பொருத்தமானது; வயது சார்ந்த சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אֲהָהּ
  choice: ஐயோ
  rationale: அச்சமும் துயரமும் கலந்த உடனடி கூக்குரலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமானே
  rationale: இங்கு இது தெய்வீகப் பட்டம் அல்ல; பணியாளர் தன் தலைவரை மரியாதையுடன் அழைப்பதைக் குறிக்கிறது.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: நாம் என்ன செய்வோம்?
  rationale: சொல்லுக்கு சொல் ‘எப்படி செய்வோம்?’ என்ற அமைப்பின் சூழல்சார் பொருளை இயல்பான தமிழ்க் கேள்வியாகத் தருகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற தீர்க்கதரிசிப் பட்டம்
  choice: தேவனுடைய மனிதர்
  alternative: தேவ மனிதர் / தீர்க்கதரிசி
  rationale: மூலத்தின் நிலையான பட்டத்தைப் பாதுகாக்கிறது; ‘தீர்க்கதரிசி’ என விளக்கி மொழிபெயர்த்து மூலத்தில் இல்லாத குறிப்பைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் திடீர் காட்சியுணர்வைத் தக்கவைக்கிறது; ஒரே நபருக்கான மְשָׁרֵת மற்றும் נַעַר என்ற இரு சொற்களின் நுணுக்க வேறுபாடு முதன்மை உரையிலும் அடிக்குறிப்பிலும் பிரதிபலிக்கப்பட்டுள்ளது.
