  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: ta
  text: ஆகவே, அவன் அங்கே குதிரைகளையும் தேர்களையும் மிகப் பெரிய படையையும் அனுப்பினான்.[a] அவர்கள் இரவில் வந்து நகரத்தைச் சுற்றிவளைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகப் பெரிய படை” என்பதற்கு “பெரும் படைப்பிரிவு” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லுக்குச் சொல் “கனமான படை”; இது கணிசமான அல்லது வலிமையான படையணியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: שׁלח என்பதன் தொடர்கதை வடிவம்; சீரியாவின் அரசன் மேற்கொண்ட அடுத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இடத்தைக் குறிக்கும் திசைச் சொல்; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: סוּסִים
  choice: குதிரைகள்
  rationale: மூலச்சொல் நேரடியாகக் ‘குதிரைகள்’ எனப் பொருள்படுகிறது; படைச் சூழலை முன்னிட்டு ‘குதிரைப்படை வீரர்கள்’ என்று விரிவாக்காமல் மூலத்தின் உறுதியான பொருள் காக்கப்படுகிறது.
- source_word: וְרֶכֶב
  choice: தேர்கள்
  rationale: רֶכֶב என்பது தேர் அல்லது தேர்ப்படையைக் குறிக்கலாம்; இங்கு குதிரைகளோடு இணைந்துள்ள தெளிவான படிமத்தை ‘தேர்கள்’ காக்கிறது.
- source_word: וְחַיִל כָּבֵד
  choice: மிகப் பெரிய படை
  rationale: חַיִל படைச் சூழலில் ‘படை/படைப்பிரிவு’ என்றும் כָּבֵד சொல்லடியாக ‘கனமான’ என்றாலும் மரபுத்தொடராகப் பெரும் அல்லது வலிமையான படையணி என்றும் பொருள்படும்.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: அவர்கள் இரவில் வந்து
  rationale: இரவு நேர வருகையை இயல்பான தமிழ் தொடர்கதை நடையில் தெரிவிக்கிறது.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: நகரத்தைச் சுற்றிவளைத்தார்கள்
  rationale: இராணுவச் சூழலில் நகரைச் சூழ்ந்து கொண்ட செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
