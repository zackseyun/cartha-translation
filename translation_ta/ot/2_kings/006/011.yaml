base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: ta
  text: இந்தக் காரியத்தைக் குறித்து அராம் அரசனின் உள்ளம் மிகவும் கலங்கியது. அவன் தன் பணியாளர்களை அழைத்து, “நம்மில் யார் இஸ்ரவேல் அரசனின் பக்கம் இருக்கிறார்[a] என்று நீங்கள் எனக்குச் சொல்லமாட்டீர்களா?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் அரசனுக்குச் சேர்ந்தவர்.” எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது; அது இஸ்ரவேல் அரசனுக்கான சார்பையோ அவருடன் உடந்தையாக இருப்பதையோ உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: மிகவும் கலங்கியது
  rationale: இந்த வினைச்சொல் கடுமையான உள்ளக் கொந்தளிப்பையோ மனக்கலக்கத்தையோ குறிக்கிறது. சூழலில் கோபம் இருக்கக்கூடும் என்றாலும், அதையே மட்டும் பொருளாகக் கட்டுப்படுத்தாமல் அரசனின் தீவிர மனக்குழப்பத்தை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵב
  choice: உள்ளம்
  rationale: எபிரெய மொழியில் இது சிந்தனை, உணர்வு ஆகியவற்றை உள்ளடக்கிய அகமனிதனைக் குறிக்கிறது. தமிழில் ‘உள்ளம்’ அந்தப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தினால்
  rationale: இங்கு דָּבָר என்பது தனிப்பட்ட ஒரு ‘பொருளை’ அல்ல, நடந்துவரும் நிலைமையையோ விவகாரத்தையோ குறிக்கிறது. காரணத் தொடர்பையும் தமிழ் நடைமுறையையும் இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களை
  rationale: அரசவையின் சூழலில் இச்சொல் அரசனுக்குக் கீழ்ப்பட்ட பணியாளர்கள் அல்லது அலுவலர்களைக் குறிக்கலாம். ‘பணியாளர்கள்’ என்பது மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைத்து, வீட்டுப் பணியாளர்கள் என்று மட்டும் குறுக்கிவிடாது.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: நீங்கள் எனக்குச் சொல்லமாட்டீர்களா?
  rationale: எதிர்மறை வடிவிலான இந்த வினா தகவல் கோரும் வலியுறுத்தலையும் அரசனின் அவசரத்தையும் கொண்டுள்ளது. தமிழ் வினாவடிவம் அதன் சொல்லாட்சியையும் தொனியையும் பாதுகாக்கிறது.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: நம்மில் யார்
  rationale: அராமியர் தரப்புக்குள்ளேயே இருக்கும் ஒருவரை அரசன் சந்தேகிப்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசனின் பக்கம் இருக்கிறார்
  rationale: மூலத்தில் இச்சொற்றொடர் மிகவும் சுருக்கமாக, சொற்பொருளில் ‘இஸ்ரவேல் அரசனிடம்/அரசனுக்காக’ என்று உள்ளது. சூழல் குறிப்பிடும் சார்பு அல்லது உடந்தையைத் தமிழில் புரியும்படி இத்தேர்வு காட்டுகிறது; அதேவேளையில் அதன் சுருக்கமான இருமைப்பாட்டை அடிக்குறிப்பு பதிவு செய்கிறது.
