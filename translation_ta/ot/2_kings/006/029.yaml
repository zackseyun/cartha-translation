base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: ta
  text: அவ்வாறே, நாங்கள் என் மகனைக் கொதிக்கவைத்து அவனைச் சாப்பிட்டோம்.[a] மறுநாள் நான் அவளிடம், ‘நாம் அவனைச் சாப்பிடும்படி உன் மகனைக் கொடு[b]’ என்றேன்; ஆனால் அவள் தன் மகனை மறைத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மகனைச் சமைத்து அவனைச் சாப்பிட்டோம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் மகனைக் கொடு; நாம் அவனைச் சாப்பிடுவோம்.’ எபிரெய வடிவத்தை எளிய எதிர்காலமாகவும் எடுத்துக்கொள்ளலாம்; ஆனால் கட்டளைக்குப் பின் வருவதால், சூழலில் நோக்கம் அல்லது விளைவைக் குறிக்கும் வாசிப்பும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: வேகவைத்து
  rationale: בשל என்பது இச்சூழலில் உணவை வேகவைத்தல் அல்லது கொதிக்கவைத்துச் சமைத்தலைக் குறிக்கிறது. தமிழில் ‘வேகவைத்து’ என்பது செயலை இயல்பாகவும் நேரடியாகவும் கூறுகிறது; மேலும் குறிப்பான ‘கொதிக்கவைத்து’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּנִי
  choice: என் மகனை
  rationale: בן என்பது பொதுவான ‘குழந்தை’ அல்ல, குறிப்பாக ‘மகன்’; முதலாம் நபர் உடைமை விகுதியும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.
- source_word: וַנֹּאכְלֵהוּ
  choice: அவனைச் சாப்பிட்டோம்
  rationale: אכל என்பதன் நேரடிப் பொருள் ‘சாப்பிடு.’ எபிரெயச் சொல்லிலுள்ள ஆண்பால் ஒருமை பொருள் விகுதியை ‘அவனை’ என்று வெளிப்படையாகக் காத்துள்ளது.
- source_word: בַּיּוֹם הָאַחֵר
  choice: மறுநாள்
  rationale: இச்சொற்றொடர் அடுத்த நாளைக் குறிக்கிறது; ‘மறுநாள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: תְּנִי אֶת בְּנֵךְ
  choice: உன் மகனைக் கொடு
  rationale: נתן கட்டளை வடிவில் நேரடியாக ‘கொடு’ எனப் பொருள்படும்; בן என்பதன் குறிப்பான ஆண்பால் உறவுமுறை ‘மகன்’ எனக் காக்கப்பட்டுள்ளது.
- source_word: וְנֹאכְלֶנּוּ
  choice: நாம் அவனைச் சாப்பிடும்படி
  rationale: கட்டளையைத் தொடர்ந்து வரும் இணைப்புடன் கூடிய முற்றுப்பெறா வினை இங்கு நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைக் குறிக்கலாம். தமிழில் ‘சாப்பிடும்படி’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; எளிய எதிர்கால வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַתַּחְבִּא אֶת בְּנָהּ
  choice: ஆனால் அவள் தன் மகனை மறைத்துவிட்டாள்
  rationale: இணைப்புச்சொல் சூழலில் எதிர்மறைத் திருப்பத்தைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே பெண்ணின் சொந்த மகன் என்பதால் தமிழின் இயல்புக்கேற்ப ‘தன் மகனை’ பயன்படுத்தப்பட்டுள்ளது.
