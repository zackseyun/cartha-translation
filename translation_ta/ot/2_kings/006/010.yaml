base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: ta
  text: இறைவனுடைய மனிதர் எந்த இடத்தைப் பற்றித் தன்னிடம் சொல்லி எச்சரித்தாரோ, அந்த இடத்துக்கு இஸ்ரவேலின் அரசர் ஆட்களை அனுப்பினார்[a]. அங்கே அவர் எச்சரிக்கையுடன் இருந்தார்[b]. இவ்வாறு ஒருமுறையோ இருமுறையோ மட்டுமல்ல, பலமுறை நடந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அனுப்பினார்’ என்று மட்டுமே உள்ளது; யாரை அல்லது எதை அனுப்பினார் என்பது சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: implicit_object
  - marker: b
    text: அல்லது, ‘அங்கே அவர் தன்னைக் காத்துக்கொண்டார்’ அல்லது ‘அந்த இடத்தில் அவர் முன்னெச்சரிக்கை நடவடிக்கை எடுத்தார்.’
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘ஒருமுறையும் அல்ல, இருமுறையும் அல்ல.’ இது பலமுறை நடந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆட்களை அனுப்பினார்
  rationale: எபிரெய வினைச்சொல் சொற்பட ‘அனுப்பினார்’ என்று மட்டுமே கூறி, அனுப்பப்பட்டவர்களையோ பொருளையோ வெளிப்படையாகக் குறிப்பிடவில்லை. தமிழில் வாக்கியம் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் அமைய ‘ஆட்களை’ என்பது மறைபொருளாகச் சேர்க்கப்பட்டது; இதை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: הַמָּקוֹם
  choice: அந்த இடம்
  rationale: கதையில் முன்பே எச்சரிக்கப்பட்ட குறிப்பிட்ட இடத்தைக் குறிக்கும் definite வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: இது தீர்க்கதரிசியைக் குறிக்கும் எபிரெய பட்டப்பெயர். ‘தீர்க்கதரிசி’ என்று விளக்கிப் பெயர்க்காமல் மூல உருவகத்தையும் பட்டத்தின் தன்மையையும் காக்கிறது.
- source_word: וְהִזְהִירֹה
  choice: எச்சரித்தாரோ
  rationale: Hiphil வடிவத்தின் எச்சரித்தல்/எச்சரிக்கச் செய்தல் என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது; பின்னொட்டு அரசரைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: וְנִשְׁמַר
  choice: எச்சரிக்கையுடன் இருந்தார்
  rationale: Niphal வடிவம் இங்கு தன்னைக் காத்துக்கொள்ளுதல் அல்லது முன்னெச்சரிக்கையுடன் இருத்தல் என்ற பொருளைத் தருகிறது. இயல்பான தமிழுக்காக இவ்வாறு வழங்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: ஒருமுறையோ இருமுறையோ மட்டுமல்ல, பலமுறை
  rationale: சம்பவம் திரும்பத் திரும்ப நடந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கருத்தை நவீன தமிழில் தெளிவாக்குகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
