  register: நவீன நிலையான தமிழில், மரியாதையுடனும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையிலும் வழங்கப்பட்டது. அரசருக்கும் இறைவனுடைய மனிதருக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது. மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆட்களை’ வாசிப்புத் தெளிவுக்காகச் சேர்த்து அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டது.
