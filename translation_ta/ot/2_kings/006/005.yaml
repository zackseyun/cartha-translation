base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: ta
  text: ஒருவன் ஒரு மரத்துண்டை வெட்டிச் சாய்த்துக்கொண்டிருந்தபோது, இரும்பு[a] தண்ணீரில் விழுந்தது. அவன் கூக்குரலிட்டு, “ஐயோ, என் தலைவரே! அது இரவலாகப் பெறப்பட்டது!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இரும்பு.” இங்கு அது கருவியின் இரும்புப் பகுதியை, அதாவது கோடரித் தலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: வெட்டிச் சாய்த்துக்கொண்டிருந்தபோது
  rationale: נפל என்பதன் ஹிப்ஈல் வடிவம் இச்சூழலில் மரத்தை வெட்டி விழச் செய்வதைக் குறிக்கிறது. தொடர்ச்சியான செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַקּוֹרָה
  choice: ஒரு மரத்துண்டை
  rationale: קוֹרָה என்பதற்கு உத்திரம், மரக்கட்டை, மரத்துண்டு ஆகிய பொருள்கள் உண்டு. இங்கு கட்டடத்திற்காக மரம் வெட்டும் சூழலில், ஏற்கெனவே வடிவமைக்கப்பட்ட உத்திரம் என மிகையாகத் தீர்மானிக்காமல் ‘மரத்துண்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: הַבַּרְזֶל
  choice: இரும்புப் பகுதி
  rationale: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘இரும்பு’. சூழலில் அது கருவியின் இரும்புப் பகுதியை, அதாவது கோடரித் தலையைக் குறிக்கும் ஆகுபெயர். மூலத்தின் சுருக்கத்தையும் பொருளையும் காக்க ‘இரும்புப் பகுதி’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּצְעַק
  choice: கதறினான்
  rationale: இழப்பினால் ஏற்பட்ட திடீர் துயரத்தோடும் பதற்றத்தோடும் கூடிய உரத்த அழைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲהָהּ
  choice: ஐயோ
  rationale: துயரம் அல்லது அதிர்ச்சியை வெளிப்படுத்தும் எபிரெய இடைச்சொல்லுக்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: אֲדֹנִי
  choice: என் தலைவரே
  rationale: எலிசாவைத் தமக்கு மேலானவராக மரியாதையுடன் அழைப்பதை வெளிப்படுத்துகிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: שָׁאוּל
  choice: இரவல் வாங்கியது
  rationale: שאל என்பதன் இவ்வடிவம் பொருள் வேறொருவரிடமிருந்து கடனாகப் பெறப்பட்டது என்பதைக் குறிக்கிறது. ‘இரவல் வாங்கியது’ உரிமை அவருடையதல்ல என்ற கவலையைத் தெளிவாகக் காட்டுகிறது.
