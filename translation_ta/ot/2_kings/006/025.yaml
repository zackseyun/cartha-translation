base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: ta
  text: சமாரியாவில் கடும் பஞ்சம் ஏற்பட்டது. இதோ, அவர்கள் அதற்கு முற்றுகையிட்டுக் கொண்டிருந்ததால், ஒரு கழுதையின் தலை எண்பது வெள்ளித் துண்டுகளுக்கும், புறா எச்சத்தின்[a] கால் காப் அளவு ஐந்து வெள்ளித் துண்டுகளுக்கும் விற்கப்படும் நிலை ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புறாக்களின் சாணம்.” சிலர் இச்சொற்றொடர் உண்மையிலேயே புறா எச்சத்தைக் குறிக்கிறது என்று கருதுகிறார்கள்; வேறு சிலர், பஞ்சக்காலத்தில் விற்கப்பட்ட மலிவான உணவுப்பொருள் அல்லது தாவரப் பொருளின் பெயர் இது என்று கருதுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: கடும் பஞ்சம் ஏற்பட்டது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வறிமுகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; גָּדוֹל இங்கு பஞ்சத்தின் கடுமையைக் குறிக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: நகருக்குள் நிலவிய சூழலைக் குறிக்கும் இடப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் அதிர்ச்சியூட்டும் நிலைமையின்மேல் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் அடையாளத்தின் வலிமையைப் பேணுகிறது.
- source_word: צָרִים עָלֶיהָ
  choice: அவர்கள் அதை முற்றுகையிட்டிருந்தார்கள்
  rationale: צור என்பதன் தொடர்ச்சியான முற்றுகைச் செயலை வெளிப்படுத்துகிறது; நகரைக் குறிக்கும் பெண்பால் பதிலிப்பெயர் தமிழில் ‘அதை’ என வருகிறது.
- source_word: עַד הֱיוֹת
  choice: விற்கப்படும் அளவுக்கு அந்த முற்றுகை நீடித்தது
  rationale: முற்றுகை நீடித்து விலைகள் மிக அதிகமான நிலையை எட்டிய விளைவு/எல்லைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֹאשׁ חֲמוֹר
  choice: ஒரு கழுதையின் தலை
  rationale: பஞ்சத்தின் கொடுமையை வெளிப்படுத்தும் அதிர்ச்சிகரமான நேரடிப் படிமத்தை மாற்றாமல் தருகிறது.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: எண்பது வெள்ளித் துண்டுகளுக்கு
  rationale: மூலத்தில் ‘சேக்கல்’ என்ற அலகு வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், வெள்ளி மதிப்பைக் குறிப்பிடுகிறது.
- source_word: רֹבַע הַקַּב
  choice: கால் காப் அளவு
  rationale: רֹבַע என்பதைக் ‘கால்’ என்றும், உறுதியாக நவீன அளவுக்கு மாற்ற முடியாத பண்டைய காப் அலகை ஒலிபெயர்த்தும் வழங்குகிறது.
- source_word: חרי יונים
  choice: புறா எச்சம்
  rationale: சொற்றொடரின் மிக நேரடியான பொருளைப் பிரதான உரையில் தருகிறது; இது உணவுப்பொருள் அல்லது தாவரப்பொருளின் பெயராக இருக்கலாம் என்ற விவாதத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: ஐந்து வெள்ளித் துண்டுகளுக்கு
  rationale: வெள்ளியின் மதிப்பைத் தெளிவாகக் கூறுகிறது; மூலத்தில் குறிப்பிடப்படாத நாணய அலகைச் சேர்ப்பதில்லை.
