  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் மதில்மேல் சென்றுகொண்டிருந்தபோது, ஒரு பெண் அவனை நோக்கி, “என் ஆண்டவராகிய அரசே, எனக்கு உதவுங்கள்[a]!” என்று கூக்குரலிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவராகிய அரசே, என்னைக் காப்பாற்றுங்கள்!” எபிரெயக் கட்டளைச்சொல்லின் நேரடிப் பொருள் “காப்பாற்று”; இங்கு அது உதவிக்கான அவசர வேண்டுகோளாகச் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: நடந்துபோய்க்கொண்டிருந்தபோது
  rationale: וַיְהִי என்பதுடன் வரும் நிகழ்காலப் பெயரெச்சம், கடந்தகாலக் கதையில் தொடர்ந்து நடந்துகொண்டிருந்த செயலைச் சூழலாக அமைக்கிறது. தமிழில் ‘…கொண்டிருந்தபோது’ என்பது அந்தக் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: ஆட்சியாளரை அடையாளப்படுத்தும் எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל הַחֹמָה
  choice: மதில்மேல்
  rationale: עַל என்பதன் நேரடியான ‘மேல்’ என்ற பொருளையும், முற்றுகையிடப்பட்ட நகரத்தின் மதில்மீது அரசன் சென்ற சூழலையும் காக்கிறது; ‘மதில்நெடுக’ என்று கூடுதல் திசைப் பொருளைச் சேர்க்கவில்லை.
- source_word: וְאִשָּׁה
  choice: ஒரு பெண்
  rationale: கதையில் முதன்முறையாக அறிமுகமாகும் குறிப்பிடப்படாத பெண்ணைக் குறிக்கிறது.
- source_word: צָעֲקָה אֵלָיו
  choice: அவனை நோக்கி … கூக்குரலிட்டாள்
  rationale: צעק என்பது துயரத்திலும் அவசரத்திலும் எழுப்பப்படும் உரத்த அழைப்பைக் குறிக்கிறது. ‘கூக்குரலிட்டாள்’ என்பது அதன் ஒலியையும் தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: הוֹשִׁיעָה
  choice: எனக்கு உதவுங்கள்
  rationale: இந்தச் சூழலில் அரசனிடம் உடனடி தலையீட்டைக் கோரும் கட்டளைவடிவ வேண்டுகோள். ‘உதவுங்கள்’ என்பது நவீன தமிழில் இயல்பான விண்ணப்பம்; ‘எனக்கு’ என்பது பேசுபவரை நோக்கிய உதவியைத் தெளிவாக்குகிறது. ‘காப்பாற்றுங்கள்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசே
  rationale: அரசனிடம் பேசும் மரியாதைமிக்க விளிப்பை இயல்பான தமிழ்ச் சொற்றொடரில் காக்கிறது.
