source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הָֽ/אֶחָ֔ד ה֥וֹאֶל נָ֖א וְ/לֵ֣ךְ אֶת עֲבָדֶ֑י/ךָ וַ/יֹּ֖אמֶר אֲנִ֥י אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: ta
  text: அப்போது அவர்களில் ஒருவர், “தயவுசெய்து உமது ஊழியர்களான எங்களோடு செல்ல மனமுள்ளவராயிரும்”[a] என்றார். அதற்கு அவர், “நான் செல்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயவுசெய்து உமது ஊழியர்களான எங்களோடு செல்ல ஒப்புக்கொள்ளும்.”
    reason: הוֹאֶל נָא என்ற சொற்றொடரின் ‘விருப்பமாயிருத்தல்/ஒப்புக்கொள்ளுதல்’ என்ற மாற்று நுணுக்கத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הָאֶחָד
  choice: அவர்களில் ஒருவர்
  rationale: சொல்லுக்கு சொல் ‘அந்த ஒருவர்’ என்றாலும், சூழலில் குழுவைச் சேர்ந்த ஒருவர் எலிசாவிடம் பேசுவதால் ‘அவர்களில் ஒருவர்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הוֹאֶל נָא
  choice: தயவுசெய்து ... இணங்கும்
  rationale: הוֹאֶל என்பது மனமுவந்து ஒப்புதல் அல்லது இணக்கம் தெரிவிக்கும்படி வேண்டுவதையும், נָא மரியாதையான வேண்டுகோளையும் குறிக்கிறது. ‘இணங்கும்’ அந்த விருப்பம்/ஒப்புதல் சார்ந்த நுட்பத்தைப் பேணுகிறது.
- source_word: וְלֵךְ
  choice: வர
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘போ’ என்றாலும், பேசுகிறவர்கள் தங்களுடன் சேர்ந்து செல்லுமாறு எலிசாவை அழைப்பதால் தமிழ் உரையாடலில் ‘எங்களுடன் வர’ என்பது இயல்பான நோக்குநிலை மாற்றமாகும்.
- source_word: אֶת עֲבָדֶיךָ
  choice: உமது பணியாளர்களாகிய எங்களுடன்
  rationale: இங்கு אֶת உடன்செல்லுதலைக் குறிக்கிறது. עֲבָדֶיךָ என்பது மரியாதை மற்றும் தாழ்மையுடன் தங்களையே ‘உமது பணியாளர்கள்’ எனக் குறிப்பிடும் வடிவம்; தமிழில் வேண்டுகோளின் பொருள் தெளிவாக அமைய ‘எங்களுடன்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲנִי אֵלֵךְ
  choice: நான் வருகிறேன்
  rationale: வெளிப்படையான אֲנִי காரணமாக ‘நான்’ பேணப்பட்டுள்ளது. உடனடியான சம்மதத்தைக் குறிக்கும் பதிலில் தமிழ் வழக்கில் ‘நான் வருகிறேன்’ என்பது இயல்பானது; எபிரெயத்தில் உள்ள ‘செல்வேன்’ என்ற அடிப்படைப் பொருளையும் சூழலுக்கு ஏற்றவாறு வழங்குகிறது.
