revisions:
- from: அப்போது அவர்களில் ஒருவர், “தயவுசெய்து உமது பணியாளர்களாகிய எங்களுடன் வர இணங்கும்”[a] என்றார். அதற்கு அவர், “நான் வருகிறேன்” என்றார்.
  to: அப்போது அவர்களில் ஒருவர், “தயவுசெய்து உமது ஊழியர்களான எங்களோடு செல்ல மனமுள்ளவராயிரும்”[a] என்றார். அதற்கு அவர், “நான் செல்கிறேன்” என்றார்.
  rationale: Revision improves lexical alignment with הלך by using ‘செல்ல/செல்கிறேன்,’ smooths the self-designation while retaining ‘your servants,’ and keeps the polite volitional force of הוֹאֶל נָא. The footnote remains anchored at the request expression and supplies a legitimate lexical alternative.
