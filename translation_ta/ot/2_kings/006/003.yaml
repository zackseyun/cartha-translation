translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க வேதாகம நடையைப் பேணும் வகையில் ‘உமது’, ‘இணங்கும்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உரையாடல் இயல்பாக இருக்க ‘போ’ என்பதற்கு சூழல்சார் ‘வர’ தேர்ந்தெடுக்கப்பட்டது; அடியார்/அடிமை என்ற சமூகப் பொருளைத் தேவையின்றி இறுக்காமல் עבד என்பதற்கு ‘பணியாளர்’ பயன்படுத்தப்பட்டது.
