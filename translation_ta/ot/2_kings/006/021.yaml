base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் அவர்களைக் கண்டபோது எலிசாவிடம், “நான் அவர்களை அடித்துக் கொல்லட்டுமா? அடித்துக் கொல்லட்டுமா[a], என் தந்தையே[b]?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் வினைச்சொல் வலியுறுத்தலுக்காகத் திரும்பக் கூறப்பட்டுள்ளது. இதை “நான் அவர்களைத் தாக்கட்டுமா? தாக்கட்டுமா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் தந்தையே” என்பது எலிசாவை நோக்கிய மரியாதையான அழைப்பு; அவர் அரசனின் உயிரியல் தந்தை என்பதைக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: וַיֹּאמֶר என்பது பொதுவாக ‘சொன்னான்’ என்றாலும், தொடரும் வினா நேரடி உரையாக இருப்பதால் நவீன தமிழில் ‘என்று கேட்டான்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது; வாவ் தொடரின் கதைநகர்வு சொல் வரிசையால் வெளிப்படுகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பைத் துல்லியமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: אֶל אֱלִישָׁע
  choice: எலிசாவிடம்
  rationale: אֶל இங்கு பேச்சு நோக்கிச் செல்லும் நபரைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘தீர்க்கதரிசி’ என்ற பட்டம் சேர்க்கப்படவில்லை.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: அவர்களைக் கண்டதும்
  rationale: כְּ + infinitive construct காலத் தொடர்பைக் குறிக்கிறது. சூழலில் பார்த்தவன் இஸ்ரவேலின் அரசன்; ‘கண்டதும்’ நிகழ்வுகளின் உடனடியான தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַאַכֶּה אַכֶּה
  choice: நான் இவர்களை வெட்டிக் கொல்லட்டுமா? வெட்டிக் கொல்லட்டுமா?
  rationale: infinitive absolute உடன் வரும் வினைச்சொல் கேள்விக்கு வலியுறுத்தலை அளிக்கிறது. தமிழில் கேள்வியைத் திரும்பச் சொல்வது அந்த தீவிரத்தையும் அவசரத்தையும் காக்கிறது. இராணுவச் சூழலில் נכה இங்கு உயிரைக் கொல்லும் தாக்குதலைக் குறிப்பதால் ‘வெட்டிக் கொல்ல’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָבִי
  choice: என் தந்தையே
  rationale: சொல்லின் நேர்ப்பொருளான உறவுமுறை மொழியைப் பாதுகாக்கிறது; விளிவேற்றுமை மரியாதையுடனான நேரடி அழைப்பை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: எலிசாவை நோக்கிய மரியாதை அழைப்பு
  choice: אָבִי என்பதை ‘என் தந்தையே’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘என் தலைவரே’ அல்லது ‘ஐயா’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: இது உயிரியல் தந்தையைக் குறிக்காமல் தீர்க்கதரிசிக்குக் காட்டும் மரியாதையைக் குறிக்கலாம்; எனினும் மூலத்தின் குடும்ப உறவுச் சொல்லை மாற்றாமல் வைத்திருப்பது அதன் உறவியல் மற்றும் அதிகாரத் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான உரைநடை. ‘அரசன்’, ‘எலிசாவிடம்’, ‘என் தந்தையே’ ஆகியவை வேதாகமச் சூழலின் உயர்ந்த தொனியைப் பேணுகின்றன; தேவையற்ற பட்டங்களோ சமயப் பிரிவு சார்ந்த விளக்கங்களோ சேர்க்கப்படவில்லை.
