source:
  edition: WLC
  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: ta
  text: அவர்கள் அவருக்கு எதிராக இறங்கி வந்தபோது, எலிசா யாவேயிடம் வேண்டிக்கொண்டு, “தயவுசெய்து இந்த மக்களைப் பார்வைக் குழப்பத்தால்[a] தாக்கும்” என்றார். யாவே எலிசாவின் வார்த்தையின்படியே அவர்களைப் பார்வைக் குழப்பத்தால் தாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குருட்டுத்தன்மை.” எபிரேயச் சொல், சரியாகப் பார்க்கவோ உணரவோ முடியாதபடி உண்டாக்கப்படும் பார்வைக் குறைபாட்டையும் குறிக்கலாம்; அது முழுமையான அல்லது நிரந்தரமான குருட்டுத்தன்மை என்று அவசியமில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: அவர்கள் அவருக்கு எதிராக இறங்கி வந்தபோது
  rationale: ירד என்பது ‘இறங்கி வருதல்’; பகைமை நிறைந்த சூழலில் אֶל என்பது எலிசாவை நோக்கிய படை நகர்வைக் குறிக்கிறது. ‘எதிராக’ அந்தச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: எலிசா யாவேவை நோக்கி மன்றாடி
  rationale: התפלל என்பது இறைவனை நோக்கி வேண்டுதல்/மன்றாடுதல். வேண்டுகோளின் தீவிரத்தையும் இயல்பான தமிழ் நடையையும் ‘மன்றாடி’ தருகிறது; יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַךְ נָא
  choice: தயவுசெய்து ... தாக்கும்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘தாக்கு’; נָא வேண்டுகோளின் பணிவைச் சுட்டுகிறது. இறைவனை நோக்கிய மரியாதைமிக்க ஒருமை ஏவலில் ‘தாக்கும்’ இயல்பாக உள்ளது.
- source_word: הַגּוֹי הַזֶּה
  choice: இந்த மக்களை
  rationale: גוי என்பது ‘தேசம்’ அல்லது ‘மக்கள்’. இங்கு முழுத் தேசத்தை அல்ல, அராமியப் படைக்குழுவைக் கூட்டாகக் குறிப்பதால் ‘இந்த மக்கள்’ சூழலுக்கு ஏற்றது.
- source_word: בַּסַּנְוֵרִים
  choice: கண்மயக்கத்தால்
  rationale: סַנְוֵרִים என்பது தெய்வீகமாக உண்டாக்கப்படும் பார்வைக் கோளாறு அல்லது சரியாக உணர முடியாத கண்மயக்கத்தைக் குறிக்கலாம். பின்னர் அவர்கள் வழிநடத்தப்படுவதால், முழுமையான நிரந்தரக் குருட்டுத்தன்மையைவிட ‘கண்மயக்கம்’ சூழலை நன்கு காக்கிறது.
- source_word: וַיַּכֵּם
  choice: அவர் அவர்களை ... தாக்கினார்
  rationale: சூழலின்படி எழுவாய் யாவே. தமிழில் குழப்பம் தவிர்க்க வெளிப்படையான ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: எலிசாவின் வார்த்தையின்படியே
  rationale: דבר இங்கு எலிசாவின் வேண்டுகோளாகிய ‘வார்த்தை/உரை’ என்பதைக் குறிக்கிறது. ‘-படியே’ வேண்டுகோளுக்கும் இறைச்செயலுக்கும் உள்ள நேரடி ஒத்திசைவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைத் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: סַנְוֵרִים என்பதன் இயல்பு
  choice: கண்மயக்கம்
  alternative: குருட்டுத்தன்மை
  rationale: இச்சொல் முழுமையான அல்லது நிரந்தரமான பார்வையிழப்பை மட்டுமே கட்டாயப்படுத்தாது; சரியாகப் பார்க்கவோ உணரவோ முடியாத தெய்வீகப் பார்வைக் குழப்பத்தையும் குறிக்கலாம். அடுத்தடுத்த நிகழ்வுகளோடு ‘கண்மயக்கம்’ நன்றாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘அவருக்கு எதிராக’ என்பது பகைமைச் சூழலை வெளிப்படுத்துகிறது; ‘கண்மயக்கம்’ மூலச்சொல்லின் அர்த்தவிரிவை மிகையாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
