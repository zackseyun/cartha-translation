base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: ta
  text: அப்போது தேவனுடைய மனிதர், “அது எங்கே விழுந்தது?” என்று கேட்டார். அவன் அந்த இடத்தை அவருக்குக் காட்டினான். அப்போது அவர் ஒரு மரத்துண்டை வெட்டி அங்கே எறிந்தார்; இரும்பு மிதந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இரும்பு.” சூழலில் இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரும்புக் கோடரித் தலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: எபிரேயப் பட்டப்பெயரை விளக்கமாக ‘தீர்க்கதரிசி’ என்று மாற்றாமல் நேரடியாகவும் மரியாதையுடனும் பாதுகாக்கிறது.
- source_word: אָנָה נָפָל
  choice: அது எங்கே விழுந்தது?
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரும்புப் பகுதியைச் சுட்டும் இயல்பான தமிழ் வினா; நிறைவுற்ற நிகழ்வைக் காட்டுகிறது.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: அவன் அந்த இடத்தை அவருக்குக் காட்டினான்
  rationale: ראה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘காட்டுதல்’ என்ற காரணவினைப் பொருளையும், எபிரேயக் கதைத் தொடரின் தனித்த செயற்பாட்டையும் பாதுகாக்கிறது.
- source_word: וַיִּקְצָב עֵץ
  choice: ஒரு மரக்கொம்பை வெட்டி
  rationale: עֵץ என்பதன் மரம்/மரத்துண்டு என்ற பொருள் வரம்பில், நீரில் எறியப்பட்ட ஒரு தனிப் பொருளை இயல்பான தமிழில் குறிக்கிறது; அதன் துல்லியமான வடிவம் அல்லது அளவை மிகைப்படுத்தவில்லை.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: அங்கே எறிந்தார்
  rationale: வினையின் ‘எறிதல்’ பொருளையும் திசைச்சொல்லான ‘அங்கே’ என்பதையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיָּצֶף
  choice: மிதந்தது
  rationale: இரும்பே இலக்கண எழுவாய் என்பதால் செயப்படுபொருள் அல்லது காரணவினைப் பொருளைச் சேர்க்காமல் வினையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: הַבַּרְזֶל
  choice: இரும்பு
  rationale: மூலத்தின் சொற்பொருளை அப்படியே பாதுகாக்கிறது; சூழலில் இது முந்தைய வசனத்தின் இரும்புக் கோடரித் தலையைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: கதையில் நிகழும் அற்புதச் செயல்
  choice: “இரும்பு மிதந்தது” என்று நிகழ்வை நேரடியாகக் கூறுதல்
  alternative: “இரும்பு நீர்மேல் எழுந்தது” அல்லது இயற்கையான மீட்பு முறையைக் குறிக்கும் விளக்க மொழிபெயர்ப்பு
  rationale: எபிரேய உரை நிகழ்வை விளக்கமோ இயற்கைமயமாக்கலோ இன்றி கூறுகிறது. மொழிபெயர்ப்பும் அற்புதத்தைத் தணிக்காமலும் கூடுதல் செயல்முறையைச் சேர்க்காமலும் அதையே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் எபிரேய வினைகள் தனித்த செயல்களாகக் காட்டப்பட்டுள்ளன. ‘இறைவனின் மனிதர்’ மூலமொழிப் பட்டப்பெயரைப் பாதுகாக்கிறது; ‘அவர்/அவன்’ வேறுபாடு கதாபாத்திரங்களைத் தெளிவுபடுத்துகிறது.
