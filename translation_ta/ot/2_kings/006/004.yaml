  source_fidelity: 'எபிரெய மூலத்தின் தொடர்ச்சியான கதைநடை துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: அவர் அவர்களுடன் சென்றார்; அவர்கள் யோர்தானுக்கு வந்தார்கள்; பின்னர் மரங்களை வெட்டினார்கள். הַיַּרְדֵּנָה-வின் திசைப் பொருள் ‘யோர்தானுக்கு’ என்பதில் இயல்பாக உள்ளது; הָעֵצִים-இன் சூழலுக்கேற்ற ‘மரங்கள்’ என்பதும் சரியானது.'
