lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  choice: அவர் அவர்களுடன் சென்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; אִתָּם என்பதன் உடன்செல்லும் பொருளும் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּבֹאוּ הַיַּרְדֵּנָה
  choice: அவர்கள் யோர்தானுக்கு வந்து
  rationale: בוא என்பதன் வருதல்/அடைதல் பொருளையும், திசையைக் குறிக்கும் ־ָה பின்னொட்டையும் ‘யோர்தானுக்கு’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּגְזְרוּ
  choice: வெட்டினார்கள்
  rationale: கட்டுமானத்திற்காக மரப்பொருள் எடுக்கப்படும் சூழலில் גזר என்பது மரங்களை வெட்டும் செயலைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הָעֵצִים
  choice: மரங்களை
  rationale: עֵץ என்பது ‘மரம்’ அல்லது ‘மரப்பொருள்’ என வரலாம்; இச்சூழலில் வெட்டப்படும் நிற்கும் மரங்களைக் குறிப்பதால் ‘மரங்களை’ என்பது துல்லியமானது.
