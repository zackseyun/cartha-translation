  text: அவர் அவர்களுடன் சென்றார்; அவர்கள் யோர்தானுக்கு வந்து மரங்களை வெட்டினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரப்பொருளை வெட்டினார்கள்.” எபிரெயச் சொல் மரங்களையோ மரப்பொருளையோ குறிக்கலாம்; இங்கு மரங்களை வெட்டும் சூழல் இருப்பதால் “மரங்களை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
