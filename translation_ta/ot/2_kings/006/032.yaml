base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: ta
  text: எலிசா தம் வீட்டில் அமர்ந்திருந்தார்; மூப்பர்களும் அவருடன் அமர்ந்திருந்தார்கள். அரசன் தனக்கு முன்னதாக ஒரு மனிதனை அனுப்பியிருந்தான். ஆனால் அந்தத் தூதுவன்[b] எலிசாவிடம் வருவதற்கு முன்பே, எலிசா மூப்பர்களை நோக்கி, “இந்தக் கொலைகாரனின் மகன் என் தலையை எடுத்துப்போடுவதற்கு ஆளை அனுப்பியிருப்பதைப் பார்க்கிறீர்களா?[a] கவனியுங்கள், அந்தத் தூதுவன் வரும்போது கதவை மூடி, அவனைக் கதவிலேயே தடுத்து நிறுத்துங்கள். அவனுக்குப் பின்னால் அவனுடைய எஜமானின் காலடிச் சத்தம் கேட்கிறதல்லவா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் தலையை வெட்டிப்போட” என்றும் மொழிபெயர்க்கலாம். “என் தலையை எடுத்துப்போட” என்பது தலை வெட்டிக் கொல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “தூதுவன்” என்பது அரசனால் அனுப்பப்பட்ட மனிதனைக் குறிக்கிறது; தேவதூதனை அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: அமர்ந்திருந்தார் / அமர்ந்திருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினைகள் நடந்துகொண்டிருந்த காட்சியை அமைப்பதால், தமிழில் தொடர்நிலை இறந்தகாலம் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: அரசன் தனக்கு முன்னால் ஒரு மனிதனை அனுப்பியிருந்தான்
  rationale: முந்தைய சூழல் மறைமுக எழுவாயை அரசன் என அடையாளப்படுத்துகிறது; מִלְּפָנָיו என்பது அவன் வருவதற்கு முன்னதாக ஒருவனை அனுப்பிய பொருளைக் கொண்டுள்ளது. தமிழில் நிகழ்வுகளின் வரிசையைத் தெளிவாக்க முற்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַמַּלְאָךְ
  choice: தூதுவன்
  rationale: இச்சூழலில் இது தேவதூதனை அல்ல, அரசனால் அனுப்பப்பட்ட மனிதத் தூதரைச் சுட்டுகிறது.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: இந்தக் கொலைகாரனின் மகன்
  rationale: அரசனைப் பற்றிய இகழ்ச்சியும் அவன் தந்தையின் இரத்தப்பழியைக் குறிக்கும் சாத்தியமான குறிப்பும் பாதுகாக்கப்படுகின்றன.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: என் தலையை எடுத்துப்போட
  rationale: சொல்லாட்சிக்கு நெருக்கமாக இருந்து, தலை வெட்டிக் கொல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் தாக்கத்தையும் காக்கிறது.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: அவனைக் கதவருகே தடுத்து நிறுத்துங்கள்
  rationale: கதவின் அருகில் அழுத்தித் தடுத்து உள்ளே வரவிடாத செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: அவனுக்குப் பின்னால் அவனுடைய எஜமானின் காலடிச் சத்தம் கேட்கிறது அல்லவா?
  rationale: அனுப்பிய அரசனே தூதுவனைத் தொடர்ந்து வருகிறான் என்ற உடனடி உணர்வையும் மூலத்தின் வினாவடிவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: וַיִּשְׁלַח என்பதன் மறைமுக எழுவாய்
  choice: அரசன்
  alternative: அவன்
  rationale: முந்தைய வசனச் சூழல் இஸ்ரவேலின் அரசனையே எழுவாயாகக் காட்டுகிறது; தமிழில் வெளிப்படையாகச் சொல்வது குழப்பத்தைத் தவிர்க்கிறது.
- issue: הַמַּלְאָךְ என்பவரின் இயல்பு
  choice: மனித அரசத் தூதுவன்
  alternative: தேவதூதன்
  rationale: அரசனால் மரணதண்டனையை நிறைவேற்ற அனுப்பப்பட்ட மனிதனே கதைச்சூழலுக்கு பொருந்துகிறான்; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. எலிசாவுக்கு மரியாதைப் பன்மையும் அரசனின் எதிர்மறைச் செயலை விவரிக்க ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள அவசரம், இகழ்ச்சி, வன்முறைச் சுட்டு ஆகியவை மென்மையாக்கப்படவில்லை.
