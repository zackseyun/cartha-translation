base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: ta
  text: எலிசா அவர்களிடம், “இது அந்த வழியல்ல; இது அந்த நகரமுமல்ல. என் பின்னால் வாருங்கள்[a]; நீங்கள் தேடுகிற அந்த மனிதனிடம் நான் உங்களை அழைத்துச் செல்வேன்” என்றார். பின்னர் அவர் அவர்களைச் சமாரியாவுக்கு அழைத்துச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எனக்குப் பின்னால் செல்லுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: அந்த வழி
  rationale: דֶּרֶךְ என்பது வழி, சாலை, பாதை ஆகிய பொருள்களைக் கொண்டது. இச்சூழலில் முன்பே மனதில் உள்ள குறிப்பிட்ட வழியைக் குறிக்கும் எபிரேய சுட்டுத்தன்மையை ‘அந்த வழி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעִיר
  choice: அந்த நகரம்
  rationale: עִיר என்பதன் வழக்கமான பொருள் ‘நகரம்’. ‘அந்த’ என்பது தேடிச் செல்லப்பட்ட குறிப்பிட்ட நகரத்தைச் சுட்டிக்காட்டி, முந்தைய கூறுடன் இணையான அமைப்பைக் காக்கிறது.
- source_word: לְכוּ אַחֲרַי
  choice: என் பின்னால் வாருங்கள்
  rationale: சொல்லுக்குச் சொல் ‘எனக்குப் பின்னால் செல்லுங்கள்’ என்றாலும், ஒருவரைப் பின்தொடர அழைக்கும் இயல்பான நவீனத் தமிழாக ‘என் பின்னால் வாருங்கள்’ அமைகிறது; இயக்கமும் கட்டளைத் தன்மையும் காக்கப்படுகின்றன.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: நான் உங்களை அழைத்துச் செல்கிறேன்
  rationale: הלך என்பதன் Hiphil வடிவம் ஒருவரைச் செல்லச் செய்தல் அல்லது வழிநடத்திச் செல்லுதல் எனப் பொருள்படும். தமிழில் இச்சூழலுக்கு ‘அழைத்துச் செல்கிறேன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: אִישׁ இங்கு ஆண்பால் ஒருமையில் ‘மனிதன்’ என்று பொருள்படுகிறது. எலிசா தம்மையே மறைமுகமாகக் குறிப்பிடுவதால், அந்தக் கதைநயத்தை மாற்றாமல் காக்கிறது.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: நீங்கள் தேடுகிற
  rationale: בקשׁ என்பது ‘தேடு’ என்று பொருள்படும். நடைபெற்று வரும் தேடலை நவீனத் தமிழில் ‘நீங்கள் தேடுகிற’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: அவர் அவர்களை அழைத்துச் சென்றார்
  rationale: முந்தைய அதே வினைச்சொல்லின் காரணவினைப் பொருளைத் தொடர்ந்து ‘அழைத்துச் சென்றார்’ என்று மொழிபெயர்ப்பது சொற்பொருள் தொடர்ச்சியையும் நிகழ்வின் இயக்கத்தையும் காக்கிறது.
- source_word: שֹׁמְרוֹנָה
  choice: சமாரியாவுக்கு
  rationale: இறுதியில் உள்ள திசைவேற்றுமை -ה சமாரியாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘சமாரியாவுக்கு’ அதனை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அராமியர்களிடம் எலிசா கூறிய வார்த்தைகளின் ஏமாற்றுத் தன்மை
  choice: ‘இது அந்த வழி அல்ல; இது அந்த நகரமும் அல்ல’ என்று உரையை நேரடியாக வழங்குதல்
  alternative: அது ஓரளவு உண்மை அல்லது திட்டமிட்ட ஏமாற்று என்று விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்
  rationale: எபிரேய உரை எலிசாவின் வார்த்தைகளை எந்த நெறியியல் விளக்கமும் இன்றி வழங்குகிறது. அவற்றின் உண்மைத் தன்மை அல்லது நெறியியல் மதிப்பீட்டை மொழிபெயர்ப்பு தீர்மானிக்காமல், கதையின் இறையியல் பதற்றத்தை அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய இணை அமைப்பும் எலிசாவின் மறைமுகக் குறிப்பால் உருவாகும் கதைநயமும் பாதுகாக்கப்பட்டுள்ளன.
