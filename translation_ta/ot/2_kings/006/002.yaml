  text: נֵֽלְכָה נָּ֣א עַד הַ/יַּרְדֵּ֗ן וְ/נִקְחָ֤ה מִ/שָּׁם֙ אִ֚ישׁ קוֹרָ֣ה אֶחָ֔ת וְ/נַעֲשֶׂה לָּ֥/נוּ שָׁ֛ם מָק֖וֹם לָ/שֶׁ֣בֶת שָׁ֑ם וַ/יֹּ֖אמֶר לֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: ta
  text: “தயவுசெய்து, எங்களை யோர்தானுக்குப் போக அனுமதியுங்கள். அங்கிருந்து ஒவ்வொருவரும் ஒரு உத்திரத்தை எடுத்துக்கொண்டு, நாங்கள் தங்குவதற்கு அங்கே ஓர் இடத்தை அமைத்துக்கொள்வோம்” என்றார்கள். அதற்கு அவர், “போங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: தயவுசெய்து நாங்கள் ... போக அனுமதியுங்கள்
  rationale: முதல் நபர் பன்மை விருப்பவினையும் נָא தரும் பணிவான வேண்டுகோளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד הַיַּרְדֵּן
  choice: யோர்தானுக்குப்
  rationale: பயணச் சூழலில் עַד என்பது ‘வரை/இடத்திற்கு’ எனப் பொருள்படும்; யோர்தான் இங்கு ஆற்றைக் குறிப்பது சூழலால் தெளிவாகிறது.
- source_word: אִישׁ קוֹרָה אֶחָת
  choice: ஆளுக்கு ஒரு கட்டுமான மரம்
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவரும்’ என்பதைக் குறிக்கிறது. קוֹרָה கட்டிடப் பயன்பாட்டுக்கான மரம் அல்லது உத்திரத்தைக் குறிக்கிறது; ‘கட்டுமான மரம்’ பொதுவாசகருக்குத் தெளிவாகவும் தேவையற்ற வகைத் துல்லியமின்றியும் உள்ளது.
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: அங்கே ஓர் இடத்தை அமைத்துக்கொள்வோம்
  rationale: עשה என்பதன் பொதுவான ‘செய்/அமை’ பொருளையும் לָנוּ என்பதன் தங்களுக்கான பயனையும் இயல்பாகத் தருகிறது.
- source_word: לָשֶׁבֶת שָׁם
  choice: நாங்கள் தங்குவதற்காக
  rationale: ישב இச்சூழலில் உட்கார்வதை அல்ல, ஓரிடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது; ‘தங்குவதற்கு’ என்பது கட்டாயமாக நிரந்தரக் குடியேற்றம் என மிகைப்படுத்தாமல் பொருளைத் தருகிறது.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: அதற்கு அவர், “போங்கள்” என்றார்
  rationale: அனுமதி வழங்கும் சுருக்கமான பதிலின் நேரடித்தன்மையைப் பாதுகாக்கிறது.
