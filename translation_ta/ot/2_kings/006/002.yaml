translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் பேணப்பட்டுள்ளன. எபிரெய உரையில் பேசியவர்கள் பன்மையாக இருப்பதால் தமிழில் இயல்பாக ‘என்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது; எலிசாவின் குறுகிய அனுமதி ‘போங்கள்’ என அப்படியே வைக்கப்பட்டுள்ளது.
