base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: ta
  text: ஆனால் அவனுடைய பணியாளர்களில் ஒருவன், “இல்லை, அரசராகிய என் ஆண்டவரே. மாறாக, இஸ்ரவேலில் இருக்கும் இறைவாக்கினரான எலிசா, நீங்கள் உங்கள் படுக்கையறையில் பேசும் வார்த்தைகளை இஸ்ரவேலின் அரசருக்குத் தெரிவிக்கிறார்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא ... כִּי
  choice: “அப்படியல்ல ... எலிசாதான்”
  rationale: மறுப்பைத் தொடர்ந்து உண்மையான விளக்கத்தை வலியுறுத்தும் எபிரெய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்களில் ஒருவன்
  rationale: அரசனுக்குச் சேவை செய்பவரைக் குறிக்கும் עֶבֶד என்பதற்கு இச்சூழலில் இயல்பான, மரியாதையான சொல்.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: அரசராகிய என் ஆண்டவரே
  rationale: அரசனை நேரடியாக அழைக்கும் மரியாதைமிக்க எபிரெயச் சொல்லமைப்பின் இரு கூறுகளையும் காக்கிறது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: தெய்வீக செய்தியை அறிவிப்பவர் என்ற נָבִיא சொல்லின் பணியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: יַגִּיד
  choice: தெரிவிக்கிறார்
  rationale: தகவலை அறிவித்தல் அல்லது சொல்லுதல் என்ற பொருளை இச்சூழலுக்கு இயல்பாக வழங்குகிறது.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: உங்கள் படுக்கையறையில்
  rationale: ‘உங்கள் படுக்கையின் அறையில்’ என்ற மூல மொழி வடிவத்தின் இயல்பான தமிழாக்கம்.
