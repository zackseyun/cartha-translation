translation_notes:
  register: நவீன நிலையான தமிழில் dignified நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘கூட’ என்பது அரசனின் மிகத் தனிப்பட்ட இடத்தில் பேசப்பட்ட வார்த்தைகளும் தெரிவிக்கப்படுகின்றன என்ற மூலவாக்கியத்தின் வியப்பூட்டும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; புதிய தகவலைச் சேர்ப்பதில்லை.
