base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: ta
  text: இதற்குப் பின்பு, ஆராமின் அரசனான பென்-அதாத் தன் படை முழுவதையும்[a] திரட்டிக்கொண்டு, சமாரியாவுக்கு எதிராகப் படையெடுத்துச் சென்று அதை முற்றுகையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் படைப்பிரிவுகள் அனைத்தையும்”; எபிரெயத்தில், “தன் முகாம் முழுவதையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பின்பு
  rationale: எபிரெயக் கதைத் தொடரின் அடுத்த நிகழ்வை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது; ‘நடந்தது’ என்பதைத் தனியே சேர்க்காமல் தொடர்ச்சியைக் காக்கிறது.
- source_word: וַיִּקְבֹּץ
  choice: திரட்டிக்கொண்டு
  rationale: ‘ஒன்றுகூட்டுதல், திரட்டுதல்’ என்ற நேரடிப் பொருளையும், அதைத் தொடர்ந்து அவன் படையெடுத்துச் சென்ற செயலோடு உள்ள தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ אֲרָם
  choice: ஆராமின் அரசன்
  rationale: மூலத்திலுள்ள ஆராம் என்ற நிலப்பெயரைப் பேணுகிறது; பிற்கால ‘சிரியா’ என்ற பெயரை மூலத்தில் இறக்குமதி செய்யவில்லை.
- source_word: כָּל מַחֲנֵהוּ
  choice: தன் படை முழுவதையும்
  rationale: מַחֲנֶה என்பதற்கு ‘முகாம்’ அல்லது ‘படை’ என்ற பொருள் இருக்கலாம்; இங்கு போர் சூழலில் ‘படை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיַּעַל
  choice: படையெடுத்துச் சென்று
  rationale: நகரத்தை நோக்கிய இராணுவ நகர்வை இயல்பான தமிழில் காட்டுகிறது. ‘மேலே சென்றான்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் தெளிவில்லாமல் இருக்கும்.
- source_word: וַיָּצַר עַל
  choice: அதை முற்றுகையிட்டான்
  rationale: ஒரு நகருக்கு எதிராக முற்றுகை அமைத்தல் என்ற வினையின் சூழல்சார் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகம இடப்பெயர் வடிவம்.
