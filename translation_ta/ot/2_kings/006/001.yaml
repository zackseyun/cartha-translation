  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: ta
  text: தீர்க்கதரிசிகளின் சீடர்கள்[a] எலிசாவிடம், “தயவுசெய்து பாருங்கள், உமது முன்னிலையில் நாங்கள் தங்கியிருக்கும் இடம் எங்களுக்குக் குறுகலாக இருக்கிறது” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “தீர்க்கதரிசிகளின் மகன்கள்.” இது தீர்க்கதரிசிகளின் ஒரு குழுவையோ அவர்களிடம் பயின்ற சீடர்களையோ குறிக்கும் எபிரெய மொழிமரபாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் சீடர்கள்
  rationale: எபிரெய மொழிமரபான ‘தீர்க்கதரிசிகளின் மகன்கள்’ என்பது இங்கு தீர்க்கதரிசனப் பயிற்சி அல்லது மேற்பார்வையில் இருந்த ஒரு சமூகத்தைக் குறிக்கிறது. சொற்சொல்லான தமிழ் தவறாக உயிரியல் மகன்கள் எனப் புரியக்கூடும் என்பதால் இயல்பான பொருள் தரப்பட்டுள்ளது; மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; נָא கூற்றை மென்மையாக்குகிறது. சூழலில் ‘இதோ’ இயல்பாக கவன ஈர்ப்பைத் தருகிறது; வேண்டுகோள் நயம் அடுத்த வசனத்தோடு தெளிவாகிறது.
- source_word: הַמָּקוֹם
  choice: இடம்
  rationale: கட்டிடம் அல்லது குடியிருப்பின் வகையைச் சிறப்பாக நிர்ணயிக்காமல், மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: உம்முடைய மேற்பார்வையில் நாங்கள் தங்கியிருக்கும்
  rationale: יָשַׁב இங்கு தங்குதல் அல்லது வசித்தலைக் குறிக்கிறது. לְפָנֶיךָ என்பதன் சொற்சொல்லான ‘உமக்கு முன்பாக’ என்பதை விட, எலிசாவின் முன்னிலையில் அல்லது மேற்பார்வையில் இருந்த உறவை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צַר מִמֶּנּוּ
  choice: எங்களுக்குப் போதுமானதாக இல்லை
  rationale: சொற்சொல்லாக ‘எங்களுக்கு நெருக்கமானது/குறுகியது.’ தற்போதைய இடத்தில் போதிய இடவசதி இல்லை என்ற கருத்தை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיֹּאמְרוּ
  choice: சொன்னார்கள்
  rationale: வாவ் தொடர்வினை கதையின் தொடர்ச்சியை முன்னெடுக்கிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘அப்பொழுது’ சேர்க்காமல் சாதாரண இறந்தகாலம் இயல்பாக அமைகிறது.
theological_decisions:
- issue: לְפָנֶיךָ என்பதன் உறவுசார் பொருள்
  choice: உம்முடைய மேற்பார்வையில்
  alternative: உமக்கு முன்பாக / உமது முன்னிலையில்
  rationale: இடம் உடல்ரீதியாக எலிசாவுக்கு எதிரே இருந்தது என்று மட்டும் கூறாமல், தீர்க்கதரிசிகளின் சீடர்கள் எலிசாவின் முன்னிலையிலும் வழிநடத்தலிலும் இருந்திருக்கலாம் என்ற மூலத்தின் நயத்தை வெளிப்படுத்துகிறது. உறுதியற்ற தன்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதையான தமிழ். எலிசாவை நோக்கிய உரையில் ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழிமரபுகள் வாசகரைத் தவறாக வழிநடத்தாதவாறு பொருளடிப்படையில் மொழிபெயர்க்கப்பட்டு, உண்மையான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
