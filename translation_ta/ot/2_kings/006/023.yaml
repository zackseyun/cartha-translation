base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: ta
  text: அவன் அவர்களுக்காகப் பெரிய விருந்தொன்றை ஏற்பாடு செய்தான்[a]. அவர்கள் உண்டு குடித்தார்கள். பின்பு அவன் அவர்களை அனுப்பிவிட்டான்; அவர்கள் தங்கள் எஜமானரிடம்[b] சென்றார்கள். அதன்பின் அராமின் கொள்ளையிடும் படைக்குழுக்கள் இஸ்ரவேல் நாட்டிற்குள் மீண்டும் வரவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரிய விருந்துணவை ஏற்பாடு செய்தான்.” எபிரெயத்தில் ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் இணைந்து, சிறப்பான உணவை ஏற்பாடு செய்வதைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் ஆண்டவரிடம்.” இது அராமின் அரசனைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “அராம்” என்பது எபிரெயப் பெயர்; பழைய சில மொழிபெயர்ப்புகளில் இது “சீரியா” என வழங்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: ஒரு பெரிய விருந்தை ஆயத்தம் செய்தான்
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைந்த எபிரெய மரபுத்தொடர் கணிசமான விருந்தை ஏற்பாடு செய்வதைக் குறிக்கிறது; ‘பெரிய விருந்து’ என்பது גְדוֹלָה என்பதன் வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: இச்சுட்டுப்பெயர் பிடிபட்ட அராமியர்களைக் குறிக்கிறது; தமிழில் எளிய, இயல்பான வடிவம்.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: அவர்கள் உண்டு குடித்தார்கள்
  rationale: இரு இணை வினைகளையும் சுருக்கமின்றி இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיְשַׁלְּחֵם
  choice: அவன் அவர்களை அனுப்பிவிட்டான்
  rationale: שׁלח என்பதன் ‘அனுப்புதல்/விடுவித்தல்’ பொருளையும், இச்சூழலில் அவர்கள் செல்ல அனுமதிக்கப்பட்டதையும் வெளிப்படுத்துகிறது.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: தங்கள் தலைவனிடம்
  rationale: வடிவத்தில் மரியாதைப் பன்மை இருந்தாலும், சூழலில் அராமின் அரசனாகிய ஒரே அதிகாரியைச் சுட்டுவது சாத்தியம். ‘தலைவன்’ என்பது தேவையற்ற இறையியல் ஒலிப்பைத் தவிர்த்து அதிகார உறவைத் தெரிவிக்கிறது.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: அதன்பின் ... மீண்டும் வரவில்லை
  rationale: יסף + עוד என்ற தொடர் ஒரு செயல் மறுபடியும் நிகழாததைக் குறிக்கிறது; தமிழில் ‘மீண்டும் வரவில்லை’ இதைத் தெளிவாக வழங்குகிறது.
- source_word: גְּדוּדֵי אֲרָם
  choice: அராமின் கொள்ளைப் படைக்குழுக்கள்
  rationale: גְּדוּדֵי என்பது முறையான முழுப் படையைவிட கொள்ளையிடும் படைப்பிரிவுகளைக் குறிக்கிறது; ‘அராம்’ மூலமொழிப் பெயரைப் பேணுகிறது.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டிற்குள் ... வரவில்லை
  rationale: בוא + ב என்பதில் உள்ள ஓர் எல்லைக்குள் நுழையும் இயக்கத்தையும் אֶרֶץ יִשְׂרָאֵל என்ற நிலப்பரப்புக் குறிப்பையும் காக்கிறது.
theological_decisions:
- issue: אֲדֹנֵיהֶם குறிக்கும் நபரின் அடையாளம்
  choice: ‘தங்கள் தலைவன்’ என்று மொழிபெயர்த்து, அராமின் அரசனைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘தங்கள் அரசனிடம்’ அல்லது ‘தங்கள் எஜமானிடம்’
  rationale: சூழல் அரசனைக் குறிப்பதாக வலுவாகச் சுட்டினாலும், மூலச்சொல் நேரடியாக ‘அரசன்’ என்று கூறவில்லை; ஆகவே உரையில் அந்த விளக்கத்தைத் திணிக்காமல் அதிகார உறவைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நிகழ்வுகளின் தொடரைத் தெளிவுபடுத்த ‘ஆகவே’, ‘பின்பு’, ‘அதன்பின்’ பயன்படுத்தப்பட்டுள்ளன. ‘கொள்ளைப் படைக்குழுக்கள்’ என்பது சிறு தாக்குதல் பிரிவுகளின் பொருளைக் காக்கிறது; ‘தலைவன்’ மூலத்தின் திட்டமிட்ட பொதுமையையும் சூழல் சார்ந்த அதிகாரப் பொருளையும் சமநிலைப்படுத்துகிறது.
