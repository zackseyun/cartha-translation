source:
  edition: WLC
  text: וַ/יֹּֽאמֶר לָ֥/הּ הַ/מֶּ֖לֶךְ מַה לָּ֑/ךְ וַ/תֹּ֗אמֶר הָ/אִשָּׁ֨ה הַ/זֹּ֜את אָמְרָ֣ה אֵלַ֗/י תְּנִ֤י אֶת בְּנֵ/ךְ֙ וְ/נֹאכְלֶ֣/נּוּ הַ/יּ֔וֹם וְ/אֶת בְּנִ֖/י נֹאכַ֥ל מָחָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: ta
  text: அப்போது அரசன் அவளிடம், “உனக்கு என்ன நேர்ந்தது?” என்று கேட்டான். அதற்கு அவள், “இந்தப் பெண் என்னிடம், ‘இன்று நாம் உன் மகனைத் தின்பதற்காக அவனைக் கொடு; நாளை என் மகனைத் தின்போம்’ என்று சொன்னாள்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: உனக்கு என்ன நேர்ந்தது?
  rationale: சொல்லுக்குச் சொல் ‘உனக்கு என்ன?’ எனும் கேள்வியை, சூழலில் அவளுடைய குறை அல்லது நிலை என்ன என்பதை விசாரிக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וְנֹאכְלֶנּוּ
  choice: நாம் ... அவனைத் தின்பதற்காக
  rationale: முதல் நபர் பன்மையையும் ஆண்பால் ஒருமை பொருட்சுட்டையும் தெளிவாகப் பாதுகாக்கிறது; கொடூரமான மூலப் பொருளை மென்மைப்படுத்தவில்லை.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: உன் மகனை ... அவனைக் கொடு
  rationale: பெண்ணை நோக்கிய ஒருமை கட்டளையையும் ‘உன் மகன்’ என்ற நேரடியான பொருளையும் காக்கிறது; தமிழ் வாக்கிய ஓட்டத்திற்காக நோக்கக் கூறு இடையில் வைக்கப்பட்டுள்ளது.
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: நாளை என் மகனைத் தின்போம்
  rationale: எபிரெய மூலத்தின் இணை அமைப்பையும் ‘நாம்’ என்ற பன்மை வினையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: முற்றுகைப் பஞ்சத்தின் கொடூரத்தை மொழிபெயர்ப்பில் மென்மைப்படுத்தலாமா
  choice: ‘மகனைத் தின்போம்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மகனை உண்போம்’ அல்லது மறைமுகமாக ‘அவனை உணவாக்குவோம்’ என்று கூறுதல்.
  rationale: மூல உரை மனித மாமிசம் உண்ணும் செயலை அதிர்ச்சியூட்டும் நேரடித்தன்மையுடன் கூறுகிறது; அதன் நெறியியல் கொடூரத்தையும் உரையின் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; உரையாடலுக்கு இயல்பானதாயும், அரசன் மற்றும் முற்றுகைச் சூழலுக்கேற்ற கண்ணியமான வேதாகம நடையுடனும் அமைக்கப்பட்டது. ‘தின்பது’ என்பது இங்கு மூலத்தின் கடுமையான நேரடித்தன்மையைத் தக்கவைக்கிறது.
