source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “பயப்படாதே; ஏனெனில் அவர்களோடு இருப்பவர்களைவிட நம்மோடு இருப்பவர்கள் அதிகம்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சொல்லாக: “ஏனெனில், நம்மோடு இருப்பவர்கள் பலர்; அவர்களோடு இருப்பவர்களைவிட.”'
    reason: எபிரெய மொழியின் ‘பலர் … அவர்களோடு இருப்பவர்களைவிட’ என்ற ஒப்பீட்டுக் கட்டமைப்பை நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் சொன்னான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது. நவீன தமிழில் இயல்பான நடைக்காகத் தொடக்க ‘அப்போது/மேலும்’ சேர்க்காமல், சூழலிலிருந்து அறியப்படும் ஆண்பால் ஒருமை எழுவாயை ‘அவன்’ என வெளிப்படுத்துகிறது.
- source_word: אַל תִּירָא
  choice: பயப்படாதே
  rationale: אַל உடன் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை தடைப் பொருளைக் கொடுக்கிறது; ‘பயப்படாதே’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பயப்பட வேண்டாம் என்பதற்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: רַבִּים אֲשֶׁר אִתָּנוּ
  choice: நம்மோடு இருப்பவர்கள் அதிகம்
  rationale: רַבִּים என்பதன் அடிப்படைப் பொருள் ‘பலர்’; இங்கு מן ஒப்பீட்டுக் கட்டமைப்பில் அது எண்ணிக்கையில் ‘அதிகம்’ என்ற ஒப்பீட்டுப் பொருளைப் பெறுகிறது.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: அவர்களோடு இருப்பவர்களைவிட
  rationale: מן ஒப்பீட்டை அறிமுகப்படுத்துகிறது. אוֹתָם என்பது வடிவில் ‘அவர்களை/அவர்களைத்’ என்ற சுட்டுப்பெயராக இருந்தாலும், முந்தைய ‘நம்மோடு இருப்பவர்கள்’ என்ற அமைப்புக்கு இணையான விடுபட்ட கூறைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அவர்களோடு இருப்பவர்கள்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘நம்மோடு இருப்பவர்கள்’ யார் என்பது
  choice: எபிரெய உரையைப் போலவே அவர்களின் அடையாளம் இவ்வசனத்தில் குறிப்பிடப்படாமல் விடப்பட்டுள்ளது.
  alternative: பின்னணியை வைத்து அவர்களை வானப் படை அல்லது தேவதூதர்கள் என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: அடுத்த வசனம் அவர்களின் இயல்பைப் பற்றிய பின்னணியை அளித்தாலும், இவ்வசனம் அவர்களைப் பெயரிட்டு அடையாளப்படுத்தவில்லை. ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலத்தின் கட்டுப்பாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பயப்படாதே’ ஒருமை அழைப்பைத் தக்கவைக்கிறது; காணாத துணைவர்களின் அடையாளம் விளக்கமாகச் சேர்க்கப்படவில்லை.
