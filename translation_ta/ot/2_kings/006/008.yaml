translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் குறிப்பில் ‘பணியாளர்கள்’ என்பது மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது. அடிக்குறிக் குறியீடு தொடர்புடைய மேற்கோள் வாக்கியத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
