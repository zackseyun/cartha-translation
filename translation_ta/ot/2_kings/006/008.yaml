base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: ta
  text: அராம் அரசன் இஸ்ரவேலுக்கு எதிராகப் போரிட்டுக்கொண்டிருந்தான். அவன் தன் பணியாளர்களுடன் ஆலோசித்து, “இன்ன இன்ன இடத்தில் என் முகாம் இருக்கும்”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லுக்குச் சொல் நெருக்கமாக, “இன்ன இன்ன இடத்தில் என் முகாம் உள்ளது.” பெயர் குறிப்பிடப்படாத ஓர் இடத்தைக் குறிக்கும் மரபுத்தொடரை எபிரெய மொழி பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: அராம் அரசன்
  rationale: וְ என்னும் இணைப்பைத் தமிழில் தனியாகக் காட்டாமல், தொடர்ச்சியான கதைநடையில் இயல்பாக விட்டுள்ளது. אֲרָם என்பது பாரம்பரிய மாற்றுப் பெயரைப் பயன்படுத்தாமல் ‘அராம்’ எனப் பெயரொலிப்புச் செய்யப்பட்டுள்ளது.
- source_word: הָיָה נִלְחָם
  choice: போரிட்டுக்கொண்டிருந்தான்
  rationale: היה + நிஃபால் நிகழ்காலப் பெயரெச்சம் கடந்தகாலத்தில் நீடித்த அல்லது தொடர்ச்சியான செயலைக் குறிக்கிறது; ‘போரிட்டுக்கொண்டிருந்தான்’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: נלחם உடன் வரும் בְ போரின் எதிர்த்தரப்பைக் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பது பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: அவன் தன் பணியாளர்களுடன் ஆலோசித்து
  rationale: வினைச்சொல் ஆலோசனை செய்வதைக் குறிக்கிறது. עֲבָדָיו என்பதன் பரந்த பொருளைப் பாதுகாக்க ‘அதிகாரிகள்’ என்று சுருக்காமல் ‘பணியாளர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்றான்
  rationale: எபிரெய மேற்கோள் அறிமுக அமைப்பு தமிழில் நேரடி மேற்கோளை முடிக்கும் இயல்பான ‘என்றான்’ வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: இன்ன இடத்தில்
  rationale: פְּלֹנִי אַלְמֹנִי என்பது பெயர் குறிப்பிடப்படாத இடத்தைக் குறிக்கும் மரபுத்தொடர். ‘இன்ன இடத்தில்’ என்பது அதன் திட்டமிட்ட தெளிவின்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: תַּחֲנֹתִי
  choice: என் முகாம் இருக்கும்
  rationale: பெயர்ச்சொல் வடிவம் ‘என் முகாம்/என் முகாமிடும் இடம்’ என்ற பொருளைக் கொண்டது. இராணுவத் திட்டமிடல் சூழலில் எதிர்கால நோக்கைத் தமிழில் ‘இருக்கும்’ இயல்பாக வெளிப்படுத்துகிறது; வினைச்சொல்லாக ‘நான் முகாமிடுவேன்’ என மாற்றப்படவில்லை.
