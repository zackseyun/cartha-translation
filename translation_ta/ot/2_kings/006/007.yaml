    text: அல்லது, “அதை மேலே தூக்கு.” எபிரேய வினைச்சொல்லை இன்னும் நேரடியாக ‘தூக்கு’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: எபிரேய வழக்கமான தொடர்நிலை கதைப்போக்கை இயல்பான தமிழில் தருகிறது; முந்தைய சூழலில் பேசுபவர் எலிசா என்பதால் மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: הָרֶם
  choice: எடுத்துக்கொள்
  rationale: רוּם/הֵרִים என்பதன் அடிப்படைப் பொருள் ‘உயர்த்து’ என்றாலும், தண்ணீரின் மேற்பரப்புக்கு வந்த பொருளைக் கையால் எடுக்கும் இச்சூழலில் ‘எடுத்துக்கொள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לָךְ
  choice: நீயே
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டுடன் வரும் לְ, அதை அவனே எடுத்துக்கொள்ள வேண்டும் என்ற தனிப்பட்ட ஈடுபாட்டை இங்கு உணர்த்துகிறது; ‘நீயே’ அதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: எதையாவது பற்றுவதற்காகக் கையை நீட்டும் செயலைக் குறிக்கும் எபிரேய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּקָּחֵהוּ
  choice: அதை எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் மையப் பொருளான ‘எடு/பெறு’ என்பதைக் காக்கிறது; பொருளைக் கையால் பெற்றுக்கொண்ட செயலைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
