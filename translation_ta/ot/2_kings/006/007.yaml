translation:
  language: ta
  text: அவர், “அதை எடுத்துக்கொள்[a]” என்றார். அவன் தன் கையை நீட்டி அதை எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
