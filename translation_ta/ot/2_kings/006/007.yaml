translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. எலிசாவுக்கு ‘அவர்’ என்றும் மற்ற மனிதனுக்கு ‘அவன்’ என்றும் சூழலுக்கேற்ற மரியாதை வேறுபாடு வைக்கப்பட்டுள்ளது; இது எபிரேய இலக்கணத்தில் உள்ள வேறுபாடு அல்ல, இயல்பான தமிழ் உரைநடைக்குரியது.
