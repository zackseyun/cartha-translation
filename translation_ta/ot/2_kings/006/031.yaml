  text: וַ/יֹּ֕אמֶר כֹּֽה יַעֲשֶׂה לִּ֥/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף אִֽם יַעֲמֹ֞ד רֹ֣אשׁ אֱלִישָׁ֧ע בֶּן שָׁפָ֛ט עָלָ֖י/ו הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: ta
  text: அவன், “கடவுள் எனக்கு இப்படியும் அதற்கும் மேலுமாகச் செய்யட்டும்; சாப்பாத்தின் மகன் எலிசாவின் தலை இன்று அவன்மேல் இருந்தால்!” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: கடவுள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்
  rationale: இது தன் மீதே தண்டனையை வரவழைக்கும் நிலையான எபிரெய உறுதிமொழிச் சூத்திரம். தமிழில் அதன் சாப-உறுதிமொழி வலிமையையும், குறிப்பிடப்படாமல் விடப்பட்ட தண்டனையின் தன்மையையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், இங்கு வினைச்சொல் ஒருமையிலும் உறுதிமொழிச் சூழலில் ஒரே கடவுளைக் குறிப்பதாகவும் உள்ளது.
- source_word: אִם
  choice: -ஆல் / இருந்தால்
  rationale: உறுதிமொழிகளில் אִם மறைமுகமான எதிர்மறை நிபந்தனையைத் தரலாம். அதை நேரடியாக ‘நிச்சயமாக இருக்காது’ என்று தீர்த்துவிடாமல், மூலத்தின் நிபந்தனை அமைப்பைத் தமிழில் காக்கிறது.
- source_word: יַעֲמֹד
  choice: நிலைத்திருந்தால்
  rationale: அடிப்படைப் பொருள் ‘நில்’. தலை உடலின் மீது தொடர்ந்து இருப்பதைக் குறிக்கும் இந்தக் கடுமையான, சற்றே மறைமுகமான உருவகத்தை ‘நிலைத்திரு’ காக்கிறது.
- source_word: רֹאשׁ אֱלִישָׁע
  choice: எலிசாவின் தலை
  rationale: எபிரெய சார்பு அமைப்பை இயல்பான தமிழில் தெளிவாகவும் அதன் கடுமை குறையாமலும் தருகிறது.
- source_word: עָלָיו
  choice: அவன் மேல்
  rationale: சுட்டுப்பெயர் இயல்பாக எலிசாவையே குறிக்கிறது. ‘அவன் உடலின் மேல்’ என்பது விளக்கவுரை என்பதால் அதை அடிக்குறிப்பில் தருகிறோம்.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: அரசனின் அச்சுறுத்தலின் உடனடித்தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: உறுதிமொழிச் சூத்திரத்தின் பொருளும் வலிமையும்
  choice: எலிசா அன்றே கொல்லப்படாவிட்டால், பேச்சாளர் தன்மீது கடவுளின் தண்டனையை வரவழைக்கும் உறுதிமொழி
  alternative: முழுமையான உறுதிமொழி வலிமையற்ற கோப வெளிப்பாடு
  rationale: இந்தச் சூத்திரம் எபிரெய வேதாகமத்தில் காணப்படும் நிலையான தன்னைத்தானே சபிக்கும் அரச உறுதிமொழி. ஆகவே அதை வெறும் கோபக் கூற்றாக மெலிதாக்கவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். மூலத்திலுள்ள கடுமையான மரண அச்சுறுத்தலும் மறைமுக நிபந்தனை உறுதிமொழியும் தெளிவுபடுத்தி மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
