base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: ta
  text: அதற்கு அவன், “யாவே உனக்கு உதவாவிட்டால்,[a] நான் எங்கிருந்து உனக்கு உதவ முடியும்? கதிரடிக்கும் களத்திலிருந்தா, திராட்சை மிதிக்கும் தொட்டியிலிருந்தா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உதவு’ என்று இருமுறை மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினை ‘காப்பாற்று’ அல்லது ‘விடுவி’ என்றும் பொருள்படலாம். முதல் கூற்றை, “யாவே உன்னைக் காப்பாற்றாவிட்டால், நான் எங்கிருந்து உன்னைக் காப்பாற்ற முடியும்?” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடரை “யாவே உனக்கு உதவாதிருக்கட்டும்” என்று புரிந்துகொள்ளும் சாத்தியமும் உள்ளது.
    reason: மூலமொழியின் சொற்பொருள் மற்றும் இலக்கணத் தெளிவின்மையைப் பாதுகாத்தல்
lexical_decisions:
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: யாவே உனக்கு உதவாவிட்டால்
  rationale: 'אַל உடன் வரும் தொடரை இச்சூழலில் நிபந்தனைப் பொருளுடைய எதிர்மறை முன்னுரையாக எடுத்துள்ளோம்: ‘யாவே உதவாவிட்டால்’. இது அடுத்து வரும் ‘நான் எங்கிருந்து உதவ முடியும்?’ என்ற விரக்தியான வினாவுடன் இயல்பாக இணைகிறது. எபிரெயத் தொடரின் சுருக்கமும் ஓரளவு தெளிவின்மையும் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.'
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: உனக்கு உதவ / உனக்கு உதவ
  rationale: ישׁע என்பது ‘காப்பாற்று, விடுவி, உதவு’ எனப் பொருள்படலாம். பஞ்சத்தால் உணவு இல்லாத இச்சூழலில் ‘உதவு’ என்பது நடைமுறை நிவாரணத்தை இயல்பாகக் குறிக்கிறது; இரு வினைகளிலும் ஒரே சொல்லைப் பயன்படுத்துவது எபிரெய இணைநிலையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர். தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵאַיִן
  choice: எங்கிருந்து
  rationale: உதவி எந்த மூலத்திலிருந்து வர முடியும் என்பதைக் கேட்கும் வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲמִן הַגֹּרֶן
  choice: கதிரடிக்கும் களத்திலிருந்தா
  rationale: הַגֹּרֶן என்பது தானியத்தைப் பிரித்தெடுக்கும் கதிரடிக்கும் களம். கேள்வித் துகள் தமிழின் ‘-ஆ’ வினாவிகுதியால் இயல்பாகக் காட்டப்பட்டுள்ளது.
- source_word: הַיָּקֶב
  choice: திராட்சை மிதிக்கும் தொட்டி
  rationale: יֶקֶב என்பது திராட்சையை மிதித்துச் சாறு எடுக்கும் தொட்டி அல்லது திராட்சை ஆலை. ‘திராட்சை மிதிக்கும் தொட்டி’ என்பது இன்றைய வாசகருக்குத் தெளிவான, காட்சியளிக்கும் மொழிபெயர்ப்பு.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும் இது முந்தைய வேண்டுகோளுக்கான பதில் என்பதையும் இயல்பான தமிழ்ச் சொற்றொடரால் காட்டுகிறது.
theological_decisions:
- issue: אַל יוֹשִׁעֵךְ יְהוָה தொடரின் பொருள்
  choice: ‘யாவே உனக்கு உதவாவிட்டால்’ என்ற நிபந்தனை வாசிப்பு
  alternative: ‘யாவே உனக்கு உதவாதிருப்பாராக’ அல்லது ‘இல்லை; யாவே உனக்கு உதவட்டும்’ எனப் பிரித்து வாசித்தல்
  rationale: אַל பொதுவாகத் தடையையோ எதிர்மறை விருப்பையோ குறித்தாலும், இங்கு அடுத்து வரும் ‘நான் எங்கிருந்து உனக்கு உதவ முடியும்?’ என்ற வினா நிபந்தனை வாசிப்பைச் சூழலுக்கு மிகவும் பொருத்தமாக்குகிறது. எனினும் மூலத்தின் சுருக்கமான அமைப்பு முற்றிலும் ஒரேவிதமாகப் புரிந்துகொள்ளப்பட வேண்டியதல்ல என்பதால் மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ישׁע வினையின் சூழல்சார் இறையியல் ஒலி
  choice: உதவு
  alternative: காப்பாற்று / விடுவி
  rationale: இங்கு கேட்கப்படுவது பஞ்சத்திலிருந்து கிடைக்க வேண்டிய உடனடி நிவாரணம். ஆகவே, தேவையற்ற ஆன்மிகச் சிறப்புப் பொருளைச் சேர்க்காமல் ‘உதவு’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘காப்பாற்று’ மற்றும் ‘விடுவி’ என்பவையும் சொற்பொருள் சாத்தியங்களாக அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டமான ‘ஆண்டவர்’ அல்ல, தனிப்பெயரான יהוה நேரடியாக வருகிறது. அதனால் பெயரின் தனித்தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு விளங்கும் வகையில் இயல்பாகவும் மரியாதைமிக்க கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கதிரடிக்கும் களம்’ மற்றும் ‘திராட்சை மிதிக்கும் தொட்டி’ என்ற இணை உருவகங்கள் உணவுப் பொருட்கள் முற்றிலும் இல்லாத நிலையைத் தெளிவாக வெளிப்படுத்துகின்றன.
