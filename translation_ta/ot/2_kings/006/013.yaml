- source_word: לְכוּ וּרְאוּ
  choice: நீங்கள் போய்… பாருங்கள்
  rationale: இரண்டு பன்மை ஏவல் வினைகளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵיכֹה הוּא
  choice: அவன் எங்கே இருக்கிறான் என்று
  rationale: இடத்தை விசாரிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான பொருளைத் தருகிறது.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: அப்போது நான் ஆட்களை அனுப்பி அவனைப் பிடிப்பேன்
  rationale: தொடர்ச்சியான செயல்களை இயல்பான தமிழில் காட்டுகிறது; hostile context-இல் לקח என்பது வெறுமனே ‘அழைத்துக்கொள்வது’ அல்ல, கைது செய்வது அல்லது பிடிப்பது என்ற பொருளுடையது. ‘ஆட்களை’ என்பது ‘அனுப்புதல்’ என்ற வினையில் தமிழில் இயல்பாகப் புரிய வேண்டிய மறைமுகப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וַיֻּגַּד לוֹ
  choice: அவனிடம்… என்று தெரிவிக்கப்பட்டது
  rationale: எபிரெய மூலத்திலுள்ள செயப்பாட்டு அமைப்பையும் அரசவைக்கு வரும் தகவல் என்ற தொனியையும் காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் செயல்பாட்டை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: בְדֹתָן
  choice: தோத்தானில்
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, ב என்ற இடப்பொருள் முன்னொட்டை ‘-இல்’ மூலம் காட்டுகிறது.
