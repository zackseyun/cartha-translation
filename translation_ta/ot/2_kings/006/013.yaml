  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: ta
  text: அவன், “நான் அனுப்பி அவனைப் பிடிக்கும்படி, நீங்கள் போய் அவன் எங்கே இருக்கிறான் என்று பாருங்கள்” என்றான்.[a] அவனிடம், “இதோ, அவன் தோத்தானில் இருக்கிறான்” என்று தெரிவிக்கப்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய வினைத் தொடரை முறையாக, “நான் அனுப்புவேன், அவனைப் பிடிப்பேன்” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது நோக்கத்தைக் குறிக்கலாம்: “நான் அனுப்பி அவனைப் பிடிக்கும்படி.”'
    reason: lexical_alternative
  - marker: b
    text: தோத்தான் சமாரியாவுக்கு வடக்கே இருந்த ஒரு நகரம்; யோசேப்பைப் பற்றிய நிகழ்விலும் இவ்விடம் குறிப்பிடப்படுகிறது (ஆதியாகமம் 37:17).
    reason: cross_reference
