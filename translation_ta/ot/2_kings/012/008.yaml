base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: ta
  text: அப்போது அரசன் யோவாஸ் ஆசாரியனான யோயாதாவையும் ஆசாரியர்களையும் அழைத்து, அவர்களிடம், “ஆலயத்தின்[a] சேதங்களை[b] நீங்கள் ஏன் பழுதுபார்க்கவில்லை? இனி உங்கள் அறிமுகமானவர்களிடமிருந்து[c] பணம் வாங்காதீர்கள்; மாறாக, அதனை ஆலயத்தின் பழுதுபார்ப்புக்காகக் கொடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “இல்லம்”; இங்கு இது எருசலேம் ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “சேதங்கள்” என்பதற்கான எபிரெயச் சொல்லை “உடைப்புகள்” அல்லது “பழுதுபார்க்க வேண்டிய பகுதிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் பொருள் காண்பதற்குக் கடினமானது. இதை “உங்களுக்கு அறிமுகமானவர்கள்” என்று நேரடியாகவும், சூழலின் அடிப்படையில் “நன்கொடையாளர்கள்” அல்லது “பங்களிப்பாளர்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இந்தக் கதைச் சூழலில் קרא என்பது ஒருவரை வரவழைத்தல் அல்லது அழைத்தல் என்று பொருள்படும்; “அழைத்து” என்பது இயல்பான தமிழ் நடை.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: அரசன் யோவாஸ்
  rationale: அரசப் பட்டத்தையும் எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பையும் தெளிவாகத் தருகிறது.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: ஆசாரியனாகிய யோயாதாவையும் மற்ற ஆசாரியர்களையும்
  rationale: யோயாதாவையும் தொடர்ந்து குறிப்பிடப்படும் ஆசாரியர்களையும் தமிழில் தெளிவாக வேறுபடுத்த “மற்ற” சேர்க்கப்பட்டுள்ளது; இது பட்டியலின் இயல்பான பொருளை வெளிப்படுத்துகிறது.
- source_word: אֵינְכֶם מְחַזְּקִים
  choice: நீங்கள் ஏன் பழுதுபார்க்கவில்லை
  rationale: חזק என்பதன் அடிப்படைப் பொருள் “வலுப்படுத்துதல்”; ஆனால் கட்டிடச் சேதத்துடன் வரும் இச்சூழலில் அது பழுதுபார்த்தலைக் குறிக்கிறது.
- source_word: בֶּדֶק הַבָּיִת
  choice: இறை இல்லத்தின் சேதங்கள்
  rationale: בדק என்பது உடைப்பு, சேதம், அல்லது பழுதுபார்க்க வேண்டிய பகுதியைக் குறிக்கலாம். הבית இங்கு ஆலயத்தைக் குறிப்பதால் “இறை இல்லம்” மூல உருவகத்தை ஓரளவு காத்து பொருளையும் தெளிவாக்குகிறது.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: பணம் வாங்காதீர்கள்
  rationale: כֶּסֶף என்பது வெள்ளி அல்லது பணம் எனப் பொருள்படும்; ஆலய நிதி நிர்வாகச் சூழலில் “பணம்” தெளிவானது.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: உங்களுக்கு அறிமுகமானவர்களிடமிருந்து
  rationale: מַכָּרֵיכֶם என்ற கடினமான சொல்லின் மிக நேரடியான உறவுசார் பொருளைத் தக்கவைக்கிறது; நிதி வழங்குவோர் என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: மாறாக
  rationale: இங்கு כִּי முந்தைய தடைக்கு எதிரான திருத்தக் கட்டளையை அறிமுகப்படுத்துவதால் எதிர்மறை மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: இறை இல்லத்தைப் பழுதுபார்ப்பதற்காக அந்தப் பணத்தை ஒப்படையுங்கள்
  rationale: לְ நோக்கத்தையும், வினையோடு இணைந்த ஒருமைச் சுட்டுப்பெயர் முன் கூறப்பட்ட பணத்தையும் குறிக்கிறது; “ஒப்படையுங்கள்” நிதியை உரிய பழுதுபார்ப்பு பணிக்குக் கையளிக்கும் கருத்தைத் தருகிறது.
