source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: ta
  text: குற்றநிவாரணப் பலிக்கான பணமும் பாவநிவாரணப் பலிகளுக்கான பணமும்[a] யாவேயின் இல்லத்திற்குள்[b] கொண்டுவரப்படாது; அவை ஆசாரியர்களுக்குரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘குற்றநிவாரணப் பலியின் வெள்ளியும் பாவநிவாரணப் பலிகளின் வெள்ளியும்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் இல்லம்’ என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: clarification
lexical_decisions:
- source_word: כֶּסֶף
  choice: பணம்
  rationale: இச்சூழலில் வெள்ளி ஒரு நாணயமாக அல்லது செலுத்தப்படும் தொகையாகக் குறிக்கப்படுகிறது; எனவே நவீனத் தமிழில் இயல்பாகப் புரியும் ‘பணம்’ பயன்படுத்தப்பட்டது.
- source_word: אָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: பலியியல் சூழலில் இது குற்றத்திற்கான நிவாரணம் அல்லது ஈடுசெய்தலோடு தொடர்புடைய பலிவகையைக் குறிக்கிறது.
- source_word: חַטָּאוֹת
  choice: பாவநிவாரணப் பலிகள்
  rationale: இங்கு சொல் பொதுவான ‘பாவங்கள்’ என்பதைக் குறிக்காமல், ஒரு பலிவகையைக் குறிக்கிறது. பன்மையும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לֹא יוּבָא
  choice: கொண்டுவரப்படாது
  rationale: எதிர்மறைச் செயலப்பாட்டு வடிவம் இத்தொகையை ஆலயத்திற்குள் கொண்டுவராத நடைமுறை அல்லது விதியைச் சுருக்கமாக வெளிப்படுத்துகிறது; தமிழிலும் விதி மற்றும் வழக்கமான நடைமுறை ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: ‘யாவேயின் வீடு/இல்லம்’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, அடிக்குறிப்பில் அது ஆலயத்தைக் குறிக்கும் என்று தெளிவுபடுத்தப்படுகிறது.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: அவை ஆசாரியர்களுக்குரியவை
  rationale: இரு வகைப் பணத்தையும் குறிக்கும் பன்மையைத் தக்கவைத்து, அவை ஆசாரியர்களுக்கு ஒதுக்கப்பட்டவை என்ற உடைமை/ஒதுக்கீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: חַטָּאוֹת என்ற பலிவகையின் பொருள்
  choice: பாவநிவாரணப் பலிகள்
  alternative: தூய்மைப்படுத்தும் பலிகள்
  rationale: இது பாவத்தோடு தொடர்புடைய பலிவகை என்பதைத் தெளிவாகக் காட்டுகிறது; ‘தூய்மைப்படுத்தும் பலி’ என்ற சாத்தியமான சடங்கியல் நுணுக்கத்தைத் திணித்து தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்கள்’ என்ற வழக்கமான வேதாகமச் சொல் தக்கவைக்கப்பட்டது; எபிரேய வாக்கியத்தின் ஒதுக்கீட்டு வலிமையை ‘உரியவை’ வெளிப்படுத்துகிறது.
