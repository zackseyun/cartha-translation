base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: ta
  text: யூதாவின் அரசன் யோவாஸ், யூதாவை ஆண்ட தன் முன்னோர்களான[b] யோசபாத், யோராம், அகசியா ஆகிய அரசர்கள் அர்ப்பணித்த எல்லாப் பரிசுத்தப் பொருட்களையும், தான் அர்ப்பணித்த பரிசுத்தப் பொருட்களையும், யாவேயின் ஆலயக் கருவூலங்களிலும் அரச அரண்மனையின் கருவூலங்களிலும் காணப்பட்ட எல்லாத் தங்கத்தையும் எடுத்து, அராமின் அரசன் ஆசகேலுக்கு அனுப்பினான். அப்போது ஆசகேல் எருசலேமைவிட்டு விலகிச் சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எருசலேமின் மீதிருந்து பின்வாங்கினான்.” எபிரெயத்தில் சொல்லளவில், “அவன் எருசலேமின் மேலிருந்து ஏறிச் சென்றான்” என்று உள்ளது; இது ஆசகேல் நகருக்கு எதிரான தனது முன்னேற்றத்தை நிறுத்தி விலகியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “முன்னோர்கள்” என்பது அவனுக்கு முன்பு ஆட்சி செய்த அரச வம்ச முன்னோர்களைக் குறிக்கிறது; இவர்கள் அனைவரும் அவனுடைய நேரடித் தந்தையர் அல்லர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் இயல்பான பொருள் ‘எடுத்தான்’; ‘கைப்பற்றினான்’ என்பது தேவையற்ற வன்முறையைக் குறிக்கும்.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: பரிசுத்தப் பொருட்கள்
  rationale: புனிதப் பயன்பாட்டுக்கென்று அர்ப்பணிக்கப்பட்ட பொருட்களைச் சுட்டுகிறது; இரு இடங்களிலும் ஒரே சொல்லிணைப்பைப் பேணுகிறது.
- source_word: הִקְדִּישׁוּ
  choice: அர்ப்பணித்திருந்த
  rationale: புனிதப் பயன்பாட்டுக்காக ஒதுக்கி அர்ப்பணித்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲבֹתָיו
  choice: தன் முன்னோர்கள்
  rationale: அரச மரபுச் சூழலில் இது நேரடித் தந்தையரை மட்டுமல்ல, முந்தைய தலைமுறைகளைச் சேர்ந்த அரச முன்னோர்களைக் குறிக்கிறது.
- source_word: בְּאֹצְרוֹת
  choice: கருவூலங்களில்
  rationale: ஆலயத்திலும் அரண்மனையிலும் மதிப்புமிக்க பொருட்கள் வைக்கப்பட்டிருந்த சேமிப்பிடங்களுக்கு ஏற்ற நவீனத் தமிழ் சொல்.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בית என்பது சொல்லளவில் ‘வீடு’ என்றாலும் இச்சூழலில் ஆலயத்தைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனை
  rationale: சொல்லளவில் ‘அரசனின் வீடு’; இச்சூழலில் இயல்பான தமிழில் அரண்மனையைக் குறிக்கிறது.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: ஆசகேலுக்கு அனுப்பினான்
  rationale: முன்னதாகப் பட்டியலிடப்பட்ட பொருட்கள் அனைத்தையும் அனுப்பியதாகத் தமிழில் தெளிவாகத் தொடர்கிறது.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: அப்போது ஆசகேல் எருசலேமைவிட்டு விலகிச் சென்றான்
  rationale: சொற்றொடர் எருசலேமுக்கு எதிரான முன்னேற்றத்தை ஆசகேல் கைவிட்டு அகன்றதை உணர்த்துகிறது; வெளிப்படையான காரணவிளைவைச் சேர்க்காமல் தொடர் நிகழ்வாக மொழிபெயர்க்கிறது.
- source_word: אֲרָם
  choice: சீரியா
  rationale: வேதாகமத்தின் பண்டைய அராம் நாட்டை நவீன தமிழ் வாசகர்கள் எளிதில் அடையாளம் காணும் மரபான பெயர்; வரலாற்று அராமையே குறிக்கும்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் பயன்படுத்தப்படுகிறது.
- issue: וַיַּעַל מֵעַל יְרוּשָׁלִָם என்பதன் தொடர்பும் கர்த்தாவும்
  choice: அப்போது ஆசகேல் ... விலகிச் சென்றான்
  alternative: எனவே அவன் எருசலேமைவிட்டு விலகினான்; அவன் எருசலேமிலிருந்து மேலே சென்றான்
  rationale: எளிய தொடர் வாவை வெளிப்படையான காரணவிளைவாக மாற்றாமல், சூழலால் உணரப்படும் ஆசகேலைக் கர்த்தாவாகக் காட்டுகிறது; எபிரெய மொழிப்பழக்கத்தின் கருத்தை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. பெயர்கள் தமிழ் வேதாகம மரபுக்கு நெருக்கமாக வழங்கப்பட்டன; அடிக்குறிப்பு குறியீடுகள் உரையில் இணைக்கப்பட்டுள்ளன.
