- from: யூதாவின் அரசன் யோவாஸ், தன் முன்னோர்களான[b] யூதாவின் அரசர்கள் யோசபாத், யோராம், அகசியா ஆகியோர் அர்ப்பணித்திருந்த எல்லாப் பரிசுத்தப் பொருட்களையும், தான் அர்ப்பணித்திருந்த பரிசுத்தப் பொருட்களையும், யெகோவாவின் ஆலயக் கருவூலங்களிலும் அரச அரண்மனைக் கருவூலங்களிலும் காணப்பட்ட எல்லாத் தங்கத்தையும் எடுத்து, சீரியாவின் அரசன் ஆசகேலுக்கு அனுப்பினான். அப்போது ஆசகேல் எருசலேமைவிட்டு விலகிச் சென்றான்.[a]
