base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: ta
  text: அப்போது ஆசாரியனாகிய யோயாதா ஒரு பெட்டியை எடுத்து, அதன் மூடியில்[a] ஒரு துளையிட்டு, யாவேயின் ஆலயத்திற்குள் ஒருவர் நுழையும்போது நுழைபவரின் வலப்பக்கத்தில், பலிபீடத்தின் அருகே அதை வைத்தார். வாயிற்படியைக் காவல்காத்த ஆசாரியர்கள், யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்பட்ட வெள்ளி[b] அனைத்தையும் அதில் போட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘அதன் கதவில்.’ இச்சூழலில் அது பெட்டியின் மூடியைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பணம்.’ எபிரெயச் சொல் ‘வெள்ளி’ என்றும், வெள்ளி நாணயம் அல்லது பொதுவாகப் பணம் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: பெட்டி
  rationale: ஆலய நிதியைச் சேகரிக்கும் கொள்கலன் இங்கு குறிக்கப்படுகிறது; உடன்படிக்கைப் பெட்டியோடு குழப்பமுண்டாக்காமல், இயல்பான தமிழில் ‘பெட்டி’ என வழங்கப்பட்டது.
- source_word: וַיִּקֹּב חֹר
  choice: ஒரு துளையிட்டு
  rationale: נקב + חור என்பது ஒரு திறப்பைத் துளையிட்டு உண்டாக்குவதைக் குறிக்கிறது; தமிழில் செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְּדַלְתּוֹ
  choice: அதன் மூடியில்
  rationale: דלת என்பதன் அடிப்படைப் பொருள் ‘கதவு’; ஆனால் சிறிய பணப்பெட்டியின் சூழலில் திறந்து மூடக்கூடிய மேற்பகுதி, அதாவது மூடி, குறிக்கப்படுவது மிகச் சாத்தியம்.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகே
  rationale: אצל குறிக்கும் அண்மையை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: בימין
  choice: வலப்பக்கத்தில்
  rationale: உள்ளே நுழைபவரின் பார்வையிலிருந்து பெட்டி இருந்த இடத்தைச் சுட்டும் நேரடியான இடவியல் மொழிபெயர்ப்பு.
- source_word: בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திற்குள் ஒருவர் நுழையும்போது
  rationale: இது உள்ளே நுழையும் நபரின் பார்வையிலிருந்து வலப்பக்கத்தை வரையறுக்கிறது. אִישׁ இங்கு பொதுப்படையான ஒருமையாகப் பயன்படுவதால், நவீன தமிழில் இயல்பான ‘ஒருவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֹׁמְרֵי הַסַּף
  choice: வாயிற்படியைக் காவல்காத்த
  rationale: சொல்லடிப்படையில் ‘வாயிற்படியைக் காப்பவர்கள்’; ஆலய நுழைவைக் காவல்காக்கும் ஆசாரியர்களின் பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הַכֶּסֶף
  choice: வெள்ளி அனைத்தையும்
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; இச்சூழலில் அது பணத்தையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הַמּוּבָא
  choice: கொண்டுவரப்பட்ட
  rationale: בוא வினையின் ஹொஃபால் பங்கேற்பு வடிவிலுள்ள செயப்பாட்டு அர்த்தத்தைத் தக்கவைக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லடிப்படையில் ‘யாவேயின் வீடு’; தமிழில் வழிபாட்டிடத்தைக் குறிக்கும் இயல்பானதும் தெளிவானதுமான ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் கடவுளின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக இருப்பதால், அதைப் பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகத் தக்கவைக்கப்பட்டது.
- issue: אִישׁ என்ற ஆண்பால் ஒருமைச் சொல்லின் பொதுப்படையான பயன்பாடு
  choice: ஒருவர் நுழையும்போது
  alternative: ஓர் ஆண் நுழையும்போது
  rationale: இந்தத் தொடரின் நோக்கம் நுழைபவரின் பார்வையிலிருந்து இடத்தை வரையறுப்பதே; குறிப்பாக ஆண்களை மட்டும் வரையறுப்பது அல்ல. பொதுப்படையான ஒருமையை இயல்பான தமிழில் ‘ஒருவர்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. நிகழ்வுகளின் தொடரைத் தெளிவாக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது. ஆலயச் சூழலுக்குரிய ‘ஆசாரியன்,’ ‘பலிபீடம்,’ ‘வாயிற்படி’ ஆகிய சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் பொதுப்படையான ஒருமை தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
