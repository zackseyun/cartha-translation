  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: ta
  text: எடைபோடப்பட்ட வெள்ளியை[a], யாவேயின் ஆலயப் பணியை மேற்பார்வையிட நியமிக்கப்பட்டவர்களின் கையில்[b] அவர்கள் ஒப்படைத்தார்கள். அவர்கள் அதை, யாவேயின்[c] ஆலயப் பணியில் வேலை செய்த தச்சர்களுக்கும் கட்டுபவர்களுக்கும் வழங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அளவிடப்பட்ட வெள்ளி’ அல்லது ‘கணக்கிடப்பட்ட பணம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “கையில்”; இது அவர்களுடைய பொறுப்பில் ஒப்படைத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “யாவே” என்பது எபிரெயத்தில் YHWH என எழுதப்படும் தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: எடைபோடப்பட்ட வெள்ளி
  rationale: מְתֻכָּן என்பது அளவிடப்பட்ட அல்லது எடைபோடப்பட்டதைக் குறிக்கிறது. ஆலயப் பழுதுபார்ப்புக்கான நிதியை வழங்கும் சூழலில், தொகையை எடைபோட்டுத் தயார் செய்ததைக் குறிப்பாகவும் இயல்பாகவும் இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: עַל יַד
  choice: கையில் ஒப்படைத்தார்கள்
  rationale: ‘கையில்’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்தபடியே, பணம் அவர்களின் பொறுப்பில் ஒப்படைக்கப்பட்டது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֹשֵׂי הַמְּלָאכָה הַפְּקֻדִים בֵּית יְהוָה
  choice: யாவேயின் ஆலயப் பணிக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த பணியாளர்கள்
  rationale: இந்தத் தொடர் வேலை செய்தவர்களையும் ஆலயம் தொடர்பான பொறுப்புக்கு நியமிக்கப்பட்டிருந்தவர்களையும் குறிக்கிறது. மேற்பார்வை என்ற கருத்தை மிகைப்படுத்தாமல், ஒப்படைக்கப்பட்ட பொறுப்பைத் தெளிவாக்குகிறது.
- source_word: וַיּוֹצִיאֻהוּ
  choice: அதை வழங்கினார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘அதை வெளியே கொண்டுவந்தார்கள்’ என்பதாக இருந்தாலும், இங்கு நிதியைத் தொழிலாளர்களுக்குக் கொடுத்தல் அல்லது வழங்குதல் என்ற நிதிசார் பொருள் உள்ளது.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: தச்சர்களுக்கு
  rationale: சொல்லுக்குச் சொல் ‘மரக் கைவினைஞர்கள்’ எனப் பொருள்படும் இத்தொடருக்கு, கட்டுமானச் சூழலில் ‘தச்சர்கள்’ என்பது துல்லியமான இயல்பான தமிழ்.
- source_word: וְלַבֹּנִים
  choice: கட்டடத் தொழிலாளர்களுக்கு
  rationale: בֹּנִים என்பது பொதுவாகக் கட்டுபவர்களைக் குறிக்கிறது; கல் வேலை செய்பவர்கள் என்று குறுக்காமல் விரிந்த பொருளை இது காக்கிறது.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்தில் வேலை செய்துவந்த
  rationale: ஆலயத்தின் மீது அல்லது அதில் நடைபெற்ற வேலையை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் பழுதுபார்ப்பு இருந்தாலும், மூலத்தில் இங்கே வெளிப்படையாக இல்லாத அந்தச் சொல்லைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ஆலய நிர்வாகம் மற்றும் கட்டுமானம் சார்ந்த சொற்கள் தேவையற்ற பழமையோ மிகைத் தொழில்நுட்பமோ இல்லாமல் தேர்ந்தெடுக்கப்பட்டுள்ளன.
