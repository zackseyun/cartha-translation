  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: ta
  text: ஆனால் ஆசாரியர்கள் மக்களிடமிருந்து பணம் வாங்காமல் இருக்கவும், அந்த இல்லத்தின் சேதத்தைச் சீர்செய்யாமல் இருக்கவும் ஒப்புக்கொண்டனர்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘அந்த இல்லத்தின் சேதத்தை வலுப்படுத்தாமல் இருக்கவும்’ எனலாம்; இது ஆலயத்தில் ஏற்பட்ட சேதத்தைச் சீர்செய்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘இல்லம்’ என்பது ஆண்டவரின் இல்லமாகிய ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: ஒப்புக்கொண்டனர்
  rationale: אבה என்ற வினைச்சொல் இங்கு சம்மதித்தல் அல்லது உடன்படுதல் என்பதைக் குறிக்கிறது; தொடர்ந்து வரும் இரண்டு எதிர்மறை வினையெச்சக் கூறுகளுடன் ‘ஒப்புக்கொண்டனர்’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணிச்சூழலில் כֹּהֲנִים என்பதற்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: לְבִלְתִּי קְחַת
  choice: வாங்குவதில்லை என்று
  rationale: לְבִלְתִּי + வினையெச்சம் செய்யாதிருக்க ஒப்புக்கொண்ட செயலைக் குறிக்கிறது; தமிழ் மறைமுகக் கூற்றில் இந்த வடிவம் இயல்பாக உள்ளது.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: சொல்லளவில் ‘வெள்ளி’ என்று பொருள்படலாம்; ஆனால் இங்குள்ள நிர்வாக மற்றும் வசூல் சூழலில் பரிமாற்றப் பணமே கருத்து.
- source_word: מֵאֵת הָעָם
  choice: மக்களிடமிருந்து
  rationale: மூலத்தின் முன்னிடைச்சொல் தொடர்பையும் பொதுமக்களைக் குறிக்கும் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: பழுதுபார்ப்பதில்லை என்றும்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்துதல்’; ஆனால் בדק הבית உடன் வரும்போது சேதத்தைச் சீரமைத்தல் என்ற மரபுத்தொடர்ப் பொருளைத் தருகிறது.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: அந்த இல்லத்தின் சேதத்தை
  rationale: בדק என்பது பிளவு அல்லது பழுதடைந்த பகுதியைக் குறிக்கிறது. הבית என்பதை ‘இல்லம்’ என வைத்திருப்பது எபிரெய வெளிப்பாட்டைப் பாதுகாக்கிறது; சூழலில் அது ஆண்டவரின் ஆலயத்தைக் குறிக்கும்.
