  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: ta
  text: சுவர் கட்டுவோருக்காகவும்[a], கல் வெட்டுபவர்களுக்காகவும், கட்டுமான மரப்பொருட்களையும் குவாரியில் வெட்டிய கற்களையும்[b] வாங்குவதற்காகவும், யாவேயின் ஆலயத்தில் ஏற்பட்ட சேதத்தைப் பழுதுபார்ப்பதற்காகவும்[c], ஆலயத்தைப் பழுதுபார்க்க ஏற்படும் எல்லாச் செலவுகளுக்காகவும்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கட்டுமானத் தொழிலாளர்கள்.’ எபிரேயச் சொல் சுவர் கட்டும் அல்லது கற்கட்டுமானத்தைப் பழுதுபார்க்கும் தொழிலாளர்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செதுக்கப்பட்ட கற்கள்’ அல்லது ‘வெட்டிய கற்கள்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லளவில், ‘யாவேயின் வீட்டின் பிளவை வலுப்படுத்துவதற்காக.’ இங்கு கட்டடச் சேதத்தைச் சீரமைப்பதே பொருள்.
    reason: lexical_alternative
  - marker: d
    text: சொல்லளவில், ‘ஆலயத்தின்மேல் வெளியேறும் எல்லாவற்றிற்காகவும்’; அதாவது, அதைப் பழுதுபார்க்க ஏற்படும் எல்லாச் செலவுகளுக்காகவும்.
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: சுவர் கட்டுபவர்கள்
  rationale: גדר என்பதன் பங்கேற்பு வடிவம் சுவர் அல்லது கற்கட்டுமானப் பணியில் ஈடுபடுவோரைக் குறிக்கிறது. ‘சுவர் கட்டுபவர்கள்’ என்பது பொதுவாசகருக்குத் தெளிவாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: கல் வெட்டுபவர்கள்
  rationale: கற்களை வெட்டி வடிவமைப்பவர்களையோ குவாரியில் வெட்டியெடுப்பவர்களையோ குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: לִקְנוֹת עֵצִים
  choice: மரங்களை வாங்கி
  rationale: இங்கு עֵצִים கட்டுமானத்திற்கான மரப்பொருளைக் குறிக்கிறது; தமிழில் ‘மரங்கள்’ என்பது கட்டுமானச் சூழலில் இயல்பாகப் புரிகிறது.
- source_word: אַבְנֵי מַחְצֵב
  choice: குவாரியில் வெட்டிய கற்கள்
  rationale: מַחְצֵב கல் வெட்டியெடுக்கப்படும் இடத்தையோ அங்கிருந்து பெறப்பட்ட கல்லையோ குறிக்கிறது. இந்தத் தேர்வு மூலத்தின் குவாரி சார்ந்த பொருளைத் தெளிவாக்குகிறது.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: சேதத்தைப் பழுதுபார்க்க
  rationale: சொல்லளவில் ‘பிளவை/சேதத்தை வலுப்படுத்த’ என்ற அமைப்பு இருந்தாலும், இச்சூழலில் கட்டடச் சேதத்தைச் சீரமைப்பதே நோக்கம். இயல்பான தமிழுக்காக ‘பழுதுபார்க்க’ பயன்படுத்தப்பட்டு, சொல்லளவிலான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ நவீனத் தமிழில் தெளிவானது; யாவே என்ற தனிப்பெயர் பாதுகாக்கப்படுகிறது.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: ஆலயத்தைப் பழுதுபார்க்கச் செய்யப்படும் மற்ற எல்லாச் செலவுகளுக்காகவும்
  rationale: ‘ஆலயத்தின்மேல் வெளியேறும் அனைத்தும்’ என்பது செலவிடப்படுவதைக் குறிக்கும் எபிரேய மரபுத்தொடர். தமிழில் அதன் பொருள் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: לְחָזְקָה
  choice: ஆலயத்தைப் பழுதுபார்க்க
  rationale: חזק அடிப்படையில் ‘வலுப்படுத்து’ என்றாலும், இங்கு செலவுகளின் நோக்கம் கட்டடத்தைச் சீரமைத்தல் என்பதால் ‘பழுதுபார்க்க’ என்பது சூழலுக்கேற்றது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரேய மூலத்திலுள்ள தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தருகிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘வீடு’ என்ற உருவகத்தை வெளிப்படுத்துதல்
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: வரலாற்றுச் சூழலில் குறிக்கப்படுவது ஆலயம் என்பதால் பிரதான உரையில் தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது; நேரடி வடிவத்தைத் தனியாகக் கட்டாயப்படுத்தி இறையியல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: மொழிநடை நவீன, மரியாதையான, பொதுவாசகருக்கு எளிதில் புரியும் தரநிலைத் தமிழ். கொடுக்கப்பட்ட வசனம் முந்தைய சூழலின் பணத்தைச் சார்ந்த தொடராக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘அந்தப் பணம் பயன்படுத்தப்பட்டது’ என்பது சூழலிலிருந்து வெளிப்படையாக நிரப்பப்பட்டுள்ளது. தொழில்நுட்பமான கட்டுமானச் சொற்கள் எளிமைப்படுத்தப்பட்டாலும், மூலத்தின் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
