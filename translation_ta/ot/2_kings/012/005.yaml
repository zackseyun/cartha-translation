base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: ta
  text: யோவாஸ் ஆசாரியர்களிடம், “யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்படும் அர்ப்பணிக்கப்பட்ட பொருட்களுக்குரிய பணம் அனைத்தையும்—கணக்கெடுக்கப்பட்ட ஒவ்வோர் ஆணிடமிருந்தும் பெறப்படும் பணத்தையும்[a], நபர்களின் மதிப்பீட்டுக்குரிய பணத்தையும்[b], யாவேயின் ஆலயத்திற்குக் கொண்டுவர ஒருவன் தன் உள்ளத்தில் எண்ணும் எல்லாப் பணத்தையும்[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்ல, “கடந்து செல்லும் ஒவ்வோர் ஆணின் பணம்.” இது கணக்கெடுக்கப்பட்டவர்கள் செலுத்த வேண்டிய தொகையைக் குறிக்கலாம்; யாத்திராகமம் 30:13–16-ஐ ஒப்பிடுக.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நபர்களின் மதிப்பீட்டிற்கான பணம்.” இது நேர்ச்சையுடன் தொடர்புடைய நபர் மதிப்பீட்டுத் தொகைகளைக் குறிக்கலாம்; லேவியராகமம் 27:2–8-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல்ல, “ஒருவனுடைய இருதயத்தின்மேல் எழும் பணம்”; அதாவது ஒருவர் தாமாக விரும்பி அளிக்கத் தீர்மானிக்கும் பணம்.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: அர்ப்பணிக்கப்பட்ட பொருட்களுக்குரிய பணம் அனைத்தையும்
  rationale: הַקֳּדָשִׁים என்பது பரிசுத்தமான அல்லது அர்ப்பணிக்கப்பட்ட பொருட்களைக் குறிக்கலாம். ஆலய வருவாயின் பல வகைகளைத் தொடர்ந்து பட்டியலிடும் சூழலில், இயல்பான தமிழில் இந்தத் தொடர்பைத் தெளிவாகவும், அதன் பரந்த பொருளைச் சுருக்காமலும் தருகிறது.
- source_word: יוּבָא בֵית יְהוָה
  choice: யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்படும்
  rationale: Hophal வினைவடிவின் செயப்பாட்டு பொருளை ‘கொண்டுவரப்படும்’ என்பதும், בֵית என்பதன் ஆலயச் சூழலை ‘ஆலயம்’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: கணக்கெடுக்கப்பட்ட ஒவ்வோர் ஆணிடமிருந்தும் பெறப்படும் பணம்
  rationale: சொல்லுக்குச் சொல் ‘கடந்து செல்கிற ஒவ்வொருவனின் பணம்’ என்று இருந்தாலும், யாத்திராகமம் 30:13–16-இன் கணக்கெடுப்பு செலுத்துத்தொகையை இச்சுருக்கமான சொற்றொடர் சுட்டுவதாகத் தெரிகிறது. ‘ஆண்’ என்பது אִישׁ என்பதன் பாலினத்தையும் இச்சட்டச் சூழலையும் காக்கிறது; மாற்று நேரடி பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: ஆட்களின் மதிப்பீட்டுக்குரிய பணம்
  rationale: சுருக்கமான எபிரெயச் சொற்றொடரிலுள்ள நபர்களின் நிர்ணயிக்கப்பட்ட மதிப்பு என்ற சட்ட/வழிபாட்டு கருத்தைத் தருகிறது; பிரதான உரையில் அது நேர்ச்சைப் பொருத்தமானது என்று மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: ஒருவனுடைய உள்ளத்தில் எழும் விருப்பத்தின்படி அளிக்கப்படும் பணம் அனைத்தையும்
  rationale: ‘ஒருவனின் இருதயத்தின்மேல் எழுவது’ என்ற எபிரெய மரபுத்தொடர் உள்ளார்ந்த விருப்பம் அல்லது தன்னார்வத் தீர்மானத்தைக் குறிக்கிறது. தமிழில் பொருள் இயல்பாக இருக்க ‘உள்ளத்தில் எழும் விருப்பம்’ என உருவகம் ஓரளவு காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பட்டப்பெயரைக் காட்டிலும் நான்கெழுத்து இறைப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பான ‘யாவே’ என்று தருவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ என்பதன் வழிபாட்டு குறிப்பு
  choice: ஆட்களின் மதிப்பீட்டுக்குரிய பணம்
  alternative: நேர்ச்சையாக மதிப்பிடப்பட்ட ஆட்களுக்கான பணம்
  rationale: லேவியராகமம் 27:2–8 பின்னணியாக இருக்கலாம்; ஆனால் இவ்வசனம் ‘நேர்ச்சை’ என்பதை வெளிப்படையாகக் கூறாததால், பிரதான உரையில் அந்த விளக்கத்தைச் சேர்க்காமல் அடிக்குறிப்பில் சாத்தியமான தொடர்பாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஆலயச் சட்டச் சொற்றொடர்களின் சுருக்கமும் உண்மையான தெளிவின்மையும் காக்கப்பட்டுள்ளன. எபிரெய வசனம் அடுத்த வசனத்தில் நிறைவடைவதால், பிரதான உரையும் முற்றுப்பெறாத மேற்கோளாக நீண்ட கோட்டுடன் முடிகிறது.
