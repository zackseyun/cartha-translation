translation:
  language: ta
  text: யோவாஸ் அரசனின் ஆட்சியின் இருபத்து மூன்றாம் ஆண்டில், ஆசாரியர்கள் ஆலயத்தின் சேதங்களைப் பழுதுபார்க்கவில்லை[a].
  philosophy: optimal-equivalence
