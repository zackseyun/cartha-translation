    text: மாற்றாக, “வீட்டின் பிளவுகள்.” இங்கு “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆண்டிலும்
  rationale: வசனம் முந்தைய நிகழ்வின் தொடர்ச்சியில் ஒரு புதிய காலக்கட்டத்தை அறிமுகப்படுத்துகிறது. தனியாக ‘நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட, ‘இருபத்துமூன்றாம் ஆண்டிலும்’ என்பது இயல்பான தமிழில் அதன் உரையாடல் செயல்பாட்டையும், அந்த நேரம் வரை பழுது பார்க்கப்படாத நிலையையும் வெளிப்படுத்துகிறது.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: யோவாஸ் அரசனுடைய ஆட்சியின் இருபத்துமூன்றாம் ஆண்டிலும்
  rationale: இது அரசாட்சிக் காலத்தைக் கணக்கிடும் வழக்கமான எபிரெயச் சொற்றொடர். ‘ஆட்சியின் இருபத்துமூன்றாம் ஆண்டு’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: לֹא חִזְּקוּ
  choice: பழுதுபார்க்கவில்லை
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘பலப்படுத்துதல்’; ஆனால் בדק הבית உடன் இது கட்டடச் சேதங்களைச் சீரமைப்பதைக் குறிக்கிறது. ‘பழுதுபார்க்கவில்லை’ சூழல்சார் பொருளை இயல்பாக வழங்குகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய הכהנים என்பதற்கான தமிழில் பரவலாக அறியப்பட்ட வேதாகமச் சொல்.
- source_word: בֶּדֶק הַבָּיִת
  choice: ஆலயத்தில் ஏற்பட்டிருந்த சேதங்களை
  rationale: בדק என்பது பிளவு, உடைவு அல்லது பழுதுபார்க்க வேண்டிய சேதநிலையைக் குறிக்கிறது. הבית என்பது சொற்படியாக ‘வீடு’ என்றாலும், இச்சூழலில் யெகோவாவின் ஆலயத்தைக் குறிக்கிறது; தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
