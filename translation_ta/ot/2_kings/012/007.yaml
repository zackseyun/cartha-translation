translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்கள்’ என்ற பரவலாக அறியப்பட்ட சொல் தக்கவைக்கப்பட்டது; ‘வீடு’ என்பதன் சூழல்சார் குறிப்பு முதன்மை உரையில் ‘ஆலயம்’ எனத் தெளிவாக்கப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் வழங்கப்பட்டது.
