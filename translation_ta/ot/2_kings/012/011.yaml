  text: וַֽ/יְהִי֙ כִּ/רְאוֹתָ֔/ם כִּֽי רַ֥ב הַ/כֶּ֖סֶף בָּֽ/אָר֑וֹן וַ/יַּ֨עַל סֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וְ/הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וַ/יָּצֻ֨רוּ֙ וַ/יִּמְנ֔וּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֥א בֵית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: ta
  text: பெட்டியில் வெள்ளி நிறைய இருப்பதை அவர்கள் காணும்போதெல்லாம், அரசனின் எழுத்தரும் தலைமை ஆசாரியரும் மேலே வந்து, ஆண்டவரின் ஆலயத்தில் காணப்பட்ட வெள்ளியைக் கட்டி எண்ணினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: மூலச்சொல் வெள்ளி உலோகத்தையும் வெள்ளிப் பணத்தையும் குறிக்கலாம்; ‘பணம்’ என்று மட்டும் கூறாமல் அதன் நேரடிப் பொருளையும் வரலாற்றுச் சூழலையும் காக்கிறது.
- source_word: אָרוֹן
  choice: பெட்டி
  rationale: காணிக்கையாக வந்த வெள்ளியைச் சேகரிக்கும் பெட்டியை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: அரசனுடைய எழுத்தர்
  rationale: அரசவையின் எழுதுதல் மற்றும் கணக்குப்பதிவு சார்ந்த அதிகாரியை மூலத்திற்கு நெருக்கமாகக் குறிக்கிறது.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: ஆசாரியர்களில் தலைமை வகித்த பதவியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּצֻרוּ
  choice: கட்டி
  rationale: எபிரெய வினை வெள்ளியைப் பொட்டலங்களாகக் கட்டிய செயலைக் குறிக்கக்கூடும்; ‘பைகளில் போட்டனர்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்காமல் செயலைத் திறந்த நிலையில் வைக்கிறது.
- source_word: בֵית יְהוָה
  choice: ஆண்டவரின் ஆலயம்
  rationale: இங்கு ‘வீடு’ என்பது வழிபாட்டு ஆலயத்தைக் குறிக்கிறது; יהוה என்ற தெய்வீகப் பெயரைத் தமிழ் வேதாகம நடையில் மரியாதையுடன் ‘ஆண்டவர்’ என வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: தமிழில் இயல்பாகவும் மரியாதையுடனும் வாசிக்கப்படும் பிரதிநிதிப் பெயரைப் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பு மறுகட்டமைப்பை வசனத்துக்குள் திணிக்கவில்லை.
- issue: וַיָּצֻרוּ என்ற செயலின் துல்லியம்
  choice: வெள்ளியைக் கட்டினர்
  alternative: வெள்ளியைப் பைகளில் போட்டனர்
  rationale: மூலத்தில் பைகள் வெளிப்படையாகக் குறிப்பிடப்படாததால், கட்டுதல் என்ற செயலை மட்டும் மொழிபெயர்த்து வரலாற்றுச் செயல்முறையை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளது. ‘காணும்போதெல்லாம்’ என்பது நிகழ்வு திரும்பத் திரும்ப நடந்ததைக் காட்டும் כראותם என்ற கட்டமைப்பை இயல்பாக வெளிப்படுத்துகிறது; ‘மேலே வந்து’ என்பது ויעל என்பதன் திசைநுட்பத்தைக் காக்கிறது.
