  text: בִּ/שְׁנַת שֶׁ֤בַע לְ/יֵהוּא֙ מָלַ֣ךְ יְהוֹאָ֔שׁ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: ta
  text: யெகூவின் ஆட்சியின் ஏழாம் ஆண்டில் யெஹோவாஷ் அரசனானான். அவன் எருசலேமில் நாற்பது ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் சிபியா; அவள் பெயெர்செபாவைச் சேர்ந்தவள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: யெகூவின் ஆட்சியின் ஏழாம் ஆண்டில்
  rationale: இது அரசரின் ஆட்சியாண்டைக் கொண்டு காலத்தைக் குறிக்கும் வழக்கமான எபிரெய அரசாட்சி வாய்பாடு. இயல்பான தமிழில் காலக்குறிப்பைத் தெளிவாகத் தருகிறது.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: யோவாஸ் அரசனானான்
  rationale: இங்கு מָלַךְ அரசாட்சியின் தொடக்கத்தைக் குறிக்கும் தொடக்கநிலைப் பொருளில் வருகிறது; பின்னர் கூறப்படும் ஆட்சிக்காலத்திலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: அவன் நாற்பது ஆண்டுகள் ஆட்சி செய்தான்
  rationale: இங்கு வினைச்சொல் ஆட்சியின் காலநீட்சியைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஆட்சி செய்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בְּ முன்னிடைச்சொல்லின் நேரடியான இடப்பொருளைப் பாதுகாக்கிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: தாயின் அடையாளத்தைச் சொல்லும் எபிரெய அறிவிப்பை இயல்பான தமிழ் சொல் வரிசையில் வழங்குகிறது.
- source_word: צִבְיָה
  choice: சிபியா
  rationale: எபிரெயப் பெயரான Ṣibyāh-ஐ அதன் மெய்யொலிகளுக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִבְּאֵר שָׁבַע
  choice: அவள் பெயெர்செபாவைச் சேர்ந்தவள்
  rationale: מִן இங்கு பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது; ‘சேர்ந்தவள்’ என்பது நபரின் ஊர்த் தோற்றத்தைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
