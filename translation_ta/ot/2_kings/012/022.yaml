base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: ta
  text: சிமியாத்தின் மகன் யோசாபாத்தும், சோமேரின் மகன் யெகோசாபாத்தும் ஆகிய அவனுடைய பணியாளர்கள்[a] அவனைத் தாக்கினார்கள்; அவன் இறந்தான். அவர்கள் அவனைத் தாவீதின் நகரத்தில் அவனுடைய முன்னோர்களோடு அடக்கம் செய்தார்கள். அவனுக்குப் பதிலாக அவனுடைய மகன் அமத்சியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரிகள்.” எபிரேயச் சொல் சூழலுக்கேற்ப பணியாளர்களையோ அரசவை அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: சிமெயாத்தின் மகன் யோசாபாத்
  rationale: எபிரேயப் பெயர்களின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்ததுடன், בֶּן என்ற மரபுவழிக் குறிப்பை ‘மகன்’ எனத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: சோமேரின் மகன் யெகோசாபாத்
  rationale: இரண்டாவது நபரின் பெயரையும் தந்தையின் பெயரையும் எபிரேய வடிவங்களுக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עֶבֶד என்பது பணியாளர், ஊழியர் அல்லது அரசவை அதிகாரி எனச் சூழலுக்கேற்ப பொருள்படலாம். இங்கு அரண்மனைச் சூழலுக்கு ஏற்ற பொதுவான சொல்லாக ‘பணியாளர்கள்’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: அவனைத் தாக்கினார்கள்; அவன் இறந்தான்
  rationale: נכה என்பதன் ‘தாக்கு/அடி’ என்ற வன்முறைப் பொருளையும், அதைத் தொடர்ந்து தனியே வரும் ‘அவன் இறந்தான்’ என்ற எபிரேய நிகழ்வுத் தொடரையும் ஒன்றாகக் கலந்து விடாமல் காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: அவனுடைய முன்னோர்களோடு
  rationale: சொல்லுக்கு சொல் ‘தந்தையர்களோடு’ என்பதைவிட, அரச வம்சத்தின் முற்பிதாக்களோடு அடக்கம் செய்யப்பட்டதைக் குறிக்கும் எபிரேய மரபுத்தொடரை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இது வரலாற்று நூல்களில் வரும் நிலையான இடப்பெயர்; தமிழிலும் தெளிவான உடைமைத் தொடராக வழங்கப்படுகிறது.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அவனுடைய மகன் அமத்சியா அரசனானான்
  rationale: מלך என்பதன் அரசப் பதவியேற்பு நுணுக்கத்தை இச்சூழலில் ‘அரசனானான்’ என இயல்பாகத் தெரிவித்து, תחתיו என்பதையும் ‘அவனுக்குப் பதிலாக’ என வெளிப்படையாகக் காக்கிறது.
