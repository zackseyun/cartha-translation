source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: ta
  text: யெஹோவாஷ், ஆசாரியனாகிய யெஹோயாதா அவனுக்கு அறிவுரை வழங்கிய நாட்களிலெல்லாம்[a], யாவேயின் பார்வையில் நேர்மையானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “ஆசாரியனாகிய யெஹோயாதா அவனுக்குப் போதித்த அவனுடைய நாட்களெல்லாம்.” இதை, “யெஹோயாதா அவனுக்குப் போதித்த காலமெல்லாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: אֲשֶׁר தொடங்கும் தொடர்புத் தொடர் ‘அவனுடைய நாட்களெல்லாம்’ என்பதைக் காலரீதியாக வரையறுக்கிறது; காரண உறவைச் சேர்க்காமல் தொடரமைப்பின் நுணுக்கத்தை விளக்குகிறது.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: நேர்மையானதைச் செய்தான்
  rationale: ‘செய்தான்’ என்பதுடன் பெயர்ச்சொல் போன்று வரும் ‘நேர்மையானது’ என்பதை இணைப்பது, அரசனின் நடத்தையை மதிப்பிடும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: எபிரெய மொழியின் ‘கண்களில்’ என்ற மதிப்பீட்டு உருவகத்தை, தமிழில் இயல்பாகவும் அதன் கருத்துருவைத் தக்கவைத்தும் ‘பார்வையில்’ என்று வழங்குகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: כָּל יָמָיו אֲשֶׁר הוֹרָהוּ
  choice: தனக்கு அறிவுரை வழங்கிய நாட்களிலெல்லாம்
  rationale: אֲשֶׁר தொடங்கும் தொடர்புச் சொற்றொடரை ‘நாட்கள்’ என்பதோடு இணைத்து, யெகோயாதாவின் வழிகாட்டுதல் நீடித்த காலத்தைச் சுட்டுகிறது. இதனால் யெகோவாசு வாழ்நாள் முழுவதும் மாறாதவனாக இருந்தான் என்று தேவையின்றி வலியுறுத்தப்படவில்லை.
- source_word: הוֹרָהוּ
  choice: தனக்கு அறிவுரை வழங்கிய
  rationale: ירה வினையின் ஹிப்இல் வடிவம் இங்கு போதித்தல், அறிவுறுத்தல், வழிகாட்டுதல் ஆகிய கருத்துகளை உடையது. ‘அறிவுரை வழங்கிய’ என்பது யெகோயாதாவின் வழிகாட்டும் பங்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: ஆசாரியனாகிய யெகோயாதா
  rationale: பெயருக்குப் பின் வரும் பதவியை இயல்பான தமிழ் அடைமொழித் தொடராக வழங்குகிறது.
theological_decisions:
- issue: யெகோவாசின் நேர்மைக்குரிய கால வரம்பு
  choice: யெகோயாதா அறிவுரை வழங்கிய நாட்களிலெல்லாம் என்று கால வரம்புடன் வாசித்தல்
  alternative: யெகோவாசு தன் வாழ்நாளெல்லாம் நேர்மையானதைச் செய்தான்; அதற்குக் காரணம் யெகோயாதாவின் அறிவுரை என்று வாசித்தல்
  rationale: אֲשֶׁר הוֹרָהוּ என்ற தொடர்புச் சொற்றொடர் உடனடியாக வரும் ‘அவனுடைய நாட்களெல்லாம்’ என்பதை வரையறுக்க இயலும். இவ்வாசிப்பு மூலமொழிச் தொடரமைப்பையும் பிற்காலக் கதை உருவாக்கும் இறையியல் பதற்றத்தையும் காக்கிறது; இருப்பினும் காரணவியல் வாசிப்பும் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதும் மதிப்புமிக்கதுமான நடையைப் பயன்படுத்துகிறது. அரசரின் பெயர் ‘யெகோவாசு’, ஆசாரியரின் பெயர் ‘யெகோயாதா’, தெய்வீகப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தின் காலத் தொடர்பிலுள்ள தெளிவின்மை அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
