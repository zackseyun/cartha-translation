source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: ta
  text: ஆனால், யாவேயின் ஆலயத்துக்குக் கொண்டுவரப்பட்ட பணத்திலிருந்து, யாவேயின் ஆலயத்திற்காக வெள்ளிக் கிண்ணங்களோ[a], விளக்குத் திரிகளைச் சீராக்கும் கருவிகளோ[b], தெளிப்புக் கிண்ணங்களோ[c], எக்காளங்களோ, தங்கத்தாலான எந்தப் பாத்திரமோ வெள்ளியாலான எந்தப் பாத்திரமோ செய்யப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளிப் பாத்திரங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திரி வெட்டும் கருவிகள்’ அல்லது ‘திரி அணைக்கும் கருவிகள்.’ எபிரெயச் சொல் விளக்குகளைப் பராமரிக்கப் பயன்படுத்திய ஒரு கருவியைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது எளிமையாக, ‘கிண்ணங்கள்.’ விரிவான மொழிபெயர்ப்பு அவற்றின் சாத்தியமான சடங்குப் பயன்பாட்டை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்துடன் உள்ள முரண்பாட்டை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יֵעָשֶׂה
  choice: செய்யப்படவில்லை
  rationale: நிஃபால் வினைவடிவின் செயப்பாட்டு மற்றும் ஆளற்ற கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: இது வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் முறையான சொல்லாட்சி; ‘ஆலயம்’ நவீனத் தமிழில் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: סִפּוֹת כֶּסֶף
  choice: வெள்ளிக் கிண்ணங்கள்
  rationale: סִפּוֹת என்பது கிண்ணங்கள் அல்லது பாத்திரங்களைக் குறிக்கிறது; பின்னர் வரும் மִזְרָקוֹת என்பதிலிருந்து வேறுபடுத்த ‘கிண்ணங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְזַמְּרוֹת
  choice: விளக்குத் திரிகளைச் சீராக்கும் கருவிகள்
  rationale: ஆலயப் பயன்பாட்டில் இச்சொல் விளக்குத் திரிகளைப் பராமரிக்கும் கருவிகளைக் குறித்திருக்கலாம்; தமிழில் அதன் சாத்தியமான பயன்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: מִזְרָקוֹת
  choice: தெளிப்புக் கிண்ணங்கள்
  rationale: பலிச் சடங்கில் திரவத்தைத் தெளிக்க அல்லது வீசப் பயன்படுத்தப்பட்டிருக்கக்கூடிய கிண்ணங்களின் சடங்குசார் பணியை வெளிப்படுத்துகிறது.
- source_word: חֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: ஆலய வழிபாட்டில் பயன்படுத்தப்பட்ட உலோக ஊதுகருவிகளுக்கான நிலையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: தங்கத்தாலான எந்தப் பாத்திரமோ வெள்ளியாலான எந்தப் பாத்திரமோ
  rationale: כְּלִי என்பதன் பரந்த பொருளையும், எபிரெயத்தின் தனித்தனியான பகிர்வுப் பொருளையும் பாதுகாக்கிறது.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: கொண்டுவரப்பட்ட பணத்திலிருந்து
  rationale: இந்நிர்வாகச் சூழலில் כֶּסֶף என்பது வெள்ளி உலோகத்தைவிட நிதி அல்லது பணத்தைக் குறிக்கிறது; செயப்பாட்டு வினையெச்சமும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழொலியில் வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தில் ‘யாவேயின் ஆலயம்’ இருமுறை வருவது நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது. அரிய ஆலயக் கருவிகளின் பெயர்கள் புரியும்படி மொழிபெயர்க்கப்பட்டாலும், அவற்றின் நிச்சயமற்ற பொருள் அடிக்குறிப்புகளில் திறந்தவாறே வைக்கப்பட்டுள்ளது.
