- from: ஆசாரியர்கள் ஒவ்வொருவரும் தமக்குத் தெரிந்தவரிடமிருந்து[a] பணத்தைப் பெற்றுக்கொள்ளட்டும்; ஆலயத்தில்[b] சேதம் காணப்படும் இடமெல்லாம் அவர்களே அதைச் சீரமைக்கட்டும்.
  to: ஆசாரியர்கள் ஒவ்வொருவரும் தமக்குத் தெரிந்தவரிடமிருந்து[a] பெற்றுக்கொள்ளட்டும்; ஆலயத்தின் சேதங்களை, அங்கே எங்கெல்லாம் சேதம் காணப்படுகிறதோ, அவர்களே சீரமைக்கட்டும்.[b]
  rationale: The revision removes the unexpressed 'money,' preserves the directive and distributive sense, directly renders the temple's damage as the object of repair, and retains the lexical uncertainty of מַכָּרוֹ in a footnote. The temple identification remains appropriately noted because the Hebrew literally says 'the house.'
