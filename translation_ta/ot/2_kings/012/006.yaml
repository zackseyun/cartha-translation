base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: ta
  text: ஆசாரியர்கள் ஒவ்வொருவரும் தமக்குத் தெரிந்தவரிடமிருந்து[a] பெற்றுக்கொள்ளட்டும்; ஆலயத்தின் சேதங்களை, அங்கே எங்கெல்லாம் சேதம் காணப்படுகிறதோ, அவர்களே சீரமைக்கட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது நன்கொடையாளரிடமிருந்து.” எபிரெயச் சொல் ஒருவருக்குத் தெரிந்த அல்லது அவருடன் தொடர்புடைய நபரைக் குறிக்கலாம்; இச்சூழலில் காணிக்கை கொடுத்தவரையும் குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆலயம்” என்பதற்கு எபிரெய மூலத்தில் சொற்படியாக “வீடு” என்று உள்ளது; அது யெகோவாவின் ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם
  choice: பணத்தைப் பெற்றுக்கொள்ளட்டும்
  rationale: יִקְחוּ என்பதன் கட்டளைத் தன்மையை ‘பெற்றுக்கொள்ளட்டும்’ வெளிப்படுத்துகிறது. வசனச் சூழலில் பெறப்படுவது காணிக்கைப் பணம் என்பதால், இயல்பான தமிழுக்காக ‘பணத்தை’ வெளிப்படையாகச் சேர்த்துள்ளது; לָהֶם-இன் தமக்கெனப் பெறும் பொருளும் வினையில் அடங்குகிறது.
- source_word: הַכֹּהֲנִים אִישׁ
  choice: ஆசாரியர்கள் ஒவ்வொருவரும்
  rationale: אִישׁ இங்கு பன்மை எழுவாயைப் பகிர்ந்தளிக்கும் வகையில் ‘ஒவ்வொருவரும்’ எனக் குறிக்கிறது.
- source_word: מֵאֵת מַכָּרוֹ
  choice: தமக்குத் தெரிந்தவரிடமிருந்து
  rationale: מַכָּר என்பதன் அடிப்படைப் பொருளான அறிமுகமான அல்லது தெரிந்த நபர் என்பதைக் காக்கிறது; அவரை நேரடியாக ‘நன்கொடையாளர்’ என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וְהֵם יְחַזְּקוּ
  choice: அவர்களே அதைச் சீரமைக்கட்டும்
  rationale: וְהֵם-இன் வலியுறுத்தலை ‘அவர்களே’ காக்கிறது. יְחַזְּקוּ என்பதன் சொற்பொருள் ‘பலப்படுத்துதல்’; கட்டடப் பராமரிப்புச் சூழலில் ‘சீரமைத்தல்’ இயல்பான பொருள்.
- source_word: בֶּדֶק הַבַּיִת
  choice: ஆலயத்தில் சேதம்
  rationale: בֶּדֶק என்பது பழுது, பிளவு அல்லது சேதமடைந்த நிலையைச் சுட்டுகிறது. הַבַּיִת சொற்படியாக ‘வீடு’ என்றாலும், இச்சூழலில் அது யெகோவாவின் ஆலயத்தைக் குறிக்கிறது.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: சேதம் காணப்படும் இடமெல்லாம்
  rationale: காணப்படும் எல்லா சேதத்தையும் இடவரம்பின்றிச் சீரமைக்க வேண்டும் என்ற தொடரின் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
