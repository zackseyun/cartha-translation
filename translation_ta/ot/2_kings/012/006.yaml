translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கட்டளைத் தன்மை ‘-ட்டும்’ வடிவாலும், ஆசாரியர்கள்மீதான வலியுறுத்தல் ‘அவர்களே’ என்பதாலும் காக்கப்பட்டுள்ளது. மַכָּר என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
