  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: ta
  text: ஆனால், வேலை செய்பவர்களுக்குக் கொடுப்பதற்காகப் பணத்தை யாருடைய பொறுப்பில் ஒப்படைத்தார்களோ, அந்த ஆண்களிடம் அவர்கள் கணக்குக் கேட்கவில்லை[a]; ஏனெனில் அவர்கள் நம்பகமாக[b] நடந்து கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆண்களுடன் அவர்கள் கணக்குத் தீர்க்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: “நம்பகமாக” என்பதை “நேர்மையாக” அல்லது “உண்மையுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: கணக்குக் கேட்கவில்லை
  rationale: பியேல் வடிவம் இச்சூழலில் ஒருவரிடம் கணக்கிடுதல் அல்லது கணக்கு ஒப்புவிக்கக் கோருதல் என்ற பொருளைத் தருகிறது. இயல்பான நவீன தமிழில் நிதிப் பொறுப்புக்கான கணக்கைக் கோராததை இச்சொற்றொடர் தெளிவாகக் கூறுகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: இங்கு ஆண்பால் பன்மையான אֲנָשִׁים குறிப்பிட்ட ஆண் பொறுப்பாளர்களைக் குறிக்கிறது; ஆகவே பாலினக் குறிப்பை மறைக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: யாருடைய பொறுப்பில் ஒப்படைத்தார்களோ
  rationale: எபிரெய மொழியின் நேரடிப் படிமம் ‘அவர்களுடைய கையில் கொடுத்தல்’ என்பதாக இருந்தாலும், அது ஒருவரின் பொறுப்பில் நிதியை ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடர். தமிழில் அதன் செயல்பாட்டு பொருள் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: הַכֶּסֶף
  choice: பணம்
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ அல்லது ‘பணம்’ என்ற இரு பொருள்கள் உள்ளன. ஆலயப் பழுதுபார்ப்புக்கான நிதி என்ற சூழலில் ‘பணம்’ பொருத்தமானது.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: வேலை செய்பவர்கள்
  rationale: பங்கேற்பு வடிவிலுள்ள இச்சொற்றொடர் பழுதுபார்க்கும் பணியில் ஈடுபட்டிருந்தவர்களைக் குறிக்கிறது. ‘வேலை செய்பவர்கள்’ மூல அமைப்பையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: בֶאֱמֻנָה
  choice: உண்மையுடன்
  rationale: இங்கு אֱמוּנָה நிதியைக் கையாளுவதில் நம்பகத்தன்மை, நேர்மை, விசுவாசமான நடத்தை ஆகியவற்றைக் குறிக்கிறது. ‘உண்மையுடன்’ அதன் பரந்த நெறிசார் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: הֵם עֹשִׂים
  choice: அவர்கள் ... செயல்பட்டார்கள்
  rationale: எபிரெயத்தில் ‘அவர்கள் செய்துகொண்டிருந்தார்கள்’ என அமைந்தாலும், இங்கு அவர்களின் நடத்தை சுருக்கிக் கூறப்படுகிறது. தமிழில் ‘செயல்பட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
