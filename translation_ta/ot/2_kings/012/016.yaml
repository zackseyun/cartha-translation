translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையில் கொடுத்தல்’ என்ற எபிரெய மரபுத்தொடரின் பொருள் ‘பொறுப்பில் ஒப்படைத்தல்’ என இயல்பாக்கப்பட்டுள்ளது; கணக்கியல் மற்றும் நம்பகத்தன்மை குறித்த மூலத்தின் நுணுக்கம் பாதுகாக்கப்பட்டுள்ளது.
