    text: அல்லது, ‘யூதா அரசர்களின் ஆண்டுப் பதிவேட்டில்.’ இதற்கான எபிரெயச் சொற்றொடர் அதிகாரப்பூர்வ அரச பதிவையோ வரலாற்று நாளேட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
