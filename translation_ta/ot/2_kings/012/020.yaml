- from: யோவாஷின் மற்ற செயல்களும், அவர் செய்த அனைத்தும், யூதா அரசர்களின் வரலாற்றுப் பதிவுகள் அடங்கிய நூலில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  to: யோவாஷின் மற்ற செயல்களும், அவர் செய்த அனைத்தும், யூதா அரசர்களின் வரலாற்றுப் பதிவேட்டில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
