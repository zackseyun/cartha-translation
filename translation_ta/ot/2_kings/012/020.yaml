source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோவாஷின் மற்ற செயல்களும், அவர் செய்த அனைத்தும், யூதா அரசர்களின் வரலாற்றுப் பதிவேட்டில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதா அரசர்களின் ஆண்டுப் பதிவேட்டில்.’ இதற்கான எபிரெயச் சொற்றொடர் அதிகாரப்பூர்வ அரச பதிவையோ வரலாற்று நாளேட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: யோவாஷின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது எஞ்சியவற்றை அல்லது மற்றவற்றைக் குறிக்கிறது; דִּבְרֵי என்பது இங்கு அரசனின் ஆட்சிச் செயல்களைச் சுட்டும் வழக்கமான அரசாட்சி-சுருக்கச் சொல்லாக்கம். ஆகவே இயல்பான தமிழில் ‘மற்ற செயல்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவர் செய்த அனைத்தும்
  rationale: כָל என்பதன் முழுமைப் பொருளையும் எபிரெய உறவுநிலை வாக்கியத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: הֲלוֹא உறுதியான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. பன்மைப் பொருளுக்கு ஏற்றவாறு தமிழிலும் வினாவடிவமும் பன்மை வினைமுற்றும் தக்கவைக்கப்பட்டன.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: வரலாற்றுப் பதிவுகள் அடங்கிய நூலில்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களின் நிகழ்வுகளின் நூல்’ என்றாலும், அரச ஆவணச் சூழலில் இது அரச வரலாற்றுப் பதிவுகள் அல்லது நாளேடுகளைக் குறிக்கிறது. ‘அடங்கிய நூல்’ என்பது עַל סֵפֶר என்பதன் சூழல்சார் இயல்பான தமிழ் வடிவம்.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின்
  rationale: לְ இங்கு அந்த ஆவணம் யூதா அரசர்களைச் சார்ந்தது என்பதைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பு இயல்பானது.
