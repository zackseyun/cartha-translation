translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. பழைய வழக்கான ‘நாளாகமப் புஸ்தகம்’ தவிர்க்கப்பட்டு, அரச ஆவணத்தின் பொருளைத் தெளிவாக்கும் ‘வரலாற்றுப் பதிவுகள் அடங்கிய நூல்’ தேர்ந்தெடுக்கப்பட்டது. எபிரெய மூலத்தின் உறுதியான பதிலை எதிர்பார்க்கும் வினா அமைப்பு பாதுகாக்கப்பட்டது.
