  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அந்தப் பணியைச் செய்கிறவர்களிடம் அதைக் கொடுத்தார்கள்; அதைக் கொண்டு அவர்கள் யாவேயின் ஆலயத்தை[a] பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்சொல்லாக, “யாவேயின் இல்லத்தை”; அதாவது, யாவேயின் ஆலயத்தை.
    reason: எபிரெய בית יהוה என்ற சொற்றொடரின் நேரடி வடிவத்தையும் அதன் சூழல்சார் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காரண இணைப்புச் சொல் பயன்படுத்தப்பட்டது.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: அந்தப் பணியைச் செய்கிறவர்களிடம்
  rationale: ‘பணியைச் செய்கிறவர்கள்’ என்ற எபிரெயப் பங்கேற்புவினை அமைப்பைப் பாதுகாக்கிறது; பாலினத்தைத் தேவையின்றிக் குறிப்பதையும் தவிர்க்கிறது.
- source_word: יִתְּנֻהוּ
  choice: அதைக் கொடுத்தார்கள்
  rationale: மூன்றாம் நபர் பன்மை எழுவாயையும் ஒருமை ஆண்பால் பொருள் பின்னொட்டையும் பிரதிபலிக்கிறது. சூழலில் வழக்கமாக அல்லது தொடர்ந்து நடந்த கடந்தகாலச் செயலைத் தமிழ் இறந்தகாலம் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְחִזְּקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: அடிப்படைப் பொருள் ‘வலுப்படுத்தினார்கள்’ என்றாலும், கட்டடச் சூழலில் சேதத்தைச் சீரமைத்து உறுதிப்படுத்துவதை இச்சொல் குறிக்கிறது; ‘பழுதுபார்த்தார்கள்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: בּוֹ
  choice: அதைக் கொண்டு
  rationale: முன்னதாகக் குறிப்பிடப்பட்ட பணத்தை அல்லது தொகையைச் சாதனமாகக் கொண்டு ஆலயத்தைப் பழுதுபார்த்தார்கள் என்ற பொருளைச் சுருக்கமாகத் தெரிவிக்கிறது; ‘பணம்’ என்பதை மூலத்தில் இல்லாமல் வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בית என்பதன் நேரடிப் பொருள் ‘வீடு/இல்லம்’; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. வாசகர்களுக்குத் தெளிவாக ‘ஆலயம்’ முதன்மை உரையில் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: וְחִזְּקוּ என்பதன் மறை எழுவாய்
  choice: ‘அவர்கள்’ என்று வைத்து மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாத்தல்
  alternative: ‘பணியாளர்கள்’ என்று எழுவாயை வெளிப்படையாக நிர்ணயித்தல்
  rationale: சூழலில் ஆலயப் பணியைச் செய்கிறவர்களே பழுதுபார்த்தார்கள் என்று புரிந்துகொள்ள முடிந்தாலும், எபிரெய உரை இரண்டாம் வினையின் எழுவாயை பெயர்ச்சொல்லால் மீண்டும் குறிப்பிடவில்லை. எனவே தமிழிலும் அதனைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அந்தப் பணி’ என்பது சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட ஆலயப் பழுதுபார்ப்புப் பணியைச் சுட்டுகிறது; மறை எழுவாய்களின் சாத்தியமான வேறுபாடு செயற்கையாகத் தீர்மானிக்கப்படவில்லை.
