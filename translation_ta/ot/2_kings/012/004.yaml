- from: ஆனால்[a] மேடைகள் அகற்றப்படவில்லை; மக்கள் இன்னும் அந்த மேடைகளில் பலியிட்டும் தூபங்காட்டியும் வந்தார்கள்.
  to: ஆயினும், உயர்ந்த வழிபாட்டு இடங்கள்[a] அகற்றப்படவில்லை; மக்கள் இன்னும் அவற்றில் பலியிட்டு, தூபங்காட்டி வந்தார்கள்.
  rationale: The revision makes the cultic meaning of בָּמוֹת clear in modern standard Tamil, while retaining a concise alternative and historical explanation in the footnote. It also relocates the footnote marker to the term under discussion. “பலியிட்டு, தூபங்காட்டி வந்தார்கள்” preserves the ongoing customary force of the participles and the force of “still.”
