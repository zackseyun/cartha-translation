  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: ta
  text: ஆயினும், உயர்ந்த வழிபாட்டு இடங்கள்[a] அகற்றப்படவில்லை; மக்கள் இன்னும் அவற்றில் பலியிட்டு, தூபங்காட்டி வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேடைகள்.” எபிரெய மொழியிலுள்ள சொல் பொதுவாக உயரமான இடங்களில் அமைந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய நேர்மறையான மதிப்பீட்டிற்கு ஒரு விதிவிலக்கை அல்லது வரம்பை அறிமுகப்படுத்தும் எதிர்மறைத் திருப்பத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: உயரமான இடங்களில் அமைந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கும் பாமோத் என்ற வரலாற்று-வழிபாட்டுச் சொல்லின் தனித்தன்மையைத் தக்கவைக்கிறது; பொருள் தெளிவுக்காக அடிக்குறிப்பு தரப்படுகிறது.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: மேடைகளே எழுவாயாக இருப்பதால், அவை தொடர்ந்து இருந்தன என்னும் எபிரெய மொழிவழக்கின் நடைமுறைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: முந்தைய மதிப்பீட்டுக்கு மாறாக வழிபாட்டுச் செயல்கள் தொடர்ந்து நடைபெற்றதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: கூட்டுப்பெயரின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: מְזַבְּחִים
  choice: பலியிட்டும்
  rationale: பங்கெச்ச வடிவம் குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான செயலைத் தமிழில் இணை வினையெச்ச அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמְקַטְּרִים
  choice: தூபங்காட்டியும்
  rationale: வழிபாட்டுச் சூழலில் קטר என்பது பொதுவாக நறுமணப்பொருளை எரித்துப் புகை எழுப்புவதைக் குறிக்கிறது; 'தூபங்காட்டு' என்பது நவீனத் தமிழில் இயல்பான வழிபாட்டுச் சொல்.
- source_word: בַּבָּמוֹת
  choice: அந்த மேடைகளில்
  rationale: வழிபாடு நடைபெற்ற இடத்தைத் தெளிவாகக் காட்டுகிறது; மீண்டும் வரும் பெயர்ச்சொல்லுடன் 'அந்த' என்பதைச் சேர்ப்பது தமிழில் இயல்பான இணைப்பை அளிக்கிறது.
theological_decisions:
- issue: மேடைகளில் நடைபெற்ற வழிபாட்டின் மதிப்பீடு
  choice: வரலாற்று-வழிபாட்டுச் சொல்லான 'மேடைகள்' என்பதை முதன்மை உரையில் வைத்திருந்து, அதன் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: '''வழிபாட்டு மேடைகள்'' அல்லது ''உள்ளூர் வழிபாட்டுத் தலங்கள்'' என்று உரையிலேயே விரித்துரைத்தல்'
  rationale: இவ்வசனம் அந்த இடங்கள் தொடர்ந்து இருந்ததையும் மக்கள் அங்கே வழிபட்டதையும் விவரிக்கிறது; அவற்றைப் பற்றிய மறைமுக விமர்சனத்தை மேலதிக இறையியல் விளக்கத்தால் தீவிரப்படுத்தாமல், மூலத்தின் வரலாற்றுச் சிறப்பையும் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. 'மேடைகள்' என்ற மரபுசார் சொல்லின் வழிபாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; தொடர்ச்சியான செயல்கள் 'பலியிட்டும் தூபங்காட்டியும் வந்தார்கள்' என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
