base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் எழுந்து சதி செய்தார்கள்; சில்லாவை நோக்கிய இறக்கத்தில் உள்ள[a] பெத்-மில்லோவில் யோவாசைத் தாக்கி வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சில்லாவுக்கு இறங்கிச் செல்லும் வழியில் உள்ள.” எபிரெயத் தொடர் சில்லாவை நோக்கி இறங்கும் பாதையையோ சரிவையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசனுக்குக் கீழ்ப்பட்டவர்களைச் சூழல் குறித்தாலும், எபிரெயச் சொல் பொதுவாக ‘ஊழியர்கள்/பணியாளர்கள்’ எனப் பொருள்படும். ‘அதிகாரிகள்’ என்று மொழிபெயர்ப்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும் என்பதால் இயல்பான பொதுச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: சதிசெய்தார்கள்
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் சேர்ந்த எபிரெய மரபுத்தொடர் சதித்திட்டம் அல்லது அரசத்துரோகச் சூழ்ச்சியைக் குறிக்கிறது. தமிழில் செயற்கையான மறுகூறலைத் தவிர்த்து அதன் முழுப் பொருள் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: נכה என்பது ‘அடி/தாக்கு’ என்ற பரந்த பொருளுடையது. சூழலில் தாக்குதல் உயிரிழப்புக்கு வழிவகுத்தாலும், இவ்வசனம் தனியாக ‘கொன்றார்கள்’ என்ற குறிப்பான வினையைப் பயன்படுத்தவில்லை; ஆகவே வன்முறையையும் அதன் விளைவையும் காட்டி, மூலத்தின் சொல்விரிவையும் காக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּית מִלֹּא
  choice: பெத்-மில்லோ
  rationale: இது இடப்பெயராகப் புரிந்துகொள்ளப்படுவதால், ‘மில்லோவின் வீடு’ என்று மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַיּוֹרֵד סִלָּא
  choice: சில்லாவுக்கு இறங்கிச் செல்லும் வழியிலிருந்த
  rationale: இறங்கும் நிலப்பரப்பு அல்லது கீழ்நோக்கிச் செல்லும் அணுகுவழியை இத்தொடர் விவரிக்கிறது. தமிழில் இயல்பாகவும் இடவியல் கருத்தைத் தெளிவாகவும் தெரிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סִלָּא
  choice: சில்லா
  rationale: இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
