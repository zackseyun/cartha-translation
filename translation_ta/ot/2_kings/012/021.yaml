  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் நிகழ்வுவரிசையையும் முக்கியக் கூறுகளையும் நன்றாகக் காக்கிறது: அரசனின் கீழ்ப்பட்டவர்கள் எழுந்து சதி செய்து, யோவாசை பெத்-மில்லோவில் தாக்கினர். ஆயினும் அடிக்குறிப்பில் ‘நிலச்சரிவு’ என்பது இயற்கையாக நிகழும் மண்/பாறைச் சரிவைக் குறிக்கும்; הַיּוֹרֵד சொல்லும் இடவியல் ‘இறக்கம்/சரிவு’ அல்லது கீழ்நோக்கிய அணுகுவழியையே குறிக்கிறது. எனவே அது தவறான நிலவியல் பொருளைச் சேர்க்கிறது.'
  naturalness: ‘சதி செய்தார்கள்’ என்பது ‘சதிசெய்தார்கள்’ என்பதைக் காட்டிலும் நவீன பொதுத்தமிழில் இயல்பான சொல் பிரிப்பாகும். ‘சில்லாவை நோக்கிய இறக்கத்தில் உள்ள பெத்-மில்லோவில்’ என்பது பெத்-மில்லோவின் இருப்பிடத்தையும் கீழ்நோக்கிய நில அமைப்பையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
