  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மொழியின் சதியைச் சுட்டும் மறுகூறல் தமிழில் செயற்கையாக ஒலிக்காதவாறு ஒரே வினைச்சொல்லால் தரப்பட்டுள்ளது. தாக்குதல் மரணத்தை ஏற்படுத்தியதாகச் சூழல் காட்டினாலும், இவ்வசனத்தின் வினைச்சொல்லைவிடக் குறிப்பாக ‘கொன்றார்கள்’ என மாற்றப்படவில்லை. அடிக்குறி [a] அது விளக்கும் இடவியல் தொடரிலேயே வைக்கப்பட்டுள்ளது.
