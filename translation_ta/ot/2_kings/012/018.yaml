translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் ‘முகத்தைத் திருப்புதல்’ என்ற உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் தீர்மானப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
