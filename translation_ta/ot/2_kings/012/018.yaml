base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: ta
  text: அப்போது அராம்[b] அரசன் ஆசகேல் படையெடுத்துச் சென்று காத் நகருக்கு எதிராகப் போரிட்டு, அதைக் கைப்பற்றினான். பின்னர் எருசலேமுக்கு எதிராகப் படையெடுத்துச் செல்லத் தன் முகத்தை அதனை நோக்கி நிலைநிறுத்தினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, எருசலேமுக்கு எதிராகப் படையெடுத்துச் செல்ல மனத்தை உறுதிப்படுத்தினான்.
    reason: lexical_alternative
  - marker: b
    text: ‘அராம்’ என்பது பாரம்பரியமாக ‘சீரியா’ என்று மொழிபெயர்க்கப்படும் எபிரெயப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர் குறியீட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעֲלֶה
  choice: படையெடுத்துச் சென்று
  rationale: עלה என்பதன் அடிப்படை ஏறிச் செல்லுதல் என்ற பொருளையும், இங்குள்ள இராணுவ முன்னேற்றச் சூழலையும் தமிழில் இயல்பாக இணைக்கிறது; வெறும் தாக்குதல் என்று சுருக்கவில்லை.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: அராம் அரசன் ஆசகேல்
  rationale: எபிரெய ethnogeographic பெயரான அராம் என்பதையும், தமிழில் நிலைபெற்றுள்ள ஆசகேல் என்ற பெயரெழுத்தாக்கத்தையும் பயன்படுத்துகிறது.
- source_word: וַיִּלָּחֶם עַל
  choice: எதிராகப் போரிட்டு
  rationale: ஒரு இடத்திற்கு எதிராகப் போர் செய்தான் என்ற இராணுவப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: גַּת
  choice: காத்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיִּלְכְּדָהּ
  choice: அதைக் கைப்பற்றினான்
  rationale: நகரை வென்று தன் கட்டுப்பாட்டுக்குள் கொண்டுவந்ததைக் குறிப்பாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: தன் முகத்தைத் திருப்பினான்
  rationale: தன்னை உறுதியாக ஒரு திசை அல்லது செயல் நோக்கித் திருப்புதல் என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அதன் உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு எதிராகப் படையெடுத்துச் செல்ல
  rationale: எருசலேமை நோக்கிய இராணுவ முன்னேற்றத்தையும் எதிர்மறை நோக்கத்தையும் வெளிப்படுத்துகிறது; அவன் நகரை உண்மையில் தாக்கிவிட்டான் என்று வசனம் சொல்வதைவிட அதிகமாகக் கூறவில்லை.
