base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: ta
  text: பாபிலோன் அரசன் அவர்களை ஆமாத் நாட்டிலுள்ள ரிப்லாவில் தாக்கி, கொன்றான்[a]. இவ்வாறு யூதா தன் நாட்டிலிருந்து நாடுகடத்தப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தாக்கினான்’ என்றும் ‘கொன்றான்’ என்றும் இரண்டு வினைச்சொற்கள் அடுத்தடுத்து வருகின்றன. இதை ‘அடித்துக் கொன்றான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூதா தன் நாட்டிலிருந்து சிறையிருப்புக்குச் சென்றது.’ எபிரெய வினை இங்கே யூதா சிறையிருப்புக்குச் சென்றதைக் கூறுகிறது; ‘நாடுகடத்தப்பட்டது’ என்பது சூழலில் உள்ள வலுக்கட்டாய வெளியேற்றத்தைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: נכה என்பது பொதுவாக ‘அடி/தாக்கு’ என்று பொருள்படும். அடுத்து ‘கொன்றுபோட்டான்’ என்ற தனி வினை வருவதால், இரண்டு எபிரெய வினைகளையும் ஒன்றாக்காமல் வைத்திருக்கிறது.
- source_word: וַיְמִיתֵם
  choice: கொன்றுபோட்டான்
  rationale: Hiphil வடிவிலுள்ள מות, ‘சாகச்செய்/கொன்றுபோடு’ என்ற காரணவினைப் பொருளைத் தருகிறது. இது தெளிவான, இயல்பான தமிழ்; ‘மரணதண்டனை நிறைவேற்றினான்’ என்பது மூலத்தைவிடச் சற்றுக் கூடுதல் சட்டப் பொருளைச் சேர்க்கும்.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בְּרִבְלָה
  choice: ரிப்லாவில்
  rationale: நிகழ்வு நடந்த இடத்தைக் குறிக்கும் இயல்பான இடவேற்றுமை வடிவம்.
- source_word: בְּאֶרֶץ חֲמָת
  choice: ஆமாத் நாட்டிலுள்ள
  rationale: ரிப்லா அமைந்துள்ள பரந்த நிலப்பகுதியைத் தெளிவாகக் காட்டுகிறது; חֲמָת என்ற பெயர் ‘ஆமாத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּגֶל
  choice: நாடுகடத்தப்பட்டது
  rationale: நாடு கடத்திச் செல்லப்பட்ட சூழலைத் தெளிவாக வெளிப்படுத்துகிறது. எபிரெய வினை வடிவத்தை ‘சிறையிருப்புக்குச் சென்றது’ என்றும் தர முடிவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: மூலத்தின் சுருக்கத்தையும், நாடு அல்லது அதன் மக்களைக் குறிக்கும் ஆகுபெயர் நுட்பத்தையும் காக்கிறது; ‘யூதா மக்கள்’ என்று விளக்கிச் சேர்க்கவில்லை.
- source_word: מֵעַל אַדְמָתוֹ
  choice: தன் நாட்டிலிருந்து
  rationale: அந்நாட்டு மக்களுக்கும் அவர்களுடைய சொந்த நிலத்துக்கும் உள்ள தொடர்பை ‘தன்’ இயல்பாகக் காட்டுகிறது. சிறையிருப்புச் சூழலில் אדמה என்பதற்கு ‘நாடு/நிலம்’ பொருத்தமானது.
theological_decisions:
- issue: யூதா என்பதன் ஆகுபெயர்ப் பொருள்
  choice: ‘யூதா’ என்ற பெயரையே வைத்தல்
  alternative: ‘யூதா மக்கள்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: மூலத்தில் நாடு, அரசியல் சமூகம், மக்கள் ஆகியவற்றுக்கிடையே உள்ள நுட்பமான ஆகுபெயர் பரப்பைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாக்கி, கொன்றுபோட்டான்’ என்பது மூலத்தின் இரண்டு வினைகளையும் காக்கிறது; ‘நாடுகடத்தப்பட்டது’ என்பது சாதாரண வாசகருக்கு வலுக்கட்டாயச் சிறைப்பிடிப்பைத் தெளிவாக உணர்த்துகிறது. இடப்பெயர்கள் பாபிலோன், ரிப்லா, ஆமாத் என வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
