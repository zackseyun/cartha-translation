base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: ta
  text: அவனுடைய ஆட்சியின் ஒன்பதாம் ஆண்டில், பத்தாம் மாதத்தின் பத்தாம் நாளில், பாபிலோன் அரசன் நேபுகாத்நேச்சார்[a] தன் படை முழுவதோடும் எருசலேமுக்கு எதிராக வந்தான். அவன் அதற்கு எதிராக முகாமிட்டான்; அவர்கள் அதைச் சுற்றிலும் முற்றுகை அரண்[b] எழுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயரை வேறு ஒலிபெயர்ப்பு மரபுகளில் ‘நேபுகாத்ரேச்சார்’ என்றும் எழுதலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லான דָּיֵק முற்றுகையின்போது ஒரு நகருக்கு எதிராக அமைக்கப்படும் படைப்பணிகளைக் குறிக்கிறது; இதை ‘முற்றுகைப் பணிகள்’ அல்லது ‘முற்றுகை மேடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி மொழிபெயர்ப்பு இன்றி காலக் குறிப்புடன் வாக்கியம் தொடங்குகிறது]'
  rationale: எபிரெயக் கதைநடையில் இது நிகழ்வுத் தொடரை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் ‘அது நடந்தது’ என்று இயந்திரத்தனமாகச் சேர்ப்பதைவிட காலக் குறிப்புடன் நேரடியாகத் தொடங்குவது இயல்பான கதைநடையைத் தருகிறது.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: அவனுடைய ஆட்சியின் ஒன்பதாம் ஆண்டு
  rationale: அரசாட்சிக் காலத்தைச் சுட்டும் வழக்கமான காலக்கணக்கு. மூலத்தில் ‘அவன்’ யார் என்பது இவ்வசனத்துக்குள் வெளிப்படையாகக் கூறப்படாததால் அந்தக் குறிப்பைத் தெளிவுபடுத்தாமல் அப்படியே பாதுகாக்கிறது.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: பத்தாம் மாதம், அந்த மாதத்தின் பத்தாம் நாளில்
  rationale: மூலத்தின் மாதத்தையும் நாளையும் நவீன நாட்காட்டிப் பெயராக மாற்றாமல் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன் நேபுகாத்நேச்சார்
  rationale: அரசப் பெயரையும் பட்டத்தையும் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: הוּא וְכָל חֵילוֹ
  choice: தன் படை முழுவதோடும்
  rationale: அரசன் தானும் முழுப் படையும் வந்தனர் என்ற உள்ளடக்கத்தை இயல்பான தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עַל יְרוּשָׁלַםִ
  choice: எருசலேமுக்கு எதிராக
  rationale: படையெடுப்பு மற்றும் முற்றுகைச் சூழலில் עַל எதிரான இராணுவ நடவடிக்கையைக் குறிக்கிறது.
- source_word: וַיִּחַן עָלֶיהָ
  choice: அதற்கு எதிராக முகாமிட்டான்
  rationale: חנה என்பதன் அடிப்படைப் பொருளான முகாமிடுதலைப் பாதுகாத்து, עַל என்பதன் பகைமைச் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: அவர்கள் அதைச் சுற்றிலும் முற்றுகை அரண் எழுப்பினார்கள்
  rationale: பன்மை வினைச்சொல்லை ‘அவர்கள்’ என்று வெளிப்படுத்துகிறது. דָּיֵק என்பது நகருக்கு எதிராக எழுப்பப்படும் முற்றுகைப் படைப்பணியைக் குறிக்கும்; ‘முற்றுகை அரண்’ தெளிவான, வாசிக்க எளிய தெரிவாகும்.
