base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: ta
  text: காவல்படைத் தலைவனான[b] நேபுசராதான் அவர்களைத் தன்னுடன் அழைத்துக்கொண்டு, ரிப்லாவில் இருந்த பாபிலோன் அரசனிடம் கொண்டுபோனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை ரிப்லாவிலிருந்த பாபிலோன் அரசன் முன் கொண்டுபோனான்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், ‘வெட்டுவோரின் தலைவன்.’ இது அரச படை அல்லது பாதுகாப்புத் துறையைச் சேர்ந்த ஓர் உயர் அதிகாரியின் பதவியாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அவர்களைத் தன்னுடன் அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொண்டான்/கொண்டுசென்றான்’ என்பதை, ஏற்கெனவே கைதிகளாக இருந்தவர்களை வலுக்கட்டாயமாகப் பிடித்தான் என்ற கூடுதல் நுண்பொருள் வராமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נְבוּזַרְאֲדָן
  choice: நேபுசராதான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவம்.
- source_word: רַב טַבָּחִים
  choice: காவல்படைத் தலைவன்
  rationale: சொல்லுக்கு நேரான வடிவம் ‘கொலையாளர்கள்/வெட்டுவோரின் தலைவன்’ என இருந்தாலும், நவ-பாபிலோனிய அரசவையில் இது படை அல்லது அரசப் பாதுகாப்பு சார்ந்த அதிகாரப் பதவியைக் குறிக்கிறது; ஆகவே பதவியின் செயல்பாட்டை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: וַיֹּלֶךְ
  choice: கொண்டுபோனான்
  rationale: הלך வினையின் காரணவினை வடிவம் இச்சூழலில் அவர்களை ஒரு குறிப்பிட்ட இடத்திலிருந்த அரசனிடம் செல்லச் செய்ததைத் தெரிவிக்கிறது; ‘கொண்டுபோனான்’ இயல்பான தமிழாக்கம்.
- source_word: עַל
  choice: அரசனிடம்
  rationale: இயக்க வினையுடன் வரும் עַל இங்கு அரசனுடைய முன்னிலைக்குக் கொண்டுசெல்லப்படுவதைக் குறிக்கிறது. தமிழில் ‘அரசனிடம்’ இயல்பாக உள்ளது; ‘அரசன் முன்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: எபிரெயக் கூட்டுப்பெயரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: רִבְלָתָה
  choice: ரிப்லாவில் இருந்த
  rationale: இடப்பெயருடன் சேர்ந்த திசை/இட இறுதியை, அரசன் ரிப்லாவில் இருந்தான் என்பதைத் தெளிவாக்கும் இடவுருபாக மொழிபெயர்க்கிறது.
