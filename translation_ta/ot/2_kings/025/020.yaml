translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நிர்வாகப் பதவியின் சொற்பொருளை முதன்மை உரையில் அசட்டையாக நேரடியாக்காமல், அதன் வரலாற்றுச் செயல்பாட்டை வழங்கி, நேரான எபிரெய வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
