  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: ta
  text: காவற்படைத் தளபதி தலைமை ஆசாரியராகிய[a] செராயாவையும், இரண்டாம் நிலை ஆசாரியராகிய செப்பனியாவையும், வாசற்படியின் காவலர்கள் மூவரையும்[b] அழைத்துக்கொண்டு போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைமை ஆசாரியர்” என்பதை “பிரதான ஆசாரியர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லளவில், “தலை/முதன்மையான ஆசாரியர்.”
    reason: lexical_alternative
  - marker: b
    text: “வாசற்படியின் காவலர்கள்” என்பதை “வாயிற்காவலர்கள்” அல்லது “கோவில் நுழைவாயிலின் காவலர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: காவற்படைத் தளபதி
  rationale: சொல்லளவில் ‘கொலையாளர்களின் தலைவர்’ எனப் பொருள்படக்கூடிய அரசவைக் பட்டம் இது; இச்சூழலில் பாபிலோனிய அரச காவற்படையின் தளபதியைக் குறிக்கும் மரபுத்தொடராக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּקַּח
  choice: பிடித்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/கொண்டுபோ’; இங்கு அதிகாரிகள் வலுக்கட்டாயமாகக் கைது செய்யப்படும் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பிடித்துக்கொண்டான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: தலைமை ஆசாரியர்
  rationale: எபிரெயில் சொல்லளவில் ‘தலை/முதன்மையான ஆசாரியர்’; பிற்காலத் தொழில்நுட்பப் பொருளை தேவையின்றி வலுப்படுத்தாமல் அவரது முதன்மை நிலையைக் காட்டுகிறது.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: இரண்டாம் நிலை ஆசாரியர்
  rationale: מִשְׁנֶה குறிக்கும் இரண்டாம் நிலை அல்லது துணை அதிகாரியின் பொருளைத் தெளிவாகவும், ‘துணை ஆசாரியர்’ என மட்டும் தீர்மானிக்காமல் நெருக்கமாகவும் தருகிறது.
- source_word: שֹׁמְרֵי הַסַּף
  choice: வாசற்படியின் காவலர்கள்
  rationale: எபிரெயின் ‘வாசற்படியைக் காப்பவர்கள்’ என்ற திடமான படிமத்தைப் பாதுகாக்கிறது; கோவில் நுழைவாயில் காவலர்கள் என்பது சூழல்சார் விளக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁלֹשֶׁת
  choice: மூவர்
  rationale: மனிதர்களைக் குறிக்கும் எண்ணிக்கையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: צְפַנְיָהוּ
  choice: செப்பனியா
  rationale: எபிரெயப் பெயரின் ஒலிப்பையும் தமிழில் அறியப்பட்ட வடிவத்தையும் கருத்தில் கொண்ட எழுத்துப்பெயர்ப்பு.
