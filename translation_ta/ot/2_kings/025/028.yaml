  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: ta
  text: அவன் யோயாக்கீனிடம் கனிவாகப் பேசி[a], பாபிலோனில் யோயாக்கீனுடன் இருந்த அரசர்களின் அரியணைகளுக்கு மேலாக யோயாக்கீனுடைய அரியணையை அமைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “அவனுடன் நல்லவற்றைப் பேசினான்”; இது அவனிடம் சாதகமாக அல்லது கனிவாகப் பேசியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “அரியணை” என்பதை “இருக்கை” என்றும் புரிந்துகொள்ளலாம்; பாபிலோனிலிருந்த மற்ற அரசர்களைவிட யோயாக்கீனுக்கு உயர்ந்த அந்தஸ்து வழங்கப்பட்டது என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: அவன் அவனிடம் கனிவாகப் பேசி
  rationale: எபிரெய மொழியில் சொற்பட ‘அவனுடன் நல்லவற்றைப் பேசினான்’ என இருந்தாலும், இது சாதகமாக அல்லது கனிவாகப் பேசுவதைக் குறிக்கும் மரபுத்தொடர். ‘கனிவாகப் பேசி’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: அவனுடைய அரியணையை அமைத்தான்
  rationale: כִּסֵּא என்பதுடன் வரும் נתן, இங்கு ஒரு பொருளைப் பரிசாகக் கொடுப்பதைவிட, அரச மரியாதைக்குரிய இடத்தையோ நிலையையோ ஒதுக்கி அமைப்பதைக் குறிக்கிறது.
- source_word: כִּסְאוֹ
  choice: அவனுடைய அரியணையை
  rationale: כִּסֵּא என்பது சூழலின்படி இருக்கையையும் அரியணையையும் குறிக்கலாம். இங்கு அரசர்களின் அந்தஸ்து பேசப்படுவதால் ‘அரியணை’ அதன் நேரடியான அரசச் சாயலையும் குறியீட்டுப் பொருளையும் காக்கிறது.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: அரசர்களின் அரியணைகளுக்கு மேலாக
  rationale: מֵעַל உயர்ந்த இடத்தையோ அந்தஸ்தையோ குறிக்கிறது. எபிரெய கட்டமைப்பை இயல்பான தமிழில் பன்மையாகக் கொடுத்து, மற்ற அரசர்களைவிட மேலான மரியாதை வழங்கப்பட்டதை வெளிப்படுத்துகிறது.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: தன்னுடன் இருந்த அரசர்கள்
  rationale: இந்தச் சார்பு வாக்கியம் பாபிலோனிய அரசனுடன் இருந்த பிற அரசர்களைக் குறிக்கிறது. ‘தன்னுடன்’ என்பது வாக்கிய எழுவாயுடனான தொடர்பை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: בְּבָבֶל
  choice: பாபிலோனில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டுக்கான வழக்கமான, நேரடியான தமிழாக்கம்.
