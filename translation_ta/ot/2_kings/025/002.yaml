base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/002.yaml
  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: ta
  text: இவ்வாறு, சிதேக்கியா அரசனுடைய பதினொன்றாம் ஆண்டுவரை அந்த நகரம் முற்றுகையில் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “அந்த நகரம் முற்றுகைக்குள் வந்தது”; இது நகரம் முற்றுகையிடப்பட்ட நிலையில் இருந்ததைக் குறிக்கும் எபிரேய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: இருந்தது
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வந்தது’ என்றாலும், இங்கு ‘நகரம் முற்றுகைக்குள் வந்தது’ என்பது விளைவுநிலையைக் குறிக்கும் எபிரேய மரபுத்தொடர். தமிழில் ‘முற்றுகையில் இருந்தது’ என்பது அந்தத் தொடர்நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָעִיר
  choice: அந்த நகரம்
  rationale: முன்னரே குறிப்பிடப்பட்ட நகரத்தைச் சுட்டும் உருபுடன் உள்ள עִיר என்பதற்கு இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: בַּמָּצוֹר
  choice: முற்றுகையில்
  rationale: מָצוֹר என்பது முற்றுகை அல்லது முற்றுகைநிலையைக் குறிக்கிறது; ב முன்னொட்டுடன் இங்கு நகரம் முற்றுகைக்கு உட்பட்டிருந்த நிலையைக் காட்டுகிறது.
- source_word: עַד
  choice: வரை
  rationale: முற்றுகை நீடித்த காலத்தின் இறுதி எல்லையைச் சுட்டும் காலவியல் சொல்.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: பதினொன்றாம் ஆண்டு
  rationale: அரசாட்சிக் காலக் கணக்கில் வரும் எபிரேய எண்ணமைப்பு தமிழில் வரிசை எண்ணாக இயல்பாக வழங்கப்படுகிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுடைய
  rationale: அரசாட்சிக் காலத்தைச் சுட்டும் ל முன்னொட்டைத் தமிழில் உடைமைத் தொடர்பால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִדְקִיָּהוּ
  choice: சிதேக்கியா
  rationale: எபிரேயப் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
