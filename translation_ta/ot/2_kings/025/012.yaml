  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: ta
  text: ஆனால் நாட்டின் மிக ஏழைகளில் சிலரைக் காவல்படைத் தலைவர்[a], திராட்சைத்தோட்டத் தொழிலாளர்களாகவும் நிலத்தில் உழைக்கும் தொழிலாளர்களாகவும்[b] விட்டுவைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “அறுப்போரின் தலைவர்.” இச்சூழலில் இது பாபிலோனிய காவல்படையின் தலைவரைக் குறிக்கும் பதவிப்பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “உழவர்கள்” அல்லது “விவசாயத் தொழிலாளர்கள்” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அரிதானது; நிலத்தில் செய்யப்படும் வேளாண்மைப் பணியைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  choice: ஆனால் நாட்டின் மிக ஏழைகளில் சிலரை
  rationale: மִן பகுதியைக் குறிக்கும் பொருளில் வந்திருப்பதால், அந்த ஏழை மக்களில் சிலர் விடப்பட்டனர் என்பது இயல்பாக வெளிப்படுத்தப்பட்டது. முந்தைய நாடுகடத்தலுடன் உள்ள வேறுபாட்டை וּ இங்கு ‘ஆனால்’ எனக் காட்டுகிறது; דַּלַּת என்பதன் சூழல்சார் வலிமையை ‘மிக ஏழைகள்’ தக்கவைக்கிறது.
- source_word: הִשְׁאִיר
  choice: விட்டுவைத்தான்
  rationale: שׁאר என்பதன் ஹிஃபில் வடிவம் ‘மீதியாக இருக்கும்படி விடுதல்’ என்னும் பொருள் தருகிறது. நாடுகடத்தாமல் நாட்டிலேயே விட்டுச் சென்ற செயலை ‘விட்டுவைத்தான்’ தெளிவாகக் காட்டுகிறது.
- source_word: רַב טַבָּחִים
  choice: காவல்படைத் தலைவர்
  rationale: சொல்லளவில் ‘கொலையாளர்கள்/அறுப்போரின் தலைவர்’ என்ற தொடர்பு இருந்தாலும், இவ்வரசு மற்றும் இராணுவச் சூழலில் இது பாபிலோனிய காவல்படையின் தளபதியைக் குறிக்கும் பதவிப்பெயர்.
- source_word: לְכֹרְמִים
  choice: திராட்சைத்தோட்டத் தொழிலாளர்களாக
  rationale: כֹּרְמִים என்பது திராட்சைத்தோட்டத்தில் வேலைசெய்பவர்களைக் குறிக்கிறது. ‘தொழிலாளர்கள்’ என்பது இன்றைய வாசகருக்குத் தெளிவான இயல்பான சொல்.
- source_word: וּ/לְ/יֹגְבִים
  choice: நிலத்தில் உழைக்கும் தொழிலாளர்களாகவும்
  rationale: יֹגְבִים என்ற அரிதான வேளாண்மைச் சொல் நிலத்தை உழும் அல்லது பொதுவாக நிலப்பணியில் ஈடுபடும் ஆட்களைக் குறிக்கலாம். ஒரே குறிப்பிட்ட பணியைத் தீர்மானிக்காமல் அதன் பரந்த வேளாண்மைப் பொருளை மொழிபெயர்ப்பு காக்கிறது.
