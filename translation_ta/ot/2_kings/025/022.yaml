translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. தொடக்க וְ தனியாக மொழிபெயர்க்கப்படாமல், தலைப்புமாற்றம் தமிழ்ச் சொல் வரிசையால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. இடைச்செருகல் பகுதி கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது.
