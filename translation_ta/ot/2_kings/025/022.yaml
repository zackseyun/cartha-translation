base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: ta
  text: யூதா நாட்டில் எஞ்சியிருந்த மக்கள்மேல், பாபிலோன் அரசன் நேபுகாத்நேச்சார் விட்டுவைத்திருந்தவர்கள்மேல், சாப்பானின் மகனான அகீக்காமின் மகன் கெதலியாவை அவன் நியமித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַנִּשְׁאָר
  choice: எஞ்சியிருந்த மக்கள்
  rationale: நிபால் பங்கேற்புவினை, நாடுகடத்தல்களுக்குப் பின் யூதாவில் தொடர்ந்து இருந்த அல்லது விட்டுவைக்கப்பட்ட மக்களைக் குறிக்கிறது. இறையியல் சிறப்புப் பொருள் ஏற்றக்கூடிய ‘மீதியானோர்’ என்பதைத் தவிர்த்து, வரலாற்று விளக்கமாக இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: யூதா நாட்டில்
  rationale: אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: விட்டுவைத்திருந்தவர்களை
  rationale: שׁאר என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், முன்னதாக நிகழ்ந்த செயலைக் குறிக்கும் கதைத் தொடரையும் வெளிப்படுத்துகிறது.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன் நேபுகாத்நேச்சார்
  rationale: அரசப் பட்டத்தையும் பெயரையும் தெளிவான, வழக்கமான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: அவனுடைய பொறுப்பில் ஒப்படைத்தான்
  rationale: நிர்வாகப் பின்னணியில் פקד + עַל என்பது ஒருவரை மக்களுக்குப் பொறுப்பாளராக நியமிப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் அதிகாரப்பூர்வப் பொருளுடனும் தரப்பட்டுள்ளது.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: சாப்பானின் மகன் அகீக்காமின் மகனான கெதலியா
  rationale: எபிரெய மரபுவழிப் பெயர்த் தொடரைத் தமிழின் இயல்பான உறவுமுறைச் சொல் வரிசையில், வரலாற்றுத் துல்லியத்துடன் வழங்குகிறது.
