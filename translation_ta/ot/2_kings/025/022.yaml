revisions:
- from: யூதா நாட்டில் எஞ்சியிருந்த[a] மக்களை—அதாவது பாபிலோன் அரசன் நேபுகாத்நேச்சார் விட்டுவைத்திருந்தவர்களை—சாப்பானின் மகன் அகீக்காமின் மகனான கெதலியாவின் பொறுப்பில் அவன் ஒப்படைத்தான்.
  to: யூதா நாட்டில் எஞ்சியிருந்த மக்கள்மேல், பாபிலோன் அரசன் நேபுகாத்நேச்சார் விட்டுவைத்திருந்தவர்கள்மேல், சாப்பானின் மகனான அகீக்காமின் மகன் கெதலியாவை அவன் நியமித்தான்.
  rationale: 'The revision restores the source construction: Nebuchadnezzar is the understood subject, Gedaliah is the person appointed, and the remaining people are those over whom he is appointed. The footnote is retained because it appropriately preserves the lexical nuance of the Hebrew participle.'
  reviewer_model: gpt-5.6-terra
