  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: ta
  text: 'படைப்பிரிவுகளின் தலைவர்கள் அனைவரும், அவர்களும் அவர்களுடைய ஆட்களும், பாபிலோன் அரசன் கெதலியாவை நியமித்தான்[a] என்று கேள்விப்பட்டபோது, அவர்கள் மிஸ்பாவில் இருந்த கெதலியாவிடம் வந்தார்கள்: நெத்தனியாவின் மகன் இஸ்மவேல், கரேயாவின் மகன் யோகனான், நெத்தோபாத்தியனான தன்கூமேத்தின் மகன் செராயா, மாகாத்தியனின் மகன் யாசனியா ஆகியோர் அவர்களுடைய ஆட்களோடு வந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெதலியாவைப் பொறுப்பில் வைத்தான்.” எபிரெய வினை ஒருவரைக் கண்காணிப்பு அல்லது நிர்வாகப் பொறுப்பில் நியமிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: படைத்தலைவர்கள்
  rationale: שָׂרֵי என்பது தலைவர்களையும் அதிகாரிகளையும், הַחֲיָלִים என்பது இச்சூழலில் படைப்பிரிவுகளையும் குறிக்கிறது. குறிப்பிட்ட இராணுவப் பதவியை ஊகிக்காமல் இயல்பான தமிழில் இராணுவத் தலைமையைத் தெரிவிக்கிறது.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: அவர்களும் அவர்களுடைய ஆட்களும்
  rationale: தலைவர்களையும் அவர்களோடு இணைந்திருந்த ஆட்களையும் வேறுபடுத்தும் மீளுரைத்த, வலியுறுத்தும் அமைப்பைத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: הִפְקִיד
  choice: அதிகாரியாக நியமித்திருக்கிறான்
  rationale: இந்த வினை ஒருவரைக் கண்காணிப்பு அல்லது நிர்வாகப் பொறுப்பில் அமர்த்துவதைக் குறிக்கிறது. ‘ஆளுநராக்கினான்’ என்று அலுவலை மிகையாகக் குறிப்பாக்காமல், நியமனத்தையும் அதிகாரப் பொறுப்பையும் தெரிவிக்கிறது.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: மிஸ்பாவில் இருந்த கெதலியாவிடம்
  rationale: மிஸ்பா என்பது கெதலியாவின் இருப்பிடத்தைக் குறிப்பதால், தமிழில் இயல்பாக இடத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: הַנְּטֹפָתִי
  choice: நெத்தோபாத்தியனான
  rationale: நெத்தோபாவுடனான இன அல்லது புவியியல் அடையாளத்தை விளக்கவுரையாகச் சமப்படுத்தாமல் பெயர்ப்பெயராகப் பாதுகாக்கிறது.
- source_word: הַמַּעֲכָתִי
  choice: மாகாத்தியனின்
  rationale: எபிரெய வடிவம் இங்கு யாசனியாவின் தந்தையை மாகாவுடன் தொடர்புபடுத்தும் அடையாளமாக வருவதால், அந்தப் புவியியல் அல்லது இனச் சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: வந்தார்கள். அவர்கள் ... ஆகியோரும் ... ஆவர்
  rationale: பெயரிடப்பட்டவர்கள் முன்னர் குறிப்பிடப்பட்ட படைத்தலைவர்களுக்கு விளக்கமாக நிற்கும் எபிரெய அமைப்பைத் தெளிவான நவீனத் தமிழ் வாக்கியங்களாக வழங்குகிறது.
- source_word: וְאַנְשֵׁיהֶם
  choice: அவர்களுடைய ஆட்களும்
  rationale: பெயரிடப்பட்ட தலைவர்களுடன் அவர்களுடைய ஆட்களும் வந்தார்கள் என்பதை மூலத்தின் நிறைவு சொற்றொடருக்கு ஏற்ப காக்கிறது.
