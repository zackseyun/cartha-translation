lexical_decisions:
- source_word: חוֹמֹת
  choice: மதில்கள்
  rationale: நகரைச் சுற்றிய அரண் மதில்களைக் குறிக்கும் பன்மைச் சொல்; இராணுவச் சூழலில் ‘மதில்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: நகரைச் சுற்றியிருந்த மதில்களின் முழுச் சுற்றளவையும் குறிக்கும் இயல்பான தமிழ் வினையடை.
- source_word: נָתְצוּ
  choice: இடித்துத் தள்ளியது
  rationale: கட்டுமானத்தைத் தகர்த்து வீழ்த்தும் செயலைத் தெளிவாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: כָּל חֵיל
  choice: படை முழுவதும்
  rationale: כָּל என்பது கூட்டு ஒருமையான חֵיל முழுவதையும் அளவிடுகிறது; தமிழ் சொற்றொடரில் ‘படை முழுவதும்’ இயல்பானது.
- source_word: כַּשְׂדִּים
  choice: கல்தேயரின்
  rationale: எபிரெய இனப்பெயரை நேரடியாகப் பாதுகாக்கிறது; ‘பாபிலோனியர்’ எனச் சூழல்படுத்தி மாற்றவில்லை.
- source_word: אֲשֶׁר
  choice: உடன் இருந்த
  rationale: தலைப்புக்குரிய அதிகாரியுடன் படை கொண்டிருந்த தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கட்டளை அமைப்பைத் தேவையின்றி மிகுதியாக விளக்கவில்லை.
- source_word: רַב טַבָּחִים
  choice: காவலர் தலைவன்
  rationale: அரச காவல் மற்றும் தண்டனை நிறைவேற்றும் பொறுப்புடைய உயரதிகாரியின் பட்டத்துக்குப் பொருத்தமான, வாசிக்க எளிய சூழல்சார் மொழிபெயர்ப்பு.
