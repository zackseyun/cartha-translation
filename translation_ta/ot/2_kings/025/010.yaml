translation:
  language: ta
  text: காவற்படைத் தலைவனுடன் இருந்த கல்தேயரின் முழுப் படையும் எருசலேமைச் சுற்றியிருந்த மதில்கள் அனைத்தையும் இடித்துத் தள்ளியது.[a]
  philosophy: optimal-equivalence
  footnotes:
