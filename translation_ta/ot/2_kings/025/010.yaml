  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய வாக்கியத்தில் வினை முதலில் வந்தாலும், இயல்பான தமிழ் சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
