    text: எபிரெயப் பட்டமான ‘ரப்-தப்பாஹீம்’ என்பதற்கு ‘மரணதண்டனை நிறைவேற்றுவோரின் தலைவன்’ அல்லது ‘மெய்க்காவலர் தலைவன்’ என்றும் மொழிபெயர்க்கலாம்.
