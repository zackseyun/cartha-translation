base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: ta
  text: யூதாவின் அரசனான யோயாக்கீன் நாடுகடத்தப்பட்ட முப்பத்தேழாம் ஆண்டில், பன்னிரண்டாம் மாதத்தின் இருபத்தேழாம் நாளில், பாபிலோன் அரசனான ஏவில்-மெரோதாக், தனது ஆட்சியாண்டில்,[a] யூதாவின் அரசனான யோயாக்கீனைச் சிறையிலிருந்து வெளியேற்றி, அவரது தலையை உயர்த்தினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனது ஆட்சியாண்டில்” என்பது “தனது ஆட்சியின் முதலாம் ஆண்டில்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “தலையை உயர்த்தினான்” என்பது யோயாக்கீனுக்குத் தயவு காட்டி அவரது நிலையை உயர்த்தியதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இச்சூழலில் அது அவரைச் சிறையிலிருந்து விடுவித்ததையும் உள்ளடக்குகிறது. ஏவில்-மெரோதாக் வரலாற்றில் அமேல்-மர்துக் என்றும் அறியப்படுகிறார்.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: (தமிழ் வாக்கிய அமைப்பில் தனியே மொழிபெயர்க்கப்படவில்லை)
  rationale: இது புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடரமைப்பு. தமிழில் இயல்பான காலக் குறிப்புடன் நேரடியாக நிகழ்வைச் சொல்வது அதே உரையாடல் செயல்பாட்டை வழங்குகிறது.
- source_word: לְגָלוּת
  choice: நாடுகடத்தப்பட்ட
  rationale: גָּלוּת என்பது நாடுகடத்தல் அல்லது அதனால் ஏற்பட்ட அயல்நாட்டு வாழ்நிலையைக் குறிக்கிறது. இங்கு யோயாக்கீனை மையப்படுத்தும் தமிழ் வடிவம் இயல்பாக உள்ளது.
- source_word: יְהוֹיָכִין
  choice: யோயாக்கீன்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் தெளிவான எழுத்துப்பெயர்ப்பு.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: பன்னிரண்டாம் மாதம்
  rationale: எபிரெயத் தேதிக் குறிப்பின் இயல்பான தமிழ் இணை.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: அந்த மாதத்தின் இருபத்தேழாம் நாளில்
  rationale: மூலத்தின் தேதியை முழுமையாகவும் தெளிவாகவும் தருகிறது.
- source_word: אֱוִיל מְרֹדַךְ
  choice: ஏவில்-மெரொதாகு
  rationale: எபிரெய வேதாகமப் பெயரின் ஒலியைத் தொடர்ந்து தமிழில் எழுத்துப்பெயர்க்கப்பட்டது; வரலாற்றில் அறியப்படும் அக்காதிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: தான் அரசனான ஆண்டில்
  rationale: சொற்றொடர் அவரது ஆட்சியேற்ற ஆண்டைக் குறிக்கலாம்; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத ‘முதலாம்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: தலையை உயர்த்தினான்
  rationale: எபிரெய மரபுத்தொடரின் உருவகத்தையும் அதன் திட்டமிட்ட பலபொருள் வாய்ப்பையும் பாதுகாக்கிறது; சூழலில் அது ஆதரவு காட்டி நிலையுயர்த்துவதையும் சிறையிலிருந்து விடுவிப்பதையும் குறிக்கிறது.
- source_word: מִבֵּית כֶּלֶא
  choice: சிறையிலிருந்த
  rationale: ‘சிறை வீட்டிலிருந்து’ என்ற சொற்சொற் வடிவத்தைவிட இயல்பான தமிழ்; விடுதலை நிகழ்ந்த இடத்தையும் நிலையையும் தெளிவாகக் காட்டுகிறது.
