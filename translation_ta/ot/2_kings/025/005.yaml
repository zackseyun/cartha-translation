  register: நவீனத் தரத் தமிழில், கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கல்தேயர்’ என்ற மூலப் பெயர் தக்கவைக்கப்பட்டு, வாசகருக்கு எளிதான ‘பாபிலோனியர்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
