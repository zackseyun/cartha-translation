base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: ta
  text: ஆனால் கல்தேயரின் படை[a] அரசனைத் துரத்திச் சென்று, எரிகோவின் சமவெளிகளில்[b] அவனை எட்டிப்பிடித்தனர்; அவனுடைய படையினர் அனைவரும் அவனைவிட்டு சிதறிப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாபிலோனியரின் படை.’ எபிரெய மொழியில் ‘கல்தேயர்’ என்று உள்ளது; இச்சூழலில் இப்பெயர் பாபிலோனியப் படைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எரிகோவின் புல்நிலங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: கல்தேயரின் படை
  rationale: חֵיל என்பது இப்போர் வருணனையில் ‘படை’ எனப் பொருள்படும்; כַּשְׂדִּים என்பதன் நேரடியான இன-அரசியல் பெயரான ‘கல்தேயர்’ தக்கவைக்கப்படுகிறது.
- source_word: וַיִּרְדְּפוּ ... אַחַר הַמֶּלֶךְ
  choice: அரசனைத் துரத்திச் சென்று
  rationale: רדף + אחר என்பது அரசனைப் பின்தொடர்ந்து விரட்டிய செயலைக் குறிக்கிறது; தமிழில் ‘துரத்திச் சென்று’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: அவனைப் பிடித்தது
  rationale: נשׂג இச்சூழலில் துரத்திச் சென்று எட்டிப்பிடித்தலைக் குறிக்கிறது. ‘பிடித்தது’ இயல்பான தமிழில் விளைவைத் தெளிவாகக் கூறுகிறது; ‘அவனை எட்டியது’ என்பதைவிடச் சூழலுக்கு ஏற்றது.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: எரிகோவின் சமவெளிகளில்
  rationale: עֲרָבוֹת என்பது பள்ளத்தாக்கு சார்ந்த திறந்த சமவெளி அல்லது புல்வெளிப் பகுதியைக் குறிக்கலாம்; பொதுவாசகர்களுக்குத் தெளிவான ‘சமவெளிகள்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது.
- source_word: וְכָל חֵילוֹ
  choice: அவனுடைய படையினர் அனைவரும்
  rationale: חֵיל என்பது கூட்டு அர்த்தமுள்ள ‘படை’; அடுத்து வரும் எபிரெயப் பன்மை வினைக்கு இயல்பாக அமைய, அதன் உறுப்பினர்களைக் குறிக்கும் ‘படையினர் அனைவரும்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: அவனைவிட்டு நாலாபுறமும் சிதறிப்போனார்கள்
  rationale: נפץ என்ற பன்மை வினை படையினர் பிரிந்து சிதறியதைக் குறிக்கிறது; מֵעָלָיו அரசனிடமிருந்து பிரிந்ததைக் காட்டுகிறது. ‘நாலாபுறமும்’ என்பது சிதறுதலின் இயல்பைத் தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட திசைகளை வரையறுப்பதில்லை.
