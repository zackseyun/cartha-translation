base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: ta
  text: மாதத்தின் ஒன்பதாம் நாளில், நகரத்தில் பஞ்சம் கடுமையடைந்தது; தேசத்து மக்களுக்கு[b] அப்பம்[a] எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்பம்” என்பதற்கான எபிரெயச் சொல் இங்கு பொதுவாக உணவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தேசத்து மக்கள்” என்ற சொற்றொடர் சில சூழல்களில் பொதுமக்களையோ உள்ளூர் குடிமக்களையோ குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: அந்த மாதத்தின் ஒன்பதாம் நாளில்
  rationale: எபிரெயில் ‘மாதத்தின் ஒன்பதாம் [நாளில்]’ என உள்ளது; இயல்பான தமிழுக்காக ‘நாள்’ வெளிப்படையாகச் சேர்க்கப்பட்டது. சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட மாதத்தைக் குறிப்பதால் ‘அந்த மாதத்தின்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: பஞ்சம் கடுமையானது
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுவடைதல்’; பஞ்சத்தைப் பற்றிய இச்சூழலில் ‘கடுமையானது’ என்பது அதன் தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: இது நேரடியான இடப்பொருள் கொண்ட சொற்றொடர்; ‘நகரத்தில்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: உணவு எதுவும் இல்லாமல் போனது
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; ஆனால் இங்கு அது பொதுவாக உணவைக் குறிக்கும் ஆகுபெயராக வருகிறது. முற்றுகைப் பஞ்சத்தின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘உணவு’ தேர்ந்தெடுக்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: לְעַם הָאָרֶץ
  choice: தேசத்தின் மக்களுக்கு
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘தேசத்தின் மக்களுக்கு’. இது சில சூழல்களில் பொதுமக்களையோ உள்ளூர் குடிமக்களையோ குறிக்கலாம்; இவ்வசனம் மட்டும் அந்தக் குறுகிய பொருளை கட்டாயப்படுத்தாததால் பொதுவான வடிவமே வைக்கப்பட்டது.
