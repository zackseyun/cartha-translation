base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: ta
  text: ஐந்தாம் மாதத்தின் ஏழாம் நாளில்—அது பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் ஆட்சியின் பத்தொன்பதாம் ஆண்டு—பாபிலோன் அரசனின் பணியாளான அரச காவலர் தலைவர் நேபுசராதான்[a] எருசலேமுக்கு வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரச காவலர் தலைவர்” என்பதற்கான எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “அறுப்போரின் தலைவர்” அல்லது “வெட்டுவோரின் தலைவர்.” இது அரச காவலர்களின் அல்லது மரண தண்டனையை நிறைவேற்றுவோரின் தலைவரைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: ஐந்தாம் மாதம்
  rationale: எபிரெய உரையின் கதைத் தொடர்ச்சியைத் தமிழில் இயல்பான வாக்கியத் தொடரே வெளிப்படுத்துவதால், தொடக்க இணைப்பைத் தனியாக மொழிபெயர்க்காமல் காலக் குறிப்பை நேரடியாக அளிக்கிறது.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: அந்த மாதத்தின் ஏழாம் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பில் உள்ள ‘நாள்’ என்பதைத் தமிழில் வெளிப்படையாகச் சேர்ப்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: அது பாபிலோன் அரசன் நேபுகாத்நேச்சார் ஆட்சியின் பத்தொன்பதாம் ஆண்டு
  rationale: הִיא என்பதன் விளக்கவுரைப் பண்பையும், அரசாண்டுக் கணக்கைக் குறிக்கும் לַמֶּלֶךְ என்பதையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: בָּא
  choice: வந்தான்
  rationale: பொதுவான எபிரெய இயக்க வினையை நேரடியாக மொழிபெயர்க்கிறது; ஆண்பால் ஒருமை எழுவாய்க்கேற்ற தமிழ் வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: נְבוּזַרְאֲדָן
  choice: நேபுசராதான்
  rationale: எபிரெயப் பெயரின் ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்க இயலும் ஒலிபெயர்ப்பு.
- source_word: רַב טַבָּחִים
  choice: காவலர் படைத்தலைவர்
  rationale: சொல்லின் நேரடிப் பொருள் ‘கொலையாளர்களின் தலைவர்’ என்றாலும், அரசவைக் சூழலில் அரச காவலர் அல்லது தண்டனை நிறைவேற்றுவோரின் தலைமை அதிகாரியைக் குறிக்கிறது; முதன்மை உரையில் பதவியை இயல்பாகத் தருகிறது.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனின் பணியாளர்
  rationale: עֶבֶד என்பது அடிமை, பணியாளர், அரச அலுவலர் ஆகிய பொருட்களை ஏற்கக்கூடும். இங்கு அரசனுக்குக் கீழ்ப்பட்ட சேவை உறவைச் சுட்டும் பரந்த சொல்லாக ‘பணியாளர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
