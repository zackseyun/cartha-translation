base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: ta
  text: அப்போது நகரத்தில் உடைப்பு ஏற்பட்டது. போர்வீரர்கள் எல்லாரும் இரவில், அரசனின் தோட்டத்தின் அருகே இருந்த இரு மதில்களுக்கு நடுவிலுள்ள வாசல் வழியாகத் தப்பியோடினார்கள்.[a] கல்தேயர்கள்[b] நகரத்தை எல்லாப் பக்கங்களிலும் சூழ்ந்திருந்தபோதிலும், அரசன்[c] அரபாவுக்குச் செல்லும் வழியில் சென்றான்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தப்பியோடினார்கள்’ என்ற வினை இந்த எபிரெய் உரையில் வெளிப்படையாக இல்லை; வாக்கிய அமைப்பும் சூழலும் அதை உணர்த்துகின்றன. எரேமியா 52:7-இன் இணை நிகழ்வுரையில் அந்த வினை வெளிப்படையாக உள்ளது.
    reason: textual_syntax_note
  - marker: b
    text: ‘கல்தேயர்கள்’ என்பது எபிரெய் மூலத்தின் சொல்; இங்கு அது பாபிலோனியப் படையினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘அவன்.’ எபிரெயில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; சூழல் அரசனைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அரபா என்பது யோர்தான் பள்ளத்தாக்கிலிருந்து தெற்கே நீளும் பிளவுப் பள்ளத்தாக்குப் பகுதி; மரபாக ‘சமவெளி’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: நகரத்தின் பாதுகாப்பு மதில் உடைக்கப்பட்டது
  rationale: எபிரெயில் சொற்பட ‘நகரம் உடைக்கப்பட்டது’ என்று இருந்தாலும், முற்றுகைச் சூழலில் நகரின் பாதுகாப்பு அரண் உடைக்கப்பட்டதையே குறிக்கிறது. இயல்பான தமிழுக்காக ‘பாதுகாப்பு மதில்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்கள்
  rationale: சொற்பொருள் ‘போரின் மனிதர்கள்.’ நவீனத் தமிழில் படை சார்ந்த பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: הַלַּיְלָה
  choice: இரவில்
  rationale: இங்கு காலத்தைச் சுட்டும் வினையடைப் பயன்பாடு.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: இரு மதில்களுக்கு நடுவிலுள்ள வாசல் வழியாக
  rationale: חֹמֹתַיִם என்ற இருமை வடிவை ‘இரு மதில்கள்’ என்று காத்து, דרך שער என்பதைக் இயல்பான தமிழில் ‘வாசல் வழியாக’ எனத் தருகிறது.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: அரச தோட்டத்தின் அருகே இருந்த
  rationale: இங்குள்ள עַל இட அண்மையைச் சுட்டுகிறது; வாசலின் இருப்பிடத்தை இயல்பான தமிழில் விளக்குகிறது.
- source_word: וְכַשְׂדִּים
  choice: கல்தேயர்கள்
  rationale: மூல எபிரெய் இனப்பெயரைப் பிரதான உரையில் தக்கவைக்கிறது; வரலாற்றுச் சூழலில் இவர்கள் பாபிலோனியப் படையினர்.
- source_word: עַל הָעִיר סָבִיב
  choice: நகரத்தை எல்லாப் பக்கங்களிலும் சூழ்ந்திருந்த
  rationale: סָבִיב தரும் முழுமையான சுற்றிவளைப்பின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ
  choice: அரசன் ... போனான்
  rationale: எபிரெயில் ஒருமை வினையின் எழுவாய் வெளிப்படையாக இல்லை. உடனடிச் சூழலும் இணை நிகழ்வுரையும் அரசனைக் குறிக்கின்றன; இதை அடிக்குறிப்புடன் வெளிப்படையாக்குகிறது.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: அரபாவுக்குச் செல்லும் வழியில்
  rationale: עֲרָבָה என்பதை பொதுப்பெயரான ‘சமவெளி’ என்று மாற்றாமல் புவியியல் பெயராகக் காக்கிறது; דרך என்பதன் பாதை சார்ந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
