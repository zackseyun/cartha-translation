translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்வுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘கல்தேயர்கள்’ மற்றும் ‘அரபா’ போன்ற மூலத்துக்கு நெருக்கமான பெயர்கள் பிரதான உரையில் வைக்கப்பட்டு, அவற்றின் பொருள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளது. எபிரெயில் வெளிப்படையாக இல்லாத ‘தப்பியோடினார்கள்’ மற்றும் ‘அரசன்’ ஆகியவை சூழலின் அடிப்படையில் உரையில் வழங்கப்பட்டு, மூலத்தின் மறைபொருள் நிலை அடிக்குறிப்புகளில் வெளிப்படுத்தப்பட்டுள்ளது.
