translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயக் கட்டட விவரணைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான கட்டடக்கலைச் சொல்லுக்குப் பதிலாக எளிதில் புரியும் “தூண்முடி” தேர்ந்தெடுக்கப்பட்டது. எபிரெய மூலத்தின் இறுதி நீள்வட்டமான கூறு முதன்மை உரையில் இயல்பாக்கப்பட்டு, அதன் வடிவத் தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
