  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: ta
  text: ஒரு தூணின் உயரம் பதினெட்டு முழம்; அதன் மேல் வெண்கலத்தால் ஆன தூண்முடி இருந்தது. அந்தத் தூண்முடியின் உயரம் மூன்று முழம். தூண்முடியைச் சுற்றிலும் வலைப்பின்னல் வேலைப்பாடும்[a] மாதுளை அலங்காரங்களும் இருந்தன; அவை அனைத்தும் வெண்கலத்தால் ஆனவை. இரண்டாம் தூணிலும், வலைப்பின்னல் வேலைப்பாட்டுடன், இதே போன்ற அலங்காரங்கள் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலைப்பின்னல் வேலைப்பாடு” என்பதற்கு “வலை போன்ற அலங்கார அமைப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த இறுதிக் கூறு எபிரெயத்தில் சுருக்கமாக உள்ளது; சொல்லுக்குச் சொல், “வலைப்பின்னல் வேலைப்பாட்டின்மேல் இரண்டாம் தூணுக்கும் இவற்றைப் போன்றவையே” என்று வருகிறது. இரண்டாம் தூணிலும் ஒத்த அலங்காரங்கள் இருந்தன என்பதே பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: உயரம்
  rationale: கட்டட அமைப்பின் செங்குத்தான அளவைக் குறிக்கும் קוֹמָה என்பதன் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: עַמּוּד
  choice: தூண்
  rationale: ஆலயக் கட்டட அமைப்பிலுள்ள monumental pillar/column என்பதைக் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: כֹתֶרֶת
  choice: தூண்முடி
  rationale: தூணின் மேலுள்ள அலங்காரத் தலைப்பகுதியைக் குறிக்கும் சொல்லாக, தொழில்நுட்பத் துல்லியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: வேதாகமக் கால உலோகப் பொருட்களின் சூழலில் copper/bronze வகையைக் குறிக்கும் இச்சொல்லுக்கு ஆலயப் பொருட்கள் தொடர்பான வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: שְׂבָכָה
  choice: வலைப்பின்னல் வேலைப்பாடு
  rationale: தூண்முடியை அலங்கரித்த வலை போன்ற பின்னல் அமைப்பை நவீன வாசகர் காட்சிப்படுத்தக்கூடிய வகையில் தெரிவிக்கிறது.
- source_word: רִמֹּנִים
  choice: மாதுளை அலங்காரங்கள்
  rationale: சொல்லின் நேர்பொருளான மாதுளைகளைத் தக்கவைத்து, இங்கு அவை அலங்கார வடிவங்கள் என்பதைச் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அலங்காரங்கள் தூண்முடியைச் சூழ அமைந்திருந்த இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: அவை அனைத்தும் வெண்கலத்தால் ஆனவை
  rationale: முன்னர் குறிப்பிடப்பட்ட அலங்காரக் கூறுகள் அனைத்தும் ஒரே உலோகத்தால் செய்யப்பட்டவை என்ற தொகுப்புரையைத் தெளிவுபடுத்துகிறது.
- source_word: וְכָאֵלֶּה ... עַל הַשְּׂבָכָה
  choice: இரண்டாம் தூணிலும், வலைப்பின்னல் வேலைப்பாட்டுடன், இதே போன்ற அலங்காரங்கள் இருந்தன
  rationale: சுருக்கமாகவும் இலக்கண ரீதியில் நிறைவுறாமலும் உள்ள எபிரெய இறுதிக் கூறின் ஒப்புமைப் பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; அதன் சொல்லமைப்புச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
