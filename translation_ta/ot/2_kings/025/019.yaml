  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: ta
  text: நகரத்திலிருந்து அவன், போர்வீரர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த ஓர் அதிகாரியையும்[a], நகரத்தில் காணப்பட்ட ராஜாவின் முகத்தைப் பார்ப்பவர்களில் ஐந்து பேரையும்[b], நாட்டின் மக்களைப் படைசேவைக்குத் திரட்டிய படைத்தளபதியின் எழுத்தரையும்[c], நகரத்தில் காணப்பட்ட நாட்டின் மக்களில் அறுபது பேரையும் கொண்டு சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் அண்ணகன்’; எபிரெயச் சொல் உடல்ரீதியான அண்ணகனையோ ஓர் அரச அதிகாரியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ராஜாவின் முகத்தைப் பார்ப்பவர்கள்’ என்பது ராஜாவை நேரடியாக அணுகும் உரிமையுள்ள அரசவைப் பணியாளர்கள் அல்லது பிரமுகர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘படைசேவைக்குப் பதிவுசெய்த’ அல்லது ‘படையில் சேர்த்த’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: அதிகாரி
  rationale: இச்சொல் உடல்ரீதியான அண்ணகனையோ அரச அதிகாரியையோ குறிக்கலாம். சூழல் நிர்வாக மற்றும் இராணுவப் பொறுப்பைக் காட்டுவதால், உடல்நிலையைத் தீர்மானிக்காமல் ‘அதிகாரி’ என வழங்கப்படுகிறது.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: פָקִיד என்பது பொறுப்பில் அமர்த்தப்பட்டவரைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் இராணுவச் சாயலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: ராஜாவின் முகத்தைப் பார்க்கிறவர்களில்
  rationale: ராஜாவை நேரடியாக அணுகும் உரிமையுள்ள அரசவைப் பணியாளர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாக விளக்கிவிடாமல் நேரடியாகக் காக்கிறது.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: படைத்தலைவரான எழுத்தர்
  rationale: எபிரெயச் சொற்றொடரின் இணைப்புறவு சுருக்கமாக உள்ளது. ‘படைத்தலைவரான எழுத்தர்’ என்பது இரு பதவிக் குறிப்புகளையும் ஒரே நபருடன் இணைக்கிறது; இதன் இலக்கணத் தெளிவின்மை குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: நாட்டின் மக்களைப் படைசேவைக்குத் திரட்டிய
  rationale: צבא என்பதன் ஹிஃபில் வடிவம் இங்கு மக்களை இராணுவச் சேவைக்காகப் பதிவுசெய்தல் அல்லது அழைத்துத் திரட்டுதலைக் குறிக்கிறது. கட்டாய ஆட்சேர்ப்பு என்று மிகையாக முடிவுசெய்யாமல் இராணுவ நோக்கை வெளிப்படுத்துகிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: இச்சொற்றொடர் பொதுமக்களையோ நாட்டின் குடிமக்களையோ, சில வேளைகளில் உயர்குடியல்லாத மக்களையோ குறிக்கலாம். ‘நாட்டின் மக்கள்’ அதன் சமூகப் பொருள் நுட்பத்தைத் திறந்தவாறே வைக்கிறது.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: காணப்பட்ட
  rationale: מצא என்பதன் நிஃபால் வடிவத்தின் செயப்பாட்டு அர்த்தத்தைப் பாதுகாக்கிறது; நகரம் வீழ்ந்தபின் அவர்கள் அங்கே கண்டுபிடிக்கப்பட்டனர் என்ற கதைச்சூழலுக்கும் பொருந்துகிறது.
- source_word: לָקַח
  choice: பிடித்துக்கொண்டுபோனான்
  rationale: அடிப்படைப் பொருள் ‘எடுத்தான்’ என்றாலும், இச்சூழலில் கைதிகளாகப் பிடித்து அழைத்துச் சென்றதைக் குறிக்கிறது. தமிழில் ‘பிடித்துக்கொண்டுபோனான்’ சூழலார்ந்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: סָרִיס என்பவரின் உடல்நிலை
  choice: ‘அதிகாரி’ என்று மொழிபெயர்த்து தீர்மானிக்காமல் விடப்பட்டது.
  alternative: ‘அண்ணகன்’
  rationale: மூலச்சொல் இரு பொருள்களையும் ஏற்கக்கூடியதால், இங்கு உடல்ரீதியான அண்ணகன் என்று உறுதிப்படுத்துவது தேவையற்ற விளக்கச் சேர்க்கையாகும்.
- issue: הַסֹּפֵר שַׂר הַצָּבָא என்ற பதவித்தொடரின் உறவு
  choice: ‘படைத்தலைவரான எழுத்தர்’ என்று இணைக்கப்பட்டது.
  alternative: ‘எழுத்தரையும் படைத்தலைவரையும்’ அல்லது ‘படைத்தலைவரின் செயலரையும்’
  rationale: எபிரெயம் இரண்டையும் ஒரே நபரைக் குறிக்கும் இணைநிலைச் சொற்களாக வாசிக்க அனுமதிக்கிறது; தனித்தனி நபர்கள் அல்லது சொந்தத் தொடர்பு எனக் கொள்ளத் தேவையான குறியீடு இல்லை. இருப்பினும் சுருக்கமான தொடரின் மாற்று புரிதல் குறிப்பில் ஒப்புக்கொள்ளப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியலின் அமைப்பு காக்கப்பட்டாலும், தமிழில் வாசிக்க ஏற்ற வகையில் வேற்றுமை உருபுகளும் வினைமுடிவும் ஒழுங்குபடுத்தப்பட்டுள்ளன. ‘ராஜா’, ‘போர்வீரர்’, ‘படைசேவை’, ‘எழுத்தர்’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியும் முறையான பதிவை வழங்குகின்றன.
