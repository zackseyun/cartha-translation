  source_fidelity: திருத்தம் அவசியம். הַסֹּפֵר שַׂר־הַצָּבָא என்பது இயல்பாக ‘படைத்தளபதியின் எழுத்தர்/செயலர்’ என்ற கட்டமைப்பாகும்; வரைவிலுள்ள ‘படைத்தலைவரான எழுத்தர்’ எழுத்தரையே படைத்தலைவராக ஆக்கி மூலத்தின் உறவை மாற்றுகிறது. மற்ற பட்டியல் உறுப்புகள், ‘காணப்பட்ட’ என்ற செயப்பாட்டு உணர்வு, மற்றும் סָרִיס என்பதன் திறந்த பொருள் ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன.
  naturalness: திருத்திய வாக்கியம் நீளமான பட்டியல் அமைப்பைத் தக்கவைத்துக்கொண்டு நவீன நிலையான தமிழில் இயல்பாக அமைகிறது. ‘கொண்டு சென்றான்’ என்பது நபர்களைப் பொருளாகக் கொண்ட லָקַח-க்கு, ‘பிடித்துக்கொண்டுபோனான்’ என்பதைக் காட்டிலும் குறைவான விளக்கச் சேர்க்கையுடன் பொருந்துகிறது.
  terminology: ‘அதிகாரி’க்கு அண்ணகன் என்ற மாற்றை அடிக்குறிப்பு சரியாக வழங்குகிறது. ‘ராஜாவின் முகத்தைப் பார்ப்பவர்கள்’ என்ற நேரடி மரபுத்தொடர் காக்கப்பட்டுள்ளது. עַם הָאָרֶץ-க்கு ‘நாட்டின் மக்கள்’ நடுநிலையாக உள்ளது. ‘படைத்தளபதியின் எழுத்தர்’ என்பது הַסֹּפֵר שַׂר־הַצָּבָא-வின் கட்டமைப்பு உறவைத் துல்லியமாகக் காட்டுகிறது.
