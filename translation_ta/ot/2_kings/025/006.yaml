  text: וַֽ/יִּתְפְּשׂוּ֙ אֶת הַ/מֶּ֔לֶךְ וַ/יַּעֲל֥וּ אֹת֛/וֹ אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָ֑תָ/ה וַ/יְדַבְּר֥וּ אִתּ֖/וֹ מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: ta
  text: பின்பு அவர்கள் அரசனைப் பிடித்து, அவனை மேலே ரிப்லாவில் இருந்த பாபிலோன் அரசனிடம் கொண்டுபோனார்கள்; அவனுக்குத் தீர்ப்பளித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவனோடு நியாயத்தீர்ப்பைப் பேசினார்கள்”; இது அவனுக்குத் நீதித்துறைத் தீர்ப்பை அறிவித்தார்கள் என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: பிடித்து
  rationale: தப்பிச் சென்ற அரசனை வெற்றிகரமாகக் கைப்பற்றிய செயலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசனை
  rationale: முன்னரே குறிப்பிடப்பட்ட சிதேக்கியாவை அவரது பெயரை மீண்டும் சேர்க்காமல், எபிரெய உரையின் சொல்லாடல்படி குறிக்கிறது.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: அவனைக் கொண்டுபோனார்கள்
  rationale: எபிரெய வினையின் இயக்கப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மேலே கொண்டுபோனார்கள்’ என்பது இச்சூழலில் செயற்கையாகவும் தவறான நிலத்தோற்றக் குறிப்பாகவும் புரியக்கூடும்.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனிடம்
  rationale: אֶל என்பதன் நேரான திசைப் பொருளைத் தருகிறது; ‘முன்பாக’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: רִבְלָתָה
  choice: ரிப்லாவில் இருந்த
  rationale: இலக்கில் நிகழ்ந்த சந்திப்பின் இடத்தைத் தமிழில் தெளிவாகக் குறிக்கிறது; பெயரிலுள்ள திசைச் சுட்டை முழு வாக்கியச் சூழலோடு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: அவனுக்கு எதிராகத் தீர்ப்பு வழங்கினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவனோடு நியாயத்தீர்ப்பைப் பேசினார்கள்’ என்ற எபிரெய மரபுத்தொடரின் நீதித்துறைப் பொருளைத் தெளிவான தற்போதைய தமிழில் தருகிறது.
