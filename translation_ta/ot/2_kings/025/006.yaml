- from: பின்பு அவர்கள் அரசனைப் பிடித்து, ரிப்லாவில் இருந்த பாபிலோன் அரசனிடம் அவனைக் கொண்டுபோனார்கள்; அவனுக்கு எதிராகத் தீர்ப்பு வழங்கினார்கள்.[a]
  to: பின்பு அவர்கள் அரசனைப் பிடித்து, அவனை மேலே ரிப்லாவில் இருந்த பாபிலோன் அரசனிடம் கொண்டுபோனார்கள்; அவனுக்குத் தீர்ப்பளித்தார்கள்.[a]
  rationale: The revision restores the Hebrew directional nuance in ‘மேலே கொண்டுபோனார்கள்’ and uses a neutral Tamil judicial expression for the משפט idiom. The footnote anchor and its lexical-alternative function are retained, with wording aligned to the revised translation.
