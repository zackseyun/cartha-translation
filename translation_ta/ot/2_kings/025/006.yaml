translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் சட்டவியல் பொருள் பாதுகாக்கப்பட்டு, தமிழில் இயல்பற்ற சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
