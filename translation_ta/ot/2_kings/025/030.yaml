  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: ta
  text: அவனுக்குரிய உணவுப் பங்கு[a]—தொடர்ச்சியான உணவுப் பங்கு—அரசனிடமிருந்து அவனுக்குக் கொடுக்கப்பட்டது. அவன் வாழ்நாள் முழுவதும், ஒவ்வொரு நாளுக்கும் உரிய பங்கு அந்தந்த நாளில்[b] கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உணவுப் பங்கு’ என்பதற்கு ‘ஒதுக்கப்பட்ட பங்கு,’ ‘உணவு ஒதுக்கீடு,’ அல்லது ‘வழங்கல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அவனுக்கென ஒதுக்கி வழங்கப்பட்ட ஏற்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘ஒரு நாளின் காரியம் அதனதன் நாளில்.’ ஒவ்வொரு நாளுக்கும் ஒதுக்கப்பட்ட பங்கு அந்தந்த நாளிலேயே வழங்கப்பட்டது என்பதே இந்த மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: உணவுப்படி
  rationale: இச்சூழலில் அரசனால் ஒதுக்கி வழங்கப்பட்ட அன்றாட உணவு அல்லது வாழ்வாதாரப் பங்கைக் குறிக்கிறது. ‘உணவுப்படி’ என்பது வெறும் பண உதவியெனத் தவறாகப் புரிந்துகொள்ளாமல், ஒதுக்கப்பட்ட உணவுப் provision என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து வழங்கப்படும்
  rationale: வழங்கப்பட்ட பங்கு இடைவிடாமல் நீடித்ததை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: נִתְּנָה
  choice: கொடுக்கப்பட்டது
  rationale: נתן என்பதன் நேரடியான செயப்பாட்டு வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: அரசனிடமிருந்து
  rationale: அந்த ஏற்பாட்டின் மூலமும் வழங்குநரும் அரசன் என்பதைக் குறிக்கும் எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் உரிய பங்கு அந்தந்த நாளில்
  rationale: சொற்றொடரின் பகிர்ந்தளிக்கும் வலிமையையும் நாள்தோறும் அந்நாளுக்குரிய அளவு வழங்கப்பட்டது என்ற பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כֹּל יְמֵי חַיָּו
  choice: அவன் உயிரோடிருந்த நாட்களெல்லாம்
  rationale: வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான தமிழில் வழங்குகிறது.
