  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. ‘அவனுக்குரிய’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபருடனான தொடர்பைத் தக்கவைக்கிறது; எபிரெயத்தின் மறுபடியும் கூறும் அமைப்பை கோடுகளால் ஓரளவு பாதுகாத்து, இறுதி வினை தமிழின் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது.
