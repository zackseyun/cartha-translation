translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெயச் சொற்றொடரின் தொடர்ச்சியைக் காக்கும் போதும், ‘அப்பம் உண்டான்’ என்ற நேரடி ஆனால் சூழலில் குறுகலாகத் தோன்றக்கூடிய மொழிபெயர்ப்புக்குப் பதிலாக இயல்பான ‘உணவு உண்டான்’ பயன்படுத்தப்பட்டது.
