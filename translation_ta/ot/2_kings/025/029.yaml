source:
  edition: WLC
  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: ta
  text: அவன் தன் சிறை உடைகளை மாற்றிக்கொண்டு, தன் வாழ்நாளெல்லாம் தொடர்ந்து அரசனுக்கு முன்பாக[a] உணவு உண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனுடைய முன்னிலையில்.” இச்சொற்றொடர் அரசனின் பந்தியில் உணவருந்தியதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: மாற்றிக்கொண்டு
  rationale: פיעל வடிவிலுள்ள שׁנה இங்கு ‘மாற்றுதல்’ என்று பொருள்படுகிறது. அடுத்த செயலை இயல்பான தமிழில் இணைப்பதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: தன் சிறை உடைகளை
  rationale: ‘தன் சிறைவாசத்தின் ஆடைகள்’ என்ற நேரடி அமைப்பைவிட ‘தன் சிறை உடைகள்’ என்பது இயல்பான நவீனத் தமிழ்; உடைகள் அவனுடையவை என்பதையும் தெளிவாக்குகிறது.
- source_word: וְאָכַל לֶחֶם
  choice: உணவு உண்டான்
  rationale: நேரடியாக ‘அப்பம் உண்டான்’ என்றாலும், எபிரெயத்தில் இது பொதுவாக உணவருந்துதலைக் குறிக்கும் மரபுத்தொடர். தமிழில் ‘உணவு உண்டான்’ என்பதே சூழலுக்கேற்ற இயல்பான பொருளைத் தருகிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: தொடர்ச்சியான அல்லது வழக்கமான நிகழ்வைக் குறிக்கும் சொல்லாக இங்கு அரசவையில் தவறாமல் உணவருந்தியதைக் காட்டுகிறது.
- source_word: לְפָנָיו
  choice: அரசனுக்கு முன்பாக
  rationale: நேரடிப் பொருள் ‘அவனுக்கு முன்பாக’. முந்தைய வசனத்தின் அரசனே இந்தப் பிரதிப்பெயரின் குறிப்பு என்பதால் தமிழில் ‘அரசன்’ என்று வெளிப்படுத்தப்பட்டது; அரசனின் பந்தியில் உண்பது என்ற சாத்திய உட்கருத்து அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: כָּל יְמֵי חַיָּיו
  choice: தன் வாழ்நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இது சுருக்கமான, இயல்பான தமிழாக்கம்.
