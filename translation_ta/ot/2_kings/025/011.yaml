base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: ta
  text: காவல்படையின் தலைவனான நேபுசராதான்[b], நகரத்தில் மீதமிருந்த மக்களையும், பாபிலோன் அரசனிடம் சென்று சேர்ந்தவர்களையும்[a], மீதமிருந்த மக்கள் திரளையும் நாடுகடத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாபிலோன் அரசனிடம் சென்று சேர்ந்தவர்களையும்”; சொல்லுக்குச் சொல், “பாபிலோன் அரசன்மேல் விழுந்தவர்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: “காவல்படையின் தலைவன்” என்பதற்கான எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், “வெட்டுபவர்களின் தலைவன்”; இது அரச காவல்படையின் தளபதியைக் குறிக்கும் அதிகாரப் பட்டமாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: நகரத்தில் எஞ்சியிருந்த மக்களையும்
  rationale: இரு முறை வரும் ‘எஞ்சிய’ கருத்தைத் தக்கவைத்து, முற்றுகைக்குப் பின் நகரில் மீந்திருந்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனிடம் சரணடைந்தவர்களையும்
  rationale: ‘மேல் விழுதல்’ என்ற சொற்றொடர் இங்கு அரசியல்-இராணுவச் சூழலில் எதிர்தரப்பிடம் சென்று சேர்ந்தல் அல்லது சரணடைதலைக் குறிக்கிறது. ‘சரணடைந்தவர்கள்’ தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֶתֶר הֶהָמוֹן
  choice: எஞ்சியிருந்த மற்ற மக்களையும்
  rationale: הָמוֹן என்பது மக்கள் திரள் அல்லது பெருங்கூட்டத்தைக் குறிக்கலாம். சூழல் தெளிவாக மனிதர்களைப் பற்றியதால், சமூகப் பிரிவை அதிகமாக வரையறுக்காமல் இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: הֶגְלָה
  choice: சிறையிருப்புக்குக் கொண்டுபோனான்
  rationale: ஹிப்இல் வடிவம் கட்டாய நாடுகடத்தலைக் குறிக்கிறது. ‘சிறையிருப்புக்குக் கொண்டுபோனான்’ என்பது வேதாகம வரலாற்றுச் சூழலையும் வற்புறுத்தப்பட்ட இடமாற்றத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְבוּזַרְאֲדָן
  choice: நேபுசராதான்
  rationale: எபிரெயப் பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: רַב טַבָּחִים
  choice: காவல்படையின் தலைவன்
  rationale: சொல்லுக்குச் சொல் ‘கொலையாளர்களின் தலைவன்’ எனினும், இது அரச காவல் அல்லது மெய்க்காவல் படையின் தளபதியைக் குறிக்கும் அதிகாரப் பட்டமாகப் புரிந்துகொள்ளப்படுகிறது.
