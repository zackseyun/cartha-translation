translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் நீண்ட பட்டியல் அமைப்பும், முதல் மற்றும் மூன்றாம் குழுக்களில் உள்ள ‘எஞ்சிய’ என்ற மீளுரையும் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
