base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: ta
  text: ஏழாம் மாதத்தில், அரச குலத்தைச் சேர்ந்தவனும்[a] எலிசாமாவின் பேரனும் நெத்தனியாவின் மகனுமான இஸ்மவேல் பத்து பேருடன் வந்தான். அவர்கள் கெதலியாவைத் தாக்கினார்கள்; அவன் இறந்தான். மேலும், மிஸ்பாவில் அவனுடன் இருந்த யூதா நாட்டினரையும் கல்தேயரையும்[b] தாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அரச விதையைச் சேர்ந்தவன்”; அதாவது, அரச வம்சத்தைச் சேர்ந்தவன்.
    reason: lexical_alternative
  - marker: b
    text: இச்சூழலில் “கல்தேயர்” என்பதை “பாபிலோனியர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தில்
  rationale: எபிரெயக் கதைத் தொடர் வடிவத்தைத் தமிழில் தேவையற்ற ‘அது நிகழ்ந்தது’ என்று வெளிப்படுத்தாமல், இயல்பான காலக் குறிப்பாக அளிக்கிறது.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: அரச குலத்தைச் சேர்ந்தவன்
  rationale: சொல்லுக்கு சொல் ‘அரச விதை’ என்பது நவீன தமிழில் இயல்பற்றது; இச்சொற்றொடர் குறிக்கும் அரச மரபுவழி உறவைத் தெளிவாகத் தருகிறது.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: தன்னுடன் பத்துப் பேரைக் கூட்டிக்கொண்டு
  rationale: உடன்சென்ற பத்துப் பேரை நவீன தமிழின் இயல்பான நடையில் குறிப்பிடுகிறது.
- source_word: וַיַּכּוּ
  choice: தாக்கினார்கள்
  rationale: נכה என்பதன் தாக்குதல்/அடித்தல் பொருளைப் பாதுகாக்கிறது; கெதலியாவின் மரணத்தை அடுத்த தனி வாக்கியம் தெரிவிப்பதால் இரு எபிரெய வினைகளையும் ஒன்றாகக் கலக்கவில்லை.
- source_word: וַיָּמֹת
  choice: அவன் இறந்தான்
  rationale: ஒருமை வினை கெதலியாவைக் குறிப்பதைத் தெளிவாக்கி, மூலத்தின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: הַיְּהוּדִים
  choice: யூதா நாட்டினர்
  rationale: இந்த அரசாட்சி/நாடுகடத்தல் வரலாற்றுச் சூழலில் இன-நிலப்பகுதி சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַכַּשְׂדִּים
  choice: கல்தேயர்
  rationale: மூலத்திலுள்ள இனப்பெயரை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் பாபிலோனியர்களைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: בַּמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: இடப்பெயருடன் தமிழில் இயல்பான இடவேற்றுமை உருபைப் பயன்படுத்துகிறது.
