translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட வம்சவழித் தொடரை தமிழின் இயல்பான ‘மகன்/பேரன்’ அமைப்பில் வழங்கி, மூலத்தின் தகவல் வரிசையும் வன்முறைச் செயலும் மரணமும் தனித்தனியாக இருப்பதும் பாதுகாக்கப்பட்டுள்ளன.
