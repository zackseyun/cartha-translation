source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: ta
  text: அந்த இரண்டு தூண்கள், ‘கடல்’ எனப்பட்ட ஒரே தொட்டி, சாலொமோன் யாவேவின் ஆலயத்திற்காகச் செய்திருந்த தாங்கி அமைப்புகள் ஆகிய இந்தப் பொருட்கள் அனைத்தின் வெண்கலமும் எடைபோடப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பொருட்கள் அனைத்தின் வெண்கலத்திற்கு எடை இல்லை.” வெண்கலம் மிகுதியாக இருந்ததால் அது எடைபோடப்படவில்லை என்பது பொருள்.
    reason: מִשְׁקָל என்பதற்கு ‘எடை’ என்றும் ‘எடைபோடுதல்’ என்றும் பொருள் கொள்ள முடியும்; மூலத்தின் சுருக்கமான சொல்லமைப்பில் உள்ள இந்த வேறுபாட்டைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: அந்த இரண்டு தூண்கள்
  rationale: עַמּוּדִים என்பது கட்டமைப்பைத் தாங்கும் தூண்களைக் குறிக்கிறது; ஆலயச் சூழலில் ‘தூண்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַיָּם הָאֶחָד
  choice: ‘கடல்’ எனப்பட்ட ஒரே தொட்டி
  rationale: יָם இங்கு பெரிய வெண்கலத் தொட்டியின் சிறப்புப் பெயர். ‘கடல்’ என்ற மூல உருவகத்தைப் பேணியபடி, அது ஒரு தொட்டி என்பதை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: וְהַמְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: מְכֹנוֹת என்பது கழுவும் தொட்டிகளைத் தாங்கிய அடித்தள அமைப்புகளைக் குறிக்கிறது; ‘தாங்கிகள்’ அவற்றின் செயலையும் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: சாலொமோன் ... செய்திருந்த
  rationale: முந்தைய காலத்தில் சாலொமோன் உருவாக்கிய பொருட்களைப் பின்னோக்கிக் குறிப்பிடும் எபிரெய உறவுத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לְבֵית יְהוָה
  choice: யாவேவின் ஆலயத்திற்காக
  rationale: בֵּית என்பதன் ஆலயச் சூழலுக்குரிய பொருளை ‘ஆலயம்’ தெளிவாக்குகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: எடைக்குக் கணக்கே இல்லை
  rationale: மூலத்தில் ‘எடை இல்லை’ அல்லது ‘எடைபோடுதல் இல்லை’ என்ற சுருக்கமான மரபுத்தொடர் உள்ளது. வெண்கலத்தின் அளவு எடைபோட முடியாத அளவு மிகுதியாக இருந்தது என்ற சூழற்பொருளை இத்தமிழ் இயல்பாகத் தருகிறது; நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִנְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת ஆலயப் பொருட்களின் உலோகமாக இங்கு வெண்கலத்தைக் குறிக்கிறது; இது வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: இந்தப் பொருட்கள் அனைத்தும்
  rationale: כֵּלִים என்பது இங்கு தூண்கள், தொட்டி, தாங்கிகள் ஆகிய பலவகை ஆலயப் பொருட்களை உள்ளடக்கும் பொதுச்சொல்; ‘பொருட்கள்’ அந்த விரிவைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: בֵית יְהוָה என்பதன் வடிவம்
  choice: யாவேவின் ஆலயம்
  alternative: யாவேவின் வீடு
  rationale: ‘வீடு’ என்பது நேரடி வடிவமாக இருந்தாலும், இச்சூழலில் சாலொமோனின் ஆலயமே குறிப்பிடப்படுவதால் ‘ஆலயம்’ நவீன வாசகருக்குத் தெளிவானது; இதனால் எந்தத் தனிப்பிரிவுக் கருத்தும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கடல்’ என்ற தொழில்நுட்பப் பெயர் விளக்கத்துடன் வைக்கப்பட்டுள்ளது; அளவிட முடியாத பெருமளவைக் குறிக்கும் எபிரெய மரபுத்தொடர் இயல்பான தமிழில் தரப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
