base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: ta
  text: சட்டிகளையும், சாம்பல் வாரிகளையும், திரி கத்தரிக்கும் கருவிகளையும்[a], கிண்ணங்களையும், ஆலயப் பணிக்குப் பயன்படுத்தப்பட்ட வெண்கலப் பாத்திரங்கள் அனைத்தையும் அவர்கள் எடுத்துக்கொண்டு போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கத்திகள்” அல்லது “கிளை கத்தரிக்கும் கத்திகள்.” எபிரெயச் சொல் வெட்டும் கருவியைக் குறிக்கக்கூடும்; ஆனால் ஆலயப் பாத்திரங்கள் இடம்பெறும் இச்சூழலில், விளக்குத் திரிகளைச் சீர்செய்யும் கருவிகள் எனப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: சட்டிகள்
  rationale: סִירוֹת என்பது பொதுவாகச் சட்டிகள் அல்லது கொள்கலன்களைக் குறிக்கிறது; ஆலயப் பொருட்களின் பட்டியலில் இயல்பாகவும் மிகையாகக் குறிப்பிட்டுவிடாமலும் அமையும் சொல் இது.
- source_word: הַיָּעִים
  choice: சாம்பல் வாரிகள்
  rationale: יָעִים என்பது சாம்பலை அகற்ற அல்லது நெருப்புத் தணலைக் கையாளப் பயன்படும் கருவிகளைக் குறிக்கிறது. வெறும் ‘வாரிகள்’ என்பதைவிட ‘சாம்பல் வாரிகள்’ ஆலயச் சூழலில் அதன் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: הַמְזַמְּרוֹת
  choice: திரி கத்தரிக்கும் கருவிகள்
  rationale: இந்தச் சொல் வெட்டும் கருவிகளைக் குறிக்கக்கூடும்; ஆனால் ஆலயப் பாத்திரங்களின் பட்டியலில் விளக்குத் திரிகளைச் சீர்செய்யும் கருவிகள் எனப் புரிந்துகொள்ளப்படுவது சூழலுக்குப் பொருத்தமானது. மூலத்தின் lexical ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַכַּפּוֹת
  choice: கிண்ணங்கள்
  rationale: כַּף சிறிய பாத்திரம், தட்டு அல்லது கரண்டி போன்ற கொள்கலனைக் குறிக்கலாம். ‘கிண்ணங்கள்’ என்பது வடிவத்தை மிகையாக வரையறுக்காமல் இங்கு வாசிக்க இயல்பாக உள்ளது.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: வெண்கலப் பாத்திரங்கள் அனைத்தும்
  rationale: כְּלִים என்பது பாத்திரங்கள் அல்லது கருவிகள் என்ற பரந்த பொருளுடையது; ஆலயப் பொருட்களின் பட்டியலில் ‘பாத்திரங்கள்’ பொருத்தமானது. נְחֹשֶׁת இச்சூழலில் ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: ஆலயப் பணிக்குப் பயன்படுத்தப்பட்ட
  rationale: שרת இங்கு வழிபாட்டு அல்லது ஆலயச் சேவையைக் குறிக்கிறது. தமிழில் இயல்பான சொல்லமைப்புக்காக கருவிகள் ‘ஆலயப் பணிக்குப் பயன்படுத்தப்பட்டவை’ எனக் கூறப்பட்டுள்ளது; இதனால் வழிபாட்டுச் சேவையின் சூழல் தக்கவைக்கப்படுகிறது.
- source_word: לָקָחוּ
  choice: அவர்கள் எடுத்துக்கொண்டு போனார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘எடுத்தார்கள்’; கொள்ளையிடப்பட்ட ஆலயப் பொருட்கள் அங்கிருந்து அகற்றப்பட்ட சூழலை இயல்பான தமிழில் ‘எடுத்துக்கொண்டு போனார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
