translation_notes:
  register: நவீனத் தரத் தமிழில், ஆலயப் பொருட்களின் பட்டியலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைப்புச் சொற்களின் தொடர்ச்சி தமிழில் பட்டியல் அமைப்பாகப் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி உரிய சந்தேகத்திற்குரிய சொல்லான ‘திரி கத்தரிக்கும் கருவிகள்’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
