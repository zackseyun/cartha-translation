base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: ta
  text: யாவேயின் ஆலயத்தில் இருந்த வெண்கலத் தூண்களையும், தாங்கிகளையும்[a], யாவேயின் ஆலயத்தில் இருந்த வெண்கலக் கடலையும் கல்தேயர்கள்[b] உடைத்துத் துண்டுகளாக்கி, அவற்றின் வெண்கலத்தைப் பாபிலோனுக்குக் கொண்டு சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாங்கிகள்’ என்பதற்கு ‘அடித்தளங்கள்’ என்றும் மொழிபெயர்க்கலாம்; இவை ஆலயத் தொட்டிகளைத் தாங்கிய அமைப்புகள்.
    reason: lexical_alternative
  - marker: b
    text: ‘கல்தேயர்கள்’ என்பது இங்கு பாபிலோனியப் படையினரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: வெண்கலத் தூண்கள்
  rationale: עַמּוּדִים என்பது தூண்களைக் குறிக்கிறது; ஆலய உலோகப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கு இயல்பான நவீனத் தமிழ்ச் சொல் ‘வெண்கலம்’.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்தில் இருந்த
  rationale: எபிரெய உறவுச்சொல் வாக்கியத்தில் வினைச்சொல்லும் இடவேற்றுமை உருபும் வெளிப்படையாக இல்லாவிட்டாலும், சூழல் இப்பொருட்கள் ஆலயத்தில் இருந்ததைக் குறிக்கிறது.
- source_word: הַמְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: இச்சொல் ஆலயத் தொட்டிகளைத் தாங்கிய அமைப்புகளைக் குறிக்கிறது. ‘தாங்கிகள்’ என்பது அவற்றின் வடிவத்தையும் பணியையும் பொதுவாசகருக்குத் தெளிவாக உணர்த்துகிறது; ‘அடித்தளங்கள்’ என்பதும் சாத்தியம்.
- source_word: יָם הַנְּחֹשֶׁת
  choice: வெண்கலக் கடல்
  rationale: יָם என்பதன் நேர்ப்பொருளான ‘கடல்’ பாதுகாக்கப்பட்டுள்ளது; இது ஆலயத்திலிருந்த பெரிய நீர்த்தொட்டியின் தனிப்பெயர்போன்ற பாரம்பரியக் குறிப்பு.
- source_word: שִׁבְּרוּ
  choice: உடைத்துத் துண்டுகளாக்கி
  rationale: பெரிய வெண்கலப் பொருட்களை எடுத்துச் செல்வதற்காகத் துண்டுகளாக உடைத்த செயலை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַשְׂדִּים
  choice: கல்தேயர்கள்
  rationale: மூலமொழியின் இனக்குழுப் பெயர் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; இச்சூழலில் அது பாபிலோனியப் படையினரைக் குறிக்கிறது.
- source_word: וַיִּשְׂאוּ
  choice: கொண்டு சென்றார்கள்
  rationale: இங்கு נשא என்பது உடைந்த உலோகத்தை இலக்கிடத்துக்குச் சுமந்து அல்லது எடுத்துச் சென்றதைக் குறிக்கிறது.
- source_word: נְחֻשְׁתָּם
  choice: அவற்றின் வெண்கலம்
  rationale: மூன்றாம் நபர் பன்மை பின்னொட்டு முன்பு குறிப்பிடப்பட்ட வெண்கலப் பொருட்களை ஒட்டுமொத்தமாகச் சுட்டுகிறது.
- source_word: בָּבֶלָה
  choice: பாபிலோனுக்கு
  rationale: திசையைக் காட்டும் எபிரெய இறுதி, பாபிலோனை நோக்கிய நகர்வைத் தெரிவிக்கிறது; தமிழில் ‘பாபிலோனுக்கு’ என்பது இயல்பான வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயரே இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வெண்கலக் கடல்’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது; நீண்ட பட்டியல் தமிழில் இயல்பாக ஓடுமாறு வேற்றுமை உருபுகள் சேர்க்கப்பட்டுள்ளன.
