  rationale: எபிரெய மூலத்தில் பொருள்வகையை வலியுறுத்தும் தங்கம்/வெள்ளி என்ற பெயர்ச்சொற்களின் மறுபடிச் சொல்லலைத் தமிழில் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: לָקַח
  choice: எடுத்துக்கொண்டான்
