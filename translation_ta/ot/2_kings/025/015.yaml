  text: தணல் சட்டிகளையும்[a] கிண்ணங்களையும்[b]—தங்கமானவற்றைத் தங்கமாகவும்[c], வெள்ளியானவற்றை வெள்ளியாகவும்—காவற்படைத் தளபதி[d] எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
