  rationale: ஆலயப் பணியில் தணல் அல்லது தூபம் எடுத்துச் செல்லப் பயன்படுத்தப்பட்ட பாத்திரங்களை இச்சொல் குறிக்கிறது. தூபப் பயன்பாட்டை மட்டும் குறிப்பதாகக் கட்டுப்படுத்தாமல், பொருளின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּזְרָקוֹת
  choice: கிண்ணங்கள்
  rationale: பலிக்குரிய திரவத்தை வைத்திருக்கவோ தெளிக்கவோ பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கும்; நவீன தமிழில் இயல்பான பொதுப்பெயர்.
- source_word: אֲשֶׁר זָהָב זָהָב / וַאֲשֶׁר כֶּסֶף כָּסֶף
