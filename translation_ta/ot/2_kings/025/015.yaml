    text: அல்லது, “தூபக்கலசங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கலசங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் பொருள்வகைப் பிரிவை வலியுறுத்தும் வகையில், “தங்கமானது, தங்கம்; வெள்ளியானது, வெள்ளி” என்று உலோகங்களின் பெயர்கள் திரும்பக் கூறப்படுகின்றன.
    reason: lexical_alternative
