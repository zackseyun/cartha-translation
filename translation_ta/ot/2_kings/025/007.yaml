base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: ta
  text: சிதேக்கியாவின் மகன்களை அவன் கண்முன்னே அறுத்துக் கொன்றார்கள். அதன்பின் அவன் சிதேக்கியாவின் கண்களைக் குருடாக்கினான்[a]; வெண்கல விலங்குகளால் அவனைக் கட்டி, பாபிலோனுக்குக் கொண்டுபோனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘குருடாக்கினான்.’ இவ்வன்முறைச் சூழலில், சிதேக்கியாவின் கண்கள் உடல்ரீதியாக அழிக்கப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: அறுத்துக் கொன்றார்கள்
  rationale: இந்த வினைச்சொல் வன்முறையான படுகொலையைக் குறிக்கிறது. வெறும் ‘கொன்றார்கள்’ என்பதைவிட ‘அறுத்துக் கொன்றார்கள்’ மூலத்தின் கொடூரத்தன்மையைத் தெளிவாகத் தருகிறது.
- source_word: לְעֵינָיו
  choice: அவன் கண்முன்னே
  rationale: அவன் நேரடியாகப் பார்த்துக்கொண்டிருக்கும்போதே இது நடந்தது என்ற எபிரெய மொழிமரபை இயல்பான, வலிமையான தமிழில் தருகிறது.
- source_word: עִוֵּר
  choice: கண்களைக் குருடாக்கி
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘குருடாக்குதல்.’ வன்முறைச் சூழல் கண்களை உடல்ரீதியாக அழித்ததைக் குறிக்கலாம்; அதை அடிக்குறிப்பில் தெரிவித்து, மூலத்தின் சொற்பொருளை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: וַיַּאַסְרֵהוּ
  choice: அவனைக் கட்டி
  rationale: பின்வரும் உலோக விலங்குகள் என்ற கருவிச் சொல்லோடு சேர்ந்து, ‘கட்டுதல்’ என்பது நேரடியானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: בַנְחֻשְׁתַּיִם
  choice: வெண்கல விலங்குகளால்
  rationale: இந்த இருமை/பன்மை வடிவம் உலோகக் கட்டுப்பாடுகளைக் குறிக்கிறது. ‘விலங்குகள்’ கை அல்லது கால் கட்டுப்பாடுகளைக் குறிக்கும் இயல்பான தமிழ் சொல்; ‘வெண்கலம்’ உலோகத்தையும் பாதுகாக்கிறது.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: பாபிலோனுக்குக் கொண்டுபோனான்
  rationale: இலக்கை நோக்கி ஒருவரைக் கொண்டு செல்வதை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: சிதேக்கியாவின் மகன்களை
  rationale: எபிரெய கட்டமைப்பின் உடைமைத் தொடர்பை தெளிவான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வினைச்சொற்களின் எழுவாய் பன்மையிலிருந்து ஒருமைக்கு மாறுதல்
  choice: ‘கொன்றார்கள்’ என்பதற்குப் பின் ‘அவன் ... குருடாக்கி ... கட்டி ... கொண்டுபோனான்’ என்று எழுவாய் மாற்றத்தைப் பாதுகாத்தல்
  alternative: எல்லா செயல்களுக்கும் பன்மை எழுவாயைப் பயன்படுத்துதல் அல்லது ‘பாபிலோன் அரசன்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயில் முதல் வினை மூன்றாம் நபர் பன்மையிலும், அடுத்த மூன்று வினைகள் மூன்றாம் நபர் ஒருமையிலும் உள்ளன. மூலத்தில் இவ்வசனத்துக்குள் ஒருமை எழுவாய் பெயரால் குறிப்பிடப்படாததால், ‘அவன்’ என்று மட்டும் வைத்து இலக்கண மாற்றத்தையும் குறிப்பின் இயல்பான மறைமுகத்தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறுத்துக் கொன்றார்கள்’ மூலத்தின் கொடூரத்தை மறைக்காமல் தெரிவிக்கிறது; ‘வெண்கல விலங்குகள்’ உலோகக் கட்டுப்பாடுகளைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் குறிக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
