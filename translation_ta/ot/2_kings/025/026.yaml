  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: ta
  text: அப்போது சிறியோர் முதல் பெரியோர் வரை மக்கள் அனைவரும், படைகளின் தலைவர்களும்[a] எழுந்து எகிப்துக்குச் சென்றார்கள்; ஏனெனில் அவர்கள் கல்தேயர்களுக்குப் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படை அதிகாரிகளும்” அல்லது “படை அணிகளின் தளபதிகளும்.”
    reason: שָׂרֵי הַחֲיָלִים என்ற சொற்றொடர் படைத்தலைவர்கள், அதிகாரிகள், அல்லது படை அணிகளின் தளபதிகள் என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம் அவர்கள் தீர்மானமாகச் செயல்பட்டதைக் குறிக்கிறது. அடுத்துவரும் ‘சென்றார்கள்’ என்பதோடு இயல்பாக இணைகிறது; வெறும் உடல் நிலையில் எழுந்திருத்தலை மட்டும் குறிப்பதாகக் குறுக்கவில்லை.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடரின் முழுமையைக் காத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: சிறியவர் முதல் பெரியவர் வரை
  rationale: சமூக நிலை, முக்கியத்துவம், அல்லது பரந்த அளவில் அனைவரையும் உள்ளடக்கும் எபிரெய மரபுத்தொடரின் நெகிழ்வை இது காக்கிறது; வயதை மட்டும் குறிப்பதாகத் தீர்மானிக்கவில்லை.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: படைப்பிரிவுகளின் தலைவர்களும்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது அதிகாரிகள் என்றும், הַחֲיָלִים இச்சூழலில் படை அணிகள் அல்லது படைப்பிரிவுகள் என்றும் பொருள்படுகிறது. தேர்ந்த சொற்றொடர் இராணுவச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: எகிப்துக்குச் சென்றார்கள்
  rationale: בוא அடிப்படையில் ‘வருதல்’ என்றாலும், கதைசொல்லியின் பார்வையிலிருந்து இலக்கை நோக்கிய நகர்வைத் தமிழில் ‘சென்றார்கள்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் எகிப்துக்குச் சென்றதற்கான காரணத்தை இங்கு அறிமுகப்படுத்துகிறது.
- source_word: יָרְאוּ מִפְּנֵי כַשְׂדִּים
  choice: அவர்கள் கல்தேயர்களுக்குப் பயந்தார்கள்
  rationale: ירא உடன் வரும் מִפְּנֵי அச்சத்தின் இலக்கைச் சுட்டுகிறது. ‘கல்தேயர்கள்’ என்ற வரலாற்று இனப்பெயரைத் தமிழில் வழக்கமான வடிவில் வைத்துள்ளது.
