base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: ta
  text: 'கெதலியா அவர்களுக்கும் அவர்களுடைய ஆட்களுக்கும் சத்தியம் செய்து, அவர்களிடம் கூறினான்: “கல்தேயர்களின்[b] பணியாளர்களுக்கு[a] அஞ்சாதீர்கள். நாட்டில் குடியிருங்கள்; பாபிலோன் அரசனுக்குப் பணியாற்றுங்கள்; அப்போது உங்களுக்கு நலமுண்டாகும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணியாளர்கள்” என்பதை “அதிகாரிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாபிலோனிய ஆட்சியின் முகவர்கள் அல்லது நிர்வாகிகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “கல்தேயர்கள்” என்பது எபிரெயத்தில் உள்ள இனப்பெயர்; இச்சூழலில் இதை “பாபிலோனியர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டுக் கூறினான்
  rationale: நிபால் வடிவிலுள்ள שׁבע என்பது ‘ஆணையிடுதல்’ அல்லது ‘சத்தியம் செய்தல்’ என்று பொருள்படும். இங்கு அச்சமுற்றிருந்த தலைவர்களுக்கும் அவர்களுடைய ஆட்களுக்கும் கெதலியா உறுதியளிக்கும் சூழலில், இயல்பான நவீனத் தமிழில் ‘ஆணையிட்டுக் கூறினான்’ எனத் தரப்பட்டுள்ளது.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: அவர்களுடைய ஆட்களுக்கும்
  rationale: אַנְשֵׁי என்பது நேரடியாக ‘ஆட்கள்’ அல்லது ‘மனிதர்கள்’ என்று பொருள்படும். இச்சூழலில் தலைவர்களோடு இருந்த வீரர்கள் அல்லது உடனிருந்தவர்களைக் குறிக்கலாம்; அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் ‘ஆட்கள்’ என வைக்கப்பட்டுள்ளது.
- source_word: אַל תִּירְאוּ
  choice: அஞ்சாதீர்கள்
  rationale: எதிர்மறைக் கட்டளையின் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: கல்தேயர்களின் ஊழியர்களுக்கு
  rationale: עֲבָדִים என்பதன் அடிப்படைப் பொருள் ‘ஊழியர்கள்/பணியாளர்கள்.’ இங்கு பாபிலோனிய ஆட்சியின் முகவர்கள் அல்லது நிர்வாகிகளைக் குறிக்க வாய்ப்பிருந்தாலும், விளக்கமான ‘அதிகாரிகள்’ என்பதை முதன்மை உரையில் திணிக்காமல் அடிப்படைச் சொல்லாட்சி காக்கப்பட்டுள்ளது. ירא உடன் வரும் מִן தமிழில் ‘அஞ்சுதல்’ என்பதற்குரிய ‘-க்கு’ வேற்றுமையால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַכַּשְׂדִּים
  choice: கல்தேயர்கள்
  rationale: இது எபிரெய இனப்பெயரின் நேரடி வடிவம். இச்சூழலில் பாபிலோனியர்களைக் குறிக்கிறது; அந்தச் சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁבוּ בָאָרֶץ
  choice: நாட்டில் குடியிருந்து
  rationale: ישׁב என்பது ‘குடியிரு,’ ‘வாழ்,’ அல்லது ‘தங்கியிரு’ எனப் பொருள்படும். புதிய அரசியல் சூழலிலும் நாட்டிலேயே தொடர்ந்து வசிப்பதைக் குறிக்க ‘குடியிருந்து’ இயல்பாக உள்ளது.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசனுக்குப் பணியாற்றுங்கள்
  rationale: עבד என்பது ஒருவரை நோக்கிய பொருளுடன் வரும்போது ‘சேவை செய்/பணியாற்று’ எனப் பொருள்படும். அரசியல் கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும், ‘அடிபணியுங்கள்’ என்று விளக்கி விடாமல் மூலச்சொல்லின் விரிவை காக்கிறது.
- source_word: וְיִטַב לָכֶם
  choice: அப்போது உங்களுக்கு நலமுண்டாகும்
  rationale: இது ஒருவருக்கு காரியங்கள் நன்றாக அமையும் என்பதைச் சொல்லும் எபிரெய மரபுத்தொடர். ‘நலமுண்டாகும்’ என்பது வாக்குறுதியின் சாதகமான விளைவை இயல்பான தமிழில் தருகிறது; தொடர்பைத் தெளிவாக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
