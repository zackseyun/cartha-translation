  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘ஆட்கள்,’ ‘ஊழியர்கள்,’ ‘பணியாற்றுங்கள்’ ஆகிய சொற்கள் மூலத்தின் தெளிவின்மையையும் அரசியல் சூழலையும் மிகையாக விளக்காமல் காக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்களுடன் முதன்மை உரையில் இடம் பெற்றுள்ளன.
