source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்தையும்[a], அரச அரண்மனையையும், எருசலேமின் எல்லா வீடுகளையும், பெரிய வீடுகள் அனைத்தையும்[b] தீயிட்டுக் கொளுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “யாவேயின் வீடு.”
    reason: lexical_alternative
  - marker: b
    text: “பெரிய வீடுகள்” என்பது “விசாலமான வீடுகள்” அல்லது “முக்கியமான வீடுகள்” என்றும் பொருள்படலாம். எபிரெயச் சொல் அளவையோ சமூக முக்கியத்துவத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: தீயிட்டுக் கொளுத்தினான்
  rationale: שׂרף என்பதன் Qal wayyiqtol வடிவம் தொடர்கதைச் செயலைக் குறிக்கிறது. இறுதியில் மீண்டும் வரும் שָׂרַף בָּאֵשׁ என்பதன் வலியுறுத்தலையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: சொல்லடியாக ‘யெகோவாவின் வீடு’ என்றாலும், இச்சூழலில் வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் ‘ஆலயம்’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; சொல்லடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல் பெயராகவே காட்டுகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனை
  rationale: சொல்லடியாக ‘அரசனின் வீடு’; இங்கு அரசனுடைய அதிகாரப்பூர்வ இருப்பிடமான அரண்மனையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: எருசலேமிலிருந்த எல்லா வீடுகள்
  rationale: எருசலேம் நகருக்குள் இருந்த வீடுகள் என்ற உறவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל בֵּית גָּדוֹל
  choice: பெரிய வீடுகள் அனைத்தும்
  rationale: כָּל உடன் வரும் ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் பன்மையாக மொழிபெயர்க்கப்படுகிறது. גָּדוֹל அளவையோ முக்கியத்துவத்தையோ குறிக்கக்கூடும்; முதன்மை உரை நேரடியான ‘பெரிய’ என்பதை வைத்துக் கொண்டு மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: שָׂרַף בָּאֵשׁ
  choice: தீயிட்டுக் கொளுத்தினான்
  rationale: ‘தீயால் எரித்தான்’ என்ற எபிரெய வலியுறுத்தலை மறுபடியும் சொல்லும் செயற்கைத்தன்மையின்றித் தமிழில் இயல்பாகக் கொண்டுவருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பொதுப்பட்டமாக மாற்றாமல் ‘யெகோவா’ என்ற பெயராக வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பு காக்கப்பட்டு, தமிழில் இயல்புக்காக இறுதி எரித்தல் வினை ஒருங்கிணைக்கப்பட்டது.
