  terminology: «ஆலயம்» and «அரண்மனை» are contextually clear renderings of the two respective ‘houses’; the literal wording for Yahweh’s house is retained in a footnote. «பெரிய வீடுகள்» appropriately preserves the Hebrew adjective’s ambiguity between physical size and prominence, with alternatives supplied in the footnote.
  issues:
