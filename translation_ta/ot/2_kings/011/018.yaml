source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: ta
  text: நாட்டு மக்கள் அனைவரும் பாகாலின் ஆலயத்திற்குச் சென்று அதை இடித்துத் தள்ளினார்கள்[a]. அவனுடைய பலிபீடங்களையும் உருவங்களையும்[b] முழுமையாக நொறுக்கினார்கள்; பாகாலின் ஆசாரியனான மத்தானைப் பலிபீடங்களுக்கு முன்பாகக் கொன்றார்கள். பின்பு ஆசாரியர் யாவேயின் ஆலயத்திற்குப் பொறுப்பாளர்களை நியமித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “பாகாலின் வீடு.” இங்கு அது பாகாலின் ஆலயத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “உருவங்கள்” என்பதை “சிலைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பொறுப்பாளர்கள்” என்பதற்கான எபிரேயச் சொல், “பொறுப்புகள்,” “மேற்பார்வை ஏற்பாடுகள்” அல்லது அவற்றை ஏற்ற நபர்கள் என்றும் பொருள்படலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: நாட்டு மக்கள் அனைவரும்
  rationale: அரசியல்-சமூகப் பொருளுடைய எபிரேய மரபுத்தொடரை, ‘சாதாரண மக்கள்’ என்று அளவுக்கு மீறிக் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் ஆலயம்
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இங்கு வழிபாட்டுக் கட்டடத்தைக் குறிப்பதால் ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּתְּצֻהוּ
  choice: அதை இடித்துத் தள்ளினார்கள்
  rationale: ஒரு கட்டடத்தைப் பிடுங்கி அல்லது உடைத்து வீழ்த்தும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִזְבְּחֹתָיו
  choice: அவனுடைய பலிபீடங்கள்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு பாகாலைக் குறிப்பதாக இயல்பாகப் புரிகிறது; எபிரேய வடிவிலுள்ள தனிப்பட்ட உரிமைச் சுட்டலைப் பாதுகாக்கிறது.
- source_word: צְלָמָיו
  choice: அவனுடைய உருவங்கள்
  rationale: வழிபாட்டுக்குரிய உருவங்கள் அல்லது சிலைகள் என்ற பரந்த பொருளைத் தருகிறது; ‘விக்கிரகங்கள்’ என்று விளக்கவுரை சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: முழுமையாக நொறுக்கினார்கள்
  rationale: ‘உடைத்தார்கள்’ என்ற வினையுடன் வரும் வலியுறுத்தும் வினையடையின் முழுமைத் தன்மையையும் செயலின் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: பாகாலின் ஆசாரியனான மத்தான்
  rationale: பெயரையும் சமயப் பணியையும் நேரடியாகவும் தெளிவாகவும் அடையாளப்படுத்துகிறது.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: பலிபீடங்களுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடஞ்சார்ந்த பொருளைப் பாதுகாக்கிறது; ‘அருகில்’ என்று தெளிவில்லாமல் மாற்றுவதில்லை.
- source_word: וַיָּשֶׂם הַכֹּהֵן
  choice: பின்பு ஆசாரியர் ... நியமித்தார்
  rationale: ‘வைத்தார்/ஏற்படுத்தினார்’ என்ற வினை, நிர்வாகப் பொறுப்பு அளிக்கும் இச்சூழலில் ‘நியமித்தார்’ என இயல்பாக அமைகிறது.
- source_word: פְּקֻדּוֹת
  choice: பொறுப்பாளர்கள்
  rationale: இச்சொல் மேற்பார்வை, பொறுப்புகள் அல்லது அவற்றை ஏற்ற நபர்களைக் குறிக்கலாம். சூழலில் நபர்களைக் குறிக்கும் சாத்தியத்தை முதன்மைப்படுத்தும் வாசிக்க எளிய சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது; மெய்யான சொற்பொருள் ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் בַּיִת என்பதற்கு இயல்பான தமிழான ‘ஆலயம்’ பயன்படுத்தப்பட்டு, தேவப்பெயர் தனிப்பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்து தேவப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயரின் தனிப்பெயர்த் தன்மையை ‘யாவே’ எனப் பாதுகாக்கிறது.
- issue: מִזְבְּחֹתָיו மற்றும் צְלָמָיו ஆகியவற்றிலுள்ள ஆண்பால் பின்னொட்டின் குறிப்பு
  choice: பாகாலைக் குறிக்கும் ‘அவனுடைய’
  alternative: ஆலயத்தைக் குறிக்கும் ‘அதன்’
  rationale: ஆண்பால் ஒருமை பின்னொட்டு பாகாலை நேரடியாகக் குறிப்பதாக இயல்பாக உள்ளது. இருப்பினும் ஆலய வளாகத்தோடும் இப்பொருட்கள் தொடர்புடையவை என்ற சூழல் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாகாலின் ஆலயம்’ மற்றும் ‘யாவேயின் ஆலயம்’ என்ற இணையான அமைப்பு மூலத்தின் எதிரெதிர் அமைப்பைப் பாதுகாக்கிறது. ‘ஆசாரியர்’ என்பது சமயப் பணியைத் தெளிவாகக் குறிக்கும் மரியாதைநிலைச் சொல்; வன்முறைச் செயல்கள் மூலத்திற்கேற்ற நேரடியான மொழியில், தேவையற்ற தீவிரப்படுத்தல் இன்றி தரப்பட்டுள்ளன.
