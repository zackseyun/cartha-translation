base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: ta
  text: அவள் பார்த்தாள்; இதோ, அரசன் வழக்கப்படி தூணருகே நின்றுகொண்டிருந்தான்.[a] அதிகாரிகளும் எக்காளங்களும் அரசனருகே இருந்தனர்; நாட்டின் மக்கள் அனைவரும் மகிழ்ந்து எக்காளங்களை ஊதிக்கொண்டிருந்தனர். அப்போது அத்தாலியாள் தன் உடைகளைக் கிழித்து, “சதி! சதி!”[b] என்று கத்தினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூணிடத்தில்” அல்லது “தூண்மேல்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய முன்னிடைச்சொல் ஒன்றுக்கு மேற்பட்ட இடவியல் பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அரசத்துரோகம்! அரசத்துரோகம்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: அவள் பார்த்தபோது, இதோ
  rationale: ראה என்பதன் காணுதல்/பார்த்தல் பொருளையும், הִנֵּה தரும் திடீர் காட்சியுணர்வையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: அரசன் நின்றுகொண்டிருந்தான்
  rationale: எபிரெயப் பெயரெச்ச வடிவம் காட்டும் தொடர்நிலைக் காட்சியைத் தமிழின் தொடர்நிலை வினைவடிவம் வெளிப்படுத்துகிறது.
- source_word: עַל הָעַמּוּד
  choice: தூணருகே
  rationale: இச்சூழலில் עַל என்பது தூணின் மேல் என்பதற்குப் பதிலாக அறியப்பட்ட சடங்கிடமான தூணுக்கு அருகிலுள்ள நிலையைக் குறிக்கலாம்; இடவியல் ஐயத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: வழக்கப்படி
  rationale: இங்கு מִשְׁפָּט நீதித்தீர்ப்பை அல்ல, அரசவையின் நிலைபெற்ற நடைமுறையைக் குறிக்கிறது.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שָׂרִים என்பது தலைவர்கள் அல்லது அலுவலர்களைக் குறிக்கும் பரந்த சொல்; குறிப்பிட்ட பதவியை ஊகிக்காமல் அரசச் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: וְהַחֲצֹצְרוֹת אֶל הַמֶּלֶךְ
  choice: அரசனருகே அதிகாரிகளும் எக்காளங்களும் இருந்தனர்
  rationale: மசோரா உரை மனிதர்களைக் குறிக்கும் சொல்லை அல்ல, இசைக்கருவிகளையே வெளிப்படையாகக் குறிப்பிடுகிறது; ஆகவே ‘எக்காளக்காரர்கள்’ என்று மாற்றாமல் கருவிப் பெயர் காக்கப்படுகிறது.
- source_word: כָל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவரும்
  rationale: மக்கள்தொகையைக் குறிக்கும் வழக்கமான எபிரெயத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: மகிழ்ந்து எக்காளங்களை ஊதிக்கொண்டிருந்தனர்
  rationale: பொதுமக்களின் தொடர்ந்த கொண்டாட்டச் செயலையும் மகிழ்ச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: தன் உடைகளைக் கிழித்துக்கொண்டு
  rationale: அதிர்ச்சி மற்றும் துயரத்தின் பண்பாட்டு சைகையை நவீன வாசகருக்குப் புரியும் நேரடியான தமிழில் காக்கிறது.
- source_word: קֶשֶׁר קָשֶׁר
  choice: சதி! சதி!
  rationale: קֶשֶׁר என்பது ஆட்சிக்கு எதிரான சூழ்ச்சி அல்லது கிளர்ச்சியைச் சுட்டலாம்; மீளுரைப்பின் அவசரத்தன்மை காக்கப்படுகிறது.
