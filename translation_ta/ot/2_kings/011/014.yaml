translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. நாடகத் தன்மைக்காக ‘இதோ’வும், மூலத்தின் மீளுரைப்பும் காக்கப்பட்டுள்ளன; மசோரா உரையிலுள்ள ‘எக்காளங்கள்’ மனித வாசிப்பாக மாற்றப்படவில்லை.
