base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: ta
  text: உங்களில் உள்ள இரு பிரிவினர்[a]—ஓய்வுநாளன்று பணியிலிருந்து வெளியேறும் அனைவரும்[b]—அரசனுக்காக யாவேயின் இல்லத்தைக் காவல் காக்க வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘உங்களில் உள்ள இரண்டு கைகள்’; இங்கு ‘இரு பிரிவுகள்’ அல்லது ‘இரு குழுக்கள்’ என்பது பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஓய்வுநாளன்று வெளியேறும் அனைவரும்.’ இச்சூழலில், ஓய்வுநாளில் காவல் பணி மாறும்போது பணியிலிருந்து வெளியேறுவோரைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘அரசனை நோக்கி/அரசனைச் சார்ந்து யாவேயின் இல்லத்தின் காவலைக் காக்க வேண்டும்.’ எபிரெய முன்னிடைச்சொல் இங்கு தெளிவற்றது; யாவேயின் இல்லத்தைக் காவல் செய்வதன் மூலம் அரசனைப் பாதுகாப்பதே சூழலுக்குப் பொருத்தமான கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: இரு பிரிவினரும்
  rationale: சொல்லுக்குச் சொல் ‘இரண்டு கைகள்’ என்றாலும், இங்குள்ள காவல் மற்றும் பணிப்பிரிவு சூழலில் இரு குழுக்களை அல்லது பிரிவுகளைக் குறிக்கிறது. ‘இரு பிரிவினரும்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בָּכֶם
  choice: உங்களில் உள்ள
  rationale: உரையாடப்படுகிற காவலர்களிடையே அல்லது அவர்களிலிருந்து அமைந்த பிரிவுகள் என்பதைக் குறிக்கிறது.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளன்று பணியிலிருந்து வெளியேறும் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘ஓய்வுநாளில் வெளியேறுகிற அனைவரும்’ எனப்படுகிறது; சுற்றியுள்ள வசனங்களில் காவல் பணி மாறும் சூழல் இருப்பதால், பணியிலிருந்து வெளியேறுவோரைக் குறிக்கிறது.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: காவல் காக்க வேண்டும்
  rationale: வினைச்சொல்–பெயர்ச்சொல் சேர்க்கை காவற்பொறுப்பை நிறைவேற்றுவதைக் குறிக்கிறது. தமிழில் ‘காவல் காக்க வேண்டும்’ கட்டளையின் வலிமையையும் இயல்பான நடையையும் காக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: எபிரெயில் நேரடியாக ‘யாவேயின் வீடு/இல்லம்’. ‘ஆலயம்’ என்று விளக்கமாக்காமல், மூலத்தின் உருவகத்துக்கு நெருக்கமாக ‘இல்லம்’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனுக்காக
  rationale: אֶל என்ற முன்னிடைச்சொல் இங்கு கடினமானது. சூழலில் யாவேயின் இல்லத்தைக் காவல் செய்வது அரசனைப் பாதுகாக்கும் நோக்கத்துடன் இருப்பதால், ‘அரசனுக்காக’ என்பது இயல்பான தமிழில் பொருளைத் தருகிறது; மாற்று நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரான ‘ஆண்டவர்’ என்பதைப் பதிலிடாமல், அந்தப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: אֶל הַמֶּלֶךְ என்பதன் தொடர்பு
  choice: அரசனுக்காக
  alternative: அரசனை நோக்கி; அரசனைச் சார்ந்து
  rationale: எபிரெய முன்னிடைச்சொல்லின் தொடர்பு தெளிவற்றது. கதைச்சூழலில் ஆலயக் காவல் அரசனைப் பாதுகாப்பதற்காக அமைக்கப்படுவதால் முதன்மை உரையில் நோக்கம்/நன்மை சார்ந்த பொருள் தேர்ந்தெடுக்கப்படுகிறது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இராணுவ/காவல் சூழல் தெளிவாகத் தெரிய ‘பிரிவு’, ‘பணியிலிருந்து வெளியேறும்’, ‘காவல் காக்க’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டன. மூல எபிரெயின் அரிதான உருவகமும் கடினமான முன்னிடைச்சொல்லும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
