base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: ta
  text: காவலர்கள்[a] ஒவ்வொருவரும் தங்கள் ஆயுதங்களைக் கையில் ஏந்தியபடி, ஆலயத்தின்[c] வலப்பக்கத்திலிருந்து இடப்பக்கம் வரை[b], பலிபீடத்தின் அருகிலும் ஆலயத்தின் அருகிலும், அரசனைச் சுற்றி நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓடுபவர்கள்’; அதாவது, அரச காவலர்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஆலயத்தின் வலப்பக்கத்திலிருந்து ஆலயத்தின் இடப்பக்கம் வரை.’ ஆலயத்தின் திசையமைப்பைக் கருத்தில் கொண்டு இதை ‘தெற்குப் பக்கத்திலிருந்து வடக்குப் பக்கம் வரை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் ‘வீடு’; இங்கு அது ஆலயக் கட்டடத்தையோ ஆலய வளாகத்தையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: காவலர்கள்
  rationale: இந்தச் சொல் சொல்லடிப்படையில் ‘ஓடுபவர்கள்’ என்று பொருள்பட்டாலும், இங்குள்ள அரச மற்றும் படைச் சூழலில் ஆயுதமேந்திய அரச காவலர்களைக் குறிக்கிறது. ‘காவலர்கள்’ என்பது நவீன தமிழில் தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ஒவ்வொருவரும் தங்கள் ஆயுதங்களைக் கையில் ஏந்தியபடி
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; כְּלִי காவலர் சூழலில் ‘ஆயுதங்கள்’ எனப் பொருள்படும். கையில் வைத்திருந்த ஆயத்தநிலையை ‘ஏந்தியபடி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: வலப்பக்கத்திலிருந்து இடப்பக்கம் வரை
  rationale: כֶּתֶף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; கட்டடத்தின் இடவமைப்பைக் குறிக்கும் இச்சூழலில் அது ‘பக்கம்’ என்று இயல்பாகப் பொருள்படுகிறது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயத்தில் ‘வீடு’ என்ற சொல் வந்தாலும், இச்சூழலில் அது யெகோவாவின் ஆலயத்தைக் குறிக்கிறது. தமிழில் ‘ஆலயம்’ என்பது குறிப்பிடப்படுகிற கட்டடத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: வலப்பக்கம் ... இடப்பக்கம்
  rationale: சொற்களின் நேரடிப் பொருளான ‘வலது/இடது’ பாதுகாக்கப்படுகிறது. ஆலயத் திசையமைப்பின்படி ‘தெற்கு/வடக்கு’ எனப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: பலிபீடத்தின் அருகிலும் ஆலயத்தின் அருகிலும்
  rationale: ל முன்னொட்டு இச்சுருக்கமான இடவமைப்பு விளக்கத்தில் நிலை அல்லது திசையைக் குறிக்கலாம். ‘அருகில்’ என்பது தேவையற்ற துல்லியத்தைத் திணிக்காமல் இடத்தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: அரசனைச் சுற்றி
  rationale: அரசனை எல்லாப் பக்கங்களிலும் பாதுகாப்பாகச் சூழ்ந்திருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
