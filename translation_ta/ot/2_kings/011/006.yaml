  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: ta
  text: மூன்றில் ஒரு பகுதியினர் சூர் வாசலிலும், மூன்றில் ஒரு பகுதியினர் ஓட்டக்காரர்களுக்குப் பின்னாலுள்ள வாசலிலும்[a] இருக்க வேண்டும்; யாரும் உள்ளே நுழையாதபடி மாளிகையைக் காவல் காக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓட்டக்காரர்கள்” என்பது அரசத் தூதர்களையோ அரச மெய்க்காவலர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் பொருள் உறுதியற்றது; “ஒரு தடுப்பாக” அல்லது “பாதுகாப்புக்காக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: ஒரு மூன்றாம் பகுதியினர்
  rationale: பெண்பால் ஒருமை வரிசை எண்ணான இச்சொல் சூழலில் காவலர்களின் மூன்று பிரிவுகளில் ஒரு பிரிவைக் குறிக்கிறது; தமிழில் நபர்களைக் குறிக்கும் வகையில் ‘பகுதியினர்’ என்பது இயல்பாக உள்ளது.
- source_word: בְּשַׁעַר סוּר
  choice: சூர் வாசலில்
  rationale: שַׁעַר என்பதற்கு ‘வாசல்’; סוּר இங்கு ஓர் இடம் அல்லது வாசலின் பெயராக எடுத்துக்கொள்ளப்பட்டு மொழிபெயர்க்காமல் ‘சூர்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: ஓட்டக்காரர்களுக்குப் பின்னாலுள்ள வாசலில்
  rationale: אַחַר என்பதன் நேரடியான இடப்பொருள் ‘பின்னால்’; கட்டிட அமைப்பை அளவுக்கு மீறி விளக்காமல் எபிரெயச் சொல்லமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: הָרָצִים
  choice: ஓட்டக்காரர்கள்
  rationale: רוץ (‘ஓடு’) என்பதிலிருந்து வந்த இப்பெயர்ச்சொல்லின் நேரடிப்பொருள் ‘ஓட்டக்காரர்கள்’; அரசச் சூழலில் இது மெய்க்காவலர்களையோ தூதர்களையோ குறிக்கக்கூடும் என்பதால் அந்தச் செயல்பாட்டுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: காவல் காத்துக்கொள்ளுங்கள்
  rationale: ஒரே வேரிலிருந்து வந்த வினைச்சொல்–பெயர்ச்சொல் இணைப்பு காவலை வலியுறுத்துகிறது; தமிழில் இயல்பான ஒத்திசைவு கொண்ட ‘காவல் காத்துக்கொள்ளுங்கள்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: הַבַּיִת
  choice: மாளிகை
  rationale: בַּיִת அடிப்படையில் ‘வீடு’ என்றாலும் இவ்வரசச் சூழலில் மன்னரின் குடியிருப்பு அல்லது அரண்மனை வளாகத்தைக் குறிக்கிறது; ‘மாளிகை’ என்பது ‘அரண்மனை’ என்பதைவிட சற்றுக் குறைவாக விளக்கமளித்து, தமிழில் இயல்பான சூழற்பொருளை வழங்குகிறது.
- source_word: מַסָּח
  choice: யாரும் உள்ளே நுழையாதபடி
  rationale: அரிதானதும் பொருள் உறுதியற்றதுமான இச்சொல், காவலின் தடுப்பு நோக்கத்தைக் குறிப்பதாகச் சூழல் காட்டுகிறது. வாசிக்க இயல்பான நோக்கத் தொடராக மொழிபெயர்க்கப்பட்டு, உறுதியின்மையும் மாற்றுப் பொருள்களும் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
