  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: ta
  text: அவன் அவளுடன் கர்த்தருடைய ஆலயத்தில் ஆறு ஆண்டுகள் ஒளிந்திருந்தான்; அப்போது அத்தாலியாள் நாட்டை ஆட்சி செய்துகொண்டிருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: கர்த்தருடைய ஆலயம்
  rationale: இது யெகோவாவுக்குரிய ஆலயத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மதிப்புடனும் ஒலிக்க ‘கர்த்தர்’ என்ற மரபான பிரதிநிதிப்பும், கட்டிடத்தைச் சுட்ட ‘ஆலயம்’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: מִתְחַבֵּא
  choice: ஒளிந்திருந்தான்
  rationale: Hitpael பங்கேற்பு வடிவம் தொடர்ச்சியாக மறைந்து வாழ்ந்த நிலையைச் சுட்டுகிறது; ‘ஒளிந்திருந்தான்’ இதை இயல்பான தமிழில் தருகிறது.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: நாட்டை ஆட்சி செய்துகொண்டிருந்தாள்
  rationale: பெண்பால் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான ஆட்சிநிலையைத் தெளிவாக வெளிப்படுத்துகிறது; הָאָרֶץ இச்சூழலில் ஆட்சிக்குட்பட்ட நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: யெகோவா / யாவே
  rationale: இவ்வசனத்தில் பெயரின் தனிப்பட்ட உச்சரிப்பை விவாதப்பொருளாக்காமல், தமிழ் வேதாகம மரபில் பரவலாகப் புரிந்துகொள்ளப்படும் ‘கர்த்தர்’ பயன்படுத்தப்பட்டது; எந்தப் பிரிவுசார் கருத்தும் சேர்க்கப்படவில்லை.
- issue: מִתְחַבֵּא என்பதன் செயற்பாட்டு நுணுக்கம்
  choice: ஒளிந்திருந்தான்
  alternative: ஒளித்து வைக்கப்பட்டிருந்தான்
  rationale: எபிரெய வடிவம் இலக்கணரீதியாக தன்னை மறைத்துக்கொண்ட/ஒளிந்திருந்த தொடர்நிலையை முன்வைக்கிறது. முந்தைய வசனத்தின் சூழலில் பிறர் அவனை மறைத்திருந்தாலும், இவ்வசனத்தை நேரடியாகச் செயப்பாட்டுவினையாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மதிப்புமிக்க தமிழ். எபிரெய வாக்கியத்தின் தொடர்நிலையை ‘ஆறு ஆண்டுகள் ஒளிந்திருந்தான்’ மற்றும் ‘ஆட்சி செய்துகொண்டிருந்தாள்’ மூலம் காத்து, இரு நிகழ்வுகளின் ஒரேகாலத் தன்மை ‘அப்போது’ என்பதால் இயல்பாக இணைக்கப்பட்டது.
