  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: ta
  text: எனவே, நூறுபேரின் தலைவர்கள் ஆசாரியரான யோய்தா கட்டளையிட்ட அனைத்தின்படியும் செய்தார்கள். ஒவ்வொருவரும் ஓய்வுநாளில் பணிக்கு வந்தவர்களையும் ஓய்வுநாளில் பணியிலிருந்து சென்றவர்களையும்[a] தன் ஆட்களாக அழைத்துக்கொண்டு, ஆசாரியரான யோய்தாவிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் சொல்லுக்குச் சொல்லாக, ‘ஓய்வுநாளில் உள்ளே வருகிறவர்களையும் ஓய்வுநாளில் வெளியே செல்கிறவர்களையும்’ என்று மொழிபெயர்க்கலாம். சூழல், பணிக்கு வரும் அணியினரையும் பணியிலிருந்து செல்லும் அணியினரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூறு பேருக்குத் தலைவர்களான அதிகாரிகள்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது அதிகாரிகளையும், הַמֵּאוֹת என்பது நூறு பேர் கொண்ட பிரிவுகளையும் குறிக்கிறது. இத்தொடர் இராணுவ அமைப்பைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தையும் அப்படியே
  rationale: கட்டளைக்கு முழுமையாக இணங்கியதைத் தமிழில் இயல்பாகவும் வலுவாகவும் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: யோய்தாவின் அதிகாரபூர்வமான ஆணையை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: ஒவ்வொருவரும் ... தங்கள் ஆட்களை
  rationale: אִישׁ என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொருவரும்’ என்றும், ஒவ்வொரு அதிகாரியின் கீழிருந்த ஆட்களை ‘தங்கள் ஆட்கள்’ என்றும் இயல்பாகக் காட்டுகிறது.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளில் பணிக்கு வந்தவர்கள்
  rationale: சொல்லின் அடிப்படை ‘வருகிறவர்கள்’ என்றாலும், சூழலில் காவல் பணிக்கான புதிய அணியினர் வருவதைக் குறிக்கிறது.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: பணியிலிருந்து சென்றவர்கள்
  rationale: எதிரிணையான ‘வெளியேறுகிறவர்கள்’ என்பது சூழலில் பணிமுறை முடிந்து செல்லும் அணியினரைக் குறிக்கிறது; ‘பணியிலிருந்து’ என்பது அந்தச் செயல்பாட்டுப் பொருளைத் தெளிவாக்குகிறது.
- source_word: עִם
  choice: உள்ளடக்கிய
  rationale: வரும் அணியினரும் செல்லும் அணியினரும் ஒவ்வொரு அதிகாரியின் ஆட்களோடு ஒன்றாக அழைத்துவரப்பட்டதைத் தமிழ் வாக்கிய அமைப்பில் தெளிவாக இணைக்கிறது.
- source_word: וַיָּבֹאוּ אֶל
  choice: வந்தார்கள்
  rationale: எளிய கதைநடை இயக்கவினையாகிய எபிரெயச் சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: யோய்தாவின் பணிநிலையைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் பதம்.
