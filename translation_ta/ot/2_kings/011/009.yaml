translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘ஓய்வுநாள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பணிமுறை குறித்த சூழல்பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டு, எபிரெயத்தின் நேரடி இயக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
