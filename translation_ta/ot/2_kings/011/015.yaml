base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: ta
  text: அப்போது ஆசாரியனாகிய யோய்தா, படைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த நூற்றுப்படைத் தலைவர்களுக்குக் கட்டளையிட்டு, “அணிவரிசைகளின் நடுவாக அவளை வெளியே அழைத்துச் செல்லுங்கள்[a]. அவளைப் பின்தொடர்ந்து வருகிற எவரையும் வாளால் கொல்லுங்கள்” என்றான். ஏனெனில், “யாவேயின் ஆலயத்தில் அவள் கொல்லப்படக் கூடாது” என்று ஆசாரியன் சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் கடினமானது. “அணிவரிசைகளுக்கு வெளியே” அல்லது “படைவரிசைகளுக்கு இடையிலுள்ள பகுதிக்கு” என்றும் பொருள்கொள்ளலாம்; ஒழுங்காக நிறுத்தப்பட்டிருந்த காவலர்களின் அணிகளின் ஊடாக அவளை வெளியே அழைத்துச் செல்ல வேண்டும் என்பதே பெரும்பாலும் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூற்றுப்படைத் தலைவர்கள்
  rationale: ஒவ்வொரு நூறு வீரர்களைக் கொண்ட படைப்பிரிவுக்குத் தலைமை வகித்தவர்களைக் குறிக்கும் யூதப் படைத்துறைப் பட்டத்தை இயல்பான தமிழில் தருகிறது; ரோமப் படைத்துறைச் சொல்லை இறக்குமதி செய்யவில்லை.
- source_word: פְּקֻדֵי הַחַיִל
  choice: படைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: פקד வேரிலிருந்து வந்த செயல்பாட்டு வினையெச்சத்தின் நியமனம் மற்றும் பொறுப்பு ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: அவளை ... வெளியே கொண்டுபோங்கள்
  rationale: יצא என்பதன் காரணவினை ஏவல் வடிவம் ஒருவரை வெளியே கொண்டுபோவதைக் குறிக்கிறது; கட்டளைச் சூழலுக்கு இது இயல்பான தமிழ்.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: படைவீரர்களின் அணிவரிசைகளுக்கு நடுவே
  rationale: எபிரெயச் சொற்றொடர் கடினமானது. ஆலயத்திலிருந்து ஒழுங்குபடுத்தப்பட்ட காவல் அணிகளின் ஊடாக அல்லது அவற்றின் நடுப்பகுதிக்கு அவளைக் கொண்டுபோவதே சூழலுக்குப் பொருத்தமான பொருள்; உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: அவளைப் பின்தொடர்ந்து வருகிற எவனையும்
  rationale: ஒருமைச் செயல்பாட்டு வினையெச்சம் இங்கு பொதுப்பொருளில் வருகிறது. அவளுக்குப் பின்னால் வரும் அல்லது அவளை ஆதரித்துப் பின்தொடரும் எவரையும் உள்ளடக்கக்கூடிய மூலத்தின் திறந்த பொருளை மொழிபெயர்ப்பு காக்கிறது.
- source_word: הָמֵת בֶּחָרֶב
  choice: வாளால் கொன்றுபோடுங்கள்
  rationale: மரண தண்டனையை நிறைவேற்றும் வலுவான கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַל תּוּמַת
  choice: அவள் கொல்லப்படக் கூடாது
  rationale: எதிர்மறைச் செயப்பாட்டு விருப்பவினை வடிவத்தின் தடைப்பொருளை நேரடியாகக் காட்டுகிறது; சூழலிலிருந்து பெண்பால் எழுவாய் வெளிப்படையாகத் தரப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בית என்பதன் இச்சூழல் குறிப்பது எருசலேம் ஆலயத்தை என்பதால், சொற்சொல்லான ‘வீடு’ என்பதைக் காட்டிலும் சாதாரண வாசகருக்குத் தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பைச் சார்ந்தது.
- issue: அத்தாலியாளைப் பின்தொடர்பவரைப் பற்றிய கட்டளை
  choice: அவளைப் பின்தொடர்ந்து வருகிற எவனையும்
  alternative: அவளுக்குப் பின்னால் வருகிறவனை
  rationale: பின்தொடர்வது உடல்ரீதியாக பின்னால் வருவதையோ அவளுக்கு ஆதரவாகச் சேர்வதையோ குறிக்கலாம். தமிழ் உரை அந்தச் சூழல்சார் இரட்டைப் பொருள் சாத்தியத்தைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று விவரணைக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நூற்றுப்படைத் தலைவர்கள்’ என்பது காலத்திற்குப் புறம்பான ரோமச் சொல்லைத் தவிர்க்கிறது. கடினமான எபிரெய இடவழிச் சொற்றொடரின் உறுதியின்மை [a] அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
