base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: ta
  text: பின்பு அவர் நூறுபேருக்குத் தலைவர்களையும், காரியர்களையும்[a], ஓட்டக்காரர்களையும்[b], நாட்டின் மக்கள் அனைவரையும் தம்முடன் அழைத்துக்கொண்டார். அவர்கள் அரசனை யாவேயின் ஆலயத்திலிருந்து கீழே அழைத்துவந்து, ஓட்டக்காரர்களின் வாயில் வழியாக அரண்மனைக்கு வந்தார்கள். அரசன் அரசர்களின் அரியணையில் அமர்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காரியர்கள்” என்பதற்கான எபிரெயச் சொல் உறுதியற்றது; “கிரேத்தியர்” அல்லது “மெய்க்காவலர்” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஓட்டக்காரர்கள்” என்பது சொல்லுக்கு சொல் மொழிபெயர்ப்பு. இங்கு அது அரசக் காவலர்களையோ தூதுவர்களையோ குறித்திருக்கலாம்; “ஓட்டக்காரர்களின் வாயில்” என்பதிலும் இதே சொல் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அவர் … அழைத்துக்கொண்டார்
  rationale: எபிரெய வினைச்சொல்லின் ஒருமை எழுவாய் முந்தைய சூழலில் உள்ள யோய்தாவைக் குறிக்கிறது; பட்டியலிடப்பட்டவர்களைத் தம்முடன் கூட்டிக்கொண்டார் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூறுபேருக்குத் தலைவர்கள்
  rationale: இராணுவப் பிரிவின் அமைப்பை வெளிப்படுத்தும் நேரடியான மொழிபெயர்ப்பு; ரோமச் சூழலை நினைவூட்டும் பதவிப்பெயரைத் தவிர்க்கிறது.
- source_word: הַכָּרִי
  choice: காரியர்
  rationale: சொல்லின் அடையாளமும் பணியும் உறுதியல்லாததால், அதை மெய்ப்பெயர்த்து மொழிபெயர்த்து அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: הָרָצִים
  choice: ஓட்டக்காரர்கள்
  rationale: சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; அரசக் காவலர் அல்லது தூதுவர் என்ற சாத்தியமான பணிப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவரும்
  rationale: யூதா நாட்டின் மக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; இது பொதுமக்கள் மட்டுமே அல்லது ஒவ்வொரு குடிமகனும் என்று தேவையின்றி குறுக்குவதில்லை.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: அவர்கள் அரசனை … கீழே அழைத்துவந்து
  rationale: பன்மை வினைச்சொல்லின் எழுவாய் கூடியிருந்த குழு; ஆலயப் பகுதியிலிருந்து அரண்மனை நோக்கிய கீழிறக்கத் திசையையும் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית יְהוָה
  choice: யெகோவாவின் ஆலயத்திலிருந்து
  rationale: בֵּית இங்கு ஆலயத்தைக் குறிக்கிறது; יְהוָה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்பட்ட யெகோவா என வழங்கப்படுகிறது.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: ஓட்டக்காரர்களின் வாயில் வழியாக
  rationale: எபிரெய தொடரின் அமைப்பையும் அதே பணிக்குழுவுக்கான சொல்லையும் தொடர்ந்து தக்கவைக்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரண்மனைக்குள்
  rationale: சொற்பொருளில் ‘அரசனின் வீடு’ என்றாலும், நவீன தமிழில் அரசரின் அதிகாரப்பூர்வ இல்லத்தைத் தெளிவாகக் குறிக்கும் இயல்பான சொல் ‘அரண்மனை.’
- source_word: וַיֵּשֶׁב עַל כִּסֵּא הַמְּלָכִים
  choice: அரசன் அரசர்களின் அரியணையில் அமர்ந்தான்
  rationale: ஒருமை வினைச்சொல்லின் எழுவாய் அரசன் என்பதைத் தெளிவுபடுத்தி, ‘அரசர்களின்’ என்ற மூலத்தின் பன்மையை வம்சத் தொடர்ச்சி சார்ந்த அதன் நுணுக்கத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்து இறைத்தனிப்பெயர் உள்ளது. அதைப் ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது; தமிழில் வழக்கமும் புரிதலும் பெற்ற வடிவம் ‘யெகோவா,’ ஆனால் ‘யாவே’ என்பது மூல உச்சரிப்பை மறுகட்டமைக்கும் பரவலான மாற்று வடிவம்.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினை எழுவாய் மாற்றங்கள் தெளிவாக வைக்கப்பட்டுள்ளன; உறுதியற்ற குழுப்பெயர்கள் விளக்கமாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
