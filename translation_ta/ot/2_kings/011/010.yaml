base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: ta
  text: அப்போது ஆசாரியன், நூறு வீரர் அணிகளின் தலைவர்களுக்கு, யாவேவின் ஆலயத்தில்[b] இருந்த தாவீது அரசருக்குச் சொந்தமான ஈட்டிகளையும்[a] கேடயங்களையும் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஈட்டி’ என்று ஒருமையில் உள்ளது; அது கூட்டுப்பொருளில் ‘ஈட்டிகள்’ எனக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேவின் ஆலயத்தில்’ என்பது சொல்லுக்குச் சொல் ‘யாவேவின் வீட்டில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: அப்போது ... கொடுத்தான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: குறிப்பிட்ட ஒருமைச் சொல்லான ‘the priest’ என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: நூறுபேர் கொண்ட படைப்பிரிவுகளின் தலைவர்களிடம்
  rationale: இது நூறு வீரர்களைக் கொண்ட இராணுவ அலகுகளுக்குத் தலைமை வகித்தவர்களைக் குறிக்கிறது; சொற்சொல் அமைப்பைவிட பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַחֲנִית
  choice: ஈட்டிகளையும்
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும், பல தலைவர்களிடம் ஆயுதங்கள் வழங்கப்படும் சூழலும் பன்மையான ‘கேடயங்கள்’ என்பதுடன் இணைந்திருப்பதும் இதைக் கூட்டுப்பொருள் ஒருமையாகப் புரிந்துகொள்ள ஆதரிக்கின்றன.
- source_word: הַשְּׁלָטִים
  choice: கேடயங்களையும்
  rationale: அரச அல்லது ஆலய ஆயுதச் சேமிப்புச் சூழலில் இச்சொல்லின் சிறந்த ஆதாரமுள்ள பொருள் தற்காப்புக் கேடயங்கள் என்பதாகும்.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசனுக்குச் சொந்தமான
  rationale: எபிரெய உறவுக்கூற்று உடைமையைச் சுட்டுகிறது; தமிழ் சொற்றொடர் இதை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּבֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்தில்
  rationale: ‘யெகோவாவின் வீட்டில்’ என்பது சொற்சொல் வடிவம்; இச்சூழலில் அது ஆலயத்தைக் குறிக்கும் என்பதால் முதன்மை உரையில் இயல்பான ‘ஆலயம்’ பயன்படுத்தப்பட்டு மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூல உரை நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்க ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; பட்டப்பெயரான ‘கர்த்தர்’ என மாற்றப்படவில்லை.
- issue: הַחֲנִית என்பது ஒருமையா கூட்டுப்பொருளா
  choice: ஈட்டிகள்
  alternative: ஈட்டி
  rationale: வடிவத்தில் ஒருமை என்ற உண்மையை அடிக்குறிப்பு பாதுகாக்கிறது; பல படைத்தலைவர்களுக்கு ஆயுதங்கள் கொடுக்கப்படும் சூழலில் கூட்டுப்பொருள் வாசிப்பு முதன்மை உரையில் இயல்பானது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. இராணுவ அமைப்பைக் குறிக்கும் சொற்றொடர் விளக்கமாகத் தரப்பட்டுள்ளது; மூலத்தின் ஒருமை/கூட்டுப்பொருள் ஐயமும் ‘வீடு/ஆலயம்’ வேறுபாடும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
