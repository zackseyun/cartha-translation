source:
  edition: WLC
  text: וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ/ן הַ/שְּׁלִשִׁ֤ית מִ/כֶּם֙ בָּאֵ֣י הַ/שַּׁבָּ֔ת וְ/שֹׁ֣מְרֵ֔י מִשְׁמֶ֖רֶת בֵּ֥ית הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: ta
  text: 'அவர் அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “நீங்கள் செய்ய வேண்டியது இதுதான்: ஓய்வுநாளன்று வருகிற உங்களில் மூன்றில் ஒரு பகுதியினர் அரசனின் அரண்மனையைக்[a] காவல் காக்க வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அரசனின் வீடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: அவர் அவர்களுக்குக் கட்டளையிட்டார்
  rationale: צוה என்பதன் பியேல் வடிவம் அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது; ‘கட்டளையிட்டார்’ அந்த வலிமையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: எபிரெய உரையறிமுகச் சூத்திரத்தைத் தமிழில் இயல்பாகத் தொடர்ந்து இணைக்கிறது.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: நீங்கள் செய்ய வேண்டியது இதுதான்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், மூலத்தின் சுட்டும் தன்மையையும் கட்டளை வலிமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: உங்களில் மூன்றில் ஒரு பகுதியினர்
  rationale: குழுவில் மூன்றில் ஒரு பங்கைக் குறிக்கும் எபிரெயப் பகுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளன்று வருகிற
  rationale: ஓய்வுநாளில் காவல் பணி மாறும் வேளையில் வருவோரைக் குறிக்கும் சொற்றொடர்; ‘பணிக்கு’ என்பதை மூலத்தில் இல்லாததால் முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: காவல் காக்க வேண்டும்
  rationale: காவல் பொறுப்பை நிறைவேற்றும் பொருளையும் இங்குள்ள அறிவுறுத்தல் வலிமையையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசனின் அரண்மனை
  rationale: சொல்லர்த்தமாக ‘அரசனின் வீடு’ என்றாலும், இச்சூழலில் அரச மாளிகை வளாகத்தைக் குறிக்கிறது; ‘அரண்மனை’ நவீன தமிழில் இயல்பான சூழற்பொருளை அளிக்கிறது, சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
