  terminology: ‘கட்டளையிட்டுச் சொன்னார்,’ ‘ஓய்வுநாள்,’ ‘காவல் காக்க,’ மற்றும் ‘அரண்மனை’ ஆகியவை சூழலுக்கும் பதிவிற்கும் ஏற்றவை. בֵּית הַמֶּלֶךְ என்பதன் சொல்லர்த்தமான மாற்றான ‘அரசனின் வீடு’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறி சரியான இடத்தில் உள்ளது.
