translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வரலாற்றுக் கதைநடையும் காக்கப்பட்டுள்ளன. ‘அவர்’ என்ற எழுவாய் முந்தைய வசனத்தைச் சார்ந்தபடியே விடப்பட்டு, பெயர் ஊகித்து சேர்க்கப்படவில்லை. கட்டளையின் வலிமை ‘வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
