  source_fidelity: மூல எபிரெயத்தின் கட்டளைத் தொனி, ‘நீங்கள் செய்ய வேண்டியது இதுதான்’ என்ற அறிவுறுத்தல் அமைப்பு, ஓய்வுநாளில் வருகிறவர்களில் மூன்றில் ஒரு பங்கு, மற்றும் அரசனின் வீட்டைக் காவல் காக்கும் பொறுப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. எபிரெயத்தில் உள்ள பங்கேற்பியல் காவல்-பணிக் குறிப்பைத் தமிழ் ‘காவல் காக்க வேண்டும்’ இயல்பாகவும் போதிய கட்டளை வலிமையுடனும் தருகிறது.
