  source_fidelity: மூலத்தின் நிகழ்வுவரிசை—ஆளனுப்புதல், அந்த அதிகாரிகளையும் காவல் பிரிவுகளையும் கூட்டிவருதல், ஆலயத்தில் உடன்படிக்கை செய்தல், சத்தியம் செய்யவைத்தல், அரசனின் மகனைக் காட்டுதல்—பாதுகாக்கப்பட்டுள்ளது. ஆனால் வரைவில் ‘அழைத்துவர ஆளனுப்பினார்’ என்பதற்குப் பின்னர் மீண்டும் ‘வரவழைத்தார்’ என வருவது வினைத் தொடரைத் தேவையின்றி இரட்டிப்பாக்குகிறது. மேலும் וַיַּשְׁבַּע אֹתָם என்பது அவர்களைச் சத்தியம் செய்யவைத்தார் என்பதே; ‘ஆணையிடச் செய்தார்’ தமிழில் வேறு பொருளைத் தரக்கூடும்.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் தெளிவாக உள்ளது. ‘நூறு பேர் கொண்ட படைப்பிரிவுகளின் தலைவர்கள்’ என்பது மூலத்தின் இராணுவப் பொறுப்பை இயல்பாக வெளிப்படுத்துகிறது; ‘சத்தியம் செய்ய வைத்தார்’ என்பது முறையான சூழலுக்கும் பொருந்துகிறது.
  terminology: யְהוָה, வழங்கப்பட்ட ஆங்கில POB தீர்மானத்துக்கு இணங்க, ‘யாவே’ எனத் தனிப்பெயராக வழங்கப்பட்டுள்ளது. ‘உடன்படிக்கை,’ ‘காரியர்,’ மற்றும் ‘ஓட்டக்காரர்கள்’ ஆகியவை மூலத்தின் சொல்லாட்சியையும் அதன் உறுதியற்ற இடங்களையும் காக்கின்றன. காரியர் குறித்த மாற்று வாசிப்பும் ஓட்டக்காரர்கள் குறித்த பண்பாட்டு விளக்கமும் அடிக்குறிப்புகளில் தக்கவைக்கப்பட்டுள்ளன.
