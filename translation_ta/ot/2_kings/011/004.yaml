  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: ta
  text: ஏழாம் ஆண்டில், யெகோயாதா நூறு பேர் கொண்ட படைப்பிரிவுகளின் தலைவர்களையும், காரியரையும்[a], ஓட்டக்காரர்களையும்[b] அழைக்க ஆளனுப்பினார்; அவர்களை யாவேயின் ஆலயத்தில் தம்மிடம் கொண்டு வந்தார். அவர்களுடன் ஓர் உடன்படிக்கை செய்து, யாவேயின் ஆலயத்தில் அவர்களைச் சத்தியம் செய்ய வைத்தார். பின்பு அரசனின் மகனை அவர்களுக்குக் காட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிரேத்தியர்.” எபிரெயச் சொல் அரச மெய்க்காவல் படையின் ஒரு பிரிவைக் குறித்திருக்கலாம்; அதன் துல்லியமான அடையாளம் உறுதியாகத் தெரியவில்லை.
    reason: alternative_reading
  - marker: b
    text: “ஓட்டக்காரர்கள்” என்பது அரச மெய்க்காவலர்களையோ அரச தூதர்களையோ குறிக்கும் பெயராக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: ஏழாம் ஆண்டில்
  rationale: காலப் பின்னணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தொடக்க இணைப்புச்சொல் தமிழில் அவசியமில்லை.
- source_word: שָׁלַח וַיִּקַּח
  choice: அழைத்துவர ஆளனுப்பினார்
  rationale: எழுத்துப்படி ‘அனுப்பி... அழைத்துக்கொண்டார்’; இங்கு ஆளனுப்பி அதிகாரிகளை வரவழைத்த செயலைத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூறுபேருக்குத் தலைவர்களாக இருந்த அதிகாரிகள்
  rationale: நூறு பேர் கொண்ட படைப்பிரிவுகளுக்குப் பொறுப்பான அதிகாரிகள் என்ற பொருளை ரோமச் சொல்லாட்சியைப் புகுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: לַכָּרִי
  choice: காரியர்
  rationale: குழுவின் துல்லியமான அடையாளம் உறுதியில்லை; எபிரெயக் குழுப்பெயரை ஒலிபெயர்த்து, மாற்று அடையாளத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וְלָרָצִים
  choice: ஓட்டக்காரர்கள்
  rationale: சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது; அரச காவலர் அல்லது தூதர் என்ற பணிப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בית என்பதன் சூழல்சார் குறிப்பு ஆலயம்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: அவர்களுடன் ஓர் உடன்படிக்கை செய்து
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளையும் அதன் அரசியல் மற்றும் சமயக் கனத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: அவர்களை ஆணையிடச் செய்தார்
  rationale: 'வினையின் காரணவினைப் பொருளைத் துல்லியமாகக் காட்டுகிறது: யெகோயாதா அவர்களை ஆணையிடும்படி செய்தார்.'
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என மாற்றாமல் தனிப்பெயராகக் காட்டுகிறது. தமிழில் நீண்டகாலமாக அறியப்பட்ட ‘யெகோவா’ வடிவம் வாசகர்களுக்கு இயல்பானது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டுருவாக்கும் பரவலான மாற்று.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாய் இருந்தாலும் வரலாற்று நிகழ்வின் கண்ணியத்தையும் உடன்படிக்கை மற்றும் ஆணையின் முறையான தன்மையையும் காக்கும் நடை. மூலத்தின் நீண்ட தொடர் வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
