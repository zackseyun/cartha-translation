base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: ta
  text: அத்தாலியா காவலர்களும்[a] மக்களும் எழுப்பிய சத்தத்தைக்[b] கேட்டாள்; அவள் யாவேயின் இல்லத்திலிருந்த[c] மக்களிடம் சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘ஓட்டக்காரர்கள்.’ அரச மன்றச் சூழலில் இவர்கள் அரசக் காவலர்களையோ மெய்க்காவலர் படையையோ குறித்திருக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: ‘சத்தம்’ என்பதற்கான எபிரெயச் சொல்லை ‘ஒலி’ அல்லது ‘குரல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்படி, ‘யாவேயின் வீடு’; இங்கு ஆலயத்தையும் அதன் வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: கேட்டபோது
  rationale: שׁמע இங்கு கவனமாகச் செவிசாய்த்தலை அல்ல, ஒலியைக் கேட்டறிந்ததைச் சுட்டுகிறது. தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழ் காலத்தொடராக மாற்றுகிறது.
- source_word: עֲתַלְיָה
  choice: அத்தாலியாள்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்ததுடன், பெண்பாலையும் தெளிவாக்குகிறது.
- source_word: קוֹל
  choice: சத்தம்
  rationale: קוֹל என்பதற்கு குரல், ஒலி, சத்தம் ஆகிய பொருள்கள் உண்டு. காவலர்களும் மக்களும் கூடியிருந்த பொதுநிகழ்வில் எழுந்த ஒட்டுமொத்த ஒலியை ‘சத்தம்’ இயல்பாகத் தெரிவிக்கிறது; தெளிவுக்காக ‘எழுப்பிய’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָרָצִין
  choice: காவலர்கள்
  rationale: רוץ வேரிலிருந்து வந்த இச்சொல் சொற்படி ‘ஓட்டக்காரர்கள்’ எனப் பொருள்பட்டாலும், அரசவைக் சூழலில் அரசக் காவலர் அல்லது மெய்க்காவலர் படையைக் குறிக்கலாம். நவீன வாசகருக்காக செயல்பாட்டு பொருள் முதன்மை உரையில் தரப்படுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם என்பதன் வழக்கமான பொருளைத் தக்கவைத்து, அங்கு கூடியிருந்த பொதுமக்களைக் குறிக்கிறது.
- source_word: וַתָּבֹא אֶל
  choice: மக்களிடம் வந்தாள்
  rationale: בוא + אֶל என்பது ஒருவரிடமோ ஒரு குழுவிடமோ வருதல் அல்லது செல்லுதலைக் குறிக்கும். கதைநடைக்கு ‘வந்தாள்’ இயல்பானது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: בֵּית என்பதன் ‘இல்லம்/வீடு’ என்ற உருவகத்தைத் தக்கவைத்து, יְהוָה என்ற திருப்பெயரை ‘யாவே’ என நேரடியாக எழுத்துப்பெயர்க்கிறது. சூழலில் இது ஆலய வளாகத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ‘யாவே’ என்று எழுத்துப்பெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘இல்லம்’ உருவகம்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: முதன்மை உரையில் எபிரெயச் சொல்லமைப்பைத் தக்கவைக்க ‘இல்லம்’ பயன்படுத்தப்படுகிறது; அது இச்சூழலில் ஆலயத்தையும் அதன் வளாகத்தையும் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அத்தாலியாள்’ என்ற வடிவம் பெண்பாலைத் தெளிவாக்குகிறது. ‘யாவேயின் இல்லம்’ மூல உருவகத்தைப் பாதுகாக்க, அதன் சூழல்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெயில் காவலர்களுக்கும் மக்களுக்கும் இடையே இணைப்புச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், இரு குழுக்களின் கூட்டு ஒலியைச் சூழல் காட்டுவதால் தமிழில் ‘காவலர்களும் மக்களும்’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
