base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: ta
  text: பின்பு அவர் அரசனின் மகனை வெளியே அழைத்து வந்து, அவன் மேல் மணிமுடியை வைத்து, சாட்சியத்தையும்[a] அவனுக்குக் கொடுத்தார். அவர்கள் அவனை அரசனாக்கி, அவனை அபிஷேகம் செய்தார்கள். அவர்கள் கைகொட்டினார்கள்; “அரசன் நீடூழி வாழ்க!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சி.” “உடன்படிக்கை ஆவணம்” அல்லது “அரசாணை” என்றும் பொருள்கொள்ளலாம். எபிரெயத்தில் “சாட்சியம்” என்று உள்ளது; இது அரசனுடைய ஆட்சியுடன் தொடர்புடைய எழுதப்பட்ட சான்றைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: வெளியே அழைத்து வந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒருவரை வெளியே வரச் செய்வதை அல்லது வெளியே கொண்டுவருவதைக் குறிக்கிறது; இச்சூழலில் இந்தத் தமிழ் சொற்றொடர் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הַנֵּזֶר
  choice: மணிமுடி
  rationale: அரசாட்சியின் அடையாளமான அரச முடியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது; அரிதான தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: הָעֵדוּת
  choice: சாட்சிப் பத்திரம்
  rationale: עֵדוּת என்பதன் அடிப்படைச் ‘சாட்சி’ பொருளையும், முடிசூட்டு நிகழ்வில் இது ஓர் எழுதப்பட்ட ஆவணமாக இருந்திருக்கலாம் என்பதையும் வெளிப்படுத்துகிறது; அதன் துல்லியமான அடையாளம் உறுதியல்ல என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: அவனை அரசனாக்கி
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அரசனாக ஆக்குதல்’ என்ற காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: அவனுக்குத் திருப்பொழிவு செய்தார்கள்
  rationale: அரசரை நிறுவும் நிகழ்வில் משׁח குறிக்கும் எண்ணெய் ஊற்றித் தனியே ஏற்படுத்தும் சடங்கை, வேதாகமத் தமிழில் அறியப்பட்டும் புரிந்துகொள்ளத்தக்கவாறும் வழங்குகிறது.
- source_word: וַיַּכּוּ כָף
  choice: கைகொட்டி
  rationale: உள்ளங்கைகளை ஒன்றோடொன்று அடிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது; ‘பாராட்டினர்’ என்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
- source_word: יְחִי הַמֶּלֶךְ
  choice: அரசன் நீடூழி வாழ்க!
  rationale: அரசரை வாழ்த்தும் ஜஸ்ஸிவ் முழக்கத்தின் வலிமையையும் பொது அறிவிப்புத் தன்மையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: முடிசூட்டு நிகழ்வில் הָעֵדוּת என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சாட்சிப் பத்திரம்’
  alternative: ‘சாட்சி’, ‘உடன்படிக்கை ஆவணம்’ அல்லது ‘அரசாணை’
  rationale: இச்சொல் அரசனுடைய கடமைகளுடன் தொடர்புள்ள எழுதப்பட்ட சாட்சியையோ ஆவணத்தையோ குறிக்கக்கூடும்; ஆனால் அது என்ன ஆவணம் என்பதை எபிரெய உரை துல்லியமாகச் சொல்லவில்லை. ஆகவே ஒரு குறிப்பிட்ட உடன்படிக்கை அல்லது சட்ட ஆவணம் என்று தீர்மானிக்காமல், அடிப்படைப் பொருளையும் ஆவணச் சூழலையும் பாதுகாத்து மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் காட்சியின் உயர்ந்த தொனி ‘மணிமுடி’, ‘திருப்பொழிவு’, ‘நீடூழி வாழ்க’ ஆகிய சொற்களால் காக்கப்படுகிறது; தெளிவில்லாத ஆவணத்தின் அடையாளம் உறுதியாக்கப்படவில்லை.
