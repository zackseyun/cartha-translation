base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: ta
  text: அரசனை எல்லாப் பக்கங்களிலும் சூழ்ந்து நில்லுங்கள்; ஒவ்வொருவனும் தன் ஆயுதங்களைக் கையில் ஏந்தியிருக்க வேண்டும். அணிவரிசைகளுக்குள்[a] வருகிற எவனும் கொல்லப்பட வேண்டும். அரசன் வெளியே செல்லும்போதும் உள்ளே வரும்போதும்[b] அவனோடு இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வரிசைகளுக்குள்.’ எபிரெயச் சொல் காவலர்களின் ஒழுங்குபடுத்தப்பட்ட அணிகள் அல்லது வரிசைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவன் வெளியே செல்லுதலிலும் அவன் உள்ளே வருதலிலும்.’ அரசன் எங்கு சென்றாலும் அவனுடன் சென்று அவனைப் பாதுகாப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: நீங்கள் அரசனைச் சுற்றிலும் சூழ்ந்து நிற்க வேண்டும்
  rationale: இச்சொற்றொடர் அரசனை எல்லாப் பக்கங்களிலும் பாதுகாப்பாகச் சூழ்ந்து நிற்கும் இராணுவ ஏற்பாட்டைக் குறிக்கிறது. ‘சூழ்ந்து நிற்க’ என்பது செயலை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ஒவ்வொருவனும் தன் ஆயுதங்களைத் தன் கையில் வைத்திருக்க வேண்டும்
  rationale: אִישׁ இங்கு பகிர்நிலை ஒருமையாக ஒவ்வொரு காவலனையும் குறிக்கிறது. כְּלִי என்பதற்கு பல பொருள்கள் இருந்தாலும், காவல் கட்டளையின் சூழலில் ‘ஆயுதங்கள்’ என்பதே பொருத்தமானது.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: அணிவரிசைகளுக்குள் வருகிற எவனும்
  rationale: שְׂדֵרוֹת என்பது ஒழுங்குபடுத்தப்பட்ட வரிசைகள் அல்லது காவலர் அணிகளைச் சுட்டுகிறது. அதன் இராணுவச் சூழலை ‘அணிவரிசைகள்’ இயல்பாக வெளிப்படுத்துகிறது; சொல்லின் சிறிய பொருள் ஐயத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: ஹொஃபால் வினைவடிவத்தின் செயப்பாட்டு பொருளையும் கட்டளையின் மரணதண்டனைத் தன்மையையும் இது நேரடியாகக் காக்கிறது.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: அவனோடு இருங்கள்
  rationale: היה உடன் வரும் אֶת இங்கு உடனிருத்தலையும் பாதுகாப்பிற்காகத் துணைநிற்றலையும் குறிக்கிறது. ‘அவனோடு இருங்கள்’ மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: அரசன் வெளியே செல்லும்போதும் உள்ளே வரும்போதும்
  rationale: ‘அவன் வெளியேறுதலிலும் அவன் உள்ளே வருதலிலும்’ என்ற எபிரெய வடிவத்தை இயல்பான தமிழில் தருகிறது; அரசனின் எல்லா அசைவுகளிலும் அவனுடன் இருப்பதைக் குறிக்கும் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
