base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: ta
  text: நாட்டின் மக்கள் அனைவரும் மகிழ்ந்தார்கள்; நகரமும் அமைதியாக இருந்தது. அத்தாலியாவையோ, அவர்கள் அரச மாளிகையில்[a] வாளால் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதிச் சொற்றொடர் சுருக்கமாக உள்ளது. இதை சொல்லுக்குச்சொல் “அரசனின் வீட்டில்” என்றும், சூழலுக்கு ஏற்ப “அரச மாளிகையில்” என்றும் புரிந்துகொள்ளலாம்.
    reason: בֵּית מֶלֶךְ என்பதன் சொல்லுக்குச்சொல் மற்றும் சூழல்சார் இடப்பொருளைத் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘அருகே’ என்ற நுணுக்கத்தைச் சேர்க்கவில்லை.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח என்ற வினையின் மகிழ்ச்சி உணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ஒருமை வடிவிலுள்ள எபிரெய வினை, கூட்டுப் பொருளுடைய ‘மக்கள் அனைவரும்’ என்பதுடன் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: כָּל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவரும்
  rationale: சொற்றொடரின் ‘நிலம்/நாடு’ மற்றும் முழு மக்கள்தொகை என்ற கூறுகளைத் தெளிவாகக் காக்கிறது; சூழலில் உறுதிப்படுத்தப்படாத குறிப்பிட்ட சமூக வர்க்கத்தைச் சேர்க்கவில்லை.
- source_word: וְהָעִיר שָׁקָטָה
  choice: நகரமும் அமைதியாக இருந்தது
  rationale: கலக்கம் ஓய்ந்து நகரம் அமைதியான நிலையை அடைந்ததை எளிய, கண்ணியமான தமிழில் தெரிவிக்கிறது; ‘சமாதானம்’ என்று இறையியல் நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: அத்தலியாளையோ
  rationale: முன்னிலைப்படுத்தப்பட்ட நேரடிச் செயப்படுபொருளின் தலைப்புமாற்றத்தையும் மெல்லிய வலியுறுத்தலையும் தமிழ் ‘-ஐயோ’ அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
- source_word: הֵמִיתוּ
  choice: கொன்றார்கள்
  rationale: מות என்பதன் causative வடிவமான ‘சாகச் செய்தார்கள்/கொன்றார்கள்’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘மரணதண்டனை நிறைவேற்றினார்கள்’ என்று உரையில் இல்லாத முறையான நீதித்துறை நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: בַחֶרֶב
  choice: வாளால்
  rationale: கருவியைக் குறிக்கும் ב முன்னிடைச்சொல்லையும் חֶרֶב என்பதன் நேரடிப் பொருளையும் சுருக்கமாகக் காக்கிறது.
- source_word: בֵּית מלך
  choice: அரச மாளிகையில்
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’ என்றாலும், அரசரின் குடியிருப்பு/அரண்மனை என்ற சூழற்பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது. முன்னிடைச்சொல் இல்லாத எபிரெயச் சொற்றொடரின் இடநுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
