source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: ta
  text: பின்பு யெகோயாதா, யாவேக்கும் அரசனுக்கும் மக்களுக்கும் இடையே உடன்படிக்கை செய்தார்[a]—அவர்கள் யாவேக்குரிய மக்களாக இருக்க வேண்டும்[b] என்பதற்காக. மேலும், அரசனுக்கும் மக்களுக்கும் இடையேயும் உடன்படிக்கை செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்படி, “உடன்படிக்கையை வெட்டினார்”; இது “உடன்படிக்கை செய்தார்” என்று பொருள்படும் வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேக்கு மக்களாக இருக்க வேண்டும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... אֶת הַבְּרִית
  choice: உடன்படிக்கை செய்தார்
  rationale: כרת ברית என்பதன் சொற்பொருள் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், இது உடன்படிக்கை ஏற்படுத்துவதைக் குறிக்கும் நிலையான எபிரேய மரபுத்தொடர். இயல்பான நவீன தமிழில் ‘உடன்படிக்கை செய்தார்’ என்பது அதன் பொருளையும் முறையான தன்மையையும் தெளிவாகக் கொடுக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், தமிழில் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: யாவேக்கும் அரசனுக்கும் மக்களுக்கும் இடையே
  rationale: மீண்டும் மீண்டும் வரும் בֵּין உடன்படிக்கையின் தரப்புகளைச் சுட்டுகிறது. தமிழ் வடிவம் மூன்று தரப்புகளையும் தெளிவாக வைத்திருக்கிறது.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: அவர்கள் யாவேக்குரிய மக்களாக இருக்க வேண்டும்
  rationale: நோக்கம் அல்லது விளைவை உணர்த்தும் எபிரேய இறந்தொழிற்பெயர் அமைப்பை இயல்பான தமிழில் தருகிறது; யாவேக்கு உரியவர்களாக இருப்பது என்ற உடன்படிக்கை உறவையும் பாதுகாக்கிறது.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: மேலும், அரசனுக்கும் மக்களுக்கும் இடையேயும்
  rationale: வசனத்தின் இறுதியில் குறிப்பிடப்படும் இரண்டாவது உடன்படிக்கை உறவை, முதல் உறவுடன் குழப்பாமல் தனியே காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்தை ஒரு கூட்டு மக்களாகக் குறிக்கும் עָם என்பதற்கான நேரடியான, இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது; ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு ஏற்ற தமிழ் வடிவம்.
- issue: לִהְיוֹת לְעָם לַיהוָה என்ற உடன்படிக்கைச் சூத்திரத்தின் உறவுப் பொருள்
  choice: யாவேக்குரிய மக்களாக இருக்க வேண்டும்
  alternative: யாவேக்கு மக்களாக இருக்க வேண்டும்
  rationale: ‘உரிய’ என்பது சொந்தம் மற்றும் உடன்படிக்கைச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. அடிக்குறிப்பில் மேலும் வடிவநெருக்கமான மாற்று தரப்பட்டதால் மூலத்தின் நுணுக்கம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. நீண்ட எபிரேய வாக்கிய அமைப்பு இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், முதலில் யாவே–அரசன்–மக்கள் உறவும் பின்னர் அரசன்–மக்கள் உறவும் என்ற மூலத்தின் வரிசையும் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
