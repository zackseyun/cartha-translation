  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு இயல்பாக உள்ளது. ஆனால் “கொல்லப்பட்டுக்கொண்டிருந்த” என்பதைக் “கொல்லப்பட்டுக் கொண்டிருந்த” எனப் பிரித்து எழுதுவது வாசிப்பையும் இலக்கணத் தெளிவையும் மேம்படுத்தும். “அவனையும் அவனுடைய செவிலியையும்” என்ற மீள்குறிப்பு எபிரேய உரையின் மீள்குறிப்பை வெளிப்படுத்துவதால் வைத்திருக்கலாம்.
  terminology: பெயரொலிபெயர்ப்புகள், “சகோதரி,” “செவிலி,” மற்றும் “படுக்கையறை” ஆகிய சொற்கள் ஏற்றவை. “அவர்கள் ... மறைத்துவைத்தார்கள்” என்பது மூலத்தின் பன்மை வினையை உரியவாறு காக்கிறது. அடிக்குறிப்புகள் சரியான இடங்களில் இணைக்கப்பட்டுள்ளன.
