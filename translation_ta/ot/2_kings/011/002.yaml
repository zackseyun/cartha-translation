base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: ta
  text: ஆனால் அரசன் யோராமின் மகளும் அகசியாவின் சகோதரியுமான யெகோசேபா, அகசியாவின் மகன் யோவாசை எடுத்துக்கொண்டு, கொல்லப்பட்டுக் கொண்டிருந்த அரசனின் மகன்களின் நடுவிலிருந்து அவனையும் அவனுடைய செவிலியையும்[a] படுக்கையறைக்குள்[b] இரகசியமாகக் கொண்டுபோனாள். அவர்கள் அவனை அத்தாலியாவிடமிருந்து மறைத்துவைத்தார்கள்[c]; அதனால் அவன் கொல்லப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பாலூட்டிய செவிலியையும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழியில், “படுக்கைகளின் அறைக்குள்”; அல்லது, “படுக்கை அறைக்குள்.”
    reason: lexical_alternative
  - marker: c
    text: 'எபிரேய வினை பன்மையில் உள்ளது: “அவர்கள் அவனை மறைத்தார்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் பொதுவான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது; மீட்புச் செயலைத் தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: יְהוֹשֶׁבַע
  choice: யெகோசேபா
  rationale: அரசர்கள் நூலில் காணப்படும் எபிரேயப் பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; நாளாகமத்தில் உள்ள வேறு வடிவத்தோடு ஒத்திசைக்கவில்லை.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: அரசன் யோராமின் மகள்
  rationale: எபிரேய இணைப்புத் தொடரின் உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: அகசியாவின் சகோதரி
  rationale: אחות என்பதன் நேரடியான பொருள் ‘சகோதரி’; வம்சவரலாற்றுச் சிக்கலைத் தீர்க்கும் நோக்கில் இதை ‘உறவினர்’ என்று தளர்த்தவில்லை.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: அவனை ... இரகசியமாகக் கொண்டுபோனாள்
  rationale: גנב என்பதில் உள்ள மறைவான செயல் என்ற கருத்தை இயல்பான தமிழில் காக்கிறது; இச்சூழலில் ‘திருடினாள்’ என்பது தவறான குற்றவியல் நிழற்பொருளை ஏற்படுத்தக்கூடும்.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்களின் நடுவிலிருந்து
  rationale: בני המלך என்பதன் நேரடியான குடும்பக் குறிப்பை வைத்திருக்கிறது; ‘இளவரசர்கள்’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: הַמּוּמָתִים
  choice: கொல்லப்பட்டுக்கொண்டிருந்த
  rationale: מות வினையின் ஹொஃபால் நிகழ்காலப் பெயரெச்சம் சாவுக்குள்ளாக்கப்பட்டுக்கொண்டிருந்தவர்களைக் குறிக்கிறது; நடந்து கொண்டிருந்த படுகொலைச் சூழலை வெளிப்படுத்துகிறது.
- source_word: מֵינִקְתּוֹ
  choice: அவனுடைய செவிலி
  rationale: வாசிக்க எளிய தற்போதைய தமிழை முதன்மை உரையில் பயன்படுத்துகிறது; குறிப்பாகப் பாலூட்டும் பெண் என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: படுக்கையறைக்குள்
  rationale: ‘படுக்கைகளின் அறை’ என்ற எபிரேயச் சொற்றொடரின் இயல்பான தமிழ்ப் பொருள்; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: அவர்கள் அவனை ... மறைத்துவைத்தார்கள்
  rationale: மசோரா உரையில் வினை பன்மையில் இருப்பதை மாற்றாமல் காக்கிறது.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: அத்தாலியாவிடமிருந்து
  rationale: அத்தாலியாவின் பார்வைக்கும் அச்சுறுத்தலுக்கும் எட்டாமல் மறைத்ததைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וְלֹא הוּמָת
  choice: அதனால் அவன் கொல்லப்படவில்லை
  rationale: செயப்பாட்டு வடிவத்தையும் மறைத்ததன் விளைவையும் இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: அகசியாவுடனான குடும்ப உறவை வம்சவரலாற்றுத் தகவல்களோடு ஒத்திசைத்தல்
  choice: ‘அகசியாவின் சகோதரி’ என்று எபிரேய உரையின் நேரடிப் பொருளை வைத்திருத்தல்
  alternative: ஒத்திசைப்பதற்காக ‘அகசியாவின் உறவினர்’ என்று பொதுமைப்படுத்துதல்
  rationale: இவ்வசனம் வழக்கமான ‘சகோதரி’ என்ற சொல்லையே பயன்படுத்துகிறது; உரை கோராத வம்சவரலாற்றுத் தீர்வை மொழிபெயர்ப்பில் புகுத்தக்கூடாது.
- issue: ‘மறைத்தார்கள்’ என்ற வினையின் எழுவாய்
  choice: பன்மையைப் பாதுகாத்து ‘அவர்கள் மறைத்துவைத்தார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: சூழலை எளிமைப்படுத்தி ‘அவள் மறைத்துவைத்தாள்’ என்று ஒருமையில் தருதல்
  rationale: மசோரா உரையின் வினை மூன்றாம் நபர் ஆண்பால் பன்மையில் உள்ளது; யெகோசேபாவுடன் செவிலியோ வேறு உதவியாளர்களோ சேர்ந்திருக்கலாம் என்ற உரையின் திறந்த தன்மையை இது காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. பெயர்கள் எபிரேய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டன. ‘திருடினாள்’ என்பதற்குப் பதிலாக, גנב வினையின் மறைவான செயல்பாட்டை இச்சூழலுக்கு ஏற்ற ‘இரகசியமாகக் கொண்டுபோனாள்’ எனத் தரப்பட்டுள்ளது. எபிரேயப் பன்மை வினை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
