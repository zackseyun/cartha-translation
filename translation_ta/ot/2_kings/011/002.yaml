  revised_text: ஆனால் அரசன் யோராமின் மகளும் அகசியாவின் சகோதரியுமான யெகோசேபா, அகசியாவின் மகன் யோவாசை எடுத்துக்கொண்டு, கொல்லப்பட்டுக் கொண்டிருந்த அரசனின் மகன்களின் நடுவிலிருந்து அவனையும் அவனுடைய செவிலியையும்[a] படுக்கையறைக்குள்[b] இரகசியமாகக் கொண்டுபோனாள். அவர்கள் அவனை அத்தாலியாவிடமிருந்து மறைத்துவைத்தார்கள்[c]; அதனால் அவன் கொல்லப்படவில்லை.
