    text: எபிரெயத்தில், “அரசாட்சியின் விதை”; அதாவது, அரச வம்சத்தினர் அல்லது அரச சந்ததியினர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: அகசியாவின் தாயான அத்தாலியாள்
  rationale: பெயர்களை வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்கி, எபிரெயக் கட்டமைப்பிலுள்ள உறவுமுறை அடையாளத்தை இயல்பான தமிழில் பாதுகாக்கிறது. தொடக்க வாவுக்கு தேவையற்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: தன் மகன் இறந்துவிட்டதைக் கண்டபோது
  rationale: ראה + כי என்பது ஓர் உண்மைநிலையை அறிந்துகொள்வதைக் குறிக்கிறது; מֵת என்பதன் முடிவுற்ற நிலையை ‘இறந்துவிட்டது’ இயல்பாக வெளிப்படுத்துகிறது. அடுத்த செயல் இதைத் தொடர்ந்து நிகழ்வதை ‘கண்டபோது’ காட்டுகிறது.
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: קום இங்கு உடல் அசைவை மட்டும் அல்லாமல் உறுதியான நடவடிக்கையில் இறங்குவதையும் குறிக்கலாம்; ‘எழுந்து’ அந்தக் கதைநடை வலிமையைப் பாதுகாக்கிறது.
- source_word: וַתְּאַבֵּד
  choice: அழித்தாள்
  rationale: பியேல் வடிவிலுள்ள אבד ‘அழிவுக்குள்ளாக்குதல்’ எனப் பொருள்படும். சூழலில் கொலை குறிக்கப்பட்டாலும், எபிரெயச் சொல்லைவிட முறையை அதிகமாகக் குறிப்பதில்லை.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: அரச வம்சத்தார் அனைவரையும்
  rationale: சொல்லுக்கு சொல் ‘அரசாட்சியின் விதை’; இங்கு זֶרַע என்பது அரச மரபைச் சேர்ந்த சந்ததியினரைக் குறிக்கிறது. ‘அரச வம்சத்தார்’ நவீன தமிழில் இயல்பாக அந்த வம்சப் பொருளைத் தருகிறது.
