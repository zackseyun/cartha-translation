  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: ta
  text: அகசியாவின் தாயான அத்தாலியா, தன் மகன் இறந்துவிட்டதைக் கண்டு, எழுந்து அரச வம்சத்தினரையெல்லாம்[a] அழித்தாள்.
  philosophy: optimal-equivalence
