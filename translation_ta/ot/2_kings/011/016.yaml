translation_notes:
  register: நவீன தரத் தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசனின் வீடு’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘அரண்மனை’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் செயப்பாட்டு நகர்வை மதித்து ‘அவள் சென்றாள்’ என்றும், மரணத்தை ஏற்படுத்திய செயலைத் தெளிவாக்க ‘கொல்லப்பட்டாள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
