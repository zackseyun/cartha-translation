  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: ta
  text: எனவே அவர்கள் அவளைப் பிடித்தார்கள்[a]. அவள் குதிரைகள் நுழையும் வழியாக அரண்மனைக்குச் சென்றாள்[b]; அங்கே அவள் கொல்லப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவள்மேல் கைகளை வைத்தார்கள்.” இதை “அவளைப் பிடித்தார்கள்” என்றும் புரிந்துகொள்ளலாம். சில மொழிபெயர்ப்புகள் இந்த எபிரெயத் தொடரை “அவளுக்கு வழிவிட்டார்கள்” என வேறுவிதமாகப் புரிந்துகொள்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “குதிரைகளின் நுழைவிடம்.” இது குதிரைகள் அரண்மனை வளாகத்திற்குள் நுழைந்த பாதையையோ வாயிலையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: அவர்கள் அவளைப் பிடித்தார்கள்
  rationale: எபிரெய மொழிவழக்கின் நேரடிப் பொருள் ‘அவள்மேல் கைகளை வைத்தார்கள்.’ இச்சூழலில் அது அவளைப் பிடித்துக் காவலில் கொண்டதைக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘பிடித்தார்கள்’ தெளிவாக உள்ளது.
- source_word: וַתָּבֹא
  choice: அவள் ... சென்றாள்
  rationale: בוא என்பது பார்வைநிலைக்கு ஏற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். ஆலயப் பகுதியிலிருந்து அரண்மனை நோக்கிய நகர்வை இங்கு ‘சென்றாள்’ இயல்பாக வெளிப்படுத்துகிறது; வினை இலக்கணரீதியாகச் செயப்பாட்டு வடிவமல்ல.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: குதிரைகள் நுழையும் வழியாக
  rationale: דֶּרֶךְ என்பது வழி/பாதை; מְבוֹא என்பது நுழைவிடம் அல்லது நுழைவு. ‘குதிரைகள் நுழையும் வழி’ என்பது தொடர்பை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத குறிப்பிட்ட ‘வாசல்’ என்ற பொருளைத் திணிக்கவில்லை.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரண்மனைக்கு
  rationale: சொல்லுக்குச் சொல் ‘அரசனின் வீடு’; இச்சூழலில் அது அரச அரண்மனை வளாகத்தைக் குறிக்கிறது. நவீன தமிழில் ‘அரண்மனை’ துல்லியமும் இயல்பும் உடையது.
- source_word: וַתּוּמַת
  choice: அவள் கொல்லப்பட்டாள்
  rationale: מות என்பதன் ஹொஃபால் வடிவம் பிறரால் மரணமடையச் செய்யப்பட்டதை வெளிப்படுத்துகிறது. ‘கொல்லப்பட்டாள்’ அந்தச் செயப்பாட்டு வலிமையைச் சுருக்கமாகத் தருகிறது; வெறுமனே ‘இறந்தாள்’ என மங்கச் செய்யவில்லை.
- source_word: שָׁם
  choice: அங்கே
  rationale: மரணதண்டனை நிகழ்ந்த இடத்தைக் குறிக்கும் எளிய இடவினையடை.
