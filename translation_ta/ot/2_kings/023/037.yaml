  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: ta
  text: அவன் தன் தந்தையர் செய்த எல்லாவற்றையும் போலவே, யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் முன்னோர்” அல்லது “தன் மூதாதையர்.” எபிரெய மொழியில் நேரடியாக “தன் தந்தையர்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் עשה கதைநடையை முன்னெடுக்கிறது. தனி வசனமாகத் தமிழில் இயல்பாக அமைய எழுவாயுடன் வினை மொழிபெயர்க்கப்பட்டது; கட்டாயமான ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה הרע என்னும் மதிப்பீட்டுச் சொற்றொடரை, சொல்லுக்குச் சொல் கடினமாக இல்லாமல் அதன் பொருளைக் காக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளைத் தெளிவான, இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த எல்லாவற்றையும் போலவே
  rationale: முன்னோரின் செயல்களுடன் முழுமையான ஒப்புமை அல்லது ஒத்திசைவை வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ
  choice: செய்த
  rationale: தமிழின் தொடர்பெயரெச்ச அமைப்பு, அரசனின் தற்போதைய மதிப்பீட்டுக்கு முன்னரே தந்தையர் செய்த செயல்களை இயல்பாகக் குறிக்கிறது.
- source_word: אֲבֹתָיו
  choice: தன் தந்தையர்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது மூதாதையர் அல்லது முன்னோர்களையும் குறிக்கலாம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: אֲבֹתָיו என்பதன் குறிப்பு
  choice: தன் தந்தையர்
  alternative: தன் முன்னோர் / தன் மூதாதையர்
  rationale: நேரடிச் சொற்பொருளை முதன்மை உரையில் காக்கிறது; அரச வரலாற்றுச் சூழலில் விரிவான வம்ச அல்லது முன்னோர் குறிப்பாக இருக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான அரச வரலாற்று நடையில் வடிவமைக்கப்பட்டது. ‘யாவேவின் பார்வையில்’ என்பது மூல உருவகத்தின் மதிப்பீட்டுப் பொருளைக் காக்கிறது; ‘போலவே’ ஒப்புமையின் வலிமையை வெளிப்படுத்துகிறது.
