source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: ta
  text: 'யாவே சொன்னார்: “நான் இஸ்ரவேலை என் முன்னிலையிலிருந்து அகற்றியதுபோல, யூதாவையும் என் முன்னிலையிலிருந்து அகற்றுவேன். நான் தேர்ந்தெடுத்த இந்த நகரமாகிய எருசலேமையும், ‘என் பெயர் அங்கே இருக்கும்’ என்று நான் சொன்ன அந்த வீட்டையும்[b] நிராகரிப்பேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிராகரித்துவிட்டேன்.” எபிரெய வினை முடிவுற்ற செயலாகவும் வாசிக்கப்படலாம்; இங்கு சுற்றியுள்ள தீர்ப்பு அறிவிப்புக்கு ஏற்ப வருங்காலப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அதாவது, எருசலேமிலிருந்த ஆலயம். எபிரெயத்தில், “வீடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழெழுத்துப்பெயர்ப்பாகத் தருகிறது.
- source_word: אָסִיר / הֲסִרֹתִי
  choice: அகற்றுவேன் / அகற்றியதுபோல
  rationale: இரு வினைகளுக்குமிடையிலுள்ள திட்டமிட்ட இணைப்பைப் பேணி, யூதாவின் தீர்ப்பை இஸ்ரவேலின் முந்தைய நிலைக்கு ஒப்பிடுகிறது.
- source_word: מֵעַל פָּנַי
  choice: என் முன்னிலையிலிருந்து
  rationale: சொற்றொடரின் உறவுசார் மற்றும் உடன்படிக்கைச் சார்ந்த வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: גַּם
  choice: யூதாவையும்
  rationale: ‘-உம்’ விகுதி, இஸ்ரவேலைப் போல யூதாவும் அதே தீர்ப்புக்கு உட்படும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמָאַסְתִּי
  choice: நிராகரிப்பேன்
  rationale: מאס என்பதிலுள்ள ஒதுக்கித் தள்ளும் பொருளைத் தருகிறது; சுற்றியுள்ள வருங்காலத் தீர்ப்பு அறிவிப்போடு பொருந்துகிறது.
- source_word: אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: நான் தேர்ந்தெடுத்த இந்த நகரமாகிய எருசலேம்
  rationale: எருசலேம் என்பது ‘இந்த நகரம்’ என்பதன் விளக்கப்பெயர் என்பதைத் தெளிவான தமிழில் காட்டுகிறது.
- source_word: הַבַּיִת
  choice: வீடு
  rationale: எபிரெய மூலத்தின் நேரடிச் சொல்லையும் ஆலய இறையியலோடு அதன் ஒலித்தொடர்பையும் பேணுகிறது; குறிப்பு அதன் குறிப்பிட்ட பொருளை விளக்குகிறது.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: என் பெயர் அங்கே இருக்கும்
  rationale: தேவனுடைய பெயர் தேர்ந்தெடுக்கப்பட்ட பரிசுத்த இடத்தில் இருப்பது என்ற வேதாகமக் கருத்தை விளக்கமின்றி நேரடியாகத் தருகிறது.
theological_decisions:
- issue: וּמָאַסְתִּי என்பதன் காலப்பொருள்
  choice: வருங்காலமாக ‘நிராகரிப்பேன்’
  alternative: ‘நிராகரித்துவிட்டேன்’ அல்லது ‘நிராகரித்தேன்’
  rationale: இது வடிவில் நிறைவுற்ற வினையாக இருந்தாலும், ‘அகற்றுவேன்’ என்ற வரவிருக்கும் தீர்ப்பு அறிவிப்பைத் தொடர்ந்து வருவதால் வருங்கால வலிமையுடன் மொழிபெயர்க்கப்பட்டது. முடிவுற்ற செயல் என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: הַבַּיִת என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘வீடு’
  alternative: ‘ஆலயம்’
  rationale: மூலத்தில் உள்ள ‘வீடு’ என்ற உருவகத்தையும் அதன் இறையியல் எதிரொலியையும் காக்கிறது; இங்கு அது எருசலேம் ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: இயல்பான நவீனத் தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்ப்பு அறிவிப்பின் கண்ணியமும் கடுமையும் பேணப்பட்டுள்ளன. ‘என் முன்னிலையிலிருந்து,’ ‘வீடு,’ ‘என் பெயர் அங்கே இருக்கும்’ போன்ற முக்கிய மூலமொழிப் படிமங்கள் தேவையற்ற விளக்கமின்றி தக்கவைக்கப்பட்டுள்ளன.
