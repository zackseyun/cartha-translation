  text: בֶּן עֶשְׂרִ֨ים וְ/שָׁלֹ֤שׁ שָׁנָה֙ יְהוֹאָחָ֣ז בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חֲמוּטַ֥ל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: ta
  text: யோவாகாஸ் அரசனானபோது இருபத்து மூன்று வயதாயிருந்தான். அவன் எருசலேமில் மூன்று மாதங்கள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் அமூத்தாள்; அவள் லிப்னாவைச் சேர்ந்த எரேமியாவின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: இருபத்து மூன்று வயதாயிருந்தான்
  rationale: எபிரேய வயதைக் குறிக்கும் மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: அவன் ஆட்சிப் பொறுப்பேற்ற காலத்தைக் குறிக்கும் எபிரேய வடிவத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: இங்கு வினைச்சொல் அவனுடைய ஆட்சிக்கால நீளத்தைக் குறிப்பிடுவதால் இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: மூன்று மாதங்கள்
  rationale: கால நீட்சியைக் குறிக்கும் எபிரேயப் பயன்பாட்டைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கும் நேரடியான இடவேற்றுமை மொழிபெயர்ப்பு.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: அரசர்கள் நூலில் காணப்படும் தாயார் அடையாளக் குறிப்பை இயல்பான தமிழ்ச் சொல்லமைப்பில் பாதுகாக்கிறது.
- source_word: חֲמוּטַל
  choice: அமூத்தாள்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பைத் தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת יִרְמְיָהוּ
  choice: எரேமியாவின் மகள்
  rationale: בַּת குறிக்கும் தந்தை–மகள் உறவைத் தெளிவாக வழங்குகிறது; எரேமியா என்பது தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: מִלִּבְנָה
  choice: லிப்னாவைச் சேர்ந்த
  rationale: מִן குறிக்கும் ஊர்த் தோற்றம் அல்லது தொடர்பை, வெறும் இடவிலகலாக அல்லாமல், இயல்பான தமிழில் வெளிப்படுத்துகிறது.
