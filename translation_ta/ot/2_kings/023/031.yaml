translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசாட்சிப் பதிவுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு வாக்கிய அமைப்பு மூன்று குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டு வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; தகவல் எதுவும் சேர்க்கப்படவோ நீக்கப்படவோ இல்லை.
