base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: ta
  text: அவன் வழிபாட்டுத் தூண்களை நொறுக்கி, அசேரிம்[a] என்பவற்றை வெட்டி வீழ்த்தி, அவை இருந்த இடங்களை மனித எலும்புகளால் நிரப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அசேரிம்’; இது அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருள்களைக் குறிக்கிறது. ‘அசேரா கம்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் அவற்றின் துல்லியமான வடிவத்தை இச்சொல் மட்டும் குறிப்பிடுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: நொறுக்கி
  rationale: துண்டுகளாக உடைத்து அழிப்பதைக் குறிக்கும் வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמַּצֵּבוֹת
  choice: வழிபாட்டுத் தூண்களை
  rationale: மַצֵּבָה என்பது வழிபாட்டுடன் தொடர்புடைய நிறுத்தப்பட்ட கல் அல்லது தூணைக் குறிக்கிறது. வெறும் ‘தூண்கள்’ என்பதைவிடச் சூழலைத் தெளிவாக்குகிறது; அதேவேளை தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: וַיִּכְרֹת
  choice: வெட்டி வீழ்த்தி
  rationale: மரத்தால் ஆனதாக இருக்கக்கூடிய வழிபாட்டுப் பொருள்களை வெட்டி அகற்றும் செயலை இயல்பாகக் காட்டுகிறது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரிம்
  rationale: எபிரெயப் பன்மைச் சொல்லை ஒலிபெயர்த்து, இவை கம்பங்களா, மரங்களா, வேறு வழிபாட்டுச் சின்னங்களா என்பதைத் தீர்மானிக்காமல் அதன் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיְמַלֵּא
  choice: நிரப்பினான்
  rationale: வினையின் அடிப்படைப் பொருளான ‘நிரப்பு’ என்பதைக் காக்கிறது.
- source_word: מְקוֹמָם
  choice: அவை இருந்த இடங்களை
  rationale: அழிக்கப்பட்ட வழிபாட்டுப் பொருள்கள் இருந்த இடங்களையே பின்னொட்டு சுட்டுகிறது என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: עַצְמוֹת אָדָם
  choice: மனித எலும்புகளால்
  rationale: இங்கு אָדָם குறிப்பிட்ட ஆணை அல்ல, பொதுவாக மனிதரைச் சுட்டுவதால் பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָדָם என்பதன் பொருள்
  choice: ‘மனித எலும்புகள்’ என்பதில் ‘மனித’
  alternative: ‘மனிதனின் எலும்புகள்’ அல்லது ‘ஆணின் எலும்புகள்’
  rationale: இந்தச் சூழலில் இச்சொல் வயதுவந்த ஆணைத் தனிப்படக் குறிக்காமல் மனிதரைப் பொதுவாகக் குறிக்கிறது.
- issue: אֲשֵׁרִים என்பதன் வடிவம்
  choice: ‘அசேரிம்’ என்று ஒலிபெயர்த்து அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அசேரா கம்பங்கள்’
  rationale: இச்சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருள்களைக் குறித்தாலும், அவற்றின் துல்லியமான உடல் வடிவத்தைச் சொல் மட்டும் நிர்ணயிப்பதில்லை. எனவே ‘கம்பங்கள்’ என்று மட்டும் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளை மதிப்புமிக்க நடையில் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான மூன்று எபிரெய வினைகளும் சுருக்கமான செயல்வரிசையாகப் பாதுகாக்கப்பட்டுள்ளன; ‘அசேரிம்’ என்ற அறிமுகமற்ற சொல் அடிக்குறிப்பின் உதவியுடன் பயன்படுத்தப்பட்டுள்ளது.
