base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: ta
  text: பார்வோன் நெகோ அவனை ஆமாத்து நாட்டிலுள்ள ரிப்லாவில் சிறைப்படுத்தி, அவன் எருசலேமில் அரசாளாதபடி செய்தான்[a][b]. மேலும், அவன் அந்த நாட்டின்மீது நூறு தாலந்து வெள்ளியையும் ஒரு தாலந்து தங்கத்தையும் தண்டப்பணமாக விதித்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்டிவைத்தான்” அல்லது “காவலில் வைத்தான்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை “அவன் எருசலேமில் அரசாளாதபடி” அல்லது “அவன் எருசலேமில் அரசாளுவதிலிருந்து தடுத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “தண்டப்பணம்” என்பதற்குப் பதிலாக “அபராதம்” அல்லது “திறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: சிறைப்படுத்தினான்
  rationale: אסר என்பதன் அடிப்படைப் பொருள் ‘கட்டுதல்’; இவ்வரச நிர்வாகச் சூழலில் அது காவலில் வைத்தல் அல்லது சிறைப்படுத்துதல் எனும் நடைமுறைப் பொருளைத் தருகிறது.
- source_word: פַרְעֹה נְכֹה
  choice: பார்வோன் நெகோ
  rationale: அரசப் பட்டமும் தனிப்பெயரும் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளன.
- source_word: בְרִבְלָה בְּאֶרֶץ חֲמָת
  choice: ஆமாத்து நாட்டிலுள்ள ரிப்லாவில்
  rationale: இரு இடக்குறிப்புகளின் உறவை இயல்பான தமிழில் தெளிவாக்குகிறது; ரிப்லா, ஆமாத்தின் நிலப்பகுதிக்குள் இருப்பதாக எபிரெய உரை குறிப்பிடுகிறது.
- source_word: במלך בִּירוּשָׁלָם
  choice: அதனால் அவன் எருசலேமில் அரசாள முடியவில்லை
  rationale: மசோரா உரையில் உள்ள ב + infinitive construct அமைப்பு இச்சூழலில் அரசாளுவதைத் தடுத்த விளைவைச் சுட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது; உரையின் வடிவம் வேறு வகையிலும் எடுத்துரைக்கப்படலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: அபராதத் திறையாக விதித்தான்
  rationale: עֹנֶשׁ என்பது தண்டப்பணம் அல்லது அபராதம்; நாட்டின் மீது அளவிடப்பட்ட அரசியல் கட்டணமாக விதிக்கப்படுவதால் ‘அபராதத் திறை’ இரு பொருள் நிழல்களையும் காக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டின்மீது
  rationale: இங்கு הָאָרֶץ என்பது வரி அல்லது அபராதச் சுமை விதிக்கப்பட்ட யூதா நாட்டைக் குறிக்கிறது.
- source_word: מֵאָה כִכַּר כֶּסֶף וְכִכַּר זָהָב
  choice: நூறு தாலந்து வெள்ளியையும் ஒரு தாலந்து தங்கத்தையும்
  rationale: כִּכָּר என்னும் பழங்கால எடை அலகு வழக்கமான ‘தாலந்து’ எனக் காக்கப்பட்டுள்ளது; நவீன எடையாக ஊகித்து மாற்றப்படவில்லை.
