translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் வேதாகமத் தமிழ் மரபுடன் ஒத்திசைக்கப்பட்டுள்ளன. மூல எபிரெயத்தின் சொற்பொருள் நிழலும் அரசியல்-பொருளாதாரச் சூழலும் ‘அபராதத் திறை’ என்ற இணைப்பால் காக்கப்பட்டுள்ளன.
