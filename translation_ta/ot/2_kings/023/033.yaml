- from: பார்வோன் நெகோ அவனை ஆமாத்து நாட்டிலுள்ள ரிப்லாவில் சிறைப்படுத்தினான்[a]; அதனால் அவன் எருசலேமில் அரசாள முடியவில்லை[b]. மேலும், அவன் நாட்டின்மீது நூறு தாலந்து வெள்ளியையும் ஒரு தாலந்து தங்கத்தையும் அபராதத் திறையாக விதித்தான்[c].
  to: பார்வோன் நெகோ அவனை ஆமாத்து நாட்டிலுள்ள ரிப்லாவில் சிறைப்படுத்தி, அவன் எருசலேமில் அரசாளாதபடி செய்தான்[a][b]. மேலும், அவன் அந்த நாட்டின்மீது நூறு தாலந்து வெள்ளியையும் ஒரு தாலந்து தங்கத்தையும் தண்டப்பணமாக விதித்தான்[c].
  rationale: The revision restores the source’s prevention/purpose nuance in the clause concerning reigning in Jerusalem and replaces the unnatural hybrid “அபராதத் திறை” with idiomatic “தண்டப்பணம்.” All lexical alternatives and their anchors are retained.
