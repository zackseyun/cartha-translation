  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: ta
  text: யூதாவின் அரசர்கள் யூதாவின் நகரங்களிலும் எருசலேமைச் சுற்றியுள்ள பகுதிகளிலும் உள்ள உயர்ந்த வழிபாட்டு இடங்களில் தூபம் காட்டுவதற்காக நியமித்திருந்த பூசாரிகளை[a] அவர் அகற்றினார். பாகாலுக்கும் சூரியனுக்கும் சந்திரனுக்கும் விண்மீன் கூட்டங்களுக்கும்[b] வானத்தின் எல்லாப் படைகளுக்கும்[c] தூபம் காட்டியவர்களையும் அவர் அகற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேற்றுத் தெய்வ வழிபாட்டுப் பூசாரிகள்.” இங்கே உள்ள எபிரெயச் சொல், இச்சூழலில் சட்டபூர்வமான இஸ்ரவேல் ஆசாரியர்களை அல்ல, அங்கீகரிக்கப்படாத அல்லது வேற்றுத் தெய்வ வழிபாட்டுடன் தொடர்புடைய பூசாரிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இராசி மண்டலங்கள்.” எபிரெயச் சொல் விண்மீன் கூட்டங்களையோ இராசி சார்ந்த வான்குழுக்களையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “வானத்தின் படைகள்.” இங்கே இந்தச் சொற்றொடர் விண்வழிபாட்டில் வணங்கப்பட்ட வான்பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: அவர் செயல்படாமல் செய்தார்
  rationale: שׁבת என்பதன் ஹிஃபீல் வடிவம் ‘நிறுத்தச் செய்தல் / செயலற்றதாக்குதல்’ என்பதைக் குறிக்கிறது. கொன்றார் அல்லது ஒரு குறிப்பிட்ட முறையில் பதவி நீக்கினார் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: הַכְּמָרִים
  choice: பூசாரிகளை
  rationale: כְּמָרִים என்பது இச்சூழலில் முறைகேடான அல்லது வேற்றுத் தெய்வ வழிபாட்டோடு தொடர்புடைய சமயப் பணியாளர்களைக் குறிக்கிறது. தமிழில் ‘பூசாரிகள்’ என்பது இங்குள்ள வழிபாட்டுச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது; அடிக்குறிப்பு சொல்லின் சிறப்புப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்கள் ... நியமித்திருந்த
  rationale: இந்த அமைப்பில் נתן என்பது நியமித்தல் அல்லது அமர்த்துதல் என்று பொருள்படும்; முற்காலச் செயலை ‘நியமித்திருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְקַטֵּר / הַמְקַטְּרִים
  choice: தூபம் காட்டுவதற்காக / தூபம் காட்டியவர்கள்
  rationale: קטר புகை எழுப்பும் காணிக்கை அல்லது தூபம் செலுத்துதலைக் குறிக்கலாம். இச்சூழலில் ‘தூபம் காட்டுதல்’ தெளிவான, இயல்பான தமிழ்ச் சமயச் சொல்லாட்சி.
- source_word: בַּבָּמוֹת
  choice: மேடைகளில்
  rationale: במה என்பது உள்ளூர் வழிபாட்டுக்குரிய உயர்ந்த இடம் அல்லது வழிபாட்டு மேடையைக் குறிக்கிறது. ‘மேடைகள்’ சுருக்கமான மரபுசார் இணை; வழிபாட்டு நோக்கம் சூழலால் தெளிவாகிறது.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: யூதாவின் நகரங்களிலும் எருசலேமைச் சுற்றியுள்ள பகுதிகளிலும்
  rationale: מְסִבֵּי என்பது சுற்றுப்புறப் பகுதிகளைக் குறிக்கிறது; தமிழில் இந்த வடிவம் புவியியல் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַבַּעַל
  choice: பாகாலுக்கு
  rationale: தெய்வத்தின் பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: சூரியனுக்கும் சந்திரனுக்கும்
  rationale: மீண்டும் வரும் எபிரெய முன்னிடைச்சொல்லைத் தமிழின் இணைவேற்றுமை உருபுகள் தனித்தனி வழிபாட்டு இலக்குகளாக இயல்பாகப் பாதுகாக்கின்றன.
- source_word: וְלַמַּזָּלוֹת
  choice: விண்மீன் கூட்டங்களுக்கும்
  rationale: מַזָּלוֹת விண்மீன் குழுக்கள் அல்லது இராசி மண்டலங்களைக் குறித்திருக்கலாம். ‘விண்மீன் கூட்டங்கள்’ தேவையற்ற அளவுக்குத் துல்லியப்படுத்தாமல் சாத்தியமான பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: வானத்தின் படைகள் அனைத்துக்கும்
  rationale: צְבָא הַשָּׁמַיִם என்ற நிலையான சொற்றொடரின் படை/திரள் உருவகத்தை முறையாகப் பாதுகாக்கிறது; இங்கு அது வான்பொருட்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: כְּמָרִים என்பதை பொதுவாக ‘ஆசாரியர்கள்’ என்று மொழிபெயர்ப்பதா, முறைகேடான வழிபாட்டோடு தொடர்புடைய பூசாரிகள் என்று வேறுபடுத்துவதா
  choice: பூசாரிகள்
  alternative: விக்கிரக வழிபாட்டுப் பூசாரிகள் / ஆசாரியர்கள்
  rationale: சொல்லின் பயன்பாடும் யோசியாவின் சீர்திருத்தச் சூழலும் இவர்களைச் சட்டபூர்வமான கர்த்தருடைய ஆசாரியர்களிலிருந்து வேறுபடுத்துகின்றன. ஆனால் ‘விக்கிரக வழிபாட்டுப்’ என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், ‘பூசாரிகள்’ என்றும் அடிக்குறிப்பில் விளக்கமும் தருவது மூலத்தின் சொற்பொருளையும் சூழலையும் சமநிலைப்படுத்துகிறது.
- issue: צְבָא הַשָּׁמָיִם இங்கு தேவதூதர்களையா வான்பொருட்களையா குறிக்கிறது
  choice: முறையான சொற்றொடராக ‘வானத்தின் படைகள்’; அடிக்குறிப்பில் வான்பொருட்கள் என விளக்கம்
  alternative: வானிலுள்ள விண்மீன்கள் அனைத்தும்
  rationale: பாகால், சூரியன், சந்திரன், விண்மீன் கூட்டங்கள் ஆகியவற்றுடன் வரும் பட்டியல் இங்கு விண்வழிபாட்டின் வான்பொருட்களைச் சுட்டுகிறது. அதேவேளை எபிரெய உருவகத்தை முதன்மை உரையில் பாதுகாப்பது முக்கியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இரண்டாம் வாக்கியத்தில் ‘அவர் செயல்படாமல் செய்தார்’ மீண்டும் கூறப்பட்டு இலக்கணத் தொடர்பு தெளிவாக்கப்பட்டுள்ளது. ‘ஆசாரியர்’ என்பதற்குப் பதிலாக ‘பூசாரி’ பயன்படுத்தப்பட்டு வழிபாட்டு வகையின் வேறுபாடு மெதுவாக உணர்த்தப்படுகிறது.
