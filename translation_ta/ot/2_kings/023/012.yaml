base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: ta
  text: ஆகாஸின் மேலறைக் கூரையில்[a] யூதாவின் அரசர்கள் அமைத்திருந்த பலிபீடங்களையும், யாவேயின் ஆலயத்திலுள்ள இரண்டு முற்றங்களில் மனாசே அமைத்திருந்த பலிபீடங்களையும் அரசர் இடித்துத் தகர்த்து, அவற்றை அங்கேயே நொறுக்கி[b], அவற்றின் தூளை கீதரோன் பள்ளத்தாக்கில்[c] எறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆகாஸின் மேல் அறையின் கூரையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மேல் தளத்திலுள்ள அறையையோ மேலறையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய வடிவம் சிக்கலானது. சூழலுக்கேற்ப இது ‘நொறுக்கி’ என்று புரிந்துகொள்ளப்படுகிறது; உயிர்க்குறியீடுகளின்படி வாசித்தால் ‘அங்கிருந்து ஓடினார்’ என்றும் பொருள்படலாம்.
    reason: textual_ambiguity
  - marker: c
    text: ‘கீதரோன் ஓடையில்’ அல்லது ‘கீதரோன் நீரோடைப் படுகையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஓடை, நீரோடைப் படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: מִזְבֵּחַ என்பதன் வழக்கமான, தெளிவான பொருள் ‘பலிபீடம்’; இரு இடங்களிலும் பன்மை தக்கவைக்கப்பட்டுள்ளது.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: ஆகாசின் மேலறைக் கூரையில்
  rationale: עֲלִיָּה என்பது மேல் தளத்திலுள்ள அறையையோ மேலறையையோ குறிக்கலாம்; இயல்பான தமிழில் கட்டட அமைப்பையும் உடைமைத் தொடர்பையும் இச்சொற்றொடர் காக்கிறது.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்கள் அமைத்திருந்த
  rationale: பலிபீடங்கள் யோசியாவின் நடவடிக்கைக்கு முன்னரே அமைக்கப்பட்டவை என்பதை ‘அமைத்திருந்த’ இயல்பாகக் காட்டுகிறது.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்தின் இரண்டு முற்றங்களில்
  rationale: חָצֵר என்பதற்கு ‘முற்றம்’ பொருத்தமானது. בֵּית־יְהוָה என்பதன் சொற்பொருள் ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் நவீன தமிழில் ‘யாவேயின் ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נָתַץ
  choice: இடித்துத் தகர்த்து
  rationale: கட்டமைப்புகளை இடித்தழிப்பதைக் குறிக்கும் வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּרָץ מִשָּׁם
  choice: அவற்றை அங்கேயே நொறுக்கி
  rationale: தூளாக்கி எறியும் அடுத்த செயலோடு பொருந்துமாறு, இச்சூழலில் பல அறிஞர்கள் ஏற்கும் רצץ (‘நொறுக்கு’) சார்ந்த புரிதல் பின்பற்றப்பட்டுள்ளது; எபிரெய வடிவிலுள்ள சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: עֲפָרָם
  choice: அவற்றின் தூள்
  rationale: עָפָר என்பதன் ‘தூள்/புழுதி’ என்ற படிமத்தையும், நொறுக்கப்பட்ட பலிபீடங்களின் எச்சங்களையும் தக்கவைக்கிறது.
- source_word: נַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கு
  rationale: נַחַל என்பது ஓடை, நீரோடைப் படுகை, பள்ளத்தாக்கு எனப் பொருள்படலாம்; எருசலேமின் நில அமைப்பில் ‘பள்ளத்தாக்கு’ நவீன வாசகருக்குத் தெளிவானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: சிக்கலான וַיָּרָץ வடிவின் பொருள்
  choice: அவற்றை அங்கேயே நொறுக்கி
  alternative: அங்கிருந்து விரைந்து சென்று
  rationale: முந்தைய இடித்தலும் பிந்தைய தூளை எறிதலும் உருவாக்கும் செயல்வரிசையில் ‘நொறுக்கி’ இயல்பாகப் பொருந்துகிறது. ஆயினும் WLC உயிர்க்குறியீட்டின்படி ‘அவர் ஓடினார்’ என்று வாசிக்க வாய்ப்புள்ளதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய முன்வைக்கப்பட்ட செயப்படுபொருள் அமைப்பு தமிழில் இயல்பான தொடராக மாற்றப்பட்டாலும், இரண்டு பலிபீடக் குழுக்களும் அரசரின் மூன்று தொடர் நடவடிக்கைகளும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
