  source_fidelity: மூல எபிரெயத்தின் כִּי אִם என்ற வரையறை-எதிர்மறை இணைப்பு, யோசியாவின் பதினெட்டாம் அரசாண்டு, செயப்பாட்டு நַעֲשָׂה, ‘இந்தப் பஸ்கா,’ யாவேக்கு அர்ப்பணிப்பான லְ, மற்றும் எருசலேம் இடக்குறிப்பு அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘ஆட்சியின்’ என்பது அரசாண்டைக் குறிப்பதைத் தெளிவாக்கும் பாதுகாப்பான சூழல்சார் வெளிப்பாடு.
  naturalness: நடை நவீன தரநிலைத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது. ‘ஆண்டில்தான்’ மூலம் ‘but only’ என்பதன் வரையறை இயல்பாகத் தெரிவிக்கப்படுகிறது.
