  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: ta
  text: ஆனால் யோசியா அரசனின் ஆட்சியின் பதினெட்டாம் ஆண்டில்தான் இந்தப் பஸ்கா எருசலேமில் யாவேக்காகக் கொண்டாடப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “செய்யப்பட்டது”; இங்கு “கொண்டாடப்பட்டது” அல்லது “அனுசரிக்கப்பட்டது” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் ... தான்
  rationale: முந்தைய வசனத்திலுள்ள மறுப்புடன் எதிர்மறைத் தொடர்பையும், இந்த ஆண்டை மட்டும் சுட்டும் வரையறையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: யோசியா அரசனின் ஆட்சியின் பதினெட்டாம் ஆண்டில்
  rationale: இது யோசியாவின் வயதை அல்ல, அவரது ஆட்சியாண்டைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: נַעֲשָׂה
  choice: கொண்டாடப்பட்டது
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்யப்பட்டது’ என்பதாக இருந்தாலும், பஸ்காவுடன் வரும்போது ‘அனுசரிக்கப்பட்டது/கொண்டாடப்பட்டது’ என்பதே சூழலுக்குரிய பொருள்; செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: הַפֶּסַח הַזֶּה
  choice: இந்தப் பஸ்கா
  rationale: சுட்டுப்பெயரடை கொண்ட எபிரெயச் சொற்றொடரின் நேரடியான, தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: לְ முன்னொட்டு இங்கு அர்ப்பணிப்பு அல்லது நோக்கத்தைக் காட்டுகிறது; தேவனுடைய தனிப்பெயரான יהוה ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டுடன், தமிழில் வழக்கிலுள்ள இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப்பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகக் காக்கிறது; ‘யாவே’ என்பது அதன் பரவலாக ஏற்கப்படும் ஒலிப்புமுறைக்கு ஏற்ற தமிழ் வடிவம்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வாசிக்க எளிதானதும் மரியாதைமிக்கதுமான நடை. ‘ஆட்சியின்’ என்பது மூலத்தில் உள்ள அரசாண்டுக் குறிப்பைத் தெளிவுபடுத்தும் சூழல்சார் சேர்க்கை. ‘பஸ்கா’ மற்றும் ‘எருசலேம்’ ஆகியவை தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற வடிவங்கள்.
