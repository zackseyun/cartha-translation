source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: ta
  text: யூதாவின் அரசர்கள் சூரியனுக்கென்று அர்ப்பணித்திருந்த குதிரைகளை, யாவேயின் ஆலய நுழைவாயிலிலிருந்து வெளிமுற்றங்களில்[a] அமைந்திருந்த அரண்மனை அதிகாரி நெத்தன்-மெலேகின்[b] அறைவரை, அவன் அகற்றினான். சூரியனுக்குரிய தேர்களையோ அவன் நெருப்பிலிட்டு எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளிமுற்றங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது. அது ஆலய வளாகத்தின் வெளிப்புற அல்லது ஓரப்பகுதியைக் குறிக்கலாம்; “புறப்பகுதிகள்” அல்லது “தூண்மண்டபங்கள்” என்பதும் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: “அரண்மனை அதிகாரி” என்பதற்கான எபிரெயச் சொல் “அண்ணகன்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: அகற்றினான்
  rationale: שׁבת என்பதன் ஹிஃபில் வடிவம் இங்கு பயன்பாட்டை நிறுத்துதல் அல்லது அப்புறப்படுத்துதல் என்ற பொருளில் வருகிறது; யோசியாவின் வழிபாட்டுச் சீர்திருத்தச் சூழலில் ‘அகற்றினான்’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: யூதாவின் அரசர்கள் சூரியனுக்கென்று அர்ப்பணித்திருந்த
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தல்’; இவ்வழிபாட்டுச் சூழலில் குதிரைகள் சூரிய வழிபாட்டுக்காக ஒதுக்கப்பட்டதை ‘அர்ப்பணித்திருந்த’ தெளிவாகவும் அளவுமீறாத வகையிலும் தெரிவிக்கிறது.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: யெகோவாவின் ஆலய நுழைவாயிலிலிருந்து … அறைவரை
  rationale: מִן…אֶל என்ற இடத்தொடரின் திசை/எல்லை அமைப்பை ‘இலிருந்து … வரை’ எனப் பாதுகாக்கிறது; בֵית יְהוָה இச்சூழலில் ஆலயத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் தருகிறது.
- source_word: נְתַן מֶלֶךְ
  choice: நெத்தன்-மெலேக்
  rationale: மசோரா உயிர்க்குறிப்பை அணுகும் வகையில் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַסָּרִיס
  choice: அரண்மனை அதிகாரி
  rationale: סָרִיס என்பது அண்ணகனையோ அரச/அரண்மனை அதிகாரியையோ குறிக்கலாம்; உடல்நிலையை உறுதிசெய்யாமல் பதவிசார் பொருளை முதன்மை உரையில் தருகிறது.
- source_word: בַּפַּרְוָרִים
  choice: வெளிமுற்றங்களில்
  rationale: அரிதான פַּרְוָרִים ஆலய வளாகத்தின் வெளிப்புற அல்லது ஓரப்பகுதிகளைக் குறிக்கலாம்; ‘வெளிமுற்றங்கள்’ இயல்பான சூழல்சார் மொழிபெயர்ப்பு, ஆனால் நிச்சயமின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: சூரியனுக்குரிய தேர்கள்
  rationale: சூரிய வழிபாட்டோடு தொடர்புடைய தேர்கள் என்ற உடைமை/சார்பு உறவைத் தக்கவைக்கிறது.
- source_word: שָׂרַף בָּאֵשׁ
  choice: நெருப்பில் எரித்தான்
  rationale: எபிரெய உரையில் நெருப்பு வெளிப்படையாகக் குறிப்பிடப்பட்டிருப்பதால் அதைத் தமிழிலும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைநாமத்தை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு; ‘யெகோவா’ தமிழ்வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம்.
- issue: சூரியனுக்கான குதிரைகளும் தேர்களும்
  choice: வழிபாட்டுச் சார்பை வெளிப்படுத்தும் வகையில் ‘அர்ப்பணித்திருந்த’ மற்றும் ‘சூரியனுக்குரிய’
  alternative: சொல்லுக்குச் சொல் முறையில் ‘கொடுத்திருந்த’ மற்றும் ‘சூரியனின்’
  rationale: சூழல் சூரிய வழிபாட்டோடு தொடர்புடைய பொருட்களைச் சுட்டுகிறது; அவற்றை சூரியத் தெய்வமே நேரடியாக உடையதாக இருந்தது என்று கூடுதலாக விளக்காமல் அந்த வழிபாட்டுச் சார்பை மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடத்தொடரின் சற்றே நெருக்கமான எபிரெய அமைப்பைத் தமிழில் தெளிவாக்க காற்புள்ளிகளால் பெயரடைத் தொடர் பிரிக்கப்பட்டுள்ளது; அரிதான கட்டடவியல் சொல்லும் இருபொருள் பதவிச்சொல்லும் அடிக்குறிப்புகளில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
