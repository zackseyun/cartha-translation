base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: ta
  text: அப்போது அரசன் மக்கள் அனைவருக்கும் கட்டளையிட்டு, “உங்கள் கடவுளாகிய யாவேக்குப் பஸ்காவைக் கொண்டாடுங்கள்[a]; இந்த உடன்படிக்கைப் புத்தகத்தில் எழுதப்பட்டிருக்கிறபடி செய்யுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்காவை அனுசரியுங்கள்.” எபிரேய மரபுத்தொடரின் சொல்லுக்குச் சொல் பொருள், “பஸ்காவைச் செய்யுங்கள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பது அதிகாரபூர்வமாகக் கட்டளையிடுவதைக் குறிக்கிறது; தொடரும் לֵאמֹר உடன் இயல்பான தமிழ் கதைநடைக்காக ‘கட்டளையிட்டு ... என்றான்’ என வழங்கப்பட்டுள்ளது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவருக்கும்
  rationale: עם இங்கு மக்கள்தொகையை ஒட்டுமொத்தமாகக் குறிக்கிறது; எபிரெய நேரடி பொருளையும் தமிழ் வேற்றுமைத் தொடரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עֲשׂוּ פֶסַח
  choice: பஸ்காவைக் கொண்டாடுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘பஸ்காவைச் செய்யுங்கள்’ என்றாலும், இது பஸ்காவை அனுசரித்துக் கொண்டாடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கொண்டாடுங்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவான இயல்பான தமிழ்.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேக்கு
  rationale: ל அர்ப்பணிப்பு அல்லது நோக்குநிலையைக் குறிக்கிறது; இரண்டாம் நபர் பன்மை உருபும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. יהוה என்பது பொதுப்பட்டப் பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כַּכָּתוּב
  choice: எழுதியிருக்கிறபடி
  rationale: எழுத்தில் உள்ள கட்டளைக்கு இணங்கச் செயல்பட வேண்டும் என்ற எபிரெய சூத்திரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: இந்த உடன்படிக்கைப் புத்தகத்தில்
  rationale: כתב உடன் வரும் עַל, ஒரு ஆவணத்தில் எழுதப்பட்டிருப்பதைக் குறிக்கிறது; ‘இந்த’ என்ற சுட்டுப்பெயரும் ‘உடன்படிக்கைப் புத்தகம்’ என்ற ஆவணக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், நவீன ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு ஏற்ப தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பஸ்கா’, ‘உடன்படிக்கைப் புத்தகம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய ஒழுங்கு இயல்பான தமிழுக்கேற்ப அமைக்கப்பட்டுள்ளது.
