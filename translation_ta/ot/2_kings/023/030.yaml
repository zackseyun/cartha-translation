base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் இறந்துபோன அவனை மெகிதோவிலிருந்து எருசலேமுக்குக் கொண்டுவந்தார்கள்[a]; அவனுடைய கல்லறையில் அவனை அடக்கம் செய்தார்கள். பின்னர் நாட்டின் மக்கள்[b] யோசியாவின் மகனான யோவாகாஸை எடுத்துக்கொண்டு, அவனை அபிஷேகம் செய்து, அவனுடைய தந்தைக்குப் பதிலாக அவனை அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘அவனை ஏறச் செய்தார்கள்’; இங்கு இறந்த யோசியாவை ஒரு வாகனத்தில் ஏற்றிக் கொண்டுவந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நாட்டின் மக்கள்’ என்பது அரசியல் அமைப்பாகச் செயல்பட்ட உள்ளூர் மக்களைக் குறிக்கும் எபிரெயச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: அவனை ... ஏற்றிக்கொண்டு வந்து
  rationale: רכב என்பதன் ஹிபில் வடிவம் சொற்படியாக ‘அவனை ஏறச் செய்தார்கள்/வாகனத்தில் ஏற்றினார்கள்’ எனப் பொருள்படும். இறந்த யோசியாவின் உடலைக் கொண்டுவந்த சூழலை இயல்பாகவும், வாகனம் குறித்த மூலத்தின் நிழற்பொருளை முற்றிலும் அழிக்காமலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עבד என்பது பணியாளர்கள், அரச ஊழியர்கள் அல்லது பரிவாரத்தார் ஆகியோரைக் குறிக்கலாம். அரசவைக் சூழலில் இயல்பாகவும் பொதுவாகவும் புரியும் சொல்லாக ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵת
  choice: இறந்தவனாக
  rationale: பயணத்தின்போது யோசியா உயிரிழந்த நிலையில் இருந்ததை நேரடியாகக் காட்டுகிறது; ‘உடலை’ என்று மாற்றி மூலத்தின் இலக்கண வடிவத்தை மறைக்கவில்லை.
- source_word: בִּקְבֻרָתוֹ
  choice: அவனுடைய கல்லறையில்
  rationale: קבורה இங்கு அடக்க இடம் அல்லது கல்லறையைக் குறிக்கிறது. அரச அடக்கச் சூழலுக்கும் நவீன தமிழுக்கும் ‘கல்லறை’ இயல்பானது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: இது அரசியல் செயல்திறன் கொண்ட உள்ளூர் மக்களைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர். ‘பாமர மக்கள்’ என்று சமூகத் தரத்தை மிகையாக வரையறுக்காமல் சொற்றொடரின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. இங்கு அரசனாக்குவதற்காக யோவாகாசைத் தங்களிடம் கொண்டுவரும் செயலை இயல்பான தமிழில் குறிக்கிறது; ‘தேர்ந்தெடுத்தார்கள்’ என்ற விளக்கத்தை மூலத்தில் சேர்க்கவில்லை.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: அவனை அபிஷேகம் செய்து
  rationale: משׁח அரச பதவியேற்பில் எண்ணெய் பூசி அபிஷேகம் செய்யும் முறையான செயலைக் குறிக்கிறது. பொதுவான ‘நியமித்தார்கள்’ என்பதைக் காட்டிலும் மூலத்தின் சடங்கு மற்றும் அரசியல் முக்கியத்துவத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: அவனுடைய தந்தைக்குப் பதிலாக அவனை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் causative வடிவத்தையும் תחת אביו என்பதன் வாரிசுரிமை சார்ந்த ‘தந்தைக்குப் பதிலாக’ என்ற உறவையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரச அபிஷேக மொழி
  choice: அவனை அபிஷேகம் செய்து
  alternative: அவனை நியமித்து
  rationale: எபிரெயம் பொதுவான நியமிப்புச் சொல்லைப் பயன்படுத்தாமல் משׁח என்ற அபிஷேக வினையைத் தெளிவாகப் பயன்படுத்துகிறது. ஆகவே அரச பதவியேற்பின் சடங்கு மற்றும் வேதாகமச் சார்புகளை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- issue: ‘நாட்டின் மக்கள்’ என்போரின் அடையாளம்
  choice: நாட்டின் மக்கள்
  alternative: பாமர மக்கள் / நாட்டின் தலைவர்கள்
  rationale: עם הארץ ஒரு சமூக-அரசியல் குழுவைக் குறிக்கலாம்; ஆனால் இவ்வசனம் அதன் துல்லிய அமைப்பை விளக்கவில்லை. எனவே ஒரு குறிப்பிட்ட வர்க்கமாக அதைத் தீர்மானிக்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடர் எபிரெய வினைநடையை தமிழில் தெளிவான வாக்கிய ஓட்டமாக வழங்கியபோதும், ‘இறந்தவனாக’, ‘நாட்டின் மக்கள்’, ‘அபிஷேகம்’ போன்ற முக்கிய மூலக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ‘மெகிதோ’, ‘எருசலேம்’, ‘யோசியா’, ‘யோவாகாஸ்’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
