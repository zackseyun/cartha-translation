    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ ... לְפָנָיו
  choice: அவனுக்கு முன்பு, அவனைப்போல் ... அரசன் ஒருவனும் இருந்ததில்லை
  rationale: முன்வைக்கப்பட்ட ஒப்பீட்டின் வலியுறுத்தலைக் காத்து, முந்தைய அரசர்களில் யோசியாவுக்கு இணையானவர் இல்லை என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁב אֶל יְהוָה
  choice: யாவேவிடம் திரும்பிய
  rationale: שׁוּב என்பது இங்கு கடவுளிடம் திரும்புதல், மனந்திரும்புதல், உடன்படிக்கை விசுவாசம் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது; “திரும்பிய” அவற்றை அளவுக்கு மீறித் தெளிவுபடுத்தாமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய இறைப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּכָל לְבָבוֹ
  choice: தன் முழு இதயத்தோடும்
  rationale: மனவிருப்பம், சிந்தனை, பற்றுறுதி ஆகியவற்றின் முழுமையைச் சுட்டும் எபிரெய மரபுத்தொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וּבְכָל נַפְשׁוֹ
  choice: முழு உயிரோடும்
  rationale: נֶפֶשׁ இங்கு ஒருவரின் முழு உயிரையும் தன்மையையும் குறிக்கிறது; “உயிர்” நவீன வாசகருக்குப் புரியக்கூடியதாய் இருந்து, தேவையற்ற உடல்–ஆன்மா இருமையைத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: וּבְכָל מְאֹדוֹ
  choice: முழு ஆற்றலோடும்
  rationale: מְאֹד இச்சூத்திரத்தில் ஒருவரின் மொத்த திறன் அல்லது வலிமையைக் குறிக்கிறது; “ஆற்றல்” இயல்பான நவீனத் தமிழ், “வலிமை” அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: மோசேயின் சட்டம் முழுவதற்கும் ஏற்ப
  rationale: இவ்வரச மதிப்பீட்டுச் சூழலில் תּוֹרָה மோசேயின் சட்டத் தொகுப்பைக் குறிக்கிறது; “சட்டம்” தெளிவான சமகாலச் சொல்லாகும்.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: அவனுக்குப் பிறகும் அவனைப்போல் ஒருவன் எழும்பவில்லை
  rationale: பின்னர் அவனுக்கு இணையான அரசன் தோன்றவில்லை என்ற ஒப்பீட்டை, “எழும்பவில்லை” என்ற மூல உருவகத்தைத் தக்கவைத்து வழங்குகிறது.
theological_decisions:
- issue: யோசியாவின் திரும்புதலில் שׁוּב என்பதன் உடன்படிக்கை மற்றும் மனந்திரும்புதல் பொருள்
  choice: யாவேவிடம் திரும்பிய
  alternative: யாவேவிடம் மனந்திரும்பிய
  rationale: மூல வினைச்சொல் உடன்படிக்கை விசுவாசத்திற்குத் திரும்புதலையும் மனந்திரும்புதலையும் ஒருங்கே உணர்த்தக்கூடும்; பிரதான உரை இந்தப் பொருள் அகலத்தைக் காக்கிறது.
- issue: உபாகமம் 6:5 உடனான எதிரொலி
  choice: முழு இதயம்... முழு உயிர்... முழு ஆற்றல் என்ற மும்மையைத் தக்கவைத்தல்
  alternative: முழு இதயம்... முழு ஆன்மா... முழு வலிமை
  rationale: உடன்படிக்கை சார்ந்த முழுமையான பற்றுறுதியை வெளிப்படுத்தும் மும்மையைத் தக்கவைத்து, சமகாலத் தமிழில் இயல்பாக வழங்குகிறது; தொடர்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. “நியாயப்பிரமாணம்,” “ஆத்துமா” போன்ற பழமையான சொற்களுக்கு மாற்றாக “சட்டம்,” “உயிர்” பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் முன்–பின் அமைப்பும் யோசியாவின் ஒப்பற்ற தன்மையும் தெளிவாகக் காக்கப்பட்டுள்ளன.
