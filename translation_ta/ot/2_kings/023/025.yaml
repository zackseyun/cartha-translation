  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: ta
  text: 'அவனுக்கு முன்பு, அவனைப்போல் தன் முழு இதயத்தோடும், முழு உயிரோடும், முழு ஆற்றலோடும்[b][c], மோசேயின் சட்டம் முழுவதின்படியும் யாவேவிடம் திரும்பிய[a] அரசன் ஒருவனும் இருந்ததில்லை; அவனுக்குப் பிறகும் அவனைப்போன்ற அரசன் ஒருவனும் எழும்பவில்லை.


    [a] வேறு வகையில், “யாவேவிடம் திரும்பி வந்த.” எபிரெய வினைச்சொல் மனந்திரும்புதலையும் உடன்படிக்கைக்கு உண்மையாக இருந்து கடவுளிடம் திரும்புதலையும் குறிக்கலாம்.


    [b] “முழு இதயத்தோடும், முழு உயிரோடும், முழு ஆற்றலோடும்” என்பது உபாகமம் 6:5-ஐ எதிரொலிக்கிறது.


    [c] “ஆற்றலோடும்” என்பதற்குப் பதிலாக “வலிமையோடும்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், “யாவேவிடம் திரும்பி வந்த.” எபிரெய வினைச்சொல் மனந்திரும்புதலையும் உடன்படிக்கைக்கு உண்மையாக இருந்து கடவுளிடம் திரும்புதலையும் குறிக்கலாம்.
