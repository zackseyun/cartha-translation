base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: ta
  text: அப்போது யோசியா திரும்பி, மலையில் இருந்த கல்லறைகளைக்[a] கண்டார். அவர் ஆட்களை அனுப்பி, கல்லறைகளிலிருந்து எலும்புகளை எடுத்து, அவற்றைப் பலிபீடத்தின்மேல் எரித்து, அதனைத் தீட்டுப்படுத்தினார். இவற்றை அறிவித்த கடவுளின் மனிதர் அறிவித்த[b] யாவேயின் வார்த்தையின்படி அவர் இவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடக்கவிடங்களை.’ எபிரெயச் சொல் கட்டப்பட்ட கல்லறைகளை மட்டுமல்லாமல், பொதுவாக அடக்கம் செய்யும் இடங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உரக்க அறிவித்த’ அல்லது ‘கூவி அறிவித்த.’ எபிரெய வினைச்சொல் உரத்த பொதுப் பிரகடனத்தை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: திரும்பிப் பார்த்தபோது
  rationale: פנה என்பதன் உடல் திரும்புதலையும், அதைத் தொடர்ந்து வரும் பார்ப்பதையும் இயல்பான தமிழ் தொடராக இணைக்கிறது.
- source_word: הַקְּבָרִים
  choice: கல்லறைகள்
  rationale: קבר என்பது கல்லறை அல்லது பொதுவாக அடக்கவிடம் எனப் பொருள்படலாம்; சூழலில் அடையாளம் காணக்கூடிய அடக்கவிடங்களுக்கு ‘கல்லறைகள்’ இயல்பாக உள்ளது.
- source_word: בָּהָר
  choice: மலையில்
  rationale: הַר என்பதன் நேரடியான நிலவியல் குறிப்பைப் பாதுகாக்கிறது; அதன் உயரத்தை மேலதிகமாகத் தீர்மானிப்பதில்லை.
- source_word: הָעֲצָמוֹת
  choice: எலும்புகள்
  rationale: மனித எலும்புகளை எரித்ததே பலிபீடத்தைத் தீட்டுப்படுத்திய செயல் என்பதால், மூலத்தின் திடமான சொல்லை நேரடியாக வழங்குகிறது.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் எரிக்கச் செய்து
  rationale: எலும்புகள் பலிபீடத்தின்மேல் எரிக்கப்பட்டதைத் தெளிவாகக் கூறுகிறது; யோசியா ஆட்களை அனுப்பிச் செயலை நிறைவேற்றிய சூழலுக்கு தமிழ் காரணவினை இயல்பாக அமைகிறது.
- source_word: וַיְטַמְּאֵהוּ
  choice: அதைத் தீட்டுப்படுத்தினார்
  rationale: சடங்குசார் טמא என்பதையும், அண்மைய ஒருமை முன்னிலையான பலிபீடத்தைக் குறிக்கும் பின்னொட்டையும் பாதுகாக்கிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேவின் வார்த்தையின்படியே
  rationale: முன்னர் உரைக்கப்பட்ட இறைவார்த்தையின் நிறைவேற்றத்தைத் தெரிவிக்கும் எபிரெயச் சூத்திரத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: ‘தேவனுடைய மனிதன்’ என்ற எபிரெயப் பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கிப் பரப்பாமல் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: קָרָא
  choice: அறிவித்த
  rationale: தீர்க்கதரிசனச் சூழலில் அதிகாரமுள்ள பொது அறிவிப்பைத் தெரிவிக்கிறது; வினையின் ‘உரக்க அழைத்தல்’ நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றைக் குறித்து
  rationale: דברים என்பது சொற்களையோ நிகழ்வுகளையோ குறிக்கலாம்; இங்கு முன்னறிவிக்கப்பட்ட செயல்களை இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: யோசியாவின் செயலை முந்தைய தீர்க்கதரிசனத்துடன் இணைக்கும் நிறைவேற்றச் சூத்திரம்
  choice: ‘இவற்றைக் குறித்து இறைவனின் மனிதர் அறிவித்த யாவேவின் வார்த்தையின்படியே இது நடந்தது’ என்று வெளிப்படையான நிறைவேற்றத் தொடர்பாக மொழிபெயர்த்தல்
  alternative: ‘இறைவனின் மனிதர் கூவிய யாவேவின் வார்த்தையின்படி’ என்று நெருக்கமான சொல்வரிசையில் அமைத்தல்
  rationale: எபிரெய வாக்கியம் யோசியாவின் செயலை, இறைவனின் மனிதர் வழியாக முன்பு அறிவிக்கப்பட்ட யாவேவின் வார்த்தையின் நிறைவேற்றமாக இணைக்கிறது. தமிழ் வாக்கிய அமைப்பு அந்தத் தொடர்பைத் தெளிவாக்குகிறது; புதிய விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்,’ ‘தீட்டுப்படுத்துதல்,’ ‘இறைவனின் மனிதர்’ ஆகியவை வேதாகமச் சூழலின் கருத்துகளைத் துல்லியமாகக் காக்கின்றன. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நிகழ்வுகளின் வரிசையும் நிறைவேற்றத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
