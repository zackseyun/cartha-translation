  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: ta
  text: பின்பு அரசன் யாவேயின் ஆலயத்திற்குச் சென்றான். அவனுடன் யூதாவின் ஆண்கள் அனைவரும், எருசலேமில் குடியிருந்தவர்கள் அனைவரும், ஆசாரியர்களும், தீர்க்கதரிசிகளும், சிறியோர்முதல் பெரியோர்வரை மக்கள் அனைவரும் சென்றார்கள். யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட உடன்படிக்கைப் புத்தகத்தின் வார்த்தைகள் அனைத்தையும் அரசன் அவர்கள் கேட்கும்படி வாசித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: சென்றான்
  rationale: עלה என்பதில் மேலே செல்லும் திசைநுட்பம் இருந்தாலும், தமிழில் ஆலயத்திற்குச் 'ஏறிச் சென்றான்' என்பது தேவையற்ற இடவியல் வலியுறுத்தலாக ஒலிக்கலாம்; இயல்பான சூழல்சார் இணையாக 'சென்றான்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: சொல்லர்த்தம் 'யெகோவாவின் வீடு'; இச்சூழலில் தமிழில் 'ஆலயம்' தெளிவாகவும் இயல்பாகவும் வழிபாட்டிடத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தைப் பொதுப்பட்டமான 'ஆண்டவர்' என்று மாற்றாமல், தமிழில் வழக்கிலுள்ள தனிப்பெயர் வடிவத்தில் வழங்குகிறது.
- source_word: כָל אִישׁ יְהוּדָה
  choice: யூதாவின் ஆண்கள் அனைவரும்
  rationale: אִישׁ என்ற ஆண்பால் சொல்லையும் அதன் கூட்டுப்பொருளையும் மறைக்காமல், இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள் அனைவரும்
  rationale: இடத்தில் வசிப்பவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்புவினையின் இயல்பான தமிழ் இணை.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணிச் சூழலில் כֹּהֵן என்பதற்கான பரவலாக அறியப்படும் தமிழ் வேதாகமச் சொல்.
- source_word: הַנְּבִיאִים
  choice: தீர்க்கதரிசிகள்
  rationale: நְבִיאִים என்பதற்கான நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: சிறியோர்முதல் பெரியோர்வரை
  rationale: சமூகத்தின் முழு வரம்பையும் குறிக்கும் மூலமொழி மரபுத்தொடரின் உருவகத் திறந்த தன்மையைப் பாதுகாக்கிறது; வயதைக் குறிக்கும் 'இளையோர்முதல் முதியோர்வரை' எனச் சுருக்கவில்லை.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: அவர்கள் கேட்கும்படி வாசித்தான்
  rationale: எழுதப்பட்ட புத்தகத்தின் உள்ளடக்கத்தைச் சத்தமாக வாசித்த பொதுக் கேள்வுணர்வு நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סֵפֶר הַבְּרִית
  choice: உடன்படிக்கைப் புத்தகம்
  rationale: בְּרִית என்பதன் உறவுசார், கட்டுப்படுத்தும் உடன்படிக்கைப் பொருளைப் பாதுகாக்கும் நிலையான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழியாக்கம்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் திருநாமமே இருப்பதால், தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவம் பாதுகாக்கப்பட்டது.
- issue: כָל אִישׁ יְהוּדָה என்ற ஆண்பால் கூட்டுத்தொடர்
  choice: யூதாவின் ஆண்கள் அனைவரும்
  alternative: யூதாவின் மக்கள் அனைவரும்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் வடிவத்தை நடுநிலைப்படுத்தாமல் வைத்திருக்கிறது; இதன் பிரதிநிதித்துவ அல்லது சமூக வரம்பை உரையிலேயே தீர்மானிக்கவில்லை.
- issue: לְמִקָּטֹן וְעַד גָּדוֹל என்ற மரபுத்தொடரின் வரம்பு
  choice: சிறியோர்முதல் பெரியோர்வரை
  alternative: தாழ்ந்தோர்முதல் உயர்ந்தோர்வரை
  rationale: மூலம் வயது, பதவி அல்லது சமூக முக்கியத்துவம் ஆகியவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தீர்மானிக்காததால், அதன் உருவகத் தெளிவின்மையைத் தக்கவைக்கிறது.
