  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பட்டியலின் முழுமையும் அரசன் பொதுமக்கள் கேட்க வாசித்த செயலும் பாதுகாக்கப்பட்டுள்ளன.
