  edition: WLC
  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יַּאַסְפ֣וּ אֵלָ֔י/ו כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: ta
  text: அப்போது அரசன் ஆளனுப்பினான்[a]; யூதா மற்றும் எருசலேமின் மூப்பர்கள் அனைவரும் அவனிடம் கூடிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் வெளிப்படையாக: “அப்போது அரசன் யூதா மற்றும் எருசலேமின் மூப்பர்கள் அனைவரையும் வரச்சொல்லி ஆளனுப்பினான்; அவர்கள் அவனிடம் கூடிவந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பினான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பினான்’. இச்சூழலில் அழைப்பதற்காகத் தூதர்களையோ ஆட்களையோ அனுப்பியதைக் குறிக்கிறது. ‘ஆளனுப்பினான்’ என்பது குறிப்பிடப்படாத செயப்படுபொருளைச் சேர்க்காமல் இந்தச் சூழற்பொருளை இயல்பான தமிழில் தருகிறது; ‘வரச்சொல்லி அனுப்பினான்’ என்பது சாத்தியமான விரிவாக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் பெயருக்கு முன்னுள்ள சுட்டுருபின் குறிப்புத்தன்மையைத் தமிழில் சூழல் இயல்பாக வெளிப்படுத்துகிறது. வசனம் யோசியா என்ற பெயருக்குப் பதிலாகப் பட்டத்தையே பயன்படுத்துவதால் ‘அரசன்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: அவனிடம் கூடிவந்தார்கள்
  rationale: வினை வடிவம் செயப்பாட்டு பன்மை—‘அவர்கள் கூடினார்கள்’. אֶל இயக்கத்தை ‘அவனிடம்’ எனக் காட்டுகிறது. இயல்பான தமிழில் ‘கூடிவந்தார்கள்’ என்பது அவனிடம் வந்து ஒன்றுகூடிய நிகழ்வைத் தெளிவாகத் தெரிவிக்கிறது; எபிரெயத்தின் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
- source_word: כָּל זִקְנֵי
  choice: மூப்பர்கள் அனைவரும்
  rationale: כָּל முழுமையைக் குறிக்கும் ‘அனைவரும்’; זִקְנֵי இச்சூழலில் வயதான ஆண்களை மட்டும் அல்ல, அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களான ‘மூப்பர்களை’ குறிக்கிறது.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: யூதா மற்றும் எருசலேமின்
  rationale: இவை நிலையான தமிழ் வேதாகமப் பெயர்வடிவங்கள். இணைக்கப்பட்ட இரு இடப்பெயர்களுக்கும் ‘மூப்பர்கள்’ தொடர்புடையவர்கள் என்பதை ஒரே உடைமைத் தொடராக இயல்பாகக் காட்டுகிறது.
