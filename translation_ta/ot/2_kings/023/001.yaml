translation_notes:
  register: நவீன செந்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஆளனுப்பினான்’ என்பது அன்றாட வாசகருக்குப் புரியும் இயல்பான சொல்; ‘மூப்பர்கள்’ நிர்வாக மற்றும் சமூகத் தலைமையைக் குறிக்கும் நிலையான வேதாகமச் சொல். எபிரெயத்தின் செயப்பாட்டு ‘அவர்கள் கூடினார்கள்’ என்ற வடிவம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
