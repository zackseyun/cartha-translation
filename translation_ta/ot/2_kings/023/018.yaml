  register: நவீன நிலையான தமிழில், வாசிக்க எளிய ஆனால் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மரியாதைப் பன்மை வினைமுற்றுகளும் ‘அவர்’ என்ற வடிவமும் மனிதர்களைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ‘எலும்புகள்’ என்ற மீளுரையும் பேணப்பட்டுள்ளது.
