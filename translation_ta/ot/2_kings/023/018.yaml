  source_fidelity: மூல எபிரேயத்தின் கட்டளைத் தொடர் (“அவரை அப்படியே விட்டுவிடுங்கள்; ஒருவரும் அவருடைய எலும்புகளை அசைக்க வேண்டாம்”) துல்லியமாக வெளிப்படுகிறது. தொடர்ந்து வரும் וַיְמַלְּטוּ, சூழலுக்கு ஏற்றவாறு எலும்புகளைத் தொடாமல் விட்டனர்/பாதுகாத்தனர் என்ற பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எலும்புகள்’ என்ற மூலத்தின் குறிப்பான, மீளும் சொல்லாட்சியும் காக்கப்பட்டுள்ளது. ‘சமாரியாவிலிருந்து வந்த இறைவாக்கினர்’ என்பதும் மூலத்தோடு பொருந்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அப்படியே விட்டுவிடுங்கள்,’ ‘ஒருவரும் … அசைக்க வேண்டாம்,’ ‘எலும்புகளோடு’ ஆகியவை இயல்பானவை. வாக்கியத்தின் இறுதி சொற்தொடர் சற்றே வலியுறுத்தலான அமைப்பைக் கொண்டிருந்தாலும் வாசிப்புக்குத் தடையில்லை; மூலத்தில் உள்ள இரு தொகுதி எலும்புகளின் தொடர்பைத் தெளிவாக்குகிறது.
  terminology: ‘இறைவாக்கினர்’ என்பது נָבִיאக்கு ஏற்ற, நவீனத் தமிழில் நிலையான மற்றும் சமயநடைக்கு பொருத்தமான இணைச்சொல். ‘சமாரியா’ வழக்கமான இடப்பெயர் வடிவம். எந்தக் குறிப்பிட்ட இறையியல் விளக்கமும் சேர்க்கப்படவில்லை.
