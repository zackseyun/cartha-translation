base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: ta
  text: அவர், “அவரை அப்படியே விட்டுவிடுங்கள்; ஒருவரும் அவருடைய எலும்புகளை அசைக்க வேண்டாம்” என்றார். எனவே, சமாரியாவிலிருந்து வந்த இறைவாக்கினரின் எலும்புகளோடு அவருடைய எலும்புகளையும் அவர்கள் அப்படியே விட்டுவிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமாரியாவிலிருந்து வந்த இறைவாக்கினரின் எலும்புகளோடு அவருடைய எலும்புகளையும் அவர்கள் காப்பாற்றினார்கள்.”
    reason: וַיְמַלְּטוּ என்பதற்கு ‘காப்பாற்றினார்கள்’ அல்லது ‘சேதமின்றி பாதுகாத்தார்கள்’ என்ற பொருளும் உண்டு.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: அவரை அப்படியே விட்டுவிடுங்கள்
  rationale: இச்சூழலில் இந்தக் கட்டளை, இறந்தவரின் எஞ்சியவற்றைத் தோண்டியெடுப்பதையோ அவமதிப்பதையோ நிறுத்துமாறு கூறுகிறது. ‘அப்படியே விட்டுவிடுங்கள்’ என்பது இயல்பான தமிழில் அந்தக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: אִישׁ אַל יָנַע
  choice: ஒருவரும் … அசைக்க வேண்டாம்
  rationale: אִישׁ இங்கு பொதுப்பொருளில் ‘எவரும்’ என்பதைக் குறிக்கிறது; נוע எலும்புகளை அவற்றின் இடத்திலிருந்து நகர்த்துவதைக் குறிக்கிறது. ‘அசைக்க வேண்டாம்’ என்பது மூலத்தின் நேரடியான உருவகத்தைப் பேணுகிறது.
- source_word: עַצְמֹתָיו
  choice: அவருடைய எலும்புகள்
  rationale: மூலத்தில் ‘எலும்புகள்’ என்று வெளிப்படையாகவும் மீண்டும் மீண்டும் வருவதால், பொதுவான ‘உடல் எச்சங்கள்’ என்பதற்குப் பதிலாக அதே தெளிவான சொல்லைப் பயன்படுத்துகிறது.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: அவருடைய எலும்புகளையும் அவர்கள் அப்படியே விட்டுவிட்டார்கள்
  rationale: முந்தைய தடைக்குக் கீழ்ப்படிந்து எலும்புகளைத் தொடாமல் பாதுகாத்தனர் என்பதே சூழல்சார் பொருள். மלט என்பதிலுள்ள ‘காப்பாற்று/தப்புவி’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: இறைவாக்கினரின் எலும்புகளோடு
  rationale: இருவரின் எலும்புகளும் ஒன்றாகத் தொடப்படாமல் விடப்பட்டன என்ற தொடர்பை ‘எலும்புகளோடு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: נָבִיא என்பதற்கு நவீன, கண்ணியமான, எளிதில் புரியும் தமிழ் இணைச்சொல்.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: சமாரியாவிலிருந்து வந்த
  rationale: இறைவாக்கினர் முன்பு சமாரியாவிலிருந்து வந்ததைத் தமிழின் இயல்பான பெயரெச்சத் தொடரால் தெரிவிக்கிறது.
