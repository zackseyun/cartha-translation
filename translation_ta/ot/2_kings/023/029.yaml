base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: ta
  text: அவனுடைய நாட்களில் எகிப்தின் அரசனாகிய பார்வோன் நெகோ[a], அசீரியாவின் அரசனுக்கு எதிராக ஐபிராத்து ஆற்றுவரை படையெடுத்துச் சென்றான். யோசியா அரசன் அவனைச் சந்திக்கச் சென்றான்[c]; அவன் அவனை மெகிதோவில் கொன்றான், அவனைக் கண்டபோது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நெகோ’; மரபுவழியாக ‘நெக்கோ’ என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'விளக்கமாக: “யோசியா அவனைச் சந்திக்கச் சென்றபோது, பார்வோன் நெகோ அவனை மெகிதோவில் கொன்றான்.” எபிரெயத்தில் மூன்றாம் நபர் பதிலிடுபெயர்கள் யாரைக் குறிக்கின்றன என்பது வெளிப்படையாக இல்லை.'
    reason: alternative_reading
  - marker: c
    text: யோசியாவின் மரணம் குறித்த இணை நிகழ்வுரைக்கு 2 நாளாகமம் 35:20–24-ஐயும் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: யோசியாவின் ஆட்சிக்காலத்தைக் குறிக்கும் எபிரெயக் காலவழக்கை இயல்பான தமிழில் நெருக்கமாகப் பேணுகிறது.
- source_word: עָלָה ... עַל
  choice: எதிராக ... படையெடுத்துச் சென்றான்
  rationale: இராணுவச் சூழலில் ‘மேலே சென்றான்’ என்பதைக் காட்டிலும் நோக்கத்தையும் இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது; עַל என்பதன் ‘எதிராக’ என்ற பொருளையும் பேணுகிறது.
- source_word: פַרְעֹה נְכֹה
  choice: பார்வோன் நெகோ
  rationale: பட்டத்தையும் எபிரெய வடிவுக்கு நெருக்கமான பெயரொலிப்பையும் தருகிறது.
- source_word: עַל נְהַר פְּרָת
  choice: ஐபிராத்து ஆற்றுவரை
  rationale: இங்கு ஆற்றை நோக்கிய படைநகர்வின் இலக்கைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க
  rationale: சந்திப்பு நட்பானதா மோதலானதா என்பதை முடிவு செய்யாமல் மூலச்சொல்லின் பொருள் விரிவைப் பேணுகிறது.
- source_word: וַיְמִיתֵהוּ
  choice: கொன்றான்
  rationale: מות என்பதன் ஹிஃபீல் வடிவிலுள்ள ‘இறக்கச் செய்தான்’ என்ற கருத்தை நேரடியான நவீனத் தமிழில் தருகிறது.
- source_word: בִּמְגִדּוֹ
  choice: மெகிதோவில்
  rationale: நிகழ்வு நடந்த இடத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: அவன் இவனை ... கண்டபோது
  rationale: இரண்டு மூன்றாம் நபர் ஆண்பால் ஒருமைப் பதிலிடுபெயர்களின் தொடர்பை பெயர்களால் தீர்மானிக்காமல், தமிழில் வாசிக்கக்கூடிய அளவில் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள மூன்றாம் நபர் பதிலிடுபெயர்களின் தெளிவின்மை
  choice: ‘அவன் இவனை ... கண்டபோது கொன்றான்’ என்று பெயர்களைச் சேர்க்காமல் தெளிவின்மையைப் பேணுதல்
  alternative: ‘பார்வோன் நெகோ, யோசியா தன்னைச் சந்திக்க வந்தபோது, அவனை மெகிதோவில் கொன்றான்’
  rationale: எபிரெய உரையில் செய்பவரும் செயப்படுபவரும் சுருக்கமான ஒரே பாலின-எண் பதிலிடுபெயர்களால் சுட்டப்படுகின்றனர். 2 நாளாகமம் 35:20–24 அடிப்படையில் பொருளைத் தெளிவுபடுத்துவது சாத்தியமானாலும், அதை முதன்மை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் தருவது உரையின் உண்மையான பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை. மூலத்தின் பதிலிடுபெயர் தெளிவின்மை திட்டமிட்டு பேணப்பட்டுள்ளது. அடிக்குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
