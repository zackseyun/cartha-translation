  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: ta
  text: மேலும், யூதா நாட்டிலும் எருசலேமிலும் காணப்பட்ட ஆவிகளை அழைத்துப் பேசுவோரையும், ஆவியருளுரை கூறுவோரையும்,[a] வீட்டுத் தெய்வங்களையும், சிலைகளையும், அருவருப்பான எல்லாவற்றையும் யோசியா அகற்றினார். யாவேயின் ஆலயத்தில் ஆசாரியனான இல்க்கியா கண்டெடுத்த நூலில்[b] எழுதப்பட்டிருந்த திருச்சட்டத்தின் வார்த்தைகளை நிலைநாட்டுவதற்காக அவர் இவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு எபிரெயச் சொற்களும் மறைமுறை வழியாக இறந்தோர் அல்லது ஆவிகளுடன் தொடர்புகொள்வதைக் குறிக்கின்றன. அவை அத்தகைய செயலில் ஈடுபடுவோரையோ, அவர்களுடன் தொடர்புடைய ஆவிகளையோ குறிக்கலாம்.
    reason: மூலச் சொற்களின் குறிப்பிடுபொருளில் உள்ள உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
  - marker: b
    text: அல்லது, “சுருளில்.” இங்குள்ள எபிரெயச் சொல் எழுதப்பட்ட ஓர் ஆவணத்தைக் குறிக்கிறது; அது சுருள் வடிவில் இருந்திருக்கலாம்.
    reason: ‘நூல்’ என்பதற்குப் பின்னுள்ள பண்டைய ஆவண வடிவை விளக்கும் சொற்பொருள் மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய சீர்திருத்த நடவடிக்கைகளுடன் இதையும் சேர்க்கும் எபிரெயச் சொல்லின் கூட்டல் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֹבוֹת וְהַיִּדְּעֹנִים
  choice: ஆவிகளை அழைத்துப் பேசுவோரையும், குறிசொல்பவர்களையும்
  rationale: இரு சொற்களும் இறந்தோர் அல்லது ஆவிகளுடன் தொடர்புடைய தடைசெய்யப்பட்ட மறைமுறைச் செயல்களில் ஈடுபடுவோரைக் குறிக்கும் இணைச்சொற்களாக இச்சூழலில் புரிந்துகொள்ளப்படுகின்றன; அவற்றை ஒன்றாக்காமல் வேறுபடுத்திக் காட்டுகிறது.
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வங்கள்
  rationale: குடும்ப அல்லது வீட்டுச் சமய வழிபாட்டில் பயன்படுத்தப்பட்ட தெய்வ உருவங்களின் செயல்பாட்டை நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַגִּלֻּלִים
  choice: சிலைகள்
  rationale: இது இழிவுணர்வு கொண்ட எபிரெயச் சொல்; இயல்பற்ற கடுமையான சொல்லாக்கத்தைத் தவிர்த்து, அதன் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: அருவருப்பான அனைத்தும்
  rationale: சடங்கு மற்றும் சமய ரீதியில் வெறுக்கத்தக்க பொருட்கள் அல்லது நடைமுறைகள் ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய மூலத்தின் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: נִרְאוּ
  choice: காணப்பட்ட
  rationale: நிபால் வடிவின் செயப்பாட்டு கருத்தை நெருக்கமாகப் பேணுகிறது; அவை அப்பகுதிகளில் இருந்ததையும் காணக்கூடியவையாக இருந்ததையும் தெரிவிக்கிறது.
- source_word: בִּעֵר
  choice: அகற்றினார்
  rationale: வினை எரித்தொழித்தல் அல்லது முற்றிலும் நீக்குதல் என்ற வலிமையைக் கொள்ளலாம். பட்டியலில் மனிதர்களும் பொருட்களும் இருப்பதால், அகற்றினார் என்பது முறையைத் தேவையின்றி ஒரேவிதமாக்காமல் முழுமையான நீக்கத்தைக் கூறுகிறது.
- source_word: לְמַעַן הָקִים
  choice: நிலைநாட்டுவதற்காக
  rationale: சட்டத்தின் வார்த்தைகள் நடைமுறையில் உறுதியாக நிற்கச் செய்வது என்ற நோக்கத்தைப் பேணுகிறது; தீர்க்கதரிசனம் நிறைவேறுதல் என்ற தேவையற்ற கருத்தைத் தவிர்க்கிறது.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: திருச்சட்டத்தின் வார்த்தைகள்
  rationale: இச்சூழலில் תּוֹרָה உடன்படிக்கை சார்ந்த இறைச் சட்டப் போதனையைக் குறிக்கிறது; ‘திருச்சட்டம்’ அதன் சமயச் சூழலையும் ‘வார்த்தைகள்’ דִּבְרֵי என்பதையும் பேணுகின்றன.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: நூலில் எழுதப்பட்டிருந்த
  rationale: தமிழில் எழுதப்பட்ட ஆவணத்தைக் குறிக்க இயல்பாக உள்ளது; அது சுருள் வடிவிலிருந்திருக்கலாம் என்ற வரலாற்று வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வீடு’ என்றாலும், இங்கு குறிக்கப்படுவது எருசலேம் ஆலயம் என்பதால் நவீன தமிழில் இயல்பானதும் சூழலுக்கு துல்லியமானதுமான சொல்லாக்கம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: אֹבוֹת மற்றும் יִדְּעֹנִים மனிதப் practitioners-ஐக் குறிக்கிறதா அல்லது ஆவி சார்ந்த entities-ஐக் குறிக்கிறதா
  choice: தடைசெய்யப்பட்ட மறைமுறைச் செயல்களில் ஈடுபடுவோர் என மொழிபெயர்த்தல்
  alternative: ஆவிகள் மற்றும் குறிசொல்லும் ஆவிகள் எனப் பொருட்களாக மொழிபெயர்த்தல்
  rationale: בִּעֵר என்ற வினையும் அரசனின் சீர்திருத்தச் சூழலும் மனிதப் பயிற்சியாளர்களைக் குறிக்கும் வாசிப்புக்கு ஆதரவளிக்கின்றன; எனினும் எபிரெயச் சொற்களின் குறிப்பிடுபொருள் விவாதத்திற்குரியது என்பதால் அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்படுகிறது.
- issue: திருநாமம் יהוה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெயத் திருநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் அதன் தனிப்பெயர் இயல்பைப் பேணுகிறது.
- issue: הָקִים என்பதன் சட்டவியல் கருத்து
  choice: திருச்சட்டத்தின் வார்த்தைகளை நிலைநாட்டுதல்
  alternative: திருச்சட்டத்தின் வார்த்தைகளை நிறைவேற்றுதல் அல்லது செயல்படுத்துதல்
  rationale: ‘நிலைநாட்டுதல்’ மூலத்தில் உள்ள நிற்கச் செய்தல் அல்லது நடைமுறையில் உறுதிப்படுத்துதல் என்ற கருத்தைத் தக்கவைத்து, தீர்க்கதரிசன நிறைவேற்றம் என்ற தனிப்பட்ட இறையியல் பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘திருச்சட்டம்’, ‘ஆலயம்’ ஆகியவை பரவலாகப் புரியும் சமயச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; தொன்மையான அல்லது பிரிவுசார் சொல்லாக்கம் தவிர்க்கப்பட்டுள்ளது.
