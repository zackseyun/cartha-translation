source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: ta
  text: மேலும், இஸ்ரயேலின் அரசர்கள் கோபமூட்டுவதற்காக[a] ஏற்படுத்தியிருந்த சமாரியாவின் நகரங்களிலுள்ள மேடைகளின் வழிபாட்டு இல்லங்கள் அனைத்தையும் யோசியா அகற்றினார். பெத்தேலில் அவர் செய்த செயல்கள் அனைத்தையும் போலவே அவற்றுக்கும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலிலிருந்து இன்னும் வெளிப்படையாக, “ஆண்டவருக்குக் கோபமூட்டுவதற்காக” என்றும் பொருள் கொள்ளலாம்.
    reason: மூலத்தில் கோபமூட்டப்பட்டவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; விரிந்த சூழல் ஆண்டவரைக் குறிக்கிறது.
lexical_decisions:
- source_word: וְגַם
  choice: அனைத்தையும் யோசியா அகற்றினார்
  rationale: முந்தைய சீர்திருத்த நடவடிக்கையுடன் இதையும் சேர்க்கும் தொடர்ச்சியைத் தமிழ் வாக்கிய அமைப்பில் ‘அனைத்தையும்’ மற்றும் சூழல் வழியாக இயல்பாக வெளிப்படுத்துகிறது; தனியாக ‘மேலும்’ சேர்ப்பது இங்கு தேவையற்ற இறுக்கத்தைத் தரும்.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: மேடைகளின் வழிபாட்டு இல்லங்கள்
  rationale: ‘மேடுகள்/உயரிடங்கள்’ என்ற வழிபாட்டுத் தலங்களையும், בָּתֵּי என்பதன் கட்டிடப் பொருளையும் தெளிவாகக் காக்கிறது; வெறும் ‘கோயில்கள்’ என்பது அளவுக்கு மீறிய விளக்கமாகலாம்.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: சமாரியாவின் நகரங்களிலுள்ள
  rationale: இங்கு சமாரியா நகரத்தை மட்டும் அல்லாமல் முன்னாள் வடக்கு அரசின் பிரதேசத்தைக் குறிக்கிறது; எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לְהַכְעִיס
  choice: கோபமூட்டுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் לְ-ஐயும், הכעיס என்பதன் ‘கோபத்தைத் தூண்டுதல்’ என்ற பொருளையும் காக்கிறது; யாரைக் கோபமூட்டினர் என்பது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: הֵסִיר
  choice: அகற்றினார்
  rationale: சீர்திருத்தச் சூழலில் வழிபாட்டு அமைப்புகளை நீக்குதல்/ஒழித்தல் என்ற causative பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיַּעַשׂ לָהֶם
  choice: அவற்றுக்கும் செய்தார்
  rationale: எபிரெயத்தின் நேரடியான ஆனால் சூழல் சார்ந்த சொற்றொடரைப் பாதுகாக்கிறது; குறிப்பிட்ட செயலை மூலத்தைவிட விரிவுபடுத்தவில்லை.
- source_word: כְּכָל הַמַּעֲשִׂים
  choice: செயல்கள் அனைத்தையும் போலவே
  rationale: כְּ என்பதன் ஒப்புமையையும், מַעֲשִׂים என்பதன் பன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: இடப்பெயருடன் தமிழ் வேற்றுமை உருபைப் பயன்படுத்தி, முந்தைய வசனங்களில் விவரிக்கப்பட்ட அதே இடத்து நடவடிக்கைகளைச் சுட்டுகிறது.
theological_decisions:
- issue: לְהַכְעִיס என்பதில் கோபமூட்டப்பட்டவரின் மறைமுக அடையாளம்
  choice: முதன்மை உரையில் ‘கோபமூட்டுவதற்காக’ என்று பொருளை வெளிப்படையாகச் சொல்லாமல் விடுதல்
  alternative: ‘ஆண்டவருக்குக் கோபமூட்டுவதற்காக’
  rationale: விரிந்த சூழலில் ஆண்டவரே குறிக்கப்படுகிறார் என்பது தெளிவானாலும், இந்த எபிரெயச் சொற்றொடரில் செயப்படுபொருள் கூறப்படவில்லை. அந்த மறைமுகத்தன்மையை முதன்மை உரை காக்கிறது; அடிக்குறிப்பு சூழல் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘மேடைகளின் வழிபாட்டு இல்லங்கள்’ என்பது எபிரெயச் சொல்லின் கட்டிட மற்றும் வழிபாட்டுத் தலக் கூறுகளை இரண்டையும் காக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி [a] முதன்மை உரையில் அதற்குரிய மறைமுகச் சொல்லின் அருகே இடப்பட்டுள்ளது.
