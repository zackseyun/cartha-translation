base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: ta
  text: யாவேயின் ஆலயத்தில் இருந்த வழிபாட்டுக்கென அர்ப்பணிக்கப்பட்ட ஆண்களின் வீடுகளை அவன் இடித்துப்போட்டான்.[a] அங்கே பெண்கள் அசேராவுக்காகத் தொங்குதுணிகளை நெய்துகொண்டிருந்தார்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ஆண்பால் பன்மை; அதன் அடிப்படைப் பொருள் ‘அர்ப்பணிக்கப்பட்டவர்கள்’. பாரம்பரியமாக இது ‘ஆண் வழிபாட்டு விபசாரிகள்’ என்று விளக்கப்படுகிறது; ஆனால் இவர்களின் துல்லியமான சடங்கு பங்கு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘தொங்குதுணிகள்’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘வீடுகள்’ என்று பொருள்படும். இங்கு அது நெய்யப்பட்ட உறைகள், தொங்குதுணிகள் அல்லது கூடாரம் போன்ற வழிபாட்டு அமைப்புகளைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘அசேரா’ என்பது அசேரா என்ற தேவதையையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம்; பின்னது சில நேரங்களில் ‘அசேரா கம்பம்’ என அழைக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: இடித்துப்போட்டான்
  rationale: נתץ என்பது கட்டமைப்புகளைத் தகர்த்தல் அல்லது இடித்தல் என்பதைக் குறிக்கிறது; இச்சூழலில் இயல்பான, வலிமையுள்ள தமிழ் நடை.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: ஆண் வழிபாட்டு விபசாரிகளின் அறைகள்
  rationale: בָּתֵּי என்பதன் நேர்பொருள் ‘வீடுகள்’; ஆனால் ஆலய வளாகத்திற்குள் இருந்த இடங்களைத் தமிழில் ‘அறைகள்’ என்பது இயல்பாகக் காட்டுகிறது. הַקְּדֵשִׁים ஆண்பால் பன்மை என்பதால் ‘ஆண்’ வெளிப்படையாகச் சேர்க்கப்பட்டது; இச்சூழலில் அது முறைகேடான பாலியல் வழிபாட்டில் ஈடுபட்டவர்களைக் குறிக்கிறது.
- source_word: בְּבֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்தில்
  rationale: ‘யெகோவாவின் வீடு’ என்ற நேரடி வடிவத்தைவிட இங்கு ‘ஆலயம்’ சாதாரண வாசகருக்குத் தெளிவானது; יהוה தனிப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: אֹרְגוֹת שָׁם
  choice: அங்கே ... நெய்துவந்தார்கள்
  rationale: பெண்பால் பன்மை நிகழ்காலப் பங்கேற்பு தொடர்ந்த அல்லது வழக்கமான செயலைக் காட்டுகிறது; שָׁם என்பதும் தமிழில் தக்கவைக்கப்பட்டது.
- source_word: בָּתִּים לָאֲשֵׁרָה
  choice: அசேராவுக்காகத் துணிக் கூடாரங்கள்
  rationale: בָּתִּים என்பதன் நேர்பொருள் ‘வீடுகள்’; நெய்தல் என்ற வினையோடு வருவதால் துணியால் செய்யப்பட்ட கூடாரம் அல்லது உறை போன்ற அமைப்புகளைக் குறிக்கலாம். ‘துணிக் கூடாரங்கள்’ நேர்பொருளையும் சூழலையும் இணைக்கிறது; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָאֲשֵׁרָה
  choice: அசேராவுக்காக
  rationale: אֲשֵׁרָה தெய்வத்தையோ அதனோடு தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம்; ‘அசேரா’ எனப் பெயரை மட்டும் பயன்படுத்துவது அந்த இருபொருள் வாய்ப்பை ஓரளவு திறந்துவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவத்தில் வழங்குகிறது.
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: அசேரா
  alternative: அசேரா தேவதை; அசேரா வழிபாட்டுச் சின்னம்/கம்பம்
  rationale: எபிரெயச் சொல் தேவதையையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடியதால் முதன்மை உரை அதனைத் தீர்மானிக்கவில்லை.
- issue: הַקְּדֵשִׁים என்போரின் அடையாளம்
  choice: ஆண் வழிபாட்டு விபசாரிகள்
  alternative: வழிபாட்டுக்கென அர்ப்பணிக்கப்பட்ட ஆண்கள்
  rationale: இச்சூழல் முறைகேடான பாலியல் வழிபாட்டைக் குறிக்கிறது; ஆண்பால் பன்மை வடிவமும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது. சொல்லின் நேரடி அர்ப்பணிப்பு சார்ந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ஆலயச் சூழலில் בָּתֵּי என்பதற்கு ‘அறைகள்’ பயன்படுத்தப்பட்டுள்ளது. சர்ச்சைக்குரிய வழிபாட்டுச் சொற்களில் தேவையற்ற மென்மைப்படுத்தலைத் தவிர்த்து, அசேரா மற்றும் நெய்யப்பட்ட பொருட்களின் நிச்சயமின்மை அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
