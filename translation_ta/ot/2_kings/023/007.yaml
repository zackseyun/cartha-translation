- from: யெகோவாவின் ஆலயத்தில் இருந்த ஆண் வழிபாட்டு விபசாரிகளின் அறைகளை அவன் இடித்துப்போட்டான்.[a] அங்கே பெண்கள் அசேராவுக்காகத் துணிக் கூடாரங்களை நெய்துவந்தார்கள்.[b][c]
  to: யாவேயின் ஆலயத்தில் இருந்த வழிபாட்டுக்கென அர்ப்பணிக்கப்பட்ட ஆண்களின் வீடுகளை அவன் இடித்துப்போட்டான்.[a] அங்கே பெண்கள் அசேராவுக்காகத் தொங்குதுணிகளை நெய்துகொண்டிருந்தார்கள்.[b][c]
  rationale: திட்டத்தின் யாவே-வழங்கல் கொள்கை பின்பற்றப்பட்டுள்ளது. הַקְּדֵשִׁים என்பதன் விவாதத்திற்குரிய பொருளை முதன்மை உரையில் முன்கூட்டியே தீர்மானிக்காமல், மூலச்சொல்லின் அர்ப்பணிப்பு உணர்வு பாதுகாக்கப்பட்டு, பாரம்பரிய பாலியல்-சடங்கு விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. ‘வீடுகள்’ மற்றும் நெய்யப்பட்ட பொருட்களின் பொருள் சார்ந்த நிச்சயமின்மையும் உரை மற்றும் அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளது.
