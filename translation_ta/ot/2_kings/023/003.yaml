source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: ta
  text: 'அப்போது அரசன் தூணருகே நின்று, யாவே முன்னிலையில் உடன்படிக்கை செய்தான்: யாவேவைப் பின்பற்றி நடக்கவும், அவருடைய கட்டளைகளையும் சாட்சியங்களையும் விதிமுறைகளையும் தன் முழு மனதோடும் முழு உயிரோடும் கடைப்பிடிக்கவும், இந்தப் புத்தகத்தில்[a] எழுதப்பட்டுள்ள இந்த உடன்படிக்கையின் வார்த்தைகளை நிறைவேற்றவும் உறுதிபூண்டான். மக்கள் அனைவரும் அந்த உடன்படிக்கையில் இணைந்தனர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்தச் சுருளில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சுருள், புத்தகம் அல்லது ஆவணத்தைக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “மக்கள் அனைவரும் உடன்படிக்கையில் நின்றார்கள்.” இது அவர்கள் உடன்படிக்கையை ஏற்றுக்கொண்டு அதில் பங்கேற்றதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: தூணருகே நின்று
  rationale: עַל என்பது இங்கு அரசருக்குரிய சடங்கு இடமான தூணின் அருகில்/பக்கத்தில் நிற்பதைக் குறிக்கிறது; தூணின்மேல் நின்றார் என்று இயல்பற்ற வகையில் பொருள் கொள்ளவில்லை.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: உடன்படிக்கையை ஏற்படுத்தினான்
  rationale: כרת ברית என்பதன் சொற்பொருள் ‘உடன்படிக்கையை வெட்டுதல்’; நவீன தமிழில் அதன் வழக்குப் பொருளை இயல்பாகத் தரும் வகையில் மொழிபெயர்க்கப்பட்டது. எபிரெயிலுள்ள குறிப்பிட்ட சுட்டு நிலை ‘அந்த/உடன்படிக்கையை’ என்பதில் காக்கப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: ‘யாவேவுக்கு முன்பாக’ என்பதைக் காட்டிலும், தெய்வீக முன்னிலையில் நிகழ்ந்த உடன்படிக்கைச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: யாவேவைப் பின்பற்றி நடக்கவும்
  rationale: ‘பின்னால் நடத்தல்’ என்ற உடன்படிக்கை உருவகத்தைத் தக்கவைத்தபடியே, கீழ்ப்படிந்து பின்பற்றுதல் என்ற பொருளை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: அவருடைய கட்டளைகளையும் சாட்சிநியமங்களையும் சட்டங்களையும்
  rationale: மூன்று வேறுபட்ட உடன்படிக்கைச் சட்டச் சொற்களையும் ஒன்றாகக் கலக்காமல் தனித்தனி தமிழ்ச் சொற்களால் காட்டுகிறது; ‘சாட்சிநியமங்கள்’ என்பது עֵדוֹת-இன் சாட்சி சார்ந்த சட்டப் பொருளைக் காக்கிறது.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: தன் முழு இதயத்தோடும் முழு உயிரோடும்
  rationale: לֵב மற்றும் נֶפֶשׁ ஆகியவற்றின் வேறுபாட்டையும் முழுமையான அர்ப்பணிப்பு என்ற உடன்படிக்கைச் சூத்திரத்தையும் காக்கிறது.
- source_word: לְהָקִים
  choice: நிறைவேற்றவும்
  rationale: இங்கு உடன்படிக்கையின் எழுதப்பட்ட வார்த்தைகளை நடைமுறைப்படுத்துதல்/செயலாக்குதல் என்பதே சூழலுக்கேற்ற பொருள்.
- source_word: הַסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில்
  rationale: סֵפֶר என்பது புத்தகம், சுருள் அல்லது ஆவணம் எனக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான ‘புத்தகம்’ பயன்படுத்தப்பட்டு மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: மக்கள் அனைவரும் அந்த உடன்படிக்கையில் நிலைத்துநின்றார்கள்
  rationale: ‘உடன்படிக்கையில் நின்றார்கள்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, உடன்படிக்கை உறுதியில் தங்களை நிலைநிறுத்தினார்கள் என்ற பொருளையும் தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே அதனைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית என்ற உடன்படிக்கை ஏற்புச் சூத்திரம்
  choice: அந்த உடன்படிக்கையில் நிலைத்துநின்றார்கள்
  alternative: அந்த உடன்படிக்கையை ஏற்றுக்கொண்டார்கள்
  rationale: மக்கள் உடன்படிக்கையை ஏற்றுக்கொண்டனர் என்பது சூழல்பொருள்; ஆனால் ‘நின்றார்கள்’ என்ற எபிரெய உருவகம் உறுதியான பற்றுதலையும் சுட்டக்கூடும். முதன்மை உரை இரண்டையும் இயன்றவரை தக்கவைத்து, சொற்பொருளை அடிக்குறிப்பு விளக்குகிறது.
- issue: அரசனின் உறுதிப்பாட்டில் வரும் தன்மை மாற்றம்
  choice: உறுதிபூண்டான் என்ற வினைச் சேர்க்கை மூலம் நோக்கத்தைத் தெளிவாக்குதல்
  alternative: முடிவிலி வினைகளை மட்டும் தொடர்ச்சியாக அமைத்தல்
  rationale: எபிரெயில் உடன்படிக்கையை ஏற்படுத்திய செயலைத் தொடர்ந்து ‘பின்பற்றி நடக்க, கடைப்பிடிக்க, நிறைவேற்ற’ என்ற நோக்கவினைகள் வருகின்றன. தமிழில் இலக்கணத் தெளிவுக்காக ‘உறுதிபூண்டான்’ சேர்க்கப்படுகிறது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உடன்படிக்கைச் சட்ட மொழியின் தனித்துவம் காக்கப்பட்டுள்ளது. ‘சாட்சிநியமங்கள்’ சற்றே செறிவான சட்டச் சொல் என்றாலும், மூலத்தின் மூன்று இணைச் சட்டப் பிரிவுகளை ஒன்றாக்காமல் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
