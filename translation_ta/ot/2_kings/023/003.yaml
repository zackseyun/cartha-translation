  rationale: 'திருத்தம் மூலத்தின் உடன்படிக்கை மொழியை அதிகத் துல்லியமாகவும் நவீன தமிழில் இயல்பாகவும் வழங்குகிறது: כרת ברית என்பதற்கு ‘உடன்படிக்கை செய்தான்’ பயன்படுத்தப்பட்டுள்ளது; மூன்று சட்டவகைகள் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; இறுதி வினைச்சொல் மக்கள் உடன்படிக்கையில் இணைந்தனர் என்ற சூழல்சார் பொருளைத் தருகிறது, நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. அடிக்குறிப்பு குறியீடுகள் உரையில் சரியான இடங்களில் உள்ளன.'
