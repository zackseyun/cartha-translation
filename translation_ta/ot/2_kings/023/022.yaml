    issue: Cumbersome repetition of ‘எல்லா நாட்களிலும்’
    rationale: Hebrew has one ‘all the days’ governing both ‘the kings of Israel’ and ‘the kings of Judah.’ Recasting this as ‘இஸ்ரவேல் அரசர்களினதும் யூதா அரசர்களினதும் எல்லா நாட்களிலும்’ is more idiomatic Tamil and maintains the same temporal scope.
