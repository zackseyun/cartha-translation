revisions:
- from: ஏனெனில், இஸ்ரவேலை நியாயந்தீர்த்த நியாயாதிபதிகளின் நாட்களிலிருந்து, இஸ்ரவேலின் அரசர்களுடைய எல்லா நாட்களிலும் யூதாவின் அரசர்களுடைய எல்லா நாட்களிலும், இப்படிப்பட்ட பஸ்கா கொண்டாடப்படவில்லை.[a]
