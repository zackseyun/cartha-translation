  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேலை நியாயந்தீர்த்த நியாயாதிபதிகளின் நாட்களிலிருந்து, இஸ்ரவேல் அரசர்களினதும் யூதா அரசர்களினதும் எல்லா நாட்களிலும் இப்படிப்பட்ட பஸ்கா கொண்டாடப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “இந்தப் பஸ்காவைப் போல்”; அதாவது, “இதைப் போன்ற ஒரு பஸ்கா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோசியா கட்டளையிட்ட பஸ்காவுக்கான விளக்கத்தை அறிமுகப்படுத்தும் காரண/விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: נַעֲשָׂה
  choice: கொண்டாடப்படவில்லை
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பஸ்காவுடன் வரும் இச்சூழலில் ‘கொண்டாடு’ என்பது இயல்பான தமிழ் வழக்கு; செயப்பாட்டு வடிவத்தையும் மறுப்பையும் காக்கிறது.
- source_word: כַּפֶּסַח הַזֶּה
  choice: இப்படிப்பட்ட பஸ்கா
  rationale: ஒப்புமையைக் குறிக்கும் כְּ மற்றும் ‘இந்தப் பஸ்கா’ ஆகியவற்றின் சேர்க்கை ‘இதைப் போன்ற பஸ்கா’ எனப் பொருள்படுகிறது; முற்றிலும் பஸ்கா அனுசரிக்கப்படவில்லை என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: நியாயாதிபதிகளின் நாட்களிலிருந்து
  rationale: מִן குறிக்கும் காலத் தொடக்கத்தையும், இஸ்ரவேலின் வரலாற்றுக் காலப்பிரிவையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை நியாயந்தீர்த்த
  rationale: ‘நியாயாதிபதிகள்’ என்ற பெயருக்கும் שׁפט என்ற வினைக்கும் உள்ள சொல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: இஸ்ரவேலின் அரசர்களுடைய எல்லா நாட்களிலும் யூதாவின் அரசர்களுடைய எல்லா நாட்களிலும்
  rationale: இரு அரச மரபுகளையும் தனித்தனியாகக் குறிப்பிடும் எபிரெய அமைப்பைப் பாதுகாத்து, மறுப்பின் கால எல்லையைத் தொடர்கிறது.
theological_decisions:
- issue: வரலாற்று ஒப்பீட்டின் வரம்பு
  choice: நியாயாதிபதிகளின் காலத்திலிருந்து இஸ்ரவேல் மற்றும் யூதா அரசர்களின் காலம் முழுவதிலும் யோசியாவின் பஸ்காவைப் போன்ற ஒன்று கொண்டாடப்படவில்லை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அந்தக் காலம் முழுவதும் எந்தப் பஸ்காவுமே கொண்டாடப்படவில்லை என்று எடுத்துக்கொள்ளலாம்.
  rationale: כַּפֶּסַח הַזֶּה என்பது ‘இந்தப் பஸ்காவைப் போன்ற’ என்ற ஒப்பீட்டைக் குறிக்கிறது; ஆகவே எல்லா பஸ்கா அனுசரிப்புகளின் முழுமையான இல்லாமையை உரை கூறுவதாக மாற்றாமல், ஒப்பிடத்தக்க தன்மையுள்ள பஸ்கா இல்லாததைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுப் பதவிப் பெயரான ‘நியாயாதிபதிகள்’ மற்றும் பரவலாக அறியப்பட்ட ‘பஸ்கா’ ஆகியவை தக்கவைக்கப்பட்டுள்ளன. வாக்கியத்தின் கண்ணியமான வரலாற்று நடையும் எபிரெய ஒப்பீட்டின் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
