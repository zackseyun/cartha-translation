translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. வழிபாட்டுச் சொற்களான ‘ஆசாரியர்கள்’, ‘தூபம்’, ‘மேடைகள்’, ‘தீட்டுப்படுத்தினான்’ ஆகியவை மூலத்தின் பண்பாட்டு மற்றும் சடங்கு சார்ந்த பொருளைத் தக்கவைக்கின்றன. கடினமான இறுதித் தொடரின் சாத்தியமான பொருள் முதன்மை உரையில் வாசிக்கத்தக்கவாறு வழங்கப்பட்டு, அதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டது.
