  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: ta
  text: அவன் யூதாவின் நகரங்களிலிருந்த எல்லா ஆசாரியர்களையும் வரவழைத்து, கேபா முதல் பெயெர்செபா வரை ஆசாரியர்கள் தூபம் எரித்துவந்த மேடைகளைத் தீட்டுப்படுத்தினான். நகரத்தின் ஆளுநரான யோசுவாவின் வாயிலின் நுழைவிடத்தில் இருந்த வாயில் மேடைகளையும்[a] அவன் இடித்துப்போட்டான். அவை நகர வாயிலில் ஒருவரின் இடப்பக்கத்தில் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் விளக்கமாக, “வாயில்களருகிலிருந்த வழிபாட்டிடங்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல் “வாயில்களின் மேடைகள்.”
    reason: lexical_alternative
  - marker: b
    text: “நகர வாயிலில் ஒருவரின் இடப்பக்கத்தில்” என்ற எபிரெயச் சொற்றொடர் தெளிவற்றது. வாயிலுக்குள் நுழையும்போது இடப்புறத்தில் இருந்த இடத்தை இது குறிக்கலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: வரவழைத்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்தல்/கொண்டுவருதல்’ எனப் பொருள்படும். இங்கு யூதாவின் நகரங்களிலிருந்து ஆசாரியர்களை அழைத்து வரச் செய்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: כֹּהֵן என்பதற்கான நிலையான, பரவலாகப் புரியக்கூடிய தமிழ் வேதாகமச் சொல்.
- source_word: מֵעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களிலிருந்து
  rationale: עָרִים நகரங்கள் அல்லது ஊர்கள் எனலாம்; பரந்த பொருளைத் தக்கவைக்கும் வகையில் ‘நகரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְטַמֵּא
  choice: தீட்டுப்படுத்தினான்
  rationale: טמא பியேல் வடிவத்தின் வழிபாட்டுச் சூழலிலான ‘தீட்டாக்குதல்/அசுத்தப்படுத்துதல்’ என்ற பொருளைச் சுருக்கமாக வழங்குகிறது.
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: בָּמוֹת என்பது உள்ளூர் வழிபாட்டு உயரிடங்களைக் குறிக்கும் மரபுச் சொல். ‘மேடைகள்’ மூலத்தின் உருவகத்தையும் வழிபாட்டுச் சூழலையும் காக்கிறது.
- source_word: קִטְּרוּ שָׁמָּה
  choice: தூபம் எரித்துவந்த
  rationale: קטר தூபம் அல்லது புகைப் பலி எரித்தலைக் குறிக்கிறது. தொடர்ச்சியாக முன்பு நடந்த செயலை ‘எரித்துவந்த’ இயல்பாக வெளிப்படுத்துகிறது; שָׁמָּה என்பதன் இடப்பொருள் தொடர்புச் சொல்லில் வெளிப்படுகிறது.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: கேபா முதல் பெயெர்செபா வரை
  rationale: வடக்கிலிருந்து தெற்குவரையான யூதாவின் பரப்பைக் குறிக்கும் புவியியல் தொடர்; இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டன.
- source_word: וְנָתַץ
  choice: இடித்துப்போட்டான்
  rationale: נתץ என்பது கட்டமைப்பை இடித்தல் அல்லது தகர்த்தல்; தமிழில் வலிமையான, இயல்பான செயற்பாட்டைத் தருகிறது.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: வாயில் மேடைகள்
  rationale: எபிரெயச் சேர்க்கைச் சொற்றொடரின் சுருக்கத்தையும் இடத் தொடர்பின் தெளிவின்மையையும் ஓரளவு காக்கிறது; ‘வாயில்களருகிலிருந்த வழிபாட்டிடங்கள்’ என்ற விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: யோசுவாவின் வாயிலின் நுழைவிடத்தில்
  rationale: פֶּתַח ‘திறப்பு/நுழைவிடம்’; எபிரெயத் தொடரில் வரும் வாயில் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: שַׂר הָעִיר
  choice: நகரத்தின் ஆளுநர்
  rationale: שַׂר அதிகாரி, தலைவர் அல்லது ஆளுநர் எனலாம். குடிமை நிர்வாகச் சூழலில் ‘ஆளுநர்’ பொருத்தமானது; அரச பதவியை அவசியம் குறிக்காது.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: அவை நகர வாயிலுக்குள் நுழைகிற ஒருவரின் இடப்பக்கத்தில் இருந்தன
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஒருவரின் இடப்பக்கத்தில்’ என்பதைத் தக்கவைத்தும், இயல்பான இடநிலையை உணர்த்த ‘நுழைகிற’ என்பதை விளக்கமாகச் சேர்த்தும் உள்ளது; மூலத்தின் கடினத்தன்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
