  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: ta
  text: அவன் பென்-இன்னோம் பள்ளத்தாக்கிலுள்ள தோப்பேத்தைத் தீட்டுப்படுத்தினான்; ஒருவனும்[b] தன் மகனையோ மகளையோ மோலேக்குக்காக[c] நெருப்பினூடே கடத்தாதபடி[a] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் மகனையோ மகளையோ நெருப்பினூடே கடத்துதல்” என்பது மோலேக்குடன் தொடர்புடைய ஒரு வழிபாட்டுச் சடங்கைக் குறிக்கும் எபிரெயச் சொற்றொடர்; இது பெரும்பாலும் பிள்ளைப் பலியைக் குறித்ததாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “யாரும்.” எபிரெயத்தில் ஆண்பால் ஒருமைச் சொல் இங்கு பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது, “மோலேக்குக்கு.” குறைந்த சாத்தியமுள்ள வேறொரு புரிதல்: “அரசனுக்கு.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: தீட்டுப்படுத்தினான்
  rationale: טמא என்பதன் பியேல் வடிவம் ‘தீட்டாக்குதல்/தீட்டுப்படுத்துதல்’ என்று பொருள்படும். யோசியா அந்த வழிபாட்டிடத்தைப் பயன்படுத்த முடியாதபடி ஆக்கிய சூழலில், சடங்குசார் அசுத்தத்தையும் இடத்தைப் புனிதப் பயன்பாட்டிலிருந்து அகற்றியதையும் இச்சொல் இயல்பாகக் காட்டுகிறது.
- source_word: הַתֹּפֶת
  choice: தோப்பேத்தை
  rationale: இது ஓர் இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெய definite article தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בְּגֵי בני הִנֹּם
  choice: பென்-இன்னோம் பள்ளத்தாக்கிலுள்ள
  rationale: גֵי என்பது ‘பள்ளத்தாக்கு’; בני הִנֹּם பாரம்பரிய இடப்பெயராகப் பாதுகாக்கப்பட்டு ‘பென்-இன்னோம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְבִלְתִּי
  choice: கடத்தாதபடி செய்தான்
  rationale: இக்கட்டமைப்பு தடைசெய்யும் நோக்கத்தைச் சுட்டுகிறது. தமிழில் எதிர்மறை வினையெச்சத்தோடு ‘செய்தான்’ என்பது அந்த நோக்கத்தையும் விளைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַעֲבִיר
  choice: கடத்த
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் ‘கடந்து செல்லச் செய்தல்/கடத்துதல்’ என்ற காரணவினைப் பொருளுடையது. வழிபாட்டுச் சொற்றொடரின் மூல உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் பாதுகாக்க ‘கடத்த’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒருவனும்
  rationale: மூலத்தில் ஆண்பால் ஒருமைச் சொல் பொதுப்பொருளில் வருகிறது. ‘ஒருவனும்’ அதன் இலக்கண வடிவத்தைப் பாதுகாக்கிறது; இங்கு அது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: தன் மகனையோ மகளையோ
  rationale: எபிரெயத்தில் இணைப்புச் சொல் ‘மற்றும்’ என்றாலும், எதிர்மறை வாக்கியத்தில் பிள்ளைகளில் எவரையும் குறிக்கும் பகிர்வுப் பொருளைத் தமிழில் ‘மகனையோ மகளையோ’ இயல்பாகத் தருகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பினூடே
  rationale: ‘கடத்துதல்’ என்ற வினையோடு, வழிபாட்டுச் சொற்றொடரின் ‘நெருப்பின் வழியாக’ என்ற வடிவை ‘நெருப்பினூடே’ துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לַמֹּלֶךְ
  choice: மோலேக்குக்கு
  rationale: மசோரா உயிர்க்குறிப்பும் இச்சூழலின் வழிபாட்டுத் தொடர்பும் இதைத் தெய்வத்தின் பெயரான ‘மோலேக்கு’ எனப் புரிந்துகொள்ள ஆதரிக்கின்றன. ‘அரசனுக்கு’ என்பது சாத்தியமான ஆனால் குறைவாக ஏற்கப்படும் மாற்று வாசிப்பு.
theological_decisions:
- issue: பிள்ளைகளை நெருப்பினூடே கடத்தும் வழிபாட்டுச் சொற்றொடரை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: ‘தன் மகனையோ மகளையோ ... நெருப்பினூடே கடத்த’ என்ற மூல மொழியின் சொற்றொடரை முதன்மைப் பிரதியில் வைத்தல்
  alternative: ‘தன் மகனையோ மகளையோ மோலேக்குக்குப் பலியிட’ அல்லது ‘நெருப்பில் எரித்துப் பலியிட’
  rationale: இது பிள்ளைகளை உட்படுத்திய மோலேக்கு வழிபாட்டுச் சடங்கைக் குறிக்கிறது; பெரும்பாலும் பிள்ளைப் பலி என்று புரிந்துகொள்ளப்படுகிறது. ஆயினும், எபிரெயச் சொற்றொடர் ‘கடத்துதல்’ என்ற மறைமுக வழக்கைக் கொண்டிருப்பதால், அதை முதன்மைப் பிரதியில் பாதுகாத்து விளக்கத்தை அடிக்குறிப்பில் வழங்குவது மூலத்தின் உண்மையான வெளிப்பாட்டு அளவைப் பேணுகிறது.
- issue: אִישׁ என்ற பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ‘ஒருவனும்’
  alternative: ‘யாரும்’
  rationale: ‘ஒருவனும்’ மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பிரதிபலிக்கிறது; அதேவேளையில் இச்சூழலில் அது பொதுப்பொருளில் ‘யாரும்’ என்பதைக் குறிக்கிறது என்பதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: לַמֹּלֶךְ என்பதன் அடையாளம்
  choice: தெய்வத்தின் பெயராக ‘மோலேக்குக்கு’
  alternative: ‘அரசனுக்கு’
  rationale: மசோரா வாசிப்பும் சுற்றியுள்ள வழிபாட்டுச் சூழலும் ‘மோலேக்கு’ என்ற பெயரை ஆதரிக்கின்றன. இருப்பினும், மெய்யெழுத்துகளை ‘அரசனுக்கு’ எனப் புரிந்துகொள்ளும் குறைந்த சாத்தியமுள்ள மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டுப்படுத்தினான்’ சடங்குசார் பொருளைத் தக்கவைக்கிறது; ‘நெருப்பினூடே கடத்த’ மூலத்தின் திட்டமிட்ட மறைமுக வழிபாட்டுச் சொற்றொடரை அதிகமாக விளக்காமல் பாதுகாக்கிறது. இடப்பெயர்களும் தெய்வப்பெயரும் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
