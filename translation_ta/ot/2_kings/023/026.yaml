  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: ta
  text: ஆனாலும், மனாசே தம்மைக் கோபமூட்டிய எல்லாத் தூண்டுதல்களினாலும், யூதாவுக்கு எதிராகத் தமது கோபம் பற்றியெரிந்த தமது பெரும் எரியும் கோபத்திலிருந்து யாவே திரும்பவில்லை[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, ‘அவருடைய மூக்கு/கோபத்தின் பெரும் எரிச்சல்’; இது கடுங்கோபத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூதாவில்’; எபிரெய முன்னிடைச்சொல் சொல்லுக்கு நெருக்கமாக ‘இல்’ என்பதாகும்; சூழலில் அது கோபத்தின் இலக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: யோசியாவின் சீர்திருத்தங்களுக்குப் பின்னும் நிலை மாறாததை வலுவான முரண்பாடாக இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֹא שָׁב יְהוָה מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: யாவேவின் பெருங்கோபத்தின் உக்கிரம் தணியவில்லை
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘யாவே திரும்பவில்லை’ என்று கூறினாலும், கோபத்திலிருந்து திரும்புதல் என்ற உருவகத்தின் சூழற்பொருளைத் தமிழில் ‘கோபத்தின் உக்கிரம் தணியவில்லை’ என்பது இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது; חֲרוֹן אַף என்பதிலுள்ள எரியும் தீவிரமும் ‘உக்கிரம்’ என்பதில் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: YHWH என்னும் தெய்வீகப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר חָרָה אַפּוֹ בִּיהוּדָה
  choice: யூதாவுக்கு எதிராகப் பற்றியெரிந்த
  rationale: חָרָה אַפּוֹ என்பதிலுள்ள ‘கோபம் எரிதல்’ உருவகத்தைப் ‘பற்றியெரிந்த’ எனத் தக்கவைக்கிறது; בְּ என்பதன் இலக்கு சார்ந்த பொருள் ‘எதிராக’ எனத் தெளிவாக்கப்படுகிறது.
- source_word: עַל כָּל הַכְּעָסִים
  choice: எல்லாச் செயல்களினாலும்
  rationale: כְּעָסִים என்பது இங்கு கோபத்தைத் தூண்டிய செயல்களைக் குறிக்கிறது. அடுத்துள்ள ‘கோபமூட்டிய’ என்பதுடன் தேவையற்ற சொல் மீளுருவாக்கத்தைத் தவிர்த்து இயல்பான தமிழை அளிக்கிறது.
- source_word: אֲשֶׁר הִכְעִיסוֹ מְנַשֶּׁה
  choice: மனாசே தம்மைக் கோபமூட்டிய
  rationale: Hiphil வடிவத்தின் காரணவினைப் பொருளான ‘கோபமடையச் செய்தல்’ என்பதைக் கச்சிதமாகத் தருகிறது; ‘தம்மை’ என்பது யாவேவைச் சுட்டும் மரியாதைப் பிரதிப்பெயர்.
theological_decisions:
- issue: கடவுளின் கோபத்தை மனித உணர்வுருவில் கூறும் மொழி
  choice: ‘பெருங்கோபத்தின் உக்கிரம்’ மற்றும் ‘பற்றியெரிந்த’ என்ற தீவிரமான உருவக மொழியைத் தக்கவைத்தல்
  alternative: ‘மிகுந்த அதிருப்தி’ என்று மென்மைப்படுத்துதல்
  rationale: மூலத்தில் חֲרוֹן אַף மற்றும் חָרָה אַפּוֹ ஆகிய இரண்டும் எரியும் கோபத்தின் உருவகத்தை வெளிப்படையாகக் கொண்டுள்ளன; அதை இறையியல் விளக்கத்தால் மென்மைப்படுத்தாமல் பாதுகாக்க வேண்டும்.
- issue: ‘யாவே திரும்பவில்லை’ என்ற இலக்கண உருவகத்தின் மொழிபெயர்ப்பு
  choice: ‘யாவேவின் ... உக்கிரம் தணியவில்லை’
  alternative: ‘யாவே தமது ... கோபத்திலிருந்து திரும்பவில்லை’
  rationale: மாற்று வடிவம் மூல இலக்கணத்தை நெருக்கமாகப் பின்பற்றினாலும் தமிழில் தெளிவற்றதாக ஒலிக்கும். தேர்ந்த வடிவம் இறைக் கோபம் நீங்காததையே கூறுகிறது; ‘மனம்மாறவில்லை’ போன்ற கூடுதல் இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: தெய்வீகப் பெயர் יהוה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் பொதுவாசகர் புரிந்துகொள்ளும் தெளிவும் பேணப்பட்டுள்ளன. ‘உக்கிரம்’, ‘பற்றியெரிந்த’ ஆகிய சொற்கள் மூலத்தின் தீவிரத்தைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப காரணப்பகுதியை முன்னிறுத்துகிறது.
