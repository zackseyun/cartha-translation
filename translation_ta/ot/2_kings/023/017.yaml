base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: ta
  text: அப்போது அவன், “நான் பார்க்கும் இந்த நினைவுச்சின்னம்[a] என்ன?” என்று கேட்டான். நகரத்தார் அவனிடம், “அது யூதாவிலிருந்து வந்து, பெத்தேலிலுள்ள பலிபீடத்திற்கு எதிராக நீங்கள் செய்த இந்தக் காரியங்களை அறிவித்த[b] தேவனுடைய மனிதரின் கல்லறை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடையாளக்கல்,’ ‘நினைவுக்கல்’ அல்லது ‘கல்லறைக் குறி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: '‘உரக்க அறிவித்த’ அல்லது ‘எதிராகக் கூவினான்’ என்றும் மொழிபெயர்க்கலாம்; இவ்வினைச்சொல் பலிபீடத்தைப் பற்றிய தேவனுடைய மனிதரின் தீர்க்கதரிசனப் பிரகடனத்தைக் குறிக்கிறது (ஒப்பிடுக: 1 இராஜாக்கள் 13:1–2).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: நினைவுச் சின்னம்
  rationale: இச்சொல் அடையாளமிடப்பட்ட நினைவுக்குறி அல்லது கல்லறைக் குறியைக் குறிக்கலாம். சூழலில் காணக்கூடிய கல்லறை சார்ந்த சின்னம் என்பதால், பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பாகத் தருகிறது.
- source_word: הַלָּז
  choice: அந்த
  rationale: பேசுபவர் கண்ணால் காணும் குறிப்பிட்ட பொருளைச் சுட்டும் எபிரெயச் சொல்லின் இடச்சுட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲנִי רֹאֶה
  choice: நான் பார்க்கும்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் நிகழ்காலத் தொடர்ச்சியைத் தமிழில் இயல்பான பெயரெச்சத் தொடராகத் தருகிறது.
- source_word: הַקֶּבֶר
  choice: கல்லறை
  rationale: அடையாளச் சின்னத்துடன் தொடர்புடைய புதைவிடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: எபிரெய வேதாகமத்தின் நிலையான பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கிக் குறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִיהוּדָה
  choice: யூதாவிலிருந்து
  rationale: புறப்பட்டுவந்த நிலப்பகுதியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וַיִּקְרָא
  choice: அறிவித்த
  rationale: பலிபீடத்தைப் பற்றிய பொது தீர்க்கதரிசனப் பிரகடனத்தைச் சுட்டுகிறது; குரலின் ஒலியளவை தேவையின்றி முன்னிறுத்தாமல் அதன் அறிவிப்பு வலிமையைத் தருகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்தக் காரியங்கள்
  rationale: சொல்லப்பட்ட வார்த்தைகளையும் அவை முன்னறிவித்த நிகழ்வுகளையும் உள்ளடக்கக்கூடிய மூலமொழியின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: நீங்கள் செய்த
  rationale: யோசியாவை நோக்கிய ஒருமை வினையை, தமிழில் அரசனுக்குப் பொருத்தமான மரியாதைப் பன்மையுடன் தருகிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்திற்கு எதிராக
  rationale: சூழலில் பலிபீடத்தின் அழிவை நோக்கிய எதிர்மறை உறவைத் தெளிவாக்குகிறது; வெறும் ‘பற்றி’ என்பதைவிட உரையின் நோக்கைச் சரியாகத் தருகிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
