base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: ta
  text: பார்வோன் நேகோ, யோசியாவின் மகன் எலியாக்கீமை, அவனுடைய தந்தையான யோசியாவுக்குப் பதிலாக அரசனாக்கி, அவனுடைய பெயரை யோயாக்கீம் என்று மாற்றினான். ஆனால் அவன் யோவாகாஸை அழைத்துச் சென்றான்; யோவாகாஸ் எகிப்துக்கு வந்து[a], அங்கே இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எகிப்துக்குப் போய்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் ‘எகிப்துக்கு வந்து’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: அரசனாக்கி
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் இங்கு காரணவினைப் பொருளில் வருகிறது; நேகோ எலியாக்கீமை அரசனாக நிறுவியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் ஒருவர் இருந்த இடத்தில் மற்றொருவர் அமர்த்தப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָבִיו
  choice: அவனுடைய தந்தை
  rationale: பின்னொட்டு எலியாக்கீமைக் குறிக்கிறது; யோசியா அவனுடைய தந்தை என்பதை மூலத்தைப் போல வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: அவனுடைய பெயரை ... என்று மாற்றினான்
  rationale: பெயரை மாற்றுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பாகவும் நெருக்கமாகவும் தருகிறது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: நவீனத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: ஆனால் யோவாகாசை அவன் பிடித்துக்கொண்டான்
  rationale: לקח அடிப்படையில் ‘எடுத்துக்கொள்’ என்பதைக் குறித்தாலும், இச்சூழலில் அரச அதிகாரத்தால் ஒருவரைக் கைப்பற்றிய செயலை ‘பிடித்துக்கொண்டான்’ இயல்பாக வெளிப்படுத்துகிறது; அதன் பின்னுள்ள நகர்வின் இலக்கை இவ்வினைக்குள் சேர்க்கவில்லை.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: யோவாகாஸ் எகிப்துக்கு வந்து
  rationale: בוא என்பதன் நேரடிப் பொருளான ‘வந்தான்’ என்பதைக் காக்கிறது. தமிழில் சுட்டுப்பெயர் குழப்பம் வராமல் சூழலால் குறிக்கப்படும் யோவாகாசின் பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וַיָּמָת שָׁם
  choice: அங்கே இறந்தான்
  rationale: மூலத்தின் சுருக்கமான கதைநடை முடிவை நேரடியாகப் பாதுகாக்கிறது.
