source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: ta
  text: அவன் தன் தந்தையர்[a] செய்த எல்லாவற்றின்படியும், யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “அவனுடைய தந்தையர்”; அதாவது, அவனுடைய முன்னோர்கள் அல்லது அவனுக்கு முன்பு ஆட்சி செய்தவர்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் עשה கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் இயல்பான இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது; வசனத் தொடக்கத்தில் தனியாக ‘மேலும்’ சேர்ப்பது அவசியமில்லை.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה הרע என்பது ‘தீமையானதைச் செய்தல்’ என்ற நிலையான எபிரெய மொழிநடை; ‘அந்தத் தீமையை’ என்ற சொற்சொற் மொழிபெயர்ப்பைவிட இது இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளை, இயல்பான நவீன தமிழில் ‘பார்வையில்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: כֹּל என்பதன் முழுமையான பரப்பையும், முந்தையவர்களின் நடத்தைமுறைக்கு ஒத்த செயலையும் வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ
  choice: செய்த
  rationale: எபிரெய நிறைவுவினை, அரசனுடைய செயலுக்கு முன்பே நிகழ்ந்த தந்தையரின் செயல்களைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: אֲבֹתָיו
  choice: தன் தந்தையர்
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘அவனுடைய தந்தையர்’ என்ற வடிவைத் தக்கவைக்கிறது; இவ்வரச மரபுச் சூழலில் முன்னோர்கள் அல்லது முந்தைய அரசர்களையும் குறிக்கலாம் என்பதால் விளக்கக்குறிப்பு சேர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமமே இருப்பதால் அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது; ‘யாவே’ என்பது எபிரெய வடிவத்துக்கு நெருக்கமான தமிழாக்கம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய மதிப்பீட்டு மொழிநடை ‘யாவேயின் பார்வையில்’ என்றும், அבותיו என்பதன் நேரடி குடும்பச் சொல்லாக்கம் ‘தந்தையர்’ என்றும் பாதுகாக்கப்பட்டுள்ளன.
