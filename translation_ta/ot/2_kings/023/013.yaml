base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ta
  text: அரசன், எருசலேமுக்கு முன்பாக[a], அழிவு மலையின் வலப்புறத்தில்[d] இருந்த உயர் வழிபாட்டிடங்களைத் தீட்டுப்படுத்தினான். இஸ்ரயேலின் அரசன் சாலொமோன் அந்த இடங்களைச் சீதோனியரின் அருவருப்பாகிய அஸ்தரோத்துக்காகவும், மோவாபின் அருவருப்பாகிய கேமோசுக்காகவும், அம்மோனியரின் அருவருப்பாகிய மில்கோமுக்காகவும்[c] கட்டியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எருசலேமுக்கு முன்பாக’ என்பதை இந்த இடவியல் சூழலில் ‘எருசலேமுக்குக் கிழக்கே’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய உரையில் ‘மில்கோம்’ என்று உள்ளது; இந்தத் தெய்வத்தைச் சிலர் ‘மோலேக்’ என்பதுடன் தொடர்புபடுத்துகின்றனர்.
    reason: alternative_reading
  - marker: d
    text: ‘வலப்புறத்தில்’ என்பதற்கு, எபிரெய இடவியல் திசைநோக்கின் அடிப்படையில் ‘அழிவு மலைக்குத் தெற்கே’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: வழிபாட்டு மேடுகள்
  rationale: இச்சொல் பொதுவாக வழிபாட்டுக்காகப் பயன்படுத்தப்பட்ட உயரிடங்களைக் குறிக்கிறது. வெறும் புவியியல் உயரிடங்கள் என்று புரியாமல், அதன் சமயப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: எருசலேமுக்கு எதிரே
  rationale: இந்த இடவியல் சொற்றொடரின் ‘முன்பாக/எதிரே’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; பிரதான உரையில் ‘கிழக்கே’ என்று திசையைத் தீர்மானித்து விடவில்லை.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: அழிவு மலையின் வலப்புறத்தில்
  rationale: מִימִין என்பதன் நேரடியான ‘வலப்புறம்’ என்ற பொருளையும், הַר הַמַּשְׁחִית என்பதிலுள்ள இழிவுப்படுத்தும் ‘அழிவு மலை’ என்ற பெயரையும் பாதுகாக்கிறது.
- source_word: לְעַשְׁתֹּרֶת
  choice: அஸ்தரோத்துக்கும்
  rationale: எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; வேறொரு மரபுப் பெயரைப் பிரதான உரையில் மாற்றீடாக இடவில்லை.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: சீதோனியரின் அருவருப்பாகிய
  rationale: שִׁקּוּץ என்பதன் கடுமையான சமயக் கண்டனத்தை மென்மைப்படுத்தாமல், தமிழில் இயல்பாக அந்தத் தெய்வப் பெயரை விளக்கும் தொடராகத் தருகிறது.
- source_word: לִכְמוֹשׁ
  choice: கேமோசுக்கும்
  rationale: தெய்வப் பெயரை எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கிறது.
- source_word: שִׁקֻּץ מוֹאָב
  choice: மோவாபின் அருவருப்பாகிய
  rationale: முந்தைய שִׁקּוּץ என்பதுடன் ஒரே மாதிரியான கடுமையான மொழியைப் பேணுகிறது.
- source_word: לְמִלְכֹּם
  choice: மில்கோமுக்கும்
  rationale: மசோரெட்டிக் உரையில் உள்ள மில்கோம் என்ற பெயரை மோலேக்குடன் ஒன்றாக்காமல் பிரதான உரையில் பாதுகாக்கிறது.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அருவருப்பாகிய
  rationale: תּוֹעֵבָה என்பதன் சமயக் கண்டன வலிமையைப் பேணுகிறது; ‘அம்மோனின் மக்கள்’ என்பதை இயல்பான இனப்பெயராக வழங்குகிறது.
- source_word: טִמֵּא
  choice: தீட்டுப்படுத்தினான்
  rationale: தவறான வழிபாட்டிடங்களை வழிபாட்டுக்குப் பயன்படாதவாறு அசுத்தமாக்கிய செயலைக் குறிக்கும் காரணவினைப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் அவர் யோசியா எனத் தெரிந்தாலும், மூல வசனம் பயன்படுத்தும் பட்டத்தையே வைத்திருக்கிறது.
theological_decisions:
- issue: அந்நிய தெய்வங்களுக்கான கண்டனப் பெயர்கள்
  choice: שִׁקּוּץ மற்றும் תּוֹעֵבָה ஆகிய இரண்டையும் ‘அருவருப்பாகிய’ என்று வழங்குதல்
  alternative: ‘அருவருப்பான பொருள்’ அல்லது நடுநிலையாக ‘தெய்வம்’ என்று வழங்குதல்
  rationale: மூல உரையின் நோக்கமுள்ள கடுமையான சமயக் கண்டனத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் இல்லாத சிலை அல்லது உருவம் போன்ற விவரத்தைச் சேர்ப்பதில்லை.
- issue: הַר הַמַּשְׁחִית என்ற இடப்பெயரின் அடையாளம்
  choice: ‘அழிவு மலை’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒலிவ மலை’ அல்லது ‘சீர்கேட்டின் மலை’
  rationale: மூல உரையின் இழிவுப்படுத்தும் பெயரையும் அதன் இறையியல் தொனியையும் பாதுகாத்து, பிற்காலப் புவியியல் அடையாளத்தைப் பிரதான உரைக்குள் கொண்டு வராமல் தவிர்க்கிறது.
- issue: மில்கோம் மற்றும் மோலேக் பெயர்களின் தொடர்பு
  choice: மூல உரைப்படி ‘மில்கோம்’
  alternative: ‘மோலேக்’
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து உரை மில்கோம் என்று வாசிக்கிறது. வரலாற்று அல்லது மொழிபெயர்ப்பு மரபிலுள்ள தொடர்பை அடிக்குறிப்பில் மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், தொடர்புகளும் இறையியல் கண்டனத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
