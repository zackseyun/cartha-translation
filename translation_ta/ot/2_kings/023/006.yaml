  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: קבר என்ற ஒருமையின் பொருள்
  choice: பொதுமக்களின் கல்லறையின்மேல்
  alternative: பொதுமக்களின் கல்லறைகளின்மேல்
  rationale: எபிரெய உரையின் ஒருமையைப் பேணுகிறது; அது ஒரு கூட்டுக் கல்லறை அல்லது பொதுமக்களின் அடக்கத்தலத்தைக் குறிக்கக்கூடும். பன்மையாக்கி உரையைத் தேவையின்றி தெளிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய இணைப்பு வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், செயல்களின் வரிசை மாற்றப்படவில்லை. இடப்பெயர்கள் எருசலேம், கீதரோன் என்றும், தெய்வீகப் பெயர் யாவே என்றும் ஒலிபெயர்க்கப்பட்டன.
