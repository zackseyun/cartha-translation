base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: ta
  text: அவர் அசேராவை[a] யாவேயின் ஆலயத்திலிருந்து வெளியே கொண்டு வந்து, எருசலேமுக்கு வெளியே உள்ள கீதரோன் பள்ளத்தாக்குக்குக் கொண்டு சென்றார். கீதரோன் பள்ளத்தாக்கிலேயே அதை எரித்துத் தூளாக நொறுக்கி, அதன் தூளைப் பொதுமக்களின் கல்லறையின்மேல் எறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா கம்பம்” அல்லது “அசேரா சிலை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கானானியத் தெய்வமான அசேராவையோ, அவளுடைய வழிபாட்டுடன் தொடர்புடைய பொருளையோ குறிக்கலாம்; இங்கு ஆலயத்திலிருந்து அகற்றப்பட்டு அழிக்கப்பட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: எபிரெயச் சொல் அசேரா என்னும் கானானியத் தெய்வத்தையோ அவளுடைய வழிபாட்டுடன் தொடர்புடைய பொருளையோ குறிக்கலாம். இங்கு எடுத்துச் செல்லப்பட்டு அழிக்கப்படும் வழிபாட்டுப் பொருளைக் குறிக்கிறது; அதன் துல்லியமான வடிவத்தை உரை கூறாததால் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִבֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திலிருந்து
  rationale: இங்கு 'வீடு' என்பது எருசலேம் ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் இருக்க 'ஆலயம்' பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מִחוּץ לִירוּשָׁלַם
  choice: எருசலேமுக்கு வெளியே இருந்த
  rationale: நகர எல்லைக்கு அப்பாலுள்ள இடத்தை நோக்கிய நகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கு
  rationale: נחל என்பது பருவகால நீரோடையுள்ள பள்ளத்தாக்கையோ ஓடையையோ குறிக்கலாம். இப்புவியியல் சூழலில் 'பள்ளத்தாக்கு' தெளிவான, இயல்பான தேர்வு.
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: அதை எரித்து
  rationale: பெண்பால் பின்னொட்டு அசேரா என்ற சொல்லின் இலக்கணப் பாலுடன் பொருந்துகிறது; அழிக்கப்படும் வழிபாட்டுப் பொருளைத் தமிழில் மனிதராக்காமல் 'அதை' எனக் குறிக்கிறது.
- source_word: וַיָּדֶק לְעָפָר
  choice: தூளாக நொறுக்கி
  rationale: வினைச்சொல் பொருளை மிக நுண்ணிய துகள்களாகச் சிதைப்பதைக் குறிக்கிறது. 'தூளாக நொறுக்கி' செயல் வரிசையையும் விளைவையும் இயல்பாகத் தருகிறது.
- source_word: עֲפָרָהּ
  choice: அந்தத் தூளை
  rationale: עפר என்பதன் அடிப்படைப் பொருள் 'தூள்'; எரித்த சாம்பல் என்று மட்டும் பொருளைச் சுருக்காமல் எபிரெயச் சொல்லைப் பிரதிபலிக்கிறது.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: பொதுமக்களின் கல்லறையின்மேல்
  rationale: בני העם இங்கு உயர்குடியினருக்கு மாறாகச் சாதாரண மக்களைக் குறிக்கும் வாய்ப்புள்ளது. ஒருமை קבר-ஐப் பேணி, கூட்டாகப் பயன்படுத்தப்பட்ட கல்லறை அல்லது அடக்கத்தலத்தைத் தமிழில் 'கல்லறை' என வழங்குகிறது.
