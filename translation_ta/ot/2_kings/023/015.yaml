base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: ta
  text: மேலும், பெத்தேலில் இருந்த பலிபீடத்தையும், இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாம் அமைத்த மேட்டுத் தொழுகையிடத்தையும்—அந்தப் பலிபீடத்தையும் அந்த மேட்டுத் தொழுகையிடத்தையும்—அவர் இடித்துப்போட்டார். அவர் அந்த மேட்டுத் தொழுகையிடத்தை எரித்து, அதைப் பொடியாக நொறுக்கினார்; அசேராவையும்[a] எரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா வழிபாட்டுச் சின்னம்.” எபிரெயச் சொல் அசேரா தெய்வத்தையோ, அவளுடைய வழிபாட்டுடன் தொடர்புடைய பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதற்குரிய பீடத்தைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான தமிழ்ச் சொல்.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டையும் ஊர்ப் பெயரையும் இயல்பான தமிழ் வேற்றுமை வடிவில் தருகிறது.
- source_word: הַבָּמָה
  choice: மேட்டுத் தொழுகையிடம்
  rationale: உயர்ந்த இடத்தில் அமைந்த வழிபாட்டுத் தலத்தைக் குறிக்கும் தொழில்நுட்ப மதப் பொருளைத் தெளிவாகத் தருகிறது; வெறும் 'மேடு' என மொழிபெயர்ப்பதால் வழிபாட்டுச் சூழல் மறைந்துவிடும்.
- source_word: עָשָׂה
  choice: அமைத்த
  rationale: மூலத்தின் பொதுவான 'செய்தான்' என்ற பொருளை வழிபாட்டுத் தலம் நிறுவப்பட்ட சூழலில் இயல்பாக வெளிப்படுத்துகிறது; 'கட்டினான்' என்று கட்டுமானத்தை மட்டும் வலியுறுத்தவில்லை.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: வினையின் காரணவினைப் பொருளைத் தணிக்காமல் நேரடியாகக் காக்கிறது.
- source_word: נָתָץ
  choice: இடித்துப்போட்டார்
  rationale: ஒரு கட்டமைப்பைத் தகர்த்து அழிப்பதைக் குறிக்கும் வலிமையான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הֵדַק לְעָפָר
  choice: அதைப் பொடியாக நொறுக்கினார்
  rationale: முழுவதுமாக நுண்துகளாக்கிய விளைவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֵׁרָה
  choice: அசேரா
  rationale: இச்சொல் தெய்வத்தையோ அதனுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடியதால், பொருளை ஒரே விதமாக முடிவுசெய்யாமல் எபிரெயப் பெயரை ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் சுட்டுப்பொருள்
  choice: அசேரா
  alternative: அசேரா வழிபாட்டுச் சின்னம் / புனிதக் கம்பம்
  rationale: எரிக்கப்படும் சூழலில் மரத்தாலான வழிபாட்டுப் பொருள் குறிக்கப்படுவது சாத்தியம். ஆயினும் எபிரெயச் சொல் தெய்வத்தையும் அவளோடு தொடர்புடைய வழிபாட்டுப் பொருளையும் குறிக்கக்கூடும்; ஆகவே முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது, அடிக்குறிப்பு மாற்றுப் பொருளைத் தெரிவிக்கிறது.
- issue: הַבָּמָה என்பதன் மதச் சிறப்புப்பொருள்
  choice: மேட்டுத் தொழுகையிடம்
  alternative: உயர்ந்த இடம் / வழிபாட்டுத் தலம்
  rationale: இங்கு புவியியல் உயரத்தை மட்டும் அல்லாமல் அங்கிருந்த வழிபாட்டு அமைப்பையும் குறிக்கிறது. 'மேட்டுத் தொழுகையிடம்' இரு அம்சங்களையும் பொதுவாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. யெரொபெயாமை விளக்கும் தொடர்புத் தொடர் அவனே இஸ்ரவேலைப் பாவம் செய்ய வைத்தவன் என்பதைத் தெளிவாக்குகிறது. நீண்ட எபிரெய வாக்கியத்தின் வலியுறுத்தலைக் காக்க இணைப்புக்கோடுகளும் மீளுரையும் பயன்படுத்தப்பட்டுள்ளன.
