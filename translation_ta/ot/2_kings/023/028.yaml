translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை. சொல்லாட்சிக் கேள்வியின் வடிவம் ‘அல்லவா?’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
