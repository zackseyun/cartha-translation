source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோசியாவின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன[a] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுதப்பட்டிருக்கின்றன” என்பதற்குப் பதிலாக “பதிவு செய்யப்பட்டிருக்கின்றன” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியாக “எழுதப்பட்ட” என்று பொருள்பட்டாலும், ஆவணப் பதிவுச் சூழலில் “பதிவு செய்யப்பட்ட” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நாளாகமப் புத்தகம்” என்பது அரசர்கள் நூலில் மேற்கோள் காட்டப்படும் ஓர் அரச ஆவணத்தைக் குறிக்கிறது; அது இன்றைய வேதாகமத்திலுள்ள 1–2 நாளாகமப் புத்தகங்களையே அவற்றின் இறுதி வடிவில் குறிக்க வேண்டும் என்பதில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: யோசியாவின் மற்ற செயல்கள்
  rationale: יֶתֶר என்பது எஞ்சியவற்றைக் குறிக்கிறது; அரச வரலாற்றுச் சுருக்கத்தில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ என்பதற்குப் பதிலாக அரசனின் செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: עשה என்பதன் விரிவான, நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: எதிர்மறை வினாத்துகள் கொண்ட எபிரெயச் சொல்லமைப்பு உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி; ‘அல்லவா?’ அந்த வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், எழுத்துப் பதிவைக் குறிக்கும் இச்சூழலில் தமிழில் ‘புத்தகத்தில்’ என்பதே இயல்பானது.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகம்
  rationale: அரசர்களைப் பற்றிய காலவரிசைப் பதிவைக் குறிக்கும் மூலநூல் தலைப்பைத் தெளிவாகவும் வழக்கமான வரலாற்று மொழிநடையிலும் தருகிறது.
