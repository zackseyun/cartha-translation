  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: ta
  text: யெகோயாக்கீம் அரசனானபோது இருபத்தைந்து வயதுடையவனாக இருந்தான்[a]. அவன் எருசலேமில் பதினொரு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் ரூமாவைச் சேர்ந்த பெதாயாவின் மகள் செபீதா[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “யெகோயாக்கீம் அரசனானபோது இருபத்தைந்து வயதுடைய மகனாக இருந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: இந்தப் பெயரை “செபுதா” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: இருபத்தைந்து வயதுடையவனாக இருந்தான்
  rationale: இது வயதைக் குறிக்கும் வழக்கமான எபிரெய மொழிப்பாங்கு. அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: בְּ முன்னொட்டுடன் வரும் இவ்வடிவம் அவன் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கிறது. “அரசனானபோது” என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: வினைச்சொல் அரச பதவியை வெறுமனே வகித்ததை அல்ல, அரசனாக ஆட்சி செய்ததைச் சுட்டுகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: அவனுடைய ஆட்சியின் இடத்தைக் குறிக்கும் இடவேற்றுமைத் தொடர்.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாய்
  rationale: தமிழில் இயல்பான வம்சவழித் தகவல் அமைப்புக்காக, தாயின் பெயரைத் தொடர்ந்து நேரடியாக அடையாளப்படுத்தும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: זבידה
  choice: செபிதா
  rationale: கொடுக்கப்பட்ட மெய்யெழுத்து வடிவத்தையும் பொதுவான பெயர் மரபையும் பின்பற்றிய தமிழ் ஒலிபெயர்ப்பு; “செபுதா” என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַת פְּדָיָה
  choice: பெதாயாவின் மகள்
  rationale: தந்தை–மகள் உறவைக் குறிக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: מִן רוּמָה
  choice: ரூமாவைச் சேர்ந்த
  rationale: מִן இங்கு பிறப்பிடம் அல்லது சொந்த ஊரைக் குறிக்கிறது; “சேர்ந்த” என்பது தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
