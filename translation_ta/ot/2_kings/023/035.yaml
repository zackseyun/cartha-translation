translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரச வரி வசூலின் கட்டாயத் தன்மை தெளிவாகக் காட்டப்பட்டாலும், தனிநபர் மதிப்பீடு அவருடைய சொத்து மதிப்பா அல்லது செலுத்தும் திறனா என்ற மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
