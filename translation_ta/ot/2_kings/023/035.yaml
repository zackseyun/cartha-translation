base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: ta
  text: யோயாக்கீம் வெள்ளியையும் தங்கத்தையும் பார்வோனுக்குக் கொடுத்தான். ஆனால், பார்வோனின் கட்டளைப்படி[b] வெள்ளியைக் கொடுப்பதற்காக நாட்டின்மீது வரி விதித்தான்[a]. பார்வோன் நேகோவுக்குக் கொடுப்பதற்காக, நாட்டு மக்களில் ஒவ்வொருவரிடமிருந்தும் அவரவருக்கான மதிப்பீட்டின்படி[c] வெள்ளியையும் தங்கத்தையும் கட்டாயமாக வசூலித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாட்டை மதிப்பிட்டான்’ அல்லது ‘நாட்டின்மீது தீர்வை விதித்தான்.’ பணம் செலுத்துவதற்கான மதிப்பீட்டை விதிப்பதையும் எபிரெய வினை குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘பார்வோனின் வாயின்படி’; அதாவது, பார்வோனின் கட்டளைப்படி.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஒவ்வொருவருக்கும் செய்யப்பட்ட மதிப்பீட்டின்படி’; பொருள் விளக்கமாக, ‘அவரவர் வசதிக்கேற்ப.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: நாட்டின்மீது வரி விதித்தான்
  rationale: இந்த ஹிஃபில் வடிவம், பணம் செலுத்த வேண்டிய சூழலில் நாட்டின்மீது நிதிசார் மதிப்பீடு அல்லது வரி விதிப்பதைக் குறிக்கிறது. நவீனத் தமிழில் ‘வரி விதித்தான்’ அதன் செயல்பாட்டு பொருளைத் தெளிவாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל־פִּי פַרְעֹה
  choice: பார்வோனின் கட்டளைப்படி
  rationale: ‘பார்வோனின் வாயின்படி’ என்ற எபிரெய மரபுத்தொடர், இங்கு அவரது கட்டளை அல்லது ஆணைப்படி என்பதைக் குறிக்கிறது.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: ஒவ்வொருவரிடமிருந்தும் அவரவருக்கான மதிப்பீட்டின்படி
  rationale: தொகை ஒவ்வொருவருக்கும் தனித்தனியாக மதிப்பிடப்பட்டதை வெளிப்படுத்துகிறது; ‘அவரவர் வசதிக்கேற்ப’ என்று பொருளைத் தீர்மானித்து விடாமல் மூலத்தின் மதிப்பீட்டு மொழியைப் பாதுகாக்கிறது.
- source_word: נָגַשׂ
  choice: கட்டாயமாக வசூலித்தான்
  rationale: வெறும் வசூலைவிட அழுத்திக் கோரிப் பெறும் வலியுறுத்தலை இந்த வினை கொண்டுள்ளது; தமிழில் ‘கட்டாயமாக வசூலித்தான்’ அந்த நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டு மக்கள்
  rationale: சமூக வர்க்கத்தைத் தேவையின்றி நிர்ணயிக்காமல், அரசியல்-பிரதேசச் சொல்லாக்கத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: פַרְעֹה נְכֹה
  choice: பார்வோன் நேகோ
  rationale: பெயர் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: வெள்ளி பணமாகப் பயன்படுத்தப்பட்டிருக்கலாம் என்றாலும், மூலத்தில் குறிப்பிடப்படும் இரண்டு உலோகங்களையும் நேரடியாகவும் இணை அமைப்புடனும் தருகிறது.
- source_word: נָתַן
  choice: கொடுத்தான்
  rationale: திரை செலுத்திய சூழல் இருந்தாலும், மூல வினையின் அடிப்படைப் பொருளான ‘கொடுத்தான்’ என்பதே பாதுகாக்கப்படுகிறது.
