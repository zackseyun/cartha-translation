base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: ta
  text: அங்கே இருந்த மேட்டிடங்களின் ஆசாரியர்கள் அனைவரையும் பலிபீடங்களின்மேல் வெட்டிக் கொன்றான்[a]. அவற்றின்மேல் மனித எலும்புகளை எரித்தான். பின்பு அவன் எருசலேமுக்குத் திரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலியிட்டான்.” எபிரெய வினைச்சொல் பலியிடுதல் என்ற நிழற்பொருளையும் கொண்டிருக்கலாம்; இச்சூழலில் அது வன்முறையாக வெட்டிக் கொல்வதையே முதன்மையாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: வெட்டிக் கொன்றான்
  rationale: זבח என்பது பலியிடுவதற்காக அறுத்தல் அல்லது வெட்டிக் கொல்லுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம். இங்கு முறைகேடான வழிபாட்டுத் தலங்களை யோசியா அழிக்கும் சூழலில் நிகழும் வன்முறையைத் தெளிவாகக் காட்டவும், இது ஆண்டவருக்குச் செலுத்தப்பட்ட அங்கீகரிக்கப்பட்ட பலி என்று தேவையின்றி உணர்த்தாமல் இருக்கவும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; பலிசார் நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: மேட்டிடங்களின் ஆசாரியர்கள்
  rationale: מלכים நூலில் בָּמוֹת என்பது உள்ளூர் வழிபாட்டு மேட்டிடங்களைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘மேட்டிடங்கள்’ அதன் இடவியல் மற்றும் சமயப் பொருளைத் தக்கவைக்கிறது; כֹּהֲנִים என்பதற்கு ‘ஆசாரியர்கள்’ இயல்பான இணைச்சொல்.
- source_word: אֲשֶׁר שָׁם
  choice: அங்கே இருந்த
  rationale: அந்த இடங்களில் இருந்த ஆசாரியர்களை அடையாளப்படுத்தும் இடவியல் சார்புத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: பலிபீடங்களின்மேல்
  rationale: עַל என்பதன் நேரடியான ‘மேல்’ என்ற பொருளையும், அடுத்த வாக்கியத்தில் எலும்புகள் அவற்றின்மேல் எரிக்கப்படுவதுடன் உள்ள தொடர்பையும் காக்கிறது.
- source_word: עַצְמוֹת אָדָם
  choice: மனித எலும்புகள்
  rationale: אָדָם இங்கு ஆணை மட்டும் அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்கிறது. ‘மனித எலும்புகள்’ என்பது துல்லியமும் இயல்பும் உடைய நவீனத் தமிழ்.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: பின்பு அவன் எருசலேமுக்குத் திரும்பினான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் ‘பின்பு’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיִּזְבַּח என்ற வினைச்சொல்லில் இருக்கக்கூடிய பலிசார் நிழற்பொருள்
  choice: முதன்மை உரையில் ‘வெட்டிக் கொன்றான்’ என்று மொழிபெயர்த்து, பலியிடுதல் என்ற மாற்றுப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘பலியிட்டான்’
  rationale: ‘பலியிட்டான்’ என்று மட்டும் மொழிபெயர்ப்பது இந்தச் செயல் ஆண்டவருக்கு ஏற்ற முறையான பலி என உரை கூறுவதாகத் தவறாக உணர்த்தக்கூடும். ‘வெட்டிக் கொன்றான்’ வன்முறையின் தீவிரத்தைத் தெளிவாக்குகிறது; அதேவேளை எபிரெயச் சொல்லின் வழிபாட்டுச் சார்ந்த சாத்தியத்தை அடிக்குறிப்பு மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேட்டிடங்கள்,’ ‘ஆசாரியர்கள்,’ ‘பலிபீடங்கள்’ ஆகியவை அரசர்கள் நூலின் சமயச் சூழலைத் தக்கவைக்கும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
