  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: ta
  text: அப்போது அரசன் தலைமைக் குருவாகிய இல்க்கியாவுக்கும், இரண்டாம் நிலைக் குருக்களுக்கும், வாசற்படி காவலர்களுக்கும், பாகாலுக்காகவும் அசேராவுக்காகவும்,[a] வானத்தின் அனைத்துச் சேனைகளுக்காகவும் செய்யப்பட்ட எல்லாப் பொருட்களையும் யாவேயின் ஆலயத்திலிருந்து வெளியே கொண்டுவரும்படி கட்டளையிட்டான். அவற்றை எருசலேமுக்கு வெளியே, கிதரோன் வயல்வெளிகளில் எரித்து, அவற்றின் தூசியை பெத்தேலுக்குக் கொண்டுபோனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா தூணுக்காகவும்.” எபிரெயச் சொல் அசேரா தேவதையையோ, அவளுடன் தொடர்புடைய ஒரு வழிபாட்டுப் பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: அப்போது அரசன் ... கட்டளையிட்டான்
  rationale: வாவ் தொடர்கதை வடிவத்தின் முன்னேற்றத்தையும் צוה என்பதன் அதிகாரபூர்வமான கட்டளைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குருவாகிய இல்க்கியா
  rationale: הַכֹּהֵן הַגָּדוֹל என்பது பிரதான குருத்துவப் பதவியைக் குறிக்கிறது; ‘தலைமைக் குரு’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: இரண்டாம் நிலைக் குருக்கள்
  rationale: முதன்மைக்குக் கீழான நிலை அல்லது தரத்தை מִשְׁנֶה குறிக்கிறது; துல்லியமான நிறுவன அமைப்பு தெளிவில்லாததால் அதை மேலும் விளக்காமல் பாதுகாக்கிறது.
- source_word: שֹׁמְרֵי הַסַּף
  choice: வாயில்நிலைக் காவலர்கள்
  rationale: סַף என்பதன் ‘வாயில்நிலை/வாசற்படி’ உருவகத்தையும் அதிகாரப்பூர்வ காவல் பணியையும் காக்கிறது.
- source_word: מֵהֵיכַל יְהוָה
  choice: யாவேயின் ஆலயத்திலிருந்து
  rationale: சூழலில் הֵיכָל ஆலயத்தைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: כָּל הַכֵּלִים
  choice: எல்லாப் பொருட்களையும்
  rationale: כְּלִי இங்கு பலவகை வழிபாட்டுப் பாத்திரங்கள், கருவிகள் அல்லது பொருட்களை உள்ளடக்கலாம்; ‘பொருட்கள்’ அந்த அகலத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: பாகாலுக்காகவும், அசேராவுக்காகவும், வானத்தின் படைகள் அனைத்திற்காகவும்
  rationale: לְ என்பதன் அர்ப்பணிப்பு/பயன்பாட்டு உறவைப் பாதுகாக்கிறது; צְבָא הַשָּׁמָיִם என்பதற்கு மரபான உருவகத்தை அப்படியே வைத்துள்ளது.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: கிதரோன் வயல்வெளிகளில்
  rationale: שַׁדְמוֹת பயிரிடப்பட்ட வயல்கள் அல்லது வெளிகளைக் குறிக்கிறது; ‘வயல்வெளிகள்’ இரு நுணுக்கங்களையும் இணைக்கிறது.
- source_word: עֲפָרָם
  choice: அவற்றின் சாம்பல் மண்ணை
  rationale: עָפָר அடிப்படையில் தூசி அல்லது மண்; எரித்த பிந்தைய சூழலில் எஞ்சிய சாம்பல் கலந்த தூள்/மண்ணைக் குறிக்கிறது. வெறும் ‘சாம்பல்’ எனச் சுருக்காமல் மூலச் சொல்லின் மண்-தூசி நுணுக்கத்தைக் காக்கிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றபடி ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: அசேரா
  alternative: அசேரா தூண் / அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருள்
  rationale: இச்சொல் தேவதையையோ அவளுடன் தொடர்புடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கக்கூடும். பாகாலும் வானத்தின் படைகளும் சேர்ந்த பெறுநர் பட்டியலில் வருவதால் பிரதான உரை பெயரை வைத்துக்கொண்டு உண்மையான தெளிவின்மையை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. குருத்துவ நிலைகள் மற்றும் ஆலயப் பணிகளை அளவுக்கு மீறி விளக்காமல் மூலத்தின் அமைப்பும் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
