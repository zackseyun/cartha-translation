  edition: WLC
  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: ta
  text: எனினும், உயர்ந்த வழிபாட்டு இடங்களின் ஆசாரியர்கள்[a] எருசலேமிலுள்ள யாவேயின்[c] பலிபீடத்திற்குச் செல்லவில்லை; ஆனால் அவர்கள் தங்கள் சகோதரர்களின் நடுவில்[b] புளிப்பில்லாத அப்பங்களை உண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “உயர்ந்த இடங்களின் ஆசாரியர்கள்”; இவை உள்ளூர் வழிபாட்டு இடங்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தங்கள் சகோதரர்களின் நடுவில்”; இவர்கள் அவர்களுடைய சக ஆசாரியர்களையோ ஆசாரியக் குலத்தாரையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் இறைப்பெயர் YHWH; பாரம்பரியமாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: எனினும்
  rationale: முந்தைய சீர்திருத்த நடவடிக்கைகளுக்கு ஒரு வரம்பையோ விதிவிலக்கையோ அறிமுகப்படுத்தும் எதிர்மறை இணைப்பாக இயல்பாக அமைகிறது.
- source_word: יַעֲלוּ
  choice: செல்லவில்லை
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்.’ எருசலேமுக்குச் செல்வது இயல்பாகவே ‘மேலே செல்வது’ எனக் கருதப்பட்டாலும், நவீன தமிழில் இலக்கை நோக்கிச் ‘செல்லவில்லை’ என்பது பொருளைத் தெளிவாகத் தருகிறது; பணியாற்றினர் என்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: மேட்டுத் தொழுகையிடங்களின் ஆசாரியர்கள்
  rationale: במות என்பது உள்ளூர் வழிபாட்டுக்காக அமைந்த உயரமான அல்லது மேட்டு வழிபாட்டிடங்களைக் குறிக்கிறது. ‘மேட்டுத் தொழுகையிடங்கள்’ என்பது அதன் வழிபாட்டுச் சூழலை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடம்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமை உறவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக, மூலத்தில் நேரடியாக வரும் YHWH என்ற தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: כִּי אִם
  choice: ஆனால்
  rationale: அவர்கள் எருசலேம் பலிபீடத்திற்குச் செல்லாததையும், சகோதரர்களோடு உணவு உண்டதையும் மாறுபடுத்திக் காட்டுகிறது.
- source_word: אָכְלוּ מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்களை உண்டார்கள்
  rationale: מַצּוֹת என்ற பன்மையைத் தக்கவைத்து, தமிழில் புரியக்கூடிய வழிபாட்டு உணவுச் சொல்லாக்கத்தை வழங்குகிறது.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களோடு
  rationale: சொல்லுக்கு நெருக்கமாக ‘தங்கள் சகோதரர்களின் நடுவில்’ எனலாம்; சூழலில் ஒன்றாக உண்பதைக் குறிக்கும் இயல்பான தமிழாக ‘சகோதரர்களோடு’ தேர்ந்தெடுக்கப்பட்டது. அவர்கள் சக ஆசாரியர்கள் எனப் பொருள் இருக்கலாம், ஆனால் மூலத்தில் அது வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெயத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. தனிப்பெயரைத் தக்கவைத்து, பாரம்பரிய மாற்றீட்டைப் பற்றிய தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אֲחֵיהֶם என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: தங்கள் சகோதரர்களோடு
  alternative: தங்கள் உறவினர்களோடு / தங்கள் சக ஆசாரியர்களோடு
  rationale: சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை; சூழலும் ஆண் ஆசாரியர் குழுவைக் குறிக்கிறது. ‘சக ஆசாரியர்கள்’ என்பது சாத்தியமான சூழற்பொருள் என்றாலும், மூலத்தில் ‘ஆசாரியர்கள்’ மீண்டும் சொல்லப்படாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்கள்,’ ‘பலிபீடம்,’ ‘புளிப்பில்லாத அப்பம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரெயத்தில் உள்ள ‘சகோதரர்கள்’ என்ற தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
