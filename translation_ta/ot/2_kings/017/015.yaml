  revised_text: அவர்கள் அவருடைய சட்டங்களையும், அவர் அவர்களுடைய தந்தையரோடு செய்திருந்த உடன்படிக்கையையும், அவர்களை எச்சரித்த அவருடைய சாட்சியுரைகளையும்[a] நிராகரித்தார்கள். அவர்கள் வெறுமையைப் பின்பற்றி, தாங்களும் வெறுமையானார்கள்[b][c]. மேலும், தங்களைச் சுற்றியிருந்த தேசங்களைப் பின்பற்றினார்கள்; அவற்றைப் போலச் செய்யக் கூடாது என்று யெகோவா அவர்களுக்குக் கட்டளையிட்டிருந்தார்.
