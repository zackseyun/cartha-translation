  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: ta
  text: அவர்கள் அவருடைய சட்டங்களையும், அவர் அவர்களுடைய தந்தையரோடு செய்திருந்த உடன்படிக்கையையும், அவர்களை எச்சரித்த அவருடைய சாட்சியுரைகளையும்[a] நிராகரித்தார்கள். அவர்கள் வெறுமையைப் பின்பற்றி, தாங்களும் வெறுமையானார்கள்[b][c]. மேலும், தங்களைச் சுற்றியிருந்த தேசங்களைப் பின்பற்றினார்கள்; அவற்றைப் போலச் செய்யக் கூடாது என்று யெகோவா அவர்களுக்குக் கட்டளையிட்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிராகச் சாட்சி கூறிய அவருடைய சாட்சியுரைகளையும்”; எபிரெயச் சொற்றொடர் சாட்சி கூறுதல், கண்டிப்புடன் எச்சரித்தல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “வெறுமை” என்பது பயனின்மை, மதிப்பின்மை ஆகியவற்றையும் குறிக்கலாம்; இச்சூழலில் அது சிலைகளைக் குறிப்பதாகவும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழியில் தொடர்புடைய சொற்களைக் கொண்டு, “வெறுமையைப் பின்பற்றி வெறுமையானார்கள்” என்ற சொல்விளையாட்டு அமைந்துள்ளது.
    reason: wordplay
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: நிராகரித்தார்கள்
  rationale: מָאַס என்பதன் மறுத்துத் தள்ளுதல் என்ற உடன்படிக்கைச் சூழலிலான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: חֻקָּיו
  choice: அவருடைய சட்டங்கள்
  rationale: கடவுள் விதித்த கட்டளைகள் அல்லது நியமங்கள் என்ற சட்ட-உடன்படிக்கைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: அவர் ... செய்திருந்த உடன்படிக்கை
  rationale: எபிரெய மொழியின் சொற்படியான ‘உடன்படிக்கையை வெட்டுதல்’ என்ற மரபுத்தொடரை இயல்பான தமிழில் ‘உடன்படிக்கை செய்தல்’ என்று தருகிறது.
- source_word: אֲבוֹתָם
  choice: தங்கள் தந்தையர்
  rationale: ஆண்பால் பன்மையான மூலச்சொல்லையும் வழக்கமான உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: அவர் தங்களை எச்சரிக்கப் பயன்படுத்திய சாட்சியுரைகள்
  rationale: עֵדוֹת என்பதன் ‘சாட்சியுரைகள்’ என்ற அடிப்படைப் பொருளையும், הֵעִיד בָּם என்பதன் எச்சரிக்கும் செயல்பாட்டையும் இணைத்துக் காட்டுகிறது.
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: வெறுமையைப் பின்பற்றி, தாங்களும் வெறுமையானார்கள்
  rationale: பெயர்ச்சொல்-வினைச்சொல் சார்ந்த எபிரெயச் சொல்விளையாட்டைத் தமிழில் இயன்றவரை காக்கிறது; பயனற்றதைப் பின்பற்றியவர்கள் அதைப் போலவே பயனற்றவர்களானார்கள் என்ற கருத்தையும் சுமக்கிறது.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: தங்களைச் சுற்றியிருந்த தேசங்கள்
  rationale: வரலாற்றுச் சூழலில் இஸ்ரவேலைச் சுற்றியிருந்த பிற தேசங்களைக் குறிக்கும் இயல்பான மொழிபெயர்ப்பு.
- source_word: כָהֶם
  choice: அவற்றைப் போல
  rationale: ‘அவை செய்ததுபோல்’ என்று மூலத்தில் இல்லாத வினையைச் சேர்க்காமல், எபிரெயச் சொல்லாட்சியின் சுருக்கத்தைக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் கடவுளுடைய தனிப்பெயரைப் பெயராகவே தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: இங்கு பொதுப்பட்டத்துக்குப் பதிலாக நான்கு எழுத்து இறைப் பெயர் நேரடியாக வருகிறது; ஆகவே அதைத் தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவில் வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: הֶבֶל என்பதன் சிலைச் சூழலிலான பொருள்
  choice: வெறுமை
  alternative: சிலைகள் / பயனற்றவை
  rationale: மூலத்தின் உருவகப் பொருளையும் அடுத்த வினையுடனான சொல்விளையாட்டையும் காக்க ‘வெறுமை’ பயன்படுத்தப்பட்டது; இச்சூழலில் சிலைகள் குறிக்கப்படலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: הֵעִיד בָּם என்பதிலுள்ள சாட்சி–எச்சரிக்கை நுணுக்கம்
  choice: தங்களை எச்சரிக்கப் பயன்படுத்திய
  alternative: தங்களுக்கு எதிராகச் சாட்சி கூறிய
  rationale: சூழலில் கடவுளின் சாட்சியுரைகள் எச்சரிப்புகளாகச் செயல்படுவதை முதன்மைப்படுத்துகிறது; எதிராகச் சாட்சி கூறுதல் என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சட்டங்கள்’, ‘உடன்படிக்கை’, ‘சாட்சியுரைகள்’ ஆகியவை சட்ட-உடன்படிக்கைச் சொற்தொகுப்பைத் தக்கவைக்கின்றன. ஒரே வாக்கியத்தின் நீளத்தைத் தவிர்க்க மூலத்தின் கருத்தோட்டம் மூன்று தமிழ்வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடர்புகள் மாற்றப்படவில்லை.
