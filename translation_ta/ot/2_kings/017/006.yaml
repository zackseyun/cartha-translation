  register: நவீனத் தரத் தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழக்கமான வேதாகம இடப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டன; கட்டாய நாடுகடத்தலின் பொருள் மறையாமல் வைக்கப்பட்டது.
