  source_fidelity: மூல எபிரெயத்திலுள்ள வலுக்கட்டாய நாடுகடத்தல் (וַיֶּגֶל), பின்னர் குறிப்பிட்ட இடங்களில் குடியேற்றல் (וַיֹּשֶׁב), மற்றும் இடப்பெயர் வரிசை ஆகியவை பாதுகாக்கப்பட வேண்டும். வரைவில் ‘கோசான் பிரதேசத்திலுள்ள’ என்பது נְהַר גּוֹזָן என்பதிலுள்ள ‘கோசானின் ஆறு’ என்ற உறவைப் பிரதேசக் குறிப்பாக மாற்றுகிறது; மேலும் ‘மேதியரின் நகரங்கள்’ என்பதற்குப் பதில் நிலப்பகுதியைக் குறிக்கும் ‘மேதியாவின் நகரங்கள்’ மூலத்திற்கு நெருக்கமானது.
  naturalness: திருத்திய உரை நவீனத் தரத் தமிழில் இயல்பாகவும் வரலாற்று நடைக்கு ஏற்றவாறும் உள்ளது. ‘நாடுகடத்தி’ என்பது இங்கு ‘சிறைப்பிடித்துக் கொண்டுபோய்’ என்பதைக் காட்டிலும் துல்லியமான, சுருக்கமான சொல்.
  terminology: ஓசேயா, அசீரியா, சமாரியா, இஸ்ரவேல், ஆலாக், ஆபோர், கோசான், மேதியா என்ற பெயர்கள் ஒலிபெயர்ப்பு முறையில் ஒருமைப்படுத்தப்பட்டுள்ளன. ‘நாடுகடத்தி’ எபிரெய வினைச்சொல்லின் கட்டாய அகற்றல்/சிறையிருப்பு பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
