base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: ta
  text: ஓசேயாவின் ஆட்சியின் ஒன்பதாம் ஆண்டில், அசீரிய அரசன் சமாரியாவைக் கைப்பற்றி, இஸ்ரவேலரை அசீரியாவுக்கு நாடுகடத்தி[a], அவர்களை ஆலாகிலும், கோசானின் ஆறான ஆபோர் கரையிலும்[b], மேதியாவின் நகரங்களிலும் குடியேற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலரை அசீரியாவுக்குச் சிறைப்பிடித்துக் கொண்டுபோய்.” எபிரெய வினைச்சொல் வலுக்கட்டாயமாக அகற்றி நாடுகடத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கோசான் பிரதேசத்திலுள்ள ஆபோர் ஆற்றங்கரையிலும்.” எபிரெயத் தொடர் ஆபோரை கோசானுடன் தொடர்புடைய ஆறாகக் குறிக்கிறது; அதன் துல்லியமான தொடரியல் தொடர்பு விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: ஓசேயாவின் ஆட்சியின் ஒன்பதாம் ஆண்டில்
  rationale: לְהוֹשֵׁעַ என்பது அரசாட்சிக் காலக் குறிப்பை உணர்த்துகிறது; தமிழில் தெளிவுக்காக ‘ஆட்சியின்’ சேர்க்கப்பட்டது.
- source_word: לָכַד
  choice: கைப்பற்றி
  rationale: ஒரு நகரத்தைப் போரில் பிடித்தல் என்ற பொருளை இயல்பான வரலாற்றுத் தமிழில் தருகிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: நகரத்தின் தமிழில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה
  choice: இஸ்ரவேலரை அசீரியாவுக்குச் சிறைப்பிடித்துக் கொண்டுபோய்
  rationale: גלה என்பதன் causative பொருள் வலுக்கட்டாயமாக நாடுகடத்தப்படுதலைக் குறிக்கிறது; தமிழில் நிகழ்வின் கட்டாயத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: அவர்களைக் குடியேற்றினான்
  rationale: ישׁב என்பதன் Hiphil வடிவமான ‘வசிக்கச் செய்தான்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּחְלַח
  choice: ஆலாகில்
  rationale: இடப்பெயரான Halah-ஐ தமிழ் ஒலிப்பெயர்ப்பில் தருகிறது.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: கோசான் பிரதேசத்திலுள்ள ஆபோர் ஆற்றங்கரையிலும்
  rationale: ஆபோர் ஓர் ஆறு என்பதைத் தெளிவாக்கி, கோசானுடனான தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயத் தொடரின் தொடர்பில் ஓரளவு ambiguity இருப்பதால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: וְעָרֵי מָדָי
  choice: மேதியரின் நகரங்களிலும்
  rationale: מָדַי என்பது மேதிய மக்களையோ அவர்களின் நாட்டையோ குறிக்கலாம்; இங்கு நகரங்களுடனான உடைமைத் தொடர்பை நேரடியாகத் தருகிறது.
