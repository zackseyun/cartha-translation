source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: ta
  text: 'யாவே அவர்களுடன் ஓர் உடன்படிக்கை செய்து, அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “நீங்கள் வேறு தெய்வங்களுக்குப் பயப்படக் கூடாது; அவற்றைப் பணிந்துகொள்ளவோ, அவற்றுக்குப் பணிபுரியவோ, அவற்றுக்குப் பலியிடவோ கூடாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்து
  rationale: כרת ברית என்பது சொற்படியாக ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் ‘உடன்படிக்கை செய்தல்’ என வழங்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்
  rationale: கட்டளையிடுதல் மற்றும் நேரடிக் கூற்றை அறிமுகப்படுத்துதல் ஆகிய இரு எபிரெயக் கூறுகளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא תִירְאוּ
  choice: பயப்படக் கூடாது
  rationale: ירא என்பதன் ‘அஞ்சுதல்/பயப்படுதல்’ என்ற தனிப்பொருளைக் காக்கிறது; தொடர்ந்து வரும் வழிபாட்டுச் செயல்களுடன் இதை ஒன்றாக்கவில்லை. ‘கூடாது’ உடன்படிக்கைக் கட்டளையின் தடை வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: אחרים என்பதன் நேரான பொருள் ‘வேறு’; பலவினை வடிவமும் காக்கப்படுகிறது.
- source_word: תִשְׁתַּחֲווּ
  choice: பணிந்துகொள்ள
  rationale: உடலைத் தாழ்த்திப் பணியும் குறிப்பான செயலைக் காட்டுகிறது; பொதுவான ‘வழிபடுதல்’ என்று விரிவாக்கவில்லை.
- source_word: תַעַבְדוּם
  choice: அவற்றுக்குப் பணிபுரிய
  rationale: עבד என்பதன் அடிப்படை ‘சேவை/பணி செய்தல்’ பொருளைத் தக்கவைத்து, சுற்றியுள்ள பிற வழிபாட்டுச் செயல்களிலிருந்து வேறுபடுத்துகிறது.
- source_word: תִזְבְּחוּ לָהֶם
  choice: அவற்றுக்குப் பலியிட
  rationale: זבח குறிக்கும் குறிப்பான பலியிடும் செயலைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது நவீனத் தமிழில் தெளிவான வடிவம்.
- issue: உடன்படிக்கைக் கட்டளைகளிலுள்ள தடைகளின் வலிமை
  choice: …க் கூடாது
  alternative: …அஞ்சாதீர்கள் / …செய்யாதீர்கள்
  rationale: לא + imperfect வடிவங்களின் கட்டளைத் தடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; சட்டரீதியான உறுதியையும் காக்கிறது.
- issue: ירא என்பதன் சமயச் சூழல் பொருள்
  choice: பயப்படுதல்
  alternative: வழிபடுதல் / பயபக்தி கொள்ளுதல்
  rationale: பின்வரும் பணிதல், பணிபுரிதல், பலியிடுதல் ஆகிய தனித்தனி செயல்களை மூலமே குறிப்பிடுவதால், ‘பயப்படுதல்’ என்ற சொற்பொருளைத் தக்கவைத்து பொருள்களை ஒன்றாக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளையில் உடன்படிக்கைக் கட்டளைக்கேற்ற கண்ணியமும் உறுதியும் கொண்ட நடை. உயிரற்ற/பொய்த் தெய்வச் சுட்டுக்கு ‘அவற்றை/அவற்றுக்கு’ பயன்படுத்தப்பட்டுள்ளது.
