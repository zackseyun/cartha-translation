  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: ta
  text: ஆனால் ஒவ்வோர் இனத்தாரும் தங்களுக்கெனத் தெய்வங்களைச் செய்துகொண்டே இருந்தார்கள்; ஒவ்வோர் இனத்தாரும் தாங்கள் குடியிருந்த நகரங்களில், சமாரியா மக்கள் அமைத்திருந்த மேட்டு வழிபாட்டிடங்களின் கோயில்களில் அவற்றை வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: செய்துகொண்டே இருந்தார்கள்
  rationale: היה + பங்கேற்புவினை கடந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமான செயலைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதன் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: גּוֹי גּוֹי
  choice: ஒவ்வோர் இனத்தாரும்
  rationale: சொல் இரட்டிப்பு பகிர்ந்தளிக்கும் பொருளில், ஒவ்வொரு தனித்த இனக்குழுவையும் குறிக்கிறது. ‘இனத்தார்’ மக்கள் குழுவைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: אֱלֹהָיו
  choice: தங்களுக்கெனத் தெய்வங்களை
  rationale: ஒவ்வொரு இனத்திற்கும் உரிய தனித்த தெய்வங்கள் என்ற உடைமை மற்றும் வேறுபாட்டுப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וַיַּנִּיחוּ
  choice: வைத்தார்கள்
  rationale: இச்சூழலில் வினைச்சொல் ஒன்றை ஓர் இடத்தில் வைப்பதைக் குறிக்கிறது; ‘வைத்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּבֵית הַבָּמוֹת
  choice: மேட்டு வழிபாட்டிடங்களின் கோயில்களில்
  rationale: சொல்லுக்குச் சொல் ‘மேடுகளின் வீடு’ என வழங்காமல், உயர்ந்த இடங்களோடு தொடர்புடைய வழிபாட்டுக் கட்டடங்களைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: சமாரியா மக்கள் அமைத்திருந்த
  rationale: பிற்கால சமயப் பிரிவைக் குறிக்கும் பெயராகத் தவறாகப் புரிந்துகொள்ளப்படாமல், இங்கு சமாரியா பகுதியின் மக்களைக் குறிக்கும் வரலாற்றுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: அவர்கள் குடியிருந்த நகரங்களில்
  rationale: அந்த இனத்தார் குடியேறி வாழ்ந்த நகரங்களை அடையாளப்படுத்தும் தொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: שֹׁמְרֹנִים என்பதன் மொழிபெயர்ப்பு
  choice: சமாரியா மக்கள்
  alternative: சமாரியர்கள்
  rationale: இந்த வரலாற்றுச் சூழலில் சொல் சமாரியா பகுதியின் குடிமக்களைக் குறிக்கலாம்; பிற்காலத்தில் ‘சமாரியர்கள்’ என்ற பெயருடன் தொடர்புபெற்ற சமயப் பிரிவை வசனத்திற்குள் முன்கூட்டியே கொண்டுவராமல் இருப்பதற்காக முதன்மை உரையில் ‘சமாரியா மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. நேரடி பெயர்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை. ‘மேட்டு வழிபாட்டிடங்கள்’ என்பது பண்டைய உயரிட வழிபாட்டுத் தலங்களைத் தெளிவாகக் குறிக்கிறது; ‘கோயில்கள்’ அவற்றிலிருந்த வழிபாட்டுக் கட்டடங்களைக் குறிக்கிறது. வாக்கிய வரிசை தமிழில் இயல்பாக அமையச் சற்று மாற்றப்பட்டாலும், ஒவ்வோர் இனமும் தனித்தனியாகச் செயல்பட்டது இருமுறை வலியுறுத்தப்பட்டுள்ளது.
