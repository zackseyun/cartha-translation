  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: ta
  text: ஆனால், உங்கள் கடவுளாகிய யாவேவுக்கே நீங்கள் பயப்பட வேண்டும்; அவர் உங்கள் எதிரிகள் அனைவருடைய கையிலிருந்தும்[a] உங்களை விடுவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கையிலிருந்து’ என்பது ‘அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் … ஏ
  rationale: முந்தைய வசனத்தில் பிற தெய்வங்களுக்குப் பயப்படக்கூடாது என்று கூறியதற்கு மாறான வலியுறுத்தலை இது தருகிறது. ‘ஆனால்’ எதிர்மறை மாறுபாட்டையும், ‘யாவேவுக்கே’ என்ற ஏகாரமும் தனிப்பட்ட அர்ப்பணிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; ஆகவே ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மைக்கான சாத்தியம் இருந்தாலும், இங்கு யாவேவைக் குறிப்பதால் ஒருமைப் பொருள் தெளிவாக உள்ளது.
- source_word: תִּירָאוּ
  choice: நீங்கள் பயப்பட வேண்டும்
  rationale: இந்த உடன்படிக்கைச் சூழலில் வினைச்சொல் கடவுளுக்குரிய அச்சம் கலந்த மரியாதையையும் கீழ்ப்படிதலையும் குறிக்கிறது. ‘பயப்பட வேண்டும்’ அதன் நேரடியான கட்டளை வலிமையைத் தக்கவைக்கிறது.
- source_word: וְהוּא
  choice: அவரே
  rationale: எபிரெயத்தில் எழுவாய்ச் சுட்டுப்பெயர் வெளிப்படையாக உள்ளது. தமிழில் ‘அவரே’ என்பது யாவேதான் விடுவிப்பவர் என்ற இயல்பான வலியுறுத்தலை அளிக்கிறது.
- source_word: יַצִּיל
  choice: விடுவிப்பார்
  rationale: נצל என்பதன் ஹிப்ஃபீல் வடிவம் ஆபத்து அல்லது பகைவரின் கட்டுப்பாட்டிலிருந்து மீட்பதைக் குறிக்கிறது; ‘விடுவிப்பார்’ இச்சூழலுக்கு இயல்பானது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: மூலத்தின் உருவகத்தைப் பாதுகாக்கும் நேரடி மொழிபெயர்ப்பு; இங்கு ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: כָּל אֹיְבֵיכֶם
  choice: உங்கள் எதிரிகள் அனைவரின்
  rationale: முழுமையைக் குறிக்கும் כָּל என்பதையும் பன்மையான பகைவர்களையும் இயல்பான தமிழ்ச் சொற்றொடரில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் கடவுளின் தனிப்பெயர் நேரடியாக வருகிறது. பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: תִּירָאוּ என்பதிலுள்ள ‘பயம்’ மற்றும் ‘பக்திமரியாதை’ நுணுக்கம்
  choice: பயப்பட வேண்டும்
  alternative: பயபக்தியுடன் மதிக்க வேண்டும்
  rationale: வினைச்சொல் பக்திமரியாதையை உள்ளடக்கினாலும் அதன் உண்மையான ‘பயம்’ என்ற நுணுக்கத்தை மென்மையாக்காமல், வாசகர் சூழலிலிருந்து முழுப் பொருளையும் உணருமாறு நேரடியான சொல்லாட்சி வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் நேரடியும் கண்ணியமுமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் வலிமை ‘வேண்டும்’ என்பதாலும், כִּי אִם என்பதிலுள்ள எதிர்மறை மற்றும் தனிப்படுத்தும் வலியுறுத்தல் ‘ஆனால் … யாவேவுக்கே’ என்பதாலும் வெளிப்படுகிறது. மரியாதைக்காக யாவேவைச் சுட்டும் இடங்களில் உயர்திணை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
