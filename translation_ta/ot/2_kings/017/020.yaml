  rationale: வரலாற்றுச் சூழல் இஸ்ரவேல் அரசை மையப்படுத்தினாலும், எபிரெய உரை ‘இஸ்ரவேலின் சந்ததி அனைத்தும்’ என்று கூறுகிறது. அதன் பரப்பிலுள்ள பதற்றத்தை மொழிபெயர்ப்பு தீர்மானித்து விடாமல் காக்கிறது.
- issue: ‘அவர்களைத் தமது முன்னிலையிலிருந்து அகற்றி எறிந்தார்’ என்பதன் தன்மை
  choice: இறைத் தீர்ப்பாகிய வெளியேற்றத்தை வலிமையான செயல்மொழியில் வைத்தல்
  alternative: உடன்படிக்கையிலிருந்து என்றென்றும் முற்றாக நீக்கினார் என்று விளக்கமாக்குதல்
  rationale: השליך מן־פנים வெளியேற்றத்தைச் சொல்கிறது; ஆனால் அதன் காலவரம்பு அல்லது இறுதியான இறையியல் விளைவை இவ்வசனம் தனியே வரையறுக்கவில்லை. எனவே அதற்கு மேலான கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. எபிரெய வினைச்செயல்களின் தொடரை அரைப்புள்ளிகளால் தெளிவுபடுத்தி, ‘கையில்’ மற்றும் ‘முன்னிலையிலிருந்து’ என்ற மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்பு முதன்மை உரையில் வரிசையாக இடப்பட்டுள்ளன.
