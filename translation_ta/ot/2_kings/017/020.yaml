base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: ta
  text: யாவே இஸ்ரவேலின் சந்ததியார் அனைவரையும்[a] நிராகரித்தார்; அவர்களைத் துன்புறுத்தி, கொள்ளையிடுவோரின் கையில் ஒப்புக்கொடுத்தார்[b]; இறுதியில், தமது முன்னிலையிலிருந்து[c] அவர்களை அகற்றி எறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் வழித்தோன்றல்கள் அனைவரையும்.’ எபிரெயத்தில், ‘இஸ்ரவேலின் சந்ததி அனைத்தையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கொள்ளையிடுவோரின் கையில் கொடுத்தார்.’
    reason: lexical_alternative
  - marker: c
    text: சொற்படி, ‘அவருக்கு முன்பிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: புறக்கணித்தார்
  rationale: מָאַס என்பது ஏற்க மறுத்தல் அல்லது நிராகரித்தலைக் குறிக்கிறது. தமிழில் ‘புறக்கணித்தார்’ என்பது வெறும் உணர்ச்சிவயப்பட்ட வெறுப்பைச் சேர்க்காமல், இங்குள்ள தீர்ப்புசார் நிராகரிப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சந்ததியார் அனைவரையும்
  rationale: זֶרַע என்பதன் கூட்டு ஒருமை கருத்தை இயல்பான நவீன தமிழில் ‘சந்ததியார்’ தெரிவிக்கிறது; כָל என்பதன் முழுமையான பரப்பை ‘அனைவரையும்’ காக்கிறது.
- source_word: וַיְעַנֵּם
  choice: அவர்களைத் துன்புறுத்தி
  rationale: Piel வடிவிலுள்ள ענה துன்பத்திற்கு உட்படுத்துதல், வாட்டுதல் அல்லது ஒடுக்குதல் என்ற பொருளைக் கொண்டது. ‘துன்புறுத்தி’ என்பது துன்பத்தின் வகையைத் தேவையின்றி குறுக்காமல் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: கையில் ஒப்புக்கொடுத்தார்
  rationale: נתן ביד என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற எபிரெய மரபுத்தொடர். ‘கையில் ஒப்புக்கொடுத்தார்’ அதன் உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: שֹׁסִים
  choice: கொள்ளையிடுவோர்
  rationale: שסס வேரிலிருந்து வந்த இச்சொல் சூறையாடி உடைமைகளைப் பறிப்பவர்களைக் குறிக்கிறது. ‘கொள்ளையிடுவோர்’ நவீன வாசகருக்குத் தெளிவானது.
- source_word: עַד אֲשֶׁר
  choice: …வரை
  rationale: இச்சேர்க்கை முந்தைய செயல்களின் முடிவுநிலையை அறிமுகப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்பில் ‘…வரை’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִשְׁלִיכָם
  choice: அகற்றி எறியும்வரை
  rationale: השליך என்பதன் அடிப்படைப் பொருள் எறிதல். இச்சூழலில் ‘அகற்றி எறிதல்’ என்பது வெளியேற்றத்தையும் மூலச் சொல்லின் வலிமையையும் காக்கிறது.
- source_word: מִפָּנָיו
  choice: தமது முன்னிலையிலிருந்து
  rationale: מִפָּנָיו என்பதன் சொற்பொருள் ‘அவருக்கு முன்பிருந்து’; இங்கு அது அவரது முன்னிலையிலிருந்து அகற்றப்படுவதைக் குறிக்கிறது. ‘தமது முன்னிலையிலிருந்து’ இயல்பாகவும் மூல உருவகத்துக்கு அருகாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
