  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: ta
  text: அங்கே அவர்கள் எல்லா வழிபாட்டு மேடைகளிலும் தூபம் எரித்தார்கள்; யாவே அவர்களுக்கு முன்பாக அகற்றியிருந்த பிற இனத்தவர்களைப் போலவே எரித்தார்கள். யாவேக்குக் கோபமூட்டும்படி அவர்கள் தீய செயல்களைச் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: தூபம் எரித்தார்கள்
  rationale: קטר என்பதன் பியேல் வடிவம் பலியையோ தூபத்தையோ புகையாக எழச் செய்வதைக் குறிக்கலாம். இங்கு வழிபாட்டு மேடைகளின் சூழலில், ‘தூபம் எரித்தார்கள்’ என்பது இயல்பாகவும் குறிப்பாகவும் பொருளைத் தருகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இடங்களை நேரடியாகச் சுட்டும் இடவினையடை.
- source_word: בְּכָל בָּמוֹת
  choice: எல்லா வழிபாட்டு மேடைகளிலும்
  rationale: במות என்பது சாதாரண உயரமான இடங்களை மட்டும் அல்லாமல் வழிபாட்டுக்காக அமைந்த மேடைகளைக் குறிக்கும் சமயச் சொல்லாகும். ‘வழிபாட்டு மேடைகள்’ நவீன வாசகருக்கு அந்தப் பொருளைத் தெளிவாக்குகிறது.
- source_word: כַּגּוֹיִם
  choice: பிற இனத்தவரைப் போலவே
  rationale: גוים இங்கு இஸ்ரவேலுக்கு முன் நாட்டில் வாழ்ந்து அகற்றப்பட்ட இனக்குழுக்களைக் குறிக்கிறது; பிற்கால யூதர்–புறவினர் வேறுபாட்டைத் திணிக்காமல் ‘பிற இனத்தவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: யாவே அவர்களுக்கு முன்பாக அகற்றியிருந்த
  rationale: גלה என்பது நாடுகடத்துதல் அல்லது ஓரிடத்திலிருந்து அகற்றுதல் ஆகிய இரு நுணுக்கங்களையும் கொள்ளலாம். இங்குள்ள நிலப்பறிப்பு/வெளியேற்றச் சூழலுக்கு ‘அகற்றியிருந்த’ பொருத்தமானது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: தீய செயல்களைச் செய்தார்கள்
  rationale: எபிரெயச் சொற்றொடரின் பரந்த அறநெறிக் கண்டனத்தை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְהַכְעִיס
  choice: கோபமூட்டும்படி
  rationale: כעס என்பதன் ஹிஃபில் வடிவம் ஒருவருக்குக் கோபத்தை உண்டாக்குதல் அல்லது அவரைத் தூண்டுதல் என்று பொருள்படும்; இங்கு நோக்கம் அல்லது விளைவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: הֶגְלָה என்பதன் சூழல்சார் பொருள்
  choice: அகற்றியிருந்த
  alternative: நாடுகடத்தியிருந்த; துரத்தியிருந்த
  rationale: இங்கு முன்பு நாட்டில் வாழ்ந்த இனங்கள் அங்கிருந்து அகற்றப்பட்டதைக் குறிக்கும். ‘அகற்றியிருந்த’ என்பது வினையின் பரந்த பொருளையும் சூழலையும் காக்கிறது; குறிப்பான ‘நாடுகடத்தியிருந்த’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வழிபாட்டு மேடைகள்’ என்பது במות என்ற சமயத் தொழில்நுட்பச் சொல்லை விளக்கமாகத் தருகிறது. ஒப்புமையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘போலவே நடந்துகொண்டு’ சேர்க்கப்பட்டுள்ளது; இது அடுத்துள்ள தீய செயல்களுடன் வாக்கியத் தொடர்பைத் தெளிவாக்குகிறது.
