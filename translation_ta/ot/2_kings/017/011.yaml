revisions:
- from: அங்கே அவர்கள் எல்லா வழிபாட்டு மேடைகளிலும் தூபம் எரித்தார்கள். யாவே அவர்களுக்கு முன்பாக அகற்றியிருந்த[a] பிற இனத்தவரைப் போலவே நடந்துகொண்டு, யாவேக்குக் கோபமூட்டும்படி தீய செயல்களைச் செய்தார்கள்.
  to: அங்கே அவர்கள் எல்லா வழிபாட்டு மேடைகளிலும் தூபம் எரித்தார்கள்; யாவே அவர்களுக்கு முன்பாக அகற்றியிருந்த பிற இனத்தவர்களைப் போலவே எரித்தார்கள். யாவேக்குக் கோபமூட்டும்படி அவர்கள் தீய செயல்களைச் செய்தார்கள்.
  rationale: The revision ties the comparative phrase directly to the incense-burning, as in the Hebrew, and removes the unsupported addition ‘நடந்துகொண்டு.’ The lexical ambiguity of הֶגְלָה remains represented by the unchanged primary sense and footnote alternative.
