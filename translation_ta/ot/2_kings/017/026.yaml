base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: ta
  text: எனவே, அவர்கள் அசீரியாவின் அரசனிடம், “நீர் நாடுகடத்தி சமாரியாவின் நகரங்களில் குடியேற்றிய மக்களுக்குத் தேசத்தின் தெய்வத்துக்குரிய முறை[a] தெரியவில்லை. ஆகவே, அவர் அவர்களிடையே சிங்கங்களை அனுப்பியிருக்கிறார்; இதோ, அவை அவர்களைக் கொன்றுகொண்டிருக்கின்றன. ஏனெனில், அவர்களுக்குத் தேசத்தின் தெய்வத்துக்குரிய முறை தெரியவில்லை” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேசத்தின் தேவனுக்குரிய முறை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இஸ்ரவேலின் தேவனைக் குறிக்கக்கூடும்; ஆனால் முதன்மை உரையிலுள்ள “தெய்வம்” என்பது பேசுகிறவர்களின் நிலப்பரப்பு சார்ந்த சமயப் பார்வையைப் பாதுகாக்கிறது. “முறை” என்பதற்கு “சட்டம்,” “நியமம்,” அல்லது “வழிபாட்டு வழக்கம்” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: மக்கள்
  rationale: இங்கு அசீரியாவால் இடம்பெயர்த்துக் குடியேற்றப்பட்ட பல இனக்குழுக்களைக் குறிக்கிறது. தமிழில் ‘மக்கள்’ இயல்பாகவும் வரலாற்றுச் சூழலுக்கு ஏற்றவாறும் உள்ளது; ‘புறவினத்தார்’ போன்ற பிற்கால சமயச் சாயலைத் தவிர்க்கிறது.
- source_word: הִגְלִיתָ
  choice: நாடுகடத்தி
  rationale: גלה என்பதன் ஹிப்இல் வடிவம் கட்டாயமாகத் தாயகத்திலிருந்து அகற்றப்பட்டதைக் குறிக்கிறது. ‘நாடுகடத்தி’ அந்த வலுக்கட்டாயப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַתּוֹשֶׁב
  choice: குடியேற்றிய
  rationale: ישׁב என்பதன் காரணவினைப் பொருளைத் தக்கவைத்து, புதிய இடத்தில் வாழ வைத்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: சமாரியாவின் நகரங்களில்
  rationale: சமாரியா என்ற பிரதேசத்திலுள்ள பல நகரங்கள் என்னும் எபிரெயக் கட்டமைப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִשְׁפַּט
  choice: முறை
  rationale: இங்கு நீதித்தீர்ப்பு என்பதல்ல; அந்நாட்டின் தெய்வத்தை வழிபட வேண்டிய நிர்ணயிக்கப்பட்ட நெறி அல்லது வழக்கத்தைக் குறிக்கிறது. ‘முறை’ என்பது ‘சட்டம்’ என்பதைக் காட்டிலும் இந்த வழிபாட்டு அர்த்தத்தை இயல்பாக எடுத்துரைக்கிறது; பொருளின் விரிவை அடிக்குறிப்பு காட்டுகிறது.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: தேசத்தின் தெய்வம்
  rationale: பேசுகிறவர்கள் தெய்வத்தை ஒரு நிலப்பரப்புடன் தொடர்புடையதாகக் கருதும் பார்வையை ‘தெய்வம்’ பாதுகாக்கிறது. அதேவேளை, கதையின் விரிந்த சூழலில் குறிப்பிடப்படுவது இஸ்ரவேலின் தேவனே என்ற சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: அவர் அவர்களிடையே சிங்கங்களை அனுப்பியிருக்கிறார்
  rationale: வினையின் எளிய ‘அனுப்புதல்’ பொருளையும் בם என்பதன் ‘அவர்களிடையே’ என்ற இயல்பான பொருளையும் தக்கவைக்கிறது. நிகழ்கால விளைவுடன் கூடிய கடந்த செயலை ‘அனுப்பியிருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: וְהִנָּם
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் הִנֵּה-யின் வலிமையை, கண்ணியமானதும் இன்றும் இயல்பானதுமான ‘இதோ’ பாதுகாக்கிறது.
- source_word: מְמִיתִים אוֹתָם
  choice: அவை அவர்களைக் கொன்றுகொண்டிருக்கின்றன
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடரும் செயற்பாட்டை ‘கொன்றுகொண்டிருக்கின்றன’ வெளிப்படுத்துகிறது; ‘அவை’ என்பது சிங்கங்களைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: ஏனெனில், அவர்களுக்குத் … தெரியவில்லை
  rationale: சிங்கங்கள் கொல்வதற்கான காரணமாக அறியாமையை முன்வைக்கும் சூழல்சார் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ என்பதை ‘தேசத்தின் தேவன்’ அல்லது ‘தேசத்தின் தெய்வம்’ என்று வழங்குவது
  choice: முதன்மை உரையில் ‘தேசத்தின் தெய்வம்’
  alternative: ‘தேசத்தின் தேவன்’
  rationale: மேற்கோளுக்குள் பேசுகிறவர்களின் நிலப்பரப்பு சார்ந்த புறசமயப் புரிதலை ‘தெய்வம்’ பாதுகாக்கிறது; கதைச் சூழலில் அது இஸ்ரவேலின் தேவனைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது. இதனால் உரையின் இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் நிலைக்கிறது.
- issue: מִשְׁפַּט என்பதன் வழிபாட்டு சூழலிலான பொருள்
  choice: முறை
  alternative: சட்டம்; வழக்கம்; நியமம்
  rationale: இந்த இடத்தில் சொல் அத்தெய்வத்தை எவ்வாறு வழிபட வேண்டும் என்ற நியமிக்கப்பட்ட முறையைக் குறிக்கிறது. ‘முறை’ சட்டரீதியாக அளவுக்கு மீறிச் சுருக்காமலும் வெறும் சமூக வழக்கமாகக் குறைக்காமலும் பொருளை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை. அரசனை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலம் மூலத்தின் உயிரோட்டமான கவன ஈர்ப்பு தக்கவைக்கப்பட்டுள்ளது.
