revisions:
- from: அவர் உங்களுக்காக எழுதிய விதிமுறைகளையும், நீதிநெறிகளையும், போதனையையும், கட்டளையையும்[a] நீங்கள் எந்நாளும் கவனமாகக் கடைப்பிடிக்க வேண்டும்[b]. வேறு தெய்வங்களுக்குப் பயப்படக் கூடாது[c].
  to: அவர் உங்களுக்காக எழுதிய விதிமுறைகளையும், நீதித்தீர்ப்புகளையும், சட்டத்தையும், கட்டளையையும்[a] நீங்கள் எந்நாளும் கவனமாகக் கடைப்பிடிக்க வேண்டும்[b]; வேறு தெய்வங்களுக்குப் பயப்படக் கூடாது[c].
  rationale: 'The revision strengthens fidelity to the Hebrew legal vocabulary: הַמִּשְׁפָּטִים is rendered ‘நீதித்தீர்ப்புகள்,’ and הַתּוֹרָה is rendered ‘சட்டம்.’ It retains the natural modern Tamil rendering of the observe-and-do phrase and preserves the full-time force of כָּל הַיָּמִים through ‘எந்நாளும்.’ Footnote c is made more religiously neutral while retaining the contextual nuance of reverential allegiance toward deities.'
