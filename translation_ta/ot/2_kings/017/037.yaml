base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: ta
  text: அவர் உங்களுக்காக எழுதிய விதிமுறைகளையும், நீதித்தீர்ப்புகளையும், சட்டத்தையும், கட்டளையையும்[a] நீங்கள் எந்நாளும் கவனமாகக் கடைப்பிடிக்க வேண்டும்[b]; வேறு தெய்வங்களுக்குப் பயப்படக் கூடாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விதிமுறைகள் … நீதித்தீர்ப்புகள் … சட்டம்/அறிவுரை … கட்டளை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயம் ஒன்றோடொன்று தொடர்புடையதாயினும் தனித்த நுட்பங்களைக் கொண்ட நான்கு உடன்படிக்கைச் சட்டச் சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்பொருளில், ‘செய்வதற்காகக் காத்துக்கொள்ள வேண்டும்.’ இந்த எபிரெயச் சொற்றொடர் கவனித்துக் காப்பதையும் நடைமுறையில் செய்வதையும் இணைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு ‘பயப்படுதல்’ என்பது வெறும் அச்சத்தை மட்டுமல்ல, ஒரு தெய்வத்திற்குரிய பயபக்தி, வழிபாடு, பற்றுறுதி ஆகியவற்றையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: விதிமுறைகள்
  rationale: குறித்து நிர்ணயிக்கப்பட்ட சட்ட ஏற்பாடுகள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; சட்டநெறி என்ற தனித்தன்மையையும் காக்கிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிநெறிகள்
  rationale: சட்டத் தீர்ப்புகள் அல்லது நீதிசார் ஒழுங்குகள் என்ற பொருளைத் தருகிறது; அருகிலுள்ள பிற உடன்படிக்கைச் சட்டச் சொற்களுடன் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
- source_word: הַתּוֹרָה
  choice: போதனை
  rationale: תּוֹרָה என்பதன் அடிப்படை instruction என்னும் பொருளை வெளிப்படுத்துகிறது; இங்கு சட்டப் பட்டியலில் இருப்பதால் அதன் அதிகாரமிக்க உடன்படிக்கைச் சாரமும் நீங்கவில்லை.
- source_word: הַמִּצְוָה
  choice: கட்டளை
  rationale: எபிரெயத்தில் ஒருமையாக உள்ள சொல்லைத் தமிழிலும் ஒருமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: அவர் உங்களுக்காக எழுதிய
  rationale: எழுதியவர் சூழலில் ஆண்டவர் என்றாலும், இவ்வசனத்தின் எபிரெய உரையில் பெயர் வெளிப்படையாக இல்லாததால் ‘அவர்’ எனவே வைத்துள்ளது.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடிக்க வேண்டும்
  rationale: ‘காத்து/கவனித்து செயல்படுத்துதல்’ என்ற இரு கூறுகளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; வெறும் அறிவுசார் ஏற்றுக்கொள்ளலாக அல்லாமல் நடைமுறை கீழ்ப்படிதலைக் குறிக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எந்நாளும்
  rationale: ‘எல்லா நாட்களிலும்’ என்ற காலநீட்சி பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மூலத்தில் இல்லாத உடைமைப் பெயரைச் சேர்ப்பதில்லை.
- source_word: תִירְאוּ
  choice: பயப்பட
  rationale: அடிப்படை ‘அஞ்சுதல்/பயப்படுதல்’ பொருளைக் காக்கிறது; இச்சூழலில் வழிபாட்டுக்குரிய பயபக்தி மற்றும் விசுவாசப் பற்றையும் உள்ளடக்குகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ஆண்டவரைத் தவிர்ந்த பிற தெய்வங்களைக் குறிக்கும் வழக்கமான எபிரெய சொற்றொடரின் நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தைச் சுட்டும் நான்கு சொற்களைத் தனித்தனியாக வைத்தல்
  choice: விதிமுறைகள், நீதிநெறிகள், போதனை, கட்டளை என நான்கு சொற்களையும் காத்தல்
  alternative: ‘சட்டங்களும் கட்டளைகளும்’ எனச் சுருக்குதல்
  rationale: எபிரெயம் நோக்கத்துடன் சட்டச் சொற்களை அடுக்குகிறது; அவற்றைத் தனித்தனியாகத் தருவது வசனத்தின் வலியுறுத்தலையும் உடன்படிக்கைப் பொறுப்பின் பரப்பையும் காக்கிறது.
- issue: ‘எழுதிய’ என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என வைத்தல்
  alternative: ‘ஆண்டவர்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் எழுதியவர் ஆண்டவர் என்பதைத் தெளிவாக்கினாலும், இவ்வசனத்தின் மூல உரையில் அந்தப் பெயர் வெளிப்படையாக இல்லை; ஆகவே தேவையற்ற விளக்கச் சேர்க்கை தவிர்க்கப்படுகிறது.
- issue: ‘பயப்படுதல்’ என்பதன் வழிபாட்டு நுட்பம்
  choice: முதன்மை உரையில் ‘பயப்பட’ என வைத்து அடிக்குறிப்பில் அதன் விரிவான பொருளை விளக்குதல்
  alternative: ‘வழிபட’ அல்லது ‘பயபக்தி செலுத்த’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: יָרֵא என்பதன் உண்மையான சொற்பொருளையும், பிற தெய்வங்களுக்கான வழிபாட்டு விசுவாசத்தை மறுக்கும் இச்சூழலின் இறையியல் அழுத்தத்தையும் ஒருசேர காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்ட-உடன்படிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நான்கு சட்டச் சொற்களும் வேறுபடுத்தப்பட்டுள்ளன; கடினமான எபிரெய வாக்கிய அமைப்பு இயல்பான தமிழாக மாற்றப்பட்டாலும் ‘காத்து செய்வது’ என்ற முழுப் பொருள் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
