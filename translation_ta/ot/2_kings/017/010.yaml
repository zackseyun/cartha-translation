  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: ta
  text: அவர்கள் தங்களுக்காக ஒவ்வொரு உயரமான குன்றின்மேலும், ஒவ்வொரு பசுமையான மரத்தின் கீழும் வழிபாட்டுத் தூண்களையும் அசேரா கம்பங்களையும்[a] நிறுவினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசேரீம்’ என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: நிறுவினார்கள்
  rationale: இங்கு ஹிப்இல் வடிவம் வழிபாட்டுப் பொருட்களை நிலைநிறுத்துதல் அல்லது எழுப்புதல் என்ற பொருளில் வருகிறது; ‘நிறுவினார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לָהֶם
  choice: தங்களுக்காக
  rationale: இந்தப் பொருட்களைத் தங்களுடைய பயன்பாட்டிற்காக ஏற்படுத்தியதைத் தன்மைப் பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: מַצֵּבוֹת
  choice: வழிபாட்டுத் தூண்கள்
  rationale: நிறுத்தப்பட்ட வழிபாட்டுக் கல் தூண்களைக் குறிக்கிறது; ‘வழிபாட்டு’ என்பது சூழலில் உள்ள சமயப் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: וַאֲשֵׁרִים
  choice: அசேரா கம்பங்கள்
  rationale: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கும் எபிரெயப் பன்மைச் சொல்லை, அதன் பெயர்த் தொடர்பையும் பொருளின் சாத்தியமான வடிவத்தையும் காக்கும் வகையில் வழங்குகிறது.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: ஒவ்வொரு உயரமான குன்றின்மேலும்
  rationale: இடத்தைச் சுட்டும் எபிரெய உருவகத்தை இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: ஒவ்வொரு பசுமையான மரத்தின் கீழும்
  rationale: רַעֲנָן என்பதன் பசுமை, செழுமை ஆகிய பொருள் வரம்புகளில், மூலத்தின் பரிச்சயமான இடவுருவகத்தை ‘பசுமையான’ என்பது எளிமையாகக் காக்கிறது.
theological_decisions:
- issue: אֲשֵׁרִים என்பதன் மொழிபெயர்ப்பு
  choice: அசேரா கம்பங்கள்
  alternative: அசேரீம்; அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்கள்
  rationale: இச்சொல் தேவதையையே நேரடியாகக் குறிப்பதைவிட, அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிப்பது இயல்பானது. ‘கம்பங்கள்’ என்பது வாசகருக்குப் புரியக்கூடிய வடிவைக் கொடுக்கிறது; அதேவேளையில் அடிக்குறிப்பு எபிரெயச் சொல்லின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் இட வரிசையும் வழிபாட்டுப் பொருட்களின் இணைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன.
