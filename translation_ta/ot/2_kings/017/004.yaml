base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: ta
  text: அசீரிய அரசன் ஓசேயாவிடம் சதித்திட்டம் இருப்பதைக் கண்டுபிடித்தான்[a]. ஏனெனில், ஓசேயா எகிப்தின் அரசனான சோவிடம்[b] தூதர்களை அனுப்பியிருந்தான்; மேலும் ஆண்டுதோறும் அசீரிய அரசனுக்குச் செலுத்த வேண்டிய திறையைச் செலுத்தவில்லை[c]. ஆகவே, அசீரிய அரசன் அவனைத் தடுத்து வைத்து, சிறையில் விலங்கிட்டான்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓசேயாவிடம் அரசத்துரோகம் இருப்பதைக் கண்டான்.” எபிரெயத்தில் சொல்லளவில் “ஓசேயாவிடம் சதித்திட்டத்தைக் கண்டான்” என்று உள்ளது; அவனிடம் விசுவாசமற்ற இரகசியத் திட்டம் இருப்பதைக் கண்டறிந்தான் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “சோ” என்பது எபிரெயப் பெயரின் ஒலிபெயர்ப்பு. இந்த எகிப்திய அரசன் வரலாற்றில் யார் என்பது உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
  - marker: c
    text: சொல்லளவில், “திறையை மேலே கொண்டுவரவில்லை.” சூழலில் இதற்கு “திறை செலுத்தவில்லை” என்று பொருள்.
    reason: lexical_alternative
  - marker: d
    text: 'எபிரெயம் இரண்டு செயல்களை வேறுபடுத்துகிறது: அசீரிய அரசன் முதலில் ஓசேயாவைத் தடுத்து வைத்தான்; பின்னர் அவனைச் சிறையில் விலங்கிட்டான்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... קֶשֶׁר בְּהוֹשֵׁעַ
  choice: ஓசேயாவிடம் சதித்திட்டம் இருப்பதைக் கண்டுபிடித்தான்
  rationale: எபிரெய மொழியின் ‘ஓசேயாவிடம் சதித்திட்டத்தைக் கண்டான்’ என்ற சொற்றொடர், அவனுடைய விசுவாசமற்ற இரகசியத் திட்டத்தை அரசன் கண்டறிந்தான் என்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் உருவகத்தை அளவுக்கு மீறி விரிக்காமலும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: שָׁלַח מַלְאָכִים
  choice: தூதர்களை அனுப்பியிருந்தான்
  rationale: מַלְאָכִים என்பதற்கு பொதுவாக ‘தூதர்கள்’ என்று பொருள்; இங்கு அரசியல் தொடர்புடைய பிரதிநிதிகள் என்பது சூழலால் தெளிவாகிறது. காரணத்திற்கு முன்பே நிகழ்ந்த செயலைத் தமிழில் காட்ட ‘அனுப்பியிருந்தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: סוֹא
  choice: சோ
  rationale: எகிப்திய அரசனின் வரலாற்று அடையாளம் உறுதியாக இல்லாததால், விவாதத்திற்குரிய வேறு அடையாளத்தைப் புகுத்தாமல் எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִנְחָה
  choice: திறை
  rationale: இச்சொல்லுக்கு காணிக்கை அல்லது அன்பளிப்பு என்ற பரந்த பொருள் இருந்தாலும், அசீரியாவுக்குக் கீழ்ப்பட்ட அரசன் செலுத்தும் அரசியல் சூழலில் ‘திறை’ என்பதே துல்லியமானது.
- source_word: הֶעֱלָה
  choice: செலுத்தவில்லை
  rationale: வினைச்சொல் சொல்லளவில் ‘மேலே கொண்டுவருதல்’ என்று பொருள்பட்டாலும், திறை தொடர்பான தமிழில் ‘திறை செலுத்துதல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: ஆண்டுதோறும் செலுத்திவந்ததுபோல்
  rationale: எபிரெய மரபுத்தொடர் ஒவ்வோர் ஆண்டும் தொடர்ந்து நடந்த வழக்கத்தைக் குறிக்கிறது. தமிழில் அதன் தொடர்ச்சியையும் ஒப்பீட்டையும் தெளிவாக்குகிறது.
- source_word: וַיַּעַצְרֵהוּ
  choice: அவனைத் தடுத்து வைத்து
  rationale: இவ்வினை தடுத்தல் அல்லது காவலில் வைத்தலைக் குறிக்கிறது. அடுத்த வினையில் வரும் கட்டுதல்/சிறைப்படுத்துதலிலிருந்து இதன் தனித்த செயல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: சிறையில் விலங்கிட்டான்
  rationale: אָסַר என்பதன் அடிப்படைப் பொருள் ‘கட்டுதல்’; בֵּית כֶּלֶא சிறையைக் குறிக்கிறது. ‘விலங்கிட்டான்’ என்பது சிறையில் கட்டுப்படுத்திப் பிணைத்ததைக் கண்ணியமான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
