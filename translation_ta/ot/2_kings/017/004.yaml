translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திறை’, ‘சதித்திட்டம்’, ‘விலங்கிட்டான்’ போன்ற சொற்கள் அரசியல் மற்றும் சிறைச்சூழலைத் துல்லியமாகக் காட்டுகின்றன; மூல எபிரெயத்தில் உள்ள செயல்வரிசையும் பெயரடையாளத்தின் நிச்சயமின்மையும் பாதுகாக்கப்பட்டுள்ளன.
