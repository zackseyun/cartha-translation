base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: ta
  text: இன்றுவரை அவர்கள் முந்தைய வழக்கங்களின்படியே[a] நடந்துவருகிறார்கள். அவர்கள் யாவேவுக்கு அஞ்சுவதில்லை[b]; தங்கள் சட்டங்களின்படியும் நியமங்களின்படியும், இஸ்ரயேல் என்று அவர் பெயரிட்ட யாக்கோபின்[d] மகன்களுக்கு[c] யாவே கட்டளையிட்ட சட்டத்தின்படியும் கட்டளையின்படியும் அவர்கள் நடப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முந்தைய விதிமுறைகளின்படி” அல்லது “முந்தைய நடைமுறைகளின்படி.”
    reason: lexical_alternative
  - marker: b
    text: “யாவேவுக்கு அஞ்சுவது” என்பதை “யாவேவிடம் பயபக்தி கொள்வது” என்றும் கூறலாம்; எபிரெய மரபுத்தொடர் அச்சத்தையும் பயபக்தியுள்ள உடன்படிக்கை விசுவாசத்தையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “யாக்கோபின் மகன்கள்”; இது யாக்கோபின் வழிவந்த மக்களை ஒரு சமூகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அதாவது, யாக்கோபு; ஆதியாகமம் 32:28; 35:10 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: தங்கள் முந்தைய வழக்கங்களின்படியே
  rationale: מִשְׁפָּטִים என்பதற்கு தீர்ப்புகள், விதிமுறைகள், வழக்கங்கள், நடைமுறைகள் ஆகிய பொருள்கள் உண்டு. முந்தைய வசனங்களில் விவரிக்கப்பட்ட தொடர்ந்து கடைப்பிடிக்கப்பட்ட சமய நடைமுறைகளை இங்கு குறிப்பதால், இயல்பான தமிழில் ‘முந்தைய வழக்கங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: யாவேவுக்குப் பயந்து நடப்பது
  rationale: இந்த எபிரெய மரபுத்தொடர் அச்சத்தையும் பயபக்தியோடு கூடிய உடன்படிக்கை விசுவாசத்தையும் உள்ளடக்குகிறது. ‘பயந்து நடப்பது’ அந்தச் செறிவைத் தக்கவைத்துக்கொண்டு தமிழில் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; ஆகவே தமிழில் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: தங்கள் சட்டதிட்டங்களின்படியும் முறைமைகளின்படியும்
  rationale: חֻקּוֹת என்பது நிலைநிறுத்தப்பட்ட சட்டதிட்டங்களையும், מִשְׁפָּטִים என்பது இங்கு ஒழுங்குமுறைகளையும் குறிக்கலாம். மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டை ‘தங்கள்’ தக்கவைக்கிறது; அது யாருடைய சட்டதிட்டங்கள் என்ற சூழல் சார்ந்த கேள்வியைத் தேவையின்றித் தீர்மானிப்பதில்லை.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: சட்டத்தின்படியும் கட்டளையின்படியும்
  rationale: תּוֹרָה என்பதன் சட்ட/போதனைப் பரப்பில் இவ்வுடன்படிக்கைச் சூழலுக்கு ‘சட்டம்’ பொருத்தமானது. מִצְוָה ஒருமையில் இருப்பதால் ‘கட்டளை’ என்றும் ஒருமையிலேயே வைக்கப்பட்டது.
- source_word: בְּנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் பன்மையை முறையாகத் தக்கவைக்கிறது; அதேவேளையில் இது யாக்கோபின் வழிவந்த மக்களை மொத்தமாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: இஸ்ரயேல் என்று அவர் பெயரிட்ட யாக்கோபு
  rationale: சொற்றொடர் யாக்கோபுக்குக் கொடுக்கப்பட்ட புதிய பெயரைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் தொடர்பு தெளிவாக இருக்க, பெயரிடுதல் யாக்கோபுடன் நேரடியாக இணைக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தக்கவைக்கப்பட்டது.
- issue: ‘தங்கள் சட்டதிட்டங்களும் முறைமைகளும்’ யாருக்குரியவை என்பது
  choice: உடைமைப் பின்னொட்டைத் தக்கவைத்து, தொடர்பை உரையில் திறந்தவாறே வைத்தல்
  alternative: அவை மக்களின் சொந்த சமய விதிகள் என்று வெளிப்படையாக விளக்குதல் அல்லது யாவேயின் விதிகள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: மூலத்தில் மூன்றாம் நபர் பன்மை உடைமை தெளிவாக இருந்தாலும், அது குறிக்கும் உறவு சூழலில் விவாதத்திற்குரியது. ‘தங்கள்’ என்பது மூல வடிவத்தைப் பாதுகாத்து, விளக்கவுரையை மொழிபெயர்ப்புக்குள் புகுத்துவதைத் தவிர்க்கிறது.
- issue: யாக்கோபுக்கு ‘இஸ்ரயேல்’ என்று பெயரிடப்பட்டதன் தொடர்பு
  choice: தொடர்புச் சொல்லை யாக்கோபுடன் இணைத்தல்
  alternative: அதை யாக்கோபின் மக்களுடன் இலக்கணரீதியாக இணைப்பதுபோல் தெளிவின்றி விடுதல்
  rationale: ஒருமை வடிவமும் ஆதியாகமம் 32:28; 35:10 ஆகிய பின்னணியும் பெயரிடப்பட்டவர் யாக்கோபே என்பதை காட்டுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. சட்டம் சார்ந்த இணைச்சொற்களின் வேறுபாடும், ஒருமை ‘கட்டளை’யும், இறைப்பெயரும் பாதுகாக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் மறுப்பு தமிழில் தெளிவாகப் புரிய இறுதியில் மீண்டும் சொல்லப்பட்டுள்ளது.
