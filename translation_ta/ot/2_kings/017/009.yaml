base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் தங்கள் கடவுளாகிய யாவேக்கு எதிராகச் சரியல்லாதவற்றை இரகசியமாகச் செய்தார்கள்.[a] அவர்கள் தங்களுடைய எல்லா ஊர்களிலும், காவற்கோபுரம் தொடங்கி அரணமைந்த நகரம் வரை,[c] தங்களுக்காக மேடைகளைக் கட்டினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் கடவுளாகிய யாவேயைக் குறித்து சரியல்லாத காரியங்களை மறைத்தார்கள்.” எபிரெய வினை அரிதானது; அது மறைத்தல் அல்லது இரகசியமாகச் செயல்படுதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மேடைகள்” என்பவை உள்ளூர் வழிபாட்டிடங்கள்; அவை பெரும்பாலும் அனுமதிக்கப்படாத வழிபாட்டுடன் தொடர்புடையவையாக இருந்தன.
    reason: cultural_note
  - marker: c
    text: “காவற்கோபுரம் தொடங்கி அரணமைந்த நகரம் வரை” என்பது சிறிய காவல் நிலையம் முதல் வலிமையான நகரம் வரை, நாடெங்கும் என்று உணர்த்தும் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: இரகசியமாகச் செய்தார்கள்
  rationale: அரிதாக வரும் חפא என்ற வினை மறைத்தல் அல்லது மறைவாகச் செயல்படுதல் என்ற பொருளைத் தரலாம். இங்கு ‘செயல்கள்/காரியங்கள்’ என்பதோடு வருவதால், இயல்பான தமிழில் மறைவாகச் செய்த செயலைக் குறிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: சரியல்லாத செயல்களை
  rationale: சொல்லுக்குச் சொல் ‘அவ்வாறல்லாத காரியங்கள்’ என்பது தமிழில் தெளிவற்றது. சூழலிலுள்ள ஒழுக்க மதிப்பீட்டை ‘சரியல்லாத’ என்பதும், நடைமுறைச் செயல்களை ‘செயல்கள்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய யாவேக்கு எதிராக
  rationale: விக்கிரக வழிபாடு மற்றும் உடன்படிக்கைத் துரோகத்தின் சூழலில் עַל எதிர்நிலையைச் சுட்டுகிறது. ஆகவே ‘குறித்து’ என்பதைக் காட்டிலும் ‘எதிராக’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான tetragrammaton-ஐ பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: தங்களுக்காக மேடைகளை அமைத்தார்கள்
  rationale: בָּמוֹת என்பது உள்ளூர் வழிபாட்டிடங்களைக் குறிக்கும் மரபுச் சொல். ‘மேடைகள்’ மூல உருவகத்தைப் பாதுகாக்கிறது; அதன் வழிபாட்டுச் சார்பு அடிக்குறிப்பில் விளக்கப்படுகிறது. לָהֶם ‘தங்களுக்காக’ என வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּכָל עָרֵיהֶם
  choice: தங்களுடைய எல்லா ஊர்களிலும்
  rationale: עָרִים சிறிய குடியிருப்புகள் முதல் பெரிய நகரங்கள் வரை குறிக்கக்கூடும். அடுத்துள்ள ‘காவற்கோபுரம் தொடங்கி அரண்சூழ்ந்த நகரம் வரை’ என்ற விரிவோடு பொருந்த ‘ஊர்கள்’ இயல்பான பரந்த தமிழ்ச் சொல்.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: காவற்கோபுரம் தொடங்கி
  rationale: מִגְדַּל נוֹצְרִים என்பது காவலர்கள் கண்காணிக்கும் கோபுரம். ‘காவற்கோபுரம்’ சுருக்கமாகவும் தெளிவாகவும் அந்தப் பொருளைக் கொடுக்கிறது.
- source_word: עַד עִיר מִבְצָר
  choice: அரண்சூழ்ந்த நகரம் வரை
  rationale: עִיר מִבְצָר பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரத்தைக் குறிக்கிறது. ‘அரண்சூழ்ந்த நகரம்’ இயல்பான, துல்லியமான தமிழாக்கம்.
theological_decisions:
- issue: இஸ்ரவேலரின் மறைவான செயல்களின் ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த வலிமை
  choice: யாவேக்கு எதிராக மறைவாகச் செய்யப்பட்ட தவறான நடைமுறைச் செயல்கள்
  alternative: யாவேயைக் குறித்த தவறான காரியங்களை அவர்கள் மறைத்தார்கள்; அல்லது அவரைப் பற்றிப் பொய்யானவற்றைப் பேசினார்கள்
  rationale: அரிதான வினை மறைத்தல் மற்றும் மறைவாகச் செய்தல் ஆகிய இரு நிழற்பொருள்களையும் அனுமதிக்கிறது. ஆனால் தொடர்ந்து மேடைகள் கட்டியதாகச் சொல்லப்படுவது நடைமுறைச் செயல்களை ஆதரிக்கிறது. ‘எதிராக’ என்பது சூழலின் உடன்படிக்கைத் துரோகத்தை வெளிப்படுத்துகிறது; சொல்லின் உண்மையான ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ தெய்வீகப் பெயரை நேரடியாகக் காக்கிறது. அரிதான וַיְחַפְּאוּ என்பதிலுள்ள மறைவு/மறைத்தல் ஐயம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது. அடிக்குறி வரிசை உரையின் இயல்பான இடங்களுக்கேற்ப [a], [c], [b] என அமைந்துள்ளது.
