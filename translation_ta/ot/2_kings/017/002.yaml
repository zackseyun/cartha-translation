  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமை செய்தான்; ஆனாலும்[a], அவனுக்கு முன் இருந்த இஸ்ரவேல் அரசர்களைப் போல அவன் தீமை செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மட்டும்—அவனுக்கு முன் இருந்த இஸ்ரவேல் அரசர்களைப் போல அவன் தீமை செய்யவில்லை.” எபிரேயச் சொல் இன்னும் நேரடியாக “மட்டும்” என மொழிபெயர்க்கப்படலாம்; இங்கு அது முந்தைய தீர்ப்பைத் தகுதிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: வினையடை பெயர்ச்சொல்லாகப் பயன்படும் הָרַע என்பதைக் ‘தீமையானது’ என்ற இயல்பான தமிழில் வழங்கி, wayyiqtol வினையைத் தொடர்கதைச் செயலாக மொழிபெயர்க்கிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: எபிரேய மொழியின் ‘கண்களில்’ என்ற மதிப்பீட்டு மரபுத்தொடரின் பொருளைத் தெளிவான, இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரை நவீன தமிழில் ஒலிபெயர்க்கிறது.
- source_word: רַק
  choice: ஆனாலும்
  rationale: முந்தைய எதிர்மறை மதிப்பீட்டுக்குப் பின்வரும் தணிப்பான ஒப்பீட்டை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; ‘மட்டும்’ என்ற நேரடி பொருளும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்களைப் போல் அல்ல
  rationale: மறுப்புடன் வரும் ஒப்புமையைத் தமிழில் தெளிவாகவும் மூல அமைப்புக்கு நெருக்கமாகவும் தருகிறது.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: அவனுக்கு முன்பிருந்த
  rationale: முன்னர் ஆட்சி செய்த அரசர்களைக் குறிக்கும் எபிரேய காலநிலை மரபுத்தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ராஜாவைப் பற்றிய மதிப்பீட்டில் רַק தரும் தணிப்பு
  choice: ஆனாலும்
  alternative: மட்டும்; தவிர
  rationale: அவன் தீமை செய்தான் என்ற தீர்ப்பை நீக்காமல், முந்தைய இஸ்ரவேல் அரசர்களுடனான ஒப்பீட்டில் ஒரு வரம்பைச் சேர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரச வரலாற்றின் மதிப்பீட்டு நடைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. ‘பார்வையில்’ என்பது மூல உருவகத்தின் பொருளைக் காக்கிறது; ‘ஆனாலும்’ வாக்கியத்தின் எதிர்மறைத் திருப்பத்தை இயல்பாக்குகிறது.
