source:
  edition: WLC
  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: ta
  text: நான் உங்களோடு செய்த உடன்படிக்கையை[a] நீங்கள் மறக்கக் கூடாது[b]; வேறு தெய்வங்களுக்குப் பயப்படவும் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘நான் உங்களோடு வெட்டிய உடன்படிக்கை.’ ‘உடன்படிக்கை செய்தல்’ என்பது தமிழில் இயல்பாக அதன் பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மறக்காதீர்கள்; வேறு தெய்வங்களுக்குப் பயப்படாதீர்கள்.’ எபிரெய வடிவத்தைத் தடைக் கட்டளையாக இருவிதமான தமிழ் நடையிலும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: உடன்படிக்கை
  rationale: இச்சொல் கடவுள் ஏற்படுத்திய கட்டுப்பாடுள்ள உறவைக் குறிக்கும் உடன்படிக்கைச் சூழலில் வருகிறது; பொதுவான ‘ஒப்பந்தம்’ என்பதைவிட ‘உடன்படிக்கை’ அதன் முறையான இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: நான் உங்களோடு செய்த
  rationale: எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘உங்களோடு வெட்டிய’ என்ற உடன்படிக்கை ஏற்படுத்தும் மரபுத்தொடர் உள்ளது. அதன் பொருளை இயல்பான தமிழில் ‘உங்களோடு செய்த’ என வழங்குவது தெளிவாக உள்ளது.
- source_word: לֹא תִשְׁכָּחוּ
  choice: நீங்கள் மறக்கக் கூடாது
  rationale: לֹא உடன் வரும் இவ்வினைவடிவம் இங்கு தடையையும் கட்டளையையும் தெரிவிக்கிறது. ‘மறக்கக் கூடாது’ என்பது நவீன தமிழில் இயல்பாகவும் கட்டளையின் வலிமையுடனும் உள்ளது.
- source_word: וְלֹא תִירְאוּ
  choice: பயப்படவும் கூடாது
  rationale: יָרֵא என்பது சூழலின்படி பயப்படுதல் அல்லது பயபக்தி காட்டுதல் எனப் பொருள்படும். ‘பயப்படுதல்’ என்பது மூலத்தின் சொற்பொருளையும், வேறு தெய்வங்களுக்கு மதச்சார்ந்த விசுவாசம் செலுத்தும் உடன்படிக்கைப் பின்னணியையும் அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: இஸ்ரவேலின் கடவுளைத் தவிர்ந்த தெய்வங்களைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடருக்கு ‘வேறு தெய்வங்கள்’ நேரடியான, இயல்பான இணையாகும்.
theological_decisions:
- issue: உடன்படிக்கை மரபுத்தொடரும் தடைக் கட்டளையின் தொனியும்
  choice: ‘நான் உங்களோடு செய்த உடன்படிக்கையை நீங்கள் மறக்கக் கூடாது; வேறு தெய்வங்களுக்குப் பயப்படவும் கூடாது’ என்று உடன்படிக்கை சார்ந்த அறிவுறுத்தலாக மொழிபெயர்த்தல்.
  alternative: ‘மறக்காதீர்கள்; பயப்படாதீர்கள்’ என்ற நேரடி ஏவல் வடிவைப் பயன்படுத்துதல்; அல்லது ירא என்பதை ‘வணங்குதல்/பயபக்தி காட்டுதல்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை உடன்படிக்கையை நினைவில் வைக்கவும் வேறு தெய்வங்களுக்கு அஞ்சாதிருக்கவும் தடைக் கட்டளைகளை அளிக்கிறது. ‘உடன்படிக்கை’ மற்றும் ‘பயப்படுதல்’ என்பவற்றைத் தக்கவைப்பது, இங்கு வெறும் உணர்ச்சிசார் பயமா அல்லது வழிபாடா என்பதைத் தீர்மானித்து விடாமல், கர்த்தருக்கே உரிய விசுவாசத்தின் இறையியல் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட நடை. ‘உங்களோடு’ என்பது உறவை இயல்பாகக் காட்டுகிறது; ‘கூடாது’ என்ற இணையான தடைவடிவம் இரண்டு கட்டளைகளையும் ஒன்றிணைக்கிறது. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
