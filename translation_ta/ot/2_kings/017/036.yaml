  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: ta
  text: மாறாக[a], மிகுந்த வல்லமையினாலும் நீட்டப்பட்ட புயத்தினாலும் உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த யாவேவுக்கே நீங்கள் பயப்பட வேண்டும்[b]; அவருக்கே பணிந்து வணங்க வேண்டும்; அவருக்கே பலியிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாறாக’ என்பதற்கு ‘ஆனால்’ அல்லது ‘அப்படியல்ல; ...’ என்றும் மொழிபெயர்க்கலாம். பிற தெய்வங்களுக்கு எதிராக யாவே ஒருவரையே இத்தொடர் முன்னிறுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: இங்கே ‘பயப்படுதல்’ என்பது வெறும் திகிலைக் குறிப்பதல்ல; பயபக்தியையும் உடன்படிக்கைக்கான உண்மைத்தன்மையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் பிற தெய்வங்களுக்குப் பயப்படக்கூடாது என்று கூறப்பட்டதற்கு எதிரான நேர்மறை மாற்றை இந்த எபிரெயச் சொற்றொடர் அறிமுகப்படுத்துகிறது. ‘மாறாக’ என்பது அந்த வேறுபாட்டை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הֶעֱלָה
  choice: வெளியே கொண்டுவந்த
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘மேலே கொண்டுவந்த’ என்று பொருள்படலாம்; யாத்திராகமச் சூழலில் எகிப்திலிருந்து விடுவித்துக் கொண்டுவந்த செயலை இயல்பான தமிழில் ‘வெளியே கொண்டுவந்த’ என்பது தெரிவிக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து நாடு’ என்ற முழுச் சொற்றொடரையும் அதன் யாத்திராகம நினைவொலியையும் தக்கவைக்கிறது.
- source_word: בְּכֹחַ גָּדוֹל
  choice: மிகுந்த வல்லமையினால்
  rationale: בְּ என்ற முன்னொட்டின் கருவிப்பொருளையும் தேவனுடைய மாபெரும் ஆற்றலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: நீட்டப்பட்ட புயத்தினால்
  rationale: தேவனுடைய வெளிப்படையான மீட்பு வல்லமையைக் குறிக்கும் யாத்திராகம உருவகத்தை அப்படியே தக்கவைக்கிறது.
- source_word: אֹתוֹ תִירָאוּ
  choice: யாவேவுக்கே நீங்கள் பயப்பட வேண்டும்
  rationale: முன்னிலைப்படுத்தப்பட்டுள்ள ‘அவரையே’ என்ற வலியுறுத்தலை ‘-க்கே’ மூலம் காட்டுகிறது; ירא என்பதிலுள்ள பயம், பயபக்தி, உடன்படிக்கை விசுவாசம் ஆகிய பதற்றங்களை ‘பயப்பட’ என்பதன் மூலம் தக்கவைக்கிறது.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: அவருக்கே பணிந்து வணங்க வேண்டும்
  rationale: விழுந்து பணிதல் அல்லது தாழ்ந்து வணங்குதல் என்ற உடல் சார்ந்த ஆராதனைப் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; לֹו என்பதன் வலியுறுத்தலை ‘அவருக்கே’ தக்கவைக்கிறது.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: அவருக்கே பலியிட வேண்டும்
  rationale: זבח என்பதன் பலிசெலுத்தும் பொருளையும் பலி யாருக்குச் செலுத்தப்பட வேண்டும் என்ற எபிரெய வலியுறுத்தலையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தேவனுடைய தனிப்பட்ட பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரைப் பதிலாக வைக்காமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: உடன்படிக்கை ஆராதனைச் சூழலில் ירא என்பதன் பொருள்
  choice: பயப்பட வேண்டும்
  alternative: பயபக்தி கொள்ள வேண்டும் / போற்ற வேண்டும்
  rationale: இங்கு வெறும் அச்சம் மட்டுமல்லாமல் பயபக்தியும் உடன்படிக்கை விசுவாசமும் உட்பட்டுள்ளன. இருந்தாலும், அந்தப் பல அடுக்குப் பொருளை ஒரே விளக்கப் பொருளாகச் சுருக்காமல் மூலத்தின் இறையியல் அழுத்தத்தை ‘பயப்பட’ என்பது தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் மும்முறை வலியுறுத்தலை ‘யாவேவுக்கே / அவருக்கே / அவருக்கே’ என்று தக்கவைத்துள்ளது; யாத்திராகமப் படிமமான ‘நீட்டப்பட்ட புயம்’ விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
