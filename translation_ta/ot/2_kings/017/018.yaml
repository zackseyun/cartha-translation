  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: ta
  text: அதனால், யாவே இஸ்ரவேல்மீது மிகவும் கோபமுற்று, அவர்களைத் தமது முகத்துக்கு முன்னிலையிலிருந்து அகற்றினார்[a]. யூதா கோத்திரம் மட்டுமே தனித்து எஞ்சியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது முன்னிலையிலிருந்து.” எபிரெயில் இன்னும் சொற்படியாக, “தமது முகத்துக்கு முன்னிலையிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: மிகவும் கோபங்கொண்டு
  rationale: התאנף என்ற வினை தீவிரமான கோபத்தைக் குறிக்கிறது; מְאֹד அதன் வலிமையை அதிகரிக்கிறது. இவ்விரண்டையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எபிரெய் எழுத்துகளை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேல்மீது
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் வரும் ב, கோபம் யாரை நோக்கியது என்பதைக் குறிக்கிறது; ‘இஸ்ரவேல்மீது’ என்பது இயல்பான தமிழாக்கம்.
- source_word: וַיְסִרֵם
  choice: அவர்களை ... அகற்றினார்
  rationale: הסיר என்பதன் காரணவினைப் பொருளான ‘விலக்குதல்/அகற்றுதல்’ என்பதைத் தக்கவைக்கிறது; நாடுகடத்தல் என்ற சூழல் கருத்தை வினைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: מֵעַל פָּנָיו
  choice: தமது முகத்திற்கு முன்பாக இருந்து
  rationale: எபிரெயிலுள்ள ‘அவருடைய முகத்திற்கு முன்பாக இருந்து’ என்ற உருவகமிக்க நேரடிப் படிமத்தைப் பாதுகாக்கிறது. ஒரே எழுவாயைச் சுட்டும் மரியாதைத் தற்சுட்டுப் பெயராக ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא נִשְׁאַר רַק
  choice: மட்டுமே ... மீந்திருந்தது
  rationale: எதிர்மறை வாக்கியத்துக்குப் பின் வரும் רַק விதிவிலக்கையும் தனித்த மீதியையும் குறிக்கிறது; தமிழில் ‘மட்டுமே’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: யூதா கோத்திரம் மட்டுமே தனியாக
  rationale: שֵׁבֶט என்பதை ‘கோத்திரம்’ என்றும் לְבַדּוֹ தரும் வலியுறுத்தலை ‘தனியாக’ என்றும் வழங்கி, மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: מֵעַל פָּנָיו என்பதில் இறைவனுடைய முகத்தைச் சுட்டும் மனித உருவக மொழி
  choice: தமது முகத்திற்கு முன்பாக இருந்து
  alternative: தமது முன்னிலையிலிருந்து
  rationale: மூலத்தின் தெளிவான ‘முகம்’ என்ற படிமத்தையும் அதன் உடன்படிக்கை சார்ந்த நெருக்கத்தையும் முதன்மை உரை பாதுகாக்கிறது; இயல்பான கருத்துமொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இவ்வசனத்தில் ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: வரலாற்றுச் சூழலில் தீர்ப்புக்குள்ளான இஸ்ரவேலை விரிவுரை இன்றி அப்படியே வைத்தல்
  alternative: வடக்கு ராஜ்யம் என்று உரைக்குள் வெளிப்படையாக விரித்தல்
  rationale: அதிகாரத்தின் சூழல் வடக்கு ராஜ்யத்தைக் குறித்தாலும், வசனத்தின் சொல் ‘இஸ்ரவேல்’ என்பதே. மொழிபெயர்ப்பு அதைத் தக்கவைத்து, மூலத்தில் இல்லாத விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதே நேரத்தில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘முகத்திற்கு முன்பாக’ என்ற எபிரெய் படிமம் திட்டமிட்டு முதன்மை உரையில் வைக்கப்பட்டு, மென்மையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
