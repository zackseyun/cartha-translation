base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: ta
  text: ஆகவே, இந்த மக்களோ யாவேக்கு அஞ்சினார்கள்; ஆனாலும் தங்கள் செதுக்கப்பட்ட உருவங்களை வழிபட்டு வந்தார்கள்.[a] அவர்களுடைய பிள்ளைகளும் அவர்களுடைய பிள்ளைகளின் பிள்ளைகளும், அவர்களுடைய தந்தையர் செய்ததுபோல, இன்றுவரை அவ்வாறே செய்து வருகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதுக்கப்பட்ட உருவங்கள்’ என்பதற்கு ‘விக்கிரகங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாகச் செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ஆகவே, ... பயந்தார்கள்
  rationale: வாவ் தொடர்ச்சியுருபு இப்பகுதியின் முடிவில் விளைவு அல்லது தொகுப்பைக் குறிக்கிறது; ‘ஆகவே’ அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த இனத்தவர்கள்
  rationale: சமாரியாவில் குடியேற்றப்பட்ட அயலின மக்களைக் குறிக்கும் சூழலில், ‘இனத்தவர்கள்’ என்பது ‘நாடுகள்’ என்பதைவிட இயல்பாக மக்களையே சுட்டுகிறது.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: யாவேக்குப் பயந்தார்கள்
  rationale: யாவேக்கு அஞ்சுதல் அல்லது அவரை மதித்து நடத்தல் என்ற சமயப் பொருளுடைய எபிரெய மரபுத்தொடரைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: அதேவேளையில் தாங்கள் செதுக்கி வைத்திருந்த உருவங்களையும்
  rationale: פְּסִילִים என்பது செதுக்கி உண்டாக்கப்பட்ட வழிபாட்டு உருவங்களைக் குறிக்கிறது. ‘அதேவேளையில்’ இரு முரண்பட்ட நடைமுறைகள் ஒன்றாக இருந்ததைத் தெளிவாக்கினாலும், அவற்றின் இறையியல் தன்மையைத் தீர்மானிப்பதில்லை.
- source_word: הָיוּ עֹבְדִים
  choice: வழிபட்டு வந்தார்கள்
  rationale: எபிரெய சுற்றுவழி வினையமைப்பு தொடர்ச்சியான, வழக்கமான செயலைக் காட்டுகிறது. உயிரற்ற வழிபாட்டு உருவங்களுக்குச் செய்யப்படும் சமயச் சேவையை இயல்பான தமிழில் ‘வழிபட்டு வந்தார்கள்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகளும் அவர்களுடைய பிள்ளைகளின் பிள்ளைகளும்
  rationale: தலைமுறைத் தொடர்ச்சியைச் சுட்டும் எபிரெயச் சொல்லமைப்பை உள்ளடக்கமான, எளிய தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: தங்கள் முன்னோர்கள் செய்தபடியே
  rationale: אָבוֹת இங்கு முந்தைய தலைமுறையினரைக் குறிக்கிறது; ‘முன்னோர்கள்’ தற்போதைய தமிழில் அந்த மரபுவழிப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: הֵם עֹשִׂים עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை செய்துவருகிறார்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் செயற்பொருளையும், ‘இந்த நாள்வரை’ என்ற காலக் குறிப்பையும் சுருக்கமான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாவேக்குப் பயப்படுதலும் செதுக்கப்பட்ட உருவங்களை வழிபடுதலும் ஒன்றாகக் கூறப்படுவது
  choice: ‘யாவேக்குப் பயந்தார்கள்; அதேவேளையில் ... உருவங்களையும் வழிபட்டு வந்தார்கள்’ என்று இரு கூற்றுகளும் இணையாக வைக்கப்பட்டுள்ளன.
  alternative: அவர்கள் யாவேக்குப் பயப்படுவதாக நடித்தார்கள்; அல்லது அவர்கள் யாவேயையும் உருவங்களையும் சமமாக வழிபட்டார்கள் என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: அவர்களுடைய பயம் உண்மையானதா, வெளிவேடமா, அல்லது கலப்புவழிபாடா என்பதை எபிரெய உரை இங்கே வெளிப்படையாகத் தீர்மானிப்பதில்லை. ஆகவே அந்த இறையியல் இறுக்கம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தலைமுறைத் தொடர்ச்சியும் நீடித்த செயலும் தெளிவாக இருக்க ‘பிள்ளைகளின் பிள்ளைகள்’, ‘செய்துவருகிறார்கள்’ ஆகிய வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘செதுக்கி வைத்திருந்த உருவங்கள்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
