base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: ta
  text: அவர்கள் யாவேக்கு பயபக்தி கொண்டிருந்தார்கள்; ஆயினும், அங்கிருந்து நாடுகடத்திக் கொண்டு வரப்பட்ட மக்களினங்களின் வழக்கத்தின்படி தங்கள் தெய்வங்களுக்குப் பணிவிடை செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இவ்விரு செயல்களும் எளிய ‘மற்றும்’ என்ற இணைப்புச்சொல்லால் இணைக்கப்பட்டுள்ளன: “அவர்கள் யாவேக்கு பயபக்தி கொண்டிருந்தார்கள்; தங்கள் தெய்வங்களுக்குப் பணிவிடை செய்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָיוּ יְרֵאִים
  choice: பயபக்தியாயிருந்தார்கள்
  rationale: היה + பங்கேற்புவினை காட்டும் தொடர்ச்சியான அல்லது வழக்கமான நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறைவனை நோக்கிய அச்சமும் மதிப்பும் இணைந்த பொருளையும் காக்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வங்கள்
  rationale: உடைமைப் பின்னொட்டின் பொருளை நேரடியாகக் காக்கிறது; ‘சொந்த’ என்று கூடுதல் வலியுறுத்தல் சேர்க்கவில்லை.
- source_word: הָיוּ עֹבְדִים
  choice: பணிவிடை செய்தார்கள்
  rationale: தெய்வத்தைச் சார்ந்த עבד என்பதன் வழிபாட்டு சேவை என்ற கருத்தைக் காக்கிறது; ‘வழிபட்டார்கள்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் சேவை நிழலைப் பேணுகிறது.
- source_word: כְּמִשְׁפַּט
  choice: வழக்கத்தின்படி
  rationale: இங்கு சட்டத் தீர்ப்பை அல்ல, நிலைபெற்ற சமய நடைமுறையைச் சுட்டுகிறது.
- source_word: הַגּוֹיִם
  choice: நாடுகள்
  rationale: வரலாற்றுச் சூழலில் பல்வேறு மக்கள்-நாடுகளைக் குறிக்கும் இயல்பான நேரடி இணை.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: தாங்கள் நாடுகடத்தப்பட்டு வந்த
  rationale: செய்பவர் குறிப்பிடப்படாத எபிரெயச் சொல்லமைப்பைத் தமிழில் இயல்பான செயப்பாட்டு வடிவில் தருகிறது; ‘வந்த’ என்பது அவர்கள் இடம்பெயர்க்கப்பட்ட மூலநாடுகளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: யெகோவாவுக்குப் பயபக்தியாயிருத்தலும் பிற தெய்வங்களுக்குப் பணிவிடை செய்தலும் இடையிலான தொடர்பு
  choice: ‘அதேவேளையில்’ என மொழிபெயர்த்து, ஒரே நேரத்தில் நடந்த முரண்பட்ட சமய நடைமுறையை வெளிப்படுத்துதல்
  alternative: எபிரெய இணைப்புச்சொல்லை நேரடியாக ‘மேலும்/மற்றும்’ என்று மொழிபெயர்த்தல்
  rationale: וְ என்பது அடிப்படையில் ‘மற்றும்’; ஆயினும் சூழல் சமயக் கலப்பையும் உள்ளார்ந்த முரண்பாட்டையும் காட்டுகிறது. ‘ஆனால்’ என்று முழுமையான எதிர்மறைத் தொடர்பைத் திணிக்காமல், ‘அதேவேளையில்’ ஒருங்குநிகழ்வையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. ‘பயபக்தி’ மற்றும் ‘பணிவிடை’ ஆகியவை சமயச் சூழலைத் தெளிவாகவும் மூலத்தின் சொற்பொருள் நிழல்களோடும் தருகின்றன.
