  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: ta
  text: 'அப்போது அசீரிய அரசன் கட்டளையிட்டான்: “நீங்கள் அங்கிருந்து நாடுகடத்திய ஆசாரியர்களில் ஒருவனை அங்கே அனுப்புங்கள்.[a] அவன் அங்குச் சென்று குடியிருக்கட்டும்.[b] அந்நாட்டின் தெய்வத்திற்குரிய முறைமையை அவர்களுக்குக் கற்பிக்கட்டும்.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அங்கே கொண்டுபோங்கள்” அல்லது “அங்கே அழைத்துச் செல்லுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவன் அங்குச் சென்று குடியிருக்கட்டும்” என்பதற்கான எபிரெய வினைகள் பன்மையில், அதாவது “அவர்கள் சென்று குடியிருக்கட்டும்” என்று உள்ளன. ஆனால் “ஆசாரியர்களில் ஒருவன்” என்பதும், அடுத்து வரும் “அவன் கற்பிக்கட்டும்” என்ற ஒருமை வினையும் கருத்து ஒருமை என்பதைச் சுட்டுகின்றன.
    reason: textual_variant
  - marker: c
    text: “அந்நாட்டின் தேவனுக்குரிய சட்டத்தை” அல்லது “தேவையை” என்றும் மொழிபெயர்க்கலாம். “தெய்வம்” என்பது அசீரிய அரசனின் கண்ணோட்டத்தைப் பிரதிபலிக்கிறது; “தேவன்” என்பதும் சாத்தியமான வாசிப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் அரசாணைக்குரிய வலிமையை ‘கட்டளையிட்டான்’ துல்லியமாகக் காட்டுகிறது; לֵאמֹר உடன் இயல்பான தமிழ் தொடராக அமைக்கப்பட்டது.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: அங்கே அனுப்புங்கள்
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் ‘போகச் செய்/கொண்டுபோ/அனுப்பு’ எனப் பொருள்படலாம். அரசன் ஒருவரை இடமாற்றும்படி ஆணையிடும் சூழலில் ‘அனுப்புங்கள்’ இயல்பாக உள்ளது; திசை சார்ந்த பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: ஆசாரியர்களில் ஒருவனை
  rationale: பகுதிப்பொருள் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: நீங்கள் அங்கிருந்து நாடுகடத்திய
  rationale: גלה ஹிஃபில் வடிவத்தின் வலுக்கட்டாய வெளியேற்றம்/சிறைப்பிடித்து இடம்பெயர்த்தல் என்ற பொருளை ‘நாடுகடத்திய’ தெளிவாகத் தருகிறது.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: அவன் அங்குச் சென்று குடியிருந்து
  rationale: எபிரெய வடிவங்கள் பன்மையில் இருந்தாலும், முன்னிலைச் சொல் ‘ஒருவன்’ என்பதும் அடுத்த வினை ஒருமையில் இருப்பதும் கருத்து ஒருமை என்பதைச் சுட்டுகின்றன. வாசிக்க இயல்பாக ஒருமை பயன்படுத்தப்பட்டு, வடிவ வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וְיֹרֵם
  choice: அவர்களுக்குக் கற்பிக்கட்டும்
  rationale: ירה ஹிஃபில் வடிவத்தின் ‘போதித்தல்/கற்பித்தல்’ பொருளையும், -ם என்ற பன்மை பொருட்சுட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: מִשְׁפַּט
  choice: முறைமை
  rationale: இங்கு குறுகிய சட்டவிதியை மட்டும் அல்லாமல், அந்நாட்டு தெய்வத்திற்கு உரியதாகக் கருதப்பட்ட வழிபாட்டு நெறி அல்லது கடைப்பிடிப்பைக் குறிக்கிறது. ‘முறைமை’ இந்த விரிந்த நடைமுறைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: அந்நாட்டின் தெய்வம்
  rationale: அசீரிய அரசனின் பிரதேசத் தெய்வக் கண்ணோட்டத்தைப் பிரதிபலிக்கிறது; உரையாளர் நிலையில் இது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ என்பதைக் ‘தெய்வம்’ அல்லது ‘தேவன்’ என வழங்குதல்
  choice: அந்நாட்டின் தெய்வம்
  alternative: அந்நாட்டின் தேவன்
  rationale: பேசுகிற அசீரிய அரசனின் பிரதேசத் தெய்வக் கருத்தை ‘தெய்வம்’ பாதுகாக்கிறது. அதேவேளையில், சூழலில் இச்சொல் இஸ்ரவேலின் தேவனைக் குறிக்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: וְיֵלְכוּ / וְיֵשְׁבוּ ஆகிய பன்மை வினைகளுக்கும் ‘ஒரு ஆசாரியன்’ என்ற ஒருமை முன்னிலைக்கும் இடையிலான பொருத்தமின்மை
  choice: 'கருத்தின்படி ஒருமை: ‘அவன் ... சென்று குடியிருந்து’'
  alternative: 'வடிவத்தைப் பின்பற்றி பன்மை: ‘அவர்கள் சென்று குடியிருக்கட்டும்’'
  rationale: ‘ஆசாரியர்களில் ஒருவன்’ என்ற முன்னிலையும், தொடர்ந்து வரும் ஒருமை வினையான וְיֹרֵם என்பதும் ஒருமைக் கருத்தை உறுதிப்படுத்துகின்றன. எபிரெய வடிவத்தின் சிக்கல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘நாடுகடத்துதல்’, ‘முறைமை’ ஆகியவை சாதாரண வாசகருக்குப் புரியுமாறும் மூலத்தின் மத-அரசியல் சூழலைத் தக்கவைத்தும் தேர்ந்தெடுக்கப்பட்டன. எபிரெய எண்ணிக்கைப் பொருத்தமின்மையும் ‘தெய்வம்/தேவன்’ என்ற இறையியல் பதற்றமும் அடிக்குறிப்புகளில் மறைக்காமல் பாதுகாக்கப்பட்டுள்ளன.
