  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்கு காக்கப்பட்டுள்ளது: யாவே, இஸ்ரவேலும் யூதாவும், தீர்க்கதரிசி/தரிசனக்காரர் வேறுபாடு, தீய வழிகளிலிருந்து திரும்புதல், கட்டளைகள் மற்றும் நியமங்கள், சட்டம், முன்னோர்கள், தீர்க்கதரிசிகள் வழியிலான அனுப்புதல் ஆகியவை இடம்பெற்றுள்ளன. எனினும், “கடுமையாக” என்பது எபிரேய வினைச்சொல்லில் வெளிப்படையாக இல்லாத தீவிரத்தைச் சேர்க்கிறது; எளிய “எச்சரித்தார்” மூலத்தின் எச்சரிக்கை/சாட்சிய நுணுக்கத்தைச் சேர்க்காமல் பாதுகாக்கிறது.'
