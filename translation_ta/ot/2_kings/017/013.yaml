  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: ta
  text: ஆனாலும், யாவே இஸ்ரவேலையும் யூதாவையும் தம்முடைய தீர்க்கதரிசிகள் ஒவ்வொருவர் மூலமாகவும், தரிசனக்காரர்கள் ஒவ்வொருவர் மூலமாகவும் எச்சரித்து[a], “உங்கள் தீய வழிகளைவிட்டுத் திரும்பி, என் கட்டளைகளையும் என் நியமங்களையும், நான் உங்கள் முன்னோர்களுக்கு[b] கட்டளையிட்டதும் என் ஊழியர்களான தீர்க்கதரிசிகள் மூலம்[c] உங்களிடம் அனுப்பியதுமான முழுச் சட்டத்தின்படி, கடைப்பிடியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலுக்கும் யூதாவுக்கும் எதிராகச் சாட்சியளித்து.” ஹிப்ரு வினைச்சொல் வலியுறுத்திய எச்சரிப்பு அல்லது சாட்சி என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “உங்கள் தந்தையருக்கு”; இங்கு முந்தைய தலைமுறையினரான முன்னோர்கள் குறிக்கப்படுகின்றனர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என் ஊழியர்களான தீர்க்கதரிசிகள் வழியாக.” ஹிப்ருவில் நேரடியாக, “கையால்” என்ற கருவிப்பொருள் மொழிவழக்கு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: கடுமையாக எச்சரித்து
  rationale: ஹிப்ரு வினைச்சொல் சாட்சியளித்தல் அல்லது வலியுறுத்தி எச்சரித்தல் என்ற பொருள்களைக் கொள்ளலாம். தொடர்ந்து வரும் நேரடி அழைப்பும் பரந்த சூழலிலுள்ள நியாயத்தீர்ப்பும் இங்கு கடுமையான எச்சரிப்பைச் சுட்டுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בְּיַד כָּל נביאו כָל חֹזֶה
  choice: தமது தீர்க்கதரிசிகள் ஒவ்வொருவர் மூலமாகவும் தரிசனக்காரர் ஒவ்வொருவர் மூலமாகவும்
  rationale: ביד என்பதன் கருவிப்பொருளை ‘மூலமாக’ எனவும், இருமுறை வரும் כָּל என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொருவர்’ எனவும் காக்கிறது; חֹזֶה என்பதைத் தீர்க்கதரிசி என்ற சொல்லோடு ஒன்றாக்காமல் ‘தரிசனக்காரர்’ என வேறுபடுத்துகிறது.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: உங்கள் தீய வழிகளைவிட்டுத் திரும்பி
  rationale: שׁוּב என்பதன் நேரடியான ‘திரும்புதல்’ உருவகத்தையும், דֶּרֶךְ என்பதன் ஒழுக்க வாழ்வைக் குறிக்கும் ‘வழி’ உருவகத்தையும் காக்கிறது.
- source_word: וְשִׁמְרוּ
  choice: கடைப்பிடியுங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் שׁמר என்பது கட்டளைகளைக் கவனமாகப் பின்பற்றுவதைக் குறிக்கிறது; நவீன தமிழில் ‘கடைப்பிடியுங்கள்’ இயல்பாக உள்ளது.
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: என் கட்டளைகளையும் என் நியமங்களையும்
  rationale: இரண்டு தனித்த சட்டச் சொற்களையும் ஒன்றாகச் சுருக்காமல் வேறுபடுத்திக் காட்டுகிறது.
- source_word: כְּכָל הַתּוֹרָה
  choice: முழுச் சட்டத்தின்படி
  rationale: இச்சட்ட மற்றும் உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதற்கு ‘சட்டம்’ பொருத்தமானது; כָּל என்பதன் முழுமையையும் ‘முழு’ வெளிப்படுத்துகிறது.
- source_word: אֲבֹתֵיכֶם
  choice: உங்கள் முன்னோர்களுக்கு
  rationale: இங்கு אָבוֹת என்பது உடன்படிக்கை வரலாற்றில் முந்தைய தலைமுறையினரைக் குறிக்கிறது; ‘முன்னோர்கள்’ நவீன தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: என் ஊழியர்களான தீர்க்கதரிசிகள் மூலம்
  rationale: ביד என்ற ஹிப்ரு மொழிவழக்கின் கருவிப்பொருளை இயல்பான தமிழில் தருவதோடு, ‘ஊழியர்கள்’ மற்றும் ‘தீர்க்கதரிசிகள்’ இடையிலான விளக்க உறவையும் காக்கிறது.
theological_decisions:
- issue: ‘உங்களிடம் அனுப்பிய’ என்ற தொடர்புச் சொற்றொடரின் குறிப்பு
  choice: அது முன்பு சொல்லப்பட்ட முழுச் சட்டம் அல்லது உடன்படிக்கைப் போதனையோடு இலக்கண ரீதியாக இணைக்கப்பட்டுள்ளது.
  alternative: அது தீர்க்கதரிசிகளின் செய்திகளைப் பொதுவாகவோ, ‘திரும்பி... கடைப்பிடியுங்கள்’ என்ற முழு அழைப்பையோ குறிக்கலாம்.
  rationale: ஹிப்ரு தொடரமைப்பில் சட்டத்துடனான இணைப்பு மிக இயல்பானது. அதே நேரத்தில் தீர்க்கதரிசிகள் வழியாக மறுபடியும் அறிவிக்கப்பட்ட உடன்படிக்கைச் செய்தி என்ற விரிவான நுணுக்கத்தை மொழிபெயர்ப்பு முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வரலாற்று-உடன்படிக்கை நடையைக் கடைப்பிடிக்கிறது. ‘யாவே’ என்ற தனிப்பெயர் காக்கப்பட்டுள்ளது; ‘தீர்க்கதரிசி’ மற்றும் ‘தரிசனக்காரர்’ என்ற வேறுபட்ட பதவிச் சொற்கள் ஒன்றாக்கப்படவில்லை. நேரடி உரையின் கட்டளைத் தொனியும் மூலத்தின் நீண்ட தொடர்புச் சொற்றொடரும் வாசிக்கத்தக்க தமிழில் பாதுகாக்கப்பட்டுள்ளன.
