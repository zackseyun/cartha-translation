  rationale: மூலத்தில் இல்லாத “கடுமையாக” நீக்கப்பட்டது. தீர்க்கதரிசிகள் மற்றும் தரிசனக்காரர்கள் தொடர்பான பகிர்ந்தளிக்கும் அமைப்பு தமிழில் இயல்பாக மறுசீரமைக்கப்பட்டது. கட்டளைகளையும் நியமங்களையும் கடைப்பிடிக்க வேண்டும் என்பதையும், அது முழுச் சட்டத்தின்படி என்பதையும் மூலத்தின் வரிசைக்கு நெருக்கமாக அமைத்தோம். தொடர்புச் சொற்றொடரின் சட்டத்தைச் சுட்டும் இயல்பான குறிப்பு மாற்றப்படவில்லை.
