  revised_text: ஆனாலும், யாவே இஸ்ரவேலையும் யூதாவையும் தம்முடைய தீர்க்கதரிசிகள் ஒவ்வொருவர் மூலமாகவும், தரிசனக்காரர்கள் ஒவ்வொருவர் மூலமாகவும் எச்சரித்து[a], “உங்கள் தீய வழிகளைவிட்டுத் திரும்பி, என் கட்டளைகளையும் என் நியமங்களையும், நான் உங்கள் முன்னோர்களுக்கு[b] கட்டளையிட்டதும் என் ஊழியர்களான தீர்க்கதரிசிகள் மூலம்[c] உங்களிடம் அனுப்பியதுமான முழுச் சட்டத்தின்படி, கடைப்பிடியுங்கள்” என்றார்.
