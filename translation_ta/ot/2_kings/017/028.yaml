base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: ta
  text: அப்போது அவர்கள் சமாரியாவிலிருந்து நாடுகடத்தியிருந்த ஆசாரியர்களில் ஒருவன் வந்து பெத்தேலில் குடியிருந்தான். யாவேக்கு[a] எப்படி அஞ்ச வேண்டும் என்று அவன் அவர்களுக்குக் கற்பித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (தெய்வீகப் பெயர்); மரபாக ‘கர்த்தர்’ என வழங்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் மூல வடிவத்தையும் மரபான தமிழ் வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: வாவ் தொடர் வடிவம் நிகழ்ச்சிகளின் தொடர்ச்சியை முன்னெடுக்கிறது; நவீன தமிழ் கதைநடையில் ‘அப்போது’ அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: ஆசாரியர்களில் ஒருவன்
  rationale: பல ஆசாரியர்களிலிருந்து ஒருவரைக் குறிக்கும் எபிரெய மரபுத்தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: சமாரியாவிலிருந்து அவர்கள் நாடுகடத்தியிருந்த
  rationale: הגלה என்பதன் ஹிஃபில் வடிவம் நாடுகடத்துவதைக் குறிக்கிறது. வினையின் குறிப்பிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ எனத் தக்கவைத்துள்ளது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தான்
  rationale: இங்கு ישב என்பது ஓர் இடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது; ‘குடியிருந்தான்’ நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: இடப்பெயர் தமிழில் வழக்கமான ‘பெத்தேல்’ என ஒலிபெயர்க்கப்பட்டு, இடவேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: அவன் அவர்களுக்குக் கற்பித்தான்
  rationale: היה + நிகழ்காலப் பெயரெச்ச அமைப்பு தொடர்ச்சியான அல்லது வழக்கமான போதிக்கும் பணியைக் காட்டலாம்; தமிழ் கதைநடையில் எளிய இறந்தகாலம் இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֵיךְ יִירְאוּ
  choice: எப்படி அஞ்ச வேண்டும்
  rationale: இது அஞ்சும் முறையைப் பற்றிய போதனையைச் சொல்கிறது; ‘வேண்டும்’ என்பதால் அதன் போதனை சார்ந்த நெறிப்பொருள் வெளிப்படுகிறது.
- source_word: אֶת יְהוָה
  choice: யாவேக்கு
  rationale: தெய்வீகப் பெயரான יהוה ஒலிபெயர்க்கப்பட்டுள்ளது; ‘அஞ்சு’ வினையுடன் நவீன தமிழில் இயல்பாக வரும் நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதன் தனிப்பெயர் இயல்பு காக்கப்படுகிறது; மரபான பட்டப்பெயர் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘யாவேக்கு அஞ்சுதல்’ என்பதன் பொருள்
  choice: அஞ்ச வேண்டும்
  alternative: வழிபட வேண்டும் / பயபக்தியுடன் நடக்க வேண்டும்
  rationale: ירא என்ற சொல்லில் பயம், மரியாதை, பக்தி ஆகிய நுணுக்கங்கள் சூழலின்படி இருக்கலாம். அவற்றில் ஒன்றை மட்டும் தேர்ந்து பொருளைச் சுருக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் ‘அஞ்சுதல்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘சமாரியா’, ‘பெத்தேல்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
