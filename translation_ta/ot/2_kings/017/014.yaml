base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: ta
  text: ஆனால் அவர்கள் செவிகொடுக்கவில்லை; தங்கள் கழுத்தைத் தங்கள் முன்னோர்களின் கழுத்தைப் போல விறைப்பாக்கினார்கள். அந்த முன்னோர்கள் தங்கள் கடவுளாகிய யாவேமேல் நம்பிக்கை வைக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் கடவுளாகிய யாவேயை நம்பவில்லை.” எபிரெய வினைச்சொல் நம்புவதையோ, உடன்படிக்கை உறவில் நம்பிக்கை வைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: ஆனால் அவர்கள் செவிகொடுக்கவில்லை
  rationale: முந்தைய எச்சரிப்புகளுக்கு மாறான அவர்களது மறுப்பை וְלֹא வெளிப்படுத்துகிறது. שׁמע என்பதன் அடிப்படைப் பொருளான கேட்பதையும், இச்சூழலில் உள்ள கீழ்ப்படிய மறுக்கும் மனநிலையையும் ‘செவிகொடுக்கவில்லை’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: தங்கள் கழுத்தை ... விறைப்பாக்கினார்கள்
  rationale: קשׁה என்பதன் கடினமாக்குதல்/விறைப்பாக்குதல் என்ற பொருளையும், עֹרֶף உடன் வரும் எபிரெய உருவகத்தையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: தங்கள் முன்னோர்களின் கழுத்தைப் போல
  rationale: ஒப்பீடு முன்னோர்களின் நடத்தையோடு மட்டுமல்ல, அவர்களுடைய ‘கழுத்தோடு’ நேரடியாகச் செய்யப்படுவதால் மூலத்தின் உறுதியான உருவகம் தக்கவைக்கப்படுகிறது. אבות இங்கு இயல்பான நவீன தமிழில் ‘முன்னோர்கள்’ என வழங்கப்படுகிறது.
- source_word: לֹא הֶאֱמִינוּ בַּיהוָה
  choice: யாவேமேல் நம்பிக்கை வைக்கவில்லை
  rationale: אמן என்பதன் Hiphil வடிவம் בְּ உடன் ஒருவர்மேல் நம்பிக்கை அல்லது விசுவாசம் வைப்பதைக் குறிக்கிறது. ‘நம்பிக்கை வைக்கவில்லை’ என்பது உறவுசார் நம்புதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: யாவே அவர்களுடைய கடவுள் என்ற உடன்படிக்கை உறவைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: הֶאֱמִינוּ என்பதைக் ‘நம்புதல்’ அல்லது ‘நம்பிக்கை வைத்தல்’ என வழங்குதல்
  choice: நம்பிக்கை வைக்கவில்லை
  alternative: நம்பவில்லை
  rationale: בְּ உடன் வரும் אמן நம்புதல் மட்டுமன்றி ஒருவர்மேல் சார்ந்த நம்பிக்கை வைப்பதையும் குறிக்கக்கூடும். முதன்மை உரை அந்த உறவுசார் நுண்பொருளை வெளிப்படுத்துகிறது; சுருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘கழுத்தை விறைப்பாக்குதல்’ என்ற எபிரெய உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; தொடர்புப்பெயர் அமைப்பு தமிழில் குழப்பமளிக்காதபடி கடைசி கூற்று தனி வாக்கியமாக்கப்பட்டுள்ளது.
