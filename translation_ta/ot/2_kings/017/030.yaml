base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: ta
  text: பாபிலோனைச் சேர்ந்த ஆண்கள்[b] சுக்கோத்-பெனோத்தை[a]ச் செய்தார்கள்; கூத்தைச் சேர்ந்த ஆண்கள் நேர்கலைச் செய்தார்கள்; ஹமாத்தைச் சேர்ந்த ஆண்கள் அஷிமாவைச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சுக்கோத்-பெனோத் என்பது ஓர் அயல் தெய்வத்தின் அல்லது வழிபாட்டுப் பொருளின் பெயராக இருக்கலாம். பெயரின் பொருள் உறுதியாகத் தெரியாததால் அது மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “பாபிலோன் மக்கள் … கூத் மக்கள் … ஹமாத் மக்கள்.” எபிரெய மொழியில் ஒவ்வொரு முறையும் சொல்லர்த்தமாக “...ஐச் சேர்ந்த ஆண்கள்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: …ஐச் சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் ஆண்பால் பன்மைக் கட்டமைப்பு வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது. சூழலில் ‘…ஐச் சேர்ந்த மக்கள்’ என்ற கூட்டுப்பொருளும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: ‘செய்/உருவாக்கு’ என்ற வினையின் பொதுவான பொருளைத் தக்கவைக்கிறது; ‘நிறுவினார்கள்’ அல்லது ‘வழிபட்டார்கள்’ என்று சூழலை மிகுதியாக விளக்கவில்லை.
- source_word: סֻכּוֹת בְּנוֹת
  choice: சுக்கோத்-பெனோத்
  rationale: இது அயல் தெய்வத்தின் அல்லது வழிபாட்டுப் பொருளின் பெயராக இருக்கலாம்; சொற்பிறப்பும் துல்லியமான பொருளும் உறுதியற்றதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: כּוּת
  choice: கூத்
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: נֵרְגַל
  choice: நேர்கல்
  rationale: மெசொப்பொத்தாமிய தெய்வத்தின் பெயரை மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக வழங்குகிறது.
- source_word: חֲמָת
  choice: ஹமாத்
  rationale: இடப்பெயரைத் தமிழில் தெளிவாக அடையாளம் காணும் ஒலிபெயர்ப்பு.
- source_word: אֲשִׁימָא
  choice: அஷிமா
  rationale: அயல் தெய்வத்தின் பெயரை ஊகப் பொருள் ஏற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: עָשׂוּ என்பதன் நேரடிப் பொருட்களுடன் ‘சிலை’ அல்லது ‘தெய்வம்’ என்ற விளக்கச் சொல்லைச் சேர்ப்பதா?
  choice: பெயர்களை மட்டும் ஒலிபெயர்த்து, ‘சிலை/தெய்வம்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
  alternative: ‘சுக்கோத்-பெனோத் என்னும் சிலையைச் செய்தார்கள்’ அல்லது ‘சுக்கோத்-பெனோத்தைத் தங்கள் தெய்வமாக்கினார்கள்.’
  rationale: எபிரெய உரை ‘செய்தார்கள்’ என்பதையும் பெயர்களையும் மட்டுமே கூறுகிறது. ‘சிலை’ அல்லது ‘தெய்வம்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், உரையில் வெளிப்படையாக இல்லாததைச் சேர்த்து தெளிவின்மையைத் தீர்க்காமல் மூலத்தின் கட்டுப்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான வாக்கியக் கூறுகளும் மீட்டுருவாக்கப்பட்டுள்ளன; ஆண்பால் பன்மையின் வெளிப்படையான வடிவம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான கூட்டுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
