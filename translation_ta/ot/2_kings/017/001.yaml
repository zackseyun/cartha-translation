  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசன்’ என்பது பட்டத்திற்கும், ‘அரசாள/அரசாண்டான்’ என்பது செயற்பாட்டிற்கும் பயன்படுத்தப்பட்டதால் வாக்கியம் இயல்பாக உள்ளது.
