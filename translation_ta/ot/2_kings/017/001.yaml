  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆகாசின் ஆட்சியின் பன்னிரண்டாம் ஆண்டில், ஏலாவின் மகன் ஓசேயா சமாரியாவில் இஸ்ரவேலின்மேல் அரசாளத் தொடங்கினான்; அவன் ஒன்பது ஆண்டுகள் அரசாண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசாளத் தொடங்கி
  rationale: தொடக்கக் காலக் குறிப்புடன் வரும் எபிரெய வினையைத் தமிழில் இயல்பாகவும், ஆங்கில ஆலோசனை அடுக்கில் பாதுகாக்கப்பட்ட ‘began to reign’ என்ற நுணுக்கத்துடனும் வழங்குகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: ஆட்சியின் அதிகார எல்லையைக் குறிக்கும் עַל என்பதன் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: ஓசேயாவின் ஆட்சித் தலைமையிடத்தைக் குறிக்கும் இடவியல் சொற்றொடரைத் தெளிவாக வழங்குகிறது.
