source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: ta
  text: அசீரியாவின் அரசன் பாபிலோன், கூத்தா, அவ்வா[a], ஆமாத், செப்பர்வாயீம் ஆகிய இடங்களிலிருந்து மக்களைக் கொண்டுவந்து, இஸ்ரவேல் மக்களுக்குப் பதிலாக[b] சமாரியாவின் நகரங்களில் அவர்களைக் குடியேற்றினான். அவர்கள் சமாரியாவை உடைமையாக்கினார்கள்; அதன் நகரங்களில் வாழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவ்வா” என்பதை “ஆவ்வா” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்களுக்குப் பதிலாக”; அதாவது, இஸ்ரவேலருக்குப் பதிலாக.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: மக்களைக் கொண்டுவந்து
  rationale: בוא என்பதன் ஹிப்ஈல் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும். எபிரெய உரையில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், பட்டியலிடப்பட்ட இடங்களிலிருந்து குடியேற்றப்பட்ட மக்கள் என்பதைக் சூழல் தெளிவாக்குவதால் ‘மக்களை’ என்பது இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரியாவின் அரசன்
  rationale: எபிரெய இணைநிலைத் தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: பாபிலோன், கூத்தா, அவ்வா, ஆமாத், செப்பர்வாயீம் ஆகிய இடங்களிலிருந்து
  rationale: இவை இடப்பெயர்கள் என்பதால் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. ‘இடங்களிலிருந்து’ என்பது இவை அனைத்தும் மக்களின் பிறப்பிடங்கள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וַיֹּשֶׁב
  choice: அவர்களைக் குடியேற்றினான்
  rationale: ישׁב என்பதன் ஹிப்ஈல் வடிவத்திலுள்ள காரணவினைப் பொருளை, அரசன் அவர்களை அங்கு வாழச் செய்தான் என்ற வகையில் ‘குடியேற்றினான்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: சமாரியாவின் நகரங்களில்
  rationale: עָרֵי என்பது பன்மை என்பதால் ‘நகரங்கள்’ தக்கவைக்கப்பட்டது. இங்கு சமாரியா தலைநகரை மட்டும் அல்லாமல் அதன் பிரதேசத்தையும் குறிக்கிறது.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்குப் பதிலாக
  rationale: תַּחַת இங்கு ‘பதிலாக’ என்று பொருள்படும். בְּנֵי יִשְׂרָאֵל சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவையும் குறிக்கும் என்பதால் நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: அவர்கள் சமாரியாவைத் தங்கள் உடைமையாக்கிக்கொண்டு
  rationale: ירשׁ குடியேற்றம் அல்லது கைப்பற்றுதல் சார்ந்த சூழலில் ‘உடைமையாக்குதல்’ அல்லது ‘வசப்படுத்துதல்’ என்று பொருள்படும். ‘சுதந்தரித்தார்கள்’ என்பது இங்கு தேவையற்ற சட்ட அல்லது இறையியல் நிழற்பொருளை உருவாக்கக்கூடும்.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: அதன் நகரங்களில் வாழ்ந்தார்கள்
  rationale: ישׁב என்பதன் கால் வடிவம் இங்கு எளிய ‘வாழ்தல்/குடியிருத்தல்’ என்ற பொருளைக் கொண்டது. பெண்பால் ஒருமை பின்னொட்டு சமாரியாவைக் குறிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள இனப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய சொற்றொடர் இலக்கணரீதியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், சூழலில் ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் இனமக்கள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. ஆகவே பாலினத் துல்லியத்தையும் இயல்பான நவீன தமிழையும் காக்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் மதிப்புமிக்கதுமான உரைநடை பயன்படுத்தப்பட்டது. இடப்பெயர்களில் பரவலான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபு பின்பற்றப்பட்டது; காரணவினை வடிவங்களும் நகரங்கள் என்ற பன்மையும் வெளிப்படையாகக் காக்கப்பட்டன.
