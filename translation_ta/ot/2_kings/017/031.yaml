base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: ta
  text: அவ்வியர்[a] நிப்காஸையும் தர்த்தாக்கையும் செய்தார்கள்; செப்பர்வாயீமியரோ, செப்பர்வாயீமின் தெய்வங்களான அத்ரம்மெலேக்குக்கும் அனம்மெலேக்குக்கும் தங்கள் மகன்களை நெருப்பில் எரித்துவந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவ்வீம் மக்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இத்தெய்வங்களுக்குப் பலியாகத் தங்கள் மகன்களை நெருப்பில் எரித்தார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: அவ்வீமியர்
  rationale: இது ஒரு மக்கள் இனத்தைக் குறிக்கும் பன்மைப் பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: எபிரெய வினையின் நேரடியான பொருளைப் பேணுகிறது; வெளிப்படையாக இல்லாத ‘சிலைகள்’ அல்லது ‘உருவங்கள்’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: நிப்காசையும் தர்தாக்கையும்
  rationale: தெய்வங்களின் தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, இணை நேர்ச்செயப்படுபொருளாக வழங்கப்பட்டன.
- source_word: הַסְפַרְוִים
  choice: செப்பர்வாயீமியர்
  rationale: செப்பர்வாயீமைச் சேர்ந்த மக்களைக் குறிக்கும் இனப்பெயராக இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: שֹׂרְפִים
  choice: எரித்துவந்தார்கள்
  rationale: எபிரெயப் பெயரெச்ச வடிவம் காட்டும் தொடர்ச்சியான அல்லது வழக்கமான சமயச் செயலைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: தங்கள் மகன்களை நெருப்பில்
  rationale: בנים என்பதிலுள்ள ஆண்பால் குறிப்பை ‘மகன்கள்’ என்று பேணுகிறது; בָאֵשׁ என்பதற்கு இச்சூழலில் இயல்பான ‘நெருப்பில்’ பயன்படுத்தப்பட்டது.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: அத்ரம்மெலேக்குக்கும் அனம்மெலேக்குக்கும்
  rationale: לְ குறிக்கும் அர்ப்பணிப்பு அல்லது பெறுநர் உறவைத் தமிழ் நான்காம் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אלה ספרים
  choice: செப்பர்வாயீமின் தெய்வங்களான
  rationale: அத்ரம்மெலேக்கும் அனம்மெலேக்கும் செப்பர்வாயீமுடன் தொடர்புடைய தெய்வங்கள் என்று அடையாளப்படுத்தும் சார்பு அமைப்பைப் பேணுகிறது.
theological_decisions:
- issue: நிப்காசும் தர்தாக்கும் சிலைகள் அல்லது உருவங்கள் என்று முதன்மை உரையிலேயே வெளிப்படுத்த வேண்டுமா?
  choice: ‘நிப்காசையும் தர்தாக்கையும் செய்தார்கள்’ என்று மூலத்தின் சுருக்கமான வடிவைப் பேணுதல்
  alternative: ‘நிப்காசு, தர்தாக் ஆகியவற்றின் சிலைகளைச் செய்தார்கள்’
  rationale: எபிரெய உரை ‘செய்தார்கள்’ என்பதோடு பெயர்களை நேரடியாக இணைக்கிறது. வழிபாட்டு உருவங்கள் குறிக்கப்படலாம் என்றாலும், ‘சிலைகள்’ என்று சேர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
- issue: בְּנֵיהֶם என்பதைக் ‘பிள்ளைகள்’ என்று பொதுமைப்படுத்த வேண்டுமா?
  choice: ‘மகன்கள்’
  alternative: ‘பிள்ளைகள்’
  rationale: மூலச்சொல் இங்கு ஆண்பால் குறிப்புடையது; ஆகவே அந்தத் துல்லியம் பேணப்பட்டது.
- issue: שֹׂרְפִים என்பதைக் கடந்தகால ஒருமுறைச் செயலாகவா, வழக்கமான செயலாகவா தருவது?
  choice: ‘எரித்துவந்தார்கள்’
  alternative: ‘எரித்தார்கள்’
  rationale: பெயரெச்ச வடிவம் இப்பட்டியலில் தொடர்ச்சியான அல்லது வழக்கமான வழிபாட்டுச் செயலைக் குறிக்க இயலும்; அந்த நுணுக்கத்தைத் தமிழ் தொடர்நிலை வடிவம் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மக்கள் மற்றும் தெய்வப் பெயர்கள் எபிரெய வடிவங்களின் அடிப்படையில் ஒலிபெயர்க்கப்பட்டன; சமயச் செயலை விளக்கும் கூடுதல் கருத்து முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டது.
