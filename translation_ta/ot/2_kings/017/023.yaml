  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: ta
  text: யாவே தம் ஊழியர்களாகிய எல்லா இறைவாக்கினர்களின் மூலம்[b] சொல்லியிருந்தபடியே, இஸ்ரவேலைத் தம் முன்னிலையிலிருந்து[a] அகற்றிவிடும் வரை. இவ்வாறு இஸ்ரவேல் தன் நாட்டிலிருந்து அசீரியாவுக்கு நாடுகடத்தப்பட்டது; இன்றுவரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘தமது முகத்திற்கு முன்பிருந்து’; இது யாவேயின் முன்னிலையிலிருந்து அகற்றப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘கையால்’; இங்கு ‘மூலம்’ அல்லது ‘வழியாக’ என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: அகற்றும்
  rationale: הֵסִיר என்பதன் காரணவினைப் பொருளான ‘விலகச் செய்தல்/அகற்றுதல்’ என்பதைக் காக்கிறது; ‘துரத்தினார்’ போன்ற கூடுதல் நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப்பெயரின் பொதுவாக ஏற்கப்படும் உச்சரிப்பை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֵעַל פָּנָיו
  choice: தம் முன்னிலையிலிருந்து
  rationale: ‘அவருடைய முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; தம் என்ற தற்சுட்டுப் பெயர் யாவேயையே குறிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொல்லியிருந்தபடியே
  rationale: முன்னரே உரைக்கப்பட்ட இறைவாக்கு அப்படியே நிறைவேறியது என்ற ஒப்புமைச் சார்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: சொல்லுக்கு சொல் ‘கையால்’ என்றாலும், இங்கு செயற்படுத்தும் நபரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘மூலம்’ என்பது இயல்பான தமிழ்.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: தம் ஊழியர்களாகிய எல்லா இறைவாக்கினர்கள்
  rationale: இறைவாக்கினர்கள் யாவேயின் ஊழியர்கள் என்று அடையாளப்படுத்தும் தொடுப்பைத் தெளிவாகக் காக்கிறது.
- source_word: וַיִּגֶל
  choice: நாடுகடத்தப்பட்டது
  rationale: גלה இச்சூழலில் கட்டாய இடப்பெயர்வையும் சிறைப்புலத்தையும் குறிக்கிறது; ஒருமைத் தொகுப்புப் பொருளான இஸ்ரவேலுக்கு தமிழ் செயப்பாட்டு வடிவம் பொருந்துகிறது.
- source_word: אַדְמָתוֹ
  choice: தன் நாடு
  rationale: தேசியத் தொகுப்பாகிய இஸ்ரவேலுக்குரிய நிலப்பரப்பை இயல்பான தமிழில் குறிக்கிறது; வெறும் மண்ணைக் குறிக்கவில்லை.
- source_word: אַשּׁוּרָה
  choice: அசீரியாவுக்கு
  rationale: திசைநோக்கிய ה முடிவின் இயக்கப் பொருளை ‘-க்கு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை நிலைமை அப்படியே இருக்கிறது
  rationale: நாடுகடத்தலின் விளைவு எழுதப்பட்ட காலம்வரை நீடித்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מֵעַל פָּנָיו என்ற மரபுத்தொடரில் இறைநியாயத்தீர்ப்பின் தனிப்பட்ட பரிமாணம்
  choice: தம் முன்னிலையிலிருந்து
  alternative: தமது முகத்திற்கு முன்பிருந்து
  rationale: இஸ்ரவேல் யாவேயின் முன்னிலையிலிருந்து அகற்றப்படுவதைத் தெரிவித்து தனிப்பட்ட, நீதித்தீர்ப்புக்குரிய வலிமையைக் காக்கிறது; அதேவேளையில் தமிழில் இயல்பற்ற சொல்லுக்குச் சொல் வடிவத்தை முதன்மை உரையில் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தின் தொடர்ச்சியான עַד אֲשֶׁר (‘…வரைக்கும்’) அமைப்பு துண்டிக்கப்படாமல் விடப்பட்டுள்ளது. ‘இறைவாக்கினர்கள்’ என்பது נביאים என்பதற்கான வெளிப்படையான, சமகாலச் சொல்; ‘யாவே’ இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
