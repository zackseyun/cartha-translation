source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: ta
  text: ஏனெனில், யாவே இஸ்ரவேலைத் தாவீதின் வம்சத்திலிருந்து பிரித்தார்; அவர்கள் நேபாத்தின் மகன் யெரொபெயாமை அரசனாக்கினார்கள். யெரொபெயாம் இஸ்ரவேலை யாவேயைப் பின்பற்றுவதிலிருந்து விலக்கி[a], அவர்களைப் பெரும் பாவம் செய்ய வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயைப் பின்பற்றாதபடி இஸ்ரவேலை வழிதவறச் செய்து.” எபிரேய வினை விரட்டி விலக்குவதையோ வழிதவறச் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: தன்னைப் பிய்த்துக்கொண்டது
  rationale: ‘கிழித்தல்/பிய்த்தல்’ என்ற எபிரேய உருவகத்தைப் பாதுகாத்து, தாவீதின் வம்ச ஆட்சியிலிருந்து இஸ்ரவேல் அரசியல் ரீதியாகப் பிரிந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵעַל בֵּית דָּוִד
  choice: தாவீதின் வம்சத்திடமிருந்து
  rationale: ‘தாவீதின் வீடு’ என்பது இங்கு குடும்பக் கட்டிடத்தை அல்ல, தாவீதின் அரச வம்சத்தையும் அதன் அதிகாரத்தையும் குறிக்கிறது; ‘வம்சம்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: וַיַּמְלִיכוּ
  choice: அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை—ஒருவரை ஆட்சி செய்ய வைப்பது அல்லது அரசனாக நிறுவுவது—சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּדַּח
  choice: விலக்கி
  rationale: ஒருவரை விரட்டி அகற்றுதல் அல்லது வழிதவறச் செய்தல் ஆகிய இரு சாத்திய நிழற்பொருள்களுக்கும் இடமளித்து, யாவேயைப் பின்பற்றுவதிலிருந்து யெரொபெயாம் இஸ்ரவேலைத் திருப்பிய செயற்பாட்டைச் சொல்கிறது.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: யாவேயைப் பின்பற்றுவதிலிருந்து
  rationale: ‘யாவேக்குப் பின்னால் செல்வது’ என்ற எபிரேய மரபுத்தொடரை, அவருக்கு உண்மையாயிருந்து அவரைப் பின்பற்றுதல் என்ற உடன்படிக்கைச் சார்ந்த பொருளுடன் இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְהֶחֱטֵיאָם
  choice: அவர்களை ... செய்ய வைத்தான்
  rationale: חטא வினையின் காரணவினை வடிவைத் தெளிவாகப் பாதுகாக்கிறது; அடுத்துவரும் ‘பாவம்’ என்பதுடன் தேவையற்ற சொல் மீளுருவாக்கத்தையும் தவிர்க்கிறது.
- source_word: חֲטָאָה גְדוֹלָה
  choice: பெரும் பாவம்
  rationale: குற்றத்தின் தீவிரத்தைக் குறிக்கும் பெயர்ச்சொல்-பெயரடைத் தொடரை கூடுதல் கோட்பாட்டு விளக்கம் இன்றி நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுவான பட்டப்பெயரை அல்ல, உடன்படிக்கையின் தனிப்பட்ட தெய்வீகப் பெயரைப் பயன்படுத்துகிறது; ‘யாவே’ அதை ஒலிபெயர்த்து பாதுகாக்கிறது.
- issue: யெரொபெயாமின் செயல் கட்டாயப்படுத்துதலா அல்லது வழிதவறச் செய்தலா
  choice: பின்பற்றுவதிலிருந்து விலக்கி
  alternative: பின்பற்றாதபடி வழிதவறச் செய்து
  rationale: נדח என்ற வினை விரட்டி அகற்றுதல் மற்றும் வழிதவறச் செய்தல் ஆகிய பொருள்களை ஏற்கக்கூடும். முதன்மை உரை இரண்டையும் உள்ளடக்கக்கூடிய நடுநிலைச் சொல்லைப் பயன்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் இலக்கியத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன்னைப் பிய்த்துக்கொண்டது’ மூலத்தின் வலுவான உருவகத்தைப் பாதுகாக்கிறது; ‘தாவீதின் வம்சம்’ அரச வம்சப் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் வினைக்குப் பின்பே வைக்கப்பட்டுள்ளது.
