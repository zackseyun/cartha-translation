revisions:
- from: அவர்கள் தங்கள் கடவுளாகிய யாவே தந்த எல்லாக் கட்டளைகளையும் கைவிட்டார்கள். தங்களுக்காக வார்ப்புச் சிலைகளை—இரண்டு கன்றுக்குட்டிகளை—செய்தார்கள்; அசேரா ஒன்றையும்[a] செய்தார்கள். வானத்தின் அனைத்துப் படைகளுக்கும் முன்பாகப் பணிந்து, பாகாலுக்குப் பணிவிடை செய்தார்கள்.
  to: அவர்கள் தங்கள் கடவுளாகிய யாவேயின் எல்லாக் கட்டளைகளையும் கைவிட்டார்கள். தங்களுக்காக வார்ப்புச் சிலைகளாக இரண்டு கன்றுக்குட்டிகளைச் செய்தார்கள்; அசேரா ஒன்றையும்[a] செய்தார்கள். வானத்தின் எல்லாப் படைகளுக்கும் தலைவணங்கி, பாகாலுக்குப் பணிவிடை செய்தார்கள்.
  rationale: 'The required correction restores the Hebrew genitive in the first clause: the commandments belong to Yahweh, who is identified as their God. The paired calf phrase is rendered idiomatically as two cast calf-images, while the review documentation should recognize the formally singular Hebrew noun rather than claim that the translation reproduces it. “தலைவணங்கி” accurately distinguishes the act of bowing from the subsequent cultic service to Baal.'
