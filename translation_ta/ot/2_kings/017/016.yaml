base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: ta
  text: அவர்கள் தங்கள் கடவுளாகிய யாவேயின் எல்லாக் கட்டளைகளையும் கைவிட்டார்கள். தங்களுக்காக வார்ப்புச் சிலைகளாக இரண்டு கன்றுக்குட்டிகளைச் செய்தார்கள்; அசேரா ஒன்றையும்[a] செய்தார்கள். வானத்தின் எல்லாப் படைகளுக்கும் தலைவணங்கி, பாகாலுக்குப் பணிவிடை செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா” என்பது கானானியத் தேவியையோ, அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: கைவிட்டார்கள்
  rationale: உடன்படிக்கை சார்ந்த விலகுதலின் வலிமையைத் தக்கவைத்து, வெறுமனே ‘விட்டார்கள்’ என்பதைக் காட்டிலும் திட்டமிட்ட புறக்கணிப்பை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: כָּל מִצְוֺת
  choice: எல்லாக் கட்டளைகளையும்
  rationale: כָּל என்பதன் முழுமையையும் மִצְוֺת என்பதன் உடன்படிக்கைச் சூழலையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: அவர்கள் அந்தக் கடவுளுக்குரிய உடன்படிக்கை மக்களாக இருந்ததைச் சுட்டும் உடைமைப் பின்னொட்டைத் தக்கவைக்கிறது.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: தங்களுக்காகச் செய்தார்கள்
  rationale: לָהֶם குறிக்கும், தங்கள் சொந்த வழிபாட்டுப் பயன்பாட்டிற்காகச் செய்தார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: வார்ப்புச் சிலைகளை—இரண்டு கன்றுக்குட்டிகளை—
  rationale: மெய்யெழுத்து உரையில் מַסֵּכָה ஒருமையாக இருந்தாலும் שנים עֲגָלִים தெளிவாக ‘இரண்டு கன்றுக்குட்டிகள்’ என்கிறது. எண்ணிக்கை சார்ந்த பதற்றத்தை மறைக்காமல், இரண்டு வார்ப்புச் சிலைகள் என்ற சூழற்பொருளைத் தெளிவாக்குகிறது.
- source_word: אֲשֵׁירָה
  choice: அசேரா ஒன்று
  rationale: சொல் தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடியதால், ‘கம்பம்’ என்று மிகையாகத் தீர்மானிக்காமல் எபிரெயப் பெயரைத் தக்கவைக்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: முன்பாகப் பணிந்து
  rationale: வழிபாடு உட்பொருளாக இருந்தாலும், உடலைத் தாழ்த்திப் பணியும் செயலையே நேரடியாகக் காட்டுகிறது.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: வானத்தின் அனைத்துப் படைகளுக்கும்
  rationale: விண்மீன்கள் உள்ளிட்ட வானுலகத் தொகுதியைக் குறிக்கும் மரபுத்தொடரின் படை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וַיַּעַבְדוּ
  choice: பணிவிடை செய்தார்கள்
  rationale: முந்தைய ‘பணிந்து’ என்பதிலிருந்து வேறுபட்டு, விக்கிரக வழிபாட்டுச் சூழலில் வழிபாட்டுச் சேவையை உணர்த்துகிறது.
- source_word: הַבָּעַל
  choice: பாகால்
  rationale: குறிப்பிட்ட கானானியத் தெய்வத்தின் பெயரைத் தமிழில் அடையாளம் காணத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது; எபிரெயக் குறிப்புச் சுட்டியைத் தமிழில் தனியே சேர்க்க வேண்டியதில்லை.
