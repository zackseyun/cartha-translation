translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைச்சொற்கள் குறுகிய தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அவற்றின் வரிசை காக்கப்பட்டுள்ளது. ‘வானத்தின் படைகள்’, ‘பணிவிடை’ போன்ற சொற்கள் மூலத்தின் வழிபாட்டு மற்றும் உருவக வேறுபாடுகளைத் தக்கவைக்கின்றன.
