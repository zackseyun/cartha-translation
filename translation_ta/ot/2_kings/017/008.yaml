base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: ta
  text: யாவே இஸ்ரவேல் மக்களுக்கு முன்பாகத் துரத்தியிருந்த பிற இனங்களின் நியமங்களின்படியும்[a][b], இஸ்ரவேல் அரசர்கள் ஏற்படுத்திய நடைமுறைகளின்படியும்[c] அவர்கள் நடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிற இனங்களின் வழக்கங்களின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேல் மக்களுக்கு முன்பாக யாவே உரிமையிழக்கச் செய்திருந்த’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் துரத்துவதையும் நில உரிமையிலிருந்து அகற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய இறுதித் தொடர் சுருக்கமாக உள்ளது; சொல்லுக்கு சொல், ‘இஸ்ரவேல் அரசர்கள் செய்தவற்றின்படியும்’ எனலாம். சூழலில், அவர்கள் ஏற்படுத்திய நியமங்கள் அல்லது நடைமுறைகள் எனப் பொருள் கொள்ளப்படுகிறது.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: அவர்கள் நடந்துவந்தார்கள்
  rationale: הלך என்பதன் ‘நடத்தல்’ உருவகத்தைத் தக்கவைத்து, ஒழுக்கம் மற்றும் வாழ்க்கை முறையில் தொடர்ந்து நடந்துகொண்டதைக் குறிக்கிறது.
- source_word: בְּחֻקּוֹת
  choice: நியமங்களின்படி
  rationale: חֻקּוֹת என்பது நிர்ணயிக்கப்பட்ட கட்டளைகள் அல்லது நிலைபெற்ற நடைமுறைகளைக் குறிக்கலாம். ‘நியமங்கள்’ அதன் முறையான தன்மையைப் பாதுகாக்கிறது; சூழலில் ‘வழக்கங்கள்’ என்பதும் சாத்தியம்.
- source_word: הַגּוֹיִם
  choice: பிற இனத்தார்
  rationale: இங்கு இஸ்ரவேலரல்லாத கானான் தேசத்து மக்களைக் குறிக்கிறது. தமிழில் ‘பிற இனத்தார்’ இயல்பாகவும் தேவையற்ற சமயச் சுமையின்றியும் உள்ளது.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: இஸ்ரவேல் மக்களுக்கு முன்பாக யாவே துரத்தியிருந்த
  rationale: הוֹרִישׁ என்பதன் Hiphil வடிவம் உரிமையிலிருந்து அகற்றுதல் அல்லது துரத்துதல் எனப் பொருள்படும். ‘துரத்தியிருந்த’ சூழலில் தெளிவானது; ‘முன்பாக’ מִפְּנֵי-ஐ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’; ஆனால் இது முழு இனத்தையும் குறிக்கும் வழக்கமான எபிரெயப் பெயர் என்பதால், உள்ளடக்கிய மற்றும் இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: இஸ்ரவேல் அரசர்கள் ஏற்படுத்திய நடைமுறைகளின்படி
  rationale: எபிரெய இறுதித் தொடர் சுருக்கமாகவும் இலக்கண ரீதியில் தெளிவற்றதாகவும் உள்ளது. முந்தைய ‘நியமங்களின்படி நடந்தார்கள்’ என்பதுடன் இணைத்து, அரசர்கள் உருவாக்கிய நடைமுறைகள் என்ற பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது; தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: இறுதித் தொடரின் பொருள்
  choice: இஸ்ரவேல் அரசர்கள் ஏற்படுத்திய நடைமுறைகள்
  alternative: அவர்கள் ஏற்படுத்திய இஸ்ரவேல் அரசர்கள்
  rationale: முன்னுள்ள בְּחֻקּוֹת மற்றும் ‘நடந்தார்கள்’ என்பதோடு நடைமுறைகள் என்ற பொருள் நன்றாக இணைகிறது. ஆயினும் אֲשֶׁר עָשׂוּ என்பதன் இலக்கணத் தொடர்பால் அரசர்களையே மக்கள் ஏற்படுத்தினர் என்ற வாசிப்பும் சாத்தியம்; அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘நடந்துவந்தார்கள்’ என்ற சொல் எபிரெய வாழ்க்கைநடை உருவகத்தைத் தக்கவைக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது இனக்குழு முழுவதையும் இயல்பாகக் குறிக்கிறது; இறுதித் தொடரின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
