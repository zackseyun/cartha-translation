revisions:
- from: இது நிகழ்ந்ததற்குக் காரணம், இஸ்ரவேல் மக்கள் தங்கள் கடவுளாகிய யெகோவாவுக்கு எதிராகப் பாவம் செய்ததுதான். எகிப்து நாட்டிலிருந்து, எகிப்தின் அரசனாகிய பார்வோனின் கையின் கீழிருந்து[a], அவர்களை மேலே கொண்டுவந்தவர் அவரே. ஆனால் அவர்கள் வேறு தெய்வங்களுக்கு அஞ்சினார்கள்[b].
  to: இது நிகழ்ந்ததற்குக் காரணம், இஸ்ரவேல் மக்கள், தங்களை எகிப்து நாட்டிலிருந்தும் எகிப்தின் அரசனான பார்வோனின் கையின் கீழிருந்தும்[a] வெளியே அழைத்து வந்த தங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்து, வேறு தெய்வங்களுக்கு அஞ்சினார்கள்[b].
  rationale: The revision reunites the identifying Exodus clause with ‘their God,’ removes the unsupported adversative, and retains both coordinated covenant violations as the reason for the preceding event. ‘வெளியே அழைத்து வந்த’ is idiomatic Tamil for the Exodus while preserving the deliverance sense of the Hebrew participle. Footnote anchors remain attached to the exact expressions they explain.
