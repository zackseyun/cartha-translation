base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: ta
  text: இது நிகழ்ந்ததற்குக் காரணம், இஸ்ரவேல் மக்கள், தங்களை எகிப்து நாட்டிலிருந்தும் எகிப்தின் அரசனான பார்வோனின் கையின் கீழிருந்தும்[a] வெளியே அழைத்து வந்த தங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்து, வேறு தெய்வங்களுக்கு அஞ்சினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் அதிகாரத்திலிருந்து.” எபிரெயத்தில் சொல்லுக்குச் சொல், “பார்வோனின் கையின் கீழிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேறு தெய்வங்களை வழிபட்டார்கள்.” எபிரெயத்தில் “வேறு தெய்வங்களுக்கு அஞ்சினார்கள்” என்று உள்ளது; இங்கு அஞ்சுதல் வழிபாட்டுக்குரிய பயபக்தியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: இது நிகழ்ந்ததற்குக் காரணம்
  rationale: כי என்பதன் காரணவிளக்கப் பொருளைத் தெளிவாகக் காட்டி, பழமையான சொற்றொடரைத் தவிர்க்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: חָטְאוּ ... לַיהוָה
  choice: யெகோவாவுக்கு எதிராகப் பாவம் செய்தது
  rationale: חטא உடன் வரும் ל இங்கே ஒருவருக்கு எதிராகப் பாவம் செய்வதைக் குறிக்கிறது; உடன்படிக்கை மீறலின் தனிப்பட்ட திசையைத் தக்கவைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் பிள்ளைகள்' என்றாலும், தேசியக் குழுவைக் குறிக்கும் இச்சொற்றொடருக்கு 'இஸ்ரவேல் மக்கள்' என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய யெகோவா
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, אֱלֹהֵיהֶם வெளிப்படுத்தும் 'அவர்களுடைய கடவுள்' என்ற உடன்படிக்கை உறவையும் காக்கிறது.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து அவர்களை மேலே கொண்டுவந்தவர்
  rationale: עלה வினையின் 'மேலே கொண்டுவருதல்' என்ற உருவகத்தைத் தக்கவைத்து, எபிரெயப் பங்கேற்புச் சொல்லை தமிழில் இயல்பான பெயரெச்சக் கருத்தாக வழங்குகிறது.
- source_word: מִתַּחַת יַד פַּרְעֹה
