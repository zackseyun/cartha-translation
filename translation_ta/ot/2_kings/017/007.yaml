- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: அவர்கள் வேறு தெய்வங்களுக்கு அஞ்சினார்கள்
  rationale: ירא என்பதன் அடிப்படைப் பொருளான அச்சம்/பயபக்தியைத் தக்கவைக்கிறது; சூழலில் வழிபாடு உட்பட்டிருக்கலாம் என்றாலும் அதை முதன்மை உரையில் குறுகலாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான 'கர்த்தர்' என்று மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பான 'யெகோவா' பயன்படுத்தப்படுகிறது.
- issue: வேறு தெய்வங்களை 'அஞ்சுதல்' என்பது அச்சமா அல்லது வழிபாடா
  choice: அஞ்சினார்கள்
  alternative: வழிபட்டார்கள்
  rationale: ירא என்ற வினையின் உண்மையான பரப்பைத் தக்கவைக்கிறது. இச்சூழலில் அது பயபக்தியுடனான வழிபாட்டையும் குறிக்கலாம்; ஆனால் 'வழிபட்டார்கள்' மட்டும் என்று மொழிபெயர்ப்பது மூலத்தின் திட்டமிட்ட பரந்த பொருளைச் சுருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணவிளக்கம், யெகோவாவின் மீட்புச் செயல், மக்களின் வேறு தெய்வங்களுக்கான அச்சம்/பயபக்தி ஆகிய தர்க்கத் தொடர்புகள் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் உரிய இடங்களில் உள்ளன.
