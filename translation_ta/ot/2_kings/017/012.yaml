base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: ta
  text: அவர்கள் சிலைகளுக்குப்[a] பணிவிடை செய்தார்கள். அவற்றைக் குறித்து யாவே அவர்களிடம், “இந்தக் காரியத்தைச் செய்யாதீர்கள்” என்று சொல்லியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘சிலைகள்’ என மொழிபெயர்க்கப்பட்டுள்ள גִּלֻּלִים என்ற எபிரெயச் சொல் இழிவும் அருவருப்பும் தொனிக்கும் சொல்; ‘அசுத்தமான சிலைகள்’ அல்லது ‘சாணச் சிலைகள்’ போன்ற கடுமையான உணர்வைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: பணிவிடை செய்தார்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருளான ‘பணிசெய்தல்/சேவித்தல்’ என்பதையும், இச்சூழலில் உள்ள வழிபாட்டுச் சார்ந்த அர்த்தத்தையும் தக்கவைக்கிறது; ‘வழிபட்டார்கள்’ என்று மட்டும் மொழிபெயர்ப்பதைவிட உடன்படிக்கைச் சேவை மொழியுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: הַגִּלֻּלִים
  choice: சிலைகளுக்கு
  rationale: நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் சிலைவழிபாட்டின் பொருட்களைக் குறிக்கிறது. எபிரெயச் சொல்லின் இழிவான தொனி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲשֶׁר
  choice: அவற்றைக் குறித்து
  rationale: உறவுப்பெயர் இங்கு யாவே கூறிய தடை அந்தச் சிலைகளையும் அவற்றுக்குச் செய்யப்படும் வழிபாட்டையும் பற்றியது என்பதை இயல்பான தமிழில் இணைக்கிறது.
- source_word: אָמַר יְהוָה לָהֶם
  choice: யாவே அவர்களிடம் ... சொல்லியிருந்தார்
  rationale: முந்தைய இறைக் கட்டளை, பின்னர் அவர்கள் செய்த செயலுக்கு முன்னதாக வழங்கப்பட்டது என்பதை ‘சொல்லியிருந்தார்’ தெளிவுபடுத்துகிறது; יהוה என்பது ‘யாவே’ எனப் பெயராக்கப்படுகிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: செய்யாதீர்கள்
  rationale: பன்மை முன்னிலையில் வழங்கப்படும் நேரடியான தடைக் கட்டளையை நவீன மரியாதைமிக்க தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை
  rationale: דָּבָר என்பதன் பரந்த ‘காரியம்/செயல்’ பொருளைத் தக்கவைத்து, வெறும் ‘இதை’ என்பதைக் காட்டிலும் மூலத்தின் வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக இடம்பெறுவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: עבד என்பதின் வழிபாட்டு அர்த்தம்
  choice: பணிவிடை செய்தார்கள்
  alternative: வழிபட்டார்கள்
  rationale: இச்சூழலில் வழிபாடு உறுதியாகக் குறிக்கப்பட்டாலும், ‘பணிவிடை’ என்பது எபிரெய வினையின் சேவை சார்ந்த அடிப்படைப் பொருளையும் அதன் உடன்படிக்கைத் தளர்வையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணிவிடை செய்தார்கள்’ என்பது சிறிது முறையானதாயினும் மதச்சூழலில் இயல்பாக இருந்து, மூலத்தின் ‘சேவித்தல்’ என்ற சொல்லியல் தொடர்பைப் பாதுகாக்கிறது.
