  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுக்கவில்லை’ என்பது கேட்பதற்கும் கீழ்ப்படிவதற்கும் இடையிலான மூலமொழியின் பொருள் நெகிழ்வைத் தக்கவைக்கிறது; ‘வழக்கம்’ என்பதற்கான மாற்றுப் பொருட்கள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
