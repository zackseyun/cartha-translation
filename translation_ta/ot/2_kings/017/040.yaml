  source_fidelity: மூல எபிரெயத்தின் எதிர்மறைத் தொடர்ச்சி (וְלֹא), ‘செவிகொடுக்குதல்’ என்ற שׁמע-வின் சூழல்சார் நெகிழ்வு, כִּי אִם-இன் மாறுபாட்டு வலிமை, ‘அவர்களுடைய முந்தைய வழக்கம்’ (כמשפטם הראשון), மற்றும் தொடர்ச்சியான செயல் (הם עשים) ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன.
  naturalness: ‘ஆனால் அவர்கள் செவிகொடுக்கவில்லை; மாறாக, தங்கள் முந்தைய வழக்கத்தின்படியே தொடர்ந்து நடந்துவந்தார்கள்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம உரைநடையிலும் உள்ளது.
  terminology: ‘செவிகொடுக்கவில்லை’ மூலத்தின் ‘கேட்க/கவனிக்க/ஏற்க’ என்னும் திறந்த பொருளைத் தக்கவைக்கிறது. ‘வழக்கம்’ இச்சூழலில் מִשְׁפָּט-க்கு ஏற்றது; அடிக்குறிப்பு ‘ஒழுங்குமுறை’ மற்றும் ‘நடைமுறை’ ஆகிய நியாயமான மாற்றுகளையும் தருகிறது.
