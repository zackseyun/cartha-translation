  text: וְ/לֹ֖א שָׁמֵ֑עוּ כִּ֛י אִֽם כְּ/מִשְׁפָּטָ֥/ם הָֽ/רִאשׁ֖וֹן הֵ֥ם עֹשִֽׂים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: ta
  text: ஆனால் அவர்கள் செவிகொடுக்கவில்லை; மாறாக, தங்கள் முந்தைய வழக்கத்தின்படியே[a] தொடர்ந்து நடந்துவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் முந்தைய ஒழுங்குமுறை/நடைமுறையின்படியே தொடர்ந்து நடந்துவந்தார்கள்.” இங்குள்ள எபிரெயச் சொல் நியமம், ஒழுங்குமுறை அல்லது வழக்கமான நடைமுறை என்பதைக் குறிக்கலாம்; இச்சூழலில் அது அவர்களுடைய முன்பிருந்த வழிபாட்டு முறையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய கட்டளைக்கும் இவர்கள் காட்டிய எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמֵעוּ
  choice: செவிகொடுக்கவில்லை
  rationale: எபிரெயச் சொல் ‘கேள்’, ‘கவனித்துக் கேள்’, ‘கீழ்ப்படி’ ஆகிய பொருட்களை ஏற்கக்கூடும். இங்கு ‘செவிகொடுக்கவில்லை’ என்பது கேட்பதையும் அதற்கேற்ப நடப்பதையும் உள்ளடக்கி, ‘கீழ்ப்படியவில்லை’ என்று பொருளை அளவுக்கு மீறி முடிவுசெய்யாமல் வைக்கிறது.
- source_word: כִּי אִם
  choice: மாறாக
  rationale: ‘இதைச் செய்யாமல், அதற்குப் பதிலாக அதைச் செய்தார்கள்’ என்ற எதிர்மறை மாறுபாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כְּמִשְׁפָּטָם
  choice: தங்கள் ... வழக்கத்தின்படியே
  rationale: מִשְׁפָּט என்பதற்கு தீர்ப்பு, நியமம், ஒழுங்குமுறை, வழக்கமான நடைமுறை ஆகிய பொருட்கள் உண்டு. இச்சூழலில் முன்பிருந்த வழிபாட்டு நடைமுறையைக் குறிப்பதால் ‘வழக்கம்’ பொருத்தமாக உள்ளது.
- source_word: הָרִאשׁוֹן
  choice: முந்தைய
  rationale: அவர்களுடைய முன்னைய நடைமுறை அல்லது வழிபாட்டு முறையைச் சுட்டுகிறது; ‘முதலாவது’ என்பதைவிட ‘முந்தைய’ என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: הֵם עֹשִׂים
  choice: தொடர்ந்து நடந்துவந்தார்கள்
  rationale: எபிரெயப் பெயரெச்ச வினைவடிவம் தொடர்ச்சியான அல்லது வழக்கமான செயலைக் காட்டுகிறது. தமிழில் ‘தொடர்ந்து நடந்துவந்தார்கள்’ என்பது அவர்களுடைய நீடித்த நடத்தை இயல்பாக வெளிப்படுத்துகிறது.
