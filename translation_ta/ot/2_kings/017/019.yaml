  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: ta
  text: யூதாவும் கூட[a] தங்கள் கடவுளாகிய யாவேயின் கட்டளைகளைக் கடைப்பிடிக்கவில்லை; மாறாக, இஸ்ரவேல் உருவாக்கிய சட்டதிட்டங்களின்படி நடந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவும்”; தொடக்கச் சொல், இஸ்ரவேலைப் போல யூதாவும் குற்றவாளியானது என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேல் ஏற்படுத்திய விதிமுறைகளின்படி நடந்தார்கள்” அல்லது “இஸ்ரவேல் உருவாக்கிய வழக்கங்களைப் பின்பற்றினார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: யூதாவும்கூட
  rationale: முந்தைய சூழலில் இஸ்ரவேல் மட்டுமல்ல, யூதாவும் அதே குற்றத்தில் ஈடுபட்டது என்பதை வலியுறுத்துகிறது. ‘-உம்கூட’ என்பது அந்த அழுத்தத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמַר
  choice: கடைப்பிடிக்கவில்லை
  rationale: கட்டளைகளுடன் வரும் שׁמר, அவற்றைக் காத்து ஒழுகுதல் அல்லது அனுசரித்தல் என்ற உடன்படிக்கைச் சார்ந்த பொருளைக் கொண்டது; ‘கடைப்பிடித்தல்’ இதைத் தெளிவாகத் தருகிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: சட்ட மற்றும் உடன்படிக்கைச் சூழலுக்கு ஏற்ற, பொதுவாகப் புரியும் நேரடியான சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: எபிரெயத்தில் உள்ள மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டை, யூதா மக்களைக் குறிக்கும் இயல்பான தமிழ் தற்சுட்டு வடிவில் தருகிறது.
- source_word: וַיֵּלְכוּ
  choice: மாறாக ... நடந்தார்கள்
  rationale: הלך + ב என்பது ஒரு நெறியைப் பின்பற்றி வாழ்வதைக் குறிக்கும் உருவகப் பயன்பாடு. ‘நடந்தார்கள்’ உருவகத்தைப் பேணுகிறது; ‘மாறாக’ இரு செயல்களுக்கிடையிலான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: בְּחֻקּוֹת
  choice: சட்டதிட்டங்களின்படி
  rationale: חֻקּוֹת என்பதன் சட்ட, ஒழுங்கு, நிறுவப்பட்ட வழக்கம் ஆகிய பொருள் வரம்பை ‘சட்டதிட்டங்கள்’ தக்கவைக்கிறது; ב முன்னிடைச்சொல்லின் நெறிப்படி நடத்தல் என்ற பொருளை ‘-இன்படி’ இயல்பாக வழங்குகிறது.
- source_word: אֲשֶׁר עָשׂוּ
  choice: இஸ்ரவேல் உருவாக்கிய
  rationale: עשה என்பதன் அடிப்படை ‘செய்தல்/உருவாக்குதல்’ பொருளையும், பன்மை வினைக்குரிய கூட்டு எழுவாயாக இஸ்ரவேலைக் கொள்ளும் வாசிப்பையும் முதன்மை உரை பின்பற்றுகிறது; ‘கடைப்பிடித்த’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு அண்மையான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- issue: אֲשֶׁר עָשׂוּ என்பதன் எழுவாயும் பொருளும்
  choice: இஸ்ரவேல் உருவாக்கிய
  alternative: அவர்கள் கடைப்பிடித்த / இஸ்ரவேல் பின்பற்றிய
  rationale: יִשְׂרָאֵל என்பதை கூட்டு பன்மை எழுவாயாகக் கொண்டு, עשה-ஐ ‘உருவாக்கியது’ என்று வாசிக்கலாம். அதே சொற்றொடர் சட்டதிட்டங்களை நடைமுறைப்படுத்துதல் அல்லது கடைப்பிடித்தல் என்றும் புரிந்துகொள்ளப்படுவதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நடந்தார்கள்’ என்ற வேதாகம உருவகம் பேணப்பட்டாலும், ‘சட்டதிட்டங்களின்படி’ என்பதன் மூலம் அதன் நடத்தை சார்ந்த பொருள் தெளிவாக்கப்பட்டுள்ளது. யூதா ஒரு கூட்டு மக்களைக் குறிக்கும் என்பதால் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
