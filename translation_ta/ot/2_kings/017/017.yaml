base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ta
  text: தங்கள் மகன்களையும் மகள்களையும் நெருப்பினூடே கடக்கச் செய்தார்கள்[a]; குறி பார்த்தார்கள், சகுனங்களை விளக்கினார்கள்; யாவேவின் பார்வையில் தீமையானதைச் செய்து அவருக்குக் கோபமூட்டுவதற்காகத் தங்களையே விற்றுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “தங்கள் மகன்களையும் மகள்களையும் நெருப்பில் பலியிட்டார்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெய மரபுத்தொடர் சொல்லுக்கு சொல், “நெருப்பினூடே கடக்கச் செய்தார்கள்” என்கிறது.
    reason: குழந்தைத் தீச்சடங்கைக் குறிக்கும் எபிரெய மரபுத்தொடரின் நேரடிப் பொருளையும், சூழலால் சுட்டப்படும் பலியிடுதல் என்ற பொருளையும் வேறுபடுத்திக் காட்டுதல்.
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: நெருப்பினூடே கடக்கச் செய்தார்கள்
  rationale: எபிரெய மொழியின் காரணவினை அமைப்பையும் ‘நெருப்பினூடே கடத்துதல்’ என்ற மரபுத்தொடரையும் நேரடியாகப் பாதுகாக்கிறது. இது குழந்தைப் பலி அல்லது அதனுடன் தொடர்புடைய தீச்சடங்கைக் குறிக்கலாம்; ஆனால் மூலவாசகம் கூறுவதைவிடச் சடங்கின் துல்லிய வடிவை முதன்மை உரையில் மிகையாக வரையறுக்கவில்லை.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: தங்கள் மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக இரண்டையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: குறிசொல்லிப் பார்த்தார்கள்
  rationale: வினை–பெயர் ஒரே வேரிலிருந்து வரும் எபிரெயச் செறிவை தமிழில் இயல்பான நடையில் அளித்து, மறைஞான முறையில் எதிர்காலம் அல்லது மறைந்தவற்றை அறிய முயலும் செயலைக் குறிக்கிறது.
- source_word: וַיְנַחֵשׁוּ
  choice: சகுனங்களை விளக்கினார்கள்
  rationale: அடையாளங்கள் அல்லது சகுனங்களைப் பார்த்து அவற்றின் பொருளைத் தீர்மானிக்கும் செயலைத் தெளிவாகக் காட்டி, முந்தைய குறிசொல்லுதல் என்ற சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: וַיִּתְמַכְּרוּ
  choice: தங்களையே விற்றுப்போட்டு
  rationale: தீமைக்கு மனமுவந்து அடிமையாக ஒப்புக்கொடுத்ததைக் காட்டும் மூலத்தின் வலுவான விற்பனை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்வதற்கு
  rationale: குறிப்பிட்ட ஒரு செயலை மட்டும் அல்லாமல், பொதுவாகத் தீமையானவற்றைச் செய்வதைக் குறிக்கும் எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: கடவுளின் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவருக்குக் கோபமூட்டினார்கள்
  rationale: கோபத்தை உண்டாக்குதல் என்ற எபிரெய காரணவினையின் வலிமையையும் உறவுசார் அவமதிப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: குழந்தைகளை நெருப்பினூடே கடத்தும் சடங்கின் இயல்பு
  choice: ‘தங்கள் மகன்களையும் மகள்களையும் நெருப்பினூடே கடக்கச் செய்தார்கள்’ என்ற எபிரெய மரபுத்தொடரை முதன்மை உரையில் பேணுதல்.
  alternative: ‘தங்கள் மகன்களையும் மகள்களையும் நெருப்பில் பலியிட்டார்கள்’ அல்லது ‘நெருப்பில் எரித்தார்கள்.’
  rationale: சூழல் கண்டிக்கப்பட்ட குழந்தைப் பலியை வலுவாகச் சுட்டினாலும், எபிரெய வாசகம் சடங்கின் துல்லிய வடிவை நேரடியாக விவரிக்கவில்லை. ஆகவே உண்மையான மொழியியல் திறந்தநிலையை முதன்மை உரையில் வைத்துக் கொண்டு, சாத்தியமான வெளிப்படையான பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, மொழிபெயர்ப்பு முழுவதும் பெயரின் தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நெருப்பினூடே,’ ‘குறிசொல்லுதல்,’ ‘சகுனங்கள்,’ ‘தங்களையே விற்றுப்போடுதல்’ ஆகியவை மூலத்தின் உருவகங்களையும் செயல்களின் வேறுபாட்டையும் பேணுகின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
