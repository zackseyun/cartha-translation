  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் யெரொபெயாம் செய்த எல்லாப் பாவங்களிலும் நடந்தார்கள்; அதை விட்டு அவர்கள் விலகவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: தொடர்ந்து நடந்தார்கள்
  rationale: הלך என்பதுடன் ב சேரும்போது ஒரு நடத்தை அல்லது வாழ்க்கை முறையைப் பின்பற்றுவதைக் குறிக்கலாம். ‘நடந்தார்கள்’ என்பது எபிரெய உருவகத்தைப் பேணுகிறது; ‘தொடர்ந்து’ என்பது அடுத்துள்ள ‘விலகவில்லை’ என்பதுடன் பொருந்தும் நிலைத்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் பிள்ளைகள்’ என்று மொழிபெயர்க்கலாம்; ஆனால் இங்கு தேச மக்களைக் குறிக்கும் மரபுத்தொடருக்கு ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּכָל חַטֹּאות
  choice: எல்லாப் பாவங்களிலும்
  rationale: בְּ என்ற முன்னொட்டையும் חַטֹּאות என்ற பன்மையையும் நேரடியாகப் பேணி, யெரொபெயாமின் முழுப் பாவ நடத்தை முறையிலும் அவர்கள் பங்குகொண்டதைத் தெரிவிக்கிறது.
- source_word: עָשָׂה
  choice: செய்த
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘செய்தான்’ என்பதைக் காத்து, தமிழில் ‘பாவங்களைச் செய்த’ என்ற இயல்பான இணைப்பை வழங்குகிறது.
- source_word: לֹא סָרוּ
  choice: விலகவில்லை
  rationale: סור என்பது விலகுதல் அல்லது வழிமாறுதல் எனப் பொருள்படும். இங்கு பாவ வழியை விட்டுத் திரும்பாத தொடர்ச்சியை ‘விலகவில்லை’ தெளிவாகக் காட்டுகிறது.
- source_word: מִמֶּנָּה
  choice: அதை விட்டு
  rationale: மூலத்தில் பெண்பால் ஒருமை பின்னொட்டு உள்ளது. முந்தைய பாவங்களை ஒரு கூட்டு நடத்தை முறையாகக் குறிப்பதைப் பேணுவதற்காக ஒருமையான ‘அதை’ பயன்படுத்தப்பட்டுள்ளது; அதன் தெளிவுக்காக அடிக்குறிப்பு தரப்பட்டுள்ளது.
theological_decisions:
- issue: பன்மையான ‘பாவங்கள்’ என்பதற்குப் பின் வரும் ஒருமைச் சுட்டுப்பெயர் מִמֶּנָּה எதைக் குறிக்கிறது?
  choice: ‘அதை விட்டு’ என்று ஒருமையைப் பேணி, யெரொபெயாமின் பாவ வழி அல்லது பாவ நடத்தை முறையை மொத்தமாகக் குறிப்பதாக விடப்பட்டுள்ளது.
  alternative: ‘அவற்றை விட்டு’ என்று பன்மையான ‘பாவங்கள்’ என்பதையே நேரடியாகச் சுட்டுதல்.
  rationale: எபிரெய மூலத்தின் உண்மையான இலக்கண இழுபறியைத் தமிழில் முற்றிலும் மறைக்காமல் ஒருமையைப் பேணுகிறது. அதேவேளை, அடிக்குறிப்பு இது பாவ வழியை மொத்தமாகக் குறிக்கலாம் என்பதை விளக்குகிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கம் எதையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாவங்களிலும் நடந்தார்கள்’ என்ற எபிரெய உருவகம் தமிழிலும் புரிந்துகொள்ளத்தக்கதால் பேணப்பட்டுள்ளது. ‘இஸ்ரவேலின் பிள்ளைகள்’ என்பதற்குப் பதில் இயல்பான தேசியக் குறியீடாக ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
