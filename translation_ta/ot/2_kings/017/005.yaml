base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: ta
  text: அசீரிய அரசன் நாடு முழுவதிலும் படையெடுத்துச் சென்று, சமாரியாவுக்கு எதிராகப் படையெடுத்து வந்து, அதை மூன்று ஆண்டுகள் முற்றுகையிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாரியாவுக்கு ஏறிச் சென்று” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியான ஏற்றத்தையோ இராணுவ முன்னேற்றத்தையோ குறிக்கலாம்; அடுத்ததாக வரும் “முற்றுகையிட்டான்” என்பது இங்கு பகைமை கொண்ட படையெடுப்பு என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: படையெடுத்துச் சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’; இங்கு அரசனும் முற்றுகையும் இடம்பெறும் போர் சூழலில் அது இராணுவ முன்னேற்றத்தைக் குறிக்கிறது. இயல்பான தமிழில் hostile military sense-ஐ வெளிப்படுத்த இந்தத் தேர்வு செய்யப்பட்டது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான, தெளிவான தமிழில் வழங்குகிறது; சூழலில் குறிப்பிட்ட அரசன் குறிக்கப்படுகிறான்.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடு முழுவதிலும்
  rationale: בְּ உடன் வரும் இந்தச் சொற்றொடர், படை நடவடிக்கை அந்த நிலப்பகுதி முழுவதும் பரவியதைச் சுட்டுகிறது; எந்த நாட்டை என்பதைக் காட்டிலும் அதிகமாக உரையில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: சமாரியாவுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: ஒரு நகரத்தைத் தொடர்ந்து முற்றுகையிடும் சூழலில் עלה இராணுவமாக அதற்கு எதிராக முன்னேறுவதைக் குறிக்கிறது. ‘வந்து’ என்பது சமாரியாவை அடைந்த முன்னேற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: וַיָּצַר עָלֶיהָ
  choice: அதை ... முற்றுகையிட்டான்
  rationale: צור இச்சூழலில் ஒரு நகரைச் சுற்றி முற்றுகையிடுதல் என்ற தெளிவான பொருளைக் கொண்டுள்ளது.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகள்
  rationale: தமிழில் காலநீட்சியை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
