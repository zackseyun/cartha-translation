translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஏறிச் சென்றான்’ என்ற எபிரெய மரபுத்தொடரைச் சொற்படியாக வைத்தால் தமிழில் இராணுவச் சூழல் மங்கக்கூடும் என்பதால் ‘படையெடுத்துச் சென்று’ என வழங்கி, மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
