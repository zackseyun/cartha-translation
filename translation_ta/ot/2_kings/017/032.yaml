base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: ta
  text: அவர்கள் யாவேவுக்கு அஞ்சினார்கள்; தங்களிடையிலிருந்து[a] சிலரைத் தங்களுக்காக மேட்டு வழிபாட்டுத் தலங்களின்[b] ஆசாரியர்களாக நியமித்தார்கள். அந்த ஆசாரியர்கள் மேட்டு வழிபாட்டுத் தலங்களின் கட்டடங்களில் அவர்களுக்காகப் பணியாற்றிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்களிலுள்ள எல்லா வகுப்பினரிடையிலிருந்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய மரபுத்தொடர் சொற்பட ‘அவர்களின் முனைகளிலிருந்து’ என உள்ளது; தகுதியின் முறையான வேறுபாடின்றி பொதுமக்களிடமிருந்து தேர்ந்தெடுத்ததையும் அது சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மையப் பரிசுத்த இடத்துக்கு மாறாக அமைந்திருந்த உள்ளூர் வழிபாட்டுத் தலங்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: யாவேவுக்குப் பயந்தார்கள்
  rationale: ‘பயந்தார்கள்’ என்பது ירא என்ற சொல்லின் அடிப்படைப் பொருளையும், பயபக்தி மற்றும் வழிபாட்டுச் சார்பின் நிழற்பொருளையும் தக்கவைக்கிறது; ‘வழிபட்டார்கள்’ என்று மட்டும் மொழிபெயர்ப்பது மூலத்தின் சொற்பொருளைச் சுருக்கிவிடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: מִקְצוֹתָם
  choice: தங்களிடையிலிருந்து சிலரை
  rationale: சொல்லுக்கு நேரடியாக ‘அவர்களின் முனைகள்/எல்லைகளிலிருந்து’ என்ற உருவகம் இருந்தாலும், இங்கு அது அந்த மக்களிடமிருந்து ஆட்களைத் தேர்ந்தெடுத்ததைக் குறிக்கும் மரபுத்தொடர். ‘சிலரை’ என்பது ஆசாரியர்களாக நியமிக்கப்பட்டவர்கள் முழு மக்களும் அல்லர் என்பதை இயல்பாக வெளிப்படுத்துகிறது; விவாதத்துக்குரிய சமூகத் தர அர்த்தம் அடிக்குறிப்பில் விடப்படுகிறது.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: மேட்டு வழிபாட்டிடங்களின் ஆசாரியர்கள்
  rationale: במות என்பது உள்ளூர் மேட்டு வழிபாட்டுத் தலங்களைக் குறிக்கும் வழிபாட்டுச் சொல். வெறும் ‘மேடைகள்’ என்பதைவிட ‘மேட்டு வழிபாட்டிடங்கள்’ இன்றைய வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது; ‘ஆசாரியர்கள்’ cultic office-ஐக் காக்கிறது.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: தங்களுக்காக ... நியமித்தார்கள்
  rationale: பதவியில் ஒருவரை ‘ஆக்குதல்’ என்ற சூழலில் עשה என்பதற்கு ‘நியமித்தார்கள்’ இயல்பான தமிழ்; לָהֶם வெளிப்படுத்தும் தங்களுக்கான ஏற்பாடும் தக்கவைக்கப்படுகிறது.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: அவர்களுக்காகப் பணியாற்றிவந்தார்கள்
  rationale: எபிரெய வினைத்தொடர் தொடர்ந்த செயல்பாட்டைக் காட்டுகிறது. ‘பணியாற்றிவந்தார்கள்’ வழிபாட்டுச் சேவையை உணர்த்தினாலும், மூலத்தில் சொல்லப்படாத குறிப்பிட்ட சடங்குகளைச் சேர்ப்பதில்லை.
- source_word: בְּבֵית הַבָּמוֹת
  choice: மேட்டு வழிபாட்டிடங்களின் வழிபாட்டுக் கட்டடங்களில்
  rationale: ஒருமை வடிவிலுள்ள בֵּית, பன்மையான במות உடன் கூட்டுப்பொருளில் அந்தத் தலங்களோடு இணைந்த வழிபாட்டுக் கட்டடங்களைக் குறிக்க முடியும். ‘கோயில்கள்’ என்று குறிப்பாகத் தீர்மானிக்காமல் கட்டடப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: யாவேவுக்குப் பயப்படுதலுக்கும் முறையற்ற உள்ளூர் வழிபாட்டு நடைமுறைக்கும் இடையிலான பதற்றம்
  choice: இரு செயல்களையும் ‘மேலும்’ என இணைத்து, விளக்கமின்றி அடுத்தடுத்து கூறுதல்
  alternative: ‘ஆனால்’ அல்லது ‘பயப்படுவதாகக் கூறினார்கள்’ என்று முரண்பாட்டை வெளிப்படையாக விளக்குதல்
  rationale: எபிரெய உரை இரு செயல்களையும் וַ மூலம் இணைக்கிறது; அது அவர்களின் நோக்கத்தை ‘பாசாங்கு’ என்று நேரடியாகத் தீர்ப்பதில்லை. ஆகவே பயபக்தியையும் மேட்டு வழிபாட்டையும் அருகருகே வைத்து, உள்ள பதற்றத்தை வாசகரே உணருமாறு மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மேட்டு வழிபாட்டிடங்கள்’ என்ற சொற்றொடர் தொழில்நுட்பப் பொருளைத் தெளிவாக்குகிறது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
