  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: ta
  text: அவர்கள் அங்கே குடியிருந்த ஆரம்பத்தில், யாவேக்குப் பயப்படவில்லை[a]. ஆகவே யாவே அவர்கள் நடுவே சிங்கங்களை அனுப்பினார்; அவை அவர்களில் சிலரைக் கொன்று கொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயப்படவில்லை” என்பது வெறும் அச்சத்தைக் குறிப்பதல்ல; யாவேக்குரிய பயபக்தியையும் அவரை மதித்து நடப்பதையும் உள்ளடக்குகிறது. “பயபக்தி காட்டவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: அவர்கள் அங்கே குடியிருக்கத் தொடங்கியபோது
  rationale: குடியிருப்பின் தொடக்கக் கட்டத்தைக் குறிக்கும் எபிரெயக் கட்டமைப்பை, பெயர்ச்சொல் வடிவத்தைச் செயற்கையாகப் பேணாமல், நவீனத் தமிழில் இயல்பான காலவாக்கியமாக வழங்குகிறது.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: யாவேக்குப் பயப்படவில்லை
  rationale: ירא என்பது இங்கு வெறும் திகிலை மட்டுமல்ல, கடவுளுக்குரிய பயபக்தியையும் அங்கீகாரத்தையும் உள்ளடக்குகிறது. ‘பயப்படவில்லை’ மூலச்சொல்லை வெளிப்படையாகப் பேணுகிறது; அதன் விரிந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் காணப்படும் இறைப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: அவர்கள் நடுவே சிங்கங்களை அனுப்பினார்
  rationale: בָּהֶם என்பதை இச்சூழலில் ‘அவர்கள் நடுவே’ என வழங்குவது, சிங்கங்கள் அவர்களுடைய மத்தியில் அனுப்பப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: அவை அவர்களில் சிலரைக் கொன்று வந்தன
  rationale: היה + நிகழ்காலப் பங்கேற்புச் சொல் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது; ‘கொன்று வந்தன’ அந்த அம்சத்தைப் பேணுகிறது. בָּהֶם இங்கு பகுதியைக் குறிக்கும் விதத்தில் வருவதால் ‘அவர்களில் சிலரை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல் பேணுகிறது.
- issue: ‘யாவேக்குப் பயப்படுதல்’ என்பதன் பொருள்
  choice: பயப்படவில்லை
  alternative: பயபக்தி காட்டவில்லை
  rationale: மூலத்தின் ירא என்ற சொல்லில் அச்சமும் பயபக்தியும் சார்ந்துள்ளன. முதன்மை உரை அதன் உருவகத்தையும் தெளிவற்ற விரிவையும் பேணுகிறது; அடிக்குறிப்பு வெறும் திகில் என்ற குறுகிய வாசிப்பைத் தவிர்க்க உதவுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘குடியிருக்கத் தொடங்கியபோது’ என்பது எபிரெய காலக் கட்டமைப்பை இயல்பாக வழங்குகிறது; ‘கொன்று வந்தன’ தொடர்ச்சியான அல்லது மீள நிகழ்ந்த செயலை வெளிப்படுத்துகிறது.
