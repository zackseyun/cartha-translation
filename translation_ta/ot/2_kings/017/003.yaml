base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: ta
  text: அசீரியாவின் அரசன் சல்மனேசர் ஓசேயாவுக்கு எதிராகப் படையெடுத்து வந்தான்; ஓசேயா அவனுக்குக் கீழ்ப்பட்டவனாகி[a], அவனுக்குத் திறை செலுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவனுடைய ஊழியனானான்”; இங்கு அது அரசியல் கீழ்ப்படிதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: ஓசேயாவுக்கு எதிராகப் படையெடுத்து வந்தான்
  rationale: இராணுவச் சூழலில் இந்த எபிரெய மரபுத்தொடர் ஒருவருக்கு எதிராக முன்னேறி வருவதைக் குறிக்கிறது. ‘படையெடுத்து வந்தான்’ என்பது தாக்குதல் முழுமையாக நடந்ததாக மிகைப்படுத்தாமல் இராணுவ முன்னேற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שַׁלְמַנְאֶסֶר
  choice: சல்மனேசர்
  rationale: ஆள்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரியாவின் அரசன்
  rationale: சல்மனேசரின் பட்டத்தையும் ஆட்சிப் பகுதியையும் குறிக்கும் இணைப்புத் தொடர் இயல்பான தமிழ்ச் சொல்லமைப்பில் தரப்பட்டுள்ளது.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: அவனுக்குக் கீழ்ப்பட்டவனாகி
  rationale: இது ஓசேயாவின் அரசியல் நிலை மாறி, அசீரிய அரசனுக்குக் கட்டுப்பட்ட சிற்றரசனானதைக் குறிக்கிறது. நேரடியான ‘வேலைக்காரன்’ அல்லது ‘அடிமை’ இச்சர்வதேச அரசியல் உறவைத் தவறாக உணர்த்தக்கூடும்; ‘கீழ்ப்பட்டவன்’ அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: அவனுக்குத் திறை செலுத்தினான்
  rationale: இங்கு מִנְחָה என்பது பரிசையோ வழிபாட்டு காணிக்கையையோ அல்ல, கீழ்ப்பட்ட அரசன் மேலாதிக்க அரசனுக்குச் செலுத்தும் திறையைக் குறிக்கிறது. ‘திறை செலுத்தினான்’ நவீனத் தமிழில் துல்லியமான அரசியல் சொல்லாக்கம்.
