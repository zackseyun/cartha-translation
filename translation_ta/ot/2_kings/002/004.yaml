  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: ta
  text: எலியா அவனிடம், “எலிசா, தயவுசெய்து இங்கேயே தங்கியிரு; ஏனெனில் யாவே என்னை எரிகோவுக்கு அனுப்பியிருக்கிறார்” என்றார். அதற்கு அவன், “யாவே உயிரோடிருப்பதுபோலவும், நீர் உயிரோடிருப்பதுபோலவும், நான் உம்மைவிட்டுப் பிரியமாட்டேன்” என்றான். பின் அவர்கள் எரிகோவுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: தயவுசெய்து இங்கேயே தங்கியிரு
  rationale: ישׁב என்பதன் கட்டளை வடிவம் சூழலில் ‘உட்கார்’ என்பதைவிட, எலியாவுடன் தொடர்ந்து வராமல் ‘தங்கியிரு’ என்பதைக் குறிக்கிறது; נָא வேண்டுகோளின் மென்மையை ‘தயவுசெய்து’ என வெளிப்படுத்துகிறது.
- source_word: פֹה
  choice: இங்கேயே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை. தொடராமல் இந்த இடத்திலேயே இருக்க வேண்டும் என்ற சூழல்சார் வலியுறுத்தலை இயல்பான தமிழில் ‘இங்கேயே’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שְׁלָחַנִי
  choice: என்னை ... அனுப்பியிருக்கிறார்
  rationale: 'முடிவுற்ற வினையின் நிகழ்காலத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது: எலியாவின் பயணம் அவர் பெற்ற அனுப்புதலின் தற்போதைய விளைவு.'
- source_word: יְרִיחוֹ
  choice: எரிகோ
  rationale: இவ்விடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ
  rationale: இது ஓர் ஆணைச் சூத்திரம். சொல்லுக்குச் சொல் அமைப்பையும் அதன் உறுதியான ஆணையிடும் வலிமையையும் தமிழில் புரியுமாறு காக்கிறது.
- source_word: וְחֵי נַפְשְׁךָ
  choice: நீர் உயிரோடிருப்பதும் எவ்வளவு உறுதியோ
  rationale: נפשׁ இங்கு தனியான ஆவி அல்லது ஆன்மாவைக் குறிக்காமல் அந்த நபரின் உயிரையே குறிக்கிறது. முன்னுள்ள ஆணைச் சொல்லுடன் உள்ள இணை அமைப்பும் காக்கப்படுகிறது.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: நான் உம்மைவிட்டு விலகமாட்டேன்
  rationale: ஆணை அமைப்பில் אִם சொல்லப்படாமல் விடப்பட்ட தண்டனைக்கூற்றுடன் எதிர்மறை உறுதிமொழியின் பொருளைத் தருகிறது. தமிழில் அதன் நோக்கத்தைத் தெளிவாக்க எதிர்மறை நேரடியாகச் சொல்லப்படுகிறது; பயணச் சூழலுக்கு ‘விலகமாட்டேன்’ இயல்பாக உள்ளது.
- source_word: וַיָּבֹאוּ
  choice: ஆகவே அவர்கள் ... வந்தார்கள்
  rationale: வழக்கமான தொடர்வினை கதையை முன்னேற்றுகிறது; எலிசாவின் மறுப்பின் விளைவாக இருவரும் சென்றடைந்ததை ‘ஆகவே’ இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைக் காக்கிறது.
- issue: וְחֵי נַפְשְׁךָ என்பதில் נפשׁ-இன் பொருள்
  choice: நீர் உயிரோடிருப்பதும்
  alternative: உமது ஆத்துமா உயிரோடிருப்பதும்
  rationale: இங்குள்ள ஆணைச் சூத்திரத்தில் נפשׁ முழு நபரின் உயிரைக் குறிக்கிறது; மனித இயல்பைப் பற்றிய குறிப்பிட்ட இருபகுப்புக் கோட்பாட்டை உரைக்குள் இறக்காமல் சூழல்சார் பொருள் காக்கப்படுகிறது.
- issue: אִם אֶעֶזְבֶךָּ என்ற ஆணை அமைப்பின் மறைமுக எதிர்மறை
  choice: நான் உம்மைவிட்டு விலகமாட்டேன்
  alternative: நான் உம்மைவிட்டு விலகினால்...
  rationale: எபிரெய ஆணைகளில் אִם உடன் வரும் நிபந்தனை, சொல்லப்படாமல் விடப்பட்ட சாபம் அல்லது தண்டனையை முன்வைத்து உறுதியான மறுப்பைத் தெரிவிக்கிறது. தமிழில் வெறும் ‘விலகினால்’ என்பது முழுமையற்றதாகத் தோன்றும்; ஆகவே அதன் தொடர்பாடல் பொருள் வெளிப்படையாக வழங்கப்படுகிறது, ஆனால் விரிவான சாபம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. எலியா வயதிலும் அதிகாரத்திலும் மேலானவராக எலிசாவிடம் பேசுவதால் ‘தங்கியிரு’ என ஒருமை; எலிசா மரியாதையுடன் ‘நீர்/உம்மை’ எனப் பதிலளிக்கிறார். ஆணைச் சூத்திரத்தின் அந்நியமான வலிமை முற்றிலும் அழியாமல், அதன் பொருள் இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது.
