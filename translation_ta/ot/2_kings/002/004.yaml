revisions:
- from: 'எலியா அவனிடம், “எலிசா, தயவுசெய்து இங்கேயே தங்கியிரு; ஏனெனில் யாவே என்னை எரிகோவுக்கு அனுப்பியிருக்கிறார்” என்றார். அதற்கு அவன், “யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, நீர் உயிரோடிருப்பதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்: நான் உம்மைவிட்டு விலகமாட்டேன்” என்றான். ஆகவே அவர்கள் எரிகோவுக்கு வந்தார்கள்.'
  to: எலியா அவனிடம், “எலிசா, தயவுசெய்து இங்கேயே தங்கியிரு; ஏனெனில் யாவே என்னை எரிகோவுக்கு அனுப்பியிருக்கிறார்” என்றார். அதற்கு அவன், “யாவே உயிரோடிருப்பதுபோலவும், நீர் உயிரோடிருப்பதுபோலவும், நான் உம்மைவிட்டுப் பிரியமாட்டேன்” என்றான். பின் அவர்கள் எரிகோவுக்கு வந்தார்கள்.
  rationale: The revision removes an added interpretive phrase from the oath, retains its idiomatic force in direct Tamil, uses a more contextually fitting equivalent for “leave,” and renders the final wayyiqtol as straightforward narrative sequence rather than causation. No footnotes are required because the verse can be translated clearly without obscuring a disputed textual issue.
