base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: ta
  text: அங்கிருந்து அவர் பெத்தேலுக்கு ஏறிச் சென்றார். அவர் வழியில் ஏறிச் சென்றுகொண்டிருந்தபோது, நகரத்திலிருந்து சிறுவர்கள்[a] வெளியே வந்து அவரைக் கேலி செய்து, “ஏறிப்போ, மொட்டைத்தலையா! ஏறிப்போ[b], மொட்டைத்தலையா!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளம் பையன்கள்” அல்லது “வாலிபர்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயத் தொடர் மிகச் சிறிய குழந்தைகளை மட்டுமல்லாமல், இளம் ஆண்களை இன்னும் விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இருமுறை சொல்லப்படும் “ஏறிப்போ” என்பது வெறும் கேலியாக இருக்கலாம்; ஆனால் எலியா மேலே எடுத்துக்கொள்ளப்பட்ட நிகழ்வையும் அது மறைமுகமாகச் சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்
  rationale: עלה என்பதன் ‘மேலே செல்/ஏறு’ என்ற பொருளையும் தொடர்ச்சியான எபிரெயக் கதைநடையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: அவர் வழியில் ஏறிச் சென்றுகொண்டிருந்தபோது
  rationale: இடைப்பட்டு நடந்துகொண்டிருந்த செயலைக் காட்டும் பெயரெச்சத் தொடரைத் தெளிவாகத் தருவதோடு, பின்னர் வரும் עלה வினையோடும் சொல் தொடர்பைப் பேணுகிறது.
- source_word: נְעָרִים קְטַנִּים
  choice: சிறுவர்கள்
  rationale: இளம் ஆண்களைக் குறிக்கும் தொடரை இயல்பான நவீன தமிழில் தருகிறது; வயது வரம்பு துல்லியமற்றிருப்பதால் அதன் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָצְאוּ מִן הָעִיר
  choice: நகரத்திலிருந்து வெளியே வந்து
  rationale: יצא என்பதன் வெளியே வருதல் என்ற இயக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: அவரைக் கேலி செய்து
  rationale: Hitpael வடிவம் வெளிப்படுத்தும் இகழ்ச்சியான கேலியைத் தெளிவாகவும் அளவான வலிமையுடனும் தருகிறது.
- source_word: עֲלֵה
  choice: ஏறிப்போ
  rationale: கட்டளை வடிவத்தையும் ‘ஏறு/மேலே போ’ என்ற அடிப்படைப் பொருளையும், முன்பு வந்த עלה உடனான சொல்லொற்றுமையையும் பேணுகிறது.
- source_word: קֵרֵחַ
  choice: வழுக்கைத்தலையா
  rationale: ‘வழுக்கையானவன்’ என்ற பொருளை நேரடியான இகழ்ச்சி விளியாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கேலியில் இருமுறை வரும் עֲלֵה என்பதன் சாத்தியமான மறைசுட்டு
  choice: முதன்மை உரையில் ‘ஏறிப்போ’ என்று நேரடியாக மொழிபெயர்த்து, மறைசுட்டை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘இங்கிருந்து போய்விடு’ என்ற வெறும் விரட்டலாகவோ, ‘எலியாவைப் போல மேலே போ’ என்ற எலியாவின் எடுத்துக்கொள்ளப்படுதலுக்கான நேரடி சுட்டாகவோ விளக்குதல்.
  rationale: எபிரெயச் சொல் தெளிவாக ‘ஏறு/மேலே போ’ என்கிறது; ஆனால் கேலியின் துல்லியமான நோக்கம் விவாதத்திற்குரியது. ஆகவே தெளிவின்மை உரையில் பாதுகாக்கப்பட்டு, சாத்தியமான மறைசுட்டு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: נְעָרִים קְטַנִּים குறிக்கும் வயதும் அதனால் வாசகர் ஊகிக்கக்கூடிய பொறுப்புணர்வும்
  choice: முதன்மை உரையில் ‘சிறுவர்கள்’ என்று வைத்து, விரிவான வயது வாய்ப்பை அடிக்குறிப்பில் தெரிவித்தல்.
  alternative: ‘இளம் பையன்கள்’, ‘வாலிபர்கள்’ அல்லது ‘இளைஞர்கள்’.
  rationale: இந்த எபிரெயத் தொடர் இளம் ஆண்களைக் குறித்தாலும், மிகச் சிறிய குழந்தைகளை மட்டுமே கட்டாயமாகக் குறிக்காது. எந்த வயதையும் அல்லது குற்றப்பொறுப்பையும் மொழிபெயர்ப்பு தீர்மானிக்காமல் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கேலிச் சொல்லின் தாக்கத்தைப் பேண ‘வழுக்கைத்தலையா’ என்ற நேரடி விளி வைக்கப்பட்டுள்ளது. עלה மீண்டும் வருவது ‘ஏறிச் சென்றார்/ஏறிப்போ’ என்பதன் மூலம் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது; வயதும் மறைசுட்டும் குறித்த மூலத்தின் தெளிவின்மை அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளது.
