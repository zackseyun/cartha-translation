  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் நன்கு பிரதிபலிக்கப்படுகின்றன: எரிகோவில் இருந்த இறைவாக்கினர் குழு, எலிசாவை அணுகுதல், யாவே என்ற இறைப்பெயர், ‘உன் தலைக்கு மேலிருந்து’ என்ற உருவகம், எலிசாவின் ‘நானும் அறிவேன்’ மற்றும் பன்மைக் கட்டளை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘இறைவாக்கினர்களின் சீடர்கள்’ என்பது בְנֵי הַנְּבִיאִים என்ற மரபுத்தொடருக்குச் சூழலுக்கு ஏற்ற, இயல்பான தமிழ் வடிவமாகும்.'
  naturalness: உரை நவீன நிலையான தமிழில் தெளிவாகவும் கதைநடைக்கு ஏற்றதாகவும் உள்ளது. ஆனால் அடிக்குறி உருவகத் தொடருக்குப் பதிலாக வினைச்சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது; அதை நேரடியாக ‘உன் தலைக்கு மேலிருந்து’ என்பதோடு இணைப்பது வாசகருக்குத் துல்லியமானது. அடிக்குறிப்பின் மாற்று வாசகமும் சிறிது இயல்பாக்கப்படலாம்.
