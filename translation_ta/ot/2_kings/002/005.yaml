base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ta
  text: அப்போது எரிகோவில் இருந்த இறைவாக்கினர்களின் சீடர்கள் எலிசாவை அணுகி, அவரிடம், “இன்று யாவே உன் எஜமானை உன் தலைக்கு மேலிருந்து[a] எடுத்துக்கொள்கிறார் என்பது உனக்குத் தெரியுமா?” என்று கேட்டார்கள். அதற்கு அவர், “நானும் அறிவேன்; அமைதியாக இருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு மேலானவராக இருக்கும் நிலையிலிருந்து.” எபிரெய மொழியில் சொற்படியாக, “உன் தலைக்கு மேலிருந்து” என்று உள்ளது; ஒருவர்மேல் அதிகாரம் வகிப்பவர் அகற்றப்படுவதை இது குறிக்கலாம்.
    reason: மூல மொழியின் உருவகத்தையும் அதன் சாத்தியமான மரபுத்தொடர் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: அணுகி
  rationale: נגשׁ என்பதன் அணுகுதல் என்ற இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְנֵי הַנְּבִיאִים
  choice: இறைவாக்கினர்களின் சீடர்கள்
  rationale: எபிரெய மொழியின் சொற்படியான ‘இறைவாக்கினர்களின் மகன்கள்’ என்பது தமிழில் உயிரியல் உறவைத் தவறாக உணர்த்தக்கூடும். சூழலில் இறைவாக்கினர் குழுவைச் சேர்ந்த சீடர்களைக் குறிக்கும் மரபுத்தொடரின் பொருளை இத்தேர்வு இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: எரிகோவில் இருந்த
  rationale: அக்குழு எரிகோவில் இருந்ததை உறவுப்பெயர் வாக்கியமாகத் தெளிவாகக் காட்டுகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: הֲיָדַעְתָּ
  choice: உனக்குத் தெரியுமா
  rationale: இச்சூழலில் வினை வடிவம் கடந்தகாலத்தில் அறிந்துகொண்டதைக் காட்டாமல் தற்போதைய விழிப்புணர்வைக் கேட்கிறது; இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֹקֵחַ
  choice: எடுத்துக்கொள்கிறார்
  rationale: நிகழ்கால வினையெச்சத்தின் உடனடியான, நெருங்கிவரும் செயல் உணர்வைப் பாதுகாக்கிறது; ‘இன்று’ என்பதால் அதன் அண்மை தெளிவாகிறது.
- source_word: אֲדֹנֶיךָ
  choice: உன் எஜமானை
  rationale: இங்கு எலியாவுக்கும் எலிசாவுக்கும் இடையிலான மனித அதிகார மற்றும் சீடத்துவ உறவைக் குறிக்கிறது; இறையியல் பட்டமாகத் தவறாகப் புரியாமல் செய்கிறது.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: உன் தலைக்கு மேலிருந்து
  rationale: எபிரெய மொழியின் வெளிப்படையான உருவகத்தை விளக்கமாக மாற்றாமல் முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: நானும் அறிவேன்
  rationale: גַּם என்பதன் ‘உம்’ பொருளையும் வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும் சுருக்கமான, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: הֶחֱשׁוּ
  choice: அமைதியாக இருங்கள்
  rationale: பலரைக் குறித்த பன்மை கட்டளையின் பொருளையும் எலிசாவின் சுருக்கமான பதிலின் வலிமையையும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מֵעַל רֹאשֶׁךָ என்ற மரபுத்தொடரை முதன்மை உரையில் விளக்குவதா
  choice: ‘உன் தலைக்கு மேலிருந்து’ என்ற தெளிவான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உனக்கு மேலானவராக இருப்பதிலிருந்து’ அல்லது ‘உன்னை வழிநடத்துவதிலிருந்து’
  rationale: இத்தொடர் எலியாவின் அதிகார நிலை அகற்றப்படுவதைக் குறிக்கலாம்; ஆனால் மூலத்தின் உருவகம் அதைவிடத் திறந்துள்ளது. எனவே குறிப்பிட்ட விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. குழுவை நோக்கிய பன்மைக் கட்டளை ‘இருங்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
