base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: ta
  text: 'பின்பு அவர் தண்ணீர் வெளிப்படும் இடத்துக்குச் சென்று[a], அங்கே உப்பை எறிந்தார். அவர், “யாவே இவ்வாறு கூறுகிறார்: ‘இந்தத் தண்ணீரை நான் குணமாக்கினேன். இனி இதிலிருந்து மரணமோ கருச்சிதைவை உண்டாக்குதலோ[b] வராது’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீரூற்றுக்குச் சென்று.”
    reason: lexical_alternative
  - marker: b
    text: “கருச்சிதைவை உண்டாக்குதல்” என்பதற்கான எபிரெயச் சொல், பிள்ளையிழப்பை உண்டாக்குதல் அல்லது மலட்டுத்தன்மை என்ற பொருளையும் குறிக்கலாம்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: தண்ணீர் புறப்படும் இடம்
  rationale: இந்தச் சொற்றொடர் தண்ணீர் வெளியே வரும் மூல இடத்தைக் குறிக்கிறது. ‘தண்ணீர் புறப்படும் இடம்’ என்பது எபிரெய உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘நீரூற்று’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֶלַח
  choice: உப்பு
  rationale: சூழலில் விரிவாக்கம் தேவையில்லாத நேரடி இயல்பான இணைச்சொல்.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; தெய்வீகப் பெயர் ஒரு பட்டத்தால் மாற்றப்படவில்லை.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: இந்தத் தண்ணீரை நான் குணமாக்கிவிட்டேன்
  rationale: רפא என்பதன் ‘குணமாக்கு’ என்ற உயிருள்ள உருவகத்தைப் பாதுகாக்கிறது; தண்ணீர் குடிக்கத் தகுந்ததாக மாற்றப்பட்டது என்று விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: இனி இதிலிருந்து … ஏற்படாது
  rationale: தீய விளைவுகள் அந்த நீரிலிருந்து இனி வராது என்ற மூலமொழியின் இடம்/மூலம் சார்ந்த கருத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מָוֶת
  choice: மரணம்
  rationale: தண்ணீரால் உண்டாகும் மரணம் என்று உரை மறைமுகமாகக் காட்டினாலும், மூலத்தின் பொதுவான சொல்லைச் சுருக்காமல் நேரடியாகத் தருகிறது.
- source_word: מְשַׁכָּלֶת
  choice: கருச்சிதைவை உண்டாக்குவது
  rationale: שׁכל வேரிலிருந்து வந்த இச்சொல் சந்ததி இழப்பை உண்டாக்குவதைக் குறிக்கலாம். காரணத்தைச் சுட்டும் எபிரெய வடிவத்தையும் தமிழில் பிரதிபலிக்கிறது; பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: தண்ணீரை ‘குணமாக்குதல்’ என்ற தெய்வீக அறிவிப்பு
  choice: உருவகத்தை நேரடியாகக் காத்தல்
  alternative: தண்ணீரைக் குடிக்கத் தகுந்ததாக மாற்றினேன்
  rationale: மூலவசனம் செயல் எவ்வாறு நிகழ்ந்தது அல்லது அதன் எல்லா விளைவுகளையும் விளக்கவில்லை; ‘குணமாக்கினேன்’ என்ற உருவகமே தெய்வீக அறிவிப்பின் வலிமையையும் திறந்த பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் நேரடித் தன்மை காக்கப்பட்டுள்ளது; அரிதான எபிரெயச் சொல்லின் பொருள் வரம்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
