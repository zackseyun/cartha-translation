base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: ta
  text: அப்போது எலிசா, எலியாவிடமிருந்து விழுந்திருந்த அவரது மேலங்கியை எடுத்து, தண்ணீரை அடித்து, “எலியாவின் கடவுளாகிய யாவே எங்கே?” என்று சொன்னான்.[a] பின்னர் அவன் தண்ணீரை மீண்டும் அடித்தான்; தண்ணீர் ஒருபுறமும் மறுபுறமுமாகப் பிரிந்தது. எலிசா அதைக் கடந்து சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அவரே” அல்லது “அவனும்” என மொழிபெயர்க்கப்படக்கூடிய மிகச் சுருக்கமான ஒரு தொடர் இங்கே உள்ளது. அது யாவேயை வலியுறுத்துவதாகவும், அல்லது எலிசாவின் அடுத்த செயலை வலியுறுத்துவதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: மேலங்கி
  rationale: எலியாவின் தனித்துவமான வெளிப்புற ஆடையைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் காட்சிப்பூர்வமாகவும் உள்ளது.
- source_word: נָפְלָה מֵעָלָיו
  choice: எலியாவிடமிருந்து கீழே விழுந்திருந்த
  rationale: முந்தைய நிகழ்வைச் சுட்டும் தொடர்புத் தொடரைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: தண்ணீரை அடித்தான்
  rationale: נכה என்பதன் நேரடியான செயலை இயல்பான தமிழில் தருகிறது; எபிரெயச் சொல்லின் பன்மை வடிவம் தமிழில் கூட்டுப்பொருளான ஒருமையாக இயல்பாக வருகிறது.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இது இருப்பிடம் அல்லது உடனிருப்பைப் பற்றிய நேரடியான வினா; தெய்வீகச் செயலை வேண்டுவதாக விரித்துரைக்காமல் மூலத்தின் வடிவத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தைப் பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெயத் தனிப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: எலியாவின் கடவுளாகிய
  rationale: எபிரெயக் கட்டுநிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַף הוּא
  choice: அவனும்
  rationale: சுருக்கமான எபிரெயச் சொற்றொடரின் வலியுறுத்தும் ‘கூட/உம்’ பொருளைப் பேணுகிறது; அதன் இணைப்பு மற்றும் சுட்டுப்பொருள் குறித்த ஐயத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: தண்ணீர் ஒருபுறமும் மறுபுறமுமாகப் பிரிந்தது
  rationale: தண்ணீர் எதிரெதிர் திசைகளில் விலகியதைச் சொல்லும் எபிரெய மொழிமரபைத் தெளிவான தமிழில் தருகிறது.
- source_word: וַיַּעֲבֹר
  choice: அதைக் கடந்து சென்றான்
  rationale: ஆற்றைக் கடக்கும் இச்சூழலில் עבר என்பதன் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் திருநாமத்தைப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பேணுகிறது.
- issue: אַף הוּא என்ற சுருக்கமான தொடரின் பொருள் மற்றும் இணைப்பு
  choice: இரண்டாவது ‘அடித்தான்’ என்பதோடு இணைத்து ‘அவனும்’ எனத் தரப்பட்டது; ஐயம் அடிக்குறிப்பில் பேணப்பட்டது
  alternative: ‘அவரே’ என்று யாவேயை வலியுறுத்துவது; அல்லது மொழிபெயர்ப்பில் வெளிப்படையாகக் காட்டாமல் விடுவது
  rationale: மசோரா பிரிப்பின்படி இத்தொடர் எலியாவின் கடவுளைப் பற்றிய கேள்விக்குப் பின்வருகிறது; ஆயினும் அதன் மிகச் சுருக்கமான வடிவம், அது எலிசாவின் அடுத்த செயலை வலியுறுத்துகிறதா அல்லது யாவேயைக் குறிக்கிறதா என்ற பதற்றத்தை விடுகிறது. பிரதான உரை இயல்பான தொடரைத் தருகிறது; அடிக்குறிப்பு மாற்று புரிதலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எலிசா முதலில் தண்ணீரை அடித்ததும், கேள்விக்குப் பின் மீண்டும் அடித்ததும் மூலத்தின் இரு வினைச்சொற்களுக்கேற்ப வெளிப்படையாகப் பேணப்பட்டுள்ளன.
