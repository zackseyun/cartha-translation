base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: ta
  text: அப்போது நகரத்து ஆண்கள் எலிசாவிடம்[a], “இதோ, என் ஆண்டவரே, தாங்கள் காண்கிறபடியே, நகரம் அமைந்துள்ள இடம் நன்றாக இருக்கிறது; ஆனால் தண்ணீர் கெட்டதாக இருக்கிறது, நிலமோ கருச்சிதைவுகளை ஏற்படுத்துகிறது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலம் வேளாண்மைக்கு பலனற்றதாக இருக்கிறது” என்றும் மொழிபெயர்க்கலாம். “கருச்சிதைவுகளை ஏற்படுத்துகிறது” என்பதற்கான எபிரெயச் சொல் சந்ததி இழப்பை ஏற்படுத்துவதைக் குறிக்கிறது; இச்சூழலில் அது வேளாண் விளைச்சலின்மையையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்கள்
  rationale: எபிரெயச் சொற்றொடர் வெளிப்படையாக ஆண்பால் பன்மையில் இருப்பதால், பொதுவான ‘மக்கள்’ என்பதற்குப் பதிலாக ‘ஆண்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; נָא உரையை மென்மையாக்குகிறது. உரையாடலில் இயல்பான ‘இதோ’ கவன ஈர்ப்பைத் தருகிறது; மரியாதை அடுத்துள்ள அழைப்புமுறையிலும் வெளிப்படுகிறது.
- source_word: מוֹשַׁב הָעִיר
  choice: நகரம் அமைந்துள்ள இடம்
  rationale: இங்கு מוֹשָׁב என்பது நகரத்தின் இருப்பிடம் அல்லது அமைவிடத்தைக் குறிக்கிறது; ‘அமைந்துள்ள இடம்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: טוֹב
  choice: நல்லதாக இருக்கிறது
  rationale: நகரத்தின் அமைவிடத்தைக் குறித்த சாதகமான மதிப்பீட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: எங்கள் ஆண்டவர் காண்கிறபடி
  rationale: אֲדֹנִי எலிசாவை நோக்கிய சமூக மரியாதை அழைப்பு; பேச்சாளர்கள் பன்மையாக இருப்பதால் தமிழில் இயல்பாக ‘எங்கள் ஆண்டவர்’ என வழங்கப்படுகிறது. ‘காண்கிறபடி’ எபிரெய வடிவை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְהַמַּיִם רָעִים
  choice: ஆனால் தண்ணீர் கெட்டதாக இருக்கிறது
  rationale: நல்ல அமைவிடத்துடன் மாறுபடுவதால் வாவ் ‘ஆனால்’ எனப் பொருத்தமாக வழங்கப்படுகிறது; מַיִם வடிவில் பன்மையாக இருந்தாலும் தமிழில் ‘தண்ணீர்’ இயல்பான கூட்டுப்பெயர்.
- source_word: וְהָאָרֶץ
  choice: நிலமோ
  rationale: אֶרֶץ இங்கு உள்ளூர் நிலப்பகுதி அல்லது விளைநிலத்தைக் குறிக்கலாம்; ‘நிலம்’ அந்தப் பொருள் அகலத்தைப் பாதுகாக்கிறது. ‘-ஓ’ முந்தைய குறையுடன் இணைந்த இன்னொரு விளைவை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: מְשַׁכָּלֶת
  choice: கருச்சிதைவை உண்டாக்குகிறது
  rationale: שׁכל என்பதன் காரணவினை வடிவம் சந்ததி இழப்பை உண்டாக்கும் கருத்தைத் தருகிறது. வேளாண் பலனின்மையையும் சூழலில் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: எலிசாவை நோக்கிய אֲדֹנִי என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: எங்கள் ஆண்டவர்
  alternative: எங்கள் எஜமான்
  rationale: இது தெய்வீகப் பட்டம் அல்ல; எலிசாவுக்குக் காட்டப்படும் சமூக மரியாதை. ‘ஆண்டவர்’ மரியாதை அழைப்பைத் தக்கவைக்கிறது; சூழல் இதை மனிதருக்கான அழைப்பாகத் தெளிவுபடுத்துகிறது.
- issue: מְשַׁכָּלֶת குறிக்கும் இழப்பின் வரம்பு
  choice: முதன்மை உரையில் ‘கருச்சிதைவை உண்டாக்குகிறது’
  alternative: ‘பலனற்றதாக இருக்கிறது’
  rationale: காரணவினையின் தெளிவான சந்ததி இழப்பு நுணுக்கத்தை முதன்மை உரை பாதுகாக்கிறது; மனித, விலங்கு அல்லது வேளாண் பலனின்மை என்ற பரந்த சூழல் சாத்தியத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நகரம் அமைந்துள்ள இடம்’ என்பது மூலத்தின் அமைவிடக் கருத்தை இயல்பாகத் தருகிறது. மூலத்தில் உள்ள உயிரியல் இழப்பு மற்றும் நிலத்தின் பலனின்மை ஆகிய இரு சாத்தியங்களும் முதன்மை உரை–அடிக்குறிப்பு வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
