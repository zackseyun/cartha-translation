  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: ta
  text: அதற்கு அவர், “நீ கடினமான ஒன்றைக் கேட்டிருக்கிறாய். நான் உன்னிடமிருந்து எடுத்துக்கொள்ளப்படுவதை நீ கண்டால்[a], நீ கேட்டபடியே உனக்குக் கிடைக்கும்; இல்லையென்றால் கிடைக்காது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னிடமிருந்து எடுத்துக்கொள்ளப்படும் போது நீ என்னைக் கண்டால்.”
    reason: לֻקָּח என்ற செயப்பாட்டு வடிவத்துக்கும் תִּרְאֶה என்ற வினைக்கும் இடையிலான தொடர்பை, நிகழும் செயலைக் காண்பதாகவோ அந்த நேரத்தில் அவரைக் காண்பதாகவோ தமிழில் வெளிப்படுத்தலாம்.
