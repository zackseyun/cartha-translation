  choice: நான் உன்னிடமிருந்து எடுத்துக்கொள்ளப்படுவதை நீ கண்டால்
  rationale: לֻקָּח என்பது לקח என்பதன் செயல்பாட்டு முகவர் குறிப்பிடப்படாத செயப்பாட்டு வடிவம். ‘எடுத்துக்கொள்ளப்படுவதை’ என்பது அந்தச் செயப்பாட்டையும் நிகழ்வைக் காண்பதே நிபந்தனை என்பதையும் காக்கிறது.
- source_word: יְהִי לְךָ כֵן
  choice: நீ கேட்டபடியே உனக்குக் கிடைக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அப்படியே உனக்கு ஆகும்’ என்றாலும், முந்தைய கோரிக்கையே குறிக்கப்படுவதால், தமிழில் தெளிவாகவும் இயல்பாகவும் அதன் பொருளை வெளிப்படுத்துகிறது.
- source_word: וְאִם אַיִן לֹא יִהְיֶה
  choice: இல்லையென்றால் கிடைக்காது
  rationale: אַיִן இங்கு ‘நீ அதைக் காணாவிட்டால்’ என்ற விடுபட்ட கருத்தைக் கொண்டுள்ளது. கோரப்பட்ட ஒன்று கிடைக்காது என்பதே לֹא יִהְיֶה என்பதன் சூழல் பொருள்.
