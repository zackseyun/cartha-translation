    issue: ‘ஐம்பது பேர்’ does not express the masculine noun אִישׁ.
    rationale: The source specifically says ‘fifty men,’ not merely ‘fifty people.’ ‘ஐம்பது ஆண்களை’ preserves this detail in idiomatic Tamil.
