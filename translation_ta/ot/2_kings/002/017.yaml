  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெட்கமடையும் அளவுக்கு’ என்ற மொழியாக்கம் மூலத்தின் நுட்பமான சமூகச் சங்கடத்தைத் தீர்த்துவிடாமல் காக்கிறது; மாற்று நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
