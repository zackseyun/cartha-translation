  naturalness: The register is clear modern standard Tamil. Recasting the final two actions as finite clauses is slightly more natural and more closely follows the Hebrew narrative sequence than the concessive-sounding ‘தேடியும்’.
  terminology: ‘வற்புறுத்திக்கொண்டே இருந்தார்கள்’ and ‘வெட்கமடையும் அளவுக்கு’ are appropriate. The footnote properly preserves the literal shame language and the alternative nuance ‘சங்கடம்’.
