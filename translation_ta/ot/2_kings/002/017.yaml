  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: ta
  text: ஆனால் அவர் வெட்கமடையும் அளவுக்கு[a] அவர்கள் அவரை வற்புறுத்திக்கொண்டே இருந்தார்கள். அதனால் அவர், “அனுப்புங்கள்” என்றார். அவர்கள் ஐம்பது ஆண்களை அனுப்பினார்கள். அவர்கள் மூன்று நாட்கள் தேடினார்கள்; ஆனால் அவரைக் கண்டுபிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சங்கடமடையும் அளவுக்கு.” எபிரெய மொழியில் சொல்லுக்குச் சொல் “அவர் வெட்கமடையும் வரை” என்று உள்ளது; அவர்கள் திரும்பத் திரும்ப வற்புறுத்தியதால் ஏற்பட்ட சமூக அழுத்தத்தை இது விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: அவர்கள் அவரை வற்புறுத்திக்கொண்டே இருந்தார்கள்
  rationale: פצר என்பது ஒருவரை விடாமல் நெருக்கி வற்புறுத்துவதைக் குறிக்கிறது. தொடர்ச்சியான செயலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘வற்புறுத்திக்கொண்டே இருந்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַד בֹּשׁ
  choice: அவர் வெட்கமடையும் அளவுக்கு
  rationale: בוש என்பதன் அடிப்படைப் பொருள் வெட்கம் அல்லது சங்கடம் அடைதல். அவர்களுடைய தொடர் வற்புறுத்தலால் எலிசா சமூக அழுத்தத்திற்குள்ளான நுட்பத்தையும், எபிரெயச் சொல்லின் வெளிப்படையான பொருளையும் இச்சொற்றொடர் காக்கிறது.
- source_word: שְׁלָחוּ
  choice: அனுப்புங்கள்
  rationale: இது ஆண்பால் பன்மை ஏவல் வடிவம். தேடுபவர்களை அனுப்புவதற்கு எலிசா அனுமதி அளிக்கும் சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: חֲמִשִּׁים אִישׁ
  choice: ஐம்பது பேர்
  rationale: எபிரெய உரை இங்கு ‘ஐம்பது ஆண்கள்’ என்று கூறுகிறது. நவீன தமிழில் இந்தக் குழுவைக் குறிப்பிட ‘ஐம்பது பேர்’ என்பது இயல்பானதும் பொருளுக்கு உண்மையானதும் ஆகும்; முந்தைய சூழலிலுள்ள கூடுதல் அடையாளம் இவ்வசனத்தில் சேர்க்கப்படவில்லை.
- source_word: וַיְבַקְשׁוּ שְׁלֹשָׁה יָמִים
  choice: அவர்கள் மூன்று நாட்கள் தேடியும்
  rationale: בקש இச்சூழலில் தேடுதல் என்று பொருள். ‘மூன்று நாட்கள்’ கால அளவைக் குறிக்கிறது; அடுத்துவரும் எதிர்மறை முடிவுடன் இயல்பாக இணைய ‘தேடியும்’ பயன்படுத்தப்பட்டது.
- source_word: וְלֹא מְצָאֻהוּ
  choice: அவரைக் கண்டுபிடிக்கவில்லை
  rationale: מצא என்பது கண்டுபிடித்தல். ஆண்பால் ஒருமை பின்னொட்டு எலியாவைக் குறிக்கும் ‘அவரை’ என மரியாதையான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
