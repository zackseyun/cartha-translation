  yaml_path: translation/ot/2_kings/002/020.yaml
  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: ta
  text: அவர், “எனக்குப் புதிய ஒரு சிறிய பாத்திரத்தைக் கொண்டு வாருங்கள்; அதில் உப்பைப் போடுங்கள்” என்றார். அவர்கள் அதை அவரிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: எபிரெயக் கதைநடையில் தொடர்ச்சியை அறிமுகப்படுத்தும் வழக்கமான வடிவம்; நவீன தமிழில் தேவையற்ற இணைப்புச் சொல்லின்றி இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: קְחוּ לִי
  choice: எனக்காக … கொண்டுவந்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’; ஆனால் לִי உடன் வரும் இந்தக் கட்டளைச் சூழலில் கேட்ட பொருளை அவரிடம் கொண்டுவருவதே கருத்து.
- source_word: צְלֹחִית
  choice: சிறிய பாத்திரம்
  rationale: இச்சொல் ஒரு சிறிய கொள்கலனைக் பொதுவாகக் குறிக்கிறது; அதன் வடிவம் கிண்ணமா, குடுவையா என்பது உறுதியாகாததால் ‘சிறிய பாத்திரம்’ மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: חֲדָשָׁה
  choice: புதிய
  rationale: பாத்திரத்தை நேரடியாக விவரிக்கும் பெயரடை.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: அதில் உப்பைப் போடுங்கள்
  rationale: שָׁם என்பதன் நேரடிப் பொருள் ‘அங்கே’; இங்கு முன் குறிப்பிடப்பட்ட பாத்திரத்துக்குள் என்பதே இயல்பான குறிப்பு, ஆகவே தமிழில் ‘அதில்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: அவர்கள் அதை அவரிடம் கொண்டுவந்தார்கள்
  rationale: சூழலில் கேட்ட பாத்திரத்தை எலிசாவிடம் சேர்ப்பதே செயல்; எபிரெயத்தில் மறைமுகமாக உள்ள பொருள் தமிழில் ‘அதை’ என வெளிப்படுத்தப்பட்டுள்ளது.
