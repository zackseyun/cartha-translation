base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ta
  text: அப்போது பெத்தேலில் இருந்த இறைவாக்கினரின் சீடர்கள் எலிசாவிடம் வந்து, “இன்று யாவே உன் தலைக்குமேலிருந்து[a] உன் எஜமானை எடுத்துக்கொள்ளப்போகிறார் என்பது உனக்குத் தெரியுமா?” என்று கேட்டார்கள். அதற்கு அவர், “எனக்கும் தெரியும்; அமைதியாக இருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் தலைக்குமேலிருந்து” என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பு; உன்மேல் அதிகாரமுடையவராக இருப்பவரை அகற்றுவதைக் குறிக்கும் உருவகம் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: இறைவாக்கினர்களின் சீடர்கள்
  rationale: எபிரேய ‘இறைவாக்கினர்களின் மகன்கள்’ என்பது உயிரியல் மகன்களைக் காட்டிலும் இறைவாக்கினர் குழுவைச் சேர்ந்த பயிற்சியாளர்கள் அல்லது சீடர்களைக் குறிக்கும் உறவுமுறைச் சொற்றொடர்; நவீன தமிழில் தவறான புரிதலைத் தவிர்க்க ‘சீடர்கள்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: பெத்தேலில் இருந்த
  rationale: இச்சார்பு வாக்கியம் அந்த இறைவாக்கினர் குழுவை அதன் இருப்பிடத்தால் அடையாளப்படுத்துகிறது.
- source_word: הֲיָדַעְתָּ
  choice: உனக்குத் தெரியுமா
  rationale: எபிரேய வினாவையும் சூழலில் உள்ள நிகழ்கால அறிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹקֵחַ
  choice: எடுத்துக்கொள்ளப்போகிறார்
  rationale: பங்கேற்பு வினை வடிவம் அன்றே நிகழவிருக்கும் உடனடியான செயலைக் குறிக்கிறது; தமிழில் இவ்வடிவம் அதன் நெருக்கத்தையும் எதிர்நோக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲדֹנֶיךָ
  choice: உன் எஜமானை
  rationale: இங்கு சொல் எலியாவை எலிசாவின் மேலாளர் மற்றும் ஆசிரியர் என்ற மனித உறவில் குறிக்கிறது; இறைவனுக்குரிய பட்டமாகப் புரிந்துகொள்ளப்படாதபடி ‘எஜமான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: உன் தலைக்குமேல் இருக்கும்
  rationale: ‘உன் தலைக்கு மேலிருந்து’ என்ற மூல உருவகத்தையும் அதிகார உறவையும் பிரதான உரையில் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: எனக்கும் தெரியும்
  rationale: גַּם אֲנִי என்பதிலுள்ள ‘நானும்/எனக்கும்’ என்ற பகிரப்பட்ட அறிவைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הֶחֱשׁוּ
  choice: அமைதியாக இருங்கள்
  rationale: குழுவை நோக்கிய பன்மை கட்டளையின் வலிமையையும் கண்ணியமான தமிழ் நடையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: வசனம் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: எலியா ‘தலைக்குமேல்’ இருப்பதாகக் கூறும் உருவகம்
  choice: உருவகத்தைப் பிரதான உரையில் தக்கவைத்து அடிக்குறிப்பில் அதிகார உறவை விளக்குதல்
  alternative: உனக்கு மேலான அதிகார நிலையில் இருப்பதிலிருந்து
  rationale: மூல எபிரேயத்தின் தெளிவான உருவகத்தையும் அதன் அதிகாரப் பொருளையும் ஒன்றை மற்றொன்றால் அழிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் ஒருமை ‘உன்’ மற்றும் குழுவை நோக்கிய பன்மை ‘இருங்கள்’ வேறுபடுத்தப்பட்டுள்ளன. எபிரேய உருவகம் பிரதான உரையில் வைக்கப்பட்டு அதன் உள்ளார்ந்த அதிகாரப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
