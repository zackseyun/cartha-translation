revisions:
- from: அப்போது எலியா மேலிருந்து விழுந்திருந்த அவரது மேலங்கியை[a] எலிசா எடுத்துக்கொண்டு, திரும்பிச் சென்று யோர்தானின் கரையில் நின்றார்.
  to: எலியாவிடமிருந்து விழுந்திருந்த மேலங்கியை எலிசா எடுத்தார்; திரும்பி, யோர்தானின் கரையில் நின்றார்.
  rationale: The revision makes clear that the cloak fell from Elijah, removes an unnecessary temporal addition, and corrects the footnote’s alternative garment term. It retains the explicit subject ‘எலிசா’ for clarity and preserves the Hebrew narrative sequence.
