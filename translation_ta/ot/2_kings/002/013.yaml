  text: וַ/יָּ֨רֶם֙ אֶת אַדֶּ֣רֶת אֵלִיָּ֔הוּ אֲשֶׁ֥ר נָפְלָ֖ה מֵ/עָלָ֑י/ו וַ/יָּ֥שָׁב וַֽ/יַּעֲמֹ֖ד עַל שְׂפַ֥ת הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: ta
  text: எலியாவிடமிருந்து விழுந்திருந்த மேலங்கியை எலிசா எடுத்தார்; திரும்பி, யோர்தானின் கரையில் நின்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: எடுத்துக்கொண்டு
  rationale: רוּם என்பதன் அடிப்படைப் பொருள் உயர்த்துதல்; தரையில் விழுந்த ஆடையை எடுக்கும் இச்சூழலில் ‘எடுத்துக்கொண்டு’ என்பது இயல்பான தமிழ்.
- source_word: אַדֶּרֶת
  choice: மேலங்கி
  rationale: தனித்துவமான வெளிப்புற ஆடையைக் குறிக்கும் எபிரெயச் சொல்லுக்கு நவீன தமிழில் தெளிவாகப் புரியும் இணைச்சொல்.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: மேலிருந்து விழுந்திருந்த
  rationale: מֵעָלָיו என்பது ‘அவர்மேலிருந்து’ என்ற இடவியல் பொருளைக் கொண்டது; விழுதல் பிரதான செயல்களுக்கு முன் நிகழ்ந்ததை ‘விழுந்திருந்த’ காட்டுகிறது.
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוּב என்பதன் திரும்புதல் என்ற இயக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றார்
  rationale: עמד என்பதன் நேரடியான பொருளை மரியாதைப் பன்மை நடையில் தருகிறது.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: யோர்தானின் கரையில்
  rationale: שָׂפָה ஆற்றின் சூழலில் ‘கரை’ என்று இயல்பாகப் பொருள்படும்; ‘யோர்தான்’ நிலைபெற்ற தமிழ் பெயர்வடிவம்.
theological_decisions:
- issue: வினைச்சொல் ‘எடுத்தார்’ என்பதற்கான வெளிப்படையான எழுவாய்
  choice: எலிசா என்ற பெயரை வெளிப்படையாகச் சேர்த்தல்
  alternative: எபிரெயத்தைப் போல ‘அவர்’ என்ற மறைமுக எழுவாயை மட்டும் வைத்தல்
  rationale: எபிரெயில் முந்தைய வசனங்களின் சூழலால் எழுவாய் எலிசா என்பது தெளிவு. தனி வசனமாக வாசிக்கும் தமிழருக்கும் குழப்பமின்றி இருக்கப் பெயரைச் சேர்ப்பது பொருளை மாற்றாமல் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். பெயர்களுக்கு மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; கதைநடையின் செயல்வரிசை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
