base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: ta
  text: அவர்கள் அவரிடம் திரும்பி வந்தபோது, அவர் எரிகோவில் தங்கியிருந்தார்[a]. அவர் அவர்களிடம், “போக வேண்டாம் என்று நான் உங்களிடம் சொல்லவில்லையா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அவர் எரிகோவில் உட்கார்ந்திருந்தார்.”
    reason: יֹשֵׁב என்ற எபிரெயச் சொல்லின் ‘உட்கார்ந்திருத்தல்’ என்ற நேரடிப் பொருளையும், சூழலுக்கேற்ற ‘தங்கியிருத்தல்’ என்ற பொருளையும் வாசகருக்குத் தெரியப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: அவர்கள் அவரிடம் திரும்பி வந்தபோது
  rationale: שׁוב என்பதன் இயல்பான பொருள் ‘திரும்பி வருதல்’. தொடர்ந்துவரும் சூழ்நிலைக் கூற்றுடன் உள்ள காலத் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட, தொடக்க வாவ் தொடரை ‘திரும்பி வந்தபோது’ என்று வழங்குகிறது.
- source_word: וְהוּא יֹשֵׁב
  choice: அவர் தங்கியிருந்தார்
  rationale: יֹשֵׁב என்பதற்கு ‘உட்கார்ந்திருந்தார்’, ‘தங்கியிருந்தார்’, ‘வசித்திருந்தார்’ ஆகிய பொருள்கள் வரலாம். தேடிச் சென்றவர்கள் திரும்பும்வரை எலிசா எரிகோவிலேயே இருந்தார் என்பதே இங்கு முதன்மையான சூழ்நிலை; ஆகவே ‘தங்கியிருந்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது. நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִּירִיחוֹ
  choice: எரிகோவில்
  rationale: இடப்பெயரையும் בְּ முன்னிடைச்சொல்லையும் நவீனத் தமிழில் வழக்கமான முறையில் வழங்குகிறது.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: אָמַר என்ற பொதுவான பேச்சு வினைச்சொல்லையும் அதன் பன்மை மறைமுகப் பொருளையும் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வழங்குகிறது.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: நான் உங்களிடம் சொல்லவில்லையா?
  rationale: הֲלוֹא ஒப்புதலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. ‘சொல்லவில்லையா?’ என்பது அதன் நினைவூட்டும், மென்மையாகக் கடிந்துகொள்ளும் வலிமையைத் தமிழில் காக்கிறது.
- source_word: אַל תֵּלֵכוּ
  choice: போக வேண்டாம்
  rationale: אַל உடன் வரும் வினை வடிவம் தடை அல்லது வேண்டாமை கட்டளையைத் தெரிவிக்கிறது. மேற்கோளுக்குள் ‘போக வேண்டாம்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
