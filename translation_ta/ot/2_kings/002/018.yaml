translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையானாலும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எலிசா என்பது சூழலால் தெளிவாக இருப்பதால், மூலத்தில் உள்ளபடியே ‘அவர்’ என வைக்கப்பட்டுள்ளது. வினாவிலுள்ள கடிந்துகொள்ளும் தொனி மிகைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
