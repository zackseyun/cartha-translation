base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: ta
  text: எலிசா எலியாவைப் பார்த்துக்கொண்டிருந்தான்; அவன், “என் தந்தையே, என் தந்தையே! இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்!” என்று கூக்குரலிட்டுக்கொண்டிருந்தான். அதன்பின் அவன் எலியாவை மீண்டும் காணவில்லை. அப்போது அவன் தன் உடைகளைப் பற்றிப் பிடித்து, அவற்றை இரு துண்டுகளாகக் கிழித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאֶה
  choice: பார்த்துக்கொண்டே
  rationale: எபிரெயப் பங்கேற்புவினை நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; எலிசா நிகழ்வைக் கவனித்துக்கொண்டிருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְצַעֵק
  choice: கூக்குரலிட்டுக்கொண்டிருந்தான்
  rationale: பங்கேற்புவினையின் தொடர்நிலை உணர்வையும், எலிசாவின் ஆழ்ந்த உணர்ச்சியையும் காக்கிறது.
- source_word: אָבִי אָבִי
  choice: என் தந்தையே, என் தந்தையே!
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் உணர்ச்சிமிக்க இரட்டிப்பையும் நேரடியாகக் காக்கிறது; இது உயிரியல் தந்தைத்துவத்தை அவசியம் குறிக்காது.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்
  rationale: ‘தேர்’ என்ற ஒருமையையும் ‘குதிரைவீரர்கள்’ என்ற பன்மையையும், ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் முடிந்தவரை நேரடியாகக் காக்கிறது.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: அதன்பின் அவன் எலியாவை மீண்டும் காணவில்லை
  rationale: ‘இனி/மீண்டும் காணவில்லை’ என்ற நிறுத்த உணர்வை இயல்பான தமிழில் தருகிறது; தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘எலியாவை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: தன் உடைகளைப் பற்றிப் பிடித்து
  rationale: எலிசா தனது உடைகளையே பிடித்தான் என்பதைத் தமிழின் தற்சுட்டு ‘தன்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: அவற்றை இரு துண்டுகளாகக் கிழித்தான்
  rationale: துக்கத்தின் அடையாளமாக உடைகளைக் கிழித்த செயலும் அதன் இருபகுதி விளைவும் தெளிவாகத் தரப்படுகின்றன.
theological_decisions:
- issue: “இஸ்ரவேலின் தேரும் அதன் குதிரைவீரர்களும்” என்ற எலிசாவின் கூக்குரலின் பொருள்
  choice: முதன்மை உரையில் உருவகத்தை விளக்காமல் நேரடி வியப்புக் கூற்றாக வைத்தல்
  alternative: இது இஸ்ரவேலின் உண்மையான பாதுகாப்பாக எலியாவைக் குறிப்பிடலாம்; அல்லது எலிசா கண்ட பரலோகத் தேர் மற்றும் குதிரைவீரர்களைக் குறிப்பிடலாம்.
  rationale: எபிரெயச் சொற்றொடர் இரு புரிதல்களுக்கும் இடமளிக்கிறது. ஆகவே முதன்மை உரை எந்த விளக்கத்தையும் தீர்மானமாகத் திணிக்காமல், பொருளியல் மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான கதைநடை. தொடர்நிலை எபிரெயப் பங்கேற்புவினைகள் தமிழின் ‘-க்கொண்டே / -க்கொண்டிருந்தான்’ அமைப்புகளால் வெளிப்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
