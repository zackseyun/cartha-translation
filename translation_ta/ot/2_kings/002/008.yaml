base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: ta
  text: அப்போது எலியா தன் மேலாடையை[a] எடுத்து, அதைச் சுருட்டி, தண்ணீரை அடித்தார். தண்ணீர் இருபுறமாகப் பிரிந்தது[b]; அவர்கள் இருவரும் உலர்ந்த தரையில் கடந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் மேலங்கியை.’ எபிரெயச் சொல் எலியாவின் தனித்துவமான வெளிப்புற ஆடையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘இங்கேயும் அங்கேயுமாகப் பிரிந்தது’; அதாவது, எதிரெதிர் பக்கங்களுக்கு விலகியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: தன் மேலங்கி
  rationale: אַדֶּרֶת என்பது தனித்துவமான வெளிப்புற ஆடையைக் குறிக்கிறது. ‘மேலங்கி’ நவீனத் தமிழில் இயல்பாகவும், அதை எடுத்து சுருட்டும் இச்செயலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וַיִּגְלֹם
  choice: அதைச் சுருட்டி
  rationale: இங்கு גלם ஆடையை ஒன்றாகச் சுற்றி அல்லது சுருட்டுவதைக் குறிக்கிறது; ‘சுருட்டி’ உடல்சார் செயலைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: தண்ணீரை அடித்தார்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு.’ இங்கு கருவியாக்கப்பட்ட மேலங்கியால் தண்ணீரை அடிக்கும் செயலை நேரடியாகக் காட்டுகிறது.
- source_word: וַיֵּחָצוּ
  choice: தண்ணீர் ... பிரிந்தது
  rationale: எபிரெய வினை பன்மையில் இருந்து ‘நீர்கள்’ என்பதைச் சுட்டினாலும், தமிழில் ‘தண்ணீர்’ ஒருமை நிறைப்பெயராக இயல்பாக இருப்பதால் ஒருமை வினை பயன்படுத்தப்பட்டது; நிகழ்வின் விளைவு அப்படியே காக்கப்படுகிறது.
- source_word: הֵנָּה וָהֵנָּה
  choice: இருபுறமாக
  rationale: சொற்றொடர் தண்ணீர் எதிரெதிர் பக்கங்களுக்கு விலகிப் பிரிந்ததைக் குறிக்கிறது. ‘இருபுறமாக’ தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் ... மறுகரைக்குச் சென்றார்கள்
  rationale: שְׁנֵיהֶם என்பதிலுள்ள இருவர் என்ற வலியுறுத்தலை ‘அவர்கள் இருவரும்’ காக்கிறது. עבר என்பதன் கடந்து செல்லும் பொருளை சூழலுக்கேற்ற ‘மறுகரைக்குச் சென்றார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּחָרָבָה
  choice: உலர்ந்த தரையில்
  rationale: חָרָבָה இங்கு நீர் விலகியதால் வெளிப்பட்ட வறண்ட நிலத்தைக் குறிக்கிறது. ‘உலர்ந்த தரையில்’ அற்புதக் கடத்தல் சூழலைச் சேர்க்கையின்றி தெளிவாக்குகிறது.
- source_word: וַיִּקַּח
  choice: அப்போது எலியா ... எடுத்து
  rationale: வாவ் தொடர் கதைநிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ தொடர்ச்சியை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: தண்ணீர் அற்புதமாகப் பிரிந்த நிகழ்வு
  choice: எலியா தண்ணீரை அடித்ததும் அது இருபுறமாகப் பிரிந்து, இருவரும் உலர்ந்த தரையில் கடந்து சென்றதாக நேரடியாக மொழிபெயர்த்தல்
  alternative: நிகழ்வை இயற்கையான சம்பவமாக விளக்குதல் அல்லது ‘தண்ணீர் விலகியது’ என்று மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை தண்ணீர் பிரிந்ததையும் உலர்ந்த தரையில் அவர்கள் கடந்து சென்றதையும் வெளிப்படையாக விவரிக்கிறது. விளக்கமோ மிகைப்படுத்தலோ இல்லாமல் அற்புத நிகழ்வின் தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புக்குரிய வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. வினைத் தொடர் இயல்பான தமிழுக்காகச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டது; மூலத்தின் நிகழ்வுக்கிரமமும் அற்புதச் சித்திரமும் காக்கப்பட்டன.
