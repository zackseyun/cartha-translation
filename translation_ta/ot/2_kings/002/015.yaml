- from: எரிகோவில் இருந்த இறைவாக்கினரின் சீடர்கள் எதிர்ப்புறத்திலிருந்து அவரைக் கண்டபோது,[a] “எலியாவின் ஆவி எலிசாவின் மேல் தங்கியிருக்கிறது” என்று சொன்னார்கள்.[b] பின்பு அவர்கள் அவரைச் சந்திக்க வந்து, அவருக்கு முன்பாகத் தரைமட்டும் குனிந்து வணங்கினார்கள்.[c]
  to: எரிகோவில் இருந்த இறைவாக்கினரின் சீடர்கள் அவரைத் தொலைவிலிருந்து கண்டபோது,[a] “எலியாவின் ஆவி எலிசாவின் மேல் தங்கியிருக்கிறது” என்று சொன்னார்கள்.[b] பின்பு அவர்கள் அவரைச் சந்திக்க வந்து, அவருக்கு முன்பாகத் தரையில் விழுந்து வணங்கினார்கள்.[c]
  rationale: மூலத்தின் மִנֶּגֶד கொண்டிருக்கும் எதிரே/தொலைவில் என்ற இடவியல் நுணுக்கத்தை இயல்பான முதன்மை உரையிலும் மாற்றுக் குறிப்பிலும் பேணுவதற்காக “தொலைவிலிருந்து” தேர்ந்தெடுக்கப்பட்டது. தரையை நோக்கிய ஆழ்ந்த பணிவைத் தெளிவாகக் காட்ட “தரையில் விழுந்து வணங்கினார்கள்” பயன்படுத்தப்பட்டுள்ளது. மற்ற சொற்களும் பெயர்களும் மாற்றப்படவில்லை.
