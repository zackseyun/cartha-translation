  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: ta
  text: எரிகோவில் இருந்த இறைவாக்கினரின் சீடர்கள் அவரைத் தொலைவிலிருந்து கண்டபோது,[a] “எலியாவின் ஆவி எலிசாவின் மேல் தங்கியிருக்கிறது” என்று சொன்னார்கள்.[b] பின்பு அவர்கள் அவரைச் சந்திக்க வந்து, அவருக்கு முன்பாகத் தரையில் விழுந்து வணங்கினார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிரே இருந்த இடத்திலிருந்து.” எபிரேயச் சொல் எதிரே அல்லது மறுபுறத்தில், பார்வைக்கு உட்பட்ட நிலையில் இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எலியாவின் ஆவி” என்பது இச்சூழலில் எலியாவிடம் செயல்பட்ட தீர்க்கதரிசன ஆவி அல்லது ஆற்றல் இப்போது எலிசாவின்மேல் இருப்பதாக அவர்கள் உணர்ந்ததைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “அவருக்கு முன்பாகத் தரையில் விழுந்து பணிந்தார்கள்.” இந்தச் செயல் மரியாதையையும் கீழ்ப்படிதலையும் வெளிப்படுத்துகிறது; அவசியமாகத் தெய்வ வழிபாட்டைக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: அவரைக் கண்டபோது
  rationale: ראה என்பதன் எளிய பார்வைச் செயலை இயல்பான தமிழ் கதைநடையில் தருகிறது; ஆண்பால் ஒருமை பொருட்சுட்டும் காக்கப்படுகிறது.
- source_word: בְנֵי הַנְּבִיאִים
  choice: இறைவாக்கினரின் சீடர்கள்
  rationale: எபிரேய மரபுத்தொடரான ‘இறைவாக்கினரின் மகன்கள்’ என்பது இங்கு உயிரியல் மகன்களைக் காட்டிலும் இறைவாக்கினர் குழுவின் சீடர்கள் அல்லது உறுப்பினர்களைக் குறிக்கிறது; நவீனத் தமிழில் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: எரிகோவில் இருந்த
  rationale: குறிப்பிடப்படும் இறைவாக்கினர் சீடர்களின் குழு எரிகோவில் இருந்ததை இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: מִנֶּגֶד
  choice: எதிர்ப்புறத்திலிருந்து
  rationale: מנגד என்பதிலுள்ள எதிரே அல்லது மறுபுறத்தில், பார்வைக்கு உட்பட்ட நிலையில் என்ற இடவியல் கூறைத் தக்கவைக்கிறது; வெறும் ‘தொலைவிலிருந்து’ என்பதைக் காட்டிலும் மூலத்துக்கு நெருக்கமானது.
- source_word: נָחָה
  choice: தங்கியிருக்கிறது
  rationale: נוח வினையின் நிறைவுற்று நிலைத்திருக்கும் விளைவை நிகழ்நிலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: எலியாவின் ஆவி
  rationale: கட்டமைப்பை நேரடியாகக் காக்கிறது; இது எலியாவின் தீர்க்கதரிசன ஆற்றல் அல்லது பணியுரிமையைக் குறிக்கலாம் என்ற சூழல் விளக்கத்தை அடிக்குறிப்பில் தருகிறது, ஆனால் முதன்மை உரையில் சொல்லைச் சுருக்குவதில்லை.
- source_word: עַל אֱלִישָׁע
  choice: எலிசாவின் மேல்
  rationale: ஆவி ஒருவர்மேல் தங்குதல் என்ற எபிரேய உருவகத்தையும் தமிழில் வழக்கமான வேதாகமச் சொல்லாக்கத்தையும் காக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவரைச் சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கும் மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: அவருக்கு முன்பாக ... குனிந்து வணங்கினார்கள்
  rationale: שׁחה குறிக்கும் உடல்சார்ந்த பணிவு மற்றும் மரியாதையை வெளிப்படுத்துகிறது; இதைத் தெய்வ வழிபாடு என்று தேவையின்றி முடிவுசெய்வதில்லை.
- source_word: אָרְצָה
  choice: தரைமட்டும்
  rationale: தரையை நோக்கிய ஆழ்ந்த குனிதத்தின் திசையையும் தீவிரத்தையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ‘எலியாவின் ஆவி’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘எலியாவின் ஆவி’ என்ற மூலத்தின் திறந்த சொல்லாக்கத்தைப் பேணுதல்; அடிக்குறிப்பில் தீர்க்கதரிசன ஆவி அல்லது ஆற்றல் என்ற சூழல் பொருளைச் சுட்டுதல்.
  alternative: எலியாவின் தனிப்பட்ட ஆன்மா எலிசாவுக்குள் மாற்றப்பட்டது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: 2 இராஜாக்கள் 2:9,15 இன் உடனடிச் சூழல் தீர்க்கதரிசனப் பணி, ஆற்றல் மற்றும் வாரிசுரிமையைச் சுட்டுகிறது; எனினும் மூலத்தின் ‘ஆவி’ என்ற சொல்லை விளக்கமாக மாற்றாமல் காப்பது உண்மையான மொழியியல் திறந்தநிலையைப் பேணுகிறது.
- issue: எலிசாவுக்கு முன் செய்த வணக்கத்தின் தன்மை
  choice: மரியாதை மற்றும் கீழ்ப்படிதலை வெளிப்படுத்தும் தரைமட்டும் குனிதமாக மொழிபெயர்த்தல்.
  alternative: எலிசாவுக்குச் செய்யப்பட்ட தெய்வ வழிபாடு என்று மொழிபெயர்த்தல்.
  rationale: שׁחה சூழலுக்கேற்ப மனிதருக்கான மரியாதையையோ கடவுளுக்கான வழிபாட்டையோ குறிக்கலாம். இங்கு எலிசாவின் தீர்க்கதரிசன அதிகாரத்தை அங்கீகரிப்பதே கதைச்சூழலுக்கு ஏற்றது; ‘குனிந்து வணங்கினார்கள்’ உடல்செயலைக் காக்கிறது, தெய்வ வழிபாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினரின் சீடர்கள்’ என்பது சொல்லுக்குச் சொல் ‘இறைவாக்கினரின் மகன்கள்’ என்பதைவிட இச்சமூகக் குழுவின் பொருளைத் தெளிவாகத் தருகிறது. ‘ஆவி’ மற்றும் குனிந்து வணங்கும் செயல் தொடர்பான மூலத்தின் இறையியல் நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் தீர்மானமாகச் சுருக்கப்படாமல் பேணப்பட்டுள்ளது.
