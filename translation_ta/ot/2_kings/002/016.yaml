base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: ta
  text: அப்போது அவர்கள் அவனிடம், “பாருங்கள், உங்கள் பணியாளர்களில் திறமையுள்ள ஐம்பது பேர் இருக்கிறார்கள். தயவுசெய்து அவர்கள் போய்த் உங்கள் எஜமானைத் தேட அனுமதியுங்கள். ஒருவேளை யாவேயின் ஆவி[a] அவரைத் தூக்கிச் சென்று, மலைகளில் ஒன்றின் மேலோ பள்ளத்தாக்குகளில் ஒன்றிலோ எறிந்திருக்கலாம்” என்றார்கள். ஆனால் அவன், “அவர்களை அனுப்ப வேண்டாம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் காற்று அவரைத் தூக்கிச் சென்றிருக்கலாம்.” ‘ஆவி’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் ‘காற்று’ என்றும் பொருள்படும்.
    reason: רוּחַ என்ற சொல்லின் உண்மையான சொற்பொருள் மாற்றைச் சுட்டுகிறது; முதன்மை வாசகத்தில் சூழலுக்கேற்ற ‘ஆவி’ என்ற பொருள் காக்கப்படுகிறது.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: பாருங்கள்
  rationale: முன்வைக்கப்படும் வேண்டுகோளைக் கவனிக்கச் சொல்லும் மரியாதையான கவன ஈர்ப்புச் சொற்றொடராக இயல்பான நவீனத் தமிழில் வழங்கப்பட்டது.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: உங்கள் பணியாளர்களில் ... இருக்கிறார்கள்
  rationale: அவருடைய பணியாளர்களில் தேடுவதற்குக் கிடைக்கக்கூடிய ஆட்கள் இருப்பதை எபிரெய இருப்புக் கட்டமைப்பு குறிக்கிறது; இதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: திறமையான ஆண்கள் ஐம்பது பேர்
  rationale: בְּנֵי חַיִל என்பது இச்சூழலில் போர்வீரர்களை மட்டுமல்லாமல் வலிமையும் செயல்வல்லமையும் கொண்ட தகுதியான ஆட்களைக் குறிக்கிறது; தேடல் பணிக்கான திறனை முன்னிறுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: יֵלְכוּ נָא
  choice: தயவுசெய்து அவர்கள் போய் ... அனுமதியுங்கள்
  rationale: நָא இணைந்த விருப்பவினை எலிசாவிடம் முன்வைக்கப்படும் மரியாதையான அனுமதி வேண்டுகோளைத் தெரிவிக்கிறது.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: உங்கள் எஜமானைத் தேட
  rationale: בקשׁ இங்கு காணாமற்போன ஒருவரைத் தேடுவதைக் குறிக்கிறது; אֲדֹנֶיךָ எலிசாவுக்கும் எலியாவுக்கும் இடையிலான எஜமான்–சீடர் உறவைச் சுட்டுகிறது.
- source_word: פֶּן
  choice: ஒருவேளை ... இருக்கலாம்
  rationale: இங்கு அது தவிர்க்க வேண்டிய விளைவை அல்ல, எலியா காணாமற்போனதற்கான பேச்சாளர்களின் ஐயத்துக்குரிய சாத்திய விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேயின் ஆவி
  rationale: எலியாவை அசாதாரணமாக இடமாற்றிய தெய்வீகச் செயல்பாட்டைச் சூழல் சுட்டுவதால் ‘ஆவி’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; ‘காற்று’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: נְשָׂאוֹ ... וַיַּשְׁלִכֵהוּ
  choice: அவரைத் தூக்கிச் சென்று ... எறிந்திருக்கலாம்
  rationale: இரு தொடர்ச்சியான செயல்களையும் அவை முன்வைக்கப்படும் சாத்திய விளக்கத்தையும் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: בְּאַחַד הֶהָרִים א֖וֹ בְּאַחַת הַגֵּאָיוֹת
  choice: மலைகளில் ஒன்றின்மீதோ பள்ளத்தாக்குகளில் ஒன்றிலோ
  rationale: மலை மற்றும் பள்ளத்தாக்கு என்ற இரு மாற்றிடங்களையும், எறிதல் வினையுடன் பொருந்தும் இட உறவுகளையும் இயல்பான தமிழில் வேறுபடுத்துகிறது.
- source_word: לֹא תִשְׁלָחוּ
  choice: அவர்களை அனுப்ப வேண்டாம்
  rationale: தேடல் குழுவை அனுப்பக் கூடாது என்ற எலிசாவின் நேரடியான தடை தெளிவாக வழங்கப்பட்டது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் பொருள்
  choice: யாவேயின் ஆவி
  alternative: யாவேயின் காற்று
  rationale: இந்த நிகழ்வில் எலியாவை எடுத்துச் சென்ற தெய்வீகச் செயற்பாட்டாளராக ‘ஆவி’ பொருத்தமாக உள்ளது. எனினும் רוּחַ என்பதற்கு ‘காற்று’ என்றும் பொருள் வரக்கூடும் என்பதால் அந்த உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
translation_notes:
  register: நவீன செந்தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. எலிசாவை நோக்கிய உரையில் ‘உங்கள்’, ‘அனுமதியுங்கள்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழந்தமிழ் மற்றும் சமயப்பிரிவு சார்ந்த சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன.
