  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: ta
  text: யாவே எலியாவைச் சுழற்காற்றில்[a] வானத்திற்கு[b] உயர்த்திச் செல்லவிருந்தபோது, எலியாவும் எலிசாவும் கில்காலிலிருந்து புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புயற்காற்றில்” அல்லது “கடும்புயற்காற்றில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “வானங்களுக்கு”; இச்சூழலில் இயல்பான தமிழுக்காக “வானத்திற்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …போது
  rationale: இது புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடர் வடிவம். தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று சேர்ப்பதைவிட, காலநிலைத் தொடரால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּהַעֲלוֹת
  choice: எடுத்துக்கொள்ளவிருந்தபோது
  rationale: ב உடன் வரும் வினையெச்சப் பெயர்வடிவம் காலச் சூழலைக் குறிக்கிறது; அத்தியாயத்தில் உடனே நிகழவிருக்கும் ஏற்றத்தைச் சுட்டுவதால் எதிர்நோக்குப் பொருள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּסְעָרָה
  choice: சுழற்காற்றில்
  rationale: סְעָרָה என்பது புயல், கடும்புயற்காற்று அல்லது சுழற்காற்றைக் குறிக்கலாம். இச்சூழலில் ‘சுழற்காற்று’ பொருத்தமானது; ב-இன் உடனிகழ்வு அல்லது வழிமுறை நுணுக்கத்தை ‘-இல்’ திறந்தவாறு வைத்திருக்கிறது.
- source_word: הַשָּׁמָיִם
  choice: வானத்திற்கு
  rationale: எபிரெயத்தில் வடிவம் பன்மையானதாக இருந்தாலும், இங்கு மேல்நோக்கிய இலக்கை நவீன தமிழில் இயல்பாக ‘வானத்திற்கு’ எனக் கூறலாம்.
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: הלך பயண இயக்கத்தைக் குறிக்கிறது. கில்காலிலிருந்து தொடங்கும் பயணத்தை தமிழில் இயல்பாக வெளிப்படுத்த இச்சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִן הַגִּלְגָּל
  choice: கில்காலிலிருந்து
  rationale: מן புறப்படும் இடத்தைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: הַשָּׁמָיִם என்பதன் ஒருமை அல்லது பன்மை வெளிப்பாடு
  choice: வானத்திற்கு
  alternative: வானங்களுக்கு
  rationale: எபிரெயப் பன்மை வடிவம் வானம் அல்லது வானவெளியைக் குறிக்கலாம். இவ்வேற்றச் சூழலில் தமிழ் ஒருமை இயல்பானது; இது பிரபஞ்ச அமைப்பு குறித்த கோட்பாட்டுத் தீர்மானம் அல்ல.
- issue: בַּסְעָרָה என்பதில் ב முன்னொட்டின் நுணுக்கம்
  choice: சுழற்காற்றில்
  alternative: சுழற்காற்றினால் / சுழற்காற்றோடு
  rationale: முன்னொட்டு இடம், உடனிகழ்வு அல்லது வழிமுறை ஆகிய நுணுக்கங்களை ஏற்கலாம். ‘-இல்’ என்பது காரணத்தை மிகுதியாகத் தீர்மானிக்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானதும் கண்ணியமானதுமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெயக் கதைத் தொடக்கத்தின் செயல்பாடு தனியான செயற்கைத் தொடரால் அல்லாமல் தமிழ் காலவாக்கிய அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
