base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: ta
  text: அவர்கள் நடந்துகொண்டே பேசிக்கொண்டிருந்தபோது, இதோ, நெருப்பு ரதமும் நெருப்புக் குதிரைகளும் அவர்கள் இருவரையும் பிரித்தன[b]. எலியா சுழற்காற்றினால்[a] வானத்திற்கு ஏறிப்போனார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுழற்காற்றில்.’ எபிரெய முன்னிடைச்சொல் வழிமுறை, உடன்நிகழ்வு அல்லது இடம் ஆகிய பொருள்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நெருப்பு ரதமும் நெருப்புக் குதிரைகளும் எலியாவையும் எலிசாவையும் பிரித்ததாகவும், எலியா சுழற்காற்றினால் அல்லது சுழற்காற்றில் ஏறிப்போனதாகவும் உரை கூறுகிறது; எலியா அந்த ரதத்தில் ஏறிச் சென்றார் என்று அது வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
