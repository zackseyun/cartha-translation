  rationale: தொடர்ந்து நிகழ்ந்த நடைப்பயணத்தையும் அதனுடன் நடந்த உரையாடலையும் இயல்பான நவீனத் தமிழில் ஒரே காலநிலைத் தொடராக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் காட்சியில் தோன்றுவதை வாசகரின் கவனத்திற்குக் கொண்டுவரும் எபிரெயச் சொல்லின் நாடகத் தன்மையைப் பேணுகிறது.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: நெருப்பு ரதமும் நெருப்புக் குதிரைகளும்
  rationale: இரு எபிரெய் இணைப்புச் சொற்றொடர்களின் வடிவத்தையும் இணைநிலையையும் காக்கிறது; நெருப்பு என்பது பொருளா, தோற்றமா, இயற்கைக்கு அப்பாற்பட்ட பண்பா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: அவர்கள் இருவருக்கும் இடையே வந்து அவர்களைப் பிரித்தன
  rationale: ரதமும் குதிரைகளும் இருவருக்கிடையில் வந்து அவர்களைப் பிரித்ததாக உள்ள எபிரெய் காட்சியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: எலியா ... ஏறிப்போனார்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் நடை.
- source_word: בַּסְעָרָה
  choice: சுழற்காற்றினால்
  rationale: ב என்ற முன்னிடைச்சொல்லை இங்கு கருவி அல்லது வழிமுறையாக எடுத்துக்கொள்கிறது; ‘சுழற்காற்றில்’ என்பதும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַשָּׁמָיִם
  choice: வானத்திற்கு
  rationale: இச்சூழலில் மேலுலகைச் சுட்டும் உயர்ந்த நடையைப் பேணுகிறது; தமிழில் ‘வானம்’ என்பது sky/heaven என்ற பரப்பை இயல்பாகத் தாங்குகிறது.
theological_decisions:
- issue: எலியாவை நெருப்பு ரதமே ஏற்றிச் சென்றதா, அல்லது சுழற்காற்று அவரது ஏற்றத்தின் வழிமுறையா?
  choice: நெருப்பு ரதமும் குதிரைகளும் இருவரைப் பிரித்தன என்றும், எலியா சுழற்காற்றினால் வானத்திற்கு ஏறினார் என்றும் மட்டும் முதன்மை உரை கூறுகிறது.
  alternative: எலியா நெருப்பு ரதத்தில் ஏற்றிச் செல்லப்பட்டார்.
  rationale: எபிரெய் உரை ரதமும் குதிரைகளும் தோன்றி இருவரைப் பிரித்த நிகழ்வையும், எலியாவின் ஏற்றத்தைச் சுழற்காற்றுடன் இணைக்கும் நிகழ்வையும் வேறுபடுத்திக் கூறுகிறது; அவர் ரதத்தில் பயணித்தார் என்று வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான விவிலியக் கதைநடை. ‘இதோ’ என்ற சொல் மூலத்தின் நாடகத் திருப்பத்தைப் பேணுகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
