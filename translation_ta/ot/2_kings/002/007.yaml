  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: ta
  text: தீர்க்கதரிசிகளின் மகன்களில் ஐம்பது பேர் போய், அவர்களுக்கு எதிரே தொலைவில் நின்றார்கள்.[a] அவர்கள் இருவரோ யோர்தான் ஆற்றங்கரையில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீர்க்கதரிசிகளின் மகன்கள்” என்பது தீர்க்கதரிசன ஊழியத்துடன் தொடர்புடைய அங்கீகரிக்கப்பட்ட ஒரு குழுவைக் குறிக்கும் எபிரெயச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: ஐம்பது பேர்
  rationale: எபிரெய ஆண்பால் சொல்லின் சூழல் சார்ந்த பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எண்ணிக்கையையும் மனிதர்களைக் குறிக்கும் பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் புதல்வர்களில்
  rationale: ‘தீர்க்கதரிசிகளின் புதல்வர்கள்’ என்ற எபிரெயக் குழுப்பெயரின் உருவகத்தையும் பண்பாட்டுச் சாயலையும் விளக்கவுரையாக மாற்றாமல் பேணுகிறது.
- source_word: הָלְכוּ וַיַּעַמְדוּ
  choice: போய் ... நின்றார்கள்
  rationale: இரு சாதாரண கதைவினைகளையும் இயல்பான தமிழ் தொடர்வினை அமைப்பில் தருகிறது; தேவையற்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: מִנֶּגֶד מֵרָחוֹק
  choice: அவர்களுக்கு எதிரே தொலைவில்
  rationale: இடத்தின் எதிர்நிலையையும் தூரத்தையும் தனித்தனியாகவும் தெளிவாகவும் பேணுகிறது.
- source_word: וּשְׁנֵיהֶם
  choice: அவர்கள் இருவரோ
  rationale: எலியாவையும் எலிசாவையும் குறிக்கும் இருமை உணர்வைப் பேணுவதோடு, ஐம்பது பேருக்கும் இவ்விருவருக்கும் உள்ள காட்சிசார் வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றங்கரையில் நின்றார்கள்
  rationale: ஆற்றைப் பற்றிய சூழலில் עַל என்பது ‘அருகில்/கரையில்’ என்ற இடப்பொருளைக் கொண்டுள்ளது; ‘ஆற்றங்கரையில்’ என்பது தெளிவான இயல்பான தமிழ்.
