  text: And he went from there to Mount Carmel, and from there he returned to Samaria.
translation:
  language: ta
  text: அவன் அங்கிருந்து கர்மேல் மலைக்குச் சென்றான்; அங்கிருந்து சமாரியாவுக்குத் திரும்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: வய்யிக்தோல் வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்தும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது. தமிழில் வாக்கியத் தொடக்கத்தில் ‘அவன்’ என்பதுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்திலிருந்து புறப்படுவதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֶל
  choice: -க்கு
  rationale: செல்லும் இலக்கைச் சுட்டும் எபிரேய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை உருபு.
- source_word: הַר הַכַּרְמֶל
  choice: கர்மேல் மலை
  rationale: பெயரிடப்பட்ட மலையைக் குறிக்கும் புவியியல் பெயராக, தமிழில் வழக்கமான பெயரெழுத்தாக்கத்துடன் வழங்கப்பட்டுள்ளது.
- source_word: וּמִשָּׁם
  choice: அங்கிருந்து
  rationale: அடுத்த பயண நகர்வின் தொடக்க இடத்தைக் குறிக்கிறது. அரைப்புள்ளி இரண்டு இணைந்த பயணச் செயல்களையும் இயல்பாகத் தொடர்புபடுத்துவதால், எபிரேய இணைப்பிடைச்சொல்லைத் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: שָׁב
  choice: திரும்பினான்
  rationale: இந்தப் பயணச் சூழலில் שׁוּב என்பது முந்தைய இடத்திற்கோ திசைக்கோ திரும்பிச் செல்வதைக் குறிக்கிறது; ‘திரும்பினான்’ சுருக்கமான, இயல்பான இணைச்சொல்.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இந்த இடப்பெயரின் தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட வடிவம்.
