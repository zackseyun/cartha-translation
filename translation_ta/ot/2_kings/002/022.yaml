base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: ta
  text: எலிசா சொன்ன வார்த்தையின்படியே, அந்தத் தண்ணீர் இந்நாள்வரை குணமடைந்திருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீரடைந்திருக்கிறது’ அல்லது ‘நல்ல தண்ணீராக மாறியிருக்கிறது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பொதுவாக ‘குணமடை’ என்பதற்குப் பயன்படுத்தப்படும் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: குணமடைந்திருக்கிறது
  rationale: רפא என்பது பொதுவாக ‘குணமாக்கு/குணமடை’ என்பதைக் குறிக்கும். இங்கு கெட்டுப்போயிருந்த நீர் நலமானதைச் சொல்கிறது. ‘குணமடைந்திருக்கிறது’ என்பது எபிரெய மொழியின் குணப்படுத்தும் உருவகத்தைப் பாதுகாப்பதோடு, அதன் விளைவு உரையாசிரியரின் காலம்வரை நீடித்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמַּיִם
  choice: அந்தத் தண்ணீர்
  rationale: מַיִם எபிரெயத்தில் வடிவியல் ரீதியாகப் பன்மையாக இருந்தாலும், தமிழில் இச்சூழலில் நீரூற்றின் நீர்வளத்தை ‘தண்ணீர்’ என்ற ஒருமைத் தொகுப்புப்பெயரால் குறிப்பிடுவது இயல்பானது. குறிப்பிட்ட முன்சூழலை ‘அந்த’ சுட்டுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: இந்த நிலை கதைசொல்லியின் காலம்வரை தொடர்ந்தது என்ற வழக்குச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּדְבַר
  choice: சொன்ன வார்த்தையின்படியே
  rationale: דָּבָר இங்கு முந்தைய வசனத்தில் எலிசா உரைத்த தீர்க்கதரிசன அறிவிப்பைக் குறிக்கிறது. ‘வார்த்தை’ என்ற தெளிவான பெயர்ச்சொல்லைப் பாதுகாக்கிறது; ‘-படியே’ உரைத்ததற்கும் நிகழ்ந்ததற்கும் உள்ள பொருத்தத்தை வலியுறுத்துகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֲשֶׁר דִּבֵּר
  choice: எலிசா சொன்ன
  rationale: தொடர்புப்பெயரெச்சத்தை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்கி, குறிப்பிட்ட உரையை எலிசாவோடு தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: தண்ணீரைக் குறித்த குணப்படுத்தும் மொழியின் தன்மை
  choice: ‘குணமடைந்திருக்கிறது’ என்று குணப்படுத்தும் உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘சீரடைந்திருக்கிறது’ அல்லது ‘நல்ல தண்ணீராக மாறியிருக்கிறது’
  rationale: எபிரெய வினைச்சொல் רפא வழக்கமாக குணப்படுத்துதலைக் குறிக்கிறது. அதைத் தக்கவைப்பது தீர்க்கதரிசியின் வார்த்தையால் ஏற்பட்ட மீட்பை உரை சித்தரிக்கும் முறையைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெயத்தின் குணப்படுத்தும் உருவகம் முதன்மை உரையில் காக்கப்பட்டுள்ளது; தமிழில் இயல்புக்காக מַיִם என்பது ‘தண்ணீர்’ என்ற தொகுப்புப்பெயராக வழங்கப்பட்டுள்ளது. வசனத்தின் காரண-விளைவு ஓட்டத்தைத் தெளிவாக்க ‘எலிசா சொன்ன வார்த்தையின்படியே’ முதலில் வைக்கப்பட்டுள்ளது.
