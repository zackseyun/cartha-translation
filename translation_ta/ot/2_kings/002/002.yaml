base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: ta
  text: எலியா எலிசாவிடம், “தயவுசெய்து இங்கேயே தங்கியிரு; ஏனெனில் யாவே என்னைப் பெத்தேல்வரை[a] அனுப்பியிருக்கிறார்” என்றார். அதற்கு எலிசா, “யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, நீர் உயிரோடிருப்பதும் அவ்வளவு உறுதி[b]; நான் உம்மைவிட்டுப் பிரியமாட்டேன்” என்றார். எனவே, அவர்கள் பெத்தேலுக்கு இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘பெத்தேல்வரை’ என்று உள்ளது; இச்சூழலில் இதை ‘பெத்தேலுக்கு’ என்றும் பொருள்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இது ஓர் எபிரெய ஆணைமொழி. சொல்லுக்குச் சொல் வடிவம்: ‘யாவே உயிரோடிருப்பதுபோலவும், உமது உயிர் வாழ்வதுபோலவும், நான் உம்மைவிட்டுப் பிரிந்தால்….’ சொல்லப்படாமல் விடப்பட்டுள்ள சாபவிளைவு, ‘நான் உம்மைவிட்டுப் பிரியவே மாட்டேன்’ என்ற உறுதியைத் தெரிவிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: தயவுசெய்து இங்கேயே தங்கியிரு
  rationale: ישׁב இச்சூழலில் உட்காருவதைக் காட்டிலும் தொடர்ந்து உடன் செல்லாமல் அந்த இடத்திலேயே தங்குவதைக் குறிக்கிறது; נָא வேண்டுகோளின் பணிவைத் தெரிவிப்பதால் ‘தயவுசெய்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: என்னைப் பெத்தேல்வரை அனுப்பியிருக்கிறார்
  rationale: עַד என்பதன் ‘வரை/அளவுக்கு’ என்ற எல்லைநோக்கிய நுண்பொருளைத் தக்கவைக்கிறது; தமிழில் இது இயல்பாகவும் அடுத்தடுத்த பயணநிலைகளைச் சுட்டுவதாகவும் உள்ளது.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, நீர் உயிரோடிருப்பதும் அவ்வளவு உறுதி
  rationale: இது இருவரின் உயிரையும் முன்னிறுத்தும் எபிரெய ஆணைமொழி. ‘ஆத்துமா’ என்ற தொழில்நுட்பப் பொருளை நֶפֶשׁ மீது சுமத்தாமல், தமிழில் அதன் உறுதிப்படுத்தும் ஆணை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: நான் உம்மைவிட்டுப் பிரியமாட்டேன்
  rationale: ஆணைமொழிக்குப் பின் வரும் אִם நிறைவு சொல்லப்படாத எதிர்மறை ஆணையை அறிமுகப்படுத்துகிறது; தமிழில் அதன் நோக்கத்தைத் தெளிவாக்க எதிர்மறை உறுதிமொழியாக வழங்கப்பட்டது.
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தை வெறும் ‘சென்றார்கள்’ என்று பொதுமைப்படுத்தாமல், இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கெழுத்துத் திருநாமமே உள்ளது. ஆகவே தனிப்பட்ட உடன்படிக்கைத் திருநாமத்தை மறைக்காமல் ஒலிபெயர்க்கப்பட்டது.
- issue: எலிசாவின் ஆணைமொழியில் உள்ள நிறைவு பெறாத நிபந்தனை
  choice: ‘நான் உம்மைவிட்டுப் பிரியமாட்டேன்’ என்ற வெளிப்படையான எதிர்மறை உறுதிமொழி
  alternative: ‘நான் உம்மைவிட்டுப் பிரிந்தால்…’ என்ற சொல்லுக்குச் சொல் வடிவம்
  rationale: எபிரெய ஆணைமரபில் சாபவிளைவு சொல்லப்படாமல் விடப்படுகிறது. அதைத் தமிழில் அப்படியே வைத்தால் சாதாரண வாசகருக்கு தவறான நிபந்தனையாகத் தோன்றும்; எனவே பொருளைத் தெளிவாக்கி, அடிப்படை வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எலியா எலிசாவிடம் பேசும்போது இயல்பான ஒருமை வடிவமும், எலிசா தமது ஆசானிடம் பேசும்போது மரியாதை ஒருமையான ‘நீர்/உம்மை’ வடிவங்களும் பயன்படுத்தப்பட்டன. ஆணைமொழியின் பழமையான அமைப்பு வாசிக்க இயலாத அளவுக்கு சொல்லுக்குச் சொல் முறையில் வைக்கப்படாமல், அதன் உறுதியும் இறையியல் பதற்றமும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டன.
