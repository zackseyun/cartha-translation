  source_fidelity: 'மூல எபிரேயத்தின் நிகழ்வுத் தொடரும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: எலிசா திரும்பிப் பார்த்தார், யெகோவாவின்/ஆண்டவரின் பெயரால் சபித்தார், இரண்டு பெண் கரடிகள் காட்டிலிருந்து வந்து கூட்டத்திலிருந்த நாற்பத்திரண்டு יְלָדִים-ஐக் குதறின. ‘குதறின’ என்பது וַתְּבַקַּעְנָה-இன் வன்மையான ‘கிழித்தல்/பிளத்தல்’ பொருளைத் தருகிறது; மரணத்தைச் சேர்த்துக் கூறவில்லை.'
