  text: וַ/יִּ֤פֶן אַֽחֲרָי/ו֙ וַ/יִּרְאֵ֔/ם וַֽ/יְקַלְלֵ֖/ם בְּ/שֵׁ֣ם יְהוָ֑ה וַ/תֵּצֶ֨אנָה שְׁתַּ֤יִם דֻּבִּים֙ מִן הַ/יַּ֔עַר וַ/תְּבַקַּ֣עְנָה מֵ/הֶ֔ם אַרְבָּעִ֥ים וּ/שְׁנֵ֖י יְלָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: ta
  text: அவர் திரும்பி அவர்களைப் பார்த்து, ஆண்டவரின் பெயரால் அவர்களைச் சபித்தார். அப்போது காட்டிலிருந்து இரண்டு பெண் கரடிகள் வெளியே வந்து, அவர்களில் நாற்பத்திரண்டு சிறுவர்களைக் குதறின.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: அவர்களைச் சபித்தார்
  rationale: எபிரேய வினையின் நேரடியான பொருளையும் நிகழ்வின் தீவிரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: ஆண்டவரின் பெயரால்
  rationale: தெய்வீகப் பெயரைத் தமிழ் வேதாகம நடையில் மரியாதையுடன் வழங்கி, ‘பெயரால்’ என்ற கருவி/அதிகாரப் பொருளைத் தக்கவைக்கிறது.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: இரண்டு பெண் கரடிகள்
  rationale: பெண்பால் எண்ணும் பெயர்ச்சொல்லும் கரடிகள் பெண் என்பதைத் தெளிவாகக் குறிக்கின்றன.
- source_word: וַתְּבַקַּעְנָה
  choice: குதறின
  rationale: அடிப்படை வினை ‘பிளத்தல்/கிழித்தல்’ என்ற வன்மையான தாக்குதலைக் குறிக்கிறது; இச்சூழலில் ‘குதறின’ என்பது இயல்பான தமிழ், ஆனால் அவர்கள் அனைவரும் இறந்ததாக உரை கூறாததால் அதைக் கூட்டிச் சொல்லவில்லை.
- source_word: יְלָדִים
  choice: சிறுவர்கள்
  rationale: இச்சொல் குழந்தைகள் அல்லது இளைஞர்களைக் குறிக்கக்கூடும்; உடனடி சூழலில் இயல்பான ‘சிறுவர்கள்’ தேர்ந்தெடுக்கப்பட்டது, வயதை மிகத் துல்லியமாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: சாபத்தின் அதிகாரத் தொடர்பு
  choice: ஆண்டவரின் பெயரால் அவர்களைச் சபித்தார்
  alternative: ஆண்டவரை நோக்கி அவர்களைச் சபித்தார்
  rationale: בְּשֵׁם என்பது பொதுவாக பெயரின் அதிகாரத்தில் அல்லது பெயரை அழைத்து நிகழ்த்திய செயலைக் குறிக்கிறது; தீர்ப்பின் துல்லியமான செயல்முறையை விளக்கிச் சேர்க்காமல் மூலத்தின் சொற்றொடரைப் பாதுகாக்கிறது.
- issue: கரடித் தாக்குதலின் விளைவு
  choice: குதறின
  alternative: கொன்றன
  rationale: மூல உரை நாற்பத்திரண்டு பேரைக் கிழித்தன/குதறின என்கிறது; அவர்கள் அனைவரும் கொல்லப்பட்டனர் என்று வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான வேதாகம நடை. எபிரேய தொடர்கதை அமைப்பு இயல்பான தமிழில் வழங்கப்பட்டுள்ளது. ‘அவர்களில்’ என்பது கூட்டத்திலிருந்து நாற்பத்திரண்டு பேர் தாக்கப்பட்டனர் என்ற מֵהֶם-இன் பொருளைத் தக்கவைக்கிறது.
