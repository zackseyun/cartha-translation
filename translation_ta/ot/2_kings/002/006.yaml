  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: ta
  text: அப்போது எலியா அவரிடம், “தயவுசெய்து நீ இங்கேயே தங்கியிரு; ஏனெனில் யாவே என்னை யோர்தானுக்கு[a] அனுப்பியிருக்கிறார்” என்றார். அதற்கு எலிசா, “யாவே வாழ்வதுபோலவும், உமது உயிர் வாழ்வதுபோலவும், நான் உம்மைவிட்டுப் பிரியவே மாட்டேன்” என்றார். எனவே அவர்கள் இருவரும் தொடர்ந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “யோர்தான் ஆற்றுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: தயவுசெய்து நீ இங்கேயே தங்கியிரு
  rationale: ישׁב இச்சூழலில் உட்காருவதைக் காட்டிலும் அந்த இடத்திலேயே நின்றுவிடுதல் அல்லது தங்கியிருத்தல் என்ற பொருளைத் தருகிறது; נָא வேண்டுகோளின் பணிவைச் சேர்ப்பதால் ‘தயவுசெய்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; அதனால் தமிழில் ஒலிபெயர்த்து வழங்கப்படுகிறது.
- source_word: שְׁלָחַנִי
  choice: என்னை … அனுப்பியிருக்கிறார்
  rationale: முடிந்த அனுப்புதலின் தற்போதைய தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַיַּרְדֵּנָה
  choice: யோர்தானுக்கு
  rationale: சொல்லின் இறுதியில் உள்ள திசைவேற்றுமை உருபு யோர்தானை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ஆற்றைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: உயிருள்ள யாவேமேலும், உமது உயிர்மேலும் ஆணை
  rationale: எபிரெய உறுதிமொழியின் தீவிரத்தையும், யாவேயின் வாழ்வையும் கேட்பவரின் வாழ்வையும் சாட்சியாகக் கொள்ளும் அமைப்பையும் இயல்பான தமிழில் காக்கிறது; נֶפֶשׁ என்பதை இங்கு தனியான ‘ஆத்துமா’ எனப் புரிந்துகொள்ளாமல் உயிர் அல்லது வாழ்வு என வழங்குகிறது.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: நான் உம்மைவிட்டுப் பிரியவே மாட்டேன்
  rationale: உறுதிமொழியில் אִם தொடங்கும் நிறைவுபெறாத சாபவாக்கியம் கடும் மறுப்பைக் குறிக்கிறது. ‘வே’ அந்த உறுதியைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: எனவே அவர்கள் இருவரும் தொடர்ந்து சென்றார்கள்
  rationale: இருவரும் ஒன்றாகப் பயணத்தைத் தொடர்ந்தனர் என்ற வலியுறுத்தலை ‘இருவரும்’ மற்றும் ‘தொடர்ந்து’ என்பவை காக்கின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது; எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: אִם אֶעֶזְבֶךָּ என்ற நிறைவுபெறாத உறுதிமொழி
  choice: நான் உம்மைவிட்டுப் பிரியவே மாட்டேன்
  alternative: நான் உம்மைவிட்டுப் பிரிந்தால்…
  rationale: எபிரெயத்தில் சாபத்தின் விளைவு சொல்லப்படாமல் விடப்பட்டுள்ளதால் வடிவத்தில் தெளிவின்மை இருந்தாலும், அதன் உறுதிமொழிப் பொருள் கடுமையான மறுப்பு. முதன்மை உரை அந்தத் தொடர்பாடல் பொருளைத் தருகிறது; அடிக்குறிப்பு மூல வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எலியா சீடனான எலிசாவிடம் ‘நீ’ என்றும், எலிசா தம் ஆசானிடம் மரியாதையாக ‘உமது/உம்மை’ என்றும் பேசுவது உறவுநிலையை இயல்பாக வெளிப்படுத்துகிறது. ‘ஆணை’ என்பது உறுதிமொழியின் தீவிரத்தைச் சுருக்கமாகத் தெரிவிக்கிறது.
