base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: ta
  text: அவர்கள் கடந்தபின், எலியா எலிசாவிடம், “நான் உன்னிடமிருந்து எடுத்துக்கொள்ளப்படுமுன், உனக்காக நான் என்ன செய்ய வேண்டும் என்பதை கேள்” என்றார். அதற்கு எலிசா, “தயவுசெய்து, உமது ஆவியில்[b] இரட்டைப் பங்கு[a] எனக்குக் கிடைக்கட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரட்டைப் பங்கு” என்பதை சொல்லர்த்தமாக “இரண்டு பங்குகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் முதற்பேறானவனுக்குரிய சுதந்தரப் பங்கை எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “உமது ஆவி” என்பது எலியாவின் தீர்க்கதரிசனப் பணியோடு தொடர்புடைய ஆவியைக் குறிக்கிறது. இதை எலியாவின் தீர்க்கதரிசன வல்லமையைவிட இருமடங்கு வல்லமைக்கான வேண்டுகோளாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: அவர்கள் அக்கரைக்குக் கடந்துபோனபின்
  rationale: עבר என்பதன் மூன்றாம் நபர் ஆண்பால் பன்மை வடிவம் எலியாவையும் எலிசாவையும் குறிக்கிறது. அடுத்த நிகழ்வுக்கு முன் கடத்தல் நிறைவடைந்ததை இயல்பான தமிழில் காட்டுகிறது; சூழலில் ஆற்றின் அக்கரைக்குக் கடந்தது தெளிவாக இருப்பதால் ‘அக்கரைக்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: שְׁאַל
  choice: கேள்
  rationale: நேரடியான கட்டளை வடிவத்தை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: உனக்காக நான் என்ன செய்யவேண்டும்
  rationale: எலியா ஒரு வேண்டுகோளை முன்வைக்க அழைக்கும் ஆலோசனைத் தொனியைத் தக்கவைக்கிறது; உறுதியான வாக்குறுதியாக மிகைப்படுத்தவில்லை.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: நான் உன்னிடமிருந்து எடுத்துக்கொள்ளப்படுவதற்கு முன்
  rationale: לקח என்பதன் நிஃபால் செயப்பாட்டு வடிவத்தையும், எலிசாவிடமிருந்து எலியா பிரிக்கப்படுவதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וִיהִי נָא
  choice: தயவுசெய்து, ... கிடைக்கட்டும்
  rationale: வேண்டுகோள் வடிவத்தையும் נָא தரும் பணிவான தொனியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: פִּי שְׁנַיִם
  choice: இரு பங்கு
  rationale: இச்சொற்றொடர் சொல்லர்த்தத்தில் ‘இரண்டு பங்குகள்’ என்றும் மரபுத்தொடராக இரட்டைப் பங்கு என்றும் பொருள்படலாம். ‘இரு பங்கு’ முதற்பேறானவனின் சுதந்தரப் பங்கைக் குறிக்கும் சாத்தியமான எதிரொலியைப் பாதுகாக்கிறது; எலியாவைவிட இருமடங்கு வல்லமை என்ற கருத்தைத் திணிக்கவில்லை.
- source_word: בְּרוּחֲךָ
  choice: உமது ஆவியில்
  rationale: எலியாவுக்குரிய அல்லது அவரது தீர்க்கதரிசனப் பணியோடு தொடர்புடைய ஆவியைக் குறிக்கும் உடைமைத் தொடர்பைத் தக்கவைக்கிறது; ‘தீர்க்கதரிசன ஆவி’ என்று விளக்கத்தை மூலவசனத்துக்குள் சேர்க்கவில்லை.
- source_word: אֵלָי
  choice: எனக்குக் கிடைக்கட்டும்
  rationale: சொல்லர்த்தமான ‘என்னிடம்/எனக்கு’ என்ற திசையை, ஆவியின் பங்கை வேண்டுகிற இச்சூழலில் இயல்பான தமிழாக வழங்குகிறது.
theological_decisions:
- issue: פִּי שְׁנַיִם בְּרוּחֲךָ என்ற எலிசாவின் வேண்டுகோளின் பொருள்
  choice: எலியாவின் ஆவியில் இரு பங்கு கிடைக்க வேண்டும் என்ற வேண்டுகோள்; இது முதற்பேறானவனின் சுதந்தரப் பங்கை எதிரொலிக்கக்கூடும்.
  alternative: எலியாவிடம் இருந்ததைவிட இருமடங்கு தீர்க்கதரிசன வல்லமையை எலிசா கேட்டார்.
  rationale: எபிரெய மரபுத்தொடர் இரு பங்கு அல்லது இரட்டைப் பங்கைக் குறிக்கிறது. ஒப்பீட்டு வல்லமையைத் தீர்மானமாக்காமல், சுதந்தரப் பின்னணியையும் பொருளின் திறந்த தன்மையையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: ‘உமது ஆவி’ என்பதன் சுட்டுப்பொருள்
  choice: எலியாவோடும் அவரது தீர்க்கதரிசனப் பணியோடும் தொடர்புடைய ஆவி/ஆவிக்குரிய அருள்திறன்.
  alternative: இச்சொற்றொடர் நேரடியாகவும் தொழில்நுட்பமான திரித்துவப் பொருளிலும் பரிசுத்த ஆவியானவரைக் குறிப்பிடுகிறது.
  rationale: எபிரெய உடைமைப் பின்னொட்டு எலியாவுக்குரிய அல்லது அவரைத் தனித்துக் காட்டும் ஆவியைச் சுட்டுகிறது. மூலத்தில் இல்லாத குறிப்பிட்ட கோட்பாட்டு அடையாளத்தை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. எலியா எலிசாவிடம் பேசும்போது ‘நீ’ வடிவமும், எலிசா தனது ஆசானிடம் பேசும்போது மரியாதையான ‘உமது’ வடிவமும் பயன்படுத்தப்பட்டுள்ளன. இறையியல் விளக்கங்கள் வசனத்துக்குள் சேர்க்கப்படாமல் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
