  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: ta
  text: அவள் பெண் கழுதைக்குச் சேணம் பூட்டி, தன் பணியாளனிடம்[a], “கழுதையை ஓட்டிக்கொண்டு போ; நான் உன்னிடம் சொல்லும் வரையில், எனக்காக நிறுத்தவோ வேகத்தைக் குறைக்கவோ வேண்டாம்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவளுடைய இளைஞன்”; இங்கு அவளுடன் சென்ற ஆண் பணியாளனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: பெண் கழுதைக்குச் சேணம் பூட்டி
  rationale: חבש என்பது இச்சூழலில் சவாரிக்காக விலங்குக்குச் சேணம் பூட்டுவதைக் குறிக்கிறது; אָתוֹן குறிப்பாகப் பெண் கழுதையைக் குறிப்பதால் மூலத்தின் தகவல் இயல்பாகத் தக்கவைக்கப்பட்டது.
- source_word: נַעֲרָהּ
  choice: தன் பணியாளனிடம்
  rationale: נַעַר இங்கு அவளுடன் சேவை செய்யும் இளம் ஆண் பணியாளனைக் குறிக்கிறது. ‘பணியாளன்’ என்பது அவனுடைய பங்கையும் ஆண்பாலையும் தெளிவாகக் காட்டுகிறது.
- source_word: נְהַג וָלֵךְ
  choice: அதை ஓட்டிக்கொண்டு போ
  rationale: נהג என்பது விலங்கை முன்னோக்கி ஓட்டுதல் அல்லது நடத்துதலைக் குறிக்கிறது; וָלֵךְ உடன் சேர்ந்து தொடர்ந்து விரைந்து செல்லும் கட்டளையைத் தருகிறது.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: நான் சவாரி செய்வதை எனக்காக நிறுத்தாதே
  rationale: עצר என்பதன் அடிப்படைப் பொருளான ‘தடுத்து நிறுத்துதல்/நிறுத்துதல்’ என்பதையும், לִי לִרְכֹּב என்ற சற்றே இறுக்கமான எபிரெயக் கட்டமைப்பையும் முடிந்தவரைத் தக்கவைக்கிறது; பொருள், அவள் சவாரி செய்யும்போது அவளுக்காக வேகத்தைக் குறைக்கவோ நிறுத்தவோ வேண்டாம் என்பதாகும்.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: நான் உன்னிடம் சொல்லாவிட்டால்
  rationale: 'தடைச் சொல்லுக்குப் பின் வரும் כִּי אִם விதிவிலக்கை அறிமுகப்படுத்துகிறது: அவள் சொல்லும் நேரத்தில் மட்டும் நிறுத்த வேண்டும். தமிழில் எதிர்மறை நிபந்தனையாக இது இயல்பாக வெளிப்படுகிறது.'
