translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் பேச்சாளரான குழந்தைக்கு ‘அவன்/என்றான்’ என்றும், அடுத்த கட்டளையைச் சொல்லும் தந்தைக்கு ‘என்றார்’ என்றும் பயன்படுத்தி, எபிரெய உரையின் நிகழ்வுத் தொடரைத் தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது. குழந்தையின் திடீர் வேதனையைச் சொல்லின் இரட்டிப்பும் நிறுத்தக்குறிகளும் மட்டுமே வெளிப்படுத்துகின்றன.
