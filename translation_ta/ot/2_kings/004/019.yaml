base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: ta
  text: அவன் தன் தந்தையிடம், “என் தலை! என் தலை!” என்றான். அப்போது தந்தை அந்த இளைஞனிடம்[a], “இவனைத் தூக்கிக்கொண்டு இவனுடைய தாயிடம் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞன்” என்பதற்குப் பதிலாக “வேலைக்காரன்” அல்லது “உதவியாளர்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் נַעַר சூழலுக்கேற்ப சிறுவன், இளைஞன், உதவியாளர் அல்லது வேலைக்காரன் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: அவன் தன் தந்தையிடம் ... என்றான்
  rationale: אָמַר என்பதன் வழக்கமான பொருளான ‘சொல்’ என்பதையே இயல்பான தமிழ் உரையாடல் அமைப்பில் தருகிறது; கூக்குரலிட்டான் என்று எபிரெய உரையில் இல்லாத நுணுக்கம் சேர்க்கப்படவில்லை. אָבִיו என்பது ‘அவனுடைய தந்தை’ என்று நேரடியாகக் குறிக்கிறது.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: என் தலை! என் தலை!
  rationale: முதல் நபர் பின்னொட்டுடன் இருமுறை வரும் ‘தலை’ என்ற சொல்லின் சுருக்கத்தையும் அவசர வேதனையையும் காக்கிறது; ‘தலை வலிக்கிறது’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: இரண்டாவது wayyiqtol நிகழ்வின் அடுத்த கட்டத்தை முன்னெடுப்பதால் ‘அப்போது’ இயல்பான தொடர்ச்சியைத் தருகிறது. தமிழில் செய்பவரைத் தெளிவுபடுத்த ‘தந்தை’ மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: אֶל הַנַּעַר
  choice: அந்த இளைஞனிடம்
  rationale: נַעַר என்பது சூழலுக்கேற்ப சிறுவன், இளைஞன், உதவியாளர் அல்லது வேலைக்காரன் எனப் பொருள்படலாம். குழந்தையைத் தூக்கிச் செல்லக்கூடிய ஆண் துணையாளைக் குறிக்கும் இச்சூழலில் ‘இளைஞன்’ வயது சார்ந்த அடிப்படைப் பொருளைக் காக்கிறது; பணிநிலையை உறுதியாக்கவில்லை.
- source_word: שָׂאֵהוּ
  choice: இவனைத் தூக்கிக்கொண்டு ... போ
  rationale: נשׂא என்ற கட்டளை வினை, இச்சூழலில் குழந்தையை உடலால் சுமந்து கொண்டு செல்வதைக் குறிக்கிறது. நவீன தமிழில் ‘தூக்கிக்கொண்டு போ’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל אִמּוֹ
  choice: இவனுடைய தாயிடம்
  rationale: אֵם என்ற உறவுச் சொல்லை நேரடியாகவும் கண்ணியமான நடையிலும் ‘தாய்’ என வழங்குகிறது.
