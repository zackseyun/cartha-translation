translation_notes:
  register: நவீன, எளிதில் புரியும், கண்ணியமான கதைநடை. எபிரேயச் சொற்றொடரின் பொருள் காக்கப்பட்டு, தமிழில் தெளிவிற்காக தந்தைக்கும் அறுவடை செய்கிறவர்களுக்கும் உள்ள தொடர்பு இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
