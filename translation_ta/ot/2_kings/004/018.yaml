- from: அந்தச் சிறுவன் வளர்ந்தான்[a]. ஒரு நாள் அவன் அறுவடை செய்கிறவர்களிடையே இருந்த தன் தந்தையிடம் சென்றான்[b].
  to: அந்தச் சிறுவன் வளர்ந்தான்[a]. ஒரு நாள்[b], அவன் வெளியே சென்று, தன் தந்தையிடமும் அறுவடை செய்பவர்களிடமும் போனான்.
  rationale: The revision restores the outward-motion sense of וַיֵּצֵא and renders the two repeated prepositional phrases without asserting that the father was among the reapers. It also relocates and corrects footnote b so that it documents the Hebrew narrative idiom underlying ‘ஒரு நாள்.’
