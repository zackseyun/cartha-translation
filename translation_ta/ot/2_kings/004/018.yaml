  yaml_path: translation/ot/2_kings/004/018.yaml
  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: ta
  text: அந்தச் சிறுவன் வளர்ந்தான்[a]. ஒரு நாள்[b], அவன் வெளியே சென்று, தன் தந்தையிடமும் அறுவடை செய்பவர்களிடமும் போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறுவன்’ என்பதற்குப் பதிலாக ‘குழந்தை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரேய மரபுத்தொடர்: ‘அந்நாள் நிகழ்ந்தது’; இதன் பொருள் ‘ஒரு நாள்’ அல்லது ‘அந்த நாள் வந்தபோது’ என்பதாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: வளர்ந்தான்
  rationale: גדל இங்கு குழந்தையின் உடல் வளர்ச்சியைக் குறிக்கிறது; எபிரேயத்தில் உள்ளதைவிட அதிகமாக வயதடைந்ததைக் குறிப்பதில்லாமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: הַיָּלֶד
  choice: சிறுவன்
  rationale: יֶלֶד என்பது ‘குழந்தை’ அல்லது ‘சிறுவன்’ எனப் பொருள்படலாம்; வயலுக்குச் செல்லும் இச்சூழலில் ‘சிறுவன்’ இயல்பாகவும் பாலினத்தைத் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיְהִי הַיּוֹם
  choice: ஒரு நாள்
  rationale: கதையில் ஒரு குறிப்பிட்ட நிகழ்வை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיֵּצֵא
  choice: சென்றான்
  rationale: יצא என்பதன் வெளியே செல்லும் திசைநுட்பம் தமிழில் சூழலால் விளங்குகிறது; ‘வெளியே சென்றான்’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: אֶל אָבִיו אֶל הַקֹּצְרִים
  choice: அறுவடை செய்கிறவர்களிடையே இருந்த தன் தந்தையிடம்
  rationale: இருமுறை வரும் אֶל அமைப்பை இயல்பான தமிழில் வெளிப்படுத்தி, தந்தை அறுவடை செய்கிறவர்களுடன் இருந்தார் என்ற தொடர்பைக் காட்டுகிறது; அவர் தாமும் அறுவடை செய்தார் என்று தேவையின்றி உறுதிப்படுத்தவில்லை.
