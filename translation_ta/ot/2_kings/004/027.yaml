  source_fidelity: 'மூல எபிரேயக் கதைநடையின் வரிசையும் பொருளும் துல்லியமாகப் பேணப்பட்டுள்ளன: மலையில் இருந்த இறைவனின் மனிதரிடம் அவள் வருதல், அவரது கால்களைப் பற்றிக்கொள்ளுதல், கேயாசியின் அவளை விலக்க முயற்சி, மற்றும் இறைவனின் மனிதரின் தடுக்கும் கட்டளை ஆகியவை அனைத்தும் உள்ளன. נַפְשָׁהּ מָרָה לָהּ என்ற மரபுத்தொடர் ‘அவளுடைய உள்ளம் கசப்பான வேதனையில் இருக்கிறது’ என்று அதன் உருவகத்தையும் ஆழ்ந்த துயரப் பொருளையும் காக்கும் வகையில் தரப்பட்டுள்ளது. ‘அதை’ என்ற சுட்டுப்பெயர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத செய்தியைத் தேவையின்றி நிரப்பாமல் பாதுகாக்கிறது.'
