base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: ta
  text: அவள் மலையிலிருந்த இறைவனின் மனிதரிடம் வந்து, அவருடைய கால்களைப் பற்றிக்கொண்டாள். கேயாசி அவளைத் தள்ளிவிட நெருங்கி வந்தான். ஆனால் இறைவனின் மனிதர், “அவளை விட்டுவிடு; அவளுடைய உள்ளம் கசப்பான வேதனையில் இருக்கிறது[a]. யாவே அதை என்னிடமிருந்து மறைத்துவிட்டார்; அதை எனக்குத் தெரிவிக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அவளுடைய நெஃபெஷ் அவளுக்குக் கசப்பாக இருக்கிறது”; இது அவளுடைய ஆழ்ந்த அகவேதனையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: எபிரேயத் தீர்க்கதரிசிக்குரிய பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கிப் பதிலிடாமல், மூலத்தின் தனித்துவமான சொல்லாட்சியை இயல்பான தமிழில் பேணுகிறது.
- source_word: אֶל הָהָר
  choice: மலையிலிருந்த ... இடம்
  rationale: அவள் மலையை நோக்கிச் சென்று, அங்கு இருந்த எலிசாவிடம் வந்த இயக்கத்தையும் இருப்பிடத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: அவருடைய கால்களைப் பற்றிக்கொண்டாள்
  rationale: חזק உடன் ב என்பது உறுதியாகப் பற்றிக்கொள்வதைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அவளுடைய அவசரத்தையும் செயலில் உள்ள வலிமையையும் மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: וַיִּגַּשׁ
  choice: நெருங்கி வந்தான்
  rationale: அணுகிவருதல் என்ற சாதாரண கதைநடைப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לְהָדְפָהּ
  choice: அவளைத் தள்ளிவிட
  rationale: வலுக்கட்டாயமாக விலக்க முயல்வதை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: הַרְפֵּה לָהּ
  choice: அவளை விட்டுவிடு
  rationale: அவளிடம் தலையிடுவதை நிறுத்தும்படி கூறும் கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: அவளுடைய உள்ளம் கசப்பான வேதனையில் இருக்கிறது
  rationale: נפשׁ என்பதன் அகநிலைப் பொருளையும் ‘கசப்பு’ என்ற எபிரேய உருவகத்தையும் பேணிக்கொண்டு, ஆழ்ந்த மனவேதனையைத் தமிழில் புரியுமாறு சொல்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் தெய்வீகத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: அதை என்னிடமிருந்து மறைத்துவிட்டார்
  rationale: எலிசாவுக்கு இவ்விஷயம் வெளிப்படுத்தப்படவில்லை என்பதைக் குறிக்கும் காரணவினைப் பொருளை நேரடியாகப் பேணுகிறது.
- source_word: וְלֹא הִגִּיד לִי
  choice: அதை எனக்குத் தெரிவிக்கவில்லை
  rationale: முந்தைய கூற்றுக்கு இணையாக, கடவுள் அந்த விஷயத்தை அறிவிக்கவில்லை என்பதைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இங்கு எபிரேய மூலத்தில் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர் உள்ளது; ஆகவே அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: נֶפֶשׁ என்பதன் அகமனிதப் பொருள்
  choice: அவளுடைய உள்ளம் கசப்பான வேதனையில் இருக்கிறது
  alternative: அவளுடைய ஆத்துமா அவளுக்குக் கசப்பாக இருக்கிறது
  rationale: ‘ஆத்துமா’ என்று சொல்வதால் தோன்றக்கூடிய பிற்கால மெய்யியல் வரையறையைத் திணிக்காமல், இச்சூழலில் உள்ள நபரின் ஆழ்ந்த அகவேதனையைத் தெரிவிக்கிறது; அதேவேளை ‘கசப்பு’ உருவகத்தையும் காக்கிறது.
- issue: தீர்க்கதரிசியின் வெளிப்படுத்தப்பட்ட அறிவின் வரம்பு
  choice: யாவே அதை என்னிடமிருந்து மறைத்துவிட்டார்; அதை எனக்குத் தெரிவிக்கவில்லை
  alternative: யாவே இதை எனக்குத் தெரியாமல் வைத்தார்
  rationale: மூலத்தின் இரு இணை வாக்கியங்களையும் பேணி, எலிசா தன்னிச்சையாக அனைத்தையும் அறிந்தவர் அல்ல; வெளிப்பாடு கிடைக்காததை அவரே ஒப்புக்கொள்கிறார் என்ற பதற்றத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவனின் மனிதர்’ என்ற மூலப் பட்டமும் ‘யாவே’ என்ற தனிப்பெயரும் பேணப்பட்டுள்ளன; மிகப் பழமையான ‘ஆத்துமா’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘உள்ளம்’ பயன்படுத்தப்பட்டு, எபிரேய மரபுத்தொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
