base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: ta
  text: அப்போது அவர்களில் ஒருவன் கீரைகளை[a] சேகரிக்க வயலுக்குச் சென்றான். அங்கே ஒரு காட்டுக் கொடியைக் கண்டு, அதிலிருந்து காட்டுக் குமட்டிக்காய்களை[b] தன் உடை நிறையப் பறித்தான். பின்பு அவன் வந்து, அவற்றைத் துண்டுகளாக நறுக்கிக் குழம்புப் பானையில் போட்டான்; ஏனெனில் அவை என்னவென்று அவர்கள் அறிந்திருக்கவில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கீரைகள்’ என்பதற்கு ‘உண்ணத்தக்க பசுந்தாவரங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வயலில் சேகரிக்கப்படும் உணவுக்குரிய தாவரங்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘வயலின் கொடி’ என்றும் ‘வயலின் காய்கள்’ என்றும் உள்ளது; அதாவது, தானாக வளர்ந்த கொடியும் அதன் காய்களும். இவை colocynth எனப்படும் குமட்டிக்காய் வகையாக இருக்கலாம்; துல்லியமான தாவர அடையாளம் உறுதியல்ல.
    reason: lexical_alternative
  - marker: c
    text: ‘ஏனெனில்’ என்பதற்கு ‘அவர்கள் அறியாதிருந்ததால்’ என்றும் பொருள் கொள்ளலாம். எபிரெய இணைப்புச்சொல் முந்தைய செயலுக்கான விளக்கத்தையோ காரணத்தையோ தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: அவர்களில் ஒருவன்
  rationale: எண்ணுப்பெயர் இங்கு குழுவில் இருந்த ஓர் ஆணைக் குறிக்கிறது. சூழலில் உள்ள குழுவைத் தெளிவாக உணர்த்த ‘அவர்களில் ஒருவன்’ இயல்பாக உள்ளது.
- source_word: לְלַקֵּט אֹרֹת
  choice: உண்ணத்தக்க கீரைகளை சேகரிக்க
  rationale: אֹרֹת என்பது வயலில் சேகரிக்கப்படும் உண்ணத்தக்க பசுந்தாவரங்களைப் பொதுவாகக் குறிக்கிறது. ‘கீரைகள்’ இயல்பான தமிழ்; ‘உண்ணத்தக்க’ என்பது இங்கு நோக்கப்பட்ட தாவரங்களின் தன்மையைத் தெளிவாக்குகிறது.
- source_word: גֶּפֶן שָׂדֶה
  choice: ஒரு காட்டுக் கொடி
  rationale: சாகுபடி செய்யப்படாமல் வெளியில் வளரும் கொடியை இச்சொற்றொடர் குறிக்கிறது. சொற்சொல்லான ‘வயலின் கொடி’ என்பதைவிட ‘காட்டுக் கொடி’ நவீன தமிழில் தெளிவானது.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: காட்டுக் குமட்டிக்காய்கள்
  rationale: காட்டுக் கொடியில் காய்க்கும் gourd வகைக் காய்களை இச்சொற்றொடர் குறிக்கிறது; அது பெரும்பாலும் colocynth எனக் கருதப்படுகிறது. ‘குமட்டிக்காய்’ அந்த வகையைத் தமிழில் சுருக்கமாகக் குறிக்கிறது; குறிப்பிட்ட தாவர அடையாளம் உறுதியல்ல என்பதை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: מְלֹא בִגְדוֹ
  choice: தன் உடை நிறைய
  rationale: வெளியுடையை ஒரு கொள்கலனாகப் பயன்படுத்தி அது நிறையும் அளவு சேகரித்ததை எபிரெய மரபுத்தொடர் காட்டுகிறது. தமிழ் வடிவம் அந்தக் காட்சியையும் அளவையும் பாதுகாக்கிறது.
- source_word: וַיְפַלַּח
  choice: அவற்றைத் துண்டுகளாக நறுக்கி
  rationale: வினைச்சொல் பிளத்தல் அல்லது துண்டுகளாக வெட்டுதல் எனப் பொருள்படும். முன்பு சேகரித்த காய்களே மறைமுகச் செயப்படுபொருள் என்பதால் தமிழில் ‘அவற்றை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: סִיר הַנָּזִיד
  choice: குழம்புப் பானை
  rationale: נָזִיד என்பது வேகவைக்கப்பட்ட கெட்டியான உணவு அல்லது stew. ‘குழம்புப் பானை’ எளிய நவீன தமிழில் சமையல் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: כִּי לֹא יָדָעוּ
  choice: ஏனெனில் அவை என்னவென்று அவர்கள் அறிந்திருக்கவில்லை
  rationale: כִּי என்பதன் விளக்கவுரைத் தொடர்பை ‘ஏனெனில்’ வெளிப்படுத்துகிறது. எபிரெயத்தில் மறைமுகமாக உள்ள அறியாமையின் பொருள் தமிழில் ‘அவை என்னவென்று’ என்று நிரப்பப்பட்டுள்ளது; பன்மை வினை குழுவின் அறியாமையைப் பாதுகாக்கிறது.
