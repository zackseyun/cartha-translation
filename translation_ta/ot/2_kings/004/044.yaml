base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: ta
  text: அவன் அதை அவர்கள் முன் வைத்தான்; அவர்கள் சாப்பிட்டு, யாவேயின் வார்த்தையின்படி சிலவற்றை மீதியாக விட்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலது மீதமிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: வைத்தான்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தான்/வைத்தான்.’ לִפְנֵיהֶם என்பதுடன் உணவு பரிமாறும் சூழலில் ‘அவர்கள் முன் வைத்தான்’ என்பது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது. ‘அதை’ என்பது முந்தைய வசனத்திலுள்ள உணவைக் குறிக்கச் சூழலிலிருந்து சேர்க்கப்பட்டது.
- source_word: לִפְנֵיהֶם
  choice: அவர்கள் முன்
  rationale: இந்த முன்னிடைச்சொல் தொடர் நேரடியாக ‘அவர்கள் முன்’ அல்லது ‘அவர்களுக்கு முன்னால்’ என்று பொருள்படும்; உணவு பரிமாறும் சூழலில் ‘அவர்கள் முன்’ இயல்பான தமிழ்.
- source_word: וַיֹּאכְלוּ
  choice: அவர்கள் சாப்பிட்டார்கள்
  rationale: אכל என்ற வினையின் தொடர்கதை வடிவத்தை நேரடியாகவும் நவீனத் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיּוֹתִרוּ
  choice: சிலவற்றை மீதியாக விட்டார்கள்
  rationale: יתר என்பதன் ஹிஃபில் வடிவம் ‘மீதியாக விட்டார்கள்/மீதமிருக்கச் செய்தார்கள்’ என்ற பொருளைத் தருகிறது. உணவுக்குப் பின் எஞ்சியிருந்ததைத் தெளிவாகக் காட்டும் அதேவேளையில், செய்பவர்களைக் குறிக்கும் எபிரெய வடிவத்தையும் பாதுகாக்கிறது.
- source_word: כִּדְבַר
  choice: வார்த்தையின்படியே
  rationale: ‘வார்த்தையின்படி’ என்ற முறையான தொடர்பைத் தக்கவைத்து, நிகழ்ந்தது இறைச்சொல்லுக்கு இசைவாக இருந்ததை வெளிப்படுத்துகிறது. ‘-ஏ’ நிகழ்வுக்கும் முன் கூறப்பட்ட வார்த்தைக்கும் உள்ள துல்லிய ஒத்திசைவை இயல்பாக வலியுறுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே பட்டத்தைப் பதிலீடு செய்யாமல் பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיּוֹתִרוּ என்பதில் மீதமானதைக் கூறும் முறை
  choice: சிலவற்றை மீதியாக விட்டார்கள்
  alternative: சிலது மீந்திருந்தது
  rationale: எபிரெயத்தில் வினையின் இலக்கண எழுவாய் ‘அவர்கள்’ என்பதால் முதன்மை உரை அதைத் தக்கவைக்கிறது. இருப்பினும் சூழலில் விளைவை முன்னிறுத்தி ‘சிலது மீந்திருந்தது’ என்றும் இயல்பாகப் புரிந்துகொள்ளலாம்; அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்கதைச் செயற்பாடுகள் குறுகிய வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; இறைவாக்குடன் நிகழ்வு ஒத்துப்போனதை ‘வார்த்தையின்படியே’ தக்கவைக்கிறது.
