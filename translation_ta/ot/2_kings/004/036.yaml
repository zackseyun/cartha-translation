  text: וַ/יִּקְרָ֣א אֶל גֵּיחֲזִ֗י וַ/יֹּ֨אמֶר֙ קְרָא֙ אֶל הַ/שֻּׁנַמִּ֣ית הַ/זֹּ֔את וַ/יִּקְרָאֶ֖/הָ וַ/תָּב֣וֹא אֵלָ֑י/ו וַ/יֹּ֖אמֶר שְׂאִ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: ta
  text: பின்பு அவன் கேகாசியை அழைத்து, “சூனேம் ஊரைச் சேர்ந்த இந்தப் பெண்ணை[a] அழை” என்றான். அவன் அவளை அழைத்தான்; அவள் அவனிடம் வந்தாள். அப்போது அவன், “உன் மகனைத் தூக்கிக்கொள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சூனேமியளை.” எபிரெயத்தில் பெண்பால் ஊர்சார் பெயர் பயன்படுத்தப்பட்டுள்ளது; சொல்லுக்குச் சொல், “இந்தச் சூனேமியளை [பெண்ணை].”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: அவன் கேயாசியை அழைத்து
  rationale: קרא אֶל என்பது ஒருவரை அழைப்பதைக் குறிக்கிறது. தொடர் நிகழ்வை இயல்பான தமிழ் நடையில் காட்டுவதற்காக וַ־ ‘பின்பு’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: சூனேமைச் சேர்ந்த இந்தப் பெண்ணை
  rationale: பெண்பால் இன/ஊர்சார் பெயரான שׁוּנַמִּית, சூனேமைச் சேர்ந்த பெண்ணைக் குறிக்கிறது. நவீன வாசகர்களுக்குத் தெளிவாக ஊருடனான தொடர்பை வெளிப்படையாகக் கூறி, הַזֹּאת என்பதன் சுட்டுப்பொருளை ‘இந்த’ எனப் பேணுகிறது.
- source_word: וַיִּקְרָאֶהָ
  choice: அவன் அவளை அழைத்தான்
  rationale: கேயாசி கட்டளைக்குக் கீழ்ப்படிந்ததை எபிரெய உரை தனியாகக் கூறுவதால், קרא என்பதன் மறுபயன்பாடு சுருக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַתָּבוֹא אֵלָיו
  choice: அவள் அவனிடம் வந்தாள்
  rationale: בוא + אֶל என்பது ஒருவரை நோக்கி வருவதைக் குறிக்கும் நேரடியான சொற்றொடர்; அறைக்குள் நுழைந்தாள் என்ற தேவையற்ற பொருள் சேர்க்கப்படவில்லை.
- source_word: שְׂאִי
  choice: தூக்கிக்கொள்
  rationale: נשׂא என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம் இச்சூழலில் மகனைத் தூக்கி எடுத்துக்கொள்ளும்படி கூறுகிறது. ‘தூக்கிக்கொள்’ செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְנֵךְ
  choice: உன் மகனை
  rationale: בן என்பது பொதுவாக ‘குழந்தை’ என்பதைக் காட்டிலும் குறிப்பாக ‘மகன்’ என்பதால் அதன் சொற்பொருள் துல்லியம் பேணப்பட்டுள்ளது.
