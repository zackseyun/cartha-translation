base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: ta
  text: அந்தப் பெண் கர்ப்பமடைந்து, அந்தக் குறிப்பிட்ட காலத்தில், அதாவது அடுத்த ஆண்டு இதே காலத்தில், எலிசா அவளிடம் சொன்னபடியே ஒரு மகனைப் பெற்றெடுத்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “இந்தக் குறிப்பிட்ட காலத்தில், வாழ்வின் காலத்தில்”; இது அடுத்த ஆண்டின் இதே காலத்தைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: கர்ப்பமடைந்து
  rationale: הרה என்ற வினை கருவுறுதல் அல்லது கர்ப்பமடைதலைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: முன்னரே அறிமுகமான சூனேமியப் பெண்ணைச் சுட்டுவதால், உரையாடல் தொடர்ச்சியைத் தெளிவாக்கும் வகையில் ‘அந்தப் பெண்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד + בן என்பது மகனைப் பெற்றெடுத்தலைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர்; இது நவீனத் தமிழில் இயல்பான வடிவம்.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: குறிக்கப்பட்ட அந்த நேரத்தில்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது. பின்னோக்கிக் கூறும் கதைநடையில் הַזֶּה என்பதற்கு ‘அந்த’ என்பது இயல்பாக அமைகிறது.
- source_word: כָּעֵת חַיָּה
  choice: அடுத்த ஆண்டு ஏறக்குறைய அதே காலத்தில்
  rationale: இது அடுத்த ஆண்டின் இதே பருவத்தை அல்லது காலத்தைச் சுட்டும் எபிரெய மரபுத்தொடர். சொற்சொல் வடிவின் மறைபொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ אֱלִישָׁע
  choice: எலிசா அவளிடம் சொன்னபடியே
  rationale: முன்னர் எலிசா கூறிய சொல் அப்படியே நிறைவேறியதைத் தொடர்புப்படுத்தும் இயல்பான தமிழ் அமைப்பு.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டது.
