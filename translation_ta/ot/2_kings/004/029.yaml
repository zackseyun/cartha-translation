  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கதையின் கண்ணியமான, அவசரமான தொனியைப் பேணியும் வடிவமைக்கப்பட்டது. கட்டளைகள் சுருக்கமாகவும் நேரடியாகவும் வைக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடரின் உட்பொருள் உரையில் இயல்பாக்கப்பட்டு அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
