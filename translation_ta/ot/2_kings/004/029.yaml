base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: ta
  text: அப்போது அவர் கேயாசியிடம், “உன் ஆடையை இடுப்பில் வரிந்துகட்டிக்கொள்[a], என் கோலை உன் கையில் எடுத்துக்கொண்டு போ. யாரையாவது[c] சந்தித்தால் அவருக்கு வணக்கம் சொல்லாதே; யாராவது உனக்கு வணக்கம் சொன்னால் அவருக்குப் பதில் சொல்லாதே[b]. என் கோலை அந்தச் சிறுவனின் முகத்தின்மேல் வை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “உன் இடுப்பைக் கட்டிக்கொள்”; விரைவாகச் செயல்படத் தயாராகும்படி ஆடையை இடுப்பில் வரிந்துகட்டுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “வணக்கம் சொல்” என்பதற்கான எபிரெய வினைச்சொல்லை “ஆசீர்வதி” என்றும் மொழிபெயர்க்கலாம்; இங்கு வழியில் வணக்கப் பரிமாற்றம் செய்வதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “யாரையாவது” என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் “ஒரு மனிதனை”; இச்சூழலில் அது பொதுப்பொருளில் எவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: உன் ஆடையை இடுப்பில் வரிந்துகட்டிக்கொண்டு
  rationale: சொல்லுக்குச் சொல் பொருள் ‘உன் இடுப்பைக் கட்டிக்கொள்.’ நீண்ட ஆடையை இடுப்பில் வரிந்துகட்டி, விரைவான செயலுக்குத் தயாராவதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁעַנְתִּי
  choice: என் கோலை
  rationale: சாய்ந்து கொள்ள உதவும் கோல் அல்லது கைத்தடியைக் குறிக்கிறது. இக்கதையில் தீர்க்கதரிசியின் பொருளாக எடுத்துச் செல்லப்பட்டு சிறுவன்மேல் வைக்கப்படுவதால் ‘கோல்’ இயல்பான தேர்வு.
- source_word: וָלֵךְ
  choice: போ
  rationale: நேரடியான இயக்கக் கட்டளை; சுற்றிவளைக்காமல் அதன் அவசரத் தொனியைப் பேணுகிறது.
- source_word: כִּי תִמְצָא אִישׁ
  choice: யாரையாவது சந்தித்தால்
  rationale: אִישׁ என்பதன் அடிப்படைப் பொருள் ‘ஆண்/மனிதன்’ என்றாலும், வழியில் சந்திக்கக்கூடிய எவரையும் பொதுவாகக் குறிக்கிறது. ‘யாரையாவது’ அந்தப் பொதுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: அவருக்கு வாழ்த்துச் சொல்லாதே / யாராவது உனக்கு வாழ்த்துச் சொன்னால்
  rationale: ברך என்பதற்கு அடிப்படையில் ‘ஆசீர்வதி’ என்ற பொருள் உண்டு; ஆனால் வழியில் ஒருவரைச் சந்திக்கும் இச்சூழலில் பரிமாறப்படும் வாழ்த்தையே குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது மூலத்தின் மீளுரையைப் பேணுகிறது.
- source_word: לֹא תַעֲנֶנּוּ
  choice: அவருக்குப் பதில் சொல்லாதே
  rationale: ענה இங்கு பதிலளிப்பதைக் குறிக்கிறது. கட்டளையின் சுருக்கத்தையும் அவசரத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: என் கோலை அந்தச் சிறுவனின் முகத்தின்மேல் வை
  rationale: שׂים என்பதன் ‘வை’ என்ற நேரடிப் பொருளையும், עַל־פְּנֵי என்பதன் ‘முகத்தின்மேல்’ என்ற குறிப்பையும் பொதுமைப்படுத்தாமல் பேணுகிறது.
- source_word: הַנָּעַר
  choice: அந்தச் சிறுவன்
  rationale: נַעַר என்பது சிறுவன், இளைஞன் அல்லது பணியாள் ஆகிய பொருள்களை ஏற்கலாம். இங்கு சூனேமியப் பெண்ணின் மகனைக் குறிப்பதால் ‘சிறுவன்’ சூழலுக்குப் பொருத்தமானது; ‘அந்த’ என்பது ஏற்கெனவே அறிமுகமான குழந்தையைக் குறிக்கும் தமிழின் இயல்பான சுட்டு.
