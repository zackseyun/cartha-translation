  to: 'தீர்க்கதரிசிகளின் சீடர்களுடைய மனைவியரில் ஒருத்தி எலிசாவிடம் கூக்குரலிட்டு முறையிட்டாள்: “உமது அடியானாகிய என் கணவர் இறந்துவிட்டார். உமது அடியான் யாவேவுக்குப் பயந்தவர் என்பது உமக்குத் தெரியும். இப்போது கடன் கொடுத்தவன் என் இரண்டு பிள்ளைகளையும்[a] தனக்காக அடிமைகளாக எடுத்துக்கொள்ள வந்திருக்கிறான்.”'
  rationale: The revision removes the unsupported assertion that the woman wept and restores the source's specific sense that the creditor has come to take the children into servitude for himself. All other central lexical and theological choices are retained.
