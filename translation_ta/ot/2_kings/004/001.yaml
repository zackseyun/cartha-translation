  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இவ்வசனம் பொதுப்பட்டத்தை அல்ல, எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: בְנֵי הַנְּבִיאִים என்ற சமூக அடையாளம்
  choice: தீர்க்கதரிசிகளின் சீடர்கள்
  alternative: தீர்க்கதரிசிகளின் மகன்கள்
  rationale: இது தீர்க்கதரிசிகளின் குழு அல்லது பயிற்சி வட்டத்தைச் சேர்ந்தவர்களைக் குறிக்கும் மரபுத்தொடர்; உயிரியல் மகன்கள் என்று வாசிக்கத் தூண்டும் சொற்சொல் மொழியாக்கம் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க நேரடி உரைக்காக “உமது/உமக்கு” வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை பொதுவாசகருக்கு எளிமையாக வைக்கப்பட்டாலும், தீர்க்கதரிசிச் சமூகத்தின் அடையாளம், தெய்வீகப் பெயர், கடன் அடிமைத்தனத்தின் தீவிரம் ஆகியவை மங்காமல் பாதுகாக்கப்பட்டுள்ளன.
