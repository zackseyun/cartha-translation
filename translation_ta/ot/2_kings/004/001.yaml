base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: ta
  text: 'தீர்க்கதரிசிகளின் சீடர்களுடைய மனைவியரில் ஒருத்தி எலிசாவிடம் கூக்குரலிட்டு முறையிட்டாள்: “உமது அடியானாகிய என் கணவர் இறந்துவிட்டார். உமது அடியான் யாவேவுக்குப் பயந்தவர் என்பது உமக்குத் தெரியும். இப்போது கடன் கொடுத்தவன் என் இரண்டு பிள்ளைகளையும்[a] தனக்காக அடிமைகளாக எடுத்துக்கொள்ள வந்திருக்கிறான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இரண்டு மகன்களையும்.” எபிரெய மூலத்தில் பாலினத்தைக் குறிப்பாகச் சொல்லாத “பிள்ளைகள்” என்ற சொல் உள்ளது; சூழலின் அடிப்படையில் இதை “மகன்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: மனைவியரில் ஒருத்தி
  rationale: அடுத்த தொடருடன் இணைத்து, புதிய நிகழ்வில் பெயர் குறிப்பிடப்படாத ஒரு பெண்ணை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; மூலத்தில் இல்லாத காலக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் சீடர்களுடைய மனைவியரில்
  rationale: בְנֵי הַנְּבִיאִים என்பது உயிரியல் மகன்களைக் காட்டிலும் தீர்க்கதரிசிகளின் சமூகத்தைச் சேர்ந்த சீடர்களைக் குறிக்கும் மரபுத்தொடர்; தவறான புரிதலைத் தவிர்த்து சமூக உறவைத் தெளிவாக்குகிறது.
- source_word: צָעֲקָה
  choice: அழுது முறையிட்டாள்
  rationale: பெண்ணின் துயரத்தையும் அவசரமான உதவிக் கூக்குரலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ אִישִׁי
  choice: உமது அடியானாகிய என் கணவர்
  rationale: எலிசாவுடனான பணிவுறவையும் பெண்ணுடனான மணவுறவையும் இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֵת
  choice: இறந்துவிட்டார்
  rationale: முடிந்த நிகழ்வின் தற்போதைய விளைவைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: யாவேவுக்குப் பயந்தவர்
  rationale: இறைபக்தியையும் மரியாதையையும் உள்ளடக்கும் வேதாகம மரபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல் எபிரெயத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הַנֹּשֶׁה
  choice: கடன் கொடுத்தவன்
  rationale: சட்டப் பொருளாதாரச் சூழலில் கடன் பெற வேண்டிய நபரை சாதாரண வாசகருக்குப் புரியும் நடப்புத் தமிழில் குறிக்கிறது.
- source_word: בָּא לָקַחַת
  choice: அடிமைகளாக்கிக்கொள்ள வந்திருக்கிறான்
  rationale: அச்சுறுத்தல் தற்போது வந்து நின்றிருப்பதையும், பிள்ளைகளை எடுத்துச் செல்லும் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי יְלָדַי
  choice: என் இரண்டு பிள்ளைகளையும்
  rationale: יְלָדַי பாலினத்தை வெளிப்படையாகக் குறிப்பிடாததால், அதே பரந்த பொருளைத் தமிழிலும் வைத்திருக்கிறது.
- source_word: לַעֲבָדִים
  choice: அடிமைகளாக
  rationale: கடனுக்காக மனிதர்களைத் தன் அதிகாரத்தின்கீழ் எடுத்துக்கொள்ளும் கடுமையான நிலையை மறைக்காமல் காட்டுகிறது; இங்கு வெறும் கூலிப் பணியாளர்கள் என்ற பொருள் போதாது.
