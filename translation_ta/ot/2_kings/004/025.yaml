  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: ta
  text: அவள் கர்மேல் மலைக்குச் சென்று, அங்கே இருந்த இறைவனுடைய மனிதரிடம் வந்தாள். இறைவனுடைய மனிதர் அவளைத் தொலைவில்[a] கண்டபோது, தம் பணியாளன் கேயாசியிடம், “அதோ, அந்தச் சூனேமியப் பெண்!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூரத்திலிருந்து.” எபிரெயச் சொற்றொடர், அவள் இன்னும் சிறிது தொலைவில் இருக்கும்போதே அவர் அவளைக் கண்டார் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: அவள் புறப்பட்டு ... சென்று ... வந்தாள்
  rationale: தொடர்ச்சியான கதைநடையை இயல்பான தமிழில் தருகிறது; ‘சென்றாள்/வந்தாள்’ என்ற எபிரெயச் செயல்களின் வரிசையையும் காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: ‘இறைவாக்கினர்’ என்று விளக்கிப் பொருள் சேர்க்காமல், எபிரெயச் சிறப்புப் பட்டத்தை நேரடியாகவும் மரியாதையாகவும் மொழிபெயர்க்கிறது.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: கர்மேல் மலைக்குச் சென்று அங்கே இருந்த
  rationale: இயக்கத்தின் இலக்கு கர்மேல் மலை என்பதையும், இறைவனுடைய மனிதர் அங்கே இருந்தார் என்பதையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִנֶּגֶד
  choice: தொலைவில்
  rationale: அவள் இன்னும் சிறிது தூரத்தில் இருந்தபோதே அவர் கண்டார் என்ற சூழல்சார் இடவுணர்வைத் தருகிறது; மாற்றுப் பொருளை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: נַעֲרוֹ
  choice: தம் பணியாளன்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய இளைஞன்’ என்றாலும், இச்சூழலில் கேயாசியின் உதவியாளர்/பணியாளர் பங்கை இயல்பாகக் குறிக்கிறது.
- source_word: הִנֵּה
  choice: அதோ
  rationale: தொலைவில் தென்படும் ஒருவரை உடனடியாகச் சுட்டிக்காட்டும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: அந்தச் சூனேமியப் பெண்
  rationale: அவள் சூனேமைச் சேர்ந்தவள் என்பதையும், தொலைவில் உள்ள குறிப்பிட்ட பெண்ணைச் சுட்டும் demonstrative வலிமையையும் காக்கிறது.
