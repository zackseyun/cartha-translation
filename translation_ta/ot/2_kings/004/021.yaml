source:
  edition: WLC
  text: וַ/תַּ֨עַל֙ וַ/תַּשְׁכִּבֵ֔/הוּ עַל מִטַּ֖ת אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תִּסְגֹּ֥ר בַּעֲד֖/וֹ וַ/תֵּצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: ta
  text: பின்பு அவள் மேலே சென்று, கடவுளின் மனிதரின் படுக்கையில் அவனைக் கிடத்தினாள். அவனை உள்ளே வைத்துக் கதவை மூடிவிட்டு[a] வெளியே சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை, “அவனுக்குப் பின்னால் கதவை மூடிவிட்டு” என்றும் மொழிபெயர்க்கலாம்; அவன் அறைக்குள் இருக்கும்படி அவள் கதவை மூடினாள் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: அவள் மேலே சென்று
  rationale: עלה என்பதன் இடஞ்சார்ந்த ‘மேலே செல்’ என்ற பொருளைப் பாதுகாக்கிறது; சூழலில் இது மேலறைக்குச் செல்வதைக் குறிக்கலாம்.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: அவனைக் கிடத்தினாள்
  rationale: שׁכב என்பதன் காரணவினைப் பொருளான ‘படுக்கச் செய்தல்/கிடத்துதல்’ என்பதை இயல்பான தமிழில் தருகிறது.
- source_word: מִטַּת
  choice: கட்டிலில்
  rationale: מִטָּה என்பது படுக்கை அல்லது கட்டிலைக் குறிக்கிறது; இச்சூழலில் ‘கட்டில்’ தெளிவான, இயல்பான சொல்.
- source_word: אִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: எலிசா ஒரு தீர்க்கதரிசி என்றாலும், மூலத்தின் நிலையான பட்டத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: அவனை உள்ளே வைத்து கதவை மூடிவிட்டு
  rationale: ‘அவனை அடைத்து/அவனுக்குப் பின்னால் மூடுதல்’ என்ற எபிரெயச் சொற்றொடரின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது. ‘கதவு’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும் வினைத்தொடரில் சூழலால் உணரப்படும் பொருள்.
- source_word: וַתֵּצֵא
  choice: வெளியே சென்றாள்
  rationale: יצא என்பதன் நேரடியான இயக்கப் பொருளான ‘வெளியே செல்’ என்பதைப் பாதுகாக்கிறது.
