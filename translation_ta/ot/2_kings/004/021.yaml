translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் தொடர் செயல்கள் இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; ‘கடவுளின் மனிதர்’ என்ற மூலப் பட்டம் விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளது.
