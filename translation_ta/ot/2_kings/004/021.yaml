- from: பின்பு அவள் மேலே சென்று, கடவுளின் மனிதருடைய கட்டிலில் அவனைக் கிடத்தினாள். அவனை உள்ளே வைத்து கதவை மூடிவிட்டு[a] வெளியே சென்றாள்.
  to: பின்பு அவள் மேலே சென்று, கடவுளின் மனிதரின் படுக்கையில் அவனைக் கிடத்தினாள். அவனை உள்ளே வைத்துக் கதவை மூடிவிட்டு[a] வெளியே சென்றாள்.
  rationale: 'The revision makes only stylistic and syntactic improvements. It preserves the Hebrew narrative actions: she went up, laid him on the man of God’s bed, shut the door so that he remained inside, and went out. The footnote continues to mark the Hebrew idiom’s alternative, more literal spatial rendering.'
