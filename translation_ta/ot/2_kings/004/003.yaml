  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: ta
  text: அப்போது அவர், “நீ வெளியே சென்று, உன் அயலார் எல்லாரிடமிருந்தும் உனக்காகப் பாத்திரங்களைக் கடனாக வாங்கு[a]—காலிப் பாத்திரங்களைக் கடனாக வாங்கு; சிலவற்றை மட்டும் வாங்காதே[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாத்திரங்களைக் கேள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் பொதுவாக ‘கேள்’ என்று பொருள்படும்; இச்சூழலில் அயலாரிடமிருந்து தற்காலிகப் பயன்பாட்டுக்காகப் பாத்திரங்களைப் பெறுவதைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘குறைவாக்காதே’ அல்லது ‘சிலவாக ஆக்காதே.’ இச்சூழலில் மிகச் சில பாத்திரங்களை மட்டும் பெறாதே என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: நீ போய்
  rationale: பெண்பால் ஒருமை கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: שַׁאֲלִי
  choice: கடனாகக் கேட்டு வாங்கு
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கேள்’; இச்சூழலில் அயலாரிடமிருந்து தற்காலிகப் பயன்பாட்டுக்குப் பாத்திரங்களைப் பெறுவதைக் குறிக்கும் ‘கடனாகக் கேட்டு வாங்கு’ என்பது பொருத்தமானது. ‘கடன் வாங்கு’ என்று மட்டும் மொழிபெயர்த்தால் பணக்கடன் என்ற தவறான எண்ணம் வரக்கூடும்.
- source_word: כֵּלִים
  choice: பாத்திரங்கள்
  rationale: எண்ணெயை ஏற்றுக்கொள்ளும் பலவகைக் கொள்கலன்களைக் குறிக்கக்கூடிய இயல்பான பொதுச்சொல்; ‘குடங்கள்’ எனக் குறிப்பிட்ட வடிவத்துக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: לָךְ
  choice: உனக்காக
  rationale: பெறுபவளின் நலன் அல்லது பயன்பாட்டைக் குறிக்கும் தத்திவுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִן הַחוּץ
  choice: வெளியே
  rationale: சொற்பொருள் ‘வெளியிலிருந்து’; தமிழில் செயல் நகர்வோடு இணைத்து ‘வெளியே ... கேட்டு வாங்கு’ என்பது இயல்பாக உள்ளது.
- source_word: מֵאֵת כָּל שכנכי
  choice: உன் அயலார் எல்லாரிடமிருந்தும்
  rationale: அவளுக்கு அருகில் வசிப்போர் அனைவரையும் குறிக்கும் எபிரேயத் தொடரைத் தெளிவாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: כֵּלִים רֵקִים
  choice: காலிப் பாத்திரங்கள்
  rationale: பாத்திரங்கள் எண்ணெய் இல்லாமல் காலியாக இருக்க வேண்டும் என்ற குறிப்பைத் தக்கவைக்கிறது; எபிரேயத்தின் வலியுறுத்தலுக்கு ஏற்ப ‘பாத்திரங்கள்’ மீண்டும் வருகிறது.
- source_word: אַל תַּמְעִיטִי
  choice: கொஞ்சமாக மட்டும் வாங்காதே
  rationale: சொல்லர்த்தமான ‘குறைவாக்காதே’ என்பதன் சூழல்சார் பொருள், மிகச் சில பாத்திரங்களோடு நிறுத்திக்கொள்ள வேண்டாம் என்பதாகும்; நவீனத் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
