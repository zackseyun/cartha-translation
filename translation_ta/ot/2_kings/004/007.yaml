source:
  edition: WLC
  text: וַ/תָּבֹ֗א וַ/תַּגֵּד֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יֹּ֗אמֶר לְכִי֙ מִכְרִ֣י אֶת הַ/שֶּׁ֔מֶן וְ/שַׁלְּמִ֖י אֶת נשי/כי וְ/אַ֣תְּ בני/כי תִֽחְיִ֖י בַּ/נּוֹתָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: ta
  text: அப்போது அவள் வந்து கடவுளின் மனிதரிடம் தெரிவித்தாள். அவர் அவளிடம், “நீ போய் அந்த எண்ணெயை விற்று, உன் கடன்களைச் செலுத்து[a]. மீதியைக் கொண்டு நீயும் உன் மகன்களும் வாழலாம்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, அடிப்படை வடிவம் கடனை அல்லாமல் கடன் கொடுத்த நபரைக் குறிப்பதாக எடுத்தால், “உனக்குக் கடன் கொடுத்தவருக்குச் செலுத்து.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “மீதியினால் நீயும் உன் மகன்களும் வாழ்வீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: அப்போது அவள் வந்து … தெரிவித்தாள்
  rationale: தொடர்ச்சியான எபிரெயக் கதை வினைகள் நிகழ்வின் அடுத்த கட்டத்தைச் சுட்டுகின்றன. ‘அப்போது’ இயல்பான தமிழில் அந்த வரிசையை வெளிப்படுத்துகிறது; נגד என்பதன் ஹிஃபில் வடிவத்திற்கு ‘தெரிவித்தாள்’ பொருத்தமானது.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதரிடம்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பட்டப்பெயரைப் பாதுகாக்கிறது; அதை விளக்கமாக ‘தீர்க்கதரிசியிடம்’ என்று மாற்றவில்லை. மரியாதைப் பன்மை விகுதி இயல்பான, கண்ணியமான தமிழை வழங்குகிறது.
- source_word: לְכִי מִכְרִי אֶת־הַשֶּׁמֶן
  choice: நீ போய் அந்த எண்ணெயை விற்று
  rationale: பெண்ணை நோக்கிய இரு கட்டளைகளையும் இயல்பான தமிழ் வினையெச்சத் தொடரில் வழங்குகிறது. שמן என்பதை உரையில் இல்லாத ‘ஒலிவ எண்ணெய்’ என்ற கூடுதல் குறிப்பின்றி ‘எண்ணெய்’ என மொழிபெயர்க்கிறது.
- source_word: וְשַׁלְּמִי אֶת־נשיכי
  choice: உன் கடன்களைச் செலுத்து
  rationale: நிதிச் சூழலில் שלם என்பதற்கு ‘செலுத்து’ இயல்பான இணை. மூல வடிவத்தின் பன்மைத் தோற்றத்தையும் சூழலிலுள்ள கடன் பொறுப்பையும் ‘கடன்களை’ வெளிப்படுத்துகிறது; நபரைக் குறிக்கும் வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: நீயும் உன் மகன்களும்
  rationale: בנים என்பதை பொதுவான ‘பிள்ளைகள்’ என்று மாற்றாமல், மூலத்தில் உள்ள பாலினக் குறிப்புப்படி ‘மகன்கள்’ எனப் பாதுகாக்கிறது.
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: மீதியைக் கொண்டு … வாழலாம்
  rationale: மீதமுள்ள விற்பனைத் தொகை அவர்களின் வாழ்வாதாரமாக இருக்க முடியும் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது. நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டப்பெயர்
  choice: கடவுளின் மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: இச்சூழலில் அது ஒரு தீர்க்கதரிசியைக் குறித்தாலும், மூல உரையின் தனித்துவமான பட்டப்பெயரை விளக்கச் சொல்லால் மாற்றாமல் வைத்திருப்பது உரைத் தெளிவையும் இறையியல் நடுநிலையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெண்ணை நோக்கிய எபிரெய ஒருமைக் கட்டளைகள் தமிழில் ‘நீ’ எனத் தெளிவாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
