base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: ta
  text: பின்பு அவர் மேலே ஏறிப்போய், அந்தப் பையன்மேல் படுத்தார். தமது வாயை அவனுடைய வாயின்மேலும், தமது கண்களை அவனுடைய கண்களின்மேலும், தமது உள்ளங்கைகளை அவனுடைய உள்ளங்கைகளின்மேலும் வைத்தார். பிறகு அவன்மேல் தம்மை நீட்டிப் படர்ந்தார்[a]; அப்போது பையனின் சதை சூடானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன்மேல் குனிந்தார்.” இங்கு வரும் எபிரேய வினை அரிதானது; அது குழந்தையின்மேல் குனிவதையோ உடலை நீட்டிப் படர்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே ஏறிப்போய்
  rationale: עלה என்பதன் அடிப்படைப் பொருளான மேலே செல்வதைப் பேணுகிறது; ‘மேலறைக்கு’ என்பது சூழலில் புரிந்தாலும் இவ்வசனத்தில் வெளிப்படையாக இல்லை.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: அந்தப் பையன்மேல் படுத்தார்
  rationale: שׁכב மற்றும் עַל குறிக்கும் நேரடியான உடல்சார் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: தமது வாயை அவனுடைய வாயின்மேல் வைத்தார்
  rationale: שׂים என்பதற்கு இயல்பான ‘வைத்தார்’ என்பதையும் உடலுறுப்புகளின் நேரடியான தொடர்பையும் பேணுகிறது.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: தமது கண்களை அவனுடைய கண்களின்மேல்
  rationale: எபிரேய வாக்கியத்தின் இணை அமைப்பையும் இருவரின் உடலுறுப்புகளுக்கிடையேயான பொருத்தத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: தமது உள்ளங்கைகளை அவனுடைய உள்ளங்கைகளின்மேல்
  rationale: כַּף என்பதன் குறிப்பான பொருள் ‘உள்ளங்கை’; பொதுவான ‘கைகள்’ என்பதைவிட மூலத்தின் உடல்சார் துல்லியத்தைப் பேணுகிறது.
- source_word: וַיִּגְהַר עָלָיו
  choice: அவன்மேல் குனிந்து படர்ந்தார்
  rationale: அரிதான גהר வினை குனிதல் அல்லது உடலை நீட்டி ஒருவர்மேல் படர்தல் என்ற உடல்நிலையைக் குறிக்கிறது; இரு நுணுக்கங்களையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: பையனின் உடல் சூடடைந்தது
  rationale: חם குறிக்கும் சூடாதலைத் தெளிவாக வழங்குகிறது. בָּשָׂר என்பதற்கு நேரடியாக ‘சதை’ எனலாம்; ஆனால் இச்சூழலில் ‘உடல்’ என்பது இயல்பான தமிழாக இருந்து உடல்சார் கருத்தைத் தக்கவைக்கிறது.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: பையன்
  rationale: יֶלֶד என்பது குழந்தை அல்லது பையன் எனப் பொருள்படும்; சூழலில் அவன் மகன் என்பதால் ‘பையன்’ பொருத்தமானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: இறந்த பையன்மீது எலிசா செய்த செயலின் இயல்பு
  choice: உடல்சார் செயல்களை மூலத்தில் உள்ளபடி தெளிவாக விவரித்து, அவற்றின் செயல்முறைக்கு விளக்கம் சேர்க்கவில்லை.
  alternative: இதை உயிர்ப்பூட்டும் மருத்துவச் செயல் என விவரிப்பது அல்லது உடல்சார் விவரங்களை மழுப்புவது.
  rationale: எபிரேயம் தீர்க்கதரிசியின் செயலைத் தெளிவாக விவரிக்கிறது; ஆனால் அந்தச் செயல் எவ்வாறு பலனளித்தது என்பதை விளக்கவில்லை. ஆகவே காலத்திற்குப் பிந்தைய மருத்துவ அல்லது சடங்கியல் கருத்துகள் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. எலிசாவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பையனைக் குறிக்க ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. அரிதான גהר வினையின் தெளிவின்மை அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
