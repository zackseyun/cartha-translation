translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான முன்மொழிவாகவும் எளிதில் புரியும் இல்லறச் சொல்லாட்சியுடனும் அமைக்கப்பட்டது. வசனத்தின் உரையாடல் தன்மையைப் பாதுகாக்க மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
