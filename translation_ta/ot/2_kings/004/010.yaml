id: 2KI.4.10
reference: 2 Kings 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: ta
  text: “சுவர்மேல் ஒரு சிறிய மேலறையை நாம் கட்டுவோமாக[a]. அதில் அவருக்காக ஒரு கட்டில், ஒரு மேசை, ஒரு நாற்காலி, ஒரு விளக்குத்தண்டு ஆகியவற்றை வைப்போம். அவர் நம்மிடம் வரும்போதெல்லாம்[b] அங்கே தங்கிச் செல்லலாம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுவருடன் கூடிய ஒரு சிறிய மேலறையை” அல்லது “ஒரு சிறிய மேலறையை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் நம்மிடம் வரும்போது அங்கே ஒதுங்கலாம்.” இங்குள்ள எபிரெய வினைச்சொல் பொதுவாக “விலகிச் செல்” அல்லது “ஒதுங்கு” என்று பொருள்படும்; இச்சூழலில் வழியிலிருந்து விலகி வந்து தங்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: நாம் கட்டுவோமாக
  rationale: முதல் நபர் பன்மை விருப்பவினையின் முன்மொழியும் தன்மையை இயல்பான தமிழில் தருகிறது; அறையை உருவாக்கும் சூழலில் ‘கட்டு’ தெளிவாக உள்ளது.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: சுவர்மேல் ஒரு சிறிய மேலறை
  rationale: עֲלִיָּה என்பதற்கு ‘மேலறை’ என்றும், קִיר என்பதன் தெளிவான ‘சுவர்’ உருவகத்தையும் காத்து மொழிபெயர்க்கப்பட்டுள்ளது; எபிரெயச் சொற்றொடரின் கட்டமைப்பு சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: அதில் அவருக்காக ... வைப்போம்
  rationale: שׂים என்பதன் ‘வை’ என்ற பொதுப்பொருளையும், לוֹ என்பதன் பயனாளிப் பொருளையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: מִטָּה
  choice: ஒரு கட்டில்
  rationale: தங்குவதற்குரிய படுக்கைச் சாதனத்தை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: שֻׁלְחָן
  choice: ஒரு மேசை
  rationale: வீட்டு உபயோகப் பொருளுக்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: כִסֵּא
  choice: ஒரு நாற்காலி
  rationale: இந்த வீட்டு அறைகலன் சூழலில் பொதுவான ‘இருக்கை’ என்பதைவிட குறிப்பாகவும் இயல்பாகவும் உள்ளது.
- source_word: מְנוֹרָה
  choice: ஒரு விளக்குத்தண்டு
  rationale: இது வெறும் விளக்கை அல்ல, விளக்கைத் தாங்கும் அமைப்பைக் குறிக்கும் மூலச்சொல்லின் குறிப்பை பாதுகாக்கிறது.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: அவர் நம்மிடம் வரும்போதெல்லாம்
  rationale: எதிர்காலத்தில் மீண்டும் நிகழக்கூடிய சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָסוּר שָׁמָּה
  choice: அங்கே தங்கிச் செல்லலாம்
  rationale: பயணத்திலிருந்து விலகி அங்கே வந்து தங்கும் சூழற்பொருளை இயல்பாகத் தருகிறது; நீண்டகாலம் வசிப்பதாக மிகைப்படுத்தவில்லை.
