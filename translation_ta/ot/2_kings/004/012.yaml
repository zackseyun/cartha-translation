source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל גֵּחֲזִ֣י נַעֲר֔/וֹ קְרָ֖א לַ/שּׁוּנַמִּ֣ית הַ/זֹּ֑את וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: ta
  text: அப்போது அவர் தம் பணியாளனான கேயாசியிடம், “சூனேமைச் சேர்ந்த இந்தப் பெண்ணை[a] அழை” என்றார். அவன் அவளை அழைத்தான்; அவள் அவருக்கு முன்பாக நின்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சுருக்கமாக, “இந்தச் சூனேமியாளை” என்று உள்ளது; அந்தச் சொல் அவளை அவளுடைய ஊரின் அடிப்படையில் அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் … என்றார்
  rationale: தொடர்ச்சியான கதைநிகழ்வைக் குறிக்கும் வடிவத்தை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: גֵּחֲזִי
  choice: கேயாசி
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: נַעֲרוֹ
  choice: தம் பணியாளனான
  rationale: நַעַר என்பதற்கு ‘இளைஞன்’, ‘உதவியாளர்’, ‘பணியாளர்’ ஆகிய பொருள்கள் இருக்கலாம்; இங்கு கேயாசி எலிசாவுக்குச் செய்த பணியைக் கருத்தில் கொண்டு ‘பணியாளன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: קְרָא
  choice: அழை
  rationale: ஒருவரைத் தம்மிடம் வருமாறு அழைப்பதைக் குறிக்கும் எளிய, நேரான தமிழ் சொல்; ‘வரவழை’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: சூனேமைச் சேர்ந்த இந்தப் பெண்ணை[a]
  rationale: பெண்ணை அவளுடைய ஊருடன் தொடர்புபடுத்தி அடையாளப்படுத்தும் எபிரெயச் சொல்லைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது; הַזֹּאת என்பதன் சுட்டுப்பொருளை ‘இந்த’ காக்கிறது.
- source_word: וַיִּקְרָא לָהּ
  choice: அவன் அவளை அழைத்தான்
  rationale: கட்டளையில் வந்த அதே வினையின் மறுபயன்பாட்டைக் காத்து, கேயாசி கட்டளையை நிறைவேற்றியதை இயல்பாகக் கூறுகிறது.
- source_word: וַתַּעֲמֹד
  choice: அவள் … நின்றாள்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘வந்து’ போன்ற இயக்கத்தைச் சேர்க்காமல் עמד என்பதன் நேரடிப் பொருளைக் காக்கிறது.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: இடத்தையும் ஒருவரின் முன்னிலையையும் குறிக்கக்கூடிய எபிரெயத் தொடரைச் சுருக்கமாகத் தருகிறது; மரியாதை ஒருமை எலிசாவைக் குறிக்கிறது.
