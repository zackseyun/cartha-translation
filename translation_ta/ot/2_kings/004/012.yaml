  register: நவீன, எளிதில் புரியும், ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எலிசாவுக்கு மரியாதை ஒருமையும், கேயாசிக்கு இயல்பான ஒருமையும் பயன்படுத்தப்பட்டதால் இறுதியில் வரும் ‘அவருக்கு’ என்பது எலிசாவைத் தெளிவாகச் சுட்டுகிறது.
