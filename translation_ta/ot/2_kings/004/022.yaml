  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: ta
  text: அப்போது அவள் தன் கணவனை அழைத்து, “தயவுசெய்து இளைஞர்களில் ஒருவனையும் பெண் கழுதைகளில் ஒன்றையும் எனக்கு அனுப்புங்கள்; நான் தேவனுடைய மனிதரிடம் ஓடிச் சென்று[a] திரும்பி வருவேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓடிச் சென்று” என்பதற்கான எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “ஓடுதல்”; இங்கே அது அவசரத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: அப்போது அவள் தன் கணவனை அழைத்து
  rationale: தொடர்நிலை கதை வடிவத்தை ‘அப்போது’ இயல்பாகக் காட்டுகிறது; இக்குடும்பச் சூழலில் אִישָׁהּ என்பதற்கு ‘தன் கணவன்’ என்பதே துல்லியமான பொருள்.
- source_word: שִׁלְחָה נָא לִי
  choice: தயவுசெய்து ... எனக்காக அனுப்புங்கள்
  rationale: கட்டளையுடன் வரும் נָא வெளிப்படுத்தும் பணிவான வேண்டுகோளை நவீன மரியாதைத் தமிழில் இது இயல்பாகக் காட்டுகிறது.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: வேலைக்கார இளைஞர்களில் ஒருவன்
  rationale: נַעַר என்பது இளைஞன் அல்லது பணியாள் எனப் பொருள்படலாம்; பயணத்துக்கு உடன் அனுப்பப்படும் வீட்டுப் பணியாளர் என்ற சூழற்பொருளையும் இளமைக்கான சொல்லுணர்வையும் இச்சொற்றொடர் காக்கிறது.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: பெண் கழுதைகளில் ஒன்று
  rationale: אָתוֹן குறிப்பாகப் பெண் கழுதையைக் குறிக்கிறது; எபிரெய மூலத்தில் உள்ள பாலின வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: וְאָרוּצָה
  choice: விரைந்து சென்று
  rationale: רוּץ என்பதன் நேர்ப்பொருள் ‘ஓடு’; இங்கு கழுதையில் பயணம் செய்யும் சூழலில் அது குறிக்கும் அவசரத்தை இயல்பான தமிழில் ‘விரைந்து சென்று’ தெரிவிக்கிறது.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதரிடம்
  rationale: இயக்கச் சூழலில் עַד சென்றடையும் இலக்கைக் குறிக்கிறது; אִישׁ הָאֱלֹהִים என்ற எபிரெய பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கமாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: וְאָשׁוּבָה
  choice: திரும்பி வருகிறேன்
  rationale: முதலாம் நபர் விருப்ப/நோக்க வடிவத்தின் தொடர்ச்சியைத் தமிழில் இயல்பான உடனடி நோக்கக் கூற்றாகத் தருகிறது.
