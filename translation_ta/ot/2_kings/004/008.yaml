base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: ta
  text: ஒரு நாள், எலிசா சூனேம் வழியாகச் சென்றார். அங்கே மதிப்பும் செல்வாக்கும் பெற்ற ஒரு பெண்[a] இருந்தாள். அவள் அவரை உணவருந்தும்படி வற்புறுத்தினாள். அதன்பின், அவர் அவ்வழியாகச் செல்லும்போதெல்லாம், அங்கே வழிவிலகிச் சென்று உணவருந்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பெரிய பெண்.” இது சமூகத்தில் மதிப்பும் செல்வாக்கும் பெற்றவரையோ வசதியுள்ளவரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அப்பம் உண்பதற்காக.” இது ஒரு வேளை உணவு உண்பதைக் குறிக்கும் சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ஒரு நாள்
  rationale: எபிரெயக் கதைத் தொடக்கத்தின் காலக் குறிப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעֲבֹר אֶל שׁוּנֵם
  choice: சூனேம் வழியாகச் சென்றார்
  rationale: பயணச் சூழலில் עבר என்பதன் கடந்து செல்லும் கருத்தையும், பின்னர் மீண்டும் மீண்டும் அவ்வழியே சென்றதையும் தெளிவாக இணைக்கிறது.
- source_word: אִשָּׁה גְדוֹלָה
  choice: மதிப்பும் செல்வாக்கும் பெற்ற ஒரு பெண்
  rationale: גְדוֹלָה இங்கு உடல் அளவையோ ஒழுக்க மேன்மையையோ அல்லாமல் சமூக அந்தஸ்து அல்லது பொருளாதார வசதியைக் குறிக்கலாம்; தமிழ் சொற்றொடர் அந்தப் பொருளை இயல்பாகத் தருகிறது, ஆனால் செல்வம் மட்டுமே என்று வரையறுப்பதில்லை.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: அவள் அவரை வற்புறுத்தி ... செய்தாள்
  rationale: சொல்லாட்சியில் ‘அவரைப் பற்றிக்கொண்டாள்/அவர்மேல் வலிமை செலுத்தினாள்’ என்ற தீவிரம் இருந்தாலும், இச்சூழலில் விருந்தோம்பலை ஏற்கும்படி வலியுறுத்தியதைக் குறிக்கிறது.
- source_word: לֶאֱכָל לָחֶם
  choice: உணவருந்த
  rationale: לֶחֶם என்பதன் நேர்ப்பொருள் ‘அப்பம்’; ஆனால் ‘அப்பம் உண்ணுதல்’ என்பது இங்கு ஒரு வேளை உணவு உட்கொள்வதைக் குறிக்கும் பொதுவான சொல்வழக்கு. இயல்பான தமிழுக்காக ‘உணவருந்த’ என மொழிபெயர்க்கப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִדֵּי עָבְרוֹ
  choice: அவர் அவ்வழியாகச் செல்லும்போதெல்லாம்
  rationale: இந்த அமைப்பிலுள்ள மீண்டும் மீண்டும் நிகழும் ‘ஒவ்வொரு முறையும்’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יָסֻר שָׁמָּה
  choice: அவளுடைய வீட்டிற்குச் செல்வார்
  rationale: סור இங்கு வழியிலிருந்து விலகி அங்கே செல்வதை அல்லது தங்கிச் செல்வதை குறிக்கிறது. முந்தைய விருந்தோம்பல் சூழலில் மறைமுகமாக உள்ள வீட்டைத் தமிழில் வெளிப்படுத்துவது இயல்பான புரிதலை அளிக்கிறது.
