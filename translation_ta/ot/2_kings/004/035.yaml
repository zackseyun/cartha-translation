  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: ta
  text: பின்பு அவர் திரும்பி, வீட்டிற்குள் ஒரு முறை இப்பக்கமும் ஒரு முறை அப்பக்கமுமாக நடந்தார்.[a] பிறகு அவர் மேலே சென்று, சிறுவன்மேல் குனிந்தார்.[b] சிறுவன் ஏழு முறை தும்மி, தன் கண்களைத் திறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டிற்குள் குறுக்கும் நெடுக்குமாக நடந்தார்.” எபிரெய மொழியில், “ஒரு முறை இங்கே, ஒரு முறை அங்கே” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தம்மை அவன்மேல் நீட்டிக் கிடத்தினார்.” எபிரெய வினை ஒருவர்மேல் குனிவதையோ வளைந்து இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: பின்பு அவர் திரும்பி
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: வீட்டிற்குள் ... நடந்தார்
  rationale: வீட்டின் உள்ளே அவர் நகர்ந்து நடந்ததைத் தெளிவாகக் காட்டுகிறது; ‘குறுக்கும் நெடுக்குமாக நடந்தார்’ என்பது சற்று விளக்கமான மொழிபெயர்ப்பாகிவிடும்.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: ஒரு முறை இப்பக்கமும் ஒரு முறை அப்பக்கமுமாக
  rationale: எபிரெயச் சொற்றொடரின் ‘ஒருமுறை இங்கே, ஒருமுறை அங்கே’ என்ற படிமத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיַּעַל
  choice: பிறகு அவர் மேலே சென்று
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய இடநகர்வைப் பாதுகாக்கிறது; அது மேலறையையோ சிறுவன் கிடந்த உயர்ந்த இடத்தையோ குறிக்கலாம் என்பதை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- source_word: וַיִּגְהַר עָלָיו
  choice: சிறுவன்மேல் குனிந்தார்
  rationale: גהר என்பதன் அடிப்படை உடல் நிலையான ஒருவர்மேல் வளைந்து அல்லது குனிந்து இருப்பதைத் தருகிறது; உரை கூறாத அற்புதச் செயல்முறையை இதில் சேர்க்கவில்லை.
- source_word: וַיְזוֹרֵר
  choice: தும்மி
  rationale: இந்த அரிய வினைச்சொல்லின் மரபான அகராதிப் பொருள் ‘தும்முதல்’; தொடர்ந்து வரும் எண்ணிக்கை மீண்டும் மீண்டும் தும்மியதைக் காட்டுகிறது.
- source_word: הַנַּעַר
  choice: சிறுவன்
  rationale: இச்சூழலில் சூனேமியப் பெண்ணின் மகனைக் குறிப்பதால், நவீன தமிழில் ‘சிறுவன்’ இயல்பாகவும் குறிப்பாகவும் உள்ளது.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: עַד என்பதற்கு ‘வரை’ என்ற நிழற்பொருள் இருந்தாலும், எண்ணப்பட்ட நிகழ்வுகளைக் குறிக்கும் இச்சொற்றொடர் நிறைவான மொத்தமான ஏழு முறைகளைக் கூறுகிறது.
- source_word: וַיִּפְקַח ... אֶת עֵינָיו
  choice: தன் கண்களைத் திறந்தான்
  rationale: פקח עיניים என்ற வழக்கமான எபிரெயச் சொற்றொடருக்கு நேரான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: எலிசா சிறுவன்மேல் செய்த உடல் செய்கையின் இயல்பு
  choice: ‘சிறுவன்மேல் குனிந்தார்’ என்று நிகழ்வை விவரிப்பதோடு நிறுத்தப்பட்டுள்ளது.
  alternative: ‘தம்மை அவன்மேல் நீட்டிக் கிடத்தினார்’ அல்லது ‘அவன்மேல் படுத்தார்’ என்று மொழிபெயர்க்கலாம்.
  rationale: எபிரெய வினை குனிதல் அல்லது வளைந்து மேலிருத்தலைக் குறிக்கிறது. அற்புதம் எவ்வாறு நிகழ்ந்தது என்பதை உரை விளக்காததால், சடங்கு, மந்திரம் அல்லது குறிப்பிட்ட செயல்முறை எதையும் மொழிபெயர்ப்பு இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தொடர் நிகழ்வுகள் ‘பின்பு’, ‘பிறகு’ என்பவற்றால் தெளிவுபடுத்தப்பட்டுள்ளன. எபிரெய மொழியின் திசைமாற்றுப் படிமம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, வழக்கமான தமிழ் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
