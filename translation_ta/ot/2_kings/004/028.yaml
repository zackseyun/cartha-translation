  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: ta
  text: அவள், “என் ஆண்டவரிடம் நான் ஒரு மகனைக் கேட்டேனா? ‘என்னை ஏமாற்றாதீர்[a]’ என்று நான் சொல்லவில்லையா?” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தவறாக நம்பவைக்காதீர்” அல்லது “எனக்கு வீண் நம்பிக்கை அளிக்காதீர்.” எபிரெய வினைச்சொல் ஒருவரைத் தவறாக நம்பவைக்கலாம் என்பதைக் குறிக்கலாம்; இங்கு, பின்னர் பொய்த்துப்போகும் நம்பிக்கையை எழுப்புவதைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அவள் … என்றாள்
  rationale: தொடர்கதை அமைப்பில் வரும் வாவ்-தொடர்வினையைத் தமிழில் தனியே ‘அப்போது/மேலும்’ என்று வெளிப்படுத்தாமல், பேச்சை இயல்பாகச் சூழ்ந்து நிற்கும் வினையாக மொழிபெயர்த்துள்ளது.
- source_word: הֲשָׁאַלְתִּי בֵן
  choice: நான் ஒரு மகனைக் கேட்டேனா?
  rationale: שׁאל என்பதன் ‘கேட்பது/வேண்டுவது’ என்ற பொருளையும், בֵן என்பதன் குறிப்பான ‘மகன்’ என்ற பொருளையும், விடையை எதிர்பார்க்காத கேள்வி வடிவத்தையும் காக்கிறது.
- source_word: מֵאֵת אֲדֹנִי
  choice: என் ஆண்டவரிடம்
  rationale: எலிசாவைக் குறிக்கும் மரியாதை அழைப்பான ‘என் ஆண்டவர்’ என்பதையும், ஒருவரிடம் ஒன்றைக் கேட்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லையும் இயல்பான தமிழில் தருகிறது; இது இங்கு இறைத்திருப்பெயர் அல்ல.
- source_word: הֲלֹא אָמַרְתִּי
  choice: என்று நான் சொல்லவில்லையா?
  rationale: முன்னர் கூறியதை நினைவூட்டும் எதிர்மறை வினாவை நெருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: என்னை ஏமாற்றாதீர்
  rationale: שׁלה என்பதன் ஹிஃபீல் வடிவம் இங்கு ஒருவரைத் தவறாக நம்பவைத்தல் அல்லது நிறைவேறாத நம்பிக்கையை எழுப்புதல் எனப் பொருள்படலாம். ‘ஏமாற்றாதீர்’ சுருக்கமான, இயல்பான தமிழாக அதன் மையப் பொருளைக் காக்கிறது.
