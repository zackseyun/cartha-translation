translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெண் எலிசாவிடம் காட்டும் மரியாதையை ‘ஆண்டவர்’ மற்றும் ‘-ஆதீர்’ வடிவங்கள் வெளிப்படுத்துகின்றன. இரண்டு கேள்விகளின் உணர்ச்சிச் செறிவும் குற்றம்சாட்டும் தொனியும் விளக்கமாகத் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளன.
