source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: ta
  text: அவள் தன் கணவனிடம், “இதோ பாருங்கள், வழக்கமாக[a] நம்மைக் கடந்து செல்கிற இவர் பரிசுத்தரான தேவனுடைய மனிதர் என்று நான் அறிந்திருக்கிறேன்,” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து.”
    reason: תָּמִיד என்பது சூழலைப் பொறுத்து ‘வழக்கமாக’ அல்லது ‘தொடர்ந்து’ எனப் பொருள்படலாம்; இங்கு திரும்பத் திரும்ப நிகழும் வழக்கமே முதன்மையாகத் தெரிகிறது.
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אִישָׁהּ
  choice: அவள் தன் கணவனிடம் … என்றாள்
  rationale: வீட்டுச் சூழலில் אִישָׁהּ என்பது இயல்பாக ‘அவளுடைய கணவன்’ என்பதைக் குறிக்கிறது; wayyiqtol வடிவம் கதையின் தொடர்ச்சியை முன்னெடுக்கிறது.
- source_word: הִנֵּה־נָא
  choice: இதோ பாருங்கள்
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; נָא அதனை மென்மைப்படுத்தும் அல்லது வலியுறுத்தும் நயத்தைக் கொண்டுள்ளது. நவீன மரியாதை வழக்கிலுள்ள ‘பாருங்கள்’ கணவனை நோக்கிய உரையில் இயல்பாக உள்ளது.
- source_word: יָדַעְתִּי
  choice: நான் அறிந்திருக்கிறேன்
  rationale: மீண்டும் மீண்டும் கவனித்ததன் அடிப்படையில் ஏற்பட்ட, தற்போது நிலைத்திருக்கும் அறிதலை எபிரெய நிறைவுவினை இங்கு குறிக்கிறது.
- source_word: אִישׁ אֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது தீர்க்கதரிசி அல்லது தேவனால் பணியமர்த்தப்பட்ட ஒருவரைக் குறிக்கும் எபிரெய வேதாகமப் பட்டப்பெயர். ‘இறைபக்தியுள்ளவர்’ என்று பொருள்விளக்கம் செய்வதைவிட மூலத்தின் பட்டப்பெயரை இது காக்கிறது.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தரான
  rationale: அந்த மனிதர் பரிசுத்தமானவர் அல்லது தனியே பிரிக்கப்பட்டவர் என்பதைக் குறிக்கும் பெயரடை; தமிழில் மனிதரைக் குறிக்க ‘பரிசுத்தரான’ இயல்பாக உள்ளது.
- source_word: עֹבֵר עָלֵינוּ
  choice: நம்மைக் கடந்து செல்கிற
  rationale: பயணச் சூழலில் עבר על என்பது இவர்களுடைய இடத்தைத் தாண்டி அல்லது அருகே கடந்து செல்வதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘வீடு’ என்பதைச் சேர்க்கவில்லை.
- source_word: תָּמִיד
  choice: வழக்கமாக
  rationale: இங்கு இடைவிடாத செயலைவிட வழக்கமாக மீண்டும் நிகழும் பயணத்தைக் குறிக்கிறது. ‘வழக்கமாக’ அந்தச் சூழ்நிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אִישׁ אֱלֹהִים என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: தேவனுடைய மனிதர்
  alternative: இறைபக்தியுள்ள மனிதர் / இறைமனிதர்
  rationale: முற்காலத் தீர்க்கதரிசி நூல்களில் காணப்படும் அங்கீகரிக்கப்பட்ட பட்டப்பெயரின் இலக்கிய மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது; வெறும் குணவிளக்கமாக மாற்றுவதையும், மூலத்தைத் தாண்டிய கோட்பாட்டுப் பொருளைச் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தேவனுடைய மனிதர்’ என்ற பட்டப்பெயர் திட்டமிட்டு காக்கப்பட்டது; பழைய வழக்கிலுள்ள ‘மனுஷன்’ தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘வழக்கமாக’ என்பதற்குப் பின்னரே வைக்கப்பட்டது.
