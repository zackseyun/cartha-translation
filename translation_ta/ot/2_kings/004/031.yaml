source:
  edition: WLC
  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: ta
  text: கேயாசி அவர்களுக்கு முன்னால் சென்று, தன் கோலை அந்தப் பையனின் முகத்தின்மேல் வைத்தான். ஆனால் சத்தமும் இல்லை, எந்தப் பதிலும் இல்லை.[a] எனவே அவன் எலிசாவைச் சந்திக்கத் திரும்பி வந்து, “பையன் விழித்தெழவில்லை” என்று அவரிடம் தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “குரலும் இல்லை, செவிகொடுத்தலும் இல்லை”; அல்லது, “சத்தமும் இல்லை, பதிலெதிர்வும் இல்லை.”
    reason: קָשֶׁב என்பதன் ‘கவனம்/செவிகொடுத்தல்’ சார்ந்த நேரடிப் பொருளையும், இச்சூழலில் பொருந்தும் ‘பதில்’ என்ற பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் சென்று
  rationale: எலிசாவுக்கும் அந்தப் பெண்ணுக்கும் முன்னே கேயாசி சென்றதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַמִּשְׁעֶנֶת
  choice: தன் கோலை
  rationale: இச்சூழலில் தீர்க்கதரிசியின் ஊன்றுகோல் அல்லது கைத்தடியைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் மரியாதையான நடையிலும் ‘கோல்’ பொருந்துகிறது. எபிரெயத்தில் உடைமைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனச் சூழலில் அது எலிசாவின் கோல் என்பது தெளிவு.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: அந்தப் பையனின் முகத்தின்மேல்
  rationale: פָּנִים என்பதன் நேரடிப் பொருளான ‘முகம்’ என்பதையும், இச்சூழலில் נַעַר குறிக்கும் சிறுவனையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאֵין קוֹל
  choice: சத்தமும் இல்லை
  rationale: קוֹל என்பதன் ‘சத்தம்/குரல்’ என்ற நேரடிப் பொருளைச் சூழலுக்கு இயல்பாக வழங்குகிறது; ‘உயிரின் அறிகுறி இல்லை’ போன்ற மிகை விளக்கத்தைத் தவிர்க்கிறது.
- source_word: וְאֵין קָשֶׁב
  choice: அசைவும் இல்லை
  rationale: קָשֶׁב என்பதன் அடிப்படைப் பொருள் கவனம் செலுத்துதல் அல்லது செவிகொடுத்தல். உயிரற்ற பையனைப் பற்றிய இச்சூழலில், தமிழில் ‘அசைவு’ என்பது காணத்தக்க பதிலெதிர்வை இயல்பாகக் குறிக்கிறது; எனினும் நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: எலிசாவைச் சந்திக்கத் திரும்பிவந்து
  rationale: கேயாசி திரும்பிச் சென்று யாரைச் சந்தித்தான் என்பதைத் தமிழில் குழப்பமின்றித் தெளிவுபடுத்துகிறது; ‘எலிசா’ என்பது உடனடி கதைச்சூழலிலிருந்து நிரப்பப்படுகிறது.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: என்று அவரிடம் தெரிவித்தான்
  rationale: எபிரெய அறிக்கைச் சூத்திரத்தின் பொருளை இயல்பான தமிழில் தருகிறது; ‘சொல்லி அறிவித்தான்’ என்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: பையன் விழித்தெழவில்லை
  rationale: הֵקִיץ என்பதன் ‘விழித்தெழுதல்’ என்ற கருத்தை நேரடியாகத் தருகிறது; உயிர்பெறவில்லை என்று விளக்கி இறையியல் முடிவை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: கோலை வைத்தபின் பையனின் நிலையை எவ்வாறு விவரிப்பது
  choice: “பையன் விழித்தெழவில்லை” என்று மூலத்தின் உறக்க/விழிப்பு மொழியைப் பாதுகாத்தல்
  alternative: “பையன் உயிர்பெறவில்லை”
  rationale: இறந்த பையனைப் பற்றிய கதைச்சூழல் உயிர்ப்பித்தலை உணர்த்தினாலும், எபிரெயம் இங்கு வெளிப்படையாக ‘விழித்தெழவில்லை’ என்றே கூறுகிறது. அந்த உருவகத் திணறலை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அருகிய, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை. ‘அவன்’ கேயாசியையும் ‘அவர்’ எலிசாவையும் குறிக்கப் பயன்படுத்தப்பட்டு, தொடர்ச்சியான சுட்டுப்பெயர் குழப்பம் தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு உரையில் தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
