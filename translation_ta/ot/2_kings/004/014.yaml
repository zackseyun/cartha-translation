  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: ta
  text: அப்போது அவர், “அப்படியானால், அவளுக்காக என்ன செய்ய வேண்டும்[a]?” என்றார். கேயாசி, “ஆனால், அவளுக்கு மகன் இல்லை[b]; அவளுடைய கணவர் முதியவர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுக்காக என்ன செய்யப்பட வேண்டும்?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அவளுக்கு மகன் ஒருவன் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் ... என்று கேட்டார்
  rationale: வாவ் தொடர் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. நேரடியான கேள்வி தொடர்ந்து வருவதால், தமிழில் இயல்பாக ‘கேட்டார்’ என வழங்கப்பட்டுள்ளது.
- source_word: וּמֶה
  choice: அப்படியானால், ... என்ன
  rationale: இணைப்புச்சொல்லுடன் வரும் வினாப்பெயர், முந்தைய உரையாடலின் தொடர்ச்சியையும் அதன் அடிப்படையில் எழும் கேள்வியையும் காட்டுகிறது.
- source_word: לַעֲשׂוֹת לָהּ
  choice: அவளுக்காக என்ன செய்ய வேண்டும்
  rationale: ל உடன் வரும் வினையெச்ச வடிவம், அவளுக்காகச் செய்யத்தக்க அல்லது செய்யவேண்டிய காரியத்தைக் குறிக்கிறது. செயப்பாட்டு வடிவத்தைவிட இவ்வடிவம் நவீன தமிழில் இயல்பாக உள்ளது; செய்பவர் குறிப்பிடப்படாத மூலத்தின் திறந்த தன்மையும் நீடிக்கிறது.
- source_word: גֵּיחֲזִי
  choice: கேயாசி
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲבָל
  choice: அதற்கு
  rationale: இங்கு இச்சொல் வலுவான எதிர்மறையை அல்ல, கேயாசி கவனித்த ஒரு முக்கிய உண்மையைப் பதிலாக முன்வைப்பதைக் காட்டுகிறது. தமிழில் தனியே ‘ஆனால்’ அல்லது ‘உண்மையில்’ என்பதைக் கூட்டாமல் உரையாடல் ஓட்டத்தில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: בֵּן אֵין לָהּ
  choice: அவளுக்கு மகன் இல்லை
  rationale: எபிரெய இருப்பின்மைத் தொடரின் அமைப்பைத் தமிழில் இயல்பாகவே நெருக்கமாகப் பாதுகாக்கிறது; בֵּן குறிப்பாக ‘மகன்’ என்பதே, பொதுவான ‘குழந்தை’ அல்ல.
- source_word: וְאִישָׁהּ
  choice: அவளுடைய கணவரும்
  rationale: இச்சூழலில் אִישׁ, பெண்ணின் கணவரைக் குறிக்கிறது. இணைப்பைத் தமிழின் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זָקֵן
  choice: முதியவர்
  rationale: அவரது வயதான நிலையைக் கண்ணியமாகவும் சுருக்கமாகவும் தெரிவிக்கும் நவீனத் தமிழ் சொல்.
