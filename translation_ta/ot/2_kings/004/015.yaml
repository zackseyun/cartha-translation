  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: ta
  text: அப்போது அவர், “அவளைக் கூப்பிடு” என்றார். அவன் அவளைக் கூப்பிட்டான்; அவள் வாசலில்[a] நின்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நுழைவிடத்தில்.” எபிரெயச் சொல் வாசலையோ நுழைவுப் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் … என்றார்
  rationale: வַ־ தொடர்ச்சியான அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. நவீன தமிழ் கதைநடையில் “அப்போது” இயல்பாக அந்தத் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: קְרָא לָהּ
  choice: அவளைக் கூப்பிடு
  rationale: קרא என்ற ஆண்பால் ஒருமை ஏவல் வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை இது; சூழலில் அது கேயாசியிடம் சொல்லப்படுகிறது.
- source_word: וַיִּקְרָא לָהּ
  choice: அவன் அவளைக் கூப்பிட்டான்
  rationale: கட்டளைக்குப் பதிலாக நிகழ்ந்த அடுத்த செயலைத் தெளிவாகக் காட்டுகிறது. எபிரெய உரையில் உள்ள ஆண்பால் ஒருமை எழுவாயை “அவன்” பாதுகாக்கிறது.
- source_word: וַתַּעֲמֹד
  choice: அவள் … நின்றாள்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் “நில்” என்பதாகும். மூலத்தில் இல்லாத “வந்து” என்ற இயக்கக் கருத்து சேர்க்கப்படவில்லை.
- source_word: בַּפָּתַח
  choice: வாசலில்
  rationale: פתח என்பது திறப்பு, வாசல் அல்லது நுழைவிடம் ஆகியவற்றைக் குறிக்கலாம். “வாசலில்” என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்; சொல்லின் பரந்த இடப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எலிசாவுக்கான மரியாதை ஒருமையாக “அவர்” என்றும், கேயாசிக்கான இயல்பான மூன்றாம் நபர் குறிப்பு “அவன்” என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத இயக்கம் அல்லது விளக்கம் சேர்க்கப்படவில்லை.
