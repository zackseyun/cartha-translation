base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: ta
  text: அப்போது அவர், “கொஞ்சம் மாவைக் கொண்டுவாருங்கள்” என்றார். அதை அவர் பானைக்குள் போட்டுவிட்டு, “மக்களுக்குப் பரிமாறுங்கள்; அவர்கள் சாப்பிடட்டும்” என்றார். அதன்பின் பானையில் தீங்கு விளைவிக்கும் எதுவும் இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “பானையில் தீய/கெட்ட பொருள் எதுவும் இல்லை.” இங்கு அது உணவில் தீங்கு விளைவிக்கும் எதுவும் இல்லை என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் … என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீனத் தமிழில் நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: וּקְחוּ קֶמַח
  choice: கொஞ்சம் மாவைக் கொண்டுவாருங்கள்
  rationale: לקח என்ற பன்மை ஏவல் இச்சூழலில் மாவை உடனே கொண்டுவரும்படி கூறுகிறது. அளவு குறிப்பிடப்படாததால் இயல்பான தமிழுக்காக ‘கொஞ்சம்’ சேர்க்கப்பட்டது.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: அதை அவர் பானைக்குள் போட்டுவிட்டு
  rationale: שלך என்பதன் அடிப்படைப் பொருள் எறிதல்/போடுதல். இங்கு மாவைச் சமையல் பானையில் இடுவதைக் குறிக்க இயல்பான ‘போட்டுவிட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צַק לָעָם
  choice: மக்களுக்குப் பரிமாறுங்கள்
  rationale: יצק என்பதற்கு சொற்படியாக ‘ஊற்று’ என்ற பொருள் உண்டு; ஆனால் பானையிலுள்ள உணவை மக்களுக்கு வழங்கும் இச்சூழலில் ‘பரிமாறுங்கள்’ செயற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְיֹאכֵלוּ
  choice: அவர்கள் சாப்பிடட்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் இவ்வினை, மக்கள் உண்பதற்கான அனுமதி அல்லது நோக்கத்தை வெளிப்படுத்துகிறது; ‘சாப்பிடட்டும்’ இந்தத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: பானையில் தீங்கு விளைவிக்கும் எதுவும் இருக்கவில்லை
  rationale: דָבָר רָע என்பது சொற்படியாக ‘தீய/கெட்ட ஒன்று’; நச்சான உணவு பற்றிய சூழலில் இது ஒழுக்கத் தீமையை அல்ல, உடலுக்குத் தீங்கு விளைவிப்பதைச் சுட்டுகிறது.
theological_decisions:
- issue: மாவு சேர்க்கப்பட்டதற்கும் தீங்கு நீங்கியதற்கும் இடையிலான காரணத் தொடர்பு
  choice: உரை கூறும் நிகழ்வுத் தொடரை மட்டும் வழங்குதல்
  alternative: மாவே இயற்கையாக நச்சை நீக்கியது அல்லது அது வெறும் அடையாளச் செயல் என்று விளக்குதல்
  rationale: எபிரெய உரை காரணத்தின் இயல்பை விளக்காமல், எலிசாவின் செயலும் பின்னர் தீங்கு இல்லாமற்போனதும் மட்டும் கூறுகிறது; அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: மரியாதைமிக்க, எளிதில் புரியும் நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பானை’ முந்தைய சூழலிலுள்ள சமையல் பாத்திரத்தைக் குறிக்கிறது. ‘பரிமாறுங்கள்’ என்பது சொற்படியான ‘ஊற்றுங்கள்’ என்பதன் சூழல்சார் பொருளைத் தருகிறது.
