source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: ta
  text: அப்போது அவர், “அடுத்த ஆண்டு இதே காலத்தில்[a] நீ ஒரு மகனைத் தழுவிக்கொண்டிருப்பாய்” என்றார். அதற்கு அவள், “வேண்டாம், என் ஆண்டவரே, இறைவனுடைய மனிதரே! உமது அடியாளை ஏமாற்றாதீர்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “வாழ்வின் இந்தக் காலத்தைப் போல”; அதாவது, அடுத்த ஆண்டு இதே காலத்தில்.
    reason: כָּעֵת חַיָּה என்ற எபிரெய மரபுத்தொடரின் சொற்படியான வடிவத்தைச் சுட்டிக்காட்டி, சூழலில் அதற்குரிய அடுத்த ஆண்டின் அதே காலம் என்ற பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: இதே குறித்த காலத்தில்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது. ‘இதே குறித்த காலத்தில்’ என்பது அடுத்துவரும் சொற்றொடருடன் இயல்பாக இணைந்து, குறிப்பிட்ட பருவம் மீண்டும் வருவதை உணர்த்துகிறது.
- source_word: כָּעֵת חַיָּה
  choice: அடுத்த ஆண்டு
  rationale: இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் அடுத்த ஆண்டின் இதே காலத்தைக் குறிக்கிறது. தமிழில் அதன் சூழற்பொருளை இயல்பாகத் தருகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אתי
  choice: நீ
  rationale: பெண்பால் ஒருமை தனிப்பெயர் வலியுறுத்தலைக் கொண்டுள்ளது. தமிழில் வெளிப்படையான ‘நீ’ அந்த வலியுறுத்தலைப் போதுமான அளவு காக்கிறது.
- source_word: חֹבֶקֶת
  choice: தழுவிக்கொண்டிருப்பாய்
  rationale: இந்தப் பங்கேற்புவினை மகனைத் தன் கைகளில் அணைத்திருப்பதைக் காட்சிப்படுத்துகிறது. ‘தழுவிக்கொண்டிருப்பாய்’ அதன் தொடர்நிலையையும் அன்பான உடல்செயலையும் காக்கிறது.
- source_word: בֵּן
  choice: ஒரு மகன்
  rationale: எபிரெயச் சொல் பொதுவாகக் குழந்தை என்று அல்லாமல் குறிப்பாக ஆண் மகவைக் குறிக்கிறது.
- source_word: אַל
  choice: வேண்டாம்
  rationale: பதிலின் தொடக்கத்தில் வரும் முதல் אַל உணர்ச்சிமிக்க மறுப்பாக உள்ளது. நவீன தமிழில் ‘வேண்டாம்’ என்பது அந்த வேண்டுதலுடனான மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: இது எலிசாவை நோக்கிய மரியாதைமிக்க அழைப்பு; கடவுளைக் குறிக்கும் பட்டமல்ல. ‘என் ஆண்டவரே’ சமூக மரியாதையையும் பணிவையும் காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரே
  rationale: தீர்க்கதரிசிக்கான எபிரெயப் பட்டத்தை நேரடியாகவும் புரிந்துகொள்ளத்தக்க விதத்திலும் தருகிறது.
- source_word: תְּכַזֵּב
  choice: ஏமாற்றாதீர்
  rationale: இந்த வினை பொய் சொல்லுதல், ஏமாற்றுதல், பொய்யாகிப் போதல் ஆகிய பொருள்களை உடையது. இங்கு பொய்யான நம்பிக்கையை எழுப்ப வேண்டாம் என்ற அவளது வேண்டுதலை ‘ஏமாற்றாதீர்’ சுருக்கமாகக் காக்கிறது.
- source_word: בְּשִׁפְחָתֶךָ
  choice: உமது அடியாளை
  rationale: மூலச்சொல் பெண்பால் பணிப்பெண்ணைக் குறித்தாலும், பெண் பேசுபவரின் பணிவான தற்குறிப்பாக ‘உமது அடியாள்’ இயல்பாகவும் பாலினத்தைக் காத்தும் உள்ளது.
theological_decisions:
- issue: אֲדֹנִי என்ற மனிதருக்கான மரியாதைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: என் ஆண்டவரே
  alternative: என் எஜமானரே; ஐயா
  rationale: இது எலிசாவை நோக்கிய சமூக மரியாதைச் சொல்; தெய்வீக அடையாளமல்ல. ‘என் ஆண்டவரே’ மூலத்தின் உயர்ந்த பணிவுத்தொனியைத் தக்கவைக்கிறது.
- issue: אִישׁ הָאֱלֹהִים என்ற தீர்க்கதரிசிப் பட்டம்
  choice: இறைவனின் மனிதரே
  alternative: தேவமனிதரே; கடவுளின் மனிதரே
  rationale: சொல்லின் உறவையும் தீர்க்கதரிசிக்குரிய மரபுப்பட்டத்தையும் வெளிப்படையாகக் காக்கிறது; தனிப்பட்ட சமயப் பிரிவின் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. தீர்க்கதரிசியின் அறிவிப்பில் எதிர்கால நிச்சயமும், பெண்ணின் அதிர்ச்சியும் அச்சமுள்ள வேண்டுதலும் காக்கப்பட்டுள்ளன. மரியாதைப் பன்மை வடிவங்களான ‘உமது’, ‘ஏமாற்றாதீர்’ பயன்படுத்தப்பட்டுள்ளன.
