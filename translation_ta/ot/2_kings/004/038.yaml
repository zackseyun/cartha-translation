base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: ta
  text: எலிசா கில்காலுக்குத் திரும்பிவந்தார். அப்போது நாட்டில் பஞ்சம் நிலவியது. இறைவாக்கினர்களின் மகன்கள்[a] அவருக்கு முன்பாக அமர்ந்திருந்தார்கள். அவர் தம் பணியாளனிடம், “பெரிய பானையை அடுப்பில் வைத்து, இறைவாக்கினர்களின் மகன்களுக்காகக் குழம்பு சமை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “இறைவாக்கினர்களின் சீடர்கள்”; இது இறைவாக்கினர்களின் ஒரு சமூகத்தையோ குழுவையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: திரும்பிவந்தார்
  rationale: שוב என்பதன் Qal வடிவம் முன்பு இருந்த இடத்துக்குத் திரும்புவதைக் குறிக்கிறது; இயல்பான தமிழில் ‘திரும்பிவந்தார்’ என்று வழங்கப்பட்டது.
- source_word: הַגִּלְגָּלָה
  choice: கில்காலுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: அப்போது நாட்டில் பஞ்சம் நிலவியது
  rationale: வினைச்சொல் இல்லாத இக்கூற்று நிகழ்ச்சியின் பின்னணிச் சூழலை அளிக்கிறது. ‘அப்போது’ தொடர்பைத் தெளிவாக்குகிறது; ‘நிலவியது’ தமிழில் நீடித்த சூழ்நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: בְנֵי הַנְּבִיאִים
  choice: இறைவாக்கினர்களின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப உறவு உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது. இது உயிரியல் மகன்களைக் குறிக்காமல் இறைவாக்கினர் சமூகத்தின் சீடர்கள் அல்லது உறுப்பினர்களைக் குறிக்கக்கூடும் என்பதைக் குறிப்பு விளக்குகிறது.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: அவருக்கு முன்பாக அமர்ந்திருந்தார்கள்
  rationale: பங்கேற்பு வினை வடிவம் தொடர்ந்த காட்சிநிலையைச் சுட்டுகிறது. ‘முன்பாக’ என்பது உடலிடத்தையும் ஆசிரியரின் முன்னிலையில் சீடர்கள் இருப்பதற்கான உறவுநிலையையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: לְנַעֲרוֹ
  choice: தம் பணியாளனிடம்
  rationale: נַעַר என்பது இளைஞன், உதவியாளர் அல்லது பணியாளன் எனப் பொருள்படலாம். இங்கு அவனுக்குக் கொடுக்கப்படும் இல்லப்பணி காரணமாக ‘பணியாளன்’ பொருத்தமானது.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: பெரிய பானையை அடுப்பில் வைத்து
  rationale: שפת இச்சமையல் சூழலில் பானையை நெருப்பின்மேல் வைப்பதைக் குறிக்கிறது. தமிழில் ‘அடுப்பில் வைத்து’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וּבַשֵּׁל נָזִיד
  choice: குழம்பு சமை
  rationale: נָזִיד என்பது கொதிக்கவைத்த உணவு அல்லது stew; ‘குழம்பு’ நவீன தமிழில் அதற்கு அண்மையான, எளிதில் புரியும் சொல். בשׁל இங்கு சமைத்தல் அல்லது கொதிக்கவைத்தலைக் குறிக்கிறது; ‘சமை’ இலக்கு மொழியில் இயல்பான கட்டளை.
theological_decisions:
- issue: בְנֵי הַנְּבִיאִים என்ற மரபுத்தொடரின் பொருள்
  choice: முதன்மை உரையில் ‘இறைவாக்கினர்களின் மகன்கள்’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘இறைவாக்கினர்களின் சீடர்கள்’ அல்லது ‘இறைவாக்கினர் குழுவினர்’
  rationale: இந்தச் சொற்றொடர் ஓர் இறைவாக்கினர் சமூகம் அல்லது பயிற்சிபெறும் சீடர்களைக் குறிக்கலாம். மூலத்தின் குடும்ப உருவகத்தைச் silently விளக்கமாக மாற்றாமல், அதன் நிறுவனப் பொருளை அடிக்குறிப்பில் தருவது உண்மையான பொருள் விரிவை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது נביא என்பதற்கான தெளிவான தமிழாக்கமாகத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி [a] அது விளக்கும் சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
