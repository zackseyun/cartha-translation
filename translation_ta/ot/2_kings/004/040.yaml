base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: ta
  text: அவர்கள் ஆண்களுக்கு உண்பதற்காக அதை ஊற்றிப் பரிமாறினார்கள். அவர்கள் அந்தக் குழம்பிலிருந்து சாப்பிட்டுக்கொண்டிருக்கையில், “தேவனுடைய மனிதரே, பானையில் மரணம் இருக்கிறது![a]” என்று கூக்குரலிட்டார்கள். அவர்களால் சாப்பிட முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “பானையில் மரணம்.” அந்தக் குழம்பு உயிருக்கு ஆபத்தானது அல்லது விஷமுள்ளது என்பதே இச்சொற்றொடரின் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: ஊற்றிக் கொடுத்தார்கள்
  rationale: יצק என்பதன் அடிப்படைப் பொருள் ‘ஊற்றுதல்.’ உணவைப் பகிர்ந்தளிக்கும் சூழலில் ‘கொடுத்தார்கள்’ என்பதை இணைப்பது செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘பரிமாறினார்கள்’ என்று மட்டும் மொழிபெயர்த்து அதன் நேரடிப் படிமத்தை இழக்கவில்லை.
- source_word: לַאֲנָשִׁים
  choice: ஆண்கள்
  rationale: אֲנָשִׁים இங்கு கூடியிருந்த ஆண்களைக் குறிக்கிறது. பாலினத்தைக் குறிப்பிடாத பொதுச்சொல்லாக மாற்றாமல் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מֵהַנָּזִיד
  choice: அந்தக் குழம்பை
  rationale: נָזִיד என்பது வேகவைத்த திரவ உணவு அல்லது stew. நவீன தமிழில் ‘குழம்பு’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: צָעָקוּ
  choice: அலறினார்கள்
  rationale: צעק என்பது உரத்த, அவசரமான கூக்குரலைக் குறிக்கிறது. ஆபத்தை உணர்ந்த அவர்களுடைய பதற்றத்தை ‘அலறினார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָוֶת בַּסִּיר
  choice: பானையில் சாவு இருக்கிறது
  rationale: எபிரெயத்தின் வலுவான ‘பானையில் சாவு’ என்ற படிமத்தை ‘விஷம்’ என்று விளக்கி மாற்றாமல் தக்கவைக்கிறது; தமிழில் முழுமையான வாக்கியமாக இருக்க ‘இருக்கிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதரே
  rationale: எலிசாவைக் குறிக்கும் நிலையான பட்டத்தைத் தக்கவைத்து, நேரடி அழைப்பைத் தமிழின் விளிவேற்றுமை காட்டுகிறது.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: அவர்களால் சாப்பிட முடியவில்லை
  rationale: மூலத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. தமிழிலும் அதைச் சேர்க்காமல், முன்சூழலிலிருந்து பொருள் தெளிவாகப் புரியும்படி மொழிபெயர்க்கப்பட்டுள்ளது.
