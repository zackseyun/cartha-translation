    rationale: ‘அரச அல்லது படைத்துறை அதிகாரிகளின் சிறப்புச் சலுகையை’ is less idiomatic and can sound like a formal privilege. ‘அரசரிடமிருந்தோ படைத்துறை அதிகாரிகளிடமிருந்தோ தனிப்பட்ட உதவியை’ directly expresses the likely sense without overstating it.
