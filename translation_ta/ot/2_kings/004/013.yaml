translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள மறைமுக வினைமுகமும் அவளுடைய இறுதிப் பதிலின் உட்குறிப்பும் முதன்மை உரையில் விளக்கமாக விரிவாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன. மேற்கோளுக்குள் மேற்கோள் தெளிவாகத் தோன்ற இரட்டை மற்றும் ஒற்றை மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
