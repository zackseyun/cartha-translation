base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: ta
  text: 'அவர் அவனிடம், “தயவுசெய்து அவளிடம் இப்படிச் சொல்: ‘இதோ, நீ எங்களுக்காக இத்தனை அக்கறை எடுத்து பாடுபட்டிருக்கிறாய்.[a] உனக்காக என்ன செய்யலாம்? உன் சார்பாக அரசரிடமோ படைத்தளபதியிடமோ பேச வேண்டிய காரியம் ஏதாவது இருக்கிறதா?[b]’” என்றார். அவள், “நான் என் சொந்த மக்களிடையே வாழ்கிறேன்”[c] என்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்படியாக, “எங்களுக்காக இந்தப் பதற்றமெல்லாம் கொண்டு நீ பதற்றப்பட்டாய்” என்று மொழிபெயர்க்கலாம். இங்கு இது, அவள் அவர்கள்மீது மிகுந்த அக்கறை காட்டி அவர்களுக்காக அதிகமாகப் பாடுபட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசரிடமோ படைத்தளபதியிடமோ உன் சார்பாகச் சொல்ல வேண்டியது ஏதாவது இருக்கிறதா?”
    reason: lexical_alternative
  - marker: c
    text: “நான் என் சொந்த மக்களிடையே வாழ்கிறேன்” என்பது, அவள் தன் சமூகத்தில் பாதுகாப்பாக நிலைபெற்றிருப்பதால் அரசரிடமிருந்தோ படைத்துறை அதிகாரிகளிடமிருந்தோ தனிப்பட்ட உதவியை நாடவில்லை என்பதைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: இவ்வளவு அக்கறையோடு மிகுந்த பாடுபட்டிருக்கிறாய்
  rationale: வினையும் அதனுடன் தொடர்புடைய பெயர்ச்சொல்லும் சொற்படியாக நடுக்கம் அல்லது பதற்றத்தைக் குறிக்கலாம். ஆனால் இங்கு விருந்தோம்பலுக்காக அவள் காட்டிய ஆழ்ந்த அக்கறையையும் பெருமுயற்சியையும் குறிக்கும் மரபுத்தொடராக உள்ளது; இயல்பான தமிழில் இரு நுணுக்கங்களையும் இந்த மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லுக்கு இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: உனக்காக என்ன செய்ய வேண்டும்?
  rationale: செயலைச் செய்பவர் யார் என்பதை எபிரெயம் வெளிப்படையாகக் குறிப்பிடவில்லை. தமிழிலும் அதைத் தீர்மானிக்காமல், அவள் சார்பாக என்ன செய்யப்படலாம் என்ற கேள்வியை இயல்பாகக் கூறுகிறது.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: உன் சார்பாக ... பேச வேண்டிய காரியம் ஏதாவது இருக்கிறதா?
  rationale: அவளுக்குப் பதிலாக அல்லது அவள் நலனுக்காக உயரதிகாரிகளிடம் வேண்டுகோள் வைப்பதைக் குறிக்கும். ‘உன் சார்பாக’ என்பது அந்த இடையீட்டு நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: שַׂר הַצָּבָא
  choice: படைத்தளபதி
  rationale: படையின் தலைமை அதிகாரியைக் குறிக்கும் שַׂר என்பதற்கு சுருக்கமான, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: நான் என் சொந்த மக்களிடையே வாழ்கிறேன்
  rationale: அவள் தன் சமூகத்தின் நடுவில் வாழ்வதை நேரடியாகக் கூறுகிறது. பாதுகாப்பு அல்லது திருப்தி என்ற உட்கருத்தை முதன்மை உரைக்குள் வெளிப்படையாகச் சேர்க்காமல் காக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மையாக்கும் பணிவுச் சொல்லுக்கான இயல்பான நவீனத் தமிழ் இணை.
