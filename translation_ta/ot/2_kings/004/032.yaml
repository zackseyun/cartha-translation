  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: ta
  text: எலிசா வீட்டுக்குள் வந்தார். இதோ, அந்தப் பையன் இறந்தவனாய், அவனுடைய படுக்கையின்மேல் கிடத்தப்பட்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய படுக்கையின்மேல் நீட்டிப் படுக்கவைக்கப்பட்டிருந்தான்.” எபிரெயச் செயப்பாட்டு வினையெச்சம், அங்கே படுக்கவைக்கப்பட்டிருந்த நிலையை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்
  rationale: வழக்கமான இறந்தகாலக் கதைநடையைத் தொடர்கிறது; திசையைக் குறிக்கும் அடுத்த வடிவத்துடன் சேர்ந்து ‘வீட்டுக்குள் வந்தார்’ என இயல்பாக அமைகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַבָּיְתָה
  choice: வீட்டுக்குள்
  rationale: பெயர்ச்சொல்லோடு சேர்ந்துள்ள திசைகாட்டும் ה, வீட்டை நோக்கி வந்து அதற்குள் நுழைந்த இயக்கத்தை இங்கு குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எலிசா கண்ட காட்சியைத் திடீரென வாசகரின் கவனத்திற்கு முன்வைக்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: சூழலில் இது சூனேமியப் பெண்ணின் மகனைக் குறிக்கிறது; ‘பையன்’ என்பது இயல்பான நவீனத் தமிழ் தெரிவு.
- source_word: מֵת
  choice: இறந்தவனாய்
  rationale: எலிசா வந்தபோது பையன் இருந்த நிலையைச் சுட்டும் நிலைப்பொருளைத் தக்கவைக்கிறது; மரண நிகழ்வை மட்டும் முன்னிறுத்தும் ‘இறந்துவிட்டான்’ தவிர்க்கப்பட்டது.
- source_word: מֻשְׁכָּב
  choice: கிடத்தப்பட்டிருந்தான்
  rationale: இது שׁכב வேரின் செயப்பாட்டு வினையெச்ச வடிவம்; ஒருவனால் படுக்கையில் வைக்கப்பட்டதன் விளைவுநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל מִטָּתוֹ
  choice: அவனுடைய படுக்கையின்மேல்
  rationale: எபிரெய மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் ‘மேல்’ என்ற இடத்தொடரையும் நேரடியாகப் பாதுகாக்கிறது; பின்னொட்டின் சுட்டுப்பொருளை உரைக்குள் விளக்கிச் சுருக்கவில்லை.
