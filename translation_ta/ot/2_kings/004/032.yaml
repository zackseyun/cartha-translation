translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய கதைநடையும் இணைந்த நடை பயன்படுத்தப்பட்டது. எலிசாவுக்கு இயல்பான மரியாதைப் பன்மை வினைமுற்று வழங்கப்பட்டாலும், பையனைச் சுட்டும் சொற்கள் எளிமையாக வைக்கப்பட்டன. ‘இதோ’ என்பதன் மூலம் மூலத்தின் காட்சிப்படுத்தும் வலிமை பாதுகாக்கப்பட்டது.
