  terminology: ‘கொள்கலன்கள்’ என்பது כֵּלִים என்பதன் பரந்த பொருளையும் உடனடி சூழலையும் நன்றாகக் காட்டுகிறது. மாற்றுச் சொல்லாக ‘பாத்திரங்கள்’ அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. தனிப்பட்ட இறையியல் அல்லது விளக்க மரபுசார் சொற்கள் எதுவும் திணிக்கப்படவில்லை.
