  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: ta
  text: பின்பு நீ உள்ளே போய், உன் பின்னாலும் உன் மகன்களின் பின்னாலும் கதவை மூடு. இந்தக் கொள்கலன்கள்[a] எல்லாவற்றிலும் ஊற்று; நிறைந்ததை[b] தனியே எடுத்து வை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாத்திரங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பலவகையான பாத்திரங்கள் அல்லது கொள்கலன்களைக் குறிக்கக்கூடியது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘நிறைந்ததை அகற்றி வை.’ எபிரெயில் இது ஒருமையில் இருந்தாலும், நிறையும் ஒவ்வொரு கொள்கலனையும் பொதுவாகக் குறிக்கலாம்; எனவே ‘நிறைந்தவற்றைத் தனியே எடுத்து வை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וּבָאת
  choice: பின்பு நீ உள்ளே போய்
  rationale: בוא இச்சூழலில் வீட்டிற்குள் நுழைவதைக் குறிக்கிறது. தொடர்ச்சியான வாவை இயல்பான தமிழில் ‘பின்பு’ எனக் காட்டுகிறது.
- source_word: וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: உன் பின்னாலும் உன் மகன்களின் பின்னாலும் கதவை மூடு
  rationale: கதவை மூடும் சூழலில் בַּעַד என்பது உள்ளே சென்றவர்களுக்குப் பின்னால் கதவை மூடுவதைக் குறிக்கிறது. எபிரெய மூலத்திலுள்ள இருமுறை சொல்லப்பட்ட அமைப்பு தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְיָצַקְתְּ עַל
  choice: எல்லாவற்றிலும் ஊற்று
  rationale: יצק என்பது ‘ஊற்று’; பாத்திரங்களுடன் வரும் עַל இலக்கு அல்லது உள்ளிடம் என்ற பொருளில் இயல்பான தமிழில் ‘-இல்’ என மொழிபெயர்க்கப்படுகிறது. இவ்வசனத்தில் ‘எண்ணெய்’ வெளிப்படையாக மீண்டும் சொல்லப்படாததால் அது சேர்க்கப்படவில்லை.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: இந்தக் கொள்கலன்கள் எல்லாவற்றிலும்
  rationale: כְּלִים என்பது பலவகைப் பாத்திரங்கள் அல்லது பொருட்களைக் குறிக்கக்கூடிய பரந்த சொல். இச்சூழலில் திரவத்தை ஏற்கும் பொருட்கள் என்பதால் ‘கொள்கலன்கள்’ துல்லியமாகவும் நவீனமாகவும் உள்ளது.
- source_word: וְהַמָּלֵא תַּסִּיעִי
  choice: நிறைந்ததை தனியே எடுத்து வை
  rationale: הַמָּלֵא என்பது பெயர்ச்சொல் போலப் பயன்படும் ஒருமை வடிவம்—‘நிறைந்தது/நிறைந்த ஒன்று.’ נסע என்பதன் ஹிபீல் வடிவம் இங்கு நிறைந்த பாத்திரத்தை ஊற்றும் இடத்திலிருந்து அகற்றி வைப்பதைக் குறிக்கிறது.
theological_decisions:
- issue: הַמָּלֵא என்ற ஒருமை வடிவத்தின் எண்ணிக்கை
  choice: நிறைந்ததை
  alternative: நிறைந்தவற்றை
  rationale: மூல எபிரெயின் இலக்கண ஒருமையை முதன்மை உரை காக்கிறது; சூழலில் இது ஒவ்வொரு நிறைந்த கொள்கலனையும் பொதுப்படையாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது. இதில் தனிப்பட்ட இறையியல் முடிவு திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, மரியாதைமிக்க கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘எண்ணெய்’ சேர்க்கப்படவில்லை. இடவியல் மீளுரையும் இலக்கண ஒருமையும் இயன்றவரை காக்கப்பட்டுள்ளன.
