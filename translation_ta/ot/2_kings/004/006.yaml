  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: ta
  text: பாத்திரங்கள் நிரம்பியபோது, அவள் தன் மகனிடம், “இன்னொரு பாத்திரத்தை என்னிடம் கொண்டுவா” என்றாள். அவன் அவளிடம், “இன்னொரு பாத்திரமும் இல்லை” என்றான். அப்போது எண்ணெய் நின்றுபோனது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “எண்ணெய் நின்றது”; அதாவது, அது தொடர்ந்து வழிவது நின்றுபோனது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת הַכֵּלִים
  choice: பாத்திரங்கள் நிரம்பியபோது
  rationale: כ முன்னொட்டுடன் வரும் infinitive construct காலத்தைக் குறிக்கிறது. எபிரெயச் சொல்லமைப்பின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַכֵּלִים / כֶּלִי
  choice: பாத்திரங்கள் / பாத்திரம்
  rationale: כְּלִי என்பது எண்ணெயை ஏற்கும் பொருளுக்கான பொதுச் சொல்; ‘குடம்’ என்று குறிப்பிட்ட வடிவத்தைத் தேவையின்றி வரையறுக்காமல் ‘பாத்திரம்’ பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: הַגִּישָׁה אֵלַי
  choice: என்னிடம் கொண்டுவா
  rationale: נגשׁ என்பதன் Hiphil கட்டளை வடிவம் ‘அருகே கொண்டுவரு’ அல்லது ‘கொண்டுவா’ எனப் பொருள்படும்; இச்சூழலில் இயல்பான தமிழ் கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עוֹד כֶּלִי
  choice: இன்னொரு பாத்திரம்
  rationale: ஒருமை כֶּלִי உடன் עוֹד கூடுதலான அதே வகைப் பொருளைக் குறிக்கிறது.
- source_word: אֵין עוֹד כֶּלִי
  choice: வேறு பாத்திரம் இல்லை
  rationale: אֵין இல்லாமையைத் தெரிவிக்கிறது; கூடுதலாக எந்தப் பாத்திரமும் இல்லை என்பதைக் குறுகிய, இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: எண்ணெய் நின்றுபோனது
  rationale: עמד என்பதன் நேரடிப் பொருள் ‘நின்றது’; இங்கு எண்ணெயின் ஓட்டம் முடிவடைந்ததைச் சூழல் உணர்த்துகிறது. நேரடிப் படிமத்தையும் சூழற்பொருளையும் ஒன்றாகப் பாதுகாக்க ‘நின்றுபோனது’ பயன்படுத்தப்பட்டுள்ளது.
