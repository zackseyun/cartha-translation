  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: ta
  text: அவர் உள்ளே சென்று, அவர்கள் இருவரையும் உள்ளே வைத்துக் கதவை மூடி[a], யாவேயிடம் ஜெபித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் இருவருக்குப் பின்னால் கதவை மூடி.” அதாவது, அறைக்குள் அவரும் குழந்தையும் மட்டுமே இருந்தார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அவர் உள்ளே சென்று
  rationale: בוא என்பதன் தொடர்நிகழ்வுக் கூறு, குழந்தை இருந்த அறைக்குள் அவர் சென்ற அடுத்த செயலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: கதவை மூடி
  rationale: סגר என்பது கதவை மூடுதல்; definite article-உடைய הַדֶּלֶת சூழலில் அறியப்பட்ட கதவைக் குறிக்கிறது.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: அவர்கள் இருவருக்குப் பின்னால்
  rationale: கதவை மூடும் சூழலில் בְּעַד என்பது இருவரையும் உள்ளே இருக்கும்படி அவர்களுக்குப் பின்னால் கதவை மூடியதைக் குறிக்கலாம். எபிரெயச் சொல்லமைப்பின் சற்றே அசாதாரணமான நுணுக்கம் முதன்மை உரையில் காக்கப்படுகிறது.
- source_word: וַיִּתְפַּלֵּל אֶל
  choice: வேண்டினார்
  rationale: פלל என்பதன் hitpael வடிவம் இங்கு இறைவனிடம் மன்றாடுதல் அல்லது ஜெபித்தலைக் குறிக்கிறது; אֶל குறிக்கும் நோக்கு ‘-இடம்’ வேற்றுமையால் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூல எபிரெய உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதன் வாசிப்பு மரபுகள் மாறுபடுவதால், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற வடிவம் தேர்ந்தெடுக்கப்பட்டது; பொதுப்பட்டப் பெயராக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்கள் இருவர்’ என்பது எலிசாவையும் குழந்தையையும் குறிக்கிறது; மூலத்தில் பெயர்கள் மீண்டும் சொல்லப்படவில்லை.
