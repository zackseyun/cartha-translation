  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: ta
  text: 'ஆனால் அவனுடைய பணியாள்[a], “இதை நான் எப்படி நூறு ஆண்களுக்கு முன்பாக வைப்பேன்?” என்றான். அதற்கு அவன், “இதை மக்களுக்குக் கொடு; அவர்கள் சாப்பிடட்டும்[b]. ஏனெனில் யாவே இவ்வாறு சொல்கிறார்: ‘அவர்கள் சாப்பிட்ட பிறகும் மீதியிருக்கும்’” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய உதவியாளர்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “சாப்பிடுதலும் மீதியிருத்தலும்”; அதாவது, அவர்கள் சாப்பிட்ட பின்னரும் உணவு மீதியிருக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: அவனுடைய பணியாள்
  rationale: தனிப்பட்ட அல்லது அலுவல்சார் முறையில் சேவை செய்பவரைக் குறிக்கும் சொல்லை, எலிசாவுக்குக் கீழ்ப்பட்டுச் சேவை செய்பவர் என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: இதை நான் எப்படி நூறு ஆண்களுக்கு முன்பாக வைப்பேன்?
  rationale: எபிரெயச் சொற்றொடரின் ‘முன்பாக வைப்பது’ என்ற உணவுப் பரிமாறும் காட்சியைப் பாதுகாத்து, பணியாளின் ஐயத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஆண்கள்
  rationale: நூறு என்ற எண்ணுக்குப் பின் பகிர்வுப் பொருளில் வரும் இலக்கண ஆண்பால் சொல்லையும், இச்சூழலில் அதற்கான சாத்தியமான குறிப்பையும் துல்லியமாகக் காட்டுகிறது.
- source_word: תֵּן לָעָם
  choice: மக்களுக்குக் கொடு
  rationale: இங்கு עָם என்பது கூடியிருக்கும் குழுவை ஒட்டுமொத்தமாகக் குறிக்கிறது; ஆகவே ‘மக்கள்’ என்பது பொருத்தமான இயல்பான தமிழ்.
- source_word: וְיֹאכֵלוּ
  choice: அவர்கள் சாப்பிடட்டும்
  rationale: கட்டளைக்குப் பின் வரும் விருப்பவினை/விளைவு நுணுக்கத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: ஏனெனில் யாவே இவ்வாறு சொல்கிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அடையாளமான வடிவைத் தக்கவைத்தபடி, தமிழில் கண்ணியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள தேவனுடைய உடன்படிக்கைப் பெயரை ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: אָכֹל וְהוֹתֵר
  choice: அவர்கள் சாப்பிட்ட பிறகும் மீதியிருக்கும்
  rationale: அவர்கள் சாப்பிட்டு முடித்த பின்னரும் உணவு எஞ்சும் என்ற உறுதியான விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், ஒரு பட்டப்பெயரால் மாற்றாமல் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אָכֹל וְהוֹתֵר என்பதிலுள்ள தீர்க்கதரிசன உறுதி
  choice: அவர்கள் சாப்பிட்ட பிறகும் மீதியிருக்கும்
  alternative: அவர்கள் சாப்பிட்டு மீதம் வைப்பார்கள்
  rationale: மக்கள் வேண்டுமென்றே உணவை மீதம் வைப்பார்கள் என்று கூறாமல், அவர்கள் உண்ட பின்னரும் உணவு எஞ்சும் என்பதைக் காட்டுகிறது; அதேவேளை உரையின் உறுதியான வாக்கையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரையாடல் இயல்பாக இருக்க ‘சாப்பிடு’ பயன்படுத்தப்பட்டாலும், தீர்க்கதரிசன அறிவிப்பின் முறைமை ‘யாவே இவ்வாறு சொல்கிறார்’ என்று பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
