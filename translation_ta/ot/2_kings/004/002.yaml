base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: ta
  text: எலிசா அவளிடம், “நான் உனக்காக என்ன செய்யலாம்? சொல், உன் வீட்டில் என்ன இருக்கிறது?” என்று கேட்டார். அதற்கு அவள், “உங்கள் பணிப்பெண்ணாகிய என்னிடம், ஒரு சிறு குடுவை எண்ணெயைத் தவிர, வீட்டில் வேறொன்றுமே இல்லை[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு சிறு குடுவை எண்ணெய்” என்பதை “ஒரு குடுவை எண்ணெய்” அல்லது “ஒரு சிறிய எண்ணெய்க் குப்பி” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் எண்ணெய் வைக்கும் சிறிய கொள்கலனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: நான் உனக்காக என்ன செய்ய வேண்டும்?
  rationale: לְךְ என்பதன் நலன்பொருட்டான பொருளையும், imperfect வடிவத்தின் ஆலோசனை/எதிர்கால நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַגִּידִי לִי
  choice: சொல்
  rationale: பெண்பால் ஒருமை கட்டளை வடிவத்தின் நேரடியான பொருள்; எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘தயவுசெய்து’ சேர்க்கப்படவில்லை.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: உன் வீட்டில் என்ன இருக்கிறது?
  rationale: יֵשׁ + לְ உடைமையை உணர்த்துகிறது; தமிழில் இந்தச் சூழலில் ‘உன் வீட்டில் என்ன இருக்கிறது?’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְשִׁפְחָתְךָ
  choice: உங்கள் பணிப்பெண்ணாகிய என்னிடம்
  rationale: அந்தப் பெண் எலிசாவிடம் தாழ்மையுடன் தன்னை அவரது பெண் பணியாளாகக் குறிப்பிடுவதை வெளிப்படுத்துகிறது; பெண்பாலும் மரியாதைத் தொனியும் காக்கப்படுகின்றன.
- source_word: אֵין ... כֹל
  choice: வேறொன்றுமே இல்லை
  rationale: முழுமையான மறுப்பின் வலிமையை இயல்பான தமிழில் எடுத்துரைக்கிறது; பின்னர் வரும் ஒரே விதிவிலக்குடன் நன்றாக இணைகிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: முன்னைய மறுப்புக்கான ஒரே விதிவிலக்கைத் தெளிவாகக் குறிக்கிறது.
- source_word: אָסוּךְ שָׁמֶן
  choice: ஒரு சிறு குடுவை எண்ணெய்
  rationale: அரிதான אָסוּךְ எண்ணெய்க்கான சிறிய கொள்கலனைக் குறிப்பதாகத் தெரிகிறது; வடிவத்தையோ சடங்குப் பயன்பாட்டையோ தேவையின்றி குறிப்பாக்காமல் தமிழில் இயல்பாக வழங்குகிறது.
