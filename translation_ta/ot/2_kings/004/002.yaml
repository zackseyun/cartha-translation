translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எலிசா பெண்ணிடம் ஒருமை நெருக்குச் சொல்லான ‘உன்/உனக்காக’ என்றும், அவள் அவரிடம் மரியாதைப் பன்மையான ‘உங்கள்’ என்றும் பேசுவது சமூக உறவையும் தாழ்மையான சுயக்குறிப்பையும் இயல்பாகக் காட்டுகிறது.
