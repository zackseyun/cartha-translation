  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: ta
  text: அவன் சிறுவனைத் தூக்கிக்கொண்டு அவனுடைய தாயிடம் கொண்டுவந்தான். சிறுவன் நண்பகல்வரை அவளுடைய மடியில்[a] உட்கார்ந்திருந்தான்; பின்பு இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, ‘அவளுடைய முழங்கால்களின்மேல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: சிறுவனைத் தூக்கிக்கொண்டு
  rationale: נשׂא என்பது தூக்குதல் அல்லது சுமந்து செல்லுதல் எனப் பொருள்படும். அடுத்துவரும் ‘கொண்டுவந்தான்’ என்பதுடன் சேர்ந்து, சிறுவனைத் தூக்கிச் சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְבִיאֵהוּ
  choice: கொண்டுவந்தான்
  rationale: ביא என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘கொண்டுவருதல்’ எனப் பொருள்பட்டு, தாயை நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶל אִמּוֹ
  choice: அவனுடைய தாயிடம்
  rationale: உறவைத் தெளிவாகவும் கண்ணியமான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: இருந்தான்
  rationale: ישׁב என்பதற்கு ‘உட்காருதல்’ அல்லது ‘இருத்தல்’ ஆகிய பொருள்கள் உண்டு. நோயுற்ற சிறுவன் தாயின் மடியில் நண்பகல்வரை இருந்த சூழலில், ‘இருந்தான்’ என்பது இயல்பாகவும் மூலத்தின் பொருள் வரம்புக்குள்ளும் உள்ளது.
- source_word: עַל בִּרְכֶּיהָ
  choice: அவளுடைய மடியில்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘அவளுடைய முழங்கால்களின்மேல்’ என்று இருந்தாலும், குழந்தையைத் தாய் தாங்கியிருக்கும் நிலையை நவீனத் தமிழில் ‘மடியில்’ என்பது இயல்பாகக் குறிக்கிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הַצָּהֳרַיִם
  choice: நண்பகல்வரை
  rationale: צָהֳרַיִם என்பது நண்பகல் அல்லது மதியநேரத்தைக் குறிக்கிறது; ‘நண்பகல்வரை’ துல்லியமான காலக் குறிப்பாகும்.
- source_word: וַיָּמֹת
  choice: பின்பு இறந்துபோனான்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வாவ் வடிவத்தை ‘பின்பு’ வெளிப்படுத்துகிறது; ‘இறந்துபோனான்’ என்பது கண்ணியமான இயல்பான தமிழ்.
