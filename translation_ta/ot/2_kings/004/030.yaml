  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: ta
  text: அப்போது சிறுவனின் தாய், “யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, உமது உயிர் இருப்பதும் அவ்வளவு உறுதியானது[a]; நான் உம்மைவிட்டுப் போகமாட்டேன்” என்றாள். ஆகவே அவர் எழுந்து அவளுக்குப் பின்னால் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஓர் எபிரெய ஆணைச்சொல். சொற்சொல்லாக, “யாவே உயிரோடிருப்பதுபோலவும், உமது உயிர் இருப்பதுபோலவும்” என்று உள்ளது; அதாவது, “யாவே உயிரோடிருப்பதும் உமது உயிர் இருப்பதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக” என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: சிறுவனின் தாய்
  rationale: எபிரெயக் கூட்டுச்சொற்றொடரின் பொருள் ‘சிறுவனுடைய தாய்’; இயல்பான நவீனத் தமிழில் ‘சிறுவனின் தாய்’ என்று வழங்கப்பட்டது.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, நீர் உயிரோடிருப்பதும் அவ்வளவு உறுதி
  rationale: இது யாவேயின் உயிரையும் உரையாடப்படுகிறவரின் உயிரையும் முன்வைக்கும் எபிரெய ஆணைச்சொல். அதன் உறுதிப்படுத்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; נֶפֶשׁ இங்கு முழு நபரின் உயிரைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக, மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான YHWH-ஐத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: நான் உம்மைவிட்டுப் போகமாட்டேன்
  rationale: ஆணைச்சொல்லைத் தொடர்ந்து வரும் אִם இங்கு எதிர்மறை உறுதிமொழியாகச் செயல்படுகிறது; சொற்சொல்லான நிபந்தனை வடிவம் தமிழில் பொருளை மறைக்கக்கூடும்.
- source_word: וַיָּקָם
  choice: அவர் எழுந்து
  rationale: קום வினையின் தொடர்கதைப் பயன்பாட்டை இயல்பாகவும் கண்ணியமாகவும் தருகிறது; சூழலில் ஆண்பால் ஒருமை எழுவாய் எலிசாவைக் குறிக்கிறது.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: அவளுக்குப் பின்னால் சென்றார்
  rationale: ‘அவளுக்குப் பின்னே சென்றான்’ என்ற எபிரெய உருவகத்தைத் தெளிவான தமிழில் காக்கிறது; சூழலில் அவளைப் பின்தொடர்ந்து சென்றார் என்பதே பொருள்.
theological_decisions:
- issue: ஆணைச்சொல்லில் வரும் יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதற்கான பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் காக்கிறது.
- issue: וְחֵי נַפְשְׁךָ என்பதில் נֶפֶשׁ-இன் பொருள்
  choice: நீர் உயிரோடிருப்பதும்
  alternative: உமது உயிர் வாழ்வதும்; உமது ஆத்துமா வாழ்வதும்
  rationale: இங்கு נֶפֶשׁ உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ குறித்த கோட்பாட்டுச் சொல்லாக அல்லாமல், உரையாடப்படுகிற நபரின் உயிரைக் குறிக்கிறது. ஆகவே தேவையற்ற இருமைவாத விளக்கத்தை இறக்குமதி செய்யாமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசியிடம் பேசுவதால் மரியாதைப் பன்மையான ‘நீர்/உம்மை’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன. ஆணைச்சொல்லின் மூல உருவகமும் அதன் உறுதிப்படுத்தும் செயல்பாடும் சமநிலையுடன் காக்கப்பட்டுள்ளன.
