base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: ta
  text: அவள் அவரிடமிருந்து புறப்பட்டுச் சென்று, தனக்கும் தன் மகன்களுக்கும் பின்னால் கதவை மூடினாள். அவர்கள் அவளிடம் பாத்திரங்களைக் கொண்டுவந்துகொண்டிருந்தார்கள்[a]; அவள் ஊற்றிக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அவர்கள் அவளிடம் கொண்டுவந்துகொண்டிருந்தார்கள்” என்று மட்டுமே உள்ளது; முந்தைய வசனங்களில் கூறப்பட்ட காலிப் பாத்திரங்களைச் சூழல் குறிப்பதால், “பாத்திரங்களை” என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: அதனால் அவள் அவரிடமிருந்து புறப்பட்டுச் சென்று
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; מֵאִתּוֹ என்பது எலிசாவிடமிருந்து அவள் பிரிந்து சென்றதைச் சொல்கிறது. தமிழில் காரணத் தொடர்ச்சியையும் உடல்சார்ந்த புறப்பாட்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: தனக்கும் தன் மகன்களுக்கும் பின்னால் கதவை மூடினாள்
  rationale: סגר என்பது ‘மூடு’; בְּעַד உடன் வந்துள்ள தொடர், அவர்கள் வீட்டுக்குள் இருக்கும்படி கதவை அவர்களுக்குப் பின்னால் மூடியதைக் குறிக்கிறது. எபிரேயத்தின் இருமுறை வரும் அமைப்பு தமிழிலும் காக்கப்படுகிறது.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: அவர்கள் அவளிடம் பாத்திரங்களைக் கொண்டுவந்துகொண்டிருந்தார்கள்
  rationale: பன்மை ஆண்பால் ‘அவர்கள்’ என்பது மகன்களைக் குறிக்கிறது; participle தொடர்ந்த செயலைக் காட்டுகிறது. எபிரேயத்தில் கருமம் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனங்களிலுள்ள காலிப் பாத்திரங்கள் சூழலிலிருந்து தெளிவாக இருப்பதால் ‘பாத்திரங்கள்’ சேர்க்கப்பட்டு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְהִיא מיצקת
  choice: அவள் எண்ணெயை ஊற்றிக்கொண்டிருந்தாள்
  rationale: பெண்பால் participle, மகன்கள் கொண்டுவரும் செயல் நடைபெறும் போதே அவள் தொடர்ந்து ஊற்றியதைக் காட்டுகிறது. எதை ஊற்றினாள் என்பது இங்கு வெளிப்படையாக இல்லாவிட்டாலும், வசனம் 2 மற்றும் 4-இன் சூழலில் அது எண்ணெய் என்பதால் இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது.
