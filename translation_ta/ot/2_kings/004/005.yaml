  - severity: medium
    issue: The translation explicitly supplies ‘எண்ணெயை’ (‘oil’) without a footnote.
    rationale: וְהִיא מֹצֶקֶת says only ‘and she was pouring’; its object is implicit. The supplied ‘பாத்திரங்கள்’ is transparently marked in a footnote, but the additional supplied object ‘எண்ணெயை’ is not. Omitting it best preserves the source wording and avoids an unmarked expansion.
  - severity: low
    issue: ‘அதனால்’ gives the narrative waw a potentially causal force.
    rationale: The Hebrew waw-consecutive principally advances the narrative. A neutral Tamil narrative transition, or no explicit connective, is preferable.
