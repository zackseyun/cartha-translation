translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமும் எளிமையும் கொண்ட நடையைக் கடைப்பிடிக்கிறது. ‘கொண்டுவந்துகொண்டிருந்தார்கள்’ மற்றும் ‘ஊற்றிக்கொண்டிருந்தாள்’ ஆகிய தொடர்வினைகள் எபிரேயப் பங்கேற்புச் சொற்களின் நீடித்த, ஒரே நேரத்தில் நிகழும் செயல்களை வெளிப்படுத்துகின்றன.
