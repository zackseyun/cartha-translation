  naturalness: ‘கொண்டுவந்தான்’ இருமுறை வருவது தமிழில் தேவையற்ற மறுகூறலாகவும் வாக்கிய அமைப்பில் தடுமாற்றமாகவும் உள்ளது. பட்டியலை ஒரே வினையுடன் இணைத்தால் நவீன நிலையான தமிழில் இயல்பாகும்.
