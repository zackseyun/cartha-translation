base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: ta
  text: பாகால்-சாலிசாவிலிருந்து ஒரு மனிதன் வந்து, கடவுளின் மனிதரிடம் முதற்பலன் அப்பமாகிய இருபது வாற்கோதுமை அப்பங்களையும், தன் பையில்[b] புதிய தானியத்தையும்[a] கொண்டுவந்தான். அவர், “இதை மக்களுக்குக் கொடு; அவர்கள் சாப்பிடட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வறுத்த தானியம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறும் புதிய தானியத்தை மட்டுமல்லாமல், உண்பதற்காகத் தயாரிக்கப்பட்ட தானியத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பை’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியல்ல. அது ஒரு பை, பொதி, அல்லது தானியத்தின் உமியைக்கூட குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: இது ஓர் ஆண் நபரை நேரடியாகக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: பாகால்-சாலிசாவிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: ‘தீர்க்கதரிசி’ என்று விளக்கமாக மாற்றாமல், எபிரெய மூலத்திலுள்ள நிலையான பட்டத்தைப் பாதுகாக்கிறது.
- source_word: לֶחֶם בִּכּוּרִים
  choice: முதற்பலன் அப்பங்கள்
  rationale: அறுவடையின் முதற்பலனுடன் தொடர்புடைய அப்பம் என்ற எபிரெயச் சொல்லிணைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: இருபது வாற்கோதுமை அப்பங்கள்
  rationale: எண்ணிக்கையுடன் வரும் לֶחֶם இங்கு தனித்தனி அப்பங்களைக் குறிக்கிறது; שְׂעֹרִים வாற்கோதுமை ஆகும்.
- source_word: כַרְמֶל
  choice: புதிய தானியம்
  rationale: முதற்பலன் சூழலில் பசுமையான அல்லது உண்பதற்குத் தயாரிக்கப்பட்ட தானியத்தைக் குறிக்கக்கூடிய பரந்த மொழிபெயர்ப்பு; தயாரிப்பு முறையைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: בְּצִקְלֹנוֹ
  choice: தன் பையில்
  rationale: அரிதான இச்சொல் ஒரு பை அல்லது பொதியைக் குறிக்கலாம்; சூழலில் ‘பையில்’ என்பது தெளிவான சாத்தியமான பொருள், ஆனால் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: இதை மக்களுக்குக் கொடு; அவர்கள் சாப்பிடட்டும்
  rationale: கட்டளையையும் அதைத் தொடர்ந்து வரும் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற தீர்க்கதரிசிக்குரிய பட்டம்
  choice: கடவுளின் மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: சூழலில் எலிசாவைக் குறித்தாலும், மூல உரை பயன்படுத்தும் பட்டத்தை மாற்றாமல் வைத்திருப்பது அதன் இலக்கிய மற்றும் இறையியல் ஒலிப்பை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளின் மனிதர்’ என்ற மூலப் பட்டம் தக்கவைக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் ‘புதிய தானியம்’ மற்றும் ‘பை’ ஆகியவற்றைத் தொடர்ந்து முதன்மை உரையில் இடப்பட்டுள்ளன.
