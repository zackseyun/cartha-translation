translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உரைநடைத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று கேள்விகளிலும் ஒரே அமைப்பு மீளச் செய்யப்பட்டு, மூலத்தின் வலியுறுத்தல் பேணப்பட்டுள்ளது; இறுதிப் பதில் மூலத்தைப் போலவே சுருக்கமாக வைக்கப்பட்டுள்ளது.
