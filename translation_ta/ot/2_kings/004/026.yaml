base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: ta
  text: இப்போதே அவளைச் சந்திக்க ஓடிச் சென்று, அவளிடம், “நீ நலமாக இருக்கிறாயா?[a] உன் கணவர் நலமாக இருக்கிறாரா? பிள்ளை[b] நலமாக இருக்கிறதா?” என்று சொல். அவள், “நலம்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இந்த வசனத்தில் நான்கு முறை வரும் எபிரெயச் சொல்லான שָׁלוֹם (ஷாலோம்), சமாதானம், முழுமை அல்லது நல்வாழ்வு ஆகியவற்றைக் குறிக்கலாம். இங்கு அது ஒருவரின் நலநிலையைக் குறிக்கிறது: “நலமாக இருக்கிறாயா?” / “நலம்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “சிறுவன்.” எபிரெயச் சொல்லான יֶלֶד (யெலெத்), “பிள்ளை” அல்லது “சிறுவன்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: உடனடியாகச் செய்ய வேண்டிய கட்டளையை அறிமுகப்படுத்தும் கால வினையடை; எபிரெயச் சொல்லின் இயல்பான நேரப் பொருளைப் பேணுகிறது.
- source_word: רוּץ נָא
  choice: ஓடிப்போய்
  rationale: רוּץ என்பதன் கட்டளை வலிமையைத் தெளிவாகக் காட்டுகிறது. நָא கட்டளையை மென்மைப்படுத்தலாம் அல்லது அவசரத்தை வலியுறுத்தலாம்; தமிழில் தனியாக ‘தயவுசெய்து’ சேர்ப்பது இச்சூழலில் இயல்பற்றதாக இருப்பதால், தொடரின் அவசரத்தன்மைக்குள் அதன் நுணுக்கம் விடப்பட்டுள்ளது.
- source_word: לִקְרָאתָהּ
  choice: அவளைச் சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சென்று சந்தித்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וֶאֱמָר לָהּ
  choice: அவளிடம் ... என்று கேள்
  rationale: אמר அடிப்படையில் ‘சொல்’ என்றாலும், அதைத் தொடர்ந்து மூன்று நேரடியான கேள்விகள் வருவதால் தமிழில் ‘என்று கேள்’ என்பதே இயல்பானதும் தகவலுக்கு உண்மையானதுமாகும்.
- source_word: הֲשָׁלוֹם לָךְ
  choice: நீ நலமாக இருக்கிறாயா?
  rationale: שָׁלוֹם இங்கு உடல்நலத்தை மட்டும் அல்லாமல் பொதுவான நல்வாழ்வையும் நலநிலையையும் விசாரிக்கிறது; ‘நலமாக’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: உன் கணவர் நலமாக இருக்கிறாரா?
  rationale: பெண்ணுடனான உறவைக் குறிப்பதால் אִישׁ இங்கு ‘கணவர்’ எனப் பொருள்படுகிறது; முந்தைய கேள்வியின் அமைப்பும் மீண்டும் வருகிறது.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: பிள்ளை நலமாக இருக்கிறதா?
  rationale: יֶלֶד என்பதற்கு ‘பிள்ளை’ அல்லது ‘சிறுவன்’ என்று பொருள் இருக்கலாம். பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல், அறியப்பட்ட குழந்தையைக் குறிக்கும் வகையில் ‘பிள்ளை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: அதற்கு அவள், ‘நலம்’ என்றாள்
  rationale: ஒரே சொல்லான எபிரெயப் பதிலின் சுருக்கத்தையும், வசனத்தில் மீளும் שָׁלוֹם என்ற சொல்லையும் ‘நலம்’ நேர்த்தியாகப் பேணுகிறது.
