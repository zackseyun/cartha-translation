  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: ta
  text: ஒருநாள் அவர் அங்கே வந்தார்; மாடியறைக்குள் ஒதுங்கி, அங்கே படுத்துக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே உறங்கினார்.” எபிரெய வினைச்சொல் படுத்துக்கொள்வதையோ உறங்குவதையோ குறிக்கலாம்; இச்சூழல் குறிப்பான ஒரு பொருளைக் கட்டாயப்படுத்தவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ஒருநாள்
  rationale: இந்த எபிரெயக் கதைநடை மரபுத்தொடர் ஒரு குறிப்பிட்ட நிகழ்வு நடந்த காலத்தை அறிமுகப்படுத்துகிறது. நவீன தமிழில் “ஒருநாள்” இயல்பாகவும் சுருக்கமாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: וַיָּבֹא שָׁמָּה
  choice: அவர் அங்கே வந்தார்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/உள்ளே வருதல்.’ שָׁמָּה என்பதையும் வெளிப்படையாகக் காட்டி, கதைசொல்லியின் பார்வைநிலையை மாற்றாமல் “அங்கே வந்தார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּסַר אֶל הָעֲלִיָּה
  choice: மாடியறைக்குள் சென்று
  rationale: סור இங்கு வழியிலிருந்து விலகி ஒரு குறிப்பிட்ட இடத்திற்குள் செல்வதைக் குறிக்கிறது; עֲלִיָּה என்பது மேல்தளத்திலுள்ள அறை. தமிழில் இயல்பான தொடராக “மாடியறைக்குள் சென்று” இந்த இரண்டையும் இணைக்கிறது.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: அங்கே படுத்துக்கொண்டார்
  rationale: שׁכב என்பது சூழலின்படி படுத்தல் அல்லது உறங்குதல் எனப் பொருள்படலாம். இங்கு உறங்கினார் என்று தேவையின்றிக் குறிப்பாக்காமல் உடல்நிலையைக் குறிக்கும் பொதுவான பொருள் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் வரிசை பாதுகாக்கப்பட்டாலும், “விலகி” என்ற சொல்லை மரத்தனமாகச் சேர்க்காமல், அறைக்குள் சென்ற செயல் இயல்பான தமிழில் தரப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு தொடர்புடைய வினைத்தொடருக்குப் பின் இடம்பெறுகிறது.
