revisions:
- from: ஒருநாள் அவர் அங்கே வந்தார்; மாடியறைக்குள் சென்று, அங்கே படுத்துக்கொண்டார்.[a]
  to: ஒருநாள் அவர் அங்கே வந்தார்; மாடியறைக்குள் ஒதுங்கி, அங்கே படுத்துக்கொண்டார்.[a]
  rationale: “ஒதுங்கி” சேர்க்கப்பட்டுள்ளது; இது וַיָּסַר என்பதன் ‘வழியிலிருந்து திரும்பி/விலகி ஒரு இடத்திற்குச் செல்லுதல்’ என்ற பொருளை நவீன இயல்பான தமிழில் வெளிப்படுத்துகிறது. மற்ற கூறுகளும் அடிக்குறிப்பின் சொற்பொருள் மாற்றும் பாதுகாக்கப்பட்டுள்ளன.
