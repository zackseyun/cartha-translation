base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: ta
  text: அப்போது அவள் வந்து, அவரது காலடியில் விழுந்து, தரைமட்டும் குனிந்து வணங்கினாள்[a]. பின்பு தன் மகனைத் தூக்கிக்கொண்டு வெளியே சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தரையில் விழுந்து வணங்கினாள்.” எபிரெயச் சொல் சில சூழல்களில் “வழிபட்டாள்” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது எலிசாவுக்கு முன் காட்டிய ஆழ்ந்த மரியாதையைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: அப்போது அவள் வந்து
  rationale: தொடர்கதை வரிசையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; எபிரெய வாவ்-தொடரின் ஒவ்வொரு ‘மற்றும்’ என்பதையும் செயற்கையாக மீளுரைக்கவில்லை.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: அவரது காலடியில் விழுந்து
  rationale: எலிசாவுக்கு முன் அவள் தாழ்ந்து விழுந்த செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; சொற்சொல்லான ‘அவரது கால்களின்மேல்’ என்பதைத் தவிர்க்கிறது.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: தரைமட்டும் குனிந்து வணங்கினாள்
  rationale: שׁחה குறிக்கும் ஆழ்ந்த உடல் வணக்கத்தையும் மரியாதையையும் வெளிப்படுத்துகிறது; இச்சூழலில் அதைத் தெய்வ வழிபாடு என்று தீர்மானிக்கவில்லை.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: தன் மகனைத் தூக்கிக்கொண்டு
  rationale: נשא என்பதன் ‘தூக்கு/எடுத்துக்கொள்’ என்ற நேரடியான செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַתֵּצֵא
  choice: வெளியே சென்றாள்
  rationale: יצא என்பதன் எளிய இடநகர்வுப் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: எலிசாவை நோக்கிய וַתִּשְׁתַּחוּ என்பதன் பொருள்
  choice: நன்றியும் ஆழ்ந்த மரியாதையும் காட்டும் வகையில் தரைமட்டும் குனிந்து வணங்கியதாக மொழிபெயர்க்கப்பட்டது.
  alternative: சில சூழல்களில் ‘வழிபட்டாள்’ என்றும், உடல் செயலை வலியுறுத்தி ‘தரையில் சாஷ்டாங்கமாக விழுந்தாள்’ என்றும் மொழிபெயர்க்கலாம்.
  rationale: எபிரெய வினைச்சொல் சூழலின்படி வழிபாட்டையோ மரியாதை வணக்கத்தையோ குறிக்கலாம். இங்கு செயல் எலிசாவை நோக்கியதால், தெய்வ வழிபாடு என்ற கருத்தை இறக்குமதி செய்யாமல் உடல் சைகையையும் சொல்லின் பொருள் வரம்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையில் அமைந்துள்ளது. ‘அவரது’ என்பது எலிசாவை மரியாதையுடன் சுட்டுகிறது; ‘சாஷ்டாங்கம்’ பொதுவாசகருக்கு சற்றே இலக்கிய/சமயத் தொனி உடையதால் முதன்மை உரையில் அல்லாமல் அடிக்குறிப்பில் வைக்கப்பட்டது.
