lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אתי הלכתי
  choice: நீ ... போகிறாய்
  rationale: மசோரா உரையில் எழுத்துவடிவம் சீரற்றிருந்தாலும், பெண்பால் ஒருமையில் உடனடியாக மேற்கொள்ளப்படும் பயணத்தைப் பற்றிய கேள்வியே சூழலுக்குப் பொருந்துகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: சூழலில் இது எலிசாவைக் குறிக்கிறது; எனினும் மூலத்தின் பிரதிப்பெயரைப் பாதுகாக்கப் பெயர் வெளிப்படையாகச் சேர்க்கப்படவில்லை. மரியாதையான தமிழ் வழக்குக்கு ஏற்ப ‘அவரிடம்’ பயன்படுத்தப்பட்டது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லுக்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: இன்று அமாவாசையும் அல்ல, ஓய்வுநாளும் அல்லவே
  rationale: இரண்டு வழக்கமான புனித நாட்களிலும் இந்நாள் சேராது என்பதைக் ‘...வும் அல்ல, ...வும் அல்ல’ என்ற இயல்பான தமிழ் அமைப்பில் தருகிறது; ‘அல்லவே’ கேள்விக்கான காரணத்தைச் சுட்டும் தொனியைப் பாதுகாக்கிறது.
- source_word: חֹדֶשׁ
  choice: அமாவாசை
  rationale: இங்கு ‘மாதம்’ என்பதல்ல, புதிய நிலவு நாளின் சமய அனுசரிப்பே குறிக்கப்படுகிறது; தமிழில் அதற்கான வழக்கமான சொல் ‘அமாவாசை’.
- source_word: שַׁבָּת
  choice: ஓய்வுநாள்
  rationale: இஸ்ரவேலரின் சப்பாத்தைக் குறிக்கும் பொருளை சாதாரண வாசகருக்கும் தெளிவாகத் தருகிறது.
- source_word: שָׁלוֹם
  choice: நலம்தான்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘சமாதானம்’; ஆனால் இச்சுருக்கமான பதிலில் ‘எல்லாம் நலமே’ என்ற உறுதியளிக்கும் பொருளில் இயங்குகிறது. இயல்பான தமிழுக்காக ‘நலம்தான்’ முதன்மை உரையில் வைக்கப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டது.
