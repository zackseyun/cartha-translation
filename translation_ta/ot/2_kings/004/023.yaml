  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: ta
  text: அவன் அவளிடம், “இன்று நீ ஏன் அவரிடம் போகிறாய்? இன்று அமாவாசையும் அல்ல, சப்பாத்து நாளும் அல்ல” என்றான். அதற்கு அவள், “நலம்தான்[a]” என்றாள்.
  philosophy: optimal-equivalence
