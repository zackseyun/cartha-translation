  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: ta
  text: இஸ்ரயேலின் அரசனான யெரொபெயாமின் ஆட்சியின் இருபத்தேழாம் ஆண்டில், அமத்சியாவின் மகனான அசரியா யூதாவின் அரசனாக ஆட்சி செய்யத் தொடங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: ஆட்சியின் இருபத்தேழாம் ஆண்டில்
  rationale: எபிரேய அரசாண்டுக் கணக்கீட்டு வழக்கை இயல்பான நவீனத் தமிழில் வரிசை எண்ணாக வழங்குகிறது; ‘ஆட்சியின்’ என்பது எந்த ஆண்டு கணக்கிடப்படுகிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரயேலின் அரசனான யெரொபெயாமின்
  rationale: לְ இங்கு அரசாண்டு யாருக்குரியது என்பதைக் குறிக்கிறது. அரசப் பட்டத்தையும் பெயரையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்யத் தொடங்கினார்
  rationale: அரசர் பதவியேற்பு அறிவிப்பில் இந்த வினை ஆட்சியின் தொடக்கத்தைக் குறிக்கிறது; வெறும் ‘ஆட்சி செய்தார்’ என்பதைக் காட்டிலும் சூழலின் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவத்திற்கு நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶן אֲמַצְיָה
  choice: அமத்சியாவின் மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரேயச் சொல்லொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அசரியாவின் பதவியையும் நாட்டையும் குறிப்பிடும் இணைப்புப் பட்டத்தைத் தெளிவாக வழங்குகிறது.
