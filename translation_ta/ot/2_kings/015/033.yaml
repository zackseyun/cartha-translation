  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: ta
  text: அவன் அரசனானபோது இருபத்தைந்து வயதாயிருந்தான்; எருசலேமில் பதினாறு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் சாதோக்கின் மகளான யெரூஷா[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயரை “யெரூசா” என்றும் ஒலிபெயர்க்கலாம்.
    reason: ஒலிபெயர்ப்பு வேறுபாடு; எபிரேய שׁ ஒலியைத் தமிழில் ‘ஷ’ அல்லது ‘ச’ என வழங்கும் மரபுகள் உள்ளன.
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ
  choice: அவன் அரசனானபோது இருபத்தைந்து வயதாயிருந்தான்
  rationale: எபிரேய வயதுக் கூறான ‘இருபத்தைந்து ஆண்டுகளின் மகன்’ என்பதை இயல்பான நவீனத் தமிழில் வயதாகவும், בְמָלְכוֹ என்பதை அரசாட்சியின் தொடக்கமாகவும் வழங்குகிறது.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: எருசலேமில் பதினாறு ஆண்டுகள் ஆட்சி செய்தான்
  rationale: அரசாட்சியின் காலத்தையும் இடத்தையும் தெளிவான, இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: וְשֵׁם אִמּוֹ יְרוּשָׁא בַּת צָדוֹק
  choice: அவனுடைய தாயின் பெயர் சாதோக்கின் மகளான யெரூசா
  rationale: தாயின் பெயரையும் குடும்ப உறவையும் எதையும் சேர்க்காமல் இயல்பான தமிழில் பாதுகாக்கிறது; பெயர்கள் எபிரேய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
