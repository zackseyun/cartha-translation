  register: நவீன நிலையான தமிழ்; வரலாற்று அரசர் குறிப்புக்கேற்ற சுருக்கமான, கண்ணியமான நடை. ‘வருஷம்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘ஆண்டு’ பயன்படுத்தப்பட்டுள்ளது.
