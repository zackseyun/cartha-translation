  rationale: ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கும் בְ முன்னிடைச்சொல்லின் இடப்பொருளைப் பாதுகாக்கிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: அரசர்கள் நூலில் வழக்கமாக வரும் தாயின் பெயர் அறிமுகச் சூத்திரத்தைத் தெளிவான தமிழில் தருகிறது.
