base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: ta
  text: அவன் அரசனானபோது அவனுக்குப் பதினாறு வயது. அவன் எருசலேமில் ஐம்பத்திரண்டு ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் எக்கொலியா; அவள் எருசலேமைச் சேர்ந்தவள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமிலிருந்து வந்தவள்.”
    reason: מִן என்ற எபிரேய முன்னிடைச்சொல்லின் நேரடியான ‘இருந்து’ என்ற பொருளையும், ஊர்த் தொடர்பைக் குறிக்கும் பொருளையும் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
