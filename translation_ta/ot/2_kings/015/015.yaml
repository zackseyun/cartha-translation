  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ta
  text: சல்லூமுடைய மற்ற செயல்களும், அவன் செய்த சதித்திட்டமும்—இதோ, அவை இஸ்ரவேல் அரசர்களின் நாள்குறிப்புப் புத்தகத்தில் எழுதப்பட்டுள்ளன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாள்குறிப்புப் புத்தகம்” என்பது அரசர்களைப் பற்றிய அதிகாரப்பூர்வ ஆட்சிப் பதிவுகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: சல்லூமுடைய மற்ற செயல்களும்
  rationale: மன்னர் ஆட்சிச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘சொற்கள்’ அல்ல, அவரது செயல்கள் அல்லது ஆட்சிநிகழ்வுகளைக் குறிக்கிறது; וְיֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: அவன் செய்த சதித்திட்டமும்
  rationale: קֶשֶׁר அரசியல் சூழலில் சதி அல்லது சதித்திட்டத்தைக் குறிக்கிறது. எபிரேய cognate noun-verb அமைப்பை தமிழில் சொற்சொல்லாக மீட்டால் இயல்பற்ற மறுமொழி உருவாகும்; ‘அவன் செய்த சதித்திட்டம்’ அதன் பொருளையும் வலியுறுத்தலையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: הִנָּם כְּתֻבִים
  choice: இதோ, அவை ... எழுதப்பட்டுள்ளன
  rationale: הִנָּם என்பதிலுள்ள சுட்டிக்காட்டும் வலிமையையும் பன்மைச் சுட்டையும் ‘இதோ, அவை’ பாதுகாக்கிறது; כְּתֻבִים என்பதற்கு நேரடியான ‘எழுதப்பட்டுள்ளன’ பயன்படுத்தப்பட்டது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாள்குறிப்புப் புத்தகத்தில்
  rationale: இது அரச ஆவண ஆதாரத்தைக் குறிக்கும் வழக்கமான தலைப்பு. עַל என்பதைக் கொண்டுள்ளதை தமிழில் நூலின் உள்ளடக்கத்தைக் குறிக்கும் ‘புத்தகத்தில்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது; לְמַלְכֵי என்பது இங்கு உறவைக் குறிப்பதால் ‘அரசர்களின்’ என வழங்கப்பட்டது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
