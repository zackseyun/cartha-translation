translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. அரச ஆவணச் சூத்திரத்தின் முறையான தொனி பாதுகாக்கப்பட்டுள்ளது; எபிரேயத்தின் சொற்பிறப்புச் சார்ந்த ‘சதியைச் சதித்தான்’ என்ற மறுமொழி இயல்பான தமிழுக்காகச் சுருக்கப்பட்டது.
