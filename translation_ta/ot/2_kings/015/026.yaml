  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ta
  text: பெக்ககியாவின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், இதோ, அவை இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் அரசர்களின் வரலாற்றுப் பதிவேட்டில்.”
    reason: דִּבְרֵי הַיָּמִים என்ற ஆவணப் பெயரை ‘நாளாகமம்’ என்றும் ‘வரலாற்றுப் பதிவேடு’ என்றும் பொருத்தமாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פְקַחְיָה
  choice: பெக்ககியாவின் மற்ற செயல்களும்
  rationale: அரசாட்சிச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் சொற்களை அல்ல, அரசனின் செயல்களையும் ஆட்சிநிகழ்வுகளையும் குறிக்கிறது. וְיֶתֶר என்பதன் இணைப்புத் தன்மையை இறுதியிலுள்ள ‘உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: עשה என்பதன் பரந்த பொருளைச் சுருக்காமலும் மிகைப்படுத்தாமலும் நேரடியாகத் தருகிறது.
- source_word: הִנָּם
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனம் ஈர்க்கும் எபிரேய நிகழ்த்துப்பொருளைத் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: எழுதப்பட்ட நிலையில் இருப்பதைக் குறிக்கும் செயப்பாட்டு வினையெச்சத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகத்தில்
  rationale: சொல்லாட்சியில் ‘நாட்களின் நிகழ்வுகள்’ எனினும், இச்சூழலில் இது அரசர்களின் தொடர்ச்சியான வரலாற்றுப் பதிவைக் குறிக்கும் நிலையான ஆவணப் பெயராக உள்ளது.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: ஆவணத் தலைப்பில் לְ குறிக்கும் தொடர்பை இயல்பான தமிழ் உடைமைத் தொடரால் தருகிறது.
