  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: ta
  text: அசரியா தன் மூதாதையரோடு துயிலடைந்தார்[a]. அவரைத் தாவீதின் நகரத்தில் அவருடைய மூதாதையரோடு அடக்கம் செய்தார்கள். அவருக்குப் பதிலாக அவருடைய மகன் யோதாம் அரசாண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் முன்னோர்களோடு துயிலடைந்தார்.” “தன் மூதாதையரோடு துயிலடைந்தார்” என்பது இறப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தார்
