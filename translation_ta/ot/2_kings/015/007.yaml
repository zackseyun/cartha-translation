- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: מלך வினையின் ‘அரசராக ஆட்சி செய்தல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: காலவரிசையை மட்டும் அல்லாமல், அரசப் பதவியில் ஏற்பட்ட வாரிசுரிமை மாற்றத்தையும் வெளிப்படுத்துகிறது.
