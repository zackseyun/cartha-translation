- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவரை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய உரையில் உள்ள, எழுவாய் குறிப்பிடப்படாத பன்மைச் செயப்பாட்டு வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
