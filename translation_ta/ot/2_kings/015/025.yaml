  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: ta
  text: அப்போது அவனுடைய படைத்துறை அதிகாரியான ரெமலியாவின் மகன் பெக்கா[a], அவனுக்கு எதிராகச் சதி செய்து, சமாரியாவில் அரசனுடைய அரண்மனைக் கோட்டையில்[b], அர்கோபுடனும் அரியேவுடனும்[c] சேர்ந்து அவனைத் தாக்கி வீழ்த்தினான். கீலேயாத்தியரிலிருந்து வந்த ஐம்பது பேர் பெக்காவுடன் இருந்தார்கள்[d]. அவன் அவனைக் கொன்று, அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைத்துறை அதிகாரி” என்பதற்குப் பதிலாக “படைத் தளபதி” என்றும் மொழிபெயர்க்கலாம். שָׁלִישׁ என்பது உயர்நிலை இராணுவ அதிகாரியைக் குறிக்கிறது; ஆனால் துல்லியமான பதவி உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அரசனுடைய அரண்மனைக் கோட்டை” என்பதற்குப் பதிலாக “அரசனுடைய அரண்மனை” அல்லது “அரச இல்லத்தின் கோட்டை” என்றும் மொழிபெயர்க்கலாம். אַרְמוֹן என்பது அரண்மனையையோ அரண் செய்யப்பட்ட அரச இருப்பிடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: אַרְיֵה என்ற சொல்லுக்கு பொதுவாக “சிங்கம்” என்றும் பொருள் உண்டு. ஆனால் இங்கு அர்கோபுடன் இணையாக வருவதால், அது “அரியே” என்ற நபர்ப் பெயராகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: நேரடியாக, “அவனுடன் கீலேயாத்தியரின் மக்களில் ஐம்பது பேர்.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: அவனுக்கு எதிராகச் சதி செய்து
  rationale: அரசியல் சூழலில் קשר என்பது ஆட்சியாளருக்கு எதிரான சதி அல்லது துரோகத் திட்டத்தைக் குறிக்கிறது.
- source_word: שָׁלִישׁוֹ
  choice: அவனுடைய படைத்துறை அதிகாரி
  rationale: இது உயர்நிலை இராணுவ அதிகாரியைக் குறிக்கலாம்; துல்லியமான பதவி உறுதியில்லாததால் பொதுவான ஆனால் சூழலுக்கேற்ற சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּכֵּהוּ
  choice: அவனைத் தாக்கி வீழ்த்தினான்
  rationale: נכה என்பதன் தாக்குதல்/அடித்து வீழ்த்துதல் என்ற பொருளைப் பேணி, பின்னர் வரும் ‘கொன்றான்’ என்பதுடன் ஒன்றாக்காமல் நிகழ்வின் வரிசையைத் தக்கவைக்கிறது.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: அரச அரண்மனையின் கோட்டைப் பகுதியில்
  rationale: אַרְמוֹן என்பது அரண்மனை அல்லது பாதுகாப்பான கோட்டை அமைப்பைக் குறிக்கலாம்; அரச இல்லத்தின் அரண் சூழ்ந்த பகுதி என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: அர்கோபுடனும் அரியேவுடனும் சேர்ந்து
  rationale: இணை அமைப்பும் நேரடி வேற்றுமை உருபுகளும் இரண்டையும் நபர்ப் பெயர்களாகப் புரிந்துகொள்ள ஆதரிக்கின்றன.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: பெக்காவுடன் கீலேயாத்தியரில் ஐம்பது பேர் இருந்தார்கள்
  rationale: מִן உருபின் பகுதியிலிருந்து சிலர் என்ற பொருளைப் பேணுவதோடு, யார் உடன் இருந்தார்கள் என்பதையும் தமிழில் தெளிவாக்குகிறது.
- source_word: וַיְמִיתֵהוּ
  choice: அவன் அவனைக் கொன்று
  rationale: ஹிப்இல் வடிவத்தின் ‘சாகச் செய்தல்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் அளிக்கிறது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அரசாண்டான்
  rationale: அரசுரிமைத் தொடர்ச்சிக்கான எபிரேய வழக்குச் சொற்றொடரின் நேர்த்தியான தமிழ் வடிவம்.
