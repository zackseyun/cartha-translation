  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; தொடர் சுட்டுப்பெயர்களால் ஏற்படும் குழப்பத்தைத் தவிர்க்க இரண்டாவது வாக்கியத்தில் ‘பெக்கா’ மீண்டும் குறிப்பிடப்பட்டது.
