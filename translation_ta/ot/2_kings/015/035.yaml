theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிவடிவில் தருகிறது.
- issue: וּמְקַטְּרִים என்பதன் சடங்குசார் வரம்பு
  choice: பலிப்புகை எழுப்பியும்
  alternative: தூபம் காட்டியும்
  rationale: வினையைத் தூபத்திற்கு மட்டும் வரையறுக்காமல், பலி அல்லது காணிக்கை புகையாக எழச் செய்யும் பரந்த வாய்ப்பை முதன்மை உரையில் காக்கிறது; குறிப்பில் குறுகிய பொருள் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மேடைவழிபாட்டுத் தலம்’ என்பது ‘மேடை’ என்ற மரபான வேதாகமச் சொல்லின் வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது; ‘பலிப்புகை எழுப்புதல்’ என்பது மூலவினையின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
