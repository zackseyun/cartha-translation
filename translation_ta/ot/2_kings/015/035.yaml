  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: ta
  text: ஆனால், மேடைகள் அகற்றப்படவில்லை; மக்கள் அங்கே தொடர்ந்து பலியிட்டும் புகைப்பலி செலுத்தியும் வந்தார்கள்.[a] அவன் யாவேவின் ஆலயத்தின் மேல்வாசலைக் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூபம் எரித்தும் வந்தார்கள்.” எபிரேய வினை குறிப்பாகத் தூபம் எரிப்பதையோ, பொதுவாகப் பலி அல்லது காணிக்கையைப் புகையாக ஏறச் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
