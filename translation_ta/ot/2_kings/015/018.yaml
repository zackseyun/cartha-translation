reference: 2 Kings 15:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களிலிருந்து அவன் தன் வாழ்நாள் முழுவதும் விலகவில்லை; அவற்றால் யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்யவைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: עשה உடன் வரும் הרע என்ற அரசர் மதிப்பீட்டு மரபுத்தொடரை, பொருள் உறவையும் இயல்பான நவீன தமிழையும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரேய உருவகத்தைத் தெளிவான தமிழில் காக்கிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: பாவங்களைவிட்டு … விலகவில்லை
  rationale: סור என்பதிலுள்ள விலகிச் செல்லும் உருவகத்தையும், தீய வழக்கத்தைக் கைவிடாத கருத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: பெயர்களைத் தமிழில் ஒலிபெயர்த்து, எபிரேய மரபுவழி உறவை இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: அவற்றால் அவன் இஸ்ரவேலைப் பாவம் செய்யவைத்தான்
  rationale: חטא வினையின் ஹிஃபீல் காரணவினைப் பொருளை ‘பாவம் செய்யவைத்தான்’ என்று காக்கிறது; ‘அவற்றால்’ என்பது அருகிலுள்ள ‘பாவங்கள்’ என்பதுடன் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: כָּל יָמָיו
  choice: தன் வாழ்நாள் முழுவதும்
  rationale: ‘அவனுடைய எல்லா நாட்களிலும்’ என்ற எபிரேய மரபுத்தொடரின் முழுக் கால அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், ஒரு பட்டப்பெயரை மாற்றாக இடாமல் ‘Yahweh’ என்பதற்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל என்ற தொடர்புச் சொல்லாட்சியின் முன்சுட்டி
  choice: 'அது ‘பாவங்கள்’ என்பதுடன் தொடர்புடையதாக முதன்மை உரையில் காட்டப்படுகிறது: ‘அவற்றால் அவன் இஸ்ரவேலைப் பாவம் செய்யவைத்தான்.’'
  alternative: 'அது யெரொபெயாமை நேரடியாகக் குறிக்கலாம்: ‘இஸ்ரவேலைப் பாவம் செய்யவைத்த நேபாத்தின் மகன் யெரொபெயாம்.’'
  rationale: எபிரேய இலக்கணம் அருகிலுள்ள பெயரான யெரொபெயாமுடனும், பொருளடிப்படையில் முன் வரும் ‘பாவங்கள்’ என்பதுடனும் தொடர்புபடுத்த இடமளிக்கிறது. இந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. அரசர்களைப் பற்றிய எபிரேய மதிப்பீட்டு மரபுத்தொடரின் உருவகம் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது; தொடர்புச் சொல்லாட்சியின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
