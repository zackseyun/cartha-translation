revisions:
- from: அவன் யெகோவாவின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்யவைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களைவிட்டு அவன் விலகவில்லை.
  to: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்யவைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களிலிருந்து அவன் விலகவில்லை.
  rationale: The revision aligns the divine name with the required source-faithful project rendering and makes the ablative expression more idiomatic, while preserving the Hebrew regnal-evaluation formula, the patronymic, the plural “sins,” and Jeroboam’s causative role in Israel’s sin.
