  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்யவைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களிலிருந்து அவன் விலகவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: அரசர்களை மதிப்பிடும் வழக்கமான எபிரெயச் சொற்றொடரை, தமிழில் இயல்பான செயப்படுபொருளுடன் நேரடியாகத் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: இறைவனுடைய மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא סָר
  choice: விலகவில்லை
  rationale: מן என்பதுடன் வரும் סור, முந்தைய பாவ வழக்கத்திலிருந்து விலகுவதைக் குறிக்கிறது; ‘விலகவில்லை’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִן חַטֹּאות
  choice: பாவங்களைவிட்டு
  rationale: חַטֹּאות என்பதன் பன்மையைத் தெளிவாகப் பாதுகாக்கிறது; מן என்பதன் பிரிவுப் பொருள் ‘விட்டு’ மூலம் வெளிப்படுகிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெயத் தந்தைவழி அடையாளத்தை இயல்பான தமிழ் பெயரமைப்பில் தருகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: חטא வினையின் ஹிஃபில் காரணவினைப் பொருளையும் யெரொபெயாமின் பொறுப்பையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; எபிரெய உச்சரிப்பை மீட்டமைக்கும் மாற்று வடிவம் ‘யாவே’.
translation_notes:
  register: நவீன செந்தமிழ் நடை; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு வாக்கிய மதிப்பீட்டு அமைப்பும் காரணவினைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
