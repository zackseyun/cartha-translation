source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: மெனகேமின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேல் அரசர்களின் ஆண்டுக் குறிப்புப் புத்தகம்.’
    reason: סֵפֶר דִּבְרֵי הַיָּמִים என்பதற்கான பொருத்தமான சொற்பொருள் மாற்றைத் தருகிறது; இது அதிகாரப்பூர்வ அரச பதிவைக் குறிக்கலாம்.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: மெனகேமின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது; அரசர் ஆட்சிச் சுருக்கச் சூத்திரத்தில் דִּבְרֵי என்பது வெறும் சொற்களை அல்ல, செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது. தொடக்க וְ தமிழில் இயல்பான இணைப்பாக ‘-உம்’ மூலம் வெளிப்படுகிறது; மூலத்தில் இல்லாத காலக் குறிப்பான ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: உறவுநிலைத் தொடரின் முழுமையையும், முந்தைய பன்மைப் பொருளுடன் இணையும் அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: הֲלוֹא நேர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. ‘அல்லவா?’ தமிழில் அந்த வினாவியல் வலிமையை இயல்பாகத் தருகிறது; ‘எழுதப்பட்டிருக்கின்றன’ என்பது passive participle-ன் நிலை/விளைவு உணர்வைப் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: עַל என்பதன் சொற்பொருள் ‘மேல்’ என்றாலும், எழுத்துப் பதிவைக் குறிக்கும் இச்சூத்திரத்தில் தமிழில் ‘புத்தகத்தில்’ என்பதே இயல்பும் துல்லியமும் ஆகும்.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகம்
  rationale: இது அரச ஆட்சிநிகழ்வுகளின் அதிகாரப்பூர்வ காலவரிசைப் பதிவைக் குறிக்கிறது. ‘நாளாகமம்’ மரியாதையான, புரிந்துகொள்ளத்தக்க பாரம்பரியச் சொல்; ‘ஆண்டுக் குறிப்புப் புத்தகம்’ என்பதும் பொருத்தமான மாற்று.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: לְ இங்கு ஆவணத் தலைப்பில் உறவு அல்லது உடைமையைச் சுட்டுகிறது; தமிழில் ஆறாம் வேற்றுமை இயல்பாக அதைக் காட்டுகிறது.
- source_word: מְנַחֵם
  choice: மெனகேம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: הֲלוֹא கொண்டு அமைந்த வினாவின் உரைநடை வலிமை
  choice: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவாக ‘அல்லவா?’ என்று வைக்கப்பட்டது.
  alternative: ‘அவை எழுதப்பட்டுள்ளன’ என்று நேரடி கூற்றாக மாற்றுதல்.
  rationale: மூலத்தின் வினாவியல் வடிவத்தையும் அதன் மறைமுகமான உறுதிப்பாட்டையும் காக்கிறது; அதை நேரடி கூற்றாகத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச ஆட்சிச் சுருக்கத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய வாக்கிய அமைப்பு காக்கப்பட்டாலும், தமிழ் வேற்றுமை மற்றும் இணைப்பு முறைகளுக்கு ஏற்ப இயல்பாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘நாளாகமப் புத்தகம்’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
