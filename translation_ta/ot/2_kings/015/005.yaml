base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: ta
  text: யாவே அரசனைத் தாக்கினார்; அவன் இறந்த நாள்வரை தொழுநோயாளியாக[a] இருந்து, தனியே இருக்கும் ஒரு வீட்டில்[b] வாழ்ந்தான். அரசனின் மகனான யோதாம் அரண்மனைப் பொறுப்பில் இருந்து, நாட்டின் மக்களுக்கு நீதி வழங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல் நவீன மருத்துவம் குறிப்பிடும் தொழுநோயை மட்டுமே குறிக்க வேண்டியதில்லை; இன்னும் பொதுவாகக் கடுமையான தோல் நோயையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிரிக்கப்பட்ட வீட்டில்” அல்லது “தனிமைப்படுத்தப்பட்ட வீட்டில்.” எபிரெயச் சொற்றொடர் தெளிவற்றது; சூழலில் இது மற்றவர்களிடமிருந்து பிரித்து வைக்கப்பட்ட குடியிருப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது; பொதுப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: וַיְנַגַּע
  choice: தாக்கினார்
  rationale: இச்சூழலில் נגע வெறும் தொடுதலை அல்ல, கடவுளால் நேர்ந்த தண்டனைக்குரிய பாதிப்பைக் குறிக்கிறது; பாதிப்பின் வழிமுறையை மிகையாக விவரிக்காமல் இறைச் செயற்பாட்டைத் தெளிவாக்குகிறது.
- source_word: מְצֹרָע
  choice: தொழுநோயாளியாக
  rationale: எபிரெயச் சொல்லுக்கான மரபான, சுருக்கமான தமிழ் இணை; அது நவீன மருத்துவத்தில் குறிப்பிடப்படும் தொழுநோயை மட்டுமே குறிக்க வேண்டியதில்லை என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: עַד יוֹם מֹתוֹ
  choice: அவன் இறக்கும் நாள்வரை
  rationale: எபிரெய மொழிநடையின் வலியுறுத்தலையும் solemn cadence-ஐயும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: தனிமைப்படுத்தப்பட்ட ஒரு வீட்டில்
  rationale: சொற்றொடரின் சொற்பிறப்பு தெளிவற்றதாயினும், சூழலில் சமூக மற்றும் சடங்கியல் பிரிவில் வைக்கப்பட்ட குடியிருப்பைக் குறிக்கிறது.
- source_word: עַל הַבַּיִת
  choice: அரண்மனை நிர்வாகத்துக்குப் பொறுப்பாயிருந்து
  rationale: அரச வீட்டின் அல்லது அரண்மனையின் நிர்வாக மேற்பார்வையைச் சுட்டும் மரபுத்தொடரின் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שֹׁפֵט
  choice: நீதி வழங்கிவந்தான்
  rationale: தொடர்ச்சியாக மேற்கொண்ட நீதித்துறை அல்லது ஆட்சிப் பொறுப்பைக் காட்டும் எபிரெயப் பங்கேற்பு வினையின் நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் பொதுமக்கள் அல்லது நாட்டின் குடிமக்கள் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: מְצֹרָע குறிக்கும் அரசனின் நோயின் இயல்பு
  choice: முதன்மை உரையில் மரபான ‘தொழுநோயாளி’ என்ற சொல்லைப் பயன்படுத்தி, அதன் மருத்துவ வரம்பை அடிக்குறிப்பில் எச்சரிக்கையுடன் விளக்குதல்.
  alternative: கடுமையான தோல் நோயால் பாதிக்கப்பட்டவன்
  rationale: வசனம் நவீன மருத்துவ நோயறிதலை நிர்ணயிப்பதில்லை. மரபான சொல் வாசகர்களுக்கு அறிமுகமானது; அடிக்குறிப்பு எபிரெயச் சொல்லின் பரந்த பொருளையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: בְּבֵית הַחָפְשִׁית மற்றும் עַל הַבַּיִת ஆகிய இரு ‘வீடு’ சொற்றொடர்களின் வேறுபாடு
  choice: முதலாவதை தனிமைப்படுத்தப்பட்ட குடியிருப்பாகவும், இரண்டாவதை அரண்மனை நிர்வாகப் பொறுப்பாகவும் மொழிபெயர்த்தல்.
  alternative: முறையே ‘பிரிக்கப்பட்ட வீட்டில்’ மற்றும் ‘வீட்டின்மேல்’ என்று சொற்சொல்லாக வழங்குதல்
  rationale: எபிரெய மூலத்தின் சூழல்சார் வேறுபாட்டை வாசிக்கத்தக்க தமிழில் காட்டுகிறது; அரசன் தனியே வாழ்ந்தபோது யோதாம் அரச இல்ல நிர்வாகத்தையும் மக்களுக்கான நீதிப் பொறுப்பையும் ஏற்றிருந்ததைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யெகோவா’ தனிப்பெயராக வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள இரண்டு ‘வீடு’ தொடர்பான சொற்றொடர்கள் தமிழில் குழப்பமின்றி வேறுபடுத்தப்பட்டுள்ளன; நோயின் துல்லியமான மருத்துவ அடையாளம் அடிக்குறிப்பில் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
