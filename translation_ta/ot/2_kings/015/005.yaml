revisions:
- from: யெகோவா அரசனைத் தாக்கினார்; அவன் இறக்கும் நாள்வரை தொழுநோயாளியாக[a] இருந்து, தனிமைப்படுத்தப்பட்ட ஒரு வீட்டில் வாழ்ந்தான். அரசனின் மகன் யோதாம் அரண்மனை நிர்வாகத்துக்குப் பொறுப்பாயிருந்து[b], நாட்டின் மக்களுக்கு நீதி வழங்கிவந்தான்.
  to: யாவே அரசனைத் தாக்கினார்; அவன் இறந்த நாள்வரை தொழுநோயாளியாக[a] இருந்து, தனியே இருக்கும் ஒரு வீட்டில்[b] வாழ்ந்தான். அரசனின் மகனான யோதாம் அரண்மனைப் பொறுப்பில் இருந்து, நாட்டின் மக்களுக்கு நீதி வழங்கினான்.
