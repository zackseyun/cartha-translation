base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனான ரெமலியாவின் மகன் பெக்காவின் ஆட்சியின் இரண்டாம் ஆண்டில், உசியாவின்[b] மகனான யோதாம் யூதாவின் அரசனானார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்சி செய்யத் தொடங்கினார்.” எபிரெய வினை அரசனாதலையோ ஆட்சியின் தொடக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: உசியா வேறு இடங்களில் அசரியா என்றும் அழைக்கப்படுகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: ஆட்சியின் இரண்டாம் ஆண்டில்
  rationale: இது அரசரின் ஆட்சியாண்டைக் குறிக்கும் எபிரெய காலக் கணிப்பு மரபுத்தொடர். שְׁתַּיִם சொல்லின் நேரடிப் பொருள் ‘இரண்டு’ என்றாலும், இச்சூழலில் அது ‘இரண்டாம்’ என்ற வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: לְ/פֶקַח
  choice: பெக்காவின்
  rationale: לְ முன்னொட்டு எந்த அரசரின் ஆட்சியாண்டு கணக்கிடப்படுகிறது என்பதைக் காட்டுகிறது; தமிழில் உடைமை வேற்றுமையுடன் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: בֶּן רְמַלְיָהוּ
  choice: ரெமலியாவின் மகன்
  rationale: வரலாற்றுத் துல்லியத்திற்காகத் தந்தை–மகன் அடையாள அமைப்பு நேரடியாகப் பேணப்பட்டுள்ளது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: பெக்காவின் அரச பட்டமும் ஆட்சிப் பகுதியும் வெளிப்படையாகப் பேணப்பட்டுள்ளன.
- source_word: מָלַךְ
  choice: அரசனானார்
  rationale: இவ்வரசேற்பு அறிவிப்பில் வினைச்சொல் அரசனாதல் அல்லது ஆட்சியைத் தொடங்குதல் என்பதைக் குறிக்கிறது; ‘அரசனானார்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் அரசேற்பைக் காட்டுகிறது.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן עֻזִיָּהוּ
  choice: உசியாவின் மகன்
  rationale: இவ்வசனத்தில் உள்ள עֻזִיָּהוּ என்ற பெயரே மொழிபெயர்க்கப்பட்டுள்ளது; வேறு இடங்களில் காணப்படும் மாற்றுப் பெயர் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: யோதாமின் தந்தையான உசியாவை அடையாளப்படுத்தும் அரச பட்டமும் நாட்டுப் பெயரும் மூலத்திற்கேற்ப வெளிப்படையாக வைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: מָלַךְ என்ற வினையின் தொடக்கநிலை மற்றும் நீடிப்புநிலை பொருள்
  choice: முதன்மை உரையில் ‘அரசனானார்’
  alternative: ‘ஆட்சி செய்யத் தொடங்கினார்’ அல்லது ‘ஆட்சி செய்தார்’
  rationale: அரசேற்பு அறிவிப்பு என்ற சூழல் தொடக்கநிலைப் பொருளை ஆதரிக்கிறது; ஆயினும் எபிரெய வினையின் பொருள் பரப்பை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வரலாற்றுச் செய்திக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வசனத்தின் இரண்டு அரச பட்டங்களும் உறவுமுறை அடையாளங்களும் நீக்கப்படாமல், தமிழில் தெளிவாகப் புரியும் வகையில் அமைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
