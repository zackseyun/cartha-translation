base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: யோதாம் செய்த மற்ற செயல்கள் யூதா அரசர்களின் நாளேட்டுப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன[a] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எழுதப்பட்டிருக்கின்றன’ என்பதற்குப் பதிலாக ‘பதிவுசெய்யப்பட்டிருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியாக ‘எழுதப்பட்டவை’ என்று பொருள்பட்டாலும், இச்செயல்கள் அதிகாரபூர்வமான அரச பதிவில் சேர்க்கப்பட்டன என்பதே இங்குள்ள கருத்து.
    reason: lexical_alternative
  - marker: b
    text: ‘நாளேட்டுப் புத்தகம்’ என்பது அரசர்களைப் பற்றிய அரசவைக் காலவரிசைப் பதிவைக் குறிக்கிறது; இது வேதாகமத்திலுள்ள நாளாகமப் புத்தகத்தையே அவசியமாகக் குறிப்பதில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: יֶתֶר என்பது ‘மீதியானவை/மற்றவை’ என்றும், இந்த அரசாட்சிச் சுருக்கச் சூத்திரத்தில் דִּבְרֵי என்பது அரசனுடைய செயல்கள் என்றும் பொருள்படுகிறது. இயல்பான தமிழுக்காக இணைப்புச் சொல் தனியே வெளிப்படுத்தப்படவில்லை.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: ‘அவன் செய்த’ என்ற உறவுச்சொற்றொடரைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய வினாவடிவத்தையும் அதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன
  rationale: כְּתוּבִים என்பதன் நேரடியான ‘எழுதப்பட்ட’ என்ற பொருளைக் காக்கிறது; இச்சூழலில் ‘பதிவுசெய்யப்பட்டிருக்கின்றன’ என்பதும் பொருத்தமான மாற்றாகும்.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொல்லுக்குச் சொல் ‘சுருளின்மேல்’ என இருந்தாலும், ஓர் ஆவணத்தில் இடம்பெற்றிருப்பதைக் குறிக்க இயல்பான தமிழில் ‘புத்தகத்தில்’ என்று வழங்கப்படுகிறது.
- source_word: דִּבְרֵי הַיָּמִים
  choice: நாளேடு
  rationale: அரசரின் நிகழ்வுகளை நாள்வாரியாகப் பதிவு செய்த வரலாற்று ஆவணத்தைக் குறிக்கும் அரசவைக் காப்பகச் சொல்லாக வழங்கப்படுகிறது.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின்
  rationale: இந்த ஆவணத் தலைப்பில் לְ என்பது யூதா அரசர்களைப் பற்றிய அல்லது அவர்களுக்குரிய பதிவைக் குறிக்கிறது; தமிழில் இயல்பாக உடைமை வேற்றுமையில் வழங்கப்படுகிறது.
