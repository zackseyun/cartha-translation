base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: ta
  text: யோதாம் தன் முன்னோர்களோடு துயிலடைந்து[a], தன் மூதாதையான தாவீதின் நகரத்தில் அவர்களோடு அடக்கம் செய்யப்பட்டான்[b]. அவனுடைய மகன் ஆகாஸ் அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “தன் தந்தையரோடு படுத்தான்.” இது ஓர் அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான மறைவுச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அவனுடைய தந்தையாகிய தாவீதின் நகரத்தில்.” இங்கு “தந்தை” என்பது உடனடி தந்தையை அல்ல, வம்ச மூதாதையைச் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்து
  rationale: இது அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மறைவுச் சொற்றொடர். ‘துயிலடைந்தான்’ அதன் உருவகத்தையும் மரணப் பொருளையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது; ‘முன்னோர்களோடு’ என்பது אֲבֹתָיו என்பதன் இச்சூழலுக்குரிய வம்சாவளிப் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, நிகழ்வுகளின் தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: தன் மூதாதையான தாவீதின் நகரத்தில்
  rationale: אָבִיו என்பதற்கு நேரடியாக ‘அவனுடைய தந்தை’ என்று பொருள் கொள்ள இயன்றாலும், யோதாமின் உடனடி தந்தை தாவீது அல்ல. இங்கு அது தாவீதிய அரச வம்சத்தின் மூதாதையைக் குறிக்கிறது; ஆகவே தமிழில் தவறான புரிதலைத் தவிர்க்க உறவின் நோக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரச வாரிசுரிமை அறிவிப்புகளில் מלך என்பதற்கான சுருக்கமான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசாட்சியில் ஒருவருக்குப் பின் மற்றொருவர் அவரது இடத்தை ஏற்றதைக் குறிக்கும் எபிரெயச் சொல்லின் மாற்றீட்டுப் பொருளைத் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: ‘தாவீது அவனுடைய தந்தை’ என்ற சொற்றொடரில் உறவுமுறை
  choice: உடனடி தந்தை அல்ல, அரச வம்சத்தின் மூதாதை
  alternative: உடனடி உயிரியல் தந்தை
  rationale: யோதாமின் உடனடி தந்தை உசியா/அசரியா என்பதால், இங்கு אָבִיו என்பது தாவீதிய வம்சத்தின் முன்னோரைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்த வரலாற்று மற்றும் வம்சாவளிப் பொருளை வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான வரலாற்று நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய மரணச் சொற்றொடரின் உருவகம் ‘துயிலடைந்து’ எனப் பாதுகாக்கப்பட்டு, குழப்பத்தைத் தவிர்க்க ‘தந்தையர்’ என்பதன் சூழல்சார் பொருள் ‘முன்னோர்கள்’ என வழங்கப்பட்டுள்ளது. ‘தாவீதின் நகரம்’ என்ற நிலையான பெயரமைப்பும் அரச வாரிசுரிமையின் சுருக்கமான நடையும் காக்கப்பட்டுள்ளன.
