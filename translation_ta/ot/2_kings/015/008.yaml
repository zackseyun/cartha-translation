  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: ta
  text: யூதாவின் அரசன் அசரியாவின் முப்பத்தெட்டாம் ஆட்சியாண்டில், யெரொபெயாமின் மகன் சகரியா சமாரியாவில் இஸ்ரவேலுக்கு அரசனாகி, ஆறு மாதங்கள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: முப்பத்தெட்டாம் ஆட்சியாண்டில்
  rationale: எபிரெய அரசாட்சி காலக்கணிப்பு மரபில் எண் வடிவம் வரிசை எண்ணாகச் செயல்படுகிறது. நவீன தமிழில் ‘ஆட்சியாண்டு’ என்பது இது அரசனின் ஆட்சிக்காலக் கணிப்பு என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் அசரியாவின்
  rationale: ל முன்னொட்டு அசரியாவின் ஆட்சியாண்டைக் குறிக்கிறது; מֶלֶךְ יְהוּדָה அவரது பதவியையும் நாட்டையும் அடையாளப்படுத்துகிறது. தமிழில் உரிமைத் தொடர்பு இயல்பாக அமைய இவ்வரிசை பயன்படுத்தப்பட்டது.
- source_word: מָלַךְ
  choice: அரசனாகி, ... ஆட்சி செய்தான்
  rationale: இங்கு வினை அரசாட்சியை ஏற்றதையும், தொடர்ந்து வரும் கால அளவோடு அவரது ஆட்சியையும் குறிக்கிறது. ‘அரசனாகி’ பதவியேற்ற தொடக்கத்தைப் பாதுகாக்கிறது; ‘ஆட்சி செய்தான்’ ஆறு மாதங்கள் என்ற கால அளவை இயல்பாக இணைக்கிறது.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: யெரொபெயாமின் மகன் சகரியா
  rationale: தந்தை–மகன் அடையாளத்தை இயல்பான தமிழ்ச் சொற்றொடரில் வழங்குகிறது; பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்களில் ஒலிபெயர்க்கப்பட்டன.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு அரசனாகி
  rationale: עַל என்பது இங்கு இஸ்ரவேல்மீதான அரசாட்சியைக் குறிக்கிறது. தமிழில் ‘இஸ்ரவேலுக்கு அரசன்’ என்பது இயல்பான ஆட்சித் தொடர்பைத் தெரிவிக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு அவரது ஆட்சியின் இருப்பிடத்தை அல்லது தலைநகரைக் குறிக்கும் இடவேற்றுமை உருபாக உள்ளது.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: ஆறு மாதங்கள்
  rationale: இது ஆட்சியின் கால நீளத்தைக் குறிக்கும் கால அளவு. தமிழில் தனி முன்னிடைச் சொல் இன்றியே வினையுடன் இயல்பாக இணைகிறது.
