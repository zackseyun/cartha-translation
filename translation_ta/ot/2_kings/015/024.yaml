source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்யச் செய்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களைவிட்டு அவன் விலகவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: எபிரெய அரசர் மதிப்பீட்டு மரபுத்தொடரின் பொருளையும் இயல்பான நவீனத் தமிழ் நடையையும் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாகப் பிரதிபலிக்கிறது; יהוה என்பது பட்டப்பெயராக அல்லாமல் ‘யாவே’ என்ற தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: பாவங்களைவிட்டு அவன் விலகவில்லை
  rationale: סור என்பதன் ‘ஒரு நடத்தை அல்லது வழியிலிருந்து விலகுதல்’ என்ற பொருளையும் חטאות என்ற பன்மையையும் காக்கிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெய தந்தைவழி அடையாளத்தை இயல்பான தமிழ்ச் சொல்வரிசையில் வழங்குகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யச் செய்த
  rationale: חטא வினையின் ஹிஃபில் காரணவினை வடிவை நேரடியாகக் காத்து, யெரொபெயாம் இஸ்ரவேலின் பாவத்துக்குக் காரணமானான் என்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் வரும் நான்கெழுத்து இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்யச் செய்ததைக் குறிக்கும் காரணவினை
  choice: பாவம் செய்யச் செய்த
  alternative: பாவத்திற்கு வழிநடத்திய
  rationale: மூலத்தின் காரணவினைத் தன்மையைப் பாதுகாத்து, அவன் பயன்படுத்திய முறை குறித்து உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. மூலத்தில் தனி வாசகமாக இல்லாத பொருளைச் சுட்டும் ஆங்கில அடிக்குறிப்பு சேர்க்கப்படவில்லை.
