  source_fidelity: மூல எபிரெயத்தின் அரச மரண/வாரிசுரிமைச் சூத்திரம் துல்லியமாகக் காக்கப்பட்டுள்ளது. “தன் முன்னோர்களோடு துயிலடைந்தான்” என்பது עִם אֲבֹתָיו உடனான וַיִּשְׁכַּב என்ற மரபுத்தொடரின் மரணச் சுட்டலை இயல்பாகத் தருகிறது; அடிக்குறிப்பு அதன் நேரடியான உருவகத்தைத் தெளிவுபடுத்துகிறது. பெக்ககியா மகனாகவும் மெனாகேமுக்குப் பதிலாக அரசனானவனாகவும் சரியாகக் குறிப்பிடப்படுகிறான்.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு குறுகிய வாக்கியங்களாகப் பிரித்திருப்பது பொருளையோ தொடர்ச்சியையோ பாதிக்கவில்லை. “அவனுக்குப் பதிலாக அவன் மகன்” என்ற தொடர் வாரிசுரிமையை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: அரச மரணச் சூத்திரத்திற்குத் “துயிலடைந்தான்” பொருத்தமானது; “முன்னோர்களோடு” என்பது நவீன வாசகர்களுக்குப் புரியத்தக்க வகையில் אֲבֹתָיו என்பதன் வம்ச/முன்தலைமுறைப் பொருளைத் தருகிறது. பெயர்கள் வழங்கப்பட்ட எழுத்துப்பெயர்ப்பு மரபோடு ஒத்திருக்கின்றன. அடிக்குறிப்பின் a குறியீடும் உரையிலுள்ள இணைப்பும் சரியாக உள்ளன.
