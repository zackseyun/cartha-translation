source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב מְנַחֵ֖ם עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ פְּקַחְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: ta
  text: மெனாகேம் தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவனுக்குப் பதிலாக அவன் மகன் பெக்ககியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தன் முன்னோர்களோடு படுத்தான்.” இது ஓர் அரசனின் மரணத்தையும் அதன்பின் நிகழும் அரச வாரிசுரிமையையும் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: ‘தன் முன்னோர்களோடு’ என்பதுடன் சேர்ந்த இந்த எபிரெய மரபுத்தொடர் அரசனின் மரணத்தைக் குறிக்கிறது. ‘இறந்தான்’ என்று முழுமையாக விளக்கிவிடாமல், மூலத்தின் துயில் உருவகத்தையும் இயல்பான தமிழையும் இது காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אָבוֹת என்பதன் அடிப்படைப் பொருள் ‘தந்தையர்’ என்றாலும், இந்த அரச மரண மரபுத்தொடரில் முந்தைய தலைமுறையினரைக் குறிக்கிறது; நவீன தமிழில் ‘முன்னோர்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இந்த வாரிசுரிமை அறிவிப்பில் வினைச்சொல் ஆட்சியேற்றதைக் குறிக்கிறது. ‘அரசாண்டான்’ என்பதைக் காட்டிலும் ‘அரசனானான்’ அடுத்த அரசனாகப் பொறுப்பேற்ற நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פְּקַחְיָה
  choice: பெக்ககியா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: வாரிசின் தந்தை-மகன் உறவை மூலத்தைப்போல வெளிப்படையாகக் காக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
