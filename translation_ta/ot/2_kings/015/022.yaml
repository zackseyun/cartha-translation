  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. மரணத்தைச் சுட்டும் எபிரெய உருவகம் முதன்மை உரையில் ‘துயிலடைந்தான்’ எனப் பாதுகாக்கப்பட்டு, அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
