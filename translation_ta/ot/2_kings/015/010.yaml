translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைச்செயல்கள் இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டாலும், தாக்குதல், கொலை, ஆட்சியேற்பு ஆகிய தனித்தனி நிகழ்வுகள் பேணப்பட்டுள்ளன.
