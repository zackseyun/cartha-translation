  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ שַׁלֻּ֣ם בֶּן יָבֵ֔שׁ וַ/יַּכֵּ֥/הוּ קָֽבָלְ עָ֖ם וַ/יְמִיתֵ֑/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: ta
  text: அப்போது யாபேசின் மகன் சல்லூம் அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டி, மக்கள் முன்னிலையில்[a] அவனைத் தாக்கிக் கொன்றான். பின்பு அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொதுவில்’ அல்லது ‘சபைக்கு முன்பாக’ என்றும் மொழிபெயர்க்கலாம்; קָבָל־עָם என்ற எபிரெயச் சொற்றொடரின் பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டி
  rationale: அரச வாரிசுரிமைச் சூழலில் קשר என்பது ஆட்சியாளருக்கு எதிரான அரசியல் சதியைக் குறிக்கிறது; இத்தமிழாக்கம் பகைமையும் திட்டமிடுதலும் கொண்ட பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: யாபேசின் மகன் சல்லூம்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; בן என்பதன் வம்ச உறவு இயல்பான தமிழ் மரபில் ‘மகன்’ எனத் தரப்பட்டுள்ளது.
- source_word: וַיַּכֵּהוּ
  choice: அவனைத் தாக்கி
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் எனப் பொருள்படும். அடுத்த வினைச்சொல் மரணத்தைத் தனியாகக் கூறுவதால், இங்கே தாக்குதலின் செயலையே தனித்துப் பேணுகிறது.
- source_word: קָבָל־עָם
  choice: மக்கள் முன்னிலையில்
  rationale: அரிதானதும் பொருள் தெளிவற்றதுமான இச்சொற்றொடர், மக்களின் பார்வைக்கு முன்பாக நடந்த பொதுச் செயலைக் குறிக்கலாம். இத்தேர்வு எபிரெயச் சொற்களுக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: וַיְמִיתֵהוּ
  choice: கொன்றான்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தான்’ அல்லது ‘கொன்றான்’ எனப் பொருள்படும். இயல்பான தமிழில் ‘கொன்றான்’ causative முடிவைத் தெளிவாகக் கூறுகிறது; முந்தைய ‘தாக்கி’ என்பதிலிருந்து மரணச் செயல் வேறுபடுத்தப்படுகிறது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அரசாண்டான்
  rationale: מלך மற்றும் תחתיו இணைந்து முந்தைய அரசனின் இடத்தில் அரியணை ஏற்று ஆட்சி செய்ததைக் குறிக்கின்றன; ‘அரசாண்டான்’ அரசாட்சியின் தொடர்ச்சியை நேரடியாகக் காட்டுகிறது.
