base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: ta
  text: அந்த நாட்களில் யாவே, யூதாவுக்கு எதிராக[a] ஆராமின் அரசன் ரெசீனையும்[b] ரெமலியாவின் மகன் பெக்காவையும் அனுப்பத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவுக்குள்.” இங்குள்ள எபிரெயச் சொல்லாடல் பகைமைச் சூழலில் “யூதாவுக்கு எதிராக” என்ற பொருளைக் கொடுக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “ஆராம்”; மரபாக “சீரியா” எனப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: ஒரு தனிப்பட்ட தருணத்தை அல்ல, வரலாற்றுக் காலப்பகுதியைக் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הֵחֵל
  choice: தொடங்கினார்
  rationale: செயலின் தொடக்கத்தைக் குறிக்கும் வினை வடிவத்தை தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயரை தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: யூதாவுக்கு எதிராக ... அனுப்ப
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’; பகைமைச் சூழலில் בִּיהוּדָה என்பதை ‘யூதாவுக்கு எதிராக’ என வழங்குவது சூழற்பொருளைத் தெளிவாக்குகிறது. இடப்பொருளான ‘யூதாவுக்குள்’ என்பதும் இலக்கண ரீதியில் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: ஆராம் அரசன் ரெத்சீன்
  rationale: தமிழின் இயல்பான அடைமொழி வரிசையைப் பின்பற்றி, நபர்பெயரையும் புவி-இனப் பெயரையும் எபிரெயிலிருந்து ஒலிபெயர்க்கிறது.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: ரெமலியாவின் மகன் பெக்காவையும்
  rationale: אֵת குறிக்கும் இரண்டாவது நேர்செயப்படுபொருளை ‘-ஐயும்’ மூலம் முதல் நபருடன் இணைக்கிறது; בן என்பதற்கு இயல்பான ‘மகன்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யூதாவை நோக்கிய அனுப்புதலின் பகைமைப் பொருள்
  choice: யூதாவுக்கு எதிராக
  alternative: யூதாவுக்குள்
  rationale: அனுப்பப்பட்ட இரு அரசர்களும் தாக்குதல் நடத்துவோர் என்பதால் சூழல் பகைமைத் திசையை வலியுறுத்துகிறது. எனினும் בְּ முன்னிடைச்சொல்லின் இடப்பொருள் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தில் செயப்படுபொருள்களான இரு அரசர்களையும் தமிழில் ‘-ஐயும் ... -ஐயும்’ என இணைத்து, ‘அனுப்பத் தொடங்கினார்’ என்ற வினையை இறுதியில் வைத்துள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
