  source_fidelity: மூலத்தின் தொடர்ச்சியான வினைகள்—சதி செய்தல், அடித்தல், கொல்லுதல், அவனுக்குப் பதிலாக அரசனாதல்—தெளிவாகத் தனித்தனியே வெளிப்பட வேண்டும். ‘இது ... நடந்தது’ என்பது எபிரெயத்தின் அரசாண்டுக் காலக்குறிப்பைச் சற்றே தளர்த்துகிறது; காலக்குறிப்பை நேரடியாக அரசனான நிகழ்வுடன் இணைப்பது சிறந்தது.
