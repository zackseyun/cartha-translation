base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: ta
  text: உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில், ஏலாவின் மகன் ஓசேயா ரெமலியாவின் மகன் பெக்காவுக்கு எதிராகச் சதித்திட்டம் தீட்டினான்[a]. அவனை அடித்து, கொன்றான்; அவனுக்குப் பதிலாக அரசனானான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஒரே வேர்ச்சொல்லிலிருந்து வந்த வினையும் பெயர்ச்சொல்லும் இணைந்து, சொற்பட “ஒரு சதியைச் சதித்தான்” என்று உள்ளது. இது அரசனுக்கு எதிரான சதித்திட்டத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயம், “உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில்” என்று வாசிக்கிறது. அரசர்களின் ஆட்சியாண்டுக் கணக்கில் இது ஒரு காலவரிசைச் சிக்கலை உருவாக்குகிறது. சிலர் இதை ஆகாசின் ஆட்சியுடன் ஒத்திசைக்க முயல்கிறார்கள்; ஆனால் இம்மொழிபெயர்ப்பு எபிரெய வாசகத்தையே பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: சதித்திட்டம் தீட்டி
  rationale: எபிரெயத்தில் ஒரே வேரிலிருந்து வந்த வினையும் பெயர்ச்சொல்லும் இணைந்து வலியுறுத்துகின்றன. அதைத் தமிழில் சொற்குச் சொல் மீண்டும் கூறுவது இயல்பற்றதாக இருப்பதால், வலுவானதும் இயல்பானதுமான ‘சதித்திட்டம் தீட்டி’ என மொழிபெயர்த்து, மூலத்தின் அமைப்பை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: ஏலாவின் மகன் ஓசேயா
  rationale: தனிப்பெயர்களும் தந்தைவழி அடையாளமும் தமிழில் வழக்கமான முறையில் தரப்பட்டுள்ளன.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: ரெமலியாவின் மகன் பெக்காவுக்கு எதிராக
  rationale: சதிச்சூழலில் עַל என்பது ஒருவரை இலக்காகக் கொண்ட பகைமையான நடவடிக்கையைக் குறிக்கிறது; ‘எதிராக’ என்பது இயல்பான தமிழ் இணைச்சொல்.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: அவனை அடித்து வீழ்த்திக் கொன்றுபோட்டு
  rationale: முதல் வினை தாக்கி வீழ்த்துவதையும், அடுத்த காரணவினை மரணமடையச் செய்வதையும் தனித்த தொடர் நடவடிக்கைகளாகக் காட்டுகிறது. தமிழில் இரண்டையும் இயல்பான ஒரே வினைத்தொடரில் பாதுகாக்கிறது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக ஆட்சி செய்தான்
  rationale: מָלַךְ என்பது அரசாளுதல் அல்லது ஆட்சி செய்தலைக் குறிக்கிறது; תַּחְתָּיו வாரிசாக அவனுடைய இடத்தை ஏற்றதைக் காட்டுகிறது.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில்
  rationale: அரசாண்டுக் கணக்கைக் குறிக்கும் எபிரெயச் சூத்திரத்தை அதன் காலவரிசைச் சிக்கலைத் திருத்தாமல் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: அரசாண்டுக் கணக்கிலுள்ள காலவரிசை முரண்பாடு
  choice: மசோரா எபிரெய உரையிலுள்ளபடியே ‘உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில்’ என்று மொழிபெயர்த்தல்
  alternative: ஆகாசின் ஆட்சியுடன் மறைமுகமாக ஒத்திசைத்தல் அல்லது காலவரிசைச் சிக்கலை நீக்க உரையைத் திருத்துதல்
  rationale: வேறு இடங்களில் யோதாமின் ஆட்சிக்குக் கொடுக்கப்படும் கால அளவுடன் ‘இருபதாம் ஆண்டு’ என்பது பதற்றத்தை உருவாக்குகிறது. மூல உரைக்கு ஆதாரமில்லாமல் மொழிபெயர்ப்பிலேயே அதைத் தீர்க்காமல், எபிரெய வாசகத்தைப் பாதுகாத்து அடிக்குறிப்பில் சிக்கலைத் தெரிவிப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சதித்திட்டம் தீட்டி’, ‘அடித்து வீழ்த்திக் கொன்றுபோட்டு’, ‘ஆட்சி செய்தான்’ ஆகியவை வரலாற்றுக் கதையாடலுக்கேற்ற தெளிவான நடையில் உள்ளன; மூலத்தின் வலியுறுத்தலும் காலவரிசைப் பதற்றமும் அடிக்குறிப்புகள் மூலம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
