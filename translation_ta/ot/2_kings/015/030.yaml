revisions:
- from: அப்போது ஏலாவின் மகன் ஓசேயா, ரெமலியாவின் மகன் பெக்காவுக்கு எதிராகச் சதித்திட்டம் தீட்டி[a], அவனை அடித்து வீழ்த்திக் கொன்றுபோட்டு, அவனுக்குப் பதிலாக ஆட்சி செய்தான். இது உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில் நடந்தது.[b]
  to: உசியாவின் மகன் யோதாமின் இருபதாம் ஆண்டில், ஏலாவின் மகன் ஓசேயா ரெமலியாவின் மகன் பெக்காவுக்கு எதிராகச் சதித்திட்டம் தீட்டினான்[a]. அவனை அடித்து, கொன்றான்; அவனுக்குப் பதிலாக அரசனானான்.[b]
  rationale: திருத்தம் எபிரெயத்தின் நான்கு தொடர்ச்சியான வினைகளையும் தெளிவாகப் பாதுகாக்கிறது; பேச்சுவழக்கான ‘கொன்றுபோட்டு’ நீக்கப்படுகிறது; அரசாண்டுக் குறிப்பு மூலத்தில் இருப்பதுபோல அரசனான நிகழ்வுடன் நேரடியாக இணைக்கப்படுகிறது. காலவரிசைச் சிக்கல் தீர்க்கப்படாமல் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
