source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: ta
  text: அவன் தன் தந்தையர் செய்ததுபோலவே யாவேயின் பார்வையில் தீமையானதைச் செய்தான். இஸ்ரவேலைப் பாவம் செய்ய வைத்த நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களைவிட்டு அவன் விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடர்புத் தொடர் யெரொபெயாமையே நேரடியாகக் குறிப்பதாகவும், யெரொபெயாமின் பாவங்களோடு நெருக்கமாக இணைத்துப் புரிந்துகொள்ளப்படுவதாகவும் வாசிக்க இடமளிக்கிறது. இரு வாசிப்புகளிலும் இஸ்ரவேலைப் பாவம் செய்ய வைத்தவன் யெரொபெயாமே.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: எபிரெயக் கதைநடையின் இயல்பான இறந்தகால வினையை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில் தீமையானதை
  rationale: மதிப்பீட்டைக் குறிக்கும் மூலமொழியின் வழக்குச் சொற்றொடரை இயல்பான தமிழில் அதன் உருவகத்தோடு காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலிடாமல் எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: தன் தந்தையர் செய்ததுபோலவே
  rationale: ஒப்பீட்டின் வலிமையையும் ஆண்பால் பன்மையான குடும்ப/வம்சக் குறிப்பையும் காக்கிறது.
- source_word: לֹא סָר
  choice: விலகவில்லை
  rationale: ஒரு தவறான நெறியைக் கைவிடாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מֵחַטֹּאות
  choice: பாவங்களைவிட்டு
  rationale: மூலத்தின் பன்மையைத் தக்கவைத்து, סור מן என்பதன் ‘விட்டு விலகு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, தந்தை-மகன் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்த
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளைக் காத்து, அருகிலுள்ள யெரொபெயாமைச் செய்பவராக வாசிக்கும் இயல்பான எபிரெயப் பொருத்தத்தை முதன்மை உரையில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் வெளிப்படுத்துகிறது.
- issue: אֲבֹתָיו என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: தன் தந்தையர்
  alternative: தன் முன்னோர்கள்
  rationale: அரச வம்சச் சூழலில் உள்ள ஆண்பால் குறிப்பைத் தக்கவைத்து, மூலச்சொல்லுக்கு நெருக்கமாக உள்ளது.
- issue: אֲשֶׁר என்ற தொடர்புச் சொல்லின் முன்னிலை
  choice: யெரொபெயாமே இஸ்ரவேலைப் பாவம் செய்ய வைத்தான் என முதன்மை உரையில் அமைத்தல்
  alternative: அவனுடைய பாவங்களால் இஸ்ரவேல் பாவம் செய்யத் தூண்டப்பட்டது எனப் புரிந்துகொள்ளுதல்
  rationale: எபிரெயத் தொடர்புச்சொல் பாலிலும் எண்ணிலும் மாறாததால் வடிவரீதியான சிறு திறந்தநிலை உள்ளது; ஆயினும் காரணவினையின் இயல்பான எழுவாயாக யெரொபெயாமை எடுத்துக்கொள்வது தெளிவான வாசிப்பு. மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பார்வையில்’ என்பது மூலமொழி உருவகத்தைத் தக்கவைக்கிறது; ‘விலகவில்லை’ என்பது தற்போதைய வாசகர்களுக்குத் தெளிவான நெறிசார் சொல்லாக்கம்.
