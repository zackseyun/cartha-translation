  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: ta
  text: யூதாவின் அரசனான உசியாவின் ஆட்சியின் முப்பத்தொன்பதாம் ஆண்டில் யாபேசின் மகன் சல்லூம் அரசனானான். அவன் சமாரியாவில் ஒரு மாத காலம்[a] ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நாட்களின் ஒரு மாதம்”; அதாவது, ஏறக்குறைய ஒரு மாதம்.
    reason: lexical_alternative
lexical_decisions:
