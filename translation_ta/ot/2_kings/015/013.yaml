- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசனான நிகழ்விலிருந்து அவனுடைய ஆட்சிக்காலத்துக்கு உரை நகர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יֶרַח יָמִים
  choice: ஒரு மாத காலம்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களின் ஒரு மாதம்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக இருக்காது. அதன் கால அளவை ‘ஒரு மாத காலம்’ என்று தெளிவாகக் கொடுத்து, மூலத்தின் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னொட்டுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்; அவன் ஆட்சி செய்த இடம் சமாரியா என்பதைத் தெரிவிக்கிறது.
