translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்று நடையைப் பயன்படுத்துகிறது. அரசாட்சித் தொடக்கத்தையும் அதன் கால அளவையும் தனித்தனி வாக்கியங்களாகக் கொடுத்து வாசிப்புத் தெளிவு பேணப்பட்டுள்ளது. மூலத்தில் உள்ள ‘ஒரு மாத நாட்கள்’ என்ற மரபுத்தொடரின் பொருள் முதன்மை உரையில் இயல்பான தமிழாகவும், அதன் நேரடி வடிவம் அடிக்குறிப்பிலும் வழங்கப்பட்டுள்ளது.
