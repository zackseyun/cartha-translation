base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: ta
  text: யூதாவின் அரசன் அசரியாவின் ஆட்சியின் ஐம்பதாம் ஆண்டில், மெனகேமின் மகன் பெக்ககியா சமாரியாவில் இஸ்ரவேலுக்கு அரசனாகி, இரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה לַעֲזַרְיָה
  choice: அசரியாவின் ஆட்சியின் ஐம்பதாம் ஆண்டில்
  rationale: எபிரெய அரசாட்சி ஆண்டுக் கணக்கீட்டு மரபுத்தொடரை இயல்பான தமிழில் தெளிவாகத் தருகிறது; ל குறிக்கும் அசரியாவின் ஆட்சியைச் சார்ந்த காலக் கணக்கை ‘ஆட்சியின்’ என வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அசரியாவின் பதவியையும் ஆட்சிப் பகுதியையும் நேரடியாகக் குறிப்பிடும் இணைப்புத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: מָלַךְ
  choice: அரசனாகி
  rationale: இங்கு வினை அரசேற்ற நிகழ்வைக் குறிக்கிறது; ஆட்சிக்காலம் பின்னர் தனியே கூறப்படுவதால் ‘அரசனாகி’ என்பது மீளுரையின்றி பொருளைத் தருகிறது.
- source_word: פְּקַחְיָה
  choice: பெக்ககியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶן מְנַחֵם
  choice: மெனகேமின் மகன்
  rationale: அரசனைத் தந்தை வழியாக அடையாளப்படுத்தும் மூலத்தின் நேரடியான உறவுமுறையைப் பாதுகாக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு அரசனாகி
  rationale: עַל உடன் வரும் מלך, ஒரு மக்களின்மீது அரசாளுதலைக் குறிக்கிறது; தமிழில் ‘இஸ்ரவேலுக்கு அரசனாகி’ என்பது இயல்பான அரசாட்சி நடை.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னொட்டை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: שְׁנָתָיִם
  choice: இரண்டு ஆண்டுகள் ஆட்சி செய்தான்
  rationale: இருமை வடிவமான שְׁנָתָיִם ‘இரண்டு ஆண்டுகள்’ என்று பொருள்படும்; தமிழில் முழுமையான வாக்கியத்திற்காக ஆட்சியைச் சுட்டும் வினை இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
