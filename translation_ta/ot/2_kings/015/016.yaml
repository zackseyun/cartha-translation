  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: ta
  text: அப்போது மெனாகேம் திர்சாவிலிருந்து திப்சாவையும், அதில் இருந்த அனைவரையும், அதன் எல்லைப்பகுதியையும் தாக்கினான். திப்சா அவனுக்குத் திறக்காததால்[a], அவன் அதைத் தாக்கி, அதிலிருந்த கர்ப்பிணிப் பெண்கள் அனைவரின் வயிறுகளையும் பிளந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திறக்காததால்” என்பது நகரம் மெனாகேமுக்குத் தன் வாயில்களைத் திறந்து அவனை ஏற்கவோ அவனிடம் சரணடையவோ மறுத்ததைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “பிளந்தான்” என்பதற்கு “கிழித்துத் திறந்தான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலுக்கட்டாயமாகப் பிளப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலத் தொடர்புச் சொல்.
- source_word: יַכֶּה / וַיַּךְ
  choice: தாக்கினான்
  rationale: נכה என்ற வினையின் இராணுவத் தாக்குதல் சார்ந்த பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; இரு வடிவங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது தொடர்ச்சியைப் பேணுகிறது.
- source_word: תִּפְסַח
  choice: திப்சா
  rationale: இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: அதில் இருந்த அனைவரையும்
  rationale: சொற்றொடர் சொற்படி ‘அதில் இருந்த அனைத்தையும்’ எனப் பரந்த பொருள் கொள்ளக்கூடியது; நகரத் தாக்குதலின் சூழலில் அங்கிருந்த மக்களைச் சுட்டுவது இயல்பானது.
- source_word: גְּבוּלֶיהָ
  choice: அதன் சுற்றுப்பகுதியையும்
  rationale: இங்கு גְּבוּל என்பது வெறும் எல்லைக்கோட்டை விட நகரத்திற்குரிய நிலப்பரப்பு அல்லது சுற்றுவட்டாரத்தைக் குறிக்கிறது.
- source_word: מִתִּרְצָה
  choice: திர்சாவிலிருந்து சென்று
  rationale: מן என்பதன் ‘இருந்து’ என்ற பொருளைப் பேணுகிறது; தமிழ் வாக்கியத்தில் தாக்குதல் தொடங்கிய இடமாக இயல்பாகப் புரிய ‘சென்று’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי לֹא פָתַח
  choice: அது அவனுக்குத் திறக்காததால்
  rationale: எபிரெயச் சொற்றொடரின் ஒருமை உருவையும் ‘திறத்தல்’ என்ற உருவகமற்ற நேரடி சொல்லையும் பேணுகிறது; நகரம் அவனை ஏற்கவோ சரணடையவோ மறுத்ததையே சூழல் குறிக்கிறது.
- source_word: הֶהָרוֹתֶיהָ
  choice: அங்கிருந்த கர்ப்பிணிப் பெண்கள் அனைவரின்
  rationale: הרה என்பதன் நேரடியான பொருளைத் தெளிவாகவும் மறைப்பின்றியும் தருகிறது.
- source_word: בִּקֵּעַ
  choice: வயிற்றையும் பிளந்தான்
  rationale: பியேல் வடிவிலுள்ள בקע வன்முறையாகப் பிளப்பதைக் குறிக்கிறது; இலக்கு கர்ப்பிணிப் பெண்கள் என்பதால் தமிழில் செயல் தெளிவாகப் புரிய ‘வயிற்றையும்’ வெளிப்படுத்தப்பட்டுள்ளது.
