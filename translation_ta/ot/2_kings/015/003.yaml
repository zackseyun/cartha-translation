  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: ta
  text: அவன் தன் தகப்பனான அமத்சியா செய்த எல்லாவற்றின்படியும், யாவேயின் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: வாவ் தொடர்வினையுடன் வரும் עשׂה கதைநிகழ்வின் அடுத்த செயலைக் குறிக்கிறது. நவீன தமிழில் தொடக்க ‘மேலும்’ அவசியமில்லாததால் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: הַיָּשָׁר
  choice: நேர்மையானதை
  rationale: குறிப்புச் சுட்டுடன் வரும் ישר இங்கு பெயர்ச்சொல் தன்மையில் ‘நேர்மையானது/சரியானது’ எனப் பொருள்படுகிறது; அரசனை மதிப்பிடும் இச்சூத்திரத்தில் ‘நேர்மையானதை’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: எபிரெய மொழியின் ‘கண்களில்’ என்ற உருவக மரபுத்தொடர் யெகோவாவின் மதிப்பீட்டின்படி என்பதைக் குறிக்கிறது. தமிழில் ‘பார்வையில்’ உருவகத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த அனைத்தின்படியும்
  rationale: மற்றொருவரின் செயல்கள் முழுவதற்கும் ஒத்தவாறு நடந்ததை כְּכֹל אֲשֶׁר குறிக்கிறது; ‘அனைத்தின்படியும்’ அதன் ஒப்புமை மற்றும் முழுமை உணர்வைக் காக்கிறது.
- source_word: עָשָׂה
  choice: செய்த
  rationale: அமத்சியாவின் முந்தைய செயல்களைத் தமிழ் பெயரெச்ச வடிவம் தெளிவாகக் குறிக்கிறது; எபிரெய நிறைவுவினையின் காலத்தைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய ஆள்பெயர் நவீனத் தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: உடனடி வம்சவரலாற்றுச் சூழலில் இது நேரடியான தந்தையைக் குறிக்கிறது. எழுவாயையே சுட்டுவதால் தமிழில் ‘தன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது; தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது. மூல எபிரெய உயிரெழுத்தற்ற வடிவத்தின் பண்டைய உச்சரிப்பு முழு உறுதியுடன் அறியப்படாததால் ‘யாவே’ என்பதும் சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன தரத் தமிழ்; அரசர் குறித்த மதிப்பீட்டு வாய்பாட்டின் கண்ணியத்தையும் மூலத்தின் சுருக்கத்தையும் காக்கும் இயல்பான நடை. எந்த அடிக்குறிப்பும் தேவையில்லை.
