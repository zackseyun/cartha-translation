translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘கை’ என்ற இருமுறை வரும் எபிரெய உருவகம் இயன்றவரை காக்கப்பட்டாலும், பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்க ‘பூலின் கை’ என்றும் அரசியல் பொருளைத் தெளிவாக்க ‘ஆதரவாக’ என்றும் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
