source:
  edition: WLC
  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: ta
  text: அசீரிய அரசன் பூல் அந்த நாட்டுக்கு எதிராக வந்தான்.[a] அப்போது மெனாகேம், தனது ஆட்சியைத் தன் கையில் உறுதிப்படுத்துவதற்காக பூலின் கை தனக்கு ஆதரவாக இருக்கும்படி, அவனுக்கு ஆயிரம் தாலந்து வெள்ளியைக் கொடுத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த நாடு” என்பது இங்கே பெரும்பாலும் இஸ்ரவேல் நாட்டைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: இதை இன்னும் இயல்பாக, “தனது ஆட்சியை உறுதிப்படுத்த அவன் தனக்கு ஆதரவளிக்கும்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “தன் கையில் ஆட்சியை உறுதிப்படுத்துவதற்கு அவனுடைய கை அவனோடு இருக்கும்படி” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: வந்தான்
  rationale: கதைநடையில் בוא என்பதன் இயல்பான பொருள் ‘வருதல்’; நவீன தமிழில் நேரடியும் இயல்புமான வடிவம்.
- source_word: פ֤וּל
  choice: பூல்
  rationale: தனிப்பெயர் என்பதால் எபிரெய ஒலிப்புக்கு அணுக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் பொருளை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: עַל הָאָרֶץ
  choice: அந்த நாட்டுக்கு எதிராக
  rationale: இராணுவ நகர்வைக் குறிக்கும் வினையுடன் עַל பகைமையான முன்னேற்றத்தைக் காட்டுகிறது; הָאָרֶץ சூழலில் இஸ்ரவேல் நாட்டைக் குறிப்பதாக இருந்தாலும் மூலத்தின் பொதுத்தன்மை காக்கப்பட்டது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் நேரடிப் பொருள் காக்கப்பட்டது; இது கப்பம் அல்லது அரசியல் ஆதரவுக்கான தொகை என்பதைச் சூழல் உணர்த்துகிறது.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: ஆயிரம் தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது எடை அலகு; வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘தாலந்து’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: பூலின் கை தனக்கு ஆதரவாக இருக்கும்படி
  rationale: ‘அவனுடைய கை அவனோடு இருக்க’ என்ற எபிரெய உருவகத்தை ஓரளவு காத்து, கை யாருடையது என்ற பிரதிப்பெயர் குழப்பத்தைத் தெளிவாக்க ‘பூலின்’ எனப் பெயர் மீண்டும் இடப்பட்டது; ஆதரவு என்ற உட்பொருளும் வெளிப்படுத்தப்பட்டது.
- source_word: לְהַחֲזִיק
  choice: உறுதிப்படுத்துவதற்காக
  rationale: חזק என்பதன் ஹிஃபில் வடிவம் இங்கு ஆட்சியை வலுப்படுத்துதல் அல்லது நிலைநிறுத்துதல் எனப் பொருள்படுகிறது.
- source_word: הַמַּמְלָכָה
  choice: ஆட்சியை
  rationale: ממלכה என்பதற்கு ‘ராஜ்யம்’ அல்லது ‘அரசாட்சி’ என்ற இரு சாத்தியங்கள் உள்ளன; மெனாகேம் தன் பிடியில் ஆட்சியை உறுதிப்படுத்தும் அரசியல் சூழலில் ‘ஆட்சி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּיָדוֹ
  choice: தன் கையில்
  rationale: கட்டுப்பாடு அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய ‘கையில்’ உருவகம் தமிழிலும் புரியக்கூடியதால் காக்கப்பட்டது.
