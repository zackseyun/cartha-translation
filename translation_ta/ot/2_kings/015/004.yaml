  source_fidelity: ரַק-இன் விதிவிலக்குத் திருப்பத்தை “ஆனால்” இயல்பாக வெளிப்படுத்துகிறது. הַבָּמוֹת “வழிபாட்டு மேடைகள்” என வரலாற்று-சமயப் பொருளோடு தரப்பட்டுள்ளது; அவை அகற்றப்படாததையும் மக்கள் அங்கே தொடர்ந்து பலியிட்டு, புகையாகக் காணிக்கைகளை எரித்ததையும் உரை துல்லியமாகக் கூறுகிறது. மְקַטְּרִים என்பதற்குரிய குறிப்பான ‘தூபம்’ மற்றும் பரந்த ‘புகையாக எரித்தல்’ ஆகிய இரு வாய்ப்புகளும் முதன்மை உரை மற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
