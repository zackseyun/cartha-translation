  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: ta
  text: ஆனால் வழிபாட்டு மேடைகள் அகற்றப்படவில்லை; மக்கள் இன்னும் அந்த மேடைகளில் பலியிட்டும் காணிக்கைகளைப் புகையாக எரித்தும்[a] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூபம் காட்டியும்.” இங்குள்ள எபிரெய வினை குறிப்பாகத் தூபம் எரிப்பதையோ, இன்னும் பொதுவாக ஒரு காணிக்கையைப் புகையாக எழும்பச் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: மன்னனைப் பற்றிய முந்தைய நல்ல மதிப்பீட்டிற்கு விதிவிலக்காக இச்செய்தியை அறிமுகப்படுத்துகிறது; நவீன தமிழில் எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: הַבָּמוֹת
  choice: வழிபாட்டு மேடைகள்
  rationale: உள்ளூர் பலியிடல் மற்றும் பிற வழிபாட்டுச் செயல்கள் நடைபெற்ற உயர்நிலை வழிபாட்டிடங்களைக் குறிக்கும் சொல்; வெறும் ‘மேடைகள்’ என்பதைக் காட்டிலும் சமயச் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: இந்த வழிபாட்டிடங்கள் நீக்கப்படாமல் தொடர்ந்து இருந்தன என்ற எபிரெய வழக்கின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: அச்செயல்கள் தொடர்ந்து நடைபெற்றதைக் குறிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மக்கள் கூட்டத்தைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: מְזַבְּחִים
  choice: பலியிட்டும்
  rationale: זבח என்பதன் பலிசெலுத்தும் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וּמְקַטְּרִים
  choice: காணிக்கைகளைப் புகையாக எரித்தும்
  rationale: குறிப்பாகத் தூபம் எரிப்பதையோ, பொதுவாக ஒரு காணிக்கையைப் புகையாக எழும்பச் செய்வதையோ குறிக்கக்கூடிய எபிரெய வினையின் பொருள் விரிவைத் தேவையின்றிக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: בַּבָּמוֹת
  choice: அந்த மேடைகளில்
  rationale: முன்னர் குறிப்பிடப்பட்ட வழிபாட்டு மேடைகளிலேயே செயல்கள் நடந்தன என்பதை இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: வழிபாட்டு மேடைகளில் நடைபெற்ற வழிபாட்டின் தன்மை
  choice: அங்குத் தொடர்ந்து பலிகளும் புகையாக எரிக்கப்படும் காணிக்கைகளும் செலுத்தப்பட்டதாக மட்டும் கூறப்படுகிறது; அவை அனைத்தும் விக்கிரக வழிபாடு என்று வசனம் கூறாததால் அப்படிச் சேர்க்கப்படவில்லை.
  alternative: அவை முற்றிலும் விக்கிரக வழிபாடாக இருந்தன என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது யெகோவாவுக்குச் செலுத்தப்பட்ட அனுமதியற்ற வழிபாடு மட்டுமே என்று குறிப்பிடுதல்.
  rationale: இவ்வசனத்தின் எபிரெய உரை வழிபாடு எந்தத் தெய்வத்தை நோக்கிச் செலுத்தப்பட்டது என்பதைத் தனியாகக் குறிப்பிடவில்லை. ஆகவே அந்த இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபாட்டு மேடைகள்’ என்பது வரலாற்றுச் சமயச் சூழலைத் தெளிவுபடுத்துகிறது; இரண்டாம் குறிப்பில் தேவையற்ற மறுபடியுரையைத் தவிர்க்க ‘அந்த மேடைகளில்’ எனச் சுருக்கப்பட்டுள்ளது.
