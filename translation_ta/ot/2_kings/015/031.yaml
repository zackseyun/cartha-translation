  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ta
  text: பேக்காவின் மற்ற செயல்களும், அவன் செய்த அனைத்தும்—இதோ, அவை இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் அரசர்களின் ஆண்டுக்குறிப்புப் புத்தகத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: דִּבְרֵי הַיָּמִים என்பது இச்சூழலில் அரசர்களின் ஆண்டுப் பதிவுகள் அல்லது வரலாற்று ஆண்டுக்குறிப்புகளைக் குறிக்கலாம்.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: பெக்காவின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது ‘மீதியானவை/மற்றவை’ என்றும், דִּבְרֵי என்பது இவ்வரசர் வரலாற்றுச் சுருக்க வழக்கில் அவரது செயல்கள் அல்லது நிகழ்வுகள் என்றும் பொருள்படுகிறது. இயல்பான நவீனத் தமிழில் இவை ‘மற்ற செயல்கள்’ என வழங்கப்பட்டுள்ளன; தொடக்க וְ இணைப்பை ‘-உம்’ தக்கவைக்கிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: כָל என்பதன் முழுமையான பரப்பையும், עָשָׂה என்பதன் எளிய செயற்பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הִנָּם
  choice: இதோ
  rationale: சுட்டிக்காட்டி வலியுறுத்தும் எபிரெய நிகழ்வுருவைத் தமிழின் இயல்பான, கண்ணியமான ‘இதோ’ தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன
  rationale: ‘எழுதப்பட்டவை’ என்ற ஆவணத் தன்மையையும், எபிரெயச் செயலெச்சத்தின் நிலைமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: עַל סֵפֶר என்பதைத் தமிழில் ஆவணத்திற்குள் எழுதப்பட்டிருப்பதைக் குறிக்கும் ‘புத்தகத்தில்’ என இயல்பாக வழங்குகிறது. דִּבְרֵי הַיָּמִים என்பது அரசர்களைப் பற்றிய காலவரிசை வரலாற்றுப் பதிவைக் குறிக்கும் என்பதால் ‘நாளாகமம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
