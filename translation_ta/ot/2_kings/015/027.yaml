  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: ta
  text: யூதாவின் அரசன் அசரியா ஆட்சி செய்த ஐம்பத்திரண்டாம் ஆண்டில், ரெமலியாவின் மகன் பெக்கா சமாரியாவில் இஸ்ரவேலுக்கு அரசனாகி, இருபது ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים וּ/שְׁתַּיִם שָׁנָה
  choice: ஆட்சி செய்த ஐம்பத்திரண்டாம் ஆண்டில்
  rationale: எபிரெய அரசாட்சி ஆண்டுக் கணக்கீட்டு மரபை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘ஆட்சி செய்த’ என்பது ஆண்டு யாருடைய ஆட்சிக்குரியது என்பதைத் தெளிவாக்குகிறது.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் அசரியா
  rationale: அரசனின் பெயர், பதவி, ஆட்சிப்பரப்பு ஆகியவற்றை எபிரெய மூலத்திற்கேற்ப நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָלַךְ
  choice: அரசனாகி
  rationale: இங்கு வினை அரச பதவியேற்பைக் குறிக்கிறது; பின்னர் வரும் ஆட்சிக்காலக் குறிப்புடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: ரெமலியாவின் மகன் பெக்கா
  rationale: எபிரெய தந்தைவழி அடையாளத்தை இயல்பான தமிழ் உடைமைத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு அரசனாகி
  rationale: עַל உடன் வரும் מלך இஸ்ரவேலின்மீது அரசாட்சி செலுத்துவதைக் குறிக்கிறது; தமிழில் ‘இஸ்ரவேலுக்கு அரசன்’ என்பது இயல்பான அரசியல் ஆட்சித் தொடர்பைத் தருகிறது.
- source_word: בְּ/שֹׁמְרֹון
  choice: சமாரியாவில்
  rationale: ஆட்சியின் தலைநகர இருப்பிடத்தைக் குறிக்கும் இடவேற்றுமையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: עֶשְׂרִים שָׁנָה
  choice: இருபது ஆண்டுகள்
  rationale: பெக்காவின் ஆட்சிக்கால அளவை நேரடியாகவும் தெளிவாகவும் தருகிறது.
