source:
  edition: WLC
  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: ta
  text: மெனகேம் இஸ்ரவேலிலுள்ள வசதிபடைத்த ஆண்கள் அனைவரிடமிருந்தும், ஆளுக்கு ஐம்பது சேக்கல் வெள்ளி வீதம், அசீரிய அரசனுக்குக் கொடுப்பதற்காகப் பணத்தை வசூலித்தான். அசீரிய அரசன் திரும்பிச் சென்றான்; அவன் அந்த நாட்டில் தங்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא ... אֶת הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: அந்தப் பணத்தை இஸ்ரவேலரிடமிருந்து ... வசூலித்து
  rationale: יָצָא என்பதன் காரணவினை வடிவம் சொற்பொருளில் ‘வெளியே கொண்டுவந்தான்’ என்றாலும், பணமும் עַל יִשְׂרָאֵל என்ற வரிவிதிப்புச் சூழலும் சேர்ந்ததால் கட்டாயமாகப் பணம் திரட்டிய பொருள் வருகிறது. ‘வசூலித்து’ என்பது இயல்பான நவீனத் தமிழில் அந்த நிதிசார் செயலைத் தெரிவிக்கிறது.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: வசதிபடைத்த ஆண்கள் அனைவரிடமிருந்தும்[a]
  rationale: גִּבּוֹרֵי הַחַיִל என்பது போர்வீரர்கள், செல்வாக்குள்ளவர்கள், அல்லது பொருள்வளம் உடையவர்கள் எனப் பொருள்படக்கூடிய சொற்றொடர். ஒவ்வொருவரிடமும் பெரிய தொகை வசூலிக்கப்பட்ட இச்சூழலில், பொருளாதார வசதி உள்ளவர்களைக் குறிக்கும் வாசிப்பு முதன்மைப்படுத்தப்பட்டது; உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: ஆளுக்கு ஐம்பது சேக்கல் வெள்ளி வீதம்
  rationale: எடை மற்றும் உலோகத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரைத் துல்லியமாகக் காக்க ‘சேக்கல் வெள்ளி’ பயன்படுத்தப்பட்டது; לְאִישׁ אֶחָד ஒவ்வொரு நபருக்கும் விதிக்கப்பட்ட தொகையைக் குறிப்பதால் ‘ஆளுக்கு ... வீதம்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுக்குக் கொடுத்தான்
  rationale: நோக்கத்தைக் குறிக்கும் ‘கொடுப்பதற்காக’ என்ற அமைப்பு தமிழில் முந்தைய வசூல் செயலோடு இணைக்கப்பட்டு, நிகழ்வுகளின் நோக்கமும் தொடர்ச்சியும் தெளிவாக இருக்க ‘வசூலித்து ... கொடுத்தான்’ என வழங்கப்பட்டது.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன் திரும்பிச் சென்றான்
  rationale: שׁוּב இங்கு அசீரிய அரசன் படையெடுப்பிடத்திலிருந்து பின்வாங்கிச் சென்றதைக் குறிக்கிறது. ‘திரும்பிச் சென்றான்’ இந்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: அவன் அந்த நாட்டில் தங்கவில்லை
  rationale: עָמַד என்பதன் அடிப்படைப் பொருள் ‘நின்றான்’ என்றாலும், இச்சூழலில் தொடர்ந்து அங்கே இருப்பதைக் குறிக்கிறது. ஆகவே ‘தங்கவில்லை’ என்பது பொருத்தமான சூழல்சார் மொழிபெயர்ப்பு.
