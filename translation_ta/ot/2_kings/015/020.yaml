revisions:
- from: மெனகேம் அந்தப் பணத்தை இஸ்ரவேலரிடமிருந்து, அதாவது வசதிபடைத்த ஆண்கள் அனைவரிடமிருந்தும்[a] ஆளுக்கு ஐம்பது சேக்கல் வெள்ளி வீதம் வசூலித்து, அசீரிய அரசனுக்குக் கொடுத்தான். அதனால் அசீரிய அரசன் திரும்பிச் சென்றான்; அவன் அந்த நாட்டில் தங்கவில்லை.
  to: மெனகேம் இஸ்ரவேலிலுள்ள வசதிபடைத்த ஆண்கள் அனைவரிடமிருந்தும், ஆளுக்கு ஐம்பது சேக்கல் வெள்ளி வீதம், அசீரிய அரசனுக்குக் கொடுப்பதற்காகப் பணத்தை வசூலித்தான். அசீரிய அரசன் திரும்பிச் சென்றான்; அவன் அந்த நாட்டில் தங்கவில்லை.
  rationale: The revision removes an unnecessary interpretive connector, preserves the Hebrew purpose infinitive, and retains the contextual financial sense of גִּבּוֹרֵי הַחַיִל with a footnote that protects its lexical ambiguity.
