  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: ta
  text: யூதாவின் அரசன் அசரியாவின் ஆட்சியின் முப்பத்தொன்பதாம் ஆண்டில், காதியின் மகன் மெனகேம் இஸ்ரவேலின்மேல் அரசனானான். அவன் சமாரியாவில் பத்து ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: ஆட்சியின் முப்பத்தொன்பதாம் ஆண்டில்
  rationale: அரசாட்சிக் காலத்தைக் கணக்கிடும் எபிரேயத் தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்ட ‘ஆட்சியின் ... ஆண்டில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் அசரியாவின்
  rationale: ל இங்கு அசரியாவின் ஆட்சியாண்டைக் குறிக்கிறது; மֶלֶךְ יְהוּדָה என்ற அரச பட்டம் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: பின்வரும் பத்து ஆண்டு ஆட்சிக்காலத்திலிருந்து வேறுபட்டு, இங்கு வினை அரசாட்சியை ஏற்ற தொடக்க நிகழ்வைக் குறிக்கிறது.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: காதியின் மகன் மெனகேம்
  rationale: בֶּן என்பது வம்ச அடையாளமாக ‘மகன்’ எனத் தரப்பட்டது; பெயர்கள் எபிரேய ஒலிப்புக்கு அருகாக எழுத்துப்பெயர்க்கப்பட்டன.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: מָלַךְ உடன் வரும் עַל, ஒரு மக்களின்மீதான அரசாட்சியைக் குறிக்கிறது.
- source_word: עֶשֶׂר שָׁנִים בְּשֹׁמְרוֹן
  choice: சமாரியாவில் பத்து ஆண்டுகள் ஆட்சி செய்தான்
  rationale: இடத்தையும் ஆட்சிக்கால அளவையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருவதற்காக, எபிரேயத்தில் உள்ளார்ந்திருக்கும் ஆட்சி வினை தமிழில் மீண்டும் வெளிப்படுத்தப்பட்டது.
