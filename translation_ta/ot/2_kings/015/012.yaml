id: 2KI.15.12
reference: 2 Kings 15:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: ta
  text: இது, யாவே யெகூவிடம், “உன் மகன்கள் நான்காம் தலைமுறைவரை இஸ்ரவேலின் அரியணையில் அமர்வார்கள்” என்று உரைத்த வார்த்தை. அவ்வாறே நடந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: இது
  rationale: முந்தைய நிகழ்வு முன்னர் உரைக்கப்பட்ட இறைவார்த்தையின் நிறைவேற்றம் என்பதைச் சுட்டும் பிரதிப்பெயராக உள்ளது.
- source_word: דְבַר יְהוָה
  choice: யாவே உரைத்த வார்த்தை
  rationale: தெய்வீக அறிவிப்பு என்ற பொருளைத் தக்கவைத்து, தமிழில் இயல்பாக இருக்க உடைமைத் தொடருக்குப் பதிலாக வினைத் தொடராக வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: யெகூவிடம் ... உரைத்த வார்த்தை
  rationale: உறவுப்பெயர் தொடரையும் மேற்கோள் அறிமுகத்தையும் தமிழின் இயல்பான வாக்கிய அமைப்பில் ஒருங்கிணைக்கிறது.
- source_word: בְּנֵי רְבִיעִים
  choice: உன் மகன்கள் நான்காம் தலைமுறைவரை
  rationale: மகன்கள் என்ற குடும்பவழிச் சொல்லைத் தக்கவைத்து, யெகூவுக்குப் பின் நான்கு தலைமுறைகள் வரையிலான வம்சத் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையில் அமர்வார்கள்
  rationale: அரியணையில் அமர்தல் என்ற அரசாட்சிப் படிமத்தை மொழிபெயர்க்கிறது; לְךָ என்பதன் வம்சத் தொடர்பு முந்தைய ‘உன் மகன்கள்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: וַיְהִי כֵן
  choice: அவ்வாறே நடந்தது
  rationale: முன்னறிவிக்கப்பட்டது அப்படியே நிறைவேறியதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: இறைவார்த்தையின் வாக்குறுதி மற்றும் வரலாற்று நிறைவேற்றம்
  choice: ‘வார்த்தை’ என்றும் ‘அவ்வாறே நடந்தது’ என்றும் வழங்குதல்
  alternative: ‘வாக்குறுதி’ என்றும் ‘அது நிறைவேறியது’ என்றும் விளக்கமாக வழங்குதல்
  rationale: மூலத்தின் சொல் மற்றும் நிறைவேற்றச் சூத்திரத்தைத் தக்கவைத்து, அதன் இறையியல் பொருளை மொழிபெயர்ப்பில் மேலதிகமாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அரச மற்றும் இறைவாக்கு சார்ந்த சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘அரியணை’, ‘உரைத்த’ ஆகியவை உயர்நடையைத் தருகின்றன; வாக்கிய அமைப்பு சுருக்கமாக வைக்கப்பட்டது.
