translation:
  language: ta
  text: அவன் தன் தந்தை உசியா[a] செய்த அனைத்தின்படியும், யாவேவின் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “உசியா.” வேறு இடங்களில் இந்த அரசன் “அசரியா” என்றும் அழைக்கப்படுகிறார்.'
    reason: ஒரே அரசனுக்குப் பயன்படும் மாற்றுப் பெயரைத் தெரிவிக்கிறது; முதன்மை உரையின் வாசிப்பை மாற்றாமல் காக்கிறது.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: வாவ்-தொடருடன் வரும் வினை கதைநடையை முன்னெடுக்கிறது; தனி வசனமாக இயல்பான தமிழில் எளிய இறந்தகாலம் போதுமானது.
- source_word: הַיָּשָׁר
