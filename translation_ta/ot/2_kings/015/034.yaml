- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: இது இறைவனின் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை தமிழில் தெளிவாகவும் நெருக்கமாகவும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த அனைத்தின்படியும்
  rationale: முன்னிருந்த முழுமையான செயல்முறைக்கு இணங்க நடந்தான் என்ற ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: עֻזִיָּהוּ
  choice: உசியா
  rationale: இவ்வசனத்தின் எபிரெய உரை עֻזִיָּהוּ என்று வாசிப்பதால், வேறு இடங்களில் வரும் அசரியா என்ற பெயருடன் அமைதியாக ஒத்திசைக்கவில்லை.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: இங்கு நேரடியான குடும்ப உறவே குறிக்கப்படுவதால் இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: עָשָׂה ... עָשָׂה
  choice: செய்த அனைத்தின்படியும் ... செய்தான்
  rationale: எபிரெயிலுள்ள வினைமீளலை தமிழில் கனமாக்காமல், தந்தையின் முந்தைய செயல்களுக்கும் மகனின் செயலுக்கும் உள்ள ஒப்புமையைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்துப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: உசியா மற்றும் அசரியா என்ற பெயர்கள்
  choice: மூல உரையிலுள்ள உசியா என்பதை முதன்மை உரையில் வைத்தல்
  alternative: அசரியா என்று ஒத்திசைத்தல்
  rationale: இவ்வசனத்தின் எபிரெய உரை உசியா என்று தெளிவாக வாசிக்கிறது; வேறு இடங்களில் காணப்படும் மாற்றுப் பெயரை அடிக்குறிப்பில் மட்டும் தெரிவிப்பது உரைச்சான்றை மதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மொழியின் இறைமதிப்பீட்டு உருவகமான ‘பார்வையில்’ என்பதையும், ‘அனைத்தின்படியும்’ என்ற முழுமை வலியுறுத்தலையும் காக்கிறது. அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட ‘உசியா’ என்ற பெயரிலேயே வைக்கப்பட்டுள்ளது.
