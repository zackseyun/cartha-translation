lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: அரசரின் ஆட்சியைச் சுருக்கிக் கூறும் இவ்வழக்கில் יֶתֶר என்பது எஞ்சியவற்றையும், דִּבְרֵי என்பது பேச்சுகளை மட்டும் அல்லாமல் செயல்கள் அல்லது நிகழ்வுகளையும் குறிக்கிறது.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற பரவலான வடிவம்.
- source_word: הִנָּם
  choice: இதோ, அவை அங்கே உள்ளன
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லையும், பன்மைச் சுட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: எபிரெய மொழியின் செயப்பாட்டு வினையெச்சப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொல்லுக்கு சொல் 'சுருளின்மேல்' எனலாம்; ஆவணக் குறிப்பில் 'புத்தகத்தில்' என்பது இயல்பான தமிழ்.
- source_word: דִּבְרֵי הַיָּמִים
  choice: நாளாகமம்
  rationale: அரசர்கால நிகழ்வுப் பதிவைக் குறிக்கும் தலைப்புவழக்கைச் சுருக்கமாகவும் மரபாகவும் தருகிறது.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: ஆவணத்தின் தலைப்பில் உள்ள உறவைக் காட்டும் לְ என்பதற்கு இயல்பான தமிழ் உரிமைத் தொடர்.
