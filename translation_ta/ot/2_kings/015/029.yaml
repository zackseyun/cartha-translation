  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் பெக்காவின் நாட்களில், அசீரியாவின் அரசன் திக்லத்-பிலேசர் வந்து, ஈயோன், ஆபேல்-பெத்-மாக்கா, யானோவா, கேதேஸ், ஹாத்சோர், கிலேயாத், கலிலேயா ஆகிய இடங்களையும்—நப்தலியின் நாடு முழுவதையும்—கைப்பற்றினான். அவர்களை அசீரியாவுக்கு நாடுகடத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அசீரியாவுக்குப் புலம்பெயரச் செய்தான்.”
    reason: וַיַּגְלֵם என்பதற்கு நாடுகடத்துதல் அல்லது புலம்பெயரச் செய்தல் என்ற பொருள் உண்டு; மூலத்தில் உள்ள சுட்டுப்பெயரான ‘அவர்களை’ அப்படியே பாதுகாக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: வரலாற்றுக் காலச்சூழலை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בָּא
  choice: வந்து
  rationale: வினைச்சொல்லின் நேரடிப் பொருளான ‘வந்தான்’ என்பதைக் காக்கிறது; அடுத்த வினை இராணுவத் தாக்குதலைத் தெளிவுபடுத்துகிறது.
- source_word: וַיִּקַּח
  choice: கைப்பற்றினான்
  rationale: நகரங்களும் பிரதேசங்களும் பட்டியலிடப்படும் இராணுவச் சூழலில் ‘எடுத்தான்’ என்பதைவிட ‘கைப்பற்றினான்’ தெளிவான நவீனத் தமிழ்.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: நப்தலியின் நாடு முழுவதையும்
  rationale: முன் பட்டியலிடப்பட்ட இடங்களைச் சுருக்கிக் குறிப்பிடும் இணைப்புரைத் தன்மையையும் אֶרֶץ என்பதன் ‘நாடு/நிலம்’ பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּגְלֵם
  choice: அங்கிருந்த மக்களை ... நாடுகடத்தினான்
  rationale: הגלה என்பதன் causative வடிவம் மக்களைத் தங்கள் நாட்டிலிருந்து அகற்றி வேறு நாட்டுக்குக் கொண்டுசெல்வதைக் குறிக்கிறது. எபிரெய உரையின் ‘அவர்களை’ என்பதில் குறிக்கப்படுவது கைப்பற்றப்பட்ட இடங்களின் குடிமக்கள் என்பதால், தமிழில் பொருள் தெளிவாக இருக்க ‘அங்கிருந்த மக்களை’ என வழங்கப்பட்டுள்ளது.
- source_word: אַשּׁוּרָה
  choice: அசீரியாவுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைநோக்குச் சுட்டை தமிழின் இலக்கு வேற்றுமையான ‘-க்கு’ மூலம் நேரடியாகக் காட்டுகிறது.
