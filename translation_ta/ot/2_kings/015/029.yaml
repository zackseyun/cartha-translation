translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் அமைக்கப்பட்டது. இடப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இடைச்செருகல் நீள்கோடுகளால் குறிக்கப்பட்டது.
