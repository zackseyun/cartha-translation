  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இடப்பெயர்ப் பட்டியல் மற்றும் இடைச்செருகல் இயல்பாக வாசிக்கப்படுகின்றன. ‘அவர்களை அசீரியாவுக்கு நாடுகடத்தினான்’ என்பது சூழலில் இயல்பாகப் புரியும்; தேவையற்ற விளக்கச் சேர்க்கையையும் தவிர்க்கிறது.
  terminology: ‘கைப்பற்றினான்’ வַיִּקַּח என்பதற்கான சூழலுக்கேற்ற தேர்வு. ‘நாடுகடத்தினான்’ הגלה என்பதன் பொருளைச் சரியாகக் காட்டுகிறது. மாற்று அடிக்குறிப்பில் ‘சிறைபிடித்துக் கொண்டுபோனான்’ என்பதற்குப் பதிலாக ‘நாடுகடத்தினான்/புலம்பெயரச் செய்தான்’ போன்ற அகற்றல்-நாடுகடத்தல் பொருளைத் தக்கவைக்கும் மாற்றே பொருத்தமானது.
