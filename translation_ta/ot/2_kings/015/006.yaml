translation_notes:
  register: நவீனத் தரத் தமிழில், அரச ஆட்சிச் சுருக்கத்திற்கேற்ற கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத கால அல்லது உரையாடல் தொடக்கச் சொல்லைச் சேர்க்கவில்லை; எபிரெய மொழியின் வினாவடிவம் ‘அல்லவா?’ எனப் பாதுகாக்கப்பட்டுள்ளது.
