base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: அசரியாவின் செயல்களில் மீதமுள்ளவையும், அவன் செய்த அனைத்தும், யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன[a] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எழுதப்பட்டிருக்கின்றன’ என்பதற்குப் பதிலாக ‘பதிவுசெய்யப்பட்டிருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம்; மூலத்துக்கு நெருக்கமான சொல்லாட்சி முதன்மைப் பிரதியில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘யூதா அரசர்களின் நாளாகமப் புத்தகம்’ என்பது அரசர்களின் வரலாற்றில் தொடர்ந்து மேற்கோள் காட்டப்படும் ஓர் அரசவைப் பதிவு அல்லது ஆண்டுவாரியான வரலாற்று ஆவணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: அரசரின் ஆட்சிக்காலச் சுருக்கங்களில், இங்கு விவரிக்கப்படாமல் மீதமுள்ள அவரது செயல்களையும் நிகழ்வுகளையும் குறிக்கும் வழக்குச் சொற்றொடர்; வெறும் பேச்சைக் குறிக்கும் ‘வார்த்தைகள்’ என்பதைவிட ‘செயல்கள்’ சூழலுக்கு ஏற்றது.
- source_word: עֲזַרְיָהוּ
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் இயல்பான ஒலிபெயர்ப்பு.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: மூலத்தின் விரிவான பொருளையும் அரசர் செய்த எல்லாவற்றையும் குறிக்கும் சார்புத்தொடரையும் நேராகப் பாதுகாக்கிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஆதார நூலைச் சுட்டும் எபிரெய வினாவடிவத்தின் சொல்லாட்சியையும் எதிர்பார்க்கப்படும் உறுதிப்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன
  rationale: כְּתוּבִים என்பதன் நேரடியான ‘எழுதப்பட்ட’ பொருளைத் தக்கவைக்கிறது; ‘பதிவுசெய்யப்பட்டிருக்கின்றன’ என்பதும் சூழலுக்கேற்ற மாற்று.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: எழுத்துப்பதிவு இடம்பெறும் ஆவணத்தைக் குறிக்கும் தமிழின் இயல்பான இடவெற்றுமை வடிவம்; சுருள் என்ற பொருள் சாத்தியமானாலும், இங்கு ‘புத்தகம்’ தெளிவாகவும் மரபாகவும் உள்ளது.
- source_word: דִּבְרֵי הַיָּמִים
  choice: நாளாகமம்
  rationale: அரச ஆட்சியின் நிகழ்வுகளை காலவரிசையாகப் பதிவு செய்த ஆவணத்தைக் குறிக்கும் நிறுவப்பட்ட தமிழ் சொல்.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின்
  rationale: ஆதார ஆவணத்தின் தலைப்பில் உள்ள לְ உறவை உடைமைத் தொடர்பாக இயல்பாக வெளிப்படுத்துகிறது.
