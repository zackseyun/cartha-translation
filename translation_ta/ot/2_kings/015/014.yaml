translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதையாடலுக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாவ்-தொடர் ஒவ்வொன்றையும் இயந்திரமாக ‘மேலும்’ என்று வழங்காமல், தமிழ் நிகழ்வுத் தொடருக்கு ஏற்ற வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
