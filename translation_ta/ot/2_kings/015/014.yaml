base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: ta
  text: அப்போது காதியின் மகன் மெனகேம் திர்சாவிலிருந்து மேலே சென்று சமாரியாவுக்கு வந்தான். சமாரியாவில் யாபேசின் மகன் சல்லூமைத் தாக்கி அவனைக் கொன்றான்; அவனுக்குப் பதிலாக ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: புறப்பட்டு
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்.’ ஆனால் தமிழில் திர்சாவிலிருந்து சமாரியாவுக்கு நகர்வதை இயல்பாகச் சொல்ல ‘புறப்பட்டு’ என வழங்கப்பட்டது; இராணுவ அணிவகுப்பு என்ற கருத்து தேவையின்றி சேர்க்கப்படவில்லை.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: காதியின் மகன் மெனகேம்
  rationale: எபிரெய தனிப்பெயர்கள் நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டு, தந்தை வழி அடையாளம் தக்கவைக்கப்பட்டது.
- source_word: מִתִּרְצָה
  choice: திர்சாவிலிருந்து
  rationale: מן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; அதனால் ‘-இலிருந்து’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: சமாரியாவுக்கு வந்தான்
  rationale: בוא இடப்பெயருடன் ‘வருதல்/சென்றடைதல்’ எனப் பொருள்படும்; ‘சமாரியாவுக்கு வந்தான்’ இயல்பான தமிழாக உள்ளது.
- source_word: וַיַּךְ אֶת ... וַיְמִיתֵהוּ
  choice: தாக்கிக் கொன்றுவிட்டு
  rationale: נכה என்பதன் வன்முறைத் தாக்குதலும், מות என்பதன் ஹிபில் வடிவிலுள்ள மரணத்தை ஏற்படுத்துதலும் ஒரே இயல்பான தமிழ் தொடரில் வெளிப்படுத்தப்பட்டுள்ளன; இரண்டு செயல்களின் தொடர்பும் தெளிவாக உள்ளது.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: யாபேசின் மகன் சல்லூம்
  rationale: பெயர்கள் எபிரெய ஒலிக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை வழி அடையாளம் தக்கவைக்கப்பட்டது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இடத்தைக் குறிப்பதால் ‘சமாரியாவில்’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் மீண்டும் வரும் இடப்பெயரும் தக்கவைக்கப்பட்டது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அரசனானான்
  rationale: מלך என்பது ‘அரசாளுதல்/அரசனாதல்’ என்றும் תחתיו என்பது முந்தைய அரசனுக்குப் பதிலான வாரிசுரிமையையும் குறிக்கிறது. இச்சூழலில் ‘அரசனானான்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
