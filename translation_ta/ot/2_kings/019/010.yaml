source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: ta
  text: '“யூதாவின் அரசனான எசேக்கியாவிடம் நீங்கள் இவ்வாறு சொல்லுங்கள்: ‘நீ நம்பிக்கை வைத்திருக்கும் உன் கடவுள்[a], “எருசலேம் அசீரியாவின் அரசனின் கையில் ஒப்புக்கொடுக்கப்படாது” என்று சொல்லி உன்னை ஏமாற்ற விடாதே.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் தெய்வம்.” எபிரேயத்தில் பெரிய/சிறிய எழுத்து வேறுபாடு குறிக்கப்படுவதில்லை; அசீரியப் பேச்சாளர் எசேக்கியாவின் நம்பிக்கையை இகழ்ந்து பேசுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: நீங்கள் இவ்வாறு சொல்லுங்கள்
  rationale: כֹּה என்பதன் சுட்டும் தன்மையையும், அறிவுறுத்தலாகப் பயன்படுத்தப்பட்ட இரண்டாம் நபர் பன்மை வினையின் கட்டளை வலிமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான எசேக்கியா
  rationale: பெயருக்குப் பின்னுள்ள அரச பட்டத்தைத் தமிழின் இயல்பான அடைமொழித் தொடராக வழங்குகிறது.
- source_word: אַל יַשִּׁאֲךָ
  choice: உன்னை ஏமாற்ற விடாதே
  rationale: נשׁא என்பதன் இச்சூழலுக்குரிய ‘ஏமாற்று, தவறாக நம்பச்செய்’ என்ற பொருளையும், אַל குறிக்கும் தடையையும் நேரடியாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இது எசேக்கியா நம்பும் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; அதேவேளை எதிரியின் இகழ்ச்சியான பேச்சுத் தொனியைத் தமிழில் செயற்கையாக உயர்த்தாமல் ‘கடவுள்’ என்று வழங்குகிறது.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: நீ நம்பிக்கை வைத்திருக்கிற
  rationale: בָּטַח בְּ என்பதன் ஒருவர்மீது சார்ந்து நம்பிக்கை வைப்பது என்ற பொருளை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: கூறப்படும் வார்த்தைகளே ஏமாற்றத்தின் வழியாகக் காட்டப்படுவதைக் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: לֹא תִנָּתֵן
  choice: ஒப்புக்கொடுக்கப்படாது
  rationale: נתן என்பதன் நிஃபால் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, ஒரு நகரம் எதிரியின் அதிகாரத்துக்குள் ஒப்படைக்கப்படுதல் என்ற போர்ச் சூழலை இயல்பாகத் தருகிறது.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அது அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் வருவதைத் தமிழிலும் புரியத்தக்கவாறு உணர்த்துகிறது.
theological_decisions:
- issue: அசீரிய அரசனின் வாயில் אֱלֹהֶיךָ என்பதன் வழங்கல்
  choice: உன் கடவுள்
  alternative: உன் தெய்வம்
  rationale: எபிரெய எழுத்தில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லை. குறிப்பிடப்படுபவர் எசேக்கியா நம்பும் கடவுள் என்பதால் முதன்மை உரையில் ‘கடவுள்’ வைக்கப்படுகிறது; எதிரி இகழ்ச்சியோடு பொதுத் தெய்வமாகக் கூறியிருக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசத் தூதுச் செய்திக்கேற்ற கண்ணியமான நேரடித் தொனி பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ’ மற்றும் பன்மை ‘நீங்கள்’ என்ற மூலமொழி வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; ‘கையில்’ என்ற எபிரெய உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
