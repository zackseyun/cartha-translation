source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: ta
  text: 'அவனைக் குறித்து யாவே உரைத்த வார்த்தை இதுதான்:


    “கன்னிமகளாகிய சீயோன் உன்னை இகழ்கிறாள்[a];

    உன்னை ஏளனம் செய்கிறாள்.

    எருசலேம் மகள் உன் பின்னால் தலையை அசைக்கிறாள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீயோனின் கன்னிமகள் உன்னை இகழ்கிறாள்.”
    reason: எபிரேயக் கவித்துவப் பெயரமைப்பை தமிழில் இரு இயல்பான முறைகளில் புரிந்துகொள்ளலாம்.
  - marker: b
    text: “தலையை அசைப்பது” இங்கு இகழ்ச்சி அல்லது கேலியை வெளிப்படுத்தும் சைகை.
    reason: பண்டைய உடல் சைகையின் சூழல்சார் பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் சூத்திரத்தில் דָּבָר என்பது கடவுள் உரைத்த ‘வார்த்தை’ அல்லது அறிவிப்பைக் குறிக்கிறது; ‘வார்த்தை’ மூலத்தின் வடிவத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: அவனைக் குறித்து யாவே உரைத்த
  rationale: עָלָיו இங்கு தீர்க்கவுரையின் பொருளாகிய நபரைச் சுட்டுவதால் ‘அவனைக் குறித்து’ என்று மொழிபெயர்க்கப்பட்டது; சூழல் கண்டனமானதாக இருந்தாலும் ‘அவனுக்கு எதிராக’ என்று பொருளை மிகுதியாகத் தீர்மானிக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கும் பரவலான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בָּזָה
  choice: இகழ்கிறாள்
  rationale: בזה என்பது ஒருவரை மதிப்பற்றவராகக் கருதி அவமதிப்பதைக் குறிக்கிறது; ‘இகழ்கிறாள்’ இங்கு வலுவானதும் இயல்பானதும் ஆகும்.
- source_word: לָעֲגָה
  choice: ஏளனம் செய்கிறாள்
  rationale: לעג என்பதன் கேலி அல்லது பரிகாசம் செய்யும் பொருளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: கன்னிமகளாகிய சீயோன்
  rationale: சீயோன் நகரத்தை ஒரு கன்னிமகளாக உருவகப்படுத்தும் கவித்துவப் பெயரைப் பாதுகாக்கிறது; சொற்சொல்லான ‘சீயோனின் கன்னிமகள்’ என்ற புரிதலும் சாத்தியம்.
- source_word: אַחֲרֶיךָ
  choice: உன் பின்னால்
  rationale: எதிரி திரும்பிச் செல்லும் பின்னால் அவனை ஏளனம் செய்யும் காட்சியை இடவியல் ரீதியாக நேரடியாகக் காட்டுகிறது.
- source_word: רֹאשׁ הֵנִיעָה
  choice: தலையை அசைக்கிறாள்
  rationale: எபிரேயச் சொற்றொடரின் உடல் அசைவை நேரடியாகக் காக்கிறது; இச்சூழலில் அது இகழ்ச்சி அல்லது கேலிக்கான சைகை.
- source_word: בַּת יְרוּשָׁלִָם
  choice: எருசலேம் மகள்
  rationale: நகரத்தைப் பெண்ணாக உருவகப்படுத்தும் கவித்துவச் சொல்லாட்சியையும் சீயோன் பற்றிய முந்தைய வரியுடனான இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: சியோனின் ‘கன்னிமகள்’ உருவகம்
  choice: கன்னிமகளாகிய சீயோன்
  alternative: சீயோனின் கன்னிமகள்
  rationale: இது நகரத்தை உருவகப்படுத்தும் கவித்துவப் பட்டம். ‘கன்னி’ என்ற கூறை மென்மைப்படுத்தவோ அதற்கு மேலதிக கோட்பாட்டுப் பொருள் சேர்க்கவோ செய்யாமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், உரத்த தீர்க்கதரிசனக் கவிதைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. இணைவரிகள் தனித்தனியாக வைக்கப்பட்டு எபிரேயக் கவிதையின் ஒத்திசைவு பாதுகாக்கப்பட்டது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டன.
