base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: ta
  text: 'எனவே, அசீரிய அரசனைப் பற்றி யாவே இவ்வாறு கூறுகிறார்: “அவன் இந்த நகரத்திற்குள் வரமாட்டான்; அங்கே ஓர் அம்பையும் எய்யமாட்டான்; கேடயத்துடன் அதை நோக்கி முன்னேறமாட்டான்[a]; அதற்கு எதிராக முற்றுகை மேட்டையும் எழுப்பமாட்டான்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேடயத்துடன் அதற்கு முன்பாக வரமாட்டான்.” எபிரெயச் சொற்றொடர், முற்றுகைப் போரில் கேடயத்தின் பாதுகாப்புடன் நகரை அணுகுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்கு எதிராக முற்றுகைச் சரிவுப்பாதையைக் குவித்து அமைக்கமாட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: எனவே
  rationale: முந்தைய இறைவாக்கிலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுரையின் வழக்கமான சூத்திரத்தை நிகழ்கால நடையில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைப்பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனைக்குறித்து
  rationale: இங்கு אֶל என்பது அரசனிடம் நேரடியாக உரையாடுவதைவிட அவனைப் பற்றிய இறைவாக்கின் பொருளை அறிமுகப்படுத்துகிறது.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: அவன் இந்த நகரத்திற்குள் வரமாட்டான்
  rationale: வருங்கால மறுப்பையும் நகரத்தினுள் நுழையும் இயக்கத்தையும் தெளிவாகத் தருகிறது.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: இங்கே ஓர் அம்பையும் எய்யமாட்டான்
  rationale: ירה என்பதன் இராணுவச் சூழலிலான ‘அம்பு எய்தல்’ என்ற பொருளை இயல்பாக வழங்குகிறது; மறுப்பின் முழுமையைத் தமிழில் ‘ஓர் ... -யும்’ காட்டுகிறது.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: கேடயத்துடன் அதை நோக்கி முன்னேறமாட்டான்
  rationale: קדמ என்பதிலுள்ள எதிர்நோக்கிச் செல்லுதல் அல்லது முன்னே வருதல் என்ற படிமத்தையும் முற்றுகைப் போர்ச் சூழலையும் பாதுகாக்கிறது; குறிப்பிட்ட தாக்குதல் முறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: அதற்கு எதிராக முற்றுகை மேட்டையும் எழுப்பமாட்டான்
  rationale: சொல்லுக்கு சொல் ‘ஊற்றுதல்’ என்பதற்குப் பதிலாக, நகருக்கு எதிராக மண்ணைக் குவித்து முற்றுகைப் பணி அமைப்பதைக் குறிக்கும் நிலையான இராணுவப் பொருளை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: סֹלְלָה
  choice: முற்றுகை மேடு
  rationale: நகரைத் தாக்க மண்ணைக் குவித்து உருவாக்கப்படும் முற்றுகைக் கட்டமைப்பைக் குறிக்கும் எளிய, புரியத்தக்க தமிழ்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் பொதுப்பட்டப் பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது; அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: அசீரிய அரசன் நகரை எட்ட முடியாது என்ற இறைவாக்கின் உறுதி
  choice: வரமாட்டான் / எய்யமாட்டான் / முன்னேறமாட்டான் / எழுப்பமாட்டான்
  alternative: வரக்கூடாது போன்ற கட்டளை வடிவம்
  rationale: எபிரெய வினை வடிவங்கள் இங்கு கட்டளைகளாக அல்ல, நிகழாதவற்றைப் பற்றிய உறுதியான முன்னறிவிப்பாகச் செயல்படுகின்றன.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் உறுதியைத் தொடர்ச்சியான எதிர்கால மறுப்பு வினைகளால் காத்துள்ளோம். இராணுவத் தொழில்நுட்பச் சொற்களின் உண்மையான பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
