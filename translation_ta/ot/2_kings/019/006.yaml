base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: ta
  text: 'ஏசாயா அவர்களிடம், “உங்கள் எஜமானிடம் இவ்வாறு சொல்லுங்கள்: ‘யாவே இவ்வாறு கூறுகிறார்: அசீரியா அரசனின் பணியாளர்கள்[a] என்னைத் தூஷித்து பேசிய வார்த்தைகளினால் அஞ்சாதே’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசீரியா அரசனின் இளைஞர்கள்.” எபிரெயச் சொல் இளைஞர்களைக் குறிக்கலாம்; ஆனால் இங்கு அது அரச பணியாளர்கள், உதவியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான இறந்தகால வினையை இயல்பான தமிழ் உரையாடல் அமைப்பில் தருகிறது.
- source_word: אֲדֹנֵיכֶם
  choice: உங்கள் எஜமானிடம்
  rationale: இங்கு எசேக்கியாவைத் தூதர்களின் அதிகாரியாகக் குறிக்கிறது; தெய்வீகப் பட்டத்துடன் குழப்பாமல் சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைத் திருப்பெயரைப் பெயராகவே பாதுகாக்கிறது.
- source_word: אַל־תִּירָא
  choice: அஞ்சாதே
  rationale: தெய்வீக உறுதியளிப்பைக் குறிக்கும் எதிர்மறை கட்டளையின் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: வார்த்தைகளைக் குறித்து
  rationale: מִפְּנֵי இங்கு அச்சத்திற்கான காரணத்தைக் குறிக்கிறது; דְּבָרִים சூழலில் பேசப்பட்ட இகழ்ச்சிச் சொற்களாகும்.
- source_word: שָׁמַעְתָּ
  choice: நீ கேட்ட
  rationale: முடிந்த செயலைத் தெளிவாகக் காட்டி, அதன் தற்போதைய தாக்கத்தைச் சூழல் வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: גִּדְּפוּ
  choice: தூஷித்தார்கள்
  rationale: இறைவனுக்கு எதிரான இழிவான பேச்சின் தீவிரத்தைக் காக்கிறது; சாதாரண கேலியாக மெலிதாக்கவில்லை.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனின் பணியாளர்கள்
  rationale: נַעַר இளைஞர்களைக் குறிக்கக்கூடும்; ஆனால் அரசவைக் சூழலில் பணியாளர்கள், உதவியாளர்கள் அல்லது அதிகாரப்பூர்வ பிரதிநிதிகளைக் குறிக்கிறது. முதன்மை உரை அவர்களின் இங்குள்ள பணியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתִי
  choice: என்னை
  rationale: இழிவு யாவேக்கு நேரடியாகச் செய்யப்பட்ட தனிப்பட்ட அவமதிப்பு என்பதை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கெழுத்து இறைத் திருப்பெயர் உள்ளது; ஆகவே அதைத் திருப்பெயராகவே தருகிறது.
- issue: גִּדְּפוּ என்பதன் இறையியல் வலிமை
  choice: தூஷித்தார்கள்
  alternative: பழித்தார்கள்
  rationale: செயலின் பொருள் இறைவனே என்பதால், வெறும் மனித அவமதிப்பைக் காட்டிலும் இறைவனுக்கு எதிரான இழிவுரையின் தீவிரத்தை ‘தூஷித்தார்கள்’ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் ‘இப்படிச் சொல்லுங்கள் / யாவே கூறுவது இதுவே’ என்ற மீளுருவாக்கம் மூலத்தின் அதிகாரப்பூர்வத் தன்மையைப் பாதுகாக்கிறது. ஒருமை மற்றும் பன்மை முகவரிகள் மூலத்தின்படி வேறுபடுத்தப்பட்டுள்ளன.
