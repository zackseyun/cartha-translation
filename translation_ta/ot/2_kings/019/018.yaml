  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: ta
  text: அவர்கள் தங்கள் தெய்வங்களை நெருப்பில் போட்டார்கள்[a]; ஏனெனில், அவை தெய்வங்கள் அல்ல, மனிதக் கைகளால் செய்யப்பட்டவை—மரமும் கல்லும் மட்டுமே; ஆகவே அவர்கள் அவற்றை அழித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் தெய்வங்களை நெருப்பில் வைத்தார்கள்.” எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “கொடுத்தார்கள்/வைத்தார்கள்”; இங்கு அது நெருப்பில் போடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: போட்டார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்பதாக இருந்தாலும், ‘நெருப்பில்’ என்பதுடன் இங்கு எரிப்பதற்காக இடுவதைக் குறிக்கிறது. ‘போட்டார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் அழிவின் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்களை
  rationale: மூலத்தில் இருப்பது ‘அவர்களுடைய தெய்வங்கள்’ என்பதே. அடுத்த கூறு அவை உண்மையில் தெய்வங்கள் அல்ல என்று மறுப்பதால், ‘சிலைகள்’ என்று முன்கூட்டியே விளக்காமல் மூலத்தின் சொல்லாட்சியும் வாத வலிமையும் காக்கப்பட்டன.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: தமிழில் ‘நெருப்பில் போட்டார்கள்’ என்பது இலக்கைச் சுட்டும் இயல்பான சொல்லிணைவு; தனியான ‘உள்ளே’ தேவையில்லை.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: ஏனெனில், அவை தெய்வங்கள் அல்ல
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. உயிரற்ற பொருட்களைச் சுட்டுவதால் தமிழில் ‘அவை’ பயன்படுத்தப்பட்டு, அவற்றின் உண்மையான தெய்வத்தன்மை நேரடியாக மறுக்கப்படுகிறது.
- source_word: כִּי אִם מַעֲשֵׂה יְדֵי אָדָם
  choice: மனிதக் கைகளால் செய்யப்பட்ட
  rationale: ‘மனிதக் கைகளின் வேலை’ என்ற எண்ணத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. אָדָם இங்கு ஓர் ஆணை மட்டும் அல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது.
- source_word: עֵץ וָאֶבֶן
  choice: மரமும் கல்லுமே
  rationale: சிலைகளின் பொருட்களை நேரடியாகக் குறிப்பிடுகிறது; ‘-மே’ உண்மையில் அவை இவை மட்டுமே என்ற மறுப்புக்குப் பிந்தைய வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: וַיְאַבְּדוּם
  choice: ஆகவே அவர்கள் அவற்றை அழித்தார்கள்
  rationale: வினைச்சொல் இங்கு பன்மை எழுவாயும் பன்மை செயப்படுபொருளும் கொண்ட செயப்படுவினையாகப் புரிந்துகொள்ளப்படுகிறது. முந்தைய காரணத்திலிருந்து வரும் முடிவை ‘ஆகவே’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: மனிதக் கைகளால்
  alternative: மனுஷனுடைய கைகளால்
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆண் அல்ல, மனிதர்கள் செய்த பொருட்களே குறிக்கப்படுகின்றன. ‘மனிதக் கைகளால்’ என்பது பாலினத்தைக் குறுக்காமல் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- issue: אֱלֹהֵיהֶם என்பதைக் குறிப்பிடுதல்
  choice: அவர்களுடைய தெய்வங்கள்
  alternative: அவர்களுடைய சிலைகள்
  rationale: மூலவாக்கியம் முதலில் பிறநாடுகள் அவற்றை அழைத்த விதத்தைச் சொல்லி, பின்னர் அவை தெய்வங்கள் அல்ல என்று மறுக்கிறது. ‘தெய்வங்கள்’ இந்த இறையியல் எதிர்மறை வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘போட்டார்கள்’ இயல்பானதாக இருந்தாலும் பேச்சுவழக்காகத் தாழாமல் இச்சூழலில் தெளிவாக உள்ளது; வாக்கியங்கள் காரணம், எதிர்மறை, விளைவு ஆகியவற்றைத் தெளிவாகப் பிரிக்கின்றன.
