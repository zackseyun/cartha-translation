source:
  edition: WLC
  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: ta
  text: நானே தோண்டி, வேற்று நாட்டு நீரைக் குடித்தேன்; என் உள்ளங்கால்களால் எகிப்தின் நீரோடைகள்[a] அனைத்தையும் வற்றச் செய்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தின் எல்லாக் கால்வாய்களையும்/நைல் நதியின் கிளைநீரோடைகளையும்.” எபிரெயச் சொல் குறிப்பாக நைல் நதியோடு தொடர்புடைய நீர்வழிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: நானே
  rationale: வினைச்சொல்லிலேயே எழுவாய் அடங்கியிருந்தும் தனியாக வரும் பிரதிப்பெயர் வலியுறுத்தலைக் காட்டுகிறது; அரசனின் தற்பெருமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: קַרְתִּי
  choice: தோண்டி
  rationale: இங்கு நீராதாரத்தைத் தோண்டிய செயலைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘கிணறு’ என்பதைச் சேர்க்காமல் செறிவான கூற்றைப் பாதுகாக்கிறது.
- source_word: מַיִם זָרִים
  choice: வேற்று நாட்டு நீர்
  rationale: זָרִים என்பதன் ‘அந்நியமான/வேற்றிடத்துக்குரிய’ பொருளையும், பிற நாடுகளை வென்றதாகப் பெருமை பேசும் சூழலையும் தெளிவாகத் தருகிறது.
- source_word: וְאַחְרִב
  choice: வற்றச் செய்கிறேன்
  rationale: חרב என்பதன் ஹிஃபில் வடிவம் நீர்நிலைகளை ‘வறளச் செய்தல்/வற்றச் செய்தல்’ என்பதைக் குறிக்கிறது. கால வடிவம் சூழலில் கடந்த செயல், தற்போதைய பெருமைக் கூற்று, அல்லது நோக்கமுள்ள எதிர்காலம் எனப் புரியக்கூடியதால், தமிழில் உயிரோட்டமுள்ள தற்போதைய பெருமைக் கூற்றாக வழங்கப்பட்டுள்ளது.
- source_word: בְּכַף פְּעָמַי
  choice: என் உள்ளங்கால்களால்
  rationale: כַּף என்பது காலோடு வரும்போது அதன் அடிப்பகுதியான உள்ளங்காலைக் குறிக்கிறது; எளிதாக மிதித்தே ஆதிக்கம் செலுத்தும் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יְאֹרֵי
  choice: நீரோடைகள்
  rationale: இந்தச் சொல் பொதுவாக நீரோடைகளையும், குறிப்பாக நைல் சார்ந்த கால்வாய்களையும் குறிக்கலாம். முதன்மை உரையில் வாசிக்க இயல்பான பொதுச் சொல்லும், அடிக்குறிப்பில் குறிப்பான பொருளும் தரப்பட்டுள்ளன.
- source_word: מָצוֹר
  choice: எகிப்து
  rationale: יְאֹרֵי என்பதோடு சேர்ந்துள்ள இவ்விடத்தில் மָצוֹר என்பது எகிப்துக்கான கவிதைநடைப் பெயராகப் புரிந்துகொள்ளப்படுகிறது; புவியியல் சுட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: முதலாம் நபர் கூற்றின் பேச்சாளரும் அதன் சொல்லாட்சியும்
  choice: அசீரிய அரசனின் தற்பெருமையான அரசக் கூற்றை விளக்கவுரை சேர்க்காமல் நேரடியாகத் தக்கவைத்தல்
  alternative: இது வெறும் மிகைப்படுத்தப்பட்ட இராணுவப் பிரசாரம் என்று உரையிலேயே விளக்குதல் அல்லது பேச்சாளர் அசீரிய அரசன் எனச் சேர்த்துக் கூறுதல்
  rationale: சூழல் பேச்சாளரை அடையாளப்படுத்துகிறது. மொழிபெயர்ப்பில் அவரது அகந்தையான பெருமையையும் மிகைப்படுத்தப்பட்ட உருவகத்தையும் மென்மைப்படுத்தாமலும், அதைப் பற்றிய இறையியல் மதிப்பீட்டை வசனத்துக்குள் சேர்க்காமலும் பாதுகாக்க வேண்டும்.
- issue: וְאַחְרִב என்பதன் காலச் சாயல்
  choice: ‘வற்றச் செய்கிறேன்’ என நிகழ்காலப் பெருமைக் கூற்றாக வழங்குதல்
  alternative: ‘வற்றச் செய்தேன்’ அல்லது ‘வற்றச் செய்வேன்’
  rationale: எபிரெய வடிவமும் உரையாடல் சூழலும் காலச் சாயலில் ஓரளவு திறந்த நிலையில் உள்ளன. தற்போதைய வடிவம் அரசனின் பொதுவான ஆற்றல் உரிமைகோரலை இயல்பாகத் தருகிறது; மாற்று கால வாசிப்புகளைத் தவறென்று அறிவிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், செறிவும் கண்ணியமும் கொண்ட அரசப் பெருமைக் கூற்றாக வடிவமைக்கப்பட்டுள்ளது. ‘நானே’ என்ற வலியுறுத்தலும் ‘உள்ளங்கால்களால்’ என்ற தெளிவான உருவகமும் பாதுகாக்கப்பட்டுள்ளன; பொதுவாசிப்புக்கு ஏற்ற ‘நீரோடைகள்’ முதன்மை உரையில் வைக்கப்பட்டு, நைல் சார்ந்த குறிப்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
