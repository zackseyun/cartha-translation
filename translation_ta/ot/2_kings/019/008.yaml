base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: ta
  text: ரப்சாக்கே திரும்பி வந்து, அசீரிய அரசன் லிப்னாவுக்கு எதிராகப் போரிட்டுக்கொண்டிருந்ததைக் கண்டான். ஏனெனில், அரசன் லாகீசிலிருந்து புறப்பட்டிருந்தான்[a] என்று ரப்சாக்கே கேள்விப்பட்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லாகீசிலிருந்து முகாமைக் கலைத்துப் புறப்பட்டிருந்தான்.” இங்குள்ள எபிரெய வினைச்சொல் புறப்படுதல், பயணம் தொடங்குதல், அல்லது இராணுவச் சூழலில் முகாமைக் கலைத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוּב இங்கு முன்பிருந்த இடத்திற்கோ நபரிடமோ திரும்பிச் செல்வதைக் குறிக்கிறது; தொடர்கதை நகர்வையும் இயல்பான தமிழையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது அசீரியப் பதவிப்பெயராக இருந்தாலும், இக்கதையில் பெயரைப் போன்ற அடையாளமாகப் பயன்படுகிறது; செயல்பாட்டை ஊகித்து மொழிபெயர்ப்பதைவிட ஒலிபெயர்ப்பு பொருத்தமானது.
- source_word: וַיִּמְצָא אֶת
  choice: கண்டான்
  rationale: מָצָא என்பதன் நேரடியான பொருள் ‘கண்டான்’; இச்சூழலில் ‘சந்தித்தான்’ என்பதைவிட மூலத்தின் சொல்லாட்சிக்கு இது நெருக்கமானது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளை இயல்பான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: נִלְחָם עַל
  choice: எதிராகப் போரிட்டுக்கொண்டிருப்பதை
  rationale: பங்கேற்பு வினை நடைபெற்று வரும் செயலைக் காட்டுகிறது; עַל உடன் நகரம் வருவதால் அதற்கு எதிரான இராணுவத் தாக்குதல் குறிக்கப்படுகிறது.
- source_word: לִבְנָה
  choice: லிப்னா
  rationale: இடப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: כִּי שָׁמַע
  choice: ஏனெனில் ... கேள்விப்பட்டிருந்தான்
  rationale: இந்தக் கூற்று ரப்சாக்கே அரசனை லிப்னாவில் கண்டதற்கான பின்னணிக் காரணத்தைத் தருகிறது; முன்பு அறிந்த செய்தி என்பதை இறந்தகால நிறைவு வடிவம் தெளிவாக்குகிறது.
- source_word: כִּי נָסַע
  choice: புறப்பட்டுச் சென்றுவிட்டான்
  rationale: נָסַע என்பது புறப்படுதல், பயணம் தொடங்குதல், குறிப்பாக இராணுவச் சூழலில் முகாமைக் கலைத்துச் செல்லுதல் ஆகிய பொருள்களைக் கொள்ளலாம்; முதன்மை உரை பொதுவான இயக்கப் பொருளைத் தருகிறது.
- source_word: מִלָּכִישׁ
  choice: லாகீசிலிருந்து
  rationale: இடப்பெயரையும் ‘இலிருந்து’ என்ற முன்னொட்டின் பொருளையும் நேரடியாக வழங்குகிறது.
