translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான தொடர்கதை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அசீரியப் பதவிப்பெயர் ‘ரப்சாக்கே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையில் வெளிப்படையாக இல்லாத பெயர்களை அளவுக்கு மீறிச் சேர்க்காமல், தமிழில் புரியும் அளவுக்கு மட்டுமே ‘அரசன்’ மீண்டும் குறிப்பிடப்பட்டுள்ளது; ‘அவன்’ என்பது ரப்சாக்கேயைக் குறிக்கும் வகையில் உடனடி தொடர்ச்சி பேணப்பட்டுள்ளது.
