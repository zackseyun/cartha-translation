base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: ta
  text: 'ஏனெனில், எருசலேமிலிருந்து மீதியாயிருப்போர் புறப்பட்டுச் செல்வார்கள்;

    சீயோன் மலையிலிருந்து தப்பிப் பிழைத்தோர் புறப்பட்டுச் செல்வார்கள்.

    யாவேயின் ஆர்வம்[a] இதைச் செய்யும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் பொறாமை இதைச் செய்யும்.” எபிரெயச் சொல் ‘ஆர்வம்’ அல்லது ‘பொறாமை’ எனப் பொருள்படலாம்; இங்கு எருசலேமின் விடுதலையை நிறைவேற்றுவதற்கான யாவேயின் தீவிரமான பற்றுதலை அது குறிக்கிறது.
    reason: lexical_alternative
