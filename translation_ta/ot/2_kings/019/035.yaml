  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: ta
  text: அந்த இரவில் யாவேயின் தூதர் புறப்பட்டு, அசீரியரின் பாளையத்தில் 1,85,000 பேரை வீழ்த்தினார். அதிகாலையில் அவர்கள் எழுந்தபோது[a], இதோ, அவர்கள் எல்லாரும் உயிரற்ற சடலங்களாக இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவர்கள் அதிகாலையில் எழுந்தார்கள்.” ‘அவர்கள்’ யார் என்பதை மூலவுரை குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொற்பட, “சடலங்கள், இறந்தவை”—கொல்லப்பட்டவர்களின் நிலையைக் வலுவாக வலியுறுத்தும் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: எபிரெயக் கதைத் தொடர் சூத்திரத்திலுள்ள ‘நிகழ்ந்தது’ என்பதைத் தனியே மொழிபெயர்க்காமல், காலத் தொடர்பை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள்படலாம். இங்கு இயற்கைக்கு அப்பாற்பட்ட செயற்பாட்டாளர் என்பது சூழலால் தெளிவாக இருப்பதால், மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்க ‘தூதர்’ என்று தரப்படுகிறது; יהוה என்பது ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு
  rationale: יצא என்பதன் ‘வெளியே செல்லுதல்/புறப்படுதல்’ என்ற இயக்கத்தை இயல்பான கதைநடைத் தமிழில் காட்டுகிறது.
- source_word: וַיַּךְ
  choice: வீழ்த்தினார்
  rationale: נכה என்பது ‘அடித்தல்’ என்று அடிப்படையில் பொருள்பட்டாலும், இந்த நியாயத்தீர்ப்பு மற்றும் மரணச் சூழலில் கொல்லப்பட்ட விளைவை ‘வீழ்த்தினார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: அசீரியரின் பாளையத்தில்
  rationale: ‘அசீரியாவின் பாளையம்’ என்ற சொற்படி வடிவத்தை, அசீரியப் படையினரைக் குறிக்கும் இயல்பான தமிழாக அளிக்கிறது.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 1,85,000 பேரை
  rationale: எண்ணை இந்திய இலக்கப் பிரிப்பு முறையில் தெளிவாகக் காட்டுகிறது; மனிதர்களைக் குறிக்கும் தமிழ் வேற்றுமை வடிவத்திற்காக ‘பேரை’ சேர்க்கப்படுகிறது.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: அதிகாலையில் அவர்கள் எழுந்தபோது
  rationale: மூலத்தில் மூன்றாம் நபர் பன்மை எழுவாய் யார் என்பது குறிப்பிடப்படவில்லை. ‘அவர்கள்’ என்று வைத்திருப்பது புதிய அடையாளத்தைச் சேர்க்காமல் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடுக்கிடும் காட்சியின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியின் வலிமையை இயல்பான வேதாகமத் தமிழில் தக்கவைக்கிறது.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: அவர்கள் எல்லாரும் உயிரற்ற சடலங்களாகக் கிடந்தார்கள்
  rationale: ‘அனைவரும்—சடலங்கள், இறந்தவர்கள்’ என்ற வலியுறுத்தும் எபிரெயச் சேர்க்கையை தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; ‘கிடந்தார்கள்’ காட்சிநிலையை வெளிப்படையாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் அண்மையான ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: מַלְאַךְ என்பவரின் இயல்பு
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: சூழல் இவர் பரலோகச் செயற்பாட்டாளர் என்பதை உணர்த்தினாலும், மூலச்சொல் ‘தூதர்/செய்தியாளர்’ என்ற பொருள் அகலத்தைக் கொண்டது. ஆகவே உரை தேவையின்றி இயல்பை மேலும் வரையறுக்காமல் ‘தூதர்’ என்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் நாடக வலிமையைப் பாதுகாக்கிறது. குறிப்பிடப்படாத எழுவாயை ‘மக்கள்’ என நிரப்பாமல் ‘அவர்கள்’ என வைத்திருக்கிறது; இரண்டு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
