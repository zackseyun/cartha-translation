source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: ta
  text: 'அப்போது ஆமோத்சின் மகன் ஏசாயா எசேக்கியாவுக்கு இவ்வாறு செய்தி அனுப்பினார்: “இஸ்ரவேலின் கடவுளாகிய ஆண்டவர் இவ்வாறு கூறுகிறார்: ‘அசீரியாவின் அரசன் சனகெரீபைக் குறித்து நீ என்னிடம் வேண்டிக்கொண்டதை நான் கேட்டேன்.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: இங்கு ஏசாயா ஒருவரிடம் செய்தியை அனுப்பியதைக் குறிக்கும் இயல்பான தமிழ் நடை; வெறுமனே ‘அனுப்பினார்’ என்பதில் விடுபடும் பொருளைத் தெளிவாக்குகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: ஆண்டவர் கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுரையின் நிலையான வலிமையைப் பேணுகிறது; יהוה என்ற திருப்பெயரை மரியாதை வழக்கான ‘ஆண்டவர்’ என வழங்குகிறது.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָ אֵלַי
  choice: நீ என்னிடம் வேண்டிக்கொண்டதால்
  rationale: אֲשֶׁר என்பதன் தொடர்பை இச்சூழலில் காரணத் தொடர்பாக இயல்பாக வெளிப்படுத்துகிறது; התפלל என்பதற்கு தனிப்பட்ட மன்றாட்டின் நயத்துடன் ‘வேண்டிக்கொண்டாய்’ பயன்படுத்தப்படுகிறது.
- source_word: שָׁמָעְתִּי
  choice: நான் கேட்டேன்
  rationale: எபிரேய வாக்கியத்தின் சுருக்கத்தையும் வலிமையையும் பேணுகிறது; ‘பதிலளித்தேன்’ என்று மூலத்தில் இல்லாத விளைவைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה-இன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் மரியாதையான வடிவம்; தனிப்பெயரின் செயல்பாட்டை முற்றிலும் பொதுப்பெயராக்காமல் சூழல் தெளிவாக வைத்திருக்கிறது.
- issue: தேவன் ‘கேட்டேன்’ என்பதன் பொருள்
  choice: மூலத்தின் நேரடி சொல்லான ‘நான் கேட்டேன்’ என்பதையே வைத்தல்
  alternative: ‘உன் வேண்டுதலை ஏற்றுக்கொண்டேன்’
  rationale: பதில் அல்லது ஏற்றுக்கொள்ளுதல் உட்குறிப்பாக இருக்கக்கூடும்; ஆனால் அதை வெளிப்படையாகச் சேர்த்தால் மூலத்தின் சுருக்கமும் திறந்த நயமும் குறையும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடை. பெயர்கள் வழக்கிலுள்ள தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன; வாக்கிய அமைப்பு மூலத்தின் தூதுரை வடிவத்தையும் மேற்கோள் அடுக்கையும் பேணுகிறது.
