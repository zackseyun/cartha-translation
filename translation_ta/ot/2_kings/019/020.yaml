- from: 'அப்போது ஆமோத்சின் மகன் ஏசாயா எசேக்கியாவுக்குச் செய்தி அனுப்பி, “இஸ்ரவேலின் கடவுளாகிய ஆண்டவர் கூறுவது இதுவே: ‘அசீரியாவின் அரசன் சனகெரீபைக் குறித்து நீ என்னிடம் வேண்டிக்கொண்டதால், நான் கேட்டேன்’” என்றார்.'
  to: 'அப்போது ஆமோத்சின் மகன் ஏசாயா எசேக்கியாவுக்கு இவ்வாறு செய்தி அனுப்பினார்: “இஸ்ரவேலின் கடவுளாகிய ஆண்டவர் இவ்வாறு கூறுகிறார்: ‘அசீரியாவின் அரசன் சனகெரீபைக் குறித்து நீ என்னிடம் வேண்டிக்கொண்டதை நான் கேட்டேன்.’”'
