source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: ta
  text: யாவே, அசீரிய அரசர்கள் தேசங்களையும் அவற்றின் நிலங்களையும்[b] பாழாக்கியிருக்கிறார்கள் என்பது உண்மைதான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெய்யாகவே’ அல்லது ‘நிச்சயமாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவற்றின் நிலம்’ என்று ஒருமையில் உள்ளது; இங்கு அது ஒவ்வொரு தேசத்திற்கும் உரிய நிலத்தை ஒட்டுமொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: உண்மைதான்
  rationale: முந்தைய கூற்றை உண்மை என்று வலியுறுத்தும் தொடக்கச் சொல்லின் உறுதிப்படுத்தும் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֶחֱרִיבוּ
  choice: பாழாக்கியிருக்கிறார்கள்
  rationale: חרב என்பதன் ஹிஃபில் வடிவம் போரினால் அழிவையும் பாழ்நிலையையும் ஏற்படுத்துவதைக் குறிக்கிறது; இத்தொடர் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מַלְכֵי אַשּׁוּר
  choice: அசீரிய அரசர்கள்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பாகவும் நேரடியாகவும் தமிழில் தருகிறது.
- source_word: הַגּוֹיִם
  choice: தேசங்கள்
  rationale: இங்குள்ள அரசியல் மற்றும் படையெடுப்புச் சூழலில் גּוֹיִם வெவ்வேறு தேசங்களைக் குறிக்கிறது.
- source_word: אַרְצָם
  choice: அவற்றின் நிலங்கள்
  rationale: மூலத்தில் பெயர்ச்சொல் ஒருமையில் இருந்தாலும், பன்மையான ‘தேசங்கள்’ ஒவ்வொன்றுக்கும் உரிய நிலத்தைக் கூட்டாக அல்லது பகிர்ந்தளிக்கும் பொருளில் குறிக்கிறது; தமிழில் பன்மை இயல்பாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரான ‘ஆண்டவர்’ என்பதைக் கொண்டு மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமான ‘யாவே’ என்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் எளிமையும் கொண்ட நடை. எபிரெய வாக்கியத்தின் தொடக்க உறுதிப்பாட்டை தமிழில் இயல்பாக வாக்கிய முடிவில் வைத்துள்ளது; பொருளின் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
