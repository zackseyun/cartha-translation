translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைக் கையாளுகிறது. பழமையான ‘சாஷ்டாங்கம் செய்தான்’ போன்ற சொற்களுக்கு மாறாக, வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்ட ‘வழிபட்டுக்கொண்டிருந்தபோது’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிவடிவத்துக்கு அணுக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
