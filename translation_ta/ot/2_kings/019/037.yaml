base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: ta
  text: அவன் தன் கடவுளான நிஸ்ரோக்கின்[a] கோவிலில் வழிபட்டுக்கொண்டிருந்தபோது, அத்ரம்மெலேக்கும் சரேசரும் அவனை வாளால் தாக்கினார்கள். அவர்கள் அராராத் நாட்டுக்குத் தப்பிச் சென்றார்கள். அவனுடைய மகன் ஏசர்-ஹத்தோன் அவனுக்குப் பதிலாக ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நிஸ்ரோக்’; மரபான ஆங்கில வடிவம் ‘Nisroch’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הוּא מִשְׁתַּחֲוֶה
  choice: அவன் ... வழிபட்டுக்கொண்டிருந்தபோது
  rationale: הוּא உடன் வரும் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது; வַיְהִי நிகழ்வின் பின்னணியை அறிமுகப்படுத்துகிறது. தமிழில் காலத் துணைவாக்கியமாக வழங்குவது இயல்பாகவும் மூலத்தின் நிகழ்வோட்டத்துக்கு உண்மையாகவும் உள்ளது.
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: தன் கடவுளான நிஸ்ரோக்கின் கோவிலில்
  rationale: בֵּית என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், ஒரு கடவுளுக்குரிய வழிபாட்டு இடம் இங்கு குறிக்கப்படுவதால் ‘கோவில்’ என்பது இயல்பான சூழற்பொருள். אֱלֹהָיו ‘அவனுடைய கடவுள்’ என்பதைக் குறிக்கிறது.
- source_word: וְאַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר
  choice: அத்ரம்மெலேக்கும் சரேசரும்
  rationale: எபிரெய மெய்யொலிகளை அணுக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளோம்; இருவரும் வினையின் எழுவாய்கள் என்பதால் இணைப்பும்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: அவனை வாளால் வெட்டிக் கொன்றார்கள்
  rationale: נכה அடித்தல் அல்லது தாக்குதலைக் குறிக்கிறது; இந்தச் சூழலில் அது உயிரிழப்பில் முடிவதை அரச வாரிசுரிமைத் தொடர்ச்சி உறுதிப்படுத்துகிறது. ‘வாளால் வெட்டிக் கொன்றார்கள்’ என்பது கருவியையும் விளைவையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: அராராத் நாட்டுக்குத் தப்பிச் சென்றார்கள்
  rationale: מלט என்பதன் நிபால் வடிவம் வெற்றிகரமாகத் தப்பியதைக் குறிக்கிறது; אֶרֶץ אֲרָרָט அவர்கள் சென்ற இலக்கிடமாக உள்ளது.
- source_word: וַיִּמְלֹךְ אֵסַר חַדֹּן בְּנוֹ תַּחְתָּיו
  choice: அவனுடைய மகன் ஏசர்-ஹத்தோன் அவனுக்குப் பதிலாக அரசனானான்
  rationale: מלך இங்கு அரச வாரிசாக ஆட்சிக்கு வந்ததைக் குறிக்கிறது; תַּחְתָּיו என்பது ‘அவனுக்குப் பதிலாக’ என்ற வாரிசுரிமைப் பொருளைத் தருகிறது.
