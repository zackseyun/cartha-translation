source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: ta
  text: இப்போது, எங்கள் கடவுளாகிய யாவே, பூமியின் எல்லா அரசுகளும் யாவே, நீர் ஒருவரே கடவுள் என்பதை அறியும்படி, அவனுடைய கையிலிருந்து[a] எங்களைக் காப்பாற்றியருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய கையிலிருந்து” என்பது அவனுடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: வேண்டுதலின் உச்சக்கட்டத்தை அறிமுகப்படுத்தும் காலச் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரெய இணைப்பின் தொடர்ச்சியும் சூழலில் தெளிவாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளாகிய
  rationale: முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் நேரடி விளிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: எங்களைக் காப்பாற்றியருளும்
  rationale: ישׁע என்பதன் கட்டளைப் பொருளை ‘காப்பாற்றும்’ என்றும், வேண்டுகோளை மென்மையாக்கும் נָא என்பதன் பணிவை ‘அருளும்’ என்றும் இயல்பாகக் காட்டுகிறது.
- source_word: מִיָּדוֹ
  choice: அவனுடைய கையிலிருந்து
  rationale: ஒருவரின் அதிகாரம் அல்லது பிடியிலிருந்து விடுவித்தல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: וְיֵדְעוּ
  choice: அப்போது ... அறிந்துகொள்ளும்
  rationale: முந்தைய வேண்டுகோளின் நோக்கம் அல்லது விளைவாக எல்லா அரசுகளும் அறிய வேண்டும் என்பதைக் காட்டுகிறது; எபிரெய வடிவத்திலுள்ள நோக்கம்–விளைவு நுணுக்கத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: பூமியின் எல்லா அரசுகளும்
  rationale: அசீரியாவையும் பல நாடுகளையும் உள்ளடக்கும் சர்வதேசச் சூழலில் הָאָרֶץ என்பதை ‘பூமி’ எனக் கொள்வது பொருத்தமானது; ‘அரசுகள்’ என்பது நவீன வாசகர்களுக்குப் புரியும் வகையில் மַמְלָכוֹת என்பதைக் குறிக்கிறது.
- source_word: כִּי אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: யாவே, நீர் ஒருவரே கடவுள் என்பதை
  rationale: அறியப்பட வேண்டிய செய்தியை அறிமுகப்படுத்தும் כִּי-யையும், யாவே மட்டுமே கடவுள் என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது; ஆகவே தனிப்பட்ட பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְבַדֶּךָ என்பதன் தனித்துவ வலியுறுத்தல்
  choice: நீர் ஒருவரே கடவுள்
  alternative: நீர் கடவுள், நீர் மட்டுமே
  rationale: யாவேயின் தனித்துவமான இறைத்தன்மையைத் தெளிவாகக் கூறுகிறது; மூலத்தில் இல்லாத மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: וְיֵדְעוּ என்பதில் நோக்கமா விளைவா
  choice: அப்போது ... அறிந்துகொள்ளும்
  alternative: அதனால் ... அறிந்துகொள்ளட்டும்
  rationale: மீட்பின் விளைவாகவும் வேண்டுதலின் நோக்கமாகவும் அரசுகள் அறியும் என்ற இரு நுணுக்கங்களுக்கும் இடமளிக்கும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் ஜெபத்திற்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘காப்பாற்றியருளும்’ என்பது பணிவான வேண்டுகோளையும், ‘நீர்’ என்பது மரியாதையான ஒருமை விளிப்பையும் தருகின்றன. உருவகமும் இறைப் பெயரும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
