revisions:
- from: இப்போது, எங்கள் கடவுளாகிய யாவே, அவனுடைய கையிலிருந்து எங்களைக் காப்பாற்றியருளும்[a]. அப்போது, பூமியின் எல்லா அரசுகளும்[b], யாவே, நீர் ஒருவரே கடவுள் என்பதை அறிந்துகொள்ளும்.
