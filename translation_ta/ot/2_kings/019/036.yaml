  rationale: மூன்று தொடர்ச்சியான எபிரெய வினைச்சொற்களின் இயக்கத்தையும் வரிசையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: וַיֵּשֶׁב
