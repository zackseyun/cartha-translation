base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: ta
  text: பின்பு எசேக்கியா தூதுவர்களின் கையிலிருந்து கடிதங்களை[a] வாங்கி, அவற்றை வாசித்தான். பின்னர் அவன் யாவேயின் ஆலயத்திற்குச் ஏறிச் சென்று, அதை[b] யாவேக்கு முன்பாக விரித்துவைத்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவணங்கள்,’ ‘சுருள்கள்,’ அல்லது பொதுவாக ‘எழுத்துகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மூலத்தில் முதலில் ‘கடிதங்கள்’ என்ற பன்மை வந்தாலும், இங்கு ‘அதை’ என்ற ஒருமை வருகிறது; எழுதப்பட்ட செய்தியை ஒரே தொகுப்பாகக் கருதியிருக்கலாம்.
    reason: textual_ambiguity
  - marker: c
    text: எசேக்கியா அந்த எழுதப்பட்ட செய்தியை யாவேயின் முன்னிலையில் வைத்து, அதைக் குறித்து வேண்டுதல் செய்யத் தயாரானதை இது காட்டுகிறது; அவன் ஜெபம் அடுத்த வசனத்தில் தொடங்குகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: கடிதங்களை
  rationale: இந்தப் பன்மைச் சொல் பொதுவாக எழுதப்பட்ட ஆவணங்கள் அல்லது சுருள்களைக் குறிக்கலாம்; இச்சூழலில் தூதுவர்கள் கொண்டுவந்த எழுதப்பட்ட செய்தியைக் குறிப்பதால் ‘கடிதங்களை’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: தூதுவர்களின் கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய மரபுத்தொடரின் காட்சித் தன்மையைத் தக்கவைக்கிறது; வரலாற்றுச் சூழலில் מַלְאָכִים என்பது விண்ணுலகத் தூதர்களை அல்ல, மனிதத் தூதுவர்களைக் குறிக்கிறது.
- source_word: וַיִּקְרָאֵם
  choice: அவற்றை வாசித்தான்
  rationale: வினையோடு இணைந்த பன்மைச் சுட்டுப்பெயர் முன்வரும் ‘கடிதங்களை’ச் சுட்டுகிறது.
- source_word: וַיַּעַל
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் ‘மேலே போதல்’ என்ற பொருளைத் தக்கவைத்து, ஆலயத்திற்குச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வீடு’ என்றாலும், இங்கு எருசலேம் ஆலயமே குறிக்கப்படுவதால் ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதத்தில் காணப்படும் இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: அதை விரித்துவைத்தான்
  rationale: மூலத்தில் முன்வரும் பன்மையான ‘கடிதங்கள்’ என்பதற்குப் பின் ஒருமைச் சுட்டுப்பெயர் வருகிறது; எழுதப்பட்ட செய்தித் தொகுப்பை ஓர் அலகாகக் கருதும் இந்த எண்ணிக்கை மாற்றம் பாதுகாக்கப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: யாவேயின் சந்நிதியில் அந்த எழுதப்பட்ட செய்தியை வைத்து முறையிடும் செயலை மூலத்தின் வழக்கிற்கு நெருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தனிப்பட்ட இறைப் பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: கடிதங்களை யாவேக்கு முன்பாக விரித்துவைத்ததன் பொருள்
  choice: உடல் சார்ந்த செயலை நேரடியாக மொழிபெயர்த்து, அதன் வேண்டுதல் சார்ந்த சூழலைக் குறிப்பில் விளக்குதல்
  alternative: ‘அவற்றைப் பற்றி யாவேயிடம் மன்றாடினான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் உடல் சார்ந்த செயலைத் தெளிவாகக் கூறுகிறது; ஜெபம் அடுத்த வசனத்தில் வெளிப்படுவதால் அதை இவ்வசனத்தின் முதன்மை உரைக்குள் முன்கூட்டியே சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைக்குரிய நடையிலும் வடிவமைக்கப்பட்டது. ‘தூதுவர்கள்’ என்பது மனித செய்தியாளர்களைக் குறிக்கிறது. மூலத்தின் பன்மை–ஒருமை மாற்றம் மறைக்கப்படாமல் உரையிலும் குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
