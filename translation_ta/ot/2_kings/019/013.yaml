base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: ta
  text: ஹமாத்தின் அரசன் எங்கே? அர்பாத்தின் அரசன் எங்கே? செப்பர்வாயீம் நகரத்தின் அரசன், ஏனா, இவ்வா—எங்கே?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיּוֹ
  choice: எங்கே?
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் இந்த வினாவிடைச் சொல், குறிப்பிடப்பட்ட அரசர்களின் தற்போதைய நிலை அல்லது முடிவை ஏளனமாகக் கேட்கிறது. தமிழில் இயல்பான வினாவாக ‘எங்கே?’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ‘அரசன்’ என்பது இச்சொல்லின் வழக்கமான, தெளிவான தமிழ் இணை. எபிரெயத்தில் மூன்று முறை வரும் சொல்லின் சொல்லாட்சிச் செறிவை தமிழிலும் மூன்று முறை தக்கவைத்துள்ளோம்.
- source_word: חֲמָת
  choice: ஆமாத்
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்துள்ளோம்; இறுதி ‘த்’ வேற்றுமை உருபு சேரும்போது ‘ஆமாத்தின்’ என அமைகிறது.
- source_word: אַרְפָּד
  choice: அர்பாத்
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவத்துக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: לָעִיר
  choice: நகரங்களின்
  rationale: மூலத்தில் ‘நகரம்’ ஒருமையில் இருந்தாலும், தொடர்ந்து வரும் செப்பர்வாயீம், ஏனா, இவ்வா ஆகிய மூன்று பெயர்களுக்கும் அந்த உறவை இயல்பான தமிழில் விரித்துக் காட்ட பன்மை பயன்படுத்தப்பட்டது. மூலத்தின் இலக்கணச் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: סְפַרְוָיִם
  choice: செப்பர்வாயீம்
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்துள்ளோம்.
- source_word: הֵנַע
  choice: ஏனா
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தையும் அதன் வழக்கமான உச்சரிப்பையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְעִוָּה
  choice: இவ்வா
  rationale: இணைப்புச் சொல்லான ‘וְ’ பட்டியல் அமைப்பில் ‘ஆகிய’ என்பதால் வெளிப்படுகிறது; இடப்பெயர் ‘இவ்வா’ என எழுத்துப்பெயர்க்கப்பட்டது.
