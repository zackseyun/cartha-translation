revisions:
- from: யூதா வீட்டாரில் தப்பிப் பிழைத்து மீந்திருக்கும் எஞ்சியோர்[a] மீண்டும்[b] கீழ்நோக்கி வேரூன்றி, மேல்நோக்கிக் கனி கொடுப்பார்கள்.
  to: யூதா வம்சத்தில் தப்பிப் பிழைத்து மீதமிருக்கும் எஞ்சியோர்[a] மீண்டும்[b] கீழ்நோக்கி வேரூன்றி, மேல்நோக்கிக் கனி கொடுப்பார்கள்.
  rationale: The revision replaces the household-specific “யூதா வீட்டார்” with the clearer collective “யூதா வம்சம்,” regularizes “மீதிருக்கும்” to natural modern “மீதமிருக்கும்,” and improves footnote a so that it is a meaningful, source-based alternative. The survivor/remnant double emphasis and the downward-root/upward-fruit parallel remain intact.
