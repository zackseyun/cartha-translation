  edition: WLC
  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/030.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: ta
  text: யூதா வம்சத்தில் தப்பிப் பிழைத்து மீதமிருக்கும் எஞ்சியோர்[a] மீண்டும்[b] கீழ்நோக்கி வேரூன்றி, மேல்நோக்கிக் கனி கொடுப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதமிருக்கும் யூதா வம்சத்தின் எஞ்சியோர்.”
    reason: எபிரெயச் சொற்றொடரை “தப்பிப் பிழைத்தோர்” என்பதற்குப் பதிலாக “எஞ்சியோர்” என்ற மையக் குறிப்புடன் அமைக்கலாம்; இரண்டிலும் மீதமிருத்தல் என்ற கருத்து உள்ளது.
  - marker: b
    text: அல்லது, “தொடர்ந்து.”
    reason: וְיָסְפָה புதிதாக மீண்டும் நிகழ்வதையோ ஏற்கெனவே தொடங்கிய செயல் தொடர்வதையோ சூழலுக்கேற்ப குறிக்கலாம்.
lexical_decisions:
- source_word: וְיָסְפָה
  choice: மீண்டும்
  rationale: יסף இங்கு அடுத்துவரும் செயல்கள் புதிதாக அல்லது தொடர்ச்சியாக நிகழ்வதைக் குறிக்கிறது. அழிவுக்குப் பிந்தைய மீட்சிச் சூழலில் “மீண்டும்” இயல்பாக உள்ளது; “தொடர்ந்து” என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: தப்பிப் பிழைத்து மீந்திருக்கும் எஞ்சியோர்
  rationale: פְּלֵיטָה தப்பிப் பிழைத்தவர்களையும், הַנִּשְׁאָרָה மீந்திருப்பவர்களையும் குறிக்கின்றன. எபிரெய மூலத்தில் உள்ள இரட்டை வலியுறுத்தலை முற்றிலும் சுருக்கிவிடாமல் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בֵּית יְהוּדָה
  choice: யூதா வீட்டார்
  rationale: “யூதாவின் வீடு” என்ற உடன்படிக்கை-வரலாற்றுச் சமூகக் குறிப்பை, நவீன தமிழில் மக்களைக் குறிக்கும் இயல்பான “யூதா வீட்டார்” என வழங்குகிறது.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: கீழ்நோக்கி வேரூன்றி
  rationale: சொல்லர்த்தத்தில் “கீழே வேர்” என்ற உருவகம் உள்ளது. தமிழில் செயலை இயல்பாகச் சொல்ல “வேரூன்றி” பயன்படுத்தப்பட்டு, திசை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: மேல்நோக்கிக் கனி கொடுப்பார்கள்
  rationale: עשה פרי என்பது கனி உண்டாக்குதல் அல்லது கனிகொடுத்தல் என்னும் வேளாண்மைச் சொற்றொடர். “மேல்நோக்கி” என்பது கீழ்நோக்கிய வேருடன் உள்ள கவிதைநயமான எதிரிணையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மீட்பின் வாக்கில் எஞ்சியோர் பற்றிய மொழி
  choice: தப்பிப் பிழைத்து மீந்திருக்கும் எஞ்சியோர்
  alternative: தப்பிப் பிழைத்தவர்கள் / மீந்திருக்கும் எஞ்சியோர்
  rationale: நியாயத்தீர்ப்புக்குப் பின் பாதுகாக்கப்பட்ட யூதா மக்களைச் சுட்டும் எஞ்சியோர் உருவகத்தைத் தக்கவைக்கிறது; இதற்கு அப்பாற்பட்ட பிற்கால இறையியல் முடிவுகளை வசனத்திற்குள் சேர்க்கவில்லை.
- issue: வேர் மற்றும் கனி உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்காமல் அப்படியே பாதுகாத்தல்
  alternative: நிலைத்திருந்து செழிப்பார்கள் என்று பொருள் விளக்கிப் பெயர்த்தல்
  rationale: மூலத்தின் கீழ்நோக்கிய வேர், மேல்நோக்கிய கனி என்ற உயிரோட்டமான உருவகம் மீட்சியையும் வளர்ச்சியையும் உணர்த்துகிறது; அதன் பொருளை ஒரே விளக்கமாகச் சுருக்காமல் விட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “வேரூன்றி—கனி கொடுப்பார்கள்” மற்றும் “கீழ்நோக்கி—மேல்நோக்கி” என்ற கவிதைநயமான இணைகள் பாதுகாக்கப்பட்டுள்ளன.
