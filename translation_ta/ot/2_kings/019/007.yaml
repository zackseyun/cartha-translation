base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: ta
  text: இதோ, நான் அவனுக்குள் ஓர் ஆவியை[a] வைக்கிறேன். அவன் ஒரு செய்தியைக்[b] கேட்டு, தன் நாட்டுக்குத் திரும்புவான்; அவனுடைய நாட்டிலேயே அவனை வாளால் வீழ்த்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு மனப்பாங்கு’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் ‘காற்று’ அல்லது ‘மூச்சு’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘ஒரு தகவல்’ அல்லது ‘ஒரு வதந்தி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ
  rationale: தெய்வீக அறிவிப்பின் மீது கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: נֹתֵן
  choice: நான் ... வைக்கிறேன்
  rationale: הִנְנִי என்பதற்குப் பின் வரும் வினையெச்சம் உடனடியாக அல்லது விரைவில் நிகழவிருக்கும் செயலை உயிரோட்டமாகக் காட்டுகிறது.
- source_word: בּוֹ רוּחַ
  choice: அவனுக்குள் ஓர் ஆவியை
  rationale: בּוֹ என்பதன் ‘அவனுக்குள்’ என்ற பொருளையும், רוּחַ என்பதன் ஆவி/மனப்பாங்கு/காற்று/மூச்சு சார்ந்த பொருள் விரிவையும் முடிந்தவரை காக்கிறது.
- source_word: וְשָׁמַע שְׁמוּעָה
  choice: அவன் ஒரு செய்தியைக் கேட்டு
  rationale: தொடரும் விளைவு வரிசையை இயல்பான தமிழில் காட்டுகிறது; שְׁמוּעָה என்பதைக் உண்மை உறுதிசெய்யப்பட்டதாகவோ வெறும் வதந்தியாகவோ முன்கூட்டியே வரையறுக்காமல் ‘செய்தி’ என வழங்குகிறது.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: தன் நாட்டுக்குத் திரும்புவான்
  rationale: திரும்பிச் செல்வதையும், அந்த நாடு அவனுடையது என்பதையும் சுருக்கமான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִפַּלְתִּיו
  choice: அவனை ... வீழ்த்துவேன்
  rationale: נפל என்பதன் காரணவினை வடிவிலுள்ள ‘விழச் செய்வேன்’ என்ற கருத்தை இயல்பாகவும் வலிமையாகவும் அளிக்கிறது.
- source_word: בַּחֶרֶב בְּאַרְצוֹ
  choice: அவனுடைய நாட்டிலேயே அவனை வாளால்
  rationale: வாள் கருவியாக இருப்பதையும், அவனது வீழ்ச்சி அவன் சொந்த நாட்டிலேயே நிகழும் என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: தீர்ப்பைப் பற்றிய தெய்வீக அறிவிப்பில் רוּחַ என்பதன் பொருள்
  choice: ஓர் ஆவி
  alternative: ஒரு மனப்பாங்கு; ஒரு காற்று; ஒரு மூச்சு
  rationale: அசீரிய அரசனின் செயல்பாட்டை இறைவன் திசைதிருப்புவதைச் சூழல் காட்டினாலும், அது எவ்வாறு நிகழ்கிறது என்பதை எபிரெயச் சொல் துல்லியமாக வரையறுக்கவில்லை. ‘ஆவி’ அந்தத் தெய்வியல் மற்றும் சொற்பொருள் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் தெய்வீக அறிவிப்புக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘இதோ’ அறிவிப்பின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘அவனுடைய நாட்டிலேயே’ இறுதிக் கூறின் வலியுறுத்தலையும் பரிகாசத் தன்மையையும் வெளிப்படுத்துகிறது.
