translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் மூன்று கூறுகளைக் கொண்ட சொற்றொடர் நேரடியாகத் தக்கவைக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘அறிவேன்’ இரண்டாம் முறை தமிழின் தெளிவிற்காக மீளக் கூறப்பட்டுள்ளது; எபிரெயத்தில் ஒரே வினைச்சொல் இரு பொருட்களையும் ஆள்கிறது.
