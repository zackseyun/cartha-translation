  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: ta
  text: ஆனால் உன் அமர்வையும்[a], வெளியே போவதையும், உள்ளே வருவதையும், எனக்கு எதிராக உன் கொந்தளிப்பையும்[b] நான் அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமர்வு, வெளியே போதல், உள்ளே வருதல்” என்ற எபிரெயச் சொற்றொடர் ஒருவருடைய அசைவுகள், செயல்கள், நடத்தை, வாழ்க்கை ஆகிய அனைத்தையும் உள்ளடக்குகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது “எனக்கு எதிரான உன் கலக்கத்தையும்” அல்லது “எனக்கு எதிரான உன் சீற்றத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: நீ அமர்ந்திருப்பதையும்
  rationale: ישׁב என்பதிலிருந்து வந்த இவ்வடிவம், ‘வெளியே போவது, உள்ளே வருவது’ என்பவற்றுடன் சேர்ந்து ஒருவரின் முழுச் செயல்பாட்டையும் குறிக்கிறது. எபிரெய மொழியின் தெளிவான உருவகத்தைத் தக்கவைக்க ‘அமர்ந்திருப்பது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְצֵאתְךָ
  choice: வெளியே போவதையும்
  rationale: יצא என்பதிலிருந்து வந்தது; ‘உள்ளே வருவது’ என்பதுடன் இணைந்த வழக்குச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבֹאֲךָ
  choice: உள்ளே வருவதையும்
  rationale: בוא என்பதிலிருந்து வந்தது; ‘வெளியே போவது’ என்பதுடன் அமைந்த இணையைத் தக்கவைக்கிறது.
- source_word: יָדָעְתִּי
  choice: நான் அறிவேன்
  rationale: ידע என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம். சூழலில் கடவுளின் உறுதியான, முழுமையான அறிவை நிகழ்காலத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: הִתְרַגֶּזְךָ
  choice: நீ கொந்தளிப்பதையும்
  rationale: רגז என்பதன் Hitpael வடிவம் கலக்கம், சீற்றம் அல்லது ஆவேசமான கொந்தளிப்பைக் குறிக்கலாம். இச்சூழலில் உள்ள பகைமையான உணர்வை மிகைப்படுத்தாமல் ‘கொந்தளிப்பது’ வெளிப்படுத்துகிறது.
- source_word: אֵלָי
  choice: எனக்கு எதிராக
  rationale: אל பொதுவாக ‘நோக்கி’ என்று பொருள்பட்டாலும், பகைமையான கொந்தளிப்புடன் வருவதால் தமிழில் எதிர்மறை நோக்கைத் தெளிவுபடுத்த ‘எனக்கு எதிராக’ என வழங்கப்பட்டது.
- source_word: וְאֵת
  choice: -யும்
  rationale: இணைப்புச் சொல்லும் நேரடி வேற்றுமை உருபும் சேர்ந்து ‘அறிவேன்’ என்பதற்குரிய இறுதிப் பொருளை அறிமுகப்படுத்துகின்றன; தமிழில் இணைப்பும்மை இயல்பாக அந்தப் பணியைச் செய்கிறது.
