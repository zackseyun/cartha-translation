base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: ta
  text: நீ எனக்கு எதிராகக் கொந்தளித்ததும், உன் அலட்சியமான தன்னம்பிக்கையும் என் செவிகளுக்கு எட்டியதால்[a], நான் என் கொக்கியை உன் மூக்கிலும், என் கடிவாளத்தை உன் உதடுகளிலும் போட்டு, நீ வந்த வழியிலேயே உன்னைத் திருப்பி அனுப்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் செருக்கு” அல்லது “உன் தன்னம்பிக்கை.” எபிரெயச் சொல் கவலையற்ற நிம்மதி, பாதுகாப்புணர்வு, அல்லது தன்னம்பிக்கையைக் குறிக்கிறது; இங்கு அது பகைமையான சூழலில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: எட்டியதால்
  rationale: வரவிருக்கும் தீர்ப்புக்கான காரணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: நீ எனக்கு எதிராகக் கொந்தளித்ததும்
  rationale: தேவனுக்கு எதிரான பகைமையான சீற்றத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שַׁאֲנַנְךָ
  choice: உன் மெத்தனமான தன்னம்பிக்கை
  rationale: எளிதாகவும் பாதுகாப்பாகவும் இருப்பதாகக் கருதும் மனநிலையையும், இச்சூழலில் அதற்குள்ள செருக்கையும் ஒருங்கே உணர்த்துகிறது; சொல்லின் பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: עָלָה בְאָזְנָי
  choice: என் செவிகளுக்கு எட்டியதால்
  rationale: எபிரெய உருவகத்தின் கேட்டல் பொருளை இயல்பான நவீன தமிழில் தருகிறது; உடலுறுப்பு சார்ந்த உருவகத்தையும் தக்கவைக்கிறது.
- source_word: חַחִי בְּאַפֶּךָ
  choice: என் கொக்கியை உன் மூக்கிலும்
  rationale: விலங்கு அல்லது சிறைக்கைதியைக் கட்டுப்படுத்தும் மூக்குக் கொக்கியின் கடுமையான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: என் கடிவாளத்தை உன் உதடுகளிலும்
  rationale: கட்டுப்படுத்தும் கருவியையும், எபிரெயத்தில் குறிப்பிட்டுள்ள ‘உதடுகள்’ என்பதையும் பாதுகாக்கிறது.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: உன்னைத் திருப்பி அனுப்புவேன்
  rationale: שׁוב என்பதன் காரணவினைப் பொருளையும், எதிரியின் பின்வாங்குதலில் தேவனுடைய செயற்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: நீ வந்த வழியிலேயே
  rationale: படையெடுத்தவன் வந்த அதே பாதையில் திருப்பப்படுவான் என்ற தீர்ப்பின் சமச்சீரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: தேவன் கேட்பதையும் அசீரிய அரசனைக் கட்டுப்படுத்துவதையும் குறிக்கும் மனிதவடிவ உருவகங்கள்
  choice: ‘என் செவிகள்,’ ‘என் கொக்கி,’ ‘என் கடிவாளம்’ ஆகிய உருவகங்களைப் பாதுகாத்தல்
  alternative: ‘நான் அதைக் கேட்டேன்,’ ‘நான் உன்னைக் கட்டுப்படுத்துவேன்’ போன்ற கருத்துருவாக்கம்
  rationale: தெய்வீக அறிவையும் அரசன்மீதான இறையாண்மைமிக்க அவமானப்படுத்தலையும் வசனத்தின் உயிருள்ள தீர்க்கதரிசன உருவகங்களே வலுவாக எடுத்துரைக்கின்றன.
- issue: שַׁאֲנַנְךָ என்பதன் நுண்பொருள்
  choice: முதன்மை உரையில் ‘மெத்தனமான தன்னம்பிக்கை’
  alternative: ‘செருக்கு,’ ‘அலட்சியமான நிம்மதி,’ அல்லது ‘தன்னம்பிக்கை’
  rationale: எபிரெயச் சொல் நிம்மதி, பாதுகாப்புணர்வு, தன்னம்பிக்கையான மெத்தனம் ஆகியவற்றைக் குறிக்கிறது; பகைமையான சூழல் அதற்கு செருக்கின் சாயலை அளிக்கிறது. அந்தப் பொருள் பரப்பை ஒரே குறுகிய சொல்லால் முடிவுசெய்யாமல் அடிக்குறிப்பில் காட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘கொக்கி—கடிவாளம்’ என்ற இணை உருவகமும் ‘மூக்கு—உதடுகள்’ என்ற உடற்கூறு விவரங்களும் பாதுகாக்கப்பட்டுள்ளன; சிக்கலான שַׁאֲנַנְךָ என்பதன் பொருள் அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
