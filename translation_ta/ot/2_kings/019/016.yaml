base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: ta
  text: யாவே, உமது செவியைச் சாய்த்துக் கேளும்; யாவே, உமது கண்களைத் திறந்து பாரும். உயிருள்ள கடவுளைப் பழித்துரைக்க[a] சனகெரிப் அனுப்பிய வார்த்தைகளைக் கேளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள கடவுளை இகழ” அல்லது “உயிருள்ள கடவுளுக்கு எதிராகச் சவால்விட”; எபிரெய வினைச்சொல் பழித்தல், நிந்தித்தல், சவால்விடுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: உமது செவியைச் சாய்த்துக் கேளும்
  rationale: ‘செவியைச் சாய்த்தல்’ என்பது கவனமாகக் கேட்கும்படி வேண்டுகிற எபிரெயச் சொல்லாட்சியை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எபிரெய மெய்யெழுத்துகளைக் குறிக்கும் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: உமது கண்களைத் திறந்து பாரும்
  rationale: கட்டளை வடிவங்களையும் ‘கேள்—பார்’ என்ற இணை அமைப்பையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: சனகெரிப் ... வார்த்தைகள்
  rationale: דִּבְרֵי என்பதன் பன்மையை ‘வார்த்தைகள்’ என்று தக்கவைத்து, அசீரிய அரசனின் பெயரை வழக்கமான தமிழ் ஒலிவடிவில் தருகிறது.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: சனகெரிப் அனுப்பிய
  rationale: எபிரெயச் சொற்றொடரில் அனுப்பப்பட்ட செய்தி அல்லது அதை எடுத்துவந்தவர் பின்னணியில் இருப்பினும், சூழலில் சனகெரிப்பிடமிருந்து வந்த வார்த்தைகளே கேட்கப்பட வேண்டும் என்பதைக் கருத்தில் கொண்டு இயல்பான தமிழில் சுருக்கமாக வழங்கப்பட்டுள்ளது.
- source_word: לְחָרֵף
  choice: பழித்துரைக்க
  rationale: חרף என்பதில் உள்ள அவமதித்தல், நிந்தித்தல், எதிர்த்துச் சவாலிடுதல் ஆகிய பொருள் நிழல்களில் முதன்மையான இகழ்ச்சிச் செயலை ‘பழித்துரைக்க’ தெளிவாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֱלֹהִים חָי
  choice: உயிருள்ள கடவுள்
  rationale: உயிரற்ற சிலைகளுக்கு எதிர்மாறாக இஸ்ரவேலின் கடவுளைச் சுட்டும் நிலையான வேதாகமச் சொல்லாட்சியை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே இருப்பதால் அதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- issue: לְחָרֵף என்பதன் கடவுளை நோக்கிய பொருள் நிழல்
  choice: பழித்துரைக்க
  alternative: சவால்விட / இகழ
  rationale: முதன்மையாக உள்ள அவமதிப்பையும் நிந்தனையையும் தக்கவைக்கிறது; மோதலான ‘சவால்விடுதல்’ என்ற நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
