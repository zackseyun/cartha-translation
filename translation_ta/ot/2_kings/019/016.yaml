  register: நவீனத் தரத் தமிழில் கண்ணியமான வேண்டுதல் நடையைப் பேணுவதற்காக ‘உமது’, ‘கேளும்’, ‘பாரும்’ பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் மீளுரையும் கேள்—பார் இணை அமைப்பும் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
