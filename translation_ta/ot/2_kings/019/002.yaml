  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: ta
  text: அவன் அரண்மனைப் பொறுப்பாளரான எலியாக்கீமையும்[a], எழுத்தரான செப்னாவையும், ஆசாரியர்களின் மூப்பர்களையும் சாக்குத்துணி அணிந்தவர்களாக[b], ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசியிடம் அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரண்மனைப் பொறுப்பாளர்’ என்பது அரச அரண்மனை அல்லது அரச குடும்ப நிர்வாகத்திற்குப் பொறுப்பான உயர்நிலை அதிகாரியைக் குறிக்கிறது. எபிரெயத்தில் சொல்லுக்குச் சொல், ‘வீட்டின்மேல் இருந்தவன்.’
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘சாக்குத்துணியைப் போர்த்திக்கொண்டவர்களாக.’ எபிரெயப் பங்கேற்புவினை, அவர்கள் அதை அணியும் செயலையோ அணிந்திருந்த நிலையையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அவன் ... அனுப்பினான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; எழுவாய் முந்தைய சூழலிலிருந்து பெறப்படுகிறது.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: அரண்மனை நிர்வாகப் பொறுப்பாளரான
  rationale: சொல்லுக்குச் சொல் ‘வீட்டின்மேல் இருந்தவன்’ என்று தராமல், அரச வீட்டின் அல்லது அரண்மனையின் உயர்நிலைப் பொறுப்பாளர் என்ற பதவிப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַסֹּפֵר
  choice: எழுத்தரான
  rationale: எழுத்தர் அல்லது அரசுச் செயலர் எனப் பொருள்படக்கூடிய பதவியை அளவுக்கு மீறிக் குறுக்காமல் நேரடியாகக் குறிக்கிறது.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் மூப்பர்கள்
  rationale: ‘ஆசாரியர்களின் மூப்பர்கள்’ என்ற எபிரெயக் கட்டமைப்பைப் பாதுகாக்கிறது; ‘முதன்மை ஆசாரியர்கள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: சாக்குத்துணி அணிந்திருந்த
  rationale: துக்கம் மற்றும் தாழ்மையின் வெளிப்புற அடையாளத்தை இயல்பான தமிழில் தருகிறது; பங்கேற்புவினையின் விளைவுநிலையை முதன்மைப்படுத்துகிறது.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: ஏசாயா தீர்க்கதரிசியிடம்
