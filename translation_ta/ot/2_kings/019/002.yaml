translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘அரண்மனை நிர்வாகப் பொறுப்பாளர்’ வாசகருக்குத் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டது; மூல மொழியின் நேரடி சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘சாக்குத்துணி’ துக்கம் மற்றும் தாழ்மையைக் குறிக்கும் வரலாற்றுப் படிமத்தை விளக்கச் சேர்க்காமல் வைத்திருக்கிறது.
