base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: ta
  text: அவன் வந்த அதே வழியாகவே[a] திரும்பிச் செல்வான்; இந்த நகரத்துக்கு அவன் வரமாட்டான் என்று யாவே அறிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “அவன் எந்த வழியாக வந்தானோ, அந்த வழியாகவே திரும்புவான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: அவன் வந்த அதே வழியாகவே
  rationale: דֶּרֶךְ என்பது ‘வழி/பாதை’ எனப் பொருள்படும். எபிரெய வாக்கியத்தில் ‘எந்த வழியில் வந்தானோ, அதிலேயே’ என்ற தொடர்பு வெளிப்படையாக உள்ளது; இயல்பான நவீன தமிழில் அதன் பொருள் ‘வந்த அதே வழியாகவே’ என்று தெளிவாக வழங்கப்படுகிறது.
- source_word: יָשׁוּב
  choice: திரும்பிச் செல்வான்
  rationale: שׁוּב இங்கு வந்த பாதையிலேயே பின்னோக்கிச் செல்வதைக் குறிக்கிறது. ‘திரும்பிச் செல்வான்’ என்பது இலக்கை நோக்கிய மீள்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: இந்த நகரத்துக்கு அவன் வரமாட்டான்
  rationale: மூலத்தில் ‘இந்த நகரத்துக்கு’ என்பது வலியுறுத்தும் வகையில் முன்வைக்கப்பட்டுள்ளது. ‘வரமாட்டான்’ என்பது יָבֹא என்பதைக் ‘நுழையமாட்டான்’ என்று தேவையின்றி வலுப்படுத்தாமல், எதிர்கால மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: נְאֻם יְהוָה
  choice: என்று யாவே அறிவிக்கிறார்
  rationale: נְאֻם என்பது தீர்க்கதரிசன உரைகளில் வரும் அதிகாரபூர்வ அறிவிப்பு வாய்பாடு. தமிழில் ‘அறிவிக்கிறார்’ அதன் உறுதியையும் கண்ணியத்தையும் இயல்பாகத் தருகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெயம் பட்டப்பெயரை அல்ல, יהוה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தத் தனிப்பெயரைத் தமிழில் அண்மையான ஒலிவடிவமான ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் தீர்க்கதரிசன அறிவிப்புக்கேற்ற கண்ணியமும் உறுதியும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதே வழியாகவே’ என்பது எபிரெயத்தின் மீள்சுட்டலை இயல்பாக வெளிப்படுத்துகிறது.
