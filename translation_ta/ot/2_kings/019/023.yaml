source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: ta
  text: உன் தூதர்கள் மூலம் நீ ஆண்டவரை நிந்தித்து, ‘என் ஏராளமான தேர்களோடு நானே மலைகளின் உயரங்களுக்கும் லெபனோனின் கடைக்கோடிகளுக்கும் ஏறிச் சென்றேன். அதன் உயர்ந்த கேதுரு மரங்களையும் தேர்ந்தெடுக்கப்பட்ட ஊசியிலை மரங்களையும்[a] வெட்டி வீழ்த்துவேன்; அதன் செழிப்பான காட்டிலுள்ள மிகத் தொலைவான தங்குமிடத்திற்குள் நுழைவேன்’ என்று சொன்னாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊசியிலை மரங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் எந்த மரவகையைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை; ‘சைப்ரஸ் மரங்கள்’ அல்லது ‘ஃபர் மரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: உன் தூதர்கள்மூலம்
  rationale: בְּיַד என்ற கருவி/முகமை குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இங்கு מַלְאָךְ என்பது அரசியல் அல்லது இராணுவத் தூதர்களைக் குறிக்கிறது.
- source_word: חֵרַפְתָּ
  choice: நிந்தித்து
  rationale: இச்சொல்லிலுள்ள அவமதிப்பு, பழித்தல், எதிர்த்துப் பேசுதல் ஆகிய நுணுக்கங்களை dignified modern Tamil-இல் ‘நிந்தித்து’ தெளிவாகத் தருகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: மூலத்தில் יהוה அல்ல, אֲדֹנָי உள்ளது; ஆகவே தனிப்பட்ட இறைப்பெயருக்கான வடிவத்திலிருந்து வேறுபடுத்தி பட்டப்பெயராக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּרֹב רִכְבִּי
  choice: என் ஏராளமான தேர்களோடு
  rationale: தேர்களின் பெருந்தொகையைப் பற்றிய செருக்கான வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲנִי עָלִיתִי
  choice: நானே ... ஏறிச் சென்றேன்
  rationale: தனி இடப்பெயரான אֲנִי தரும் அழுத்தத்தை ‘நானே’ பாதுகாக்கிறது; மலைப்பாங்கான சூழலில் ‘ஏறிச் சென்றேன்’ இயல்பானது.
- source_word: מְרוֹם הָרִים
  choice: மலைகளின் உயரங்கள்
  rationale: ‘உயரம்/உயர்ந்த இடம்’ என்ற concrete imagery-ஐப் பாதுகாக்கிறது.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: லெபனோனின் கடைக்கோடிகள்
  rationale: יַרְכְּתֵי என்பதன் தொலைவான எல்லைகள் அல்லது உட்புறச் சென்றடைய முடியாத பகுதிகள் என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: וְאֶכְרֹת
  choice: வெட்டி வீழ்த்துவேன்
  rationale: மரங்களை வெட்டிச் சாய்ப்பதைக் குறிப்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: קוֹמַת אֲרָזָיו
  choice: அதன் உயர்ந்த கேதுரு மரங்கள்
  rationale: קוֹמָה குறிக்கும் உயரம்/நெடிதுயர்ந்த தோற்றத்தையும் லெபனோனுடன் உள்ள உடைமையுறவையும் பாதுகாக்கிறது.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: தேர்ந்தெடுக்கப்பட்ட தேவதாரு மரங்கள்
  rationale: מִבְחוֹר என்பதன் சிறந்த/தேர்ந்தெடுக்கப்பட்ட என்ற பொருளைத் தருகிறது; בְּרוֹשׁ குறிக்கும் துல்லிய மரவகை உறுதியற்றதால் அடிக்குறிப்பு சேர்க்கப்படுகிறது.
- source_word: מְלוֹן קִצֹּה
  choice: அதன் மிகத் தொலைவான தங்குமிடம்
  rationale: מָלוֹן என்பதன் தங்குமிடம் என்ற அடிப்படைப் பொருளையும் קִצּוֹ என்பதன் கடைசி எல்லை/மிகத் தொலைவு என்ற கருத்தையும் பாதுகாக்கிறது.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: அதன் செழிப்பான காடு
  rationale: כַּרְמֶל இங்கு பெயரடைபோன்ற ‘செழுமையான தோட்டநிலம்/காட்டுச் சோலை’ கருத்தைத் தரலாம்; தமிழில் இயல்பாக ‘செழிப்பான காடு’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: אֲדֹנָי என்பதை יהוה என்பதிலிருந்து வேறுபடுத்துதல்
  choice: ஆண்டவர்
  alternative: கர்த்தர் / யெகோவா
  rationale: இந்த வசனத்தின் மெய்யெழுத்து உரை אֲדֹנָי என்பதையே கொண்டுள்ளது; יהוה இல்லை. எனவே இறைப்பெயரை இறக்குமதி செய்யாமல் அதிகாரப் பட்டப்பெயராக மொழிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசனின் செருக்கான நேரடிப் பேச்சையும் கவித்துவமான மலை-காட்டு உருவகங்களையும் கண்ணியமான நடையில் பாதுகாக்கும் optimal-equivalence மொழிபெயர்ப்பு. எபிரேய வாக்கியத்தின் சில உருவகங்கள் தமிழில் புரியும்படி மெதுவாக இயல்பாக்கப்பட்டுள்ளன; மரவகை பற்றிய உண்மையான ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
