  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: ta
  text: 'இதுவே உனக்கு அடையாளம்: இந்த ஆண்டில் தானாக விளைந்ததை[a] உண்ணுங்கள்; இரண்டாம் ஆண்டில் அதிலிருந்து மீண்டும் தானாக விளையும் பயிரை[b] உண்ணுங்கள்; மூன்றாம் ஆண்டில் விதைத்து அறுவடை செய்யுங்கள்; திராட்சைத்தோட்டங்களை நட்டு, அவற்றின் கனியை உண்ணுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, விதைக்கப்படாமலே தானாக முளைத்து விளையும் பயிர்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரேயச் சொல் அரிதானது; முந்தைய ஆண்டின் விதைக்கப்படாத பயிரிலிருந்து இரண்டாம் ஆண்டில் தானாக எழும் ‘இரண்டாம் விளைச்சல்’ என்று இது பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: அடையாளம்
  rationale: אוֹת என்பது இங்கு தீர்க்கதரிசன வாக்கை உறுதிப்படுத்தும் அடையாளத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பானதும் தெளிவானதும் ‘அடையாளம்’.
- source_word: אָכוֹל
  choice: உண்ணுங்கள்
  rationale: இங்கு இந்த வடிவம் கட்டளை அல்லது எதிர்கால நிகழ்வைச் சுட்டும் வலிமையுடன் வருகிறது. சுற்றியுள்ள வேளாண் கட்டளைகளோடு இயல்பாக இணைய ‘உண்ணுங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: סָפִיחַ
  choice: தானாக விளைந்ததை
  rationale: விதைக்கப்படாமலே தானாக முளைத்து விளையும் பயிரையே இச்சொல் குறிக்கிறது. தொழில்நுட்பச் சொல்லைவிட இந்தத் தெளிவான சொற்றொடர் பொதுவாசகர்களுக்கு எளிது.
- source_word: סָחִישׁ
  choice: அதிலிருந்து மீண்டும் முளைத்து விளைவதை
  rationale: அரிதாக வரும் இச்சொல், முந்தைய ஆண்டின் தானியப் பயிரிலிருந்து இரண்டாம் ஆண்டில் தானாக எழும் இரண்டாம் விளைச்சலைக் குறிக்கலாம். பொருளின் அரிதன்மையை முற்றிலும் மறைக்காமல் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: விதைத்து அறுவடை செய்யுங்கள்
  rationale: எபிரேய வினைகள் விதைத்தல் மற்றும் அறுத்துச் சேகரித்தல் என்ற இயல்பான வேளாண் தொடரைக் குறிக்கின்றன; நவீனத் தமிழில் ‘அறுவடை செய்யுங்கள்’ தெளிவாக உள்ளது.
- source_word: וְנִטְעוּ כְרָמִים
  choice: திராட்சைத்தோட்டங்களை நட்டு
  rationale: כְרָמִים என்பது திராட்சைத்தோட்டங்களைக் குறிக்கிறது; தமிழில் வழக்கமான வேளாண் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: וְאִכְלוּ פִרְיָם
  choice: அவற்றின் கனியை உண்ணுங்கள்
  rationale: பன்மை பின்னொட்டு திராட்சைத்தோட்டங்களைக் குறிப்பிடுகிறது. ‘கனி’ என்பது פְּרִי என்பதன் நேரான, இயல்பான தமிழ் இணை.
