translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. לְךָ என்பதிலுள்ள ஒருமையை ‘உனக்கு’ எனத் தக்கவைத்து, பின்னர் வரும் பன்மைக் கட்டளைகளைத் தமிழில் மரியாதை/பன்மை வடிவில் வழங்கியுள்ளது. எபிரேய இணைப்புச் சொற்களில் இல்லாத எதிர்மறை மாறுபாட்டைச் சேர்க்காமல் தொடர் செயல்களாக மொழிபெயர்க்கப்பட்டுள்ளது.
