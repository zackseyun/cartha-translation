  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: ta
  text: “நீ கேள்விப்பட்டதில்லையா? வெகுகாலத்திற்கு முன்பே[a] அதைச் செய்தேன்; பண்டைய நாட்களிலிருந்து அதை உருவாக்கினேன்[b]. இப்போது அதை நிகழச் செய்தேன்; நீ அரண்மதில்களுள்ள நகரங்களை இடிபாடுக் குவியல்களாக மாற்றுவதற்காக[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொலைவிலிருந்து.” எபிரெயச் சொற்றொடருக்கு இடவியல் பொருளும் இருக்கலாம்; ஆனால் இங்கு அடுத்து வரும் “பண்டைய நாட்களிலிருந்து” என்பதனால் காலப் பொருள் அதிகம் பொருந்துகிறது.
