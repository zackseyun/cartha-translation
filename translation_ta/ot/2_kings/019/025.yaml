  - marker: b
    text: அல்லது, “அதை வடிவமைத்தேன்.”
    reason: lexical_alternative
  - marker: c
    text: “இடிபாடுக் குவியல்கள்” என்பதற்கான எபிரெயச் சொற்றொடர் கடினமானது; “நின்றுகொண்டிருக்கும் குவியல்கள்” அல்லது “பாழடைந்த மேடுகள்” என்றும் பொருள்கொள்ளலாம்.
    reason: textual_or_lexical_difficulty
