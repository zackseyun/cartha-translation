theological_decisions:
- issue: அசீரிய வெற்றிகளின்மேல் இறைவனுடைய ஆட்சி
  choice: அசீரிய அரசனின் அழிவுச் செயல்கள் இறைவன் தொன்மையில் உருவாக்கி இப்போது நிறைவேறச் செய்த நோக்குக்குள் நிகழ்ந்ததாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை வெறும் முன்னறிவாகத் தளர்த்துவது, அல்லது உரை கூறுவதைக் கடந்த முழுமையான தத்துவ நிர்ணயவாதமாக வலுப்படுத்துவது.
  rationale: ‘செய்தேன்,’ ‘உருவாக்கினேன்,’ ‘நிறைவேறச் செய்தேன்’ என்ற எபிரெயச் செயற்பாட்டு மொழியைப் பாதுகாக்கிறது; அதேவேளை அசீரிய வன்முறைக்கு இறைவன் ஒழுக்க அங்கீகாரம் அளித்தார் என்ற முடிவையோ, குறிப்பிட்ட தத்துவக் கோட்பாட்டையோ சேர்க்கவில்லை.
- issue: וּתְהִי என்பதன் தொடர்பும் நோக்கம்/விளைவு நிழலும்
  choice: “அது நிகழ்ந்தது” என்று பெண்பால் ஒருமை வடிவத்தை முன்னர் சுட்டப்பட்ட நிகழ்வு அல்லது ஏற்பாட்டுடன் தொடர்புபடுத்தி, அடுத்து வரும் செயலை “மாற்றும்படி” என வழங்குகிறது.
  alternative: முன்னிலையிலுள்ள அரசனை நேரடியாக எழுவாயாக்கி, “நீ ... பாழாக்கும்படி” என்பதை மட்டும் கூறுவது.
  rationale: எபிரெய பெண்பால் ஒருமை வினைவடிவத்தை மறைக்காமல் காக்கிறது; அதேநேரம் அடுத்துள்ள இலக்கு/விளைவு கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
