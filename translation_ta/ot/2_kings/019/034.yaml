  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: ta
  text: நான் இந்த நகரத்தை மீட்பதற்காக அதைப் பாதுகாப்பேன்[a]; எனக்காகவும் என் ஊழியனான தாவீதுக்காகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை விடுவிப்பேன்.’ எபிரெய வினைச்சொல் ஆபத்திலிருந்து ‘மீட்பது’ அல்லது ‘விடுவிப்பது’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: காத்து
  rationale: גנן என்பது மூடிக் காத்தல் அல்லது பாதுகாத்தல் என்னும் பொருளைத் தருகிறது. முற்றுகைச் சூழலில் ‘காத்து’ என்பது இயல்பான, தெளிவான இராணுவப் பாதுகாப்புப் பொருளை வெளிப்படுத்துகிறது.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: இந்த நகரத்தை
  rationale: גנן உடன் வரும் אֶל, பாதுகாப்புச் செயல் நோக்கிச் செல்லும் பொருளைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக ‘இந்த நகரத்தை’ என்பது இயல்பாக உள்ளது.
- source_word: לְהוֹשִׁיעָהּ
  choice: அதை மீட்பேன்
  rationale: ישע ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது மீட்டல் என்று பொருள்படும். முன் வரும் ‘காத்து’ என்பதுடன் தேவையற்ற சொல் மறுபடிவைத் தவிர்த்து, விடுவிக்கும் விளைவை ‘மீட்பேன்’ தெளிவாகத் தருகிறது.
- source_word: לְמַעֲנִי
  choice: எனக்காக
  rationale: இறைவனுடைய சொந்த நோக்கமே செயலுக்கான காரணம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: என் ஊழியனாகிய தாவீதுக்காகவும்
  rationale: ‘என் ஊழியன் தாவீது’ என்ற அடைமொழியையும், இரண்டாவது காரணமாக வரும் לְמַעַן அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: எருசலேமை மீட்பதற்கான இறை நோக்கம்
  choice: இறைவன் தமக்காகவும் தமது ஊழியன் தாவீதுக்காகவும் நகரத்தைக் காத்து மீட்பதாக உரை கூறுகிறது.
  alternative: தாவீதைக் குறித்த சொற்றொடரை, பரந்த உடன்படிக்கைச் சார்பை வலியுறுத்தாமல், கடந்தகால வாக்குறுதிகளுக்கான குறிப்பாக மட்டும் வாசிக்கலாம்.
  rationale: எபிரெய உரை לְמַעַן என்பதன் மூலம் இரண்டு காரணங்களையும் வெளிப்படையாக வழங்குகிறது. மொழிபெயர்ப்பு அவற்றை விரிவாக்காமலும் ஒன்றோடொன்று கலக்காமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய இணைப்பின் தொடர்ச்சியையும் நோக்கத்தையும் தமிழில் தெளிவாக்குவதற்காக இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது; இறையியல் விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
