  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: ta
  text: அரசன் எசேக்கியா அதைக் கேட்டதும், தன் ஆடைகளைக் கிழித்துக்கொண்டு, சாக்குத்துணியைப் போர்த்திக்கொண்டு, யாவேயின் ஆலயத்திற்குள் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: அதைக் கேட்டபோது
  rationale: எபிரெயக் கதைநடையின் தொடர் நிகழ்வு மற்றும் காலத் தொடர்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘அப்போது நிகழ்ந்ததாவது’ என்ற சொற்சொல் வடிவம் தேவையற்றதாக இருக்கும்.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: எசேக்கியா அரசன்
  rationale: பெயருக்குப் பின் பட்டத்தை வைப்பது இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்து
  rationale: துக்கம் மற்றும் மனவேதனையைக் காட்டும் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: துக்க ஆடையைப் போர்த்திக்கொண்டு
  rationale: שַׂק குறிக்கும் முரட்டு நார்த்துணியையும் அதன் துக்கப் பயன்பாட்டையும் சாதாரண தமிழ் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயத்திற்குள் சென்றான்
  rationale: בוא என்பதின் உள்ளே செல்லும் இயக்கத்தையும், இச்சூழலில் ‘யெகோவாவின் வீடு’ என்பது ஆலயம் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றப்படவில்லை. ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு; ‘யெகோவா’ நவீன தமிழ் வேதாகம வாசகர்களிடையே அதிகம் அறியப்படும் பெயர்வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது.
- issue: בֵּית יְהוָה என்பதன் வடிவம்
  choice: யெகோவாவின் ஆலயம்
  alternative: யெகோவாவின் வீடு
  rationale: சொற்சொல்லாக ‘வீடு’ என்றாலும், இவ்வரலாற்றுச் சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. துக்கச் சடங்கை விளக்க ‘சாக்குத்துணி’ என்ற அரிதான அல்லது தவறாகப் புரியக்கூடிய சொல்லுக்குப் பதில் ‘துக்க ஆடை’ பயன்படுத்தப்பட்டுள்ளது.
