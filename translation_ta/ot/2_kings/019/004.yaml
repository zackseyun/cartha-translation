base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: ta
  text: ஒருவேளை உமது கடவுளாகிய யாவே, அசீரிய அரசனாகிய தன் எஜமான் உயிருள்ள கடவுளைப் பழித்துப் பேச அனுப்பிய ரப்சாக்கே[a] சொன்ன எல்லா வார்த்தைகளையும் கேட்டு, தாம் கேட்ட அந்த வார்த்தைகளுக்காகக் கண்டிப்பார்[b]. ஆகவே, இன்னும் எஞ்சியிருக்கும் மீதியானவர்களுக்காக மன்றாட்டை ஏறெடுங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரப்சாக்கே” என்பது அசீரிய அரசவையின் ஓர் அதிகாரப் பட்டமாக இருக்கலாம்; “தலைமைப் பானபாத்திரக்காரன்” என்ற பொருளும் முன்வைக்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில், “தாம் கேட்ட அந்த வார்த்தைகளுக்காகக் கண்டிப்பார்” என உள்ளது. இதை “அந்த வார்த்தைகளைக் கண்டிப்பார்” அல்லது “அந்த வார்த்தைகளின் காரணமாக நியாயந்தீர்ப்பார்” என்றும் புரிந்துகொள்ளலாம்; யாரைக் கண்டிப்பார் என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: textual_ambiguity
  - marker: c
    text: எபிரெய மொழிநடை சொல்லுக்குச் சொல், “மன்றாட்டை உயர்த்துங்கள்”; அதாவது, “மன்றாடுங்கள்” அல்லது “விண்ணப்பம் செய்யுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: உறுதியை அல்ல, நம்பிக்கையோடு எதிர்பார்க்கப்படும் சாத்தியத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יִשְׁמַע
  choice: கேட்டு
  rationale: אוּלַי உடன் வரும் வினை நம்பிக்கையுடன் எதிர்பார்க்கப்படும் சாத்தியத்தைக் குறிக்கிறது; தமிழில் தொடர்வினையாக அமைத்ததால் அடுத்த செயலும் இயல்பாக இணைகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: רַב שָׁקֵה
  choice: ரப்சாக்கே
  rationale: இது அசீரிய அதிகாரப் பட்டமாக இருக்கலாம்; அதன் துல்லியமான பதவிப் பொருள் உறுதியில்லாததால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: לְחָרֵף
  choice: பழித்துப் பேச
  rationale: உயிருள்ள கடவுளுக்கு எதிராக இழிவாகவும் அவமதிப்பாகவும் பேசும் சூழல்பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: אֱלֹהִים חַי
  choice: உயிருள்ள கடவுள்
  rationale: மூலத்தின் நேரடியான பொருளையும் உயிரற்ற சிலைகளோடு உள்ள மறைமுக முரண்பாட்டையும் காக்கிறது.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: அந்த வார்த்தைகளுக்காக அவனைக் கண்டிப்பார்
  rationale: הוכיח என்பதன் கண்டித்தல்/குற்றத்தை வெளிப்படுத்துதல் சார்ந்த பொருளையும், ב தொடர் வார்த்தைகள் அதற்கான காரணம் என்பதையும் தெளிவாகத் தருகிறது; மறைந்துள்ள செயப்படுபொருள் சூழலிலிருந்து 'அவனை' என வெளிப்படுத்தப்படுகிறது.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: மன்றாட்டை ஏறெடுங்கள்
  rationale: சொல்லுக்குச் சொல் உள்ள 'மன்றாட்டை உயர்த்துதல்' என்ற எபிரெய மொழிநடையைத் தமிழின் வழிபாட்டு மற்றும் பொது மதநடையில் புரியக்கூடிய வடிவில் காக்கிறது.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: எஞ்சியிருக்கும் மீதியானோர்
  rationale: மீதியாகப் பாதுகாக்கப்பட்ட மக்கள் என்ற கருத்தையும், இன்னும் காணப்படுகிற/எஞ்சியிருக்கிறவர்கள் என்ற மூலத்தின் இரட்டைக் கூறையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது உரையின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: הוכיח என்பதன் செயப்படுபொருளும் நுண்பொருளும்
  choice: அவனைக் கண்டிப்பார்
  alternative: அந்த வார்த்தைகளைக் கண்டிப்பார் / அந்த வார்த்தைகளுக்காக நியாயந்தீர்ப்பார்
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. சூழலில் அசீரிய தூதனையோ அவனை அனுப்பிய தரப்பையோ கடவுள் கண்டிப்பார் என்பது இயல்பான வாசிப்பு; எனினும் மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הַשְּׁאֵרִית என்பதன் கருத்து
  choice: மீதியானோர்
  alternative: தப்பிப் பிழைத்தவர்கள் / எஞ்சியவர்கள்
  rationale: '''மீதியானோர்'' என்பது மூலத்தின் முக்கியமான வேதாகமச் சொல்லிணைப்பைக் காக்கிறது; அதே நேரத்தில் הַנִּמְצָאָה என்பதற்காக ''எஞ்சியிருக்கும்'' என்பதும் சேர்க்கப்பட்டுள்ளது.'
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைக்குரிய ஒருமை வடிவமான “உமது/ஏறெடுங்கள்” பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமாகவும் பொதுவாசகர்களுக்குப் புரியும்படியும் வைக்கப்பட்டுள்ளது; “மீதியானோர்” போன்ற முக்கிய வேதாகமச் சொல் மட்டும் அதன் கருத்துத் தொடர்ச்சிக்காகப் பாதுகாக்கப்பட்டுள்ளது.
