revisions:
- from: ஒருவேளை, உமது கடவுளாகிய யாவே, அசீரிய அரசனாகிய தன் எஜமான் உயிருள்ள கடவுளைப் பழித்துப் பேச அனுப்பிய ரப்சாக்கே[a] சொன்ன எல்லா வார்த்தைகளையும் கேட்டு, உமது கடவுளாகிய யாவே தாம் கேட்ட அந்த வார்த்தைகளுக்காக அவனைக் கண்டிப்பார்[b]. ஆகவே, எஞ்சியிருக்கும் மீதியானோருக்காக மன்றாட்டை ஏறெடுங்கள்[c].
  to: ஒருவேளை உமது கடவுளாகிய யாவே, அசீரிய அரசனாகிய தன் எஜமான் உயிருள்ள கடவுளைப் பழித்துப் பேச அனுப்பிய ரப்சாக்கே[a] சொன்ன எல்லா வார்த்தைகளையும் கேட்டு, தாம் கேட்ட அந்த வார்த்தைகளுக்காகக் கண்டிப்பார்[b]. ஆகவே, இன்னும் எஞ்சியிருக்கும் மீதியானவர்களுக்காக மன்றாட்டை ஏறெடுங்கள்[c].
  rationale: The revision retains all of the source’s major lexical and theological content while not making the implied object of וְהוֹכִיחַ explicit. It also improves the final remnant phrase’s naturalness without reducing its twofold Hebrew emphasis.
