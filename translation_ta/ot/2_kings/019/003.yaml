translation_notes:
  register: நவீன நிலையான தமிழில், அரசரின் செய்திக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூன்று துன்பப் பெயர்களின் அணிவகுப்பும் பிரசவ உருவகத்தின் அதிர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன; கடினமான מַשְׁבֵּר சொல்லின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
