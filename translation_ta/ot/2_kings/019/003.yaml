source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: ta
  text: 'அவர்கள் அவரிடம், “எசேக்கியா கூறுவது இதுவே: ‘இந்நாள் நெருக்கமும் கண்டனமும் அவமதிப்பும்[c] நிறைந்த நாள். ஏனெனில், பிள்ளைகள் பிறக்கும் தருணத்துக்கு வந்துவிட்டார்கள்[a][b]; ஆனால் பெற்றெடுக்க வலிமை இல்லை’” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பிள்ளைகள் பிறக்கும் தருணத்துக்கு வந்துவிட்டார்கள்.” பிரசவம் குழந்தை பிறக்கும் கட்டத்தை எட்டியும், பெற்றெடுப்பதற்கான வலிமை இல்லாமல் போவதே இங்கு உருவகமாகக் கூறப்படுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “பிள்ளைகள் பிரசவ இருக்கைக்கு வந்துவிட்டார்கள்.” מַשְׁבֵּר என்ற எபிரெயச் சொல் பொருள் காண்பதற்குக் கடினமானது; அது பிரசவத்தின் இடத்தையோ தருணத்தையோ இன்னும் நேரடியாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவமதிப்பு” என்பதற்கு மாற்றாக, “இகழ்ச்சி” அல்லது “நிந்தை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: அரசரின் செய்தியை அறிமுகப்படுத்தும் எபிரெய வழக்குச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יוֹם צָרָה
  choice: நெருக்கம் நிறைந்த நாள்
  rationale: צָרָה குறிக்கும் கடும் துன்பநிலையையும் அழுத்தத்தையும் ‘நெருக்கம்’ சுருக்கமாகவும் பொருத்தமாகவும் வெளிப்படுத்துகிறது.
- source_word: וְתוֹכֵחָה
  choice: கண்டனம்
  rationale: கடிந்துகொள்ளுதல், கண்டித்தல் என்ற சொல்லின் பொருளை பெயர்ச்சொல் வடிவில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּנְאָצָה
  choice: அவமதிப்பு
  rationale: இச்சொல்லிலுள்ள இகழ்ச்சி, நிந்தை, பொதுவான அவமானம் ஆகிய பொருள் எல்லைகளை ஒரு குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் குறுக்காமல் தருகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இந்நாள்
  rationale: எபிரெய மொழியின் சுட்டுவலியுறுத்தலைச் சுருக்கமான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: பிள்ளைகள் பிறக்கும் தருணத்துக்கு வந்துவிட்டார்கள்
  rationale: பிரசவம் தீர்மானக் கட்டத்தை அடைந்திருப்பதைக் குறிக்கும் உருவகத்தைத் தெளிவாகத் தருகிறது; கடினமான מַשְׁבֵּר என்பதை அதன் இடமா தருணமா எனத் தீர்மானித்துவிடாமல் அடிக்குறிப்பில் மாற்றுவாசிப்பையும் பாதுகாக்கிறது.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: ஆனால் பெற்றெடுக்க வலிமை இல்லை
  rationale: பிரசவம் நிறைவடைய வேண்டிய நேரத்தில் அதற்கான சக்தி இல்லாததே உருவகத்தின் உச்சம்; தமிழில் இயல்பாக வெளிப்படுவதற்காக எதிர்மறைத் திருப்பை ‘ஆனால்’ காட்டுகிறது.
- source_word: בָנִים
  choice: பிள்ளைகள்
  rationale: இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், பிரசவ உருவகத்தில் ஆண் குழந்தைகளை மட்டும் குறிப்பதில்லை; ‘பிள்ளைகள்’ பொதுவான சந்ததிப் பொருளைத் தருகிறது.
