base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: ta
  text: அதனால், அவற்றில் வாழ்ந்தவர்கள் வலிமை குறைந்தவர்களாய்[a], கலங்கி அவமானமடைந்தார்கள். அவர்கள் வயல்வெளிப் புல்லைப் போலவும், பசுந்தளிரைப் போலவும், கூரைகளில் வளரும் புல்லைப் போலவும், வளர்ந்து நிற்குமுன்பே கருகிப்போன பயிரைப் போலவும் இருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், ‘கை குறுகியவர்கள்’; இது வல்லமையோ செயலாற்றும் ஆற்றலோ இல்லாததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிப் பகுதி எபிரேயத்தில் செறிவான வேளாண்மைப் படிமமாக உள்ளது. இதை ‘வளர்ந்து நிற்கும் பயிருக்கு முன்பே ஏற்பட்ட கருகல்’ அல்லது ‘முளைப்பதற்குமுன்பே கருகிப்போன தாவர வளர்ச்சி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: அவற்றின் குடிகள்
  rationale: பின்னொட்டு, முந்தைய சூழலில் குறிப்பிடப்பட்ட நகரங்களைக் குறிக்கிறது. ‘குடிகள்’ என்பது அவ்விடங்களில் வாழ்ந்த மக்களை இயல்பாகக் குறிக்கிறது.
- source_word: קִצְרֵי יָד
  choice: வலிமையற்றவர்களாய்
  rationale: சொல்லுக்குச் சொல் ‘கை குறுகியவர்கள்’ என்ற இந்த எபிரேய மரபுத்தொடர், செயலாற்றும் ஆற்றலோ வல்லமையோ இல்லாத நிலையைக் குறிக்கிறது.
- source_word: חַתּוּ
  choice: கலங்கி
  rationale: இந்த வினை மனம் உடைதல், திகிலடைதல் அல்லது கலங்குதல் ஆகிய பொருட்களைத் தரலாம். ‘கலங்கி’ என்பது குறிப்பிட்ட ஓர் உளநிலையை மிகையாகத் தீர்மானிக்காமல் அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּבֹשׁוּ
  choice: அவமானமடைந்தார்கள்
  rationale: தோல்வியால் வெட்கத்திற்கும் இழிவுக்கும் உள்ளான விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֵשֶׂב שָׂדֶה
  choice: வயல்வெளிப் புல்
  rationale: வயலில் வளரும் எளிதில் வாடக்கூடிய தாவரத்தின் கவித்துவப் படிமத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וִירַק דֶּשֶׁא
  choice: பசுந்தளிர்
  rationale: பசுமையான இளம் தாவர வளர்ச்சியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲצִיר גַּגּוֹת
  choice: வீட்டுக் கூரைகளில் வளரும் புல்
  rationale: மெல்லிய மண்ணில் முளைத்து விரைவில் வாடும் கூரைப் புல் என்ற மூலப் படிமத்தை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: வளர்ந்து நிற்குமுன்பே கருகிப்போன பயிர்
  rationale: கருகல் அல்லது வாட்டம் மற்றும் பயிர் வளர்ந்து நிற்கும் நிலைக்கு முந்திய காலம் ஆகியவற்றை இயல்பான தமிழில் இணைக்கிறது; மூலத்தின் இறுதிப் படம் செறிவும் பொருள் ஐயமும் கொண்டதால் அடிக்குறிப்பில் மாற்று விளக்கங்கள் தரப்படுகின்றன.
