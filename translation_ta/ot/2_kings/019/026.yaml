  register: நவீன பொதுத்தமிழில் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. இணையான தாவரப் படிமங்களின் ஓட்டம் காக்கப்பட்டு, தெளிவுக்காக மட்டுமே குறைந்த அளவு சொற்கள் சேர்க்கப்பட்டுள்ளன; மூலத்தின் இறுதி வேளாண்மைப் படிமத்திலுள்ள ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
