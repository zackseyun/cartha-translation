  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: ta
  text: இதோ, அசீரியாவின் அரசர்கள் எல்லா நாடுகளையும் அழிவுக்கு அர்ப்பணித்து என்ன செய்திருக்கிறார்கள் என்பதை நீ கேள்விப்பட்டிருக்கிறாய்; நீயோ தப்புவாயா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெய இடைச்சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: שָׁמַעְתָּ
  choice: நீ கேள்விப்பட்டிருக்கிறாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை நிறைவுவினையின், முன்பு அறிந்த செய்தி இப்போதும் பொருத்தமுடையது என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: என்ன செய்தார்கள் என்பதை
  rationale: உறவுத்தொடரின் பொருளை இயல்பான தமிழில் காத்து வழங்குகிறது.
- source_word: מַלְכֵי אַשּׁוּר
  choice: அசீரியாவின் அரசர்கள்
  rationale: எபிரெய இணைப்புநிலையின் நேரான, தெளிவான தமிழ் வடிவம்.
- source_word: לְכָל הָאֲרָצוֹת
  choice: எல்லா நாடுகளையும்
  rationale: இங்கு אָרֶץ என்பது முழு பூமியைக் குறிக்காமல் அரசியல்-புவியியல் நாடுகள் அல்லது பிரதேசங்களைக் குறிக்கிறது; பன்மையையும் காக்கிறது.
- source_word: לְהַחֲרִימָם
  choice: அழிவுக்கென்று ஒதுக்கி
  rationale: חרם என்பதன் சாதாரண அழித்தலைவிட வலிமையான, அழிவுக்கு அர்ப்பணித்து முழுமையாக ஒழிக்கும் தனிப்பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: நீ மட்டும் தப்புவாயா?
  rationale: தனிப்பட்ட சுட்டுப்பெயர் உருவாக்கும் முரண்பாட்டு அழுத்தத்தையும், நையாண்டியான வினாவின் ஆற்றலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; Niphal வடிவத்தின் விடுபடுதல்/தப்புதல் பொருளையும் காக்கிறது.
theological_decisions:
- issue: போர்ச் சூழலில் חרם என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று ஒதுக்கி
  alternative: முற்றிலும் அழித்து
  rationale: இது பொதுவான அழித்தலை மட்டும் அல்லாமல், அழிவுக்காக ஒதுக்கப்படும் חרם என்ற நீதித்தீர்ப்பு சார்ந்த நுண்பொருளையும் காக்கிறது; அதேவேளை புரியாத தொழில்நுட்பச் சொல்லை முதன்மை உரையில் திணிப்பதில்லை.
- issue: இறுதி கூற்றின் வாக்கிய வகை
  choice: நீ மட்டும் தப்புவாயா?
  alternative: நீ தப்புவாய் என்று நினைக்கிறாயா?
  rationale: எபிரெய உரையின் சுருக்கமான நையாண்டி வினாவையும் பதற்றத்தையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நினைக்கிறாயா’ என்பதைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; அரசரிடம் விடுக்கப்படும் அச்சுறுத்தலின் நேரடியான, நையாண்டியான தொனி காக்கப்பட்டுள்ளது. ‘நீ மட்டும்’ என்பது וְאַתָּה எனும் முரண்பாட்டு வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
