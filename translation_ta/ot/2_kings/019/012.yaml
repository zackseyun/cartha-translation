base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: ta
  text: என் முன்னோர்கள் அழித்த கோசான், ஹாரான், ரெசெப் ஆகிய இடங்களையும், தெலாசாரில் இருந்த ஏதேனின் மக்களையும்[a] அந்த நாடுகளின் தெய்வங்கள் காப்பாற்றினவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தெலாசாரில் இருந்த ஏதேனின் மகன்களையும்.” இங்கு “மகன்கள்” என்பது ஏதேனைச் சேர்ந்த மக்கள் அல்லது குடியிருப்பாளர்களைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: காப்பாற்றினவா?
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் இங்கு விடுவித்தல் அல்லது அழிவிலிருந்து காப்பாற்றுதல் என்ற பொருளில் வரும் இறந்தகால வினாவாகும். சூழலில் இது எதிர்மறைப் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி.
- source_word: אֹתָם
  choice: '... ஆகிய இடங்களையும் ... மக்களையும்'
  rationale: எபிரெய உரையில் உள்ள நேரடிப் பொருள் சுட்டுப்பெயரான ‘அவர்களை’ தமிழில் பெயர்ப்பட்டியலோடு இயல்பாக இணைத்து வெளிப்படுத்தப்பட்டுள்ளது; இடப்பெயர்களுக்கும் மக்களுக்கும் இடையிலான உரைநிலைத் தெளிவின்மை அளவுக்கு மீறித் தீர்க்கப்படவில்லை.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: அந்த நாடுகளின் தெய்வங்கள்
  rationale: குறிப்பிடப்பட்ட மக்களோடு தொடர்புடைய தெய்வங்களைச் சுட்டும் எபிரெய இணைப்புத் தொடர். ‘அந்த’ என்பது தமிழில் பின்னர் வரும் உறவுத்தொடரை இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: என் முன்னோர்கள் அழித்த
  rationale: שׁחת என்பதன் பியேல் வடிவம் போர்ச் சூழலில் அழித்தல் அல்லது பாழாக்குதல் எனப் பொருள்படும். אֲבוֹתַי அரசனின் தந்தையரை மட்டும் அல்லாமல் முந்தைய தலைமுறையினரையும் குறிக்கக்கூடும் என்பதால் ‘முன்னோர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גּוֹזָן וְחָרָן וְרֶצֶף
  choice: கோசான், ஆரான், ரேசெப்
  rationale: எபிரெய ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் எழுத்துப்பெயர்ப்புகள்.
- source_word: וּבְנֵי עֶדֶן
  choice: ஏதேனின் மக்களையும்[a]
  rationale: בְנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’; இங்கு ஓர் இடம் அல்லது இனக்குழுவைச் சேர்ந்த மக்களைக் குறிக்கும் வழக்குப் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது. சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: தெலாசாரில் இருந்த
  rationale: בְּ இடவுறவையும் உறவுப்பெயரெச்சத் தொடர் அந்த மக்களின் இருப்பிடத்தையும் குறிக்கின்றன.
