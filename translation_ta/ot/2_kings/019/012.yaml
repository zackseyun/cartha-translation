translation_notes:
  register: நவீன நிலையான தமிழில், அரசரின் ஏளனமான சொல்லாட்சிக் கேள்வியின் வலிமை காக்கப்பட்டுள்ளது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமாக உள்ளது; இடப்பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
