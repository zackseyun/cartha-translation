base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: ta
  text: எசேக்கியா யாவேவின் முன்பாக ஜெபித்து, “இஸ்ரவேலின் கடவுளாகிய யாவே, கேருபீன்களின்மேல் வீற்றிருப்பவரே,[a] பூமியின் எல்லா அரசுகளின்மீதும் நீர் ஒருவரே கடவுள். வானங்களையும் பூமியையும் படைத்தீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: “கேருபீன்களின் நடுவில் வீற்றிருப்பவரே.” எபிரெயில் சொல்லுக்குச் சொல், “கேருபீன்களின் மேல்/நடுவில் அமர்ந்திருப்பவர்”; இது யாவே அரசராக வீற்றிருப்பதைச் சித்தரிக்கும் வழிபாட்டிடப் படிமம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: மன்றாடி
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘வேண்டுதல்/மன்றாடுதல்.’ கடவுளிடம் உரைக்கப்படும் வேண்டுதலை இயல்பான, கண்ணியமான தமிழில் ‘மன்றாடி’ தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதிலுள்ள ‘முன்பாக/சந்நிதியில்’ என்ற உறவு மற்றும் இடஞ்சார்ந்த உணர்வை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புநிலைத் தொடரைத் தெளிவான தமிழ் விளிவடிவத்தில் வழங்குகிறது.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: கேருபீன்களின்மேல் அரியணையில் வீற்றிருப்பவரே
  rationale: יֹשֵׁב என்பதன் நேரடிப் பொருள் ‘அமர்ந்திருப்பவர்’; இச்சூழலின் அரசருக்குரிய, வழிபாட்டிடச் சித்திரத்தை ‘அரியணையில் வீற்றிருப்பவர்’ இயல்பாக வெளிப்படுத்துகிறது. தொடர்புச் சொல்லின் இடவியல் தெளிவின்மையை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: நீர் ஒருவரே கடவுள்
  rationale: לְבַדְּךָ வலியுறுத்தும் தனித்தன்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: பூமியின் எல்லா அரசுகளின்மீதும்
  rationale: לְ என்ற முன்னொட்டு பரந்த பொருளுடையதாயினும், இங்கு எல்லா உலக அரசுகளுடனான கடவுளின் இறையாண்மைத் தொடர்பை ‘அரசுகளின்மீதும்’ தெளிவாகக் காட்டுகிறது.
- source_word: עָשִׂיתָ
  choice: படைத்தவர்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு.’ வானமும் பூமியும் பொருளாக வருவதால், தமிழில் ‘படைத்தவர்’ இயல்பாக உள்ளது; தனி எபிரெயப் படைப்புச் சொல்லை இங்கு இருப்பதாகக் கூறவில்லை.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: வானங்களையும் பூமியையும்
  rationale: எபிரெயில் உள்ள பன்மை வடிவமான ‘வானங்கள்’ என்பதையும் வழக்கமான படைப்புத் தொடரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: கடவுளின் தனித்தன்மையும் உலகளாவிய ஆட்சியும்
  choice: பூமியின் எல்லா அரசுகளின்மீதும் நீர் ஒருவரே கடவுள்
  alternative: பூமியின் எல்லா அரசுகளுக்கும் நீர் மட்டுமே கடவுள்
  rationale: לְבַדְּךָ என்பதன் தனித்தன்மையையும், எல்லா அரசுகளுடனான கடவுளின் இறையாண்மைத் தொடர்பையும் பாதுகாக்கிறது; வசனம் கூறுவதற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு வடிவமைப்பைச் சேர்க்கவில்லை.
- issue: கேருபீன்களுடனான இடவியல் தொடர்பு
  choice: கேருபீன்களின்மேல் அரியணையில் வீற்றிருப்பவரே
  alternative: கேருபீன்களிடையே குடியிருப்பவரே
  rationale: அரசருக்குரிய அரியணைச் சித்திரத்தை முதன்மை உரை வெளிப்படுத்துகிறது; ‘மேல்/இடையே’ என்ற இடவியல் வேறுபாட்டை முற்றாகத் தீர்மானிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் ஜெபத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டது; ‘கேருபீன்கள்’ என்ற மரபுசார் வேதாகமச் சொல் தக்கவைக்கப்பட்டது.
