  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: ta
  text: “நீ யாரை நிந்தித்தாய், தூஷித்தாய்[a]? யாருக்கு எதிராக உன் குரலை உயர்த்தி, உன் கண்களை உயர நோக்கி ஏறெடுத்தாய்[b]? இஸ்ரவேலின் பரிசுத்தருக்கு எதிராகவே!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பழித்தாய், வசைபாடினாய்’ என்றும் மொழிபெயர்க்கலாம். இரு எபிரெய வினைகளும் இகழ்ச்சியும் அவமதிப்பும் நிறைந்த பேச்சைக் குறிக்கும் நெருங்கிய பொருளுடைய சொற்கள்; இரண்டாவது வினை, குறிப்பாகக் கடவுளுக்கு எதிராகப் பயன்படுத்தப்படும்போது, தூஷிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லாட்சியின்படி, ‘உன் கண்களை உயர நோக்கி ஏறெடுத்தாய்.’ இது செருக்கையும் அகந்தையுடன் தன்னை உயர்த்திக்கொள்ளுதலையும் வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: நிந்தித்தாய்
  rationale: இச்சூழலில் இந்த வினை இகழ்ச்சியுடன் பழித்துப் பேசுவதைக் குறிக்கிறது. ‘நிந்தித்தாய்’ என்பது நவீனத் தமிழில் இயல்பாகவும், அடுத்துள்ள வலுவான வினையுடன் இணங்கவும் உள்ளது.
- source_word: גִדַּפְתָּ
  choice: தூஷித்தாய்
  rationale: கடவுளுக்கு எதிரான அவமதிப்பான பேச்சையும் இந்த வினை குறிக்கக்கூடும். ‘தூஷித்தாய்’ என்பது அதன் சமயரீதியான தீவிரத்தைக் காக்கிறது; அதேவேளையில் பொருளுக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: உன் குரலை உயர்த்தி
  rationale: ‘குரலை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும், அகந்தையான சவாலின் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: இறுமாப்புடன் உன் கண்களை உயர்த்தினாய்
  rationale: சொல்லாட்சியில் உயரத்தை நோக்கிக் கண்களைத் தூக்குதல் என்ற உருவகம் உள்ளது; சூழலில் அது செருக்கையும் தன்னை உயர்த்திக்கொள்ளுதலையும் வெளிப்படுத்துவதால், அதன் மறைபொருள் தமிழில் தெளிவாக்கப்பட்டுள்ளது.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பரிசுத்தர்
  rationale: இது கடவுளுக்குரிய நிலையான பட்டப்பெயர். அதைப் பொருள் விரிவாக்கமின்றி நேரடியாகத் தமிழாக்குகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: இரு இடங்களிலும் பகைமையான திசை அல்லது எதிர்ப்பைச் சுட்டுவதால் ‘எதிராக’ பொருத்தமானது.
- source_word: מִי
  choice: யாரை / யாருக்கு
  rationale: முதல் இடத்தில் வினையின் நேர்செயப்படுபொருளாகவும், அடுத்த இடத்தில் ‘எதிராக’ என்பதோடு இணைந்தும் வருவதற்கேற்ப இயல்பான தமிழ் வேற்றுமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: கடவுளுக்கு எதிரான பேச்சின் சமயரீதியான தீவிரத்தைப் பாதுகாத்தல்
  choice: גִדַּפְתָּ என்பதற்கு ‘தூஷித்தாய்’ என்றும், முடிவில் ‘இஸ்ரவேலின் பரிசுத்தருக்கு எதிராகவே!’ என்றும் வழங்குதல்
  alternative: ‘அவமதித்தாய்’ அல்லது ‘இகழ்ந்து பேசினாய்’ போன்ற பொதுவான சொற்களைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் அரசியல் செருக்கை மட்டுமல்லாமல், இஸ்ரவேலின் கடவுளுக்கு எதிரான அவமதிப்பான பேச்சையும் குற்றமாகச் சுட்டுகிறது. ‘தூஷித்தாய்’ அந்தத் தீவிரத்தைப் பாதுகாக்கிறது; இறுதி அடையாளப்படுத்தல் எபிரெய உரையின் உச்சநிலையைத் தக்கவைக்கிறது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தெய்வீக உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான வினாக்களும் இறுதியிலுள்ள வலியுறுத்தலும் எபிரெய உரையின் குற்றஞ்சாட்டும் உச்சநிலையைப் பாதுகாக்கின்றன.
