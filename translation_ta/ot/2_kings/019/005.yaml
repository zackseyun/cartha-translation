  yaml_path: translation/ot/2_kings/019/005.yaml
  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: ta
  text: அப்போது, எசேக்கியா அரசரின் பணியாளர்கள் ஏசாயாவிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: எனவே ... வந்தார்கள்
  rationale: בוא என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. முந்தைய வசனத்தில் அரசன் அனுப்பியதன் தொடர்ச்சியையும் விளைவையும் இயல்பாகக் காட்ட “எனவே” பயன்படுத்தப்பட்டுள்ளது; “வந்தார்கள்” என்பது வினையின் நேரடிப் பொருள்.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: עבד என்பதன் பன்மை இணைப்புநிலை அரசப் பணியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். அரசவைக் சூழலை உணர்த்தியபடியே மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்க “பணியாளர்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: எசேக்கியா அரசனின்
  rationale: எபிரெய வடிவம் ‘அரசன் எசேக்கியாவின்’ என்ற உறவைக் காட்டுகிறது. நவீன தமிழில் இயல்பான உடைமைத் தொடராக “எசேக்கியா அரசனின்” என வழங்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: இடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தின் இலக்கைக் குறிக்கும் முன்னிடைச்சொல். “ஏசாயாவிடம்” என்ற வடிவில் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: יְשַׁעְיָהוּ
  choice: ஏசாயா
  rationale: தீர்க்கதரிசியின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. அரசவைச் சூழலில் עַבְדֵי என்பதைக் “அதிகாரிகள்” என்று விளக்கமாகக் குறுக்காமல், “பணியாளர்கள்” என அதன் சொற்பொருள் பரப்பைத் தக்கவைத்துள்ளது.
