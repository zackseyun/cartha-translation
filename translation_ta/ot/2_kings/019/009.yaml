translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘குஷ்’ என்ற மூல இடப்பெயர் தக்கவைக்கப்பட்டுள்ளது; וַיָּשָׁב וַיִּשְׁלַח என்பது சூழலுக்கேற்ப ‘மீண்டும் அனுப்பினான்’ என வழங்கப்பட்டுள்ளது.
