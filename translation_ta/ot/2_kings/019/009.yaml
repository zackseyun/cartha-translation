base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: ta
  text: 'குஷ் நாட்டின் அரசனான திர்ஹாக்காவைப்[a] பற்றி, “இதோ, அவன் உனக்கு எதிராகப் போரிடப் புறப்பட்டு வந்திருக்கிறான்” என்று அவன் கேள்விப்பட்டபோது, அவன் திரும்பி, எசேக்கியாவிடம் தூதுவர்களை அனுப்பி, இவ்வாறு கூறினான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எத்தியோப்பியாவின் அரசன்’ என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெய மூலத்தில் ‘குஷ்’ என்று உள்ளது; இது எகிப்துக்குத் தெற்கே இருந்த பண்டைய பகுதி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: பற்றி ... கேள்விப்பட்டபோது
  rationale: שׁמע உடன் வரும் אֶל கேட்ட செய்தியின் பொருளை அறிமுகப்படுத்துகிறது. தொடர் நிகழ்வில் இதன் காலத் தொடர்பை இயல்பான தமிழில் ‘கேள்விப்பட்டபோது’ வெளிப்படுத்துகிறது.
- source_word: תִּרְהָקָה
  choice: திர்ஹாக்கா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நேரடியாகப் பெயர்த்தெழுதுகிறது.
- source_word: מֶלֶךְ כּוּשׁ
  choice: குஷ் நாட்டின் அரசன்
  rationale: வரலாற்றுப் பகுதியின் எபிரெயப் பெயரான ‘குஷ்’ என்பதையே தக்கவைத்து, அதை நவீன எத்தியோப்பியாவுடன் தவறாக முழுமையாக ஒப்பிடுவதைத் தவிர்க்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிக்கையின்மீது கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லுக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: உனக்கு எதிராகப் போரிடப் புறப்பட்டு வந்திருக்கிறான்
  rationale: יצא என்பதின் புறப்படுதலையும், போர் சூழலில் אִתָּךְ குறிக்கும் எதிர்நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: மீண்டும் ... அனுப்பி
  rationale: ‘திரும்பி அனுப்பினான்’ என்ற எபிரெயத் தொடரின் இச்சூழலிலுள்ள மறுசெயல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது உடல்ரீதியாகப் பின்வாங்கினான் என்று தேவையின்றி முடிவுசெய்யாது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இராணுவ-அரசியல் சூழலில் இது மனிதச் செய்தியாளர்களைக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொல்லச் சொன்னான்
  rationale: தூதுவர்கள் வழியாக அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
