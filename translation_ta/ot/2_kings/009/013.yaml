base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: ta
  text: உடனே அவர்கள் விரைந்து, ஒவ்வொருவரும் தன் மேலாடையை எடுத்து, அவனுக்குக் கீழே படிக்கட்டுகளின் வெற்றுப் பரப்பின்மேல்[a] வைத்தார்கள். பின்பு ஊதுகொம்பை[b] ஊதி, “யெகூ அரசனானார்!” என்று அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படிக்கட்டுகளின் உச்சியில்” அல்லது “படிக்கட்டுத் தளத்தில்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொற்றொடர் அரிதானது, அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஷோஃபார்; சமிக்ஞை கொடுக்கப் பயன்படுத்தப்பட்ட ஒரு கொம்பு. மரபாக இது “எக்காளம்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: உடனே அவர்கள் விரைந்து
  rationale: מהר என்பது விரைவாகச் செயல்படுவதைக் குறிக்கிறது; தொடக்க வாவ் காட்டும் உடனடியான கதைத் தொடரையும் இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ בִּגְדוֹ
  choice: ஒவ்வொருவரும் தன் மேலாடையை
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; בֶּגֶד என்பதற்கு சூழலில் வெளிப்புற ஆடையைக் குறிக்கும் இயல்பான ‘மேலாடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: அவனுக்குக் கீழே விரித்தார்கள்
  rationale: תַחְתָּיו என்பதிலுள்ள ஒருமைச் சுட்டு யெகூவைக் குறிப்பதாக இயல்பாகப் புரிகிறது. ஆடைகளைப் படிகளில் இடும் செயலைத் தமிழில் தெளிவாகக் காட்ட ‘விரித்தார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: படிக்கட்டுகளின் வெற்றுப் பரப்பின்மேல்
  rationale: இது அரிதானதும் துல்லியப் பொருள் உறுதியில்லாததுமான எபிரெயச் சொற்றொடர். படிகளின் வெளிப்பட்ட அல்லது வெற்றுப் பரப்பைக் குறிக்கும் சாத்தியத்தை முதன்மை உரை தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: ஊதுகொம்பை ஊதி
  rationale: שׁוֹפָר என்பது சமிக்ஞை கொடுக்க ஊதப்படும் கொம்பு. ‘ஊதுகொம்பு’ சாதாரண வாசகருக்குப் புரியக்கூடியதாயும், பொதுவான ‘எக்காளம்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானதாயும் உள்ளது.
- source_word: מָלַךְ יֵהוּא
  choice: யெகூ அரசனானார்
  rationale: מָלַךְ என்ற நிறைவேற்ற வினை யெகூவின் அரசேற்றம் நிகழ்ந்துவிட்டதை அறிவிக்கிறது. ‘அரசனானார்’ அந்த நிகழ்வுப் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: மָלַךְ என்ற வினையின் அரசேற்றப் பொருளா அல்லது நிலைப் பொருளா
  choice: யெகூ அரசனானார்
  alternative: யெகூ அரசர் / யெகூ ஆட்சி செய்கிறார்
  rationale: எபிரெய நிறைவேற்ற வடிவம் அரசேற்றம் நிகழ்ந்ததை அறிவிக்கும் பொருளைக் கொண்டிருக்கலாம். தமிழில் ‘அரசனானார்’ அதை வெளிப்படுத்துகிறது; இது தெய்வீக அங்கீகாரம் போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வரலாற்றுக் கதைநடையின் கண்ணியத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. அரிதான படிக்கட்டு தொடர்பான சொற்றொடரின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
