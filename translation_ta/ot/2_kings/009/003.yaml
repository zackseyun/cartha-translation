source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: ta
  text: 'பின்பு எண்ணெய்க் குடுவையை எடுத்து, அந்த எண்ணெயை அவனுடைய தலையின்மேல் ஊற்றி, ‘யாவே இவ்வாறு கூறுகிறார்: நான் உன்னை இஸ்ரவேலின்மேல் அரசனாக அபிஷேகம் செய்தேன்’ என்று சொல். அதன்பின் கதவைத் திறந்து தப்பியோடு; காத்திருக்காதே.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: எண்ணெய்க் குடுவை
  rationale: פַךְ என்பது திரவம் வைக்கும் சிறிய பாத்திரத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘குடுவை’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது; הַשֶּׁמֶן என்பதை ‘எண்ணெய்’ என்று மட்டுமே மொழிபெயர்த்து, மூலத்தில் இல்லாத ‘ஒலிவ எண்ணெய்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: அந்த எண்ணெயை அவனுடைய தலையின்மேல் ஊற்றி
  rationale: יצק உடன் עַל வருவது தலையின்மேல் ஊற்றுதலை நேரடியாகக் குறிக்கிறது. தமிழில் கருப்பொருள் தெளிவாக இருக்க ‘அந்த எண்ணெயை’ என்று குறிப்பிடப்பட்டது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் கண்ணியமான, இயல்பான தமிழாக்கம். יהוה என்ற தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: מְשַׁחְתִּיךָ
  choice: நான் உன்னை … அபிஷேகம் செய்தேன்
  rationale: எபிரெய நிறைவுவினைச் செயல் நிறைவேறியதாக உள்ளது; அரச நியமனச் சடங்கின் மொழிநடையையும் ‘அபிஷேகம் செய்தேன்’ இயல்பாகத் தருகிறது.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு அரசனாக
  rationale: לְמֶלֶךְ பதவிக்கான நியமனத்தைக் குறிக்கிறது. אֶל என்பதன் அடிப்படை உறவைத் தமிழில் ‘இஸ்ரவேலுக்கு’ எனப் பாதுகாத்து, ஆட்சியுறவைச் சுட்டும் மாற்று வாசிப்பை அடிக்குறிப்பில் அளிக்கிறது.
- source_word: וְנַסְתָּה
  choice: தப்பியோடு
  rationale: נוס ஆபத்திலிருந்து விரைவாக அகல்வதைக் குறிக்கிறது. ‘தப்பியோடு’ கட்டளையின் அவசரத்தையும் பாதுகாப்புக்காக ஓடுவதையும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא תְחַכֶּה
  choice: காத்திருக்காதே
  rationale: חכה என்பதன் நேரடியான பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்தது.
- issue: אֶל יִשְׂרָאֵל என்ற அரச நியமன உறவு
  choice: இஸ்ரவேலுக்கு அரசனாக
  alternative: இஸ்ரவேலின்மேல் அரசனாக
  rationale: אֶל என்பதன் வடிவத்தை முதன்மை உரை நெருக்கமாகப் பாதுகாக்கிறது; ஆனால் அரச நியமனச் சூத்திரத்தில் ஆளுகை உறவு நோக்கமாக இருக்கலாம் என்பதால் அந்த இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் முறையான தொனி காக்கப்பட்டுள்ளது; தேவையற்ற விளக்கவிரிவுகள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
