base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: ta
  text: யெஸ்ரயேலில் உள்ள கோபுரத்தின் மேல் காவலாளி நின்றுகொண்டிருந்தான். யெகூ வந்துகொண்டிருக்கையில், அவனுடைய கூட்டத்தைக் காவலாளி கண்டு, “ஒரு கூட்டத்தை நான் காண்கிறேன்” என்றான். யெகோராம், “ஒரு குதிரைவீரனை அழைத்து, அவர்களைச் சந்திக்க அனுப்பு. அவன் அவர்களிடம், ‘சமாதானமா?[a]’ என்று கேட்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான தமிழில், “எல்லாம் நலமா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: காவலாளி
  rationale: கோபுரத்திலிருந்து கண்காணிப்பவரை இயல்பாகக் குறிக்கிறது; தீர்க்கதரிசி என்ற தேவையற்ற உட்பொருளைச் சேர்ப்பதில்லை.
- source_word: עֹמֵד
  choice: நின்றுகொண்டிருந்தான்
  rationale: எபிரெயப் பெயரெச்சத்தின் தொடர்நிலை, பின்னணிக் காட்சியைப் பாதுகாக்கிறது.
- source_word: הַמִּגְדָּל
  choice: கோபுரம்
  rationale: மூலச்சொல்லின் பொதுவான பொருள் ‘கோபுரம்’; சூழலிலிருந்து மட்டும் வரும் ‘காவற்கோபுரம்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: בְּיִזְרְעֶאל
  choice: யெஸ்ரயேலில்
  rationale: இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שִׁפְעַת
  choice: கூட்டம்
  rationale: கண்ணுக்குத் தெரியும் திரளான குழுவைக் குறிக்கும் இயல்பான தமிழ்; அதன் அளவை மிகைப்படுத்துவதில்லை.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּבֹאוֹ
  choice: வந்துகொண்டிருக்கையில்
  rationale: யெகூ அணுகிவந்த நேரத்தைக் குறிக்கும் தொடர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: ஒரு கூட்டத்தை நான் காண்கிறேன்
  rationale: முந்தைய ‘கூட்டம்’ என்ற சொல்லை மீண்டும் பயன்படுத்தி மூலத்தின் சொல்லடுக்கையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: קַח רַכָּב
  choice: ஒரு குதிரைவீரனை அழைத்து
  rationale: ஒரே ஒரு ஏறிச் செல்லும் தூதரைச் சூழல் குறிக்கிறது; தமிழில் கட்டளையை இயல்பாகச் சொல்ல ‘அழைத்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க அனுப்பு
  rationale: மசோரா உரையிலுள்ள பன்மை விகுதியைத் தக்கவைத்து, யெகூவை மட்டும் அல்லாமல் கூட்டத்தையே குறிக்கிறது.
- source_word: וְיֹאמַר
  choice: அவன் … கேட்கட்டும்
  rationale: கட்டளைத் தொடரிலுள்ள மறைமுகக் கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கேள்வி உரையாதலால் ‘சொல்லட்டும்’ என்பதற்குப் பதில் ‘கேட்கட்டும்’ இயல்பானது.
- source_word: הֲשָׁלוֹם
  choice: சமாதானமா?
  rationale: ‘சமாதானம்?’ என்ற எபிரெயச் சுருக்கத்தையும் இப்பகுதியில் மீண்டும் வரும் மையச்சொல்லையும் காக்கிறது.
theological_decisions:
- issue: 'הֲשָׁלוֹם என்பதன் பொருள்: அமைதியான நோக்கமா அல்லது பொதுவான நலமா?'
  choice: சமாதானமா?
  alternative: எல்லாம் நலமா?
  rationale: மூலத்தின் சுருக்கத்தையும் ‘சமாதானம்’ என்ற மீள்வடிவத்தையும் முதன்மை உரை காக்கிறது; கேள்வியின் பரந்த நடைமுறைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் தொடக்கத்தில் அதற்கு இணையான சொல் சேர்க்கப்படவில்லை. ‘சமாதானமா?’ என்ற சுருக்கமான கேள்வி மூலத்தின் தெளிவின்மையையும் இலக்கிய மீள்வடிவத்தையும் தக்கவைக்கிறது.
