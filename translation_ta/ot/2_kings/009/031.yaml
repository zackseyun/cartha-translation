base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: ta
  text: யெகூ வாசலுக்குள் வந்தபோது, அவள், “சமாதானமா,[b] தன் எஜமானைக் கொன்றவனாகிய சிம்ரியே?[a][c]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யேசபேல் யெகூவை ‘சிம்ரி’ என்று கேலியாக அழைக்கிறாள். தன் எஜமானைக் கொன்று அரியணையைக் கைப்பற்றிய சிம்ரியுடன் அவனை ஒப்பிடுகிறாள்; 1 இராஜாக்கள் 16:9–20 பார்க்கவும்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “எல்லாம் நலமா?”
    reason: lexical_alternative
  - marker: c
    text: சொற்படியாக, “தன் எஜமானைக் கொல்பவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: வாசலுக்குள் வந்தபோது
  rationale: בּוֹא என்பது ‘வருதல்’ அல்லது ‘உள்ளே நுழைதல்’ என்றும், שַׁעַר என்பது ‘வாசல்’ என்றும் பொருள்படும். இச்சூழலில் நகர வாசல் வழியாக யெகூ உள்ளே வருவதைக் இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: וַתֹּאמֶר
  choice: அவள் … என்றாள்
  rationale: பெண்பால் ஒருமை வினை வடிவம் முந்தைய சூழலில் வரும் யேசபேலைக் குறிக்கிறது; தமிழில் இயல்பான நேர்க்கூற்று அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֲשָׁלוֹם
  choice: சமாதானமா
  rationale: שָׁלוֹם அமைதி, நலம், சுகநிலை ஆகிய பொருள்களைத் தாங்குகிறது. எபிரெயச் சொல்லின் சுருக்கத்தையும் கேலியுடன் கூடிய கூர்மையான கேள்வியையும் ‘சமாதானமா’ காக்கிறது.
- source_word: זִמְרִי
  choice: சிம்ரியே
  rationale: பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது. விளி வேற்றுமை, யேசபேல் யெகூவைச் சிம்ரி என்று கேலியாக அழைப்பதைத் தெளிவாக்குகிறது.
- source_word: הֹרֵג
  choice: கொன்ற
  rationale: இச்சொல் சொற்படியாக ‘கொல்பவன்’ என்ற செய்பெயர் வடிவம். தமிழில் சிம்ரியைப் பற்றிய வரலாற்றுச் செயலைக் குறிக்கும் இயல்பான அடைமொழியாக ‘கொன்ற’ பயன்படுத்தப்பட்டுள்ளது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲדֹנָיו
  choice: தன் எஜமானை
  rationale: אָדוֹן இங்கு மனித அதிகாரியையோ அரசனையையோ குறிக்கிறது. ‘எஜமான்’ மூலத்தின் எஜமான்–கீழ்ப்பட்டவன் உறவைப் பாதுகாக்கிறது; ‘தன்’ என்பது எபிரெய மொழியிலுள்ள மூன்றாம் நபர் உடைமையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ‘தன் எஜமானைக் கொன்ற சிம்ரி’ என்ற அழைப்பின் பொருள்
  choice: யெகூவின் இயற்பெயராக அல்லாமல், முன்பு தன் எஜமானைக் கொன்று அரியணையைக் கைப்பற்றிய சிம்ரியுடன் யெகூவை ஒப்பிடும் கேலிப் பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: எந்த விளக்கமும் இன்றி, ‘சமாதானமா, தன் எஜமானைக் கொல்பவனாகிய சிம்ரியே?’ என்று சொற்படியாக மட்டும் தரலாம்.
  rationale: எபிரெய அடைமொழி அமைப்பு சிம்ரியின் முந்தைய அரசக் கொலையை நினைவூட்டி யெகூவை இகழ்வதற்கு இயல்பாக இடமளிக்கிறது (1 இராஜாக்கள் 16:9–20). முதன்மை உரை அந்த இகழ்ச்சியை வைத்திருக்கிறது; வரலாற்றுச் சுட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் சுருக்கமும் யேசபேலின் கேலித் தொனியும் பாதுகாக்கப்பட்டுள்ளன. ‘ஆண்டவர்’ என்ற தெய்வீகப் பட்டத்துடன் குழப்பம் வராமல், மனித மேலதிகாரியைக் குறிக்க ‘எஜமான்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
