  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֣א הַ/בַּ֔יְתָ/ה וַ/יִּצֹ֥ק הַ/שֶּׁ֖מֶן אֶל רֹאשׁ֑/וֹ וַ/יֹּ֣אמֶר ל֗/וֹ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מְשַׁחְתִּ֧י/ךָֽ לְ/מֶ֛לֶךְ אֶל עַ֥ם יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: ta
  text: 'அவன் எழுந்து வீட்டுக்குள் சென்றான். பின்பு அந்த இளைஞன் அவனுடைய தலையில் எண்ணெயை ஊற்றி, அவனிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: யாவேயின் மக்களாகிய இஸ்ரவேலின்மேல் உன்னை அரசனாக அபிஷேகம் செய்திருக்கிறேன்[a]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் மக்களாகிய இஸ்ரவேலின்மேல் உன்னை அரசனாக அபிஷேகம் செய்கிறேன்.” இந்த அபிஷேகச் சூத்திரத்தில் எபிரேய நிறைவுவினையை, அச்செயலை நிகழ்த்தும் அறிவிப்பாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: அவன் எழுந்து
  rationale: קום என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வடிவம்; நவீனத் தமிழில் இயல்பாக நிகழ்ச்சியின் அடுத்த செயலைக் காட்டுகிறது.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: வீட்டுக்குள் சென்றான்
  rationale: בַּיִת உடன் வரும் திசைச்சுட்டு ה, வீட்டின் உள்ளே சென்ற இயக்கத்தைக் குறிக்கிறது.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: அவனுடைய தலையில் எண்ணெயை ஊற்றி
  rationale: יצק என்பது ‘ஊற்று’ என்று பொருள்படும்; குறிப்பிட்ட அபிஷேக எண்ணெயைக் குறிக்கும் எபிரேய உரையின் தன்மையும் காக்கப்படுகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப்பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய ஆக்கநிலைத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: מְשַׁחְתִּיךָ
  choice: உன்னை ... அபிஷேகம் செய்திருக்கிறேன்
  rationale: முதல் நபர் நிறைவுவினையின் முடிந்த செயல் மற்றும் தொடரும் நியமன விளைவு ஆகியவற்றைக் காக்கிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: அபிஷேகத்தின் விளைவாகப் பெறும் அரசப் பதவியைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: யாவேயின் மக்களாகிய இஸ்ரவேலின்மேல்
  rationale: அரச அதிகாரத்தின் பரப்பைக் குறிக்கும் אֶל என்பதையும், ‘யாவேயின் மக்கள்’ யார் என்பதை விளக்கும் ‘இஸ்ரவேல்’ என்ற இணைப்பையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், Yahweh என்ற உச்சரிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கிறது.
- issue: מְשַׁחְתִּיךָ என்ற அபிஷேக அறிவிப்பின் காலமும் செயல்வலிமையும்
  choice: அபிஷேகம் செய்திருக்கிறேன்
  alternative: அபிஷேகம் செய்கிறேன்
  rationale: எண்ணெய் ஊற்றப்பட்டு முடிந்த செயலை எபிரேய நிறைவுவினை சுட்டுகிறது; அதேவேளையில் இது நிகழ்த்துச் சொற்றொடராகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. நபர் குழப்பத்தைத் தவிர்க்க இரண்டாவது வாக்கியத்தில் அபிஷேகம் செய்பவர் ‘அந்த இளைஞன்’ என்று சூழலுக்கேற்ப வெளிப்படுத்தப்பட்டுள்ளார்; இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
