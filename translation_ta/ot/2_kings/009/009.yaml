- from: ஆகாபின் வீட்டாரை நேபாத்தின் மகன் யெரொபெயாமின் வீட்டாரைப் போலவும் அகியாவின் மகன் பாசாவின் வீட்டாரைப் போலவும் ஆக்குவேன்.[a]
  to: ஆகாபின் வீட்டை நேபாத்தின் மகன் யெரொபெயாமின் வீட்டைப்போலவும், அகியாவின் மகன் பாஷாவின் வீட்டைப்போலவும் ஆக்குவேன்.[a]
  rationale: The revision preserves the Hebrew ‘house’ wording in the text and explains its royal/dynastic sense in the footnote, rather than using “வீட்டார்,” which can suggest only the members of a household. It also corrects the transliteration of Baasha and uses the standard Tamil form of Ahijah without altering the verse’s meaning or judgmental force.
