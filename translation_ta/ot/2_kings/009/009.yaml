  source_fidelity: The judgment formula and both parallel comparisons are retained. However, “வீட்டார்” normally denotes the people of a household in Tamil, whereas Hebrew בֵּית in this context denotes the royal ‘house’ collectively, including its dynastic sense. Rendering it as “வீடு” preserves the source metaphor; the footnote can explain its dynastic reference.
  naturalness: The revised wording is natural in modern standard Tamil with a restrained biblical register. It avoids making the comparison sound as though only individual household members are in view.
  terminology: 'The personal names are adjusted to established and closer Tamil transliterations: “பாஷா” for Baasha and “அகியா” for Ahijah. “வீடு” is retained as the main-text equivalent of Hebrew ‘house,’ while “அரசக் குடும்பம் அல்லது அரச வம்சம்” explains the idiomatic sense in the footnote.'
