id: 2KI.9.9
reference: 2 Kings 9:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: ta
  text: ஆகாபின் வீட்டை நேபாத்தின் மகன் யெரொபெயாமின் வீட்டைப்போலவும், அகியாவின் மகன் பாஷாவின் வீட்டைப்போலவும் ஆக்குவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாபின் வம்சத்தை ... யெரொபெயாமின் வம்சத்தைப் போலவும் ... பாஷாவின் வம்சத்தைப் போலவும்.” இங்கு “வீடு” என்பது அரசக் குடும்பத்தையோ அரச வம்சத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: ஆக்குவேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்பதாக இருந்தாலும், இங்குள்ள நேரடிச் செயப்படுபொருளும் ஒப்பீட்டுத் தொடர்களும் சேர்ந்த நியாயத்தீர்ப்பு சூத்திரத்தில் ‘...போல ஆக்குவேன்’ என்பது இயல்பாகவும் காரணவினை வலிமையைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் வீட்டார்
  rationale: בַּיִת என்ற ‘வீடு’ உருவகத்தை ஓரளவு காத்துக்கொண்டே, அரச குடும்பத்தையும் வம்சத்தையும் குறிக்கும் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘வீட்டார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְּ/בֵית
  choice: வீட்டாரைப் போல
  rationale: כְּ ஒப்பீட்டைக் குறிக்கிறது; ‘...போல’ என்பது தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரேய மகன்-தந்தை உறவைத் தமிழின் இயல்பான உடைமைத் தொடரில் வழங்கி, பெயர்களை ஒலிபெயர்த்துள்ளது.
- source_word: וּ/כְ/בֵית
  choice: வீட்டாரைப் போலவும்
  rationale: וּ மற்றும் כְּ ஆகியவற்றின் இணைப்பு, இரு ஒப்பீடுகளின் இணையான அமைப்பைக் காக்க ‘...போலவும்’ என்று வழங்கப்பட்டது.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: அகியாவின் மகன் பாசா
  rationale: வரலாற்றுக் குறிப்பைத் தக்கவைத்து, மகன்-தந்தை உறவை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: அரச வம்சத்தின் மீதான நியாயத்தீர்ப்பு சூத்திரம்
  choice: ஆகாபின் வீட்டார் ... யெரொபெயாமின் வீட்டார் ... பாசாவின் வீட்டார்
  alternative: ஆகாபின் வம்சம் ... யெரொபெயாமின் வம்சம் ... பாசாவின் வம்சம்
  rationale: வசனம் ஒரு தனிநபரை மட்டும் அல்லாமல் அரச குடும்பத்தையும் வழித்தோன்றல் வரிசையையும் குறிக்கிறது. ‘வீட்டார்’ என்பது எபிரேய ‘வீடு’ உருவகத்தோடு தொடர்பை வைத்துக்கொண்டு தமிழில் புரியத்தக்கதாக உள்ளது; ‘வம்சம்’ என்ற தெளிவான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. எபிரேய அரச-‘வீடு’ உருவகத்தைத் தமிழின் ‘வீட்டார்’ வழியாகக் காத்து, அதன் வம்சப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
