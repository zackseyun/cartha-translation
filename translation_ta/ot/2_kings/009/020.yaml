translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உரையின் மீளுரை முடிந்தவரை பேணப்பட்டுள்ளது; ‘பைத்தியக்காரத்தனமாக’ என்ற கடினமான நேரடி வடிவத்துக்கு மாற்றாக ‘வெறித்தனமாக’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, மேலும் நேரடியான உருவகம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
