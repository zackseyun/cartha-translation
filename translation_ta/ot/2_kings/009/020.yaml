base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: ta
  text: காவலன், “அவன் அவர்களிடம் சென்றான்; ஆனால் திரும்பி வரவில்லை. அவன் செலுத்தும் முறை நிம்ஷியின் மகன் யெகூ செலுத்தும் முறையைப் போல இருக்கிறது; ஏனெனில் அவன் வெறித்தனமாக ஓட்டுகிறான்[a]” என்று தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பித்துப்பிடித்தவனைப் போல் ஓட்டுகிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: காவலன் ... என்று தெரிவித்தான்
  rationale: நגד என்பதன் செய்தி அறிவிக்கும் பொருளையும், צֹפֶה என்பதன் கண்காணிப்புப் பணியையும் அரச மற்றும் இராணுவச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: அவன் அவர்களிடம் போய்ச் சேர்ந்தான்
  rationale: தூதன் அந்தக் குழுவினரிடம் வந்து சேர்ந்ததைக் குறிக்கும் בוא + עַד + אֶל அமைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא שָׁב
  choice: ஆனால் திரும்பிவரவில்லை
  rationale: அவன் சென்றடைந்தும் இன்னும் திரும்பாத தற்போதைய நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: அவன் ஓட்டுகிற விதம் ... ஓட்டுகிற விதத்தைப் போல
  rationale: மூலத்தின் மீளுரையைப் பேணுவதோடு, இச்சூழலில் மִנְהָג என்பது தேரோட்டும் பாணியைக் குறிப்பதைத் தெளிவாக்குகிறது; ‘தேர்’ என்பது வசனத்தில் வெளிப்படையாக இல்லாததால் உரையில் சேர்க்கப்படவில்லை.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: நிம்சியின் மகன் யெகூ
  rationale: எபிரேயப் பெயர்களைத் தமிழில் வழக்கமான ஒலிபெயர்ப்புடன் தருகிறது; patronymic உறவையும் நேரடியாகப் பேணுகிறது.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: ஏனெனில் அவன் வெறித்தனமாக ஓட்டுகிறான்
  rationale: בְשִׁגָּעוֹן என்ற பெயர்ச்சொல் இங்கு வினையடைச் செயல்பாட்டில் கட்டுப்பாடற்ற, வெறிகொண்ட ஓட்டத்தைச் சுட்டுகிறது. ‘வெறித்தனமாக’ என்பது அதன் தீவிரத்தையும் இயல்பற்ற தன்மையையும் நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
