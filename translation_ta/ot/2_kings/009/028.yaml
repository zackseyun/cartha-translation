translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறந்தவரின் உடலை எடுத்துச் சென்ற சூழல் தெளிவாக இருக்க ‘கொண்டுசென்று’ என வழங்கப்பட்டுள்ளது. எபிரெய அடக்க மரபுத்தொடரின் பொருள் பிரதான உரையில் தெளிவாக்கப்பட்டு, அதன் பண்பாட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
