  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அவனை எருசலேமுக்குக் கொண்டு சென்று, தாவீதின் நகரத்தில், அவனுடைய முன்னோர்களோடு அவனுடைய கல்லறையில் அடக்கம் செய்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனை எருசலேமுக்கு ஏற்றிச் சென்றார்கள்’; எபிரெய வினை அடிப்படையில் ‘ஏறச் செய்தார்கள்’ அல்லது ‘ஏற்றினார்கள்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘முன்னோர்களோடு’ என்பது இறந்தவர் தம் முன்னோர்களுடன் அடக்கம் செய்யப்பட்டதைக் குறிக்கும் எபிரெய அடக்க மரபுத்தொடர்; இச்சூழலில் அரச மரபின் முன்னோர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: கொண்டுசென்று
  rationale: ரכב என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘சவாரி செய்யவைத்தல்’ அல்லது ‘ஏற்றிக் கொண்டுசெல்லுதல்’ என்று பொருள்படலாம். இறந்த அகசியாவின் உடலை எருசலேமுக்கு எடுத்துச் செல்லும் சூழலில், அவர் உயிருடன் சவாரி செய்தார் என்ற தவறான எண்ணத்தைத் தவிர்த்து இயல்பாகச் செயலைக் காட்ட ‘கொண்டுசென்று’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עבד என்பது பணியாளர், ஊழியர் அல்லது அரச அலுவலர் எனப் பொருள்படலாம். இங்கு அரசனுக்குப் பணியாற்றியவர்களைக் குறிக்கும் பொதுவான, இயல்பான சொல்லாக ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְרוּשָׁלָמָה
  choice: எருசலேமுக்கு
  rationale: திசையைக் குறிக்கும் இறுதி உருபு எருசலேமை நோக்கிய இயக்கத்தைக் காட்டுவதால், தமிழில் ‘எருசலேமுக்கு’ என இயல்பாக வழங்கப்பட்டது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினையையும் அதன் நேரடிச் செயப்படுபொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘பணியாளர்கள்’ என்பதே தொடர்ந்து எழுவாயாக உள்ளது.
- source_word: בִקְבֻרָתוֹ
  choice: அவனுடைய கல்லறையில்
  rationale: קְבֻרָה இங்கு அடக்க இடத்தைக் குறிக்கிறது. அரச குடும்பச் சூழலுக்கும் தமிழின் வழக்குக்கும் ‘கல்லறை’ பொருத்தமானது.
- source_word: עִם אֲבֹתָיו
  choice: அவனுடைய முன்னோர்களோடு
  rationale: சொல்லுக்கு சொல் வடிவம் ‘அவனுடைய தந்தையரோடு’ என்றாலும், அடக்கச் சூழலில் இது முந்தைய தலைமுறையினருடன், குறிப்பாக அரச மரபின் முன்னோருடன், அடக்கம் செய்யப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் பொருளைத் தெளிவாகத் தர ‘முன்னோர்களோடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயர்ச் சொற்றொடரின் நேரடியும் தமிழில் நிலைபெற்றதுமான வடிவம்.
