base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: ta
  text: அப்போது யோராம், “தேரைப் பூட்டுங்கள்!” என்றான்.[a] அவர்கள் அவனுடைய தேரைப் பூட்டினார்கள். பின்பு இஸ்ரவேலின் அரசன் யோராமும் யூதாவின் அரசன் அகசியாவும் தத்தம் தேர்களில் யெகூவைச் சந்திக்கப் புறப்பட்டார்கள். அவர்கள் யிஸ்ரெயேலியனான நாபோத்தின் நிலப்பகுதியில் அவனைக் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவன் தன் தேரைப் பூட்டினான்” என்று உள்ளது. அரசனின் கட்டளையை அவனுடைய ஏவலாளர்கள் நிறைவேற்றினர் என்பதே இங்குள்ள பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: தேரைப் பூட்டுங்கள்!
  rationale: தேர் இழுக்கும் குதிரைகளைத் தேரோடு கட்டிப் புறப்பட ஆயத்தப்படுத்துவதைக் குறிக்கும் கட்டளை. நவீனத் தமிழில் ‘தேரைப் பூட்டுங்கள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அவசரத்தையும் வெளிப்படுத்துகிறது.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: அவனுடைய தேர் பூட்டப்பட்டது
  rationale: எபிரெய வினை இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்தாலும், முந்தைய கட்டளையை ஓர் ஏவலாளர் நிறைவேற்றியதாகச் சூழல் காட்டுகிறது. செயப்பாட்டு வடிவம் அரசனே தேரைப் பூட்டினான் என்று தவறாக உணர்த்தாமல் மூலத்தின் ஒருமை வடிவத்தையும் மதிக்கிறது.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: தத்தம் தேரில் ஏறி
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ எனக் குறிக்கிறது. ‘தத்தம் தேரில்’ இரு அரசர்களும் தனித்தனித் தேர்களில் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘ஏறி’ என்பது தமிழில் பயணச் சூழலைத் தெளிவாக்குகிறது.
- source_word: לִקְרַאת יֵהוּא
  choice: யெகூவைச் சந்திக்க
  rationale: לקראת என்பது ஒருவரை எதிர்கொண்டு சந்திக்கப் புறப்படுவதை வழக்கமாகக் குறிக்கிறது. சூழலின் பகைமைத் தன்மையை மொழிபெயர்ப்பிலேயே மிகைப்படுத்தாமல் ‘சந்திக்க’ என வழங்கப்பட்டது.
- source_word: וַיִּמְצָאֻהוּ
  choice: அவனைச் சந்தித்தார்கள்
  rationale: מצא கதைநடையில் ‘கண்டார்கள்’ அல்லது ‘எதிர்கொண்டார்கள்’ எனப் பொருள்படலாம். இங்கு தேடிக் கண்டுபிடித்தல் என்பதைக் காட்டிலும் நேருக்கு நேர் வந்தடைதல் பொருத்தமாக இருப்பதால் ‘சந்தித்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: நாபோத்தின் நிலப்பகுதியில்
  rationale: חֶלְקָה என்பது வரையறுக்கப்பட்ட நிலத் துண்டை அல்லது சொத்துப் பகுதியைக் குறிக்கிறது. நாபோத்தின் முந்தைய சொத்துரிமைச் சம்பவத்துடனான தொடர்பைப் பாதுகாக்க ‘நிலப்பகுதி’ பயன்படுத்தப்பட்டது.
- source_word: הַיִּזְרְעֵאלִי
  choice: இஸ்ரயேலனான
  rationale: இது நாபோத்தை இஸ்ரயேல் ஊரைச் சேர்ந்தவன் என அடையாளப்படுத்தும் குடிப்பெயர். நவீனத் தமிழில் இயல்பாக ‘இஸ்ரயேலனான’ என வழங்கப்பட்டது.
