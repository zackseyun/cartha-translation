base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: ta
  text: ‘நிச்சயமாக, நேற்று நாபோத்தின் இரத்தத்தையும் அவனுடைய மகன்களின் இரத்தத்தையும் நான் கண்டேன்,’ என்று யாவே அறிவிக்கிறார். ‘இந்த நிலத்துண்டில் உனக்குக் கைம்மாறு செய்வேன்,’ என்று யாவே அறிவிக்கிறார். ‘ஆகவே இப்போது, யாவேயின் வார்த்தையின்படி அவனைத் தூக்கி இந்த நிலத்துண்டில் எறி.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם לֹא
  choice: என்பது நிச்சயம்
  rationale: இங்கு இது நிபந்தனையைக் குறிக்காமல், ஆணையிட்டு உறுதிப்படுத்துவதுபோன்ற வலியுறுத்தலைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் இருக்க ‘என்பது நிச்சயம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: דְּמֵי
  choice: இரத்தம்
  rationale: எபிரெய மொழியில் பன்மை வடிவம் வன்முறையாகச் சிந்தப்பட்ட இரத்தத்தையும் அதனால் உண்டான இரத்தப்பழியையும் உணர்த்தலாம். மூலத்தின் உருவகத்தைத் தக்கவைக்க தமிழில் ‘இரத்தம்’ என வழங்கப்பட்டது.
- source_word: נָבוֹת
  choice: நாபோத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: மூலம் பொதுவாகப் பிள்ளைகள் என்று சொல்லாமல் குறிப்பாக மகன்கள் என்று கூறுகிறது; அந்தக் குறிப்புத்தன்மை பாதுகாக்கப்பட்டது.
- source_word: אֶמֶשׁ
  choice: நேற்று
  rationale: முந்தைய நாள் அல்லது இரவைக் குறிக்கக்கூடிய சொல்லுக்கு இச்சூழலில் மிகக் குறைந்த விளக்கச் சுமையுள்ள இயல்பான தமிழ் இணை ‘நேற்று’ ஆகும்.
- source_word: נְאֻם יְהוָה
  choice: யாவே அறிவிக்கிறார்
  rationale: தீர்க்கதரிசன அதிகாரத்துடன் கூடிய அறிவிப்பு வாய்பாட்டைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: உனக்குக் கைம்மாறு செய்வேன்
  rationale: שלם என்பதன் தீவிர வினைவடிவம் இங்கு செய்ததற்கேற்ற நீதித்தீர்ப்பான பதிலளிப்பைக் குறிக்கிறது. ‘கைம்மாறு செய்வேன்’ பழிவாங்குதல் என்று அளவுக்கு மீறித் தீர்மானிக்காமல் அந்தப் பொருளைப் பாதுகாக்கிறது.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: இந்த நிலத்துண்டிலேயே
  rationale: חֶלְקָה என்பது ஒரு வயல் அல்லது சொத்தின் குறிப்பிட்ட பகுதியைக் குறிக்கிறது. ‘நிலத்துண்டு’ துல்லியமாகவும் இயல்பாகவும் உள்ளது; ‘-லேயே’ அதே இடத்தில் தீர்ப்பு நிறைவேறும் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: அவனைத் தூக்கி ... எறி
  rationale: இரு கட்டளை வினைகளின் நேரடியான இயக்கத்தைத் தக்கவைத்து, உடலை எடுத்துச் சென்று எறியும் நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படியே
  rationale: தற்போதைய கட்டளை முன்பு கூறப்பட்ட தெய்வீக அறிவிப்பை நிறைவேற்றுவதாக மூலத்தில் உள்ள தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிப்பெயர்த்துள்ளது.
- issue: நாபோத்தின் சந்ததியரைச் சுட்டும் பாலினக் குறிப்புத்தன்மை
  choice: அவனுடைய மகன்கள்
  alternative: அவனுடைய பிள்ளைகள்
  rationale: בָנָיו என்பது குறிப்பாக ‘அவனுடைய மகன்கள்’ என்று பொருள்படுவதால், நீதித்தீர்ப்புச் சூழலிலும் மூலத்தின் குறிப்புத்தன்மை பொதுமைப்படுத்தப்படவில்லை.
- issue: இரத்தம் என்பதன் சட்ட மற்றும் நீதித்தீர்ப்புச் சுமை
  choice: இரத்தம்
  alternative: இரத்தப்பழி
  rationale: ‘இரத்தப்பழி’ என்பது சூழலின் சட்டப் பொருளை வெளிப்படையாக விளக்கும்; ஆனால் மூலத்தின் இரத்த உருவகத்தையும் அதன் இயல்பான பலபொருள் சுமையையும் தக்கவைக்க ‘இரத்தம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் வலிமை, நீதித்தீர்ப்பின் தொனி, ‘இரத்தம்’ என்ற மூல உருவகம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. மேற்கோளுக்குள் யாவேயின் சொற்களும், அதன் பின் வரும் ஏகூவின் கட்டளையும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
