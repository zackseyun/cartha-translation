  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: ta
  text: அப்போது யோராம் தன் கைகளைத் திருப்பினான்; தப்பியோடினான்[a]. அவன் அகசியாவிடம், “துரோகம்[b], அகசியாவே!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் கைகளைத் திருப்பினான்” என்பது எபிரெய மொழியின் நேரடி சொற்றொடர். இது கைகளால் கடிவாளத்தை இயக்கித் தேரைத் திருப்பியதைக் குறிக்கலாம்; ஆனால் இங்கே கடிவாளமோ தேரோ வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வஞ்சகம், அகசியாவே!”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: தன் கைகளைத் திருப்பி
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான, concrete வடிவத்தைப் பாதுகாக்கிறது. சூழலில் தேரைத் திருப்புவதற்காகக் கடிவாளத்தை இயக்கியதைக் குறிக்கலாம்; ஆனால் மூலத்தில் தேரோ கடிவாளமோ வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: וַיָּנֹס
  choice: தப்பியோடினான்
  rationale: அபாயத்திலிருந்து அவசரமாக ஓடிச் செல்வதைக் குறிக்கும் נוס என்பதன் கதைச்சூழலுக்கேற்ற இயல்பான தமிழ் வடிவம்.
- source_word: מִרְמָה
  choice: துரோகம்
  rationale: வஞ்சகம் அல்லது நம்பிக்கைத் துரோகம் என்ற பொருளுடைய சொல்லை இச்சூழலில் எச்சரிக்கையும் குற்றச்சாட்டும் கலந்த சுருக்கமான கூக்குரலாக வழங்குகிறது.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: அகசியா
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு; நேரடி அழைப்பில் பெயர் மீண்டும் வருவதை மூலத்தைப் போலவே வைத்துள்ளது.
