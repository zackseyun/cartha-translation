revisions:
- from: அப்போது யோராம் தன் கைகளைத் திருப்பித் தப்பியோடினான்[a]. அவன் அகசியாவிடம், “துரோகம்[b], அகசியாவே!” என்றான்.
  to: அப்போது யோராம் தன் கைகளைத் திருப்பினான்; தப்பியோடினான்[a]. அவன் அகசியாவிடம், “துரோகம்[b], அகசியாவே!” என்றான்.
  rationale: The revision only recasts the two Hebrew narrative verbs as clear coordinated Tamil clauses. It continues to preserve the difficult literal reference to Jehoram’s hands in the main text, explains the likely chariot context only in the footnote, and leaves the force and ambiguity of the accusation intact.
