    issue: Awkward rendering of the Hebrew idiom concerning Jehoram’s hands
    rationale: The source’s expression is deliberately retained, but changing the compressed participial construction to coordinated verbs improves modern Tamil readability without supplying an unstated object such as reins or a chariot.
