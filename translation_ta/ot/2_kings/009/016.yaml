base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: ta
  text: யெகூ ஏறினான்; யெஸ்ரயேலுக்குச் சென்றான். ஏனெனில் யோராம் அங்கே படுத்திருந்தான்; யூதாவின் அரசன் அகசியாவும் யோராமைப் பார்க்க இறங்கிச் சென்றிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ஏறி
  rationale: רכב என்பதன் அடிப்படைப் பொருள் ‘ஏறு/சவாரி செய்.’ அடுத்துள்ள ‘சென்றான்’ என்ற வினையிலிருந்து இந்தச் செயலை வேறுபடுத்துவதற்காக ‘ஏறி’ என மொழிபெயர்க்கப்பட்டது; வாகனம் மூலவசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: הלך என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; செல்லும் இடம் அடுத்ததாகக் குறிப்பிடப்படுகிறது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேலுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ה, யெஸ்ரயேலை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யெகூ யெஸ்ரயேலுக்குச் சென்றதற்கான காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது.
- source_word: שֹׁכֵב שָׁמָּה
  choice: அங்கே படுத்திருந்தான்
  rationale: שׁכב என்ற பங்கேற்புவினையின் நேரடிப் பொருளான ‘படுத்திரு’ என்பதைக் காக்கிறது; அவர் நோய்ப்படுக்கையில் இருந்தார் என்று மூலவசனத்தைவிட அதிகமாக விளக்கவில்லை.
- source_word: יָרַד
  choice: இறங்கிச் சென்றிருந்தான்
  rationale: ‘இறங்கு’ என்ற நிலவியல் நுணுக்கத்தைப் பாதுகாக்கிறது. யெகூ புறப்படுவதற்கு முன்பே அகசியா சென்றிருந்ததைத் தமிழ் இறந்தகால நிறைவுவினை தெளிவாக்குகிறது.
- source_word: לִרְאוֹת אֶת
  choice: பார்க்க
  rationale: சொல்லுக்குச் சொல் ‘பார்க்க’ என்று பொருள்; இச்சூழலில் ஒருவரைச் சந்திக்கச் செல்வதையும் இயல்பாக உணர்த்துகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: யெகூ / யோராம் / அகசியா / யெஸ்ரயேல் / யூதா
  rationale: நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க, வழக்கிலுள்ள வேதாகமப் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
