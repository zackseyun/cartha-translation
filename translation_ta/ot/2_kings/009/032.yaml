base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: ta
  text: அவன் சாளரத்தை நோக்கித் தன் முகத்தை உயர்த்தி, “என்னோடு இருப்பவர் யார்? யார்?” என்று கேட்டான். அப்போது இரண்டு மூன்று அண்ணகர்கள்[a] அவனை நோக்கிக் கீழே பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரண்மனை அதிகாரிகள்.” எபிரெயச் சொல் இரு பொருள்களையும் குறிக்கலாம்; எனினும், அரச அரண்மனைச் சூழலில் “அண்ணகர்கள்” என்பதே மிகவும் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: தன் முகத்தைச் சாளரத்தை நோக்கி உயர்த்தி
  rationale: ‘தன் முகத்தை உயர்த்தினான்’ என்ற எபிரெய உருவகத்தைப் பாதுகாப்பதோடு, பார்வையை மேலிருந்த சாளரத்தை நோக்கித் திருப்பிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַחַלּוֹן
  choice: சாளரம்
  rationale: அரண்மனையின் உயர்ந்த பகுதியில் உள்ள திறப்பைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: מִי אִתִּי מִי
  choice: என்னோடு இருப்பவர் யார்? யார்?
  rationale: אִתִּי என்பதன் நேரடிப் பொருளான ‘என்னோடு’ என்பதையும், இருமுறை வரும் מִי ஏற்படுத்தும் வலியுறுத்தலையும் காக்கிறது; ‘என் பக்கம் இருப்பவர்’ என்பது சூழலை விளக்கும் மொழிபெயர்ப்பாக இருக்கும்.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: அவனைக் கீழே நோக்கிப் பார்த்தார்கள்
  rationale: உயரத்தில் உள்ள சாளரத்திலிருந்து யெகூவை நோக்கும் இடவமைப்பை שׁקף வினையின் பொருளுக்கு ஏற்பத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: இரண்டு மூன்று
  rationale: சிறிய, துல்லியமாக நிர்ணயிக்கப்படாத எண்ணிக்கையைக் குறிக்கும் எபிரெய எண் இணைப்பை இயல்பான தமிழில் அதேபோல் தருகிறது.
- source_word: סָרִיסִים
  choice: அண்ணகர்கள்
  rationale: அரண்மனைச் சூழலில் இச்சொல்லின் மிகச் சாத்தியமான பொருளான ‘eunuchs’ என்பதைத் துல்லியமாகக் குறிக்கிறது; ‘அரண்மனை அதிகாரிகள்’ என்ற விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
