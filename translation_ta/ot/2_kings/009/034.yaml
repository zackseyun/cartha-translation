base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: ta
  text: அவன் உள்ளே சென்று சாப்பிட்டுக் குடித்தான்; பின்னர் அவன், “தயவுசெய்து இந்தச் சபிக்கப்பட்ட பெண்ணைக்[a] கவனித்துக்கொண்டு, அவளை அடக்கம் செய்யுங்கள்; ஏனெனில் அவள் ஓர் அரசனின் மகள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சபிக்கப்பட்டவளைக்.”
    reason: எபிரெயப் பெண்பால் வடிவத்தை ‘பெண்’ என்ற பெயர்ச்சொல்லைச் சேர்க்காமலும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அவன் உள்ளே போய்
  rationale: இச்சூழலில் בוא என்பது யெகூ அரண்மனைக்குள் செல்வதைக் குறிக்கிறது. ‘உள்ளே போய்’ என்பது திசையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: சாப்பிட்டுக் குடித்தான்
  rationale: எபிரெயத்தில் உணவு அல்லது பானத்தின் வகை குறிப்பிடப்படவில்லை; ஆகவே எந்தப் பொருளையும் கூடுதலாகச் சேர்க்காமல் இரு வினைகளும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: פִּקְדוּ נָא
  choice: தயவுசெய்து … கவனித்து
  rationale: פקד இங்கு ஒருவருடைய காரியத்தைக் கவனித்து உரிய நடவடிக்கை எடுப்பதைக் குறிக்கிறது. נָא கட்டளையை மென்மைப்படுத்துவதால் ‘தயவுசெய்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: சபிக்கப்பட்ட இந்தப் பெண்ணை
  rationale: பெண்பால் ஒருமை வடிவம் யேசபேலைக் குறிக்கிறது. நவீன தமிழில் குறிப்பைத் தெளிவாக்க ‘பெண்’ சேர்க்கப்பட்டுள்ளது; ‘சபிக்கப்பட்ட’ என்பது மூலத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: וְקִבְרֻהָ
  choice: அவளை அடக்கம் செய்யுங்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டுடன் கூடிய நேரடி கட்டளை இயல்பான மரியாதைப் பன்மை கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: ஏனெனில் அவள் ஓர் அரசனின் மகள்
  rationale: இந்தக் கூற்று அவளை அடக்கம் செய்வதற்கான காரணமாக அவளுடைய அரச குடும்ப நிலையைக் குறிப்பிடுகிறது. எபிரெயத்தில் குறிப்பிட்ட அரசன் அடையாளப்படுத்தப்படாததால் ‘ஓர் அரசன்’ என வழங்கப்பட்டுள்ளது.
