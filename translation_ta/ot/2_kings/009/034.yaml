translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை வினை வடிவம் பலருக்குக் கொடுக்கப்படும் கட்டளையை வெளிப்படுத்துகிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடு ‘குடித்தான்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் הָאֲרוּרָה הַזֹּאת என்பதற்கான சொற்பொருள் மாற்றாக இருப்பதால் தமிழில் உரிய சொல்லுக்குப் பின் இடப்பட்டுள்ளது.
