  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான தீர்ப்புரை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கரடுமுரடான ஆண்-குறிப்பு முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது; தெளிவற்ற எதிரிணை திட்டமிட்டு மிகையாக விளக்கப்படவில்லை.
