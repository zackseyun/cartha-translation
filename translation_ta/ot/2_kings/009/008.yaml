  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: ta
  text: ஆகாபின் குடும்பம் முழுவதும் அழிந்துபோகும். இஸ்ரயேலில் ஆகாபைச் சேர்ந்த ஆண்கள் அனைவரையும்[a]—அடிமைகளாக இருந்தாலும் சுதந்திரமானவர்களாக இருந்தாலும்[b]—நான் வேரறுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “சுவரில் சிறுநீர் கழிக்கிற ஒவ்வொருவனையும்”; இது ஆண்களைக் குறிக்கும் கரடுமுரடான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் உள்ள இணைச்சொற்றொடரின் துல்லியமான பொருள் உறுதியில்லை. இது எல்லா நிலைகளிலுள்ளவர்களையும் உள்ளடக்கும் சொல்லாக இருக்கலாம்; “அடிமைகளையும் சுதந்திரமானவர்களையும்” என்பது வழக்கமான புரிதல். “கட்டுப்பட்டவர்களையும் விடப்பட்டவர்களையும்” அல்லது “பாதுகாக்கப்பட்டவர்களையும் கைவிடப்பட்டவர்களையும்” என்றும் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: அழிந்துபோகும்
  rationale: தீர்க்கதரிசன உரையில் எதிர்காலத் தீர்ப்பைக் குறிக்கும் வினையாக இயல்பாகவும், அழிவைச் செய்பவர் யார் என்பதை இந்தச் சொல்லிலேயே மிகைப்படுத்தாமலும் மொழிபெயர்க்கிறது.
- source_word: כָּל בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பம் முழுவதும்
  rationale: בֵּית இங்கு அரச குடும்பம் அல்லது வம்சத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘குடும்பம்’ இயல்பாகப் புரியும்; ‘முழுவதும்’ כָּל என்பதன் முழுமையைத் தக்கவைக்கிறது.
- source_word: וְהִכְרַתִּי
  choice: நான் வேரறுப்பேன்
  rationale: כרת என்பதன் முற்றாக அகற்றும் தீர்ப்புப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது; வெறும் உடல் வெட்டுதலாகத் தவறாகப் புரிந்துகொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: לְאַחְאָב
  choice: ஆகாபைச் சேர்ந்த
  rationale: לְ இங்கு ஆகாபுடனான உறவு அல்லது உடைமையைச் சுட்டுகிறது; அவனுடைய குடும்ப வரிசையைச் சேர்ந்தவர்கள் என்பதே சூழலுக்கேற்ற பொருள்.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஆண்கள் அனைவரையும்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் கரடுமுரடான உடல் செயல்பாட்டு மொழியான இந்த எபிரெயச் சொற்றொடர் ஆண்களைச் சுட்டும் மரபுத்தொடர். அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעָצוּר וְעָזוּב
  choice: அடைக்கப்பட்டவர்களையும் விடப்பட்டவர்களையும்
  rationale: இணைச்சொற்களின் அடிப்படை உருவகத்தைத் தக்கவைத்து, அவை குறிக்கும் சமூக நிலையைத் துல்லியமாகத் தீர்மானிக்காமல் விடுகிறது; பொருள் குறித்த ஐயமும் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரயேலில்
  rationale: தீர்ப்பு நிகழும் வட்டாரத்தைச் சுட்டும் இடப்பொருளாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஆகாபின் அரச குடும்பத்தின்மீதான முழுமையான தீர்ப்பு
  choice: ‘குடும்பம் முழுவதும்’ என்றும் ‘வேரறுப்பேன்’ என்றும் வழங்கி, தீர்ப்பின் முழுமையையும் அரச குடும்பத் தொடர்பையும் தக்கவைத்தல்
  alternative: ‘ஆகாபின் வம்சத்தை முற்றிலும் அழிப்பேன்’ என்று ஒரே கருத்தாக விரித்துரைத்தல்
  rationale: மூலத்தின் இரு கூற்றுகளையும் தனித்தனியாக வைத்திருப்பதால் அதன் தீர்ப்புரை அமைப்பும் வலிமையும் பாதுகாக்கப்படுகின்றன; குறிப்பிட்ட சமயக்கோட்பாட்டு விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
- issue: מַשְׁתִּין בְּקִיר என்ற கரடுமுரடான மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘ஆண்கள் அனைவரையும்’ என்று பொருளைத் தெளிவாக்கி, நேரடி சொல்லாட்சியை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: முதன்மை உரையிலேயே ‘சுவரருகே சிறுநீர் கழிப்பவன் ஒவ்வொருவனையும்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: நவீன வாசகர்களுக்கு குறிக்கப்பட்ட குழுவைத் தெளிவாகச் சொல்கிறது; அதேவேளையில் மூலத்தின் கரடுமுரடான சொல்லாட்சி மறைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְעָצוּר וְעָזוּב என்ற இணைச்சொற்களின் தெளிவற்ற பொருள்
  choice: ‘அடைக்கப்பட்டவர்களையும் விடப்பட்டவர்களையும்’ என்ற ஒப்பீட்டளவில் நேரடியான வடிவத்தைப் பயன்படுத்துதல்
  alternative: ‘அடிமைகளையும் சுதந்திரமானவர்களையும்’ அல்லது ‘பாதுகாக்கப்பட்டவர்களையும் கைவிடப்பட்டவர்களையும்’ என்று பொருளைத் தீர்மானித்தல்
  rationale: இந்த மரபுத்தொடரின் துல்லியமான சமூகக் குறிப்பு உறுதியற்றது. நேரடி எதிரிணையைத் தக்கவைப்பது உண்மையான மொழியியல் தெளிவின்மையை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்கிவிடாமல் காக்கிறது.
