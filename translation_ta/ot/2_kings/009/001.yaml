base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: ta
  text: அப்போது இறைவாக்கினர் எலிசா, இறைவாக்கினர் குழுவைச் சேர்ந்த ஒருவனை[a] அழைத்து, அவனிடம், “உன் ஆடையை இடுப்பில் கட்டிக்கொள்[b]. இந்த எண்ணெய்க் குடுவையை உன் கையில் எடுத்துக்கொண்டு ராமோத்-கிலேயாத்துக்குப் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறைவாக்கினரின் மகன்கள்’ என்பது சொல்லுக்கு சொல் வடிவம்; இங்கு அது உயிரியல் மகன்களை அவசியம் குறிக்காமல், இறைவாக்கினர் குழுவின் உறுப்பினர்களை அல்லது சீடர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்கு சொல், ‘உன் இடுப்பைக் கட்டிக்கொள்.’ பயணத்திற்கோ செயலுக்கோ ஆயத்தமாக நீண்ட ஆடையை இடுப்பில் கட்டிக்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: அப்போது இறைவாக்கினர் எலிசா
  rationale: וְ கதைத் தொடர்ச்சியை முன்னெடுப்பதால் இயல்பான தமிழ் நடையில் ‘அப்போது’ என வழங்கப்பட்டது. הַנָּבִיא என்பது எலிசாவின் பணியைக் குறிக்கும் அடைமொழி.
- source_word: קָרָא לְאַחַד
  choice: ஒருவனை அழைத்து
  rationale: ‘ஒருவனை அழைத்தார்’ என்ற அடிப்படைப் பொருளைத் தமிழின் வாக்கிய ஓட்டத்துக்கு ஏற்றவாறு வினையெச்சத் தொடராக வழங்குகிறது.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: இறைவாக்கினர் குழுவைச் சேர்ந்த ஒருவனை
  rationale: சொல்லுக்கு சொல் ‘இறைவாக்கினர்களின் மகன்களில்’ என்றாலும், இது உயிரியல் மகன்களை அவசியம் குறிக்காமல் இறைவாக்கினர் குழுவின் உறுப்பினரை அல்லது சீடரைச் சுட்டும் மரபுத்தொடர். தவறான புரிதலைத் தவிர்த்து, பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: உன் ஆடையை இடுப்பில் கட்டிக்கொள்
  rationale: பயணம் அல்லது செயலில் உடனே இறங்குவதற்காக நீண்ட ஆடையை இடுப்பில் கட்டும் செயலைக் குறிக்கும் எபிரெய மரபுத்தொடரின் concrete image-ஐ இயல்பான தமிழில் காக்கிறது.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: இந்த எண்ணெய்க் குடுவையை
  rationale: פַּךְ என்பது எண்ணெய் வைக்கப் பயன்படும் சிறிய கலனைக் குறிக்கிறது; ‘குடுவை’ நவீன தமிழில் இயல்பாகவும் போதிய அளவு குறிப்பாகவும் உள்ளது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: மூலத்தின் தெளிவான உடற்கூறு படிமத்தைப் பொதுமைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத் ராமோத்
  rationale: இடப்பெயரின் இரு கூறுகளையும் தமிழில் ஒலிபெயர்த்து, பரவலாக அறியப்படும் பெயர் வடிவத்தைத் தக்கவைக்கிறது.
