translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்ற சொல் נביא என்பதன் பங்கைத் தெளிவாகக் காட்டுகிறது. கட்டளைகளின் அவசரத்தன்மை குறுகிய நேரடி வாக்கியங்களால் காக்கப்பட்டுள்ளது.
