  text: וְ/יֵה֞וּא מִלֵּ֧א יָד֣/וֹ בַ/קֶּ֗שֶׁת וַ/יַּ֤ךְ אֶת יְהוֹרָם֙ בֵּ֣ין זְרֹעָ֔י/ו וַ/יֵּצֵ֥א הַ/חֵ֖צִי מִ/לִּבּ֑/וֹ וַ/יִּכְרַ֖ע בְּ/רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: ta
  text: யெகூ தன் வில்லை முழுமையாக இழுத்து, யெகோராமை அவனுடைய புயங்களுக்கு இடையே[a] அம்பினால் தாக்கினான். அந்த அம்பு அவனுடைய இதயத்தை ஊடுருவி வெளியே வந்தது; அவன் தன் தேரில் சரிந்து விழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இரு தோள்களுக்கு இடையே” / “அவனுடைய தோள்பட்டைகளுக்கு இடையே.” எபிரெயத்தில் சொற்படியாக, “அவனுடைய புயங்களுக்கு இடையே” என்று உள்ளது; இது மேல்முதுகு அல்லது தோள்பகுதியைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: தன் வில்லை முழுமையாக இழுத்து
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘வில்லில் தன் கையை நிரப்பினான்’ என்பதாகும்; இங்கு அம்பெய்வதற்காக வில்லை முழு அளவுக்கு இழுத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּךְ
  choice: அம்பால் தாக்கினான்
  rationale: נכה என்பது பொதுவாக ‘தாக்கு/அடி’ என்று பொருள்படும். சூழலில் தாக்கியது அம்பு என்பது தெளிவாதலால், செயலை மிகைப்படுத்தாமல் ‘அம்பால் தாக்கினான்’ என வழங்கப்படுகிறது.
- source_word: בֵּין זְרֹעָיו
  choice: இரு கைகளுக்கும் நடுவே
  rationale: זְרוֹעַ என்பதன் வழக்கமான பொருள் ‘கை/புயம்’. சாத்தியமான உடற்கூறு மரபுப்பொருளை முதன்மை உரையில் தீர்மானிக்காமல், நேரடிப் பொருள் தக்கவைக்கப்படுகிறது.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: அந்த அம்பு அவனுடைய இருதயத்தைத் துளைத்துக்கொண்டு வெளியே வந்தது
  rationale: மரணக் காயத்தின் சூழலில் לֵב உடலுறுப்பான இருதயத்தைக் குறிக்கிறது; அம்பு ஊடுருவி வெளியேறிய இயக்கத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: וַיִּכְרַע
  choice: சரிந்து விழுந்தான்
  rationale: כרע அடிப்படையில் ‘குனி/மண்டியிடு’ எனினும், இங்கு மரணக் காயத்தால் உடல் தளர்ந்து விழுவதைக் குறிக்கிறது.
- source_word: בְּרִכְבּוֹ
  choice: தன் தேரிலேயே
  rationale: சொல்லிலுள்ள உடைமைப் பின்னொட்டு யெகோராமின் தேரைக் குறிக்கிறது; ‘-லேயே’ காயமடைந்த இடத்திலேயே அவன் சரிந்ததை இயல்பாகச் சுட்டுகிறது.
