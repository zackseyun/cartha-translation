  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: ta
  text: யெகூ யெஸ்ரயேலுக்கு வந்தபோது, யேசபேல் அதைக் கேள்விப்பட்டாள். அவள் தன் கண்களுக்கு கண்மை தீட்டி[a], தன் தலையை அழகுபடுத்தி[b], சன்னல் வழியாக வெளியே பார்த்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்கு சொல்லாக, ‘தன் கண்களில் கண்மையைப் பூசினாள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் தலைமுடியை ஒழுங்குபடுத்தினாள்’; எபிரெயத்தில் சொல்லுக்கு சொல், ‘தன் தலையை நல்லதாக/அழகாக ஆக்கினாள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பது இங்கு யெகூ யெஸ்ரயேலை நோக்கி வந்து சேர்ந்ததைச் சுட்டுகிறது. தொடர்ந்த நிகழ்வுடன் இயல்பாக இணைக்கத் தமிழில் காலவினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேலுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘-க்கு’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמְעָה
  choice: அதைக் கேள்விப்பட்டாள்
  rationale: எபிரெயத்தில் கேட்கப்பட்ட செய்தியின் பொருள் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது யெகூவின் வருகையைக் குறிக்கிறது. ‘அதை’ என்பது அந்த மறைபொருளை அளவோடு வெளிப்படுத்துகிறது.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: தன் கண்களுக்கு மை தீட்டி
  rationale: פּוּךְ என்பது கண்களைச் சுற்றிப் பூசப்பட்ட கருநிற அழகுப்பொருளைக் குறிக்கிறது. ‘மை தீட்டி’ என்பது தமிழில் இயல்பானதும் அந்தச் செயலைத் தெளிவாகக் காட்டுவதுமாகும்.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: தன் தலையை அழகுபடுத்தி
  rationale: சொல்லுக்கு சொல் பொருள் ‘தன் தலையை நல்லதாக/அழகாக ஆக்கினாள்.’ அது தலைமுடியை ஒழுங்குபடுத்துவதையோ தலையை அலங்கரிப்பதையோ குறிக்கலாம்; ‘தலையை அழகுபடுத்தி’ இந்த விரிவைச் சுருக்காமல் காக்கிறது.
- source_word: וַתַּשְׁקֵף
  choice: வெளியே பார்த்தாள்
  rationale: உயரமான இடத்திலுள்ள திறப்பின் வழியாக வெளியே அல்லது கீழே பார்ப்பதை வினைச்சொல் குறிக்கிறது. ‘வெளியே பார்த்தாள்’ இயல்பான தமிழாகும்; ‘கூர்ந்து பார்த்தாள்’ போன்ற கூடுதல் நுணுக்கத்தைத் திணிப்பதில்லை.
- source_word: בְּעַד הַחַלּוֹן
  choice: சன்னல் வழியாக
  rationale: இந்த அமைப்பில் בְּעַד என்பது ஒரு திறப்பின் வழியே பார்ப்பதைக் குறிக்கிறது. ‘சன்னல் வழியாக’ இடவியல் பொருளைத் தெளிவாகத் தருகிறது.
