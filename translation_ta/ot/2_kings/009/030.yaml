translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் சுருக்கமான தொடர் நிகழ்வுகள் தமிழில் இயல்பான வாக்கிய ஓட்டத்துடன் தரப்பட்டுள்ளன. ‘தலையை அழகுபடுத்தி’ என்ற சொற்றொடர் தலைமுடி மட்டுமே எனப் பொருளைக் குறுக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
