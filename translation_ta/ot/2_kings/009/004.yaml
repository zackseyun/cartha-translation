translation:
  language: ta
  text: அந்த இளைஞன், அந்த இளம் இறைவாக்கினன்[a], ராமோத்-கிலேயாத்துக்குச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில் ‘அந்த இளைஞன்’ என்பது மீண்டும் வருகிறது: ‘அந்த இளைஞன், அந்த இளம் இறைவாக்கினன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அப்படியே ... சென்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்படியே’ முன் கிடைத்த கட்டளைக்கிணங்க அவன் புறப்பட்டுச் சென்ற தொடர்ச்சியை இயல்பான தமிழில் தருகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר இச்சூழலில் எலிசா அனுப்பிய இளைஞனைக் குறிக்கிறது. ‘இளைஞன்’ என்பது வயதைக் குறிக்கும் இயல்பான, பொதுவான தமிழ் சொல்; மூலத்தில் இல்லாத ‘வேலைக்காரன்’ என்ற உறவைச் சேர்க்காது.
- source_word: הַנַּעַר הַנָּבִיא
  choice: அந்த இளம் இறைவாக்கினன்
  rationale: இரண்டாவது הַנַּעַר என்பதுடன் הַנָּבִיא இணைந்து முன் கூறப்பட்ட நபரை விளக்கும் மறுபெயர்ச்சித் தொடராக நிற்கிறது. ஆகவே அந்த இளைஞனே இறைவாக்கினன் என்பதையும் எபிரெய மறுபடியுரைத்தலையும் மொழிபெயர்ப்பு காக்கிறது; ‘இறைவாக்கினனின் பணியாளர்’ என்று உறவைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத்-ராமோத்
  rationale: கூட்டிடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழில் பகுதியைச் சுட்டும் ‘கிலேயாத்’ என்பதையும் நகரப் பெயரான ‘ராமோத்’ என்பதையும் இணைப்புக்குறி தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: அந்த இளைஞன் தானே இறைவாக்கினனா, அல்லது ஓர் இறைவாக்கினனின் பணியாளனா?
  choice: அந்த இளம் இறைவாக்கினன்
  alternative: இறைவாக்கினனின் பணியாளனான அந்த இளைஞன்
  rationale: இரு பெயர்ச்சொற்களிலும் குறிப்புச் சுட்டு இருப்பதும் הַנַּעַר மீண்டும் வருவதும் மறுபெயர்ச்சி/வலியுறுத்தலை ஆதரிக்கின்றன. பணியாளர் என்ற உறவை இவ்வசனம் வெளிப்படையாகக் கூறாததால் அதை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நடை நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழாக உள்ளது. ‘இறைவாக்கினன்’ என்பது தீர்க்கதரிசி என்ற கருத்தை இயல்பாகத் தருகிறது; மூலத்தின் குறிப்பிடத்தக்க மறுபடியுரைத்தல் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
