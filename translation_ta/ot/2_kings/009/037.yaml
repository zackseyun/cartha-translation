base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: ta
  text: யெஸ்ரயேல் நிலப்பகுதியில்[a] யேசபேலின் பிணம் வயல்வெளியின் மேற்பரப்பில் கிடக்கும் சாணத்தைப்போல் ஆகும். அதனால், “இவள்தான் யேசபேல்” என்று யாரும் சொல்லமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஸ்ரயேலின் நிலத்துண்டில்.” எபிரெயச் சொல் חֵלֶק ஒரு குறிப்பிட்ட நிலப்பரப்பையோ நிலத்துண்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ஆகும்
  rationale: முந்தைய தீர்க்கதரிசன உரையைத் தொடரும் எதிர்காலப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִבְלַת אִיזֶבֶל
  choice: யேசபேலின் பிணம்
  rationale: נִבְלָה என்பது இறந்த உடலைக் குறிக்கிறது; ‘பிணம்’ அதன் கடுமையான தொனியைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כְּדֹמֶן
  choice: சாணத்தைப்போல்
  rationale: דֹּמֶן என்பதன் நேரடியான, காட்சியுணர்வுள்ள பொருள் சாணம் அல்லது எரு; இங்கு இழிவையும் சிதைவையும் ‘சாணம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: வயல்வெளியின் மேற்பரப்பில்
  rationale: சொல்லர்த்தமான ‘வயலின் முகத்தின்மேல்’ என்ற இடவியல் உருவகத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: யெஸ்ரயேல் நிலப்பகுதியில்
  rationale: חֵלֶק என்பது பங்கு, தனிப்பட்ட நிலத்துண்டு, அல்லது ஒரு நிலப்பகுதி எனப் பொருள்படலாம்; ‘நிலப்பகுதி’ பரப்பளவை முன்கூட்டியே குறுக்காமல் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: அதனால் ... யாரும் சொல்லமாட்டார்கள்
  rationale: இங்கு தொடர்புச்சொல் விளைவை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது; அடையாளம் காண முடியாத நிலையைத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: זֹאת אִיזָבֶל
  choice: இவள்தான் யேசபேல்
  rationale: பெண்பால் சுட்டுப்பெயரையும் அடையாளப்படுத்தும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
