  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: ta
  text: 'பின்பு அவன் தன் அதிகாரி பித்காரிடம், “அவனைத் தூக்கி, யெஸ்ரயேலைச் சேர்ந்த நாபோத்தின் வயல் நிலப்பகுதியில் எறிந்துவிடு. நினைவுகொள்: நீயும் நானும் அவனுடைய தந்தையான ஆகாபுக்குப் பின்னால் இணையாகச் சவாரி செய்துகொண்டிருந்தபோது[b], யாவே அவனுக்கு எதிராக இந்த இறைவாக்கை[c]ச் சுமத்தினார்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில், “ஜோடிகளாகச் சவாரி செய்துகொண்டிருந்தோம்.” யெகூவும் பித்காரும் ஆகாபுக்குப் பின்னால் ஒன்றாகச் சென்றதை இச்சொற்றொடர் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தீர்ப்புரை” அல்லது “சுமை.” இதற்கான எபிரெயச் சொல் பாரமிக்க தீர்க்கதரிசன அறிவிப்பைக் குறிக்கலாம்; சொற்பட, யாவே அதை அவன்மேல் ‘சுமத்தினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: பித்கார்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: שלשה
  choice: தன் அதிகாரியான
  rationale: இது பித்காரின் பதவி அல்லது பணியைக் குறிக்கும் தொழில்நுட்பச் சொல்லாகத் தோன்றுகிறது. குறிப்பிட்ட இராணுவப் பதவியை உறுதிசெய்யாமல், சூழலுக்கு ஏற்ற பொதுவான பொருளைத் தருகிறது.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: அவனைத் தூக்கி ... எறிந்துவிடு
  rationale: இரண்டு கட்டளைகளின் நேரடியான வலிமையையும், உடலை எடுத்துச் சென்று வீசும் சூழலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: வயல் நிலப்பகுதியில்
  rationale: חֶלְקָה என்பதன் தனிப்பட்ட நிலத்துண்டு அல்லது பகுதி என்ற பொருளையும் שָׂדֶה என்பதன் வயல் என்ற பொருளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: யெஸ்ரயேலைச் சேர்ந்த நாபோத்
  rationale: தனிப்பெயரையும் ஊர்சார்பைக் குறிக்கும் சொல்லையும் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: רֹכְבִים צְמָדִים
  choice: இணையாகச் சவாரி செய்துகொண்டிருந்தபோது
  rationale: சொல்லுக்குச் சொல் ‘ஜோடிகளாகச் சவாரி செய்தல்’ என்பதாக இருந்தாலும், இங்கு யெகூவும் பித்காரும் ஆகாபுக்குப் பின்னால் ஒன்றாக அல்லது இணையாகச் சென்றதைக் குறிக்கிறது; மூலத்தின் ஓரளவு தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: அவனுக்கு எதிராக இந்த இறைவாக்கை அறிவித்தார்
  rationale: מַשָּׂא என்பதன் பாரமிக்க தீர்க்கதரிசன அறிவிப்பு என்ற பொருளை ‘இறைவாக்கு’ தெரிவிக்கிறது; עָלָיו என்பதன் எதிர்மறையான நோக்கை ‘அவனுக்கு எதிராக’ காக்கிறது. எபிரெய உருவகத்தின் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- issue: מַשָּׂא என்பதன் தீர்க்கதரிசனப் பொருள்
  choice: இறைவாக்கு
  alternative: தீர்ப்புரை / சுமை
  rationale: இந்தச் சூழலில் அது ஆகாபுக்கு எதிரான பாரமிக்க தீர்க்கதரிசன அறிவிப்பைக் குறிக்கிறது. ‘இறைவாக்கு’ அதன் தீர்க்கதரிசனத் தன்மையைத் தெரிவிக்கிறது; ‘சுமை’ என்ற உருவகப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אָבִיו என்பதில் ‘அவனுடைய தகப்பன்’ யாரைக் குறிக்கிறது
  choice: அவனுடைய தகப்பன் ஆகாப்
  alternative: யோராமின் தகப்பன் ஆகாப்
  rationale: சூழலில் இது யோராமைக் குறித்தாலும், மூலத்தின் பிரதிப்பெயர் வடிவத்தை வெளிப்படையான பெயரால் மாற்றாமல் வைத்திருப்பது உரையின் இயல்பையும் குறிப்பீட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் கடுமை மென்மையாக்கப்படவில்லை. ‘அவன்,’ ‘அவனுடைய தகப்பன்’ ஆகிய பிரதிப்பெயர்கள் சூழலில் புரிந்துகொள்ளத்தக்கவாறு இருந்தாலும், மூலத்தில் உள்ள குறிப்பீட்டைத் தேவையின்றி விரிவாக்காமல் காக்கப்பட்டுள்ளன.
