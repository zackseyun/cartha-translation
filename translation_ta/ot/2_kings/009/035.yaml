translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதும் கண்ணியமானதும் நேரடியானதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கொடூரமான உடற்கூறியல் விவரம் மென்மைப்படுத்தப்படாமல் பேணப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
