base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: ta
  text: எனவே, அவளை அடக்கம் செய்ய அவர்கள் சென்றார்கள். ஆனால் அவளுடைய உடலில் மண்டையோட்டையும் பாதங்களையும் உள்ளங்கைகளையும் தவிர வேறு எதையும் அவர்கள் காணவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இதைச் சொல்லுக்குச்சொல், “அவளில் மண்டையோட்டையும் பாதங்களையும் உள்ளங்கைகளையும் தவிர வேறு எதையும் அவர்கள் காணவில்லை” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் “அவளில்” என்பது அவளுடைய உடலில் எஞ்சியிருந்தவற்றைக் குறிக்கும் மரபான வெளிப்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: எனவே, அவர்கள் சென்றார்கள்
  rationale: வழக்கமான எபிரேயக் கதைத் தொடரை முன்னெடுக்கும் வையிக்தோல் வடிவம்; முந்தைய கட்டளையின் விளைவாக அவர்கள் சென்றதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְקָבְרָהּ
  choice: அவளை அடக்கம் செய்ய
  rationale: קבר என்ற வினையின் infinitive construct, மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டுடன், யேசபேலைக் குறிக்கிறது; தமிழில் இயல்பான நோக்கத் தொடர்.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: ஆனால் அவளுடைய உடலில் ... வேறு எதையும் அவர்கள் காணவில்லை
  rationale: וְ இங்கு எதிர்மறைத் திருப்பைக் குறிக்கிறது. בָהּ என்பதைச் சொற்சொல்லாக ‘அவளில்’ என்று மொழிபெயர்ப்பதைவிட, சூழலில் அவளுடைய உடலில் எஞ்சியிருந்தவற்றைக் குறிக்கும் விதமாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: இணைந்த துகள்கள் விதிவிலக்கைக் குறிக்கின்றன; ‘தவிர’ என்பது சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: הַגֻּלְגֹּלֶת
  choice: மண்டையோடு
  rationale: இந்த உடல் எச்சங்களின் சூழலில் גֻּלְגֹּלֶת முழுத் தலையை அல்ல, மண்டையோட்டைக் குறிக்கிறது.
- source_word: וְהָרַגְלַיִם
  choice: கால்கள்
  rationale: רַגְלַיִם என்ற இருமை வடிவின் நேரடியான உடற்கூறியல் பொருள்; தமிழில் ‘கால்கள்’ இயல்பானது.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: உள்ளங்கைகள்
  rationale: כַּף என்பது கையின் உள்ளங்கை அல்லது குழிந்த பகுதியைக் குறிக்கிறது; ‘கைகள்’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் உடற்கூறியல் துல்லியத்தைப் பேணுகிறது.
