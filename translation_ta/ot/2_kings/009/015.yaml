  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: ta
  text: யெகோராம் அரசன், அராம் மன்னனான ஹசாயேலுக்கு எதிராகப் போரிட்டபோது அராமியர்கள் அவனுக்கு ஏற்படுத்திய காயங்களிலிருந்து குணமடைவதற்காக யெஸ்ரயேலுக்குத் திரும்பியிருந்தான். யெகூ, “இது உங்கள் விருப்பமானால், யெஸ்ரயேலுக்குப் போய் இதைத் தெரிவிப்பதற்காக ஒருவரும் நகரத்திலிருந்து தப்பிச் செல்ல விடாதீர்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பியிருந்தான்
  rationale: இந்தச் செயல் யெகூ பேசுவதற்கு முன்பே நிகழ்ந்த பின்னணிச் சம்பவம் என்பதைத் தமிழில் இயல்பாகக் காட்டும் இறந்தகால நிறைவு வடிவம்.
- source_word: לְהִתְרַפֵּא
  choice: குணமடைவதற்காக
  rationale: ரפא வினையின் இத்தபேல் வடிவம் இங்கு காயங்களிலிருந்து மீண்டு நலம்பெறுவதைக் குறிக்கிறது; தன்னைத்தானே குணப்படுத்தினான் என்ற பொருளை இது தராது.
- source_word: מִן הַמַּכִּים
  choice: காயங்களிலிருந்து
  rationale: சொல்லின் அடிப்படை உணர்வு அடிகள் அல்லது தாக்குதல்கள் என்றாலும், இச்சூழலில் அவற்றால் ஏற்பட்ட போர்க்காயங்களே குறிக்கப்படுகின்றன.
- source_word: יַכֻּהוּ
  choice: தனக்கு ஏற்படுத்திய
  rationale: நכה என்பதன் ‘தாக்கு’ என்ற காரண உணர்வை, ‘காயங்கள்’ என்பதுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֲרַמִּים
  choice: அராமியர்கள்
  rationale: வரலாற்று இனப்பெயரான அராமியர்களை நேரடியாகக் குறிக்கிறது; பிற்கால ‘சீரியர்கள்’ என்ற பெயரைத் தவிர்க்கிறது.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: அசகேலுக்கு எதிராகப் போரிட்டபோது
  rationale: בְּ இணைந்த வினையெச்சத்தின் காலச் சூழலையும், போர் எதிரியாக இருந்த அசகேலுடனான பகைநிலையையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: இது உங்கள் விருப்பமானால்
  rationale: ‘உங்கள் ஆத்துமா இருந்தால்’ என்ற சொற்சொல் மொழிபெயர்ப்பை விட, குழுவினரின் விருப்பம் அல்லது சம்மதத்தை வெளிப்படுத்தும் எபிரெய மொழிவழக்கின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: פָלִיט
  choice: ஒருவரும் ... தப்பிச் செல்ல
  rationale: இங்கு ஏற்கெனவே ‘தப்பியோடியவர்’ என்ற நிலைப்பெயர் அல்ல, செய்தியை எடுத்துச் செல்ல யாரும் தப்பிவிடக் கூடாது என்ற தடை குறிக்கப்படுகிறது.
- source_word: לָלֶכֶת לְהַגִּיד
  choice: போய் இதைத் தெரிவிப்பதற்காக
  rationale: பயணம் செய்து செய்தியை அறிவித்தல் என்ற தொடர்ச்சியான செயல்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיִזְרְעֶאל
  choice: யெஸ்ரயேலுக்குப்
  rationale: செய்தியை அறிவிக்கச் செல்லும் இலக்கிடமாக யெஸ்ரயேலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
