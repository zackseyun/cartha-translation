translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வரலாற்று மரியாதை குன்றாமலும் அமைக்கப்பட்டுள்ளது. ‘அராம்/அராமியர்கள்’ என்ற மூலத்துக்கு நெருக்கமான வரலாற்றுப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மொழிவழக்குகள் சொற்சொல்லாக அல்லாமல் அவற்றின் சூழற்பொருளுடன் தரப்பட்டுள்ளன; தேவையற்ற விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
