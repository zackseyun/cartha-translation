  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: ta
  text: அவன் வந்தான்; அங்கே படைத் தளபதிகள் அமர்ந்திருந்தார்கள். அவன், “தளபதியே, உங்களிடம் சொல்ல எனக்கு ஒரு செய்தி இருக்கிறது[a]” என்றான். அதற்கு யேகூ, “எங்கள் எல்லாரில் யாரிடம்?” என்று கேட்டான். அவன், “உங்களிடம்தான், தளபதியே” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தளபதியே, உங்களுக்காக என்னிடம் ஒரு வார்த்தை இருக்கிறது.”
    reason: דָּבָר לִי אֵלֶיךָ என்ற எபிரெயச் சொற்றொடரின் சொற்படியான வடிவத்தையும் ‘செய்தி’ என்ற இயல்பான பொருள் மாற்றையும் வாசகர் காணும்படி தருகிறது.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அவன் வந்தான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உள்ளே’ போன்ற இடக்குறிப்பைச் சேர்க்கவில்லை.
- source_word: וְהִנֵּה
  choice: அங்கே
  rationale: காட்சியை வாசகரின் கவனத்துக்குக் கொண்டுவரும் הִנֵּה என்பதன் செயல்பாட்டை இயல்பான தமிழில் தருகிறது; ‘இதோ’ என்பது இச்சூழலில் செயற்கையாக ஒலிக்கக்கூடும்.
- source_word: שָׂרֵי הַחַיִל
  choice: படைத் தளபதிகள்
  rationale: இராணுவச் சூழலில் உள்ள தலைமை அதிகாரிகளைத் தெளிவாகக் குறிக்கிறது; குறிப்பிட்ட நவீன இராணுவப் பதவிநிலையைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: יֹשְׁבִים
  choice: அமர்ந்திருந்தார்கள்
  rationale: பங்கேற்புவினை காட்டும் தொடர்நிலை காட்சியைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: דָּבָר
  choice: செய்தி
  rationale: இங்கு דָּבָר என்பது தெரிவிக்க வேண்டிய செய்தி அல்லது காரியத்தைக் குறிக்கும் எபிரெய வழக்குச்சொல். ‘செய்தி’ இயல்பான பொருளைத் தருகிறது; நேரடியான ‘வார்த்தை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִי אֵלֶיךָ
  choice: உங்களிடம் சொல்ல எனக்கு
  rationale: ‘என்னிடம் உங்களுக்காக ஒரு சொல் உள்ளது’ என்ற எபிரெயச் சொற்றொடரின் கருத்தை நவீனத் தமிழில் இயல்பாகவும், முதல் நபர் கூறும் உரிமையையும் இலக்காகிய நபரையும் காத்தும் தருகிறது.
- source_word: הַשַּׂר
  choice: தளபதியே
  rationale: இராணுவத் தலைவரை நேரடியாக அழைக்கும் சொல்லாக மரியாதையும் சூழலுக்கேற்ற தெளிவும் கொண்டுள்ளது.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: எங்கள் எல்லாரில் யாரிடம்?
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளையும் מִכֻּלָּנוּ என்பதன் பகுப்புப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: உங்களிடம்தான், தளபதியே
  rationale: உரையாடலில் குறிக்கப்பட்ட நபரை வலியுறுத்தித் தெளிவுபடுத்துகிறது; אֵלֶיךָ என்பதன் ‘உங்களிடம்’ என்ற பொருளை நேரடியாக வைத்திருக்கிறது.
