  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும், தீர்ப்புரையின் சுருக்கத்தையும் தீவிரத்தையும் காத்து மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் ‘யேசபேல்’, ‘யெஸ்ரயேல்’ என வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களில் தரப்பட்டுள்ளன.
