source:
  edition: WLC
  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: ta
  text: “யெஸ்ரயேலின் நிலப்பகுதியில் யேசபேலை நாய்கள் தின்னும்[a]; அவளைப் புதைக்க யாரும் இருக்கமாட்டார்கள்.” பின்னர் அவன் கதவைத் திறந்து தப்பி ஓடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஸ்ரயேலின் நிலப்பங்கில்” அல்லது “யெஸ்ரயேலின் நிலத்துண்டில்.” எபிரெயச் சொல் חֵלֶק ஒரு பங்காக அமைந்த நிலத்தையோ ஒரு குறிப்பிட்ட நிலத்துண்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: தின்னும்
  rationale: אכל என்பதன் எளிய ‘உண்ணுதல்’ பொருளை நேரடியாகத் தருகிறது. நாய்கள் குறித்த சூழலில் ‘தின்னும்’ என்பது இயல்பானது; ‘விழுங்கிவிடும்’ போன்ற சொல் மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கும்.
- source_word: הַכְּלָבִים
  choice: நாய்கள்
  rationale: எபிரெய மொழியிலுள்ள குறித்த சுட்டைத் தமிழ் இயல்புக்கு ஏற்ப தனிக் குறிச்சொல் இன்றியே வெளிப்படுத்துகிறது; தீர்ப்பின் தெளிவான காட்சி தக்கவைக்கப்படுகிறது.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: யெஸ்ரயேலின் நிலப்பகுதியில்
  rationale: חֵלֶק என்பது பங்கு, நிலத்துண்டு அல்லது நிலப்பகுதி எனப் பொருள்படலாம். ‘நிலப்பகுதி’ தெளிவான நவீன தமிழில் நிலப்பரப்பைக் குறிக்கிறது; அதன் அளவைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: וְאֵין קֹבֵר
  choice: அவளைப் புதைக்க யாரும் இருக்கமாட்டார்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘புதைக்கிறவர் எவரும் இல்லை’ என்பதாகும். தீர்க்கதரிசன அறிவிப்பின் எதிர்கால உணர்வையும், சூழலிலிருந்து தெளிவாகும் யேசபேலைக் குறிக்கும் செயப்படுபொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: பின்னர் அவன் கதவைத் திறந்து
  rationale: Wayyiqtol வடிவம் தொடர்ச்சியான அடுத்த நிகழ்வைக் குறிக்கிறது. ‘பின்னர்’ அந்த நிகழ்வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: וַיָּנֹס
  choice: தப்பி ஓடினான்
  rationale: נוס என்பதன் ‘ஓடித் தப்புதல்/தப்பியோடுதல்’ பொருளைச் சுருக்கமாகவும் அவசர உணர்வுடனும் தருகிறது.
- source_word: אִיזֶבֶל
  choice: யேசபேல்
  rationale: தனிப்பெயர் நவீனத் தமிழில் பரவலாக அறியப்படும் வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
