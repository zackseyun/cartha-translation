  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: ta
  text: ஆகாபின் மகன் யோராமின் ஆட்சியின் பதினோராம் ஆண்டில்[a], அகசியா யூதாவின் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோராம் மற்றும் அகசியாவின் ஆட்சிக்காலங்களைப் பற்றிய அரசர்கள், நாளாகமம் ஆகிய நூல்களில் உள்ள காலக்குறிப்புகளை ஒன்றோடொன்று பொருத்துவது கடினம். காலவரிசையை முதன்மை உரையில் தீர்க்க முயலாமல், இங்கு எபிரெய உரை உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: ஆட்சியின் ... ஆண்டில்
  rationale: வசனத் தொடக்கத்தில் உள்ள இணைப்புச்சொல்லைத் தமிழில் தனியே மொழிபெயர்க்காமல், காலக் குறிப்பை இயல்பாகத் தருகிறது; அரசாண்டுக் கணக்கைக் குறிக்கும் சூழலைத் தெளிவாக்க ‘ஆட்சியின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: பதினோராம் ஆண்டில்
  rationale: எபிரெய அரசாண்டுக் காலக்குறிப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: לְיוֹרָם
  choice: யோராமின் ஆட்சியின்
  rationale: இங்குள்ள לְ மற்றொரு அரசனின் ஆட்சியை காலக் கணக்கின் அடிப்படையாகக் குறிக்கிறது.
- source_word: בֶּן אַחְאָב
  choice: ஆகாபின் மகன்
  rationale: யோராமை அவனுடைய தந்தையின் பெயரால் அடையாளப்படுத்தும் நேரடியான உறவுமுறைச் சொற்றொடர்.
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: இச்சூழலில் முழு ஆட்சிக்காலத்தைக் காட்டாமல் அரியணை ஏற்றதைச் சுட்டும் வினை; ‘அரசனானான்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲחַזְיָה
  choice: அகசியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: עַל יְהוּדָה
  choice: யூதாவுக்கு
  rationale: מָלַךְ உடன் வரும் עַל ஆளுகைக்கு உட்பட்ட நாட்டைக் குறிக்கிறது; ‘யூதாவுக்கு அரசனானான்’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: யோராம்–அகசியா ஆட்சிக்காலக் குறிப்புகளின் காலவரிசை
  choice: எபிரெய உரையில் உள்ள ‘பதினோராம் ஆண்டு’ என்பதையே முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: அரசர்கள் மற்றும் நாளாகமம் நூல்களின் பிற காலக்குறிப்புகளோடு ஒத்திசைக்க எண்ணை மாற்றுதல் அல்லது விளக்கத்தை முதன்மை உரையில் சேர்த்தல்
  rationale: மூல எபிரெய வாசகத்தைத் திருத்தாமலும் காலவரிசைச் சிக்கலை அமைதியாகத் தீர்த்துவிடாமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. காலக்குறிப்பு இயல்பாக அமைய ‘ஆட்சியின்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; [a] குறி தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
