base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: ta
  text: 'அவர்கள் திரும்பிவந்து அவனிடம் தெரிவித்தார்கள். அப்போது அவன், “தம் ஊழியனான திஷ்பியனான எலியாவின் மூலம் அவர் கூறிய யாவேயின் வார்த்தையே இது: ‘யெஸ்ரயேலின் நிலப்பகுதியில்[a] நாய்கள் யேசபேலின் சதையைத் தின்னும்’” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஸ்ரயேலின் நிலத்துண்டில்.” எபிரெயச் சொல் ஒரு பகுதியையோ, பங்கையோ, குறிப்பிட்ட நிலத்துண்டையோ குறிக்கலாம்.
    reason: חֵלֶק என்ற சொல்லின் சொற்பொருள் வரம்பையும், இடத்தின் பரப்பளவு குறித்த தெளிவின்மையையும் காக்கிறது.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: அவர்கள் திரும்பிவந்து அவனிடம் தெரிவித்தார்கள்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் தருகிறது; נגד என்பதன் Hiphil வடிவத்திலுள்ள ‘தெரிவித்தல்/அறிவித்தல்’ பொருளையும் காக்கிறது.
- source_word: דְּבַר יְהוָה הוּא
  choice: இது யாவேயின் வார்த்தை
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தின் அடையாளப்படுத்தும் வலியுறுத்தலைத் தெளிவான தமிழில் தருகிறது; இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: בְּיַד עַבְדּוֹ
  choice: தம் பணியாளரான ... மூலம்
  rationale: ‘தம் பணியாளரின் கையால்’ என்பது எபிரெய மொழிமரபு; தமிழில் அதன் கருவி/முகவர் பொருளை இயல்பாக ‘மூலம்’ எனத் தருவது பொருத்தமானது.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: திஷ்பியன் எலியா
  rationale: தனிப்பெயரையும் ஊர்சார் அடைமொழியையும் சுருக்கமாகவும் தெளிவாகவும் ஒலிபெயர்க்கிறது.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: யெஸ்ரயேலின் நிலப்பகுதியில்
  rationale: חֵלֶק என்பது பகுதி, பங்கு, நிலத்துண்டு ஆகிய பொருள்களைக் கொள்ளலாம். ‘நிலப்பகுதி’ இங்கு புவியியல் பொருளைத் தருவதோடு, குறிப்பிட்ட சிறு நிலத்துண்டு என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: நாய்கள் ... தின்னும்
  rationale: אָכַל என்பதன் நேரடியான ‘உண்ணுதல்’ பொருளை, இச்சூழலின் கடுமையை இயல்பாக வெளிப்படுத்தும் ‘தின்னும்’ என்ற தமிழ்ச் சொல்லால் தருகிறது.
- source_word: בְּשַׂר אִיזָבֶל
  choice: யேசபேலின் சதை
  rationale: בָּשָׂר என்பது இங்கு ‘உடல்’ என்பதைக் காட்டிலும் குறிப்பாக ‘சதை’; தீர்ப்புரையின் கொடூரமான நேர்த்தியை இது காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பொதுவாக ஏற்கப்படும் உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: தீர்க்கதரிசனச் செய்தியின் முகவர் மொழிமரபு
  choice: தம் பணியாளரான ... மூலம்
  alternative: தம் பணியாளரின் கையால்
  rationale: இறைவன் தீர்க்கதரிசியின் வழியாகப் பேசியதாக மூலவாக்கியம் கூறுகிறது. சொற்சொல்லான ‘கையால்’ என்பதைக் கோட்பாட்டுப் பொருளில் விரிவாக்காமல், முகவர் உறவை இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசனத்தின் நேரடியான கடுமை மென்மையாக்கப்படவில்லை; அதேவேளை எபிரெய மொழிமரபுகள் தமிழில் செயற்கையாக ஒலிக்காதபடி இயல்பாக்கப்பட்டுள்ளன.
