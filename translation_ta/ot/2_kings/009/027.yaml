  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: ta
  text: யூதாவின் அரசனான அகசியா இதைக் கண்டபோது, பெத்-ஹக்கான்[a] வழியாகத் தப்பியோடினான். யெகூ அவனைத் துரத்திச் சென்று, “அவனையும் தேரிலேயே தாக்குங்கள்![b]” என்றான். யிப்லெயாமுக்கு அருகிலுள்ள கூர் ஏற்றத்தில் அவர்கள் அவனைத் தாக்கினார்கள். ஆனால் அவன் மெகிதோவுக்குத் தப்பியோடி, அங்கே இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெத்-ஹக்கான்’ என்பதற்கு ‘தோட்டத்தின் வீடு’ என்று பொருள் இருக்கலாம்; ஆனால் இங்கு அது ஓர் இடப்பெயராக இருக்க வாய்ப்புள்ளதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவனையும் தேரை நோக்கித் தாக்குங்கள்!” இங்குள்ள எபிரெய முன்னிடைச்சொல் தாக்குதல் நிகழும் இடத்தையோ அதன் திசையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: இதைக் கண்டபோது
  rationale: எபிரெய வினைச்சொல் வெறுமனே ‘கண்டான்’ என இருந்தாலும், முன்பு நிகழ்ந்த சம்பவமே மறைமுகச் செயப்படுபொருள். தமிழில் இயல்பாக அமைய ‘இதை’ வெளிப்படுத்தப்படுகிறது; சம்பவம் மேலும் குறிப்பாக்கப்படவில்லை.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: பெத்-ஹக்கான் வழியாக
  rationale: דֶּרֶךְ என்பது ‘வழி/பாதை’. בֵּית הַגָּן இங்கு இடப்பெயராகச் செயல்படுவதால், அதன் சொற்பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: அவனைத் துரத்திச் சென்று
  rationale: רדף உடன் אַחַר வருவது ஒருவரைப் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது. ‘துரத்திச் சென்று’ என்பது அந்த இயக்கத்தைக் காட்டும் இயல்பான தமிழ்.
- source_word: גַּם אֹתוֹ
  choice: அவனையும்
  rationale: 'גַּם சேர்த்தலின் பொருளைத் தருகிறது: யோராமைத் தொடர்ந்து அகசியாவும் தாக்கப்பட வேண்டும்.'
- source_word: הַכֻּהוּ
  choice: தாக்குங்கள்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’. ‘கொல்லுங்கள்’ என்பது உடனடியாகச் சொல் தருவதைக் காட்டிலும் அதிகமாக விளக்கிவிடும்.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: தேரிலேயே
  rationale: אֶל பொதுவாக ‘நோக்கி’ என்பதைக் குறித்தாலும், இங்கு தாக்குதல் நிகழும் இடத்தையோ திசையையோ குறிக்கலாம். சூழலில் அகசியா தேரில் இருக்கும்போது தாக்கப்படுவதை ‘தேரிலேயே’ இயல்பாகத் தெரிவிக்கிறது; வேறுபொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּמַעֲלֵה גוּר
  choice: கூர் ஏற்றத்தில்
  rationale: מַעֲלֶה என்பது ஏற்றம் அல்லது மேடேறும் பாதையைக் குறிக்கிறது. இடவியல் குறிப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: யிப்லெயாமுக்கு அருகிலுள்ள
  rationale: இந்தத் தொடர் கூர் ஏற்றத்தை யிப்லெயாமுடன் இடவியல் ரீதியாக இணைக்கிறது. துல்லியமான தூரத்தை வரையறுக்காமல் ‘அருகிலுள்ள’ என வழங்கப்படுகிறது.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: மெகிதோவுக்குத் தப்பியோடி
  rationale: נוּס என்பது ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது; தொடரும் இடப்பெயர் சென்றடைந்த திசை அல்லது இலக்கை உணர்த்துகிறது.
- source_word: וַיָּמָת שָׁם
  choice: அங்கே இறந்தான்
  rationale: இறப்பு மெகிதோவில் நிகழ்ந்தது என்பதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
