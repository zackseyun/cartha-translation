translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வழங்கப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெய உரையில் தாக்குதல் கட்டளைக்குப் பின் இடக்குறிப்பு நேரடியாக வருவதால், நிகழ்வின் தொடர்ச்சியைத் தமிழில் தெளிவாக்க ‘அவர்கள் அவனைத் தாக்கினார்கள்’ என மறைமுகமாக உள்ள செயல் வெளிப்படுத்தப்பட்டுள்ளது.
