  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: ta
  text: யெகோராம் யெகூவைக் கண்டபோது, “யெகூவே, சமாதானமா?” என்று கேட்டான். அதற்கு அவன், “உன் தாய் யேசபேலின் வேசித்தனங்களும்[a] அவளுடைய பல சூனியங்களும் நீடித்திருக்கும் வரை, சமாதானம் ஏது?[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேசித்தனங்கள்’ என்பதற்கு ‘விபசாரச் செயல்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியான பாலியல் ஒழுக்கக்கேட்டையும் உருவகமாக ஒழுக்க மற்றும் வழிபாட்டு உண்மையின்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எப்படி சமாதானம் இருக்க முடியும்?’ எபிரெயில் யெகோராமின் கேள்வியிலுள்ள ‘சமாதானம்’ என்ற சொல்லே பதிலிலும் மீண்டும் வந்து வினாவை வலுப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: யெகோராம் ... கண்டபோது
  rationale: எபிரெயக் கதைநடைத் தொடர் அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; தனியாக ‘நிகழ்ந்ததாவது’ என்று சேர்த்து நடையைக் கடினமாக்கவில்லை.
- source_word: הֲשָׁלוֹם
  choice: சமாதானமா?
  rationale: சமாதான நோக்கத்தைக் குறித்த கேள்வியாக இயல்பாக ஒலிக்கிறது; அடுத்த பதிலில் வரும் அதே சொல்லையும் தக்கவைக்கிறது.
- source_word: מָה הַשָּׁלוֹם
  choice: சமாதானம் ஏது?
  rationale: எபிரெயில் உள்ள சுருக்கமான வினாவையும் ‘சமாதானம்’ என்ற சொல்லின் மறுபயன்பாட்டால் உருவாகும் சொல்லழுத்தத்தையும் பாதுகாக்கிறது.
- source_word: עַד
  choice: தொடரும்வரை
  rationale: இச்செயல்கள் நீடிக்கும் காலமெல்லாம் சமாதானம் சாத்தியமில்லை என்ற சூழ்நிலைப் பொருளைத் தெளிவாக்குகிறது.
- source_word: זְנוּנֵי
  choice: வேசித்தனங்கள்
  rationale: மூலத்தின் அதிர்ச்சியூட்டும் உருவகத்தை மென்மைப்படுத்தாமல் தருகிறது; நேரடியான பாலியல் பொருளோடு ஒழுக்க மற்றும் வழிபாட்டு உண்மையின்மையையும் சுட்டக்கூடிய திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: உன் தாய் யேசபேல்
  rationale: குற்றஞ்சாட்டும் நேரடித் தொனியையும் சொற்களின் உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּכְשָׁפֶיהָ
  choice: அவளுடைய ... சூனியங்கள்
  rationale: மந்திரவாதச் செயல்களைக் குறிக்கும் மூலச் சொல்லின் பன்மையைத் தக்கவைக்கும் தெளிவான தமிழ்ச் சொல்.
- source_word: הָרַבִּים
  choice: பல
  rationale: யேசபேலின் சூனியங்கள் எண்ணற்ற அளவில் இருந்ததை எளிய, இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: זְנוּנֵי என்பதை நேரடியான சொல்லாகவா அல்லது பொதுவான ஒழுக்க/வழிபாட்டுச் சொல்லாகவா மொழிபெயர்ப்பது
  choice: வேசித்தனங்கள்
  alternative: பாலியல் ஒழுக்கக்கேடுகள்; சிலைவழிபாடுகள்
  rationale: மூலம் திட்டமிட்டே பயன்படுத்தும் கடுமையான சொல்லைத் தக்கவைக்கிறது. அதை ‘சிலைவழிபாடுகள்’ என்று மட்டும் மொழிபெயர்த்தால் சாத்தியமான பாலியல் மற்றும் ஒழுக்கப் பொருள் மறையும்; ‘பாலியல் ஒழுக்கக்கேடுகள்’ என்று மட்டும் மொழிபெயர்த்தால் வழிபாட்டு உண்மையின்மை குறித்த உருவகப் பொருள் மறையும்.
- issue: שָׁלוֹם என்பதன் இரு நிகழ்வுகளையும் ஒரே சொல்லால் தருவது
  choice: இரண்டு இடங்களிலும் ‘சமாதானம்’
  alternative: நலமா?; எல்லாம் நன்றாக இருக்கிறதா?
  rationale: யெகோராமின் கேள்விக்கும் யெகூவின் மறுப்புக்கும் இடையிலான சொல் மறுபயன்பாட்டையும் இறையியல்-அரசியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சமாதானம் ஏது?’ என்ற சுருக்கமான வினா மூலத்தின் கூர்மையான மறுப்பைத் தக்கவைக்கிறது. ‘வேசித்தனங்கள்’ என்பது வாசகருக்கு அதிர்ச்சியளிக்கக்கூடியதாயினும், மூலத்தின் திட்டமிட்ட கடுமையையும் பொருள் பன்மையையும் பாதுகாப்பதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
