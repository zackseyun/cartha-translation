base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: ta
  text: நீ அங்கே சென்றதும், நிம்சியின் மகனான யோசபாத்தின் மகன் யெகூவைத் தேடு. உள்ளே சென்று, அவனுடைய சகோதரர்களின் நடுவிலிருந்து அவனை எழுந்திருக்கச் செய்து, ஓர் உள் அறைக்குள்[a] அழைத்துச் செல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அறைக்குள் ஓர் அறை”; அதாவது, தனிமையான ஓர் உள் அறை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: நீ அங்கே சென்றதும்
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப வருதல், செல்லுதல், சென்றடைதல் எனப் பொருள்படும்; அடுத்த கட்டளைக்கு முந்திய வருகையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּרְאֵה שָׁם
  choice: தேடு
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’; இங்கு பெயரிடப்பட்ட நபரைக் கண்டறியும் கட்டளையாக இருப்பதால் ‘தேடு’ இயல்பாக அமைகிறது. שם குறிக்கும் இடம் முந்தைய ‘அங்கே’ என்பதில் சூழலால் தெளிவாக உள்ளது.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: நிம்சியின் மகனான யோசபாத்தின் மகன் யெகூ
  rationale: எபிரெய மரபுவழித் தொடரின் உறவுமுறையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּבָאתָ
  choice: உள்ளே சென்று
  rationale: யெகூ இருக்கும் கூட்டத்திற்குள் நுழைந்து அடுத்த செயல்களைச் செய்யும் நகர்வைச் சூழலுக்கேற்ற தமிழில் தெரிவிக்கிறது.
- source_word: וַהֲקֵמֹתוֹ
  choice: அவனை எழுந்திருக்கச் செய்து
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ஒருவரை எழும்பவோ நிற்கவோ செய்வதைக் குறிக்கிறது; மூலத்தின் காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ אֶחָיו
  choice: அவனுடைய சகோதரர்களின் நடுவிலிருந்து
  rationale: אחים என்பதன் நேரடிப் பொருள் ‘சகோதரர்கள்’; சூழலில் இது உடனிருந்த தோழர்கள் அல்லது சக அதிகாரிகளையும் குறிக்கக்கூடும் என்ற தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: அழைத்துச் செல்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ஒருவரை உடன் கொண்டுவருதல் அல்லது அழைத்துச் செல்லுதல் எனப் பொருள்படும்; இலக்கு பேசுபவரிடமிருந்து விலகிய இடமாக இருப்பதால் தமிழில் ‘அழைத்துச் செல்’ இயல்பாக உள்ளது.
- source_word: חֶדֶר בְּחָדֶר
  choice: ஓர் உள் அறைக்குள்
  rationale: சொல்லுக்குச் சொல் ‘அறைக்குள் ஓர் அறை’ என்ற தொடர் தனிமையான உட்புற அறையைக் குறிக்கிறது; வாசிக்க எளிய முதன்மை உரையுடன் நேரடித் தொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
