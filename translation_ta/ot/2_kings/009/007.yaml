- from: உன் எஜமானான ஆகாபின் வம்சத்தை நீ தாக்கி அழிப்பாய். யேசபேலின் கையால்[a] சிந்தப்பட்ட என் ஊழியர்களான தீர்க்கதரிசிகளின் இரத்தத்திற்காகவும், யாவேயின் ஊழியர்கள் அனைவரின் இரத்தத்திற்காகவும் நான் பழிவாங்குவேன்.
