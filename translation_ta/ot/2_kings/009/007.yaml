base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: ta
  text: உன் எஜமானான ஆகாபின் வம்சத்தை நீ தாக்கி அழிப்பாய்; யேசபேலிடமிருந்து[a] என் ஊழியர்களான தீர்க்கதரிசிகளின் இரத்தத்திற்காகவும், யாவேயின் ஊழியர்கள் அனைவரின் இரத்தத்திற்காகவும் நான் பழிவாங்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யேசபேலின் கையிலிருந்து”; இது யேசபேலின் செயலால் அல்லது அவளுடைய பொறுப்பில் நிகழ்ந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: நீ தாக்கி அழிப்பாய்
  rationale: நכה இங்கு ஒரு அரச வம்சத்தின்மீது நிறைவேற்றப்படும் தீர்ப்பைக் குறிக்கிறது. வெறுமனே ‘அடிப்பாய்’ என்பதைக் காட்டிலும் ‘தாக்கி அழிப்பாய்’ அதன் தீர்மானமான, உயிர்க்கொல்லும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் வம்சம்
  rationale: அரச குடும்பம் மற்றும் ஆட்சிப் பரம்பரை என்ற சூழலில் בַּיִת என்பதன் பொருளை ‘வம்சம்’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲדֹנֶיךָ
  choice: உன் எஜமானான
  rationale: இது ஏகூவின் மனித மேலதிகாரியைக் குறிக்கிறது; இறைவனைக் குறிக்கும் பட்டத்துடன் குழப்பம் ஏற்படாதபடி ‘எஜமான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְנִקַּמְתִּי
  choice: நான் பழிவாங்குவேன்
  rationale: נקם இங்கு கொல்லப்பட்டவர்களின் சார்பாக இறைவன் நிறைவேற்றும் நீதியான பதில்தீர்ப்பைக் குறிக்கிறது. ‘பழிவாங்குவேன்’ அந்த வலிமையை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: דְּמֵי
  choice: இரத்தத்திற்காக
  rationale: ‘இரத்தங்கள்’ என்ற எபிரெயப் பன்மை கொலை மற்றும் அதனால் உண்டான இரத்தப்பழியைக் குறிக்கும் மரபுத்தொடர். பழிவாங்கும் சூழலில் ‘இரத்தத்திற்காக’ என்பது இயல்பான தமிழ் இணை.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: என் ஊழியர்களான தீர்க்கதரிசிகள்
  rationale: தீர்க்கதரிசிகளே இறைவனுடைய ஊழியர்கள் என்று அடையாளப்படுத்தும் சொல்லிணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: யாவேயின் ஊழியர்கள் அனைவரும்
  rationale: மூலத்தின் உடைமைத் தொடர்பையும் ‘அனைவரும்’ என்ற முழுமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமாகிய நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִיַּד אִיזָבֶל
  choice: யேசபேலின் கையால் சிந்தப்பட்ட
  rationale: ‘கையிலிருந்து’ என்ற சொல்லடிச் சொல் தமிழில் பழிவாங்குதலின் கருவியாக யேசபேலைத் தவறாகப் புரியச்செய்யலாம். ஆகவே இரத்தம் சிந்தியதற்கான அவளுடைய செயற்பாட்டையும் பொறுப்பையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது; மூல மரபுத்தொடர் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறைவன் பழிவாங்குதல்
  choice: நான் பழிவாங்குவேன்
  alternative: நான் பதில்தீர்ப்பு வழங்குவேன்
  rationale: இவ்வசனம் பழிவாங்குதலை நேரடியாக இறைவனுக்குரிய செயலாகக் கூறுகிறது. உரையின் கடுமையையும் நீதித்தீர்ப்பு சார்ந்த இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: யேசபேலின் பொறுப்பு
  choice: யேசபேலின் கையால் சிந்தப்பட்ட
  alternative: யேசபேலின் கையிலிருந்து
  rationale: மூலத்தின் מִיַּד என்ற வடிவம் செயற்பாடு அல்லது பொறுப்பைக் குறிக்கிறது. தமிழில் தவறான தொடர்பு உருவாகாதவாறு இரத்தம் சிந்தப்பட்டதற்கான அவளுடைய பொறுப்பு வெளிப்படையாகக் கூறப்படுகிறது; இதைத் தாண்டிய விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாக்கி அழிப்பாய்’, ‘வம்சம்’, ‘பழிவாங்குவேன்’ ஆகிய சொற்கள் அரச வம்சத்தின்மீதான தீர்ப்பின் வலிமையைத் தக்கவைக்கின்றன. ‘யாவே’ என்பது தனிப்பட்ட இறைநாமமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
