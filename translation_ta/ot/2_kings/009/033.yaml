base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: ta
  text: அவன், “அவளைக் கீழே தள்ளுங்கள்!” என்றான். அவர்கள் அவளைக் கீழே தள்ளினார்கள். அவளுடைய இரத்தத்தில் சில துளிகள் சுவரிலும் குதிரைகள்மேலும் தெறித்தன[a]. அவன் அவளை மிதித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய இரத்தம் சுவரிலும் குதிரைகள்மேலும் தெறித்தது.” எபிரெயில் சொல்லர்த்தமாக, “அவளுடைய இரத்தத்திலிருந்து சில துளிகள் சுவரிலும் குதிரைகள்மேலும் தெறித்தன” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: அவளைக் கீழே தள்ளுங்கள்!
  rationale: சாளரத்திலிருந்து யேசபேலைக் கீழே விழச் செய்யும் வலுவான கட்டளையை שמט இங்கு குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் நிகழ்வின் வன்மையை மறைக்காமலும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וישמטוה
  choice: அவர்கள் அவளைக் கீழே தள்ளினார்கள்
  rationale: கட்டளையில் வந்த அதே שמט வேர்ச்சொல் மீண்டும் வருவதால், அதே தமிழ் வினைச்சொல்லைப் பயன்படுத்தி கட்டளைக்கும் அதை நிறைவேற்றிய செயலுக்கும் உள்ள சொல் தொடர்பு காக்கப்பட்டது.
- source_word: ויז
  choice: தெறித்தது
  rationale: נזה என்ற வினை இங்கு இரத்தம் அருகிலுள்ள பரப்புகள்மேல் சிதறித் தெறிப்பதைக் குறிக்கிறது; ‘தெறித்தது’ இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: מדמה
  choice: அவளுடைய இரத்தத்தில் சிறிது
  rationale: מן முன்னொட்டுடன் வரும் ‘அவளுடைய இரத்தம்’ என்ற எபிரெய அமைப்பு பகுதியைக் குறிக்கும் பொருளுடையதாகப் புரிந்துகொள்ளப்படுகிறது. தமிழில் இயல்பாக அந்தப் பொருளை வெளிப்படுத்த ‘இரத்தத்தில் சிறிது’ என மொழிபெயர்க்கப்பட்டது; நேரடி அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הקיר
  choice: சுவர்
  rationale: קיר என்பதன் சாதாரணப் பொருளான ‘சுவர்’ நேரடியாகப் பயன்படுத்தப்பட்டது.
- source_word: הסוסים
  choice: குதிரைகள்
  rationale: எபிரெய பன்மை வடிவம் நேரடியாகக் காக்கப்பட்டது; சூழலில் இவை யெகூவின் தேரோடு அல்லது அணிவகுப்போடு தொடர்புடைய குதிரைகளாக இருக்கலாம்.
- source_word: וירמסנה
  choice: அவன் அவளை மிதித்தான்
  rationale: רמס என்பது ‘மிதித்தல்’ என்று பொருள் தருகிறது. வினை ஒருமையில் இருப்பதால் குதிரைகளை இலக்கண எழுவாயாக மாற்றாமல், எபிரெய வாக்கியத்தின் ஒருமை எழுவாயும் செயலின் கொடுமையும் காக்கப்பட்டன.
theological_decisions:
- issue: ‘அவன் அவளை மிதித்தான்’ என்பதில் செயலைச் செய்த விதம்
  choice: எபிரெயிலுள்ள ஒருமை எழுவாயைத் தொடர்ந்து ‘அவன்’ என்று மொழிபெயர்க்கப்பட்டது; குதிரைகள் எவ்வாறு பயன்படுத்தப்பட்டன என்பது வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘அவன் குதிரைகளால் அவளை மிதிக்கச் செய்தான்’ அல்லது ‘குதிரைகள் அவளை மிதித்தன.’
  rationale: மூல வாக்கியத்தில் வினை ஆண்பால் ஒருமையில் உள்ளது; குதிரைகள் முன்னதாகக் குறிப்பிடப்பட்டாலும் அவை இலக்கண எழுவாய் அல்ல. செயல் நேரடியாக நடந்ததா அல்லது குதிரைகள் மூலம் நடந்ததா என்ற விவரத்தை மொழிபெயர்ப்பு தீர்மானித்துச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் சாத்தியமான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கட்டளையின் வலிமையும் நிகழ்வின் கொடுமையும் மென்மைப்படுத்தப்படவில்லை. ‘தள்ளுங்கள்/தள்ளினார்கள்’ என்ற மீளுருவாக்கம் எபிரெய வேர்ச்சொல் மீளுருவாக்கத்தைப் பாதுகாக்கிறது; [a] குறி அது விளக்கும் இரத்தம் தெறித்த சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
