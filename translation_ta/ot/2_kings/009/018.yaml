base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: ta
  text: 'அப்போது குதிரைவீரன் அவனைச் சந்திக்கச் சென்று, “அரசர் சொல்வது இதுதான்: ‘சமாதானமா?’[a]” என்று கேட்டான். அதற்கு யெகூ, “சமாதானத்துக்கும் உனக்கும் என்ன தொடர்பு? திரும்பி எனக்குப் பின்னால் வா[b]” என்றான். காவலாளி, “தூதன் அவர்களிடம் போய்ச் சேர்ந்துவிட்டான்; ஆனால் அவன் திரும்பி வரவில்லை” என்று அறிவித்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாம் நலமா?” எபிரெயத்தில் இங்கும் தொடர்ந்து வரும் உரையாடலிலும் ஷாலோம் என்ற ஒரே சொல் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குப் பின்னால் அணிவகுத்து வா.” எபிரெயம் சொற்படியாக, “திரும்பி எனக்குப் பின்னால்” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: குதிரைவீரன்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘குதிரையின் மேல் சவாரி செய்பவன்’ எனப் பொருள்படும்; இராணுவத் தூதனாகச் செல்லும் சூழலில் ‘குதிரைவீரன்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க
  rationale: ஒருவரை நோக்கிச் சென்று எதிர்கொள்வதை இங்கு குறிக்கிறது; ‘சந்திக்க’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: அரசர் சொல்வது இதுதான்
  rationale: அரச தூதுச் செய்திக்கான முறையான வாய்பாட்டை, பழமையான நடையின்றி நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲשָׁלוֹם
  choice: சமாதானமா?
  rationale: שָׁלוֹם என்பதன் ‘அமைதி/நலம்’ என்ற பொருள் அகலத்தைச் சுருக்காமல், உரையாடலில் மீண்டும் வரும் முக்கியச் சொல்லை ஒரே தமிழ்ச்சொல்லால் காக்கிறது.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: சமாதானத்தைப் பற்றி உனக்கு என்ன?
  rationale: தூதனின் விசாரணையை யெகூ புறக்கணிக்கும் எபிரெய மரபுத்தொடரின் கூர்மையையும், ‘சமாதானம்’ என்ற மீளுரையையும் தக்கவைக்கிறது.
- source_word: סֹב אֶל אַחֲרָי
  choice: திரும்பி எனக்குப் பின்னால் நில்
  rationale: ‘திரும்பு’ மற்றும் ‘எனக்குப் பின்னால்’ என்ற மூலக் கூறுகளைக் காத்து, அந்த வீரன் யெகூவின் அணியோடு பின்னால் சேர்ந்துகொள்ள வேண்டுமென்ற சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַצֹּפֶה
  choice: காவலாளி
  rationale: உயரமான இடத்திலிருந்து கவனித்துக்கொண்டிருப்பவரை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הַמַּלְאָךְ
  choice: தூதன்
  rationale: வரலாற்று நிகழ்வின் சூழலில் இது மனிதத் தூதனைக் குறிக்கிறது; ‘தூதன்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בָּא ... עַד הֵם
  choice: அவர்களிடம் போய்ச் சேர்ந்துவிட்டான்
  rationale: தூதன் அவர்கள் இருந்த இடம்வரை வந்து சேர்ந்ததையும், காவலாளியின் தற்போதைய கவனிப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא שָׁב
  choice: ஆனால் அவன் திரும்பி வரவில்லை
  rationale: காவலாளி காணும் முரண்பட்ட முடிவை ‘ஆனால்’ தெளிவுபடுத்துகிறது; வினை மூலத்தின் ‘திரும்புதல்’ பொருளை நேரடியாகக் காக்கிறது.
