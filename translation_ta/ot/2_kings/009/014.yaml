base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: ta
  text: நிம்சியின் மகனான யோசபாத்தின் மகன் யெகூ, யோராமுக்கு எதிராகச் சதி செய்தான். அப்போது யோராமும் இஸ்ரவேல் அனைத்தும்[b], அராம்[c] அரசன் ஆசகேலின் காரணமாகக் கிலேயாத்திலுள்ள ராமோத்தில் காவல் காத்துவந்தனர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காவல் காத்தல்’ என்பதற்கான எபிரெய வினை, இராணுவச் சூழலில் கண்காணித்தல் அல்லது பாதுகாத்தல் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘இஸ்ரவேல் அனைத்தும்.’ இச்சூழலில் இது இஸ்ரவேல் அரசின் படைகளைக் குறிக்கலாம்.'
    reason: cultural_note
  - marker: c
    text: மரபுவழியாக ‘சீரியா’ என்று வழங்கப்படுகிறது; எபிரெயத்தில் ‘அராம்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: சதி செய்தான்
  rationale: קשר என்பதன் இத்பாயேல் வடிவம் இச்சூழலில் அரசனுக்கு எதிரான சதியையோ கிளர்ச்சித் திட்டத்தையோ குறிக்கிறது. ‘சதி செய்தான்’ என்பது பகைமையான அரசியல் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: நிம்சியின் மகனான யோசபாத்தின் மகன்
  rationale: இருமுறை வரும் בֶּן உடனடி தந்தை மற்றும் தந்தைவழிப் பாட்டன் உறவுகளைச் சுட்டுகிறது; தமிழின் இயல்பான மரபுவழி வரிசையில் இவ்வாறு வழங்கப்பட்டது.
- source_word: אֶל יוֹרָם
  choice: யோராமுக்கு எதிராக
  rationale: אֶל பொதுவாக ‘நோக்கி/இடம்’ எனப் பொருள்பட்டாலும், קשר உடன் வரும்போது சதியின் இலக்கைச் சுட்டுகிறது; ‘எதிராக’ அந்தப் பகைமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: הָיָה שֹׁמֵר
  choice: காவல் காத்துவந்தனர்
  rationale: முற்றுவினை + நிகழ்காலப் பெயரெச்ச அமைப்பு பின்னணியில் தொடர்ந்து நடந்த செயலைக் காட்டுகிறது. இராணுவச் சூழலில் שמר காவல் காத்தல் அல்லது பாதுகாத்தலைக் குறிக்கலாம்.
- source_word: בְּרָמֹת גִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்தில்
  rationale: இடப்பெயரின் இரு கூறுகளையும் பாதுகாத்து, தமிழில் இடத்தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: யோராமும் இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெய உரையின் ‘அவனும் இஸ்ரவேல் அனைத்தும்’ என்ற தேசியக் குறிப்பைப் பாதுகாக்கிறது; சூழலில் இது இஸ்ரவேலின் படைகளைச் சுட்டக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: מִפְּנֵי
  choice: காரணமாக
  rationale: ஆசகேலால் ஏற்பட்ட அச்சுறுத்தலே காவல் நடவடிக்கைக்கான காரணம் அல்லது சூழல் என்பதைத் தெளிவாகக் காட்டுகிறது; ‘பயந்து’ எனச் சொல்லி உரையில் இல்லாத உளநிலையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராம் அரசன்
  rationale: பிற்கால மரபுவழிப் பெயரான ‘சீரியா’ என்பதற்குப் பதிலாக எபிரெய மூலத்தின் இன-புவியியல் பெயரான אֲרָם நேரடியாகப் பாதுகாக்கப்படுகிறது.
