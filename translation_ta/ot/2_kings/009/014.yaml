translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. நபர் மற்றும் இடப்பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வேதாகம ஒலிபெயர்ப்பு வடிவங்களுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன. மூலத்தின் பின்னணிச் செயலை ‘காத்துவந்தனர்’ எனத் தொடர்நிலை வினையால் வெளிப்படுத்தி, ‘இஸ்ரவேலர் அனைவரும்’ என்ற திட்டமிட்ட பரந்த குறிப்பை முதன்மை உரையில் குறுக்காமல் வைத்துள்ளது.
