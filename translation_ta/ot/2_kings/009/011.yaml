translation_notes:
  register: நவீன தரமான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடலின் அவமதிப்பான தொனியும் யெகூவின் தவிர்க்கும் பதிலும் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் சொற்பொருளை விளக்கும் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
