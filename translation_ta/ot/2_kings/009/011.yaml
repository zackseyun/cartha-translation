base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: ta
  text: பின்பு யெகூ தன் எஜமானின் பணியாளர்களிடம் வெளியே வந்தான். அவர்களில் ஒருவன் அவனிடம், “எல்லாம் நலமா?[a] இந்தப் பைத்தியக்காரன்[b] ஏன் உன்னிடம் வந்தான்?” என்று கேட்டான். அதற்கு அவன் அவர்களிடம், “அந்த மனிதனையும் அவனுடைய பேச்சையும்[c] உங்களுக்குத் தெரியுமே” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “சமாதானமா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இந்தப் பித்துப்பிடித்தவன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அவமதிப்பான அடைமொழியாகும்.
    reason: lexical_alternative
  - marker: c
    text: “அவன் பேசும் விதம்” அல்லது சூழலின் தொனியை வலுப்படுத்தி “அவனுடைய உளறல்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒருவருடைய பேச்சை அல்லது உரையைப் பரந்த வகையில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: தன் எஜமானுடைய பணியாளர்கள்
  rationale: עֶבֶד இச்சூழலில் மேலதிகாரியின் கீழுள்ள பணியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; அடிமைத்தனத்தைத் தேவையின்றி உணர்த்தாமல் ‘பணியாளர்கள்’ இயல்பாக உள்ளது. אֲדֹנָיו என்பதைக் குறிப்பாக ‘ராஜா’ என்று விரிவாக்காமல் ‘தன் எஜமான்’ என வைத்துள்ளது.
- source_word: הֲשָׁלוֹם
  choice: எல்லாம் நலமா?
  rationale: எபிரெய மொழியில் சொற்பட ‘சமாதானமா?’ என்றாலும், இங்கு நிலைமை நன்றாக உள்ளதா என்று விசாரிக்கும் வழக்குச் சொல்; நவீன தமிழில் ‘எல்லாம் நலமா?’ அதன் இயல்பான பொருளைத் தருகிறது.
- source_word: מַדּוּעַ בָּא
  choice: ஏன் ... வந்தான்?
  rationale: உரையாடலுக்குள் ஏற்கெனவே நிகழ்ந்த வருகைக்கான காரணத்தை விசாரிப்பதால், தமிழில் எளிய இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: இந்தப் பைத்தியக்காரன்
  rationale: இந்தச் சொல் இழிவாகவும் அவமதிப்பாகவும் பயன்படுத்தப்பட்ட ஆண்பால் ஒருமை அடைமொழி. ‘பைத்தியக்காரன்’ அதன் கடுமையான தொனியை மென்மையாக்காமல் காக்கிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவர்களில் ஒருவன் அவனிடம் ... கேட்டான்
  rationale: பன்மையான பணியாளர்களுக்குப் பின் வரும் வினை ஒருமையில் உள்ளது. குழுவின் சார்பில் அவர்களில் ஒருவன் பேசியதாகத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டப்பட்டுள்ளது.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: அந்த மனிதனை ... உங்களுக்குத் தெரியுமே
  rationale: யெகூவின் தவிர்க்கும், அலட்சியமான பதிலைத் தக்கவைக்கிறது. ‘தெரியுமே’ என்பது அவர்கள் ஏற்கெனவே அறிந்திருப்பதாக அவன் குறிப்பதைக் காட்டுகிறது.
- source_word: שִׂיחוֹ
  choice: அவனுடைய பேச்சு
  rationale: שִׂיחַ என்பது பேச்சு, உரை, பேசும் விதம் போன்ற பரந்த பொருள்களைக் கொள்ளலாம். ‘பேச்சு’ அந்தத் தெளிவின்மையையும் சற்றே அலட்சியமான தொனியையும் காக்கிறது; அதை குறிப்பாக ‘செய்தி’ எனச் சுருக்கவில்லை.
