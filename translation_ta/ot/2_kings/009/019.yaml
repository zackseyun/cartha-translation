base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: ta
  text: 'அதனால் அவன் இரண்டாவது குதிரைவீரனை அனுப்பினான். அவன் அவர்களிடம் வந்து, “அரசர் இவ்வாறு கூறுகிறார்: ‘சமாதானமா?’[a]” என்றான். அதற்கு யெகூ, “சமாதானத்தைப் பற்றி உனக்கு என்ன? திரும்பி என் பின்னால் வா” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாம் நலமா?” எபிரெய மொழியிலுள்ள שָׁלוֹם என்ற சொல் “சமாதானம்,” “நலம்,” அல்லது “நல்வாழ்வு” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: இரண்டாவது குதிரைவீரன்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘இரண்டாவது குதிரைச் சவாரிக்காரன்’ எனப் பொருள்படும். சூழலில் அரசனால் அனுப்பப்பட்ட குதிரைத் தூதனை இயல்பாகவும் சுருக்கமாகவும் குறிக்க ‘இரண்டாவது குதிரைவீரன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: அரசர் கூறுவது இதுதான்
  rationale: அரசத் தூதுச் சூத்திரத்தின் அதிகாரபூர்வத் தொனியைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: இச்சொல் சமாதானம், நலம், எல்லாம் நன்றாக இருத்தல் ஆகிய பொருள்களை உடையது. கேள்வியிலும் யெகூவின் பதிலிலும் ஒரே சொல்லைத் திரும்பப் பயன்படுத்தும் எபிரெய மூலத்தின் தொடர்பை ‘சமாதானம்’ தக்கவைக்கிறது.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: சமாதானத்தைப் பற்றி உனக்கு என்ன?
  rationale: தூதனின் அக்கறையை நிராகரிக்கும் எதிர்கொள்ளும் தொனியையும், שָׁלוֹם என்ற சொல்லின் மறுபயன்பாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: סֹב אֶל אַחֲרָי
  choice: திரும்பி எனக்குப் பின்னால் வா
  rationale: சொற்றொடரின் ‘திரும்பு; என் பின்னால்’ என்ற இடவியல் பொருளைத் தக்கவைக்கிறது. ‘என்னைப் பின்பற்று’ என்று நோக்கத்தை மட்டும் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் பாதுகாக்கிறது.
