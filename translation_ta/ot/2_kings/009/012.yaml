  source_fidelity: மூலத்தின் உரையாடல் அமைப்பு, யாவே என்ற இறைப் பெயர், அபிஷேகத்தின் அரச நியமனப் பொருள், இஸ்ரவேலின்மேல் அரசுரிமை ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘அவர் ... கூறினார் ... என்றார் என்று சொன்னான்’ என்ற தற்போதைய அடுக்குத் தொடர் எபிரெயத்தின் மறைமுக அறிக்கையையும் நேரடி மேற்கோளையும் தமிழில் தேவையற்றவாறு மீளுரைப்பதால் திருத்தப்பட வேண்டும்.
  naturalness: ‘எங்களுக்குச் சொல்’ என்பது ‘எங்களிடம் சொல்’ என்பதைக் காட்டிலும் இயல்பானது. ‘இப்படியும் அப்படியும்’ என்ற தொடர் நவீனத் தமிழில் தெளிவாகவும் மூலத்தின் திட்டமிட்ட நிர்ணயமின்மையையும் நன்றாகவும் வெளிப்படுத்துகிறது. நேரடி மேற்கோளுக்கு முன் இரட்டைக் குறி பயன்படுத்துவதால் நடை சீராகிறது.
