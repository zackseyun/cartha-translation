base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: ta
  text: 'அவர்கள், “அது பொய்! தயவுசெய்து எங்களுக்குச் சொல்” என்றார்கள். அதற்கு அவன், “அவன் என்னிடம் இப்படியும் அப்படியும்[a] கூறினான்: ‘யாவே இவ்வாறு கூறுகிறார்: இஸ்ரவேலின்மேல் அரசனாக உன்னை அபிஷேகம் செய்திருக்கிறேன்’” என்று சொன்னான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இப்படியும் அப்படியும்”; குறிப்பிடப்படாத அல்லது சுருக்கமாகச் சொல்லப்பட்ட செய்தியைக் குறிக்கும் மரபுத்தொடர். “இன்னின்னவாறு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: அது பொய்
  rationale: இந்தப் பெயர்ச்சொல் ‘பொய்/பொய்மை’ என்று பொருள்படும். இங்கு யெகூ செய்தியை மறைக்கிறான் என்ற குற்றச்சாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגֶּד נָא לָנוּ
  choice: தயவுசெய்து எங்களிடம் சொல்
  rationale: הַגֵּד என்பது ‘சொல்/அறிவி’ என்ற ஒருமை ஏவல்; נָא வேண்டுகோள் அல்லது வற்புறுத்தலின் நயத்தைச் சேர்க்கிறது.
- source_word: כָּזֹאת וְכָזֹאת
  choice: இன்னின்னவாறு
  rationale: சொற்சொல்லான மேற்கோளை அல்லாமல், குறிப்பிடப்படாத அல்லது சுருக்கமான செய்தியை உணர்த்தும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழாக்கம்.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் முறையான நடையைப் பாதுகாக்கிறது; நிகழ்கால வடிவம் தொடர்ந்து பொருந்தும் இறை அறிவிப்பைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְשַׁחְתִּיךָ
  choice: உன்னை அபிஷேகம் செய்திருக்கிறேன்
  rationale: משׁח என்பதன் அரச நியமனத்தோடும் எண்ணெய் பூசுதலோடும் தொடர்புடைய சிறப்புப் பொருளைப் பாதுகாக்கிறது; எபிரெய நிறைவுவினையின் முடிவுற்ற செயலை நிகழ்கால நிறைவாக வெளிப்படுத்துகிறது.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக
  rationale: לְ பதவிக்கு நியமிப்பதையும், இச்சூழலில் אֶל இஸ்ரவேலை ஆளும் அதிகாரத்தையும் குறிக்கிறது; தமிழில் ‘இஸ்ரவேலின்மேல் அரசனாக’ என்பது தெளிவாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ அதைப் பட்டப்பெயரால் மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: משׁח என்ற அரச நியமனச் சொல்லின் மொழியாக்கம்
  choice: அபிஷேகம் செய்திருக்கிறேன்
  alternative: அரசனாக நியமித்திருக்கிறேன்; எண்ணெய் பூசியிருக்கிறேன்
  rationale: ‘நியமித்தல்’ எண்ணெய் பூசும் உருவகத்தைக் களைந்துவிடும்; ‘எண்ணெய் பூசுதல்’ மட்டும் அதன் அரச மற்றும் இறையியல் நியமனப் பொருளை முழுமையாகக் காட்டாது. பரவலாகப் புரிந்துகொள்ளப்படும் ‘அபிஷேகம்’ இரண்டையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலின் திடீர் தன்மையையும் தீர்க்கதரிசன அறிவிப்பின் கண்ணியமான நடையையும் இணைக்கிறது. ஒருமை ஏவலை ‘சொல்’ எனவும், இறைப் பெயரை ‘யாவே’ எனவும் வைத்துள்ளது. [a] குறியீடு அது விளக்கும் ‘இன்னின்னவாறு’ என்ற தொடருக்குப் பின்பே இடப்பட்டுள்ளது.
