  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: ta
  text: 'நீ களைத்தவனுக்குக் குடிக்கத் தண்ணீர் கொடுக்கவில்லை;

    பசித்தவனுக்கு அப்பம்[a] கொடுக்க மறுத்தாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அப்பம்’ என்பது விரிவாக ‘உணவு’ என்பதையும் குறிக்கலாம்; ஆயினும் மூலத்தில் உள்ள குறிப்பான சொல் முதன்மைப் பாடத்தில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: கொடுக்கவில்லை
  rationale: எபிரெய மறுப்பை முதல் குற்றச்சாட்டில் இயல்பான தமிழ் வினைமுற்றாக வெளிப்படுத்துகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: பொதுவழக்கிலும் மதிப்பான நடையிலும் இயல்பாகப் புரியும் நேரடிப் பொருள்.
- source_word: עָיֵף
  choice: களைத்தவன்
  rationale: பெயர்ச்சொல் போலப் பயன்படும் எபிரெய பெயரடையின் பொதுப்படையான ஒருமையைப் பாதுகாக்கிறது; ‘சோர்ந்தவன்’ என்பதைக் காட்டிலும் உடல் இளைப்பைத் தெளிவாக உணர்த்துகிறது.
- source_word: תַּשְׁקֶה
  choice: குடிக்கத் ... கொடுக்கவில்லை
  rationale: ஹிப்இல் வடிவத்தின் ‘குடிக்கக் கொடு’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּמֵרָעֵב
  choice: பசித்தவனிடமிருந்து
  rationale: מִן என்னும் முன்னிடைச்சொல்லின் ‘இடமிருந்து’ என்ற உறவைத் தக்கவைத்தும், பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை பெயரடையைப் பொதுப்படையாகவும் காட்டுகிறது.
- source_word: תִּמְנַע
  choice: விலக்கிவைத்தாய்
  rationale: தேவையான ஒன்றைக் கிடைக்கவிடாமல் தடுத்தல் அல்லது மறுத்தல் என்ற מנע வினையின் குற்றஞ்சாட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: לָחֶם
  choice: அப்பம்
  rationale: மூலத்தின் தெளிவான, கண்முன் நிற்கும் ‘அப்பம்’ என்ற சொல்லை வைத்திருக்கிறது; சூழலில் அது உணவை விரிவாகவும் குறிக்கக்கூடும்.
