  rationale: דכא என்பதன் ‘நொறுக்கு/ஒடுக்கு’ என்ற செயப்பாட்டு பொருளைத் தருகிறது; எபிரெயத்தில் வினை ஒருமையாக இருந்தாலும், ‘கரங்கள்’ என்பதுடன் தமிழில் பன்மை இயைபு இயல்பானது.
