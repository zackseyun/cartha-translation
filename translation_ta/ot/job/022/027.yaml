source:
  edition: WLC
  text: תַּעְתִּ֣יר אֵ֭לָי/ו וְ/יִשְׁמָעֶ֑/ךָּ וּ/נְדָרֶ֥י/ךָ תְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: ta
  text: நீ அவரிடம் மன்றாடுவாய்; அவர் உனக்குச் செவிகொடுப்பார்; நீ உன் நேர்த்திக்கடன்களை நிறைவேற்றுவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘உன் நேர்த்திக்கடன்களைச் செலுத்துவாய்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: மன்றாடுவாய்
  rationale: עתר என்பதன் ஹிஃபில் வடிவம் ஆழ்ந்த வேண்டுதல் அல்லது மன்றாட்டைக் குறிக்கிறது. இங்கு கடவுளை நோக்கி வேண்டுவதும் அவர் கேட்பதும் இணைந்துள்ளதால், ‘மன்றாடுவாய்’ என்பது வேண்டுதலின் தீவிரத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவரிடம்’ அல்லது ‘அவரை நோக்கி’ என்று பொருள்படும். முந்தைய சூழலில் சுட்டப்படுபவர் கடவுள் என்பதால், பெயரைத் தேவையின்றி மீண்டும் சேர்க்காமல் மூலத்தின் பிரதிப்பெயரைப் பேணுகிறது.
- source_word: וְיִשְׁמָעֶךָּ
  choice: அவர் உனக்குச் செவிகொடுப்பார்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’ அல்லது ‘செவிகொடு’. ‘பதில் அளிப்பார்’ என்று மிகையாக விளக்காமல், வேண்டுதலைக் கவனித்துக் கேட்பதைக் காட்ட ‘செவிகொடுப்பார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּנְדָרֶיךָ
  choice: உன் நேர்த்திக்கடன்களை
  rationale: נֶדֶר என்பது கடவுளிடம் செய்யப்படும் நேர்த்தி அல்லது உறுதிமொழியைக் குறிக்கிறது. தமிழில் சமயச் சூழலில் இயல்பாகப் புரியும் ‘நேர்த்திக்கடன்’ என்ற சொல் அந்தப் பொறுப்புணர்வைப் பேணுகிறது; குறிப்பிட்ட பலிவகையை இது தேவையின்றி சேர்ப்பதில்லை.
- source_word: תְשַׁלֵּם
  choice: நிறைவேற்றுவாய்
  rationale: שלם என்பதன் பியேல் வடிவம் நேர்த்திக்கடனுடன் வரும்போது அதைச் செலுத்துதல், அதாவது வாக்களித்ததை நிறைவேற்றுதல் என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டது. ‘நிறைவேற்றுவாய்’ என்பது நவீன தமிழில் பொருளைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: இறுதி சொற்றொடரைச் சொற்படியாக ‘நேர்த்திக்கடன்களைச் செலுத்துவாய்’ என மொழிபெயர்ப்பதா அல்லது மரபுத்தொடர்ப் பொருளில் ‘நிறைவேற்றுவாய்’ என மொழிபெயர்ப்பதா
  choice: நேர்த்திக்கடன்களை நிறைவேற்றுவாய்
  alternative: நேர்த்திக்கடன்களைச் செலுத்துவாய்
  rationale: எபிரெய மரபுத்தொடர் கடவுளிடம் நேர்ந்துகொண்டதைச் செய்து முடிப்பதைக் குறிக்கிறது. ‘நிறைவேற்றுவாய்’ என்பது நவீன வாசகருக்கு அதைப் பணம் செலுத்துதல் என்று குறுகலாகப் புரியவிடாமல் பொருளைத் தெளிவாக்குகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழிலும் மரியாதைமிக்க வேதாகமப் பாணியிலும் உள்ளது. கடவுளைக் குறிக்கும் மூன்றாம் நபர் பிரதிப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செய்யுளின் மூன்று இணை வாக்கியங்களும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
