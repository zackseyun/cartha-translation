  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: ta
  text: ஆயினும், அவர் அவர்களுடைய வீடுகளை நல்லவற்றால் நிரப்பினார்; பொல்லாதவர்களின் ஆலோசனை என்னைவிட்டு வெகு தொலைவில் உள்ளது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּא
  choice: ஆனாலும், அவர்
  rationale: சுற்றியுள்ள வசனங்களில் பொல்லாதவர்கள் கடவுளை நிராகரித்ததற்கு மாறாக, அவரே அவர்களுக்கு நன்மை செய்தார் என்ற முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது; வெளிப்படையான எழுவாயும் தக்கவைக்கப்படுகிறது.
- source_word: מִלֵּא
  choice: நிரப்பினார்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘நிரப்புதல்’ என்பதையும், கவிதைச் சூழலிலுள்ள இறந்தகால நோக்கையும் காக்கிறது.
- source_word: בָתֵּיהֶם
  choice: அவர்களுடைய வீடுகளை
  rationale: ‘அவர்களுடைய வீடுகள்’ என்ற உறுதியான எபிரெய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; குடும்பங்கள் அல்லது செழிப்பு என்று விரித்துரைக்கவில்லை.
- source_word: טוֹב
  choice: நன்மைகளால்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ‘நன்மை/நல்லது’ என்பதை இயல்பான தமிழில் பன்மைப் பொருளுடன் தருகிறது; ‘செழிப்பு’ என்பது சூழலுக்குப் பொருந்தினாலும் அதிக விளக்கமான மொழிபெயர்ப்பு.
- source_word: וַעֲצַת
  choice: ஆனால் ... ஆலோசனை
  rationale: இரண்டாம் அடியில் பேச்சாளர் பொல்லாதவர்களின் கருத்திலிருந்து தன்னை விலக்கிக்கொள்வதால் இணைப்புச் சொல் முரண்பாட்டைக் காட்டுகிறது; עֵצָה என்பதன் ஆலோசனை/திட்டம் என்ற பரப்பையும் ‘ஆலோசனை’ நன்றாகக் காக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்களின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட எபிரெயப் பன்மை அடைமொழியை, நவீனத் தமிழில் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் வழங்குகிறது.
- source_word: רָחֲקָה מֶנִּי
  choice: எனக்கு வெகுதொலைவில் இருக்கிறது
  rationale: எபிரெய qatal வடிவை வேண்டுதல் அல்லது கட்டளையாக மாற்றாமல், தற்போதைய நிலையைச் சுட்டும் விலகல் அறிவிப்பாகத் தருகிறது.
theological_decisions:
- issue: இறுதி அடியில் பேச்சாளரின் நிலைப்பாடு
  choice: ‘பொல்லாதவர்களின் ஆலோசனை எனக்கு வெகுதொலைவில் இருக்கிறது’ என்ற அறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பொல்லாதவர்களின் ஆலோசனை என்னைவிட்டு வெகுதொலைவில் இருப்பதாக’ என்ற விருப்பம் அல்லது வேண்டுதல்.
  rationale: எபிரெயத்தில் கட்டளை அல்லது விருப்பநிலை வடிவமல்ல, qatal வடிவமே உள்ளது. ஆகவே பக்திநடை வேண்டுதலைச் சேர்க்காமல், பொல்லாதவர்களின் ஆலோசனையிலிருந்து பேச்சாளர் தன்னைப் பிரித்துக் கூறும் நேரடியான அர்த்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடுகள்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘செழிப்பு’ பிரதான உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது. இரு அடிகளின் முரண்பாட்டை ‘ஆனாலும் ... ஆனால்’ தெளிவுபடுத்துகிறது.
