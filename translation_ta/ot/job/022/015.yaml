  yaml_path: translation/ot/job/022/015.yaml
  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: ta
  text: தீய மனிதர்கள் நடந்த பழங்காலப் பாதையை நீ பின்பற்றுவாயா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பண்டைய பாதை’ அல்லது ‘நெடுங்காலப் பாதை.’ எபிரெயச் சொற்றொடர் நீண்ட காலத்துக்கு முன்பிருந்த ஒரு பாதையைக் குறிக்கிறது; அது கட்டாயமாக நித்தியமான ஒன்றைக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீமை செய்கிற மனிதர்கள்’ அல்லது ‘அக்கிரமக்காரர்கள்.’ எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘தீமையின் மனிதர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרַח
  choice: பாதையை
  rationale: אֹרַח என்பது நேரடியான பாதையையும் உருவகமாக வாழ்க்கை நெறியையும் குறிக்கலாம். ‘பாதை’ என்ற சொல் இந்த உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: עוֹלָם
  choice: பழங்காலப்
  rationale: இங்கு עוֹלָם என்பது இறையியல் பொருளில் ‘நித்தியமான’ என்பதைக் காட்டிலும், நீண்ட காலத்துக்கு முந்திய ஒன்றைக் குறிக்கிறது. ‘பழங்காலப்’ என்பது அந்தக் காலப் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: תִּשְׁמֹר
  choice: பின்பற்றுவாயா
  rationale: שׁמר என்பதன் அடிப்படைப் பொருள் ‘காத்தல்/கடைப்பிடித்தல்.’ ‘பாதை’ என்பதோடு வரும்போது ஒரு வாழ்க்கை நெறியைத் தொடர்ந்து செல்லுதல் என்ற கருத்தை ‘பின்பற்றுவாயா’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר
  choice: —
  rationale: பாதையை விவரிக்கும் தொடர்புவாக்கியம் தமிழில் தனியான தொடர்புப்பெயர் இல்லாமல், ‘மிதித்து நடந்த ... பாதை’ என்ற பெயரெச்ச அமைப்பால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: דָּרְכוּ
  choice: மிதித்து நடந்த
  rationale: דרך என்ற வினை ‘மிதித்தல்/நடத்தல்’ என்ற பாதை சார்ந்த உருவகத்தைக் கொண்டது. ‘மிதித்து நடந்த’ என்பது அதைக் காத்து, பலர் முன்பு சென்ற வழி என்ற கருத்தையும் தருகிறது.
- source_word: מְתֵי אָוֶן
  choice: தீய மனிதர்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘தீமையின் மனிதர்கள்.’ சூழலில் ஒழுக்கத் தீமையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவமாக ‘தீய மனிதர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: עוֹלָם என்பதன் காலப் பொருள்
  choice: பழங்காலப்
  alternative: நித்தியமான
  rationale: இவ்விடத்தில் முன்னர் வாழ்ந்த தீய மனிதர்கள் சென்ற பாதையே குறிக்கப்படுகிறது; பாதை இறையியல் பொருளில் நித்தியமானது என்று உரை கூறவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பாதை’ மற்றும் ‘மிதித்து நடந்த’ என்பவை மூலத்தின் தொடர்ச்சியான பாதை உருவகத்தைத் தக்கவைக்கின்றன; கேள்வி வடிவமும் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
