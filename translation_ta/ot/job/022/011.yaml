  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: ta
  text: அல்லது, நீ பார்க்க முடியாத அளவுக்கு இருள்; நீரின் பெருக்கு உன்னை மூடுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: அல்லது
  rationale: அடுத்த துன்பநிலையைச் சுருக்கமாக அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: நேரடியான பொருளையும், பார்க்க இயலாத நிலையை உருவாக்கும் கவித்துவப் படிமத்தையும் காக்கிறது.
- source_word: לֹא תִרְאֶה
  choice: நீ பார்க்க முடியாதபடி
  rationale: எபிரெய மொழியில் நேரடியாக ‘நீ பார்க்கவில்லை’ என்றாலும், முந்தைய பெயர்ச்சொல் வாக்கியத்தோடு இயல்பாக இணையும் விளைவு சார்ந்த பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְשִׁפְעַת מַיִם
  choice: பெருந்திரளான வெள்ளம்
  rationale: שִׁפְעָה என்பதன் ‘மிகுதி/பெருக்கு’ என்ற பொருளையும், மַיִם உடன் வரும் பெருகிய நீரின் படிமத்தையும் இயல்பான தமிழில் தருகிறது; ‘வெள்ளப்பெருக்கு’ என்ற குறிப்பான மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּכַסֶּךָּ
  choice: உன்னை மூடுகிறது
  rationale: כסה வினையின் அடிப்படையான ‘மூடு’ என்ற படிமத்தை, ‘மூழ்கடிக்கிறது’ என விளக்கமாக விரிவுபடுத்தாமல் காக்கிறது.
