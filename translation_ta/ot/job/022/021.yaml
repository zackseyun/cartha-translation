id: JOB.22.21
reference: Job 22:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַסְכֶּן נָ֣א עִמּ֑/וֹ וּ/שְׁלם בָּ֝/הֶ֗ם תְּֽבוֹאַתְ/ךָ֥ טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: ta
  text: அவரோடு இணங்கி, தயவுசெய்து, சமாதானமாயிரு; அதனால் உனக்கு நன்மை வரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסְכֶּן
  choice: இணக்கமாகி
  rationale: இந்த அரிதான வினை வடிவம் இங்கு ‘அவரோடு பழகி/இணங்கி/உடன்பட்டு’ என்ற பொருள் வட்டத்தைக் கொண்டுள்ளது. சூழலில் எலிப்பாஸ் யோபுவை தேவனோடு ஒத்துப்போக அழைப்பதால், நவீனத் தமிழில் இயல்பான ‘இணக்கமாகி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נָא
  choice: —
  rationale: வேண்டுகோள் அல்லது வலியுறுத்தலை மென்மையாக்கும் துகள். தமிழில் தனியே ‘தயவுசெய்து’ என்று சேர்ப்பது இச்சூழலில் செயற்கையாக ஒலிப்பதால், அறிவுறுத்தலின் மென்மையான கட்டளைநடையில் அதன் செயல்பாடு வெளிப்படுத்தப்பட்டது.
- source_word: וּשְׁלם
  choice: சமாதானமாயிரு
  rationale: צ־ל־ם சார்ந்த இவ்வடிவம் ‘சமாதானமாக/முழுமையாக இரு’ என்ற கருத்தைக் குறிக்கிறது; அழைப்பின் இணை அமைப்பில் ‘சமாதானமாயிரு’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בָּהֶם
  choice: இதனால்
  rationale: எபிரெயத்தில் பன்மைச் சுட்டுப்பெயர் இருந்தாலும் அதன் முன்னிலைத் தொடர்பு தெளிவற்றது; முந்தைய அறிவுறுத்தல்களை மொத்தமாகக் குறிக்கும் கருவி/விளைவு பொருளை ‘இதனால்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: உனக்கு நன்மை வரும்
  rationale: சொல்லடக்கமாக ‘நன்மை உன்னிடம் வரும்’; தமிழில் இயல்பான சொல்வரிசையில் அதே கருத்து தரப்பட்டது.
theological_decisions:
- issue: ‘அவரோடு’ என்பதில் குறிக்கப்படுபவர்
  choice: பெயரைச் சேர்க்காமல் ‘அவரோடு’ என வைத்தல்
  alternative: ‘தேவனோடு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் தேவனைக் குறித்தாலும், மூலவசனம் சுட்டுப்பெயரையே பயன்படுத்துகிறது. உரையின் மறைமுகத் தன்மையைப் பாதுகாக்க பெயர் சேர்க்கப்படவில்லை.
- issue: நன்மை வருவதின் காரணவியல்
  choice: ‘இதனால் உனக்கு நன்மை வரும்’
  alternative: ‘அவற்றால் உனக்கு நன்மை வரும்’ அல்லது நிபந்தனை வாக்கியமாக மாற்றுதல்
  rationale: எலிப்பாஸின் கூற்றிலுள்ள நேரடியான காரண-விளைவு வலியுறுத்தலை மதிப்பீடு செய்யாமல் பாதுகாக்கிறது; உரையாளர் கூறுவதை மொழிபெயர்ப்பு இறையியல் உறுதிப்பாடாக அதிகப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான ஞான இலக்கிய அறிவுரைநடை. ‘இணக்கமாகி’ என்பது பொதுவாசகருக்கு புரியக்கூடியதுடன், மூலத்தின் ‘பழகுதல்/ஒத்துப்போதல்/உடன்படுதல்’ என்ற பொருள் அகலத்தையும் அதிகமாகச் சுருக்காமல் காக்கிறது.
