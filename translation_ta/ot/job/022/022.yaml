  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: ta
  text: தயவுசெய்து, அவருடைய வாயிலிருந்து அறிவுரையைப் பெற்றுக்கொள்[a]; அவருடைய வார்த்தைகளை உன் இதயத்தில் பதித்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது “நியமத்தை” அல்லது “போதனையை” (எபிரெயம்: தோரா).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: பெற்றுக்கொள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; ஆனால் அறிவுரையை வாயிலிருந்து ஏற்றுக்கொள்ளும் இச்சூழலில் ‘பெற்றுக்கொள்’ என்பது மூல உருவகத்துக்கு நெருக்கமாகவும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: இங்கு இச்சொல் காலத்தைக் குறிக்கும் ‘இப்போது’ என்பதைவிட வேண்டுகோள் கலந்த வலியுறுத்தலைக் காட்டுகிறது; ‘தயவுசெய்து’ அந்தத் தொனியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִפִּיו
  choice: அவருடைய வாயிலிருந்து
  rationale: எபிரெய மூலத்தில் உள்ள ‘அவருடைய வாயிலிருந்து’ என்ற நேரடியான, உயிரோட்டமுள்ள சொல்லாட்சி சுருக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: תּוֹרָה
  choice: அறிவுரை
  rationale: யோபின் ஞான இலக்கியச் சூழலில் תּוֹרָה என்பது குறிப்பாக மோசேயின் சட்டத்தைக் குறிக்க வேண்டியதில்லை; அதிகாரமுள்ள அறிவுரை அல்லது போதனை என்ற பொருள் இங்கு பொருத்தமானது.
- source_word: וְשִׂים
  choice: பதித்துக்கொள்
  rationale: ‘வை’ என்பதே நேரடிப் பொருள்; இதயத்தில் வைப்பது என்ற எபிரெய வழக்கு, சொற்களை உள்ளத்தில் நிலைநிறுத்துவதைக் குறிக்கிறது. ‘பதித்துக்கொள்’ அதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲמָרָיו
  choice: அவருடைய வார்த்தைகளை
  rationale: אמר என்பதிலிருந்து வந்த பன்மைப் பெயர்ச்சொல்லின் நேரடியான, இயல்பான மொழிபெயர்ப்பு இது.
- source_word: בִּלְבָבֶךָ
  choice: உன் இதயத்தில்
  rationale: சிந்தனை, மனவிருப்பம் ஆகியவற்றின் உள்மையத்தைக் குறிக்கும் ‘இதயம்’ என்ற எபிரெய உருவகம் தமிழிலும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஞான உரையில் תּוֹרָה என்பதன் பொருள்
  choice: அறிவுரை
  alternative: நியமம் அல்லது போதனை
  rationale: இங்கு குறிப்பாக மோசேயின் உடன்படிக்கைச் சட்டமே குறிக்கப்படுகிறது என்று உரை கூறவில்லை. ‘அறிவுரை’ என்பது எலிப்பாஸ் ஏற்றுக்கொள்ளுமாறு அழைக்கும் அதிகாரமுள்ள போதனையை வெளிப்படுத்தி, ஞான இலக்கியச் சூழலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் நேரடியான அறிவுறுத்தல் தொனியும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாயிலிருந்து’ மற்றும் ‘இதயத்தில்’ என்ற மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ஆண்பால் ஒருமை முன்னிலைப் பெயரின் குறிப்பு விளக்கப்படாமல் ‘அவருடைய’ என விடப்பட்டுள்ளது.
