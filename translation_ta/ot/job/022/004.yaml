  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: ta
  text: நீ அவருக்கு அஞ்சுவதாலா அவர் உன்னைக் கண்டிக்கவும் உன்னோடு வழக்காட வரவும் செய்கிறார்?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் பயத்தினாலா’; எபிரெயத்தில் சொற்பட, ‘உன் பயத்திலிருந்து/உன் பயத்தின் காரணமாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன்னைக் கடிந்துகொள்கிறார்’ அல்லது ‘உன்னைத் திருத்துகிறார்.’
    reason: lexical_alternative
  - marker: c
    text: சொற்பட, ‘உன்னோடு நியாயத்தீர்ப்புக்குள் வருகிறார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: நீ அவருக்குப் பயப்படுவதாலா
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; יִרְאָה என்பது ‘பயம்’ அல்லது ‘பயபக்தி’ எனப் பொருள்படலாம். சூழலில் மறைமுகமாகக் குறிக்கப்படும் பொருள் கடவுள் என்பதால் ‘அவருக்கு’ என்று வெளிப்படுத்தப்பட்டுள்ளது. வினா எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: יֹכִיחֶךָ
  choice: அவர் உன்னைக் கண்டித்து
  rationale: יכח என்பதன் ஹிஃபீல் வடிவம் கண்டித்தல், கடிந்துகொள்ளுதல், திருத்துதல் அல்லது வழக்காடுதல் என்ற நுணுக்கங்களைக் கொண்டது. அடுத்த நீதித்துறைச் சொற்றொடருடன் இணையும் போது ‘கண்டித்து’ என்பது ஒழுக்க மற்றும் வழக்கியல் வலிமைகளை அளவுக்கு மீறித் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: உன்னோடு நியாயவிசாரணைக்கு வருகிறார்
  rationale: எபிரெய மொழிவழக்கு சொற்பட ‘உன்னோடு நியாயத்தீர்ப்புக்குள் வருதல்’ என அமைகிறது. ‘நியாயவிசாரணைக்கு வருகிறார்’ என்பது நீதிமன்றச் சூழலையும் எதிர்தரப்பாக நிற்கும் நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִּשְׁפָּט
  choice: நியாயவிசாரணை
  rationale: இங்கு இச்சொல் பொதுவான நீதியைவிட நீதித்துறை நடவடிக்கை அல்லது வழக்கு விசாரணையைக் குறிக்கிறது. ‘நியாயவிசாரணை’ அந்தச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உன் பயம்’ என்பதில் மறைமுகமாக உள்ள பயத்தின் பொருள்
  choice: பயம் கடவுளை நோக்கியது எனக் கொண்டு ‘நீ அவருக்குப் பயப்படுவதால்’ என்று வெளிப்படுத்தப்பட்டது.
  alternative: பொருளை வெளிப்படுத்தாமல் ‘உன் பயத்தினாலா’ என்று மொழிபெயர்த்தல்.
  rationale: எலிப்பாஸ் கடவுள் யோபை நடத்தும் விதத்தைப் பற்றிப் பேசும் சூழல், பயத்தின் பொருள் கடவுள் என்பதைக் காட்டுகிறது. தமிழில் இயல்பும் தெளிவும் பெற ‘அவருக்கு’ சேர்க்கப்படுகிறது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல, எபிரெய மொழியின் மறைமுகத்தை வெளிப்படுத்துவதாகும்.
- issue: எலிப்பாஸின் கேள்வியின் வலிமை
  choice: ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியாகக் காக்கப்பட்டது.
  alternative: எந்தப் பதிலையும் எதிர்பார்க்காத நடுநிலைக் கேள்வியாக மொழிபெயர்த்தல்.
  rationale: கேள்வி உருபும் சூழலும், யோபின் இறையச்சத்தினால் கடவுள் அவரை விசாரிக்கவில்லை என்று எலிப்பாஸ் மறைமுகமாக வலியுறுத்துவதைக் காட்டுகின்றன. கூடுதல் விளக்கமின்றியே கேள்வி வடிவம் அந்த இறுக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பயப்படுதல்’ சாதாரண வாசகருக்கு உடனடியாகப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டது; ‘பயபக்தி’ என்பது சாத்தியமான நுணுக்கமாக இருந்தாலும் முதன்மை உரையில் விளக்கத் தீர்மானத்தை அதிகப்படுத்தும். ‘நியாயவிசாரணை’ நீதித்துறைச் சூழலை இயல்பாகக் காட்டுகிறது.
