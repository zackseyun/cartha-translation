  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: ta
  text: '“எங்களைவிட்டு விலகிப்போ” என்று இறைவனிடம் சொல்லி,

    “சர்வவல்லவர் அவர்களுக்கு என்ன செய்ய முடியும்?”[a] என்று கேட்டவர்களே இவர்களே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “அவர்களுக்கு.” மேற்கோளின் சூழலைக் கருத்தில் கொண்டு சில மொழிபெயர்ப்புகள் “எங்களுக்கு” என்று தருகின்றன.
    reason: மேற்கோளில் முதலாம் நபரிலிருந்து மூன்றாம் நபருக்கு ஏற்படும் எதிர்பாராத மாற்றத்தை வாசகருக்குத் தெரிவித்து, மசோரா உரையையும் சூழல்சார் மாற்றுவாசிப்பையும் வேறுபடுத்துகிறது.
lexical_decisions:
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு பொதுப்பெயராக வரும் ‘God’ என்பதைக் குறிக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: סוּר מִמֶּנּוּ
  choice: எங்களைவிட்டு அகன்றுபோ
  rationale: סוּר என்ற கட்டளையின் வலிமையையும் מִמֶּנּוּ என்பதிலுள்ள முதலாம் நபர் பன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் இறைவனுக்கான שַׁדַּי என்ற சிறப்புப்பெயரின் வழக்கமான பொருளையும் மதிப்புமிக்க நடையையும் வெளிப்படுத்துகிறது.
- source_word: יִפְעַל
  choice: என்ன செய்துவிட முடியும்
  rationale: இச்சூழலில் கேலியோடு எழுப்பப்படும் திறனைச் சவாலிடும் கேள்வியை இயல்பான தமிழில் தருகிறது; எபிரெய வினையின் பரந்த ‘செய்/நிறைவேற்று’ பொருளையும் காக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: மசோரா உரையின் மூன்றாம் நபர் பன்மை வடிவைத் திருத்தாமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: மேற்கோளுக்குள் לָמוֹ என்ற மூன்றாம் நபர் பன்மை வருவது
  choice: “அவர்களுக்கு” என மூல வடிவைத் தக்கவைத்தல்
  alternative: சூழலுக்கேற்ப “எங்களுக்கு” என மாற்றுதல்
  rationale: மசோரா உரை தெளிவாக மூன்றாம் நபர் வடிவைக் கொண்டுள்ளது. பேச்சாளர்கள் தங்களை மூன்றாம் நபரில் சுட்டியிருக்கலாம்; அல்லது உரையில் நபர்மாற்றம் இருக்கலாம். இதை அமைதியாகச் சரிசெய்யாமல் உண்மையான பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் வாய்மொழி இயல்பும் உள்ள நடை. முந்தைய வசனத்தோடு இலக்கணத் தொடர்புடைய பன்மைச் சுட்டைத் தமிழில் தெளிவாக்க “இவர்களே” சேர்க்கப்பட்டுள்ளது; கவிதை அமைப்பை உணர்த்த இரண்டு இணை மேற்கோள் வரிகள் பயன்படுத்தப்பட்டுள்ளன.
