  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: ta
  text: அப்போது சர்வவல்லவர் உன் பொன்னாகவும்[a], உனக்குச் சிறந்த வெள்ளியாகவும் இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது சர்வவல்லவர் உன் பொக்கிஷமாகவும், உனக்கு மிகுதியான வெள்ளியாகவும் இருப்பார்.” ‘பொன்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லும், ‘வெள்ளி’யை விவரிக்கும் சொல்லும் பொருள் காண்பதற்குக் கடினமானவை. சர்வவல்லவரே பொக்கிஷம் என்ற பொருளுக்கு மாற்றாக, அவர் செல்வத்தை வழங்குவார் என்பதையும் இவை வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: அப்போது ... இருப்பார்
  rationale: முந்தைய அறிவுறுத்தலின் விளைவாக வருவதைக் காட்டும் வகையில் waw + qatal அமைப்பு இங்கு எதிர்கால நிபந்தனை விளைவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் வரும் இறைப்பட்டத்துக்கான இயல்பான, மரியாதைக்குரிய நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: בְּצָרֶיךָ
  choice: உன் பொன்
  rationale: அரிய இச்சொல் தாது, செல்வம் அல்லது பாதுகாப்பு என்ற தொடர்புடைய பொருள்களைக் கொள்ளலாம்; ‘வெள்ளி’ என்ற இணைவரியால் இங்கு ‘பொன்’ என்பது மிகவும் இயல்பானது.
- source_word: וְכֶסֶף
  choice: வெள்ளியாகவும்
  rationale: முதல் கவிதை வரியின் ‘இருப்பார்’ என்னும் பயனிலையை இரண்டாம் வரியிலும் தொடரச்செய்து, மூலத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: תּוֹעָפוֹת
  choice: சிறந்த
  rationale: இச்சொல் அரிதானதும் பொருள் தெளிவில்லாததும் ஆகும்; உயர்தரம் அல்லது மிகுதியைக் குறிக்கலாம். ‘சிறந்த’ என்பது தரத்தை வெளிப்படுத்தியபடியே ஊகத்தை அளவோடு வைத்திருக்கிறது.
- source_word: לָךְ
  choice: உனக்கு
  rationale: தனிப்பட்ட பயன் அல்லது உடைமை சார்ந்த தத்துப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எலிப்பாசின் வாக்குறுதியில் சர்வவல்லவருக்கும் செல்வத்துக்கும் உள்ள உறவு
  choice: சர்வவல்லவரே யோபுவின் உண்மையான செல்வமாக இருப்பார் என்ற உருவகத்தை முதன்மை உரை வெளிப்படுத்துகிறது.
  alternative: சர்வவல்லவர் யோபுவுக்குப் பொன்னையும் மிகுதியான வெள்ளியையும் வழங்குவார் என்றும் எபிரெய உரையைப் புரிந்துகொள்ளலாம்.
  rationale: மூலத்தின் கவிதை இணை அமைப்பு கடவுளையே செல்வமாக அடையாளப்படுத்தலாம்; அதேவேளை, கடவுள் பொருட்செல்வம் வழங்குவார் என்ற பொருளுக்கும் இடமுண்டு. முதன்மை உரை வலுவான உருவகத்தை வைத்துக்கொண்டு, மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சர்வவல்லவர்’ என்ற வழக்கமான இறைப்பட்டமும் ‘பொன்—வெள்ளி’ என்ற மூல இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
