theological_decisions:
- issue: ‘கட்டப்படுவாய்’ என்ற மறுநிலைநிறுத்த உருவகத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: மீண்டும் நிலைநிறுத்தப்படுவாய்
  alternative: கட்டியெழுப்பப்படுவாய் / மீண்டும் கட்டப்படுவாய்
  rationale: சூழலில் உருவகம் மறுநிலைநிறுத்தத்தைக் குறிக்கிறது. முதன்மை உரை அதன் பொருளை நவீனத் தமிழில் தெளிவாக்குகிறது; சொற்படியான உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: שוב என்பதை ‘திரும்பு’ என்றா ‘மனந்திரும்பு’ என்றா மொழிபெயர்ப்பது
  choice: திரும்பு
  alternative: மனந்திரும்பு / திரும்பிவா
  rationale: மூல வினையின் அடிப்படை இயக்கப் பொருளையும் தேவனை நோக்கிய திசையையும் காக்கிறது; சூழலில் உள்ள மனமாற்றக் கருத்தைத் தனியே உரைக்குள் சேர்த்து இறையியல் பொருளைச் சுருக்குவதில்லை.
- issue: தொடரின் இறுதி வினையை நிபந்தனையின் மற்றொரு பகுதியாகவா அல்லது விளைவாகவா எடுத்துக்கொள்வது
  choice: அகற்றுவாய்
  alternative: அகற்றினால்
  rationale: மசோரா உரையில் இரண்டாம் אִם இல்லை; மேலும் תִּבָּנֶה என்பதற்குப் பின் முக்கிய இடைநிறுத்தம் உள்ளது. ஆகவே இறுதி வினையை எதிர்கால விளைவாக/தொடர்ச்சியாக வைத்திருக்கிறது; கூடுதல் ‘என்றால்’ என்பதைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்’ என்ற மூலப் பண்பாட்டு உருவகம் தக்கவைக்கப்பட்டுள்ளது. முதன்மை நிபந்தனைத் தொடர் தெளிவாக அமைக்கப்பட்டு, எபிரெயத்தில் இல்லாத இரண்டாம் நிபந்தனைச் சொல் சேர்க்கப்படவில்லை.
