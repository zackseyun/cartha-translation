  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: ta
  text: நீ சர்வவல்லவரிடம் திரும்பினால், கட்டியெழுப்பப்படுவாய்[a]; உன் கூடாரத்திலிருந்து அநீதியை[b] வெகுதூரம் அகற்றுவாய்.
