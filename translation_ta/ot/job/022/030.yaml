source:
  edition: WLC
  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: ta
  text: குற்றமற்றவன் அல்லாத ஒருவனைக் கூட அவர் விடுவிப்பார்[a]; உன் கைகளின் தூய்மையால்[b] அவன் விடுவிக்கப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் குற்றமற்றவனை விடுவிப்பார்.” முதல் அரையடியின் எபிரெய வாசகம் கடினமானது; சிலர் இச்சொற்றொடரை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “உன் கைகளின் தூய்மையால்”; இது குற்றமின்மை அல்லது ஒழுக்கத் தூய்மையைக் குறிக்கும் சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: விடுவிப்பார்
  rationale: מלט என்பதன் பியேல் வடிவம் ஒருவரைத் தப்புவித்தல் அல்லது மீட்டல் என்ற பொருளைத் தருகிறது. அடுத்த அரையடியிலுள்ள நிஃபால் வடிவத்துடனான இணைநிலையைத் தக்கவைக்க ‘விடுவிப்பார்’ இயல்பாக உள்ளது.
- source_word: אִי נָקִי
  choice: குற்றமற்றவன் அல்லாத ஒருவனையும்
  rationale: இங்கு אִי என்பது அரிதான எதிர்மறைப் பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளது; נָקִי நீதிசார் அல்லது ஒழுக்கநெறிசார் குற்றமின்மையைக் குறிக்கிறது. எபிரெயச் சொற்றொடர் கடினமானது என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְנִמְלַט
  choice: அவன் விடுவிக்கப்படுவான்
  rationale: מלט என்பதன் நிஃபால் வடிவத்தின் செயப்பாட்டுப் பொருளையும் முதல் அரையடியுடனான இணைநிலையையும் இது காக்கிறது.
- source_word: בְּבֹר
  choice: தூய்மையால்
  rationale: בֹּר இங்கு தூய்மை என்ற பொருளில் புரிந்துகொள்ளப்படுகிறது; בְּ கருவி அல்லது வழிமுறையைக் குறிக்கும் ‘-ஆல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כַּפֶּיךָ
  choice: உன் கைகளின்
  rationale: சொல்லளவில் உள்ளங்கைகள் என்றாலும், இச்சூழலில் ‘கைகள்’ என்பது இயல்பான தமிழ்; கைகளின் தூய்மை குற்றமின்மை அல்லது ஒழுக்கத் தூய்மையைக் குறிக்கும் உருவகம்.
theological_decisions:
- issue: முதல் அரையடியின் பொருள்
  choice: குற்றமற்றவன் அல்லாத ஒருவனையும் அவர் விடுவிப்பார்
  alternative: குற்றமற்ற ஒருவனை அவர் விடுவிப்பார்
  rationale: אִי נָקִי என்ற கடினமான சொற்றொடரை எதிர்மறைப் பொருளில் வாசிப்பது பாரம்பரியப் புரிதலுக்கும் அடுத்த அரையடிக்கும் பொருந்துகிறது. அதேவேளை எபிரெயத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இவ்வசனம் கூறுவதைக் கடந்த ஒரு குறிப்பிட்ட பரிந்துபேசுதல் கோட்பாடு இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விடுவிப்பார்/விடுவிக்கப்படுவான்’ என்ற இணைச்சொற்கள் எபிரெய இணைநிலையைத் தக்கவைக்கின்றன; கடினமான முதல் அரையடியின் மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
