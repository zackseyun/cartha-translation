  to: நீதிமான்கள் கண்டு மகிழ்வார்கள்; குற்றமற்றவன் அவர்களை ஏளனம் செய்வான்.
  rationale: Removed the added object “அதை,” preserving the Hebrew’s unexpressed object and its contextual ambiguity. Removed the contrastive “-ஓ” so that the second clause is coordinated without adding contrast. The singular generic form in the second clause and the plural referent “அவர்களை” are retained.
