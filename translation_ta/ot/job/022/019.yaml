id: JOB.22.19
reference: Job 22:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: ta
  text: நீதிமான்கள் கண்டு மகிழ்வார்கள்; குற்றமற்றவன் அவர்களை ஏளனம் செய்வான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאוּ
  choice: கண்டு
  rationale: ראה என்பதன் Qal imperfect 3mp வடிவம்; நிகழ்ந்ததைப் பார்ப்பது அல்லது உணர்ந்து சாட்சியாக இருப்பது என்ற நேரடியான பொருளைத் தருகிறது. தமிழில் அடுத்த வினையுடன் இணையும் ‘கண்டு’ இயல்பானது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை உரிச்சொல். ஒழுக்க ரீதியான வகைப்பாட்டைச் சுருக்கமாகவும் மரியாதையான வேதாகம நடையிலும் காக்கிறது.
- source_word: וְיִשְׂמָחוּ
  choice: மகிழ்வார்கள்
  rationale: שׂמח என்பதன் Qal imperfect 3mp; அளவுக்கு மீறிய தீவிரத்தைச் சேர்க்காமல் மகிழ்ச்சியான எதிர்வினையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנָקִי
  choice: குற்றமற்றவனோ
  rationale: ஒருமை உரிச்சொல் பெயர்ச்சொல்லாகப் பொதுப்படையாகப் பயன்படுகிறது. எபிரேய ஒருமையைப் பாதுகாத்து, முதல் அரையடியுடன் உள்ள வேறுபாட்டையும் ‘-ஓ’ மூலம் காட்டுகிறது.
- source_word: יִלְעַג
  choice: ஏளனம் செய்வான்
  rationale: לעג என்பதன் Qal imperfect 3ms; வெறும் சிரிப்பை விட இகழ்ச்சியும் பரிகாசமும் கலந்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களை
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட துன்மார்க்கரைச் சுட்டும் பன்மைப் பதிலிப்பெயர். தமிழில் ‘ஏளனம் செய்’ என்பதற்கு இயல்பான நேர்செயப்படுபொருள் வடிவம்.
theological_decisions:
- issue: சூழலில் பதிலிப்பெயர்களின் சுட்டுப்பொருள்
  choice: நீதிமான்களும் குற்றமற்றவனும் சுற்றியுள்ள வசனங்களில் விவரிக்கப்படும் துன்மார்க்கரின் வீழ்ச்சியைக் கண்டு எதிர்வினையாற்றுகின்றனர்.
  alternative: தெய்வீக நியாயத்தீர்ப்பைக் காணும்போது நீதிமான்கள் மகிழ்வதைப் பற்றிய பொதுவான கூற்று.
  rationale: யோபு 22-ன் உடனடிச் சூழல் துன்மார்க்கரின் அழிவைப் பற்றிப் பேசுகிறது. எனினும் மொழிபெயர்ப்பு அவர்களின் அடையாளத்தை வெளிப்படையாகச் சேர்க்காமல் ‘அவர்களை’ என்ற பதிலிப்பெயரையே வைத்திருப்பதால் மூலத்தின் சுருக்கமும் சூழல் சார்ந்த சுட்டும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த மொழிநடை. எபிரேயத்தில் ‘காண்பார்கள்’ என்பதற்குத் தெளிவான செயப்படுபொருள் இல்லாவிட்டாலும், தமிழில் ‘அதைக் கண்டு’ என்பது முன்சூழலில் நிகழ்ந்த வீழ்ச்சியை இயல்பாகச் சுட்டுகிறது; புதிய விளக்கத்தைச் சேர்ப்பதற்குப் பதிலாக மறைமுகச் சூழல் சுட்டாகப் பயன்படுகிறது. இரண்டாம் அரையடியின் ஒருமை வடிவம் பாதுகாக்கப்பட்டுள்ளது.
