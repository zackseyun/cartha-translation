source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: ta
  text: ஒரு மனிதன் கடவுளுக்குப் பயனுள்ளவனாக இருக்க முடியுமா? நுண்ணறிவுள்ளவன் தனக்குத்தானே பயனுள்ளவனாக இருக்கிறான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஒரு மனிதன் கடவுளுக்கு ஆதாயம் அளிக்க முடியுமா? ஏனெனில் புரிந்துணர்வுள்ளவன் தனக்கே ஆதாயம் அளிக்கிறான்.”'
    reason: סכן என்பதற்கு ‘பயனாக இரு’ என்பதோடு ‘ஆதாயம் அளி’ என்ற நெருக்கமான மாற்றுப் பொருளும் உண்டு; כִּי-யை ‘ஏனெனில்’ என்றும் வெளிப்படையாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: הַלְאֵל
  choice: கடவுளுக்குப் ... முடியுமா?
  rationale: கேள்வித்துகள் הֲ மற்றும் לְאֵל இணைந்து, ஒரு மனிதன் கடவுளுக்குப் பயன் அளிக்க முடியுமா என்ற சொல்லாட்சிக் கேள்வியை அமைக்கின்றன.
- source_word: יִסְכָּן
  choice: பயனுள்ளவனாக இருக்க
  rationale: סכן என்பதன் இச்சூழல் பொருள் ‘பயனாக/உதவியாக இருத்தல்’; வணிகத் தொனி மிகாமல் இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: גָּבֶר
  choice: ஒரு மனிதன்
  rationale: ஆண்பால் ஒருமை வடிவத்தை மதிக்கிறது; இங்கு அது மனிதனைப் பொதுவாகக் குறிக்கிறது.
- source_word: כִּי
  choice: (தனி இணைப்புச்சொல் இல்லாமல்)
  rationale: כִּי காரண அல்லது வலியுறுத்தல் உறவைத் தரலாம். தமிழில் இரண்டாம் வாக்கியத்தின் நேரடி அமைப்பே அந்த விளக்கத் தொடர்பை இயல்பாக உணர்த்துகிறது; ‘நிச்சயமாக’ என்று சேர்த்து ambiguity-ஐ ஒருதலைப்பட்சமாகத் தீர்க்கவில்லை.
- source_word: יִסְכֹּן עָלֵימוֹ
  choice: தனக்குத்தானே பயனுள்ளவனாக இருக்கிறான்
  rationale: இரண்டாம் סכן-ஐ முதல் பயன்பாட்டுடன் இணையாக வைத்தும், עָלֵימוֹ-வை பயன் அந்த நபருக்கே சேர்வதாகவும் மொழிபெயர்க்கிறது.
- source_word: מַשְׂכִּיל
  choice: நுண்ணறிவுள்ளவன்
  rationale: שכל வேரிலிருந்து வரும் இப்பெயரெச்ச வடிவம் புரிந்துணர்வும் விவேகமும் உள்ளவரைக் குறிக்கிறது; ‘நுண்ணறிவுள்ளவன்’ அதைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மனிதன் கடவுளுக்குப் பயன் சேர்க்க முடியுமா என்பது
  choice: முதல் அரையடி சொல்லாட்சிக் கேள்வியாகவும், இரண்டாம் அரையடி நுண்ணறிவின் பயன் மனிதனுக்கே சேர்வதாகவும் தரப்பட்டுள்ளது.
  alternative: இரண்டாம் அரையடியை வெறும் பொதுக்கூற்றாக, ‘நுண்ணறிவுள்ளவன் தனக்கே பயன் தருகிறான்’ என்று வாசிக்கலாம்.
  rationale: எபிரெய இணைநிலை கடவுளுக்கான பயனையும் மனிதனுக்கே சேரும் பயனையும் எதிரெதிராக நிறுத்துகிறது; இதற்கு அப்பாற்பட்ட கோட்பாட்டு விரிவாக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட சொல்லாட்சிக் கேள்வி. ‘கடவுள்’ பொதுவாகப் புரியும் இறைக் குறிப்பு; ‘நுண்ணறிவுள்ளவன்’ மַשְׂכִּיל என்பதன் அறிவார்ந்த/விவேகமான நிழற்பொருளைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
