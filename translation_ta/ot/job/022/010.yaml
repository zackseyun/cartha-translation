  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: ta
  text: அதனால், உன்னைச் சுற்றிலும் கண்ணிகள் உள்ளன[a]; திடீர் திகில் உன்னைப் பதறவைக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணிகள் உன்னைச் சூழ்ந்துள்ளன; திடீரெனப் பயம் உன்னைப் பதறவைக்கிறது.”
    reason: சுற்றியிருத்தலை ‘சூழ்ந்துள்ளன’ என்றும், פִּתְאֹם என்பதை வினையடையாக ‘திடீரென’ என்றும் அமைக்கலாம்.
lexical_decisions:
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: முந்தைய குற்றச்சாட்டுகளிலிருந்து வரும் விளைவை அல்லது முடிவை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: סְבִיבוֹתֶיךָ פַחִים
  choice: உன்னைச் சுற்றிலும் கண்ணிகள் உள்ளன
  rationale: எபிரெயக் கவிதையில் விடப்பட்டுள்ள இணைப்பு வினையைத் தமிழில் இயல்பாகச் சேர்த்து, சுற்றியிருக்கும் ஆபத்து என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: פַחִים
  choice: கண்ணிகள்
  rationale: வேட்டைக்காக வைக்கப்படும் பொறி அல்லது கண்ணி என்ற பொருளில், கவிதைநயத்தையும் மறைந்திருக்கும் ஆபத்தையும் வெளிப்படுத்துகிறது.
- source_word: וִיבַהֶלְךָ
  choice: உன்னைப் பதறவைக்கிறது
  rationale: בהל என்பதன் திடுக்கிடச் செய்தல், கலங்கச் செய்தல், பீதியடையச் செய்தல் ஆகிய வலிமையான உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: פַּחַד פִּתְאֹם
  choice: திடீர் திகில்
  rationale: எதிர்பாராதவிதமாக வரும் கடுமையான பயத்தைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
