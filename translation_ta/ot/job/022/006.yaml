- source_word: תַּפְשִׁיט
  choice: பறித்தாய்
  rationale: ஒருவரிடமிருந்து ஆடையைக் களைதல் என்ற பொருளை, வன்முறையோ அநீதியோ கலந்த குற்றச்சாட்டாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
