  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: ta
  text: ஏனெனில், நீ காரணமின்றி உன் சகோதரர்களிடமிருந்து பிணைப்பொருளை எடுத்துக்கொண்டாய்[a][b]; நிர்வாணமானவர்களிடமிருந்து ஆடைகளையும் பறித்தாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் சகோதரர்களிடமிருந்து காரணமின்றிப் பிணைப்பொருளைக் கைப்பற்றினாய்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உன் சகோதரர்கள்’ என்பது உடன்பிறந்தவர்களை மட்டும் அல்லாமல், ஒரே சமூகத்தைச் சேர்ந்தவர்களையும் பரந்த பொருளில் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘நிர்வாணமானவர்கள்’ என்பது இங்கு போதிய ஆடையில்லாத வறியவர்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிப்பாஸ் முன்வைக்கும் குற்றச்சாட்டை முந்தைய கூற்றோடு காரணவிளக்கத் தொடர்பில் இணைக்கிறது.
- source_word: תַחְבֹּל
  choice: அடமானம் வாங்கினாய்
  rationale: கடனுக்காகப் பிணைப்பொருள் அல்லது அடமானம் எடுத்தலைக் குறிக்கும் חבל என்பதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אַחֶיךָ
  choice: உன் சகோதரர்களிடம்
  rationale: எபிரெயச் சொல்லின் நேரடியான ஆண்பால் பன்மையைத் தக்கவைக்கிறது; இது உடன்பிறந்தவர்களை மட்டும் அல்லாமல் சமூகத்தினரையும் குறிக்கக்கூடும்.
- source_word: חִנָּם
  choice: காரணமின்றி
  rationale: பணம் பெறாமல் என்பதைக் காட்டிலும், நியாயமான காரணமே இல்லாமல் செய்யப்பட்ட செயல் என்ற அறநெறிக் குற்றச்சாட்டை வெளிப்படுத்துகிறது.
- source_word: וּבִגְדֵי
  choice: ஆடைகளையும்
  rationale: בגד என்பதன் ஆடை/உடுப்பு என்ற பொதுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: עֲרוּמִּים
  choice: நிர்வாணமானவர்களிடமிருந்து
