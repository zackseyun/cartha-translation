  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: ta
  text: தங்கத்தைப் புழுதியில் வை[a]; ஓபீரின் தங்கத்தைக்[b] காட்டாறுகளின் பாறைகளிடையே வை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கத் தாதுவைப் புழுதியில் வை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் சுத்திகரிக்கப்பட்ட தங்கத்தை மட்டுமல்ல, விலைமதிப்புள்ள உலோகத்தையோ தாதுவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ஓபீர் உயர்தரத் தங்கத்திற்குப் புகழ்பெற்ற ஓர் இடம்; ஆகவே இங்கு “ஓபீரின் தங்கம்” என்று பொருள்.
    reason: cultural_note
  - marker: c
    text: “காட்டாறுகள்” என்பது மழைக்காலத்தில் மட்டும் தண்ணீர் அல்லது வெள்ளம் ஓடும் ஓடுபாதைகளைக் குறிக்கலாம்; “நீரோடைகள்” அல்லது “வெள்ளப்பள்ளங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: வைத்துவிடு
  rationale: שׁית என்பதன் அடிப்படைப் பொருள் ‘வை, அமை’. தமிழில் ‘வைத்துவிடு’ என்பது கட்டளையின் இயல்பைத் தக்கவைத்தபடியே, இச்சூழலில் செல்வத்தைச் சார்ந்திருப்பதை விட்டுவிடும் உட்பொருளையும் இயல்பாக உணர்த்துகிறது; ‘எறிந்துவிடு’ என்று வினையின் வலிமையை மிகைப்படுத்தவில்லை.
- source_word: עַל עָפָר
  choice: புழுதியில்
  rationale: עָפָר என்பது புழுதி அல்லது தளர்ந்த மண். எபிரெய முன்னிடைச்சொல் சொற்பட ‘மேல்’ எனினும், தமிழில் இக்காட்சிக்கு ‘புழுதியில்’ என்பது இயல்பாகவும் கவித்துவமாகவும் அமைகிறது.
- source_word: בָּצֶר
  choice: தங்கத்தை
  rationale: இச்சொல் விலைமதிப்புள்ள உலோகம், தங்கம் அல்லது தங்கத் தாது என்பவற்றைக் குறிக்கலாம். அடுத்துள்ள ‘ஓபீர்’ என்ற இணை அமைப்பின் காரணமாக ‘தங்கம்’ தெளிவான முதன்மை மொழிபெயர்ப்பு; தாது என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וּבְצוּר נְחָלִים
  choice: காட்டாறுகளின் பாறைகளிடையே
  rationale: צוּר என்பது பாறை; נְחָלִים என்பது நீரோடைகள், வெள்ளப்பள்ளத்தாக்குகள் அல்லது பருவகாலக் காட்டாறுகளைக் குறிக்கலாம். வறண்ட பிரதேசங்களில் வெள்ளம் ஓடும் பாறைமிகுந்த ஓடுபாதை என்ற படிமத்தை ‘காட்டாறுகளின் பாறைகளிடையே’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: אוֹפִיר
  choice: ஓபீரின் தங்கத்தை
  rationale: ஓபீர் உயர்தரத் தங்கத்திற்குப் புகழ்பெற்ற இடப்பெயர். மூலத்தில் இடப்பெயர் மட்டும் வந்தாலும், இணைநிலையிலுள்ள பொருள் தங்கம் என்பதால் தமிழில் அதை வெளிப்படையாகச் சொல்வது பொருளையும் கவிதை இணைப்பையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: எலிப்பாசின் அறிவுரையில் இவ்வசனத்தின் நோக்கம்
  choice: பொருட்செல்வத்தின் மீதான சார்பை விட்டுவிடுமாறு அழைக்கும் கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: தங்கத்தைப் பாதுகாப்பான இயற்கை இடங்களில் சேமிக்குமாறு கூறும் கட்டளை.
  rationale: அடுத்த வசனத்தில் எல்லாம் வல்லவர் அந்த மனிதனின் பொன்னாக இருப்பார் என்று வருவதால், இங்கு மண்ணுலகச் செல்வத்தை ஒதுக்கிவைப்பதே சூழலுக்கு ஏற்ற வாசிப்பு. எனினும் மூல வினை வெறுமனே ‘வை’ என்பதால் ‘எறி’ போன்ற அதிக விளக்கமுள்ள சொல்லைத் தவிர்த்து, உள்ள பதற்றம் காக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வைத்துவிடு’ என்பது மூலத்தின் ‘வை’ என்ற பொருளைத் தக்கவைத்தபடியே செல்வத்தை ஒதுக்கும் சூழல்சார் நுண்ணுணர்வை அளிக்கிறது. ‘வாடி’ என்ற கடன்சொல்லுக்குப் பதிலாக இயல்பான ‘காட்டாறு’ பயன்படுத்தப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
