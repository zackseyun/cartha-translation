revisions:
- from: தங்கத்தைப் புழுதியில் வைத்துவிடு[a]; ஓபீரின் தங்கத்தை[b] காட்டாறுகளின் பாறைகளிடையே வைத்துவிடு[c].
  to: தங்கத்தைப் புழுதியில் வை[a]; ஓபீரின் தங்கத்தைக்[b] காட்டாறுகளின் பாறைகளிடையே வை[c].
  rationale: வைத்துவிடு என்பதற்குப் பதிலாக வை என மாற்றப்பட்டுள்ளது. இது மூலத்தின் எளிய ‘வை/அமை’ என்ற கட்டளையைத் துல்லியமாகக் காக்கிறது; செல்வத்தை விட்டொழிக்கும் சூழல்சார் கருத்தை மிகையாக வினையிலேயே சேர்க்காது. அதற்கேற்ப அடிக்குறிப்பு a-யிலும் வினை திருத்தப்பட்டுள்ளது. பிற சொற்களும் அடிக்குறிப்புகளும் மூலத்திற்கும் நவீன தரத் தமிழுக்கும் ஏற்றவையாக உள்ளன.
