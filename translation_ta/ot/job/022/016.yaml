  text: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
translation:
  language: ta
  text: தங்கள் காலம் வருவதற்குமுன்பே பறித்தெடுக்கப்பட்டவர்கள்[a]; அவர்களின் அஸ்திவாரம் ஓர் ஆற்றால் அடித்துச் செல்லப்பட்டது[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் காலம் வருவதற்குமுன்பே வெட்டப்பட்டவர்கள்.’ இங்குள்ள எபிரெய வினைச்சொல் கடினமானது; அது பிடிக்கப்படுதல், சுருங்கிப்போதல் அல்லது திடீரென அகற்றப்படுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களின் அஸ்திவாரத்தின்மேல் ஓர் ஆறு ஊற்றப்பட்டது.’ எபிரெயப் படிமம் மிகவும் சுருக்கமாக உள்ளது; அஸ்திவாரம் நீரால் மூழ்கடிக்கப்பட்டதையோ அடித்துச் செல்லப்பட்டதையோ இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்த வசனம் பெருவெள்ளத்தில் அழிந்த தலைமுறையைச் சிறப்பாகக் குறிக்கலாம்; அல்லது தீயவர்களின் திடீர் வீழ்ச்சியைப் பொதுவாகக் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: பறித்தெடுக்கப்பட்டவர்கள்
  rationale: சூழலில் முன்பு வாழ்ந்த தீயவர்களைத் தொடர்ந்து விவரிக்கும் தொடர்புச் சொல்லைத் தமிழில் தனியாக மொழிபெயர்க்காமல், பெயரெச்சத் தொடரில் இயல்பாக இணைக்கிறது.
- source_word: קֻמְּטוּ
  choice: பறித்தெடுக்கப்பட்டவர்கள்
  rationale: செயப்பாட்டு வடிவம் திடீரென அகற்றப்படுதலைக் குறிக்கலாம். எபிரெயச் சொல்லின் ‘சுருங்கிப்போதல்/பிடிக்கப்படுதல்/திடீரென அகற்றப்படுதல்’ என்ற கடினமான படிமத்தைத் தீர்மானமாகக் குறுக்காமல், அகால அழிவை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא עֵת
  choice: தங்கள் காலம் வருவதற்குமுன்பே
  rationale: உரிய காலத்திற்கு முன்பான அகால முடிவைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נָהָר
  choice: ஓர் ஆறு
  rationale: அடிப்படைப் பொருளான ‘ஆறு’ என்பதைக் காக்கிறது; ‘வெள்ளம்’ என்று மொழிபெயர்த்து குறிப்பிட்ட வரலாற்று நிகழ்வை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: יוּצַק
  choice: அடித்துச் செல்லப்பட்டது
  rationale: சொற்பொருளில் ‘ஊற்றப்பட்டது’ என்பதுடன் தொடர்புடைய செயப்பாட்டு வினை. ஆறும் அஸ்திவாரமும் இணையும் சுருக்கமான படிமத்தில், அழிவின் விளைவை இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְסוֹדָם
  choice: அவர்களுடைய அஸ்திவாரம்
  rationale: மூன்றாம் நபர் பன்மை உரிமையைக் கொண்ட ஒருமைச் சொல்லை அப்படியே காத்து, வீழ்ச்சியைக் குறிக்கும் உருவகத்திற்குப் பொருத்தமான தமிழ்ச் சொல்லைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: நீரால் உண்டாகும் நியாயத்தீர்ப்புப் படிமத்தின் தன்மை
  choice: தீயவர்கள் அகாலமாக அழிக்கப்பட்டதையும், அவர்களுடைய அஸ்திவாரம் ஆற்றால் அடித்துச் செல்லப்பட்டதையும் கூறி, படிமத்தைத் திறந்த நிலையில் வைத்தல்
  alternative: இது நோவாவின் காலத்து வெள்ளத் தலைமுறையை மட்டுமே குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது பொதுவான திடீர் வீழ்ச்சியின் உருவகம் என்று மட்டும் மொழிபெயர்த்தல்
  rationale: சூழலும் நீரழிவுப் படிமமும் பெருவெள்ளத்தை நினைவூட்டக்கூடும்; எனினும் எபிரெய உரை அந்த வரலாற்றுக் குறிப்பை கட்டாயப்படுத்தவில்லை. ஆகவே குறிப்பிட்ட வரலாற்று நிகழ்வுக்கும் பொதுவான நியாயத்தீர்ப்பு உருவகத்திற்கும் இடையிலான பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவிதைநடை கண்ணியத்தைப் பேணியும் மொழிபெயர்க்கப்பட்டது. ‘அஸ்திவாரம்’ என்பது பரவலாகப் புரியும் கட்டிடப் படிமச் சொல். மூலத்தின் சுருக்கமும் இரட்டைப் பொருள் வாய்ப்பும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
