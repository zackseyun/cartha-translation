revisions:
- from: உண்மையாகவே, நமக்கு எதிராக எழுந்தவர்கள் அழிக்கப்பட்டார்கள்[a]; அவர்களில் எஞ்சியதை நெருப்பு விழுங்கியது[b].
  to: உண்மையாகவே, நமக்கு எதிராக எழுந்தவர்கள் அழிக்கப்பட்டார்கள்[a]; அவர்களில் எஞ்சியோரை நெருப்பு விழுங்கியது[b].
  rationale: The revision makes the second clause more directly express 'their remnant' in idiomatic modern Tamil while preserving the source's contextual ambiguity through the existing note on קִימָנוּ. It does not introduce a doctrinal interpretation.
