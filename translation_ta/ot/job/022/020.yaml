id: JOB.22.20
reference: Job 22:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: ta
  text: உண்மையாகவே, நமக்கு எதிராக எழுந்தவர்கள் அழிக்கப்பட்டார்கள்[a]; அவர்களில் எஞ்சியோரை நெருப்பு விழுங்கியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் உள்ள קִימָנוּ என்ற சொல் பொருள் காண்பதற்குக் கடினமானது. இதை இங்கு “நமக்கு எதிராக எழுந்தவர்கள்” என்று புரிந்துகொள்ளலாம்; வேறு சிலர் “நமது சொத்து” அல்லது “நமது உடைமைகள்” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர்களுடைய எஞ்சியோர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: உண்மையாகவே
  rationale: இங்கு இது மெய்யான நிபந்தனையை அறிமுகப்படுத்தாமல், வலியுறுத்தி உறுதிப்படுத்தும் எபிரெயச் சொல்லாடலாக வருகிறது.
- source_word: נִכְחַד
  choice: அழிக்கப்பட்டார்கள்
  rationale: כחד என்பதன் நிஃபால் வடிவம் அழிக்கப்படுதல் அல்லது முற்றிலும் அகற்றப்படுதல் என்ற செயப்பாட்டு விளைவைத் தருகிறது.
- source_word: קִימָנוּ
  choice: நமக்கு எதிராக எழுந்தவர்கள்
  rationale: இச்சொல் கடினமானது; 'எழுந்தவர்கள்' என்ற அடிப்படைக் கருத்தைத் தக்கவைத்து, சூழலில் எதிரிகளைக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִתְרָם
  choice: அவர்களில் எஞ்சியதை
  rationale: יתר என்பது எஞ்சியிருப்பதை அல்லது மீதியைச் சுட்டுகிறது; பின்னொட்டு முன் குறிப்பிடப்பட்ட கூட்டத்தைக் குறிக்கிறது.
- source_word: אָכְלָה אֵשׁ
  choice: நெருப்பு விழுங்கியது
  rationale: நெருப்பு அழித்துத் தீர்ப்பதைச் சித்தரிக்கும் மூலமொழியின் உயிரோட்டமான உருவகத்தை இது இயல்பான தமிழில் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தலும் நெருப்பு விழுங்கும் உருவகமும் காக்கப்பட்டுள்ளன; கடினமான קִימָנוּ என்பதன் உண்மையான பொருள் ஐயுறவு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
