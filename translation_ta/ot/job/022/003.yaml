  terminology: “சர்வவல்லவர்,” “நீதிமான்,” “வழிகள்,” “குற்றமற்றவை,” and “ஆதாயம்” are suitable and preserve the formal and ethical register. The lexical-alternative footnotes remain appropriate.
  issues:
