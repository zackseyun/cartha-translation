source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: ta
  text: நீ நீதிமானாக இருப்பதில் சர்வவல்லவருக்கு ஏதாவது மகிழ்ச்சி உண்டா[a]? நீ உன் வழிகளைக் குற்றமற்றவையாக்குவதால் அவருக்கு ஏதாவது ஆதாயம் உண்டா[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருப்பமா?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “லாபமா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: ஏதாவது மகிழ்ச்சியா
  rationale: חֵפֶץ என்பது மகிழ்ச்சி, விருப்பம் அல்லது இன்பம் எனப் பொருள்படும். கேள்வி அமைப்பில் இயல்பாகவும் மூலத்தின் சொல்லாட்சிப் பரப்பைத் தக்கவைத்தும் ‘ஏதாவது மகிழ்ச்சியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְשַׁדַּי
  choice: சர்வவல்லவருக்கு
  rationale: שַׁדַּי என்பது யோபு நூலில் வரும் இறைப் பட்டப்பெயர்; தமிழில் நிலைபெற்ற ‘சர்வவல்லவர்’ என்பதும் לְ முன்னொட்டின் உறவைக் காட்டும் ‘-க்கு’ வேற்றுமையும் பயன்படுத்தப்பட்டன.
- source_word: כִּי תִצְדָּק
  choice: நீ நீதிமானாக இருப்பது
  rationale: Qal வடிவிலுள்ள צדק இங்கு தன்னை நீதிமானாக்கிக்கொள்வது என்பதைக் காட்டிலும் நீதிமானாக அல்லது நியாயப்பக்கத்தில் இருப்பதைக் குறிக்கிறது.
- source_word: וְאִם
  choice: (இரண்டாம் இணையான கேள்வி)
  rationale: இணையான இரண்டாம் வினாவை அறிமுகப்படுத்தும் וְאִם, தமிழில் தனி வினாவாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; மரத்தன்மையான ‘மற்றும் என்றால்’ தவிர்க்கப்பட்டது.
- source_word: בֶּצַע
  choice: ஆதாயம்
  rationale: בֶּצַע என்பது கிடைக்கும் லாபம் அல்லது ஆதாயத்தைக் குறிக்கும்; கடவுளுக்குக் கிடைக்கும் பயன் என்ற பொருளாதார உருவகத்தை ‘ஆதாயம்’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: כִּי תַתֵּם
  choice: குற்றமற்றவையாக ஆக்குவது
  rationale: Hiphil வடிவிலுள்ள תמם, முழுமைப்படுத்துதல் அல்லது குற்றமற்றதாக ஆக்குதல் என்ற காரணவினைப் பொருளைக் கொண்டது; ஒழுக்கப் பின்னணியில் ‘குற்றமற்றவையாக ஆக்குவது’ பொருத்தமானது.
- source_word: דְּרָכֶיךָ
  choice: உன் வழிகள்
  rationale: דֶּרֶךְ என்பதன் பன்மை ஒருவரின் வாழ்க்கை முறை அல்லது நடத்தையைக் குறிக்கும் உருவகம்; ‘வழிகள்’ அந்த உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மனித நீதியால் கடவுளுக்கு உள்ளார்ந்த பயன் கிடைக்குமா என்பது
  choice: மனிதனின் நீதியால் கடவுளுக்கு மகிழ்ச்சியோ ஆதாயமோ கிடைப்பதில்லை என்ற எலிப்பாசின் வாதத்தை வலியுறுத்தும் சொல்லாட்சிக் கேள்விகளாக மொழிபெயர்த்தல்
  alternative: கடவுளுக்கு மனித நீதி தேவையில்லை என்பதை மட்டும் வலியுறுத்தி, அவர் அதில் மகிழ்வதைக் குறித்த மறுப்பை மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை חֵפֶץ, בֶּצַע ஆகிய சொற்களைக் கொண்டு கூர்மையான சொல்லாட்சிக் கேள்விகளை எழுப்புகிறது. இது எலிப்பாசின் கூற்றாக அப்படியே பாதுகாக்கப்பட்டது; வேதாகமத்தின் பிற இடங்களில் கடவுள் நீதியில் மகிழ்கிறார் என்ற கருத்தை மறுக்கும் பொதுக் கோட்பாடாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்க எளிதான, அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. இரு இணையான சொல்லாட்சிக் கேள்விகளும் தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டன. ‘சர்வவல்லவர்’ என்ற வழக்கமான இறைப் பட்டப்பெயரும், வாழ்க்கை நடத்தையைக் குறிக்கும் ‘வழிகள்’ என்ற எபிரெய உருவகமும் தக்கவைக்கப்பட்டன.
