  yaml_path: translation/ot/job/022/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: ta
  text: 'அப்போது தேமானியனாகிய எலிப்பாஸ் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினை இங்கு உரையாடலில் அடுத்த பேச்சை அறிமுகப்படுத்துகிறது. ‘மறுமொழியாக’ என்பது பதிலளிக்கும் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַתֵּמָנִי
  choice: தேமானியனான
  rationale: தேமான் பகுதியைச் சேர்ந்தவர் என்ற இன/புவியியல் அடையாளத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்ற பொதுவான பேச்சு வினையை நேரடியாகக் காட்டுகிறது; ‘மறுமொழியாகச் சொன்னது’ என்பது எபிரெய மொழியின் வழக்கமான ‘பதிலளித்து, சொன்னான்’ என்ற சூத்திரத்தை இயல்பான தமிழ் உரைநடையில் வழங்குகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் உரையாடலின் அடுத்த கட்டத்தைச் சுட்டுகிறது; ‘அப்போது’ கதைத் தொடர்ச்சியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
