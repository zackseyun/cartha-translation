translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான இலக்கிய உரைநடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய ‘மறுமொழி கூறி சொன்னான்’ என்ற இரட்டைச் சொல்லமைப்பு தமிழில் தேவையற்ற கடினத்தன்மை பெறாமல் ‘மறுமொழியாகச் சொன்னது’ என வழங்கப்பட்டுள்ளது; தொடர்ந்து வரும் நேரடி உரைக்கு ஏற்றவாறு முடிவில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
