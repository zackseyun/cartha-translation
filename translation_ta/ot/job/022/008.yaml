  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: ta
  text: 'ஆனால் வலிமைமிக்கவனுக்கு[a] நிலம் சொந்தமாக இருந்தது;

    மதிப்புப் பெற்றவன்[b] அதில் குடியிருந்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘புயமுள்ள மனிதன்’; இது வலிமை அல்லது அதிகாரமுள்ள மனிதனைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்புகள்: ‘ஆதரவு பெற்றவன்,’ ‘சலுகை பெற்றவன்,’ அல்லது ‘மரியாதைக்குரியவன்.’ சொல்லுக்குச் சொல், ‘முகம் உயர்த்தப்பட்டவன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ זְרוֹעַ
  choice: ஆனால் வலிமைமிக்கவனுக்கு
  rationale: וְ என்ற இணைப்பைச் சுற்றியுள்ள குற்றச்சாட்டுகளின் முரண்பாட்டை வெளிப்படுத்தும் வகையில் ‘ஆனால்’ என்று மொழிபெயர்த்துள்ளோம். ‘கையுடைய மனிதன்’ என்பது சொல்லுக்குச் சொல் வடிவம்; இங்கு זְרוֹעַ (‘கை/புயம்’) வலிமை அல்லது அதிகாரத்தைக் குறிக்கும் மரபுத்தொடராக இருப்பதால் ‘வலிமைமிக்கவன்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: לוֹ הָאָרֶץ
  choice: நிலம் சொந்தமாக இருந்தது
  rationale: לְ உடன் வரும் ஆண்பால் ஒருமைப் பின்னொட்டு உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கிறது. הָאָרֶץ இச்சூழலில் குடியிருக்கும் நிலப்பரப்பைக் குறிப்பதால் ‘நிலம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּנְשׂוּא פָנִים
  choice: மதிப்புப் பெற்றவன்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘முகம் உயர்த்தப்பட்டவன்.’ இந்த மரபுத்தொடர் மதிப்பு, ஆதரவு அல்லது பாரபட்சமான சலுகை பெற்ற ஒருவரைக் குறிக்கலாம். ‘மதிப்புப் பெற்றவன்’ அடிப்படை சமூக உயர்வைத் தெரிவிக்கிறது; எந்த வகையான ஆதரவு என்பது குறித்த மூலத்தின் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יֵשֶׁב בָּהּ
  choice: அதில் குடியிருந்தான்
  rationale: יָשַׁב இங்கு ஒரு நிலத்தில் தங்கி வாழ்வதைக் குறிக்கிறது. בָּהּ என்பதன் பெண்பால் ஒருமைப் பின்னொட்டு முன்வந்த ‘நிலம்’ என்பதைக் சுட்டுகிறது.
