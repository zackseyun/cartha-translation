translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநடையின் இரு இணையான கூறுகளும் காக்கப்பட்டுள்ளன. ‘சொந்தமாக இருந்தது’ மற்றும் ‘குடியிருந்தான்’ என்பவை தெளிவான, dignified பயன்பாடுகள்; அரிதான சொல்லுக்குச் சொல் எபிரெய வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
