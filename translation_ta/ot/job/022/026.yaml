  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: ta
  text: ஏனெனில், அப்போது நீ சர்வவல்லவரில் மனமகிழ்வாய்[a]; கடவுளை நோக்கி உன் முகத்தை உயர்த்துவாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சர்வவல்லவரில் இன்பம் காண்பாய்.’
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளை நோக்கி உன் முகத்தை உயர்த்துதல்’ என்பது நம்பிக்கையுடன் அவரை அணுகுதல், மீண்டும் அவருடைய அருளைப் பெற்றிருத்தல் அல்லது துணிவுடன் மன்றாடுதல் ஆகியவற்றை உணர்த்தக்கூடிய ஒரு மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுடன் இந்த விளைவை இணைக்கும் காரண/விளைவு இடைச்சொல்லாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய நிபந்தனைகள் நிறைவேறிய பின் ஏற்படும் விளைவைக் குறிக்கும் கால வினையடை.
- source_word: עַל
  choice: -இல்
  rationale: התענג என்ற வினையுடன் சேர்ந்து, மகிழ்ச்சிக்குரியவரைச் சுட்டுகிறது; தமிழில் ‘சர்வவல்லவரில் மனமகிழ்வாய்’ என்பது இயல்பாக உள்ளது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: இறைவனுக்குரிய שַׁדַּי என்ற பட்டத்தின் பொருளைத் தெளிவாகத் தரும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: תִּתְעַנָּג
  choice: மனமகிழ்வாய்
  rationale: התפעל வடிவம் தனிப்பட்ட ஆழ்ந்த மகிழ்ச்சியை உணர்த்துகிறது; ‘மனமகிழ்வாய்’ என்பது அந்த நுணுக்கத்தையும் கவிதை நடையையும் இயல்பாகக் காக்கிறது.
- source_word: וְתִשָּׂא
  choice: உயர்த்துவாய்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருளான ‘உயர்த்து’ என்பதைக் காத்து, ‘முகத்தை உயர்த்துதல்’ என்ற உருவகத்தையும் நிலைநிறுத்துகிறது.
- source_word: אֶל
  choice: நோக்கி
  rationale: கடவுளை நோக்கிய திசையைத் தெளிவாகவும் இயல்பான தமிழிலும் குறிக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: இது இறைவனைக் குறிக்கும் ஒருமைச் சொல்; எபிரெயத்தில் இல்லாத கூடுதல் பட்டத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: פָּנֶיךָ
  choice: உன் முகத்தை
  rationale: மூலத்தின் தெளிவான உருவகத்தைத் தக்கவைத்து, நம்பிக்கையுடன் அணுகுதல், மீண்ட அருள் அல்லது துணிவான வேண்டுதல் ஆகிய சாத்தியமான பொருள்களைத் திறந்தவையாக வைக்கிறது.
theological_decisions:
- issue: ‘கடவுளை நோக்கி முகத்தை உயர்த்துதல்’ என்ற மரபுத்தொடரின் பொருள்
  choice: உருவகத்தை அப்படியே தக்கவைத்து, ‘கடவுளை நோக்கி உன் முகத்தை உயர்த்துவாய்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளை நம்பிக்கையுடன் அணுகுவாய்’ அல்லது ‘கடவுளிடம் துணிவுடன் வேண்டுவாய்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த எபிரெய மரபுத்தொடர் நம்பிக்கையுடன் அணுகுதல், மீண்டும் அருள் பெறுதல் அல்லது துணிவுடன் மன்றாடுதல் ஆகியவற்றை உணர்த்தலாம். அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் இறையியல் மற்றும் கவிதை நெருக்கடியைக் காக்க உருவகம் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கவிதை நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘சர்வவல்லவர்’ என்ற பரவலாகப் புரியும் இறைப் பட்டமும், மூலத்தின் ‘முகத்தை உயர்த்துதல்’ என்ற உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
