  text: וְֽ/תִגְזַר א֭וֹמֶר וְ/יָ֣קָם לָ֑/ךְ וְ/עַל דְּ֝רָכֶ֗י/ךָ נָ֣גַֽהּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: ta
  text: நீ ஒரு காரியத்தைத் தீர்மானிப்பாய்[a]; அது உனக்காக நிலைபெறும்; உன் வழிகளின் மேல் ஒளி பிரகாசிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ ஒரு சொல்லைத் தீர்மானிப்பாய்; அது உனக்காக நிலைத்து நிற்கும்.”
    reason: אֹמֶר என்பதன் ‘சொல்’ என்ற நேரடிப் பொருளையும், גזר மற்றும் קום ஆகியவற்றின் முறையே ‘தீர்மானித்தல்’, ‘நிலைத்து நிற்றல்’ என்ற மாற்று நுணுக்கங்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: תִגְזַר
  choice: தீர்மானிப்பாய்
  rationale: גזר என்பதன் அடிப்படைப் பொருள் ‘வெட்டுதல்’; நீட்டிக்கப்பட்ட பொருளில் அது உறுதியாக முடிவுசெய்தல் அல்லது ஆணையிடுதல் என அமையும். இங்கு אֹמֶר என்பதோடும் தொடர்ந்து வரும் விளைவோடும் சேர்ந்து, உறுதியான ஒரு தீர்மானத்தை அல்லது அறிவிப்பைக் குறிக்கிறது. ‘தீர்மானிப்பாய்’ என்பது நவீன தமிழில் இயல்பாகவும், தேவையற்ற அரச அதிகாரத் தொனியைச் சேர்க்காமலும் உள்ளது.
- source_word: אֹמֶר
  choice: ஒரு காரியத்தை
  rationale: אֹמֶר என்பதற்கு சொல், கூற்று, பேச்சு என்ற பொருள்கள் உண்டு. ஆனால் גזר உடன் வரும் இத்தொடரில் சொல்லப்பட்ட அல்லது தீர்மானிக்கப்பட்ட விஷயத்தைக் குறிக்கிறது. எனவே ‘ஒரு காரியத்தை’ என்பது தமிழில் நடைமுறைப் பொருளை இயல்பாகத் தருகிறது; ‘ஒரு சொல்லை’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָקָם
  choice: நிலைபெறும்
  rationale: קום என்பதற்கு எழுதல் அல்லது நிற்றல் என்பது அடிப்படைப் பொருள். ஒரு தீர்மானத்தைப் பற்றிய இச்சூழலில் அது உறுதிப்படுத்தப்பட்டு செயல்திறன் பெறுவதைக் குறிக்கிறது. ‘நிலைபெறும்’ என்பது அந்த விளைவைச் சுருக்கமாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: לָךְ
  choice: உனக்காக
  rationale: לְ என்ற முன்னொட்டு தொடர்பையோ சாதக நிலையையோ குறிக்கலாம். இங்கு ‘உனக்காக’ என்பது எலிப்பாசின் வாக்குறுதித் தொனியையும் எபிரெயச் சொல்லின் தொடர்பையும் நேரடியாகக் காட்டுகிறது.
- source_word: דְּרָכֶיךָ
  choice: உன் வழிகள்மேல்
  rationale: דֶּרֶךְ என்பது வழி அல்லது பாதை என்றும், உருவகமாக ஒருவரின் வாழ்க்கைப் போக்கு என்றும் பொருள்படும். ‘வழிகள்’ என்ற உருவகத்தைத் தக்கவைத்ததால், அதன்மேல் ஒளி பிரகாசிக்கும் என்ற கவித்துவப் படிமமும் நிலைக்கிறது.
- source_word: נָגַהּ אֹור
  choice: ஒளி பிரகாசிக்கும்
  rationale: נָגַהּ என்பது ஒளிர்தல் அல்லது பிரகாசித்தல்; אֹור இங்கு எழுவாய். ‘ஒளி பிரகாசிக்கும்’ என்பது தெளிவான, இயல்பான தமிழாக இருந்து மூலத்தின் கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: எலிப்பாசின் பேச்சிலுள்ள வாக்குறுதியின் தன்மை
  choice: எதிர்பார்க்கப்படும் விளைவைக் குறித்த உறுதியான கூற்றாக மொழிபெயர்க்கப்பட்டது; நிபந்தனையற்ற இறையியல் உத்தரவாதமாக வலுப்படுத்தப்படவில்லை.
  alternative: இதை செழிப்புக்கான முழுமையான, நிபந்தனையற்ற வாக்குறுதியாகவோ அல்லது வெறும் சாத்தியமாகவோ மொழிபெயர்த்தல்.
  rationale: யோபு 22 எலிப்பாசின் அறிவுரையையும் இறையியல் பார்வையையும் பதிவு செய்கிறது; அது நூலின் இறுதி அங்கீகரிக்கப்பட்ட நிலைப்பாடு என்று மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கக் கூடாது. ஆகவே அவனுடைய கூற்றின் உறுதி காக்கப்படுகிறது; ஆனால் எபிரெயத்தில் இல்லாத கூடுதல் கோட்பாட்டு வலிமை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified கவித்துவத் தொனி காக்கப்பட்டது. ஒருமை இரண்டாம் நபருக்கான ‘நீ/உன்’ வடிவங்கள் எபிரெய மூலத்துக்கு ஏற்ப பயன்படுத்தப்பட்டன. மூலத்தில் உள்ள தொடர்ச்சியான எதிர்காலக் கூற்றுகளும் ஒளி–வழி உருவகமும் தக்கவைக்கப்பட்டன.
