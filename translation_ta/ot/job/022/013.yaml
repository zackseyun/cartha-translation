  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: ta
  text: ஆனாலும் நீ, “கடவுளுக்கு என்ன தெரியும்? அடர்ந்த இருளின் ஊடாக[b] அவரால் நியாயம் தீர்க்க முடியுமா?[a]” என்று சொல்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடர்ந்த இருளின் ஊடாக அவர் நியாயம் தீர்க்கிறாரா?” அல்லது “அடர்ந்த இருளின் ஊடாக அவர் நியாயம் தீர்ப்பாரா?” எபிரெய முற்றுப்பெறாத வினை வடிவம் திறனைக் குறிக்கும் வினாவாகவும், எளிய நிகழ்கால அல்லது எதிர்கால வினாவாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “அடர்ந்த இருள்” என்பதைக் “கருமேகம்” அல்லது “ஆழ்ந்த இருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: ஆனாலும் நீ ... என்று சொல்கிறாய்
  rationale: இணைப்புச்சொல்லின் எதிர்மறைத் திருப்பத்தையும், நேரடியான குற்றச்சாட்டாக மேற்கோள் காட்டப்படும் பேச்சின் நிகழ்கால உரையாடல் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: מַה יָדַע אֵל
  choice: கடவுளுக்கு என்ன தெரியும்?
  rationale: מַה என்பதன் நேரடியான வினாப்பொருளையும், יָדַע என்பதன் அறிதல் சார்ந்த பொருளையும், אֵל என்பதற்கான பொதுவான இறைச் சுட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַבְעַד
  choice: அப்பாலிருந்து
  rationale: அடுத்து வரும் காரிருள் பார்வைக்கும் தீர்ப்புக்கும் இடையில் மறைக்கும் தடையாக இருப்பதை வெளிப்படுத்துகிறது. ‘ஊடாக’ என்பதும் சாத்தியம்; இங்கு ‘அப்பாலிருந்து’ என்பது இடைப்பட்ட மறைப்பின் உருவகத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֲרָפֶל
  choice: காரிருள்
  rationale: அடர்ந்த இருள், இருண்ட மேகம், மந்தாரம் ஆகிய பொருள் வரம்பைக் கொண்ட சொல்லின் கனமான மறைப்பு உருவகத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: יִשְׁפּוֹט
  choice: அவரால் நியாயந்தீர்க்க முடியுமா?
  rationale: முற்றுப்பெறாத வினை வடிவம் சூழலில் திறனை ஐயுறும் வினாவாகப் புரிந்துகொள்ளப்படலாம்; தமிழ் ‘அவரால் ... முடியுமா?’ அந்த மறைமுக சந்தேகத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יִשְׁפּוֹט என்பதை திறன் குறித்த வினாவாகவா, எளிய நிகழ்/எதிர்காலச் செயலாகவா மொழிபெயர்ப்பது
  choice: அவரால் நியாயந்தீர்க்க முடியுமா?
  alternative: அவர் நியாயந்தீர்க்கிறாரா? / அவர் நியாயந்தீர்ப்பாரா?
  rationale: எலிப்பாஸ் மேற்கோளிடும் மனப்பான்மை, மறைக்கும் இருளுக்கு அப்பால் கடவுள் மனித விவகாரங்களை அறிந்து தீர்ப்பளிக்க இயலுமா என ஐயுறுகிறது. திறனைச் சுட்டும் முதன்மை மொழிபெயர்ப்பு இந்தச் சொல்லாட்சியின் வாத வலிமையைத் தருகிறது; எபிரெய வினை வடிவத்தின் பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நியாயந்தீர்க்க’ என்பது வேதாகமச் சூழலில் பரிச்சயமானதாய் இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவான வினை. அடிக்குறி [a] தொடர்புடைய இரண்டாம் வினாவிற்குப் பின்னும், [b] முழு மேற்கோளுக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
