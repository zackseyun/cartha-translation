source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் தாழ்த்தப்படும்போது[a], நீ, “உயர்வு உண்டு!” என்று சொல்வாய்; தாழ்ந்த பார்வையுடையவனை[b] அவர் காப்பாற்றுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தாழ்த்தப்படும்போது, ‘உயர்வு உண்டு!’ என்று நீ சொல்வாய்.” எபிரெயக் கூறு சில சொற்கள் விடுபட்ட சுருக்கமான அமைப்பில் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “கண்களில் தாழ்ந்தவன்”; அதாவது, பணிவான அல்லது மனந்தளர்ந்த நபர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: அவர்கள்...போது
  rationale: முந்தைய வாக்குறுதியின் சூழலையோ காரணத்தையோ அறிமுகப்படுத்துகிறது. தமிழில் காலச்சூழலை இயல்பாகத் தெரிவிக்க ‘போது’ பயன்படுத்தப்பட்டது; காரண நிழலும் சூழலால் உணரப்படுகிறது.
- source_word: הִשְׁפִּילוּ
  choice: அவர்கள் தாழ்த்தப்படும்போது
  rationale: שׁפל என்ற வேர்ச்சொல் தாழ்த்தப்படுதல் அல்லது தாழ்ந்த நிலைக்கு வருதல் என்ற பொருளைத் தருகிறது. தன்னைத்தானே தாழ்த்திக்கொள்வதாக விளக்காமல், பன்மைச் செயப்படுபொருள் நிலை பாதுகாக்கப்பட்டது.
- source_word: וַתֹּאמֶר
  choice: நீ...சொல்வாய்
  rationale: எலிப்பாஸ் ஒருமை முன்னிலையிலுள்ள நபரிடம் பேசுகிறார். தொடர்ச்சியான வாக்குறுதி/விளைவு சூழலுக்கு எதிர்கால வடிவம் தமிழில் இயல்பானது.
- source_word: גֵּוָה
  choice: “உயர்வு!”
  rationale: இது கடினமான, விடுபட்ட கூறுகளைக் கொண்ட பெயர்ச்சொல் வாக்கியம். ‘தாழ்த்தப்படுதல்’ என்பதற்கு எதிரான உயர்த்தப்படுதல் அல்லது மேன்மை நிலையைச் சுருக்கமான அறிவிப்பாகக் காட்டுகிறது; எபிரெயத்தில் இல்லாத பன்மைச் செயப்படுபொருளை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְשַׁח עֵינַיִם
  choice: தாழ்ந்த கண்களுள்ளவனை
  rationale: சொல்லுக்குச் சொல் ‘கண்களில் தாழ்ந்தவன்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. இது பணிவான அல்லது மனந்தளர்ந்த நபரைக் குறிக்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יוֹשִׁעַ
  choice: அவர் காப்பாற்றுவார்
  rationale: ישׁע என்பது காப்பாற்றுதல் அல்லது விடுவித்தல். வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; சூழலில் மறைமுக எழுவாய் கடவுள். எபிரெய உரையைப் போல பெயரை வெளிப்படையாகச் சேர்க்காமல் மரியாதை ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יוֹשִׁעַ என்பதன் எழுவாய்
  choice: கடவுளைக் குறிக்கும் மறைமுக எழுவாயாக ‘அவர் காப்பாற்றுவார்’
  alternative: ‘ஒருவன் காப்பாற்றுவான்’ என்ற பொதுவான எழுவாய் அல்லது முன்னிலையிலுள்ள நபரே எழுவாய் என ‘நீ காப்பாற்றுவாய்’
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமை; சூழலில் காப்பாற்றுபவர் கடவுள். எனினும் மூலத்தில் ‘கடவுள்’ என்ற பெயர் இல்லாததால் அதை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- issue: கடினமான גֵּוָה கூறின் பொருள்
  choice: உயர்த்தப்படுதலை அறிவிக்கும் சுருக்கமான ‘உயர்வு!’
  alternative: ‘உயர்த்துதல் உண்டு!’, ‘அவர்களை உயர்த்தும்!’, அல்லது எதிர்மறையான ‘பெருமை’
  rationale: உடனுள்ள ‘தாழ்த்தப்படுதல்’ என்பதோடு காணப்படும் எதிர்மறை இணைவு, எதிர்மறையான அகந்தையைவிட நேர்மறையான உயர்வைக் குறிக்கிறது. பெயர்ச்சொல் வடிவத்தையும் மூலத்தின் சுருக்கத்தையும் காக்க ‘உயர்வு!’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. கடினமான எபிரெயக் கூறின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரையில் தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
