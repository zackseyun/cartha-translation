  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: ta
  text: தேவன் வானத்தின் உயரத்தில்[a] இருக்கிறார் அல்லவா? மிக உயர்ந்த நட்சத்திரங்களைப்[b] பார்; அவை எவ்வளவு உயரத்தில் இருக்கின்றன!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானங்களின் உயரங்களில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல், ‘வானத்தின் உயரம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘நட்சத்திரங்களின் தலை/உச்சி’; இதன் பொருள் ‘மிக உயர்ந்த நட்சத்திரங்கள்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவை இயல்பான நவீனத் தமிழில் காக்கிறது; ‘நிச்சயமாக’ என மாற்றி வலியுறுத்தலைக் கூட்டவில்லை.
- source_word: אֱלוֹהַּ
  choice: தேவன்
  rationale: ஒருமையில் கடவுளைக் குறிக்கும் வழக்கமான சொல்லுக்கு ஏற்ற, கண்ணியமான தமிழ் இணை.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: வானத்தின் உயரத்தில்
  rationale: ‘வானத்தின் உயரம்’ என்ற எபிரெயக் கட்டமைப்பையும் அதன் இடஞ்சார்ந்த படிமத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּרְאֵה
  choice: பார்
  rationale: ראה என்பதன் கட்டளை வலிமையை நேரடியாகக் காட்டுகிறது. தமிழில் புதிய வாக்கியத் தொடக்கத்தில் இணைப்புச் சொல்லை வெளிப்படையாக இடாமல் இருப்பது இயல்பானது.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: நட்சத்திரங்களின் உச்சி
  rationale: רֹאשׁ என்பதன் ‘தலை/உச்சி’ என்ற உருவகத்தைத் தக்கவைக்கிறது; இதை ‘மிக உயர்ந்த நட்சத்திரங்கள்’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: כִּי
  choice: எவ்வளவு
  rationale: இங்கு நட்சத்திரங்களின் உயரத்தை வியப்புடன் சுட்டும் கூறாகப் புரிந்து, தமிழில் இயல்பான வியப்புத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: רָמּוּ
  choice: உயரமாயிருக்கின்றன
  rationale: ரום என்பதன் இடஞ்சார்ந்த ‘உயர்ந்திருத்தல்’ என்ற பொருளைக் காக்கிறது; மரியாதை அல்லது மேன்மை என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இவ்வசனம் தேவனுடைய உயர்வை வெறும் இடஞ்சார்ந்த கூற்றாகக் கூறுகிறதா, அல்லது எலிப்பாசின் உரையிலுள்ள சொல்லாட்சிவினாவாக முன்வைக்கிறதா?
  choice: இடஞ்சார்ந்த படிமத்துடன் கூடிய சொல்லாட்சிவினாவாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: தேவன் தொலைவில் இருப்பதாக விரித்துரைத்தல் அல்லது யோபுக்கு எதிரான இறையியல் முடிவை வசனத்திற்குள் சேர்த்தல்.
  rationale: இது எலிப்பாசின் உரையின் ஒரு பகுதி. எபிரெய உரை தேவனின் உயர்ந்த இருப்பிடத்தையும் நட்சத்திரங்களின் உயரத்தையும் சுட்டுகிறது; அதற்கு அப்பாற்பட்ட இறையியல் முடிவை மொழிபெயர்ப்பு சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. சொல்லாட்சிவினா ‘அல்லவா?’ என்றும், வியப்புக் கூறு ‘எவ்வளவு உயரமாயிருக்கின்றன!’ என்றும் இயல்பாக அமைக்கப்பட்டுள்ளன; எபிரெய மூலத்தின் உருவகம் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
