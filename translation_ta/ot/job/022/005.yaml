base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: ta
  text: உன் தீமை மிகுதியாய் இருக்கிறதல்லவா?[a] உன் அக்கிரமங்களுக்கு முடிவே இல்லையே![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் துஷ்டத்தனம்.” இங்குள்ள எபிரெயச் சொல் சில சூழல்களில் “துன்பம்” என்றும் பொருள்படும்; ஆனால் “உன் அக்கிரமங்கள்” என்ற இணைச்சொல் இங்கே ஒழுக்கத் தீமையையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் அக்கிரமங்களுக்கு வரம்பே இல்லையே!”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான ஆம் பதிலை எதிர்பார்க்கும் குற்றஞ்சாட்டும் வினாவாக இருப்பதால், எபிரெய உரையின் வினாத்தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: רָעָתְךָ
  choice: உன் தீமை
  rationale: רעה என்பதன் பரந்த அறச்சார்ந்த பொருளைக் காக்கிறது; இணையாக வரும் ‘உன் அக்கிரமங்கள்’ என்பதால் இங்கே ‘துன்பம்’ அல்லது ‘பேரிடர்’ என்ற பொருள் பொருந்தாது.
- source_word: רַבָּה
  choice: மிகுதியாயிருக்கிறது
  rationale: தீமையின் பெருமளவைச் சுட்டுகிறது; ஒருமைத் தொகுப்புப்பொருளுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: וְאֵין
  choice: இல்லையே
  rationale: இரண்டாம் அரையடியின் மறுப்பை வலியுறுத்தி, எலிப்பாசின் குற்றச்சாட்டுத் தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קֵץ
  choice: முடிவு
  rationale: அடிப்படைப் பொருளான ‘முடிவு’ என்பதைக் காக்கிறது; இச்சூழலில் ‘வரம்பு’ என்பதும் சாத்தியம்.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: உன் அக்கிரமங்களுக்கு
  rationale: עון என்பதிலுள்ள கடுமையான அறக்குற்றப் பொருளை ‘அக்கிரமங்கள்’ வெளிப்படுத்துகிறது; ל முன்னொட்டு ‘...க்கு முடிவு இல்லை’ என்ற தமிழ் அமைப்பில் இயல்பாகக் காட்டப்படுகிறது.
theological_decisions:
- issue: רָעָתְךָ என்பது அறத்தீமையா அல்லது துன்பமா?
  choice: அறத்தீமை
  alternative: துன்பம் / பேரிடர்
  rationale: அடுத்த அரையடியில் வரும் ‘உன் அக்கிரமங்கள்’ என்ற இணைச்சொல், எலிப்பாஸ் யோபின் துன்பத்தை விவரிக்காமல் அவனை அறக்குற்றம் செய்ததாகக் குற்றஞ்சாட்டுகிறான் என்பதைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஆனால் கண்ணியமான குற்றச்சாட்டுத் தொனி பயன்படுத்தப்பட்டுள்ளது. முதல் அரையடியின் சொல்லாட்சிசார் மாற்று [a] அங்கேயே குறிக்கப்பட்டுள்ளது; ‘முடிவு/வரம்பு’ மாற்று இரண்டாம் அரையடியில் [b] எனக் குறிக்கப்பட்டுள்ளது. எபிரெய வினா முதல் அரையடியில் காக்கப்பட்டு, இரண்டாம் அரையடி தமிழில் இயல்பான வலியுறுத்தல் வாக்கியமாக வழங்கப்பட்டுள்ளது.
