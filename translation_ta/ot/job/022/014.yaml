source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: ta
  text: அடர்ந்த மேகங்கள் அவருக்கு மூடுதிரையாக உள்ளன; அவர் பார்ப்பதில்லை; வானத்தின் வளைவின்மேல் அவர் நடமாடுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மேகங்கள் அவருக்கு மறைவாக உள்ளன; அவர் பார்ப்பதில்லை; வானங்களின் வட்டத்தில் அவர் உலாவுகிறார்.”'
    reason: עָבִים (‘மேகங்கள்’/‘அடர்ந்த மேகங்கள்’), סֵתֶר (‘மூடுதிரை’/‘மறைவு’), חוּג (‘வளைவு’/‘வட்டம்’), யִתְהַלָּךְ (‘நடமாடுகிறார்’/‘உலாவுகிறார்’) ஆகியவற்றுக்கான இயல்பான மாற்றுகளையும், வாக்கியங்களின் இணைநிலைத் தொடர்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: עָבִים
  choice: திரள்மேகங்கள்
  rationale: இப்பன்மைப் பெயர்ச்சொல் அடர்ந்த மழைமேகங்களையும் குறிக்கக்கூடும். பார்வையை மறைக்கும் மேகங்களின் தன்மையை இயல்பான தமிழில் தெளிவாக எடுத்துரைக்க ‘திரள்மேகங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: סֵתֶר
  choice: மறைவு
  rationale: மூடுதல், மறைத்தல், மறைவிடம் ஆகிய பொருள்கள் உள்ளன. இங்கு மேகங்கள் பார்வையைத் தடுக்கும் திரையாகச் செயல்படுவதால் ‘மறைவு’ பொருத்தமானது.
- source_word: לוֹ
  choice: அவருக்கு
  rationale: மேகங்கள் அவரைப் பொறுத்தவரை மறைவாக உள்ளன என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא יִרְאֶה
  choice: அவர் பார்ப்பதில்லை
  rationale: வாவ் இணைப்பின் நேரடியான இணைநிலைப் பொருளைப் பாதுகாக்கிறது; முன்னுள்ள மறைவு காரணம் அல்லது விளைவு என்ற தொடர்பை வாசகர் உணர முடியும், ஆனால் மொழிபெயர்ப்பு அதைத் திட்டவட்டமாக்கவில்லை.
- source_word: חוּג
  choice: வளைவு
  rationale: வட்டம் அல்லது வளைந்த பரப்பு என்ற பண்டைய விண்வெளிப் படிமத்தைப் பாதுகாக்கிறது; ‘வானங்களின் வளைவு’ என்பது குறிப்பிட்ட அறிவியல் அமைப்பைத் திணிக்காமல் அந்த உருவகத்தை அளிக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெய வடிவத்தையும் உயர்ந்த நடையையும் பிரதிபலிப்பதோடு, இங்கு விண்ணுலகப் பரப்பைக் குறிக்கிறது.
- source_word: יִתְהַלָּךְ
  choice: உலாவுகிறார்
  rationale: ஹித்பயேல் வடிவம் அங்குமிங்கும் நடப்பது அல்லது சுற்றித் திரிவது என்ற நுணுக்கத்தைக் கொண்டது. ‘உலாவுகிறார்’ அந்த இயக்கப் படிமத்தை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பேசுபவரின் பார்வையும் மறைமுக எழுவாயும்
  choice: ‘அவர்’ என்ற சுட்டுப்பெயரை வைத்தே, எலிப்பாஸ் தீயோருக்குச் சாட்டும் கடவுளைப் பற்றிய கூற்றின் தொடர்ச்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள்’ என்று எழுவாயை வெளிப்படையாகச் சேர்ப்பது அல்லது இதை அவரது கடந்துநிற்கும் தன்மையைப் பற்றிய நடுநிலைக் கூற்றாக வழங்குவது.
  rationale: யோபு 22:13–14 சூழலில் இது எலிப்பாஸ் மற்றவர்களுக்குச் சாட்டும் எண்ணத்தைத் தொடர்கிறது. மூலத்தில் இல்லாத ‘கடவுள்’ என்பதைச் சேர்க்காமல் இருப்பது உரையாடல் ஓட்டத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: மறைவுக்கும் பாராமைக்கும் இடையிலான தொடர்பு
  choice: ‘அவர் பார்ப்பதில்லை’ என்று இணைநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அதனால் அவர் பார்ப்பதில்லை’ அல்லது ‘அவர் பார்க்க முடியாதபடி’ என்று விளைவு அல்லது நோக்கத் தொடர்பை வெளிப்படையாக்குவது.
  rationale: וְ என்பது எளிய இணைப்பாகவும் சூழலில் விளைவைக் குறிப்பதாகவும் புரியலாம். எபிரெயத்தின் உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை ‘அவர்’ சூழலில் கடவுளைக் குறிக்கும் சுட்டுப்பெயராக இயல்பாக உள்ளது. மூலத்தின் இணைநிலை அமைப்பும் வானியல் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
