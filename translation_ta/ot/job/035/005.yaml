  text: הַבֵּ֣ט שָׁמַ֣יִם וּ/רְאֵ֑ה וְ/שׁ֥וּר שְׁ֝חָקִ֗ים גָּבְה֥וּ מִמֶּֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: ta
  text: வானங்களைப் பார், கவனி; மேகங்களை உற்றுநோக்கு—அவை உன்னைவிட உயரமானவை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט ... וּרְאֵה
  choice: நோக்கிப் பார்
  rationale: இரு இணைந்த பார்வை வினைகளின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וְשׁוּר
  choice: உற்றுப் பார்
  rationale: வெறுமனே பார்ப்பதைவிடக் கவனமாக நோக்கும் பொருளைத் தருகிறது; முதல் கட்டளையோடு உள்ள முன்னேற்றத்தையும் காக்கிறது.
- source_word: שְׁחָקִים
  choice: மேகங்கள்
  rationale: இச்சூழலில் உயரத்தில் காணப்படும் மேகங்களைச் சுட்டுகிறது; கவிதைநடையின் இணைப்புக்கு ஏற்ற தெளிவான நவீனச் சொல்.
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: அவை உன்னைவிட உயரத்தில் இருக்கின்றன
  rationale: ஒப்பீட்டையும் உடல்சார் உயரத்தையும் தெளிவாகக் காக்கிறது; தமிழில் இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: வானங்களும் மேகங்களும் குறிப்பிடப்படுவதன் நோக்கம்
  choice: உரை கூறும் உடல்சார் உயர ஒப்பீட்டை மட்டும் மொழிபெயர்த்தல்
  alternative: இறைவனுடைய உயர்வை நேரடியாக விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் உருவகத்தின் முடிவைத் தானாக வெளிப்படையாகச் சொல்லவில்லை; அடுத்துவரும் வாதத்தை மொழிபெயர்ப்பாளர் முன்கூட்டியே விளக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடி கட்டளைநடை, கவிதைத் தாளம், மரியாதைத் தொனியுடன். ஒருமை இரண்டாம் நபர் ‘உன்னை’ மூலத்தின் எண்ணிக்கையைப் பேணுகிறது.
