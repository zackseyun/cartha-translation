review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the heavenly objects, the second imperative, and the comparison. However, it compresses הַבֵּט ... וּרְאֵה (“look ... and see/consider”) into one Tamil command, losing the source’s paired verbal emphasis. “உயரத்தில் இருக்கின்றன” is understandable but presents location rather than the direct comparative predicate “are higher than you.”
  naturalness: The present Tamil is clear and idiomatic. The revision retains modern standard Tamil and a concise poetic imperative rhythm while representing both initial commands more fully.
  terminology: “மேகங்கள்” follows the English POB audit trail for שְׁחָקִים and is acceptable in this context. “உன்னைவிட உயரமானவை” directly and naturally renders גָּבְהוּ מִמֶּךָּ.
  issues:
  - severity: medium
    issue: The paired imperative הַבֵּט ... וּרְאֵה is reduced to a single command.
    rationale: “வானங்களை நோக்கிப் பார்” renders “look at the heavens,” but does not also represent “and see.” Adding “கவனி” preserves the rhetorical call to look attentively without unnatural repetition.
  - severity: low
    issue: “அவை உன்னைவிட உயரத்தில் இருக்கின்றன” weakens the predicate comparison.
    rationale: The Hebrew says that the clouds/skies “are higher than you,” rather than merely that they are situated at a height. “உன்னைவிட உயரமானவை” states the comparison directly.
  revised_text: வானங்களைப் பார், கவனி; மேகங்களை உற்றுநோக்கு—அவை உன்னைவிட உயரமானவை.
  revised_footnotes: []
  revision_rationale: The revision preserves the twofold initial exhortation, retains the distinct attentive gaze at the clouds, and gives the final comparative clause its direct force. No footnote is needed, since the rendering does not resolve a disputed textual or theological ambiguity.
