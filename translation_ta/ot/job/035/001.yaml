- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினை இவ்வுரையாடல் சூழலில் முந்தைய பேச்சுக்குப் பதிலளிப்பதைக் குறிக்கிறது. ‘மறுமொழியாக’ என்பது எபிரெய உரையாடல் சூத்திரத்தின் பதிலுரை நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלִיהוּ
  choice: எலிகூ
  rationale: எபிரெய தனிப்பெயரான אֱלִיהוּ தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவமான ‘எலிகூ’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பது பொதுவான பேச்சு வினை. ‘சொன்னது’ அடுத்துவரும் நேரடி உரையை இயல்பாக அறிமுகப்படுத்துகிறது; ‘மறுமொழியாகச் சொன்னது’ என்பது וַיַּעַן ... וַיֹּאמַר என்ற எபிரெய இணைப்பைச் சுருக்காமல் வெளிப்படுத்துகிறது.
