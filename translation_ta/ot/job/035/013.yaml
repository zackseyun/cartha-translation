id: JOB.35.13
reference: Job 35:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: ta
  text: 'உண்மையாகவே, வெறுமையை[a] இறைவன் கேட்பதில்லை;

    சர்வவல்லவர் அதைக் கவனிப்பதில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீண் தன்மை,’ ‘பொய்’ அல்லது ‘பயனின்மை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறுமையான, வீணான அல்லது ஏமாற்றுகிற ஒன்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: உண்மையாகவே
  rationale: இங்கு இந்த இடைச்சொல் எலிகூவின் முடிவை வலியுறுத்துகிறது; கட்டுப்படுத்தும் பொருளைக் காட்டிலும் உறுதிப்படுத்தும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁוְא
  choice: வெறுமை
  rationale: இந்தச் சொல் வெறுமை, வீண் தன்மை, பொய் அல்லது பயனின்மை ஆகிய பொருட்களைத் தரலாம். குறிப்பாக ‘வெற்று முறையீடு’ என்று விளக்கிவிடாமல், எபிரெயச் சொல்லின் கருத்து அகலத்தையும் அருவப் பெயர்ச்சொல் வடிவையும் ‘வெறுமை’ காக்கிறது.
- source_word: יִשְׁמַע
  choice: கேட்பதில்லை
  rationale: சூழலில் இது ஒரு பொதுவான கூற்றை வெளிப்படுத்துகிறது. שׁמע என்பதன் நேரடியான பொருளையும் தமிழ் இணைவாக்கியத்தின் இயல்பையும் இத்தேர்வு காக்கிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: אֵל என்பது பொதுவான தெய்வப் பட்டப்பெயர்; இங்கு தேவையற்ற கூடுதல் வலிமைப் பொருளைச் சேர்க்காமல் இயல்பான உயர்நடைத் தமிழில் வழங்கப்படுகிறது.
- source_word: וְשַׁדַּי
  choice: சர்வவல்லவர்
  rationale: שַׁדַּי என்ற தெய்வப் பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான பொருளில் மொழிபெயர்க்கிறது; யோபு நூலுக்கேற்ற மரியாதை நடையையும் காக்கிறது.
- source_word: יְשׁוּרֶנָּה
  choice: அதைக் கவனிப்பதில்லை
  rationale: שׁוּר என்பதன் ‘பார்த்தல், நோக்குதல், பொருட்படுத்துதல்’ என்ற பொருள்களில், ‘கவனித்தல்’ என்பது முதல் வரியின் ‘கேட்டல்’ என்பதுடன் இணையாக அக்கறையோடு நோக்குதலை இயல்பாகத் தெரிவிக்கிறது. ‘அதை’ என்பது שָׁוְא-ஐச் சுட்டுகிறது.
theological_decisions:
- issue: எலிகூவின் கூற்றில் שָׁוְא எதைக் குறிக்கிறது
  choice: வெறுமையான, வீணான அல்லது உண்மையற்ற ஒன்றை இறைவன் கேட்பதில்லை என்ற பரந்த கூற்றாக வைத்தல்
  alternative: அதைத் திட்டவட்டமாக ‘வெற்று கூக்குரல்,’ ‘பொய்,’ அல்லது ‘பெருமைப் பேச்சு’ என்று குறுக்குதல்
  rationale: எபிரெயச் சொல் எதைக் குறிப்பாகச் சுட்டுகிறது என்பதை இவ்வசனம் முற்றிலும் நிர்ணயிக்கவில்லை. ‘வெறுமை’ என்ற மொழிபெயர்ப்பு, இது இறைவனின் அறியாமையைப் பற்றிய கூற்று என்று விளக்காமலும், ஒரு குறிப்பிட்ட வகை ஜெபத்தை மட்டும் குறிக்கிறது என்று தீர்மானிக்காமலும் மூலத்தின் இறையியல் நெருக்கடியையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவாக்கிய அமைப்பு இரண்டு வரிகளாகக் காக்கப்பட்டுள்ளது; ‘வெறுமை’ என்ற அருவச் சொல் அடிக்குறிப்புடன் வைக்கப்பட்டு மூலத்தின் பல்பொருள் தன்மை பாதுகாக்கப்பட்டுள்ளது.
