source:
  edition: WLC
  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: ta
  text: “என் நீதி கடவுளுடைய நீதியைவிட மேலானது” என்று நீ சொல்வதை நியாயமானது என்று நினைக்கிறாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நீதி கடவுளுக்கு முன்பாக உள்ளது,” அல்லது “என் உரிமை கடவுளிடமிருந்து வருகிறது.” எபிரெய வாசகம் சுருக்கமாக உள்ளது; ‘என் நீதி’ என்பதற்கும் ‘கடவுள்’ என்பதற்கும் இடையிலான தொடர்பு குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: இது … என்று நீ நினைக்கிறாயா?
  rationale: வினாவிடைத் துகள், சுட்டுப்பெயர், ‘நினை/கருது’ என்ற வினை ஆகியவற்றை இயல்பான தமிழ் வினாவாக இணைத்து, எலிகூவின் சொல்லாட்சியிலுள்ள கண்டிக்கும் தொனியைத் தக்கவைக்கிறது.
- source_word: לְמִשְׁפָּט
  choice: நியாயம்
  rationale: מִשְׁפָּט என்பதன் நீதி, தீர்ப்பு, உரிமை சார்ந்த பொருள்களில், இங்கு ஒரு கூற்று சரியானதா அல்லது நியாயமானதா என்ற மதிப்பீட்டை ‘நியாயம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָמַרְתָּ
  choice: நீ சொல்கிறாயே
  rationale: எபிரெய வடிவம் நிறைவுற்ற செயலைக் குறித்தாலும், இங்கு யோபுவின் நிலைப்பாட்டை நிகழ் பொருத்தத்துடன் மேற்கோள் காட்டுகிறது. ‘சொல்கிறாயே’ என்பது குற்றஞ்சாட்டும் உரையாடல் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: צִדְקִי
  choice: என் நீதி
  rationale: צדק வேரின் அறநெறி மற்றும் நீதிமன்றச் சார்ந்த பொருள் பரப்பைத் தக்கவைத்து, யோபு உரிமைகோரும் நேர்மை அல்லது நீதியான நிலையைச் சுட்டுகிறது.
- source_word: מֵאֵל
  choice: கடவுளுடைய நீதியைவிட மேலானது
  rationale: מִן என்பதை ஒப்பீட்டுப் பொருளில் எடுத்துக்கொண்டு, தமிழில் ஒப்பிடப்படும் அம்சத்தைத் தெளிவாக்க ‘கடவுளுடைய நீதி’ என்று வழங்கப்பட்டுள்ளது. மூலத்தின் சுருக்கத்தால் பிற வாசிப்புகளும் சாத்தியம் என்பதால் அவை அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: எலிகூ சுருக்கிக் கூறும் யோபுவின் கூற்றில் צִדְקִי மற்றும் מֵאֵל ஆகியவற்றின் தொடர்பு
  choice: 'ஒப்பீட்டு வாசிப்பு: ‘என் நீதி கடவுளுடைய நீதியைவிட மேலானது’'
  alternative: ‘கடவுளுக்கு முன்பாக நான் நீதிமான்’ அல்லது ‘என் நியாயமான உரிமை கடவுளிடமிருந்து வருகிறது’
  rationale: மூல எபிரெயம் மிகவும் சுருக்கமாகவும் இலக்கணத் தொடர்பு விவாதத்திற்குரியதாகவும் உள்ளது. சூழலில் எலிகூ யோபுவின் பேச்சைக் கண்டிப்பதால் ஒப்பீட்டு வாசிப்பு பொருத்தமாக உள்ளது; இருப்பினும் மாற்று வாசிப்புகளை நீக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயம்’ மற்றும் ‘நீதி’ என்ற சொற்கள் முறையே מִשְׁפָּט, צִדְקִי ஆகியவற்றின் வேறுபட்ட ஆனால் தொடர்புடைய சட்ட-அறநெறி நுணுக்கங்களைப் பேணுகின்றன.
