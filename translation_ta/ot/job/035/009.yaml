  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: ta
  text: ஒடுக்குமுறைகள் மிகுந்திருப்பதால் மக்கள் கூக்குரலிடுகிறார்கள்; வலிமைமிக்கவர்களின் புயத்தால்[a] உதவி கேட்டு அழுகிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புயம்’ என்பது வலிமை அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘வலிமைமிக்கவர்களின் புயத்திலிருந்து உதவி கேட்டு அழுகிறார்கள்.’ எபிரெய முன்னிடைச்சொல்லை ‘இருந்து’ என்று நேரடியாகவும் மொழிபெயர்க்கலாம்; இங்கு அது அவர்களுடைய அழுகைக்கான காரணத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: மிகுந்திருப்பதால்
  rationale: מִן உடன் வரும் רֹב இங்கு காரணத்தைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் காரணத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲשׁוּקִים
  choice: ஒடுக்குமுறைகள்
  rationale: இச்சூழலில் இந்தப் பன்மை வடிவம் பல ஒடுக்குதல் செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது; அவற்றின் மிகுதியே மக்களின் கூக்குரலுக்குக் காரணம்.
- source_word: יַזְעִיקוּ
  choice: மக்கள் கூக்குரலிடுகிறார்கள்
  rationale: זעק என்பதன் ஹிஃபில் வடிவம் துயரத்தால் எழுப்பப்படும் உரத்த கூக்குரலைக் குறிக்கிறது. தமிழில் இயல்புக்காக மறைமுக மனித எழுவாய் ‘மக்கள்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְשַׁוְּעוּ
  choice: உதவி கேட்டு அழுகிறார்கள்
  rationale: שוע என்பதன் பிஎல் வடிவம் உதவி வேண்டி மன்றாடுவதைக் குறிக்கிறது; முந்தைய ‘கூக்குரலிடுகிறார்கள்’ என்பதிலிருந்து சிறிது வேறுபாட்டையும் இணைநடையையும் காக்கிறது.
- source_word: מִזְּרֹעַ
  choice: புயத்தால்
  rationale: זְרוֹעַ என்பதன் நேரடிப் பொருளான ‘புயம்’ தக்கவைக்கப்பட்டு, அதிகாரம் அல்லது வலிமை என்ற எபிரெய உருவகம் பாதுகாக்கப்படுகிறது; מִן இங்கு காரணப் பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: רַבִּים
  choice: வலிமைமிக்கவர்கள்
  rationale: இங்கு இது எண்ணிக்கையில் ‘பலர்’ என்பதைவிட சமூக அதிகாரமும் வலிமையும் உடையவர்களைக் குறிக்கிறது.
