  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: ta
  text: ஆனால், “என்னைப் படைத்தவரும் இரவில் பாடல்களைத் தருகிறவருமான கடவுள் எங்கே?” என்று எவரும் கேட்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אָמַר
  choice: ஆனால் எவரும் ... என்று கேட்பதில்லை
  rationale: இணைப்புச்சொல்லும் மறுப்பும் முந்தைய சூழலுடன் முரண்பாட்டைக் காட்டுகின்றன. אָמַר என்பதன் அடிப்படைப் பொருள் ‘சொன்னான்’ என்றாலும், ‘எங்கே?’ என்ற நேரடிக் கேள்வியை அறிமுகப்படுத்துவதால் தமிழில் ‘கேட்பதில்லை’ என்பது இயல்பானது; வினைமுற்று இங்கு பொதுவான, வழக்கமான செயலைக் குறிக்கிறது.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இடம் அல்லது இருப்பைக் குறித்து விசாரிக்கும் கேள்விச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் வரும் ஒருமைத் தெய்வப் பெயருக்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: עֹשָׂי
  choice: என்னைப் படைத்த
  rationale: எபிரெய வடிவம் இலக்கணப்படி பன்மையாக இருந்தாலும், இங்கு ஒரே கடவுளையே குறிக்கிறது. ‘என்னைப் படைத்த கடவுள்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; வடிவிலுள்ள பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נֹתֵן
  choice: தருகிறவர்
  rationale: கடவுளின் வழக்கமான செயலை விவரிக்கும் பெயரெச்ச வினை வடிவத்தை நிகழ்காலத் தொடர்புத் தொடராக வழங்குகிறது.
- source_word: זְמִרוֹת
  choice: பாடல்களை
  rationale: இந்தப் பெயர்ச்சொல் பாடல்களைக் குறிக்கிறது; சூழலில் துதி உட்பொருளாக இருக்கக்கூடியபோதிலும், மூலச்சொல் கட்டாயப்படுத்தாத வழிபாட்டு நுட்பத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: בַּלָּיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயத் தொடரின் சுருக்கமான, கவித்துவம் குன்றாத இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் עֹשָׂי என்பதன் எண்
  choice: 'ஒருமைப் பொருள்: ‘என்னைப் படைத்த கடவுள்’'
  alternative: 'வடிவியல் பன்மை: ‘என்னைப் படைத்தவர்கள்’'
  rationale: சொல் வடிவம் பன்மையாக இருந்தாலும், தொடரிலுள்ள אֱלוֹהַּ ஒருமையாகவும் குறிக்கப்படும் நபர் ஒரே கடவுளாகவும் உள்ளார். தமிழில் பன்மையாக மொழிபெயர்ப்பது பல படைப்பாளர்கள் என்ற தவறான எண்ணத்தை உண்டாக்கலாம்; ஆகவே ஒருமைப் பொருள் முதன்மை உரையில் தரப்பட்டு, மூலத்தின் பன்மை வடிவம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒரே ‘எங்கே?’ கேள்விக்குள் இரு விளக்கத் தொடர்களையும் நெருக்குவது தமிழில் சற்றுக் கடினமாக இருப்பதால், கடவுளையும் அவருடைய செயலையும் இணையாக வலியுறுத்த இரண்டு ‘எங்கே?’ கேள்விகளாக அமைக்கப்பட்டுள்ளது; பொருள் மாற்றப்படவில்லை.
