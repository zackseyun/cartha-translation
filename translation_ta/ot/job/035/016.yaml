base_translation:
  language: en
  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: ta
  text: எனவே, யோபு வீணாகத் தன் வாயைத் திறக்கிறார்[a]; அறிவில்லாமல் சொற்களைப் பெருக்குகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெறுமையோடு’ அல்லது ‘வீண் தன்மையோடு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல்லான הֶבֶל மூச்சு, நீராவி, வெறுமை அல்லது வீண் தன்மை ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: எனவே, யோபு
  rationale: וְ இங்கு முந்தைய கருத்திலிருந்து வரும் முடிவை இணைக்கிறது; சூழலில் அதன் ஊகமுடிவு சார்ந்த வலிமையை இயல்பான தமிழில் ‘எனவே’ வெளிப்படுத்துகிறது.
- source_word: הֶבֶל
  choice: வீணாக
  rationale: הֶבֶל என்பதன் அடிப்படைப் பொருள் மூச்சு, நீராவி, வெறுமை, நிலையாமை அல்லது வீண் தன்மை. இங்கு அது யோபு வாயைத் திறந்து பேசுவதன் தன்மையை வினையடைபோல் விவரிப்பதால், ‘வீணாக’ என்பது இயல்பான தமிழில் பொருளைத் தருகிறது; அதன் உருவகப் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יִפְצֶה פִּיהוּ
  choice: தன் வாயைத் திறக்கிறார்
  rationale: פצה פה என்பது பேசத் தொடங்குவதைக் குறிக்கும் ‘வாயைத் திற’ என்ற எபிரெய மரபுத்தொடர். இதை நேரடியாகத் தமிழிலும் இயல்பாக வழங்க முடிகிறது.
- source_word: בִּבְלִי דַעַת
  choice: அறிவில்லாமல்
  rationale: בִּבְלִי என்பது இல்லாமையையும் דַעַת என்பது அறிவையும் குறிக்கின்றன. ‘அறிவில்லாமல்’ என்பது குற்றச்சாட்டின் நேரடியான வலிமையைப் பாதுகாக்கிறது.
- source_word: מִלִּין
  choice: சொற்களை
  rationale: அரமேயத் தாக்கமுள்ள இந்தப் பன்மை வடிவம் ‘சொற்கள்’ அல்லது ‘உரைகள்’ எனப் பொருள்படும்; இங்கு ‘சொற்கள்’ எளிமையானதும் துல்லியமானதும் ஆகும்.
- source_word: יַכְבִּר
  choice: பெருக்குகிறார்
  rationale: כבר என்பதன் ஹிஃபில் வடிவம் மிகுதியாக்குதல் அல்லது அதிகரித்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. ‘சொற்களைப் பெருக்குகிறார்’ என்பது அந்த வடிவத்தையும் எபிரெயச் சொற்றொடரையும் நெருக்கமாகப் பாதுகாக்கிறது.
