translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சொற்களால்’ என்பது மூலத்தின் வெளிப்படையான מִלִּין கூறைத் தக்கவைக்கிறது; இரண்டாம் பகுதியில் தமிழின் இயல்புக்காக ‘பதிலளிப்பேன்’ மீண்டும் வழங்கப்பட்டுள்ளது.
