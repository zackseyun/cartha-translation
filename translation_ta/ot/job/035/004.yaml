  yaml_path: translation/ot/job/035/004.yaml
  text: I will answer you with words[a], and your friends with you.
translation:
  language: ta
  text: நான் உனக்குச் சொற்களால் பதிலளிப்பேன்[a]; உன்னோடு உன் நண்பர்களுக்கும் பதிலளிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உனக்கும், உன்னோடு உன் நண்பர்களுக்கும் பதிலளிப்பேன்.” எபிரெய வினைச்சொல் ‘மறுமொழி கூறுதல்’ என்ற பொருளையும் தரலாம்; எலிகூ யோபையும் அவனுடைய நண்பர்களையும் சேர்த்து நோக்கிப் பேசுவதாக இவ்வரியைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: நான்
  rationale: எபிரெய மொழியில் வலியுறுத்தலுடன் வெளிப்படையாக உள்ள முதலாம் நபர் ஒருமைப் பெயர்ச்சொல்லைத் தக்கவைக்கிறது.
- source_word: אֲשִׁיבְךָ
  choice: உனக்குப் பதிலளிப்பேன்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ‘மறுமொழி கூறுதல், பதிலளித்தல்’ என்ற இடியோமாட்டிக் பொருளைக் கொண்டுள்ளது; நவீன தமிழில் இயல்பாக இதுவே அமைகிறது.
- source_word: מִלִּין
  choice: சொற்களால்
  rationale: ‘சொற்கள்/பேச்சு’ எனப் பொருள்படும் இச்சொல்லின் கருவிப்பொருளை வெளிப்படையாகக் காத்து, ‘என் வாதத்தை முன்வைப்பேன்’ போன்ற விரிவுரையைத் தவிர்க்கிறது.
- source_word: וְאֶת
  choice: …க்கும்
  rationale: இணைப்புச் சொல்லையும் நேரடி செயப்படுபொருள் குறியீட்டையும் தமிழில் கூடுதல் இலக்காகக் காட்டும் ‘…க்கும்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֵעֶיךָ
  choice: உன் நண்பர்கள்
  rationale: רֵעַ என்பதன் ‘நண்பர், தோழர்’ என்ற உறவுசார் பொருளைச் சூழலுக்கேற்ற பொதுவான தமிழில் தருகிறது.
- source_word: עִמָּךְ
  choice: உன்னோடு இருக்கும்
  rationale: உடனிருத்தலைக் குறிக்கும் עִם என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, நண்பர்கள் யோபுடன் சேர்ந்து பதிலைப் பெறுவதைத் தெளிவாக்குகிறது.
