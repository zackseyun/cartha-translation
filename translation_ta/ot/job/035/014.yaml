- from: 14 அப்படியிருக்க, “நீ அவரைக் காண்பதில்லை” என்று சொல்லும்போது, அவர் கேட்பது இன்னும் எவ்வளவு அரிது! உன் வழக்கு அவர் முன்னிலையில் இருக்கிறது; எனவே, அவருக்காக எதிர்பார்த்துக் காத்திரு.[a]
