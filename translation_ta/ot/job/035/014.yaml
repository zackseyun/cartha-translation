base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: ta
  text: 14 அப்படியிருக்கையில், “நீ அவரைக் காண்பதில்லை” என்று நீ சொன்னாலும், வழக்கு அவர் முன்னிலையில் இருக்கிறது; அவருக்காகக் காத்திரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொற்பொருளுக்கு இன்னும் நெருக்கமாக, “அவர் முன்னிலையில் துடித்துக்கொண்டிரு.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் கடினமானது; பலர் இதை “அவருக்காகக் காத்திரு” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: அப்படியிருக்க … இன்னும் எவ்வளவு அரிது
  rationale: முந்தைய வசனத்தில் வரும் ‘கேட்பதில்லை’ என்ற கருத்தை இவ்விடத்தில் உள்ள எபிரெயச் சொற்றொடர் மறைமுகமாகத் தொடர்கிறது. ஆகவே, வாதத்தின் ‘எவ்வளவு குறைவாக’ என்ற வலிமையை இயல்பான தமிழில் வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: תֹאמַר
  choice: நீ … என்று சொல்லும்போது
  rationale: இது யோபுவை நோக்கிய இரண்டாம் நபர் ஒருமைச் சொல்; கூடுதல் விளக்கம் சேர்க்காமல் அதன் எளிய பேச்சுச் செயல் காக்கப்படுகிறது.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: நீ அவரைக் காண்பதில்லை
  rationale: שׁוּר என்பது ‘பார், கண்டு உணர்’ எனப் பொருள்படலாம். இங்கு கடவுள் தன்னைக் காணவில்லை என்பதல்ல, யோபுவால் கடவுளைக் காண முடியவில்லை என்ற முறையீடாகப் புரிந்துகொள்வது சூழலுடன் பொருந்துகிறது.
- source_word: דִּין
  choice: உன் வழக்கு
  rationale: இங்கு இச்சொல் பொதுவான ‘நீதி’ என்பதைவிட தீர்ப்புக்காக முன்வைக்கப்பட்ட சட்டவழக்கு அல்லது நியாயவாதத்தைக் குறிக்கிறது. உடைமை உருபு மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், யோபுவின் வழக்கே குறிக்கப்படுவதால் தமிழில் இயல்புக்காக ‘உன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: வழக்கு கடவுளின் தீர்ப்புக்காக அவருக்கு முன் இருப்பதைச் சுட்டும் வழக்கமான எபிரெயச் சொற்றொடர்.
- source_word: וּתְחוֹלֵל לוֹ
  choice: அவருக்காக எதிர்பார்த்துக் காத்திரு
  rationale: חוּל என்ற அரிதான வினை இங்கு கடவுளின் செயலுக்காக எதிர்பார்ப்புடன் காத்திருப்பதாகச் சூழலின் அடிப்படையில் கொள்ளப்படுகிறது. அதன் ‘துடி/நெளி’ என்ற நேரடியான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கடவுள் மறைந்திருப்பதும் நீதிவழக்கு அவர் முன் இருப்பதும்
  choice: கடவுளைத் தற்போது காண முடியவில்லை என்று யோபு சொன்னாலும், அவனுடைய வழக்கு கடவுள் முன் இருப்பதால் அவருக்காகக் காத்திருக்க வேண்டும் என்று எலிகூ கூறுகிறான்.
  alternative: கடவுள் அந்த வழக்கைக் காணவில்லை என்று எலிகூ கூறுகிறான்.
  rationale: சொல்லின் நபர் அமைப்பும் விரிந்த சூழலும் காண முடியாதவர் யோபு என்பதையே ஆதரிக்கின்றன; கடவுள் அறியாதவர் என்ற கருத்தை இவ்வசனம் முன்வைப்பதில்லை.
- issue: இறுதி வினைச்சொல்லின் பொருள்
  choice: எதிர்பார்த்துக் காத்திரு
  alternative: அவர் முன்னிலையில் துடித்துக்கொண்டிரு / நெளிந்துகொண்டிரு
  rationale: சட்டவழக்கு கடவுள் முன் உள்ளது என்ற முந்தைய கூற்றைத் தொடர்ந்து, அவர் செயல்படுவதற்காகக் காத்திருக்கும் அறிவுறுத்தல் சூழலுக்கு ஏற்றது. எனினும் எபிரெய வினையின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் மறைமுக வினை தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது; அரிதான இறுதி வினையின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
