  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: ta
  text: நீ நீதிமானாக இருந்தால், அவருக்கு[a] என்ன கொடுக்கிறாய்? அல்லது உன் கையிலிருந்து அவர் எதை எடுத்துக்கொள்கிறார்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது. மனிதனின் நீதி கடவுளுக்கு எந்த ஆதாயத்தையும் அளிப்பதில்லை என்பதே சூழலில் எலிகூ கூறும் கருத்து.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘அவர் உன் கையிலிருந்து எதைப் பெற்றுக்கொள்கிறார்?’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: நிபந்தனையை அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், இயல்பான தமிழ் நிபந்தனை வடிவமான ‘இருந்தால்’ பயன்படுத்தப்பட்டது.
- source_word: צָדַקְתָּ
  choice: நீ நீதிமானாக
  rationale: צדק என்பது நீதியுள்ளவராக அல்லது சரியானவராக இருப்பதைக் குறிக்கிறது. இச்சூழலின் அறநெறி மற்றும் இறையியல் நடைக்கு ‘நீதிமானாக’ பொருத்தமாக உள்ளது.
- source_word: מַה תִּתֶּן לוֹ
  choice: அவருக்கு என்ன கொடுக்கிறாய்?
  rationale: பொதுவான உண்மையை வலியுறுத்தும் வினாவாக எபிரெய வாக்கியம் அமைந்துள்ளது. ‘அவருக்கு’ என்பது לְ குறிக்கும் மறைமுகச் செயப்படுபொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִיָּדְךָ
  choice: உன் கையிலிருந்து
  rationale: ஒருவரிடமிருந்து அல்லது அவரது உடைமையிலிருந்து பெறுவதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִקָּח
  choice: எடுத்துக்கொள்கிறார்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைக் காத்து, தமிழில் இயல்பாக அமையும் தொடர்வினை வடிவம் பயன்படுத்தப்பட்டது; ‘பெற்றுக்கொள்கிறார்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: לוֹ / יִקָּח என்பவற்றிலுள்ள மூன்றாம் நபர் சுட்டுப்பெயரின் குறிப்பு
  choice: மூலத்தைப் போலவே ‘அவர்/அவருக்கு’ என்று மொழிபெயர்த்து, சூழலில் அது கடவுளைக் குறிப்பதாக அடிக்குறிப்பில் தெரிவித்தல்
  alternative: முதன்மை உரையிலேயே ‘கடவுள்/கடவுளுக்கு’ என்று வெளிப்படையாகக் கூறுதல் அல்லது குறிப்பிடப்படாத ஒருவராக விடுதல்
  rationale: யோபு 35:6–8-ல் எலிகூவின் வாதம் மனிதரின் பாவமோ நீதியோ கடவுளுக்கு ஆதாயத்தையோ இழப்பையோ உண்டாக்குவதில்லை என்பதாகும். இருப்பினும் எபிரெய மூலத்தில் பெயர்ச்சொல்லுக்குப் பதிலாகச் சுட்டுப்பெயரே இருப்பதால், முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், அதேவேளை யோபு நூலின் கண்ணியமான வாதநடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. இரு இணையான வினாக்களின் சொல்லாட்சியும் ‘கை’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
