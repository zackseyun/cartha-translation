  text: לְ/אִישׁ כָּמ֥וֹ/ךָ רִשְׁעֶ֑/ךָ וּ/לְ/בֶן אָ֝דָ֗ם צִדְקָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: ta
  text: உன்னைப் போன்ற ஒரு மனிதனை உன் தீமை பாதிக்கும்; ஒரு மானிடனை[a] உன் நீதி பாதிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘மனித மகன்.’ இது இங்கு சாகக்கூடிய சாதாரண மனிதரைக் குறிக்கும் பொதுவான சொற்றொடர்; மேசியாவைக் குறிக்கும் பட்டம் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: ஒரு மனிதனை … பாதிக்கும்
  rationale: לְ முன்னிடைச்சொல் இங்கு செயல் சென்றடையும் மனிதனைக் குறிக்கிறது. எபிரெய வாக்கியத்தில் வினைச்சொல் வெளிப்படையாக இல்லாததால், முந்தைய வசனங்களின் கருத்தைத் தெளிவாகத் தொடர தமிழில் ‘பாதிக்கும்’ என்பது சேர்க்கப்பட்டது.
- source_word: כָּמוֹךָ
  choice: உன்னைப் போன்ற
  rationale: யோபைப் போன்ற இன்னொரு மனிதன் என்ற வெளிப்படையான ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: רִשְׁעֶךָ
  choice: உன் பொல்லாப்பு
  rationale: רֶשַׁע குறிக்கும் அறநெறிசார் தீமையையும் பொல்லாத நடத்தையையும் ‘பொல்லாப்பு’ சுருக்கமாகவும் கவிதைநயத்துடனும் வெளிப்படுத்துகிறது.
- source_word: וּלְבֶן אָדָם
  choice: மனித மகனை
  rationale: בֶּן־אָדָם என்பதன் சொல் உருவகத்தைத் தக்கவைத்து, இணை அமைப்பில் ஒரு சாதாரண மனிதனையே குறிக்கிறது. இது இங்கு மேசியாவைக் குறிக்கும் பட்டம் அல்ல.
- source_word: צִדְקָתֶךָ
  choice: உன் நீதி
  rationale: צְדָקָה இங்கு ‘பொல்லாப்பு’ என்பதற்கு எதிரிணையாக நிற்கும் நேர்மையான, நீதியான நடத்தையைக் குறிக்கிறது; ‘நீதி’ அதன் சுருக்கமான நேரடி இணை.
theological_decisions:
- issue: בֶּן אָדָם என்பதன் சூழல்சார் பொருள்
  choice: ‘மனித மகன்’ என்று வடிவத்தைத் தக்கவைத்து, பொதுவான ஒரு மனிதனைக் குறிப்பதாக மொழிபெயர்த்தல்
  alternative: ‘மனிதன்’ அல்லது ‘மானிடன்’; ‘மனிதகுமாரன்’ என்ற மேசியாப் பட்டம்
  rationale: இது ‘உன்னைப் போன்ற ஒரு மனிதன்’ என்பதற்கு இணையான பொதுவான கவிதை வழக்கு. மூலத்தின் உருவகத்தைப் பாதுகாக்க ‘மனித மகன்’ வைக்கப்பட்டது; குறிப்பிட்ட மேசியாப் பட்டமாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பு விளக்குகிறது.
- issue: எபிரெய மொழியின் வினையில்லா இணை அமைப்பு
  choice: இரு அரையடிகளிலும் ‘பாதிக்கும்’ என்பதை வெளிப்படையாக வழங்குதல்
  alternative: ‘உன் பொல்லாப்பு உன்னைப் போன்ற ஒரு மனிதனுக்கே; உன் நீதி மனித மகனுக்கே’ என்ற முற்றிலும் வடிவநெருக்கமான வாசகம்
  rationale: முந்தைய வசனங்கள் கடவுளை மனிதச் செயல்கள் பாதிக்குமா என்று பேசுகின்றன. எனவே ‘பாதிக்கும்’ என்பது சூழலால் உணர்த்தப்பட்ட பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மனித நடத்தை கடவுளைவிட மற்ற மனிதர்மீது விளைவுறும் என்ற எலிகூவின் கருத்தைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான கவிதை இணை அமைப்பு காக்கப்பட்டது. ‘பொல்லாப்பு/நீதி’ என்ற எதிரிணை அறநெறிசார் தொனியைத் தக்கவைக்கிறது; ‘மனித மகன்’ மூல உருவகத்தைப் பாதுகாக்கிறது.
