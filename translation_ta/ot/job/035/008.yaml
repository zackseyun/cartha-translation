review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands the elliptical Hebrew clauses in light of Job 35:6–7 and appropriately supplies ‘பாதிக்கும்’ in both lines. However, ‘பொல்லாப்பு’ can primarily suggest trouble, harm, or misfortune in modern Tamil rather than the agent's moral wickedness (רִשְׁעֶךָ).
  naturalness: The parallel structure is clear, but ‘மனித மகன்’ is not idiomatic modern Tamil for the generic Hebrew idiom here and can invite a title-like or literal filial reading. ‘மானிடன்’ is a natural poetic-generic equivalent.
  terminology: ‘உன் தீமை’ better expresses moral evil/wickedness than ‘உன் பொல்லாப்பு.’ ‘உன் நீதி’ adequately retains the concise parallel equivalent for צִדְקָתֶךָ. The footnote should explain that the Hebrew literally has ‘son of man’ while clarifying its generic sense.
  issues:
  - severity: medium
    issue: ‘பொல்லாப்பு’ is semantically imprecise for רִשְׁעֶךָ.
    rationale: In current Tamil it often denotes adversity, nuisance, or harmful consequence, whereas the Hebrew denotes the person's wickedness/evil conduct.
  - severity: medium
    issue: ‘மனித மகன்’ is unnatural and potentially misleading in this context.
    rationale: The Hebrew בֶן־אָדָם is a generic poetic designation for a mortal human here, not a personal or messianic title. ‘மானிடன்’ preserves the generic human reference naturally; the footnote can retain the literal Hebrew wording.
  revised_text: உன்னைப் போன்ற ஒரு மனிதனை உன் தீமை பாதிக்கும்; ஒரு மானிடனை[a] உன் நீதி பாதிக்கும்.
