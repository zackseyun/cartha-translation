  yaml_path: translation/ot/job/035/015.yaml
  text: And now[a], because his anger has not punished, and he does not greatly heed transgression[b],
translation:
  language: ta
  text: இப்போதோ[a], ஏனெனில் அவருடைய கோபம் தண்டிக்கவில்லை; அவர் மீறுதலைப் பெரிதாகக் கவனிப்பதும் இல்லை[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இப்போது’ அல்லது ‘ஆனால் இப்போது’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள இணைப்புச் சொல் சூழலுக்கேற்ப உரைமாற்றத்தை உணர்த்தலாம்.
    reason: discourse_alternative
  - marker: b
    text: ‘மீறுதல்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் பொருள் உறுதியற்றது; அது ‘கிளர்ச்சி,’ ‘இறுமாப்பு’ அல்லது ‘பெருங்குற்றம்’ என்பதையும் குறிக்கலாம். மொத்தச் சொற்றொடரையும், ‘அவர் தமது கோபத்தில் வந்து விசாரிக்கவில்லை; மிகுந்த இறுமாப்பை அறிந்துகொள்ளவில்லை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: וְ என்னும் இணைப்பையும் עַתָּה என்னும் காலக் குறிப்பையும் இயல்பான தமிழில் தருகிறது; சூழலில் உள்ள உரைமாற்றத்தை ‘ஓ’ விகுதி மெதுவாக உணர்த்துகிறது.
- source_word: כִּי
  choice: —தாலும்
  rationale: காரணத்தைக் குறிக்கும் כִּי-யைத் தமிழில் இயல்பான காரணவினையெச்ச அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: அவருடைய கோபம் தண்டிக்காதது
  rationale: פָּקַד என்பதன் ‘வந்து விசாரித்தல்/கவனித்தல்/தண்டித்தல்’ என்ற பரந்த பொருள்களில், אַפּוֹ (‘அவருடைய கோபம்’) உடனான இச்சூழலில் தண்டனை சார்ந்த பொருள் மிகப் பொருத்தமானது; எபிரெயச் சொற்றொடரின் கடினமான அமைப்பைத் தேவையின்றி விளக்கித் தீர்க்கவில்லை.
- source_word: וְלֹא יָדַע
  choice: அவர் கவனிக்காதது
  rationale: יָדַע இங்கு வெறும் அறிவைக் காட்டிலும் அறிந்துகொள்ளுதல் அல்லது பொருட்படுத்திக் கவனித்தல் என்ற பொருளைத் தருகிறது.
- source_word: בַּפַּשׁ
  choice: மீறுதலை
  rationale: இச்சொல் அரிதும் பொருள் உறுதியற்றதுமாக உள்ளது. நீதித்தீர்ப்பு சார்ந்த சூழலுக்கு ‘மீறுதல்’ பொருந்துகிறது; கிளர்ச்சி, இறுமாப்பு, பெருங்குற்றம் போன்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: מְאֹד
  choice: பெரிதாக
  rationale: வினைச்செயலை வலுப்படுத்தும் מְאֹד என்பதற்கு ‘பெரிதாகக் கவனிக்காதது’ என்பது தெளிவான நவீனத் தமிழ் நடை.
theological_decisions:
- issue: மிகவும் கடினமான எபிரெயச் சொற்றொடரின் விளக்கம்
  choice: தேவனுடைய கோபம் இன்னும் தண்டிக்கவில்லை என்றும், அவர் மீறுதலைப் பெரிதாகக் கவனிக்கவில்லை என்றும் எலிகூ கூறுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் தமது கோபத்தில் வந்து விசாரிக்கவில்லை; மிகுந்த இறுமாப்பை அறிந்துகொள்ளவில்லை’ அல்லது ‘யோபு, தேவன் மனிதக் கிளர்ச்சியை நெருக்கமாகக் கவனிப்பதில்லை என நினைக்கிறான்’ என்றும் புரிந்துகொள்ளலாம்.
  rationale: இரண்டாம் அரையடி குறிப்பாகச் சொற்பொருளிலும் தொடரமைப்பிலும் உறுதியற்றது. தேர்ந்த வாசிப்பு சூழலில் எலிகூவின் கண்டனத்தோடு பொருந்துகிறது; அதேவேளை தேவன் அறியாதவர் அல்லது அக்கறையற்றவர் என்ற வலுவான கோட்பாட்டுக் கூற்றைச் சேர்க்கவில்லை. இக்கூற்று எலிகூவின் வாதத்தின் ஒரு பகுதியாகவே நிற்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இது அடுத்த வசனத்துடன் தொடரும் காரணத் துணைவாக்கியம் என்பதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் பொருள் மற்றும் தொடரமைப்பு உறுதியற்ற தன்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
