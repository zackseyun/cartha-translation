  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: ta
  text: ஏனெனில், “அது உனக்கு என்ன பயன் தரும்? என் பாவத்தால் எனக்கு என்ன இலாபம்?” என்று நீ சொல்கிறாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு என்ன பயன்? நான் பாவம் செய்வதால் கிடைப்பதைவிட எனக்கு என்ன அதிக இலாபம்?” எபிரெய வாக்கியம் சுருக்கமானது; நீதியாய் இருப்பதையும் பாவம் செய்வதையும் ஒப்பிடுவதாக இது இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிகூ முன் கூறிய குற்றச்சாட்டை விளக்கும் காரணவாக்கியத்தை அறிமுகப்படுத்துகிறது.
- source_word: תֹאמַר
  choice: நீ சொல்கிறாய்
  rationale: யோபை நோக்கிய இரண்டாம் நபர் ஆண்பால் ஒருமை வினை; தமிழில் இயல்பான நிகழ்காலமாக வழங்கப்பட்டுள்ளது.
- source_word: מַה יִּסְכָּן לָךְ
  choice: அது உனக்கு என்ன பயன் தரும்?
  rationale: סכן என்பதன் பயன் அல்லது நன்மை அளித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; לָךְ என்பதன் இரண்டாம் நபர் குறிப்பை மாற்றாமல் வைத்திருக்கிறது.
- source_word: מָה אֹעִיל
  choice: எனக்கு என்ன இலாபம்?
  rationale: יעל வினையின் பயனடைதல் அல்லது இலாபம் பெறுதல் என்ற பொருளையும் முதல் நபர் ஒருமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵחַטָּאתִי
  choice: என் பாவத்தால்
  rationale: מן குறிக்கும் மூலப்பொருளை நேரடியாகக் காட்டுகிறது; ஒப்பீட்டுப் பொருள் சாத்தியமானதாயினும் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: எலிகூ மேற்கோளிடும் கூற்றின் நோக்கம்
  choice: நீதியாயிருப்பதால் கிடைக்கும் தனிப்பட்ட பயனைப் பாவத்தால் கிடைக்கும் பயனுடன் ஒப்பிடும் கேள்வியாக, ஆனால் சுருக்கமான எபிரெய மொழியின் தெளிவின்மையைப் பாதுகாத்து வழங்கப்பட்டது.
  alternative: “உனக்கு என்ன பயன்?” என்பது கடவுளுக்குக் கிடைக்கும் பயனை விசாரிக்கலாம்; அல்லது “நான் பாவம் செய்திருந்தால் கிடைப்பதைவிட என்ன அதிக இலாபம்?” என்ற வெளிப்படையான ஒப்பீடாக இருக்கலாம்.
  rationale: எபிரெய வாக்கியம் சுருக்கமாகவும் நீக்கங்களுடனும் உள்ளது. எனவே முதன்மை உரை குறிப்பிடப்படாத ஒப்பீட்டை நிரப்பாமல், அடிக்குறிப்பில் மாற்று வாசிப்பைத் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. “பயன்” மற்றும் “இலாபம்” என்ற இணைச்சொற்கள் எபிரெய இணைவாக்கியத்தின் கருத்தொற்றுமையைத் தக்கவைக்கின்றன; விளக்கமாகச் சேர்க்கப்படக்கூடிய “நீதியாய் இருப்பது” முதன்மை உரையில் சேர்க்கப்படவில்லை.
