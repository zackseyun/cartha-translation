  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: שָׁם என்பதற்கு “அங்கே,” יִצְעֲקוּ என்பதற்கு துயரக் கூக்குரலை உணர்த்தும் “கூக்குரலிடுகிறார்கள்,” மற்றும் מִפְּנֵי גְּאוֹן רָעִים என்பதற்கு “தீய மனிதர்களின் அகந்தையினால்” எனச் சரியாகத் தரப்பட்டுள்ளது. יַעֲנֶה-யின் வெளிப்படையற்ற ஒருமை எழுவாயை “அவர்” என வைத்திருப்பது, கடவுளை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் கட்டுப்பாட்டைக் காக்கிறது.'
