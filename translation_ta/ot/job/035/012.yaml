source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: ta
  text: அங்கே அவர்கள் கூக்குரலிடுகிறார்கள்; ஆனால் தீய மனிதர்களின் அகந்தையினால் அவர் பதிலளிப்பதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்’ என்பது எபிரெயத்தில் வெளிப்படையாகப் பெயரிடப்படாத எழுவாயைக் குறிக்கிறது; சூழல் கடவுளைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: இது முதன்மையாக இடத்தைக் குறிக்கும் வினையடை; முந்தைய வசனத்தில் விவரிக்கப்பட்ட சூழலைச் சுட்டுகிறது.
- source_word: יִצְעֲקוּ
  choice: அவர்கள் கூக்குரலிடுகிறார்கள்
  rationale: צעק துயரத்திலும் நெருக்கடியிலும் எழுப்பப்படும் அவசரமான கூக்குரலைக் குறிக்கிறது.
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: வாவ் இணைப்புச் சொல்லாக இருந்தாலும், கூக்குரலுக்கும் பதில் இல்லாமைக்கும் இடையிலான முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַעֲנֶה
  choice: அவர் பதிலளிப்பதில்லை
  rationale: எபிரெயத்தில் வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; சூழல் கடவுளைக் குறிப்பதால் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்படுகிறது, ஆனால் ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: מִפְּנֵי
  choice: '... இனால்'
  rationale: இங்கு காரணத்தைக் குறிக்கும் வடிவமாக இருப்பதால் இயல்பான தமிழில் காரண வேற்றுமையால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גְּאוֹן
  choice: அகந்தை
  rationale: தீயவர்களுடன் இணைந்துள்ளதால் גאון என்பதன் எதிர்மறையான பெருமை அல்லது ஆணவம் என்ற பொருள் இங்கு பொருந்துகிறது.
- source_word: רָעִים
  choice: தீய மனிதர்கள்
  rationale: இது தீமை செய்கிற மனிதர்களைக் குறிக்கும் ஆண்பால் பன்மை பெயரடைப் பயன்பாடு; தமிழில் மனிதக் குறிப்பைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: ‘பதிலளிப்பதில்லை’ என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று வைத்து, கடவுளின் பெயரை வெளிப்படையாகச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: ‘கடவுள் அவர்களுக்குப் பதிலளிப்பதில்லை’
  rationale: சூழல் கடவுளைக் குறித்தாலும், எபிரெய வசனம் எழுவாயைப் பெயரிட்டு உரைப்பதில்லை. மூலத்தின் கட்டுப்பாட்டைப் பாதுகாக்க ‘அவர்’ என வைக்கப்படுகிறது.
- issue: மִפְּנֵי גְּאוֹן רָעִים என்ற காரணத் தொடரின் தொடர்பு
  choice: தீய மனிதர்களின் அகந்தையே பதில் இல்லாமைக்கான காரணம்
  alternative: அவர்களின் கூக்குரல் தீய மனிதர்களின் அகந்தையினால் எழுகிறது
  rationale: சொல் வரிசையும் வழக்கமான தொடரமைப்பும் காரணத் தொடரை ‘பதிலளிப்பதில்லை’ என்பதோடு இணைக்க ஆதரிக்கின்றன; இருப்பினும் ‘அகந்தை’ யாருடையது என்பது தொடரில் பொதுவாகவே கூறப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதும் ஆன நடை. ‘கூக்குரலிடுகிறார்கள்’ துயரத்தின் அவசரத்தையும், ‘அகந்தை’ גְּאוֹן என்பதன் எதிர்மறைப் பொருளையும் தெரிவிக்கின்றன. மூலத்தில் இல்லாத ‘அவர்களுக்கு’ என்ற செயப்படுபொருள் சேர்க்கப்படவில்லை.
