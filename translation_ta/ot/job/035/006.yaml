  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: ta
  text: 'நீ பாவம் செய்தால், அவருக்கு எதிராக என்ன சாதிப்பாய்?[a]


    உன் மீறுதல்கள் பெருகினால், அவருக்கு என்ன செய்வாய்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவருக்கு என்ன செய்வாய்?” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் வெறுமனே ‘செய்’ அல்லது ‘விளைவி’ என்று பொருள்படலாம்; “அவருக்கு எதிராக என்ன சாதிப்பாய்?” என்பது இங்குள்ள சொல்லாட்சிக் கேள்வியின் கருத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: நீ பாவம் செய்தால்
  rationale: אִם நிபந்தனையைக் குறிக்கிறது; Qal perfect ஆன חָטָאתָ இங்கு பொதுவான அனுமான நிபந்தனையில் வருவதால், இயல்பான தமிழில் ‘பாவம் செய்தால்’ என்று தரப்பட்டது.
- source_word: מַה תִּפְעָל בּוֹ
  choice: அவருக்கு எதிராக என்ன சாதித்துவிடுவாய்?
  rationale: פעל என்பது செய்தல் அல்லது விளைவித்தலைக் குறிக்கும்; בּוֹ இங்கு கடவுளுக்கு எதிராக ஒருவர் எதை விளைவிக்க முடியும் என்ற சொல்லாட்சியைத் தருகிறது. ‘சாதித்துவிடுவாய்’ என்பது கேள்வியின் எதிர்மறை விடையை உணர்த்தினாலும், ‘தீங்கு’ என்று வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: உன் மீறுதல்கள் பெருகினால்
  rationale: וְרַבּוּ என்பது ‘மேலும் அவை பெருகின’ என்று சொற்சொல்லாக அமையலாம்; முதல் அரையடியின் אִם நிபந்தனை இரண்டாம் அரையடியிலும் தொடர்வதால், தமிழில் ‘பெருகினால்’ என்று வெளிப்படுத்தப்பட்டது. פְשָׁעֶיךָ-இன் கலகமுள்ள மீறல் நுணுக்கத்தை ‘மீறுதல்கள்’ காக்கிறது.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: அவருக்கு என்ன செய்துவிடுவாய்?
  rationale: עשה என்பது பொதுவாக ‘செய்’; לּוֹ என்பது ‘அவருக்கு’ எனப்படுகிறது. மூலத்தின் எளிய, சொல்லாட்சிமிக்க கேள்வி பாதுகாக்கப்பட்டுள்ளது; ‘என்ன செய்ய முடியும்’ என்று திறனை நேரடியாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: மனிதப் பாவம் கடவுளுக்கு எந்த வகையிலும் பொருட்டல்ல என்று வசனம் கூறுகிறதா, அல்லது அது அவரைச் சேதப்படுத்தவோ குறைக்கவோ முடியாது என்று கூறுகிறதா?
  choice: மனிதப் பாவம் கடவுளுக்கு எதிராக எதையும் சாதித்து அவரைச் சேதப்படுத்த முடியாது என்பதைக் கேள்வி வடிவில் உணர்த்தும் மொழிபெயர்ப்பு.
  alternative: ‘அவருக்கு என்ன தீங்கு செய்வாய்?’ அல்லது முற்றிலும் சொற்சொல்லான ‘அவருக்கு என்ன செய்வாய்?’
  rationale: எலிகூவின் வாதம் கடவுளின் உயர்வையும் மனிதச் செயல்களால் அவர் குறைக்கப்படாத தன்மையையும் வலியுறுத்துகிறது; பாவம் கடவுளின் முன் ஒழுக்கரீதியாகப் பொருட்டல்ல என்று கூறுவதில்லை. முதல் அரையடியில் ‘எதிராக’ மூலத்தின் בּוֹ உறவுநிலையை வெளிப்படுத்துகிறது; ‘தீங்கு’ என்ற முடிவை நேரடியாக மூலத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதை இணைநிலையைப் பாதுகாக்க இரண்டு வரிகளாக அமைக்கப்பட்டது. ‘அவர்’ என்பது சூழலில் கடவுளைக் குறிக்கும் மரியாதை ஒருமை. ‘சாதித்துவிடுவாய் / செய்துவிடுவாய்’ என்ற இணையான வடிவங்கள் சொல்லாட்சிக் கேள்வியின் விளைவு சார்ந்த நுணுக்கத்தையும் இயல்பான தமிழையும் இணைக்கின்றன.
