  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: ta
  text: பூமியின் விலங்குகளைவிட நமக்குக் கற்பிப்பவரும், வானத்துப் பறவைகளைவிட நம்மை ஞானமுள்ளவர்களாக்குகிறவரும்[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின் விலங்குகளிடமிருந்து நமக்குக் கற்பிப்பவரும், வானத்துப் பறவைகளிடமிருந்து நமக்கு ஞானம் அளிப்பவரும்.” எபிரெய முன்னொட்டு ஒப்பீட்டுக்குப் பதிலாக மூலத்தைக் குறிப்பதாகவும் வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: நமக்குக் கற்பிக்கிறவர்
  rationale: למד என்பதன் பியேல் வினையெச்ச வடிவம் செயற்பட்டுக் கற்பித்தலைக் குறிக்கிறது. தமிழில் ‘நமக்குக் கற்பிக்கிறவர்’ என்பது இயல்பாகவும், முந்தைய வசனத்திலிருந்து தொடரும் ‘எங்கே?’ என்ற கேள்விக்குப் பொருந்துமாறும் உள்ளது.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: பூமியின் விலங்குகளைவிட
  rationale: מִן முன்னொட்டை இங்கு ஒப்பீட்டுப் பொருளில் எடுத்துள்ளோம். ‘பூமியின் விலங்குகள்’ என்பது எபிரெயக் கவிதையின் தெளிவான உருவகத்தையும் இணை அமைப்பையும் காக்கிறது.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகளைவிட
  rationale: முந்தைய அடியுடன் இணையாக מֵ ஒப்பீட்டுப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானத்துப் பறவைகள்’ என்பது இயல்பான நவீனத் தமிழில் எபிரெயச் சொல்லாட்சியை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: יְחַכְּמֵנוּ
  choice: நம்மை ஞானமுள்ளவர்களாக்குகிறவர்
  rationale: חכם என்பதன் பியேல் வடிவம் ஞானமடையச் செய்வதைக் குறிக்கிறது. ஒப்பீட்டை அடுத்துள்ள ‘விட’ ஏற்கெனவே வெளிப்படுத்துவதால், ‘ஞானமுள்ளவர்களாக்குகிறார்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இரு கவிதை அடிகளிலும் வரும் מִן / מֵ முன்னொட்டின் பொருள்
  choice: 'ஒப்பீடு: விலங்குகளையும் பறவைகளையும்விட மனிதர்களுக்குக் கற்பித்து அவர்களை ஞானமுள்ளவர்களாக்குதல்'
  alternative: 'மூலம்: பூமியின் விலங்குகளிடமிருந்தும் வானத்துப் பறவைகளிடமிருந்தும் நமக்குக் கற்பித்து ஞானமளித்தல்'
  rationale: உடனடியான இணைக் கவிதை அமைப்பும் சூழலும் மனிதருக்குக் கொடுக்கப்பட்ட அறிவை விலங்கு, பறவை ஆகியவற்றோடு ஒப்பிடும் வாசிப்பை ஆதரிக்கின்றன. ஆயினும், எபிரெய முன்னொட்டு மூலத்தையும் குறிக்கக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: வசனத்தின் இலக்கணத் தொடர்ச்சி
  choice: முந்தைய வசனத்தில் தொடங்கிய ‘எங்கே?’ என்ற கேள்வியை இவ்வசனத்தின் முடிவில் வெளிப்படையாகத் தொடர்த்தல்
  alternative: இவ்வசனத்தைத் தனித்த தொடர்பெயர் வாக்கியமாக, ‘...கற்பிக்கிறவர்’ என்று மட்டும் விடுதல்
  rationale: எபிரெயில் இவ்வசனம் முந்தைய வசனத்தின் ‘என்னை உண்டாக்கிய கடவுள் எங்கே?’ என்ற கேள்வியின் தொடர்ச்சியாக உள்ளது. தனி வசனமாக வாசிக்கும் தமிழருக்கு வாக்கியத் தொடர்பைத் தெளிவாக்க ‘எங்கே?’ சேர்க்கப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானத்துப் பறவைகள்’ என்ற வேதாகமக் கவிதைச் சொல்லாட்சி காக்கப்பட்டுள்ளது. தனியே வழங்கப்பட்ட வசனத்தின் வாக்கியத் தொடர்ச்சி தெளிவாக இருக்க ‘எங்கே?’ முந்தைய வசனத்திலிருந்து எடுத்துத் தொடரப்பட்டுள்ளது.
