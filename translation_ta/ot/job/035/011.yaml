- from: பூமியின் விலங்குகளைவிட நமக்குக் கற்பிக்கிறவரும், வானத்துப் பறவைகளைவிட நம்மை ஞானமுள்ளவர்களாக்குகிறவரும் எங்கே?[a]
  to: பூமியின் விலங்குகளைவிட நமக்குக் கற்பிப்பவரும், வானத்துப் பறவைகளைவிட நம்மை ஞானமுள்ளவர்களாக்குகிறவரும்[a]
