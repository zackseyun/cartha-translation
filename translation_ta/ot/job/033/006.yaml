  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: ta
  text: இதோ, கடவுளுக்கு முன்பாக நான் உனக்காகப் பேசுபவன் போன்றவன்[a]; நானும் களிமண்ணிலிருந்து கிள்ளி எடுக்கப்பட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “கடவுளிடம் உன் வாயைப் போல.” இதற்கு “கடவுளுக்கு முன்பாக உனக்காகப் பேசுபவன்,” “கடவுளுக்கு முன்பாக உன் விருப்பத்தின்படி,” அல்லது “கடவுளுக்கு முன்பாக உனக்குச் சமமானவன்” என்று பொருள் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நானும் களிமண்ணிலிருந்து உருவாக்கப்பட்டேன்.” எபிரெய வினைச்சொல் களிமண்ணைக் கிள்ளி எடுப்பதையோ அதற்கு வடிவம் கொடுப்பதையோ நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் உரையாடல் இடைச்சொல்லை, நவீனத் தமிழிலும் கண்ணியமான நடையிலும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְפִיךָ לָאֵל
  choice: கடவுளுக்கு முன்பாக நான் உன் சார்பாகப் பேசுபவனைப் போல இருக்கிறேன்
  rationale: எழுத்துப்படி ‘கடவுளிடம்/கடவுளுக்கு உன் வாயைப் போல’ என்ற சுருக்கமான, விவாதத்திற்குரிய சொற்றொடர். சூழலில் யோபின் சார்பாகப் பேசும் மனிதப் பிரதிநிதி என்ற பொருள் பொருத்தமாக இருப்பதால் இவ்வாறு தரப்பட்டுள்ளது; மூலத்தின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: מֵחֹמֶר
  choice: களிமண்ணிலிருந்து
  rationale: חֹמֶר என்பதன் களிமண் அல்லது மண் சார்ந்த மூலப்பொருள் என்ற பொருளையும், மனிதனின் மண்ணுலகத் தோற்றப் படிமத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: קֹרַצְתִּי
  choice: கிள்ளி எடுக்கப்பட்டேன்
  rationale: களிமண்ணிலிருந்து ஒரு பகுதியைக் கிள்ளி எடுத்து வடிவமைக்கும் தொட்டுணரக்கூடிய படிமத்தைப் பாதுகாக்கிறது; பொதுவான ‘உருவாக்கப்பட்டேன்’ என்பதைவிட மூல வினையின் தனித்தன்மையை வெளிப்படுத்துகிறது.
- source_word: גַם אֲנִי
  choice: நானும்
  rationale: எலிகூவும் யோபைப் போலவே மனிதப் படைப்புதான் என்பதை வலியுறுத்தும் இணைப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யோபுக்கும் கடவுளுக்கும் தொடர்பாக எலிகூ கூறும் தன் நிலையின் பொருள்
  choice: எலிகூ, கடவுளுக்கு முன்பாக யோபின் சார்பாகப் பேசும் மனிதப் பிரதிநிதியைப் போலத் தன்னை முன்வைக்கிறார்; தொடர்ந்து வரும் சொற்றொடர் இருவரின் பொதுவான படைக்கப்பட்ட மனித இயல்பை வலியுறுத்துகிறது.
  alternative: இது ‘கடவுளுக்கு முன்பாக உன் விருப்பத்தின்படி இருப்பவன்’ அல்லது ‘கடவுளுக்கு முன்பாக உனக்குச் சமமானவன்’ என்றும் புரிந்துகொள்ளப்படலாம்.
  rationale: இரண்டாம் அரையடி எலிகூவின் மனிதத் தன்மையையும் யோபுடனான ஒற்றுமையையும் வலுப்படுத்துகிறது. அதேவேளை, சுருக்கமான எபிரெயச் சொற்றொடருக்கு அளவுக்கு மீறிய மத்தியஸ்தத் தத்துவப் பொருள் ஏற்றப்படாமல், அதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. முதல் அரையடியின் சிக்கலான எபிரெய அமைப்பு வாசிக்கத்தக்க வகையில் மொழிபெயர்க்கப்பட்டாலும் அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. இரண்டாம் அரையடியில் களிமண்ணைத் தொட்டு வடிவமைக்கும் மூலப் படிமம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
