  text: אִם תּוּכַ֥ל הֲשִׁיבֵ֑/נִי עֶרְכָ֥/ה לְ֝/פָנַ֗/י הִתְיַצָּֽבָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/005.yaml
  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: ta
  text: உன்னால் முடிந்தால், எனக்குப் பதிலளி; உன் வாதத்தை என் முன் ஒழுங்குபடுத்து[a]; நிலைகொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் சொற்களை என் முன் ஒழுங்குபடுத்து’ என்றும் மொழிபெயர்க்கலாம். ‘ஒழுங்குபடுத்து’ என்பதற்கான எபிரெய வினைச்சொல்லின் செயப்படுபொருள் இங்கு கூறப்படவில்லை; அது யோபுவின் வாதத்தையோ, சொற்களையோ, ஆயத்தமான பதிலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוּכַל
  choice: உன்னால் முடிந்தால்
  rationale: נאם உடன் வரும் יכל திறனைச் சுட்டும் நிபந்தனைச் சவாலாக உள்ளது; இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֲשִׁיבֵנִי
  choice: எனக்குப் பதிலளி
  rationale: விவாதச் சூழலில் שוב என்பதன் ஹிப்இல் வடிவம் ‘பதில் கூறு’ என்ற பொருளில் வருகிறது; நேரடியான கட்டளையின் தொனியை இது காக்கிறது.
- source_word: עֶרְכָה
  choice: உன் வாதத்தை … ஒழுங்குபடுத்து
  rationale: ערך என்பதன் அடிப்படைப் பொருள் ‘வரிசைப்படுத்து, ஒழுங்குபடுத்து.’ எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; விவாதச் சூழலில் ‘வாதம்’ என்பதைத் துணையாகச் சேர்ப்பது தமிழில் பொருளை இயல்பாக்குகிறது, மாற்றுச் சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: לְפָנַי
  choice: என் முன்
  rationale: பேசுகிறவரின் முன்னிலையில் என்பதைக் குறிக்கும் வழக்கமான இடைச்சொற்றொடருக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: הִתְיַצָּבָה
  choice: உறுதியாக நில்
  rationale: יצב என்பதன் ஹித்பயேல் கட்டளை வடிவம் தன்னை நிலைநிறுத்தி நிற்பதையோ ஆயத்தமாக நிற்பதையோ குறிக்கிறது; எதிர்கொண்டு நிற்கும் தொனியை ‘உறுதியாக நில்’ இயல்பாகத் தருகிறது.
