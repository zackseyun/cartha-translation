translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான விவாதத் தொனி பயன்படுத்தப்பட்டுள்ளது. நீதிமன்றத்தை நினைவூட்டும் சவாலின் நுணுக்கம் ‘வாதம்’, ‘என் முன்’, ‘உறுதியாக நில்’ என்பவற்றால் காக்கப்பட்டுள்ளது; மூலத்தில் விடப்பட்ட செயப்படுபொருளின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
