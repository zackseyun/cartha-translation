source:
  edition: WLC
  text: יָשֹׁ֤ר עַל אֲנָשִׁ֗ים וַ/יֹּ֗אמֶר חָ֭טָאתִי וְ/יָשָׁ֥ר הֶעֱוֵ֗יתִי וְ/לֹא שָׁ֥וָה לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: ta
  text: அவன் மனிதர்களுக்கு முன்பாகப் பாடி[a], “நான் பாவம் செய்து, நேரானதைத் திரித்தேன்; அதற்காக எனக்குத் திருப்பிச் செலுத்தப்படவில்லை[b]” என்று சொல்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாடி” என்பதற்கான எபிரெயச் சொல் அரிதானது; “மனிதர்களை நோக்கி” என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: יָשֹׁר என்பதின் அரிதான வடிவத்தாலும் அதன் வேர்ச்சொல் குறித்த கருத்து வேறுபாட்டாலும் உள்ள உண்மையான சொற்பொருள் ஐயத்தைப் பாதுகாக்கிறது.
  - marker: b
    text: எபிரெயச் சொற்றொடர் சொல்லுக்கு நெருக்கமாக, “அது எனக்குச் சமமாகவில்லை” என உள்ளது; “எனக்குத் தகுந்த தண்டனை கிடைக்கவில்லை” அல்லது “அது எனக்குப் பயன் தரவில்லை” என்றும் பொருள் கொள்ளலாம்.
    reason: וְלֹא שָׁוָה לִי என்பதிலுள்ள கைம்மாறு, தகுதி, பயன் ஆகிய சாத்தியப் பொருள்களைத் தெளிவாகக் காட்டுகிறது.
lexical_decisions:
- source_word: יָשֹׁר
  choice: பாடி
  rationale: மசோரா உயிர்க்குறிப்பையும் சூழலிலுள்ள வெளிப்படையான அறிக்கையையும் பின்பற்றி, மனிதர்களுக்கு முன் பாடுதல் அல்லது பாடலாக அறிவித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; சொல்லின் அரிதான தன்மை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: நேரானதைத் திரித்தேன்
  rationale: יָשָׁר என்பதின் ‘நேரானது/சரியானது’ என்ற உருவகத்தையும், עוה என்பதின் ‘வளைத்தல், திரித்தல்’ என்ற எதிர்மறைச் சொல்லாட்டத்தையும் காக்கிறது.
- source_word: וְלֹא שָׁוָה לִי
  choice: அதற்காக எனக்குத் திருப்பிச் செலுத்தப்படவில்லை
  rationale: குற்றத்திற்கேற்ற கைம்மாறு அல்லது தண்டனை தனக்கு வழங்கப்படவில்லை என்ற சூழல் பொருளைத் தருகிறது; எபிரெயச் சொற்றொடரின் சுருக்கமும் பொருள் நிச்சயமின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: பாவத்திற்கான கைம்மாறு கிடைக்காததன் பொருள்
  choice: அதற்காக எனக்குத் திருப்பிச் செலுத்தப்படவில்லை
  alternative: அது எனக்குப் பயன் தரவில்லை / எனக்குத் தகுந்த தண்டனை கிடைக்கவில்லை
  rationale: கடவுள் ஏன் அல்லது எவ்வாறு தண்டனையைத் தவிர்த்தார் என்பதை வசனத்துக்குள் சேர்க்காமல், பேச்சாளரின் பாவஒப்புதலையும் கிடைக்காத கைம்மாற்றையும் மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாயால் ஒப்புக்கொள்ளும் பாங்கு பயன்படுத்தப்பட்டுள்ளது. ‘நேரானதைத் திரித்தேன்’ என்ற உருவகம் மூலமொழியின் சொல் எதிர்மறையைப் பாதுகாக்கிறது; விளக்கவுரை முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
