  source_fidelity: யָשֹׁר עַל־אֲנָשִׁים என்பதன் அரிதான வினை வடிவத்தை ‘மனிதர்களுக்கு முன்பாகப் பாடி’ என்று எடுத்திருப்பது ஏற்கத்தக்கது; ‘மனிதர்களை நோக்கி’ என்ற மாற்றுச் சாத்தியத்தை அடிக்குறிப்பு முறையாகப் பாதுகாக்கிறது. ‘நேரானதைத் திரித்தேன்’ என்பது וְיָשָׁר הֶעֱוֵיתִי-யின் நேர்மை/வளைத்தல் என்ற சொல்லாட்டத்தை நன்றாகக் காக்கிறது. இறுதிச் சொற்றொடருக்கான ‘அதற்காக எனக்குத் திருப்பிச் செலுத்தப்படவில்லை’ என்பது ஆங்கில POB audit trail-இன் ‘it was not repaid to me’ என்ற தேர்வுடன் ஒத்துப்போகிறது; அடிக்குறிப்பு மூலத்தின் சுருக்கமான, விவாதத்துக்குரிய சொற்பொருளை வெளிப்படுத்துகிறது.
  naturalness: நவீன பொதுத்தமிழில் வாக்கியம் இயல்பாகவும் கண்ணியமான பாவஒப்புதல் பாங்கிலும் உள்ளது. ‘பாடி ... என்று சொல்கிறான்’ என்ற அமைப்பு எபிரெயத்தின் இரு வினைகளையும் தெளிவாகத் தருகிறது.
  terminology: ‘பாவம்’, ‘நேரானது’, ‘திரித்தேன்’, ‘திருப்பிச் செலுத்தப்படவில்லை’ ஆகியவை சூழலுக்கேற்றவை. மொழிபெயர்ப்பு எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை.
