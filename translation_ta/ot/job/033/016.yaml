id: JOB.33.16
reference: Job 33:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָ֣ז יִ֭גְלֶה אֹ֣זֶן אֲנָשִׁ֑ים וּ/בְ/מֹ֖סָרָ֣/ם יַחְתֹּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/016.yaml
  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: ta
  text: அப்போது அவர் மனிதர்களின் செவிகளைத் திறந்து, அவர்களுக்கான அறிவுரையை முத்திரையிடுகிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுக்கான எச்சரிக்கையை முத்திரையிடுகிறார்,’ அல்லது ‘அவர்களுக்கான ஒழுக்கப் பயிற்சியை முத்திரையிடுகிறார்.’ எபிரெயச் சொல் அறிவுரை, திருத்தம், ஒழுக்கப் பயிற்சி அல்லது எச்சரிக்கை என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கனவு அல்லது இரவுத் தரிசனத்தின் தொடர்ச்சியாக நிகழும் செயலைக் குறிக்கும் கால வினையடை.
- source_word: יִגְלֶה אֹזֶן
  choice: செவிகளைத் திறந்து
  rationale: சொல்லர்த்தத்தில் ‘செவியை வெளிப்படுத்துதல்/திறத்தல்’ எனும் எபிரெய மரபுத்தொடர், ஒருவர் கேட்டு ஏற்றுக்கொள்ளும்படி செய்வதைக் குறிக்கிறது. தமிழில் ‘செவிகளைத் திறந்து’ என்பது உருவகத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: אֲנָשִׁים
  choice: மனிதர்களின்
  rationale: இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொதுவான மனிதக் குறிப்பைத் தெளிவாகவும் தருகிறது.
- source_word: וּבְמֹסָרָם
  choice: அவர்களுக்கான அறிவுரையை
  rationale: מוּסָר என்பது அறிவுரை, திருத்தம், ஒழுக்கப் பயிற்சி அல்லது எச்சரிக்கை ஆகிய பொருள்களைத் தரக்கூடும். மனிதர்களைத் தீய செயலிலிருந்து விலக்குவதற்கான கடவுளின் அறிவுறுத்தல் என்ற சூழலில் ‘அறிவுரை’ பொருத்தமானது; உடைமைப் பின்னொட்டு தமிழில் இயல்பாக ‘அவர்களுக்கான’ என்று வழங்கப்பட்டுள்ளது.
- source_word: יַחְתֹּם
  choice: முத்திரையிடுகிறார்
  rationale: חתם என்பதன் முத்திரையிடுதல், உறுதிப்படுத்துதல் அல்லது மனத்தில் பதித்தல் என்ற உருவகத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: מוּסָר என்பதன் சூழல்சார் பொருள்
  choice: அறிவுரை
  alternative: எச்சரிக்கை; ஒழுக்கப் பயிற்சி; திருத்தம்
  rationale: சொல் பல பொருள்களை அனுமதிப்பதால் பிரதான உரையில் சூழலுக்கு இயைந்த ‘அறிவுரை’ தேர்ந்தெடுக்கப்பட்டு, பிற நியாயமான பொருள்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன; கடவுளின் செயலின் தன்மையை ஒரே விளக்கமாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகளைத் திறந்து’ மற்றும் ‘முத்திரையிடுகிறார்’ ஆகிய மூல உருவகங்கள் இயன்றவரை காக்கப்பட்டுள்ளன.
