  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: ta
  text: அவர் என் உயிரைக் குழிக்குள்[b] செல்லாதபடி மீட்டார்[a]; என் வாழ்வு ஒளியைக் காணும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வாழ்வைக் குழிக்குள் இறங்கிச் செல்லாதபடி விலைகொடுத்து மீட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: “குழி” என்பது எபிரெயக் கவிதையில் மரணம் அல்லது கல்லறையைக் குறிக்கப் பொதுவாகப் பயன்படுத்தப்படும் ஓர் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: மீட்டார்
  rationale: ஆபத்து அல்லது அழிவிலிருந்து மீட்பதைக் குறிக்கும் வினை. பணம் கொடுத்து வாங்குதல் என்ற கருத்தைத் தேவையின்றி சேர்க்காமல், நிறைவேற்றப்பட்ட மீட்புச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נֶפֶשׁ என்பது ஒருவரின் உயிரையோ அவரையே முழுமையாகவோ குறிக்கிறது. ‘ஆத்துமா’ என்பது தேவையற்ற உடல்–ஆத்துமா பிரிவை உணர்த்தக்கூடும்; ‘உயிர்’ மரணக் குழியிலிருந்து மீட்கப்படும் நபரின் வாழ்வை இயல்பாகச் சொல்கிறது.
- source_word: מֵעֲבֹר
  choice: சென்றுவிடாதபடி
  rationale: குழிக்குள் கடந்து செல்வதிலிருந்து தடுக்கப்பட்டதைத் தெரிவிக்கிறது. தமிழில் இயல்பாக இருக்கவும், அசைவு உருவகத்தைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּשַּׁחַת
  choice: குழிக்குள்
  rationale: שַׁחַת என்பதன் நேரடியான குழி உருவகம் தக்கவைக்கப்படுகிறது; மரணம் அல்லது கல்லறை என்ற விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְחַיָּתִי
  choice: என் வாழ்வு
  rationale: முதல் அடியிலுள்ள ‘என் உயிர்’ என்பதோடு கவிதை இணைநிலையைத் தக்கவைத்தபடியே, חַיָּה குறிக்கும் வாழும் நிலையை வேறுபடுத்திக் காட்டுகிறது.
- source_word: בָּאוֹר
  choice: ஒளியை
  rationale: எபிரெயச் சொல்லிலுள்ள குறிப்புத்தன்மையையும், குழி மற்றும் மரணத்திற்கு எதிராக நிற்கும் வாழ்வின் ஒளி உருவகத்தையும் தக்கவைக்கிறது.
- source_word: תִּרְאֶה
  choice: காணும்
  rationale: பெண்பால் பெயர்ச்சொல்லான ‘என் வாழ்வு’ என்பதே வினையின் எழுவாய். இச்சூழலில் எபிரெய நிறைவுறா வினை எதிர்கால நம்பிக்கையை வெளிப்படுத்துவதால் ‘காணும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: தொடக்க வினையின் மறைந்துள்ள எழுவாய்
  choice: அவர் என் உயிரை… மீட்டார்
  alternative: கடவுள் என் உயிரை… மீட்டார் / அவர் என்னை… மீட்டார்
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லை; சூழலில் அது கடவுளைக் குறிக்கிறது. ஆனால் வசனத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரை நேரடியாகச் சேர்க்காமல், மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பைப் பற்றிய பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை / என்னை
  rationale: இங்கே தனியாகப் பிரியக்கூடிய ஓர் ஆத்துமா என்ற கோட்பாட்டைச் சொல் கட்டாயப்படுத்தவில்லை. மரணத்திலிருந்து மீட்கப்படும் நபரின் உயிரைச் சூழல் முன்னிறுத்துவதால் ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; அதேவேளை அடுத்த அடியின் חַיָּה ‘வாழ்வு’ என வேறுபடுத்தப்பட்டுள்ளது.
