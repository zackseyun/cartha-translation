  yaml_path: translation/ot/job/033/002.yaml
  text: Look now[a], I have opened my mouth; my tongue speaks in my palate.
translation:
  language: ta
  text: இதோ, இப்போது[a] நான் என் வாயைத் திறந்துவிட்டேன்; என் நாவு என் அண்ணத்தில் பேசுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இப்போது’ என்பதற்கு ‘தயவுசெய்து’ என்றும், ‘என் அண்ணத்தில்’ என்பதற்கு ‘என் வாயில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இறுதித் தொடர் மிகவும் உயிரோட்டமானதும் சற்றே வழக்கத்திற்கு மாறானதுமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வருவதற்கு கவனத்தை ஈர்க்கும் இடைச்சொல்; நவீனத் தமிழிலும் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: נָא
  choice: இப்போது
  rationale: இங்கு மரியாதையான வேண்டுகோளைவிட, எலிகூ தன் பேச்சின் மீது உடனடியாகக் கவனம் செலுத்தச் செய்யும் உரையாடல் வலிமையை வெளிப்படுத்துகிறது.
- source_word: פָּתַחְתִּי פִי
  choice: நான் என் வாயைத் திறந்துவிட்டேன்
  rationale: பேசத் தொடங்குவதைக் குறிக்கும் எபிரெய மொழிமரபை விளக்கவுரையாக மாற்றாமல், அதன் உயிரோட்டமான உடல் சார்ந்த உருவகத்தையும் நிறைவுற்ற வினை உணர்வையும் காக்கிறது.
- source_word: דִּבְּרָה
  choice: பேசுகிறது
  rationale: இவ்வடிவம் வழக்கத்திற்கு மாறானது; ‘என் நாவு’ என்பதை எழுவாயாகக் கொண்டு நிகழும் பேச்சைச் சுட்டும் வினையாக மொழிபெயர்க்கப்பட்டது. தொடங்கியுள்ள உரையை நேரடியாக முன்வைக்கும் நிகழ்காலம் தமிழில் இயல்பாக உள்ளது.
- source_word: לְשׁוֹנִי
  choice: என் நாவு
  rationale: பேச்சுக்கான ஆகுபெயராக வரும் உடல் உறுப்பை நேரடியாக வைத்திருப்பதால், ‘என் வாய்’ என்பதுடனான கவிதை இணைநிலை பாதுகாக்கப்படுகிறது.
- source_word: בְחִכִּי
  choice: என் அண்ணத்தில்
  rationale: חֵךְ என்பது வாயின் மேற்பகுதியான அண்ணத்தைத் துல்லியமாகக் குறிக்கிறது. தமிழில் சற்றே வழக்கத்திற்கு மாறாகத் தோன்றினாலும், மூலத்தின் தெளிவான உடல் சார்ந்த படிமத்தையும் בְ என்ற முன்னிடைச்சொல்லின் ‘இல்’ பொருளையும் காக்கிறது.
