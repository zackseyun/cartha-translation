id: JOB.33.9
reference: Job 33:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: ta
  text: “நான் தூயவன், மீறுதல் இல்லாதவன்; நான் குற்றமற்றவன்[a]; என்னிடம் அக்கிரமம்[b] இல்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாசற்றவன்’ என்றும் மொழிபெயர்க்கலாம்; חַף என்பது தூய்மையையும் குற்றப்பழியிலிருந்து விடுபட்ட நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘குற்றப்பழி’; עָוֺן என்பது அக்கிரமத்தையும் அதனால் ஏற்படும் குற்றப்பழியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: தூயவன்
  rationale: ஒழுக்கத் தூய்மையைக் குறிக்கும் பயனிலைப் பெயரடை. அடுத்துள்ள חַף என்பதிலிருந்து சொல்லாட்சியில் வேறுபடுத்தியும், மூலத்தின் வலிமையான தன்மைக் கூற்றைத் தளர்த்தாமலும் மொழிபெயர்க்கிறது.
- source_word: בְּלִי פָשַׁע
  choice: மீறுதல் இல்லாதவன்
  rationale: בְּלִי என்பது ‘இல்லாமல்’ என்பதையும், פֶּשַׁע என்பது மீறுதல் அல்லது கலகம் செய்வதையும் குறிக்கிறது. இங்கு குறிப்பிட்ட உடன்படிக்கைச் சூழலைத் திணிக்காமல் ஒழுக்க-சட்டப் பொருளைப் பாதுகாக்கிறது.
- source_word: חַף
  choice: குற்றமற்றவன்
  rationale: இச்சொல் மாசற்ற நிலை அல்லது குற்றப்பழியிலிருந்து விடுபட்ட நிலையைக் குறிக்கலாம். சூழலின் ஒழுக்க-சட்டத் தொனியை இயல்பான தமிழில் ‘குற்றமற்றவன்’ வெளிப்படுத்துகிறது.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: இச்சொல் அக்கிரமம், குற்றப்பழி, அல்லது குற்றத்தின் விளைவு ஆகியவற்றைக் குறிக்கக்கூடும். முதன்மை உரையில் ‘அக்கிரமம்’ ஒழுக்கத் தீமையின் வலிமையைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִי
  choice: என்னிடம்
  rationale: சொல்லுக்குச் சொல் ‘எனக்கு’ என்றிருந்தாலும், ஒருவரிடம் அக்கிரமம் இல்லை என்ற உடைமை அல்லது சாட்டுதல் சார்ந்த கருத்தை இயல்பான தமிழில் ‘என்னிடம்’ தெரிவிக்கிறது.
theological_decisions:
- issue: எலிகூ மேற்கோளிடும் யோபுவின் தன்மைக் கூற்றின் அளவு
  choice: தூய்மை மற்றும் குற்றமின்மையை வலியுறுத்தும் நேரடியான கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் தூயவன் என்று கருதுகிறேன்’ எனக் கூற்றைத் தளர்த்துதல், அல்லது எபிரெயச் சொற்களை மீறி முழுமையான பாவமின்மை பற்றிய கோட்பாட்டு மொழியைச் சேர்த்தல்.
  rationale: எபிரெய உரை ‘நான் தூயவன்… நான் குற்றமற்றவன்’ என்று வலியுறுத்தும் பயனிலைகளைக் கொண்டுள்ளது. யோபுவின் கூற்று சரியா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், உரையிலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தூயவன்’ மற்றும் ‘குற்றமற்றவன்’ ஆகியவை எபிரெய இணைச்சொற்களின் வேறுபாட்டைப் பாதுகாக்கின்றன; ‘அக்கிரமம்’ வசனத்தின் ஒழுக்க வலிமையைத் தக்கவைக்கிறது.
