source:
  edition: WLC
  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: ta
  text: அவர் என் கால்களைப் பூட்டும் மரச்சட்டத்தில் வைக்கிறார்; என் பாதைகள் அனைத்தையும் கண்காணிக்கிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “என் பாதைகள் அனைத்தையும் காக்கிறார்.” எபிரெய வினைச்சொல் ‘கண்காணித்தல்’ அல்லது ‘காத்தல்’ என இருவிதமாகப் பொருள்படலாம்; இங்கு சூழல் பாதுகாப்பைக் காட்டிலும் எதிர்மறையான கூர்ந்த கண்காணிப்பைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: பூட்டிவைக்கிறார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைக்கிறார்/அமைக்கிறார்.’ கால்களைத் தடுக்கும் கருவியுடன் வரும் இச்சூழலில், இயல்பான தமிழில் செயலைத் தெளிவாகக் காட்ட ‘பூட்டிவைக்கிறார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּסַּד
  choice: மரக்கட்டையில்
  rationale: סַד என்பது கால்களை அசையாமல் தடுக்கும் ‘stocks’ போன்ற தண்டனைக் கருவி. நவீன வாசகர்களுக்குப் புரியும்படி அதன் பொருளை ‘மரக்கட்டை’ என்று வெளிப்படுத்தி, ‘பூட்டிவைக்கிறார்’ என்பதுடன் இணைக்கப்பட்டது.
- source_word: רַגְלָי
  choice: என் கால்களை
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுள்ள இவ்வடிவம் இரு கால்களையும் இயல்பாகக் குறிக்கிறது.
- source_word: יִשְׁמֹר
  choice: கண்காணிக்கிறார்
  rationale: שׁמר என்பதற்கு ‘காக்கிறார்,’ ‘கவனிக்கிறார்,’ ‘கண்காணிக்கிறார்’ ஆகிய பொருள்கள் உண்டு. யோபுவின் முறையீட்டை எலிகூ எடுத்துரைக்கும் சூழலில், பாதுகாப்பைக் காட்டிலும் நெருக்கமான ஆய்வைக் காட்டும் ‘கண்காணிக்கிறார்’ பொருத்தமாக உள்ளது; மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: முழுமையைக் குறிக்கும் இயல்பான தமிழ் அளவுச்சொல்.
- source_word: אָרְחֹתָי
  choice: என் பாதைகள்
  rationale: אֹרַח என்பது நேரடியான பாதையையும் உருவகமாக ஒருவரின் வாழ்க்கை நடப்பையும் குறிக்கலாம். ‘பாதைகள்’ என்ற மொழிபெயர்ப்பு அந்த உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இரண்டாம் அரையடியில் தேவனுடைய செயல் பாதுகாப்பாகவா அல்லது தண்டனை சார்ந்த கண்காணிப்பாகவா சித்தரிக்கப்படுகிறது?
  choice: 'தண்டனை அல்லது நீதிவிசாரணை சார்ந்த கண்காணிப்பு: ‘என் பாதைகள் அனைத்தையும் கண்காணிக்கிறார்’'
  alternative: 'பாதுகாப்பு சார்ந்த காத்தல்: ‘என் பாதைகள் அனைத்தையும் காக்கிறார்’'
  rationale: எலிகூ இங்கு, தேவன் தம்மை எதிரிபோல் நடத்தி அடைத்துவைத்ததாக யோபு கூறிய முறையீட்டைச் சுருக்குகிறார். ஆகவே שׁמר என்பதன் பாதுகாப்புப் பொருளை விட, கூர்ந்து கவனித்தல் அல்லது கண்காணித்தல் என்ற பொருள் சூழலுக்கு ஏற்றது. எபிரெயச் சொல்லின் உண்மையான இருபொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மரக்கட்டை’ என்ற சொல் பழைய தொழில்நுட்பச் சொல்லைத் தவிர்த்து, கால்களைப் பூட்டும் தண்டனைக் கருவியின் படிமத்தைத் தெளிவாக வைத்திருக்கிறது; ‘பாதைகள்’ வாழ்க்கைநடையின் உருவகத்தைப் பாதுகாக்கிறது.
