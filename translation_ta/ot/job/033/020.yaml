translation:
  language: ta
  text: 'அவனுடைய உயிர்நிலை அவனுக்கு அப்பத்தை அருவருக்கச் செய்கிறது;


    அவனுடைய உள்ளம் விரும்பத்தக்க உணவையும் வெறுக்கிறது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: அவனுக்கு ... அருவருக்கச் செய்கிறது
  rationale: இவ்வினை வெறுப்பு அல்லது அருவருப்பை உண்டாக்கும் காரணவினை வடிவில் உள்ளது. அதன் ஆண்பால் ஒருமை பின்னொட்டை வெளிப்படையாகக் காட்ட ‘அவனுக்கு’ சேர்க்கப்பட்டது.
- source_word: חַיָּתוֹ
  choice: அவனுடைய உயிர்
  rationale: இங்கு இச்சொல் விலங்கைக் குறிக்காமல் உயிர், உயிர்நிலை அல்லது வாழும் தன்மையைக் குறிக்கிறது. இணைவரியின் נַפְשׁוֹ என்பதிலிருந்து வேறுபாட்டையும் எபிரெயக் கவிதை நடையையும் காக்க ‘உயிர்’ பயன்படுத்தப்பட்டது.
- source_word: לָחֶם
  choice: அப்பம்
  rationale: அடிப்படைப் பொருளான ‘அப்பம்’ தக்கவைக்கப்பட்டது; அடுத்த அரையடியில் பொதுவாக உணவு குறிப்பிடப்படுவதால் கவிதை இணைவும் நிலைக்கிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உள்ளம்
  rationale: נפשׁ இங்கு ஒருவரின் உயிர், தன்னுணர்வு, உள்ளார்ந்த தன்மை அல்லது பசியுணர்வைக் குறிக்கலாம். தமிழில் தனியான உடலற்ற கூறு என்ற பொருளைத் தேவையின்றி வரையறுக்காமல், இயல்பான கவிதை மொழிக்காக ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַאֲכַל
  choice: உணவு
  rationale: உண்ணப்படுவது அல்லது உணவு என்ற பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: תַּאֲוָה
  choice: விரும்பத்தக்க
  rationale: விருப்பம் அல்லது விரும்பப்படுவது என்ற சொல்லின் மையக் கருத்தைத் தக்கவைக்கிறது. சூழலில் வழக்கமாகக் கவர்ச்சியூட்டும் உணவை இது குறிக்கிறது.
theological_decisions:
- issue: נפשׁ என்பதைக் ‘ஆத்துமா’ என ontological வகையில் வரையறுப்பதா
  choice: உள்ளம்
  alternative: ஆத்துமா; உயிர்; பசியுணர்வு
  rationale: இவ்விடத்தில் அந்த எபிரெயச் சொல் மனிதரின் உள்ளார்ந்த தன்மை, உயிர் அல்லது விருப்பத்தைப் பரந்தவாறு குறிக்கிறது. ‘உள்ளம்’ அந்தத் தெளிவின்மையை ஓரளவு காத்து, குறிப்பிட்ட மனிதவியல் கோட்பாட்டை உரைக்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டது. முதல் அரையடியின் காரணவினை அமைப்பும் ‘உயிர் / உள்ளம்’, ‘அப்பம் / உணவு’ என்ற எபிரெய இணைநிலைகளும் இயன்றவரை காக்கப்பட்டுள்ளன; இரண்டாம் அரையடியில் விடுபட்டுள்ள வினை தமிழில் இயல்பாக ‘வெறுக்கிறது’ என வெளிப்படுத்தப்பட்டது.
