  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: ta
  text: இதோ[a], என்னிடம் பகைமை கொள்வதற்கான காரணங்களை அவர் கண்டுபிடிக்கிறார்; என்னைத் தமக்குப் பகைவனாகக் கருதுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, எனக்கு எதிரான பகைமைகளை அவர் காண்கிறார்,” “எனக்கு எதிரான சந்தர்ப்பங்களை அவர் காண்கிறார்,” அல்லது “எனக்கு எதிரான குற்றச்சாட்டுகளை அவர் காண்கிறார்.” இங்குள்ள எபிரெயப் பெயர்ச்சொல் அரிதானது; அதன் பொருள் சூழலைச் சார்ந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் ஆற்றலை, நவீனத் தமிழில் கண்ணியமாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: תְּנוּאוֹת
  choice: பகைமை கொள்வதற்கான காரணங்கள்
  rationale: இந்த அரிய பெயர்ச்சொல் பகைமை, எதிர்ப்புக்கான சந்தர்ப்பம் அல்லது குறைகூறுவதற்கான காரணம் ஆகிய பொருள்களைச் சூழலின்படி தரக்கூடும். ‘காரணங்கள்’ என்பது יִמְצָא என்பதோடு இயல்பாக இணைந்து, எதிர்ப்புணர்வையும் தெளிவாகக் காட்டுகிறது; அரிய சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: עָלַי
  choice: என்னிடம்
  rationale: பகைமை கொள்வது என்ற தமிழ்ச் சொல்லமைப்பில், எபிரெயச் சொல்லின் ‘எனக்கு எதிராக’ என்ற எதிர்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִמְצָא
  choice: கண்டுபிடிக்கிறார்
  rationale: ‘காணுதல்/கண்டுபிடித்தல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது. ‘புனைந்துரைக்கிறார்’ என்று மொழிபெயர்த்து குற்றச்சாட்டைத் தேவையின்றி மேலும் கூர்மையாக்குவதில்லை.
- source_word: יַחְשְׁבֵנִי
  choice: என்னைக் கருதுகிறார்
  rationale: ஒருவரை ஒரு குறிப்பிட்ட நிலையில் எண்ணுதல் அல்லது மதிப்பிடுதல் என்ற חשב வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְאוֹיֵב לוֹ
  choice: தமக்குப் பகைவனாக
  rationale: யோபு எந்த உறவுநிலையில் வைக்கப்படுகிறார் என்பதைச் சொல்வதுடன், தமிழில் முன்னிலையான ‘அவர்’ என்பதையே ‘தமக்கு’ இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: யோபை தேவன் நடத்துவதைப் பற்றிய பேச்சாளரின் அறிக்கை
  choice: ‘என்னிடம் பகைமை கொள்வதற்கான காரணங்களை அவர் கண்டுபிடிக்கிறார்; என்னைத் தமக்குப் பகைவனாகக் கருதுகிறார்’ என்று யோபின் முறையீட்டின் வலிமையைப் பாதுகாத்தல்.
  alternative: ‘அவர் எனக்கு எதிராகக் குற்றச்சாட்டுகளைப் புனைகிறார்’
  rationale: இது யோபின் முறையீட்டை எலிகூ எடுத்துரைப்பதாகும்; அதன் இறையியல் கூற்றை மொழிபெயர்ப்பு அங்கீகரிப்பதில்லை. מצא என்பதற்கு ‘புனைகிறார்’ எனக் கூர்மைப்படுத்தாமல் ‘கண்டுபிடிக்கிறார்’ என்ற அடிப்படைப் பொருள் தரப்படுவதால், உரையிலுள்ள இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் ‘அவர்/தமக்கு’ வடிவங்கள் இயல்பான மரியாதை நடையைத் தருகின்றன. அரிய எபிரெயச் சொல்லின் நிச்சயமின்மை பிரதான உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
