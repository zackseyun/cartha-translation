  source_fidelity: மூல எபிரெயத்தின் கேள்வி வடிவம், אֵלָיו ('அவரோடு/அவருக்கு எதிராக'), רִיבוֹתָ ('வழக்காடுகிறாய்'), மற்றும் לֹא יַעֲנֶה அமைப்பின் பொதுவான எதிர்மறைக் கருத்து ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. כָל־דְּבָרָיו உடன் வரும் மறுப்பு, சூழலில் ‘அவருடைய எந்தச் சொல்லுக்கும்/விவகாரத்துக்கும் பதிலளிப்பதில்லை’ என்ற பொருளைத் தருவதால், ‘எந்தச் சொல்லுக்கும் பதிலளிப்பதில்லை’ என்பது ஏற்கத்தக்க நவீனத் தமிழ் வெளிப்பாடு.
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாகவும் நேரடி உரையாடலின் தொனியுடனும் உள்ளது. ‘அவரோடு வழக்காடுகிறாய்’ என்பது சற்றே முறையானதாயினும், மூலத்தின் வாதாடுதல்/நீதிமன்றச் சாயலுக்கு ஏற்றது. ‘அவர்/தம்முடைய’ மரியாதை வடிவம் தொடர்ச்சியாக உள்ளது.
  terminology: ‘வழக்காடுகிறாய்’ ரיב வினையின் விவாதம் மற்றும் வழக்குரைத்தல் சார்ந்த வலிமையைச் சரியாக வெளிப்படுத்துகிறது. ‘பதிலளிப்பதில்லை’ יַעֲנֶה என்பதற்குச் சரியானது. ‘சொல்’ என்பது דְּבָרָיו-வின் சாத்தியமான ‘சொற்கள்/விவகாரங்கள்’ வரம்பிற்குள் உள்ளது; அடிக்குறிப்பு כִּי-யின் உள்ளடக்க மற்றும் காரண வாசிப்புகளை நடுநிலையாகப் பாதுகாக்கிறது.
