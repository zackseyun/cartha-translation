source:
  edition: WLC
  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: ta
  text: அவர் தம்முடைய எந்தச் சொல்லுக்கும் பதிலளிப்பதில்லை என்று நீ ஏன் அவரோடு வழக்காடுகிறாய்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் தம்முடைய எந்தச் சொல்லுக்கும் பதிலளிப்பதில்லை என்பதால் நீ ஏன் அவரோடு வழக்காடுகிறாய்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: כִּי என்பதை குற்றச்சாட்டின் உள்ளடக்கமாகவோ காரணத்தைக் குறிக்கும் இணைப்பாகவோ புரிந்துகொள்ள முடியும்.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: வழக்காடுகிறாய்
  rationale: ריב என்ற வினையின் நீதிமன்றச் சாயலையும் கடவுளுக்கு எதிராகக் குற்றச்சாட்டு முன்வைத்து வாதிடும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு எலிகூ யோபுவின் முறையீட்டின் உள்ளடக்கம் அல்லது காரணத்தை எடுத்துரைப்பதாக வாசிக்கலாம்; தமிழில் மேற்கோள் சார்ந்த குற்றச்சாட்டாக இயல்பாக அமைகிறது. காரணப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָל־דְּבָרָיו
  choice: தம்முடைய எந்தச் சொல்லுக்கும்
  rationale: மசோரா உரையின் כָל + மறுப்பு அமைப்பை இயல்பான தமிழில் ‘எந்த...க்கும் இல்லை’ என்று வழங்குகிறது; ‘சொற்கள்/விவகாரங்கள்’ என்ற பொருள் விரிவில் இங்கு ‘சொல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא יַעֲנֶה
  choice: பதிலளிப்பதில்லை
  rationale: முற்றுப்பெறாத வினை வடிவத்தின் பொதுவான/தொடர்ச்சியான குற்றச்சாட்டை நிகழ்கால எதிர்மறையாகக் காட்டுகிறது.
theological_decisions:
- issue: கடவுள் தமது செயல்களுக்கு விளக்கம் அளிக்க வேண்டியவரா என்ற எலிகூவின் வாதம்
  choice: வசனத்தை எலிகூ கேள்வி எழுப்பும் வாத வடிவிலேயே வைத்தல்
  alternative: கடவுள் நிச்சயமாக எந்தக் கேள்விக்கும் பதில் அளிப்பதில்லை என நேரடி கோட்பாட்டுக் கூற்றாக்குதல்
  rationale: எபிரெய உரை எலிகூ யோபிடம் எழுப்பும் கேள்வியாக உள்ளது; அதன் தொடர்ச்சியில் வரும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்கக்கூடாது.
- issue: כִּי என்பதன் தொடர்பு
  choice: யோபு வழக்காடுவதற்குரிய குற்றச்சாட்டின் உள்ளடக்கமாக ‘என்று’
  alternative: காரணத் தொடர்பாக ‘ஏனெனில்’ அல்லது ‘என்பதால்’
  rationale: இரு வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியம். முதன்மை உரையில் இயல்பான தமிழையும் குற்றச்சாட்டின் உள்ளடக்கத்தையும் முன்னிறுத்தி, காரண வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை ‘நீ’ எனும் நேரடி உரையாடல் வடிவம் பயன்படுத்தப்பட்டது. கடவுளைக் குறிக்கும் மரியாதைப் பன்மை ‘அவர்/தம்முடைய’ கையாளப்பட்டது. நீதிமன்றச் சாயலைப் பாதுகாக்க ‘வழக்காடுகிறாய்’ தேர்ந்தெடுக்கப்பட்டது.
