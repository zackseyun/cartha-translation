  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: ta
  text: கனவில், இரவுத் தரிசனத்தில்—மனிதர்கள்மேல் ஆழ்ந்த தூக்கம் இறங்கும்போது, படுக்கையின்மேல் துயில் மயக்கங்களில்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: கனவில்
  rationale: בְּ முன்னொட்டு கனவு நிகழும் சூழலைக் குறிக்கிறது; ‘கனவில்’ என்பது சுருக்கமானதும் இயல்பானதுமான தமிழாக்கம்.
- source_word: חֶזְיוֹן לַיְלָה
  choice: இரவுத் தரிசனத்தில்
  rationale: ‘இரவின் தரிசனம்’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருவதோடு, ‘கனவில்’ என்பதுடனான கவிதை இணைப்பையும் காக்கிறது.
- source_word: בִּנְפֹל תַּרְדֵּמָה
  choice: ஆழ்ந்த தூக்கம் இறங்கும்போது
  rationale: בִּנְפֹל காலச்சூழலை அறிமுகப்படுத்துகிறது; תַּרְדֵּמָה சாதாரண உறக்கத்தைவிட ஆழ்ந்த தூக்கத்தைக் குறிக்கிறது. ‘இறங்கும்போது’ என்பது ‘விழுதல்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עַל אֲנָשִׁים
  choice: மனிதர்கள்மேல்
  rationale: אֲנָשִׁים இங்கு ஆண்பால் வடிவில் இருந்தாலும் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; தமிழில் ‘மனிதர்கள்’ அந்தப் பொதுப்பொருளைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּתְנוּמוֹת
  choice: அயர்ந்து தூங்கும்போது
  rationale: பன்மை வடிவிலுள்ள תְּנוּמוֹת தூக்கமயக்கங்களையோ துயில் நிலைகளையோ கவிதைநயத்துடன் குறிக்கிறது. சொற்சொல்லான பன்மை தமிழில் செயற்கையாக இருப்பதால், அதன் உணர்வை ‘அயர்ந்து தூங்கும்போது’ என இயல்பாக வழங்குகிறது.
- source_word: עֲלֵי מִשְׁכָּב
  choice: அவர்கள் படுக்கையில்
  rationale: மூலத்தில் ‘படுக்கையின்மேல்’ என்று ஒருமை கூட்டுப்பொருளில் வருகிறது. தமிழில் குறிப்பிடப்பட்ட மனிதர்களோடு தெளிவாக இணைக்க ‘அவர்கள் படுக்கையில்’ என வழங்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் இயல்பான தொடர்பை உருவாக்குகிறது.
theological_decisions:
- issue: אֲנָשִׁים என்பதன் பாலினமும் பொதுப்பொருளும்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இச்சூழலில் எபிரெயச் சொல் ஆண்களை மட்டும் வேறுபடுத்திக் குறிப்பிடாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ என்பது தமிழில் அதன் உண்மையான பரப்பைத் தருகிறது; ‘ஆண்கள்’ என்று மொழிபெயர்ப்பது தேவையற்ற பாலினக் கட்டுப்பாட்டை உண்டாக்கும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கவிதை இணைநிலையும் அடுத்த வசனத்திற்குத் தொடரும் முடிவுறாத வாக்கிய அமைப்பும் நீண்ட கோடுகளால் பாதுகாக்கப்பட்டுள்ளன.
