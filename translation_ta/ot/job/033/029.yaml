base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: ta
  text: இதோ, கடவுள் இவை அனைத்தையும் ஒரு மனிதனிடம்[a] இரண்டு அல்லது மூன்று முறை செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவரிடம்.’ எபிரெய மொழியில் ‘ஒரு மனிதனிடம்’ என்பது பொதுவான பொருளில் பயன்படுத்தப்பட்ட பிரதிநிதித்துவ ஒருமை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கூற்றின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவை அனைத்தையும்
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட கடவுளின் பல்வேறு செயல்களைச் சுட்டுகிறது; எபிரெய மொழியின் முழுமையான பொருளைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: יִפְעַל
  choice: செய்கிறார்
  rationale: פעל இங்கு செயல்படுத்துதல் அல்லது செய்தல் என்ற பொருளுடையது. தொடர்ச்சியாக அல்லது வழக்கமாக நிகழும் செயலை எபிரெய imperfect வடிவம் சூழலில் குறிப்பதால் நிகழ்காலத் தமிழ் பொருத்தமானது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל என்பது கடவுளைக் குறிக்கும் பொதுவான செமித்தியச் சொல்; தனிப்பெயராகவோ கூடுதல் பட்டமாகவோ மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: இரண்டு முறை, மூன்று முறை
  rationale: சொல்லுக்கு நெருக்கமாக ‘இருமுறை, மும்முறை’ என்ற மீள்நிகழ்வைக் குறிக்கும் எபிரெய இணையை, ‘மறுபடியும் மறுபடியும்’ என்று மிகையாகப் பொழிப்புரையாக்காமல் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עִם
  choice: இடம்
  rationale: கடவுள் ஒருவருடன் மேற்கொள்ளும் செயல்பாட்டுத் தொடர்பைச் சுட்டும் עִם என்பதற்கு, ‘ஒரு மனிதனிடம் ... செய்கிறார்’ என்பது இயல்பான தமிழ்; ‘அவருக்காக’ என்பது நோக்கம் அல்லது பயன் என்ற கூடுதல் விளக்கத்தைச் சேர்த்துவிடும்.
- source_word: גָּבֶר
  choice: ஒரு மனிதன்
  rationale: גָּבֶר இலக்கணத்திலும் சொற்பொருளிலும் ஆண்பால் ஒருமை; இங்கு ஒரு மனிதனைப் பிரதிநிதித்துவ ஒருமையில் சுட்டுகிறது. மூலத்தின் வடிவை முதன்மை உரையில் காத்து, அதன் பொதுவான பயன்பாட்டை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: גָּבֶר என்பதில் உள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ஒரு மனிதன்
  alternative: ஒருவர் / ஒரு மனிதர்
  rationale: எபிரெய மூலம் ஆண்பால் ஒருமைப் பெயர்ச்சொல்லைப் பயன்படுத்துகிறது; அதைக் பாலினநடுநிலையாக்காமல் முதன்மை உரையில் காக்கப்பட்டுள்ளது. ஆயினும் சூழலில் அது ஆண்களை மட்டும் விலக்காகக் குறிக்க வேண்டியதில்லை என்பதால் அடிக்குறிப்பில் பொதுவான பிரதிநிதித்துவப் பயன்பாடு விளக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘இரண்டு முறை, மூன்று முறை’ என்ற அமைப்பு மீள்நிகழ்வைச் சுட்டும் எபிரெய சொற்றொடரின் திட்டமிட்ட எண்ணியல் பதற்றத்தைக் காக்கிறது.
