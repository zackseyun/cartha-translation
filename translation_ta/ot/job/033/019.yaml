base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: ta
  text: மேலும், வேதனையினாலும் அவன் தன் படுக்கையிலே கண்டிக்கப்படுகிறான்; அவன் எலும்புகளில் இடைவிடாத போராட்டத்தினாலும் கண்டிக்கப்படுகிறான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் எலும்புகளில் கடுமையான போராட்டத்தினாலும்.’ எபிரேயச் சொல் ‘நீடித்தது/இடைவிடாதது’ என்றும் ‘வலிமையானது/கடுமையானது’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: மேலும் ... கண்டித்துத் திருத்தப்படுகிறான்
  rationale: יכח என்பதன் ஹொஃபால் வடிவம் ஒருவர் கண்டிக்கப்படுதல், திருத்தப்படுதல், அல்லது ஒழுக்கப்படுத்தப்படுதல் என்பதைக் குறிக்கலாம். இங்கு துன்பத்தின் வழியாக அவர் திருத்தப்படுகிறார் என்ற நீதிசார்-திருத்தும் நுட்பத்தைத் தக்கவைக்க ‘கண்டித்துத் திருத்தப்படுகிறான்’ என மொழிபெயர்க்கப்பட்டுள்ளது; וְ என்ற இணைப்பு முந்தைய வசனத்துடன் தொடர்வதைக் காட்ட ‘மேலும்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּמַכְאוֹב
  choice: வேதனையால்
  rationale: מַכְאוֹב உடல் வேதனை அல்லது துன்பத்தைக் குறிக்கிறது. בְּ இங்கு கருவிப் பொருளில் வருவதால், வேதனை திருத்தத்தின் வழிமுறையாக இருப்பதை ‘வேதனையால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל מִשְׁכָּבוֹ
  choice: தன் படுக்கையில்
  rationale: இது துன்பப்படுபவர் படுக்கையில் கிடக்கும் நிலையைக் குறிக்கும் நேரடியான இடக்குறிப்பு. எழுவாயையே சுட்டுவதால் தமிழில் ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְרִיב
  choice: போராட்டம்
  rationale: רִיב பொதுவாக சச்சரவு, மோதல், போராட்டம் என்பவற்றைக் குறிக்கும். எலும்புகளுடன் இணையும் இச்சூழலில், உடலுக்குள் நிகழும் கடுமையான வேதனையை உருவகமாகக் காட்ட ‘போராட்டம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: עֲצָמָיו
  choice: அவன் எலும்புகளுக்குள்
  rationale: மூலத்தின் உறுதியான உடல்சார் உருவகத்தைப் பாதுகாக்க ‘எலும்புகள்’ தக்கவைக்கப்பட்டுள்ளது. போராட்டம் உடலின் ஆழத்தில் நிகழ்வதை இயல்பான தமிழில் காட்ட ‘எலும்புகளுக்குள்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֵתָן
  choice: இடைவிடாதது
  rationale: אֵתָן நீடித்த, நிலையான, அல்லது வலிமையான என்பதைக் குறிக்கலாம். இச்சூழலில் தொடரும் உடல்வேதனையை ‘இடைவிடாதது’ தெளிவாகக் காட்டுகிறது; ‘கடுமையானது’ என்ற மாற்று நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: துன்பம் இறைத் திருத்தத்தின் வழியாகச் சித்தரிக்கப்படுவது
  choice: துன்பத்தின் வழியாக ஒருவர் கண்டித்துத் திருத்தப்படுகிறார் என்று வசனம் கூறுகிறது; ஆனால் அது முழுக்கத் தண்டனைத் தீர்ப்பு என்று வரையறுக்கவில்லை.
  alternative: இது முற்றிலும் தண்டனைத் தீர்ப்பு; அல்லது இறைச் செயல்பாடு இல்லாத இயற்கையான நோய் மட்டுமே.
  rationale: எலிகூவின் உரையில் துன்பம் மனிதனை நோக்கிக் கடவுள் பேசும் அல்லது திருத்தும் ஒரு வழியாக அமைகிறது. ‘தண்டிக்கப்படுகிறான்’ என்று வலுப்படுத்தாமல் ‘கண்டித்துத் திருத்தப்படுகிறான்’ என்று மொழிபெயர்ப்பது, மூலத்தின் இறையியல் பதற்றத்தையும் வரம்பையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘எலும்புகள்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு, அதன் உட்புற உடல்வேதனை இயல்பாகப் புரிய ‘எலும்புகளுக்குள் நடக்கும் போராட்டம்’ என வழங்கப்பட்டுள்ளது.
