base_translation:
  language: en
  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: ta
  text: 'என் சொற்கள் என் உள்ளத்தின் நேர்மையை வெளிப்படுத்துகின்றன;

    என் உதடுகள் அறிவைத் தெளிவாக உரைக்கின்றன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உதடுகள் தூய அறிவை உரைக்கின்றன” அல்லது “என் உதடுகள் அறிந்ததை வெளிப்படையாக உரைக்கின்றன.” “தெளிவாக” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் தூய்மை அல்லது வெளிப்படைத்தன்மை என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: நேர்மை
  rationale: இச்சொல் நேரான தன்மையையும் ஒழுக்க நேர்மையையும் குறிக்கிறது. இங்கு எலிகூ தன் உள்ளார்ந்த நோக்கத்தின் உண்மைத்தன்மையை வலியுறுத்துவதால் ‘நேர்மை’ இயல்பான தமிழ் இணையாகிறது.
- source_word: לִבִּי
  choice: என் உள்ளம்
  rationale: எபிரெயச் சொல் சிந்தனை, மனவுறுதி உள்ளிட்ட அகநிலையைக் குறிக்கும். ‘உள்ளம்’ என்பது கவிதைநயத்தையும் அகமனிதன் என்ற பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: אֲמָרַי
  choice: என் சொற்கள்
  rationale: எலிகூ கூறும் உரைகளைக் குறிக்கும் பன்மைச் சொல்லுக்கு இது நேரடியான, இயல்பான இணை.
- source_word: וְדַעַת
  choice: அறிவு
  rationale: அவனுடைய உதடுகள் வெளிப்படுத்தும் அறிந்த செய்தியையோ அறிவின் உள்ளடக்கத்தையோ நேரடியாகக் குறிக்கிறது.
- source_word: שְׂפָתַי
  choice: என் உதடுகள்
  rationale: பேச்சைக் குறிக்கும் ஆகுபெயராக இருந்தாலும், ‘உள்ளம்—உதடுகள்’ என்ற கவிதை இணைநிலையைப் பாதுகாக்க மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בָּרוּר
  choice: தெளிவாக
  rationale: இச்சூழலில் பேச்சின் தெளிவைக் குறிக்கும் வினையடைப் பயன்பாடாக இது இயல்பாகப் புரிகிறது; ஆயினும் ‘தூய்மையாக’ அல்லது ‘வெளிப்படையாக’ என்ற பொருளும் சாத்தியம்.
- source_word: מִלֵּלוּ
  choice: பேசுகின்றன
  rationale: ‘பேசுதல்/உரைத்தல்’ என்ற பொருளுடைய வினை. ‘உதடுகள்’ எழுவாயாக இருப்பதால் ‘பேசுகின்றன’ கவிதை உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
