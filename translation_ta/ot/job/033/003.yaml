  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியில் எபிரெய மொழியின் பெயர்ச்சொல் மையமான அமைப்பை ‘என் சொற்களில்… இருக்கிறது’ என்று நெருக்கமாகக் காத்து, காரணத் தொடர்பை தேவையின்றிச் சேர்க்கவில்லை. இரண்டாம் அடியின் உண்மையான சொற்பொருள் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
