lexical_decisions:
- source_word: הַקְשֵׁב
  choice: கவனித்துக் கேள்
  rationale: קשׁב என்பதன் ஹிஃபில் கட்டளை வடிவம் வெறுமனே கேட்பதைவிடக் கவனத்துடன் கேட்கும்படி வலியுறுத்துகிறது; ‘கவனித்துக் கேள்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: אִיּוֹב
  choice: யோபே
  rationale: பெயர் வழக்கமான தமிழில் ‘யோபு’ என ஒலிபெயர்க்கப்பட்டு, நேரடி அழைப்பைக் குறிக்கும் விளிவேற்றுமையில் ‘யோபே’ என வழங்கப்பட்டது.
- source_word: שְׁמַע לִי
  choice: எனக்குச் செவிகொடு
  rationale: שׁמע உடன் לִי வருவது பேசுகிறவரை நோக்கிக் கேட்பதைக் குறிக்கிறது. முந்தைய கட்டளையின் ‘கேள்’ என்பதை அப்படியே மீண்டும் கூறாமல், எபிரெயச் சமச்சீரையும் directed listening என்ற பொருளையும் ‘எனக்குச் செவிகொடு’ தக்கவைக்கிறது.
- source_word: הַחֲרֵשׁ
  choice: மௌனமாயிரு
  rationale: இங்கு חרשׁ அமைதியாக இருக்கும்படியான நேரடிக் கட்டளை. ‘மௌனமாயிரு’ கண்ணியமானதும் தெளிவானதும் ஆகும்.
- source_word: וְאָנֹכִי
  choice: நான்
  rationale: வாவ் இணைப்பும் வலியுறுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயரும் தமிழில் அரைப்புள்ளிக்குப் பின் வரும் ‘நான்’ மூலம் இயல்பாக வெளிப்படுகின்றன; தேவையற்ற விளக்க இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: אֲדַבֵּר
  choice: பேசுவேன்
  rationale: דבר என்பதன் பியேல் முற்றாத வடிவம் இங்கு அடுத்ததாக எலிகூ செய்யவிருக்கும் செயலைக் குறிக்கிறது; ‘பேசுவேன்’ அந்த நோக்கத்தையும் தொடர்ச்சியையும் தெளிவாகக் காட்டுகிறது.
