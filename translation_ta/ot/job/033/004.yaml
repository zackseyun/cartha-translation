source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: ta
  text: 'தேவனின் ஆவி என்னை உண்டாக்கியது[a];

    எல்லாம் வல்லவரின் மூச்சு எனக்கு உயிரளிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனின் மூச்சு என்னை உண்டாக்கியது.” எபிரெயச் சொல்லான רוּחַ என்பதற்கு “மூச்சு” அல்லது “காற்று” என்றும் பொருள் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: ஆவி
  rationale: רוּחַ என்பதற்கு ‘ஆவி,’ ‘மூச்சு,’ ‘காற்று’ ஆகிய பொருள்கள் உண்டு. இங்கு אֵל உடன் வந்து, அடுத்த அடியிலுள்ள ‘எல்லாம் வல்லவரின் மூச்சு’ என்பதற்கு இணையாக இருப்பதால், முதன்மை உரையில் ‘ஆவி’ எனத் தரப்படுகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: שַׁדַּי என்பதற்கு இணையாக இங்கு வரும் இறைப்பட்டத்தை நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: עָשָׂתְנִי
  choice: என்னை உண்டாக்கியது
  rationale: עשה என்பதன் அடிப்படைப் பொருளான ‘உண்டாக்கு/செய்’ என்பதைப் பாதுகாக்கிறது. ‘வடிவமைத்தது’ போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் படைப்புச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִשְׁמַת
  choice: மூச்சு
  rationale: உயிரூட்டும் சுவாசத்தை நேரடியாகவும் சாதாரண வாசகர்களுக்குத் தெளிவாகவும் குறிக்கிறது; முதல் அடியிலுள்ள רוּחַ உடனான கவிதை இணைப்பையும் காக்கிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: இறைப்பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான தமிழ்ப் பொருளில் தருகிறது.
- source_word: תְּחַיֵּנִי
  choice: எனக்கு உயிரளிக்கிறது
  rationale: חיה என்பதன் காரணவினைப் பொருளான ‘வாழச் செய்’ என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘உயிரோடு வைத்திருக்கிறது’ அல்லது ‘உயிர்ப்பிக்கிறது’ என்ற குறுகிய விளக்கங்களைத் தவிர்க்கிறது.
theological_decisions:
- issue: רוּחַ אֵל என்பதை தேவனின் தனிப்பட்ட ஆவியாக மொழிபெயர்ப்பதா, அல்லது தேவனின் மூச்சு/காற்றாக மொழிபெயர்ப்பதா
  choice: தேவனின் ஆவி
  alternative: தேவனின் மூச்சு
  rationale: அடுத்த அடியிலுள்ள ‘எல்லாம் வல்லவரின் மூச்சு’ என்பதோடு உள்ள இணை அமைப்பு, தேவனிடமிருந்து வரும் உயிரூட்டும் செயல்பாட்டைக் காட்டுகிறது. ‘ஆவி’ என்பது רוח மற்றும் נשמה இரண்டையும் ஒரே தமிழ்ச் சொல்லால் மறைத்துவிடாமல் வேறுபாட்டைக் காக்கிறது. அதேவேளை, ‘ஆவியானவர்’ என்று ஆள்தன்மையை இலக்கணரீதியாக வலுப்படுத்தாமல், மூலத்தின் பொருள் திறப்பை வைத்திருக்கிறது; ‘மூச்சு’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதை இணை அமைப்பைக் காட்ட இரண்டு அடிகளாக அமைக்கப்பட்டுள்ளது. ‘தேவனின் ஆவி’ என்பதற்குப் பிறகு மரியாதைப் பன்மை வினைச்சொல் பயன்படுத்தப்படவில்லை; இதனால் மூல எபிரெயச் சொல்லின் ‘ஆவி/மூச்சு/காற்று’ என்ற உண்மையான பொருள் விரிவு தேவையின்றி தீர்மானிக்கப்படாமல் காக்கப்படுகிறது.
