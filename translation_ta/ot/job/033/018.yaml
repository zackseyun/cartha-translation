  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: ta
  text: 'அவர் அவனுடைய உயிரைக் குழியிலிருந்து[a] காக்கிறார்;

    அவனுடைய வாழ்வையும் ஆயுதத்தால்[b] பறிபோகாதபடியும்[c] காக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கல்லறையிலிருந்து’ அல்லது ‘அழிவிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இச்சொல் இன்னும் குறிப்பாக ‘எறியப்படும் படைக்கலம்,’ ‘அம்பு’ அல்லது ஒருவேளை ‘வாள்’ என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொற்றொடர் நேரடியாக ‘ஆயுதத்தால் கடந்து செல்வதிலிருந்து’ என்ற படிமத்தைக் கொண்டுள்ளது; இங்கு ஆயுதத்தால் ஏற்படும் மரணம் குறிக்கப்படுகிறது.
    reason: source_ambiguity
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: காக்கிறார்
  rationale: חשׂך என்பதன் அடிப்படைப் பொருள் ‘தடுத்து வை, விலக்கிக் காப்பாற்று’ என்பதாகும். மரணத்திலிருந்து மீட்கும் இச்சூழலில் ‘காக்கிறார்’ என்பது இயல்பான தமிழில் அந்தத் தடுக்கும் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிரை
  rationale: נפש இங்கு தனித்த ஓர் உடலற்ற கூறை மட்டும் குறிக்காமல், மனிதனின் உயிரையோ அவனையே குறிக்கலாம். இணைவரியில் வரும் חיה உடன் உள்ள கவிதை இணைப்பைத் தக்கவைத்து, தேவையற்ற மானுடவியல் விளக்கத்தைத் தவிர்க்க ‘உயிர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִנִּי שָׁחַת
  choice: குழியிலிருந்து
  rationale: שׁחת என்பது குழி, கல்லறை அல்லது அழிவு எனப் பொருள்படலாம். யோபின் கவிதை மொழியில் மரண உலகைக் குறிக்கும் தெளிவான உருவகமாக ‘குழி’ தக்கவைக்கப்பட்டது.
- source_word: וְחַיָּתוֹ
  choice: அவனுடைய வாழ்வு
  rationale: חיה இங்கு உயிரோ வாழ்வோ என்பதைக் குறிக்கிறது. முதல் வரியின் ‘உயிர்’ என்பதுடன் கவிதை இணைநிலையை வைத்துக்கொண்டே, தமிழில் சொல் வேறுபாட்டை உணர்த்த ‘வாழ்வு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: ஆயுதத்தால் பறிபோகாதபடி
  rationale: עבר என்பதன் நேரடிப் பொருள் ‘கடந்து செல்’; இங்கு உயிர் ஆயுதத்தின் மூலம் கடந்துபோதல் அல்லது பறிபோதல் என்ற மரணப் படிமம் உள்ளது. சொல்லுக்குச் சொல் அமைப்பின் தெளிவின்மையைத் தவிர்த்து, வன்முறை மரணத்திலிருந்து காக்கப்படுதல் என்ற சூழற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּשָּׁלַח
  choice: ஆயுதத்தால்
  rationale: שׁלח என்பது இங்கு எறியப்படும் படைக்கலம், அம்பு போன்ற ஏவுகலம் அல்லது வாள் எனக் குறிக்கக்கூடும். எந்த ஒரு குறிப்பிட்ட வகையையும் உறுதிப்படுத்தாமல் ‘ஆயுதம்’ என்ற பொதுச்சொல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: נפש மற்றும் חיה ஆகியவற்றின் கவிதை இணைநிலை
  choice: ‘உயிர்’ மற்றும் ‘வாழ்வு’ என இணையான வாழ்வுக் குறிப்புகளாக வழங்கப்பட்டது.
  alternative: ‘ஆத்துமா’ மற்றும் ‘உயிர்’ என மனிதனின் இரு வேறு கூறுகளாக வழங்குதல்.
  rationale: இவ்விரு அரைவரிகளும் ஒரே மனிதனின் மரணத்திலிருந்து காக்கப்படுதலை இணைமொழியில் கூறுகின்றன. உரை கட்டாயப்படுத்தாத உடல்–ஆத்துமா வேறுபாட்டை மொழிபெயர்ப்பில் சேர்க்காமல் இருப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதை இணைநிலையைப் பாதுகாக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பறிபோகாதபடி’ என்பது வன்முறை மரணத்தை இயல்பாக உணர்த்துகிறது; குறிப்பிட்ட ஆயுத வகையையும் மானுடவியல் கோட்பாட்டையும் உரையில் திணிப்பது தவிர்க்கப்பட்டுள்ளது.
