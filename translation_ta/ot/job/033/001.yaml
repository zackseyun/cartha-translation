base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: ta
  text: ஆனால் இப்போது[a], யோபே, தயவுசெய்து என் சொற்களைக் கேள்; என் எல்லாச் சொற்களுக்கும் செவிகொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எல்லாச் சொற்களுக்கும் செவிகொடு.” எபிரெயத்தில் வலியுறுத்தலுக்காக, அண்மைப் பொருளுடைய இரண்டு சொற்றொடர்களும் (“என் சொற்கள்” / “என் சொற்கள்”) இரண்டு கேட்புக் வினைச்சொற்களும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால் இப்போது
  rationale: எலிகூவின் உரையில் வரும் வலியுறுத்தப்பட்ட திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது; இணைப்புச்சொல்லின் எதிர்நிலைத் தன்மையையும் உரையாடல் துகளின் மாற்றக் குறிப்பையும் தக்கவைக்கிறது.
- source_word: שְׁמַע
  choice: கேள்
  rationale: நேரடி அழைப்பில் வரும் கால் கட்டளை வடிவின் அடிப்படைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மையாக்கும் வேண்டுகோள் துகளின் மரியாதையான நயத்தை நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִיּוֹב
  choice: யோபே
  rationale: பெயரைத் தமிழ் வேதாகம மரபுப்படி எழுத்துப்பெயர்த்து, நேரடி அழைப்பைக் காட்ட விளிவேற்றுமை வடிவில் வழங்குகிறது.
- source_word: מִלָּי
  choice: என் சொற்கள்
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுள்ள பன்மைப் பெயர்ச்சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וְכָל
  choice: அனைத்தும்
  rationale: כָּל என்பதன் முழுமையைக் குறிக்கும் வலிமையை இயல்பான தமிழ் தொடரமைப்பில் தக்கவைக்கிறது.
- source_word: דְּבָרַי
  choice: நான் கூறும் அனைத்தும்
  rationale: மִלָּי என்பதுடன் உள்ள அண்மைப் பொருள் இணைத்தன்மையைத் தமிழில் தேவையற்ற ஒரேசொல் மறுபடியும் வராமல் இயல்பாகக் காட்டுகிறது; அதேவேளை பேச்சின் முழுமையையும் காக்கிறது.
- source_word: הַאֲזִינָה
  choice: செவிகொடு
  rationale: கவனமாகக் கேட்குமாறு வலியுறுத்தும் ஹிஃபில் கட்டளையின் நுணுக்கத்தை, முதல் ‘கேள்’ என்பதிலிருந்து வேறுபடுத்தி dignified modern Tamil-இல் தருகிறது.
