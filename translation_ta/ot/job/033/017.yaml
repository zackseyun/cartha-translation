source:
  edition: WLC
  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: ta
  text: மனிதனை அவனுடைய செயலிலிருந்து விலக்கவும்[a], வலிமைமிக்க மனிதனிடமிருந்து பெருமையை மறைக்கவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்படியாக: “மனிதனுடைய செயலை அகற்றவும், மனிதனிடமிருந்து பெருமையை மறைக்கவும்.” எபிரெய மொழிநடை சுருக்கமாக உள்ளது; மனிதனை அவனுடைய செயலிலிருந்து விலக்குவது என்றும், அந்தச் செயலையே அவனிடமிருந்து அகற்றுவது என்றும் இதைப் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: விலக்கவும்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒன்றிலிருந்து அகலச் செய்வதைக் குறிக்கிறது. இங்கு ‘மனிதனை அவனுடைய செயலிலிருந்து விலக்க’ என்பது தமிழில் இயல்பாகவும் காரணவினைப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אָדָם
  choice: மனிதனை
  rationale: இங்கு சொல் ஒருமையில் வருகிறது. பாலினத்தை அளவுக்கு மீறி வலியுறுத்தாமல், பொதுவான தனிமனிதப் பொருளை ‘மனிதன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַעֲשֶׂה
  choice: அவனுடைய செயலிலிருந்து
  rationale: இந்தப் பெயர்ச்சொல் செயல், செய்கை, வேலை ஆகிய பொருள்களை உடையது. சூழலில் எச்சரிப்பின் மூலம் ஒருவரை அவர் மேற்கொள்ளும் செயலிலிருந்து தடுப்பதே கருத்தாக இருப்பதால் ‘செயல்’ பொருத்தமானது; உடைமைப் பொருள் எபிரெயக் கட்டமைப்பில் மறைமுகமாக உள்ளது.
- source_word: וְגֵוָה
  choice: பெருமையை
  rationale: இங்கு גֵּוָה எதிர்மறையான தன்னுயர்வு அல்லது அகந்தையைக் குறிக்கிறது. ‘பெருமை’ மூலச்சொல்லின் பரப்பைத் தக்கவைத்து, ‘அகந்தை’ என்பதைவிட சற்று குறைவாக விளக்கமளிக்கும் தேர்வாகும்.
- source_word: מִגֶּבֶר
  choice: வலிமைமிக்க மனிதனிடமிருந்து
  rationale: גֶּבֶר சில இடங்களில் வலிமை அல்லது வீரியமுள்ள மனிதனைச் சுட்டுகிறது. முதல் அரையடியில் உள்ள אָדָם என்பதிலிருந்து காணப்படும் சொல் வேறுபாட்டைத் தமிழிலும் ஓரளவு காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְכַסֶּה
  choice: மறைக்கவும்
  rationale: כסה என்பதன் அடிப்படை உருவகம் மூடுதல் அல்லது மறைத்தல். இங்குள்ள முற்றுப்பெறா வினை முந்தைய நோக்கவினையுடன் இணையாகச் செயல்படுகிறது; ‘மறைக்கவும்’ என்பது அந்த உருவகத்தைக் காத்தபடி தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: தேவன் பேசுவதன் நோக்கத்தை விளக்கும் சுருக்கமான எபிரெயத் தொடரின் பொருள்
  choice: தேவன் மனிதனை அவனுடைய செயலிலிருந்து விலக்கி, அவனிடமிருந்து பெருமையை மறைக்கிறார் என்ற நோக்கப் பொருள்
  alternative: தேவன் மனிதனுடைய செயலையே அவனிடமிருந்து அகற்றி, மனிதனிடமிருந்து பெருமையை மறைக்கிறார் என்ற அதிகச் சொற்படியான வாசிப்பு
  rationale: எபிரெய வாக்கியம் சுருக்கமாக இருப்பதால் மனிதன் செயலிலிருந்து விலக்கப்படுகிறானா, அல்லது அவனுடைய செயல் அகற்றப்படுகிறதா என்பது இலக்கண ரீதியாக இறுக்கமாக அமைந்துள்ளது. யோபு 33:14–18 சூழல் மனிதனைத் தீங்கான வழியிலிருந்து தடுத்து நிறுத்தும் தெய்வீக எச்சரிப்பைப் பற்றியதால் முதல் வாசிப்பு முதன்மை உரையில் தரப்படுகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பையும் ‘மறைத்தல்’ என்ற மூல உருவகத்தையும் காக்கப்பட்டுள்ளது; வாக்கியத்தின் உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
