  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: ta
  text: அவனுடைய உயிரை[a] படுகுழியிலிருந்து[b] திரும்பக் கொண்டுவரவும், வாழ்வின் ஒளியால் ஒளிபெறவும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிரை’ என்பதற்குப் பதிலாக ‘ஆன்மாவை’ அல்லது ‘அவனையே’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயிர், ஆன்மா, அல்லது ஒருவரையே குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘படுகுழியிலிருந்து’ என்பதற்குப் பதிலாக ‘கல்லறையிலிருந்து’ அல்லது ‘அழிவிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஒளியைக் காணவும்’ அல்லது ‘ஒளிக்குக் கொண்டுவரப்படவும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் சுருக்கமான கவிதை மொழியில் அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: மீட்டுக்கொண்டு வந்து
  rationale: שׁוב என்பதன் ஹிப்இல் வினைவடிவம், ஒருவரைத் திரும்பக் கொண்டுவருதல் அல்லது மீட்டல் என்ற காரணவினைப் பொருளைத் தருகிறது. தமிழில் இத்தொடர் மீட்பையும் மீண்டும் கொண்டுவருதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிரை
  rationale: נפש என்பது உயிர், ஆத்துமா/ஆன்மா, அல்லது ஒருவரையே குறிக்கலாம். மரணப் படுகுழியிலிருந்து மீட்பதும் ‘வாழ்வின் ஒளி’ என்பதும் சூழலாக இருப்பதால், ‘உயிர்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: מִנִּי שָׁחַת
  choice: படுகுழியிலிருந்து
  rationale: שחת கவிதை மொழியில் குழி, கல்லறை, அல்லது அழிவு எனப் பொருள்படலாம். ‘படுகுழி’ மூலத்தின் காட்சியுருவைத் தக்கவைத்து, ‘வாழ்வின் ஒளி’ என்பதற்கு எதிரான இருள்/மரணப் படிமத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאוֹר
  choice: அவன் ஒளிபெறச் செய்வதற்கு
  rationale: இந்த எபிரெயத் தொடர் சுருக்கமானதும் நீள்விடுபாடு கொண்டதுமாக உள்ளது. தமிழில் நோக்கம் அல்லது விளைவைச் சுட்டும் காரணவினைத் தொடராக மொழிபெயர்ப்பது, மீட்பிலிருந்து ஒளிக்குக் கொண்டுவரும் கவிதை இயக்கத்தை வெளிப்படுத்துகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: בְּאוֹר הַחַיִּים
  choice: வாழ்வின் ஒளியால்
  rationale: בְ என்னும் முன்னிடைச்சொல் இங்கு கருவி, சூழல், அல்லது இணைவு ஆகிய நுண்பொருள்களை ஏற்கலாம். ‘வாழ்வின் ஒளியால்’ என்பது கருவிப் பொருளை இயல்பாக வெளிப்படுத்துவதோடு, மூலத்தின் செறிவான கவிதைப் படிமத்தையும் காக்கிறது.
