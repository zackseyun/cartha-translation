lexical_decisions:
- source_word: אִם יֵשׁ
  choice: இருந்து ... அறிவிப்பாரானால்
  rationale: எபிரெய நிபந்தனை அமைப்பையும் இருப்பைக் குறிக்கும் சொல்லையும் இயல்பான தமிழ் நிபந்தனை வாக்கியமாகப் பாதுகாக்கிறது.
- source_word: עָלָיו
  choice: அவனுக்காக
  rationale: அந்தத் தூதன் மனிதன் சார்பாக அல்லது அவன் நலனுக்காகச் செயல்படுவதைக் காட்டுகிறது; ‘அவன்மேல்’ என்ற இடவியல் பொருள் இச்சூழலில் குறைவாக இயல்பானது.
- source_word: מַלְאָךְ
  choice: தூதன்
  rationale: தமிழில் இச்சொல் விண்ணுலகத் தூதனையும் பொதுவான செய்தியாளனையும் குறிக்க இயலும்; மூலத்தின் சொற்பொருள் நெகிழ்வை ஓரளவு காக்கிறது.
- source_word: מֵלִיץ
  choice: நடுவர்
  rationale: இடைநின்று விளக்குதல், பரிந்துபேசுதல், மத்தியஸ்தம் செய்தல் ஆகிய சாத்தியங்களை உள்ளடக்கும் இயல்பான சொல்லாகும்.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: ஆயிரத்தில் ஒருவரான
  rationale: அரிதான அல்லது சிறப்பான ஒருவரைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது.
- source_word: לְהַגִּיד
  choice: அறிவிக்க
  rationale: நடுவரின் நோக்கத்தைத் தெளிவாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: לְאָדָם
  choice: மனிதனுக்கு
  rationale: இங்கு ஓர் தனிப்பட்ட மனிதரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יָשְׁרוֹ
  choice: அவனுடைய நேர்மையை
  rationale: ישר என்பதன் நேர்மை/செம்மை சார்ந்த அடிப்பொருளையும் ஆண்பால் ஒருமை பின்னொட்டையும் முறையாகப் பாதுகாக்கிறது; ‘அவனுக்குச் சரியானது’ என்ற பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: מַלְאָךְ מֵלִיץ என்பவரின் அடையாளமும் பணியும்
  choice: குறிப்பிட்ட அடையாளம் அளிக்காமல் ‘ஒரு தூதன், ... ஒரு நடுவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: மனிதச் செய்தியாளர்/விளக்குநர்; அல்லது குறிப்பிட்ட விண்ணுலகப் பரிந்துபேசுபவர்
  rationale: மூலம் இந்த நபரை இச்சொற்களுக்கு அப்பால் அடையாளப்படுத்தவில்லை. ஆகவே வளர்ச்சியடைந்த தேவதூதவியல் அல்லது கிறிஸ்தியல் அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: יָשְׁרוֹ என்பதிலுள்ள பின்னொட்டின் தொடர்பும் பொருளும்
  choice: மனிதனுடைய ‘நேர்மை’ என்று இலக்கண ரீதியில் நெருக்கமாகத் தரப்பட்டது.
  alternative: அவனுக்குச் சரியானது; அவன் செல்லவேண்டிய நேரான வழி; நடுவரின் நேர்மை
  rationale: பின்னொட்டு இயல்பாக மனிதனைக் குறிப்பதாக எடுத்துக்கொள்ளலாம்; எனினும் அந்தச் சொற்றொடர் அவனுடைய நிலைக்குச் சரியானதை அறிவித்தல் என்றும் பொருள்படக்கூடும். இந்த மெய்யியல்/ஒழுக்கவியல் பதற்றம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த தொடரை எதிர்நோக்கும் நிபந்தனைத் துணைவாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
