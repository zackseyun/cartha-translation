  to: அவனுக்காக மனிதனுக்கு அவனுடைய நேர்மையை[b] அறிவிக்கிற ஒரு தூதன்[a], ஒரு நடுவர், ஆயிரத்தில் ஒருவன் இருந்தால்,
  rationale: The revision preserves the Hebrew conditional ‘if there is,’ the purpose of the intermediary’s speech, and the appositional sequence ‘an angel, a mediator, one among a thousand.’ It also retains the lexical ambiguity of מַלְאָךְ and the contextual alternative for יָשְׁרוֹ in anchored footnotes, while using idiomatic modern Tamil syntax.
