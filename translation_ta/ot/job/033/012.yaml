source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: ta
  text: இதோ, இந்த விஷயத்தில் நீ சொல்வது சரியல்ல; நான் உனக்குப் பதிலளிப்பேன். ஏனெனில் கடவுள் மனிதனைவிட[a] பெரியவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாவுக்குரிய மனிதனைவிட.” אֱנוֹשׁ (எனோஷ்) என்ற எபிரெயச் சொல் மனிதரின் பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் அடிக்கடி வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் உரையாடல் இடைச்சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: זֹאת
  choice: இந்த விஷயத்தில்
  rationale: சுட்டுப்பெயர் தனிப்பட்ட பொருளை அல்ல, யோபு கூறிய கருத்தைச் சுட்டுவதால் இவ்வாறு வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא צָדַקְתָּ
  choice: நீ சொல்வது சரியல்ல
  rationale: இங்கு צדק பொதுவான ஒழுக்கநீதியைக் குறிக்காமல், விவாதத்தில் சரியான தரப்பில் இருப்பதைக் குறிக்கிறது. தமிழில் இதை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: אֶעֱנֶךָּ
  choice: நான் உனக்குப் பதிலளிப்பேன்
  rationale: முதல் நபர் ஒருமை imperfect வடிவமும் இரண்டாம் நபர் ஒருமை பின்னொட்டும் எலிகூ இப்போது அளிக்கவிருக்கும் பதிலைக் குறிக்கின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிகூவின் பதிலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִרְבֶּה
  choice: பெரியவர்
  rationale: מן உடன் வரும் רבה இங்கு எண்ணிக்கையை அல்ல, ஒப்பீட்டிலான மேன்மையைக் குறிக்கிறது.
- source_word: אֱלוֹהַ
  choice: கடவுள்
  rationale: ஒருமைத் தெய்வப் பெயருக்கு நவீனத் தமிழில் நேரடியான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: מֵאֱנוֹשׁ
  choice: மனிதனைவிட
  rationale: கடவுளுடன் ஒப்பிடப்படும் பலவீனமான மனிதனை ஒருமைப் பொதுப்பெயராகப் பாதுகாக்கிறது; சொல்லின் மரணத்தன்மை சார்ந்த நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்ற மனிதரைக் குறிக்கும் சொல்லின் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: சாவுக்குரிய மனிதன் / மானிடம்
  rationale: எபிரெயச் சொல் ஒருமைப் பொதுப்பெயராக இருந்து மனித பலவீனத்தை உணர்த்துகிறது. முதன்மை உரையில் இயல்பான ‘மனிதன்’ என்பதைக் கொண்டு, அதன் நிழற்பொருளை அடிக்குறிப்பில் பாதுகாப்பது தேவையற்ற கோட்பாட்டு விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான உரையாடல் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எலிகூ யோபை ஒருமையில் நேரடியாக அழைப்பதால் ‘நீ/உனக்கு’ பயன்படுத்தப்பட்டது. நீண்ட வாக்கியத்தில் காரணத் தொடர்பைத் தெளிவாக வைத்திருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘Look’ என்பதன் பின் இருந்தாலும், அதன் அடிக்குறிப்பு אֱנוֹשׁ பற்றியது என்பதால் தமிழில் உரிய ‘மனிதனைவிட’ என்பதன் பின் வைக்கப்பட்டது.
