  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: ta
  text: அவன் கடவுளிடம் மன்றாடுகிறான்[a]; கடவுள் அவனை ஏற்றுக்கொள்கிறார். அவன் மகிழ்ச்சியான ஆரவாரத்துடன் கடவுளுடைய முகத்தைக் காண்கிறான்[b]; கடவுள் அந்த மனிதனுக்கு அவனுடைய நீதியை மீட்டளிக்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் கடவுளிடம் தீவிரமாக வேண்டுகிறான்.’ எபிரெய வினைச்சொல் ஜெபத்தில் தீவிரமாக மன்றாடுவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக, ‘அவனுடைய முகத்தைக் காண்கிறான்.’ இங்கு அது கடவுளுடைய முகத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: ‘அவனுடைய நீதி’ என்பது ‘அவனுடைய நீதி நிலைநாட்டப்படுதல்’ அல்லது ‘அவனுடைய சரியான நிலை’ என்றும் பொருள்படலாம்; அது கடவுளுக்கு முன்பாக மீட்டளிக்கப்படும் நிலையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: மன்றாடுகிறான்
  rationale: இந்த வினைச்சொல் கடவுளிடம் செய்யப்படும் ஊக்கமான வேண்டுதலை அல்லது மன்றாட்டைக் குறிக்கிறது. ‘மன்றாடுகிறான்’ என்பது அதன் தீவிரத்தையும் ஜெபச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் வரும் இந்த ஒருமை கவிதைச் சொல் கடவுளைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘சர்வவல்லவர்’ போன்ற அடைமொழியைச் சேர்க்கவில்லை.
- source_word: וַיִּרְצֵהוּ
  choice: கடவுள் அவனை ஏற்றுக்கொள்கிறார்
  rationale: רצה இங்கு மன்றாடுகிற மனிதனை கடவுள் தயவுடன் ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் எழுவாயை வெளிப்படையாகச் சொல்வது பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: וַיַּרְא פָּנָיו
  choice: அவன் கடவுளுடைய முகத்தைக் காண்கிறான்
  rationale: இயல்பான தொடர்ச்சியின்படி மனிதன் கடவுளுடைய முகத்தைக் காண்கிறான்; இது மீண்டும் கிடைத்த அணுகலையும் அருளையும் சுட்டுகிறது. மூலத்தின் பிரதிப்பெயர் சுருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: בִּתְרוּעָה
  choice: மகிழ்ச்சி ஆரவாரத்துடன்
  rationale: תְּרוּעָה என்பது கொண்டாட்டம் அல்லது வெற்றியுடன் தொடர்புடைய உரத்த ஆரவாரத்தைக் குறிக்கலாம். இந்தத் தேர்வு மகிழ்ச்சியையும் கேட்கக்கூடிய முழக்கத்தையும் தக்கவைக்கிறது.
- source_word: וַיָּשֶׁב
  choice: திரும்ப அளிக்கிறார்
  rationale: שוב என்பதன் ஹிஃபீல் வடிவம் இங்கு ஒன்றை மீட்டளிப்பது அல்லது பழைய நிலைக்கு கொண்டுவருவது என்ற காரணவினைப் பொருளில் வருகிறது.
- source_word: לֶאֱנוֹשׁ
  choice: அந்த மனிதனுக்கு
  rationale: אֱנוֹשׁ மரணத்துக்குரிய மனிதனைச் சுட்டும் கவிதைச் சொல். சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட மனிதனைக் குறிக்க ‘அந்த மனிதனுக்கு’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: צִדְקָתוֹ
  choice: அவனுடைய நீதி
  rationale: צדקה என்பதன் நேரடியான பொருளான ‘நீதி’ தக்கவைக்கப்படுகிறது. இது நேர்மையான நிலை, நியாயப்படுத்தல் அல்லது மீட்டளிக்கப்பட்ட சரியான உறவு ஆகிய பொருள் நிழல்களை முன்கூட்டியே குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘அவனை ஏற்றுக்கொள்கிறார்; அவன் அவரது முகத்தைக் காண்கிறான்’ என்ற தொடரிலுள்ள பிரதிப்பெயர்களின் குறிப்பு
  choice: கடவுள் மன்றாடுகிற மனிதனை ஏற்றுக்கொள்கிறார்; பின்னர் அந்த மனிதன் கடவுளுடைய முகத்தைக் காண்கிறான்.
  alternative: கடவுள் மனிதனுடைய முகத்தைக் காண்கிறார் என்று இலக்கண ரீதியாக எடுத்துக்கொள்ள வாய்ப்புள்ளது; மனிதன் கடவுளை ஏற்றுக்கொள்கிறான் என்ற வாசிப்பு சூழலில் மிகவும் சாத்தியமற்றது.
  rationale: சுற்றியுள்ள பகுதி மனிதன் கடவுளை நோக்கித் திரும்பி, கடவுளின் அருளையும் மீட்பையும் பெறுவதை விவரிக்கிறது. ‘கடவுளுடைய முகத்தைக் காணுதல்’ மீண்டும் கிடைத்த உறவையும் அணுகலையும் இயல்பாகக் குறிக்கிறது; மூலத்தின் சொற்படியான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ‘அவனுடைய நீதி’ என்பதன் பொருள்
  choice: மனிதனுக்குரிய நீதி அல்லது மீட்டளிக்கப்பட்ட சரியான நிலை
  alternative: அது மனிதனுடைய நியாயவிளக்கம் எனவும், கடவுளுடைய நீதியை மனிதனுக்கு அளிப்பதாகவும் வாசிக்கப்படலாம்.
  rationale: எபிரெயப் பின்னொட்டு இயல்பாக மனிதனைச் சுட்டுகிறது. ‘அவனுடைய நீதி’ என்ற நேரடி வடிவம் பிற்காலக் கோட்பாட்டு விளக்கத்தை உரைக்குள் புகுத்தாமல், சொல்லின் பரந்த இறையியல் பொருள் நிழல்களைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயம் கொண்டிருந்தாலும் பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் வினைமுற்றுகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் சுருக்கத்தால் உருவாகும் பிரதிப்பெயர் தெளிவின்மை முதன்மை உரையில் சூழலுக்கேற்றவாறு தெளிவாக்கப்பட்டு, உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன.
