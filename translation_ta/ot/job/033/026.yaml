- from: அவன் கடவுளிடம் மன்றாடுகிறான்[a]; கடவுள் அவனை ஏற்றுக்கொள்கிறார். அவன் மகிழ்ச்சி ஆரவாரத்துடன் கடவுளுடைய முகத்தைக் காண்கிறான்[b]; கடவுள் அந்த மனிதனுக்கு அவனுடைய நீதியைத் திரும்ப அளிக்கிறார்[c].
  to: அவன் கடவுளிடம் மன்றாடுகிறான்[a]; கடவுள் அவனை ஏற்றுக்கொள்கிறார். அவன் மகிழ்ச்சியான ஆரவாரத்துடன் கடவுளுடைய முகத்தைக் காண்கிறான்[b]; கடவுள் அந்த மனிதனுக்கு அவனுடைய நீதியை மீட்டளிக்கிறார்[c].
