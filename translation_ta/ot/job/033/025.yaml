  text: רֻֽטֲפַ֣שׁ בְּשָׂר֣/וֹ מִ/נֹּ֑עַר יָ֝שׁ֗וּב לִ/ימֵ֥י עֲלוּמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/025.yaml
  text: his flesh becomes fresher than in youth[b][a]; he returns to the days of his youthful vigor.
translation:
  language: ta
  text: அவனுடைய சதை இளமையில் இருந்ததைவிடப் புதுப்பொலிவு பெறும்[a]; அவன் தன் இளமைத் துடிப்பின் நாட்களுக்குத் திரும்புவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய சதை ஒரு சிறுவனுடையதைப்போல் புதுப்பொலிவு பெறும்’ அல்லது ‘ஓர் இளைஞனுடைய சதையைவிடப் புதுப்பொலிவு பெறும்.’ இதற்கான எபிரெய வினை அரிதானது; இளமையுடன் செய்யப்படும் ஒப்பீட்டையும் ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் தன் இளமை நாட்களுக்குத் திரும்புவான்.’ எபிரெயப் பெயர்ச்சொல் இளமைப் பருவத்தையோ, அதனுடன் தொடர்புடைய உயிர்த்துடிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: புதுப்பொலிவு பெறும்
  rationale: அரிதாக வரும் இந்த எபிரெய வினை, சதை மீண்டும் புத்துணர்வும் செழுமையும் பெறுவதைக் குறிக்கிறது. உடல்சார்ந்த படிமத்தை வைத்துக்கொண்டே இயல்பான நவீனத் தமிழில் இதை வெளிப்படுத்துகிறது.
- source_word: בְּשָׂרוֹ
  choice: அவனுடைய சதை
  rationale: ‘சதை’ என்பது நேரடியான பொருளைத் தருவதோடு, உடல்ரீதியான புதுப்பித்தலைத் தெளிவாக வலியுறுத்துகிறது.
- source_word: מִנֹּעַר
  choice: இளமையில் இருந்ததைவிட
  rationale: מִן என்பதன் ஒப்பீட்டுப் பொருளை ஏற்று, அவனுடைய சதை முன்பு இளமையில் இருந்த நிலையையும்விடப் புதுப்பொலிவு பெறுகிறது என்ற இயல்பான வாசிப்பைத் தருகிறது; வேறு இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: יָשׁוּב
  choice: அவன் ... திரும்புவான்
  rationale: ஆண்பால் ஒருமை வினையின் எழுவாய், ‘சதை’ மட்டுமல்லாமல் அந்த மனிதனே என்பது சூழலில் இயல்பானது.
- source_word: לִימֵי
  choice: நாட்களுக்குத்
  rationale: ‘... நாட்களுக்குத் திரும்புதல்’ என்ற எபிரெய மொழிநடையைத் தமிழிலும் புரியக்கூடிய வகையில் பேணுகிறது.
- source_word: עֲלוּמָיו
  choice: தன் இளமைத் துடிப்பின்
  rationale: இந்தப் பெயர்ச்சொல் காலவயதான இளமையை மட்டுமன்றி அதனுடன் தொடர்புடைய வலிமையையும் உயிர்த்துடிப்பையும் குறிக்கக்கூடும். ‘இளமைத் துடிப்பு’ அந்த விரிந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
