review_pass:
  verdict: revise
  source_fidelity: 'The conditional invitation, the paired imperatives, and the causal statement are retained. ‘உன்னைச் சரியென நிலைநாட்ட’ appropriately expresses the contextual sense of צַדְּקֶךָ: Elihu wishes to establish Job as being in the right, without importing a later doctrinal sense.'
  naturalness: ‘உன்னிடம் சொல்ல வார்த்தைகள் இருந்தால்’ is understandable but is not idiomatic modern Tamil word order. ‘உனக்குச் சொல்ல ஏதாவது இருந்தால்’ is the natural way to express the Hebrew idiom ‘if you have words [to say].’ The two imperatives remain deliberately repetitive, as in the source.
  terminology: ‘சரியென நிலைநாட்ட’ is a suitably clear main-text rendering. The footnote should give direct alternatives corresponding to ‘justify/vindicate’ and ‘declare right,’ rather than shifting the object to ‘your case.’
  issues:
  - severity: low
    issue: Awkward Tamil idiom in the conditional clause
    rationale: The draft’s ‘உன்னிடம் சொல்ல வார்த்தைகள்’ is grammatically recoverable but unnatural. The revision expresses the same invitation idiomatically.
  - severity: low
    issue: First footnote alternative changes the object from Job to his case
    rationale: ‘உன் தரப்பை நியாயப்படுத்த’ is a possible interpretive expansion, but the Hebrew suffix directly refers to Job. A direct alternative better preserves the source and English audit trail.
