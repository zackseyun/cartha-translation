  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: ta
  text: உனக்குச் சொல்ல ஏதாவது இருந்தால், எனக்குப் பதில் சொல்; பேசு; ஏனெனில் உன்னைச் சரியென நிலைநாட்ட விரும்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை நியாயப்படுத்த விரும்புகிறேன்”; அல்லது, “உன்னைச் சரியானவன் என்று அறிவிக்க விரும்புகிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: உன்னிடம் சொல்ல வார்த்தைகள் இருந்தால்
  rationale: எபிரெய மொழியின் நிபந்தனையையும் ‘வார்த்தைகள்’ என்ற சொல்லையும் காக்கிறது; அதேவேளையில் தமிழில் இயல்பாக, ‘சொல்ல ஏதாவது இருந்தால்’ என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: הֲשִׁיבֵנִי
  choice: எனக்குப் பதில் சொல்
  rationale: ஹிஃபில் கட்டளை வடிவின் ‘எனக்குப் பதிலளி’ என்ற நேரடியான அழைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: דַּבֵּר
  choice: பேசு
  rationale: தொடர்ந்து வரும் எளிய கட்டளையின் நேரடியான வலிமையைப் பாதுகாக்கிறது.
- source_word: כִּי חָפַצְתִּי
  choice: ஏனெனில் ... விரும்புகிறேன்
  rationale: காரணத்தைக் குறிப்பிடும் כִּי மற்றும் எலிகூவின் உண்மையான விருப்பத்தை வெளிப்படுத்தும் חפץ ஆகியவற்றைத் தெளிவாகக் காட்டுகிறது.
- source_word: צַדְּקֶךָ
  choice: உன்னைச் சரியென நிலைநாட்ட
  rationale: இங்கு צדק என்பது யோபைத் தத்துவார்த்தமாக நீதிமானாக்குவது அல்ல; அவரது தரப்பு சரியானது எனக் காட்டுவது அல்லது உறுதிப்படுத்துவது. ‘சரியென நிலைநாட்ட’ என்பது அந்தச் சூழல்சார் பொருளைத் தருகிறது.
theological_decisions:
- issue: צַדְּקֶךָ என்பதன் பொருள்
  choice: உன்னைச் சரியென நிலைநாட்ட
  alternative: உன் தரப்பை நியாயப்படுத்த; உன்னைச் சரியானவன் என்று அறிவிக்க
  rationale: எலிகூ, யோபின் பதில் ஏற்றதாக இருந்தால் அவரைச் சரியானவர் எனக் காண விரும்புவதாகக் கூறுகிறார். பவுலின் நிருபங்களில் காணப்படும் இறையியல் சார்ந்த ‘நீதிமானாக்குதல்’ என்ற கருத்தை இங்கு தேவையின்றி ஏற்றாமல், மூலச்சொல்லின் சட்ட/நியாயத் தொனியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான, கண்ணியமான உரையாடல் நடை. ‘வார்த்தைகள்’ என்ற மூலச் சொல்லைத் தக்கவைத்து, தமிழில் இயல்பாக இருக்க ‘சொல்ல’ சேர்க்கப்பட்டது. இறையியல் தவறான ஒலிப்பைத் தவிர்க்க ‘நீதிமானாக்க’ என்பதற்குப் பதிலாக ‘சரியென நிலைநாட்ட’ பயன்படுத்தப்பட்டது.
