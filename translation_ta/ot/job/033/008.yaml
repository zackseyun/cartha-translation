  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தல் (אַךְ), யோபிடம் இரண்டாம் நபர் உரையாடல், ‘என் காதுகளில்/கேள்வியில்’ என்ற செவிப்புலன் குறிப்பு, மற்றும் ‘சொற்களின் ஒலி’ ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. אֶשְׁמָע வடிவத்தில் நிறைவுறா வினையாயினும், முந்தைய உரையை எலிகூ நினைவுகூரும் சூழலில் ‘நான் கேட்டேன்’ என்பது பாதுகாப்பான, இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
  naturalness: ‘உண்மையிலேயே, நான் கேட்கும்படியாக நீ பேசினாய்; உன் சொற்களின் ஒலியை நான் கேட்டேன்:’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. இறுதியிலுள்ள இரட்டைப்புள்ளி அடுத்த வசனத்தில் தொடங்கும் மேற்கோளைச் சரியாக முன்னறிவிக்கிறது.
  terminology: ‘ஒலி,’ ‘சொற்கள்,’ மற்றும் சூழலிலிருந்து வழங்கப்பட்ட ‘உன்’ ஆகியவை பொருத்தமானவை. ‘நான் கேட்கும்படியாக’ என்பது மூலத்தின் ‘என் காதுகளில்’ என்னும் சொல்லாட்சியை இயல்பான தமிழில் செயல்பாட்டு வகையில் தெரிவிக்கிறது. அடிக்குறிப்பு மூலத்தின் சொல்லுக்குச்சொல் வடிவத்தையும் வினைக்கால வேறுபாட்டையும் பயனுள்ளதாகக் காட்டுகிறது.
