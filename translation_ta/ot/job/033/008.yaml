translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் செவிப்புலன் சார்ந்த உருவகத்தை முதன்மை உரையிலும் அடிக்குறிப்பிலும் தக்கவைத்துள்ளது; வசனத்தின் முடிவிலுள்ள இரட்டைப்புள்ளி அடுத்த வசனத்தில் மேற்கோள் தொடர்வதைச் சுட்டுகிறது.
