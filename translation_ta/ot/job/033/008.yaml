source:
  edition: WLC
  text: אַ֭ךְ אָמַ֣רְתָּ בְ/אָזְנָ֑/י וְ/ק֖וֹל מִלִּ֣ין אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: ta
  text: 'உண்மையிலேயே, நான் கேட்கும்படியாக நீ பேசினாய்[a]; உன் சொற்களின் ஒலியை நான் கேட்டேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘நீ என் காதுகளில் சொன்னாய்; சொற்களின் ஒலியை நான் கேட்கிறேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: உண்மையிலேயே
  rationale: இங்கு இது ‘மட்டும்’ என்ற கட்டுப்படுத்தும் பொருளில் அல்லாமல், யோபு கூறியதை எலிகூ உறுதியாக எடுத்துரைக்கும் வலியுறுத்தல் இடைச்சொல்லாக வருகிறது.
- source_word: אָמַרְתָּ
  choice: நீ பேசினாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை நிறைவுவினை, முன்பு நிகழ்ந்த யோபின் பேச்சைக் குறிக்கிறது.
- source_word: בְאָזְנָי
  choice: நான் கேட்கும்படியாக
  rationale: எபிரெய மொழியின் ‘என் காதுகளில்’ என்ற சொற்றொடரை, செவியால் நேரடியாகக் கேட்டதைக் காட்டும் இயல்பான நவீன தமிழாக வழங்குகிறது.
- source_word: וְקוֹל
  choice: ஒலியை
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள் கொள்ளலாம்; ‘சொற்கள்’ என்பதுடன் இங்கு ‘ஒலி’ இயல்பாகவும் செவிப்புலன் சார்ந்த அழுத்தத்தைத் தக்கவைத்தும் அமைகிறது.
- source_word: מִלִּין
  choice: உன் சொற்களின்
  rationale: அரமேயத் தன்மையுள்ள இந்தப் பன்மை வடிவம் ‘சொற்கள்’ என்று பொருள்படும். ‘உன்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், யோபின் பேச்சையே எலிகூ குறிப்பிடுவதால் சூழலிலிருந்து தெளிவாகிறது.
- source_word: אֶשְׁמָע
  choice: நான் கேட்டேன்
  rationale: வடிவில் நிறைவுறா வினையாக இருந்தாலும், முன்பு கூறப்பட்ட பேச்சை எலிகூ நினைவுகூரும் சூழலில் தமிழில் இறந்தகாலம் இயல்பாக அமைகிறது.
