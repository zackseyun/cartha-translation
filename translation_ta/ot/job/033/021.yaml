  text: יִ֣כֶל בְּשָׂר֣/וֹ מֵ/רֹ֑אִי ו/שפי עַ֝צְמוֹתָ֗י/ו לֹ֣א רֻאּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/021.yaml
  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: ta
  text: அவனுடைய சதை கண்ணுக்குத் தெரியாதபடி தேய்ந்துபோகிறது[a]; முன்பு காணப்படாத அவனுடைய எலும்புகள் துருத்தி நிற்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய சதை பார்வையிலிருந்து மறையும் அளவுக்கு அழிந்துபோகிறது; காணப்படாதிருந்த அவனுடைய எலும்புகள் வெளிப்படுகின்றன.” இந்த வரியின் எபிரெயச் சொல்லமைப்பு சுருக்கமானதும் ஓரளவு பொருள் தெளிவற்றதுமாக உள்ளது; குறிப்பாக “துருத்தி நிற்கின்றன” என்று மொழிபெயர்க்கப்பட்ட வினைவடிவம் கடினமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: தேய்ந்துபோகிறது
  rationale: כלה என்ற வினையின் Qal முற்றுப்பெறா வடிவம் உடல் மெலிந்து அழிவதைச் சுட்டுகிறது; இச்சூழலில் இயல்பான தமிழ் சொல்லாட்சியாக இது அமைகிறது.
- source_word: בְּשָׂרוֹ
  choice: அவனுடைய சதை
  rationale: உடலின் சதையைச் சுட்டும் மூலமொழியின் திடமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵרֹאִי
  choice: கண்ணுக்குத் தெரியாதபடி
  rationale: מן + רֹאִי என்பது பார்வையிலிருந்து மறையும் விளைவைத் தெரிவிக்கிறது; தமிழில் இதனை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: וְשֻׁפִי
  choice: வெளியே துருத்திக்கொண்டு நிற்கின்றன
  rationale: இவ்வடிவம் கடினமானதும் பொருள் உறுதியற்றதுமாக இருந்தாலும், சதை தேய்வதால் எலும்புகள் வெளிப்படையாகத் துருத்தும் காட்சியைச் சூழல் ஆதரிக்கிறது.
- source_word: עַצְמוֹתָיו
  choice: அவனுடைய எலும்புகள்
  rationale: பன்மைப் பெயர்ச்சொல்லையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியையும் நேரடியாக வழங்குகிறது.
- source_word: לֹא רֻאּוּ
  choice: முன்பு காணப்படாத
  rationale: ראה என்பதன் செயல்பாட்டு எதிர்மறைப் பொருள் எலும்புகள் இதற்கு முன் புலப்படவில்லை என்பதைச் சுட்டுகிறது; ‘முன்பு’ என்பது உள்ளார்ந்த கால வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
