  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: ta
  text: 'அப்போது அவர்[c] அவனிடம் கருணை காட்டி,


    “அவன் படுகுழியில்[b] இறங்காதபடி அவனை விடுவி;


    நான் ஒரு மீட்புவிலையைக் கண்டேன்[a]”


    என்று சொன்னார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீட்புவிலை” என்பதற்கு “ஈட்டுத்தொகை” அல்லது “பாவநிவிர்த்திக்கான விலை” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் விடுதலையைப் பெற்றுத்தரும் விலையைக் குறிக்கிறது; சில சூழல்களில் பாவநிவிர்த்திசார் நிழற்பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “படுகுழி” என்பது கல்லறை, மரணம் அல்லது அழிவையும் உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவர்” என்பது முந்தைய வசனத்தில் கூறப்பட்ட தூதர் அல்லது மத்தியஸ்தரைக் குறிக்கலாம்; தேவனைக் குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள். எபிரெயத்தில் கர்த்தா இங்கு வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: அவர் அவனுக்கு இரக்கம் காட்டி
  rationale: חנן என்பது அருள், தயவு, இரக்கம் காட்டுவதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும், வெறும் பரிதாபமாகக் குறுக்காமல் அருள்சார்ந்த நுண்பொருளையும் தக்கவைக்கவும் ‘இரக்கம் காட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֹּאמֶר
  choice: என்று சொல்கிறார்
  rationale: இது தொடர்நிலை உரையாடலை அறிமுகப்படுத்தும் வாவ்-தொடர் வினை. சூழலின் உயிரோட்டத்தை இயல்பான தமிழில் தர நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: פְּדָעֵהוּ
  choice: அவனை விடுவியும்
  rationale: פדה என்பது மீட்டல், மீட்புவிலை கொடுத்து விடுவித்தல், அல்லது காப்பாற்றுதல் எனப் பொருள்படும். அடுத்துவரும் כֹפֶר ஏற்கெனவே மீட்புவிலை எண்ணத்தை வெளிப்படுத்துவதால், வினைச்சொல்லில் அதை இரட்டிப்பாக்காமல் ‘விடுவியும்’ எனப்பட்டது.
- source_word: מֵרֶדֶת
  choice: இறங்காதபடி
  rationale: ירד என்பதன் infinitive construct வடிவத்துடன் מִן சேர்ந்து, இறங்குவதிலிருந்து தடுத்தல் என்ற பொருளைத் தருகிறது. தமிழில் ‘இறங்காதபடி’ இயல்பாக அந்தத் தடுப்பு நுண்பொருளை வெளிப்படுத்துகிறது.
- source_word: שַׁחַת
  choice: படுகுழி
  rationale: இந்தச் சொல் குழியைக் குறிக்கும் concrete உருவகத்தைத் தருவதோடு கல்லறை, மரணம், அழிவு ஆகிய நிழற்பொருள்களையும் கொண்டிருக்கலாம். ‘படுகுழி’ உருவகத்தைத் தக்கவைக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מָצָאתִי
  choice: நான் கண்டடைந்தேன்
  rationale: முதல் நபர் ஒருமை perfect வடிவம். விடுதலைக்கான அடிப்படை இப்போது கிடைத்துள்ளது என்ற நிறைவு/விளைவு உணர்வை ‘கண்டடைந்தேன்’ தக்கவைக்கிறது.
- source_word: כֹפֶר
  choice: அவனுக்கான மீட்புவிலை
  rationale: כֹפֶר என்பது ஒருவரை விடுவிக்கச் செலுத்தப்படும் விலை அல்லது ஈட்டுத்தொகையைக் குறிக்கலாம்; சில சூழல்களில் பாவநிவிர்த்திசார் நிழற்பொருளும் உண்டு. இங்கு படுகுழியிலிருந்து விடுவிப்பதே உடனடி சூழல் என்பதால் ‘மீட்புவிலை’ தெளிவானதும் பொருத்தமானதும் ஆகும்.
theological_decisions:
- issue: எலிகூவின் உரையில் כֹפֶר என்பதன் பொருள்
  choice: மீட்புவிலை
  alternative: பாவநிவிர்த்தி விலை / ஈட்டுத்தொகை / மூடுதல்
  rationale: படுகுழியில் இறங்காமல் ஒருவரை விடுவிப்பதற்கான அடிப்படையை இவ்வசனம் பேசுகிறது. ‘மீட்புவிலை’ என்பது விடுதலையைப் பெற்றுத்தரும் விலை என்ற நேரடிப் பொருளைத் தக்கவைத்து, பின்னாளைய குறிப்பிட்ட கோட்பாட்டு அர்த்தத்தை உரைக்குள் கட்டாயப்படுத்துவதில்லை. பாவநிவிர்த்திசார் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וַיְחֻנֶּנּוּ மற்றும் וַיֹּאמֶר ஆகியவற்றின் கர்த்தா
  choice: முந்தைய வசனத்தில் கூறப்பட்ட தூதர்/மத்தியஸ்தரையே கர்த்தாவாகத் தொடர்ந்து வாசித்தல்
  alternative: தேவனே இரக்கம் காட்டி உரைக்கிறார் என வாசித்தல்
  rationale: எபிரெயத்தில் கர்த்தா வெளிப்படையாக மீண்டும் குறிப்பிடப்படவில்லை. உடனடி இலக்கணத் தொடர்ச்சி முந்தைய வசனத்தின் தூதரைச் சுட்டக்கூடும்; எனினும் தேவனை கர்த்தாவாகக் கொள்ளும் வாசிப்பும் சாத்தியம். இந்த ambiguity அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நேரடி உரைக்கு மரியாதை ஏவல் வடிவமான ‘விடுவியும்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்லின் concrete உருவகத்தையும் இறையியல் ambiguity-யையும் தக்கவைக்க முதன்மை உரையில் ‘படுகுழி’, ‘மீட்புவிலை’ என்பவை பயன்படுத்தப்பட்டு மாற்று நுண்பொருள்கள் அடிக்குறிப்புகளில் கொடுக்கப்பட்டுள்ளன.
