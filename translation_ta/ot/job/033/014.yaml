source:
  edition: WLC
  text: כִּֽי בְ/אַחַ֥ת יְדַבֶּר אֵ֑ל וּ֝/בִ/שְׁתַּ֗יִם לֹ֣א יְשׁוּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: ta
  text: ஏனெனில், கடவுள் ஒரு வழியில்[a], இரண்டு வழிகளில் பேசுகிறார்; ஆனால் மனிதர் அதை உணர்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் ஒருமுறை, இருமுறை பேசுகிறார்; ஆனாலும் மனிதர் அதைக் கவனிப்பதில்லை.” எபிரெய எண்ணுப்பெயர்களை நிகழ்வுகளின் எண்ணிக்கையாக (“ஒருமுறை… இருமுறை”) அல்லது பேசும் வழிகளாக (“ஒரு வழியில்… இரண்டு வழிகளில்”) புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிகூ கூறியதற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְאַחַת
  choice: ஒரு விதத்தில்
  rationale: பெண்பால் எண்ணுப்பெயருடன் வரும் முன்னிடைச்சொல் இங்கு பேசும் முறை அல்லது நிகழ்வைக் குறிக்கலாம். முதன்மை உரையில் முறையைக் குறிக்கும் வாசிப்பு இயல்பாக உள்ளது; எண்ணிக்கையைக் குறிக்கும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְדַבֶּר
  choice: பேசுகிறார்
  rationale: பொதுவாக அல்லது வழக்கமாக நிகழும் செயலைக் குறிக்கும் எபிரெய வினைவடிவத்தை நிகழ்காலத் தமிழ் இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל என்னும் பொதுவான இறைப்பெயரை, கூடுதல் இறையியல் நுணுக்கம் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: וּבִשְׁתַּיִם
  choice: இரு விதங்களிலும்
  rationale: முதல் எண்ணுடன் உள்ள கவிதை இணைப்பைப் பேணியபடி, தமிழில் பேசும் முறைகளைக் குறிப்பது தெளிவாக அமைகிறது.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: ஆனால் மனிதர் அதை உணருவதில்லை
  rationale: שׁור என்பதன் ‘நோக்குதல், கவனித்தல், உணர்தல்’ என்ற பொருள்களில், தொடர்ந்து வரும் கனவு மற்றும் துன்பத்தின் வழியான இறைச்செய்தி சூழலுக்கு ‘உணருதல்’ பொருந்துகிறது. வெளிப்படாத ஒருமை ஆண்பால் எழுவாய் பொதுவான மனிதரைக் குறிக்கிறது.
theological_decisions:
- issue: இறுதிக் கூறில் வெளிப்படையாகச் சொல்லப்படாத மனித எழுவாய்
  choice: பொதுவான மனித எழுவாயாக ‘மனிதர்’
  alternative: ‘அவன் அதை உணருவதில்லை’
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாத மூன்றாம் நபர் ஆண்பால் ஒருமை வடிவம் உள்ளது. சூழலில் அது ஒரு குறிப்பிட்ட ஆணை அல்ல, பொதுவாக மனிதரைச் சுட்டுகிறது; ‘மனிதர்’ இதை இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
- issue: எபிரெய எண்ணுப்பெயர்களின் பொருள்
  choice: பேசும் முறைகளாக ‘ஒரு விதத்தில்… இரு விதங்களிலும்’
  alternative: நிகழ்வுகளின் எண்ணிக்கையாக ‘ஒருமுறை… இருமுறை’
  rationale: இரு வாசிப்புகளுக்கும் எபிரெய மொழி இடமளிக்கிறது. அடுத்த வசனங்களில் கடவுள் தொடர்புகொள்ளும் வெவ்வேறு வழிகள் வருவதால் முறையைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் கொள்ளப்பட்டது; உண்மையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதை இணைப்பை ஓரளவு பேணி, சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘உணருவதில்லை’ என்பது வெறுமனே கேட்காததைக் காட்டிலும், கடவுளின் பேச்சை அறிந்துகொள்ளத் தவறுவதை வெளிப்படுத்துகிறது.
