  text: הִנֵּ֣ה אֵ֭מָתִ/י לֹ֣א תְבַעֲתֶ֑/ךָּ וְ֝/אַכְפִּ֗/י עָלֶ֥י/ךָ לֹא יִכְבָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: ta
  text: இதோ, என்னால் ஏற்படும் அச்சம் உன்னை அச்சுறுத்தாது; என் கை[a] உன்மேல் பாரமாக இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அழுத்தம்.” אַכְפִּי என்ற எபிரெயச் சொல் கடினமானது. இது பாரம்பரியமாக, சொல்லுக்கு நெருக்கமாக “என் கை” என மொழிபெயர்க்கப்படுகிறது; இச்சூழலில் அது செலுத்தப்படும் அழுத்தம் அல்லது பாரம் என்னும் கருத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து உறுதியளிக்கும் எபிரெய இடைச்சொல்லின் வலியுறுத்தலை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵמָתִי
  choice: என்னால் உண்டாகும் திகில்
  rationale: பேசுகிறவருடன் தொடர்புடைய அல்லது அவரால் ஏற்படும் திகிலைச் சுட்டும் சொல். ‘என் பயம்’ என்பது பேசுகிறவர் அனுபவிக்கும் பயம் என்று தவறாகப் புரியக்கூடும் என்பதால் இவ்வாறு தெளிவாக்கப்பட்டுள்ளது.
- source_word: תְבַעֲתֶךָ
  choice: உன்னை அச்சுறுத்தாது
  rationale: בעת என்பதன் பியேல் வடிவம் கடுமையாக அச்சமூட்டுதல் அல்லது திகிலடையச் செய்தல் என்னும் பொருளுடையது; தமிழில் இயல்பாகவும் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: אַכְפִּי
  choice: என் அழுத்தம்
  rationale: சொல் கடினமானது; பாரம்பரியமாக ‘என் கை’ எனப் புரிந்துகொள்ளப்பட்டாலும், כבד (‘பாரமாக இரு’) என்பதுடன் இங்கு ஒருவர்மேல் செலுத்தப்படும் அழுத்தம் என்ற சூழற்பொருள் பொருந்துகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עָלֶיךָ
  choice: உன்மேல்
  rationale: על மற்றும் இரண்டாம் நபர் ஆண்பால் ஒருமை விகுதியின் நேரான, இயல்பான தமிழ் இணை.
- source_word: יִכְבָּד
  choice: பாரமாக இருக்காது
  rationale: כבד என்பதன் அடிப்படைப் பொருளான ‘பாரமாக இருத்தல்’ என்பதைக் காத்து, முந்தைய பெயர்ச்சொல்லோடு இயல்பாக இணைக்கிறது.
