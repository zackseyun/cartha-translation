source:
  edition: WLC
  text: וַ/תִּקְרַ֣ב לַ/שַּׁ֣חַת נַפְשׁ֑/וֹ וְ֝/חַיָּת֗/וֹ לַֽ/מְמִתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: ta
  text: 'அவனுடைய உயிர் படுகுழியை[a] நெருங்குகிறது;

    அவனுடைய வாழ்வு மரணத்தைக் கொண்டுவருகிறவர்களை[b] நெருங்குகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படுகுழி’ என்பதற்கு ‘கல்லறை’ அல்லது ‘அழிவு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இறந்தவர்களை’ அல்லது ‘மரணத்தின் சக்திகளை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; அது மரணத்தை ஏற்படுத்துகிறவர்களையோ மரணத்தின் ஆட்சி அல்லது சக்திகளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: நெருங்குகிறது
  rationale: קרב என்பதன் ‘அருகில் வருதல்/நெருங்குதல்’ என்ற பொருளைத் தருகிறது. வடிவம் இறந்தகாலக் கதைநடையாகப் புரிந்துகொள்ளப்படலாம் என்றாலும், இங்கு துன்புறும் மனிதனின் நிலையை விவரிக்கும் கவிதைச் சூழலில் நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: לַשַּׁחַת
  choice: படுகுழியை
  rationale: שׁחת என்பது குழி, கல்லறை அல்லது அழிவு எனப் பொருள்படலாம். ‘படுகுழி’ மூலத்தின் உருவகத் தன்மையையும் மரணத்தை நோக்கிய கவிதைச் சித்திரத்தையும் காக்கிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிர்
  rationale: נפש என்பது உயிர், உயிருள்ள நபர், தன்முழுமை போன்ற பரந்த பொருள்களைக் கொண்டது. ‘உயிர்’ என்பது இங்கு இயல்பான தமிழாகவும், குறிப்பிட்ட உடல்–ஆன்மா கோட்பாட்டைத் திணிக்காததாகவும் உள்ளது.
- source_word: וְחַיָּתוֹ
  choice: அவனுடைய வாழ்வு
  rationale: இச்சொல் வாழ்வு அல்லது உயிருள்ள நிலை என்பதைக் குறிக்கிறது. முதல் அடியிலுள்ள ‘உயிர்’ என்பதுடன் கவிதை இணைநிலையைப் பேணியபடியே சொல் வேறுபாட்டையும் ‘வாழ்வு’ காக்கிறது.
- source_word: לַמְמִתִים
  choice: மரணத்தைக் கொண்டுவருகிறவர்களை
  rationale: இந்தக் கடினமான வடிவத்தை מות என்பதன் மரணத்தை ஏற்படுத்தும் செயற்பொருளில் எடுத்துக்கொள்கிறது. மனிதக் கொலையாளிகள் என்று அளவுக்கு மீறிக் குறிப்பாக்காமல், செயப்பாட்டுத் தன்மையை மொழிபெயர்ப்பு காக்கிறது; மற்ற வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: נַפְשׁוֹ மற்றும் וְחַיָּתוֹ ஆகியவற்றின் மனித இயல்பு சார்ந்த இணைநிலை
  choice: ‘அவனுடைய உயிர்’ மற்றும் ‘அவனுடைய வாழ்வு’ என்று மொழிபெயர்த்து, கவிதைச் சொல் வேறுபாட்டைப் பேணுதல்
  alternative: முதற்சொல்லை ‘அவனுடைய ஆன்மா’ என்று மொழிபெயர்த்தல் அல்லது இரண்டையும் ஒரேபோல் ‘உயிர்’ என்று சமப்படுத்தல்
  rationale: இரு சொற்களும் கவிதையில் நெருங்கிய பொருளுடன் இணையாக வருகின்றன. ‘ஆன்மா’ என்பது தேவையற்ற தொழில்நுட்பமான உடல்–ஆன்மா இருமையை உணர்த்தக்கூடும்; இரண்டையும் ஒரே சொல்லாக்குவது மூலச் சொல் வேறுபாட்டை மறைக்கும்.
- issue: לַמְמִתִים குறிக்கும் மரணத் தொடர்புடையவர்கள் அல்லது சக்திகள்
  choice: மரணத்தைக் கொண்டுவருகிறவர்கள் என்ற செயற்பொருளை முதன்மை உரையில் வைத்தல்
  alternative: இறந்தவர்கள், மரணம் அல்லது மரணத்தின் சக்திகள் என்று புரிந்துகொள்ளுதல்
  rationale: எபிரெய வடிவத்தின் செயற்பொருள் வாய்ப்பை முதன்மை உரை வெளிப்படுத்துகிறது; ஆனால் சொற்றொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ போன்ற சமயத் தொழில்நுட்பச் சொல்லைத் தவிர்த்து, ‘உயிர்/வாழ்வு’ என்ற இணைநிலை மூலம் மூலத்தின் வேறுபாடும் பொருள் நெருக்கமும் பேணப்பட்டுள்ளன.
