  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: ta
  text: 'அதன் கழுத்தில் வலிமை குடிகொண்டிருக்கிறது;

    அதற்கு முன்னால் திகில் துள்ளிப் பாய்கிறது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு முன்னால் மனக்கலக்கம் துள்ளிப் பாய்கிறது.” எபிரெயச் சொல்லான דְּאָבָה அரிதானது; இந்தக் கவிதைச் சூழலில் அது மனக்கலக்கம் அல்லது மனத்தளர்ச்சி முதல் திகில் வரை பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: அதன் கழுத்தில்
  rationale: בְּ முன்னொட்டு இடத்தைக் குறிக்கிறது; உயிரினத்தைக் குறிப்பதால் ஆண்பால் வடிவத்தைத் திணிக்காமல் இயல்பான தமிழ் ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: יָלִין
  choice: குடிகொண்டிருக்கிறது
  rationale: לין என்பதன் அடிப்படைப் பொருள் ‘இரவைக் கழித்தல்/தங்குதல்’; இங்கு வலிமை நிலையாக உறைவதை உயிரூட்டிக் காட்டும் உருவகத்தைத் தமிழ் இயல்பில் காக்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: பலத்தையும் ஆற்றலையும் குறிக்கும் பொதுவான பெயர்ச்சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: וּלְפָנָיו
  choice: அதற்கு முன்னால்
  rationale: פנים உடனான இச்சொற்றொடர் ‘அதன் முன்பாக/முன்னால்’ என்ற இடவியல் பொருளைத் தருகிறது.
- source_word: תָּדוּץ
  choice: துள்ளிப் பாய்கிறது
  rationale: அரிதான דוץ வினை துள்ளுதல் அல்லது பாய்தல் என்னும் இயக்கத்தைத் தருகிறது; இரு நிழற்பொருள்களையும் இயல்பான கவித்துவத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: דְּאָבָה
  choice: திகில்
  rationale: அரிதான இப்பெயர்ச்சொல் கலக்கம், மனத்தளர்ச்சி, அச்சம் அல்லது திகில் ஆகிய பொருள் வரம்பைக் கொண்டிருக்கலாம்; இச்சூழலில் முன்னால் பாயும் அச்சுறுத்தும் சக்தியாக ‘திகில்’ பொருந்துகிறது, ஆனால் உறுதியற்ற தன்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
