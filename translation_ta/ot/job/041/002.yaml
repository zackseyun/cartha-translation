source:
  edition: WLC
  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: ta
  text: அவனைத் தூண்டிவிடும் அளவுக்கு மூர்க்கமானவன் யாரும் இல்லை[a]. அப்படியானால், என் முன் நிற்கக்கூடியவன் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை எழுப்பிவிடும் அளவுக்குக் கொடூரமானவன் யாரும் இல்லை.” எபிரெய வினைச்சொல் “எழுப்புதல்” அல்லது “கிளர்த்துதல்” என்று பொருள்படும்; இங்கு லிவியாதானைச் சீண்டித் தூண்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: கொடியவன் ஒருவனும் இல்லை
  rationale: לֹא என்பதையும் ‘கொடிய, மூர்க்கமான’ என்ற பொருளுடைய אַכְזָר என்பதையும் இயல்பான தமிழ் எதிர்மறை வாக்கியமாகத் தருகிறது. சூழலில் இது ஒழுக்கரீதியான இரக்கமின்மையைவிட அச்சமூட்டும் மூர்க்கத்தைக் குறிக்கிறது.
- source_word: כִּי יְעוּרֶנּוּ
  choice: அவனைத் தூண்டிவிடத் துணியும் அளவுக்கு
  rationale: עור வினை அடிப்படையில் ‘எழுப்பு, கிளர்த்திவிடு’ என்று பொருள்படும்; இங்கு லிவியாதானைச் செயல்படும்படி சீண்டுவதைக் குறிக்கிறது. ‘துணியும்’ என்பது எபிரெயச் சொல்லின் தனிப்பொருள் அல்ல என்றாலும், சொல்லாட்சியின் வினாவியல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִי הוּא
  choice: அப்படியானால் ... யார்?
  rationale: இணைப்புச்சொல்லும் வினாப்பெயரும் முதல் கூற்றிலிருந்து அடுத்த முடிவுக்கு நகர்த்துகின்றன. ‘அப்படியானால்’ அதன் அனுமானத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: לְפָנַי
  choice: எனக்கு முன்பாக
  rationale: ‘என் முகத்திற்கு முன்’ அல்லது ‘என் முன்னிலையில்’ என்ற இடவியல் உருவகத்தைச் சுருக்கமாகவும் நேரடியாகவும் காக்கிறது.
- source_word: יִתְיַצָּב
  choice: நிலைநிற்கக்கூடியவன்
  rationale: Hitpael வடிவம் தன்னை நிறுத்திக்கொள்ளுதல் அல்லது நிலைகொண்டு நிற்றல் என்பதைக் குறிக்கிறது. இங்கு தேவனுக்கு முன்பாக எதிர்நின்று தாங்கக்கூடிய ஆற்றலைக் கேள்விக்குள்ளாக்குகிறது.
theological_decisions:
- issue: முதல் பகுதியில் லிவியாதானைப் பற்றிய பேச்சிலிருந்து இரண்டாம் பகுதியில் தேவனைப் பற்றிய பேச்சுக்கு மாறுதல்
  choice: ‘எனக்கு முன்பாக’ என்பதைத் தேவன் தம்மைக் குறிப்பதாக மொழிபெயர்த்து, படைப்பைத் தூண்டவே யாரும் துணியாதபோது படைத்தவருக்கு முன் யார் நிற்க முடியும் என்ற வலியதிலிருந்து மிகவலியதற்கான வாதத்தைப் பாதுகாத்தல்
  alternative: இரண்டு பகுதிகளுமே லிவியாதானை மட்டுமே குறிப்பதாக வாசித்தல்
  rationale: לְפָנַי என்பதிலுள்ள முதலாம் நபர் ஒருமை பின்னொட்டு ‘எனக்கு முன்பாக’ என்று தெளிவாகக் கூறுகிறது; சுற்றியுள்ள பகுதியிலும் தேவனே பேசுகிறார். ஆகவே இரண்டாம் பகுதி படைப்பிலிருந்து படைத்தவரை நோக்கி நகர்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நிலைநிற்கக்கூடியவன்’ என்ற சொல் மூலத்தின் உருவகத்தையும் வினாவின் இறையியல் வலிமையையும் காக்கிறது.
