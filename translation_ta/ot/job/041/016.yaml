  text: לִ֭בּ/וֹ יָצ֣וּק כְּמוֹ אָ֑בֶן וְ֝/יָצ֗וּק כְּ/פֶ֣לַח תַּחְתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: ta
  text: 'அதன் இதயம் கல்லைப்போல் கடினமாக உள்ளது;

    கீழ்த்திரிகைக் கல்லைப்போல் கடினமாக உள்ளது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கீழ்த்திரிகைக் கல்லைப்போல் உறுதியாக உள்ளது” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் அடிப்படையில் “வார்க்கப்பட்ட” என்பதுடன் தொடர்புடையது; இங்கு அது இறுகிய, திடமான அல்லது கடினமான தன்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: அதன் இதயம்
  rationale: לֵב என்பது உள்ளார்ந்த சிந்தனை, மனவுறுதி, இயல்பு ஆகியவற்றின் மையத்தைக் குறிக்கலாம்; இங்குள்ள உட்புறக் கடினத்தின் உருவகத்துக்கு ‘இதயம்’ இயல்பாகப் பொருந்துகிறது. லிவியாதான் உயிரினமாக விவரிக்கப்படுவதால் தமிழில் ‘அதன்’ பயன்படுத்தப்பட்டது.
- source_word: יָצוּק
  choice: கடினமாய் இருக்கிறது / உறுதியாய் இருக்கிறது
  rationale: יצק என்பதன் அடிப்படைப் பொருள் ‘ஊற்றுதல், வார்த்தல்’; இங்கு வார்க்கப்பட்ட பொருளைப் போன்ற இறுக்கம், திடத்தன்மை, கடினம் ஆகியவற்றைக் குறிக்கிறது. முதல் வரியில் கல்லுடன் வரும் ஒப்புமைக்கு ‘கடினமாய்’ என்றும், இணைவரியில் மீளுரையின் நுண்ணிய பொருளை வெளிப்படுத்த ‘உறுதியாய்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: כְּמוֹ אָבֶן
  choice: கல்லைப்போல்
  rationale: நேரடியான உவமையைச் சுருக்கமான, இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: கீழ் திரிகைக்கல்லைப்போல்
  rationale: פֶלַח என்பது துண்டு அல்லது பகுதியைக் குறிக்கக்கூடும்; תַּחְתִּית உடனான இச்சேர்க்கை பொதுவாகத் திரிகையின் கீழ்க்கல்லைக் குறிக்கிறது. ‘கீழ் திரிகைக்கல்’ அதன் கனத்தையும் திடத்தன்மையையும் தெளிவாக உணர்த்துகிறது.
