translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைநடையைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. ‘திரிகைக்கல்’ என்பது கையால் அல்லது இயந்திரமாகத் தானியத்தை அரைக்கும் இரு கற்களில் கீழே இருக்கும் கல்லை இயல்பாகக் குறிக்கிறது; ‘அதன்’ என்பது உயிரினத்தைக் குறிக்கும் நடுநிலைச் சுட்டுப்பெயராகப் பயன்படுத்தப்பட்டது.
