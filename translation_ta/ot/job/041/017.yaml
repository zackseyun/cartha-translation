source:
  edition: WLC
  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: ta
  text: அது எழும்பும்போது வலிமைமிக்கவர்கள் அஞ்சுகிறார்கள்; அதன் மோதல்களால் அவர்கள் நிலைகுலைந்து போகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலைகுலைந்து போகிறார்கள்” என்பதற்கான எபிரெயச் சொல் அரிதானது; “திகைத்துப் போகிறார்கள்” அல்லது “தன்னிலை இழக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: יִתְחַטָּאוּ என்பதன் அரிதான, விவாதத்திற்குரிய சூழற்பொருளை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: அது எழும்பும்போது
  rationale: שֵׂאתוֹ என்பதைக் ‘அது எழுதல்/தன்னை உயர்த்துதல்’ என்று புரிந்து, לִוְיָתָן எழும்பும் நிகழ்வைக் குறிக்கும் இயல்பான தமிழாக்கம் தரப்பட்டது.
- source_word: אֵלִים
  choice: வலிமைமிக்கவர்கள்
  rationale: இங்கு אֵלִים என்பது சூழலில் ‘வலியவர்கள்/வல்லவர்கள்’ எனப் பொருள்படுகிறது; ‘தேவர்கள்’ என்று மொழிபெயர்ப்பது தேவையற்ற தெய்வவியல் பொருளைச் சேர்க்கக்கூடும்.
- source_word: מִשְּׁבָרִים
  choice: அதன் மோதல்களால்
  rationale: שְׁבָרִים என்பதற்கு ‘உடைதல்கள், பேரலை மோதல்கள், அதிர்ச்சிகள்’ என்ற பொருள் வரம்பு உள்ளது. நீர்வாழ் உயிரினச் சூழலுக்கும் ஆங்கில ஆலோசனை அடுக்கின் ‘crashing’ என்பதற்கும் ஏற்றபடி ‘மோதல்கள்’ தேர்ந்தெடுக்கப்பட்டது; உடைமைத் தொடர்பு தமிழில் தெளிவதற்காக ‘அதன்’ சேர்க்கப்பட்டது.
- source_word: יִתְחַטָּאוּ
  choice: அவர்கள் நிலைகுலைந்து போகிறார்கள்
  rationale: அரிதான இவ்வடிவம் இங்கு ‘தங்களை இழத்தல், பதறுதல், திகைத்தல்’ என்னும் பொருளில் புரிந்துகொள்ளப்படுகிறது. ‘நிலைகுலைந்து போகிறார்கள்’ என்பது பயத்தால் தன்னிலை தவறும் நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵלִים என்பதன் அடையாளம்
  choice: வலிமைமிக்கவர்கள்
  alternative: தேவர்கள்
  rationale: உடனடி கவிதைச் சூழல் லிவ்யாதானைக் கண்டு அஞ்சும் வலியவர்களைச் சுட்டுகிறது. ‘தேவர்கள்’ என்ற மாற்று எபிரெயச் சொல்லின் சாத்தியமான வடிவப் பொருளாக இருந்தாலும், இங்கு தேவையற்ற தெய்வவியல் குறிப்பாக்கத்தை உருவாக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. உயிரினத்தைக் குறிக்க ஒருமை அஃறிணை ‘அது/அதன்’ பயன்படுத்தப்பட்டது; இரண்டாம் அரையடியின் அரிதான வினைச்சொல்லின் ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
