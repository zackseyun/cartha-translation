  text: יַחְשֹׁ֣ב לְ/תֶ֣בֶן בַּרְזֶ֑ל לְ/עֵ֖ץ רִקָּב֣וֹן נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: ta
  text: அது இரும்பை வைக்கோலாகவும், வெண்கலத்தை[a] உளுத்துப்போன மரமாகவும் கருதுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘செம்பை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: கருதுகிறது
  rationale: חשׁב இங்கு ஒரு பொருளை எவ்வாறு மதிப்பிடுகிறது அல்லது எண்ணுகிறது என்பதைக் குறிக்கிறது; ‘கருதுகிறது’ என்பது இந்த மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְתֶבֶן
  choice: வைக்கோலாக
  rationale: תבן பொதுவாக வைக்கோல் அல்லது கால்நடைத் தீவனமாகப் பயன்படும் உலர்ந்த தாள்களைக் குறிக்கிறது; ஒப்புமையைக் குறிக்கும் לְ என்பதையும் ‘-ஆக’ வெளிப்படுத்துகிறது.
- source_word: בַּרְזֶל
  choice: இரும்பை
  rationale: இந்த உலோகத்திற்கான நேரடியான, வழக்கமான தமிழ்ச் சொல்.
- source_word: לְעֵץ רִקָּבוֹן
  choice: உளுத்துப்போன மரமாக
  rationale: சொற்றொடர் நேரடியாக ‘அழுகலின் மரம்’ என்ற கருத்தைத் தருகிறது; ‘உளுத்துப்போன மரம்’ வலுவிழந்து சிதைந்த மரத்தின் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: נְחוּשָׁה
  choice: வெண்கலத்தை
  rationale: נְחוּשָׁה என்பது செம்பையோ வெண்கலத்தையோ குறிக்கலாம். ஆயுதம் மற்றும் வலிமையான உலோகங்கள் பற்றிய இச்சூழலில் ‘வெண்கலம்’ பொருத்தமான முதன்மைத் தேர்வு; உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமும் எளிதில் புரியும் நடையும் பேணப்பட்டுள்ளன. எபிரெயச் செய்யுளின் இணையான இரு ஒப்புமைகளும் ‘-ஆகவும் ... -ஆகவும்’ என்ற அமைப்பில் காக்கப்பட்டுள்ளன; முந்தைய சூழலில் வரும் உயிரினத்தைக் குறிக்க இயல்பான நடுநிலைச் சுட்டுப்பெயரான ‘அது’ பயன்படுத்தப்பட்டுள்ளது.
