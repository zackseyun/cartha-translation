  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: ta
  text: அதன் சதையின் மடிப்புகள் ஒன்றோடொன்று ஒட்டிக்கொண்டிருக்கின்றன; அவை அதன்மேல் வார்க்கப்பட்டதுபோல் உறுதியாகப் பதிந்துள்ளன[a]; அவற்றை அசைக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை அதன்மேல் உறுதியாகப் பதிந்துள்ளன.” எபிரெயச் சொல், ஊற்றி வார்க்கப்பட்ட ஒன்று இறுக நிலைபெறுவதைப் போன்ற உருவகத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: மடிப்புகள்
  rationale: இச்சொல் தொங்கும் அல்லது மடிந்த உடற்பகுதிகளைக் குறிக்கலாம்; இங்கு ‘மடிப்புகள்’ என்பது உடல் சார்ந்த உருவகத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: בְשָׂרוֹ
  choice: அதன் சதை
  rationale: בשר என்பதன் அடிப்படைப் பொருளான ‘சதை’ என்பதைக் காக்கிறது; ‘தோல்’ அல்லது ‘உடல்’ என விளக்கமாக விரிவுபடுத்தவில்லை.
- source_word: דָבֵקוּ
  choice: ஒன்றோடொன்று ஒட்டிக்கொண்டிருக்கின்றன
  rationale: דבק குறிக்கும் நெருக்கமான ஒட்டுதலை வெளிப்படுத்துகிறது; பன்மை எழுவாயான மடிப்புகளுக்கிடையேயான இணைப்பையும் தமிழில் தெளிவாக்குகிறது.
- source_word: יָצוּק
  choice: வார்க்கப்பட்டதுபோல் உறுதியாக உள்ளன
  rationale: ஊற்றப்பட்ட அல்லது வார்க்கப்பட்ட பொருள் இறுக நிலைபெறும் உருவகத்தையும், இச்சூழலில் உள்ள உறுதியான பதிப்பையும் ஒருங்கே காக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முன்னிடைச்சொல்லையும் உயிரினத்தைக் குறிக்கும் ஒருமை பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּל
  choice: முடியாது
  rationale: கவிதை நடையின் எதிர்மறையை அடுத்த வினையுடன் இணைத்து இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘ஒருபோதும்’ என்ற காலவியல் வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: יִמּוֹט
  choice: அசைக்க
  rationale: Niphal வடிவம் குறிக்கும் அசைக்கப்படுதல் அல்லது நிலைகுலைதலை இச்சூழலில் தெளிவாகத் தருகிறது.
