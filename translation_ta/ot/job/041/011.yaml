  text: מִ֭/פִּי/ו לַפִּידִ֣ים יַהֲלֹ֑כוּ כִּיד֥וֹדֵי אֵ֝֗שׁ יִתְמַלָּֽטוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/011.yaml
  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: ta
  text: 'அதன் வாயிலிருந்து தீப்பந்தங்கள் புறப்படுகின்றன;

    நெருப்புப் பொறிகள்[a] பாய்ந்து வெளிவருகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த அரிதான எபிரெயச் சொல்லை ‘எரியும் கொள்ளிக்கட்டைகள்’ அல்லது ‘நெருப்பு அம்புகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: அதன் வாயிலிருந்து
  rationale: מִן + פֶּה என்பதன் இயல்பான பொருள் ‘வாயிலிருந்து.’ எபிரெய மொழியில் ஆண்பால் ஒருமை விகுதி இருந்தாலும், தமிழில் விலங்கைக் குறிக்க இயல்பான ‘அதன்’ பயன்படுத்தப்படுகிறது.
- source_word: לַפִּידִים
  choice: தீப்பந்தங்கள்
  rationale: לַפִּידִים என்பது பொதுவாக எரியும் பந்தங்கள் அல்லது தீப்பந்தங்களைக் குறிக்கிறது. மூலத்தின் திடமான உருவகத்தை இது காக்கிறது.
- source_word: יַהֲלֹכוּ
  choice: புறப்படுகின்றன
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்’; வாயிலிருந்து வெளிவரும் தீப்பந்தங்களைக் குறிக்கும் இச்சூழலில் ‘புறப்படுகின்றன’ என்பது திசையையும் இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּידֹדֵי אֵשׁ
  choice: நெருப்புப் பொறிகள்
  rationale: כִּידֹדֵי என்பது அரிதானதும் பொருள் விவாதத்துக்குரியதுமான சொல். கவிதை இணைநிலையில் அது தீப்பொறிகள் அல்லது எரியும் எறிபொருட்களைக் குறிக்கலாம்; ‘நெருப்புப் பொறிகள்’ சூழலின் தீ உருவகத்துக்கு இயல்பாகப் பொருந்துகிறது, ஆனால் மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יִתְמַלָּטוּ
  choice: பாய்ந்து வருகின்றன
  rationale: מלט என்பதன் அடிப்படை உணர்வு ‘தப்பி வெளியேறு.’ இங்கு தீ வாயிலிருந்து திடீரென வெளிப்படுவதைச் சித்தரிப்பதால், ‘பாய்ந்து வருகின்றன’ அதன் வேகமான இயக்கத்தை இயல்பான தமிழில் தருகிறது.
