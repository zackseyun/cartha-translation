  text: אַ֭חֲרָי/ו יָאִ֣יר נָתִ֑יב יַחְשֹׁ֖ב תְּה֣וֹם לְ/שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: ta
  text: அதன் பின்னால்[a] ஒரு பாதை ஒளிர்கிறது; ஆழ்கடல் நரைத்தது என ஒருவர் நினைப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதற்குப் பின் ஒரு பாதை ஒளிர்கிறது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கால அடிப்படையில் ‘அதற்குப் பின்’ என்றும் இட அடிப்படையில் ‘அதன் பின்னால்’ என்றும் வாசிக்கப்படலாம்; நீரில் பின்னே விடப்படும் தடத்தைச் சூழல் குறிப்பிடுவதால், ‘அதன் பின்னால்’ என்பது முதன்மை உரையில் கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘ஆழ்கடலை நரைத்ததாக எண்ணுவார்.’ கடல் நுரையால் வெண்மையாகி, நரைத்ததுபோல் தோன்றுவதை இந்த உருவகம் சித்தரிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அதன் பின்னால்
  rationale: இந்தச் சொல் கால அடிப்படையில் ‘அதற்குப் பின்’ என்றும் இட அடிப்படையில் ‘அதன் பின்னால்’ என்றும் பொருள்படலாம். லிவியாதான் நீரில் செல்லும்போது பின்னே உருவாகும் தடத்தைச் சூழல் வருணிப்பதால், இடம் சார்ந்த பொருள் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָאִיר
  choice: ஒளிர்கிறது
  rationale: אור என்பதன் ஹிஃபில் வடிவம் ‘ஒளி தருதல்’ அல்லது ‘ஒளிர்தல்’ என்று பொருள்படும். நீரில் தென்படும் வெண்மையான தடத்தின் பிரகாசத்தை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: נָתִיב
  choice: ஒரு பாதை
  rationale: இச்சொல் பாதை அல்லது தடத்தைக் குறிக்கிறது. இங்கு லிவியாதான் நீரைக் கடந்து செல்லும்போது உருவாகும் ஒளிரும் வழித்தடத்தை உருவகமாகக் குறிக்கிறது.
- source_word: יַחְשֹׁב
  choice: ஒருவர் நினைப்பார்
  rationale: இலக்கண வடிவம் மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், பொதுவான பார்வையாளரின் எண்ணத்தைச் சொல்லும் ஆளில்லாப் பயன்பாடாகப் புரிந்துகொள்ளலாம். ‘ஒருவர் நினைப்பார்’ அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: תְּהוֹם
  choice: ஆழ்கடல்
  rationale: இச்சொல் ஆழமான நீர்ப்பரப்பைக் குறிக்கிறது. ‘ஆழ்கடல்’ கவித்துவ வலிமையையும் சூழலின் கடல் காட்சியையும் தெளிவாகத் தருகிறது.
- source_word: לְשֵׂיבָה
  choice: நரைத்திருப்பதாக
  rationale: שֵׂיבָה என்பது நரை, நரைத்த தன்மை அல்லது முதுமையைக் குறிக்கும். நுரையால் வெண்மையாகத் தோன்றும் கடலை நரைத்ததாகச் சித்தரிக்கும் உருவகத்தை இத்தேர்வு இயல்பான தமிழில் பாதுகாக்கிறது.
