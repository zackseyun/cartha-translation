  text: אֶחָ֣ד בְּ/אֶחָ֣ד יִגַּ֑שׁוּ וְ֝/ר֗וּחַ לֹא יָב֥וֹא בֵֽינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: ta
  text: அவை ஒன்றோடொன்று நெருக்கமாகப் பொருந்தியிருக்கின்றன; அவற்றுக்கு இடையே காற்று[a] புகாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காற்றோட்டம்.” எபிரெயச் சொல் רוּחַ என்பதற்கு “காற்று,” “மூச்சு,” அல்லது “ஆவி” என்று பொருள் வரலாம்; இங்கு பௌதிகமான பொருளே நோக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד ... בְּאֶחָד
  choice: ஒன்றோடொன்று
  rationale: ஒவ்வொன்றும் அடுத்ததோடு சேர்ந்திருக்கும் பரஸ்பர அண்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יִגַּשׁוּ
  choice: நெருக்கமாகப் பொருந்தியிருக்கின்றன
  rationale: נגשׁ என்பதன் அடிப்படைப் பொருள் ‘நெருங்குதல்’. இங்கு லிவியாதானின் செதில்கள் இடைவெளியின்றி நெருக்கமாக அமைந்திருப்பதைச் சூழல் குறிக்கிறது; எனவே வெறும் அணுகுதலைவிட நெருக்கமான பொருத்தத்தை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: וְרוּחַ
  choice: காற்று
  rationale: רוּחַ என்பதற்கு காற்று, மூச்சு, ஆவி ஆகிய பொருள்கள் உண்டு. இங்கு செதில்களுக்கு இடையிலான பௌதிக இடைவெளியைப் பற்றிய விளக்கம் என்பதால் ‘காற்று’ பொருத்தமானது.
- source_word: לֹא יָבֹא
  choice: புகாது
  rationale: எதிர்மறை imperfect வடிவம், அவற்றின் நெருக்கத்தால் காற்று இடையில் நுழைவதில்லை என்பதைச் சொல்கிறது. ‘புகாது’ இயல்பான தமிழில் அந்த நடைமுறை இயலாமையையும் தருகிறது.
- source_word: בֵינֵיהֶם
  choice: அவற்றுக்கு இடையே
  rationale: בין மற்றும் மூன்றாம் நபர் ஆண்பால் பன்மை விகுதி இங்கு செதில்களுக்கிடையிலான இடவியல் உறவை நேரடியாகக் குறிக்கின்றன.
