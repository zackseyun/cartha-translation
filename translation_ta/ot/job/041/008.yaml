translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான கண்ணியத்தையும் தெளிவையும் காக்கும் நடை. எபிரெய மொழியின் இறுக்கமான உடல் சார்ந்த உருவகத்தை இயல்பாக வெளிப்படுத்த ‘நெருக்கமாகப் பொருந்தியிருக்கின்றன’ என மொழிபெயர்க்கப்பட்டது; ‘காற்று’ என்பதின் சொற்பொருள் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
