  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: ta
  text: வில்லாளன்[a] அவனைத் தப்பியோடச் செய்ய முடியாது; கவண் கற்கள் அவனுக்கு வைக்கோலாகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வில்லின் மகன்”; அதாவது, வில்லாளன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: அவனைத் தப்பியோடச் செய்ய முடியாது
  rationale: ברח என்பதன் ஹிஃபில் வடிவம் ‘ஒருவனை ஓடச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ஆயுதங்களால் லிவியாதானை விரட்ட முடியாத சூழலில், இந்த மொழிபெயர்ப்பு அந்தக் காரணவினைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: בֶן קָשֶׁת
  choice: வில்லின் மகன்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் படிமத்தை முதன்மைப் பனுவலில் காக்கும் மொழிபெயர்ப்பு. இது வில்லுடன் தொடர்புடைய ஒருவனை, அதாவது வில்லாளனை, குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לְקַשׁ
  choice: உலர்ந்த தாளாக
  rationale: קַשׁ என்பது அறுவடைக்குப் பின் மீதமிருக்கும் உலர்ந்த தாள் அல்லது வைக்கோல் போன்ற இலகுவான தாவரப் பொருளைக் குறிக்கிறது. ‘உலர்ந்த தாள்’ என்பது இங்கு அதன் பயனற்ற, எளிதில் சிதறும் தன்மையை இயல்பாக உணர்த்துகிறது.
- source_word: נֶהְפְּכוּ לוֹ
  choice: அவனுக்கு ... ஆகிவிடுகின்றன
  rationale: הפך என்பதன் நிஃபால் வடிவம் நிலைமாற்றத்தைக் குறிக்கிறது. கவண்கற்கள் அவனைப் பொறுத்தவரை அற்பமான உலர்ந்த தாளைப் போல ஆகிவிடுவதை இந்தத் தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: אַבְנֵי קָלַע
  choice: கவண்கற்கள்
  rationale: இந்த இணைப்புச் சொற்றொடர் கவணில் வைத்தெறியப்படும் கற்களைக் குறிக்கிறது. ‘கவண்கற்கள்’ சுருக்கமானதும் ஆயுதப் படிமத்தைத் துல்லியமாகக் காப்பதும் ஆகும்.
