  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: ta
  text: உயர்ந்த அனைத்தையும் அது நோக்குகிறது; பெருமையின் மகன்கள் அனைவர்மேலும் அது அரசனாக உள்ளது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெருமைகொண்டோர்”; சொல்லுக்கு சொல், “பெருமையின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גָּבֹהַּ
  choice: உயர்ந்த அனைத்தையும்
  rationale: ஒருமையில் வரும் பெயரடை மொத்தமாக்கும் பொருளில் பயன்படுத்தப்பட்டுள்ளது. இது உடலளவிலான உயரத்தையும் மேட்டிமை என்ற உருவகப் பொருளையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: יִרְאֶה
  choice: நோக்குகிறது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’. கவிதைநடையில் வெறும் கண்ணால் காண்பதைவிட எதிரிலுள்ள உயர்ந்த அனைத்தையும் அஞ்சாமல் நோக்கும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: அது
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமைப் பெயர்ப்பதிலி வந்தாலும், தமிழில் விலங்கைக் குறிக்க ‘அது’ என்பது இயல்பானது; தனி எழுவாய் மூலம் கிடைக்கும் வலியுறுத்தல் வாக்கிய அமைப்பில் தக்கவைக்கப்படுகிறது.
- source_word: מֶלֶךְ עַל
  choice: அரசன்
  rationale: மֶלֶךְ என்பதன் அரசாட்சியையும் மேலாதிக்க உருவகத்தையும் ‘அரசன்’ நேரடியாகப் பாதுகாக்கிறது; ‘அனைவருக்கும்’ என்ற வேற்றுமைத் தொடர் עַל குறிக்கும் மேலாதிக்க உறவை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: பெருமையின் மகன்கள் அனைவருக்கும்
  rationale: ‘மகன்கள்’ என்ற எபிரெய உருவக வகைப்பாட்டையும் שָׁחַץ குறிக்கும் பெருமை/மேட்டிமையையும் சொல் நெருக்கத்துடன் தக்கவைக்கிறது; இது எந்த ஒரு குறிப்பிட்ட உயிரின அல்லது அண்டசக்தி வகையையும் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: ‘பெருமையின் மகன்கள் அனைவரும்’ என்போர் யார்?
  choice: பெருமை அல்லது மேட்டிமையால் வகைப்படுத்தப்படும் எல்லா உயிர்கள் அல்லது இருப்புகளையும் குறிக்கக்கூடிய கவிதைமொழியாகவே வைக்கப்பட்டுள்ளது.
  alternative: இதை மூர்க்கமான விலங்குகள் என்று மட்டும், அல்லது பெருமைகொண்ட அண்டசக்திகள் என்று மட்டும் குறிப்பாக்கலாம்.
  rationale: எபிரெயச் சொற்றொடர் உருவகமானதும் பரந்ததும் ஆகும். ஒரு விலங்கியல் அல்லது புராணவியல் வகைக்குள் அதைச் சுருக்காமல் மூலத்தின் தெளிவின்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. லிவியாதானைக் குறிக்கும் எபிரெய ஆண்பால் இலக்கணத்தை தமிழில் இயல்பாக ‘அது’ என வழங்கியபோதும், அரசாட்சியின் உருவகத்தை ‘அரசன்’ எனத் தக்கவைத்துள்ளது.
