  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: ta
  text: 'அது ஆழ்நீரை ஒரு பானையைப் போல் கொதிக்க வைக்கிறது;

    கடலைத் தைலக் கலவைபோல்[a] ஆக்குகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நறுமணக் கலவைபோல்” அல்லது “தைலம்போல்.” எபிரெயச் சொல் கலந்து தயாரிக்கப்பட்ட ஒரு கூட்டுப்பொருளைக் குறிக்கிறது; அது பெரும்பாலும் தைலம் அல்லது நறுமணப் பொருளோடு தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: கொதிக்கவைக்கிறது
  rationale: רתח என்பதன் ஹிஃபில் வடிவம் ‘கொதிக்கச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தருகிறது; ‘கொதிக்கவைக்கிறது’ என்பது அதை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כַּסִּיר
  choice: ஒரு பானையைப்போல்
  rationale: סִיר என்பது சமைப்பதற்கான பானையைக் குறிக்கிறது. ‘பானை’ தெளிவானதும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான சொல்.
- source_word: מְצוּלָה
  choice: ஆழ்கடலை
  rationale: מְצוּלָה கடலின் ஆழத்தையோ ஆழமான நீரையோ குறிக்கிறது. அடுத்த அடியிலுள்ள ‘கடல்’ என்பதுடன் உள்ள கவிதை இணைப்பைத் தக்கவைத்தபடி, ‘ஆழ்கடல்’ தமிழில் இயல்பான காட்சியை அளிக்கிறது.
- source_word: יָם
  choice: கடலை
  rationale: יָם என்பதன் வழக்கமான பொருள் ‘கடல்’; மூலத்தின் உறுதியான கடற்காட்சியை இது பாதுகாக்கிறது.
- source_word: יָשִׂים
  choice: ஆக்குகிறது
  rationale: שׂים அடிப்படையில் ‘வைத்தல்’ என்று பொருள்பட்டாலும், இவ்வுவமை அமைப்பில் ஒன்றை ஒரு நிலைபோல் ஆக்குதல் என்ற பொருளில் வருகிறது; ‘ஆக்குகிறது’ தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כַּמֶּרְקָחָה
  choice: தைலக் கலவைபோல்
  rationale: מֶרְקָחָה என்பது கலந்து தயாரிக்கப்பட்ட ஒரு கூட்டுப்பொருளைக் குறிக்கிறது; அது தைலம் அல்லது நறுமணப் பொருளோடு தொடர்புடையதாக இருக்கலாம். ‘தைலக் கலவை’ கலந்த திரவத்தின் காட்சியைத் தக்கவைக்கிறது; சொல்லின் துல்லிய நுட்பம் உறுதியற்றதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
