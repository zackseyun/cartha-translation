translation_notes:
  register: நவீன நிலையான தமிழில், கவிதை இணைநிலையைப் பாதுகாக்கும் வகையில் இரண்டு அடிகளாக வடிவமைக்கப்பட்டுள்ளது. உயிரினத்தைக் குறிக்கும் எழுவாய் தமிழில் இயல்பாக ‘அது’ என வழங்கப்பட்டுள்ளது; நடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக உள்ளது.
