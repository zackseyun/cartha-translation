source:
  edition: WLC
  text: נַ֭פְשׁ/וֹ גֶּחָלִ֣ים תְּלַהֵ֑ט וְ֝/לַ֗הַב מִ/פִּ֥י/ו יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/013.yaml
  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: ta
  text: அதன் மூச்சு தணல்களைப் பற்றியெரியச் செய்கிறது[a]; அதன் வாயிலிருந்து ஒரு தீச்சுடர் புறப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் ஆத்துமா,” “அதன் உயிர்,” அல்லது “அதன் தொண்டை தணல்களைப் பற்றியெரியச் செய்கிறது.” நֶפֶשׁ என்ற எபிரெயப் பெயர்ச்சொல் “ஆத்துமா,” “உயிர்,” “தொண்டை” என்றும், இச்சூழலில் நீட்சிப்பொருளாக “மூச்சு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: அதன் மூச்சு
  rationale: נֶפֶשׁ என்பதற்கு வழக்கமாக ‘உயிர்’ அல்லது ‘ஆத்துமா’ என்று பொருள் இருந்தாலும், உடல்சார் சூழலில் ‘தொண்டை’ அல்லது அதிலிருந்து வெளிப்படும் ‘மூச்சு’ என்பதையும் குறிக்கலாம். வாயிலிருந்து தீச்சுடர் புறப்படுவதாக வரும் இணைவரி காரணமாக, இங்கு ‘மூச்சு’ இயல்பான சூழற்பொருளைத் தருகிறது. உயிரினத்தைக் குறிப்பதால் தமிழில் ‘அதன்’ பயன்படுத்தப்பட்டது.
- source_word: גֶּחָלִים
  choice: நெருப்புத்தணல்களை
  rationale: இந்தப் பன்மைப் பெயர்ச்சொல் எரியும் தணல்களை அல்லது நெருப்புக்கங்குகளைச் சுட்டுகிறது. ‘நெருப்புத்தணல்கள்’ என்பது பொதுவாசகருக்குத் தெளிவான நவீனத் தமிழ்.
- source_word: תְּלַהֵט
  choice: பற்றியெரியச் செய்கிறது
  rationale: להט என்பதன் பியேல் வடிவம் ஒன்றைப் பற்றியெரியச் செய்யும் காரணப்பொருளைக் கொண்டுள்ளது; ‘பற்றியெரியச் செய்கிறது’ அந்தக் காரணவினையைத் தெளிவாகக் காக்கிறது.
- source_word: וְלַהַב
  choice: ஒரு தீச்சுடர்
  rationale: לַהַב என்பது ஒருமையில் ‘தீச்சுடர்’ அல்லது ‘தீப்பிழம்பு’ எனப் பொருள்படும். ‘ஒரு தீச்சுடர்’ ஒருமைப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מִפִּיו
  choice: அதன் வாயிலிருந்து
  rationale: முன்னொட்டும் உடைமைப் பின்னொட்டும் சேர்ந்த சொற்றொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: יֵצֵא
  choice: புறப்படுகிறது
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியேறு/புறப்படு.’ வாயிலிருந்து தீச்சுடர் வெளிவரும் படிமத்தில் ‘புறப்படுகிறது’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
