translation_notes:
  register: நவீன செந்தமிழ் நடை; கவித்துவக் கண்ணியத்துடன் சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய பகிர்ந்தளிக்கும் ஒருமை முதல் வாக்கியத்தில் காக்கப்பட்டு, தொடர்ந்து வரும் பன்மை இயல்பாகப் பிரதிபலிக்கப்பட்டுள்ளது.
