  text: אִישׁ בְּ/אָחִ֥י/הוּ יְדֻבָּ֑קוּ יִ֝תְלַכְּד֗וּ וְ/לֹ֣א יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: ta
  text: ஒவ்வொன்றும் தன் இணையோடு ஒட்டியிருக்கிறது[a]; அவை ஒன்றோடொன்று இறுகப் பிணைக்கப்பட்டுள்ளன; அவற்றைப் பிரிக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “ஒவ்வொன்றும் தன் சகோதரனோடு ஒட்டியிருக்கிறது”; லிவியாதானின் செதில்களைப் பற்றிய இந்தக் கவித்துவ வருணனையில் “தன் சகோதரனோடு” என்பது மேலும் சொல்லுக்குச் சொல் அமைந்த மாற்று.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒவ்வொன்றும்
  rationale: இங்கு ஆண்பாலான மனிதனைச் சுட்டாமல், லிவியாதானின் செதில்கள் ஒவ்வொன்றையும் பகிர்ந்தளிக்கும் பொருளில் சுட்டுகிறது.
- source_word: בְּאָחִיהוּ
  choice: தன் இணையை
  rationale: சொல்லுக்கு நேர் பொருள் ‘தன் சகோதரனை/சகோதரனுடன்’ என்பதாக இருந்தாலும், உயிரற்ற செதில்களின் கவித்துவ வருணனையில் அருகிலுள்ள ஒத்த செதிலை ‘இணை’ என்பது இயல்பாகவும் உறவுமுறையைத் தக்கவைத்தும் காட்டுகிறது.
- source_word: יְדֻבָּקוּ
  choice: பற்றிக்கொண்டிருக்கிறது
  rationale: דבק என்ற வினை நெருக்கமாக ஒட்டியிருப்பதையோ பற்றியிருப்பதையோ குறிக்கிறது; பகிர்ந்தளிக்கும் ஒருமைப் பொருளான ‘ஒவ்வொன்றும்’ என்பதோடு இயல்பாக அமைகிறது.
- source_word: יִתְלַכְּדוּ
  choice: ஒன்றோடொன்று இறுகப் பிணைக்கப்பட்டுள்ளன
  rationale: பிடிபட்டு, ஒன்றாகச் சேர்க்கப்பட்டு, இறுக இணைந்திருக்கும் கருத்தை வெளிப்படுத்துகிறது; செதில்களின் பரஸ்பர இணைப்பையும் கவித்துவ இணைநிலையையும் காக்கிறது.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: அவற்றைப் பிரிக்க முடியாது
  rationale: இறுக்கமான இணைப்பின் விளைவாக அவை பிரிக்கப்பட முடியாத நிலையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
