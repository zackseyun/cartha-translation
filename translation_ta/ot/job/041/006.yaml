  yaml_path: translation/ot/job/041/006.yaml
  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
translation:
  language: ta
  text: அதன் முகத்தின் கதவுகளைத் திறந்தவன் யார்?[a] அதன் பற்களைச் சுற்றிலும் திகில் இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் வாயின் கதவுகளை யாரால் திறக்க முடியும்?” எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “அதன் முகத்தின் கதவுகள்” என்று உள்ளது; இது வாய் அல்லது தாடைகளைக் குறிக்கும் கவித்துவமான சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் பற்களைச் சுற்றிலும் பேரச்சம் இருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: கதவுகள்
  rationale: ‘கதவு’ என்பதன் பன்மை இணைப்புவடிவம். வாயின் திறக்கும் பகுதிகளைக் கதவுகளாகச் சித்தரிக்கும் எபிரெய உருவகத்தை இது காக்கிறது; ‘தாடைகள்’ என்பது விளக்கமளிக்கும் மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פָנָיו
  choice: அதன் முகம்
  rationale: இச்சொல்லின் இயல்பான பொருள் ‘முகம்’ அல்லது ‘முன்புறம்.’ சூழலில் வாய் அல்லது தாடைப் பகுதியைக் குறிப்பிட்டாலும், மூலத்தின் கவித்துவமான படிமத்தை முதன்மை உரை காக்கிறது.
- source_word: מִי
  choice: யார்
  rationale: வினாவைத் தொடங்கும் வழக்கமான எபிரெய வினாப்பெயர்; இங்கு விடை எதிர்பாராத சொல்லாட்சிக் கேள்வியாக வருகிறது.
- source_word: פִתֵּחַ
  choice: திறந்தவன்
  rationale: פתח என்பதிலிருந்து வந்த ‘திற’ என்ற செயலை நேரடியாகக் காட்டுகிறது. எபிரெய நிறைவுவடிவத்தின் சொல்லாட்சிக் கேள்வி வலிமையைத் தமிழில் ‘திறந்தவன் யார்?’ என இயல்பாக வெளிப்படுத்துகிறது; ‘யாரால் திறக்க முடியும்?’ என்பது திறனை வெளிப்படையாகச் சேர்க்கும் மாற்று.
- source_word: סְבִיבוֹת
  choice: சுற்றிலும்
  rationale: சுற்றியுள்ள எல்லாப் பகுதியையும் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ்ச் சமம்.
- source_word: שִׁנָּיו
  choice: அதன் பற்கள்
  rationale: அடிப்படைப் பொருள் ‘பற்கள்.’ ‘கோரப்பற்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கும்.
- source_word: אֵימָה
  choice: திகில்
  rationale: அச்சுறுத்தும் தீவிர பயம் அல்லது பேரச்சத்தைக் குறிக்கும் பெயர்ச்சொல். ‘திகில்’ கவித்துவமான செறிவையும் காட்சியின் அச்சுறுத்தலையும் இயல்பாகத் தருகிறது; ‘பேரச்சம்’ ஒரு பொருத்தமான மாற்று.
