  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. உயிரினத்தைக் குறிக்க பாலினம் சுமத்தாத ‘அதன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘முகத்தின் கதவுகள்’ என்ற மூல உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
