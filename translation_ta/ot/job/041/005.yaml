  yaml_path: translation/ot/job/041/005.yaml
  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: ta
  text: அதன் போர்வையின் வெளிப்புறத்தை யார் உரித்தான்? அதன் இரட்டைக் கடிவாளத்துக்குள் யார் நுழைய முடியும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் கடிவாளத்தின் மடிப்புக்குள் யார் நுழைய முடியும்?” எபிரேயச் சொற்றொடர் புரிந்துகொள்வதற்குக் கடினமானது; அது உருவகமாக லிவியாதானின் வாய், தாடைகள் அல்லது இரட்டை வரிசைப் பற்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: உரித்தெடுத்தவன்
  rationale: இந்த வினைச்சொல் மூடியிருப்பதைத் திறத்தல் அல்லது வெளிப்படுத்தல் என்று பொருள்படும். இங்கு லிவியாதானின் வெளிப்புற மூடியை வலுக்கட்டாயமாக அகற்றும் சவாலை இயல்பான தமிழில் தெரிவிக்க ‘உரித்தெடுத்தவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: அதன் போர்வையின் வெளிப்புறத்தை
  rationale: פְּנֵי என்பது முகம் அல்லது மேற்பரப்பு என்றும், לְבוּשׁ என்பது ஆடை அல்லது போர்வை என்றும் பொருள்படும். செதில்கள் அல்லது தோல் என்று விளக்கத்தைச் சுருக்காமல், வெளியில் தெரியும் மூடியைக் குறிக்கும் உருவகத்தை இச்சொற்றொடர் காக்கிறது.
- source_word: בְּכֶפֶל
  choice: இரட்டை ...த்திற்குள்
  rationale: כפל என்பது இரட்டிப்பு அல்லது மடிப்பு என்பதைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் தெளிவின்மையைத் தீர்த்துவிடாமல் ‘இரட்டை’ என்று நேரடியாக வைக்கப்பட்டுள்ளது.
- source_word: רִסְנוֹ
  choice: கடிவாளம்
  rationale: רסן என்பதன் வழக்கமான பொருள் கடிவாளம் அல்லது வாய்க்கட்டு. லிவியாதானின் வாய் அல்லது தாடைப் பகுதியைக் குறிக்கும் கடினமான கவித்துவ உருவகத்தை ‘கடிவாளம்’ பாதுகாக்கிறது.
- source_word: מִי יָבוֹא
  choice: நுழையக்கூடியவன் யார்?
  rationale: கேள்விச்சொல்லுடன் வரும் வினை வடிவம் இயலாமையைச் சவாலாக வெளிப்படுத்துகிறது. בְ முன்னொட்டுடன் அமைந்த சொற்றொடரின் உள்ளே செல்லும் கருத்தை ‘நுழையக்கூடியவன்’ இயல்பாகத் தருகிறது.
