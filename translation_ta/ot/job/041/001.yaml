  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: ta
  text: இதோ, அவனுடைய நம்பிக்கை பொய்த்துப்போகும்[a]; அவனுடைய தோற்றத்தைக் கண்டாலே ஒருவன் கீழே தள்ளப்பட மாட்டானா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய எதிர்பார்ப்பு ஏமாற்றமடையும்” அல்லது “அவனுடைய நம்பிக்கை தோல்வியடையும்.” எபிரெய வினைச்சொல் அந்த நம்பிக்கை பொய்யானது அல்லது நிறைவேறாதது என்று தெரியவருவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய தோற்றத்தைக் கண்ட மாத்திரத்திலேயே ஒருவன் கீழே தள்ளப்பட மாட்டானா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயச் சொல்லின் கவிதைநடையை இயல்பான தமிழில் காக்கிறது.
- source_word: תֹּחַלְתּוֹ
  choice: அவனைப் பிடிக்கலாம் என்ற நம்பிக்கை
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘அவனுடைய நம்பிக்கை/எதிர்பார்ப்பு.’ சூழலில் முன்னைய வசனங்களில் லிவியாதானைப் பிடிப்பது பேசப்படுவதால், தமிழ் வாசகருக்கு உரிய தொடர்பைச் சுருக்கமாக வெளிப்படுத்துகிறது; ‘அவனுடைய’ என்பது லிவியாதானின் நம்பிக்கை எனத் தவறாகப் புரியக்கூடும்.
- source_word: נִכְזָבָה
  choice: பொய்த்துப்போகும்
  rationale: כזב வேரின் பொய், ஏமாற்றம், நிறைவேறாத எதிர்பார்ப்பு ஆகிய விளைவுநிலைகளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הֲגַם
  choice: மாட்டானா?
  rationale: வினாவிடை எதிர்பார்க்கும் வலியுறுத்தப்பட்ட சொல்லாட்சியைத் தமிழின் எதிர்மறை வினா வடிவில் வெளிப்படுத்துகிறது.
- source_word: אֶל מַרְאָיו
  choice: அவனைப் பார்த்தவுடனேயே
  rationale: ‘அவனுடைய தோற்றத்தைக் காணும்போதே/அவனைப் பார்த்த மாத்திரத்தில்’ என்ற எதிர்வினையை இயல்பான தமிழில் தருகிறது; גם என்பதன் தீவிரப்படுத்தும் நுணுக்கமும் ‘வுடனேயே’ என்பதில் பிரதிபலிக்கிறது.
- source_word: יֻטָל
  choice: வீழ்த்தப்பட
  rationale: Hophal செயப்பாட்டு வடிவத்தையும் ‘எறியப்படுதல்/கீழே வீழ்த்தப்படுதல்’ என்ற வலிமையான பொருளையும் காக்கிறது; பயத்தால் வெறுமனே கலங்குதல் என்று மட்டும் விளக்கவில்லை.
