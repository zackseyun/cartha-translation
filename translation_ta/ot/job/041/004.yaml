source:
  edition: WLC
  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: ta
  text: அதன் உறுப்புகளைப் பற்றியும், அதன் வல்லமையைப் பற்றிய விவரத்தையும், அதன் அமைப்பின் அழகையும் பற்றி நான் மௌனமாயிருக்க மாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் பாகங்களைப் பற்றியும், அதன் பேராற்றல்களைப் பற்றிய விஷயத்தையும், அதன் ஒழுங்கமைவின் அழகையும் பற்றி நான் மௌனமாயிருக்க மாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: நான் மௌனமாயிருக்க மாட்டேன்
  rationale: ஹிப்இல் வடிவம் இங்கு பேசாமல் இருப்பதைக் குறிக்கிறது; முதலாம் நபரின் உறுதியையும் இயல்பான நவீனத் தமிழிலும் காக்கிறது.
- source_word: בַּדָּיו
  choice: அதன் உறுப்புகள்
  rationale: உடலின் பகுதிகள் அல்லது உறுப்புகள் என்ற பொருளில், லிவியாதானின் உடல்வருணனைச் சூழலுக்கு ‘உறுப்புகள்’ பொருந்துகிறது; ‘பாகங்கள்’ என்பது மாற்றுப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דְבַר
  choice: குறித்த செய்தி
  rationale: தொடர்ந்து வரும் வலிமைகளைப் பற்றிப் பேசப்படும் விவரத்தைச் சுட்டுகிறது; எபிரெயச் சொல்லின் ‘சொல்/விஷயம்’ என்ற பரப்பை மிகையாக விளக்காமல் காக்கிறது.
- source_word: גְּבוּרוֹת
  choice: வலிமைகள்
  rationale: பன்மை வடிவத்தையும், வலிமை வெளிப்பாடுகள் அல்லது பேராற்றல்கள் என்ற சாத்தியமான பொருள் விரிவையும் காக்கிறது.
- source_word: חִין
  choice: அழகு
  rationale: இங்கு அருள், கவர்ச்சி, நேர்த்தி ஆகியவற்றுள் உடல் அமைப்பின் கண்ணைக் கவரும் தன்மையை ‘அழகு’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: עֶרְכּוֹ
  choice: அதன் அமைப்பு
  rationale: ערך என்பதன் ஒழுங்கமைவு/அடுக்கமைவு சார்ந்த அடிப்பொருளைக் காக்கிறது; ‘உடல் விகிதம்’ எனக் குறிப்பாக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
