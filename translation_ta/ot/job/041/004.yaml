  register: நவீன நிலையான, கண்ணியமான தமிழ். கவிதைநடையின் இணை அமைப்பைத் தக்கவைத்து, எபிரெய மூலத்தில் உள்ள உடற்பகுதிகள், பன்மையான வலிமைகள், ஒழுங்கமைவு ஆகிய பொருள் நுணுக்கங்கள் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
