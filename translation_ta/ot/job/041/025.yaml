lexical_decisions:
- source_word: אֵין
  choice: எதுவுமில்லை
  rationale: இது இருப்பை முற்றாக மறுக்கும் சொல்; தமிழில் இயல்பாகவும் முழுமையான மறுப்புடனும் அமைகிறது.
- source_word: עַל עָפָר
  choice: பூமியில்
  rationale: சொல்லுக்குச் சொல் ‘புழுதியின்மேல்’ என இருந்தாலும், இச்சூழலில் பூமிக்குரிய உயிரினங்கள் அனைத்தையும் குறிக்கும் மரபுத்தொடரின் பொருளை ‘பூமியில்’ தெளிவாகத் தருகிறது.
- source_word: מָשְׁלוֹ
  choice: அதற்கு நிகரானது
  rationale: இங்கு ஆட்சி செய்பவர் என்ற பொருளைவிட ஒப்புமை அல்லது சமநிலையைக் குறிக்கும் பொருளே சூழலுக்கு ஏற்றது; ‘நிகரானது’ இரண்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: הֶעָשׂוּ
  choice: படைக்கப்பட்டது
  rationale: עשה என்பதன் செயப்பாட்டு கருத்தைத் தக்கவைத்து, இவ்வுயிரினம் உருவாக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִבְלִי חָת
  choice: அச்சமற்றதாக
  rationale: அச்சம் அல்லது திகில் அதனிடம் இல்லாத நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
