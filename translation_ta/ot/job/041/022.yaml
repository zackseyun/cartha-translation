translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவமான உருவகத்தைப் பேணியபடியே சாதாரண வாசகருக்குப் புரியக்கூடிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. உயிரினத்துக்கான எபிரெய ஆண்பால் சுட்டுப்பெயரைத் தமிழில் இயல்பான அஃறிணை ‘அது/அதன்’ என வழங்கியுள்ளது.
