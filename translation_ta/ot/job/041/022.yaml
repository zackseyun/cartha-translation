  text: תַּ֭חְתָּי/ו חַדּ֣וּדֵי חָ֑רֶשׂ יִרְפַּ֖ד חָר֣וּץ עֲלֵי טִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/022.yaml
  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: ta
  text: 'அதன் கீழே கூர்மையான பானை ஓட்டுத் துண்டுகள்[a] உள்ளன;

    அது சேற்றின்மேல் தன்னை ஒரு கூர்மையான போரடிக்கும் பலகையைப்போல் பரப்புகிறது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூர்மையான பானை ஓடுகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது சேற்றைப் போரடிக்கும் பலகையைப்போல் ஆக்குகிறது.” எபிரெய வாக்கிய அமைப்பை ஒப்புமையாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: அதன் அடிப்பகுதியில்
  rationale: லிவியாதானின் உடலுக்குக் கீழே இருப்பதைக் குறிக்கும் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: கூர்மையான பானை ஓட்டுத் துண்டுகள்
  rationale: கூர்மையும் உடைந்த மட்பாண்டத் துண்டுகளின் உருவகமும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: יִרְפַּד
  choice: தன்னை ... பரப்புகிறது
  rationale: பரப்புதல் அல்லது படுக்கையாக அமைத்தல் என்ற வினையின் பொருளையும், இங்கு உட்பொருளாகத் தோன்றும் தற்சுட்டுச் செயற்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: חָרוּץ
  choice: கூர்மையான போரடிக்கும் பலகை
  rationale: தானியத்திலிருந்து கதிரைப் பிரிக்கப் பயன்படுத்தப்பட்ட கூர்மையான வேளாண் கருவியைக் குறிக்கிறது; தமிழ்வாசகருக்குப் பொருள் தெளிவாக இருக்க ‘கூர்மையான’ என்பது சேர்க்கப்பட்டது.
- source_word: עֲלֵי טִיט
  choice: சேற்றின்மேல்
  rationale: சேறு அல்லது களிமண் மீதான இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
