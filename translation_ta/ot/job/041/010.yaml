  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: ta
  text: அதன் தும்மல்கள் ஒளியைப் பளிச்சிடச் செய்கின்றன[a]; அதன் கண்கள் விடியலின் இமைகளைப் போன்றவை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் தும்மல்கள் ஒளியுடன் பிரகாசிக்கின்றன.” எபிரெய வினை ‘ஒளியைப் பிரகாசிக்கச் செய்’ என்ற காரணவினைப் பொருளுடையது; இத்தொடர் மிகுந்த கவித்துவமானது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “விடியலின் இமைகள்.” நாள் திறக்கும்போது தோன்றும் முதல் ஒளியைக் குறிக்கும் எபிரெயக் கவித்துவப் படிமம் இது.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: அதன் தும்மல்கள்
  rationale: עטש என்ற வேரிலிருந்து வந்த இச்சொல் நேரடியாகத் தும்மல்களைக் குறிக்கிறது. லிவியாதானைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டை, இயல்பான தமிழ் விலங்கு குறிப்பிடலுக்கேற்ப ‘அதன்’ என வழங்கியுள்ளோம்.
- source_word: תָּהֶל אוֹר
  choice: ஒளியைப் பளிச்சிடச் செய்கின்றன
  rationale: ஹிப்ஈல் வினை ஒளியைப் பிரகாசிக்கச் செய்யும் காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘பளிச்சிடச் செய்கின்றன’ என்பது அந்தக் காரணவினையையும் கவிதையின் திடீர் ஒளிப்படிமத்தையும் காக்கிறது.
- source_word: וְעֵינָיו
  choice: அதன் கண்கள்
  rationale: இணைப்புச்சொல்லையும் மூன்றாம் நபர் ஒருமை உடைமைச் சுட்டையும் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: כְעַפְעַפֵּי שָׁחַר
  choice: விடியலின் இமைகளைப் போன்றவை
  rationale: עפעפים என்பதன் நேரடிப் பொருளான ‘இமைகள்’ என்பதைக் காத்து, שחר என்பதை ‘விடியல்’ என மொழிபெயர்க்கிறது; நாளின் முதல் ஒளி திறப்பதைப் போன்ற எபிரெயக் கவித்துவப் படிமம் இதனால் நிலைக்கிறது.
