  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: ta
  text: அவனை எட்டும் வாள் நிலைநிற்காது[a]; ஈட்டியும், எறியம்பும்[b], எறியீட்டியும் நிலைநிற்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை முந்திப்பிடிக்கும் வாள் வெற்றிபெறாது.” எபிரெய மொழியில் சொல்லர்த்தமாக வாள் “நிற்காது” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “எறியம்பு,” “எறியீட்டி” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்கள் அரிதானவை; அவற்றின் பொருள் உறுதியற்றது. முந்தையதற்கு “எறியாயுதம்” அல்லது “அம்புத்தண்டு” என்றும், பிந்தையதற்கு “சங்கிலிக் கவசம்” அல்லது “கவசம்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
