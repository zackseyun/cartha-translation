translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் தெளிவான காட்சியையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான உவமை தமிழில் புரியும்படி ‘எழுப்பும் புகையைப் போல’ என வெளிப்படுத்தப்பட்டுள்ளது; சொல்லியல் மாற்றுவாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
