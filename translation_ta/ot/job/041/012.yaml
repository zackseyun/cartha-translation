  text: מִ֭/נְּחִירָי/ו יֵצֵ֣א עָשָׁ֑ן כְּ/ד֖וּד נָפ֣וּחַ וְ/אַגְמֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: ta
  text: அவனுடைய மூக்குத்துவாரங்களிலிருந்து புகை கிளம்புகிறது; காற்றூதப்பட்ட பானையிலிருந்தும் நாணல்களிலிருந்தும் எழும் புகையைப் போல.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொப்பரை.’ எபிரெயச் சொல் דּוּד சமைக்கும் பானையையோ பெரிய கொப்பரை போன்ற பாத்திரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடர் சுருக்கமானது; நேரடியாக, ‘ஊதப்பட்ட பானை மற்றும் நாணல்’ என வாசிக்கலாம். נָפוּחַ என்பது காற்றூதப்பட்டு நன்கு மூட்டப்பட்டதைக் குறிக்கிறது. நாணல்கள் எரிபொருளாகப் பயன்படுத்தப்பட்டிருக்கலாம்; அவ்வாறு நன்கு மூட்டப்பட்ட நெருப்பிலிருந்து அடர்ந்த புகை எழும் காட்சியை இந்த உவமை சுட்டலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: அவனுடைய நாசித்துவாரங்களிலிருந்து
  rationale: நְחִירַיִם என்பது மூக்குத் துவாரங்களைக் குறிக்கிறது; מִן முன்னொட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து ‘அவனுடைய நாசித்துவாரங்களிலிருந்து’ என்ற பொருளைத் தருகின்றன. இது உடல்சார்ந்த வலுவான காட்சியைத் தக்கவைக்கிறது.
- source_word: יֵצֵא
  choice: கிளம்புகிறது
  rationale: இங்கு இச்சொல் தொடர்ந்து காணப்படும் இயல்பான செயலைக் கவிதை நடையில் விவரிக்கிறது. புகை வெளியே வருவதைத் தமிழில் இயல்பாகக் கூற ‘கிளம்புகிறது’ பொருத்தமானது.
- source_word: עָשָׁן
  choice: புகை
  rationale: עָשָׁן என்பதன் நேரடியான, சூழலுக்கு ஏற்ற தமிழ் இணைச்சொல்.
- source_word: כְּדוּד
  choice: பானை
  rationale: דּוּד என்பது சமைக்கும் பானையையோ பெரிய கொப்பரையையோ குறிக்கலாம். பொதுவாசகருக்கு இயல்பான ‘பானை’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נָפוּחַ
  choice: கொதிக்கும்
  rationale: இச்செயப்படுபொருள் வடிவம் ஊதப்பட்டு நன்கு மூட்டப்பட்ட வெப்பத்தைச் சுட்டுகிறது. பானையின் சூழலில் அந்த விளைவை இயல்பான தமிழில் ‘கொதிக்கும்’ எனத் தருவது புகைக் காட்சியைத் தெளிவாக்குகிறது; சொற்றொடரின் சுருக்கமும் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְאַגְמֹן
  choice: எரியும் நாணல்கள்
  rationale: אַגְמוֹן என்பது நாணல் அல்லது கோரை போன்ற சதுப்புநிலத் தாவரத்தைக் குறிக்கும். இங்கு புகையை எழுப்பும் எரிபொருள் என்ற காட்சி சூழலால் உணரப்படுவதால் ‘எரியும் நாணல்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
