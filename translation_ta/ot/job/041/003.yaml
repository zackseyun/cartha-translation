  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: ta
  text: எனக்கு முதலில் கொடுத்தவர் யார்[a]? நான் அவருக்குத் திருப்பிச் செலுத்த வேண்டுமா? வானங்கள் அனைத்தின் கீழுள்ள அனைத்தும் என்னுடையது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “எனக்கு முன்பாக வந்தவர் யார்? நான் அவருக்குத் திருப்பிச் செலுத்த வேண்டுமா?” எபிரெய வினைச்சொல் “முன்பாக வருதல்” அல்லது “முந்திச் செல்லுதல்” எனப் பொருள்படலாம்; ஆனால் இங்கே, மற்றொருவரைக் கடன்பட்டவராக்கும் வகையில் முதலில் கொடுத்தல் என்பதே பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: வலியுறுத்தலைக் கூடுதலாகச் சேர்க்காமல், மறுமொழியை எதிர்பாராத வினாவின் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: הִקְדִּימַנִי
  choice: எனக்கு முதலில் கொடுத்தவன்
  rationale: קדם என்பதன் ஹிப்ஈல் வடிவம் அடிப்படையில் ‘முந்திவருதல்’ எனப் பொருள்படலாம்; ஆனால் ‘திருப்பிச் செலுத்துதல்’ என்பதோடு இணைந்துள்ள இச்சூழலில், ஒருவரைக் கடன்பட்டவராக்கும் வகையில் முதலில் கொடுத்தல் என்ற கருத்தை இது தெரிவிக்கிறது.
- source_word: וַאֲשַׁלֵּם
  choice: நான் அவனுக்குத் திருப்பிச் செலுத்துவதற்கு
  rationale: முந்தைய செயலின் விளைவாக எழும் கடன்பொறுப்பை வினாவாக வெளிப்படுத்துகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் தமிழில் ‘அவனுக்கு’ என்று இயல்பாகக் குறிப்பிடப்பட்டுள்ளது.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: வானங்கள் அனைத்தின் கீழ்
  rationale: எபிரெய மூலத்தின் பன்மையான ‘வானங்கள்’ என்பதையும், படைக்கப்பட்ட உலகின் முழுமையையும் தக்கவைக்கிறது.
- source_word: לִי הוּא
  choice: என்னுடையது
  rationale: ‘எனக்கே அது’ என்ற எபிரெய வலியுறுத்தலை இயல்பான தமிழ் உடைமைத் தொடரால் சுருக்கமாக வெளிப்படுத்துகிறது; ‘உள்ளதெல்லாம்’ என்பது மறைந்துள்ள முழுமையைக் காட்டுகிறது.
theological_decisions:
- issue: கடவுளை ஒருவருக்குக் கடன்பட்டவராக்க முடியுமா என்பதும் அனைத்தின்மீதான அவரது உரிமையும்
  choice: யாரும் கடவுளுக்கு முதலில் ஒன்றைக் கொடுத்து அவரைத் திருப்பிச் செலுத்த வேண்டிய கடனாளியாக்க முடியாது என்ற மறுமொழியை எதிர்பாராத வினாவாக மொழிபெயர்த்து, அதன்பின் வானங்களின் கீழுள்ள அனைத்தும் அவருடையது என்ற உரிமைக் கூற்றை வழங்குதல்.
  alternative: முதல் கூற்றை ‘எனக்கு முன் வந்தவன் யார்?’ என்று கால வரிசையை மட்டும் குறிப்பிடும் வகையில் மொழிபெயர்த்தல்.
  rationale: ‘முதலில் கொடுத்தல்’ என்பதையும் ‘திருப்பிச் செலுத்துதல்’ என்பதையும் இணைக்கும் வாக்கிய அமைப்பு கடன்பொறுப்பையே மையப்படுத்துகிறது. இருப்பினும் வினைச்சொல்லின் முறையான ‘முந்திவருதல்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானங்கள்’ என்ற பன்மை மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது; முதல் வாக்கியத்தின் மறுமொழியை எதிர்பாராத வினா வலிமையும் தக்கவைக்கப்பட்டுள்ளது.
