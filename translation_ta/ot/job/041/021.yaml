  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: ta
  text: தடி[a] அதற்கு வைக்கோலாக[b] கருதப்படுகிறது; ஈட்டியின் இரைச்சலைக் கேட்டு அது சிரிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அம்பு/எறியாயுதம் அதற்கு வைக்கோலாகக் கருதப்படுகிறது’; תוֹתָח என்பது அரிதான எபிரெயச் சொல்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தண்டுபோல.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: வைக்கோலாக
  rationale: קַשׁ என்பது வைக்கோல் அல்லது அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தாளைக் குறிக்கிறது. இங்கு எளிதாகவும் தீங்கற்றதாகவும் கருதப்படுவதைக் காட்ட ‘வைக்கோல்’ இயல்பான நவீனத் தமிழ்.
- source_word: נֶחְשְׁבוּ
  choice: எண்ணப்படுகிறது
  rationale: חשב என்பதன் செயலப்பாட்டு வடிவம் ‘கருதப்படுதல்/எண்ணப்படுதல்’ எனப் பொருள்படும்; செய்யுளின் மதிப்பீட்டு மொழியை இது காக்கிறது.
- source_word: תוֹתָח
  choice: தடி
  rationale: இது அரிதான எபிரெயச் சொல்; குறிப்பான ஆயுதம் உறுதியில்லை. போர்ச் சூழலில் ஓர் ஆயுதத்தைக் குறிக்கும் வகையில் ‘தடி’ தெளிவான தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִשְׂחַק
  choice: அது சிரிக்கிறது
  rationale: שׂחק என்பதன் அடிப்படைப் பொருள் ‘சிரித்தல்.’ சூழலில் லிவியாதானே எழுவாய்; தமிழில் உயிரினத்தைக் குறிக்க இயல்பான ‘அது’ பயன்படுத்தப்படுகிறது.
- source_word: לְרַעַשׁ
  choice: பேரொலியைப் பார்த்து
  rationale: רַעַשׁ ஒலி, அதிர்வு, பேரிரைச்சல் ஆகியவற்றைக் குறிக்கலாம். ஆயுதத்தின் அச்சுறுத்தும் ஒலி/அதிர்வை இயல்பான தமிழில் வெளிப்படுத்த ‘பேரொலி’ தேர்ந்தெடுக்கப்பட்டது; ‘-ஐப் பார்த்து’ காரணம் அல்லது தூண்டுதலைக் குறிக்கிறது.
- source_word: כִּידוֹן
  choice: ஈட்டி
  rationale: כידון என்பது ஈட்டி அல்லது எறியீட்டியைக் குறிக்கும். ‘ஈட்டி’ பொதுவாகப் புரியும், துல்லியத்தை மீறாத நவீனத் தமிழ் சொல்.
