- from: தடி அதற்கு வைக்கோலாக[a][b] எண்ணப்படுகிறது; ஈட்டியின் பேரொலியைப் பார்த்து அது சிரிக்கிறது.
  to: தடி[a] அதற்கு வைக்கோலாக[b] கருதப்படுகிறது; ஈட்டியின் இரைச்சலைக் கேட்டு அது சிரிக்கிறது.
