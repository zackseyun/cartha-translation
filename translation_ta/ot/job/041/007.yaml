  text: גַּ֭אֲוָה אֲפִיקֵ֣י מָֽגִנִּ֑ים סָ֝ג֗וּר חוֹתָ֥ם צָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/007.yaml
  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: ta
  text: 'அதன் பெருமைமிக்க கேடய வரிசைகள்,

    முத்திரையிட்டு இறுக்கமாக மூடப்பட்டுள்ளன.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: பெருமைமிக்க
  rationale: பெயர்ச்சொல்லான ‘மேன்மை/பெருமை’ என்பதை இங்கு கேடய வரிசைகளின் கம்பீரத்தைக் குறிக்கும் இயல்பான அடைமொழியாக மொழிபெயர்க்கிறது; எதிர்மறையான அகந்தையைத் தேவையின்றி புகுத்தவில்லை.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: கேடய வரிசைகள்
  rationale: אפיקי என்பதன் அடிப்படைப் பொருள் ‘கால்வாய்கள்/பள்ளங்கள்/வரிசைகள்’ என விரிவுடையது; லிவியாதானின் ஒன்றோடொன்று அமைந்த செதில்களை கேடயங்களாக உருவகிக்கும் சூழலில் ‘கேடய வரிசைகள்’ தெளிவாகவும் உருவகத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: סָגוּר
  choice: மூடப்பட்டுள்ளன
  rationale: நெருக்கமாக அடைக்கப்பட்ட நிலையை நேரடியாகக் காட்டுகிறது.
- source_word: חוֹתָם צָר
  choice: இறுக்கமாக முத்திரையிட்டதுபோல்
  rationale: חוֹתָם என்பதன் ‘முத்திரை’ உருவகத்தையும் צָר என்பதன் ‘இறுக்கமான/நெருக்கமான’ கருத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் கம்பீரமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் சுருக்கமான பெயர்ச்சொல் அமைப்பு தமிழில் தெளிவுக்காக இரு அடிகளாக விரிக்கப்பட்டது. உடனடி சூழலின் அடிப்படையில் மறைமுகமாக உள்ள உடற்பகுதியை ‘முதுகு’ என்று வெளிப்படுத்தியது; கேடய உருவகம் அப்படியே பாதுகாக்கப்பட்டது.
