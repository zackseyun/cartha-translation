revisions:
- from: 'அதன் முதுகு பெருமைமிக்க கேடய வரிசைகளால் ஆனது;

    அவை இறுக்கமாக முத்திரையிட்டதுபோல் மூடப்பட்டுள்ளன.'
  to: 'அதன் பெருமைமிக்க கேடய வரிசைகள்,

    முத்திரையிட்டு இறுக்கமாக மூடப்பட்டுள்ளன.'
  rationale: The revision removes the unstated reference to the creature’s back and avoids saying that it is composed of shields. It preserves the compact poetic parallelism, the shield-row metaphor, and the image of close sealing in idiomatic modern Tamil.
