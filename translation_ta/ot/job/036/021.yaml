source:
  edition: WLC
  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: ta
  text: எச்சரிக்கையாக இரு; அக்கிரமத்தின் பக்கம் திரும்பாதே[a]. ஏனெனில், துன்பத்தைவிட இதையே நீ தேர்ந்தெடுத்திருக்கிறாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அக்கிரமம்” என்பதற்கான எபிரெயச் சொல் தீமை, கேடு அல்லது துன்பம் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “துன்பத்திற்குப் பதிலாக இதையே” அல்லது “துன்பத்தைக் காட்டிலும் இதையே” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் ஒப்பீட்டையோ மாற்றுத் தேர்வையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: எச்சரிக்கையாக இரு
  rationale: שׁמר என்பதன் நிஃபால் கட்டளை வடிவம் இங்கு எச்சரிக்கும் அறிவுறுத்தலாக வருகிறது. நவீனத் தமிழில் அதன் கட்டளைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל תֵּפֶן
  choice: திரும்பாதே
  rationale: אַל உடன் வரும் פנה, ஒரு திசையையோ காரியத்தையையோ நோக்கித் திரும்புவதைத் தடை செய்கிறது. தமிழில் நேரடியான ஒருமைத் தடை வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל אָוֶן
  choice: அக்கிரமத்தின் பக்கம்
  rationale: אָוֶן என்பது அக்கிரமம், தீமை, கேடு அல்லது துன்பம் எனப் பொருள்படலாம். இங்குள்ள ஒழுக்க எச்சரிப்பிலும் துன்பத்துடன் செய்யப்படும் ஒப்பீட்டிலும் ‘அக்கிரமம்’ முதன்மைப் பொருளாகப் பொருந்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל זֶה
  choice: இதையே
  rationale: சற்றுமுன் குறிப்பிடப்பட்ட அக்கிரமத்தைக் குறிக்கும் சுட்டுப்பெயரைத் தமிழில் வலியுறுத்தலுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּחַרְתָּ
  choice: நீ தேர்ந்தெடுத்திருக்கிறாய்
  rationale: בחר என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை நிறைவுவினை, முடிந்த தேர்வின் தற்போதைய தொடர்பை இங்கு வெளிப்படுத்துகிறது.
- source_word: מֵעֹנִי
  choice: துன்பத்தைவிட
  rationale: עֹנִי என்பது துன்பம், வேதனை, வறுமை எனப் பொருள்படலாம். யோபின் சூழலில் ‘துன்பம்’ பொருத்தமானது; முன்னொட்டு מ ஒப்பீட்டை அல்லது மாற்றுத் தேர்வைச் சுட்டுகிறது.
theological_decisions:
- issue: யோபு அக்கிரமத்தைத் தேர்ந்தெடுத்ததாக வசனம் கூறும் தோற்றம்
  choice: எலிகூவின் உரையிலுள்ள நேரடியான குற்றச்சாட்டின் பதற்றத்தைத் தக்கவைத்தல்
  alternative: ‘தேர்ந்தெடுக்காதபடி இரு’ என எதிர்கால எச்சரிப்பாக மென்மைப்படுத்துதல்
  rationale: எபிரெய வினை நிறைவுவடிவில் ‘நீ தேர்ந்தெடுத்தாய்/தேர்ந்தெடுத்திருக்கிறாய்’ என்று உள்ளது. பேச்சாளரின் கூற்றை மொழிபெயர்ப்பாளர் மென்மைப்படுத்தவோ இறையியல் தீர்ப்பாக விரிவுபடுத்தவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையைக் குறிக்கும் நேரடியான அறிவுறுத்தல் நடையில் அமைக்கப்பட்டுள்ளது. ‘எச்சரிக்கையாக இரு’ என்பது கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதும் ஆகும்; ‘அக்கிரமம்’ வேதாகமச் சூழலுக்கு ஏற்ற ஒழுக்கப் பொருளைத் தக்கவைக்கிறது.
