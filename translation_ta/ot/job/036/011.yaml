source:
  edition: WLC
  text: אִֽם יִשְׁמְע֗וּ וְֽ/יַ֫עֲבֹ֥דוּ יְכַלּ֣וּ יְמֵי/הֶ֣ם בַּ/טּ֑וֹב וּ֝/שְׁנֵי/הֶ֗ם בַּ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: ta
  text: அவர்கள் செவிகொடுத்து[a] சேவை செய்தால், தங்கள் நாட்களை நலத்திலும் தங்கள் ஆண்டுகளை இனிமையிலும் கழிப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்டுக் கீழ்ப்படிந்து”; “செவிகொடு” என்பதற்கான எபிரெய வினைச்சொல், இச்சூழலில் கீழ்ப்படிதலுடன் கேட்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் நாட்களை நன்மையிலும், தங்கள் ஆண்டுகளை இன்பங்களிலும் முடிப்பார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: செய்தால்
  rationale: எபிரெய நிபந்தனையைத் தமிழில் இயல்பாகக் காட்டும் நிபந்தனை வினைமுற்று.
- source_word: יִשְׁמְעוּ
  choice: செவிகொடுத்து
  rationale: שׁמע என்பதன் ‘கேள்/செவிகொடு’ என்ற அடிப்படைப் பொருளையும், சூழலில் உள்ள கீழ்ப்படிதலுக்கான சாயலையும் முழுமையாக ஒன்றாக்காமல் காக்கிறது.
- source_word: וְיַעֲבֹדוּ
  choice: சேவை செய்தால்
  rationale: עבד என்பதன் பரந்த ‘சேவை செய்’ என்ற பொருளைத் தருகிறது; அதை வழிபாட்டுச் செயலாக மட்டும் குறுக்கவில்லை.
- source_word: יְכַלּוּ יְמֵיהֶם
  choice: தங்கள் நாட்களைக் கழிப்பார்கள்
  rationale: ‘நாட்களை முடிப்பார்கள்/நிறைவு செய்வார்கள்’ என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் வாழ்நாளைக் கழித்தல் என வெளிப்படுத்துகிறது.
- source_word: בַּטּוֹב
  choice: நலத்தில்
  rationale: טוֹב இங்கு குறிக்கும் சாதகமான, நன்றான வாழ்க்கை நிலையைக் காட்டுகிறது; பொருளாதார வளம் என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: וּשְׁנֵיהֶם
  choice: தங்கள் ஆண்டுகளை
  rationale: ‘நாட்கள்’ என்பதுடன் அமைந்துள்ள கவிதை இணைநிலையைப் பேணுகிறது.
- source_word: בַּנְּעִימִים
  choice: இனிமையில்
  rationale: נעים என்ற சொல்லின் இன்பமான, மனதிற்குகந்த தன்மையை இயல்பான தமிழில் தருகிறது; பன்மை வடிவத்தை கட்டாயமாகத் தனித்தனி இன்பப் பொருட்களாக விளக்கவில்லை.
theological_decisions:
- issue: கீழ்ப்படிதல் எப்போதும் உலகியலான செழிப்பை அளிக்கும் என்ற முழுமையான வாக்குறுதியாக இவ்வசனத்தைப் புரிந்துகொள்வதா
  choice: எலிகூவின் உரையிலுள்ள நிபந்தனைக்கூற்றை அதன் சாதகமான வாழ்க்கைச் சூழ்நிலை என்ற இயல்பான பொருளோடு நேரடியாக மொழிபெயர்த்தல்
  alternative: இதை எல்லாக் காலங்களுக்கும் பொருந்தும் பொருளாதாரச் செழிப்பு வாக்குறுதியாகவோ, முற்றிலும் உள்ளார்ந்த ஆன்மிக ஆசீர்வாதமாகவோ விளக்குதல்
  rationale: எபிரெய உரை ஞான இலக்கியத்திற்குரிய நிபந்தனைக்கூற்றை முன்வைக்கிறது. மொழிபெயர்ப்பு அதை உலகளாவிய கோட்பாடாக விரிவுபடுத்தவோ, அதன் சாதகமான வாழ்நிலைப் பொருளை ஆன்மிகப்படுத்தி அகற்றவோ கூடாது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நலம்’ என்பது பொருளாதாரச் செழிப்பை மட்டும் வற்புறுத்தாமல் சாதகமான வாழ்நிலையைத் தருகிறது; ‘இனிமை’ கவிதை இணைநிலையையும் காக்கிறது.
