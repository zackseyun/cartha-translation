source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: ta
  text: மேலும், அவர் உன்னை நெருக்கடியின் வாயிலிருந்து[a] ஈர்த்து, அடியில் எந்தக் கட்டுப்பாடும் இல்லாத விசாலமான இடத்திற்குக்[b] கொண்டுவந்தார்; உன் மேசையில் வைக்கப்பட்டது செழுமையால் நிறைந்திருந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துன்பத்தின் தாடைகளிலிருந்து”; צַר என்ற எபிரெயச் சொல் துன்பத்தையும் இடநெருக்கத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அடியில் நெருக்கமே இல்லாத விசாலமான இடத்திற்கு.” இங்குள்ள எபிரெயச் சொற்றொடரின் துல்லியமான பொருள் உறுதியற்றது.
    reason: textual_or_semantic_difficulty
  - marker: c
    text: “மேசையில் வைக்கப்பட்டது” என்பதற்கான எபிரெயச் சொல் அரிதானது; “உன் மேசையின் அமைதி” என்றும் புரிந்துகொள்ளலாம். “செழுமை” என்பதற்கு எபிரெயத்தில் நேரடியாக “கொழுமை”; அதாவது, வளமான உணவு அல்லது மிகுதி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: மேலும்
  rationale: இணைப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற தீவிரத்தைச் சேர்ப்பதில்லை.
- source_word: הֲסִיתְךָ
  choice: அவர் உன்னை … ஈர்த்து … கொண்டுவந்தார்
  rationale: סית என்பதன் ‘ஈர்த்தல்/விலக்கி அழைத்துச் செல்லுதல்’ என்ற பொருளைத் தக்கவைத்து, நெருக்கடியிலிருந்து விசாலத்திற்குச் செல்லும் இயக்கத்தைத் தமிழில் தெளிவாக்குகிறது.
- source_word: מִפִּי צָר
  choice: நெருக்கடியின் வாயிலிருந்து
  rationale: ‘வாய்’ என்ற கவித்துவ உருவகத்தையும், צַר என்பதிலுள்ள துன்பம் மற்றும் இடநெருக்கம் ஆகிய பொருள் நிழல்களையும் பாதுகாக்கிறது.
- source_word: רַחַב
  choice: விசாலமான இடத்திற்கு
  rationale: நெருக்கடிக்கு எதிரான இடவெளி உருவகத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: அடியில் எந்தக் கட்டுப்பாடும் இல்லாத
  rationale: சிக்கலான எபிரெயச் சொற்றொடரின் கட்டுப்பாடின்மை/நெருக்கமின்மை என்ற சூழல்சார் பொருளைப் பாதுகாக்கிறது.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: உன் மேசையில் வைக்கப்பட்டது
  rationale: נַחַת என்பது அரிதானதும் பொருள் தெளிவில்லாததும் ஆகும்; மேசைச் சூழலில் ‘வைக்கப்பட்டது’ என்பது சாத்தியமான பொருளை அளிக்கிறது, ஆனால் அதன் நிச்சயமின்மையை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: מָלֵא דָשֶׁן
  choice: செழுமையால் நிறைந்திருந்தது
  rationale: ‘கொழுமை’ என்ற நேரடி உருவகத்தின் வளம், மிகுதி, செழிப்பான உணவு ஆகிய கருத்துகளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: הֲסִיתְךָ என்ற வினையின் மறைமுக இறைச் செயப்பொருள்
  choice: முதன்மை உரையில் ‘அவர்’ என்று மட்டும் வழங்குதல்
  alternative: ‘கடவுள்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் செயப்பொருளை இறைவனாகச் சுட்டினாலும், எபிரெய மூலத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லை; ஆகவே மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: நெருக்கடியும் விசாலமும் குறித்த இடவெளி உருவகங்கள்
  choice: ‘வாய்,’ ‘விசாலமான இடம்’ ஆகிய உருவகங்களைத் தக்கவைத்தல்
  alternative: ‘துன்பத்திலிருந்து விடுதலைக்கு’ என்று கருத்தை மட்டும் உரைத்தல்
  rationale: இவ்வசனத்தின் கவித்துவ அழுத்தம் நெருக்கத்திற்கும் விசாலத்திற்கும் இடையிலான முரண்பாட்டில் உள்ளது; அதை விளக்கவுரையாகத் தட்டையாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் ‘நெருக்கடியின் வாய்—விசாலமான இடம்’ என்ற உருவக எதிர்மறைத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. அரிதான נַחַת மற்றும் சிக்கலான לֹא מוּצָק תַּחְתֶּיהָ ஆகியவற்றின் நிச்சயமின்மை அடிக்குறிப்புகளில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
