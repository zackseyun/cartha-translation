source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: ta
  text: ஆனால் அவர்கள் செவிகொடுக்காவிட்டால், வாளால் அழிந்துபோவார்கள்; அறிவில்லாமல்[a] இறந்துபோவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறிவு இல்லாததால்.”
    reason: כִּבְלִי דָעַת என்பதை நிலையைக் குறிப்பதாகவும் காரணத்தைக் குறிப்பதாகவும் புரிந்துகொள்ள முடியும்.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... விட்டால்
  rationale: முந்தைய வசனத்துடன் உள்ள நிபந்தனை சார்ந்த முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא יִשְׁמְעוּ
  choice: செவிகொடுக்காவிட்டால்
  rationale: שׁמע என்பதிலுள்ள கேட்டல், கவனித்தல், அதன்படி நடத்தல் ஆகிய அர்த்த விரிவை, ‘கீழ்ப்படியாவிட்டால்’ என்று குறுக்காமல் காக்கிறது.
- source_word: בְּשֶׁלַח
  choice: வாளால்
  rationale: இங்கு அழிவைக் கொண்டுவரும் ஆயுதத்தைக் குறிக்கிறது; சூழலில் ‘வாள்’ என்பது தெளிவான, இயல்பான பொருத்தம்.
- source_word: יַעֲבֹרוּ
  choice: அழிந்துபோவார்கள்
  rationale: עבר என்பதன் அடிப்படை ‘கடந்துபோதல்’ என்ற படிமம் இருந்தாலும், தீர்ப்பின் சூழலிலும் அடுத்த இணைவரியிலும் இது உயிரிழப்பைக் குறிக்கிறது; தமிழில் ‘கடந்துபோவார்கள்’ தெளிவற்றதாக இருக்கும்.
- source_word: וְיִגְוְעוּ
  choice: இறந்துபோவார்கள்
  rationale: גוע குறிக்கும் இறத்தலைத் தெளிவாகவும், இணைவரியின் ஒத்த அமைப்பைக் காத்தும் வழங்குகிறது.
- source_word: כִּבְלִי דָעַת
  choice: அறிவில்லாமல்
  rationale: அறிவற்ற நிலையில் இறப்பது என்ற எபிரெய கட்டமைப்பை இயல்பான தமிழில் தருகிறது; காரணப் பொருளும் சாத்தியமுள்ளதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: שׁמע என்பது வெறுமனே கேட்டலையா அல்லது கீழ்ப்படிதலையா குறிக்கிறது
  choice: செவிகொடுக்காவிட்டால்
  alternative: கேட்காவிட்டால்; கீழ்ப்படியாவிட்டால்
  rationale: இறை அறிவுரையை ஏற்று அதற்குப் பதிலளிக்கும் பொருள் சூழலில் உள்ளது. தேர்ந்த சொல் எபிரெயச் சொல்லின் பரப்பைக் காத்து, அதை வெறும் ஒலிகேட்டலாகவோ குறிப்பாகக் கீழ்ப்படிதலாகவோ சுருக்கவில்லை.
- issue: כִּבְלִי דָעַת காரணத்தையா நிலையையா குறிக்கிறது
  choice: அறிவில்லாமல்
  alternative: அறிவு இல்லாததால்
  rationale: எபிரெய முன்சொல் கட்டமைப்பு ‘அறிவில்லாமல்’ என்ற நிலைப்பொருளை இயல்பாக ஆதரிக்கிறது; காரணப் பொருள் சாத்தியமுள்ளதால் அதை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானாலும் கண்ணியமான ஞானநூல் நடை. ‘செவிகொடு’ கேட்டல் மற்றும் ஏற்றுக்கொள்ளுதல் ஆகிய இரண்டையும் இயல்பாகத் தாங்குகிறது. இணைவரி அமைப்பை ‘அழிந்துபோவார்கள் / இறந்துபோவார்கள்’ என்பவை காக்கின்றன.
