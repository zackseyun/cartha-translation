  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: ta
  text: நீதிமான்களிடமிருந்து அவர் தமது கண்களை விலக்குவதில்லை; அரியணையில் அரசர்களோடு அவர்களை என்றென்றும் அமரச் செய்கிறார்[a]; அவர் அவர்களை உயர்த்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அரியணையில் அரசர்களை அவர் என்றென்றும் அமரச் செய்கிறார்.” எபிரெயத் தொடர் சுருக்கமாக உள்ளது; நீதிமான்கள் அரசர்களோடு அமர்த்தப்படுகிறார்கள் என்பதற்குப் பதிலாக, அரசர்களையே இத்தொடர் நேரடியாகக் குறிக்கிறது என்றும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְרַע
  choice: விலக்குவதில்லை
  rationale: גרע என்பதற்கு ‘குறைத்தல், அகற்றுதல், எடுத்துவிடுதல்’ என்ற பொருள்கள் உண்டு. ‘தமது கண்களை’ என்பதோடு வருவதால், தொடர்ந்து கவனிப்பதை நிறுத்தாதிருப்பதை உணர்த்தும் ‘விலக்குவதில்லை’ என்பது இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: מִצַּדִּיק
  choice: நீதிமான்களிடமிருந்து
  rationale: ஒருமை வடிவிலுள்ள பெயரடை இங்கு ஒரு வகுப்பினரைப் பொதுவாகக் குறிக்கிறது. ஆகவே நவீன தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֵינָיו
  choice: தமது கண்களை
  rationale: கடவுளின் இடைவிடாத கவனிப்பைச் சித்தரிக்கும் எபிரெய உருவகத்தைச் சுருக்காமல், ‘கண்கள்’ என்ற நேரடியான சொல்லே தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: அரியணையில் அரசர்களோடு
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் இலக்கண ரீதியாகத் தெளிவற்றதுமாக உள்ளது. நீதிமான்கள் அரசர்களோடு அரச மரியாதையில் அமர்த்தப்படுகிறார்கள் என்ற தொடர்ச்சியை இத்தேர்வு இயல்பான தமிழில் தருகிறது; அரசர்களே நேரடிப் பொருள் என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיֹּשִׁיבֵם
  choice: அவர்களை … அமரச் செய்கிறார்
  rationale: ישׁב என்பதன் ஹிஃபில் வடிவம் ‘அமரச் செய்தல்’ என்று பொருள்படும். ‘அரியணை ஏற்றுகிறார்’ என்பது மூலத்தில் வெளிப்படையாக இருப்பதைவிட வலுவான விளக்கமாகிவிடும் என்பதால் தவிர்க்கப்பட்டுள்ளது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் לָנֶצַח என்பதற்கு ‘என்றென்றும்’ என்பது இயல்பான, கவிதைநயம் மிக்க நவீனத் தமிழ் இணை.
- source_word: וַיִּגְבָּהוּ
  choice: அவர்கள் உயர்த்தப்படுகிறார்கள்
  rationale: இறுதி வினைவடிவம் இச்சூழலில் சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது. விளைவுநிலையைத் தெரிவிக்கும் செயப்பாட்டு மொழிபெயர்ப்பு, யார் உயர்த்தப்படுகிறார்கள் என்பதைத் தெளிவாக்கி, கடவுளை வெளிப்படையான வினைமுதலாகக் கட்டாயப்படுத்துவதையும் தவிர்க்கிறது.
theological_decisions:
- issue: கடவுளின் கவனிப்பைக் குறிக்கும் மனிதவுருவ மொழி
  choice: ‘தமது கண்களை’ என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘தமது கவனத்தை’ அல்லது ‘தமது பராமரிப்பை’ என்று கருத்தை மட்டும் மொழிபெயர்த்தல்.
  rationale: மூலத்தின் கவித்துவமான மனிதவுருவச் சித்தரிப்பைத் தக்கவைப்பது, கடவுளின் இடைவிடாத கண்காணிப்பை அப்ஸ்ட்ராக்ட் கருத்தாக மாற்றாமல் வெளிப்படுத்துகிறது.
- issue: அரசர்களைப் பற்றிய தொடரில் ‘அவர்கள்’ என்பதன் சுட்டுப்பொருள்
  choice: பன்மைப் பிரதிப்பெயர் நீதிமான்களைக் குறிக்கிறது; அவர்கள் அரசர்களோடு அரியணையில் அமர்த்தப்படுகிறார்கள்.
  alternative: அது அரசர்களைக் குறிக்கிறது; கடவுள் அரசர்களை அரியணையில் என்றென்றும் அமரச் செய்கிறார்.
  rationale: முந்தைய ‘நீதிமான்’ என்பது கூட்டுப் பொருளில் வருவதால் அடுத்த பன்மைப் பிரதிப்பெயருக்கான இயல்பான சுட்டுப்பொருளாக அமைகிறது. இருப்பினும் எபிரெயத் தொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: இறுதி வினையின் வினைமுதல் மற்றும் வினைவகை
  choice: ‘அவர்கள் உயர்த்தப்படுகிறார்கள்’ என்ற விளைவுநிலை/செயப்பாட்டு வாசிப்பு.
  alternative: ‘அவர் அவர்களை உயர்த்துகிறார்’ என்ற செயப்பாட்டு அல்லாத, கடவுளை வினைமுதலாகக் கொண்ட வாசிப்பு.
  rationale: சுருக்கமான எபிரெய வடிவம் இரு புரிதல்களுக்கும் இடமளிக்கிறது. முதன்மை உரை முடிவுநிலையை முன்னிறுத்துகிறது; கடவுளை மறைமுக வினைமுதலாகப் புரியும் மாற்று வாசிப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
