  text: אֶשָּׂ֣א דֵ֭עִ/י לְ/מֵ/רָח֑וֹק וּ֝/לְ/פֹעֲלִ֗/י אֶֽתֵּֽן צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: ta
  text: தொலைவிலிருந்து என் அறிவைக் கொண்டுவருவேன்[a]; என்னைப் படைத்தவருக்கு நீதியை உரியதாகக் கூறுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அறிவைத் தொலைதூரத்துக்கு எடுத்துச் செல்வேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைப் படைத்தவருக்கு நியாயத்தை உரியதாகக் கூறுவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: கொண்டுவருவேன்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல், சுமத்தல், எடுத்துச் செல்லுதல்.’ ‘என் அறிவு’ என்பதோடும் தொலைவைக் குறிக்கும் தொடரோடும் வருவதால், தொலைவிலிருந்து அறிவை எடுத்துவந்து முன்வைப்பது என்ற உருவகத்தை ‘கொண்டுவருவேன்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: דֵעִי
  choice: என் அறிவை
  rationale: דעת என்பது அறிவு அல்லது புரிதலைக் குறிக்கிறது. ‘என் அறிவை’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு; ‘என் கருத்தை’ என்பது மூலச்சொல்லின் வலிமையைக் குறைத்துவிடும்.
- source_word: לְמֵרָחוֹק
  choice: தொலைவிலிருந்து
  rationale: இந்த முன்னிடைச்சொல் தொடர் தொலைதூரத்தை அல்லது தொலைவான மூலத்தைச் சுட்டலாம். இங்கு נשׂא உடன் சேர்ந்து அறிவு கொண்டுவரப்படும் மூலத்தைச் சுட்டுவதாக எடுத்துக்கொள்ளப்பட்டுள்ளது; திசை அல்லது எட்டும் பரப்பு என்ற மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּלְפֹעֲלִי
  choice: என்னைப் படைத்தவர்
  rationale: פעל என்ற வினையின் செய்பெயர் வடிவம் ‘செய்கிறவர்/உருவாக்குகிறவர்’ எனப் பொருள்படும்; முதலாம் நபர் ஒருமை பின்னொட்டுடன் இது பேச்சாளரை உருவாக்கிய கடவுளைக் குறிக்கிறது. ‘என்னைப் படைத்தவர்’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶתֵּן
  choice: என்று அறிவிப்பேன்
  rationale: נתן என்பதன் நேரடிப் பொருள் ‘கொடுப்பேன்.’ ஆனால் ‘நீதி’ என்பதைக் கடவுளுக்குக் கொடுப்பது என்ற எபிரெய வழக்கில், அவரிடம் அது இருக்கிறது என்று உரித்தாக்கி அறிவிப்பதே கருத்து. தமிழில் ‘என்று அறிவிப்பேன்’ இந்த உறுதிப்படுத்தும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צֶדֶק
  choice: நீதியுள்ளவர்
  rationale: צדק என்பது ஒழுக்க நேர்மையையும் நியாயத் தீர்ப்பையும் குறிக்கக்கூடும். ‘நீதியுள்ளவர்’ என்பது கடவுளின் குணத்தையும் செயல்களின் நேர்மையையும் உள்ளடக்கும் பரந்த சொல்லாக உள்ளது; ‘நியாயமாகச் செயல்படுகிறவர்’ என்ற நீதித்துறை சார்ந்த நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் צדק சொல்லின் பொருள்
  choice: என்னைப் படைத்தவர் நீதியுள்ளவர் என்று அறிவிப்பேன்
  alternative: என்னைப் படைத்தவர் நியாயமாகச் செயல்படுகிறவர் என்று அறிவிப்பேன்
  rationale: மூலச்சொல் கடவுளின் ஒழுக்க நேர்மையையும் அவரது நியாயமான செயல்பாட்டையும் குறிக்கவல்லது. முதன்மை வாசிப்பு பரந்த பொருளை வைத்திருக்கிறது; நீதித்துறை சார்ந்த நுட்பத்தை மாற்றுவாசிப்பாகக் குறிப்பது இறையியல் பதற்றத்தை ஒரே பொருளாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவிதைநயமுள்ள கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உரித்தாக்குவேன்’ போன்ற அரிதான இறையியல் சொல்லாட்சியைத் தவிர்த்து, எபிரெய மொழியின் அறிவித்தல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்தியுள்ளது.
