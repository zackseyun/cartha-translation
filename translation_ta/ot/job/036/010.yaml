  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: ta
  text: அவர் ஒழுக்கப் பயிற்சியை ஏற்கும்படி அவர்களுடைய செவியைத் திறக்கிறார்; அக்கிரமத்தை விட்டு திரும்ப வேண்டும் என்று அவர்களிடம் சொல்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒழுக்கப் பயிற்சிக்காக அவர்களுடைய செவியைத் திறக்கிறார்’ அல்லது ‘திருத்தத்தை ஏற்கும்படி அவர்களுடைய செவியைத் திறக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். ‘அக்கிரமம்’ என்பதற்கு ‘தீமை’ என்றும், சில சூழல்களில் ‘துன்பம்’ என்றும் பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: திறந்து
  rationale: גלה என்பதன் அடிப்படைப் பொருள் ‘வெளிப்படுத்து/மூடியதை அகற்று’; ‘செவி’ என்பதோடு வரும்போது ஏற்றுக்கேட்கும்படி செவியைத் திறப்பதைக் குறிக்கும் எபிரெய மொழிமரபை இயல்பான தமிழில் தருகிறது.
- source_word: אָזְנָם
  choice: அவர்களுடைய செவியை
  rationale: மூலத்தில் ஒருமை பெயர்ச்சொல்லுடன் பன்மை உரிமைப்பின்னொட்டு உள்ளது. கூட்டுப்பொருளுடைய ஒருமையைத் தக்கவைத்து எபிரெய உருவகத்தைப் பிரதிபலிக்கிறது.
- source_word: לַמּוּסָר
  choice: ஒழுக்கப் பயிற்சிக்கு
  rationale: מוּסָר என்பது அறிவுறுத்தல், திருத்தம், கண்டித்துத் திருத்தும் பயிற்சி ஆகிய பொருட்களைக் கொண்டது. இச்சூழலில் கற்பித்தலும் திருத்துதலும் இணைந்திருப்பதால் ‘ஒழுக்கப் பயிற்சி’ இரண்டையும் தாங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: சொல்கிறார்
  rationale: אמר என்பதன் எளிய பொருளைத் தருகிறது; கவிதை உரையின் நிகழ்கால ஓட்டத்துக்கு இயல்பாக உள்ளது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல் சொல்லப்பட்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְשֻׁבוּן
  choice: திரும்ப வேண்டும்
  rationale: שוב என்பது ‘திரும்பு’ என்று பொருள். இச்சூழலில் வேண்டுகோள் அல்லது கட்டளையின் வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது; நேரடி கட்டளை வடிவமாக மாற்றவில்லை.
- source_word: מֵאָוֶן
  choice: அக்கிரமத்தைவிட்டு
  rationale: אָוֶן என்பதற்கு தீமை, அக்கிரமம், துன்பம் ஆகிய பொருட்கள் உண்டு. தவறான நடத்தையிலிருந்து திரும்புதல் பற்றிய இச்சூழலில் ‘அக்கிரமம்’ அதன் ஒழுக்கநெறிப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: எலிகூவின் உரையில் מוּסָר என்பதன் தன்மை
  choice: திருத்தும் நோக்கமுள்ள ஒழுக்கப் பயிற்சி
  alternative: முற்றிலும் கற்பித்தல் சார்ந்த அறிவுறுத்தல்; அல்லது தண்டனை வலிமை அதிகமுள்ள கண்டித்தல்
  rationale: உடனடிச் சூழலில் துன்பத்தின் வழியாக மனிதர்களுக்குக் கற்பித்து அவர்களைத் தவறிலிருந்து திருப்புவதாக உரை கூறுகிறது. ‘ஒழுக்கப் பயிற்சி’ கற்பித்தல் மற்றும் திருத்துதல் ஆகிய இரண்டிற்குமிடையிலான பதற்றத்தைத் தக்கவைக்கிறது; துன்பத்தைப் பற்றிய குறிப்பிட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘செவியைத் திறந்து’ என்ற உருவகம் மூலத்துக்கு நெருக்கமாகத் தக்கவைக்கப்பட்டுள்ளது; ‘ஒழுக்கப் பயிற்சி’ என்பது கற்பித்தல் மற்றும் திருத்துதல் ஆகிய இரு நுணுக்கங்களையும் இணைக்கிறது.
