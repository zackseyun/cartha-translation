source:
  edition: WLC
  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: ta
  text: 'மனிதர்கள் அனைவரும்[b] அதைக்[a] கண்டிருக்கிறார்கள்;

    மனிதன் தொலைவிலிருந்து நோக்குகிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைக் கண்டிருக்கிறார்கள்.’ எபிரெயச் சுட்டுப்பெயர் ஆண்பால் ஒருமையில் இருப்பதால் அது கடவுளை நேரடியாகக் குறிக்கலாம்; ஆனால் சூழலில் அது கடவுளின் செயலையோ செய்கையையோ குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: இங்குள்ள ‘மனிதர்கள்’ என்பதும் அடுத்த அடியிலுள்ள ‘மனிதன்’ என்பதும் ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கின்றன. இவை முறையே எபிரெய אָדָם, אֱנוֹשׁ ஆகிய சொற்களைப் பிரதிபலிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: மனிதர்கள் அனைவரும்
  rationale: כָּל உடன் வரும் אָדָם மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது. பாலின வேறுபாடின்றி எல்லா மனிதர்களையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழாக இச்சொற்றொடர் அமைந்துள்ளது.
- source_word: חָזוּ
  choice: கண்டிருக்கிறார்கள்
  rationale: חזה என்பது காண்பதையோ கவனித்துப் பார்ப்பதையோ குறிக்கலாம். இங்கு மனிதர்கள் அனைவருக்கும் பொதுவான அனுபவத்தைத் தெரிவிக்க, நிறைவுற்ற செயலை உணர்த்தும் ‘கண்டிருக்கிறார்கள்’ பொருத்தமாக உள்ளது.
- source_word: בּוֹ
  choice: அதை
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இலக்கணப்படி ‘அவரை’ என்றும் பொருள்படலாம். ஆனால் முந்தைய வசனத்தில் சொல்லப்பட்ட கடவுளின் செயலை இது சுட்டுவதாகச் சூழல் காட்டுவதால் ‘அதை’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; தனிப்பட்ட சுட்டலுக்கான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: אֱנוֹשׁ மனிதரை, சில வேளைகளில் அவரது சாவுக்குரிய நிலையையோ பலவீனத்தையோ வலியுறுத்திக் குறிக்கிறது. இங்கு முதல் அடியுடன் இணையான பொதுப்பொருளை இயல்பாகக் காக்க ‘மனிதன்’ பயன்படுத்தப்படுகிறது.
- source_word: יַבִּיט
  choice: நோக்குகிறான்
  rationale: נבט என்பதன் ஹிஃபில் வடிவம் கவனமாகப் பார்ப்பதையோ நோக்குவதையோ குறிக்கிறது. ‘நோக்குகிறான்’ தொடர்ந்த பார்வையின் நுண்ணுணர்வையும் கவிதை நடையையும் காக்கிறது.
- source_word: מֵרָחוֹק
  choice: தொலைவிலிருந்து
  rationale: מִן + רָחוֹק தொலைவில் இருந்து பார்ப்பதைக் குறிக்கிறது. ‘தொலைவிலிருந்து’ தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: בּוֹ என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் antecedent
  choice: கடவுளின் செயலைச் சுட்டும் ‘அதை’
  alternative: கடவுளையே சுட்டும் ‘அவரை’
  rationale: முந்தைய வசனத்தில் கடவுள் செய்துள்ள செயலைக் கவனிக்குமாறு கூறப்படுவதால், அந்தச் செயலே இங்கு சுட்டப்படுவது சூழலுக்கு ஏற்றது. எனினும் எபிரெய ஆண்பால் ஒருமை வடிவம் கடவுளை நேரடியாகச் சுட்டும் வாசிப்பையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கவிதைக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரு அடிகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது; ‘தொலைவிலிருந்து நோக்குகிறான்’ என்பது மூலத்தின் சுருக்கமான கவிதைத் தன்மையைத் தக்கவைக்கிறது.
