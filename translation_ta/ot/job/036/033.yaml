source:
  edition: WLC
  text: יַגִּ֣יד עָלָ֣י/ו רֵע֑/וֹ מִ֝קְנֶ֗ה אַ֣ף עַל עוֹלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: ta
  text: 'அதன் இடிமுழக்கம் அவரைக் குறித்து அறிவிக்கிறது[a];

    எழும்பி வருவதைக் குறித்துக் கால்நடைகளும்கூட அறிவிக்கின்றன.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை கடினமானது. ‘அதன் இடிமுழக்கம்’ என்பதற்குப் பதிலாக, சொல்லை நேரடியாக ‘அவருடைய நண்பன்’ என்றும் வாசிக்கலாம்; இந்த வரி புயலின் இரைச்சலைக் குறிப்பதாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எழும்பி வரும் புயலைக் குறித்துக் கால்நடைகளும்கூட அறிவிக்கின்றன.’ இறுதிச் சொற்றொடர் நெருங்கிவரும் புயலைக் குறிப்பதாக இருக்கலாம்; ஆனால் எபிரெய உரை ‘எழும்பி வருவது’ என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: அறிவிக்கிறது
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘அறிவி, தெரியப்படுத்து’ என்று பொருள்படும். கவிதை நடைக்கும் அறிவிப்பு என்ற கருத்துக்கும் இது இயல்பாகப் பொருந்துகிறது.
- source_word: עָלָיו
  choice: அவரைக் குறித்து
  rationale: עַל என்ற முன்னிடைச்சொல் இங்கு ‘குறித்து’ அல்லது ‘பற்றி’ என்ற நடுநிலையான பொருளைத் தரலாம். ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு தெளிவாக இல்லாததால், அதை விளக்கிச் சொல்லாமல் ‘அவரை’ எனப் பாதுகாக்கிறது.
- source_word: רֵעוֹ
  choice: அதன் இடிமுழக்கம்
  rationale: மெய்யெழுத்து வடிவம் கடினமானது; சொல்லை அப்படியே வாசித்தால் ‘அவருடைய நண்பன்’ எனவும் அமையலாம். ஆனால் சுற்றியுள்ள புயல் வருணனையின் அடிப்படையில், பலர் இதைப் புயலின் ஒலி அல்லது இடிமுழக்கம் என்று புரிந்துகொள்கிறார்கள். வாசிக்கத் தெளிவாக ‘அதன் இடிமுழக்கம்’ எனத் தரப்பட்டு, நேரடியான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: מִקְנֶה
  choice: கால்நடைகள்
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாக மாடுகள் அல்லது கால்நடைகளைக் குறிக்கிறது. நெருங்கிவரும் வானிலை மாற்றத்தை விலங்குகள் உணர்வதாகக் கூறும் சூழலில் ‘கால்நடைகள்’ பொருத்தமானது.
- source_word: אַף
  choice: -உம்கூட
  rationale: இத்துகள் சேர்த்தல் அல்லது வலியுறுத்தலைக் குறிக்கிறது. தமிழில் ‘கால்நடைகளும்கூட’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: குறித்து
  rationale: முன்னிடைச்சொல்லின் ‘பற்றி/குறித்து’ என்ற நடுநிலைப் பொருளைப் பாதுகாத்து, கடினமான வரியை அளவுக்கு மீறி விளக்குவதைத் தவிர்க்கிறது.
- source_word: עוֹלֶה
  choice: எழும்பி வருவது
  rationale: עלה என்பதன் நிகழ்கால வினையெச்சம் ‘மேலே செல்கிறது, எழும்புகிறது’ என்று பொருள்படும். எது எழும்புகிறது என்பதை எபிரெய உரை குறிப்பிடாததால், ‘புயல்’ அல்லது ‘மேகம்’ என்று வெளிப்படையாகச் சேர்க்காமல் திறந்த நிலையைக் காக்கிறது.
theological_decisions:
- issue: עָלָיו என்பதிலுள்ள ஆண்பால் ஒருமைச் சுட்டின் குறிப்பு
  choice: ‘அவரைக் குறித்து’ எனக் குறிப்பைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘தேவனைக் குறித்து’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: சூழலில் தேவன் குறிக்கப்படலாம்; ஆனால் இவ்வசனத்தின் கடினமான எபிரெய உரை பெயரை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரியின் இலக்கண மற்றும் சொற்பொருள் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது; இரண்டாம் அடியில் விடுபட்டுள்ள ‘அறிவிக்கின்றன’ என்ற வினை தமிழில் இயல்புக்கும் தெளிவுக்கும் ஏற்றவாறு மீண்டும் வழங்கப்பட்டுள்ளது.
