theological_decisions:
- issue: יְחַיֶּה என்பதை உயிர்த்தெழுதல் அல்லது இறையியல் சார்ந்த உயிரளித்தல் எனப் பொருள்படுத்தலாமா?
  choice: காலத்திற்குள் உயிரைப் பாதுகாத்து வைத்திருப்பதைக் குறிக்கும் 'உயிரோடு வைத்திருப்பதில்லை'
  alternative: '''உயிரளிப்பதில்லை'' அல்லது ''உயிர்ப்பிப்பதில்லை'''
  rationale: 'உடனடியான கவிதைச் சூழல் கடவுளின் நீதியான ஆட்சியைப் பற்றியது: அவர் பொல்லாதவனை உயிரோடு காத்து வைப்பதில்லை; துன்புறுவோருக்கு நீதியை வழங்குகிறார். உயிர்த்தெழுதல் பற்றிய கருத்தை இங்கு சேர்ப்பதற்கு மூலமொழி ஆதாரம் இல்லை.'
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் இரண்டு சமச்சீர் அடிகளுக்கிடையிலான முரண் 'ஆனால்' மூலம் தெளிவாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
