    rationale: லֹא בְצָר என்ற கடினமான சொற்றொடரில் לֹא (‘இல்லை/அல்ல’) முக்கியமான உரையியல் சிக்கல். ‘துன்பம் வரும்போது’ எனும் முதன்மை விளக்கத்திற்கு மாறாக, பாரம்பரியமான ‘துன்பத்தில் அல்ல’ வாசிப்பை அடிக்குறிப்பு நேரடியாகச் சொல்ல வேண்டும்.
