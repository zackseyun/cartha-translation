revisions:
- from: துன்பம் வரும்போது உன் உதவிக்குரல் பயனளிக்குமா[b][a]? உன் வலிமையான முயற்சிகள் அனைத்தும் பயனளிக்குமா?
  to: துன்பம் வரும்போது உன் உதவிக்குரல் பயனளிக்குமா[b][a], அல்லது உன் வலிமையின் எல்லா முயற்சிகளும் பயனளிக்குமா?
  rationale: முதன்மை வாசிப்பாக மசோரெட்டிக் உயிர்க்குறிப்புக்கேற்ப ‘உன் உதவிக்குரல்’ தக்கவைக்கப்பட்டது. ஆங்கில POB audit trail ஏற்றுக்கொண்ட சூழ்நிலை விளக்கமான ‘துன்பம் வரும்போது’ என்பதும் முதன்மை உரையில் உள்ளது; ஆனால் לֹא-வின் எதிர்மறைப் பொருளை மறைக்காமல் [b] அடிக்குறிப்பில் பாரம்பரிய மாற்று வாசிப்பு சேர்க்கப்பட்டது. וְכֹל-இன் இணைப்பை ‘அல்லது’ மூலம் வெளிப்படுத்தி, மַאֲמַצֵּי כֹחַ-இன் இரட்டைப் பொருளை ‘வலிமையின் எல்லா முயற்சிகளும்’ என்று நெருக்கமாக்கினேன்.
