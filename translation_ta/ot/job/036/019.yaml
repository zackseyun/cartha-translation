  text: הֲ/יַעֲרֹ֣ךְ שׁ֭וּעֲ/ךָ לֹ֣א בְ/צָ֑ר וְ֝/כֹ֗ל מַאֲמַצֵּי כֹֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: ta
  text: துன்பம் வரும்போது உன் உதவிக்குரல் பயனளிக்குமா[b][a], அல்லது உன் வலிமையின் எல்லா முயற்சிகளும் பயனளிக்குமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கடினமான எபிரெயச் சொற்றொடருக்கு வேறொரு விளக்கத்தைப் பின்பற்றினால்: “நீ துன்பத்தில் சிக்காதபடி உன் செல்வமோ, உன் வலிமையின் எல்லா முயற்சிகளுமோ பயனளிக்குமா?”'
    reason: alternative_reading
  - marker: b
    text: இந்த வசனத்தின் எபிரெய உரை கடினமானது; குறிப்பாக “உன் உதவிக்குரல்” என்றும் இங்கு “துன்பம் வரும்போது” என்றும் மொழிபெயர்க்கப்பட்ட சொற்றொடர்கள். பிந்தைய சொற்றொடர் பாரம்பரியமாக “துன்பத்தில் அல்ல” என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: பயனளிக்குமா
  rationale: ערך என்பதன் அடிப்படைப் பொருள் ‘ஒழுங்குபடுத்து/வரிசைப்படுத்து’ என்பதாக இருந்தாலும், இக்கடினமான கவிதைச் சூழலில் ‘போதுமா, உதவுமா, பயனளிக்குமா’ என்ற சொல்லாட்சிப் பொருள் இயல்பாக உள்ளது. கேள்வியின் எதிர்பார்க்கப்படும் மறுப்புப் பதிலையும் தமிழில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: שׁוּעֲךָ
  choice: உன் உதவிக்குரல்
  rationale: மசோரெட்டிக் உயிர்க்குறிப்பின்படி שׁוע என்பது உதவிக்கான அழுகுரல் அல்லது மன்றாட்டு. ‘உதவிக்குரல்’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் அந்த நோக்கத்தையும் தக்கவைக்கிறது; ‘செல்வம்’ என்ற மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא בְצָר
  choice: துன்பம் வரும்போது
  rationale: சொல்லுக்கு சொல் எடுத்தால் לֹא என்பது ‘இல்லை/அல்ல’ என்றும் בְצָר என்பது ‘நெருக்கடியில்’ என்றும் பொருள்படும். ஆனால் இங்கு சுருக்கமான, பொருள் தெளிவில்லாத கவிதை அமைப்பைச் சூழ்நிலைக் கூறாகப் புரிந்து, இயல்பான தமிழில் ‘துன்பம் வரும்போது’ என்று தரப்பட்டுள்ளது. எதிர்மறையை நேரடியாகப் பேணும் மாற்று விளக்கம் அடிக்குறிப்பில் உள்ளது.
- source_word: וְכֹל
  choice: அனைத்தும்
  rationale: וְ என்ற இணைப்பு இரண்டாவது சாத்தியமான ஆதாரத்தையும் கேள்விக்குள் சேர்க்கிறது. தமிழில் தனிக் கேள்வியாக அமைத்ததால் ‘அல்லது/மற்றும்’ என்பதை வெளிப்படையாகச் சேர்க்காமல், ‘அனைத்தும்’ மூலம் தொடர்ச்சி இயல்பாகப் பேணப்படுகிறது.
- source_word: מַאֲמַצֵּי כֹחַ
  choice: உன் வலிமையான முயற்சிகள்
  rationale: முயற்சி/கடுமையான பிரயத்தனம் மற்றும் வலிமை ஆகிய இரு கூறுகளையும் இயல்பான நவீன தமிழில் இணைக்கிறது. நேரடியான அழைப்பும் இணை அமைப்பும் காரணமாக ‘உன்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: துன்பத்தில் மனித வளங்கள் பயனளிக்குமா என்ற சொல்லாட்சிக் கேள்வி
  choice: உதவிக்குரலும் வலிமையான முயற்சிகளும் பயனளிக்குமா எனத் திறந்த சொல்லாட்சிக் கேள்வியாகப் பேணப்பட்டது.
  alternative: இவை நிச்சயமாகப் பயனற்றவை என்று நேரடிக் கூற்றாக மாற்றுவது.
  rationale: எபிரெய உரை கேள்வி வடிவிலேயே உள்ளது; அதன் வலியுறுத்தலை விளக்கவுரையாக மாற்றாமல், வாசகர் உணரும்படி அதே வடிவம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் சுருக்கமான சொல்லாட்சிக் கேள்வி இரண்டு இணையான கேள்விகளாக வழங்கப்பட்டுள்ளது; உரையின் உண்மையான தெளிவின்மை [a], [b] அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
