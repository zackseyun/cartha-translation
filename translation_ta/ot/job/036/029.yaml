source:
  edition: WLC
  text: אַ֣ף אִם יָ֭בִין מִפְרְשֵׂי עָ֑ב תְּ֝שֻׁא֗וֹת סֻכָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/029.yaml
  text: Can anyone understand the spreading of the clouds[a], the thunderings of his shelter?
translation:
  language: ta
  text: மேகங்கள் விரிந்துபரவுவதையும், அவருடைய கூடாரத்தின் முழக்கங்களையும்[a] யார் புரிந்துகொள்ள முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முழக்கங்கள்” என்பதை “இடிமுழக்கங்கள்,” “பேரிரைச்சல்கள்” என்றும் மொழிபெயர்க்கலாம்; “கூடாரம்” என்பதற்கு “குடில்,” “மூடுதிரை” என்ற பொருள்களும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אִם
  choice: யாரால் ... முடியும்?
  rationale: இச்சூழலில் இது வெறும் நிபந்தனைத் தொடராக இல்லாமல், மனிதனால் இந்நிகழ்வுகளைப் புரிந்துகொள்ள இயலுமா என்று கேட்கும் வினாவாக அமைகிறது. இயல்பான தமிழில் வினாவின் சவாலை இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: יָבִין
  choice: புரிந்துகொள்ள
  rationale: בין என்ற வினைச்சொல்லின் புரிதல் அல்லது பகுத்தறிதல் என்னும் பரந்த பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: מִפְרְשֵׂי
  choice: விரிந்துபரவுவதை
  rationale: விரித்தல் அல்லது பரப்புதல் சார்ந்த எபிரெய உருவகத்தைச் செயற்பாட்டுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָב
  choice: மேகங்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் மேகத்திரளைக் குறிக்கக்கூடும்; தமிழில் பன்மை இவ்வானிலை நிகழ்வை இயல்பாகக் காட்டுகிறது.
- source_word: תְּשֻׁאוֹת
  choice: முழக்கங்கள்
  rationale: இந்தச் சொல் பெரும் ஓசை, இரைச்சல், இடிமுழக்கம் போன்றவற்றைக் குறிக்கும்; 'முழக்கங்கள்' அதன் பரந்த கவித்துவப் பொருளைப் பேணுகிறது.
- source_word: סֻכָּתוֹ
  choice: அவருடைய கூடாரம்
  rationale: סֻכָּה என்பது குடில், தங்குமிடம் அல்லது மூடுதிரை போன்ற பொருள்களை உடையது. 'கூடாரம்' தேவனுடைய மேகமூடிய வாசஸ்தலம் என்ற கவித்துவ உருவகத்தை இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: סֻכָּתוֹ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் குறிப்பு
  choice: '''அவருடைய'' என்பது தேவனைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.'
  alternative: அது புயல் மேகத்தையோ அதன் மூடிடத்தையோ பொதுவாகக் குறிப்பதாகக் கொள்ளலாம்.
  rationale: உடனடிச் சூழலில் எலிகூ தேவன் வானிலையைக் கட்டுப்படுத்தும் அதிசயத்தை விவரிக்கிறார். எனவே தேவனைக் குறிப்பதாகக் கொள்வது உரையோட்டத்துக்கு ஏற்றது; அதேவேளையில் உருவகம் விளக்கிச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவித்துவ மாண்பைத் தக்கவைத்தும் சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் அமைக்கப்பட்டது. இணையான இரு வினாக்கூறுகளிலும் 'யாரால் புரிந்துகொள்ள முடியும்?' என்பதை வெளிப்படையாகத் திரும்பக் கூறுவது தமிழில் தெளிவை அளிக்கிறது.
