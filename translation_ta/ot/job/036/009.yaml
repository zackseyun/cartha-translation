  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
translation:
  language: ta
  text: அப்போது அவர் அவர்களுக்கு அவர்களுடைய செயல்களையும் மீறுதல்களையும், அவர்கள் அகந்தையுடன் நடந்துகொண்டார்கள் என்பதையும்[a] அறிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாகச் சொன்னால், “அவர்கள் வலிமை பெற்றார்கள்.” இச்சூழலில் இது தங்களை உயர்த்திக்கொள்வதையோ அகந்தையுடன் செயல்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: அப்போது ... அறிவிக்கிறார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், அறிவித்தல்’ என்று பொருள்படும். சுற்றியுள்ள நிபந்தனைத் தொடரில் வாவை இயல்பான தமிழில் ‘அப்போது’ என வழங்குவது பொருத்தமானது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: முன்னிடைச்சொல்லும் பன்மைச் சுட்டுப்பெயர் பின்னொட்டும் சேர்ந்து அறிவிப்பைப் பெறுபவர்களைக் குறிக்கின்றன.
- source_word: פָּעֳלָם
  choice: அவர்களுடைய செயல்கள்
  rationale: இங்கு ‘வேலை’ என்பதைக் காட்டிலும், ஒழுக்க மதிப்பீட்டுக்கு உட்படும் அவர்கள் செய்த காரியங்களை ‘செயல்கள்’ இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: וּפִשְׁעֵיהֶם
  choice: மீறுதல்கள்
  rationale: פשע என்பது உரிய அதிகாரத்துக்கு எதிரான கலகம் அல்லது வரம்புமீறிய குற்றச்செயலைக் குறிக்கலாம். ‘மீறுதல்கள்’ அதன் ஒழுக்கக் கடுமையைப் பாதுகாக்கும் பொதுவான, பிரிவுசார்பற்ற சொல்.
- source_word: כִּי
  choice: என்பதையும்
  rationale: இங்கு כִּי, அறிவிக்கப்படும் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டுள்ளது. தமிழில் ‘என்பதையும்’ முந்தைய பொருள்களுடன் இயல்பாக இணைகிறது.
- source_word: יִתְגַּבָּרוּ
  choice: அகந்தையுடன் நடந்துகொண்டார்கள்
  rationale: גבר என்பதன் ஹித்பயேல் வடிவம் சொற்பட ‘வலிமை பெற்றார்கள்’ என அமையலாம்; ஆனால் ‘மீறுதல்கள்’ என்ற ஒழுக்கச் சூழலில் தங்களை உயர்த்திக்கொண்ட ஆணவமான நடத்தையைக் குறிப்பதே வாய்ப்புள்ளது.
theological_decisions:
- issue: יִתְגַּבָּרוּ என்பதிலுள்ள ஒழுக்க நுணுக்கம்
  choice: அகந்தையுடன் நடந்துகொண்டார்கள்
  alternative: வலிமை பெற்றார்கள்; தங்களை உயர்த்திக்கொண்டார்கள்
  rationale: இது வலிமையைத் தன்னிலேயே குற்றமாக்கவில்லை; தேவன் வெளிப்படுத்தும் குற்றமான சுயமேன்மை அல்லது ஆணவத்தைச் சுட்டுகிறது. அதேவேளையில் சொற்பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதவாக்கியத்துக்குரிய செறிவும் காக்கப்பட்டுள்ளன. ‘அறிவிக்கிறார்’, ‘மீறுதல்கள்’, ‘அகந்தையுடன் நடந்துகொண்டார்கள்’ ஆகியவை புரிந்துகொள்ள எளிதானவையாகவும் தேவையற்ற சமயப் பிரிவு சார்பில்லாதவையாகவும் தேர்ந்தெடுக்கப்பட்டன.
