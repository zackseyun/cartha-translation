  terminology: ‘செயல்கள்’ and ‘மீறுதல்கள்’ appropriately convey פָּעֳלָם and פִשְׁעֵיהֶם in modern standard Tamil. ‘அகந்தையுடன் நடந்துகொண்டார்கள்’ preserves the likely ethical force without making a doctrinal claim. No name or theological-term concerns arise.
