  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: ta
  text: அவர்கள் சங்கிலிகளால் கட்டப்பட்டு[a], துன்பத்தின் கயிறுகளில் சிக்கியிருந்தால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சங்கிலிகளால்’ என்பதற்குப் பதிலாக ‘விலங்குகளால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘துன்பத்தின் கயிறுகளில்’ என்பதற்குப் பதிலாக ‘துயரத்தின் கயிறுகளில்’ அல்லது ‘வறுமையின் கயிறுகளில்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் சூழலுக்கேற்ப துன்பம், துயரம் அல்லது வறுமையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: அவர்கள் … இருந்தால்
  rationale: וְ தொடர்ச்சியையும் אִם நிபந்தனையையும் குறிக்கிறது. தமிழில் முந்தைய உரையோட்டத்துடன் இயல்பாக இணையும் நிபந்தனை வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: אֲסוּרִים
  choice: கட்டப்பட்டு
  rationale: אסר என்பதன் செயல்படுபொருள் நிலையைப் பாதுகாத்து, அவர்கள் கட்டுண்ட நிலையில் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּזִּקִּים
  choice: சங்கிலிகளில்
  rationale: கட்டுப்படுத்தும் சங்கிலிகள் அல்லது விலங்குகளைக் குறிக்கும் சொல்லின் தெளிவான, பொதுவாகப் புரியும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יִלָּכְדוּן
  choice: அகப்பட்டிருந்தால்
  rationale: לכד என்பதன் நிஃபால் வடிவம் பிடிக்கப்படுதல் அல்லது சிக்கிக்கொள்ளுதல் என்ற செயல்படுபொருள் பொருளைக் கொண்டது; இங்கு தொடரும் கட்டுண்ட நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּחַבְלֵי
  choice: கயிறுகளில்
  rationale: חבל என்பதன் கயிறு அல்லது கட்டு என்ற கண்முன் நிற்கும் உருவகத்தைத் தக்கவைத்து, சங்கிலி உருவகத்துடன் இணைக்கிறது.
- source_word: עֹנִי
  choice: துன்பத்தின்
  rationale: עֹנִי துன்பம், துயரம் அல்லது வறுமையைக் குறிக்கலாம். இச்சூழலில் பொருளாதார வறுமை என்று குறுக்காமல், அனுபவிக்கும் வேதனையை விரிவாகக் குறிக்க ‘துன்பம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: கட்டுப்பாட்டின் உருவகம் நேரடியானதா அல்லது உருவகமானதா
  choice: சங்கிலி, கயிறு ஆகிய நேரடியான உருவகங்களைத் தக்கவைத்து, அவை துன்பத்தையோ இறைவனுடைய ஒழுக்கப்படுத்துதலையோ குறிக்கக்கூடிய இடத்தை விடுதல்
  alternative: இதை முற்றிலும் நேரடியான சிறையிருப்பாகவோ, முற்றிலும் உருவகமான இடுக்கணாகவோ வெளிப்படையாக விளக்குதல்
  rationale: எபிரெயச் சொற்கள் உடல் கட்டுப்பாட்டைக் கண்முன் நிறுத்துகின்றன; ஆனால் சூழல் துன்புறுவோருடன் கடவுள் நடந்துகொள்வதைப் பற்றியது. ஆகவே மொழிபெயர்ப்பு எந்த ஓர் விளக்கத்தையும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. சங்கிலி–கயிறு இணை உருவகம் பாதுகாக்கப்பட்டுள்ளது; வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனைத் துணைவாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
