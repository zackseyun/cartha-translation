  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: ta
  text: இதோ, கடவுள் வல்லவர்; அவர் இகழ்வதில்லை[a]. உள்ளத்தின் ஆற்றலில் அவர் வல்லவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புறக்கணிப்பதில்லை’ அல்லது ‘தள்ளிவிடுவதில்லை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் யாரை அல்லது எதை என்று செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘உள்ளத்தின் ஆற்றல்.’ இது மனவலிமை, புரிந்துகொள்ளும் திறன் அல்லது நோக்கத்தின் உறுதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: வலியுறுத்தும் அறிமுகச் சொல்லாகிய இதன் கவிதைநடையையும் கவனத்தை ஈர்க்கும் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இது கடவுளைக் குறிக்கும் பொதுவான கவிதைச்சொல்; தனிப்பட்ட பட்டப்பெயராக விரிவாக்க வேண்டியதில்லை.
- source_word: כַּבִּיר
  choice: வல்லவர்
  rationale: பெருமையையும் வல்லமையையும் குறிக்கும் இச்சொல்லின் இரு நிகழ்வுகளிலும் ஒரே சொல்லைப் பயன்படுத்தி எபிரெய மறுபடியுரைத்தலைக் காக்கிறது.
- source_word: וְלֹא יִמְאָס
  choice: அவர் இகழ்வதில்லை
  rationale: மָאַס என்பது இகழ்தல், புறக்கணித்தல் அல்லது தள்ளிவிடுதல் எனப் பொருள்படலாம். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படாததால் தமிழிலும் அதைச் சேர்க்காமல் வைத்திருக்கிறது.
- source_word: כֹּחַ לֵב
  choice: உள்ளத்தின் ஆற்றல்
  rationale: சொல்லடியாக உள்ளத்தின் அல்லது இதயத்தின் வலிமை என்று பொருள்படும் உருவகத்தைப் பேணுகிறது; அதேவேளை ‘புரிந்துகொள்ளும் திறன்’ அல்லது ‘உறுதியான நோக்கம்’ என்ற சாத்தியங்களையும் ஒரே பொருளாகக் குறுக்கவில்லை.
theological_decisions:
- issue: ‘இகழ்வதில்லை’ என்பதன் மறைந்துள்ள செயப்படுபொருள்
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘அவர் இகழ்வதில்லை’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர் எவரையும் இகழ்வதில்லை’ அல்லது ‘அவர் தள்ளிவிடுவதில்லை’
  rationale: மூல எபிரெயம் யாரை அல்லது எதை என்று குறிப்பிடவில்லை. ‘எவரையும்’ என்று சேர்ப்பது சாத்தியமான கருத்தைத் தெளிவாக்கினாலும், மூலத்தில் இல்லாத பொதுமைப்படுத்தலை ஏற்படுத்தும்; ஆகவே தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: ‘உள்ளத்தின் ஆற்றல்’ என்பதன் பொருள்
  choice: எபிரெய உருவகத்தைப் பேணுதல்
  alternative: ‘புரிந்துகொள்ளும் திறனில் வல்லவர்’ அல்லது ‘நோக்கத்தின் உறுதியில் வல்லவர்’
  rationale: לֵב என்பது உள்ளம், மனம், புரிதல், நோக்குறுதி ஆகிய கருத்துகளைத் தாங்கலாம். ஒரே விளக்கத்துக்குள் வசனத்தைச் சுருக்காமல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. ‘வல்லவர்’ என்ற மறுபடியுரைத்தல் எபிரெயச் செய்யுளின் அமைப்பைப் பேணுகிறது; இயல்புக்காக இரண்டாம் அரையடியில் சொல்வரிசை தமிழுக்கேற்ப மாற்றப்பட்டுள்ளது.
