source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: ta
  text: ஏனெனில், கடுங்கோபம் உன்னை ஏளனம் செய்யத் தூண்டிவிடாதபடி எச்சரிக்கையாக இரு[a]; பெரும் மீட்புத்தொகை[b][c] உன்னை வழிவிலகச் செய்யாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைகொட்டத் உன்னைத் தூண்டிவிடாதபடி.” இங்கே “ஏளனம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் பொருள் தெளிவில்லாதது; அது கைகளால் அடிப்பதையோ கைகொட்டுவதையோ, ஒருவேளை இகழ்ச்சியை வெளிப்படுத்தும் சைகையாக அவ்வாறு செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிகுதியான மீட்புத்தொகை உன்னைச் சாய்த்துவிடாதிருக்கட்டும்.” எபிரெயில் “பெரும்” என்பது “மீட்புத்தொகை” என்பதை நேரடியாகத் தகுதிப்படுத்துவதாக வாசிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “மீட்புத்தொகை” என்பதற்கு “பரிகார விலை” என்றும், சில சூழல்களில் “கையூட்டு” என்றும் பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பின்வரும் எச்சரிக்கையை முந்தைய கருத்தோடு காரணத் தொடர்பில் இணைக்கிறது; எபிரெயச் சொல்லின் காரணப் பொருளைப் பேணுகிறது.
- source_word: חֵמָה
  choice: கடுங்கோபம்
  rationale: வெறும் ‘கோபம்’ என்பதைவிட மூலச்சொல்லின் தீவிரத்தை வெளிப்படுத்துகிறது; அது யாருடைய கோபம் என்பதைத் திட்டவட்டமாக்காமல் விடுகிறது.
- source_word: פֶּן
  choice: …விடாதபடி எச்சரிக்கையாக இரு
  rationale: நிகழக்கூடிய தவறான விளைவைக் குறித்த எச்சரிப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְסִיתְךָ
  choice: உன்னை … செய்யத் தூண்டிவிடு
  rationale: சூழலில் ஒருவரைத் தூண்டுதல் அல்லது தவறான வழியில் இட்டுச் செல்லுதல் என்ற Hiphil வினையின் பொருளைத் தருகிறது.
- source_word: בְסָפֶק
  choice: ஏளனம் செய்ய
  rationale: இது பொருள் தெளிவில்லாத எபிரெயச் சொல். சூழலில் கைகொட்டுதல் போன்ற இகழ்ச்சிச் சைகையைக் குறிக்கும் வாய்ப்பு இருப்பதால், அதன் சாத்தியமான கருத்தை முதன்மை உரையில் இயல்பாகத் தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְרָב כֹּפֶר
  choice: பெரும் மீட்புத்தொகை
  rationale: רָב என்பதை כֹּפֶר என்பதைக் குறிப்பதாக வாசித்து, விளைவிலிருந்து விடுவிப்பதற்குச் செலுத்தப்படும் பெரிய தொகை என்ற அடிப்படைப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: אַל יַטֶּךָּ
  choice: உன்னை வழிவிலகச் செய்ய வேண்டாம்
  rationale: נטה என்ற வினையிலுள்ள சரியான பாதையிலிருந்து திருப்புதல் அல்லது சாய்த்தல் என்ற உருவகத்தைப் பேணுகிறது.
theological_decisions:
- issue: ‘கடுங்கோபம்’ யாருடையது?
  choice: யாருடைய கோபம் என்று குறிப்பிடாமல் ‘கடுங்கோபம்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘இறைவனுடைய கடுங்கோபம்’ அல்லது ‘உன் கடுங்கோபம்’
  rationale: எபிரெய மூலத்தில் உடைமையைக் காட்டும் குறிப்பு இல்லை. இது யோபுவின் கோபமா, இறைவனுடைய கோபமா, அல்லது பொதுவாகக் கோபமா என்பது திறந்த நிலையில் இருப்பதால் அந்த இறையியல் பதற்றம் தீர்க்கப்படவில்லை.
- issue: כֹּפֶר என்பதன் பொருள்
  choice: மீட்புத்தொகை
  alternative: பரிகார விலை அல்லது கையூட்டு
  rationale: மூலச்சொல் பல சூழல்களில் மீட்புத்தொகை, இழப்பீடு, பரிகார விலை, சில வேளைகளில் கையூட்டு ஆகியவற்றைக் குறிக்கலாம். ‘மீட்புத்தொகை’ மிகக் குறைவாக விளக்கத்தைத் திணிக்கும் தேர்வு; மற்ற வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் ஞான இலக்கியத்துக்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘எச்சரிக்கையாக இரு’ என்ற ஒருமை நேரடி அழைப்பு எபிரெய எச்சரிப்பின் வலிமையைப் பேணுகிறது. மூலத்தின் சுருக்கமான அமைப்பை வாசிக்க இயல்பாகச் சிறிது விரித்தாலும், கோபத்தின் குறிப்பு திட்டவட்டமாக்கப்படவில்லை.
