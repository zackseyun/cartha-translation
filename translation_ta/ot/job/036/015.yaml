source:
  edition: WLC
  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: ta
  text: 'துன்புறுபவனை அவனது துன்பத்தின் மூலம் அவர் விடுவிக்கிறார்[a];

    நெருக்கடியின் மூலம் அவர்களுடைய செவிகளைத் திறக்கிறார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழையை அவனது துன்பத்தில் விடுவிக்கிறார்.” எபிரெயச் சொற்கள் வறுமை, துன்பம், அல்லது ஒடுக்குதல் ஆகிய பொருட்களை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவர்களுடைய செவிகளைத் திறக்கிறார்” அல்லது “வெளிப்படுத்துகிறார்.” இது ஒருவரைக் கேட்கவோ அறிவுரையை ஏற்கவோ செய்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: விடுவிக்கிறார்
  rationale: பியேல் வடிவம் ஆபத்திலிருந்து மீட்டெடுப்பதையோ விடுவிப்பதையோ குறிக்கிறது. இங்கு ‘விடுவிக்கிறார்’ என்பது இயல்பான நவீனத் தமிழில் செயற்படும் மீட்பின் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָנִי
  choice: துன்பப்பட்டவர்
  rationale: இச்சொல் ஏழை, ஒடுக்கப்பட்டவர், துன்புறுபவர் ஆகிய பொருட்களை ஏற்கக்கூடும். עָנְיוֹ மற்றும் לַחַץ ஆகிய இணையான சொற்கள் இருப்பதால், பொருளாதார வறுமைக்கு மட்டும் வரையறுக்காத ‘துன்பப்பட்டவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְעָנְיוֹ
  choice: அவரது துன்பத்தின் மூலமே
  rationale: בְּ முன்னிடைச்சொல் சூழ்நிலையையும் கருவியையும் குறிக்கலாம். இங்கு இணை அமைப்பு கருவிப் பொருளை ஆதரிப்பதால் ‘மூலமே’ பயன்படுத்தப்பட்டது; எபிரெய மூலத்தின் ஒருமை பின்னொட்டும் காக்கப்பட்டது.
- source_word: וְיִגֶל
  choice: திறக்கிறார்
  rationale: גלה என்பதன் அடிப்படைப் பொருள் ‘மூடியதை அகற்றுதல்/வெளிப்படுத்துதல்’. ‘செவி’ என்பதுடன் இது கேட்கவோ அறிவுரையை ஏற்கவோ செய்வதைக் குறிக்கும் மரபுத்தொடர்; எனவே இயல்பான தமிழில் ‘திறக்கிறார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּלַּחַץ
  choice: நெருக்கடியின் மூலமே
  rationale: לַחַץ என்பது அழுத்தம், ஒடுக்குதல், இடுக்கண் அல்லது நெருக்கடி எனப் பொருள்படும். சூழலின் பரந்த துன்பப் பொருளையும் கருவிப் பயன்பாட்டையும் காக்க ‘நெருக்கடியின் மூலமே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָזְנָם
  choice: அவர்களுடைய செவியை
  rationale: மசோரெட்டிக் வடிவிலுள்ள மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு ‘அவர்களுடைய’ என்று நேரடியாகக் காக்கப்பட்டது. தமிழில் கேட்கும் திறனைச் சுட்டும் இயல்பான ஒருமைக் கூட்டுப்பயன்பாடாக ‘செவியை’ அமைக்கப்பட்டது.
theological_decisions:
- issue: துன்பத்தைத் தெய்வீக மீட்புக்கும் அறிவுறுத்தலுக்கும் கருவியாகக் காட்டுதல்
  choice: துன்பமும் நெருக்கடியும் வழியாகக் கடவுள் விடுவித்து, கேட்கச் செய்கிறார் என்ற கருவிப் பொருள் காக்கப்பட்டது.
  alternative: துன்பம் மீட்பு நடைபெறும் சூழல் மட்டுமே; அல்லது எல்லாத் துன்பமும் நேரடியான தண்டனை என்ற வாசிப்பு.
  rationale: இணையாக வரும் இரு בְּ முன்னிடைச்சொல் தொடர்களும் கருவிப் பொருளை இயல்பாக ஆதரிக்கின்றன. இருப்பினும், எல்லாத் துன்பமும் நல்லது அல்லது நேரடித் தண்டனை என்று மொழிபெயர்ப்பு கூடுதலாகக் கூறவில்லை; எலிகூவின் கூற்றிலுள்ள இறையியல் பதற்றம் அப்படியே விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. முதல் அடியில் எபிரெய ஒருமையும் இரண்டாம் அடியில் உள்ள பன்மை பின்னொட்டும் செயற்கையாக ஒரே எண்ணாக மாற்றப்படாமல் காக்கப்பட்டன. ‘மூலமே’ என்ற சொல் இரு இணை உறுப்புகளின் கருவிப் பொருளையும் கவித்துவச் சமநிலையையும் வெளிப்படுத்துகிறது.
