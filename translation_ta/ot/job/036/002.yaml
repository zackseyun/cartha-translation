translation:
  language: ta
  text: எனக்குச் சற்றுப் பொறுத்திரு; நான் உனக்கு எடுத்துரைப்பேன். ஏனெனில், இறைவனுக்காக இன்னும் சொல்ல வேண்டியவை உள்ளன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இறைவனுக்காக” என்பதை, சூழலுக்கு ஏற்ப, “இறைவன் சார்பாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய לְ முன்னிடைச்சொல் இங்கு பயன்/நோக்கம் அல்லது இறைவன் சார்பாகப் பேசுதல் என்ற நெருங்கிய பொருள்களை அனுமதிக்கிறது.
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: எனக்காக இன்னும் சிறிது பொறுத்திரு
  rationale: כַּתַּר என்பதன் ‘காத்திரு/பொறுத்திரு’ என்ற வேண்டுகோள் உணர்வையும், לִי என்பதையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַאֲחַוֶּךָּ
  choice: நான் உனக்கு எடுத்துரைப்பேன்
  rationale: חוה என்பதன் ‘அறிவித்தல், விளக்கிக் கூறுதல்’ என்ற பொருளைச் சூழலுக்கேற்ற dignified Tamil-ல் தருகிறது; இரண்டாம் நபர் ஒருமையை ‘உனக்கு’ காக்கிறது.
- source_word: לֶאֱלוֹהַּ מִלִּים
  choice: இறைவனுக்காகச் சொல்ல வேண்டியவை
  rationale: לְ என்ற முன்னிடைச்சொல்லின் ‘இறைவனுக்காக/இறைவன் சார்பாக’ என்ற நோக்கத்தைப் பாதுகாக்கிறது. מִלִּים என்பதைக் கருத்தோட்டத்திற்கேற்ப ‘சொல்ல வேண்டியவை’ என்று இயல்பாக்குகிறது.
theological_decisions:
- issue: 'לֶאֱלוֹהַּ என்பதன் தொடர்பு: ‘இறைவனுக்காக’ அல்லது ‘இறைவன் சார்பாக’'
  choice: இறைவனுக்காக
  alternative: இறைவன் சார்பாக
  rationale: மூலத்தின் לְ குறிக்கும் உறவைத் திட்டவட்டமாக ஒரே விதத்தில் தீர்க்காமல், ஆங்கில ஆலோசனை உரையுடனும் ஒத்த ‘இறைவனுக்காக’ என்பதை முதன்மை உரையில் வைத்துள்ளது; சார்பாகப் பேசுதல் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான உரையாடல் தொனியும் காக்கப்பட்டுள்ளன. எலிகூ ஒரே நபரிடம் பேசுவதால் ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
