lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நீர்த்துளிகளைச் சுட்டும் தொடர்புச் சொல்லைத் தமிழில் இயல்பான சுட்டுப்பெயராக வெளிப்படுத்துகிறது.
- source_word: יִזְּלוּ
  choice: சொரிகின்றன
  rationale: נזל என்பதன் கீழ்நோக்கிப் பாய்தல் அல்லது சொட்டுதல் என்ற மழைச்சூழல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁחָקִים
  choice: மேகங்கள்
  rationale: வானம் அல்லது மேகத்திரள் என்று அமையக்கூடிய கவிதைச்சொல்; மழைப்பொழிவு பற்றிய உடனடிச் சூழலில் ‘மேகங்கள்’ தெளிவான பொருத்தம்.
- source_word: יִרְעֲפוּ
  choice: பொழிகின்றன
  rationale: துளிகளாக அல்லது மழையாகக் கீழே பொழிவதைக் குறிக்கும் வினை; தமிழில் மழைச்சூழலுக்கு இயல்பாகவும் இரண்டாம் அடியின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: עֲלֵי
  choice: மேல்
  rationale: கீழே விழும் மழை மனிதர்கள்மீது படுவதைக் குறிக்கும் இயல்பான இடைச்சொல்.
- source_word: אָדָם
  choice: மனிதர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; நவீன தமிழில் ‘மனிதர்கள்’ அந்தக் கூட்டுப்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: רָב
  choice: மிகுதியாக
  rationale: பொழிவின் அளவு பெரிதாக இருப்பதை வினையடையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமையான ஒருமைப் பயன்பாடு
  choice: மனிதர்கள்
  alternative: மனிதன்
  rationale: மூலத்தில் אָדָם ஒருமையில் இருந்தாலும் இங்கு ஒரு குறிப்பிட்ட ஆணை அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. தமிழில் பன்மை இதை இயல்பாகத் தெரிவிக்கிறது; மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான வினைச்சொற்களின் மழை உருவகம் தக்கவைக்கப்பட்டு, தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
