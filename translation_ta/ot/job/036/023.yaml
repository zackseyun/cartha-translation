  text: அவரது வழியை வகுத்தவர் யார்?[a] அல்லது, “நீர் தவறு செய்தீர்” என்று சொன்னவர் யார்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய வழியைக் குறித்து அவர்மீது பொறுப்பு சுமத்தியவர் யார்?” எபிரெய வினைச்சொல் நியமித்தல், கட்டளையிடுதல், பொறுப்பு சுமத்துதல் அல்லது மேற்பார்வையிடுதல் ஆகிய பொருள்களையும் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் அநீதி செய்தீர்.”
    reason: lexical_alternative
