theological_decisions:
- issue: ஆண்பால் ஒருமை பின்னொட்டுகளும் இரண்டாம் நபர் வினையும் யாரைக் குறிக்கின்றன
  choice: சூழலின்படி இவை கடவுளைக் குறிக்கின்றன; மரியாதை ஒருமையான ‘அவர்/நீர்’ பயன்படுத்தப்பட்டுள்ளது.
  alternative: ஒரு வல்லமையுள்ள ஆட்சியாளர் அல்லது மனிதனைப் பற்றிய பொதுவான வாசிப்பு.
  rationale: யோபு 36:22–23 சூழலில் எலிகூ கடவுளின் மேன்மையையும் நீதியையும் எடுத்துரைக்கிறார். ஆயினும் வசனத்திற்குள் ‘கடவுள்’ என்ற பெயர் சேர்க்கப்படாமல், மூலத்தின் பிரதிப்பெயர் அமைப்பும் சூழல் சார்ந்த அடையாளமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் பிரதிப்பெயர்களுக்கு மரியாதை ஒருமை தரப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுள்’ என்ற பெயர் உரையில் சேர்க்கப்படவில்லை. இரு சொல்லாட்சிக் கேள்வுகளின் கூர்மையும் פָקַד மற்றும் עַוְלָה ஆகியவற்றின் சொற்பொருள் மாற்றுகளும் அடிக்குறிப்புகளால் பாதுகாக்கப்பட்டுள்ளன.
