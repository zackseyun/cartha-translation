- source_word: מִי
  choice: யார்
  rationale: இரண்டு சொல்லாட்சிக் கேள்வுகளையும் அறிமுகப்படுத்தும் வினாப்பெயராக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פָקַד
  choice: வகுத்தவர்
  rationale: இங்கு ஒருவருக்கான வழியை நியமித்தல் அல்லது நிர்ணயித்தல் என்ற பொருள் பொருந்துகிறது. ‘வகுத்தவர்’ என்பது அதிகாரத்தோடு வழியைத் தீர்மானித்தல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; வினையின் பிற சாத்தியமான நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָלָיו
  choice: அவருக்கு
  rationale: פָקַד என்பதுடன் இணைந்து, அவருக்காக அல்லது அவர்மீது ஒரு வழியை வகுத்தல் என்ற உறவைச் சுட்டுகிறது. தமிழில் ‘அவருக்கு’ என்பது இச்சூழலில் இயல்பான வடிவம்.
- source_word: דַּרְכּוֹ
  choice: அவருடைய வழி
  rationale: ‘வழி’ என்பது நேரடியான பாதையையும் செயல்முறை அல்லது போக்கையும் குறிக்கும் மூலச்சொல்லின் உருவக விரிவையும் பாதுகாக்கிறது.
- source_word: וּמִי
  choice: அல்லது ... யார்
  rationale: இரண்டாவது சொல்லாட்சிக் கேள்வியை முதலாவதோடு இணைக்கும் வகையில் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אָמַר
  choice: சொன்னவர்
  rationale: நிறைவேற்றப்பட்ட வினை வடிவத்தின் ‘யாராவது எப்போதாவது இப்படிச் சொன்னாரா?’ என்ற நிலையான சொல்லாட்சிச் சவாலை தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: פָּעַלְתָּ
  choice: செய்தீர்
  rationale: עַוְלָה என்பதுடன் வரும் குற்றச்சாட்டு மொழியில் ‘செய்தீர்’ என்பது நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: עַוְלָה
