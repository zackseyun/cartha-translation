source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: ta
  text: ஆனால், துன்மார்க்கனின் தீர்ப்பால் நீ நிறைந்திருக்கிறாய்[a]; தீர்ப்பும் நீதியும் உன்னைப் பற்றிக்கொள்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துன்மார்க்கனுக்குரிய தீர்ப்பால் நீ நிறைந்திருக்கிறாய்,” அல்லது “துன்மார்க்கனுக்கு வரும் தீர்ப்பால் நீ நிறைந்திருக்கிறாய்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; அது துன்மார்க்கனின் தீர்ப்புடன் பங்குகொள்வதையோ, துன்மார்க்கனோடு தொடர்புடைய தீர்ப்பில் முழுமையாக ஈடுபட்டிருப்பதையோ, அவனுக்குரிய தீர்ப்பைப் பெறுவதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தீர்ப்பும் நீதியும் உன்னைத் தாங்குகின்றன.” எபிரெய வினைக்கு ஆதரித்தல், நிலைநிறுத்துதல், அல்லது பற்றிக்கொள்ளுதல் என்ற பொருள்கள் உண்டு; அதில் “உன்னை” என்பது மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: ஆனால், ... தீர்ப்பால்
  rationale: וְ என்பது முந்தைய சூழலுடன் உள்ள முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. דִּין அடுத்த சொற்றொடருடன் இணைக்கப்பட்டு ‘தீர்ப்பு’ எனக் கொள்ளப்பட்டது.
- source_word: רָשָׁע
  choice: துன்மார்க்கன்
  rationale: ஒருமை பெயரடையான இது பெயர்ச்சொல்லாகப் பயன்பட்டு, பொதுவாகத் தீய அல்லது குற்றமுள்ள ஒருவரைக் குறிக்கிறது. ‘துன்மார்க்கன்’ கவிதைநடைக்கேற்ற கண்ணியமான சொல்லாகும்.
- source_word: מָלֵאתָ
  choice: நீ நிறைந்திருக்கிறாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை நிறைவுவினை, முந்தைய செயல் விளைவாகத் தொடரும் தற்போதைய நிலையை வெளிப்படுத்துகிறது; நிறைவு உருவகமும் காக்கப்படுகிறது.
- source_word: דִּין
  choice: தீர்ப்பு
  rationale: நீதித்துறைச் சூழலைக் காக்கும் வகையில் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி எபிரெயச் சொல்லின் மீளுரையும் பாதுகாக்கப்பட்டது.
- source_word: וּמִשְׁפָּט
  choice: நீதியும்
  rationale: דִּין என்பதுடன் பொருள் ஒட்டினாலும், מִשְׁפָּט நீதி அல்லது நீதியான ஒழுங்கைக் குறிக்க முடியும். ‘நீதி’ இணைநிலையை வேறுபாடுடன் காக்கிறது.
- source_word: יִתְמֹכוּ
  choice: உன்னைப் பற்றிக்கொள்கின்றன
  rationale: תמך என்பதற்கு தாங்குதல், ஆதரித்தல், பற்றிக்கொள்ளுதல் ஆகிய பொருள்கள் உண்டு. எதிர்மறைச் சூழலில் ‘பற்றிக்கொள்கின்றன’ இயல்பாக இருந்தாலும், மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘உன்னை’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: יִתְמֹכוּ என்ற இறுதி வினையின் பொருளும் மறைந்த செயப்படுபொருளும்
  choice: ‘தீர்ப்பும் நீதியும் உன்னைப் பற்றிக்கொள்கின்றன’
  alternative: ‘தீர்ப்பும் நீதியும் உன்னைத் தாங்குகின்றன’ அல்லது செயப்படுபொருளைக் குறிப்பிடாமல் ‘தீர்ப்பும் நீதியும் பற்றிக்கொள்கின்றன’
  rationale: எபிரெய வினை ஆதரித்தல் அல்லது பற்றிக்கொள்ளுதல் ஆகிய இரு திசைகளிலும் பொருள்படலாம்; வெளிப்படையான செயப்படுபொருள் இல்லை. சூழலின் கண்டனத் தொனியால் பிரதான உரையில் ‘உன்னைப் பற்றிக்கொள்கின்றன’ தேர்ந்தெடுக்கப்பட்டது; ஆதரவான வாசிப்பு அடிக்குறிப்பில் விடப்பட்டது.
- issue: דִּין רָשָׁע என்ற சுருக்கமான இணைப்பின் தொடர்பு
  choice: ‘துன்மார்க்கனின் தீர்ப்பு’
  alternative: ‘துன்மார்க்கனுக்குரிய தீர்ப்பு’ அல்லது ‘துன்மார்க்கனுக்கு வரும் தீர்ப்பு’
  rationale: எபிரெயச் சொற்றொடர், துன்மார்க்கன் வழங்கும் அல்லது அவனுக்குரிய தீர்ப்பையும், அவன்மீது வரும் தீர்ப்பையும் சூழல்படி உணர்த்தக்கூடும். தமிழ் உடைமைத் தொடர் இந்தச் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், கவிதைக்குரிய கண்ணியமான நீதித்துறைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘துன்மார்க்கன்’ மற்றும் ‘தீர்ப்பு’ ஆகியவை யோபு நூலின் உயர்ந்த கவிதைநடையைத் தக்கவைத்தாலும் பொதுவாசகர்களுக்குப் புரியக்கூடியவை. மூலத்தின் சுருக்கமும் பொருள் இருமையும் அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
