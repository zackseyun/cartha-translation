source:
  edition: WLC
  text: כִּֽי אָ֭מְנָם לֹא שֶׁ֣קֶר מִלָּ֑/י תְּמִ֖ים דֵּע֣וֹת עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: ta
  text: ஏனெனில், உண்மையாகவே, என் வார்த்தைகள் பொய்யானவை அல்ல; அறிவில் நிறைவுள்ளவர் உன்னுடன் இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவில் நிறைவுள்ளவர்’ என்பது எலிகூவைக் குறிக்கலாம்; அல்லது, எலிகூவை விடக் கடவுளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: ஏனெனில், உண்மையாகவே
  rationale: כִּי என்பதன் விளக்கத் தொடர்பையும் אָמְנָם என்பதன் வலியுறுத்தலையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: என் வார்த்தைகள் பொய்யானவை அல்ல
  rationale: எபிரெய முன்னிலைப் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: תְּמִים דֵּעוֹת
  choice: அறிவில் நிறைவான ஒருவர்
  rationale: תְּמִים என்பதன் முழுமை அல்லது குறைவின்மை என்ற கருத்தை, பாவமற்றவர் என்ற தேவையற்ற கோட்பாட்டுப் பொருளைச் சேர்க்காமல் தருகிறது; דֵּעוֹת இங்கு ஒருமைச் சுருக்கப்பெயராக இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: עִמָּךְ
  choice: உன்னுடன் இருக்கிறார்
  rationale: யோபை நோக்கிய இரண்டாம் நபர் ஒருமை முகவரியையும் ‘உடன்’ என்ற நேரடிப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: ‘அறிவில் நிறைவான ஒருவர்’ என்பவர் யார்?
  choice: முதன்மை வாசிப்பில் எலிகூ தன்னையே குறிப்பிடுகிறார்; ஆனால் வசன உரை பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: அது யோபுடன் இருக்கும், அறிவில் நிறைவான கடவுளைக் குறிக்கலாம்.
  rationale: ‘என் வார்த்தைகள்’ என்று எலிகூ தன் பேச்சின் உண்மையை உறுதிப்படுத்தும் உடனடிச் சூழல் தற்குறிப்பை ஆதரிக்கிறது. எனினும் எபிரெய வாக்கியம் எழுவாயை பெயரிட்டு அடையாளப்படுத்தாததால், கடவுளைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. ‘நிறைவான’ என்பது அறிவின் முழுமையைச் சுட்டுகிறது; ஒழுக்கரீதியான பாவமின்மையைத் திணிக்கவில்லை.
