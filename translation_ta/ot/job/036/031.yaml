  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: ta
  text: ஏனெனில், அவற்றின் மூலம் அவர் மக்களினங்களை நியாயந்தீர்க்கிறார்; உணவை ஏராளமாகக் கொடுக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: அவற்றின் மூலம்
  rationale: எபிரெயச் சொல்லிலுள்ள பன்மைச் சுட்டுப்பெயரின் முன்னுள்ள தொடர்பு இவ்வசனத்திலேயே வெளிப்படையாகக் கூறப்படாததால், அதன் தெளிவின்மையைப் பாதுகாக்கிறது; בְּ என்பதன் கருவிப்பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יָדִין
  choice: நியாயந்தீர்க்கிறார்
  rationale: דין என்பதன் நீதித்தீர்ப்பு சார்ந்த பொருளைத் துல்லியமாகக் காட்டுகிறது; எபிரெயக் கவிதையின் நிகழ்காலப் பொதுச்செயல் உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: பன்மை வடிவத்தைப் பாதுகாத்து, பல்வேறு மக்கள் சமூகங்களைக் குறிக்கிறது.
- source_word: יִתֶּן אֹכֶל לְמַכְבִּיר
  choice: உணவை ஏராளமாகக் கொடுக்கிறார்
  rationale: נתן என்பதன் ‘கொடு’ பொருளையும், לְמַכְבִּיר என்பதன் மிகுதி/நிறைவு உணர்வையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவற்றின் மூலம்’ என்பதன் குறிப்பு
  choice: குறிப்பிடப்பட்ட பொருளை வசனத்துக்குள் விளக்கிச் சேர்க்காமல் பன்மைச் சுட்டுப்பெயராகவே வைத்தல்
  alternative: ‘மேகங்களின் மூலம்’ அல்லது ‘நீரின் மூலம்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: மூலவசனத்தில் בָם என்பது பன்மைச் சுட்டுப்பெயராக மட்டும் உள்ளது; அதன் தொடர்பைத் திட்டவட்டமாக்குவது உரையிலுள்ள உண்மையான தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இணையான வினைச்செயல்களும் அரைப்புள்ளியால் பிரிக்கப்பட்டு எபிரெயக் கவிதை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
