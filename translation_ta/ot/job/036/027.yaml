source:
  edition: WLC
  text: כִּ֭י יְגָרַ֣ע נִטְפֵי מָ֑יִם יָזֹ֖קּוּ מָטָ֣ר לְ/אֵדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: ta
  text: ஏனெனில், அவர் நீர்த்துளிகளை மேலே இழுக்கிறார்[a]; அவை அவருடைய நீராவியிலிருந்து மழையாக வடிகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை அவருடைய நீராவியிலிருந்து மழையைப் பொழிகின்றன.” இரண்டாவது அடியின் எபிரெய வாசகம் கடினமானது; “நீராவி” என்பதை “மூடுபனி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள உரையில் கடவுளின் மேன்மையை விளக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יְגָרַע
  choice: மேலே இழுக்கிறார்
  rationale: גרע என்பதன் அடிப்படைப் பொருள் ‘குறைத்தல், எடுத்தல், விலக்குதல்’; இங்கு வானிலைச் சூழலில் நீர்த்துளிகளை எடுத்துயர்த்துவதைச் சுட்டுவதால், சூழலுக்கேற்ற பொருள் தரப்பட்டுள்ளது.
- source_word: נִטְפֵי מָיִם
  choice: நீர்த்துளிகளை
  rationale: ‘நீரின் துளிகள்’ என்ற எபிரெயக் கூட்டுச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יָזֹקּוּ
  choice: வடிகின்றன
  rationale: זקק என்பதில் வடித்தல் அல்லது சுத்திகரித்தல் என்ற படிமம் உள்ளது; மழை உருவாகும் சூழலில் ‘வடிகின்றன’ என்பது அந்தப் படிமத்தையும் பன்மை வினையையும் காக்கிறது.
- source_word: מָטָר
  choice: மழையாக
  rationale: மழை என்பதே சொல்லின் வழக்கமான பொருள்; தமிழ் வாக்கிய அமைப்புக்காக ‘மழையாக’ என வழங்கப்பட்டுள்ளது.
- source_word: לְאֵדוֹ
  choice: அவருடைய நீராவியிலிருந்து
  rationale: אֵד என்பது மூடுபனி அல்லது நீராவியைக் குறிக்கலாம். இங்கு மழை உருவாதலோடு ‘நீராவி’ இயல்பாகப் பொருந்துகிறது; கடினமான לְ முன்னொட்டு மூலத் தொடர்பாகப் புரிந்துகொள்ளப்படுகிறது; ஆண்பால் ஒருமை பின்னொட்டு ‘அவருடைய’ எனத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: לְאֵדוֹ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள்
  choice: 'அது கடவுளைக் குறிக்கும்: ‘அவருடைய நீராவி.’'
  alternative: ‘அதன் நீராவி’ என்ற உயிரற்ற சுட்டல், அல்லது ‘அவற்றின் நீராவி’ எனத் தரும் உரை/உயிர்க்குறி மாற்றங்கள்.
  rationale: எலிகூவின் உரையில் செய்பவர் கடவுள்; படைப்பின்மேல் அவருடைய ஆளுகையே உடனடிச் சூழல். ஆகவே எபிரெய மூன்றாம் நபர் ஆண்பால் ஒருமையை மாற்றாமல் கடவுளைக் குறிக்குமாறு தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவ மரியாதையையும் தெளிவையும் இணைக்கும் நடை. எபிரெய வானிலைப் படிமம் காக்கப்பட்டுள்ளது; கடினமான இரண்டாம் அடியின் மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
