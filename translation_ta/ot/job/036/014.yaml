  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: ta
  text: அவர்கள் இளமையில் இறந்துபோகிறார்கள்; அவர்களுடைய வாழ்வு வழிபாட்டுடன் தொடர்புடைய ஆண் பாலியல் தொழிலாளர்களிடையே முடிவடைகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்ப்பணிக்கப்பட்டவர்களிடையே.” எபிரெயச் சொல் பிற தெய்வ வழிபாட்டுடன் தொடர்புடைய ஆண் பாலியல் தொழிலாளர்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: இறந்துபோகிறார்கள்
  rationale: מות என்பதன் பொருள் ‘இறத்தல்’. எபிரெயத்தில் ஒருமை வடிவம் நֶפֶשׁ (‘உயிர்’) என்பதோடு அமைந்தாலும், பன்மை உரிமை விகுதியும் சூழலின் கூட்டுக் குறிப்பும் காரணமாக தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: בַּנֹּעַר
  choice: இளமையிலேயே
  rationale: נֹעַר இளமை அல்லது வாழ்வின் தொடக்கப் பருவத்தைக் குறிக்கிறது. ‘-ஏ’ அந்த அகால இறப்பின் அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַפְשָׁם
  choice: அவர்கள்
  rationale: நֶפֶשׁ இங்கு ‘அவர்களுடைய உயிர்’ என்று சொற்சொல்லாக அல்லாமல், இறப்பவர்களையே குறிக்கும் மொழிப்பண்பாக உள்ளது; தமிழில் ‘அவர்களுடைய உயிர் இறக்கிறது’ என்பது தவறாகப் புரியக்கூடும்.
- source_word: וְחַיָּתָם
  choice: அவர்களுடைய வாழ்வு முடிவடைகிறது
  rationale: חַיָּה இங்கு வாழ்க்கை அல்லது வாழ்நாளைக் குறிக்கிறது. இரண்டாம் அரையடியில் வினை வெளிப்படையாக இல்லாவிட்டாலும், முதல் அரையடியின் ‘இறத்தல்’ என்ற கருத்து இணை அமைப்பில் தொடர்வதால் இயல்பான தமிழுக்காக ‘முடிவடைகிறது’ சேர்க்கப்பட்டது.
- source_word: בַּקְּדֵשִׁים
  choice: ஆண் வழிபாட்டுப் பாலியல் தொழிலாளர்களிடையே
  rationale: קְדֵשִׁים என்பது இச்சூழலிலும் வேறு பழைய ஏற்பாட்டுப் பயன்பாடுகளிலும் அந்நிய வழிபாட்டுடன் தொடர்புடைய ஆண் பாலியல் தொழிலாளர்களைக் குறிக்கும் வாய்ப்பு மிகுதி. ‘வழிபாட்டு’ என்பது cultic தொடர்பையும் ‘ஆண்’ என்பது சொல்லின் பாலினக் குறிப்பையும் காக்கிறது.
theological_decisions:
- issue: קְדֵשִׁים என்பதன் பொருள்
  choice: ஆண் வழிபாட்டுப் பாலியல் தொழிலாளர்கள்
  alternative: அர்ப்பணிக்கப்பட்டவர்கள்
  rationale: இச்சொல் வெறுமனே பரிசுத்தமானவர்களைக் குறிக்காமல், முறைகேடான வழிபாட்டுச் சூழலில் பணியாற்றிய ஆண்களைக் குறிக்கும் என்பது அதிக சாத்தியம். எனினும் சொல்லின் சொற்பிறப்புசார்ந்த மாற்றுப் பொருள் உண்மையான தெளிவின்மையாக இருப்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. எபிரெய இணை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்த அரைப்புள்ளி பயன்படுத்தப்பட்டது; சர்ச்சைக்குரிய வழிபாட்டுச் சொல்லின் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
