  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: ta
  text: இதோ, தேவன் தம் வல்லமையில்[a] உயர்ந்திருக்கிறார்; ஆசிரியராக அவரைப் போன்றவர் யார்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் வல்லமையால்’ அல்லது ‘தம் பலத்தின் மூலம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆசிரியராக அவருக்கு ஒப்பானவர் யார்?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயக் கவிதைத் துகளை, உயர்வான தொனியையும் இயல்பான நவீனத் தமிழையும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு இது ஒரு தனிப்பெயராக அல்லாமல் கடவுளைக் குறிக்கும் பொதுவான தெய்வீகப் பட்டமாக வருகிறது; தமிழில் இயல்பான வேதாகமச் சொல்லாக ‘தேவன்’ பொருந்துகிறது.
- source_word: יַשְׂגִּיב
  choice: உயர்ந்திருக்கிறார்
  rationale: שׂגב என்பதன் ஹிஃபில் வடிவம் உயர்ந்திருத்தல், எட்டமுடியாத மேன்மையில் இருத்தல், அல்லது உயர்வாகச் செயல்படுதல் ஆகிய நிழற்பொருள்களைக் கொண்டது; இங்கு நிலை மற்றும் மேன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכֹחוֹ
  choice: தமது வல்லமையில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லை சூழல் அல்லது விதத்தைக் குறிக்கும் வகையில் மொழிபெயர்த்து, அதன் கருவிப்பொருள் சாத்தியத்தையும் அடிக்குறிப்பில் காக்கிறது.
- source_word: מִי כָמֹהוּ
  choice: அவரைப் போன்ற ... யார்?
  rationale: ஒப்பற்ற தன்மையை வலியுறுத்தும் எபிரெய ஒப்பீட்டு வினாவைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מוֹרֶה
  choice: போதகர்
  rationale: கற்பிப்பவரைக் குறிக்கும் சொல்லின் பெயர்ச்சொல் தன்மையைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது; ‘ஆசிரியர்’ என்பதைக் காட்டிலும் இக்கவிதைச் சூழலில் தெய்வீக அறிவுறுத்தலை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: தேவனுடைய உயர்வுக்கும் வல்லமைக்கும் உள்ள தொடர்பு
  choice: தேவன் தமது வல்லமையுடன் தொடர்புடைய விதத்தில் உயர்ந்திருக்கிறார் என்று கூறுகிறது; அதற்கு அப்பால் ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: தேவன் வல்லமையாகச் செயல்படுகிறார்; அல்லது தமது வல்லமையால் பிறரைப் பாதுகாப்பாக உயர்த்துகிறார்.
  rationale: வினைச்சொல்லில் உயர்வு, எட்டமுடியாத மேன்மை, அல்லது உயர்த்துதல் ஆகிய நிழற்பொருள்கள் இருக்கலாம். இக்கவிதைச் சூழலில் தேவனுடைய ஒப்பற்ற மேன்மையும் கற்பிக்கும் தன்மையும் முதன்மையாக இருப்பதால், தேவையற்ற கோட்பாட்டு விரிவாக்கம் தவிர்க்கப்படுகிறது.
- issue: מוֹרֶה உடன் ஒப்பீட்டு வினாவின் அமைப்பு
  choice: ‘அவரைப் போன்ற போதகர் யார்?’ என்று, போதகராகிய அவருக்கு ஒப்பானவர் யாருமில்லை என்ற வினாவாக வழங்குகிறது.
  alternative: ‘போதிப்பதில் அவரைப் போன்றவர் யார்?’
  rationale: இரு அமைப்புகளும் எபிரெயச் சொல்லமைப்பின் சாத்தியமான பொருளைத் தருகின்றன. முதன்மை உரை מוֹרֶה என்பதன் பெயர்ச்சொல் வடிவத்தையும் சுருக்கமான கவிதை வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது தேவனைக் குறிக்கும் மரியாதையான ஒருமைத் தற்சுட்டு வடிவமாகும்; ‘போதகர்’ என்பது மוֹרֶה என்பதன் பெயர்ச்சொல் வலிமையைப் பாதுகாக்கிறது.
