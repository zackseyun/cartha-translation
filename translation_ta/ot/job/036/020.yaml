source:
  edition: WLC
  text: אַל תִּשְׁאַ֥ף הַ/לָּ֑יְלָה לַ/עֲל֖וֹת עַמִּ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: ta
  text: மக்கள் தங்கள் இடத்திலிருந்து அகற்றப்படும் அந்த இரவை விரும்பாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்படியாக: “மக்கள் அவர்களுக்குக் கீழே மேலேறுவதற்காக அந்த இரவை விரும்பாதே.” எபிரெய வாசகம் கடினமானது; “தங்கள் இடத்திலிருந்து அகற்றப்படும்” என்பது சூழலின் அடிப்படையில் பொதுவாகப் புரிந்துகொள்ளப்படும் பொருளைப் பிரதிபலிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: விரும்பாதே என்பதில் எதிர்மறைத் தடை
  rationale: אַל உடன் வரும் நிறைவுறா வினை, செய்ய வேண்டாமென்ற நேரடியான தடையைத் தெரிவிக்கிறது.
- source_word: תִּשְׁאַף
  choice: விரும்பாதே
  rationale: שׁאף என்பது மூச்சிரைக்க ஏங்குதல் அல்லது தீவிரமாக விரும்புதல் எனப் பொருள்படலாம்; இங்கு ‘இரவு’ என்பதுடன் இயல்பான தமிழில் ‘விரும்பு’ பொருத்தமானது.
- source_word: הַלָּיְלָה
  choice: அந்த இரவை
  rationale: எபிரெயச் சுட்டியுடனான பெயர்ச்சொல்லைச் சூழலில் குறிப்பிட்ட இரவாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲלוֹת
  choice: அகற்றப்படும்
  rationale: עלה என்பதன் வினையெச்ச வடிவம் இங்கு கடினமானது. சூழலின் அடிப்படையில் மக்களை அவர்களின் நிலையிலிருந்து நீக்குதல் என்ற பொதுவான புரிதலைப் பிரதான உரை தருகிறது; சொற்படியான சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עַמִּים
  choice: மக்கள்
  rationale: பன்மையில் உள்ள עַמִּים பல மக்கள் கூட்டங்கள் அல்லது இனக்குழுக்களைக் குறிக்கிறது; தமிழில் ‘மக்கள்’ கூட்டுப் பன்மையை இயல்பாகத் தருகிறது.
- source_word: תַּחְתָּם
  choice: தங்கள் இடத்திலிருந்து
  rationale: תחת அடிப்படையில் ‘கீழ்’ எனினும், இங்கு ஒருவரின் இடம் அல்லது நிலையிலிருந்து அகற்றப்படுதல் என்ற சூழல்சார் பொருள் ஏற்றுக்கொள்ளப்படுகிறது.
