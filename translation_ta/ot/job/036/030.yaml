- source_word: וְשָׁרְשֵׁי
  choice: வேர்களை
  rationale: ‘வேர்கள்’ என்ற எபிரெயக் கவித்துவப் படிமத்தை நேரடியாகக் காக்கிறது; இது கடலின் ஆழமான அல்லது அடித்தளப் பகுதிகளைக் குறிக்கலாம்.
- source_word: הַיָּם
  choice: கடலின்
  rationale: ‘கடல்’ என்பதே மூலச்சொல்லின் நேரடியான பொருள்.
- source_word: כִּסָּה
  choice: மூடுகிறார்
  rationale: ‘மூடுதல்’ என்ற நேரடிப் பொருளையும், கவித்துவ விளக்கத்தின் நிகழ்காலத் தொடரையும் காக்கிறது.
