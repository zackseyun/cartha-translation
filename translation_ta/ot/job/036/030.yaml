  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: ta
  text: 'இதோ, அவர் அதன்மேல்[a] தமது ஒளியை[b] விரிக்கிறார்;

    கடலின் வேர்களை[c] மூடுகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்மேல்’. எபிரெய மொழியிலுள்ள பதிலிப்பெயர் ஆண்பால் ஒருமையில் உள்ளது; அது யாரை அல்லது எதைச் சுட்டுகிறது என்பது வெளிப்படையாக இல்லை. சூழலில் அது மேகம் அல்லது புயல் திரளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘தமது மின்னலை’ அல்லது ‘தமது ஒளிவீச்சை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘கடலின் வேர்கள்’; இது கடலின் மிக ஆழமான அல்லது அடித்தளப் பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
