source:
  edition: WLC
  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: ta
  text: இதோ, கடவுள் மகத்தானவர்; அவரை நாம் அறியோம்[a]. அவருடைய ஆண்டுகளின் எண்ணிக்கை ஆராய்ந்து அறிய முடியாதது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “நாம் அறியோம்.” “அவரை” என்பது சூழலிலிருந்து கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய ஆண்டுகளின் எண்ணிக்கையை ஆராய்ந்து கண்டறிய வழியில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றை வலியுறுத்தும் கவிதைநடையைப் பேணுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இது கடவுளைக் குறிக்கும் பொதுவான கவிதைச் சொல்; தனிப்பெயராக ஒலிபெயர்க்க வேண்டியதில்லை.
- source_word: שַׂגִּיא
  choice: மகத்தானவர்
  rationale: மேன்மை, பெருமை, அளவற்ற மகத்துவம் ஆகியவற்றை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא נֵדָע
  choice: அவரை நாம் அறியோம்
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய ‘கடவுள்’ என்பதிலிருந்து அது புரிகிறது. ‘அறியோம்’ என்பது மூலத்தின் நேரடியான ‘நாம் அறியவில்லை/அறியோம்’ என்ற கூற்றைப் பேணுகிறது; ‘முழுமையாக’ அல்லது ‘அறிய முடியாது’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: מִסְפַּר שָׁנָיו
  choice: அவருடைய ஆண்டுகளின் எண்ணிக்கை
  rationale: கடவுளின் காலநீளத்தை ‘ஆண்டுகள்’ எனக் கூறும் மூலத்தின் கவிதை உருவகத்தையும் மனிதரூப மொழியையும் அப்படியே பேணுகிறது.
- source_word: וְלֹא חֵקֶר
  choice: ஆராய்ந்து அறிய முடியாதது
  rationale: ‘ஆராய்தல் இல்லை’ என்ற சுருக்கமான எபிரெயப் பெயர்ச்சொல் அமைப்பை, ஆண்டுகளின் எண்ணிக்கை மனித ஆராய்ச்சிக்கு எட்டாதது என்ற பொருளில் இயல்பான தமிழாகத் தருகிறது.
theological_decisions:
- issue: וְלֹא נֵדָע என்பதில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: ‘அவரை’ என்பதைச் சேர்த்து, ‘அவரை நாம் அறியோம்’ என மொழிபெயர்த்தல்
  alternative: ‘நாம் அறியோம்’ என்று செயப்படுபொருள் இல்லாமல் விடுதல்
  rationale: உடனடி சூழலில் குறிப்பிடப்படுபவர் கடவுள் என்பதால் ‘அவரை’ என்பது இயல்பாகப் புரிகிறது. இதைச் சேர்ப்பது தமிழில் கருத்தைத் தெளிவாக்குகிறது; அதேவேளையில் ‘முழுமையாக அறிய முடியாது’ போன்ற விளக்கச் சொற்களைச் சேர்த்து மூலத்தின் இறுக்கத்தைத் தீர்த்துவிடவில்லை.
- issue: கடவுளின் ‘ஆண்டுகள்’ என்பதன் பொருள்
  choice: ‘அவருடைய ஆண்டுகள்’ என்ற கவிதை உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவருடைய நித்தியம்’ அல்லது ‘அவருடைய வாழ்நாள்’ என விளக்குதல்
  rationale: மூலம் கடவுளின் காலநீளத்தை ஆண்டுகளாகக் கூறும் கவிதைநடையைப் பயன்படுத்துகிறது. ‘நித்தியம்’ என்பது சாத்தியமான இறையியல் விளக்கம் என்றாலும், அந்த முறைப்படுத்தப்பட்ட சொல்லை மூலத்தில் இல்லாமல் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஞான இலக்கியத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறியோம்’ என்பது சற்றே உயர்ந்த நடையைத் தக்கவைத்தாலும் பொதுவாகப் புரியக்கூடியது. மூலத்தில் இல்லாத ‘முழுமையாக’ அல்லது ‘நித்தியம்’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
