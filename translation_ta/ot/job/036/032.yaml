  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: ta
  text: 'அவர் தமது உள்ளங்கைகளை மின்னலால்[a] மூடி,

    அது இலக்கைத் தாக்குமாறு கட்டளையிடுகிறார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஒளி’; சுற்றியுள்ள புயல் உருவகத்தின் அடிப்படையில் இது ‘மின்னல்’ எனப் பொருள்படும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடர் எபிரெயத்தில் புரிந்துகொள்ளக் கடினமானது. ‘அது தாக்கும் ஒருவனுக்கு எதிராக’ அல்லது ‘பரிந்துபேசுகிறவனுக்கு எதிராக’ என்பவையும் சாத்தியமான மொழிபெயர்ப்புகள்.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: தமது உள்ளங்கைகளை
  rationale: כַּף என்பதன் இருமை வடிவம் பொதுவாக உள்ளங்கைகள் அல்லது கைகளைக் குறிக்கிறது. கவிதையின் உடல்சார்ந்த உருவகத்தைத் தெளிவாகப் பாதுகாக்க ‘உள்ளங்கைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּסָּה
  choice: மூடி
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடுதல், மறைத்தல்.’ உருவகத்தை மிகையாக விளக்காமல் ‘மூடி’ நேரடியாக வழங்குகிறது.
- source_word: אוֹר
  choice: மின்னலால்
  rationale: אוֹר வழக்கமாக ‘ஒளி’ எனப் பொருள்படும்; ஆனால் சுற்றியுள்ள புயல் உருவகத்தில் இங்கு ‘மின்னல்’ என்பது சூழலுக்கேற்ற பொருள். எபிரெயச் சொல்லின் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְצַו
  choice: கட்டளையிடுகிறார்
  rationale: צוה என்பது ‘கட்டளையிடுதல்’ அல்லது ‘ஆணையிடுதல்.’ கடவுளின் செயற்பாட்டையும் அதிகாரத்தையும் இது இயல்பாகப் பாதுகாக்கிறது.
- source_word: עָלֶיהָ
  choice: அது
  rationale: பெண்பால் ஒருமை பின்னொட்டின் குறிப்பு தெளிவாக இல்லை; சூழலில் மின்னலைக் குறிப்பதாகக் கொண்டு தமிழில் இயல்பான ‘அது’ பயன்படுத்தப்பட்டது.
- source_word: בְמַפְגִּיעַ
  choice: குறியைத் தாக்கும்படி
  rationale: פגע வேரிலிருந்து வரும் இவ்வடிவம் கடினமானது; ‘தாக்குகிறவன்,’ ‘பரிந்துபேசுகிறவன்,’ அல்லது தாக்கப்படும் இடம்/இலக்கு ஆகிய பொருள்கள் சாத்தியம். புயல் சூழலில் மின்னல் தன் இலக்கை அடையும்படி வழிநடத்தப்படுவது என்ற பொருள் முதன்மை உரையில் வழங்கப்பட்டுள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: בְמַפְגִּיעַ என்பதற்கு ‘பரிந்துபேசுகிறவன்’ என்ற சாத்தியமான பொருள்
  choice: குறியைத் தாக்கும்படி
  alternative: அது தாக்குகிறவனுக்கு எதிராக / பரிந்துபேசுகிறவனுக்கு எதிராக
  rationale: புயல் மற்றும் மின்னல் பற்றிய உடனடி சூழல் இலக்கைத் தாக்கும் மின்னல் என்ற வாசிப்பை ஆதரிக்கிறது. இருப்பினும், எபிரெய வடிவத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; தனிப்பட்ட இறையியல் விளக்கம் முதன்மை உரையில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘உள்ளங்கைகள்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘மின்னல்’ சூழல்சார் பொருளை இயல்பாக அளிக்கிறது. தெளிவில்லாத இறுதித் தொடர் வாசிக்கத்தக்க முதன்மை உரையுடனும் மாற்று வாசிப்புகளைக் காட்டும் அடிக்குறிப்புடனும் வழங்கப்பட்டுள்ளது.
