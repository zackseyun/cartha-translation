source:
  edition: WLC
  text: זְ֭כֹר כִּֽי תַשְׂגִּ֣יא פָעֳל֑/וֹ אֲשֶׁ֖ר שֹׁרְר֣וּ אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: ta
  text: அவருடைய செயலை நீ உயர்த்திப் போற்ற வேண்டும் என்பதை நினைவில் கொள்; அதைப் பற்றி மனிதர்கள் பாடியிருக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதைக் கண்டிருக்கிறார்கள்” அல்லது “அதை உற்றுநோக்கியிருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம். שֹׁרְרוּ என்ற எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது; சிலர் அதை ‘பாடுதல்’ என்பதற்குப் பதிலாகக் காணுதல் அல்லது உற்றுநோக்குதல் என்ற பொருளில் எடுத்துக்கொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவில் கொள்
  rationale: ஆண்பால் ஒருமை கட்டளை வடிவம். நேரடியான அறிவுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு காரணத்தைக் காட்டாமல், நினைவில் கொள்ள வேண்டியதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: תַשְׂגִּיא
  choice: உயர்த்திப் போற்ற வேண்டும்
  rationale: ஹிஃபில் வடிவத்தின் ‘பெரிதாக்குதல், உயர்த்துதல், மேன்மைப்படுத்துதல்’ என்ற பொருளை, ஒருவருடைய செயலைப் புகழ்வது என்ற இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: פָעֳלוֹ
  choice: அவருடைய செயலை
  rationale: ‘செயல், பணி, செய்தது’ என்ற பரந்த பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது; மூன்றாம் நபர் ஒருமை பின்னொட்டையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: אֲשֶׁר
  choice: அதைப் பற்றி
  rationale: முந்தைய ‘செயல்’ என்பதைக் கடைசி வாக்கியத்துடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: שֹׁרְרוּ
  choice: பாடியிருக்கிறார்கள்
  rationale: கவிதைச் சூழலில் பாரம்பரியமாக ஏற்கப்படும் ‘பாடுதல்/பாடிப் போற்றுதல்’ என்ற பொருளை முதன்மை வாசகமாகக் கொள்கிறது; ‘காணுதல்’ சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲנָשִׁים
  choice: மனிதர்கள்
  rationale: மனிதர்களைக் குறிக்கும் எபிரெயப் பன்மையை நவீனத் தமிழில் இயல்பாகவும் பிரதிநிதித்துவப் பொருளுடனும் வழங்குகிறது.
theological_decisions:
- issue: פָעֳלוֹ என்பதிலுள்ள மூன்றாம் நபர் ஒருமைப் பின்னொட்டு யாரைக் குறிக்கிறது?
  choice: சூழலின்படி கடவுளுடைய செயல்; உரையில் ‘அவருடைய’ என்ற சுட்டுப்பெயர் தக்கவைக்கப்பட்டது.
  alternative: ‘கடவுளுடைய செயல்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: சுற்றியுள்ள உரையில் எலிகூ கடவுளுடைய செயல்களைப் பற்றிப் பேசுகிறார். ஆயினும் எபிரெய மூலத்தின் சுட்டுப்பெயரைப் பாதுகாப்பது தேவையற்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
- issue: אֲנָשִׁים என்பதன் மனிதக் குறிப்பு
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இச்சூழலில் மனிதர்களைப் பொதுவாகக் குறிக்கும் பிரதிநிதித்துவப் பன்மை இயல்பாக உள்ளது; ‘மனிதர்கள்’ என்பது தமிழில் பாலினத்தைத் தேவையின்றி வரையறுக்காமல் மூலத்தின் மனிதக் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானாலும் கண்ணியமான கவிதைநடையுடன் வடிவமைக்கப்பட்டது. ‘உயர்த்திப் போற்று’ என்பது மூல வினையின் மேன்மைப்படுத்தும் உணர்வையும் தமிழின் இயல்பான புகழ்ச்சிப் பயன்பாட்டையும் இணைக்கிறது; கடினமான கடைசி வினையின் பொருள் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
