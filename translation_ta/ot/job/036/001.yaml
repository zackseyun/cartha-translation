lexical_decisions:
- source_word: וַיֹּסֶף
  choice: தொடர்ந்து
  rationale: יסף என்பதன் அடிப்படைப் பொருள் ‘சேர்த்தல்/மேலும் செய்தல்.’ இங்கு உரையை அறிமுகப்படுத்தும் சூத்திரத்தில், எலிகூ தொடர்ந்து பேசுவதைக் குறிக்கிறது; ஆகவே நவீனத் தமிழில் இயல்பான ‘தொடர்ந்து’ பயன்படுத்தப்பட்டது.
- source_word: אֱלִיהוּא
  choice: எலிகூ
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: אמר என்ற வினையின் வழக்கமான இறந்தகாலக் கதைநடை வடிவம். எழுவாய் ஏற்கெனவே குறிப்பிடப்பட்டிருப்பதால், ‘அவன்’ என்பதைத் தனியே சேர்க்காமல் இயல்பான தமிழில் வழங்கப்பட்டது.
