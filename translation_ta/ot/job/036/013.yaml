revisions:
- from: ஆனால், உள்ளத்தில் இறையச்சமற்றவர்கள்[a] கோபத்தைச் சேர்த்துவைக்கிறார்கள்; அவர் அவர்களைக் கட்டுப்படுத்தும்போது[b] அவர்கள் உதவிக்காகக் கூக்குரலிடுவதில்லை.
  to: ஆனால், உள்ளத்தில் இறையச்சமற்றவர்கள்[a] கோபத்தைச் சேர்த்துவைக்கிறார்கள்; அவர் அவர்களைக் கட்டிவைக்கும்போது[b] அவர்கள் உதவிக்காகக் கூக்குரலிடுவதில்லை.
