  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: ta
  text: ஆனால், உள்ளத்தில் இறையச்சமற்றவர்கள்[a] கோபத்தைச் சேர்த்துவைக்கிறார்கள்; அவர் அவர்களைக் கட்டிவைக்கும்போது[b] அவர்கள் உதவிக்காகக் கூக்குரலிடுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உள்ளத்தில் இறையச்சமற்றவர்கள்’ என்பதை ‘உள்ளத்தில் வெளிவேடமுள்ளவர்கள்’ அல்லது ‘உள்ளத்தில் பக்தியற்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் அவர்களைக் கட்டிவைப்பதால்.’ எபிரேய இணைப்புச்சொல்லை காலப்பொருளுக்குப் பதிலாக காரணப்பொருளிலும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: உள்ளத்தில் இறையச்சமற்றவர்கள்
  rationale: חנף என்பது இறையச்சமற்ற, பக்தியற்ற அல்லது வெளிவேடமுள்ள நபரைக் குறிக்கலாம். இவ்விடத்தில் வெறும் சமூகப் பாசாங்கைவிட கடவுளைப் பொருட்படுத்தாத உள்ளார்ந்த மனநிலையே முதன்மை; לֵב குறிக்கும் அகநிலையையும் இத்தொடர் காக்கிறது.
- source_word: יָשִׂימוּ אָף
  choice: கோபத்தைச் சேர்த்துவைக்கிறார்கள்
  rationale: சொல்லுக்குச் சொல் ‘கோபத்தை வைக்கிறார்கள்’ என்பது இயல்பான தமிழல்ல. கோபத்தை உள்ளே தேக்கி வைத்துக்கொள்ளும் எபிரேயப் படிமத்தை ‘சேர்த்துவைக்கிறார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; இங்கே אָף அவர்களுடைய கோபமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: לֹא יְשַׁוְּעוּ
  choice: அவர்கள் உதவிக்காகக் கூக்குரலிடுவதில்லை
  rationale: Piel வடிவிலுள்ள שׁוע பொதுவாக உதவி வேண்டிக் கூக்குரலிடுவதைக் குறிக்கிறது. ஆகவே துன்பத்தில் உதவி கோரும் பொருள் தெளிவாகவும் இயல்பாகவும் தரப்படுகிறது.
- source_word: כִּי
  choice: -ும்போது
  rationale: இணைப்புச்சொல் இச்சூழலில் காலப்பொருளாக, கட்டுப்படுத்தப்படும் நேரத்தில் அவர்கள் உதவி கோருவதில்லை என்று வாசிக்கப்படலாம். காரணப்பொருளும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֲסָרָם
  choice: அவர் அவர்களைக் கட்டுப்படுத்துகிறார்
  rationale: אָסַר என்பதற்கு கட்டுதல், தளையிடுதல், சிறைப்படுத்துதல் ஆகிய பொருள்கள் உண்டு. துன்பத்தின் மூலம் அடக்கி வைக்கும் பரந்த சூழலை ‘கட்டுப்படுத்துகிறார்’ இயல்பாகக் காட்டுகிறது; ஒருமை எழுவாய் சூழலால் கடவுளைக் குறித்தாலும், மூலம்போல ‘அவர்’ என்றே வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவர் அவர்களைக் கட்டுப்படுத்தும்போது’ என்பதில் ஒருமை எழுவாயின் குறிப்பு
  choice: கடவுளைச் சூழலால் குறிக்கும் ‘அவர்’ என்ற பதிற்பெயர் தக்கவைக்கப்பட்டது.
  alternative: ‘கடவுள் அவர்களைக் கட்டுப்படுத்தும்போது’ என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரேயம் மூன்றாம் நபர் ஒருமை வினை வடிவையே பயன்படுத்துகிறது. சூழல் கடவுளின் செயல்களைக் குறித்தாலும், பெயரைச் சேர்க்காமல் இருப்பது மூலத்தின் வெளிப்பாட்டு அளவையும் அதன் மறைமுகத் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இறையச்சமற்றவர்கள்’ என்ற சொல் அகநிலையான கடவுள் மறுப்பை அல்லது பக்தியின்மையை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
