  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: ta
  text: பஞ்சத்தில் அவர் உன்னை மரணத்திலிருந்து மீட்பார்[a]; போரில் வாளின் வல்லமையிலிருந்து காப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பார்’ என்பதை ‘விடுவிப்பார்’ அல்லது ‘காப்பாற்றுவார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை விடுதலை அல்லது ஆபத்திலிருந்து மீட்பு என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘வாளின் கைகளிலிருந்து.’ இது வாளின் அதிகாரம் அல்லது வல்லமையிலிருந்து என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: பஞ்சத்தில்
  rationale: רָעָב என்பது பசி அல்லது பஞ்சத்தைக் குறிக்கலாம்; பேரிடர் சூழலில் இங்கு ‘பஞ்சம்’ இயல்பான பொருள்.
- source_word: פָּדְךָ
  choice: அவர் உன்னை மீட்பார்
  rationale: פדה விடுவித்தல், மீட்டல், மீட்புவிலை கொடுத்து விடுவித்தல் ஆகிய பொருள் பரப்பைக் கொண்டது; இங்கு காலச்சார்ந்த ஆபத்திலிருந்து மீட்பதைக் குறிக்கும் வலிமையை ‘மீட்பார்’ தக்கவைக்கிறது.
- source_word: מִמָּוֶת
  choice: மரணத்திலிருந்து
  rationale: מִן பிரிவை அல்லது ஆபத்திலிருந்து அகற்றப்படுவதைச் சுட்டுகிறது; מָוֶת என்பதன் நேரடியான பெயர்ச்சொல் வடிவம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וּבְמִלְחָמָה
  choice: போரில்
  rationale: מִלְחָמָה போர் அல்லது போராட்டத்தைக் குறிக்கும்; இணை அமைப்பில் ‘போரில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִידֵי
  choice: பிடியிலிருந்து
  rationale: ‘கைகளிலிருந்து’ என்ற எபிரெய உருவகம் அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கிறது. ‘வாளின் பிடி’ தமிழில் அந்த உருவகத்தையும் ஆபத்தின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָרֶב
  choice: வாள்
  rationale: חָרֶב என்பதன் அடிப்படைப் பொருள் ‘வாள்’; இங்கு அது போரின் கொல்லும் ஆற்றலையும் குறிக்கிறது.
theological_decisions:
- issue: ஞான இலக்கியச் சூழலில் פדה என்பதன் மொழிபெயர்ப்பு
  choice: மீட்பார்
  alternative: விடுவிப்பார் / காப்பார்
  rationale: இவ்வசனம் உடனடியான பேராபத்திலிருந்து தெய்வீக மீட்பைப் பற்றிப் பேசுகிறது. ‘மீட்பார்’ எபிரெய வினையின் வலிமையைத் தக்கவைக்கிறது; ஆனால் பிற்கால இரட்சிப்பியல் கருத்துகளை இங்கு திணிப்பதில்லை.
- issue: இரண்டாம் அடியில் விடுபட்ட வினை
  choice: காப்பார் என்று இயல்பாக நிரப்பப்பட்டது
  alternative: ‘போரில் வாளின் பிடியிலிருந்து’ என்று வினையின்றி விடுதல்
  rationale: எபிரெயக் கவிதையில் முதல் அடியின் פדה இரண்டாம் அடியிலும் பொருளால் தொடர்கிறது. தமிழில் முழுமையான, இயல்பான வாக்கியத்திற்காக ‘காப்பார்’ சேர்க்கப்பட்டது; இது புதிய கருத்தைச் சேர்க்காமல் இணை அடியின் பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியில் ‘மீட்பார்’ மூலம் פדה-வின் தனித்துவம் காக்கப்பட்டு, இரண்டாம் அடியின் மறைந்த வினை தமிழில் ‘காப்பார்’ என வெளிப்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
