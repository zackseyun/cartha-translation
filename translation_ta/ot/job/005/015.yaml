id: JOB.5.15
reference: Job 5:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: ta
  text: ஆனால் அவர் ஏழையை அவர்களுடைய வாயின் வாளிலிருந்தும்[a], வலியவரின் கையிலிருந்தும் காப்பாற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஏழையை வாளிலிருந்தும், அவர்களுடைய வாயிலிருந்தும், வலியவரின் கையிலிருந்தும் காப்பாற்றினார்.” எபிரெய வாசகம் செறிவானது; “அவர்களுடைய வாயிலிருந்து” என்பதை “அவர்களுடைய வாயின் வாள்” என்பதுடன் இணைக்காமல் தனியாகவும் எடுத்துக்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: காப்பாற்றுகிறார்
  rationale: ישׁע என்பது விடுவித்தல் அல்லது காப்பாற்றுதல் என்று பொருள்படும். சூழலில் மறைமுக எழுவாய் கடவுள். வடிவம் இறந்தகாலத் தொடரைக் குறிக்கக்கூடியதாயினும், எலிப்பாஸின் பொதுவான கூற்றுக்கு நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: מֵחֶרֶב
  choice: வாளிலிருந்து
  rationale: חֶרֶב என்பதன் நேரடிப் பொருள் ‘வாள்’; מִן விடுவிக்கப்படும் ஆபத்திலிருந்து பிரிதலைக் குறிக்கிறது.
- source_word: מִפִּיהֶם
  choice: அவர்களுடைய வாயின்
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய வாயிலிருந்து.’ முந்தைய ‘வாள்’ என்பதுடன் இணைத்து, தீங்கிழைக்கும் பேச்சை வாளாகச் சித்தரிக்கும் செறிவான எபிரெய உருவகம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது.
- source_word: וּמִיַּד
  choice: கையிலிருந்தும்
  rationale: יָד என்பதன் நேரடிப் பொருள் ‘கை’; அது அதிகாரம் அல்லது கட்டுப்பாட்டையும் குறிக்கலாம். ‘வலியவர்’ என்பதுடன் வரும் உறுதியான உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: חָזָק
  choice: வலியவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை; வலிமையுள்ள அல்லது அதிகாரமுள்ள நபரைச் சுட்டுகிறது. ஒருமை வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: אֶבְיוֹן
  choice: ஏழையை
  rationale: אֶבְיוֹן பொருளாதாரமும் சமூகமும் சார்ந்த தேவையிலும் நலிவிலும் உள்ளவரைக் குறிக்கிறது. ‘ஏழை’ என்பது தமிழில் இயல்பானதும் சுருக்கமானதும் ஆகும்.
theological_decisions:
- issue: ‘அவர்களுடைய வாயின் வாள்’ என்ற உருவகத்தின் பொருள்
  choice: தீங்கிழைக்கும் பேச்சை வாளாகக் காட்டும் உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘வாளிலிருந்தும், அவர்களுடைய வாயிலிருந்தும்’ என்று தனித்தனி ஆபத்துகளாக வாசித்தல்
  rationale: எபிரெய சொற்றொடர் செறிவாகவும் இலக்கண ரீதியாக இருவிதமாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. முதன்மை மொழிபெயர்ப்பு இலக்கிய உருவகத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘வாய்—வாள்’ உருவகம் இயல்பான தமிழ் தொடராக வைக்கப்பட்டுள்ளது; எபிரெயின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
