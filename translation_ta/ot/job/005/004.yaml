translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் மூன்று கூறுகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன; மூலத்தின் நீதித்துறைச் சூழல் ‘நகரவாசல்’ என்றும் அதன் பண்பாட்டு பொருள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
