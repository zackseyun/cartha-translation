  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: ta
  text: அவனுடைய பிள்ளைகள் பாதுகாப்பிலிருந்து வெகு தொலைவில் இருக்கிறார்கள்[a]; நகரின் வாசலில்[b] அவர்கள் நசுக்கப்படுகிறார்கள்; அவர்களை மீட்பவர் எவரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீட்பிலிருந்து வெகு தொலைவில்” அல்லது “விடுதலையிலிருந்து வெகு தொலைவில்.”
    reason: lexical_alternative
  - marker: b
    text: “நகரின் வாசல்” என்பது வழக்குகள் விசாரிக்கப்பட்டு, பொதுத் தீர்மானங்கள் எடுக்கப்பட்ட இடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: வெகுதொலைவில் இருக்கிறார்கள்
  rationale: רחק என்பதன் தொலைவில் இருத்தல் என்ற நிலைப்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בָנָיו
  choice: அவனுடைய பிள்ளைகள்
  rationale: בנים என்பது மகன்களை அல்லது பொதுவாகப் பிள்ளைகளைச் சுட்டலாம்; இங்கு பாலினத்தை வலியுறுத்தாத சந்ததியைக் குறிப்பதால் ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: מִיֶּשַׁע
  choice: பாதுகாப்பிலிருந்து
  rationale: יֶשַׁע என்பதற்கு மீட்பு, விடுதலை, பாதுகாப்பு ஆகிய பொருள் வாய்ப்புகள் உள்ளன; உடனடியான சமூகச் சூழலில் ‘பாதுகாப்பு’ இயல்பாகப் பொருந்துகிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְיִדַּכְּאוּ
  choice: அவர்கள் நசுக்கப்படுகிறார்கள்
  rationale: דכא என்பதன் வலுவான நசுக்குதல் அல்லது ஒடுக்குதல் என்ற செயப்பாட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: בַשַּׁעַר
  choice: நகரவாசலில்
  rationale: שַׁעַר சொல்லளவில் வாசலைக் குறித்தாலும் இச்சூழலில் பொது விசாரணையும் நீதித்தீர்ப்பும் நடைபெற்ற நகரவாசலைக் குறிக்கிறது.
- source_word: וְאֵין מַצִּיל
  choice: அவர்களை மீட்பவர் எவரும் இல்லை
  rationale: אין உடனான נצל வினையின் பங்கேற்புப் பெயர் வடிவம், மீட்பவர் ஒருவரும் இல்லாத நிலையை வலியுறுத்துகிறது.
