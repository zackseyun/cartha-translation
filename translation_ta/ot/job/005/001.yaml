revisions:
- from: இப்போது கூப்பிடு—உனக்குப் பதிலளிப்பவர் யாராவது இருக்கிறாரா? பரிசுத்தர்களில்[a] யாரிடம் நீ திரும்புவாய்?
  to: இப்போது அழைத்துப் பார்—உனக்குப் பதில் சொல்பவர் யாராவது இருக்கிறாரா? பரிசுத்தமானவர்களில்[a] யாரை நோக்கி நீ திரும்புவாய்?
  rationale: The revision keeps the Hebrew’s imperative and paired rhetorical questions, improves modern standard Tamil idiom, and avoids prematurely identifying the ‘holy ones’ with human saints. The footnote retains the lexical range and the likely heavenly contextual reference while preserving interpretive caution.
  reviewer_model: gpt-5.6-terra
