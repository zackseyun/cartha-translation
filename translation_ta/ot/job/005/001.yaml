  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: ta
  text: இப்போது அழைத்துப் பார்—உனக்குப் பதில் சொல்பவர் யாராவது இருக்கிறாரா? பரிசுத்தமானவர்களில்[a] யாரை நோக்கி நீ திரும்புவாய்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தர்கள்’ அல்லது ‘பரிசுத்த உயிர்கள்.’ எபிரெயத்தில் உள்ள ‘பரிசுத்தமானவர்கள்’ என்பது இங்கு விண்ணுலக உயிர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  choice: கூப்பிடு
  rationale: קרא என்பதன் கட்டளை வடிவம். எலிப்பாசின் சவால் தொனியை இயல்பாக வெளிப்படுத்துகிறது; ‘கதறு’ என்பது மூலத்தில் இல்லாத உணர்ச்சித் தீவிரத்தைச் சேர்க்கக்கூடும்.
- source_word: נָא
  choice: இப்போது
  rationale: அவசரத்தையோ வலியுறுத்தலையோ தரும் துகள். இவ்வாதச் சூழலில் மரியாதை வேண்டுகோளைக் குறிக்கும் ‘தயவுசெய்து’ என்பதைவிட ‘இப்போது’ பொருத்தமானது.
- source_word: הֲיֵשׁ
  choice: யாராவது இருக்கிறாரா?
  rationale: கேள்வித் துகளுடன் வரும் இருப்பைக் குறிக்கும் சொல்; விடை ‘இல்லை’ என எதிர்பார்க்கும் வினாவின் நேரடியான தன்மையைப் பாதுகாக்கிறது.
- source_word: עוֹנֶךָ
  choice: உனக்குப் பதிலளிப்பவர்
  rationale: 'ענה இங்கு ‘பதிலளி’ என்ற பொருளில், இரண்டாம் நபர் ஒருமை பின்னொட்டுடன் பெயர்ச்சொல் தன்மையில் வருகிறது: ‘உனக்குப் பதிலளிப்பவர்.’'
- source_word: וְאֶל־מִי
  choice: யாரிடம்
  rationale: ஒரு குழுவிலிருந்து எவரை நோக்கித் திரும்புவாய் என்ற இரண்டாவது வினாவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִקְּדֹשִׁים
  choice: பரிசுத்தர்களில்
  rationale: קדושׁ என்பதன் பன்மைப் பெயர்ச்சொல் பயன்பாடு. அடையாளத்தை முதன்மை உரையில் மிகையாகத் தீர்மானிக்காமல் ‘பரிசுத்தர்கள்’ என வழங்கி, இங்கு விண்ணுலகப் பரிசுத்த உயிர்கள் குறிக்கப்படலாம் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: תִּפְנֶה
  choice: நீ திரும்புவாய்
  rationale: פנה என்பதன் ‘திரும்பு/நோக்கித் திரும்பு’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் உதவி அல்லது முறையீட்டிற்காக அணுகுவது உட்பொருளாக உள்ளது.
theological_decisions:
- issue: מִקְּדֹשִׁים (‘பரிசுத்தர்கள்’) என்பவர்களின் அடையாளம்
  choice: முதன்மை உரையில் ‘பரிசுத்தர்கள்’ என்று பொதுவாக வைத்து, விண்ணுலக உயிர்கள் என்ற சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘பரிசுத்த உயிர்கள்’ அல்லது ‘விண்ணுலகப் பரிசுத்தர்கள்’ என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: யோபின் சூழல் விண்ணுலக உயிர்களைச் சுட்டுவதாகத் தோன்றினாலும், எபிரெயச் சொல் தானாகவே அந்த விளக்கத்தை முழுமையாக வெளிப்படுத்தவில்லை. ஆகவே உண்மையான சொற்பொருள் அகலத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான வாக்கிய அமைப்பு. எலிப்பாசின் சவால் நிறைந்த இரண்டு வினாக்களும் பாதுகாக்கப்பட்டுள்ளன; ‘திரும்புவாய்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது.
