source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: ta
  text: உன் கூடாரம் நலமாக இருப்பதை நீ அறிவாய்; உன் உறைவிடத்தைச் சோதித்துப் பார்க்கும்போது, எதுவும் குறைவாக இருப்பதைக் காணமாட்டாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ பாவம் செய்யமாட்டாய்.” எபிரெய வினை பொதுவாக “பாவம் செய்” என்று பொருள்படும்; இச்சூழலில் அது எதுவும் குறைவாக இருப்பதைக் காணுதல் அல்லது எதையாவது தவறவிடுதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: நீ அறிவாய்
  rationale: இணைப்பிடைச்சொல்லுடன் வந்துள்ள Qal நிறைவுவினை, இக்கவிதை வாக்குறுதியின் சூழலில் எதிர்கால உறுதியைக் குறிக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: காரணத்தைக் காட்டாமல், அறியப்படும் செய்தியை அறிமுகப்படுத்துகிறது.
- source_word: שָׁלוֹם
  choice: நலமாக
  rationale: שָׁלוֹם இங்கு அமைதி, பாதுகாப்பு, முழுநலம் ஆகியவற்றை உள்ளடக்கிய வீட்டின் நிலையைக் குறிக்கிறது; இயல்பான தமிழில் ‘நலமாக’ அந்த விரிந்த பொருளைத் தருகிறது.
- source_word: אָהֳלֶךָ
  choice: உன் கூடாரம்
  rationale: பண்டைய சூழலையும் மூல உருவகத்தையும் காக்க ‘கூடாரம்’ நேரடியாகத் தக்கவைக்கப்பட்டது.
- source_word: וּפָקַדְתָּ
  choice: சோதித்துப் பார்க்கும்போது
  rationale: פקד என்பதன் பார்வையிடுதல், கணக்கெடுத்தல், கவனித்தல் ஆகிய பொருட்களில், அடுத்துள்ள ‘குறைவு’ கருத்துடன் ‘சோதித்துப் பார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: נָוְךָ
  choice: உன் உறைவிடம்
  rationale: ‘கூடாரம்’ என்பதற்கு இணையாக இங்கு வசிப்பிடம் அல்லது இல்லச் சூழலைக் குறிக்கிறது.
- source_word: וְלֹא תֶחֱטָא
  choice: எதுவும் குறைந்திருக்காது
  rationale: חטא பொதுவாக ‘பாவம் செய்’ என்று பொருள்பட்டாலும், ‘தவறு/தவறவிடு’ என்ற அடிப்படையில் இச்சூழலில் சோதிக்கும்போது எதுவும் காணாமல் போகவோ குறையவோ இல்லை என்ற பொருள் சிறப்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: וְלֹא תֶחֱטָא என்பதன் சூழல்சார் பொருள்
  choice: எதுவும் குறைந்திருக்காது
  alternative: நீ பாவம் செய்யமாட்டாய்
  rationale: வசிப்பிடத்தின் பாதுகாப்பையும் முழுமையையும் பற்றிய தொடரில், அதைச் சோதித்துப் பார்த்தபின் எதுவும் குறைவாக இல்லை என்பதே இயல்பான தொடர்பு. ஆயினும் எபிரெய வினையின் வழக்கமான அறநெறிப் பொருள் உண்மையான மாற்று என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்’ மூலத்தின் பண்டைய உருவகத்தைப் பேணுகிறது; ‘உறைவிடம்’ இணைவரியின் பரந்த இல்லச் சூழலை வெளிப்படுத்துகிறது.
