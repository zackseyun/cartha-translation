- from: உன் கூடாரம் நலமாக இருப்பதை நீ அறிவாய்; உன் உறைவிடத்தைச் சோதித்துப் பார்க்கும்போது, எதுவும் குறைந்திருக்காது.[a]
  to: உன் கூடாரம் நலமாக இருப்பதை நீ அறிவாய்; உன் உறைவிடத்தைச் சோதித்துப் பார்க்கும்போது, எதுவும் குறைவாக இருப்பதைக் காணமாட்டாய்.[a]
