source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: ta
  text: ஆறு துன்பங்களில் அவர் உன்னை விடுவிப்பார்; ஏழிலும்[a] எந்தத் தீங்கும்[b] உன்னைத் தொடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறு… ஏழு’ என்பது மீண்டும் மீண்டும் அல்லது முழுமையாகக் கிடைக்கும் விடுதலையை உணர்த்தும் எபிரெயக் கவிதை வழக்கு; துன்பங்கள் சரியாக ஏழு மட்டுமே என்று இதை எடுத்துக்கொள்ள வேண்டியதில்லை.
    reason: cultural_note
  - marker: b
    text: அல்லது ‘தீமை’; ‘பேரிடர்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: ஆறு ... துன்பங்களில்
  rationale: בְּ என்னும் முன்னிடைச்சொல்லையும் எண்ணையும் தமிழில் இயல்பாகக் காட்டுவதற்காக ‘ஆறு துன்பங்களில்’ என மொழிபெயர்க்கப்பட்டது; இது சரியாக ஆறு என்ற வரம்பை அல்ல, துன்பம் நேரிடும் சூழலைக் குறிக்கிறது.
- source_word: צָרוֹת
  choice: துன்பங்கள்
  rationale: இந்தச் சொல் நெருக்கடி, இடுக்கண், துன்பம் ஆகிய பரந்த பொருள்களைக் கொண்டது. ‘துன்பங்கள்’ என்பது குறிப்பிட்ட ஒரு வகை வேதனையாகச் சுருக்காமல், நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: יַצִּילֶךָּ
  choice: அவர் உன்னை விடுவிப்பார்
  rationale: נצל என்பதன் ஹிஃபீல் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்பதைக் குறிக்கிறது. சூழலில் எழுவாய் கடவுளைக் குறித்தாலும், எபிரெய உரையில் பெயர் வெளிப்படையாக இல்லாததால் ‘அவர்’ என்று வைக்கப்பட்டது.
- source_word: וּבְשֶׁבַע
  choice: ஏழிலும்
  rationale: ‘ஆறு… ஏழு’ என்ற எண் இணைவு அதிகரிப்பையும் மீண்டும் மீண்டும் அல்லது முழுமையாக நேரிடுவதையும் சுட்டும் எபிரெயக் கவிதை நடை. ‘ஏழிலும்’ என்பது அதன் சுருக்கத்தையும் உச்சநிலையையும் காக்கிறது.
- source_word: לֹא יִגַּע
  choice: தொடாது
  rationale: נגע என்பதற்கு தொடுதல், எட்டுதல், தாக்குதல் ஆகிய பொருள்கள் உண்டு. ‘தொடாது’ என்பது மூல உருவகத்தைப் பாதுகாத்து, உடல் தாக்குதலுக்கு மட்டும் பொருளைக் குறுக்காமல் வைக்கிறது.
- source_word: בְּךָ
  choice: உன்னை
  rationale: נגע உடன் வரும் בְּ பாதிக்கப்படும் நபரைக் குறிக்கிறது; தமிழில் இது இயல்பாக நேர்செயப்படுபொருளான ‘உன்னை’ என்று அமைகிறது.
- source_word: רָע
  choice: எந்தத் தீங்கும்
  rationale: רָע என்பது தீமை, தீங்கு, பேரிடர் எனப் பரந்த பொருள் கொள்ளலாம். துன்பங்களிலிருந்து விடுவித்தல் என்ற இச்சூழலில் ‘தீங்கு’ இயல்பாக உள்ளது; எதிர்மறை வாக்கியத்தில் ‘எந்தத் தீங்கும்’ என்பது தமிழில் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘விடுவிப்பார்’ என்ற வினையின் மறைமுக எழுவாய்
  choice: கடவுள் என்ற பெயரைச் சேர்க்காமல் ‘அவர்’ என்று வைக்கப்பட்டது.
  alternative: ‘கடவுள் உன்னை விடுவிப்பார்’
  rationale: சுற்றியுள்ள வசனங்கள் எழுவாய் கடவுள் என்பதைத் தெளிவாக்குகின்றன; ஆனால் இவ்வசனத்தின் எபிரெய உரையில் இறைப்பெயர் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் இலக்கண வடிவம் பாதுகாக்கப்படுகிறது.
- issue: ‘ஆறு… ஏழு’ என்ற எண் வாய்பாட்டின் பொருள்
  choice: எண்கள் முதன்மை உரையில் அப்படியே வைக்கப்பட்டு, அவற்றின் கவிதை வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: சரியாக ஆறு மற்றும் ஏழு துன்பங்கள் என்ற நேரடி எண்ணிக்கை; அல்லது ‘எத்தனை துன்பங்கள் வந்தாலும்’ என்ற முழுப் பொழிப்புரை
  rationale: எபிரெயக் கவிதையின் அதிகரிக்கும் எண் இணைவு பாதுகாக்கப்படுகிறது; அதேவேளை அதை சரியான எண்ணிக்கை என்றோ, உரையிலேயே முழுமையாக விளக்கப்பட்ட கருத்து என்றோ ஒருதலைப்பட்சமாக மாற்றவில்லை.
- issue: רָע என்பதன் பொருள் பரப்பு
  choice: இச்சூழலில் ‘தீங்கு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தீமை’ அல்லது ‘பேரிடர்’
  rationale: சொல் அறநெறித் தீமையையும் அனுபவிக்கப்படும் கேடு அல்லது பேரிடரையும் குறிக்கக்கூடும். விடுதலையும் துன்பங்களையும் பற்றிய இச்சூழலில் ‘தீங்கு’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆறு… ஏழு’ என்ற மூல இணை அமைப்பும் ‘தொடாது’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற இறையியல் விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
