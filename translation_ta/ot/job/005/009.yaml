  text: עֹשֶׂ֣ה גְ֭דֹלוֹת וְ/אֵ֣ין חֵ֑קֶר נִ֝פְלָא֗וֹת עַד אֵ֥ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/009.yaml
  text: who does great things beyond searching out[a], wonders beyond number[b],
translation:
  language: ta
  text: ஆராய்ந்து அறிய முடியாத[a] பெரிய காரியங்களையும், எண்ணிக்கைக்கு அப்பாற்பட்ட[b] அதிசயங்களையும் செய்கிறவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆராய முடியாத’; சொல்லுக்கு சொல், ‘ஆராய்தல் இல்லை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எண்ணிக்கையில்லாத’ அல்லது ‘எண்ணிலடங்காத.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: செய்கிறவர்
  rationale: עשה என்பதன் Qal வினையெச்ச வடிவம், சூழலில் கடவுளை விவரிக்கும் தொடர்புத் தொடராக வருகிறது. ‘செய்கிறவர்’ என்பது அதன் தொடர்ச்சியான விளக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: גְדֹלוֹת
  choice: பெரிய காரியங்கள்
  rationale: பன்மை அடைமொழி இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘பெரிய காரியங்கள்’ என்பது ‘செயல்கள்’ எனக் குறிப்பாக்காமல் எபிரெயச் சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: וְאֵין חֵקֶר
  choice: ஆராய்ந்து அறிய முடியாத
  rationale: சொல்லுக்கு சொல் பொருள் ‘ஆராய்தல் இல்லை’ என்பதாகும். ‘ஆராய்ந்து அறிய முடியாத’ என்பது மனித ஆராய்ச்சிக்கு எட்டாதவை என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: נִפְלָאוֹת
  choice: அதிசயங்கள்
  rationale: இந்தப் பெயர்ச்சொல் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘அதிசயங்கள்’ என்பது கவிதை இணைநிலையிலும் இயல்பாக அமைகிறது.
- source_word: עַד אֵין מִסְפָּר
  choice: எண்ணிக்கைக்கு அப்பாற்பட்ட
  rationale: இந்த மரபுத்தொடர் எண்ணிலடங்காமையைக் குறிக்கிறது. ‘எண்ணிக்கைக்கு அப்பாற்பட்ட’ என்பது முதல் அரையடியின் ‘முடியாத’ என்ற அமைப்புடன் கவிதைச் சமநிலையைப் பேணுகிறது.
