translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணை அரையடிகளின் சமநிலையைப் பேணுவதற்காக ‘ஆராய்ந்து அறிய முடியாத’ மற்றும் ‘எண்ணிக்கைக்கு அப்பாற்பட்ட’ என்ற அமைப்புகள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
