base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: ta
  text: இதோ, இறைவன் கடிந்துகொண்டு திருத்தும் மனிதர் பேறுபெற்றவர்[a]; எனவே, எல்லாம் வல்லவரின்[b] ஒழுக்கப் பயிற்சியை[c] இகழாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிழ்ச்சியுடையவர்” அல்லது “நற்பேறு பெற்றவர்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வாழ்த்துக் கூற்று விரும்பத்தக்க பேறுநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “ஷத்தாய்”; மரபாக “எல்லாம் வல்லவர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “ஒழுக்கப்படுத்துதல்,” “திருத்துதல்,” “பயிற்றுவித்தல்,” அல்லது “சிட்சை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: முக்கியமான ஞானக்கூற்றின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் அடையாளத்தின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டாமல், விரும்பத்தக்க நல்வாழ்வு நிலையில் இருப்பதைக் குறிக்கும் ஞானநூல் வாழ்த்துக் கூற்றை வெளிப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதர்
  rationale: இங்கு ஒரு தனிப்பட்ட ஆணை மட்டும் அல்லாமல், இறப்புக்குரிய மனிதரைப் பொதுவாகச் சுட்டும் ஒருமைச் சொல்லாக இருப்பதால், மரியாதையும் இயல்பும் கொண்ட பொதுப்பொருள் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יוֹכִחֶנּוּ
  choice: கண்டித்துத் திருத்தும்
  rationale: יכח என்பதன் ஹிஃபில் வடிவம் இங்கு வெறும் குற்றச்சாட்டை அல்ல, நன்மைக்காகக் கண்டித்து நேர்ப்படுத்துவதைக் குறிக்கிறது; இரு கூறுகளும் சேர்ந்த இத்தொடர் அந்தத் திருத்தும் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: אֱלוֹהַּ
  choice: இறைவன்
  rationale: யோபு நூலில் வரும் தெய்வப் பெயருக்கான இயல்பான, கண்ணியமான நவீனத் தமிழாக்கம்.
- source_word: מוּסַר
  choice: ஒழுக்கப்படுத்துதல்
  rationale: ஞான இலக்கியத்தில் இச்சொல் கற்பித்தல், கண்டித்தல், திருத்துதல் ஆகியவற்றை உள்ளடக்கிய பயிற்றுவிக்கும் ஒழுக்க நடவடிக்கையைக் குறிக்கிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: ஷத்தாய் என்ற தெய்வப் பட்டத்தின் பொருளை மொழிபெயர்த்து, தமிழில் நிலைபெற்றுள்ள புரிந்துகொள்ளத்தக்க வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: אַל תִּמְאָס
  choice: புறக்கணிக்காதே
  rationale: இகழ்ந்து ஒதுக்குதல் அல்லது ஏற்க மறுத்தல் என்ற எச்சரிக்கை வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்ற பொதுமைப் பொருளுடைய ஒருமை மனிதச் சொல்லின் மொழிபெயர்ப்பு
  choice: மனிதர்
  alternative: மனிதன் / மானிடன்
  rationale: இச்சொல் சூழலில் பாலின வரம்புள்ள தனிநபரைக் காட்டாமல் மனிதரைப் பொதுவாகக் குறிக்கிறது. ஆகவே அதன் பொதுப்பொருளைக் காக்கும் இயல்பான தமிழாக்கம் பயன்படுத்தப்பட்டது.
- issue: தெய்வக் கண்டிப்புக்கும் מוּסַר என்பதற்கும் உள்ள உறவு
  choice: கண்டித்துத் திருத்தும் ... ஒழுக்கப்படுத்துதல்
  alternative: கடிந்துகொள்ளும் ... தண்டனை / அறிவுரை
  rationale: வலி தரக்கூடிய இறைக் கண்டிப்பு நன்மை பயக்கும் திருத்தமாக முன்வைக்கப்படும் இறையியல் இழுவிசையை இவ்வாக்கம் காக்கிறது; எபிரெயம் கோராத வெறும் தண்டனைப் பொருளையோ, மிக மென்மையான அறிவுரை என்ற பொருளையோ திணிக்கவில்லை.
- issue: இரண்டாம் அரையடியின் இணைப்பு
  choice: எனவே
  alternative: மேலும் / ஆகையால்
  rationale: எபிரெய வாவ் சூழலில் முதல் கூற்றிலிருந்து வரும் நடைமுறை முடிவை அறிமுகப்படுத்துகிறது. ‘எனவே’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; அது கண்டிப்பை நிராகரிக்க வேண்டாமென்ற அறிவுரையாக அமைகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “இதோ” என்ற உயர்நடைச் சொல் மூலத்தின் கவன ஈர்ப்பை காக்கிறது; மற்ற சொற்கள் பழமையான வேதாகமத் தமிழைத் தவிர்க்கின்றன.
