base_translation:
  language: en
  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: ta
  text: ஏனெனில், மனக்கசப்பு மூடனைக் கொல்லும்; பொறாமை[a] எளியவனைச் சாகடிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொச்சரிப்பு.” எபிரெயச் சொல் பொறாமை அல்லது பொச்சரிப்பு ஆகிய இரண்டையும் குறிக்கலாம்; இங்கு அது அழிவை உண்டாக்கும் தீவிர உணர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்தை விளக்கும் எலிப்பாசின் கூற்றை அறிமுகப்படுத்துகிறது; வாதத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לֶאֱוִיל
  choice: மூடனை
  rationale: வெறும் அறிவுத்திறன் குறைவை அல்லாமல், நடைமுறையிலும் ஒழுக்கத்திலும் மதியீனமாக நடப்பவரைக் குறிக்கிறது.
- source_word: יַהֲרָג
  choice: கொன்றுவிடுகிறது
  rationale: ஞான இலக்கியத்துக்குரிய பொதுநியதியை நிகழ்காலப் பொருளில் கூறி, வினையின் உயிர்க்கொல்லும் வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כָּעַשׂ
  choice: மனக்கசப்பு
  rationale: சினம், எரிச்சல், வேதனை கலந்த உள்ளக் கொந்தளிப்பைக் குறிக்கக்கூடிய சொல்லாகும்; இணைவரியில் வரும் அழிவுக்குரிய உணர்ச்சியோடு இயல்பாகப் பொருந்துகிறது.
- source_word: וּפֹתֶה
  choice: எளியவனை
  rationale: ஞான இலக்கியத்தில் அனுபவமின்றி எளிதில் வசப்படுகிற நபரைக் குறிக்கிறது; அறிவுத்திறன் குறைபாட்டைத் தவறாக உணர்த்தாமல் சுருக்கமாக உள்ளது.
- source_word: תָּמִית
  choice: சாகடிக்கிறது
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, முதல் அரையடியின் இணைப்பையும் சொல்வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: קִנְאָה
  choice: பொறாமை
  rationale: இங்கு அழிவை ஏற்படுத்தும் எதிர்மறை உணர்ச்சியைக் குறிக்கிறது; ‘வைராக்கியம்’ பொருந்தாது, ‘பொச்சரிப்பு’ என்பதும் சாத்தியமான மாற்றுப் பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
