  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: ta
  text: 'அவனுடைய அறுவடையைப் பசித்தவன் தின்றுவிடுகிறான்;

    முட்களுக்கிடையிலிருந்தும் அதை எடுத்துக்கொள்கிறான்;

    தாகமுள்ளவர்கள் அவர்களுடைய செல்வத்தை மூச்சிரைத்து நாடுகிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கண்ணி அவர்களுடைய செல்வத்தை விழுங்குகிறது.” இறுதி அரையடியின் எபிரெய வாசகம் கடினமானது. முதன்மை உரை, “பசித்தவன்” என்பதற்கு இணையாக “தாகமுள்ளவர்கள்” என்று வாசிக்கும் பொதுவான புரிதலைப் பின்பற்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: அவனுடைய அறுவடை
  rationale: קָצִיר என்பது அறுவடை செய்யப்பட்ட விளைச்சலையோ அறுவடையையோ குறிக்கிறது; ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: רָעֵב
  choice: பசித்தவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஒருமை பெயரடை; எபிரெய உரையின் இலக்கண எண்ணை இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: முட்களுக்கிடையிலிருந்தும் அதை எடுத்துக்கொள்கிறான்
  rationale: சொற்றொடர் கடினமானதாயினும், முட்கள் உள்ள இடத்திலிருந்துகூட விளைச்சல் எடுத்துக்கொள்ளப்படுவதை இந்த மொழிபெயர்ப்பு மிகையின்றி சித்தரிக்கிறது.
- source_word: צִנִּים
  choice: முட்கள்
  rationale: வேளாண்மைச் சூழலுக்கு ஏற்ற நேரடியான பொதுப் பொருள்; ‘கொக்கிகள்’ போன்ற சாத்தியங்களைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: וְשָׁאַף
  choice: ஏங்குகிறார்கள்
  rationale: שָׁאַף என்பதிலுள்ள மூச்சிரைத்தல் அல்லது பேராவலுடன் நாடுதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: צַמִּים
  choice: தாகமுள்ளவர்கள்
  rationale: மெய்யெழுத்து உரையின் பொதுவான புரிதலைப் பின்பற்றி, முன்வரும் ‘பசித்தவன்’ என்பதுடன் உள்ள இணைவடிவத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֵילָם
  choice: அவர்களுடைய செல்வம்
  rationale: חַיִל இங்கு சொத்து, வளம் அல்லது செல்வத்தைக் குறிக்கலாம்; பன்மை உடைமைப் பின்னொட்டையும் அப்படியே காக்கப்படுகிறது.
theological_decisions:
- issue: இறுதி அரையடியின் கடினமான எபிரெய வாசிப்பு
  choice: தாகமுள்ளவர்கள் அவர்களுடைய செல்வத்துக்காக ஏங்குகிறார்கள்
  alternative: ஒரு கண்ணி அவர்களுடைய செல்வத்தை விழுங்குகிறது
  rationale: முதன்மை வாசிப்பு ‘பசித்தவன்’—‘தாகமுள்ளவர்கள்’ என்ற கவிதை இணைவடிவத்தைத் தக்கவைக்கிறது; எனினும் எபிரெயம் உறுதியற்றதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமான நடையும் காக்கப்பட்டுள்ளன. ஒருமை ‘பசித்தவன்’ மற்றும் பன்மை ‘தாகமுள்ளவர்கள்/அவர்களுடைய’ ஆகிய மூல உரையின் இலக்கண மாறுபாடு திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
