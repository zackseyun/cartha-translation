  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: ta
  text: ஏனெனில், அவரே வலியை உண்டாக்குகிறார்; ஆனாலும் கட்டுப்போடுகிறார். அவர் நசுக்குகிறார்; ஆனாலும் அவருடைய கைகள் குணமாக்குகின்றன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ‘அவருடைய கை’ என்பது ஒருமையில் உள்ளது; ஆனால் அதைத் தொடரும் ‘குணமாக்குகின்றன’ என்ற வினை பெண்பால் பன்மையில் உள்ளது. இந்த இலக்கண மாறுபாட்டின் பொருள் உறுதியற்றது. முதன்மை உரை பன்மை வினைக்கு ஏற்ப ‘அவருடைய கைகள்’ என்று தருகிறது. ஒருமையை முன்னிறுத்தும் விளக்கமொழிபெயர்ப்பு: ‘அவர் நசுக்குகிறார்; ஆனாலும் அவருடைய கை குணமாக்குகிறது.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் பொருளை இயல்பாகத் தருகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: தனித்து வரும் எபிரெயப் பதிலிப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி வெளிப்படுத்துகிறது; கடவுளைக் குறிக்கும் சூழலில் ‘அவர்’ கண்ணியமான இயல்பான நடை.
- source_word: יַכְאִיב
  choice: வலியை உண்டாக்குகிறார்
  rationale: כאב என்பதன் ஹிஃபில் வடிவம் ‘வலி ஏற்படுத்துதல்’ என நேரடியாகக் குறிக்கிறது; ‘காயப்படுத்துகிறார்’ என்று குறிப்பான உடற்காயப் படிமத்தைச் சேர்ப்பதை இது தவிர்க்கிறது.
- source_word: וְיֶחְבָּשׁ
  choice: ஆனாலும் அவரே கட்டுப்போடுகிறார்
  rationale: חבש இச்சூழலில் காயத்தைக் கட்டி பராமரிப்பதைக் குறிக்கிறது. கவிதை இணைமையில் உள்ள எதிர்மறை ஒப்புமையை ‘ஆனாலும்’ வெளிப்படுத்துகிறது; தமிழில் ‘கட்டுப்போடுகிறார்’ இயல்பாக மருத்துவப் படிமத்தைத் தருகிறது.
- source_word: יִמְחַץ
  choice: அவர் நசுக்குகிறார்
  rationale: מחץ பலமாக நசுக்குதல் அல்லது crushing blow கொடுத்தல் என்ற தீவிரத்தை உடையது; ‘நசுக்குகிறார்’ அந்தக் கடுமையை இயல்பான தமிழில் காக்கிறது.
- source_word: וְיָדוֹ
  choice: ஆனாலும் அவருடைய கைகள்
  rationale: பெயர்ச்சொல் எழுத்துருவில் ஒருமையாக ‘அவருடைய கை’ என்று இருந்தாலும், அதைத் தொடரும் வினைச்சொல் பெண்பால் பன்மையில் உள்ளது. முதன்மை உரை பொருளை இயல்பாக்கி பன்மையாக வழங்குகிறது; இலக்கண மாறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִּרְפֶּינָה
  choice: குணமாக்குகின்றன
  rationale: רפא என்பதன் கால் வடிவத்திற்குரிய நேரடியான பொருள் ‘குணமாக்குதல்’; எபிரெயப் பன்மை வினை வடிவமும் தமிழில் பன்மையாகப் பிரதிபலிக்கப்படுகிறது.
theological_decisions:
- issue: துன்புறுத்தலிலும் குணப்படுத்தலிலும் கடவுளின் நேரடி செயற்பாடு
  choice: வலியை உண்டாக்குவதையும் நசுக்குவதையும், கட்டுப்போட்டுக் குணமாக்குவதையும் ஒரே கடவுளின் செயல்களாக நேரடியாகக் கூறுதல்.
  alternative: முதல் செயலை ‘வலி ஏற்பட அனுமதிக்கிறார்’ என்று மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை தீங்கு விளைவிக்கும் செயல்களுக்கும் மீட்டெடுக்கும் செயல்களுக்கும் கடவுளையே நேரடிப் பொருளாகக் காட்டுகிறது. அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமலும் மென்மைப்படுத்தாமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு எதிரெதிர் செயல் ஜோடிகளும் அரைப்புள்ளிகளால் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; ‘அவரே’ என்பது மூலத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
