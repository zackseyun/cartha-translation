  naturalness: ‘வலியை உண்டாக்குகிறார்,’ ‘கட்டுப்போடுகிறார்,’ ‘நசுக்குகிறார்,’ ‘கைகள் குணமாக்குகின்றன’ ஆகியவை நவீன பொதுத்தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. இரண்டாம் இணைப்பில் தேவையற்ற வலியுறுத்தலான ‘அவரே’ நீக்கப்பட்டால் மூலத்தில் முதல் இடத்தில் உள்ள வலியுறுத்தல் இன்னும் துல்லியமாகப் பிரதிபலிக்கும்.
