  text: כִּֽי אָ֭דָם לְ/עָמָ֣ל יוּלָּ֑ד וּ/בְנֵי רֶ֝֗שֶׁף יַגְבִּ֥יהוּ עֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: ta
  text: ஏனெனில், மனிதன் துன்பத்திற்குப் பிறக்கிறான்; தீயின் புதல்வர்கள் உயரப் பறக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீப்பொறிகள் மேலே பறக்கின்றன.” எபிரேயச் சொற்றொடர் எழுத்துப்படி “தீயின் புதல்வர்கள்” (அல்லது “ரெஷெப்பின் புதல்வர்கள்”) என்று உள்ளது; இது பொதுவாகத் தீப்பொறிகளைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: ஒருமையில் இருந்தாலும் மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் நீதிமொழி நடையைப் பாதுகாக்கிறது.
- source_word: לְעָמָל
  choice: துன்பத்திற்கு
  rationale: עָמָל என்பது உழைப்பு, வருத்தம், துன்பம் ஆகிய பொருள்களைக் கொள்ளலாம்; இங்கு மனித வாழ்வின் வேதனையையும் இடரையும் உள்ளடக்கும் பரந்த சொல்லாக ‘துன்பம்’ பொருந்துகிறது.
- source_word: יוּלָּד
  choice: பிறக்கிறான்
  rationale: பொதுவான, எக்காலத்திற்கும் பொருந்தும் கூற்றை நவீன தமிழில் இயல்பான நிகழ்காலத்தில் தருகிறது.
- source_word: וּבְנֵי רֶשֶׁף
  choice: தீயின் புதல்வர்கள்
  rationale: ‘ரேஷெப்/தீயின் புதல்வர்கள்’ என்ற எபிரெய உருவகத்தையும் அதன் தெளிவின்மையையும் முதன்மை உரையில் பாதுகாக்கிறது; பொதுவாக ஏற்கப்படும் ‘தீப்பொறிகள்’ என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַגְבִּיהוּ עוּף
  choice: உயரப் பறக்கிறார்கள்
  rationale: உயருதல் மற்றும் பறத்தல் ஆகிய இரு கூறுகளையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனிதன் துன்பத்திற்குப் பிறப்பதன் நோக்கம் அல்லது விதி
  choice: துன்பத்திற்குப் பிறக்கிறான்
  alternative: துன்பத்தை அனுபவிக்கவே பிறக்கிறான்
  rationale: எபிரெய לְ என்பதிலுள்ள நோக்கம்/விதி சார்ந்த பதற்றத்தைத் தீர்மானமாக விளக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமொழிக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் மொழிபெயர்ப்பு. அபூர்வமான எபிரெய உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, வாசகருக்குத் தேவையான விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
