id: JOB.5.3
reference: Job 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: ta
  text: நான் வேரூன்றிக்கொண்டிருந்த ஒரு மூடனைக் கண்டேன்; திடீரென்று அவனுடைய குடியிருப்பைச் சபித்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய குடியிருப்பு சபிக்கப்பட்டது என்று அறிவித்தேன்,” அல்லது “அவனுடைய குடியிருப்பு அழிவுக்குரியது என்று குறித்தேன்.” எபிரெய வினைச்சொல் நேரடியாகச் சபித்ததையோ, வரவிருக்கும் தீர்ப்பைக் குறித்து அறிவித்ததையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: நான்
  rationale: எபிரெய மொழியில் வெளிப்படையாக உள்ள தன்மைப் பெயரை, பேச்சாளரின் வலியுறுத்தலைத் தக்கவைக்க மொழிபெயர்த்துள்ளது.
- source_word: רָאִיתִי
  choice: கண்டேன்
  rationale: முற்றுவினை பேச்சாளரின் நேரடி அனுபவத்தைக் கூறுகிறது; நவீன தமிழில் இயல்பான இறந்தகால வடிவம்.
- source_word: אֱוִיל
  choice: ஒரு மூடனை
  rationale: ஞான இலக்கியத்தில் இச்சொல் அறிவுத்திறன் குறைவை மட்டும் அல்லாமல் ஒழுக்கமும் ஞானமும் அற்ற ஒருவகை மனிதரைக் குறிக்கிறது; ‘மூடன்’ அந்த வகைப்பாட்டைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: מַשְׁרִישׁ
  choice: வேரூன்றிக்கொண்டிருந்த
  rationale: வேர்களைப் பதித்து நிலைபெறுதல் என்ற உருவகத்தைத் தக்கவைத்து, தொடர்ந்துகொண்டிருந்த நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָאֶקּוֹב
  choice: சபித்தேன்
  rationale: נקב என்பதன் இச்சூழலுக்குரிய நேரடியான பொருள் ‘சபித்தல்’; தீர்ப்பை அறிவித்தல் என்ற சாத்தியமான மென்மையான புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָוֵהוּ
  choice: அவனுடைய குடியிருப்பை
  rationale: வசிப்பிடம் அல்லது உறைவிடம் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; வீடு என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: פִתְאֹם
  choice: திடீரென்று
  rationale: நிகழ்வின் எதிர்பாராத, உடனடியான தன்மையை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וָאֶקּוֹב என்பதில் பேச்சாளரின் செயலின் பொருள்
  choice: எலிப்பாஸ், மூடன் நிலைபெறுவதைக் கண்டபின் அவனுடைய குடியிருப்பைத் தானே சபித்ததாகக் கூறுகிறான்.
  alternative: அந்தக் குடியிருப்பு சபிக்கப்பட்டது அல்லது அழிவுக்குரியது என்று அவன் தீர்ப்பறிவித்ததாகப் புரிந்துகொள்ளலாம்.
  rationale: வினைச்சொல்லின் நேரடியான சொல்லாட்சிப் பொருள் ‘சபித்தேன்’ என்பதற்கு ஆதரவளிக்கிறது. எனினும், இது நிகழவிருக்கும் தீர்ப்பைக் கவனித்து அறிவித்தல் என்ற பொருளையும் சூழலில் ஏற்கக்கூடும்; அந்த உண்மையான விளக்கத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேரூன்றுதல்’ என்ற ஞானக் கவிதையின் உருவகம் தக்கவைக்கப்பட்டுள்ளது; மூலத்தின் இணைப்பை பிரதிபலிக்க அரைப்புள்ளி பயன்படுத்தப்பட்டு, எதிர்மறையைச் சேர்க்கும் ‘ஆனால்’ தவிர்க்கப்பட்டுள்ளது.
