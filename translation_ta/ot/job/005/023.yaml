reference: Job 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י עִם אַבְנֵ֣י הַ/שָּׂדֶ֣ה בְרִיתֶ֑/ךָ וְ/חַיַּ֥ת הַ֝/שָּׂדֶ֗ה הָשְׁלְמָה לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: ta
  text: ஏனெனில், வயல்வெளியின் கற்களோடு உனக்கு உடன்படிக்கை இருக்கும்; வயல்வெளியின் காட்டு விலங்குகள் உன்னோடு சமாதானமாக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய உறுதிமொழிக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், வசனங்களுக்கிடையிலான தர்க்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: עִם אַבְנֵי הַשָּׂדֶה
  choice: வயல்வெளியின் கற்களோடு
  rationale: עִם குறிக்கும் உறவையும், אַבְנֵי הַשָּׂדֶה என்ற தெளிவான கவிதைப் படிமத்தையும் அப்படியே காக்கிறது; இவை உழவுக்கு இடையூறான கற்கள் என இருக்கக்கூடிய உட்கருத்தை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בְרִיתֶךָ
  choice: உனக்கு உடன்படிக்கை இருக்கும்
  rationale: எபிரெய முதல் கூறில் வெளிப்படையான வினைச்சொல் இல்லை. தமிழில் முழுமையான வாக்கியமாக அமைய ‘இருக்கும்’ சேர்க்கப்பட்டு, ‘உன் உடன்படிக்கை’ என்பதன் பொருள் மிகைப்படுத்தப்படாமல் காக்கப்படுகிறது.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: வயல்வெளியின் காட்டு விலங்குகள்
  rationale: இந்தச் சொற்றொடரில் חַיָּה பொதுவாகக் காட்டு விலங்குகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் அமையும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָשְׁלְמָה לָךְ
  choice: உன்னோடு சமாதானமாக இருக்கும்
  rationale: שׁלם என்பதன் ஹிஃபில் வடிவம் சமாதானம் செய்தல் அல்லது சமாதான உறவில் இருத்தல் என்ற பொருளைத் தருகிறது. எதிர்கால உறுதிமொழியின் சூழலில் விளைவான அமைதியான உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வயல்வெளியின் கற்கள்’ என்ற எபிரெயப் படிமம் விளக்கமாக மாற்றப்படாமல் நேரடியாக வைக்கப்பட்டுள்ளது; ‘உடன்படிக்கை’ மற்றும் ‘சமாதானம்’ என்ற இணையான உறவுச் சொற்கள் கவிதை அமைப்பைப் பேணுகின்றன.
