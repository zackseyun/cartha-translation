  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: ta
  text: ஏனெனில், துன்பம் புழுதியிலிருந்து தோன்றுவதில்லை[a]; வருத்தமும் நிலத்திலிருந்து முளைப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அக்கிரமம் புழுதியிலிருந்து வெளிவருவதில்லை; துயரமும் நிலத்திலிருந்து முளைப்பதில்லை.” இங்கே பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொற்கள் ஒழுக்கத் தீமை, கேடு, துன்பம் ஆகிய பொருட்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் வாதத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: יֵצֵא
  choice: தோன்றுவதில்லை
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே வருதல்’; புழுதியை மூலமாகக் காட்டும் இச்சூழலில் இயல்பான தமிழில் ‘தோன்றுதல்’ அந்த வெளிப்பாட்டைப் பாதுகாக்கிறது.
- source_word: מֵעָפָר
  choice: புழுதியிலிருந்து
  rationale: עָפָר என்பதன் வழக்கமான பொருள் ‘புழுதி’; மூலத்தைச் சுட்டும் מן முன்னொட்டும் ‘-இலிருந்து’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָוֶן
  choice: துன்பம்
  rationale: இச்சொல் தீமை, அக்கிரமம், கேடு, துன்பம் ஆகிய பொருட்களைக் கொள்ளலாம்; இங்கு עָמָל உடனான கவிதை இணைப்பும் யோபுவின் துன்பச் சூழலும் ‘துன்பம்’ என்பதை முதன்மைப் பொருளாக ஆதரிக்கின்றன.
- source_word: וּמֵאֲדָמָה
  choice: நிலத்திலிருந்து
  rationale: אֲדָמָה மண் அல்லது விளைநிலத்தைக் குறிக்கிறது; முளைக்கும் உருவகத்துடன் ‘நிலம்’ இயல்பாக இணைகிறது.
- source_word: יִצְמַח
  choice: முளைப்பதில்லை
  rationale: צמח தாவர வளர்ச்சியைக் குறிக்கும் வினை; பூமியிலிருந்து ஒன்று முளைக்கும் வேளாண் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עָמָל
  choice: வருத்தம்
  rationale: இச்சொல் கடின உழைப்பு, பாடு, துயரம் அல்லது வருத்தம் ஆகியவற்றைக் குறிக்கலாம்; இங்கு אָוֶן உடனான இணைப்பில் மனிதன் அனுபவிக்கும் வேதனையைச் சுட்ட ‘வருத்தம்’ பொருத்தமானது.
theological_decisions:
- issue: אָוֶן மற்றும் עָמָל என்பவற்றின் பொருள் வலிமை
  choice: மனிதத் துன்பமும் வருத்தமும் பூமியிலிருந்து தாமாக உருவாவதில்லை என்ற கருத்தாக மொழிபெயர்க்கப்பட்டது.
  alternative: இவற்றை ‘அக்கிரமம்’ மற்றும் ‘துயரம்’ எனக் கொண்டு ஒழுக்கத் தீமையை வலியுறுத்தலாம்.
  rationale: எலிப்பாஸ் துன்பத்தைப் பற்றிப் பேசும் உடனடிச் சூழலும் இரு சொற்களின் பரந்த பொருள் வீச்சும் கருத்தில் கொள்ளப்பட்டன. துன்பத்திற்கான குறிப்பிட்ட ஒழுக்கக் காரணத்தை வசனம் வெளிப்படையாகக் கூறாததால், அதனை மொழிபெயர்ப்பில் சேர்க்காமல் இறையியல் பதற்றம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் அமைக்கப்பட்டுள்ளது. ‘புழுதி—நிலம்’, ‘தோன்றுதல்—முளைத்தல்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் வேளாண் உருவகத்தையும் இணைவாக்கியத்தையும் பாதுகாக்கிறது.
