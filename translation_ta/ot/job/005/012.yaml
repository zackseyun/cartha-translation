  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: ta
  text: 'தந்திரக்காரர்களின் திட்டங்களை அவர் முறியடிக்கிறார்;

    அதனால் அவர்களுடைய கைகள் எந்த வெற்றியையும் அடைவதில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெற்றி” என்பதற்கான எபிரெயச் சொல் திறம்பட்ட செயல், நல்ல பலன் அல்லது நிலையான வெற்றி என்றும் பொருள்படலாம்.
    reason: תּוּשִׁיָּה என்ற அரிதான சொல்லின் உண்மையான பொருள் பரப்பையும் இவ்விடத்தின் மொழிபெயர்ப்பு தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: திட்டங்கள்
  rationale: இச்சொல் எண்ணங்கள், நோக்கங்கள், திட்டங்கள் ஆகியவற்றைக் குறிக்கலாம்; சூழலில் தந்திரக்காரர்கள் செயல்படுத்த நினைக்கும் சூழ்ச்சித் திட்டங்கள் பொருத்தமாக உள்ளன.
- source_word: עֲרוּמִים
  choice: தந்திரக்காரர்கள்
  rationale: இங்கு நேர்மறையான விவேகத்தைவிட வஞ்சகமான சாமர்த்தியம் குறிக்கப்படுவதால், நவீனத் தமிழில் இயல்பான இந்தச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵפֵר
  choice: முறியடிக்கிறார்
  rationale: திட்டங்களை வெறுமனே தடைசெய்வது மட்டுமல்லாமல் அவற்றைப் பயனற்றதாக்கும் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תּוּשִׁיָּה
  choice: வெற்றி
  rationale: இவ்விடத்தில் செயல்திறன் மிக்க பலன் அல்லது வெற்றியைக் குறிக்கிறது; சொல் கொண்டுள்ள ‘திறம்பட்ட விளைவு/நல்ல பலன்’ என்ற பரப்பை அடிக்குறிப்பு சுட்டுகிறது.
theological_decisions:
- issue: தந்திரக்காரர்களின் திட்டங்களைத் தெய்வீகச் செயல் முறியடிப்பது
  choice: எபிரெய உரையின் பொதுவான நிகழ்கால வாக்கியமாகவே மொழிபெயர்க்கப்பட்டது
  alternative: இதை எல்லாக் காலங்களிலும் விதிவிலக்கின்றி நிகழும் முழுமையான வாக்குறுதியாக விரிவுபடுத்துதல்
  rationale: வசனம் எலிப்பாசின் உரையின் ஒரு பகுதி; மொழிபெயர்ப்பு அவனுடைய கூற்றை அதற்கு மேல் கோட்பாட்டு முடிவாக உயர்த்தக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களுடைய கைகள்’ என்பது செயலைச் செய்பவர்களைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; தமிழில் புரியும்படி வாக்கிய அமைப்பு இயல்பாக்கப்பட்டுள்ளது.
