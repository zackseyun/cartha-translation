  rationale: The revision removes unmarked emphasis, renders ‘meet’ more directly as ‘சந்திக்கிறார்கள்,’ and uses the compact, idiomatic comparative ‘இரவைப்போல்.’ The footnote is corrected to give a natural alternative and to retain the explanation of the Hebrew comparative prefix.
