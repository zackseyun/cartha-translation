source:
  edition: WLC
  text: יוֹמָ֥ם יְפַגְּשׁוּ חֹ֑שֶׁךְ וְ֝/כַ/לַּ֗יְלָה יְֽמַשְׁשׁ֥וּ בַֽ/צָּהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: ta
  text: 'பகலில் அவர்கள் இருளைச் சந்திக்கிறார்கள்;

    நண்பகலில், இரவைப்போல் தடவித் தடுமாறுகிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவில் இருப்பதுபோல்.” எபிரெயத்தில் “இரவு” என்பதற்கு முன் ஒப்புமையைக் குறிக்கும் முன்னொட்டு உள்ளது; எனவே அவர்கள் நண்பகலில் இரவு நேரம்போல் தடவித் தடுமாறுகிறார்கள் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: பகலிலேயே
  rationale: பகல் நேரத்தைக் குறிக்கும் வினையடைப் பயன்பாடு. இருளோடு உள்ள முரண்பாட்டை இயல்பான தமிழில் வலுப்படுத்த ‘-ஏ’ சேர்க்கப்பட்டது.
- source_word: יְפַגְּשׁוּ
  choice: எதிர்கொள்கிறார்கள்
  rationale: פגשׁ என்பதன் ‘சந்தித்தல்/எதிர்ப்படுதல்’ என்ற பொருளை இங்கு இயல்பாக வெளிப்படுத்துகிறது; எதிர்பாராத விதமாக இருளைச் சந்திக்கும் படிமத்தையும் காக்கிறது.
- source_word: חֹשֶׁךְ
  choice: இருளை
  rationale: சொல்லின் நேரடியான பொருளையும், ஞான இலக்கியச் சூழலில் இருக்கக்கூடிய உருவக ஆற்றலையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: וְכַלַּיְלָה
  choice: இரவில் இருப்பதுபோல்
  rationale: 'כ என்ற ஒப்புமை முன்னொட்டைக் தெளிவாகக் காட்டுகிறது: நண்பகலாயிருந்தும் இரவில் இருப்பதுபோல் அவர்கள் தடவித் தடுமாறுகிறார்கள்.'
- source_word: יְמַשְׁשׁוּ
  choice: தடவித் தடுமாறுகிறார்கள்
  rationale: משׁשׁ குறிக்கும், காண முடியாமல் கைகளால் தடவித் தேடி நகரும் செயலை இயல்பான தமிழில் படிமத்துடன் தெரிவிக்கிறது.
- source_word: בַצָּהֳרָיִם
  choice: நண்பகலில்
  rationale: நாளின் மிக வெளிச்சமான நடுப்பகுதியைத் துல்லியமாகக் குறித்து, இரவு என்ற படிமத்துடனான கூரிய முரண்பாட்டைக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவ இணைநிலையையும் பகல்/இரவு மற்றும் நண்பகல்/இரவு முரண்பாட்டையும் காக்கும் கண்ணியமான, எளிதில் புரியும் நடை. ‘தடவித் தடுமாறுகிறார்கள்’ என்பது மூலத்தின் உடல் செயற்படிமத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
