source:
  edition: WLC
  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: ta
  text: ஞானிகளை அவர் அவர்களுடைய சூழ்ச்சியிலேயே பிடிக்கிறார்[a]; கோணல் வழியினரின்[b] ஆலோசனை அவசரப்படுத்தப்படுகிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சூழ்ச்சியினாலேயே’ அல்லது ‘தந்திரத்திலேயே’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சில சூழல்களில் மதிநுட்பத்தைக் குறித்தாலும், இங்கு எதிர்மறைப் பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வஞ்சகர்களின்’ அல்லது ‘நேர்மையற்றவர்களின்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அடிப்படையில் ‘முறுக்கப்பட்டவர்கள்’ என்ற உருவகத்தைக் கொண்டது.
    reason: lexical_alternative
  - marker: c
    text: ‘விரைவுபடுத்தப்படுகிறது,’ ‘விரைந்து செல்கிறது,’ அல்லது ‘அவசரமாகத் தள்ளப்படுகிறது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை ஆலோசனை அவசரப்படுத்தப்படுவதைச் சுட்டுகிறது; அதன் தோல்வி முதன்மை உரையில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: பிடிக்கிறார்
  rationale: לכד என்பதன் பிடித்தல் அல்லது அகப்படுத்துதல் என்ற உருவகத்தை இயல்பான நவீனத் தமிழில் தருகிறது. சுற்றியுள்ள பகுதியில் கடவுளே செய்பவராக இருப்பதால் மரியாதை ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: חֲכָמִים
  choice: ஞானிகளை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள பன்மை உரிச்சொல்லை நேரடியாகவும், தம்மை ஞானிகள் எனக் கருதுவோர் பிடிபடுகிறார்கள் என்ற எதிர்மறை நயத்தைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: בְּעָרְמָם
  choice: அவர்களுடைய சூழ்ச்சியிலேயே
  rationale: עָרְמָה சில இடங்களில் மதிநுட்பத்தைக் குறிக்கலாம்; இங்கு எதிர்மறையான ஒழுக்கப் பொருள் உள்ளது. ‘-இலேயே’ என்பது அவர்களின் சொந்தச் சூழ்ச்சியே அவர்கள் பிடிபடும் களமாக அல்லது கருவியாக அமையும் நயத்தை வெளிப்படுத்துகிறது.
- source_word: וַעֲצַת
  choice: ஆலோசனையோ
  rationale: עֵצָה என்பதன் ஆலோசனை அல்லது திட்டம் என்ற பரப்பைத் தக்கவைக்கிறது; ‘-யோ’ இரு கவிதை அடிகளுக்கிடையிலான இணைநிலையை இயல்பாகக் காட்டுகிறது.
- source_word: נִפְתָּלִים
  choice: கோணல் வழியினர்
  rationale: פתל வேரிலுள்ள முறுக்கப்பட்ட அல்லது நேர்மையற்ற தன்மையின் உருவகத்தையும் ஒழுக்கப் பொருளையும் ‘கோணல் வழியினர்’ தக்கவைக்கிறது; வெறும் சிக்கலானவர்கள் என்று நடுநிலைப்படுத்தவில்லை.
- source_word: נִמְהָרָה
  choice: அவசரமாகக் கவிழ்கிறது
  rationale: מהר வேரின் விரைவு அல்லது அவசர இயக்கத்தையும், இச்சூழலில் ஆலோசனை வெற்றியடையாமல் தலைகீழாகும் நயத்தையும் இயல்பான தமிழில் இணைக்கிறது. மூலத்தின் இலக்கண வடிவத்துக்கு நெருக்கமான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: לֹכֵד என்பதன் வெளிப்படையாகச் சொல்லப்படாத எழுவாய்
  choice: ‘அவர்’ என்று வெளிப்படுத்தி, சுற்றியுள்ள சூழலில் செயல்படும் கடவுளைக் குறித்தல்
  alternative: எழுவாயை பொதுப்பொருளில் ‘பிடிப்பவர்’ என மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் இவ்வசனத்துக்குள் எழுவாய் வெளிப்படையாக இல்லை. ஆனால் யோபு 5:9–16 பகுதியில் கடவுளின் செயல்களே தொடர்ச்சியாக விவரிக்கப்படுகின்றன. தமிழ் வாக்கியத்தின் தெளிவுக்காக ‘அவர்’ சேர்க்கப்பட்டது; கடவுளின் பெயர் வசனத்துக்குள் புதிதாகச் சேர்க்கப்படவில்லை.
- issue: עָרְמָה மற்றும் נִפְתָּלִים ஆகியவற்றின் ஒழுக்கப் பொருள்
  choice: ‘சூழ்ச்சி’ மற்றும் ‘கோணல் வழியினர்’ என எதிர்மறையாக மொழிபெயர்த்தல்
  alternative: ‘மதிநுட்பம்’ மற்றும் ‘சிக்கலானவர்கள்’ போன்ற நடுநிலைச் சொற்கள்
  rationale: இணைநிலை அமைப்பும் சூழலும் இங்கு சாதாரண புத்திக்கூர்மையை அல்ல, கடவுளால் முறியடிக்கப்படும் வஞ்சகத் திட்டங்களைக் குறிக்கின்றன.
- issue: נִמְהָרָה குறிக்கும் முடிவு
  choice: ‘அவசரமாகக் கவிழ்கிறது’ என்று, விரைவையும் தோல்வியை நோக்கிய இயக்கத்தையும் வெளிப்படுத்தல்
  alternative: ‘விரைவுபடுத்தப்படுகிறது’ அல்லது ‘அவசரமாக விரட்டப்படுகிறது’ என்று வடிவத்துக்கு இன்னும் நேரடியாக மொழிபெயர்த்தல்
  rationale: மூல வினை முதன்மையாக அவசரப்படுத்தப்படுதல் அல்லது விரைந்து செல்லுதல் என்பதைக் குறிக்கிறது; சூழலில் அந்த ஆலோசனை வெற்றியடைவதற்கு முன்பே முறியடிக்கப்படுவது உட்பொருள். முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கவிதை இணைநிலையைத் தக்கவைக்கும் கண்ணியமான நடை. ‘கோணல் வழியினர்’ மூல உருவகத்தைப் பாதுகாக்கிறது; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
