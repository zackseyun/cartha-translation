  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: ta
  text: ஆகவே ஏழைக்கு நம்பிக்கை உண்டாகிறது; அநீதி தன் வாயை மூடுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
