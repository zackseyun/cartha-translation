    text: அல்லது, “தீச்செயல் தன் வாயை மூடுகிறது”; சொல்லுக்குச் சொல், “அதன் வாய் மூடியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ஆகவே ... உண்டாகிறது
  rationale: வழக்கமாகத் தொடர்விளைவைக் குறிக்கும் wayyiqtol வடிவத்தின் தொடர்பை ‘ஆகவே’ வெளிப்படுத்துகிறது; இங்கு கூறப்படும் பொதுவான விளைவை இயல்பான நிகழ்காலம் தருகிறது.
- source_word: לַדַּל
  choice: ஏழைக்கு
  rationale: דַּל என்பது பொருளாதாரத்தில் ஏழையாகவும் சமூகத்தில் பலவீனமாகவும் இருப்பவரைக் குறிக்கலாம். ‘ஏழை’ என்பது தமிழில் இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: תִּקְוָה
  choice: நம்பிக்கை
  rationale: எதிர்பார்ப்பு அல்லது நம்பிக்கை என்ற பொருள்களில், அநீதி மௌனமாக்கப்படுவதுடன் காணப்படும் முரண்பாட்டுக்கு ‘நம்பிக்கை’ தெளிவாகப் பொருந்துகிறது.
- source_word: וְעֹלָתָה
  choice: அநீதி
  rationale: עַוְלָה அநியாயம், நீதியின்மை, தீச்செயல் ஆகியவற்றைக் குறிக்கிறது. ஏழையின் நிலையைப் பற்றிய சமூகச் சூழலில் ‘அநீதி’ பொருத்தமானது.
- source_word: קָפְצָה פִּיהָ
  choice: தன் வாயை மூடிக்கொள்கிறது
  rationale: எபிரெய உருவகமான ‘அதன் வாய் மூடப்பட்டது/மூடியது’ என்பதைக் காத்து, அநீதி பேச வழியின்றி அடக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அநீதியை மனிதப் பண்புடன் உருவகித்தல்
  choice: ‘அநீதி தன் வாயை மூடிக்கொள்கிறது’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘அநீதி மௌனமாக்கப்படுகிறது’
  rationale: மூலத்தின் உயிருள்ள வாயுருவகத்தையும் அதன் திட்டமிட்ட தெளிவின்மையையும் நேரடியாகப் பாதுகாக்கிறது; குறிப்பிட்ட இறையியல் காரணத்தை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. ‘ஆகவே’ முந்தைய சூழலின் விளைவுத் தொடர்பைச் சுட்டுகிறது; ‘தன் வாயை மூடிக்கொள்கிறது’ மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
