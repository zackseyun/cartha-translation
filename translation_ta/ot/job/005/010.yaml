  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: ta
  text: 'பூமியின்மேல்[a] மழையை அளிப்பவரும்,

    திறந்த வெளிகளின்மேல்[b] நீரை அனுப்புகிறவருமானவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலத்தின்மேல்.’ எபிரெயச் சொல் אֶרֶץ சூழலுக்கேற்ப ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தெருக்களின்மேல்’ அல்லது ‘நாட்டுப்புறத்தின்மேல்.’ எபிரெயச் சொல் חוּצוֹת திறந்த இடங்கள், தெருக்கள் அல்லது பரந்த வெளிப்புறப் பகுதிகளைக் குறிக்கலாம்; இங்கு சூழல் திறந்த வெளிகளைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: அளித்து … அனுப்புகிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்புவினை, முந்தைய வசனத்தில் தொடங்கிய கடவுளைப் பற்றிய விளக்கத்தைத் தொடர்கிறது. தமிழில் இயல்பாக அமைய, இணையான இரு செயல்களையும் முடிவிலுள்ள ‘அனுப்புகிறவர்’ என்பதுடன் இணைத்துள்ளோம்.
- source_word: מָטָר
  choice: மழை
  rationale: மழைப்பொழிவைக் குறிக்கும் பொதுவான, இயல்பான தமிழ் சொல்.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: பூமியின் பரப்பின்மேல்
  rationale: ‘பூமி/நிலத்தின் முகம் அல்லது மேற்பரப்பின்மேல்’ என்ற உருவகத்தையும், இரண்டாம் அடியுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: וְשֹׁלֵחַ
  choice: அனுப்புகிறவர்
  rationale: முதல் பங்கேற்புவினைக்கு இணையாக நிற்கும் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַיִם
  choice: நீர்
  rationale: எபிரெயத்தில் வடிவியல் பன்மையாக இருந்தாலும், இச்சூழலில் தமிழின் இயல்பான திரள்பெயரான ‘நீர்’ பொருத்தமானது.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: திறந்த வெளிகளின் பரப்பின்மேல்
  rationale: חוּצוֹת என்பது திறந்த இடங்கள், தெருக்கள் அல்லது பரந்த வெளிப்புறப் பகுதிகளைக் குறிக்கலாம். மழை மற்றும் பூமி பற்றிய இயற்கைச் சூழலில் ‘திறந்த வெளிகள்’ பொருத்தமானது; ‘பரப்பின்மேல்’ என்பது முதல் அடியின் இணை அமைப்பைப் பேணுகிறது.
theological_decisions:
- issue: אֶרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: இவ்வசனம் ஒரு குறிப்பிட்ட பிரதேசத்தைவிட, மழையையும் நீரையும் வழங்கும் கடவுளின் பொதுவான பராமரிப்பைப் பேசுவதாகத் தோன்றுகிறது. இருப்பினும் ‘நிலம்’ என்பதும் சொல்லின் உண்மையான பொருள் வாய்ப்பாக அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பரப்பின்மேல்’ என்ற மீளுரை எபிரெய மூலத்தின் இணை அமைப்பையும் ‘முகம்/மேற்பரப்பு’ உருவகத்தையும் இயன்றவரை இயல்பாகப் பேணுகிறது.
