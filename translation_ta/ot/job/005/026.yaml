source:
  edition: WLC
  text: תָּב֣וֹא בְ/כֶ֣לַח אֱלֵי קָ֑בֶר כַּ/עֲל֖וֹת גָּדִ֣ישׁ בְּ/עִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: ta
  text: 'வாழ்வின் முழு நிறைவில்[a] நீ கல்லறையை அடைவாய்;

    உரிய காலத்தில் தானியக் குவியல் எடுத்துச் சேர்க்கப்படுவது போல்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முதிர்ந்த வயதில்.’ כֶּלַח என்ற எபிரெயச் சொல் அரிதானது; அது முதிர்ந்த வயதையோ, வாழ்வின் முழுமை அல்லது வலிமையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தானிய அடுக்கு தன் பருவத்தில் எடுத்துச் சேர்க்கப்படுவது போல்.’ இந்த எபிரெய வேளாண் உருவகம், ஒருவர் உரிய காலத்தில் இறப்பதை முற்றிய தானியம் அறுவடை செய்து சேர்க்கப்படுவதோடு ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: அடைவாய்
  rationale: בוא என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை முற்றா வினை வடிவம் இங்கு எதிர்காலப் பொருள் தருகிறது. கல்லறையை நோக்கிய நகர்வை நவீனத் தமிழில் இயல்பாகச் சொல்ல ‘அடைவாய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְכֶלַח
  choice: நிறைந்த வாழ்வாற்றலோடு
  rationale: כֶּלַח அரிதானதும் பொருள் விவாதத்திற்குரியதுமான சொல். அது முதிர்ந்த வயதையோ முழுமைபெற்ற வலிமையையோ குறிக்கலாம். முதுமை என்ற ஒரே பொருளைத் தீர்மானிக்காமல், வாழ்வு உரிய நிறைவை அடைந்த நிலையையும் ஆற்றலையும் வெளிப்படுத்த இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלֵי קָבֶר
  choice: கல்லறையை
  rationale: אֱלֵי திசை அல்லது இலக்கைக் குறிக்கிறது; קֶבֶר புதைக்கப்படும் கல்லறையைக் குறிக்கிறது. தமிழ் வேற்றுமை உருபின் மூலம் ‘கல்லறையை அடைவாய்’ என்று இயல்பாக வழங்கப்பட்டது.
- source_word: כַּעֲלוֹת
  choice: சேர்க்கப்படுவதுபோல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது. עלה என்பதன் பெயரெச்ச வினைவடிவம் இவ்வேளாண் உருவகத்தில் அறுவடை செய்யப்பட்ட தானியம் எடுத்துக் கொண்டுவரப்பட்டு குவிக்கப்படுவதைச் சுட்டுகிறது. தமிழில் உருவகம் தெளிவாக இருக்க ‘சேர்க்கப்படுவதுபோல்’ என வழங்கப்பட்டது.
- source_word: גָּדִישׁ
  choice: தானியக் குவியல்
  rationale: גָּדִישׁ என்பது வெட்டப்பட்ட தானியத்தின் குவியல் அல்லது அடுக்கைக் குறிக்கிறது. ‘தானியக் குவியல்’ எபிரெய வேளாண் படிமத்தைத் துல்லியமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בְּעִתּוֹ
  choice: தன் பருவத்தில்
  rationale: இந்தச் சொல் அதற்குரிய அல்லது ஏற்ற நேரத்தைக் குறிக்கிறது. ‘தன் பருவத்தில்’ என்பது உரிய காலம் என்ற கருத்தையும் வேளாண் உருவகத்தையும் ஒருங்கே காக்கிறது.
