  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. அரிதான כֶּלַח சொல்லின் பொருள் பிரதான உரையில் மிகையாகத் தீர்மானிக்கப்படாமல், அதன் முக்கிய மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இரண்டாம் அடியில் எபிரெய வேளாண் உருவகமும் ‘உரிய காலம்’ என்ற நுணுக்கமும் காக்கப்பட்டுள்ளன.
