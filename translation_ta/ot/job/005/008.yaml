revisions:
- from: ஆனால் நானோ கடவுளை நாடுவேன்; கடவுளிடமே என் வழக்கை எடுத்துரைப்பேன்.
  to: ஆனால், நானோ கடவுளை நாடுவேன்; கடவுளிடம் என் காரியத்தை[a] முன்வைப்பேன்.
  rationale: The revision retains the contrast, emphasis, divine-name parallelism, and volitional force of the Hebrew. It replaces the narrower and more explanatory ‘என் வழக்கை எடுத்துரைப்பேன்’ with ‘என் காரியத்தை முன்வைப்பேன்,’ which more directly represents placing one’s matter before God. The footnote records ‘வழக்கு’ as a contextually valid alternative without imposing it on the main text.
