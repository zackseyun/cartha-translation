lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: ஆனால் நானோ
  rationale: אוּלָם என்பதன் மாறுபாட்டையும் தனியே கூறப்பட்ட אֲנִי என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֶדְרֹשׁ
  choice: நாடுவேன்
  rationale: இச்சூழலில் கடவுளைத் தேடி அவரிடம் விசாரிக்க அல்லது முறையிடத் திரும்பும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵל / אֱלֹהִים
  choice: கடவுள்
  rationale: இரண்டும் ஒரே தெய்வீகக் குறிப்பை இணைநிலையாகக் கூறுகின்றன; தமிழில் ஒரே சொல்லைப் பயன்படுத்துவது கவிதை இணைநிலையைக் காக்கிறது.
- source_word: אָשִׂים דִּבְרָתִי
  choice: என் வழக்கை எடுத்துரைப்பேன்
  rationale: சொல்லாட்சியில் ‘என் காரியத்தை வைப்பேன்’ என்றாலும், கடவுள்முன் தனது விவகாரத்தை முன்வைக்கும் நீதிமன்ற அல்லது முறையீட்டுச் சாயலைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵל மற்றும் אֱלֹהִים என்னும் இரு தெய்வீகப் பெயர்களின் இணைநிலை
  choice: இரண்டையும் ‘கடவுள்’ என்று மொழிபெயர்த்தல்
  alternative: முதலாவதை ‘வல்லமையுள்ள கடவுள்’ என்றும் இரண்டாவதை ‘கடவுள்’ என்றும் வேறுபடுத்துதல்
  rationale: இங்கு இரு வேறு தெய்வீக நபர்களையோ தனித்த பண்புகளையோ வேறுபடுத்துவது நோக்கமல்ல; ஒரே கடவுளைக் குறிக்கும் கவிதை இணைநிலையே முதன்மையானது.
- issue: דִּבְרָתִי என்பதன் நீதிமன்றச் சாயல்
  choice: என் வழக்கு
  alternative: என் காரியம் / என் முறையீடு / என் சொற்கள்
  rationale: ‘வழக்கு’ என்பது கடவுளிடம் தன் விவகாரத்தை முன்வைக்கும் சாயலைக் காக்கிறது; அதை வெறும் புகார் என்று குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான கவிதைநடை. ‘நானோ’ என்பது எலிப்பாசின் தன்வலியுறுத்தலையும் முன்சொல்லுடன் உள்ள மாறுபாட்டையும் இயல்பாகக் காட்டுகிறது.
