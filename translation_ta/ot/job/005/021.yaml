source:
  edition: WLC
  text: בְּ/שׁ֣וֹט לָ֭שׁוֹן תֵּחָבֵ֑א וְֽ/לֹא תִירָ֥א מִ֝/שֹּׁ֗ד כִּ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: ta
  text: 'நாவின் சாட்டையிலிருந்து[a] நீ மறைக்கப்படுவாய்;

    அழிவு[b] வரும்போது நீ அஞ்சமாட்டாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நாவின் சாட்டை”; இது கொடுஞ்சொல் அல்லது பழிச்சொல் தாக்குதலைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: “அழிவு” என்பதற்கு “பாழாக்குதல்” அல்லது “நாசம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: நாவின் சாட்டையிலிருந்து
  rationale: שׁוֹט என்பது நேரடியாகச் ‘சாட்டை’ அல்லது ‘சவுக்கு’ என்பதைக் குறிக்கிறது; לָשׁוֹן உடன் சேர்ந்து பழிச்சொல் அல்லது கொடுஞ்சொல் தாக்குதலைக் குறிக்கும் உயிரோட்டமான உருவகமாக அமைகிறது. தமிழிலும் ‘நாவின் சாட்டை’ அந்த உருவகத்தை இயல்பாகத் தக்கவைக்கிறது. பாதுகாப்பைக் குறிக்கும் சூழலால் ‘-இலிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: תֵּחָבֵא
  choice: நீ மறைக்கப்படுவாய்
  rationale: חבא வினையின் நிஃபால் வடிவம் மறைக்கப்படுதல் அல்லது பார்வைக்கு அப்பால் வைக்கப்படுதல் என்ற செயல்பாட்டைத் தருகிறது. ‘மறைக்கப்படுவாய்’ என்பது பாதுகாக்கப்படுதல் என்ற பொருளை விளக்கமாகச் சேர்க்காமல், எபிரெய வடிவத்துக்கு நெருக்கமாக உள்ளது.
- source_word: וְלֹא תִירָא
  choice: நீ அஞ்சமாட்டாய்
  rationale: மறுப்பு வினைவடிவத்தின் வருங்கால உறுதியை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அஞ்ச வேண்டியதில்லை’ என்று கடமையின்மையாக மாற்றவில்லை.
- source_word: מִשֹּׁד
  choice: அழிவு
  rationale: שֹׁד என்பது வன்மையான அழிவு, பாழாக்குதல் அல்லது நாசத்தைக் குறிக்கலாம். ‘அழிவு’ தெளிவானதும் அதன் பொருள் வீச்சைத் தக்கவைத்துக்கொள்வதுமாகும்.
- source_word: כִּי יָבֹוא
  choice: வரும்போது
  rationale: இச்சூழலில் כִּי காலத்தைக் குறிக்கும் இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது. அழிவு வரும் நேரத்திலும் அஞ்சாமையை இது இயல்பாக வெளிப்படுத்துகிறது.
