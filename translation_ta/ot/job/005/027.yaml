revisions:
- from: இதோ, இதை நாங்கள் ஆராய்ந்து அறிந்தோம்; இது உண்மை. இதைக் கேள்; நீயும் இதை உனக்காக அறிந்துகொள்.
  to: இதோ, இதை நாங்கள் ஆராய்ந்து கண்டறிந்தோம்; இது அப்படியே உள்ளது. இதைக் கேள்; நீயே இதை அறிந்துகொள்.
  rationale: The revision removes the unsupported additive nuance in «நீயும்», retains the personal emphasis of אַתָּה with «நீயே», and renders כֵּן הִיא more closely as «இது அப்படியே உள்ளது». No footnotes are needed.
