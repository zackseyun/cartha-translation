  text: הִנֵּה זֹ֭את חֲקַרְנ֥וּ/הָ כֶּֽן הִ֑יא שְׁ֝מָעֶ֗/נָּה וְ/אַתָּ֥ה דַֽע לָֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: ta
  text: இதோ, இதை நாங்கள் ஆராய்ந்து கண்டறிந்தோம்; இது அப்படியே உள்ளது. இதைக் கேள்; நீயே இதை அறிந்துகொள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲקַרְנוּהָ
  choice: இதை நாங்கள் ஆராய்ந்து அறிந்தோம்
  rationale: חקר என்பதன் ஆராய்ந்து கண்டறிதல் என்ற பொருளையும், பெண்பால் பின்னொட்டு குறிக்கும் முந்தைய கூற்றையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֶּן הִיא
  choice: இது உண்மை
  rationale: ‘அது அப்படியே இருக்கிறது / அது உறுதி’ என்ற உறுதிப்பாட்டைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: שְׁמָעֶנָּה
  choice: இதைக் கேள்
  rationale: பெண்பால் ஒருமை பொருள் பின்னொட்டுடன் வரும் கட்டளையை, முன்சொன்ன செய்தியைக் குறிக்கும் ‘இதை’ என்பதுடன் வெளிப்படுத்துகிறது.
- source_word: וְאַתָּה דַע לָךְ
  choice: நீயும் இதை உனக்காக அறிந்துகொள்
  rationale: வலியுறுத்தப்பட்ட אַתָּה என்பதற்கு ‘நீயும்’ என்றும், לָךְ என்பதற்கு தனிப்பட்ட ஏற்றுக்கொள்ளல்/பயன் சார்ந்த ‘உனக்காக’ என்றும் இடமளிக்கிறது; மூலத்தின் சற்றே திறந்த பொருளை முற்றிலும் ‘நீயே தீர்மானி’ என மாற்றவில்லை.
theological_decisions:
- issue: எலிப்பாசின் முடிவுரையின் உண்மை உரிமைகோரல்
  choice: ‘இது உண்மை’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘அது அப்படியே உள்ளது’
  rationale: பேச்சாளரின் உறுதியான உரிமைகோரலைப் பாதுகாக்கிறது; ஆனால் அதை உரையாசிரியரின் இறுதி மதிப்பீடாக கூடுதலாக உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எலிப்பாசின் நேரடியானவும் வலியுறுத்தலானவும் உள்ள முடிவுரையை கண்ணியமான ஒருமை கட்டளை நடையில் வழங்குகிறது. வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
