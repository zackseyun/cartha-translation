  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: ta
  text: 'அழிவிலும் பஞ்சத்திலும் நீ சிரிப்பாய்;

    நிலத்தின் காட்டு விலங்குகளுக்கு அஞ்சமாட்டாய்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தின் காட்டு விலங்குகளுக்கு அஞ்சாதே.” எபிரெய வடிவத்தைத் தடைக் கட்டளையாகவும் வாசிக்கலாம்; ஆனால் இச்சூழலில் அது பாதுகாப்பைக் குறித்த வாக்குறுதியாகச் செயல்படுவதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: அழிவு
  rationale: வன்முறையால் ஏற்படும் பேரழிவு அல்லது நாசத்தைக் குறிக்கும் சொல்லாகும். இணையாக வரும் ‘பஞ்சம்’ என்பதுடன் இயல்பாகப் பொருந்துகிறது.
- source_word: כָּפָן
  choice: பஞ்சம்
  rationale: கடுமையான உணவுப் பற்றாக்குறையையும் அதனால் உண்டாகும் பட்டினியையும் குறிக்கிறது; இங்கு ஒரு பொதுப் பேரிடராகக் கூறப்படுவதால் ‘பஞ்சம்’ பொருத்தமானது.
- source_word: תִּשְׂחָק
  choice: நீ சிரிப்பாய்
  rationale: அச்சமின்மையையும் சில வேளைகளில் ஏளனத்தையும் உணர்த்தக்கூடிய உருவகத்தை, கூடுதல் விளக்கம் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: நிலத்தின் காட்டு விலங்குகளுக்கு
  rationale: חַיָּה இச்சூழலில் பொதுவாகக் காட்டு விலங்குகளைக் குறிக்கிறது. הָאָרֶץ என்பதற்கு இங்கு ‘நிலம்’ என்பது இயல்பானதும் கவிதைநடைக்கு ஏற்றதுமான தேர்வு.
- source_word: אַל תִּירָא
  choice: அஞ்சமாட்டாய்
  rationale: אַל உடன் வரும் முற்றுப்பெறா வினை பொதுவாகத் தடைக் கட்டளையாக அமையலாம். எனினும், சுற்றியுள்ள வாக்குறுதிகளின் தொடரிலும் முந்தைய ‘நீ சிரிப்பாய்’ என்பதற்கு இணையாகவும் இது பாதுகாப்பைக் குறிக்கும் உறுதிமொழியாகப் புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: אַל תִּירָא என்பதன் வாக்கிய வலிமை
  choice: 'வாக்குறுதி சார்ந்த உறுதி: ‘அஞ்சமாட்டாய்’'
  alternative: 'தடைக் கட்டளை: ‘அஞ்சாதே’'
  rationale: எலிப்பாஸ் கூறும் பாதுகாப்பு மற்றும் ஆசீர்வாத வாக்குறுதிகளின் தொடருக்கு உறுதிமொழி வாசிப்பு நன்கு பொருந்துகிறது. அதேவேளை, எபிரெய வடிவத்தில் உள்ள உண்மையான தடைக் கட்டளை வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், கவிதைநடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘கண்டு’ என்பது பேரிடர்களை அச்சமின்றி எதிர்கொள்வது என்ற எபிரெய உருவகத்தை தமிழில் இயல்பாக இணைக்கிறது.
