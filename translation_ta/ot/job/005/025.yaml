  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: ta
  text: உன் சந்ததி[a] ஏராளமாக இருப்பதையும், உன் வழித்தோன்றல்கள் பூமியின்[b] புல்லைப்போல் இருப்பதையும் நீ அறிவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் விதை’; எபிரெயச் சொல் זַרְעֶךָ வழிவருவோரைக் குறிக்கும் ஒரு தொகுப்புச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலத்தின் புல்லைப்போல்’; எபிரெயச் சொல் אֶרֶץ சூழலைப் பொறுத்து ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: நீ அறிவாய்
  rationale: இணைப்புடன் வந்துள்ள Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், இக்கவிதைச் சூழலில் எதிர்கால உறுதியைத் தருகிறது; தமிழில் ‘நீ அறிவாய்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: כִּי
  choice: என்றும்
  rationale: அறியப்படும் செய்தியை அறிமுகப்படுத்துவதால், தமிழின் மேற்கோள் அமைப்பில் ‘என்றும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: רַב
  choice: பெருகியிருக்கும்
  rationale: ஒருமைத் தொகுப்புப்பெயரான זֶרַע உடன் இது மிகுதி அல்லது ஏராளத்தைக் குறிக்கிறது; ‘பெருகியிருக்கும்’ சந்ததியின் எண்ணிக்கை மிகுந்திருப்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: זַרְעֶךָ
  choice: உன் சந்ததி
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘விதை’; இங்கு குடும்ப வழிவருவோரைக் குறிக்கும் தொகுப்புப்பெயராக இருப்பதால் ‘சந்ததி’ பொருத்தமானது.
- source_word: וְצֶאֱצָאֶיךָ
  choice: உன் வழித்தோன்றல்கள்
  rationale: ஒருவரிடமிருந்து பிறக்கும் பிந்தைய தலைமுறையினரைக் குறிக்கிறது; முந்தைய ‘சந்ததி’ என்பதிலிருந்து சொல்வேறுபாட்டையும் கவிதை இணைநிலையையும் காக்கிறது.
- source_word: כְּעֵשֶׂב
  choice: புல்லைப்போல்
  rationale: செழித்து ஏராளமாக வளரும் தாவரத்தை ஒப்புமையாகக் காட்டுகிறது; ‘புல்லைப்போல்’ தெளிவான நவீனத் தமிழ்.
- source_word: הָאָרֶץ
  choice: பூமியின்
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படலாம்; இங்குள்ள பரந்த மிகுதி ஒப்புமைக்கு ‘பூமி’ பொருந்துகிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
