source:
  edition: WLC
  text: לָ/שׂ֣וּם שְׁפָלִ֣ים לְ/מָר֑וֹם וְ֝/קֹדְרִ֗ים שָׂ֣גְבוּ יֶֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: ta
  text: 'தாழ்ந்தவர்களை உயரத்தில் வைக்கிறார்;

    துயரால் இருண்டுபோனவர்கள்[a] மீட்புக்கு[b] உயர்த்தப்படுகிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துயருற்றவர்கள்’ அல்லது ‘துக்கங்கொண்டவர்கள்.’ எபிரெயச் சொல் இருள் என்ற உருவகத்தின் வழியாகத் துயரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விடுதலைக்கு’ அல்லது ‘பாதுகாப்புக்கு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: வைக்கிறார்
  rationale: שׂוּם என்பதன் ‘வை/நிறுத்து’ என்ற அடிப்படை வினைப்பொருளைப் பாதுகாக்கிறது. எபிரெயத்தில் இது முன்சூழலுடன் இணைந்த நோக்கம்/விளைவு சார்ந்த வினையெச்சமாக இருந்தாலும், வசனத்தை இயல்பான நவீனத் தமிழில் வாசிக்க இறைவனை உணர்த்தும் முற்றுவினையாக வழங்கப்பட்டுள்ளது.
- source_word: שְׁפָלִים
  choice: தாழ்ந்தவர்களை
  rationale: சமூக நிலை, வாழ்க்கைச் சூழல், அல்லது ஒடுக்கப்பட்ட நிலை ஆகியவற்றால் தாழ்த்தப்பட்டவர்களையும் குறிக்கக்கூடிய சொல்லாகும்; ‘தாழ்மையானவர்கள்’ என்று மொழிபெயர்த்து இதை ஒழுக்கப் பண்பாக மட்டும் சுருக்கவில்லை.
- source_word: לְמָרוֹם
  choice: உயரத்தில்
  rationale: מָרוֹם என்பதிலுள்ள உயரம்/உயர்ந்த இடம் என்ற இடவியல் உருவகத்தைக் காக்கிறது; ‘தாழ்ந்தவர்கள்’ என்பதற்கு நேரான எதிரிணையாகவும் அமைகிறது.
- source_word: וְקֹדְרִים
  choice: துயரால் இருண்டுபோனவர்கள்
  rationale: קדר என்பதில் இருள், சோகம், துக்கம் ஆகியவை ஒன்றோடொன்று பின்னியுள்ளன. ‘துயருற்றவர்கள்’ என்ற அனுபவப் பொருளையும் ‘இருண்டுபோனவர்கள்’ என்ற மூல உருவகத்தையும் இச்சொற்றொடர் ஒருங்கே பாதுகாக்கிறது.
- source_word: שָׂגְבוּ
  choice: உயர்த்தப்படுகிறார்கள்
  rationale: உயர்ந்த அல்லது எட்டமுடியாத பாதுகாப்பான நிலையில் இருப்பதைக் குறிக்கும் வினை. முதல் அடியின் உயர்வு உருவகத்துடன் இணக்கத்தைப் பேணுகிறது; சூழலில் செய்பவர் இறைவன் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֶשַׁע
  choice: மீட்புக்கு
  rationale: יֶשַׁע குறிக்கும் மீட்பு, விடுதலை, பாதுகாப்பு ஆகிய பரப்பை ‘மீட்பு’ நன்றாகத் தாங்குகிறது; பிற்காலக் கோட்பாட்டு அர்த்தத்தை மட்டும் இதன்மேல் சுமத்தவில்லை.
theological_decisions:
- issue: ஞான இலக்கியச் சூழலில் יֶשַׁע என்பதன் பொருள்
  choice: மீட்பு
  alternative: விடுதலை அல்லது பாதுகாப்பு
  rationale: இங்கு உடனடியான ஆபத்திலிருந்து காப்பாற்றப்படுதல் முதன்மையாக இருக்கலாம்; ஆயினும் எபிரெயச் சொல்லின் விரிந்த மீட்புப் பொருளைத் திறந்தவாறே வைத்திருக்க ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது.
- issue: שָׂגְבוּ வினையில் இறைச் செயலின் வெளிப்பாடு
  choice: உயர்த்தப்படுகிறார்கள்
  alternative: உயர்கிறார்கள்
  rationale: எபிரெய Qal வடிவம் நிலை/விளைவைக் கூறினாலும், இணை அமைப்பில் தாழ்ந்தவர்களை உயரத்தில் வைப்பவர் இறைவன். தமிழ் செயப்பாட்டு வடிவம் அந்தச் சூழல்சார் தொடர்பை வெளிப்படுத்துகிறது; அதேவேளை உயர்வு எவ்வகையானது என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான கவிதை இணை அமைப்பு பேணப்பட்டுள்ளது. ‘துயரால் இருண்டுபோனவர்கள்’ என்பது மூலத்தின் இருள்–துக்கம் இரட்டைப் பொருளை வாசகருக்குப் புரியும் முறையில் தக்கவைக்கிறது. இறைச் செயலைக் குறிக்கும் மரியாதை ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
