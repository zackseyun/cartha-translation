review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the violent, repeated assault in יִפְרְצֵנִי ... פֶּרֶץ עַל־פְּנֵי פָרֶץ and the hostile advance of יָרוּץ עָלַי. However, “உடைப்பின்மேல் உடைப்பாக உடைத்துப்போடுகிறார்” is not idiomatic Tamil and obscures the sense of repeated breaches. The revision renders the succession clearly while retaining the forceful image.
  naturalness: “ஒன்றன்பின் ஒன்றாக உடைத்தெறிகிறார்” is natural modern Tamil poetic prose. “போர்வீரனைப்போல் என்மேல் பாய்கிறார்” is clear and appropriately forceful.
  terminology: “போர்வீரன்” is a suitable modern equivalent for גִּבּוֹר in this martial context. No theological terminology is involved.
