translation:
  language: ta
  text: அவர் என்னை ஒன்றன்பின் ஒன்றாக உடைத்தெறிகிறார்; போர்வீரனைப்போல் என்மேல் பாய்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: என்னை உடைத்துப்போடுகிறார்
  rationale: פרץ என்பதன் வன்மையான உடைத்தல் அல்லது பிளத்தல் என்ற படிமத்தையும், முதலாம் நபர் ஒருமை பின்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: உடைப்பின்மேல் உடைப்பாக
  rationale: மூலத்தின் திரும்பச்சொல்லலையும், ஒன்றன்பின் ஒன்றாக அல்லது ஒன்றின்மேல் ஒன்றாகக் குவியும் அழிவின் படிமத்தையும் பாதுகாக்கிறது.
- source_word: יָרוּץ עָלַי
  choice: என்மேல் பாய்கிறார்
  rationale: வேகமான, பகைமையான முன்னேற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘ஓடுகிறார்’ என்பதைவிட சூழலின் தாக்குதல் உணர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְגִבּוֹר
  choice: ஒரு போர்வீரனைப்போல்
  rationale: גבור என்பதன் வலிமைமிக்க போராளி என்ற பொருள் இங்குள்ள தாக்குதல் படிமத்துக்கு ஏற்றதாக உள்ளது.
