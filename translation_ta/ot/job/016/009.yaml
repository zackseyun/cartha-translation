base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: ta
  text: அவருடைய கோபம் என்னைக் கிழித்துப்போட்டது; அவர் என்னைப் பகைத்தார். அவர் என்னை நோக்கிப் பற்களைக் கடிக்கிறார்; என் எதிரி எனக்கு எதிராகத் தனது கண்களைக் கூர்மையாக்குகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்றாக: “என் எதிரி தன் கண்களைக் கூர்தீட்டுகிறான்.” எபிரெயில் சொல்லுக்குச் சொல், “தன் கண்களைக் கூர்மையாக்குகிறான்.” இது பகைமையுடன் கூர்ந்து உற்றுநோக்குவதைச் சித்தரிக்கும் உருவகம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפּוֹ
  choice: அவருடைய கோபம்
  rationale: אַף என்பதன் அடிப்படைப் பொருள் ‘மூக்கு’; ஆனால் இங்கு அது கோபத்தைக் குறிக்கும் வழக்குச் சொல். நவீனத் தமிழில் ‘கோபம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: טָרַף
  choice: என்னைக் கிழித்துப்போட்டது
  rationale: இவ்வினை இரையை ஒரு கொடிய விலங்கு கிழிப்பதைப் போன்ற வலுவான கவித்துவப் படிமத்தைத் தருகிறது. ‘கிழித்துப்போட்டது’ அந்தக் கொடூரத்தையும் அதன் விளைவையும் தக்கவைக்கிறது.
- source_word: וַיִּשְׂטְמֵנִי
  choice: அவர் என்னைப் பகைத்தார்
  rationale: שׂטם பகைமை அல்லது வெறுப்பைக் குறிக்கிறது. ‘பகைத்தார்’ என்பது தாக்குதல் போன்ற கூடுதல் செயலைப் புகுத்தாமல் அந்தப் பகைமையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: எனக்கு எதிராகத் தமது பற்களைக் கடிக்கிறார்
  rationale: கோபத்தில் பற்களைக் கடித்தல் என்ற எபிரெயப் படிமத்தையும் עָלַי-இன் எதிர்நிலையையும் இச்சொற்றொடர் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: צָרִי
  choice: என் எதிரி
  rationale: இச்சொல் பகைமை கொண்ட எதிராளியைக் குறிக்கிறது. அது தேவனா, மனித எதிரியா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: எனக்கு எதிராகத் தன் கண்களைக் கூர்மையாக்குகிறான்
  rationale: לטש என்பதன் ‘கூர்மையாக்குதல்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, பகைமையுடன் உற்றுநோக்கும் அசாதாரண எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பகைமையுடன் செயல்படும் ஒருமை ஆண்பால் குறிப்பின் அடையாளம்
  choice: மூலத்தில் உள்ள ஒருமை குறிப்புகளைத் தக்கவைத்து, அந்த நபர் யார் என்று பெயரிட்டு அடையாளப்படுத்தவில்லை.
  alternative: அவரை நேரடியாக தேவன் என்றோ ஒரு மனித எதிரி என்றோ குறிப்பிடுதல்.
  rationale: இவ்வசனம் செய்பவரை வெளிப்படையாக மீண்டும் பெயரிடவில்லை. ஆகவே தேவன் யோபுக்கு எதிரியாகச் செயல்படுகிறார் என்ற கவித்துவப் பதற்றத்தையோ, வேறு எதிரிக்கான சாத்தியத்தையோ மொழிபெயர்ப்பு மறைமுகமாகத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் மூலத்தின் கொடிய விலங்கு மற்றும் கூர்மையான பார்வை ஆகிய படிமங்களையும் தக்கவைக்கும் நடை. முதல் குறிப்புக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், ‘என் எதிரி’ என்ற பெயர்ச்சொல்லோடு இயல்பான ஒருமை வினை அமைக்கப்பட்டுள்ளது; செய்பவரின் அடையாளம் வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை.
