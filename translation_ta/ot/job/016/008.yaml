  text: וַֽ֭/תִּקְמְטֵ/נִי לְ/עֵ֣ד הָיָ֑ה וַ/יָּ֥קָם בִּ֥/י כַ֝חֲשִׁ֗/י בְּ/פָנַ֥/י יַעֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: ta
  text: நீர் என்னைச் சுருக்கிப்போட்டீர்—அதுவே சாட்சியாகிவிட்டது; என் மெலிவு எனக்கு எதிராக எழுந்து, என் முகத்துக்கு நேராகப் பதிலளிக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: என்னைச் சுருக்கிப்போட்டீர்
  rationale: קמט என்பதன் அடிப்படை உணர்வான சுருங்கச் செய்தல்/சுருக்கமடையச் செய்தலைக் காக்கிறது; யோபின் உடல் வாடிப்போன நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעֵד הָיָה
  choice: அதுவே சாட்சியாகிவிட்டது
  rationale: எபிரெய உரையில் வெளிப்படையாகக் குறிப்பிடப்படாத எழுவாயைத் தீர்மானிக்காமல், முன்சொல்லப்பட்ட சுருக்கப்பட்ட நிலையை நோக்கிச் செல்லும் நடுநிலைச் சுட்டை பயன்படுத்துகிறது.
- source_word: כַחֲשִׁי
  choice: என் மெலிவு
  rationale: כחש இங்கு உடல் இளைத்தல் அல்லது மெலிந்த தோற்றம் என்ற பொருளில் உள்ளது; ‘மெலிவு’ அந்த உடல்சார் சாட்சியைக் குறுகிய, இயல்பான தமிழில் தருகிறது.
- source_word: יַעֲנֶה
  choice: பதிலளிக்கிறது
  rationale: ענה என்பதன் நேரடியான ‘பதில் கூறுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘சாட்சியளிக்கிறது’ என்று மாற்றி சட்டவியல் பொருளை மிகைப்படுத்தவில்லை.
- source_word: בְּפָנַי
  choice: என் முகத்துக்கு நேராக
  rationale: ‘என் முகத்திற்கு முன்பாக/எதிரே’ என்ற மோதலான நுண்ணுணர்வைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சாட்சியின் எழுவாய்
  choice: ‘அதுவே’ என நடுநிலையாக வைக்கப்பட்டது
  alternative: ‘என் சுருக்கமடைந்த உடலே’ அல்லது ‘நீர் என்னைப் பற்றிக்கொண்டதே’
  rationale: היה என்பதன் ஆண்பால் எழுவாய் உரையில் வெளிப்படையாக இல்லை; குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: மெலிவு பேசும் உருவகம்
  choice: ‘பதிலளிக்கிறது’ என்ற நேரடி உருவகம்
  alternative: ‘சாட்சியளிக்கிறது’
  rationale: முன்னுள்ள ‘சாட்சி’ என்ற சொல்லோடு தொடர்பு இருந்தாலும், יענה என்பதன் தனித்த வினைச்சொல் உருவகத்தை அப்படியே வைத்திருப்பது மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபின் குற்றச்சாட்டு நிறைந்த கவித்துவத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடை. மரியாதை ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; வாக்கியத்தின் உருவக அடர்த்தியும் மூலத்தின் தெளிவின்மையும் தேவையின்றி விரிவாக்கப்படவில்லை.
