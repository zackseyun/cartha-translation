  text: אִֽם אֲ֭דַבְּרָה לֹא יֵחָשֵׂ֣ךְ כְּאֵבִ֑/י וְ֝/אַחְדְּלָ֗ה מַה מִ/נִּ֥י יַהֲלֹֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: ta
  text: நான் பேசினால், என் வேதனை தணியாது; நான் பேசாமல் இருந்தால், என்னைவிட்டு என்ன நீங்கும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது; “என் வேதனையில் எது என்னைவிட்டு நீங்கும்?” அல்லது “என் வேதனையில் எவ்வளவு நீங்கும்?” என்ற கருத்து இதில் மறைமுகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: நான் பேசினால்
  rationale: אִם அறிமுகப்படுத்தும் நிபந்தனைத் தொடரையும், אֲדַבְּרָה என்பதன் முதலாம் நபர் ஒருமைச் செயற்பாட்டையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: என் வேதனை தணியாது
  rationale: חשׂך என்பதன் அடிப்படை உணர்வு ‘தடுத்து நிறுத்தப்படுதல்/குறைக்கப்படுதல்.’ வேதனையைப் பற்றிய இச்சூழலில் ‘தணியாது’ என்பது பொருளை இயல்பாகத் தெரிவிக்கிறது; כְּאֵבִי என்பதன் பரந்த உடல் அல்லது உள்ள வேதனைப் பொருளையும் ‘என் வேதனை’ காக்கிறது.
- source_word: וְאַחְדְּלָה
  choice: நான் பேசாமல் இருந்தால்
  rationale: חדל என்பது நிறுத்துதல் அல்லது விலகியிருத்தல். முந்தைய ‘பேசுதல்’ என்பதற்கு இணையான எதிர்நிலையில், தமிழில் புரியும்படி மறைபொருளான பேச்சை வெளிப்படுத்துகிறது.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: என்னைவிட்டு என்ன நீங்கும்?
  rationale: הלך + מן என்பதன் ‘ஒருவரைவிட்டு நீங்குதல்’ என்ற பொருளையும், எது நீங்கும் என்பதைத் தெளிவுபடுத்தாத எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் கேள்வி வடிவத்தையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், யோபுவின் சொல்லாட்சிக்கேற்ற கண்ணியமான புலம்பல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு நிபந்தனைத் தொடர்களின் இணை அமைப்பும் இறுதிக் கேள்வியின் திட்டமிட்ட சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
