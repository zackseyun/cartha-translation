  text: שַׂ֣ק תָּ֭פַרְתִּי עֲלֵ֣י גִלְדִּ֑/י וְ/עֹלַ֖לְתִּי בֶ/עָפָ֣ר קַרְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: ta
  text: துக்கத்தின் சாக்குத்துணியை என் தோலின்மேல் தைத்தேன்; புழுதிக்குள் என் கொம்பை[a] தள்ளினேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொம்பு’ என்பது வலிமை, மாண்பு, அல்லது உயர்வைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “என் கொம்பைப் புழுதியில் வீசினேன் / அசுத்தப்படுத்தினேன்.” இங்குள்ள எபிரெய வினை கடினமானது; அதன் துல்லியமான நுண்பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂק
  choice: துக்க ஆடை
  rationale: துக்கத்தின்போது அணியும் கரடுமுரடான சாக்குத் துணியைச் சுட்டுகிறது. நவீனத் தமிழில் அதன் சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்க ‘துக்க ஆடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תָּפַרְתִּי
  choice: தைத்துக்கொண்டேன்
  rationale: תפר என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம்; தோலின்மேல் ஆடையைத் தைத்த செயலும் அதன் நீடிக்கும் நிலையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עֲלֵי
  choice: மேல்
  rationale: உடலின்மீது ஆடை அமைந்திருப்பதைக் குறிக்கும் על என்பதற்கான நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: גִלְדִּי
  choice: என் தோல்
  rationale: גֶּלֶד என்பது தோல் அல்லது மேற்புறச் சருமத்தைக் குறிக்கும்; ‘உடல்’ என்பது மிக விரிவானது.
- source_word: וְעֹלַלְתִּי
  choice: தாழ்த்தினேன்
  rationale: இந்த வினையின் துல்லியமான நுண்பொருள் உறுதியற்றது. புழுதியோடு இணையும் அவமானம் மற்றும் தாழ்வு உருவகத்தை வெளிப்படுத்தும் வகையில் ‘தாழ்த்தினேன்’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בֶעָפָר
  choice: புழுதியில்
  rationale: ב முன்னிடைச்சொல்லின் அடிப்படை இடப்பொருளைத் தக்கவைத்து, தாழ்த்தப்பட்ட நிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: קַרְנִי
  choice: என் கொம்பு
  rationale: வலிமை, மாண்பு அல்லது உயர்நிலையைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கிப் பதிலிடாமல் மூல உருவிலேயே காக்கிறது.
theological_decisions:
- issue: ‘கொம்பு’ என்ற உருவகம்
  choice: முதன்மை உரையில் ‘என் கொம்பு’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: என் வலிமை; என் மாண்பு
  rationale: இது வலிமை, மாண்பு அல்லது உயர்வைக் குறிக்கும் எபிரெயக் கவிதை உருவகம். அதை நேரடியாக விளக்கிப் பதிலிடுவது கவிதைச் செறிவைக் குறைக்கும்; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: וְעֹלַלְתִּי என்ற வினையின் நுண்பொருள்
  choice: ‘தாழ்த்தினேன்’ என்று மொழிபெயர்த்தல்
  alternative: வீசினேன்; தீட்டுப்படுத்தினேன்; புதைத்தேன்
  rationale: வினையின் பொருள் விவாதத்திற்குரியது. ‘புழுதியில்’ என்பதோடு சேர்ந்து தாழ்வையும் அவமானத்தையும் காட்டும் வாசிப்பை முதன்மை உரை ஏற்கிறது; உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘துக்க ஆடை’ பொதுவாசகருக்குப் புரியும் வகையில் சூழல்பொருளைத் தருகிறது; ‘கொம்பு’ என்ற மூல உருவகம் விளக்க அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
