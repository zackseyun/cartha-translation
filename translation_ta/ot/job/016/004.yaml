  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: ta
  text: உங்கள் உயிர் என் உயிரின் இடத்தில் இருந்திருந்தால், நானும் உங்களைப் போலப் பேசியிருக்க முடியும்[a]; உங்களுக்கு எதிராகச் சொற்களை அடுக்கி[b], உங்களை நோக்கி என் தலையை அசைத்திருக்கவும் முடியும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் உயிர் என் உயிரின் இடத்தில்” என்பதை “நீங்கள் என் நிலையில் இருந்திருந்தால்” என்றும் பொருள்கொள்ளலாம். எபிரெயச் சொல் נֶפֶשׁ சூழலுக்கேற்ப உயிர், வாழ்வு, தானே, அல்லது ஒருவர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சொற்களை அடுக்கி” என்பதற்கு “சொற்களை ஒன்றுசேர்த்து” அல்லது “சொற்களைத் தொடுத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இச்சூழலில் தலையை அசைப்பது இகழ்ச்சி அல்லது ஏளனத்தை வெளிப்படுத்தும் சைகை.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: நானும்
  rationale: யோபு தன் நண்பர்களுக்குப் பதிலீடாகத் தானும் அவ்வாறே செய்ய முடியும் என்று வலியுறுத்துவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָכֶם אֲדַבֵּרָה
  choice: உங்களைப் போலப் பேச முடியும்
  rationale: கற்பனைச் சூழலில் தனக்குள்ள சாத்தியத்தைச் சொல்லும் வினைநிலையையும், நண்பர்களின் பேச்சுமுறையோடு செய்யப்படும் ஒப்பீட்டையும் காக்கிறது.
- source_word: לוּ
  choice: இருந்தால்
  rationale: நிகழாத ஒரு நிலையை முன்வைக்கும் நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: உங்கள் உயிர் என் உயிரின் இடத்தில் இருந்தால்
  rationale: נֶפֶשׁ என்பதன் உயிர், தன்மனிதர், வாழ்வு ஆகிய பொருள் பரப்பையும், மூலத்தில் இருமுறை வரும் சொல்லின் ஒத்திசைவையும் முடிந்தவரை காக்கிறது.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: உங்களுக்கு எதிராகச் சொற்களைத் தொடுத்து
  rationale: חבר என்பதிலுள்ள இணைத்தல் அல்லது தொடராக அமைத்தல் என்ற அடிப்படைப் பொருளையும், இச்சூழலின் எதிர்மறையான நோக்கையும் வெளிப்படுத்துகிறது.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: உங்களைப் பார்த்துத் தலையசைக்கவும் முடியும்
  rationale: தலையை அசைக்கும் காணக்கூடிய சைகையை நேரடியாகக் காத்து, அதன் இகழ்ச்சிப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
