translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான உரை. எபிரெய உரையாடல் அறிமுகச் சூத்திரத்தின் இரு கூறுகளும் ‘மறுமொழியாகச் சொன்னது’ என்பதில் பாதுகாக்கப்பட்டுள்ளன; ‘அப்போது’ என்பது וַ தொடர்ச்சியின் கதை நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
