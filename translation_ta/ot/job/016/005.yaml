  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: ta
  text: நான் என் வாயினால் உங்களை வலுப்படுத்தியிருப்பேன்; என் உதடுகளின் அசைவு[a] உங்கள் துயரத்தை அடக்கியிருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உதடுகளின் ஆறுதல்.” נִיד என்ற எபிரெயச் சொல் வெறும் உடல் அசைவை மட்டுமல்லாமல், ஆறுதல் அல்லது பரிவை வெளிப்படுத்தும் அசைவு அல்லது சொல்லையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: '“உங்கள் துயரத்தை” என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; ஆறுதல் பற்றிய சூழலிலிருந்து பொருளைத் தெளிவாக்குவதற்காகச் சேர்க்கப்பட்டுள்ளது. சொல்லுக்குச் சொல்: “என் உதடுகளின் அசைவு தடுத்து நிறுத்தியிருக்கும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: உங்களை வலுப்படுத்துவேன்
  rationale: அமץ என்பதன் பியேல் வடிவம் ‘வலுப்படுத்து, உறுதிப்படுத்து’ என்று பொருள்படும். முந்தைய வசனத்தின் கற்பனைச் சூழலில் வரும் எபிரெய நிறைவுறா வினையைத் தமிழில் இயல்பான எதிர்கால வடிவில் வழங்குகிறது.
- source_word: בְּמוֹ פִי
  choice: என் வாயினால்
  rationale: பேச்சை ஒரு கருவியாகக் காட்டும் எபிரெய உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் தக்கவைக்கிறது.
- source_word: נִיד
  choice: அசைவு
  rationale: இந்தச் சொல் அசைவு அல்லது தலையசைப்பு போன்ற இரக்கத்தை வெளிப்படுத்தும் சைகையைக் குறிக்கலாம். ‘உதடுகள்’ என்பதுடன் இணைந்திருப்பதால், விளக்கத்தை மிகைப்படுத்தாமல் மூலத்தின் தெளிவின்மையை ‘அசைவு’ தக்கவைக்கிறது.
- source_word: שְׂפָתַי
  choice: என் உதடுகளின்
  rationale: ‘என் உதடுகள்’ என்ற நேரடியான உருவகத்தைத் தக்கவைத்து, ‘என் வாய்’ என்பதுடனான எபிரெய இணைவடிவையும் பாதுகாக்கிறது.
- source_word: יַחְשֹׂךְ
  choice: அடக்கிவைக்கும்
  rationale: חשׂך என்பதன் ‘தடுத்து வை, கட்டுப்படுத்து, விலக்கு’ என்ற பொருள் வரம்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; துயரம் முற்றிலும் அகலும் என்று கூறாமல் அதன் தாக்கம் கட்டுப்படும் எனச் சொல்கிறது.
