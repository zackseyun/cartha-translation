  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: ta
  text: 'தேவன் என்னை அநியாயக்காரனிடம்[a] ஒப்படைக்கிறார்;

    பொல்லாதவர்களின் கைகளில் என்னை எறிகிறார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைப்பற்றில்லாதவனிடம்.”
    reason: lexical_alternative
  - marker: b
    text: இறுதி எபிரெய வினைச்சொல்லின் பொருள் உறுதியல்ல; அது “என்னை வீசுகிறார்” அல்லது “என்னை அவர்களுடைய அதிகாரத்தில் ஒப்படைக்கிறார்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: என்னை … ஒப்படைக்கிறார்
  rationale: סגר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கிறது. “ஒப்படைக்கிறார்” என்பது பகைவரின் வசம் கொடுக்கப்படும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு אֵל என்பது பொதுவான “வலிமையானவன்” என்பதல்ல; யோபு தன்னைக் கையளிப்பவர் தேவனே என்று முறையிடுகிற சூழலுக்கேற்ப இறைப்பெயராக வருகிறது.
- source_word: אֶל
  choice: …இடம்
  rationale: இந்த முன்னிடைச்சொல் ஒருவரிடம் ஒப்படைக்கப்படும் திசையையோ இலக்கையையோ குறிக்கிறது; தமிழில் “அநியாயக்காரனிடம் ஒப்படைக்கிறார்” என்ற அமைப்பில் அதன் பொருள் இயல்பாக அடங்குகிறது.
- source_word: עֲוִיל
  choice: அநியாயக்காரன்
  rationale: இச்சொல் வெறும் அறிவில்லாதவனை அல்ல, ஒழுக்கக்கேடும் அநீதியும் உடைய ஒருவனைக் குறிக்கிறது. எபிரெய மூலத்தின் ஒருமையையும் “அநியாயக்காரன்” காக்கிறது.
- source_word: וְעַל יְדֵי
  choice: கைகளில்
  rationale: “கைகள்” என்ற உருவகத்தைத் தக்கவைத்து, பொல்லாதவர்களின் அதிகாரத்திற்குள் விடப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: தீமையால் அடையாளப்படுத்தப்படுகிறவர்களைக் குறிக்கும் பன்மைப் பெயர்ச்சொல்லுக்கு இது தெளிவான, வழக்கிலுள்ள தமிழ் இணை.
- source_word: יִרְטֵנִי
  choice: என்னைத் தள்ளிவிடுகிறார்
  rationale: இறுதி வினைச்சொல் அரிதானதும் பொருள் உறுதியாகாததும் ஆகும். இணைவரியின் பகைமையான ஒப்படைப்போடு பொருந்தும் “தள்ளிவிடுகிறார்” என்ற பொருள் சாத்தியமான வன்மையைத் தக்கவைக்கிறது; உறுதியின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: אֵל என்பதன் குறிப்பு
  choice: தன்னை அநியாயக்காரனிடம் ஒப்படைப்பவர் தேவனே என்று யோபு கூறுகிறார்.
  alternative: ஒரு பொதுவான “வலிமையானவன்” அவனை ஒப்படைக்கிறான்.
  rationale: யோபு நூலின் சூழலில் אֵל வழக்கமாக தேவனைக் குறிக்கிறது. தேவனுடைய செயலாக இதைக் கூறுவது யோபுவின் முறையீட்டிலுள்ள இறையியல் பதற்றத்தைத் தணிக்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைவரி அமைப்பும் “கைகள்” என்ற உருவகமும் காக்கப்பட்டுள்ளன; அரிதான இறுதி வினைச்சொல்லின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகச் சுட்டப்பட்டுள்ளது.
