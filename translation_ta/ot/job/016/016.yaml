source:
  edition: WLC
  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: ta
  text: 'அழுகையால் என் முகம் சிவந்திருக்கிறது;

    என் இமைகளின்மேல் காரிருள்[a] படிந்திருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரண நிழல்.” எபிரெயச் சொல் மரணத்தைப் போன்ற நிழலையோ மிகவும் அடர்ந்த இருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: என் முகம்
  rationale: முதல் நபர் ஒருமை பின்னொட்டுடன் வரும் எபிரெயப் பன்மை வடிவம் இங்கு ஒரே முகத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது; நவீன தமிழில் ‘என் முகம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: חמרמרה
  choice: சிவந்திருக்கிறது
  rationale: அரிதாக வரும் இந்த வினை, கடும் அழுகையால் முகத்தில் ஏற்பட்ட மாறிய அல்லது கலங்கிய தோற்றத்தைக் குறிக்கிறது. அதன் துல்லியமான உடலியல் விளைவு உறுதியில்லாவிட்டாலும், சூழலில் ‘சிவந்திருக்கிறது’ என்பது தெளிவான, மிகையில்லாத மொழிபெயர்ப்பு.
- source_word: מִנִּי
  choice: அழுகையால்
  rationale: இந்த முன்னிடைச்சொல் இங்கு காரணத்தைக் குறிக்கிறது; தமிழில் காரணப் பொருளை ‘-ஆல்’ வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶכִי
  choice: அழுகை
  rationale: இந்தப் பெயர்ச்சொல் அழுவதன் செயலைக் குறிக்கிறது. ‘அழுகை’ கவிதைநடையின் கண்ணியத்தையும் மூலத்தின் பொருளையும் காக்கிறது.
- source_word: וְעַל
  choice: என் இமைகளின்மேல்
  rationale: இணைப்புச் சொல் தமிழ்க் கவிதை இணைநிலையில் தனியே வெளிப்படுத்தப்பட வேண்டியதில்லை; עַל என்பதன் ‘மேல்’ என்ற இடப்பொருள் துல்லியமாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: עַפְעַפַּי
  choice: என் இமைகள்
  rationale: எபிரெயச் சொல் பொதுவாகக் கண்களை அல்ல, குறிப்பாக இமைகளைக் குறிக்கிறது; அந்த உடற்கூறு துல்லியம் காக்கப்பட்டுள்ளது.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: கவிதை எபிரெயில் இச்சொல் மரணத்தோடு தொடர்புடைய நிழலையோ மிகவும் அடர்ந்த இருளையோ குறிக்கக்கூடும். இங்கு யோபுவின் இமைகள்மேல் படிந்த துயரத் தோற்றத்தைச் சித்தரிப்பதால் ‘காரிருள்’ இயல்பாகப் பொருந்துகிறது; ‘மரண நிழல்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: צַלְמָוֶת என்பது நேரடியாக மரணத்தைக் குறிக்கிறதா அல்லது மிகுந்த இருளைக் குறிக்கிறதா
  choice: முதன்மை உரையில் ‘காரிருள்’
  alternative: ‘மரண நிழல்’
  rationale: இரண்டு பொருள்களுக்கும் எபிரெயக் கவிதை வழக்கில் ஆதாரம் உள்ளது. இவ்வசனத்தின் உடல் தோற்றம் மற்றும் அழுகை சார்ந்த சூழல் அடர்ந்த இருளை முன்னிறுத்துகிறது; இருப்பினும் மரணச் சாயலை நீக்காமல் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணை அடிகளின் உருவகச் செறிவு காக்கப்பட்டுள்ளது. ‘காரிருள் படிந்திருக்கிறது’ என்பது இமைகள்மேல் காணப்படும் துயரத்தின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
