  source_fidelity: மூல எபிரெயத்தின் இரு இணை அடிகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. פָּנַי என்பதற்கு ‘என் முகம்,’ מִנִּי בֶכִי என்பதற்கு ‘அழுகையால்,’ மற்றும் עַפְעַפַּי என்பதற்கு ‘என் இமைகள்’ என்பவை பொருத்தமானவை. חמרמרה என்பதன் சூழல்சார் முகமாற்றத்தை ‘சிவந்திருக்கிறது’ என்று தருவது பாதுகாப்பானது. צַלְמָוֶת என்பதன் ஆழ்ந்த இருள் பொருள் ‘காரிருள்’ மூலம் நன்றாக வெளிப்படுகிறது; மாற்று மரணச் சாயல் அடிக்குறிப்பில் உள்ளது.
