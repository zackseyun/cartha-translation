  text: פָּעֲר֬וּ עָלַ֨/י בְּ/פִי/הֶ֗ם בְּ֭/חֶרְפָּה הִכּ֣וּ לְחָיָ֑/י יַ֝֗חַד עָלַ֥/י יִתְמַלָּאֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/010.yaml
  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: ta
  text: எனக்கு எதிராகத் தங்கள் வாய்களை அகலமாகத் திறந்தார்கள்; நிந்தையுடன் என் கன்னத்தில் அடித்தார்கள்; ஒன்றுசேர்ந்து எனக்கு எதிராகத் திரளுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுசேர்ந்து எனக்கு எதிராகத் தங்களைத் திரட்டிக்கொள்கிறார்கள்,” அல்லது “எனக்கு எதிராக நிரம்புகிறார்கள்.” இறுதி வினை மரபுத்தொடரானதும் பொருள் காணக் கடினமானதும் ஆகும்; பகைவர்கள் ஒருமித்து அணிதிரள்வதே அதன் கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ
  choice: தங்கள் வாயை அகலத் திறந்தார்கள்
  rationale: פער என்ற வினை, பகைமையோ கேலியோ வெளிப்படும் விதத்தில் வாயை அகலத் திறப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் படிமத்தைத் தெளிவாகவும் காக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: பகைமைச் சூழலில் על எதிரான தாக்குதலைக் குறிப்பதால், ‘எனக்கு எதிராக’ பொருத்தமானது.
- source_word: בְּפִיהֶם
  choice: தங்கள் வாயை
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள ‘அவர்களுடைய வாய்’ என்ற கூட்டுப் பயன்பாட்டை, தமிழ் பன்மை எழுவாயுடன் இயல்பாக ‘தங்கள் வாயை’ என்று வழங்குகிறது.
- source_word: בְּחֶרְפָּה
  choice: நிந்தையுடன்
  rationale: חרפה என்பது நிந்தை, அவமதிப்பு, இகழ்ச்சி ஆகிய பொருள்களைக் கொண்டது; பெயர்ச்சொல் வடிவையும் அவமானப்படுத்தும் தாக்கத்தையும் இது காக்கிறது.
- source_word: הִכּוּ
  choice: அடித்தார்கள்
  rationale: נכה இங்கு உடல்ரீதியாகத் தாக்குதல் அல்லது அடித்தலைக் குறிக்கிறது; நவீன தமிழில் ‘அடித்தார்கள்’ நேரடியும் இயல்புமானது.
- source_word: לְחָיִי
  choice: என் கன்னத்தில்
  rationale: לחי கன்னம் அல்லது தாடைப் பகுதியைக் குறிக்கும்; அவமானப்படுத்தும் அடியின் படிமத்திற்கு ‘கன்னம்’ மிகப் பொருத்தமானது.
- source_word: יַחַד
  choice: ஒன்றுசேர்ந்து
  rationale: יחד கூட்டாக, ஒருமித்துச் செய்யப்படும் செயலைக் குறிக்கிறது.
- source_word: יִתְמַלָּאוּן
  choice: திரளுகிறார்கள்
  rationale: מלא என்பதன் இவ்வடிவம் இங்கு கடினமான மரபுத்தொடராக உள்ளது. சூழலில் பகைவர்கள் ஒருமித்து கூடுவதையோ முழு வலிமையுடன் அணிதிரள்வதையோ குறிக்கலாம்; ‘திரளுகிறார்கள்’ அந்த பகைமையான கூட்டுச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி வினையின் பொருள்
  choice: ஒன்றுசேர்ந்து எனக்கு எதிராகத் திரளுகிறார்கள்
  alternative: எனக்கு எதிராக நிரம்புகிறார்கள் / தங்களைத் திரட்டிக்கொள்கிறார்கள்
  rationale: יִתְמַלָּאוּן என்பதன் நேரடிப் பொருள் ‘நிரம்புதல்’ சார்ந்ததாக இருந்தாலும், இச்சூழலில் அதன் மரபுத்தொடரான பொருள் உறுதியற்றது. பகைவர்கள் கூட்டாக அணிதிரள்வது என்ற சாத்தியமான பொருளை முதன்மை உரையில் வழங்கி, மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது; எந்தத் தனிப்பட்ட கோட்பாட்டுத் தீர்வும் இதில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைநயமும் தாக்குதலின் தீவிரமான படிமமும் காக்கப்பட்டுள்ளன. ‘நிந்தையுடன்’ என்பது dignified ஆனாலும் பொதுவாசகருக்கு புரியும் சொல்; இறுதி வினையின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
