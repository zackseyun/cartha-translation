base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: ta
  text: நான் நிம்மதியாக இருந்தேன்; ஆனால் அவர் என்னைச் சிதைத்துப்போட்டார்[a]. என் பிடரியைப் பிடித்து என்னை நொறுக்கிப்போட்டார்; தமக்கென ஓர் இலக்காக என்னை நிறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிதைத்துப்போட்டார்” என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல் அரிதானது; இதை “வன்மையாக உலுக்கினார்” அல்லது “கிழித்துப்போட்டார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: நிம்மதியாக
  rationale: அமைதியும் தொந்தரவற்ற பாதுகாப்பும் கொண்ட நிலையைக் குறிக்கிறது; திடீரெனத் தொடரும் வன்முறைக்கு இயல்பான எதிர்மறை மாறுபாட்டை உருவாக்குகிறது.
- source_word: וַיְפַרְפְּרֵנִי
  choice: என்னைச் சிதைத்துப்போட்டார்
  rationale: அரிதான இவ்வினைச்சொல் யோபுவின் முந்தைய நிம்மதியை வன்மையாகக் குலைத்து அவரைச் சிதைத்த செயலைக் குறிக்கிறது. மூலச்சொல்லின் பொருள் உறுதியற்றதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וְאָחַז
  choice: பிடித்து
  rationale: பகைமையான வலிமையுடன் பற்றிக்கொள்ளும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּעָרְפִּי
  choice: என் பிடரியை
  rationale: עֹרֶף என்பது கழுத்தின் பின்புறம் அல்லது பிடரியைக் குறிக்கிறது; 'பிடரி' மூலப்படிமத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וַיְפַצְפְּצֵנִי
  choice: என்னை நொறுக்கிப்போட்டார்
  rationale: தீவிரமாக உடைத்து நாசமாக்கும் வன்முறையை வலுவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய அரிதான வினையிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: וַיְקִימֵנִי
  choice: என்னை நிறுத்தினார்
  rationale: קום என்பதன் காரணவினை வடிவம் ஒருவரை நிற்கச் செய்வதையோ ஒரு நிலையில் வைப்பதையோ குறிக்கிறது; தொடர்ந்து வரும் இலக்கு உருவகத்துடன் 'நிறுத்தினார்' பொருந்துகிறது.
- source_word: לוֹ
  choice: தமக்கென
  rationale: தாக்குபவர் தமது பயன்பாட்டுக்காக யோபுவை இலக்காக நிறுத்தினார் என்ற தன்மறுமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמַטָּרָה
  choice: ஓர் இலக்காக
  rationale: தாக்கப்படுவதற்கான குறி அல்லது இலக்கு என்ற போரியல் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வசனம் முழுவதிலும் வரும் மூன்றாம் நபர் ஆண்பால் எழுவாயின் அடையாளம்
  choice: '''அவர்'' என்று மட்டும் மொழிபெயர்த்து, யாரென்று வசனத்தில் வெளிப்படையாக அடையாளப்படுத்தவில்லை.'
  alternative: சூழலின் அடிப்படையில் 'கடவுள்' என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது குறிப்பிடப்படாத ஓர் எதிரியாகக் கருதுதல்.
  rationale: யோபின் உரையில் மறைமுகக் குறிப்பு கடவுளைச் சுட்டினாலும், இவ்வசனத்தின் எபிரெய உரை மூன்றாம் நபர் வினை வடிவங்களையும் பின்னொட்டுகளையும் மட்டுமே பயன்படுத்துகிறது. ஆகவே இறையியல் பதற்றத்தையும் மூலத்தின் மறைமுகத்தன்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. வன்முறைச் சித்திரத்தின் தீவிரம் காக்கப்பட்டுள்ளதுடன், மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத எழுவாய் அடையாளம் சேர்க்கப்படவில்லை.
