translation:
  language: ta
  text: ஒரு மனிதனுக்காக அவர் தேவனோடு வழக்காடுவாராக[a]; ஒரு மனிதன்[b] தன் தோழனுக்காக[c] வழக்காடுவது போல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதனுக்காக அவர் தேவனோடு வாதிடுவாராக.” எபிரெய வினைச்சொல் ஒரு வழக்கைத் தீர்த்தல், நடுவராகச் செயல்படுதல், அல்லது வழக்கை வாதிடுதல் ஆகிய சட்டப் பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “மனித மகன்.” இங்கு இது ஒரு மனிதனைக் குறிக்கும் மரபுத்தொடர்; மேசியாவுக்குரிய பட்டம் என்று அவசியமாகப் பொருள்படாது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தன் நண்பனுக்காக” அல்லது “தன் அயலானுக்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: வழக்காடுவாராக
  rationale: יכח என்பதன் ஹிப்இல் வடிவம் தீர்ப்பளித்தல், நடுவராகச் செயல்படுதல், அல்லது ஒருவரின் வழக்கை வாதிடுதல் ஆகிய சட்டப் பொருள்களைத் தரலாம். இங்கு ஒருவருக்காக தேவனிடம் வழக்காடுதல் என்ற நீதிமன்றச் சூழலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; அந்தச் செயலை வெறும் கண்டிப்பாகவோ தீர்ப்பாகவோ குறுக்கவில்லை.
- source_word: לְגֶבֶר
  choice: ஒரு மனிதனுக்காக
  rationale: גבר இங்கு ஆண் மனிதனைக் குறிக்கும் ஒருமைச் சொல்லாக இருந்தாலும், வழக்கில் உள்ள மனித நபரைக் பொதுவாகச் சுட்டுகிறது. לְ முன்னொட்டின் பயனாளிப் பொருளை ‘-க்காக’ காக்கிறது.
- source_word: עִם אֱלוֹהַּ
  choice: தேவனிடம்
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’; சட்டச் சூழலில் ஒருவரோடு வழக்காடுதல் அல்லது அவர்முன் வழக்கை எடுத்துரைத்தல் என்ற உறவைக் குறிக்கலாம். தமிழில் ‘தேவனிடம் வழக்காடுதல்’ இயல்பாகவும், தேவனுக்கும் மனிதனுக்கும் இடையில் நடுநிலையான மத்தியஸ்தம் என்ற கூடுதல் கருத்தைத் திணிக்காமலும் உள்ளது.
- source_word: וּבֶן אָדָם
  choice: ஒரு மனித மகன்
  rationale: בן אדם என்பதன் உருவக அமைப்பைத் தக்கவைத்து, கவிதையின் גבר என்பதுடனான இணைநிலையையும் பாதுகாக்கிறது. இங்கு இது பிற்கால சிறப்புப் பட்டமாக அல்ல, சாதாரண மனிதனைக் குறிக்கும் எபிரெய மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் தோழனுக்காக
  rationale: רֵעַ என்பது தோழன், நண்பன், அயலான் ஆகிய பொருள்களை உடையது. இங்குள்ள நபர்சார் மற்றும் சட்ட ஒப்புமையில் ‘தோழன்’ இயல்பாக உள்ளது; לְ முன்னொட்டின் பயனாளிப் பொருளையும் முதல் அடியுடன் இணையாகக் காக்கிறது.
theological_decisions:
- issue: ‘மனித மகன்’ என்பதை மேசியாவுக்குரிய பட்டமாக வாசிக்கும் வாய்ப்பு
  choice: உடனடிச் சூழலில் சாதாரண மனிதனைக் குறிக்கும் எபிரெய மரபுத்தொடராக மொழிபெயர்த்து, அதன் சொல் வடிவைத் தக்கவைத்தல்
  alternative: ‘ஒரு மனிதன்’ என்று இயக்கமுறையில் மொழிபெயர்த்தல், அல்லது மேசியாப் பட்டமாகப் பொருள் கொண்டு சிறப்புறுத்தல்
  rationale: בן אדם இங்கு גבר என்பதற்கு இணையாக வரும் பொதுவான மனிதக் குறிப்பு. இதை மேசியாவைப் பற்றிய நேரடி உரையாக மாற்றுவது மூலத்தில் இல்லாத பிற்கால இறையியல் கருத்தைச் சேர்க்கும்; அதேவேளை சொற்றொடரை முற்றிலும் தட்டையாக்காமல் அடிக்குறிப்பால் அதன் பொருள் தெளிவுபடுத்தப்படுகிறது.
- issue: வழக்காடுபவரின் பங்கு
  choice: ‘ஒரு மனிதனுக்காக தேவனிடம் வழக்காடுதல்’ என்று பயனாளிப் பொருளையும் சட்டத் தன்மையையும் காத்தல்
  alternative: ‘மனிதனுக்கும் தேவனுக்கும் இடையில் நடுவராகத் தீர்ப்பளித்தல்’
  rationale: இரு לְ முன்னொட்டுகளின் இணைநிலை, மனிதனுக்கும் தோழனுக்கும் ஆதரவாகச் செயல்படுவதை முன்னிறுத்துகிறது. ‘இடையில் நடுவர்’ என்பது சாத்தியமான சூழல்பொருள் என்றாலும், அது நடுநிலைத்தன்மையை அதிகமாகத் தீர்மானித்துவிடலாம்.
