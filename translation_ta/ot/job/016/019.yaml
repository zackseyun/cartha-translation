  text: גַּם עַ֭תָּה הִנֵּה בַ/שָּׁמַ֣יִם עֵדִ֑/י וְ֝/שָׂהֲדִ֗/י בַּ/מְּרוֹמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: ta
  text: இப்போதும்கூட, இதோ, என் சாட்சி பரலோகத்தில் இருக்கிறார்[a]; எனக்காகச் சான்றுரைப்பவர் உன்னதங்களில் இருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மற்றொரு வகையில், “என் சாட்சி பரலோகத்தில் இருக்கிறார்; என் சாட்சி உன்னதங்களில் இருக்கிறார்” என்று மொழிபெயர்க்கலாம். இரு எபிரெயச் சொற்களும் நெருங்கிய பொருளுடையவை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உயரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: இப்போதும்கூட
  rationale: இரு சொற்களும் இணைந்து யோபுவின் தற்போதைய நிலையிலும் இது உண்மை என்பதை வலியுறுத்துகின்றன; தனித்தனியான கூட்டல் பொருளைவிட காலவலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் உறுதிப்பாட்டின் மீது கவனத்தைத் திருப்பும் சுட்டிடைச்சொல்லின் வலிமையை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: בַשָּׁמַיִם
  choice: பரலோகத்தில்
  rationale: இங்கு சொல் காணக்கூடிய வானத்தைவிட மேலுலகத் தளத்தைக் குறிக்கிறது; ‘பரலோகம்’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֵדִי
  choice: என் சாட்சி
  rationale: நீதிமன்றச் சூழலைக் கொண்ட ‘சாட்சி’ என்ற நேரடிப் பொருளையும் முதல் நபர் உரிமைத் தொடர்பையும் காக்கிறது.
- source_word: וְשָׂהֲדִי
  choice: எனக்காகச் சான்றுரைப்பவர்
  rationale: அரமேயத் தாக்கமுள்ள, ‘சாட்சி’ என்பதற்கு நெருங்கிய பொருளுடைய சொல்லை செயற்பாட்டு முறையில் மொழிபெயர்க்கிறது; ‘வழக்குரைஞர்’ போன்ற கூடுதல் விளக்கத்தைப் புகுத்தாமல் யோபுவுக்குச் சார்பாகச் சான்றுரைக்கும் பொருளைத் தருகிறது.
- source_word: בַּמְּרוֹמִים
  choice: உன்னதங்களில்
  rationale: ‘பரலோகத்தில்’ என்பதற்கு இணையான கவிதை வரியாக உயர்ந்த இடங்கள் என்ற பன்மை உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோபுவின் பரலோகச் சாட்சியின் அடையாளம்
  choice: ‘என் சாட்சி’ என்றும் ‘எனக்காகச் சான்றுரைப்பவர்’ என்றும் பணிசார் சொல்லாக்கத்தில் மட்டும் குறிப்பிடப்பட்டது.
  alternative: அவரை தேவன், ஒரு பரலோக மத்தியஸ்தர் அல்லது யோபுவின் சாட்சியின் உருவகப்படுத்தல் என்று குறிப்பாக அடையாளப்படுத்துதல்.
  rationale: எபிரெய உரை அந்தச் சாட்சியின் அடையாளத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே சட்டவியல் உருவகம் காக்கப்பட்டு, அதன் இறையியல் நெருக்கடி தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் நீதிமன்றச் சாட்சியின் உருவகமும் காக்கப்பட்டுள்ளன. ‘இருக்கிறார்’ என்பது சாட்சி ஒரு தனிநபராகச் சித்தரிக்கப்படுவதை இயல்பாகத் தெரிவிக்கிறது; ஆனால் அவர் யார் என்பதை நிர்ணயிப்பதில்லை.
