  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: ta
  text: பூமியே, என் இரத்தத்தை[a][b] மூடாதே; என் கூக்குரலுக்கு[c] ஓய்விடம் இல்லாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் இரத்தச்சிந்துதலை.’ எபிரெய மொழியில் நேரடியாக ‘என் இரத்தத்தை’ என்றுள்ளது; சூழலில் அது அநியாயமாகச் சிந்தப்பட்ட இரத்தத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த உருவகம், நீதிக்காக நிலத்திலிருந்து கூப்பிடும் இரத்தத்தை நினைவூட்டுகிறது; ஆதியாகமம் 4:10-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘என் முறையீட்டுக்கு.’ இச்சொல் துயரக் கூக்குரலையும், நீதி கோரும் முறையீட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: பூமியே
  rationale: தொடர்ந்து வரும் பெண்பால் ஒருமை வினைச்சொல் நேரடி விளிப்பைக் காட்டுகிறது. குறுகிய ‘நாடு’ என்பதைக் காட்டிலும், யோபுவின் பரந்த கவித்துவ முறையீட்டுக்கு ‘பூமியே’ பொருத்தமாக உள்ளது.
- source_word: אַל תְּכַסִּי
  choice: மூடாதே
  rationale: אַל உடன் வரும் இவ்வினை வடிவம் தடை அல்லது தீவிரமான எதிர்மறை வேண்டுதலைத் தெரிவிக்கிறது. ‘மூடாதே’ என்பது כסה என்பதன் திடமான உருவகத்தையும், இரத்தம் மறைக்கப்படக்கூடாது என்ற உட்பொருளையும் காக்கிறது.
- source_word: דָמִי
  choice: என் இரத்தத்தை
  rationale: மூலச்சொல் நேரடியாக ‘என் இரத்தம்’ என்கிறது. அநியாயமாகச் சிந்தப்பட்ட இரத்தம் என்ற சூழல்சார் பொருளை முதன்மை உரையில் வெளிப்படையாக விரித்துரைக்காமல், மூலத்தின் உருவகத்தையும் இருபொருள் வாய்ப்பையும் காக்கிறது.
- source_word: וְאַל יְהִי
  choice: இல்லாதிருக்கட்டும்
  rationale: இணைக்கப்பட்ட இரண்டாவது எதிர்மறை விருப்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מָקוֹם
  choice: ஓய்விடம்
  rationale: அடிப்படைப் பொருள் ‘இடம்.’ இங்கு யோபுவின் கூக்குரல் ஓய்ந்துவிடவோ அடங்கிவிடவோ கூடாது என்ற கவித்துவச் சூழலை ‘ஓய்விடம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְזַעֲקָתִי
  choice: என் கூக்குரலுக்கு
  rationale: זעקה என்பது துயரத்தில் எழுப்பப்படும் உரத்த அழுகையையும், உதவி அல்லது நீதி கோரும் முறையீட்டையும் குறிக்கலாம். ‘கூக்குரல்’ இந்த இரு நிழற்பொருள்களையும் தமிழில் பெருமளவு தக்கவைக்கிறது.
theological_decisions:
- issue: நீதிக்காக முறையிடும் குற்றமற்ற இரத்தத்தின் உருவகம்
  choice: ‘என் இரத்தம்,’ ‘என் கூக்குரல்’ என்ற திடமான உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘என் இரத்தச்சிந்துதல்’ அல்லது ‘நீதிக்கான என் முறையீடு’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் தரையிலிருந்து நீதிக்காகக் கூப்பிடும் இரத்தம் என்ற வேதாகம உருவகத்தை நினைவூட்டுகிறது; ஆயினும் எபிரெய உரை இரத்தம், துயரக் கூக்குரல், நீதி வேண்டுதல் ஆகியவற்றுக்கிடையிலான கவித்துவ இறுக்கத்தைத் தீர்க்காமல் வைக்கிறது. அதையே மொழிபெயர்ப்பும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமும் கண்ணியமும் கொண்ட நேரடி விளிப்பு பயன்படுத்தப்பட்டுள்ளது. ‘மூடாதே’ என்ற சுருக்கமான தடை வடிவமும் ‘இல்லாதிருக்கட்டும்’ என்ற வேண்டுதல் வடிவமும் மூலத்தின் இரு இணை எதிர்மறை கூறுகளை வேறுபடுத்திக் காட்டுகின்றன. ‘ஓய்விடம்’ என்பது சொற்பொருளான ‘இடம்’ என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் அளிக்கிறது; கூக்குரல் அடங்காமல் நீதிக்காகத் தொடர்ந்து ஒலிக்க வேண்டும் என்ற உட்பொருளை வெளிப்படையான விளக்கமாக மாற்றவில்லை.
