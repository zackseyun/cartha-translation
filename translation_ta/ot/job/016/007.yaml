  rationale: மசோரா எபிரெய உரையில் முதல் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையிலும், இரண்டாவது வினை இரண்டாம் நபர் ஆண்பால் ஒருமையிலும் உள்ளது. யோபு தேவனைப் பற்றிப் பேசுவதிலிருந்து அவரையே நேரடியாக அழைத்துப் பேசுகிறாரா என்ற சொல்லாட்சித் திறப்பைத் தீர்த்துவிடாமல் இந்த மாற்றம் அப்படியே வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டக்கூடிய மூன்றாம் நபருக்கு ‘அவர்’ என்றும் நேரடி அழைப்புக்கு ‘நீர்’ என்றும் மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; அதே நேரத்தில், மூலத்தில் உள்ள நபர் மாற்றம் ஒத்திசைக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின் இடம்பெற்றுள்ளன.
