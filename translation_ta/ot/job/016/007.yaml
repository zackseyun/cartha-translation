    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் சபை முழுவதையும்’ அல்லது ‘என் மக்கள் அனைவரையும்.’ எபிரெயச் சொல் யோபுவைச் சூழ்ந்திருந்த கூட்டத்தையோ, அவரது குடும்பத்தைப் போன்ற நெருங்கிய வட்டத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
