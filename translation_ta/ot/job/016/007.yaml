- source_word: עֲדָתִי
  choice: என் கூட்டம்
  rationale: עֵדָה என்பதன் ‘கூட்டம், சபை, திரள்’ என்ற பரப்பில், இச்சூழலில் யோபுவைச் சேர்ந்த குடும்பம் அல்லது அவரைச் சூழ்ந்திருந்தோர் அடங்கிய குழுவைக் குறிக்கக்கூடிய பொதுவான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இரு வினைகளுக்கிடையிலான இலக்கண நபர் மாற்றம்
  choice: ‘அவர் ... செய்தார்; நீர் ... பாழாக்கிவிட்டீர்’ என்று மூன்றாம் நபரிலிருந்து இரண்டாம் நபருக்கான மாற்றத்தைப் பாதுகாத்தல்
