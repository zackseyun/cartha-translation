- from: இப்படிப்பட்டவற்றை நான் பலமுறை கேட்டிருக்கிறேன்; நீங்கள் எல்லாரும் துன்பம் தரும் ஆறுதலாளர்கள்.[a]
  to: இப்படிப்பட்ட பலவற்றை நான் கேட்டிருக்கிறேன்; நீங்கள் அனைவரும் வேதனை தரும் ஆறுதல் அளிப்பவர்கள்.[a]
