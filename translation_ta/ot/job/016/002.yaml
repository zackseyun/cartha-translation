source:
  edition: WLC
  text: שָׁמַ֣עְתִּי כְ/אֵ֣לֶּה רַבּ֑וֹת מְנַחֲמֵ֖י עָמָ֣ל כֻּלְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: ta
  text: இப்படிப்பட்ட பலவற்றை நான் கேட்டிருக்கிறேன்; நீங்கள் அனைவரும் வேதனை தரும் ஆறுதல் அளிப்பவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “துன்பத்தின் ஆறுதல் அளிப்பவர்கள்”; அல்லது “தொல்லை தரும் ஆறுதல் அளிப்பவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: நான் ... கேட்டிருக்கிறேன்
  rationale: שׁמע என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம். முன்பு பலமுறை கேட்டவை தற்போதைய முறையீட்டுக்கும் பொருந்துகின்றன என்ற தொடர்ச்சியான உணர்வைத் தமிழ் நிறைவுநிலை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: இப்படிப்பட்டவற்றை ... பலமுறை
  rationale: כְאֵלֶּה என்பது ‘இவற்றைப் போன்றவை/இப்படிப்பட்டவை’ என்றும் רַבּוֹת என்பது அவை ஏராளம் என்றும் குறிக்கிறது. தமிழில் மீண்டும் மீண்டும் இதுபோன்ற பேச்சைக் கேட்டிருப்பதை ‘பலமுறை’ இயல்பாகத் தெரிவிக்கிறது; ‘இப்படிப்பட்டவற்றை’ அதன் இகழ்ச்சித் தொனியைத் தக்கவைக்கிறது.
- source_word: מְנַחֲמֵי
  choice: ஆறுதலாளர்கள்
  rationale: נחם வேரிலிருந்து வந்த பெயர்ச்சொல் பயன்பாட்டிலுள்ள பங்கேற்புவினை வடிவம். நண்பர்கள் ஆறுதல் கூறுவதாகக் கருதிக்கொள்வதற்கும், உண்மையில் அவர்கள் தோல்வியுறுவதற்கும் இடையிலான நையாண்டியை இச்சொல் காக்கிறது.
- source_word: עָמָל
  choice: துன்பம் தரும்
  rationale: עָמָל என்பதற்கு துன்பம், தொல்லை, வருத்தம், கடின உழைப்பு ஆகிய பொருள் எல்லைகள் உள்ளன. מְנַחֲמֵי עָמָל என்ற இணைப்பில், அவர்களுடைய ஆறுதல் துன்பத்தால் குறிக்கப்படுகிறது அல்லது துன்பத்தையே உண்டாக்குகிறது என்ற வலுவை ‘துன்பம் தரும்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כֻּלְּכֶם
  choice: நீங்கள் எல்லாரும்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மையுடன் இணைந்த ‘அனைவரும்’ என்ற முழுமையைக் குறிக்கிறது; யோபு நண்பர்கள் அனைவரையும் நேரடியாகக் கண்டிப்பதைத் தெளிவாகக் காக்கிறது.
