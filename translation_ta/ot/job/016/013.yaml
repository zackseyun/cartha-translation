  source_fidelity: 'மூல எபிரெயத்தின் கவிதைமிக்க வன்முறைப் படிமம் நன்றாகக் காக்கப்பட்டுள்ளது: தாக்குவோரின் பன்மைச் செயலும், பின்னர் வரும் ஒருமைச் செயல்களும், சிறுநீரகங்கள் மற்றும் பித்தநீர் என்ற உடற்கூறு மொழியும் துல்லியமாகத் தரப்பட்டுள்ளன. רַבָּיו என்ற கடினமான சொல்லுக்கான ‘வில்வீரர்கள்’ வாசிப்பு ஆங்கில POB தீர்மானத்துடன் ஒத்திருக்கிறது; மாற்றுவாசிப்புகள் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.'
