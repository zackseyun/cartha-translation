source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: ta
  text: அவருடைய வில்வீரர்கள் என்னைச் சூழ்ந்துகொள்கிறார்கள்[a]; அவர் இரக்கமின்றி என் சிறுநீரகங்களைப் பிளக்கிறார்[b]; என் பித்தநீரைத் தரையில் ஊற்றுகிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய பெரியவர்கள்’ அல்லது ‘அவருடைய தலைவர்கள்.’ எபிரெய வடிவம் கடினமானது; இவ்வசனத்திலும் சுற்றியுள்ள பகுதிகளிலும் காணப்படும் தாக்குதல் படிமத்துக்கு ‘வில்வீரர்கள்’ பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நேரடியாக ‘என் சிறுநீரகங்கள்.’ அவை உடலின் உள்ளுறுப்புகளையும், எபிரெய வழக்கில் ஒருவரின் ஆழ்ந்த உள்ளத்தையும் சுட்டக்கூடும்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘என் பித்தத்தை’; சிலர் இதை உருவகமாக ‘என் கசப்பை’ என்று கொள்கிறார்கள். ஆனால் வசனத்தின் வன்மையான உடற்கூறு படிமத்துக்கு நேரடிப் பொருள் நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: சூழ்ந்துகொள்கிறார்கள்
  rationale: סבב என்பதன் தாக்குதல் சூழலில் வரும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; சுற்றிவளைக்கும் பகைமைப் படிமத்தையும் காக்கிறது.
- source_word: רַבָּיו
  choice: அவருடைய வில்வீரர்கள்
  rationale: எபிரெய வடிவம் கடினமானது; ‘பெரியவர்கள்/தலைவர்கள்’ என்றும் கொள்ளலாம். ஆயினும் உடலைப் பிளக்கும் தாக்குதல் படிமத்துக்கும் விரிந்த சூழலுக்கும் ‘வில்வீரர்கள்’ நன்றாகப் பொருந்துகிறது.
- source_word: יְפַלַּח
  choice: பிளக்கிறார்
  rationale: פלח என்பதன் பியேல் வடிவம் இங்கு உடலை வன்மையாகப் பிளப்பதைக் குறிக்கிறது; ‘பிளக்கிறார்’ அதன் தீவிரத்தைத் தெளிவாகத் தருகிறது.
- source_word: כִּלְיוֹתַי
  choice: என் சிறுநீரகங்களை
  rationale: இச்சொல் நேரடியாகச் சிறுநீரகங்களைக் குறிக்கிறது. விளக்கமாக ‘உள்ளுறுப்புகள்’ அல்லது ‘உள்ளம்’ என்று மாற்றாமல் மூலத்தின் திடமான உடற்கூறு படிமம் காக்கப்படுகிறது.
- source_word: וְלֹא יַחְמוֹל
  choice: இரக்கமின்றி
  rationale: חמל இங்கு இரங்குதல் அல்லது விட்டுவைத்தல் என்பதைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்தில் ‘இரக்கமின்றி’ இயல்பாக இருந்து, இரக்கமற்ற தாக்குதலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்றுகிறார்
  rationale: שפך என்பதன் அடிப்படைப் பொருளான ‘ஊற்று’ என்பதைத் தக்கவைத்து, உயிர்ப்பான உடற்கூறு படிமத்தைப் பாதுகாக்கிறது.
- source_word: מְרֵרָתִי
  choice: என் பித்தநீரை
  rationale: இச்சொல் பித்தம்/பித்தநீரைக் குறிக்கலாம்; ‘கசப்பு’ என்ற உருவகப் பொருளும் சாத்தியம். இவ்வசனத்தின் வன்மையான உடற்கூறு சூழலில் ‘பித்தநீர்’ மிகத் தெளிவாகப் பொருந்துகிறது.
theological_decisions:
- issue: துன்பத்தை விவரிக்கும் கவிதையில் மனித உடற்கூறு படிமம்
  choice: ‘சிறுநீரகங்கள்’, ‘பித்தநீர்’ என்ற திடமான உடற்கூறு சொற்களை முதன்மை உரையில் வைத்தல்.
  alternative: ‘உள்ளுறுப்புகள்’, ‘என் உள்ளம்’, ‘என் கசப்பு’ போன்ற விளக்கமான அல்லது உருவகச் சொற்களைப் பயன்படுத்துதல்.
  rationale: யோபுவின் துன்பத்தை இவ்வசனம் உள்ளுறுப்புகள் சிதைக்கப்படும் கொடூரமான படிமத்தின் வழியாகச் சித்தரிக்கிறது. அதை மென்மையாக்காமல் வைத்திருப்பது எபிரெயக் கவிதையின் வலிமையையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கவிதையின் கொடூரமான உடற்கூறு படிமம் மென்மையாக்கப்படவில்லை. முதல் பன்மை வினைக்கும் பின்வரும் ஒருமை வினைகளுக்கும் இடையிலான மூலமொழிப் பதற்றம் தமிழிலும் காக்கப்பட்டுள்ளது.
