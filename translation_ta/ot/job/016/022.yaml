  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: ta
  text: ஏனெனில், சில ஆண்டுகளே வரும்[a]; அதன்பின் நான் திரும்பிவராத பாதையில்[b] செல்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘எண்ணிக்கையின் ஆண்டுகள்’; அதாவது, எண்ணிக்கையில் சிலவாக அல்லது வரம்புக்குட்பட்ட ஆண்டுகள்.
    reason: lexical_alternative
  - marker: b
    text: ‘பாதை’ என்பதற்குப் பதில் ‘வழி’ என்றும் மொழிபெயர்க்கலாம். இங்கு மீண்டும் திரும்பிவர முடியாத மரணப் பயணத்தை இந்தச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேய இணைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: שְׁנוֹת מִסְפָּר
  choice: இன்னும் சில ஆண்டுகளே
  rationale: சொல்லுக்குச் சொல் ‘எண்ணிக்கையின் ஆண்டுகள்’ என்றாலும், எண்ணிக்கையில் குறைந்த அல்லது வரம்புக்குட்பட்ட ஆண்டுகளைக் குறிக்கும் மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது. சூழலில் எஞ்சியிருக்கும் காலம் குறுகியது என்பதால் ‘இன்னும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: יֶאֱתָיוּ
  choice: வரும்
  rationale: ‘வருதல்/வந்தடைவது’ என்ற வினையின் எளிய எதிர்காலப் பொருளைப் பாதுகாக்கிறது; ‘ஆண்டுகள்’ எழுவாயாகவே நிற்கின்றன.
- source_word: וְאֹרַח
  choice: அதன்பின் ... பாதையில்
  rationale: אֹרַח என்பதன் உருவகமான ‘பாதை’ என்ற படிமம் பாதுகாக்கப்பட்டுள்ளது. தொடர்ச்சியைத் தமிழில் இயல்பாக்க ‘அதன்பின்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא אָשׁוּב
  choice: நான் திரும்பிவராத
  rationale: ‘நான் திரும்பமாட்டேன்’ என்ற மூலப் பொருளை பாதையுடன் தொடர்புபடுத்தி, மீளமுடியாத பயணத்தை இயல்பான தமிழ் உறவெச்சத் தொடராகத் தருகிறது.
- source_word: אֶהֱלֹךְ
  choice: செல்வேன்
  rationale: הלך என்பதன் ‘போ/நட’ என்ற எளிய எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: திரும்பிவராத பாதை குறிக்கும் இலக்கு
  choice: முதன்மை உரையில் ‘பாதை’ என்ற உருவகம் விளக்கப்படாமல் பாதுகாக்கப்பட்டது.
  alternative: ‘மரணப் பாதை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: சூழல் மரணத்தை நோக்கிய மீளமுடியாத பயணத்தைக் குறித்தாலும், எபிரேய உரை இவ்வசனத்தில் ‘மரணம்’ என்று நேரடியாகச் சொல்லவில்லை; ஆகவே உருவகத்தைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்க எளிதான, அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சில ஆண்டுகளே’ என்பதில் குறுகிய காலம் வலியுறுத்தப்படுகிறது; ‘பாதை’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது.
