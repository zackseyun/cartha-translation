translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, கண்ணியமான கவிதைநடை. எபிரேயத்தின் ஒருமை ‘என் கண்’ மற்றும் கடவுளை நோக்கிய திசை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. முதல் அரையடியின் சுருக்கமான பெயர்ச்சொல் அமைப்பு தமிழில் தெளிவாக அமைய விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
