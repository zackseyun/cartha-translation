  yaml_path: translation/ot/job/016/020.yaml
  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: ta
  text: என் நண்பர்கள் என்னைப் பரிகசிப்பவர்கள்[a]; என் கண் கடவுளை நோக்கிக் கண்ணீர் வடிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் நண்பர்கள் எனக்காகப் பரிந்து பேசுபவர்கள்/நடுவர்கள்.’ מְלִיצַי என்ற எபிரேயச் சொல்லைச் சிலர் நேர்மறையான பொருளில் புரிந்துகொள்கிறார்கள்; எனினும், இச்சூழலில் யோபுவின் புலம்பலுக்கு ‘பரிகசிப்பவர்கள்’ என்ற எதிர்மறைப் பொருள் நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: என்னைப் பரிகசிப்பவர்கள்
  rationale: இச்சொல் பரிகசிப்போர் அல்லது ஏளனம் செய்வோர் என்ற எதிர்மறைப் பொருளைக் கொள்ளலாம். யோபுவின் நண்பர்கள் அவருக்கு எதிராகப் பேசும் இச்சூழலில் இந்தப் பொருள் பொருத்தமாக உள்ளது; நடுவர் அல்லது பரிந்துரைப்பவர் என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֵעָי
  choice: என் நண்பர்களே
  rationale: רֵעַ என்பதன் இயல்பான பொருள் நண்பர் அல்லது தோழர். எபிரேய வாக்கியத்தின் பெயர்ச்சொல் கூறுகளை இயல்பான தமிழில் இணைக்க விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது; நண்பர்களாக இருக்க வேண்டியவர்களே பரிகசிப்பவர்கள் என்ற முரண்பாடும் தக்கவைக்கப்படுகிறது.
- source_word: אֶל אֱלוֹהַ
  choice: கடவுளை நோக்கி
  rationale: אֶל திசைநோக்கிய இயக்கத்தைக் குறிக்கிறது; אֱלוֹהַ யோபு நூலில் கடவுளைக் குறிக்கும் ஒருமைச் சொல். ‘கடவுளை நோக்கி’ என்பது கண்ணீரின் இறைநோக்கிய திசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: דָּלְפָה
  choice: கண்ணீர் வடிக்கிறது
  rationale: வினைச்சொல் சொட்டுதல் அல்லது வழிதலைக் குறிக்கிறது. ‘கண்’ எழுவாயாக வரும்போது, தொடர்ச்சியான அழுகையையும் திரவம் வழியும் படிமத்தையும் இயல்பான தமிழில் ‘கண்ணீர் வடிக்கிறது’ வெளிப்படுத்துகிறது.
- source_word: עֵינִי
  choice: என் கண்
  rationale: மூல எபிரேயத்தில் ஒருமை உள்ளது. கவிதைநயமான உயிர்ப்பையும் மூலவடிவையும் காக்க தமிழிலும் ஒருமை தக்கவைக்கப்பட்டுள்ளது.
