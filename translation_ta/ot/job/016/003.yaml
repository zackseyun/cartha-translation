source:
  edition: WLC
  text: הֲ/קֵ֥ץ לְ/דִבְרֵי ר֑וּחַ א֥וֹ מַה יַּ֝מְרִֽיצְ/ךָ֗ כִּ֣י תַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: ta
  text: காற்றைப் போன்ற வெற்றுப் பேச்சுக்கு முடிவே இல்லையா? அல்லது இப்படி மறுமொழி சொல்ல உன்னைத் தூண்டுவது என்ன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறுமொழி சொல்ல உனக்குத் துணிவூட்டுவது என்ன?”
    reason: יַמְרִיצְךָ என்ற வினைச்சொல் ‘தூண்டுவது’ என்றும் ‘துணிவூட்டுவது’ என்றும் புரிந்துகொள்ளப்படலாம்; மூலத்தின் பொருள் நுட்பத்தைப் பாதுகாக்க மாற்று வாசிப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: הֲקֵץ
  choice: முடிவே இல்லையா?
  rationale: קֵץ என்பது ‘முடிவு, எல்லை’ என்று பொருள்படும். கேள்வி உருபும் சூழலும் சேர்ந்து சலிப்பையும் கண்டனத்தையும் வெளிப்படுத்துவதால், இயல்பான தமிழில் ‘முடிவே இல்லையா?’ என அமைக்கப்பட்டது.
- source_word: לְדִבְרֵי רוּחַ
  choice: காற்றைப் போன்ற வெற்றுப் பேச்சுக்கு
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘காற்றின் வார்த்தைகள்.’ உரையின் உருவகத்தைத் தக்கவைத்தபடியே அதன் பொருளற்ற, சாரமற்ற தன்மையைத் தெளிவாக்க ‘காற்றைப் போன்ற வெற்றுப் பேச்சு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אוֹ
  choice: அல்லது
  rationale: இரண்டாவது வினாவை அறிமுகப்படுத்தும் எளிய பிரிநிலை இணைப்புச் சொல்.
- source_word: מַה
  choice: என்ன?
  rationale: பதில் கூறத் தூண்டும் காரணத்தை அல்லது உந்துதலை நேரடியாக வினவும் இடைச்சொல்.
- source_word: יַמְרִיצְךָ
  choice: உன்னைத் தூண்டுவது
  rationale: இங்குள்ள மரץ வினையின் ஹிஃபில் வடிவம் ஒருவரை உந்துதல் அல்லது பதிலளிக்கத் தூண்டுதல் என்ற பொருளைத் தரலாம். எதிர்மறையான தொனியை அளவுக்கு மீறி முடிவுசெய்யாமல் ‘தூண்டுவது’ எனத் தரப்பட்டது; ‘துணிவூட்டுவது’ என்பதும் சாத்தியம்.
- source_word: כִּי
  choice: இப்படி ... சொல்ல
  rationale: இங்கு பதிலளிப்பதற்கான உந்துதலுடன் அடுத்த வாக்கியத்தை இணைக்கிறது. தமிழில் நோக்கம்/விளைவு சார்ந்த இயல்பான வாக்கிய அமைப்பாகக் கொடுக்கப்பட்டது.
- source_word: תַעֲנֶה
  choice: மறுமொழி சொல்ல
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதில் சொல், மறுமொழி கூறு.’ சூழலிலுள்ள கண்டனத் தொனியை இயல்பாக வெளிப்படுத்த ‘இப்படி’ சேர்க்கப்பட்டது.
