translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், யோபுவின் சலிப்பும் கண்டனமும் வெளிப்படும் கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘காற்று’ உருவகம் பாதுகாக்கப்பட்டு, அதன் கருத்தை வாசகர் உடனடியாக உணர ‘வெற்றுப் பேச்சு’ எனத் தெளிவாக்கப்பட்டது.
