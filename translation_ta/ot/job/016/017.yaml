translation:
  language: ta
  text: என் கைகளில் வன்முறை இல்லாதிருந்தும்[a], என் ஜெபம் தூய்மையானது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் என் கைகளில் வன்முறை இல்லை.” எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்; முதன்மை உரை சூழலின் அடிப்படையில் விட்டுக்கொடுக்கும் பொருளை ஏற்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சுத்தமானது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: இல்லாதிருந்தும்
  rationale: சூழலில், யோபின் துன்பத்திற்கும் அவர் வலியுறுத்தும் குற்றமின்மைக்கும் இடையிலான முரண்பாட்டைக் காட்டும் விட்டுக்கொடுப்பு பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளது. எபிரெய முன்னிடைச்சொல்லின் வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא
  choice: இல்லாத
  rationale: חָמָס என்பதுடன் சேர்ந்து, ‘வன்முறை இல்லை’ என்ற இயல்பான தமிழ் மறுப்புநிலையை உருவாக்குகிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: இச்சொல் வன்முறை, அநீதி, தீங்கு ஆகிய பொருள்களைக் கொண்டது. ‘வன்முறை’ அதன் நேரடியான பொருளையும் ஒழுக்கக் குற்றத்தின் வலிமையையும் காக்கிறது.
- source_word: בְּכַפָּי
  choice: என் கைகளில்
  rationale: எபிரெய மொழியின் தெளிவான கை உருவகத்தையும், ஒருவருடைய செயல்களுக்கான பொறுப்பு என்ற உட்பொருளையும் பாதுகாக்கிறது.
- source_word: וּתְפִלָּתִי
  choice: என் மன்றாட்டு
  rationale: תְּפִלָּה என்பது தேவனை நோக்கிய வேண்டுதல் அல்லது ஜெபத்தைக் குறிக்கிறது. யோபின் சூழலில் ‘மன்றாட்டு’ அவரது வேண்டுகோள் மற்றும் முறையீடு ஆகிய இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זַכָּה
  choice: தூய்மையானது
  rationale: இப்பெயரடை சுத்தமான அல்லது தூய தன்மையைக் குறிக்கிறது. ‘தூய்மையானது’ என்பது மன்றாட்டின் ஒழுக்க நேர்மையைச் சொல்கிறது; முழுமையான பாவமின்மையைத் தேவையின்றி வலியுறுத்துவதில்லை.
theological_decisions:
- issue: யோபு தன் குற்றமின்மையைப் பற்றிக் கூறுவது
  choice: ‘என் கைகளில் வன்முறை இல்லாதிருந்தும், என் மன்றாட்டு தூய்மையானது’ என்று, இச்சூழலில் சாட்டப்படும் வன்முறைக் குற்றத்தை மறுக்கும் வரையறுக்கப்பட்ட தற்காப்புக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை யோபு முழுமையாகப் பாவமற்றவர் என்ற முழுமையான கூற்றாகவோ, சடங்குசார் தூய்மையை மட்டும் குறிக்கும் பலவீனமான கூற்றாகவோ எடுத்துக்கொள்ளலாம்.
  rationale: மூலவசனம் யோபின் வன்முறையின்மையையும் அவரது மன்றாட்டின் தூய்மையையும் இணைக்கிறது. மொழிபெயர்ப்பு அந்தத் தற்காப்பையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது; முழுமையான பாவமின்மை பற்றிய கோட்பாட்டை அதில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் கைகளில்’ என்ற எபிரெய உருவகம் அப்படியே காக்கப்பட்டுள்ளது; ‘மன்றாட்டு’ என்பது யோபின் ஜெபத்திலும் முறையீட்டிலும் உள்ள நுணுக்கத்தை வெளிப்படுத்துகிறது.
