  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: ta
  text: நீங்கள், “அவனை நாம் எப்படித் துரத்துவோம்? ஏனெனில், இந்தக் காரியத்தின் வேர் என்னில் காணப்படுகிறது” என்று சொன்னால்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை இங்கு கடினமானது. மெய்யெழுத்து உரையையும் பழங்கால மொழிபெயர்ப்புகளையும் எவ்வாறு மதிப்பிடுகிறோம் என்பதைப் பொறுத்து, இறுதிக் கூறை “இந்தக் காரியத்தின் வேர் அவனில் காணப்படுகிறது” என்றும் புரிந்துகொள்ளலாம். “துரத்துவோம்” என்பதற்கு “துன்புறுத்துவோம்” என்ற வலுவான பொருளும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: சொன்னால்
  rationale: இங்கு எதிரிகள் கூறக்கூடிய ஒரு நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று சொன்னால்’ இயல்பாக உள்ளது.
- source_word: תֹאמְרוּ
  choice: நீங்கள் ... சொன்னால்
  rationale: Qal imperfect இரண்டாம் நபர் பன்மை; நிபந்தனைச் சூழலில் நிகழ்/எதிர்கால வாய்ப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַה
  choice: எப்படி
  rationale: வினையுடன் வரும் வினாவடையாக ‘எவ்வாறு?’ என்ற பொருள் தருகிறது.
- source_word: נִּרְדָּף
  choice: நாம் ... துரத்துவோம்
  rationale: רדף என்பதன் துரத்துதல்/பின்தொடர்தல் என்ற உருவகத்தைப் பேணுகிறது; சூழலில் துன்புறுத்தும் நுண்பொருளும் உணரப்படலாம்.
- source_word: לוֹ
  choice: அவனை
  rationale: רדף உடன் ל துரத்தப்படுகிற நபரைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருள் இயல்பானது.
- source_word: וְשֹׁרֶשׁ
  choice: வேர்
  rationale: இணைப்புச்சொல்லின் விளக்கத் தொடர்பை தமிழ் வாக்கிய அமைப்பு வெளிப்படுத்துகிறது; שֹׁרֶשׁ என்பதன் உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: דָּבָר
  choice: இந்த விவகாரத்தின்
  rationale: இங்கு பேசப்படும் பிரச்சினை அல்லது வழக்கைக் குறிக்கிறது; ‘விவகாரம்’ நவீனத் தமிழில் தெளிவானது.
- source_word: נִמְצָא
  choice: காணப்படுகிறது
  rationale: Niphal வடிவத்தின் செயப்பாட்டு/முடிவுநிலைப் பொருளைப் பேணுகிறது.
- source_word: בִי
  choice: என்னிடமே
  rationale: மசோரெட்டிக் உரையின் முதல் நபர் வாசிப்பைத் தக்கவைக்கிறது; -மே என்பது குற்றத்தின் அடிப்படை யோபுவிடமே இருப்பதாக எதிரிகள் கூறும் அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிக் கூறில் ‘என்னில்/என்னிடம்’ அல்லது ‘அவனில்/அவனிடம்’ என்ற வாசிப்பு
  choice: மசோரெட்டிக் உரைக்கேற்ப ‘என்னிடமே’
  alternative: ‘அவனிடமே’
  rationale: WLC உயிர்க்குறியிட்ட உரை בִי, ‘என்னில்/என்னிடம்’ என வாசிக்கிறது. ஆனால் வாக்கியத்தின் நபர்மாற்றம் கடினமானதால், மெய்யெழுத்து உரை மற்றும் பழங்கால மொழிபெயர்ப்புகள் எவ்வாறு மதிப்பிடப்படுகின்றன என்பதன்படி மூன்றாம் நபர் விளக்கம் சாத்தியம்; அதை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடை. ‘விவகாரத்தின் வேர்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் தொடர்வதை உணர்த்த இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; [a] குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
