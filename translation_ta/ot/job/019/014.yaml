translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் கூறில் மூலத்தின் சுருக்கமான ‘ஒழிந்தனர்’ என்ற மொழிநடையை அப்படியே கடினமாக்காமல், உறவுசார் கைவிடுதலை வெளிப்படுத்தும் ‘என்னைவிட்டு விலகிவிட்டார்கள்’ பயன்படுத்தப்பட்டுள்ளது; மாற்று நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
