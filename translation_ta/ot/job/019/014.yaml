  source_fidelity: மூல எபிரேயத்தின் இணையான இரண்டு கூறுகளும் காக்கப்பட்டுள்ளன. “என் உறவினர் என்னைவிட்டு விலகிவிட்டார்கள்” என்பது חָדְלוּ-வின் சூழல்சார் ‘இனி உடனிருக்க/ஆதரிக்க இல்லை’ என்ற பொருளை நன்றாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு அதன் நேரடியான ‘ஒழிந்தனர்/இல்லாமல் போயினர்’ என்ற வாய்ப்பையும் பாதுகாக்கிறது. “எனக்கு அறிமுகமானவர்கள் என்னை மறந்துவிட்டார்கள்” என்பது וּמְיֻדָּעַי ... שְׁכֵחוּנִי என்பதற்குத் துல்லியமானது.
