source:
  edition: WLC
  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: ta
  text: என் உறவினர் என்னைவிட்டு விலகிவிட்டார்கள்[a]; எனக்கு அறிமுகமானவர்கள் என்னை மறந்துவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நெருங்கியவர்கள் இல்லாமல் போயினர்.”
    reason: חדל என்பதற்கு ‘நின்றுபோதல்/இல்லாமல் போதல்’ என்ற நேரடிப் பொருளும், קרוב என்பதற்கு ‘நெருங்கியவர்’ என்ற விரிவான பொருளும் இருப்பதால் இந்த மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: חָדְלוּ
  choice: என்னைவிட்டு விலகிவிட்டார்கள்
  rationale: חדל என்பதன் அடிப்படைப் பொருள் ‘நிறுத்து/ஒழி’. ‘என் உறவினர்’ என்பதுடன் இங்கு அவர்கள் யோபுடன் இருந்த உறவையும் ஆதரவையும் தொடராமல் விலகியதைக் குறிக்கிறது; இயல்பான தமிழில் இதை ‘என்னைவிட்டு விலகிவிட்டார்கள்’ என வழங்குகிறது.
- source_word: קְרוֹבָי
  choice: என் உறவினர்
  rationale: קרוב என்பது அடிப்படையில் ‘நெருக்கமானவர்’; இச்சூழலில் உறவினரை அல்லது நெருங்கிய சொந்தத்தாரைக் குறிக்கிறது. ‘உறவினர்’ என்பது தெளிவான, நவீனத் தமிழ்ச் சொல்.
- source_word: וּמְיֻדָּעַי
  choice: எனக்கு அறிமுகமானவர்கள்
  rationale: ידע இலிருந்து உருவான இச்சொல் ‘எனக்குத் தெரிந்தவர்கள்’ என்ற பொருளைத் தருகிறது. ‘நண்பர்கள்’ என்று நெருக்கத்தை மிகைப்படுத்தாமல், ‘அறிமுகமானவர்கள்’ மூலத்தின் பரப்பை காக்கிறது.
- source_word: שְׁכֵחוּנִי
  choice: என்னை மறந்துவிட்டார்கள்
  rationale: שכח என்பதன் நேரடிப் பொருள் ‘மறத்தல்’. யோபின் புலம்பலின் வலிமையையும் நேரடித் தன்மையையும் இந்தத் தேர்வு காக்கிறது.
