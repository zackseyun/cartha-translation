  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: ta
  text: 'அவர் என் வழியைச் சுவர் எழுப்பி அடைத்தார்;

    என்னால் கடந்து செல்ல முடியாது.[a]

    என் பாதைகளின்மேல் இருளை வைக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுவாய்ப் பெயர்ச்சொல் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் யோபு தேவனைப் பற்றிப் பேசுகிறார்; ஆனால் இந்த வசனம் அவரை பெயரிட்டு குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: என் வழி
  rationale: ஒரு சாலை, பாதை அல்லது வாழ்க்கைப் போக்கைக் குறிக்கக்கூடிய சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: גָדַר
  choice: சுவரெழுப்பி அடைத்தார்
  rationale: சுவர் எழுப்புதல், வேலியிடுதல் அல்லது வழியை அடைத்தல் என்ற உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது; ‘அடைத்தார்’ என்பது அதன் விளைவை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וְלֹא אֶעֱבוֹר
  choice: அதனால் என்னால் கடந்து செல்ல முடியவில்லை
  rationale: முன்னுள்ள தடையின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; עבר என்பதன் ‘கடந்து செல்லுதல்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: נְתִיבוֹתַי
  choice: என் பாதைகள்
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, செல்லும் வழிகளையும் வாழ்க்கையின் போக்குகளையும் குறிக்கக்கூடிய கவித்துவப் படிமத்தைத் தருகிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: சொல்லின் நேரடிப் பொருளையும் அதன் உருவகச் சாத்தியத்தையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: יָשִׂים
  choice: வைத்தார்
  rationale: ‘வை, இடு’ என்ற வினையின் எளிய நேரடிப் பொருள்; பாதைகளின்மேல் இருள் வைக்கப்படும் மூலப்படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை எழுவாயின் குறிப்பு
  choice: அவர்
  alternative: தேவன் / யெகோவா
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாகப் பெயரிடப்படாமல் ஆண்பால் ஒருமையாக உட்கிடையாக உள்ளது. சூழலில் யோபு தேவனைப் பற்றிப் பேசுகிறார்; ஆனாலும் வசனத்தில் இல்லாத இறைப்பெயரைச் சேர்க்காமல், அந்த உட்கிடையான குறிப்பை ‘அவர்’ எனப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சுவரெழுப்பி அடைத்தார்’ என்பது மூலத்தின் உறுதியான தடுப்பு படிமத்தைத் தக்கவைக்கிறது; இரண்டாம் அடியின் சொல் ஒழுங்கு கவித்துவ வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
