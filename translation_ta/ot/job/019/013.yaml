base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: ta
  text: அவர் என் சகோதரர்களை என்னைவிட்டு வெகுதூரமாக்கினார்[a]; என்னை அறிந்தவர்கள் முற்றிலும் எனக்கு அந்நியராயினர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் என் சகோதரர்களை என்னிடமிருந்து அகற்றினார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னை அறிந்தவர்கள் முற்றிலும் என்னைவிட்டு அந்நியப்பட்டனர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: என் சகோதரர்களை
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில், முதலாம் நபர் ஒருமை உடைமை விகுதியுடன், நேரடியாக ‘என் சகோதரர்கள்’ எனப் பொருள்படுகிறது. உறவினர்களை விரிவாகக் குறிக்கக்கூடும் என்றாலும், மூலச்சொல்லின் வடிவத்தையும் உறவின் வலிமையையும் இது பாதுகாக்கிறது.
- source_word: מֵעָלַי
  choice: என்னைவிட்டு
  rationale: הִרְחִיק என்பதுடன் இணைந்து, யோபின் அருகாமையிலிருந்தோ உறவுச் சூழலிலிருந்தோ அகற்றப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הִרְחִיק
  choice: வெகுதூரமாக்கினார்
  rationale: רחק என்பதன் ஹிஃபில் வடிவம் ‘தூரமாகும்படி செய்தார்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘வெகுதூரமாக்கினார்’ என்பது அந்த காரணவினையையும் புலம்பலின் தீவிரத்தையும் காக்கிறது.
- source_word: וְיֹדְעַי
  choice: என்னை அறிந்தவர்கள்
  rationale: ‘என்னை அறிபவர்கள்’ என்ற மூலத்தின் தெளிவான பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘அறிமுகமானவர்கள்’ என்று குறுகலாக வரையறுக்கவில்லை.
- source_word: אַךְ
  choice: முற்றிலும்
  rationale: இங்கு அடுத்துவரும் நிலையை வலியுறுத்தி, அந்நியமாதலின் முழுமையைச் சுட்டுகிறது.
- source_word: זָרוּ
  choice: அந்நியராயினர்
  rationale: Qal perfect பன்மை வடிவம், ‘அந்நியராகிவிட்டனர்/அந்நியரைப்போல் நடந்துகொண்டனர்’ என்ற விளைவு நிலையை உணர்த்துகிறது. ‘அந்நியராயினர்’ என்பது அதைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: מִמֶּנִּי
  choice: எனக்கு
  rationale: மூலத்தில் מן பிரிவைச் சுட்டினாலும், זָרוּ உடன் தமிழில் ‘எனக்கு அந்நியராயினர்’ என்பது இயல்பாக உறவுப் பிரிவை வெளிப்படுத்துகிறது; மாற்றாக ‘என்னைவிட்டு அந்நியப்பட்டனர்’ என்று கூறலாம்.
theological_decisions:
- issue: הִרְחִיק என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று மூலத்தின் மூன்றாம் நபர் ஒருமை எழுவாயை மட்டும் வைத்தல்
  alternative: ‘தேவன்’ என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: எபிரெய வினையின் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; உடனடிச் சூழலில் யோபு தேவனுடைய செயலைக் குற்றஞ்சாட்டுவது தெளிவாக இருந்தாலும், வசனத்திலேயே ‘தேவன்’ எனச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வெகுதூரமாக்கினார்’ காரணவினைத் தீவிரத்தைத் தக்கவைக்கிறது; ‘அந்நியராயினர்’ உறவு முறிவை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
