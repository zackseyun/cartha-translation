translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலின் நேரடியான கேள்வி வடிவமும் கவிதைத் தீவிரமும் காக்கப்பட்டுள்ளன. ‘என் உள்ளத்தை’ என்பது மூலத்தின் נַפְשִׁי-ஐ வெளிப்படையாகப் பிரதிபலிக்கிறது; ‘சொற்களால் என்னை நொறுக்குவீர்கள்’ என்பது இரண்டாம் பன்மையின் குற்றஞ்சாட்டும் தொனியையும் வன்மையான உருவகத்தையும் தக்கவைக்கிறது.
