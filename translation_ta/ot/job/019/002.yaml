base_translation:
  language: en
  yaml_path: translation/ot/job/019/002.yaml
  text: How long will you torment me and crush me with words?[a]
translation:
  language: ta
  text: எவ்வளவு காலம் என் உள்ளத்தை வேதனைப்படுத்தி, சொற்களால் என்னை நொறுக்குவீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவ்வளவு காலம் என் உயிரைத் துயருறச் செய்து, சொற்களால் என்னை நொறுக்குவீர்கள்?”
    reason: נֶפֶשׁ என்பதற்கு ‘உள்ளம்,’ ‘உயிர்,’ அல்லது முழு மனிதர் என்ற பொருளும், תּוֹגְיוּן என்பதற்கு ‘வேதனைப்படுத்துதல்’ அல்லது ‘துயருறச் செய்தல்’ என்ற பொருளும் அமையக்கூடியதால் இந்த மாற்று மொழிபெயர்ப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: עַד אָ֭נָה
  choice: எவ்வளவு காலம்
  rationale: எபிரெய மொழியின் காலத்தைப் பற்றிய புலம்பல் வினாவை இயல்பான நவீன தமிழில் சொல்லி, அதன் சொல்லாட்சியின் வலிமையையும் காக்கிறது.
- source_word: תּוֹגְיוּן
  choice: வேதனைப்படுத்தி
  rationale: இச்சூழலில் நண்பர்களின் பேச்சு யோபுவுக்கு ஏற்படுத்தும் தொடர்ச்சியான உள்ளார்ந்த துயரைக் குறிக்கிறது; ‘வேதனைப்படுத்தி’ என்பது துயருறச் செய்தல், வருத்துதல் ஆகிய பொருள் நிழல்களைத் தாங்குகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளத்தை
  rationale: נֶפֶשׁ இங்கு யோபுவின் உள்ளார்ந்த தன்மையையோ அவரையே முழுமையாகவோ குறிக்கலாம். ‘என் உள்ளத்தை’ என்பது எபிரெயச் சொல்லின் வெளிப்பாட்டைத் தக்கவைத்து, தமிழில் உடல்–ஆன்மா என்ற தேவையற்ற பிரிவை வலியுறுத்தாமல் உள்ளார்ந்த வேதனையைத் தெரிவிக்கிறது.
- source_word: וּתְדַכְּאוּנַנִי
  choice: என்னை நொறுக்குவீர்கள்
  rationale: דכא என்பதிலுள்ள நசுக்குதல் அல்லது முறித்துப்போடுதல் என்ற வலுவான உருவகத்தை ‘நொறுக்குவீர்கள்’ இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְמִלִּים
  choice: சொற்களால்
  rationale: בְ இங்கு கருவிப் பொருளில் வருகிறது; அவர்களுடைய சொற்களே யோபுவை நொறுக்கும் கருவி என்பதை ‘சொற்களால்’ நேரடியாகக் காட்டுகிறது.
