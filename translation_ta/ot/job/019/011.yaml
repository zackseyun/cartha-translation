  text: וַ/יַּ֣חַר עָלַ֣/י אַפּ֑/וֹ וַ/יַּחְשְׁבֵ֖/נִי ל֣/וֹ כְ/צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: ta
  text: எனக்கு எதிராக அவருடைய கோபம் மூண்டது[a]; அவர் என்னைத் தம் பகைவர்களில் ஒருவனாகக் கருதினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கோபம் எனக்கு எதிராகப் பற்றியெரிந்தது; அவர் என்னைத் தம் பகைவர்களில் ஒருவனாக எண்ணினார்.”
    reason: חרה עם אף என்ற மரபுத்தொடரை ‘பற்றியெரிந்தது’ அல்லது ‘மூண்டது’ என மொழிபெயர்க்கலாம்; חשב என்பதற்கு ‘கருதினார்’ அல்லது ‘எண்ணினார்’ என்பதும் சாத்தியம்.
lexical_decisions:
- source_word: וַיַּחַר
  choice: பற்றியெரிந்தது
  rationale: חרה என்பதும் אַף என்பதும் சேர்ந்து கோபம் மூள்வதை அல்லது எரிவதைச் சித்தரிக்கும் மரபுத்தொடராகும். ‘பற்றியெரிந்தது’ அந்த உருவகத்தையும் எபிரெய இறந்தகால வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: கோபத்துடன் வரும் עַל, ஒருவரை நோக்கிய பகைமை அல்லது எதிர்ப்பைக் குறிக்கிறது; ‘எனக்கு எதிராக’ என்பது அந்தத் திசையையும் பகைமையையும் தெளிவாகத் தருகிறது.
- source_word: אַפּוֹ
  choice: அவருடைய கோபம்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இம்மரபுத்தொடரில் அது கோபத்தைக் குறிக்கிறது. ‘கோபம்’ என்பது தெளிவான, நவீன தமிழ்ச் சொல்.
- source_word: וַיַּחְשְׁבֵנִי
  choice: அவர் என்னைக் கருதினார்
  rationale: חשב இங்கு ஒருவரை ஒரு குறிப்பிட்ட நிலையில் எண்ணுதல் அல்லது மதித்தல் என்பதைக் குறிக்கிறது. ‘கருதினார்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לוֹ
  choice: தம்
  rationale: לוֹ இங்கு தேவனுடைய பார்வையில் அல்லது அவருடனான உறவில் என்பதைக் காட்டுகிறது. எழுவாய் தேவன் என்பதால் மரியாதைமிக்க தற்சுட்டுப் பெயரடையான ‘தம்’ இயல்பாக அமைகிறது.
- source_word: כְצָרָיו
  choice: தம் பகைவர்களில் ஒருவனாக
  rationale: צָרָיו என்பது சொற்பட ‘அவருடைய பகைவர்கள்’ என்ற பன்மை. தமிழில் ‘என்னைத் தம் பகைவர்களாக’ என்பது எண்ணிக்கை முரண்பாட்டால் இயல்பற்றது; ‘பகைவர்களில் ஒருவனாக’ என்பது பன்மைக் குழுவில் யோபு சேர்த்தெண்ணப்படுவதைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் எழுவாய் மற்றும் பின்னொட்டுகளின் சுட்டுப்பொருள்
  choice: முந்தைய சூழலின் தொடர்ச்சியாக எழுவாய் தேவனையே குறிக்கிறது; யோபு, தேவன் தமக்கு எதிராகச் செயல்படுவதாக முறையிடுகிறார்.
  alternative: குறிப்பிடப்படாத ஒரு பகைமைமிக்க செயற்பாட்டாளர்
  rationale: யோபு 19:6-12 சூழலில் இச்செயல்களை யோபு தொடர்ந்து தேவனுக்கே உரியவையாகக் கூறுகிறார். அந்தக் கடுமையான இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறந்தகால எபிரெய வினைவடிவங்கள் இறந்தகாலத்திலேயே தரப்பட்டுள்ளன. ‘தம்’ என்பது தேவனைக் குறிக்கும் எழுவாயுடன் இயல்பான மரியாதைத் தற்சுட்டாகப் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பகைவர்கள் என்ற பன்மை ‘பகைவர்களில் ஒருவனாக’ எனக் காக்கப்பட்டுள்ளது.
