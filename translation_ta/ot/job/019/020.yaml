  yaml_path: translation/ot/job/019/020.yaml
  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: ta
  text: என் எலும்பு என் தோலோடும் சதையோடும் ஒட்டிக்கொண்டிருக்கிறது[a]; என் பற்களின் தோலால் நான் தப்பியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘என் எலும்பு’ என்று ஒருமையில் உள்ளது; அது யோபுவின் எலும்புக்கூட்டை மொத்தமாகக் குறிக்கும் கூட்டொருமையாக இருக்கலாம். ‘என் எலும்புகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பற்களின் தோல்’ என்ற எபிரெய உருவகம், மிகக் குறுகிய அளவில்—மயிரிழையில்—தப்பியதைக் குறிக்கிறது. ‘என் பற்களின் தோலோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: என் தோலோடும் சதையோடும்
  rationale: עוֹר என்பது ‘தோல்,’ בשר என்பது இங்கு உடல்சார்ந்த பொருளில் ‘சதை.’ דבק உடன் வரும் ב முன்னிடைச்சொல்லின் உறவைக் இயல்பான தமிழில் ‘-ஓடும்’ என வெளிப்படுத்துவது, எலும்பு தோலிலும் சதையிலும் ஒட்டியிருக்கும் யோபுவின் மெலிந்த நிலையைத் தெளிவாக்குகிறது.
- source_word: דָּבְקָה עַצְמִי
  choice: என் எலும்பு ... ஒட்டிக்கொண்டிருக்கிறது
  rationale: עַצְמִי மூலத்தில் ஒருமையில் உள்ளது; அது முழு எலும்புக்கூட்டையும் கூட்டொருமையாகக் குறிக்கக்கூடும். דבק-இன் இறுக ஒட்டியிருத்தல் என்ற கருத்தை ‘ஒட்டிக்கொண்டிருக்கிறது’ இயல்பாகத் தருகிறது.
- source_word: וָאֶתְמַלְּטָה
  choice: நான் தப்பியிருக்கிறேன்
  rationale: מלט தப்புதல் அல்லது விடுபடுதலைக் குறிக்கிறது. நிறைவுற்ற செயலின் தற்போதைய விளைவைத் தமிழில் ‘தப்பியிருக்கிறேன்’ பொருத்தமாகக் காட்டுகிறது; ‘மயிரிழையில்’ போன்ற விளக்கச் சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּעוֹר שִׁנָּי
  choice: என் பற்களின் தோலால்
  rationale: எபிரெய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. தமிழில் இது வழக்கமான மரபுத்தொடர் அல்லாததால், மிகக் குறுகிய தப்பிப்பைக் குறிக்கும் அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
