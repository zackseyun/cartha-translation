translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் உடல் மெலிவையும் மூலத்தின் அசாதாரணமான ‘பற்களின் தோல்’ உருவகத்தையும் செம்மையான ஆனால் எளிதில் புரியக்கூடிய நடையில் பாதுகாக்கப்பட்டுள்ளது. ஒருமை ‘எலும்பு’ மூலவடிவைத் தக்கவைக்கிறது; உருவகத்தின் பொருளை முதன்மை உரையில் தீர்த்துவிடாமல் அடிக்குறிப்பு விளக்குகிறது.
