base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: ta
  text: இதோ, “வன்முறை!”[a] என்று நான் கூக்குரலிடுகிறேன்; ஆனால் எனக்குப் பதில் கிடைப்பதில்லை. உதவிக்காகக் கூக்குரலிடுகிறேன்[b]; ஆனால் நீதி[c] கிடைப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அநீதி!” அல்லது “கொடுமை!” எபிரெயச் சொல் வன்முறை, தவறான செயல், அல்லது அநீதிக்கு எதிரான சட்ட முறையீட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உதவிக்காகக் கூப்பிடுகிறேன்.” இவ்வினைச்சொல் உதவி கோரும் அவசரமான மன்றாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “நியாயத்தீர்ப்பு” அல்லது “சட்டரீதியான நிவாரணம்.” எபிரெயச் சொல் நீதி அல்லது முறையான தீர்ப்பு என்ற சட்டப் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயச் சொல்லின் சுட்டும் தன்மையை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶצְעַק
  choice: நான் கூக்குரலிடுகிறேன்
  rationale: צעק என்பது துயரத்தில் எழுப்பப்படும் உரத்த, அவசரமான கூக்குரலைக் குறிக்கிறது; இத்தேர்வு அதன் ஒலியையும் தீவிரத்தையும் காக்கிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: இச்சொல் வன்முறை, அநீதி அல்லது கொடுஞ்செயலைக் குறிக்கலாம். தனக்கு இழைக்கப்பட்ட கொடுமையை முறையிடும் யோபின் சட்டநீதிசார் கூக்குரலில், ‘வன்முறை’ என்பது நேரடியான மொழிபெயர்ப்பு.
- source_word: אֵעָנֶה
  choice: எனக்குப் பதில் கிடைப்பதில்லை
  rationale: ענה என்பதன் நிஃபால் வடிவம் இங்கு ‘பதில் அளிக்கப்படுதல்’ என்று பொருள்படுகிறது. யோபின் கூக்குரலுக்கு மறுமொழி இல்லை என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשַׁוַּע
  choice: உதவிக்காக நான் கதறுகிறேன்
  rationale: இவ்வினைச்சொல் உதவி வேண்டி எழுப்பும் அவசரக் கூக்குரலைக் குறிக்கிறது. ‘கதறுகிறேன்’ என்பது முந்தைய கூக்குரலுடன் உள்ள கவிதை இணைப்பைக் காத்தபடி, உதவிக்கான தீவிர மன்றாட்டை வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இச்சூழலில் நியாயமான விசாரணை, தீர்ப்பு அல்லது நிவாரணம் என்ற சட்ட மற்றும் அறநெறிப் பொருள் உள்ளது. ‘நீதி’ அந்த விரிவை இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளை நோக்கிய யோபின் முறையீட்டின் தன்மை
  choice: பதில் கிடைக்காத முறையீடும் நீதி கிடைக்காத நிலையும் குறித்த யோபின் குற்றச்சாட்டை அதன் முழு வலிமையோடு மொழிபெயர்த்தல்.
  alternative: கடவுள் நீதியை மறுக்கிறார் என்ற பொருள் தோன்றாதவாறு முறையீட்டை மறைமுகமாக அல்லது மென்மையாக மொழிபெயர்த்தல்.
  rationale: வன்முறையை எதிர்த்து யோபு கூக்குரலிட்டும் பதிலும் நீதியும் கிடைக்கவில்லை என்று எபிரெய உரை வெளிப்படையாகக் கூறுகிறது. இந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தணிக்கவோ தீர்த்துவைக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபின் புலம்பலுக்குரிய கண்ணியமும் தீவிரமும் குன்றாத வகையிலும் வடிவமைக்கப்பட்டது. இணையான இரு கூக்குரல்களையும், அவற்றுக்கு எதிராக நிற்கும் ‘பதில் இல்லை / நீதி இல்லை’ என்ற அமைப்பையும் தெளிவாகப் பேணுகிறது.
