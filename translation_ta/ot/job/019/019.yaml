  text: תִּֽ֭עֲבוּ/נִי כָּל מְתֵ֣י סוֹדִ֑/י וְ/זֶֽה אָ֝הַ֗בְתִּי נֶהְפְּכוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/019.yaml
  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: ta
  text: 'என் நம்பிக்கைக்குரிய நெருங்கியவர்கள்[a] அனைவரும் என்னை அருவருக்கிறார்கள்;

    நான் நேசித்தவர்களோ எனக்கு எதிராகத் திரும்பிவிட்டார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் இரகசிய ஆலோசனை வட்டத்தார்.” இச்சொற்றொடர் யோபின் நம்பிக்கைக்குரிய நெருங்கிய தோழர்களை அல்லது அவருடைய அந்தரங்க நம்பிக்கை வட்டத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: என்னை அருவருக்கிறார்கள்
  rationale: תעב என்பது வெறும் வெறுப்பை விட வலுவான அருவருப்பையும் ஒதுக்குதலையும் குறிக்கிறது; தமிழ் புலம்பல் நடையில் “அருவருக்கிறார்கள்” அந்தத் தீவிரத்தை இயல்பாகத் தருகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: முழுக் குழுவையும் உள்ளடக்கும் எபிரெய அளவுச்சொல்லை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְתֵי סוֹדִי
  choice: என் நம்பிக்கைக்குரிய நெருங்கியவர்கள்[a]
  rationale: מְתֵי என்பது ‘மக்கள்/ஆட்கள்’ என்றும் סוֹדִי என்பது யோபின் இரகசிய ஆலோசனை அல்லது நெருக்கமான நம்பிக்கை வட்டம் என்றும் குறிக்கிறது. இந்தத் தேர்வு தனிப்பட்ட நெருக்கத்தையும் நம்பிக்கையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְזֶה אָהַבְתִּי
  choice: நான் நேசித்தவர்களோ
  rationale: זֶה வடிவில் ஒருமையாக இருந்தாலும், அடுத்து வரும் பன்மை வினைச்சொல்லுடனும் முன் கூறப்பட்ட குழுவுடனான இணை அமைப்பிலும் கூட்டுப் பொருள் பெறுகிறது. “நேசித்தவர்களோ” அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶהְפְּכוּ בִי
  choice: எனக்கு எதிராகத் திரும்பிவிட்டார்கள்
  rationale: Niphal வடிவம் நிலைப்பாடு அல்லது உறவு தலைகீழாக மாறியதைக் குறிக்கிறது; בִי சூழலில் பகைமை சார்ந்த ‘எனக்கு எதிராக’ என்ற பொருளைப் பெறுகிறது.
