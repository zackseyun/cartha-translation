translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. “அருவருக்கிறார்கள்” மூல வினையின் கடுமையைத் தக்கவைக்கிறது; “நம்பிக்கைக்குரிய நெருங்கியவர்கள்” என்பது சொற்சொல்லான ‘என் ஆலோசனை/இரகசியத்தின் ஆட்கள்’ என்பதை சாதாரண வாசகருக்குப் புரியும் வகையில் வழங்குகிறது. இரண்டாம் அடியின் “-வர்களோ” எதிர்மறையான உறவு மாற்றத்தைத் தெளிவாகவும் கவிதைநயத்துடனும் இணைக்கிறது.
