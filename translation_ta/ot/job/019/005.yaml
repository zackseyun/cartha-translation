translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமும் கவிதைநடையும் காக்கப்பட்டுள்ளன. இது அடுத்த வசனத்துடன் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. மூலத்தின் மீளுரைப்பும் சட்டவாதச் சாயலும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
