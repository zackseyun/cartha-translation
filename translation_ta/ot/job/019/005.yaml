  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: ta
  text: நீங்கள் உண்மையிலேயே எனக்கு எதிராக உங்களை உயர்த்திக்கொண்டு[a], என் அவமானத்தை எனக்கு எதிரான சான்றாகக் காட்டுவீர்களானால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கு மேலாக உங்களை உயர்த்திக்கொண்டு.’ எபிரெய வினை, மற்றொருவரைத் தாழ்த்தித் தன்னை உயர்த்திக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் அவமானத்தை எனக்கு எதிராக வாதிடுவீர்களானால்’ அல்லது ‘என் அவமானத்தைக் கொண்டே எனக்கு எதிரான வழக்கை நிறுவுவீர்களானால்.’ எபிரெய வினை நிரூபித்தல் அல்லது வழக்கை நிறுவுதல் என்ற நீதிமன்றப் பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: உண்மையிலேயே ... ஆனால்
  rationale: אִם நிபந்தனையை அறிமுகப்படுத்துகிறது; אָמְנָם அதற்கு வலியுறுத்தலைச் சேர்க்கிறது. தமிழில் இயல்பான நிபந்தனைத் தொடராக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: இரு வினைகளுடனும் இது வெறும் இடநிலையைக் குறிக்காமல் பகைமை அல்லது எதிர்நிலையைக் குறிக்கிறது.
- source_word: תַּגְדִּילוּ
  choice: உங்களைப் பெரியவர்களாக்கிக்கொண்டு
  rationale: גדל என்பதன் ஹிஃபில் வடிவிலுள்ள ‘தம்மைப் பெரியவர்களாக்குதல்’ என்ற உருவகத்தையும், யோபுக்கு மேலாகத் தம்மை உயர்த்திக்கொள்ளும் உட்பொருளையும் காக்கிறது.
- source_word: וְתוֹכִיחוּ
  choice: சான்றாகக் காட்டுவீர்களானால்
  rationale: יכח என்பதன் ஹிஃபில் வடிவம் வாதிட்டு நிரூபித்தல் அல்லது ஒரு வழக்கை நிறுவுதல் என்ற நீதிமன்றச் சாயலைக் கொண்டிருக்கலாம்; தமிழில் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֶרְפָּתִי
  choice: என் அவமானத்தையே
  rationale: சமூக இழிவு, பழிப்பு, வெட்கம் ஆகிய பொருள் வட்டத்தை ‘அவமானம்’ நவீனத் தமிழில் தெளிவாக எடுத்துரைக்கிறது; ‘-ஏ’ அது அவருக்கு எதிராகப் பயன்படுத்தப்படுவதை வலியுறுத்துகிறது.
