source:
  edition: WLC
  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: ta
  text: நான் உண்மையாகவே வழிதவறியிருந்தாலும்கூட, என் தவறு என்னிடமே தங்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “என் தவறு என்னுடனே இரவு தங்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אָמְנָם
  choice: உண்மையாகவே ... இருந்தாலும்கூட
  rationale: இச்சொற்றொடர் வலியுறுத்தலுடன் கூடிய விட்டுக்கொடுப்பை அறிமுகப்படுத்துகிறது. தமிழில் ‘உண்மையாகவே ... இருந்தாலும்கூட’ என்பது இரு கூறுகளையும் இயல்பாகத் தருகிறது.
- source_word: שָׁגִיתִי
  choice: நான் ... வழிதவறியிருந்தால்
  rationale: שגה என்பது வழியிலிருந்து விலகுதல் அல்லது தவறுதல் என்ற பொருளுடையது. ‘வழிதவறுதல்’ அதன் உருவகத்தன்மையைப் பாதுகாக்கிறது; ‘பாவம் செய்தல்’ என்று மொழிபெயர்ப்பது இங்கு அறநெறிக் குற்றத்தை தேவையின்றி மிகத் துல்லியமாக்கிவிடும்.
- source_word: אִתִּי
  choice: என்னிடமே
  rationale: அடிப்படைப் பொருள் ‘என்னுடன்’ என்பதாக இருந்தாலும், இச்சூழலில் அந்தத் தவறு யோபுவிடமே உள்ளது அல்லது அவருடைய பொறுப்பாகவே இருக்கிறது என்பதை ‘என்னிடமே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּלִין
  choice: தங்கும்
  rationale: לין என்பதன் நேரடிப் பொருள் ‘இரவு தங்குதல்’; இங்கு அது தொடர்ந்து ஒருவரிடமே இருப்பதைக் குறிக்கிறது. ‘தங்கும்’ என்பது மூல உருவகத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: מְשׁוּגָתִי
  choice: என் தவறு
  rationale: இந்தப் பெயர்ச்சொல் தவறுதல் அல்லது வழிதவறுதலால் ஏற்பட்ட தவற்றைக் குறிக்கிறது. ‘என் தவறு’ தெளிவானது; ‘என் பாவம்’ என்பது மூலத்தில் இல்லாத அறநெறி விளக்கத்தைச் சேர்க்கக்கூடும்.
theological_decisions:
- issue: யோபு தவறு செய்ததாக ஒப்புக்கொள்கிறாரா, அல்லது ஒரு சாத்தியத்தை மட்டும் முன்வைக்கிறாரா?
  choice: 'விட்டுக்கொடுக்கும் நிபந்தனையாக மொழிபெயர்க்கப்பட்டது: ‘வழிதவறியிருந்தாலும்கூட’.'
  alternative: ‘நான் உண்மையாகவே வழிதவறினேன்’ என்ற நேரடி ஒப்புதல்.
  rationale: וְאַף אָמְנָם என்ற அமைப்பும் சூழலும் ‘அப்படியே இருந்தாலும்கூட’ என்ற concessive force-ஐ ஆதரிக்கின்றன. இதனால் யோபு குற்றத்தைத் தெளிவாக ஒப்புக்கொண்டார் என்று உரை தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிதவறுதல்’ மற்றும் ‘தங்குதல்’ ஆகியவை எபிரெய மூலத்தின் உருவகங்களை வாசகருக்குப் புரியும் வகையில் பாதுகாக்கின்றன; ‘என்னிடமே’ என்பதில் உள்ள ‘-மே’ யோபுவின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
