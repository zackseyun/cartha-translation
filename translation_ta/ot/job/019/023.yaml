  source_fidelity: The draft correctly renders the two parallel optative wishes, the passive writing/inscribing, 'my words,' and the broad sense of סֵפֶר. However, ‘இப்போதே’ can mean ‘immediately/right this moment,’ which is more temporally specific than the Hebrew particle’s emphatic ‘now/indeed’ force in this context.
