translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் யோபின் தீவிர ஏக்கத்தையும் இருமுறை வரும் விருப்பக் கட்டமைப்பையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எவ்வளவு நன்றாயிருக்கும்’ என்ற மறுமொழி மூலத்தின் מִי יִתֵּן கட்டமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
