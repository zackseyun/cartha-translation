    issue: ‘இப்போதே’ is overly immediate.
    rationale: אֵפוֹ heightens the wish and can be rendered ‘now,’ but it does not necessarily demand the stronger Tamil sense ‘right this instant.’
  - severity: low
    issue: The optative exclamation is implicit rather than overt.
    rationale: Adding ‘ஆ’ naturally conveys the repeated Hebrew longing (מִי יִתֵּן) and better reflects the verse’s elevated emotional register.
