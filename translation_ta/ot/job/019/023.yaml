  text: מִֽי יִתֵּ֣ן אֵ֭פוֹ וְ/יִכָּתְב֣וּ/ן מִלָּ֑/י מִֽי יִתֵּ֖ן בַּ/סֵּ֣פֶר וְ/יֻחָֽקוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: ta
  text: ஆ, என் வார்த்தைகள் இப்போது எழுதப்பட்டால் நன்றாயிருக்கும்! ஆ, அவை ஒரு நூலில்[a] பொறிக்கப்பட்டால்[b] நன்றாயிருக்கும்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சுருளில்’ அல்லது ‘ஓர் ஆவணத்தில்’; எபிரேயச் சொல் நூல், சுருள், எழுதப்பட்ட ஆவணம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘செதுக்கப்பட்டால்’; இங்கு வரும் வினைச்சொல் சாதாரணமாக எழுதுவதைவிட நிலைத்திருக்கும் வகையில் எழுத்தைப் பதிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: எவ்வளவு நன்றாயிருக்கும்
  rationale: இது கொடுப்பவர் யார் என்ற நேரடியான கேள்வி அல்ல; தீவிரமான விருப்பத்தை வெளிப்படுத்தும் எபிரெய மொழிவழக்கு. நவீன தமிழில் விருப்பத்தின் வலிமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵפוֹ
  choice: இப்போதே
  rationale: இந்த இடைச்சொல் விருப்பத்தின் உடனடித் தன்மையையும் உணர்ச்சி அழுத்தத்தையும் கூட்டுகிறது; ‘இப்போதே’ அவற்றை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיִכָּתְבוּן
  choice: எழுதப்பட்டால்
  rationale: வார்த்தைகள் எழுத்தில் பதிவு செய்யப்பட வேண்டும் என்ற செயல்பாட்டு விருப்பத்தைப் பொருத்தமான தமிழ்ச் செயப்பாட்டு வடிவில் தருகிறது.
- source_word: מִלָּי
  choice: என் வார்த்தைகள்
  rationale: யோபின் சொற்கள் அல்லது உரைகளை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: בַּסֵּפֶר
  choice: ஒரு நூலில்
  rationale: סֵפֶר என்பது நூல், சுருள் அல்லது எழுதப்பட்ட ஆவணம் எனப் பலவாறு குறிக்கலாம். ‘நூல்’ நவீன தமிழில் இயல்பான பொதுச் சொல்லாக இருப்பதுடன், ஊடகத்தின் துல்லிய வடிவத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: וְיֻחָקוּ
  choice: பொறிக்கப்பட்டால்
  rationale: חקק என்பது நிலைத்திருக்கும் வகையில் எழுத்தைப் பதித்தல் அல்லது செதுக்குதல் என்ற வலுவான பொருளைக் கொண்டது. ‘பொறிக்கப்பட்டால்’ அந்த நீடித்த பதிவின் கருத்தைத் தக்கவைக்கிறது.
