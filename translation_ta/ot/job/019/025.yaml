source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: ta
  text: ஆனால் நானோ, என் மீட்பர்[a] உயிரோடிருக்கிறார் என்று அறிவேன்; பின்னர் அவர் புழுதிக்கு[c] மேலாக எழுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் நியாயத்தை நிலைநாட்டுபவர்.’ எபிரெய גֹּאֵל என்பது குடும்ப உறுப்பினருக்காக மீட்பவராக, பாதுகாப்பவராக அல்லது அவரது வழக்கில் நியாயத்தை நிலைநாட்டுபவராகச் செயல்படுபவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடைசியில் அவர் பூமியின்மேல் நிற்பார்.’ கடினமான இந்த எபிரெயத் தொடரை, ‘கடைசியானவராய் அவர் புழுதிக்கு மேலாக நிற்பார்’ என்றும் புரிந்துகொண்டுள்ளனர்.
    reason: alternative_reading
  - marker: c
    text: ‘புழுதி’ என்பது மரணநிலை, கல்லறை அல்லது பூமியை நினைவூட்டலாம்; எபிரெயில் நேரடியாக இருப்பது ‘புழுதி’ என்பதே.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் இங்கு வலியுறுத்தலையும் சூழலுக்கேற்ற எதிர்மறை வேறுபாட்டையும் காட்டுகிறது.
- source_word: יָדַעְתִּי
  choice: அறிவேன்
  rationale: எபிரெய நிறைவுவினை, தற்போது தொடரும் யோபுவின் உறுதியான நம்பிக்கையை இங்கு வெளிப்படுத்துகிறது.
- source_word: גֹּאֲלִי
  choice: என் மீட்பர்
  rationale: גאל என்பது குடும்ப உறுப்பினருக்காக மீட்பவராக, பாதுகாப்பவராக அல்லது நியாயத்தை நிலைநாட்டுபவராகச் செயல்படுபவரைக் குறிக்கலாம். ‘மீட்பர்’ அதன் பரந்த பொருளையும் இறையியல் கனத்தையும் காக்கிறது; சூழலுக்குப் பொருத்தமான மாற்றுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חָי
  choice: உயிரோடிருக்கிறார்
  rationale: ‘உயிருள்ளவர்’ என்ற பயனிலையை இயல்பான நவீனத் தமிழில் தொடரும் நிலையாக வெளிப்படுத்துகிறது.
- source_word: וְאַחֲרוֹן
  choice: பின்னர்
  rationale: இச்சொல் வினையடைப் பொருளிலோ பெயர்ச்சொல் பொருளிலோ அமையக்கூடும். ‘பின்னர்’ என்பது சர்ச்சைக்குரிய காலமுடிவு சார்ந்த பொருளை முதன்மை உரையில் மிகைப்படுத்தாமல் தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: עַל
  choice: மேலாக
  rationale: עַל என்பதன் ‘மேல்/மீது/மேலாக’ என்ற இடவியல் வரம்பைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: עָפָר
  choice: புழுதி
  rationale: எபிரெயச் சொல்லின் நேரடிப் படிமத்தைப் பாதுகாக்கிறது; அதை முன்கூட்டியே ‘கல்லறை’ அல்லது ‘பூமி’ என்று விளக்கவில்லை.
- source_word: יָקוּם
  choice: எழுவார்
  rationale: קום என்பதன் ‘எழுதல்/எழுந்து நிற்றல்/நிற்றல்’ என்ற பொருள் வரம்பில், புழுதிக்கு மேலாக எழும் உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோபின் גֹּאֵל என்பவரின் அடையாளமும் பணியும்
  choice: யார் என்பதைத் திட்டவட்டமாக அடையாளப்படுத்தாமல் ‘என் மீட்பர்’ என்று பரந்த வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் நியாயத்தை நிலைநாட்டுபவர்’ அல்லது ‘என் உறவின்முறை மீட்பர்’
  rationale: இவர் நேரடியாகக் கடவுளா, விண்ணுலகச் சாட்சியா, அல்லது மேசியாவாகப் புரிந்துகொள்ளப்படும் மீட்பரா என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை. எனவே உரையிலுள்ள இறையியல் அழுத்தமும் தெளிவின்மையும் காக்கப்படுகின்றன.
- issue: וְאַחֲרוֹן ... יָקוּם என்பதன் இறுதிக்காலப் பொருள்
  choice: ‘பின்னர் அவர் புழுதிக்கு மேலாக எழுவார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடைசியில் அவர் பூமியின்மேல் நிற்பார்’ அல்லது ‘கடைசியானவராய் அவர் புழுதிக்கு மேலாக நிற்பார்’
  rationale: இத்தொடரின் இலக்கணமும் இறையியல் குறிப்பும் சர்ச்சைக்குரியவை. முதன்மை உரை வெளிப்படையான உயிர்த்தெழுதல் கோட்பாட்டைச் சேர்க்காமல் எபிரெயின் படிமத்தையும் தெளிவின்மையையும் காக்கிறது; முக்கிய மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மீட்பர்’ என்ற மரபுச் சொல்லின் இறையியல் கனத்தைப் பாதுகாத்தபோதும், குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தை உரைக்குள் புகுத்தவில்லை. சர்ச்சைக்குரிய இறுதித் தொடரின் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
