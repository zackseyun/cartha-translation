source:
  edition: WLC
  text: ר֭וּחִֽ/י זָ֣רָה לְ/אִשְׁתִּ֑/י וְ֝/חַנֹּתִ֗י לִ/בְנֵ֥י בִטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: ta
  text: 'என் மூச்சு என் மனைவிக்கு அருவருப்பாயிருக்கிறது;

    என் வயிற்றுப் பிள்ளைகளுக்கும்[b] நான் வெறுப்புக்குரியவனாயிருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடினமான இந்த எபிரெயத் தொடரை வேறுவிதமாகப் புரிந்துகொண்டால், “என் வயிற்றுப் பிள்ளைகளிடம் நான் இரக்கம் வேண்டுகிறேன்” அல்லது “என் வேண்டுதல் என் வயிற்றுப் பிள்ளைகளிடமே உள்ளது” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “என் வயிற்றுப் பிள்ளைகள்” என்பது எபிரெய மொழியில் சொல்லுக்கு சொல் வரும் தொடர். இது யோபின் சொந்தப் பிள்ளைகளையோ, பொதுவாக அவருடைய நெருங்கிய இரத்த உறவினர்களையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: என் மூச்சு
  rationale: רוּחַ என்பதற்கு ‘காற்று,’ ‘ஆவி,’ ‘மூச்சு’ ஆகிய பொருள்கள் உண்டு. யோபின் உடல் துன்பத்தையும் மனைவியின் விலகலையும் குறிக்கும் இச்சூழலில் ‘மூச்சு’ இயல்பாகப் பொருந்துகிறது.
- source_word: זָרָה
  choice: அருவருப்பாயிருக்கிறது
  rationale: இச்சொல் அடிப்படையில் அந்நியமாதல் அல்லது விலகச் செய்தலைக் குறிக்கலாம்; இங்கு மனைவிக்கு வெறுப்பூட்டும் நிலையைத் தெரிவிப்பதால் ‘அருவருப்பாயிருக்கிறது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לְאִשְׁתִּי
  choice: என் மனைவிக்கு
  rationale: לְ முன்னிடைச்சொல் பாதிக்கப்படும் நபரைக் குறிக்கிறது; தமிழில் ‘என் மனைவிக்கு’ என்பது இயல்பான அமைப்பு.
- source_word: וְחַנֹּתִי
  choice: நான் வெறுப்புக்குரியவனாயிருக்கிறேன்
  rationale: இந்த எபிரெய வடிவம் கடினமானது. முதல் அடியுடன் இணையான சமூகப் புறக்கணிப்பைத் தொடரும் வாசிப்பின் அடிப்படையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; வேண்டுதல் அல்லது இரக்கம் கோருதல் என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִבְנֵי בִטְנִי
  choice: என் வயிற்றின் பிள்ளைகளுக்கும்
  rationale: சொல்லுக்கு சொல் ‘என் வயிற்றின் மகன்களுக்கு’ என வரும். בטן என்பது வயிறு/கருப்பை என்றும், בנים என்பது மகன்கள் என்றும் பொருள்படும்; தமிழில் உடல் சார்ந்த மூல உருவகத்தைப் பாதுகாத்து, பாலினத்தைத் தேவையின்றி குறுக்காத வகையில் ‘வயிற்றின் பிள்ளைகள்’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: וְחַנֹּתִי என்ற கடினமான வடிவத்தின் பொருள்
  choice: சுற்றத்தாருக்கு யோபு வெறுப்புக்குரியவரானார் என்ற இணைநிலை வாசிப்பு
  alternative: ‘என் வயிற்றின் பிள்ளைகளிடம் நான் இரக்கம் வேண்டுகிறேன்’ அல்லது ‘என் வேண்டுதல் அவர்களிடம் செல்கிறது’
  rationale: எபிரெய வடிவம் ஒன்றுக்கு மேற்பட்ட புரிதல்களை அனுமதிக்கிறது. முதலாம் அடியுடன் உள்ள கவிதை இணைநிலை வெறுப்பைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது; ஆனால் வேண்டுதல் சார்ந்த பழமையான புரிதலை மறைக்காமல் அடிக்குறிப்பில் பாதுகாக்க வேண்டும்.
- issue: בני בטני குறிக்கும் உறவினர்
  choice: உடல் சார்ந்த எபிரெய உருவகத்தை ‘என் வயிற்றின் பிள்ளைகள்’ எனப் பாதுகாத்தல்
  alternative: யோபின் சொந்த பிள்ளைகள் அல்லது பொதுவாக நெருங்கிய இரத்த உறவினர்
  rationale: இந்தச் சொற்றொடரின் சரியான உறவுக் குறிப்பு தெளிவில்லை; ஆகவே முதன்மை உரையில் உருவகம் வைக்கப்பட்டு அதன் சாத்தியமான குறிப்புகள் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் உடல் மற்றும் உறவு சார்ந்த வேதனையையும் தக்கவைத்த மொழிநடை. ‘வயிற்றின் பிள்ளைகள்’ என்ற அசாதாரண உருவகம் மூலத்தின் தெளிவின்மையைப் பாதுகாக்க எண்ணிப்பூர்வமாக வைக்கப்பட்டுள்ளது; அடிக்குறி [a] கடினமான இரண்டாம் அடியின் மாற்று வாசிப்பையும் [b] உறவுக் குறிப்பின் தெளிவின்மையையும் விளக்குகின்றன.
