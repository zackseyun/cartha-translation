  terminology: «பணிப்பெண்கள்» நவீன வாசகருக்குத் தெளிவான சொல்லாக உள்ளது; மூலத்தின் சமூகச் சேவைநிலையைத் தேவையற்ற விரிவாக்கமின்றிக் குறிக்கிறது. «அந்நியன்/வேற்றுநாட்டவன்» என்ற சொல் வேறுபாடு மூலத்தின் இணைநடையைச் சுமையாகாமல் காக்கிறது.
