  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: ta
  text: என் வீட்டில் தங்கியிருப்பவர்களும் என் பணிப்பெண்களும் என்னை அந்நியனாகக் கருதுகிறார்கள்; அவர்கள் பார்வையில் நான் வேற்றுநாட்டவனாகிவிட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: என் வீட்டில் தங்கியிருப்பவர்கள்
  rationale: גָּרִים என்பது வீட்டில் தற்காலிகமாகத் தங்கியிருப்போர், குடியிருப்போர் அல்லது விருந்தினர் எனப் பொருள்படலாம். இங்கு உறவை மிகத் துல்லியமாகக் கட்டுப்படுத்தாமல், இயல்பான தமிழில் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אַמְהֹתַי
  choice: என் பணிப்பெண்கள்
  rationale: אָמָה என்பதன் பெண்பால் சேவைநிலையைத் தெளிவாகவும் நவீன வாசகருக்குப் புரியுமாறும் தெரிவிக்கிறது.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: என்னை அந்நியனாகக் கருதுகிறார்கள்
  rationale: זָר என்பதிலுள்ள அறியப்படாதவர் அல்லது உறவுக்கு வெளியேயுள்ளவர் என்ற உணர்வையும், חשׁב என்பதிலுள்ள ‘எண்ணுதல்/கருதுதல்’ என்ற பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: அவர்கள் பார்வையில் நான் வேற்றுநாட்டவனாகிவிட்டேன்
  rationale: ‘அவர்களின் கண்களில்’ என்ற எபிரேய மரபுத்தொடரை இயல்பான தமிழில் ‘அவர்கள் பார்வையில்’ என வழங்குகிறது; נָכְרִי என்பதன் வெளிநாட்டவர்/அயல்நாட்டவர் என்ற வலுவான அந்நியத் தன்மையை ‘வேற்றுநாட்டவன்’ காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழ்; துயரமும் சமூகத் தனிமையும் வெளிப்படும் வகையில் கண்ணியமான, நேரடியான நடை. வசனத்தின் இரு ஒத்த கருத்துகளிலும் உள்ள ‘அந்நியன்’ மற்றும் ‘வேற்றுநாட்டவன்’ என்ற நுண் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
