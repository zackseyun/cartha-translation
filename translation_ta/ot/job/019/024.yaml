  yaml_path: translation/ot/job/019/024.yaml
  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: ta
  text: இரும்பு எழுத்தாணியாலும் ஈயத்தாலும்[a], அவை என்றென்றும் பாறையில் பொறிக்கப்படட்டும்![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரும்பு எழுத்தாணியுடன் ஈயம் எவ்வாறு பயன்படுத்தப்பட்டது என்பதை வசனம் கூறவில்லை. பொறிக்கப்பட்ட எழுத்துகள் தெளிவாகத் தெரியும்படி அவற்றின் பள்ளங்களில் ஈயம் நிரப்பப்பட்டிருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவை என்றென்றும் பாறையில் செதுக்கப்படட்டும்!’ எபிரெய வினைச்சொல் பொதுவாக ‘வெட்டு’ அல்லது ‘செதுக்கு’ என்று பொருள்படும்; இங்கு வார்த்தைகள் நிலையாகப் பதிக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: எழுத்தாணியால்
  rationale: עֵט என்பது எழுதுவதற்கான அல்லது பொறிப்பதற்கான கருவியைக் குறிக்கிறது. இரும்பும் பாறையும் குறிப்பிடப்படும் இச்சூழலில், மையால் எழுதும் பேனாவைவிடக் கல்லில் எழுத்துகளைப் பொறிக்கும் எழுத்தாணியே பொருத்தமானது.
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: கருவி செய்யப்பட்டுள்ள உலோகத்தை நேரடியாகக் குறிக்கும் சொல்லாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְעֹפָרֶת
  choice: ஈயத்தாலும்
  rationale: עֹפָרֶת என்பது ஈயம் என்னும் உலோகத்தைக் குறிக்கிறது. அதன் பயன்பாட்டை மூலவசனம் விளக்காததால், ஊகத்தை முதன்மை உரையில் சேர்க்காமல் உலோகத்தின் பெயர் மட்டும் தக்கவைக்கப்பட்டது.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நிலைத்திருக்கும் நிரந்தரத்தைக் குறிக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: בַּצּוּר
  choice: பாறையில்
  rationale: צוּר என்பது பாறை அல்லது கற்பாறையைக் குறிக்கிறது. எழுத்துகள் அதன் மேற்பரப்பில் மட்டும் வைக்கப்படாமல் அதற்குள் வெட்டப்படுகின்றன என்ற கருத்தை ‘பாறையில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֵחָצְבוּן
  choice: பொறிக்கப்படட்டும்
  rationale: חצב என்பதன் அடிப்படைப் பொருள் ‘வெட்டு, செதுக்கு’ என்பதாகும். இங்கு வார்த்தைகளைப் பாறையில் நிலையாகப் பதிப்பதைக் குறிப்பதால் ‘பொறிக்கப்படட்டும்’ சூழற்பொருளையும் வேண்டுதல் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
