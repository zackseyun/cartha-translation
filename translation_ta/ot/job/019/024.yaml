  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘எழுத்தாணி’ inscriptional சூழலைத் தெளிவாக்குகிறது; ‘பொறிக்கப்படட்டும்’ முந்தைய வசனத்தில் தொடங்கும் விருப்ப வேண்டுதலின் தொடர்ச்சியைப் பாதுகாக்கிறது.
