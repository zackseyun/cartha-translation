source:
  edition: WLC
  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: ta
  text: நீங்கள் ஏன் கடவுளைப் போலவே என்னைத் துரத்துகிறீர்கள்[a]? என் சதையினால் உங்களுக்குத் திருப்தி ஏற்படவில்லையா[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளைப் போலவே” என்பதற்குப் பதிலாக “ஒரு தெய்வத்தைப் போலவே” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ‘தெய்வம்’ அல்லது, இங்கு குறைந்த சாத்தியத்துடன், ‘வல்லவர்’ என்றும் பொருள்படும்.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்கு சொல், “என் சதையிலிருந்து.” இவ்வெளிப்பாடு, யோபின் சதையையே உண்டு தீர்ப்பதுபோன்ற அடங்காத பகைமையைச் சித்தரிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: யோபுவின் எதிர்ப்புக் கேள்வியை அறிமுகப்படுத்தும் வினாவடையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: תִּרְדְּפֻנִי
  choice: என்னைத் துரத்துகிறீர்கள்
  rationale: רדף என்பதன் ‘துரத்து, பின்தொடர்ந்து தாக்கு’ என்ற பகைமை நிறைந்த உருவகத்தை, ‘துன்புறுத்து’ என்று மிகையாக விளக்காமல் காக்கிறது.
- source_word: כְמוֹ
  choice: போல
  rationale: எளிய ஒப்புமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இச்சூழலில் யோபு தன் நண்பர்களின் இரக்கமற்ற தாக்குதலைத் தெய்வீகத் தாக்குதல் அல்லது தீர்ப்புடன் ஒப்பிடுவதே மிகச் சாத்தியம்; எனினும் எபிரெயச் சொல்லின் பொதுப்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וּמִבְּשָׂרִי
  choice: என் சதையைத் தின்றும்
  rationale: சொல்லுக்கு சொல் ‘என் சதையிலிருந்து’ என்றாலும், שבע உடன் வரும் מִן ஒருவர் எதனால் நிறைவடைகிறார் என்பதைக் குறிக்கலாம். இங்கு இரையை உண்ணும் கொடூர உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תִשְׂבָּעוּ
  choice: திருப்தியடைய மாட்டீர்களா?
  rationale: முற்றுப்பெறாத, அடங்காத பகைமையைச் சுட்டும் சொல்லாட்சியைத் தமிழில் இயல்பான எதிர்மறை வினாவாகத் தருகிறது.
theological_decisions:
- issue: כְמוֹ אֵל என்பதில் אֵל குறிக்கும் நபர்
  choice: கடவுள்
  alternative: ஒரு தெய்வம்; வல்லவர்
  rationale: யோபின் சூழலில் நண்பர்கள் தன்னைத் தாக்கும் கடுமையை கடவுளின் தாக்குதல் அல்லது தீர்ப்போடு ஒப்பிடுவது முதன்மையான வாசிப்பு. சொல்லின் உண்மையான மாற்றுப் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானதும் கண்ணியமானதும் வேதனையின் தீவிரத்தைத் தக்கவைத்ததுமான நடை. இரண்டாம் நபர் பன்மை வினை வடிவம் யோபின் நண்பர்கள் பலரையும் நோக்கிய உரையைப் பிரதிபலிக்கிறது; ‘சதை’ என்பது בשר என்பதன் தெளிவான உடல்சார் உருவகத்தை காக்கிறது.
