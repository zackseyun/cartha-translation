source:
  edition: WLC
  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: ta
  text: நீங்களே வாளுக்கு அஞ்சுங்கள்; ஏனெனில் கடுங்கோபம் வாளின் தண்டனைகளைக் கொண்டுவரும்; நீங்கள் நியாயத்தீர்ப்பு உண்டு[a] என்பதை அறியும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சர்வவல்லவர் இருக்கிறார்.” இறுதி எபிரெயச் சொற்றொடர் கடினமானது; “நியாயத்தீர்ப்புகள் உண்டு” அல்லது “ஒரு நீதிபதி இருக்கிறார்” என்றும் இதைப் புரிந்துகொண்டுள்ளனர்.
    reason: மாற்று வாசிப்புகள்
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: நீங்களே ... அஞ்சுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் எச்சரிக்கைத் தொனியையும், לָכֶם தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי חֶרֶב
  choice: வாளுக்கு
  rationale: ‘வாளைக் குறித்து/வாளின் காரணமாக அஞ்சுங்கள்’ என்ற எபிரெயச் சொல்லிணையின் பொருளைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: חֵמָה
  choice: கடுங்கோபம்
  rationale: எரியும் சினம் அல்லது உக்கிரமான கோபம் என்ற பொருளையும், வசனத்தின் ஒழுக்க மற்றும் நீதித்தீர்ப்புத் தொனியையும் காக்கிறது.
- source_word: עֲוֺנוֹת חָרֶב
  choice: வாளின் தண்டனைகள்
  rationale: עֲוֺנוֹת பொதுவாக ‘அக்கிரமங்கள்/குற்றங்கள்’ எனப் பொருள்படலாம்; இங்கு வாளோடும் நீதித்தீர்ப்போடும் இணைந்திருப்பதால் குற்றத்துக்குரிய தண்டனைகள் அல்லது விளைவுகள் என்ற சூழல்சார் பொருளைத் தருகிறது.
- source_word: לְמַעַן תֵּדְעוּן
  choice: நீங்கள் அறிந்துகொள்வதற்காகவே
  rationale: לְמַעַן என்பதன் நோக்கப் பொருளையும் அதைத் தொடர்ந்து வரும் பன்மை வினையின் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שדין
  choice: நியாயத்தீர்ப்பு உண்டு
  rationale: இறுதி எபிரெய வடிவம் கடினமானது. உடனடிச் சூழலில் யோபு தன் நண்பர்களைத் தண்டனைக்குரிய நீதியைப் பற்றி எச்சரிப்பதால், ‘நியாயத்தீர்ப்பு உண்டு’ என்பது பொருத்தமான முதன்மை வாசிப்பு; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: கடினமான இறுதி வடிவமான שדין என்பதன் விளக்கம்
  choice: நியாயத்தீர்ப்பு உண்டு
  alternative: சர்வவல்லவர் இருக்கிறார்; நியாயத்தீர்ப்புகள் உண்டு; ஒரு நீதிபதி இருக்கிறார்
  rationale: மூல வடிவம் உரை மற்றும் சொற்பொருள் அளவில் தெளிவற்றது. சூழல் நீதியான தண்டனையை வலியுறுத்துவதால் ‘நியாயத்தீர்ப்பு உண்டு’ என்பதை முதன்மை உரையில் வைத்துள்ளோம்; ஆனால் இறைவனைக் குறிக்கும் பெயர் அல்லது நீதிபதியைக் குறிக்கும் வாசிப்புகளைத் தீர்மானமாக நீக்காமல் அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘வாள்’ மற்றும் ‘நியாயத்தீர்ப்பு’ ஆகிய நீதிசார் உருவகங்கள் காக்கப்பட்டுள்ளன; மூலத்தின் இறுதிப் பகுதியிலுள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகச் சுட்டப்பட்டுள்ளது.
