  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: ta
  text: அவர் என்னை எல்லாப் பக்கங்களிலும் இடித்துத் தள்ளுகிறார்; நான் அழிந்துபோகிறேன்.[a] அவர் என் நம்பிக்கையை ஒரு மரத்தைப் போல வேரோடு பிடுங்கிவிடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் போகிறேன் / ஒழிந்துபோகிறேன்.” எபிரெயத்தில் சொற்பொருளாக “நான் போகிறேன்” என்று உள்ளது; இடித்துத் தள்ளப்பட்டதன் விளைவாக யோபு அழிந்துபோவதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: என்னை… இடித்துத் தள்ளுகிறார்
  rationale: נתץ என்பது இடித்தல் அல்லது தகர்த்தல் என்ற வலுவான அழிவுச் செயலைக் குறிக்கிறது; ‘என்னை’ என்ற பொருட்சுட்டும் எபிரெயத்தில் வெளிப்படையாக உள்ளது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலிருந்தும் நிகழும் முழுமையான அழிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וָאֵלַךְ
  choice: நான் அழிந்துபோகிறேன்
  rationale: சொல்லுக்குச் சொல் ‘நான் போகிறேன்’ என்றாலும், இடித்துத் தள்ளப்பட்டதன் விளைவாக யோபு ஒழிந்துபோவதை இச்சூழலில் குறிக்கிறது. நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיַּסַּע
  choice: பிடுங்கிவிட்டார்
  rationale: נסע இங்கு நிலைபெற்ற ஒன்றைப் பெயர்த்தெடுப்பதையோ பிடுங்குவதையோ குறிக்கிறது; மர உவமையுடன் ‘பிடுங்குதல்’ மிகத் துல்லியமாகப் பொருந்துகிறது.
- source_word: כָּעֵץ
  choice: ஒரு மரத்தைப் பிடுங்குவதுபோல்
  rationale: மரத்துடன் செய்யப்படும் ஒப்புமையை இயல்பான தமிழ் வாக்கிய அமைப்பில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תִּקְוָתִי
  choice: என் நம்பிக்கை
  rationale: תקוה என்பதன் இச்சூழலுக்குரிய இயல்பான பொருள் ‘நம்பிக்கை’; எதிர்பார்ப்பு என்ற நுண்பொருளும் இதில் அடங்குகிறது.
