  source_fidelity: முதல் வினைச்சொல், ‘எல்லாப் பக்கங்களிலும்,’ யோபின் அழிவு, மற்றும் நம்பிக்கையை மரத்துடன் ஒப்பிடும் உருவகம் ஆகியவை வரைவில் பெரும்பாலும் சரியாக உள்ளன. ஆனால் “ஒரு மரத்தைப் பிடுங்குவதுபோல் என் நம்பிக்கையைப் பிடுங்கிவிட்டார்” என்பது தமிழில் மரத்தைப் பிடுங்கும் செயல்முறையையே முதன்மையாக ஒப்பிடுகிறது; எபிரெயத்தில் என் நம்பிக்கையே மரம்போல் பிடுங்கப்படுகிறது. இதை நேரடியாகக் காட்டுவது மூல உருவகத்தைத் துல்லியமாகப் பாதுகாக்கும்.
