revisions:
- from: இதோ, பத்து முறை என்னை அவமானப்படுத்திவிட்டீர்கள்; என்னை அந்நியனைப்போல் நடத்துவதற்கு[a] நீங்கள் வெட்கப்படவில்லை.
  to: இந்தப் பத்து முறையும் நீங்கள் என்னை அவமானப்படுத்தியிருக்கிறீர்கள்; என்னை அந்நியனைப் போல் நடத்த[a] நீங்கள் வெட்கப்படவில்லை.
