language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֶ֤ה עֶ֣שֶׂר פְּ֭עָמִים תַּכְלִימ֑וּ/נִי לֹֽא תֵ֝בֹ֗שׁוּ תַּהְכְּרוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/003.yaml
  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: ta
  text: இந்தப் பத்து முறையும் நீங்கள் என்னை அவமானப்படுத்தியிருக்கிறீர்கள்; என்னை அந்நியனைப் போல் நடத்த[a] நீங்கள் வெட்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குத் தீங்கிழைக்க,” “என்னைக் கடுமையாக நடத்த.” எபிரெய வினைச்சொல்லின் பொருள் இங்கு உறுதியாக இல்லை; யோபை அந்நியனாகவோ அறியாதவனாகவோ கருதி நடத்துவதையும் இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: இதோ, பத்து முறை
  rationale: எபிரெய எண்ணிக்கைச் சொல்லாட்சியையும் யோபின் குற்றச்சாட்டின் அழுத்தத்தையும் காக்கிறது; ‘பத்து’ என்பது திரும்பத் திரும்ப நடந்ததைக் குறிக்கும் வட்டமான எண்ணாகவும் இருக்கலாம்.
- source_word: תַּכְלִימוּנִי
  choice: என்னை அவமானப்படுத்திவிட்டீர்கள்
  rationale: כלם என்பதன் Hiphil வடிவிலுள்ள அவமானம் ஏற்படுத்தும் காரணப்பொருளையும், இதுவரை மீண்டும் நிகழ்ந்த செயலின் விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תֵבֹשׁוּ
  choice: நீங்கள் வெட்கப்படவில்லை
  rationale: בוש குறிக்கும் வெட்க உணர்வின்மையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: תַּהְכְּרוּ לִי
  choice: என்னை அந்நியனைப்போல் நடத்துவதற்கு
  rationale: வாசகம் கடினமானது. נכר என்பதன் அடிப்படையான ‘அந்நியனாகக் கருதுதல்/அறியாதவர்போல் நடத்துதல்’ என்ற சாத்தியமான பொருளைத் தக்கவைத்து, பகைமையான ஒதுக்குதலை உணர்த்துகிறது.
theological_decisions:
- issue: யோபின் நண்பர்கள் அவரை நடத்தும் விதத்தை விவரிக்கும் தெளிவற்ற வினைச்சொல்
  choice: அந்நியனைப்போல் நடத்துதல்
  alternative: எனக்குத் தீங்கிழைத்தல் / என்னைக் கடுமையாக நடத்துதல்
  rationale: இங்கு எந்தத் தனிப்பட்ட கோட்பாட்டையும் சேர்க்காமல், எபிரெய நכר வேரின் சொற்பொருள் தொடர்பையும் உரையின் திட்டமிட்ட தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், நேரடியான குற்றச்சாட்டின் கண்ணியமும் தீவிரமும் காக்கப்பட்டுள்ளன. பன்மை மரியாதை வடிவம் அல்ல; நண்பர்கள் பலரை நோக்கிப் பேசும் இரண்டாம் நபர் பன்மை.
