  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: ta
  text: சிறுவர்கள்கூட[a] என்னை அவமதிக்கிறார்கள்; நான் எழும்போது, அவர்கள் எனக்கு எதிராகப் பேசுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூடர்கள்கூட,” “அடங்காதவர்கள்கூட,” அல்லது “இளம் பையன்கள்கூட.” עֲוִילִים என்ற எபிரெயச் சொல் பொதுவாக மூடத்தனமான அல்லது ஒழுக்க உணர்வற்றவர்களைக் குறிக்கிறது; ஆனால் இச்சூழலில், யோபைக் கேலி செய்யும் முதிர்ச்சியற்ற அல்லது தாழ்ந்த நிலையினராகக் கருதப்பட்ட இளைஞர்களைக் குறிப்பதாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: கூட
  rationale: முந்தைய புலம்பலின் தொடர்ச்சியையும், சமூகத்தில் மிகச் சிறியவர்களாகக் கருதப்படுபவர்கள்கூட யோபை இகழும் அவலத்தின் வலியுறுத்தலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲוִילִים
  choice: சிறுபிள்ளைகள்
  rationale: இந்த அரிய சொல்லுக்கு ‘மூடர்கள்’, ‘மதிகெட்டவர்கள்’, ‘இளம் பையன்கள்’ என்ற பொருள் வாய்ப்புகள் உள்ளன. சூழலில், யோபின் சமூகத் தாழ்வை வெளிப்படுத்தும் முதிர்ச்சியற்ற சிறுவர்களைக் குறிப்பதாக எடுத்துக்கொள்வது இயல்பாக உள்ளது; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מָאֲסוּ בִי
  choice: என்னை இகழ்கிறார்கள்
  rationale: מאס என்பது வெறுப்போடு நிராகரித்தல் அல்லது மதிப்பில்லாமல் நடத்துதல் என்னும் கருத்தைக் கொண்டது. இச்சூழலில் ‘இகழ்கிறார்கள்’ என்பது அவமதிப்பின் தொனியை இயல்பாகத் தருகிறது.
- source_word: אָקוּמָה
  choice: நான் எழுந்தால்
  rationale: இவ்வடிவம் இங்கு யோபு எழும்போது நிகழும் எதிர்வினையை நிபந்தனை/காலத் தொடர்புடன் காட்டுகிறது. ‘எழுந்தால்’ என்பது எபிரெயச் சொல்லின் சுருக்கத்தையும் சாத்தியமான நிபந்தனை நிழலையும் காக்கிறது.
- source_word: וַיְדַבְּרוּ בִי
  choice: அவர்கள் எனக்கு எதிராகப் பேசுகிறார்கள்
  rationale: דבר உடன் வரும் ב இச்சூழலில் பகைமையான பேச்சைக் குறிக்கிறது. ‘எதிராகப் பேசுகிறார்கள்’ என்பது ‘கேலி செய்கிறார்கள்’ என்று மிகையாக விளக்காமல் அந்தப் பகைத் தொனியைப் பாதுகாக்கிறது.
