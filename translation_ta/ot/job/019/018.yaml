revisions:
- from: சிறுபிள்ளைகள்கூட[a] என்னை இகழ்கிறார்கள்; நான் எழுந்தால், அவர்கள் எனக்கு எதிராகப் பேசுகிறார்கள்.
  to: சிறுவர்கள்கூட[a] என்னை அவமதிக்கிறார்கள்; நான் எழும்போது, அவர்கள் எனக்கு எதிராகப் பேசுகிறார்கள்.
  rationale: The revision uses சிறுவர்கள் rather than the more restrictive சிறுபிள்ளைகள், changes the conditional connector to a temporal one, and renders מאס with the broader contempt sense 'அவமதிக்கிறார்கள்.' The footnote continues to preserve the disputed lexical range and contextual interpretation without presenting either as certain.
