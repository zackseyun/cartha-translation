  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: ta
  text: என்மேல் இரக்கம் காட்டுங்கள்[a], என்மேல் இரக்கம் காட்டுங்கள், என் நண்பர்களே! ஏனெனில் கடவுளின் கை என்னைத் தாக்கியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு அருள் காட்டுங்கள்” அல்லது “என்மேல் கருணை காட்டுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “கடவுளின் கை என்னைத் தொட்டது.” இங்கு இந்தச் சொற்றொடர் தீங்கான பாதிப்பைக் குறிக்கிறது; ஆகவே, “என்னைத் தாக்கியது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: என்மேல் இரக்கம் காட்டுங்கள்
  rationale: חנן என்பதன் பன்மை ஏவல் வடிவம் யோபுவின் நண்பர்களை நோக்கியது. இச்சூழலில் அவர்களிடம் பரிவான நடத்தையை வேண்டுவதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: חָנֻּנִי (repeated)
  choice: என்மேல் இரக்கம் காட்டுங்கள்
  rationale: யோபுவின் வேண்டுதலிலுள்ள உணர்ச்சித் தீவிரத்தையும் கவிதை வலியுறுத்தலையும் காக்க, திரும்பச் சொல்லப்படுவது அப்படியே தக்கவைக்கப்பட்டது.
- source_word: רֵעָי
  choice: என் நண்பர்களே
  rationale: רֵעַ என்பது பொதுவாக நண்பர் அல்லது தோழரைக் குறிக்கிறது. நேரடி அழைப்பின் தன்மையைத் தமிழில் இயல்பாகக் காட்ட விளிவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יַד אֱלוֹהַּ
  choice: கடவுளின் கை
  rationale: இறைச் செயலையோ வல்லமையையோ குறிக்கும் எபிரெய உருவகத்தை விளக்கிப் பரப்பாமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் கடவுளைக் குறிக்கும் ஒருமை கவிதை வடிவம். இங்கு ‘சர்வவல்லவர்’ போன்ற விரிவாக்கத்திற்கு ஆதாரம் இல்லை.
- source_word: נָגְעָה בִּי
  choice: என்னைத் தாக்கியது
  rationale: נגע + בְּ என்பது தொடுதல், தாக்குதல் அல்லது துன்புறுத்துதல் எனப் பொருள்படலாம். யோபுவின் துன்பச் சூழலில் தீங்கான பாதிப்பை ‘தாக்கியது’ தெளிவாகவும் உருவகத்தின் வலிமையுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: யோபுவின் துன்பத்திற்கான இறைச் செயலாண்மை
  choice: கடவுளின் கை என்னைத் தாக்கியது
  alternative: கடவுளின் கை என்னைத் தொட்டது / கடவுளின் கை என்னைத் துன்புறுத்தியது
  rationale: எபிரெய உரை யோபுவின் துன்பத்தை உருவக மொழியில் கடவுளின் செயலோடு நேரடியாக இணைக்கிறது. அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமலும் முறைப்படுத்தித் தீர்க்காமலும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உணர்ச்சிமிக்க இரட்டை வேண்டுதல் அப்படியே தக்கவைக்கப்பட்டு, நேரடி அழைப்பை வலுப்படுத்த ஆச்சரியக்குறி இடப்பட்டுள்ளது; இறைச் செயலைக் குறிக்கும் ‘கை’ உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
