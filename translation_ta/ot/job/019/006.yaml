  choice: அறிந்துகொள்ளுங்கள்
  rationale: ידע என்பதன் பன்மை ஏவல் வடிவம்; கேட்போர் ஒரு உண்மையை ஏற்றுணர வேண்டும் என்ற நேரடியான அழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֵפוֹ
  choice: ஆகவே
  rationale: வாதத்தின் தொடர்ச்சியில் முடிவுறுத்தலையும் வலியுறுத்தலையும் காட்டும் உரையாடல் இடைச்சொல்; இங்கு ‘ஆகவே’ இயல்பாகப் பொருந்துகிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: இது ஒருமை இறைப் பெயர்; ‘சர்வவல்லவர்’ போன்ற கூடுதல் சிறப்புப் பெயரை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: עִוְּתָנִי
  choice: எனக்கு அநீதி செய்திருக்கிறார்
  rationale: עות என்பது வளைத்தல், சீர்குலைத்தல், நீதியைப் புரட்டுதல் அல்லது ஒருவருக்கு அநீதி செய்தல் என்ற பொருள்களைக் கொண்டது. இங்கு யோபுவின் குற்றச்சாட்டின் அறநீதி சார்ந்த தீவிரத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְצוּדוֹ
  choice: தமது வலையால்
  rationale: வேட்டைக்குப் பயன்படும் வலை அல்லது பொறியைக் குறிக்கும் சொல். ‘வலை’ உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; மரியாதை ஒருமைத் தொடர்ச்சிக்காக ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הִקִּיף עָלַי
  choice: என்னைச் சூழ்ந்திருக்கிறார்
  rationale: சுற்றிவளைத்தல் அல்லது சூழ்ந்துகொள்ளுதல் என்பது அடிப்படைப் பொருள். கருவியைக் குறிக்கும் ‘வலையால்’ என்பதுடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: கடவுளுக்கு எதிரான யோபுவின் குற்றச்சாட்டு
  choice: ‘கடவுள் எனக்கு அநீதி செய்திருக்கிறார்’ என்ற நேரடியான கூற்றைத் தணிக்காமல் வைத்தல்
  alternative: ‘கடவுள் என்னைத் துன்புறுத்தியிருக்கிறார்’ அல்லது ‘கடவுள் எனக்கு எதிராகத் திரும்பியிருக்கிறார்’
  rationale: எபிரெய வினை நீதியை வளைத்தல் அல்லது அநீதி செய்தல் என்ற வலுவான பொருளைக் கொண்டுள்ளது. யோபுவின் மதிப்பீட்டை மொழிபெயர்ப்பு ஆதரிப்பதாக ஆக்காமல், மூல உரையிலுள்ள இறையியல் பதற்றத்தையும் புலம்பலின் தீவிரத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கடவுளைக் குறிக்கும் இடத்தில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. யோபுவின் கடுமையான குற்றச்சாட்டு மென்மையாக்கப்படவில்லை; அடிக்குறிப்பு மாற்றுப் பொருள்களை மட்டும் விளக்குகிறது.
