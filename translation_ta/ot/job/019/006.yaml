  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: ta
  text: ஆகவே, கடவுள் எனக்கு அநீதி செய்திருக்கிறார்[a] என்றும், தமது வலையால்[b] என்னைச் சூழ்ந்திருக்கிறார் என்றும் அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னை அநியாயமாக நடத்தியிருக்கிறார்’ அல்லது ‘எனக்கு எதிராக நீதியைப் புரட்டியிருக்கிறார்.’ எபிரெய வினை, நேர்மையானதை வளைத்தல் அல்லது சீர்குலைத்தல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தமது பொறியால்’ அல்லது ‘தமது வேட்டைவலையால்.’
    reason: lexical_alternative
lexical_decisions:
