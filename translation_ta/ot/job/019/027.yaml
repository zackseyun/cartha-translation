  yaml_path: translation/ot/job/019/027.yaml
  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: ta
  text: அவரை நானே எனக்கெனக்[a] காண்பேன்; என் கண்கள் அவரைக் காணும், வேறொருவர் அல்ல.[b] என் சிறுநீரகங்கள் என் நெஞ்சுக்குள் சோர்ந்துபோகின்றன.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எனக்கென’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘எனக்காக’ அல்லது ‘என் சார்பாக’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதனைச் சொற்சார்ந்து ‘அந்நியன் அல்ல’ என்றும் மொழிபெயர்க்கலாம். கருத்து, ‘நானே அவரைக் காண்பேன்; வேறொருவர் அல்ல’ என்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சிறுநீரகங்கள்’ என்பது எபிரெய மரபில் மனிதனின் ஆழ்ந்த உள்ளுணர்வுகளையோ உள்ளார்ந்த சுயத்தையோ குறிக்கும் படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவரை
  rationale: இது முந்தைய வசனத்தில் குறிப்பிடப்பட்டுள்ள தனிப்பட்ட மீட்பரைச் சுட்டும் தொடர்புப்பெயர்; אֶחֱזֶה என்பதன் நேர்ச்செயப்படுபொருளாக இருப்பதால் ‘அவரை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲנִי
  choice: நானே
  rationale: வினைமுற்றிலேயே முதலாம் நபர் அடங்கியிருந்தும் தனிப் பிரதிப்பெயர் வந்திருப்பது வலியுறுத்தலைக் காட்டுகிறது.
- source_word: אֶחֱזֶה
  choice: காண்பேன்
  rationale: חזה காணுதல் அல்லது உற்றுநோக்குதலைக் குறிக்கலாம்; இங்கு எதிர்கால எதிர்பார்ப்பையும் அடுத்த இணைவாக்கியத்தையும் இயல்பாகத் தருகிறது.
- source_word: לִּי
  choice: எனக்கென
  rationale: பொருள் தெளிவாகத் தீராத இந்தத் தந்தைவேற்றுமை வடிவம் தனிப்பட்ட பயன் அல்லது உரிமைத் தொனியைக் கொண்டிருக்கலாம்; ‘எனக்கென’ அதைத் திறந்தவாறே வைக்கிறது.
- source_word: וְעֵינַי רָאוּ
  choice: என் கண்களே அவரைக் காணும்
  rationale: ‘என் கண்கள்’ என்ற எபிரெயக் கவித்துவப் படிமத்தையும், முந்தைய எதிர்கால வினையோடு உள்ள இணைநிலையையும் காக்கிறது. ரָאוּ வடிவத்தில் நிறைவேற்ற வினை இருந்தாலும் இச்சூழலில் எதிர்காலமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְלֹא זָר
  choice: வேறொருவர் அல்ல
  rationale: זָר என்பதற்கு ‘அந்நியன்’ என்றும் ‘வேறொருவர்’ என்றும் பொருள் உண்டு. இங்கு யோபு தானே காண்பான் என்ற வலியுறுத்தலுடன் ‘வேறொருவர் அல்ல’ இயல்பாக இணைகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּלוּ
  choice: கரைந்துபோகின்றன
  rationale: כלה இங்கு முற்றிலும் செலவாகுதல், சோர்ந்துபோதல் அல்லது ஒழிந்துபோதலைக் குறிக்கிறது; ‘கரைந்துபோகின்றன’ என்பது உட்புற உணர்ச்சித் தீவிரத்தை கவித்துவமாகக் காக்கிறது.
- source_word: כִלְיֹתַי
  choice: என் சிறுநீரகங்கள்
  rationale: எபிரெயப் படிமத்தை முதன்மை உரையில் நேரடியாகக் காக்கிறது; அது ஆழ்ந்த உள்ளுணர்வுகளின் இருப்பிடத்தைக் குறிக்கும் மரபுவழிப் பயன்பாடு என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בְּחֵקִי
  choice: என் நெஞ்சுக்குள்
  rationale: חֵיק என்பதன் ‘மடி/மார்பு/நெஞ்சு’ என்ற உடல் சார்ந்த படிமத்தை தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: யோபு எதிர்பார்க்கும் தரிசனத்தின் இயல்பு
  choice: முந்தைய வசனத்தில் கூறப்பட்டவரை யோபு தானே எதிர்காலத்தில் காண்பான் என்று மட்டும் மொழிபெயர்த்து, அந்தக் காணுதல் எப்போது அல்லது எந்த நிலையில் நிகழும் என்பதைத் தீர்மானிக்கவில்லை.
  alternative: இது உடல் உயிர்த்தெழுதலுக்குப் பிந்தைய தரிசனம், இவ்வாழ்விலேயே கிடைக்கும் நீதி நிறுவல், அல்லது மரணத்துக்குப் பிந்தைய ஆவிக்குரிய தரிசனம் என்று குறிப்பாக விளக்குதல்.
  rationale: எபிரெய உரை யோபு தனிப்பட்ட முறையில் காண்பதை வலியுறுத்துகிறது; ஆனால் இந்த வசனம் மட்டும் அந்தத் தரிசனத்தின் காலத்தையோ இயல்பையோ முடிவாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் வாசிக்கக்கூடியதாய் இருந்தாலும், எபிரெயக் கவிதையின் வலியுறுத்தல், மீளுரைத்தல், ‘சிறுநீரகங்கள்/நெஞ்சு’ என்ற உடல் சார்ந்த படிமங்கள் ஆகியவை காக்கப்பட்டுள்ளன. ‘எனக்கென’ மற்றும் ‘வேறொருவர் அல்ல’ ஆகிய இடங்களிலுள்ள உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
