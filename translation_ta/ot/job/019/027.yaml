review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the personal object supplied from the preceding verse, the emphatic ‘I myself,’ the difficult personal dative (‘எனக்கென’), the future sense of the parallel seeing verbs, and the literal ‘kidneys.’ However, ‘கரைந்துபோகின்றன’ (‘melt/dissolve away’) is less faithful to כָּלוּ, which here denotes being spent, consumed, or failing. ‘சோர்ந்துபோகின்றன’ better preserves the wasting/failing sense without resolving the poetic emotion.
  naturalness: 'The Tamil is generally clear and suitably elevated. Removing the added emphatic particle in ‘என் கண்களே’ yields a closer and more natural poetic parallel: ‘என் கண்கள் அவரைக் காணும்.’ The revised final clause remains deliberately concrete and poetic while reading smoothly.'
  terminology: ‘சிறுநீரகங்கள்’ appropriately preserves the Hebrew bodily image, with a useful cultural footnote. ‘நெஞ்சுக்குள்’ is an acceptable idiomatic rendering of the Hebrew ‘in my bosom’ in this poetic context. The alternatives for לִּי and זָר are responsibly retained in notes.
  issues:
  - severity: medium
    issue: ‘கரைந்துபோகின்றன’ for כָּלוּ
    rationale: The Hebrew verb conveys being consumed, spent, or failing. Tamil ‘கரைந்துபோகின்றன’ more specifically suggests melting or dissolving, which introduces a less apt physical image. ‘சோர்ந்துபோகின்றன’ expresses the source sense more directly.
  - severity: low
    issue: Added emphasis in ‘என் கண்களே’
    rationale: The Hebrew has ‘my eyes,’ not an independently marked emphatic ‘my eyes themselves.’ The emphatic ‘நானே’ already represents the explicit Hebrew pronoun. ‘என் கண்கள்’ is closer and retains the parallelism.
  revised_text: அவரை நானே எனக்கெனக்[a] காண்பேன்; என் கண்கள் அவரைக் காணும், வேறொருவர் அல்ல.[b] என் சிறுநீரகங்கள் என் நெஞ்சுக்குள் சோர்ந்துபோகின்றன.[c]
