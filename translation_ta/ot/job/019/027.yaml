revisions:
- from: அவரை நானே எனக்கெனக்[a] காண்பேன்; என் கண்களே அவரைக் காணும், வேறொருவர் அல்ல.[b] என் சிறுநீரகங்கள் என் நெஞ்சுக்குள் கரைந்துபோகின்றன.[c]
  to: அவரை நானே எனக்கெனக்[a] காண்பேன்; என் கண்கள் அவரைக் காணும், வேறொருவர் அல்ல.[b] என் சிறுநீரகங்கள் என் நெஞ்சுக்குள் சோர்ந்துபோகின்றன.[c]
  rationale: 'Two limited revisions improve source fidelity and Tamil style: ‘என் கண்களே’ is changed to the unmarked possessive ‘என் கண்கள்,’ and ‘கரைந்துபோகின்றன’ is changed to ‘சோர்ந்துபோகின்றன’ for the Hebrew sense of being consumed or failing. The translation continues to avoid deciding the debated nature or timing of Job’s anticipated vision.'
