id: JOB.19.9
reference: Job 19:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כְּ֭בוֹדִ/י מֵ/עָלַ֣/י הִפְשִׁ֑יט וַ֝/יָּ֗סַר עֲטֶ֣רֶת רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: ta
  text: அவர் என் கௌரவத்தை என்னிடமிருந்து உரித்தெடுத்தார்; என் தலையிலிருந்த கிரீடத்தை அகற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மகிமை’ அல்லது ‘என் மாண்பு’.
    reason: כְּבוֹדִי என்பதன் பொருள் பரப்பில் மகிமை, கௌரவம், மாண்பு ஆகியவை அடங்குவதால் உண்மையான சொற்பொருள் மாற்றுகள் தரப்படுகின்றன.
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: என் கௌரவத்தை
  rationale: כָּבוֹד என்பது கௌரவம், மகிமை, மாண்பு அல்லது சமூக மதிப்பு ஆகிய பொருள்களைக் குறிக்கலாம். யோபு தனது நிலையும் மதிப்பும் பறிக்கப்பட்டதைப் புலம்பும் சூழலில், இயல்பான நவீனத் தமிழில் ‘கௌரவம்’ பொருத்தமாக உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מֵעָלַי
  choice: என்னிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘என்மேலிருந்து’ என்றாலும், உரித்தெடுக்கும் உருவகத்துடன் ‘என்னிடமிருந்து’ என்பது தமிழில் இயல்பாக இருந்து, அகற்றப்படுதல் என்ற பொருளைக் காக்கிறது.
- source_word: הִפְשִׁיט
  choice: உரித்தெடுத்து
  rationale: ஆடை அல்லது மேலிருக்கும் ஒன்றை உரித்தல்/கழற்றுதல் என்ற வலுவான உருவகத்தை இந்த வினை கொண்டுள்ளது. ‘உரித்தெடுத்து’ என்பது யோபின் கௌரவம் வலுக்கட்டாயமாகப் பறிக்கப்பட்ட காட்சியைத் தெளிவாகக் காக்கிறது.
- source_word: וַיָּסַר
  choice: அகற்றிவிட்டார்
  rationale: הסיר என்பதன் அடிப்படைப் பொருள் அகற்றுதல் அல்லது எடுத்துப்போடுதல். முடிவுற்ற செயலால் ஏற்பட்ட தற்போதைய இழப்பையும், முதல் அடியின் கவித்துவ இணைப்பையும் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: עֲטֶרֶת
  choice: கிரீடத்தை
  rationale: இந்தப் பெயர்ச்சொல் கௌரவத்தையும் நிலையையும் குறிக்கும் கிரீடம் அல்லது அலங்கார வளையத்தைக் குறிக்கிறது. ‘கிரீடம்’ தெளிவானதும் உருவகத்தை நேரடியாகக் காப்பதுமான நவீனத் தமிழ்ச் சொல்.
- source_word: רֹאשִׁי
  choice: என் தலையிலிருந்து
  rationale: கிரீடம் தலையில் இருப்பதைக் காட்டும் மூல உருவகத்தைத் தக்கவைத்து, அகற்றுதல் என்ற வினையுடன் இயல்பான தமிழ்ச் சொல்லமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வெளிப்படையாகப் பெயரிடப்படாத செய்பவர்
  choice: சூழலில் தேவனைக் குறிக்கும் ‘அவர்’ என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
  alternative: பெயரிடப்படாத எதிரி அல்லது சூழ்நிலை செய்பவராக இருக்கலாம்.
  rationale: எபிரெய வினைகள் ஆண்பால் ஒருமைச் செய்பவரைக் காட்டுகின்றன; உடனடிச் சூழலில் யோபு இந்தத் துன்பத்திற்குத் தேவனையே காரணராகக் கூறுகிறார். எனினும் மூலத்தில் ‘தேவன்’ என்று நேரடியாகப் பெயரிடப்படாததால், மொழிபெயர்ப்பும் ‘அவர்’ என்று மட்டும் வைத்து அந்தச் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உரித்தெடுத்து’ என்ற வினை மூலத்தின் தீவிரமான ஆடை-உருவகத்தைக் காக்கிறது; ‘அவர்’ என்பது செய்பவரை ‘தேவன்’ என்று விளக்கிச் சேர்க்காமல் சூழலின் தெளிவைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
