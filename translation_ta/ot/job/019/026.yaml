  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: ta
  text: என் தோல் அழிக்கப்பட்ட பின்பும்,[a] என் மாம்சத்திலிருந்து கடவுளைக் காண்பேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இந்தத் தொடர் எபிரெயத்தில் சொல்லியல் மற்றும் தொடரியல் ரீதியாகக் கடினமானது. இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: ‘அவர்கள் என் தோலை உரித்தெடுத்த பின்பு—இது.’'
    reason: lexical_alternative
  - marker: b
    text: ‘என் மாம்சத்தில் கடவுளைக் காண்பேன்’ என்றும், ‘என் மாம்சமின்றி கடவுளைக் காண்பேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் கடினமானது; ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  choice: பின்பும்
  rationale: וְאַחַר காலத் தொடரைக் குறிக்கிறது. சூழலில் எதிர்மறைத் திருப்பமும் இருப்பதால், இயல்பான தமிழில் ‘பின்பும்’ என வழங்கப்பட்டது.
- source_word: עוֹרִי
  choice: என் தோல்
  rationale: עוֹר என்பதன் மனித உடல் சார்ந்த நேரடியான, இயல்பான பொருள் ‘தோல்’; யோபுவின் உடல் வேதனையின் உருவகத்தையும் இது காக்கிறது.
- source_word: נִקְּפוּ זֹאת
  choice: இவ்வாறு அழிக்கப்பட்ட
  rationale: இந்தச் சொற்றொடர் சொல்லியல் மற்றும் தொடரியல் ரீதியாகக் கடினமானது. தோல் சிதைக்கப்படுவதைத் தெளிவாகச் சொல்லும் வகையில் ‘இவ்வாறு அழிக்கப்பட்ட’ என மொழிபெயர்க்கப்பட்டது; זֹאת என்பதன் சுட்டுத்தன்மையை ‘இவ்வாறு’ ஓரளவு காக்கிறது.
- source_word: וּ/מִ/בְּשָׂרִי
  choice: என் மாம்சத்திலிருந்து
  rationale: מִן என்பதன் முதன்மையான ‘இலிருந்து’ என்ற பொருளைத் தக்கவைத்து, ‘மாம்சத்தில்’ அல்லது ‘மாம்சமின்றி’ என்று சர்ச்சைக்குரிய தொடரைத் தீர்மானித்துவிடாமல் விடுகிறது.
- source_word: אֶחֱזֶה
  choice: காண்பேன்
  rationale: חזה என்பது காணுதல் அல்லது நோக்கிக் காணுதல் என்று பொருள்படும். ‘காண்பேன்’ தெளிவான நவீனத் தமிழாகவும், எதிர்காலச் செயலை இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுளை
  rationale: யோபு நூலில் אֱלוֹהַּ கடவுளைக் குறிக்கும் ஒருமைச் சொல்; ‘கடவுள்’ அதன் நேரடியான, பொதுவான தமிழ் இணை.
theological_decisions:
- issue: וּמִבְּשָׂרִי என்ற தொடர் உடலோடுகூடிய உயிர்த்தெழுதலை வெளிப்படையாகக் கற்பிக்கிறதா?
  choice: ‘என் மாம்சத்திலிருந்து’ என்று மொழிபெயர்த்து, எபிரெயத் தொடரின் இறையியல் பதற்றத்தையும் தெளிவின்மையையும் காத்தல்.
  alternative: ‘என் மாம்சத்தில்’ அல்லது ‘என் மாம்சமின்றி’.
  rationale: מִן என்ற முன்னிடைச்சொல்லும் இத்தொடரின் தொடரியலும் பலவாறு புரிந்துகொள்ளப்பட்டுள்ளன. ‘மாம்சத்தில்’ என்பது உடல்சார்ந்த உயிர்த்தெழுதலைத் தெளிவாக ஆதரிக்கும்; ‘மாம்சமின்றி’ என்பது உடலற்ற தரிசனத்தைச் சுட்டும். மூலமொழி தெளிவாகத் தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்காமல், நேரடியான ‘இலிருந்து’ என்பதை முதன்மைப் பாடத்தில் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உடல்சார் உருவகத்தைப் பாதுகாக்க ‘தோல்’, ‘மாம்சம்’ ஆகிய சொற்கள் வைக்கப்பட்டுள்ளன. மூலத்தின் இரண்டு முக்கிய சிக்கல்களுக்கும் அடிக்குறிகள் முதன்மைப் பாடத்தில் முறையாகக் குறிக்கப்பட்டுள்ளன.
