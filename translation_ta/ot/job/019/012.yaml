  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: ta
  text: அவருடைய படையணிகள் ஒன்றாக வருகின்றன; எனக்கு எதிராகத் தங்கள் பாதையை உயர்த்தி அமைக்கின்றன[a]; என் கூடாரத்தைச் சுற்றிலும் முகாமிடுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிராகத் தங்கள் வழியை மண் குவித்து அமைக்கின்றன.” எபிரெய வினைச்சொல் ஒரு சாலையை உயர்த்தி அமைப்பதையோ முற்றுகைக்கான மண் மேட்டை எழுப்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ஒன்றாக
  rationale: ஒருங்கிணைந்த அல்லது ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கும் வினையடை; இயல்பான நவீனத் தமிழில் கூட்டுத் தாக்குதலின் உணர்வைப் பாதுகாக்கிறது.
- source_word: יָבֹאוּ
  choice: வருகின்றன
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’. எபிரெயக் கவிதையின் தாக்கமிக்க நிகழ்காலக் காட்சியைத் தமிழிலும் நிகழ்காலத்தால் வெளிப்படுத்துகிறது.
- source_word: גְדוּדָיו
  choice: அவருடைய படையணிகள்
  rationale: גְּדוּד என்பது படையணி, தாக்குதல் குழு, அல்லது படைப்பிரிவு எனப் பொருள்படும். ‘படையணிகள்’ இராணுவ உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; மூன்றாம் நபர் ஒருமை உரிமை விகுதி ‘அவருடைய’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּסֹלּוּ
  choice: உயர்த்தி அமைக்கின்றன
  rationale: סלל என்பது பாதையையோ முற்றுகை மேட்டையையோ மண் குவித்து உயர்த்தி அமைப்பதைக் குறிக்கலாம். இந்தத் தேர்வு கட்டுமானமும் முற்றுகையும் சார்ந்த படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: சொல்லுக்கு நேரடியாக ‘என்மேல்’ என்ற பொருள் இருந்தாலும், பகைமையான முற்றுகைச் சூழலில் எதிர்ப்புப் பொருளை ‘எனக்கு எதிராக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דַּרְכָּם
  choice: தங்கள் பாதையை
  rationale: דֶּרֶךְ என்பது பாதை, வழி, சாலை எனப் பொருள்படும். உயர்த்தி அமைத்தல் என்ற வினையுடன் ‘பாதை’ concrete இராணுவ அணுகுவழிப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிடுகின்றன
  rationale: חנה என்பதன் பொருள் முகாமிடுதல். இராணுவச் சூழலை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலும் சூழ்ந்திருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לְאָהֳלִי
  choice: என் கூடாரத்தை
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்’. அது குடியிருப்பு அல்லது குடும்பத்தையும் குறிக்கக்கூடியிருந்தாலும், மூலத்தின் தெளிவான காட்சிப்படிமம் இங்கே பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவருடைய படையணிகள்’ என்பதிலுள்ள மூன்றாம் நபர் ஒருமை உரிமை விகுதியின் சுட்டுப்பொருள்
  choice: யோபு தம்மைத் தாக்குகிறவராக உருவகிக்கும் கடவுளைச் சூழல் சுட்டுகிறது; மொழிபெயர்ப்பு ‘அவருடைய’ என்ற பதிலீட்டைப் பாதுகாக்கிறது.
  alternative: உருவகத்தில் பெயர் குறிப்பிடப்படாத ஓர் எதிரிப் படைத்தலைவர்
  rationale: உடனடிச் சூழலில் யோபு கடவுளின் செயலை முற்றுகைத் தாக்குதலாக வருணிக்கிறார். ஆயினும் மூலத்தில் பெயர் வெளிப்படையாகச் சேர்க்கப்படாததால், தமிழிலும் ‘கடவுளுடைய’ என விளக்கிச் சொல்லாமல் பதிலீடே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் இராணுவ முற்றுகைப் படிமத்தையும் காக்கும் நடை. எபிரெயத் தொடரின் தீவிரத்தை உணர்த்த நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன. ‘அவருடைய’ என்பது சுட்டுப்பொருளை வெளிப்படையாகத் தீர்மானிக்காமல் சூழல் வழியே உணரச் செய்கிறது.
