  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: ta
  text: நான் என் பணியாளனைக் கூப்பிடுகிறேன்[a]; ஆனால் அவன் பதிலளிப்பதில்லை[b]. என் வாயாலேயே அவனிடம் மன்றாடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் அடிமையை.’ எபிரெயச் சொல் עֶבֶד சூழலுக்கேற்ப பணியாளனையோ அடிமையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் என் பணியாளனைக் கூப்பிட்டேன்; ஆனால் அவன் பதிலளிக்கவில்லை. என் வாயாலேயே அவனிடம் மன்றாடினேன்.’ எபிரெய வினைவடிவங்களை இன்னும் கண்டிப்பாக இறந்தகாலத்தில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: என் வேலைக்காரனை
  rationale: עֶבֶד என்பது சூழலுக்கேற்ப வேலைக்காரன் அல்லது அடிமை எனப் பொருள்படும். இங்கு யோபின் வீட்டில் அவருக்குக் கீழ்ப்பட்ட ஒருவரைக் குறிக்கிறது; இயல்பான முதன்மை வாசகமாக ‘வேலைக்காரன்’ வைக்கப்பட்டு, ‘அடிமை’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קָרָאתִי
  choice: நான் ... அழைக்கிறேன்
  rationale: நிறைவுற்ற வினைவடிவமாக இருந்தாலும், கவிதைமிகு புலம்பலில் தற்போதைய அனுபவத்தை உயிரோட்டமாகச் சொல்லும் நிகழ்காலமாக இதை எடுத்துக்கொள்ளலாம். இறந்தகால வாசிப்பும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלֹא יַעֲנֶה
  choice: ஆனால் அவன் பதிலளிப்பதில்லை
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதிலளி’. இணைப்புச் சொல் இங்குள்ள எதிர்மறை முரண்பாட்டை வெளிப்படுத்த ‘ஆனால்’ என மொழிபெயர்க்கப்படுகிறது; குறைநிறை வினைவடிவு தற்போதைய தொடர்ந்த பதிலின்மையாகக் கொள்ளப்படுகிறது.
- source_word: בְּמוֹ פִי
  choice: என் சொந்த வாயால்
  rationale: במו פי என்பது யோபு நேரடியாகத் தன் வாயாலேயே மன்றாட வேண்டிய அவமானத்தை வலியுறுத்துகிறது. ‘என் சொந்த வாயால்’ அந்த அழுத்தத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֶתְחַנֶּן לוֹ
  choice: அவனிடம் கெஞ்சுகிறேன்
  rationale: חנן என்பதன் ஹித்பாயேல் வடிவம் தயவு கோரி மன்றாடுதல் அல்லது கெஞ்சுதலைக் குறிக்கிறது. எபிரெய உரையில் இல்லாத ‘வேண்டும்’ என்ற கட்டாய நுணுக்கத்தைச் சேர்க்காமல், ‘கெஞ்சுகிறேன்’ நேரடியாகவும் இயல்பாகவும் பொருளைத் தருகிறது.
