lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினை உரையாடல் சூத்திரத்தில் ‘பதிலளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படும். தமிழில் அடுத்துவரும் ‘சொன்னது’ என்பதோடு இயல்பாக இணைந்து எபிரெய அமைப்பையும் காக்கிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்பதாகும். பேச்சை அறிமுகப்படுத்தும் எபிரெய சூத்திரத்தை தேவையற்ற விரிவாக்கமின்றி பிரதிபலிக்கிறது.
- source_word: וַ
  choice: அப்போது
  rationale: முதல் வினையுடன் இணைந்த waw கதைத் தொடர்ச்சியைக் குறிக்கிறது. இயந்திரமாக ‘மேலும்’ என்று மொழிபெயர்ப்பதைவிட ‘அப்போது’ நவீன தமிழில் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
