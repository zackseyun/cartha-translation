source:
  edition: WLC
  text: שַׁאֲגַ֣ת אַ֭רְיֵה וְ/ק֣וֹל שָׁ֑חַל וְ/שִׁנֵּ֖י כְפִירִ֣ים נִתָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: ta
  text: சிங்கத்தின் கர்ஜனையும், வலிமைமிக்க சிங்கத்தின் குரலும், இளம் சிங்கங்களின் பற்களும் அழிக்கப்படுகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல், குறிப்பாகப் பற்களைப் பொறுத்தவரை, ‘பிடுங்கப்படுகின்றன,’ ‘பெயர்த்தெடுக்கப்படுகின்றன,’ அல்லது ‘முறிக்கப்படுகின்றன’ என்றும் பொருள்படலாம். ஒரே வினைச்சொல் இம்மூன்று கவித்துவக் கூறுகளுடனும் இணைக்கப்பட்டுள்ளது.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: கர்ஜனை
  rationale: שׁאג என்பதிலிருந்து வந்த இந்தச் சார்புப்பெயர் சிங்கத்தின் உரத்த கர்ஜனையைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கவித்துவ வலிமையுடனும் உள்ளது.
- source_word: אַרְיֵה
  choice: சிங்கம்
  rationale: சிங்கத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; அடிப்படைப் பொருளே இங்கு பொருத்தமானது.
- source_word: קוֹל
  choice: முழக்கம்
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள் வரலாம். சிங்கத்தைப் பற்றிய இக்கவித்துவ இணைப்பில் ‘முழக்கம்’ இயல்பாக இருந்து, முன்னுள்ள ‘கர்ஜனை’ என்பதோடு சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: שָׁחַל
  choice: கொடிய சிங்கம்
  rationale: வலிமையையும் மூர்க்கத்தையும் உணர்த்தக்கூடிய கவித்துவமான சிங்கப்பெயர். ‘கொடிய சிங்கம்’ அதை אַרְיֵה என்பதிலிருந்து வேறுபடுத்துகிறது; உறுதியற்ற ‘கருஞ்சிங்கம்’ என்ற குறிப்பைத் தவிர்க்கிறது.
- source_word: שִׁנֵּי
  choice: பற்கள்
  rationale: ‘பல்’ என்பதன் பன்மைச் சார்பு வடிவம்; அடுத்துள்ள ‘இளம் சிங்கங்கள்’ என்பதோடு இயல்பான தமிழ்ச் சொற்றொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְפִירִים
  choice: இளம் சிங்கங்கள்
  rationale: כפיר என்பது உதவியற்ற குட்டியை அல்ல, இளமையும் வேட்டையாடும் வலிமையும் கொண்ட சிங்கத்தைக் குறிக்கிறது.
- source_word: נִתָּעוּ
  choice: பிடுங்கப்படுகின்றன
  rationale: இந்த நிபால் வினை வன்மையாகப் பெயர்த்தல் அல்லது பிடுங்குதல் என்ற படிமத்தைக் கொண்டது. பற்களைப் பொறுத்தவரை ‘பிடுங்கப்படுகின்றன’ என்பது ‘முறிக்கப்படுகின்றன’ என்பதைவிட மூலச்சொல்லின் அகற்றும் வன்மையை நேரடியாகக் காக்கிறது.
