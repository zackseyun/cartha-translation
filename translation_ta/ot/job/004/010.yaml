translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே எபிரெய வினை ஒலி மற்றும் பற்கள் ஆகிய மாறுபட்ட படிமங்களோடு நிற்பதால் ஏற்படும் zeugma தமிழில் கடினமாகாமல் இருக்க அரைப்புள்ளியால் இரு கூறுகளாக வெளிப்படுத்தப்பட்டது; மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
