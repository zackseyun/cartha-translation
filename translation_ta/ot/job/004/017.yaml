source:
  edition: WLC
  text: הַֽ֭/אֱנוֹשׁ מֵ/אֱל֣וֹהַ יִצְדָּ֑ק אִ֥ם מֵ֝/עֹשֵׂ֗/הוּ יִטְהַר גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: ta
  text: மரணத்துக்குட்பட்ட மனிதன் கடவுளின் முன்னிலையில் நீதியுள்ளவனாக இருக்க முடியுமா? ஒரு மனிதன் தன் படைத்தவரின் முன்னிலையில் தூயவனாக இருக்க முடியுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ஒப்பீட்டுப் பொருளில்: “மரணத்துக்குட்பட்ட மனிதன் கடவுளைவிட நீதியுள்ளவனாக இருக்க முடியுமா? ஒரு மனிதன் தன் படைத்தவரைவிடத் தூயவனாக இருக்க முடியுமா?”'
    reason: מִן என்ற எபிரெய முன்னிடைச்சொல் இங்கு ‘முன்னிலையில்’ என்ற உறவுநிலைப் பொருளிலோ, ‘விட’ என்ற ஒப்பீட்டுப் பொருளிலோ புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: அற்ப மனிதன்
  rationale: אֱנוֹשׁ என்பது பொதுவாக மனிதனை மட்டும் குறிக்காமல், அவனுடைய பலவீனத்தையும் நிலையாமையையும் வலியுறுத்தக்கூடும். கடவுளுடன் உள்ள முரண்பாட்டை வெளிப்படுத்த ‘அற்ப மனிதன்’ இயல்பான தமிழில் அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: מֵאֱלוֹהַ
  choice: கடவுளுக்கு முன்பாக
  rationale: צדק என்பதுடன் வரும் מִן ஒப்பீட்டுப் பொருளிலோ உறவுநிலைப் பொருளிலோ புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் ‘கடவுளுக்கு முன்பாக’ என்பது மனிதன் கடவுளின் முன்னிலையில் நீதியுள்ளவனாக நிற்க முடியுமா என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִצְדָּק
  choice: நீதிமானாக இருக்க முடியுமா
  rationale: צדק இங்கு சரியானவன் அல்லது நீதியுள்ளவன் என்று மதிப்பிடப்படுவதைக் குறிக்கிறது. ‘நீதிமானாக இருக்க’ என்பது அதன் ஒழுக்க மற்றும் நீதித்துறை சார்ந்த பொருளை dignified modern Tamil-இல் பாதுகாக்கிறது.
- source_word: אִם
  choice: முடியுமா
  rationale: கவிதை இணைவரியில் אִם இரண்டாவது வினாவை அறிமுகப்படுத்துகிறது. தமிழில் ‘முடியுமா?’ என்பதை மீண்டும் பயன்படுத்துவது இணையான சொல்லமைப்பையும் சொல்லாட்சியின் வினாவலிமையையும் தெளிவாக்குகிறது.
- source_word: מֵעֹשֵׂהוּ
  choice: தன்னை உண்டாக்கியவருக்கு முன்பாக
  rationale: עֹשֵׂהוּ என்பது ‘அவனை உண்டாக்கியவர்’ என்று பொருள்படும். ‘தன்னை உண்டாக்கியவர்’ என்பது படைப்பவர்–படைப்பு உறவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; மִן என்பதன் உறவுநிலை வாசிப்பையும் தக்கவைக்கிறது.
- source_word: יִטְהַר
  choice: தூயவனாக இருக்க முடியுமா
  rationale: טהר தூய்மை அல்லது சுத்தத்தைக் குறிக்கிறது. இங்கு צדק-க்கு இணையாக ஒழுக்க மற்றும் ஆன்மிகத் தூய்மையை உணர்த்துவதால் ‘தூயவனாக’ பொருத்தமானது.
- source_word: גָּבֶר
  choice: ஒரு மனிதன்
  rationale: גֶּבֶר ஆண்பால் ஒருமைச் சொல்லாக இருந்தாலும், இங்கு אֱנוֹשׁ உடன் கவிதை இணையாக மனிதனைக் குறிக்கிறது. ‘ஒரு மனிதன்’ என்பது தேவையற்ற ‘வலிமைமிக்கவன்’ என்ற நுணுக்கத்தைச் சேர்க்காமல் வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளின் முன்னிலையில் மனிதனுடைய நீதியும் தூய்மையும்
  choice: எந்த அற்ப மனிதனும் கடவுளுக்கு முன்பாக நீதிமானாகவும், தன்னை உண்டாக்கியவருக்கு முன்பாகத் தூயவனாகவும் இருக்க முடியுமா என்ற சொல்லாட்சிக் கேள்வியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு மனிதன் கடவுளைவிட நீதியுள்ளவனாக இருக்க முடியுமா? தன்னை உண்டாக்கியவரைவிடத் தூயவனாக இருக்க முடியுமா?’ என்ற நேரடி ஒப்பீட்டு வாசிப்பு.
  rationale: מִן ஒப்பீட்டையும் (‘விட’) உறவுநிலையையும் (‘முன்பாக’) குறிக்கக்கூடும். சூழலில் கடவுளுடன் ஒப்பிடப்படும் மனித பலவீனமே மையமாக இருப்பதால், முதன்மை உரை கடவுளின் முன்னிலையில் மனிதன் நிற்கும் நிலையை இயல்பாகத் தெரிவிக்கிறது. எபிரெயிலுள்ள உண்மையான ஒப்பீட்டு சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; பிற்கால கோட்பாட்டு வடிவம் உரைக்குள் இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இரு இணை வினாக்களின் கவிதை அமைப்பும் சொல்லாட்சிச் சக்தியும் காக்கப்பட்டுள்ளன. ‘அற்ப மனிதன்’ மனித நிலையாமையைச் சுட்டுகிறது; ‘தன்னை உண்டாக்கியவர்’ என்பது ‘படைத்தவர்’ என்பதைக் காட்டிலும் மூல participle-இன் நேரடி தன்மையைத் தக்கவைக்கிறது.
