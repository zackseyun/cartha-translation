source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: ta
  text: 'இதோ, அவர் தமது பணியாளர்கள்மீது நம்பிக்கை வைப்பதில்லை;

    தமது தூதர்கள்மீது[a] பிழையைச்[b] சுமத்துகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்கள்’ என்பதற்கு மாற்றாக, ‘தேவதூதர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மனிதத் தூதர்களையோ விண்ணுலகத் தூதர்களையோ குறிக்கலாம்; இங்கு சூழல் விண்ணுலகத் தூதர்களைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘பிழை’ என்பதற்கு மாற்றாக, ‘மதியீனம்,’ ‘குறை,’ அல்லது ‘நிறைவின்மை’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றை வலியுறுத்தும் எபிரெயச் சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעֲבָדָיו
  choice: தமது பணியாளர்களிடம்
  rationale: אמן என்பதன் ஹிஃபில் வடிவத்துடன் வரும் ב நம்பிக்கையின் இலக்கைக் குறிக்கிறது. இங்கு சமூக அடிமைநிலையைவிட கடவுளுக்குக் கீழ்ப்பட்டுச் சேவை செய்யும் நிலையே முன்னிலையில் இருப்பதால், ‘பணியாளர்கள்’ என்பது பொருத்தமானது.
- source_word: לֹא יַאֲמִין
  choice: நம்பிக்கை வைப்பதில்லை
  rationale: இங்கு அறிவார்ந்த ஒப்புதலை அல்ல, ஒருவர்மீது நம்பிக்கை அல்லது உறுதி வைப்பதையே குறிக்கிறது.
- source_word: וּבְמַלְאָכָיו
  choice: தமது தூதர்கள்மீது
  rationale: מַלְאָך என்பது மனித அல்லது விண்ணுலகத் தூதரைக் குறிக்கலாம். சூழல் விண்ணுலகத் தூதர்களைக் குறிப்பதாகத் தோன்றினாலும், எபிரெயச் சொல்லின் இயல்பான விரிவை ‘தூதர்கள்’ காக்கிறது.
- source_word: יָשִׂים
  choice: சுமத்துகிறார்
  rationale: שׂים மற்றும் பண்பைக் குறிக்கும் பெயர்ச்சொல் சேர்ந்த இந்த அமைப்பு, ஒன்றை ஒருவர்மீது ஏற்றிக் கூறுதல் அல்லது அவருக்குக் குற்றமாகக் கணித்தல் என்ற கருத்தைத் தருகிறது.
- source_word: תָּהֳלָה
  choice: பிழை
  rationale: அரிதாக வரும் இச்சொல் பிழை, மதியீனம், குறை அல்லது நிறைவின்மை போன்ற பொருள்களைக் கொள்ளக்கூடும். ‘பிழை’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் இருந்து, சொல்லின் நிச்சயமின்மையை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: מַלְאָכָיו என்பதை குறிப்பாக ‘தேவதூதர்கள்’ என்று மொழிபெயர்ப்பதா அல்லது பொதுவாக ‘தூதர்கள்’ என்று மொழிபெயர்ப்பதா
  choice: தூதர்கள்
  alternative: தேவதூதர்கள்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘தூதர்கள்’; இச்சூழலில் விண்ணுலக உயிர்கள் குறிக்கப்படுவது சாத்தியமானது. இருப்பினும், மூலமொழியிலுள்ள பரப்பைச் சுருக்காமல் காக்க ‘தூதர்கள்’ எனத் தரப்பட்டு, குறிப்பான வாசிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநடையின் இணை அமைப்பை இரண்டு வரிகளாகக் காத்துள்ளோம். ‘தமது’ என்ற மரியாதைத் தன்னிலைச் சொல் இரு அரையடிகளிலும் ஒரே குறிப்பைத் தெளிவாக்குகிறது; மொழிநடை கண்ணியமாகவும் பொதுவாசகர்களுக்கு எளிதாகவும் வைக்கப்பட்டுள்ளது.
