  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: ta
  text: நான் கண்டபடி, தீமையை[a] உழுகிறவர்களும் துன்பத்தை[b] விதைக்கிறவர்களும் அதையே அறுவடை செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அநீதி” அல்லது “கேடு.” இதற்கான எபிரெயச் சொல் ஒழுக்கத் தீமையையும், சில சூழல்களில் அதனால் வரும் கேட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “துயரம்” அல்லது “தீங்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: கண்டபடி
  rationale: ரָאִיתִי என்பதுடன் இணைந்து, எலிப்பாஸ் தன் அனுபவத்தில் கண்டதை ஆதாரமாகக் கூறும் ஒப்பீட்டு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: רָאִיתִי
  choice: நான் கண்ட
  rationale: முதலாம் நபர் ஒருமை நிறைவுவினையைத் தமிழில் அனுபவக் கவனிப்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֹרְשֵׁי
  choice: உழுகிறவர்கள்
  rationale: பெயர்ச்சொல் பொருளில் வரும் பங்கேற்புவினையைத் தெளிவாகக் காட்டி, வேளாண்மை உருவகத்தைக் காக்கிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இங்கு ஒழுக்கக்கேடு சார்ந்த பொருள் முன்னிலையில் உள்ளது; அதேவேளை இச்சொல் குறிக்கும் ‘கேடு’ அல்லது ‘அநீதி’ என்ற பரப்பை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: וְזֹרְעֵי
  choice: விதைக்கிறவர்களும்
  rationale: இணையான பங்கேற்புவினையையும் உழுதல்–விதைத்தல் உருவகத்தையும் காக்கிறது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: சிரமம், துயரம், தீங்கு ஆகிய பொருள் வட்டத்தை உள்ளடக்கும் இயல்பான தமிழ் சொல்; விதைக்கப்படும் தீங்கும் அதன் விளைவான துன்பமும் இடையிலான திட்டமிட்ட இருபொருள் வாய்ப்பையும் முற்றிலும் அகற்றாது.
- source_word: יִקְצְרֻהוּ
  choice: அதையே அறுவடை செய்வார்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் தொகுப்புப் பொருளை ‘அதையே’ எனக் காட்டி, செயலும் அதற்கேற்ற விளைவும் தொடர்புடையவை என்பதை வலியுறுத்துகிறது; அறுவடை உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: எலிப்பாஸின் உரையில் ஒழுக்கச் செயலுக்கும் விளைவுக்கும் உள்ள தொடர்பு
  choice: எலிப்பாஸ் தான் கண்ட நியதியாக இதை நேரடியாகக் கூறும் வலிமையைப் பேணுதல்
  alternative: இதை மாற்றமற்ற இறைக் கோட்பாடாக வலுப்படுத்துதல் அல்லது வெறும் பொதுவான சாத்தியமாக மென்மைப்படுத்துதல்
  rationale: இது யோபிடம் எலிப்பாஸ் முன்வைக்கும் வாதத்தின் ஒரு பகுதி. எபிரெய உரையில் இல்லாத வரம்பையோ உறுதிப்படுத்தலையோ சேர்க்காமல், நூலின் மொத்த இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உழுதல்—விதைத்தல்—அறுவடை செய்தல்’ என்ற மூல வேளாண்மை உருவகமும் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
