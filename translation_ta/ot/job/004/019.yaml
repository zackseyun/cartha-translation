  text: אַ֤ף שֹׁכְנֵ֬י בָֽתֵּי חֹ֗מֶר אֲשֶׁר בֶּ/עָפָ֥ר יְסוֹדָ֑/ם יְ֝דַכְּא֗וּ/ם לִ/פְנֵי עָֽשׁ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: ta
  text: களிமண் வீடுகளில் குடியிருப்பவர்களைப் பற்றி இன்னும் எவ்வளவு அதிகமாக![a] அவர்களுடைய அடித்தளம் தூசியில் இருக்கிறது; அவர்கள் அந்துப்பூச்சிக்கு முன்பாக நசுக்கப்படுகிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “களிமண் வீடுகளில் குடியிருப்பவர்கள்கூட.” எபிரெயச் சொல் நேரடியாக “கூட,” “உண்மையில்,” அல்லது “மேலும்” எனப் பொருள்படலாம். இங்கு அது முந்தைய வசனத்தின் ஒப்பீட்டை வலுப்படுத்துகிறது; அந்த வசனத்திலிருந்து விடுபட்டுள்ள கூறு எது என்பதை இவ்வசனம் வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்துப்பூச்சியைவிட விரைவாக நசுக்கப்படுகிறார்கள்” / “அந்துப்பூச்சியைவிட எளிதாக நசுக்கப்படுகிறார்கள்.” “அந்துப்பூச்சிக்கு முன்பாக” என்ற சொற்றொடர் மனிதர்கள் எவ்வளவு விரைவாக அல்லது எளிதாக அழிக்கப்படுகிறார்கள் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: எவ்வளவு அதிகமாய்
  rationale: முந்தைய வசனத்திலுள்ள வலியதிலிருந்து மெலியதற்குச் செல்லும் வாதத்தைத் தொடரும் வலியுறுத்தும் ஒப்பீட்டை வெளிப்படுத்துகிறது. எபிரெயச் சொல் ‘கூட/உண்மையில்’ என்றும் பொருள்படலாம்.
- source_word: שֹׁכְנֵי בָתֵּי חֹמֶר
  choice: களிமண் வீடுகளில் குடியிருக்கிறவர்கள்
  rationale: தொடர்ந்து வசிப்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தையும், மனித உடல் மற்றும் மானிட வாழ்வின் நிலையாமையைக் குறிக்கும் களிமண் வீட்டு உருவகத்தையும் காக்கிறது.
- source_word: בֶּעָפָר יְסוֹדָם
  choice: அவர்களுடைய அஸ்திவாரம் புழுதியில் இருக்கிறது
  rationale: ‘புழுதி’ என்பது சொல்லின் நேரடிப் படிமத்தையும் மனிதரின் மரணத்தன்மையோடு அதற்குள்ள தொடர்பையும் காக்கிறது; ஒருமை ‘அஸ்திவாரம்’ கூட்டு உணர்வைத் தக்கவைக்கிறது.
- source_word: יְדַכְּאוּם
  choice: அவர்கள் ... நசுக்கப்படுகிறார்கள்
  rationale: דכא என்ற வினையின் ‘நசுக்கு’ என்ற பொருளைத் தருகிறது. எபிரெயத்தில் செய்பவர் வெளிப்படையாகக் கூறப்படாததால் செயப்பாட்டு வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: לִפְנֵי עָשׁ
  choice: அந்துப்பூச்சிக்கு முன்பாகவே
  rationale: நேரடியான ‘அந்துப்பூச்சிக்கு முன்’ என்ற கவித்துவச் சொல்லாட்சியைப் பாதுகாக்கிறது; அது விரைவாக அல்லது எளிதாக அழிக்கப்படுவதையும் குறிக்கக்கூடும்.
theological_decisions:
- issue: ‘களிமண் வீடுகள்’ என்பதன் உருவகக் குறிப்பு
  choice: மரணத்துக்குட்பட்ட மனித உடலையும் மனித வாழ்வின் பலவீனத்தையும் குறிக்கும் உருவகமாக மொழிபெயர்ப்பில் அப்படியே வைக்கப்பட்டது.
  alternative: மனிதரின் பாதிப்புக்குள்ளாகும் தன்மையைச் சித்தரிக்கும் நேரடியான மண் செங்கல் வீடுகள்.
  rationale: சூழல் விண்ணுலகப் பணியாளர்களுடன் மனிதரை ஒப்பிட்டு மனித நிலையாமையை வலியுறுத்துகிறது; ஆனால் உருவகம் முதன்மை உரையிலேயே விளக்கித் தீர்க்கப்படவில்லை.
- issue: முதல் கூறில் உள்ள மறை வினை
  choice: முந்தைய வசனத்திலிருந்து ‘நம்பத்தகாதவர்கள்’ என்ற கருத்து நிறைவு செய்யப்பட்டது.
  alternative: வினையைச் சேர்க்காமல் ‘களிமண் வீடுகளில் குடியிருக்கிறவர்கள் எவ்வளவு அதிகமாய்!’ என்று துண்டுக் கூற்றாக வைத்தல்.
  rationale: אַף முந்தைய வசனத்தின் வாதத்தைத் தொடர்வதால் தமிழில் பொருள் தெளிவாக இருக்க மறைந்துள்ள கருத்து நிரப்பப்படுகிறது; இது வாதத்தின் திசையை மாற்றாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருக்கிறவர்கள்,’ ‘புழுதி,’ ‘நசுக்கப்படுகிறார்கள்’ ஆகியவை பொதுவாசகருக்குப் புரியத்தக்கவை. ‘அஸ்திவாரம்’ உருவகத்திற்குப் பொருத்தமான பரவலாக அறியப்பட்ட சொல்; எபிரெயத்தின் கவித்துவத் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
