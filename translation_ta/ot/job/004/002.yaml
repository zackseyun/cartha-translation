  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: ta
  text: உன்னிடம் ஒரு வார்த்தை பேசத் துணிந்தால், நீ அலுத்துப்போவாயா?[a] ஆனால், வார்த்தைகளை அடக்கிக்கொள்ள யாரால் முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னிடம் ஒரு காரியத்தைப் பேசத் துணிந்தால், நீ அலுத்துப்போவாயா?”
    reason: נסה மற்றும் דָבָר ஆகியவற்றின் முறையே ‘துணிதல்’ மற்றும் ‘காரியம்’ என்ற செல்லத்தக்க மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: சொல்ல முயன்றால்
  rationale: נסה என்பதன் இவ்வடிவம் ஒன்றை முயல்வது அல்லது துணிந்து செய்வது என்ற பொருளைத் தருகிறது. இங்கு எலிப்பாஸ் பேசத் தொடங்கத் தயங்குவதால், தமிழ் இயல்புக்கேற்ப ‘சொல்ல முயன்றால்’ என வழங்கப்பட்டது.
- source_word: דָבָר
  choice: ஒரு வார்த்தை
  rationale: דבר என்பது ‘வார்த்தை,’ ‘காரியம்,’ அல்லது ‘ஒன்று’ எனப் பொருள்படலாம். பின்னர் வரும் ‘வார்த்தைகள்’ என்பதுடன் உள்ள ஒலிப்பொருள் தொடர்பைப் பாதுகாக்க ‘ஒரு வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: நேரடியாக ‘உன்னிடத்தில்/உனக்கு’ என்று பொருள். ஒருவரை நோக்கிப் பேசுவதைக் குறிக்க நவீனத் தமிழில் ‘உன்னிடம்’ இயல்பாக உள்ளது.
- source_word: תִּלְאֶה
  choice: நீ சோர்ந்துபோவாயா?
  rationale: לאה என்பதன் அடிப்படைப் பொருள் சோர்வடைதல் அல்லது களைப்படைதல். இங்கு கேட்பதால் ஏற்படும் மனச்சோர்வு அல்லது அலுப்பையும் உள்ளடக்கக்கூடிய மூலத்தின் விரிவை ‘சோர்ந்துபோவாயா?’ பாதுகாக்கிறது.
- source_word: וַעְצֹר
  choice: அடக்கிக்கொள்ள
  rationale: עצר என்பது தடுத்தல் அல்லது அடக்குதல். பேசாமல் தன்னைக் கட்டுப்படுத்திக்கொள்வது என்ற சூழல்சார் பொருளை ‘அடக்கிக்கொள்ள’ இயல்பாகத் தருகிறது.
- source_word: בְּמִלִּין
  choice: வார்த்தைகளை
  rationale: இது ‘வார்த்தைகள்’ என்பதற்கான பன்மை வடிவம். முந்தைய דָבָר உடனான தொடர்பைப் பாதுகாக்க அதே சொல்லாட்சி பயன்படுத்தப்பட்டது.
- source_word: מִי יוּכָל
  choice: யாரால் முடியும்?
  rationale: திறனைப் பற்றிய சொல்லாட்சியான இதைத் தமிழில் இயல்பான வினாவாக ‘யாரால் முடியும்?’ என்று வழங்குவது பொருத்தமானது.
