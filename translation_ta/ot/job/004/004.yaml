translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க கவிதைநடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைவாக்கியத்தின் உடல்சார் படிமங்களும் நிற்கச் செய்தல்—வலுப்படுத்துதல் என்ற பொருள் இணையும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிப்பான்களும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
