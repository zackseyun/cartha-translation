source:
  edition: WLC
  text: כּ֭וֹשֵׁל יְקִימ֣וּ/ן מִלֶּ֑י/ךָ וּ/בִרְכַּ֖יִם כֹּרְע֣וֹת תְּאַמֵּֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/004.yaml
  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: ta
  text: தடுமாறியவனை உன் வார்த்தைகள் எழுந்து நிற்கச் செய்தன[a]; தளர்ந்து மடங்கிய முழங்கால்களை நீ வலுப்படுத்தினாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாங்கி நிறுத்தின” / “நிலைநிறுத்தின.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்பட, “மடங்கிக்கொண்டிருந்த முழங்கால்கள்”; பலவீனத்தால் முழங்கால்கள் தளர்ந்து சரியும் நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: தடுமாறியவனை
  rationale: כשל என்பதன் பங்கேற்பு வடிவம் தடுமாறுகிற அல்லது நிலைகுலைகிற ஒருவரைக் குறிக்கிறது. தமிழில் தனித்து இயல்பாக அமையவும், மூலத்தின் இயக்கப் படிமத்தைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְקִימוּן
  choice: எழுந்து நிற்கச் செய்தன
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், எழுப்புதல், நிலைநிறுத்துதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. வார்த்தைகள் தடுமாறியவரை மீண்டும் நிற்கச் செய்தன என்ற படிமத்தை இது தெளிவாகக் காக்கிறது.
- source_word: מִלֶּיךָ
  choice: உன் வார்த்தைகள்
  rationale: מִלָּה என்பதன் பன்மை நேரடியாக ‘வார்த்தைகள்’ அல்லது ‘பேச்சு’ எனப் பொருள்படும்; இங்கு ‘உன் வார்த்தைகள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: בִרְכַּיִם
  choice: முழங்கால்களை
  rationale: உடல் உறுப்பைக் குறிக்கும் சொல்லை நேரடியாக மொழிபெயர்த்து, பலவீனத்தால் சரியும் நிலையை விளக்கும் கவிதைப் படிமம் பாதுகாக்கப்பட்டது.
- source_word: כֹּרְעוֹת
  choice: தளர்ந்து மடங்கிய
  rationale: כרע என்பது மடங்குதல், குனிதல் அல்லது கீழே சரிதல் எனப் பொருள்படும். முழங்கால்களுடன் வருவதால், பலவீனத்தில் அவை தளர்ந்து மடங்கும் நிலையை இத்தொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: תְּאַמֵּץ
  choice: வலுப்படுத்தினாய்
  rationale: אמץ என்பதன் பியேல் வடிவம் உறுதிப்படுத்துதல் அல்லது வலிமையாக்குதல் என்று பொருள்படும். தளர்ந்த முழங்கால்கள் என்ற உடல்சார் உருவகத்துடன் ‘வலுப்படுத்தினாய்’ நேர்த்தியாகப் பொருந்துகிறது.
