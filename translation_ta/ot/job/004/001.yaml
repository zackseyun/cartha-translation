  yaml_path: translation/ot/job/004/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: ta
  text: 'அப்போது தேமானைச் சேர்ந்த எலிப்பாஸ் பதிலளித்துக் கூறினான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்ற வினை இங்கு யோபின் உரைக்குப் பதிலளிப்பதைக் குறிக்கிறது. அடுத்துள்ள וַיֹּאמַר என்பதுடன் இணைந்து வரும் எபிரெய உரையாடல் தொடக்கச் சூத்திரத்தை இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: הַתֵּימָנִי
  choice: தேமானியனான
  rationale: இன/இடச் சார்பைக் குறிக்கும் இச்சொல் தேமான் ஊரைச் சேர்ந்தவர் என எலிப்பாஸை அடையாளப்படுத்துகிறது; சுருக்கமான மூல வடிவத்தைப் பேணுகிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: எபிரெய மொழியின் வழக்கமான பேச்சு அறிமுகச் சூத்திரத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்த வசனத்தில் தொடங்கும் நேரடி உரைக்கு ஏற்ற தொடர் வடிவமாகும்.
- source_word: וַ
  choice: அப்போது
  rationale: முதற்கண் வரும் வாவ் கதையோட்டத்தின் தொடர்ச்சியையும் அடுத்த நிகழ்வையும் குறிக்கிறது; 'அப்போது' நவீனத் தமிழில் இயல்பான தொடர்பை அளிக்கிறது.
