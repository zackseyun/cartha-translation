translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம உரைநடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘பதிலளித்து கூறினான்’ என்ற இரட்டை வினைச் சூத்திரம் தமிழில் செயற்கையாக ஒலிக்காமல் இருக்க ‘மறுமொழியாகச் சொன்னது’ என ஒருங்கிணைக்கப்பட்டுள்ளது; அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்துவதால் அஃறிணை வாக்கிய முடிவான ‘சொன்னது:’ பயன்படுத்தப்பட்டுள்ளது.
