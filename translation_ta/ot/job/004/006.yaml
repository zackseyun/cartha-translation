source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: ta
  text: உன் பயம்[a] உன் உறுதி அல்லவா? உன் நம்பிக்கை உன் வழிகளின் நேர்மை அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுக்கான உன் பயம்.’ எபிரெயத்தில் பயத்தின் பொருள் வெளிப்படையாகக் கூறப்படவில்லை; ஞான இலக்கியத்தில் அது பொதுவாகக் கடவுளுக்குரிய பயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் வினா வடிவில் தருகிறது; ‘நிச்சயமாக’ என்று கூற்றாக மாற்றவில்லை.
- source_word: יִרְאָתְךָ
  choice: உன் கடவுள் பயம்
  rationale: மூலத்தில் ‘உன் பயம்’ என்று மட்டுமே இருந்தாலும், ஞான இலக்கியச் சூழலில் அது பொதுவாகக் கடவுளுக்குரிய பயபக்தியைக் குறிக்கிறது. ‘பயம்’ என்ற அடிப்படைச் சொல்லை வைத்துக்கொண்டு, மறைமுகமான பொருளைத் தெளிவாக்குகிறது.
- source_word: כִּסְלָתֶךָ
  choice: உன் உறுதி
  rationale: இச்சூழலில் இப்பெயர்ச்சொல் ‘மூடத்தனம்’ அல்ல, நம்பிக்கையால் உண்டாகும் உறுதி அல்லது தன்னம்பிக்கையைக் குறிக்கிறது. அடுத்துள்ள תִּקְוָה என்பதிலிருந்து வேறுபடுத்த ‘உறுதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִּקְוָתְךָ
  choice: உன் நம்பிக்கை
  rationale: எதிர்காலத்தை நோக்கிய எதிர்பார்ப்பையும் நம்புதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְתֹם
  choice: நேர்மை
  rationale: முழுமை, குற்றமின்மை, ஒழுக்க ஒருமைப்பாடு ஆகிய அர்த்தவட்டத்தில், இங்கு மனிதனின் நடத்தையை விவரிக்க இயல்பானதும் அளவுக்கு மீறாததுமான சொல்.
- source_word: דְּרָכֶיךָ
  choice: உன் வழிகளின்
  rationale: எபிரெய ஞான இலக்கியத்தின் ‘வழிகள்’ என்ற நடத்தை உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘பயம்’ என்பதன் மறைமுகச் செயப்படுபொருள்
  choice: முதன்மை உரையில் ‘கடவுள் பயம்’
  alternative: ‘உன் பயம்’ அல்லது ‘உன் பயபக்தி’
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை. இருப்பினும் ஞான இலக்கியச் சூழல் கடவுளுக்குரிய பயத்தையே வலுவாகச் சுட்டுகிறது. இந்த மறைமுகத்தை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிட்டுள்ளோம்.
- issue: நான்கு பெயர்ச்சொற்களின் தொடரியல் உறவு
  choice: 'இரண்டு இணையான கூறுகள்: ‘பயம்—உறுதி’, ‘வழிகளின் நேர்மை—நம்பிக்கை’'
  alternative: இறுதிச் சொற்றொடர்களை ஒரே பட்டியலாக வாசித்தல்
  rationale: எபிரெயக் கவிதையின் சமநிலை அமைப்பு இரண்டு இணையான பெயர்ச்சொல் வாக்கியங்களைச் சுட்டுகிறது. தமிழில் ‘உம் … உம்’ அமைப்பு அந்த இணைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவிதைச் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘உம் … உம்’ இணைப்பு மூலத்தின் இரு இணையான கூறுகளை ஒரே வினாவாக வைத்திருக்கிறது. ‘உறுதி’ மற்றும் ‘நம்பிக்கை’ என்ற வேறுபாடு כִּסְלָה மற்றும் תִּקְוָה ஆகியவற்றை ஒரே தமிழ்ச் சொல்லால் மங்கச் செய்வதைத் தவிர்க்கிறது.
