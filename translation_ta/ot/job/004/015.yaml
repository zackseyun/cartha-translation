  source_fidelity: 'முதன்மை வாசகம் எபிரெய மூலத்தின் வரிசையையும் பொருளையும் சரியாகப் பின்பற்றுகிறது: וְרוּחַ என்பதற்கு ‘ஓர் ஆவி’ எனத் தேர்ந்தெடுத்திருப்பதும், அதன் மாற்றுப்பொருள்களை அடிக்குறிப்பில் தக்கவைத்திருப்பதும் பொருத்தமானது. இருப்பினும் שַׂעֲרַת בְּשָׂרִי என்பது தலைமுடியை அல்ல, உடலின் ரோமத்தைச் சுட்டுகிறது; ‘முடி’ என்பதற்கு நவீனத் தமிழில் தலைமுடி என்ற முதன்மைப் பொருள் ஏற்படக்கூடும். மேலும் תְּסַמֵּר-ன் ‘நிமிரச் செய்தது/நிமிர்ந்தது’ என்ற படிமத்தை ‘நிமிர்ந்தன’ இன்னும் நேரடியாகத் தருகிறது.'
  naturalness: ‘என் முகத்திற்கு முன்பாகக் கடந்து சென்றது’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘என் உடலின் ரோமங்கள் நிமிர்ந்தன’ என்பது நவீன நிலையான தமிழில் தெளிவானது; அச்சத்தால் உடல்மயிர் நிமிரும் காட்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
