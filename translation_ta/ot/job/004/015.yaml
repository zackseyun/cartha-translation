source:
  edition: WLC
  text: וְ֭/רוּחַ עַל פָּנַ֣/י יַחֲלֹ֑ף תְּ֝סַמֵּ֗ר שַֽׂעֲרַ֥ת בְּשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: ta
  text: அப்போது ஓர் ஆவி என் முகத்திற்கு முன்பாகக் கடந்து சென்றது[a]; என் உடலின் ரோமங்கள் நிமிர்ந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு காற்று” அல்லது “ஒரு மூச்சு” என் முகத்திற்கு முன்பாகக் கடந்து சென்றது. எபிரெயச் சொல்லான רוּחַ என்பதற்கு “ஆவி,” “காற்று,” அல்லது “மூச்சு” என்று பொருள் கொள்ளலாம்; இங்குள்ள சூழல் “ஆவி” என்பதையே அதிகம் ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: ஓர் ஆவி
  rationale: רוּחַ என்பதற்கு ‘ஆவி’, ‘காற்று’, ‘மூச்சு’ ஆகிய பொருள்கள் உண்டு. அச்சமூட்டும் மர்மமான தரிசனச் சூழலில் ‘ஆவி’ என்பது உடனடிப் பொருளுக்கு மிகவும் பொருந்துகிறது; எபிரெயச் சொல்லில் திட்டவட்டத் தன்மை இல்லாததை ‘ஓர்’ வெளிப்படுத்துகிறது.
- source_word: עַל פָּנַי
  choice: என் முகத்திற்கு முன்பாக
  rationale: சொல்லளவில் ‘என் முகத்தின்மேல்’ என்றாலும், יחלף என்பதோடு சேரும்போது பேச்சாளரின் முகத்திற்கு முன்னால் கடந்து செல்லும் இயக்கத்தைக் குறிக்கிறது. இந்தத் தெரிவு மூலத்தின் தெளிவான காட்சியைப் பாதுகாக்கிறது.
- source_word: יַחֲלֹף
  choice: கடந்து சென்றது
  rationale: חלף என்பது கடந்து செல்லுதல் அல்லது அருகே கடந்து போதல் என்று பொருள்படும். ‘முகத்திற்கு முன்பாக’ என்பதுடன் ‘கடந்து சென்றது’ இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: תְּסַמֵּר
  choice: சிலிர்த்து நின்றது
  rationale: இந்த வினை இறுகவோ நிமிரவோ செய்தல் என்பதைக் குறிக்கிறது. முடியைக் குறித்த தமிழ்ப் பயன்பாட்டில் ‘சிலிர்த்து நின்றது’ அச்சத்தால் முடி நிமிர்ந்த காட்சியை இயல்பாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: என் உடலின் முடி
  rationale: சொல்லளவில் ‘என் சதையின் முடி’ என்று பொருள். நவீனத் தமிழில் ‘என் உடலின் முடி’ மூலக் காட்சியைத் தக்கவைத்தபடி தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
theological_decisions:
- issue: רוּחַ என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘ஆவி’
  alternative: ‘காற்று’ அல்லது ‘மூச்சு’
  rationale: தரிசனத்துக்குரிய மர்மமான இருப்பும் அதனால் உண்டாகும் உடல் அச்சமும் ‘ஆவி’ என்ற பொருளை ஆதரிக்கின்றன. எனினும் எபிரெயச் சொல்லின் உண்மையான பல்பொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘முகத்திற்கு முன்பாக’ என்பது மூலத்தின் காட்சித் தன்மையைப் பாதுகாக்கிறது; ‘சிலிர்த்து நின்றது’ என்பது தமிழில் இயல்பான உடல்-அச்சப் படிமத்தை அளிக்கிறது.
