source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: ta
  text: 'அது அசையாமல் நின்றது; ஆனால் அதன் தோற்றத்தை என்னால் அடையாளம் காண முடியவில்லை. என் கண்களுக்கு முன்பாக ஓர் உருவம் இருந்தது; மௌனம் நிலவியது[a], ஒரு குரலைக் கேட்டேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமைதியான நிலை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மௌனத்தையோ அமைதியான நிலைமையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: அது அசையாமல் நின்றது
  rationale: עמד என்பது ‘நில்’ அல்லது ‘நின்றுகொண்டிரு’ எனப் பொருள்படும். தரிசனச் சூழலில் உருவம் அங்கே நிலைத்து நின்றதை ‘அசையாமல் நின்றது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא אַכִּיר
  choice: ஆனால் அதன் தோற்றத்தை என்னால் அடையாளம் காண முடியவில்லை
  rationale: Hiphil வடிவிலுள்ள נכר என்பது ‘அடையாளம் காண்’ எனப் பொருள்படும். முன்னால் உருவம் இருந்தும் அதை இன்னதென்று அறிய இயலாத முரண்பாட்டை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: מַרְאֵהוּ
  choice: அதன் தோற்றத்தை
  rationale: מראה என்பது காணப்படும் தோற்றத்தைக் குறிக்கிறது. எபிரெயச் சுட்டுப்பின்னொட்டு ஆண்பால் ஒருமையாக இருந்தாலும், குறிப்பிடப்படுவது அடையாளம் தெரியாத தரிசன உருவம்; ஆகவே தமிழில் பாலினத்தைத் தீர்மானிக்காத ‘அதன்’ பொருத்தமானது.
- source_word: תְּמוּנָה
  choice: ஓர் உருவம்
  rationale: תמונה என்பது உருவம், வடிவம் அல்லது சாயல் எனப் பொருள்படும். தெளிவாக அடையாளம் காண முடியாத காட்சியை ‘ஓர் உருவம்’ இயல்பாகக் குறிக்கிறது.
- source_word: לְנֶגֶד עֵינָי
  choice: என் கண்களுக்கு முன்பாக
  rationale: மூலத்தின் ‘என் கண்களுக்கு முன்’ என்ற தெளிவான காட்சியுணர்வை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: דְּמָמָה
  choice: அமைதி நிலவியது
  rationale: דממה என்பது மௌனம், அமைதி அல்லது அசைவற்ற நிசப்தத்தைக் குறிக்கலாம். குரலுக்கு முந்தைய அமைதியான இடைவெளியை முழுமையான தமிழ் வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: וָקוֹל אֶשְׁמָע
  choice: பின்பு ஒரு குரலைக் கேட்டேன்
  rationale: קול என்பது குரல் அல்லது ஒலி; அடுத்த வசனத்தில் சொற்கள் பேசப்படுவதால் ‘குரல்’ சூழலுக்குப் பொருந்துகிறது. ‘பின்பு’ காட்சியிலிருந்து கேட்டலுக்கான தொடர்ச்சியை இயல்பாக்குகிறது.
theological_decisions:
- issue: தரிசன உருவத்தின் பாலினம் அல்லது ஆள்தன்மை
  choice: ‘அது/அதன்’ என்று பாலினம் தீர்மானிக்காமல் மொழிபெயர்த்தல்
  alternative: ‘அவன்/அவனுடைய’ என்று ஆண்பால் ஆளாகக் குறிப்பிடுதல்
  rationale: எபிரெயச் சுட்டுப்பின்னொட்டு இலக்கண ரீதியில் ஆண்பால் ஒருமையாக இருந்தாலும், தரிசனத்தில் தோன்றியது யார் அல்லது என்ன என்பது வசனத்தில் அடையாளப்படுத்தப்படவில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் துண்டிக்கப்பட்ட காட்சித் தொடரை வாசிக்க இயல்பான குறுவாக்கியங்களாக அமைத்துள்ளோம்; இறுதியிலுள்ள முக்காற்புள்ளி அடுத்த வசனத்தில் வரும் உரையை எதிர்நோக்கச் செய்கிறது.
