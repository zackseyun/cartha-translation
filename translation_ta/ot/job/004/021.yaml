source:
  edition: WLC
  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: ta
  text: அவர்களுக்குள்ளிருக்கும் அவர்களுடைய கூடாரக் கயிறு பிடுங்கப்படுவதில்லையா?[a] அவர்கள் ஞானமின்றி இறந்துபோகிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கயிறு அவர்களிடமிருந்து அறுத்தெடுக்கப்படுவதில்லையா?” மரபாக, “அவர்களுடைய மேன்மை அவர்களுக்குள் அகற்றப்படுவதில்லையா?” எபிரெய மொழி, உயிர்க்கயிறு அல்லது கூடாரக் கயிறு பிடுங்கப்படும் கூடார உருவகத்தைப் பெரும்பாலும் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஞானத்தைப் பெறாமலே” அல்லது “ஞானத்தோடு அல்லாமல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: பிடுங்கப்படுவதில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழில் இயல்பான எதிர்மறை வினாவாகப் பாதுகாக்கிறது.
- source_word: נִסַּע
  choice: பிடுங்கப்படுகிறது
  rationale: נסע என்பதன் இங்குள்ள செயப்பாட்டு உணர்வு அகற்றப்படுதல் அல்லது முகாமின் பொருட்கள் பிடுங்கப்படுதல் என்பதாகும்; முந்தைய வசனத்தின் கூடார உருவகத்துக்கு ‘பிடுங்கப்படுகிறது’ பொருந்துகிறது.
- source_word: יִתְרָם
  choice: அவர்களுடைய கூடாரக் கயிறு
  rationale: יתר என்பதற்கு ‘மிகுதி/மேன்மை’ என்ற பொருள் சாத்தியமானாலும், இச்சூழலில் கூடாரக் கயிறு என்ற திடமான உருவகம் மனித வாழ்வின் நிலையாமையைத் தெளிவாகத் தொடர்கிறது.
- source_word: בָּם
  choice: அவர்களுக்குள் இருக்கும்
  rationale: ב pronominal suffix-இன் ‘அவர்களில்/அவர்களுக்குள்’ என்ற கருத்தைப் பாதுகாத்து, தமிழில் கயிறுடன் இயல்பாக இணைக்கிறது.
- source_word: יָמוּתוּ
  choice: அவர்கள் இறந்துபோகிறார்கள்
  rationale: מות என்பதன் சாதாரண நேரடியான பொருள் ‘இறத்தல்’; கூடுதல் விளக்கத்தைச் சேர்க்காமல் வழங்கப்படுகிறது.
- source_word: וְלֹא בְחָכְמָה
  choice: ஞானமின்றி
  rationale: சுருக்கமான எபிரெய சொற்றொடரை இயல்பான தமிழில் தருகிறது; ஞானமில்லாமல் இறப்பது அல்லது ஞானத்தை அடைவதற்கு முன் இறப்பது என்ற இரு சாத்தியங்களையும் அடிக்குறிப்பு காட்டுகிறது.
theological_decisions:
- issue: וְלֹא בְחָכְמָה என்பதன் பொருள்
  choice: ஞானமின்றி
  alternative: ஞானத்தைப் பெறாமலே / ஞானமாய் அல்லாமல்
  rationale: மனிதர்கள் ஞானத்தை அடையுமுன் இறக்கிறார்களா, அல்லது ஞானமில்லாத நிலையில் இறக்கிறார்களா என்பதை மூலவாக்கியம் முழுமையாகத் தீர்மானிக்கவில்லை; முதன்மை உரை சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமக் கவிதைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கூடாரக் கயிறு’ என்ற உருவகம் வெளிப்படையாக வைக்கப்பட்டுள்ளது; எபிரெயத்தின் சுருக்கமான இறுதிப் பகுதியிலுள்ள பொருள் மயக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
