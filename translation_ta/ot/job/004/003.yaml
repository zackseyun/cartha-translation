source:
  edition: WLC
  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: ta
  text: இதோ, நீர் பலருக்கு அறிவுறுத்தியிருக்கிறீர்[a]; தளர்ந்த கைகளைப் பலப்படுத்தியிருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்டித்துத் திருத்தியிருக்கிறீர்” அல்லது “ஒழுக்கப்படுத்தியிருக்கிறீர்”; எபிரெய வினைச்சொல், திருத்துவதன் மூலம் கற்பிக்கும் பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து கூறப்படுவதற்குக் கவனத்தை ஈர்க்கும், கவிதை நடைக்கேற்ற வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יִסַּרְתָּ
  choice: அறிவுறுத்தியிருக்கிறீர்
  rationale: יסר என்பது கண்டித்தல் அல்லது ஒழுக்கப்படுத்துதல் வழியாகக் கற்பித்தல் என்ற பொருள் வரம்பைக் கொண்டது. இங்கு எலிப்பாஸ், யோபு முன்பு பலருக்கு வழிகாட்டியதைப் பாராட்டுவதால், ‘அறிவுறுத்தியிருக்கிறீர்’ என்பது திருத்தும் உட்பொருளை முற்றிலும் நீக்காமல் சூழலுக்கு ஏற்ற நேர்மறையான பொருளைத் தருகிறது.
- source_word: רַבִּים
  choice: பலருக்கு
  rationale: ‘பலர்’ என்ற எளிய அளவுக் குறிப்பைத் தமிழில் வினையின் இயல்பான வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: יָדַיִם רָפוֹת
  choice: தளர்ந்த கைகளை
  rationale: வலிமை இழப்பு அல்லது மனச்சோர்வைக் குறிக்கும் உடல்சார் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: תְּחַזֵּק
  choice: பலப்படுத்தியிருக்கிறீர்
  rationale: חזק என்பதன் தீவிர வினைவடிவம் ‘வலிமையாக்குதல்’ என்று பொருள்படும். முந்தைய நிறைவுற்ற வினையுடன் இணையும் பின்னோக்குப் பார்வையைத் தமிழின் நிகழ்கால நிறைவு வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
