  register: நவீன நிலையான தமிழில், கவித்துவமான கண்ணியத்தையும் தீவிரமான உடல் அனுபவத்தையும் காக்கும் நடை. எபிரெய இணைப்புகளை அப்படியே இயந்திரமாகப் பின்பற்றாமல், குறுங்கூற்றுகளின் ஓட்டம் பாதுகாக்கப்பட்டுள்ளது.
