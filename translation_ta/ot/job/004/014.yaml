  text: פַּ֣חַד קְ֭רָאַ/נִי וּ/רְעָדָ֑ה וְ/רֹ֖ב עַצְמוֹתַ֣/י הִפְחִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: ta
  text: பயம் என்னை வந்தடைந்தது; நடுக்கமும்; அது என் எலும்புகளில் பலவற்றை நடுங்கச் செய்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “என் எலும்புகளின் பெரும்பகுதியை அது பயமுறுத்தியது” என்று உள்ளது. “என் எலும்புகளில் பலவற்றை அது நடுங்கச் செய்தது” என்றும் மொழிபெயர்க்கலாம். “என் எலும்புகளின் பெரும்பகுதி” என்பது தீவிரமான உடல் எதிர்வினையைச் சித்தரிக்கும் கவித்துவமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: திகில்
  rationale: கடுமையான அச்சத்தையும் திடீரென ஏற்பட்ட பயங்கர உணர்வையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קְרָאַנִי
  choice: என்னை ஆட்கொண்டது
  rationale: இங்கு קרא என்பது ‘சந்தித்தது/நேரிட்டது’ என்ற பொருளில் வருகிறது; அச்சம் திடீரென ஒருவர்மேல் வந்த அனுபவத்தை ‘ஆட்கொண்டது’ இயல்பாகக் காட்டுகிறது.
- source_word: וּרְעָדָה
  choice: நடுக்கமும் வந்தது
  rationale: அச்சத்தோடு இணைந்த உடல் எதிர்வினையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְרֹב עַצְמוֹתַי
  choice: என் எலும்புகளையெல்லாம்
  rationale: எபிரெய மொழியின் சொற்படிமம் ‘என் எலும்புகளின் பெருக்கம்/திரள்’ என்பதாக இருந்தாலும், முழு உடலையும் உலுக்கிய தீவிர எதிர்வினையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִפְחִיד
  choice: நடுங்கச் செய்தது
  rationale: பயமுறுத்தியது என்ற காரணவினைப் பொருளையும், எலும்புகளைச் சார்ந்த சூழலில் அதன் உடல்சார் விளைவையும் இணைத்துக் காட்டுகிறது.
