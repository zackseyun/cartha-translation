  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: ta
  text: ஆனால் இப்போது அது உன்னிடம் வருகிறது[a]; நீ சோர்ந்துபோகிறாய். அது உன்னைத் தொடுகிறது[b]; நீ கலங்கிப்போகிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் இப்போது அது உன்னிடம் வருகிறது.” כִּי என்ற எபிரெய இணைப்புச் சொல் பலவாறு மொழிபெயர்க்கப்படலாம்; சூழலில் காணப்படும் முரண்பாட்டைப் பிரதிபலிக்க முதன்மைப் பாடத்தில் “ஆனால்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “வருகிறது,” “தொடுகிறது” ஆகிய எபிரெய வினைச்சொற்கள் பெண்பால் ஒருமையில் உள்ளன; வெளிப்படையாகக் குறிப்பிடப்படாத துன்பம் அல்லது கேட்டை அவை சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஆனால்
  rationale: முன்பு பிறருக்கு யோபு அளித்த ஊக்கத்திற்கும், இப்போது துன்பம் அவரையே அடைந்தபோது அவர் காட்டும் எதிர்வினைக்கும் இடையிலுள்ள முரண்பாட்டைச் சூழல் முன்னிறுத்துகிறது. எபிரெய இணைப்புச் சொல்லுக்குள்ள பல பொருள்களில் இங்கு எதிர்மறைத் தொடர்பைக் காட்டும் ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: யோபின் முந்தைய நடத்தையோடு தற்போதைய நிலையை வேறுபடுத்திக் காட்டும் காலவினையடை.
- source_word: תָּבוֹא
  choice: அது ... வருகிறது
  rationale: வினைச்சொல் பெண்பால் ஒருமையில் உள்ளது; வெளிப்படையாகக் குறிப்பிடப்படாத அதன் எழுவாய் துன்பம் அல்லது கேடாக இருக்கலாம். தமிழில் பாலைக் காட்டாத ‘அது’ மூலத்தின் மறைமுகக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: துன்பம் இப்போது யோபையே தனிப்பட்ட முறையில் வந்தடைந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַתֵּלֶא
  choice: நீ சோர்ந்துபோகிறாய்
  rationale: לאה என்பதன் அடிப்படைப் பொருள் களைத்தல் அல்லது சோர்தல். ‘பொறுமையிழக்கிறாய்’ என ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் வலிமையும் தாங்கும் ஆற்றலும் குன்றுவதை இது தெரிவிக்கிறது.
- source_word: תִּגַּע
  choice: அது ... தொடுகிறது
  rationale: נגע என்பதன் ‘தொடு, எட்டு, தாக்கு’ என்ற பொருள் வரம்பில் ‘தொடுகிறது’ என்பது, துன்பம் வருவதிலிருந்து நேரடியாகத் தொடர்புகொள்வதற்கான கவித்துவ முன்னேற்றத்தைப் பாதுகாக்கிறது.
- source_word: עָדֶיךָ
  choice: உன்னை
  rationale: עד + பின்னொட்டு சொல்லளவில் ‘உன்வரை’ எனப் பொருள்பட்டாலும், ‘தொடுகிறது’ என்பதுடன் இயல்பான தமிழில் ‘உன்னை’ பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַתִּבָּהֵל
  choice: நீ கலங்கிப்போகிறாய்
  rationale: בהל குறிக்கும் திடுக்கம், மனக்கலக்கம், பதற்றம் ஆகிய உணர்வுகளை ‘கலங்கிப்போகிறாய்’ தெரிவிக்கிறது; ‘திகிலடைகிறாய்’ என்று அளவுக்கு மீறி வலுப்படுத்துவதில்லை.
