translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் யோபு நூலின் கண்ணியமான கவித்துவத் தொனியைத் தக்கவைக்கும் நடை. இரண்டாம் நபர் ஒருமைக்கு ‘நீ/உன்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. குறுகிய இணை வாக்கியங்கள் எபிரெய வரியின் படிநிலை முன்னேற்றத்தையும் எலிப்பாசின் நேரடியான கண்டனத் தொனியையும் பாதுகாக்கின்றன.
