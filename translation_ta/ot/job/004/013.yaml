  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: ta
  text: இரவுத் தரிசனங்களிலிருந்து எழுந்த கலக்கமான எண்ணங்களின் நடுவில்[a], மனிதர்கள்மேல் ஆழ்ந்த தூக்கம் விழும்போது[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவுத் தரிசனங்களால் ஏற்பட்ட பதற்றமான எண்ணங்களின் நடுவில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஆண்பால் பன்மைச் சொல் பயன்படுத்தப்பட்டுள்ளது; இங்கு அது மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: கலக்கமான எண்ணங்களின் நடுவில்
  rationale: שְׂעִפִּים என்பது பிரிந்தோ அமைதியற்றோ கலக்கமுற்றோ இருக்கும் எண்ணங்களைக் குறிக்கலாம். சூழலின் இரவுநேர அச்சத்தையும் பன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: இரவுத் தரிசனங்களிலிருந்து எழுந்த
  rationale: מִן காட்டும் தோற்றுவாய் அல்லது காரணத் தொடர்பைத் தெளிவாக்குகிறது; חֶזְיוֹנוֹת לָיְלָה என்பதன் நேரடிப் பொருள் ‘இரவுத் தரிசனங்கள்.’
- source_word: בִּנְפֹל
  choice: விழும்போது
  rationale: בְּ உடன் வரும் வினையெச்ச வடிவம் காலத் தொடர்பை அறிமுகப்படுத்துவதால் ‘விழும்போது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: תַּרְדֵּמָה
  choice: ஆழ்ந்த தூக்கம்
  rationale: இச்சொல் சாதாரண உறக்கத்தைவிட கனமான அல்லது ஆழ்ந்த தூக்கத்தைக் குறிக்கிறது.
- source_word: עַל אֲנָשִׁים
  choice: மனிதர்கள்மேல்
  rationale: אֲנָשִׁים இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும் இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ என்பது தமிழில் துல்லியமும் இயல்பும் கொண்ட பொதுப்படையான சொல்.
theological_decisions:
- issue: אֲנָשִׁים என்பதன் பாலினம் மற்றும் பொதுப்படையான பொருள்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: எபிரெய வடிவம் ஆண்பால் பன்மை என்றாலும் இச்சூழலில் எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கிறது. ‘ஆண்கள்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கிவிடக்கூடும்; இலக்கண வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் தொடரும் வாக்கியத் துணுக்கு என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘தரிசனம்,’ ‘ஆழ்ந்த தூக்கம்’ ஆகியவை மூலத்தின் காட்சியையும் தீவிரத்தையும் காக்கின்றன.
