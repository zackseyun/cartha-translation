  yaml_path: translation/ot/job/004/011.yaml
  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: ta
  text: 'சிங்கம் இரையில்லாமல் அழிந்துபோகிறது;

    சிங்கத்தின்[a] குட்டிகள் சிதறிப்போகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெண் சிங்கத்தின்.’ לָבִיא என்ற எபிரெயச் சொல் சிங்கத்தையோ பெண் சிங்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: சிங்கம்
  rationale: இந்தச் சொல் வலிமையான அல்லது முதிர்ந்த சிங்கத்தைக் குறிக்கக்கூடும்; ஆனால் சூழல் வலிமை அல்லது வயதை வெளிப்படையாகக் குறிப்பிடாததால், இயல்பான பொதுப்பெயரான ‘சிங்கம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹבֵד
  choice: அழிந்துபோகிறது
  rationale: אבד என்பது அழிவு அல்லது நாசத்தை அடைவதைக் குறிக்கிறது. ‘அழிந்துபோகிறது’ என்பது வெறும் ‘சாகிறது’ என்பதைவிட மூலத்தின் நீதிமொழி போன்ற தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: מִבְּלִי
  choice: இரையில்லாமல்
  rationale: இந்த முன்னிடைச்சொல் தொடர் இல்லாமை அல்லது பற்றாக்குறையைச் சுட்டுகிறது. தமிழில் ‘இரையில்லாமல்’ என்பது காரணத்தையும் பற்றாக்குறையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: טָרֶף
  choice: இரை
  rationale: இது பொதுவான உணவை அல்ல, வேட்டையாடும் விலங்கு பிடித்துத் தின்னும் இரையைக் குறிக்கிறது; ஆகவே சிங்க உருவகத்திற்கு ‘இரை’ துல்லியமாகப் பொருந்துகிறது.
- source_word: בְנֵי
  choice: குட்டிகள்
  rationale: சொல்லுக்கு நேரடியாக ‘மகன்கள்’ என்று பொருள் இருந்தாலும், விலங்குகளைக் குறிக்கும் இச்சூழலில் ‘குட்டிகள்’ என்பதே இயல்பான தமிழாக்கம்.
- source_word: לָבִיא
  choice: பெண் சிங்கத்தின்
  rationale: לָבִיא என்பது சிங்கத்தையோ பெண் சிங்கத்தையோ குறிக்கலாம். ‘குட்டிகள்’ என்ற இணைப்பில் தாய்ச் சிங்கத்தைப் பற்றிய உருவகம் இயல்பாக இருப்பதால் ‘பெண் சிங்கம்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் பாலினத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִתְפָּרָדוּ
  choice: சிதறிப்போகின்றன
  rationale: இந்த வினை பிரிதல் அல்லது பல திசைகளில் சிதறுதல் என்பதைக் குறிக்கிறது. குடும்பம் அல்லது கூட்டம் கலைந்துபோகும் விளைவை ‘சிதறிப்போகின்றன’ இயல்பாக எடுத்துரைக்கிறது.
