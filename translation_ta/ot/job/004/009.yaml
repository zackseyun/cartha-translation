  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: ta
  text: கடவுளின் மூச்சினால் அவர்கள் அழிந்துபோகிறார்கள்[a][c]; அவருடைய கோபத்தின் மூச்சினால்[b] அவர்கள் முடிவுக்கு வருகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் மூச்சிலிருந்து அவர்கள் அழிந்துபோகிறார்கள்.” எபிரெய முன்னொட்டு மூலத்தையோ செயல்படுத்தும் கருவியையோ குறிக்கலாம்; இங்கு அது “மூச்சினால்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மூச்சு” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் “காற்று,” “மூச்சு,” அல்லது “ஆவி” என்றும் பொருள்படலாம். இச்சூழலில் அது அவருடைய கோபத்தோடு தொடர்புடைய அழிக்கும் ஆற்றலுள்ள வெளிப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர்கள் முற்றிலும் அழிக்கப்படுகிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: மூச்சினால்
  rationale: נשמה என்பது ‘மூச்சு’ அல்லது உயிர்மூச்சைக் குறிக்கிறது. முன் ஒட்டிய מִן இங்கு காரணம் அல்லது கருவியைக் குறிக்கக்கூடும்; இயல்பான தமிழில் ‘மூச்சினால்’ அந்தக் கவித்துவப் படிமத்தையும் கருவிப்பொருளையும் காக்கிறது.
- source_word: אֱלוֹהַ
  choice: கடவுள்
  rationale: இது யோபு நூலில் அடிக்கடி வரும் ‘கடவுள்’ என்பதற்கான ஒருமைக் கவிதை வடிவம். மூலத்தில் இல்லாத ‘சர்வவல்லவர்’ போன்ற விரிவாக்கத்தைச் சேர்க்காமல் எளிய இணைச்சொல் பயன்படுத்தப்படுகிறது.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோகிறார்கள்
  rationale: אבד என்பதன் அடிப்படைப் பொருள் அழிதல் அல்லது நாசமடைதல். செயப்படுபொருள் வடிவத்தைத் திணிக்காமல், எபிரெய வினையின் இயல்பான அகநிலைப் பொருளை இது தருகிறது.
- source_word: וּמֵרוּחַ
  choice: மூச்சினால்
  rationale: רוּחַ என்பதற்கு காற்று, மூச்சு, ஆவி ஆகிய பொருள்கள் உண்டு. ‘அவருடைய கோபம்’ என்பதோடு வருவதாலும் முதல் அடியின் மூச்சுப் படிமத்துடன் இணைவதாலும், இங்கு வலிமையாக வெளிப்படும் மூச்சு என்ற கருத்து பொருத்தமானது; தமிழில் ‘கோபத்தின் மூச்சு’ கவித்துவமாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַפּוֹ
  choice: அவருடைய கோபத்தின்
  rationale: אַף என்பதன் நேர்பொருள் மூக்கு அல்லது மூக்குத்துளை; நீட்டிக்கப்பட்ட வழக்குப் பொருள் கோபம். இச்சொற்றொடரில் ‘கோபம்’ பொருளைத் தெளிவாகத் தருகிறது; மூச்சுப் படிமம் அடுத்த சொல்லில் தக்கவைக்கப்படுகிறது.
- source_word: יִכְלוּ
  choice: அவர்கள் முடிவுக்கு வருகிறார்கள்
  rationale: כלה என்ற வினை முடிவடைதல், தீர்ந்துபோதல் அல்லது முற்றிலும் அழிக்கப்படுதல் எனப் பொருள்படலாம். ‘முடிவுக்கு வருகிறார்கள்’ அதன் விளைவுநிலையைத் தருவதோடு, ‘அழிந்துபோகிறார்கள்’ என்ற இணை அடியிலிருந்து சொல் வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: கடவுளுடைய கோபத்தை மனித உடல் உறுப்புப் படிமத்தின் வழியாகக் கூறுதல்
  choice: אַפּוֹ என்பதை ‘அவருடைய கோபம்’ என்று பொருள்வழியாக மொழிபெயர்த்து, மூச்சுப் படிமத்தை அடுத்த சொல்லில் காத்தல்
  alternative: ‘அவருடைய மூக்குத்துளைகளின் மூச்சு’ அல்லது ‘அவருடைய சினத்தின் மூச்சு’
  rationale: எபிரெயத்தில் ‘மூக்கு’ என்பது கோபத்தைக் குறிக்கும் வழக்குச்சொல். அதைச் சொற்சொல்லாகத் தமிழாக்குவது பொருளை மறைக்கலாம். ‘கோபம்’ என்பது கருத்தைத் தெளிவாக்குகிறது; அதேவேளை தெய்வீகச் செயலைப் பற்றிய கவித்துவமான மூச்சுப் படிமம் நீக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு அரையடிகளின் ஒத்த அமைப்பு காக்கப்பட்டுள்ளது. ‘மூச்சு’ இருமுறை வருவது எபிரெயத்தின் נשמה / רוחַ சொல் வேறுபாட்டை முழுமையாகக் காட்டாவிட்டாலும், இரண்டாம் இடத்தில் ‘காற்று’ அல்லது ‘ஆவி’ என்று இடுவது தமிழில் கருத்தைத் தவறாகத் திருப்பக்கூடும்; அந்தச் சொற்பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
