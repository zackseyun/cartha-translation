source:
  edition: WLC
  text: זְכָר נָ֗א מִ֤י ה֣וּא נָקִ֣י אָבָ֑ד וְ֝/אֵיפֹ֗ה יְשָׁרִ֥ים נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: ta
  text: 'சற்று நினைத்துப் பார்: குற்றமற்றவர்[a] யாராவது அழிந்துபோனதுண்டா? அல்லது, நேர்மையானவர்கள் எங்கே அழித்தொழிக்கப்பட்டார்கள்?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழியற்றவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அடியோடு அழிக்கப்பட்டார்கள்” அல்லது “துடைத்தழிக்கப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר־נָא
  choice: சற்று நினைத்துப் பார்
  rationale: זְכָר என்பது நினைவுகூர அல்லது மனத்தில் ஆராய அழைக்கும் கட்டளை; נָא அதன் தொனியை மென்மையாக்குகிறது. நவீனத் தமிழில் இவ்விரண்டின் உரையாடல் வலிமையையும் இயல்பாகத் தருகிறது.
- source_word: מִי הוּא
  choice: யாராவது
  rationale: வினாச்சொல்லோடு வரும் வலியுறுத்தலை, பதில் ‘யாருமில்லை’ என எதிர்பார்க்கும் தமிழின் இயல்பான சொல்லமைப்பில் வெளிப்படுத்துகிறது.
- source_word: נָקִי
  choice: குற்றமற்றவர்
  rationale: குற்றத்திலிருந்து விடுபட்டவர் அல்லது குற்றமில்லாதவர் என்ற அடிப்படைப் பொருளைத் தெளிவாகத் தருகிறது; மாற்றுப் பொருளுக்குக் குறிப்பும் தரப்பட்டுள்ளது.
- source_word: אָבָד
  choice: அழிந்துபோனதுண்டா
  rationale: אבד என்பதன் அழிவு அல்லது மடிதல் என்ற கருத்தையும், எலிப்பாசின் அனுபவத்தைச் சுட்டும் சொல்லாட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֵיפֹה
  choice: எங்கே
  rationale: இணையான இரண்டாவது வினாவைத் தமிழில் சீராக அறிமுகப்படுத்துகிறது; ‘அல்லது’ என்பதை வெளிப்படையாகச் சேர்க்காமலேயே இணைநிலை தெளிவாக உள்ளது.
- source_word: יְשָׁרִים
  choice: நேர்மையானவர்கள்
  rationale: ஒழுக்க ரீதியாகச் செம்மையாக அல்லது நேராக நடப்பவர்களைக் குறிக்கும் பெயரடைப் பன்மையை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: נִכְחָדוּ
  choice: அழித்தொழிக்கப்பட்டார்கள்
  rationale: כחד என்பதன் மறைக்கப்படுதல், அகற்றப்படுதல், முற்றிலும் அழிக்கப்படுதல் ஆகிய பொருள் வரம்பில், இங்கு אָבָד உடன் அமைந்த இணைப்புக்கு ஏற்ற அழிவுப் பொருளையும் செயல்பாட்டின் விளைவையும் தருகிறது.
theological_decisions:
- issue: குற்றமற்றவர்களும் நேர்மையானவர்களும் அடையும் முடிவைப் பற்றிய எலிப்பாசின் வாதம்
  choice: எலிப்பாசின் கூற்றை நேரடியான எதிர்வினாக்களாக மொழிபெயர்த்தல்
  alternative: யோபு நூலின் மொத்த வாதத்தின் அடிப்படையில், இக்கூற்று சந்தேகத்திற்குரியது என்பதை மொழிபெயர்ப்பிலேயே உணர்த்துதல்
  rationale: இவ்வசனம் எலிப்பாசின் இறையியல் வாதத்தை அவன் கூறுகிறபடியே முன்வைக்கிறது. நூலின் பின்னைய பகுதிகள் ஏற்படுத்தும் பதற்றத்தை இங்கே முன்கூட்டியே தீர்க்கவோ, அவன் கூற்றை மொழிபெயர்ப்பாளரின் உறுதிப்பாடாக மாற்றவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எலிப்பாசு யோபுவிடம் நேரடியாகப் பேசும் ஒருமை உரையாடல் தொனி காக்கப்பட்டுள்ளது. எதிர்வினாக்களின் கூர்மையும் கண்ணியமான நடையும் பேணப்பட்டுள்ளன.
