source:
  edition: WLC
  text: וְ֭/אֵלַ/י דָּבָ֣ר יְגֻנָּ֑ב וַ/תִּקַּ֥ח אָ֝זְנִ֗/י שֵׁ֣מֶץ מֶֽנְ/הֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: ta
  text: ஒரு சொல் மறைவாக எனக்குக் கொண்டு வரப்பட்டது; அதிலிருந்து ஒரு மெல்லிய ஓசையை[a] என் காது கேட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிலிருந்து ஒரு சிறு குறிப்பை என் காது பெற்றது,” அல்லது “அதிலிருந்து மிக மெல்லிய கிசுகிசுப்பை என் காது கேட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: எனக்கு
  rationale: இது ‘என்னிடம்/எனக்கு’ என்ற திசை அல்லது பெறுநர் பொருளை வெளிப்படுத்துகிறது. וְ என்ற இணைப்பின் தொடர்ச்சிப் பொருள் தமிழில் வாக்கிய ஓட்டத்தால் இயல்பாகத் தெரிகிறது; மூலத்தில் இல்லாத காலச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: דָּבָר
  choice: ஒரு சொல்
  rationale: வெளிப்பாட்டுச் சூழலில் ‘செய்தி’ என்பதும் சாத்தியம்; ஆனால் ‘சொல்’ என்பது எபிரெயச் சொல்லின் சுருக்கமான, மர்மமான தன்மையை மிகையாக விளக்காமல் காக்கிறது.
- source_word: יְגֻנָּב
  choice: மறைவாக வந்து சேர்ந்தது
  rationale: גנב (‘திருடு’) என்பதன் செயல்பாட்டு உருவகம் இங்கு ஒரு சொல் இரகசியமாக அல்லது ஓசையின்றி வந்ததைச் சுட்டுகிறது. ‘திருடப்பட்டது’ என்ற சொற்சொல் மொழிபெயர்ப்பு தவறான பொருளைத் தரக்கூடும்.
- source_word: וַתִּקַּח
  choice: பற்றிக்கொண்டது
  rationale: சொற்சொல்லாக ‘எடுத்தது’; ‘என் காது’ எழுவாயாக இருப்பதால், கேட்டுணரும் செயலைத் தெளிவாகவும் மூலத்தின் உயிருள்ள உருவகத்தைப் பேணியும் ‘பற்றிக்கொண்டது’ என வழங்கப்பட்டுள்ளது.
- source_word: אָזְנִי
  choice: என் காது
  rationale: மூலத்தின் ஒருமை வடிவத்தையும் உடலுறுப்பு சார்ந்த தெளிவான உருவகத்தையும் அப்படியே காக்கிறது.
- source_word: שֵׁמֶץ
  choice: ஒரு மெல்லிய ஒலி
  rationale: இந்தச் சொல் சிறு பகுதி, சுவடு, குறிப்பு அல்லது மிக மெல்லிய ஒலி எனப் பொருள்படலாம். செவியால் பெறும் இச்சூழலில் ‘மெல்லிய ஒலி’ இயல்பானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: מֶנְהוּ
  choice: அதிலிருந்து
  rationale: முன்னுள்ள ஆண்பால் பெயர்ச்சொல்லான ‘சொல்’ என்பதைக் குறிக்கும் ‘அதிலிருந்து’ என்ற அடிப்படை உறவைத் தக்கவைக்கிறது.
