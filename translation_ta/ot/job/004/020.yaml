  terminology: '"நொறுக்கப்படுகிறார்கள்" யֻכַּתּוּ-வின் வலிமையான செயப்பாட்டுப் பொருளைத் தக்கவைக்கிறது. "அழிந்துபோகிறார்கள்" אָבַד-இன் பரந்த பொருளை அநாவசியமான இறையியல் குறிப்பாக்கமின்றித் தெரிவிக்கிறது. அடிக்குறிப்பு மூலத்தின் சுருக்கமான மரபுத்தொடருக்கான பொருத்தமான மாற்றுவழியை வழங்குகிறது.'
