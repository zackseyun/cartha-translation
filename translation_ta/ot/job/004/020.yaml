  text: מִ/בֹּ֣קֶר לָ/עֶ֣רֶב יֻכַּ֑תּוּ מִ/בְּלִ֥י מֵ֝שִׂ֗ים לָ/נֶ֥צַח יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: ta
  text: 'காலையிலிருந்து மாலைவரை அவர்கள் நொறுக்கப்படுகிறார்கள்;

    யாரும் கவனிக்காமலேயே[a] என்றென்றும் அழிந்துபோகிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் மனத்தில் கொள்ளாமலேயே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: காலையிலிருந்து மாலைவரை
  rationale: ஒரே நாளின் குறுகிய காலப்பரப்பைச் சுட்டி, மனித வாழ்வின் நிலையாமையை வலியுறுத்தும் எபிரெய கால உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יֻכַּתּוּ
  choice: நொறுக்கப்படுகிறார்கள்
  rationale: ஹொஃபால் வினைவடிவின் செயப்பாட்டு உணர்வையும், அடித்து உடைக்கப்படுதல் அல்லது நசுக்கப்படுதல் என்ற வலிமையான படிமத்தையும் காக்கிறது; எவ்வாறு நிகழ்கிறது என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: מִבְּלִי מֵשִׂים
  choice: யாரும் கவனிக்காமலேயே
  rationale: சொல்லுக்குச் சொல் வகையில் ‘வைக்காமல்’ என வரும் இந்தச் சுருக்கப்பட்ட மரபுத்தொடர், மனத்தில் வைத்துக்கொள்ளுதல் அல்லது கவனம் செலுத்துதல் என்ற பொருளைத் தருகிறது. தேர்ந்தெடுத்த தமிழ் வடிவம் அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: அழிவின் மீளாத இறுதித்தன்மையை வெளிப்படுத்தும் நீடித்த காலப் பொருளைக் காக்கிறது; அதற்கு மேலான இறுதிக்காலத் தண்டனைப் பொருளை மொழிபெயர்ப்பே சேர்ப்பதில்லை.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோகிறார்கள்
  rationale: אָבַד என்பதன் பரந்த ‘அழிதல், இல்லாமற்போதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
theological_decisions:
- issue: எலிப்பாசின் உரையில் மனித இறப்பின் இறுதித்தன்மை
  choice: இந்த வசனம் கவனிக்கப்படாத மனித அழிவையும், மனித வாழ்வின் குறுகிய நிலையாமையையும் கூறுவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘என்றென்றும்’ என்பதை இறுதிக்கால நித்தியத் தண்டனையை நேரடியாகக் குறிக்கும் கூற்றாக வாசித்தல்.
  rationale: சூழலில் எலிப்பாசு தேவனுக்கு முன்பாக மனிதர்கள் எவ்வளவு எளிதில் அழியக்கூடியவர்கள் என்பதைப் பேசுகிறான். ‘என்றென்றும் அழிந்துபோகிறார்கள்’ என்பது மரணத்தின் மீளாத தன்மையை வலியுறுத்துகிறது; வளர்ச்சியடைந்த இறுதிக்காலத் தீர்ப்புக் கோட்பாட்டை வெளிப்படையாக விவரிப்பதில்லை. ஆகவே இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மூலத்தின் சொல்லாட்சி காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. முதல் அடியின் கால உருவகமும், இரண்டாம் அடியின் கவனிக்கப்படாத அழிவும் சுருக்கமாக அமைக்கப்பட்டுள்ளன; [a] குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
