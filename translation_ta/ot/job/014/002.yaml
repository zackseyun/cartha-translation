  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: ta
  text: பூவைப்போல் அவன் தோன்றி வாடிப்போகிறான்[a]; நிழலைப்போல் ஓடிப்போகிறான், நிலைத்திருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறுக்கப்படுகிறான்’; எபிரெய வினைச்சொல் வாடுதல்/பொலிவிழத்தல் என்றும், குறிப்பாகப் பூவின் உவமையில் அறுக்கப்படுதல் என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: பூவைப்போல்
  rationale: צִיץ என்பது பூ அல்லது மலரைக் குறிக்கிறது; மனித வாழ்வின் நிலையாமையை எடுத்துக்காட்டும் உவமை தமிழில் இயல்பாக அமைகிறது.
- source_word: יָצָא
  choice: தோன்றி
  rationale: יָצָא என்பதன் அடிப்படைப் பொருள் ‘வெளியே வருதல்’. பிறந்து சிறிது காலம் காணப்படும் மனித வாழ்வைக் குறிக்கும் இக்கவிதைச் சூழலில் ‘தோன்றி’ என்பது இயல்பாகவும் சுருக்கமாகவும் அந்தக் காட்சியைத் தருகிறது.
- source_word: וַיִּמָּל
  choice: வாடிப்போகிறான்
  rationale: மலரின் உவமையில் இவ்வினைச்சொல் வாடுதல் அல்லது பொலிவிழத்தல் என்ற பொருளை இயல்பாகத் தருகிறது. ‘அறுக்கப்படுகிறான்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּבְרַח
  choice: ஓடிப்போகிறான்
  rationale: ברח என்பதன் உயிரோட்டமுள்ள ‘தப்பி ஓடுதல்/ஓடிப்போதல்’ என்ற படிமத்தைப் பாதுகாக்கிறது; வெறுமனே ‘கடந்துபோகிறான்’ என்று மென்மையாக்கவில்லை.
- source_word: כַּצֵּל
  choice: நிழலைப்போல்
  rationale: நிலையாமையையும் விரைவில் கடந்துபோவதையும் உணர்த்தும் நேரடியான உவமை.
- source_word: וְלֹא יַעֲמוֹד
  choice: நிலைத்திருப்பதில்லை
  rationale: עמד என்பதற்கு சொற்பொருளாக ‘நிற்றல்’ என்றாலும், இங்கு அது தொடர்ந்து இருத்தல் அல்லது நீடித்திருத்தலைக் குறிக்கிறது; ‘நிலைத்திருப்பதில்லை’ என்பது நவீன தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
