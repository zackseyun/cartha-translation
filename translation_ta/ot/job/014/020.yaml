  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: ta
  text: நீர் அவன்மேல் என்றென்றும் மேலோங்குகிறீர்; அவன் போய்விடுகிறான்[a]. அவனுடைய முகத்தை[b] மாற்றி, அவனை அனுப்பிவிடுகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் அகன்றுபோகிறான்.’ எபிரெய வினை நேரடியாக ‘போகிறான்’ என்று பொருள்படும்; இங்கு அது வாழ்விலிருந்தோ மனித உலகிலிருந்தோ அவன் நீங்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனுடைய தோற்றத்தை.’ ‘முகம்’ என்பதற்கான எபிரெயச் சொல் ஒருவரின் வெளித்தோற்றத்தையும் முகத்தோற்றத்தையும் விரிந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: நீர் அவனை வென்றுவிடுகிறீர்
  rationale: תקף என்பதன் இவ்வடிவம் ஒருவருக்கு எதிராக வலிமை மேலோங்கி அவரை வெல்வதைக் குறிக்கிறது. கடவுள் நேரடியாக விளிக்கப்படுவதையும் அவரது மேலாதிக்கத்தின் வலிமையையும் இந்தத் தமிழ் நடை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לָנֶצַח
  choice: என்றென்றுமாக
  rationale: נֶצַח நீடித்த காலத்தையோ நிரந்தரத்தையோ குறிக்கிறது; மனிதன் மீதான கடவுளின் வெற்றி திரும்ப மாற்ற முடியாதது என்ற புலம்பலின் வலியுறுத்தலை இது தருகிறது.
- source_word: וַיַּהֲלֹךְ
  choice: அவன் போய்விடுகிறான்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போ’ என்பதாகும். இச்சூழலில் அது மரணத்தையோ மனித வாழ்விடத்திலிருந்து அகல்வதையோ சுட்டலாம்; ஆனால் மூலத்தில் உள்ள மறைபொருள் திறப்பைச் சுருக்காமல் இருக்க நேரடியான ‘போய்விடுகிறான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְשַׁנֶּה
  choice: மாற்றி
  rationale: שנה என்பது ‘மாற்று’ என்று பொருள். அடுத்துள்ள அனுப்புதல் வினையுடன் இயல்பான தமிழில் இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது; இரு செயல்களுக்கும் கடவுளே எழுவாய் என்பது தெளிவாக உள்ளது.
- source_word: פָנָיו
  choice: அவனுடைய முகத்தை
  rationale: פנים என்பதன் நேரடிப் பொருள் ‘முகம்’; அது தோற்றம் அல்லது முகத்தோற்றம் என்ற விரிந்த பொருளையும் கொள்ளலாம். மூலத்தின் திடமான உருவகத்தை முதன்மை உரை பாதுகாக்கிறது.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: அவனை அனுப்பிவிடுகிறீர்
  rationale: שלח என்பதன் தீவிர வடிவம் அனுப்பிவிடுதல், அகற்றுதல் அல்லது வெளியேற்றுதல் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். ‘அனுப்பிவிடுகிறீர்’ தேவையின்றி வன்முறையையோ வெறும் விடுவித்தலையோ சேர்க்காமல் பரந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: וַיַּהֲלֹךְ மரணத்தை வெளிப்படையாகக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘அவன் போய்விடுகிறான்’ என்று மொழிபெயர்த்து மறைபொருளைத் திறந்தவாறே வைத்தல்
  alternative: ‘அவன் இறந்துபோகிறான்’ அல்லது ‘அவன் மரித்துப்போகிறான்’
  rationale: மரணச் சூழல் அந்தப் பொருளை வலுவாகக் குறிப்பிட்டாலும், எபிரெய வினை நேரடியாக ‘போகிறான்’ என்றே கூறுகிறது. ஆகவே மரணத்தை உரைக்குள் வெளிப்படையாகச் சேர்க்காமல் குறிப்பில் விளக்குவது மூலத்தின் கவித்துவ மற்றும் இறையியல் நெருக்கடியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை மரியாதைப் பன்மையால் நேரடியாக விளிக்கும் கவித்துவப் புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. சொற்சொற் துல்லியமும் இயல்பான தமிழும் சமநிலைப்படுத்தப்பட்டுள்ளன; மரணத்தை வெளிப்படையாகச் சொல்லாமல் மூலத்தின் உண்மையான மறைபொருள் பாதுகாக்கப்பட்டுள்ளது. குறிப்பு அடையாளங்கள் அவை விளக்கும் சொற்றொடர்களுக்குப் பிறகு நேரடியாக வைக்கப்பட்டுள்ளன.
