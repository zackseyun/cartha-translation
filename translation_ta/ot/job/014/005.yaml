source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: ta
  text: அவனுடைய நாட்கள் நிர்ணயிக்கப்பட்டிருப்பதால்[a], அவனுடைய மாதங்களின் எண்ணிக்கை உம்மிடத்தில் உள்ளது; அவனுக்கான எல்லையை நீர் வகுத்திருக்கிறீர்[b]; அதை அவனால் கடக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய நாட்கள் நிர்ணயிக்கப்பட்டிருந்தால்.” எபிரெயச் சொல் ஒரு நிபந்தனையை அறிமுகப்படுத்தக்கூடும்; ஆனால் இச்சூழலில் அது யோபுவின் வேண்டுகோளுக்கான அடிப்படையை, “நிர்ணயிக்கப்பட்டிருப்பதால்” என்று தருவது அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “எல்லை” என்பதற்குப் பதிலாக “வரம்பு” அல்லது “விதிக்கப்பட்ட அளவு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நிலையாக வகுக்கப்பட்ட ஓர் எல்லையையோ விதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: நிர்ணயிக்கப்பட்டிருப்பதால்
  rationale: אִם பொதுவாக நிபந்தனையை அறிமுகப்படுத்தினாலும், இச்சூழலில் யோபுவின் அடுத்த வேண்டுகோளுக்கான அடிப்படையைச் சுட்டுகிறது. ஆகவே காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தியது; நிபந்தனை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: חֲרוּצִים
  choice: நிர்ணயிக்கப்பட்டிருக்கின்றன
  rationale: இந்தச் செயல்பாட்டு பெயரெச்சம் மனிதனுடைய நாட்கள் முடிவு செய்யப்பட்டு நிலைநிறுத்தப்பட்டுள்ளன என்பதைக் குறிக்கிறது; ‘நிர்ணயிக்கப்பட்ட’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: יָמָיו
  choice: அவனுடைய நாட்கள்
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள பன்மைச் சொல்லை நேரடியாக மொழிபெயர்த்து, மனிதனுடைய வாழ்நாட்களைக் குறிக்கிறது.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: அவனுடைய மாதங்களின் எண்ணிக்கை
  rationale: எபிரெயச் சொல்லிணையின் பெயர்ச்சொல் அமைப்பையும், வாழ்நாளின் கணக்கிடப்பட்ட காலத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: אִתָּךְ
  choice: உம்மிடத்தில் உள்ளது
  rationale: சொல்லடிப்படையில் ‘உம்முடன்/உம்மிடத்தில்’ என்பதாகும். எண்ணிக்கை கடவுளின் அறிவிலும் ஆளுகையிலும் இருப்பதை மிகையாக விளக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: חֻקּוֹ
  choice: அவனுக்கான எல்லை
  rationale: இங்கு இந்தச் சொல் மனித வாழ்வுக்கு விதிக்கப்பட்ட நிலையான வரம்பைக் குறிக்கிறது. தொடர்ந்து வரும் ‘கடக்க’ என்ற வினையுடன் ‘எல்லை’ இயல்பாகப் பொருந்துகிறது.
- source_word: עָשִׂיתָ
  choice: நீர் வகுத்திருக்கிறீர்
  rationale: அடிப்படைப் பொருள் ‘செய்தீர்’ என்றாலும், எல்லை அல்லது வரையறையுடன் வரும் இச்சூழலில் அதை நிறுவுதல் அல்லது வகுத்தல் என்பதே பொருத்தமானது.
- source_word: וְלֹא יַעֲבוֹר
  choice: அதை அவனால் கடக்க முடியாது
  rationale: ஒருமை வினை மனிதனையே எழுவாயாகக் கொண்டுள்ளது. கடவுள் வகுத்த வாழ்நாள் எல்லைக்கு அப்பால் செல்ல இயலாமையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனித வாழ்நாளைக் கடவுள் நிர்ணயித்தல்
  choice: மனிதனுடைய நாட்கள் நிர்ணயிக்கப்பட்டவை; அவனுடைய மாதங்களின் எண்ணிக்கை கடவுளிடத்தில் உள்ளது; அவன் கடக்க முடியாத எல்லையைக் கடவுள் வகுத்துள்ளார்.
  alternative: இவ்வசனம் கடவுளின் செயற்பட்ட நிர்ணயத்தைவிட, மனித வாழ்நாளைப் பற்றிய அவரது அறிவை மட்டுமே வலியுறுத்துகிறது என்று மென்மையாக வாசிக்கலாம்.
  rationale: ‘நிர்ணயிக்கப்பட்ட’, ‘உம்மிடத்தில்’, ‘நீர் வகுத்திருக்கிறீர்’ ஆகிய கூறுகள் கடவுளின் அறிவையும் ஆளுகையையும் வலுவாகக் காட்டுகின்றன. இதிலிருந்து ஒரு விரிவான கோட்பாட்டு அமைப்பை உருவாக்காமல், வசனத்தின் பதற்றமும் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக விளிக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மிடத்தில்’, ‘நீர்’, ‘வகுத்திருக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் இணை அமைப்பும் அரைப்புள்ளிகளால் பாதுகாக்கப்பட்டுள்ளது.
