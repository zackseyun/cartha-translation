  to: அவனை விட்டு உமது பார்வையைத் திருப்பும்; ஒரு கூலித் தொழிலாளியைப்போல அவன் தன் நாளை நிறைவுசெய்யும்வரை, அவன் ஓய்வெடுக்கட்டும்.[a]
