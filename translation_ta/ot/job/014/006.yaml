source:
  edition: WLC
  text: שְׁעֵ֣ה מֵ/עָלָ֣י/ו וְ/יֶחְדָּ֑ל עַד יִ֝רְצֶ֗ה כְּ/שָׂכִ֥יר יוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: ta
  text: அவனை விட்டு உமது பார்வையைத் திருப்பும்; ஒரு கூலித் தொழிலாளியைப்போல அவன் தன் நாளை நிறைவுசெய்யும்வரை, அவன் ஓய்வெடுக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை விட்டு உமது பார்வையைத் திருப்பும்; அவன் ஒழியட்டும்; ஒரு கூலித் தொழிலாளியைப்போல அவன் தன் நாளில் திருப்தியடையும்வரை.” எபிரெயச் சொற்கள், ஓய்வு அல்லது செயல்நிறுத்தம் என்பதையும், தனக்கு அளிக்கப்பட்ட நாளை முடிப்பதில் அல்லது அனுபவிப்பதில் ஏற்படும் திருப்தி என்பதையும் வலியுறுத்தும் மொழிபெயர்ப்புகளுக்கு இடமளிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה מֵעָלָיו
  choice: அவனைவிட்டு உமது பார்வையைத் திருப்பி
  rationale: שׁעה என்பதன் கட்டளை வடிவம் இங்கு பார்வையை அல்லது கவனத்தை விலக்குவதைக் குறிக்கிறது. தேவனை நோக்கிப் பேசும் சூழலைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘உமது பார்வையை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְיֶחְדָּל
  choice: அவன் ஓய்வுபெற விடும்
  rationale: חדל என்பதன் அடிப்படைப் பொருள் ‘நிறுத்து/ஒழி’ என்பதாக இருந்தாலும், இச்சூழலில் கடுமையான கண்காணிப்பிலிருந்து கிடைக்கும் இடைவெளியையும் ஓய்வையும் குறிக்கிறது. ‘ஓய்வுபெற விடும்’ என்பது அந்தச் சூழற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַד
  choice: வரை
  rationale: கோரப்படும் ஓய்வுக்கான கால எல்லையை அறிமுகப்படுத்தும் வழக்கமான காலக் குறியீடு.
- source_word: יִרְצֶה
  choice: நிறைவுசெய்யும்
  rationale: רצה என்பது விரும்புதல், மகிழ்தல், திருப்தியடைதல் அல்லது ஏற்றுக்கொள்ளுதல் ஆகிய பொருள்களை ஏற்கக்கூடும். கூலியாளின் நாளுடன் இணைந்துள்ள இச்சொற்றொடரில், ஒதுக்கப்பட்ட நாளை முடிவுக்குக் கொண்டுவருதல் என்ற கருத்தை ‘நிறைவுசெய்யும்’ வெளிப்படுத்துகிறது; எனினும் மூலத்தின் பொருள் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּשָׂכִיר
  choice: ஒரு கூலியாளைப்போல
  rationale: שָׂכִיר என்பது கூலிக்குப் பணிபுரியும் தொழிலாளரைக் குறிக்கிறது. ‘கூலியாள்’ நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: יוֹמוֹ
  choice: தனக்குரிய நாளை
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘அவனுடைய நாள்.’ கூலியாளின் உருவகம் வேலைக்கென ஒதுக்கப்பட்ட நாளை உணர்த்துவதால், ‘தனக்குரிய நாள்’ என்பது அந்த அளிக்கப்பட்ட காலத்தை இயல்பாக வெளிப்படுத்துகிறது.
