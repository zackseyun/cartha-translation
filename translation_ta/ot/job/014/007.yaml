  register: நவீன பொதுத்தமிழில், கவித்துவமான கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நிபந்தனை அமைப்பு, பொதுவகை ஒருமை, மரத்தின் மறுவளர்ச்சி உருவகம் ஆகியவை காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு குறிகள் அவை விளக்கும் எபிரெயச் சொற்களோடு பொருந்துமாறு தமிழில் வைக்கப்பட்டுள்ளன.
