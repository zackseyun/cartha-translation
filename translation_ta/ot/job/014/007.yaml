base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: ta
  text: 'ஏனெனில், ஒரு மரத்துக்கு நம்பிக்கை உண்டு: அது வெட்டப்பட்டால், மீண்டும் துளிர்க்கும்[a]; அதன் புதுத்தளிர்[b] தோன்றுவது ஓயாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னைப் புதுப்பித்துக்கொள்ளும்.’ எபிரெய வினை புதுப்பித்தல் அல்லது புதிதாக வளர்தல் என்ற பொருளைக் கொண்டிருக்கலாம்; மரத்தைப் பற்றிய இச்சூழலில் அது ‘துளிர்க்கும்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் மென்மையான தளிர்’ அல்லது ‘அதன் முளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: ஒரு மரத்துக்கு நம்பிக்கை உண்டு
  rationale: எபிரெயச் சொற்றொடரின் இருப்புப் பொருளையும், மரத்தைப் பொதுவகையில் குறிப்பிடும் ஒருமையையும் காக்கிறது.
- source_word: אִם יִכָּרֵת
  choice: அது வெட்டப்பட்டால்
  rationale: אִם என்பதன் நிபந்தனைப் பொருளைத் தீர்மானமாக ‘வெட்டப்பட்டாலும்’ என்று மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது; Niphal வினையின் செயப்பாட்டு வடிவமும் தக்கவைக்கப்படுகிறது.
- source_word: וְעוֹד יַחֲלִיף
  choice: மீண்டும் துளிர்க்கும்
  rationale: יַחֲלִיף என்பதற்கு புதுப்பித்தல் என்ற பரந்த பொருள் இருக்கலாம்; வெட்டப்பட்ட மரத்தின் சூழலில் புதிய வளர்ச்சியைச் சுட்டும் ‘துளிர்க்கும்’ என்பது இயல்பான தாவரவியல் உருவகத்தை அளிக்கிறது. וְעוֹד மீண்டும் நிகழ்வதைத் தெரிவிக்கிறது.
- source_word: וְיֹנַקְתּוֹ
  choice: அதன் கிளைத்தளிர்
  rationale: יֹנֶקֶת என்பது மரத்திலிருந்து புதிதாக எழும் மென்மையான கிளை அல்லது தளிரைக் குறிக்கிறது; ‘கிளைத்தளிர்’ இந்த உருவகத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לֹא תֶחְדָּל
  choice: ஓயாது
  rationale: தளிர் தோன்றுவதோ வளர்வதோ நின்றுவிடாது என்ற கவித்துவமான தொடர்ச்சியைச் செறிவாகக் காக்கிறது.
