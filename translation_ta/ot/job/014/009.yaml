translation:
  language: ta
  text: தண்ணீரின் மணத்தாலே அது துளிர்த்து, நடப்பட்ட செடியைப்போல் புதிய வளர்ச்சியை உண்டாக்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நடப்பட்ட ஒரு செடியைப்போல் தளிர்களை விடும்.” “புதிய வளர்ச்சி” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் வழக்கமாக “அறுவடை” என்று பொருள்படும்; இங்கு அது தளிர்கள் அல்லது பொதுவாகப் புதிய வளர்ச்சியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: மணம் பட்டாலே
  rationale: רֵיחַ என்பது நேரடியாக ‘மணம்/வாசனை’ என்பதைக் குறிக்கிறது. முன்னொட்டு מִן உடன், தண்ணீரின் அருகாமை உணரப்பட்டவுடனேயே மரம் உயிர்ப்பதை இச்சொற்றொடர் கவித்துவமாகக் காட்டுகிறது.
- source_word: מַיִם
  choice: தண்ணீரின்
  rationale: מַיִם வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு பொருள்பெயராக ஒருமை உணர்வில் வருகிறது; நவீனத் தமிழில் ‘தண்ணீர்’ இயல்பானது.
- source_word: יַפְרִחַ
  choice: துளிர்த்து
  rationale: פרח என்பதன் ஹிஃபில் வடிவம் துளிர்த்தல், முளைத்தல் அல்லது மலர்தல் ஆகியவற்றைக் குறிக்கலாம். வெட்டப்பட்ட மரம் மீண்டும் உயிர்பெறும் சூழலில் ‘துளிர்த்து’ மிகப் பொருத்தமானது.
- source_word: וְעָשָׂה קָצִיר
  choice: கிளைகளை விடும்
  rationale: עָשָׂה என்பது பொதுவாக ‘செய்/உண்டாக்கு’; கָצִיר வழக்கமாக ‘அறுவடை’ என்றாலும் இக்கவிதைச் சூழலில் மரம் வெளிப்படுத்தும் புதிய கிளைகள் அல்லது தளிர்வளர்ச்சியைக் குறிக்கலாம். இயல்பான தமிழுக்காக இரண்டும் ஒரே சொற்றொடராக மொழிபெயர்க்கப்பட்டன; தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּמוֹ נָטַע
  choice: நடப்பட்ட ஒரு செடியைப்போல்
  rationale: כְּמוֹ ஒப்புமையைக் குறிக்கிறது; נָטַע இங்கு ‘நடப்பட்ட ஒன்று/செடி’ என்னும் பெயர்ச்சொல் உணர்வில் உள்ளது. ‘மரம்’ என்பதைத் தேவையின்றிச் சேர்க்காமல் தாவர உருவகத்தைப் பாதுகாக்கிறது.
