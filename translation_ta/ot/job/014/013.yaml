base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: ta
  text: நீர் என்னை ஷியோலில்[a] மறைத்துவைத்து, உமது கோபம் விலகும்வரை என்னை ஒளித்துவைத்து, எனக்காக ஒரு காலவரம்பை நிர்ணயித்து[b], என்னை நினைவுகூர்ந்தால் எவ்வளவு நன்றாயிருக்கும்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறையில்’ அல்லது ‘இறந்தோரின் உலகத்தில்.’ எபிரெயத்தில் ‘ஷியோல்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எனக்காக ஒரு காலத்தைக் குறித்துவைத்து.’ எபிரெயப் பெயர்ச்சொல் நிர்ணயிக்கப்பட்ட, விதிக்கப்பட்ட, அல்லது எல்லையிடப்பட்ட ஒன்றைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: எவ்வளவு நன்றாயிருக்கும்
  rationale: இது சொல்லர்த்தமான கேள்வி அல்ல; தீவிரமான விருப்பத்தையும் ஏக்கத்தையும் வெளிப்படுத்தும் எபிரெய மொழிமரபு. தமிழில் நிபந்தனை வினையுடன் இணைந்த இந்தச் சொற்றொடர் அதன் விருப்பப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּשְׁאוֹל
  choice: ஷியோலில்
  rationale: שְׁאוֹל என்பது வெறும் கல்லறையை மட்டும் குறிக்காமல், இறந்தோரின் இருப்பிடத்தைக் குறிக்கும் எபிரெயக் கருத்தாகும். ஒலிபெயர்ப்பு அதன் பரந்த பொருளையும் இறையியல் தெளிவின்மையையும் காக்கிறது.
- source_word: תַּצְפִּנֵנִי
  choice: என்னை மறைத்துவைத்து
  rationale: வினைச்சொல் மறைத்தல் அல்லது பாதுகாப்பாக வைத்தல் என்ற பொருளுடையது. ‘மறைத்துவைத்து’ என்பது இரு நுணுக்கங்களையும் தமிழில் சுருக்கமாகக் கொண்டுவருகிறது.
- source_word: תַּסְתִּירֵנִי
  choice: என்னை ஒளித்துவைத்து
  rationale: முந்தைய வினையுடன் உள்ள கவிதை இணைநிலையைப் பேணுவதோடு, ஒரே தமிழ்ச் சொல்லை அப்படியே மீண்டும் பயன்படுத்தாமல் அதன் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: உமது கோபம் விலகும்வரை
  rationale: சொற்றொடர் கோபம் திரும்புவதை அல்லது பின்வாங்குவதைச் சித்தரிக்கிறது. ‘விலகும்வரை’ என்பது கோபம் மீண்டும் வரும்வரை என்ற தவறான புரிதலைத் தவிர்த்து, இச்சூழலில் அதன் இயக்கப் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: תָּשִׁית לִי חֹק
  choice: எனக்காக ஒரு காலவரம்பை நிர்ணயித்து
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்டது, விதிக்கப்பட்டது, அல்லது எல்லையிடப்பட்டது என்பதைக் குறிக்கலாம். இங்கு காத்திருப்பதற்கான நிர்ணயிக்கப்பட்ட காலக்கெடு பொருத்தமானது; ‘காலவரம்பு’ என்பது காலத்தையும் வரம்பையும் அளவுக்கு மீறித் தீர்மானிக்காமல் இணைக்கிறது.
- source_word: וְתִזְכְּרֵנִי
  choice: என்னை நினைவுகூர்ந்தால்
  rationale: ‘நினைவுகூர்’ என்பது ஒருவரை மீண்டும் கவனத்தில் கொண்டு அவருக்காகச் செயல்படும் உறவுசார் வலிமையையும் சாதாரண நினைவையும் திறந்தவாறு வைத்திருக்கிறது. நிபந்தனை வடிவம் தொடக்க விருப்பச் சொற்றொடரை நிறைவு செய்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: ஒலிபெயர்ப்பு இதை வெறும் புதைகுழையாகச் சுருக்குவதையும், பிற்கால ‘நரகம்’ பற்றிய கருத்தை வசனத்திற்குள் கொண்டுவருவதையும் தவிர்க்கிறது. இவ்வாறு யோபு இறந்தோரின் இடத்தில் மறைக்கப்பட வேண்டும் என்று ஏங்குவதிலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: חֹק என்பதன் சூழல்சார் பொருள்
  choice: காலவரம்பு
  alternative: குறிக்கப்பட்ட காலம்; விதி; வரம்பு
  rationale: யோபு மறைக்கப்பட்டிருக்கும் நிலைக்கு ஒரு நிர்ணயிக்கப்பட்ட முடிவு இருக்க வேண்டும் என்று வேண்டுவதாகச் சூழல் காட்டுகிறது. ‘காலவரம்பு’ நேரக் குறிப்பையும் எல்லை என்ற அடிப்படை எண்ணத்தையும் சேர்த்துக் காக்கிறது; அது ஒரு சட்டவிதி என்று கட்டாயமாக முடிவுசெய்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவிதைநயமும் கொண்ட எளிய நடையைப் பயன்படுத்துகிறது. ‘நீர்/உமது’ என்ற வடிவங்கள் யோபு கடவுளை நேரடியாக அழைப்பதைத் தெளிவாக வைத்திருக்கின்றன. நீளமான ஒரே விருப்ப வாக்கியம் எபிரெய வசனத்தின் பெருகும் ஏக்கத்தையும் இணைநிலையையும் பேணுகிறது.
