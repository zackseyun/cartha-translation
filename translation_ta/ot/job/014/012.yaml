source:
  edition: WLC
  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: ta
  text: அவ்வாறே, ஒரு மனிதன் படுத்துக்கொள்கிறான்; அவன் எழுவதில்லை.[a] வானங்கள் இல்லாமற்போகும்வரை[b] அவர்கள் விழித்தெழவும் இல்லை; தங்கள் தூக்கத்திலிருந்து எழுப்பப்படவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘படுத்துக்கொள்வது,’ ‘எழுவது’ ஆகியவை மரணத்தையும் அதிலிருந்து எழுவதையும் குறிக்கும் கவிதைப் படிமங்கள்; வசனம் அவற்றை மேலும் கோட்பாட்டுரீதியாக விளக்கவில்லை.
    reason: theological_ambiguity
  - marker: b
    text: ‘வானங்கள் இல்லாமற்போகும்வரை’ என்பது நடைமுறையில் எட்டமுடியாத தொலைவான கால எல்லையைக் குறிக்கும் எபிரெயச் சொல்லாக்கம். ‘வானங்கள் ஒழியும்வரை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: அவ்வாறே, ஒரு மனிதன்
  rationale: אִישׁ என்பது ஒருமை ஆண்பால் வடிவில் ‘மனிதன்’ என்பதைக் குறிக்கிறது; இங்கு மனிதரின் நிலையைக் குறிப்பதற்கான பிரதிநிதித்துவ ஒருமையாக உள்ளது. וְ என்பது முந்தைய ஒப்புமையின் முடிவைத் தொடர்வதால் இயல்பான தமிழில் ‘அவ்வாறே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁכַב
  choice: படுத்துக்கொள்கிறான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்.’ இங்கு அது மரணத்திற்கான உருவகமாக இருந்தாலும், மூலத்தின் தூக்கம் சார்ந்த படிமத்தைப் பாதுகாக்க ‘இறக்கிறான்’ என்று வெளிப்படையாக மாற்றப்படவில்லை.
- source_word: וְלֹא יָקוּם
  choice: மீண்டும் எழுவதில்லை
  rationale: קום என்பது ‘எழுதல்’ என்று பொருள். தமிழில் சூழல் தெளிவாக இருக்க ‘மீண்டும்’ சேர்க்கப்பட்டுள்ளது; இது உயிர்த்தெழுதல் அல்லது மறுபடியும் உயிர்பெறுதல் குறித்த கோட்பாட்டை வெளிப்படையாகத் தீர்மானிக்காமல், எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: வானங்கள் இல்லாமற்போகும்வரை
  rationale: இந்தச் சொற்றொடர் நேரடியாக ‘வானங்கள் இல்லாதவரை’ என்ற அமைப்பைக் கொண்டது; இயல்பான தமிழில் அதன் தொலைவான, நடைமுறையில் எட்டமுடியாத கால எல்லையை ‘வானங்கள் இல்லாமற்போகும்வரை’ என்று வழங்குகிறது.
- source_word: לֹא יָקִיצוּ
  choice: அவர்கள் விழித்தெழுவதுமில்லை
  rationale: יקיץ என்பது ‘விழித்தெழு.’ இங்கு வினை பன்மையில் இருப்பதால், முன் வந்த பிரதிநிதித்துவ ஒருமையிலிருந்து இறந்தவர்களைப் பொதுவாகக் குறிக்கும் பன்மைக்கான மாற்றம் ‘அவர்கள்’ மூலம் பாதுகாக்கப்பட்டது.
- source_word: וְלֹא יֵעֹרוּ
  choice: எழுப்பப்படுவதுமில்லை
  rationale: עור என்பதன் நிஃபால் வடிவம் ‘எழுப்பப்படுதல்’ அல்லது ‘விழிக்கச் செய்யப்படுதல்’ என்ற செயப்பாட்டு நுணுக்கத்தைக் கொண்டது. முதல் வினையுடன் இணையும் கவிதைச் சமநிலையும் இவ்வாறு தக்கவைக்கப்படுகிறது.
- source_word: מִשְּׁנָתָם
  choice: தங்கள் தூக்கத்திலிருந்து
  rationale: שֵׁנָה என்பது ‘தூக்கம்.’ இங்கு மரணத்தைக் குறிக்கும் உருவகத் தொடரை விளக்கமின்றி நேரடியாகப் பாதுகாக்கிறது; பன்மை உடைமைச் சுட்டும் தமிழிலும் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: மரண உருவகத்தை அழிவுக் கோட்பாடாகவோ உயிர்த்தெழுதல் மறுப்பாகவோ வெளிப்படையாக்க வேண்டுமா
  choice: படுத்துக்கொள்ளுதல், எழாமை, தூக்கத்திலிருந்து விழிக்காமை ஆகிய மூலப் படிமங்களை அப்படியே வைத்தல்
  alternative: ‘இறந்து மீண்டும் உயிர்பெறமாட்டான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் யோபின் கவிதைமிகு பார்வையில் மனித மரணத்தைத் தூக்கம் மற்றும் விழித்தெழுதல் சார்ந்த உருவகங்களால் கூறுகிறது. இறுதி உயிர்த்தெழுதல் அல்லது முற்றழிவு பற்றிய அமைப்புசார் கோட்பாடாக இதை மாற்றாமல், மூலத்திலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்பட்டது.
- issue: אִישׁ என்பதன் பாலினமும் பிரதிநிதித்துவப் பயன்பாடும்
  choice: ‘ஒரு மனிதன்’
  alternative: ‘ஒருவர்’ அல்லது ‘ஒரு உயிர்’
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பால் வடிவில் இருந்தாலும் இங்கு மனித மரணத்தைப் பிரதிநிதித்துவமாகக் கூறுகிறது. ‘மனிதன்’ என்பது வடிவையும் பொதுப் பயன்பாட்டையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறும் எபிரெய இலக்கணம்
  choice: முதல் பகுதியில் ‘ஒரு மனிதன்’; அடுத்த பகுதியில் ‘அவர்கள்’
  alternative: வசனம் முழுவதும் ஒருமையாக ‘அவன்’ என்று ஒற்றுமைப்படுத்துதல்
  rationale: மூலத்தில் יָקוּם ஒருமையாகவும் יָקִיצוּ, יֵעֹרוּ பன்மையாகவும் உள்ளன. இந்த மாற்றத்தைச் சீராக்காமல் வைத்ததால் பிரதிநிதித்துவ மனிதனிலிருந்து இறந்தோர் பொதுவாகக் குறிக்கப்படும் நகர்வு தெரிகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கவிதைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘படுத்துக்கொள்கிறான்—எழுவதில்லை—விழித்தெழுவதில்லை—எழுப்பப்படுவதில்லை’ என்ற தொடரின் மூலம் மூலத்தின் தூக்கம்/மரணம் படிமமும் கவிதைச் சமநிலையும் பாதுகாக்கப்பட்டுள்ளன.
