  register: நவீன செந்தமிழ் கலந்த பொதுநடை; கவித்துவ இணைப்புகளும் கடவுளை நோக்கிய மரியாதை ஒருமையும் காக்கப்பட்டுள்ளன. அரிதான சொல்லின் ஐயம் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
