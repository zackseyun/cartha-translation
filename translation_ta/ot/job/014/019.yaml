source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: ta
  text: 'தண்ணீர் கற்களைத் தேய்க்கிறது;

    அதன் பெருக்குகள்[a] பூமியின் மண்ணை அடித்துச் செல்கின்றன;

    அதுபோல, மனிதனின் நம்பிக்கையை நீர் அழிக்கிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெருக்குகள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானதும் பொருள் உறுதியற்றதுமானது. இதற்கு “அதன் பொழிவுகள்,” “அதன் கழுவல்கள்,” அல்லது “அதிலிருந்து முளைப்பவை” போன்ற பொருள்களும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  choice: கற்களை
  rationale: பொதுவான பன்மைப் பெயர்ச்சொல்; நீரால் தேய்க்கப்படும் இயற்கைக் காட்சிக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: שָׁחֲקוּ
  choice: தேய்த்துவிடுகிறது
  rationale: தொடர்ந்த உராய்வினால் தேய்ந்து போகச் செய்தல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: எபிரெயில் வடிவம் பன்மையாக இருந்தாலும், பொதுவான இயற்கை உண்மையைக் கூறும் தமிழில் ஒருமைத் தொகுப்புப்பெயரான ‘தண்ணீர்’ இயல்பானது.
- source_word: תִּשְׁטֹף
  choice: அடித்துச் செல்கின்றன
  rationale: நீரோட்டம் தளர்ந்த மண்ணைக் கழுவி அகற்றும் வலிமையான இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: סְפִיחֶיהָ
  choice: அதன் பெருக்குகள்
  rationale: அரிதானதும் பொருள் உறுதியற்றதுமான சொல்லைச் சூழலுக்கேற்ற நீர்ப்பெருக்கு அல்லது பாய்ந்தோடும் நீர் என்ற பொருளில் வழங்குகிறது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲפַר אָרֶץ
  choice: பூமியின் மண்ணை
  rationale: சொல்லர்த்தத்தில் ‘பூமியின் புழுதி’; அரிப்புச் சூழலில் அடித்துச் செல்லப்படும் மேல்மண்ணை ‘மண்’ இயல்பாகக் குறிக்கிறது.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: மனிதனின் நம்பிக்கையை
  rationale: אֱנוֹשׁ என்பது நிலையற்ற, பலவீனமான மனிதனைச் சுட்டும் பிரதிநிதித்துவ ஒருமை; தமிழ் ஒருமை வடிவம் எண்ணையும் கவித்துவத் தொனியையும் காக்கிறது.
- source_word: הֶאֱבַדְתָּ
  choice: நீர் அழித்துவிடுகிறீர்
  rationale: காரணவினை வடிவத்தின் ‘அழியச் செய்’ என்ற நேரடியான பொருளையும், கடவுளிடம் பேசும் இரண்டாம் நபர் ஒருமை மரியாதை வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: இறுதி கூறில் கடவுளை நேரடியாக விளித்தல்
  choice: அதுபோல, மனிதனின் நம்பிக்கையை நீர் அழித்துவிடுகிறீர்
  alternative: மனிதனின் நம்பிக்கையையும் நீர் அழித்துவிடுகிறீர்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினை கடவுளை நேரடியாகச் சுட்டுகிறது. முன்னுள்ள இயற்கைக் காட்சிகளுக்கும் இறுதி குற்றச்சாட்டுக்கும் இடையிலான ஒப்புமையை ‘அதுபோல’ வெளிப்படுத்துகிறது; யோபுவின் தீவிரமான கூற்றை மென்மைப்படுத்தவில்லை.
- issue: אֱנוֹשׁ என்பதன் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: சாவுக்குரியவன்
  rationale: மூலத்தின் பிரதிநிதித்துவ ஒருமையையும் மனித பலவீனத்தின் தொனியையும் ‘மனிதன்’ இயல்பாகக் காக்கிறது; ‘சாவுக்குரியவன்’ அந்த உட்பொருளை வெளிப்படையாகச் சேர்த்துவிடும்.
