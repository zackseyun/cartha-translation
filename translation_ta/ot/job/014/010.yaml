base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: ta
  text: ஆனால், ஒருவன் இறக்கிறான்; வலுவிழக்கிறான்[a]. மனிதன்[b] உயிர்விடுகிறான்[c]—ஆனால் அவன் எங்கே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலவீனமடைகிறான்’ / ‘வல்லமையற்றுப் போகிறான்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஒருவன்’ என்பதற்கு גבר என்பதும், ‘மனிதன்’ என்பதற்கு אדם என்பதும் பயன்படுத்தப்பட்டுள்ளன. இணைப்பாடலில் வரும் இந்த இரு வேறு சொற்கள் மனிதரின் மரணத்தன்மையை வலியுறுத்துகின்றன.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘இறுதிமூச்சு விடுகிறான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: ஆண்மகன்
  rationale: גבר என்பது பொதுவாக ஆணைக் குறித்தாலும், வலிமை அல்லது வீரியத்தின் நிழற்பொருளையும் கொண்டிருக்கலாம். அடுத்துவரும் אדם என்பதிலிருந்து வேறுபாட்டைப் பேணவும், மரணத்துக்கு முன் மனித வலிமையின் நிலையாமையை உணர்த்தவும் ‘ஆண்மகன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָמוּת
  choice: இறந்து
  rationale: இங்கு வினை பொதுவான மனித நிலையைப் பாடல் நடையில் கூறுகிறது. தொடர்ச்சியான தமிழ் வாக்கியத்தில் ‘இறந்து’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֶּחֱלָשׁ
  choice: வலுவிழக்கிறான்
  rationale: חלש என்பதன் அடிப்படைப் பொருள் பலவீனமாதல் அல்லது வல்லமையற்றுப் போதல். ‘வலுவிழக்கிறான்’ என்பது மூலச்சொல்லுக்கு அருகிலும் நவீனத் தமிழில் இயல்பாகவும் உள்ளது; மரணத்திற்குப் பின் உடல் செயலற்றுக் கிடப்பதையும் சூழலில் உணர்த்துகிறது.
- source_word: וַיִּגְוַע
  choice: உயிர்விடுகிறான்
  rationale: גוע என்பது இறத்தல், உயிர் நீங்குதல் என்ற பொருளுடையது. ‘உயிர்விடுகிறான்’ என்பது முதல் அடியின் ‘இறந்து’ என்பதைக் கச்சிதமாக மீண்டும் சொல்லாமல், இணைப்பாடலின் வேறுபாட்டைப் பேணுகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: אדם இங்கு தனி மனிதனைப் பொதுமனித இயல்பின் பிரதிநிதியாகக் குறிக்கிறது. ‘மனிதன்’ என்பது גבר என்பதற்குத் தேர்ந்தெடுத்த ‘ஆண்மகன்’ என்பதிலிருந்து சொல்லியல் வேறுபாட்டையும் இணைப்பையும் பேணுகிறது.
- source_word: וְאַיּוֹ
  choice: அவன் எங்கே?
  rationale: இறந்த மனிதன் காணாமற்போன நிலையை நேரடிக் கேள்வியாக மூலவாக்கியம் முன்வைக்கிறது. தமிழில் இணைப்பை இடைக்கோடு இயல்பாக ஏந்துவதால் தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: மரணத்திற்குப் பின் மனிதனின் நிலை குறித்த கேள்வி
  choice: ‘அவன் எங்கே?’ என்ற திறந்த கேள்வியாகவே பேணப்பட்டது.
  alternative: ‘அவன் இல்லாமற்போகிறான்’ அல்லது மரணத்திற்குப் பிந்தைய நிலையைத் தீர்மானிக்கும் விளக்க மொழிபெயர்ப்பு.
  rationale: மூல எபிரெய உரை கேள்வியைத் தீர்க்காமல் வைக்கிறது. ஆகவே மனித மரணம் குறித்த பாடலின் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஆண்மகன் / மனிதன்’ என்ற இணைச்சொல் வேறுபாடு எபிரெய இணைப்பாடலை பிரதிபலிக்கிறது. அடிக்குறிப்புக் குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
