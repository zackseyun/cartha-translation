id: JOB.14.14
reference: Job 14:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: ta
  text: ஒரு மனிதன் இறந்தால், அவன் மீண்டும் வாழ்வானா? என் கடினச் சேவைக்காலம் முழுவதும், என் மாற்றம்[a] வரும் வரை நான் காத்திருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் விடுவிப்பு’ அல்லது ‘என் புதுப்பிப்பு.’ எபிரெயச் சொல் ‘மாற்றம்,’ ‘விடுவிப்பு,’ அல்லது ‘புதுப்பிப்பு’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: ஒரு மனிதன் இறந்தால்
  rationale: אִם என்பதன் நிபந்தனைத் தன்மையையும், גֶּבֶר என்பதன் ஒருமை ஆண்பால் குறிப்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הֲיִחְיֶה
  choice: அவன் மீண்டும் உயிர்வாழ்வானா?
  rationale: வினாவைத் தெளிவாகக் காக்கிறது; ‘மீண்டும்’ என்பது வினைச்சொல்லில் தனியே இல்லாவிட்டாலும், மரணத்திற்குப் பின் வாழ்வதைக் கேட்கும் சூழலில் உட்பொருளாக உள்ளது.
- source_word: כָּל יְמֵי צְבָאִי
  choice: என் கடினப் பணிக்காலத்தின் நாட்களெல்லாம்
  rationale: צָבָא என்பதிலுள்ள கடினமான, ஒதுக்கப்பட்ட சேவைக்காலம் என்ற பொருளை வெளிப்படுத்துகிறது; தேவையில்லாமல் நேரடியான போர்ப்படிமத்தைத் திணிக்கவில்லை.
- source_word: אֲיַחֵל
  choice: நான் காத்திருப்பேன்
  rationale: יחל என்பதிலுள்ள நம்பிக்கையோடு காத்திருத்தல் என்ற பொருளில், இச்சூழலில் காத்திருத்தலை முன்னிறுத்துகிறது.
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: என் மாற்றம் வரும் வரை
  rationale: חֲלִיפָה என்பதன் மாற்றம், விடுவிப்பு, புதுப்பிப்பு ஆகிய சாத்தியமான பொருள்களை மிகக் குறைவாக வரையறுக்கும் ‘மாற்றம்’ மூலம் அடிப்படைத் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இவ்வசனம் உயிர்த்தெழுதலைத் தெளிவான கோட்பாட்டு அறிவிப்பாகக் கூறுகிறதா, அல்லது மரணத்திற்குப் பிந்தைய வாழ்வு பற்றிய யோபுவின் திறந்த கேள்வியாக உள்ளதா?
  choice: ‘மீண்டும் உயிர்வாழ்வானா?’ என்ற கேள்வியையும் ‘என் மாற்றம்’ என்ற விரிவான சொல்லையும் பயன்படுத்தி நம்பிக்கையையும் ஐயத்தையும் ஒன்றாகக் காத்தல்.
  alternative: ‘என் உயிர்த்தெழுதல்’ அல்லது ‘என் புதுவாழ்வு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது ‘அவன் உயிர்வாழ்வானா?’ என்று ‘மீண்டும்’ என்பதை விடுத்தல்.
  rationale: எபிரெய உரை உறுதியான கோட்பாட்டு அறிவிப்பை விட வினாவையும் எதிர்பார்ப்பையும் முன்வைக்கிறது. ஆகவே உயிர்த்தெழுதல் சாத்தியத்தை அனுமதித்தாலும் அதைத் தீர்மானமாக உரையில் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் யோபுவின் கண்ணியமான புலம்பல் நடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணிக்காலம்’ என்பது ஒதுக்கப்பட்ட கடின சேவைக்காலத்தைச் சுட்டுகிறது; ‘மாற்றம்’ மூலமொழியின் பலபொருள் தன்மையைப் பாதுகாக்கிறது.
