  terminology: ‘மனிதன்,’ ‘மீண்டும் வாழ்வானா,’ ‘சேவைக்காலம்,’ and ‘மாற்றம்’ are suitable modern-standard Tamil choices. The footnote appropriately retains the lexical alternatives and avoids defining the change as resurrection.
