  yaml_path: translation/ot/job/014/016.yaml
  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: ta
  text: ஏனெனில், இப்போது நீர் என் அடிகளை எண்ணுகிறீர்[a]; என் பாவத்தைக் கண்காணிப்பதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அடிகளை இலக்கமிடுகிறீர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பாவத்தைக் கவனித்துக்கொண்டிருப்பதில்லை”; அல்லது, “என் பாவத்தைக் கண்டுபிடிக்கக் கவனிப்பதில்லை.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலோடு இவ்வாக்கியத்தை விளக்கமளிக்கும் வகையில் இணைக்கும் எபிரெயச் சொல்லின் தொடர்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: யோபு எதிர்நோக்கும் வேறொரு நிலைக்கு மாறாகத் தற்போதைய நிலையைச் சுட்டும் காலவினையடை.
- source_word: צְעָדַי
  choice: என் அடிகளை
  rationale: ஒவ்வொரு காலடியையும் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்; தேவன் யோபுவின் ஒவ்வோர் அசைவையும் எண்ணும் உருவகத்தையும் காக்கிறது.
- source_word: תִּסְפּוֹר
  choice: எண்ணுகிறீர்
  rationale: ספר என்பதன் அடிப்படைப் பொருளான ‘எண்ணுதல்’ என்பதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לֹא
  choice: இல்லை
  rationale: வினையுடன் இணைந்து எபிரெய மறுப்பை இயல்பான தமிழ் நிகழ்கால மறுப்பு வடிவில் வெளிப்படுத்துகிறது.
- source_word: תִשְׁמוֹר עַל
  choice: கண்காணிப்பதில்லை
  rationale: שׁמר עַל என்பதில் உள்ள உன்னிப்பாகக் கவனித்தல் அல்லது காவலாக நோக்குதல் என்ற பரப்பைச் சுருக்கமாகத் தருகிறது; அடிகளை எண்ணுவதுடன் இணையும் கண்காணிப்பு நயத்தையும் தக்கவைக்கிறது.
- source_word: חַטָּאתִי
  choice: என் பாவத்தை
  rationale: இங்கு பலியைக் குறிக்காமல் பாவத்தையே குறிக்கிறது; மூலத்தின் ஒருமை வடிவமும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: לֹא תִשְׁמוֹר עַל חַטָּאתִי என்ற மறுப்பு வாக்கியத்தின் காலமும் பொருளும்
  choice: “என் பாவத்தைக் கண்காணிப்பதில்லை” என்று தற்போதைய நிலையைப் பற்றிய நேரடி கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: “என் பாவத்தைக் கண்காணிக்கமாட்டீர்” அல்லது “என் பாவத்தைக் கண்டுபிடிக்கக் கவனித்துக்கொண்டிருப்பதில்லை” என்று கொள்ளலாம்.
  rationale: எபிரெயத்தில் மறுப்புடன் வரும் எளிய imperfect வடிவம் இவ்வசனத்தைத் தனியாக வாசிக்கையில் தற்போதைய கூற்றாக இயல்பாகப் புரிகிறது. அருகிலுள்ள வசனங்கள் குற்றத்தைப் பதிவு செய்வதைப் பற்றிப் பேசுவதால் தோன்றும் இறையியல் பதற்றத்தை ஒத்திசைத்து அகற்றாமல், மூலத்தின் நேரடியான இலக்கணத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தேவனை நோக்கிய இரண்டாம் நபருக்கு மரியாதை ஒருமையான “நீர்” பயன்படுத்தப்பட்டுள்ளது. கவித்துவ இணைப்பைத் தக்கவைக்க இரண்டு கூறுகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
