id: JOB.14.15
reference: Job 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: ta
  text: நீர் அழைப்பீர்[a]; நான் உமக்குப் பதிலளிப்பேன்; உமது கைகளின் படைப்புக்காக நீர் ஏங்குவீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய முற்றுப்பெறா வினையை, இங்கு யோபு விரும்பிக் கற்பனை செய்யும் நிகழ்வாகவும் அல்லது எளிய எதிர்காலமாகவும் புரிந்துகொள்ளலாம்.
    reason: grammatical_ambiguity
  - marker: b
    text: “உமது கைகளின் படைப்பு” என்பது தேவன் உண்டாக்கிய மனிதனாகிய யோபுவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: நீர் அழைப்பீர்
  rationale: קרא என்பதன் Qal முற்றுப்பெறா வினை, இரண்டாம் நபர் ஆண்பால் ஒருமை. யோபு விரும்பிக் கற்பனை செய்யும் சூழலைத் தமிழில் இயல்பான எதிர்கால வடிவம் வெளிப்படுத்துகிறது; மரியாதை ஒருமைக்காக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאָנֹכִי
  choice: நான்
  rationale: வலியுறுத்தப்பட்ட முதலாம் நபர் பிரதிப்பெயர், தேவனுடைய அழைப்புக்கு யோபு அளிக்கும் மறுமொழியை முன்னிறுத்துகிறது. அரைப்புள்ளிக்குப் பின் தமிழில் ‘நான்’ என்பதே இணைப்பை இயல்பாகத் தருகிறது.
- source_word: אֶעֱנֶךָּ
  choice: உமக்குப் பதிலளிப்பேன்
  rationale: ענה என்பதன் Qal முற்றுப்பெறா வினை, இரண்டாம் நபர் ஒருமை பின்னொட்டுடன் உள்ளது. ‘பதிலளிப்பேன்’ என்பது நேரடியான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְמַעֲשֵׂה
  choice: படைப்புக்காக
  rationale: מַעֲשֶׂה என்பது செயல், வேலை, அல்லது செய்யப்பட்ட பொருள் எனப் பொருள்படும். ‘உமது கைகள்’ என்ற தொடருடன், தேவன் உண்டாக்கிய மனிதனைக் குறிக்கும் படைப்புச் சித்திரத்தை ‘படைப்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדֶיךָ
  choice: உமது கைகளின்
  rationale: எபிரெய மூலத்தின் ‘உமது கைகள்’ என்ற மனித உருவகச் சொல்லாட்சியைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: תִכְסֹף
  choice: நீர் ஏங்குவீர்
  rationale: כסף என்பதன் Qal முற்றுப்பெறா வினை ஆழமான விருப்பம் அல்லது ஏக்கத்தைக் குறிக்கிறது. ‘ஏங்குவீர்’ அதன் உணர்ச்சி வலிமையை நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: தேவன் தாம் படைத்த மனிதன்மீது வெறும் கவனம் செலுத்துவாரா, அல்லது அவனுக்காக ஏங்குவாரா
  choice: உமது கைகளின் படைப்புக்காக நீர் ஏங்குவீர்
  alternative: உமது கைகளின் படைப்பின்மீது நீர் அக்கறைகொள்வீர்
  rationale: כסף என்பது பொதுவாக வெறும் கவனத்தைவிட வலிமையான ஏக்கத்தை வெளிப்படுத்துகிறது. ஆகவே, நியாயத்தீர்ப்பின் மத்தியில் தேவன் தாம் படைத்தவனை மீண்டும் விரும்புவார் என்ற யோபுவின் நம்பிக்கையையும் அதன் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்,’ ‘உமது,’ ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளன; எபிரெய மூலத்தின் அழைப்பு—மறுமொழி அமைப்பும் ‘கைகளின் படைப்பு’ என்ற உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
