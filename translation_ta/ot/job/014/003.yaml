id: JOB.14.3
reference: Job 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: ta
  text: ஆயினும், இப்படிப்பட்ட ஒருவன்மீதும் நீர் உமது கண்களைத் திறந்து பார்க்கிறீர்; என்னையும் உம்மோடு[a] நியாயவிசாரணைக்குக் கொண்டுவருகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமக்கு முன்பாக.’ எபிரெயில் சொல்லுக்குச் சொல் ‘உம்மோடு’ என்று உள்ளது; இது கடவுளுக்கு முன்பாக நியாயவிசாரணையில் நிற்பதையோ, அவரோடு ஒரு வழக்கில் ஈடுபடுவதையோ சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: ஆயினும்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட மனிதனின் நிலையாமையோடு முரண்படும் வியப்பையும் முறையீட்டையும் வெளிப்படுத்தும் எதிர்மறை இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: עַל זֶה
  choice: இப்படிப்பட்ட ஒருவன்மீதும்
  rationale: சொல்லுக்குச் சொல் ‘இதன்மீது’ என்றாலும், சூழலில் முன்பு விவரிக்கப்பட்ட நிலையற்ற மனிதனைக் குறிக்கிறது. ‘ஒருவன்’ என்பது அந்த ஆள்சுட்டைக் காட்டுகிறது; ‘-உம்’ אַף என்பதின் வலியுறுத்தலையும் இயல்பாகத் தாங்குகிறது.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: நீர் உமது கண்களைத் திறந்து பார்க்கிறீர்
  rationale: ‘கண்களைத் திறத்தல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, ஒருவர்மீது கவனம் செலுத்தி ஆராயும் கருத்தை இயல்பான தமிழில் ‘பார்க்கிறீர்’ என வெளிப்படுத்துகிறது.
- source_word: וְאֹתִי
  choice: என்னையும்
  rationale: வேற்றுமை உருபுடன் முன்னிலைப்படுத்தப்பட்ட ‘என்னை’ என்பதன் தனிப்பட்ட வலியுறுத்தலை ‘என்னையும்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: תָבִיא
  choice: கொண்டுவருகிறீர்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவிலுள்ள ‘வரச் செய்/கொண்டுவா’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘அழைப்பாணை விடுகிறீர்’ போன்ற அதிக விளக்கமான நீதிமன்றச் சொல்லைத் தவிர்க்கிறது.
- source_word: בְמִשְׁפָּט
  choice: நியாயவிசாரணைக்கு
  rationale: இங்கு מִשְׁפָּט நீதிசார் விசாரணை அல்லது தீர்ப்புச் செயல்முறையைக் குறிக்கிறது. ‘நியாயவிசாரணை’ சட்டப் பின்னணியைத் தெளிவாக்கினாலும் அதை நவீன நீதிமன்றத்துக்குள் மட்டும் சுருக்குவதில்லை.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: עם என்பதன் நேரடியான ‘உடன்/ஓடு’ என்ற பொருளைப் பாதுகாக்கிறது. கடவுளின் முன்னிலையில் விசாரிக்கப்படுவதா அல்லது அவரோடு வழக்காடுவதா என்ற எபிரெய மொழியின் பதற்றத்தைத் தீர்த்துவிடாமல் வைக்கிறது.
theological_decisions:
- issue: கடவுளுக்கும் யோபுக்கும் இடையிலான நீதிசார் உறவை עִמָּךְ எவ்வாறு குறிக்கிறது
  choice: உம்மோடு
  alternative: உமக்கு முன்பாக / உமக்கு எதிராக
  rationale: எபிரெய முன்னிடைச்சொல்லின் நேரடியான பொருள் ‘உம்மோடு.’ இது கடவுளின் முன்னிலையில் விசாரணைக்கு நிற்பதையும் அவரோடு ஒரு வழக்கில் ஈடுபடுவதையும் சுட்டக்கூடும். அந்த இறையியல் மற்றும் நீதிசார் இருபொருள் வாய்ப்பை மொழிபெயர்ப்பு திட்டமிட்டு திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், மரியாதையான ஒருமை வடிவில் கடவுளை நேரடியாக அழைக்கும் கவிதைநடையாக அமைக்கப்பட்டுள்ளது. எபிரெய உருவகமும் நீதிசார் இருபொருள் வாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன; வாசிப்பின் ஓட்டத்திற்காக அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
