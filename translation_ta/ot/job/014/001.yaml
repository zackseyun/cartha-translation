  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: ta
  text: பெண்ணுக்குப் பிறந்த மனிதன்[a] குறுகிய வாழ்நாள் உடையவன்; கலக்கம் நிறைந்தவன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “மனிதன்” என்பது மனிதகுலத்தின் பொதுவான நிலையைக் குறிக்கும் பிரதிநிதித்துவ ஒருமை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “துன்பம் நிறைந்தவன்” அல்லது “அமைதியின்மை நிறைந்தவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: மனிதன்
  rationale: இங்கு ஒரே மனிதனை மட்டும் அல்லாமல் மனிதகுலத்தின் பொதுவான நிலையைச் சுட்டும் பிரதிநிதித்துவ ஒருமையாக வருகிறது. தமிழில் “மனிதன்” அந்த ஒருமை வடிவத்தையும் பொதுப்பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְלוּד אִשָּׁה
  choice: பெண்ணுக்குப் பிறந்த
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பிறப்பு உருவகத்தைத் தக்கவைத்து, மனித வாழ்வின் இயல்பான பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் உணர்த்துகிறது.
- source_word: קְצַר יָמִים
  choice: குறுகிய வாழ்நாள் உடையவன்
  rationale: சொல்லளவில் “நாட்கள் குறைந்தவன்” என்ற கருத்தை இயல்பான நவீன தமிழில் வழங்குகிறது; வாழ்வின் குறுகிய காலத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּשְׂבַע רֹגֶז
  choice: கலக்கத்தால் நிறைந்தவன்
  rationale: שְׂבַע என்பதன் “நிறைந்த” பொருளையும், רֹגֶז குறிக்கக்கூடிய உள்ளக் கலக்கம், அமைதியின்மை, வெளிப்புறத் துன்பம் ஆகிய பரப்பையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வழங்குகிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் אָדָם என்பதன் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: மனிதகுலம் / ஒரு மனிதர்
  rationale: வசனம் மனித வாழ்வின் பொதுநிலையைப் பேசினாலும், மூலத்தில் பிரதிநிதித்துவ ஒருமை உள்ளது. “மனிதன்” அந்த இலக்கண வடிவத்தையும் பொதுவான மனித நிலையையும் தக்கவைக்கிறது.
- issue: רֹגֶז என்பதன் பொருள் பரப்பு
  choice: கலக்கம்
  alternative: துன்பம் / அமைதியின்மை
  rationale: இச்சொல் வெளிப்புற இன்னலையும் உள்ளார்ந்த அமைதியின்மையையும் குறிக்கக்கூடும். “கலக்கம்” அந்தப் பதற்றத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத்தமிழில் எளிதாகப் புரியும், அதேவேளையில் யோபின் கவிதைநடைக்கேற்ற சுருக்கமும் கண்ணியமும் கொண்ட நடை. எபிரெயத்தின் இணையான இரு பண்புக்கூறுகளும் ஒருமை வடிவில் பாதுகாக்கப்பட்டுள்ளன.
