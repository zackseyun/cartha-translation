  text: אַךְ בְּ֭שָׂר/וֹ עָלָ֣י/ו יִכְאָ֑ב וְ֝/נַפְשׁ֗/וֹ עָלָ֥י/ו תֶּאֱבָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: ta
  text: நிச்சயமாகவே, அவனுடைய சதை அவனுக்கே வலிக்கும்; அவனுடைய உயிர்[a] அவனுக்கே துயருறும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்” என்பதற்கு “ஆத்துமா,” “உள்ளம்,” அல்லது “தன்னிலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் இரு இடங்களிலும் சொல்லுக்குச்சொல் “அவன்மேல்” என உள்ளது. தமிழில் இயல்பாக “அவனுக்கே” எனத் தரப்பட்டுள்ளது; அதன் துல்லியமான தொடர்புப் பொருள் சுருக்கமாகவும் முழுமையாகத் தெளிவுபடாததாகவும் உள்ளது. தொடக்கச் சொல் “மட்டுமே” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆயினும்
  rationale: முந்தைய வசனத்திலுள்ள அறியாமைக்கும் இங்கே கூறப்படும் தனிப்பட்ட வேதனைக்கும் இடையிலான மாறுபாட்டைக் காட்டுகிறது. எபிரேயச் சொல் ‘மட்டுமே’, ‘மெய்யாகவே’ என்றும் பொருள்படக்கூடியதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּשָׂרוֹ
  choice: அவனுடைய சதை
  rationale: בָּשָׂר என்பதன் உருவகத் தெளிவையும், அடுத்த அரையடியில் வரும் ‘உயிர்’ என்பதுடனான கவிதை இணைப்பையும் காக்கிறது.
- source_word: עָלָיו
  choice: அவன்மேல்
  rationale: இரு அரையடிகளிலும் மீண்டும் வரும் எபிரேய முன்னிடைச்சொல்லை அப்படியே ஒத்த வடிவில் காத்து, அதன் சுருக்கமானதும் தெளிவாகத் தீராததுமான சொற்றொடரை மொழிபெயர்ப்பு முன்கூட்டியே விளக்கிவிடாமல் விடுகிறது.
- source_word: יִכְאָב
  choice: வலியுறும்
  rationale: כאב குறிக்கும் வலியை அனுபவித்தல் அல்லது வலித்தல் என்ற பொருளைச் சுருக்கமாகவும் கவிதை நடையிலும் வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிர்
  rationale: נֶפֶשׁ இங்கு உயிர், தன்னிலை, உள்ளம் போன்ற பொருள்களை ஏற்கலாம். ‘உயிர்’ என்பது இயல்பான தமிழாக இருந்து, ‘சதை’ என்பதுடன் உள்ள வேறுபாட்டைக் காக்கிறது; தனியான உடல்–ஆன்மா கோட்பாட்டைத் திணிக்காது.
- source_word: תֶּאֱבָל
  choice: துயரப்படும்
  rationale: אבל என்பதன் புலம்புதல் அல்லது துக்கித்தல் என்ற உணர்வை நவீன, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; உள்ளம்; தன்னிலை
  rationale: ‘சதை’ என்பதற்கு இணையாக வரும் சொல்லின் கவிதைத் த tensionை ‘உயிர்’ காக்கிறது; அதேவேளையில் மரணத்திற்குப் பிந்தைய மனித அமைப்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்தில் சேர்க்காது. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
- issue: இருமுறை வரும் עָלָיו என்பதன் தொடர்பு
  choice: இரு இடங்களிலும் ‘அவன்மேல்’
  alternative: அவனுக்குள்; தனக்காக
  rationale: மூலத்தின் திட்டமிட்ட மறுபடியுரைத்தலையும் அதன் பொருள் தெளிவின்மையையும் காக்கிறது. தமிழில் சற்றுச் சுருக்கமான கவிதைச் சொற்றொடராக இருந்தாலும் புரிந்துகொள்ளக்கூடியது; சாத்தியமான இடியோமப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘சதை’, ‘உயிர்’, ‘அவன்மேல்’ என்ற சொற்கள் மூல எபிரேயத்தின் உடல் சார்ந்த உருவகத்தையும் இணை அமைப்பையும் காக்கின்றன; இயல்பற்ற தன்மையைத் தணிக்க நிறுத்தக்குறிகள் பயன்படுத்தப்பட்டுள்ளன.
