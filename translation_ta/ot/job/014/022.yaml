revisions:
- from: ஆயினும், அவனுடைய சதை அவன்மேல் வலியுறும்; அவனுடைய உயிர்[a] அவன்மேல் துயரப்படும்.[b]
  to: நிச்சயமாகவே, அவனுடைய சதை அவனுக்கே வலிக்கும்; அவனுடைய உயிர்[a] அவனுக்கே துயருறும்.[b]
  rationale: The revision corrects the force of אַךְ, makes both cola idiomatic modern Tamil, and retains the Hebrew repetition and ambiguity of עָלָיו in a focused note. It preserves the concrete flesh/life parallel and avoids imposing a doctrinal reading of נֶפֶשׁ.
