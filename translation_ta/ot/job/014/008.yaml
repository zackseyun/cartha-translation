  text: அதன் வேர் நிலத்தில் முதிர்ந்துபோனாலும்[a], அதன் அடிக்கட்டை[b] புழுதியில் இறந்துபோனாலும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதன் வேர் நிலத்தில் முதிர்ந்துபோனால்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நிபந்தனையைக் குறிக்கக்கூடும்; ஆனால் இங்குள்ள மர உருவகத்தின் ஓட்டத்தில் அது விட்டுக்கொடுப்புப் பொருளைக் கொண்டிருக்க வாய்ப்பு அதிகம்.
