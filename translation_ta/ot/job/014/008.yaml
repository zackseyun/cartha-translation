  - marker: b
    text: “அடிமரம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …ஆனாலும்
  rationale: இங்கு மரத்தின் நம்பிக்கையற்றதுபோல் தோன்றும் நிலையை அடுத்த வசனத்தின் புதுப்பிக்கும் வாய்ப்புடன் எதிர்மறையாக இணைப்பதால், நிபந்தனைப் பொருளைவிட விட்டுக்கொடுப்பு பொருள் இயல்பாக உள்ளது; எனினும் நிபந்தனை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יַזְקִין
  choice: முதிர்ந்துபோனாலும்
  rationale: ‘முதுமை அடைதல்/பழமையாகுதல்’ என்ற படிப்படியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בָּאָרֶץ
  choice: நிலத்தில்
  rationale: மரத்தின் வேர் குறித்த தாவரவியல் சூழலில் אָרֶץ என்பதற்கான இயல்பான தமிழ் இணை; ‘பூமியில்’ என்பதைவிட இங்கு தெளிவானது.
- source_word: שָׁרְשׁוֹ
  choice: அதன் வேர்
  rationale: எபிரெய ஒருமையைப் பாதுகாத்து, மரத்தின் வேரமைப்பை ஒருமைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: וּבֶעָפָר
  choice: புழுதியில்
  rationale: עָפָר என்பதன் ‘தூசி/துகள்மண்’ பொருளையும் யோபுவிலுள்ள மரணம் சார்ந்த கவித்துவ ஒலியையும் தக்கவைக்கிறது.
- source_word: יָמוּת
  choice: செத்துப்போனாலும்
  rationale: מות என்ற நேரடியான ‘இறத்தல்’ பொருளை மரத்தைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; ‘வாடிப்போனாலும்’ என்று உரையில் இல்லாத உருவகத்தைச் சேர்க்கவில்லை.
- source_word: גִּזְעוֹ
  choice: அதன் அடிமரம்
  rationale: வெட்டப்பட்ட மரத்தின் எஞ்சிய அடிப்பகுதியை இயல்பாகக் குறிக்கிறது; அடுத்த வசனத்தில் மீண்டும் துளிர்க்கும் மர உருவகத்திற்கும் பொருந்துகிறது.
