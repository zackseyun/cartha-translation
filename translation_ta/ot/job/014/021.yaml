source:
  edition: WLC
  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: ta
  text: அவனுடைய மகன்கள் மதிப்புப் பெறுகிறார்கள்[a]; அவன் அதை அறிவதில்லை. அவர்கள் தாழ்த்தப்படுகிறார்கள்; அவர்களைக் குறித்து அவன் உணர்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய மகன்கள் கௌரவிக்கப்படுகிறார்கள்.”
    reason: כבד என்ற வினை இங்கு மதிப்புப் பெறுதல் அல்லது கௌரவிக்கப்படுதல் என்ற நெருக்கமான பொருள்களில் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: மேன்மை அடைகிறார்கள்
  rationale: כבד என்பதன் Qal வடிவம் இங்கு ‘மதிப்பிலும் நிலையிலும் உயர்தல்’ என்ற பொருளைத் தருகிறது. ‘மேன்மை அடைகிறார்கள்’ என்பது அந்த மாற்றத்தையும் கௌரவப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் கொண்டிருப்பதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא יֵדָע
  choice: அவன் அதை அறிவதில்லை
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்.’ முந்தைய நிகழ்வைக் குறிக்கத் தமிழில் இயல்பாக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְיִצְעֲרוּ
  choice: அவர்கள் தாழ்நிலை அடைகிறார்கள்
  rationale: צער இங்கு சிறுமையடைதல் அல்லது நிலையிற் தாழ்தல் என்ற பொருளில், முந்தைய ‘மேன்மை அடைதல்’ என்பதற்கு எதிராக நிற்கிறது. ‘தாழ்நிலை அடைகிறார்கள்’ என்பது காரணத்தைச் சேர்க்காமல் நிலைமாற்றத்தைப் பாதுகாக்கிறது.
- source_word: וְלֹא יָבִין
  choice: அவன் உணர்வதில்லை
  rationale: בין என்பது புரிந்துகொள்ளுதல் அல்லது பகுத்துணர்தல் என்பதைக் குறிக்கிறது. இச்சூழலில் ‘உணர்வதில்லை’ என்பது மகன்களின் நிலை குறித்த அவனுடைய அறியாமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களைக் குறித்து
  rationale: இந்தப் பன்மைச் சுட்டுப்பெயர் மகன்களை மீண்டும் குறிக்கிறது. அதன் தொடர்பைத் தவிர்க்காமல், தமிழில் இயல்பாக ‘அவர்களைக் குறித்து’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
