  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் இணைநிலை அமைப்பும், மகன்களின் உயர்வு–தாழ்வு என்ற எதிரிணையும், இறந்தவனின் அறியாமை குறித்த கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
