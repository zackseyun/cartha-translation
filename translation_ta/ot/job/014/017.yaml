source:
  edition: WLC
  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: ta
  text: 'என் மீறுதல் ஒரு பையில் முத்திரையிட்டு அடைக்கப்பட்டுள்ளது;

    என் அக்கிரமத்தின்மேல் நீர் பூசி மூடுகிறீர்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் என் அக்கிரமத்தின்மேல் ஒட்டிவைக்கிறீர்,” “என் அக்கிரமத்தின்மேல் சாந்து பூசுகிறீர்,” அல்லது “என் அக்கிரமத்தைத் தைத்து மூடுகிறீர்.” இங்குள்ள எபிரெய வினைச்சொல் கடினமானது; உருவகத்தின் துல்லியமான பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: முத்திரையிட்டு மூடப்பட்டுள்ளது
  rationale: இது חתם என்பதன் செயப்பாட்டு வினையெச்ச வடிவம்; முத்திரையால் மூடிப் பாதுகாக்கப்பட்டிருக்கும் விளைவு நிலையை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בִּצְרוֹר
  choice: ஒரு பைக்குள்
  rationale: צְרוֹר என்பது கட்டப்பட்ட பொதி, சிறு பை, அல்லது பணப்பையைக் குறிக்கலாம். இங்கு பாவம் சேமித்து வைக்கப்படும் தெளிவான உருவகத்தை இயல்பான தமிழில் ‘பை’ காக்கிறது.
- source_word: פִּשְׁעִי
  choice: என் மீறுதல்
  rationale: פֶּשַׁע என்பது மீறுதல் அல்லது கலகத்தைக் குறிக்கலாம். இக்கவிதைச் சூழலில் வெளிப்படையான கலகம் என்ற பொருளைத் திணிக்காமல் அதன் அறநெறி கனத்தை ‘மீறுதல்’ காக்கிறது.
- source_word: וַתִּטְפֹּל
  choice: நீர் பூசி மூடுகிறீர்
  rationale: טפל என்ற வினையின் துல்லியமான பொருள் இங்கு கடினமானது; ஒட்டுதல், சாந்து பூசுதல், மூடுதல் போன்ற பொருள்கள் முன்வைக்கப்படுகின்றன. ‘பூசி மூடுகிறீர்’ என்பது மேலே ஏதோ ஒன்றைப் பூசி மறைக்கும் உருவகத்தைக் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עַל
  choice: மேல்
  rationale: טפל என்ற வினையுடன் עַל, ஒன்றின்மேல் ஏதோ இடப்படுவதையோ பூசப்படுவதையோ சுட்டுகிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமம்
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி, அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ முதல் அடியிலுள்ள ‘மீறுதல்’ என்பதிலிருந்து சொல்வேறுபாட்டைக் காத்து, பொருளை ‘குற்றப்பழி’ என்று தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: பை, முத்திரை, மூடுதல் ஆகிய உருவகங்களின் நோக்கம்
  choice: யோபின் மீறுதலைக் கடவுள் கணக்குத் தீர்ப்பதற்காகப் பாதுகாப்பாகச் சேமித்து வைத்திருப்பதாக வரும் புலம்பலாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பாவத்தை மறைத்தல் அல்லது அகற்றுதல், அதாவது மன்னித்தல், என உருவகத்தைப் புரிந்துகொள்ளலாம்.
  rationale: முந்திய வசனத்தையும் யோபின் புலம்பல் சூழலையும் பொருத்தவரை, கடவுள் அவனுடைய குற்றத்தைத் துல்லியமாகக் கணக்கில் வைத்திருப்பதே முதன்மையான கருத்து. உடனடிச் சூழல் ஆதரிக்காத மன்னிப்பு என்ற பொருளை மொழிபெயர்ப்பு சேர்க்கவில்லை; அதேவேளை உருவகத்தை விளக்கவுரையாக மாற்றாமலும் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தோடும் பொதுவாசகர்களுக்குப் புரியும் நடையோடும் வடிவமைக்கப்பட்டது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்/மூடுகிறீர்’ பயன்படுத்தப்பட்டது. இரு இணை அடிகளிலும் ‘மீறுதல்/அக்கிரமம்’ என்ற சொல்வேறுபாடு காக்கப்பட்டது.
