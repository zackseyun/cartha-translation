    ஆறு வற்றி உலர்ந்துபோவதுபோலவும்,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: மறைந்துபோவதுபோலவும்
  rationale: நீர் குறைந்து இல்லாமற்போதலைக் குறிக்கும் வினை; தமிழில் இயல்பான உவமைத் தொடருக்காக ‘மறைந்துபோ’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִנִּי יָם
  choice: கடலிலிருந்து
  rationale: מִנִּי என்பது ‘இலிருந்து’ என்றும் יָם என்பது ‘கடல்’ என்றும் நேரடியாகக் குறிக்கின்றன; ‘கடல்’ என்பது சில சூழல்களில் பெரிய நீர்நிலையையும் குறிக்கலாம்.
- source_word: נָהָר
  choice: ஆறு
  rationale: ஓடும் நீர்நிலையைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: வற்றி உலர்ந்துபோவதுபோலவும்
  rationale: இரு இணை வினைகளின் வலியுறுத்தலைப் பாதுகாக்க, ‘வற்று’ மற்றும் ‘உலர்ந்துபோ’ எனத் தனித்தனியாக அளிக்கப்பட்டது.
