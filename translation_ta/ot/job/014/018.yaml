  source_fidelity: 'வசனம் எபிரேய மூலத்தின் இரு இணை இயற்கைக் காட்சிகளையும் துல்லியமாகக் காக்கிறது: וְאוּלָם-இன் எதிர்மறை/வலியுறுத்தல் «ஆனாலும்» என்றும் «கூட» என்றும் தரப்பட்டுள்ளது; נוֹפֵל-இன் பங்கேற்பு «விழுகிற» எனவும், יִבּוֹל-இன் உருவகமான சிதைவு «சிதைந்து போகிறது» எனவும், יֶעְתַּק מִמְּקֹמוֹ «தன் இடத்திலிருந்து பெயர்கிறது» எனவும் பொருத்தமாகத் தரப்பட்டுள்ளது. மூலத்தில் இல்லாத செயற்பாட்டாளரைச் சேர்க்கவில்லை.'
