  rationale: צוּר என்பதன் பரந்த பொருளையும் மலையுடன் அமைந்துள்ள கவிதை இணைப்பையும் தக்கவைக்கிறது.
- source_word: יֶעְתַּק
  choice: பெயர்கிறது
  rationale: தன் இடத்திலிருந்து அகலுதல் அல்லது இடம்பெயர்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; செயப்பாட்டு காரணத்தை மூலவசனம் குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: מִמְּקֹמוֹ
  choice: தன் இடத்திலிருந்து
  rationale: எதற்குச் சொந்தமான இடம் என்பதைக் காட்டும் மூலமொழியின் உடைமைப் பொருளைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
