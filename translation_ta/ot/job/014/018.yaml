- source_word: יִבּוֹל
  choice: சிதைந்து போகிறது
  rationale: வாடுதல் அல்லது மங்குதல் என்ற வழக்கமான பொருள் இங்கு மலைக்கு உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது; மலையின் படிப்படியான அழிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְצוּר
