  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாடிப்போகிறது.” இவ்வினைச்சொல் பொதுவாக வாடுதல் அல்லது மங்குதலைக் குறிக்கும்; இங்கு மலை குறித்த உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
