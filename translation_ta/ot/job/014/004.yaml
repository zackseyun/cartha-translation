base_translation:
  language: en
  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: ta
  text: தீட்டான ஒன்றிலிருந்து தூய்மையான ஒன்றை யாரால் கொண்டுவர முடியும்? ஒருவராலும் முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீட்டானதிலிருந்து தூய்மையானதை யார் கொண்டுவருவார்? ஒருவர்கூட இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: யாரால்
  rationale: சூழலில் இயலாமையை உணர்த்தும் சொல்லாட்சிக் கேள்வி. எபிரெய வினை அமைப்பின் மறைமுக ஆற்றல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִתֵּן
  choice: கொண்டுவர முடியும்
  rationale: நேர் பொருள் ‘கொடுப்பான்’ என்றாலும், இவ்விடத்தில் ஒன்றிலிருந்து இன்னொன்றை உருவாக்குதல் அல்லது வெளிக்கொண்டுவருதல் என்ற வழக்குப் பொருள் உள்ளது.
- source_word: טָהוֹר
  choice: தூய்மையான ஒன்று
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடை. சடங்கு, ஒழுக்கம் அல்லது இருப்புநிலை சார்ந்த தூய்மை என்று பொருளை வரையறுக்காமல் அதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: מִטָּמֵא
  choice: தீட்டான ஒன்றிலிருந்து
  rationale: מִן முன்னொட்டையும் பெயர்ச்சொல்லாகப் பயன்படும் טָמֵא என்பதையும் தெளிவான நவீன தமிழில் தருகிறது; தூய்மை–தீட்டு எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: לֹא אֶחָד
  choice: ஒருவராலும் முடியாது
  rationale: சொல்லாட்சிக் கேள்விக்கான முழுமையான மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெயத்தின் சொல் நெருக்கமான ‘ஒருவர்கூட இல்லை’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தூய்மை மற்றும் தீட்டின் குறிப்பு
  choice: தீட்டிலிருந்து தூய்மையை உண்டாக்க மனிதரால் முடியாது என்னும் பொதுவான, சுருக்கமான கூற்றாக வைக்கப்பட்டது.
  alternative: தீட்டான பெற்றோரிடமிருந்து தூய குழந்தை பிறப்பதை மட்டும் குறிக்கும் கூற்று; அல்லது சடங்கு மற்றும் ஒழுக்கத் தீட்டைப் பற்றிய விரிந்த பழமொழி.
  rationale: வசனம் மிகச் சுருக்கமாகவும் பழமொழி போன்றும் உள்ளது. தீட்டு சடங்கு சார்ந்ததா, ஒழுக்கம் சார்ந்ததா, பரம்பரை சார்ந்ததா, மனித இருப்புநிலை சார்ந்ததா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை. ‘தீட்டு/தூய்மை’ என்ற இணை, மூலத்தின் purity–impurity எதிர்மறையையும் அதன் சடங்கு மற்றும் ஒழுக்கப் பொருள் சாத்தியங்களையும் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
