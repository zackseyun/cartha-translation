source:
  edition: WLC
  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: ta
  text: அவன் அவனுடைய பாதுகாப்பாக இருந்த கூடாரத்திலிருந்து பிடுங்கப்படுகிறான்[a]; பயங்கரங்களின் அரசனிடம் அவன் நடத்திச் செல்லப்படுகிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் கூடாரத்திலிருந்து—தன் பாதுகாப்பிலிருந்து—பிடுங்கப்படுகிறான்.” எபிரெயத் தொடரை, அவன் பாதுகாப்பாகக் கருதிய இடம் அவன் கூடாரம் என்றோ, கூடாரமே அவனுடைய பாதுகாப்பு என்றோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பயங்கரங்களின் அரசன்” என்பது ஒரு கவித்துவமான சொற்றொடர்; இது பெரும்பாலும் மனித உருவில் சித்தரிக்கப்படும் மரணத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: பிடுங்கப்படுகிறான்
  rationale: נתק என்பதன் நிபால் வடிவம் ஒன்றிலிருந்து வலுக்கட்டாயமாகப் பிரிக்கப்படுதல் அல்லது பிடுங்கப்படுதல் என்ற பொருளைத் தருகிறது; தமிழ் சொல் வன்மையான செயப்பாட்டு உணர்வைப் பாதுகாக்கிறது.
- source_word: מֵאָהֳלוֹ
  choice: தன் கூடாரத்திலிருந்து
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்’; குடியிருப்பு என்ற விரிவான பொருள் சாத்தியமானாலும், மூலத்தின் தெளிவான கவித்துவப் படிமம் வைக்கப்பட்டுள்ளது.
- source_word: מִבְטַחוֹ
  choice: கூடாரமாகிய பாதுகாப்பு
  rationale: מִבְטָח என்பது பாதுகாப்பு, நம்பிக்கை, பாதுகாப்பான இடம் ஆகிய பொருள்களைக் கொண்டது. எபிரெயத் தொடரில் இது கூடாரத்தை விளக்கும் இணைப்பெயராகவோ, அவன் பாதுகாப்பாகக் கருதியதைக் குறிப்பதாகவோ இருக்கலாம்; முதன்மை உரை முதல் சாத்தியத்தை இயல்பாக வெளிப்படுத்துகிறது, மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְתַצְעִדֵהוּ
  choice: அவன் நடத்திச் செல்லப்படுகிறான்
  rationale: צעד என்பதன் ஹிஃபீல் வடிவம் ‘அடியெடுத்து நடக்கச் செய்’, ஆகவே ‘நடத்திச் செல்’ எனப் பொருள்படும். எபிரெயத்தில் உள்ள 3ஆம் நபர் பெண்பால் எழுவாய் தெளிவாக அடையாளப்படுத்தப்படாததால், தமிழில் குறிப்பிடப்படாத செய்பவருடனான செயப்பாட்டு அமைப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனிடம்
  rationale: לְ இங்கு திசை அல்லது இலக்கைக் குறிக்கிறது; ‘அரசனிடம்’ என்பது இயல்பான தமிழில் அந்த இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בַּלָּהוֹת
  choice: பயங்கரங்களின்
  rationale: பலவினைச் சொல் திகில்கள், பயங்கரங்கள், கொடூரமானவை ஆகியவற்றைக் குறிக்கிறது; ‘பயங்கரங்களின் அரசன்’ மூலத்தின் கவித்துவமான பட்டத்தை அடையாளம் நிர்ணயிக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘பயங்கரங்களின் அரசன்’ என்பவரின் அடையாளம்
  choice: கவித்துவப் பட்டத்தை விளக்கமின்றி முதன்மை உரையில் தக்கவைத்தல்
  alternative: மரணம் மனித உருவகமாகச் சித்தரிக்கப்படுகிறது; அல்லது பாதாளம்/மரண உலகம் குறிக்கப்படுகிறது
  rationale: எபிரெயம் இந்த உருவகத்தின் குறிப்பிட்ட அடையாளத்தை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மரணம், பாதாளம் அல்லது தீய ஆவி சார்ந்த ஆளுநர் என்று மொழிபெயர்ப்பிலேயே நிர்ணயிக்காமல், மூலத்தின் இறையியல் மற்றும் கவித்துவத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்’, ‘பிடுங்கப்படுகிறான்’, ‘பயங்கரங்களின் அரசன்’ ஆகியவை மூலப் படிமங்களையும் வன்மையான இயக்கத்தையும் காக்கின்றன. தெளிவில்லாத பெண்பால் எழுவாய் தமிழில் செயப்பாட்டு அமைப்பால் தேவையின்றி அடையாளப்படுத்தப்படவில்லை; அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
