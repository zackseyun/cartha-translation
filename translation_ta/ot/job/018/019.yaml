  text: לֹ֘א נִ֤ין ל֣/וֹ וְ/לֹא נֶ֣כֶד בְּ/עַמּ֑/וֹ וְ/אֵ֥ין שָׂ֝רִ֗יד בִּ/מְגוּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: ta
  text: அவனுடைய மக்களிடையே அவனுக்குச் சந்ததியோ பின்வழித்தோன்றலோ இல்லை[a]; அவன் தங்கியிருந்த இடங்களில் எஞ்சியவர் ஒருவரும் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகனோ பேரனோ இல்லை”; இவ்விரு எபிரெயச் சொற்களும் சேர்ந்து அவனுடைய சந்ததி முற்றிலும் அறுபட்டுப்போவதைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய குடியிருப்புகளில்” அல்லது “அவனுடைய வாழிடங்களில்”; எபிரெயச் சொல் வாழ்ந்த இடங்களையோ தங்கியிருந்த இடங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: மகன்
  rationale: இச்சொல் சந்ததி அல்லது வழித்தோன்றலைக் குறிக்கிறது; அடுத்துள்ள נֶכֶד என்பதுடன் இணைந்த சொற்றொடரில், தலைமுறைகளின் முழுமையான அறுப்பை இயல்பாக வெளிப்படுத்த ‘மகன்’ பொருத்தமானது.
- source_word: נֶכֶד
  choice: பேரன்
  rationale: נִין உடன் இணைந்து அடுத்த தலைமுறை வழித்தோன்றலைக் குறிக்கிறது. ‘பேரன்’ என்பது சாத்தியமான நேரடிப் பொருளைத் தக்கவைத்து, சந்ததி முற்றிலும் இல்லாமற்போவதைத் தெளிவாக்குகிறது.
- source_word: בְּעַמּוֹ
  choice: அவனுடைய மக்களிடையே
  rationale: עַם என்பது பொதுவாக ‘மக்கள்’; בְּ இங்கு அவன் சேர்ந்துள்ள சமூகச் சூழலைக் குறிக்கிறது. ‘மக்களிடையே’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: שָׂרִיד
  choice: எஞ்சியிருப்பவன்
  rationale: அழிவு அல்லது துண்டிப்புக்குப் பின் மீந்திருக்கும் ஒருவரைச் சொல் குறிக்கிறது. ‘எஞ்சியிருப்பவன்’ தனிநபர் சார்ந்த எபிரெயப் பொருளைத் தெளிவாகத் தருகிறது; தேவையற்ற இறையியல் நிழற்பொருளையும் தவிர்க்கிறது.
- source_word: בִּמְגוּרָיו
  choice: அவன் தங்கியிருந்த இடங்களில்
  rationale: מָגוּר தங்கியிருக்கும் இடங்களையோ வாழிடங்களையோ குறிக்கலாம். ‘தங்கியிருந்த இடங்களில்’ தற்காலிகத் தங்குதல் என்ற சாத்தியமான நுணுக்கத்தைப் பாதுகாத்தபடி இயல்பாக உள்ளது.
