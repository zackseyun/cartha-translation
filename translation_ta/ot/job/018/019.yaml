- from: அவனுடைய மக்களிடையே அவனுக்கு மகனோ பேரனோ இல்லை[a]; அவன் தங்கியிருந்த இடங்களில் எஞ்சியிருப்பவனும் இல்லை[b].
  to: அவனுடைய மக்களிடையே அவனுக்குச் சந்ததியோ பின்வழித்தோன்றலோ இல்லை[a]; அவன் தங்கியிருந்த இடங்களில் எஞ்சியவர் ஒருவரும் இல்லை[b].
  rationale: The revision replaces a gender- and generation-restricted main rendering with broader Tamil descendant terms that better reflect the Hebrew collocation and the English POB audit trail. It retains the specific ‘son/grandson’ possibility in a footnote. The second colon is adjusted for idiomatic Tamil while preserving the singular-individual sense of ‘survivor.’
