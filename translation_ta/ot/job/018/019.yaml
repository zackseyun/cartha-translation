translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் இணை அமைப்பைப் பேணும் கண்ணியமான, எளிதில் புரியும் மொழிநடை. ‘மகனோ பேரனோ’ என்பது மூலத்தின் இரட்டைச் சந்ததிச் சொல்லைச் சுருக்கமின்றி வெளிப்படுத்துகிறது; மாற்றுப் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
