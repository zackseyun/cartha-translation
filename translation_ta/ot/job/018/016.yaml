  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: ta
  text: 'அவனுடைய வேர்கள் கீழே உலர்ந்து போகும்;

    மேலே அவனுடைய கிளை[a] வெட்டப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய தளிர்.” எபிரெயச் சொல் பொதுவாக “அறுவடை” அல்லது வெட்டப்படுகிற விளைச்சல் என்பதையும் குறிக்கலாம்; இங்கு அது செடியின் மேல்வளர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: கீழே
  rationale: ‘கீழிருந்து/கீழே’ என்ற இடப்பொருளைத் தருகிறது; அடுத்த அடியிலுள்ள ‘மேலே’ என்பதுடன் கவிதைநயமான இணைநிலையைப் பேணுகிறது.
- source_word: שָׁרָשָׁיו
  choice: அவனுடைய வேர்கள்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வந்துள்ள பன்மையைத் துல்லியமாகப் பேணி, செடியின் உருவகத்தைத் தெளிவாக்குகிறது.
- source_word: יִבָשׁוּ
  choice: உலர்ந்துபோகும்
  rationale: ‘உலர்தல்/உலர்ந்துபோதல்’ என்ற வினைப்பொருளை இயல்பான நவீன தமிழில் தருகிறது; பன்மையான ‘வேர்கள்’ என்பதோடு பொருந்துகிறது.
- source_word: וּמִמַּעַל
  choice: மேலே
  rationale: கீழுள்ள வேர்களுக்கு எதிரிணையாகச் செடியின் மேல்பகுதியைக் குறிக்கிறது; இணைப்பை தமிழின் அரைப்புள்ளி அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִמַּל
  choice: வெட்டப்படும்
  rationale: தாவரத்தின் ஒரு பகுதி வெட்டப்படுதல் அல்லது துண்டிக்கப்படுதல் என்ற வினைப்பொருளைப் பேணுகிறது; ‘வாடும்’ என்று மாற்றி மூலத்தின் தனித்த படிமத்தை மங்கச் செய்யவில்லை.
- source_word: קְצִירוֹ
  choice: அவனுடைய கிளை
  rationale: இச்சொல் பொதுவாக அறுவடை அல்லது வெட்டப்படுவது என்பதைக் குறிக்கலாம்; இங்கு ‘வேர்கள்’ என்பதற்கு இணையாகச் செடியின் மேல்வளர்ச்சியைச் சுட்டுவதால் ‘கிளை’ சூழலுக்கு ஏற்ற தெளிவான மொழிபெயர்ப்பு.
