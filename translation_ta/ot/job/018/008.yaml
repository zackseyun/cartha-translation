translation:
  language: ta
  text: 'ஏனெனில், அவன் தன் கால்களால் வலைக்குள் செலுத்தப்படுகிறான்;

    அவன் பின்னல் வலையின் மேல் நடக்கிறான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח בְּרֶשֶׁת בְּרַגְלָיו
  choice: அவனுடைய கால்களே அவனை வலைக்குள் கொண்டுபோகின்றன
  rationale: שֻׁלַּח என்பது வடிவில் செயப்பாட்டு வினை ('அனுப்பப்படுகிறான்/செலுத்தப்படுகிறான்'); בְּרַגְלָיו அவனுடைய சொந்தக் கால்களே கருவியாக இருப்பதை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும், அவன் தன் நடையால் சிக்கலை நோக்கிச் செல்கிறான் என்ற உருவகத்தைத் தெளிவாகவும் வைத்திருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שְׂבָכָה
  choice: பின்னலான கண்ணி
  rationale: இச்சொல் வலைப்பின்னல் அல்லது பின்னலமைந்த பொறியைக் குறிக்கிறது. முந்தைய 'வலை' என்பதுடன் வெறும் மறுபதிப்பாகத் தோன்றாமல், வலையின் பின்னல்தன்மையையும் பொறி என்ற சூழலையும் வெளிப்படுத்துகிறது.
- source_word: יִתְהַלָּךְ
  choice: நடக்கிறான்
  rationale: התהלך வடிவம் இங்கு தொடர்ந்து அல்லது அங்குமிங்கும் நடப்பதைக் குறிக்கக்கூடும்; சூழலில் பொறியின் மேல் நடப்பது என்ற எளிய நிகழ்கால மொழியாக இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: துன்மார்க்கன் வலையில் சிக்குவதில் அவனுடைய சொந்தச் செயலின் பங்கு
  choice: அவனுடைய கால்களே அவனை வலைக்குள் கொண்டுபோகின்றன
  alternative: அவன் தன் கால்களால் வலைக்குள் அனுப்பப்படுகிறான்
  rationale: எந்த வெளிப்புறச் செயற்பாட்டாளரையும் உரை குறிப்பிடவில்லை. செயப்பாட்டு வடிவத்தின் நிழலை முற்றிலும் அழிக்காமல், அவனுடைய கால்களே அவனைச் சிக்கலுக்கு இட்டுச் செல்கின்றன என்ற கவித்துவக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தெய்வீக காரணத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கவிதைக்குரிய கண்ணியமான நடை. இணையான இரு அடிகளின் 'வலை / பின்னலான கண்ணி' உருவகம் காக்கப்பட்டுள்ளது. சாதாரண வாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
