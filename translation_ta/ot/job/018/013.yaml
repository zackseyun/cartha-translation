source:
  edition: WLC
  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: ta
  text: 'அவனுடைய தோலின் உறுப்புகளை அது தின்றுவிடும்;

    மரணத்தின் முதற்பிறந்தவன்[a] அவனுடைய உறுப்புகளைத் தின்றுவிடுவான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மரணத்தின் முதல் மகன்.’ இது மிகக் கொடிய துன்பத்தையோ மரணத்தின் முதன்மையான கருவியையோ கவித்துவமாக ஆளுருவாக்கிக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: தின்றுவிடும் / தின்றுவிடுவான்
  rationale: אכל என்பதன் Qal முற்றுப்பெறாத வினை இங்கு அழிவை உருவகமாகக் குறிக்கிறது. முதல் அடியில் எழுவாய் வெளிப்படையாக இல்லாததால் நடுநிலை ஒருமை வடிவமும், இரண்டாம் அடியில் ஆண்பால் உருவக எழுவாய் இருப்பதால் ஆண்பால் வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: בַּדֵּי / בַּדָּיו
  choice: உறுப்புகளை / அவனுடைய உறுப்புகளை
  rationale: בדים என்பது பகுதிகள், உறுப்புகள், கிளைகள் எனப் பொருள்படலாம். தோல் மற்றும் உடல் அழிவு பற்றிய சூழலில் ‘உறுப்புகள்’ இயல்பாகப் பொருந்துகிறது; இரண்டு அடிகளிலும் சொல்லின் மீளுருவாக்கம் காக்கப்பட்டுள்ளது.
- source_word: עוֹרוֹ
  choice: அவனுடைய தோலின்
  rationale: עוֹר என்பதன் வழக்கமான பொருள் தோல். எபிரெயச் சொற்றொடரின் ‘அவனுடைய தோலின் உறுப்புகள்’ என்ற அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּכוֹר מָוֶת
  choice: மரணத்தின் முதற்பேறானவன்
  rationale: ‘மரணத்தின் முதற்பேறு’ என்ற கவித்துவமான இணைப்பை விளக்கவுரையாகச் சுருக்காமல் காக்கிறது. இரண்டாம் வினையின் ஆண்பால் ஒருமைக்கு ஏற்ப தமிழில் ‘முதற்பேறானவன்’ என ஆளுருவாக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: בְּכוֹר מָוֶת என்பதன் விளக்கம்
  choice: மரணத்தின் முதற்பேறானவன் என்ற கவித்துவ ஆளுருவாக்கத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: மிகக் கொடிய நோய்; மரணத்தின் முதன்மையான கருவி; மிகப் பயங்கரமான மரணம்
  rationale: எபிரெயச் சொற்றொடர் எந்த ஒரு குறிப்பிட்ட விளக்கத்தையும் கட்டாயப்படுத்தவில்லை. அதன் உருவகத்தையும் பொருள் தெளிவின்மையையும் பாதுகாப்பது உரையில் இல்லாத குறுகிய இறையியல் அல்லது மருத்துவ விளக்கத்தைப் புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுப்புகள்’ உடல்சார் பொருளைத் தருவதோடு மூலச்சொல்லின் மீளுருவாக்கத்தையும் காக்கிறது. ‘முதற்பேறானவன்’ என்பது இயல்பான தமிழிலும் எபிரெய உருவகத்துக்கு நெருக்கமாகவும் உள்ளது.
