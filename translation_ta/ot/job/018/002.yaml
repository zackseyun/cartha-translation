  text: עַד אָ֤נָה תְּשִׂימ֣וּ/ן קִנְצֵ֣י לְ/מִלִּ֑ין תָּ֝בִ֗ינוּ וְ/אַחַ֥ר נְדַבֵּֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: ta
  text: எவ்வளவு காலம் சொற்களால் கண்ணிகளை வைத்துக்கொண்டிருப்பீர்கள்?[a] புரிந்துகொள்ளுங்கள்; பிறகு நாம் பேசுவோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவ்வளவு காலம் சொற்களுக்கு எல்லை (அல்லது வரம்பு) விதிப்பீர்கள்?” எபிரேயத் தொடரின் பொருளைப் புரிந்துகொள்வது கடினம். இது சொற்களால் கண்ணி வைப்பதைக் குறிக்கலாம்; அல்லது முடிவில்லாமல் நீளும் பேச்சைப் பற்றிய குறையாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிறகு நாம் பேசுவோமாக.” இறுதி வினைச்சொல்லை ஒரு சாதாரண எதிர்காலக் கூற்றாகவும், சேர்ந்து பேசுவதற்கான அழைப்பாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: எவ்வளவு காலம்
  rationale: கண்டனத் தொனியுடைய கால வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּשִׂימוּן
  choice: வைத்துக்கொண்டிருப்பீர்கள்
  rationale: שׂים என்பதன் ‘வை/அமை’ என்ற அடிப்படைப் பொருளையும், ‘எவ்வளவு காலம்’ என்பதால் சூழலில் உருவாகும் தொடர்ச்சியான செயலின் கண்டனத் தொனியையும் சேர்த்து வெளிப்படுத்துகிறது.
- source_word: קִנְצֵי לְמִלִּין
  choice: சொற்களால் கண்ணிகளை
  rationale: எபிரேயத் தொடர் கடினமானது. சூழலில் இது பேச்சின் மூலம் பிறரைச் சிக்கவைக்கும் சொல்லாடலைக் குறிக்கலாம்; அதனால் வாசிக்க இயல்பான உருவக மொழி முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது. ‘சொற்களுக்கு முடிவுகள்/வரம்புகள்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תָּבִינוּ
  choice: புரிந்துகொள்ளுங்கள்
  rationale: בין வேரின் அறிவுணர்வு சார்ந்த பொருளையும், இங்குள்ள பன்மை கட்டளைத் தொனியையும் தெளிவாகக் காக்கிறது.
- source_word: וְאַחַר
  choice: பிறகு
  rationale: முதலில் புரிந்துகொள்ளுதல், அதன்பின் பேசுதல் என்ற நிகழ்வுவரிசையை இயல்பாகக் குறிக்கிறது.
- source_word: נְדַבֵּר
  choice: நாம் பேசுவோம்
  rationale: முதல் நபர் பன்மை நிறைவுறா வினையை நேரான எதிர்காலக் கூற்றாக மொழிபெயர்க்கிறது; அழைப்புத் தொனியும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
