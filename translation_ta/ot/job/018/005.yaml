    issue: Initial “ஆம்” is pragmatically awkward in this declarative poetic assertion.
    rationale: Though it can occasionally be emphatic, modern Tamil more naturally uses “நிச்சயமாக” for the emphatic force of גַּם here, without implying that the line answers a preceding question or statement.
