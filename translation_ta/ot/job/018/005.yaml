  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: ta
  text: 'நிச்சயமாக, பொல்லாதவர்களின் ஒளி அணைந்துபோகும்;

    அவனது நெருப்பின் சுடர்[a] ஒளிவீசாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனது நெருப்பின் பொறி.” எபிரேயச் சொல் சுடரையோ பொறியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: ஆம்
  rationale: இங்கு இந்தச் சொல் வெறும் சேர்க்கைப் பொருளில் அல்லாமல், பில்தாதின் கூற்றை வலியுறுத்தும் துகளாக வருகிறது. இயல்பான நவீனத் தமிழில் ‘ஆம்’ அந்த வலியுறுத்தலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: செழிப்பு அல்லது வாழ்நிலையைக் குறிக்கும் உருவகப் பயன்பாடு இருந்தாலும், எபிரெய மூலத்தின் ஒளி உருவகத்தை விளக்கவுரையாக்காமல் அப்படியே காக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: இது பொல்லாத மனிதர்களை ஒரு பொதுவகுப்பாகக் குறிக்கும் பன்மைச் சொல். ‘பொல்லாதவர்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִדְעָךְ
  choice: அணைந்துபோகும்
  rationale: ஒளி மங்கி இறுதியில் அணைவதை அல்லது அணைக்கப்படுவதை இந்த வினை குறிக்கலாம். வெளிப்படையான செய்பவரைச் சேர்க்காமல், கவிதைப் படிமத்தையும் எதிர்கால/பொதுநியதி நயத்தையும் ‘அணைந்துபோகும்’ காக்கிறது.
- source_word: וְלֹא
  choice: ஒளிவீசாது
  rationale: எபிரெய இணைப்பும் மறுப்பும் தமிழ்க் கவிதை நடையில் இரண்டாம் அடியின் எதிர்மறை வினைமுற்றில் இயல்பாக வெளிப்படுகின்றன; அரைப்புள்ளி இணைப்பைத் தெளிவாக்குகிறது.
- source_word: יִגַּהּ
  choice: ஒளிவீசு
  rationale: ஒளியை வெளிப்படுத்துதல் என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁבִיב
  choice: சுடர்
  rationale: இந்தச் சொல் ‘சுடர்/தீச்சுடர்’ அல்லது ‘பொறி’ எனப் பொருள்படலாம். ‘நெருப்பு’ என்பதோடும் முதல் அடியின் ‘ஒளி’ என்பதோடும் இணைந்து வரும் கவிதை இணைநிலைக்கு ‘சுடர்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִשּׁוֹ
  choice: அவனுடைய நெருப்பு
  rationale: மூலத்தில் ‘நெருப்பு’ என்ற பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி உள்ளது. அதை ‘விளக்கு’ என்று மாற்றாமல் மூலப் படிமத்தையும், பன்மையான ‘பொல்லாதவர்கள்’ என்பதிலிருந்து பிரதிநிதித்துவ ஒருமையான ‘அவன்’ என்பதற்கான மாற்றத்தையும் காக்கிறது.
theological_decisions:
- issue: பொல்லாதவர்களின் முடிவைப் பற்றிய கூற்றின் கால/நியதி நயம்
  choice: ‘அணைந்துபோகும் … ஒளிவீசாது’ என்ற பொதுவான எதிர்கால நயம்
  alternative: ‘அணைக்கப்படுகிறது … ஒளிவீசுவதில்லை’ என்ற நிகழ்காலப் பொதுநியதி
  rationale: எபிரெய வினை வடிவங்கள் நடைபெறவிருக்கும் முடிவாகவும் பொதுவாக நிகழும் நியதியாகவும் வாசிக்கப்படலாம். தமிழ் எதிர்கால வடிவம் தீர்க்கமான கூற்றின் வலிமையைத் தருகிறது; யார் அணைக்கிறார் என்பதைக் குறிப்பிட்டு இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபின் கவிதைநடைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இணையான அடிகளின் ஒளி–நெருப்பு படிமம் பாதுகாக்கப்பட்டுள்ளது; ‘பொல்லாதவர்கள்’ என்ற பன்மையிலிருந்து ‘அவன்’ என்ற பிரதிநிதித்துவ ஒருமைக்கான மூலமொழி மாற்றமும் சீராக்கப்படாமல் வைக்கப்பட்டுள்ளது.
