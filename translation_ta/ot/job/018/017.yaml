  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: ta
  text: அவனைப் பற்றிய நினைவு பூமியிலிருந்து அழிந்துபோகும்[a]; பொது வெளியில் அவனுக்குப் பெயர் இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைப் பற்றிய நினைவு நாட்டிலிருந்து மறைந்துபோகும்; பொதுச் சதுக்கத்தில் அவனுக்குப் பெயர் இருக்காது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹ
  choice: அவனைப் பற்றிய நினைவு
  rationale: זֵכֶר என்பது ஒருவரைப் பற்றிய நினைவு அல்லது நினைவுகூர்தலைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אָבַד
  choice: அழிந்துபோகும்
  rationale: אָבַד அழிதல், இல்லாமற்போதல், மறைந்துபோதல் ஆகிய பொருள்களைக் கொண்டது. இங்கு ஒருவரின் நினைவு முற்றிலும் நீங்குவதை வலுவாக வெளிப்படுத்துகிறது.
- source_word: מִנִּי אָרֶץ
  choice: பூமியிலிருந்து
  rationale: אֶרֶץ என்பதற்கு ‘நாடு’ அல்லது ‘பூமி’ என்று பொருள் கொள்ளலாம். முழுமையான மறைவைச் சித்தரிக்கும் இக்கவிதைச் சூழலில் ‘பூமி’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֹא שֵׁם לוֹ
  choice: அவன் பெயர் நிலைத்திருக்காது
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவனுக்குப் பெயர் இல்லை’ என்றாலும், இங்கு שֵׁם என்பது பொதுமக்களிடையே நீடிக்கும் பெயர், புகழ் அல்லது நினைவைக் குறிக்கிறது. தமிழில் சூழலுக்கேற்ற இயல்பான எதிர்காலக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
- source_word: עַל־פְּנֵי חוּץ
  choice: பொது இடத்தில்
  rationale: חוּץ என்பது வெளியிடம், தெரு அல்லது பொதுச் சதுக்கத்தைக் குறிக்கலாம். עַל־פְּנֵי உடன் சேர்ந்த இச்சொற்றொடர், ஒருவரின் பெயர் அறியப்படும் பொதுவெளியைச் சுட்டுகிறது.
