  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு எபிரெயத்தின் இரண்டு கவிதைச் சொற்றொடர்களையும் நன்றாகப் பிரதிபலிக்கிறது: அவனுடைய வலிமையின் பசிமை/சோர்வு, மற்றும் அருகில் ஆயத்தமாக நிற்கும் பேரிடர். ஆனால் அடிக்குறிப்பில் לְצַלְעוֹ என்பதற்கான மாற்றுப் பொருள் காலவாசகமாக (‘அவன் தடுமாறும்போது’) மாற்றப்பட்டுள்ளது. எபிரெய முன்னொட்டு לְ இங்கு ‘அவனுடைய தடுமாற்றத்திற்காக/தடுமாறுவதற்காக’ என்ற நோக்க அல்லது தொடர்புப் பொருளைத் தக்கவைக்க வேண்டும்.'
