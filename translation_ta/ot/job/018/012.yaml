base_translation:
  language: en
  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: ta
  text: அவனுடைய வலிமை பசியால் வாடுகிறது; பேரழிவு அவனுடைய பக்கத்தில்[a] ஆயத்தமாய் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரழிவு அவனுடைய தடுமாற்றத்திற்காக ஆயத்தமாய் இருக்கிறது.” எபிரெயச் சொல்லை “பக்கம்” என்றும், சிலர் “தடுமாற்றம்/நொண்டுதல்” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: வாடுகிறது
  rationale: கவிதைச் சூழலில் Qal imperfect நிலையை விவரிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது; தமிழில் இயல்பான நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: רָעֵב
  choice: பசியால் வாடுகிறது
  rationale: கடுமையான பசியையும் இழிவுறும் நிலையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹנוֹ
  choice: அவனுடைய வலிமை
  rationale: אוֹן என்பதன் வலிமை, வீரியம், வளம் ஆகிய சாத்தியங்களில், இச்சூழலின் உடல்சார் கவித்துவப் படிமத்துக்கு ‘வலிமை’ நன்கு பொருந்துகிறது.
- source_word: וְאֵיד
  choice: பேரழிவு
  rationale: אֵיד குறிக்கும் அழிவூட்டும் துன்பத்தை உயர்ந்த கவிதை நடையில் தெரிவிக்கிறது.
- source_word: נָכוֹן
  choice: ஆயத்தமாய் இருக்கிறது
  rationale: தயாராக அல்லது நிலைநிறுத்தப்பட்டு இருப்பதைக் குறிக்கும் சொல்லின் இச்சூழல் பொருளைப் பாதுகாக்கிறது.
- source_word: לְצַלְעוֹ
  choice: அவனுடைய பக்கத்தில்
  rationale: צלע என்பதன் ‘பக்கம்/விலா’ என்ற நேரடியான பொருளை முதன்மைப்படுத்தி, அழிவு அருகே காத்திருக்கும் படிமத்தைத் தருகிறது; ‘அவன் தடுமாறும்போது’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
