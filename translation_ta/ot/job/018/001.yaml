  text: וַ֭/יַּעַן בִּלְדַּ֥ד הַ/שֻּׁחִ֗י וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/001.yaml
  text: Then Bildad the Shuhite answered and said:[a]
translation:
  language: ta
  text: 'அப்போது சூகியனான பில்தாத் பதிலளித்துச் சொன்னான்: [a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூகியனான பில்தாத் பதிலளித்துச் சொன்னான்:”
    reason: தொடக்க வாவைத் தமிழில் வெளிப்படையாக ‘அப்போது’ என மொழிபெயர்க்காமல், உரைத் தொடர்ச்சியால் உணர்த்தலாம்.
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்னும் வினை உரையாடல் சூழலில் ‘பதிலளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படுகிறது. அடுத்து வரும் ‘சொன்னது’ என்பதுடன் இயல்பாக இணைவதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בִּלְדַּד
  choice: பில்தாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַשֻּׁחִי
  choice: சூகியனான
  rationale: இது பில்தாத்தின் குல அல்லது புவியியல் சார்பைக் குறிக்கும் அடையாளப்பெயர். שׁוּחַ/שׁוּחִי என்பதன் ஒலியைப் பின்பற்றி ‘சூகியன்’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் வழக்கமான பொருளான ‘சொல்’ பாதுகாக்கப்படுகிறது; எபிரெய மூலத்திலுள்ள ‘மறுமொழி கூறி, சொன்னான்’ என்ற இரட்டை பேச்சு அறிமுக அமைப்பும் தமிழில் இயல்பாகத் தக்கவைக்கப்படுகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் கதைநிகழ்வின் முன்னேற்றத்தைக் குறிக்கிறது. நவீன தமிழில் ‘அப்போது’ தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘மேலும்/அப்பொழுது’ என்பதும் சாத்தியம்.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுப் பயன்பாட்டுத் தமிழுக்கும் இடைப்பட்ட கண்ணியமான நடை. எபிரெய பேச்சு அறிமுகத்தின் இரு வினைகளும் தேவையற்ற கடினத்தன்மையின்றித் தக்கவைக்கப்பட்டுள்ளன.
