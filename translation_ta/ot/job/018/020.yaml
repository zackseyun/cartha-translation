  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: ta
  text: 'அவனுடைய நாளைக் குறித்து[a] பின்னர் வருகிறவர்கள்[b] திகைத்துப்போவார்கள்;

    முன்பு இருந்தவர்களைத் திகில் பற்றிக்கொள்ளும்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அவனுடைய நாள்.’ இது அவனுக்கு வரும் பேரழிவின் அல்லது நியாயத்தீர்ப்பின் நாளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிந்தியவர்கள் … முந்தியவர்கள்.’ சிலர் இந்த இணையை இடவியல் பொருளில், ‘மேற்கில் உள்ளவர்கள் … கிழக்கில் உள்ளவர்கள்’ என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: சொல்லுக்குச் சொல், ‘நடுக்கம் பற்றிக்கொள்ளும்’; திகிலால் ஆட்கொள்ளப்படுவதைக் குறிக்கும் மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: அவனுடைய நாளைக் குறித்து
  rationale: எபிரெயச் சொற்றொடரின் ‘அவனுடைய நாள்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; עַל இங்கு அந்தத் திகைப்பைத் தூண்டும் நிகழ்வையோ பொருளையோ சுட்டுகிறது.
- source_word: נָשַׁמּוּ
  choice: திகைத்துப்போவார்கள்
  rationale: வெறும் வியப்பைவிட வலுவான, அதிர்ச்சியால் நிலைகுலையும் உணர்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֹנִים
  choice: பின்வருவோர்
  rationale: ‘பிந்தியவர்கள்/பின்னர் வருவோர்’ என்ற முதன்மையான காலப்பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: וְקַדְמֹנִים
  choice: முன்னிருந்தோர்
  rationale: אַחֲרֹנִים என்பதற்கு இணையான எதிர்மறை அமைப்பில் ‘முந்தியவர்கள்’ என்ற காலப்பொருளைப் பாதுகாக்கிறது.
- source_word: אָחֲזוּ שָׂעַר
  choice: திகில் பற்றிக்கொள்ளும்
  rationale: ‘நடுக்கம்/திகில் பிடிக்கிறது’ என்ற எபிரெய மொழிவழக்கின் தீவிரத்தையும், אָחֲזוּ என்பதிலுள்ள ‘பற்றுதல்’ உருவகத்தையும் இயல்பாகக் கடத்துகிறது.
theological_decisions:
- issue: ‘அவனுடைய நாள்’ என்பதன் குறிப்பு
  choice: மூலத்தின் தெளிவின்மையை முதன்மை உரையில் ‘அவனுடைய நாள்’ எனப் பாதுகாத்தல்
  alternative: ‘அவனுடைய அழிவின் நாள்’ அல்லது ‘அவனுடைய நியாயத்தீர்ப்பு நாள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் அதைத் தீயவனுக்கு வரும் பேரழிவு அல்லது தீர்ப்பின் நாளாகக் காட்டினாலும், எபிரெய உரை அவற்றில் ஒன்றை வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அவனுடைய நாள்’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது; காலப்பொருளும் இடவியல் மாற்றுப் புரிதலும் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளன.
