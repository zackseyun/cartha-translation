  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: ta
  text: 'அவனுடைய கூடாரத்தில் ஒளி இருண்டுபோகும்;

    அவனுடைய விளக்கு அவனுக்கு மேலே[a] அணைந்துபோகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன்மேல்.’ எபிரெய முன்னிடைச்சொல் ‘மேல்,’ ‘மேலே,’ அல்லது ‘மீது’ என்ற இடப்பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: ஒளி
  rationale: கூடாரத்திற்குள் வெளிச்சம் தரும் ஒளியைச் சுட்டும் பொதுவான, நேரடியான சொல்லாக இருப்பதுடன், கவிதை உருவகத்தையும் காக்கிறது.
- source_word: חָשַׁךְ
  choice: இருண்டுபோகும்
  rationale: இருள் அடையும் மாற்றத்தை வினைச்சொல் குறிக்கிறது; நிலையான ‘இருண்டிருக்கும்’ என்பதைக் காட்டிலும் ‘இருண்டுபோகும்’ அதன் மாற்றநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּאָהֳלוֹ
  choice: அவனுடைய கூடாரத்தில்
  rationale: אָהֶל என்பதன் நேரடியான ‘கூடாரம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; அது ஒருவரின் குடியிருப்பு அல்லது குடும்ப வாழ்வையும் கவிதைநயத்துடன் குறிக்கலாம்.
- source_word: וְנֵרוֹ
  choice: விளக்கு
  rationale: נֵר என்பது பொதுவான ஒளியை மட்டுமல்ல, குறிப்பாக விளக்கையோ அதன் சுடரையோ குறிக்கிறது; முதல் அடியின் ஒளியுடன் உள்ள இணை அமைப்பையும் இது காக்கிறது.
- source_word: עָלָיו
  choice: அவனுக்கு மேலிருக்கும்
  rationale: עַל என்பது ‘மேல்,’ ‘மேலே,’ அல்லது ‘மீது’ என்ற இடப்பொருளைக் கொண்டிருக்கலாம். இங்கு ஒருவனுக்கு மேலே விளக்கு இருப்பதாகக் காட்டும் இயல்பான தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டுள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִדְעָךְ
  choice: அணைந்துபோகும்
  rationale: விளக்கு அல்லது நெருப்பு அணைவதை இந்த வினை குறிக்கிறது. ‘அணைந்துபோகும்’ என்பது நிகழும் மாற்றத்தை இயல்பாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
