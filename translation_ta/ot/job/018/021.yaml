source:
  edition: WLC
  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: ta
  text: நிச்சயமாக, இவையே அநியாயக்காரனின்[a] குடியிருப்புகள்; கடவுளை அறியாதவனின் இடம் இதுவே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீயவனின்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளை அறியாத ஒருவனுக்கு உரிய இடம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: பில்தாதின் உரையை முடிக்கும் இச்சொல் கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட வலியுறுத்தும் பொருளைக் கொண்டுள்ளது.
- source_word: מִשְׁכְּנוֹת
  choice: குடியிருப்புகள்
  rationale: கூடாரங்கள் என்று மிகக் குறிப்பாகக் கூறாமல், ஒருவர் வசிக்கும் இடங்களைப் பொதுவாகவும் இயல்பான நவீன தமிழிலும் குறிக்கிறது.
- source_word: עַוָּל
  choice: அநியாயக்காரன்
  rationale: தீமை என்ற பொதுப்பொருளோடு மட்டுமல்லாமல், அநியாயம் அல்லது தவறு செய்கிறவன் என்ற அறநெறி சார்ந்த நுட்பத்தையும் காக்கிறது.
- source_word: מְקוֹם
  choice: இடம்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைக் காத்து, முந்தைய ‘குடியிருப்புகள்’ என்பதுடன் உள்ள இணை அமைப்பையும் வெளிப்படுத்துகிறது.
- source_word: לֹא יָדַע אֵל
  choice: கடவுளை அறியாத ஒருவன்
  rationale: மறைமுகமாக உள்ள மனிதப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அறிதல்’ என்பதன் உறவு மற்றும் அறநெறி சார்ந்த ஆழத்தை விளக்கவுரையாகச் சுருக்காமல் காக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: யோபு நூலின் இச்சூழலில் இச்சொல் மெய்யான கடவுளைக் குறிக்கிறது; கூடுதல் பட்டப்பெயர் தேவையில்லை.
theological_decisions:
- issue: ‘கடவுளை அறியாதவன்’ என்பதன் பொருள்
  choice: ‘அறிதல்’ என்ற நேரடிச் சொல்லை வைத்திருந்து, கடவுளுடனான உறவு மற்றும் அவரை ஏற்றுக்கொள்ளுதல் சார்ந்த பொருளுக்கு இடமளித்தல்
  alternative: கடவுள் இருப்பதைப் பற்றிய அறிவே இல்லாதவன் என்று வெளிப்படையாகப் பொருளுரைத்தல்
  rationale: ஞான இலக்கியச் சூழலில் ‘கடவுளை அறிதல்’ என்பது வெறும் தகவலறிவைத் தாண்டிய உறவு மற்றும் அறநெறிப் பொருளைக் கொள்ளலாம். மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தீர்மானமான விளக்கவுரையால் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய இணை அமைப்பைப் பேணியபடி, இரண்டாம் கூறின் மறைமுக உடைமைத் தொடர்பு தமிழில் இயல்பாக ‘ஒருவனுக்கு உரிய’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
