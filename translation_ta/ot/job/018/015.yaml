base_translation:
  language: en
  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: ta
  text: அவனுக்குச் சொந்தமல்லாதது அவன் கூடாரத்தில் குடியிருக்கும்[a]; அவன் உறைவிடத்தின்மேல் கந்தகம் தூவப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாக்கிய அமைப்பு கடினமானது. இது, ‘அவனுடையது இனி இல்லாத அவன் கூடாரத்தில் அது குடியிருக்கும்’ எனப் பொருள்படலாம். மேலும், கடைசியில் வரும் ‘கந்தகம்’ என்பதையே ‘குடியிருக்கும்’ என்பதன் எழுவாயாகக் கொண்டு, கந்தகம் அவன் கூடாரத்தில் குடியிருப்பதாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: குடியிருக்கும்
  rationale: שׁכן என்பதன் அடிப்படைப் பொருளான ‘குடியிருத்தல், தங்குதல்’ என்பதைக் காக்கிறது. வினைச்சொல் மூன்றாம் நபர் பெண்பால் ஒருமையில் இருந்தாலும், வெளிப்படையான எழுவாய் இல்லாததால் தமிழில் தெளிவற்ற எழுவாயை இயல்பாக வெளிப்படுத்தும் அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: בְּאָהֳלוֹ
  choice: அவன் கூடாரத்தில்
  rationale: אֹהֶל என்பதன் நேரடியான ‘கூடாரம்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; யோபு நூலின் வீடு மற்றும் குடும்ப வாழ்வு சார்ந்த காட்சிக்கும் இது பொருந்துகிறது.
- source_word: מִבְּלִי לוֹ
  choice: அவனுடையதல்லாத ஒன்று
  rationale: இந்தச் சுருக்கமான எபிரெய சொற்றொடர் அவனுக்குரியது இல்லாமையை அல்லது அவனுக்குச் சொந்தமில்லாத ஓர் இருப்பைச் சுட்டலாம். முதன்மை உரை அந்நியமான ஒன்று அவன் கூடாரத்தை ஆக்கிரமிக்கும் வாசிப்பை அளிக்கிறது; மாற்று இலக்கணச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְזֹרֶה
  choice: தூவப்படும்
  rationale: זרה என்பதன் பியேல் வடிவம் ‘தூவுதல், சிதறவிடுதல்’ என்று பொருள்படும். எபிரெயில் வினை செய்பவர் குறிப்பிடப்படாத பொதுப்பயன்பாடாக இருக்கக்கூடும் என்பதால், தமிழில் செயப்பாட்டு வடிவம் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַל נָוֵהוּ
  choice: அவன் உறைவிடத்தின்மேல்
  rationale: נָוֶה என்பதற்கு உறைவிடம் அல்லது மேய்ச்சலிடம் எனப் பொருள் வரலாம். இணைவரியில் வரும் ‘கூடாரம்’ காரணமாக இங்கு ‘உறைவிடம்’ பொருத்தமானது.
- source_word: גָפְרִית
  choice: கந்தகம்
  rationale: גָפְרִית என்பதற்கான தெளிவான நவீனத் தமிழ் வேதியியல் சொல் ‘கந்தகம்’; அழிவு மற்றும் நியாயத்தீர்ப்பு சார்ந்த காட்சியையும் இது தக்கவைக்கிறது.
theological_decisions:
- issue: தெளிவற்ற பெண்பால் வினையின் எழுவாயும் מִבְּלִי לוֹ என்ற சொற்றொடரின் தொடர்பும்
  choice: அவனுக்குச் சொந்தமில்லாத ஏதோ ஒன்று அவன் கூடாரத்தில் குடியிருப்பதாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: பின்வரும் ‘கந்தகம்’ என்பதையே தாமதமாக வரும் எழுவாயாகக் கொண்டு, இனி அவனுக்குச் சொந்தமில்லாத கூடாரத்தில் கந்தகம் தங்குகிறது என்று வாசிக்கலாம்.
  rationale: எபிரெய இலக்கணம் சுருக்கமாகவும் கடினமாகவும் உள்ளது. முதன்மை வாசிப்பு அந்நிய இருப்பையும் அவனுடைய வீழ்ச்சிக்குப் பிந்தைய உரிமையிழப்பையும் காட்டுகிறது; அடிக்குறிப்பு பெண்பால் வினையுடன் ‘கந்தகம்’ பொருந்தும் மாற்று வாசிப்பை வெளிப்படையாகப் பாதுகாக்கிறது. எந்தக் குறிப்பிட்ட இறையியல் அமைப்பும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவிதைநடையின் கண்ணியத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. ‘கூடாரம்,’ ‘உறைவிடம்,’ ‘கந்தகம்’ ஆகிய திடமான காட்சிச் சொற்கள் பாதுகாக்கப்பட்டன; மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டது.
