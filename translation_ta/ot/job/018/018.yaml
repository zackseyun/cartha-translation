  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: ta
  text: அவர்கள் அவனை ஒளியிலிருந்து இருளுக்குள் தள்ளுவார்கள்[a]; உலகத்திலிருந்து அவனை விரட்டிவிடுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் அவனை ஒளியிலிருந்து இருளுக்குள் துரத்துவார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உலகம்’ என்பதற்கான எபிரெயச் சொல், இன்னும் குறிப்பாக ‘மனிதர்கள் குடியிருக்கும் உலகம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: அவர்கள் அவனை… தள்ளித் துரத்துவார்கள்
  rationale: הדף என்பதன் Qal முற்றுப்பெறா வடிவம், மூன்றாம் நபர் பன்மை எழுவாயையும் மூன்றாம் நபர் ஆண்பால் ஒருமை செயப்படுபொருளையும் கொண்டுள்ளது. வலுக்கட்டாயமாக அகற்றும் பொருளையும், குறிப்பிடப்படாத பன்மை எழுவாயையும் ‘அவர்கள்… தள்ளித் துரத்துவார்கள்’ காக்கிறது.
- source_word: מֵאוֹר
  choice: ஒளியிலிருந்து
  rationale: אוֹר என்பது ‘ஒளி’; מִן முன்னொட்டு பிரிதல் அல்லது வெளியே நகர்தலைக் குறிக்கிறது.
- source_word: אֶל חֹשֶׁךְ
  choice: இருளுக்குள்
  rationale: אֶל இங்கு ஓர் இடநிலைக்குள் செல்லும் திசையை உணர்த்துகிறது; ‘இருளுக்குள்’ என்பது ஒளியிலிருந்து இருளுக்கு நிகழும் நகர்வையும் கவித்துவ எதிர்மறையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמִתֵּבֵל
  choice: உலகத்திலிருந்து
  rationale: תֵּבֵל பொதுவாக உலகத்தை, குறிப்பாக மனிதர்கள் குடியிருக்கும் உலகத்தை, குறிக்கலாம். முதன்மை உரையில் ‘உலகம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது; குறிப்பான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְנִדֻּהוּ
  choice: அவனை விரட்டிவிடுவார்கள்
  rationale: இந்த வினை காரணமாக அகற்றுதல் அல்லது வெளியேற்றுதல் என்ற பொருளைத் தருகிறது. ‘விரட்டிவிடுவார்கள்’ சமூகத்திலிருந்தோ வாழ்விடத்திலிருந்தோ முற்றாக அகற்றும் வலிமையை இயல்பான தமிழில் காட்டுகிறது; முதல் அரையடியின் சொல்லை அப்படியே மீண்டும் கூறுவதையும் தவிர்க்கிறது.
