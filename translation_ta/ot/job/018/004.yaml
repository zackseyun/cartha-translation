source:
  edition: WLC
  text: טֹֽרֵ֥ף נַפְשׁ֗/וֹ בְּ/אַ֫פּ֥/וֹ הַ֭/לְמַעַנְ/ךָ תֵּעָ֣זַב אָ֑רֶץ וְ/יֶעְתַּק צ֝֗וּר מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: ta
  text: தன் கோபத்தில் தன்னையே கிழித்துக்கொள்கிறவனே[a], உனக்காகப் பூமி கைவிடப்படுமா? பாறை அதன் இடத்திலிருந்து பெயர்க்கப்படுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்-சொல்லான மொழிபெயர்ப்பு: “தன் கோபத்தில் தன் உயிரைக் கிழித்துக்கொள்கிறவன்.” எபிரெய மூலத்தில் வசனம் மூன்றாம் நபர் வடிவில் தொடங்கி, பின்னர் “உனக்காக” என்று நேரடி இரண்டாம் நபருக்கு மாறுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: தன்னையே கிழித்துக்கொள்கிறவனே
  rationale: טרף என்பது இரையைப் பிய்த்துக் கிழிப்பதைப் போன்ற வலிமையான சொல்லாகும்; נפשׁ இங்கு உயிர்/தன் என்ற பொருளில் வந்து, கோபத்தால் தன்னையே அழித்துக்கொள்ளும் செயலைக் குறிக்கிறது. விளிப்புமுறை அடுத்துவரும் நேரடி இரண்டாம் நபர் உரையுடன் இயல்பாக இணைகிறது.
- source_word: בְּאַפּוֹ
  choice: தன் கோபத்தில்
  rationale: אף என்பதன் நேர்ப்பொருள் ‘மூக்கு’ என்றாலும், இங்கு வழக்கமான உருவகப் பொருளான கோபம் என்பதே பொருந்துகிறது. எபிரெய மூன்றாம் நபர் வடிவம் அடிக்குறிப்புடன் தக்கவைக்கப்படுகிறது.
- source_word: הַלְמַעַנְךָ
  choice: உனக்காக
  rationale: למען உடன் வரும் இரண்டாம் நபர் ஒருமை, யோபுக்காக உலக ஒழுங்கே மாற்றப்பட வேண்டுமா என்ற வினாவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תֵּעָזַב אָרֶץ
  choice: பூமி கைவிடப்படுமா
  rationale: ארץ இச்சூழலில் ஒரு குறிப்பிட்ட நாட்டைவிட உலகளாவிய ‘பூமி’யைக் குறிக்கிறது; נפעל வடிவின் செயப்பாட்டு நுணுக்கத்தை ‘கைவிடப்படுமா’ காக்கிறது.
- source_word: וְיֶעְתַּק צוּר מִמְּקֹמוֹ
  choice: பாறை தன் இடத்திலிருந்து பெயர்க்கப்படுமா
  rationale: עתק இங்கு ஓர் இடத்திலிருந்து அகற்றுதல் அல்லது நகர்த்துதல் எனப் பொருள்படும். ‘பெயர்க்கப்படுமா’ என்பது பாறையின் நிலைத்தன்மையையும் செயப்பாட்டு இணைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வசனத்தின் தொடக்கத்தில் மூன்றாம் நபரிலிருந்து நேரடி இரண்டாம் நபருக்கு ஏற்படும் மாற்றம்
  choice: தொடக்கத்தை எபிரெய வடிவுக்கு நெருக்கமாக ‘தன்... தன்னையே...கிறவனே’ என்று கொடுத்து, பின்னர் ‘உனக்காக’ எனும் இரண்டாம் நபர் மாற்றத்தைத் தக்கவைத்தல்
  alternative: முழுவதையும் ‘உன் கோபத்தில் உன்னையே கிழித்துக்கொள்கிறவனே’ என்று இரண்டாம் நபரில் ஒருமைப்படுத்துதல்
  rationale: மூலத்தில் participle மற்றும் உருபுகள் மூன்றாம் நபரில் தொடங்கி, לְמַעַנְךָ என்பதில் இரண்டாம் நபர் நேரடி உரைக்கு மாறுகின்றன. தமிழ் விளிப்புமுறை இயல்பை வழங்குவதோடு, அடிக்குறிப்பு இந்த இலக்கணத் திடீர் மாற்றத்தை வெளிப்படையாகச் சுட்டுகிறது; இதனால் உண்மையான மூலமொழி நெருக்கடி மறைக்கப்படவில்லை.
- issue: பூமியும் பாறையும் குறித்த வினாவின் கருத்து
  choice: பில்தாத், யோபின் பொருட்டு நிலையான உலக ஒழுங்கே மாற்றப்படுமா எனக் கண்டிக்கும் சொல்லாட்சியாகப் பதித்தல்
  alternative: ஒரு குறிப்பிட்ட நிலப்பகுதி கைவிடப்பட்டு, குறிப்பிட்ட பாறை நகர்த்தப்படுவது பற்றிய நேரடி கேள்வியாகக் கொள்ளுதல்
  rationale: இரண்டு இணையான வினாக்களும் பழமொழிசார், பிரபஞ்ச அளவிலான மிகைப்படுத்தலாக இயங்குகின்றன. எனினும் மொழிபெயர்ப்பு கூடுதல் கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல் கேள்விகளையே முன்வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமானதாயினும் சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கிழித்துக்கொள்கிறவனே’ மூலத்தின் கடுமையான உருவகத்தைத் தக்கவைக்கிறது; ‘பெயர்க்கப்படுமா’ பாறையை அதன் இடத்திலிருந்து அகற்றும் எண்ணத்தை இயல்பாக வழங்குகிறது.
