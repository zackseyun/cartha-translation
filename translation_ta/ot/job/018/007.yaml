  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: ta
  text: அவனுடைய வலிமைமிக்க அடிகள் கட்டுப்படுத்தப்படும்[a]; அவனுடைய சொந்த ஆலோசனையே அவனை வீழ்த்தும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய வலிமைமிக்க அடிகள் நெருக்கப்படும்’; אוֹן என்பது ‘வலிமை’ அல்லது ‘வீரியம்’ என்பதைக் குறிக்கலாம்; வினைச்சொல்லை ‘நெருக்கப்படும்’ அல்லது ‘கட்டுப்படுத்தப்படும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனுடைய சொந்தத் திட்டமே அவனைத் தூக்கி எறியும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: குறுக்கப்படும்
  rationale: צרר/צר என்பதன் Qal வடிவம், பன்மை எழுவாயான ‘அடிகள்’ கட்டுப்படுத்தப்படுவதையோ குறுகச் செய்யப்படுவதையோ குறிக்கிறது. ‘குறுக்கப்படும்’ என்பது முன்னேறும் வழி தடைப்பட்டு இயக்கம் கட்டுப்படுகிறது என்ற கவித்துவப் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: צַעֲדֵי
  choice: அடிகள்
  rationale: צעד என்பதன் பன்மை இணைப்பு வடிவம்; நடை அடிகள் அல்லது எட்டுகள் என்பதே நேரடியான பொருள். ‘அடிகள்’ கவிதை நடைக்கும் சூழலுக்கும் பொருந்துகிறது.
- source_word: אוֹנוֹ
  choice: அவனுடைய வலிமையான
  rationale: אוֹן என்பதற்கு வலிமை, ஆற்றல், செல்வம் போன்ற பொருள்கள் உண்டு. இங்கு அது ‘அடிகள்’ என்பதோடு இணைந்து அவற்றின் வலிமையையும் வீரியத்தையும் விளக்குவதால், ‘வலிமையான’ எனப் பெயரடையாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: அவனை வீழ்த்தும்
  rationale: שלך என்பதன் Hiphil வடிவம், பெண்பால் ஒருமை எழுவாயான ‘திட்டம்’ அவனை எறிந்து வீழச் செய்வதைக் குறிக்கிறது. அழிவை நோக்கிய விளைவை இயல்பான தமிழில் ‘வீழ்த்தும்’ தெரிவிக்கிறது.
- source_word: עֲצָתוֹ
  choice: அவனுடைய சொந்தத் திட்டமே
  rationale: עֵצָה என்பது ஆலோசனை, திட்டம், யோசனை என்று பொருள்படும். இங்கு தீயவனின் சொந்தத் திட்டமே அவனுக்கு எதிராகத் திரும்பும் முரணை ‘சொந்தத் திட்டமே’ தெளிவாக வெளிப்படுத்துகிறது.
