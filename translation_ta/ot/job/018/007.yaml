translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவப் படிமத்தையும் எபிரெய மூலத்தின் இரு இணை வாக்கிய அமைப்பையும் காத்துள்ளோம். ‘திட்டமே’ என்ற வலியுறுத்தல், அவனுடைய சொந்த ஆலோசனை அவனுக்கு எதிராகத் திரும்பும் முரணை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் உள்ள சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
