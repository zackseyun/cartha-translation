  text: סָ֭בִיב בִּֽעֲתֻ֣/הוּ בַלָּה֑וֹת וֶ/הֱפִיצֻ֥/הוּ לְ/רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: ta
  text: 'பயங்கரங்கள் எல்லாப் பக்கங்களிலும் அவனை அச்சுறுத்துகின்றன;

    அவனுடைய காலடியில்[a] அவனைச் சிதறடிக்கின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய குதிகால்களைத் தொடர்ந்து.” எபிரேயத்தில் நேரடியாக “அவனுடைய காலடியில்” என்று உள்ளது; அவன் எடுத்து வைக்கும் ஒவ்வோர் அடியிலும் பயங்கரங்கள் அவனை விரட்டிச் செலுத்துகின்றன என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: எல்லாத் திசைகளிலிருந்தும் சூழ்ந்திருப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בִּעֲתֻהוּ
  choice: அவனை அச்சுறுத்துகின்றன
  rationale: בעת என்பதன் திடீரெனப் பயமுறுத்தும் பொருளைத் தெளிவாகவும் கவிதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: בַלָּהוֹת
  choice: பயங்கரங்கள்
  rationale: திகிலூட்டும் நிகழ்வுகள் அல்லது அச்சங்கள் என்ற பன்மைப் பொருளைப் பேணுகிறது.
- source_word: וֶהֱפִיצֻהוּ
  choice: அவனைத் துரத்தியடிக்கின்றன
  rationale: இங்கு வரும் causative வினை, பயங்கரங்கள் அவனை நிலைகுலையச் செய்து ஓடவைக்கின்றன என்ற சூழல்சார் பொருளைக் கொண்டுள்ளது; ‘துரத்தியடிக்கின்றன’ என்பது சிதறடித்து விரட்டும் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לְרַגְלָיו
  choice: அவனுடைய காலடியில்
  rationale: ‘அவனுடைய கால்களுக்கு/காலடியில்’ என்ற எபிரேயப் படிமத்தை முதன்மை உரையில் பேணுகிறது; அதன் சாத்தியமான இயக்கப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
