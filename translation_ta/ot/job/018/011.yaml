translation_notes:
  register: நவீனத் தரத் தமிழில், ஞான இலக்கியத்தின் சுருக்கமான கவிதைநடையைப் பேணும் கண்ணியமான மொழிநடை. எபிரேயத்தின் காலடி சார்ந்த தெளிவின்மை அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
