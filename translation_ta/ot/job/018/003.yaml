  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: ta
  text: நாங்கள் ஏன் விலங்குகளைப்போல் கருதப்படுகிறோம், உங்கள் பார்வையில் அசுத்தமானவர்களாக எண்ணப்படுகிறோம்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «அசுத்தமானவர்களாக எண்ணப்படுகிறோம்» என்பதற்கான எபிரெய வினை வடிவம் சிக்கலானது. சிலர் இதை வேறு விதமாகப் புரிந்துகொள்கிறார்கள்; இங்கு, பில்தாத் தங்களைக் தீட்டுள்ளவர்களாக அல்லது அசுத்தமானவர்களாகப் பார்க்கிறார்கள் என்று எதிர்ப்புத் தெரிவிப்பதாகப் பொருள் கொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: பில்தாதின் கண்டனத் தொனியுள்ள வினாவை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: נֶחְשַׁבְנוּ
  choice: மதிக்கப்படுகிறோம்
  rationale: חשׁב என்பதன் இங்குள்ள செயப்பாட்டு மதிப்பீட்டுப் பொருளைத் தருகிறது; பிறர் இவர்களை எவ்வாறு எண்ணுகிறார்கள் என்பதே கருத்து.
- source_word: כַבְּהֵמָה
  choice: மிருகங்களைப்போல்
  rationale: בְּהֵמָה என்பது விலங்கு அல்லது கால்நடை என்பதைக் குறிக்கும் பரந்த சொல்; இங்கு இழிவான ஒப்பீட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִטְמִינוּ
  choice: தீட்டானவர்களாகக் கருதப்படுகிறோம்
  rationale: சிக்கலான இவ்வடிவத்தை தூய்மையின்மை அல்லது தீட்டைக் குறிக்கும் சொல்லிலிருந்து வந்ததாகப் புரிந்துகொண்டு, முந்தைய செயப்பாட்டு வினையுடன் உள்ள இணைப்பையும் காக்கிறது.
- source_word: בְּעֵינֵיכֶם
  choice: உங்கள் பார்வையில்
  rationale: மதிப்பீடு அல்லது எண்ணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: נִטְמִינוּ என்ற சிக்கலான எபிரெய வடிவத்தின் பொருள்
  choice: தீட்டானவர்களாகக் கருதப்படுகிறோம்
  alternative: அறிவில்லாதவர்களாக எண்ணப்படுகிறோம் / மறைக்கப்பட்டவர்களாக இருக்கிறோம்
  rationale: உரைச் சூழலும் நֶחְשַׁבְנוּ உடனான இணை அமைப்பும் தூய்மையின்மை அல்லது தீட்டு சார்ந்த புரிதலை ஆதரிக்கின்றன; எனினும் வடிவத்தின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடிய, கண்ணியமான வினா வடிவம். வசனத்தின் கவிதை இணை அமைப்பும் பில்தாதின் கண்டனத் தொனியும் காக்கப்பட்டுள்ளன.
