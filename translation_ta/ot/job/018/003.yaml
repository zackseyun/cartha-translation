  source_fidelity: முதல் வினைச்சொல்லுக்கான «மதிக்கப்படுகிறோம்» என்பது எபிரெய נֶחְשַׁבְנוּ-வின் ‘கருதப்படுதல்/எண்ணப்படுதல்’ என்ற பொருளுக்குப் பதிலாக ‘மரியாதை பெறுதல்’ என்ற எதிர்மறைப் பொருளைத் தருகிறது. அதைச் சரிசெய்ய வேண்டும். இரண்டாம் உறுப்பில் அசுத்தம்/தீட்டு என்ற புரிதலை அடிக்குறிப்புடன் வைத்திருப்பது சிக்கலான நִטְמִינוּ வடிவத்தின் நிச்சயமின்மையை உரிய வகையில் காக்கிறது.
  naturalness: «விலங்குகளைப்போல் கருதப்படுகிறோம்» மற்றும் «உங்கள் பார்வையில் அசுத்தமானவர்களாக எண்ணப்படுகிறோம்» நவீன நிலையான தமிழில் இயல்பாகவும், இணை வினா அமைப்பில் பில்தாதின் எதிர்ப்புத் தொனியையும் வெளிப்படுத்துவதாகவும் உள்ளன. ஒரே வினாவாக இணைப்பது மூலத்தின் ஒரே கேள்வி அமைப்பைச் சிறப்பாகக் காக்கிறது.
  terminology: «விலங்குகளைப்போல்» என்பது இழிவான ஒப்பீட்டில் בְּהֵמָה-வின் பரந்த ‘விலங்கு/beast’ பொருளைத் தருகிறது. «அசுத்தமானவர்களாக» என்பது இங்கு சடங்கு அல்லது ஒழுக்கக் குற்றத்தைத் தேவையின்றி குறிப்பாக்காமல் ‘unclean/impure’ என்ற பொருளைத் தருகிறது. «கருதப்படுகிறோம்» / «எண்ணப்படுகிறோம்» இரண்டும் மதிப்பீட்டைக் குறிக்கும் சரியான சொற்கள்.
