  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: ta
  text: அவனுடைய கயிறு தரையில் மறைந்திருக்கிறது[a]; அவனுடைய பொறி பாதையில் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வடம் நிலத்தில் மறைந்திருக்கிறது; அவனுடைய கண்ணி பாதையில் உள்ளது.”
    reason: חַבְלוֹ என்பதற்கு “வடம்,” מַלְכֻּדְתּוֹ என்பதற்கு “கண்ணி” என்ற மாற்றுச் சொற்களையும், טָמוּן என்பதன் நிலைசார்ந்த பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: טָמוּן
  choice: மறைத்து வைக்கப்பட்டுள்ளது
  rationale: טמן என்பதன் செயப்பாட்டு நிலைப் பொருளைத் தெளிவாகக் காட்டுகிறது; சூழலில் கண்ணிக்கான கயிறு வேண்டுமென்றே மறைக்கப்பட்டிருப்பதையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בָּאָרֶץ
  choice: தரையில்
  rationale: אֶרֶץ என்பதற்கு நிலம் அல்லது பூமி என்ற பொருள்கள் இருந்தாலும், பொறி வைக்கும் இச்சூழலில் அதன் உடற்பரப்பைக் குறிக்கும் ‘தரையில்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: חַבְלוֹ
  choice: அவனுடைய கயிறு
  rationale: חבל என்பது கயிறு அல்லது வடத்தைக் குறிக்கலாம். இங்கு பொறியுடன் தொடர்புடைய கயிறு எனும் பொதுவான, தெளிவான சொல்லாட்சி பொருத்தமானது.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: அவனுடைய பொறியோ
  rationale: מַלְכֹּדֶת என்பது பொறி அல்லது கண்ணியைக் குறிக்கிறது. ‘பொறி’ சாதாரண வாசகருக்குத் தெளிவான விரிவான சொல்; இணை வாக்கியத்தின் மாறுபாட்டை ‘-ஓ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲלֵי נָתִיב
  choice: பாதையில்
  rationale: நடந்து செல்லும் வழியின்மேல் பொறி அமைந்திருக்கும் காட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை கவிதைநடைக்குரிய கண்ணியத்தைக் காக்கும் மொழிநடை. மறைந்த கயிறு மற்றும் பாதையிலுள்ள பொறி என்ற எபிரெய இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
