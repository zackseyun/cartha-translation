  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: ta
  text: கண்ணி அவனுடைய குதிகாலைப் பற்றிக்கொள்ளும்[a]; சுருக்கு அவனை இறுகப் பிடிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணி அவனைக் குதிகாலில் பிடிக்கும்; ஒரு பொறி அவனை இறுகப் பற்றிக்கொள்ளும்.” கடைசிப் பெயர்ச்சொல் அரிதானது; அது ஒரு குறிப்பிட்ட வகைக் கண்ணியையோ சுருக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: பற்றிக்கொள்ளும்
  rationale: אחז என்பதன் Qal முற்றுப்பெறா வினை வடிவம் ‘பிடித்துக்கொள், பற்றிக்கொள்’ என்ற பொருளைத் தருகிறது; பொறியின் செயலை இயல்பாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: בְּעָקֵב
  choice: அவனுடைய குதிகாலை
  rationale: עָקֵב என்பது ‘குதிகால்’; ב முன்னொட்டு இங்கு பொறி பற்றிக்கொள்ளும் உடற்பகுதியைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் நேரடி செயப்படுபொருளாக மொழிபெயர்ப்பது இயல்பானது.
- source_word: פָּח
  choice: கண்ணி
  rationale: פָּח பொதுவாக விலங்கையோ மனிதனையோ அகப்படுத்தும் பொறி அல்லது கண்ணியைக் குறிக்கிறது. அடுத்த அரிய பெயர்ச்சொல்லிலிருந்து வேறுபடுத்த ‘கண்ணி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַחֲזֵק
  choice: இறுகப் பிடிக்கும்
  rationale: חזק என்பதன் Hiphil வடிவம் இங்கு வலுவாகப் பற்றிக்கொள்வதைக் குறிக்கிறது; ‘இறுகப் பிடிக்கும்’ அதன் தீவிரத்தையும் முதல் அடியுடனான இணைப்பையும் காக்கிறது.
- source_word: עָלָיו
  choice: அவனை
  rationale: על + மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு, இங்கு பிடியின் கட்டுப்பாடு அவன்மேல் செலுத்தப்படுவதைச் சுட்டுகிறது; தமிழில் ‘அவனை ... பிடிக்கும்’ என்பது இயல்பான வடிவம்.
- source_word: צַמִּים
  choice: சுருக்கு
  rationale: இது அரிதான பெயர்ச்சொல்; ஒரு வகையான கண்ணி அல்லது கழுத்து/கால் சுருக்கைக் குறிக்கலாம். ‘சுருக்கு’ அதன் தனிப்பட்ட பொறி வகைச் சாத்தியத்தையும் முதல் அடியின் ‘கண்ணி’யிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
