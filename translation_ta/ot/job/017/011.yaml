  yaml_path: translation/ot/job/017/011.yaml
  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: ta
  text: என் நாட்கள் கடந்துபோயின; என் திட்டங்கள் அறுந்துபோயின—என் இதயத்திற்கு அருமையானவை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயத்தின் உடைமைகள்,” “என் இதயம் போற்றியவை,” அல்லது “என் இதயத்தின் சுதந்தரங்கள்.” இதற்கான எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் தெளிவற்றதுமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: முதலாம் நபர் ஒருமை உரிமைப் பின்னொட்டுடன் உள்ள எபிரெயச் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது; வாழ்நாளின் காலப்போக்கையும் குறிக்கிறது.
- source_word: עָבְרוּ
  choice: கடந்துபோயின
  rationale: עבר என்பதன் Qal perfect பன்மை வடிவம்; நாட்கள் கடந்து முடிந்துவிட்டன என்ற புலம்பல் தொனியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זִמֹּתַי
  choice: என் திட்டங்கள்
  rationale: நோக்கங்கள், எண்ணங்கள், திட்டங்கள் ஆகிய பொருள்களில் இங்கு எதிர்மறையான ‘சூழ்ச்சிகள்’ என்ற நிழற்பொருளைத் தவிர்த்து, யோபு எண்ணியிருந்த காரியங்களைக் குறிக்கிறது.
- source_word: נִתְּקוּ
  choice: அறுந்துபோயின
  rationale: נתק என்பதன் Nifal perfect பன்மை வடிவம்; இழுத்துப் பிரிக்கப்படுதல், துண்டிக்கப்படுதல் என்ற வலிமையைச் சுருக்கமாகத் தருகிறது.
- source_word: מוֹרָשֵׁי
  choice: அருமையானவை
  rationale: இச்சூழலில் அரிதும் பொருள் தெளிவற்றதுமான சொல். ‘உடைமைகள்/சுதந்தரங்கள்’ என்ற அடிப்படைப் படிமத்தையும், இதயம் பற்றிக்கொண்டிருந்த விருப்பமானவற்றையும் தமிழில் இயல்பாக இணைக்கும் தேர்வு; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְבָבִי
  choice: என் இதயத்தின்
  rationale: சிந்தனை, விருப்பம், உள்ளார்ந்த ஏக்கம் ஆகியவற்றின் மையத்தைக் குறிக்கும் எபிரெயப் படிமத்தை ‘இதயம்’ எனப் பாதுகாக்கிறது.
