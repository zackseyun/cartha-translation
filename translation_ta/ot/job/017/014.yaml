base_translation:
  language: en
  yaml_path: translation/ot/job/017/014.yaml
  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: ta
  text: குழியிடம், ‘நீ என் தந்தை’ என்றும், புழுவிடம், ‘என் தாயும் என் சகோதரியும்’ என்றும் அழைக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: குழி
  rationale: இச்சொல் ‘குழி’, குறிப்பாக இறப்பும் கல்லறையும் சார்ந்த அழிவுக் குழி என்ற பொருளைத் தரலாம். உருவகத்தைத் தெளிவுபடுத்தாமல் ‘குழி’ எனவே வைத்துள்ளது.
- source_word: קָרָאתִי
  choice: அழைக்கிறேன்
  rationale: קרא என்பதன் இயல்பான ‘அழை/கூப்பிடு’ பொருளைப் பேணுகிறது; குழியை நெருங்கிய உறவாக அழைக்கும் உருவகத்திற்கும் பொருந்துகிறது.
- source_word: רִמָּה
  choice: புழு
  rationale: அழுகும் உடலோடு தொடர்புடைய புழுவைக் குறிக்கும் பொதுவான, இயல்பான தமிழ்ச் சொல்.
- source_word: אָבִי / אִמִּי / אֲחֹתִי
  choice: என் தந்தை / என் தாய் / என் சகோதரி
  rationale: மூலத்தின் குடும்ப உறவுச் சொற்களையும் இணை அமைப்பையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: שַׁחַת என்பதைக் ‘கல்லறை’, ‘பாதாளம்’, அல்லது ‘குழி’ என்று மொழிபெயர்த்தல்
  choice: குழி
  alternative: கல்லறை
  rationale: மூலச் சொல் தரும் மரணம் மற்றும் அழிவு சார்ந்த படிமத்தைப் பேணுகிறது; அதனை ஒரு குறிப்பிட்ட மறுமைநிலைக் கருத்தாகவோ புதைகுழியாக மட்டுமோ சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, dignified செய்யுள் நடை. எபிரெய உரையின் மனிதராக்கப்பட்ட உருவகமும் ‘தந்தை—தாய்—சகோதரி’ என்ற இணை அமைப்பும் பேணப்பட்டுள்ளன.
