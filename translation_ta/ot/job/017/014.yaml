  source_fidelity: 'மூல எபிரெயத்தின் இணை அமைப்பும் உருவகமும் துல்லியமாகப் பேணப்பட்டுள்ளன: שַׁחַת ‘குழி’ என்றும் רִמָּה ‘புழு’ என்றும், அவற்றைத் தந்தை/தாய்/சகோதரி என அழைக்கும் மனிதராக்கப்பட்ட மொழியும் காக்கப்பட்டுள்ளது. קָרָאתִי என்பதற்கான நிகழ்கால ‘அழைக்கிறேன்’ ஆங்கில POB audit trail-இன் ‘I call’ உடன் ஒத்துப்போகிறது; இச்சூழலில் அது ஏற்றுக்கொள்ளத்தக்கது.'
  naturalness: ‘குழியிடம்’ மற்றும் ‘புழுவிடம்’ என்பவை நவீனத் தரத் தமிழில் இயல்பானவை. மேற்கோளில் இரண்டாம் இடத்தில் ‘நீ’ விடப்பட்டிருப்பது தமிழில் இயல்பான இணைச் சுருக்கமாகும்; பொருள் தெளிவாகவே உள்ளது.
  terminology: ‘குழி’ என்பது שַׁחַת சொல்லின் கல்லறை/அழிவுக் குழி சார்ந்த பரந்த படிமத்தை, ஒரு குறிப்பிட்ட மறுமைக் கோட்பாட்டுக்குள் கட்டுப்படுத்தாமல், நன்றாகக் காக்கிறது. ‘புழு’ மற்றும் உறவுச்சொற்கள் துல்லியமும் பொருத்தமான செய்யுள் பதிவும் உடையவை.
