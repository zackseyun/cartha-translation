source:
  edition: WLC
  text: לְ֭/חֵלֶק יַגִּ֣יד רֵעִ֑ים וְ/עֵינֵ֖י בָנָ֣י/ו תִּכְלֶֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/005.yaml
  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: ta
  text: பங்குக்காக நண்பர்களைக் காட்டிக்கொடுப்பவனின் பிள்ளைகளின் கண்கள் மங்கிப்போகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பங்குக்காக” என்பதற்கு “ஒரு பங்கிற்காக,” “ஆதாயத்திற்காக,” அல்லது வேறொரு விளக்கத்தின்படி “முகஸ்துதியாக” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொற்றொடர் கடினமானது; நண்பர்களைக் தனிப்பட்ட ஆதாயத்திற்காகக் காட்டிக்கொடுப்பதே இதன் கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: பங்குக்காக
  rationale: חֵלֶק என்பதன் அடிப்படைப் பொருள் ‘பங்கு’ அல்லது ‘பாகம்’. இக்கடினமான சூழலில் தனிப்பட்ட ஆதாயத்திற்காகச் செயல்படுவதை இது குறிக்கலாம்; மூலத்தில் இல்லாத ‘கொள்ளைப்பொருள்’ என்பதை முதன்மை உரையில் சேர்க்காமல் நெருக்கமாக மொழிபெயர்க்கப்பட்டது.
- source_word: יַגִּיד רֵעִים
  choice: நண்பர்களைக் காட்டிக்கொடுப்பவன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் ‘அறிவித்தல்’ எனினும், நண்பர்களையும் ஆதாயத்தையும் இணைக்கும் இச்சூழலில் அவர்களுக்கு எதிராகத் தகவல் கூறுதல் அல்லது துரோகம் செய்தல் என்ற எதிர்மறை வலிமை உள்ளது. இயல்பான தமிழில் ‘காட்டிக்கொடுப்பவன்’ அதை வெளிப்படுத்துகிறது.
- source_word: וְעֵינֵי בָנָיו
  choice: அவனின் பிள்ளைகளுடைய கண்கள்
  rationale: בנים என்பது ‘மகன்கள்’ என்றும் விரிவாக ‘பிள்ளைகள்’ என்றும் பொருள்படும். இங்கு பாலினத்தைத் தனியாக வலியுறுத்த வேண்டியதில்லை என்பதால் இயல்பான பொதுப்பொருளான ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִּכְלֶנָה
  choice: மங்கிப்போகும்
  rationale: כלה என்பது முடிவுறுதல், சோர்ந்துபோதல், தேய்ந்துபோதல் என்பவற்றைக் குறிக்கலாம். கண்களை எழுவாயாகக் கொண்டபோது ‘மங்கிப்போகும்’ என்பது உருவகத்தை இயல்பாகக் காக்கிறது; வெறும் உடல் பார்வையிழப்பாக மட்டும் அர்த்தத்தைச் சுருக்கவில்லை.
theological_decisions:
- issue: இரண்டாம் அரையடியின் தொடர்பு
  choice: முதல் அரையடியிலுள்ள செய்பவனின் பிள்ளைகளுக்கு வரும் விளைவாக நேரடியாக வழங்கப்பட்டது.
  alternative: இதை தனியான சாபவாக்காகவோ பொதுப்பழமொழியாகவோ புரிந்துகொள்ளலாம்.
  rationale: எபிரெய உரையில் வெளிப்படையான இணைப்பு விளக்கம் இல்லை. இயல்பான தொடர்ச்சி விளைவைச் சுட்டினாலும், அதன் துல்லிய இயல்பை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. மூலத்தின் சுருக்கத்தையும் கடினத்தன்மையையும் காத்து, ‘கொள்ளைப்பொருளின் பங்கு’ போன்ற விளக்க விரிவாக்கம் முதன்மை உரையில் தவிர்க்கப்பட்டது.
