source:
  edition: WLC
  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: ta
  text: ஆயினும், நீதிமான் தன் வழியைப் உறுதியாகப் பற்றிக்கொள்வான்; தூய கைகளையுடையவன் மேலும் வலிமை பெறுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய கைகளையுடையவன் வலிமையைச் சேர்த்துக்கொள்வான்.” எபிரேயத்தில் சொல்லுக்கு சொல், “வலிமையைச் சேர்க்கிறான்”; இதை “வலிமையில் வளர்கிறான்” என்றும், இன்னும் குறுகிய பொருளில் “துணிவு பெறுகிறான்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: ஆயினும் ... உறுதியாகப் பற்றிக்கொள்வான்
  rationale: וְ என்ற இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்’ எனப் பொருள்பட்டாலும், முந்தைய இருண்ட சூழலுக்குப் பின் இங்கு மென்மையான எதிர்மறைத் திருப்பம் உள்ளது. אחז என்பதன் ‘பற்றிக்கொள்/விடாமல் பிடித்திரு’ என்ற பொருளை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: தனிநபரை வகைமாதிரியாகக் குறிக்கும் பெயரடைப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பாலினத்தை வலியுறுத்துவது நோக்கமல்ல.
- source_word: דַּרְכּוֹ
  choice: தன் வழியை
  rationale: דֶּרֶךְ என்பதன் நேரடி ‘வழி’ உருவகத்தையும் வாழ்க்கை நடை அல்லது போக்கையும் பாதுகாக்கிறது. தமிழில் எழுவாயைத் திரும்பச் சுட்டுவதால் ‘தன்’ இயல்பாக அமைகிறது.
- source_word: וּטֳהָר יָדַיִם
  choice: கைகள் தூய்மையானவன்
  rationale: குற்றமின்மை அல்லது ஒழுக்கத் தூய்மையைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல், அதன் கைகளின் உருவகத்தோடு பாதுகாக்கிறது.
- source_word: יֹסִיף אֹמֶץ
  choice: மேலும் வலிமை பெறுவான்
  rationale: יסף என்பதன் ‘கூட்டு/அதிகரி’ கருத்தையும் אֹמֶץ என்பதன் பரந்த ‘வலிமை, உறுதி, துணிவு’ பொருள் எல்லையையும் இயல்பான தமிழில் தருகிறது. ‘துணிவு’ என்று மட்டும் குறுக்காமல் தொடர்ந்த வளர்ச்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நீதிமானின் நிலைத்திருத்தலும் தூய கைகளுடையவனின் வலிமை அதிகரிப்பதும்
  choice: இதை பொதுவான ஞானவாக்கியமாக, நேரடிக் காரணத்தையோ தெய்வீக வெகுமதியின் முறையையோ சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: இதனை நீதிமானுக்கான உறுதியான தெய்வீக வெகுமதி வாக்குறுதியாக விரிவுபடுத்துதல்
  rationale: எபிரெய உரை நிலைத்திருத்தலையும் அதிகரிக்கும் வலிமையையும் மட்டும் கூறுகிறது; அவற்றின் இறையியல் செயல்முறையை விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழி’ மற்றும் ‘கைகள் தூய்மையானவன்’ என்ற மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘மேலும் வலிமை பெறுவான்’ என்பது சொல்லுக்கு சொல் அமைப்பின் கடினத்தன்மையைத் தவிர்த்து மூலத்தின் பொருள் பரப்பைத் தக்கவைக்கிறது.
