  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: ta
  text: ஆனால், நீங்கள் எல்லாரும்[a] திரும்புங்கள்; இப்போது வாருங்கள். உங்களில் ஞானமுள்ள ஒருவனையும் நான் காணமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரும்பி வாருங்கள்; வாருங்கள்.” எபிரெயத்தில் இது வலியுறுத்தலான அழைப்பு; யோபின் நண்பர்கள் மீண்டும் தங்கள் வாதங்களை முன்வைக்கும்படி அவர்களைச் சவால் விடுப்பதாகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் வலுவான முரண்பாட்டைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: כֻּלָּם
  choice: நீங்கள் எல்லாரும்
  rationale: தொடரும் வினைச்சொற்கள் இரண்டாம் நபர் ஆண்பால் பன்மையில் இருப்பதால், யோபு தன் உரையாடல் தோழர்களை நேரடியாக அழைப்பதை வெளிப்படுத்துகிறது.
- source_word: תָּשֻׁבוּ
  choice: திரும்பி வாருங்கள்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், இங்கு மீண்டும் வந்து வாதிடுமாறு விடுக்கப்படும் சவால் போன்ற அழைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּבֹאוּ נָא
  choice: வாருங்கள்
  rationale: בוא உடன் வரும் נָא வலியுறுத்திய அழைப்பை உருவாக்குகிறது. தமிழின் மரியாதைப் பன்மை ஏவல் வடிவம் சூழலுக்கு ஏற்ற கண்ணியத்தையும் வலிமையையும் தருகிறது; ‘தயவுசெய்து’ என்பது அளவுக்கு மீறிய பணிவைச் சேர்க்கும்.
- source_word: וְלֹא אֶמְצָא
  choice: நான் காணமாட்டேன்
  rationale: அழைப்புக்குப் பின்வரும் விளைவு அல்லது எதிர்காலத் தன்மையை எபிரெய வினை வடிவத்துக்கு ஏற்ப காக்கிறது; ‘காண முடியாது’ என்று திறனின்மையைச் சேர்ப்பதில்லை.
- source_word: בָכֶם
  choice: உங்களில்
  rationale: அழைக்கப்படுகிற குழுவினரிடையே அல்லது அவர்களுக்குள் என்ற இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: חָכָם
  choice: ஞானமுள்ள ஒருவனையும்
  rationale: ஆண்பால் ஒருமை பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்பட்டு, யோபின் ஆண் தோழர்களில் ஒருவனைக் குறிக்கிறது. எதிர்மறை வாக்கியத்தில் ‘ஒருவனையும்’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: חָכָם என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஞானமுள்ள ஒருவனையும்
  alternative: ஞானமுள்ள எவரையும்
  rationale: மூலச்சொல் இலக்கணப்படி ஆண்பால் ஒருமை; உடனடி சூழலில் யோபின் ஆண் தோழர்களே குறிக்கப்படுகின்றனர். ஆகவே பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பைத் தக்கவைத்துள்ளது.
- issue: தோழர்களிடம் விடுக்கப்படும் அழைப்பின் தொனி
  choice: திரும்பி வாருங்கள்; வாருங்கள்
  alternative: மீண்டும் வந்து பாருங்கள்
  rationale: மூலத்தில் உள்ள இரு தனித்த வினைச்சொற்களையும் வலியுறுத்திய அழைப்பையும் காக்கிறது; ‘வந்து பாருங்கள்’ என்று மூலத்தில் இல்லாத வினையைச் சேர்க்கவில்லை. இது அழைப்பாகவும் சவாலாகவும் வாசிக்கப்படக்கூடிய பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாய் இருந்தாலும் கண்ணியமான நேரடி உரை. மூலத்தின் மீளுரைத்த அழைப்பை நீக்காமல், அரைப்புள்ளி மூலம் அதன் வலியுறுத்தலைத் தெளிவாக்குகிறது.
