  text: וְֽ֭/הִצִּגַ/נִי לִ/מְשֹׁ֣ל עַמִּ֑ים וְ/תֹ֖פֶת לְ/פָנִ֣ים אֶֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: ta
  text: அவர் என்னைப் பல மக்களிடையே பழிச்சொல்லாக ஆக்கினார்[a]; நான் முகத்துக்கு நேரே துப்பப்படுகிறவனாகிவிட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் என்னைப் பல மக்களிடையே ஒரு பழமொழியாக ஆக்கினார்.” இங்குள்ள எபிரெயச் சொல், இகழ்ச்சிக்குரிய பழமொழிப் பொருளாக அல்லது எடுத்துக்காட்டாக ஆக்கப்படுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “நான் முகங்களுக்கு முன்பாகத் துப்புதலாக ஆனேன்”; அதாவது, வெளிப்படையாகத் துப்பி இகழப்படுகிறவனாக ஆனேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: அவர் என்னை … வைத்தார்
  rationale: ஹிஃபில் வினை வடிவின் காரணவினைப் பொருளையும், யோபு பொதுவாக இழிவுக்குரிய நிலையில் நிறுத்தப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִמְשֹׁל
  choice: பழிச்சொல்லாக
  rationale: இங்கு மָשָׁל சார்ந்த சொல் வெறும் ‘பழமொழி’ அல்ல; மக்கள் இகழ்ச்சியாக எடுத்துச் சொல்லும் நபர் அல்லது எடுத்துக்காட்டைக் குறிக்கிறது. ‘பழிச்சொல்’ அதன் பழமொழிபோன்ற பரவலையும் இகழ்ச்சித் தன்மையையும் இணைக்கிறது.
- source_word: עַמִּים
  choice: மக்களினங்களிடையே
  rationale: எபிரெயச் சொல்லின் பன்மையைத் தக்கவைத்து, பல மக்கள் கூட்டங்களிடையே ஏற்பட்ட பொதுவான அவமானத்தை இயல்பான தமிழில் கூறுகிறது.
- source_word: וְתֹפֶת
  choice: துப்பப்படும் ஒருவனாக
  rationale: அரிய பெயர்ச்சொல் துப்புதல் அல்லது துப்புதலுக்குரிய பொருள் என்ற இழிவுப் படிமத்தைக் கொண்டுள்ளது. தமிழில் புரியுமாறு செயல்முறை வடிவில் தரப்பட்டுள்ளது.
- source_word: לְפָנִים
  choice: முகத்துக்கு நேரே
  rationale: சொல்லெழுத்தாக ‘முகங்களுக்கு முன்’ என்ற அமைப்பு, மறைவின்றி முகத்துக்கு எதிரே காட்டப்படும் வெளிப்படையான அவமதிப்பைக் குறிக்கிறது.
- source_word: אֶהְיֶה
  choice: ஆனேன்
  rationale: வடிவில் நிறைவுறா வினையாக இருந்தாலும், முன் நிகழ்ந்த செயலால் ஏற்பட்டுள்ள தற்போதைய அவமான நிலையை கவிதைச் சூழலில் ‘ஆனேன்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மறைந்துள்ள வினை எழுவாய்
  choice: ‘அவர்’ என்று ஆண்பால் ஒருமையில் தக்கவைக்கப்பட்டது; சூழலில் இது தேவனைக் குறிக்கிறது.
  alternative: ‘தேவன்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய மூலத்தில் பெயர் நேரடியாக இல்லை. சூழல் சுட்டுதலைத் தக்கவைத்து, மூலத்தில் இல்லாத பெயரை வசனத்துக்குள் சேர்க்காமல் இருப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பழிச்சொல்’ பொதுவெளியில் பரவும் இகழ்ச்சியைக் காட்டுகிறது; ‘முகத்துக்கு நேரே துப்பப்படும்’ என்பது மூலத்தின் உடல் சார்ந்த அவமானப் படிமத்தை மறைக்காமல் தெளிவாக்குகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
