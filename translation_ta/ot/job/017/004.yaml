  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய உள்ளத்தைப் புரிந்துணர்விலிருந்து நீர் மறைத்து வைத்திருக்கிறீர்[a]; ஆகையால் அவர்களை உயர்த்தமாட்டீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உள்ளம்’ என்பதற்கு ‘மனம்’ அல்லது ‘அகமான ஆளுமை’ என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் ‘இதயம்’ என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனைக்கும் பகுத்துணர்வுக்கும் உரிய மையத்தையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவர்களை மேலே உயர்த்தமாட்டீர்’; சூழலின்படி ‘அவர்கள் வெற்றிபெற விடமாட்டீர்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஆகையால் என்பதற்கான காரணத்தை நேரடியாகத் தொடங்கும் தனிச்சொல் தமிழில் விடுக்கப்பட்டுள்ளது
  rationale: எபிரெய வசனம் முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனி வசனமாக இயல்பாக வாசிக்க, முதல் கூறே காரணமாகவும் இரண்டாம் கூறு ‘ஆகையால்’ என அதன் விளைவாகவும் அமைக்கப்பட்டுள்ளது.
- source_word: לִבָּם
  choice: அவர்களுடைய உள்ளத்தை
  rationale: எபிரெய ‘இதயம்’ என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, மனவுறுதி, பகுத்துணர்வு ஆகியவற்றின் அகமையத்தையும் குறிக்கலாம். ‘உள்ளம்’ அந்த விரிவைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: צָפַנְתָּ
  choice: நீர் மறைத்து வைத்திருக்கிறீர்
  rationale: צפן என்பதன் ‘மறைத்தல்/ஒளித்து வைத்தல்’ என்ற பொருளையும், நிறைவேறிய செயலின் தொடரும் நிலையையும் இந்த வடிவம் வெளிப்படுத்துகிறது; இரண்டாம் நபர் ஒருமை மரியாதை வடிவம் இறைவனை நோக்கிய உரையைத் தக்கவைக்கிறது.
- source_word: מִשָּׂכֶל
  choice: புரிந்துணர்விலிருந்து
  rationale: מן பிரிவைக் குறிக்கிறது; שׂכל இங்கு அறிவார்ந்த புரிதல் அல்லது விவேகத்தைக் குறிக்கிறது. ‘புரிந்துணர்வு’ சாதாரண வாசகருக்கு இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முதல் கூறிலிருந்து வரும் முடிவைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: לֹא תְרֹמֵם
  choice: அவர்களை உயர்த்தமாட்டீர்
  rationale: רום வேரின் உயர்த்துதல்/மேன்மைப்படுத்துதல் என்ற உருவகத்தைத் தக்கவைக்கிறது. தமிழில் வினையின் செயப்படுபொருளைத் தெளிவாக்க ‘அவர்களை’ சேர்க்கப்பட்டுள்ளது; அது முந்தைய பன்மைச் சுட்டுடன் பொருந்துகிறது.
theological_decisions:
- issue: ‘அவர்களுடைய/அவர்களை’ என்ற பன்மைச் சுட்டின் குறிப்பு
  choice: குறிப்பிட்ட குழுவை விளக்கிச் சேர்க்காமல் பன்மைப் பெயர்ச்சுட்டுகளாகவே தக்கவைத்தல்
  alternative: யோபின் எதிரிகள் அல்லது அவர்களுடன் சேர்ந்தவர்கள் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இரண்டாம் நபர் வினைகள் இறைவனை நோக்கிய உரையையும், மூன்றாம் நபர் பன்மை வேறொரு குழுவையும் காட்டுகின்றன. ஆனால் அந்தக் குழுவை இவ்வசனம் தனியாக அடையாளப்படுத்தாததால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
- issue: இறைவன் புரிந்துணர்வை மறைப்பதாகக் கூறும் நேரடி செயற்பாடு
  choice: ‘நீர் மறைத்து வைத்திருக்கிறீர்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அவர்கள் புரிந்துகொள்ளவில்லை’ என்று மனிதர்களின் நிலையாக மட்டும் மென்மைப்படுத்துதல்
  rationale: மூலத்தில் இறைவனே எழுவாயாக உள்ள இறையியல் பதற்றத்தை மறைக்காமல் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், இறைவனை நோக்கிய மரியாதை ஒருமை வடிவமான ‘நீர்/இருக்கிறீர்/மாட்டீர்’ பயன்படுத்தப்பட்டுள்ளது. கவிதைத் தன்மையையும் எபிரெய உருவகத்தையும் காக்கும் வகையில் ‘உள்ளம்’, ‘மறைத்து வைத்திருக்கிறீர்’, ‘உயர்த்தமாட்டீர்’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
