  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: ta
  text: நிச்சயமாக, ஏளனம் செய்பவர்கள்[a] என்னுடன் இருக்கிறார்கள்; அவர்களுடைய ஆத்திரமூட்டும் நடத்தையின்மேல் என் கண் தங்கியிருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏமாற்றுபவர்கள்’; எபிரெயச் சொல் ஏமாற்றுகிறவர்களையோ ஏளனம் செய்கிறவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடர் கடினமானது. ‘அவர்களுடைய கலகத்தின்மேல் என் கண் நிலைத்திருக்கிறது’ அல்லது ‘அவர்களுடைய கசப்பான நடத்தையின்மேல் என் கண் நிலைத்திருக்கிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
