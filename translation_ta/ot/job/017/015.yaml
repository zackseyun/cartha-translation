base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: ta
  text: அப்படியானால், என் நம்பிக்கை எங்கே? என் நம்பிக்கையை யார் காண்பார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நம்பிக்கையை யாரால் காண முடியும்?” எபிரெய வினைச்சொல்லுக்கு “காண்” அல்லது “உற்றுப்பார்” என்று பொருள் கொள்ளலாம்; அதன் வடிவத்தை எளிய எதிர்காலமாகவோ இயலுமையைக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: எங்கே
  rationale: אַיֵּה என்பது இடத்தைப் பற்றிய ‘எங்கே?’ என்ற வினா. முன்னுள்ள புலம்பலுடன் உள்ள தொடர்ச்சியை அடுத்துள்ள ‘அப்படியானால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵפוֹ
  choice: அப்படியானால்
  rationale: אֵפוֹ வினாவுக்கு வலியுறுத்தல் அல்லது அனுமானத் தொடர்பைச் சேர்க்கிறது; நவீன தமிழில் ‘அப்படியானால்’ இரண்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: תִקְוָתִי
  choice: என் நம்பிக்கை
  rationale: תִּקְוָה என்பது நம்பிக்கை அல்லது எதிர்பார்ப்பைக் குறிக்கும்; யோபுவின் புலம்பல் சூழலில் ‘நம்பிக்கை’ இயல்பானதும் பொருத்தமானதும்.
- source_word: וְתִקְוָתִי
  choice: என் நம்பிக்கையை
  rationale: எபிரெய மூலத்தில் பெயர்ச்சொல் மீண்டும் வருவதால் உண்டாகும் வலியுறுத்தலையும் கவிதைத் தாக்கத்தையும் காக்க, தமிழிலும் ‘என் நம்பிக்கை’ மீண்டும் வழங்கப்படுகிறது.
- source_word: מִי
  choice: யார்
  rationale: இரண்டாம் வினாவைத் தொடங்கும் வழக்கமான மனிதரைச் சுட்டும் வினாப்பெயர்.
- source_word: יְשׁוּרֶנָּה
  choice: காண்பார்
  rationale: שׁור என்பது ‘பார், உற்றுப்பார், காண்’ எனப் பொருள்படும். வினைமுற்றை எதிர்கால வினாவாக மொழிபெயர்த்துள்ளோம்; பெண்பால் ஒருமை பின்னொட்டு ‘நம்பிக்கை’ என்பதைக் குறிக்கிறது.
theological_decisions:
- issue: יְשׁוּרֶנָּה என்பதன் எதிர்கால அல்லது இயலுமை நுணுக்கம்
  choice: யார் காண்பார்?
  alternative: யாரால் காண முடியும்?
  rationale: எபிரெய imperfect வடிவம் எளிய எதிர்காலமாகவும் இயலுமையைக் குறிக்கும் வினாவாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை எதிர்கால நுணுக்கத்தை வைத்திருக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை. மூலத்தின் ‘என் நம்பிக்கை’ என்ற மறுபதிப்பு பாதுகாக்கப்பட்டுள்ளது; வினையின் உண்மையான கால/இயலுமைத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
