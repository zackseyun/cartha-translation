source:
  edition: WLC
  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: ta
  text: என் ஆவி நொறுக்கப்பட்டுவிட்டது[a]; என் நாட்கள் அணைந்துவிட்டன[b]; கல்லறைகள் எனக்கே காத்திருக்கின்றன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உயிர்மூச்சு நொறுக்கப்பட்டுவிட்டது.” எபிரெயச் சொல் ‘ஆவி’ அல்லது ‘மூச்சு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் நாட்கள் அணைந்துபோயின.” இவ்வினை நெருப்போ விளக்கோ அணைக்கப்படும் படிமத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, “கல்லறைகள் எனக்கு இருக்கின்றன.”
    reason: literal_rendering
lexical_decisions:
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: רוּחַ என்பதற்கு ‘ஆவி’, ‘மூச்சு’, ‘காற்று’ ஆகிய பொருள்கள் உண்டு. யோபுவின் புலம்பலில் அவரது உள்ளார்ந்த உயிர்நிலை முறிந்திருப்பதை ‘என் ஆவி’ இயல்பாக வெளிப்படுத்துகிறது; ‘என் உயிர்மூச்சு’ என்ற உடல்சார்ந்த சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: חֻבָּלָה
  choice: சிதைந்துவிட்டது
  rationale: இந்தச் செயலற்ற வினைவடிவம் கடுமையாகக் கெடுக்கப்பட்ட அல்லது அழிக்கப்பட்ட நிலையைக் குறிக்கிறது. ‘சிதைந்துவிட்டது’ என்பது புலம்பலின் தீவிரத்தைக் காத்து, சேதத்தின் துல்லிய இயல்பை தேவையின்றி நிர்ணயிக்காது.
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: யோபுவுக்கு எஞ்சியுள்ள வாழ்நாளைக் குறிக்கும் எளிய உடைமைப் பன்மை.
- source_word: נִזְעָכוּ
  choice: அணைந்துவிட்டன
  rationale: வினை அணைக்கப்படுதல் அல்லது அவிந்துபோதல் என்ற படிமத்தைக் கொண்டுள்ளது. வாழ்நாட்கள் ஒரு தீபம் அல்லது நெருப்பைப் போல அணைவதைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: קְבָרִים
  choice: கல்லறைகள்
  rationale: எபிரெய உரையின் பன்மை ஒருமையாக மாற்றப்படாமல் காக்கப்படுகிறது; இது யோபுவின் முன்னே புதைகுழிகளைத் தவிர வேறொன்றும் இல்லை என்ற தீவிர உணர்வையும் தரலாம்.
- source_word: לִי
  choice: எனக்காகக் காத்திருக்கின்றன
  rationale: இதன் நேரடிப் பொருள் ‘எனக்கு/எனக்காக’ என்பதாகும். இச்சூழலில் கல்லறைகளே யோபுவுக்கு முன்னால் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்த ‘காத்திருக்கின்றன’ பயன்படுத்தப்படுகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: רוּחִי என்பது உள்ளார்ந்த ஆவியையா உயிர்மூச்சையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘என் ஆவி’
  alternative: ‘என் உயிர்மூச்சு’
  rationale: இரு பொருள்களும் எபிரெயச் சொல்லில் சாத்தியம். சூழலின் புலம்பல் தொனி ‘ஆவி’ என்பதற்கு ஆதரவளித்தாலும், இறந்துகொண்டிருக்கும் உடலின் மூச்சைக் குறிக்கும் வாசிப்பும் நீக்கப்படவில்லை; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான புலம்பல் நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று குறும் கூறுகளின் இணை அமைப்பும் எபிரெய உரையின் தீவிரமும் காக்கப்பட்டுள்ளன; ‘ஆவி/உயிர்மூச்சு’ என்ற உண்மையான இருபொருள் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
