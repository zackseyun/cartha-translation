source:
  edition: WLC
  text: לַ֭יְלָה לְ/י֣וֹם יָשִׂ֑ימוּ א֝֗וֹר קָר֥וֹב מִ/פְּנֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: ta
  text: அவர்கள் இரவைப் பகலாக மாற்றுகிறார்கள்; இருளின் முன்னிலையில், ‘வெளிச்சம் அருகில் இருக்கிறது’ என்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: மாற்றுகிறார்கள்
  rationale: அடிப்படைப் பொருள் ‘வைக்கிறார்கள்/ஆக்குகிறார்கள்’; இரவைப் பகலாகக் காட்டும் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אוֹר
  choice: வெளிச்சம்
  rationale: ‘ஒளி’ என்ற பொருளை அன்றாடமும் கண்ணியமுமான தமிழில் தருகிறது.
- source_word: קָרוֹב
  choice: அருகில் இருக்கிறது
  rationale: இடம் அல்லது காலம் குறித்த மூலத்தின் சாத்தியமான இருபொருளையும் தீர்மானிக்காமல் காக்கிறது.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: இருளின் முன்னிலையில்
  rationale: ‘இருளுக்கு முன்பாக/இருள் இருந்தபோதும்’ என்ற செறிவான மூலக் கட்டமைப்பை அதிகமாக விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘வெளிச்சம் அருகில்’ என்பது யாருடைய நேரடி கூற்று என்பது மூலத்தில் வெளிப்படையாகக் குறிக்கப்படவில்லை
  choice: ‘என்கிறார்கள்’ என்று பொருளடிப்படையில் வெளிப்படுத்தி, மேற்கோளாக அமைத்தல்
  alternative: ‘வெளிச்சம் இருளின் முன்னிலையில் அருகில் இருக்கிறது’ என்று இணைப்புச் சொல்லின்றி மொழிபெயர்த்தல்
  rationale: முந்தைய பன்மை வினையின் எழுவாயே இதையும் கூறுகிறது என்ற கவிதைச் சூழலைத் தெளிவாக்குகிறது; புதிய இறையியல் அடையாளம் எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; யோபின் கவிதைநடைக்கேற்ற கண்ணியமான மொழி. மூலத்தின் இருள்–வெளிச்சம் முரணும் ‘அருகில்’ என்பதின் கால/இடத் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
