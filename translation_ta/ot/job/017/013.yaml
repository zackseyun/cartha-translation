theological_decisions:
- issue: שְׁאוֹל என்பதை விளக்கவுரையாக மொழிபெயர்க்க வேண்டுமா
  choice: பாதாளம்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: இவ்வசனம் யோபு மரணத்தையும் இறந்தோரின் இருப்பிடத்தையும் எதிர்நோக்குவதைப் பேசுகிறது. ‘பாதாளம்’ என்ற சொல் கருத்தின் பரப்பைத் தக்கவைக்கிறது; ‘கல்லறை’ என்பது புதைக்கும் இடமாக மட்டும் பொருளைக் குறுக்கக்கூடும். அதேவேளை, பின்னாளைய குறிப்பிட்ட நரகக் கோட்பாட்டை வசனத்தில் புகுத்தாமல் விளக்கக் குறிப்பு தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. இணையான இரு நிபந்தனைத் தொடர்களும் மூலத்தின் அமைப்பைப் பின்பற்றுகின்றன. ‘பாதாளம்’ மரியாதைமிக்க வேதாகமப் பயன்பாட்டைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொருள் வரம்பை விளக்குகிறது.
