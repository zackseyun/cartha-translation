source:
  edition: WLC
  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: ta
  text: தயவுசெய்து, எனக்காக நீரே உம்முடன் உத்தரவாதம் அளியும்[a]; என் கையில் கை கொடுப்பவன் வேறு யார்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காக நீரே உம்முடன் பிணையாக இரும்.” எபிரெயத்தில் பிணை அல்லது உத்தரவாதம் வழங்குவதற்குரிய சட்ட மொழி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “என் கையில் கை கொடுப்பவன் யார்?” இது பிணை அல்லது உத்தரவாத ஒப்பந்தத்தில் இணைவதைக் குறிக்கும் சைகைச்சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: தயவுசெய்து ... கொடும்
  rationale: שִׂימָה என்ற கட்டளையுடன் வரும் נָּא வேண்டுகோளின் பணிவை வெளிப்படுத்துகிறது; நவீன மரியாதை நடையில் ‘தயவுசெய்து’ என்றும், இறைவனை நோக்கிய ஒருமை மரியாதை வினையாக ‘கொடும்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: עָרְבֵנִי
  choice: எனக்காக ... பிணை கொடும்
  rationale: ערב இங்கு ஒருவருக்காக உத்தரவாதம் அல்லது பிணை அளிக்கும் சட்டப் பொருளில் வருகிறது. ‘பிணை கொடும்’ என்பது அந்தச் சட்ட உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עִמָּךְ
  choice: நீரே உம்மிடம்
  rationale: பிணையை அளிக்குமாறு வேண்டப்படுபவரும் அது வைக்கப்படும் தரப்பும் தேவனே என்ற வியப்பூட்டும் பதற்றத்தை ‘நீரே உம்மிடம்’ தெளிவாகவும் மிகை விளக்கமின்றியும் காக்கிறது.
- source_word: מִי הוּא
  choice: வேறு யார்?
  rationale: வேறு எந்த உத்தரவாதியும் இல்லை என்பதைக் குறிக்கும் சொல்லாட்சிக் கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வேறு’ என்பது சூழலில் உள்ள எதிர்மறை ஒப்பீட்டை வெளிப்படையாக்குகிறது.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: என்னோடு கைகொடுத்துப் பிணை நிற்பவன்
  rationale: கைகொடுத்து ஒப்பந்தம் அல்லது உத்தரவாதத்தை உறுதிப்படுத்தும் எபிரெயச் சட்ட மரபை ‘கைகொடுத்து’ காக்கிறது; ‘பிணை நிற்பவன்’ அதன் பொருளை வாசகருக்குத் தெளிவாக்குகிறது.
theological_decisions:
- issue: தேவனை நோக்கிய சட்ட உருவகம்
  choice: யோபு, தனக்காகத் தேவனே தம்மிடம் பிணை அளிக்க வேண்டுமெனக் கேட்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: யோபு ஒரு பொதுவான உத்தரவாதியை மட்டும் கேட்கிறார்; தேவன் இரு தரப்புகளிலும் இருப்பதாகக் கருத வேண்டியதில்லை.
  rationale: עָרְבֵנִי עִמָּךְ என்ற சொற்றொடரும் தொடர்ந்து வரும் ‘வேறு யார்?’ என்ற கேள்வியும் தேவனே பிணை நிற்க வேண்டும் என்ற வாசிப்பை வலுப்படுத்துகின்றன. அதன் இறையியல் பதற்றத்தைத் தீர்க்காமல் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கி ‘நீர்/உம்’ மரியாதை ஒருமை கையாளப்பட்டுள்ளது. ‘பிணை’, ‘கைகொடுத்தல்’ ஆகிய சொற்கள் சட்ட உருவகத்தையும் பழங்கால உடல் அசைவையும் காக்கின்றன; அடிக்குறிப்புகள் மாற்று வாசிப்பையும் பண்பாட்டு பின்னணியையும் விளக்குகின்றன.
