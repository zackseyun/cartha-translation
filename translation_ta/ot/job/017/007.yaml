  yaml_path: translation/ot/job/017/007.yaml
  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: ta
  text: துயரத்தால் என் கண் மங்கிப்போயிற்று[a]; என் உடலுறுப்புகள் அனைத்தும் நிழலைப்போல் உள்ளன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோபத்தால்,” “மனக்கலக்கத்தால்,” அல்லது “எரிச்சலால்.” எபிரெயச் சொல் பலவகையான உணர்ச்சிக் கொந்தளிப்பைக் குறிக்கலாம்; இங்குள்ள புலம்பல் மற்றும் வேதனைச் சூழலால் “துயரத்தால்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “என் உடலுறுப்புகள்” என்பதற்கு “என் உடல்வடிவம்” அல்லது “என் தோற்றக்கூறுகள்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல்லின் துல்லியமான குறிப்பு உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: மங்கிப்போயிற்று
  rationale: כהה என்ற வினை மங்குதல் அல்லது வலுவிழத்தலைக் குறிக்கிறது. இங்கு கண்பார்வை மங்கிய விளைவு நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִכַּעַשׂ
  choice: துயரத்தால்
  rationale: כעס என்பது கோபம், மனக்கலக்கம், எரிச்சல், துயரம் ஆகிய உணர்வுகளைக் குறிக்கலாம். யோபுவின் புலம்பல் மற்றும் வேதனைச் சூழலில் ‘துயரம்’ பொருத்தமாக உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரெய உரை ஒருமையில் உள்ளது. தமிழிலும் ‘என் கண் மங்கியது’ என்பது பார்வையைக் குறிக்கும் இயல்பான கவிதை வழக்காகும்.
- source_word: וִיצֻרַי
  choice: என் உருவங்கள்
  rationale: יצר என்பதிலிருந்து வந்த இச்சொல் யோபுவின் உடல் வடிவங்கள், உறுப்புகள் அல்லது தோற்றக்கூறுகள் அனைத்தையும் குறிக்கக்கூடும். மூலத்தின் பன்மையையும் தெளிவின்மையையும் ‘உருவங்கள்’ ஓரளவு காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כַּצֵּל
  choice: நிழலைப்போல்
  rationale: மூலத்தின் கவிதை உவமையை நேரடியாகவும் இயல்பாகவும் காக்கிறது; அது மெலிவு, நிலையின்மை அல்லது சாரமின்மையை உணர்த்தலாம்.
- source_word: כֻּלָּם
  choice: அனைத்தும்
  rationale: முன்னுள்ள பன்மைப் பெயர்ச்சொல்லின் முழுத் தொகுதியையும் சுருக்கமாகக் குறிக்கிறது.
