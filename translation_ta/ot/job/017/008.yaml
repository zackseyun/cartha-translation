  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: ta
  text: 'நேர்மையானவர்கள் இதைக் கண்டு திகைக்கிறார்கள்;

    குற்றமற்றவன் இறையச்சமற்றவனுக்கு[a] எதிராகத் தன்னைத் தூண்டிக்கொள்கிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாசாங்குக்காரன்.’ எபிரெயச் சொல் இறைமையற்ற அல்லது இறையச்சமற்ற ஒருவரைக் குறிக்கலாம்; சில சூழல்களிலும் மரபுவழி மொழிபெயர்ப்புகளிலும் அது ‘பாசாங்குக்காரன்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: திகைத்துப்போகிறார்கள்
  rationale: שׁמם என்பதன் இச்சூழலிலுள்ள அதிர்ச்சியும் திகைப்பும் கலந்த உணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְשָׁרִים
  choice: நேர்மையானவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியை ஒரு ஒழுக்க வகையாகத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל זֹאת
  choice: இதனால்
  rationale: அவர்களுடைய திகைப்புக்கான காரணம் அல்லது சந்தர்ப்பத்தை עַל இங்கு குறிக்கிறது.
- source_word: נָקִי
  choice: குற்றமற்றவன்
  rationale: குற்றத்திலிருந்து விடுபட்டவன் என்ற ஒழுக்கப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: חָנֵף
  choice: இறைப்பற்றற்றவன்
  rationale: இச்சொல் வெறும் பாசாங்கை மட்டும் அல்லாமல் இறைமறுப்பான அல்லது பக்தியற்ற ஒருவரையும் குறிக்கக்கூடியதால், அதன் விரிவான ஒழுக்க-சமயப் பொருளை இது காக்கிறது.
- source_word: יִתְעֹרָר
  choice: தன்னைத் தூண்டிக்கொண்டு எழுகிறான்
  rationale: Hitpolel வடிவிலுள்ள தன்முகச் செயற்பாட்டையும், செயல்படும்படி தன்னையே எழுப்பிக்கொள்ளும் கருத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַל חָנֵף
  choice: இறைப்பற்றற்றவனுக்கு எதிராக
  rationale: எழுச்சியைக் குறிக்கும் வினையோடு עַל எதிர்ப்பின் திசையைக் காட்டுகிறது.
theological_decisions:
- issue: חָנֵף என்பதன் மொழிபெயர்ப்பு
  choice: இறைப்பற்றற்றவன்
  alternative: பாசாங்குக்காரன்
  rationale: வசனம் நேர்மையானவர்/குற்றமற்றவர் என்பவர்களை இறைப்பற்றற்றவருடன் எதிரெதிராக நிறுத்துகிறது. தேர்ந்த சொல், பாசாங்கு என்ற குறுகிய உளநோக்குப் பொருளைத் திணிக்காமல் எபிரெயச் சொல்லின் விரிவான சமய-ஒழுக்கப் பொருளைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநடையின் இணை அமைப்பைக் காக்கும் வகையில் இரண்டு அடிகளாக வடிவமைக்கப்பட்டது. சொற்கள் கண்ணியமானவையாகவும் பொதுவாசகருக்கு எளிதில் புரியத்தக்கவையாகவும் உள்ளன.
