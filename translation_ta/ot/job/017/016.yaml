  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: ta
  text: 'அவை பாதாளத்தின் தாழ்ப்பாள்களுக்குள் இறங்குமா?[a]

    நாம் ஒன்றாகத் தூசிக்குள் இறங்குவோமா?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதாளத்தின் பகுதிகள்’ அல்லது ‘பாதாளத்தின் கதவுத் தாழ்ப்பாள்கள்’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயப் படிமம் இறந்தோரின் உலகின் அடைத்துவைக்கும் வாயில்களை நினைவூட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நாம் ஒன்றாகத் தூசியின்மேல் இளைப்பாறுவோமா?’ என்றும் புரிந்துகொள்ளலாம். இறுதியில் வரும் எபிரெயச் சொல் ‘இறங்குதல்’ எனவோ, சிலரால் ‘இளைப்பாறுதல்’ எனவோ எடுத்துக்கொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: தாழ்ப்பாள்கள்
  rationale: பாதாளத்தின் அடைத்துவைக்கும் வாயில்கள் அல்லது கட்டுப்படுத்தும் எல்லைகள் என்ற கவித்துவப் படிமத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘பகுதிகள்’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁאֹל
  choice: பாதாளம்
  rationale: எபிரெய வேதாகமத்தில் இறந்தோரின் உலகைக் குறிக்கும் சொல்லின் பரந்த பொருளைத் தமிழில் வழக்கமான வேதாகமச் சொல்லாகிய ‘பாதாளம்’ தக்கவைக்கிறது; இதை வெறும் தனிப்பட்ட கல்லறையாகக் குறுக்கவில்லை.
- source_word: תֵּרַדְנָה
  choice: அவைகள் ... இறங்குமா?
  rationale: பெண்பால் பன்மை வினைமுற்று முந்தைய சூழலில் உள்ள யோபுவின் நம்பிக்கைகளைச் சுட்டுவதாகத் தெரிகிறது. உரையாடலின் வினாத்தன்மையைத் தக்கவைத்து கேள்வியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִם
  choice: '... இறங்குவோமா?'
  rationale: இங்கு வழக்கமான ‘என்றால்’ என்பதைவிட வினாத்தன்மையை அறிமுகப்படுத்தும் இடைச்சொல்லாகப் புரிந்துகொள்வது சூழலுக்கும் கவிதை இணைப்புக்கும் பொருந்துகிறது.
- source_word: יַחַד
  choice: ஒன்றாக
  rationale: பேசுபவரும் அவரது நம்பிக்கைகளும் மரணத்தில் ஒரே இடத்திற்குச் செல்வதைச் சுட்டும் கூட்டுப்பொருளை நேரடியாகத் தருகிறது.
- source_word: עַל עָפָר
  choice: தூசிக்குள்
  rationale: எழுத்துப்படி ‘தூசியின்மேல்’ என்றாலும், இறங்குதல் மற்றும் மரணம் பற்றிய சூழலில் இலக்கைச் சுட்டும் இயல்பான தமிழாக ‘தூசிக்குள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נָחַת
  choice: இறங்குவோமா
  rationale: முந்தைய ‘இறங்குமா’ என்பதுடன் உள்ள கவிதை இணைநிலையைத் தக்கவைக்க ‘இறங்குதல்’ என எடுத்துக்கொள்ளப்பட்டுள்ளது. ‘இளைப்பாறுதல்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் பொருள்
  choice: பாதாளம்
  alternative: கல்லறை / இறந்தோரின் உலகம்
  rationale: இச்சொல்லை தனிப்பட்ட கல்லறை என்று மட்டும் தீர்மானிக்காமல், இறந்தோரின் உலகம் என்ற எபிரெயக் கருத்தின் பரப்பையும் கவித்துவத் தெளிவின்மையையும் தக்கவைக்கிறது.
