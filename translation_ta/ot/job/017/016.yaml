  register: நவீன நிலையான தமிழில், கவித்துவமும் கண்ணியமும் கொண்ட வினா வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘பாதாளம்’ என்பது வாசகர்களுக்குப் பழக்கமான வேதாகமச் சொல்; ‘தாழ்ப்பாள்கள்’ சிறையடைக்கும் படிமத்தைத் தெளிவாக வைத்திருக்கிறது. மூலத்தின் எண்ணிக்கை வேறுபாட்டின்படி முதல் அடியில் ‘அவைகள்’, இரண்டாம் அடியில் ‘நாம்’ என்பவை பாதுகாக்கப்பட்டுள்ளன.
