  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: ta
  text: 'ஏனெனில், அவன் கடவுளுக்கு எதிராகத் தன் கையை நீட்டி,[a]

    சர்வவல்லவருக்கு எதிராகத் தன்னை வலிமைமிக்கவனாகக் காட்டுகிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவன் கடவுளை நோக்கித் தன் கையை நீட்டி, சர்வவல்லவருக்கு எதிராகத் தன்னை வலுப்படுத்திக்கொள்கிறான்.”'
    reason: אֶל என்பதன் ‘நோக்கி’ என்ற நேரடிப் பொருளையும் יִתְגַּבָּר என்பதன் ‘தன்னை வலுப்படுத்திக்கொள்’ என்ற மாற்றுப் பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள உரையில் பொல்லாதவனுக்கு வரும் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; காரணப் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: נָטָה
  choice: நீட்டி
  rationale: ‘நீட்டு/விரி’ என்ற எபிரேய உருவகத்தைப் பாதுகாக்கிறது; ‘கை’ என்பதுடன் இச்சூழலில் எதிர்ப்பான செயலைக் குறிக்கிறது.
- source_word: אֶל
  choice: எதிராக
  rationale: அடிப்படைப் பொருள் ‘நோக்கி’ என்றாலும், கடவுளை எதிர்க்கும் இச்சூழலில் ‘எதிராக’ என்பது நோக்கத்தைத் தெளிவாகச் சொல்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: பொதுவான தெய்வீகப் பட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது; அடுத்த அரையடியில் வரும் שַׁדַּי என்பதிலிருந்து வேறுபாட்டையும் இணைநிலையையும் காக்கிறது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எழுவாயையே சுட்டும் உடைமை தமிழில் ‘தன்’ என்று இயல்பாக அமைகிறது; எபிரேய ஒருமையும் கைநீட்டும் உருவகமும் காக்கப்படுகின்றன.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் பொருள்பெயர்க்கிறது; நவீன வேதாகமத் தமிழில் புரிந்துகொள்ளத்தக்க மரியாதையான வடிவம்.
- source_word: יִתְגַּבָּר
  choice: தன்னை வலிமைமிக்கவனாகக் காட்டுகிறான்
  rationale: התפעל வடிவிலுள்ள தன்முனைப்பையும், சர்வவல்லவருக்கு எதிராகத் தன்னை வலியவனாக முன்வைக்கும் முரணையும் காக்கிறது; ‘எதிர்த்து வலுப்படுத்திக்கொள்கிறான்’ என்பது சாத்தியமான நேரடி மாற்று.
theological_decisions:
- issue: கவிதை இணைநிலையில் வரும் தெய்வீகப் பட்டங்கள்
  choice: אֵל என்பதை ‘கடவுள்’ என்றும் שַׁדַּי என்பதை ‘சர்வவல்லவர்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘ஏல்’ / ‘ஷத்தாய்’ என்று ஒலிபெயர்த்தல்
  rationale: இவை இங்கு பெயர்களைவிட தெய்வீகப் பட்டங்களாகச் செயல்படுகின்றன. இரண்டையும் தனித்தனி பொருளுள்ள தமிழ்ச் சொற்களால் வழங்குவது எபிரேய இணைநிலையைச் சுருக்காமல் காக்கிறது.
- issue: אֶל என்பதன் திசைப் பொருளும் பகைமைப் பொருளும்
  choice: முதன்மை உரையில் ‘எதிராக’
  alternative: ‘நோக்கி’
  rationale: சூழல் வெளிப்படையாகக் கடவுளுக்கு எதிரான அகந்தையான எதிர்ப்பைப் பற்றியது. இருப்பினும் எபிரேய முன்னிடைச்சொல்லின் நேரடி திசைப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதையும் கொண்ட நடை. ‘தன் கையை நீட்டி’ என்ற எபிரேய உருவகம் காக்கப்பட்டுள்ளது. ‘சர்வவல்லவர்’ பொதுவாகப் புரியும் தெய்வீகப் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
