source:
  edition: WLC
  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: ta
  text: அவர்கள் துன்பத்தைக் கருவாகக் கொண்டு, தீமையைப் பெற்றெடுக்கிறார்கள்[a]; அவர்களுடைய கருப்பை வஞ்சனையை ஆயத்தப்படுத்துகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் துன்பத்தைக் கருவில் சுமந்து, அக்கிரமத்தைப் பெற்றெடுக்கிறார்கள்.”
    reason: עָמָל என்பதற்கான ‘துன்பம்’ என்ற பொருளையும், אָוֶן என்பதற்கான ‘அக்கிரமம்’ என்ற மாற்றுப் பொருளையும், கர்ப்ப உருவகத்தின் மாற்று இயல்பான வெளிப்பாட்டையும் காட்டுகிறது.
lexical_decisions:
- source_word: הָרֹה
  choice: கருவுற்று
  rationale: הרה என்பதன் Qal வடிவம் கர்ப்பமாதல் அல்லது கருவுறுதல் என்ற உருவகத்தைத் தருகிறது; அடுத்து வரும் பெற்றெடுத்தல் என்ற பிறப்பு உருவகத்துடன் இயல்பாக இணைகிறது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: ஞான இலக்கியச் சூழலில் עָמָל உழைப்பை மட்டும் அல்லாமல் துன்பம், கேடு, தீங்கான முயற்சி ஆகியவற்றையும் குறிக்கலாம்; இங்கு அறநெறிசார் குற்றச்சாட்டுக்கு ஏற்ற பொதுவான சொல் ‘துன்பம்’.
- source_word: וְיָלֹד
  choice: பெற்றெடுக்கிறார்கள்
  rationale: ילד பிறப்பைக் குறிக்கும் வினை; தமிழில் பிறப்பு உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: אָוֶן அக்கிரமம், தீமை, கேடு எனப் பொருள்படலாம்; வஞ்சனையுடன் அமைந்த இணைப்பில் ‘தீமை’ அதன் அறநெறிசார் வலிமையை இயல்பாகத் தருகிறது.
- source_word: וּבִטְנָם
  choice: அவர்களுடைய கருப்பை
  rationale: בטן வயிறு அல்லது கருப்பை எனப் பொருள்படும்; வசனத்தின் கருவுறுதல்–பிறப்பு உருவகத்தைத் தொடர ‘கருப்பை’ பொருத்தமானது. எபிரெயில் பெயர்ச்சொல் ஒருமையாகவும் பின்னொட்டு பன்மையாகவும் உள்ளது.
- source_word: תָּכִין
  choice: உருவாக்குகிறது
  rationale: כון என்பதன் Hiphil வடிவம் ஆயத்தப்படுத்துதல், நிலைநிறுத்துதல், உருவாக்குதல் ஆகிய அர்த்தங்களைத் தரலாம்; கருப்பையில் ஒன்று உருவாகும் உருவகத்தில் ‘உருவாக்குகிறது’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: מִרְמָה
  choice: வஞ்சனை
  rationale: מִרְמָה ஏமாற்றம், வஞ்சனை, துரோகம் ஆகியவற்றைக் குறிக்கும்; ‘வஞ்சனை’ சுருக்கமாகவும் அறநெறிசார் பொருளுடனும் உள்ளது.
theological_decisions:
- issue: மறைமுக எழுவாயின் எண் மற்றும் பால்
  choice: அவர்கள் ... அவர்களுடைய கருப்பை
  alternative: அவன் ... அவனுடைய கருப்பை; ஒருவன் ... அவனுடைய கருப்பை
  rationale: முதல் எபிரெய வடிவம் ஒருமையாக இருந்தாலும், ‘அவர்களுடைய கருப்பை’ என்பதில் மூன்றாம் நபர் ஆண்பால் பன்மைப் பின்னொட்டு உள்ளது; மேலும் சூழல் பொல்லாதவர்களை ஒரு வகுப்பாக விவரிக்கிறது. ஆகவே தமிழில் பன்மை எழுவாய் பிரதிநிதித்துவப் பொருளை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதை உருவகத்தை வெளிப்படையாகக் காக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கருப்பை’ என்ற ஒருமைச் சொல் எபிரெய மூலத்தின் கூட்டுப் பயன்பாட்டைப் பிரதிபலிக்கிறது.
