reference: Job 15:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: ta
  text: இதோ, தம் பரிசுத்தமானவர்களிடம்கூட[a] அவர் நம்பிக்கை வைப்பதில்லை; வானங்களும் அவரது பார்வையில் தூய்மையானவை அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அவருடைய பரிசுத்தமானவர்கள்’ என்று உள்ளது. இங்கு இது விண்ணுலகப் பரிசுத்த உயிர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கூற்றின்மீது வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் உரையாடல் வலிமையை, இயல்பானதும் கண்ணியமானதுமான தமிழில் தருகிறது.
- source_word: בִּקְדֹשָׁיו
  choice: தமது பரிசுத்தர்களிடத்தில்
  rationale: சொல்லின் நேரடிப் பொருளான ‘அவருடைய பரிசுத்தமானவர்கள்’ என்பதைக் காக்கிறது; மனிதர்களா விண்ணுலக உயிர்களா என்பதை முதன்மை உரையில் மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: לֹא יַאֲמִין
  choice: அவர் நம்பிக்கை வைப்பதில்லை
  rationale: אמן என்பதன் இங்குள்ள பொருளான ஒருவர்மீது நம்பிக்கை அல்லது உறுதி வைப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְשָׁמַיִם
  choice: வானங்களும்
  rationale: எபிரெய மொழியின் பன்மை வடிவத்தைக் காத்து, முதல் அடியிலுள்ள பரிசுத்தர்களுடனான கவிதை இணைப்பையும் காட்டுகிறது.
- source_word: לֹא זַכּוּ
  choice: தூய்மையானவை அல்ல
  rationale: இந்தச் சூழலில் நீதிமன்றத் தீர்ப்புக்குரிய குற்றமின்மையைவிட தூய்மை அல்லது சுத்தம் என்ற கருத்தே பொருத்தமானது.
- source_word: בְּעֵינָיו
  choice: அவரது பார்வையில்
  rationale: ‘அவருடைய கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ‘அவருடைய பரிசுத்தர்கள்’ என்போர் யார்?
  choice: முதன்மை உரையில் பொதுவான ‘பரிசுத்தர்கள்’ என்ற சொல்லை வைத்துக்கொண்டு, அடிக்குறிப்பில் விண்ணுலக உயிர்கள் என்பதே இங்கு சாத்தியம் எனக் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே ‘பரிசுத்த தூதர்கள்’ அல்லது ‘விண்ணுலக உயிர்கள்’ எனத் தெளிவுபடுத்துதல்
  rationale: ‘வானங்கள்’ என்ற இணைவரி விண்ணுலக உயிர்களைக் குறிப்பதாக வலுவாகச் சுட்டினாலும், எபிரெய சொல் தானாகவே ‘தூதர்கள்’ என்று குறிப்பாகச் சொல்லவில்லை. எனவே மூலத்தின் பரந்த சொல்லாட்சியும் அதன் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியத்தைத் தக்கவைத்தபடி சாதாரண வாசகர்களுக்குப் புரியும் நடை. ‘கூட’ என்பது முதல் அரையடியின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் அது தனிச் சொல்லாக இல்லை.
