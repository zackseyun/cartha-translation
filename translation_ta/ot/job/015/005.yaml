  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: ta
  text: ஏனெனில் உன் அக்கிரமம்[a] உன் வாய்க்குப் போதிக்கிறது; சூழ்ச்சியாளர்களின் நாவை[b] நீ தேர்ந்தெடுக்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் குற்றம்”; எபிரெயச் சொல் சூழலுக்கேற்ப அக்கிரமம், குற்றம் அல்லது குற்றத்திற்கான தண்டனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தந்திரக்காரர்களின் நாவை” அல்லது “சூழ்ச்சியானவர்களின் பேச்சுமுறையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய குற்றச்சாட்டிற்கான காரணத்தை எலிப்பாஸ் இங்கு முன்வைப்பதால், வாதத்தின் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: יְאַלֵּף
  choice: கற்றுக்கொடுக்கிறது
  rationale: பியேல் வடிவின் ‘கற்பி, பயிற்றுவி’ என்ற பொருளையும், அக்கிரமம் யோபின் வாய்க்குக் கற்பிப்பதாக வரும் உருவகப்படுத்தலையும் காக்கிறது.
- source_word: עֲוֺנְךָ
  choice: உன் அக்கிரமம்
  rationale: இச்சூழலில் பேச்சை உருவாக்கும் ஒழுக்கக்கேட்டைச் சுட்டுகிறது; ‘குற்றவுணர்வு’ என்று உளவியல் பொருளுக்கு மட்டுப்படுத்தாமல் நெறிசார் வலிமையைப் பேணுகிறது.
- source_word: פִיךָ
  choice: உன் வாய்
  rationale: எபிரெயக் கவிதையின் பேச்சுறுப்பு உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: וְתִבְחַר
  choice: நீ தேர்ந்தெடுக்கிறாய்
  rationale: בחר என்பதன் நேரடியான ‘தேர்ந்தெடு’ என்ற பொருளையும், இரண்டாம் நபருக்கு எதிரான குற்றச்சாட்டையும் காக்கிறது.
- source_word: לְשׁוֹן
  choice: நாவை
  rationale: முதல் அடியிலுள்ள ‘வாய்’ என்பதுடன் இணையும் கவிதை உருவகத்தைப் பேணுகிறது; இங்கு பேச்சுமுறையையும் குறிக்கிறது.
- source_word: עֲרוּמִים
  choice: தந்திரக்காரர்களின்
  rationale: עָרוּם என்பது சூழலுக்கேற்ப விவேகத்தையோ சூழ்ச்சியையோ குறிக்கலாம்; எலிப்பாஸின் எதிர்மறைக் குற்றச்சாட்டில் சூழ்ச்சியானவர்களைக் குறிக்கும் சொல் பொருத்தமானது.
theological_decisions:
- issue: עָוֹן என்ற சொல்லின் ஒழுக்க மற்றும் குற்றநிலை நுணுக்கம்
  choice: ‘அக்கிரமம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘குற்றம்’ அல்லது ‘பாவம்’
  rationale: யோபின் பேச்சுக்கு மூலமாக இருப்பது அவனுடைய ஒழுக்கப் பிறழ்வே என்று எலிப்பாஸ் குற்றஞ்சாட்டுகிறான். ‘அக்கிரமம்’ அந்த வலுவான நெறிசார் பொருளைக் காக்கிறது; அதேவேளையில் பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வாய்—நாவு’ என்ற எபிரெயக் கவிதை இணையும், அக்கிரமம் கற்பிப்பதாக வரும் உருவகப்படுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
