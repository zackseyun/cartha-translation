  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: ta
  text: அவன் இருளிலிருந்து திரும்பி வருவான் என்று எதிர்பார்ப்பதில்லை; அவன் வாளுக்கெனக் குறிக்கப்பட்டிருக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை வாள் எதிர்நோக்குகிறது,” “அவன் வாளுக்கென நியமிக்கப்பட்டிருக்கிறான்,” அல்லது “அவன் வாளால் எதிர்பார்க்கப்படுகிறான்.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது; இவ்வரி வரவிருக்கும் வன்முறைத் தீர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: நம்புவதில்லை
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு எதிர்கால விளைவு குறித்த நம்பிக்கை அல்லது எதிர்பார்ப்பைக் குறிக்கிறது; தமிழில் ‘திரும்பிவருவான் என்று நம்புவதில்லை’ என்பது இயல்பாகவும் மூலத்தின் சொல்லாட்சிக்கு நெருக்கமாகவும் உள்ளது.
- source_word: שׁוּב
  choice: திரும்பிவருவான்
  rationale: இருளிலிருந்து மீண்டும் வெளிவருதல் அல்லது தப்பிவருதல் என்ற இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִנִּי חֹשֶׁךְ
  choice: இருளிலிருந்து
  rationale: מן முன்னொட்டின் ‘இலிருந்து’ என்ற பொருளையும், חֹשֶׁךְ என்பதன் நேரடியான ‘இருள்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: வாளோ அவனுக்காகக் காத்திருக்கிறது
  rationale: சிக்கலான וְצָפוּ வடிவத்தை צפה, ‘காத்திரு/எதிர்நோக்கு’ என்ற பொருளில் கொண்டு, வாளை இயல்பான எழுவாயாக வாசிக்கிறது; אֱלֵי காட்டும் தொடர்பை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָרֶב
  choice: வாள்
  rationale: வன்முறையான மரணம் அல்லது தீர்ப்பைக் குறிக்கும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே வைத்திருக்கிறது.
theological_decisions:
- issue: இறுதி உட்கூற்றில் வாளுக்கும் மனிதனுக்கும் உள்ள உறவு
  choice: வாள் அவனுக்காகக் காத்திருக்கிறது
  alternative: அவன் வாளுக்கென்று குறிக்கப்பட்டிருக்கிறான் / வாளுக்கென நியமிக்கப்பட்டிருக்கிறான்
  rationale: எபிரெய வினை வடிவமும் தொடரமைப்பும் கடினமானவை. ‘காத்திருக்கிறது’ என்பது צפה என்பதன் வழக்கமான சொற்பொருளைக் காத்து, வரவிருக்கும் வன்முறைத் தீர்ப்பை உணர்த்துகிறது; நியமனம் பற்றிய உறுதியான இறையியல் கருத்தை தேவையின்றி சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவித்துவமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இருள்’ மற்றும் ‘வாள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘வாளோ’ என்ற எதிர்நிலைத் துகள் இரண்டாம் உட்கூற்றின் அச்சுறுத்தலை இயல்பாக வலியுறுத்துகிறது.
