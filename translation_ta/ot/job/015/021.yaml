base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: ta
  text: திகில்களின் ஒலி அவன் காதுகளில் கேட்கிறது; அவன் செழிப்புடன் இருக்கும்போதே[a] அழிப்பவன் அவன்மேல் வருகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அமைதியாக இருக்கும்போது” அல்லது “அவன் பாதுகாப்பாக இருக்கும்போது.” எபிரெயச் சொல் அமைதி, நலநிலை, பாதுகாப்பு அல்லது செழிப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: ஒலி
  rationale: இங்கு கோல் என்பது பேசப்படும் ‘குரல்’ என்பதைக் காட்டிலும் காதில் கேட்கும் ஒலியைக் குறிக்கிறது.
- source_word: פְּחָדִים
  choice: திகில்கள்
  rationale: எபிரெயப் பன்மையைப் பாதுகாத்து, வெறும் உள்ளார்ந்த பய உணர்வை விட அச்சுறுத்தும் பயங்கரங்களை இது வெளிப்படுத்துகிறது.
- source_word: בְּאָזְנָיו
  choice: அவன் காதுகளில் கேட்கிறது
  rationale: ‘அவன் காதுகளில்’ என்ற மூலமொழியின் தெளிவான உருவகத்தைப் பேணிக்கொண்டு, தமிழில் இயல்பாக அமைய ‘கேட்கிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּשָּׁלוֹם
  choice: அவன் செழிப்புடன் இருக்கும்போதே
  rationale: שָׁלוֹם என்பது அமைதி, நலநிலை, பாதுகாப்பு அல்லது செழிப்பு எனப் பொருள்படலாம். திடீரென அழிவு வருவதைக் காட்டும் இச்சூழலில் ‘செழிப்புடன் இருக்கும்போது’ பொருத்தமானது; ‘-போதே’ எதிர்பாராத நேரத்தில் வருவதை இயல்பாக வலியுறுத்துகிறது.
- source_word: שׁוֹדֵד
  choice: அழிப்பவன்
  rationale: இச்சொல் சூறையாடி அழிவை ஏற்படுத்துபவனைக் குறிக்கிறது. ‘அழிப்பவன்’ என்பது பரந்த பொருளையும் அச்சுறுத்தும் தன்மையையும் எளிய நவீன தமிழில் தருகிறது.
- source_word: יְבוֹאֶנּוּ
  choice: அவன்மேல் வருகிறான்
  rationale: வினையோடு இணைந்த மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டை வெளிப்படுத்தி, பகைமையான வருகையை மிகைப்படுத்தாமல் காட்டுகிறது; எபிரெயக் கவிதையின் நிகழ்கால நடையும் பேணப்படுகிறது.
