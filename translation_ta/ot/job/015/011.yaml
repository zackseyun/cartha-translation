  register: நவீன நிலையான தமிழில், யோபை ஒருமையில் நேரடியாக அழைக்கும் எபிரெய வடிவத்துக்கு ஏற்ப ‘உனக்கு/உன்னிடம்’ பயன்படுத்தப்பட்டுள்ளது. சொல்லாட்சிக் கேள்வியின் கூர்மையும், இரண்டாவது கூறின் சுருக்கமான இணை அமைப்பும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
