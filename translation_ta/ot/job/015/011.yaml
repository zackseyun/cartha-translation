  text: הַ/מְעַ֣ט מִ֭מְּ/ךָ תַּנְחֻמ֣וֹת אֵ֑ל וְ֝/דָבָ֗ר לָ/אַ֥ט עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: ta
  text: கடவுளின் ஆறுதல்கள் உனக்குப் போதாதவையா[a]? உன்னிடம் மென்மையாகச் சொல்லப்படும் ஒரு வார்த்தையும் போதாததா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கடவுளின் ஆறுதல்கள் உனக்கு அற்பமானவையா? உன்னிடம் மென்மையாகச் சொல்லப்படும் ஒரு வார்த்தையும் அற்பமானதா?”'
    reason: מְעַט என்பதை ‘மிகக் குறைவு/போதாமை’ என்றும், ‘சிறிய அல்லது அற்பமானது’ என்றும் இச்சூழலில் மொழிபெயர்க்கலாம்; இரண்டாவது கூறில் எபிரெயத்தில் விடுபட்ட வினைப்பயன் தமிழில் வெளிப்படையாக நிரப்பப்பட்டுள்ளது.
lexical_decisions:
- source_word: הַמְעַט
  choice: அற்பமானவையா
  rationale: கேள்வித்துகளுடன் வரும் מְעַט, கொடுக்கப்படும் ஆறுதல்களைப் போதாதவை அல்லது சிறுமையானவை எனக் கருதுகிறாயா என்ற சொல்லாட்சிக் கேள்வியை உருவாக்குகிறது. ‘அற்பமானவையா’ என்பது அந்த மதிப்புக் குறைத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִמְּךָ
  choice: உனக்கு
  rationale: இங்கு מן முன்னொட்டு இடத்திலிருந்து பிரிதலை அல்ல, பேச்சுக்குரியவருடன் உள்ள தொடர்பை—‘உனக்குப் பொறுத்தவரை’—குறிக்கிறது.
- source_word: תַּנְחֻמוֹת
  choice: ஆறுதல்கள்
  rationale: נחם வேரிலிருந்து வந்த பன்மைச் சொல் ஆறுதல் அளிக்கும் சொற்கள் அல்லது செயல்களைக் குறிக்கிறது; தமிழிலும் பன்மை தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இச்சூழலில் אֵל வல்லமையுள்ள ஒருவரை பொதுவாகக் குறிக்காமல், கடவுளைக் குறிக்கும் தெய்வீகப் பெயராக உள்ளது.
- source_word: וְדָבָר
  choice: வார்த்தையும்
  rationale: דָבָר என்பதன் ‘வார்த்தை’ என்ற பொருள் இங்குள்ள பேச்சுச் சூழலுக்குப் பொருந்துகிறது. וְ என்பதன் இயல்பான இணைப்புப் பொருளை ‘-உம்’ தக்கவைக்கிறது.
- source_word: לָאַט
  choice: மென்மையாகச் சொல்லப்படும்
  rationale: இந்த வினையடை மென்மையான அல்லது அடக்கமான முறையைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, எபிரெயத்தில் உள்ளார்ந்து உணர்த்தப்படும் சொல்லும் செயல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עִמָּךְ
  choice: உன்னிடம்
  rationale: עִם அடிப்படையில் ‘உடன்’ என்பதைக் குறித்தாலும், ஒருவரோடு பேசுவதைக் குறிக்கும் இச்சூழலில் ‘உன்னிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
