revisions:
- from: நரைத்தவர்களும் மிகவும் வயதானவர்களும் எங்களிடையே இருக்கிறார்கள்; அவர்கள் உன் தந்தையைவிட அதிக நாட்கள் வாழ்ந்தவர்கள்.[a]
  to: நரைத்தவர்களும் மிக முதியவர்களும் எங்களிடையே இருக்கிறார்கள்; அவர்கள் உன் தந்தையைவிட வயதில் மூத்தவர்கள்.[a]
  rationale: 'The revision retains the paired emphasis and the distinction between gray-haired and very old persons, while replacing the added lifespan formulation with the Hebrew idiom’s contextual meaning: seniority in age. The footnote preserves the more literal “greater in days” wording.'
