  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: ta
  text: நரைத்தவர்களும் மிக முதியவர்களும் எங்களிடையே இருக்கிறார்கள்; அவர்கள் உன் தந்தையைவிட வயதில் மூத்தவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “நாட்களில் உன் தந்தையைவிடப் பெரியவர்கள்.” இதன் சூழல்சார்ந்த பொருள், “உன் தந்தையைவிட வயதில் மூத்தவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: நரைத்தவர்களும் ... மிகவும் வயதானவர்களும்
  rationale: மீண்டும் வரும் גַּם இரு குழுக்களையும் இணைத்து வலியுறுத்துகிறது; தமிழில் இணைப்பு ‘உம் ... உம்’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: שָׂב
  choice: நரைத்தவர்கள்
  rationale: முதுமையுடன் தொடர்புடைய நரைமுடி என்ற கண்கூடான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יָשִׁישׁ
  choice: மிகவும் வயதானவர்கள்
  rationale: שָׂב உடன் பொருள் ஒட்டினாலும், மிகுந்த முதிர்வயதைக் குறிக்கும் தனித்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בָּנוּ
  choice: எங்களிடையே இருக்கிறார்கள்
  rationale: இங்குள்ள בָּנוּ சமூக அல்லது குழு சார்ந்த இருப்பைக் குறிக்கிறது; ‘எங்களிடையே’ என்பது இயல்பான தமிழ்.
- source_word: כַּבִּיר
  choice: அதிக நாட்கள் வாழ்ந்தவர்கள்
  rationale: כַּבִּיר அடிப்படையில் ‘பெரிய/வலிய’ எனப் பொருள்படலாம்; ஆனால் ஒப்பீட்டு מִן மற்றும் ‘நாட்கள்’ என்பதுடன் இது வயதில் முந்தியிருப்பதைக் குறிக்கிறது.
- source_word: מֵאָבִיךָ יָמִים
  choice: உன் தந்தையைவிட அதிக நாட்கள் வாழ்ந்தவர்கள்
  rationale: ‘உன் தந்தையைவிட நாட்களில் பெரியவர்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நாட்கள்’ என்ற மூலப்படிமத்தையும் தக்கவைக்கிறது.
