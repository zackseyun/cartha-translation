translation_notes:
  register: நவீனத் தரத் தமிழில், உரையாடலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. שָׂב மற்றும் יָשִׁישׁ ஆகியவற்றின் இணைநிலையையும் வேறுபட்ட நுணுக்கங்களையும் காத்து, ‘நாட்கள்’ என்ற எபிரெயப் படிமம் இயன்றவரை தக்கவைக்கப்பட்டது.
