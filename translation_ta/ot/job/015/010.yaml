review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the paired terms for advanced age and the social sense of בָּנוּ. However, “அதிக நாட்கள் வாழ்ந்தவர்கள்” introduces an explicit claim about length of life that is not stated directly; the Hebrew comparative idiom is more faithfully conveyed as being older in age/days than Job’s father.
  naturalness: The wording is generally clear and modern, but “அவர்கள் உன் தந்தையைவிட அதிக நாட்கள் வாழ்ந்தவர்கள்” is less idiomatic and shifts the comparison from age to completed lifespan. “வயதில் மூத்தவர்கள்” is natural modern Tamil.
  terminology: “நரைத்தவர்கள்” and “மிக முதியவர்கள்” suitably retain the parallel and relative intensification of שָׂב and יָשִׁישׁ. “வயதில் மூத்தவர்கள்” accurately expresses the contextual force of כַּבִּיר ... יָמִים without overtranslating it.
  issues:
  - severity: medium
    issue: “அதிக நாட்கள் வாழ்ந்தவர்கள்” adds a completed-lifespan nuance.
    rationale: The Hebrew says literally that they are greater than Job’s father “in days,” an idiom for seniority/age. It does not specifically assert that they have lived a greater total number of days in a way that foregrounds lifespan.
  revised_text: நரைத்தவர்களும் மிக முதியவர்களும் எங்களிடையே இருக்கிறார்கள்; அவர்கள் உன் தந்தையைவிட வயதில் மூத்தவர்கள்.[a]
  revised_footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “நாட்களில் உன் தந்தையைவிடப் பெரியவர்கள்.” இதன் சூழல்சார்ந்த பொருள், “உன் தந்தையைவிட வயதில் மூத்தவர்கள்.”
    reason: lexical_alternative
  revision_rationale: 'The revision retains the paired emphasis and the distinction between gray-haired and very old persons, while replacing the added lifespan formulation with the Hebrew idiom’s contextual meaning: seniority in age. The footnote preserves the more literal “greater in days” wording.'
