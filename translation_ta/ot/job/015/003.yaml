  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: ta
  text: பயனற்ற[a] பேச்சாலும், பயன் தராத சொற்களாலும் அவன் வாதிட வேண்டுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயனளிக்காத பேச்சாலும், அவற்றால் எந்தப் பயனும் விளையாத சொற்களாலும் அவன் நியாயம் பேச வேண்டுமா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: வாதிட
  rationale: יכח என்பதன் ஹிஃபில் வடிவம் சூழலுக்கேற்ப வாதிடுதல், நியாயம் பேசுதல், கண்டித்தல் ஆகிய பொருள்களைத் தரலாம். யோபுக்கும் எலிப்பாசுக்கும் இடையிலான சொற்போர்ச் சூழலில், சட்டரீதியான பொருளை அளவுக்கு மீறி ஏற்றாமல் verbal contention-ஐக் காட்டுவதற்கு ‘வாதிட’ பொருத்தமானது.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: பயனற்ற பேச்சால்
  rationale: דָבָר இங்கு அடுத்த அரையடியின் מִלִּים என்பதுடன் இணையான பேச்சைக் குறிக்கிறது; סכן பயன் அளித்தல் என்ற கருத்தைத் தருகிறது. ‘பயனற்ற பேச்சால்’ என்பது மூலத்தின் கருத்தை இயல்பான நவீன தமிழில் சுருக்கமாக வழங்குகிறது.
- source_word: וּמִלִּים
  choice: சொற்களால்
  rationale: מִלִּים என்பதன் நேர்ப்பொருள் ‘சொற்கள்’. முதல் அரையடியில் ‘பேச்சு’ என்றும் இங்கு ‘சொற்கள்’ என்றும் வழங்குவது இணை அமைப்பையும் இயல்பான தமிழையும் காக்கிறது. எபிரெய இணைப்புச்சொல்லின் இணையான கருத்து தமிழில் தனித்த இரண்டாம் கேள்வியாக வெளிப்படுகிறது.
- source_word: לֹא יוֹעִיל בָּם
  choice: நன்மை செய்யாத
  rationale: יועיל என்பது பயன் தருதல், உதவுதல், நன்மை செய்தல் என்பதைக் குறிக்கிறது; בם முன்சொன்ன சொற்களைக் குறிக்கிறது. ‘நன்மை செய்யாத சொற்கள்’ அவற்றின் பயனின்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
