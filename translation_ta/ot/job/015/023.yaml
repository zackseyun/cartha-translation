source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: ta
  text: 'அவன் அப்பம் தேடி அலைகிறான்: “அது எங்கே?” இருளின் நாள் அவனுக்கு அருகிலேயே ஆயத்தமாக உள்ளது என்பதை அவன் அறிவான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்கு அருகிலேயே” என்பதற்கான எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “அவன் கையில்” என்பதாகும்; இருளின் நாள் அவனை நெருங்கியிருப்பதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: அலைந்து திரிந்து
  rationale: Qal நிகழ்காலப் பங்கேற்புவினை அமைதியற்ற, தொடர்ச்சியான அலைச்சலைக் குறிக்கிறது; நாடுகடத்தப்பட்டவன் என்ற கூடுதல் பொருளை ஏற்றாமல் இயல்பான தமிழில் இதை வெளிப்படுத்துகிறது.
- source_word: לַלֶּחֶם
  choice: அப்பத்திற்காக
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; சூழலில் அது உணவைப் பொதுவாகவும் குறிக்கலாம். உருவகத்தின் தெளிவை முதன்மை உரை காக்கிறது.
- source_word: אַיֵּה
  choice: “அது எங்கே?”
  rationale: இந்த வினாவிடைச்சொல் ‘எங்கே?’ என்று பொருள்படும். தமிழில் இயல்பாக இருக்க, முன்னர் குறிப்பிடப்பட்ட அப்பத்தைக் குறிக்கும் ‘அது’ சேர்க்கப்பட்டுள்ளது.
- source_word: יָדַע
  choice: அவன் அறிவான்
  rationale: ידע என்பதன் எளிய நிறைவுவினை உறுதியான அறிதலைக் காட்டுகிறது; ‘அறிவான்’ நேரடியான இணைச்சொல்.
- source_word: נָכוֹן
  choice: ஆயத்தமாக இருக்கிறது
  rationale: இந்த வடிவம் ஆயத்தப்படுத்தப்பட்ட அல்லது தயாராக உள்ள ஒன்றைக் குறிக்கிறது; வரவிருக்கும் இருளின் நாளைத் தெளிவாகவும் மிகைப்படுத்தாமலும் காட்டுகிறது.
- source_word: בְּיָדוֹ
  choice: தனக்கு மிக அருகில்
  rationale: நேரடியாக ‘அவன் கையில்’ என்றாலும், இங்கு இருளின் நாள் உடனடியாக நெருங்கியிருப்பதைச் சுட்டும் சொல்லாட்சியாகப் புரிந்துகொள்வது சூழலுக்கு ஏற்றது.
- source_word: יוֹם חֹשֶׁךְ
  choice: இருளின் நாள்
  rationale: இருளால் அடையாளப்படுத்தப்படும் ஒரு நாளைச் சுட்டும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அதை வெளிப்படையாகப் பேரழிவு, தீர்ப்பு அல்லது அழிவு என்று விளக்கிவிடவில்லை.
theological_decisions:
- issue: ‘இருளின் நாள்’ என்பதன் உருவகப் பொருள்
  choice: ‘இருளின் நாள்’ என்ற உருவகமே முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘பேரழிவின் நாள்’, ‘அழிவின் நாள்’ அல்லது ‘தீர்ப்பின் நாள்’
  rationale: எலிப்பாசின் உரைச் சூழல் பொல்லாதவனுக்கு வரவிருக்கும் துன்பத்தையோ அழிவையோ சுட்டினாலும், எபிரெயச் சொற்றொடர் அதனை ஒரு குறிப்பிட்ட இறையியல் நிகழ்வாக வெளிப்படையாக வரையறுப்பதில்லை. எனவே அதன் பதற்றமும் பல்பொருள் வாய்ப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய ஓட்டம் பயன்படுத்தப்பட்டது; ‘அப்பம்’ மற்றும் ‘இருளின் நாள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டன.
