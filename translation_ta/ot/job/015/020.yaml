source:
  edition: WLC
  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: ta
  text: தீயவன் தன் வாழ்நாளெல்லாம் துடித்துக்கொண்டிருக்கிறான்[a][c]; கொடூரனுக்கெனக் குறிப்பிட்ட எண்ணிக்கையிலான ஆண்டுகள் ஒதுக்கி வைக்கப்பட்டுள்ளன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேதனையில் இருக்கிறான்”; எபிரெய வினைச்சொல் நெளிதல், நடுங்குதல் அல்லது பிரசவவேதனை போன்ற வேதனையில் துடித்தல் ஆகிய நுண்பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மறைத்து வைக்கப்பட்டுள்ளன” அல்லது “சேமித்து வைக்கப்பட்டுள்ளன.”
    reason: lexical_alternative
  - marker: c
    text: “தீயவன்” என்பது எபிரெயத்தில் இலக்கணப்படி ஆண்பால் ஒருமையில் இருந்து, தீய மனிதரை ஒரு வகையின் பிரதிநிதியாகக் காட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: தன் வாழ்நாளெல்லாம்
  rationale: மொத்த காலத்தையும் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் முழுமையாக வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஆண்பால் ஒருமை அடைமொழி, ஒரு வகை மனிதரைப் பிரதிநிதித்துவப்படுத்துகிறது; ‘தீயவன்’ அதன் ஒருமை வடிவையும் நீதிநூல் சூழலையும் காக்கிறது.
- source_word: הוּא
  choice: தன் / வினைமுற்றில் மறைமுகமாக வெளிப்படும் எழுவாய்
  rationale: எபிரெயத்தில் தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தும் அல்லது மீளெழுவாய் பணியாற்றுகிறது. தமிழில் ‘அவன்’ என்பதை மீண்டும் சேர்ப்பது செயற்கையாக இருப்பதால், ‘தன்’ மற்றும் வினைமுற்று வழியாக எழுவாய் தெளிவாக்கப்பட்டுள்ளது.
- source_word: מִתְחוֹלֵל
  choice: துடித்துக்கொண்டிருக்கிறான்
  rationale: חול வேரின் இவ்வடிவம் நெளிதல், துடித்தல், நடுக்கம் அல்லது பிரசவவேதனை போன்ற மனவுடல் வேதனையைச் சுட்டலாம். தொடர்நிலையை உணர்த்தும் ‘துடித்துக்கொண்டிருக்கிறான்’ அடிப்படை உருவகத்தையும் நீடித்த செயற்பாட்டையும் காக்கிறது.
- source_word: וּמִסְפַּר שָׁנִים
  choice: குறிப்பிட்ட எண்ணிக்கையிலான ஆண்டுகள்
  rationale: திட்டவட்டமானதாயினும் கூறப்படாத ஓர் ஆண்டுக் கால அளவை இச்சொற்றொடர் குறிக்கலாம். ‘குறிப்பிட்ட எண்ணிக்கையிலான’ என்பது வெறும் ‘சில’ என்பதைவிட அந்த வரையறுக்கப்பட்ட தன்மையை நன்றாகக் காக்கிறது.
- source_word: נִצְפְּנוּ
  choice: ஒதுக்கி வைக்கப்பட்டுள்ளன
  rationale: צפן என்பதன் நிபால் வடிவம் ‘மறைத்து வைக்கப்படுதல்’ அல்லது ‘பிற்காலத்திற்காகச் சேமித்து/ஒதுக்கி வைக்கப்படுதல்’ என்று பொருள்படலாம். சூழலில் இயல்பாக இருக்கும் ‘ஒதுக்கி வைக்கப்பட்டுள்ளன’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֶעָרִיץ
  choice: கொடூரனுக்கென
  rationale: עָרִיץ என்பது வன்முறையும் இரக்கமின்மையும் கொண்ட ஒடுக்குபவனைக் குறிக்கிறது. ‘கொடூரன்’ அரசியல் கொடுங்கோன்மையை மட்டும் குறுக்காமல் அதன் கடுமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீயவனின் துன்பம் எல்லா நாட்களிலும் தொடர்கிறது என்ற எலிப்பாசின் கூற்று
  choice: உரையின் முழுமைப்படுத்தும் மொழியை அப்படியே வைத்தல்
  alternative: இதைப் பொதுவான போக்கு அல்லது அவ்வப்போது நிகழும் அனுபவம் என்று மென்மையாக்குதல்
  rationale: இது எலிப்பாசின் உரைக்குள் வரும் வலுவான கூற்று. மொழிபெயர்ப்பு அதை ஏற்றுக்கொள்ளவோ மறுக்கவோ செய்யாமல், கதையின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நீதிநூல் நடை பயன்படுத்தப்பட்டுள்ளது. முதல் அரையடியின் நீடித்த வேதனையும் இரண்டாம் அரையடியின் மறைக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட கால அளவும் இயல்பான தமிழில் காக்கப்பட்டுள்ளன; மூலத்தின் பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
