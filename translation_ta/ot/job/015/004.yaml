source:
  edition: WLC
  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: ta
  text: 'உண்மையாகவே, நீ இறையச்சத்தைப் பயனற்றதாக்குகிறாய்[a];

    கடவுளின் முன்னிலையில் செய்யும் தியானத்தையும் குறைக்கிறாய்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறையச்சத்தைச் சீர்குலைக்கிறாய்” அல்லது “இறையச்சத்தைச் செயலற்றதாக்குகிறாய்.”
    reason: lexical_alternative
  - marker: b
    text: “தியானம்” என்பதற்கான எபிரெயச் சொல் மன்றாட்டு, பக்திச் சிந்தனை, புலம்பல் அல்லது உள்ளார்ந்த உரையாடல் என்பவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: உண்மையாகவே
  rationale: எலிப்பாசின் குற்றச்சாட்டை வலியுறுத்தும் இத்துகளின் உறுதிப்படுத்தும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்லின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: תָּפֵר
  choice: பயனற்றதாக்குகிறாய்
  rationale: פרר என்பதன் ஹிப்இல் வடிவம் முறித்தல், செல்லாததாக்குதல், செயலிழக்கச் செய்தல் ஆகிய பொருள்களைக் கொண்டது; இங்கு அச்சத்தை நடைமுறையில் பயனற்றதாக்குவதாகக் கூறும் குற்றச்சாட்டை இது தெளிவாகக் காட்டுகிறது.
- source_word: יִרְאָה
  choice: இறையச்சம்
  rationale: எபிரெயத்தில் சொல் வெறுமனே ‘அச்சம்’ என்றிருந்தாலும், இச்சூழலில் கடவுளை நோக்கிய பயபக்தியே குறிக்கப்படுகிறது. ‘இறையச்சம்’ அச்சம் மற்றும் மரியாதை ஆகிய இரு நுண்ணுணர்வுகளையும் சுருக்கமாகத் தருகிறது.
- source_word: וְתִגְרַע
  choice: குறைக்கிறாய்
  rationale: גרע என்பதன் குறைத்தல், தணித்தல், விலக்குதல் என்ற அடிப்படைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: שִׂיחָה
  choice: தியானம்
  rationale: இச்சொல் சிந்தனை, தியானம், மன்றாட்டு, புலம்பல் அல்லது உள்ளார்ந்த உரையாடல் எனப் பலவாறு அமையலாம். ‘தியானம்’ அதன் அகன்ற, சிந்தனைமிக்க சமயப் பொருளை ஓரளவு காக்கிறது.
- source_word: לִפְנֵי אֵל
  choice: கடவுளுக்கு முன்பான
  rationale: ‘கடவுளுக்கு முன்பாக / அவரது சந்நிதியில்’ என்ற இடத்தொடர்புப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יִרְאָה என்பதன் சமயப் பொருள்
  choice: இறையச்சம்
  alternative: அச்சம் / பயபக்தி
  rationale: இது பொதுவான பயத்தைப் பற்றியதல்ல; கடவுளை நோக்கிய பக்தியையும் அச்சத்தையும் யோபு பயனற்றதாக்குவதாக எலிப்பாஸ் குற்றஞ்சாட்டுகிறான். அதேவேளை ‘இறையச்சம்’ என்பதை ஒரு குறிப்பிட்ட சமய மரபின் தொழில்நுட்பச் சொல்லாக விரிவாக்கவில்லை.
- issue: שִׂיחָה என்பதன் பொருள்
  choice: தியானம்
  alternative: மன்றாட்டு / பக்திச் செயல் / புலம்பல் / உரையாடல்
  rationale: மூலச்சொல்லின் பொருள் பரந்தது. ‘கடவுளுக்கு முன்பாக’ என்ற தொடருடன் அது சிந்தனைமிக்க அல்லது வேண்டுதலான பேச்சைக் குறிக்கலாம்; ‘தியானம்’ இதை ‘ஜெபம்’ என மட்டும் சுருக்காமல் ambiguity-ஐ ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநடையின் இணை அமைப்பை இரண்டு அடிகளாக வைத்துள்ளோம். ‘இறையச்சம்’ மற்றும் ‘கடவுளுக்கு முன்பான தியானம்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சமயச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; மூலத்தின் பொருள் அகலம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டது.
