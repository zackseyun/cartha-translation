base_translation:
  language: en
  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: ta
  text: அவனுடைய காலம் வருவதற்குமுன்பே அது நிறைவேறிவிடும்[a]; அவனுடைய கிளை[b] பசுமையாக இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குரியது முழுமையாகச் செலுத்தப்படும்.” எபிரெய வினை சொல்லுக்குச் சொல் “நிரம்பும்” அல்லது “நிறைவடையும்” என்று பொருள்படும்; இச்சூழலில் அதன் துல்லியமான நுணுக்கம் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய பனைமடல்” அல்லது “அவனுடைய மேல்தளிர்.” எபிரெயச் சொல் ஒரு மரம் அல்லது செடியின் கிளை போன்ற பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: அவனுடைய காலம் வருவதற்குமுன்பே
  rationale: எபிரெய மொழியின் ‘அவனுடைய நாளில் அல்ல’ என்ற சொற்றொடரை, அகாலத்தில் நிகழ்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תִּמָּלֵא
  choice: அது நிறைவேறிவிடும்
  rationale: ‘நிரம்பும்/நிறைவடையும்’ என்ற நிபால் வினையின் அடிப்படைப் பொருளைத் தக்கவைத்து, சூழலில் உள்ள முடிவுறுதல் என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத பணம் செலுத்தும் உருவகத்தை முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: כִפָּתוֹ
  choice: அவனுடைய கிளை
  rationale: செடியின் கிளை, பனைமடல் அல்லது மேல்தளிரைக் குறிக்கக்கூடிய சொல்லைத் தமிழில் பொதுவான தாவர உருவகமாகத் தருகிறது.
- source_word: לֹא רַעֲנָנָה
  choice: பசுமையாக இருக்காது
  rationale: தாவரத்தின் பசுமை, புத்துணர்ச்சி, செழிப்பு ஆகியவற்றைக் குறிக்கும் எபிரெயச் சொல்லின் கண்கூடான உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: תִּמָּלֵא என்ற வினையின் சூழல்சார் பொருள்
  choice: நிறைவேறிவிடும்
  alternative: அவனுக்குரியது முழுமையாகச் செலுத்தப்படும்
  rationale: தண்டனை அல்லது கூலி செலுத்தப்படுதல் என்ற பொருள் சூழலில் சாத்தியமானது; ஆனால் வினை தானாகவே நிதிசார் சொல்லல்ல. ஆகவே அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், ஞான இலக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் குறிப்பிடப்படாத வினை எழுவாயை “அது” எனத் திறந்த நிலையில் வைத்திருப்பதன் மூலம் உள்ளார்ந்த தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
