  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: ta
  text: ஞானமுள்ளவன் காற்றைப் போன்ற அறிவால் பதிலளித்து, தன் வயிற்றைக் கிழக்குக் காற்றால் நிரப்புவானா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָכָם
  choice: ஞானமுள்ளவன்
  rationale: வினாவிடை הֲ இணைந்த חָכָם, ஒரு குறிப்பிட்ட நபரை அல்லாமல் பொதுவாக ‘ஞானமுள்ளவன்’ என்பவனை நோக்கிய கண்டன வினாவைத் தொடங்குகிறது.
- source_word: יַעֲנֶה
  choice: பதிலளித்து ... நிரப்புவானா?
  rationale: முற்றுப்பெறாத வினைச்சொல் கண்டனத் தொனியுள்ள வினாவில் வருகிறது; தமிழில் முழு இணை வினாவையும் இறுதி ‘நிரப்புவானா?’ தாங்குவது இயல்பானது.
- source_word: דַעַת רוּחַ
  choice: காற்றைப் போன்ற அறிவு
  rationale: சொற்றொடர் நேரடியாக ‘காற்றின் அறிவு’ எனப் பொருள்படலாம். இங்கு רוּחַ ‘காற்று’ என்ற உருவகத்தின் வழியாக வெறுமையையோ சாரமின்மையையோ குறிக்கிறது; உருவகத்தை விளக்கிப் போக்காமல் இயல்பான தமிழில் தக்கவைக்கப்பட்டது.
- source_word: וִימַלֵּא
  choice: நிரப்புவானா
  rationale: முந்தைய வினைச்சொல்லுடன் தொடரும் கண்டன வினாவைச் சுட்டுகிறது; ‘நிரப்பு’ உடல் சார்ந்த உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: קָדִים
  choice: கீழ்க்காற்று
  rationale: பண்டைய எபிரேயப் புவியியல் வழக்கில் கிழக்கு ‘கீழ்’ திசையாகக் கருதப்பட்டதால், קָדִים என்பதற்கான மரபானவும் துல்லியமானவும் தமிழ் சொல் ‘கீழ்க்காற்று’; அதன் கடுமையான தன்மையை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: בִּטְנוֹ
  choice: தன் வயிறு
  rationale: בֶּטֶן என்பதன் நேரடியான உடல் சார்ந்த பொருள் ‘வயிறு’; காற்றால் நிரம்பும் தெளிவான உருவகத்தை இது பாதுகாக்கிறது.
