- from: நீ கடவுளுக்கு எதிராக[a] உன் ஆவியைத் திருப்பி, உன் வாயிலிருந்து வார்த்தைகளை வெளிப்படுத்துகிறாயே?
  to: நீ கடவுளுக்கு எதிராக[a] உன் ஆவியைத் திருப்பி, உன் வாயிலிருந்து வார்த்தைகளை வெளிவிடுகிறாயே?
