source:
  edition: WLC
  text: כִּֽי תָשִׁ֣יב אֶל אֵ֣ל רוּחֶ֑/ךָ וְ/הֹצֵ֖אתָ מִ/פִּ֣י/ךָ מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/013.yaml
  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: ta
  text: நீ கடவுளுக்கு எதிராக[a] உன் ஆவியைத் திருப்பி, உன் வாயிலிருந்து வார்த்தைகளை வெளிவிடுகிறாயே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளை நோக்கி.’ எபிரேயத்தில் ‘கடவுளை நோக்கி’ என்று உள்ளது; குற்றஞ்சாட்டும் சூழல் எதிர்ப்பைக் குறிப்பதால் முதன்மை உரையில் ‘கடவுளுக்கு எதிராக’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: — (தமிழில் தொடர்வினா அமைப்பின் மூலம் வெளிப்படுத்தப்பட்டது)
  rationale: இது முந்தைய வசனத்தில் தொடங்கிய கேள்வியின் உள்ளடக்கத்தைத் தொடர்கிறது. தனியாக ஒரு இணைப்புச்சொல்லைச் சேர்ப்பதைவிட, ‘வெளிப்படுத்துகிறாயே?’ என்ற தொடர்வினா அமைப்பு நவீன தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: תָשִׁיב
  choice: திருப்பி
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரின் உள்ளார்ந்த மனப்பாங்கை ஒரு திசை நோக்கித் திருப்புவதைக் குறிக்கிறது; ‘திருப்பி’ என்பது உருவகத்தையும் சுருக்கத்தையும் காக்கிறது.
- source_word: אֶל אֵל
  choice: கடவுளுக்கு எதிராக
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், எலிப்பாசின் குற்றச்சாட்டுச் சூழல் பகைமையான எதிர்நிலையைக் குறிக்கிறது. அந்தச் சூழல்பொருளை முதன்மை உரை வெளிப்படுத்துகிறது; நேரடியான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: רוּחֶךָ
  choice: உன் ஆவியை
  rationale: רוּחַ இங்கு காற்றையோ மூச்சையோ அல்ல, யோபுவின் உள்ளார்ந்த ஆவி அல்லது மனப்பாங்கைக் குறிக்கிறது. ‘ஆவி’ மூலச்சொல்லின் மனித உள்ளார்ந்த பரிமாணத்தையும் அதன் திறந்த பொருள் பரப்பையும் காக்கிறது.
- source_word: וְהֹצֵאתָ
  choice: வெளிப்படுத்துகிறாயே
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். வாயிலிருந்து வார்த்தைகள் வருவதாகிய மூல உருவகத்தை ‘வெளிப்படுத்து’ இயல்பான தமிழில் காக்கிறது; ‘-யே?’ முந்தைய வசனத்திலிருந்து தொடரும் குற்றஞ்சாட்டும் கேள்விநடையை உணர்த்துகிறது.
- source_word: מִפִּיךָ
  choice: உன் வாயிலிருந்து
  rationale: מִן மூலத்தையோ புறப்படும் இடத்தையோ குறிக்கிறது. ‘வாயிலிருந்து’ என்பது எபிரெய உருவகத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִלִּין
  choice: வார்த்தைகளை
  rationale: அரமேயத் தன்மை கொண்ட இந்தப் பன்மைச் சொல் ‘வார்த்தைகள்/உரைகள்’ என்று பொருள்படும்; இங்கு ‘வார்த்தைகள்’ நேரடியான, பொதுவாகப் புரியும் தேர்வு.
theological_decisions:
- issue: אֶל אֵל என்பது திசையையா எதிர்ப்பையா குறிக்கிறது?
  choice: கடவுளுக்கு எதிராக
  alternative: கடவுளை நோக்கி
  rationale: முன்னும் பின்னுமுள்ள எலிப்பாசின் குற்றச்சாட்டு, யோபு தன் ஆவியை கடவுளுக்கு எதிரான நிலையில் திருப்புவதாகப் புரிந்துகொள்ள இடமளிக்கிறது. இருப்பினும் אֶל என்பதன் நேரடிப் பொருள் ‘நோக்கி’ என்பதால், அந்த உண்மையான மொழியியல் மாற்று அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட கேள்விநடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தில் தொடங்கும் கேள்வியின் தொடர்ச்சியை ‘வெளிப்படுத்துகிறாயே?’ என்ற அமைப்பு காட்டுகிறது. ‘ஆவி’ என்ற சொல் மூலத்தின் உருவக மற்றும் மனித உள்ளார்ந்த பொருள் பரப்பைக் காக்கிறது.
