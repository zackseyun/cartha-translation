  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: ta
  text: 'அவன் செல்வந்தனாக மாட்டான்;

    அவனுடைய செல்வம் நிலைத்திருக்காது;

    அவனுடைய விளைச்சல்[a] நிலத்தை நோக்கித் தாழ்ந்து வளையாது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய உடைமைகள்,’ ‘அவனுடைய ஆதாயம்,’ அல்லது ‘அவனுடைய மிகுதி’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் அரிதானதும் பொருள் உறுதியற்றதுமாகும்.
    reason: lexical_alternative
  - marker: b
    text: இந்த இறுதிக் கூறு, மிகுதியான விளைச்சலின் பாரத்தால் கிளைகளோ கதிர்களோ நிலத்தை நோக்கித் தாழும் காட்சியைக் குறிக்கலாம். வேறு சிலர், அவனுடைய உடைமைகள் நாட்டில் பரவாது என்ற பொதுவான பொருளில் இதைப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: செல்வந்தனாக மாட்டான்
  rationale: עשר என்பதன் வினைச்சொல் வலிமையைப் பேணி, ஒரு நிலையை மட்டும் குறிப்பிடாமல் ‘செல்வந்தனாகுதல்’ என்ற பொருளைத் தருகிறது.
- source_word: יָקוּם
  choice: நிலைத்திருக்காது
  rationale: சொல்லடியாக ‘நிற்காது’ எனினும், செல்வத்துடன் வரும் இச்சூழலில் அது நிலைபெறாமல் போவதையோ நீடிக்காமல் போவதையோ குறிக்கிறது.
- source_word: חֵילוֹ
  choice: அவனுடைய செல்வம்
  rationale: חַיִל என்பது வலிமை, வளம், உடைமை, செல்வம் ஆகியவற்றைக் குறிக்கலாம்; செழிப்பைப் பற்றிய இச்சூழலில் ‘செல்வம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִטֶּה
  choice: தாழ்ந்து வளையாது
  rationale: נטה என்பதற்கு நீட்டுதல், சாய்தல், வளைதல் ஆகிய பொருள்கள் உண்டு. நிலத்தை நோக்கி மிகுதியின் பாரத்தால் விளைச்சல் தாழும் உருவகத்தை இந்தத் தேர்வு பாதுகாக்கிறது.
- source_word: מִנְלָם
  choice: அவனுடைய விளைச்சல்
  rationale: இது அரிதானதும் பொருள் உறுதியற்றதுமான சொல். ‘விளைச்சல்’ என்பது நிலத்தை நோக்கித் தாழ்ந்து வளையும் உருவகத்துடன் ஒத்திசைகிறது; ஒருமைச் சூழலுக்கேற்ப உடைமைத் தொடர்பு ‘அவனுடைய’ என வழங்கப்படுகிறது, ஆனால் ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
