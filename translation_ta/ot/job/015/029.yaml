translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் மூன்று இணையான எதிர்மறைக் கூறுகளும் வரிப்பிரிப்பால் பேணப்பட்டுள்ளன. அரிதான இறுதிச் சொல்லையும் இறுதிக் காட்சியையும் அளவுக்கு மீறித் தீர்மானிக்காமல், மூலத்தின் ஐயம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
