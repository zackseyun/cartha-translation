  terminology: No theological terminology or proper names occur. “எடுத்துரைப்பேன்” appropriately represents the cohortative resolve to recount or declare.
  issues:
  - severity: medium
    issue: “விளக்கிச் சொல்வேன்” is more interpretive than the Hebrew.
    rationale: The verb introduces what Eliphaz is about to communicate; it does not specifically state that he will explain it. “உனக்குச் சொல்வேன்” preserves the broad speech-act sense and the source's ambiguity.
