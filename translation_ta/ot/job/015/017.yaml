translation:
  language: ta
  text: நான் உனக்குச் சொல்வேன்; எனக்குச் செவிகொடு. நான் கண்டதை எடுத்துரைப்பேன்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: நான் உனக்கு விளக்கிச் சொல்வேன்
  rationale: பியேல் வடிவம் அடுத்து வரும் உரையை அறியத்தருதல் அல்லது எடுத்துரைத்தல் என்ற பொருளில் அறிமுகப்படுத்துகிறது. காட்சியாகக் ‘காட்டுதல்’ இங்கு நோக்கம் அல்ல; ‘விளக்கிச் சொல்வேன்’ என்பது பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: שְׁמַע לִי
  choice: எனக்குச் செவிகொடு
  rationale: கட்டளை வினையும் முன்னிடைச்சொல்லும் சேர்ந்து பேச்சாளரைக் கவனமாகக் கேட்கும்படி கோருகின்றன. ‘எனக்குச் செவிகொடு’ என்பது அந்த வேண்டுகோளின் வலிமையை dignified modern Tamil-ல் காக்கிறது.
- source_word: וְזֶה
  choice: நான் கண்டதை
  rationale: சொல்லுக்குச் சொல் ‘இதையும்/இந்த ஒன்றையும்’ என்றாலும், இங்கு அடுத்துவரும் அனுபவத்தின் உள்ளடக்கத்தைச் சுட்டுகிறது. தமிழில் தொடர்பெயர் அமைப்புடன் இணைப்பது இயல்பானது.
- source_word: חָזִיתִי
  choice: நான் கண்டதை
  rationale: முற்றுவினை எலிப்பாஸ் தன் சொந்தக் கவனிப்பாகக் கூறுவதைத் தெரிவிக்கிறது. ‘கண்டதை’ என்பது அனுபவச் சான்றின் வலிமையைப் பாதுகாக்கிறது.
- source_word: וַאֲסַפֵּרָה
  choice: எடுத்துரைப்பேன்
  rationale: கோஹோர்டேட்டிவ் வடிவம் கண்டவற்றை விரித்துச் சொல்லும் பேச்சாளரின் நோக்கத்தை வெளிப்படுத்துகிறது. ‘எடுத்துரைப்பேன்’ என்பது வெறும் ‘சொல்வேன்’ என்பதைக் காட்டிலும் விவரித்துச் சொல்லும் நுணுக்கத்தைத் தருகிறது.
