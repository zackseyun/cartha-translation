  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: ta
  text: நாங்கள் அறியாத எதை நீ அறிந்திருக்கிறாய்? எங்களிடம் இல்லாத எதை நீ புரிந்துகொள்கிறாய்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுடன் இல்லாத எதை நீ புரிந்துகொள்கிறாய்?” எபிரெய மொழியில் சொற்பட, “அது எங்களுடன் இல்லை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָדַעְתָ
  choice: எதை நீ அறிந்திருக்கிறாய்?
  rationale: מַה என்பது ‘எதை’ எனும் வினாப்பெயர்; ידע என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு தற்போதைய அறிவுநிலையைச் சுட்டும் சொல்லாட்சியாக உள்ளது. ‘அறிந்திருக்கிறாய்’ என்பது வடிவத்தின் நிறைவு நயத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: וְלֹא נֵדָע
  choice: நாங்கள் அறியாத
  rationale: இணைப்புச்சொல், மறுப்பு, முதல் நபர் பன்மை வினை ஆகியவை முந்தைய வினாப்பெயருடன் சேர்ந்து ‘நாங்கள் அறியாத எதை’ என்ற இயல்பான தமிழ் சார்புத்தொடராக வழங்கப்பட்டுள்ளன.
- source_word: תָּבִין
  choice: நீ புரிந்துகொண்டிருக்கிறாய்
  rationale: בין என்பதன் Hiphil வடிவம் புரிதல் அல்லது பகுத்தறிதலைக் குறிக்கிறது. இங்கு இணைவரியின் அறிவுசார் பொருளுக்கு ‘புரிந்துகொண்டிருக்கிறாய்’ தெளிவான நவீனத் தமிழ்.
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: எங்களிடம் இல்லாத
  rationale: எபிரெய உரை சொற்பட ‘அது எங்களுடன் இல்லை’ என்கிறது. உடைமை அல்லது கைவசமிருத்தலைக் குறிக்கும் இந்த மொழிநடையைத் தமிழில் இயல்பாக ‘எங்களிடம் இல்லாத’ என்று வழங்கலாம்; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எலிப்பாசின் சவாலான இரட்டை வினாவின் சுருக்கத்தையும் இணை அமைப்பையும் காக்கும் கண்ணியமான நடை. ‘நாங்கள்/எங்களிடம்’ என்பது பேசுபவரையும் அவரோடு நிற்பவர்களையும் குறிக்கும் இயல்பான முதல் நபர் பன்மை.
