  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: ta
  text: அவன் இருளைவிட்டு விலகமாட்டான்; தீச்சுடர் அவனுடைய தளிர்களை[a] உலரச் செய்யும்; அவன் தன் வாயின் மூச்சினால் ஒழிந்துபோவான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘தளிர்கள்’ என்பது செடி உருவகத்தைத் தருகிறது: தீயவன் ஒரு மரத்தைப்போல் சித்தரிக்கப்படுகிறான்; அதன் இளம் வளர்ச்சி தீயால் கருகி உலர்கிறது.'
    reason: cultural_note
  - marker: b
    text: இறுதிக் கூறைக் கடவுளைக் குறிப்பதாக எடுத்தால், “அவருடைய வாயின் மூச்சினால் அவன் ஒழிந்துபோவான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: இருளைவிட்டு விலகமாட்டான்
  rationale: סור என்பதன் ‘விலகு/அகன்று செல்’ என்ற அடிப்படைப் பொருளையும், מן உடன் வரும் ‘இருளிலிருந்து’ என்ற உறவையும் காக்கிறது. ‘தப்பமாட்டான்’ என்பது சூழலுக்குப் பொருந்தினாலும் சற்றுக் கூடுதல் விளக்கமாகிவிடும்.
- source_word: יֹנַקְתּוֹ
  choice: அவனுடைய தளிர்கள்
  rationale: இச்சொல் மரத்தின் இளம் கிளை அல்லது புதுத்தளிரைக் குறிக்கிறது. தீயவன் ஒரு செடியாகச் சித்தரிக்கப்படும் உருவகத்தை ‘தளிர்கள்’ இயல்பாகக் காக்கிறது.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: தீச்சுடர் ... உலரச் செய்யும்
  rationale: Piel வடிவிலுள்ள יבש-ன் ‘உலரச் செய்/வாடச் செய்’ என்ற செயப்பொருளையும், שלהבת-ன் தீச்சுடர் என்ற பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְיָסוּר
  choice: ஒழிந்துபோவான்
  rationale: இரண்டாவது סור இங்கு அந்த மனிதன் அகற்றப்பட்டு அழிவதைச் சுட்டுவதாகத் தெரிகிறது. ‘விலகிப்போவான்’ என்பதைவிட ‘ஒழிந்துபோவான்’ தமிழில் விளைவைத் தெளிவாகக் கூறுகிறது; இருந்தாலும் மூலத்தின் இயக்கப் பொருளை முற்றிலும் அழித்துவிடாது.
- source_word: בְּרוּחַ פִּיו
  choice: தன் வாயின் மூச்சினால்
  rationale: רוּחַ என்பதற்கு மூச்சு, காற்று, ஆவி ஆகிய பொருள்கள் உண்டு. ‘வாய்’ என்பதுடன் ‘மூச்சு’ முதன்மையான இயல்புப் பொருள்; அழிவை உண்டாக்கும் சொல் அல்லது வீச்சு என்ற சாத்தியத்தை மொழிபெயர்ப்பு முற்றிலும் மூடுவதில்லை.
- source_word: פִּיו
  choice: தன் வாய்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி உடனடி இலக்கணத் தொடர்பின்படி தீயவனையே குறிக்கிறது. தமிழில் ‘தன்’ என்பதைப் பயன்படுத்துவது அதே எழுவாயை இயல்பாகச் சுட்டுகிறது; கடவுளின் வாய் என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள ‘அவன்/தன் வாய்’ யாரைக் குறிக்கிறது?
  choice: தீயவனுடைய வாய்
  alternative: கடவுளுடைய வாய்
  rationale: உடனடியான இலக்கண முன்னிலை ஒருமையில் குறிப்பிடப்படும் தீயவன் என்பதால் முதன்மை உரையில் அதையே வைத்திருக்கிறது. எனினும் ‘அவருடைய வாயின் மூச்சு’ தெய்வீக நியாயத்தீர்ப்பைக் குறிக்கக்கூடிய பயன்பாடு வேறு இடங்களில் இருப்பதால், கடவுளைக் குறிக்கும் வாசிப்பை அடிக்குறிப்பில் விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவிதைத் தன்மையும் கொண்ட நடை. ‘தீச்சுடர்,’ ‘தளிர்கள்,’ ‘வாயின் மூச்சு’ ஆகியவை எபிரேய உருவகங்களைக் காக்கின்றன. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
