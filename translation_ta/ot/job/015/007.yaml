source:
  edition: WLC
  text: הֲ/רִאישׁ֣וֹן אָ֭דָם תִּוָּלֵ֑ד וְ/לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: ta
  text: நீ முதல் மனிதனாகப் பிறந்தாயா? குன்றுகளுக்கு முன்பே நீ பிறப்பிக்கப்பட்டாயா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן
  choice: முதல் ... ஆக
  rationale: வினாவிடை எதிர்பாராத வினாவை הֲ குறிக்கிறது; רִאשׁוֹן காலத்திலும் வரிசையிலும் முதன்மையைச் சுட்டுகிறது. தமிழில் אָדָם என்பதுடன் இணைந்த பயனிலைப் பொருளை இயல்பாகக் காட்ட “முதல் மனிதனாக” என மொழிபெயர்க்கப்பட்டது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: இங்கு எலிப்பாசின் வினாவில் வரும் ஒருமைச் சொல் பொதுவாக “மனிதன்” என்று பொருள்பட்டு, “முதல் மனிதன்” என்ற கருத்தைத் தருகிறது. அது ஆதாமைக் குறிப்பால் நினைவூட்டக்கூடும்; ஆனால் மூலத்தில் இது கட்டாயமாக இயற்பெயராக இல்லை.
- source_word: תִּוָּלֵד
  choice: நீ பிறந்தாயா
  rationale: ילד என்பதன் நிஃபால் வடிவம் வழக்கமாக “பிறத்தல்” என்று பொருள்படும்; தமிழில் இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְ/לִ/פְנֵי
  choice: '...க்கு முன்பே'
  rationale: இணைப்புச் சொல்லோடு சேர்ந்த முன்னிடைச்சொல் இரண்டாவது இணை வினாவை அறிமுகப்படுத்துகிறது. “முன்பே” என்பது கால முன்னுரிமையையும் வினாவின் அழுத்தத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: גְבָעוֹת
  choice: குன்றுகள்
  rationale: இந்தச் சொல் குன்றுகளைக் குறிக்கிறது; ஞான இலக்கியக் கவிதையில் அது படைப்பின் தொன்மையான நிலத்தோற்றத்தை நினைவூட்டுகிறது. நேரடியான கவித்துவப் படிமம் காக்கப்பட்டது.
- source_word: חוֹלָלְתָּ
  choice: நீ பெற்றெடுக்கப்பட்டாயா
  rationale: இந்த வினை பிறப்பித்தல் அல்லது பெற்றெடுத்தலைக் குறிக்கும் பிறப்புப் படிமத்தைக் கொண்டது. முதல் வினைச்சொல்லின் “பிறந்தாயா” என்பதிலிருந்து வேறுபாட்டையும் மூலத்தின் செயப்பாட்டு நுணுக்கத்தையும் இது காக்கிறது.
theological_decisions:
- issue: אָדָם என்பதை ஆதாம் என்ற இயற்பெயராக வாசிப்பதா, பொதுப்பெயரான “மனிதன்” என்று வாசிப்பதா
  choice: “முதல் மனிதன்” என்ற தொடரில் பொதுப்பெயரான “மனிதன்”
  alternative: “முதல் மனிதனான ஆதாம்”
  rationale: இந்த வசனம் தொன்மையையும் ஆதிகால ஞானத்தையும் குறித்து சவால்விடும் சொல்லாட்சியாக உள்ளது. “முதல் மனிதன்” என்பது ஆதாமை நினைவூட்டலாம்; எனினும் எபிரெயச் சொல் இங்கு இயற்பெயராகவே இருக்க வேண்டும் என்று கட்டாயப்படுத்தவில்லை. எனவே மூலத்தின் தெளிவின்மையை முதன்மை உரையிலும் அடிக்குறிப்பிலும் காத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரண்டு சொல்லாட்சிகளின் வேறுபாட்டைக் காக்க “பிறந்தாயா” மற்றும் “பெற்றெடுக்கப்பட்டாயா” எனத் தனித்தனியாக வழங்கப்பட்டுள்ளது.
