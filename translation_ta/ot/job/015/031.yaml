translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநயமும் எச்சரிக்கையின் கண்ணியமான தொனியும் காக்கப்பட்டுள்ளன. ‘கைம்மாறு’ இலக்கியத் தன்மை கொண்டாலும் பொதுவாகப் புரிந்துகொள்ளக்கூடியது; மூலத்தின் ‘திரும்பப் பெறுவது/மாற்றீடு’ என்ற கருத்தைத் தக்கவைக்கிறது.
