source:
  edition: WLC
  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: ta
  text: அவன் வெறுமையை நம்பி வழிதவற வேண்டாம்[a]; ஏனெனில் வெறுமையே அவனுக்குக் கைம்மாறாகக் கிடைக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுமையை நம்பி, தன்னையே ஏமாற்றிக்கொள்ள வேண்டாம்.” எபிரெய வினைச்சொல் “வழிதவறுதல்,” “தவறாக வழிநடத்தப்படுதல்,” அல்லது “ஏமாந்துபோதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வெறுமை” என மொழிபெயர்க்கப்பட்ட שָׁוְא என்ற எபிரெயச் சொல் “வீண்தன்மை,” “பொய்மை,” அல்லது “பயனின்மை” என்றும் பொருள்படும். மூலத்தில் அதே சொல் இருமுறை வருகிறது; தமிழிலும் அந்த மறுபயன்பாடு காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: நம்பி ... வேண்டாம்
  rationale: அமன் என்பதன் ஹிப்ஈல் வடிவம் இங்கு ஒன்றின்மேல் நம்பிக்கை வைப்பதைக் குறிக்கிறது; אַל உடன் வரும் எச்சரிக்கை அல்லது தடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַשָּׁוְא / שָׁוְא
  choice: வெறுமை / வெறுமையே
  rationale: שָׁוְא என்பதன் வெறுமை, வீண் தன்மை, பொய்மை, பயனின்மை ஆகிய பொருள் பரப்பில் ‘வெறுமை’ மூலத்தின் உருவகத்தையும் இருமுறை வரும் சொல்லாட்சியையும் காக்கிறது.
- source_word: נִתְעָה
  choice: தன்னையே ஏமாற்றிக்கொள்ள
  rationale: תעה என்பதன் நிஃபால் வடிவம் ‘வழிதவறுதல்,’ ‘தவறாக வழிநடத்தப்படுதல்,’ அல்லது ‘ஏமாந்திருத்தல்’ எனப் பொருள்படலாம். சூழலில் தன்னைத் தானே ஏமாற்றிக்கொள்வது என்ற வாசிப்பு இயல்பானது; பிற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தையும் அதன் விளைவையும் அறிமுகப்படுத்துகிறது.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: அவனுக்குக் கைம்மாறாகக் கிடைக்கும்
  rationale: תְּמוּרָה என்பது மாற்றீடு, பரிமாற்றம், அல்லது திரும்பக் கிடைப்பது என்பதைக் குறிக்கலாம்; ‘கைம்மாறாகக் கிடைக்கும்’ என்பது கவிதைச் சூழலில் அவன் பெறும் விளைவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
