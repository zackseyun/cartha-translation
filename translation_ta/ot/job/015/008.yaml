  text: הַ/בְ/ס֣וֹד אֱל֣וֹהַ תִּשְׁמָ֑ע וְ/תִגְרַ֖ע אֵלֶ֣י/ךָ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: ta
  text: நீ கடவுளின் ஆலோசனை மன்றத்தில்[a] செவிகொடுத்தாயா? ஞானத்தை உனக்கே மட்டும் ஒதுக்கிவைத்தாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் மறைவான ஆலோசனையில்” அல்லது “கடவுளின் இரகசியத்தில்.” எபிரெயச் சொல் סוֹד நம்பிக்கைக்குரியோரின் நெருக்கமான வட்டம், மறைவான ஆலோசனை, அல்லது இரகசியம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: ஆலோசனை மன்றத்தில்
  rationale: סוֹד என்பது நெருக்கமானோர் கூடும் மறைவான ஆலோசனைக் குழு, அதன் ஆலோசனை, அல்லது இரகசியம் ஆகியவற்றைக் குறிக்கலாம். இங்கு கடவுளின் உள்ளார்ந்த ஆலோசனையில் யோபு பங்குகொண்டதாகக் கூறும் கேலிவினா அமைந்திருப்பதால், ‘ஆலோசனை மன்றம்’ அந்தக் காட்சியைத் தெளிவாகத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: אֱלוֹהַ
  choice: கடவுள்
  rationale: யோபு நூலில் அடிக்கடி வரும் கடவுளைக் குறிக்கும் ஒருமைச் சொல்; நவீன பொதுத்தமிழில் இயல்பான இணை.
- source_word: תִּשְׁמָע
  choice: செவிகொடுத்தாயா
  rationale: שׁמע கேட்டல் அல்லது கவனமாகச் செவிகொடுத்தலைக் குறிக்கும். ஆலோசனை மன்றத்தின் சூழலில் கவனித்துக் கேட்டல் என்ற நுண்பொருளை ‘செவிகொடுத்தாயா’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְ/תִגְרַע
  choice: மட்டுப்படுத்திக்கொண்டாயா
  rationale: גרע என்பதன் அடிப்படைப் பொருள் குறைத்தல், தடுத்துவைத்தல் அல்லது வரம்பிடுதல். இங்கு ஞானத்தைத் தனக்குள் மட்டும் அடக்கிவைத்துக்கொண்டதாகக் கேட்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உனக்குள் மட்டுமே
  rationale: இரண்டாம் நபர் ஒருமையை நோக்கிய உறவைச் சுட்டுகிறது. சூழலில் ஞானத்தைத் தனக்கே உரியதாக வரம்பிடும் பிரத்தியேகப் பொருளை ‘உனக்குள் மட்டுமே’ தெளிவுபடுத்துகிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: חָכְמָה என்பதற்கான நிலையான, இயல்பான தமிழ் இணை; இங்கு பொதுவான அறிவாற்றல் அல்லது ஆழ்ந்த புரிதலைக் குறிக்கிறது.
theological_decisions:
- issue: யோபு நூலின் வாதச்சூழலில் கடவுளுடைய סוֹד என்பதன் பொருள்
  choice: கடவுளின் ‘ஆலோசனை மன்றம்’ என்று மொழிபெயர்த்து, கடவுளின் உள்ளார்ந்த ஆலோசனையில் பங்கேற்கும் காட்சியைப் பேணுதல்
  alternative: கடவுளின் இரகசியம்; கடவுளின் இரகசிய ஆலோசனை
  rationale: யோபுக்குக் கடவுளின் மறைவான தீர்மானங்களை அறியும் சிறப்பு அணுகல் இருப்பதை எலிப்பாஸ் கேலியாகக் கேள்வி கேட்கிறான். ‘ஆலோசனை மன்றம்’ என்பது பரலோக ஆலோசனைக் கூடத்தின் சாத்தியமான உருவகத்தைப் பேணுகிறது; ‘இரகசியம்’ என்ற உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான வினா நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இணையான கேலிவினாக்களும் தனித்தனி வாக்கியங்களாக வைக்கப்பட்டுள்ளன. ‘ஆலோசனை மன்றம்’ மூலத்தின் உருவகத்தைப் பேணுகிறது; ‘உனக்குள் மட்டுமே மட்டுப்படுத்திக்கொண்டாயா’ என்பது גרע + אֵלֶיךָ அமைப்பின் சற்றே கடினமான ஆனால் முக்கியமான ‘ஞானத்தைத் தனக்குள் வரம்பிடுதல்’ என்ற பதற்றத்தைத் தீர்த்துவிடாமல் தெரிவிக்கிறது.
