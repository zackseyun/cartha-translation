source:
  edition: WLC
  text: אֲשֶׁר חֲכָמִ֥ים יַגִּ֑ידוּ וְ/לֹ֥א כִֽ֝חֲד֗וּ מֵ/אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: ta
  text: ஞானிகள் அறிவிப்பதையும், தங்கள் தந்தையரிடமிருந்து மறைக்காததையும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் தந்தையர் மறைக்காததையும்”; அல்லது, “தங்கள் தந்தையரிடமிருந்து பெற்ற எதையும் அவர்கள் மறைக்காததையும்.” “மறைத்தல்” என்பதற்கும் “தங்கள் தந்தையர்” என்பதற்கும் இடையிலான தொடர்பை எபிரெய மொழியில் ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: …தையும்
  rationale: முந்தைய வசனத்தில் கூறப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் தொடர்புப்பெயரைக் தமிழில் இயல்பான இணை வினையெச்சப் பெயராக்கமாக வெளிப்படுத்துகிறது.
- source_word: חֲכָמִים
  choice: ஞானிகள்
  rationale: மரபுவழி ஞானத்தை எடுத்துரைக்கும் ஞானமுள்ள மனிதர்களைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: יַגִּידוּ
  choice: அறிவித்ததையும்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், அறிவித்தல்’ என்ற பொருளைத் தருகிறது; பெற்ற ஞானத்தை வெளிப்படையாக எடுத்துரைப்பதற்கு ‘அறிவித்தல்’ பொருத்தமானது.
- source_word: וְלֹא כִחֲדוּ
  choice: மறைக்காததையும்
  rationale: இணைப்பையும் மறுப்பையும் காத்து, כחד என்பதன் ‘மறைத்தல்/ஒளித்தல்’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מֵאֲבוֹתָם
  choice: தங்கள் தந்தையரிடமிருந்து
  rationale: מִן என்ற முன்னிடைச்சொல்லின் ‘இருந்து’ என்ற வடிவத்தையும் אבותם என்பதன் சொல்லமைப்பையும் நெருக்கமாகக் காக்கிறது; இங்கு ‘தந்தையர்’ என்பது முன்னோர்களையும் குறிக்கக்கூடும்.
theological_decisions:
- issue: מֵאֲבוֹתָם என்பது כִחֲדוּ உடன் எவ்வாறு தொடர்புபடுகிறது
  choice: தங்கள் தந்தையரிடமிருந்து மறைக்காததையும்
  alternative: தங்கள் தந்தையர் மறைக்காமல் தெரிவித்ததையும்; அல்லது தங்கள் தந்தையரிடமிருந்து பெற்ற எதையும் மறைக்காமல் அறிவித்ததையும்
  rationale: எபிரெய வாக்கியம் சுருக்கமானது. ‘தந்தையர்’ மறைக்கப்பட்டவர்களா, மறைக்காமல் சொன்னவர்களா, அல்லது மரபின் மூலமா என்பது இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்டவாறு புரிந்துகொள்ளப்படலாம். முதன்மை உரை எபிரெயச் சொற்தொடரின் நெருக்கத்தையும் அதன் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு முக்கிய மாற்றுப் புரிதல்களைக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் தொடர்ச்சியான துணைவாக்கியம் என்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘தந்தையர்’ என்ற சொல் நேரடி சொற்பொருளைக் காத்தபடியே இச்சூழலில் முன்னோர்களையும் உள்ளடக்கக்கூடியது.
