  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு எபிரெயத்தின் தொடர்ச்சியான காட்சியை நன்றாகப் பிரதிபலிக்கிறது: அழிவுற்ற நகரங்கள், குடியிருப்பற்ற வீடுகள், பின்னர் குவியலாகும் நிலை. ஆனால் גַּלִּים என்பதற்கு ‘கற்குவியல்கள்’ என்பது தேவையற்ற அளவு குறிப்பானது; அது பொதுவாக இடிபாடுகள்/குவியல்களைக் குறிக்கலாம். இறுதிச் சொற்றொடரையும் ‘குறிக்கப்பட்டிருந்தன’ என்பதற்குப் பதிலாக எதிர்கால விளைவுக்கென ஒதுக்கப்பட்ட நிலையைச் சற்று நேரடியாகக் காட்டலாம்.'
