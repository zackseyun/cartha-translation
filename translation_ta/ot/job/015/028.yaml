base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: ta
  text: அவன் பாழடைந்த நகரங்களிலும், யாரும் குடியிராத வீடுகளிலும் குடியிருந்தான்; அவை இடிபாடுக் குவியல்களாக மாறுவதற்கு ஒதுக்கப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவன் அழிக்கப்பட்ட நகரங்களிலும், அவர்கள் குடியிராத வீடுகளிலும் குடியிருந்தான்; அவை குவியல்களுக்கென ஆயத்தப்படுத்தப்பட்டிருந்தன.” இவ்வசனத்தின் எபிரெய வாசகம் சுருக்கமானது; குறிப்பாக நடுப்பகுதி, ஒன்றுக்கொன்று நெருக்கமான பல மொழிபெயர்ப்புகளுக்கு இடமளிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: குடியிருந்தான்
  rationale: שכן என்பதன் அடிப்படைப் பொருள் ‘குடியிருத்தல்/வசித்தல்’. எபிரெய வினை வடிவின் எளிய இறந்தகாலச் சொல்லோட்டத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עָרִים נִכְחָדוֹת
  choice: அழிந்துபோன நகரங்கள்
  rationale: נכחדות என்பது அழிக்கப்பட்ட, இல்லாமற்போன அல்லது பாழடைந்த நிலையை உணர்த்தும் செயப்பாட்டு எச்சம். இணைவரியில் வரும் கைவிடப்பட்ட வீடுகளோடும் கற்குவியல்களோடும் ‘அழிந்துபோன’ நன்றாகப் பொருந்துகிறது.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: யாரும் குடியிராத வீடுகள்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் பொருளில் சற்றுக் கடினமானதும் ஆகும். குடியிருப்போர் இல்லாத வீடுகள் என்ற மையப் பொருளைத் தெளிவாகத் தருகிறது; לָמוֹ பின்னொட்டின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: குறிக்கப்பட்டிருந்தன
  rationale: עתד என்பதன் ஹித்பயேல் வடிவம் ஆயத்தப்படுத்தப்படுதல், நியமிக்கப்படுதல் அல்லது ஒரு முடிவுக்கெனக் குறிக்கப்படுதல் எனப் பொருள்படலாம். இங்கு வரவிருக்கும் பாழ்நிலைக்கென ஒதுக்கப்பட்டிருப்பதை ‘குறிக்கப்பட்டிருந்தன’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְגַלִּים
  choice: கற்குவியல்களாகும்படி
  rationale: גַּלִּים என்பது கற்கள் அல்லது இடிபாடுகளின் குவியல்களைக் குறிக்கிறது. நகரங்களும் வீடுகளும் இடிந்து குவியல்களாகும் விளைவை இச்சொல் தெளிவாக்குகிறது.
