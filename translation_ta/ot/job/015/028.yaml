translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குடியிருந்தான்’ என்பது மூலத்தின் எளிய வினைநிலையைப் பேணுகிறது; ‘கற்குவியல்கள்’ என்பது இடிபாடுகளின் குவியல் என்ற காட்சியைப் பொதுவாசகருக்குத் தெளிவாக்குகிறது. பிரதான உரையிலுள்ள [a] குறி மாற்று வாசிப்புக்கான அடிக்குறிப்புடன் பொருந்துகிறது.
