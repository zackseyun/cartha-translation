base_translation:
  language: en
  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: ta
  text: உன் வாயே உன்னைக் குற்றவாளி எனத் தீர்ப்பளிக்கிறது; நான் அல்ல. உன் உதடுகளே உனக்கு எதிராகச் சாட்சி கூறுகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உதடுகளே உனக்கு எதிராகப் பதில் கூறுகின்றன.” இங்குள்ள எபிரெய வினைச்சொல்லுக்கு இன்னும் நேரடியாக “பதில் கூறுதல்” என்று பொருள் கொள்ளலாம்; ஆனால் இச்சூழலில் அது சாட்சி கூறும் கருத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: உன்னைக் குற்றவாளி என்று தீர்க்கிறது
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் ஒருவரைக் குற்றவாளி என்று அறிவிப்பதையோ தீர்ப்பதையோ குறிக்கிறது. நீதிமன்றச் சாயலைத் தெளிவாகவும் இயல்பான தமிழிலும் இது தருகிறது.
- source_word: פִיךָ
  choice: உன் வாயே
  rationale: எபிரெயத்தில் நேரடியாக ‘உன் வாய்.’ ‘-ஏ’ என்னும் வலியுறுத்தல், எலிப்பாசு அல்ல, யோபுவின் சொந்தப் பேச்சே அவனைக் குற்றப்படுத்துகிறது என்ற எதிர்மறை ஒப்புமையை வெளிப்படுத்துகிறது.
- source_word: וְלֹא אָנִי
  choice: நான் அல்ல
  rationale: முந்தைய கூற்றுடன் உள்ள நேரடியான முரணையும் எபிரெயத்தின் சுருக்கமான வலியுறுத்தலையும் காக்கிறது.
- source_word: וּשְׂפָתֶיךָ
  choice: உன் உதடுகளே
  rationale: ‘உன் உதடுகள்’ என்பதே நேரடிப் பொருள். ‘-ஏ’ என்பது முதல் அடியின் இணையான வலியுறுத்தலையும் தன்னையே குற்றப்படுத்தும் பேச்சையும் காட்டுகிறது.
- source_word: יַעֲנוּ
  choice: சாட்சி கூறுகின்றன
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதில் கூறுதல்’ என்றாலும், இங்கு குற்றத் தீர்ப்புடன் இணைந்த நீதிமன்றச் சூழலில் ‘சாட்சி கூறுதல்’ இயல்பாகப் பொருந்துகிறது; மூலத்தின் சாத்தியமான நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָךְ
  choice: உனக்கு எதிராக
  rationale: சாட்சியளிக்கும் நீதிமன்றச் சூழலில் בְ எதிர்மறை உறவைக் குறிக்கிறது; யோபுவின் சொற்களே அவனுக்கு எதிரான சாட்சியாகின்றன.
