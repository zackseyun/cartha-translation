  terminology: The revised “குற்றவாளி எனத் தீர்ப்பளிக்கிறது” retains the legal sense without importing theological interpretation. “சாட்சி கூறுகின்றன” suitably expresses the contextual forensic nuance, with the lexical alternative footnoted.
