base_translation:
  language: en
  yaml_path: translation/ot/job/015/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: ta
  text: 'அப்போது தேமானியனாகிய எலிப்பாஸ் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்ற வினை இங்கு உரையாடலில் முந்தைய பேச்சுக்குப் பதிலளிப்பதைக் குறிக்கிறது. அதைத் தொடர்ந்து אמר வருவதால், இரு வினைகளின் கூட்டு உரையாடல் சூத்திரத்தையும் இயல்பான தமிழில் ஒருங்கிணைத்துள்ளது.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழின் வழக்கமான வேதாகமப் பெயரெழுத்து முறைக்கு ஏற்ப எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַתֵּימָנִי
  choice: தேமானியனான
  rationale: தேமான் என்ற இடத்தைச் சேர்ந்தவர் என்பதைச் சுட்டும் இனவிடப் பெயரடை; எலிப்பாஸை அடையாளப்படுத்தும் இயல்பான தமிழ்ச் சொல்லாக்கம்.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, அடுத்துவரும் உரையை அறிமுகப்படுத்தும் தமிழ் விவரணைச் சூத்திரமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் உரையாடலின் அடுத்த கட்டத்தைக் குறிக்கிறது; நவீனத் தமிழில் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. எபிரெயத்தின் ‘பதிலளித்து சொன்னான்’ என்ற இரட்டை வினைச் சூத்திரம், தமிழில் செயற்கையாக ஒலிக்காமல் இருக்க ‘மறுமொழியாகச் சொன்னது’ என ஒருங்கிணைக்கப்பட்டுள்ளது; ‘சொன்னது:’ அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்துகிறது.
