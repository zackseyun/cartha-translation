translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபு நூலின் கவித்துவமான, கண்ணியமான நடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. அரிதான כידור என்பதன் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
