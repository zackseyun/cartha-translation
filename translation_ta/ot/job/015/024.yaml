  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְֽ֭בַעֲתֻ/הוּ צַ֣ר וּ/מְצוּקָ֑ה תִּ֝תְקְפֵ֗/הוּ כְּ/מֶ֤לֶךְ עָתִ֬יד לַ/כִּידֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: ta
  text: நெருக்கடியும் வேதனையும் அவனைத் திகிலடையச் செய்கின்றன; போருக்கு[a] ஆயத்தமாயிருக்கும் ஓர் அரசனைப்போல் அவை அவனை வென்றடக்குகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாக்குதலுக்கு ஆயத்தமாயிருக்கும்.’ ‘போர்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அது இன்னும் குறிப்பாக ஆயுதத் தாக்குதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: அவனைத் திகிலடையச் செய்கின்றன
  rationale: பיעל வடிவம் திடீர் பேரச்சத்தை உண்டாக்கும் வலுவான காரணவினைப் பொருளைத் தருகிறது; இத்தமிழாக்கம் அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צַר
  choice: நெருக்கடி
  rationale: இச்சொல் நெருக்குதல், இடுக்கண், துன்பம் ஆகிய பொருள்களைக் கொண்டது; இணைச்சொல்லான מְצוּקָה உடன் வரும் சூழலில் ‘நெருக்கடி’ பொருத்தமானது.
- source_word: מְצוּקָה
  choice: வேதனை
  rationale: கடுமையான அழுத்தம் அல்லது இடுக்கணால் ஏற்படும் துயரைச் சுட்டுகிறது; ‘நெருக்கடி’ என்பதுடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து கவிதை இணைநிலையைப் பேணுகிறது.
- source_word: תִּתְקְפֵהוּ
  choice: அவை அவனை வென்றடக்குகின்றன
  rationale: תקף என்பதன் மேலோங்கி வெல்லுதல் அல்லது வலிமையால் அடக்குதல் என்ற பொருளை ‘வென்றடக்குகின்றன’ தெளிவாகக் காட்டுகிறது. எபிரெய வினை பெண்பால் ஒருமையில் இருந்தாலும், முன்வரும் இரு பெயர்களையும் கூட்டுப் பொருளாகத் தமிழ் பன்மையில் இயல்பாகக் காட்டுகிறது.
- source_word: כְּמֶלֶךְ
  choice: ஓர் அரசனைப்போல்
  rationale: כְּ என்ற ஒப்புமையையும் מֶלֶךְ என்ற பெயரையும் இயல்பான நவீனத் தமிழில் நேராகப் பேணுகிறது.
- source_word: עָתִיד
  choice: ஆயத்தமாயிருக்கும்
  rationale: இச்சூழலில் ‘தயாராக/ஆயத்தமாக இருக்கும்’ என்பதே பொருத்தமான பொருள்; கவிதை நடைக்கு ‘ஆயத்தமாயிருக்கும்’ ஏற்றது.
- source_word: לַכִּידוֹר
  choice: போருக்கு
  rationale: כידור அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான சொல். இவ்வுவமையில் பொதுவான படைமோதலைக் குறிக்கும் ‘போர்’ தெளிவான முதன்மை வாசகம்; குறிப்பான ‘தாக்குதல்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
