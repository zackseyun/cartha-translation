  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: ta
  text: மனிதன்[a] எம்மாத்திரம்—அவன் தூயவனாக[b] இருக்க? அல்லது பெண்ணுக்குப் பிறந்தவன் எம்மாத்திரம்—அவன் நீதிமானாக[c] இருக்க?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதர்’ அல்லது ‘மரணத்திற்குட்பட்ட மனிதன்’ என்றும் பொருள்கொள்ளலாம். எபிரெய ஒருமைச் சொல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘களங்கமற்றவனாக’ அல்லது ‘குற்றமற்றவனாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தூய்மை அல்லது குற்றமின்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சரியானவன் எனக் கருதப்பட’ அல்லது ‘நீதியுள்ளவன் என ஏற்கப்பட’ என்றும் பொருள்கொள்ளலாம். எபிரெயச் சொல் ஒழுக்கநிலை மற்றும் நீதிமன்றநிலை ஆகிய இரு நுணுக்கங்களையும் தாங்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: மனிதன் எம்மாத்திரம்
  rationale: இது மனிதனின் தன்மை அல்லது தகுதியைக் குறித்து வினவும் சொல்லாட்சியுடைய கேள்வி. ‘எம்மாத்திரம்’ என்பது மָה என்பதன் வலிமையைத் தக்கவைத்து, மனித பலவீனத்தைக் குறிக்கும் אֱנוֹשׁ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִזְכֶּה
  choice: தூயவனாக இருக்க
  rationale: זכה வினை இங்கு தூய்மை, களங்கமின்மை அல்லது குற்றமின்மை ஆகியவற்றை உள்ளடக்கலாம். ‘தூயவன்’ அதன் விரிந்த ஒழுக்கநிலை சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְכִי
  choice: பெண்ணிடம் பிறந்தவனும்
  rationale: இணையான இரண்டாம் வினாவை எபிரெய வாவ் இணைக்கிறது. தமிழில் ‘-உம்’ சேர்ப்பது அந்த இணைப்பை இயல்பாகக் காட்டுகிறது; அதை கட்டாயமான மாற்றுத் தேர்வாகப் பொருள்கொள்ளவில்லை.
- source_word: יִצְדַּק
  choice: நீதிமானாக இருக்க
  rationale: צדק என்பதன் நிலைசார் பொருளான நீதியுள்ளவனாக அல்லது சரியான நிலையில் இருப்பதை இது வெளிப்படுத்துகிறது; தொழில்நுட்பமான ‘நீதிமானாக்கப்படுதல்’ என்ற பிற்கால இறையியல் பொருளைத் திணிப்பதில்லை.
- source_word: יְלוּד אִשָּׁה
  choice: பெண்ணிடம் பிறந்தவன்
  rationale: மனிதப் பிறப்பையும் மரணத்திற்குட்பட்ட மனித நிலையையும் குறிக்கும் எபிரெய மரபுத்தொடரின் ஒருமை வடிவத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: אֱנוֹשׁ மற்றும் יְלוּד אִשָּׁה ஆகியவற்றின் மனிதகுலம் முழுவதையும் குறிக்கும் பரப்பு
  choice: ‘மனிதன்’ மற்றும் ‘பெண்ணிடம் பிறந்தவன்’ என்ற பிரதிநிதித்துவ ஒருமை
  alternative: ‘மனிதர்’ அல்லது ‘பெண்ணிடம் பிறந்த எவரும்’ என்ற வெளிப்படையான பொதுமை
  rationale: எபிரெய உரை இலக்கண ஒருமையைப் பயன்படுத்தினாலும் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. தமிழ் ஒருமை வடிவம் கவிதைநயத்தையும் மூலத்தின் வடிவத்தையும் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொதுவான பரப்பைத் தெளிவுபடுத்துகிறது.
- issue: יִצְדַּק என்பதிலுள்ள ஒழுக்கநிலை மற்றும் நீதிமன்றநிலை நுணுக்கம்
  choice: ‘நீதிமானாக இருக்க’
  alternative: ‘நியாயமானவன் என்று தீர்க்கப்பட’ அல்லது ‘சரியானவனாக இருக்க’
  rationale: இவ்வசனம் மனித தூய்மையையும் நீதிநிலையையும் இணையாக வினவுகிறது. ஆகவே பரந்த நிலைசார் சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது; குறிப்பிட்ட நீதிமானாக்குதல் கோட்பாடு உரைக்குள் சேர்க்கப்படவில்லை.
