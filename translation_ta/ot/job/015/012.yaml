lexical_decisions:
- source_word: מַה
  choice: ஏன்
  rationale: சொல்லடிப்படையில் ‘என்ன’ என்றாலும், இங்கு காரணத்தையோ உள்நோக்கத்தையோ வினவும் சொல்லாட்சியாக இருப்பதால் இயல்பான தமிழில் ‘ஏன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִקָּחֲךָ
  choice: உன்னை இழுத்துச் செல்கிறது
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. ‘உன் இதயம்’ எழுவாயாக வரும் இவ்விடத்தில், ஒருவருடைய உள்ளம் அவரைத் தன் போக்கில் கொண்டுசெல்வதைக் குறிக்கும் உருவகத்தை ‘இழுத்துச் செல்கிறது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבֶּךָ
  choice: உன் இதயம்
  rationale: எபிரெய மொழியில் ‘இதயம்’ சிந்தனை, உணர்வு உள்ளிட்ட அகமனிதனைக் குறிக்கலாம். உருவகம் தமிழிலும் புரியக்கூடியதால் நேரடிச் சொல் தக்கவைக்கப்பட்டது.
- source_word: וּמַה
  choice: ஏன்
  rationale: இணைப்புச்சொல்லுடன் வரும் இரண்டாவது מַה-வும் இங்கு காரணத்தை வினவும் சொல்லாட்சியாக உள்ளது; தனித்தனி இயல்பான தமிழ் வினாக்களாக அமைத்ததால் ‘உம்/மேலும்’ வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: יִרְזְמוּן
  choice: அப்படி மினுங்குகின்றன
  rationale: இந்த அரிய வினைச்சொல்லின் துல்லியமான நுட்பம் உறுதியற்றது. கண்களின் தீவிரமான அல்லது எதிர்ப்பான வெளிப்பாட்டைச் சூழலில் உணர்த்த ‘மினுங்குகின்றன’ தேர்ந்தெடுக்கப்பட்டது; ஐயப்பாடும் மாற்றுப் பொருள்களும் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: עֵינֶיךָ
  choice: உன் கண்கள்
  rationale: எபிரெய உரையின் உடல்சார்ந்த படிமத்தை இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
