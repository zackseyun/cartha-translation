  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: ta
  text: உன் இதயம் ஏன் உன்னை இழுத்துக்கொண்டு செல்கிறது? உன் கண்கள் ஏன் மின்னுகின்றன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிமிட்டுகின்றன,’ ‘சைகை செய்கின்றன,’ அல்லது ஒருவேளை ‘உருளுகின்றன’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெய வினைச்சொல் அரிதானது; அதன் துல்லியமான பொருள்நுட்பம் உறுதியற்றது.
