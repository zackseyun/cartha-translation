  text: יַחְמֹ֣ס כַּ/גֶּ֣פֶן בִּסְר֑/וֹ וְ/יַשְׁלֵ֥ךְ כַּ֝/זַּ֗יִת נִצָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: ta
  text: திராட்சைக்கொடியைப் போல அவன் தன் பழுக்காத திராட்சைக் காய்களை உதிர்த்துவிடுவான்[a]; ஒலிவ மரத்தைப் போல அவன் தன் பூக்களை உதிர்த்துவிடுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சைக்கொடியைப் போல அவன் தன் பழுக்காத திராட்சைக் காய்களைப் பறித்துவிடுவான்.” எபிரெய வினைச்சொல் பல இடங்களில் வன்முறையாகப் பறித்தல் அல்லது சூறையாடுதல் என்ற வலுவான பொருளைக் கொண்டது; இங்கு வேளாண் உருவகம், காய் முதிர்வதற்கு முன்பே இழக்கப்படுவதைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூப்பை” அல்லது “மலர்ச்சியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: உதிர்த்துப்போடுவான்
  rationale: இந்த வினை பொதுவாக வன்முறை, பறித்தல், சூறையாடுதல் ஆகிய வலுவான பொருள்களைக் கொண்டது. ஆனால் பழுக்காத திராட்சைக் காய்கள் குறித்த வேளாண் உருவகத்தில், அவை முதிர்வதற்கு முன்பே கொடியிலிருந்து அகற்றப்படுவதை இயல்பான தமிழில் ‘உதிர்த்துப்போடுவான்’ எனக் கூறுவது பொருத்தமானது; வலுவான ‘பறித்துப்போடுவான்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּגֶּפֶן
  choice: திராட்சைக்கொடி ... போல்
  rationale: כ முன்னொட்டின் ஒப்புமையையும் גפן என்பதன் வழக்கமான பொருளாகிய திராட்சைக்கொடியையும் தெளிவாகக் காட்டுகிறது.
- source_word: בִּסְרוֹ
  choice: தன் பழுக்காத திராட்சைக் காய்களை
  rationale: בֹּסֶר என்பது இன்னும் பழுக்காத திராட்சைக் காயைக் குறிக்கிறது. எபிரெயச் சொல்லிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி ‘தன்’ என்பதால் தக்கவைக்கப்படுகிறது.
- source_word: וְיַשְׁלֵךְ
  choice: உதிர்த்துப்போடுவான்
  rationale: שלך என்பதன் அடிப்படை உணர்வு எறிதல் அல்லது வீசுதல். மரத்தின் பூக்கள் காலத்துக்கு முன் அகலும் உருவகத்தில், இயல்பான தமிழில் ‘உதிர்த்துப்போடுதல்’ என்பது செயப்படுத்தும் வலிமையையும் வேளாண் படிமத்தையும் இணைக்கிறது.
- source_word: כַּזַּיִת
  choice: ஒலிவ மரம் ... போல்
  rationale: זית என்பது ஒலிவப் பழத்தையோ ஒலிவ மரத்தையோ குறிக்கலாம்; பூக்களை உதிர்க்கும் ஒப்புமை இங்கு மரத்தையே தெளிவாகக் குறிக்கிறது.
- source_word: נִצָּתוֹ
  choice: தன் பூக்களை
  rationale: இந்தப் பெயர்ச்சொல் தாவரத்தின் பூ, பூப்பு அல்லது மலர்ச்சியைக் குறிக்கிறது. சாதாரண நவீன தமிழில் ‘பூக்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
