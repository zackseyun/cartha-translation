  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: ta
  text: அவர்களுக்கு மட்டுமே நாடு கொடுக்கப்பட்டது[a]; அந்நியன் ஒருவனும் அவர்கள் நடுவே கடந்துசெல்லவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாடு’ என்பதற்குப் பதிலாக ‘பூமி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் אֶרֶץ இவ்விரு பொருள்களையும் தரக்கூடும்; ஆனால் ஒரு மக்களுக்கு மட்டும் கொடுக்கப்பட்ட பிரதேசத்தை இச்சூழல் குறிப்பிடுவதால் ‘நாடு’ என்பது முன்னுரிமை பெறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்நியர் எவரும் அவர்கள் நடுவில் கடந்து செல்லவில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: அவர்களுக்கு மட்டுமே
  rationale: இரு சொற்களும் சேர்ந்து நிலம் அவர்களுக்கே தனிப்பட்ட முறையில் வழங்கப்பட்டதைக் கூறுகின்றன. ‘அவர்களுக்கு மட்டுமே’ என்பது இந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: נִתְּנָה
  choice: கொடுக்கப்பட்டது
  rationale: נתן என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு வினையாக உள்ளது; ஆகவே எபிரெய உரையின் செயப்பாட்டு அமைப்பு காக்கப்படுகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: אֶרֶץ என்பது ‘நாடு/நிலம்’ அல்லது ‘பூமி’ எனப் பொருள்படலாம். ஒரு மக்களுக்கு மட்டும் கொடுக்கப்பட்ட பிரதேசத்தையும் அந்நியர்கள் நுழையாத நிலையையும் சூழல் குறிப்பிடுவதால் ‘அந்த நாடு’ இயல்பாகப் பொருந்துகிறது.
- source_word: זָר
  choice: அந்நியன்
  rationale: זָר என்பது அந்தக் குழுவைச் சாராத ஒருவரை, அதாவது அந்நியரையோ வெளியாளையோ குறிக்கிறது. ‘அந்நியன்’ கவிதைநடையையும் சமூக வேறுபாட்டையும் காக்கிறது; இனத்தையோ நாட்டினத்தையோ தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: עָבַר בְּתוֹכָם
  choice: அவர்கள் நடுவே கடந்துசெல்லவில்லை
  rationale: עָבַר இயக்கத்தைக் குறிக்கும் ‘கடந்து செல்’ என்ற பொருளையும் בְּתוֹכָם ‘அவர்கள் நடுவே’ என்ற இடப்பொருளையும் தருகின்றன. இவ்விரண்டையும் தெளிவாகவும் இயல்பாகவும் தமிழில் வெளிப்படுத்துகிறது.
