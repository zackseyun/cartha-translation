  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: ta
  text: ஏனெனில், இறைப்பற்றில்லாதவர்களின் கூட்டம் பலனற்றதாயிருக்கும்[a]; இலஞ்சத்தின் கூடாரங்களை நெருப்பு விழுங்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளிவேடக்காரரின் கூட்டம் மலடாயிருக்கும்.” எபிரெயச் சொல் ‘வெளிவேடக்காரன்’ என்றும் பொருள்படலாம்; ஆனால் யோபு நூலில் அது பொதுவாக இறைப்பற்றற்ற அல்லது இறைநெறியற்ற ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “இலஞ்சத்தின் கூடாரங்கள்” அல்லது “ஒரு இலஞ்சத்தின் கூடாரங்கள்.” இச்சொற்றொடர் ஊழல் ஆதாயத்தால் குறிக்கப்படும் வாழ்விடங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது; சூழலின் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: עֲדַת
  choice: கூட்டம்
  rationale: கூடியுள்ள குழு அல்லது சமூகத்தைக் குறிக்கிறது; இச்சூழலில் சமய நிறுவனச் சாயல் இல்லாத இயல்பான தமிழ்ச் சொல்.
- source_word: חָנֵף
  choice: இறைப்பற்றில்லாதவர்கள்
  rationale: யோபு நூலில் இச்சொல் வெறும் வெளிவேடத்தைவிட இறைநெறியற்ற, பக்தியற்ற தன்மையைப் பரவலாகக் குறிக்கிறது. எபிரெய ஒருமை இங்கு கூட்டுப்பொருளில் வருகிறது.
- source_word: גַּלְמוּד
  choice: பலனற்றுப் போகும்
  rationale: வெறுமை, மலட்டுத்தன்மை, விளைவின்மை ஆகிய பொருள் பரப்பைப் பேணுகிறது; மனிதக் கூட்டத்தைக் குறிக்கும் தமிழில் இயல்பாக உள்ளது.
- source_word: וְאֵשׁ
  choice: நெருப்பு
  rationale: இரண்டாம் இணைக் கூற்றின் தெளிவான, உருவகமிக்க கருப்பொருளை நேரடியாகப் பேணுகிறது.
- source_word: אָכְלָה
  choice: விழுங்கும்
  rationale: எபிரெய வினையின் சொற்படிமமான ‘உண்ணுதல்’ என்பதையும், ஞானவாக்கியத்தின் பொதுநிகழ் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָהֳלֵי
  choice: கூடாரங்களை
  rationale: பண்டைய வாழ்விடத்தின் தெளிவான படிமத்தை ‘வீடுகள்’ எனப் பொதுமைப்படுத்தாமல் பேணுகிறது.
- source_word: שֹׁחַד
  choice: இலஞ்சத்தால் எழுந்த
  rationale: ‘இலஞ்சத்தின் கூடாரங்கள்’ என்ற எபிரெய இணைப்பின் சுருக்கமான தன்மையை தமிழில் புரியும்படி வெளிப்படுத்துகிறது; ஊழல் ஆதாயத்தால் நிலைபெற்ற வாழ்விடங்கள் என்ற கருத்தைக் காட்டுகிறது.
theological_decisions:
- issue: חָנֵף என்பதன் ஒழுக்க-சமயப் பொருள்
  choice: இறைப்பற்றில்லாதவர்கள்
  alternative: வெளிவேடக்காரன் / இறைநெறியற்றவன்
  rationale: யோபு நூலில் உள்ள பரந்த இறைநெறியின்மை என்ற பொருளை முதன்மைப்படுத்துகிறது; ‘வெளிவேடம்’ என்ற குறுகிய பொருளை மட்டும் திணிக்கவில்லை.
- issue: גַּלְמוּד என்பதன் நிலை/கால நுணுக்கம்
  choice: பலனற்றுப் போகும்
  alternative: பலனற்றது / பாழாயிருக்கும்
  rationale: எபிரெய சொல்லின் மலட்டு அல்லது விளைவற்ற நிலையைப் பேணியபடி, இணை வரியில் வரும் அழிவின் இயக்கத்துடன் தமிழில் பொருந்துகிறது; இது தவிர்க்க முடியாத கோட்பாட்டுச் சட்டமாக விரிவாக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளியதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘கூடாரம்,’ ‘நெருப்பு விழுங்கும்’ ஆகிய மூலப் படிமங்கள் பேணப்பட்டுள்ளன. חָנֵף மற்றும் שֹׁחַד தொடர்பான உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
