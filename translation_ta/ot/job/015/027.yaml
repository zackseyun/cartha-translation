  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: ta
  text: 'ஏனெனில், அவன் தன் முகத்தைக் கொழுப்பால் மூடியிருக்கிறான்;

    தன் பக்கவாட்டுகளின் மேல் கொழுப்புத் தடிப்பை உண்டாக்கியிருக்கிறான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவன் தன் முகத்தைக் கொழுப்பால் மூடி, தன் இடுப்புப் பகுதிகளின் மேல் கொழுப்பு மடிப்புகளை உண்டாக்கியிருக்கிறான்.”'
    reason: அரிய פִּימָה என்பதற்கு ‘கொழுப்புத் தடிப்பு’ அல்லது ‘கொழுப்பு மடிப்புகள்’ என்றும், כָסֶל என்பதற்கு ‘பக்கவாட்டுகள்,’ ‘இடுப்புப் பகுதிகள்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்க அடிப்படையை அறிமுகப்படுத்தும் காரண இணைப்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: כִסָּה
  choice: மூடியிருக்கிறான்
  rationale: ‘மூடு, மறை’ என்ற பொருளைத் தக்கவைத்து, உருவாகியுள்ள நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פָנָיו
  choice: தன் முகத்தை
  rationale: உடல் சார்ந்த இணைநிலைப் படிமத்துக்கு ஏற்ற நேரடியான பொருள் ‘முகம்’; எழுவாயையே சுட்டுவதால் ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: בְּחֶלְבּוֹ
  choice: கொழுப்பால்
  rationale: חֵלֶב என்பதன் உறுதியான உடல் சார்ந்த ‘கொழுப்பு’ படிமத்தைச் சுருக்காமல் காக்கிறது; எபிரெய முன்னொட்டு கருவி அல்லது மூடுபொருளைக் குறிக்கிறது.
- source_word: וַיַּעַשׂ
  choice: திரளச் செய்திருக்கிறான்
  rationale: அடிப்படைப் பொருள் ‘செய்/உருவாக்கு’; அரிய பெயர்ச்சொல்லோடு சேர்ந்துள்ள இச்சூழலில் உடலில் கொழுப்புத் தடிப்பு உருவானதைக் காட்டும் இயல்பான தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: פִּימָה
  choice: கொழுப்பு
  rationale: இது அரிய சொல்; தடிப்பு, கொழுப்புப் படலம் அல்லது கொழுப்பு மடிப்புகள் எனப் பொருள்படலாம். முதன்மை உரையில் மிகையாகக் குறிப்பாக்காமல் ‘கொழுப்பு’ என வழங்கப்படுகிறது.
- source_word: עֲלֵי
  choice: பகுதிகளில்
  rationale: עַל என்பதன் இடவியல் உறவைத் தமிழில் உடற்பகுதியோடு இயல்பாக வெளிப்படுத்துகிறது; ‘மேல்’ என்ற சொற்படி வடிவத்தைவிட இங்கு ‘பகுதிகளில்’ தெளிவானது.
- source_word: כָסֶל
  choice: இடுப்புப் பகுதிகள்
  rationale: כֶּסֶל இடுப்பு, விலாப்பக்கம் அல்லது பக்கவாட்டுப் பகுதியைக் குறிக்கலாம். ‘இடுப்புப் பகுதிகள்’ உடற்கூற்றை இயல்பாகவும் தேவையற்ற துல்லியமின்றியும் தருகிறது.
theological_decisions:
- issue: உடல் பருமன் குறித்த படிமத்தின் உட்கருத்து
  choice: உடல் சார்ந்த கொழுப்பு படிமத்தை நேரடியாகப் பாதுகாத்தல்
  alternative: செழிப்பு, தன்னிறைவு அல்லது சுயஇன்ப வாழ்க்கை என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் கொழுப்பு மற்றும் உடற்பகுதிகள் என்ற தெளிவான கவிதைப் படிமத்தைப் பயன்படுத்துகிறது. அது தீயவனின் செழிப்பு அல்லது உணர்வின்மையை மறைமுகமாகச் சுட்டக்கூடியிருந்தாலும், மொழிபெயர்ப்பில் அந்த விளக்கத்தைத் திணிக்காமல் படிமத்தையே காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் உடல் சார்ந்த கடுமையான படிமமும் காக்கப்பட்டுள்ளன. ‘இடுப்புப் பகுதிகள்’ என்பது ‘அரைக்கச்சை/இடுப்பு’ போன்ற குழப்பத்தைத் தவிர்த்து, loins/flanks என்ற பொருள் வரம்பை இயல்பாகக் காட்டுகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
