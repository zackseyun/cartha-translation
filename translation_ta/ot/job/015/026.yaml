  source_fidelity: முக்கிய உரையில் ‘கழுத்தை முன்வைத்து’ என்பது எபிரெய בְּצַוָּאר (‘தன் கழுத்துடன்’) என்பதிலில்லாத ‘முன்வைத்து/நீட்டித்து’ என்ற விளக்கத்தைச் சேர்க்கிறது. அந்த விளக்கம் சாத்தியமானது; ஆனால் மூலத்தின் சுருக்கமான, உயிரோட்டமான உருவகம் முக்கிய உரையில் காக்கப்பட வேண்டும். ‘அவர்மேல்’ என்பது முந்தைய வசனங்களில் உள்ள கடவுளைக் குறிக்கும் சூழலோடு பொருந்துகிறது; கேடயங்கள் பன்மையாகவே வைக்கப்பட வேண்டும்.
