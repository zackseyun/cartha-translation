  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: ta
  text: அவன் தன் கழுத்துடன், தன் கேடயங்களின் தடித்த குமிழ்களோடு, அவர்மேல் பாய்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרוּץ
  choice: பாய்கிறான்
  rationale: רוץ என்பதன் அடிப்படைப் பொருள் ‘ஓடுதல்.’ இங்குள்ள பகைமைச் சூழலில், வேகமாகத் தாக்க முனைவதை இயல்பாகவும் அளவுக்கு மீறிய இராணுவ விளக்கமின்றியும் ‘பாய்கிறான்’ தெரிவிக்கிறது.
- source_word: אֵלָיו
  choice: அவர்மேல்
  rationale: רוץ உடன் வரும் אֶל இச்சூழலில் எதிர்த்தாக்குதலின் திசையைக் குறிக்கிறது. முந்தைய சூழலில் சுட்டப்படுபவர் கடவுள் என்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּצַוָּאר
  choice: கழுத்தை முன்வைத்து
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘கழுத்துடன்’ என்றாலும், தமிழில் அந்த வடிவம் தெளிவற்றதாக இருக்கும். ‘கழுத்தை முன்வைத்து’ என்பது தலைகுனியாத, நேருக்கு நேர் பாயும் தெளிவான உடல் உருவகத்தை இயல்பாக வெளிப்படுத்துகிறது; சேர்க்கப்பட்ட விளக்கம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- source_word: בַּעֲבִי
  choice: தடித்த
  rationale: עֳבִי குறிக்கும் தடிமன் அல்லது பருமனைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: גַּבֵּי
  choice: குமிழ்ப்பகுதிகள்
  rationale: கேடயங்களோடு இணைந்துள்ள இச்சொல் அவற்றின் உயர்ந்து புடைத்த பகுதிகளை, அதாவது shield bosses-ஐ, குறிக்கிறது. ‘குமிழ்ப்பகுதிகள்’ என்பது பொதுவாசகருக்கும் புரியும் துல்லியமான தமிழ் வடிவம்.
- source_word: מָגִנָּיו
  choice: தன் கேடயங்கள்
  rationale: எபிரெய வடிவம் மூன்றாம் ஆண் ஒருமை உடைமைப் பின்னொட்டுடன் கூடிய பன்மை; ஆகவே பன்மை அப்படியே காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֵלָיו என்பதன் இலக்கு
  choice: கடவுளைக் குறிக்கும் மரியாதை வடிவான ‘அவர்மேல்’
  alternative: ‘அவன்மேல்’ அல்லது பெயர்ச்சுட்டைத் தவிர்த்து ‘எதிராக’
  rationale: 15:25-இன் தொடர்ச்சியில் தாக்குதல் கடவுளுக்கு எதிரானது. தமிழில் கடவுளைக் குறிக்க மரியாதை வடிவம் இயல்பானது; இது கூடுதல் சமயக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர் புரிந்துகொள்ளும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. கேடயத்தின் தொழில்நுட்பப் பகுதியை மிக அரிய சொல்லால் குறிப்பிடாமல் ‘குமிழ்ப்பகுதிகள்’ எனத் தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் பன்மையும் தாக்குதலின் செறிந்த உருவகமும் காக்கப்பட்டுள்ளன.
