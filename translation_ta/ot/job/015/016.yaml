translation:
  language: ta
  text: அப்படியானால், அருவருப்பானவனும் மாசுபட்டவனுமான[a] மனிதன்—அநியாயத்தை[b] தண்ணீரைப்போல் குடிப்பவன்—எவ்வளவு குறைவாகத் தூயவனாக இருப்பான்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாசுபட்டவன்” என்பதற்குப் பதிலாக “அசுத்தமானவன்,” “அழுக்கானவன்” அல்லது “அருவருப்பானவன்” என்றும் மொழிபெயர்க்கலாம்; נֶאֱלָח என்பது மாசடைந்த அல்லது அருவருப்பான நிலையைக் குறிக்கும் அரிய எபிரெயச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: “அநியாயம்” என்பதற்குப் பதிலாக “அக்கிரமம்,” “அநீதி” அல்லது “தவறுசெயல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: எவ்வளவு குறைவாகவே
  rationale: முந்தைய வசனத்தின் கருத்தை மனிதனுக்குப் பொருத்தும் வலியுறுத்தப்பட்ட ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִתְעָב
  choice: அருவருப்பானவன்
  rationale: வெறுக்கத்தக்க, அருவருக்கத்தக்க நிலையைச் சுட்டும் எபிரெயச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: נֶאֱלָח
  choice: சீர்கெட்டவன்
  rationale: அரிதான இச்சொல்லின் மாசுபட்ட, இழிவடைந்த அல்லது ஒழுக்கத்தில் கெட்ட நிலையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ
  choice: மனிதன்
  rationale: ஒருமை ஆண்பால் வடிவத்தைப் பேணுவதோடு, இங்கு பிரதிநிதியாகச் சொல்லப்படும் மனிதனை இயல்பாகக் குறிக்கிறது.
- source_word: שֹׁתֶה
  choice: குடிப்பவன்
  rationale: எளிதாகவும் வழக்கமாகவும் செய்வதை உணர்த்தும் எபிரெயப் பெயரெச்சத்தின் தொடர்ச்சியான தன்மையைப் பேணுகிறது.
- source_word: כַמַּיִם
  choice: தண்ணீரைப்போல்
  rationale: தீமையை இயல்பாகவும் தாராளமாகவும் உட்கொள்ளும் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַוְלָה
  choice: அநியாயம்
  rationale: நீதி மீறல், தவறு, ஒழுக்கக்கேடு ஆகிய பொருள் பரப்பைக் கொண்ட சொல்லுக்கு எளிதில் புரியும், தார்மீக வலிமையுள்ள தமிழ் இணை.
theological_decisions:
- issue: பிரதிநிதித்துவ ஒருமை ஆண்பால் மொழி
  choice: மனிதன்
  alternative: ஒருவன்; மனிதர்
  rationale: אִישׁ என்பது ஒருமை ஆண்பால்; பொதுவான மனித நிலையைக் குறிக்கும் பிரதிநிதித்துவப் பயன்பாட்டையும் மூல வடிவத்தையும் ‘மனிதன்’ காக்கிறது.
- issue: עַוְלָה என்பதன் தார்மீகப் பொருள்
  choice: அநியாயம்
  alternative: அக்கிரமம்; தவறுசெயல்; அநீதி
  rationale: பிற்காலக் கோட்பாட்டுச் சொற்பயன்பாட்டைத் திணிக்காமல், நீதி மீறலின் தார்மீகக் கனத்தைத் தெளிவாகக் காட்டுகிறது.
- issue: முந்தைய வசனத்துடன் உள்ள மறைமுக நிறைவு
  choice: தூயவனாயிருப்பான் என்பதைத் தெளிவுபடுத்தல்
  alternative: வினையெச்சமற்ற துண்டு வாக்கியமாக விடுதல்
  rationale: எபிரெயத்தில் முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் கருத்தை தமிழில் வாசிக்கத்தக்க முழு வாக்கியமாக்குகிறது; புதிய கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வலிமையான கவிதைநடை. முந்தைய வசனத்திலிருந்து தொடரும் ஒப்பீட்டுத் தர்க்கம் தமிழில் முழுமையாகப் புரிய ‘தூயவனாயிருப்பான்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையில் [a], [b] என இரண்டும் இடம்பெற்றுள்ளன.
