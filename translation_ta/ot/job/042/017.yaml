  yaml_path: translation/ot/job/042/017.yaml
  text: And Job died[a], old and full of days.
translation:
  language: ta
  text: யோபு வயது முதிர்ந்தவராகவும், வாழ்நாட்கள் நிறைந்தவராகவும்[a] இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாழ்நாட்களால் நிறைவடைந்தவராக” / “நாட்களால் திருப்தியடைந்தவராக.” இது நிறைவான ஆயுளைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: மூத் என்ற வினையின் தொடர்நிகழ்வைக் குறிக்கும் வடிவம் அடுத்த நிகழ்வை விவரிக்கிறது. தமிழில் வாக்கிய முடிவிலுள்ள ‘இறந்தார்’ இயல்பான நடை; தொடக்க இணைப்புச்சொல் அவசியமில்லை.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: זָקֵן
  choice: முதிர்ந்த வயதில்
  rationale: ‘வயதானவர்/முதியவர்’ என்ற பொருளை மரண அறிவிப்பில் இயல்பான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּשְׂבַע יָמִים
  choice: வாழ்நாட்கள் நிறைந்தவராக
  rationale: எபிரேய மொழியின் ‘நாட்களால் நிறைந்தவர்’ என்ற உருவகத்தையும் நிறைவான ஆயுளைக் குறிக்கும் மரபுத்தொடரையும் முடிந்தவரை காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான மரண அறிவிப்பின் கண்ணியத்தையும் எபிரேய உருவகத்தையும் காக்கும் நடை. அடிக்குறி குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
