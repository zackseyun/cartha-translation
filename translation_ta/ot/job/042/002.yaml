  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: ta
  text: நீர் எல்லாவற்றையும் செய்ய வல்லவர் என்பதையும், உமது எந்தத் திட்டத்தையும் தடுக்க முடியாது என்பதையும் நான் அறிவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது எந்த நோக்கத்தையும் முறியடிக்க முடியாது.” எபிரெயப் பெயர்ச்சொல் “திட்டம்” அல்லது “நோக்கம்” என்றும், வினைச்சொல் தடுக்கப்படுதல், நிறுத்தப்படுதல் அல்லது முறியடிக்கப்படுதல் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: நான் அறிவேன்
  rationale: ידע என்பதன் Qal perfect வடிவம் இங்கு யோபுவின் தற்போதைய அறிக்கையை வெளிப்படுத்துவதால், நவீன தமிழில் நிலைநிகழ் பொருளுடன் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: என்பதையும்
  rationale: யோபு அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; இணையான இரு உட்பொருள் வாக்கியங்களையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: כֹל תּוּכָל
  choice: நீர் எல்லாவற்றையும் செய்ய வல்லவர்
  rationale: יכל என்பதன் ‘வல்லவராக இருத்தல், ஆற்றல் பெற்றிருத்தல்’ என்ற பொருளையும் כֹל என்பதன் முழுமையையும் தெளிவாகக் காக்கிறது.
- source_word: וְלֹא יִבָּצֵר
  choice: தடுக்க முடியாது
  rationale: בצר என்பதன் Niphal வடிவம் מן உடன் வரும்போது தடுக்கப்படுதல், நிறைவேறாமல் போதல் என்ற சூழல்சார் கருத்தைத் தருகிறது; தமிழில் செயப்படுபொருள் மையமான கடின அமைப்பைத் தவிர்த்து அதே வலிமை இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מִמְּךָ
  choice: உமது
  rationale: எபிரெய மொழியில் ‘உம்மிடமிருந்து’ என்ற வடிவம் இருந்தாலும், திட்டம் தேவனுக்குரியது என்ற உறவைத் தமிழில் உடைமை வடிவம் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מְזִמָּה
  choice: திட்டம்
  rationale: இந்தப் பெயர்ச்சொல் திட்டம் அல்லது நோக்கம் எனப் பொருள்படலாம். ‘திட்டம்’ என்பது எண்ணி வகுக்கப்பட்ட தெய்வீகச் செயலை நவீன தமிழில் நேரடியாகக் காட்டுகிறது; எதிர்மறையான ‘சூழ்ச்சி’ என்ற நிழற்பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: தேவனுடைய முழு வல்லமையும் அவரது திட்டத்தைத் தடுக்க இயலாமையும்
  choice: நீர் எல்லாவற்றையும் செய்ய வல்லவர் ... உமது எந்தத் திட்டத்தையும் தடுக்க முடியாது
  alternative: நீர் எல்லாவற்றையும் செய்ய முடியும் ... உமது எந்த நோக்கத்தையும் முறியடிக்க முடியாது
  rationale: மூலவசனம் தேவனுடைய ஆற்றலையும் அவருடைய எண்ணம் தடைப்படாததையும் உறுதிப்படுத்துகிறது. அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், ‘திட்டம்’ மற்றும் ‘தடுக்க முடியாது’ என்பவை அதன் இயல்பான வலிமையைக் காக்கின்றன.
translation_notes:
  register: மரியாதையைக் குறிக்கும் ‘நீர்/உமது’ வடிவங்களுடன், ordinary modern readers எளிதில் புரிந்துகொள்ளும் நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. கவித்துவ கண்ணியத்தைப் பேணியபடியே தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
