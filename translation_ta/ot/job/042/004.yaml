lexical_decisions:
- source_word: שְׁמַע נָא
  choice: தயவுசெய்து கேளும்
  rationale: שְׁמַע என்பது ஒருமை ஆண்பால் கட்டளை; נָא வேண்டுகோள் அல்லது பணிவைச் சுட்டுகிறது. ‘தயவுசெய்து கேளும்’ என்பது நேரடியான கட்டளையையும் மரியாதையான வேண்டுகோளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: நான் பேசுவேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயர் אָנֹכִי எழுவாயை வலியுறுத்துகிறது. தமிழில் ‘நான்’ என்பதை வெளிப்படையாக வைத்திருப்பது அந்த வலியுறுத்தலைக் காக்கிறது; இணைப்புச் சொல் தமிழின் அரைப்புள்ளி அமைப்பில் இயல்பாக உட்படுகிறது.
- source_word: אֶשְׁאָלְךָ
  choice: நான் உம்மிடம் கேட்பேன்
  rationale: שאל என்பதன் அடிப்படைப் பொருள் ‘கேள்’; இரண்டாம் நபர் ஒருமை பின்னொட்டை ‘உம்மிடம்’ வெளிப்படுத்துகிறது. ‘வினவுவேன்’ என்பதைக் காட்டிலும் இது சாதாரண வாசகருக்குத் தெளிவானது.
- source_word: וְהוֹדִיעֵנִי
  choice: நீர் எனக்கு அறிவியும்
  rationale: ידע என்பதன் ஹிஃபில் கட்டளை வடிவம் சொற்பட ‘என்னை அறியச் செய்யும்’ என்று பொருள்படும். ‘எனக்கு அறிவியும்’ அதன் காரணவினைப் பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது; ‘பதில் சொல்லும்’ என்று பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: யோபு 38:3 மற்றும் 40:7-இல் ஆண்டவர் கூறிய சவாலுடனான தொடர்பு
  choice: ‘நீர் சொன்னீர்’ போன்ற அறிமுகத்தை மூலவசனத்தில் சேர்க்காமல், யோபு முந்தைய சொற்களை எதிரொலிப்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: மேற்கோள் குறிகளையோ ‘நீர் சொன்னீர்’ என்ற விளக்கத்தையோ முதன்மை உரையில் சேர்த்தல்
  rationale: எபிரெய உரையில் அறிமுகச் சொற்கள் இல்லை. ஆகவே எதிரொலியைப் பாதுகாத்தாலும், யோபு இங்கு மேற்கோள் கூறுகிறாரா அல்லது அந்தச் சொற்களைத் தன் வேண்டுகோளாக ஏற்கிறாரா என்ற சூழல்சார் நுணுக்கத்தை மொழிபெயர்ப்பு செயற்கையாகத் தீர்மானிக்காது.
- issue: וְהוֹדִיעֵנִי என்பதன் கட்டளை மற்றும் காரணவினைப் பொருள்
  choice: ‘நீர் எனக்கு அறிவியும்’
  alternative: ‘நீர் எனக்குப் பதில் சொல்லும்’ அல்லது ‘என்னை அறியச் செய்யும்’
  rationale: ‘அறிவியும்’ என்பது ‘அறியச் செய்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது. ‘பதில் சொல்லும்’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் எபிரெயச் சொல்லின் பரப்பைச் சுருக்குகிறது; ‘என்னை அறியச் செய்யும்’ தமிழில் செயற்கையாக ஒலிக்கிறது.
