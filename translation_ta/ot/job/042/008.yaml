  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: ta
  text: ஆகவே இப்போது, உங்களுக்காக ஏழு காளைகளையும் ஏழு செம்மறியாட்டுக் கடாக்களையும் எடுத்துக்கொண்டு, என் ஊழியனாகிய யோபிடம் போய், உங்களுக்காக அவற்றைத் தகனபலியாகச் செலுத்துங்கள். என் ஊழியனாகிய யோபு உங்களுக்காக வேண்டுதல் செய்வான். நான் அவனை ஏற்றுக்கொள்வேன்[a]; அதனால் உங்களை இழிவுக்குரிய விதத்தில் நடத்தமாட்டேன்[b]. ஏனெனில், என் ஊழியனாகிய யோபு பேசியதுபோல் நீங்கள் என்னைக் குறித்துச் சரியாகப் பேசவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘அவனுடைய முகத்தை உயர்த்துவேன்.’ இது ஒருவரை ஏற்றுக்கொள்வதையோ அவருக்கு ஆதரவு காட்டுவதையோ குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் மூடத்தனத்திற்கேற்ப உங்களை நடத்தமாட்டேன்’; அல்லது, ‘உங்களுக்கு ஓர் இழிவான காரியத்தைச் செய்யமாட்டேன்.’ எபிரெயச் சொல் மூடத்தனம், கீழ்மை, அவமானகரமான செயல் ஆகிய பொருட்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நீங்கள் என்னிடம் சரியாகப் பேசவில்லை.’ எபிரெயத்தை ‘என்னிடம்’ என்று நேரடியாகவும், சூழலின் அடிப்படையில் ‘என்னைக் குறித்து’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְעַתָּה என்பது முந்தைய கண்டனத்திலிருந்து வரும் முடிவையும் தற்போதைய கட்டளையையும் இணைக்கிறது. ‘ஆகவே இப்போது’ இந்த இரு உரையாடல் பணிகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קְחוּ לָכֶם
  choice: உங்களுக்காக ... எடுத்துக்கொண்டு
  rationale: கட்டளையோடு இணைந்த לָכֶם, பலிக்குத் தேவையான விலங்குகளைத் தங்களுக்காக எடுத்துக்கொள்ள வேண்டும் என்ற பயனாளி நுணுக்கத்தைத் தருகிறது.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: ஏழு காளைகளையும் ஏழு செம்மறியாட்டுக் கடாக்களையும்
  rationale: פָרִים ஆண் மாடுகளையும் אֵילִים ஆண் செம்மறியாடுகளையும் குறிக்கின்றன. ‘செம்மறியாட்டுக் கடாக்கள்’ என்பது ‘கடாக்கள்’ என்பதிலுள்ள இனத் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: עַבְדִּי אִיּוֹב
  choice: என் ஊழியனாகிய யோபு
  rationale: இங்கு עֶבֶד அடிமைநிலையை வலியுறுத்தாமல், கடவுளுக்கு உண்மையுடன் பணிபுரிபவருக்கான மதிப்புப் பெயராக உள்ளது; ‘ஊழியன்’ அந்தப் பொருளை dignified biblical Tamil-இல் தருகிறது.
- source_word: וְהַעֲלִיתֶם עוֹלָה בַּעַדְכֶם
  choice: உங்களுக்காக அவற்றைத் தகனபலியாகச் செலுத்துங்கள்
  rationale: עלה என்பதன் Hiphil வடிவமும் עוֹלָה என்பதும் முழுவதும் எரிக்கப்படும் பலியைச் செலுத்தும் வழக்கமான பலியிடும் சொற்றொடர். ஒருமை עוֹלָה இங்கு பலிவகையைச் சுட்டுவதால், பல விலங்குகளைக் குறிக்க ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: உங்களுக்காக வேண்டுதல் செய்வான்
  rationale: இந்தச் சூழலில் வினைச்சொல் பரிந்துபேசும் வேண்டுதலைக் குறிக்கிறது. ‘வேண்டுதல் செய்வான்’ என்பது யோபின் இடைவேண்டுதல் பணியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: நான் அவனை ஏற்றுக்கொள்வேன்
  rationale: ‘அவனுடைய முகத்தை உயர்த்துவேன்’ என்பது ஒருவருக்கு ஆதரவு காட்டுதல் அல்லது அவரை ஏற்றுக்கொள்ளுதல் என்ற எபிரெய மரபுத்தொடர். யோபின் வேண்டுதலை ஏற்கும் சூழலில் ‘அவனை ஏற்றுக்கொள்வேன்’ தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: அதனால் உங்களை இழிவுக்குரிய விதத்தில் நடத்தமாட்டேன்
  rationale: נְבָלָה மூடத்தனம், கீழ்மை, அவமானகரமான அல்லது இழிவான செயல் ஆகிய பொருட்களை உடையது. முதன்மை உரை அதன் கடுமையான விளைவைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: நீங்கள் என்னைக் குறித்துச் சரியாகப் பேசவில்லை
  rationale: אֵלַי வடிவத்தில் ‘என்னிடம்’ என்ற திசைப் பொருள் இருந்தாலும், நண்பர்கள் கடவுளைப் பற்றிப் பேசிய மொத்தச் சூழலில் ‘என்னைக் குறித்து’ இயல்பான பொருளைத் தருகிறது. நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: என் ஊழியனாகிய யோபு பேசியதுபோல்
  rationale: எபிரெயத்தில் ஒப்பீடு சுருக்கமாக உள்ளது; தமிழில் ஒப்பீட்டு வாக்கியத்தை நிறைவு செய்ய ‘பேசியதுபோல்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யோபின் வேண்டுதலும் கடவுள் அவனை ஏற்றுக்கொள்வதும் கொண்ட உறவு
  choice: யோபு நண்பர்களுக்காக வேண்டுதல் செய்வான்; கடவுள் அவனை ஏற்றுக்கொள்வதால் அவர்கள்மீதான தண்டனை தவிர்க்கப்படும்.
  alternative: கடவுள் யோபுக்குத் தனிப்பட்ட ஆதரவு காட்டுகிறார்; அவனுடைய இடைவேண்டுதல் முக்கியமாக வலியுறுத்தப்படவில்லை.
  rationale: கட்டளை, பலி, யோபின் வேண்டுதல், அவனை ஏற்றுக்கொள்ளும் மரபுத்தொடர், நண்பர்களுக்கு எதிரான நடவடிக்கை தவிர்க்கப்படுதல் ஆகியவை தொடர்ச்சியாக வருகின்றன. ஆகவே இடைவேண்டுதல் உறவு பாதுகாக்கப்படுகிறது; ஆனால் பின்னாளைய ஆசாரிய அல்லது பரிகாரக் கோட்பாடுகள் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: נְבָלָה என்ற சொல்லை கடவுளின் நடவடிக்கையுடன் இணைத்துப் புரிதல்
  choice: கடவுள் அவர்களை இழிவுக்குரிய அல்லது கடுமையான விதத்தில் நடத்தாமல் இருப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்கள் மூடத்தனத்திற்கேற்ப உங்களை நடத்தாமல் இருப்பதற்காக’ அல்லது ‘உங்களுக்கு ஓர் அவமானகரமான காரியத்தைச் செய்யாமல் இருப்பதற்காக.’
  rationale: சொல் மூடத்தனத்தையும் அவமானகரமான கீழ்மையையும் குறிக்கலாம். எபிரெய வாக்கியத்தின் பதற்றத்தை முற்றிலும் நீக்காமல் முதன்மை உரை கடுமையான நீதித்தீர்ப்பு நுணுக்கத்தை வைத்திருக்கிறது; பிற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אֵלַי என்பதன் ‘என்னிடம்’ / ‘என்னைக் குறித்து’ ambiguity
  choice: சூழலின் அடிப்படையில் ‘என்னைக் குறித்து’ முதன்மை உரையில் பயன்படுத்தப்பட்டது.
  alternative: ‘என்னிடம் சரியாகப் பேசவில்லை.’
  rationale: இலக்கண வடிவம் ‘என்னிடம்’ என்பதை அனுமதிக்கிறது; ஆனால் யோபின் நண்பர்கள் கடவுளின் இயல்பையும் செயலையும் பற்றி முன்பு கூறியவற்றை இந்தத் தீர்ப்பு மதிப்பிடுகிறது. ambiguity அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘தகனபலி’, ‘ஊழியன்’, ‘வேண்டுதல்’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழின் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; காரண மற்றும் விளைவு இணைப்புகள் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய முதன்மை உரைச் சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
