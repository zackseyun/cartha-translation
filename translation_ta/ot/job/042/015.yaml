revisions:
- from: நாடு முழுவதிலும் யோபுடைய மகள்களைப் போல அழகான பெண்கள் காணப்படவில்லை.[a] அவர்களுடைய தகப்பன், அவர்களுடைய சகோதரர்களோடு அவர்களுக்கும் பரம்பரைச் சொத்து கொடுத்தார்.
  to: நாடு முழுவதிலும் யோபின் மகள்களைப் போல அழகான பெண்கள் எங்கும் காணப்படவில்லை.[a] அவர்களுடைய தந்தை, அவர்களுடைய சகோதரர்களோடு சேர்த்து அவர்களுக்கும் ஒரு வாரிசுரிமைப் பங்கை அளித்தார்.
  rationale: The revision standardizes Job’s possessive name form, improves the flow of the inheritance clause, and uses a transparent modern Tamil expression for an inheritance share. It retains the Hebrew’s explicit reference to brothers and preserves the lexical ambiguity of הָאָרֶץ in the footnote.
