  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: ta
  text: நாடு முழுவதிலும் யோபின் மகள்களைப் போல அழகான பெண்கள் எங்கும் காணப்படவில்லை.[a] அவர்களுடைய தந்தை, அவர்களுடைய சகோதரர்களோடு சேர்த்து அவர்களுக்கும் ஒரு வாரிசுரிமைப் பங்கை அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமி முழுவதிலும்.”
    reason: הָאָרֶץ என்பதற்கு “நாடு” அல்லது “பூமி” என்று பொருள் வரலாம்; சூழலுக்கு ஏற்ற முதன்மை வாசகத்துடன் மாற்றுப் பொருளும் பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: נִמְצָא
  choice: காணப்படவில்லை
  rationale: מצא என்பதன் நிஃபால் வடிவம் இங்கு இருப்பு அல்லது கண்டறிதலைக் குறிக்கிறது; தமிழில் எதிர்மறைச் சூழலுடன் இயல்பாகவும் மூலத்தின் செயப்பாட்டு நுணுக்கத்துடனும் ‘காணப்படவில்லை’ என வழங்கப்பட்டுள்ளது.
- source_word: נָשִׁים יָפוֹת
  choice: அழகான பெண்கள்
  rationale: נָשִׁים என்பது குறிப்பாக ‘மனைவிகள்’ அல்ல, ‘பெண்கள்’; יָפוֹת என்பது ‘அழகான’ என்று பொருள்படும்.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: யோபுடைய மகள்களைப் போல
  rationale: முன்னொட்டு כ ஒப்பீட்டைக் குறிக்கிறது; ‘போல’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடு முழுவதிலும்
  rationale: הָאָרֶץ என்பதற்கு ‘நாடு’ அல்லது ‘பூமி’ என இரு பொருள்கள் இருக்கலாம். இக்கதைச் சூழலில் ‘நாடு’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּתֵּן לָהֶם
  choice: அவர்களுக்கும் ... கொடுத்தார்
  rationale: נתן உடன் வரும் மறைமுகப் பொருள் பெண் மகள்களைக் குறிக்கிறது. ‘அவர்களுக்கும்’ என்பது சகோதரர்களோடு மகள்களும் சொத்து பெற்ற குறிப்பிடத்தக்க கருத்தைத் தமிழில் தெளிவாக்குகிறது.
- source_word: נַחֲלָה
  choice: பரம்பரைச் சொத்து
  rationale: נַחֲלָה என்பது வாரிசுரிமையாகக் கிடைக்கும் சொத்து அல்லது உடைமையைக் குறிக்கிறது; ‘பரம்பரைச் சொத்து’ சாதாரண வாசகருக்கு தெளிவான, துல்லியமான தமிழ்.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களோடு
  rationale: בְּתוֹךְ இங்கு ‘நடுவில்/மத்தியில்’ என்பதைக் காட்டிலும் பங்குபெறும் உறவைச் சுட்டும் ‘உடன்/மத்தியில்’ என்ற பொருளைத் தருகிறது. אֲחֵיהֶם என்பது பாலினத்தைக் குறிப்பாகக் காட்டும் ‘சகோதரர்கள்’ என்பதால் அது நடுநிலைப்படுத்தப்படவில்லை.
theological_decisions:
- issue: உறவுமுறைச் சொல்லின் பாலினத் துல்லியம்
  choice: அவர்களுடைய சகோதரர்களோடு
  alternative: அவர்களுடைய உடன்பிறந்தவர்களோடு
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் ‘சகோதரர்கள்’ என்று குறிப்பாக உள்ளது. மகள்கள் ஆண் வாரிசுகளோடு பரம்பரைச் சொத்து பெற்ற விவரத்தை மறைக்காமல் அதே பாலினக் குறிப்பைப் பேணுகிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: நாடு முழுவதிலும்
  alternative: பூமி முழுவதிலும்
  rationale: הָאָרֶץ ‘நாடு’ என்றும் ‘பூமி’ என்றும் பொருள்படலாம். கதைச் சூழலுக்கு ‘நாடு’ நன்கு பொருந்துகிறது; சாத்தியமான விரிந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகப்பன்’ என்பது வேதாகம உரைநடைக்கு ஏற்ற கண்ணியத்தையும் தெளிவையும் தருகிறது; ‘பரம்பரைச் சொத்து’ வாரிசுரிமை சார்ந்த נַחֲלָה என்பதன் பொருளைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட முதல் வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
