base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: ta
  text: 'அப்போது யோபு யாவேக்கு[a]ப் பதிலளித்துச் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது. “யாவே,” “யெகோவா” என்பன மாற்று வடிவங்கள்.'
    reason: இறைப்பெயரின் எபிரேய வடிவத்தையும் மரபான மற்றும் மாற்று வழங்கல்களையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: ענה என்ற வினைச்சொல் இங்கு உரையாடல் தொடரில் ‘பதில் அளித்தல்’ என்ற பொருளில் வருகிறது. நேரடியான கேள்வி முன்வைக்கப்படாதபோதிலும், யாவேயின் உரைக்கு யோபு அளிக்கும் மறுமொழி என்பதைக் காக்கிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: אִיּוֹב என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெயத்தில் வரையறுக்கப்பட்ட நேர்செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் தனிச் சொல்லாகத் தேவைப்படாது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது; மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- source_word: וַיֹּאמַר
  choice: இவ்வாறு சொன்னார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான உரையறிமுகச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது; அடுத்து நேரடி உரை வருவதையும் தெளிவாக்குகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்கத்தில் உள்ள வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ என்பது அந்தத் தொடர்ச்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் יְהוָה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் தருகிறது; ‘கர்த்தர்’ என்ற பட்டத்தால் பெயரை மாற்றவில்லை. உச்சரிப்பு முழு உறுதியுடன் அறியப்படாததால் மாற்று மரபுகளைக் குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘பதிலளித்து, இவ்வாறு சொன்னார்’ என்பது மூலத்திலுள்ள இரு வினைகளையும் காக்கிறது; அடுத்த வசனத்தில் தொடங்கும் நேரடி உரைக்காக முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
