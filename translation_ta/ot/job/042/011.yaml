base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: ta
  text: பின்பு அவருடைய சகோதரர்கள் அனைவரும், சகோதரிகள் அனைவரும், முன்பு அவரை அறிந்திருந்த அனைவரும்[a] அவரிடம் வந்தார்கள். அவருடைய வீட்டில் அவரோடு உணவருந்தினார்கள்[b]. யாவே அவர்மேல் கொண்டுவந்த எல்லாப் பேரிடருக்காகவும் அவர்கள் அவரிடம் அனுதாபம் காட்டி, அவருக்கு ஆறுதல் சொன்னார்கள். ஒவ்வொருவரும் அவருக்கு ஒரு கெசித்தாவையும்[c] ஒரு பொன் வளையத்தையும்[d] கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய பழைய அறிமுகமானவர்கள் அனைவரும்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவரோடு அப்பம் சாப்பிட்டார்கள்’; இது ஒன்றாக உணவருந்துவதைக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: ‘கெசித்தா’ என்பது பண்டைய மதிப்புப் பொருள் அல்லது மதிப்பு அலகு; அதன் துல்லியமான நவீன மதிப்பு தெரியவில்லை.
    reason: cultural_note
  - marker: d
    text: அல்லது, ‘ஒரு பொன் மூக்குத்தி’; எபிரெயச் சொல் மூக்கிலோ காதிலோ அணியும் வளையத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: அவருடைய சகோதரர்கள் அனைவரும், சகோதரிகள் அனைவரும்
  rationale: எபிரெய உரையில் இரு குழுக்களுக்கும் தனித்தனியாக வரும் כָּל (‘அனைவரும்’) என்பதையும், சகோதரர்–சகோதரி வேறுபாட்டையும் தெளிவாகப் பேணுகிறது.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: முன்பு அவரை அறிந்திருந்த அனைவரும்
  rationale: יֹדְעָיו என்பது அவரை அறிந்தவர்களையும், לְפָנִים என்பது முந்தைய காலத்தையும் குறிக்கிறது; தமிழில் இயல்பாகவும் கால வேறுபாட்டைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: அவரோடு உணவருந்தினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவரோடு அப்பம் சாப்பிட்டார்கள்’ என்றாலும், இது உணவைப் பகிர்ந்துகொண்டதைக் குறிக்கும் வழக்குச் சொற்றொடர்; இயல்பான நவீன தமிழில் அதன் பொருள் தரப்பட்டுள்ளது, நேரடி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וַיָּנֻדוּ לוֹ
  choice: அவரிடம் அனுதாபம் காட்டி
  rationale: இச்சூழலில் נוד கேலி அல்லது இகழ்ச்சியைக் காட்டாமல், துயருற்றவருடன் பரிவோடு வருந்துவதைக் குறிக்கிறது.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: அவருக்கு ஆறுதல் சொன்னார்கள்
  rationale: נחם என்பதன் ஆறுதலளித்தல்/தேற்றுதல் என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: עַל כָּל הָרָעָה
  choice: எல்லாப் பேரிடருக்காகவும்
  rationale: רָעָה இங்கு அறநெறிசார் தீமையை அல்ல, யோபு அனுபவித்த அழிவு, துன்பம், கேடு ஆகியவற்றைக் குறிக்கிறது; ‘பேரிடர்’ அந்தச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: யாவே அவர்மேல் கொண்டுவந்த
  rationale: הביא על என்ற காரணச்செயலை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது; இறைபெயர் יְהוָה ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: קְשִׂיטָה
  choice: கெசித்தா
  rationale: இது துல்லியமான நவீன மதிப்பு அறியப்படாத பண்டைய மதிப்புப் பொருள் அல்லது அலகு; பொதுவாக ‘நாணயம்’ என்று ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: נֶזֶם זָהָב
  choice: பொன் வளையம்
  rationale: נֶזֶם என்பது மூக்கிலோ காதிலோ அணியப்படும் வளையத்தைக் குறிக்கலாம்; பிரதான உரையில் தெளிவற்ற பொதுச் சொல்லும், அடிக்குறிப்பில் இரு சாத்தியங்களும் தரப்பட்டுள்ளன.
theological_decisions:
- issue: யோபுவின் துன்பத்தில் யாவேயின் செயல்பாடு
  choice: யாவே அவர்மேல் கொண்டுவந்த எல்லாப் பேரிடர்
  alternative: யாவே அவர்மேல் வர அனுமதித்த எல்லாப் பேரிடர்
  rationale: எபிரெய வினைச்சொல் பேரிடரை யாவே கொண்டுவந்ததாக நேரடியாகக் கூறுகிறது. ‘அனுமதித்தார்’ என்று மாற்றுவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்த்து இறைச்செயலின் பதற்றத்தைத் தணித்துவிடும்; ஆகவே மூலத்தின் இறையியல் பதற்றம் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடையைப் பயன்படுத்துகிறது. ‘உணவருந்தினார்கள்,’ ‘அனுதாபம் காட்டி,’ ‘ஆறுதல் சொன்னார்கள்’ போன்ற சொற்கள் வாசிப்பின் இயல்பை நிலைநிறுத்துகின்றன; ‘கெசித்தா’ மற்றும் ‘யாவே’ போன்ற மூலமொழிச் சிறப்புகள் தேவையான இடங்களில் பேணப்பட்டுள்ளன.
