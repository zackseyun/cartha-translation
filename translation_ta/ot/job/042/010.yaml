  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: ta
  text: யோபு தன் நண்பர்களுக்காக[b] ஜெபித்தபோது, யாவே யோபின் வாழ்வுநிலையை மீட்டமைத்தார்[a]. மேலும், யோபிடம் முன்பு இருந்த அனைத்தையும் யாவே இருமடங்காகக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோபின் சிறையிருப்பைத் திருப்பினார்’ அல்லது ‘யோபின் வாழ்நிலையை மீட்டளித்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் இங்கு சொல்லர்த்தமான சிறையிருப்பை அவசியமாகக் குறிக்காமல், ஒருவரின் நிலைமை மீட்டமைக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் நண்பர்களின் சார்பாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: שָׁב אֶת שבית
  choice: யோபின் நிலைமையைச் சீராக்கினார்
  rationale: இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் சொல்லர்த்தமான சிறையிருப்பிலிருந்து விடுவிப்பதை அவசியமாகக் குறிக்காமல், ஒருவரின் தாழ்ந்துபோன நிலையை மாற்றி மீட்டமைப்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּהִתְפַּלְלוֹ
  choice: வேண்டிக்கொண்டபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்சப் பெயரமைப்பு இங்கு காலச் சூழலைக் குறிக்கிறது. இது ஜெபத்துக்கும் மீட்டமைப்புக்கும் உள்ள தொடர்பைக் காட்டுகிறது; ஆனால் காரணத்தை எபிரெயம் சொல்வதைவிட வலுவாக்கவில்லை.
- source_word: בְּעַד רֵעֵהוּ
  choice: தன் நண்பர்களுக்காக
  rationale: בְּעַד என்பது பிறர் சார்பாகச் செய்யப்படும் பரிந்துரையைச் சுட்டுகிறது; רֵעֵהוּ இச்சூழலில் யோபின் நண்பர்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: וַיֹּסֶף
  choice: கொடுத்தார்
  rationale: יסף என்பதன் அடிப்படை எண்ணம் கூட்டுதல் அல்லது அதிகரித்தல். அடுத்துவரும் ‘இருமடங்கு’ என்பதுடன் தமிழில் இயல்பாக அமைய ‘கொடுத்தார்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: யோபிடம் முன்பு இருந்த அனைத்தையும்
  rationale: யோபுக்குச் சொந்தமாக இருந்தவற்றின் முழுமையையும் இத்தொடர் குறிக்கிறது. முந்தைய இழப்புகளைச் சூழல் தெளிவுபடுத்துவதால் ‘முன்பு’ என்பது தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לְמִשְׁנֶה
  choice: இருமடங்காக
  rationale: இந்தச் சொல் இரட்டிப்பைத் தெளிவாகக் குறிக்கிறது; ‘இருமடங்காக’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: யோபின் வேண்டுதலுக்கும் யாவே அவரது நிலைமையைச் சீராக்கியதற்கும் இடையிலான தொடர்பு
  choice: ‘வேண்டிக்கொண்டபோது’ என்று காலத் தொடர்பை வெளிப்படுத்துதல்
  alternative: ‘வேண்டிக்கொண்டதால்’ என்று நேரடிக் காரணத் தொடர்பாக மொழிபெயர்த்தல்
  rationale: ב + வினையெச்சப் பெயரமைப்பு காலத்தையோ உடனிகழ்வையோ குறிக்கலாம். யோபின் பரிந்துரைக்கும் அவரது மீட்டமைப்புக்கும் வசனம் தெளிவான தொடர்பை ஏற்படுத்துகிறது; ஆனால் அதைக் கட்டாயமான காரண–விளைவு அல்லது இயந்திரத்தனமான வெகுமதி நியதியாக மாற்றக் கூடாது.
