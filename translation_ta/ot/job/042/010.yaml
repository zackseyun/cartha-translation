  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் காலத் தொடர்பும் மரபுத்தொடரின் பரந்த பொருளும் காக்கப்பட்டுள்ளன.
