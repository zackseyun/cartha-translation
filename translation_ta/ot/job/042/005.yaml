  edition: WLC
  text: לְ/שֵֽׁמַע אֹ֥זֶן שְׁמַעְתִּ֑י/ךָ וְ֝/עַתָּ֗ה עֵינִ֥/י רָאָֽתְ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: ta
  text: காதால் உம்மைப் பற்றிக் கேட்டிருந்தேன்[a]; ஆனால் இப்போதோ என் கண் உம்மைக் கண்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிறர் சொல்லக் கேட்டே’; எபிரேயத்தில் சொல்லுக்குச் சொல், ‘காதின் கேள்வியால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: காதால் கேள்விப்பட்டதன் வழியாகவே
  rationale: ‘கேள்வி’ மற்றும் ‘காது’ ஆகியவற்றை இணைக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்து, பிறர் கூறிய செய்தியின் வழியாக அறிதல் என்ற பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁמַעְתִּיךָ
  choice: உம்மைப் பற்றிக் கேட்டிருந்தேன்
  rationale: சொல்லுக்குச் சொல் ‘உம்மைக் கேட்டேன்’ எனலாம்; ஆனால் இச்சூழலில் தேவனைப் பற்றிய செய்தியைக் கேட்டறிந்ததையே குறிக்கிறது. ‘கேட்டிருந்தேன்’ என்பது முன்னைய மறைமுக அறிவுக்கும் ‘இப்போது’ நிகழ்ந்த மாற்றத்திற்கும் உள்ள கால வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போதோ
  rationale: எளிய ‘இப்போது’ என்பதைக் காட்டிலும், முன்பு காதால் கேட்டதற்கும் இப்போது கண்ணால் காண்பதற்கும் இடையிலான வலுவான எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரேய மூலத்திலுள்ள ஒருமையைத் தக்கவைத்து, வசனத்தின் கவித்துவத்தையும் யோபுவின் தனிப்பட்ட அனுபவத்தின் நேரடித்தன்மையையும் பாதுகாக்கிறது.
- source_word: רָאָתְךָ
  choice: உம்மைக் கண்டிருக்கிறது
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய விளைவும் சேர்ந்துள்ள எபிரேய வினையின் நுட்பத்தைத் தமிழின் நிகழ்கால நிறைவு வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோபு தேவனைக் ‘காணுதல்’ என்பதன் இயல்பு
  choice: ‘உம்மைக் கண்டிருக்கிறது’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது; அது உருவகமா அல்லது முழுமையான நேரடிக் காட்சியா என்று விளக்கம் சேர்க்கப்படவில்லை.
  alternative: ‘உம்மை உணர்ந்திருக்கிறேன்’ அல்லது ‘உம்மை நேரடியாகச் சந்தித்திருக்கிறேன்’
  rationale: மூலத்தின் ‘காண்’ என்ற வினை, மறைமுகமாகக் கேட்டறிவதையும் நேரடியாகக் காண்பதையும் எதிரெதிராக நிறுத்துகிறது. அதன் இயல்பைத் தீர்மானிக்கும் விளக்கத்தைச் சேர்க்காமல் இருப்பது வசனத்தின் உண்மையான இறையியல் இறுக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. தேவனை நோக்கிய இரண்டாம் நபர் வடிவத்தில் ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காது–கண் கவித்துவ எதிர்மறை ஒப்புமையும் ‘என் கண்’ என்ற ஒருமையும் தக்கவைக்கப்பட்டுள்ளன.
