translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பெண்பால் வரிசை ‘முதலாமவள், இரண்டாமவள், மூன்றாமவள்’ என்ற வடிவில் காக்கப்பட்டுள்ளது; சூழலில் தெளிவாக இருந்தாலும் ‘மகள்’ என்ற சொல்லை மூலத்தில் இல்லாததால் சேர்க்கவில்லை.
