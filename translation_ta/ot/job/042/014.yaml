  yaml_path: translation/ot/job/042/014.yaml
  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: ta
  text: முதலாமவளுக்கு யெமீமா என்றும், இரண்டாமவளுக்கு கெத்சீயா என்றும், மூன்றாமவளுக்கு கெரென்-ஹப்பூக்[a] என்றும் அவன் பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கெரென்-ஹப்பூக் என்பதற்கு ‘அஞ்சனக் கொம்பு’ அல்லது ‘கண் மைக்கான கொம்பு’ என்று பொருள் இருக்கலாம்; இது கண் அழகுப்பொருளை வைக்கும் கொம்பு வடிவக் கொள்கலனையோ அந்த அழகுப்பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: பெயரிட்டான்
  rationale: ‘பெயரை அழைத்தான்’ என்ற எபிரெயச் சொற்றொடர் ஒருவருக்குப் பெயர் சூட்டுவதைக் குறிக்கிறது; ‘பெயரிட்டான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הָאַחַת / הַשֵּׁנִית / הַשְּׁלִישִׁית
  choice: முதலாமவளுக்கு / இரண்டாமவளுக்கு / மூன்றாமவளுக்கு
  rationale: பெண்பால் ஒருமை வடிவங்களையும் பெயரிடும் வரிசையையும் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: יְמִימָה
  choice: யெமீமா
  rationale: தனிப்பெயர் என்பதால் அதன் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: קְצִיעָה
  choice: கெத்சீயா
  rationale: தனிப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய மெய்யொலிக் கூட்டையும் நீண்ட உயிரையும் இயன்றவரை காட்டும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: קֶרֶן הַפּוּךְ
  choice: கெரென்-ஹப்பூக்
  rationale: இது பொருளுள்ள இரு கூறுகளைக் கொண்ட தனிப்பெயர்; இணைப்புக்குறியுடன் எழுத்துப்பெயர்த்து, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
