  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: ta
  text: தேமானியனான எலிப்பாஸ், சூகியனான பில்தாத், நாமாத்தியனான சோப்பார் ஆகியோர் சென்று, யாவே தங்களிடம் சொன்னபடியே செய்தார்கள். யாவே யோபுவை ஏற்றுக்கொண்டார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யோபுவின் முகத்தை உயர்த்தினார்.” இது ஒருவருக்குத் தயை காட்டுவதையோ அவரை ஏற்றுக்கொள்வதையோ குறிக்கும் மரபுத்தொடர்.
    reason: சொல்லர்த்தப் படிமத்தையும் அதன் மரபுத்தொடர் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்று
  rationale: הלך வினையின் தொடர் நிகழ்வைக் குறிக்கும் வடிவம் அடுத்த செயலை எளிமையாக விவரிக்கிறது; தொடர்ந்து வரும் ‘செய்தார்கள்’ என்பதோடு ‘சென்று’ என்பது இயல்பாக இணைகிறது.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: தேமானியனான / சூகியனான / நாமாத்தியனான
  rationale: இவை ஒவ்வொருவரின் ஊர் அல்லது இனக்குழுச் சார்பைக் காட்டும் எபிரெயப் பெயரடைகள். தமிழில் தனிப்பெயர்த் தன்மையையும் அடையாள உறவையும் இயல்பாகப் பாதுகாக்க ‘-யனான’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה இங்கு כַּאֲשֶׁר உடன் சேர்ந்து ‘சொன்னபடியே செய்தார்கள்’ என்ற பொதுவான பொருளைத் தருகிறது; செயலைத் தேவையின்றி குறிப்பாக்காமல் எபிரெயக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: தங்களிடம் சொன்னபடியே
  rationale: முன்னதாக யாவே அவர்களுக்குக் கூறிய கட்டளையை இது சுட்டுகிறது. தமிழில் காலவரிசை சூழலிலிருந்தே தெளிவாக இருப்பதால் இயல்பான ‘சொன்னபடியே’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּשָּׂא ... אֶת־פְּנֵי אִיּוֹב
  choice: யோபுவை ஏற்றுக்கொண்டார்
  rationale: נשׂא פנים என்பது ஒருவரை ஆதரவாக ஏற்றுக்கொள்வதையோ அவருக்கு தயை காட்டுவதையோ குறிக்கும் மரபுத்தொடர். இச்சூழலில் யோபுவின் வேண்டுதலைச் சார்ந்த அவரது சாதகமான ஏற்றுக்கொள்ளுதலைத் தெளிவாகச் சொல்கிறது; சொல்லர்த்தப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: யோபுவின்மீது காட்டப்பட்ட தெய்வீக ஆதரவைச் சொல்லும் மரபுத்தொடர்
  choice: யாவே யோபுவை ஏற்றுக்கொண்டார்
  alternative: யாவே யோபுவுக்குத் தயை காட்டினார் / யாவே யோபுவின் முகத்தை உயர்த்தினார்
  rationale: எபிரெய மரபுத்தொடர் சாதகமாக ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது. ‘ஏற்றுக்கொண்டார்’ என்பது யோபுவையும் அவரது இடைவேண்டுதலையும் கடவுள் சாதகமாகப் பெற்றுக்கொண்ட சூழலை வெளிப்படுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பெளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டது. பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெயத்தின் தொடர் நிகழ்வு வரிசையும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
