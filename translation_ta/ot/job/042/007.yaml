  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: ta
  text: 'யெகோவா யோபிடம் இந்த வார்த்தைகளைப் பேசிய பின்பு, இவ்வாறு நடந்தது: யெகோவா தேமானியனான எலிப்பாசிடம், “உன்மேலும் உன் இரண்டு நண்பர்கள்மேலும் என் கோபம் பற்றியெரிகிறது; ஏனெனில், என் ஊழியனாகிய யோபு பேசியதுபோல், நீங்கள் என்னைக் குறித்து சரியானதைப் பேசவில்லை.[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஊழியனாகிய யோபு பேசியதுபோல், நீங்கள் என்னிடம் சரியானதைப் பேசவில்லை.” எபிரேய முன்னிடைச்சொல் நேரடியாக “என்னிடம்” என்று பொருள்படும்; இச்சூழலில் அது “என்னைக் குறித்து” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்ட பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: וַיְהִי אַחַר
  choice: பின்பு
  rationale: எபிரெயக் கதைத் தொடரையும் கால உறவையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற சொற்சொல் நடையைத் தவிர்க்கிறது.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளைப் பேசிய
  rationale: דְּבָרִים என்பதன் வெளிப்படையான ‘வார்த்தைகள்’ பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: தேமானியனான எலிப்பாஸ்
  rationale: தனிப்பெயரையும் தேமான் பகுதியைச் சேர்ந்தவர் என்ற அடைமொழியையும் தெளிவாகக் காட்டுகிறது.
- source_word: חָרָה אַפִּי
  choice: என் கோபம் பற்றியெரிகிறது
  rationale: எபிரெய மூலத்திலுள்ள எரியும் கோபம் என்ற உயிரோட்டமான உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: உன்மேலும் உன் இரண்டு நண்பர்கள்மேலும்
  rationale: கோபம் யார்மீது செலுத்தப்படுகிறது என்பதைத் தெளிவாகவும், மூலத்தின் இரு கூறுகளையும் இணையாகவும் வழங்குகிறது.
- source_word: אֵלַי
  choice: என்னைக் குறித்து
  rationale: சொல்லர்த்தத்தில் ‘என்னிடம்’ என இருந்தாலும், உரையாடல்களின் உள்ளடக்கத்தை தேவன் மதிப்பிடும் சூழலில் ‘என்னைக் குறித்து’ என்பது இயல்பான சூழல்சார் பொருள்.
- source_word: נְכוֹנָה
  choice: சரியானதை
  rationale: உண்மை, தகுதி, நேர்மை ஆகிய சாத்திய நிழற்பொருள்களை ஒன்றுக்குள் சுருக்காமல், பரந்த ‘சரியானது’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: என் ஊழியனாகிய யோபு பேசியதுபோல்
  rationale: ‘என் ஊழியன்’ என்ற முக்கியமான தெய்வீக அடையாளத்தையும் யோபுடன் செய்யப்படும் ஒப்பீட்டையும் காக்கிறது.
theological_decisions:
- issue: אֵלַי என்பதை ‘என்னிடம்’ என்றா, ‘என்னைக் குறித்து’ என்றா மொழிபெயர்ப்பது
  choice: என்னைக் குறித்து
  alternative: என்னிடம்
  rationale: நண்பர்கள் தேவனைப் பற்றிப் பேசிய உரைகளின் உள்ளடக்கமே இங்கு மதிப்பிடப்படுவதாகச் சூழல் சுட்டுகிறது. ஆயினும் எபிரெய முன்னிடைச்சொல்லின் நேரடி வாசிப்பான ‘என்னிடம்’ என்பதை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
- issue: נְכוֹנָה என்பதன் மதிப்பீட்டு வலிமை
  choice: சரியானதை
  alternative: உண்மையை / முறையாக
  rationale: இந்தச் சொல் வெறும் தகவல் துல்லியத்தை மட்டுமோ, ஒழுக்க நேர்மையை மட்டுமோ குறிக்கிறது என்று குறுக்காமல், அதன் பொருள் அகலத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் இலக்கியத் தகுதியும் கொண்டிருந்தாலும் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெயக் கதைமொழியின் தேவையற்ற சொற்சொல் பிரதியீட்டைத் தவிர்த்து, கோபம் ‘பற்றியெரிகிறது’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
