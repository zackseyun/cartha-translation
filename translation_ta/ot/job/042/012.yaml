base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: ta
  text: யாவே யோபின் தொடக்கநிலையைவிட யோபின் பிற்காலத்தை அதிகமாக ஆசீர்வதித்தார்.[a] அவருக்குப் பதினான்காயிரம் ஆடுகள், ஆறாயிரம் ஒட்டகங்கள், ஆயிரம் இணை எருதுகள்[b], ஆயிரம் பெண் கழுதைகள் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யோபின் பிற்காலத்தை அவரது தொடக்கத்தைவிட.”
    reason: மூலத்தின் சுருக்கமான கால/நிலை ஒப்பீட்டை வெளிப்படுத்தும் சொல்லாட்சி.
  - marker: b
    text: அல்லது, “நுகத்தடியில் பூட்டப்பட்ட ஆயிரம் ஜோடி எருதுகள்.”
    reason: צֶמֶד என்பது ‘ஜோடி’ அல்லது நுகத்தடியில் ஒன்றாகப் பூட்டப்பட்ட உழவு விலங்குகளைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரான יהוה-ஐ, பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் பெயராக ஒலிபெயர்க்கிறது.
- source_word: בֵּרַךְ
  choice: ஆசீர்வதித்தார்
  rationale: ברך என்பதன் அடிப்படைப் பொருளையும், யோபின் செழிப்பு கடவுளிடமிருந்து வந்தது என்பதையும் காக்கிறது.
- source_word: אַחֲרִית אִיּוֹב
  choice: யோபின் பிற்காலத்தை
  rationale: אַחֲרִית இங்கு யோபின் வாழ்வின் பின்னைய நிலை அல்லது காலப்பகுதியைக் குறிக்கிறது; ‘கடைசி நாட்கள்’ என்று மிகக் குறுகலாகப் பொருள்படுத்துவதைத் தவிர்க்கிறது.
- source_word: מֵרֵאשִׁתוֹ
  choice: அவரது தொடக்கநிலையைவிட
  rationale: מִן ஒப்பீட்டையும் רֵאשִׁית யோபின் ஆரம்பகால நிலைமையையும் காட்டுகின்றன; தமிழில் ஒப்பீட்டைத் தெளிவாக வழங்குகிறது.
- source_word: וַיְהִי לוֹ
  choice: அவருக்கு ... இருந்தன
  rationale: ‘அவருக்கு இருந்தது’ என்ற எபிரெய உடைமை அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: பதினான்காயிரம் ஆடுகள்
  rationale: צֹאן சிறிய கால்நடைகளைக் கூட்டாகக் குறிக்கக்கூடும்; இப்பட்டியலின் சூழலில் மரபாகவும் இயல்பாகவும் ‘ஆடுகள்’ என வழங்கப்படுகிறது.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: ஆறாயிரம் ஒட்டகங்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: ஆயிரம் ஜோடி மாடுகள்
  rationale: צֶמֶד என்பது இணை அல்லது நுகத்தடியில் இணைக்கப்பட்ட ஜோடியைக் குறிக்கிறது; ‘ஜோடி மாடுகள்’ எண்ணிக்கையையும் வேளாண் பயன்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: ஆயிரம் பெண் கழுதைகள்
  rationale: אֲתוֹנוֹת பெண்பால் கழுதைகளைத் தெளிவாகக் குறிக்கிறது; அந்தச் சொற்சிறப்பைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என்பதைப் பயன்படுத்துவது அந்த வேறுபாட்டைக் காக்கிறது; எபிரெயத்தின் பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவங்களும் உள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் மரியாதைமிக்கதுமான வேதாகம நடை. கால்நடை எண்ணிக்கைகளில் மூலத்தின் துல்லியம் காக்கப்பட்டு, எபிரெயச் சொல்லாட்சியின் இயல்பில்லாத தன்மை தமிழில் மென்மையாக்கப்பட்டுள்ளது.
