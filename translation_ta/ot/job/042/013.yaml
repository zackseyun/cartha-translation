  text: He also had seven sons and three daughters.
translation:
  language: ta
  text: அவனுக்கு ஏழு மகன்களும் மூன்று மகள்களும் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு ... பிறந்தார்கள்
  rationale: எபிரெய மொழியின் உடைமை/இருப்பு மரபுத்தொடர் சொற்சொல்லாக ‘அவனுக்கு இருந்தார்கள்’ என மொழிபெயர்க்கப்படலாம். ஆனால் முந்தைய பிள்ளைகளின் அதே எண்ணிக்கை மறுபடியும் சொல்லப்படும் இச்சூழலில், இயல்பான நவீன தமிழில் பிள்ளைகள் அவனுக்குப் பிறந்ததைத் தெரிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: שִׁבְעָנָה
  choice: ஏழு
  rationale: எண்ணிக்கை நேரடியாகவும் துல்லியமாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: בָנִים
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஆண் பிள்ளைகளைத் தெளிவாகக் குறிப்பதால் பாலினக் குறிப்பு பாதுகாக்கப்பட்டது.
- source_word: וְשָׁלוֹשׁ
  choice: மூன்று
  rationale: இணைப்பிடைச்சொல் தமிழின் ‘-உம் ... -உம்’ அமைப்பில் இயல்பாக வெளிப்படுத்தப்பட்டு, எண்ணிக்கை நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: בָּנוֹת
  choice: மகள்கள்
  rationale: எபிரெயச் சொல் பெண் பிள்ளைகளைத் தெளிவாகக் குறிப்பதால் வழக்கமான கண்ணியமான தமிழ்ச் சொல் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: பிள்ளைகள் அவனிடம் இருந்தார்களா அல்லது அவனுக்குப் பிறந்தார்களா
  choice: பிறந்தார்கள்
  alternative: இருந்தார்கள்
  rationale: וַיְהִי לוֹ என்பது இலக்கணரீதியாக உடைமை/இருப்பைக் குறிக்கிறது; எனினும் பிள்ளைகளை எண்ணிக் கூறும் இச்சூழலில் ‘அவனுக்கு ... பிறந்தார்கள்’ என்பது தமிழில் இயல்பாக அந்த உறவைத் தெரிவிக்கிறது. இது முந்தைய பிள்ளைகள் உயிர்த்தெழுந்தனர் என்ற எந்தத் தனிப்பட்ட கோட்பாட்டையும் உரைக்குள் இறக்குமதி செய்யாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான வேதாகம நடையுடன், ஆண் மற்றும் பெண் பிள்ளைகள் குறித்த மூலமொழியின் துல்லியம் பாதுகாக்கப்பட்டுள்ளது.
