- from: “அறிவில்லாமல் திட்டத்தை மறைக்கிற[a] இவன் யார்?” ஆகவே, நான் பேசினேன்; ஆனால் புரிந்துகொள்ளவில்லை—எனக்கு எட்டாத[b], நான் அறியாத வியத்தகு காரியங்களைப் பற்றிப் பேசினேன்.
  to: “அறிவில்லாமல் திட்டத்தை மறைக்கிற[a] இவன் யார்?” ஆகவே, நான் பேசினேன்; ஆனால் எனக்கு எட்டாத[b], நான் அறியாத வியத்தகு காரியங்களைப் புரிந்துகொள்ளவில்லை.
  rationale: The revision retains the draft’s sound lexical choice ‘மறைக்கிற’ and its formal logical connection, while linking ‘வியத்தகு காரியங்களை’ directly with Job’s failure to understand. This reflects the Hebrew sequence without redundant repetition. Footnote b is clarified to preserve the contextual sense of matters beyond Job rather than comparative elevation.
