base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: ta
  text: “அறிவில்லாமல் திட்டத்தை மறைக்கிற[a] இவன் யார்?” ஆகவே, நான் பேசினேன்; ஆனால் எனக்கு எட்டாத[b], நான் அறியாத வியத்தகு காரியங்களைப் புரிந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபான மொழிபெயர்ப்பில், “அறிவில்லாமல் திட்டத்தை இருளாக்குகிற” என்றும் கூறப்படுகிறது. ஆனால் இங்கு வரும் எபிரெயச் சொல் யோபு 38:2-இல் வரும் சொல்லிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்கு அப்பாற்பட்ட” அல்லது “என் புரிதலுக்கு அப்பாற்பட்ட.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: இவன் யார்?
  rationale: நேரடியான வினாவின் கண்டிக்கும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: מַעְלִים
  choice: மறைக்கிற
  rationale: עלם என்பதன் ஹிஃபில் வடிவம் ‘மறைத்தல்/ஒளித்தல்’ என்பதைக் குறிக்கிறது. யோபு 38:2-இன் வேறுபட்ட எபிரெயச் சொல்லைப் பின்பற்றி ‘இருளாக்குகிற’ என்று ஒத்திசைக்காமல், இவ்வசனத்தின் சொந்தச் சொல்லை மொழிபெயர்க்கிறது.
- source_word: עֵצָה
  choice: திட்டம்
  rationale: இங்கு இறைவனுடைய ஞானமான நோக்கத்தையும் திட்டத்தையும் குறிக்கும் வகையில், சாதாரண வாசகருக்குத் தெளிவான இயல்பான தமிழ்ச் சொல்.
- source_word: בְּלִי דָעַת
  choice: அறிவில்லாமல்
  rationale: அறிவின்றிச் செயல்படுதல் என்ற எபிரெயச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்திய கண்டிப்பிலிருந்து யோபுவின் ஒப்புதல் தொடர்வதைக் காட்டும் காரணவிளைவு இணைப்பைத் தக்கவைக்கிறது.
- source_word: הִגַּדְתִּי
  choice: நான் பேசினேன்
  rationale: தான் முன்பு கூறியவற்றை யோபு ஒப்புக்கொள்வதை அடக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அறிவித்தேன்’ என்பது இச்சூழலில் தேவையற்ற வலிமையைக் கொடுக்கலாம்.
- source_word: וְלֹא אָבִין
  choice: ஆனால் புரிந்துகொள்ளவில்லை
  rationale: யோபு பேசியதற்கும் அவனிடம் புரிதல் இல்லாததற்கும் இடையிலுள்ள சூழல்சார் முரண்பாட்டைத் தெளிவாக்குகிறது; எபிரெய இணைப்பை இயல்பான தமிழில் எதிர்மறை இணைப்பாக வழங்குகிறது.
- source_word: נִפְלָאוֹת
  choice: வியத்தகு காரியங்கள்
  rationale: மனிதப் புரிதலை விஞ்சும் அற்புதமான காரியங்கள் என்ற பன்மைப் பெயர்ச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: מִמֶּנִּי
  choice: எனக்கு எட்டாத
  rationale: இச்சொற்றொடரில் யோபுவின் புரிதல் திறனைத் தாண்டியவை என்ற இடியோமப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא אֵדָע
  choice: நான் அறியாத
  rationale: இறுதி உடன்பாட்டை ‘காரியங்கள்’ என்பதோடு இயல்பாக இணைத்து, யோபுவின் அறியாமையைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோபு 42:3-க்கும் யோபு 38:2-க்கும் இடையிலான சொல் தொடர்பு
  choice: 42:3-இல் உண்மையில் உள்ள עלם என்பதற்கேற்ப ‘திட்டத்தை மறைக்கிற’ என்று மொழிபெயர்த்தல்
  alternative: ‘அறிவில்லாமல் திட்டத்தை இருளாக்குகிற’
  rationale: யோபு ஆண்டவரின் முந்தைய கண்டிப்பை மேற்கோளிடுவது அல்லது அதற்கு ஏற்ப மாற்றிக் கூறுவது போல் இருந்தாலும், 42:3-இன் எபிரெயச் சொல் 38:2-இன் חשך என்பதிலிருந்து வேறுபடுகிறது. ஆகவே இரு வசனங்களையும் ஒத்திசைக்காமல், இவ்வசனத்தின் மூலமொழிச் சொல்லுக்கு முன்னுரிமை அளிக்கப்படுகிறது.
- issue: யோபுவின் பேச்சுக்கும் புரிதலின்மைக்கும் இடையிலான உறவு
  choice: ‘நான் பேசினேன்; ஆனால் புரிந்துகொள்ளவில்லை’ என்று இரண்டையும் தனித்த கூற்றுகளாகத் தக்கவைத்தல்
  alternative: ‘நான் புரிந்துகொள்ளாதவற்றைப் பேசினேன்’
  rationale: எபிரெய உரையின் இணைநிலை அமைப்பையும் அதிலுள்ள இறையியல் பதற்றத்தையும் தக்கவைத்து, புரிதலின்மையை வெறும் தொடர்புச் சொல்லாக்கமாகச் சுருக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதாயும் சாதாரண வாசகருக்குப் புரியத்தக்கதாயும் அமைக்கப்பட்டுள்ளது. நேரடி மேற்கோளின் கண்டிக்கும் தொனியும், யோபுவின் தாழ்மையான ஒப்புதலும் பாதுகாக்கப்பட்டுள்ளன. ‘ஆலோசனை’ என்பதைக் காட்டிலும் இச்சூழலில் இறை நோக்கத்தை இயல்பாக உணர்த்துவதற்காக ‘திட்டம்’ தேர்ந்தெடுக்கப்பட்டது.
