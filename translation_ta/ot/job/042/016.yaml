  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: ta
  text: இதற்குப் பிறகு யோபு நூற்று நாற்பது ஆண்டுகள் வாழ்ந்தார். அவர் தம் மகன்களையும் தம் மகன்களின் மகன்களையும் கண்டார்; இவ்வாறு நான்கு தலைமுறைகளைக் கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பாக, “தம் மகன்களையும் பேரன்களையும் காணுமளவு வாழ்ந்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்குச் சொல், “தம் மகன்களையும் தம் மகன்களின் மகன்களையும் கண்டார்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தார்
  rationale: חיה என்ற வினையின் நேரடியான பொருளையும், முந்தைய நிகழ்வுகளுக்குப் பின் யோபுவின் வாழ்க்கை தொடர்ந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֵי זֹאת
  choice: இதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வுகளுக்குப் பிந்தைய காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: நூற்று நாற்பது ஆண்டுகள்
  rationale: எண்ணிக்கையைத் துல்லியமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: ראה என்பதன் நேரடிப் பொருளைத் தக்கவைக்கிறது; ‘காணும் வரை வாழ்ந்தார்’ என்ற உட்பொருளை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בָּנָיו
  choice: தம் மகன்களை
  rationale: எபிரெயத்தில் உள்ள ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைப் பொதுவான ‘பிள்ளைகள்’ என்று மாற்றாமல் துல்லியமாகத் தருகிறது.
- source_word: בְּנֵי בָנָיו
  choice: தம் மகன்களின் மகன்களை
  rationale: ‘அவருடைய மகன்களின் மகன்கள்’ என்ற எபிரெயத் தொடரின் வடிவத்தையும் ஆண்பால் குறிப்பையும் பாதுகாக்கிறது; ‘பேரன்கள்’ என்பது இயல்பான மாற்று.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: நான்கு தலைமுறையினரை
  rationale: யோபு கண்ட குடும்ப வழியின் விரிவைத் தெளிவாகக் குறிக்கிறது; ‘நான்கு தலைமுறைகள்’ என்ற எண்ணிக்கையை அப்படியே காக்கிறது.
