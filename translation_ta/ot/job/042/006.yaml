source:
  edition: WLC
  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: ta
  text: ஆகையால் நான் என்னையே வெறுக்கிறேன்[a]; புழுதியிலும் சாம்பலிலும் மனந்திரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகையால் நான் என் கூற்றைத் திரும்பப் பெறுகிறேன்; புழுதியையும் சாம்பலையும் குறித்து மனம் மாறுகிறேன்.” எபிரெய வாசகம் சுருக்கமானதும் விவாதத்திற்குரியதுமாக உள்ளது. குறிப்பாக, “வெறுக்கிறேன்/நிராகரிக்கிறேன்” என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; அடுத்த வினைச்சொல் “மனந்திரும்புகிறேன்,” “வருந்துகிறேன்,” “மனம் மாறுகிறேன்,” அல்லது “ஆறுதல் அடைகிறேன்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட இறைச் சந்திப்பிலிருந்து யோபு எடுக்கும் முடிவை இயல்பான நவீனத் தமிழில் தெரிவித்து, எபிரெயச் சொற்றொடரின் காரணவிளைவு வலிமையைப் பாதுகாக்கிறது.
- source_word: אֶמְאַס
  choice: நான் என்னையே வெறுக்கிறேன்
  rationale: מאס என்பதன் அடிப்படைப் பொருள் ‘வெறுத்தல்/நிராகரித்தல்.’ எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; தமிழில் சூழலுக்கேற்ற பொதுவான புரிதலைத் தெளிவாக்க ‘என்னையே’ சேர்க்கப்பட்டுள்ளது. இது விளக்கத் தேர்வு என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנִחַמְתִּי
  choice: மனந்திரும்புகிறேன்
  rationale: נחם என்பதன் நிஃபால் வடிவம் சூழலுக்கேற்ப வருந்துதல், மனந்திரும்புதல், தன் நிலைப்பாட்டிலிருந்து விலகுதல் அல்லது ஆறுதல் அடைதல் ஆகிய நுண்பொருள்களைக் கொள்ளலாம். கடவுளைக் கண்டபின் யோபு அளிக்கும் தாழ்மையான பதிலின் சூழலில் ‘மனந்திரும்புகிறேன்’ பொருத்தமானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עַל
  choice: புழுதியிலும் சாம்பலிலும்
  rationale: עַל என்பதன் நேர்ப்பொருள் ‘மேல்/குறித்து’ என்றாலும், புழுதியும் சாம்பலும் சார்ந்த தாழ்வு அல்லது துக்கநிலையைத் தமிழில் இயல்பாகக் காட்ட ‘-இல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עָפָר וָאֵפֶר
  choice: புழுதியிலும் சாம்பலிலும்
  rationale: இந்த இணைச்சொல் மனித நிலையாமை, தாழ்மை, துக்கம் ஆகியவற்றைக் குறிக்கிறது. ‘புழுதியும் சாம்பலும்’ என்பது இயல்பான, கண்ணியமான தமிழ் மரபுச் சொல்லாக்கம்.
theological_decisions:
- issue: யோபுவின் இறுதிப் பதில் தன்னைத்தானே தாழ்த்தி மனந்திரும்புவதா, அல்லது தன் முந்தைய கூற்றைத் திரும்பப் பெறுவதா?
  choice: யோபு தன்னை வெறுத்து, புழுதியிலும் சாம்பலிலும் மனந்திரும்புவதாக முதன்மை உரை வழங்குகிறது.
  alternative: ‘ஆகையால் நான் என் கூற்றைத் திரும்பப் பெறுகிறேன்; புழுதியையும் சாம்பலையும் குறித்த என் நிலைப்பாட்டிலிருந்து விலகுகிறேன்’ அல்லது வெளிப்படையான தற்சுட்டு இல்லாமல் ‘நான் நிராகரிக்கிறேன்’ என்று வாசிக்கலாம்.
  rationale: אֶמְאַס என்பதற்கான செயப்படுபொருள் கூறப்படவில்லை; וְנִחַמְתִּי என்பதும் பல நுண்பொருள்களைக் கொண்டது. 42:5-இல் உள்ள இறைச் சந்திப்பும் தாழ்மையான பதிலும் முதன்மைத் தேர்வை ஆதரிக்கின்றன. ஆயினும் எபிரெயத்தின் சுருக்கமும் உண்மையான பொருள் மயக்கமும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என்னையே’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சூழலின் அடிப்படையில் நிரப்புகிறது; இதனால் உண்டாகும் விளக்கத் தேர்வு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
