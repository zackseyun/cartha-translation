  text: וְ/עָֽדֵי/כֶ֗ם אֶתְבּ֫וֹנָ֥ן וְ/הִנֵּ֤ה אֵ֣ין לְ/אִיּ֣וֹב מוֹכִ֑יחַ עוֹנֶ֖ה אֲמָרָ֣י/ו מִ/כֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: ta
  text: நான் உங்களைக் கூர்ந்து கவனித்தேன்[a]; இதோ, யோபுவைத் தவறென நிரூபித்து, அவருடைய சொற்களுக்குப் பதிலளித்தவர் உங்களில் ஒருவரும் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் உங்களைக் கவனமாகக் கேட்டேன்.’ எபிரெய வினைச்சொல் கூர்ந்த பரிசீலனையையோ கவனமான நோக்குதலையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யோபுவைக் கண்டித்தவர்/திருத்தியவர்.’ எபிரெயச் சொல் வாதத்தில் தவறென நிரூபிப்பதையும், ஒருவரைக் கண்டிப்பதையும் அல்லது திருத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: நான் உங்களைக் கூர்ந்து கவனித்தேன்
  rationale: עַדֵיכֶם கவனம் அவர்களை நோக்கிச் செலுத்தப்பட்டதைக் காட்டுகிறது; בין என்பதன் Hitpolel வடிவம் ஆழ்ந்த, கவனமான பரிசீலனையைக் குறிக்கிறது. உரையாடல் சூழலில் இந்தத் தமிழ் சொற்றொடர் கவனமாகக் கேட்டதையும் ஆராய்ந்ததையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְהִנֵּה
  choice: ஆனால் பாருங்கள்
  rationale: הִנֵּה எலிகூ கண்ட முடிவை வலியுறுத்தும் உரையாடல் குறியீடு. இவ்விடத்தில் முன் கூறிய கவனித்தலுக்கும் எதிர்மறை முடிவுக்கும் உள்ள திருப்பத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; ‘பாருங்கள்’ அதன் சொல்லாட்சிச் செறிவைப் பேணுகிறது.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: யாரும் யோபுவின் வாதத்தை மறுக்கவோ இல்லை
  rationale: יכח வேரிலான מוֹכִיחַ கண்டித்தல், திருத்துதல், வாதத்தில் தவறென நிரூபித்தல் ஆகிய பொருள்களை ஏற்கலாம். இங்கு விவாதச் சூழல் முதன்மையானதால் ‘வாதத்தை மறுக்க’ என்பது இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עוֹנֶה אֲמָרָיו
  choice: அவருடைய சொற்களுக்குப் பதிலளிக்கவோ
  rationale: ענה + ‘சொற்கள்’ என்பது ஒருவர் கூறியவற்றுக்குப் பதில் கூறுவதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு எபிரெயக் கட்டமைப்பையும் தமிழின் இயல்பையும் பேணுகிறது.
- source_word: מִכֶּם
  choice: உங்களில் யாரும்
  rationale: מִן இங்கு அந்தக் குழுவிலிருந்து ஒருவரையும் குறிக்கும். எதிர்மறை இருப்புக் கூற்றில் ‘உங்களில் யாரும் ... இல்லை’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: מוֹכִיחַ என்பதன் வாதரீதியான அல்லது அறநெறி சார்ந்த நுணுக்கம்
  choice: யோபுவின் வாதத்தை மறுக்க
  alternative: யோபுவைக் கண்டிக்க/திருத்த
  rationale: யோபும் நண்பர்களும் நடத்தும் விவாதச் சூழலில் வாதத்திற்குப் பதிலளித்து அதைத் தவறெனக் காட்டும் பொருள் முன்னிலை பெறுகிறது. எனினும், அறநெறி சார்ந்த கண்டித்தல் அல்லது திருத்துதல் என்ற சாத்தியத்தை உரை தீர்மானமாக நீக்காததால் அது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் ஞான இலக்கிய விவாதத்துக்கேற்ற கண்ணியமான தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாருங்கள்’ என்ற சொல் הִנֵּה-யின் வலியுறுத்தலைப் பேணுகிறது; இரட்டை ‘-வோ’ அமைப்பு யாரும் இவ்விரண்டையும் செய்யவில்லை என்ற எபிரெய இணைப்பைத் தெளிவாக வழங்குகிறது.
