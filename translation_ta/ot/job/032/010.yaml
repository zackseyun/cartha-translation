base_translation:
  language: en
  yaml_path: translation/ot/job/032/010.yaml
  text: Therefore I say[a], ‘Listen to me; I too will declare my knowledge.’
translation:
  language: ta
  text: 'ஆகையால் நான் சொல்கிறேன்[a]: “நீ எனக்குச் செவிகொடு; நானும் என் அறிவைத் தெரிவிப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “ஆகையால் நான் சொன்னேன்: ‘நீ எனக்குச் செவிகொடு; நானும் என் அறிவைத் தெரிவிப்பேன்.’” எபிரெய வினை வடிவத்தை எளிய இறந்தகாலமாகவும் கொள்ளலாம்; ஆனால் இங்கு, சூழலில் அது தற்போது சொல்லப்படும் தீர்மானத்தை நிகழ்த்திக் காட்டும் வலிமையுடன் இருப்பதாகத் தெரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து எடுக்கப்படும் முடிவைக் குறிக்கும் இணைப்புச் சொல்; தர்க்கத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: אָמַרְתִּי
  choice: நான் சொல்கிறேன்
  rationale: வடிவியல் அடிப்படையில் இது இறந்தகால நிறைவுவினை என்றாலும், இச்சூழலில் எலிகூ இப்போது பேசத் தொடங்கும் செயலை நிகழ்த்திக் காட்டும் வலிமையுடன் வருகிறது; நிகழ்காலம் அந்த உரைநடைக் கூறை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְעָה
  choice: செவிகொடு
  rationale: கவனித்துக் கேட்கும்படி கட்டளையிடும் ஒருமை ஆண்பால் வடிவத்தை, நவீனத் தமிழில் இயல்பாகவும் மரியாதை குன்றாமலும் தருகிறது.
- source_word: לִּי
  choice: எனக்கு
  rationale: கவனித்துக் கேட்பதன் இலக்கைச் சுட்டும் முன்னிடைச்சொல்லைத் தமிழின் ‘செவிகொடு’ என்ற சொல்லாட்சியோடு இயல்பாக இணைக்கிறது.
- source_word: אֲחַוֶּה
  choice: தெரிவிப்பேன்
  rationale: ஒன்றை அறியச் செய்வது அல்லது எடுத்துரைப்பது என்ற பொருளைத் தருகிறது; ‘விளக்குவேன்’ என்று கூடுதல் விளக்கப் பொருளைச் சேர்க்காமல், தமிழில் இயல்பான முறையில் அறிவித்தலைக் குறிக்கிறது.
- source_word: דֵּעִי
  choice: என் அறிவை
  rationale: அறிவு அல்லது அறிந்துணர்வு என்பதைக் குறிக்கும் பெயர்ச்சொல்லை நேரடியாகப் பேணுகிறது; ‘என் கருத்தை’ என்பது மூலத்தின் அறிவுசார் உரிமைக்கூற்றைத் தளர்த்திவிடும்.
- source_word: אַף אֲנִי
  choice: நானும்
  rationale: மற்றவர்களோடு தன்னையும் சேர்த்துக் கொள்ளும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
