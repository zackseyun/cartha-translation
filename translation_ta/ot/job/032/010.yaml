  source_fidelity: மூல எபிரெயத்தின் தர்க்க இணைப்பு (לָכֵן), நிகழ்காலச் செயலாற்றல் வலிமையுடன் கொள்ளத்தக்க אָמַרְתִּי, ஒருமை கட்டளை ‘கேள்/செவிகொடு,’ ‘எனக்கு,’ ‘என் அறிவை அறிவிப்பேன்,’ மற்றும் வலியுறுத்தலான ‘நானும்’ ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: '‘ஆகையால் நான் சொல்கிறேன்: “நீ எனக்குச் செவிகொடு; நானும் என் அறிவைத் தெரிவிப்பேன்.”’ என்பது நவீன நிலையான தமிழில் இயல்பானதும், எலிகூவின் மரியாதையான ஆனால் உறுதியான உரைநடைக்கு ஏற்றதுமாக உள்ளது. ‘செவிகொடு’ இங்கு பொருத்தமான நேரடி அழைப்பாகும்.'
  terminology: ‘அறிவு’ என்பது דֵּעִי என்பதற்குச் சரியான, தேவையற்ற விளக்கப் பொருளைச் சேர்க்காத மொழிபெயர்ப்பு. ‘தெரிவிப்பேன்’ என்பது אֲחַוֶּה-யின் அறிவித்தல்/அறியச்செய்தல் பொருளை நன்றாகக் காட்டுகிறது. பெயர்கள் அல்லது இறையியல் சொற்கள் இவ்வசனத்தில் இல்லை.
