translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பு காக்கப்பட்டுள்ளது; நேரடியாக மொழிபெயர்த்தால் தமிழில் தெளிவிழக்கும் ஆகுபெயர்கள் முதன்மை உரையில் வெளிப்படுத்தப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
