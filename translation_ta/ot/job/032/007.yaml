  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: ta
  text: 'நான் சொன்னேன்[a]:


    ‘வயதில் மூத்தவர்கள் பேச வேண்டும்;


    பல ஆண்டுகள் வாழ்ந்தவர்கள் ஞானத்தைத் தெரியப்படுத்த வேண்டும்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நான் நினைத்தேன்: ‘நாட்கள் பேச வேண்டும்; ஆண்டுகளின் மிகுதி ஞானத்தைத் தெரியப்படுத்த வேண்டும்.’” எபிரெயத்தில் ‘நாட்கள்’ மற்றும் ‘ஆண்டுகளின் மிகுதி’ என்பவை ஆகுபெயர்களாக வயதில் மூத்தவர்களைக் குறிக்கின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: நான் நினைத்தேன்
  rationale: இது பொதுவாக ‘நான் சொன்னேன்’ என்று பொருள்படும் கால் நிறைவுவினை, தன்மை ஒருமை வடிவம். ஆனால் இச்சூழலில் எலிகூ முன்பு கொண்டிருந்த எண்ணம் அல்லது எதிர்பார்ப்பை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘நான் நினைத்தேன்’ என்பது கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது; ‘நான் சொன்னேன்’ என்பதும் நேரடி மாற்றாகும்.
- source_word: יָמִים
  choice: வயதில் மூத்தவர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘நாட்கள்’ எனினும், இங்கு நீண்ட ஆயுளுடைய முதியவர்களைக் குறிக்கும் ஆகுபெயராக உள்ளது. தமிழில் ‘நாட்கள் பேசட்டும்’ என்பது பொருள் மறைக்கக்கூடும் என்பதால், கவிதையின் கருத்தை இயல்பாகத் தெரிவிக்க ‘வயதில் மூத்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְדַבֵּרוּ
  choice: பேசட்டும்
  rationale: பியேல் முற்றாத வினையின் சூழல்சார் எதிர்பார்ப்பு அல்லது தகுதியுணர்வைத் தமிழின் ‘-ட்டும்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְרֹב שָׁנִים
  choice: பல ஆண்டுகள் வாழ்ந்தவர்கள்
  rationale: நேரடியாக ‘ஆண்டுகளின் மிகுதி’ அல்லது ‘பல ஆண்டுகள்’ என்று பொருள்படும். முதல் அடியுடன் இணையாக, அந்த ஆண்டுகளை வாழ்ந்தவர்களைக் குறிக்கும் ஆகுபெயர்ப் பொருள் தமிழில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: יֹדִיעוּ
  choice: தெரியப்படுத்தட்டும்
  rationale: ஹிஃபில் முற்றாத வடிவம் ‘அறியச் செய்தல், தெரியப்படுத்துதல்’ எனப் பொருள்படும். ‘கற்பிக்கட்டும்’ என்பது பொருளைச் சுருக்கிவிடும்; ‘தெரியப்படுத்தட்டும்’ மூலத்தின் காரணவினைப் பொருளையும் எதிர்பார்ப்பையும் காக்கிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: ‘ஞானம்’ என்பது மூலத்தின் கருத்துப்பெயரை நேரடியாகவும் யோபு நூலின் மையக் கருப்பொருளுக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
