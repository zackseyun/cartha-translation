  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: ta
  text: எலிகூவின் கோபம் அவருடைய மூன்று நண்பர்களுக்கு எதிராகவும் பற்றியெரிந்தது; ஏனெனில், அவர்கள் எந்தப் பதிலும் கண்டுபிடிக்கவில்லை, ஆயினும் யோபைக் குற்றவாளி என்று தீர்த்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோபைப் பொல்லாதவர் என்று கருதினர்.”
    reason: רשע என்ற வேர்ச்சொல்லின் Hiphil வடிவம் ஒருவரைக் குற்றவாளி எனத் தீர்ப்பதையோ, அவரைப் பொல்லாதவர் எனக் கருதுவதையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: அவருடைய மூன்று நண்பர்கள்மீதும்
  rationale: חָרָה אַף என்ற கோபத்தைக் குறிக்கும் மரபுத்தொடருடன் வரும் ב, கோபம் செலுத்தப்பட்ட நபர்களைக் குறிக்கிறது; தமிழில் ‘மீது’ இயல்பாக இதை வெளிப்படுத்துகிறது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட எலிகூவை ‘அவருடைய’ சுட்டுகிறது.
- source_word: חָרָה אַפּוֹ
  choice: அவருடைய கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மரபுத்தொடரின் ‘கோபம் எரிதல்’ என்ற உருவகத்தை, நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் காக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: …தால்
  rationale: எலிகூவின் கோபத்திற்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: பதில் எதையும் கண்டுபிடிக்காமல்
  rationale: מַעֲנֶה என்பது விவாதச் சூழலில் ‘பதில்’ அல்லது ‘மறுமொழி’ எனப் பொருள்படும்; ‘பதில்’ சாதாரண வாசகருக்கு நேரடியானது.
- source_word: וַיַּרְשִׁיעוּ אֶת אִיּוֹב
  choice: யோபைக் குற்றவாளி என்று தீர்த்ததால்
  rationale: רשע என்பதன் Hiphil வடிவத்திலுள்ள அறிவிப்பு/நீதித்தீர்ப்புச் சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது; வெறுமனே ‘பொல்லாதவர் என நடத்தினர்’ என்று பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: நண்பர்கள் யோபுக்கு எதிராகச் செய்த செயலின் பொருள்
  choice: யோபைக் குற்றவாளி என்று தீர்த்தனர்
  alternative: யோபைப் பொல்லாதவர் என்று கருதினர் / நடத்தினர்
  rationale: Hiphil வடிவமான וַיַּרְשִׁיעוּ விவாதச் சூழலில் ஒருவரைக் குற்றவாளி எனத் தீர்ப்பதைக் குறிக்க இயலும். இந்த மொழிபெயர்ப்பு நீதித்தீர்ப்புச் சாயலைக் காக்கிறது; மாற்றுப் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: வாவ் இணைப்பின் உரையாடல் தொடர்பு
  choice: காரணத் தொடராக ‘…கண்டுபிடிக்காமல், …தீர்த்ததால்’
  alternative: ‘பதில் காணவில்லை; ஆனாலும் யோபைக் குற்றவாளி என்று தீர்த்தனர்’
  rationale: וַ என்பது அடிப்படையில் இணைப்புச் சொல்; சூழலில் காணப்படும் முரண்பாட்டைத் தமிழ்ச் சொற்றொடரமைப்பு இயல்பாக உணர்த்துகிறது. ‘ஆனாலும்’ என்பதை வெளிப்படையாகச் சேர்த்து மூலத்தில் உள்ளதைவிட உறவை மிகத் துல்லியமாக நிர்ணயிப்பது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘கோபம் பற்றியெரிந்தது’ மூலம் மூல உருவகம் காக்கப்படுகிறது; ‘குற்றவாளி என்று தீர்த்தனர்’ மூலம் நீதித்தீர்ப்புச் சாயல் வெளிப்படுகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
