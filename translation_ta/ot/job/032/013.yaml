  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: ta
  text: “நாங்கள் ஞானத்தைக் கண்டோம்; கடவுளே அவனைத் துரத்தியடிப்பார், மனிதர் அல்ல” என்று நீங்கள் சொல்லிவிடாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளே அவனுக்குப் பதிலளிப்பார், மனிதர் அல்ல” அல்லது “கடவுளே அவனை அடக்குவார், மனிதர் அல்ல” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பொதுவாக “விரட்டுதல்” அல்லது “துரத்தியடித்தல்” என்று பொருள்படும்; ஆனால் இங்கு யோபை முறியடிப்பதையோ அவரது வாதத்தை மறுப்பதையோ விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: சொல்லிவிடாதீர்கள்
  rationale: எச்சரிக்கையையும் நிகழக்கூடிய கூற்றைத் தடுக்கிற நோக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֹּאמְרוּ
  choice: நீங்கள் சொல்லிவிடாதீர்கள்
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம்; தமிழில் பால் வேறுபாடில்லாத மரியாதை/பன்மை வடிவம் பொருத்தமாக உள்ளது.
- source_word: מָצָאנוּ
  choice: நாங்கள் கண்டடைந்தோம்
  rationale: ஏற்கெனவே அடைந்துவிட்டதாக அவர்கள் கூறக்கூடிய முடிவுற்ற கூற்றைத் தெளிவாகக் காட்டுகிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: மூலச்சொல்லின் வழக்கமான, சூழலுக்கு ஏற்ற நேரடியான பொருள்.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு மனித முகவருக்கு எதிராக நிறுத்தப்படும் கடவுளைக் குறிக்கிறது.
- source_word: יִדְּפֶנּוּ
  choice: அவனைத் துரத்தியடிப்பவர்
  rationale: נדף என்ற வினையின் அடிப்படை உருவகமான துரத்துதல் அல்லது விரட்டுதலைப் பாதுகாக்கிறது; சூழலில் இது யோபை முறியடிப்பது அல்லது மறுப்பது என்ற விரிவான பொருளையும் கொள்ளலாம்.
- source_word: לֹא אִישׁ
  choice: மனிதர் அல்ல
  rationale: கடவுளுக்கும் ஒரு மனித முகவருக்கும் இடையிலான பொதுவான முரணைத் தமிழில் இயல்பாகக் காட்டுகிறது; குறிப்பாக ஆண் ஒருவரை மட்டும் சுட்டவில்லை.
theological_decisions:
- issue: אֵל יִדְּפֶנּוּ לֹא אִישׁ என்பதன் பொருள்
  choice: அவனைத் துரத்தியடிப்பவர் கடவுளே, மனிதர் அல்ல
  alternative: அவனுக்குப் பதிலளிப்பவர் கடவுளே, மனிதர் அல்ல; அவனை அடக்குபவர் கடவுளே, மனிதர் அல்ல
  rationale: முதன்மை உரை எபிரெய வினையின் உறுதியான துரத்துதல்/விரட்டுதல் உருவகத்தை வைத்திருக்கிறது; ஆனால் யோபை மறுத்தல் அல்லது முறியடித்தல் என்ற சூழல்சார் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: אִישׁ என்ற பொதுமை ஒருமை
  choice: மனிதர்
  alternative: ஒரு மனிதன்
  rationale: இங்கு பாலினத்தை வலியுறுத்தாமல் கடவுளுக்கு எதிரான மனித முகவரையே குறிக்கிறது. ‘மனிதர்’ என்பது அந்தப் பொதுமைப் பொருளை இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் கடவுள்–மனிதர் முரண் தெளிவாக வைக்கப்பட்டு, விவாதத்துக்குரிய வினையின் உருவகம் முதன்மை உரையிலும் மாற்றுப் பொருள்கள் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
