    text: அல்லது “தீர்ப்பு,” “நியாயம்,” அல்லது “சரியானது.” எபிரெயச் சொல் சட்டத் தீர்ப்பு, நீதி, அல்லது சரியான ஒழுங்கைக் குறிக்கலாம்.
    reason: lexical_alternative
  revision_rationale: The revision uses an explicit paired-negative structure to reflect the Hebrew לֹא … וְ without adding a restrictive nuance. It maintains the concise poetic parallelism, preserves the age—not office—sense of זקנים, and retains ‘நீதி’ for מִשְׁפָּט with viable lexical alternatives in the footnote.
