source:
  edition: WLC
  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: ta
  text: 'பலர் ஞானமுள்ளவர்கள் அல்லர்;

    முதியோரும் நீதியை[a] புரிந்துகொள்பவர்கள் அல்லர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீர்ப்பு,” “நியாயம்,” அல்லது “சரியானது.” எபிரெயச் சொல் சட்டத் தீர்ப்பு, நீதி, அல்லது சரியான ஒழுங்கைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: என்பதில்லை … என்பதுமில்லை
  rationale: எபிரெய மறுப்பை இரு இணை அடிகளுக்கும் இயல்பான தமிழில் பொருந்துமாறு அமைத்து, வயதும் எண்ணிக்கையும் ஞானத்திற்கு உறுதியான அடிப்படை அல்ல என்ற அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: רַבִּים
  choice: பலரே
  rationale: இங்கு பெயர்ச்சொல்லாகச் செயல்படும் ‘பலர்’ என்ற எண்ணிக்கை சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘பெரியவர்கள்’ என்று பதவி அல்லது மேன்மை சார்ந்த பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: יֶחְכָּמוּ
  choice: ஞானமுள்ளவர்கள்
  rationale: ஞானமுள்ளவர்களாக இருத்தல் அல்லது ஆகுதல் என்ற வினையின் பொருளை, பொதுவான உண்மையைக் கூறும் இச்சூழலில் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: וּזְקֵנִים
  choice: முதியவர்களே
  rationale: வயதை மையப்படுத்திய எதிர்மறை ஒப்பீட்டை வெளிப்படுத்துகிறது; அதிகாரப்பூர்வப் பதவியைக் குறிக்கக்கூடிய ‘மூப்பர்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: יָבִינוּ
  choice: புரிந்துகொள்கிறார்கள்
  rationale: புரிந்துகொள்ளுதல் அல்லது பகுத்தறிதல் என்ற பொருளை இங்கு இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: சட்டத் தீர்ப்பு, நீதி, சரியான ஒழுங்கு ஆகிய பொருள் பரப்பைக் கொண்ட சொல்லுக்கு இச்சூழலில் விரிவான அறநீதி சார்ந்த பொருளை அளிக்கிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
