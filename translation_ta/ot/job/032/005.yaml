  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: ta
  text: அந்த மூன்று பேரின் வாயிலும் பதில் இருக்கவில்லை என்பதை எலிகூ கண்டபோது, அவனுடைய கோபம் கொழுந்துவிட்டு எரிந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: தொடர்கதைச் சூழலில் waw-consecutive நிகழ்வின் வரிசையை முன்னெடுக்கிறது; அடுத்து வரும் எலிகூவின் எதிர்வினையுடன் காலத் தொடர்பை இயல்பாக இணைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֱלִיהוּא
  choice: எலிகூ
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு எலிகூ கண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணப் பொருளாக அல்ல.
- source_word: אֵין מַעֲנֶה
  choice: பதில் இல்லை
  rationale: கடந்தகாலக் கதையாடலில், மூவராலும் மறுமொழி கூற முடியாத நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּפִי
  choice: வாயிலும்
  rationale: ‘வாயில்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்துள்ளது; மூவரில் ஒருவரிடமும் பதில் இல்லை என்ற பகிர்ந்தளிப்பு உணர்வைத் தமிழின் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: அந்த மூன்று பேர்
  rationale: முன்னரே குறிப்பிடப்பட்ட யோபின் மூன்று நண்பர்களைக் குறிக்கும் குறிப்புத்தன்மையை ‘அந்த’ காட்டுகிறது; நவீன தமிழில் ‘மூன்று பேர்’ இயல்பான மனித எண்ணுப்பெயர் அமைப்பு.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவனுடைய கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற தீவிர உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது; வெறுமனே ‘கோபமடைந்தான்’ என்பதைவிட மூலத்தின் வலிமையை வெளிப்படுத்துகிறது.
