source:
  edition: WLC
  text: הִנֵּֽה בִטְנִ֗/י כְּ/יַ֥יִן לֹא יִפָּתֵ֑חַ כְּ/אֹב֥וֹת חֲ֝דָשִׁ֗ים יִבָּקֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: ta
  text: இதோ, என் வயிறு திறக்கப்படாத திராட்சரசம்போல் இருக்கிறது; புதிய தோல் பைகள் வெடித்துவிடப் போவதுபோல் அது வெடித்துவிடப் போகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தோல் பைகள்” என்பது திராட்சரசம் போன்ற திரவங்களை வைக்கப் பயன்படுத்தப்பட்ட விலங்குத் தோலால் செய்யப்பட்ட கொள்கலன்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: எலிகூவின் உயிரோட்டமான உவமைக்குக் கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் வலிமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: בִטְנִי
  choice: என் வயிறு
  rationale: சொல்லின் நேரடியான உடல்சார் படிமத்தையும் உள்ளத்தில் பெருகும் அழுத்தத்தையும் விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: כְיַיִן
  choice: திராட்சரசத்தைப் போல
  rationale: மூலத்தில் உள்ள எளிய ஒப்புமையைப் பின்பற்றுகிறது; புளித்துக்கொண்டிருப்பதாக மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: לֹא יִפָּתֵחַ
  choice: திறக்கப்படாத
  rationale: நிபால் வடிவின் நேரடிப் பொருளைத் தக்கவைக்கிறது. சூழலில் வெளியேறும் வழியில்லாத அழுத்தம் குறிக்கப்படலாம்; அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: כְאֹבוֹת חֲדָשִׁים
  choice: புதிய திராட்சரசத் தோற்பைகளைப் போல
  rationale: இங்கு אֹבוֹת என்பது ஆவிகளை அல்ல, திராட்சரசம் வைக்கும் தோல் கொள்கலன்களைக் குறிக்கிறது; தமிழ் வாசகருக்கு பொருளைத் தெளிவாக்கும் பண்பாட்டு இணைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִבָּקֵעַ
  choice: அது வெடித்துவிடப் போகிறது
  rationale: பிளத்தல் அல்லது வெடித்தல் என்ற வினையின் பொருளையும், உவமையில் உணரப்படும் உடனடி அழுத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
