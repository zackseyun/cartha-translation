  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வயிறு, திறக்கப்படாத திராட்சரசம், புதிய தோற்பைகள் ஆகிய எபிரெயப் படிமங்கள் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
