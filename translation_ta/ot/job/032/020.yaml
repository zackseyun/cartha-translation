  yaml_path: translation/ot/job/032/020.yaml
  text: I will speak[a], that I may find relief; I will open my lips and answer.
translation:
  language: ta
  text: நான் பேசுவேன்; எனக்கு நிம்மதி கிடைக்கும்படி பேசுவேன்[a]. என் உதடுகளைத் திறப்பேன்; பதிலளிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேசுவேன்; அதனால் எனக்கு நிம்மதி கிடைக்கும்” அல்லது “நான் இளைப்பாறுவேன்.” எபிரெயத் தொடர் விளைவாகவும் நோக்கமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: நான் பேசுவேன்
  rationale: דבר என்பதன் முதலாம் நபர் ஒருமை cohortative வடிவம் பேசுபவரின் உறுதியையும் நோக்கத்தையும் காட்டுகிறது. நவீனத் தமிழில் ‘நான் பேசுவேன்’ என்பது அந்தத் தன்னுறுதியை இயல்பாகத் தருகிறது.
- source_word: וְיִרְוַח לִי
  choice: அதனால் எனக்கு நிம்மதி கிடைக்கும்
  rationale: רוח என்பதன் Qal பயன்பாடு ‘விடுபாடு அல்லது இளைப்பாறுதல் பெறுதல்’ என்ற பொருளைத் தருகிறது; לִי என்பது அந்த நிம்மதி பேசுபவருக்குக் கிடைப்பதைக் குறிக்கிறது. וְ என்ற இணைப்பு இங்கு விளைவு அல்லது நோக்கம் ஆகிய இரண்டாகவும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரையில் இயல்பான விளைவு உறவு தரப்பட்டுள்ளது, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶפְתַּח
  choice: திறந்து
  rationale: פתח என்பதன் Qal imperfect முதலாம் நபர் ஒருமை வடிவத்துக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: שְׂפָתַי
  choice: என் உதடுகளை
  rationale: எபிரெய மூலத்தின் உறுதியான ‘என் உதடுகள்’ என்ற உருவகத்தை ‘வாய்’ என்று பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וְאֶעֱנֶה
  choice: பதிலளிப்பேன்
  rationale: ענה இச்சூழலில் ‘பதில் கூறுதல்’ எனப் பொருள்படுகிறது. யோபின் விவாதச் சூழலுக்குப் ‘பதிலளிப்பேன்’ தெளிவாகவும் சுருக்கமாகவும் பொருந்துகிறது.
