source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: ta
  text: ஆகவே, இந்த மூன்று மனிதர்களும் யோபுக்குப் பதிலளிப்பதை நிறுத்திவிட்டார்கள்; ஏனெனில், அவர் தமது பார்வையில் நீதிமானாக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறொரு உரை மரபின்படி, “அவர் அவர்களுடைய பார்வையில் நீதிமானாக இருந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: நிறுத்திவிட்டார்கள்
  rationale: שבת இங்கு ‘செய்வதை நிறுத்துதல்’ என்ற பொருளில், מֵעֲנוֹת என்பதோடு வருகிறது. நவீனத் தமிழில் ‘பதிலளிப்பதை நிறுத்திவிட்டார்கள்’ என்பது இயல்பாகவும், செயல் முடிவுக்கு வந்ததையும் தெளிவாகவும் காட்டுகிறது.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: இந்த மூன்று மனிதர்களும்
  rationale: எண்ணிக்கை, சுட்டுப்பெயரடை, ஆண்பால் பன்மை ஆகியவற்றை நேரடியாகப் பாதுகாக்கிறது. ‘மனிதர்கள்’ என்பது dignified modern Tamil wording.
- source_word: מֵעֲנוֹת
  choice: பதிலளிப்பதை
  rationale: ענה என்பதன் இச்சூழல் பொருள் ‘பதில் கூறுதல்/மறுமொழி அளித்தல்.’ விவாதச் சூழலில் ‘பதிலளித்தல்’ இயல்பாக உள்ளது.
- source_word: אֶת אִיּוֹב
  choice: யோபுக்கு
  rationale: எபிரெயச் சொற்றொடரில் யோபு பதிலின் பொருளாக இருக்கிறார். தமிழில் ‘யோபுக்குப் பதிலளித்தல்’ என வேற்றுமை உருபுடன் சொல்வது இயல்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் ஏன் பதிலளிப்பதை நிறுத்தினார்கள் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: צַדִּיק என்பதன் அறநெறி மற்றும் நீதி சார்ந்த வலிமையைப் பாதுகாக்கும் நிலைபெற்ற, இன்னும் புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல்.
- source_word: בְּעֵינָיו
  choice: தமது பார்வையில்
  rationale: WLC-யில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைத் தக்கவைக்கிறது. தமிழில் கர்த்தா ‘அவர்’ என்பதால் ‘தமது’ என்பது இயல்பான தற்சுட்டுப் பயன்பாடு; ‘பார்வையில்’ என்பது idiom-இன் கருத்தைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: யோபு உண்மையிலேயே நீதிமான் எனக் கூறப்படுகிறாரா, அல்லது தமது மதிப்பீட்டில் நீதிமான் எனக் கருதினாரா?
  choice: ‘அவர் தமது பார்வையில் நீதிமானாக இருந்தார்’ என்று மொழிபெயர்த்து, விவரிப்பாளரின் சொற்றொடரை அதன் வரம்போடு பாதுகாத்தல்.
  alternative: ‘அவர் அவர்களுடைய பார்வையில் நீதிமானாக இருந்தார்.’
  rationale: கொடுக்கப்பட்ட WLC வாசகம் ஒருமைப் பின்னொட்டைக் கொண்டிருப்பதால் ‘அவருடைய/தமது பார்வையில்’ என்பதே நேரடி வாசிப்பு. இது யோபின் நீதியைப் பற்றிய இறையியல் தீர்ப்பை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்காமல், கதையின் பதற்றத்தைப் பாதுகாக்கிறது. வேறொரு உரை மரபின் பன்மை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நீதிமான்’ மூலத்தின் அறநெறி-நீதி சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘தமது பார்வையில்’ என்பது எபிரெய idiom-ஐ இயல்பான தமிழில் வழங்குகிறது. அடிக்குறி [a] முதன்மை உரையில் வெளிப்படையாக இடம்பெற்றுள்ளது.
