  text: I too will answer for my part[b][a]; I too will declare my knowledge.
translation:
  language: ta
  text: நானும் என் பங்கையும் கூறுவேன்[a]; நானும் என் அறிவை எடுத்துரைப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பங்கை அறிவிப்பேன்.” எபிரெயத்தில் எழுத்துப்படி, “என் பங்கு”; இங்கு விவாதத்தில் அவர் அளிக்கும் பங்களிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குத் தெரிந்ததை அறிவிப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲנֶה
  choice: பதிலளிப்பேன்
  rationale: Qal வடிவிலுள்ள ענה என்பதன் இயல்பான பொருள் ‘பதில் சொல்/மறுமொழி கூறு.’ உரையாடல் சூழலில் ‘பதிலளிப்பேன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַף אֲנִי
  choice: நானும்
  rationale: எலிகூவும் மற்றவர்களோடு சேர்ந்து பேச முன்வருவதை உணர்த்தும் சேர்க்கை மற்றும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; இரு இடங்களிலும் மீளுரைத்தல் காக்கப்பட்டுள்ளது.
- source_word: חֶלְקִי
  choice: என் பங்குக்கு
  rationale: חלק என்பது எழுத்துப்படி ‘பங்கு/பாகம்.’ இங்கு விவாதத்தில் எலிகூ அளிக்கும் சொந்தப் பங்களிப்பைக் குறிக்கும் சொற்றொடராக இருப்பதால் ‘என் பங்குக்கு’ மூல உருவகத்தையும் சூழற்பொருளையும் காக்கிறது.
- source_word: אֲחַוֶּה
  choice: எடுத்துரைப்பேன்
  rationale: Piel வடிவிலுள்ள חוה என்பதற்கு ‘அறிவி, எடுத்துச் சொல்’ என்ற பொருள் உண்டு. அறிவை வாய்மொழியாக வெளிப்படுத்தும் இச்சூழலில் ‘எடுத்துரைப்பேன்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: דֵעִי
  choice: என் அறிவை
  rationale: דעה என்பது அறிவு அல்லது புரிதலைக் குறிக்கிறது. ‘என் கருத்தை’ என்பது பொருளைத் தேவையின்றி அகநிலைப்படுத்தும்; ‘என் அறிவை’ மூலச்சொல்லுக்கு நெருக்கமானது.
