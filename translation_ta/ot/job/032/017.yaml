  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய இணைநடை மற்றும் இருமுறை வரும் אַף אֲנִי (‘நானும்’) தக்கவைக்கப்பட்டுள்ளன; ‘பங்கு,’ ‘அறிவு’ ஆகிய மூலச் சொற்களின் நுணுக்கங்களுக்கு அடிக்குறிப்புகள் வழங்கப்பட்டுள்ளன.
