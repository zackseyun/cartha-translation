translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கவிதைநடையின் சுவையும் காக்கப்பட்டுள்ளன. ‘நாட்களில் இளையவன்’ என்ற எபிரெய உருவகம் திட்டமிட்டே முதன்மை உரையில் வைக்கப்பட்டு விளக்கம் காலடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘தயங்கினேன், அஞ்சினேன்’ என்பது மூலத்தின் இரட்டைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
