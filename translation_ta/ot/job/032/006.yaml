base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: ta
  text: 'அப்போது, பூசியனாகிய பரகேயேலின் மகன் எலிகூ மறுமொழியாகக் கூறினான்:


    “நான் வயதில் இளையவன்[b]; நீங்களோ வயதில் முதிர்ந்தவர்கள். அதனால், என் அறிவை உங்களிடம் தெரிவிக்கத் தயங்கினேன், அஞ்சினேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குத் தெரிந்ததை உங்களிடம் சொல்லப் பின்வாங்கி அஞ்சினேன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நாட்களில் இளையவன்”; அதாவது, வயதில் இளையவன்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாகக் கூறினான்
  rationale: இரு எபிரெயச் சொற்களின் உரையாடல் மற்றும் பேச்சு அறிமுகப் பண்புகளை இயல்பான தமிழில் ஒருங்கிணைக்கிறது; இதற்கு முன் நேரடியான கேள்வி கேட்கப்பட்டதாகக் கட்டாயப்படுத்தாது.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: பூசியனான பரகெயேலின் மகன் எலிகூ
  rationale: தனிப்பெயர்களையும் இன அல்லது குல அடையாளத்தையும் தமிழில் ஒலிபெயர்த்து, எபிரெயத் தொடரின் உறவுமுறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: நான் நாட்களில் இளையவன்
  rationale: ‘நாட்களின் அடிப்படையில் இளையவன்’ என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது; அதன் பொருள் வயதில் இளையவன் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: יְשִׁישִׁים
  choice: முதிர்ந்த வயதினர்
  rationale: மிகுந்த வயதைக் குறிக்கும் சொல்லை மரியாதையான, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: வயது வேறுபாட்டிலிருந்து பேசத் தயங்கியதற்கான காரணவிளைவு தொடர்பை நேரடியாகக் காட்டுகிறது.
- source_word: זָחַלְתִּי
  choice: தயங்கினேன்
  rationale: பின்வாங்குதல் அல்லது கூச்சத்தால் பேசாமல் இருத்தல் என்ற அரிய வினையின் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וָאִירָא
  choice: அஞ்சினேன்
  rationale: முந்தைய தயக்கத்துடன் இணைந்து வரும் அச்சத்தைத் தனியான வினையாகப் பாதுகாக்கிறது.
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: என் அறிவை உங்களிடம் எடுத்துச் சொல்ல
  rationale: חוה என்பதன் ‘தெரிவித்தல்/விளக்கிச் சொல்லுதல்’ பொருளையும் דֵּעִי என்பதன் ‘என் அறிவு’ என்ற வடிவையும் காக்கிறது; ‘என் கருத்து’ என்று பலவீனப்படுத்தவில்லை.
