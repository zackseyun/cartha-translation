source:
  edition: WLC
  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: ta
  text: ஏனெனில் நான் வார்த்தைகளால் நிறைந்திருக்கிறேன்; என் உள்ளத்தின் ஆவி[a] என்னை நெருக்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, ‘என் வயிற்றின் ஆவி’ அல்லது ‘என் உள்ளுறுப்புகளில் உள்ள ஆவி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிகூ ஏன் பேச வேண்டியிருக்கிறது என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெயச் சொல்லின் காரணவிளக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: מָלֵתִי מִלִּים
  choice: நான் சொல்ல வேண்டிய வார்த்தைகளால் நிறைந்திருக்கிறேன்
  rationale: நேரடியாக ‘வார்த்தைகளால் நிறைந்திருக்கிறேன்’ எனலாம்; சூழலில் அவை வெளியிடப்பட வேண்டிய பேச்சுகள் என்பதைக் ‘சொல்ல வேண்டிய’ என்பது இயல்பாகத் தெளிவுபடுத்துகிறது, அதே நேரத்தில் ‘வார்த்தைகள்’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: הֱצִיקַתְנִי
  choice: என்னை நெருக்குகிறது
  rationale: צוק என்பதிலுள்ள அழுத்துதல், இடுக்கத்தில் வைப்பது, பேசத் தூண்டுவது ஆகிய பொருள் நிழல்களை ‘நெருக்குகிறது’ காக்கிறது; ‘கட்டாயப்படுத்துகிறது’ என்று செயல்பாட்டுப் பொருளை மட்டும் தீர்மானித்துவிடவில்லை.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இங்கு காற்று அல்லது மூச்சைவிட உள்ளார்ந்த உயிரூக்கத்தையோ உந்துதலையோ குறிக்கிறது. ‘ஆவி’ மூலச்சொல்லுக்கு நெருக்கமாகவும் அதன் சாத்தியமான பொருள் அகலத்தைத் திறந்தவாறும் உள்ளது.
- source_word: בִּטְנִי
  choice: என் உள்ளத்தின்
  rationale: சொல்லுக்கு நேரடியாக ‘என் வயிறு’ என்றாலும், எபிரெய வழக்கில் உள்ளுறுப்புகள் அல்லது உள்ளான தன்மையைக் குறிக்கிறது. ‘என் உள்ளத்தின்’ என்பது நவீன தமிழில் புரியும்படி அந்த உட்புற உருவகத்தை ஓரளவு காக்கிறது.
theological_decisions:
- issue: רוּחַ என்பது தனிநபரின் உள்ளார்ந்த ஆவியா, உந்துதலா, அல்லது தெய்வீக ஆவியால் உண்டான தூண்டுதலா?
  choice: ‘ஆவி’ என்று மொழிபெயர்த்து அடையாளத்தைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘உள்ளார்ந்த உந்துதல்’ அல்லது ‘தேவ ஆவி’
  rationale: வசனம் தானாகவே தேவ ஆவி என்று வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே தெய்வீகத் தூண்டுதலைச் சேர்ப்பதும், இதை வெறும் மன உந்துதலாகக் குறைப்பதும் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நெருக்குகிறது’ என்பது உள்ளார்ந்த அழுத்தம் மற்றும் பேச வேண்டிய கட்டாயம் ஆகிய இரண்டையும் உணர்த்துகிறது; அடிக்குறிப்பு בֶּטֶן என்பதன் உடல்சார் மூல உருவகத்தைப் பாதுகாக்கிறது.
