revisions:
- from: ஏனெனில், நான் சொல்ல வேண்டிய வார்த்தைகளால் நிறைந்திருக்கிறேன்; என் உள்ளத்தின் ஆவி[a] என்னை நெருக்குகிறது.
  to: ஏனெனில் நான் வார்த்தைகளால் நிறைந்திருக்கிறேன்; என் உள்ளத்தின் ஆவி[a] என்னை நெருக்குகிறது.
  rationale: The revision removes the added modal interpretation in ‘சொல்ல வேண்டிய’ while retaining the verse’s imagery, ambiguity, and elevated but natural Tamil register. The footnote continues to document the literal Hebrew bodily expression.
