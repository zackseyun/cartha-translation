  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: ta
  text: அவர்கள் திகைத்துப்போனார்கள்[a]; இனி அவர்கள் பதிலளிக்கவில்லை; வார்த்தைகள் அவர்களைவிட்டு அகன்றுவிட்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் நொறுங்கிப்போனார்கள்” / “அவர்கள் கலங்கிப்போனார்கள்”; எபிரேய வினை உடைந்துபோதல் அல்லது திகைத்துப்போதல் என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “வார்த்தைகள் அவர்களைவிட்டு விலகிப்போயின”; அதாவது, அவர்களுக்குச் சொல்ல இனி எதுவுமில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: அவர்கள் திகைத்துப்போனார்கள்
  rationale: חתת என்ற வினை உடைந்துபோதல், கலங்குதல் அல்லது திகைத்துப்போதல் ஆகிய பொருள்களைத் தரலாம். இச்சூழலில் யோபின் நண்பர்கள் பதிலளிக்க முடியாமல் திகைத்து நிற்பதை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது.
- source_word: עָנוּ
  choice: அவர்கள் பதிலளிக்கவில்லை
  rationale: விவாதச் சூழலில் ענה என்பது பதில் சொல்வதைக் குறிக்கிறது; தமிழில் ‘பதிலளிக்கவில்லை’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עוֹד
  choice: இனி
  rationale: לֹא என்பதுடன் வரும் עוֹד, முன்பு நடந்த செயல் இப்போது தொடரவில்லை என்பதைக் குறிக்கிறது; ‘இனி ... இல்லை’ அந்தத் தொடர்ச்சி முடிவுற்றதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הֶעְתִּיקוּ
  choice: அகன்றுவிட்டன
  rationale: עתק என்பதன் ஹிஃபில் வடிவம் அகலச்செய்தல், விலகுதல் அல்லது மாற்றுதல் என்னும் கருத்தைக் கொண்டது. ‘வார்த்தைகள் ... அகன்றுவிட்டன’ என்பது பேச்சு அவர்களைவிட்டு நீங்கியதாகக் காட்டும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵהֶם
  choice: அவர்களைவிட்டு
  rationale: מִן முன்னிடைச்சொல் பிரிவைக் குறிக்கிறது; தமிழில் ‘அவர்களைவிட்டு’ என்பது அந்தப் பிரிவை இயல்பாகத் தருகிறது.
- source_word: מִלִּים
  choice: வார்த்தைகள்
  rationale: அடிப்படைப் பொருளான ‘வார்த்தைகள்’ என்பதையே வைத்திருப்பதால், ‘சொல்ல எதுவுமில்லை’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் உயிர்ப்பூட்டிய உருவகம் காக்கப்படுகிறது.
