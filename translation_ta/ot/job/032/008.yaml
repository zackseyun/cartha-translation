source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: ta
  text: ஆனால் மனிதனுக்குள் ஓர் ஆவி இருக்கிறது[a]; சர்வவல்லவரின் சுவாசம் அவர்களுக்குப் புரிந்துகொள்ளும் திறனை அளிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெய்யாகவே, ஒரு மனிதனுக்குள் ஓர் ஆவி இருக்கிறது; சர்வவல்லவரின் சுவாசம் அவனுக்குப் புரிந்துகொள்ளும் திறனை அளிக்கிறது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “மனிதன்” ஒருமையில் உள்ளது; ஆனால் “அவர்களுக்கு” என்பதற்குரிய பின்னொட்டு பன்மையில் உள்ளது. சில மொழிபெயர்ப்புகள் இதை ஒருமையாகச் சீராக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: ஆனால்
  rationale: எலிகூவின் முந்தைய கூற்றைத் திருத்தி எதிர்முகப்படுத்தும் வலிமையை இயல்பான தமிழில் காட்டுகிறது; ‘மெய்யாகவே’ என்பதும் சாத்தியம்.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இங்கு மனிதனுக்குள் இருக்கும் பொருள்சாராத உயிரியல்/உளவியல் கூறைக் குறிக்கிறது; அடுத்துள்ள ‘சுவாசம்’ என்பதிலிருந்து கவிதைநய வேறுபாட்டையும் காக்கிறது.
- source_word: הִיא
  choice: இருக்கிறது
  rationale: எபிரெய பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பான இருப்புக் கூற்றாக வழங்குகிறது.
- source_word: בֶאֱנוֹשׁ
  choice: மனிதனுக்குள்
  rationale: אֱנוֹשׁ என்பது நிலையற்ற மனிதனைப் பொதுமையாக ஒருமையில் குறிக்கிறது; உள்ளார்ந்த இருப்பைத் தமிழில் தெளிவாகக் காட்ட ‘மனிதனுக்குள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְנִשְׁמַת
  choice: சுவாசம்
  rationale: נְשָׁמָה என்பதன் உயிரளிக்கும் மூச்சு என்ற முதன்மைப் பொருளைக் காத்து, רוּחַ என்பதற்கான ‘ஆவி’யிலிருந்து வேறுபடுத்துகிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: தெய்வீகப் பட்டமான שַׁדַּי-ஐ தமிழில் வழக்கமான, கண்ணியமான பொருள் மொழிபெயர்ப்பாக வழங்குகிறது.
- source_word: תְּבִינֵם
  choice: அவர்களுக்குப் புரிந்துகொள்ளும் திறனை அளிக்கிறது
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளையும் மூன்றாம் நபர் ஆண்பால் பன்மைப் பின்னொட்டையும் காக்கிறது.
theological_decisions:
- issue: மனிதனைப் பற்றிய மொழியும் ஒருமையிலிருந்து பன்மைக்கு மாறுதலும்
  choice: ‘மனிதன்’ என்ற பொதுமை ஒருமையையும் ‘அவர்களுக்கு’ என்ற பன்மையையும் காத்தல்
  alternative: இரண்டையும் ஒருமையாக்கி ‘ஒரு மனிதன் ... அவனுக்கு’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் אֱנוֹשׁ ஒருமையில் இருந்தாலும் תְּבִינֵם பன்மைப் பின்னொட்டைக் கொண்டுள்ளது. இறையியல் பொருளை ஒரே நபருக்கோ மனிதகுலத்திற்கோ முன்கூட்டியே சீராக்காமல், மூலத்தின் எண்ணிக்கை மாற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவி/சுவாசம்’ என்ற சொல் வேறுபாடும், ஒருமை–பன்மை மாறுதலும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
