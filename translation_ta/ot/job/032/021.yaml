id: JOB.32.21
reference: Job 32:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַל נָ֭א אֶשָּׂ֣א פְנֵי אִ֑ישׁ וְ/אֶל אָ֝דָ֗ם לֹ֣א אֲכַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: ta
  text: நான் எந்த மனிதனிடமும் பாரபட்சம் காட்டாதிருப்பேனாக[a]; எந்த நபரையும் முகஸ்துதி செய்யாதிருப்பேனாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘ஒரு மனிதனின் முகத்தை உயர்த்துதல்’; இது ஒருவருக்குச் சலுகை காட்டுவதையோ பாரபட்சமாக நடப்பதையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எந்த நபரையும் புகழ்ச்சிப் பட்டப்பெயரால் அழைக்காதிருப்பேனாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: நான் ... செய்யாதிருப்பேனாக
  rationale: אַל உடன் வரும் נָא, பணிவும் வலியுறுத்தலும் கலந்த எதிர்மறை வேண்டுதலை அல்லது மனவுறுதியை வெளிப்படுத்துகிறது. தமிழின் விருப்பநிலை வடிவமான ‘செய்யாதிருப்பேனாக’ இதை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: எந்த மனிதனிடமும் பாரபட்சம் காட்டாதிருப்பேனாக
  rationale: சொல்லுக்குச் சொல் ‘ஒரு மனிதனின் முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர், ஒருவருக்குச் சலுகை காட்டுதல் அல்லது பாரபட்சமாக நடப்பதைக் குறிக்கிறது. ‘பாரபட்சம் காட்டுதல்’ நவீனத் தமிழில் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אִישׁ
  choice: எந்த மனிதனிடமும்
  rationale: אִישׁ என்பது ஒருமை ஆண்பால் பெயர்ச்சொல்; இங்கு பொதுப்பொருளில் உள்ளது. எதிர்மறை வாக்கியத்தில் அதன் காலவரையற்ற பொருளை இயல்பாக வெளிப்படுத்த ‘எந்த மனிதனிடமும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶל אָדָם
  choice: எந்த நபரையும்
  rationale: אָדָם இங்கு மனித நபரைச் சுட்டி, אִישׁ என்பதற்கு இணையான இரண்டாம் அடியை அமைக்கிறது. தமிழில் தேவையற்ற சொல் மீளுரையைத் தவிர்த்து மனிதக் குறிப்பைத் தக்கவைக்க ‘எந்த நபரையும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא אֲכַנֶּה
  choice: முகஸ்துதி செய்யாதிருப்பேனாக
  rationale: பியேல் வடிவிலுள்ள כנה ஒருவரைப் பட்டப்பெயர் அல்லது புகழ்ச்சி நிறைந்த சிறப்புப்பெயரால் அழைப்பதைக் குறிக்கலாம்; இச்சூழலில் அதன் நெறிசார் நோக்கத்தை ‘முகஸ்துதி செய்தல்’ இயல்பாக எடுத்துரைக்கிறது. குறுகிய பொருளான ‘புகழ்ச்சிப் பட்டப்பெயரால் அழைத்தல்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
