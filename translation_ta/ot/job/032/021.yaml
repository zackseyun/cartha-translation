translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் தெளிவான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தப்பட்ட எதிர்மறை விருப்பநிலை ‘செய்யாதிருப்பேனாக’ என்ற இணையான அமைப்பால் இரு அடிகளிலும் தக்கவைக்கப்பட்டுள்ளது; முதல் அடியின் மரபுத்தொடரும் இரண்டாம் அடியின் சொற்பொருள் மாற்றுவாய்ப்பும் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
