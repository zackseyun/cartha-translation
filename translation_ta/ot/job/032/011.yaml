  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: ta
  text: இதோ, உங்கள் வார்த்தைகளுக்காக நான் காத்திருந்தேன்[a]; நீங்கள் சொற்களைத் தேடி ஆராயும்வரை, உங்கள் நியாயவாதங்களுக்குச் செவிகொடுத்தேன்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எதிர்பார்த்திருந்தேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லில் எதிர்பார்ப்போடு காத்திருத்தல் என்ற நுணுக்கமும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் புரிதல்கள்” அல்லது “உங்கள் பகுத்தறிவுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நீங்கள் ஒரு பதிலைச் சொற்களில் தேடி ஆராயும்வரை” என்றும் மொழிபெயர்க்கலாம். எபிரெயக் கவிதையின் இறுதித் தொடர் சுருக்கமானதும் பலவாறு புரிந்துகொள்ளத்தக்கதுமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் சுட்டும் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹחַלְתִּי
  choice: நான் காத்திருந்தேன்
  rationale: יחל என்பது காத்திருத்தல் அல்லது எதிர்பார்த்திருத்தல் எனப் பொருள்படலாம்; எலிகூ மற்றவர்கள் பேசும்போது பொறுமையாகத் தன்னை அடக்கிக்கொண்ட சூழலில் ‘காத்திருந்தேன்’ நேரடியும் இயல்புமானது.
- source_word: לְדִבְרֵיכֶם
  choice: உங்கள் வார்த்தைகளுக்காக
  rationale: அவர்கள் சொல்வதைக் கேட்பதற்காக அவர் காத்திருந்தார் என்ற இடைச்சொல் சார்ந்த பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אָזִין
  choice: செவிகொடுத்தேன்
  rationale: Hiphil வடிவம் கவனமாகக் கேட்பதைக் குறிக்கிறது; ‘செவிகொடுத்தேன்’ அந்தக் கவனமான கேட்பைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: உங்கள் சிந்தனைகளுக்கு
  rationale: பன்மையான תבונות என்பது புரிதல்கள், பகுத்தறிவுகள் அல்லது அவற்றின் வெளிப்பாடுகளைக் குறிக்கலாம்; இச்சூழலில் அவர்கள் முன்வைத்த சிந்தனை மற்றும் காரணவாதத்தின் உட்பொருளை இயல்பாகக் குறிக்கிறது.
- source_word: תַּחְקְרוּן
  choice: ஆராய்ந்து தேடும்வரை
  rationale: חקר என்பதிலுள்ள ஆழமாக ஆராய்தல், தேடிக் கண்டுபிடிக்க முயலுதல் ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: מִלִּין
  choice: சொற்களை
  rationale: கவிதைநடையில் வரும் ‘சொற்கள்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, ‘வாதங்கள்’ அல்லது ‘பதில்கள்’ என்று தேவையின்றி விளக்கிப் பொருள்கொள்ளாமல் விடுகிறது.
