source:
  edition: WLC
  text: וְ/לֹא עָרַ֣ךְ אֵלַ֣/י מִלִּ֑ין וּ֝/בְ/אִמְרֵי/כֶ֗ם לֹ֣א אֲשִׁיבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/014.yaml
  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: ta
  text: அவன் எனக்கு எதிராக வார்த்தைகளை முன்வைக்கவில்லை[a]; நான் உங்கள் கூற்றுகளைக் கொண்டு அவனுக்குப் பதிலளிக்க மாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் எனக்கு எதிராக வார்த்தைகளை ஒழுங்குபடுத்தவில்லை.’ எபிரெய வினைச்சொல் வார்த்தைகளை அடுக்குதல் அல்லது வாதத்திற்காக அணிவகுக்கச் செய்தல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் வாதங்களைக் கொண்டு அவனுக்குப் பதிலளிக்க மாட்டேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: முன்வைக்கவில்லை
  rationale: இந்த வினைச்சொல் அடுக்குதல், ஒழுங்குபடுத்துதல், அணிவகுக்கச் செய்தல் ஆகிய பொருள்களைக் கொண்டது. விவாதச் சூழலில் வார்த்தைகளை ஒருவருக்கு எதிராக வாதமாக முன்வைப்பதைக் குறிக்கிறது; ‘முன்வைக்கவில்லை’ என்பது அந்தக் கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֵלַי
  choice: எனக்கு எதிராக
  rationale: இடைச்சொல் அடிப்படையில் ‘என்னிடம்/என்னை நோக்கி’ எனப் பொருள்படலாம்; இங்கு விவாதச் சூழல் இருப்பதால் எதிர்நிலைத் தொனியை வெளிப்படுத்தும் ‘எனக்கு எதிராக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִלִּין
  choice: வார்த்தைகளை
  rationale: இது பேசப்பட்ட சொற்கள் அல்லது உரையைக் குறிக்கும் அரமேயத் தாக்கமுள்ள பன்மை வடிவம். வாத நுணுக்கத்தை வினைச்சொல் ஏற்கெனவே வெளிப்படுத்துவதால் நேரடியான ‘வார்த்தைகள்’ பயன்படுத்தப்பட்டது.
- source_word: אִמְרֵיכֶם
  choice: உங்கள் கூற்றுகளை
  rationale: முந்தைய ‘வார்த்தைகள்’ என்பதிலிருந்து வேறுபாட்டைப் பேணவும், நண்பர்கள் கூறிய கருத்துகள் அல்லது வாதங்களைச் சுட்டவும் ‘கூற்றுகள்’ இயல்பாக உள்ளது.
- source_word: אֲשִׁיבֶנּוּ
  choice: அவனுக்குப் பதிலளிக்க மாட்டேன்
  rationale: הֵשִׁיב் இங்கு ‘பதில் கூறுதல்’ என்று பொருள்படும்; ஆண்பால் ஒருமை பின்னொட்டு யோபைச் சுட்டுகிறது.
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: நானும் உங்கள் கூற்றுகளைக் கொண்டு அவனுக்குப் பதிலளிக்க மாட்டேன்
  rationale: בְּ கருவிப்பொருளில் ‘கொண்டு’ என மொழிபெயர்க்கப்பட்டது. எலிகூ நண்பர்களின் கூற்றுகளையே பயன்படுத்தி யோபுக்குப் பதிலளிக்கப் போவதில்லை என்ற பொருள் இதனால் தெளிவாகிறது.
