  text: וְ֭/הוֹחַלְתִּי כִּי לֹ֣א יְדַבֵּ֑רוּ כִּ֥י עָ֝מְד֗וּ לֹא עָ֥נוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: ta
  text: நான் காத்திருந்தேன்[a], ஏனெனில் அவர்கள் பேசவில்லை; அவர்கள் அப்படியே நின்று[b], இனி பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் நம்பிக்கையோடு எதிர்பார்த்திருந்தேன்.’ இந்த வினைச்சொல் எதிர்பார்ப்புடன் காத்திருக்கும் பொருளையும் தரலாம்; இங்கு சூழல் ‘காத்திருந்தேன்’ என்பதற்குச் சாதகமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவர்கள் நின்றார்கள்.’ இங்கு அவர்கள் பேசுவதை நிறுத்தி மௌனமாக இருந்தார்கள் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: நான் காத்திருந்தேன்
  rationale: יחל என்பதன் ஹிஃபில் வடிவம் எதிர்பார்ப்போடு காத்திருப்பதையோ நம்பிக்கையாயிருப்பதையோ குறிக்கலாம். மூத்தவர்கள் பேசுவதை நிறுத்தியபோது எலிகூ தன் பேச்சைத் தாமதித்த சூழலில், ‘காத்திருந்தேன்’ என்பது இயல்பான பொருள்.
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: ஏனெனில் அவர்கள் பேசவில்லை
  rationale: முதல் כִּי எலிகூ காத்திருந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; இறந்தகாலச் சூழலுக்கு ஏற்றவாறு வினைச்சொல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי עָמְדוּ
  choice: அவர்கள் அப்படியே நின்றுவிட்டதால்
  rationale: עָמְדוּ என்பதன் நேரடிப் பொருள் ‘அவர்கள் நின்றார்கள்.’ இங்கு உரையாடல் நின்றுபோனதைக் குறிக்கிறது; ‘அப்படியே நின்றுவிட்டதால்’ என்பது மூல உருவகத்தையும் சூழல்சார் பொருளையும் தக்கவைக்கிறது.
- source_word: לֹא עָנוּ עוֹד
  choice: அதற்குமேல் பதில் சொல்லவில்லை
  rationale: ענה உடன் עוֹד வருவது அவர்கள் இனி தொடர்ந்து பதிலளிக்கவில்லை என்பதைக் குறிக்கிறது. இத்தொடர் நவீன தமிழில் அந்த முடிவுற்ற நிலையைக் தெளிவாகக் கூறுகிறது.
