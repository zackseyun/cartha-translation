translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரண்டு காரணக் கூறுகளும் பாதுகாக்கப்பட்டுள்ளன; இரண்டாவது கூறு தமிழில் இயல்பாக அமைய ‘-தால்’ அமைப்பில் வழங்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
