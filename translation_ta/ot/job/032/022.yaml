  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: ta
  text: ஏனெனில், முகஸ்துதியாகப் பட்டப்பெயர் சூட்டி அழைக்க எனக்குத் தெரியாது[a]; சிறிது காலத்தில் என்னைப் படைத்தவர் என்னை எடுத்துக்கொள்வார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முகஸ்துதி செய்ய.’ எபிரெய வினை, ஒருவரைப் பாரபட்சமாகப் புகழும் நோக்கில் மரியாதைப் பட்டப்பெயர்களால் அழைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னை அகற்றிவிடுவார்.’ எபிரெயம் வெளிப்படையாக ‘என்னைக் கொல்வார்’ என்று கூறவில்லை; தீர்ப்பாக அகற்றப்படுதல் உட்பொருளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் பாரபட்சமோ முகஸ்துதியோ காட்டமாட்டேன் என்று எலிகூ கூறியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாது
  rationale: தொடர்ந்து வரும் செயலைச் செய்யும் திறமையோ பழக்கமோ தனக்கு இல்லை என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֲכַנֶּה
  choice: முகஸ்துதி செய்ய
  rationale: כנה என்பதன் இச்சூழலிலுள்ள எதிர்மறையான சமூகப் பொருளைச் சுருக்கமாகத் தருகிறது; ஒருவரைப் பாரபட்சமாகப் புகழும் வகையில் பட்டப்பெயர் சூட்டி அழைப்பதும் இதில் அடங்கலாம்.
- source_word: כִּמְעַט
  choice: விரைவில்
  rationale: இங்கு நெருங்கிய காலத்தில் நிகழக்கூடிய விளைவைச் சுட்டுகிறது; வெறும் அளவுசார் ‘கொஞ்சம்’ என்ற பொருள் சூழலுக்குப் பொருந்தாது.
- source_word: יִשָּׂאֵנִי
  choice: என்னை அகற்றிவிடுவார்
  rationale: נשא என்பதன் ‘தூக்குதல்/சுமத்தல்/எடுத்துச் செல்லுதல்’ என்ற பரந்த பொருளிலிருந்து, தீர்ப்பாக நீக்கப்படுதல் என்ற கருத்தை மரணமென்று மிகத் துல்லியப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: עֹשֵׂנִי
  choice: என்னைப் படைத்தவர்
  rationale: ‘என்னை உண்டாக்கியவர்’ என்ற எபிரெயப் பங்கேற்புவினையின் தனிப்பட்ட படைப்பாளர்–படைப்பு உறவை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: எச்சரிக்கப்படும் இறைச் செயலின் தன்மை
  choice: என்னைப் படைத்தவர் விரைவில் என்னை அகற்றிவிடுவார்
  alternative: என்னைப் படைத்தவர் விரைவில் என்னைக் கொன்றுவிடுவார் / எடுத்துக்கொள்வார்
  rationale: נשא என்ற வினை நேரடியாக ‘கொல்லுதல்’ என்று கூறவில்லை. மரணத் தீர்ப்பு உட்பொருளாக இருக்கக்கூடும் என்றாலும், மூலத்தின் பரந்த பொருளையும் இறையியல் பதற்றத்தையும் ‘அகற்றிவிடுவார்’ காக்கிறது.
- issue: இரு கூற்றுகளுக்கிடையிலான நிபந்தனைத் தொடர்பு
  choice: அப்படிச் செய்தால்
  alternative: 'இணைப்பை வெளிப்படுத்தாமல்: ‘...தெரியாது; விரைவில்...’'
  rationale: எபிரெயில் நிபந்தனை வெளிப்படையாகச் சொல்லப்படாவிட்டாலும், முந்தைய வசனமும் இவ்வசனத்தின் தீர்ப்பு எச்சரிக்கையும் முகஸ்துதி செய்தால் ஏற்படும் விளைவைக் குறிக்கின்றன. இயல்பான தமிழுக்காக மறைந்திருக்கும் தொடர்பு வெளிப்படுத்தப்பட்டது; தீர்ப்பின் தன்மை தனியே மிகத் துல்லியப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முகஸ்துதி’ சூழலின் எதிர்மறைத் தன்மையைத் தெளிவாகத் தருகிறது; ‘என்னைப் படைத்தவர்’ தனிப்பட்ட படைப்பாளர் உறவை இயல்பாகக் காக்கிறது.
