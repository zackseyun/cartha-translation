  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: ta
  text: எலிகூ யோபுவிடம் பேசுவதற்குக் காத்திருந்தான்; அவர்கள் அவனைவிட வயதில் மூத்தவர்களாக இருந்ததால்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: எலிகூ
  rationale: வாவ் இணைப்புச் சொல் இங்கு உரையாடலின் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் தேவையற்ற ‘இப்போது’ என்பதைச் சேர்க்காமல், பெயரை நேரடியாகத் தொடங்குவது இயல்பாக உள்ளது.
- source_word: חִכָּה
  choice: காத்திருந்தான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘காத்திருத்தல்.’ அடுத்த வசனத்தில் வரும் செயலுக்கு முன்பான நிலையைத் தமிழின் இறந்தகாலத் தொடர்நிலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: யோபிடம் பேசக்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘வார்த்தைகளில் யோபை காத்திருந்தான்’ என்ற அமைப்பு வரும்; சூழலில் இதன் இயல்பான பொருள் யோபிடம் பேசுவதற்காகக் காத்திருந்தான் என்பதாகும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலிகூ காத்திருந்ததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் காரண இணைப்புச் சொல்.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  choice: அவர்கள் அவனைவிட வயதில் மூத்தவர்களாக இருந்தார்கள்
  rationale: இங்கு זְקֵנִים என்பது பதவியிலுள்ள ‘மூப்பர்கள்’ என்பதல்ல; מִמֶּנּוּ மற்றும் לְיָמִים உடன் சேர்ந்து வயது ஒப்பீட்டைக் குறிக்கிறது. ‘நாட்களில் மூத்தவர்கள்’ என்பதற்குப் பதிலாக இயல்பான தமிழில் ‘வயதில் மூத்தவர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
