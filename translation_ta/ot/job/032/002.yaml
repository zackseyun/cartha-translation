  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: ta
  text: அப்போது, ராம் குலத்தைச் சேர்ந்த பூசியராகிய பரகியேலின் மகன் எலிகூவுக்கு யோபின்மேல் கடும் கோபம் மூண்டது. தன்னைக் கடவுளைவிட நீதியுள்ளவன் என்று நியாயப்படுத்தியதால்[a] யோபின்மேல் அவனுடைய கோபம் மூண்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைக் கடவுளைவிட அதிக நீதியுள்ளவனாகக் கருதியதால்.”
    reason: மூல எபிரெயத்தின் מֵאֱלֹהִים உடனான ஒப்பீட்டை மேலும் வெளிப்படையாகக் கூறும் மாற்று வாசிப்பு.
