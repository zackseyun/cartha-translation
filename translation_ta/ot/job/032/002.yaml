  rationale: מִן முன்னொட்டின் ஒப்பீட்டுப் பொருளைப் பாதுகாக்கிறது; யோபின் தன்னை நியாயப்படுத்துதல் கடவுளைவிடத் தன்னையே நீதியுள்ளவனாக நிறுத்தியது என்ற பதற்றத்தைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים என்பதன் பொருள்
  choice: கடவுளைவிடத் தன்னையே நீதிமான் என்று நியாயப்படுத்தியதால்
  alternative: கடவுளுக்கு முன்பாகத் தன்னை நியாயப்படுத்தியதால்
  rationale: מֵאֱלֹהִים என்பதில் உள்ள ஒப்பீட்டுப் பொருளை முதன்மை வாசகம் பாதுகாக்கிறது. யோபு வெளிப்படையாகக் கடவுளைவிட தான் ஒழுக்கத்தில் மேம்பட்டவன் என்று கூறினான் என மிகையாகத் தீர்மானிக்காமல், அவனுடைய சுயநியாயப்படுத்தல் கடவுளின் நீதிக்கு எதிரான ஒப்பீடாக அமைந்தது என்ற மூலமொழியின் இறையியல் பதற்றத்தை வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; கண்ணியமானதாயும் பொதுவாசகருக்குப் புரியத்தக்கதாயும் உள்ளது. எபிரெயத்தில் இருமுறை வரும் கோப உருவகம் தமிழிலும் மீளுரைக்கப்பட்டுள்ளது; கடினமான இறுதி ஒப்பீடு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
