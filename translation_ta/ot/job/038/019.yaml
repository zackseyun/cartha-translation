  yaml_path: translation/ot/job/038/019.yaml
  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: ta
  text: ஒளி தங்கியிருக்கும் இடத்திற்குச் செல்லும் வழி எங்கே[a]? இருளின் இடம் எங்கே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மேலும் முறையாக: “ஒளி தங்கியிருக்கும் வழி எது? இருள்—அதன் இடம் எங்கே?”'
    reason: எபிரெயத்தின் சுருக்கமான தொடரமைப்பை நெருக்கமாகப் பிரதிபலிக்கும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: אֵי זֶה
  choice: எங்கே?
  rationale: இந்த வினாச்சொல் இடம் அல்லது செல்லும் திசையை விசாரிக்கிறது. நவீன தமிழில் “எங்கே?” என்பது இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: הַדֶּרֶךְ
  choice: செல்லும் வழி
  rationale: דֶּרֶךְ என்பது வழி, பாதை எனப் பொருள்படும். இங்கு ஒளி தங்கும் இடத்தை அடைவதற்கான வழி என்ற தொடர்பைத் தெளிவாக்க “செல்லும் வழி” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִשְׁכָּן
  choice: தங்கியிருக்கும்
  rationale: שׁכן என்பது தங்குதல், குடியிருத்தல், வசித்தல் எனப் பொருள்படும். ஒளிக்கு ஓர் உறைவிடம் இருப்பதுபோன்ற எபிரெய உருவகத்தை “தங்கியிருக்கும்” பாதுகாக்கிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: இருளுக்கு எதிராக நிற்கும் இயற்கை அல்லது அண்டம்சார் ஒளியைக் குறிக்கும் நேரான தமிழ் சொல்.
- source_word: וְחֹשֶׁךְ
  choice: இருள்
  rationale: இணைப்புச் சொல்லால் தொடங்கும் இணை வாக்கியத்தில் ஒளிக்கு எதிரான இருளைக் குறிக்கிறது; தமிழில் இரண்டாம் கேள்வியாகப் பிரித்தமை அந்த இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְקוֹמוֹ
  choice: இருளின் இடம்
  rationale: מָקוֹם என்பது “இடம்”; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு முன்வரும் இருளைக் குறிக்கிறது. “அதன் இடம்” என்பதைக் காட்டிலும் “இருளின் இடம்” தமிழில் தெளிவானது.
