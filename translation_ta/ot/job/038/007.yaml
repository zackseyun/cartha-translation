  to: 'விடியற்கால நட்சத்திரங்கள் ஒன்றாகப் பாடியபோது,


    தேவனுடைய மகன்கள் அனைவரும் மகிழ்ச்சியால் ஆரவாரம் செய்தபோது?[a]'
  rationale: The revision corrects the Tamil temporal construction so that both cola mean ‘when,’ as required by the Hebrew and by the continuing divine question from the surrounding context. It also improves idiomatic Tamil while preserving the poetic parallel, the joyful force of the shout, the literal theological designation, and the existing footnote anchor.
