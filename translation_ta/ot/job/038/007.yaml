    text: அல்லது, “வானுலக உயிரினங்கள்” அல்லது “தேவதூதர்கள்.” எபிரெயத்தில், “தேவனுடைய மகன்கள்.”
    reason: alternative_reading
  revision_rationale: The revision corrects the Tamil temporal construction so that both cola mean ‘when,’ as required by the Hebrew and by the continuing divine question from the surrounding context. It also improves idiomatic Tamil while preserving the poetic parallel, the joyful force of the shout, the literal theological designation, and the existing footnote anchor.
