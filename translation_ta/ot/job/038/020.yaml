source:
  edition: WLC
  text: כִּ֣י תִ֭קָּחֶ/נּוּ אֶל גְּבוּל֑/וֹ וְ/כִֽי תָ֝בִ֗ין נְתִיב֥וֹת בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/020.yaml
  text: that you might take it to its boundary[b][a], and that you might discern the paths to its house?
translation:
  language: ta
  text: அதை அதன் எல்லைக்கு நீ கொண்டுபோகவும், அதன் வீட்டிற்கான பாதைகளை நீ அறிந்துகொள்ளவும் உன்னால் முடியுமா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை’, ‘அதன்’ என்ற ஒருமைச் சுட்டுப்பெயர்கள், யோபு 38:19–20-இல் இணையாகக் கேட்கப்படும் கேள்விகளில் வரும் ஒளியையோ இருளையையோ குறிக்கலாம்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “அதன் வீட்டிற்கான வழிகளை நீ புரிந்துகொள்ளவும் உன்னால் முடியுமா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -வும் முடியுமா
  rationale: முந்தைய வசனத்தில் தொடங்கும் தேவனுடைய வினாவுடன் இணைந்து, நோக்கம் அல்லது விளைவை உணர்த்தும் உட்பிரிவாக உள்ளது; தமிழில் இரு இணை வினைச்சொல் அமைப்புகளுக்குப் பின் வரும் ‘முடியுமா?’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: תִקָּחֶנּוּ
  choice: அதை நீ அழைத்துச் செல்லவும்
  rationale: לקח என்பதன் ‘எடுத்துச் செல்/கொண்டுபோ/வழிநடத்து’ என்ற இயக்கப் பொருளை இச்சூழலில் ‘அழைத்துச் செல்’ இயல்பாகத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு தமிழில் பால்குறியாத ‘அதை’ என வருகிறது.
- source_word: אֶל גְּבוּלוֹ
  choice: அதன் எல்லைக்கு
  rationale: גְּבוּל குறிக்கும் எல்லை அல்லது வரம்பு என்ற இடவியல் உருவகத்தை மிகையாக விளக்காமல் ‘எல்லை’ பாதுகாக்கிறது.
- source_word: וְכִי
  choice: மேலும் இணைந்த -வும் அமைப்பு
  rationale: இரண்டாவது இணையான உட்பிரிவை முதலாவதுடன் சேர்க்கும் எபிரேய இணைப்பைத் தமிழின் இணை ‘-வும்’ அமைப்பு இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: תָבִין
  choice: நீ பகுத்தறியவும்
  rationale: בין என்பதிலுள்ள புரிந்துகொள்ளுதல் மற்றும் நுண்ணறிந்து கண்டறிதல் ஆகிய நிழற்பொருள்களை ‘பகுத்தறி’ தக்கவைக்கிறது.
- source_word: נְתִיבוֹת
  choice: பாதைகளை
  rationale: நְתִיבוֹת என்பதன் உறுதியான வழித்தட உருவகத்தை நவீன தமிழில் ‘பாதைகள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: அதன் வீடு
  rationale: בַּיִת என்பதன் நேரடியான ‘வீடு’ என்ற உருவகத்தைப் பாதுகாத்து, ஒளி அல்லது இருள் தனக்குரிய வீட்டைக் கொண்டிருப்பதுபோன்ற கவித்துவ ஆளுருவகத்தையும் நிலைநிறுத்துகிறது.
theological_decisions:
- issue: ஒருமைச் சுட்டுப்பெயர்களின் முன்னொட்டு
  choice: ‘அதை/அதன்’ என்று வைத்து, அது ஒளியையோ இருளையையோ குறிக்கலாம் என அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
  alternative: ஒளி அல்லது இருள் என உரையிலேயே ஒன்றைத் தேர்ந்தெடுத்தல்
  rationale: யோபு 38:19–20 இன் இணையான கேள்விகளால் உண்டாகும் உண்மையான குறிப்புத் தெளிவின்மையை எபிரேய உரையைப் போலவே தீர்க்காமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான தெய்வீக வினாவுக்கேற்ற கண்ணியமான ஒருமை ‘நீ’ பயன்படுத்தப்பட்டது. எபிரேயக் கவிதையின் இணை அமைப்பும் வீடு/பாதை என்ற ஆளுருவகமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
