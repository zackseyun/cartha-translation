  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: ta
  text: பொல்லாதவர்களிடமிருந்து அவர்களுடைய ஒளி விலக்கப்படுகிறது; ஓங்கிய புயம்[b] முறிக்கப்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓங்கிய புயம் முறிக்கப்படும்.” எபிரெய முற்றுப்பெறாத வினை வடிவத்தை உயிரோட்டமான நிகழ்காலமாகவும் எதிர்காலமாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “புயம்” என்பது வலிமையையோ அதிகாரத்தையோ, குறிப்பாக வன்முறையான ஆற்றலையோ குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
