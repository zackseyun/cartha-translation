  choice: தடுக்கப்படுகிறது
  rationale: מנע என்பதன் நிஃபால் வடிவம், ஒளி அவர்களுக்குக் கிடைக்காமல் தடுக்கப்படுவதைச் செயலற்ற வினை வடிவில் காட்டுகிறது.
- source_word: מֵרְשָׁעִים
  choice: பொல்லாதவர்களிடமிருந்து
  rationale: מִן என்னும் முன்னொட்டு பிரித்தல் அல்லது விலக்குதலைக் குறிக்கிறது; பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் ஒழுக்க வகையையும் காக்கிறது.
- source_word: אוֹרָם
  choice: அவர்களுடைய ஒளி
  rationale: எபிரெய உரையில் உள்ள மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டை நேரடியாகப் பாதுகாக்கிறது; விடியலின் ஒளி பொல்லாதவர்களுக்கு மறுக்கப்படும் சூழலுக்கும் பொருந்துகிறது.
- source_word: וּזְרוֹעַ
  choice: புயம்
  rationale: זְרוֹעַ என்பதன் நேரடியான உடல் உருவகத்தைப் பாதுகாக்கிறது; அது வலிமையையோ அதிகாரத்தையையோ உருவகமாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: רָמָה
  choice: ஓங்கிய
  rationale: உயர்த்தப்பட்ட அல்லது மேலோங்கிய நிலையில் உள்ள புயம் என்ற உருவகத்தையும், அதனுடன் தொடர்புடைய செருக்கான அல்லது வன்முறையான ஆற்றலின் உட்குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: תִּשָּׁבֵר
  choice: முறிக்கப்படுகிறது
  rationale: שבר என்பதன் நிஃபால் முற்றுப்பெறாத வடிவத்தை, விடியல் பொல்லாதவர்களுக்குச் செய்வதைத் தெளிவாக வருணிக்கும் நிகழ்காலச் செயலற்ற வினையாக வழங்குகிறது; எதிர்காலப் பொருளும் சாத்தியம்.
theological_decisions:
- issue: ஓங்கிய புயம் என்பதன் உருவகப் பொருள்
  choice: முதன்மை உரையில் உடல் உருவகத்தை அப்படியே வைத்தல்
