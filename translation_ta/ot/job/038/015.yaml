- issue: תִּשָּׁבֵר என்பதன் காலப் பொருள்
  choice: 'நிகழ்காலக் கவித்துவ வருணனை: “முறிக்கப்படுகிறது”'
  alternative: 'எதிர்காலம்: “முறிக்கப்படும்”'
  rationale: சுற்றியுள்ள பகுதியில் விடியல் நிகழ்த்தும் செயலை உயிரோட்டமாக வருணிக்கும் வாசிப்புக்கு நிகழ்காலம் பொருந்துகிறது; எபிரெய முற்றுப்பெறாத வினையின் எதிர்காலச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “புயம்” சற்றே இலக்கியச் சொல் என்றாலும், זְרוֹעַ என்பதன் உடல் உருவகத்தையும் “ஓங்கிய புயம்” என்ற செறிவான கவித்துவப் படிமத்தையும் காக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
