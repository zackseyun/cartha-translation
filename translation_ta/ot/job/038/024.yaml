  text: אֵי זֶ֣ה הַ֭/דֶּרֶךְ יֵחָ֣לֶק א֑וֹר יָפֵ֖ץ קָדִ֣ים עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: ta
  text: ஒளி[b] எந்த வழியால் பிரிக்கப்படுகிறது[a]? கிழக்குக் காற்று பூமியெங்கும் எவ்வாறு சிதறிப் பரவுகிறது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒளி பிரிக்கப்படுகிற வழி எங்கே?’ எபிரெய வினாப்பதத் தொடரை இடத்தைக் கேட்பதாகவோ முறையைக் கேட்பதாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒளி’ என்பதற்குப் பதிலாக ‘மின்னல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ‘ஒளி’ என்று பொருள்படும்; ஆனால் இங்குள்ள புயல் சூழலை முன்னிட்டு சிலர் அதை வானிலை சார்ந்த ஒளி நிகழ்வாகக் குறுக்கிப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: எந்த வழியால்
  rationale: இந்த வினாப்பதத் தொடர் இடத்தையோ முறையையோ கேட்கலாம். தொடர்ந்து வரும் ‘வழி’ என்பதுடன் ‘எந்த வழியால்’ என்பது தமிழில் இயல்பாகவும், மூலத்தின் இரு சாத்தியங்களையும் அடிக்குறிப்புடன் காக்கும் வகையிலும் உள்ளது.
- source_word: הַדֶּרֶךְ
  choice: வழி
  rationale: דֶּרֶךְ என்பதன் பொதுவான பொருள் ‘வழி/பாதை’. இக்கவிதை வினாவில் ‘வழி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יֵחָלֶק
  choice: பிரிக்கப்படுகிறது
  rationale: חלק என்பதன் நிஃபால் வடிவம் செயப்பாட்டு அல்லது தன்வினை நுணுக்கத்துடன் ‘பிரிக்கப்படுதல்/பங்கிடப்படுதல்’ எனப் பொருள்படும். ‘பிரிக்கப்படுகிறது’ மூலத்தின் இலக்கண வடிவை நெருக்கமாகக் காக்கிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: אוֹר என்பதன் இயல்பான, குறிக்கப்படாத பொருள் ‘ஒளி’. புயல் சூழலில் ‘மின்னல்’ எனக் குறுக்கிப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יָפֵץ
  choice: சிதறடிக்கப்படுகிறது
  rationale: פוץ என்பதன் ஹிஃபில் வடிவம் ‘சிதறச் செய்தல்/பரவச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. தமிழில் செயப்பாட்டு வடிவம், முதல் அரையடியுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: קָדִים
  choice: கிழக்குக் காற்று
  rationale: קָדִים என்பது பொதுவாகக் கிழக்கிலிருந்து வீசும் காற்றைக் குறிக்கிறது; இங்குள்ள வானிலைச் சூழலும் அதையே ஆதரிக்கிறது.
- source_word: עֲלֵי אָרֶץ
  choice: பூமியின்மேல்
  rationale: முன்னிடைச்சொல்லுடன் வரும் אֶרֶץ ‘பூமியின்மேல்/நிலத்தின்மேல்’ எனப் பொருள்படும். யோபு 38-இன் அகிலவுலகப் பரப்புக்கு ‘பூமியின்மேல்’ ஏற்றது.
