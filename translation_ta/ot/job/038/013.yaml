  text: לֶ֭/אֱחֹז בְּ/כַנְפ֣וֹת הָ/אָ֑רֶץ וְ/יִנָּעֲר֖וּ רְשָׁ מִמֶּֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/013.yaml
  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: ta
  text: அது பூமியின் விளிம்புகளைப் பற்றிக்கொள்ளவும்[a], அதிலிருந்து பொல்லாதவர்கள் உதறிவிடப்படவும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியின் மூலைகளை.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘பூமியின் சிறகுகள்/கடைமுனைகள்’ என்று உள்ளது; இது அதன் வெளிப்புற எல்லைகளைக் குறிக்கும் கவித்துவ உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: விடியல் பூமியைப் பற்றிப் பிடித்து, ஒரு துணியிலிருந்து தூசியை உதறுவதுபோல் அதிலிருந்து பொல்லாதவர்களை உதறிவிடுவதாக இங்கு உருவகப்படுத்தப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: பற்றிக்கொள்ளவும்
  rationale: ל prefixed infinitive construct purpose/result force continues from the preceding verse. பற்றிக்கொள்ளுதல் preserves the concrete sense of grasping without adding excessive violence.
- source_word: בְּכַנְפוֹת
  choice: விளிம்புகளை
  rationale: כָּנָף literally means wing, but with earth it poetically denotes its outermost parts or extremities. விளிம்புகள் is natural modern Tamil while the literal image is retained in a footnote.
- source_word: הָאָרֶץ
  choice: பூமியின்
  rationale: The surrounding divine speech concerns the cosmos and dawn, so பூமி fits better than the more local நிலம்.
- source_word: וְיִנָּעֲרוּ
  choice: உதறிவிடப்படவும்
  rationale: The Niphal form depicts the wicked as being shaken off or out. The passive Tamil expression preserves both the force and the implied garment-like image.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: This naturally denotes people characterized by wickedness and preserves the moral category without expansion.
- source_word: מִמֶּנָּה
  choice: அதிலிருந்து
  rationale: The feminine singular suffix refers back to the earth; அதிலிருந்து naturally expresses removal from it in Tamil.
