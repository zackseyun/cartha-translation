translation_notes:
  register: நவீன நிலையான தமிழில், இறை உரைக்கேற்ற கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் நோக்கம்/விளைவு அமைப்பை இரு ‘-வும்’ தொடர்களால் காத்துள்ளோம்; வசனம் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
