lexical_decisions:
- source_word: מִי זֶה
  choice: இவன் யார்?
  rationale: எபிரெய வினாவும் சுட்டுப்பெயரும் சேர்ந்து வெளிப்படுத்தும் நேரடியான, கண்டிக்கும் சவாலை இயல்பான தமிழில் காக்கிறது.
- source_word: מַחְשִׁיךְ
  choice: இருளாக்குகிற
  rationale: ‘தெளிவற்றதாக்குதல்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல், மூலத்தின் ‘இருளாக்குதல்’ உருவகத்தையே காக்கிறது.
- source_word: עֵצָה
  choice: ஆலோசனை
  rationale: ஞானமான அறிவுரை அல்லது வகுக்கப்பட்ட திட்டம்/நோக்கம் ஆகிய பொருள் வாய்ப்புகளை முற்றிலும் குறுக்காமல் வைத்திருக்கிறது.
- source_word: בְמִלִּין
  choice: வார்த்தைகளால்
  rationale: בְּ என்னும் முன்னொட்டின் கருவிப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּלִי דָעַת
  choice: அறிவில்லாத
  rationale: ‘அறிவின்றி’ என்ற மூலப் பொருளைச் சுருக்கமான தமிழ் பெயரடைத்தொடராகக் காக்கிறது; ‘புரிதல்’ என்று விளக்கி விடவில்லை.
theological_decisions:
- issue: தெய்வீக உரையில் עֵצָה என்பதன் பொருள்
  choice: ஆலோசனை
  alternative: திட்டம்; நோக்கம்
  rationale: கடவுளின் ஞானமான ஆலோசனையையோ அவரது திட்டம் அல்லது நோக்கத்தையோ இச்சொல் குறிக்கக்கூடும். முதன்மை உரை இந்தப் பொருள் விரிவை ஓரளவு காக்கிறது; அடிக்குறிப்பு மற்ற உண்மையான வாய்ப்புகளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான தெய்வீகக் கண்டிப்பின் வலிமையையும் எபிரெய உருவகத்தையும் காக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை.
