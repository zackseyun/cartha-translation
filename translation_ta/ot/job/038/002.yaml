  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: ta
  text: அறிவில்லாத வார்த்தைகளால் ஆலோசனையை[a] இருளாக்கும் இவன் யார்?
  philosophy: optimal-equivalence
  footnotes:
