  text: הֲ/תָרִ֣ים לָ/עָ֣ב קוֹלֶ֑/ךָ וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: ta
  text: 'மேகத்தை நோக்கி உன் குரலை உயர்த்தி,

    ஏராளமான நீர் உன்னை மூடும்படி செய்ய உன்னால் முடியுமா?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேகத்தை நோக்கி உன் குரலை உயர்த்த முடியுமா? ஏராளமான நீர் உன்னை மூடுமா?” எபிரெயத்தில் இரண்டாம் பகுதி முதல் பகுதியின் விளைவாகவோ, அதனுடன் இணைந்த மற்றொரு உட்பிரிவாகவோ புரிந்துகொள்ளப்படலாம். ‘மேகம்’ என்பது ‘அடர்ந்த மேகம்’ என்றும் பொருள்படலாம்.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: உயர்த்தி... செய்ய உன்னால் முடியுமா?
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம் இங்கு திறனைச் சவாலிடும் வினாவாக வருகிறது. தமிழில் இயல்பான ஒரே வினா அமைப்புக்காக, திறனைக் குறிக்கும் பகுதி இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: לָעָב
  choice: மேகத்தை நோக்கி
  rationale: עָב என்பது ஒரு மேகத்தையோ அடர்ந்த மழைமேகத்தையோ குறிக்கலாம். எபிரெய மூலத்தின் ஒருமையைப் பாதுகாக்க ‘மேகத்தை’ என்றும், குரல் செலுத்தப்படும் திசையை இயல்பாகக் காட்ட ‘நோக்கி’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קוֹלֶךָ
  choice: உன் குரலை
  rationale: קוֹל இங்கு பேசுதல் அல்லது அழைத்தலைக் குறிக்கும் ‘குரல்’ என்ற இயல்பான பொருளில் உள்ளது.
- source_word: וְשִׁפְעַת מַיִם
  choice: திரளான நீர்
  rationale: שִׁפְעָה மிகுதி, ஏராளம், பெருக்கம் ஆகிய பொருள்களைத் தருகிறது. அழிவூட்டும் வெள்ளம் என்று தேவையின்றி வரையறுக்காமல் நீரின் மிகுதியை ‘திரளான நீர்’ வெளிப்படுத்துகிறது.
- source_word: תְּכַסֶּךָּ
  choice: உன்னை மூடும்படி
  rationale: כסה என்பதன் பியேல் வடிவம் ‘மூடு’ என்று பொருள்படும்; இரண்டாம் ஆண்பால் ஒருமை பின்னொட்டு நேரடியாக ‘உன்னை’ எனப் பிரதிபலிக்கப்படுகிறது.
theological_decisions:
- issue: இரு உட்பிரிவுகளுக்கிடையிலான தொடர்பு
  choice: மேகத்தை நோக்கிக் குரலை உயர்த்துவதன் விளைவாக மிகுதியான நீர் பேசப்படுபவரை மூடும்படி செய்ய முடியுமா என்ற நோக்கம்/விளைவு உறவு
  alternative: ‘மேலும் திரளான நீர் உன்னை மூடுமா?’ என்ற இணைப்பு உறவு
  rationale: மனிதனால் வானிலையைக் கட்டளையிட முடியுமா என்ற இறைச் சவாலைத் தமிழில் தெளிவாக வெளிப்படுத்த ‘மூடும்படி செய்ய’ பயன்படுத்தப்படுகிறது; எனினும் எபிரெய வாவ் இணைப்பின் சற்றுத் தளர்வான தொடர்பை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நேரடி இறைச் சவால் தொனி பேணப்பட்டுள்ளது. எபிரெய ஒருமையான ‘மேகம்’ முதன்மை உரையில் காக்கப்பட்டு, அடர்ந்த மேகம் என்ற நுண்பொருளும் உட்பிரிவுகளின் தொடர்பிலுள்ள ambiguity-யும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
