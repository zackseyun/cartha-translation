- source_word: מִי
  choice: யார்
  rationale: தேவனுடைய உரையில் வரும் வினாவியல் சுட்டுப்பெயர்; விடை எதிர்பாராத சொல்லாட்சியுள்ள கேள்வியை இயல்பாகக் காட்டுகிறது.
- source_word: יָכִין
  choice: ஆயத்தம் செய்பவர்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை ஆயத்தப்படுத்துதல் அல்லது வழங்குதல் என்ற பொருளைத் தருகிறது; ‘ஆயத்தம் செய்’ அதன் நேரடியான படிமத்தைப் பேணுகிறது.
- source_word: לָעֹרֵב
  choice: காக்கைக்காக
  rationale: לְ பயனடைவதைக் குறிக்கிறது; ஒருமை வடிவம் காக்கை இனத்தைப் பொதுவாகக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צֵידוֹ
  choice: அதன் இரையை
  rationale: צֵיד என்பது வேட்டையாடிப் பெறும் இரை அல்லது உணவு; ஆண்பால் ஒருமை பின்னொட்டு காக்கையைக் குறிக்கிறது. ‘இரை’ விலங்கு சார்ந்த உயிரோட்டமான படிமத்தைப் பேணுகிறது.
- source_word: כִּי
  choice: போது
  rationale: காக்கையின் தேவை வெளிப்படும் சூழலைக் காலப்பொருளில் இயல்பாக இணைக்கிறது; காரணப்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ילדיו
  choice: காக்கையின் குஞ்சுகள்
  rationale: பின்னொட்டுடன் உள்ள பெயர்ச்சொல் காக்கையின் இளம் குஞ்சுகளைக் குறிக்கிறது; தமிழில் குறிப்பு தெளிவாக இருக்க பெயர் மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: אֶל אֵל
  choice: கடவுளை நோக்கி
  rationale: אֵל இங்கு தனிப்பெயராக அல்லாமல் கடவுளைக் குறிக்கும் பொதுப்பெயராக உள்ளது; אֶל என்பதன் திசைப் பொருளை ‘நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: יְשַׁוֵּעוּ
  choice: கூக்குரலிட்டு
