base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: ta
  text: காக்கையின் குஞ்சுகள் கடவுளை நோக்கிக் கூக்குரலிட்டு, உணவு இல்லாததால் அலைந்து திரியும்போது[b][c], காக்கைக்கான இரையை ஆயத்தம் செய்பவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காக்கைக்கு உணவு வழங்குபவர் யார்?” எபிரெய வினைச்சொல் ‘ஆயத்தம் செய்’ அல்லது ‘வழங்கு’ என்று பொருள்படலாம்; ‘இரை’ என்பதைப் பொதுவாக ‘உணவு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் அதன் குஞ்சுகள் கடவுளை நோக்கிக் கூக்குரலிடுகின்றன.” இணைப்புச்சொல்லைக் காலப்பொருளில் ‘போது’ என்று மட்டுமல்லாமல், காரணப்பொருளில் ‘ஏனெனில்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வழிதவறித் திரிகின்றன” அல்லது “சுற்றித் திரிகின்றன.” எபிரெய வினைச்சொல் உணவைத் தேடி அலைவதையோ வழிதவறித் திரிவதையோ குறிக்கலாம்.
    reason: lexical_alternative
