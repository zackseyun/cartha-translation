  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ וְ֝/אֶשְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: ta
  text: ஆண்மகனைப் போல உன் இடுப்பில் கச்சை கட்டிக்கொள்[a]; நான் உன்னிடம் கேள்வி கேட்பேன்; நீ எனக்குத் தெரிவி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீரனைப் போல உறுதியாக ஆயத்தமாகு.” எபிரேயத்தில் நேரடியாக, “ஆண்மகனைப் போல உன் இடுப்பில் கச்சை கட்டிக்கொள்”; இது உறுதியுடன் ஆயத்தமாவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குப் பதில் சொல்.” எபிரேயச் சொல் இன்னும் நேரடியாக, “எனக்கு அறியச் செய்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: உன் இடுப்பில் கச்சை கட்டிக்கொள்
  rationale: אזר என்பதன் கட்டிக்கொள்ளுதல் என்ற உருவகப் பொருளையும், חֲלָצֶיךָ என்பதன் இடுப்பு என்ற உடற்குறிப்பையும் தக்கவைக்கிறது. முழுச் சொற்றொடர் உறுதியுடன் ஆயத்தமாவதைக் குறிக்கும் எபிரேய மரபுத்தொடர். נָא இங்கு பணிவான ‘தயவுசெய்து’ என்பதைவிட கட்டளையின் வலியுறுத்தலைக் கூட்டுகிறது; தமிழில் தனிச் சொல்லைச் சேர்த்து காலப்பொருள் புகுத்தாமல் கட்டளைநடையிலேயே அதன் விசை வெளிப்படுகிறது.
- source_word: כְגֶבֶר
  choice: ஆண்மகனைப் போல
  rationale: גֶּבֶר என்பது வலிமையின் நிழற்பொருள் கொண்ட ஆணைக் குறிக்கிறது. மூலத்தின் ஆண்பால் உருவகத்தைத் தக்கவைத்தபடியே நவீனத் தமிழில் தெளிவாக உள்ளது; ‘வீரனைப் போல’ என்பது பொருத்தமான மாற்று விளக்கம்.
- source_word: וְאֶשְׁאָלְךָ
  choice: நான் உன்னிடம் கேள்வி கேட்பேன்
  rationale: שאל என்பதன் அடிப்படைப் பொருள் ‘கேள்’. இச்சூழலில் தொடர்ந்து விசாரிக்கும் சவாலின் தொனியை ‘கேள்வி கேட்பேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהוֹדִיעֵנִי
  choice: நீ எனக்குத் தெரிவி
  rationale: ידע என்பதன் ஹிஃபீல் வடிவம் ‘அறியச் செய், தெரிவி’ என்று பொருள்படும். மரபான ‘எனக்குப் பதில் சொல்’ என்பதைவிட இது மூலச் சொல்லின் வடிவத்தையும் கட்டளை விசையையும் நெருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: இறைச் சவாலிலுள்ள ஆண்பால் உருவகம்
  choice: ஆண்மகனைப் போல
  alternative: வீரனைப் போல / வலிமையுள்ள மனிதனைப் போல
  rationale: மூலத்தில் ஆண்பால் ஒருமையான גבר பயன்படுத்தப்பட்டுள்ளது. அதை பாலினநடுநிலையாக்காமல் தக்கவைக்கிறது. அதேவேளை, இச்சொற்றொடர் ஆண்களின் மேன்மையைப் பற்றிய கோட்பாட்டுக் கூற்று அல்ல; உறுதியுடன் ஆயத்தமாவதற்கான சூழல்சார் சவால்.
- issue: ‘அறியச் செய்’ என்பதற்கும் ‘பதில் சொல்’ என்பதற்கும் இடையிலான தேர்வு
  choice: நீ எனக்குத் தெரிவி
  alternative: நீ எனக்குப் பதில் சொல்
  rationale: இறைவனுக்கு அறிவு குறைவு இருப்பதாக விளக்காமல், எபிரேய ஹிஃபீல் வடிவத்தின் நேரடியான ‘எனக்கு அறியச் செய்’ என்ற சவால்மொழியைப் பேணுகிறது. ‘பதில் சொல்’ சூழலுக்கு இயல்பானதாயினும் சற்று விளக்கமளிக்கும் மொழிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான இறைச் சவாலுக்கேற்ற கண்ணியமான ஒருமைக் கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
