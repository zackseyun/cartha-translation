  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: ta
  text: உள்ளார்ந்த பகுதிகளில் ஞானத்தை வைத்தவர் யார்? அல்லது மனதிற்குப் புரிந்துணர்வைக் கொடுத்தவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “மறைவான பகுதிகளில் ஞானத்தை வைத்தவர் யார்? அல்லது சேவலுக்குப் புரிந்துணர்வைக் கொடுத்தவர் யார்?” என்றும் பொருள்கொள்ளலாம். இரண்டாம் சொல் மனதைக் குறிப்பதற்குப் பதிலாக ஒரு பறவையை—வழக்கமாகச் சேவலை, சிலர் கருத்துப்படி ஐபிஸ் பறவையை—குறிக்கலாம்.
    reason: மூலத்திலுள்ள இரண்டு அரிய சொற்களின் பொருள் உறுதியற்றது; மனிதனின் உள்ளார்ந்த அறிவாற்றல் மற்றும் பறவையின் இயல்புணர்வு ஆகிய இரு வாசிப்புகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: தேவனுடைய விடையை எதிர்பாராத வினாவை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: שָׁת
  choice: வைத்தவர்
  rationale: ‘வைத்தல், அமைத்தல்’ என்ற அடிப்படைப் பொருளைப் பேணுவதோடு, இணையான இரண்டாம் பகுதியில் வரும் ‘கொடுத்தவர்’ என்பதோடும் இயல்பாக அமைகிறது.
- source_word: בַּטֻּחוֹת
  choice: உள்ளத்தின் ஆழங்களில்
  rationale: சொல்லின் பொருள் உறுதியற்றது. உடலின் உள்ளுறுப்புகள் அல்லது மறைவான அகப்பகுதிகள் என்ற உருவகத்தை, நவீன வாசகருக்கு வெறும் உடற்கூறியல் குறிப்பாகத் தோன்றாதவாறு இந்த மொழிபெயர்ப்பு தருகிறது.
- source_word: חָכְמָה
  choice: ஞானத்தை
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளைத் தந்து, ‘புரிந்துணர்வு’ என்பதுடன் உள்ள கவிதை இணைத்தன்மையைப் பேணுகிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: இணையான இரு வினாக்களைப் பிரிக்கும் விலக்கிடைச் சொல்லை நேரடியாகப் பேணுகிறது.
- source_word: נָתַן
  choice: கொடுத்தவர்
  rationale: சொல்லின் வழக்கமான பொருள்; முதல் பகுதியில் வரும் ‘வைத்தவர்’ என்பதற்கு இணையாக இயங்குகிறது.
- source_word: לַשֶּׂכְוִי
  choice: மனதிற்கு
  rationale: ‘உள்ளத்தின் ஆழங்கள்’ என்பதுடனான இணைத்தன்மையும் ஞானம்–புரிந்துணர்வு என்ற கருத்திணையும் ஓர் உள்ளார்ந்த அறிவாற்றலைக் குறிக்கக்கூடும். பறவையைக் குறிக்கும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִינָה
  choice: புரிந்துணர்வை
  rationale: வெறும் தகவலறிவை அல்லாமல், பகுத்தறிந்து உணரும் திறனைச் சுட்டுகிறது; ‘ஞானம்’ என்பதிலிருந்து உள்ள நுண்ணிய வேறுபாட்டையும் பேணுகிறது.
theological_decisions:
- issue: தேவனுடைய படைப்புச் செயலைப் பற்றிய உரையில் வரும் பொருள் உறுதியற்ற இரண்டு சொற்களின் விளக்கம்
  choice: மனிதனின் உள்ளார்ந்த பகுதிகளுக்கும் மனதிற்கும் தேவன் ஞானத்தையும் புரிந்துணர்வையும் அளிப்பதாக முதன்மை உரை கூறுகிறது.
  alternative: தேவன் மறைவான பகுதிகளில் ஞானத்தை வைத்ததையோ, சேவல் அல்லது ஐபிஸ் போன்ற ஒரு பறவைக்கு இயல்புணர்வைக் கொடுத்ததையோ இவ்வசனம் குறிக்கலாம்.
  rationale: கவிதை இணைத்தன்மை உள்ளார்ந்த மனித அறிவாற்றல்களைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது. எனினும், பறவையைக் குறிக்கும் பழமையான மாற்று விளக்கம் மொழியியல் ரீதியாகச் சாத்தியமுள்ளதால் அதைத் தீர்மானமாக விலக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் தெய்வீக உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘உள்ளத்தின் ஆழங்கள்’ என்பது உடல் சார்ந்த அகப்பகுதி உருவகத்தை இயல்பாகத் தக்கவைக்கிறது; ‘புரிந்துணர்வு’ என்பது ‘ஞானம்’ என்பதிலிருந்து வேறுபட்ட பகுத்துணரும் திறனை வெளிப்படுத்துகிறது.
