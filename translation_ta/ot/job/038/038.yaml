  text: when the dust hardens into a mass[a], and the clods stick together?
translation:
  language: ta
  text: புழுதி இறுகி ஒரு திடத் திரளாகும்போதும்[a], மண்கட்டிகள் ஒன்றோடொன்று ஒட்டிக்கொள்ளும்போதும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புழுதி ஊற்றி வார்க்கப்பட்ட திண்மமாகும்போது” / “வார்க்கப்பட்ட உலோகம்போல் புழுதி இறுகும்போது.” மண் இறுகித் திண்மமாவதை எபிரெயச் சொற்கள் ஊற்றுதல் அல்லது வார்த்தல் என்ற படிமத்தால் விவரிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: கெட்டியான ... ஆகும்போது
  rationale: இச்சொல் இங்கு காலத்தைக் குறிக்கும் துணைவாக்கியத்தைத் தொடங்குகிறது. வார்த்தையின் ஊற்றுதல்/வார்த்தல் என்ற உருவகத்தை அடிக்குறிப்பில் காத்து, சூழலில் புழுதி இறுகித் திரள்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָפָר
  choice: புழுதி
  rationale: עָפָר என்பது புழுதி அல்லது உதிரியான மண்ணைக் குறிக்கும்; இங்கு பொதுவான நிலப்பொருளைக் குறிக்க ‘புழுதி’ பொருத்தமானது.
- source_word: לַמּוּצָק
  choice: திரளாக
  rationale: יצק வேரிலிருந்து வரும் இச்சொல் ஊற்றி வார்க்கப்பட்ட அல்லது இறுகிய திரளைக் குறிக்கலாம். உலோக உருவகத்தை முதன்மை உரையில் மிகைப்படுத்தாமல், மண் ஒன்றாக இறுகும் விளைவை ‘திரளாக’ தெரிவிக்கிறது.
- source_word: וּרְגָבִים
  choice: மண்கட்டிகள்
  rationale: רְגָבִים என்பது மண்ணின் கட்டிகளைக் குறிக்கிறது; ‘மண்கட்டிகள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: יְדֻבָּקוּ
  choice: ஒன்றோடொன்று ஒட்டிக்கொள்ளும்
  rationale: இச்செயப்பாட்டு வடிவம் மண்கட்டிகள் ஒன்றுடன் ஒன்று ஒட்டிச் சேர்வதைச் சுட்டுகிறது; ‘ஒன்றோடொன்று ஒட்டிக்கொள்ளும்’ அதன் இயற்படிமத்தைத் தெளிவாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான வினா அமைப்பையும் மண் இறுகி ஒன்றுசேரும் இயற்படிமத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘புழுதி’, ‘மண்கட்டிகள்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
