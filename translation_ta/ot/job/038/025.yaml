  yaml_path: translation/ot/job/038/025.yaml
  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: ta
  text: வெள்ளப்பெருக்குக்கு வாய்க்காலை வெட்டியவர் யார்? இடிமின்னலுக்கு[a] வழியை அமைத்தவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடியின் மின்னலுக்கு.” எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “ஒலிகளின் மின்னலுக்கு” எனலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: வெட்டியவர்
  rationale: ஒரு நீரோட்டப் பாதையைப் பிரித்து அல்லது பிளந்து உருவாக்குவதை வினை குறிக்கிறது; תְּעָלָה என்பதுடன் சேர்ந்து ‘வாய்க்காலை வெட்டியவர்’ என்பது படிமத்தை இயல்பாகக் காக்கிறது.
- source_word: שֶּׁטֶף
  choice: வெள்ளப்பெருக்கு
  rationale: பெருக்கெடுத்து ஓடும் நீரையோ மிகுந்த மழைவெள்ளத்தையோ குறிக்கலாம்; வாய்க்காலுடன் இணையும் இச்சூழலில் ‘வெள்ளப்பெருக்கு’ பொருத்தமானது.
- source_word: תְּעָלָה
  choice: வாய்க்கால்
  rationale: நீர் செல்வதற்கான வெட்டப்பட்ட கால்வாய் அல்லது ஓடுபாதையைக் குறிக்கிறது; நவீனத் தமிழில் ‘வாய்க்கால்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: דֶרֶךְ
  choice: வழி
  rationale: இங்கு வானில் புயல் நிகழ்வுக்கென அமைந்த போக்கு அல்லது பாதையைக் குறிக்கிறது; ‘வழி’ கவிதைநடையில் இயல்பானது.
- source_word: חֲזִיז
  choice: மின்னல்
  rationale: அரிதான இச்சொல் மின்னல் அல்லது இடிமின்னலைக் குறிக்கலாம்; அடுத்துள்ள קֹלוֹת உடன் அதன் ஒலியம்சத்தையும் தெரிவிக்க ‘இடிமின்னல்’ என முழுச் சொற்றொடர் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קֹלוֹת
  choice: இடி
  rationale: அடிப்படையில் ‘குரல்கள்/ஒலிகள்’ என்றாலும், வானிலைச் சூழலில் இடியொலியைக் குறிக்கிறது; חֲזִיז உடன் ‘இடிமின்னல்’ என்று இயல்பாக வழங்கப்படுகிறது.
