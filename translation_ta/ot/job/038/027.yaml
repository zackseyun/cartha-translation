  text: to satisfy the desolate wasteland, and to make the growth of grass sprout?
translation:
  language: ta
  text: 'பாழும் வெறுமையுமான நிலத்தை நிறைவாக்கவும்,


    புல்லின் தளிரை முளைக்கச் செய்யவும் அல்லவா?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַשְׂבִּיעַ
  choice: நிறைவுறச் செய்யவும்
  rationale: ‘திருப்தியடையச் செய்தல் / நிறைவாக்குதல்’ என்ற அடிப்படைக் கருத்தைப் பாதுகாக்கிறது; மழையால் நிலம் தண்ணீர் பெறுகிறது என்பது சூழலிலிருந்து விளங்கும்.
- source_word: שֹׁאָה וּמְשֹׁאָה
  choice: பாழான வெறும்நிலத்தை
  rationale: இணையான இரு சொற்களின் ‘பாழடைந்த, மனிதர் இல்லாத வெறுமை’ என்ற தீவிரத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: מֹצָא דֶשֶׁא
  choice: பசும்புல்லின் முளையை
  rationale: מֹצָא என்பதன் ‘வெளிப்படுதல்/முளைத்தெழுதல்’ என்ற பெயர்ச்சொல் கருத்தையும் דֶשֶׁא என்பதன் இளம் பசுந்தாவரக் கருத்தையும் காக்கிறது.
- source_word: וּלְהַצְמִיחַ
  choice: முளைக்கச் செய்யவும்
  rationale: ஹிபில் வினையின் காரணவினைப் பொருளான ‘முளைக்கும்படி செய்தல்’ என்பதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: வினாக் கட்டமைப்பும் இறைச் செயலாற்றலும்
  choice: ‘அல்லவா?’ என முந்தைய வசனங்களிலிருந்து தொடரும் இறை வினாவாகவும், முளைக்கச் செய்யும் செயலை இறைவனுடைய செயலாகவும் வைத்தல்
  alternative: தனி நோக்கவாக்கியமாக மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் இவ்வசனம் முந்தைய வினாவின் நோக்கத் தொடர்களாக அமைந்துள்ளது; உரையின் வினாத் தொனியையும் படைப்பின் மீது இறைவனுடைய செயலையும் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கவித்துவமுள்ளதாயினும் பொதுவாசகருக்குப் புரியும் நடை. எபிரெய இணைச்சொற்களின் தீவிரமும் ‘முளை’ என்ற பெயர்ச்சொல் கூறும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
