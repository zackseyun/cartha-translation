  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: ta
  text: நீர் கல்லைப்போல் உறைந்து கடினமாகிறது[a]; ஆழத்தின் மேற்பரப்பு ஒன்றாக இறுகப் பிணைகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘நீர் கல்லைப்போல் தம்மை மறைத்துக்கொள்கிறது.’ இங்குள்ள எபிரெய வினை வழக்கத்திற்கு மாறானது; இச்சூழலில் நீர் உறைந்து கடினமாவதையும் அது சித்தரிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆழத்தின் மேற்பரப்பு உறைகிறது.’ எபிரெயச் சொல், அது பிடிக்கப்பட்டதுபோல் அல்லது ஒன்றாக இறுக இணைக்கப்பட்டதுபோல் இருப்பதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: கல்லைப் போல
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; ஆகவே ‘கல்லாக’ என்பதைக் காட்டிலும் ‘கல்லைப் போல’ என்பது மூலத்தின் உருவகத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: מַיִם
  choice: தண்ணீர்கள்
  rationale: מַיִם வடிவில் பன்மையாகவும் இங்கு பிரபஞ்ச நீர்ப்பரப்பைக் குறிக்கும் கவிதைச் சொல்லாகவும் உள்ளது; தமிழிலும் பன்மை அந்தக் கவிதைத் தன்மையைப் பேணுகிறது.
- source_word: יִתְחַבָּאוּ
  choice: உறைந்து மறைகின்றன
  rationale: வினையின் அடிப்படைப் பொருள் ‘தம்மை மறைத்துக்கொள்கின்றன’; ஆனால் கல்லைப் போன்ற நிலையும் இணைவரியின் இறுகப் பிணைதலும் உறைதலைச் சுட்டுகின்றன. ‘உறைந்து மறைகின்றன’ என்பது வழக்கத்திற்கு மாறான எபிரெயச் சொல்லாட்சியின் மறைதல் உருவகத்தையும் சூழலின் உறைதல் பொருளையும் ஒன்றாகப் பேணுகிறது.
- source_word: וּפְנֵי
  choice: மேற்பரப்பு
  rationale: நீரைப் பற்றிய சூழலில் ‘முகம்’ என்பதன் இயல்பான தமிழ்ப் பொருள் ‘மேற்பரப்பு’.
- source_word: תְהוֹם
  choice: ஆழம்
  rationale: பிரபஞ்ச நீராழத்தைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான, மிகை விளக்கமில்லாத தமிழ் இணை.
- source_word: יִתְלַכָּדוּ
  choice: இறுகப் பிணைகிறது
  rationale: இந்த வினை பிடிக்கப்படுதல், ஒன்றாகப் பற்றிக்கொள்ளுதல் அல்லது இறுக இணைதல் என்னும் படிமத்தைக் கொண்டது. ‘உறைகிறது’ என்று மட்டும் மொழிபெயர்ப்பதைவிட ‘இறுகப் பிணைகிறது’ மூல உருவகத்தையும் அதன் விளைவான உறைநிலையையும் காக்கிறது.
