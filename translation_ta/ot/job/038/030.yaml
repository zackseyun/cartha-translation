  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கவிதைச் செறிவுடனும் அமைக்கப்பட்டுள்ளது. முதல் வரியில் எபிரெய வினையின் உண்மையான ‘மறைதல்’ பொருளும் சூழல் உணர்த்தும் ‘உறைதல்’ பொருளும் இணைக்கப்பட்டுள்ளன; இரண்டாம் வரியில் பொதுவான ‘உறைகிறது’ என்பதற்குப் பதிலாக மூலத்தின் பிடிபட்டு இறுகும் படிமம் பேணப்பட்டுள்ளது. எல்லா அடிக்குறிப்புக் குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
