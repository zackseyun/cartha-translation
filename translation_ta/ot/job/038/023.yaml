  text: אֲשֶׁר חָשַׂ֥כְתִּי לְ/עֶת צָ֑ר לְ/י֥וֹם קְ֝רָ֗ב וּ/מִלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/023.yaml
  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: ta
  text: அவற்றை நெருக்கடியின் காலத்திற்காகவும்[b], போருக்கும் யுத்தத்துக்கும் உரிய நாளுக்காகவும் நான் ஒதுக்கி வைத்திருக்கிறேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தடுத்து வைத்திருக்கிறேன்” அல்லது “சேமித்து வைத்திருக்கிறேன்.”
    reason: lexical_alternative
  - marker: b
    text: “நெருக்கடி” என்பதை “துன்பம்” அல்லது “இடுக்கண்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவற்றை
  rationale: தொடர்புப்பெயர் குறிக்கும் பொருள் முந்தைய வசனத்திலுள்ள பனிக்கட்டி களஞ்சியங்கள் அல்லது அவற்றில் வைக்கப்பட்டுள்ள பனிக்கட்டிகள். தமிழில் தனியாக ‘அவை’ என்று தொடங்குவதைவிட, வினையின் மறைமுகச் செயப்படுபொருளை வெளிப்படுத்தும் ‘அவற்றை’ இயல்பாக உள்ளது.
- source_word: חָשַׂכְתִּי
  choice: நான் ஒதுக்கி வைத்திருக்கிறேன்
  rationale: חשׂך என்பது தடுத்து வைத்தல், சேமித்து வைத்தல், பிற்காலப் பயன்பாட்டுக்காக ஒதுக்கி வைத்தல் ஆகிய பொருள்களைத் தரலாம். இச்சூழலில் நோக்கத்துடன் பிற்காலத்திற்காக வைத்திருப்பதை ‘ஒதுக்கி வைத்திருக்கிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעֶת צָר
  choice: நெருக்கடி நேரத்திற்காக
  rationale: לְ நோக்கத்தைச் சுட்டுகிறது; עֵת என்பது நேரம் அல்லது காலம்; צָר இங்கு நெருக்கடி அல்லது துன்பத்தைக் குறிக்கிறது. ‘நெருக்கடி நேரம்’ சுருக்கமாகவும் தற்போதைய தமிழில் தெளிவாகவும் உள்ளது.
- source_word: לְיוֹם
  choice: நாளுக்காக
  rationale: முந்தைய לְעֶת என்பதற்கு இணையான நோக்கப் பயன்பாட்டைத் தமிழில் ‘-க்காக’ தக்கவைக்கிறது.
- source_word: קְרָב
  choice: சண்டை
  rationale: இது நேரடியான ஆயுத மோதல் அல்லது battle என்பதைக் குறிக்கும் பொதுவான இராணுவச் சொல். அடுத்துள்ள ‘போர்’ என்பதிலிருந்து வேறுபாட்டையும் தக்கவைக்கிறது.
- source_word: וּמִלְחָמָה
  choice: போரும்
  rationale: மூலத்தில் உள்ள இணையான இரு இராணுவச் சொற்களையும் ஒன்றாகச் சுருக்காமல், ‘சண்டையும் போரும்’ என்று தக்கவைக்கிறது.
theological_decisions:
- issue: இயற்கைச் சக்திகளைத் தெய்வீக நோக்கத்திற்காக ஒதுக்கிவைத்திருக்கும் படிமம்
  choice: நெருக்கடி, சண்டை, போர் ஆகிய காலங்களுக்காக கடவுள் இவற்றை ஒதுக்கி வைத்திருப்பதாக வசனம் நேரடியாகக் கூறும் பொருளைத் தக்கவைத்தல்
  alternative: இராணுவக் குறிப்பில்லாத பொதுவான இறைபராமரிப்பின் உருவகமாக மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை ‘சண்டை’ மற்றும் ‘போர்’ என்று வெளிப்படையாகக் கூறுகிறது. அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமலும் அதற்கு மேலதிக விளக்கம் சேர்க்காமலும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழின் இயல்பான சொல் வரிசைக்காக முதன்மை வினை இறுதியில் வைக்கப்பட்டுள்ளது; ‘சண்டை’ மற்றும் ‘போர்’ என்ற மூலத்தின் நெருங்கிய இணைச்சொற்கள் இரண்டும் பாதுகாக்கப்பட்டுள்ளன.
