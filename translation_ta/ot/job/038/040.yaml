  text: when they crouch in their dens and lie in wait in the thicket?[a]
translation:
  language: ta
  text: அவை தங்கள் குகைகளில் குனிந்து கிடந்து, புதர்களின் மறைவில் பதுங்கித் தாக்கக் காத்திருக்கும்போது?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: போது
  rationale: தெய்வீக உரையிலுள்ள தொடர்ச்சியான வினாக்களின் சூழலில், இது காரணத்தைக் காட்டுவதைவிட வேட்டையாடும் சூழ்நிலையின் காலத்தைக் காட்டுகிறது.
- source_word: יָשֹׁחוּ
  choice: பதுங்கி
  rationale: வேட்டைக்காக உடலைத் தாழ்த்திக்கொள்ளும் விலங்கின் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; வெறுமனே ‘குனிந்து’ என்பதைவிட வேட்டைச் சூழலுக்கு ஏற்றது.
- source_word: בַמְּעוֹנוֹת
  choice: தங்கள் குகைகளில்
  rationale: இங்கு מְעוֹנוֹת சிங்கங்களின் உறைவிடங்கள் அல்லது மறைவிடங்களைக் குறிக்கிறது. சூழலிலிருந்து புரியும் உடைமையைத் தமிழில் ‘தங்கள்’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֵשְׁבוּ
  choice: காத்திருக்க
  rationale: இதன் அடிப்படைப் பொருள் ‘அமர்ந்திரு’ என்றாலும், לְמוֹ אָרֶב உடன் சேர்ந்த நிலையில் மறைந்திருந்து தாக்கத் தயாராக இருப்பதைக் குறிக்கிறது.
- source_word: בַסֻּכָּה
  choice: புதர்மறைவில்
  rationale: இங்கு கட்டப்பட்ட பண்டிகைக் குடில் அல்ல, பதுங்கித் தாக்க ஏற்ற இயற்கையான மறைவிடம் குறிக்கப்படுகிறது. ‘புதர்மறைவு’ அந்தக் காட்சியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְמוֹ אָרֶב
  choice: தாக்கக் காத்திருக்க
  rationale: இந்தச் சொற்றொடர் பதுங்கித் தாக்கும் நோக்கத்தைக் காட்டுகிறது. யֵשְׁבוּ என்பதுடன் சேர்த்து தமிழில் இயல்பான வேட்டைச் செயலாக மொழிபெயர்க்கப்பட்டுள்ளது.
