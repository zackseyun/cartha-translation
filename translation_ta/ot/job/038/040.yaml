  register: நவீனத் தரத் தமிழில், செய்யுளின் வினா வடிவமும் வேட்டைச் சூழலும் காக்கப்பட்டுள்ளன. ‘பதுங்கி’ மற்றும் ‘தாக்கக் காத்திருக்க’ என்பவை மூலத்தின் இரு நிலைகளையும் இயல்பாக வெளிப்படுத்துகின்றன.
