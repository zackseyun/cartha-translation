  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: ta
  text: 'அப்போது யாவே புயலிலிருந்து[a] யோபுக்குப் பதிலளித்துச் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுழற்காற்றிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்துச்
  rationale: ענה என்பதன் இக்கதைநடை வடிவம் ‘பதிலளித்தார்’ என்று பொருள்படும். யோபின் முந்தைய உரைகளுக்கு யாவே அளிக்கும் பதில் என்ற தொடர்பை இது தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶת אִיּוֹב
  choice: யோபுக்கு
  rationale: את என்பது நேரடிச் செயப்படுபொருள் குறியீடு. ஆனால் ‘பதிலளி’ என்ற தமிழ் வினை இயல்பாக நான்காம் வேற்றுமையை வேண்டுவதால், பெயர் ‘யோபுக்கு’ என அமைக்கப்பட்டுள்ளது.
- source_word: מִן־הַסְּעָרָה
  choice: புயலிலிருந்து
  rationale: סְעָרָה என்பது வன்மையான புயல், பெருங்காற்று அல்லது சுழற்காற்றைக் குறிக்கலாம். ‘புயல்’ என்பது பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல், நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: אמר என்பதன் தொடர்கதை வடிவத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது; ‘பதிலளித்துச் சொன்னார்’ என்ற அமைப்பு எபிரெய வாக்கியத்தின் இரு வினைகளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. எனவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பட்ட பெயரைப் பாதுகாக்கிறது.
- issue: סְעָרָה என்பதன் காட்சித் துல்லியம்
  choice: புயல்
  alternative: சுழற்காற்று
  rationale: இந்த எபிரெயச் சொல் பொதுவாகக் கடும் புயலைக் குறிக்கக்கூடும்; அவசியமாகச் சுழலும் காற்றையே குறிப்பதில்லை. முதன்மை உரையில் பரந்த பொருளை வைத்துக்கொண்டு, சாத்தியமான குறிப்பான பொருளை அடிக்குறிப்பில் தருவது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ‘பதிலளித்து—சொன்னார்’ என்ற இரட்டை வினை அமைப்பு தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
