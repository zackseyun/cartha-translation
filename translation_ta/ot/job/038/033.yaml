base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: ta
  text: வானங்களின் நியமங்களை நீ அறிவாயா? அதன் ஆட்சியைப் பூமியில் உன்னால் நிலைநாட்ட முடியுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் ஆட்சி’ என்பதற்கு ‘அதன் ஆதிக்கம்’ அல்லது ‘அதன் அதிகாரம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் பின்னொட்டு ஒருமையில் (‘அதன்’) உள்ளது; அது ‘வானங்கள்’ என்பதைக் கூட்டாகச் சுட்டுவது சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: நீ அறிவாயா?
  rationale: வினா இடைச்சொல்லுடன் வரும் ידע வினை, தற்போது ஒருவருக்கு அறிவு உள்ளதா என்று கேட்கும் பொருளில் உள்ளது; நவீன தமிழில் இயல்பான நேரடி வினாவாக மொழிபெயர்க்கப்பட்டது.
- source_word: חֻקּוֹת
  choice: நியமங்கள்
  rationale: படைப்பில் நிறுவப்பட்ட வரம்புகளையும் ஒழுங்குபடுத்தும் விதிகளையும் குறிக்கிறது. ‘சட்டங்கள்’ என்பதைக் காட்டிலும் ‘நியமங்கள்’ இங்கு விண்ணுலக ஒழுங்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמָיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தையும் இப்பகுதியின் உயர்ந்த அண்டவெளிச் சூழலையும் காக்கிறது.
- source_word: אִם
  choice: உன்னால் ... முடியுமா?
  rationale: முதல் வினாவுக்கு இணையான இரண்டாவது சவாலான வினாவை அறிமுகப்படுத்துகிறது; சொல்லுக்குச் சொல் ‘என்றால்’ என்று தராமல் தமிழில் அதன் வினா வலிமை இயல்பாகக் கொடுக்கப்பட்டது.
- source_word: תָּשִׂים
  choice: நிலைநாட்ட
  rationale: அடிப்படைப் பொருள் ‘வை/அமை’ என்றாலும், ஆட்சி அல்லது அதிகாரத்தைப் பூமியில் செயல்படுமாறு நிறுவுவதே இங்குள்ள கருத்து.
- source_word: מִשְׁטָרוֹ
  choice: அதன் ஆட்சி
  rationale: מִשְׁטָר என்பது ஆட்சி, ஆதிக்கம் அல்லது அதிகாரத்தைக் குறிக்கலாம். பின்னொட்டு ஒருமையில் இருப்பதால் ‘அதன்’ என்று வடிவ வேறுபாடு பாதுகாக்கப்பட்டது; அது ‘வானங்கள்’ என்பதைக் கூட்டாகச் சுட்டுவது சாத்தியம்.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: வானங்களின் ஆட்சி செயல்படும் பூமிக்குரிய தளத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: வானங்களின் நியமங்களும் ஆட்சியும் எதைக் குறிக்கின்றன?
  choice: படைப்பில் நிறுவப்பட்ட நிலையான விண்ணுலக நியமங்களையும் ஆளும் ஒழுங்கையும் பொதுவாகக் குறிக்கிறது.
  alternative: நட்சத்திரங்கள் அல்லது விண்மீன் கூட்டங்கள் பூமியின் நிகழ்வுகளை நிர்ணயிக்கும் சோதிட ஆதிக்கத்தைக் குறிப்பாகக் குறிக்கிறது.
  rationale: சூழல் விண்மீன்களையும் வானங்களையும் பற்றியது. ஆனாலும் எபிரெயச் சொற்கள் சோதிட நிர்ணயத்தைத் தெளிவாகக் கூறாமல், நிறுவப்பட்ட நியமங்களையும் ஆட்சியையும் மட்டுமே கூறுகின்றன. ஆகவே மூலத்தில் இல்லாத குறிப்பிட்ட சோதிடக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தெய்வீகச் சவாலின் நேரடியான கேள்வித் தொனியும் கவித்துவமான உயர்நடையும் காக்கப்பட்டுள்ளன. அரிதான அல்லது மிகச் சட்டவியல் சார்ந்த சொற்களைத் தவிர்த்து, பொதுவாசகர்களுக்குப் புரியும் ‘நியமங்கள்’, ‘ஆட்சி’, ‘நிலைநாட்ட’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
