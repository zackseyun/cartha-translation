translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பிறந்தாயே’, ‘மிகுதியாயிற்றே’ ஆகிய வலியுறுத்தல் வடிவங்கள் எபிரெய உரையின் இறை ஏளனத்தை வெளிப்படுத்துகின்றன; பொருளைத் தேவையின்றி விளக்கிச் சேர்க்கவில்லை.
