  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: ta
  text: உனக்குத் தெரியும்[a]; ஏனெனில் அப்போதுதான் நீ பிறந்தாய்; உன் நாட்களின் எண்ணிக்கையும் மிகுதியானதே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குத் தெரிந்திருந்தது.” எபிரெய வினைச்சொல் இறந்தகாலப் பொருளையும் தரக்கூடும்; இங்கு ஏளனமான இறைவாக்கின் வலிமையை நிகழ்கால மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
