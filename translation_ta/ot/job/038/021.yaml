lexical_decisions:
- source_word: יָדַעְתָּ
  choice: அது உனக்குத் தெரியும்
  rationale: ידע என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். இங்கு இறைவனின் ஏளனமான வினாவுரையில், தமிழ் நிகழ்காலமான ‘தெரியும்’ அதன் சொல்லாட்சிச் சக்தியை இயல்பாக வெளிப்படுத்துகிறது; எபிரெய வடிவத்திற்கு இறந்தகாலப் பொருளும் சாத்தியம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் வினாவுக்கு ஏளனமான காரணவிளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: אָז
  choice: அப்போதே
  rationale: முன்னர் குறிப்பிடப்பட்ட படைப்புக் காலத்தைச் சுட்டும் காலவினையடை; ‘அப்போதே’ ஏளன வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: תִּוָּלֵד
  choice: நீ பிறந்தாயே
  rationale: ילד என்பதன் Niphal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். சூழலில் கடந்த காலத்தை ஏளனமாகக் குறிக்கிறது; இறுதி ‘-ஏ’ அந்த வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִסְפַּר יָמֶיךָ
  choice: உன் நாட்களின் எண்ணிக்கையும்
  rationale: இணைப்புச் சொல்லுடன் வரும் construct தொடரின் அமைப்பையும் ‘உன் நாட்களின் எண்ணிக்கை’ என்ற இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: רַבִּים
  choice: மிகுதியாயிற்றே
  rationale: ‘பல/மிகுதி’ என்ற பொருளுடைய predicate adjective. இங்கு ‘எண்ணிக்கை’ என்ற ஒருமைத் தலைச்சொல்லோடு இயல்பாக இணைந்து, நீண்ட ஆயுளைக் குறித்த ஏளனத்தையும் தக்கவைக்கிறது.
