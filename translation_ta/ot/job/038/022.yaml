  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: ta
  text: நீ பனியின் களஞ்சியங்களுக்குள்[a] சென்றிருக்கிறாயா? அல்லது ஆலங்கட்டியின் களஞ்சியங்களைப் பார்த்திருக்கிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பனியின் கருவூலங்களுக்குள் … ஆலங்கட்டியின் கருவூலங்களை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: சென்றிருக்கிறாயா … களஞ்சியங்களுக்குள்
  rationale: வினாவிடை முன்னொட்டுடன் வரும் בוא, ஓர் இடத்தை நோக்கிச் செல்வதைக் குறிக்கிறது. இங்கு களஞ்சியங்களின் உள்ளே செல்வது என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்த ‘களஞ்சியங்களுக்குள் சென்றிருக்கிறாயா?’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֹצְרוֹת
  choice: களஞ்சியங்கள்
  rationale: אֹצָר என்பது கருவூலம், களஞ்சியம் அல்லது சேமிப்பிடம் எனப் பொருள்படும். பனியும் ஆலங்கட்டியும் சேமித்து வைக்கப்பட்டிருப்பதைப் போன்ற கவிதை உருவகத்தை ‘களஞ்சியங்கள்’ தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: שָׁלֶג
  choice: பனி
  rationale: இது வானிலையுடன் தொடர்புடைய ‘snow’ என்பதற்கான வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: וְאֹצְרוֹת
  choice: அல்லது … களஞ்சியங்களை
  rationale: எபிரெய இணைப்புச்சொல் இரு இணையான வினாக்களைத் தொடுக்கிறது. தமிழில் இரண்டாவது மாற்று வினாவை இயல்பாக இணைக்க ‘அல்லது’ பயன்படுத்தப்பட்டது.
- source_word: בָּרָד
  choice: ஆலங்கட்டி
  rationale: வானிலையியல் பொருளில் hail என்பதற்கான தெளிவான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: תִּרְאֶה
  choice: பார்த்திருக்கிறாயா
  rationale: வடிவில் இது முற்றுப்பெறாத வினையாக இருந்தாலும், முந்தைய வினாவுக்கு இணையான கவிதைநடை வினாவாக உள்ளது. அனுபவத்தை விசாரிக்கும் சொல்லாட்சியை இயல்பான தமிழில் ‘பார்த்திருக்கிறாயா?’ வெளிப்படுத்துகிறது.
