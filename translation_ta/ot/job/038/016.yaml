  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: ta
  text: கடலின் ஊற்றுகள்வரை[a] நீ சென்றிருக்கிறாயா? ஆழத்தின் மறைவிடங்களில்[b] நீ நடமாடியிருக்கிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலின் மூலங்கள்வரை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆழத்தின் ஆழ்ந்த பகுதிகளில்’ அல்லது ‘ஆழத்தின் எட்டாத எல்லைகளில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ
  choice: நீ சென்றிருக்கிறாயா?
  rationale: בוא என்பதன் Qal perfect 2ms வடிவம் வினாவாக வருகிறது. தமிழில் இலக்கை நோக்கிய இயக்கத்தை இயல்பாகவும், யோபை நேரடியாகச் சவால் செய்யும் தொனியுடனும் தெரிவிக்கிறது.
- source_word: עַד
  choice: இடம்
  rationale: சென்று அடையும் இலக்கைக் குறிக்கும் עַד, ‘ஊற்றுகளிடம்’ என்ற இடவியல் வடிவத்தில் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: נִבְכֵי
  choice: ஊற்றுகள்
  rationale: கடல்நீரின் மறைவான பிறப்பிடங்கள் அல்லது நீர் புறப்படும் இடங்கள் என்ற சாத்தியமான பொருளைத் தெளிவாகவும் உருவகச் செறிவுடனும் தருகிறது; ‘மூலங்கள்’ என்பதும் சாத்தியம்.
- source_word: יָם
  choice: கடல்
  rationale: இங்கு தனிப்பெயராக அல்லாமல் பொதுப்பெயராக வரும் יָם என்பதன் நேரடியான நவீனத் தமிழ் இணை.
- source_word: וּבְחֵקֶר
  choice: ஆராய முடியாத இடங்களில்
  rationale: חֵקֶר என்பது ஆராய்தல், ஆராய்ந்து அடையப்படும் எல்லை, அல்லது எட்ட முடியாத உள் பகுதிகள் ஆகிய பொருட்களைத் தரக்கூடும். תהום உடனும் நடப்பதைக் குறிக்கும் வினையுடனும் வருவதால், ஆழ்கடலின் மனித ஆராய்ச்சிக்கு எட்டாத பகுதிகள் என்ற பொருளை இயல்பாகத் தருகிறது. இணைப்புச் சொல் தமிழில் இரண்டாவது இணை வினாவாகத் தனியே அமைக்கப்பட்டுள்ளது.
- source_word: תְּהוֹם
  choice: ஆழ்கடல்
  rationale: ஆழமான பெருநீர்ப்பரப்பை அல்லது ஆதியாழத்தைச் சுட்டும் சொல்லின் கவித்துவ வலிமையைப் பாதுகாக்கிறது; ‘பாதாள ஆழம்’ என மொழிபெயர்ப்பது தேவையற்ற கூடுதல் கருத்தைச் சேர்க்கலாம்.
- source_word: הִתְהַלָּכְתָּ
  choice: நீ நடந்திருக்கிறாயா?
  rationale: הלך என்பதன் Hitpael வடிவம் நடமாடுதல் அல்லது சுற்றித் திரிதல் என்ற உணர்வைக் கொண்டது. அணுக முடியாத இடங்களை நடந்தே கடந்ததாகக் கேட்கும் மூல உருவகத்தையும் சொல்லாட்சியின் வலிமையையும் ‘நடந்திருக்கிறாயா’ பாதுகாக்கிறது.
