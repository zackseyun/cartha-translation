base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: ta
  text: மரணத்தின் வாசல்கள் உனக்கு வெளிப்படுத்தப்பட்டனவா? ஆழ்ந்த இருளின் வாசல்களை நீ கண்டிருக்கிறாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆழ்ந்த இருள்” என்பதற்கு “மரண நிழல்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கடும் இருளை அல்லது பொதுவான இருண்ட மந்தநிலையைக் குறிக்கவும் পারে.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ
  choice: வெளிப்படுத்தப்பட்டனவா?
  rationale: வினா இடைச்சொல்லையும் גלה என்பதன் நிஃபால் நிறைவுவினைச் செயலப்பாட்டு வடிவையும் காக்கிறது; கடவுள் கேட்கும் சொல்லாட்சிக் கேள்வியாக இயல்பாக ஒலிக்கிறது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் முன்னிடைச்சொல், உரையாடப்படுபவரை நேரடியாகக் குறிக்கிறது.
- source_word: שַׁעֲרֵי מָוֶת
  choice: மரணத்தின் வாசல்கள்
  rationale: எபிரெயக் கூட்டிணைப்பை நேரடியாகக் காத்து, மரணத்தின் ஆளுகைக்குரிய உலகின் தெளிவான வாசல் உருவகத்தையும் நிலைநிறுத்துகிறது.
- source_word: וְ/שַׁעֲרֵי
  choice: வாசல்களை
  rationale: וְ-ஐ தனியாக ‘அல்லது’ என விரிவாக்காமல், இணையான இரண்டாம் சொல்லாட்சிக் கேள்வியாகத் தமிழில் அமைத்துள்ளோம். இரண்டு கேள்விகளின் தொடரே அதன் இணைப்புப் பொருளை இயல்பாக உணர்த்துகிறது.
- source_word: צַלְמָוֶת
  choice: ஆழிருள்
  rationale: இந்தச் சொல் பொதுவாகக் கடும் இருள் அல்லது காரிருளைக் குறிக்கலாம்; மரணத்துடனான பாரம்பரியத் தொடர்பை மட்டும் கட்டாயப்படுத்தாமல் சூழலின் அச்சமூட்டும் பாதாளச் சாயலைக் காக்கிறது.
- source_word: תִּרְאֶה
  choice: நீ கண்டிருக்கிறாயா?
  rationale: கால் நிறைவுறா வினை இங்குள்ள கவிதைநடைக் கேள்வியில் அனுபவத்தை விசாரிக்கிறது; முதல் கேள்விக்கு இணையாகத் தமிழில் நிறைவுற்ற அனுபவ வினாவாக இயல்பாக வருகிறது.
theological_decisions:
- issue: צַלְמָוֶת என்பதன் பொருள்
  choice: ஆழிருள்
  alternative: மரண நிழல்
  rationale: சொல்லை மரணத்தை நேரடியாகக் குறிக்கும் இறையியல் உருவகமாக மட்டும் சுருக்காமல், அதன் பரந்த அகராதிப் பொருளான கடும் இருளை முதன்மைப்படுத்துகிறோம்; பாரம்பரிய மாற்றை அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை. ‘வாசல்கள்’ என்ற உறுதியான உருவகம் காக்கப்பட்டுள்ளது; இரு இணையான சொல்லாட்சிக் கேள்விகளும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
