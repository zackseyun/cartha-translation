  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: ta
  text: அதற்கு என் வரம்பை வகுத்து[a], தாழ்ப்பாளையும் கதவுகளையும் அமைத்து,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கான என் கட்டளையை நிர்ணயித்து.” இங்கு பயன்படுத்தப்பட்ட எபிரெய வினைச்சொல் பொதுவாக “உடைத்தேன்” என்று பொருள்படும்; ஆனால் இச்சூழலில் அது கடலுக்கான வரம்பை நிறுவுவதைக் குறிப்பதாக இருக்கலாம்.
    reason: וָאֶשְׁבֹּר மற்றும் חֻקִּי ஆகியவற்றின் சொற்பொருள் சிக்கலையும் மாற்று மொழிபெயர்ப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: வகுத்து
  rationale: שׁבר என்ற வேர் பொதுவாக ‘உடைத்தல்’ என்று பொருள்படும். ஆனால் இங்கு கடலை அடைக்கும் வரம்பை ஏற்படுத்தும் சூழலில், ‘வகுத்து’ என்பது அதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; மூலத்திலுள்ள சொற்பொருள் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָלָיו
  choice: அதற்கு
  rationale: முந்தைய வசனங்களில் குறிப்பிடப்பட்ட கடலையே 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சுட்டுகிறது. ‘வரம்பை வகுத்து’ என்பதோடு ‘அதற்கு’ என்பது இயல்பான தமிழாகும்.
- source_word: חֻקִּי
  choice: என் வரம்பை
  rationale: חֹק என்பதற்கு சட்டம், கட்டளை, நிர்ணயிக்கப்பட்ட பங்கு, வரம்பு ஆகிய பொருள்கள் உண்டு. கடலைக் கட்டுப்படுத்தும் உடனடிச் சூழலில் ‘வரம்பு’ என்ற திடமான பொருள் பொருத்தமானது; அதேவேளை அது கடவுள் விதித்த நியமம் என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: וָאָשִׂים
  choice: அமைத்தபோது
  rationale: שׂים என்பதன் ‘வைத்தல்/அமைத்தல்’ என்ற நேரடியான பொருளைத் தருகிறது. தொடரிலுள்ள காலச்சார்பை வெளிப்படுத்த ‘அமைத்தபோது’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּרִיחַ
  choice: தாழ்ப்பாளை
  rationale: நுழைவாயிலைப் பாதுகாப்பாக அடைக்கும் bar அல்லது bolt-ஐக் குறிக்கும் எபிரெய ஒருமை வடிவத்தை ‘தாழ்ப்பாளை’ எனத் துல்லியமாக வழங்குகிறது.
- source_word: וּדְלָתָיִם
  choice: கதவுகளை
  rationale: இருமை வடிவம் ஒரு சோடிக் கதவுகளைக் குறிக்கலாம். ‘கதவுகள்’ என்பது அந்த உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: கடல்மீது கடவுள் செலுத்தும் ஆட்சியின் மனிதவடிவச் சித்தரிப்பு
  choice: கடவுள் வரம்பு வகுத்து, தாழ்ப்பாளையும் கதவுகளையும் அமைக்கும் திடமான கட்டட உருவகம் தக்கவைக்கப்பட்டது.
  alternative: இயற்கையின்மீதான கடவுளின் இறையாண்மையைப் பற்றிய அருவமான கூற்றாக உருவகத்தை மாற்றுதல்.
  rationale: எபிரெயக் கவிதை கடவுளின் ஆட்சியைத் தெளிவான கட்டட உருவகத்தால் காட்டுகிறது. அதைத் தக்கவைப்பது கவிதையின் வலிமையையும் இறையியல் பதற்றத்தையும் அளவுக்கு மீறி முறைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபு நூலின் உயர்ந்த கவிதைநடைக்கேற்ற கண்ணியத்துடனும் மொழியாக்கம் செய்யப்பட்டது. முந்தைய வசனத்தோடு தொடரும் சார்பு வாக்கிய அமைப்பைத் தக்கவைக்க இறுதியில் காற்புள்ளி இடப்பட்டுள்ளது.
