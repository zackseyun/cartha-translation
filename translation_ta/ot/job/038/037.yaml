  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: ta
  text: ஞானத்தால் மேகங்களை எண்ணக்கூடியவர் யார்? வானத்தின் குடுவைகளை[a] சாய்க்கக்கூடியவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடுவைகள்’ என்பதற்கான எபிரெயச் சொல் ‘தோல் பைகள்’ என்றும் மொழிபெயர்க்கப்படலாம். வானத்தில் மழையை வைத்திருக்கும் கொள்கலன்களைப் போன்ற கவித்துவ உருவகம் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: இரண்டு கவிதை அடிகளிலும் வரும் வினாப்பெயரைத் தக்கவைத்து, இறைத்திறனை வலியுறுத்தும் சொல்லாட்சிக் கேள்வியாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְסַפֵּר
  choice: எண்ணக்கூடியவர்
  rationale: பியேல் வடிவிலுள்ள ספר இச்சூழலில் மேகங்களை எண்ணுதல் அல்லது கணக்கிடுதல் என்று பொருள்படும்; ‘கூடியவர்’ என்பது கேள்வியின் திறன் சார்ந்த உட்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁחָקִים
  choice: மேகங்கள்
  rationale: சுற்றியுள்ள வசனங்களின் மழை மற்றும் வானிலைச் சூழலில், கவிதை மொழியிலுள்ள இச்சொல்லுக்கு ‘மேகங்கள்’ என்பதே பொருத்தமானது.
- source_word: בְּחָכְמָה
  choice: ஞானத்தால்
  rationale: בְּ முன்னொட்டின் கருவிப் பொருளைத் தக்கவைத்து, ஞானத்தின் மூலமாக அல்லது ஞானத்தைக் கொண்டு என்ற எபிரெய அமைப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: வானத்தின் குடுவைகள்
  rationale: נבל என்பது தோற்பை, குடுவை அல்லது திரவம் வைக்கும் கொள்கலனைக் குறிக்கலாம். ‘குடுவைகள்’ என்பது மழையை வைத்திருக்கும் வானக் கொள்கலன்கள் என்ற உருவகத்தை நவீன வாசகருக்குப் புரியுமாறு தக்கவைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தண்ணீர்’ சேர்க்கப்படவில்லை.
- source_word: יַשְׁכִּיב
  choice: சாய்ப்பவர்
  rationale: שכב என்பதன் ஹிஃபில் வடிவம் சொல்லுக்குச் சொல் ‘படுக்கச் செய்தல்’ எனினும், கொள்கலன்களோடு வரும்போது அவற்றின் உள்ளடக்கம் வெளியேறும்படி சாய்த்தலைக் குறிக்கிறது. ‘சாய்ப்பவர்’ concrete image-ஐப் பாதுகாக்கிறது.
