  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: ta
  text: மழைக்குத் தந்தை உண்டா? அல்லது பனித்துளிகளைப் பிறப்பித்தவர் யார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: மழைக்குத் ... உண்டா?
  rationale: கேள்வித் துகளுடன் வரும் יֵשׁ மற்றும் உறவைக் குறிக்கும் לְ ஆகியவை சேர்ந்து, மழைக்கு ஒருவர் தந்தையாக இருக்கிறாரா என்ற உடைமை சார்ந்த கேள்வியை உருவாக்குகின்றன. தமிழில் ‘மழைக்குத் ... உண்டா?’ என்பது இதை இயல்பாகவும் நெருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אָב
  choice: தந்தை
  rationale: இச்சொல்லின் நேரடிப் பொருள் ‘தந்தை’. அடுத்த அரையடியில் உள்ள பிறப்பித்தல் உருவகத்தோடு இணைந்துள்ள தந்தை உருவகத்தை அப்படியே காக்கிறது.
- source_word: אוֹ מִי
  choice: அல்லது ... யார்?
  rationale: இணையான இரு கேள்விகளை இணைக்கும் எளிய பிரிநிலைச் சொல்லையும் நேரடி வினாப்பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: הוֹלִיד
  choice: பிறப்பித்தவர்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் ஒருவரைப் பிறக்கச் செய்தல் அல்லது உருவாக்குதல் என்ற பொருளைக் கொண்டது. ‘பிறப்பித்தவர்’ என்பது பழமையான நடையைத் தவிர்த்து, பிறப்பின் உருவகத்தையும் செயப்படுபொருளுடனான இலக்கண உறவையும் காக்கிறது.
- source_word: אֶגְלֵי טָל
  choice: பனித்துளிகளை
  rationale: கட்டுநிலையில் வரும் இச்சொற்றொடர் ‘பனியின் துளிகள்’ என்று பொருள்படும். தமிழில் நிலைபெற்ற ‘பனித்துளிகள்’ என்ற கூட்டுச்சொல் கவித்துவப் படிமத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: மழைக்கும் பனித்துளிகளுக்கும் தந்தை அல்லது பிறப்பிப்பவர் இருப்பதாகக் கேட்கும் மனித உருவக மொழி
  choice: தந்தை மற்றும் பிறப்பித்தவர் என்ற இரு பிறப்பு உருவகங்களையும் தக்கவைத்தல்
  alternative: ‘மூலம்’ அல்லது ‘உண்டாக்கியவர்’ என்று உருவகத்தை விளக்கிவிடுதல்
  rationale: எபிரெயக் கவிதை இயற்கை நிகழ்வுகளின் ஆதாரம் குறித்து மனிதப் பிறப்பைச் சார்ந்த உருவகத்தில் கேட்கிறது. அதை பொதுவான படைப்புச் சொல்லாக மாற்றாமல் வைத்திருப்பது மூலத்தின் கவித்துவத்தையும் கேள்வியின் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கவித்துவ மரியாதை கொண்ட நடை. எபிரெய வசனத்தின் இரண்டு இணைக் கேள்விகளும் தனித்தனியாகத் தெளிவாக நிற்குமாறு கேள்விக்குறிகள் பயன்படுத்தப்பட்டுள்ளன.
