  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கவித்துவமும் எளிமையும் கலந்த நடை. எபிரெயத்தின் இலக்கணப் பன்மையையும் வெளிப்படாத எழுவாயையும் வாசிப்பிற்கு ஏற்றவாறு உரையில் தெளிவாக்கி, அதன் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
