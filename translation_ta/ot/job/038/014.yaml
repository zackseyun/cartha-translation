  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: ta
  text: முத்திரையால் பதிக்கப்படும் களிமண்போல பூமி உருமாறுகிறது[a]; அவை ஆடையைப்போல வெளிப்பட்டு நிற்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முத்திரையின் கீழுள்ள களிமண்போல அது மாறுகிறது.” எபிரெய வினைச்சொல்லை இன்னும் சொற்சார்பாக “தன்னைத்தானே மாற்றிக்கொள்கிறது” அல்லது “மாற்றப்படுகிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வெளிப்பட்டு நிற்கின்றன” என்ற பன்மை வினையின் எழுவாய் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. விடியலின் வெளிச்சத்தில் தெளிவாகும் பூமியின் கூறுகளை இது குறிக்கக்கூடும்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: உருமாறுகிறது
  rationale: הפך என்பதன் ஹித்பயேல் வடிவம் திரும்புதல் அல்லது மாற்றமடைதல் என்ற இடைநிலை/தற்சார்பு நுணுக்கத்தைக் கொண்டுள்ளது. விடியலில் பூமியின் தோற்றம் மாறுவதை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: כְּחֹמֶר חוֹתָם
  choice: முத்திரையால் பதிக்கப்படும் களிமண்போல
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானது; முத்திரையின் அழுத்தத்தால் களிமண் வடிவம் பெறும் உவமையைத் தமிழில் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் வெளிப்படுத்துகிறது.
- source_word: וְיִתְיַצְּבוּ
  choice: தெளிவாகத் தோன்றுகின்றன
  rationale: பன்மை வினைச்சொல் நேரடியாக ‘அவை நிலைநிற்கின்றன/முன்வருகின்றன’ எனப் பொருள்படலாம். சூழலில் விடியலால் பூமியின் வடிவங்கள் புலப்படுவதை இந்தத் தேர்வு இயல்பான தமிழில் எடுத்துரைக்கிறது; விளக்கமாகச் சேர்க்கப்பட்ட எழுவாய் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: כְּמוֹ לְבוּשׁ
  choice: ஆடையின் மடிப்புகளைப்போல்
  rationale: לְבוּשׁ என்பது ஆடை. ஒப்புமையின் காட்சியைத் தமிழில் புரியச்செய்ய ‘மடிப்புகள்’ சேர்க்கப்பட்டுள்ளது; இது பூமியின் மேடு பள்ளங்கள் வெளிச்சத்தில் தெளிவுறும் காட்சியை உணர்த்துகிறது.
