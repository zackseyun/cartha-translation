  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: ta
  text: அதன் அளவுகளை நிர்ணயித்தவர் யார்—உனக்குத் தெரிந்தால்—அல்லது அதன்மேல் அளவுநூலை நீட்டியவர் யார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: இறைவனின் சொல்லாட்சிக்குரிய வினாவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்தும் வினாப்பெயர்.
- source_word: שָׂם
  choice: நிர்ணயித்தவர்
  rationale: שׂים என்பதன் ‘அமைத்தல்/நிலைப்படுத்துதல்’ என்ற பொருளை, பூமியின் கட்டுமான உருவகத்தில் அளவுகளைத் தீர்மானித்தல் என இயல்பாகக் காட்டுகிறது.
- source_word: מְמַדֶּיהָ
  choice: அதன் அளவுகளை
  rationale: பெண்பால் ஒருமை பின்னொட்டு சூழலில் பூமியைக் குறிக்கிறது; பன்மை வடிவம் அதன் அளவுகள் அல்லது பரிமாணங்களைக் குறிக்கிறது.
- source_word: כִּי תֵדָע
  choice: உனக்குத் தெரிந்தால் சொல்
  rationale: இங்கு உள்ள சவாலான, நையாண்டித் தொனியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘சொல்’ என்பது தமிழில் நிபந்தனைச் சவாலை முழுமைப்படுத்தும் மறைபொருள் நிரப்பு.
- source_word: אוֹ
  choice: அல்லது
  rationale: இணையான இரண்டு வினாக்களை இணைக்கும் பிரிநிலை இடைச்சொல்.
- source_word: נָטָה
  choice: நீட்டியவர்
  rationale: கட்டுமானப் பின்னணியில் அளவுநூலை இழுத்து நீட்டும் செயலைத் துல்லியமாகக் காட்டுகிறது.
- source_word: עָלֶיהָ
  choice: அதன்மேல்
  rationale: பெண்பால் பின்னொட்டு பூமியைக் குறிக்கிறது; עַל என்பதன் இடஞ்சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: קָּו
  choice: அளவுநூலை
  rationale: கட்டுமானச் சூழலில் அளவிடுவதற்காக நீட்டப்படும் நூல் அல்லது கயிற்றைக் குறிக்கிறது; ‘அளவுநூல்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: כִּי תֵדָע என்பதன் நையாண்டி அல்லது நிபந்தனைத் தொனி
  choice: உனக்குத் தெரிந்தால் சொல்
  alternative: உனக்குத் தெரியும் அல்லவா
  rationale: எபிரெயச் சொற்றொடர் காரணவியல், உறுதிப்பாடு அல்லது சூழலால் நிபந்தனைச் சவால் எனப் புரிந்துகொள்ளப்படலாம். கடவுள் யோபுவின் அறிவின் எல்லையை வெளிப்படுத்தும் சூழலில் நிபந்தனை வடிவம் நையாண்டியை உணர்த்தினாலும், யோபு உண்மையில் அறிவான் என்று உரை தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், இறைவனின் கம்பீரமான சவால் தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. கட்டுமான உருவகத்தைத் தெளிவாக்க ‘அளவுநூல்’ பயன்படுத்தப்பட்டது; மிகப் பழமையான அல்லது வட்டாரச் சொற்கள் தவிர்க்கப்பட்டன.
