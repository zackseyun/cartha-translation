translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஆனால் கண்ணியமான இறைவாக்குப் பாணி பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான வினாக்களிலும் ‘உன்னால் முடியுமா?’ என்று கூறி எபிரெயின் சொல்லாட்சிசார் வினாவையும் கவிதை இணைப்பையும் தெளிவாக வைத்துள்ளது. உறுதியற்ற இரு வானியல் பெயர்களும் ஒலிபெயர்க்கப்பட்டு, விளக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
