  text: הֲ/תֹצִ֣יא מַזָּר֣וֹת בְּ/עִתּ֑/וֹ וְ֝/עַ֗יִשׁ עַל בָּנֶ֥י/הָ תַנְחֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: ta
  text: மஸ்ஸாரோத்தை[a] அதற்குரிய காலத்தில் வெளிவரச் செய்ய உன்னால் முடியுமா? ஆயிஷை[b] அவளுடைய பிள்ளைகளோடு வழிநடத்த உன்னால் முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மஸ்ஸாரோத்” என்பது அரிதாக வரும் ஓர் எபிரெய வானியல் சொல்; இது விண்மீன் கூட்டங்களையோ இராசி மண்டலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆயிஷ்” என்பது ஓர் எபிரெய விண்மீன் பெயர் அல்லது விண்மீன் கூட்டப் பெயர். சில மொழிபெயர்ப்புகளில் பாரம்பரியமாக இது “ஆர்க்டூரஸ்” என்று வழங்கப்படுகிறது; பலர் இதை “கரடி விண்மீன் கூட்டம்” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: வெளிவரச் செய்ய உன்னால் முடியுமா?
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது. வானிலுள்ள விண்மீன் கூட்டத்தைத் தோன்றச் செய்வதைக் குறிக்கும் வினாவாக இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַזָּרוֹת
  choice: மஸ்ஸாரோத்
  rationale: இது அரிதாக வரும், துல்லியமான பொருள் உறுதியாகத் தெரியாத வானியல் சொல். தவறான துல்லியத்தைத் தவிர்க்க எபிரெயப் பெயர் ஒலிபெயர்க்கப்பட்டு, சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: בְּעִתּוֹ
  choice: அதற்குரிய காலத்தில்
  rationale: அது தோன்றுவதற்கான உரிய அல்லது நியமிக்கப்பட்ட காலத்தைச் சுட்டுகிறது; வானியல் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: וְעַיִשׁ
  choice: ஆயிஷ்
  rationale: இந்த விண்மீன் அல்லது விண்மீன் கூட்டப் பெயரின் அடையாளம் உறுதியற்றது. பாரம்பரிய மொழிபெயர்ப்பின் ஊகத்தை முதன்மை உரையில் திணிக்காமல் எபிரெயப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: עַל בָּנֶיהָ
  choice: அவளுடைய பிள்ளைகளோடு
  rationale: எபிரெயில் உள்ள பெண்பால் உருவகத்தையும் ‘பிள்ளைகள்’ என்ற குடும்ப உருவகத்தையும் பாதுகாக்கிறது; இவை உடன் காணப்படும் விண்மீன்களைக் குறிக்கக்கூடும்.
- source_word: תַנְחֵם
  choice: வழிநடத்த
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் ‘வழிநடத்து’ அல்லது ‘அழைத்துச் செல்’ என்று பொருள்படும். வானில் ஒரு விண்மீன் கூட்டத்தை நடத்தும் உருவகத்திற்கு ‘வழிநடத்த’ பொருத்தமானது.
