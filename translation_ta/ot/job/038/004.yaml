base_translation:
  language: en
  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: ta
  text: நான் பூமியை நிறுவியபோது[a] நீ எங்கே இருந்தாய்? உனக்குப் புரிதல் இருந்தால், சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பூமிக்கு அடித்தளம் அமைத்தபோது.”
    reason: יסד என்பதன் கட்டடக்கலை சார்ந்த உருவகத்தை இன்னும் வெளிப்படையாகத் தரும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: אֵיפֹה
  choice: எங்கே
  rationale: இடத்தை வினவும் எளிய வினையடை; கடவுளின் நேரடியான சவாலை இயல்பான தமிழில் காக்கிறது.
- source_word: הָיִיתָ
  choice: நீ ... இருந்தாய்
  rationale: היה என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை இறந்தகால வடிவத்தைத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: בְּיָסְדִי
  choice: நான் ... நிறுவியபோது
  rationale: בְּ + வினையெச்சப் பெயர் + முதலாம் நபர் ஒருமை பின்னொட்டு ஆகியவை ‘நான் நிறுவியபோது’ என்ற காலப்பொருளைத் தருகின்றன. יסד-இன் நிறுவுதல்/அடித்தளம் இடுதல் என்ற உருவகத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: אָרֶץ
  choice: பூமியை
  rationale: படைப்பைப் பற்றிய இவ்வண்டச் சூழலில் இது குறிப்பிட்ட நிலப்பகுதியை அல்ல, பூமியையே குறிக்கிறது.
- source_word: הַגֵּד
  choice: சொல்
  rationale: נגד என்பதன் கட்டளை வடிவம் அறிவிக்க அல்லது சொல்லும்படி கோருகிறது; ‘சொல்’ நேரடியான சவாலின் தொனியைத் தக்கவைக்கிறது.
- source_word: אִם
  choice: இருந்தால்
  rationale: நிபந்தனைச் சவாலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדַעְתָּ
  choice: உனக்கு ... இருந்தால்
  rationale: எபிரெயத்தில் முற்றுவினையாக இருந்தாலும், இங்கு நிகழ்நிலைத் திறனையோ அறிவையோ சவாலாகக் கேட்கும் நிபந்தனை; தமிழில் உடைமைத் தொடராக இயல்பாக வருகிறது.
- source_word: בִינָה
  choice: புரிந்துணர்வு
  rationale: ஞான இலக்கியச் சூழலில் ‘understanding/discernment’ என்ற கருத்தைத் தெளிவாகவும் செம்மையாகவும் தருகிறது.
theological_decisions:
- issue: தெய்வீக உரையில் படைப்பைக் குறிக்கும் יסד என்ற சொல்
  choice: ‘பூமியை நிறுவியபோது’ என்று மொழிபெயர்த்து, அடித்தள உருவகத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘பூமிக்கு அடித்தளம் அமைத்தபோது’
  rationale: கடவுள் பூமியை நிலைபெறச் செய்த படைப்பாளி என்ற உரையின் வெளிப்படையான கூற்றை இது காக்கிறது. அதேவேளை, கட்டடக்கலை சார்ந்த மூல உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் நேரடியான, கண்ணியமான தெய்வீகச் சவால். ‘புரிந்துணர்வு’ என்பது ஞான இலக்கியத் தொனியைத் தக்கவைக்கிறது; தேவையற்ற சமயக்குழுச் சார்பான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
