source:
  edition: WLC
  text: עַל מָ֭ה אֲדָנֶ֣י/הָ הָטְבָּ֑עוּ א֥וֹ מִֽי יָ֝רָ֗ה אֶ֣בֶן פִּנָּתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: ta
  text: அதன் அடிப்பீடங்கள் எதன்மேல் ஆழப் பதிக்கப்பட்டன[a]? அல்லது அதன் மூலைக்கல்லை வைத்தவர் யார்[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் அடித்தளங்கள்’ அல்லது ‘அதன் பொருத்துப் பீடங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கட்டுமானத்தைத் தாங்கும் அடிப்பகுதிகள் அல்லது அடித்தளப் பீடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதன் மூலையின் கல்லை வீசியவர் யார்?’ கட்டுமானச் சூழலில் இது மூலைக்கல்லை அதன் இடத்தில் வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: எதன்மேல்
  rationale: அடித்தள ஆதாரம் எது என்று கேட்கும் எபிரெயக் கேள்வியை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲדָנֶיהָ
  choice: அதன் அடிப்பீடங்கள்
  rationale: אֶדֶן என்பது கட்டுமானத்தின் பீடம், தாங்கும் அடிப்பகுதி அல்லது பொருத்துக் குழி ஆகியவற்றைக் குறிக்கலாம். பூமியைக் கட்டடமாகச் சித்தரிக்கும் உருவகத்தில் ‘அடிப்பீடங்கள்’ என்ற பன்மை, உறுதியான கட்டுமானப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: הָטְבָּעוּ
  choice: ஆழப் பதிக்கப்பட்டன
  rationale: טבע என்பதன் ஹொஃபால் வடிவம் ஆழச் செய்யப்படுதல் அல்லது அமிழ்த்திப் பதிக்கப்படுதல் என்ற செயலற்ற பொருளைக் கொண்டது. ‘ஆழப் பதிக்கப்பட்டன’ என்பது அந்த வலுவான படிமத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: இரண்டு சொல்லாட்சிக் கேள்விகளை இணைக்கும் எளிய பிரிநிலை இணைப்புச் சொல்.
- source_word: מִי
  choice: யார்
  rationale: இரண்டாம் கேள்வியை அறிமுகப்படுத்தும் நேரடியான வினாப்பெயர்.
- source_word: יָרָה
  choice: வைத்தவர்
  rationale: யָרָה என்பதற்கு நேரடியாக ‘எறிதல்/வீசுதல்’ என்று பொருள் வரலாம்; ஆனால் கட்டுமானச் சூழலில் மூலைக்கல்லை அதன் இடத்தில் வைத்தல் என்ற கருத்தை ‘வைத்தவர்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: அதன் மூலைக்கல்
  rationale: சொல்லுக்கு சொல் ‘அதன் மூலையின் கல்.’ ‘மூலைக்கல்’ என்பது கட்டுமான உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் பாதுகாக்கும் வழக்கமான தமிழ் சொல்; பெண்பால் ஒருமை பின்னொட்டு சூழலில் பூமியைக் குறிக்கும் ‘அதன்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: பூமியின் படைப்பைக் கட்டுமானமாகச் சித்தரிக்கும் உருவகம்
  choice: அடிப்பீடங்கள், மூலைக்கல் ஆகிய கட்டுமானப் படிமங்களை அப்படியே தக்கவைத்தல்
  alternative: ‘பூமையைத் தாங்குவது எது?’ என்று உருவகத்தைப் பொதுவான கருத்தாக மாற்றுதல்
  rationale: இது யோபிடம் கடவுள் தொடுக்கும் கவித்துவமான சொல்லாட்சிக் கேள்வியின் ஒரு பகுதி. கட்டுமான உருவகத்தைத் தக்கவைப்பது எபிரெயக் கவிதையின் அழுத்தத்தைப் பாதுகாத்து, நவீன அறிவியல் விளக்கத்தையோ தேவையற்ற இறையியல் விரிவாக்கத்தையோ உரைக்குள் கொண்டுவராமல் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆழப் பதிக்கப்பட்டன’ என்பது எபிரெய வினையின் செயலற்ற வடிவத்தையும் அமிழ்த்தும் படிமத்தையும் காக்கிறது; ‘மூலைக்கல்’ இயல்பான கட்டுமானச் சொல்லாக உள்ளது.
