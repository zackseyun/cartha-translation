  text: וָ/אֹמַ֗ר עַד פֹּ֣ה תָ֭בוֹא וְ/לֹ֣א תֹסִ֑יף וּ/פֹ֥א יָ֝שִׁ֗ית בִּ/גְא֥וֹן גַּלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/011.yaml
  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: ta
  text: நான், “இவ்வளவு வரை நீ வரலாம்; இதற்கு அப்பால் வரக்கூடாது. இங்கே உன் பெருமிதமான அலைகள் நிறுத்தப்படும்[a]” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இங்கே உன் அலைகளின் பெருமிதம் வைக்கப்படும்/நிலைநிறுத்தப்படும்.” எபிரெய வினை சொல்லடியாக ‘வைத்தல், நிலைநிறுத்துதல்’ என்று பொருள்படும்; அது மூன்றாம் நபர் செயப்பாட்டு வடிவத்தில் உள்ளது. கடலின் பொங்கி எழும் அலைகள் தடுத்து நிறுத்தப்படும் எல்லையை இவ்வரி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: அப்போது நான் … என்றேன்
  rationale: אמר என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம் தெய்வீக உரையின் தொடர் நிகழ்வைச் சுட்டுகிறது; தமிழில் ‘அப்போது … என்றேன்’ என்பது அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד פֹּה
  choice: இதுவரை
  rationale: எல்லையைக் குறிக்கும் עַד மற்றும் இடச்சுட்டான פֹּה இணைந்து கடல் வர அனுமதிக்கப்பட்ட வரம்பைக் காட்டுகின்றன.
- source_word: תָבוֹא
  choice: நீ வரலாம்
  rationale: ஆண்பால் ஒருமை இரண்டாம் நபர் வடிவத்தில் கடல் நேரடியாக அழைக்கப்படுகிறது; விதிக்கப்பட்ட எல்லைக்குள் அனுமதியைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְלֹא תֹסִיף
  choice: இதற்கு அப்பால் வரக்கூடாது
  rationale: יסף என்பதன் Hiphil வடிவம் ‘மேலும் தொடருதல்’ என்ற கருத்தைத் தருகிறது; எல்லை விதிக்கும் சூழலில் இத்தமிழாக்கம் தடைப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וּפֹא
  choice: இங்கே
  rationale: மீண்டும் வரும் இடச்சுட்டு, அலைகள் கட்டுப்படுத்தப்படும் துல்லியமான எல்லையை வலியுறுத்துகிறது.
- source_word: יָשִׁית
  choice: நிறுத்தப்படும்
  rationale: שׁית என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/நிறுவுதல்’; இச்சூழலில் அலைகளுக்கான எல்லை நிலைநிறுத்தப்பட்டு அவை தடுக்கப்படுவதை ‘நிறுத்தப்படும்’ இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் வடிவவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִּגְאוֹן
  choice: பெருமிதமான
  rationale: גאון என்பது பெருமை, மேன்மை அல்லது செருக்கான எழுச்சியைக் குறிக்கலாம்; கடலின் பொங்கி எழும் அலைகளை மனிதப்பண்பேற்றும் சூழலில் ‘பெருமிதமான’ பொருத்தமானது.
- source_word: גַּלֶּיךָ
  choice: உன் … அலைகள்
  rationale: ஆண்பால் ஒருமை இரண்டாம் நபர் பின்னொட்டுடன் வரும் பன்மைச் சொல் கடலின் அலைகளைக் குறிக்கிறது; கடலிடம் பேசும் மனிதப்பண்பேற்றலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வீக கட்டளைக்குக் கீழுள்ள கடலின் மனிதப்பண்பேற்றம்
  choice: கடலை ‘நீ’ என்று நேரடியாக அழைக்கும் வடிவத்தையும் அதற்கு எல்லை விதிக்கும் மொழியையும் தக்கவைத்தல்
  alternative: கடலை முற்றிலும் உயிரற்ற இயற்கைச் சக்தியாக மாற்றிக் கூறுதல்
  rationale: எபிரெய உரை கடலை இரண்டாம் நபரில் நேரடியாக அழைக்கிறது. இது படைப்பின் மீது கடவுளுக்குள்ள அதிகாரத்தை வலியுறுத்தும் கவித்துவ மனிதப்பண்பேற்றம்; கடலைத் தனித்த தெய்வமாகவோ சுயாதீன அண்ட எதிரியாகவோ காட்டுவதில்லை.
- issue: יָשִׁית என்ற வினையின் இலக்கண மற்றும் பொருள் தெளிவின்மை
  choice: முதன்மை உரையில் சூழலுக்கேற்ற ‘நிறுத்தப்படும்’ என்பதையும், அடிக்குறிப்பில் சொல்லடியான ‘வைக்கப்படும்/நிலைநிறுத்தப்படும்’ வாய்ப்பையும் வழங்குதல்
  alternative: ‘அவன் வைப்பான்’ என்று குறிப்பிடப்படாத எழுவாயைத் தெளிவாகச் சேர்த்தல்
  rationale: மூலத்தில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், இவ்வரியின் வாக்கிய அமைப்பும் கவித்துவப் பயன்பாடும் பலவாறு புரிந்துகொள்ளப்படுகின்றன. குறிப்பிடப்படாத எழுவாயை இறையியல் நோக்கில் நிரப்பாமல், சூழலின் எல்லைநிறுத்தும் கருத்தையும் உண்மையான சொற்பொருள் மாறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவித்துவ உரை. ‘நீ’ மற்றும் ‘உன்’ என்பவை கடலிடம் பேசும் மூலத்தின் மனிதப்பண்பேற்றலைத் தக்கவைக்கின்றன; மிகப் பழமையான சொற்களும் தேவையற்ற சமய மரபுச் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
