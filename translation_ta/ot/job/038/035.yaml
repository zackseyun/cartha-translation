  text: הַֽ/תְשַׁלַּ֣ח בְּרָקִ֣ים וְ/יֵלֵ֑כוּ וְ/יֹאמְר֖וּ לְ/ךָ֣ הִנֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: ta
  text: மின்னல்களை[a] நீ அனுப்பி, அவை சென்று உன்னிடம், “இதோ, நாங்கள் இருக்கிறோம்!” என்று சொல்லும்படி செய்ய முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மின்னல் கீற்றுகளை.” எபிரெயத்தில் இச்சொல் பன்மையில் உள்ளது; மின்னல்கள் கீழ்ப்படிந்து செல்லும் தூதர்களைப் போலச் சித்தரிக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: நீ அனுப்ப முடியுமா?
  rationale: வினாவிடைத் துகளும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினைவடிவமும் யோபுவின் ஆற்றலைச் சவாலிடும் சொல்லாட்சியை உருவாக்குகின்றன. ‘அனுப்ப முடியுமா?’ என்பது அந்த வினாவையும் உட்பொருளான ஆற்றல் குறித்த சவாலையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּרָקִים
  choice: மின்னல்களை
  rationale: பன்மை வடிவத்தைத் தக்கவைத்து, தொடர்ந்து வரும் ‘சென்று’, ‘சொல்லும்’ என்ற ஆளுருவகச் சித்தரிப்புக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיֵלֵכוּ
  choice: அவை சென்று
  rationale: அனுப்பப்பட்ட மின்னல்கள் செல்வதாகக் கூறும் தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அவை’ என்பது பன்மையையும் ஆளுருவகத்தையும் தெளிவாக்குகிறது.
- source_word: וְיֹאמְרוּ
  choice: சொல்லுமா?
  rationale: மின்னல்கள் கீழ்ப்படிகிற தூதர்களைப் போலப் பேசுவதாகக் காட்டும் கவித்துவ ஆளுருவகத்தைத் தக்கவைக்கிறது. வாக்கியத்தின் வினாத்தன்மை இந்த இறுதி வினையிலும் தொடர்கிறது.
- source_word: לְךָ
  choice: உன்னிடம்
  rationale: யோபு என்ற ஒருமை முன்னிலையை நோக்கிய எளிய வேற்றுமைப் பொருளை நவீனத் தமிழில் நேராக வழங்குகிறது.
- source_word: הִנֵּנוּ
  choice: இதோ, நாங்கள்!
  rationale: உடனிருப்பையும் கட்டளைக்குக் காத்திருக்கும் ஆயத்த நிலையையும் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: இறைவனின் உரையில் மின்னல்களின் ஆளுருவகம்
  choice: மின்னல்கள் ‘சென்று’, ‘இதோ, நாங்கள்!’ என்று ‘சொல்வதாக’ உள்ள ஆளுருவகத்தைத் தக்கவைத்தல்
  alternative: இயற்கை நிகழ்வுகள் இறைவனின் கட்டுப்பாட்டில் இருப்பதாக மட்டும் ஆளுருவகமின்றி விளக்குதல்
  rationale: எபிரெய உரை மின்னல்களுக்குச் செல்லுதலையும் பேசுதலையும் நேரடியாகக் கற்பிக்கிறது. இது படைப்பின்மேல் இறைவனுக்குள்ள கட்டளையதிகாரத்தை வெளிப்படுத்தும் கவித்துவச் சித்தரிப்பு; இதைத் தக்கவைப்பது மின்னல்களுக்கு உண்மையான உணர்வுண்டு என்று தீர்மானிப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், தெய்வீக உரைக்கேற்ற கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் எளிமையுடனும் அமைக்கப்பட்டுள்ளது. இரண்டு தொடர்ச்சியான வினாக்கள், எபிரெயத்தின் ஒரே சொல்லாட்சியில் உள்ள சவாலையும் மின்னல்களின் ஆளுருவகச் செயல்தொடரையும் தமிழில் இயல்பாக வெளிப்படுத்துகின்றன.
