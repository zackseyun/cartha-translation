source:
  edition: WLC
  text: הַֽ֭/תְקַשֵּׁר מַעֲדַנּ֣וֹת כִּימָ֑ה אֽוֹ מֹשְׁכ֖וֹת כְּסִ֣יל תְּפַתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: ta
  text: கார்த்திகை நட்சத்திரக் கூட்டத்தின் சங்கிலிகளை[a][b] உன்னால் பிணைக்க முடியுமா? அல்லது ஓரியனின்[c] கயிறுகளை உன்னால் தளர்த்த முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சங்கிலிகள்’ என்பதற்குப் பதிலாக ‘கட்டுகள்’ அல்லது ‘பிணைப்புகள்’ என்றும் மொழிபெயர்க்கலாம்; இரண்டு அரையடிகளிலும் வானிலுள்ள பிணைப்புகள் அல்லது தொடர்புகளைக் குறிக்கும் உருவகங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: מַעֲדַנּוֹת என்ற எபிரெயச் சொல் பழைய மொழிபெயர்ப்பு மரபில் சில நேரங்களில் ‘இனிய செல்வாக்குகள்’ என்று பொருள்கொள்ளப்பட்டது; ஆனால் ‘பிணைப்புகள்,’ ‘கட்டுகள்’ அல்லது ‘சங்கிலிகள்’ என்பதே அதிக சாத்தியமான பொருள்.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל என்பது இங்கு பெரும்பாலும் ஓரியன் நட்சத்திரக் கூட்டத்தைக் குறிக்கிறது; பொதுப் பெயராக இதே சொல் ‘மூடன்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: உன்னால் பிணைக்க முடியுமா
  rationale: கேள்வியிடைச்சொல்லுடன் வரும் பியேல் வினை, மனிதனால் இதைச் செய்ய முடியுமா என்ற வினாவை எழுப்புகிறது. ‘பிணைக்க’ என்பது வானியல் கட்டுப்பாட்டின் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: מַעֲדַנּוֹת
  choice: சங்கிலிகளை
  rationale: இந்த அரிய பன்மைப் பெயர்ச்சொல் பிணைப்புகள், கட்டுகள் அல்லது சங்கிலிகள் என்ற பொருளைக் குறிக்கலாம். இணையான அரையடியில் வரும் ‘கயிறுகள்’ என்பதோடும் ‘பிணைக்க’ என்ற வினையோடும் ‘சங்கிலிகள்’ நன்றாகப் பொருந்துகிறது.
- source_word: כִּימָה
  choice: கார்த்திகை நட்சத்திரக் கூட்டம்
  rationale: இந்த வானியல் பெயர் பொதுவாக Pleiades நட்சத்திரக் கூட்டத்தைக் குறிக்கிறது; தமிழில் பரவலாக அறியப்படும் வானியல் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֹשְׁכוֹת
  choice: கயிறுகளை
  rationale: இழுப்பதற்குப் பயன்படும் நீண்ட பிணைப்புகள் அல்லது கயிறுகள் என்ற கருத்தை இச்சொல் தருகிறது. ‘கயிறுகள்’ என்பது உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כְּסִיל
  choice: ஓரியன்
  rationale: வானியல் சூழலிலும் כִּימָה என்பதற்கு இணையாகவும் வருவதால், இது ஓரியன் நட்சத்திரக் கூட்டத்தைக் குறிக்கும் பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: תְּפַתֵּחַ
  choice: தளர்த்த முடியுமா
  rationale: அடிப்படைப் பொருள் ‘திற’ என்பதாக இருந்தாலும், கயிறுகளைப் பற்றிய சூழலில் ‘தளர்த்த’ என்பது இயல்பான பொருள்; இது முதல் அரையடியின் ‘பிணைக்க’ என்பதற்கு எதிரிணையாகவும் அமைகிறது.
