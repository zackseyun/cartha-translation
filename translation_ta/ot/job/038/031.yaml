translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் புரியும் வகையில் கண்ணியமான நேரடி கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் ஆண்பால் ஒருமையைத் தமிழ் இயல்புக்கு ஏற்ப ‘உன்னால்’ என்று அளித்துள்ளோம். மூலத்தின் வானியல் உருவகமும் அரிய பெயர்ச்சொல்லிலுள்ள பொருள் நிச்சயமின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
