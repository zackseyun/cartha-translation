  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: ta
  text: அல்லது, கடல் கருப்பையிலிருந்து பீறிட்டு வெளிவந்தபோது[a][b], அதைக் கதவுகளால் அடைத்தவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பீறிட்டு’ என்பதற்கு ‘வலிமையுடன் பொங்கிப் புறப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் தீவிரமான வெளிப்பாட்டை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு கடல் கருப்பையிலிருந்து பிறக்கும் குழந்தையாக உருவகப்படுத்தப்படுகிறது; இது படைப்பைப் பற்றிய கவித்துவச் சித்தரிப்பின் தொடர்ச்சியாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: அடைத்தவர்
  rationale: இந்த வினைச்சொல் கடலைத் தடுத்து அடைத்து வைப்பதைக் குறிக்கிறது; கதவுகள் என்ற உருவகத்துடன் ‘அடைத்தார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: בִּדְלָתַיִם
  choice: கதவுகளால்
  rationale: இருமை வடிவிலுள்ள ‘கதவு’ என்ற சொல்லையும், ב முன்னொட்டின் கருவிப்பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יָם
  choice: கடல்
  rationale: படைப்புச் சூழலில் அறியப்பட்ட பிரபஞ்சப் பொருளான கடலைக் குறிக்கிறது; தமிழில் தனி சுட்டிடைச்சொல் தேவையில்லை.
- source_word: בְּגִיחוֹ
  choice: பீறிட்டு
  rationale: גיח வலிமையுடன் திடீரென வெளிப்படும் இயக்கத்தை உணர்த்துகிறது; ‘பீறிட்டு’ அந்தத் தீவிரத்தையும் கவித்துவத்தையும் காக்கிறது.
- source_word: מֵרֶחֶם
  choice: கருப்பையிலிருந்து
  rationale: கடல் பிறக்கும் குழந்தையாகச் சித்தரிக்கப்படும் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: יֵצֵא
  choice: வெளிவந்தபோது
  rationale: ‘வெளியே வந்தது’ என்ற நிறைவுப் பொருளை வெளிப்படுத்துகிறது; முந்தைய வினையின் தீவிரத்துடன் இணைத்து தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: கடலின் பிறப்பைக் குறிக்கும் கவித்துவப் படைப்புருவகம்
  choice: கடல் கருப்பையிலிருந்து பிறப்பதுபோலவும், கடவுள் அதைக் கதவுகளால் அடைப்பதுபோலவும் உள்ள உருவகத்தை அப்படியே வைத்தல்
  alternative: கடவுள் கடலுக்கு எல்லை வகுத்தார் என்று உருவகத்தைச் சுருக்கிக் கூறுதல்
  rationale: எபிரெய உரை படைப்பைத் தெளிவான பிறப்பு மற்றும் கட்டுப்படுத்தல் உருவகங்களால் சித்தரிக்கிறது. அதை அரூபமான கூற்றாக மாற்றாமல் காப்பது உரையின் கவித்துவத் தீவிரத்தையும் இறையியல் பதற்றத்தையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான கவிதைநடை. எபிரெயக் கேள்வி அமைப்பும் கதவு, கருப்பை, பிறப்பு ஆகிய உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன. ‘பீறிட்டு வெளிவந்தபோது’ என்பது בְּגִיחוֹ மற்றும் יֵצֵא ஆகியவற்றின் கூட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
