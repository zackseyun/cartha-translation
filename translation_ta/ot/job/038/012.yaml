source:
  edition: WLC
  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: ta
  text: உன் வாழ்நாளில் எப்போதாவது[a] காலைக்குக் கட்டளையிட்டு, விடியலை அதன் இடத்தை அறியச் செய்திருக்கிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “உன் நாட்களிலிருந்து”; அதாவது, “உன் வாழ்க்கையில் எப்போதாவது” அல்லது “நீ வாழத் தொடங்கியதிலிருந்து எப்போதாவது.”
    reason: cultural_note
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: உன் வாழ்நாளில் எப்போதாவது
  rationale: מן + ‘உன் நாட்கள்’ என்ற எபிரெய வழக்கு, யோபு வாழத் தொடங்கியதிலிருந்து எந்த நேரத்திலாவது இதைச் செய்திருக்கிறானா என்று கேட்கிறது. தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் ‘உன் வாழ்நாளில் எப்போதாவது’ என வழங்கப்பட்டது.
- source_word: צִוִּיתָ
  choice: கட்டளையிட்டு
  rationale: இந்த வினை அதிகாரத்துடன் ஆணையிடுவதைக் குறிக்கிறது; படைப்பின்மேல் கட்டளையிடும் வல்லமையைப் பற்றிய இறைச் சவாலின் வலிமையை இது காக்கிறது.
- source_word: בֹּקֶר
  choice: காலை
  rationale: ‘காலை’ என்பது இங்கு படைப்பின் ஓர் ஆளுருவாக்கப்பட்ட நிகழ்வாக வருகிறது; தமிழில் ‘காலைக்குக் கட்டளையிட்டு’ என்பது கவித்துவத்தையும் இயல்பையும் காக்கிறது.
- source_word: יְדַעְתָּה
  choice: அறியச் செய்திருக்கிறாயா
  rationale: ידע என்பதன் காரணவினை வடிவம் ‘அறியச் செய்’ என்ற பொருளைத் தருகிறது. வெறுமனே ‘அறிந்தாயா’ என்று மொழிபெயர்க்காமல் அதன் காரணவினைப் பொருள் பாதுகாக்கப்பட்டது.
- source_word: שַׁחַר
  choice: விடியல்
  rationale: இது பொழுது புலரும் நேரத்தையோ விடியற்கால ஒளியையோ குறிக்கிறது. இணைவரியில் வரும் ‘காலை’ என்பதிலிருந்து வேறுபாட்டை வைத்திருக்க ‘விடியல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְקוֹמוֹ
  choice: அதன் இடம்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருள் ‘அதன் இடம்.’ ‘நியமிக்கப்பட்ட இடம்’ என்று விளக்கிப் பொருள் சேர்க்காமல் மூலத்தின் சுருக்கமும் திறந்த தன்மையும் காக்கப்பட்டது.
