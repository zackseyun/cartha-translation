translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, ஆனால் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இரு வினாக்களிலும் உள்ள பிறப்பு உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது; ‘பனிக்கட்டி’ மற்றும் ‘உறைபனி’ மூலம் இரு எபிரெயச் சொற்களின் வேறுபாடு காட்டப்பட்டுள்ளது.
