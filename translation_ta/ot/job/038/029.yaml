source:
  edition: WLC
  text: מִ/בֶּ֣טֶן מִ֭י יָצָ֣א הַ/קָּ֑רַח וּ/כְפֹ֥ר שָׁ֝מַיִם מִ֣י יְלָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: ta
  text: 'யாருடைய கருப்பையிலிருந்து பனிக்கட்டி வெளிவந்தது? வானத்தின் உறைபனியை[a] பெற்றெடுத்தவர் யார்?


    [a] அல்லது, “வானத்தின் வெண்பனியை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்தின் வெண்பனியை.”
    reason: כְּפוֹר என்பது பொதுவான உறைபனியையும் குறிப்பாகத் தரையில் படியும் வெண்மையான பனிப்படிவையும் குறிக்கக்கூடும்; ‘வெண்பனி’ அந்த நுண்ணிய மாற்றுப் பொருளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: யாருடைய கருப்பையிலிருந்து
  rationale: בֶּטֶן என்பதன் நேர்ப்பொருளான ‘கருப்பை’ பிறப்பு உருவகத்தைத் தக்கவைக்கிறது; מִי உடைமை வினாவாக இயல்பான தமிழில் ‘யாருடைய’ என்று வழங்கப்பட்டுள்ளது.
- source_word: יָצָא
  choice: வெளிவந்தது
  rationale: ‘வெளியே வருதல், புறப்படுதல்’ என்ற வினையின் அடிப்படைப் பொருளையும் பிறப்பு உருவகத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַקָּרַח
  choice: பனிக்கட்டி
  rationale: קֶרַח குறிக்கும் ‘ice’ என்பதை உறைபனியிலிருந்து தெளிவாக வேறுபடுத்தும் பொதுவழக்குத் தமிழ் சொல்.
- source_word: וּכְפֹר שָׁמַיִם
  choice: வானத்தின் உறைபனியை
  rationale: כְּפוֹר என்பதற்கு அணுகத்தக்க ‘உறைபனி’ தேர்ந்தெடுக்கப்பட்டுள்ளது; שָׁמַיִם இங்கு வானம்/வானங்கள் என்ற கவிதைநயமுள்ள விண்வெளிச் சூழலைக் குறிப்பதால் இயல்பான தமிழில் ‘வானத்தின்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְלָדוֹ
  choice: பெற்றெடுத்தவர்
  rationale: ילד என்பதன் ‘பெறுதல், பெற்றெடுத்தல்’ என்ற தாய்மைசார் பிறப்பு உருவகத்தை வெளிப்படையாகத் தக்கவைக்கிறது; ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள் தமிழில் ‘உறைபனியை’ என்ற செயப்படுபொருளால் தெளிவாகிறது.
