  text: לְ֭/הַמְטִיר עַל אֶ֣רֶץ לֹא אִ֑ישׁ מִ֝דְבָּ֗ר לֹא אָדָ֥ם בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/026.yaml
  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: ta
  text: ஒருவரும் இல்லாத நிலத்தின் மேல், மனிதர் எவரும் இல்லாத வனாந்தரத்தில் மழை பெய்யச் செய்வதற்கு,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: மழை பெய்யச் செய்வதற்காக
  rationale: מטר என்பதன் ஹிஃபில் வடிவம் மழையைப் பெய்யச் செய்யும் காரணவினைப் பொருளைத் தருகிறது. தமிழில் ‘மழை பெய்யச் செய்வது’ அந்தப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַל אֶרֶץ
  choice: நிலத்தின்மேல்
  rationale: இங்கு אֶרֶץ என்பது உலகம் முழுவதையும் அல்ல, மழை பெறும் ஒரு நிலப்பரப்பைக் குறிக்கிறது; עַל அதன் மேல் மழை பெய்வதைக் காட்டுகிறது.
- source_word: לֹא אִישׁ
  choice: ஆள் இல்லாத
  rationale: אִישׁ இங்கு ஒருவரும் அங்கு இல்லை என்ற இருப்பின்மையைச் சுட்டுகிறது. ‘ஆள் இல்லாத’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்; அடுத்துவரும் אָדָם என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: מִדְבָּר
  choice: வனாந்தரம்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல், பயிரிடப்படாத, குடியிருப்பற்ற பரந்த வெளியையும் குறிக்கலாம். ‘வனாந்தரம்’ கவிதைநடைக்கு ஏற்றவாறும் பொருளில் பரந்ததாகவும் உள்ளது.
- source_word: לֹא אָדָם בּוֹ
  choice: மனிதர் எவரும் இல்லாத
  rationale: אָדָם இங்கு மனித இனத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர் எவரும் இல்லாத’ என்பது בּוֹ உட்பட அந்த இருப்பின்மையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: אִישׁ மற்றும் אָדָם ஆகிய தொடர்புடைய இரு சொற்களின் வேறுபாடு
  choice: முதலாவதை ‘ஆள்’ என்றும் இரண்டாவதை ‘மனிதர்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘மனிதன்’ அல்லது ‘ஆள்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதையின் இணை அமைப்பைத் தக்கவைத்தபடியே, אִישׁ தனிநபரையும் אָדָם மனிதரைப் பொதுவாகவும் சுட்டும் நுட்பமான வேறுபாட்டைப் பாதுகாக்கிறது. இங்கு எந்தக் குறிப்பிட்ட இறையியல் விளக்கமும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தமிழில் எளிதில் புரியும் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தில் தொடங்கிய கேள்வியின் தொடர்ச்சியான நோக்கவினைத் துணுக்காக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘நிலத்தின்மேலும் … வனாந்தரத்தின்மேலும்’ என்ற இணை அமைப்பு எபிரெயக் கவிதைச் சமநிலையைப் பிரதிபலிக்கிறது.
