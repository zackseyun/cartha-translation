  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲ/תָצ֣וּד לְ/לָבִ֣יא טָ֑רֶף וְ/חַיַּ֖ת כְּפִירִ֣ים תְּמַלֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: ta
  text: சிங்கத்திற்காக[a] இரையை நீ வேட்டையாடுவாயா? இளம் சிங்கங்களின் பசியைத் தீர்ப்பாயா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண் சிங்கத்திற்காக.” எபிரெயச் சொல் ஆண் சிங்கத்தையோ பெண் சிங்கத்தையோ குறிக்கலாம்.
    reason: lexical_ambiguity
  - marker: b
    text: நேரடியாக, “இளம் சிங்கங்களின் உயிரை நிரப்புவாயா?” அதாவது, அவற்றின் பசியை அல்லது உணவுத் தேவையைத் தீர்ப்பாயா?
    reason: idiom_and_lexical_alternative
lexical_decisions:
- source_word: הֲתָצוּד
  choice: நீ வேட்டையாடுவாயா?
  rationale: வினாவிடை உருபான הֲ உடன் வரும் צוד என்ற வினை, யோபை நோக்கிக் கேட்கப்படும் சொல்லாட்சிசார் வினாவைக் குறிக்கிறது. ‘வேட்டையாடு’ என்பது வேட்டையிரைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְלָבִיא
  choice: சிங்கத்திற்காக[a]
  rationale: לָבִיא ஆண் அல்லது பெண் சிங்கத்தைக் குறிக்கக்கூடும்; எபிரெயச் சொல் பாலினத்தைத் தெளிவாக வரையறுக்காததால் முதன்மை உரையில் பொதுவான ‘சிங்கம்’ பயன்படுத்தப்பட்டு, ‘பெண் சிங்கம்’ அடிக்குறிப்பில் தரப்படுகிறது. לְ என்பதன் பயன் ‘-க்காக’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: טָרֶף
  choice: இரையை
  rationale: இந்தச் சொல் மாமிச உண்ணி விலங்கு வேட்டையாடிப் பெறும் இரையைக் குறிக்கிறது; பொதுவான ‘உணவு’ என்பதைக் காட்டிலும் ‘இரை’ அதன் வேட்டைப் பொருளைத் தக்கவைக்கிறது.
- source_word: וְחַיַּת כְּפִירִים
  choice: இளம் சிங்கங்களின் பசியை
  rationale: חַיַּת என்பதன் அடிப்படைப் பொருள் ‘உயிர்/வாழ்வு’; ஆனால் מלא உடன் இங்கு உயிர்வாழத் தேவையான பசி அல்லது உணவுத் தேவையை நிரப்புவது என்ற சொல்லாட்சி உள்ளது. இயல்பான தமிழில் ‘பசி’ அந்தப் பொருளைத் தெளிவாகக் கொடுக்கிறது; நேரடிச் சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תְּמַלֵּא
  choice: தீர்ப்பாயா?
  rationale: מלא என்பதன் அடிப்படைப் பொருள் ‘நிரப்பு’. ‘பசி’ என்பதுடன் தமிழில் ‘பசியைத் தீர்த்தல்’ இயல்பான இணைச்சொல்; ஆகவே பொருள் மாறாமல் வாசிக்க எளிதான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
