  register: நவீனத் தரத் தமிழில், நேரடியாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இரண்டு இணை வினாக்களும் எபிரெய மூலத்தின் சொல்லாட்சிசார் வினா அமைப்பைத் தக்கவைக்கின்றன; பாலினத் தெளிவின்மையும் ‘உயிரை நிரப்புதல்’ என்ற எபிரெயச் சொல்லாட்சியும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
