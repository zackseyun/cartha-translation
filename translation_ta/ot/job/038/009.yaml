  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּ/שׂוּמִ֣/י עָנָ֣ן לְבֻשׁ֑/וֹ וַ֝/עֲרָפֶ֗ל חֲתֻלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/009.yaml
  text: when I made a cloud its garment[a], and thick darkness its swaddling band,
translation:
  language: ta
  text: 'மேகத்தை அதற்கு ஆடையாகவும்,

    காரிருளை அதற்குச் சுற்றுத்துணியாகவும்[a] நான் வைத்தபோது,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, புதிதாகப் பிறந்த குழந்தையைச் சுற்றிப் பொதியும் துணி. சுற்றியுள்ள வசனங்களில் கடலின் பிறப்பைக் குறிக்கும் உருவகம் இங்கும் தொடர்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: நான் வைத்தபோது
  rationale: בְּ + வினையெச்சப் பெயர் மற்றும் முதலாம் நபர் ஒருமை விகுதி இங்கு காலப் பொருளைத் தருகிறது. ‘நான் வைத்தபோது’ என்பது எபிரெயச் சொல்லமைப்பையும் தொடரும் வாக்கிய ஓட்டத்தையும் இயல்பாகக் காக்கிறது.
- source_word: עָנָן
  choice: மேகத்தை
  rationale: עָנָן என்பதன் வழக்கமான பொருள் ‘மேகம்’; செயப்படுபொருளாகத் தமிழில் வேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: לְבֻשׁוֹ
  choice: அதற்கு ஆடையாக
  rationale: לְבוּשׁ என்பது ஆடை அல்லது உடையைக் குறிக்கிறது. பின்னணியில் குறிக்கப்படும் கடலை ‘அது’ என்று சுட்டி, ஆடை உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: וַעֲרָפֶל
  choice: காரிருளை
  rationale: עֲרָפֶל அடர்ந்த, சூழ்ந்த இருளைக் குறிக்கிறது. ‘காரிருள்’ கவிதைநயத்துடனும் நவீன வாசகருக்குப் புரியும் வகையிலும் அதன் செறிவை வெளிப்படுத்துகிறது.
- source_word: חֲתֻלָּתוֹ
  choice: அதற்குச் சுற்றுத்துணியாக
  rationale: இச்சொல் சுற்றிப் பொதிதல், குறிப்பாகப் புதிதாகப் பிறந்த குழந்தையைத் துணியால் சுற்றுதல் என்ற படிமத்தை உடையது. ‘சுற்றுத்துணி’ அந்தப் பிறப்புருவகத்தைச் சுருக்கமாகப் பேணுகிறது; அடிக்குறிப்பு அதன் நுட்பத்தை விளக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் எபிரெய இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘ஆடை / சுற்றுத்துணி’ என்ற இரட்டை உருவகம் தெளிவாகப் பேணப்பட்டுள்ளது; வசனம் அடுத்த தொடருடன் இலக்கண ரீதியாக இணைவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
