  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: ta
  text: பூமியின் அகன்ற பரப்பை நீ ஆராய்ந்து அறிந்திருக்கிறாயா? அதை முழுவதும் நீ அறிந்திருந்தால், சொல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: கூர்ந்து உணர்ந்திருக்கிறாயா
  rationale: בין வேரின் இவ்வடிவம் வெறுமனே பார்ப்பதைவிட கவனித்து உணர்தல் அல்லது புரிந்துகொள்ளுதலைக் குறிக்கிறது; கேள்வியின் சவாலான தொனியும் காக்கப்படுகிறது.
- source_word: עַד רַחֲבֵי אָרֶץ
  choice: பூமியின் பரந்த எல்லைகளை
  rationale: עַד என்பது ‘வரை’ அல்லது ‘எல்லைவரை’ என்ற பரப்புணர்வையும், רַחֲבֵי என்பது பூமியின் அகன்ற விரிவுகளையும் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் இணைத்து வழங்குகிறது.
- source_word: הַגֵּד
  choice: சொல்
  rationale: நேரடியான கட்டளை வடிவத்தையும் சுருக்கமான சவாலையும் காக்கிறது.
- source_word: כֻלָּהּ
  choice: அவை அனைத்தையும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு இலக்கணப்படி ‘பூமி’ அல்லது அதன் முழு விரிவைக் குறிக்கலாம். தமிழில் முன்வந்த ‘பரந்த எல்லைகள்’ என்பதோடு இயல்பாக இணைந்தாலும், முழுமை என்ற கருத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வீகக் கேள்வியின் நோக்கம்
  choice: விடை எதிர்பாராத சவாலான கேள்வியாகவே வைத்தல்
  alternative: யோபுவின் அறியாமையை விளக்கவுரையாக நேரடியாகக் கூறுதல்
  rationale: எபிரெய மூலத்தில் கடவுள் கேள்வியும் கட்டளையும் வழியாக மனித அறிவின் வரம்பை வெளிப்படுத்துகிறார்; மொழிபெயர்ப்பு அந்த உட்பொருளை விளக்கமாகச் சேர்க்காமல் காக்கிறது.
- issue: כֻלָּהּ என்பதன் சுட்டுப்பொருள்
  choice: பூமியின் விரிவுகள் அனைத்தையும் சுட்டும் வகையில் ‘அவை அனைத்தையும்’
  alternative: ‘அதையெல்லாம்’ அல்லது ‘முழுப் பூமியையும்’
  rationale: மூலத்தின் இலக்கணத் தொடர்பில் ஓரளவு நெகிழ்வு உள்ளது. ‘அவை அனைத்தையும்’ என்பது தமிழில் இயல்பாகவும், பூமியின் முழுப் பரப்பை அறிதல் என்ற பொருளைத் தீர்மானமாகச் சுருக்காமலும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், கடவுள் யோபுவிடம் உரைக்கும் கண்ணியமானதாயினும் கூர்மையான ஒருமைச் சவால் தொனி காக்கப்பட்டுள்ளது. தேவையற்ற வடமொழிச் சுமையும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
