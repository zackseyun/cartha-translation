- from: இளைஞர்கள் என்னைக் கண்டதும் ஒதுங்கிக்கொண்டார்கள்[a]; முதியவர்கள் எழுந்து நின்றார்கள்.
  to: இளைஞர்கள் என்னைக் கண்டு ஒதுங்கிக்கொண்டார்கள்[a]; முதியவர்கள் எழுந்து நின்றார்கள்.
  rationale: A minor revision removes the extra ‘immediately upon seeing’ implication of “கண்டதும்,” while retaining the clear, idiomatic Tamil rendering of the Hebrew sequence and the footnoted lexical alternative.
