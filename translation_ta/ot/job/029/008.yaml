  register: நவீன நிலையான தமிழில், கவிதைக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. இளைஞர்களின் ஒதுங்குதலும் முதியவர்களின் எழுந்து நிற்றலும் இணையான மரியாதைச் செயல்களாகத் தெளிவாக வருகின்றன.
