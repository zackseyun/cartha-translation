  text: רָא֣וּ/נִי נְעָרִ֣ים וְ/נֶחְבָּ֑אוּ וִֽ֝/ישִׁישִׁים קָ֣מוּ עָמָֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: ta
  text: இளைஞர்கள் என்னைக் கண்டு ஒதுங்கிக்கொண்டார்கள்[a]; முதியவர்கள் எழுந்து நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களை மறைத்துக்கொண்டார்கள்.” எபிரெய வினை தன்னை மறைத்துக்கொள்வதைக் குறிக்கலாம்; இங்கு யோபுக்கு மரியாதை செலுத்தும் வகையில் அவர்கள் ஒதுங்கியதைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: என்னைக் கண்டதும்
  rationale: ראה என்பதன் இயல்பான பொருள் ‘காணுதல்’. அடுத்த செயல் உடனே நிகழ்ந்ததைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘கண்டதும்’ என வழங்கப்பட்டுள்ளது.
- source_word: נְעָרִים
  choice: இளைஞர்கள்
  rationale: ஆண்பால் பன்மையில் வரும் இச்சொல் இளம் ஆண்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘இளைஞர்கள்’ பொருந்துகிறது.
- source_word: וְנֶחְבָּאוּ
  choice: ஒதுங்கிக்கொண்டார்கள்
  rationale: חבא என்பதன் நிஃபால் வடிவம் அடிப்படையில் ‘தம்மை மறைத்துக்கொள்’ என்று பொருள்படும். இங்குள்ள சமூக மரியாதைச் சூழலில், யோபின் முன்னிலையிலிருந்து விலகி ஒதுங்கிய செயலை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וִישִׁישִׁים
  choice: முதியவர்கள்
  rationale: இச்சொல் வயது முதிர்ந்த ஆண்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது பதவி அல்லது சமூக அலுவலைக் குறிக்கக்கூடும் என்பதால், வயதைத் தெளிவாகக் காட்டும் ‘முதியவர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: קָמוּ עָמָדוּ
  choice: எழுந்து நின்றார்கள்
  rationale: 'இரண்டு எபிரெய வினைகளையும் தனித்த செயல்களாகப் பாதுகாக்கிறது: முதலில் எழுதல், பின்னர் நிற்றல். தமிழிலும் இந்த இணைப்பு சுருக்கமாகவும் இயல்பாகவும் உள்ளது.'
