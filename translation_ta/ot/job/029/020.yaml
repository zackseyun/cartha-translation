  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: ta
  text: 'என் மகிமை என்னுடன் புதுப்பொலிவுடன் இருந்தது[a];

    என் கையில் என் வில் புதுப்பிக்கப்பட்டது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகிமை என்னுடன் புதிதாய் இருந்தது.” எபிரெயப் பெயரடை நேரடியாக “புதிய” என்று பொருள்படலாம்; இச்சூழலில் அது மங்காத புதுப்பொலிவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வில்” என்பது இங்கு வலிமை அல்லது வீரியத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்; முதன்மை உரை எபிரெயத்தின் நேரடியான படிமத்தைக் காக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: என் மகிமை
  rationale: כָּבוֹד என்பது மகிமை, மாண்பு, கௌரவம் ஆகிய பொருள்களைக் கொண்டது. ‘மகிமை’ என்பது எபிரெயச் சொல்லின் விரிந்த கவித்துவப் பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: חָדָשׁ
  choice: புதுப்பொலிவோடு
  rationale: இங்கு இச்சொல் வெறுமனே ‘புதியது’ என்பதைக் காட்டிலும், மங்காமல் புதிதாய் அல்லது செழிப்பாய் நீடிப்பதைச் சூழலில் உணர்த்துகிறது. ‘புதுப்பொலிவோடு’ என்பது அந்தத் தொடர்ந்த புத்துணர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִמָּדִי
  choice: என்னுடன்
  rationale: இதன் நேரடிப் பொருள் ‘என்னுடன்’ என்பதாகும்; யோபின் மகிமை அவரைவிட்டு நீங்காமல் அவரோடு நிலைத்திருப்பதை இது காட்டுகிறது.
- source_word: קַשְׁתִּי
  choice: என் வில்
  rationale: எபிரெயச் சொல் நேரடியாக ‘என் வில்’ எனப் பொருள்படும். இது வலிமையையோ வீரியத்தையோ உருவகப்படுத்தக்கூடும் என்றாலும், மூலத்தின் தெளிவான உருவகம் முதன்மை உரையில் காக்கப்படுகிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயத் தொடரையும், பயன்படுத்தத் தயாராக இருக்கும் வலிமை என்ற கவித்துவப் படிமத்தையும் இது இயல்பாகக் காக்கிறது.
- source_word: תַחֲלִיף
  choice: புதுப்பலம் பெறும்
  rationale: חלף என்பதன் இவ்வடிவம் மாறுதல் அல்லது புதுப்பித்தலைக் குறிக்கிறது. வில் புதுவலிமை பெறும் என்ற கவித்துவக் கருத்தைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘புதுப்பலம் பெறும்’ பயன்படுத்தப்பட்டது; ‘என் கையில்’ என்ற தொடருடன் இது வீரியம் மீளும் படிமத்தையும் காக்கிறது.
