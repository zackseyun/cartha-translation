translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கவிதைக்குரிய கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. இரு அரையடிகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது. யோபு முன்பு கொண்டிருந்த எதிர்பார்ப்பைச் சூழல் காட்டுவதால், தமிழில் எதிர்நோக்கைக் காட்டும் ‘இருக்கும் / பெறும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
