translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் முந்தைய செழிப்பை வர்ணிக்கும் மிகைப்படுத்தப்பட்ட கவித்துவ உருவகத்தை உறுதியான பொருட்சொற்களால் பாதுகாக்கிறது. இரு காலநிலைத் துணைவாக்கியங்களுக்கும் ‘-போதும்’ அமைப்பு பயன்படுத்தப்பட்டு, முந்தைய வசனங்களுடன் தொடரக்கூடிய செய்யுள் ஓட்டம் பேணப்பட்டுள்ளது.
