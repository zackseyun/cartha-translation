  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: ta
  text: 'என் காலடிகள் தயிரால் கழுவப்பட்டபோது,

    பாறை என் அருகே எண்ணெய் ஓடைகளைப் பொழிந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் அருகே” என்பதற்குப் பதிலாக, சூழலுக்கேற்ப “எனக்காக” அல்லது “என்னுடன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் நேரடியாக இடத்தொடர்பைக் குறிக்கிறது. “தயிர்” என்பதற்கான எபிரெயச் சொல் கெட்டிப்பால், தயிர்க்கட்டி, அல்லது வெண்ணெய் போன்ற பால்பொருளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: கழுவப்பட்டபோதும்
  rationale: ב prefixed infinitive construct marks a temporal circumstance; the passive-style Tamil wording naturally conveys the poetic image of the steps being washed.
- source_word: הֲלִיכַי
  choice: என் நடைகள்
  rationale: The noun denotes one's walking or steps. The concrete ‘நடைகள்’ preserves the image rather than abstracting it to a way of life.
- source_word: בְּחֵמָה
  choice: தயிரால்
  rationale: חֵמָה denotes curds or thick, rich milk and can also refer to a butter-like dairy product. ‘தயிர்’ is the clearest dignified modern Tamil equivalent in this abundance image.
- source_word: וְצוּר
  choice: பாறை
  rationale: צוּר means rock or crag; ‘பாறை’ preserves the striking concrete image.
- source_word: יָצוּק
  choice: பொழிந்தபோதும்
  rationale: יצק means to pour out. ‘பொழி’ naturally expresses copious pouring in Tamil and parallels the first temporal clause.
- source_word: עִמָּדִי
  choice: எனக்காக
  rationale: The expression is literally ‘with me/beside me,’ but in context can communicate abundance available for Job. The literal spatial alternatives are retained in a footnote.
- source_word: פַּלְגֵי
  choice: ஓடைகளை
  rationale: The plural denotes streams or channels; ‘ஓடைகள்’ is vivid and natural in Tamil.
- source_word: שָׁמֶן
  choice: எண்ணெய்
  rationale: שָׁמֶן denotes oil, commonly olive oil in this cultural setting; the source itself leaves the type implicit.
