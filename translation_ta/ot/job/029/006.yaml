revisions:
- from: 'என் நடைகள் தயிரால் கழுவப்பட்டபோதும்,

    பாறை எனக்காக எண்ணெய் ஓடைகளைப் பொழிந்தபோதும்.[a]'
  to: 'என் காலடிகள் தயிரால் கழுவப்பட்டபோது,

    பாறை என் அருகே எண்ணெய் ஓடைகளைப் பொழிந்தது.[a]'
  rationale: The revision corrects the temporal syntax, improves the idiomatic expression for ‘my steps,’ and retains the spatial ambiguity of עִמָּדִי without altering the verse’s poetic meaning. The footnote retains the relevant lexical alternatives for both the spatial expression and the dairy term.
