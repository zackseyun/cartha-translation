base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: ta
  text: அவர்களுடைய வழியை நான் தேர்ந்தெடுத்து, தலைவனாக அமர்ந்தேன்[a]; படைக்குழுவினரிடையே ஒரு அரசனைப்போல் வாழ்ந்தேன்[b]—துக்கப்படுகிறவர்களுக்கு ஆறுதல் அளிப்பவனைப்போல்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய போக்கை நான் தீர்மானித்து, முதன்மையான இடத்தில் அமர்ந்தேன்.” பிறர் செல்ல வேண்டிய வழியை யோபு தேர்ந்தெடுத்தார் அல்லது அங்கீகரித்தார் என்ற பொருள் எபிரெய வாசகத்திற்கு இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு படைக்குழுவில் அரசனைப்போல்.” גְּדוּד என்ற எபிரெயச் சொல் படை, படைக்குழு, அல்லது கூட்டம் என்பவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இறுதி ஒப்பீடு கடினமானது. எபிரெயம், “துக்கப்படுகிறவர்களுக்கு ஆறுதல் அளிப்பவன் போல” என்றும் பொருள்படலாம்; ஆறுதல் அளிப்பவர் வெளிப்படையாகப் பெயரிடப்படவில்லை.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: அவர்களுடைய வழியை நான் தேர்ந்தெடுத்து
  rationale: בּחר என்பதன் செயற்பொருளான ‘தேர்ந்தெடுத்தல்’ என்பதையும், דֶּרֶךְ என்பதன் நேரடியான ‘வழி’ என்ற உருவகத்தையும் காக்கிறது. யோபு 29-இன் பின்னோக்கிப் பார்க்கும் சூழலில் imperfect கடந்தகாலச் செயலாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: தலைவனாக அமர்ந்தேன்
  rationale: அமர்ந்திருக்கும் நேரடி படிமத்தையும், רֹאשׁ குறிக்கும் தலைமை நிலையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וְאֶשְׁכּוֹן
  choice: குடியிருந்தேன்
  rationale: שׁכן என்பதன் தங்குதல் அல்லது குடியிருத்தல் என்ற அடிப்படைப் பொருளைக் காத்து, கவிதை நடைக்கு ஏற்ற உயர்வான சொல்லாட்சியை வழங்குகிறது.
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: படையினரின் நடுவில் ஒரு அரசனைப்போல்
  rationale: כְּ என்ற ஒப்பீட்டையும், גְּדוּד என்பதன் படை/கூட்டம் என்ற பொருளையும் தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல்லின் எண்ணிக்கையும் பொருள்விரிவும் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: אֲבֵלִים יְנַחֵם
  choice: துயரப்படுகிறவர்களுக்கு ஆறுதல் அளிப்பவனைப்போல்
  rationale: אֲבֵלִים என்பதைக் காலத்திற்கேற்ற இயல்பான தமிழில் வழங்கி, Piel יְנַחֵם என்பதன் ஆறுதலளித்தல் என்ற பொருளைக் காக்கிறது. ஒருமை வினைச்சொல்லால் மறைமுகமாகத் தோன்றும் ‘ஒருவன்’ ஒப்பீட்டில் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: இறுதி ஒப்பீட்டின் இலக்கண மற்றும் கருத்துத் தெளிவின்மை
  choice: துயரப்படுகிறவர்களுக்கு ஆறுதல் அளிப்பவனைப்போல்
  alternative: துயரப்படுகிறவர்களை ஆறுதல்படுத்தும் அரசனைப்போல் / துயரப்படுகிறவர்களை ஆறுதல்படுத்துவது போல
  rationale: எபிரெய உரையில் ஆறுதலளிப்பவர் வெளிப்படையாகப் பெயரிடப்படவில்லை. ஒருமை வினைச்சொல்லைக் கொண்டு ‘ஆறுதல் அளிப்பவன்’ எனப் புரிந்துகொள்ளலாம்; ஆனால் முன்வரும் ‘அரசன்’ என்பதோடு இதன் தொடர்ப்பு சற்றுத் தெளிவற்றது. மொழிபெயர்ப்பு அந்தத் தனி ஒப்பீட்டையும் உரையின் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளையில் கவிதைக்குரிய கண்ணியத்தைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைவனாக அமர்ந்தேன்’, ‘அரசனைப்போல்’, ‘ஆறுதல் அளிப்பவன்’ ஆகியவை மூலத்தின் சமூகப் படிமங்களையும் இணையான அமைப்பையும் காக்கின்றன.
