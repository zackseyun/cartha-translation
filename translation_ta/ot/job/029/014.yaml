  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: ta
  text: நீதியை[a] நான் ஆடையாக அணிந்துகொண்டேன்; அது என்னை உடுத்தியது. என் நீதிச் செயல் மேலங்கியைப் போலவும் தலைப்பாகையைப் போலவும் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதி’ என்பதற்கான எபிரெயச் சொல் ‘நேர்மை’ அல்லது ‘நீதியான நடத்தை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தலைப்பாகை’ என்பது தலையைச் சுற்றிக் கட்டும் ஆடை; இங்கே அது மதிப்பையும் பொது மரியாதையையும் சித்தரிக்கும் ஆடை உருவகத்தின் ஒரு பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: நீதி
  rationale: இச்சொல் நேர்மையையும் நீதியையும் குறிக்கலாம். மִשְׁפָּטִי என்பதிலிருந்து வேறுபாட்டைக் காக்கும் அதேவேளையில், யோபின் ஒழுக்கநெறி சார்ந்த பண்பை இயல்பான தமிழில் ‘நீதி’ எடுத்துரைக்கிறது.
- source_word: לָבַשְׁתִּי
  choice: நான் ஆடையாக அணிந்துகொண்டேன்
  rationale: לבש என்பதன் ஆடை அணியும் உருவகத்தையும் யோபின் செயற்பாட்டையும் தெளிவாகக் காக்கிறது.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: அது என்னை உடுத்துவித்தது
  rationale: முந்தைய לבש வினைச்சொல்லை மீண்டும் ஒலிக்கச் செய்து, யோபு நீதியை அணிந்தார்; அதுவே அவரை உடுத்துவித்தது என்ற எபிரெயக் கவிதையின் பரஸ்பரத் திருப்பத்தைப் பாதுகாக்கிறது.
- source_word: כִּמְעִיל
  choice: மேலங்கியைப் போல
  rationale: מְעִיל என்பது வெளிப்புறத்தில் அணியும் நீண்ட ஆடை அல்லது மேலங்கியைக் குறிக்கிறது; ‘மேலங்கி’ நவீன தமிழில் தெளிவாகவும் கண்ணியமான உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְצָנִיף
  choice: தலைப்பாகையைப் போல
  rationale: צָנִיף என்பது தலையைச் சுற்றிக் கட்டும் ஆடை. ‘தலைப்பாகை’ அதன் வடிவத்தையும் பொது மரியாதை சார்ந்த படிமத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפָּטִי
  choice: என் நீதி வழங்குதல்
  rationale: מִשְׁפָּטִי என்பது ‘என் தீர்ப்பு,’ ‘என் நீதி,’ அல்லது நீதியை நடைமுறைப்படுத்துதல் எனப் பொருள்படலாம். சூழலில் யோபின் பொது நீதிச் செயல்பாட்டை ‘நீதி வழங்குதல்’ தெளிவாக வெளிப்படுத்துவதோடு, முதல் அடியின் צֶדֶק என்பதையும் இதனுடன் முற்றிலும் ஒன்றாக்காமல் காக்கிறது.
theological_decisions:
- issue: צֶדֶק மற்றும் מִשְׁפָּטִי ஆகிய நீதிசார் சொற்களுக்கிடையிலான உறவு
  choice: முதலாவதை ‘நீதி’ என்றும் இரண்டாவதை ‘என் நீதி வழங்குதல்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘நீதி’ என்று மொழிபெயர்த்தல்; அல்லது மִשְׁפָּטִי என்பதை ‘என் தீர்ப்பு’ என மொழிபெயர்த்தல்
  rationale: இது யோபின் நேர்மையான பண்பையும் அவர் நடைமுறைப்படுத்திய நீதியையும் இணைத்துக் காட்டுகிறது; அதேசமயம் மூலத்தில் உள்ள சொற்பொருள் வேறுபாட்டையும் அதன் நெறி மற்றும் நீதித்துறை சார்ந்த பதற்றத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அது என்னை உடுத்துவித்தது’ என்பது அன்றாட வழக்கில் சற்றே உயர்ந்த நடையாக இருந்தாலும், எபிரெய மூலத்தின் நோக்கமுள்ள வினைச்சொல் மறுமொழியையும் கவிதைத் திருப்பத்தையும் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
