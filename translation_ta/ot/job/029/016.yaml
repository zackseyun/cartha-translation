  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: ta
  text: 'ஏழைகளுக்குத் தந்தையாக இருந்தேன்;

    எனக்குத் தெரியாத வழக்கையும்[a] துருவி ஆராய்ந்தேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு அறிமுகமில்லாத ஒருவரின் வழக்கையும்.”
    reason: לֹא יָדַעְתִּי மற்றும் ஆண்பால் பின்னொட்டு அறியப்படாத வழக்கைக் குறிக்கிறதா, அறிமுகமில்லாத நபரின் வழக்கைக் குறிக்கிறதா என்பதில் உள்ள உண்மையான இலக்கணப் பொருள் தெளிவின்மையைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: אָב
  choice: தந்தை
  rationale: சொல்லின் நேரடிப் பொருளான ‘தந்தை’ என்ற உருவகத்தைத் தக்கவைத்து, ஏழைகளிடம் யோபு காட்டிய பாதுகாப்பையும் பரிவையும் எடுத்துரைக்கிறது.
- source_word: אָנֹכִי
  choice: இருந்தேன்
  rationale: எபிரெயத்தில் இது வினையில்லா வாக்கியம்; அதிகாரத்தின் கடந்தகாலச் சூழலுக்கேற்ப தமிழில் ‘இருந்தேன்’ என வழங்கப்பட்டது. தனிப்பெயர் சுட்டின் வலியுறுத்தல் இயல்பான தமிழ் வினைமுற்றில் உள்ளடங்குகிறது.
- source_word: לָאֶבְיוֹנִים
  choice: ஏழைகளுக்கு
  rationale: אֶבְיוֹן பொருளாதாரத்திலும் சமூகத்திலும் ஆதரவற்ற ஏழை அல்லது தேவையுள்ளவரைக் குறிக்கிறது; ‘ஏழைகளுக்கு’ என்பது இங்கு இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וְרִיב
  choice: வழக்கையும்
  rationale: רִיב என்பது தகராறு, வாதம் அல்லது சட்ட வழக்கைக் குறிக்கலாம். நீதி விசாரணைச் சூழலில் ‘வழக்கு’ இயல்பான தேர்வு; இணைப்பிலுள்ள வְ மற்றும் கருத்து வலியுறுத்தலை ‘-யும்’ எடுத்துக்காட்டுகிறது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாத
  rationale: இது முன்பே அறியப்படாத வழக்கைக் குறிக்கலாம்; எபிரெயச் சொற்றொடரின் நேரடியான தொடர்பைத் தக்கவைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶחְקְרֵהוּ
  choice: துருவி ஆராய்ந்தேன்
  rationale: חקר என்பது ஒரு காரியத்தை ஆழமாகத் தேடி விசாரிப்பதைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு இங்கு ‘வழக்கு’ என்பதைக் குறிக்கும் பொருளில் தமிழில் இயல்பாக உள்ளடக்கப்பட்டுள்ளது.
