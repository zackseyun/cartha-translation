  text: כִּֽי אֲ֭מַלֵּט עָנִ֣י מְשַׁוֵּ֑עַ וְ֝/יָת֗וֹם וְֽ/לֹא עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: ta
  text: ஏனெனில், உதவிக்காகக் கூக்குரலிட்ட ஏழையை நான் மீட்டேன்; உதவியாளர் இல்லாத தந்தையற்றவனையும் மீட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தையற்றவனை” என்பதற்கு “அநாதையை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாகத் தந்தை இல்லாத, சமூக ரீதியாகப் பாதுகாப்பற்ற ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் யோபுக்குக் கிடைத்த மதிப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲמַלֵּט
  choice: நான் மீட்டேன்
  rationale: מלט என்பதன் பியேல் வடிவம் செயற்பட்டு விடுவித்தல் அல்லது ஆபத்திலிருந்து மீட்டல் என்ற பொருளைக் கொடுக்கிறது; தமிழில் ‘மீட்டேன்’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: עָנִי
  choice: ஏழையை
  rationale: இச்சூழலில் பொருளாதார ரீதியாகவும் சமூக ரீதியாகவும் நலிவுற்ற நபரைக் குறிக்கிறது; ‘ஏழை’ பொதுவாசகருக்குத் தெளிவான தேர்வு.
- source_word: מְשַׁוֵּעַ
  choice: உதவிக்காகக் கூக்குரலிட்ட
  rationale: உதவி வேண்டி உரக்க அழைப்பதைப் பங்கேற்பு வடிவம் சித்தரிக்கிறது; தமிழில் தொடர்பெயரெச்சத் தொடர் இயல்பாக அமைகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவன்
  rationale: எபிரெயச் சொல் குறிப்பாகத் தந்தையை இழந்த சமூக ரீதியாகப் பாதுகாப்பற்ற நபரைக் குறிக்கிறது; ‘அநாதை’ என்பதைவிட மூலத்தின் குறிப்பிட்ட பொருளைப் பாதுகாக்கிறது.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: உதவியாளர் இல்லாத
  rationale: அவனுக்கு உதவ யாரும் இல்லாத நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
