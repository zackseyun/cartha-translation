  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: ta
  text: 'அப்போது நான் சொன்னேன்[a]:


    “என் கூட்டிலேயே இறப்பேன்;

    மணலைப்போல் என் நாட்களைப் பெருகச் செய்வேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நாட்களை ஃபீனிக்ஸ் பறவையைப்போல் பெருகச் செய்வேன்” என்றும் பொருள் கொள்ள வாய்ப்புள்ளது. இங்கே ‘மணல்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல்லைப் பறவையின் பெயராகச் சிலர் புரிந்துகொண்டுள்ளனர். ஆனால் இச்சூழலில் ‘மணல்’ என்பதே அதிகச் சாத்தியமான பொருள்; மிகுதியான எண்ணிக்கையைக் குறிக்கும் பொதுவான வேதாகம உருவகத்திற்கும் அது பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: அப்போது நான் சொன்னேன்
  rationale: தொடர்ச்சியான நினைவுகூரலை முன்னெடுக்கும் வாவ் வடிவை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: עִם קִנִּי
  choice: என் கூட்டிலேயே
  rationale: עִם என்பதன் சொற்பொருள் ‘உடன்’ என்றாலும், ‘கூடு’ என்னும் உருவகத்துடன் அது பாதுகாப்பான சொந்த இருப்பிடத்தைக் குறிக்கிறது; ‘கூட்டிலேயே’ என்பது உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֶגְוָע
  choice: இறப்பேன்
  rationale: மரித்தல் அல்லது உயிர் நீங்குதல் என்ற நேரடியான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְכַחוֹל
  choice: மணலைப்போல்
  rationale: חוֹל என்பதன் வழக்கமான எபிரெயப் பொருள் ‘மணல்’; எண்ணிலடங்கா பெருக்கத்திற்கான பொதுவான வேதாகம உருவகத்திற்கும் இது பொருந்துகிறது. பறவையைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַרְבֶּה יָמִים
  choice: என் நாட்களைப் பெருகச் செய்வேன்
  rationale: רבה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘பெருகச் செய்தல்’ என்ற செயற்பொருளைக் காக்கிறது; ‘என்’ என்பது முதலாம் நபர் வினையிலிருந்து இயல்பாக விளங்கும் ஆயுளைக் குறிக்கிறது.
