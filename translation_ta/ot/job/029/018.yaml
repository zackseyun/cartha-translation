  register: நவீன நிலையான தமிழில், யோபுவின் கவிதை உருவகமான ‘கூடு’ என்பதைக் காத்து, வாசிக்க எளிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மணல்/ஃபீனிக்ஸ்’ என்ற உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
