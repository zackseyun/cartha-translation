source:
  edition: WLC
  text: שָׂ֭רִים עָצְר֣וּ בְ/מִלִּ֑ים וְ֝/כַ֗ף יָשִׂ֥ימוּ לְ/פִי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: ta
  text: பிரபுக்கள் தங்கள் பேச்சை அடக்கிக்கொண்டு, தங்கள் வாயின்மேல் கையை வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயர்குடியினர் பேசாமல் இருந்தார்கள்.”
    reason: שָׂרִים என்பதை ‘உயர்குடியினர்’ என்றும், עָצְרוּ בְמִלִּים என்பதை ‘பேசாமல் இருந்தார்கள்’ என்றும் பொருள்சார் முறையில் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: שָׂרִים
  choice: பிரபுக்கள்
  rationale: உயர் பதவியிலும் சமூகச் செல்வாக்கிலும் இருந்தவர்களைக் குறிக்கிறது; யோபுக்குக் காட்டப்பட்ட பொதுமரியாதையின் சூழலுக்கு ஏற்ற உயர்நிலையை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָצְרוּ בְמִלִּים
  choice: தங்கள் பேச்சை அடக்கிக்கொண்டு
  rationale: עצר என்பது இங்கு பேசுவதைத் தடுத்து அடக்குவதைக் குறிக்கிறது. בְמִלִּים என்பதன் சொற்பொருள் ‘வார்த்தைகளில்/வார்த்தைகளுடன்’ என்றாலும், இச்சூழலில் ‘பேச்சை அடக்குதல்’ என்பது நவீன தமிழில் இயல்பான பொருள்சார் மொழிபெயர்ப்பு.
- source_word: וְכַף
  choice: கையை
  rationale: כַּף என்பதற்கு உள்ளங்கை அல்லது கை என்று பொருள்; வாயை மூடி அமைதியாக இருக்கும் சைகையில் தமிழில் ‘கை’ என்பதே இயல்பான சொல்.
- source_word: יָשִׂימוּ לְפִיהֶם
  choice: தங்கள் வாயின்மேல் கையை வைத்தார்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘தங்கள் வாய்க்கு/வாயின்மேல் வைத்தார்கள்’ என்ற உடல் சைகையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரபுக்கள்’ உயர்ந்த சமூக அல்லது ஆட்சிப் பதவியைப் பாதுகாக்கிறது; ‘பேச்சை அடக்கிக்கொண்டு’ என்பது செயற்பாடுகளின் தொடர்ச்சியை இயல்பாக இணைக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
