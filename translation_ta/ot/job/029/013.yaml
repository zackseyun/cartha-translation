  text: בִּרְכַּ֣ת אֹ֭בֵד עָלַ֣/י תָּבֹ֑א וְ/לֵ֖ב אַלְמָנָ֣ה אַרְנִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: ta
  text: அழிந்துபோகிறவனின் ஆசீர்வாதம் என்மேல் வந்தது[a]; விதவையின் உள்ளத்தை மகிழ்ச்சியால் பாடச் செய்தேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழிந்துகொண்டிருந்தவனின் ஆசீர்வாதம்’ என்றும் மொழிபெயர்க்கலாம். אֹבֵד என்ற எபிரேய பங்கேற்பு வினைச்சொல் அழிந்துபோகிற, நாசமடைந்த, அல்லது மரணத்தை நெருங்கிய ஒருவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விதவையின் உள்ளத்தை மகிழச் செய்தேன்’ அல்லது ‘மகிழ்ச்சியால் ஆர்ப்பரிக்கச் செய்தேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: ஆசீர்வாதம்
  rationale: בְּרָכָה என்பதன் construct வடிவம். தொடர்ந்து வரும் பங்கேற்புவினைச் சொல்லுடன் உரிமைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֹבֵד
  choice: அழிந்துபோகும் நிலையில் இருந்தவன்
  rationale: אבד என்பதன் Qal பங்கேற்புவினை வடிவம்; மரணம், அழிவு, நாசநிலை ஆகியவற்றில் ஒன்றை மட்டும் நிர்ணயிக்காமல், ஆபத்தான அழிவுநிலையைச் சுட்டுகிறது.
- source_word: עָלַי תָּבֹא
  choice: என்மேல் வந்தது
  rationale: עַל முன்னிடைச்சொல்லின் உருவகத்தையும், கடந்தகாலத்தை நினைவுகூரும் கவிதைச் சூழலில் תָּבֹא தரும் கடந்தகாலப் பொருளையும் காக்கிறது.
- source_word: לֵב אַלְמָנָה
  choice: விதவையின் உள்ளம்
  rationale: לֵב என்பது இங்கு உணர்வுகளின் மையமான அகநிலையைக் குறிக்கிறது; தமிழில் ‘உள்ளம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַרְנִן
  choice: மகிழ்ச்சியால் பாடச் செய்தேன்
  rationale: רנן என்பதன் Hiphil முதலாம் நபர் ஒருமை வடிவத்தின் காரணவினைப் பொருளையும், மகிழ்ச்சியுடன் பாடுதல் அல்லது ஆர்ப்பரித்தல் என்ற உணர்வையும் வெளிப்படுத்துகிறது.
