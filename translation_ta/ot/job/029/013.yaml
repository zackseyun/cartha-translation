translation_notes:
  register: நவீன தரநிலைத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அழிந்துபோகும் நிலையில்’ என்பது மூலத்தின் பொருள் பரப்பைத் திறந்தவாறே வைக்கிறது; ‘உள்ளம்’ மற்றும் ‘மகிழ்ச்சியால் பாடச் செய்தேன்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் இயல்பான சொற்றொடர்கள்.
