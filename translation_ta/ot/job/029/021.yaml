  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: ta
  text: அவர்கள் எனக்குச் செவிகொடுத்து, எதிர்நோக்கிக் காத்திருந்தார்கள்[a]; என் ஆலோசனையை எதிர்நோக்கி மௌனமாக இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையோடு காத்திருந்தார்கள்.” இவ்வினைச்சொல் நம்புதல் அல்லது எதிர்பார்த்தல் என்ற நுண்பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் ஆலோசனைக்கு மறுமொழியாக அவர்கள் மௌனமாக இருந்தார்கள்.” இறுதிச் சொற்றொடர் யோபின் ஆலோசனையோடு தொடர்புடைய அவர்களுடைய மௌனத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: எனக்குச் செவிகொடுத்து
  rationale: שׁמע உடன் לִי வருவதால், வெறுமனே ஒலி கேட்டதைக் காட்டிலும் யோபின் பேச்சைக் கவனமாகக் கேட்டதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘எனக்குச் செவிகொடுத்து’ என்பது அந்தப் பொருளைத் தருகிறது.
- source_word: וְיִחֵלּוּ
  choice: எதிர்பார்த்துக் காத்திருந்தார்கள்
  rationale: יחל இங்கு காத்திருத்தலோடு நம்பிக்கை அல்லது எதிர்பார்ப்பு என்ற நுண்பொருளையும் கொண்டிருக்கலாம். இரு கூறுகளையும் இயல்பாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְיִדְּמוּ
  choice: அமைதியாக இருந்தார்கள்
  rationale: דמם இச்சூழலில் பேசாமல் அமைதியாக அல்லது அசைவின்றி இருப்பதைக் குறிக்கிறது. ஆலோசனையைக் கேட்போரின் கட்டுப்பட்ட மௌனத்தை இது தெளிவாகக் காட்டுகிறது.
- source_word: לְמוֹ עֲצָתִי
  choice: என் ஆலோசனைக்காக
  rationale: கவிதைநடையிலான לְמוֹ, அவர்களுடைய அமைதிக்கும் யோபின் ஆலோசனைக்கும் உள்ள தொடர்பைச் சுட்டுகிறது. עֲצָתִי என்பது இங்கு மதிப்புடன் வழங்கப்படும் ஆலோசனை அல்லது அறிவுரையைக் குறிக்கிறது.
