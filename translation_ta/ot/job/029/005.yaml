translation_notes:
  register: நவீன தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. கடந்துபோன நல்வாழ்வை நினைவுகூரும் தொனி ‘இன்னும் ... இருந்தபோது’ என்ற அமைப்பில் வெளிப்படுகிறது.
