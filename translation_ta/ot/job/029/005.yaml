  yaml_path: translation/ot/job/029/005.yaml
  text: when the Almighty was still with me[a], and my young men were around me,
translation:
  language: ta
  text: சர்வவல்லவர் இன்னும் என்னோடு இருந்தபோது, என் இளைஞர்கள்[a] என்னைச் சூழ்ந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பணிவிடையாளர்கள்” அல்லது “என் உதவியாளர்கள்.” எபிரெயச் சொல்லான நְעָרַי, சூழலுக்கு ஏற்ப, “இளைஞர்கள்,” “உதவியாளர்கள்,” அல்லது “ஊழியர்கள்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד
  choice: இன்னும் ... இருந்தபோது
  rationale: கடந்த காலத்தில் தொடர்ந்திருந்த, ஆனால் இப்போது முடிந்துவிட்ட நிலையை அறிமுகப்படுத்தும் காலவாசக நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் வரும் தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல், நவீன தமிழில் தெளிவாகவும் மரியாதையுடனும் மொழிபெயர்க்கிறது.
- source_word: עִמָּדִי
  choice: என்னோடு
  rationale: உடனிருப்பு அல்லது துணைநிற்றலைக் குறிக்கும் எபிரெயச் சொல்லுக்கு நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: סְבִיבוֹתַי
  choice: என்னைச் சூழ்ந்திருந்தார்கள்
  rationale: பேசுபவரைச் சுற்றி மக்கள் இருந்த நிலையைத் தமிழில் இயல்பான வினை அமைப்பாக வெளிப்படுத்துகிறது.
- source_word: נְעָרַי
  choice: என் இளைஞர்கள்
  rationale: இச்சொல் இளைஞர்கள், பணிவிடையாளர்கள், அல்லது ஊழியர்கள் எனச் சூழலுக்கேற்ப பொருள்படலாம். பணிநிலையைத் தேவையின்றி குறிப்பாக்காமல் அதன் அடிப்படைச் சொல்லுணர்வைத் தக்கவைக்கிறது.
