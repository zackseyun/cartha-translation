base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: ta
  text: ஏனெனில், என்னைக் குறித்துக் கேட்ட செவி என்னைப் பேறுபெற்றவன் என்று கூறியது; என்னைக் கண்ட கண் எனக்குச் சாதகமாகச் சாட்சி கூறியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குச் சாட்சியமளித்தது.” எபிரெய வினைச்சொல் சாட்சி கூறுதல் அல்லது சாட்சியமளித்தல் என்பதைக் குறிக்கலாம்; இங்கு அது யோபைப் பற்றிய சாதகமான சாட்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனங்களில் யோபு பெற்றிருந்த மதிப்புக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֹזֶן שָׁמְעָה
  choice: என்னைக் குறித்துக் கேட்ட செவி
  rationale: எபிரெய உரையின் ஒருமை உடலுறுப்பு உருவகத்தை இயன்றவரைத் தக்கவைத்து, சூழலில் கேட்டது யோபைப் பற்றிய செய்தி என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: என்னைப் பேறுபெற்றவன் என்று போற்றியது
  rationale: ஒருவரைப் பேறுபெற்றவர் அல்லது நல்வாழ்வு பெற்றவர் என்று அறிவித்து மதிக்கும் பொருளைத் தருகிறது; வெறும் மனமகிழ்ச்சியைக் குறிக்கும் சொல்லாகக் குறுக்கவில்லை.
- source_word: וְעַיִן רָאֲתָה
  choice: என்னைக் கண்ட கண்
  rationale: ‘செவி—கண்’, ‘கேட்டது—கண்டது’ என்ற எபிரெய இணைநிலையைத் தக்கவைக்கிறது.
- source_word: וַתְּעִידֵנִי
  choice: எனக்குச் சாதகமாகச் சாட்சி கூறியது
  rationale: வினைச்சொல்லின் ‘சாட்சி கூறுதல்’ என்ற அடிப்படைப் பொருளையும், இச்சூழலில் அது யோபுக்கு ஆதரவான சாட்சி என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
