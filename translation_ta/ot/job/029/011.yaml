  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் செவி–கண் உருவகமும் கேட்டது–கண்டது என்ற இணைநிலையும் தக்கவைக்கப்பட்டுள்ளன.
