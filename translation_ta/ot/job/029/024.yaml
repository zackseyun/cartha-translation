translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் ‘முகத்தின் ஒளி’ என்ற கவித்துவ உருவகம் பாதுகாக்கப்பட்டு, அதனுடன் இயல்பாக இணையும் ‘மங்கச் செய்யவில்லை’ பயன்படுத்தப்பட்டுள்ளது; சிரித்தல்/புன்னகைத்தல் மற்றும் நம்பாமையின் சூழல்சார் நுணுக்கங்கள் அடிக்குறிப்புகளில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
