  text: אֶשְׂחַ֣ק אֲ֭לֵ/הֶם לֹ֣א יַאֲמִ֑ינוּ וְ/א֥וֹר פָּ֝נַ֗/י לֹ֣א יַפִּילֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: ta
  text: நான் அவர்களை நோக்கிப் புன்னகைத்தேன்; அவர்களோ அதை நம்பவில்லை[a]. என் முகத்தின் ஒளியை அவர்கள் மங்கச் செய்யவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் அவர்களை நோக்கிச் சிரித்தேன்; அவர்கள் அதை நம்பவில்லை’ என்றும் மொழிபெயர்க்கலாம். யோபு தங்களிடம் இவ்வளவு கனிவாக நடந்துகொண்டதை அவர்களால் நம்ப முடியவில்லை என்ற வியப்பையும் இச்சொற்கள் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘என் முகத்தின் ஒளியை அவர்கள் விழச் செய்யவில்லை.’ ‘முகத்தின் ஒளி’ என்பது ஒளிவீசும் அல்லது கனிவான முகபாவத்தைக் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: புன்னகைத்தேன்
  rationale: שׂחק என்பது சிரிப்பதையோ புன்னகைப்பதையோ குறிக்கலாம். இங்கு யோபுவின் கனிவான முகபாவத்தையும் அடுத்துவரும் ‘என் முகத்தின் ஒளி’ என்ற உருவகத்தையும் பொருத்தவரை ‘புன்னகைத்தேன்’ இயல்பாக உள்ளது; ‘சிரித்தேன்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களை நோக்கி
  rationale: אֶל என்ற முன்னிடைச்சொல்லின் திசைநோக்கிய பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא יַאֲמִינוּ
  choice: அதை நம்பவில்லை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைக்கிறது. இது யோபுவின் அன்பான கவனிப்பைப் பெற்றதில் ஏற்பட்ட வியப்பைச் சுட்டக்கூடும் என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאוֹר פָּנַי
  choice: என் முகத்தின் ஒளி
  rationale: ஒளிவீசும், கனிவான அல்லது மகிழ்ச்சியான முகபாவத்தைக் குறிக்கும் மூலமொழியின் உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: לֹא יַפִּילוּן
  choice: மங்கச் செய்யவில்லை
  rationale: வினைச்சொல்லின் நேரடிப் படிமம் ‘விழச் செய்யவில்லை’ என்பதாக இருந்தாலும், ‘ஒளி’ என்பதுடன் தமிழில் ‘மங்கச் செய்யவில்லை’ என்பது இயல்பாக இணைந்து, முகத்தின் மகிழ்ச்சியான ஒளி குறையவில்லை என்ற கருத்தை உருவகத்தோடு தெரிவிக்கிறது.
