translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. நகர வாழ்வின் பொதுக் கூடுகைச் சூழலைத் தெளிவுபடுத்துகிறது; அதேவேளையில் எபிரெயச் சொற்றொடரின் மாற்று வாசிப்புகளை அடிக்குறிப்புகளில் பாதுகாக்கிறது.
