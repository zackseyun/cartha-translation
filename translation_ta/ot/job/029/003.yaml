  yaml_path: translation/ot/job/029/003.yaml
  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: ta
  text: 'அவருடைய விளக்கு என் தலைக்கு மேல் ஒளிவீசியபோது,

    அவருடைய ஒளியால் நான் இருளில் நடந்தேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் ஒளியால் நான் இருளில் நடந்தேன்.” ‘அவருடைய ஒளியால்’ என்பதிலுள்ள எபிரெயப் பின்னொட்டு, சூழலில் இறைவனையோ அல்லது உடனடியாக முன்வரும் விளக்கையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: அவருடைய விளக்கு ... ஒளிவீசியபோது
  rationale: ב plus infinitive construct காலச் சூழலைக் குறிக்கிறது. נֵר என்பதன் நேரடியான படிமமான ‘விளக்கு’ தக்கவைக்கப்பட்டு, தமிழில் இயல்பாக ‘ஒளிவீசியபோது’ என அமைக்கப்பட்டது.
- source_word: עֲלֵי רֹאשִׁי
  choice: என் தலைக்கு மேலே
  rationale: இது இடத்தைக் குறிக்கும் சொற்றொடர்; விளக்கு தலைக்கு மேலிருந்து ஒளிவீசும் படிமத்தை நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְאוֹרוֹ
  choice: அவருடைய ஒளியால்
  rationale: לְ இங்கு வழிமுறை அல்லது துணையை உணர்த்துகிறது. சூழலில் பின்னொட்டு கடவுளைக் குறிப்பதாக முதன்மையாக எடுத்துக்கொள்ளப்பட்டாலும், அது விளக்கைக் குறிக்கக்கூடிய இலக்கண வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֵלֶךְ
  choice: நான் ... நடந்தேன்
  rationale: வடிவில் imperfect என்றாலும், யோபு கடந்த காலத்தை நினைவுகூரும் சூழலில் இது கடந்தகால வழக்கமான அல்லது நிகழ்ந்த செயலைக் குறிக்கிறது; ‘நடந்தேன்’ தமிழில் நேர்த்தியானது.
- source_word: חֹשֶׁךְ
  choice: இருளில்
  rationale: எபிரெயச் சொல்லில் ‘வழியாக’ என்பதற்கான தனிப்பட்ட முன்னிடைச்சொல் இல்லை. ஆகவே மூலத்தின் திறந்த படிமத்தைப் பாதுகாக்க ‘இருளில்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ‘அவருடைய விளக்கு,’ ‘அவருடைய ஒளி’ என்பவற்றிலுள்ள மூன்றாம் ஆண்பால் ஒருமைப் பின்னொட்டுகளின் குறிப்பு
  choice: முதன்மை உரையில் அவை கடவுளைக் குறிப்பதாக ‘அவருடைய’ என வழங்கப்பட்டது.
  alternative: இரண்டாம் பின்னொட்டு உடனடியாக ‘விளக்கு’ என்பதைக் குறிப்பதாகக் கொண்டு, ‘அதன் ஒளியால்’ என வாசிக்கலாம்.
  rationale: யோபு 29-ன் சூழலில் யோபு கடவுளின் பாதுகாப்பையும் அருளையும் நினைவுகூருகிறார். எனவே தனிப்பட்ட குறிப்பான ‘அவருடைய’ சூழலுக்கு நன்கு பொருந்துகிறது; இருப்பினும் அருகிலுள்ள ‘விளக்கு’ என்பதே இரண்டாம் பின்னொட்டின் குறிப்பு என்ற உண்மையான தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘விளக்கு,’ ‘ஒளி,’ ‘இருள்,’ ‘நடத்தல்’ ஆகிய மூலப் படிமங்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை முதன்மை உரையில் சேர்க்கப்படவில்லை.
