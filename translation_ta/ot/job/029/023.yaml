translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மழையை எதிர்பார்த்து வாயை அகலத் திறக்கும் மூல உருவகம் மாற்றமின்றிப் பேணப்பட்டுள்ளது; யோபுவின் ‘சொல்’ அல்லது ‘ஆலோசனை’ என்று விளக்கத்தை உரைக்குள் சேர்க்காமல், எபிரெயத்தின் ‘எனக்காக’ என்பதே வைக்கப்பட்டுள்ளது.
