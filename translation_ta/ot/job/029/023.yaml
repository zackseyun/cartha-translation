base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: ta
  text: மழைக்காகக் காத்திருப்பதுபோல், எனக்காகக் காத்திருந்தார்கள்; பின்பருவ மழைக்காக[a] தங்கள் வாயை அகலத் திறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடைசிப் பருவ மழைக்காக” அல்லது “தாமதமாகப் பெய்யும் மழைக்காக.” எபிரெயச் சொல் வேளாண் பருவத்தின் பிற்பகுதியில் பெய்யும் மழையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: காத்திருந்தார்கள்
  rationale: יחל என்பது எதிர்பார்ப்போடும் நம்பிக்கையோடும் காத்திருப்பதைக் குறிக்கிறது. மழைக்காகக் காத்திருக்கும் உவமைக்கும், யோபுவின் சொற்களை மக்கள் எதிர்பார்த்த சூழலுக்கும் இத்தேர்வு பொருந்துகிறது.
- source_word: כַמָּטָר
  choice: மழைக்காகக் காத்திருப்பதுபோல்
  rationale: כ என்ற ஒப்புமை உருபையும் מָטָר என்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தேவையான மழையை ஆவலுடன் எதிர்பார்க்கும் கருத்தையும் தெளிவாக்குகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: எபிரெய உரையில் உள்ள முதலாம் நபர் ஒருமைப் பதிலிடுபெயரை நேரடியாகப் பேணுகிறது. அவர்கள் யோபுவின் சொல்லையோ ஆலோசனையையோ எதிர்பார்த்தனர் என்பது சூழலால் விளங்குகிறது; அதை உரைக்குள் சேர்க்கவில்லை.
- source_word: וּפִיהֶם
  choice: தங்கள் வாயை
  rationale: எபிரெய மொழியில் உடைமைப் பின்னொட்டுடன் வரும் ‘அவர்களுடைய வாய்’ என்ற கருத்தை, பலர் தத்தம் வாயைத் திறந்தனர் என்பதைக் குறிக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: פָּעֲרוּ
  choice: அகலத் திறந்தார்கள்
  rationale: פער என்பது வாயை விரிவாகத் திறப்பதைக் குறிக்கிறது. மூலத்தின் உயிரோட்டமான உருவகத்தை இந்தத் தேர்வு பேணுகிறது.
- source_word: לְמַלְקוֹשׁ
  choice: பின்பருவ மழைக்காக
  rationale: מַלְקוֹשׁ என்பது வேளாண் பருவத்தின் பிற்பகுதியில் பெய்யும் மழையைக் குறிக்கிறது. ‘பின்பருவ மழை’ அதன் பருவநிலைச் சிறப்பைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
