  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: ta
  text: 'முன்னைய மாதங்களைப் போலவும்,

    கடவுள் என்னைக் காத்த நாட்களைப் போலவும்

    நான் இருந்தால் எவ்வளவு நன்றாயிருக்கும்![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “யார் என்னை முன்னைய மாதங்களைப்போல் இருக்கச் செய்வார்?” இந்த எபிரேய மரபுத்தொடர் ஓர் ஆழ்ந்த விருப்பத்தையோ ஏக்கத்தையோ வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் என்னைப் பாதுகாத்த நாட்களைப் போலவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: நான் இருந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: ‘யார் என்னைத் தருவார்?’ என்ற சொல்லடிச் சொற்பொருளை விட, இவ்வெபிரேய மரபுத்தொடர் வெளிப்படுத்தும் ஆழ்ந்த ஏக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כְיַרְחֵי קֶדֶם
  choice: முன்பிருந்த மாதங்களில் இருந்ததுபோல்
  rationale: கடந்த காலத்தின் மாதங்களை ஏக்கத்துடன் நினைவுகூரும் ஒப்புமையையும் காலப்பொருளையும் காக்கிறது.
- source_word: כִּימֵי
  choice: நாட்களில் இருந்ததுபோல்
  rationale: முந்தைய காலத் தொடருடன் உள்ள கவிதை இணைநிலையைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் காணப்படும் கடவுளைக் குறிக்கும் ஒருமை கவிதை வடிவம்; மூலத்தில் இல்லாத ‘சர்வவல்லவர்’ போன்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
- source_word: יִשְׁמְרֵנִי
  choice: என்னைக் காத்துவந்த
  rationale: שׁמר என்பதன் காத்தல், பாதுகாத்தல், கவனித்துக்கொள்ளுதல் ஆகிய பொருள் வீச்சைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; தொடர்ச்சியான கடந்தகாலப் பராமரிப்பையும் உணர்த்துகிறது.
theological_decisions:
- issue: யோபு நினைவுகூரும் கடவுளின் கடந்தகாலச் செயல்
  choice: கடவுள் என்னைக் காத்துவந்த
  alternative: கடவுள் என்னைக் கவனித்துக்கொண்ட / பாதுகாத்த
  rationale: கடவுளின் பாதுகாப்பான பராமரிப்பைக் குறிப்பிடுகிறது; ஆனால் மூலமொழி கூறாத குறிப்பிட்ட இறையியல் செயல்முறையை இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், யோபுவின் ஏக்கமிகு கவிதைத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடை. இரு இணை வரிகளும் எபிரேயக் கவிதையின் ஒப்புமை அமைப்பைப் பிரதிபலிக்கின்றன.
