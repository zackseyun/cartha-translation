  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: ta
  text: நான் பேசியபின், அவர்கள் மறுபடியும் பேசவில்லை[a]; என் சொல் அவர்கள்மேல் துளித்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மறுபடியும் பதில் சொல்லவில்லை.” எபிரெய வினை, யோபு பேசியபின் அவர்கள் மீண்டும் பேசவில்லை அல்லது பதிலளிக்கவில்லை என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் சொல் அவர்கள்மேல் துளித்தது” என்பது பேச்சு கேட்பவர்கள்மேல் துளிகள்போல் விழுவதைச் சித்தரிக்கும் கவித்துவ உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: நான் பேசியபின்
  rationale: காலத் தொடர்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; யோபு பேசி முடித்த பிறகு நிகழ்ந்ததைச் சுட்டுகிறது.
- source_word: לֹא יִשְׁנוּ
  choice: அவர்கள் மறுபடியும் பேசவில்லை
  rationale: שנה என்ற வினை இச்சூழலில் மீண்டும் பேசுதல் அல்லது பதிலளித்தல் என்ற பொருளைக் கொள்ளலாம். முதன்மை மொழிபெயர்ப்பு உரையாடல் சூழலுக்கு ஏற்ற பொதுவான பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעָלֵימוֹ
  choice: அவர்கள்மேல்
  rationale: עַל முன்னிடைச்சொல்லின் ‘மேல்’ என்ற இடவுறவைப் பேச்சு துளிக்கும் கவித்துவ உருவகத்தோடு காக்கிறது.
- source_word: תִּטֹּף
  choice: துளித்தது
  rationale: נטף வினையின் துளித்தல் அல்லது சொட்டுதல் என்ற நேரடியான கவித்துவப் படிமத்தை விளக்கிச் சொல்லாமல் பாதுகாக்கிறது.
- source_word: מִלָּתִי
  choice: என் சொல்
  rationale: முதலாம் நபர் உரிமை விகுதியுடன் வரும் ஒருமைச் சொல்லை நெருக்கமாகக் காக்கிறது; இங்கு அது யோபுவின் உரையையோ கூற்றையையோ குறிக்கிறது.
