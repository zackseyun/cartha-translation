  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: ta
  text: தலைவர்களின் குரல் அடங்கிப்போனது[a]; அவர்களுடைய நாவு அவர்களுடைய வாயின் மேற்பகுதியில் ஒட்டிக்கொண்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தலைவர்களின் குரல் மறைந்தது.” இங்குள்ள எபிரெய வினையின் நேர்ப்பொருள் ‘மறைந்தது’; சூழலில் அது குரல் அடங்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவர்களுடைய நாவு அவர்களுடைய அண்ணத்தோடு ஒட்டிக்கொண்டது”; இது பேச முடியாமையையோ பேசாமல் இருந்ததையோ குறிக்கும் சொல்லோவியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: குரல்
  rationale: மனிதர்கள் பேசுவதைக் குறிக்கும் சூழலில் பொதுவான ‘ஒலி’ என்பதைவிட ‘குரல்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: נְגִידִים
  choice: தலைவர்கள்
  rationale: இச்சொல் தலைவர்கள், ஆட்சியாளர்கள், பிரபுக்கள் எனப் பொருள்படலாம். இங்கு அதிகாரமும் சமூகச் செல்வாக்கும் உடையவர்களைப் பொதுவாகக் குறிக்க ‘தலைவர்கள்’ ஏற்றது; அரச மரபைத் தேவையின்றி வரையறுப்பதையும் தவிர்க்கிறது.
- source_word: נֶחְבָּאוּ
  choice: அடங்கிப்போனது
  rationale: வினையின் அடிப்படைப் பொருள் ‘மறைந்தது’. ‘குரல்’ எழுவாயாக வரும்போது அது கேட்காமல் போனது, அதாவது அடங்கியது என்ற கவித்துவப் பொருளைத் தருகிறது. ‘அடங்கிப்போனது’ அந்த உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: וּלְשׁוֹנָם
  choice: அவர்களுடைய நாவு
  rationale: எபிரெயத்தில் பன்மை உரிமை விகுதியுடன் ஒருமைத் தொகுப்புப்பெயர் உள்ளது. தமிழிலும் ‘அவர்களுடைய நாவு’ எனக் கூறுவது கவிதை இணைப்பை இயல்பாகப் பேணுகிறது.
- source_word: לְחִכָּם
  choice: மேல்வாயில்
  rationale: இச்சொல் அண்ணம் அல்லது வாயின் மேற்பகுதியைக் குறிக்கிறது. ‘மேல்வாய்’ என்பது சாதாரண வாசகருக்குத் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: דָּבֵקָה
  choice: ஒட்டிக்கொண்டது
  rationale: ‘ஒட்டுதல், பற்றிக்கொள்ளுதல்’ என்பது வினையின் நேர்ப்பொருள். பேச முடியாமையையோ பேசாமல் இருப்பதையோ காட்டும் உருவகத்தை ‘ஒட்டிக்கொண்டது’ நேரடியாகக் காக்கிறது.
