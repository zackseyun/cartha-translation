  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: ta
  text: 'என் வேர் நீரை நோக்கிப் பரந்திருந்தது;

    பனித்துளி என் கிளையின்மேல்[a] இரவெல்லாம் தங்கியிருந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அறுவடையில்.” இங்குள்ள எபிரெயச் சொல் இந்தச் சூழலில் வழக்கத்திற்கு மாறானது. வேர், பனித்துளி ஆகிய தாவர உருவகங்களுடன் இயல்பாகப் பொருந்துவதால் “கிளை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: என் வேர்
  rationale: எபிரெயச் சொல் ஒருமையில் முதல் நபர் உரிமை விகுதியுடன் உள்ளது. தமிழிலும் ‘வேர்’ என்பதை ஒருமைக் கூட்டுப்பொருளில் இயல்பாகப் பயன்படுத்தலாம்.
- source_word: פָתוּחַ
  choice: பரந்திருந்தது
  rationale: திறக்கப்பட்ட அல்லது விரிந்த நிலையில் இருந்ததைக் குறிக்கும் செயப்பாட்டு வினையெச்சத்தின் கருத்தை, வேர் பற்றிய இயல்பான தமிழ் உருவகமாக இது வெளிப்படுத்துகிறது.
- source_word: אֱלֵי מָיִם
  choice: நீரை நோக்கி
  rationale: אֱלֵי என்பதிலுள்ள திசை அல்லது தொடர்பின் நுணுக்கத்தை ‘நோக்கி’ காக்கிறது; מָיִם இங்கு கூட்டுப்பொருளில் நீரைக் குறிக்கிறது.
- source_word: וְטַל
  choice: பனித்துளி
  rationale: טַל குறிக்கும் ‘dew’ என்பதை இன்றைய தமிழில் பனி அல்லது மூடுபனியுடன் குழப்பமின்றித் தெளிவாகத் தெரிவிக்கிறது.
- source_word: יָלִין
  choice: இரவெல்லாம் தங்கியிருந்தது
  rationale: לון வினையின் இரவைக் கழித்தல் அல்லது இரவு முழுவதும் நிலைத்திருத்தல் என்ற கால நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: בִּקְצִירִי
  choice: என் கிளையின்மேல்
  rationale: קָצִיר வழக்கமாக ‘அறுவடை’ எனப் பொருள்பட்டாலும், இச்சூழலில் வேர், நீர், பனித்துளி ஆகிய தாவர உருவகங்களுடன் ‘கிளை’ என்ற பொருள் இயல்பாகப் பொருந்துகிறது. சொல்லிலுள்ள முதல் நபர் உரிமை விகுதியும் காக்கப்படுகிறது.
