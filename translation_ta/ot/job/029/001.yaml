source:
  edition: WLC
  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/001.yaml
  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: ta
  text: யோபு மீண்டும் தன் உரையை எடுத்துக்கொண்டு கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் பழமொழியை,’ ‘தன் உவமையை,’ அல்லது ‘தன் வாக்கை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான மாஷால் (mashal) பரந்த பொருள் வீச்சுடையது; இங்கு அது யோபின் நீண்ட கவிதை உரையை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: தொடர்ந்து
  rationale: יסף என்பதன் அடிப்படைப் பொருள் ‘சேர்த்தல்’; இங்கு தொடர்ந்து மேலும் பேசுவதைக் குறிக்கும் எபிரெயக் கதைநடை அமைப்பு என்பதால் ‘தொடர்ந்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: שְׂאֵת
  choice: எடுத்துரைத்துச்
  rationale: נשׂא என்பதன் அடிப்படை உருவகம் ‘எடுத்தல்/சுமத்தல்.’ מָשָׁל உடனான மரபுத்தொடரில் ஓர் உரையை எடுத்துப் பேசுதல் என்று பொருள்படுவதால், அந்த உருவகத்தையும் இயல்பான தமிழையும் இணைக்க ‘எடுத்துரைத்துச்’ பயன்படுத்தப்பட்டது.
- source_word: מְשָׁלוֹ
  choice: தன் உரையை
  rationale: מָשָׁל என்பது பழமொழி, உவமை, வசைமொழி, விரிவான கவிதை உரை போன்ற பரந்த பொருள் வீச்சுடையது. இங்கு யோபின் நீண்ட கவிதை உரையை அறிமுகப்படுத்துவதால் ‘உரை’ சூழலுக்கு ஏற்றது; உடைமையை இயல்பான தமிழில் ‘தன்’ தெரிவிக்கிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் வழக்கமான கதைநடை வினை; தமிழில் இயல்பாகவும் மரியாதை ஒருமையுடனும் தரப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகருக்கு எளிதில் புரியும் வகையில், மூலத்தின் ‘தொடர்ந்து’ மற்றும் ‘எடுத்தல்’ ஆகிய இரு கூறுகளும் சுருக்கமான தமிழ் வாக்கியத்தில் காக்கப்பட்டுள்ளன. ‘பிரசங்கம்’ போன்ற சமயச் சார்புடைய சொல்லைவிட நடுநிலையான ‘உரை’ தேர்ந்தெடுக்கப்பட்டது.
