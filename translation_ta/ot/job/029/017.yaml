  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: ta
  text: 'நீதியற்றவனின் கோரப்பற்களை நான் உடைத்தேன்;

    அவன் பற்களிலிருந்து இரையை எறிந்துவிட்டேன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: கடைவாய்ப் பற்கள்
  rationale: இச்சொல் தாடை அல்லது கடிக்கும் பற்களைக் குறிக்கலாம்; வேட்டையாடும் விலங்கின் வலிமையான கடிபற்கள் என்ற உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עַוָּל
  choice: நீதியற்றவன்
  rationale: அநீதியாகச் செயல்படும் ஒருவனைக் குறிக்கும் ஆண்பால் ஒருமை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: טָרֶף
  choice: இரை
  rationale: பற்களுக்கிடையே சிக்கிய வேட்டைப் பொருள் என்ற உருவகத்தையும், ஒடுக்குபவனிடமிருந்து மீட்கப்படும் பலியையும் தக்கவைக்கிறது.
- source_word: אַשְׁלִיךְ
  choice: பறித்தெறிந்தேன்
  rationale: அடிப்படையில் ‘எறிந்தேன்/வீசினேன்’ என்பதைக் குறிக்கிறது; ‘பற்களிலிருந்து’ என்ற சூழலில் இரையை வலுக்கட்டாயமாக அகற்றி எறியும் செயலை இயல்பாக வெளிப்படுத்துகிறது; வெறுமனே ‘மீட்டேன்’ என்று பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: அநீதியாளனிடமிருந்து பாதிக்கப்பட்டவரை விடுவிக்கும் நீதிச் செயல்
  choice: வேட்டையாடும் விலங்கு உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘அவனிடமிருந்து பாதிக்கப்பட்டவரை மீட்டேன்’ என்று உருவகத்தை விளக்கிப் பெயர்த்தல்
  rationale: எபிரேய உரையின் வன்மையான கவித்துவப் படிமத்தையும், இரை என்பது நபரா அல்லது பொருளா என்ற திறந்த தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமும் கண்ணியமும் கொண்ட நேரடியான மொழிநடை. ‘கடைவாய்ப் பற்கள்’ என்பது அரிதான ‘கோரப்பற்கள்’ என்பதைக் காட்டிலும் மூலத்தின் தாடை/கடிபற்கள் படிமத்தைத் தெளிவாகக் காட்டுகிறது; இரண்டாம் அடியில் ஒருமை ஆண்பால் சுட்டுப்பெயர் பாதுகாக்கப்பட்டுள்ளது.
