source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר הָ֭יִיתִי בִּ/ימֵ֣י חָרְפִּ֑/י בְּ/ס֥וֹד אֱ֝ל֗וֹהַּ עֲלֵ֣י אָהֳלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/004.yaml
  text: as I was in the days of my prime[a], when God's intimate counsel was over my tent[b],
translation:
  language: ta
  text: இறைவனின் அந்தரங்க ஆலோசனை என் கூடாரத்தின்மேல் இருந்தபோது, என் வாழ்வின் உச்ச நாட்களில் நான் இருந்ததுபோலவும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: இருந்ததுபோல
  rationale: முந்தைய வளமான நாட்களுடன் ஒப்பிட்டு ஏங்கும் சூழலைக் கருத்தில் கொண்டு, எபிரெயச் சொல்லின் ஒப்புமைத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: הָיִיתִי
  choice: நான் ... இருந்த
  rationale: முதலாம் நபர் ஒருமை இறந்தகாலத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּימֵי חָרְפִּי
  choice: என் வாழ்வின் செழுமையான பருவத்தில்
  rationale: חֹרֶף என்பதன் அடிப்படைப் பருவகாலப் படிமம் இலையுதிர்/அறுவடைக் காலத்தைச் சுட்டலாம்; இங்கு யோபின் முழு வளர்ச்சியும் செழிப்பும் நிறைந்த காலத்தைக் குறிக்கும் பொருளை நவீன தமிழில் தருகிறது. நேரடியான பருவகால மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּסוֹד
  choice: நெருக்கமான ஆலோசனை
  rationale: סוֹד என்பதில் இரகசிய ஆலோசனை, நம்பிக்கைக்குரிய நெருக்கம், உளவுறவு ஆகிய பொருள் நிழல்கள் உள்ளன; இத்தேர்வு ஆலோசனை மற்றும் உறவு ஆகிய இரண்டையும் முற்றிலும் ஒன்றாகக் குறுக்காமல் காக்கிறது.
- source_word: אֱלוֹהַּ
  choice: இறைவனின்
  rationale: இங்கு வரும் தெய்வப் பெயரை மரியாதையும் இலக்கிய இயல்பும் கொண்ட பொதுத் தமிழ்ச் சொல்லால் வழங்குகிறது; உடைமைத் தொடர்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: עֲלֵי
  choice: மேல் நிலைத்திருந்த
  rationale: யோபின் கூடாரத்தின்மேல் விரிந்திருந்த இறைநெருக்கம் அல்லது ஆதரவின் படிமத்தைத் தக்கவைத்து, தமிழில் பொருள் தெளிவாக இருக்கச் செய்கிறது.
- source_word: אָהֳלִי
  choice: என் கூடாரம்
  rationale: வீடு அல்லது குடும்பம் என்ற உட்பொருள் இருக்கக்கூடியபோதும், மூலத்தின் தெளிவான ‘கூடாரம்’ என்ற படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּסוֹד אֱלוֹהַּ கூறும் யோபின் முந்தைய இறைஉறவின் தன்மை
  choice: இறைவனின் நெருக்கமான ஆலோசனை யோபின் கூடாரத்தின்மேல் நிலைத்திருந்தது
  alternative: இறைவனின் இரகசிய ஆலோசனை என் கூடாரத்தின்மேல் இருந்தது; இறைவனின் நட்பு என் கூடாரத்தின்மேல் இருந்தது
  rationale: எபிரெயச் சொல் நம்பிக்கைக்குரிய நெருக்கம், ஆலோசனை, அருள் நிறைந்த உடனிருப்பு ஆகியவற்றை ஒருங்கே உணர்த்த முடியும். மொழிபெயர்ப்பு இதை வெறும் நட்பாகவோ, தனிப்பட்ட மறைவெளிப்பாட்டுக்கான தொழில்நுட்பச் சொல்லாகவோ குறுக்காமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் கொண்ட நடையில் வடிவமைக்கப்பட்டுள்ளது. வசனம் முந்தைய வரிகளுடன் இலக்கண ரீதியாகத் தொடரும் நினைவுக் கூற்றாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘கூடாரம்’ என்ற மூலப் படிமமும், ‘ஆலோசனை’ என்பதிலுள்ள உறவு–இரகசியம் சார்ந்த பொருள் பரப்பும் காக்கப்பட்டுள்ளன.
