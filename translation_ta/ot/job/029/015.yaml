lexical_decisions:
- source_word: עֵינַיִם
  choice: கண்களாக
  rationale: உதவியும் வழிகாட்டுதலும் அளித்ததைச் சித்தரிக்கும் மூலமொழியின் உறுதியான உருவகத்தைப் பேணுகிறது.
- source_word: הָיִיתִי
  choice: இருந்தேன்
  rationale: இவ்விடத்தில் வினைச்சொல் யோபுவின் கடந்தகாலப் பங்கையோ நிலையையோ குறிக்கிறது; அதனால் இயல்பான இறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לַעִוֵּר
  choice: பார்வையற்றவருக்கு
  rationale: ஒருமை வடிவத்தின் பொதுப்பொருளைப் பேணுவதோடு, இன்றைய தமிழில் மரியாதையானதும் தெளிவானதுமான சொல்லாக்கமாக உள்ளது.
- source_word: וְרַגְלַיִם
  choice: கால்களாகவும்
  rationale: முதல் அடியிலுள்ள ‘கண்கள்’ என்ற உருவகத்திற்கு இணையான, நகர உதவுவதைக் குறிக்கும் மூல உருவகத்தை அப்படியே பேணுகிறது.
- source_word: לַפִּסֵּחַ
  choice: நடப்பதில் சிரமமுள்ளவருக்கு
  rationale: உடல் நிலையை இழிவுபடுத்தாமல், மூலச்சொல் குறிக்கும் நடக்க இயலாமை அல்லது நடைத் தடையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אָֽנִי
  choice: நானே
  rationale: வாக்கிய இறுதியில் வரும் தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
