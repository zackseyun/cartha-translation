  text: who does great things beyond searching out[b][a], and wonders beyond number.
translation:
  language: ta
  text: ஆராய்ந்து அறிய முடியாத மகத்தான செயல்களையும்[a], எண்ணிக்கைக்கு அப்பாற்பட்ட அதிசயங்களையும்[b] செய்கிறவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆராய்ச்சிக்கு எட்டாத.” இங்கு வரும் எபிரெய மொழிவழக்கு, அவருடைய மகத்தான செயல்களை முழுமையாக ஆராய்ந்து புரிந்துகொள்ள முடியாது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எண்ண முடியாத.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: செய்கிறவர் அவர்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட கடவுளை விவரிக்கும் Qal வினையெச்சத்தின் தொடர்ச்சியான செயற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גְדֹלוֹת
  choice: மகத்தான செயல்கள்
  rationale: பெண்பால் பன்மை பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்பட்டு, மாபெரும் காரியங்கள் அல்லது செயல்களைப் பரந்த பொருளில் குறிக்கிறது.
- source_word: עַד אֵין חֵקֶר
  choice: ஆராய்ந்து அறிய முடியாத
  rationale: முழுமையாக ஆராயவோ புரிந்துகொள்ளவோ இயலாத தன்மையைக் குறிக்கும் எபிரெய மொழிவழக்கைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְנִפְלָאוֹת
  choice: அதிசயங்கள்
  rationale: வியப்பையும் பிரமிப்பையும் உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கும் சொல்லின் செறிவான இயல்பான தமிழ் இணை.
- source_word: עַד אֵין מִסְפָּר
  choice: எண்ணிக்கைக்கு அப்பாற்பட்ட
  rationale: எண்ண முடியாத அளவிலானது என்ற பொருளைத் தக்கவைத்து, முந்தைய இணைத் தொடரின் அமைப்பையும் பிரதிபலிக்கிறது.
