  text: יָגֹ֥רְתִּי כָל עַצְּבֹתָ֑/י יָ֝דַ֗עְתִּי כִּי לֹ֥א תְנַקֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: ta
  text: என் வேதனைகள் அனைத்தையும் நான் அஞ்சுகிறேன்[a]; நீர் என்னைக் குற்றமற்றவன் என்று தீர்ப்பளிக்கமாட்டீர்[b] என எனக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் துயரங்கள் அனைத்தையும் நான் அஞ்சுகிறேன்’ அல்லது ‘என் துன்பங்கள் அனைத்தையும் நான் அஞ்சுகிறேன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீர் என்னைக் குற்றமற்றவன் என்று கருதமாட்டீர்’ அல்லது ‘நீர் என்னைத் தண்டிக்காமல் விடமாட்டீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: நான் அஞ்சுகிறேன்
  rationale: גור என்பதன் Qal முற்றுவினை முதல் நபர் ஒருமை வடிவம் அச்சம் அல்லது திகிலை வெளிப்படுத்துகிறது. சூழலில் தொடரும் மனநிலையை இயல்பான நவீன தமிழில் கூற நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: כָל עַצְּבֹתָי
  choice: என் வேதனைகள் அனைத்தையும் நினைத்து
  rationale: כָל என்பது ‘அனைத்தும்’; עַצְּבֹתָי என்பது ‘என் வேதனைகள்/துயரங்கள்/துன்பங்கள்.’ தமிழில் அச்சத்தின் பொருளை இயல்பாக இணைக்க ‘நினைத்து’ சேர்க்கப்பட்டுள்ளது; அது புதிய காரணத்தைச் சேர்க்காமல் சொற்றொடரின் உறவை வெளிப்படுத்துகிறது.
- source_word: יָדַעְתִּי
  choice: எனக்குத் தெரியும்
  rationale: ידע என்பதன் Qal முற்றுவினை இங்கு தற்போதைய உறுதியான அறிவைச் சுட்டுகிறது.
- source_word: כִּי
  choice: என
  rationale: யோபு அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பான தமிழில் ‘என’ அமைக்கப்பட்டது.
- source_word: לֹא תְנַקֵּנִי
  choice: நீர் என்னைக் குற்றமற்றவன் என்று தீர்ப்பளிக்கமாட்டீர்
  rationale: נקה என்பதன் Piel வடிவம் நீதிமன்றச் சூழலில் குற்றமற்றவர் என்று அறிவித்தல் அல்லது விடுவித்தலைக் குறிக்கலாம். இங்கு சட்டவியல் நுணுக்கத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: தேவனை நோக்கிய யோபுவின் உரையில் נקה என்பதன் நீதிமன்றப் பொருள்
  choice: நீர் என்னைக் குற்றமற்றவன் என்று தீர்ப்பளிக்கமாட்டீர்
  alternative: நீர் என்னை நிரபராதி என்று ஏற்றுக்கொள்ளமாட்டீர்; நீர் என்னைத் தண்டிக்காமல் விடமாட்டீர்
  rationale: யோபுவின் கூற்று, தேவன் தன்னை நீதித்தீர்ப்பில் குற்றமற்றவன் என அறிவிக்கமாட்டார் என்ற உறுதியை வெளிப்படுத்துகிறது. இந்த மொழிபெயர்ப்பு பிற்காலக் கோட்பாட்டைச் சேர்க்காமல் மூலத்தின் சட்டவியல் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய மரியாதைப் பன்மை ‘நீர்/மாட்டீர்’ காக்கப்பட்டுள்ளது. நீதிமன்றச் சார்ந்த நுணுக்கத்தையும் ‘வேதனைகள்’ என்ற உடல்-உள அனுபவத்தை உள்ளடக்கும் சொல்லையும் முன்னிறுத்துகிறது.
