  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: ta
  text: ஒருவன் அவரோடு வழக்காட விரும்பினால்[a], ஆயிரத்தில் ஒரு முறைகூட அவருக்குப் பதிலளிக்க முடியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழக்காட” என்பதற்கு “வாதிட” அல்லது “தன் வழக்கை எடுத்துரைக்க” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் சட்டரீதியான மோதல் நுணுக்கத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “ஆயிரத்தில் ஒன்றுக்குக்கூட அவருக்குப் பதிலளிக்க முடியாது.” இது ஆயிரம் முறைகளில் ஒரு முறைகூட பதிலளிக்க இயலாது என்ற மிகைப்படுத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יַחְפֹּץ
  choice: விரும்பினாலும்
  rationale: நிபந்தனையையும் விருப்பத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; சூழலில் இது அனுமதிப்பொருள் கொண்ட நிபந்தனையாகச் செயல்படுகிறது.
- source_word: לָרִיב
  choice: வழக்காட
  rationale: ריב என்பதிலுள்ள மோதல் மற்றும் நீதிமன்ற வழக்கு சார்ந்த நுணுக்கங்களைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: எபிரேயத்தின் ‘அவருடன்’ என்ற வடிவைத் தக்கவைத்து, ‘வழக்காட’ என்பதன் மூலம் எதிர்நிலை உணர்த்தப்படுகிறது. மரியாதைப் பன்மை சூழலில் தேவனைச் சுட்டுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יַעֲנֶנּוּ
  choice: அவருக்குப் பதிலளிக்க முடியாது
  rationale: ענה என்பதன் ‘பதிலளி’ என்ற பொருளையும், சூழலில் வெறும் மறுப்பை அல்ல இயலாமையை உணர்த்தும் வலிமையையும் தருகிறது.
- source_word: אַחַת מִנִּי אָלֶף
  choice: ஆயிரத்தில் ஒன்றுக்குக்கூட
  rationale: ‘ஆயிரத்திலிருந்து ஒன்று’ என்ற எபிரேய மிகைப்படுத்தலை இயல்பான தமிழில் வழங்கி, ஒரே ஒரு கேள்விக்குக்கூட பதில் சொல்ல இயலாது என்ற சூழல்பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் சுட்டுப்பெயர்களின் குறிப்பு
  choice: மனிதன் தேவனோடு வழக்காட முயன்றால், தேவனுக்குப் பதிலளிக்க இயலாது என்ற சூழல்சார் வாசிப்பு
  alternative: இரு மனிதர்களுக்கிடையிலான பொதுவான தகராறு
  rationale: யோபு 9:2–4 தேவனுடைய ஞானத்தையும் வல்லமையையும் பற்றியது. இருப்பினும் மூலத்தில் இல்லாத ‘தேவன்’ என்பதை வசனத்தில் நேரடியாகச் சேர்க்காமல், சுட்டுப்பெயர் அமைப்பைத் தக்கவைத்துள்ளது.
- issue: לֹא என்பதுடன் வரும் வினையின் நுட்பம்
  choice: 'இயலாமை: ‘பதிலளிக்க முடியாது’'
  alternative: 'மறுப்பு அல்லது எதிர்கால நிகழ்வு: ‘பதிலளிக்கமாட்டான்’'
  rationale: தேவனோடு வாதிடும் மனிதனின் போதாமையே உடனடிச் சூழலின் கருத்து; ஆகவே இயலாமை முதன்மைப்படுத்தப்படுகிறது, மாற்று சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை. ‘அவரோடு/அவருக்கு’ என்ற மரியாதை வடிவம் தமிழில் தேவனைச் சுட்டும் சூழலுக்கு இயல்பானது; மூலத்தில் உள்ள சுட்டுப்பெயர் மறைமுகம் காக்கப்பட்டுள்ளது. ‘வழக்காட’ சட்ட நுணுக்கத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு பொதுவான ‘வாதிட’ என்ற மாற்றையும் தருகிறது.
