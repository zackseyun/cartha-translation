source:
  edition: WLC
  text: אַֽ֭דַבְּרָה וְ/לֹ֣א אִירָאֶ֑/נּוּ כִּ֥י לֹא כֵ֥ן אָ֝נֹכִ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: ta
  text: அப்போது நான் அவருக்குப் பயப்படாமல் பேசுவேன்[a]; ஏனெனில், என்னைப் பொறுத்தவரை அப்படியல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிச் சொற்றொடரை, “ஏனெனில், என்னிடத்தில் அப்படியில்லை” என்றும், இன்னும் சொல்லுக்குச் சொல்லாக, “ஏனெனில், நான் என்னோடு அப்படியல்ல” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடரில் விடுபட்ட சொற்கள் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: அப்போது நான் பேசுவேன்
  rationale: முதல் நபர் ஒருமை வடிவத்தின் விருப்ப/கற்பனை சார்ந்த வலிமையையும், முந்தைய வசனத்தில் கூறப்பட்ட நிலை நிறைவேறினால் பேசுவேன் என்ற தொடர்ச்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: அவருக்குப் பயப்படாமல்
  rationale: ירא என்பதன் ‘பயப்படுதல்’ என்ற நேரடியான பொருளையும், மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டையும் காக்கிறது; தமிழில் இணைந்த வினையெச்சமாக இயல்பாக அமைகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא כֵן
  choice: அப்படியல்ல
  rationale: ‘அவ்வாறு அல்ல’ என்ற சுருக்கமான ஒப்பீட்டுப் பொருளை நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָנֹכִי עִמָּדִי
  choice: என் நிலை
  rationale: சொல்லுக்குச் சொல் ‘நான் என்னுடன்’ என வரும் தெளிவற்ற எபிரெயச் சொற்றொடரின் சுயநிலை/தற்போதைய சூழ்நிலை சார்ந்த பொருளை அளிக்கிறது; அதன் நீள்விடுபாட்டை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: இறுதி உட்கூற்றின் நீள்விடுபாடும் பொருள்தெளிவின்மையும்
  choice: ஏனெனில் என் நிலை அப்படியல்ல
  alternative: ஏனெனில் என்னுடன் அப்படி இல்லை; ஏனெனில் நான் என்னுடன் அப்படியல்ல
  rationale: எபிரெய இறுதி உட்கூறு சுருக்கமாகவும் நீள்விடுபாடுடையதாகவும் உள்ளது. முதன்மை உரை வாசிக்கத்தக்க தமிழை வழங்குகிறது; அடிக்குறிப்பு அதன் நேரடி வடிவத்தையும் மாற்றுப் புரிதல்களையும் பாதுகாக்கிறது. யோபுவின் உளவியல் அல்லது இறையியல் நிலையைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘அவர்’ என்பது இறைவனைக் குறிக்கும் மரியாதை ஒருமை; மூலத்தின் ஆண்பால் ஒருமை பின்னொட்டைத் தேவையற்ற விளக்கமின்றி பிரதிபலிக்கிறது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
