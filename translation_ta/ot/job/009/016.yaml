- from: நான் கூப்பிட்டு, அவர் எனக்குப் பதிலளித்தாலும்,[a] என் குரலுக்கு அவர் செவிகொடுத்தார் என்று நான் நம்பமாட்டேன்.
  to: நான் அழைத்து அவர் எனக்குப் பதிலளித்தாலும்,[a] என் குரலுக்கு அவர் செவிகொடுக்கிறார் என்று நான் நம்பமாட்டேன்.
