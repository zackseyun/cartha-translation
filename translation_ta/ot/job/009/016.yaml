source:
  edition: WLC
  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: ta
  text: நான் அழைத்து அவர் எனக்குப் பதிலளித்தாலும்,[a] என் குரலுக்கு அவர் செவிகொடுக்கிறார் என்று நான் நம்பமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கூக்குரலிட்டு அவர் எனக்குப் பதிலளித்தாலும், என் குரலுக்கு அவர் செவிசாய்க்கிறார் என்று நான் நம்பமாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -ஆலும்
  rationale: இங்கு ஒரு கற்பனை நிபந்தனை சலுகைப் பொருளுடன் வருகிறது; தமிழில் ‘பதிலளித்தாலும்’ என்பது ‘அப்படியே நடந்தாலும்கூட’ என்ற பதற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קָרָאתִי
  choice: நான் கூப்பிட்டு
  rationale: קרא என்பதன் பொதுவான ‘கூப்பிடு/அழை’ என்ற பொருளைத் தக்கவைக்கிறது; ‘கதறினேன்’ போன்ற அதிக உணர்ச்சியைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: וַיַּעֲנֵנִי
  choice: அவர் எனக்குப் பதிலளித்தாலும்
  rationale: ענה என்பதன் நேரடியான ‘பதிலளித்தல்’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא אַאֲמִין
  choice: நான் நம்பமாட்டேன்
  rationale: நிபந்தனைச் சூழலில் வரும் நிறைவேறாத வினையின் கருத்தைத் தமிழின் எதிர்கால மறுப்பு இயல்பாகக் காட்டுகிறது.
- source_word: כִּי
  choice: என்று
  rationale: இது காரணத்தைக் குறிப்பிடாமல், யோபு நம்பமாட்டார் எனக் கூறும் கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: יַאֲזִין
  choice: செவிகொடுத்தார்
  rationale: אזן என்பது வெறுமனே ஒலி கேட்டதைக் காட்டிலும் கவனமாகக் கேட்பதைக் குறிக்கிறது; ‘செவிகொடுத்தார்’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: קוֹלִי
  choice: என் குரலுக்கு
  rationale: קוֹלִי என்பதன் நேரடியான ‘என் குரல்’ வடிவத்தைப் பாதுகாக்கிறது; அதை ‘என் வேண்டுதல்’ என்று விளக்கிப் பொருள்கொள்ளவில்லை.
theological_decisions:
- issue: இறைவனின் பதிலும் செவிகொடுத்தலும் குறித்த யோபுவின் கூற்று
  choice: இறைவன் பதிலளித்தாலும்கூட அவர் உண்மையில் செவிகொடுத்தார் என்பதை யோபு நம்பமாட்டார் என்ற தனிப்பட்ட, கற்பனைச் சூழல் கூற்றாக மொழிபெயர்த்தல்.
  alternative: இறைவன் ஒருபோதும் கேட்பதில்லை என்ற முழுமையான மறுப்பாகவோ, வெறும் வியப்பாகவோ மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை யோபுவின் மனநிலையையும் நம்ப இயலாத பதற்றத்தையும் வெளிப்படுத்துகிறது; ஜெபத்தை இறைவன் ஒருபோதும் கேட்பதில்லை என்ற பொதுக் கோட்பாட்டை அது நேரடியாக நிறுவுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘கூப்பிட்டு’ என்பது மூலத்தின் பரந்த பொருளை வழங்குகிறது; ‘செவிகொடுத்தார்’ என்பது கவனமாகக் கேட்டல் என்ற நுணுக்கத்தைத் தக்கவைக்கிறது. அடிக்குறி குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
