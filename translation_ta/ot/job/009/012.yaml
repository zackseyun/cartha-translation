source:
  edition: WLC
  text: הֵ֣ן יַ֭חְתֹּף מִ֣י יְשִׁיבֶ֑/נּוּ מִֽי יֹאמַ֥ר אֵ֝לָ֗י/ו מַֽה תַּעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: ta
  text: இதோ, அவர் பறித்துக்கொண்டால்[a], அவரைப் பின்வாங்கச் செய்ய யாரால் முடியும்? “நீர் என்ன செய்கிறீர்?” என்று அவரிடம் யார் சொல்ல முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் திடீரென்று கைப்பற்றினால்” அல்லது “அவர் கவர்ந்து சென்றால்.” எபிரெய வினைச்சொல் திடீரான, வலுக்கட்டாயமான எடுத்துக்கொள்ளுதலை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יַחְתֹּף
  choice: பறித்துக்கொண்டால்
  rationale: חטף குறிக்கும் திடீரான, வலுக்கட்டாயமான எடுத்துச் செல்லுதலைத் தமிழில் வெளிப்படுத்துகிறது; மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יְשִׁיבֶנּוּ
  choice: அவரைத் திருப்பிவிட
  rationale: Hiphil வடிவின் ‘திரும்பச் செய்/பின்வாங்கச் செய்’ என்ற பொருளைத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டைச் சூழலின்படி கடவுளைக் குறிக்கும் தனிப்பட்ட சுட்டாக வைத்திருக்கிறது.
- source_word: מִי
  choice: யாரால் முடியும் / யார் ... முடியும்
  rationale: இவை வெறும் அடையாள வினாக்கள் அல்ல, இயலாமையை உணர்த்தும் சொல்லாட்சிக் கேள்விகள்; தமிழில் அதன் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֹאמַר אֵלָיו
  choice: அவரிடம் ... என்று யார் கேட்க முடியும்
  rationale: சொல்லுக்குச் சொல் ‘அவரிடம் யார் சொல்வார்?’ என்பதாக இருந்தாலும், தொடர்ந்து வரும் நேரடி வினாவுடன் தமிழில் ‘கேட்க’ என்பது இயல்பாக அமைகிறது; எதிர்த்துக் கேட்கும் கருத்தைத் தனியே சேர்க்கவில்லை.
- source_word: מַה תַּעֲשֶׂה
  choice: நீர் என்ன செய்கிறீர்?
  rationale: செயலைக் குறித்து நேரடியாகக் கேள்வி எழுப்பும் எபிரெயச் சொல்லாட்சியை நிகழ்கால மரியாதை ஒருமையில் தருகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: ‘அவர்... அவரை... அவரிடம்’ என்று கடவுளைக் குறிக்கும் தனிப்பட்ட சுட்டாக மொழிபெயர்த்தல்
  alternative: கடவுள் பறித்துக்கொள்வதைப் பொருளாகக் கொண்டு ‘அதைத் திருப்பிக் கொண்டுவர’ என்று மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் கடவுளின் தடுக்க முடியாத செயலைப் பற்றியது; அடுத்த அரையடியில் அவரிடமே நேரடியாகக் கேட்பது இதை ஆதரிக்கிறது. ஆயினும் יְשִׁיבֶנּוּ வடிவிலுள்ள பின்னொட்டு இலக்கண ரீதியில் ‘அவன்/அதை’ என இருக்கக்கூடியதால் மாற்று வாசிப்பு குறிப்பிடத்தக்கது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்/செய்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. சொல்லாட்சிக் கேள்விகளின் இயலாமை உணர்வு ‘முடியும்’ என்பதால் வெளிப்படுகிறது.
