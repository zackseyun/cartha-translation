- from: இதோ, அவர் பறித்துக்கொண்டால்[a], அவரைத் திருப்பிவிட யாரால் முடியும்? அவரிடம், “நீர் என்ன செய்கிறீர்?” என்று யார் கேட்க முடியும்?
  to: இதோ, அவர் பறித்துக்கொண்டால்[a], அவரைப் பின்வாங்கச் செய்ய யாரால் முடியும்? “நீர் என்ன செய்கிறீர்?” என்று அவரிடம் யார் சொல்ல முடியும்?
