lexical_decisions:
- source_word: אִם אָמְרִי
  choice: என்று நான் சொன்னால்
  rationale: אִם அறிமுகப்படுத்தும் அனுமான நிபந்தனையையும், אָמְרִי என்பதன் முதலாம் நபர் சொல்லையும் இயல்பான தமிழில் நிபந்தனை வினையாகக் காட்டுகிறது.
- source_word: אֶשְׁכְּחָה
  choice: மறந்துவிடுவேன்
  rationale: யோபு தனக்குள் முன்வைக்கும் உறுதியை நேரடியான எதிர்கால வடிவில் வெளிப்படுத்துகிறது.
- source_word: שִׂיחִי
  choice: என் முறையீட்டை
  rationale: இச்சொல் உள்ளார்ந்த சிந்தனை, புலம்பல் அல்லது முறையீட்டைக் குறிக்கலாம்; யோபின் புலம்பல் சூழலில் ‘முறையீடு’ பொருத்தமாக உள்ளது.
- source_word: אֶעֶזְבָה פָנַי
  choice: என் துயர முகத்தை மாற்றி
  rationale: சொல்லர்த்தமாக ‘என் முகத்தை விட்டுவிடுவேன்’; இங்கு சோர்ந்த முகபாவத்தை விலக்குவதைச் சுட்டும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְאַבְלִיגָה
  choice: மகிழ்ச்சியாயிருப்பேன்
  rationale: בלג இங்கு துயரத்தைத் தளர்த்தி முகமலர்ச்சியுடன் இருக்க முயல்வதைக் குறிக்கிறது; சொல்லின் உணர்ச்சிசார் வலிமையை இயல்பாகத் தருகிறது.
