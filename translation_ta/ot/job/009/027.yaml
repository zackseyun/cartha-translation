  text: “என் முறையீட்டை[a] மறந்துவிடுவேன்; என் சோகமான முகத்தை ஒதுக்கிவிட்டு மகிழ்ச்சியாக இருப்பேன்” என்று நான் சொன்னால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் முறையீடு’ என்பதற்கு ‘என் உள்ளார்ந்த சிந்தனை’ அல்லது ‘என் தியானம்’ என்றும் பொருள் கொள்ளலாம். ஆனால் இப்புலம்பல் சூழலில் ‘முறையீடு’ பொருத்தமாக உள்ளது.
