source:
  edition: WLC
  text: נֹטֶ֣ה שָׁמַ֣יִם לְ/בַדּ֑/וֹ וְ֝/דוֹרֵ֗ךְ עַל בָּ֥מֳתֵי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/008.yaml
  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: ta
  text: 'வானங்களை விரிப்பவரும்,

    கடலின் உயரங்கள்மேல் மிதிப்பவரும் அவர் ஒருவரே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலின் அலைகள்மேல் நடப்பவர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: விரித்து
  rationale: נטה என்ற Qal வினையெச்சம் விரித்தல் அல்லது பரப்புதல் என்பதைக் குறிக்கிறது. தொடர்ச்சியான விளக்கச் செயலைத் தமிழில் இயல்பாகக் காட்ட இவ்வடிவம் ஏற்றது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: கவிதைநயமிக்க படைப்பியல் சூழலில் இது காணக்கூடிய வானத்தை மட்டும் அல்லாமல் வானவெளிகளைக் குறிக்கிறது; எபிரெயச் சொல்லின் பன்மை வடிவத்தையும் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: לְבַדּוֹ
  choice: அவர் ஒருவரே
  rationale: கடவுள் துணையின்றித் தனியாகச் செயல்படுகிறார் என்ற வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: וְדוֹרֵךְ
  choice: மிதிக்கிறார்
  rationale: דרך என்பது காலால் மிதித்தல் அல்லது மேலே நடத்தல் என்னும் காட்சியைத் தருகிறது. அழித்தல் என்ற கூடுதல் பொருளைச் சேர்க்காமல் அதன் வலிமையான உருவகத்தை இது காக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: இடத்தைக் குறிக்கும் எளிய, இயல்பான தமிழ் உருபு.
- source_word: בָּמֳתֵי
  choice: உயரங்கள்
  rationale: במה என்பதன் அடிப்படைப் பொருள் ‘உயரம்/உயர்ந்த இடம்.’ கடலின் உயர்ந்த மேற்பரப்புகள், அதாவது அலைகள், என்ற கவிதை உருவகத்தை விளக்கமாக மாற்றாமல் முதன்மை உரையில் காக்கிறது.
- source_word: יָם
  choice: கடல்
  rationale: எபிரெய மூலத்தின் ஒருமையைப் பின்பற்றி, படைப்பியல் கவிதைப் படிமத்துக்கு ஏற்ற பொதுப்பெயராக வழங்கப்படுகிறது.
theological_decisions:
- issue: படைப்பின்மேல் கடவுளுடைய தனித்த இறையாண்மையைக் காட்டும் அண்டவியல் படிமம்
  choice: கடவுள் ஒருவரே வானங்களை விரித்து கடலின் உயரங்கள்மேல் மிதிப்பதாகிய கவிதைப் படிமத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘கடலின் அலைகள்மேல் நடக்கிறார்’ என்று பொருள் விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் கடவுளுடைய தனித்த இறையாண்மையை உயர்ந்த கவிதை மொழியில் சித்தரிக்கிறது. முதன்மை உரை மூலத்தின் உருவகத்தையும் உண்மையான சொற்பொருள் நெருக்கடியையும் காக்கிறது; சாத்தியமான இடியம்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணைச் செயல்களையும் வரிப்பிரிப்பு வெளிப்படுத்துகிறது; ‘உயரங்கள்’ என்ற சற்றே அபூர்வமான படிமம் மூல எபிரெயத்தின் கவிதைத் தெளிவின்மையைப் பாதுகாக்கிறது.
