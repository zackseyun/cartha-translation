  edition: WLC
  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: ta
  text: அவரே கரடி விண்மீன் கூட்டத்தையும்[b], ஓரியனையும், கார்த்திகை விண்மீன் கூட்டத்தையும், தென்திசையின் அறைகளையும்[c] படைத்தவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைக்கிறவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினையெச்சம் தொடர்ந்து நடைபெறும் செயலைக் குறிக்கவும், நிறைவேற்றப்பட்ட செயலைக் குறிக்கவும் முடியும்.
    reason: lexical_alternative
  - marker: b
    text: ‘கரடி விண்மீன் கூட்டம்’ என்பது இங்கு ஒரு விண்மீன் கூட்டத்திற்கான எபிரெயப் பெயரை மொழிபெயர்க்கிறது. அதன் துல்லியமான வானியல் அடையாளம் உறுதியானதல்ல.
    reason: alternative_reading
  - marker: c
    text: ‘தென்திசையின் அறைகள்’ என்பது தெற்கு வானத்தின் மறைந்த பகுதிகளையோ அங்குள்ள விண்மீன் கூட்டங்களையோ கவித்துவமாகக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: படைத்தவர்
  rationale: עשה என்பதன் Qal வினையெச்ச வடிவம், முந்தைய வசனத்தில் தொடங்கிய கடவுளைப் பற்றிய விளக்கத்தைத் தொடர்கிறது. சூழலில் படைப்புச் செயலைக் குறிக்க இறந்தகாலப் பொருளுள்ள ‘படைத்தவர்’ இயல்பாக உள்ளது; நிகழ்ந்துகொண்டிருக்கும் அல்லது வழக்கமான செயலைக் குறிக்கும் ‘படைக்கிறவர்’ என்பதும் இலக்கணப்படி சாத்தியம்.
- source_word: עָשׁ
  choice: பெருங்கரடி விண்மீன் கூட்டம்
  rationale: இது ஒரு விண்மீன் கூட்டத்தின் பெயர். ‘பெருங்கரடி விண்மீன் கூட்டம்’ என்பது சாத்தியமான வானியல் அடையாளத்தைத் தெளிவாகக் கூறுகிறது; ஒலிபெயர்ப்பைவிட நவீனத் தமிழ் வாசகருக்கு எளிதில் புரியும்.
- source_word: כְּסִיל
  choice: ஓரியன்
  rationale: வானியல் சூழலில் இச்சொல் பொதுவாக ஓரியன் விண்மீன் கூட்டத்தைக் குறிக்கிறது. வழக்கிலுள்ள தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: כִימָה
  choice: கார்த்திகை விண்மீன் கூட்டம்
  rationale: இது பொதுவாக Pleiades எனப்படும் விண்மீன் கூட்டமாக அடையாளப்படுத்தப்படுகிறது. தமிழில் அறியப்பட்ட ‘கார்த்திகை விண்மீன் கூட்டம்’ தெளிவான இணையாகும்.
- source_word: חַדְרֵי תֵמָן
  choice: தென்திசையின் அறைகள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘தெற்கின்/தென்திசையின் அறைகள்’ என்பதாகும். விண்மீன் கூட்டங்களின் சூழலில் தெற்கு வானத்தின் மறைந்த பகுதிகளை இது கவித்துவமாகக் குறிக்கலாம்; ஆனால் அந்த விளக்கத்தை மூல உரைக்குள் சேர்க்காமல் அதன் உருவகத்தையும் தெளிவின்மையையும் இம்மொழிபெயர்ப்பு காக்கிறது.
