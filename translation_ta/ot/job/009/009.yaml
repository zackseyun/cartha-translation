  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கவித்துவ மரியாதை குன்றாததாயும் வடிவமைக்கப்பட்டது. ‘தென்திசையின் அறைகள்’ என்ற நேரடி உருவகம் பாதுகாக்கப்பட்டுள்ளது; விண்மீன் பெயர்களுக்கு வாசகருக்கு அறிமுகமான வானியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
