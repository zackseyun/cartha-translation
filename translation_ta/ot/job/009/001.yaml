translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையாடல் சூத்திரத்தின் இரு வினைகளையும் பொருளில் பாதுகாத்தபடி, தமிழில் தேவையற்ற மீளுரைப்பாகத் தோன்றாமல் ‘மறுமொழியாகச் சொன்னது’ என அமைக்கப்பட்டுள்ளது. அடுத்துவரும் செய்யுள் உரையை அறிமுகப்படுத்தும் மரபான தமிழ் நடை காரணமாக அஃறிணை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
