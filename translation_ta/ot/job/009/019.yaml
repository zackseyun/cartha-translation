  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: ta
  text: வலிமையைப் பற்றியதென்றால், இதோ, அவரே வல்லவர்; நீதிவிசாரணையைப் பற்றியதென்றால்[b], என்னை விசாரணைக்கு வரவழைப்பவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல் இங்கு பொருள் காண்பதற்குக் கடினமானது. இதை, “எனக்கு விசாரணை நாளைக் குறிப்பவர் யார்?” என்றும் மொழிபெயர்க்கலாம். சூழலை முன்னிட்டு சிலர், “அவரை விசாரணைக்கு வரவழைப்பவர் யார்?” என்று பொருள் கொள்கிறார்கள்; ஆனால் மசோரா உரையின் வடிவம் நேரடியாக “என்னை” என்றே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: “நீதிவிசாரணை” என்பதற்கு “நீதித் தீர்ப்பு” அல்லது “சட்டவழக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֹחַ
  choice: வலிமையைப் பற்றியதென்றால்
  rationale: 'לְ இங்கு பேசப்படும் விவகாரத்தின் துறையைச் சுட்டுகிறது: ‘வலிமையைப் பொறுத்தவரை’ அல்லது ‘வலிமை பற்றியதானால்.’ இயல்பான தமிழில் நிபந்தனைத் தோற்றத்தைப் பாதுகாக்கிறது.'
- source_word: אַמִּיץ
  choice: வல்லவர்
  rationale: மிகுந்த, எதிர்க்க முடியாத வலிமையைச் சுட்டுகிறது. முன்வரும் ‘வலிமை’ என்பதைக் கடினமாகத் திரும்பச் சொல்லாமல் உயர்ந்த தொனியைத் தக்கவைக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலியுறுத்தலையும் யோபுவின் கூற்றிலுள்ள சொல்லாட்சித் தாக்கத்தையும் காக்கிறது.
- source_word: לְמִשְׁפָּט
  choice: நீதிவிசாரணையைப் பற்றியதென்றால்
  rationale: מִשְׁפָּט என்பதன் நீதி, தீர்ப்பு, சட்டவழக்கு ஆகிய அர்த்த எல்லைகளில், சுற்றியுள்ள நீதிமன்றச் சூழலை வெளிப்படுத்த ‘நீதிவிசாரணை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִי
  choice: யார்?
  rationale: பதில் எதிர்பாராத சொல்லாட்சிக் கேள்வியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יוֹעִידֵנִי
  choice: என்னை விசாரணைக்கு வரவழைப்பவர்
  rationale: WLC உயிர்க்குறியீட்டில் உள்ள -נִי என்பது முதலாம் நபர் ஒருமைச் செயப்படுபொருள், ‘என்னை.’ יעד என்பதன் Hiphil வடிவம் சட்டச் சூழலில் ஒருவரை குறிப்பிட்ட சந்திப்புக்கு அல்லது விசாரணைக்கு வரவழைப்பதைக் குறிக்கலாம். கடினமான கட்டமைப்பை மாற்றாமல் முதன்மை உரையில் காக்கிறது.
theological_decisions:
- issue: கடவுளோடு வழக்காட முடியாமையைப் பற்றிய யோபுவின் நீதிமன்ற உருவகம்
  choice: ‘நீதிவிசாரணை’ மற்றும் ‘விசாரணைக்கு வரவழைப்பவர்’ என்ற நீதிமன்ற மொழியைத் தக்கவைத்து, WLC-யின் ‘என்னை’ என்ற செயப்படுபொருளைப் பிரதான உரையில் மொழிபெயர்த்தல்
  alternative: ‘நீதித் தீர்ப்பைப் பற்றியதென்றால், அவரை அழைப்பவர் யார்?’ அல்லது ‘எனக்கு விசாரணை நாளைக் குறிப்பவர் யார்?’
  rationale: யோபு 9-இன் சூழல் கடவுளுக்கு எதிராக வழக்கை முன்வைப்பதிலுள்ள இயலாமையை வலியுறுத்துகிறது. இருப்பினும், WLC உரையின் இலக்கண வடிவம் ‘என்னை’ என்று உள்ளது. ஆகவே சூழலை முன்னிட்டு அதை அமைதியாக ‘அவரை’ என மாற்றாமல், மூல உரையின் கடினத்தன்மையையும் இறையியல் பதற்றத்தையும் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் யோபுவின் சுருக்கமான சொல்லாட்சியும் நீதிமன்ற உருவகமும் தக்கவைக்கப்பட்டுள்ளன. ‘அவரே’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத எழுவாயைச் சூழலிலுள்ள கடவுளைக் குறிக்கும் வகையில் தமிழில் தெளிவுபடுத்துகிறது.
