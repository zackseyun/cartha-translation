  choice: “உதிக்காதே”
  rationale: சூரியனிடம் கூறப்படும் கட்டளையாக வாசிப்பது உயிரூட்டப்பட்ட கவிதைப் படிமத்தைத் தெளிவாகக் காக்கிறது. கடவுளின் சொல்லின் விளைவாக ‘அது உதிப்பதில்லை’ என்றும் எபிரெயத்தைப் புரிந்துகொள்ள முடியும்; அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
