source:
  edition: WLC
  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: ta
  text: அவர் உள்ளத்தில் ஞானமுள்ளவர், வலிமையில் வல்லவர்; அவருக்கு எதிராகத் தன்னைக் கடினப்படுத்திக்கொண்டு, பாதிப்பின்றி மீண்டவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெற்றிபெற்றவர்,” “தீங்கின்றி இருந்தவர்.” எபிரேய வினைச்சொல் ஒருவர் சேதமின்றி அல்லது சமாதானத்துடன் கடந்து வருவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: உள்ளத்தில் ஞானமுள்ளவர்
  rationale: לֵבָב என்பது அறிவு, சிந்தனை, மனவுறுதி ஆகியவற்றின் மையத்தைக் குறிக்கிறது. ‘உள்ளத்தில்’ என்பது எபிரேய உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: וְאַמִּיץ כֹּחַ
  choice: வலிமையில் வல்லவர்
  rationale: אַמִּיץ மற்றும் כֹּחַ ஆகிய இரண்டும் வலிமை/ஆற்றலை வலியுறுத்துகின்றன. இந்தச் சொற்றொடர் மூலத்தின் கவிதைநயமான வலியுறுத்தலைத் தமிழில் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: מִי
  choice: யார்?
  rationale: இது விடையை எதிர்பாராத வினாவை அறிமுகப்படுத்துகிறது; ‘யார்?’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: הִקְשָׁה
  choice: தன்னைக் கடினப்படுத்திக்கொண்டு
  rationale: Hiphil வடிவம் இச்சூழலில் ஒருவன் தன்னைப் பிடிவாதமாகக் கடினப்படுத்தி எதிர்ப்பதைக் குறிக்கிறது. தமிழாக்கம் அதன் தற்சார்பு உணர்வைக் காக்கிறது.
- source_word: אֵלָיו
  choice: அவருக்கு எதிராக
  rationale: הִקְשָׁה என்பதுடன் வரும் இச்சொல் வெறும் திசையை அல்ல, பகைமையான எதிர்ப்பைக் குறிக்கிறது.
- source_word: וַיִּשְׁלָם
  choice: பாதிப்பின்றி மீண்டவர்
  rationale: שלם இங்கு முழுமையாக, தீங்கின்றி அல்லது பாதுகாப்பாக வெளிவருதல் என்ற பொருள் தருகிறது. ‘பாதிப்பின்றி மீண்டவர்’ இந்தச் சூழலுக்கேற்ற இயல்பான தமிழாக்கம்; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: வசனத்தின் தொடக்கத்தில் மறைந்துள்ள எழுவாய்
  choice: சூழலில் குறிப்பிடப்படும் கடவுளைக் குறிக்க ‘அவர்’ சேர்க்கப்பட்டது.
  alternative: எழுவாயை வெளிப்படையாகச் சேர்க்காமல் பெயரெச்சத் தொடர்களாக மொழிபெயர்த்தல்.
  rationale: எபிரேயத்தில் தொடக்கக் கூற்றுகளுக்கு வெளிப்படையான எழுவாய் இல்லை; ஆனால் யோபுவின் உரையின் சுற்றுப்பகுதி கடவுளையே குறிக்கிறது. தமிழில் முழுமையான, இயல்பான வாக்கியத்திற்காக ‘அவர்’ தேவைப்படுகிறது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’ என்ற சொல் எபிரேய ‘இதயம்’ உருவகத்தின் அறிவு மற்றும் மனவுறுதி சார்ந்த பரப்பைக் காக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
