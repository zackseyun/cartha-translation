  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: ta
  text: அவர் என் மூச்சை மீட்டுக்கொள்ளவும் என்னை அனுமதிப்பதில்லை[a]; ஏனெனில் கசப்பானவற்றால் என்னை நிரப்புகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் என்னை மூச்சுவிட விடுவதில்லை”; சொல்லுக்குச் சொல், “என் மூச்சை/ஆவியை மீட்டுக்கொள்ள அவர் எனக்குக் கொடுப்பதில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கசப்பால் என்னை நிரப்புகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: என்னை ... அனுமதிப்பதில்லை
  rationale: נתן என்ற வினைச்சொல் அடுத்துவரும் வினையெச்சத்துடன் இணைந்து ‘விடு/அனுமதி’ என்ற பொருளைத் தருகிறது; தமிழில் இத்தொடர் இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது.
- source_word: הָשֵׁב רוּחִי
  choice: மூச்சுவிடக்கூட
  rationale: சொல்லுக்குச் சொல் ‘என் மூச்சை/ஆவியைத் திரும்பச் செய்ய’ என்றாலும், இடைவிடாத துன்பத்தின் சூழலில் சிறிதும் மூச்சுவிட அல்லது ஆசுவாசமடைய இடமில்லாததையே குறிக்கிறது. ‘கூட’ என்பது மறுப்பின் தீவிரத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இங்கு செயல்படுகிறது.
- source_word: יַשְׂבִּיעַנִי
  choice: என்னை நிரப்புகிறார்
  rationale: Hiphil வடிவிலுள்ள שבע ‘நிறைவடையச் செய்/நிரப்பு’ எனப் பொருள்படும்; எதிர்மறைச் சூழலில் ‘நிரப்புகிறார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מַמְּרֹרִים
  choice: கசப்பான துன்பங்களால்
  rationale: பன்மை வடிவம் ‘கசப்புகள்’ அல்லது ‘கசப்பான காரியங்கள்’ என அமையலாம். இச்சூழலில் அது துயரமளிக்கும் அனுபவங்களைக் குறிப்பதால், ‘கசப்பான துன்பங்கள்’ பொருளை இயல்பாகத் தெரிவிக்கிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
