source:
  edition: WLC
  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: ta
  text: நான் நியாயத்தின் பக்கம் இருந்தால், என் வாயே என்னைக் குற்றவாளி என்று தீர்க்கும்; நான் குற்றமற்றவனாக இருந்தாலும், அதுவே என்னை நெறிபிறழ்ந்தவன் என்று காட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, கடவுளை மறைந்த எழுவாயாகக் கொண்டு: “நான் குற்றமற்றவனாக இருந்தாலும், அவரே என்னை நெறிபிறழ்ந்தவன் என்று காட்டுவார்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: இந்த இடத்தில் நிபந்தனையை அறிமுகப்படுத்துகிறது. முழு வசனத்தில் விட்டுக்கொடுக்கும் நிழற்பொருள் இருந்தாலும், முதல் கூறை இயல்பான நிபந்தனை வாக்கியமாக வைத்திருக்கிறது.
- source_word: אֶצְדָּק
  choice: நியாயத்தின் பக்கம் இருந்தால்
  rationale: צדק என்பதன் Qal வடிவம் இங்கு ‘நியாயமான நிலையில் இருத்தல்’ அல்லது ‘வழக்கில் சரியான பக்கம் இருத்தல்’ என்ற நீதிமன்றச் சூழலிலான பொருளைக் கொண்டது; தன்னைத் தானே நியாயப்படுத்துதல் என்று காரணவினையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: פִּי
  choice: என் வாயே
  rationale: சொற்பொருள் ‘என் வாய்.’ ‘-ஏ’ என்ற வலியுறுத்தல், யோபுவின் சொந்தப் பேச்சே அவருக்கு எதிராகத் திரும்பும் முரணை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַרְשִׁיעֵנִי
  choice: என்னைக் குற்றவாளி என்று தீர்க்கும்
  rationale: רשע என்பதன் Hiphil வடிவம் நீதிமன்றப் பயன்பாட்டில் ‘குற்றவாளி என்று அறிவித்தல்/தீர்த்தல்’ என்று பொருள்படும்; உண்மையிலேயே ஒருவரைத் தீயவராக்குதல் என்று மிகைப்படுத்தவில்லை.
- source_word: תָּם
  choice: குற்றமற்றவன்
  rationale: யோபு நூலில் இந்தச் சொல் பொதுவாக முழுமையான பாவமின்மையை அல்ல, பழியற்ற தன்மையையும் நேர்மையையும் குறிக்கிறது.
- source_word: וַיַּעְקְשֵׁנִי
  choice: அதுவே என்னை நெறிபிறழ்ந்தவன் என்று காட்டும்
  rationale: עקשׁ என்பது வளைந்த அல்லது நெறிபிறழ்ந்த தன்மையைக் குறிக்கிறது. முந்தைய கூறிலுள்ள ‘என் வாய்’ என்பதையே தொடரும் எழுவாயாகக் கொண்டு, அந்தப் பேச்சு யோபுவை நெறிபிறழ்ந்தவராக வெளிப்படுத்தும் என்ற விளைவை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וַיַּעְקְשֵׁנִי என்பதன் மறைந்த எழுவாய்
  choice: 'முந்தைய கூறிலுள்ள ‘என் வாய்’ என்பதே தொடரும் எழுவாய்: ‘அதுவே ... காட்டும்.’'
  alternative: கடவுளை மறைந்த எழுவாயாகக் கொண்டு, ‘அவரே என்னை நெறிபிறழ்ந்தவன் என்று காட்டுவார்’ அல்லது ‘ஆக்குவார்’ என வாசிக்கலாம்.
  rationale: இரு கூறுகளின் இணை அமைப்பு ஒரே எழுவாய் தொடர்வதை ஆதரிக்கிறது. ஆயினும் எபிரெய வினையில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால், கடவுளை எழுவாயாகக் கொள்ளும் வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இவ்வாறு மூலத்தின் உண்மையான தெளிவின்மையும் இறையியல் பதற்றமும் தீர்த்துவிடப்படாமல் நிற்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நீதிமன்றச் சூழலின் செறிவைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் வாயே’ மற்றும் ‘அதுவே’ ஆகிய வலியுறுத்தல்கள் வசனத்தின் முரணையும் இணை அமைப்பையும் வெளிப்படுத்துகின்றன; மொழிநடை கண்ணியமானதாயிருந்தாலும் பழமையான சமயச் சொல்லாட்சியைத் தவிர்க்கிறது.
