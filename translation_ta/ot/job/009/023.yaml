revisions:
- from: ஒரு சாட்டை திடீரென்று கொன்றுபோட்டால், குற்றமற்றவர்களின் நிலைகுலைவை[a] அவர் ஏளனம் செய்கிறார்.
  to: ஒரு சாட்டை திடீரென்று கொன்றால், குற்றமற்றோரின் துன்பத்தை[a] அவர் ஏளனம் செய்கிறார்.
  rationale: The revision improves modern Tamil idiom and register while retaining the Hebrew conditional clause, scourge image, sudden death, and the deliberately unexpressed contextual subject of “mocks.” The difficult noun is rendered broadly as “துன்பம்,” and its significant lexical alternatives remain available through the footnote.
