id: JOB.9.23
reference: Job 9:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: ta
  text: ஒரு சாட்டை திடீரென்று கொன்றால், குற்றமற்றோரின் துன்பத்தை[a] அவர் ஏளனம் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றமற்றோரின் சோதனையை”; அல்லது, “குற்றமற்றோரின் உருகிப்போதலை/சரிவை.” எபிரெயப் பெயர்ச்சொல் சோதனை, உருகிப்போதல், சரிவு, அல்லது மனந்தளர்வு ஆகியவற்றைக் குறிக்கலாம்.
    reason: அரிய எபிரெயச் சொல்லின் பொருள் தெளிவின்மையையும் முக்கியமான மொழிபெயர்ப்பு வாய்ப்புகளையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: אִם
  choice: -ஆல்
  rationale: எபிரெய நிபந்தனைத் தன்மையை இயல்பான தமிழ் நிபந்தனை விகுதியால் வெளிப்படுத்துகிறது; அதை உறுதியான காலக் கூற்றாக மாற்றவில்லை.
- source_word: שׁוֹט
  choice: ஒரு சாட்டை
  rationale: அடிக்கும் சாட்டை என்ற நேரடியான உருவகத்தையும், திடீரெனத் தாக்கும் கொடிய துன்பம் என்ற விரிவான பொருளையும் தக்கவைக்கிறது.
- source_word: יָמִית
  choice: கொன்றுபோட்டால்
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள ‘சாகச் செய்தல்/கொல்லுதல்’ என்ற காரணவினைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: פִּתְאֹם
  choice: திடீரென்று
  rationale: செயல் எதிர்பாராத விதமாக நிகழ்வதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: לְמַסַּת
  choice: நிலைகுலைவை
  rationale: இந்த அரிய சொல்லில் உள்ள சோதனை, உருகிப்போதல், சரிவு அல்லது மனந்தளர்வு ஆகிய பொருள் வாய்ப்புகளை ஓரளவு திறந்தே வைக்கிறது; வெறும் உள்ளார்ந்த ‘நம்பிக்கையின்மை’ என்று குறுக்கிவிடுவதில்லை.
- source_word: נְקִיִּם
  choice: குற்றமற்றவர்களின்
  rationale: குற்றப்பொறுப்பிலிருந்து விடுபட்டவர்கள் என்ற சூழல்சார் பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: יִלְעָג
  choice: ஏளனம் செய்கிறார்
  rationale: ‘பரிகசித்தல்/நகைத்தல்’ என்ற வினையின் கடுமையான குற்றச்சாட்டை மரியாதை ஒருமை நடையில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘ஏளனம் செய்கிறார்’ என்பதன் எழுவாய்
  choice: சூழலில் கடவுளைக் குறிக்கக்கூடிய ‘அவர்’ பயன்படுத்தப்பட்டது; ஆனால் ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: சாட்டையை உயிர்ப்பித்துப் பேசுவது போல அதையே எழுவாயாகக் கொள்ளுதல், அல்லது குறிப்பிடப்படாத ஒருவரை எழுவாயாகக் கொள்ளுதல்.
  rationale: யோபு 9-ன் ஓட்டத்தில் குற்றச்சாட்டு கடவுளின் உலகாட்சியை நோக்கியதாகத் தோன்றினாலும், எபிரெய உரை எழுவாயை பெயரிட்டு வெளிப்படுத்தவில்லை. ஆகவே இறையியல் பதற்றத்தையும் இலக்கணத் தெளிவின்மையையும் முடிந்தவரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. ‘சாட்டை’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது. ‘அவர்’ என்பது சூழல்சார் குறிப்பை அனுமதிக்கிறது; உரையில் இல்லாத ‘கடவுள்’ என்ற பெயர் சேர்க்கப்படவில்லை.
