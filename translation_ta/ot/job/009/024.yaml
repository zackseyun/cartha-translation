source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: ta
  text: 'பூமி தீயவனின் கையில் ஒப்படைக்கப்பட்டுள்ளது[a];


    அதன் நீதிபதிகளின் முகங்களை மூடுகிறான்[b].


    அப்படியில்லையென்றால், அப்படியானால் யார்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடு ஒரு தீய மனிதனின் கையில் ஒப்படைக்கப்பட்டுள்ளது.” אֶרֶץ என்பது “பூமி,” “நாடு,” அல்லது “நிலம்” என்று பொருள்படலாம்; רָשָׁע என்பது ஒருமையில் “தீயவன்” என்றோ, பொதுவாக “தீயோர்” என்றோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மூடுகிறான்” என்பதன் எழுவாய் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. அது கடவுளையோ, தீய ஆட்சியாளனையோ குறிக்கலாம்; அல்லது குறிப்பிடப்படாத ஓர் எழுவாயாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: பூமி
  rationale: இச்சூழலில் யோபு உலகில் நிலவும் அநீதியை விரிவாகப் பேசுவதால், ‘பூமி’ என்பது பொருத்தமானது. எனினும், எபிரெயச் சொல் ‘நாடு’ அல்லது ‘நிலம்’ என்றும் பொருள்படலாம்; அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִתְּנָה
  choice: ஒப்படைக்கப்பட்டுள்ளது
  rationale: נתן என்பதன் நிஃபால் நிறைவுவினை செயப்பாட்டு பொருளுடையது. ‘ஒப்படைக்கப்பட்டுள்ளது’ என்பது நிகழ்ந்து முடிந்த செயலால் தொடரும் நிலையையும் அதிகாரத்திற்கு உட்படுத்தப்பட்டிருப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְיַד
  choice: கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைக்கப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘கை’ உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: ஒருமை வடிவத்தையும் சுருக்கமான கவிதை நடையையும் காக்கிறது. இது ஒரு குறிப்பிட்ட தீய ஆட்சியாளனையோ, பொதுவான வகையில் தீயவனையோ குறிக்கக்கூடும்.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: அதன் நீதிபதிகளின் முகங்களை
  rationale: ‘முகங்கள்’ மற்றும் ‘நீதிபதிகள்’ என்ற மூலத்தின் நேரடியான உருவகத்தையும், பூமியைக் குறிக்கும் உடைமைப் பின்னொட்டையும் பாதுகாக்கிறது.
- source_word: יְכַסֶּה
  choice: அவன் மூடுகிறான்
  rationale: பியேல் முற்றாவினையின் மூன்றாம் ஆண்பால் ஒருமைச் செயற்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது. எழுவாய் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால், அது யாரென்று மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: அப்படியில்லையென்றால், பின் யார்?
  rationale: இது சுருக்கமான சொல்லாட்சிக் கேள்வி. אֵפוֹא என்பதன் ‘பின்/அப்படியானால்’ என்ற வலிமையைத் தக்கவைத்து, மூலத்தில் இல்லாத தெளிவுபடுத்தும் பெயரையோ எழுவாயையோ சேர்க்காமல் உள்ளது.
theological_decisions:
- issue: ‘அவன் மூடுகிறான்’ என்பதன் மறைமுக எழுவாயும், இறுதியிலுள்ள ‘யார்?’ என்பதன் அடையாளமும்
  choice: எழுவாய் கடவுளா, தீய ஆட்சியாளனா என்று உரை வெளிப்படையாகத் தீர்மானிக்காமல், எபிரெய மூலத்தின் தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
  alternative: எழுவாய் கடவுள் என்று வெளிப்படையாகக் கூறுதல்; தீயவன் என்று உறுதிப்படுத்துதல்; அல்லது செயப்பாட்டு வாக்கியமாக ‘முகங்கள் மூடப்படுகின்றன’ என்று மாற்றுதல்.
  rationale: சூழலில் யோபுவின் வாதம் இறுதியில் கடவுளின் ஆட்சியை நோக்கிச் செல்லக்கூடும்; ஆனால் יְכַסֶּה என்ற வினையின் எழுவாய் இவ்வரியிலேயே சொல்லப்படவில்லை. ஆகவே எந்த ஓர் விளக்கத்தையும் உரைக்குள் திணிக்காமல் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையில்’ மற்றும் ‘முகங்களை மூடுகிறான்’ ஆகிய மூல உருவகங்கள் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
