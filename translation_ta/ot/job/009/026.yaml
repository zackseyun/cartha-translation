  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: ta
  text: 'அவை நாணற்படகுகளைப்போல் கடந்து செல்கின்றன;

    இரையின்மேல் பாயும் கழுகைப்போல் விரைகின்றன.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: நாணற்படகுகள்
  rationale: אֵבֶה என்பது அரிதான சொல்; இங்கு இலகுவாகவும் வேகமாகவும் செல்லும் நாணல் அல்லது பாப்பிரஸ் படகுகளைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. நவீன தமிழில் இயல்பாகவும் மூல உவமையை நெருக்கமாகவும் தருவதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָטוּשׂ
  choice: விரைகின்றன
  rationale: இந்த வினை வேகமாகப் பாய்தல் அல்லது இரையின் மீது திடீரென இறங்குதல் என்ற படிமத்தைத் தருகிறது. முந்தைய வரியின் ‘கடந்து செல்கின்றன’ என்பதோடு இணையும் வேக உணர்வை வெளிப்படுத்த ‘விரைகின்றன’ பயன்படுத்தப்பட்டது.
- source_word: עֲלֵי אֹכֶל
  choice: இரையை நோக்கி
  rationale: சொற்றொடர் உணவின் மீது அல்லது இரையின் மீது பாயும் கழுகைக் குறிக்கிறது. கழுகு உவமையின் சூழலில் ‘இரை’ என்பது இயல்பான தமிழ் தேர்வு.
