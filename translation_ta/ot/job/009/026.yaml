  register: நவீன நிலையான தமிழில் கவித்துவமும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய மூலத்தில் வினை ஒருமையாக இருந்தாலும், தமிழில் முந்தைய பன்மை எழுவாயான ‘அவை’யைத் தொடர்ந்து இரு உவமைகளும் ஒரே இலக்கண ஓட்டத்தில் பன்மையாக அமைக்கப்பட்டுள்ளன.
