- source_word: לֹא אִישׁ כָּמֹנִי
  choice: அவர் என்னைப் போன்ற மனிதர் அல்ல
  rationale: אִישׁ இங்கு யோபுவுடன் ஒப்பிடப்படும் மனித litigant-ஐக் குறிக்கிறது; ‘மனிதர்’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, கடவுளுக்கும் மனிதனுக்கும் இடையிலான வேறுபாட்டைப் பேணுகிறது.
- source_word: אֶעֱנֶנּוּ
  choice: நான் அவருக்குப் பதிலளிக்கவும்
  rationale: ענה என்பதன் ‘பதில் கூறுதல்’ என்ற பொருளைத் தக்கவைக்கிறது; சூழலில் இது வழக்கில் எதிர்வாதம் செய்வதற்கான சட்ட நிழற்பொருளையும் கொண்டுள்ளது.
- source_word: נָבוֹא יַחְדָּו
  choice: நாங்கள் இருவரும் ஒன்றாக ... வரவும்
  rationale: முதல் நபர் பன்மை யோபுவையும் கடவுளையும் உள்ளடக்குகிறது; ‘இருவரும் ஒன்றாக’ என்பது பரஸ்பரமாக ஒரே விசாரணைக்கு வருவதைத் தெளிவாக்குகிறது.
- source_word: בַּמִּשְׁפָּט
  choice: நீதிவிசாரணைக்கு
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நீதி, அல்லது சட்ட விசாரணையைக் குறிக்கலாம். இங்குள்ள வழக்காடும் உருவகத்தில் ‘நீதிவிசாரணை’ சட்டச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோபுவுக்கும் கடவுளுக்கும் இடையிலான சட்டவியல் உருவகம்
  choice: கடவுள் யோபுவைப் போன்ற மனித சமநிலையாளர் அல்லாததால், இருவரும் ஒரே நீதிவிசாரணையில் எதிரெதிராக நிற்க முடியாது என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நாங்கள் ஒன்றாக நியாயத்தீர்ப்புக்கு வரும்படிக்கு’ என்று மேலும் சொற்சார்பாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை சட்டவியல் மொழியைப் பயன்படுத்துகிறது; ஆனால் கடவுளைப் பற்றிய கூடுதல் கோட்பாட்டை முன்வைக்காமல், அவருடன் சமமான தரப்பாக வழக்காட இயலாத யோபுவின் நிலையை மட்டும் கூறுகிறது.
- issue: אִישׁ என்பதன் பாலினம் மற்றும் மனிதத் தன்மை
  choice: ‘மனிதர்’
  alternative: ‘ஆண்’ அல்லது ‘ஒரு நபர்’
  rationale: இங்கு முக்கியமான எதிர்மறை கடவுளுக்கும் மனித litigant-க்கும் இடையிலானது. தமிழில் ‘மனிதர்’ மரியாதையுடனும் இயல்பாகவும் அந்த வேறுபாட்டைத் தக்கவைக்கிறது; ‘ஆண்’ என்பது தேவையற்ற பாலின வலியுறுத்தலை உண்டாக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. சட்டவியல் உருவகத்தைத் தெளிவாக வைத்திருக்க ‘நீதிவிசாரணை’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் மறைமுகமாக உள்ள இயலாமை, தமிழில் இயல்பாக வாசிக்க ‘முடியாது’ என வெளிப்படுத்தப்பட்டது.
