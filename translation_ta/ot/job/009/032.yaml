base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: ta
  text: ஏனெனில், அவர் என்னைப் போன்ற மனிதர் அல்ல; நான் அவருக்குப் பதிலளிக்கவும், நாங்கள் இருவரும் ஒன்றாக நீதிவிசாரணைக்கு வரவும் முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நான் அவருக்குப் பதிலளிக்கவும், நாங்கள் இருவரும் ஒன்றாக நியாயத்தீர்ப்புக்கு வரவும் முடியாது.”'
    reason: מִשְׁפָּט என்பதற்கு சட்ட விசாரணை, வழக்கு, அல்லது நியாயத்தீர்ப்பு என்ற பொருள் வரலாம்; இங்கு மாற்று வாசகம் அந்தச் சொல்லின் வேறுபட்ட பொருளை முழுமையான தமிழ்வாக்கியமாகக் காட்டுகிறது.
