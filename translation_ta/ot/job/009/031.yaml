source:
  edition: WLC
  text: אָ֭ז בַּ/שַּׁ֣חַת תִּטְבְּלֵ֑/נִי וְ֝/תִֽעֲב֗וּ/נִי שַׂלְמוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/031.yaml
  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: ta
  text: அப்போது நீர் என்னைக் குழிக்குள்[a] அமிழ்த்துவீர்; என் சொந்த உடைகள்கூட என்னை அருவருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பள்ளத்துக்குள்.’ எபிரெயச் சொல் குழி, பள்ளம் அல்லது சில சூழல்களில் அழிவு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் ஆடைகள் என்னை வெறுக்கும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் வரும் யோபுவின் கற்பனையான தன்னைத் தூய்மைப்படுத்தும் செயலைத் தொடர்ந்து நிகழும் விளைவைச் சுட்டும் கால/தொடர்ச்சி வினையடை.
- source_word: בַּשַּׁחַת
  choice: குழிக்குள்
  rationale: שַׁחַת என்பது குழி, பள்ளம் அல்லது அழிவு எனப் பொருள்படலாம். இங்கு கழுவுதல் மற்றும் அமிழ்த்துதல் சார்ந்த உருவகத்துடன் ‘குழி’ இயல்பாகப் பொருந்துகிறது; இயக்க வினையோடு வரும் ב தமிழில் ‘-க்குள்’ எனத் தரப்பட்டுள்ளது.
- source_word: תִּטְבְּלֵנִי
  choice: என்னை ... அமிழ்த்துவீர்
  rationale: טבל என்பதன் அடிப்படைப் பொருள் ‘தோய்த்தல்/அமிழ்த்துதல்.’ யோபு தன்னைத் தூய்மைப்படுத்தினாலும் கடவுள் அவனை மீண்டும் அசுத்தத்துக்குள் அமிழ்த்துவார் என்ற வலிமையான உருவகத்தை ‘அமிழ்த்துவீர்’ காக்கிறது.
- source_word: וְתִעֲבוּנִי
  choice: என்னை அருவருக்கும்
  rationale: תעב கடும் வெறுப்பு அல்லது அருவருப்பைக் குறிக்கிறது. பின்வரும் பன்மைப் பெயர்ச்சொல்லான ‘என் உடைகள்’ இதன் எழுவாயாக இயல்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: שַׂלְמוֹתָי
  choice: என் சொந்த உடைகள்கூட
  rationale: வெளியாடைகள் அல்லது உடைகளைக் குறிக்கும். ‘சொந்த’ மற்றும் ‘கூட’ என்பவை யோபுவுக்கு மிக நெருக்கமான அவனுடைய உடைகளே அவனை அருவருக்கும் என்ற கவித்துவமான முரணை இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: இரண்டாம் நபர் வினைமுற்று காட்டும் செயற்பாட்டாளர்
  choice: யோபு கடவுளை நேரடியாக நோக்கி, ‘நீர் ... அமிழ்த்துவீர்’ என்று கூறுகிறான்.
  alternative: யோபு செயற்பாட்டாளர் குறிப்பிடப்படாமல் சூழ்நிலையால் குழிக்குள் விழுகிறான் என்ற பொருள்.
  rationale: எபிரெய மொழியின் இரண்டாம் நபர் ஆண்பால் ஒருமை வினைமுற்று, சுற்றியுள்ள உரையில் கடவுளிடம் யோபு நேரடியாகப் பேசுவதைத் தொடர்கிறது. இதனால் யோபுவின் குற்றச்சாட்டிலுள்ள இறைச் செயற்பாடு மென்மைப்படுத்தப்படாமல், உரையின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நேரடியாக அழைக்கும் ஒருமை மரியாதை வடிவமான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. உடைகள் அருவருப்பதாகக் கூறும் உயிரூட்டப்பட்ட உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
