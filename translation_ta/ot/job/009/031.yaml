  terminology: ‘அமிழ்த்துவீர்’ טבל-ன் தோய்த்தல்/மூழ்கடித்தல் காட்சியை நன்கு தருகிறது. ‘குழி,’ ‘உடைகள்,’ ‘அருவருக்கும்’ ஆகியவை முறையே שַׁחַת, שַׂלְמוֹתַי, תעב ஆகியவற்றுக்கு பொருத்தமானவை. மாற்றுச் சொற்களுக்கான அடிக்குறிப்புகளும் சரியான இடங்களில் இணைக்கப்பட்டுள்ளன.
