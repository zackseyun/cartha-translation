  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சிச் சுட்டியான אָז, கடவுளை நோக்கிய இரண்டாம் நபர் ஒருமை வினை, ‘குழி/பள்ளம்’ என்ற שַׁחַת-ன் காட்சிப்படிமம், மற்றும் உடைகள் அருவருப்பதாகக் கூறும் உயிரூட்டல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘குழிக்குள்’ என்பது இயக்க வினையான ‘அமிழ்த்துவீர்’ உடன் இயல்பாக இணைகிறது.
