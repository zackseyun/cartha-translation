  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: ta
  text: அவர் புயலில் என்னை நசுக்குகிறார்[a][b]; காரணமின்றி என் காயங்களைப் பெருக்குகிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புயலால்” அல்லது “பெரும்புயலில்.” எபிரெய முன்னிடைச்சொல் நிகழும் விதத்தையோ பயன்படுத்தப்படும் கருவியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த வினைச்சொல்லை “காயப்படுத்துகிறார்” என்றும் மொழிபெயர்க்கலாம்; இங்கு பொருந்தும் வாய்ப்பு குறைவாக இருந்தாலும், “என்னைக் கடிக்கப் பாய்கிறார்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எந்தக் காரணமும் இல்லாமல்” அல்லது “வீணாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவர்
  rationale: முந்தைய சூழலில் கடவுளைக் குறிக்கும் தொடர்புச் சொல்லை, தமிழில் தனி வசனமாக இயல்பாக அமைய மரியாதைப் பன்மைச் சுட்டுப்பெயராக வழங்குகிறது.
- source_word: בִּשְׂעָרָה
  choice: புயலில்
  rationale: שְׂעָרָה என்பதன் புயல்/பெருங்காற்று உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; ב முன்னிடைச்சொல் இடம் அல்லது விதம் மட்டுமன்றி கருவியையும் குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְשׁוּפֵנִי
  choice: என்னை நசுக்கி
  rationale: அரிதான שׁוף வினை இச்சூழலில் கடுமையாகக் காயப்படுத்தும் பொருளைக் காட்டுகிறது; அடுத்துள்ள ‘காயங்கள்’ என்ற இணைப்போடு ‘நசுக்கு’ வலிமையாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: וְהִרְבָּה
  choice: பெருகச் செய்கிறார்
  rationale: רבה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘பலவாக்குதல்/அதிகரித்தல்’ என்ற காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פְצָעַי
  choice: என் காயங்களை
  rationale: פצע என்பதன் நேரடியான உடற்காயம் அல்லது புண் சார்ந்த பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: חִנָּם
  choice: காரணமின்றி
  rationale: ‘எந்தக் காரணமும் இன்றி/வீணாக’ என்ற பொருளைச் சுருக்கமாகத் தருவதோடு, யோபுவின் முறையீட்டிலுள்ள நீதிசார் அழுத்தத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: חִנָּם என்பது யோபுவின் முழுமையான அறநிரபராதத்தைக் கூறுகிறதா, அல்லது தகுதியற்ற துன்பம் குறித்த அவரது முறையீட்டைக் கூறுகிறதா?
  choice: காரணமின்றி
  alternative: எந்தக் காரணமும் இல்லாமல்; நான் அதற்குத் தகுதியற்றிருந்தும்
  rationale: வசனம் கூறும் யோபுவின் முறையீட்டை மெலிதாக்காமலும், தெய்வநீதி பற்றிய இறுதித் தீர்வை மொழிபெயர்ப்புக்குள் புகுத்தாமலும் அதன் இறையியல் இழுபறியை அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் யோபுவின் கடுமையான முறையீடும் தக்கவைக்கப்பட்டுள்ளன. கடவுளைக் குறிக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெய முன்னிடைச்சொல் மற்றும் அரிதான வினைச்சொல்லின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
