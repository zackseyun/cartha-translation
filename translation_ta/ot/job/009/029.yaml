source:
  edition: WLC
  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: ta
  text: நான் குற்றவாளியெனத் தீர்க்கப்படுவேன்[a]; அப்படியானால், நான் ஏன் வீணாக உழைக்க வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் தீயவனாக இருப்பேன்.” எபிரெய வினைச்சொல் ஒழுக்கநிலையில் “தீயவனாக இருத்தல்” என்றும், நீதித்துறைப் பொருளில் “குற்றவாளியெனத் தீர்க்கப்படுதல்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: நான்
  rationale: வலியுறுத்தலுடன் வரும் தனித்த முதல் நபர் ஒருமைப் பெயர்ப்பதிலியைத் தமிழில் வெளிப்படையான எழுவாயாகத் தக்கவைக்கிறது.
- source_word: אֶרְשָׁע
  choice: குற்றவாளியெனத் தீர்க்கப்படுவேன்
  rationale: רשע என்பதன் Qal வடிவம் ஒழுக்கநிலையில் ‘தீயவனாக இருத்தல்’ என்றும் நீதித்துறைச் சூழலில் ‘குற்றவாளியெனத் தீர்க்கப்படுதல்’ என்றும் பொருள்படலாம். யோபு கடவுளுக்கு முன் தன் குற்றமின்மையை நிலைநாட்ட முடியாத நிலையைப் பேசும் சூழலில் நீதித்துறைப் பொருள் பொருத்தமானது; எபிரெய வடிவின் எதிர்கால நுணுக்கமும் காக்கப்படுகிறது.
- source_word: לָמָה זֶּה
  choice: அப்படியானால், … ஏன்
  rationale: சொல்லெழுத்தாக ‘ஏன் இது’ என்றிருந்தாலும், இச்சொற்றொடர் சூழலில் ‘அப்படியானால் ஏன்?’ என்ற அனுமானக் கேள்வியாக இயங்குகிறது; இயல்பான தமிழில் அதையே வெளிப்படுத்துகிறது.
- source_word: הֶבֶל
  choice: வீணாக
  rationale: வெறுமை, பயனின்மை, வீண் முயற்சி ஆகிய பொருள்களைத் தரும் הבל இங்கு யோபின் உழைப்பின் பயனின்மையை வினையடையாகக் குறிக்கிறது.
- source_word: אִיגָע
  choice: நான் … உழைக்க வேண்டும்
  rationale: יגע என்பது உழைத்தல், பாடுபடுதல், களைப்படைதல் என்பவற்றைக் குறிக்கும். சொல்லில் உள்ள முயற்சியையும் வினாவின் எதிர்பார்க்கப்படும் மறுப்பையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: רשע என்பதன் நீதித்துறைப் பொருளா, ஒழுக்கநிலைப் பொருளா
  choice: 'நீதித்துறைப் பொருள்: ‘குற்றவாளியெனத் தீர்க்கப்படுவேன்’'
  alternative: 'ஒழுக்கநிலை/விளக்கப் பொருள்: ‘நான் தீயவனாக இருப்பேன்’'
  rationale: சுற்றியுள்ள வசனங்களில் யோபு தன்னை நீதிமானாக நிலைநாட்ட முடியாமையையும், தன்னைத் தூய்மைப்படுத்த முயன்றாலும் குற்றமுடையவனாக நடத்தப்படும் நிலையையும் பேசுகிறான். ஆகவே நீதித்துறைப் பொருள் வாதத்தின் ஓட்டத்திற்கு ஏற்றது; எனினும் எபிரெயச் சொல்லின் உண்மையான இருபொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. ‘குற்றவாளியெனத் தீர்க்கப்படுவேன்’ என்பது நீதித்துறைச் சூழலைத் தெளிவாக்குகிறது; அடிக்குறிப்பு மூலமொழியின் ஒழுக்கநிலைப் பொருள் வாய்ப்பையும் தக்கவைக்கிறது.
