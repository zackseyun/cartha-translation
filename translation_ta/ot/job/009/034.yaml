source:
  edition: WLC
  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: ta
  text: அவர் தம் கோலை என்மேலிருந்து அகற்றட்டும்[a]; அவரது பேரச்சம் என்னைத் திகிலடையச் செய்யாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் தம் கோலை என்னிடமிருந்து விலக்கட்டும்; அவர் உண்டாக்கும் பேரச்சம் என்னைத் திகிலடையச் செய்யாதிருக்கட்டும்.’
    reason: יָסֵר (‘விலக்கட்டும்’), מֵעָלַי (‘என்னிடமிருந்து’), மற்றும் אֵמָתוֹவின் உடைமைத் தொடர்பை இயல்பாக வெளிப்படுத்தும் மாற்று வாசகம்.
lexical_decisions:
- source_word: יָסֵר
  choice: அகற்றட்டும்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் விருப்பம் அல்லது வேண்டுகோளை வெளிப்படுத்தும் விதத்தில் உள்ளது; ‘அகற்றட்டும்’ அந்த உந்துதல் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: מֵעָלַי
  choice: என்மேலிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘என்மேலிருந்து’ என்று பொருள்; கோல் யோபின் மேல் பாரமாக அல்லது அழுத்தமாக இருப்பது போன்ற எபிரெய உருவகத்தை இது காக்கிறது.
- source_word: שִׁבְטוֹ
  choice: தமது கோலை
  rationale: שֵׁבֶט என்பது கோல், தடி, செங்கோல் ஆகியவற்றைக் குறிக்கலாம். துன்புறுத்தல் மற்றும் அடித்தல் சார்ந்த இச்சூழலில் ‘கோல்’ பொருத்தமானது; ‘தமது’ மூன்றாம் நபர் மரியாதை ஒருமையைச் சுட்டுகிறது.
- source_word: וְאֵמָתוֹ
  choice: தம்மைப் பற்றிய திகில்
  rationale: אֵימָה என்பது திகில் அல்லது பேரச்சம். எபிரெயில் உள்ள மூன்றாம் நபர் உடைமைத் தொடர்பைத் தமிழில் இயல்பாகவும், அந்த நபர் ஏற்படுத்தும் அச்சம் என்ற பொருளுடனும் வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אַל
  choice: …ஆதிருக்கட்டும்
  rationale: அடுத்த வினையுடன் வரும் எதிர்மறை விருப்பம் அல்லது வேண்டுகோளைத் தமிழில் ‘கலங்கடிக்காதிருக்கட்டும்’ என்ற அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תְּבַעֲתַנִּי
  choice: என்னைக் கலங்கடிக்காதிருக்கட்டும்
  rationale: בעת என்பது திகிலடையச் செய்தல், அச்சுறுத்துதல், கலங்கச் செய்தல் எனப் பொருள்படும். முந்தைய ‘திகில்’ என்பதுடன் தேவையற்ற சொல் மறுபடியும் வராமல், அதன் தீவிரமான தாக்கத்தை ‘கலங்கடிக்க’ தெரிவிக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: கடவுளை நேரடியாக ‘நீர்/உமது’ என்று விளிக்காமல், ‘அவர்/தமது/தம்மை’ என்று மறைமுகமாகக் குறிப்பிடுதல்.
  alternative: ‘உமது கோலை என்மேலிருந்து அகற்றும்; உம்மைப் பற்றிய திகில் என்னைக் கலங்கடிக்காதிருப்பதாக’ என்ற நேரடி விளிப்பு.
  rationale: எபிரெய வினையும் பின்னொட்டுகளும் மூன்றாம் நபர் ஒருமையில் உள்ளன. யோபு இப்பகுதியில் கடவுளைப் பற்றிப் பேசும் இலக்கணத்தை மொழிபெயர்ப்பு காக்கிறது; அதை நேரடி விளிப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அகற்றட்டும் / கலங்கடிக்காதிருக்கட்டும்’ என்பது வேண்டுகோள் சார்ந்த இணை அமைப்பைக் காக்கிறது. கடவுளைக் குறிக்கும் மூன்றாம் நபர் வடிவங்களுக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், மூலத்தின் மறைமுகக் குறிப்பு மாற்றப்படவில்லை.
