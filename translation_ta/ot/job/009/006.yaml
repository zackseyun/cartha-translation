  source_fidelity: மூல எபிரெயத்தின் காரணவினைப் பொருளை “அசைக்கிறார்” துல்லியமாக வெளிப்படுத்துகிறது. אֶרֶץ என்பதற்குப் பிரபஞ்சச் சூழலுக்கு ஏற்ற “பூமி” பயன்படுத்தப்பட்டுள்ளது; “அதன் இடத்திலிருந்து” என்பது מִמְּקוֹמָהּ என்பதையும், “அதன் தூண்கள்” என்பது கவித்துவமான עַמּוּדֶיהָ என்பதையும் காக்கிறது. יִתְפַלָּצוּן என்பதன் கடுமையான நடுக்கப் படிமத்துக்கு “நடுங்குகின்றன” பொருத்தமானது.
  naturalness: “அவர் பூமியை அதன் இடத்திலிருந்து அசைக்கிறார்; அதன் தூண்கள் நடுங்குகின்றன” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான கவிதைநடையுடனும் இயல்பாக உள்ளது. எபிரெய வினையெச்சத் தொடரைத் தமிழில் முழுவாக்கியமாக்கியிருப்பது இயல்பானது.
  terminology: “பூமி,” “தூண்கள்,” “நடுங்குகின்றன” ஆகியவை மூலத்தின் பிரபஞ்சவியல் கவிப்படிமத்தையும் சொல் தேர்வின் திறந்த தன்மையையும் பாதுகாக்கின்றன. “தூண்கள்” என்பதை “அஸ்திவாரங்கள்” என விளக்கி மாற்றாமல் வைத்திருப்பது சரியானது. அடிக்குறிப்பு நடுக்க வினைக்கே பொருந்துமிடத்தில் இணைக்கப்பட்டுள்ளது; மாற்றுச் சொற்களும் பொருத்தமானவை.
