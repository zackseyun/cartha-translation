  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: ta
  text: அவர் பூமியை அதன் இடத்திலிருந்து அசைக்கிறார்; அதன் தூண்கள் நடுங்குகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நடுங்குகின்றன” என்பதற்கு “அதிர்கின்றன” அல்லது “குலுங்குகின்றன” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: அசைக்கிறார்
  rationale: רגז என்பதன் ஹிஃபில் வினையெச்ச வடிவம் காரணவினைப் பொருளைக் கொண்டது. சூழலில் கடவுளைத் தொடர்ந்து விவரிப்பதால், நவீன தமிழில் இயல்பாக அமைய இதை ‘அவர் ... அசைக்கிறார்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֶרֶץ
  choice: பூமியை
  rationale: பூமி தன் இடத்திலிருந்து அசைக்கப்படுவதும் அதன் தூண்கள் நடுங்குவதும் பிரபஞ்ச அளவிலான கவித்துவப் படிமம் என்பதால், உள்ளூர் பொருளுடைய ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: מִמְּקוֹמָהּ
  choice: அதன் இடத்திலிருந்து
  rationale: முன்னிடைச்சொல், பெயர்ச்சொல், மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு ஆகியவற்றின் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וְעַמּוּדֶיהָ
  choice: அதன் தூண்கள்
  rationale: עמוד என்பதன் அடிப்படைப் பொருளான ‘தூண்’ என்பதைத் தக்கவைத்து, கவித்துவமான பண்டைய பிரபஞ்சப் படிமத்தை ‘அஸ்திவாரங்கள்’ என விளக்கி மாற்றுவதைத் தவிர்க்கிறது.
- source_word: יִתְפַלָּצוּן
  choice: நடுங்குகின்றன
  rationale: இந்த வினை கடுமையான அதிர்வையோ நடுக்கத்தையோ குறிக்கிறது. ‘நடுங்குகின்றன’ என்பது படிமத்தை மனவுணர்ச்சி சார்ந்ததாக மட்டும் மாற்றாமல் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அதிர்கின்றன’, ‘குலுங்குகின்றன’ என்பவையும் சாத்தியம்.
theological_decisions:
- issue: பூமியின் தூண்கள் என்ற பிரபஞ்சவியல் படிமம்
  choice: ‘அதன் தூண்கள்’ என்ற கவித்துவப் படிமத்தை அப்படியே தக்கவைத்தல்
  alternative: நவீன பிரபஞ்சக் கருத்துக்கு ஏற்ப ‘அதன் அஸ்திவாரங்கள்’ என விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய உரை பண்டைய கவித்துவமான பிரபஞ்சப் படிமத்தைப் பயன்படுத்துகிறது. அதை நவீனப்படுத்தவோ கோட்பாட்டுச் சிக்கலைத் தீர்க்கும் விதமாக மாற்றவோ செய்யாமல், மூலத்தின் இலக்கியப் படிமத்தையும் அதன் இயல்பான பதற்றத்தையும் மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினையெச்சத் தொடரை தமிழில் இயல்பாக அமைய ‘அவர் ... அசைக்கிறார்’ என்ற முழு வாக்கியமாக வழங்கியுள்ளோம்; பிரபஞ்சப் படிமம் விளக்கமின்றி தக்கவைக்கப்பட்டுள்ளது.
