base_translation:
  language: en
  yaml_path: translation/ot/job/009/014.yaml
  text: How much less could I answer him and choose my words with him?[a][b][c]
translation:
  language: ta
  text: அப்படியிருக்க, நான் அவருக்குப் பதிலளிக்கவும், அவரோடு பேசுவதற்கு என் சொற்களைத் தேர்ந்தெடுக்கவும் எப்படிக் கூடும்?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படியானால் நான் அவருக்கு எப்படிப் பதிலளிக்க முடியும்?” சூழலில், எபிரேயத் தொடர் இன்னும் வலுவான இயலாமையை உணர்த்தும் மொழிவழக்கு.
    reason: lexical_alternative
  - marker: b
    text: “என் சொற்களை” என்பதற்கு மாற்றாக, “என் வாதங்களை” என்றும் மொழிபெயர்க்கலாம்; ஏனெனில் தேவனுக்கு முன்பாகத் தன் வழக்கை எடுத்துரைக்க யோபு முயல்வதே இங்குள்ள சூழல்.
    reason: lexical_alternative
  - marker: c
    text: “அவரோடு” என்பதற்கு மாற்றாக, “அவர் முன்னிலையில்” அல்லது “அவருக்கு எதிராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: அப்படியிருக்க ... எப்படி ... முடியும்?
  rationale: முந்தைய வசனங்களின் அடிப்படையில், யோபுவால் தேவனை எதிர்கொள்ள இயலாது என்பதை வலியுறுத்தும் எபிரெய மொழிவழக்கின் தர்க்க வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்து வரும் முதலாம் நபர் ஒருமைப் பெயர்ச்சொல்; வாக்கிய அமைப்பே அதன் வலியுறுத்தலைத் தமிழில் போதுமான அளவு காட்டுகிறது.
- source_word: אֶעֱנֶנּוּ
  choice: அவருக்குப் பதிலளித்து
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதிலளித்தல்’; இங்கு வரும் வினாவடிவம் யோபுவின் இயலாமையை வெளிப்படுத்துகிறது.
- source_word: אֶבְחֲרָה
  choice: தேர்ந்தெடுக்க
  rationale: בחר என்பதன் நேரடியான ‘தேர்ந்தெடு’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: דְבָרַי
  choice: என் சொற்களை
  rationale: דבר என்பதன் நேரடியான பொருளையும், தேவனிடம் பேசுவதற்கான சொற்களை கவனமாகத் தேர்ந்தெடுக்கும் உருவகத்தையும் பாதுகாக்கிறது; ‘வாதங்களை’ என்பது சூழல் சார்ந்த விளக்கம்.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: עם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைப் பாதுகாத்து, நீதிமன்ற அல்லது எதிர்ப்பு நுணுக்கத்தை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்தாமல் விடுகிறது.
theological_decisions:
- issue: யோபு தேவனிடம் பேசுவதன் நீதிமன்ற/எதிர்ப்பு நுணுக்கம்
  choice: ‘அவரோடு பேச’ என்று பொதுவாக வைக்கப்பட்டது.
  alternative: ‘அவர் முன்னிலையில்’ அல்லது ‘அவருக்கு எதிராக’
  rationale: எபிரெய עִמּוֹ அடிப்படையில் ‘அவரோடு’ என்று பொருள்படும்; சூழல் நீதிமன்ற விவாதத்தைச் சுட்டினாலும், அதனை ஒரே விளக்கமாக நிர்ணயிக்காமல் மூலத்தின் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட வினாவடிவம் பயன்படுத்தப்பட்டது. ‘தேவன்’ என்ற பெயர் மூல வசனத்தில் வெளிப்படையாக இல்லாததால், சுட்டுப்பெயரான ‘அவர்’ மட்டுமே பயன்படுத்தப்பட்டது.
