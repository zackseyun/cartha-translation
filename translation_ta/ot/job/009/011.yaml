lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: வலியுறுத்தி கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உயிரோட்டத்தையும், நவீனத் தமிழில் இயல்பான கண்ணியமான நடையையும் காக்கிறது.
- source_word: יַעֲבֹר עָלַי
  choice: என்னைக் கடந்து செல்கிறார்
  rationale: עבר உடன் வரும் עָלַי, இச்சூழலில் யோபின் அருகாக அல்லது அவரைக் கடந்து செல்லும் இயக்கத்தைக் குறிக்கிறது; ‘என்மேல்’ என்பது தேவையற்ற உடல் சார்ந்த பொருளை ஏற்படுத்தக்கூடும்.
- source_word: וְלֹא אֶרְאֶה
  choice: நான் அவரைக் காண்பதில்லை
  rationale: எளிய எதிர்மறை வினையை நேரடியாக மொழிபெயர்க்கிறது; ‘காண முடியவில்லை’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத இயலாமை சேர்க்கப்படும்.
- source_word: וְיַחֲלֹף
  choice: அவர் கடந்துபோகிறார்
  rationale: חלף குறிக்கும் கடந்து அல்லது விலகிச் செல்லும் இயக்கத்தைத் தக்கவைத்து, முதல் வினையுடனான கவிதை இணைநிலையையும் சிறிய சொல் வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: וְלֹא אָבִין לוֹ
  choice: நான் அவரை உணர்ந்துகொள்வதில்லை
  rationale: בין என்பதன் பகுத்துணர்தல் அல்லது புரிந்துகொள்ளுதல் என்ற பொருள் வரம்பை இச்சூழலில் உணர்வால் அறிதல் என்ற வகையில் இயல்பாக வெளிப்படுத்துகிறது; לוֹ மூன்றாம் நபரைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மூன்றாம் நபர் எழுவாயும் சுட்டுப்பெயர்களும் யாரைக் குறிக்கின்றன
  choice: அவை கடவுளைக் குறிக்கின்றன; ஆனால் வசனத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரை உரையில் சேர்க்காமல் ‘அவர்’ என வழங்கப்பட்டுள்ளது.
  alternative: குறிப்பிடப்படாத ஒருவர் கடந்து செல்கிறார் என்று வாசித்தல்.
  rationale: யோபு 9:10–12-ன் உடனடிச் சூழல் கடவுளின் ஆராய முடியாத செயல்களைப் பற்றியது. ஆகவே தனிப்பட்ட மூன்றாம் நபர் குறிப்பு பாதுகாக்கப்படுகிறது; அதேவேளை மூல வசனத்தில் இல்லாத தெய்வப் பெயர் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு இயக்க வினைகளும் காணுதல்–உணர்தல் என்ற பொருள் முன்னேற்றமும் பாதுகாக்கப்பட்டுள்ளன.
