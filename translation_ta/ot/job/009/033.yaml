  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: ta
  text: 'எனக்கும் உமக்கும் இடையில் தீர்ப்பாளர் யாரும் இல்லை;

    அவர் நம் இருவர்மேலும் தம் கையை வைக்கக்கூடும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: யாரும் இல்லை
  rationale: இல்லாமையைச் சுட்டும் எபிரெய இருப்பியல் மறுப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: בֵּינֵינוּ
  choice: எங்களுக்கு இடையே
  rationale: சர்ச்சையில் உள்ள யோபும் கடவுளும் ஆகிய இரு தரப்புகளுக்கிடையேயான உறவைச் சுட்டுகிறது. இங்கு கடவுளை நேரடியாக அழைத்துப் பேசாத சூழல் என்பதால் தமிழின் தன்மை வேறுபாட்டின்படி ‘எங்களுக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מוֹכִיחַ
  choice: தீர்ப்பாளர்
  rationale: יכח என்ற வேர்ச்சொல் இச்சட்டவாதச் சூழலில் இரு தரப்புகளுக்கிடையே விசாரித்துத் தீர்மானிப்பவரைக் குறிக்கிறது. ‘தீர்ப்பாளர்’ நீதிசார் பொருளைத் தக்கவைத்து, பிற்கால இறையியல் கருத்தை வசனத்திற்குள் முன்கூட்டியே புகுத்துவதைக் தவிர்க்கிறது.
- source_word: יָשֵׁת
  choice: வைக்கக்கூடும்
  rationale: இல்லாத தீர்ப்பாளர் செய்யக்கூடிய கற்பனையான அல்லது சாத்தியமான செயலை எபிரெய வினை வடிவத்துக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: יָדוֹ
  choice: தமது கையை
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கக்கூடிய உருவகமாக இருந்தாலும், மூலத்தின் தெளிவான ‘கை’ என்ற உருவத்தை மொழிபெயர்ப்பில் தக்கவைக்கிறது.
- source_word: עַל שְׁנֵינוּ
  choice: எங்கள் இருவர்மீதும்
  rationale: தீர்ப்பாளர் சர்ச்சையின் இரு தரப்புகளுடனும் சமமாகத் தொடர்புகொள்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: מוֹכִיחַ என்பதைக் கிறிஸ்தவ இறையியல் எதிரொலி கொண்ட ‘மத்தியஸ்தர்’ என்று மொழிபெயர்க்கலாமா
  choice: தீர்ப்பாளர்
  alternative: மத்தியஸ்தர்; நடுவர்
  rationale: உடனடிச் சூழலில் யோபு தனக்கும் கடவுளுக்கும் இடையிலான வழக்கை விசாரித்துத் தீர்க்கும் மூன்றாம் நபர் இல்லாததைப் புலம்புகிறார். ‘தீர்ப்பாளர்’ அந்த நீதிசார் பொருளைக் காக்கிறது; வசனம் வெளிப்படையாகக் கூறாத பிற்கால இறையியல் அடையாளத்தைத் திணிப்பதில்லை. சாத்தியமான இடைநிலைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. சட்டவாதச் சூழலை ‘தீர்ப்பாளர்’ தக்கவைக்கிறது; ‘கையை ... வைக்க’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
