  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: ta
  text: 'அவர் மலைகளை அவற்றின் இடத்திலிருந்து அகற்றுகிறார்[a];

    அவை அறியாமலேயே, தமது கோபத்தில் அவற்றைப் புரட்டிப்போடுகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மலைகளை நகர்த்துகிறார்.’ எபிரேய வினைச்சொல் ஒன்றை அதன் இடத்திலிருந்து நகரச் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: அவற்றின் இடத்திலிருந்து அகற்றுகிறவர்
  rationale: עתק என்பதன் ஹிஃபில் வடிவம் ஒன்றை அதன் இடத்திலிருந்து நகரச் செய்வதைக் குறிக்கிறது. மலைகளைப் பற்றிய இக்கவிதைச் சூழலில் ‘அகற்றுகிறவர்’ என்பது வல்லமையை இயல்பாக வெளிப்படுத்துகிறது; ‘இடத்திலிருந்து’ என்பது மூல வினையின் பொருளைத் தெளிவாக்குகிறது.
- source_word: הָרִים
  choice: மலைகளை
  rationale: எபிரேயப் பன்மையை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: וְלֹא יָדָעוּ
  choice: அவற்றுக்குத் தெரியாமலேயே
  rationale: ‘அவை அறியவில்லை’ என்ற மூலத்தின் மனிதப் பண்பேற்றப்பட்ட கவிதைப் படிமத்தைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: אֲשֶׁר
  choice: —மலையே அறியாத நிலையில் நிகழும் செயலை இணைக்கும் அமைப்பு—
  rationale: இங்கு אֲשֶׁר சூழ்நிலை அல்லது காலத் தொடர்பைக் காட்டுகிறது. தமிழில் ‘தெரியாமலேயே ... புரட்டிப்போடுகிறார்’ என்ற அமைப்பு அதே தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲפָכָם
  choice: அவற்றைப் புரட்டிப்போடுகிறார்
  rationale: הפך என்பதன் ‘திருப்பு, புரட்டு, தலைகீழாக்கு’ என்ற வன்மையான கருத்தையும், -ם என்ற ‘அவற்றை’ என்னும் பின்னொட்டையும் வெளிப்படுத்துகிறது.
- source_word: בְּאַפּוֹ
  choice: தமது கோபத்தில்
  rationale: אַף இங்கு வழக்காற்றுப் பொருளில் ‘கோபம்’ என்பதாகும். ‘தமது’ என்பது ஒருமைத் தெய்வீகச் செய்பவரைக் கண்ணியமான தமிழில் சுட்டுகிறது; ‘கோபத்தில்’ என்பது சூழ்நிலை அல்லது கருவி சார்ந்த நுட்பத்தைத் தீர்மானிக்காமல் தக்கவைக்கிறது.
