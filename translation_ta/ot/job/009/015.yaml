  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: ta
  text: நான் நீதிமானாக இருந்தாலும், பதிலளிக்க மாட்டேன்; என் நீதிபதியிடம் இரக்கத்திற்காக மன்றாடுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: நான் நீதிமானாக இருந்தாலும்
  rationale: கால் வடிவத்தின் ‘நீதியுள்ளவனாக/சரியானவனாக இருத்தல்’ என்ற பொருளை, நிபந்தனை அமைப்போடு இயல்பான தமிழில் தருகிறது.
- source_word: לֹא אֶעֱנֶה
  choice: அவருக்குப் பதிலளிக்க மாட்டேன்
  rationale: אענה என்பதன் நேரடியான ‘பதில் அளித்தல்’ பொருளைப் பேணுகிறது; சூழலில் எதிர்வாதம் செய்வதில்லை என்ற சட்டவழக்குத் தொனியும் நீடிக்கிறது.
- source_word: לִמְשֹׁפְטִי
  choice: எனக்கு நீதி வழங்குபவரிடம்
  rationale: இந்த வடிவம் ‘என்னை நியாயந்தீர்ப்பவர்/எனது நீதிபதி’ எனப் புரியக்கூடியது. ‘என் நீதிபதி’ என்று மட்டும் கூறுவதால் ஏற்படக்கூடிய உடைமைத் தொனியைத் தவிர்த்து, நீதித் தீர்ப்பு வழங்கும் பங்கை வெளிப்படுத்துகிறது.
- source_word: אֶתְחַנָּן
  choice: இரக்கத்திற்காக மன்றாடுவேன்
  rationale: ஹித்பயேல் வடிவம் அருள் அல்லது இரக்கம் வேண்டி கெஞ்சுவதைச் சுட்டுகிறது; தமிழில் கண்ணியமும் தீவிரமும் உள்ள இயல்பான இணைச்சொல்.
theological_decisions:
- issue: யோபு தன்னை நீதிமான் எனக் கூறும் நிபந்தனையின் வலிமை
  choice: ‘நான் நீதிமானாக இருந்தாலும்’ என்று நிபந்தனையாகப் பேணப்பட்டது.
  alternative: ‘நான் குற்றமற்றவன் என்றாலும்’ அல்லது ‘என் பக்கம் நியாயம் இருந்தாலும்’.
  rationale: צדק என்பதன் சட்டநீதிசார் பரப்பை மிகக் குறுகிய ‘குற்றமற்ற’ என்ற கருத்தாகச் சுருக்காமல், யோபுவின் வாதத்திலுள்ள நீதியும் தாழ்மையும் இடையேயான பதற்றத்தைப் பேணுகிறது.
- issue: மன்றாட்டு யாரை நோக்கியது
  choice: ‘எனக்கு நீதி வழங்குபவரிடம்’ என்று வழங்கப்பட்டது.
  alternative: ‘என் நீதிபதியிடம்’.
  rationale: எபிரெய வடிவத்தின் நீதிபதி/நியாயந்தீர்ப்பவர் என்ற இரு நுணுக்கங்களையும் இயன்றவரை திறந்த நிலையில் வைத்திருக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். நீதிமன்றச் சூழலை உணர்த்தும் சொற்கள் பயன்படுத்தப்பட்டாலும், வசனம் சாதாரண வாசகருக்கு எளிதில் புரியும் வகையில் அமைக்கப்பட்டுள்ளது.
