  source_fidelity: மூன்று எபிரெயக் கூற்றுகளின் பொருளும் வரிசையும் காக்கப்பட்டுள்ளன. תָּם என்பதற்கு “குற்றமற்றவன்” சூழலுக்கு ஏற்றது; அது பாவமின்மையான முழுநிறைவைக் கட்டாயப்படுத்தாது என்பதை அடிக்குறிப்பு தகுந்தவாறு தெளிவுபடுத்துகிறது. “என்னையே நான் அறியேன்” என்பது לֹא אֵדַע נַפְשִׁי என்பதன் வேண்டுமென்றே சுருக்கமான, ஓரளவு திறந்த பொருளைத் தக்கவைக்கிறது. “என் வாழ்வை வெறுக்கிறேன்” אֶמְאַס חַיָּי என்பதற்கு நேர்மையானது.
