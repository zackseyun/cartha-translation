  text: תָּֽם אָ֭נִי לֹֽא אֵדַ֥ע נַפְשִׁ֗/י אֶמְאַ֥ס חַיָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: ta
  text: நான் குற்றமற்றவன்[a]; என்னையே நான் அறியேன்; என் வாழ்வை வெறுக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் நேர்மையானவன்.” תָּם என்பது முழுமை, நேர்மை, குற்றமற்ற தன்மை ஆகிய பொருள்களைத் தரலாம்; பாவமே இல்லாத முழுநிறைவை இது கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: குற்றமற்றவன்
  rationale: இங்கு இச்சொல் பாவமே இல்லாத முழுநிறைவைக் காட்டாமல், யோபுவின் நேர்மையையும் குற்றமற்ற நிலையைப் பற்றிய அவரது வாதத்தையும் குறிக்கிறது.
- source_word: אָ֭נִי
  choice: நான்
  rationale: எபிரெய மொழியில் வலியுறுத்தப்பட்டுள்ள தன்மைச் சுட்டுப்பெயரைத் தமிழிலும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: לֹא אֵדַע
  choice: அறியேன்
  rationale: יָדַע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காத்து, தன்னை அறியாமையா, தன்மீது அக்கறையின்மையா என்ற சூழல்சார் இருபொருள் வாய்ப்பைத் தீர்த்துவிடாமல் விடுகிறது.
- source_word: נַפְשִׁי
  choice: என்னையே
  rationale: נֶפֶשׁ என்பதற்கு சுயம், உயிர், வாழ்க்கை என்ற பரந்த பொருள் உண்டு; இங்கு இயல்பான தமிழில் பிரதிபெயர்ப் பொருளை ‘என்னையே’ தெரிவிக்கிறது. பரந்த மூலச்சொல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶמְאַס
  choice: வெறுக்கிறேன்
  rationale: מָאַס என்பதன் நிராகரித்தல் அல்லது வெறுத்தல் என்ற வலிமையை, ‘என் வாழ்வு’ என்னும் செயப்படுபொருளுடன் இயல்பாகத் தருகிறது.
- source_word: חַיָּי
  choice: என் வாழ்வை
  rationale: யோபுவின் உயிர்வாழும் இருப்பைச் சுட்டும் חַיִּים என்பதற்கு இங்கு இயல்பான நவீனத் தமிழ் வடிவம்.
