translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று கூற்றுகளும் அரைப்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன. ‘அறியேன்’ என்பது சற்றே உயர்ந்தாலும் பொதுவாகப் புரியும் வடிவம்; மூலத்தின் கூர்மையையும் சுருக்கத்தையும் காக்கிறது.
