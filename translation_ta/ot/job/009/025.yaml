source:
  edition: WLC
  text: וְ/יָמַ֣/י קַ֭לּוּ מִנִּי רָ֑ץ בָּֽ֝רְח֗וּ לֹא רָא֥וּ טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: ta
  text: என் நாட்கள் ஓட்டக்காரனைவிட விரைவானவை; அவை ஓடிப்போகின்றன; நன்மையை[a] காண்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “செழிப்பு” அல்லது “நல்வாழ்வு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: יוֹם என்பதன் உடைமைப் பன்மையை நேரடியாகக் காட்டுவதோடு, ஒருவரின் வாழ்நாட்களைக் குறிக்கும் எபிரெய வழக்கையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: קַלוּ
  choice: விரைவானவை
  rationale: קלל இங்கு ‘இலகுவானவை’ என்பதைக் காட்டிலும் வேகத்தைக் குறிக்கிறது; ஓட்டக்காரனுடன் வரும் ஒப்பீட்டில் ‘விரைவானவை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִנִּי רָץ
  choice: ஓட்டக்காரனைவிட
  rationale: מִן ஒப்பீட்டைக் குறிக்கிறது; רָץ என்பது பொதுவாக ஓடுகிற ஒருவரை அல்லது ஓட்டக்காரனைச் சுட்டுகிறது. ‘தூதோட்டக்காரன்’ போன்ற குறிப்பான பொருள் சூழலில் உறுதிப்படுத்தப்படவில்லை.
- source_word: בָּרְחוּ
  choice: அவை ஓடிப்போகின்றன
  rationale: விலகி ஓடுதல் அல்லது தப்பிச் செல்லுதல் என்ற உயிரோட்டமான அசைவை வெளிப்படுத்துகிறது; தமிழில் ‘தப்பியோடுகின்றன’ என்று கூறுவதால் தேவையற்ற ஆபத்து அல்லது துரத்தல் நுணுக்கம் சேரக்கூடும்.
- source_word: לֹא רָאוּ
  choice: காண்பதில்லை
  rationale: யோபுவின் நாட்கள் நன்மையை அனுபவிக்காமல் கடந்துபோகின்றன என்ற உருவகத்தைத் தீர்க்காமல், ‘காணுதல்’ என்ற மூலப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: טוֹבָה
  choice: நன்மை
  rationale: טוֹבָה என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; அது செழிப்பு, நல்வாழ்வு அல்லது நல்ல அனுபவம் ஆகியவற்றை உள்ளடக்கக்கூடும் என்பதால் பிரதான உரையில் அதிகமாகக் குறிப்பாக்கப்படவில்லை.
