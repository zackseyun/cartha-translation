translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தில் வெளிப்படையான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அது சேர்க்கப்படவில்லை. அடிக்குறிப்புக் குறி, அது விளக்கும் טוֹבָה என்பதற்கான ‘நன்மை’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
