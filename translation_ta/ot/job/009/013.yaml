source:
  edition: WLC
  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: ta
  text: 'கடவுள் தமது கோபத்தைத் திரும்பப் பெறமாட்டார்;

    அவருக்குக் கீழே ராகாபின் துணைவர்கள் குனிந்து நிற்கிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ராகாப்’ என்பது இங்கு கடவுளுக்கு எதிரான ஆதிகாலக் குழப்ப வல்லமையையோ கடல் அரக்கனையோ குறிக்கலாம்; அதன் ‘துணைவர்கள்’ அதனோடு சேர்ந்த வல்லமைகள்.
    reason: நவீன வாசகருக்கு அறிமுகமில்லாத புராணக் கவிதைப் படிமத்தை விளக்குகிறது; அதேவேளை அதன் துல்லியமான அடையாளம் உறுதியல்ல என்பதைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: தமது கோபத்தைத் திருப்பிக்கொள்ளமாட்டார்
  rationale: எபிரெயச் சொற்றொடரின் ‘தம் கோபத்தைத் திரும்பச் செய்யமாட்டார்/விலக்கமாட்டார்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; கோபம் தணிவதில்லை என்ற வலிமையையும் காக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குக் கீழே
  rationale: இடநிலைப் பொருளையும் ஆட்சிக்குக் கீழ்ப்பட்ட நிலை என்ற உட்பொருளையும் தீர்மானிக்காமல் பாதுகாக்கிறது.
- source_word: שָׁחֲחוּ
  choice: ஒடுங்கிக் கிடக்கிறார்கள்
  rationale: குனிதல், தாழ்த்தப்படுதல், அடங்கி ஒடுங்குதல் ஆகிய கூறுகளை வெளிப்படுத்துகிறது; சாதாரணமாக ‘வணங்குகிறார்கள்’ என்று மொழிபெயர்த்து வழிபாட்டு அர்த்தத்தைத் தேவையின்றி புகுத்துவதைத் தவிர்க்கிறது.
- source_word: עֹזְרֵי רָהַב
  choice: ராகாபின் துணைவர்கள்
  rationale: ‘ராகாபுக்கு உதவுவோர்/அதன் துணைவர்கள்’ என்ற கட்டமைப்பைத் தக்கவைக்கிறது; ராகாப் இங்கு புராணக் கடல் அரக்கனை அல்லது அகந்தைமிக்க குழப்ப வல்லமையைச் சுட்டலாம் என்பதால் பெயரை ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: ராகாபின் அடையாளம்
  choice: ‘ராகாப்’ என்ற பெயரை மொழிபெயர்க்காமல் வைத்தல்
  alternative: ‘அகந்தை’ அல்லது ‘கடல் அரக்கன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இச்சூழலில் רהב ஒரு புராணக் குழப்ப வல்லமையைக் குறிக்கும் பெயராக இருக்கலாம்; ஆனால் சொல்லின் தொடர்புகள் பலவாக இருப்பதால் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: שָׁחֲחוּ என்பதன் செயற்பாடு
  choice: ‘ஒடுங்கிக் கிடக்கிறார்கள்’
  alternative: ‘வணங்குகிறார்கள்’ அல்லது ‘குனிந்தார்கள்’
  rationale: தேவனின் வல்லமைக்கு அடக்கப்பட்ட நிலையைத் தெரிவிக்கிறது; விருப்பமான வழிபாடு என்ற கருத்தைச் சேர்க்கவில்லை. எபிரெய நிறைவுச் செயல்வடிவம் கவிதைச் சூழலில் நிகழ்நிலை உண்மையாகத் தமிழாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; கண்ணியமான, வாசிக்க எளிய கவிதைநடை. ‘தமது’ என்பது கடவுளைக் குறிக்கும் மரியாதைத் தற்சுட்டுப் பெயர். இரண்டாம் அடியில் மூலத்தின் இடவியல் மற்றும் ஆட்சிசார் இரட்டைப் பொருள் காக்கப்பட்டுள்ளது.
