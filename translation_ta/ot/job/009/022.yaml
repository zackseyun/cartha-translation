  text: אַחַ֗ת הִ֥יא עַל כֵּ֥ן אָמַ֑רְתִּי תָּ֥ם וְ֝/רָשָׁ֗ע ה֣וּא מְכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: ta
  text: 'எல்லாம் ஒன்றுதான்[a]; ஆகையால் நான் சொல்கிறேன்[b]: ‘குற்றமற்றவனையும் பொல்லாதவனையும் அவரே அழித்துவிடுகிறார்[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது ஒன்றே.”
    reason: lexical_alternative
  - marker: b
    text: “நான் சொன்னேன்” அல்லது “நான் சொல்லியிருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய நிறைவுற்ற வினை வடிவத்தைச் சூழலுக்கேற்ப நிகழ்காலமாகவோ இறந்தகாலம்/நிறைவுக்காலமாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அது குற்றமற்றவனையும் பொல்லாதவனையும் அழித்துவிடுகிறது”; ஆளற்ற பொருளில் எடுத்துக்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: எல்லாம் ஒன்றுதான்
  rationale: இந்த எபிரெயச் சொற்றொடர் எண்ணிக்கையில் ‘ஒன்று’ என்பதைவிட, முடிவில் வேறுபாடு இல்லை என்ற யோபுவின் கடுமையான கூற்றைத் தெரிவிக்கிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: אָמַרְתִּי
  choice: நான் சொல்கிறேன்
  rationale: வடிவில் நிறைவுற்ற வினையாக இருந்தாலும், இச்சூழலில் யோபு இப்போது முன்வைக்கும் முடிவாக இயல்பாகப் புரிகிறது; இறந்தகால/நிறைவுக்கால வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: תָּם
  choice: குற்றமற்றவன்
  rationale: பாவமே இல்லாத பரிபூரணத்தைக் குறிக்காமல், நேர்மையும் களங்கமற்ற நடத்தையும் குறிக்கும் சொல்லாக இங்கு வருகிறது.
- source_word: רָשָׁע
  choice: பொல்லாதவன்
  rationale: ஒழுக்க ரீதியாகத் தீயவரைக் குறிக்கும் வழக்கமான ஞான இலக்கியச் சொல்; ‘குற்றமற்றவன்’ என்பதற்கு இயல்பான எதிரிணை.
- source_word: הוּא מְכַלֶּה
  choice: அவரே அழித்துவிடுகிறார்
  rationale: ஆண்பால் ஒருமைப் பெயர்ச்சுட்டும் வினை வடிவமும் சூழலில் கடவுளைக் குறிப்பதாக இயல்பாகப் புரிகின்றன; מְכַלֶּה என்பதன் அழித்தொழிக்கும் வலிமையை ‘அழித்துவிடுகிறார்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அழித்துவிடுகிறார்’ என்பதன் மறைமுக எழுவாய்
  choice: கடவுளைக் குறிக்கும் மரியாதை ஒருமையாக ‘அவரே’
  alternative: ‘அது ... அழிக்கிறது’ என்ற ஆளற்ற வாசிப்பு
  rationale: யோபு 9-இன் சூழலில் கடவுளின் ஆட்சியையும் எதிர்க்க முடியாத வல்லமையையும் பற்றியே யோபு பேசுவதால், கடவுளே எழுவாய் என்பது மிக இயல்பானது. ஆயினும் எபிரெயிலுள்ள ஓரளவு தெளிவின்மையை அடிக்குறிப்பில் காக்கிறோம்; யோபுவின் தீவிரமான இறையியல் முறையீட்டை மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எல்லாம் ஒன்றுதான்’ என்பது யோபுவின் நம்பிக்கையிழந்த முடிவைச் சுருக்கமாகக் காக்கிறது. கடவுளைக் குறிக்கும் ‘அவரே’ மரியாதை ஒருமையிலும் வலியுறுத்தலுடனும் உள்ளது; மூலத்தின் இறையியல் பதற்றம் தணிக்கப்படவில்லை.
