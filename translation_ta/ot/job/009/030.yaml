  text: אִם הִתְרָחַ֥צְתִּי במו שָׁ֑לֶג וַ֝/הֲזִכּ֗וֹתִי בְּ/בֹ֣ר כַּפָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: ta
  text: நான் பனியால் என்னைக் கழுவி, சாம்பற்காரத்தால் என் கைகளைத் தூய்மையாக்கினாலும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோப்பால்”; எபிரெயச் சொல் இன்னும் துல்லியமாக, சுத்தம் செய்யப் பயன்பட்ட சாம்பற்காரம் போன்ற காரத்தன்மையுள்ள பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …ஆலும்
  rationale: இங்கு தொடங்கும் கற்பனை நிபந்தனை அடுத்த வசனத்தில் வரும் விளைவோடு இணைகிறது; தமிழில் ‘…ஆலும்’ என்பது ‘அப்படிச் செய்தாலும்கூட’ என்ற concessive நுண்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִתְרָחַצְתִּי
  choice: என்னைக் கழுவி
  rationale: רחץ என்பதன் ஹித்பயேல் வடிவிலுள்ள தன்முகச் செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: במו שָׁלֶג
  choice: பனியால்
  rationale: மூலத்தில் வெளிப்படையாக இருப்பது ‘பனி’; ‘பனி நீர்’ என்று விளக்கமாகச் சேர்க்காமல், தூய்மைப்படுத்தும் சாதனமாக அதன் பயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: וַהֲזִכּוֹתִי
  choice: தூய்மையாக்கி
  rationale: זכה என்பதன் ஹிஃபில் வடிவான ‘தூய்மையாக்குதல்’ என்ற காரணவினைப் பொருளைப் பாதுகாத்து, கழுவுதலோடு உள்ள இணைப்பையும் தருகிறது.
- source_word: בְּבֹר
  choice: காரத்தால்
  rationale: בֹּר என்பது நவீன சோப்பைத் துல்லியமாகக் குறிக்காமல், சுத்தம் செய்யப் பயன்பட்ட காரத்தன்மையுள்ள பொருளைக் குறிக்கிறது; ‘காரம்’ தமிழில் புரியக்கூடியதும் வரலாற்றுப் பொருளுக்கு அண்மையானதும் ஆகும்.
- source_word: כַּפָּי
  choice: என் கைகளை
  rationale: சொல்லுக்கு நேராக ‘என் உள்ளங்கைகள்’ என்றாலும், கழுவித் தூய்மைப்படுத்தும் சூழலில் ‘என் கைகள்’ என்பது இயல்பான தமிழ்ப் பயன்பாடு.
theological_decisions:
- issue: நிபந்தனையின் வலிமை
  choice: ‘…ஆலும்’ என மொழிபெயர்த்து, பயனற்ற உச்சமான சுயத் தூய்மைப்படுத்தல் என்ற வாத ஓட்டத்தைப் பாதுகாத்தல்
  alternative: ‘என்றால்’ என்ற நேரடியான நிபந்தனை
  rationale: אִם அடிப்படையில் நிபந்தனைச் சொல் என்றாலும், 31ஆம் வசனத்தின் தொடர்ச்சியில் ‘அப்படிச் செய்தாலும்கூட’ என்ற concessive வலிமை உள்ளது. இது யோபுவின் கூற்றை எந்தத் தனிப்பட்ட பாவக் கோட்பாட்டாலும் தீர்மானிக்காமல் அதன் வாதத் தீவிரத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை. இவ்வசனம் அடுத்த வசனத்துடன் இலக்கணமாகத் தொடர்வதால், முடிவில் ‘…ஆலும்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
