id: JOB.9.2
reference: Job 9:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: ta
  text: “உண்மையாகவே, அது அப்படித்தான் என்று நான் அறிவேன்; ஆனால், ஒரு மனிதன்[a] கடவுளுக்கு முன்பாக எவ்வாறு நீதியுள்ளவனாக இருக்க முடியும்?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பது எபிரெயத்தில் பலவீனமும் இறப்புக்குட்பட்ட தன்மையும் உடைய மனிதகுலத்தைக் குறிக்கும் பிரதிநிதி ஒருமைச் சொல்; “ஒரு சாவுக்குரிய மனிதன்” அல்லது “ஒரு மனிதர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு மனிதன் கடவுளோடு எவ்வாறு நீதிமானாகத் தீர்க்கப்பட முடியும்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: ஆம்
  rationale: யோபு வலியுறுத்தி ஒப்புக்கொள்வதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: எபிரெய நிறைவேற்றுநிலை இங்கு நிலையான அறிதலைக் குறிக்கிறது; தமிழில் நிகழ்கால வடிவம் இயல்பாக அதைக் கொண்டுவருகிறது.
- source_word: כִי כֵן
  choice: அது அப்படித்தான் என்று
  rationale: முந்தைய கூற்றை உறுதிப்படுத்தும் பொருளையும் சுட்டுணர்வையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּמַה
  choice: ஆனால் ... எப்படி
  rationale: வெறும் இணைப்பைவிட, ஒப்புதலிலிருந்து சிக்கலான கேள்விக்குத் திரும்பும் வாதநிலை மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: יִצְדַּק
  choice: நீதியுள்ளவனாக இருக்க முடியும்
  rationale: צדק என்பதன் ‘நீதியுள்ளவராக அல்லது சரியானவராக இருத்தல்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது; பின்னாளைய கோட்பாட்டுச் சொற்களைத் திணிக்கவில்லை.
- source_word: אֱנוֹשׁ
  choice: ஒரு மனிதன்
  rationale: ஒருமை வடிவிலுள்ள பிரதிநிதித்துவ மனிதனைக் காட்டுகிறது; இச்சொல்லில் உள்ள மனித பலவீனத்தின் நிழற்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: עִם אֵל
  choice: கடவுளுக்கு முன்பாக
  rationale: சொல்லுக்கு சொல் ‘கடவுளுடன்’ என்றாலும், இச்சூழலில் கடவுளின் முன்னிலையில் மனிதன் நீதியுள்ளவனாக நிற்பதைக் குறிக்கும் உறவு/நீதிமன்ற நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளுடன் தொடர்புடைய மனித நீதியின் நீதிமன்ற நுணுக்கம்
  choice: கடவுளுக்கு முன்பாக எப்படி நீதியுள்ளவனாக இருக்க முடியும்?
  alternative: கடவுளோடு எப்படி நீதிமானாகத் தீர்க்கப்பட முடியும்?
  rationale: எபிரெய வினை நீதிமன்ற நுணுக்கத்தையும் அனுமதிக்கிறது; எனினும், வசனம் பின்னாளைய எந்தக் குறிப்பிட்ட நீதிப்படுத்துதல் கோட்பாட்டையும் விளக்கவில்லை. தேர்ந்த வாசகம் அந்தத் தெய்வவியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீதியுள்ளவனாக’ என்பது வேதாகமச் சூழலுக்குரிய கருத்தைத் தக்கவைத்தாலும், ஒரு குறிப்பிட்ட சமயப் பிரிவின் தொழில்நுட்பச் சொல்லாட்சியைத் தவிர்க்கிறது.
