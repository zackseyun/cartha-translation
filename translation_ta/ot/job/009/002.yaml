  to: “உண்மையாகவே, அது அப்படித்தான் என்று நான் அறிவேன்; ஆனால், ஒரு மனிதன்[a] கடவுளுக்கு முன்பாக எவ்வாறு நீதியுள்ளவனாக இருக்க முடியும்?[b]”
