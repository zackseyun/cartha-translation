  text: הֲ/כִ/ימֵ֣י אֱנ֣וֹשׁ יָמֶ֑י/ךָ אִם שְׁ֝נוֹתֶ֗י/ךָ כִּ֣/ימֵי גָֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: ta
  text: 'உமது நாட்கள் மனிதனின் நாட்களைப் போன்றவையா?[a]

    அல்லது உமது ஆண்டுகள் வலிமையுள்ள ஆணின் நாட்களைப் போன்றவையா?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பதற்கான எபிரெயச் சொல் (אֱנוֹשׁ), மனிதனின் பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் גָבֶר என்பதற்கு “ஆண்” அல்லது “வலிமைமிக்க மனிதன்” என்றும் மொழிபெயர்க்கலாம். முந்தைய அடியிலுள்ள אֱנוֹשׁ என்பதிலிருந்து வேறுபாட்டைப் பேண இங்கு “வலிமையுள்ள ஆண்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: நாட்களைப் போன்றவையா?
  rationale: வினாவிடைச் சுட்டான הֲ, ஒப்புமையைக் குறிக்கும் כִּ, ‘நாட்கள்’ என்ற יְמֵי ஆகியவற்றை இயல்பான தமிழில் சொல்லாட்சி மாறாமல் வினாவாக வழங்குகிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: இச்சொல் மனிதனின் பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் உணர்த்தக்கூடும்; முதன்மை உரையில் பொதுவான மனிதப் பொருளை வைத்துப் பிற நுணுக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: יָמֶיךָ
  choice: உமது நாட்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் பன்மைச் சொல்லின் நேரான, மரியாதையான தமிழ் வடிவம்.
- source_word: אִם
  choice: அல்லது என்பதற்குப் பதிலாக இணையான இரண்டாம் வினாவாக
  rationale: கவிதை இணை அமைப்பில் אִם நிபந்தனையை அல்ல, மாற்று ஒப்புமையை அறிமுகப்படுத்துகிறது. தமிழில் இரு தொடர்ச்சியான வினாக்களாக அமைப்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁנוֹתֶיךָ
  choice: உமது ஆண்டுகள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் பன்மைச் சொல்லின் நேரான மொழிபெயர்ப்பு.
- source_word: כִּימֵי
  choice: நாட்களைப் போன்றவையா?
  rationale: முதல் அடியின் ஒப்புமை அமைப்பை இரண்டாம் அடியிலும் இணையாகப் பேணுகிறது.
- source_word: גָבֶר
  choice: வலிமையுள்ள ஓர் ஆண்
  rationale: גָבֶר என்பது வயதுவந்த ஆணைக் குறைப்பதோடு வலிமை அல்லது ஆற்றல் சார்ந்த நுணுக்கத்தையும் கொண்டிருக்கலாம்; אֱנוֹשׁ என்பதிலிருந்து உள்ள சொல் வேறுபாட்டையும் இது பேணுகிறது.
theological_decisions:
- issue: கடவுளின் காலவரம்பைப் பற்றிய வினா
  choice: மனிதரின் குறுகிய வாழ்நாளுடன் கடவுளின் நாட்களையும் ஆண்டுகளையும் ஒப்பிடும் சொல்லாட்சியை விளக்கமின்றி வினாவாகவே வைத்தல்
  alternative: ‘உமது ஆயுள் மனிதரைப்போல் குறுகியதா?’ என்று உட்பொருளை வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய உரையின் சொல்லாட்சியும் அதன் இறையியல் அழுத்தமும் மறைமுக வினாவிலேயே உள்ளன; விளக்கமான மாற்றம் கவிதையின் நெருக்கடியைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன செந்தமிழ் நடை; கடவுளை நோக்கிய உரைக்கு மரியாதை ஒருமையான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு இணை வினாக்களும் தனித்தனி அடிகளாகப் பேணப்பட்டுள்ளன.
