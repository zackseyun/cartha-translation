  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: ta
  text: ஆயினும், இவற்றை உமது உள்ளத்தில் மறைத்து வைத்தீர்[a]; இது உம்மிடமே இருந்தது[b] என்று நான் அறிந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவற்றை உமது உள்ளத்தில் சேமித்து வைத்தீர்.’ எபிரெய வினைச்சொல் ‘மறைத்தல்,’ ‘சேமித்து வைத்தல்,’ அல்லது ‘ஒதுக்கி வைத்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இது உம்மிடமே இருந்தது’ என்பது ‘இது உமது மனத்தில் இருந்தது’ அல்லது ‘இது உமது மறைவான நோக்கத்தின் ஒரு பகுதியாக இருந்தது’ என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ஆயினும், இவற்றை
  rationale: וְ என்பதற்கு அடிப்படையில் ‘மேலும்/மற்றும்’ என்ற பொருள் இருந்தாலும், முந்தைய வசனத்தில் கூறப்பட்ட தேவனுடைய நன்மைகளிலிருந்து மறைவான நோக்கத்திற்குத் திரும்பும் சூழலில் அதன் எதிர்மறைத் திருப்பத்தை ‘ஆயினும்’ இயல்பாக வெளிப்படுத்துகிறது. אֵלֶּה பன்மைச் சுட்டுப்பெயராக இருப்பதால் ‘இவற்றை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: צָפַנְתָּ
  choice: மறைத்து வைத்தீர்
  rationale: צפן என்பது ‘மறைத்தல்,’ ‘சேமித்து வைத்தல்,’ அல்லது ‘தேவைக்காக ஒதுக்கி வைத்தல்’ ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு தேவனுடைய வெளிப்படுத்தப்படாத உள்ளார்ந்த நோக்கத்தைச் சுட்டுவதால் ‘மறைத்து வைத்தீர்’ பொருத்தமானது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בִלְבָבֶךָ
  choice: உமது உள்ளத்தில்
  rationale: לֵבָב என்பது இருதயத்தை மட்டுமல்லாமல் மனம், சித்தம், உள்ளார்ந்த தன்மை ஆகியவற்றையும் குறிக்கலாம். ‘உமது உள்ளத்தில்’ என்பது எபிரெய உருவகத்தைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: יָדַעְתִּי
  choice: நான் அறிந்தேன்
  rationale: முதல் நபர் ஒருமை qatal வடிவத்தின் நேரான இறந்தகாலப் பொருளை ‘நான் அறிந்தேன்’ வழங்குகிறது; ‘உணர்ந்துகொண்டேன்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי, யோபு அறிந்திருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோள் நிறைவுருபான ‘என்று’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֹאת
  choice: இது
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர், முன்பு சொல்லப்பட்ட மறைவான காரியத்தைத் தொகுத்துச் சுட்டுகிறது. ‘இது’ என மொழிபெயர்ப்பது அதன் குறிப்பு எதைச் சார்ந்தது என்பதை விளக்கிச் சுருக்காமல், மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: עִמָּךְ
  choice: உம்மிடமே இருந்தது
  rationale: עִם உடன் இணைந்த இரண்டாம் நபர் பின்னொட்டு சொல்லர்த்தமாக ‘உம்முடன்/உம்மிடம்’ என்பதாகும். தமிழில் ‘உம்மிடமே இருந்தது’ என்பது அந்த மறைவான காரியம் தேவனிடத்தில் இருந்ததை இயல்பாகத் தெரிவிக்கிறது; ‘மனத்தில் இருந்தது’ அல்லது ‘திட்டமாக இருந்தது’ என்று மிகையாக விளக்கவில்லை.
theological_decisions:
- issue: தேவனுடைய மறைவான நோக்கத்தின் தன்மை
  choice: ‘இது’ எதைக் குறிக்கிறது என்பதைத் திட்டவட்டமாக்காமல், தேவன் மறைத்து வைத்த ஒரு நோக்கம் இருந்ததாக யோபு கூறும் முறையில் வசனத்தின் தெளிவின்மையும் இறையியல் பதற்றமும் தக்கவைக்கப்பட்டன.
  alternative: ‘இது’ என்பது யோபைத் துன்புறுத்துவதற்கான தேவனுடைய இரகசியத் திட்டம் என்று நேரடியாக விளக்குதல்; அல்லது முந்தைய வசனத்தின் ஆசீர்வாதங்களையே இது குறிக்கிறது என்று எடுத்துக்கொள்ளுதல்.
  rationale: எபிரெய வசனம் மறைக்கப்பட்ட காரியத்தின் குறிப்பை வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே, யோபின் குற்றச்சாட்டு நிறைந்த புலம்பலைத் தணிக்காமலும், மூலத்தில் இல்லாத குறிப்பிட்ட கோட்பாட்டைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கிய மரியாதை ஒருமை வடிவங்களான ‘உமது,’ ‘வைத்தீர்,’ ‘உம்மிடம்’ பயன்படுத்தப்பட்டன. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமாக வைக்கப்பட்டுள்ளது. ‘உள்ளம்’ எபிரெய இதய உருவகத்தின் மனம்–சித்தம் சார்ந்த பரப்பை இயல்பாகக் காக்கிறது.
