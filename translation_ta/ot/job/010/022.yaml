source:
  edition: WLC
  text: אֶ֤רֶץ עֵיפָ֨תָ/ה כְּמ֥וֹ אֹ֗פֶל צַ֭לְמָוֶת וְ/לֹ֥א סְדָרִ֗ים וַ/תֹּ֥פַע כְּמוֹ אֹֽפֶל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/010/022.yaml
  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: ta
  text: இருள் மண்டிய நாடு, காரிருளைப் போன்றது; மரண நிழலும் ஒழுங்கின்மையும் உள்ள நாடு; அது ஒளிர்வதும் காரிருளைப் போன்றதே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶץ
  choice: நாடு
  rationale: இங்கு யோபு இறந்தோரின் உலகத்தை ஒரு பிரதேசமாகச் சித்தரிப்பதால், பொதுவான ‘பூமி’ என்பதைக் காட்டிலும் ‘நாடு’ இயல்பாகவும் உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: עֵיפָתָה
  choice: இருள் மண்டிய
  rationale: இந்தச் சொல் இருளையும் மங்கலையும் குறிக்கிறது. ‘இருள் மண்டிய’ என்பது அதன் விவரணத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּמוֹ אֹפֶל
  choice: காரிருளைப் போன்ற
  rationale: אֹפֶל சாதாரண இருளைவிட அடர்ந்த, ஆழ்ந்த இருளைக் குறிக்கிறது. ‘காரிருள்’ அந்தத் தீவிரத்தைச் சுருக்கமாகக் காட்டுகிறது; எபிரேய மறுபடியுரைத்தலைப் பேணுவதற்காக வசனத்தின் இறுதியிலும் இதே சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: צַלְמָוֶת
  choice: மரண நிழல்
  rationale: இந்தச் சொல் மரணத்தோடு தொடர்புடைய நிழலைக் குறிக்கலாம்; அதேவேளையில் மிக ஆழ்ந்த இருள் என்றும் பொருள்படலாம். பாரம்பரியமும் சூழலுக்குப் பொருத்தமுமான ‘மரண நிழல்’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֹא סְדָרִים
  choice: ஒழுங்கே இல்லாத
  rationale: סְדָרִים ஒழுங்கு அல்லது அமைப்பைக் குறிக்கிறது. வலியுறுத்தும் எபிரேய எதிர்மறையை ‘ஒழுங்கே இல்லாத’ என்பது தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַתֹּפַע
  choice: அது ஒளிவிட்டாலும்
  rationale: יפע என்பதன் அடிப்படைப் பொருள் ‘ஒளிவிடுதல்’ அல்லது ‘பிரகாசித்தல்.’ அந்த நாடே இலக்கண எழுவாய். அதன் ஒளிகூட காரிருளைப் போன்றது என்ற முரணான படிமத்தைத் தெளிவுபடுத்த ‘ஒளிவிட்டாலும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: צַלְמָוֶת என்ற சொல்லில் மரணம் சார்ந்த படிமமா அல்லது பொதுவான ஆழ்ந்த இருளா என்பது
  choice: முதன்மை உரையில் ‘மரண நிழல்’
  alternative: ‘ஆழ்ந்த இருள்’
  rationale: இறந்தோரின் உலகத்தை நோக்கிய சூழலில் மரணம் சார்ந்த படிமம் பொருத்தமாக உள்ளது. எனினும் எபிரேயச் சொல்லை ஆழ்ந்த இருள் என்றும் புரிந்துகொள்ள இயல்வதால் அந்த உண்மையான சொல்லியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நாடு’ என்ற சொல்லை மீண்டும் கூறுவது எபிரேய வசனத்தின் அடுக்கான வருணனையைத் தமிழில் தெளிவாக்குகிறது. இறுதிக் கூறின் முரணான படிமம் விளக்கி நீக்கப்படாமல், ‘ஒளிவிட்டாலும் காரிருளைப் போலவே’ என்று பாதுகாக்கப்பட்டுள்ளது.
