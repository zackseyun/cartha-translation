translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. ‘ஆத்துமா’ என்ற சமயச்சார்பு நிறைந்த சொல்லுக்குப் பதிலாக ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டு, נַפְשִׁי என்பதன் இருமுறை பயன்பாடும் பாதுகாக்கப்பட்டுள்ளது.
