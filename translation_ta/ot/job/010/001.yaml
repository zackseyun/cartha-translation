  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: ta
  text: என் உள்ளம் என் வாழ்க்கையை அருவருக்கிறது[a]; என் புலம்பலைக் கட்டவிழ்த்துவிடுவேன்[b]; என் உள்ளத்தின் கசப்பில் பேசுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் உள்ளம் என் வாழ்க்கையால் சலித்துப்போயிருக்கிறது.’ எபிரெய வினை ஆழ்ந்த சலிப்பையும் அருவருப்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் புலம்பலை அடக்காமல் விட்டுவிடுவேன்.’ யோபு இனி தன் புலம்பலைக் கட்டுப்படுத்தப்போவதில்லை என்பதே எபிரெய மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: அருவருக்கிறது
  rationale: இந்த வினை ஆழ்ந்த வெறுப்பையும் சலிப்பையும் குறிக்கக்கூடும். இங்கு யோபின் உணர்ச்சியின் தீவிரத்தை இயல்பான நவீன தமிழில் ‘அருவருக்கிறது’ வெளிப்படுத்துகிறது; சலிப்பு என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נֶפֶשׁ இங்கு யோபின் உள்ளார்ந்த முழு ஆளுமையைக் குறிக்கிறது. ‘என் உள்ளம்’ என்பது ‘என் ஆத்துமா’ என்பதைவிட இன்றைய பொதுத் தமிழில் இயல்பாகவும், வசனத்தின் தொடக்கத்திலும் முடிவிலும் வரும் மறுபயன்பாட்டைப் பாதுகாக்கக்கூடியதாகவும் உள்ளது.
- source_word: בְּחַיָּי
  choice: என் வாழ்க்கையை
  rationale: முன்னிடைச்சொல்லுடன் வந்துள்ள இச்சொற்றொடர், யோபின் வெறுப்புக்குரிய பொருளாக அவரது வாழ்க்கையைக் குறிப்பிடுகிறது.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: என் புலம்பலைக் கட்டவிழ்த்துவிடுவேன்
  rationale: சொல்லுக்குச் சொல் ‘விட்டுவிடுவேன்’ என்றாலும், இந்த எபிரெய மரபுத்தொடர் புலம்பலை இனி அடக்காமல் வெளிப்படுத்துவதைச் சுட்டுகிறது. ‘கட்டவிழ்த்துவிடுவேன்’ அந்த உருவகத்தையும் தீர்மானத்தையும் தக்கவைக்கிறது.
- source_word: שִׂיחִי
  choice: என் புலம்பல்
  rationale: யோபின் சூழலில் שִׂיחַ நடுநிலையான தியானத்தை அல்ல, துயரத்திலிருந்து எழும் முறையீடு அல்லது புலம்பலைக் குறிக்கிறது.
- source_word: אֲדַבְּרָה
  choice: பேசுவேன்
  rationale: கோஹோர்டேட்டிவ் வடிவம் யோபின் உறுதியான நோக்கத்தைத் தெரிவிக்கிறது; தமிழில் ‘பேசுவேன்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמַר נַפְשִׁי
  choice: என் உள்ளத்தின் கசப்பில்
  rationale: முன்னிடைச்சொல் யோபு பேசும் உணர்ச்சிநிலையையோ விதத்தையோ குறிக்கிறது. ‘கசப்பில்’ மூல உருவகத்தையும் அதன் தீவிரத்தையும் பாதுகாக்கிறது.
