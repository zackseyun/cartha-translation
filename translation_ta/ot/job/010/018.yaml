source:
  edition: WLC
  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: ta
  text: அப்படியானால், ஏன் என்னைக் கருப்பையிலிருந்து வெளிவரச் செய்தீர்? நான் இறந்துபோயிருப்பேன்; எந்தக் கண்ணும் என்னைக் கண்டிருக்காது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இறந்துபோவேன்; எந்தக் கண்ணும் என்னைக் காணாது.” எபிரெய வினைவடிவங்களை இவ்வாறு நேரடியாகவும் மொழிபெயர்க்கலாம்; ஆனால் சூழல் நிகழாத எதிர்நிலைப் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: பின்பு ஏன்
  rationale: முன்னுள்ள புலம்பலோடு உள்ள தொடர்பை வாவ் காட்டுகிறது; ‘பின்பு’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵרֶחֶם
  choice: கருப்பையிலிருந்து
  rationale: பிறப்பின் தெளிவான உடல்சார் உருவகத்தைப் பாதுகாக்கும் நேரடியான இடமூலச் சொற்றொடர்.
- source_word: הֹצֵאתָנִי
  choice: என்னை ... வெளிவரச் செய்தீர்
  rationale: יצא என்பதன் ஹிப்ஈல் வடிவம் வெளியே வரச் செய்தலைக் குறிக்கிறது; இங்கு பிறக்கச் செய்ததைக் குறித்தாலும் மூலத்தின் ‘வெளியே வருதல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֶגְוַע
  choice: நான் இறந்துபோயிருப்பேன்
  rationale: இச்சூழலில் இம்பெர்ஃபெக்ட் நிகழாத எதிர்நிலை விளைவைச் சுட்டுகிறது; நவீன தமிழில் இது இயல்பான எதிர்நிலை வடிவம்.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: எந்தக் கண்ணும் என்னைக் கண்டிருக்காது
  rationale: ‘கண்’ என்பது பார்ப்பவரைக் குறிக்கும் ஆகுபெயராக உள்ளது; எதிர்மறை எதிர்நிலைத் தொடரைத் தமிழில் தெளிவாகவும் மூல உருவகத்துடனும் வழங்குகிறது.
