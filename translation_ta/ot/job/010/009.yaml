base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: ta
  text: களிமண்ணைப் போல[a] என்னை உண்டாக்கினீர் என்பதைத் தயவுசெய்து நினைவுகூருங்கள்; என்னைப் புழுதிக்குத் திருப்புவீரா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் ‘களிமண்ணைப் போல’ என்ற ஒப்புமையைக் குறிக்கிறது; ‘களிமண்ணிலிருந்து’ என்று வெளிப்படையாகச் சொல்லவில்லை. ஆயினும் படைப்பின் உருவகம் தெளிவாக நினைவூட்டப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னைப் புழுதிக்குத் திருப்புவீர்.’ எபிரெய வடிவத்தை உறுதிப்பாடாகவும், சூழலின் அடிப்படையில் சொல்லாட்சிசார் வினாவாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר־נָא
  choice: தயவுசெய்து நினைவுகூரும்
  rationale: זְכָר என்பது கடவுளை நேரடியாக நோக்கிக் கூறப்படும் ஆண்பால் ஒருமை ஏவல்; נָא வேண்டுகோளை மென்மையாக்குகிறது. மரியாதை ஒருமையுடன் கூடிய இந்தத் தமிழ் நடை வேண்டுதலின் தொனியை இயல்பாகக் காக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு நினைவுகூர வேண்டிய கருத்தை அறிமுகப்படுத்துவதால், தமிழில் உள்ளடக்கத் துணைவாக்கியத்தைக் குறிக்கும் ‘என்பதை’ இயல்பாகப் பொருந்துகிறது.
- source_word: כַחֹמֶר
  choice: களிமண்ணைப் போல
  rationale: כ முன்னொட்டு வெளிப்படையாக ஒப்புமையைக் குறிக்கிறது. படைப்பு உருவகம் இருந்தாலும், ‘களிமண்ணிலிருந்து’ என்று மூலத்தில் இல்லாத தொடக்கப்பொருளைச் சேர்க்காமல் ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: עֲשִׂיתָנִי
  choice: என்னை உண்டாக்கினீர்
  rationale: עשה என்பது பொதுவாக ‘செய்/உண்டாக்கு’ எனப் பொருள்படும். உடல் உருவாக்கத்தின் சூழலில் ‘உண்டாக்கினீர்’ இயல்பாக இருந்தாலும், ‘வடிவமைத்தீர்’ போன்ற அதிகத் துல்லியத்தை வினைக்குள் திணிப்பதில்லை.
- source_word: עָפָר
  choice: புழுதி
  rationale: עָפָר என்பதன் மண், மரணம், படைப்பு சார்ந்த படிமத்தை ‘புழுதி’ துல்லியமாகக் காக்கிறது; களிமண்ணிலிருந்து இதை வேறுபடுத்தியும் காட்டுகிறது.
- source_word: תְּשִׁיבֵנִי
  choice: என்னைப் புழுதிக்குத் திருப்புவீரா?
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்/திருப்பு’ என்று பொருள்படும். சூழலின் புலம்பல் தொனியை வெளிப்படுத்த வினாவாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இரண்டாம் கூற்று உறுதிப்பாடா அல்லது சொல்லாட்சிசார் வினாவா
  choice: ‘என்னைப் புழுதிக்குத் திருப்புவீரா?’ என்ற சொல்லாட்சிசார் வினா
  alternative: ‘என்னைப் புழுதிக்குத் திருப்புவீர்’ என்ற உறுதிப்பாடு
  rationale: எபிரெயத்தில் வெளிப்படையான வினாக்குறி இல்லை; எனினும் கடவுள் தம்மை உருவாக்கியதையும் அழிவுக்குத் திருப்புவதையும் யோபு எதிரெதிராக நிறுத்தும் புலம்பல் சூழல் வினாவை ஆதரிக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை நோக்கிய மரியாதை ஒருமை விகுதிகள் பயன்படுத்தப்பட்டுள்ளன. புலம்பலின் நேரடியான வேண்டுகோள் தொனியும், களிமண்–புழுதி படிம வேறுபாடும் காக்கப்பட்டுள்ளன.
