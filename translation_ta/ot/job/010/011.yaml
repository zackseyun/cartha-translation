base_translation:
  language: en
  yaml_path: translation/ot/job/010/011.yaml
  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: ta
  text: தோலாலும் சதையாலும் எனக்கு ஆடை அணிவித்தீர்; எலும்புகளாலும் தசைநார்களாலும் என்னைப் பின்னி அமைத்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எலும்புகளாலும் தசைநார்களாலும் என்னை மூடினீர்.” எபிரெய வினைச்சொல் மூடுதல் அல்லது சூழ்ந்திருத்தல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: தோல்
  rationale: மனித உடலைக் குறிக்கும் இச்சூழலில் ‘தோல்’ என்பது நேரடியான, இயல்பான பொருள்.
- source_word: בָשָׂר
  choice: சதை
  rationale: உடலின் தசைப்பகுதியைக் குறிக்கும் தெளிவான, concrete இணைச்சொல்; ‘உடல்’ என்பது மிகப் பொதுவானது.
- source_word: תַּלְבִּישֵׁנִי
  choice: எனக்கு ஆடை அணிவித்தீர்
  rationale: לבש என்பதன் ஹிபில் வடிவிலுள்ள ‘ஆடை அணிவித்தல்’ என்ற உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַּעֲצָמוֹת
  choice: எலும்புகளாலும்
  rationale: ב முன்னொட்டு இங்கு உடலை உருவாக்கப் பயன்படுத்தப்பட்ட கூறைச் சுட்டுகிறது; தமிழில் கருவிப் பொருளைக் காட்டும் ‘ஆலும்’ இயல்பாக உள்ளது.
- source_word: גִידִים
  choice: தசைநார்கள்
  rationale: இணைப்புத் திசுக்களைக் குறிக்கும் சொல்லை நவீன வாசகருக்குப் புரியும் வகையில் தருகிறது; ‘நரம்புகள்’ என்று மொழிபெயர்த்தால் nerves அல்லது blood vessels என்ற தவறான உடற்கூறியல் பொருள் தோன்றலாம்.
- source_word: תְּסֹכְכֵנִי
  choice: என்னைப் பின்னி அமைத்தீர்
  rationale: סכך என்பதிலுள்ள பின்னுதல்/ஒன்றிணைத்து உருவாக்குதல் என்ற சூழல்சார் நிழற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூடுதல் அல்லது சூழ்தல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறைவன் மனித உடலை உருவாக்கும் உருவகம்
  choice: யோபின் உடலை இறைவன் ஆடை அணிவிப்பதுபோலும் பின்னி அமைப்பதுபோலும் உருவாக்கியதாகக் கவிதைமுறையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இறைவன் எலும்புகளாலும் தசைநார்களாலும் யோபை மூடினார் அல்லது சூழ்ந்தார் என்று மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் யோபின் உடல் உருவாக்கப்பட்டதைப் பேசுகிறது. அதற்கு அப்பாற்பட்ட மனிதவியல் அல்லது படைப்புக் கோட்பாட்டைச் சேர்க்காமல், மூலத்தின் உடல் சார்ந்த உருவகத்தையும் வினைச்சொல்லின் பொருள் நெகிழ்வையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எனக்கு ஆடை அணிவித்தீர்’ என்ற சொற்றொடர் மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘தசைநார்கள்’ என்பது மருத்துவச் சொல்லாக்கமாக மிகக் கடினமில்லாமல் גִידִים என்பதன் உடற்கூறியல் பொருளைத் தெளிவாக்குகிறது.
