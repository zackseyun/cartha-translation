  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: ta
  text: நான் இருந்திராததுபோல் இருந்திருப்பேன்[a]; கருப்பையிலிருந்து கல்லறைக்குக் கொண்டுசெல்லப்பட்டிருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் ஒருபோதும் இருந்ததே இல்லாததுபோல் இருந்திருப்பேன்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “கருப்பையிலிருந்து கல்லறைக்குக் கொண்டுசெல்லப்பட்டிருப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: …போலவே
  rationale: இங்கு இது காலத்தைக் குறிக்கும் ‘எப்போது’ என்ற பொருளில் அல்லாமல், உண்மையில் நிகழாத ஒரு நிலையை ஒப்புமையாகக் காட்டுகிறது. ‘…போலவே’ என்பது அந்த எதிர்நிகழ்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: நான் இல்லாதிருந்ததைப் போலவே இருந்திருப்பேன்
  rationale: היה என்ற வினையின் இரு வடிவங்களும் சூழலில் யோபு விரும்பியிருந்த எதிர்நிகழ்வு நிலையை வெளிப்படுத்துகின்றன. தமிழின் ‘இருந்திருப்பேன்’ அமைப்பு அதை இயல்பாகக் காட்டுவதோடு, ‘இல்லாதிருந்தது’ என்பதிலுள்ள இருப்பு சார்ந்த பதற்றத்தையும் தக்கவைக்கிறது.
- source_word: מִבֶּטֶן
  choice: கருப்பையிலிருந்து
  rationale: ‘பிறந்தவுடன்’ என்று பொருளை விரித்துச் சொல்லாமல், மூலத்தின் கருப்பை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לַקֶּבֶר
  choice: கல்லறைக்கு
  rationale: קֶבֶר என்பது பாதாள உலகைக் குறிக்கும் ஷியோல் அல்ல; புதைக்கப்படும் கல்லறையையே குறிக்கிறது.
- source_word: אוּבָל
  choice: கொண்டுசெல்லப்பட்டிருப்பேன்
  rationale: יבל என்பதன் ஹோஃபால் வடிவம் ‘கொண்டுவரப்படுதல்/கொண்டுசெல்லப்படுதல்’ என்ற செயப்பாட்டு, காரணவினைப் பொருளைக் கொண்டது. இங்கு கருப்பையிலிருந்து கல்லறைக்குச் செல்லும் திசை தெளிவாக இருப்பதால் ‘கொண்டுசெல்லப்பட்டிருப்பேன்’ இயல்பான தேர்வாகும்.
- source_word: מִבֶּטֶן לַקֶּבֶר
  choice: கருப்பையிலிருந்து கல்லறைக்கு நேராக
  rationale: மூலத்தில் ‘நேராக’ என்பதற்கான தனிச்சொல் இல்லாவிட்டாலும், இடைப்பட்ட வாழ்வே இல்லாமல் ஒரு முனையிலிருந்து மறுமுனைக்குக் கொண்டுசெல்லப்பட்டிருப்பேன் என்ற சுருக்கமான உருவகத்தைத் தெளிவுபடுத்துகிறது; இதன் சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இல்லாதிருந்ததைப் போல’ என்பது முழுமையான இல்லாமையைப் பற்றிய கோட்பாட்டு அறிவிப்பா?
  choice: யோபின் எதிர்நிகழ்வுப் புலம்பலாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: இதை மரணத்திற்குப் பிந்தைய இல்லாமையை உறுதிப்படுத்தும் கூற்றாக விளக்குவது.
  rationale: வசனம், பிறப்பிலிருந்து கல்லறை வரை வாழ்வை அனுபவிக்காமலிருந்த நிலையை யோபு கற்பனை செய்து பேசும் புலம்பல். ஆன்மா அல்லது மரணத்திற்குப் பிந்தைய நிலை குறித்த ஒரு தனிக் கோட்பாட்டை மூலவசனம் இங்கு நிறுவவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கருப்பை’, ‘கல்லறை’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; எதிர்நிகழ்வைத் தெரிவிக்க ‘இருந்திருப்பேன்’ பயன்படுத்தப்பட்டுள்ளது.
