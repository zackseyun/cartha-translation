base_translation:
  language: en
  yaml_path: translation/ot/job/010/021.yaml
  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: ta
  text: நான் திரும்பி வராத இருளும் காரிருளும் நிறைந்த நாட்டிற்குச் செல்வதற்கு முன்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “இருளும் மரண நிழலும் நிறைந்த நாடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: முன்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொல் ‘முன்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது; அடுத்த வசனத்துடன் தொடரும் வேண்டுகோள் அமைப்பையும் இது காக்கிறது.
- source_word: אֵלֵךְ
  choice: நான் போய்
  rationale: הלך என்பதன் எளிய பொருளான ‘போ’ என்பதைக் காக்கிறது; சூழல் மரணத்தைச் சுட்டினாலும், ‘நான் இறந்து’ என்று விளக்கமாக்கவில்லை.
- source_word: וְלֹא אָשׁוּב
  choice: திரும்பி வராத
  rationale: שׁוב என்பதன் ‘திரும்பு’ என்ற நேரடிப் பொருளைத் தருகிறது. தமிழில் தொடர்பெயரெச்ச அமைப்பு இயல்பாக இருப்பதோடு, ‘ஒருபோதும்’ போன்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: אֶל
  choice: -க்கு
  rationale: செல்லும் திசை அல்லது இலக்கைக் குறிக்கும் எபிரெய முன்னிடைச்சொல் தமிழில் நான்காம் வேற்றுமையால் இயல்பாகத் தரப்படுகிறது.
- source_word: אֶרֶץ
  choice: நாடு
  rationale: இங்கு பொதுவான பூமியை அல்ல, இறந்தோருக்குரிய ஓர் இருண்ட பிரதேசத்தை அல்லது உலகத்தைச் சுட்டுகிறது; ‘நாடு’ அந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: அடிப்படைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: இச்சொல் மிக ஆழ்ந்த இருளையோ மரண நிழலையோ குறிக்கலாம். ‘காரிருள்’ கவிதைநயத்துடன் தீவிர இருளைக் காட்டுகிறது; மரணத்தை மூலத்தில் இருப்பதைவிட வெளிப்படையாகத் திணிப்பதில்லை.
theological_decisions:
- issue: மரணச் சூழலில் צַלְמָוֶת என்பதன் மொழிபெயர்ப்பு
  choice: காரிருள்
  alternative: மரண நிழல்
  rationale: எபிரெயச் சொல் ‘மிக ஆழ்ந்த இருள்’ என்றும் பாரம்பரியமாக ‘மரண நிழல்’ என்றும் புரிந்துகொள்ளப்படுகிறது. முதன்மை உரை இயல்பான தமிழில் கவிதை இணைநிலையைப் பாதுகாக்க ‘காரிருள்’ என்கிறது; பாரம்பரிய வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ‘போய்—திரும்பி வராமல்—நாட்டிற்குச் செல்வது’ என்ற சற்றே மீளுரைப்பான அமைப்பு, யோபுவின் புலம்பலின் அழுத்தத்தைப் பாதுகாக்கத் தமிழிலும் வைக்கப்பட்டுள்ளது.
