- from: நான் போய், திரும்பி வராததற்கு முன், இருளும் காரிருளும் நிறைந்த நாட்டிற்குச் செல்வதற்கு முன்,[a]
  to: நான் திரும்பி வராத இருளும் காரிருளும் நிறைந்த நாட்டிற்குச் செல்வதற்கு முன்,[a]
