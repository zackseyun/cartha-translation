source:
  edition: WLC
  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: ta
  text: நான் தீயவனாயிருந்தால், எனக்கு ஐயோ! நான் நீதிமானாயிருந்தாலும், அவமானத்தால் நிறைந்து என் துன்பத்தையே பார்த்துக்கொண்டிருக்கும் நான், என் தலையை நிமிர்த்த முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் துன்பத்தைப் பாரும்” அல்லது “இதோ, என் துன்பம்” என்றும் பொருள்கொள்ளலாம். இங்குள்ள எபிரேயத் தொடரியல் கடினமானது; சிலர் இதை யோபுவின் தன்னிலை வருணனையாக அல்லாமல், தேவனை நோக்கிய நேரடி வேண்டுகோளாகக் கருதுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: நான் பொல்லாதவனாக இருந்தால்
  rationale: רשע என்பதன் அறநெறிசார் பொருளைப் பேணுகிறது; இங்கு நிபந்தனைப் புலம்பலுக்கு இயல்பான நிலைமொழியாக அமைகிறது.
- source_word: אַלְלַי לִי
  choice: எனக்கு ஐயோ!
  rationale: துயரக் கூக்குரலின் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְצָדַקְתִּי
  choice: நான் நீதிமானாக இருந்தாலும்
  rationale: וְ இங்கு முந்தைய கூற்றுக்கு மாறான விட்டுக்கொடுப்பு நுண்பொருளைக் கொண்டுள்ளது; צדק என்பதன் அறநெறி மற்றும் நீதி சார்ந்த பொருளையும் பேணுகிறது.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: என் தலையை நிமிர்த்த முடியாது
  rationale: தன்னம்பிக்கையுடனும் கண்ணியத்துடனும் தலையை உயர்த்துதல் என்ற மரபுத்தொடரின் சூழல்சார் நடைமுறைப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: שְׂבַע קָלוֹן
  choice: அவமானத்தால் நிறைந்தவனாய்
  rationale: שְׂבַע என்பதன் ‘நிறைந்த/திகட்டுமளவு கொண்ட’ என்ற பெயரடைத் தன்மையையும், קָלוֹן என்பதன் இழிவு மற்றும் பொது அவமானப் பொருளையும் பேணுகிறது.
- source_word: וּרְאֵה עָנְיִי
  choice: என் துன்பத்தையே பார்த்துக்கொண்டிருப்பதால்
  rationale: கடினமான எபிரெயத் தொடரை யோபுவின் நிலை பற்றிய தொடர்ச்சியான வருணனையாக எடுத்துக்கொள்கிறது; அவன் துன்பமே அவன் பார்வையை ஆக்கிரமித்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது, ஆனால் மாற்று விளக்கத்தை அடிக்குறிப்பில் பேணுகிறது.
theological_decisions:
- issue: וּרְאֵה עָנְיִי என்பதன் தொடரியல் விளக்கம்
  choice: யோபு தன் துன்பத்தைப் பார்த்துக்கொண்டிருக்கும் நிலையின் வருணனை
  alternative: 'தேவனை நோக்கிய நேரடி வேண்டுகோள்: “என் துன்பத்தைப் பாரும்” அல்லது வியப்புரை: “இதோ, என் துன்பம்”'
  rationale: எபிரெய வடிவம் ஒன்றுக்கு மேற்பட்ட தொடரியல் விளக்கங்களை அனுமதிக்கிறது. உடனடியான சூழலில் இது யோபுவின் நிலை வருணனையின் தொடர்ச்சியாக வாசிக்கப்படலாம்; எனினும் நேரடி வேண்டுகோள் என்ற உண்மையான ஐயத்தை அடிக்குறிப்பு வெளிப்படையாகப் பேணுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ். ‘பொல்லாதவன்,’ ‘நீதிமான்,’ ‘தலையை நிமிர்த்த’ ஆகியவை மூலத்தின் அறநெறி-நீதிசார் எதிர்மறையையும் மரபுத்தொடரையும் பேணுகின்றன. கடினமான இறுதித் தொடரின் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
