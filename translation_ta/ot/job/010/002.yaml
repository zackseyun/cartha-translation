  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: ta
  text: 'நான் கடவுளிடம் சொல்வேன்: “என்னைக் குற்றவாளி எனத் தீர்க்காதீர்[a]; என்னோடு ஏன் வழக்காடுகிறீர்[b] என்பதை எனக்குத் தெரியப்படுத்துங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் குற்றவாளி என்று அறிவிக்காதீர்.” எபிரெய வினைச்சொல் நீதித்துறைச் சூழலில் குற்றவாளி எனத் தீர்ப்பளித்தலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னோடு ஏன் வாதிடுகிறீர்” அல்லது “எனக்கு எதிராக ஏன் வழக்குத் தொடுக்கிறீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: நான் சொல்வேன்
  rationale: Qal முற்றுப்பெறா வினை இச்சூழலில் யோபு கடவுளிடம் அடுத்து கூறவிருப்பதை அறிமுகப்படுத்துகிறது; எதிர்கால நோக்கை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶל אֱלוֹהַּ
  choice: கடவுளிடம்
  rationale: אֱלוֹהַּ என்பது யோபு நூலில் கடவுளைக் குறிக்கும் ஒருமை பொதுப்பெயர் அல்லது பட்டம்; ஒலிபெயர்ப்பை விட ‘கடவுள்’ நவீன தமிழில் இயல்பானது.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: என்னைக் குற்றவாளி எனத் தீர்க்காதீர்
  rationale: רשע என்பதன் Hiphil வடிவம் நீதித்துறைச் சூழலில் ஒருவரைக் குற்றவாளி என அறிவித்தல் அல்லது தீர்த்தல் என்ற பொருளைக் கொண்டது. இந்த மொழிபெயர்ப்பு அந்த நீதித்துறை நிழலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הוֹדִיעֵנִי
  choice: எனக்குத் தெரியப்படுத்தும்
  rationale: ידע என்பதன் Hiphil கட்டளை வடிவம் ‘அறியச் செய், தெரிவி’ என்று பொருள்படும்; இத்தமிழ் வடிவம் காரணவினைப் பொருளையும் வேண்டுகோளின் தொனியையும் இயல்பாகக் காட்டுகிறது.
- source_word: עַל מַה
  choice: ஏன்
  rationale: சொல்லுக்குச் சொல் ‘எதன் பேரில்/எதற்காக’ என்றாலும், இவ்வினாவாக்கியத்தில் காரணத்தை விசாரிப்பதால் ‘ஏன்’ என்பது தெளிவான இயல்பான இணை.
- source_word: תְּרִיבֵנִי
  choice: என்னோடு வழக்காடுகிறீர்
  rationale: ריב என்பது வாதிடுதல், மோதுதல், அல்லது ஒருவருக்கு எதிராக வழக்கு நடத்துதல் ஆகிய பொருள்களைக் கொண்டது. ‘வழக்காடுதல்’ நீதித்துறைத் தொனியைப் பாதுகாப்பதுடன் எதிர்த்து வாதிடும் பொருளையும் ஏற்கிறது.
theological_decisions:
- issue: கடவுளை நோக்கிய யோபுவின் வேண்டுகோளிலுள்ள நீதித்துறை நுண்பொருள்
  choice: ‘குற்றவாளி எனத் தீர்க்காதீர்’ என்றும் ‘என்னோடு வழக்காடுகிறீர்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘தீயவன் எனக் கருதாதீர்’ என்றும் ‘என்னோடு வாதிடுகிறீர்’ என்றும் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை நீதிமன்றம் மற்றும் மோதல் ஆகிய இரு தளங்களையும் நினைவூட்டுகிறது; ஆனால் முழுமையாகத் தொழில்நுட்ப நீதிமன்ற மொழிக்குள் அதைச் சுருக்கவில்லை. தேர்ந்த சொற்கள் யோபு கடவுளிடம் நீதிசார் மொழியில் முறையிடும் பதற்றத்தைப் பாதுகாக்கின்றன; இறைத்தீர்ப்பைப் பற்றிய மேலதிக கோட்பாட்டை உரைக்குள் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீர்’ சார்ந்த மரியாதை வினைமுற்றுகள் இயல்பான தமிழ் பக்தி மற்றும் இலக்கிய நடைக்கேற்ப அமைக்கப்பட்டுள்ளன. நீதித்துறை நுண்பொருள் முதன்மை உரையில் தக்கவைக்கப்பட்டாலும், ריב என்பதன் பரந்த மோதல்/வாதப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
