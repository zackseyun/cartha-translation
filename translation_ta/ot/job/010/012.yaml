source:
  edition: WLC
  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: ta
  text: நீர் எனக்கு வாழ்வையும் மாறாத அன்பையும் அளித்தீர்; உமது பராமரிப்பு[a] என் ஆவியை[b] காத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது கண்காணிப்பு” அல்லது “உமது விசாரிப்பு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் உயிர்மூச்சை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: வாழ்வு
  rationale: எபிரெயில் பன்மை வடிவில் இருந்தாலும், இங்கு முழுமையான ‘வாழ்வு’ என்பதைக் குறிக்கும் கருத்துப்பெயராக வருகிறது; ஒருமைத் தமிழ் இயல்பாக உள்ளது.
- source_word: וָחֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, உண்மைத்தன்மை, உறுதியான பற்றுறுதி ஆகிய நுணுக்கங்கள் உள்ளன. ‘மாறாத அன்பு’ அவற்றை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அதை வெறும் ‘இரக்கம்’ என்று குறுக்கவில்லை.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: எனக்கு … அளித்தீர்
  rationale: சொல்லுக்குச் சொல் ‘என்னோடு செய்தீர்’ என்றாலும், வாழ்வும் அன்பும் தேவனால் நன்மைகளாக வழங்கப்பட்டன என்பதே இச்சூழலின் பொருள். ‘அளித்தீர்’ அந்த நன்மைசெய்யும் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: וּפְקֻדָּתְךָ
  choice: உமது பராமரிப்பு
  rationale: פְקֻדָּה என்பது கவனிப்பு, கண்காணிப்பு, விசாரிக்க வருதல் போன்ற பரந்த பொருள்களைக் கொண்டது. தொடர்ந்து வரும் ‘காத்தது’ என்பதற்கு ஏற்ற நன்மையான, நீடித்த கவனிப்பை ‘பராமரிப்பு’ இயல்பாக உணர்த்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: שָׁמְרָה
  choice: காத்தது
  rationale: שׁמר என்பதன் அடிப்படைப் பொருள் காத்தல், பாதுகாத்தல். ‘காத்தது’ மூலத்தின் எளிமையையும், உயிரை நிலைநிறுத்திய கருத்தையும் பாதுகாக்கிறது.
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: רוּחַ என்பது ஆவி அல்லது மூச்சு எனப் பொருள்படலாம். இங்கு தேவனால் காக்கப்பட்ட மனிதனின் உள்ளுயிரை ‘ஆவி’ நன்கு குறிக்கிறது; ‘உயிர்மூச்சு’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தேவனைச் சார்ந்த חֶסֶד என்பதன் நுணுக்கம்
  choice: மாறாத அன்பு
  alternative: தயவு; இரக்கம்; பற்றுறுதியான அன்பு
  rationale: யோபுவுக்கு தேவன் செய்த நன்மையை வசனம் கூறுகிறது. ‘மாறாத அன்பு’ என்பதில் அன்பின் நிலைத்தன்மை வெளிப்படுகிறது; ஆனால் குறிப்பிட்ட ஓர் உடன்படிக்கைக் கோட்பாட்டை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: פְקֻדָּה என்பதன் பொருள்
  choice: நன்மை பயக்கும் தெய்வீகப் பராமரிப்பு
  alternative: கண்காணிப்பு; விசாரிக்க வருதல்
  rationale: ‘என் ஆவியைக் காத்தது’ என்ற உடனடி சூழல், தண்டனைக்கான வருகையைவிட பாதுகாக்கும் கவனிப்பையே முன்னிறுத்துகிறது. எனினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: רוּחִי என்பதன் பொருள்
  choice: என் ஆவி
  alternative: என் உயிர்மூச்சு
  rationale: இச்சொல் மனிதனின் ஆவியையோ அவனுடைய உயிர்மூச்சையோ குறிக்கக்கூடும். முதன்மை உரையில் ‘ஆவி’ வைக்கப்பட்டாலும், உடலுயிரைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் ‘நீர்/உமது’ நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் சுருக்கமாகவும் இயல்பாகவும் வைக்கப்பட்டுள்ளது; மூல எபிரெயின் பொருளியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
