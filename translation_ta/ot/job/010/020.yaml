translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. மறைமுகமாக தேவனை நோக்கிச் சொல்லப்படும் வேண்டுகோளுக்கு மரியாதையுள்ள ஒருமைக் கட்டளை வடிவமான “விடும்” பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கத்தையும் வேண்டுகோளின் தீவிரத்தையும் இயன்றவரை காத்துள்ளது.
