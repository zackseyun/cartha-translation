  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: ta
  text: என் நாட்கள் கொஞ்சம்தானே? நிறுத்தும்; என்னைத் தனியே விட்டுவிடும்; நான் சற்றே மனம் தெளிவடையட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைவிட்டு விலகும்” அல்லது “என்னிடமிருந்து திரும்பும்.” “நிறுத்தும்” என்பதையும் தொடர்ந்து வரும் எபிரெயச் சொற்றொடரையும் இணைத்துக் கூறும் விதம் சுருக்கமானதும் மரபுத்தொடரானதும் ஆகும்; “நான் சற்றே மனம் தெளிவடையட்டும்” என்பதற்கு, “நான் சிறிது ஆறுதல் அடையட்டும்” அல்லது “சற்றே தெம்படையட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא־מְעַט יָמַי
  choice: என் நாட்கள் கொஞ்சம்தானே?
  rationale: எதிர்பார்க்கப்படும் உடன்பாட்டை வலியுறுத்தும் எதிர்மறை வினாவையும், வாழ்நாட்கள் மிகக் குறைவு என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: חֲדַל / יחדל
  choice: நிறுத்தி
  rationale: மசோரா ஓரக்குறிப்பு வாசிப்பிலுள்ள கட்டளையான ‘நிறுத்து, ஓய்ந்திரு’ என்ற பொருளைப் பிரதிபலிக்கிறது; எதை நிறுத்த வேண்டும் என்பதை எபிரெயம் வெளிப்படையாகச் சொல்லாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: וְשִׁית מִמֶּנִּי / ישית ממני
  choice: என்னைத் தனியே விடும்
  rationale: சொல்லுக்குச் சொல் மாற்றுவதற்கு கடினமான, சுருக்கமான எபிரெயச் சொற்றொடரை அதன் சூழல்சார் வேண்டுகோளின்படி இயல்பாகத் தருகிறது.
- source_word: וְאַבְלִיגָה מְעָט
  choice: அப்போது நான் சற்றே மனம் தெளிவடைவேன்
  rationale: בלג என்ற வினை உணர்த்தும் சிறிதளவு மனநிம்மதி அல்லது உள்ளத்தின் தெளிவைத் தருகிறது; முழுமையான மீட்சியையோ மகிழ்ச்சியையோ மிகைப்படுத்தவில்லை.
