  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: ta
  text: நீர் ஒடுக்குவதும், உமது கைகளின் உழைப்பை வெறுத்துத் தள்ளுவதும், பொல்லாதவர்களின் திட்டத்தின்மேல் ஒளிவீசுவதும்[a] உமக்கு நல்லதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொல்லாதவர்களின் திட்டத்திற்கு ஆதரவு காட்டுவதும்.” எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “ஒளிவீசுதல்”; இங்கு அது சாதகமான பார்வை அல்லது ஆதரவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: உமக்கு நல்லதா?
  rationale: வினாவிடை הֲ உடன் வரும் טוֹב, எது நல்லது அல்லது தகுந்தது என்ற நேரடியான சொல்லாட்சியைக் கொண்ட கேள்வி. யோபின் கூர்மையான வினாவை விளக்கிச் சீராக்காமல் காக்கிறது.
- source_word: תַעֲשֹׁק
  choice: நீர் ஒடுக்குவதும்
  rationale: עָשַׁק அநியாயமாக ஒடுக்குதல் அல்லது சுரண்டுதலைக் குறிக்கிறது. இங்கு ‘ஒடுக்குதல்’ இயல்பான, வலிமையான இணைச்சொல்.
- source_word: תִמְאַס
  choice: வெறுத்துத் தள்ளுவதும்
  rationale: מָאַס என்பது வெறும் நிராகரிப்பை மட்டுமல்லாமல் இகழ்ச்சியுடன் புறக்கணிப்பதையும் உணர்த்துகிறது; ‘வெறுத்துத் தள்ளுதல்’ இரு கூறுகளையும் வெளிப்படுத்துகிறது.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: உமது கைகளின் உழைப்பு
  rationale: יְגִיעַ உழைப்பையோ அதன் விளைவையோ குறிக்கலாம். ‘கைகளின் உழைப்பு’ மூலமொழியின் உருவகத்தையும், கடவுள் படைத்ததைச் சுட்டும் பொருளையும் காக்கிறது.
- source_word: עֲצַת רְשָׁעִים
  choice: பொல்லாதவர்களின் திட்டம்
  rationale: עֵצָה ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருட்களை ஏற்கலாம். இச்சூழலில் ‘திட்டம்’ இயல்பான தமிழாக இருந்து, பொல்லாதவர்களின் செயல் நோக்கையும் தெரிவிக்கிறது.
- source_word: הוֹפָעְתָּ
  choice: ஒளிவீசுவதும்
  rationale: יָפַע என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் பிரகாசித்தல் அல்லது ஒளிவீசுதலைக் குறிக்கிறது. முதன்மை உரையில் உருவகத்தைத் தக்கவைத்து, சூழலுக்கேற்ற ‘ஆதரவு காட்டுதல்’ என்ற பொருளை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: கடவுளை நோக்கிய மனிதப் பண்புடைய நேரடி குற்றச்சாட்டு
  choice: யோபின் நேரடியான வினாவையும் ‘ஒடுக்குதல்,’ ‘வெறுத்துத் தள்ளுதல்’ என்ற கடுமையான வினைச்சொற்களையும் மென்மைப்படுத்தாமல் வைத்தல்
  alternative: ‘நீர் ஒடுக்குவதுபோல் தோன்றுவதும்’ அல்லது ‘நீர் அநியாயம் செய்வதும்’ என்று விளக்குதல்
  rationale: எபிரெய உரை யோபின் புலம்பலைக் கூர்மையான குற்றச்சாட்டாக முன்வைக்கிறது. வசனத்திலேயே இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
- issue: הוֹפָעְתָּ என்பதன் உருவகமும் உட்கருத்தும்
  choice: முதன்மை உரையில் ‘ஒளிவீசுதல்’ என்ற உருவகத்தை வைத்தல்
  alternative: ‘ஆதரவு காட்டுதல்’ என்று நேரடியாகப் பொருளுரைத்தல்
  rationale: மூலத்தின் ஒளி உருவகம் உண்மையானது; அதேவேளை இச்சூழலில் சாதகமான பார்வை அல்லது ஆதரவு என்ற பொருள் இருக்கலாம். உருவகத்தை உரையிலும் உட்கருத்தை அடிக்குறிப்பிலும் தருவது தெளிவையும் ambiguity-யையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், கடவுளை நோக்கிய மரியாதைப் பன்மையான ‘நீர்/உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. யோபின் கூர்மையான கேள்வி இயல்பாக ஒலிக்க ஒரே தொடராக அமைக்கப்பட்டு, மூலத்தின் மூன்று இணை வினைச்செயல்களும் பாதுகாக்கப்பட்டுள்ளன.
