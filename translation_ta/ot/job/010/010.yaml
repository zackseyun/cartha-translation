  yaml_path: translation/ot/job/010/010.yaml
  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: ta
  text: நீர் என்னைப் பாலைப்போல் ஊற்றி, பாலாடைக்கட்டியைப்போல் உறையச் செய்யவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயிர்த்திரளைப்போல் உறையச் செய்யவில்லையா?” எபிரெயப் பெயர்ச்சொல் குறிப்பாக “பாலாடைக்கட்டி” என்றும், பொதுவாக உறைந்த அல்லது திரண்ட பாற்பொருள் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: செய்யவில்லையா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய மறுப்புக் கேள்வியின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: כֶחָלָב
  choice: பாலைப்போல்
  rationale: כ என்ற ஒப்புமை முன்னொட்டையும் பால் சார்ந்த உருவகத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: תַּתִּיכֵנִי
  choice: என்னை ... ஊற்றி
  rationale: נתך என்பதன் ஹிஃபில் வடிவம் திரவத்தை ஊற்றுவதைக் குறிக்கிறது; இங்கு பால் உருவகத்துக்கு ஏற்ற இயல்பான தமிழ் இது.
- source_word: וְכַגְּבִנָּה
  choice: பாலாடைக்கட்டியைப்போல்
  rationale: גְּבִנָּה என்பதன் குறிப்பான பொருளாகிய ‘cheese’ என்பதைக் கூறுகிறது; தமிழ் வாசகருக்கு பால் உறைந்து உருவாகும் பொருள் தெளிவாகிறது.
- source_word: תַּקְפִּיאֵנִי
  choice: உறையச் செய்ய
  rationale: கெட்டியாக அல்லது திரளாக உறையச் செய்வது என்ற causative பொருளைக் காக்கிறது; தமிழில் ‘என்னைத் தயிராக்கு’ போன்ற செயற்கையான சொல்லாட்சியைத் தவிர்க்கிறது.
