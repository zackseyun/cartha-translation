  text: כִּֽי תְבַקֵּ֥שׁ לַ/עֲוֺנִ֑/י וּ֭/לְ/חַטָּאתִ֥/י תִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/006.yaml
  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: ta
  text: என் அக்கிரமத்தைத் தேடவும், என் பாவத்தை ஆராயவும் செய்கிறீரோ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், நீர் என் குற்றத்தைத் தேடுகிறீர்; என் பாவத்தை ஆராய்கிறீர்.”
    reason: כִּי என்பதன் காரணப் பொருளையும் עָוֹן என்பதன் ‘குற்றம்’ என்ற மாற்றுப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: כִּי
  choice: -வதற்காகவா?
  rationale: முந்தைய வசனத்தில் தொடங்கும் யோபின் வினாவைத் தொடர்ந்து, இங்கு நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் சார்புநிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது. காரணப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תְבַקֵּשׁ
  choice: தேடி
  rationale: பியேல் வடிவிலுள்ள בקש தீவிரமாகத் தேடுதல் அல்லது கண்டுபிடிக்க முயலுதல் என்ற விசாரணை நுணுக்கத்தைக் கொண்டுள்ளது; ‘தேடி’ என்பது இணை வினையோடு இயல்பாக அமைகிறது.
- source_word: לַעֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம் அல்லது குற்றத்திற்கான தண்டனை ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ஒழுக்கக் குறைபாட்டைத் தேடுவதாக யோபு முறையிடுவதால் ‘அக்கிரமம்’ பொருத்தமானது; இது யோபு உண்மையிலேயே குற்றவாளி என்று தீர்மானிப்பதில்லை.
- source_word: וּלְחַטָּאתִי
  choice: என் பாவத்தை
  rationale: חַטָּאת இங்கு עָוֹן என்பதற்கு இணையாக ஒழுக்கத் தவறைக் குறிக்கிறது. ‘பாவம்’ இரண்டு எபிரெயச் சொற்களின் வேறுபாட்டையும் இணைநிலையையும் காக்கிறது.
- source_word: תִדְרֹשׁ
  choice: ஆராய
  rationale: דרש என்பதன் தேடுதல், விசாரித்தல், நுணுக்கமாக ஆராய்தல் ஆகிய பொருள்களில், בקש உடனான இணைவாக்கியத்திற்கு ‘ஆராய’ இயல்பாகவும் விசாரணைத் தொனியுடனும் அமைகிறது.
theological_decisions:
- issue: עָוֹן மற்றும் חַטָּאת என்னும் இணைச் சொற்களை மொழிபெயர்த்தல்
  choice: ‘அக்கிரமம்’ மற்றும் ‘பாவம்’ என்று மொழிபெயர்த்து, யோபின் உண்மையான குற்றத்தை உறுதிப்படுத்தாமல் விடுதல்
  alternative: ‘குற்றம்’ மற்றும் ‘பாவம்’
  rationale: தேவன் தன்னிடம் குற்றம் கண்டுபிடிக்க முயல்வதாக யோபு உணரும் முறையீடே இங்கு பேசப்படுகிறது. வழக்கமான ஒழுக்கச் சொற்கள் அந்தக் கடுமையான முறையீட்டைக் காக்கின்றன; ஆனால் யோபு உண்மையில் குற்றவாளி என்ற இறையியல் முடிவை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையான தெய்வச் சுட்டாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் 5-ல் தொடங்கிய வினாவின் இலக்கணத் தொடர்ச்சியைப் பாதுகாக்க, வசனம் 6 சார்புநிலை வினாவாக அமைக்கப்பட்டுள்ளது; மொழிநடை எளிமையானதாயினும் கண்ணியமானது.
