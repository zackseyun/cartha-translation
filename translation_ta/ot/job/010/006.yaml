revisions:
- from: நீர் என் அக்கிரமத்தைத் தேடி, என் பாவத்தை ஆராய்வதற்காகவா?[a]
  to: என் அக்கிரமத்தைத் தேடவும், என் பாவத்தை ஆராயவும் செய்கிறீரோ?[a]
  rationale: The revision restores the Hebrew parallelism between ‘seek’ and ‘search’ and retains the verse’s dependence on the rhetorical question begun in the preceding verse. The footnote continues to represent the viable causal sense of כִּי and the lexical alternative ‘குற்றம்.’
  reviewer_model: gpt-5.6-terra
