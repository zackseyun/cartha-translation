  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: ta
  text: நான் பாவம் செய்தால்[a], நீர் என்னைக் கூர்ந்து கவனிப்பீர்[b]; என் அக்கிரமத்தைப் பொறுத்தவரை என்னைக் குற்றமற்றவன் என்று அறிவிக்கமாட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பாவம் செய்திருந்தால் ... என் அக்கிரமத்தைப் பொறுத்தவரை என்னைக் குற்றமற்றவன் என்று அறிவிக்கமாட்டீர்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே “கூர்ந்து கவனிப்பீர்” என்பது பாதுகாப்பாகக் காப்பதைக் குறிக்காமல், நெருக்கமான கண்காணிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: செய்தால்
  rationale: אִם அறிமுகப்படுத்தும் நிபந்தனைத் தன்மையைத் தமிழின் ‘-ஆல்’ வடிவம் இயல்பாகக் காக்கிறது; ‘செய்யும்போது’ என்று காலப் பொருளாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தால்
  rationale: Qal perfect 1cs வடிவத்தின் நிறைவுற்ற செயல் நிழலை ‘செய்தால்’ தக்கவைக்கிறது; சூழலில் இது ஒரு குறிப்பிட்ட கடந்த செயலைவிட நிபந்தனைப் புகாராக ஒலிக்கிறது.
- source_word: וּשְׁמַרְתָּנִי
  choice: நீர் என்னைக் கூர்ந்து கவனிப்பீர்
  rationale: שׁמר என்பதன் ‘காத்தல்/கவனித்தல்’ பொருள்களில், இங்கு பாதுகாப்பைக் காட்டிலும் குற்றம் தேடும் நெருக்கமான கண்காணிப்பே சூழலுக்குப் பொருந்துகிறது.
- source_word: וּמֵעֲוֺנִי
  choice: என் அக்கிரமத்திலிருந்து
  rationale: עָוֹן குற்றச்செயல், குற்றநிலை, அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ அதன் ஒழுக்கப் பரிமாணத்தைத் தக்கவைக்கிறது; מִן என்பதையும் ‘-இலிருந்து’ வெளிப்படுத்துகிறது.
- source_word: לֹא תְנַקֵּנִי
  choice: என்னைக் குற்றமற்றவனாக விடமாட்டீர்
  rationale: נקה என்பதன் Piel வடிவம் இங்கு நீதித்துறைச் சூழலில் குற்றமற்றவன் என விடுதல் அல்லது தண்டனையின்றி விடுதல் என்று பொருள்படுகிறது. இந்தத் தமிழ் வடிவம் சடங்குத் தூய்மைப்படுத்தல் என்ற பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: נקה என்பதன் நீதித்துறைப் பொருளா, தூய்மைப்படுத்தும் பொருளா
  choice: 'நீதித்துறைப் பொருள்: ‘குற்றமற்றவனாக விடமாட்டீர்’'
  alternative: ‘என்னைத் தூய்மைப்படுத்தமாட்டீர்’ அல்லது ‘என்னைத் தண்டனையின்றி விடமாட்டீர்’
  rationale: யோபுவின் புகார் குற்றத்தைக் கூர்ந்து கண்காணித்து விடுதலை அளிக்காத நீதிமன்றச் சாயலைக் கொண்டுள்ளது. ஆகவே சடங்குத் தூய்மையைவிட நீதித்துறைப் பொருள் முன்னிலைப்படுத்தப்படுகிறது; அதேவேளை ‘விடுதல்’ என்பது தண்டனையின்றி விடாமையையும் ஓரளவு திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபு கடவுளை மரியாதைப் பன்மையான ‘நீர்’ என்று நேரடியாக அழைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குற்றமற்றவனாக விடுதல்’ என்பது பொதுவாசகருக்குப் புரியக்கூடிய நீதித்துறைச் சொல்லாக்கமாகவும், மூலத்தின் பொருள் மடங்குகளை மிகையாகச் சுருக்காததாகவும் உள்ளது.
