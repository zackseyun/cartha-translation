  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: ta
  text: என் தலை உயர்ந்தால்[a], சிங்கம்போல் என்னை வேட்டையாடுகிறீர்; மீண்டும் எனக்கு எதிராக உம்மை வியப்பூட்டுகிறவராக வெளிப்படுத்துகிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் கடினமானதும் சுருக்கமானதுமாக உள்ளது. இதை, “அது உயர்ந்தால்” அல்லது “நான் உயர்த்தப்பட்டால்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்கு எதிராக வியப்பூட்டும் விதத்தில் செயல்படுகிறீர்.” இங்குள்ள எபிரெயச் சொல் அசாதாரணமான அல்லது வியப்பூட்டும் செயலைக் குறிக்கலாம்; இவ்வசனத்தில் அது யோபுக்கு எதிரான செயலின் சூழலில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: என் தலை உயர்ந்தால்
  rationale: גאה என்பது உயருதல் அல்லது உயர்த்தப்படுதல் என்பதைக் குறிக்கிறது. எபிரெய வடிவம் மூன்றாம் நபர் ஆண்பால் ஒருமையாகவும், வாக்கியம் விடுபட்ட கூறுடையதாகவும் உள்ளது; முந்தைய வசனத்தில் வரும் ‘என் தலை’ என்பதை மறைமுக எழுவாயாகக் கொண்டு இங்கு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כַּשַּׁחַל
  choice: சிங்கம்போல்
  rationale: שַׁחַל வலிமைமிக்க அல்லது கொடிய சிங்கத்தைக் குறிக்கலாம். ‘சிங்கம்’ உவமையைத் தெளிவாகக் காக்கிறது; தேவையற்ற வகையில் ‘சிங்கப்பெண்’ என்றோ ‘கொடிய சிங்கம்’ என்றோ குறிப்பாக்கவில்லை.
- source_word: תְּצוּדֵנִי
  choice: என்னை வேட்டையாடுகிறீர்
  rationale: צוד என்பது இரையை வேட்டையாடுதல் அல்லது பிடிக்கத் துரத்துதல். இத்தேர்வு சிங்க உவமையோடு இணைந்த இரைவேட்டைச் சித்திரத்தைப் பாதுகாக்கிறது.
- source_word: וְתָשֹׁב
  choice: மீண்டும்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’; இங்கு அது மறுபடியும் நிகழும் செயலைக் குறிக்கும் வினையடைப் பொருளில் இயங்குகிறது.
- source_word: תִּתְפַּלָּא
  choice: உம்மை வியப்புக்குரியவராகக் காட்டுகிறீர்
  rationale: פלא என்பதன் ஹித்பயேல் வடிவம் ஒருவர் தம்மை வியப்புக்குரியவராக வெளிப்படுத்துவதையோ அசாதாரணமாகச் செயல்படுவதையோ குறிக்கலாம். தமிழ் மொழிபெயர்ப்பு அதன் தற்சுட்டு நுணுக்கத்தையும், இங்குள்ள துன்புறுத்தும் சூழலில் அதன் அச்சமூட்டும் பதற்றத்தையும் காக்கிறது.
- source_word: בִי
  choice: எனக்கு எதிராக
  rationale: ב என்ற முன்னிடைச்சொல் பலவாறு மொழிபெயர்க்கப்படலாம்; யோபு தமக்கு நேரும் இறைச் செயல்களை முறையிடும் இச்சூழலில் ‘எனக்கு எதிராக’ என்பது அதன் பகைமைத் திசையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: துன்புறுத்தும் இறைச் செயலின் சூழலில் פלא என்பதைக் கூறுதல்
  choice: எனக்கு எதிராக உம்மை வியப்புக்குரியவராகக் காட்டுகிறீர்
  alternative: எனக்கு எதிராக வியப்புக்குரிய விதத்தில் செயல்படுகிறீர்
  rationale: யோபின் துன்பத்துக்கு எதிரான அல்லது அச்சமூட்டும் சூழலிலேயே கடவுளின் அசாதாரணமான செயல் கூறப்படுகிறது. அதனை நல்லதொரு ‘அற்புதச் செயல்’ என்று மாற்றாமலும், பொதுவான ‘வல்லமையுடன் தாக்குகிறீர்’ என்று விளக்கிப் பொருளைச் சுருக்காமலும் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமையான ‘உம்மை/காட்டுகிறீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வியப்புக்குரியவர்’ என்பது இங்கு பாராட்டுச் சொல்லாக மட்டும் ஒலிக்காமல் இருக்க ‘எனக்கு எதிராக’ என்ற சூழல்சார் கூறு தெளிவாக வைக்கப்பட்டுள்ளது.
