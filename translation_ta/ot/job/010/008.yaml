base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: ta
  text: உமது கைகள் என்னை வடிவமைத்து, என்னை உருவாக்கின[a]—முழுவதுமாக, எல்லாப் பக்கங்களிலும்[b]; ஆனாலும் நீர் என்னை விழுங்கிவிடுகிறீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னைப் புனைந்து உருவாக்கின’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படி, ‘ஒன்றாக, சுற்றிலும்’; கடவுள் யோபுவை முழுமையாக, எல்லாப் பக்கங்களிலும் உருவாக்கியதை இச்சொற்றொடர் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘ஆனாலும் நீர் என்னை அழித்துவிடுகிறீர்’; எபிரெயம் சொற்படி ‘விழுங்கிவிடுகிறீர்’ என்று கூறி, அழிவை உயிர்ப்புள்ள உருவகத்தால் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: உமது கைகள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல்லை நேரடியாகத் தக்கவைத்து, கடவுளின் தனிப்பட்ட படைப்புச் செயலையும் உருவக மொழியையும் வெளிப்படுத்துகிறது.
- source_word: עִצְּבוּנִי
  choice: என்னை வடிவமைத்து
  rationale: பியேல் வடிவில் இங்கு திட்டமிட்டுப் பொருளை வடிவமைக்கும் கைவினை நுணுக்கம் உள்ளது; ‘வடிவமைத்து’ என்பது அதைக் காலத்திற்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲשׂוּנִי
  choice: என்னை உருவாக்கின
  rationale: עשה என்பதன் பொதுவான ‘செய்/உருவாக்கு’ பொருளைத் தக்கவைத்து, முந்தைய வினையுடன் இணைந்து படைப்புச் செயலை வலியுறுத்துகிறது. ‘கைகள்’ பன்மை எழுவாயாக இருப்பதால் ‘உருவாக்கின’ பயன்படுத்தப்படுகிறது.
- source_word: יַחַד סָבִיב
  choice: முழுவதுமாக, எல்லாப் பக்கங்களிலும்
  rationale: இச்சொற்றொடரின் சற்றுக் கடினமான எபிரெய அமைப்பை அழிக்காமல், யோபுவை முழுமையாகவும் எல்லாப் புறங்களிலும் கடவுள் உருவாக்கினார் என்ற விரிவான பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַתְּבַלְּעֵנִי
  choice: ஆனாலும் நீர் என்னை விழுங்கிவிடுகிறீர்
  rationale: בלע என்பதன் உயிர்ப்புள்ள ‘விழுங்கு’ உருவகத்தைத் தக்கவைக்கிறது; சூழல் தரும் முரண்பாட்டை ‘ஆனாலும்’ வெளிப்படுத்துகிறது, ஆனால் அழித்தல் என்ற விளக்கத்துக்குள் உருவகத்தைச் சுருக்கவில்லை.
theological_decisions:
- issue: கடவுளின் படைப்புச் செயலை மனித உறுப்புகளால் சித்தரிக்கும் மொழி
  choice: ‘உமது கைகள்’ என்ற தெளிவான உருவகத்தையும் இணையான இரு படைப்பு வினைகளையும் தக்கவைத்தல்
  alternative: ‘நீர் என்னைப் படைத்தீர்’ என்று பொதுமைப்படுத்துதல்
  rationale: யோபு கடவுளின் நெருக்கமான, தனிப்பட்ட கைவினைப் படைப்பை முன்வைத்துப் புலம்புகிறார்; பொதுவான சொல்லாக்கம் வசனத்தின் உடல்சார்ந்த உருவகத்தையும் வாத வலிமையையும் இழக்கச் செய்யும்.
- issue: கடவுள் உருவாக்கியதற்கும் இப்போது அழிப்பதாக யோபு குற்றஞ்சாட்டுவதற்கும் இடையிலான பதற்றம்
  choice: ‘ஆனாலும் ... விழுங்கிவிடுகிறீர்’ என்று கூர்மையான முரண்பாட்டைத் தக்கவைத்தல்
  alternative: ‘இப்போது என்னை அழிக்கிறீர்’ அல்லது ‘அழிப்பதற்காகவே உருவாக்கினீர்’
  rationale: மூலவசனம் படைப்பையும் அழிவையும் விளக்கித் தீர்க்காமல் நேருக்கு நேர் நிறுத்துகிறது; மொழிபெயர்ப்பும் அந்த இறையியல் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘உமது/நீர்’ உயர்வுத் தோரணையைக் காக்கின்றன. படைப்பின் நெருக்கத்துக்கும் அழிவின் குற்றச்சாட்டுக்கும் இடையிலான திடீர் மாறுபாட்டை எம்-கோடும் அரைப்புள்ளியும் தெளிவாக்குகின்றன; எபிரெயச் சொற்றொடரின் உண்மையான சிக்கல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
