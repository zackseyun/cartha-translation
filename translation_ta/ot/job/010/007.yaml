base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: ta
  text: நான் பொல்லாதவன் அல்ல[a] என்பது உமக்குத் தெரிந்திருந்தும், உமது கையிலிருந்து[b] விடுவிப்பவர் எவரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் குற்றவாளி அல்ல.’ எபிரெய மொழியில் நேரடியாக ‘நான் பொல்லாதவன் அல்ல’ என்று உள்ளது. இது யோபு முற்றிலும் பாவமற்றவர் என்று கூறுவதைவிட, தாம் ஒரு பொல்லாத மனிதர் அல்ல என்று மறுப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது கையிலிருந்து’ என்பது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து என்பதைக் குறிக்கும் எபிரெய வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: உமக்குத் தெரிந்திருந்தும்
  rationale: இச்சூழலில் இந்த எபிரெயச் சொற்றொடர் கடவுள் அறிந்திருப்பதை வலியுறுத்துவதோடு விட்டுக்கொடுப்பு சார்ந்த எதிர்மறை உறவையும் காட்டுகிறது; ‘தெரிந்திருந்தும்’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: என்பது
  rationale: கடவுள் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக வருகிறது.
- source_word: לֹא אֶרְשָׁע
  choice: நான் பொல்லாதவன் அல்ல
  rationale: רשע என்ற ஒழுக்கநிலை சார்ந்த சொல்லை ‘குற்றமற்றவன்’ என்று குறுக்காமல், பொல்லாத மனிதன் அல்ல என்ற யோபுவின் மறுப்பாகப் பாதுகாக்கிறது.
- source_word: וְאֵין
  choice: எவரும் இல்லை
  rationale: முற்றான இல்லாமையைக் குறிக்கும் எபிரெய இருப்பின்மை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מִיָּדְךָ
  choice: உமது கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் மூலமொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מַצִּיל
  choice: விடுவிப்பவர்
  rationale: நצל என்பதன் ஹிஃபில் வினையெச்ச வடிவம் மீட்பவர் அல்லது விடுவிப்பவர் என்பதைக் குறிக்கிறது; இங்கு தப்புவிக்க வல்ல ஒருவர் இல்லையென்ற கருத்தைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: கடவுளுக்கு முன் யோபு கூறும் குற்றமின்மை
  choice: ‘நான் பொல்லாதவன் அல்ல’ என்று மொழிபெயர்த்து, தன்னை ஒரு பொல்லாத மனிதன் என யோபு மறுப்பதை வெளிப்படுத்துதல்
  alternative: ‘நான் முற்றிலும் பாவமற்றவன்’ அல்லது ‘நான் குற்றமற்றவன்’
  rationale: மூலத்தில் ‘பொல்லாதவன்’ என்ற பொருளுடைய רשע பயன்படுத்தப்பட்டுள்ளது. ஆகவே யோபு முழுமையான பாவமின்மையை உரிமைகோருவதாக உரையைத் தீர்மானிக்காமல், அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை மரியாதை ஒருமையில் ‘உமது’ எனக் குறிப்பிட்டு, மூலத்தின் நேரடி முறையீட்டையும் ‘கை’ என்ற உருவகத்தையும் காத்துள்ளோம். வாக்கியம் பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் அமைந்துள்ளது.
