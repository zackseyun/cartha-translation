  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: ta
  text: உமக்கு மாம்சக் கண்கள் இருக்கின்றனவா, அல்லது ஒரு மனிதன்[a] பார்ப்பதுபோல் நீர் பார்க்கிறீரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு மனிதன்’ என்பதற்கான எபிரெயச் சொல் பொதுவாக மனிதரைக் குறிக்கும் ஒருமைச் சொல்; அதில் மரணத்தன்மை அல்லது பலவீனம் என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עֵינֵי בָשָׂר לָךְ
  choice: உமக்கு மாம்சக் கண்கள் இருக்கின்றனவா
  rationale: வினாவிடை உருபையும், ‘உமக்கு’ என்ற உடைமைப் பொருளையும், ‘மாம்சக் கண்கள்’ என்ற உருவகத்தின் நேரடியான வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இங்கு நிபந்தனையை அல்ல, சொல்லாட்சிசார் வினாவின் இரண்டாவது மாற்றை அறிமுகப்படுத்துகிறது.
- source_word: כִּ/רְאוֹת אֱנוֹשׁ תִּרְאֶה
  choice: ஒரு மனிதன் பார்ப்பதுபோல் நீர் பார்க்கிறீரா
  rationale: ‘பார்த்தல்’ என்ற வேர்ச்சொல்லின் கருத்தைத் தக்கவைத்து, ஒப்பீட்டைக் காலத்திற்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: ஒரு மனிதன்
  rationale: பொதுவான ஒருமை மனிதரைக் குறிக்கிறது; இச்சொல்லில் இருக்கக்கூடிய மரணத்தன்மை அல்லது பலவீனத்தின் நிழற்பொருளை முதன்மை உரையில் மிகைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: தேவனுடைய பார்வையை மனித உருவகத்தில் கூறுதல்
  choice: ‘மாம்சக் கண்கள்’ மற்றும் மனிதன் பார்ப்பதுபோன்ற பார்வை என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘மனிதர்களைப்போல் வெளித்தோற்றத்தை வைத்து நீர் தீர்ப்பளிக்கிறீரா?’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை தேவனுடைய பார்வைக்கும் உடலுக்குட்பட்ட மனிதப் பார்வைக்கும் இடையிலான முரண்பாட்டைத் தெளிவான உருவகத்தின் வழியாக முன்வைக்கிறது; அதை விளக்கவுரையாக மாற்றுவது மூலத்தில் இல்லாத தீர்ப்புக் கருத்தைச் சேர்க்கும்.
- issue: אֱנוֹשׁ என்ற பொதுவான ஒருமைச் சொல்
  choice: ஒரு மனிதன்
  alternative: மானிடர்; மரணத்துக்குரியவன்
  rationale: ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது; ‘மரணத்துக்குரியவன்’ என்பது இச்சூழலில் நிழற்பொருளை முதன்மைப் பொருளாக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான நேரடி உரை. யோபு தேவனை நோக்கிப் பேசுவதால் ‘உமக்கு/நீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சக் கண்கள்’ என்ற மூல உருவகம் மென்மைப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
