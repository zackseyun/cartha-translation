source:
  edition: WLC
  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: ta
  text: எனக்கு எதிராக உமது சாட்சிகளைப் புதிதாக எழுப்புகிறீர்[a]; என்மீது உமது கோபத்தைப் பெருகச் செய்கிறீர்; மாறுதல்களும் கடும் பணியும் என்னோடு இருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது சான்றுகளை”; எபிரெயச் சொல் யோபுக்கு எதிராக நிறுத்தப்படும் சாட்சிகளையோ முன்வைக்கப்படும் சான்றுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மாறுதல்களும் படையும் என்னோடு இருக்கின்றன” அல்லது “மாறுதல்களும் போரும் என்னோடு இருக்கின்றன.” எபிரெயத் தொடர் அடுத்தடுத்து வரும் தாக்குதல்களின் இராணுவப் படிமத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: புதிதாக எழுப்புகிறீர்
  rationale: חדש என்பதன் பியேல் வடிவம் புதுப்பித்தல் அல்லது புதிதாகக் கொண்டுவருதல் என்னும் பொருளைத் தருகிறது. சாட்சிகளைத் தொடர்ந்து புதிதாக முன்வைக்கும் நீதிமன்றச் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵדֶיךָ
  choice: உமது சாட்சிகள்
  rationale: עֵד என்பதன் பன்மை பொதுவாகச் சாட்சிகள் எனப் பொருள்படும்; נֶגְדִּי என்பதுடன் சேரும்போது யோபுக்கு எதிரான சட்டவியல் உருவகம் தெளிவாகிறது. ‘சான்றுகள்’ என்ற பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: נֶגְדִּי
  choice: எனக்கு எதிராக
  rationale: அடிப்படையில் ‘என் முன்னே’ என்றாலும், இங்குள்ள எதிர்நிலை மற்றும் நீதிமன்றச் சூழலில் ‘எனக்கு எதிராக’ என்பதே இயல்பான பொருள்.
- source_word: וְתֶרֶב
  choice: பெருகச் செய்கிறீர்
  rationale: רבה என்பதன் இந்த வடிவம் அதிகரிக்கச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது; தேவனை நோக்கிய நேரடி உரையையும் காக்கிறது.
- source_word: כַּעַשְׂךָ
  choice: உமது கோபம்
  rationale: כעס என்பது கோபம், சினம் அல்லது மனக்கசப்பு எனப் பொருள்படலாம். தேவனை நேரடியாக விளிக்கும் இச்சூழலில் ‘உமது கோபம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עִמָּדִי
  choice: என்மீது
  rationale: எபிரெயத்தில் சொற்படி ‘என்னோடு’ என்றாலும், கோபத்துடன் தமிழில் ‘என்மீது’ என்பது உறவின் எதிர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲלִיפוֹת
  choice: மாறிமாறி
  rationale: இந்தப் பெயர்ச்சொல் மாற்றங்கள், முறைமாற்றங்கள் அல்லது அடுத்தடுத்து வரும் அணிகள் என்பதைக் குறிக்கலாம். צבא உடன் இணைவதால் தொடர்ச்சியாக மாறிவரும் தாக்குதல் அணிகள் என்ற படிமம் வலுப்பெறுகிறது.
- source_word: וְצָבָא
  choice: படையணிகள்
  rationale: צבא என்பது படை, படைத்திரள், போர் அல்லது கட்டாயப் பணி என்பவற்றைக் குறிக்கலாம். חֲלִיפוֹת உடன் வரும் இச்சூழலில் இராணுவப் படிமம் வலுவாக இருப்பதால் ‘படையணிகள்’ தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עִמִּי
  choice: எனக்கு எதிராக வருகின்றன
  rationale: சொற்படி ‘என்னோடு’ என்ற சுருக்கமான எபிரெயச் சொற்றொடர், பகைமைச் சூழலில் தமிழில் தெளிவாகப் புரியும்படி ‘எனக்கு எதிராக வருகின்றன’ என வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: யோபுக்கு நேரும் துன்பங்களைத் தேவனுடைய சாட்சிகளாகவும் படையெடுப்பாகவும் கூறும் உருவகம்
  choice: யோபின் குற்றச்சாட்டு நிறைந்த நேரடி மொழியை அப்படியே காத்தல்
  alternative: தேவன் உண்மையில் பொய்ச் சாட்சிகளை ஏற்படுத்துகிறார் என்ற கருத்தைத் தவிர்க்க வசனத்தை மென்மையாக்குதல்
  rationale: இது யோபின் புலம்பலின் குரல். அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அமைதியாகத் தீர்க்கவோ மென்மையாக்கவோ கூடாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் நேரடி புலம்பல் காக்கப்பட்டுள்ளது. ‘உமது/உமக்கு’ நடை தேவனை நோக்கிய ஒருமை மரியாதையையும் கவிதைநடையையும் தக்கவைக்கிறது. இறுதி எபிரெயத் தொடரின் செறிவும் பலபொருள்தன்மையும் முதன்மை உரை மற்றும் அடிக்குறிப்பு இணைந்து வெளிப்படுத்துகின்றன.
