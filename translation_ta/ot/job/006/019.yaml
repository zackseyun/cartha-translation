  text: הִ֭בִּיטוּ אָרְח֣וֹת תֵּמָ֑א הֲלִיכֹ֥ת שְׁ֝בָ֗א קִוּוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/019.yaml
  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: ta
  text: தேமாவின் பயணக் குழுக்கள்[a] அவற்றை நோக்கின; சேபாவின் பயணிகள் அவற்றுக்காக நம்பிக்கையுடன் காத்திருந்தனர்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயணக் குழுக்கள்’ என்பதற்கான எபிரெயச் சொல் சொல்லடியாக ‘பாதைகள்’ அல்லது ‘வழிகள்’ எனவும் பொருள்படும்; இங்கு அந்த வழிகளில் பயணம் செய்யும் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நம்பிக்கையுடன் காத்திருந்தனர்’ என்பதற்கான எபிரெய வினை, நம்புவதையோ எதிர்பார்த்துக் காத்திருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவற்றுக்காக’ என்பது முந்தைய வரிகளில் கூறப்பட்ட பருவகால நீரோடைகளைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: நோக்கிப் பார்த்தன
  rationale: נבט வினை நோக்குதல் அல்லது உற்றுப் பார்த்தலைக் குறிக்கிறது. தண்ணீரை எதிர்பார்க்கும் பயணக் குழுக்களின் சூழலில், இயல்பான தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָרְחוֹת
  choice: வணிகக் குழுக்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘பாதைகள்/வழிகள்’ என்றாலும், இங்கு சேபாவின் பயணிகளுடன் உள்ள இணைவாக்கியமும் பாலைவன வணிகப் பயணச் சூழலும் அந்த வழிகளில் செல்லும் குழுக்களைக் குறிக்கும் ஆகுபெயர்ப் பயன்பாட்டை ஆதரிக்கின்றன.
- source_word: תֵּמָא
  choice: தேமா
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: הֲלִיכֹת
  choice: பயணிகள்
  rationale: சொல்லடியாக ‘செல்பவை/பயணங்கள்’ என்பதுடன் தொடர்புடையது; இங்கு பயணம் மேற்கொள்பவர்களைக் குறிக்கிறது. முதல் அடியுடன் உள்ள கவிதை இணைப்பை இயல்பாகப் பேணுகிறது.
- source_word: שְׁבָא
  choice: சேபா
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: קִוּוּ
  choice: நம்பிக்கையோடு காத்திருந்தனர்
  rationale: קוה என்பது நம்புவதையும் எதிர்பார்த்துக் காத்திருப்பதையும் குறிக்கலாம். இரு பொருள் நிழல்களையும் ஒரே இயல்பான தமிழ்ச் சொற்றொடரில் வைத்துப் பாலைவனப் பயணிகளின் ஆவலான எதிர்பார்ப்பை வெளிப்படுத்துகிறது.
- source_word: לָמוֹ
  choice: அவற்றுக்காக
  rationale: இந்தப் பன்மைப் பதிலிப்பெயர் முந்தைய வசனங்களில் கூறப்பட்ட பருவகால நீரோடைகளைக் குறிப்பதாகத் தெரிகிறது. மூலத்தின் பதிலிப்பெயரைக் காக்கும் வகையில் ‘அவற்றுக்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
