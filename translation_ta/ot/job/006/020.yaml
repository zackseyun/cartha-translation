  text: בֹּ֥שׁוּ כִּֽי בָטָ֑ח בָּ֥אוּ עָ֝דֶ֗י/הָ וַ/יֶּחְפָּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: ta
  text: அவர்கள் நம்பிக்கை வைத்ததால் வெட்கமடைந்தார்கள்; அங்கே வந்து[a] அவமானமடைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘அதை அடைந்து/அதனிடம் வந்து’; இது முந்தைய வசனங்களில் கூறப்பட்ட பருவகால ஓடையைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: ‘திகைத்துப்போனார்கள்,’ ‘வெட்கத்தால் முகம் குனிந்தார்கள்,’ அல்லது சூழலுக்கு ஏற்ப ‘ஏமாற்றமடைந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வெட்கம் அல்லது இழிவு சார்ந்த இரண்டு தொடர்புடைய வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: வெட்கமடைந்தார்கள்
  rationale: בוש என்பதன் Qal நிறைவுவினை இங்கு வெட்கம் அல்லது நம்பிக்கை பொய்த்ததால் ஏற்பட்ட இழிவு என்ற விளைவுநிலையைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் அடிப்படை உணர்வை இது காக்கிறது.
- source_word: כִּי
  choice: நம்பிக்கை வைத்ததால்
  rationale: כִּי இங்கு அவர்கள் வெட்கமடைந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரண விகுதி இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: בָטָח
  choice: நம்பிக்கை வைத்தார்கள்
  rationale: வடிவம் இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், சுற்றியுள்ள பன்மை வினைகளும் முந்தைய வசனத்தின் பயணக் கூட்டங்களும் கூட்டுப்பொருளைக் காட்டுகின்றன; ஆகவே தமிழில் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: בָּאוּ
  choice: அடைந்தபோது
  rationale: בוא என்பதன் வருதல்/சென்றடைதல் பொருளை இலக்கை நாடிவந்த பயணிகளின் சூழலில் ‘அடைந்தபோது’ இயல்பாகத் தருகிறது.
- source_word: עָדֶיהָ
  choice: அந்த ஓடையை
  rationale: மூன்றாம் நபர் பெண்பால் பின்னொட்டு முந்தைய சூழலிலுள்ள பருவகால ஓடையைச் சுட்டுகிறது. தமிழில் மறைமுகமான ‘அதை’ என்பதற்குப் பதில் குறிப்பு தெளிவாக இருக்க ‘அந்த ஓடையை’ என வழங்கப்படுகிறது; இதற்குக் குறிப்பு இணைக்கப்பட்டுள்ளது.
- source_word: וַיֶּחְפָּרוּ
  choice: அவமானத்துக்குள்ளானார்கள்
  rationale: חפר இச்சூழலில் வெட்கிப்போதல், நிலைகுலைதல் அல்லது இழிவடைதல் என்னும் பொருளுடையது. முதல் בוש உடனான தொடர்பைக் காத்தபடியே, அதே சொல்லை மீண்டும் பயன்படுத்தாமல் அதன் இழிவு/திகைப்பு நிழற்பொருளை இது வெளிப்படுத்துகிறது.
