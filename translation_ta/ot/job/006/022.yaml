language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: ta
  text: நான் எப்போதாவது, “எனக்குக் கொடுங்கள்” என்றோ, “உங்கள் வளங்களிலிருந்து[a] எனக்காகக் கையூட்டு கொடுங்கள்[b]” என்றோ சொன்னேனா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லின் நேரடிப் பொருள் “வலிமை.” இங்கே அது ஒருவரின் வசதி, செல்வம் அல்லது பொருளாதார வளங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கையூட்டு கொடுங்கள்” என மொழிபெயர்க்கப்பட்ட வினைச்சொல், “கையூட்டு/பரிசு” என்பதற்கான பெயர்ச்சொல்லோடு தொடர்புடையது. சிலர் இதை யோபுக்காக ஒரு தொகையையோ தூண்டுதலளிக்கும் பரிசையோ கொடுப்பதாகப் பொதுவாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: நான் எப்போதாவது ... சொன்னேனா?
  rationale: הֲכִי அறிமுகப்படுத்தும் வலியுறுத்தப்பட்ட எதிர்மறை விடையை எதிர்பார்க்கும் வினாவை, சூழலுக்கேற்ற இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; אָמַרְתִּי என்பதன் பொதுவான ‘சொல்’ பொருளையும் காக்கிறது.
- source_word: הָבוּ לִי
  choice: எனக்குக் கொடுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் ‘எனக்கு’ என்ற மறைமுகச் செயப்படுபொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּמִכֹּחֲכֶם
  choice: உங்கள் வளங்களிலிருந்து
  rationale: כֹּחַ என்பதன் அடிப்படைப் பொருள் ‘வலிமை’; ஆனால் பணம் அல்லது பரிசு கொடுக்கும் இச்சூழலில் அது ஒருவருடைய வசதி, பொருளாதார ஆதாரம் அல்லது செல்வத்தைக் குறிக்கக்கூடும். ‘வளங்கள்’ இந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது; அடிப்படைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שִׁחֲדוּ
  choice: கையூட்டு கொடுங்கள்
  rationale: שׁחד என்ற வினைச்சொல் கையூட்டு/பரிசு என்பதற்கான பெயர்ச்சொல்லோடு தொடர்புடையது. ‘கையூட்டு கொடுங்கள்’ அதன் பரிவர்த்தனை மற்றும் ஒழுக்கரீதியான பதற்றத்தை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: בַעֲדִי
  choice: எனக்காக
  rationale: ‘என் சார்பாக, எனக்காக’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: யோபு நண்பர்களிடம் கேட்டதாக மறுக்கும் உதவியின் தன்மை
  choice: ‘கையூட்டு’ என்ற குறிப்பான சொல்லைத் தக்கவைத்தல்
  alternative: ‘பணம்’ அல்லது ‘பரிசு’ என்று பொதுமைப்படுத்தல்
  rationale: எபிரெய வினைச்சொல்லின் கையூட்டு சார்ந்த வலிமையைப் பாதுகாக்கிறது; யாருக்கு அல்லது எந்த நோக்கத்திற்காக அது கொடுக்கப்பட வேண்டும் என்பதை மூலவசனம் விளக்காததால் மொழிபெயர்ப்பும் அதைக் கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான மேற்கோள்களுடன் அமைந்த கண்ணியமான பேச்சுநடை. எதிர்மறை விடையை எதிர்பார்க்கும் யோபுவின் வினாவை ‘எப்போதாவது ... சொன்னேனா?’ என்ற இயல்பான வடிவில் தருகிறது. மூலத்தின் பொருளாதார உருவகத்தையும் ‘கையூட்டு’ என்ற கூர்மையான சொல்லையும் பாதுகாக்கிறது.
