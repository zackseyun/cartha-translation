language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ל֗וּ שָׁק֣וֹל יִשָּׁקֵ֣ל כַּעְשִׂ֑/י ו/הית/י בְּֽ/מֹאזְנַ֥יִם יִשְׂאוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: ta
  text: ஆ, என் மனக்குமுறல்[a] முழுமையாக நிறுக்கப்பட்டு, என் பேரிடரும் அதனுடன் தராசில் ஏற்றப்பட்டால்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் துயரம்,” “என் எரிச்சல்,” அல்லது “என் கோபம்.” எபிரெயச் சொல் உள்ளார்ந்த வேதனை, மன எரிச்சல் அல்லது கோபத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: ஆ, … என்றால்!
  rationale: நிறைவேறாத ஏக்கத்தையும் புலம்பலின் உணர்ச்சி வேகத்தையும் வெளிப்படுத்தும் விருப்பத் தொடர்; தமிழில் இயல்பான நிறைவேறா விருப்ப வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: முழுமையாக நிறுக்கப்பட்டு
  rationale: வினையெச்சப் பெயரும் வினையும் இணைந்து தரும் வலியுறுத்தலை ‘முழுமையாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: כַּעְשִׂי
  choice: என் மனக்குமுறல்
  rationale: இச்சொல் உள்ளார்ந்த வேதனை, எரிச்சல் அல்லது கோபம் எனப் பல நிழற்பொருள்களைக் கொண்டது. யோபுவின் புலம்பல் சூழலில் ‘மனக்குமுறல்’ அந்த அக வேதனையை இயல்பாகக் காட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וְהַוָּתִי
  choice: என் பேரிடர்
  rationale: வெளிப்புற அழிவு, விபத்து அல்லது பேராபத்தைக் குறிக்கும் சொல்லாக இருப்பதால், யோபுவுக்கு நேர்ந்த துன்பத்தின் நிகழ்வுசார் பரிமாணத்தை ‘பேரிடர்’ காக்கிறது.
- source_word: בְּמֹאזְנַיִם
  choice: தராசில்
  rationale: எடையை ஒப்பிட்டு நிறுக்கும் கருவியை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יִשְׂאוּ יָחַד
  choice: அதனுடன் … ஏற்றப்பட்டால்
  rationale: சொற்பொருளில் ‘ஒன்றாகத் தூக்கப்படுதல்/சுமக்கப்படுதல்’ என்ற கருத்து உள்ளது. தராசுச் சூழலில் ‘ஏற்றப்படுதல்’ இயல்பானது; ‘அதனுடன்’ என்பது மனக்குமுறலும் பேரிடரும் சேர்த்து நிறுக்கப்படுவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: כַּעְשִׂי என்பதன் உணர்ச்சிப் பொருள்
  choice: மனக்குமுறல்
  alternative: துயரம்; எரிச்சல்; கோபம்
  rationale: யோபுவின் சொல்லை வெறும் கோபமாகவோ வெறும் துயரமாகவோ சுருக்காமல், சொல்லிலுள்ள உள்ளார்ந்த வேதனை மற்றும் கலக்கத்தின் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் நிறைவேறா விருப்பத் தொனியும், இரு துன்பங்களையும் தராசில் சேர்த்து நிறுக்கும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
