  edition: WLC
  text: אַף עַל יָת֥וֹם תַּפִּ֑ילוּ וְ֝/תִכְר֗וּ עַל רֵֽיעֲ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/027.yaml
  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: ta
  text: தந்தையற்றவன்மீதேகூடச் சீட்டுப் போடுவீர்கள்[a]; உங்கள் நண்பனைப் பற்றி பேரம் பேசுவீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தந்தையற்றவனுக்காகக்கூடச் சீட்டுப் போடுவீர்கள்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “தந்தையற்றவன்மீது விழச் செய்வீர்கள்” என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் நண்பனுக்குக் குழி தோண்டுவீர்கள்.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் உறுதியாக இல்லை; பலர் இதை நண்பனைப் பற்றி பேரம் பேசுவது அல்லது அவனைச் சுரண்டுவது எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: கூட
  rationale: குற்றச்சாட்டின் அதிர்ச்சியூட்டும் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவன்
  rationale: எபிரெயச் சொல் குறிப்பிடும் தந்தையற்ற, சமூகப் பாதுகாப்பற்ற நபரைத் துல்லியமாகக் குறிக்கிறது; ‘அனாதை’ என்பதைக் காட்டிலும் மூலத்தின் குறிப்பிட்ட பொருளைப் பேணுகிறது.
- source_word: תַּפִּילוּ
  choice: சீட்டுப் போடுவீர்கள்
  rationale: נפל என்பதன் ஹிஃபில் வடிவம் עַל உடன் வரும் இச்சூழலில், ஒருவர்மீது சீட்டு விழச் செய்வது, அதாவது அவரைக் குறித்து சீட்டுப் போடுவது என்ற மரபுத்தொடர் பொருளைத் தருகிறது.
- source_word: תִכְרוּ
  choice: பேரம் பேசுவீர்கள்
  rationale: இவ்விடத்தில் வினைச்சொல்லின் பொருள் கடினமானது. இணைவரியின் சுரண்டல் கருத்துக்கு ஏற்றவாறு, நண்பனை ஆதாயப் பொருள்போல் வைத்து விலைபேசுதல் என்ற சாத்தியமான பொருள் முதன்மை உரையில் தரப்படுகிறது.
- source_word: רֵיעֲכֶם
  choice: உங்கள் நண்பன்
  rationale: யோபு தன் தோழர்களை நேரடியாகக் கண்டிக்கும் சூழலில் ‘நண்பன்’ என்பது உறவின் துரோகத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל ... עַל
  choice: மீது ... வைத்து
  rationale: முதல் தொடரில் எபிரெய முன்னிடைச்சொல்லின் படிமத்தைப் பேணியும், இரண்டாவது தொடரில் ஒருவரைப் பேரத்தின் பொருளாக்குவதை இயல்பான தமிழில் தெரிவித்தும் உள்ளது.
