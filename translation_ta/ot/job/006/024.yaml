source:
  edition: WLC
  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: ta
  text: எனக்குக் கற்பியுங்கள்; நான் மௌனமாக இருப்பேன். நான் எதில் தவறினேன் என்பதை எனக்குப் புரியச் செய்யுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: எனக்குப் போதியுங்கள்
  rationale: ירה என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘போதியுங்கள்/கற்பியுங்கள்’ என்று பொருள்படும். யோபு தன் நண்பர்களிடம் திருத்தத்தை முன்வைக்குமாறு கேட்பதற்கு ‘போதியுங்கள்’ இயல்பான, கண்ணியமான சொல்.
- source_word: וַאֲנִי
  choice: நான்
  rationale: எபிரெய இணைப்புச்சொல்லைத் தமிழில் தனியாக மொழிபெயர்க்காமல், அரைப்புள்ளியால் வாக்கியத் தொடர்பு காட்டப்பட்டுள்ளது; வெளிப்படையான தன்மைப் பெயர் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: אַחֲרִישׁ
  choice: மௌனமாயிருப்பேன்
  rationale: חרשׁ இங்கு பேசாமல் இருப்பதைக் குறிக்கிறது. ‘மௌனமாயிருப்பேன்’ என்பது வசனத்தின் தீவிரமான தொனியைப் பேணுகிறது.
- source_word: וּמַה שָּׁגִיתִי
  choice: நான் எதில் தவறினேன் என்பதை
  rationale: מַה என்பதன் ‘எது/எதில்’ என்ற கூறைத் தக்கவைத்து, שׁגה என்பதைக் ‘தவறினேன்’ என வழங்குகிறது. இது யோபு செய்ததாகக் கூறப்படும் தவற்றைத் தெளிவாகச் சுட்டிக்காட்டுமாறு கோரும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָבִינוּ לִי
  choice: எனக்குப் புரியவையுங்கள்
  rationale: בין என்பதன் ஹிஃபில் கட்டளை வடிவிலுள்ள காரணவினைப் பொருளை ‘புரியவையுங்கள்’ நேரடியாகப் பேணுகிறது; לִי ‘எனக்கு’ என வெளிப்படுகிறது.
theological_decisions:
- issue: யோபு தவறு செய்ததாக ஒப்புக்கொள்கிறாரா என்பது
  choice: ‘நான் எதில் தவறினேன்’ என்ற நிபந்தனைத் திறந்த கேள்வியாக வைக்கப்பட்டது.
  alternative: ‘நான் எவ்வாறு வழிதவறினேன்’ என்று மொழிபெயர்த்து தவறு நிகழ்ந்ததாக அதிகமாக முன்கூட்டியே உணர்த்துதல்.
  rationale: மூலவாக்கியம் நண்பர்கள் தன் தவற்றைக் காட்டுமாறு யோபு விடுக்கும் சவாலாகவும் வேண்டுகோளாகவும் வாசிக்கப்படலாம்; ஆகவே அவர் குற்றத்தை முழுமையாக ஒப்புக்கொண்டதாக மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான பன்மை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு இணையான வேண்டுகோள்களும் சுருக்கமாகவும் நேரடியாகவும் பேணப்பட்டுள்ளன.
