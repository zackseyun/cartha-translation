translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய விருப்பவியல் மரபுத்தொடரின் தீவிர ஏக்கம் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; ‘நம்பிக்கை’ என்பதன் நம்பிக்கை/எதிர்பார்ப்பு/ஏக்கம் என்ற பொருள் விரிவு குறுக்கப்படவில்லை.
