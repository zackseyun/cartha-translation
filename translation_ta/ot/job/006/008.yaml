source:
  edition: WLC
  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: ta
  text: ஆ[a], என் வேண்டுதல் நிறைவேறினால் நன்றாயிருக்கும்; கடவுள் என் நம்பிக்கையை நிறைவேற்றினால் நன்றாயிருக்கும்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வேண்டுதல் வருமானால் நன்றாயிருக்கும்; கடவுள் என் நம்பிக்கையை அளித்தால் நன்றாயிருக்கும்!” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “யார் கொடுப்பார்?” என வரும்; இங்கு அது தீவிரமான விருப்பத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: ஆ, ... அருளினால்!
  rationale: இது சொல்லுக்குச் சொல் கேள்வியாக அல்லாமல், தீவிரமான விருப்பத்தை வெளிப்படுத்தும் எபிரெய விருப்பவியல் மரபுத்தொடர். தமிழில் ‘ஆ, ... அருளினால்!’ என்பது யோபுவின் ஏக்கமும் புலம்பல் தொனியும் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: תָּבוֹא
  choice: நிறைவேறி
  rationale: அடிப்படைப் பொருள் ‘வருதல்’ என்றாலும், வேண்டுதல் ‘வருவது’ என்பது அது நிறைவேறுவதைக் குறிக்கிறது. ‘நிறைவேறி’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שֶׁאֱלָתִי
  choice: என் வேண்டுதல்
  rationale: இந்தப் பெயர்ச்சொல் வேண்டுகோள் அல்லது விண்ணப்பத்தைக் குறிக்கிறது. ‘வேண்டுதல்’ யோபுவின் மனமார்ந்த கோரிக்கையைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: וְתִקְוָתִי
  choice: என் நம்பிக்கையை
  rationale: תִּקְוָה என்பது ‘நம்பிக்கை,’ ‘எதிர்பார்ப்பு’ அல்லது சூழலின்படி ‘ஏக்கம்’ எனப் பொருள்படலாம். இங்கு ‘நம்பிக்கை’ மூலத்தின் பொதுவான பொருளையும் சூழலின் தீவிர விருப்பத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: יִתֵּן
  choice: அருளினால்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடுத்தல்.’ கடவுள் ஒருவரின் நம்பிக்கையை நிறைவேற்றித் தருவதைத் தமிழில் ‘அருளுதல்’ இயல்பாகக் குறிக்கிறது; இது மூலத்தில் இல்லாத ‘சர்வவல்லவர்’ போன்ற தனிச்சிறப்புப் பட்டத்தைச் சேர்ப்பதில்லை.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: இது யோபு நூலில் அடிக்கடி வரும் ‘கடவுள்’ என்பதற்கான ஒருமைச் சொல். இந்தச் சொல்லில் மட்டும் ‘சர்வவல்லவர்’ என்ற பொருளுக்கு ஆதாரம் இல்லாததால் ‘கடவுள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
