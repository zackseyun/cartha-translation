  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் முக்கிய கூறுகளைச் சரியாகக் கொண்டுள்ளது: யோபுவுக்கு எஞ்சும் ஆறுதல், விட்டுவைக்கப்படாத வேதனையிலும் அவரது தீவிரமான மகிழ்ச்சி, பரிசுத்தரின் வார்த்தைகளை அவர் மறுக்காதிருத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆயினும் நடுப்பகுதியின் மாற்றுவாசிப்பும் இறுதிச் சொல்லின் மாற்றுப்பொருளும் ஒரே அடிக்குறிப்பில் சேர்க்கப்பட்டு, அடையாளம் ‘ஆறுதல்’ என்பதோடு இணைக்கப்பட்டிருப்பது துல்லியமான அடிக்குறிப்பு-நங்கூரத்தை வழங்கவில்லை.'
  naturalness: ‘இரக்கமின்றித் தொடரும் வேதனையிலும் நான் களிகூருவேன்’ நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘பரிசுத்தருடைய வார்த்தைகள்’ என்பது ‘பரிசுத்தரின் வார்த்தைகள்’ என்பதைக் காட்டிலும் தெய்வீகப் பட்டப்பெயருடனான உடைமைத் தொடர்பைச் சற்று இயல்பாக வெளிப்படுத்துகிறது.
