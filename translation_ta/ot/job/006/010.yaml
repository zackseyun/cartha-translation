- from: இதுவே இன்னும் எனக்கு ஆறுதலாக இருக்கும்[a]; இரக்கமின்றித் தொடரும் வேதனையிலும் நான் களிகூருவேன். ஏனெனில் பரிசுத்தரின் வார்த்தைகளை நான் மறுதலிக்கவில்லை.
  to: இது இன்னும் எனக்கு ஆறுதலாக இருக்கும்; இரக்கமின்றித் தொடரும் வேதனையிலும் நான் களிகூருவேன்[a]. ஏனெனில், பரிசுத்தருடைய வார்த்தைகளை நான் மறுதலிக்கவில்லை[b].
  rationale: மூலத்தின் கடினமான நடுப்பகுதியைப் பற்றிய மாற்றுவாசிப்பையும், כחד என்பதன் மாற்றுப்பொருளையும் அவை சார்ந்த சொற்களுக்கே நங்கூரமிட இரண்டு அடிக்குறிப்புகளாகப் பிரித்துள்ளேன். ‘பரிசுத்தருடைய’ என்ற சிறு நடைமுறை மாற்றம் மட்டுமே உரையில் செய்யப்பட்டுள்ளது; மற்ற எல்லா முக்கிய மொழிபெயர்ப்புத் தேர்வுகளும் பாதுகாக்கப்பட்டுள்ளன.
