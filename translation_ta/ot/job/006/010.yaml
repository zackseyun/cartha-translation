id: JOB.6.10
reference: Job 6:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: ta
  text: இது இன்னும் எனக்கு ஆறுதலாக இருக்கும்; இரக்கமின்றித் தொடரும் வேதனையிலும் நான் களிகூருவேன்[a]. ஏனெனில், பரிசுத்தருடைய வார்த்தைகளை நான் மறுதலிக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இத்தொடர் சுருக்கமாகவும் பொருள் உறுதியற்றதாகவும் உள்ளது. சொல்லுக்கு நெருக்கமாக, “அவர் விட்டுவைக்காத வேதனையிலும் நான் களிகூருவேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “மறுதலிக்கவில்லை” என்பதற்கு “மறைக்கவில்லை” என்பதும் சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: எனக்கு ஆறுதல்
  rationale: נחם என்பதிலிருந்து வந்த இப்பெயர்ச்சொல் ஆறுதல் அல்லது தேற்றுதலைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் யோபுவுக்கு எஞ்சியிருக்கும் மனத்தேற்றத்தைத் தெளிவாகவும் கூறுகிறது.
- source_word: וַאֲסַלְּדָה
  choice: நான் களிகூருவேன்
  rationale: סלד அரிதானதும் பொருள் உறுதியாகாததுமான வினைச்சொல். இச்சூழலில் தீவிரமான, எதிர்மறை நிலையிலும் நிலைக்கும் மகிழ்ச்சியைக் குறிப்பதால், ‘களிகூருவேன்’ என்பது அதன் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְחִילָה
  choice: வேதனையிலும்
  rationale: חִילָה கடும் வலி, துடிப்பு, வேதனை ஆகிய கருத்துகளைத் தரலாம். ‘வேதனை’ பொதுவாசகருக்குப் புரியக்கூடியதாக இருந்து உடல்-மனத் துன்பத்தின் தீவிரத்தையும் தக்கவைக்கிறது.
- source_word: לֹא יַחְמֹל
  choice: இரக்கமின்றித் தொடரும்
  rationale: חמל என்பது இரங்குதல் அல்லது விட்டுவைத்தல். சுருக்கமான எபிரெய தொடரை இயல்பான தமிழாக்கத்தில் வேதனையைச் சிறிதும் தணிக்காத தன்மையாக வெளிப்படுத்துகிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִחַדְתִּי
  choice: நான் மறுதலிக்கவில்லை
  rationale: כחד மறைத்தல், ஒளித்தல், மறுத்தல் ஆகிய பொருள்களைக் கொள்ளலாம். ‘பரிசுத்தரின் வார்த்தைகள்’ என்பதுடன் ‘மறுதலிக்கவில்லை’ என்பது அவற்றை நிராகரிக்கவில்லை என்ற யோபுவின் கூற்றைத் தெளிவாகக் காட்டுகிறது; சொற்பொருளின் வேறு சாத்தியமும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אִמְרֵי
  choice: வார்த்தைகளை
  rationale: אמרה என்பதன் பன்மை இணைப்புவடிவம் சொல்லப்பட்ட வார்த்தைகள் அல்லது உரைகளைக் குறிக்கிறது. ‘வார்த்தைகள்’ என்பது பரந்ததும் இயல்பானதுமான தமிழ் இணை.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தரின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இப்பெயரடை இங்கு கடவுளைக் குறிக்கும் பட்டப்பெயர். ‘பரிசுத்தர்’ அந்தத் தெய்வீகக் குறிப்பை கூடுதல் கோட்பாட்டு விளக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: קָדוֹשׁ என்ற தெய்வீகப் பட்டப்பெயர்
  choice: பரிசுத்தர்
  alternative: பரிசுத்தமானவர்
  rationale: சூழல் பொதுவான ஒரு பரிசுத்த நபரை அல்ல, கடவுளைக் குறிப்பதைக் காட்டுகிறது. பட்டப்பெயர் வடிவம் அதன் இறையியல் வலிமையைப் பாதுகாக்கிறது.
- issue: בְחִילָה לֹא יַחְמֹל என்ற கடினமான நடுப்பகுதியின் பொருள்
  choice: இரக்கமின்றித் தொடரும் வேதனையிலும்
  alternative: அவர் விட்டுவைக்காத வேதனையிலும்
  rationale: எபிரெயம் சுருக்கமாகவும் தொடரமைப்பில் தெளிவற்றதாகவும் உள்ளது. முதன்மை உரை வலி தணிக்கப்படாமல் தொடர்வதை வாசிக்கத்தக்க தமிழில் தருகிறது; செய்பவர் வெளிப்படையாகக் கடவுள் என்று தீர்மானிக்கும் மாற்றை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: כחד என்பதன் பொருள்
  choice: மறுதலிக்கவில்லை
  alternative: மறைக்கவில்லை
  rationale: இச்சூழலில் கடவுளின் வார்த்தைகளை நிராகரிக்கவில்லை என்ற பொருள் பொருத்தமாக உள்ளது. இருப்பினும் ‘மறைத்தல்’ என்ற உண்மையான சொற்பொருள் சாத்தியம் இருப்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. யோபுவின் தீவிரமான உணர்ச்சியும் எபிரெய நடுப்பகுதியின் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன; பிரதான உரையில் வாசிப்புத் தெளிவும் அடிக்குறிப்பில் சொற்சார்ந்த மாற்றும் வழங்கப்பட்டுள்ளன.
