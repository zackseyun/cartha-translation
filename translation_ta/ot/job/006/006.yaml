  text: הֲ/יֵאָכֵ֣ל תָּ֭פֵל מִ/בְּלִי מֶ֑לַח אִם יֶשׁ טַ֝֗עַם בְּ/רִ֣יר חַלָּמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/006.yaml
  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: ta
  text: உப்பில்லாமல் சுவையற்ற உணவைச் சாப்பிட முடியுமா? அல்லது துத்திக் கீரையின் வழவழப்பான சாற்றில் சுவை உண்டா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டாம் கேள்வியிலுள்ள எபிரெயச் சொற்களின் பொருள் உறுதியற்றது. “துத்திக் கீரையின் வழவழப்பான சாறு” என்பதை “துத்திக் கீரையின் சாறு” என்றும் புரிந்துகொள்ளலாம்; மரபுவழியாகச் சிலர் இதை “முட்டையின் வெள்ளைக்கரு” என்றும் மொழிபெயர்த்துள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: சாப்பிட முடியுமா?
  rationale: கேள்வியிடைச்சொல்லுடன் வரும் நிஃபால் வினை வடிவம் சொல்லாட்சிக் கேள்வியை உருவாக்குகிறது; தமிழில் இயல்பாக அதன் வலிமையை இது வெளிப்படுத்துகிறது.
- source_word: תָּפֵל
  choice: சுவையற்ற உணவு
  rationale: இச்சொல் சுவையில்லாத அல்லது சுவையூட்டப்படாத ஒன்றைக் குறிக்கிறது; சூழலில் மறைந்துள்ள உணவுப் பொருளை வெளிப்படையாகச் சொல்வது தமிழில் தெளிவாக உள்ளது.
- source_word: מִ/בְּלִי מֶלַח
  choice: உப்பில்லாமல்
  rationale: உப்பு இல்லாத நிலையைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: אִם יֶשׁ
  choice: சுவை உண்டா?
  rationale: முதற் கேள்விக்கு இணையான இரண்டாவது சொல்லாட்சிக் கேள்வியாகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது; எபிரெய இணைப்பை தனியே மொழிபெயர்க்காமல் கேள்விகளின் அடுத்தடுத்த அமைப்பு உறவை வெளிப்படுத்துகிறது.
- source_word: טַעַם
  choice: சுவை
  rationale: சுவை அல்லது ருசியைக் குறிக்கும் நேரடியான தமிழ் இணை; முந்தைய ‘சுவையற்ற’ என்பதுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: בְּ/רִיר
  choice: வழவழப்பான சாற்றில்
  rationale: இது வழவழப்பான திரவம், கோழை அல்லது சாறு என்று பொருள்படக்கூடிய கடினமான சொல். தமிழில் புரிந்துகொள்ளக்கூடியதாகவும் அருவருப்பூட்டும் சொல்லாட்சித் தொனியை ஓரளவு காக்கவும் இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது; உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: חַלָּמוּת
  choice: துத்திக் கீரை
  rationale: உறுதியாக அடையாளம் காண முடியாத ஒரு தாவரப்பெயர். ‘Mallow’ என்பதற்கான நவீன தமிழ்ப் பெயராக ‘துத்திக் கீரை’ பயன்படுத்தப்பட்டுள்ளது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
