  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இணையான இரு சொல்லாட்சிக் கேள்விகளும் காக்கப்பட்டுள்ளன; அரிய எபிரெயத் தாவரப்பெயர் மற்றும் திரவத்தைக் குறிக்கும் சொல்லின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
