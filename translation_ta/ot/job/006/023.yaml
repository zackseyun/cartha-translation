lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: என்னை விடுவியுங்கள்
  rationale: מלט என்பதன் ஹிஃபில் கட்டளை வடிவம் ஆபத்திலிருந்தோ ஒருவரின் பிடியிலிருந்தோ தப்பச் செய்வதைக் குறிக்கிறது. “விடுவியுங்கள்” என்பது நவீன தமிழில் இயல்பாகவும், அடுத்த அரையடியில் வரும் פדה என்பதிலிருந்து ஓரளவு வேறுபட்டும் உள்ளது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: எபிரெய மொழியில் இது ஒருவரின் அதிகாரம் அல்லது பிடியிலிருந்து விடுதலை பெறுவதைக் குறிக்கும் உருவகச் சொற்றொடர். தமிழிலும் “கையிலிருந்து” என்பது புரியக்கூடிய இயல்பான உருவகமாக இருப்பதால் அதன் concrete force பாதுகாக்கப்படுகிறது.
- source_word: צָר
  choice: எதிரி
  rationale: צָר என்பது பகைமை காட்டும் ஒருவரை, எதிரியை, குறிக்கிறது. ஒருமையைப் பாதுகாத்து, இராணுவப் பகைவர் என்ற குறுகிய பொருளைத் திணிக்காமல் இருக்க “எதிரி” தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָרִיצִים
  choice: கொடூரர்கள்
  rationale: இந்தப் பன்மைச் சொல் இரக்கமற்ற, வன்முறையான அல்லது ஒடுக்குகிறவர்களைக் குறிக்கலாம். “கொடூரர்கள்” அதன் அறநெறி சார்ந்த தீவிரத்தையும் பன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது; அரசியல் ஆட்சியாளர்கள் என்ற பொருளை மட்டும் திணிப்பதில்லை.
- source_word: תִּפְדּוּנִי
  choice: என்னை மீட்டுக்கொள்ளுங்கள்
  rationale: פדה என்பது விலைகொடுத்தோ வேறு வழியிலோ ஒருவரை ஆபத்து, அடிமைத்தனம் அல்லது கட்டுப்பாட்டிலிருந்து மீட்பதைக் குறிக்கலாம். “மீட்டுக்கொள்ளுங்கள்” முதல் அரையடியின் “விடுவியுங்கள்” என்பதிலிருந்து சொல்லியல் வேறுபாட்டைப் பாதுகாக்கிறது; இங்கு குறிப்பாக ஆன்மீக மீட்பு என்ற பொருளைத் திணிப்பதில்லை.
theological_decisions:
- issue: வழிபாட்டு அல்லது இரட்சிப்பியல் சூழல் அல்லாத இடத்தில் פדה என்பதன் மொழிபெயர்ப்பு
  choice: மீட்டுக்கொள்ளுங்கள்
  alternative: விடுவியுங்கள்; பிணை கொடுத்து மீட்டுக்கொள்ளுங்கள்
  rationale: פדה என்ற வினை ஆபத்து அல்லது கட்டுப்பாட்டிலிருந்து நடைமுறையாக மீட்பதையும் குறிக்க முடியும். “மீட்டுக்கொள்ளுங்கள்” அதன் தனித்த சொல்லியல் நிறத்தைப் பாதுகாக்கிறது; அதேவேளையில், மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத பிணைத்தொகையையோ குறிப்பிட்ட இரட்சிப்பியல் கோட்பாட்டையோ சேர்ப்பதில்லை.
translation_notes:
  register: நடை நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தரமான தமிழ். முந்தைய வசனத்திலிருந்து தொடரும் வினாவைத் தெளிவாக்க “அல்லது” மற்றும் “என்று சொன்னேனா?” பயன்படுத்தப்பட்டுள்ளன. இணையான இரு அரையடிகளிலும் மூலத்தின் “கை” உருவகம் பாதுகாக்கப்பட்டுள்ளது.
