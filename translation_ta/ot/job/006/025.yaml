  text: מַה נִּמְרְצ֥וּ אִמְרֵי יֹ֑שֶׁר וּ/מַה יּוֹכִ֖יחַ הוֹכֵ֣חַ מִ/כֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/025.yaml
  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: ta
  text: நேர்மையான சொற்கள் எவ்வளவு வலிமையானவை! ஆனால் உங்களிடமிருந்து வரும் கண்டனம் எதை நிரூபிக்கிறது?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேர்மையான சொற்கள் எவ்வளவு வேதனை தருகின்றன! ஆனால் உங்கள் வாதம் எதை நிரூபிக்கிறது?” முதல் வாக்கியத்திலுள்ள எபிரெயச் சொல் “வலிமையானவை,” “வற்புறுத்தக்கூடியவை,” அல்லது “வேதனை தருகின்றன” என்ற நுண்பொருள்களையும்; இரண்டாம் வாக்கியத்திலுள்ள சொல் “வாதம்” அல்லது “கண்டனம்” என்ற பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: எவ்வளவு வலிமையானவை
  rationale: מַה அளவை வலியுறுத்தும் வியப்புச் சொல்லாகவும், נמרצו வலிமை அல்லது தாக்கம் உடையதாகவும் இங்கு புரிந்துகொள்ளப்படுகிறது. மூலத்தின் வியப்புத் தொனியையும் சொல்லின் பொருள் நெகிழ்வையும் இத்தொடர் காக்கிறது.
- source_word: אִמְרֵי יֹשֶׁר
  choice: நேர்மையான சொற்கள்
  rationale: יֹשֶׁר என்பதன் நேர்மை, செம்மை ஆகிய ஒழுக்க மற்றும் பேச்சுசார் நுண்பொருள்களை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמַה יּוֹכִיחַ
  choice: ஆனால் ... எதை நிரூபிக்கிறது?
  rationale: ו சூழலில் முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. יכח என்பதற்கு நிரூபித்தல், கண்டித்தல், வாதிடுதல் ஆகிய பொருள்கள் உண்டு; இங்கு நண்பர்களின் கண்டனம் உண்மையில் எதை நிறுவுகிறது என்ற சவாலை ‘நிரூபிக்கிறது’ தெளிவாகத் தருகிறது.
- source_word: הוֹכֵחַ מִכֶּם
  choice: உங்களிடமிருந்து வரும் கண்டனம்
  rationale: הוֹכֵחַ என்பது கண்டித்தல் அல்லது எதிர்வாதம் என்ற செயலைக் குறிக்கிறது; מִכֶּם அதன் மூலத்தை ‘உங்களிடமிருந்து’ எனக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்திற்காக ‘வரும்’ சேர்க்கப்பட்டுள்ளது.
