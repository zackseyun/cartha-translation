translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் கண்ணியமான கவிதைநடையுடனும் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தின் வியப்புத் தொனியும் இரண்டாம் கூறின் சொல்லியல் தெளிவின்மையும் முதன்மை உரை மற்றும் அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளன.
