  source_fidelity: முதல் கூறு מַה ... நִמְרְצוּ என்பதன் வியப்பான அளவுத்தொனியையும், אִמְרֵי־יֹשֶׁר என்பதன் ‘நேர்மையான சொற்கள்’ என்ற பொருளையும் துல்லியமாகத் தருகிறது. இரண்டாம் கூறில் יכח வேரின் ‘நிரூபித்தல்/கண்டித்தல்/வாதிடுதல்’ சார்ந்த திறந்த பொருளில் ‘எதை நிரூபிக்கிறது?’ என்பது பாதுகாப்பான தேர்வு; מִכֶּם என்பதும் ‘உங்களிடமிருந்து வரும்’ என இயல்பாகத் தரப்பட்டுள்ளது.
  naturalness: நவீனத் தரத் தமிழில் நடை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘நேர்மையான சொற்கள் எவ்வளவு வலிமையானவை!’ என்ற வியப்புத் தொடர் இயல்பானது; ‘உங்களிடமிருந்து வரும் கண்டனம்’ என்பதும் பொருளைத் தெளிவுபடுத்துகிறது.
  terminology: ‘நேர்மையான,’ ‘கண்டனம்,’ ‘நிரூபிக்கிறது’ ஆகியவை சூழலுக்கேற்ற, மதச்சார்பற்ற பொதுத்தமிழ்ச் சொற்கள். அடிக்குறிப்பு மூலச் சொல்லின் பரந்த சொற்பொருள் வாய்ப்புகளைத் தகுந்த வகையில் குறிக்கிறது.
