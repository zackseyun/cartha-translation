  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: ta
  text: அவை சூடாகும்போது மறைந்துபோகின்றன[a]; வெப்பத்தில்[b] தங்கள் இடத்திலிருந்து[c] வற்றிப்போகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அணைந்துபோகின்றன’ என்றும் மொழிபெயர்க்கலாம்; மறைதல் மற்றும் அணைதல் ஆகிய படிமங்கள் எபிரேய வினைச்சொற்களில் ஒன்றோடொன்று கலந்துள்ளன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதன் வெப்பத்தில்’; ‘வெப்பம் உண்டாகும்போது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தங்கள் இடம்’ என்பது இச்சூழலில் நீரோடையின் படுகை அல்லது கால்வாயைக் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: -ஆகும்போது
  rationale: காலத்தைக் குறிக்கும் முன்னிடைச்சொல் மற்றும் பெயர்ச்சொல் இணைந்து ஒரு காலத் துணைவாக்கியத்தை அறிமுகப்படுத்துகின்றன; தமிழில் இயல்பாக ‘-ஆகும்போது’ என வழங்கப்படுகிறது.
- source_word: יְזֹרְבוּ
  choice: சூடாகும்போது
  rationale: அரிதான இவ்வினைச்சொல் சூடாதல் அல்லது வெப்பமடைதலைக் குறிக்கிறது. முந்தைய சூழலில் வரும் நீரோடைகளே எழுவாய் என்பதால், ‘சூடாகும்போது’ என்பது காரணத்தை மிகையாக விளக்காமல் பொருளை இயல்பாகத் தருகிறது.
- source_word: נִצְמָתוּ
  choice: மறைந்துபோகின்றன
  rationale: நிஃபால் வடிவம் முடிவுறுதல், அழிக்கப்படுதல் அல்லது காணாமற்போதல் ஆகிய பொருள்களைத் தரக்கூடும். பருவகால நீரோடைகளின் படிமத்தில் ‘மறைந்துபோகின்றன’ என்பது தண்ணீர் இல்லாமற்போவதைத் தெளிவாகவும் உயிரோட்டமாகவும் காட்டுகிறது.
- source_word: בְּחֻמּוֹ
  choice: வெப்பத்தில்
  rationale: சொல்லுக்கு சொல் ‘அதன்/அவனுடைய வெப்பத்தில்’ என்று பொருள். பின்னொட்டின் தொடர்பு தெளிவாக இல்லாததால், அதைத் தீர்மானிக்காமல் ‘வெப்பத்தில்’ என்று மொழிபெயர்ப்பது எபிரேயின் சுருக்கத்தையும் இயற்கைச் சூழலையும் காக்கிறது.
- source_word: נִדְעֲכוּ
  choice: வற்றிப்போகின்றன
  rationale: இவ்வினைச்சொல் அணைக்கப்படுதல் அல்லது தணிந்துபோதல் எனவும் பொருள்படலாம். நீரோடைகள் பற்றிய சூழலில் ‘வற்றிப்போகின்றன’ என்பது படிமத்தின் நேரடியான விளைவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִמְּקוֹמָם
  choice: தங்கள் இடத்திலிருந்து
  rationale: எபிரேயச் சொல் பொதுவாக இடம் அல்லது இருப்பிடத்தைக் குறிக்கிறது. ‘நீர்ப்படுகை’ என்று குறிப்பாக்காமல், மூலத்தின் பொதுத்தன்மையை ‘தங்கள் இடத்திலிருந்து’ காக்கிறது.
