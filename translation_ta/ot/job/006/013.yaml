  text: הַ/אִ֬ם אֵ֣ין עֶזְרָתִ֣/י בִ֑/י וְ֝/תֻשִׁיָּ֗ה נִדְּחָ֥ה מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: ta
  text: எனக்குள் உதவி இல்லையா? பயனளிக்கும் ஞானமும்[a] என்னிடமிருந்து விரட்டப்பட்டுவிட்டதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காரியசாதுரியம்”; எபிரெயச் சொல் நடைமுறை ஞானம், செயல்திறன் அல்லது பயனுள்ள ஆலோசனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: இல்லையல்லவா?
  rationale: இது மறுப்பை உள்ளடக்கிய வினாவை அறிமுகப்படுத்துகிறது. தமிழில் ‘இல்லையல்லவா?’ என்பது வலியுறுத்தலை மிகைப்படுத்தாமல் அதன் சொல்லாட்சியையும் புலம்பல் நிறைந்த வினாத் தொனியையும் இயல்பாகக் காக்கிறது.
- source_word: עֶזְרָתִי בִי
  choice: எனக்குள் எனக்கான உதவி
  rationale: עֶזְרָתִי என்பது ‘என் உதவி/எனக்கான உதவி’ என்றும் בִי என்பது ‘எனக்குள்’ என்றும் பொருள்படும். இங்கு யோபுவின் சொந்த உள்ளார்ந்த ஆதாரம் தீர்ந்துபோன கருத்தைத் தெளிவாகவும், மூலத்தின் ‘உதவி’ என்ற உருவகத்தைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: וְתֻשִׁיָּה
  choice: பயனளிக்கும் ஞானம்
  rationale: תּוּשִׁיָּה என்பது நம்பத்தகுந்த நடைமுறை ஞானம், காரியசாதுரியம், செயல்திறன் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘பயனளிக்கும் ஞானம்’ என்பது ஞான இலக்கியச் சொல்லாட்சியையும் செயல்பாட்டு அம்சத்தையும் இணைத்துக் காக்கிறது.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: என்னிடமிருந்து விரட்டப்பட்டுவிட்டது
  rationale: נדח என்பதன் நிஃபால் வடிவம் தள்ளிவிடப்படுதல் அல்லது விரட்டப்படுதல் என்ற செயல்படுபொருள் உணர்வைக் கொண்டது. ‘விரட்டப்பட்டுவிட்டது’ அந்த வலிமையான உருவகத்தையும் நிறைவுற்ற நிலையையும் காக்கிறது.
theological_decisions:
- issue: முதல் வினாவின் பொருள்
  choice: யோபுவுக்குள் உதவி இல்லை என்ற புலம்பலாக மொழிபெயர்த்தல்
  alternative: யோபுவின் உதவி இன்னும் அவருக்குள் இருக்கிறது என்று உறுதிப்படுத்தும் வினாவாகப் புரிந்துகொள்ளுதல்
  rationale: הַאִם אֵין என்பதன் இயல்பான அமைப்பும் அடுத்த வரியில் ஞானம் அவரிடமிருந்து விரட்டப்பட்டதாகச் சொல்லப்படுவதும், உள்ளார்ந்த உதவி இனி இல்லை என்ற இணையான புலம்பலை ஆதரிக்கின்றன. இருப்பினும் மூலத்தின் வினா வடிவம் மொழிபெயர்ப்பிலும் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் புலம்பலின் வலிமையும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. இரு இணையான வினாக்களும் இயல்பான தமிழ் வினாத்தொனியில் தரப்பட்டுள்ளன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
