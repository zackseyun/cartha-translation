  yaml_path: translation/ot/job/006/003.yaml
  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: ta
  text: ஏனெனில், இப்போது அது கடல்களின் மணலைவிடக் கனமாக இருக்கும்; அதனால்தான் என் சொற்கள் தாறுமாறாகிவிட்டன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது; “கட்டுக்கடங்காமல் போயின” அல்லது “குழம்பிப்போயின” என்றும் மொழிபெயர்க்கலாம். சிலர் “விழுங்கப்பட்டன” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோபு கூறிய புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: யோபின் தற்போதைய நிலையின் உண்மையை வலியுறுத்தும் காலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: מֵחוֹל יַמִּים
  choice: கடல்களின் மணலைவிட
  rationale: ஒப்பீட்டுப் பொருளையும் எபிரெய மூலத்திலுள்ள ‘கடல்கள்’ என்ற பன்மையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יִכְבָּד
  choice: கனமாக இருக்கும்
  rationale: כבד என்பதன் ‘கனமாக இரு’ என்ற அடிப்படைப் பொருளைக் கொடுக்கிறது; முந்தைய வசனத்தில் கூறப்பட்ட துயரமே இங்கு மறைமுக எழுவாய்.
- source_word: עַל־כֵּן
  choice: அதனால்தான்
  rationale: துயரத்தின் பெரும் கனத்திற்கும் யோபின் கட்டுப்பாடற்ற பேச்சுக்கும் இடையிலான விளைவு உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: דְּבָרַי
  choice: என் சொற்கள்
  rationale: மூலத்தின் பன்மைப் பெயர்ச்சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָעוּ
  choice: தாறுமாறாகிவிட்டன
  rationale: பொருள் உறுதியில்லாத இந்த வினைச்சொல், சூழலில் கட்டுப்பாடின்றி அல்லது ஒழுங்கின்றி வெளிப்பட்ட பேச்சைக் குறிக்கலாம்; ‘தாறுமாறாகிவிட்டன’ அந்தத் தெளிவின்மையை ஓரளவு தக்கவைத்து இயல்பான தமிழை வழங்குகிறது.
