base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: ta
  text: ஆனால் இப்போது, தயவுசெய்து என்னை நோக்கிப் பாருங்கள்[a]; உங்கள் முன்னிலையில் நான் பொய் சொல்வேனா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பக்கம் திரும்புங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உங்கள் முகங்களுக்கு முன்பாக”; அதாவது, “உங்கள் முன்னிலையில்” அல்லது “உங்கள் முகத்துக்கு நேராக.” “பொய் சொல்வேனா?” என்பதற்கு “ஏமாற்றுவேனா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய வாதத்திலிருந்து தற்போதைய நேரடி வேண்டுகோளுக்கு மாறும் எதிர்மறைத் தொடர்பையும் காலக் குறிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוֹאִילוּ
  choice: தயவுசெய்து
  rationale: விருப்பம் அல்லது இணக்கத்தை வேண்டுகிற கட்டளையின் மரியாதையான வேண்டுகோள் நயத்தை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: פְנוּ בִי
  choice: என்னை நோக்கிப் பாருங்கள்
  rationale: யோபு தன் நண்பர்களை நேரடியாகத் தன்னைப் பார்த்து ஆராயும்படி கேட்கும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; 'என் பக்கம் திரும்புங்கள்' என்பதும் சாத்தியம்.
- source_word: וְעַל פְּנֵיכֶם
  choice: உங்கள் முகத்துக்கு முன்பாக
  rationale: நேருக்கு நேர், அவர்களுடைய முன்னிலையில் பேசுவதை வலியுறுத்தும் எபிரெய மொழியின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אִם אֲכַזֵּב
  choice: நான் பொய் சொல்வேனா?
  rationale: אִם இங்கு எளிய நிபந்தனையாக அல்லாமல் சொல்லாட்சிக் கேள்வியாகச் செயல்படுகிறது; כזב பொய் பேசுதல் அல்லது பொய்யாக உரைத்தல் என்ற பொருளை உடையது.
