review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the polite appeal, the invitation to look/turn toward Job, and the rhetorical question about speaking falsely. אולם, the Hebrew phrase וְעַל־פְּנֵיכֶם is most naturally represented in Tamil by ‘உங்கள் முன்னிலையில்’; the draft’s ‘உங்கள் முகத்துக்கு முன்பாக’ is overly literal and has an awkward singular/plural construction.
  naturalness: ‘என்னை நோக்கிப் பாருங்கள்’ is natural modern Tamil. ‘உங்கள் முகத்துக்கு முன்பாக’ is not idiomatic in this context; ‘உங்கள் முன்னிலையில்’ gives the intended direct, face-to-face sense naturally.
  terminology: ‘பொய் சொல்வேனா?’ appropriately renders the rhetorical force of אִם אֲכַזֵּב without importing a theological interpretation. The lexical alternative ‘ஏமாற்றுவேனா?’ may be retained in a footnote.
  issues:
  - severity: medium
    issue: The phrase ‘உங்கள் முகத்துக்கு முன்பாக’ is awkward and grammatically mismatched.
    rationale: The Hebrew has a plural ‘your faces’ in an idiom meaning ‘before you/in your presence.’ Tamil ‘உங்கள் முகத்துக்கு’ combines plural possession with singular ‘face’ and is less natural than ‘உங்கள் முன்னிலையில்.’
  revised_text: ஆனால் இப்போது, தயவுசெய்து என்னை நோக்கிப் பாருங்கள்[a]; உங்கள் முன்னிலையில் நான் பொய் சொல்வேனா?[b]
