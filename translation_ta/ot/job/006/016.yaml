  text: which are dark from ice[a], and on them the snow conceals itself.
translation:
  language: ta
  text: பனிக்கட்டியால் இருண்டிருக்கும் ஓடைகள்[a]; அவற்றின்மேல் பனி தன்னை மறைத்துக்கொள்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பனிக்கட்டியால் கலங்கிய ஓடைகள்.’ எபிரெயச் சொல் அடிப்படையில் ‘இருண்ட’ அல்லது ‘இருண்டுபோன’ என்று பொருள்படும்; இச்சூழலில் குளிர்கால நிலைமைகளால் நீர் கலங்குவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: இருண்டுபோகின்ற
  rationale: קדר என்பதன் அடிப்படை காட்சிப்பொருள் இருண்ட அல்லது கருமையடைந்த நிலை. பெயரெச்ச வடிவத்தின் இயக்கத்தையும் ஓடைகளின் தோற்றத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִנִּי
  choice: பனிக்கட்டியால்
  rationale: מִנִּי இங்கு காரணம் அல்லது மூலத்தைச் சுட்டுகிறது; தமிழில் காரணத்தை இயல்பாகக் காட்ட கருவி வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: קָרַח
  choice: பனிக்கட்டி
  rationale: இந்தச் சொல் பனிக்கட்டி அல்லது உறைபனியைக் குறிக்கலாம். அடுத்த அடியில் வரும் பனிப்பொழிவுடன் வேறுபாடு தெளிவாக இருக்க ‘பனிக்கட்டி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָלֵימוֹ
  choice: அவற்றின்மேல்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஓடைகளைக் குறிக்கும் பன்மைச் சுட்டைத் தக்கவைத்து, இடத்தொடர்பை நேரடியாகக் கூறுகிறது.
- source_word: יִתְעַלֶּם
  choice: தன்னை மறைத்துக்கொள்கிறது
  rationale: ஹித்பயேல் வடிவத்தின் தற்சுட்டு நுணுக்கத்தைப் பாதுகாக்கிறது; வெறும் ‘மறைக்கப்படுகிறது’ என்ற செயப்பாட்டு மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: שָׁלֶג
  choice: பனி
  rationale: שָׁלֶג என்பது விழுந்த அல்லது படிந்த பனியைக் குறிக்கிறது. தமிழில் இயல்பான பொதுப்பெயராக ‘பனி’ பயன்படுத்தப்பட்டுள்ளது.
