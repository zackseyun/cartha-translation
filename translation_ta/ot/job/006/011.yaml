source:
  edition: WLC
  text: מַה כֹּחִ֥/י כִֽי אֲיַחֵ֑ל וּ/מַה קִּ֝צִּ֗/י כִּֽי אַאֲרִ֥יךְ נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: ta
  text: நான் தொடர்ந்து நம்பிக்கையுடன் காத்திருக்க என்ன வலிமை எனக்கு இருக்கிறது? என் வாழ்வை நீட்டித்துக்கொள்வதற்கு என் முடிவு என்ன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் தொடர்ந்து பொறுமையாயிருக்க?” எபிரெயத்தில் சொல்லுக்கு சொல், “என் உயிரை நீட்டிக்க” என்று உள்ளது; இது வாழ்வை நீட்டிப்பதையோ தொடர்ந்து சகித்திருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: எனக்கு என்ன வலிமை இருக்கிறது?
  rationale: מַה அறிமுகப்படுத்தும் சொல்லாட்சிக் கேள்வியையும், כֹּחִי குறிக்கும் தனிப்பட்ட உடல்-மனத் தாங்கும் திறனையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי אֲיַחֵל
  choice: நான் தொடர்ந்து நம்பிக்கையோடு காத்திருக்க
  rationale: יחל என்பதில் ‘நம்புதல்’ மற்றும் ‘காத்திருத்தல்’ ஆகிய இரு நிழற்பொருள்களும் உள்ளன; தமிழ் சொற்றொடர் இரண்டையும் காத்து, தொடர்ந்த எதிர்பார்ப்பை வெளிப்படுத்துகிறது.
- source_word: וּמַה קִצִּי
  choice: எனக்கு என்ன முடிவு இருக்கிறது?
  rationale: קֵץ என்பதன் ‘முடிவு/எல்லை’ என்ற சுருக்கமான, இருப்பியல் அழுத்தத்தை ‘முடிவு’ காக்கிறது; ו இணைக்கும் இணைநிலை அமைப்பும் தொடரப்படுகிறது.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: என் வாழ்வை நீட்டித்துக்கொண்டிருக்க
  rationale: ‘என் உயிரை/ஆத்துமாவை நீட்டிக்க’ என்ற எபிரெய உருவகத்தின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; தொடர்ந்த உயிர்வாழ்தல் அல்லது சகித்திருத்தல் என்ற சாத்தியங்களை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: Job’s continued hope/endurance
  choice: நம்பிக்கையோடு காத்திருத்தல் மற்றும் வாழ்வை நீட்டித்தல் என்ற மொழியைப் பேணுதல்
  alternative: இதை வெறுமனே ‘பொறுமையாக இருத்தல்’ என்று விளக்குதல்
  rationale: எபிரெயம் நம்பிக்கை, காத்திருப்பு, சகிப்பு ஆகியவற்றுக்கிடையிலான பதற்றத்தை முழுமையாகத் தீர்க்கவில்லை; மொழிபெயர்ப்பு அதை ஒரு குறிப்பிட்ட இறையியல் வாசிப்பாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, துயர்மிக்க சொல்லாட்சிக் கேள்விகளாக வடிவமைக்கப்பட்டது. செய்யுள் இணைநிலை காக்கப்பட்டுள்ளது; அரிதான நேரடி எபிரெய உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
