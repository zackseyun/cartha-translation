source:
  edition: WLC
  text: מֵאֲנָ֣ה לִ/נְגּ֣וֹעַ נַפְשִׁ֑/י הֵ֝֗מָּה כִּ/דְוֵ֥י לַחְמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: ta
  text: அவற்றைத் தொட என் உயிரே மறுக்கிறது[a]; அவை என் உணவின் நோயைப் போன்றவை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைத் தொட என் பசி மறுக்கிறது.” எபிரெயத்தில் உள்ள נֶפֶשׁ (நெஃபெஷ்) என்பது “உயிர்,” “தான்/நபர்,” அல்லது சில சூழல்களில் “பசி/உணவுவிருப்பம்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவை எனக்கு அருவருப்பான உணவைப் போன்றவை,” அல்லது “அவை நோயுற்ற உணவைப் போன்றவை.” எபிரெயத் தொடர் சுருக்கமானதும் பொருள் காணக் கடினமானதும் ஆகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: மறுக்கிறது
  rationale: מָאֵן என்பது ‘மறுத்தல், விருப்பமில்லாமல் இருத்தல்’ என்று பொருள்படும். யோபுவின் தொடரும் வெறுப்புணர்வை இயல்பான நிகழ்காலத்தில் இது வெளிப்படுத்துகிறது.
- source_word: לִנְגּוֹעַ
  choice: தொட
  rationale: נגע என்பதன் நேரடியான பொருள் ‘தொடுதல்.’ முந்தைய வசனத்தில் கூறப்பட்டவற்றுடன் தொடர்புகொள்ளவே விரும்பாத வெறுப்பை இங்கு இது குறிக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נפש என்பது உயிர், தன்முழுமை, தொண்டை அல்லது பசி/உணவுவிருப்பம் ஆகிய பொருள்களைக் கொள்ளலாம். நவீன தமிழில் ‘என் உள்ளம்’ என்பது மனிதனின் அகநிலையையும் தனிப்பட்ட அருவருப்பையும் இயல்பாகக் காட்டுகிறது; ‘என் பசி’ என்ற குறுகிய பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: הֵמָּה
  choice: அவை
  rationale: இந்தப் பன்மைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட அருவருப்பானவற்றைக் குறிக்கிறது.
- source_word: כִּדְוֵי
  choice: நோயூட்டும் … போன்றவை
  rationale: דוה சார்ந்த இச்சொல் நோய் அல்லது சுகவீனத்தைக் குறிக்கிறது. எபிரெயத் தொடர் சுருக்கமாகவும் பொருள் தெளிவற்றதாகவும் இருப்பதால், ‘நோயூட்டும் உணவு’ என்பது நோயின் உருவகத்தைத் தக்கவைத்தபடி தமிழில் புரியத்தக்கதாக அமைகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு தருகிறது.
- source_word: לַחְמִי
  choice: உணவு
  rationale: לחם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; ஆனால் அது பொதுவாக ‘உணவு’ என்றும் பொருள்படும். இச்சூழலில் ‘உணவு’ இயல்பாகவும் தேவையற்ற குறுக்கமின்றியும் உள்ளது.
