id: JOB.6.29
reference: Job 6:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: ta
  text: தயவுசெய்து, திரும்புங்கள்[a]; அநீதி இருக்க வேண்டாம். மீண்டும் திரும்புங்கள்; இதில் என் நியாயம் இன்னும் நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மறுபடியும் திரும்புங்கள்; இக்காரியத்தில் நியாயம் இன்னும் என் பக்கமே இருக்கிறது.”'
    reason: שוב, צדק, בָהּ ஆகியவற்றின் சூழல்சார் மாற்று வாசிப்பைத் தருகிறது; குறிப்பாக கடைசி பின்னொட்டின் மறைமுக முன்னிலையையும் ‘நியாயம்’ என்பதன் வழக்குசார் பொருளையும் தெளிவாக்குகிறது.
lexical_decisions:
- source_word: שֻֽׁבוּ
  choice: திரும்புங்கள்
  rationale: שוב என்பதன் பன்மை ஏவல் வடிவம். யோபு தன் நண்பர்கள் தங்கள் தீர்ப்பிலிருந்து பின்வாங்கி அதை மறுபரிசீலனை செய்யுமாறு அழைக்கிறார். ‘திரும்புங்கள்’ என்பது மூலத்தின் திசைமாற்ற உருவகத்தையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: ஏவலை மென்மையாக்கும் வேண்டுகோள் இடைச்சொல். காலத்தைக் குறிக்கும் ‘இப்போது’ என்பதைக் காட்டிலும் ‘தயவுசெய்து’ இச்சூழலில் பொருத்தமானது.
- source_word: אַל תְּהִי עַוְלָה
  choice: அநீதி இருக்க வேண்டாம்
  rationale: ‘அநீதி இருக்காதிருக்கட்டும்’ என்ற மூலத்தின் ஆளற்ற அமைப்பைப் பேணுகிறது; அநீதியை யார் செய்கிறார் என்பதை மொழிபெயர்ப்பு தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: עַוְלָה
  choice: அநீதி
  rationale: இங்கு தவறான அல்லது பாரபட்சமான மதிப்பீட்டைச் சுட்டும் நீதித்துறை சார்ந்த பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: וְשֻׁבוּ
  choice: மீண்டும் திரும்புங்கள்
  rationale: மீண்டும் வரும் ஏவல் யோபின் வேண்டுகோளை வலுப்படுத்துகிறது; ‘மீண்டும்’ அதன் தொடர்ச்சியையும் அழுத்தத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: யோபின் நியாயம் தொடர்ந்து நிலைப்பதைச் சுட்டும் ‘இன்னும்/இதுவரையும்’ என்ற பொருளை வழங்குகிறது.
- source_word: צִדְקִי
  choice: என் நியாயம்
  rationale: צדק என்பதன் ஒழுக்க மற்றும் நீதித்துறை சார்ந்த இரு நிழற்பொருள்களையும் இச்சர்ச்சைச் சூழலில் ‘என் நியாயம்’ தக்கவைக்கிறது; இது யோபு முற்றிலும் பாவமற்றவர் என்ற மிகைப்படுத்தப்பட்ட கூற்றை மொழிபெயர்ப்பில் புகுத்தாது.
- source_word: בָהּ
  choice: இதில்
  rationale: பெண்பால் ஒருமை பின்னொட்டின் முன்னிலைத் தொடர்பு வெளிப்படையாகக் குறிப்பிடப்படவில்லை. விவாதிக்கப்படும் காரியம் அல்லது வழக்கைச் சுட்டும் வகையில் ‘இதில்’ என்று நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யோபின் צִדְקִי என்ற கூற்றின் பொருள்
  choice: விவாதிக்கப்படும் காரியத்தில் தன் நியாயம் இன்னும் நிலைத்திருக்கிறது என்று யோபு கூறுகிறார்.
  alternative: தன் நேர்மை நிலைக்கிறது என்று யோபு கூறுகிறார்; அல்லது இக்காரியத்தில் நியாயம் தன் பக்கமே உள்ளது என்று கூறுகிறார்.
  rationale: சூழல் யோபைப் பற்றிய நண்பர்களின் தீர்ப்பைக் குறிக்கிறது. ஆகவே இது பாவமற்ற முழுநிறைவை உரிமைகோருவதாக அல்லாமல், இவ்விவகாரத்தில் அவரது ஒழுக்க-நீதித்துறை சார்ந்த நிலையைப் பற்றிய கூற்றாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைப் பன்மை ஏவல் வடிவங்களுடன் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் இருமுறை வரும் ‘திரும்புங்கள்’ என்பதும், ‘அநீதி’ என்ற கருத்துப்பெயருடன் அமைந்த ஆளற்ற வாக்கியமும், கடைசி சொற்றொடரின் ஓரளவு மறைபொருளும் இயன்றவரை பேணப்பட்டுள்ளன.
