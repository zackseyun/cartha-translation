  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: ta
  text: 'என் சகோதரர்கள் காட்டாற்றைப்போல் துரோகமாக நடந்துகொண்டார்கள்;

    காட்டாறுகளின் நீர்ப்பாதைகளைப்போல் கடந்துபோகிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு ஓடையைப்போல் … ஓடைகளின் நீர்ப்பாதைகளைப்போல்.” எபிரெயச் சொல் ஓடை, பெருக்காறு, அல்லது பருவகாலத்தில் மட்டும் நீர் ஓடும் பள்ளத்தாக்கு நீர்வழி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘என் சகோதரர்கள்’ என்று பொருள்படும். சூழலில் இது நெருங்கிய தோழர்களையும் குறிக்கக்கூடும்; எனினும் மூலத்தின் உறவுமுறைச் சொல்லை முதன்மை உரை தக்கவைக்கிறது.
- source_word: בָּגְדוּ
  choice: துரோகம் செய்தார்கள்
  rationale: בגד என்பது உறவில் நம்பிக்கைக்குப் புறம்பாக, துரோகமாக நடந்துகொள்வதைக் குறிக்கிறது. ‘துரோகம் செய்தார்கள்’ அதன் அறநெறி மற்றும் உறவுசார் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: נָחַל / נְחָלִים
  choice: காட்டாறு / காட்டாறுகள்
  rationale: נחל என்பது ஓடை, பெருக்கெடுக்கும் ஆறு, பள்ளத்தாக்கு வழி ஓடும் பருவகால நீர்வழி ஆகியவற்றைக் குறிக்கலாம். வறண்ட நிலத்தில் தற்காலிகமாக ஓடி பின்னர் மறையும் நீர்வழி என்ற படிமத்தை ‘காட்டாறு’ சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲפִיק
  choice: நீர்ப்பாதைகள்
  rationale: אפיק என்பது நீர் ஓடும் பாதை, படுகை அல்லது கால்வாயைக் குறிக்கும். ‘நீர்ப்பாதைகள்’ என்பது மனிதர் அமைத்த வாய்க்கால் என்ற தவறான எண்ணத்தைத் தவிர்த்து இயற்கையான நீரோட்டப் பாதையைச் சுட்டுகிறது.
- source_word: יַעֲבֹרוּ
  choice: கடந்துபோகும் … ஆனார்கள்
  rationale: வினையின் அடிப்படைப் பொருள் ‘கடந்து போதல்’. அடுத்த வசனங்களில் வெளிப்படும் மறைதல் அல்லது வற்றிப்போதல் என்ற கருத்தை இங்கே முழுமையாக முன்கூட்டியே விளக்காமல், மூலத்தின் இயக்கத்தையும் நிலையாமையையும் ‘கடந்துபோகும்’ தக்கவைக்கிறது.
