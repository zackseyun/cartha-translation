  naturalness: ‘அப்போது யோபு மறுமொழியாகச் சொன்னார்:’ நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம உரைநடையிலும் உள்ளது. உரையாடலை அறிமுகப்படுத்தும் இரட்டைப்புள்ளியும் சரியானது.
