  language: ta
  text: 'அப்போது யோபு மறுமொழியாகச் சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்பதன் wayyiqtol வடிவம், முந்தைய உரைக்கு யோபு அளிக்கும் பதிலை அறிமுகப்படுத்துகிறது. அடுத்துள்ள ‘சொன்னார்’ என்பதுடன் இயல்பான தமிழில் இணைக்க ‘மறுமொழியாக’ எனப் பெயரெச்சத் தொடர் வடிவில் மொழிபெயர்க்கப்பட்டது; இதனால் இரண்டு எபிரெய வினைகளின் பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: இப்பெயர் நவீனத் தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: אמר என்பதன் wayyiqtol வடிவம். ‘பதிலளித்துச் சொன்னார்’ என்ற எபிரெய உரைநடைச் சூத்திரத்தின் இரண்டாம் வினையைத் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க wayyiqtol-இன் waw கதைநிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கிறது. ‘அப்போது’ என்பது அந்தத் தொடர்ச்சியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
