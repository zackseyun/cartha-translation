  text: כִּֽי עַ֭תָּה הֱיִ֣יתֶם לא תִּֽרְא֥וּ חֲ֝תַ֗ת וַ/תִּירָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: ta
  text: ஏனெனில், இப்போது நீங்கள் ஒன்றுமில்லாதவர்களாக ஆகிவிட்டீர்கள்[a]; பேரழிவைக் கண்டு[b] அஞ்சுகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நீங்கள் ‘இல்லை’ ஆகிவிட்டீர்கள்” என்பது போன்ற வாசகம் உள்ளது. பலர் இதை “நீங்கள் ஒன்றுமில்லாதவர்களாக ஆகிவிட்டீர்கள்” என்றோ, முந்தைய வசனங்களில் வரும் நம்பகமற்ற நீரோடைகளைச் சுட்டி “நீங்கள் அவற்றைப் போல ஆகிவிட்டீர்கள்” என்றோ புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “திகிலைக் கண்டு.” இந்தப் பெயர்ச்சொல் திகில், மனக்கலக்கம் அல்லது நொறுக்கும் பேரிடர் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட நம்பகமற்ற நீரோடைகளின் ஒப்புமையிலிருந்து யோபு இப்போது தனது நண்பர்களைப் பற்றிய முடிவை விளக்குகிறார்.
- source_word: עַתָּה
  choice: இப்போது
  rationale: எதிர்பார்த்த உதவிக்கும் தற்போதைய நிலைக்கும் உள்ள வேறுபாட்டைக் குறிக்கும் கால வினையடை.
- source_word: הֱיִיתֶם
  choice: ஆகிவிட்டீர்கள்
  rationale: היה என்பதை வெறும் இருப்பைக் குறிக்கும் சொல்லாக அல்லாமல், நிலைமாற்றத்தைக் குறிக்கும் வினையாகத் தருகிறது.
- source_word: לא
  choice: ஒன்றுமில்லாதவர்களாக
  rationale: எழுதப்பட்ட எபிரெய வடிவம் 'இல்லை/அல்ல' என்று இருந்தாலும், சூழலில் நண்பர்கள் பயனற்றவர்களாகிவிட்டார்கள் என்ற பொருள் இயல்பாகிறது; மூலத்தின் உரைச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִּרְאוּ
  choice: கண்டு
  rationale: ראה என்பதன் அடிப்படைப் பொருளான காணுதல்; யோபின் சிதைந்த நிலையையோ அவருக்கு நேர்ந்த பேரிடரையோ நண்பர்கள் காண்பதைக் குறிக்கிறது.
- source_word: חֲתַת
  choice: பேரழிவை
  rationale: இந்தப் பெயர்ச்சொல் திகில், மனக்கலக்கம் அல்லது நொறுக்கும் பேரிடர் ஆகியவற்றைக் குறிக்கலாம். காணக்கூடிய யோபின் பேரிடர் என்ற பொருளில் 'பேரழிவு' இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתִּירָאוּ
  choice: அஞ்சுகிறீர்கள்
  rationale: நண்பர்கள் கண்டதற்கு அவர்களுடைய அச்சமான எதிர்வினையை, தமிழில் இயல்பான நிகழ்காலத் தொடராக வெளிப்படுத்துகிறது.
