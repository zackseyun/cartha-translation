  yaml_path: translation/ot/job/006/030.yaml
  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: ta
  text: என் நாவில் அநீதி இருக்கிறதா? அழிவைத் தருபவற்றை என் அண்ணம் பகுத்தறியாதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழிவைத் தருபவற்றை’ என்பதற்குப் பதிலாக ‘பேரழிவுகளை’ அல்லது ‘வக்கிரமானவற்றை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அழிவுண்டாக்கும் தீங்குகளையோ பேரழிவுகளையோ, ஒழுக்கரீதியாக வக்கிரமானவற்றையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: இருக்கிறதா?
  rationale: ஆம் அல்லது இல்லை என்ற பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בִּלְשׁוֹנִי
  choice: என் நாவில்
  rationale: பேச்சைக் குறிக்கும் உடல் உறுப்பின் உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: עַוְלָה
  choice: அநீதி
  rationale: தவறு, அநியாயம், ஒழுக்கச் சீர்கேடு ஆகிய பொருள் வட்டத்தைச் சுருக்காமல் அதன் ஒழுக்கப் பரிமாணத்தைத் தருகிறது.
- source_word: אִם
  choice: இரண்டாவது கேள்வியாகத் தமிழில் நேரடியாக அமைக்கப்பட்டது
  rationale: இங்கு இச்சொல் முதல் கேள்விக்கு இணையான இரண்டாவது சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது; சொற்சொல்லான ‘என்றால்’ தமிழில் பொருந்தாது.
- source_word: חִכִּי
  choice: என் அண்ணம்
  rationale: சுவைத்து வேறுபடுத்தும் உறுப்பான ‘palate’ என்பதன் உடல் சார்ந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לֹא יָבִין
  choice: பகுத்தறியாதா?
  rationale: அறிதல் மட்டுமல்லாமல் சுவைத்து வேறுபடுத்தி மதிப்பிடும் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: הַוּוֹת
  choice: அழிவைத் தருபவற்றை
  rationale: அழிவுகள், கேடானவை, ஒழுக்கரீதியாக வக்கிரமானவை என விரியக்கூடிய எபிரெயச் சொல்லின் அழிவூட்டும் அம்சத்தை இயல்பான தமிழில் முன்வைக்கிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: הַוּוֹת என்பதன் துன்பம் சார்ந்த பொருளுக்கும் ஒழுக்கச் சீர்கேடு சார்ந்த பொருளுக்கும் இடையிலான தெளிவின்மை
  choice: முதன்மை உரையில் ‘அழிவைத் தருபவற்றை’
  alternative: ‘பேரழிவுகளை’ அல்லது ‘வக்கிரமானவற்றை’
  rationale: யோபின் துன்பச் சூழலுக்கும் கேடான பேச்சைப் பகுத்தறியும் கருத்துக்கும் இடமளிக்கும் வகையில், மூலத்தின் பொருள் இழுவையை முற்றிலும் ஒரு பக்கமாகத் தீர்மானிக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அண்ணம்’ என்பது பொதுப் பேச்சில் சற்றுக் குறைவாகப் பயன்பட்டாலும், மூலத்திலுள்ள சுவை உறுப்பின் தெளிவான உருவகத்தைப் பாதுகாக்கும் துல்லியமான தமிழ்ச் சொல். இரு சொல்லாட்சிக் கேள்விகளின் இணை அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
