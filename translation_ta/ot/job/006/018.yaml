source:
  edition: WLC
  text: יִ֭לָּ֣פְתוּ אָרְח֣וֹת דַּרְכָּ֑/ם יַעֲל֖וּ בַ/תֹּ֣הוּ וְ/יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: ta
  text: அவற்றின் வழித்தடங்கள் வளைந்து விலகுகின்றன[a]; அவை பாழ்வெளிக்குள் ஏறிச் சென்று அழிந்துபோகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயணக் கூட்டங்கள் வழிவிலகுகின்றன; அவை பாழ்வெளிக்குள் ஏறிச் சென்று மறைந்துபோகின்றன.’ எபிரெய உருவகம் கடினமானது; சிலர் இந்த வசனம் பாதைகள் அல்லது நீரோடைகளை அல்ல, பயணக் கூட்டங்களையே குறிக்கிறது என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: வளைந்து விலகுகின்றன
  rationale: Niphal வடிவம் வளைதல், சுருண்டு செல்லுதல் அல்லது வழிவிலகுதல் ஆகிய நுணுக்கங்களைத் தருகிறது. ஓடைகள் அல்லது அவற்றின் தடங்கள் எதிர்பார்த்த போக்கிலிருந்து வளைந்து விலகும் கடினமான உருவகத்தை இந்தச் சொற்றொடர் காக்கிறது.
- source_word: אָרְחוֹת
  choice: பாதைகள்
  rationale: இந்தப் பன்மைச் சொல் பொதுவாகப் பாதைகள் அல்லது தடங்கள் என்று பொருள்படும். பயணக் கூட்டங்களைக் குறிப்பதாகவும் கொள்ள முடியும்; ஆனால் முதன்மை உரையில் நேரடியான பாதை உருவகம் வைக்கப்பட்டுள்ளது.
- source_word: דַּרְכָּם
  choice: அவற்றின் போக்கு
  rationale: דֶּרֶךְ என்பதன் அடிப்படைப் பொருள் வழி. இங்கு ஓடைகள் அல்லது நீர்த்தடங்களின் நகர்வைச் சுட்டுவதால், ‘போக்கு’ என்பது இயல்பான தமிழில் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יַעֲלוּ
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் நேரடிப் பொருளான மேலே செல்லுதல் அல்லது ஏறுதல் பாதுகாக்கப்பட்டுள்ளது; கடினமான உருவகத்தை ‘மறைந்துபோகின்றன’ என்று விளக்கி மாற்றவில்லை.
- source_word: בַתֹּהוּ
  choice: பாழ்வெளிக்குள்
  rationale: תֹהוּ வெறுமை, பாழ்நிலை அல்லது பயனற்ற வனாந்தரத்தைக் குறிக்கலாம். பாலைவனச் சூழலுக்கு ஏற்ற இயல்பான தமிழாக ‘பாழ்வெளி’ தேர்ந்தெடுக்கப்பட்டது; בַ முன்னொட்டின் இயக்க நுணுக்கம் ‘-க்குள்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְיֹאבֵדוּ
  choice: அழிந்துபோகின்றன
  rationale: אבד என்பது அழிதல், தொலைந்துபோதல் அல்லது மறைந்துபோதல் என்று பொருள்படும். நீர் பாழ்வெளியில் காணாமற்போகும் உருவகத்தோடு, அதன் வலுவான அழிவு நுணுக்கத்தையும் இந்தத் தேர்வு காக்கிறது.
