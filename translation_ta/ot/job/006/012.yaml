source:
  edition: WLC
  text: אִם כֹּ֣חַ אֲבָנִ֣ים כֹּחִ֑/י אִֽם בְּשָׂרִ֥/י נָחֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: ta
  text: என் வலிமை கற்களின் வலிமையா? என் சதை வெண்கலமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உடல் வெண்கலமா?” எபிரேய மொழியில் சொல்லுக்கு சொல் “என் சதை” என்று உள்ளது; அது மனித உடலின் பலவீனத்துக்கும் உலோகத்தின் கடினத்தன்மைக்கும் இடையிலான வேறுபாட்டைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …ஆ?
  rationale: இங்கு אִם நிபந்தனையை அல்ல, எதிர்மறையான விடையை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது; தமிழில் கேள்வி விகுதி இயல்பாக அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: כֹּחַ / כֹּחִי
  choice: வலிமை / என் வலிமை
  rationale: தனிப்பட்ட உடல் தாங்குதிறனைச் சுட்டும் சூழலுக்கு ‘வலிமை’ இயல்பானது; எபிரேயச் சொல்லின் மீளுரைப்பையும் தமிழில் காக்கிறது.
- source_word: אֲבָנִים
  choice: கற்கள்
  rationale: பன்மை வடிவத்தையும் உறுதியான பொருளின் நேரடியான படிமத்தையும் காக்கிறது.
- source_word: בְּשָׂרִי
  choice: என் சதை
  rationale: சொல்லின் நேரடியான உடல்சார் பொருளைக் காத்து, உலோகத்தின் கடினத்தன்மைக்கு எதிராக மனித உடலின் மென்மையையும் பலவீனத்தையும் தெளிவாக்குகிறது.
- source_word: נָחוּשׁ
  choice: வெண்கலம்
  rationale: செம்பு அல்லது வெண்கலம் எனப் பொருள்படக்கூடிய சொல்; இங்கு கடினத்தன்மை மற்றும் நீடித்த தன்மையை உணர்த்தும் மரபான கவித்துவத் தேர்வாக ‘வெண்கலம்’ பொருந்துகிறது.
