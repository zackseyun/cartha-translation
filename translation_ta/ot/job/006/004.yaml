source:
  edition: WLC
  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: ta
  text: ஏனெனில், எல்லாம் வல்லவரின் அம்புகள் என்னுள் இருக்கின்றன[a]; என் ஆவி அவற்றின் நஞ்சைக் குடிக்கிறது[b]; கடவுளின் பேரச்சங்கள் எனக்கு எதிராக அணிவகுத்து நிற்கின்றன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு இருக்கின்றன.” எபிரெய முன்னிடைச்சொல்லின் நேரடியான பொருள் இவ்வாறு இருக்கலாம்; ஆனால் அம்புகளும் நஞ்சும் பற்றிய சூழல், அம்புகள் யோபுக்குள் பதிந்திருப்பதைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் நச்சை”; இச்சொல்லை இன்னும் கருத்தியல் முறையில் “அவற்றின் கோபத்தை” என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “எனக்கு எதிராகத் தங்களை ஒழுங்குபடுத்துகின்றன”; இது போருக்காகப் படைகள் அணிவகுக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனங்களில் யோபு வெளிப்படுத்திய புலம்பலுக்கான விளக்கத்தை இது அறிமுகப்படுத்துகிறது; எபிரெயச் சொல்லின் காரண அல்லது விளக்கத் தொடர்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: חִצֵּי שַׁדַּי
  choice: எல்லாம் வல்லவரின் அம்புகள்
  rationale: போர்ச் சித்திரத்தை நேரடியாகத் தக்கவைத்து, שַׁדַּי என்ற இறைப்பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான பொருளில் மொழிபெயர்க்கிறது.
- source_word: עִמָּדִי
  choice: என்னுள் இருக்கின்றன
  rationale: முன்னிடைச்சொல்லின் சொற்சார்ந்த பொருள் ‘என்னோடு’ என்றாலும், அம்புகளும் அவற்றின் நஞ்சும் குறித்த தொடர்ச்சியான உருவகம் அவை யோபின் உடலில் பதிந்திருப்பதைக் குறிப்பதாகத் தெரிகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֲמָתָם
  choice: அவற்றின் நஞ்சை
  rationale: חֵמָה என்பது ‘கோபம்’ என்றும் வரக்கூடும்; ஆனால் இங்கு அம்புகளுடன் இணைந்துள்ளதால் அவற்றின் நஞ்சு என்ற திடமான உருவகப் பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: שֹׁתָה רוּחִי
  choice: என் ஆவி ... குடிக்கிறது
  rationale: யோபின் உள்ளார்ந்த உயிர் நஞ்சை உட்கொள்வதுபோன்ற தீவிரமான உருவகத்தைத் தக்கவைக்கிறது; நிகழ்ந்துகொண்டிருக்கும் துன்பத்தை நிகழ்கால வினை வெளிப்படுத்துகிறது.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: கடவுளின் பேரச்சங்கள்
  rationale: பீதி உண்டாக்கும் பலவகை அச்சுறுத்தல்களைக் குறிக்கும் பன்மையைத் தக்கவைத்து, אֱלוֹהַּ என்பதை இயல்பாக ‘கடவுள்’ என மொழிபெயர்க்கிறது.
- source_word: יַעַרְכוּנִי
  choice: எனக்கு எதிராக அணிவகுத்து நிற்கின்றன
  rationale: போருக்காக ஒழுங்குபடுத்தி நிறுத்துதல் என்ற வினையின் இராணுவச் சித்திரத்தை வாசிக்க எளிதான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: שַׁדַּי மற்றும் אֱלוֹהַּ ஆகிய இரு இறைக் குறிப்புகளின் மொழிபெயர்ப்பு
  choice: שַׁדַּי என்பதை ‘எல்லாம் வல்லவர்’ என்றும் אֱלוֹהַּ என்பதை ‘கடவுள்’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: שַׁדַּי என்பதை ‘ஷத்தாய்’ என ஒலிபெயர்த்தல் அல்லது இரண்டையும் ஒரே இறைப் பெயரால் மொழிபெயர்த்தல்
  rationale: மூல வசனம் பயன்படுத்தும் இரு வேறுபட்ட இறைக் குறிப்புகளையும் சமப்படுத்தாமல் காக்கிறது; அதே நேரத்தில் சாதாரண தமிழ் வாசகருக்கு அவற்றின் பொருளைத் தெளிவாக்குகிறது.
- issue: חֲמָתָם என்பதன் சூழல்சார் பொருள்
  choice: அம்புகளின் ‘நஞ்சு’ என்று கொள்ளுதல்
  alternative: ‘அவற்றின் கோபம்’ அல்லது ‘அவருடைய கோபம்’ என்று கொள்ளுதல்
  rationale: அம்புகளையும் அவற்றை யோபின் ஆவி குடிப்பதையும் இணைக்கும் உடனடி உருவகத்திற்கு ‘நஞ்சு’ மிகவும் பொருந்துகிறது; ‘கோபம்’ என்ற மாற்றுப் பொருளை முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயினும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எல்லாம் வல்லவர்’, ‘ஆவி’, ‘அணிவகுத்து நிற்கின்றன’ ஆகிய சொற்கள் முறையே இறைப்பட்டம், உள்ளார்ந்த துன்பம், இராணுவ உருவகம் ஆகியவற்றைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
