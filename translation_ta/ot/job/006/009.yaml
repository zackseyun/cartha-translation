  text: that God would be willing to crush me[c][b][a], that he would let loose his hand and cut me off.
translation:
  language: ta
  text: கடவுள் என்னை நொறுக்க மனம்கொண்டால் எவ்வளவு நன்றாயிருக்கும்![a] அவர் தமது கையை விடுவித்து,[b] என்னை அறுத்துவிடுவாராக.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் என்னை நொறுக்க விரும்பினால் எவ்வளவு நன்றாயிருக்கும்!’ எபிரெய வினைச்சொல் விருப்பம் அல்லது இசைவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘தமது கையை விடுவித்து.’ தாக்குவதற்காகத் தம்மீது இருந்த கட்டுப்பாட்டை நீக்குவதைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘என்னைத் துண்டித்துவிடுவாராக’ அல்லது ‘என்னை முடித்துவிடுவாராக.’ எபிரெயச் சொல் தீர்மானமான, இறுதியான அழிவை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: மனங்கொண்டால் நலமே
  rationale: Hiphil வடிவம் விருப்பம் அல்லது இசைவைத் தெரிவிக்கிறது. யோபின் ஏக்கமுள்ள வேண்டுதலின் சூழலில், இந்தத் தமிழ் நடை அந்த விருப்ப நுணுக்கத்தையும் விருப்பவாக்கியத்தின் தொனியையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் இது கடவுளைக் குறிக்கும் பொதுவான ஒருமைச் சொல்; ஒலிபெயர்ப்பு தேவையில்லை.
- source_word: וִידַכְּאֵנִי
  choice: என்னை நொறுக்க
  rationale: דכא என்பதன் Piel வடிவம் நசுக்குதல் அல்லது முறித்தல் என்ற வலிமையான பொருளைக் கொண்டது. ‘நொறுக்க’ என்பது புலம்பலின் அழிவூட்டும் தீவிரத்தைத் தணிக்காமல் தெரிவிக்கிறது.
- source_word: יַתֵּר
  choice: கட்டவிழ்த்து
  rationale: נתר இங்கு விடுவித்தல் அல்லது கட்டுப்பாட்டை நீக்குதல் என்ற பொருளில் ‘கை’ என்பதோடு இணைகிறது. ‘கையைக் கட்டவிழ்த்து’ என்பது தாக்குவதற்காகத் தம்மைக் கட்டுப்படுத்துவதை நிறுத்தும் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יָדוֹ
  choice: தமது கை
  rationale: தெய்வீகச் செயலையும் ஆற்றலையும் குறிக்கும் எபிரெய மனித உருவக மொழியை நேரடியாகத் தக்கவைக்கிறது; மரியாதைத் தமிழுக்கேற்ப ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וִיבַצְּעֵנִי
  choice: என்னை அறுத்துப்போடட்டும்
  rationale: בצע என்பது அறுத்தல் அல்லது துண்டித்துப் பிரித்தல் என்ற கருத்தைத் தருகிறது. இங்கு யோபு மரணத்தை நாடும் சூழலில், ‘அறுத்துப்போடட்டும்’ அதன் தீர்மானமான இறுதித்தன்மையை வெளிப்படுத்துகிறது; அழிவின் துல்லியமான முறையை அதற்கு மேல் நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: கடவுளின் செயலைக் குறிக்கும் மனித உருவக மொழி
  choice: ‘தமது கை’ என்ற திடமான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தமது வல்லமை’ அல்லது ‘தமது தீர்ப்பு’ என்று கருத்தாக்குதல்
  rationale: எபிரெய உரை தெய்வீகச் செயற்பாட்டை உடல்சார்ந்த உருவகத்தின் மூலம் வெளிப்படுத்துகிறது. அதைத் தக்கவைப்பது யோபின் மன்றாட்டிலுள்ள உணர்ச்சி வலிமையைப் பாதுகாக்கிறது; கடவுளுக்கு மனித உடல் உண்டு என்று வலியுறுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபின் தீவிரமான ஏக்கத்தையும் கவித்துவமான கண்ணியத்தையும் தக்கவைக்கும் நடை. ‘நொறுக்க,’ ‘கையைக் கட்டவிழ்த்து,’ ‘அறுத்துப்போடட்டும்’ ஆகியவை மூலத்தின் வலிமையான உருவகங்களை மென்மைப்படுத்தாமல் தருகின்றன; கடவுளைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
