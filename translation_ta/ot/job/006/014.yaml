id: JOB.6.14
reference: Job 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לַ/מָּ֣ס מֵרֵעֵ֣/הוּ חָ֑סֶד וְ/יִרְאַ֖ת שַׁדַּ֣י יַעֲזֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: ta
  text: மனமுடைந்து போகிறவனுக்கு அவனுடைய நண்பனிடமிருந்து அன்பிரக்கம்[a] கிடைக்க வேண்டும்; அவன் சர்வவல்லவருக்குப் பயப்படுவதைக் கைவிட்டாலும் கூட.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அன்பிரக்கம்” என்பதற்கான எபிரெயச் சொல் חֶסֶד; இது உறுதியான அன்பு, இரக்கம், விசுவாசமான பற்றுறுதி ஆகிய பொருள்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனமுடைந்து போகிறவனுக்கு அன்பிரக்கத்தைக் காட்டாத நண்பன், சர்வவல்லவருக்குப் பயப்படுவதைக் கைவிடுகிறான்.” எபிரெய வாக்கிய அமைப்பு சுருக்கமாக இருப்பதால் இவ்வாறும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמָּס
  choice: மனமுடைந்து போகிறவனுக்கு
  rationale: மָס என்பதன் அடிப்படைப் பொருள் ‘உருகுதல்/கரைதல்’; இங்கு துன்பத்தால் உள்ளம் தளர்ந்து நம்பிக்கை இழக்கும் ஒருவரைக் குறிக்கும் உருவகம். நவீனத் தமிழில் ‘மனமுடைந்து போகிறவன்’ இந்த உணர்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵרֵעֵהוּ
  choice: அவனுடைய நண்பனிடமிருந்து
  rationale: מִן மூலத்தையும் רֵעַ நண்பன் அல்லது தோழன் என்ற உறவையும், 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டையும் வெளிப்படுத்துகிறது.
- source_word: חָסֶד
  choice: அன்பிரக்கம்
  rationale: மனித உறவுச் சூழலில் חֶסֶד என்பது இரக்கத்துடன் வெளிப்படும் உறுதியான அன்பையும் விசுவாசமான பற்றுறுதியையும் குறிக்கிறது. ‘அன்பிரக்கம்’ அன்பு மற்றும் இரக்கம் ஆகிய இரு கூறுகளையும் சுருக்கமாகத் தருகிறது; விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִרְאַת שַׁדַּי
  choice: சர்வவல்லவருக்குப் பயப்படுவது
  rationale: יִרְאָה என்பது தேவனை நோக்கிய பயபக்தி அல்லது அச்சம்கலந்த மரியாதையைக் குறிக்கும் வழக்கமான வேதாகமச் சொல். ‘பயப்படுவது’ மூலமொழியின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יַעֲזֹב
  choice: கைவிட்டாலும்
  rationale: עזב என்பதற்கு ‘விடுதல், கைவிடுதல்’ என்று பொருள். தேர்ந்தெடுக்கப்பட்ட தொடரியல் வாசிப்பில் இறுதி வாக்கியம் விட்டுக்கொடுப்பு பொருளில் அமைவதால் ‘கைவிட்டாலும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் வரும் שַׁדַּי என்ற தெய்வீகப் பட்டத்திற்கு நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க வழக்கமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: இறுதி வாக்கியத்தின் தொடரியல் தொடர்பு
  choice: மனமுடைந்தவர் சர்வவல்லவருக்குப் பயப்படுவதைக் கைவிட்டாலும், நண்பனிடமிருந்து அன்பிரக்கம் அவருக்குக் கிடைக்க வேண்டும்.
  alternative: மனமுடைந்தவருக்கு அன்பிரக்கத்தைக் காட்டத் தவறும் நண்பன் சர்வவல்லவருக்குப் பயப்படுவதைக் கைவிடுகிறான்.
  rationale: எபிரெய தொடரியல் மிகவும் சுருக்கமாக இருப்பதால் இரு வாசிப்புகளும் சாத்தியம். தேர்ந்தெடுக்கப்பட்ட வாசிப்பு, துன்புறும் ஒருவருக்குத் தன் நண்பர்கள் உண்மையான ஆதரவு தரவில்லை என்று யோபு கண்டிக்கும் உடனடிச் சூழலோடு நன்றாகப் பொருந்துகிறது. முக்கியமான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சர்வவல்லவர்’ தெய்வீகப் பட்டமாகவும், ‘பயப்படுவது’ வேதாகமத்தின் பயபக்தி சார்ந்த அழுத்தத்தைப் பாதுகாக்கவும் பயன்படுத்தப்பட்டுள்ளது.
