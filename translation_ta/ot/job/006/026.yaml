source:
  edition: WLC
  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: ta
  text: வார்த்தைகளைக் கண்டிக்க நினைக்கிறீர்களா? நம்பிக்கையிழந்த ஒருவனின் சொற்கள் காற்றில் பறந்துபோகும் சொற்களே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையிழந்த ஒருவனின் சொற்களைக் காற்றில் பறந்துபோகும் சொற்களாகக் கருதி, வெறும் வார்த்தைகளைக் கண்டிக்க நினைக்கிறீர்களா?” இரண்டாம் அரையடியைத் தனிக் கூற்றாகவும், அல்லது ‘கண்டிக்க’ என்பதன் பொருளின் ஒரு பகுதியாகவும் எபிரெய தொடரமைப்பு புரிந்துகொள்ள இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: கண்டிக்கவா
  rationale: יכח என்பதன் மதிப்பிட்டு எதிர்க்கும் வலிமையைத் தக்கவைத்து, இச்சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: מִלִּים
  choice: வார்த்தைகளை
  rationale: மூலத்தின் சுருக்கத்தையும் நேரடியான பொருளையும் காக்கிறது; ‘வெறும் வார்த்தைகள்’ எனப் பொருளை மிகைப்படுத்தவில்லை.
- source_word: תַּחְשֹׁבוּ
  choice: நினைக்கிறீர்கள்
  rationale: חשב என்பதன் ‘நினைத்தல்/திட்டமிடுதல்’ பொருளை, வினாவாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: காற்றுக்குரியவையா
  rationale: רוּחַ என்பதன் ‘காற்று’ உருவகத்தைப் பாதுகாக்கிறது; לְ குறிக்கும் தொடர்பு அல்லது விளைவைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אִמְרֵ֥י נֹאָֽשׁ
  choice: நம்பிக்கையிழந்தவனின் சொற்கள்
  rationale: נֹאָשׁ என்பதன் நம்பிக்கை இழந்த நிலையையும், ஒருமை நபர்ச் சுட்டையும் காக்கிறது; אמרי என்பதற்கு இயல்பான ‘சொற்கள்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: இரண்டாம் அரையடியின் இலக்கணத் தொடர்பு
  choice: ‘நம்பிக்கையிழந்தவனின் சொற்கள் காற்றுக்குரியவையா?’ என்ற இணை வினாவாக அமைத்தல்
  alternative: ‘நம்பிக்கையிழந்தவனின் சொற்களைக் காற்றெனக் கருதி, வெறும் வார்த்தைகளைக் கண்டிக்க நினைக்கிறீர்களா?’ என முழுவதையும் ஒரே வினாவின் பொருளாக அமைத்தல்
  rationale: எபிரெய இலக்கணம் இரு தொடர்புகளையும் அனுமதிக்கிறது. முதன்மை உரை முதல் அரையடியின் வினாத் தொனியை இரண்டாம் அரையடியிலும் தொடரச் செய்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் கூர்மையான வினாவையும் ‘காற்று’ என்ற மூல உருவகத்தையும் காக்கும் கண்ணியமான, பொதுவாசகருக்கு எளிய நடை. ‘வார்த்தைகள்/சொற்கள்’ என்ற சிறிய மாறுபாடு தமிழில் இயல்பான ஒலிநயத்திற்காகப் பயன்படுத்தப்பட்டுள்ளது.
