  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: ta
  text: புல் முன் இருக்கும்போது காட்டுக் கழுதை[a] கத்துமா? அல்லது தன் கலந்த தீவனம்[b] முன் இருக்கும்போது எருது முக்காரமிடுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் காட்டுக் கழுதையைக், குறிப்பாக ஒனேகர் இனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கலந்த தீவனம்’ என்பதற்கான எபிரெயச் சொல், கால்நடைகளுக்காகக் கலந்து தயாரிக்கப்படும் தீவனம் அல்லது கூழைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽנְהַק
  choice: கத்துமா
  rationale: נהק என்பது கழுதை எழுப்பும் தனித்த குரலைக் குறிக்கிறது. தமிழில் கழுதையைப் பற்றிய சூழலில் ‘கத்து’ என்பது இயல்பாகவும் பொதுவாகப் புரியும்படியும் உள்ளது.
- source_word: פֶּרֶא
  choice: காட்டுக் கழுதை
  rationale: פֶּרֶא என்பது காட்டில் வாழும் கழுதை இனத்தை, அதாவது onager-ஐக் குறிக்கிறது. ‘காட்டுக் கழுதை’ துல்லியமும் தெளிவும் உடைய நவீனத் தமிழ் வழக்கு.
- source_word: עֲלֵי דֶשֶׁא
  choice: புல் கிடைக்கும்போது
  rationale: சொற்றொடர் சொற்படியாக ‘புல்லின்மேல்/புல்லருகே’ என்ற படிமத்தைக் கொண்டிருந்தாலும், இங்கே உணவு கிடைத்திருக்கும் சூழ்நிலையையே குறிக்கிறது. தமிழில் தவறான இடவியல் பொருள் தோன்றாமல் வினாவின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இணையான இரு வினாக்களில் אִם இரண்டாவது மாற்றை அறிமுகப்படுத்துவதால், தமிழில் ‘அல்லது’ பொருத்தமானது.
- source_word: יִגְעֶה
  choice: முக்காரமிடுமா
  rationale: געה என்பது மாட்டினம் எழுப்பும் தாழ்ந்த முழக்கத்தைக் குறிக்கிறது. ‘முக்காரமிடு’ என்பது எருதின் குரலைத் துல்லியமாக வேறுபடுத்திக் காட்டுகிறது.
- source_word: שׁוֹר
  choice: எருது
  rationale: שׁוֹר என்பது ஒருமையில் மாட்டின விலங்கை, இச்சூழலில் எருதைக் குறிக்கிறது. இணைநடை வினாவுக்கு ‘எருது’ இயல்பாகப் பொருந்துகிறது.
- source_word: עַל בְּלִילֽ/וֹ
  choice: தன் கலப்புத் தீவனம் இருக்கும்போது
  rationale: בְּלִיל என்பது கலந்து தயாரிக்கப்பட்ட கால்நடைத் தீவனம் அல்லது கூழைக் குறிக்கிறது; இணைந்துள்ள பின்னொட்டு ‘தன்’ என்று எடுத்துரைக்கப்படுகிறது. உணவு முன்னிலையில் இருக்கும் சூழலைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
