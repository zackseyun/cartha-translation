translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்துக்கேற்ற கண்ணியமான கேள்விநடை பயன்படுத்தப்பட்டுள்ளது. இரு விலங்குகளின் குரல்களையும் வேறுபடுத்த ‘கத்து’ மற்றும் ‘முக்காரமிடு’ தேர்ந்தெடுக்கப்பட்டுள்ளன; עַל என்ற முன்னிடைச்சொல்லின் சொற்படியான இடவியல் வடிவத்தைவிட, இவ்விடத்தின் கருத்தான உணவு கிடைத்திருக்கும் சூழல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
