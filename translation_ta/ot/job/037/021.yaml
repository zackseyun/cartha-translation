translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் யோபு நூலின் கவித்துவ மரியாதையைத் தக்கவைக்கும் நடை. ‘வானங்களில்’ என்ற பன்மை மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது. ‘அவர்கள்’ என்பதற்கான வெளிப்படையான முன்னிலை இல்லாத மூலத்தின் பதற்றமும், ‘அவற்றை’ என்பதன் சுட்டுப்பொருள் தெளிவின்மையும் தேவையின்றித் தீர்க்கப்படவில்லை.
