  text: וְ/עַתָּ֤ה לֹ֘א רָ֤אוּ א֗וֹר בָּהִ֣יר ה֭וּא בַּ/שְּׁחָקִ֑ים וְ/ר֥וּחַ עָ֝בְרָ֗ה וַֽ/תְּטַהֲרֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: ta
  text: இப்போதோ, வானங்களில் ஒளி பிரகாசமாய் இருந்தும், அதை அவர்கள் காண்பதில்லை[a]; ஆனால் காற்று கடந்து சென்று அவற்றைத் தெளிவாக்குகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானங்களில் பிரகாசமாய் இருக்கும் ஒளியை அவர்கள் காணவில்லை” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத் தொடர் சுருக்கமானது; ஆகவே, “இருந்தும்” என்ற பொருளைச் சேர்க்காமலும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெய வினைச்சொல்லில் இணைந்துள்ள பொருள்-பின்னொட்டு பன்மையானது; அது வானங்களையோ மேகங்களையோ குறிக்கலாம். சிலர் இதைப் பொதுவாக “வானத்தைத் தெளிவாக்குகிறது” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: காலத்தையும் உரையாடலின் திருப்பத்தையும் இயல்பான தமிழில் காட்டுகிறது; וְ இணைப்பின் நுணுக்கமும் விடப்படவில்லை.
- source_word: לֹא רָאוּ
  choice: அதை அவர்கள் காண்பதில்லை
  rationale: Qal perfect 3cp இங்கு நடப்பு அல்லது பொதுநிலைச் சொல்லாக அமையலாம். தமிழில் நிகழ்கால எதிர்மறை வடிவம் தற்போதைய வானிலைச் சூழலுக்குப் பொருந்துகிறது; வெளிப்படையான கர்த்தா இல்லாத எபிரெய அமைப்பின் பன்மையும் காக்கப்படுகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: மூலம் பொதுவாக ‘ஒளி’ என்றே கூறுகிறது; ‘சூரியஒளி’ என்று பொருளைக் குறுக்காமல் வைத்திருக்கிறது.
- source_word: בָּהִיר הוּא
  choice: பிரகாசமாய் இருந்தும்
  rationale: ஒளி வானங்களில் பிரகாசமாக உள்ளது, ஆயினும் காணப்படவில்லை என்ற சாத்தியமான விட்டுக்கொடுப்பு உறவை இயல்பான தமிழில் தருகிறது; குறுகிய எபிரெய தொடரின் வேறு வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בַּשְּׁחָקִים
  choice: வானங்களில்
  rationale: שׁחקים என்பதன் பன்மையையும் அதன் கவித்துவமான ‘வானங்கள்/மேகமண்டலங்கள்’ பொருள் வரம்பையும் முடிந்தவரை காக்கிறது.
- source_word: וְרוּחַ
  choice: ஆனால் காற்று
  rationale: இங்கு רוּחַ வானிலை சார்ந்த காற்றைக் குறிக்கிறது. அடுத்த நிகழ்வு நிலையை மாற்றுவதால் וְ என்பதன் எதிர்மறை இணைப்பு நுணுக்கத்தை ‘ஆனால்’ வெளிப்படுத்துகிறது; தமிழில் பொதுப்பெயர் கட்டாயமின்றி இயல்பாக நிற்கிறது.
- source_word: עָבְרָה
  choice: கடந்து சென்று
  rationale: வானப்பரப்பினூடாகக் காற்று நகர்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַתְּטַהֲרֵם
  choice: அவற்றைத் தெளிவாக்குகிறது
  rationale: טהר என்பதன் இச்சூழல் பொருள் ‘தூய்மையாக்குதல்/தெளிவாக்குதல்’; 3mp பின்னொட்டின் பன்மையை ‘அவற்றை’ காக்கிறது, ஆனால் அதன் முன்னிலைச் சுட்டு எது என்பதைக் குறிப்பில் விளக்குகிறது.
