- from: ஏனெனில், அவர் பனியை நோக்கி, “பூமியில் இரு”[a] என்றும், மழையை நோக்கி, “மழைப்பொழிவாகு” என்றும், பெருமழைகளை நோக்கி, “அவருடைய வல்லமையின் பெருமழையாகுங்கள்”[b] என்றும் சொல்கிறார்.
