  edition: WLC
  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: ta
  text: ஏனெனில், அவர் பனியிடம், “பூமியில் இரு”[a] என்றும், மழையிடம், “மழையாகப் பொழி” என்றும், அவரது வல்லமையின் பெருமழைகளிடம், “பொழியுங்கள்”[b] என்றும் சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமிக்கு வா.” இங்கு பனி பூமியில் தோன்றவோ படிந்திருக்கவோ கட்டளையிடப்படுவதாகப் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிச் சொற்றொடரை, “அவரது வல்லமையின் கனமழைகள்” அல்லது “வல்லமையான மழை வெள்ளங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானதும் கவிதைத் தன்மையுடையதும் ஆகும். “அவரது” என்பது கடவுளைக் குறிப்பதாக இங்கு கொள்ளப்பட்டுள்ளது; “அதன் வலிமை” என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கடவுள் வானிலையை ஆளுவதை விளக்கும் காரண/விளக்கத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לַשֶּׁלַג
  choice: பனியை நோக்கி
  rationale: ל + אמר அமைப்பில் பேச்சின் முகவரியைச் சுட்டுகிறது; பனி நேரடியாக அழைக்கப்படும் கவிதை ஆளுருவாக்கத்தையும் காக்கிறது.
- source_word: יֹאמַר
  choice: சொல்கிறார்
  rationale: கவிதை விளக்கத்தில் எபிரெய வினையின் நிகழ்காலத் தன்மையைப் பாதுகாக்கிறது; கட்டளையின் வலிமை மேற்கோளிலுள்ள ஏவலால் வெளிப்படுகிறது.
- source_word: הֱוֵא אָרֶץ
  choice: பூமியில் இரு
  rationale: הֱוֵא என்பதன் அடிப்படைப் பொருளான ‘இரு/ஆகு’ என்பதையும் אָרֶץ உடன் உள்ள சுருக்கமான கவிதை அமைப்பையும் காக்கிறது; பனி தரையில் தோன்றுதல் அல்லது படிந்திருத்தல் என்ற பொருள் சூழலில் கிடைக்கிறது.
- source_word: וְגֶשֶׁם מָטָר
  choice: மழையை நோக்கி, “மழைப்பொழிவாகு”
  rationale: גֶשֶׁם மற்றும் מָטָר என்ற அருகிய பொருளுள்ள இரு சொற்களின் கவிதை நிறைவை, தமிழில் இயல்பான பெயர்–கட்டளை அமைப்பால் வேறுபடுத்துகிறது.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: பெருமழைகளை நோக்கி, “அவருடைய வல்லமையின் பெருமழையாகுங்கள்”
  rationale: מִטְרוֹת என்ற பன்மை தீவிரமான அல்லது திரண்ட மழையை உணர்த்துகிறது; எபிரெயத்தின் சுருக்கமான இணைநிலையை தொடரும் கட்டளையாக வழங்குகிறது.
- source_word: עֻזּוֹ
  choice: அவருடைய வல்லமை
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு, உடனடி சூழலில் வானிலையிடம் பேசும் கடவுளையே இயல்பாகக் குறிக்கிறது; ‘வல்லமை’ உரையின் உயர்ந்த கவிதை நடைக்கு ஏற்றது.
theological_decisions:
- issue: עֻזּוֹ என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவருடைய வல்லமை’—சுட்டுப்பெயர் கடவுளைக் குறிக்கிறது.
  alternative: ‘அதன் வலிமை’—சுட்டுப்பெயர் மழையைக் குறிக்கலாம்.
  rationale: உடனடி சூழலில் கடவுளே பனிக்கும் மழைக்கும் கட்டளையிட்டு படைப்பை ஆளுபவர். ஆகவே கடவுளைக் குறிப்பதே ஓட்டத்துக்கு மிகவும் பொருந்துகிறது; எனினும் இலக்கண ரீதியான மாற்று சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. பனி மற்றும் மழை நேரடியாக அழைக்கப்படும் ஆளுருவாக்கம் காக்கப்பட்டுள்ளது. எபிரெயத்தின் மூன்று மழைச் சொற்றொடர்களையும் ஒற்றைப்படுத்தாமல், ‘மழை / மழைப்பொழிவு / பெருமழைகள்’ என வேறுபடுத்தியுள்ளோம்; இறுதி பகுதியின் சுருக்கமும் பொருள் இருமையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
