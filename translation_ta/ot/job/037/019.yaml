  text: ה֭וֹדִיעֵ/נוּ מַה נֹּ֣אמַר ל֑/וֹ לֹ֥א נַ֝עֲרֹ֗ךְ מִ/פְּנֵי חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: ta
  text: அவரிடம் நாம் என்ன சொல்ல வேண்டும் என்பதை எங்களுக்குத் தெரிவியுங்கள்; இருளின் காரணமாக எங்கள் சொற்களை ஒழுங்குபடுத்த எங்களால் முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் சொற்களை எடுத்துரைக்க” அல்லது “எங்கள் வழக்கை ஒழுங்காக முன்வைக்க.” “இருள்” என்பது மனித அறியாமை அல்லது இயலாமையை உருவகமாகக் குறிக்கலாம்; நேரடியான இருளும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: எங்களுக்குத் தெரியப்படுத்தும்
  rationale: ידע என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘அறியச் செய்/தெரியப்படுத்து’ என்று பொருள்படும். மூலத்தின் காரணவினைப் பொருளை நேரடியாகப் பேணுகிறது.
- source_word: מַה נֹּאמַר לוֹ
  choice: அவரிடம் என்ன சொல்ல வேண்டும் என்பதை
  rationale: இது கட்டளை வினையின் நேரடிச் செயப்படுபொருள். இச்சூழலில் உள்ள ஆலோசனை/தயக்க நுணுக்கத்தை ‘என்ன சொல்ல வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא נַעֲרֹךְ
  choice: எங்கள் சொற்களை ஒழுங்குபடுத்த எங்களால் முடியவில்லை
  rationale: ערך என்பதன் அடிப்படைப் பொருள் ‘வரிசைப்படுத்து, ஒழுங்குபடுத்து.’ எபிரெயத்தில் வெளிப்படையாக இல்லாத நீதிமன்றப் ‘வழக்கை’ உரையில் சேர்க்காமல், பேச்சைச் செம்மையாக அமைக்க இயலாமை என்ற சூழற்பொருளைப் பேணுகிறது.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: இருளின் காரணமாக
  rationale: מִפְּנֵי இங்கு ‘காரணமாக’ என இயல்பாகப் பொருள்படும். חֹשֶׁךְ என்பதன் நேரடி உருவகத்தைப் பேணுவதால், அது அறியாமையா, மனித இயலாமையா, நேரடியான இருளா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இறுதித் தொடரிலுள்ள ‘இருள்’ என்பதன் பொருள்
  choice: ‘இருள்’ என்ற விரிந்த, சுருக்கமான உருவகத்தையே வைத்தல்
  alternative: ‘அறியாமையின் காரணமாக’ அல்லது ‘இருட்டாக இருப்பதால்’ என்று விளக்குதல்
  rationale: கவிதை மனிதரின் அறியாமை அல்லது கடவுள்முன் பேச இயலாமையைக் குறிக்கக்கூடும்; எனினும் மூல எபிரெயம் இதைத் தீர்மானிக்காமல் விடுவதால் அதே இறுக்கமும் பல்பொருள் வாய்ப்பும் பேணப்படுகிறது.
- issue: נַעֲרֹךְ என்பதற்கு நீதிமன்றப் பொருள் உண்டா என்பது
  choice: ‘எங்கள் சொற்களை ஒழுங்குபடுத்த’
  alternative: ‘எங்கள் வழக்கை முன்வைக்க’
  rationale: சூழலில் வழக்கை முன்வைக்கும் நிழற்பொருள் சாத்தியம். ஆனால் பெயர்ச்சொல்லாக ‘சொற்கள்’ அல்லது ‘வழக்கு’ எபிரெயத்தில் இல்லை; தமிழில் புரியும்படி ‘சொற்களை’ சேர்த்து, அதிகமான நீதிமன்ற விளக்கத்தை முதன்மை உரையில் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் மரியாதையும் கவிதைத் தன்மையும் கொண்ட நடை. ‘தெரியப்படுத்தும்’ என்பது கட்டளை வடிவமாகவும், ‘ஒழுங்குபடுத்த’ என்பது மூல வினையின் அடிப்படை உருவகத்தைப் பேணுவதாகவும் அமைந்துள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
