  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: ta
  text: மேகங்கள் எவ்வாறு தொங்குகின்றன[a] என்பதையும், அறிவில் பூரணமானவரின் அதிசயங்களையும் நீ அறிவாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேகங்கள் எவ்வாறு விரிந்து பரவுகின்றன.’ எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியில்லை. அது மேகங்கள் வானில் விரிந்து பரவுவதையோ தொங்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: நீ அறிவாயா?
  rationale: கேள்விக்குறியுடன் வரும் ידע வினைச்சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, யோபை நோக்கிய வினாவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: என்பதையும்
  rationale: இங்கு அறிவின் பொருளை அறிமுகப்படுத்தும் עַל என்பதைக் கடினமான சொல்லுக்குச் சொல் அமைப்பாக அல்லாமல், தமிழில் இயல்பான பொருள்-இணைப்பாக வழங்குகிறது.
- source_word: מִפְלְשֵׂי עָב
  choice: மேகங்கள் எவ்வாறு சமநிலையில் நிற்கின்றன
  rationale: அரிதான מִפְלְשֵׂי என்ற சொல்லின் துல்லிய நுண்பொருள் உறுதியற்றது. வானில் மேகங்கள் நிலைபெற்று அல்லது தொங்குவதைக் குறிக்கும் பாரம்பரியப் புரிதலை வாசிக்க எளிதாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִפְלְאוֹת
  choice: வியத்தகு செயல்கள்
  rationale: படைப்பிலும் வானிலையிலும் வெளிப்படும் அசாதாரணமான செயல்களைச் சுட்டும் சொல்லாக, தமிழில் இயல்பாகவும் உயர்வான நடையிலும் உள்ளது.
- source_word: תְּמִים
  choice: நிறைவான
  rationale: இங்கு ஒழுக்கக் குற்றமின்மையை மட்டும் அல்லாமல் முழுமையையும் பூரணத்தையும் குறிக்கிறது; ‘நிறைவான’ என்பது அந்த நுண்பொருளை இயல்பாகத் தருகிறது.
- source_word: דֵּעִים
  choice: அறிவில்
  rationale: எபிரெய வடிவின் பன்மை அறிவின் முழுமை அல்லது மிகுதியைக் குறிக்கலாம்; தமிழில் ஒருமை அருவப்பெயரான ‘அறிவு’ இயல்பானது.
theological_decisions:
- issue: ‘அறிவில் நிறைவானவர்’ என்பதன் சுட்டுப்பொருள்
  choice: சூழலில் கடவுளைக் குறிக்கிறது; ஆனால் பெயரை வசனத்தில் சேர்க்காமல் மறைமுக வடிவம் தக்கவைக்கப்பட்டது.
  alternative: பொதுவான ஞானி அல்லது எலிகூ தன்னையே மறைமுகமாகக் குறிப்பிடுதல்
  rationale: வானிலையையும் படைப்பையும் கடவுள் ஆளுவது பற்றிய எலிகூவின் உரையில் இச்சொற்றொடர் இயல்பாகக் கடவுளையே குறிக்கிறது. எனினும் எபிரெய மூலத்தில் ‘கடவுள்’ என்று வெளிப்படையாக இல்லாததால், மொழிபெயர்ப்பு அந்த மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான வினா வடிவம் பயன்படுத்தப்பட்டது. அரிதான வானிலைச் சொல்லின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; கடவுள் என்ற சுட்டுப்பொருள் உரைக்குள் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
