  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: ta
  text: அது அவருடைய வழிநடத்துதலால் சுற்றிச் சுற்றித் திசைமாறுகிறது[a][b], அவர் அவற்றுக்குக் கட்டளையிடும் அனைத்தையும் அவை மக்கள் வாழும் உலகத்தின் மேற்பரப்பெங்கும்[c] செய்வதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுற்றுகளாக” அல்லது “சுற்றிச் சுற்றி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்கள் மீண்டும் மீண்டும் சுற்றித் திசைமாறும் இயக்கத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “அவர் செலுத்துகிறபடி” அல்லது “அவருடைய இயக்குதலின்படி” என்றும் மொழிபெயர்க்கலாம்; மூலச்சொல் திறமையான வழிநடத்துதலையோ கட்டுப்பாட்டையோ உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “மக்கள் வாழும் உலகம், பூமியை நோக்கி/நிலத்தை நோக்கி” என்ற அடுக்கான சொற்றொடர் உள்ளது; இது நிலவுலகைப் பற்றிய வலியுறுத்தலைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அது
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையாக இருந்தாலும், சுற்றியுள்ள வசனங்களில் கடவுளால் இயக்கப்படும் மேகம் அல்லது புயல் நிகழ்வைக் குறிக்கிறது. அதன் துல்லியமான இயற்கை நிகழ்வை வரையறுக்காமல் இருக்க நடுநிலை ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: சுற்றுச் சுற்றாகத் திரும்புகிறது
  rationale: முதல் சொல் சுற்றுகளாக நிகழும் இயக்கத்தையும், இரண்டாவது சொல் திரும்புதல் அல்லது திசைமாறுதலையும் குறிக்கிறது. இரண்டின் கூட்டு உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: அவருடைய வழிநடத்துதலின்படி
  rationale: இந்தச் சொல் திறமையாகச் செலுத்துதல், வழிநடத்துதல், கட்டுப்படுத்துதல் ஆகிய நுண்பொருள்களைக் கொண்டது. வானிலை நிகழ்வின் மீது கடவுளுடைய நோக்கமுள்ள இயக்குதலை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפָעֳלָם
  choice: அவை செய்வதற்காக
  rationale: வினைபெயருடன் உள்ள பன்மை விகுதி, கட்டளையிடப்பட்டவற்றை அந்த இயற்கைச் செயலிகள் நிறைவேற்றுவதே நோக்கம் என்பதைச் சுட்டுகிறது.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: அவர் அவற்றுக்குக் கட்டளையிடுகிற அனைத்தையும்
  rationale: צוה என்பதன் இயல்பான பொருள் ‘கட்டளையிடுதல்’; அதன் பன்மைச் செயப்படுபொருளை ‘அவற்றுக்கு’ என்று வெளிப்படையாகக் காட்டுகிறது.
- source_word: עַל־פְּנֵי
  choice: பரப்பெங்கும்
  rationale: ‘முகத்தின் மீது’ என்ற எபிரெய இடவியல் மரபுத்தொடர் இங்கு விரிந்த நிலப்பரப்பின் முழு அளவையும் குறிக்கிறது; நவீன தமிழில் ‘பரப்பெங்கும்’ இயல்பாக உள்ளது.
- source_word: תֵבֵל אָרְצָה
  choice: பூமியிலுள்ள மக்கள் வாழும் உலகம்
  rationale: תֵבֵל என்பது குறிப்பாக மக்கள் வாழும் உலகைக் குறிக்கலாம்; אָרְצָה பூமி அல்லது நிலத்தை நோக்கிய நிலவுலகச் சூழலை வலியுறுத்துகிறது. மூலத்தின் அடுக்கான சொல்லாட்சியை அளவோடு தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமைச் சுட்டுப்பெயர் குறிக்கும் வானிலை நிகழ்வு
  choice: மேகம், புயல் அல்லது தொடர்புடைய வானிலை நிகழ்வு எனப் பொதுவாக விடப்பட்டது
  alternative: ஒரு குறிப்பிட்ட மேகக்கூட்டம் அல்லது மின்னல் அமைப்பு
  rationale: உடனடிச் சூழல் மேகங்கள், மின்னல், புயல் ஆகியவற்றைப் பேசுகிறது; ஆனால் இவ்வசனம் ஒன்றைத் துல்லியமாக அடையாளப்படுத்தவில்லை. எனவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டது.
- issue: கடவுளின் வழிநடத்துதலும் வானிலை நிகழ்வுகளின் செயலும்
  choice: கடவுள் கட்டளையிட, அவை அதைச் செய்கின்றன
  alternative: இயற்கை நிகழ்வு தனித்துச் செயல்படுகிறது அல்லது ‘வழிநடத்துதல்’ வெறும் ஆலோசனையாகும்
  rationale: בְּתַחְבֻּלֹתוֹ மற்றும் יְצַוֵּם ஆகியவை நோக்கமுள்ள தெய்வீக இயக்கத்தையும் கட்டளையையும் காட்டுகின்றன; அதற்கு அப்பாற்பட்ட அறிவியல் அல்லது சமயக்கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் கவிதைநடையின் கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘அது’ என்பதிலிருந்து ‘அவை’ என்பதற்கான மாறுதல் எபிரெய மூலத்திலேயே உள்ள ஒருமை–பன்மை மாற்றத்தைப் பாதுகாக்கிறது. கடவுளைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
