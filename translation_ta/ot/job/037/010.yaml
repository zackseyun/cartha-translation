source:
  edition: WLC
  text: מִ/נִּשְׁמַת אֵ֥ל יִתֶּן קָ֑רַח וְ/רֹ֖חַב מַ֣יִם בְּ/מוּצָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: ta
  text: தேவனுடைய மூச்சினால் பனிக்கட்டி உண்டாகிறது[a]; நீரின் பரந்த பரப்பும் உறைந்து திடமாகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய மூச்சிலிருந்து பனிக்கட்டி உண்டாகிறது.” எபிரெய முன்னொட்டு மூலம் (“மூச்சிலிருந்து”) அல்லது கருவி (“மூச்சினால்”) என்ற பொருளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீரின் அகலம் உறைந்து திடமாகிறது” அல்லது “கெட்டியாகிறது.” எபிரெயச் சொற்றொடர் கவித்துவமானது; நீரின் விரிந்த மேற்பரப்பு திடமாவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: மூச்சிலிருந்து
  rationale: נִשְׁמָה என்பதன் நேரடியான உருவகமான ‘மூச்சு’ என்பதைக் காக்கிறது. முன்னொட்டு מִן இங்கு மூலத்தையோ கருவியையோ குறிக்கக்கூடும்; முதன்மை உரை மூலப்பொருளை முன்னிறுத்துகிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: இது பொதுவான இறைப்பட்டம்; உடனடி சூழல் ‘சர்வவல்லவர்’ போன்ற விரிவாக்கத்தை வேண்டவில்லை.
- source_word: יִתֶּן
  choice: உண்டாகிறது
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுக்கிறது/கொடுக்கப்படுகிறது.’ ஆனால் ‘பனிக்கட்டி கொடுக்கப்படுகிறது’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால், தேவனுடைய மூச்சினால் பனிக்கட்டி தோன்றும் கருத்தை இயல்பாகச் சொல்ல ‘உண்டாகிறது’ என வழங்கப்பட்டுள்ளது.
- source_word: קָרַח
  choice: பனிக்கட்டி
  rationale: இச்சொல் மென்பனியைவிட உறைந்த நீரான பனிக்கட்டியைக் குறிக்கிறது; அடுத்த அடியில் நீர் கெட்டியாவதோடு இது பொருந்துகிறது.
- source_word: וְרֹחַב מַיִם
  choice: நீரின் பரந்த பரப்பும்
  rationale: רֹחַב என்பது அகலம் அல்லது பரந்த விரிவைக் குறிக்கும். நீரைப் பற்றிய இச்சூழலில் அதன் விரிந்த பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது; וְ இணைப்பின் தொடர்ச்சியை ‘-உம்’ காக்கிறது.
- source_word: בְּמוּצָק
  choice: உறைந்து கெட்டியாகிறது
  rationale: מוּצָק வார்க்கப்பட்டு உறுதியானது, கடினமானது என்ற படிமத்தைக் கொண்டுள்ளது. வானிலைச் சூழலில் நீர் உறைந்து திடமாவதைக் தெளிவாகவும் கவித்துவத்திற்கு ஏற்றவாறும் தெரிவிக்கிறது.
