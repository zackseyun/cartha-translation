  text: מִן הַ֭/חֶדֶר תָּב֣וֹא סוּפָ֑ה וּֽ/מִ/מְּזָרִ֥ים קָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: ta
  text: அறையிலிருந்து புயல் வருகிறது[a]; சிதறடிக்கும் காற்றுகளிலிருந்து குளிர் வருகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்கிலிருந்து புயல் வருகிறது.” எபிரெயில் நேர்ப்பொருளாக “அறையிலிருந்து” என்று உள்ளது; இது தெற்குத் திசைப்பகுதியையோ மறைவான களஞ்சியத்தையோ கவித்துவமாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வடக்கிலிருந்து குளிர் வருகிறது,” அல்லது “சிதறடிப்பவற்றிலிருந்து குளிர் வருகிறது.” இங்குள்ள எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியற்றது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: அறையிலிருந்து
  rationale: חֶדֶר என்பதன் நேர்ப்பொருள் ‘அறை’ அல்லது ‘உள்ளறை’. இங்கு அது புயல் புறப்படும் மறைவிடத்தை அல்லது திசைப்பகுதியைக் கவித்துவமாகக் குறிக்கலாம். எபிரெயச் சொல்லிலேயே ‘தெற்கு’ என்பது வெளிப்படையாக இல்லாததால், நேரடியான உருவகம் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: תָּבוֹא
  choice: வருகிறது
  rationale: בוא என்பதன் பொதுவான பொருள் ‘வருதல்’. நிகழ்கால வடிவம் எபிரெயக் கவிதையின் உயிரோட்டத்தை இயல்பான நவீனத் தமிழில் தருகிறது; இரண்டாம் அடியிலும் விடுபட்டுள்ள வினைச்சொல் தெளிவுக்காக மீண்டும் வழங்கப்படுகிறது.
- source_word: סוּפָה
  choice: புயல்
  rationale: סוּפָה கடும் புயல், சூறாவளி அல்லது பெருங்காற்றைக் குறிக்கலாம். ‘புயல்’ இயல்பானதும், தேவையின்றி பொருளைக் குறுக்காததும் ஆகும்.
- source_word: וּמִמְּזָרִים
  choice: சிதறடிக்கும் காற்றுகளிலிருந்து
  rationale: מְזָרִים அரிதானதும் பொருள் சரியாகத் தீர்மானிக்க முடியாததுமான சொல். சிதறுதல் அல்லது பரப்புதல் என்ற சாத்தியமான சொற்பிறப்பை இந்த மொழிபெயர்ப்பு வெளிப்படுத்துகிறது; சூழலின் அடிப்படையில் கொள்ளப்படும் ‘வடக்கு’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: קָרָה
  choice: குளிர்
  rationale: קָרָה குளிர், உறைபனி அல்லது உறையவைக்கும் காலநிலையைக் குறிக்கலாம். ‘குளிர்’ சுருக்கமானதும், எபிரெயச் சொல்லின் பொருள் வரம்பைத் தேவையின்றி சுருக்காததும் ஆகும்.
