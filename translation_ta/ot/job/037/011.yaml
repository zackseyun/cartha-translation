  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: ta
  text: உண்மையாகவே, அவர் கார்மேகத்தை ஈரத்தால் கனக்கச் செய்கிறார்[a]; தமது ஒளியின் மேகத்தைச் சிதறடிக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மழையால்” அல்லது “நீரால்”; இங்கு “ஈரம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: “தமது ஒளியின் மேகம்” என்பது எபிரெயச் சொற்றொடரை நெருக்கமாகப் பிரதிபலிக்கிறது. புயல் சூழலில் இதை “தமது மின்னல் மேகம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: மேலும்
  rationale: எலிகூ தேவன் வானிலையை ஆளுவதைப் பற்றிக் கூறும் இன்னொரு கருத்தைச் சேர்க்கும் வலியுறுத்தல் துகளாக இங்கு வருகிறது; நவீன தமிழில் ‘மேலும்’ இயல்பாக உள்ளது.
- source_word: בְּרִי
  choice: ஈரத்தால்
  rationale: இச்சொல்லின் பொருள் உறுதியற்றது; ஈரம், மழை, நீர் அல்லது தெளிவு/ஒளிர்வு எனப் புரிந்துகொள்ளப்பட்டுள்ளது. மேகத்தையும் சுமையேற்றுவதையும் குறிக்கும் சூழலில் ‘ஈரத்தால்’ பொருத்தமானது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יַטְרִיחַ
  choice: சுமையேற்றுகிறார்
  rationale: טרח என்பதன் ஹிஃபில் வடிவம் ஒன்றைச் சுமக்கச் செய்தல் அல்லது பாரப்படுத்துதல் என்ற படிமத்தைக் கொண்டது. நீர் நிறைந்த கனமேகத்தின் காட்சியை ‘சுமையேற்றுகிறார்’ காக்கிறது.
- source_word: עָב
  choice: கார்மேகம்
  rationale: עָב என்பது அடர்த்தியான அல்லது கனமான மேகத்தைக் குறிக்கிறது. ‘கார்மேகம்’ இயல்பான தமிழில் அந்த வானிலைக் காட்சியைத் தருகிறது.
- source_word: יָפִיץ
  choice: பரவச்செய்கிறார்
  rationale: פוץ என்பதன் ஹிஃபில் வடிவம் சிதறடித்தல் அல்லது பரப்புதல் எனப் பொருள்படும். மேகத்தை வானில் விரியச்செய்வதை இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲנַן אוֹרוֹ
  choice: தமது ஒளியின் மேகம்
  rationale: எபிரெயச் சொற்றொடரின் ‘அவருடைய ஒளியின் மேகம்’ என்ற அமைப்பை நேரடியாகக் காத்து, புயல் சூழலில் ‘ஒளி’ என்பதை மின்னல் என்று உரைக்குள் தீர்மானித்துச் சேர்ப்பதைத் தவிர்க்கிறது.
