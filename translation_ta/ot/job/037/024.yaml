base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: ta
  text: ஆகையால், மனிதர்கள் அவருக்கு அஞ்சுகிறார்கள்; உள்ளத்தில் ஞானமுள்ள எவரையும் அவர் பொருட்படுத்துவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “உள்ளத்தில் ஞானமுள்ள எவரையும் அவர் காண்பதில்லை.” ‘காண்’ என்பதற்கான எபிரெய வினைச்சொல் ‘பொருட்படுத்து’ என்றும் பொருள்படலாம்; கடவுளுக்கு முன்பாக மனித ஞானம் மதிப்புப் பெறாததை இச்சொற்றொடர் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட கடவுளின் மகத்துவத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: יְרֵאוּהוּ
  choice: அவருக்கு அஞ்சுகிறார்கள்
  rationale: ירא என்பது அச்சம், பயபக்தி, வியப்பு ஆகிய நிழற்பொருள்களைக் கொண்டது. நேரடியான ‘அஞ்சுகிறார்கள்’ என்பது சொல்லின் வலிமையைத் தக்கவைத்து, சூழலில் பயபக்தியையும் உள்ளடக்கக்கூடியதாக உள்ளது.
- source_word: אֲנָשִׁים
  choice: மனிதர்கள்
  rationale: இங்கு பொதுவாக மனிதர்களைக் குறிக்கும் பன்மைச் சொல்; நவீன தமிழில் ஆண்-பெண் அனைவரையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: לֹא יִרְאֶה
  choice: அவர் பொருட்படுத்துவதில்லை
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காண்’; இச்சூழலில் கவனித்தல் அல்லது மதித்துப் பொருட்படுத்துதல் என்ற உறவுசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל
  choice: எவரையும்
  rationale: எதிர்மறை வாக்கியத்தில் வரும் כָּל என்பதன் பகிர்ந்தளிக்கும் வலிமையை, ‘ஒருவரைக்கூட இல்லை’ என்ற பொருளில் இயல்பான தமிழில் தருகிறது.
- source_word: חַכְמֵי לֵב
  choice: உள்ளத்தில் ஞானமுள்ள
  rationale: ‘இதயத்தின் ஞானிகள்’ என்ற எபிரெய உருவகத்தை புரியத்தக்க நவீன தமிழில் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘தங்கள் பார்வையில் ஞானிகள்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உள்ளத்தில் ஞானமுள்ளவர்களை கடவுள் ‘காணாதது’ என்பதன் பொருள்
  choice: கடவுள் அவர்களைப் பொருட்படுத்துவதில்லை
  alternative: உள்ளத்தில் ஞானமுள்ள எவரையும் அவர் காண்பதில்லை
  rationale: வினைச்சொல்லின் மறைமுக எழுவாய் சூழலின்படி கடவுளையே குறிக்கிறது. ‘காண்’ என்பது இங்கு ‘கவனத்தில் கொள்/மதித்துப் பொருட்படுத்து’ என்ற பொருளைக் கொள்ளலாம். முதன்மை உரை இயல்பான தமிழில் அந்தச் சூழற்பொருளைத் தருகிறது; இருப்பினும் மூலத்தின் நேரடிப் பொருளும் அதன் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன. இது மனித ஞானத்தின் தன்னிறைவைப் பற்றிய எச்சரிக்கையை உணர்த்தலாம்; ஆனால் ‘தங்கள் பார்வையில் ஞானிகள்’ என்று மூலத்தைவிட அதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவருக்கு அஞ்சுகிறார்கள்’ என்பது அச்சம் மற்றும் பயபக்தி இரண்டிற்குமான மூலச் சொல்லின் பரப்பைத் திறந்தவாறு வைக்கிறது; ‘உள்ளத்தில் ஞானமுள்ள’ என்பது எபிரெய உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
