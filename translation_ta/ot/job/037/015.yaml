  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: ta
  text: கடவுள் இவற்றை அவற்றின்மேல் எவ்வாறு வைக்கிறார்[a] என்றும், தமது மேகத்தின் ஒளியை எவ்வாறு ஒளிரச் செய்கிறார்[b] என்றும் உனக்குத் தெரியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுள் அவற்றை வைக்கும்போது” அல்லது “கடவுள் அவற்றை நியமிக்கும்போது” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானது; வைக்கப்படுவது எது, “அவை” என்பது எவற்றைக் குறிக்கிறது என்பவை சுற்றியுள்ள சூழலிலிருந்து புரிந்துகொள்ளப்பட வேண்டும்.
    reason: alternative_reading
  - marker: b
    text: “தமது மேகத்தின் பிரகாசத்தை மின்னச் செய்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: உனக்குத் தெரியுமா?
  rationale: ידע என்பதன் கால் வினைமுற்று, யோபை நோக்கி எழுப்பப்படும் சொல்லாட்சிக் கேள்வியாக உள்ளது. நவீனத் தமிழில் “உனக்குத் தெரியுமா?” என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: בְּשׂוּם
  choice: எவ்வாறு அமைக்கிறார்
  rationale: בְּ உடன் வரும் שום வினையெச்சம் ‘வைக்கும்போது/அமைக்கும்போது’ என்ற சூழ்நிலையையோ, இக்கேள்வியில் ‘எவ்வாறு அமைக்கிறார்’ என்ற முறையையோ குறிக்கலாம். கேள்வியின் ஓட்டத்துக்கு ஏற்ற இயல்பான தமிழாக இரண்டாவது வடிவம் முதன்மை உரையில் கொள்ளப்பட்டது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் אֱלוֹהַּ என்பது ‘கடவுள்’ என்பதற்கான ஒருமை கவிதை வடிவம்; கூடுதல் இறையியல் பட்டப்பெயரைச் சேர்க்க ஆதாரம் இல்லை.
- source_word: עֲלֵיהֶם
  choice: அவற்றின்மேல்
  rationale: על உடன் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு ‘அவற்றின்மேல்’ எனப் பொருள்படும். அது குறிப்பது சுற்றியுள்ள வானிலை நிகழ்வுகளையோ மேகங்களையோ இருக்கலாம்; குறிப்பிட்ட ஒன்றாக மொழிபெயர்க்காமல் தெளிவின்மை காக்கப்பட்டது.
- source_word: וְהוֹפִיעַ
  choice: பிரகாசிக்கச் செய்கிறார்
  rationale: יפע என்பதன் ஹிஃபில் வடிவம் ஒளி தோன்றவோ பிரகாசிக்கவோ செய்வதைக் குறிக்கிறது. காரணவினைப் பொருளைத் தமிழ் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: אוֹר என்பதன் அடிப்படைப் பொருள் ‘ஒளி’; ‘பிரகாசம்’ என்பதும் சாத்தியமானது.
- source_word: עֲנָנוֹ
  choice: தமது மேகம்
  rationale: ஒருமை பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஒருமை உரிமைப் பின்னொட்டு இருப்பதால், மூலத்தின் ஒருமையைப் பின்பற்றி ‘தமது மேகம்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: שום என்பதன் வெளிப்படையாகச் சொல்லப்படாத செயப்படுபொருளும் עֲלֵיהֶם என்பதன் சுட்டுப்பொருளும்
  choice: “இவற்றை அவற்றின்மேல் ... அமைக்கிறார்” என்று பொதுவாக வைத்து, குறிப்பிட்ட வானிலை விளக்கத்தைச் சேர்க்காமல் விடுதல்
  alternative: “மேகங்களை அவற்றின்மேல் வைக்கிறார்,” “தமது கட்டளையை அவற்றின்மேல் இடுகிறார்,” அல்லது “மின்னலை அவற்றில் அமைக்கிறார்”
  rationale: எபிரெய உரை שום வினைக்கான செயப்படுபொருளை வெளிப்படையாகக் கூறவில்லை; “அவற்றின்மேல்” என்பதன் சுட்டுப்பொருளும் சூழலிலிருந்தே பெறப்பட வேண்டும். ஆகவே மின்னல், மேகம், அல்லது தெய்வீகக் கட்டளை என்று குறிப்பிட்டு இறையியல் அல்லது இயற்கைவியல் விளக்கத்தைத் திணிக்காமல் மூலத்தின் திறந்தநிலை காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் கவிதைநயமும் காக்கப்பட்டுள்ளன. யோபை ஒருமையில் நேரடியாகச் சுட்டும் “உனக்கு” பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரை வாசிக்க இயல்பாக இருக்க “இவற்றை” சேர்க்கப்பட்டாலும், எபிரெயில் செயப்படுபொருள் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
