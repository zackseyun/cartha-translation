- from: வானங்கள் அனைத்தின் கீழும் அதை அவர் அனுப்புகிறார்; தமது மின்னலைப் பூமியின் சிறகுகள்மேல்[a] செலுத்துகிறார்.[b]
  to: எல்லா வானங்களின்கீழும் அதை அவர் அனுப்புகிறார்; தமது ஒளியைப் பூமியின் எல்லைகளின்மேல் செலுத்துகிறார்.[a][b]
  rationale: This revision improves modern Tamil idiom, renders the Hebrew geographical idiom by its sense while retaining its literal imagery in a note, and preserves the lexical ambiguity of אוֹרוֹ (‘his light’) rather than resolving it in the main text as ‘lightning.’
