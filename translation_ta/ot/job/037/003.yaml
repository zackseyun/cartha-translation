base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: ta
  text: எல்லா வானங்களின்கீழும் அதை அவர் அனுப்புகிறார்; தமது ஒளியைப் பூமியின் எல்லைகளின்மேல் செலுத்துகிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “பூமியின் சிறகுகள்மேல்”; இது பூமியின் தொலைவான எல்லைகள் அல்லது முனைகளைக் குறிக்கும் எபிரெயக் கவிதைப் படிமம்.
    reason: cultural_note
  - marker: b
    text: “தமது ஒளியை” என்பதற்குப் பதிலாக, “தமது மின்னலை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியாக “ஒளி” என்று பொருள்படும்; இங்குள்ள புயல் சூழலில் அது மின்னலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: வானங்கள் அனைத்தின் கீழும்
  rationale: எபிரெய உரையின் ‘எல்லா வானங்களின் கீழும்’ என்ற இடவியல் படிமத்தையும் பன்மையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יִשְׁרֵהוּ
  choice: அதை அவர் அனுப்புகிறார்
  rationale: வினையின் துல்லியமான நுண்பொருள் உறுதியற்றது; சூழலில் இடி அல்லது அதனுடன் தொடர்புடைய புயல் நிகழ்வை வெளியே அனுப்புதல்/செலுத்துதல் என்ற பொருள் ஏற்றது. எபிரெயில் உள்ள சுட்டுப்பெயர் பின்னொட்டை ‘அதை’ எனத் தக்கவைத்துள்ளது.
- source_word: וְאוֹרוֹ
  choice: தமது மின்னலை
  rationale: אוֹר என்பதன் நேர்ப்பொருள் ‘ஒளி’; ஆனால் புயல் சூழலில் அது மின்னலைக் குறிக்க வாய்ப்புள்ளது. தெளிவுக்காக ‘மின்னல்’ முதன்மை உரையில் தரப்பட்டு, ‘ஒளி’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: பூமியின் சிறகுகள்மேல்
  rationale: ‘பூமியின் சிறகுகள்’ என்ற மூலக் கவிதைப் படிமத்தைத் தமிழில் காக்கிறது; அது பூமியின் தொலைவான எல்லைகள் அல்லது முனைகளைக் குறிக்கலாம்.
theological_decisions:
- issue: אוֹרוֹ என்பது பொதுவான ‘ஒளியா’ அல்லது புயல் சூழலிலுள்ள ‘மின்னலா’?
  choice: முதன்மை உரையில் ‘தமது மின்னலை’
  alternative: ‘தமது ஒளியை’
  rationale: சுற்றியுள்ள புயல் மற்றும் இடி பற்றிய வரிகள் மின்னலைச் சுட்டுகின்றன; எனினும் எபிரெயச் சொல்லின் நேர்ப்பொருளான ‘ஒளி’ அடிக்குறிப்பில் விடப்படுவதால் உண்மையான சொற்பொருள் திறந்தே உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘வானங்கள்’ என்ற பன்மையும் ‘பூமியின் சிறகுகள்’ என்ற படிமமும் பாதுகாக்கப்பட்டுள்ளன; அறிமுகமில்லாத படிமம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
