    text: அல்லது, “கோலுக்காக”; அதாவது, தண்டனைக்காக அல்லது ஒழுக்கப்படுத்துவதற்காக.
    reason: lexical_alternative
  - marker: b
    text: “மாறாத அன்பு” என்பதற்கு “இரக்கம்” அல்லது “தயவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
