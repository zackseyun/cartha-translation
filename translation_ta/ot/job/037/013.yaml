  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: ta
  text: திருத்தத்திற்காகவோ[a], அவருடைய நிலத்திற்காகவோ, மாறாத அன்புக்காகவோ[b], அவர் அதை வரச்செய்கிறார்[c].
  philosophy: optimal-equivalence
