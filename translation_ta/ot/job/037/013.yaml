    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -க்காகவோ … -க்காகவோ … -க்காகவோ
  rationale: மும்முறை வரும் אִם இங்கு நிபந்தனையை அல்ல, மாற்று நோக்கங்கள் அல்லது விளைவுகளை வரிசைப்படுத்துகிறது; தமிழில் ‘-வோ’ தொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְשֵׁבֶט
  choice: தண்டனைக்காக
  rationale: שֵׁבֶט என்பதன் நேர்ப்பொருள் ‘கோல்’; இச்சூழலில் அது கோலால் அளிக்கப்படும் தண்டனை அல்லது திருத்தத்தை ஆகுபெயராகக் குறிக்கிறது. முதன்மை உரையில் இயல்பான பொருள் தரப்பட்டு, நேர்ப்பொருளும் ஒழுக்கப்படுத்துதல் என்ற சாத்தியமும் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: לְאַרְצוֹ
  choice: தமது நிலத்திற்காக
  rationale: אֶרֶץ என்பது ‘நிலம்/பூமி’ எனப் பொருள்படும். மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியை ‘தமது’ காக்கிறது; இங்கு தேவனுடைய ஆட்சிக்குட்பட்ட நிலமே இயல்பான குறிப்பு.
- source_word: לְחֶסֶד
  choice: மாறாத அன்புக்காக
  rationale: חֶסֶד அன்பு, இரக்கம், நம்பிக்கைக்குரிய பற்றுறுதி ஆகிய செறிவைக் கொண்டது. ‘மாறாத அன்பு’ அதன் நிலைத்த தன்மையைத் தக்கவைக்கிறது; ‘இரக்கம்/தயவு’ அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יַמְצִאֵהוּ
  choice: அவர் அதை வரச்செய்கிறார்
  rationale: מצא வினையின் ஹிஃபீல் வடிவம் இங்கு காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘அதை’ என்பது முந்தைய சூழலில் கூறப்படும் மேகம், மழை அல்லது புயல் நிகழ்வைக் குறிக்கிறது; ‘வரச்செய்கிறார்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் வருகை/நிகழ்த்துதல் நுணுக்கத்துடனும் உள்ளது.
theological_decisions:
- issue: மும்முறை வரும் אִם உடன் לְ அமைப்பின் பொருள்
  choice: வானிலை நிகழ்வைத் தேவன் தண்டனை, தமது நிலத்தின் நன்மை, அல்லது மாறாத அன்பு ஆகிய மாற்று நோக்கங்களுக்காக வரச்செய்கிறார்.
  alternative: இவை நோக்கங்களைக் காட்டாமல், அந்த நிகழ்வு சென்றடையும் இடங்களை மட்டும் குறிக்கலாம்; முதல் கூறு குறிப்பாக அழிவுத் தீர்ப்பைக் குறிக்கலாம்.
  rationale: உடனடி சூழல் மேகங்களையும் மழையையும் தேவன் நடத்துவதைப் பற்றியது. לְ உடன் வரும் மூன்று கூறுகளையும் நோக்கம் அல்லது விளைவாக வாசிப்பது பொருத்தமானது; எனினும் ‘தண்டனை’ என்பதை அழிவுத் தீர்ப்பாக மட்டும் குறுக்காமல் மூலத்தின் தண்டனை/ஒழுக்கப்படுத்துதல் இழுவை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. மும்மடங்கு மாற்றுத் தொடரை ‘-க்காகவோ’ வடிவம் தெளிவாகக் காட்டுகிறது. ‘அதை’ என்ற சுட்டுப்பெயர் சுற்றியுள்ள வசனங்களில் பேசப்படும் வானிலை நிகழ்வைக் குறிப்பதாக விடப்பட்டு, மூலத்தில் இல்லாத குறிப்பான பெயர்ச்சொல் சேர்க்கப்படவில்லை.
