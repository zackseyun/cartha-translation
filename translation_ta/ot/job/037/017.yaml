  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: ta
  text: 'தெற்கிலிருந்து வீசும் காற்றால்[a] பூமி அமைதியாய் இருக்கும்போது,

    உன் உடைகள் வெப்பமாயிருக்கின்றன அல்லவா?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்கிலிருந்து.” எபிரெயில் சொற்சொல்லாக “தெற்கிலிருந்து” என்று உள்ளது; இது தென்திசையைக் குறிக்கலாம். இச்சூழலில் அது தெற்கிலிருந்து வீசும் வெப்பக் காற்றைக் குறிக்கவும் கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: உன் ... அல்லவா?
  rationale: இச்சூழலில் எலிகூ நேரடியாக யோபுவை நோக்கிப் பேசுவதை இயல்பான தமிழ்க் கேள்வியாகக் கொண்டு வருகிறது; எபிரெய உறவுத்தொடரின் இரண்டாம் நபர் சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: בְּגָדֶיךָ
  choice: உன் உடைகள்
  rationale: בגד என்பதன் பொதுவான பொருள் உடை; நவீனத் தமிழில் இயல்பாகவும் கவிதைநடைக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: חַמִּים
  choice: சூடாகின்றன
  rationale: இது ‘சூடான/வெப்பமான’ எனப் பொருள்படும் பெயரடை. வானிலை காரணமாக உடைகள் வெப்பமடையும் அனுபவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த வினைநிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּהַשְׁקִט
  choice: அமைதியாகும்போது
  rationale: שקט என்பது அமைதியாக அல்லது அசைவற்று இருப்பதைக் குறிக்கிறது; ב முன்னொட்டு இங்கு காலப்பொருளைத் தருகிறது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: ‘நிலம்’ என்பதும் சாத்தியம்; விரிந்த வானிலைச் சூழலில் ‘பூமி’ பொருத்தமானது.
- source_word: מִדָּרוֹם
  choice: தெற்கிலிருந்து
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘தெற்கிலிருந்து’ என்ற வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இது தென்திசையையோ அங்கிருந்து வரும் காற்றையோ குறிக்கலாம்.
