  text: אַחֲרָ֤י/ו יִשְׁאַג ק֗וֹל יַ֭רְעֵם בְּ/ק֣וֹל גְּאוֹנ֑/וֹ וְ/לֹ֥א יְ֝עַקְּבֵ֗/ם כִּֽי יִשָּׁמַ֥ע קוֹלֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: ta
  text: 'அதற்குப் பின்[a] ஒரு குரல் கர்ஜிக்கிறது;


    அவர் தமது மாட்சிமையான குரலில் இடிமுழங்குகிறார்.


    அவரது குரல் கேட்கும்போது[c],


    அவற்றை அவர் தடுத்து நிறுத்துவதில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிறகு ஒரு குரல் கர்ஜிக்கிறது.” எபிரெயச் சொற்றொடரைப் பொதுவாக “பிறகு” என்ற பொருளிலும் கொள்ளலாம்; ஆனால் முந்தைய வசனத்திலுள்ள மின்னலை இது சுட்டுவதாகச் சூழல் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை அவர் தாமதப்படுத்துவதில்லை.” “அவை” என்பது இடிமுழக்கத்துடன் வெளிப்படும் மின்னல்களையோ புயலின் விளைவுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஏனெனில் அவரது குரல் கேட்கப்படுகிறது.” எபிரெய இணைப்புச்சொல் காலப் பொருளோடு மட்டுமல்லாமல் காரணப் பொருளிலும் வாசிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அதற்குப் பின்
  rationale: முந்தைய வசனத்திலுள்ள மின்னலை இது சுட்டுவதாகச் சூழல் உணர்த்துகிறது. அதேவேளையில், சுட்டப்படுவது எது என்பதை மூலத்தைவிட வெளிப்படையாகக் கூறாமல், அதன் தொடர்பைத் தக்கவைக்கிறது.
- source_word: יִשְׁאַג קוֹל
  choice: ஒரு குரல் கர்ஜிக்கிறது
  rationale: שׁאג என்பது பொதுவாகச் சிங்கத்தின் கர்ஜனையைக் குறிக்கும்; இங்கு இடியின் ஒலியை உயிரோட்டமான உருவகமாகக் காட்டுகிறது. பின்னர் வரும் உடைமைப் பொருளை முன்னதாகவே சேர்க்காமல், קוֹל என்பதைக் கூறுபொருளாக வைத்திருக்கிறது.
- source_word: יַרְעֵם
  choice: அவர் ... இடிமுழங்குகிறார்
  rationale: רעם என்பதன் ஹிஃபீல் வடிவம் கடவுள் இடியை உண்டாக்குவதைக் குறிக்கிறது. தமிழில் ‘இடிமுழங்குகிறார்’ என்பது இயல்பாகவும் தெய்வீகச் செயல்பாட்டைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: தமது மாட்சிமையான குரலில்
  rationale: גָּאוֹן இங்கு மாட்சிமை, மேன்மை, பேருயர்வு ஆகிய பொருள்களைத் தருகிறது. ‘மாட்சிமையான குரல்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பெருமையைத் தக்கவைக்கிறது.
- source_word: וְלֹא יְעַקְּבֵם
  choice: அவற்றை அவர் தடுத்து நிறுத்துவதில்லை
  rationale: עקב என்பதன் பிஏல் வடிவம் தடுத்தல், பின்னே வைத்தல், தாமதப்படுத்தல் ஆகிய பொருள்களை ஏற்கலாம். பன்மைச் சுட்டுப்பெயரின் முன்னிலை மூலத்தில் வெளிப்படையாக இல்லாததால், ‘அவற்றை’ என அதே தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: அவரது குரல் கேட்கும்போது
  rationale: כִּי காரணப் பொருளிலும் காலப் பொருளிலும் வரலாம். புயல் நிகழ்வுகளின் தொடர்ச்சியில் காலப் பொருள் இயல்பாக இருப்பதால் ‘கேட்கும்போது’ தேர்ந்தெடுக்கப்பட்டது; காரணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கர்ஜித்து இடிமுழங்குபவரின் அடையாளம்
  choice: செய்பவர் கடவுள்; இடி அவரது குரலின் வெளிப்பாடாக விவரிக்கப்படுகிறது.
  alternative: இதைத் தனிப்பட்ட செய்பவர் இல்லாத புயலின் அல்லது குரலின் செயலாக வாசிக்கலாம்.
  rationale: உடனடிச் சூழலில் எலிகூ கடவுளின் புயல் செயல்களை விவரிக்கிறார்; ‘தமது மாட்சிமையான குரல்’ என்பதும் தனிப்பட்ட தெய்வீகச் செய்பவரை ஆதரிக்கிறது. இருப்பினும் மூலத்தில் இவ்வசனத்தில் ‘கடவுள்’ என்ற பெயர் இல்லாததால், மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவத் தன்மையையும் கண்ணியத்தையும் காக்கும் எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்ஜிக்கிறது’ என்ற சொல் மூலத்தின் வலுவான சிங்கக் கர்ஜனை உருவகத்தைத் தக்கவைக்கிறது; வரிப் பிரிப்பு எபிரெயக் கவிதையின் கருத்து அலகுகளைத் தெளிவாக்குகிறது.
