base_translation:
  language: en
  yaml_path: translation/ot/job/037/002.yaml
  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: ta
  text: அவருடைய குரலின் நடுக்கத்தை உன்னிப்பாகக் கேளுங்கள்[a]; அவருடைய வாயிலிருந்து வெளிவரும் உறுமலையும்[b] கேளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேளுங்கள், கேளுங்கள்; அவருடைய குரலின் நடுக்கத்தை.” எபிரெயத்தில் ஒரே வேரைச் சேர்ந்த கட்டளை வினையும் வினையெச்ச வடிவமும் இணைந்து கட்டளையை வலியுறுத்துகின்றன. ‘நடுக்கம்’ என்பதற்கான சொல் கலக்கம் அல்லது சீற்றம் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழக்கத்தையும்,” அல்லது “தாழ்ந்த ஒலியையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: உன்னிப்பாகக் கேளுங்கள்
  rationale: கட்டளை வினையுடன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை, தமிழில் இயல்பாகவும் தெளிவாகவும் ‘உன்னிப்பாகக் கேளுங்கள்’ என வெளிப்படுத்துகிறது.
- source_word: בְּרֹגֶז
  choice: நடுக்கத்தை
  rationale: רֹגֶז என்பது நடுக்கம், கலக்கம், சீற்றம் ஆகிய பொருள்களைக் குறிக்கலாம். புயல் மற்றும் இடிமுழக்கச் சூழலில் ஒலியின் அதிரவைக்கும் தன்மையை ‘நடுக்கம்’ நெருக்கமாக வெளிப்படுத்துகிறது; ‘கோபம்’ என்று பொருளைத் தேவையின்றி வரையறுப்பதையும் தவிர்க்கிறது.
- source_word: קֹלוֹ
  choice: அவருடைய குரல்
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள் கொள்ளலாம். தொடர்ந்து ‘அவருடைய வாய்’ என்று வருவதால், மூலத்தின் உருவகமான மனிதப் பண்பேற்றத்தை ‘குரல்’ காக்கிறது.
- source_word: וְהֶגֶה
  choice: முழக்கம்
  rationale: הֶגֶה தாழ்ந்த ஒலி, முணுமுணுப்பு, உறுமல் போன்ற ஒலியைக் குறிக்கிறது. புயல் சூழலில் இடியின் நீண்ட, ஆழமான ஒலியை இயல்பான தமிழில் ‘முழக்கம்’ தெரிவிக்கிறது.
- source_word: מִפִּיו יֵצֵא
  choice: அவருடைய வாயிலிருந்து வெளிவரும்
  rationale: יצא என்பதன் ‘வெளியே வருதல்’ என்ற நேரடியான பொருளையும், மூலத்திலுள்ள திடமான மனிதப் பண்பேற்ற உருவகத்தையும் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: புயல் உருவகத்தில் கடவுளுக்குப் பயன்படுத்தப்படும் மனிதப் பண்பேற்ற மொழி
  choice: ‘அவருடைய குரல்’, ‘அவருடைய வாய்’ என்பவற்றைத் தக்கவைத்தல்
  alternative: ‘அதன் ஒலி’ அல்லது ‘இடி’ என்று மனிதப் பண்பேற்றத்தை நீக்குதல்
  rationale: எபிரெயக் கவிதை புயலைக் கடவுளின் சொந்த உரைப்போலச் சித்தரிக்கிறது. அந்த மொழியைத் தக்கவைப்பது மூலத்தின் இலக்கிய மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளையில் கவிதைநயமும் கண்ணியமும் கொண்ட நடை. ‘உன்னிப்பாக’ என்பது எபிரெய வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; ‘குரல்’ மற்றும் ‘வாய்’ மூலத்தின் மனிதப் பண்பேற்ற உருவகத்தைப் பாதுகாக்கின்றன.
