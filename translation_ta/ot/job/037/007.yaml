  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: ta
  text: ஒவ்வொரு மனிதரின் கையையும் அவர் முத்திரையிடுகிறார்[a]; மனிதர்கள் அனைவரும்[b] அவரது செயலை அறிந்துகொள்ளும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒவ்வொரு மனிதரின் கையின்மேல் அவர் முத்திரையிடுகிறார்.” இந்தச் சொற்றொடர், கடவுள் மனிதர்களின் வழக்கமான வேலையை நிறுத்துகிறார் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, எபிரெயத் தொடரை, “அவர் படைத்த மனிதர்கள் அனைவரும் [அவரை] அறியும்படி” என்றும் புரிந்துகொள்ளலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּיַד כָּל אָדָם
  choice: ஒவ்வொரு மனிதரின் கையையும்
  rationale: בְּיַד என்பதன் முன்னிடைச்சொல் நுணுக்கத்தைத் தமிழில் வினையின் நேர்செயப்படுபொருளாக இயல்பாகக் கொடுத்து, כָּל אָדָם என்பதன் ஒவ்வொருவரையும் உள்ளடக்கும் ஒருமைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: יַחְתּוֹם
  choice: முத்திரையிட்டு மூடுகிறார்
  rationale: חתם என்பதன் ‘முத்திரையிடுதல்’ என்ற உருவகத்தைத் தக்கவைத்து, இச்சூழலில் கைவேலையை நிறுத்தும் அல்லது தடைசெய்யும் பொருளையும் தமிழில் உணர்த்துகிறது; அந்தச் சூழற்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்ளும்படி
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்சம் இங்கு நோக்கம் அல்லது விளைவைச் சுட்டுவதால், ‘அறிந்துகொள்ளும்படி’ என்பது இரண்டிற்கும் இடமளிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: כָּל אַנְשֵׁי
  choice: மனிதர்கள் அனைவரும்
  rationale: ஆண்பால் இலக்கண வடிவம் இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள் அனைவரும்’ என்பது பாலினத்தால் வரையறுக்காமல் அந்தப் பொதுப்பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: מַעֲשֵׂהוּ
  choice: அவரது செயலை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியை ‘அவரது’ எனவும், מַעֲשֶׂה என்பதைக் கடவுளின் செயற்பாட்டைக் குறிக்கும் ‘செயல்’ எனவும் வழங்குகிறது.
theological_decisions:
- issue: יַחְתּוֹם மற்றும் מַעֲשֵׂהוּ ஆகியவற்றிலுள்ள மூன்றாம் நபர் ஒருமையின் சுட்டுப்பொருள்
  choice: செய்பவரும் ‘செயல்’ என்பதன் உரியவரும் கடவுள்
  alternative: புயல் அல்லது குளிர்காலம் போன்ற இயற்கை நிகழ்வு செய்பவராகக் கொள்ளப்படுதல்
  rationale: எலிகூவின் உரையில் வானிலையையும் படைப்பையும் ஆளுகிறவர் கடவுள் என்பதே உடனடிச் சூழல்; ஆகவே இரு வடிவங்களும் கடவுளையே சுட்டுவது சூழலுக்கு மிகவும் பொருந்துகிறது.
- issue: כָּל אַנְשֵׁי מַעֲשֵׂהוּ என்ற தொடரின் தொடர்பு
  choice: ‘மனிதர்கள் அனைவரும் அவரது செயலை அறிந்துகொள்ளும்படி’
  alternative: ‘அவர் படைத்த மனிதர்கள் அனைவரும் அறிந்துகொள்ளும்படி’
  rationale: முக்கிய வாசிப்பு מַעֲשֵׂהוּ என்பதை לָדַעַת என்பதன் பொருளாகக் கொள்கிறது. ஆனால் பெயர்ச்சொற்களின் தொடர் ‘அவர் படைத்த மனிதர்கள்’ என்றும் புரிந்துகொள்ளப்படலாம்; இந்த உண்மையான தொடரியல் இருபொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘முத்திரையிட்டு மூடுகிறார்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது; ‘மனிதர்’ என்ற சொல் இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. வசனத்தின் கடினமான எபிரெயத் தொடரியல் அடிக்குறிப்புகளில் தீர்மானமாக ஒற்றைப்படுத்தப்படாமல் வழங்கப்பட்டுள்ளது.
