source:
  edition: WLC
  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: ta
  text: கடவுள் தமது குரலால் அற்புதமாக முழங்குகிறார்[a]; நாம் அறியாத மகத்தான செயல்களை அவர் செய்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தமது குரலால் அற்புதங்களை முழங்குகிறார்.” எபிரெயில் “அற்புதங்கள்” என்பது பெயர்ச்சொல் வடிவில் இருந்தாலும், இங்கு “அற்புதமாக” என்ற வினையடைப் பொருளில் வந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் அறிவுக்கு அப்பாற்பட்ட மகத்தான செயல்களை”; அல்லது, “நம்மால் புரிந்துகொள்ள முடியாத மகத்தான செயல்களை.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: முழங்குகிறார்
  rationale: רעם என்பதன் ஹிஃபில் வடிவம் இடிமுழக்கத்தை எழுப்புவதையோ இடிபோல் முழங்குவதையோ குறிக்கிறது. புயல் சூழலும் கடவுளின் குரலும் இணையும் இவ்விடத்தில், இயல்பான தமிழில் ‘முழங்குகிறார்’ பொருத்தமாக உள்ளது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இங்கு விரிவுபடுத்தப்பட்ட சிறப்புப் பட்டத்தை வேண்டாத பொதுவான இறைப் பெயராக வருகிறது.
- source_word: בְּקוֹלוֹ
  choice: தமது குரலால்
  rationale: בְּ என்ற முன்னொட்டு இங்கு கருவிப் பொருளில் உள்ளது; கடவுளின் குரலே முழக்கத்தின் வழிமுறையாகச் சுட்டப்படுகிறது. உயர்திணை ஒருமைக்கு மரியாதை காட்ட ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: נִפְלָאוֹת
  choice: அற்புதமாக
  rationale: இச்சொல் வடிவத்தில் ‘அற்புதங்கள்’ என்ற பன்மைப் பெயராக இருந்தாலும், இக்கூற்றில் יַרְעֵם என்பதைக் குறிப்பிட்டு வினையடைப் பொருளில் செயல்பட வாய்ப்பு அதிகம். இயல்பான தமிழில் ‘அற்புதமாக’ அந்தப் பொருளைத் தருகிறது; நேரடியான பெயர்ச்சொல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֹשֶׂה
  choice: செய்கிறார்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை; தொடரும் גְדֹלוֹת உடன் ‘செய்கிறார்’ இயல்பாக அமைகிறது.
- source_word: גְּדֹלוֹת
  choice: மகத்தான செயல்களை
  rationale: பெண்பால் பன்மை உரிச்சொல் இங்கு பெயர்ச்சொல் போலப் பயன்படுகிறது. தமிழில் மறைந்துள்ள ‘காரியங்கள்/செயல்கள்’ என்பதைக் குறிப்பிட்டு ‘மகத்தான செயல்களை’ என மொழிபெயர்ப்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: וְלֹא נֵדָע
  choice: நாம் அறியாத
  rationale: எபிரெயில் எழுத்துப்படி ‘நாம் அறியவில்லை’ என்று உள்ளது. முந்தைய ‘மகத்தான செயல்கள்’ என்பதுடன் தொடர்புடைய பெயரெச்சத் தொடராக ‘நாம் அறியாத’ என்பது இயல்பான தமிழையும் ‘அறிதல்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூற்றில் மனித அறியாமையின் அளவு
  choice: கடவுளின் மகத்தான செயல்களை ‘நாம் அறியாத’வை என்று மட்டும் கூறுதல்
  alternative: அவை நம் அறிவுக்கு அப்பாற்பட்டவை அல்லது நம்மால் புரிந்துகொள்ள இயலாதவை என்று கூறுதல்
  rationale: ידע என்பதன் நேரடிப் பொருள் ‘அறிதல்’. சூழல் மனித வரம்பைக் காட்டினாலும், முழுமையாகப் புரிந்துகொள்ள இயலாது என்ற வலுவான கருத்தை மொழிபெயர்ப்பில் சேர்க்காமல் மூலத்தின் இறையியல் இழுபறியைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. புயல் உருவகத்தைத் தெளிவாக வைத்திருக்க ‘முழங்குகிறார்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள பெயர்ச்சொல்/வினையடை இரட்டை வாய்ப்பும், ‘அறிதல்’ மற்றும் ‘புரிந்துகொள்ள இயலாமை’ ஆகிய வாசிப்புகளின் வேறுபாடும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
