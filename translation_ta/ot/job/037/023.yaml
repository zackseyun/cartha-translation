source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: ta
  text: சர்வவல்லவரை நம்மால் கண்டறிய முடியாது[a]. அவர் வல்லமையில் மகத்தானவர்; நீதியும்[b] நிறைந்த நேர்மையும் உடைய அவர் யாரையும் ஒடுக்குவதில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை நம்மால் முழுமையாகப் புரிந்துகொள்ள முடியாது” அல்லது “அவரை நம்மால் எட்ட முடியாது.”
    reason: lexical_alternative
  - marker: b
    text: “நீதி” என்பதற்கு மாற்றாக, “நியாயத்தீர்ப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இறுதிக் கூற்றை “அவர் துன்புறுத்துவதில்லை” என்றும் புரிந்துகொள்ளலாம். சிலர் இதை “அவர் பதிலளிப்பதில்லை” என்று எடுத்துக்கொள்கிறார்கள்; ஆனால் அது இச்சூழலுக்கு அவ்வளவு இயல்பாகப் பொருந்தாது.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் வரும் இறைப் பட்டத்தை, ஒலிபெயர்ப்பாக அல்லாமல் அதன் பொருளைத் தெளிவாகத் தரும் வழக்கமான தமிழ்ச் சொல்லால் மொழிபெயர்க்கிறது.
- source_word: לֹא מְצָאנֻהוּ
  choice: நம்மால் கண்டறிய முடியாது
  rationale: מצא என்பதன் அடிப்படைப் பொருளான ‘கண்டடைதல்’ என்பதையும், இச்சூழலில் உள்ள முழுமையாக அறிந்துகொள்ள இயலாமை என்ற கருத்தையும் இணைத்துக் காட்டுகிறது.
- source_word: שַׂגִּיא כֹחַ
  choice: வல்லமையில் மகத்தானவர்
  rationale: שַׂגִּיא குறிக்கும் பெருமையையும் כֹחַ குறிக்கும் வல்லமையையும் இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּמִשְׁפָּט
  choice: நீதி
  rationale: இங்கு מִשְׁפָּט ஒரு தனிப்பட்ட தீர்ப்பை விட இறைவனின் நீதியான பண்பைக் குறிக்கிறது; ‘நியாயத்தீர்ப்பு’ என்பது மாற்றுப் பொருளாக இருக்கலாம்.
- source_word: וְרֹב צְדָקָה
  choice: நிறைந்த நேர்மை
  rationale: רֹב என்பதன் மிகுதி அல்லது நிறைவு உணர்வையும் צְדָקָה என்பதன் ஒழுக்க நேர்மை சார்ந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֹא יְעַנֶּה
  choice: யாரையும் ஒடுக்குவதில்லை
  rationale: ענה என்பதன் பியேல் வடிவம் இச்சூழலில் ‘ஒடுக்குதல், துன்புறுத்துதல்’ என்று பொருள்படுகிறது. செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லாததால், தமிழில் வாக்கியம் இயல்பாக அமைய ‘யாரையும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: לֹא יְעַנֶּה என்ற இறுதிக் கூற்றை இறைவனின் நீதி மற்றும் நேர்மையோடு எவ்வாறு தொடர்புபடுத்துவது
  choice: நீதியும் நிறைந்த நேர்மையும் உடைய அவர் யாரையும் ஒடுக்குவதில்லை
  alternative: அவர் துன்புறுத்துவதில்லை; அல்லது, அவர் பதிலளிப்பதில்லை
  rationale: எலிகூ இறைவனின் அளவிட முடியாத வல்லமையையும் ஒழுக்க நேர்மையையும் ஒன்றாகக் கூறும் சூழலில், ‘ஒடுக்குவதில்லை’ என்பது பியேல் வினையின் இயல்பான பொருளையும் கருத்தோட்டத்தையும் காக்கிறது. அதேவேளையில் ‘பதிலளிப்பதில்லை’ என்ற குறைவாகப் பொருந்தும் வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் சுருக்கமான அமைப்பை அப்படியே நகலெடுத்து தமிழைத் தெளிவற்றதாக்காமல், அதன் கருத்துறவுகளை வெளிப்படுத்த ‘உடைய அவர்’ மற்றும் ‘யாரையும்’ சேர்க்கப்பட்டுள்ளன. இறைவனின் எட்டமுடியாத தன்மைக்கும் நீதியான பண்புக்கும் இடையிலான உரைத் திணிவு பாதுகாக்கப்பட்டுள்ளது.
