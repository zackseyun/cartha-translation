  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இரண்டு இணை வினைகளின் தீவிரமும் இதயத்தைப் பற்றிய உடல்சார்ந்த உருவகமும் பாதுகாக்கப்பட்டுள்ளன; ‘துள்ளுகிறது’ என்பது அன்றாட வாசகருக்குப் புரியும்படியும் மூலத்தின் உயிரோட்டத்தைத் தக்கவைக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது.
