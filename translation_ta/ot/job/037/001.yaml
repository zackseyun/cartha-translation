  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: ta
  text: இதற்கும் என் இதயம் நடுங்குகிறது[a]; தன் இடத்திலிருந்து துள்ளுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிர்கிறது”; எபிரெய வினை பயம், பிரமிப்பு அல்லது மனக்கலக்கத்தால் ஏற்படும் நடுக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் இடத்திலிருந்து வெளியே பாய்கிறது”; இதயம் திடீரெனத் தன் இடத்தைவிட்டு பெயர்வதுபோல் எபிரெயச் சொற்றொடர் உயிரோட்டமாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: இதற்கும்
  rationale: אַף என்பதன் இணைப்புப் பொருளையும் לְזֹאת என்பதன் ‘இதைக் கண்டு/இதனால்’ என்ற சுட்டுப் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது; முந்தைய நிகழ்வுடன் வசனத்தை இணைக்கிறது.
- source_word: יֶחֱרַד
  choice: நடுங்குகிறது
  rationale: பயம், பிரமிப்பு அல்லது மனக்கலக்கத்தால் உண்டாகும் அதிர்வை இந்த வினை குறிக்கலாம்; காரணத்தை மிகுதியாகத் தீர்மானிக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: எபிரெய உருவகத்தை நேரடியாகத் தக்கவைத்து, உள்ளார்ந்த உணர்வையும் உடல்சார்ந்த துடிப்பையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: וְיִתַּר
  choice: அது ... துள்ளுகிறது
  rationale: இதயம் திடீரெனவும் வலுவாகவும் அசைவதைச் சித்தரிக்கும் அரிய வினையின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מִמְּקוֹמוֹ
  choice: தன் இடத்திலிருந்து
  rationale: பின்னொட்டு இதயத்தையே சுட்டுவதால் ‘தன்’ என்று வழங்கப்பட்டுள்ளது; இயல்பான இடத்திலிருந்து பெயர்வது போன்ற எபிரெயப் படிமத்தைத் தக்கவைக்கிறது.
