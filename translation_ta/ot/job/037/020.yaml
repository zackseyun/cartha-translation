  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: ta
  text: நான் பேசுவேன் என்று அவரிடம்[a] தெரிவிக்கப்பட வேண்டுமா? ஒரு மனிதன்[b] பேசினால்[c], அவன் நிச்சயமாக விழுங்கப்பட்டுப் போவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல் அப்படியே ‘அவனிடம்’ என உள்ளது; சூழலில் அது கடவுளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஒரு மனிதன்’; இங்கு ‘ஒருவர்’ அல்லது ‘யாராவது’ என்ற பொதுப்பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'இந்த வசனத்தின் எபிரெயத் தொடரியல் கடினமானது. வேறொரு சாத்தியமான மொழிபெயர்ப்பு: ‘நான் பேசுகிறேன் என்று அவரிடம் தெரிவிக்கப்பட வேண்டுமா? அல்லது, தான் விழுங்கப்பட்டுப் போவதாக ஒரு மனிதன் சொல்ல வேண்டுமா?’'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: தெரிவிக்கப்பட வேண்டுமா?
  rationale: ספר என்பதன் செயப்பாட்டு வடிவத்தையும் הֲ குறிக்கும் வினாவையும் இயல்பான தமிழில் ஆளற்ற செயப்பாட்டு வினாவாகத் தருகிறது.
- source_word: לוֹ
  choice: அவரிடம்
  rationale: சூழலில் இது கடவுளைக் குறிப்பதால், மரியாதையும் இயல்பும் கொண்ட தமிழ் ஒருமைப் பதிலிப்பெயர் பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தில் மரியாதையைக் குறிக்கும் தனி வடிவம் இல்லை.
- source_word: כִּי
  choice: என்று
  rationale: முதலாம் இடத்தில், தெரிவிக்கப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֲדַבֵּר
  choice: நான் பேசுவேன்
  rationale: முற்றுப்பெறாத வினைவடிவத்தின் எதிர்நோக்கப்பட்ட அல்லது சாத்தியமான செயலைத் தமிழ் எதிர்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם אָמַר אִישׁ
  choice: ஒரு மனிதன் பேசினால்
  rationale: אִם என்பதன் நிபந்தனை அமைப்பையும் אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவத்தையும் காக்கிறது; אמר இங்கு சூழலுக்கேற்ற பொதுவான ‘பேசு’ என வழங்கப்படுகிறது.
- source_word: כִּי יְבֻלָּע
  choice: அவன் நிச்சயமாக விழுங்கப்பட்டுப்போவான்
  rationale: בלע என்பதன் தெளிவான ‘விழுங்கப்படுதல்’ உருவகத்தைத் தக்கவைத்து, இவ்வாசிப்பில் כִּי தரும் உறுதிப்படுத்தும் வலிமையை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் பதிலிப்பெயர்
  choice: அவரிடம்
  alternative: அவனிடம்
  rationale: எபிரெயப் பதிலிப்பெயரில் தெய்வீக மரியாதைக்கான தனிக் குறியீடு இல்லை; எனினும் சூழலில் குறிக்கப்படுபவர் கடவுள் என்பதால் நவீனத் தமிழில் ‘அவரிடம்’ என்பதே இயல்பும் கண்ணியமும் உடையது.
- issue: אִישׁ என்பதன் பாலின வடிவம்
  choice: ஒரு மனிதன்
  alternative: ஒருவர் / யாராவது
  rationale: மூலத்தின் ஒருமை ஆண்பால் பெயர்ச்சொல்லை முதன்மை உரை காக்கிறது; பொதுப்பொருள் சாத்தியத்தை அடிக்குறிப்பு சுட்டுகிறது.
- issue: வசனத்தின் சிக்கலான தொடரியல்
  choice: இரண்டாம் பகுதியை நிபந்தனை வாக்கியமாகக் காத்தல்
  alternative: ‘அல்லது, தான் விழுங்கப்பட்டுப்போவதாக ஒரு மனிதன் சொல்ல வேண்டுமா?’
  rationale: எபிரெயம் மிகவும் சுருக்கமாகவும் பலவாறு பொருள் கொள்ளத்தக்கதாகவும் உள்ளது. முதன்மை உரை אִם என்பதன் நிபந்தனை வலிமையைத் தக்கவைக்கிறது; வேறொரு சாத்தியமான வாக்கியப் பிரிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல்லாட்சிசார் உருவகமும் வினா–நிபந்தனை அமைப்பும் காக்கப்பட்டுள்ளன; தெளிவில்லாத தொடரியல் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
