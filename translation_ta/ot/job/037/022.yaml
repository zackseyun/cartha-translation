  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: ta
  text: வடக்கிலிருந்து பொன்னொளி வருகிறது; கடவுள்மேல் அச்சமூட்டும் மாட்சிமை உள்ளது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுள்மேல்” என்பதற்கு “கடவுளைச் சூழ்ந்து” என்றும் பொருள் கொள்ளலாம்.
    reason: עַל என்ற எபிரெய முன்னிடைச்சொல்லின் இடவியல் பொருள் இவ்விடத்தில் விளக்க ரீதியாகத் தெளிவற்றதாக இருப்பதைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: வடக்கிலிருந்து
  rationale: மִן முன்னொட்டின் மூலத்திசைப் பொருளையும் צָפוֹן என்பதன் ‘வடக்கு’ என்ற வழக்கமான பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: זָהָב
  choice: பொன்னொளி
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘பொன்’; இங்கு வானியல் ஒளித்தோற்றத்தின் சூழலில் ‘பொன்னொளி’ என்பது ‘பொன்/தங்கம் வருகிறது’ என்ற இயல்பற்ற தமிழைத் தவிர்த்து, உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יֶאֱתֶה
  choice: வருகிறது
  rationale: אָתָה வினையின் எளிய இயக்கப் பொருளை நிகழ்காலத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: עַל אֱלוֹהַּ
  choice: கடவுளைச் சூழ்ந்து
  rationale: עַל என்பதன் விரிந்த பொருள் எல்லையில் ‘மேல்/சுற்றிலும்/உடன்’ என்பவை சாத்தியம்; இவ்விடத்தில் மாட்சிமை கடவுளைச் சூழ்ந்திருப்பதாக இயல்பான தமிழில் தரப்படுகிறது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: נוֹרָא הוֹד
  choice: அச்சமூட்டும் மாட்சிமை
  rationale: נוֹרָא-வின் பயபக்தியும் அச்சமும் எழுப்பும் தன்மையையும் הוֹד-இன் மேன்மை/மாட்சிமையையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: עַל אֱלוֹהַּ என்ற சொற்றொடரின் தொடர்பு
  choice: கடவுளைச் சூழ்ந்து
  alternative: கடவுள்மேல் / கடவுளிடத்தில்
  rationale: இலக்கண ரீதியாக முன்னிடைச்சொல் பலவாறு புரியக்கூடியதால் ஓர் இறையியல் விளக்கத்தைத் திணிக்காமல், முதன்மை உரையில் இயல்பான இடவியல் வாசிப்பையும் அடிக்குறிப்பில் மாற்றுகளையும் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவித்துவ மரியாதையுடன்வும் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வடிவமைக்கப்பட்டது. ‘பொன்னொளி’ வானியல் சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘அச்சமூட்டும் மாட்சிமை’ மூலத்தின் பயபக்தி நிறைந்த வலிமையைத் தக்கவைக்கிறது.
