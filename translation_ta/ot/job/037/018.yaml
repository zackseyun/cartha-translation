source:
  edition: WLC
  text: תַּרְקִ֣יעַ עִ֭מּ/וֹ לִ/שְׁחָקִ֑ים חֲ֝זָקִ֗ים כִּ/רְאִ֥י מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: ta
  text: வார்க்கப்பட்ட உலோகக் கண்ணாடியைப்போல் கடினமான வானங்களை,[b] அவரோடு சேர்ந்து, நீ விரித்துப் பரப்ப[a] முடியுமா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விரித்துப் பரப்ப’ என்பதற்கு மாற்றாக, ‘தட்டி விரிக்க’ அல்லது ‘நீட்டி விரிக்க’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் உலோகத்தைத் தட்டி மெல்லியதாக்குவதையும், ஒன்றை விரித்துப் பரப்புவதையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘வானங்கள்’ என்பதற்கு மாற்றாக, ‘விண்ணுலகங்கள்’ அல்லது ‘மேகங்கள்’ என்றும் மொழிபெயர்க்கலாம். שׁחקים என்ற எபிரெயக் கவிதைச்சொல் வானங்கள்/விண்ணுலகங்கள் என்றும், சில சூழல்களில் மேகங்கள் என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, ‘வார்க்கப்பட்ட கண்ணாடியைப்போல்.’ இது பழங்காலத்தில் உலோகத்தால் செய்யப்பட்ட, ஒளிரும் கண்ணாடியை ஒத்த திடமான வானம் என்ற படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: விரித்துப் பரப்ப
  rationale: רקע என்பதன் ஹிஃபில் வடிவம் ஒன்றை, குறிப்பாக உலோகத்தை, அடித்தோ விரித்தோ மெல்லியதாகப் பரப்புவதைக் குறிக்கலாம். வானம் வார்க்கப்பட்ட கண்ணாடியுடன் ஒப்பிடப்படுவதால் உலோக வேலைப்பாட்டின் பின்னணி உள்ளது; அதேவேளை நவீன தமிழில் இயல்பாகப் புரிய ‘விரித்துப் பரப்ப’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עִמּוֹ
  choice: அவரோடு சேர்ந்து
  rationale: எபிரெய உரையில் ‘அவரோடு’ என்ற சுட்டுப்பெயரே உள்ளது; சூழலில் அது கடவுளைக் குறித்தாலும், மூலத்தின் மறைமுகக் குறிப்பைத் தக்கவைத்திருக்கிறது. ‘சேர்ந்து’ என்பது கேள்வியின் இயல்பான தமிழ் ஓட்டத்தை அளிக்கிறது.
- source_word: לִשְׁחָקִים
  choice: வானங்களை
  rationale: שׁחקים என்பது கவிதைச் சொல்லாக வானங்கள் அல்லது மேகங்களைக் குறிக்கலாம். வார்ப்புக் கண்ணாடி என்ற உவமை இங்கு கண்முன் விரியும் வானத்தையே சுட்டுவதால் ‘வானங்களை’ பொருத்தமானது; மூலத்தின் பன்மையும் தக்கவைக்கப்பட்டது.
- source_word: חֲזָקִים
  choice: கடினமான
  rationale: இந்தப் பெயரடை வானங்களின் உறுதியை வார்க்கப்பட்ட உலோகக் கண்ணாடியின் கடினத்தன்மையுடன் இணைக்கிறது. ஆகவே ‘வலிமையான’ அல்லது ‘உறுதியான’ என்பதைக் காட்டிலும் ‘கடினமான’ உவமைக்கு நேர்த்தியாகப் பொருந்துகிறது.
- source_word: כִּרְאִי
  choice: கண்ணாடியைப்போல்
  rationale: רְאִי என்பது முகம் பார்க்கும் கண்ணாடி; כְּ முன்னொட்டு ஒப்புமையைக் குறிக்கிறது. ‘கண்ணாடியைப்போல்’ என்பது அந்த உவமையை இயல்பான தமிழில் தருகிறது.
- source_word: מוּצָק
  choice: வார்ப்புக்
  rationale: מוּצָק என்பது உருக்கி ஊற்றி வார்க்கப்பட்ட ஒன்றை, குறிப்பாக உலோகப் பொருளைக் குறிக்கிறது. உலோக வகையை மூல உரை குறிப்பிடாததால் ‘வெண்கலம்’ எனத் தேவையின்றிக் குறிப்பாக்காமல் ‘வார்ப்புக் கண்ணாடி’ என்று மொழிபெயர்க்கப்பட்டது.
