translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநயமும் மரியாதைத் தொனியும் காக்கப்பட்டுள்ளன. ‘அவரோடு’ என்ற மூன்றாம் நபர் சுட்டு மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது; ‘உன்னால் முடியுமா?’ என்பது நேரடியான வினாவை இயல்பாக வழங்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
