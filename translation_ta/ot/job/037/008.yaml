translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான கவிதைநடை. எபிரெயப் பன்மையான ‘உறைவிடங்களில்’ பாதுகாக்கப்பட்டுள்ளது. ‘பதுங்கிடம்’ மற்றும் ‘உறைவிடம்’ ஆகியவை மூலத்தின் இணைநிலையைத் தக்கவைத்தபடியே தேவையற்ற ஒரேசொல் மீளுரையைத் தவிர்க்கின்றன.
