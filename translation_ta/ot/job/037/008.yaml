  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תָּבֹ֣א חַיָּ֣ה בְמוֹ אָ֑רֶב וּ/בִ/מְע֖וֹנֹתֶ֣י/הָ תִשְׁכֹּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/008.yaml
  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: ta
  text: அப்போது காட்டுவிலங்கு தன் பதுங்கிடத்திற்குள் சென்று, தன் உறைவிடங்களில் தங்குகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא
  choice: அப்போது ... சென்று
  rationale: בוא என்பதன் Qal wayyiqtol வடிவம் கவிதை வரிசையை முன்னெடுக்கிறது. இயற்கை நிகழ்வுகளை உயிரோட்டமாக விவரிக்கும் சூழலில், ‘அப்போது ... சென்று’ என்பது தொடர்ச்சியையும் நிகழ்காலத் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: חַיָּה
  choice: காட்டுவிலங்கு
  rationale: חַיָּה என்பது பொதுவாக விலங்கையோ குறிப்பாகக் காட்டு விலங்கையோ குறிக்கலாம். வானிலையிலிருந்து ஒதுங்கும் அடக்கப்படாத உயிரினத்தை இங்கு பொதுப்படையாகக் குறிப்பதால் ‘காட்டுவிலங்கு’ பொருத்தமானது.
- source_word: בְמוֹ אָרֶב
  choice: தன் பதுங்கிடத்திற்குள்
  rationale: אָרֶב பதுங்கியிருக்கும் அல்லது மறைந்திருக்கும் இடத்தைக் குறிக்கிறது. ‘பதுங்கிடம்’ என்பது வெறும் இருப்பிடத்தைவிட மறைவான பாதுகாப்பிடத்தின் நுணுக்கத்தைத் தக்கவைக்கிறது; בְּ என்பதன் இயக்கச் சூழலை ‘-க்குள்’ வெளிப்படுத்துகிறது.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: தன் உறைவிடங்களில்
  rationale: מְעוֹנוֹת என்பது உறையும் இடங்களைக் குறிக்கும் பன்மைச் சொல். ‘உறைவிடங்கள்’ பன்மையைத் தக்கவைத்து, ‘குகைகள்’ என்று பொருளைத் தேவையின்றிக் குறுக்காமல் பொதுவான விலங்கு வாழிடங்களைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு தமிழில் இயல்பாக ‘தன்’ எனத் தரப்படுகிறது.
- source_word: תִשְׁכֹּן
  choice: தங்குகிறது
  rationale: שכן என்பது தங்குதல் அல்லது குடியிருத்தலைக் குறிக்கிறது. புயல் அல்லது குளிரிலிருந்து ஒதுங்கிய பின் அங்கேயே இருப்பதை ‘தங்குகிறது’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
