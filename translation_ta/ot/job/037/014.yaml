id: JOB.37.14
reference: Job 37:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: ta
  text: யோபே, இதற்குச் செவிகொடு; நில்; கடவுளின் அதிசயங்களைச் சிந்தித்துப் பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: செவிகொடு
  rationale: அதிகவனத்துடன் கேட்கும்படி அழைக்கும் கட்டளை வடிவத்தை இயல்பான, கண்ணியமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: זֹּאת
  choice: இதற்கு
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் அருகிலுள்ள அல்லது தொடர்ந்து சொல்லப்படுகிற கருத்தைக் குறிப்பதைத் தமிழின் இயல்பான வேற்றுமை வடிவில் காட்டுகிறது.
- source_word: אִיּוֹב
  choice: யோபே
  rationale: பெயரைத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ப ஒலிபெயர்த்து, நேரடி அழைப்பைக் காட்ட அழைப்புவேற்றுமையில் தருகிறது.
- source_word: עֲמֹד
  choice: அசையாமல் நின்று
  rationale: அடிப்படைப் பொருள் ‘நில்’; அடுத்த கட்டளையுடன் சேரும் சூழலில், கவனிப்பதற்காக நின்று நிலைபெறு என்ற நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִתְבּוֹנֵן
  choice: சிந்தித்துப் பார்
  rationale: கவனமாக ஆராய்தல், மனத்தில் ஆழ்ந்து எண்ணுதல் என்ற Hitpolel கட்டளையின் வலிமையை பொதுவாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
- source_word: נִפְלְאוֹת
  choice: வியத்தகு செயல்கள்
  rationale: פלא வேர் சார்ந்த பன்மைச் சொல் வியப்பூட்டும் செயல்கள் அல்லது அதிசயங்கள் எனப் பொருள்படலாம்; இங்கு செயற்பாட்டு நுணுக்கத்தைத் தெளிவாக்குகிறது, ஆனால் மாற்று வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இச்சூழலில் பொதுவான தெய்வக் குறிப்பு; ‘வல்லமையுள்ள கடவுள்’ போன்ற கூடுதல் பொருளைச் சேர்க்காமல் எளிய தமிழ் இணையைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: אֵל என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: வல்லமையுள்ள கடவுள்
  rationale: எபிரெயச் சொல் இங்கு கடவுளைக் குறிக்கிறது; வல்லமை என்ற விளக்கத்தை வெளிப்படையாகச் சேர்க்க வேண்டிய சூழல் இல்லை. ஆகவே கருத்தியல் மிகைப்பைத் தவிர்த்து எளிய வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: נִפְלְאוֹת என்பது பொருட்களையா செயல்களையா குறிக்கிறது
  choice: வியத்தகு செயல்கள்
  alternative: அதிசயங்கள்
  rationale: இந்தப் பன்மைப் பெயர் கடவுளின் வியப்பூட்டும் செயல்களைக் குறிக்கக்கூடும்; எனினும் ‘அதிசயங்கள்’ என்ற பரந்த வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடி அழைப்பில் ‘யோபே’ என்றும், கட்டளைகளில் கண்ணியமான ஒருமை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. கவிதைநடையின் செறிவைத் தக்கவைத்தபடி பொதுவாசகருக்குப் புரியும் இயல்பான சொற்றொடர்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
