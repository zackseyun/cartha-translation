source:
  edition: WLC
  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: ta
  text: அப்படியானால், அழுகற்புழுவாகிய மனிதன் எவ்வளவு குறைவாக! புழுவாகிய மனித மகன் எவ்வளவு குறைவாக!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי
  choice: அப்படியிருக்க, … எம்மாத்திரம்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் வலியுறுத்தும் ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மனிதனின் நிலை அதைவிட எவ்வளவோ தாழ்ந்தது என்ற உட்கருத்தைத் தக்கவைக்கிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: ஒரு பிரதிநிதி மனிதனை ஒருமையில் குறிக்கிறது; இச்சொல்லில் உள்ள மனித பலவீனத்தின் நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רִמָּה
  choice: அழுகற்புழு
  rationale: அழுகும் பொருளோடு தொடர்புடைய maggot/grub என்ற குறிப்பான பொருளைத் தருகிறது; அடுத்துள்ள பொதுவான ‘புழு’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: בֶן אָדָם
  choice: மனித மகன்
  rationale: எபிரெயக் கவிதைத் தொடரின் வடிவத்தைத் தக்கவைத்தபடி, இங்கு ஒரு மனிதனைச் சுட்டும் இணைச்சொல்லாக மொழிபெயர்க்கப்படுகிறது.
- source_word: תּוֹלֵעָה
  choice: புழு
  rationale: பொதுவான worm என்ற பொருளை இயல்பான தமிழில் தருவதோடு, רִמָּה என்பதற்கான குறிப்பான மொழிபெயர்ப்பிலிருந்து வேறுபடுத்துகிறது.
theological_decisions:
- issue: ‘மனித மகன்’ என்பது மேசியாவைக் குறிக்கும் பட்டமா அல்லது ஒரு மனிதனைக் குறிக்கும் கவிதைத் தொடரா?
  choice: ஒரு மனிதனைக் குறிக்கும் பட்டமல்லாத கவிதைத் தொடர்
  alternative: மேசியாவைக் குறிக்கும் பட்டம்
  rationale: בֶן אָדָם இங்கு אֱנוֹשׁ என்பதற்கு இணையாக வந்து மனிதரின் நிலையையும் பலவீனத்தையும் குறிக்கிறது; மேசியாவைக் குறிக்கும் பட்டமாகப் பயன்படுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பும் ‘அழுகற்புழு / புழு’ என்ற சொல் வேறுபாடும் காக்கப்பட்டுள்ளன; ‘எம்மாத்திரம்’ என்பது முந்தைய வசனத்தோடு இணையும் வலியுறுத்தும் ஒப்பீட்டைச் சுருக்கமாக வெளிப்படுத்துகிறது.
