  verdict: revise
  source_fidelity: The two rhetorical questions, the relational sense of ‘with/before God,’ and the parallel predicates ‘be righteous’ and ‘be pure/clean’ are conveyed faithfully. ‘அப்படியானால்’ acceptably represents the contextual connective force.
