  terminology: ‘மனிதன்,’ ‘கடவுளுக்கு முன்பாக,’ ‘நீதிமானாக,’ and ‘தூயவனாக’ are suitable, dignified modern-standard Tamil equivalents that preserve the verse’s theological and poetic register without imposing a doctrinal interpretation.
