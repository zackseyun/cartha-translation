  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: ta
  text: அப்படியானால், மனிதன் கடவுளுக்கு முன்பாக எப்படி நீதிமானாக இருக்க முடியும்?[a] பெண்ணுக்குப் பிறந்தவன் எப்படி தூயவனாக இருக்க முடியும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுடன்.’ எபிரெயத்தில் சொல்லுக்கு சொல் ‘கடவுளுடன்’ என்று உள்ளது; ஆனால் இச்சொற்றொடர் கடவுளுக்கு முன்பாக ஒருவரின் நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சுத்தமானவனாக’ அல்லது ‘குற்றமற்றவனாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: அப்படியானால், ... எப்படி
  rationale: இணைப்புச் சொல்லுடன் வரும் מַה இங்கு வினாவிடை எதிர்பாராத சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது. சூழலுடனான தொடர்பை ‘அப்படியானால்’ இயல்பாகக் காட்டுகிறது; ‘எப்படி’ அதன் வழக்குப் பொருளைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: יִצְדַּק
  choice: நீதிமானாக இருக்க முடியும்
  rationale: צדק என்பதன் Qal வடிவம் கடவுளுடன் தொடர்புடைய நிலையில் நீதியுள்ளவனாக அல்லது சரியானவனாக இருப்பதைக் குறிக்கிறது. ‘நீதிமானாக’ என்பது விளைவு/நிலை சார்ந்த பொருளைக் காக்கிறது; ‘நீதிமானாக்கப்படுதல்’ என்ற பிற்கால சட்டவியல் நுணுக்கத்தைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: אֱנוֹשׁ மனிதனின் நிலையற்ற, பலவீனமான இயல்பைச் சுட்டினாலும், இந்த இணைவாக்கியத்தில் பொதுவான மனிதனைக் குறிக்கும் ‘மனிதன்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עִם אֵל
  choice: கடவுளுக்கு முன்பாக
  rationale: எபிரெயத்தில் சொல்லுக்கு சொல் ‘கடவுளுடன்’ என்றாலும், இங்கு கடவுளின் முன்னிலையில் மனிதனின் நீதிநிலையை வினவும் தொடர்பியல்/நீதிமன்ற நிழற்பொருள் உள்ளது. ‘கடவுளுக்கு முன்பாக’ அதை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: יִזְכֶּה
  choice: தூயவனாக இருக்க முடியும்
  rationale: זכה என்பதன் Qal வடிவம் தூய்மை, சுத்தம், குற்றமின்மை ஆகிய பொருள் எல்லைகளைக் கொண்டது. ‘தூயவன்’ முதல் அடியின் ‘நீதிமான்’ என்பதுடன் இயல்பாக இணைந்து, பொருளை சட்டரீதியான குற்றமின்மைக்குள் மட்டும் சுருக்குவதில்லை.
- source_word: יְלוּד אִשָּׁה
  choice: பெண்ணிடம் பிறந்தவன்
  rationale: இது மனிதப் பிறப்பையும் படைப்பின் வரம்புக்குட்பட்ட நிலையையும் குறிக்கும் மரபுத்தொடர். ‘பெண்ணிடம் பிறந்தவன்’ அதன் ஒருமை வடிவத்தையும் பொதுமனிதப் பொருளையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: மனிதகுலத்தைக் குறிக்கும் பொதுமை ஒருமை
  choice: மனிதன் ... பெண்ணிடம் பிறந்தவன்
  alternative: மனிதர் ... பெண்ணிடம் பிறந்த எவரும்
  rationale: எபிரெயம் ஆண்பால் ஒருமை வடிவங்களைப் பொதுவாக மனிதகுலத்தைக் குறிக்கப் பயன்படுத்துகிறது. தமிழில் ‘மனிதன்’ மற்றும் மரபுத்தொடரான ‘பெண்ணிடம் பிறந்தவன்’ அந்த பிரதிநிதித்துவ ஒருமையையும் கவிதை இணைவையும் காக்கின்றன.
- issue: கடவுளுடனான தொடர்பில் மனிதனின் நீதிநிலை
  choice: கடவுளுக்கு முன்பாக
  alternative: கடவுளுடன்
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்’; ஆனால் இக்கேள்வி கடவுளின் முன்னிலையில் மனிதன் நீதியுள்ளவனாக இருக்க இயலுமா என்பதைக் கேட்கிறது. தேர்ந்த மொழிபெயர்ப்பு நீதிமன்ற நிழற்பொருளை அனுமதிக்கிறது; அதேவேளை குறிப்பிட்ட நீதிமானாக்குதல் கோட்பாட்டைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு சொல்லாட்சிக் கேள்விகளின் இணை அமைப்பும் ஒருமை வடிவமும் காக்கப்பட்டுள்ளன; ‘இயலும்’ என்பதற்குப் பதிலாக இயல்பான பேச்சு-எழுத்து நடையான ‘இருக்க முடியும்’ பயன்படுத்தப்பட்டுள்ளது.
