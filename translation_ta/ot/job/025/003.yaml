    reason: lexical_alternative
  - marker: c
    text: “அவருடைய ஒளி” என்பது கடவுளின் எல்லாரையும் எட்டும் ஒளியூட்டுதல், மகிமை, அல்லது ஆளுகையின் வீச்சைக் குறிக்கலாம்; எபிரெயம் இதை இன்னும் குறுகலாக வரையறுக்கவில்லை.
