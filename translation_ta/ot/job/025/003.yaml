theological_decisions:
- issue: ‘அவருடைய படைப்பிரிவுகள்’, ‘அவருடைய ஒளி’ என்பவற்றிலுள்ள ஒருமை ஆண்பால் சுட்டின் குறிப்பு
  choice: முந்தைய வசனச் சூழலில் கடவுளைக் குறிக்கும் சுட்டுப்பெயராகவே வைக்கப்பட்டது.
  alternative: பொதுவான ஒரு விண்ணுலக ஆட்சியாளரைக் குறிக்கும் வாசிப்பு.
  rationale: யோபு 25:2-இல் பில்தாத் கடவுளுடைய ஆட்சியையும் அச்சமூட்டும் மேன்மையையும் பற்றிப் பேசுகிறார். இருப்பினும், மூலத்தைப் போலவே ‘கடவுளுடைய’ என்று விரிவாக்காமல் ‘அவருடைய’ என வைத்ததால் சுட்டின் வடிவம் பாதுகாக்கப்படுகிறது.
- issue: ‘அவருடைய ஒளி’ என்பதன் பொருள்
  choice: எல்லார்மேலும் விரியும் கடவுளுடைய ஒளி என்ற பரந்த உருவகம்; அதன் துல்லிய இயல்பு குறிப்பிடப்படவில்லை.
  alternative: குறிப்பாகச் சூரியஒளி; தெய்வீக மகிமை; அல்லது அருள்/செல்வாக்கு.
  rationale: எபிரெயச் சொல் வெறுமனே ‘ஒளி’ என்று கூறுகிறது. அது இயற்கை ஒளியா, மகிமையா, அல்லது கடவுளின் எங்கும் எட்டும் ஆற்றலா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கவிதைநயமுள்ள கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘படைப்பிரிவுகள்’ இராணுவ உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; ‘உதிப்பதில்லை’ ஒளியுடன் இயல்பாக இணைகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
