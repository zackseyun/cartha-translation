source:
  edition: WLC
  text: הַמְשֵׁ֣ל וָ/פַ֣חַד עִמּ֑/וֹ עֹשֶׂ֥ה שָׁ֝ל֗וֹם בִּ/מְרוֹמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: ta
  text: ஆட்சியும் அச்சமும் அவரோடு உள்ளன[a]; அவர் தமது உயரிடங்களில் சமாதானத்தை ஏற்படுத்துகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்சியும் அச்சமும் அவருக்குரியவை.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தமது உயரங்களில்”; இச்சொற்றொடர் உயர்ந்த விண்ணுலக மண்டலத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: ஆட்சி
  rationale: மָשַׁל வேரிலிருந்து வரும் இப்பெயர்ச்சொல் ஆளுகை அல்லது ஆட்சியைக் குறிக்கிறது. சுருக்கமான பெயர்ச்சொல் நடையையும் இணை அமைப்பையும் ‘ஆட்சி’ இயல்பாகக் காக்கிறது.
- source_word: וָפַחַד
  choice: அச்சமும்
  rationale: פחד என்பது பயம், அச்சம், திகில் ஆகிய பொருள்களைக் கொண்டது. இங்கு இறைமாட்சியால் எழும் ஆழ்ந்த அச்சத்தை மிகைப்படுத்தாமல் ‘அச்சம்’ வெளிப்படுத்துகிறது; வாவ் இணைப்பை ‘-உம்’ குறிக்கிறது.
- source_word: עִמּוֹ
  choice: அவரோடு உள்ளன
  rationale: இச்சொற்றொடரின் நேரடியான பொருள் ‘அவரோடு’ என்பதாகும். வினையற்ற எபிரெய வாக்கியத்தைத் தமிழில் இயல்பாக்க ‘உள்ளன’ சேர்க்கப்பட்டுள்ளது; உடைமைப் பொருள் சாத்தியமாயினும் அதையே மட்டும் நிர்ணயிக்கவில்லை.
- source_word: עֹשֶׂה
  choice: அவர் ... உண்டாக்குகிறார்
  rationale: עשה என்பதன் பங்கேற்புவினை இங்கு தேவனுடைய வழக்கமான அல்லது தொடர்ச்சியான செயலைக் குறிக்கும் வினையாகச் செயல்படுகிறது. ‘உண்டாக்குகிறார்’ என்பது அடிப்படை வினையின் பரந்த பொருளைக் காக்கிறது.
- source_word: שָׁלוֹם
  choice: சமாதானத்தை
  rationale: שׁלום என்பது சமாதானம், நலம், முழுமை போன்ற பொருள்களைக் கொள்ளலாம். விண்ணுலகச் சூழலில் ‘சமாதானம்’ இயல்பானதும் பரந்த இறையியல் விளக்கத்தைத் திணிக்காததுமாகும்.
- source_word: בִּמְרֹמָיו
  choice: தமது உயரிடங்களில்
  rationale: מָרוֹם என்பது உயரம் அல்லது உயர்ந்த இடத்தைக் குறிக்கும்; பன்மை உடைமை வடிவம் ‘அவருடைய உயரிடங்களில்’ எனப் பொருள்படும். தமிழில் எழுவாயோடு பொருந்த ‘தமது’ பயன்படுத்தப்பட்டுள்ளது. இது ‘வானங்களில்’ என்று பொருளைச் சுருக்காமல் கவித்துவப் படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: தொடக்க வினையற்ற வாக்கியத்தின் தன்மை
  choice: ஆட்சியும் அச்சமும் தேவனோடு உள்ள பண்புகள் எனக் கூறுதல்
  alternative: ஆட்சியும் அச்சமும் அவருக்குரியவை என உடைமைப் பொருளில் கூறுதல்
  rationale: எபிரெய வினையற்ற வாக்கியம் உடனிருப்பு அல்லது சார்பு உணர்வையும் உடைமை உணர்வையும் அனுமதிக்கிறது. முதன்மை உரை ‘அவரோடு உள்ளன’ என்று நேரடியான அமைப்பைக் காத்து, உடைமைப் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் கவித்துவ நடை. ‘அவரோடு உள்ளன’ மூலம் மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மை காக்கப்படுகிறது; ‘உயரிடங்கள்’ மூலம் விண்ணுலகம் என்ற விளக்கம் முதன்மை உரையில் திணிக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
