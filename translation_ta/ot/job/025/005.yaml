  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: ta
  text: இதோ, சந்திரன்கூட ஒளிவிடுவதில்லை[a]; நட்சத்திரங்களும் அவருடைய பார்வையில் தூய்மையானவை அல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திரன் பிரகாசமாக இல்லை” அல்லது “ஒளி தருவதில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நட்சத்திரங்கள் அவருடைய பார்வையில் சுத்தமானவை அல்ல”; ஒருவேளை, “பிரகாசமானவை அல்ல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கருத்தை வலியுறுத்தும் எபிரெயக் கவிதைச் சொல்லின் உயர்வான தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: עַד
  choice: கூட
  rationale: இங்கு இடம் அல்லது கால எல்லையைக் குறிக்காமல், சந்திரனையே வலியுறுத்தும் ‘even’ என்ற பொருளில் வருகிறது.
- source_word: יָרֵחַ
  choice: சந்திரன்
  rationale: குறிப்பிடப்பட்டுள்ள விண்பொருளை நேரடியாகவும் பொதுவாகப் புரியும் வகையிலும் தருகிறது.
- source_word: לֹא יַאֲהִיל
  choice: ஒளிவிடுவதில்லை
  rationale: இவ்விடத்தில் அச்சொல் ஒளி தருதல் அல்லது பிரகாசித்தல் என்பதைக் குறிக்கிறது; ‘ஒளிவிடுவதில்லை’ என்பது இயல்பான நவீனத் தமிழாகவும் கவிதை ஒப்பீட்டுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְכוֹכָבִים
  choice: நட்சத்திரங்களும்
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சியையும் விண்பொருள் உருவகத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: לֹא זַכּוּ
  choice: தூய்மையானவை அல்ல
  rationale: வேர் தூய்மை, சுத்தம், அல்லது பிரகாசம் ஆகிய கருத்துகளைத் தரக்கூடும். ‘அவருடைய பார்வையில்’ என்ற மதிப்பீட்டுச் சூழலில் ‘தூய்மை’ முதன்மைப் பொருளைத் தருகிறது; ‘பிரகாசம்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְעֵינָיו
  choice: அவருடைய பார்வையில்
  rationale: ஒருவருடைய மதிப்பீட்டில் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, உருவகத்தின் கருத்தை இழக்காமல் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: בְעֵינָיו என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதியின் குறிப்பு
  choice: ‘அவருடைய’ என்பது கடவுளைக் குறிக்கிறது
  alternative: கவிதை வாதத்தில் குறிப்பிடப்படாத ஒரு பார்வையாளரைக் குறிக்கலாம்
  rationale: யோபு 25:2–6 சூழலில் பில்தாத் கடவுளின் மேன்மையையும் அவர்முன் படைப்புகளின் தூய்மையின்மையையும் பேசுவதால், இந்த ஒருமை விகுதி இயல்பாகக் கடவுளையே குறிக்கிறது. பெயரை வசனத்தில் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் சுட்டுப்பெயர் வடிவம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கவிதைக்குரிய கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘அவருடைய’ என்பது கடவுளைக் குறிக்கும் மரியாதை ஒருமையாக வாசிக்கப்படுகிறது.
