  text: 'Then Bildad the Shuhite answered and said:'
translation:
  language: ta
  text: 'அப்போது சூகியனான பில்தாத் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினைச்சொல் இவ்வுரையாடல் அறிமுகச் சூத்திரத்தில் ‘பதிலளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படும். அடுத்துள்ள ‘சொன்னான்’ என்பதோடு இயல்பாக இணைவதற்காக வினையடை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בִּלְדַּד
  choice: பில்தாது
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் மரபான ஒலிபெயர்ப்பு.
- source_word: הַשֻּׁחִי
  choice: சூகியனான
  rationale: இது பில்தாதின் குலம் அல்லது பூர்வீக இடத்தைக் குறிக்கும் இன/இட அடைமொழி. שׁוּחַ (சூவா) என்பதோடு தொடர்புடைய வடிவத்தை ‘சூகியன்’ என ஒலிபெயர்த்து, பெயருடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: אמר என்ற பொதுவான உரையறிமுக வினைக்கு நேரான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாகச் சொன்னான்
  rationale: ‘பதிலளித்து சொன்னான்’ என்ற சொற்சொறான அமைப்பு தமிழில் சற்றே செயற்கையாக இருப்பதால், எபிரெயத்தின் இரு கூறுகளையும் காத்து இயல்பான உரையறிமுகமாக வழங்கப்பட்டது.
- source_word: וַ־
  choice: அப்போது
  rationale: தொடக்க வாவ் உரையாடலின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; ‘அப்போது’ அந்தத் தொடர்ச்சியை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
