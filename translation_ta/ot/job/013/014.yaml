  yaml_path: translation/ot/job/013/014.yaml
  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: ta
  text: எதற்காக என் சதையைப் பற்களால் பிடித்துக்கொண்டு, என் உயிரை என் உள்ளங்கையில் வைக்க வேண்டும்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சதையை என் பற்களுக்குள் எடுத்துக்கொண்டு.” இந்த எபிரெய மரபுத்தொடர் பொருள் காண்பதற்குக் கடினமானது; தன்னையே துணிந்து ஆபத்துக்கு உட்படுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் ஆன்மாவை” அல்லது “என்னையே.” எபிரெய மொழியிலுள்ள நெஃபெஷ் என்ற சொல் “உயிர்,” “ஆன்மா,” அல்லது “தானே” என்பதைக் குறிக்கலாம்; இங்கு தன் உயிரை ஆபத்துக்கு உட்படுத்தும் கருத்துக்கு “உயிர்” மிகப் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: எதற்காக ... வேண்டும்?
  rationale: இது நோக்கம் அல்லது காரணத்தை வினவும் வலியுறுத்தலான கேள்வி. நவீன தமிழில் இயல்பான கேள்வி வடிவத்தைத் தருகிறது.
- source_word: אֶשָּׂא
  choice: ஏந்திக்கொண்டு
  rationale: נשא என்பதன் ‘தூக்கு, சும, ஏந்து’ என்ற அடிப்படைப் பொருளையும், அடுத்த வினையோடு இணையும் எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: בְשָׂרִי
  choice: என் சதையை
  rationale: ‘உடல்’ என்று பொருளை மிருதுவாக்காமல், בשר என்பதன் நேரடியான ‘சதை’ என்ற உயிர்ப்புள்ள உருவகத்தைப் பேணுகிறது.
- source_word: בְשִׁנָּי
  choice: என் பற்களில்
  rationale: ב முன்னிடைச்சொல்லின் இடப்பொருளையும் கடினமான எபிரெய சொற்றொடரின் உருவகத்தையும் அப்படியே காக்கிறது; ‘பற்களால்’ என்பதும் சாத்தியம் என அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנַפְשִׁי
  choice: என் உயிரை
  rationale: נפש என்பதற்கு ‘உயிர், ஆத்துமா, தன்’ எனப் பொருள் வரலாம்; இங்கு உயிரை ஆபத்துக்கு உட்படுத்தும் இணைச் சொற்றொடரில் ‘உயிர்’ மிக இயல்பாகப் பொருந்துகிறது.
- source_word: אָשִׂים
  choice: வைக்க வேண்டும்
  rationale: שׂים என்பதன் ‘வை, இடு’ என்ற பொருளை இயல்பான தமிழ் வினாவாக்கியத்தில் வெளிப்படுத்துகிறது.
- source_word: בְכַפִּי
  choice: என் உள்ளங்கையில்
  rationale: כף என்பதன் துல்லியமான உடற்கூறு பொருள் ‘உள்ளங்கை’; உயிரை ஆபத்துக்குள்ளாக்கும் உருவகத்தைத் தெளிவாகப் பேணுகிறது.
