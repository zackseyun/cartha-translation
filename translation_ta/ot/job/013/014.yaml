  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வசனத்தின் இரண்டு கடினமான எபிரெய உருவகங்களும் விளக்கமாக மாற்றப்படாமல் பிரதான உரையில் பேணப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
