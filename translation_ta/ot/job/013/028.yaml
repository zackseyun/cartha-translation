  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவிதைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அவனோ’ என்ற வடிவம் எபிரெய இணைப்பின் நுணுக்கத்தை இயல்பாகக் காட்டுகிறது. இரு சிதைவு உருவகங்களையும் இணைக்க ‘சிதைந்துபோகிறான்’ பயன்படுத்தப்பட்டுள்ளது.
