  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: ta
  text: அவனோ அழுகிய பொருளைப்போல் தேய்ந்துபோகிறான்[a]; அந்துப்பூச்சி அரித்த ஆடையைப்போல் தேய்ந்துபோகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனோ அழுகலைப்போல் தேய்ந்துபோகிறான்; அந்துப்பூச்சி அரித்த ஆடையைப்போல் தேய்ந்துபோகிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அவனோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் முந்தைய சூழலிலுள்ள மனிதனை மீண்டும் முன்னிறுத்துகிறது. ‘அவனோ’ என்பது ‘அவனைப் பொறுத்தவரை’ என்ற நுணுக்கத்தையும் கவிதைநடையின் தொடர்ச்சியையும் இயல்பாகத் தருகிறது.
- source_word: כְּרָקָב
  choice: அழுகிய பொருளைப்போல்
  rationale: רָקָב என்பது அழுகல், சிதைவு, அழுகிய நிலை ஆகியவற்றைக் குறிக்கிறது. உருவகத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்த ‘அழுகிய பொருளைப்போல்’ என மொழிபெயர்க்கப்பட்டது; ‘அழுகலைப்போல்’ என்ற சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִבְלֶה
  choice: சிதைந்துபோகிறான்
  rationale: בלה என்பது தேய்ந்துபோதல், நைந்துபோதல் அல்லது படிப்படியாக அழிதல் எனப் பொருள்படும். அழுகிய பொருளும் பூச்சி அரித்த ஆடையும் தரும் இரு படிமங்களுக்கும் ‘சிதைந்துபோகிறான்’ பொருந்துகிறது.
- source_word: כְּבֶגֶד
  choice: ஆடையைப்போல்
  rationale: בֶּגֶד என்பது பொதுவாக ஓர் ஆடை அல்லது உடையைக் குறிக்கிறது. ஒருமையையும் கவிதைப் படிமத்தையும் ‘ஆடை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲכָלוֹ
  choice: அரித்த
  rationale: אכל என்பதன் ‘தின்றது/உண்டது’ என்ற அடிப்படை உணர்வு இங்கு பூச்சி ஆடையை அழித்ததைக் குறிக்கிறது. தமிழில் அந்துப்பூச்சியைப் பற்றிய இயல்பான சொல்லாட்சி ‘ஆடையை அரித்த’ என்பதாகும்.
- source_word: עָשׁ
  choice: அந்துப்பூச்சி
  rationale: עָשׁ ஆடைகளை அரிக்கும் moth-ஐக் குறிக்கிறது. எபிரெய ஒருமையைப் பாதுகாத்து, தமிழில் துல்லியமாக ‘அந்துப்பூச்சி’ என வழங்கப்பட்டது.
