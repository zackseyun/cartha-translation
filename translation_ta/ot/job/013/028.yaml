revisions:
- from: அவனோ அழுகிய பொருளைப்போல் சிதைந்துபோகிறான்[a]; அந்துப்பூச்சி அரித்த ஆடையைப்போல் ஆகிறான்.
  to: அவனோ அழுகிய பொருளைப்போல் தேய்ந்துபோகிறான்[a]; அந்துப்பூச்சி அரித்த ஆடையைப்போல் தேய்ந்துபோகிறான்.
  rationale: The revision retains the draft’s accurate concrete rendering of רָקָב as “அழுகிய பொருள்,” while replacing “சிதைந்துபோகிறான்/ஆகிறான்” with the more directly corresponding and parallel “தேய்ந்துபோகிறான்.” The repeated verb is warranted in Tamil to make explicit the predicate implied across the Hebrew’s paired similes. The footnote preserves the abstract lexical alternative “அழுகல்.”
