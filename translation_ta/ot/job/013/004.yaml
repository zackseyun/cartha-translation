translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. 'பொய்யைப் பூசுகிறவர்கள்' என்ற சொற்றொடர் சற்றே அசாதாரணமாக இருந்தாலும், எபிரெய மூலத்தின் திட்டமிட்ட பூச்சு/மூடல் உருவகத்தைப் பாதுகாக்கிறது. அடிக்குறி குறிப்பான்கள் பிரதான உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வரிசையாக இடப்பட்டுள்ளன.
