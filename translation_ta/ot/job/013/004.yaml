  text: וְֽ/אוּלָ֗ם אַתֶּ֥ם טֹֽפְלֵי שָׁ֑קֶר רֹפְאֵ֖י אֱלִ֣ל כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: ta
  text: ஆனால் நீங்கள் பொய்யைப் பூசுகிறவர்கள்[a]; நீங்கள் அனைவரும் பயனற்ற மருத்துவர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்யைப் பரப்புகிறவர்கள்” அல்லது “பொய்களைப் புனைகிறவர்கள்.” இதற்குப் பின்னுள்ள எபிரெய வினைச்சொல் ஒன்றை மேலே பரப்புதல் அல்லது பூசுதல் என்ற படிமத்தைக் கொண்டுள்ளது; அவர்கள் உண்மையைப் பொய்யால் மூடுகிறார்கள் என்ற உருவகம் இங்கு இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எந்த மதிப்புமில்லாத மருத்துவர்கள்.” எபிரெயச் சொற்றொடர் அவர்களைப் பயனற்ற குணப்படுத்துநர்களாக விவரிக்கிறது. அந்தப் பெயர்ச்சொல்லின் வேறொரு பொருளை அடிப்படையாகக் கொண்ட “விக்கிரக மருத்துவர்கள்” என்பது குறைவாகச் சாத்தியமான மாற்று.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய கருத்துக்கு நேரான, கூர்மையான முரண்பாட்டை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: אַתֶּם
  choice: நீங்கள்
  rationale: யோபு தன் நண்பர்களை நேரடியாகப் பன்மையில் அழைப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: טֹפְלֵי
  choice: பூசுகிறவர்கள்
  rationale: טפל என்பதிலுள்ள பரப்புதல் அல்லது மேலே பூசுதல் என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது; 'பொய்களைப் புனைகிறவர்கள்' என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாகும்.
- source_word: שָׁקֶר
  choice: பொய்யை
  rationale: எபிரெய ஒருமை வடிவத்தைப் பொருள்திரளாக எடுத்துக்கொண்டு, பூசப்படும் பொருளாகிய பொய்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֹפְאֵי
  choice: மருத்துவர்கள்
  rationale: ஆலோசனை கூறியும் குணப்படுத்தத் தவறியவர்களைச் சித்தரிக்கும் மருத்துவ உருவகத்தையும் உரையின் உயர்ந்த நடையையும் காக்கிறது.
- source_word: אֱלִל
  choice: பயனற்ற
  rationale: இச்சொற்றொடரில் 'வெறுமை/மதிப்பின்மை' என்ற பொருள் இயல்பானது; மருத்துவர்கள் எந்தப் பயனும் தராதவர்கள் என்பதைக் குறிக்கிறது.
- source_word: כֻּלְּכֶם
  choice: நீங்கள் அனைவரும்
  rationale: யோபின் உரையாடல் தோழர்கள் ஒருவரும் விதிவிலக்கல்ல என்ற இறுதி வலியுறுத்தலைத் தக்கவைக்கிறது.
