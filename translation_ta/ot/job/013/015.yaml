base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: ta
  text: அவர் என்னைக் கொன்றாலும்[a], நான் நம்பிக்கை வைக்கமாட்டேன்; ஆனாலும் என் வழிகளைக் குறித்து அவர் முன்னிலையில் வாதிடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “அவர் என்னைக் கொன்றாலும், அவரில் நம்பிக்கை வைப்பேன்.” இது எபிரெய உரையின் மாற்று வாசிப்பைப் பிரதிபலிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: கொன்றாலும்
  rationale: இங்கு הֵן வலியுறுத்தல் அல்லது விட்டுக்கொடுக்கும் பொருளுடைய கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் தனிச்சொல்லாக மொழிபெயர்ப்பதைவிட, ‘-ஆலும்’ என்ற இணைப்பில் அதன் சூழல்சார் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: יִקְטְלֵנִי
  choice: அவர் என்னைக் கொன்றாலும்
  rationale: קטל என்பதன் பொருள் ‘கொல்லுதல்.’ யோபின் உரையின் கடுமையையும் கண்ணியமான நடையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֹא אֲיַחֵל
  choice: நான் நம்பிக்கை வைக்கமாட்டேன்
  rationale: கொடுக்கப்பட்ட எபிரெய உரையில் לֹא என்பது ‘இல்லை/மாட்டேன்’ என்ற மறுப்பைக் குறிக்கிறது; יחל இங்கு ‘நம்பிக்கை வைத்தல்’ அல்லது ‘எதிர்பார்த்துக் காத்திருத்தல்’ எனப் பொருள்படலாம். சூழலுக்கும் மூலத்தின் பொருள் வரம்புக்கும் ஏற்றவாறு ‘நம்பிக்கை வைக்கமாட்டேன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: மரணம் நேர்ந்தாலும் தன் வழக்கை முன்வைப்பேன் என்ற யோபின் எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: דְּרָכַי
  choice: என் வழிகள்
  rationale: ‘என் வழிகள்’ என்பது எபிரெய உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது யோபின் நடத்தை அல்லது வாழ்க்கை முறையையும் குறிக்கக்கூடும்.
- source_word: אֶל־פָּנָיו
  choice: அவர் முன்னிலையில்
  rationale: சொல்லர்த்தமாக ‘அவருடைய முகத்திற்கு முன்’; தமிழில் கடவுளின் சந்நிதியில் நேரடியாக வழக்கை முன்வைப்பதை ‘அவர் முன்னிலையில்’ இயல்பாக உணர்த்துகிறது.
- source_word: אוֹכִיחַ
  choice: வாதிடுவேன்
  rationale: יכח என்பதன் ஹிஃபீல் வடிவம் இச்சட்டவாதச் சூழலில் ஒரு வழக்கை எடுத்துரைத்தல் அல்லது நிரூபிக்க வாதிடுதல் என்ற பொருளைக் கொண்டுள்ளது.
theological_decisions:
- issue: ‘அவர் என்னைக் கொன்றாலும், அவரில் நம்பிக்கை வைப்பேன்’ என்ற பாரம்பரிய வாசிப்பையா, לֹא என்ற மறுப்பைக் கொண்ட மசோரா உரையையா பின்பற்றுவது
  choice: முதன்மை உரையில் לֹא என்பதற்கேற்ப ‘நான் நம்பிக்கை வைக்கமாட்டேன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர் என்னைக் கொன்றாலும், அவரில் நம்பிக்கை வைப்பேன்’
  rationale: கொடுக்கப்பட்ட எபிரெய மெய்யெழுத்து உரையில் ‘அவரில்/அவருக்காக’ என்ற לוֹ அல்ல, ‘இல்லை’ என்ற לֹא உள்ளது. ஆகவே மூலமொழிக்கு முன்னுரிமை அளித்து மறுப்பைக் கொண்ட வாசிப்பு முதன்மை உரையில் வைக்கப்படுகிறது; பழமையானதும் விளக்கவியல் முக்கியத்துவம் உடையதுமான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், யோபின் உரைக்குரிய கண்ணியமும் சட்டவாதத் தொனியும் காக்கப்பட்டுள்ளன. ‘என் வழிகள்’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது; ‘வாதிடுவேன்’ என்பது சூழலின் நீதிமன்றத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
