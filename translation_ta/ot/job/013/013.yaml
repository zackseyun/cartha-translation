  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: ta
  text: என் முன்னிலையில் அமைதியாக இருங்கள்[a]; நான் பேசட்டும். பிறகு, என்மேல் எது வந்தாலும் வரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிக நேரடியாக, “என்னிடமிருந்து அமைதியாக இருங்கள்; நான் பேசுவேன்; எதுவாயினும் அது என்மேல் கடந்து செல்லட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: அமைதியாக இருங்கள்
  rationale: חרשׁ என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம்; பேசாமல் அமைதியாக இருக்கும்படி யோபு வலியுறுத்துவதைக் கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִמֶּנִּי
  choice: என் முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் ‘என்னிடமிருந்து’ என்றாலும், החרישׁוּ உடன் இங்கு யோபைப் பொறுத்தவரை பேசுவதை நிறுத்தி அவரது முன்னிலையில் அமைதியாக இருப்பதைக் குறிக்கும் இயைபுச் சொற்றொடராக உள்ளது.
- source_word: וַאֲדַבְּרָה אָנִי
  choice: நான் பேசட்டும்
  rationale: முதல் நபர் cohortative வடிவத்தின் விருப்பம்/உறுதியையும், தனிப்பட்ட אָנִי தரும் அழுத்தத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְיַעֲבֹר עָלַי
  choice: என்மேல் … வரட்டும்
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்’ என்றாலும் עַל உடன் ஒருவர்மேல் ஒன்று நேரிடுதல் அல்லது வருதல் என்ற பொருளைத் தருகிறது; jussive வலிமையை ‘வரட்டும்’ காக்கிறது.
- source_word: מָה
  choice: எதுவாயினும்
  rationale: இங்குள்ள מָה குறிப்பிடப்படாத எந்த விளைவையும் குறிக்கிறது; யோபின் துணிவும் விளைவுகளை ஏற்கும் மனநிலையும் மேலதிக விளக்கமின்றி வெளிப்படுகின்றன.
