translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கட்டளையின் வலிமை, ‘நான்’ என்பதன் அழுத்தம், இறுதி விளைவு குறித்த மூலத்தின் உறுதியற்ற தன்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
