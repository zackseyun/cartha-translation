  text: הוֹכֵ֣חַ יוֹכִ֣יחַ אֶתְ/כֶ֑ם אִם בַּ֝/סֵּ֗תֶר פָּנִ֥ים תִּשָּׂאֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: ta
  text: நீங்கள் மறைவாகப் பாரபட்சம் காட்டினால், அவர் உங்களை நிச்சயமாகக் கண்டிப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “முகங்களை உயர்த்தினால்”; இது ஒருவருக்குச் சாதகமாகப் பாரபட்சம் காட்டுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: நிச்சயமாகக் கண்டிப்பார்
  rationale: வினையெச்ச முற்றுருவும் அதே வேரின் வினைமுற்றும் இணைந்து வினையின் உறுதியை வலியுறுத்துகின்றன. சூழலில் யோபு தன் நண்பர்களுக்கு இறைவனிடமிருந்து வரும் கடிந்துரைத்தலை எச்சரிப்பதால், ‘நிச்சயமாகக் கண்டிப்பார்’ என்பது வலிமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை நேர்செயப்படுபொருள்; யோபின் நண்பர்கள் அனைவரையும் குறிக்க ‘உங்களை’ இயல்பாக உள்ளது.
- source_word: אִם
  choice: -ஆல் (காட்டினால்)
  rationale: எச்சரிக்கையின் நிபந்தனைத் தன்மையை ‘காட்டினால்’ தெளிவாகத் தருகிறது; நிகழ்வு நடந்துவிட்டதாகவோ உறுதியாக நடக்கும் என்றோ கூறவில்லை.
- source_word: בַּסֵּתֶר
  choice: மறைவாக
  rationale: மறைக்கப்பட்ட அல்லது இரகசியமான முறையில் செயல்படுவதைக் குறிக்கும் சொற்றொடரின் வினையடைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: பாரபட்சம் காட்டினால்
  rationale: சொல்லுக்குச் சொல் ‘முகங்களை உயர்த்துதல்’ எனும் எபிரெய மரபுத்தொடர் ஒருவருக்குச் சாய்வாக அல்லது பாரபட்சமாக நடப்பதைக் குறிக்கிறது. அதன் நீதிசார் வலிமையை ‘பாரபட்சம் காட்டுதல்’ தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: נשׂא פנים என்ற மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: பாரபட்சம் காட்டுதல்
  alternative: முகங்களை உயர்த்துதல்; ஒருதலைப்பட்சமாக ஆதரித்தல்
  rationale: இம்மரபுத்தொடர், குறிப்பாகத் தீர்ப்பிலும் வாதத்திலும், ஒருவருக்குச் சாய்வாக நடப்பதைக் குறிக்கிறது. இச்சூழலில் யோபின் நண்பர்கள் கடவுளுக்கு ஆதரவாகப் பாரபட்சத்துடன் வாதிடுவதை அது சுட்டுகிறது; அதனால் சொற்பொருளை விட மரபுத்தொடரின் நெறி மற்றும் நீதிசார் பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வலியுறுத்தலும் நிபந்தனை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
