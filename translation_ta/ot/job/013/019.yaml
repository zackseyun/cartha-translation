  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வழக்காடு’ மூலத்தின் நீதிசார் எதிர்வாத நுணுக்கத்தைப் பாதுகாக்கிறது; עַתָּה என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
