source:
  edition: WLC
  text: מִי ה֭וּא יָרִ֣יב עִמָּדִ֑/י כִּֽי עַתָּ֖ה אַחֲרִ֣ישׁ וְ/אֶגְוָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/019.yaml
  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: ta
  text: என்னோடு வழக்காடப்போகிறவன் யார்? அப்படியானால் நான் மௌனமாக இருந்து இறந்துபோவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது நான் மௌனமாக இருந்து இறந்துபோவேன்.” எபிரேய வினையடை பொதுவாக “இப்போது” என்று பொருள்படும்; ஆனால் இங்கு யோபின் வாதப்போக்கில் பலர் அதை “அப்படியானால்” என்ற பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: யார்?
  rationale: கேள்விப்பெயருடன் வரும் தனிப்பிரதிப்பெயர் எபிரேயத்தில் வலியுறுத்தலை அளிக்கிறது. இயல்பான நவீனத் தமிழில் சூழலும் சொல்வரிசையும் அந்த வினாவாற்றலைத் தாங்குவதால் ‘யார்?’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָרִיב
  choice: வழக்காடப்போகிறவன்
  rationale: ריב என்பதில் சட்டரீதியான வாதம் அல்லது எதிர்த்துப் போராடும் நுணுக்கம் உள்ளது. ‘வழக்காடு’ அந்த நீதிமன்றச் சாயலை அளவுக்கு மீறி விரிவாக்காமல் காக்கிறது; வரவிருக்கும் செயலை ‘-ப்போகிறவன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִמָּדִי
  choice: என்னோடு
  rationale: மூலத்தில் நேரடியாக ‘என்னோடு’ என்ற உறவு உள்ளது; ‘வழக்காடு’ என்பதே அதன் எதிர்ப்புத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: כִּי
  choice: அப்படியானால்
  rationale: இங்கு அடுத்த கூற்றை முந்தைய சவாலின் விளைவாக இணைக்கும் வாதப்போக்கை இயல்பான தமிழில் ‘அப்படியானால்’ தெளிவாகக் காட்டுகிறது.
- source_word: עַתָּה
  choice: அப்படியானால் என்பதில் விளைவுப்பொருளாக வெளிப்படுத்தப்பட்டது
  rationale: עַתָּה வழக்கமாக ‘இப்போது’ என்று பொருள்படும்; இச்சூழலில் பலர் அதை ‘அப்போது/அப்படியானால்’ என்ற நிபந்தனை-விளைவுப் பொருளில் புரிந்துகொள்கிறார்கள். முதன்மை உரை அந்த வாசிப்பைப் பின்பற்றுகிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֲרִישׁ
  choice: நான் மௌனமாக இருந்து
  rationale: חרש இங்கு பேசாமல் இருப்பதைக் குறிக்கிறது. ‘மௌனமாக இருந்து’ என்பது கண்ணியமானதும் பொதுவாசகருக்குப் புரியக்கூடியதுமான நடை.
- source_word: וְאֶגְוָע
  choice: இறந்துபோவேன்
  rationale: גוע உயிர்விடுதல் அல்லது இறத்தலைக் குறிக்கிறது. ‘இறந்துபோவேன்’ அதன் கடுமையான நேரடிப் பொருளை இயல்பான தமிழில் காக்கிறது.
