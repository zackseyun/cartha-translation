source:
  edition: WLC
  text: אוּלָ֗ם אֲ֭נִי אֶל שַׁדַּ֣י אֲדַבֵּ֑ר וְ/הוֹכֵ֖חַ אֶל אֵ֣ל אֶחְפָּֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: ta
  text: ஆனால் நான் சர்வவல்லவரிடம் பேச விரும்புகிறேன்; கடவுளோடு வாதாட விரும்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளோடு நியாயம் பேச விரும்புகிறேன்” அல்லது “கடவுள்முன் என் வழக்கை எடுத்துரைக்க விரும்புகிறேன்.” இதற்கான எபிரெய வினைச்சொல் வாதிடுதல், ஒன்றை நிறுவுதல், அல்லது தன் தரப்பை முன்வைத்தல் என்ற நீதிமன்றச் சாயலைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் யோபு தன் நண்பர்களைக் கண்டித்ததற்கு மாறாக, இப்போது தாம் கடவுளிடமே பேச விரும்புவதை வலியுறுத்தும் எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: אֲנִי
  choice: நான்
  rationale: எபிரெய மொழியில் வெளிப்படையாக உள்ள தன்மைப் பெயர் யோபின் தீர்மானத்தை வலியுறுத்துகிறது; தமிழிலும் அதைத் தக்கவைத்துள்ளது.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: சர்வவல்லவரிடமே பேச விரும்புகிறேன்
  rationale: אֶל என்பது உரை செல்லும் இலக்கைச் சுட்டுகிறது; emphatic Tamil particle 'ஏ' conveys Job's contrastive preference. Imperfect verb in context expresses resolve/desire rather than merely future time.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான தமிழ்ப் பொருளில் வழங்குகிறது.
- source_word: וְהוֹכֵחַ
  choice: வாதாட
  rationale: יכח என்பதன் ஹிபில் வடிவம் இங்கு வழக்குரைத்தல், தன் தரப்பை நிறுவுதல், விவாதித்தல் ஆகிய நீதிமன்றச் சாயலுடைய பொருளைக் கொண்டுள்ளது; 'வாதாட' அந்தத் தீவிரத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֶל אֵל
  choice: கடவுளோடு
  rationale: וְהוֹכֵחַ என்பதோடு வரும் אֶל உறவுசார் எதிர்கொள்ளுதலைக் குறிக்கிறது; தமிழில் 'கடவுளோடு வாதாட' இயல்பாக உள்ளது.
- source_word: אֶחְפָּץ
  choice: விரும்புகிறேன்
  rationale: யோபின் உறுதியான விருப்பத்தையும் நோக்கத்தையும் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: שַׁדַּי மற்றும் אֵל என்னும் இரு தெய்வீகச் சுட்டுப்பெயர்களை வழங்குதல்
  choice: முறையே ‘சர்வவல்லவர்’ மற்றும் ‘கடவுள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஷத்தாய் ... இறைவன்’ அல்லது இரண்டையும் ஒரே சொல்லால் வழங்குதல்
  rationale: மூலவசனத்தில் இணை அமைப்புக்குள் இரண்டு வேறுபட்ட தெய்வீகப் பெயர்கள் உள்ளன. அவற்றின் பொருளையும் நடையியல் வேறுபாட்டையும் காத்து, தேவையற்ற கோட்பாட்டுச் சமப்படுத்தலைத் தவிர்க்கிறது.
- issue: יכח என்பதன் நீதிமன்ற/விவாதப் பொருள்
  choice: ‘வாதாட’ என்று வழங்கி, மாற்றுப் பொருட்களை அடிக்குறிப்பில் தருதல்
  alternative: ‘நியாயம் பேச’ அல்லது ‘என் வழக்கை முன்வைக்க’
  rationale: மூலத்தில் ‘என் வழக்கு’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை; இருப்பினும் வினையின் வழக்குரைக்கும் நுணுக்கத்தை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை. ‘சர்வவல்லவர்’ என்ற பரவலாகப் புரியக்கூடிய பட்டமும், forensic nuance-ஐத் தக்கவைக்கும் ‘வாதாட’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. ‘இடமே’ என்ற வலியுறுத்தல் யோபு நண்பர்களுக்குப் பதிலாக கடவுளிடமே பேச விரும்பும் எதிர்மறை மையத்தை இயல்பாக வெளிப்படுத்துகிறது.
