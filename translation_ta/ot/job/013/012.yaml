  text: זִֽ֭כְרֹנֵי/כֶם מִשְׁלֵי אֵ֑פֶר לְ/גַבֵּי חֹ֝֗מֶר גַּבֵּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: ta
  text: உங்கள் நினைவில் நிற்கும் கூற்றுகள் சாம்பல் பழமொழிகள்[a]; உங்கள் அரண்கள் களிமண் அரண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நினைவுச் சொற்கள் சாம்பல் பழமொழிகள்; உங்கள் பாதுகாப்பு அரண்கள் களிமண் அரண்கள்.” எபிரேய உரை மிகவும் சுருக்கமானது; கடைசித் தொடர் பொருள் காணக் கடினமானது. “அரண்கள்” என்பது மீண்டும் வரும் பெயர்ச்சொல்லுக்குச் சூழலின் அடிப்படையில் கொடுக்கப்பட்ட பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: உங்கள் நினைவுரைகள்
  rationale: זכר சார்ந்த இப்பெயர்ச்சொல் அடிப்படையில் நினைவு அல்லது நினைவுச்சின்னத்தைக் குறிக்கிறது; இச்சூழலில் நண்பர்கள் முன்வைக்கும் நினைவில் நிறுத்தத்தக்க அதிகாரமுள்ள கூற்றுகளைச் சுட்டுகிறது. ‘நினைவுரைகள்’ மூல உருவகத்தையும் உரைகளின் தன்மையையும் காக்கிறது.
- source_word: מִשְׁלֵי
  choice: பழமொழிகள்
  rationale: מָשָׁל என்பது பழமொழி, ஞானக்கூற்று, ஒப்புமை ஆகியவற்றைக் குறிக்கலாம். இங்கு பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து ‘சாம்பலின் பழமொழிகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵפֶר
  choice: சாம்பல்
  rationale: இச்சொல்லின் வழக்கமான பொருள் ‘சாம்பல்’; பயனின்மையையும் எளிதில் சிதையும் தன்மையையும் காட்டும் உருவகத்திற்கு இது பொருந்துகிறது.
- source_word: לְגַבֵּי
  choice: —
  rationale: சுருக்கமான கவிதை நடையில் இத்தொடரின் உறவு வெளிப்படையான இணைப்புவினையின்றி தமிழில் பெயர்ச்சொல் வாக்கியமாகக் கொடுக்கப்பட்டுள்ளது; இதனால் எபிரேயத்தின் நெருக்கமான அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: חֹמֶר
  choice: களிமண்
  rationale: חֹמֶר களிமண், சேறு அல்லது சாந்துப் பொருளைக் குறிக்கலாம். பலவீனமான அரண் என்ற உருவகத்திற்கு ‘களிமண்’ இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: גַּבֵּיכֶם
  choice: உங்கள் அரண்கள்
  rationale: גַּב என்பதன் அடிப்படைப் பொருள் ‘முதுகு’ அல்லது உயர்ந்த மேற்பரப்பு. இக்கடினமான கவிதைச் சூழலில் பாதுகாப்பு அமைப்பு என்ற பொருள் சாத்தியமானதால் ‘அரண்கள்’ என வழங்கப்பட்டுள்ளது; மூலத்தின் உருவகத் திருப்பத்தைப் பாதுகாக்க அதே சொல் பயனிலையில் மீண்டும் வருகிறது.
