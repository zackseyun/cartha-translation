- from: உங்கள் நினைவுரைகள் சாம்பலின் பழமொழிகள்[a]; உங்கள் அரண்கள் களிமண்ணின் அரண்கள்.
  to: உங்கள் நினைவில் நிற்கும் கூற்றுகள் சாம்பல் பழமொழிகள்[a]; உங்கள் அரண்கள் களிமண் அரண்கள்.
  rationale: The revision corrects the misleading modern-Tamil sense of “நினைவுரைகள்” while preserving the Hebrew's terseness, repeated nominal construction, and the English audit trail's contextual reading. The footnote now presents the lexical and contextual alternatives more accurately and keeps the final phrase's uncertainty explicit.
