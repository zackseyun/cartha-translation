translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் கண்டனத்துக்குரிய சுருக்கமான கவிதை வலிமை பாதுகாக்கப்பட்டுள்ளது. ‘சாம்பலின் பழமொழிகள்’ மற்றும் ‘களிமண்ணின் அரண்கள்’ என்ற அசாதாரண இணைப்புகள் மூலத்தின் உருவகத் தீவிரத்தையும் தெளிவின்மையையும் திட்டமிட்டு தக்கவைக்கின்றன.
