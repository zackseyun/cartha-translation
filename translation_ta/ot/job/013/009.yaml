  text: הֲ֭/טוֹב כִּֽי יַחְקֹ֣ר אֶתְ/כֶ֑ם אִם כְּ/הָתֵ֥ל בֶּ֝/אֱנ֗וֹשׁ תְּהָתֵ֥לּוּ בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: ta
  text: அவர் உங்களை ஆராயும்போது, அது உங்களுக்கு நன்மையாக இருக்குமா? ஒரு மனிதனை ஏளனம் செய்வதுபோல் அவரையும் ஏளனம் செய்வீர்களா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரை ஏமாற்றுவீர்களா?’ அல்லது ‘அவரை விளையாட்டுப் பொருளாக நடத்துவீர்களா?’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினைச்சொல் ஏளனம் செய்தல், ஏமாற்றுதல், அல்லது ஒருவரை விளையாட்டுப் பொருளாக நடத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘ஒரு மனிதன்’; அதாவது, கடவுளுடன் ஒப்பிடுகையில் வெறும், மரணத்திற்குட்பட்ட மனிதன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: அது உங்களுக்கு நன்மையாக இருக்குமா?
  rationale: הֲ உடன் வரும் טוֹב ஒரு சொல்லாட்சிக் கேள்வியை உருவாக்குகிறது. அடுத்துள்ள பன்மை ‘உங்களை’ கருத்தில் கொண்டு, தமிழில் இயல்பாக இருக்க ‘உங்களுக்கு’ தெளிவாக்கப்பட்டுள்ளது; வரவிருக்கும் விசாரணையின் விளைவும் காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஆராயும்போது
  rationale: இங்கு כִּי, மதிப்பீடு நிகழும் காலச் சூழலை அறிமுகப்படுத்துகிறது; ஆகவே ‘எப்போது’ என்ற காலப் பொருள் வினையெச்சமாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: יַחְקֹר
  choice: அவர் ... ஆராயும்போது
  rationale: חקר ஆழமாகத் தேடி விசாரித்தல் அல்லது ஆராய்தல் என்பதைக் குறிக்கிறது. ‘ஆராய்தல்’ தெய்வீக நுண்ணாய்வின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் கூடிய நேரடி செயப்படுபொருள்; தமிழில் ‘உங்களை’ என்று தரப்பட்டுள்ளது.
- source_word: אִם
  choice: அல்லது எனப் பொருள்படும் இரண்டாம் கேள்வி
  rationale: இணையான இரண்டாவது சொல்லாட்சிக் கேள்வியை אִם அறிமுகப்படுத்துகிறது. தனி ‘அல்லது’ இல்லாமலும் கேள்விகளின் தொடர்ச்சி தமிழில் மாற்றைத் தெளிவாக உணர்த்துவதால் இயல்பான கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כְּהָתֵל
  choice: ஏளனம் செய்வதுபோல்
  rationale: התל என்பதற்கு ஏளனம் செய்தல், ஏமாற்றுதல், விளையாட்டாக நடத்துதல் ஆகிய பொருள்கள் உண்டு. இச்சூழலில் மரியாதையற்ற நடத்தையைக் காட்ட ‘ஏளனம் செய்தல்’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: בֶּאֱנוֹשׁ
  choice: ஒரு மனிதனை
  rationale: אֱנוֹשׁ மனிதனின் பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் உணர்த்தக்கூடும். இயல்பான தமிழுக்காக ‘ஒரு மனிதனை’ என மொழிபெயர்த்து, இறைவனுடனான வேறுபாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: அவரையும் ஏளனம் செய்வீர்களா?
  rationale: இரண்டாம் நபர் பன்மை வினைச்சொல், அவரை நோக்கிய செயலைக் குறிக்கிறது. ஒப்புமைச் சொற்றொடருடன் ஒருமைப்பாட்டைக் காக்க ‘ஏளனம் செய்வீர்களா’ என்று தரப்பட்டுள்ளது; ‘அவரையும்’ ஒப்புமையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: ‘அவர்/அவரை’ என்பது கடவுளைக் குறிக்கிறது; பெயர் நேரடியாகச் சேர்க்கப்படவில்லை.
  alternative: குறிப்பிடப்படாத ஓர் ஆராய்பவர் அல்லது நீதிபதி.
  rationale: யோபு 13:7–11 சூழலில், கடவுளுக்காகப் பொய்யாகப் பேசுபவர்களை யோபு எச்சரித்து, கடவுள் அவர்களை ஆராய்வதைப் பற்றிக் கூறுகிறார். மரியாதைப் பன்மையான ‘அவர்’ அந்தக் குறிப்பை இயல்பாகக் காக்கிறது; மூலத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரை வசனத்திற்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவர்’ என்பது கடவுளைக் குறிக்கும் மரியாதைச் சுட்டு; மூலத்தின் சுட்டுப்பெயர் வடிவம் காக்கப்பட்டுள்ளது. இரண்டு சொல்லாட்சிக் கேள்விகளின் எச்சரிக்கைத் தொனியும், התל என்பதின் பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
