  text: Please hear my argument[b][a], and listen to the pleadings of my lips.
translation:
  language: ta
  text: 'யோபு 13:6


    தயவுசெய்து என் வாதத்தைக்[a] கேளுங்கள்;

    என் உதடுகளின் முறையீடுகளுக்குக்[b] கவனமாய்ச் செவிகொடுங்கள்.


    [a] அல்லது, “என் கண்டனத்தை”; எபிரெயச் சொல் திருத்துதல், கண்டித்தல், அல்லது காரணங்களை முன்வைக்கும் வாதம் ஆகியவற்றைக் குறிக்கலாம்.

    [b] அல்லது, “என் உதடுகளின் சர்ச்சைகளுக்கு” அல்லது “வாக்குவாதங்களுக்கு”; எபிரெயச் சொற்றொடர் வழக்கு சார்ந்த வாதிடுதல் அல்லது முறையிடுதல் என்ற பொருளையும் கொண்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கண்டனத்தை”; எபிரெயச் சொல் திருத்துதல், கண்டித்தல், அல்லது காரணங்களை முன்வைக்கும் வாதம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் உதடுகளின் சர்ச்சைகளுக்கு” அல்லது “வாக்குவாதங்களுக்கு”; எபிரெயச் சொற்றொடர் வழக்கு சார்ந்த வாதிடுதல் அல்லது முறையிடுதல் என்ற பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: שׁמע என்பதன் பன்மை ஏவல் வடிவம்; யோபு தன்னைக் கேட்போரிடம் நேரடியாகக் கவனம் கோருகிறார். இரண்டாம் அடியிலுள்ள வலியுறுத்தப்பட்ட செவிகொடுத்தலுடன் கவிதை இணைநிலையையும் இது காக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: ஏவலை மென்மையாக்கும் வேண்டுதல் இடைச்சொல்; நவீனத் தமிழில் அதன் வேண்டுகோள் நயத்தை இயல்பாகத் தருகிறது.
- source_word: תוֹכַחְתִּי
  choice: என் வாதத்தை
  rationale: תוכחת என்பது கண்டனம், திருத்துதல், நியாயவாதம் அல்லது காரண விளக்கம் ஆகிய பொருட்களைக் கொள்ளலாம். யோபின் வழக்காடும் சூழலில் “வாதம்” அவரது தரப்புக் கூற்றை வெளிப்படுத்துகிறது; கண்டனம் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְרִבוֹת
  choice: முறையீடுகளுக்கு
  rationale: ריב/ריבות சர்ச்சை, வாக்குவாதம், வழக்கு அல்லது முறையீடு சார்ந்த சொல்லாகும். இங்கு யோபு வாயால் முன்வைக்கும் வழக்கு சார்ந்த கூற்றுகளுக்கு “முறையீடுகள்” இயல்பான தமிழில் பொருந்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: שְׂפָתַי
  choice: என் உதடுகளின்
  rationale: “என் உதடுகள்” என்ற மூல உருவகத்தை “என் சொற்கள்” என்று தட்டையாக்காமல், பெயரெச்சத் தொடர்புடன் நேரடியாகக் காக்கிறது.
- source_word: הַקְשִׁיבוּ
  choice: கவனமாய்ச் செவிகொடுங்கள்
  rationale: קשׁב என்பது உன்னிப்பாகக் கேட்பதைக் குறிக்கும் பன்மை ஏவல் வடிவம். முதல் அடியின் “கேளுங்கள்” என்பதைக் காட்டிலும் வலுவான கவனத்தை வெளிப்படுத்தி இணைநிலையைப் பேணுகிறது.
