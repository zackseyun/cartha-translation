translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், நேரடியான வேண்டுகோளும் கண்ணியமான கவிதை நடையும் பயன்படுத்தப்பட்டுள்ளன. “உதடுகள்” என்ற எபிரெய உருவகம் காக்கப்பட்டுள்ளது; சட்ட/வழக்காடல் நிழற்பொருள் “வாதம்,” “முறையீடுகள்” என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளது.
