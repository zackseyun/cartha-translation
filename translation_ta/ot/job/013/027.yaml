translation_notes:
  register: நவீனத் தரமான, மரியாதையும் குற்றச்சாட்டின் தீவிரமும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘கிறீர்’ தொடர்ச்சியாகக் காக்கப்பட்டுள்ளது. ‘கால்கட்டை’ சாதாரண வாசகருக்குத் தெளிவாக இருக்கும்படி தேர்ந்தெடுக்கப்பட்டது; இறுதி தொடரின் உண்மையான எபிரெயச் சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
