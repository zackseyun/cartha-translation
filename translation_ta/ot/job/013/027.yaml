base_translation:
  language: en
  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: ta
  text: என் கால்களைக் கால்கட்டையில் மாட்டுகிறீர்; என் பாதைகள் அனைத்தையும் கண்காணிக்கிறீர்; என் உள்ளங்கால்களில் அடையாளமிடுகிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உள்ளங்கால்களைச் சுற்றி ஒரு எல்லை வரைகிறீர்.” எபிரெய வினைச்சொல் அடையாளமிடுதல், பொறித்தல், அல்லது எல்லை வரைவது ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  choice: கால்கட்டையில்
  rationale: கால்களை அசையாமல் கட்டுப்படுத்தும் கருவியை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது; சிறை மற்றும் கட்டுப்பாட்டு உருவகத்தையும் காக்கிறது.
- source_word: וְתָשֵׂם
  choice: மாட்டுகிறீர்
  rationale: வெறுமனே ‘வைக்கிறீர்’ என்பதைக் காட்டிலும், கால்களைக் கட்டுப்பாட்டுக் கருவியில் பொருத்தி அடைப்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְתִשְׁמוֹר
  choice: கண்காணிக்கிறீர்
  rationale: இங்கு பாதுகாப்பதைவிட யோபுவின் ஒவ்வொரு நகர்வையும் கூர்ந்து கவனிக்கும் எதிர்மறையான கண்காணிப்பே பொருத்தமான பொருள்.
- source_word: כָּל אָרְחוֹתָי
  choice: என் பாதைகள் அனைத்தையும்
  rationale: நடக்கும் பாதைகள் என்ற நேரடியான உருவகத்தையும், ஒருவரின் நடத்தை அல்லது வாழ்க்கைப்போக்கு என்ற விரிவான பொருளையும் தக்கவைக்கிறது.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: என் உள்ளங்கால்களைச் சுற்றி
  rationale: சொல்லுக்கு நேராக ‘என் கால்களின் வேர்கள் மீது’ என்று மொழிபெயர்ப்பது தமிழில் தெளிவற்றது. சூழலில் கால்களின் அடிப்பகுதியைக் குறிக்கும் என்பதால் ‘உள்ளங்கால்கள்’ எனத் தரப்பட்டுள்ளது; עַל மற்றும் அடுத்த வினையின் எல்லைவரையும் சாத்தியத்துடன் இணைந்து ‘சுற்றி’ என வழங்கப்பட்டுள்ளது.
- source_word: תִּתְחַקֶּה
  choice: ஓர் எல்லையைக் குறிக்கிறீர்
  rationale: חקה என்பதன் பொறித்தல், வரைதல், வரம்பிடுதல் ஆகிய பொருள் வாய்ப்புகளில், கட்டுப்பாடு மற்றும் கண்காணிப்பு சூழலுக்கு ஏற்ற எல்லை குறித்தல் என்ற படிமத்தை முதன்மை உரை வெளிப்படுத்துகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
