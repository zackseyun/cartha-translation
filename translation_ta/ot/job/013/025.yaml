  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: ta
  text: 'காற்றில் அலைக்கழிக்கப்படும் ஓர் இலையைப் பயமுறுத்துவீரோ?[a]

    உலர்ந்த வைக்கோலைத் துரத்துவீரோ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயமுறுத்துவீரோ” என்பதை “அஞ்சச் செய்வீரோ” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை அச்சத்தையோ திகிலையோ ஏற்படுத்துவதைக் குறிக்கிறது; இச்சூழலில் கடுமையாக நடத்துதல் என்ற நிழற்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வைக்கோல்” என்பதற்கான எபிரெயச் சொல் “தாள்,” “உலர்ந்த தண்டு,” அல்லது சூழலைப் பொறுத்து “பதர்” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது வலுவற்ற உலர்ந்த தாவரப் பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה נִדָּף
  choice: காற்றில் அடித்துச் செல்லப்படும் ஓர் இலை
  rationale: இக்கூற்று காற்றால் அலைக்கழிக்கப்படும் ஓர் இலையின் வலுவின்மையைச் சித்தரிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கவித்துவமாகவும் அமைக்கப்பட்டுள்ளது.
- source_word: תַּעֲרוֹץ
  choice: அச்சுறுத்துவீரோ
  rationale: எபிரெய வினை அச்சம் அல்லது திகிலை ஏற்படுத்துவதைக் குறிக்கலாம்; சூழலில் வலுவற்ற ஒன்றை மிகக் கடுமையாக நடத்தும் கருத்தையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: קַשׁ יָבֵשׁ
  choice: உலர்ந்த துரும்பு
  rationale: קַשׁ என்பது வைக்கோல், அறுவடைக்குப் பின் எஞ்சும் தாள் அல்லது பதர் போன்ற உலர்ந்த தாவரக் கழிவைக் குறிக்கலாம். ‘துரும்பு’ இங்கு அதன் அற்பத்தன்மையையும் வலுவின்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּרְדֹּף
  choice: துரத்துவீரோ
  rationale: רדף என்பதன் அடிப்படைப் பொருளான பின்தொடர்தல் அல்லது துரத்துதலைப் பாதுகாத்து, முதல் அடியின் தாக்குதல்சார் செயலுடன் இணையான கவித்துவ அமைப்பை வழங்குகிறது.
