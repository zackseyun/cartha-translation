  text: הַ֭/לְ/אֵל תְּדַבְּר֣וּ עַוְלָ֑ה וְ֝/ל֗/וֹ תְּֽדַבְּר֥וּ רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: ta
  text: தேவனுக்காக[a] அநீதியைப் பேசுவீர்களா? அவருக்காக வஞ்சகத்தைப் பேசுவீர்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனுடைய சார்பாக’ / ‘தேவனிடம்’; இரண்டாம் அரையடியிலும் அதற்கேற்ப ‘அவருடைய சார்பாக’ / ‘அவரிடம்.’ எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்; ஆனால் தேவனை ஆதரித்துப் பேசுவதையே இங்குள்ள சூழல் அதிகம் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: தேவனுக்காக
  rationale: לְ என்ற முன்னொட்டு நோக்கம், நன்மை, சார்பு, பிரதிநிதித்துவம் அல்லது ஒருவரை நோக்கிப் பேசுதல் ஆகிய நுணுக்கங்களைக் கொள்ளலாம். யோபு 13:4, 8 ஆகிய வசனங்களின் சூழலில் நண்பர்கள் தேவனை ஆதரித்துப் பேசுவதாகக் கூறிக்கொள்வதை யோபு கண்டிப்பதால், ‘தேவனுக்காக’ என்பது முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תְּדַבְּרוּ
  choice: பேசுவீர்களா
  rationale: கேள்வியுடன் வரும் எபிரெய இறந்திறப்பில்லா வினை இங்கு கடுமையான சவாலையும் கண்டிப்பையும் வெளிப்படுத்துகிறது. தமிழில் ‘பேசுவீர்களா?’ அதே சொல்லாட்சிச் சக்தியை இயல்பாகத் தருகிறது.
- source_word: עַוְלָה
  choice: அநியாயமானதை
  rationale: இந்தப் பெயர்ச்சொல் அநீதி, அநியாயம், நேர்மையின்மை ஆகிய ஒழுக்க மற்றும் நீதிசார் பொருள்களைக் குறிக்கிறது. ‘அநியாயமானதை’ என்பது தமிழில் ‘பேசு’ என்பதுடன் இயல்பாக இணைந்து, அடுத்துள்ள ‘வஞ்சகம்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְלוֹ
  choice: அவருக்காக
  rationale: சுட்டுப்பெயர் தேவனையே குறிக்கிறது. முதல் அரையடியின் இணை அமைப்பைத் தக்கவைத்து, தேவனை ஆதரித்து அல்லது அவரின் சார்பாகப் பேசுதல் என்ற சூழல்சார் பொருளை இது வெளிப்படுத்துகிறது.
- source_word: רְמִיָּה
  choice: வஞ்சகமானதை
  rationale: இந்தச் சொல் வஞ்சகம், ஏமாற்று அல்லது துரோகம் ஆகியவற்றைக் குறிக்கலாம். இங்கு ‘வஞ்சகமானதை’ என்பது அதன் அருவப் பொருளைத் தக்கவைத்து, தமிழில் ‘பேசு’ என்பதுடன் தெளிவாக இணைகிறது.
theological_decisions:
- issue: யோபுவின் நண்பர்கள் தேவனிடம் பேசுகிறார்களா, அல்லது தேவனை ஆதரித்து அவரது சார்பில் பேசுகிறார்களா?
  choice: தேவனை ஆதரித்து அவருக்காக அநியாயமாகவும் வஞ்சகமாகவும் பேசுவதை யோபு கண்டிக்கிறார்.
  alternative: அவர்கள் தேவனிடம் அநியாயத்தையும் வஞ்சகத்தையும் பேசுவதாக யோபு கண்டிக்கிறார்.
  rationale: உடனடிச் சூழலில், குறிப்பாக யோபு 13:4, 8-இல், நண்பர்கள் தேவனுக்குப் பாரபட்சமாக ஆதரவாளர்களைப் போல நடப்பதே கேள்விக்குள்ளாகிறது. ஆகவே ‘தேவனுக்காக’ என்பது சூழலுக்கு ஏற்ற முதன்மை வாசிப்பு; இருப்பினும் לְ என்பதன் மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும்படியும் கண்ணியமான கண்டிப்பு நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணை அமைப்பைத் தெளிவாகக் காட்ட இரு அரையடிகளிலும் ‘பேசுவீர்களா?’ மீண்டும் வழங்கப்பட்டுள்ளது; தமிழில் இது இயல்பான வலியுறுத்தலை உருவாக்குகிறது.
