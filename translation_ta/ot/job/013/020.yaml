lexical_decisions:
- source_word: אַךְ
  choice: ஆனால் ... மட்டும்
  rationale: இங்கு வரும் எபிரெயச் சொல் யோபுவின் வேண்டுகோளை ஒரு வரம்புக்குள் கொண்டுவருகிறது; ‘ஆனால் ... மட்டும்’ என்பது அதன் எதிர்மறைத் தொடர்பையும் கட்டுப்படுத்தும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: שְׁתַּיִם
  choice: இந்த இரண்டையும்
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இல்லாமல் ‘இரண்டு’ என மட்டுமே உள்ளது. அடுத்த வசனங்களில் குறிப்பிடப்படும் இரு செயல்களைச் சுட்டுவதால், தமிழில் ‘இந்த இரண்டையும்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: எனக்குச் செய்யாதீர்
  rationale: עשה உடன் עִם சேரும் இத்தொடர் ‘என்னிடம்/எனக்கு இப்படிச் செய்யாதீர்’ என்ற பொருளைத் தருகிறது. யோபு தவிர்க்கும்படி கேட்கும் இரு செயல்களைக் கருத்தில் கொண்டு இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אָז
  choice: அப்போது
  rationale: கோரிக்கை ஏற்கப்பட்டால் ஏற்படும் விளைவை இந்தச் சொல் அறிமுகப்படுத்துகிறது.
- source_word: מִפָּנֶיךָ
  choice: உமது முகத்துக்கு முன்பாக
  rationale: மூலத்தின் ‘உமது முகத்திலிருந்து/உமது முகத்துக்கு முன்பாக’ என்ற உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது; இது தேவனுடைய முன்னிலையையும் குறிக்கிறது.
- source_word: לֹא אֶסָּתֵר
  choice: நான் ஒளிந்துகொள்ள மாட்டேன்
  rationale: סתר என்பதன் நிபால் வடிவம் இச்சூழலில் தன்னிலை அல்லது செயப்படாப் பொருளில் புரிந்துகொள்ளப்படலாம். யோபு தேவனுக்கு முன்பாக ஒளியமாட்டார் என்ற இயல்பான தமிழைத் தேர்ந்தெடுத்தோம்.
