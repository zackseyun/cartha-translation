revisions:
- from: ஆனால் இந்த இரண்டையும் மட்டும் எனக்குச் செய்யாதீர்; அப்போது உமது முகத்துக்கு முன்பாக நான் ஒளிந்துகொள்ள மாட்டேன்.[a]
  to: இந்த இரண்டு காரியங்களை மட்டும் எனக்குச் செய்யாதீர்; அப்போது உமது முன்னிலையிலிருந்து நான் ஒளிந்துகொள்ள மாட்டேன்.[a]
  rationale: The revision preserves the restrictive force of אַךְ, the implicit ‘two things,’ and Job’s conditional consequence. It changes the central idiom to natural Tamil that faithfully represents ‘from your presence,’ while the footnote retains the Hebrew’s concrete ‘face’ imagery.
