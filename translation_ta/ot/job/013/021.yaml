source:
  edition: WLC
  text: כַּ֭פְּ/ךָ מֵ/עָלַ֣/י הַרְחַ֑ק וְ֝/אֵ֥מָתְ/ךָ֗ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: ta
  text: உமது கையை என்மேலிருந்து விலக்குங்கள்[a]; உமது பயங்கரம்[b] என்னை அச்சுறுத்தாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உமது கையை என்னிடமிருந்து அகற்றுங்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “உமது திகில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: உமது கை
  rationale: כַּף என்பதன் அடிப்படைப் பொருள் உள்ளங்கை/கை. இங்கு தேவனுடைய அழுத்தம் அல்லது துன்புறுத்தும் செயலைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல், இயல்பான தமிழில் ‘கை’ என்று வைத்துள்ளது.
- source_word: מֵעָלַי הַרְחַק
  choice: என்மேலிருந்து விலக்குங்கள்
  rationale: מֵעָלַי என்பது ‘என்மேலிருந்து’ என்ற மேலிருக்கும் அழுத்தத்தின் படிமத்தைக் காக்கிறது; רחק என்பதன் ஹிஃபில் கட்டளை வடிவம் அகற்றுதல் அல்லது தொலைவில் வைப்பதைக் குறிக்கிறது. மரியாதையுடனான நேரடிக் கட்டளையாக ‘விலக்குங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵמָתְךָ
  choice: உமது திகில்
  rationale: אֵימָה என்பது பேரச்சம், திகில், பயங்கரம் ஆகிய பொருள்களைக் கொண்டது. இரண்டாம் நபர் பின்னொட்டைத் தக்கவைத்து, யோபுவை அச்சுறுத்தும் தேவனோடு தொடர்புடைய திகிலைக் குறிக்க ‘உமது திகில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַל תְּבַעֲתַנִּי
  choice: என்னைத் திகிலடையச் செய்யாதிருக்கட்டும்
  rationale: אַל உடன் வரும் வினை தடை அல்லது வேண்டுகோள் வலிமையைக் கொண்டது; בעת என்பது திடுக்கிடச் செய்தல், அச்சுறுத்துதல், திகிலடையச் செய்தல் என்பதாகும். אֵמָתְךָ எழுவாயாக இருப்பதைத் தமிழிலும் வெளிப்படுத்த இந்த அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: தேவனைப் பற்றிய மனித உடலுறுப்பு உருவகம் (‘உமது கை’)
  choice: ‘உமது கை’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘உமது வல்லமை’ அல்லது ‘உமது அடி’
  rationale: எபிரெய உரை தேவனுடைய செயலை உடல்சார்ந்த தெளிவான படிமத்தில் கூறுகிறது. அதை ‘வல்லமை’, ‘தண்டனை’ அல்லது ‘அடி’ என்று விளக்கிவிடாமல் வைத்திருப்பது, இங்கு அழுத்தம், துன்பம், அதிகாரம் ஆகியவற்றில் எது முன்னிலைப்படுகிறது என்ற திறந்த தன்மையைக் காக்கிறது.
- issue: אֵמָתְךָ என்பது தேவன் உணரும் பயமா அல்லது தேவன் ஏற்படுத்தும் திகிலா
  choice: ‘உமது திகில்’ என்று தொடர்பை நேரடியாக வைத்தல்
  alternative: ‘உம்மைப் பற்றிய பயம்’ அல்லது ‘நீர் ஏற்படுத்தும் திகில்’
  rationale: இரண்டாம் நபர் பின்னொட்டு உறவை மட்டும் வெளிப்படுத்துகிறது; அதை முற்றிலும் உள்ளார்ந்த பயமாகவோ வெளிப்படையாகக் காரணப்படுத்தப்பட்ட திகிலாகவோ தீர்மானிக்காமல், அடுத்த வினையின் மூலம் அது யோபுவைத் திகிலடையச் செய்கிறது என்பதை உரையே காட்ட அனுமதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நேரடியாக அழைக்கும் மரியாதை வடிவங்களான ‘உமது’, ‘விலக்குங்கள்’ பயன்படுத்தப்பட்டுள்ளன. கவிதைநடையின் இணை அமைப்பும், ‘கை’ என்ற உருவகமும், ‘திகில்’ தானே அச்சுறுத்தும் எபிரெய இலக்கண அமைப்பும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
