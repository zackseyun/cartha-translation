source:
  edition: WLC
  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: ta
  text: என் அக்கிரமங்களும் பாவங்களும் எத்தனை?[a] என் மீறுதலையும் என் பாவத்தையும் எனக்குத் தெரியப்படுத்தும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அக்கிரமங்களும் பாவங்களும் எவ்வளவு பெரியவை?” எபிரெய வினாச்சொல் எண்ணிக்கையையும் அளவையும் கேட்கலாம்; பன்மைச் சொற்கள் தொடர்வதால் முதன்மை உரை நேரடியான எண்ணிக்கைப் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மீறுதல்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் “கலகம்” என்ற பொருள் நிழலையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: என் ... எத்தனை?
  rationale: לִי உடன் வரும் வினாவடிவம் அளவு அல்லது எண்ணிக்கையை விசாரிக்கிறது. பன்மைச் சொற்கள் தொடர்வதால், நேரடியான எண்ணிக்கைப் பொருளை முதன்மை உரை இயல்பாகத் தக்கவைக்கிறது.
- source_word: עֲוֺנוֹת
  choice: அக்கிரமங்கள்
  rationale: עָוֹן என்பது வெறும் தவறை விட ஒழுக்கக் குற்றத்தின் பாரத்தைக் குறிக்கிறது. ‘அக்கிரமங்கள்’ அந்தப் பாரத்தைத் தக்கவைத்து, அடுத்து வரும் חַטָּאוֹת என்பதிலிருந்து ஓரளவு வேறுபடுத்துகிறது.
- source_word: וְחַטָּאוֹת
  choice: பாவங்கள்
  rationale: חַטָּאת என்பதற்கான தெளிவான, இயல்பான தமிழ் இணை; இங்கு பன்மையையும் பாதுகாக்கிறது.
- source_word: פִּשְׁעִי
  choice: என் மீறுதல்
  rationale: פֶּשַׁע என்பது வேண்டுமென்ற மீறல் அல்லது கலக நிழற்பொருளைக் கொண்டிருக்கலாம். ‘மீறுதல்’ அடிப்படைப் பொருளைத் தக்கவைக்கிறது; ‘கலகம்’ என்பது இச்சூழலில் பொருளை அளவுக்கு மீறிக் கூர்மைப்படுத்தக்கூடும்.
- source_word: וְחַטָּאתִי
  choice: என் பாவம்
  rationale: ஒருமை வடிவத்தையும் முதலாம் நபர் உரிமையையும் நேரடியாகப் பாதுகாக்கும் இயல்பான மொழிபெயர்ப்பு.
- source_word: הֹדִיעֵנִי
  choice: எனக்குத் தெரியப்படுத்தும்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய்/தெரியப்படுத்து’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘தெரியப்படுத்தும்’ என்பது அதைத் துல்லியமாகவும் தமிழில் வேண்டுகோள்/கட்டளை நடையில் இயல்பாகவும் வெளிப்படுத்துகிறது.
