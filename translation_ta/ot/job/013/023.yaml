translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. முதல் கேள்வியின் சுருக்கத்தையும், இரண்டாம் வாக்கியத்தின் தீவிரமான நேரடி வேண்டுகோளையும் பாதுகாக்கிறது. ‘அக்கிரமம்,’ ‘பாவம்,’ ‘மீறுதல்’ ஆகிய தொடர்புடைய சொற்களின் வேறுபாட்டை இயன்றவரைத் தக்கவைக்கிறது.
