  text: וּ֭/קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑ה אֽוֹ אֲ֝דַבֵּ֗ר וַ/הֲשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: ta
  text: அப்போது நீர் அழையுங்கள்[a]; நான் பதிலளிப்பேன். அல்லது என்னைப் பேசவிடுங்கள்; நீர் எனக்குப் பதிலளியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “அழையுங்கள்; நான் பதிலளிப்பேன். அல்லது நான் பேசுவேன்; எனக்குப் பதிலளியுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: அப்போது நீர் அழையுங்கள்
  rationale: קרא என்பதன் ஆண்பால் ஒருமை ஏவல் வடிவம், இங்கு யோபு கடவுளிடம் முன்வைக்கும் முதல் மாற்றுவழியைக் குறிக்கிறது. וְ என்னும் இணைப்பைச் சூழலுக்கேற்ற இயல்பான தொடர்ச்சியாக ‘அப்போது’ என்று வழங்கியுள்ளோம்.
- source_word: וְאָנֹכִי אֶעֱנֶה
  choice: நான் பதிலளிப்பேன்
  rationale: தனித்த முதலாம் நபர் சுட்டுப்பெயரான אָנֹכִי வலியுறுத்தலைக் கொண்டுள்ளது; வெளிப்படையான ‘நான்’ அதைப் போதுமான அளவு தெரிவிக்கிறது. ענה என்பதன் வடிவம் இங்கு எதிர்கால அல்லது முன்வரைவான பதிலைச் சுட்டுகிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: பேசுபவர் மற்றும் பதிலளிப்பவரின் பங்குகளை மாற்றிக் கொள்ளும் இரண்டாவது வழியை அறிமுகப்படுத்தும் பிரிப்பிடைச்சொல்.
- source_word: אֲדַבֵּר
  choice: என்னைப் பேசவிடுங்கள்
  rationale: דבר என்பதன் பியேல் முதலாம் நபர் நிறைவுறா வடிவம். அடுத்துள்ள ஏவலோடு இணைந்து இது அனுமதி கோரும் முன்மொழிவாகச் செயல்படுவதால், நவீன தமிழில் இயல்பாக இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: וַהֲשִׁיבֵנִי
  choice: நீர் எனக்குப் பதிலளியுங்கள்
  rationale: שוב என்பதன் ஹிஃபில் ஆண்பால் ஒருமை ஏவல் வடிவமும் முதலாம் நபர் பின்னொட்டும் சேர்ந்த அமைப்பு; இச்சூழலில் ‘எனக்குப் பதிலளியுங்கள்’ என்பது நேரடியான பரிமாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
