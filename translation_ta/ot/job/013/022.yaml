translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை மரியாதையுடன் ஒருமை நோக்கில் விளிக்கும் ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. நீதிமன்ற வாதத்தைப் போன்ற பரஸ்பர அழைப்பு–பதில் அமைப்பு காக்கப்பட்டுள்ளது.
