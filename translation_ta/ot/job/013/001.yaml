source:
  edition: WLC
  text: הֶן כֹּ֭ל רָאֲתָ֣ה עֵינִ֑/י שָֽׁמְעָ֥ה אָ֝זְנִ֗/י וַ/תָּ֥בֶן לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: ta
  text: இதோ, இவை அனைத்தையும் என் கண் கண்டது; என் காது கேட்டு, அதைப் புரிந்துகொண்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பகுத்தறிந்தது” / “அதை ஆராய்ந்து உணர்ந்தது.” எபிரெயில் சொல்லுக்குச் சொல், “தனக்காகப் புரிந்துகொண்டது” என்று வருகிறது; கேட்டதை உணர்ந்து கொண்டதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் தன்மையை இயல்பான, மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּל
  choice: இவை அனைத்தையும்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அனைத்தும்’; இங்கு முன்பு விவாதிக்கப்பட்ட காரியங்களைத் தொகுத்துச் சுட்டுவதால், தமிழில் வினைகளுக்குரிய செயப்படுபொருளாக ‘இவை அனைத்தையும்’ இயல்பாக அமைகிறது.
- source_word: רָאֲתָה עֵינִי
  choice: என் கண் கண்டது
  rationale: மூலத்தின் ஒருமை உடலுறுப்பு எழுவாயையும் அதன் உயிரோட்டமான நடையையும் காக்கிறது.
- source_word: שָׁמְעָה אָזְנִי
  choice: என் காது கேட்டு
  rationale: ‘என் கண்’ என்பதுடன் உள்ள எபிரெய இணைநிலையைப் பேணுவதற்காக ஒருமை உடலுறுப்பு எழுவாய் தக்கவைக்கப்படுகிறது.
- source_word: וַתָּבֶן לָהּ
  choice: அதைப் புரிந்துகொண்டது
  rationale: בין என்பது ‘புரிந்துகொள்/பகுத்தறி’ என்று பொருள்படும். பெண்பால் ஒருமை வினை அருகிலுள்ள ‘என் காது’ என்பதையே இயல்பாகத் தொடர்கிறது; לָהּ இடம்பெறும் சொற்றொடர் கேட்டதை உணர்ந்து கொண்டதைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது.
