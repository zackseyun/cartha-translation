  terminology: ‘புரிந்துகொண்டது’ என்பது בין வினைக்குச் சரியான, சமயச் சார்பற்ற மொழிபெயர்ப்பு. அடிக்குறிப்பில் ‘பகுத்தறிந்தது’ மற்றும் ‘ஆராய்ந்து உணர்ந்தது’ என்ற மாற்றுகள் கடினமான לָהּ சொற்றொடரின் பொருள்-வீச்சை வாசகருக்குத் தெரிவிக்கின்றன.
