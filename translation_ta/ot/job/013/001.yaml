  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தும் הֶן, ‘அனைத்தும்’ என்ற தொகுப்புச் சுட்டல், ‘என் கண்/என் காது’ என்ற ஒருமை இணைநிலை, மற்றும் கேட்டதைப் புரிந்துகொண்டதாகக் கூறும் இறுதிப் பகுதி ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. “இவை அனைத்தையும்” என்பது சூழலால் நியாயப்படுத்தப்படும் இயல்பான விரிவாக்கம்.
