  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் கண்… என் காது…’ என்ற மூலத்தின் கவித்துவ இணைநிலை காக்கப்பட்டுள்ளது; கடினமான எபிரெய மரபுத்தொடரின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
