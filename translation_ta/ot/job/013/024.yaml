  naturalness: «நீர் ஏன் உமது முகத்தை மறைத்து, என்னை உமது பகைவனாக எண்ணுகிறீர்?» என்பது நவீன நிலையான தமிழில் இயல்பான, மரியாதையான, கவித்துவப் புலம்பல் நடையாக உள்ளது. வினைஎச்சம் «மறைத்து» அடுத்துள்ள நிறைவு வினையுடன் இணைந்து எபிரெய இணைப்பை சீராக வெளிப்படுத்துகிறது.
