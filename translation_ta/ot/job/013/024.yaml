    text: அல்லது, ‘என்னை உமக்குப் பகைவனாகக் கருதுகிறீர்.’
    reason: לְאוֹיֵב לָךְ என்ற தொடரின் இன்னும் சொல்லாட்சிசார் அமைப்பையும், חשב என்பதற்கான ‘கருது’ என்ற இயல்பான மாற்றுச் சொல்லையும் காட்டுகிறது.
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தை நேரடியாக வினவும் எபிரெயச் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: פָנֶיךָ
  choice: உமது முகத்தை
  rationale: சொல்லாட்சியில் உள்ள ‘முகம்’ என்ற உருவகத்தை அப்படியே காக்கிறது; சூழலில் அது பிரசன்னம் அல்லது தயவையும் சுட்டலாம்.
- source_word: תַסְתִּיר
  choice: மறைத்து
  rationale: סתר என்பதன் ‘மறைத்தல்/ஒளித்தல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்தி, ‘முகத்தை மறைத்தல்’ என்ற உறவுசார் வலிமையைத் தக்கவைக்கிறது.
- source_word: וְתַחְשְׁבֵנִי
  choice: என்னை ... எண்ணுகிறீர்
  rationale: חשב என்பதன் ‘எண்ணுதல், மதித்தல், கருதுதல்’ என்ற பொருளைத் தக்கவைக்கும்; இங்கு ஒருவரை ஒரு நிலையிலுள்ளவராக மதிப்பிடுவதைக் குறிக்கிறது.
- source_word: לְאוֹיֵב לָךְ
  choice: உமது பகைவனாக
  rationale: சொல்லாட்சியில் ‘உமக்குப் பகைவனாக’ என்று வரக்கூடிய உறவை, தமிழில் இயல்பான உடைமைத் தொடரால் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவன் ‘தமது முகத்தை மறைத்தல்’ என்ற மனித உருவக மொழி
  choice: ‘உமது முகத்தை மறைத்து’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உமது பிரசன்னத்தை விலக்கி’ அல்லது ‘என்னைவிட்டு முகத்தைத் திருப்பி’
  rationale: மூல எபிரெயம் ‘முகம்’ என்ற கண்கூடான வேதாகம உருவகத்தைப் பயன்படுத்துகிறது. அதை விளக்கமாக மாற்றாமல் வைத்திருப்பது தேவனுடைய பிரசன்னம் அல்லது தயவு பற்றிய கவித்துவத் திறனையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை ஒருமை மரியாதை வடிவான ‘நீர்/உமது/எண்ணுகிறீர்’ என்று அழைக்கும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் நேரடித்தன்மையும் புலம்பலின் உறவுசார் பதற்றமும் காக்கப்பட்டுள்ளன.
