translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் அரையடியின் அறிவு சார்ந்த ஒப்பீடும், இரண்டாம் அரையடியின் சற்றே விரிவான ‘தாழ்ந்தவன் அல்ல’ என்ற ஒப்பீட்டுப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
