  text: כְּֽ֭/דַעְתְּ/כֶם יָדַ֣עְתִּי גַם אָ֑נִי לֹא נֹפֵ֖ל אָנֹכִ֣י מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: ta
  text: நீங்கள் அறிந்திருப்பதை நானும் அறிந்திருக்கிறேன்; நான் உங்களைவிடத் தாழ்ந்தவன் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களைவிடச் சற்றும் குறைந்தவன் அல்ல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: நீங்கள் அறிந்திருப்பதை
  rationale: כ prefixed to דַּעַת with the second-person masculine plural suffix introduces a comparison with the friends' knowledge. In natural modern Tamil, this is best expressed as “நீங்கள் அறிந்திருப்பதை,” which also forms a clear parallel with “நானும் அறிந்திருக்கிறேன்.”
- source_word: יָדַעְתִּי
  choice: அறிந்திருக்கிறேன்
  rationale: Though formally a first-person singular perfect, here the verb describes Job's present possession of knowledge. The Tamil present-perfect/stative expression naturally conveys that continuing state.
- source_word: גַם אָנִי
  choice: நானும்
  rationale: The particle גם with the independent pronoun emphasizes that Job likewise possesses this knowledge. The enclitic உம் gives a concise and natural Tamil equivalent.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: நான் உங்களைவிடத் தாழ்ந்தவன் அல்ல
  rationale: The participle נֹפֵל with comparative מן means being lower than or falling short of others. “உங்களைவிடத் தாழ்ந்தவன் அல்ல” preserves the comparative image and Job's denial of inferiority without restricting it explicitly to intellect.
- source_word: אָנֹכִי
  choice: நான்
  rationale: The independent first-person pronoun is represented explicitly, retaining Job's emphatic self-reference in the negative comparison.
