source:
  edition: WLC
  text: כִּֽי תִכְתֹּ֣ב עָלַ֣/י מְרֹר֑וֹת וְ֝/תוֹרִישֵׁ֗/נִי עֲוֺנ֥וֹת נְעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: ta
  text: ஏனெனில், எனக்கு எதிராகக் கசப்பானவற்றை எழுதுகிறீர்[a]; என் இளமைக் காலத்தின் அக்கிரமங்களைச் சுதந்தரமாகப் பெறச் செய்கிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிராகக் கசப்பானவற்றைத் தீர்மானிக்கிறீர்.” எபிரெய மொழியில் நேரடியாக, “எனக்கு எதிராகக் கசப்பானவற்றை எழுதுகிறீர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் இளமைக் காலத்தின் அக்கிரமங்களுக்கான குற்றப்பழியை” அல்லது “தண்டனையை என்னைச் சுமக்கச் செய்கிறீர்.” எபிரெயச் சொல் அக்கிரமம், குற்றப்பழி, அல்லது அதன் விளைவான தண்டனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோபு தன் முறையீட்டிற்கான காரணத்தைத் தொடர்ந்து விளக்குவதால், காரணத் தொடர்பைக் காட்டும் இயல்பான தமிழ் இணைப்புச் சொல்.
- source_word: תִכְתֹּב עָלַי
  choice: எனக்கு எதிராக ... எழுதுகிறீர்
  rationale: כתב என்பதன் நேரடியான ‘எழுது’ என்ற உருவகத்தைப் பாதுகாக்கிறது; עָלַי இச்சூழலில் எதிர்நிலைப் பொருளைத் தருகிறது. இது ‘தீர்ப்பிடுகிறீர்’ என்று பொருளைத் தேவையின்றி குறுக்கவில்லை.
- source_word: מְרֹרוֹת
  choice: கசப்பானவற்றை
  rationale: குற்றச்சாட்டுகள், தீர்ப்புகள், அல்லது துன்பமான காரியங்கள் என எதைக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல், எபிரெயச் சொல்லின் பொதுவான பன்மைப் பொருளையும் உணர்ச்சித் தீவிரத்தையும் காக்கிறது.
- source_word: וְתוֹרִישֵׁנִי
  choice: நான் சுதந்தரிக்கச் செய்கிறீர்
  rationale: ירשׁ என்பதன் ஹிஃபில் காரணவினை வடிவத்தையும் ‘சுதந்தரித்தல்/உடைமையாக்குதல்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: עֲוֺנוֹת
  choice: அக்கிரமங்களை
  rationale: עָוֹן என்பது அக்கிரமம், அதனால் உண்டாகும் குற்றப்பழி, அல்லது அதன் தண்டனை ஆகியவற்றைக் குறிக்கலாம். முதன்மை உரையில் ஒழுக்கத் தவறைக் குறிக்கும் பரந்த சொல்லை வைத்து, அதன் பிற பொருள் நிழல்களை அடிக்குறிப்பில் தருகிறது.
- source_word: נְעוּרָי
  choice: என் இளமைக் காலத்தின்
  rationale: முதல் நபர் ஒருமை பின்னொட்டுடன் வந்துள்ள construct வடிவத்தை இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: עֲוֺנוֹת என்பதன் சூழற்பொருள்
  choice: இளமைக் காலத்தின் அக்கிரமங்கள்; அவற்றின் குற்றப்பழி அல்லது விளைவையும் உள்ளடக்கக்கூடிய சொல்
  alternative: என் இளமைக் காலப் பாவங்களுக்கான தண்டனைகள் / என் இளமைக் காலத்தின் குற்றப்பழி
  rationale: எபிரெயச் சொல் பாவம், குற்றப்பழி, அல்லது பாவத்தின் தண்டனை என்ற பொருட்களைக் கொள்ள முடியும். வசனம் அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால், முதன்மை உரை அந்த இறையியல் பதற்றத்தையும் பொருள் விரிவையும் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், கடவுளை நோக்கிப் பேசும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. கவித்துவ உருவகங்களான ‘எழுதுதல்’ மற்றும் ‘சுதந்தரித்தல்’ பாதுகாக்கப்பட்டுள்ளன; அதேவேளையில் வாக்கியம் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது.
