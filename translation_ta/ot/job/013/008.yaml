  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: ta
  text: அவருக்காகப் பாரபட்சம் காட்டுவீர்களா?[a] கடவுளுக்காக வாதாடுவீர்களா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவருடைய முகத்தை உயர்த்துவீர்களா?’ இது பாரபட்சம் அல்லது தனிச்சலுகை காட்டுவதைக் குறிக்கும் ஓர் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளின் சார்பாக வழக்காடுவீர்களா?’
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: அவரிடம் பாரபட்சம் காட்டுவீர்களா?
  rationale: ‘அவருடைய முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர் இங்குள்ள நீதிசார் வாதச் சூழலில் ஒருவருக்குச் சார்பாகப் பாரபட்சம் காட்டுவதைக் குறிக்கிறது. மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு ‘அவரிடம்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אִם
  choice: தனி வினாவாக அமைத்தல்
  rationale: இது முதலாவது வினாவுக்கு இணையான இரண்டாவது சொல்லாட்சிவினாவை அறிமுகப்படுத்துகிறது. தமிழில் ‘அல்லது’ என்று வெளிப்படையாகச் சேர்க்காமல், தனி வினாவாக அமைப்பது இயல்பாகவும் மூலத்தின் வினாவுணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: לָאֵל
  choice: கடவுளுக்காக
  rationale: ל முன்னிடைச்சொல் இங்கு ஒருவருக்காக அல்லது அவர் சார்பாகச் செயல்படுவதைக் குறிக்கிறது. אֵל இச்சூழலில் கடவுளையே குறிக்கிறது.
- source_word: תְּרִיבוּן
  choice: வாதாடுவீர்களா
  rationale: ריב என்பதன் சட்டவியல் மற்றும் சர்ச்சைசார் நுணுக்கத்தை ‘வாதாடுதல்’ இயல்பான நவீனத் தமிழில் காக்கிறது; குறிப்பிட்ட நீதிமன்ற நடைமுறையை தேவையின்றி மிகைப்படுத்துவதில்லை.
theological_decisions:
- issue: யோபின் நண்பர்கள் பாரபட்சமாகக் கடவுளுக்காக வாதிடுகிறார்கள் என்ற குற்றச்சாட்டு
  choice: இரண்டு சொல்லாட்சிவினாக்களாக, பாரபட்சம் காட்டுவதையும் கடவுளுக்காக வாதாடுவதையும் யோபு கண்டிப்பதாக மொழிபெயர்த்தல்
  alternative: முதல் பகுதியை ‘அவருடைய முகத்தை உயர்த்துவீர்களா?’ என்றும் இரண்டாம் பகுதியை ‘கடவுளின் சார்பாக வழக்காடுவீர்களா?’ என்றும் மொழிபெயர்க்கலாம்.
  rationale: யோபு தனது நண்பர்கள் கடவுளைக் காக்க முயலும்போது உண்மையற்ற விதத்தில் பேசுவதாகக் கண்டிக்கும் உடனடிச் சூழல், நீதிசார் மற்றும் அறநெறிசார் பொருளை ஆதரிக்கிறது. எனினும் ‘வாதாடுதல்’ என்பது பரந்த சொல்லாக வைக்கப்பட்டு, அது முறையான நீதிமன்ற வழக்குரை மட்டுமே எனக் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாரபட்சம் காட்டுதல்’ நீதிசார் குற்றச்சாட்டைத் தெளிவுபடுத்துகிறது; ‘வாதாடுதல்’ மூலத்தின் சட்டவியல்/சர்ச்சைசார் பரப்பை அளவுக்கு மீறிக் குறுக்காமல் காக்கிறது.
