- from: என் சொல்லைக் கவனமாகக் கேளுங்கள்; என் விளக்கம்[a] உங்கள் செவிகளில் விழட்டும்.
  to: என் சொல்லைக் கவனமாகக் கேளுங்கள்; என் அறிக்கை உங்கள் செவிகளில் ஒலிக்கட்டும்.[a]
  rationale: The revision retains the Hebrew emphatic command and concrete “ears” idiom, while rendering וַאֲחֲוָתִי with the less interpretive, contextually appropriate “அறிக்கை” (“declaration/statement”). The supplied Tamil verb makes the Hebrew's elliptical second clause readable without materially altering its force.
