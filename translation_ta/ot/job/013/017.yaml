lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: கவனமாகக் கேளுங்கள்
  rationale: வினைச்சொல்லுடன் அதே வேரின் வினையெச்சப் பெயர் சேர்ந்து கட்டளையை வலியுறுத்துகிறது. இயல்பான நவீன தமிழில் இந்த வலியுறுத்தலை ‘கவனமாகக் கேளுங்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִלָּתִי
  choice: என் சொல்
  rationale: מִלָּה என்பதன் ‘சொல்/பேச்சு’ என்ற பொருளையும் எபிரெய ஒருமை வடிவத்தையும் ‘என் சொல்’ சுருக்கமாகப் பேணுகிறது.
- source_word: וַאֲחֲוָתִי
  choice: என் விளக்கம்
  rationale: חוה வேரிலிருந்து வந்த இப்பெயர்ச்சொல் இங்கு எடுத்துரைக்கப்படும் உரை, விளக்கம் அல்லது அறிவிப்பைக் குறிக்கலாம். சூழலில் யோபு தன் வழக்கை விரித்துரைக்கிறதால் ‘விளக்கம்’ இயல்பாக உள்ளது; ‘அறிவிப்பு’ என்பதும் சாத்தியம் என்பதைக் குறிப்பு பேணுகிறது.
- source_word: בְּאָזְנֵיכֶם
  choice: உங்கள் செவிகளில் விழட்டும்
  rationale: ‘உங்கள் செவிகளில்’ என்ற எபிரெய மொழிப்படிமத்தைப் பேணியபடி, தமிழில் ஒரு வேண்டுகோளாக இயல்பாக ஒலிக்க ‘விழட்டும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், யோபின் வலியுறுத்தலும் முறையான வேண்டுகோள் தொனியும் பேணப்பட்டுள்ளன. ‘செவிகளில்’ என்ற மூல மொழிப்படிமம் தமிழில் புரியத்தக்க வகையில் வைக்கப்பட்டுள்ளது.
