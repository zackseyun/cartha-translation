  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: ta
  text: என் சொல்லைக் கவனமாகக் கேளுங்கள்; என் அறிக்கை உங்கள் செவிகளில் ஒலிக்கட்டும்.[a]
  philosophy: optimal-equivalence
