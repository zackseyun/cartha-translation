  text: הֲ/לֹ֣א שְׂ֭אֵת/וֹ תְּבַעֵ֣ת אֶתְ/כֶ֑ם וּ֝/פַחְדּ֗/וֹ יִפֹּ֥ל עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: ta
  text: அவருடைய மாட்சிமை[a] உங்களைத் திகிலடையச் செய்யாதா? அவருடைய பேரச்சம்[b] உங்கள்மேல் விழாதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாட்சிமை’ என்பதற்குப் பதிலாக ‘மேன்மை’ அல்லது ‘உயர்வு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயர்ந்த நிலை, கண்ணியம் அல்லது மேன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய பேரச்சம்’ என்பதை ‘அவரைக் குறித்த அச்சம்’ அல்லது ‘அவர் உண்டாக்கும் அச்சம்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: செய்யாதா? ... விழாதா?
  rationale: உறுதியான ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கும் வினாவாக இருப்பதை இயல்பான தமிழ் எதிர்மறை வினா வடிவில் வெளிப்படுத்துகிறது.
- source_word: שְׂאֵתוֹ
  choice: அவருடைய மாட்சிமை
  rationale: உயர்வு, மேன்மை, கண்ணியம் அல்லது மகத்துவமான நிலை ஆகிய பொருள் நிழல்களைக் கொண்ட சொல்லை, இச்சூழலில் கடவுளின் அச்சமூட்டும் உயர்ந்த நிலையை உணர்த்தும் ‘மாட்சிமை’ என மொழிபெயர்க்கிறது.
- source_word: תְּבַעֵת
  choice: திகிலடையச் செய்யாதா
  rationale: בעת என்ற வினையின் தீவிரமான, அச்சுறுத்தும் காரணவினைப் பொருளை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை நேர்செயப்படுபொருளுக்கான இயல்பான தமிழ் இணை.
- source_word: וּפַחְדּוֹ
  choice: அவருடைய பேரச்சம்
  rationale: மூலத்தின் உடைமைத் தொடர்பைத் தக்கவைத்து, פחד என்பதன் தீவிரத்தை ‘பேரச்சம்’ வெளிப்படுத்துகிறது; அது அவர் உணரும் அச்சமா அல்லது அவர் உண்டாக்கும் அச்சமா என்பதை முதன்மை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: உங்கள்மேல் விழாதா
  rationale: ஒருவரை ஆட்கொள்ளும் ஒன்று அவர்மேல் ‘விழுகிறது’ என்ற எபிரெய உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
