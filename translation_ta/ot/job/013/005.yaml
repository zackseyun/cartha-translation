  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: ta
  text: நீங்கள் முற்றிலும் அமைதியாக இருந்தால் எவ்வளவு நன்றாயிருக்கும்![a] அதுவே உங்களுக்கு ஞானமாகவும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆ, நீங்கள் முற்றிலும் அமைதியாக இருந்தால், அது உங்களுக்கு ஞானமாக இருக்கும்!”
    reason: விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடருக்கு இன்னொரு சாத்தியமான தமிழாக்கம்.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: எவ்வளவு நன்றாயிருக்கும்!
  rationale: இது ‘யார் கொடுப்பார்?’ என்ற நேரடிக் கேள்வி அல்ல; தீவிரமான விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். இத்தமிழாக்கம் அதன் விருப்பநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: நீங்கள் முற்றிலும் மவுனமாயிருந்தால்
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச வடிவமும் வினைமுற்றும் இணைந்து செயலை வலியுறுத்துகின்றன. ‘முற்றிலும்’ என்பது அந்த வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּתְהִי
  choice: அதுவே ... இருக்கும்
  rationale: பெண்பால் ஒருமை வினை, முன்னர் கூறப்பட்ட மவுனமாயிருத்தலை அல்லது அந்த நிலையைக் குறிக்கிறது. ‘அதுவே’ என்பது இந்தத் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: ל முன்னொட்டு இங்கு தொடர்பை அல்லது பயனைச் சுட்டுகிறது; ‘உங்களுக்கு’ என்பது நேரடியான இயல்பான தமிழ்.
- source_word: לְחָכְמָה
  choice: ஞானமாக
  rationale: חָכְמָה என்பதன் அடிப்படைப் பொருளான ‘ஞானம்’ பாதுகாக்கப்படுகிறது; ל முன்னொட்டு ‘-ஆக’ என வெளிப்படுத்தப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மவுனமாயிருத்தல்’ என்ற சொல் சூழலின் கண்டிப்பான தொனியைத் தக்கவைக்கிறது; ‘எவ்வளவு நன்றாயிருக்கும்’ என்பது எபிரெய விருப்பநிலையை நேரடிக் கேள்வியாக மாற்றாமல் வெளிப்படுத்துகிறது.
