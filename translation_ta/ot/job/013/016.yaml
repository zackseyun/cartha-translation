id: JOB.13.16
reference: Job 13:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: ta
  text: இதுவும் எனக்கு மீட்பாகும்[a]; ஏனெனில் இறைபக்தியற்றவன்[b] அவர் முன்னிலையில் வரமாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பு’ என்பதற்கு ‘இரட்சிப்பு’, ‘விடுதலை’ அல்லது ‘நான் குற்றமற்றவன் என நிறுவப்படுதல்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இறைபக்தியற்றவன்’ என்பதை ‘இறைநெறியற்றவன்’ அல்லது ‘இறைமறுப்புடன் நடப்பவன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறுமனே நேர்மையற்ற வெளிவேடக்காரனை அல்ல, கடவுளிடம் பயபக்தியற்ற ஒருவனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: இதுவும்
  rationale: கூடுதல் அல்லது வலியுறுத்தலைக் குறிக்கும் இணைப்புச் சொல்லின் இயல்பைத் தமிழில் இயற்கையாகப் பாதுகாக்கிறது.
- source_word: הוּא
  choice: இது
  rationale: வடிவில் ஆண்பால் ஒருமைச் சுட்டுப்பெயராக இருந்தாலும், இச்சூழலில் முன் கூறப்பட்ட நிலை அல்லது செயலைச் சுட்டுவதால் ‘இது’ பொருத்தமானது.
- source_word: לִי
  choice: எனக்கு
  rationale: לִישׁוּעָה என்பதுடன் சேர்ந்து யோபுக்குக் கிடைக்கும் பயன் அல்லது விளைவைக் குறிக்கிறது.
- source_word: לִישׁוּעָה
  choice: மீட்பாகும்
  rationale: יְשׁוּעָה இங்கு விடுதலை, காப்பு, சாதகமான தீர்ப்பு ஆகிய பரந்த நிழற்பொருள்களைக் கொண்டது; ‘மீட்பு’ அந்த விரிவையும் யோபின் வழக்காடும் சூழலையும் இயல்பாகத் தாங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: ஒருவரின் சந்நிதியில் அல்லது அவர் முன்பாக ஆஜராவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை மரியாதையான நவீன தமிழில் வழங்குகிறது.
- source_word: חָנֵף
  choice: இறைபக்தியற்றவன்
  rationale: வெறும் வெளிவேடக்காரனை அல்ல, கடவுளுக்கு உரிய பயபக்தியோ மரியாதையோ இல்லாத நபரைக் குறிக்கும் சமய-ஒழுக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: יָבוֹא
  choice: வரமாட்டான்
  rationale: எபிரெய வினையின் எளிய உறுதிக்கூற்றைத் தமிழில் இயல்பாக வழங்குகிறது; வருவதற்கான அனுமதி அல்லது தகுதி இல்லை என்ற உட்பொருள் சூழலால் வெளிப்படுகிறது.
theological_decisions:
- issue: לְפָנָיו என்பதிலுள்ள சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது
  alternative: யோபு யார் முன் ஆஜராகிறாரோ அவரை பொதுவாகக் குறிக்கலாம்
  rationale: சூழலில் யோபு கடவுளுக்கு முன்பாகத் தன் வழக்கை எடுத்துரைப்பதைப் பேசுவதால் கடவுளே இயல்பான சுட்டுப்பொருள்; இருப்பினும் மூலத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரை வசனத்துக்குள் சேர்க்காமல் சுட்டுப்பெயர் பாதுகாக்கப்பட்டுள்ளது.
- issue: יְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு—விடுதலையையும் சாதகமான தீர்ப்பு அல்லது குற்றமற்றவர் என நிறுவப்படுதலையும் உள்ளடக்குவது
  alternative: இரட்சிப்பு; விடுதலை; வெற்றி; குற்றமற்றவர் என நிறுவப்படுதல்
  rationale: யோபின் கூற்று கடவுளுக்கு முன்பான வழக்கின் சாதகமான முடிவைக் குறித்தாலும், சொல்லின் பரந்த மீட்புப் பொருளை ஒரு சட்டவியல் பொருளாக மட்டும் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் யோபின் நீதிமன்றத் தொனிக்கும் கடவுளுக்கு முன்பான உரையின் கண்ணியத்திற்கும் ஏற்ற உயர்நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்ற மரியாதைப் பெயர்ப்பதிலி தெய்வீகச் சுட்டை இயல்பாகக் காக்கிறது.
