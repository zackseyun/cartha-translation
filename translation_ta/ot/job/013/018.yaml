  text: הִנֵּה נָ֭א עָרַ֣כְתִּי מִשְׁפָּ֑ט יָ֝דַ֗עְתִּי כִּֽי אֲנִ֥י אֶצְדָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: ta
  text: இதோ, இப்போது என் வழக்கைத் தயாரித்துள்ளேன்; நான் சரியானவன் என்று தீர்ப்பளிக்கப்படுவேன்[a] என்பதை அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சரியானவன் என்று நிரூபிக்கப்படுவேன்” அல்லது “நான் நீதிமானாக்கப்படுவேன்.” எபிரெய வினை சட்டவியல் பொருளுடையது; ஒருவர் சரியான தரப்பில் இருப்பதாகக் காட்டப்படுவதையோ அவ்வாறு தீர்ப்பளிக்கப்படுவதையோ இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ, இப்போது
  rationale: הִנֵּה கவனத்தை வலியுறுத்தி ஈர்க்கிறது; נָא இங்கு வேண்டுகோளைவிட உடனடித்தன்மையையும் வலியுறுத்தலையும் தருகிறது. ‘இதோ, இப்போது’ இவ்விரு உரையாடல் நுணுக்கங்களையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עָרַכְתִּי
  choice: ஆயத்தப்படுத்திவிட்டேன்
  rationale: ערך என்பதன் அடிப்படைப் பொருள் ஒழுங்குபடுத்துதல் அல்லது வரிசைப்படுத்துதல். சட்டச் சூழலில், யோபு தன் வாதத்தைத் தொகுத்துத் தயாராக வைத்திருப்பதை இச்சொல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשְׁפָּט
  choice: என் வழக்கை
  rationale: இங்கு מִשְׁפָּט என்பது பொதுவான ‘நீதி’ அல்லது ‘தீர்ப்பு’ என்பதைக் காட்டிலும், கடவுள்முன் யோபு முன்வைக்கத் தயாராக உள்ள சட்டரீதியான வழக்கைக் குறிக்கிறது. முதல் நபர் வினையும் சூழலும் உடைமையை உணர்த்துவதால் ‘என்’ சேர்க்கப்பட்டுள்ளது.
- source_word: יָדַעְתִּי כִּי
  choice: என்பதை அறிவேன்
  rationale: יָדַעְתִּי நிலைபெற்ற நிச்சயத்தை வெளிப்படுத்துகிறது; כִּי அறியப்படும் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்பதை அறிவேன்’ இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲנִי אֶצְדָּק
  choice: நான் குற்றமற்றவன் என்று தீர்ப்புப் பெறுவேன்
  rationale: צדק வினை சட்டவியல் சூழலில் ஒருவன் சரியான தரப்பில் இருப்பதாகத் தீர்மானிக்கப்படுதல் அல்லது நிரூபிக்கப்படுதலைக் குறிக்கிறது. வெளிப்படையான אֲנִי தரும் வலியுறுத்தலை ‘நான்’ காக்கிறது; இத்தமிழாக்கம் பிற்காலக் கோட்பாட்டு அர்த்தத்தைத் திணிக்காமல் நீதிமன்றத் தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோபுவின் கூற்றிலுள்ள சட்டவியல் பொருள்
  choice: ‘நான் குற்றமற்றவன் என்று தீர்ப்புப் பெறுவேன்’—தன் வழக்கில் தனக்குச் சாதகமான நீதித் தீர்ப்பு கிடைக்கும் என்ற யோபுவின் நம்பிக்கை
  alternative: ‘நான் நீதிமானாக்கப்படுவேன்’ அல்லது ‘நான் சரியானவன் என்று நிரூபிக்கப்படுவேன்’
  rationale: צדק இங்கு யோபுவின் நீதிமன்ற உருவகத்துக்குள் வருகிறது. ஆகவே இது பவுலின் நிருபங்களில் காணப்படும் நீதிமானாக்குதல் குறித்த வளர்ச்சியடைந்த கோட்பாட்டுக் கூற்றாக அல்லாமல், வழக்கில் அவர் சரியான தரப்பில் இருப்பதாகத் தீர்ப்பளிக்கப்படுவார் என்ற நம்பிக்கையாக மொழிபெயர்க்கப்பட்டுள்ளது. மாற்று அர்த்தம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடையில் வடிவமைக்கப்பட்டது. ‘வழக்கு’, ‘தீர்ப்புப் பெறுவேன்’ என்பவை மூலத்தின் நீதிமன்றச் சூழலைக் காக்கின்றன; ‘நீதிமானாக்கப்படுவேன்’ எனும் சமயக் கோட்பாட்டு ஒலிப்பை முதன்மை உரையில் தவிர்க்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைத்தொடருக்கு உடனே பின் வைக்கப்பட்டுள்ளது.
