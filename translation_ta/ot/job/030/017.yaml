translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகருக்குப் புரியும் வகையிலும் அமைக்கப்பட்டது. அரிதான உடற்கூறு சொல்லையும் கடினமான முன்விகுதி அமைப்பையும் தீர்மானமாகச் சீராக்காமல், முதன்மை உரை மற்றும் அடிக்குறிப்புகள் மூலம் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
