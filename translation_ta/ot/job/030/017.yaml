base_translation:
  language: en
  yaml_path: translation/ot/job/030/017.yaml
  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: ta
  text: இரவில் என் எலும்புகள் எனக்குள் துளைக்கப்படுகின்றன[a]; என் நரம்புகள்[b] ஓய்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எலும்புகள் என்மேலிருந்து துளையிடப்படுகின்றன”; எபிரெயச் சொற்றொடர் கடினமானது. வினைச்சொல்லைச் சிலர் பொதுவாக “அரிக்கின்றன” என்றும் மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் தசைநாண்கள்” அல்லது “என் இரத்தநாளங்கள்”; இங்குள்ள எபிரெயச் சொல் அரிதானது. உடலிலுள்ள நாண்கள் அல்லது நாளங்களை நேரடியாகவோ, அவற்றில் ஏற்படும் வேதனைகளை ஆகுபெயராகவோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: இரவில்
  rationale: இரவை காலக் குறிப்பாகக் காட்டும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: עֲצָמַי
  choice: என் எலும்புகள்
  rationale: யோபுவின் உடல் வேதனையைச் சித்தரிக்கும் உறுதியான, நேரடியான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: נִקַּר
  choice: துளைக்கப்படுகின்றன
  rationale: נקר என்பதன் ‘துளைத்தல்/துளையிடுதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; பொதுவான ‘அரிக்கின்றன’ என்ற விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: מֵעָלָי
  choice: எனக்குள்
  rationale: சொற்றொடர் எபிரெயத்தில் கடினமானது; உடலுக்குள் நிகழும் வேதனையை இயல்பான தமிழில் தெரிவிக்கிறது. மேலும் சொற்படியான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעֹרְקַי
  choice: என் நரம்புகள்
  rationale: அரிதான עֹרֶק என்ற உடற்கூறு சொல்லின் உறுதியின்மையைப் பாதுகாத்து, அதை நேரடியாக ‘வேதனைகள்’ என்று பொருள்மாற்றம் செய்யாமல் ‘நரம்புகள்’ என வழங்குகிறது.
- source_word: לֹא יִשְׁכָּבוּן
  choice: ஓய்வதில்லை
  rationale: சொற்படியாக ‘படுத்துக்கொள்வதில்லை’; இங்கு இடைவிடாமையைச் சுட்டும் உறக்க/ஓய்வு உருவகத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
