  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: ta
  text: ஏனெனில், நீ என்னை மரணத்திற்கும் உயிருள்ள ஒவ்வொருவருக்கும் நியமிக்கப்பட்ட வீட்டிற்கும் கொண்டுசெல்வாய் என்று நான் அறிவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீ என்னை மரணத்திற்குத் திரும்பக் கொண்டுசெல்வாய்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள வினைச்சொல் ஒருவரைத் திரும்பச் செய்வது அல்லது திரும்பக் கொண்டுபோவது என்ற நிழற்பொருளைக் கொண்டுள்ளது. ‘உயிருள்ள ஒவ்வொருவருக்கும் நியமிக்கப்பட்ட வீடு’ என்பது எல்லாருக்கும் பொதுவான இலக்காகிய கல்லறையையோ பாதாளத்தையோ கவித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புலம்பலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: Qal perfect வடிவம் இங்கு யோபுவின் நிலையான உறுதியைச் சுட்டுகிறது; தமிழில் நிகழ்காலச் சொற்றொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָוֶת
  choice: மரணம்
  rationale: மூலச்சொல் நேரடியாக மரணத்தைக் குறிக்கிறது; பாதாளம் அல்லது கல்லறை என்று கூடுதலாக விளக்காமல் விடப்பட்டுள்ளது.
- source_word: תְּשִׁיבֵנִי
  choice: நீ என்னைக் கொண்டுசெல்வாய்
  rationale: שוב என்பதன் Hiphil வடிவம் ‘திரும்பச் செய்/திரும்பக் கொண்டுபோ’ என்ற நிழற்பொருளைக் கொண்டிருந்தாலும், மரணத்தை இலக்காகக் கூறும் இச்சூழலில் இயல்பான தமிழுக்கு ‘கொண்டுசெல்வாய்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் மாற்று நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּבֵית מוֹעֵד
  choice: நியமிக்கப்பட்ட வீட்டிற்கு
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட காலத்தையோ இடத்தையோ குறிக்கலாம். ‘வீடு’ என்பதோடு வருவதால், அனைவருக்கும் விதிக்கப்பட்ட இடம் என்ற கவித்துவப் படிமத்தை இது காக்கிறது.
- source_word: לְכָל חָי
  choice: உயிருள்ள அனைவருக்கும்
  rationale: சொல்லுக்குச் சொல் ‘உயிருள்ள ஒவ்வொருவருக்கும்’; கூட்டுப் பொதுமையை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘உயிருள்ள அனைவருக்கும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: மரணப் படிமத்தின் பொருள்
  choice: மரணம் எல்லா மனிதருக்கும் பொதுவான முடிவு; அது நியமிக்கப்பட்ட வீடாகக் கவித்துவமாக வருணிக்கப்படுகிறது.
  alternative: ‘வீடு’ என்பது குறிப்பாகக் கல்லறையையோ பாதாளத்தையோ குறிக்கிறது.
  rationale: எபிரெய உரை ‘மரணம்’ என்றும் ‘உயிருள்ள அனைவருக்கும் நியமிக்கப்பட்ட வீடு’ என்றும் கூறுகிறதே தவிர, பாதாளத்தை நேரடியாகப் பெயரிடவில்லை. ஆகவே மறுமை குறித்த மேலதிகக் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்காமல் படிமத்தின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கவித்துவ நடையுடன் மொழிபெயர்க்கப்பட்டது. இரண்டாவது கூறில் உள்ள இலக்குத் தொடர்பைத் தெளிவாக்க ‘கொண்டுசெல்வாய்’ மீண்டும் வழங்கப்பட்டுள்ளது. ‘வீடு’ என்ற மூலப் படிமமும், அது கல்லறை/பாதாளமா என்ற திட்டமிடாத தெளிவின்மையும் காக்கப்பட்டுள்ளன.
