  yaml_path: translation/ot/job/030/004.yaml
  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: ta
  text: அவர்கள் புதர்களுக்கிடையே உவர்ச்செடியைப்[a] பறிப்பவர்கள்; ரேத்தேம் புதர்களின் வேர்களே அவர்களுடைய உணவு.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாலோ செடி.’ எபிரெயத் தாவரப்பெயர் உறுதியற்றது; உப்புத்தன்மையைத் தாங்கி வளரும் காட்டுச் செடியை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அப்பம்.’ இங்கு ‘அப்பம்’ என்பது உணவு அல்லது வாழ்வாதாரம் என்ற விரிந்த பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: பறிப்பவர்கள்
  rationale: קטף என்ற வினை செடிகளை அல்லது அவற்றின் பகுதிகளைப் பறித்தலைக் குறிக்கிறது. எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான வருணனைத் தன்மையைத் தமிழில் பெயரெச்சப் பொருளுடன் இது இயல்பாகக் காக்கிறது.
- source_word: מַלּוּחַ
  choice: உவர்ச்செடி
  rationale: குறிப்பிட்ட தாவர இனம் உறுதியற்றது; உப்புத்தன்மையுள்ள வறண்ட நிலத்தில் வளரும் காட்டுச் செடியைக் குறிக்கலாம். துல்லியமற்ற இனப்பெயரைத் திணிக்காமல், சொல்லின் சாத்தியமான பொருளை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: עֲלֵי שִׂיחַ
  choice: புதர்களுக்கிடையே
  rationale: இங்கு על என்பது புதர்ச்செடிகள் நிறைந்த இடத்தைக் குறிக்கும் இடவியல் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது. தமிழில் இயல்பாகவும், புதர்நிலத்தில் உணவு தேடும் காட்சியைத் தெளிவாகவும் தருகிறது.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: ரேத்தேம் புதர்களின் வேர்
  rationale: רתמים என்பது வறண்ட நிலத்தில் வளரும் broom வகைப் புதரைக் குறிக்கிறது. தவறான தமிழ் தாவர இனத்துடன் அடையாளப்படுத்துவதைத் தவிர்க்க, எபிரெயப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; ஒருமை ‘வேர்’ மூலவடிவத்தின் கூட்டுப்பொருளைத் தக்கவைக்கிறது.
- source_word: לַחְמָם
  choice: அவர்களுடைய உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இச்சூழலில் வாழ்வாதார உணவு என்ற விரிந்த பொருளில் வருகிறது. உண்மையில் அப்பமாகச் சுடப்பட்டது என்ற தவறான எண்ணத்தைத் தவிர்த்து, பிழைப்பின் கடுமையை ‘உணவு’ தெளிவாகக் காட்டுகிறது.
