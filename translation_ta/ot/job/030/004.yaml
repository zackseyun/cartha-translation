translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான வருணனைப் பாணி பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் எபிரெயப் பங்கேற்பு அமைப்பு ‘பறிப்பவர்கள்’ எனத் தக்கவைக்கப்பட்டுள்ளது. அறியப்படாத தாவரத்திற்கு மிகத் துல்லியமான தமிழ் இனப்பெயர் வழங்காமல், தேவையான இடங்களில் விளக்கமும் ஒலிபெயர்ப்பும் பயன்படுத்தப்பட்டுள்ளன.
