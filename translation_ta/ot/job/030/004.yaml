- from: புதர்களுக்கிடையே உவர்ச்செடியைப்[a] பறிப்பவர்கள்; ரேத்தேம் புதர்களின் வேரே அவர்களுடைய உணவு.[b]
  to: அவர்கள் புதர்களுக்கிடையே உவர்ச்செடியைப்[a] பறிப்பவர்கள்; ரேத்தேம் புதர்களின் வேர்களே அவர்களுடைய உணவு.[b]
  rationale: The revision preserves the uncertain botanical reference, the scrubland setting, and the sense of subsistence food. It makes the participial continuation explicit in idiomatic Tamil and uses a natural collective plural for the shrub roots. Footnote markers remain correctly anchored to the relevant renderings.
