  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: ta
  text: புதர்களின் நடுவே அவர்கள் கனைக்கிறார்கள்;[a] முட்செடிகளின் கீழ் அவர்கள் ஒன்றாக நெருங்கிக் குவிந்திருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், கழுதைகள் கத்துவதைக் குறிப்பாகக் குறிக்கும் வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது; ‘அவர்கள் முனகுகிறார்கள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் ஒன்றாகக் கூடுகிறார்கள்’ / ‘ஒன்றாகப் பதுங்குகிறார்கள்.’ எபிரெய வினைச்சொல் நெருக்கமாகக் கூடியிருப்பதைக் குறிக்கிறது; இச்சூழலில் அதன் துல்லியமான நுணுக்கம் உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: நடுவே
  rationale: பன்மையில் வரும் புதர்களுக்கிடையிலான இடத்தைக் குறிக்க, தமிழில் இயல்பான ‘நடுவே’ பயன்படுத்தப்பட்டது.
- source_word: שִׂיחִים
  choice: புதர்கள்
  rationale: வனாந்தரத்தில் வளரும் தாழ்ந்த செடி அல்லது புதரைக் குறிக்கும் பொதுவான, தெளிவான சொல்.
- source_word: יִנְהָקוּ
  choice: கழுதைகளைப்போல் கத்துகிறார்கள்
  rationale: נהק என்பது குறிப்பாகக் கழுதையின் கத்தலைக் குறிக்கிறது. தமிழில் தனித்த வினைச்சொல் இயல்பாக இல்லாததால், மூலத்தின் விலங்கு சார்ந்த கடுமையான உருவகத்தை வெளிப்படையாகப் பாதுகாக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּחַת
  choice: கீழ்
  rationale: நேரடியான இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חָרוּל
  choice: முட்செடிகள்
  rationale: இது முள் நிறைந்த அல்லது தீங்கு தரும் காட்டுச்செடியைக் குறிப்பதாகத் தெரிகிறது; துல்லியமான தாவரவகை உறுதியற்றதால் பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְסֻפָּחוּ
  choice: ஒன்றாக நெருங்கிக் கிடக்கிறார்கள்
  rationale: நெருக்கமாகக் கூட்டப்பட்டிருத்தல் அல்லது ஒட்டிக்கொண்டிருத்தல் என்ற செயலற்ற/தீவிர நுணுக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
