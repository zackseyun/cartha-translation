  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: ta
  text: அவர் என்னைச் சேற்றில் எறிந்தார்[a]; நான் புழுதியையும் சாம்பலையும் போல ஆகிவிட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேற்றில்’ என்பதற்குப் பதிலாக ‘களிமண்ணில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய חֹמֶר என்பது களிமண், மண் அல்லது சேறு என்பதைக் குறிக்கலாம்; இச்சூழலில் அவமானகரமாகச் சேற்றில் வீசப்படும் உருவகம் பொருத்தமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் புழுதிக்கும் சாம்பலுக்கும் ஒப்பாக்கப்பட்டேன்.’ எபிரெய வினைவடிவம் ‘போல ஆனேன்’ அல்லது ‘ஒப்பாக்கப்பட்டேன்’ என்ற இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: அவர் என்னை எறிந்தார்
  rationale: இப்பிறவினை வடிவம் வலுக்கட்டாயமாக எறிதல் அல்லது வீசுதல் என்ற கருத்தைத் தருகிறது. சூழலில் மறைந்துள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை எழுவாய் கடவுளைக் குறிப்பதால், தமிழில் இயல்பாக ‘அவர்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לַחֹמֶר
  choice: சேற்றில்
  rationale: חֹמֶר என்பதற்குக் களிமண், மண் அல்லது சேறு என்ற பொருள்கள் உண்டு. இங்கு தாழ்த்தப்பட்டு அசுத்தத்தில் வீசப்படும் புலம்பல் உருவகத்திற்கு ‘சேறு’ பொருத்தமாகவும் நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: וָאֶתְמַשֵּׁל
  choice: நான் … போல ஆகிவிட்டேன்
  rationale: இந்த வினைவடிவம் ‘ஒப்பாக்கப்பட்டேன்’ அல்லது ‘போல ஆனேன்’ என்ற இடைநிலைப் பொருளைக் கொண்டிருக்கலாம். விளைவாக ஏற்பட்ட நிலையை இயல்பான தமிழில் ‘போல ஆகிவிட்டேன்’ என வழங்குகிறது.
- source_word: כֶּעָפָר
  choice: புழுதியைப் போல
  rationale: עָפָר என்பது புழுதி அல்லது தூசி; இங்கு தாழ்வு, அழிவுநிலை, மானிட நிலையாமை ஆகியவற்றை உணர்த்தும் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וָאֵפֶר
  choice: சாம்பலையும்
  rationale: אֵפֶר என்பதன் வழக்கமான பொருள் ‘சாம்பல்.’ ‘புழுதியும் சாம்பலும்’ என்ற எபிரெய இணைப்பின் உருவக ஒலிப்பைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமை வினையின் மறைந்துள்ள எழுவாய்
  choice: சூழலில் கடவுளைக் குறிக்கும் வகையில் ‘அவர்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: எழுவாயைக் குறிப்பிடாமல் ‘சேற்றில் எறியப்பட்டு…’ என்று மொழிபெயர்த்தல்
  rationale: யோபின் உரையில் இந்த வினையின் எழுவாய் சூழலால் கடவுள் எனத் தெளிவாகிறது. ‘அவர்’ என்பது அந்தச் சூழல் குறிப்பை மட்டும் வெளிப்படுத்துகிறது; கூடுதல் கோட்பாட்டுத் தீர்மானத்தைச் சேர்ப்பதில்லை.
- issue: וָאֶתְמַשֵּׁל வினையின் நிலையாக்க அல்லது ஒப்பாக்க நுணுக்கம்
  choice: ‘போல ஆகிவிட்டேன்’ என்று விளைவுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘புழுதிக்கும் சாம்பலுக்கும் ஒப்பாக்கப்பட்டேன்’ என்று செயப்பாட்டு நுணுக்கத்துடன் மொழிபெயர்த்தல்
  rationale: எபிரெய வடிவம் தன்னை ஒப்பாக்கிக் கொள்ளுதல், ஒப்பாக்கப்படுதல், அல்லது அவ்வாறு ஆகுதல் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது. முதன்மை உரை இயல்பான தமிழில் விளைவுநிலையைத் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் புலம்பலின் கண்ணியமான தீவிரத்தைத் தக்கவைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் ‘அவர்’ மரியாதை ஒருமையில் வழங்கப்பட்டுள்ளது.
