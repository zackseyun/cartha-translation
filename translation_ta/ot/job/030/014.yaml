  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: ta
  text: அகன்ற உடைப்பைப் போல அவர்கள் வருகிறார்கள்[a]; பேரழிவின் நடுவே உருண்டு வருகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகன்ற உடைப்பின் வழியாக அவர்கள் வருகிறார்கள்; பேரழிவின் கீழ் அவர்கள் உருண்டு வருகிறார்கள்.”
    reason: כְ மற்றும் תַּחַת ஆகியவற்றின் தொடரியல் உறவும், הִתְגַּלְגָּלוּ என்பதன் தன்னிலை நுணுக்கமும் வேறுவிதமாகப் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: உடைப்பைப் போல
  rationale: פֶרֶץ என்பது சுவர் போன்ற தடுப்பில் ஏற்பட்ட உடைப்பு அல்லது பிளவைக் குறிக்கிறது; முன்னொட்டு כְּ ஒப்புமையைக் காட்டுவதால், அழிவுடன் முன்னேறும் கூட்டத்தை ஓர் அகன்ற உடைப்புக்கு ஒப்பிடும் படிமம் தக்கவைக்கப்படுகிறது.
- source_word: רָחָב
  choice: அகன்ற
  rationale: உடைப்பின் பரப்பை வலுப்படுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יֶאֱתָיוּ
  choice: அவர்கள் வருகிறார்கள்
  rationale: வினைச்சொல்லின் அடிப்படை ‘வருதல்/நெருங்குதல்’ என்ற பொருளை, கவிதையின் உயிரோட்டமான நிகழ்காலக் காட்சியுடன் நேரடியாக வழங்குகிறது.
- source_word: תַּחַת
  choice: நடுவே
  rationale: இதன் வழக்கமான பொருள் ‘கீழே’ என்றாலும், இங்கு பேரழிவு நிகழும் சூழலைக் குறிக்கலாம்; வாசிக்க இயல்பாக ‘நடுவே’ என வழங்கி, மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
- source_word: שֹׁאָה
  choice: பேரழிவு
  rationale: שֹׁאָה குறிக்கும் அழிவு, நாசம், திடீர் வீழ்ச்சி ஆகிய பொருள் பரப்பை ‘பேரழிவு’ விரிவாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: הִתְגַּלְגָּלוּ
  choice: உருண்டு வருகிறார்கள்
  rationale: גלל என்பதன் உருளுதல் சார்ந்த இயக்கத்தையும், ஹித்பயேல் வடிவத்தின் தன்னியக்கத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
