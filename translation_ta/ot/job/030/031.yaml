translation_notes:
  register: நவீன நிலையான தமிழில், மூலத்தின் இணைநிலை கவிதை அமைப்பையும் ‘இசைக்கருவி புலம்பலாக/அழுகுரலாக மாறுதல்’ என்ற தீவிர உருவகத்தையும் பாதுகாக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு அரைவாக்கியங்களிலும் ‘மாறியது’ என வெளிப்படையாகக் கூறுவது தமிழில் தெளிவையும் இயல்பையும் தருகிறது.
