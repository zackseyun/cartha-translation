  text: וַ/יְהִ֣י לְ֭/אֵבֶל כִּנֹּרִ֑/י וְ֝/עֻגָבִ֗/י לְ/ק֣וֹל בֹּכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: ta
  text: என் யாழ்[a] துக்கமாயிற்று; என் குழல்[b] அழுவோரின் குரலாயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் நரம்பிசைக் கருவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் யாழ் அல்லது வீணை போன்ற ஒரு பண்டைய நரம்பிசைக் கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘என் காற்றிசைக் கருவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு காற்றிசைக் கருவியைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: மாறியது
  rationale: היה இங்கு ஏற்பட்ட நிலைமாற்றத்தைக் குறிக்கிறது. ‘மாறியது’ என்பது யோபின் மகிழ்ச்சியான இசை துயரத்தின் வெளிப்பாடாக ஆனதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְאֵבֶל
  choice: புலம்பலாக
  rationale: אֵבֶל துக்கத்தையும் அதன் வெளிப்பாடான புலம்பலையும் குறிக்கலாம். இசைக்கருவியுடன் வரும் கவிதை உருவகத்தில் ‘புலம்பலாக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּנֹּרִי
  choice: என் யாழ்
  rationale: כִּנּוֹר என்பது யாழ் அல்லது வீணை போன்ற பண்டைய நரம்பிசைக் கருவி. தமிழில் சுருக்கமாகவும் கவிதைநயத்துடனும் சொல்ல ‘யாழ்’ தேர்ந்தெடுக்கப்பட்டது; கருவியின் துல்லிய வடிவம் உறுதியற்றது என்பதை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: וְעֻגָבִי
  choice: என் குழல்
  rationale: עוּגָב என்பது சரியான வடிவம் உறுதியாகத் தெரியாத ஒரு காற்றிசைக் கருவி. ‘குழல்’ அதன் பொதுவான தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: לְקוֹל
  choice: குரலாக
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள். בֹּכִים மனிதர்களைக் குறிப்பதால் ‘அழுகிறவர்களின் குரல்’ என்பது தனிப்பட்ட புலம்பலைத் தக்கவைக்கிறது.
- source_word: בֹּכִים
  choice: அழுகிறவர்கள்
  rationale: இச்செயற்பெயர் அழுதுகொண்டிருக்கும் மக்களைக் குறிக்கிறது. ‘அழுகிறவர்கள்’ என்பது எளிய, நவீனத் தமிழில் மனிதக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
