  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: ta
  text: பற்றாக்குறையாலும் பசியாலும் வாடி மெலிந்த அவர்கள்[a], பாழும் வெறுமையுமான இரவில்[b] வறண்ட நிலத்தைச் சுரண்டுகிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாடி மெலிந்த’ என்பதற்கான எபிரெயச் சொல் அரிதானது. இதை ‘வாடிப்போன’, ‘பாழடைந்த’, அல்லது சிலர் ‘தனிமையான’ என்றும் பொருள் கொள்கின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: ‘இரவில்’ என மொழிபெயர்க்கப்பட்ட אֶמֶשׁ பொதுவாக ‘நேற்று’ அல்லது ‘நேற்றிரவு’ என்று பொருள்படும்; இங்கு கவிதைச் சூழலுக்கு ஏற்ப இரவுநேரம் எனக் கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘சுரண்டுகிறார்கள்’ என்பதற்கான எபிரெயச் சொல் இங்கு தெளிவற்றது. ‘வறண்ட நிலத்தைக் கடித்துத் தேய்க்கிறார்கள்’, ‘வறண்ட நிலத்தைச் சுரண்டுகிறார்கள்’, அல்லது ‘வறண்ட நிலத்துக்குத் தப்பியோடுகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: பற்றாக்குறையாலும் பசியாலும்
  rationale: בְּ இங்கு அவர்கள் வாழ்ந்த சூழ்நிலையையோ காரணத்தையோ குறிக்கலாம். חֶסֶר என்பது பற்றாக்குறை/வறுமை; כָּפָן இச்சூழலில் தனிப்பட்ட பசியைக் குறிக்கிறது.
- source_word: גַּלְמוּד
  choice: உடல் வற்றிப்போன
  rationale: அரிதான இச்சொல் இங்கு பசியால் மெலிந்து வாடிய உடல்நிலையைக் குறிப்பதாகக் கொள்ளப்பட்டுள்ளது. இயல்பான நவீனத் தமிழில் அந்தப் படிமத்தை இது தெளிவாக வழங்குகிறது.
- source_word: הָעֹרְקִים
  choice: சுரண்டித் தின்றனர்
  rationale: இச்சூழலில் மிகவும் கடினமான, அரிதான சொல். அடுத்த வசனத்திலுள்ள உணவு தேடும் படிமத்தோடு பொருந்துமாறு, வறண்ட நிலத்தில் கிடைப்பதை அவசரமாகச் சுரண்டி உண்ணுதல் என மொழிபெயர்க்கப்பட்டுள்ளது; உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צִיָּה
  choice: வறண்ட நிலத்தை
  rationale: צִיָּה என்பது உலர்ந்த, நீரற்ற நிலத்தையோ வறண்ட வெளியையோ குறிக்கிறது. இங்கு நிலத்தின் கடுமையான தன்மையை நேரடியாகக் காட்டுகிறது.
- source_word: אֶמֶשׁ
  choice: இரவில்
  rationale: இச்சொல் பொதுவாக ‘நேற்று’ அல்லது ‘நேற்றிரவு’ என்று பொருள்படும். இக்கவிதைச் சூழலில் இரவுநேரத்தைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: பாழும் வெறுமையுமான
  rationale: ஒத்த ஒலியுடைய இவ்விரு சொற்களும் பேரழிவு, பாழ்மை, வெறுமை ஆகியவற்றை வலுப்படுத்துகின்றன. தமிழிலும் இணையான இரட்டைச் சொல்லாக்கம் கவிதைச் செறிவைப் பேணுகிறது.
