    text: அல்லது, “அவர்களுடைய முழு வலிமை அழிந்துபோயிற்று.” அரிதான எபிரெயப் பெயர்ச்சொல்லை முதிர்ந்த பருவம் அல்லது முழு வலிமையைக் குறிப்பதாகவும் எடுத்துக்கொள்ளலாம்.
