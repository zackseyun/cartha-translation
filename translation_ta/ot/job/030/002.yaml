  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தும் גַּם, ‘அவர்களுடைய கைகளின் வலிமை,’ பயனின்மையைக் கேட்கும் לָמָּה לִּי, மற்றும் அரிதான כָּלַח அழிந்ததாகக் கூறப்படுதல் ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. இறுதிச் சொல்லின் உறுதியற்ற நுணுக்கம் அடிக்குறிப்பில் திறந்தவாறே வைக்கப்பட்டுள்ளது.
  naturalness: “அவர்களுடைய கைகளின் வலிமைகூட எனக்கு எதற்கு?” என்பது நவீன தரத் தமிழில் இயல்பான, சுருக்கமான சொல்லாட்சிக் கேள்வியாக உள்ளது. “அழிந்துபோயிற்று” மூலத்தின் முழுமையான இழப்புத் தொனியை நன்றாகத் தருகிறது.
  terminology: “கைகளின் வலிமை” உடல் உழைப்புத் திறனின் உருவகத்தைப் பாதுகாக்கிறது. “வீரியம்” இச்சூழலில் உடல் வலிமை/வலுவைக் குறிக்க இயலும்; அரிதான כָּלַח-இன் மாற்றுப் பொருள்களான முதிர்ந்த பருவம் மற்றும் முழு வலிமை அடிக்குறிப்பில் உரியவாறு தரப்பட்டுள்ளன.
