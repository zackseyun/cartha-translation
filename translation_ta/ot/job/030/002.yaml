lexical_decisions:
- source_word: גַּם
  choice: கூட
  rationale: கூடுதலாக வலியுறுத்தும் எபிரெயச் சொல்லின் இகழ்ச்சித் தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּחַ יְדֵיהֶם
  choice: அவர்களுடைய கைகளின் வலிமை
  rationale: உடல் உழைப்புக்கான திறனைக் குறிக்கும் கைகளின் உருவகத்தைத் தக்கவைத்துள்ளது.
- source_word: לָמָה לִּי
  choice: எனக்கு எதற்கு?
  rationale: பயனின்மையையும் புறக்கணிப்பையும் தெரிவிக்கும் சொல்லாட்சியைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: עָלֵימוֹ אָבַד
  choice: அவர்களுடைய ... அழிந்துபோயிற்று
  rationale: மரபுத்தொடரின் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; முற்றிலும் இல்லாமற்போனதைக் குறிக்கும் வலுவான வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּלַח
  choice: வீரியம்
  rationale: அரிதான இச்சொல் இங்கு முதிர்ந்த முழு வலிமை அல்லது உடல் வீரியத்தைக் குறிக்கலாம்; சூழலில் 'வீரியம்' தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
