  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: ta
  text: இப்போதோ, என் உயிர் என்மேல் ஊற்றப்பட்டுப்போகிறது[a]; துன்பத்தின் நாட்கள் என்னைப் பிடித்துக்கொள்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உயிர் எனக்குள் ஊற்றப்பட்டுப்போகிறது.” எபிரெய முன்னிடைச்சொல் நேரடியாக “என்மேல்” என்று பொருள்படும்; ஆனால் இந்தச் சொற்றொடர் உள்ளான சோர்வையோ முறிவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: கால மாற்றத்தையும் முந்தைய சூழலுடனான மறைமுக எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: எபிரெய முன்னிடைச்சொல்லின் நேரடியான இடவியல் உருவகத்தைப் பாதுகாக்கிறது; இது உள்ளார்ந்த தளர்ச்சியைக் குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: תִּשְׁתַּפֵּךְ
  choice: ஊற்றுண்டுபோகிறது
  rationale: Hitpael வடிவத்திலுள்ள தன்னை ஊற்றிவிடுதல் அல்லது வடிந்துபோதல் என்ற தொடர்ச்சியான கவிதை உருவகத்தைப் பேணுகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமா
  rationale: நபரின் உள்ளுயிர் அல்லது தன்முழுமையைக் குறிக்கும் נֶפֶשׁ என்பதன் கவிதை மற்றும் மனிதவியல் ஆழத்தைப் பாதுகாக்கிறது.
- source_word: יֹאחֲזוּנִי
  choice: என்னைப் பற்றிக்கொள்கின்றன
  rationale: אחז என்பதன் பிடித்தல், பற்றிக்கொள்ளுதல் என்ற வலிமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְמֵי עֹנִי
  choice: துன்பத்தின் நாட்கள்
  rationale: עֹנִי இங்கு பொருளாதார வறுமைக்கு மட்டும் குறுகாமல் துயரம், அவமானம், வேதனை ஆகிய பரந்த துன்பநிலையைக் குறிக்கிறது.
