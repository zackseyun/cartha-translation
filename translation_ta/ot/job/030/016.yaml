translation_notes:
  register: நவீன தரத் தமிழில், கவிதை நயமும் எபிரெய மூலத்தின் உருவகமும் பாதுகாக்கப்பட்டுள்ளன. “ஆத்துமா” என்பது வேதாகமச் சூழலில் பொதுவாகப் புரியக்கூடிய மரியாதைமிக்க சொல்; “என்மேல்” என்ற மூலத்திற்கு நெருக்கமான வாசகம் பிரதான உரையில் வைக்கப்பட்டு, பொருள்வழி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
