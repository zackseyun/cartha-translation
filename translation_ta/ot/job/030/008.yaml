  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: ta
  text: 'மதிகெட்டவர்களின் மகன்கள்,

    அதுவும் பெயரே இல்லாதவர்களின் மகன்கள்;

    அவர்கள் நாட்டிலிருந்து துரத்தப்பட்டார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல் அரிதானது. இதற்கு ‘அடிக்கப்பட்டார்கள்’ என்றும் பொருள் கொள்ளலாம்; சூழலில் ‘நாட்டிலிருந்து துரத்தப்பட்டார்கள்’ என்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: மதிகெட்டவர்களின் மகன்கள்
  rationale: נָבָל என்பது வெறும் அறிவின்மையை அல்ல, ஒழுக்கத்திலும் சமூக மதிப்பிலும் இழிந்த மதிகேட்ட தன்மையைக் குறிக்கிறது. בְּנֵי என்ற எபிரெய ஆண்பால் பன்மை வடிவையும், ஒரு வகுப்பைச் சேர்ந்தவர்கள் என்ற மொழிவழக்கையும் ‘மகன்கள்’ தக்கவைக்கிறது.
- source_word: גַּם
  choice: ஆம்
  rationale: இரண்டாவது இணை விளக்கத்தை வலியுறுத்திச் சேர்க்கும் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: பெயரே இல்லாதவர்களின் மகன்கள்
  rationale: ‘பெயர் இல்லாமை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, சமூகச் செல்வாக்கும் மதிப்பும் இல்லாத நிலையை அடிக்குறிப்பு விளக்க அனுமதிக்கிறது.
- source_word: נִכְּאוּ
  choice: அடித்துத் துரத்தப்பட்டார்கள்
  rationale: அரிதான இவ்வினைச்சொல்லில் அடித்தல் அல்லது ஒடுக்குதல் என்ற வன்முறை நிழலும், מן הארץ உடன் வரும்போது வெளியேற்றப்படுதல் என்ற சூழல்சார் பொருளும் உள்ளன. இணைந்த தமிழ் சொற்றொடர் இரண்டையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வெளிப்படுத்துகிறது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டைவிட்டு
  rationale: இங்கு אֶרֶץ என்பது பிரபஞ்சமெங்கும் உள்ள ‘பூமி’ என்பதைவிட, மக்கள் வாழும் நிலம் அல்லது சமுதாயப் பரப்பைக் குறிப்பது சூழலுக்கு ஏற்றது.
