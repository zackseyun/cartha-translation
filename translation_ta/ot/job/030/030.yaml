base_translation:
  language: en
  yaml_path: translation/ot/job/030/030.yaml
  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: ta
  text: என் தோல் கறுத்து என்னைவிட்டு உதிர்கிறது[a]; என் எலும்புகள் வெப்பத்தால் எரிகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தோல் என்மேல் கறுத்துப்போயிருக்கிறது.” எபிரெயச் சொற்றொடர் தோல் கறுத்து உரிந்து உதிர்வதையோ, உடல்மேல் கறுத்துத் தொங்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் எலும்புகள் காய்ச்சலால் எரிகின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: என் தோல்
  rationale: עוֹר என்பது மனித உடலைக் குறிக்கும் இச்சூழலில் இயல்பாக ‘தோல்’ என்று பொருள்படும்.
- source_word: שָׁחַר
  choice: கறுத்து
  rationale: இவ்வினை தோல் கருமையடைதலை அல்லது இருண்டுபோவதைச் சுட்டுகிறது; ‘கறுத்து’ என்பது அதன் விளைவு நிலையைக் தெளிவாகத் தருகிறது.
- source_word: מֵעָלָי
  choice: என்னைவிட்டு உதிர்கிறது
  rationale: சொல்லுக்கு சொல் ‘என்மேலிருந்து’ என்பதாகும். நோயுற்ற தோலைப் பற்றிய சூழலில், அது உடலிலிருந்து உரிந்து உதிர்வதைக் குறிக்கலாம்; இந்தப் பொருள் உரையில் இயல்பாகக் கொடுக்கப்பட்டு, எபிரெயச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְעַצְמִי
  choice: என் எலும்புகள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் עֶצֶם இங்கு தொகுப்புப் பொருளில் உடலின் எலும்புகளைக் குறிக்கலாம்; தமிழில் பன்மை இயல்பானது.
- source_word: חָרָה
  choice: எரிகின்றன
  rationale: חרה எரிதல் அல்லது கொதித்தல் போன்ற தீவிர வெப்ப உணர்வைத் தருகிறது; உருவகத்தின் வலிமையை ‘எரிகின்றன’ காக்கிறது.
- source_word: מִנִּי חֹרֶב
  choice: வெப்பத்தால்
  rationale: חֹרֶב வெப்பம் அல்லது வறட்சியால் உண்டாகும் சூட்டைச் சுட்டுகிறது; bodily context-இல் ‘வெப்பத்தால்’ என்பது விரிவான, அதிகமாக விளக்கமளிக்காத மொழிபெயர்ப்பு.
