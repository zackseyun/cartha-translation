  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: ta
  text: நீர் எனக்குக் கொடூரராக மாறிவிட்டீர்[a]; உமது கையின் வல்லமையால் என்னைப் பகைக்கிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் எனக்கு இரக்கமற்றவராகிவிட்டீர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை எதிர்க்கிறீர்” அல்லது “என்னைத் தாக்குகிறீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: மாறிவிட்டீர்
  rationale: நிபால் வடிவம் இங்கு ஒரு நிலைமாற்றத்தைக் குறிக்கிறது. ‘மாறிவிட்டீர்’ என்பது அந்த மாற்றத்தையும் எபிரெய வினையின் நேரடியான குற்றச்சாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לְאַכְזָר
  choice: கொடூரராக
  rationale: אַכְזָר என்பதன் முதன்மைப் பொருள் கொடூரமானவர் அல்லது இரக்கமற்றவர். ‘கொடூரராக’ என்பது வலுவான குற்றச்சாட்டை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לְ முன்னிடைச்சொல் யோபை நோக்கிய உறவைக் குறிக்கிறது. தமிழில் ‘எனக்கு’ என்பது சுருக்கமாகவும் இயல்பாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: בְּעֹצֶם
  choice: வல்லமையால்
  rationale: בְּ இங்கு கருவி அல்லது வழிமுறையையும் עֹצֶם வலிமையையும் குறிக்கின்றன. ‘வல்லமையால்’ இரண்டையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יָדְךָ
  choice: உமது கையின்
  rationale: ‘கை’ என்ற மூல உருவகத்தை ‘அதிகாரம்’ என்று விளக்கிப் பதிலிடாமல் அப்படியே தக்கவைக்கிறது.
- source_word: תִשְׂטְמֵנִי
  choice: என்னைப் பகைக்கிறீர்
  rationale: שׂטם பகைமை கொள்வது அல்லது பகைமையுடன் எதிர்ப்பது என்ற பொருளைக் கொண்டது. ‘பகைக்கிறீர்’ அதன் அடிப்படை பகைமை உணர்வையும் செயற்பாட்டுத் தொனியையும் தக்கவைக்கிறது; தாக்குதல் அல்லது தொடர்ந்த துன்புறுத்தல் என்ற ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
theological_decisions:
- issue: கடவுளின் செயலை மனித உறுப்பின் உருவகத்தில் விவரித்தல்
  choice: கடவுளை நேரடியாக ‘நீர்’ என்று குற்றஞ்சாட்டுவதையும் ‘உமது கை’ என்ற உருவகத்தையும் தக்கவைத்தல்
  alternative: ‘உமது வல்லமை எனக்கு எதிராக உள்ளது’ என்று உருவகத்தையும் குற்றச்சாட்டின் கூர்மையையும் மென்மைப்படுத்துதல்
  rationale: யோபின் புலம்பல் கடவுளை நேரடியாகவும் அதிர்ச்சியூட்டும் தீவிரத்துடனும் எதிர்கொள்கிறது. வசனத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. அதேவேளையில், யோபின் நேரடியான குற்றச்சாட்டும் ‘கை’ என்ற தெளிவான உருவகமும் மென்மைப்படுத்தப்படவில்லை.
