review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Job's darkened/mourning condition, his movement, public setting, and desperate appeal. However, «ஆனால் அது வெயிலால் அல்ல» introduces an explicit pronoun («அது») whose antecedent is not supplied in Hebrew and weakens the compact first-person parallel. «வெயில்» also narrows חַמָּה ('sun') toward heat/sunshine; «சூரியனால் அல்ல» preserves the source wording and causal ambiguity more closely.
  naturalness: The Tamil is generally fluent and appropriately lament-like. «சபையினர் நடுவில்» is less natural for a non-ecclesial public gathering and can sound like a defined church membership. «கூட்டத்தின் நடுவில்» is clear, modern, and suitably broad. «உதவிக்காகக் கதறுகிறேன்» is understandable, though «உதவிக்காகக் கூக்குரலிடுகிறேன்» more directly represents a cry for help without adding the particular nuance of sobbing.
  terminology: «துயரால் இருண்டவனாய்» is a defensible attempt to retain both semantic associations of קֹדֵר, but the instrumental «துயரால்» overstates grief as the cause. «இருண்டவனாய்» keeps the principal wording, while the footnote preserves mourning/blackened alternatives. «சூரியனால் அல்ல» and «கூட்டம்» accurately render חַמָּה and קָהָל without avoidable interpretive or ecclesial coloring.
  issues:
  - severity: medium
    issue: The phrase «துயரால் இருண்டவனாய்» makes grief the stated cause of being darkened.
    rationale: קֹדֵר can evoke mourning as well as a darkened or blackened appearance, but the Hebrew does not explicitly say 'darkened because of grief.' The ambiguity should remain in the main text.
  - severity: medium
    issue: «ஆனால் அது வெயிலால் அல்ல» adds an antecedent pronoun and renders 'sun' more narrowly as sunshine/heat.
    rationale: The Hebrew is tersely 'not by the sun.' Using «சூரியனால் அல்ல» more closely reflects both its wording and its deliberately compact syntax.
  - severity: low
    issue: «சபையினர் நடுவில்» may suggest an ecclesial group.
    rationale: קָהָל here denotes an assembled public group. «கூட்டத்தின் நடுவில்» is natural and avoids later religious institutional associations.
  - severity: low
    issue: «கதறுகிறேன்» can specifically suggest sobbing or wailing.
    rationale: The verb שוע is a desperate cry for help. «கூக்குரலிடுகிறேன்» preserves the urgent appeal without specifying its vocal quality beyond the source.
  revised_text: இருண்டவனாய்[a] நான் அலைகிறேன்; சூரியனால் அல்ல[b]. கூட்டத்தின் நடுவில் எழுந்து உதவிக்காகக் கூக்குரலிடுகிறேன்.
