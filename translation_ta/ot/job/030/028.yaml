  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: ta
  text: இருண்டவனாய்[a] நான் அலைகிறேன்; சூரியனால் அல்ல[b]. கூட்டத்தின் நடுவில் எழுந்து உதவிக்காகக் கூக்குரலிடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துக்கத்துடன்” / “கறுத்தவனாய்.” எபிரெயச் சொல் துயரநிலையையும் இருண்ட அல்லது கறுத்த தோற்றத்தையும் உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “சூரியனால் அல்ல.” யோபின் இருண்ட தோற்றம் சூரிய வெளிப்பாட்டால் ஏற்பட்டதல்ல என்பதே கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: துயரால் இருண்டவனாய்
  rationale: קדר என்பது இருண்ட அல்லது கறுத்த தோற்றத்தையும் துக்கநிலையையும் குறிக்கக்கூடும். இவ்விரு நிழற்பொருள்களையும் இயன்றவரை ஒன்றாகத் தக்கவைக்கிறது.
- source_word: הִלַּכְתִּי
  choice: நான் அலைகிறேன்
  rationale: கவிதைமிகு புலம்பலில் தொடரும் நிலையையும் அங்குமிங்கும் செல்வதையும் இயல்பான நிகழ்காலத்தில் வெளிப்படுத்துகிறது.
- source_word: בְּלֹא חַמָּה
  choice: ஆனால் அது வெயிலால் அல்ல
  rationale: மூலத்தில் சொற்சொல்லாக 'சூரியனால் அல்ல' என்று உள்ளது. தமிழில் 'வெயிலால் அல்ல' என்பது சூரிய வெப்பம் அல்லது வெளிப்பாட்டால் இந்த இருண்ட நிலை ஏற்படவில்லை என்ற எதிர்மறைக் காரணத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: קַמְתִּי
  choice: எழுந்து
  rationale: பொதுக்கூட்டத்தின் நடுவில் யோபு எழுந்து முறையிடும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַקָּהָל
  choice: சபையினர் நடுவில்
  rationale: קהל கூடியிருக்கும் மக்களைக் குறிக்கிறது. 'சபையினர்' என்பது இங்கு மதப்பிரிவு சார்ந்த குறிப்பைச் சேர்க்காமல் பொதுக்கூட்ட மக்களை உணர்த்துகிறது.
- source_word: אֲשַׁוֵּעַ
  choice: உதவிக்காகக் கதறுகிறேன்
  rationale: שוע என்பது துயரத்தில் உதவி கோரி எழுப்பும் உரத்த அழுகுரலைக் குறிக்கிறது; 'கதறுகிறேன்' அதன் தீவிரத்தைத் தக்கவைக்கிறது.
