revisions:
- from: துயரால் இருண்டவனாய்[a] நான் அலைகிறேன்; ஆனால் அது வெயிலால் அல்ல[b]. சபையினர் நடுவில் எழுந்து உதவிக்காகக் கதறுகிறேன்.
  to: இருண்டவனாய்[a] நான் அலைகிறேன்; சூரியனால் அல்ல[b]. கூட்டத்தின் நடுவில் எழுந்து உதவிக்காகக் கூக்குரலிடுகிறேன்.
  rationale: The revision removes the causal overstatement in «துயரால்», retains the lexical ambiguity of קֹדֵר through footnote a, restores the source-near «சூரியனால் அல்ல» without an added pronoun, and uses broad non-ecclesial wording for קָהָל. The final verb explicitly conveys an urgent appeal for help while remaining natural in modern standard Tamil.
  reviewer_model: gpt-5.6-terra
