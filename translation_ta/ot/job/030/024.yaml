  source_fidelity: முதன்மை உரை אַךְ-ஐ வலியுறுத்தலாகவும், יִשְׁלַח יָד உருவகத்தைச் சொல்லுக்குச் சொல் நெருக்கமாகவும், בְּעִי-யின் ‘இடிபாட்டுக் குவியல்’ என்ற சாத்தியமான பொருளுடனும் வழங்குகிறது. אִם-ன் நிபந்தனைத் தன்மையும், בְּפִידוֹ-வின் ‘அவருடைய பேரிடரில்’ என்ற பொருளும் காக்கப்பட்டுள்ளன. לָהֶן என்பதன் மிகக் கடினமான தொடர்பு முதன்மை உரையில் ஊகித்துச் சேர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது; இது இவ்விடத்தின் உரைத் தெளிவின்மையைப் பாதுகாக்கும் பாதுகாப்பான நடைமுறை.
  naturalness: நவீனத் தரமான தமிழில் நடை கண்ணியமாகவும் வாசிக்கத்தக்கதாகவும் உள்ளது. “கையை நீட்டமாட்டார்” என்பது எபிரெய உருவகத்தின் முறையான, இயல்பான தமிழ் வடிவம். இறுதிக் கூறின் நிபந்தனை அமைப்பு சற்றே கடினமாகத் தோன்றுவது மூலத்தின் கடினமான தொடரமைப்பை அளவுக்கு மீறிச் சீராக்காமல் காப்பதன் விளைவாகும்.
  terminology: “பேரிடர்,” “உதவிக்கான கூக்குரல்,” மற்றும் “இடிபாட்டுக் குவியல்” ஆகியவை மூலத்தின் பொருள்வெளிக்கும் கவிதைநடைக்கும் ஏற்றவை. இறையியல் சொற்கள் அல்லது கோட்பாட்டு விளக்கங்கள் திணிக்கப்படவில்லை. அடிக்குறிப்பு மாற்று வாசிப்பையும் לָהֶן குறித்த தெளிவின்மையையும் சரியாகச் சுட்டுகிறது.
