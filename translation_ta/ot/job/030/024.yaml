source:
  edition: WLC
  text: אַ֣ךְ לֹא בְ֭/עִי יִשְׁלַח יָ֑ד אִם בְּ֝/פִיד֗/וֹ לָהֶ֥ן שֽׁוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: ta
  text: “நிச்சயமாக, இடிபாட்டுக் குவியலுக்கு எதிராக ஒருவர் கையை நீட்டமாட்டார்[a]—அவருடைய பேரிடரில் உதவிக்கான கூக்குரல் எழுந்தால்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக, இடிபாட்டுக் குவியலிடம் ஒருவர் கையை நீட்டமாட்டார்; அவருடைய பேரழிவில் உதவிக்கான கூக்குரல் எழுந்தால்.” இவ்வசனத்தின் எபிரெய வாசகம் மிகவும் கடினமானது; குறிப்பாக “இடிபாட்டுக் குவியலுக்கு எதிராக” என்றும், לָהֶן என்ற சொல்லின் தொடர்பும் தெளிவற்றவை.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: இங்கு இச்சொல் யோபுவின் கூற்றை வலியுறுத்தும் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; கட்டுப்படுத்தும் ‘மட்டும்’ அல்லது எதிர்மறைத் திருப்பத்தைக் காட்டும் ‘ஆனால்’ என்பவற்றைவிட ‘நிச்சயமாக’ பொருத்தமானது.
- source_word: בְּעִי
  choice: இடிபாட்டுக் குவியலுக்கு எதிராக
  rationale: அரிதானதும் பொருள் தெளிவில்லாததுமான இச்சொல் பொதுவாக இடிபாடு அல்லது இடிபாட்டுக் குவியல் எனப் புரிந்துகொள்ளப்படுகிறது. בְּ என்ற முன்னொட்டையும் ‘கையை நீட்டு’ என்ற அடுத்த சொற்றொடரையும் சேர்த்துப் பார்க்கையில், ஏற்கெனவே அழிந்த ஒன்றுக்கு எதிரான செயல் என்ற சாத்தியமான பொருளை இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: יִשְׁלַח יָד
  choice: கையை நீட்டமாட்டார்
  rationale: எபிரெய உருவகத்தைத் தக்கவைக்கும் இயல்பான தமிழ் சொற்றொடர் இது; சூழலில் இது தீங்கு செய்யும் அல்லது தாக்கும் செயலைக் குறிக்கலாம்.
- source_word: אִם
  choice: எழுந்தால்
  rationale: இச்சொல் நிபந்தனையைக் குறிக்கும் ‘என்றால்’ என்ற பொருளில் கொள்ளப்பட்டு, இரண்டாம் கூறு இயல்பான தமிழில் இணைக்கப்பட்டுள்ளது; தெளிவில்லாத தொடரமைப்பு அளவுக்கு மீறித் தீர்மானிக்கப்படவில்லை.
- source_word: בְּפִידוֹ
  choice: அவருடைய பேரிடரில்
  rationale: פיד என்பது பேரழிவு அல்லது பேரிடரைக் குறிக்கிறது. முன்னொட்டையும் ஆண்பால் ஒருமை உடைமை விகுதியையும் இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: לָהֶן
  choice: வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இவ்வடிவம் இச்சூழலில் மிகத் தெளிவற்றது; ‘அவர்களிடமிருந்து,’ ‘அவர்களுக்காக,’ அல்லது ‘அதில்’ எனப் பலவாறு புரிந்துகொள்ளலாம். உறுதியற்ற ஒரு தொடர்பை முதன்மை உரையில் திணிக்காமல், சிக்கல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: שׁוּעַ
  choice: உதவிக்கான கூக்குரல்
  rationale: துன்பத்தில் உதவி கோரி எழுப்பப்படும் கூக்குரலை இப்பெயர்ச்சொல் குறிக்கிறது; அதன் நோக்கம் தமிழில் தெளிவாக வெளிப்படுகிறது.
