source:
  edition: WLC
  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: ta
  text: என் உள்ளுறுப்புகள் கொதிக்கின்றன; அவை ஓய்வதே இல்லை[a]. துன்ப நாட்கள் என்னை எதிர்கொள்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அகமெல்லாம் கொந்தளிக்கிறது; அடங்குவதே இல்லை; துயர நாட்கள் என்மேல் வந்துவிட்டன.”
    reason: உள் உறுப்புகள் என்ற நேரடியான உடல் உருவகம், ‘அகம்’ என்ற கவிதைநடைப் பொருள், וכן דמם மற்றும் קדם ஆகிய சொற்களின் மாற்றுப் பொருள் நிழல்கள் ஆகியவற்றைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: מֵעַי
  choice: என் உள்ளுறுப்புகள்
  rationale: இந்தச் சொல் உடலின் உள் உறுப்புகளைக் குறித்தாலும், கவிதைநடையில் ஆழ்ந்த உள்ளுணர்வுகளையும் குறிக்கலாம். ‘உள்ளுறுப்புகள்’ என்பது உடல்சார்ந்த தீவிரமான உருவகத்தைப் பாதுகாக்கிறது; ‘இதயம்’ என்று மொழிபெயர்த்து பொருளைச் சுருக்கவில்லை.
- source_word: רֻתְּחוּ
  choice: கொதிக்கின்றன
  rationale: רתח என்ற வேர்ச்சொல்லின் ‘கொதித்தல், குமுறுதல்’ என்ற வலுவான உடல் உருவகத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא דָמּוּ
  choice: அவை ஓய்வதே இல்லை
  rationale: דמם என்பதற்கு ‘அமைதியாதல், ஓய்தல், அடங்குதல்’ ஆகிய பொருள்கள் உள்ளன. இங்கு தொடரும் உள்ளார்ந்த வேதனையை இயல்பான தமிழில் காட்ட ‘ஓய்வதே இல்லை’ எனத் தரப்பட்டுள்ளது.
- source_word: קִדְּמֻנִי
  choice: என்னை எதிர்கொள்கின்றன
  rationale: קדם இங்கு ஒருவரைச் சந்திக்க அல்லது எதிரே வருவதைக் குறிக்கிறது. துன்ப நாட்கள் உயிருள்ளவைபோல் யோபை எதிர்த்து வருவதை இந்தத் தேர்வு பாதுகாக்கிறது.
- source_word: יְמֵי עֹנִי
  choice: துன்ப நாட்கள்
  rationale: עֹנִי இச்சூழலில் வெறும் பொருளாதார வறுமையை அல்ல, வேதனை மற்றும் துயரத்தைச் சுட்டுகிறது. ‘துன்ப நாட்கள்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
