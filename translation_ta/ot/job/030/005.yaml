  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: ta
  text: பள்ளத்தாக்கிலிருந்து[b] அவர்கள் விரட்டியடிக்கப்படுகிறார்கள்; திருடனை நோக்கிக் கூச்சலிடுவதுபோல் அவர்களை நோக்கிக் கூச்சலிடுகிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருடனைப் போல அவர்களை நோக்கிக் கூச்சலிடுகிறார்கள்.” எபிரெயத்தில் ‘கூச்சலிடுகிறார்கள்’ என்பதன் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “பள்ளத்தாக்கு” என்பதற்கான எபிரெயச் சொல் “பள்ளம்,” “இடுக்கு,” அல்லது “நடு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: நடுவிலிருந்து
  rationale: מִן பிரிவையும் புறப்படும் இடத்தையும் குறிக்கிறது; גֵּו என்பதன் அடிப்படைப் பொருளான ‘நடு/உட்பகுதி’யை முதன்மை உரை காக்கிறது. சூழலுக்கேற்ற ‘பள்ளத்தாக்கு’ அல்லது ‘இடுக்கு’ என்ற புவியியல் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְגֹרָשׁוּ
  choice: அவர்கள் துரத்தப்படுகிறார்கள்
  rationale: வலுக்கட்டாயமாக வெளியேற்றப்படுவதை உணர்த்தும் எபிரெயச் செயலின் செயப்பாட்டு வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: יָרִיעוּ
  choice: கூச்சலிடுகிறார்கள்
  rationale: ‘கூக்குரல் எழுப்பு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. எபிரெயத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் குறிப்பிட்ட பெயர்ச்சொல் சேர்க்கப்படவில்லை.
- source_word: עָלֵימוֹ
  choice: அவர்களைத் துரத்திக்
  rationale: கூச்சலின் பகைமையான திசையைச் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது; ‘அவர்களுக்கு எதிராக’ என்பதும் சாத்தியம்.
- source_word: כַּגַּנָּב
  choice: திருடனைத் துரத்துவதுபோல்
  rationale: திருடனைக் கண்டபோது எழுப்பப்படும் கூச்சலுடன் செய்யப்படும் ஒப்பீட்டைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘திருடனைப்போல்’ என்ற சுருக்கமான வாசிப்பின் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
