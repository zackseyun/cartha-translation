  text: בַּ/עֲר֣וּץ נְחָלִ֣ים לִ/שְׁכֹּ֑ן חֹרֵ֖י עָפָ֣ר וְ/כֵפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: ta
  text: காட்டாற்றுப் படுகைகளில்[a] உள்ள பள்ளங்களில், மண்ணிலும் பாறைகளிலும் உள்ள பொந்துகளில்[b] அவர்கள் குடியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீரோடைப் பள்ளத்தாக்குகளில்”; נְחָלִים என்பது சூழலுக்கேற்ப காட்டாறுகள், நீரோடைப் படுகைகள் அல்லது பள்ளத்தாக்குகள் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மண்ணிலுள்ள துளைகளிலும் பாறைப் பிளவுகளிலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: பள்ளங்களிலும்
  rationale: עָרוּץ என்பது நீரால் அரிக்கப்பட்ட கால்வாய் போன்ற பள்ளத்தையோ குறுகிய பள்ளத்தாக்கையோ குறிக்கிறது. “பள்ளங்கள்” என்பது இந்த நில அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נְחָלִים
  choice: காட்டாற்றுப் படுகைகளின்
  rationale: נַחַל என்பது பெரும்பாலும் பருவகாலத்தில் நீர் பாயும் ஓடை அல்லது அதன் படுகையைக் குறிக்கும். “காட்டாற்றுப் படுகை” என்பது வற்றியிருக்கக்கூடிய நீர்வழி என்ற அருகைக் கிழக்கத்திய நில அமைப்பைத் தமிழில் புரியும்படி காட்டுகிறது.
- source_word: לִשְׁכֹּן
  choice: அவர்கள் குடியிருக்கிறார்கள்
  rationale: இங்குள்ள வினையெச்ச வடிவம் முந்திய சூழலுடன் இணைந்து வாழ்விடத்தைக் குறிக்கிறது. தமிழில் முழுமையான வாக்கியமாக இயல்பாக இருக்க, எழுவாயுடன் கூடிய finite verb பயன்படுத்தப்பட்டுள்ளது.
- source_word: חֹרֵי
  choice: பொந்துகளிலும்
  rationale: חוֹר என்பது துளை, பொந்து அல்லது குழிவு. “பொந்து” இங்கு குறிப்பிடப்படும் தாழ்வான, கடினமான குடியிருப்பை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: עָפָר
  choice: மண்
  rationale: עָפָר என்பதற்கு தூசி, தளர்ந்த மண், நிலம் ஆகிய பொருள்கள் உண்டு. “மண் பொந்துகள்” என்பது தமிழில் இயல்பாகவும் புவியியல் படிமத்துக்கு ஏற்றவாறும் உள்ளது.
- source_word: וְכֵפִים
  choice: பாறைகளிடையிலும்
  rationale: כֵּפִים என்பது பாறைகள் அல்லது செங்குத்தான பாறைத் திரள்களைக் குறிக்கிறது. எபிரேயத்தில் உட்கிடையாக உள்ள இடப்பொருளை “பாறைகளிடையில்” தெளிவாக வெளிப்படுத்துகிறது.
