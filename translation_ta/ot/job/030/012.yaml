  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: ta
  text: என் வலப்பக்கத்தில் ஒரு கும்பல் எழும்புகிறது[a]; அவர்கள் என் கால்களைத் தள்ளிவிடுகிறார்கள்[b]; எனக்கு எதிராகத் தங்கள் அழிவுப் பாதைகளை உயர்த்தி அமைக்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டுப்பாடற்ற கூட்டம்’ அல்லது ‘இளையோர் கூட்டம்’ என்றும் பொருள்கொள்ளலாம்; פִּרְחַח என்பது இகழ்ச்சிக்குரிய அல்லது ஒழுங்கற்ற ஒரு கூட்டத்தைக் குறிக்கும் அரிதான எபிரெயச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘அவர்கள் என் கால்களை அனுப்பிவிடுகிறார்கள்.’ அவர்கள் யோபின் காலூன்றலை அகற்றுகிறார்கள், அவரை வழிவிலகச் செய்கிறார்கள், அல்லது தடுமாறச் செய்கிறார்கள் என்பது கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘எனக்கு எதிராகத் தங்கள் அழிவுப் பாதைகளை உயர்த்தி அமைக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயம் பகைமைப் பொருளில் பாதையை மண் குவித்து உயர்த்தி அமைக்கும் உருவகத்தைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: என் வலப்பக்கத்தில்
  rationale: இது பகைவர்கள் யோபின் வலப்புறத்தில் நிலைகொள்வதைக் குறிக்கும் இடவியல் சொற்றொடர்; சூழலில் உள்ள முதலாம் நபர் உறவை இயல்பான தமிழில் வெளிப்படுத்த ‘என்’ சேர்க்கப்பட்டுள்ளது.
- source_word: פִּרְחַח
  choice: ஒரு கும்பல்
  rationale: அரிதான இச்சொல் இகழ்ச்சிக்குரிய, கட்டுப்பாடற்ற கூட்டத்தைக் குறிப்பதாகத் தெரிகிறது. ‘கும்பல்’ கூட்டு ஒருமையையும் யோபின் இகழ்ச்சித் தொனியையும் இயல்பாகத் தருகிறது.
- source_word: יָקוּמוּ
  choice: எழும்புகிறது
  rationale: קום இங்கு பகைமையுடன் எழுந்து நிற்பதைக் குறிக்கிறது; ‘கும்பல்’ என்ற கூட்டு ஒருமைக்கு ஏற்ப தமிழில் ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: அவர்கள் என் கால்களைத் தள்ளிவிடுகிறார்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘என் கால்களை அனுப்பிவிடுகிறார்கள்’ என்று வந்து தெளிவற்றுள்ளது. தமிழில் பொருளற்ற சொற்பெயர்ப்பைத் தவிர்த்து, யோபின் காலூன்றலை அகற்றுவது அல்லது அவரைத் தடுமாறச் செய்வது என்ற சாத்தியமான படிமத்தை ‘தள்ளிவிடுகிறார்கள்’ காக்கிறது; நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיָּסֹלּוּ
  choice: மேடாக்குகிறார்கள்
  rationale: סלל பொதுவாகப் பாதையை மண் குவித்து உயர்த்தி அமைப்பதைக் குறிக்கும். ‘மேடாக்குகிறார்கள்’ பாதை அமைக்கும் உருவகத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: பகைமை நிறைந்த சூழலில் இந்த முன்னிடைச்சொல் வெறும் இடத்தைக் காட்டாமல் எதிர்ப்பைக் குறிக்கிறது.
- source_word: אָרְחוֹת אֵידָם
  choice: தங்கள் அழிவுப் பாதைகளை
  rationale: אָרְחוֹת என்பது பாதைகள்; אֵידָם என்பது ‘அவர்களுடைய அழிவு/பேரிடர்’ எனப் பொருள்படலாம். ‘தங்கள் அழிவுப் பாதைகள்’ உடைமைப் பின்னொட்டையும் அழிவை நோக்கிய பகைமைப் படிமத்தையும் காக்கிறது.
