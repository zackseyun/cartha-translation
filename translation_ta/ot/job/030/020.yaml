base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: ta
  text: நான் உம்மை நோக்கிக் கூக்குரலிடுகிறேன்; ஆனால் நீர் எனக்குப் பதிலளிப்பதில்லை. நான் நிற்கிறேன்; நீர் என்னை உற்றுப் பார்க்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் நின்றேன்; நீர் என்னைக் கூர்ந்து கவனித்தீர்.” எபிரெய வினை வடிவங்களை இறந்தகாலமாக வாசிக்கலாம்; ‘பார்த்தல்’ எனும் வினை கவனமாக நோக்குதல் அல்லது ஆராய்ந்து கவனித்தல் என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: கூக்குரலிடுகிறேன்
  rationale: שׁוע என்பதன் பியேல் வடிவம் உதவிக்கான தீவிரமான கூக்குரலைக் குறிக்கிறது. ‘கூக்குரலிடுகிறேன்’ என்பது வேண்டுகோளின் உள்ளடக்கத்தை மிகையாக விளக்காமல் அதன் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மை நோக்கி
  rationale: אֶל முன்னிடைச்சொல் இங்கு வேண்டுதல் செலுத்தப்படும் திசையையும் நபரையும் குறிக்கிறது. இறைவனை நேரடியாக அழைக்கும் கண்ணியமான நவீனத் தமிழுக்கு ‘உம்மை நோக்கி’ இயல்பானது.
- source_word: וְלֹא תַעֲנֵנִי
  choice: ஆனால் நீர் எனக்குப் பதிலளிப்பதில்லை
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதிலளி’. וְ இங்கு எதிர்மறை முரண்பாட்டைக் காட்டுவதால் தமிழில் ‘ஆனால்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עָמַדְתִּי
  choice: நான் நிற்கிறேன்
  rationale: வடிவியல் அடிப்படையில் இது நிறைவுற்ற வினை (‘நின்றேன்’); எனினும் முன் வரும் நிகழ்காலப் புலம்பலுடன் இணைந்த உயிரோட்டமான தொடர்நிலையாகவும் புரிந்துகொள்ளலாம். முதன்மை உரை அந்த நிகழ்கால வலிமையைத் தக்கவைக்கிறது; இறந்தகால வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: நீர் என்னை உற்றுப் பார்க்கிறீர்
  rationale: התבונן என்பது கவனமாகப் பார்த்தல் அல்லது ஆராய்ந்து கவனித்தல் என்று பொருள்படலாம். ‘உற்றுப் பார்க்கிறீர்’ என்பது வெறுமனே பார்ப்பதைவிட அதன் கவனமான நுணுக்கத்தைத் தக்கவைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மட்டுமே’ என்பதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: தேவன் பதிலளிக்காமல் பார்ப்பதை எவ்வளவு விளக்கமாகச் சொல்லுவது
  choice: பதில் இல்லாமையையும் தேவன் உற்றுப் பார்ப்பதையும் மட்டும் கூறி, புறக்கணிப்பு அல்லது மீட்க மறுப்பு என்று கூடுதலாக விளக்கவில்லை
  alternative: ‘நீர் என்னைப் புறக்கணிக்கிறீர்’ அல்லது ‘நீர் என்னைக் காப்பாற்றுவதில்லை’
  rationale: எபிரெய உரை யோபுவின் பதிலளிக்கப்படாத மன்றாட்டையும் தேவனின் கவனமான பார்வையையும் அருகருகே வைக்கிறது. அது ‘புறக்கணித்தல்’ அல்லது ‘காப்பாற்ற மறுத்தல்’ என்று நேரடியாகச் சொல்லாததால், அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரு குறும் வாக்கியங்களும் புலம்பலின் நேரடியான தீவிரமும் காக்கப்பட்டுள்ளன.
