  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: ta
  text: நீர் என்னைக் காற்றின்மேல் தூக்கி, அதன்மேல் ஏறிச் செல்ல வைக்கிறீர்; புயலில் என்னைக் கரைந்துபோகச் செய்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தின் இறுதிச் சொல் பொருள் காண்பதற்குக் கடினமானது. இவ்வரியை, “புயலில் என்னை அலைக்கழிக்கிறீர்” என்றோ, “என்னை அழிவில் கரைத்துவிடுகிறீர்” என்றோ மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: என்னைத் தூக்கி
  rationale: נשׂא என்பதன் ‘தூக்குதல், சுமத்தல்’ என்ற நேரடியான படிமத்தைப் பாதுகாக்கிறது.
- source_word: אֶל רוּחַ
  choice: காற்றின்மேல்
  rationale: רוּחַ இச்சூழலில் வானிலை சார்ந்த ‘காற்று’ என்பதே பொருத்தம். אֶל இங்கு காற்றின்மேல் ஏற்றப்படுவதைச் சுட்டுவதாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: תַּרְכִּיבֵנִי
  choice: அதன்மேல் சவாரிசெய்ய வைக்கிறீர்
  rationale: רכב என்பதன் ஹிஃபீல் வடிவிலுள்ள ‘சவாரிசெய்ய வைத்தல்’ என்ற causative பொருளைத் தெளிவாகக் காட்டுகிறது; ‘அதன்மேல்’ என்பது முன்வந்த காற்றைக் குறிக்கிறது.
- source_word: וּתְמֹגְגֵנִי
  choice: என்னைக் கரைந்துபோகச் செய்கிறீர்
  rationale: מוג என்பதன் ‘உருகுதல், கரைதல், தளர்ந்துபோதல்’ என்ற அடிப்படைப் பொருளை வைத்து, யோபு முற்றிலும் சிதைக்கப்படுகிற படிமத்தைப் பாதுகாக்கிறது.
- source_word: תשוה
  choice: புயலில்
  rationale: இறுதிச் சொல் உரைநிலையிலும் பொருளிலும் கடினமானது. காற்று சார்ந்த சூழலோடு பொருந்தும் புயல் அல்லது அழிவுக் கொந்தளிப்பு என்ற சாத்தியமான புரிதலை முதன்மை உரை ஏற்கிறது; உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
