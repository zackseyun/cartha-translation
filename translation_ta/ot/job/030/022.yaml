translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை. கடவுளை நேரடியாக அழைக்கும் மரியாதைப் பன்மை வினைவடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதையின் காற்று–சவாரி படிமமும், இறுதிச் சொல்லின் உண்மையான உரைநிலைத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
