base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: ta
  text: ஏனெனில், நான் நன்மையை எதிர்பார்த்தேன்; ஆனால் தீங்கு[a] வந்தது. வெளிச்சத்துக்காகக் காத்திருந்தேன்; ஆனால் காரிருள் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பேரிடர்” / “துன்பம்”; இங்குள்ள எபிரெயச் சொல் அறநெறிசார் தீமையைவிட நேர்ந்த கேடு அல்லது துயரைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சூழலில் யோபுவின் புலம்பலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது.
- source_word: טוֹב
  choice: நன்மை
  rationale: பெயர்ச்சொல் பொருளில் வரும் இச்சொல் நலமான அல்லது சாதகமான ஒன்றைக் குறிக்கிறது; எதிர்ச்சொல்லை மிகையாகக் குறிப்பாக்காமல் இயல்பாகத் தருகிறது.
- source_word: קִוִּיתִי
  choice: நான் நன்மையை எதிர்பார்த்தேன்
  rationale: நம்பிக்கையுடன் எதிர்நோக்கும் உணர்வை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹא
  choice: வந்தது
  rationale: இரு அரையடிகளிலும் திரும்ப வரும் வினையை அப்படியே பேணி, திடீர் தலைகீழ் மாற்றத்தை வலுப்படுத்துகிறது.
- source_word: רָע
  choice: தீங்கு
  rationale: இங்கு அறநெறிசார் தீமையைவிட துன்பம் அல்லது கேடு என்பதே சூழல்சார் பொருள்; ‘தீங்கு’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֲיַחֲלָה
  choice: காத்திருந்தேன்
  rationale: நம்பிக்கையோடு காத்திருக்கும் பொருளைப் பேணுவதுடன் முதல் வினையிலிருந்து தமிழில் இயல்பான வேறுபாட்டையும் வழங்குகிறது.
- source_word: לְאוֹר
  choice: வெளிச்சத்துக்காக
  rationale: எதிர்பார்ப்பின் பொருளைச் சுட்டும் முன்னொட்டையும், நேரடி மற்றும் உருவகப் பொருள் இரண்டையும் தாங்கும் ‘வெளிச்சம்’ என்ற படிமத்தையும் பேணுகிறது.
- source_word: אֹפֶל
  choice: காரிருள்
  rationale: சாதாரண இருளைவிட அடர்ந்த இருள் அல்லது இருண்மை என்ற வலிமையான பொருளைத் தருவதோடு வெளிச்சத்துடனான எதிர்மறை இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: רָע என்பதன் பொருள்
  choice: தீங்கு
  alternative: தீமை / பேரிடர்
  rationale: யோபுவின் துன்பச் சூழலில் இது அறநெறிசார் தீமையை அல்லாமல் நேர்ந்த கேடு அல்லது துயரத்தைக் குறிக்க வாய்ப்பு அதிகம்; எனினும் அடிப்படை எதிர்மறைப் பொருளை மிகையாக விளக்காமல் ‘தீங்கு’ பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வந்தது’ என்ற மீளுரையும் ‘வெளிச்சம்—காரிருள்’ என்ற கவித்துவ எதிர்மறையும் பேணப்பட்டுள்ளன.
