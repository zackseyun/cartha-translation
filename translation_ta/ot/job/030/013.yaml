source:
  edition: WLC
  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: ta
  text: அவர்கள் என் அழிவுக்காக என் பாதையைப் பிய்த்தழிக்கிறார்கள்; அதனால் அவர்கள் பயனடைகிறார்கள்; அவர்களுக்கு உதவுபவன் எவரும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவர்கள் அதை முன்னேற்றுகிறார்கள்” அல்லது “அதற்கு உதவுகிறார்கள்”; எபிரெய வினை பயனளித்தல், பயனடைதல், அல்லது ஒன்றை முன்னேற உதவுதல் எனப் பொருள்படலாம்; இங்கு அது யோபின் அழிவைக் குறிக்கலாம். இறுதித் தொடர் சுருக்கமானது: “யாருடைய உதவியும் இல்லாமல்” என்றும் பொருள் கொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: சிதைத்து
  rationale: இந்த வினை இடித்தல் அல்லது கிழித்துச் சீரழித்தல் என்ற வன்மையான பொருளைக் கொண்டது; பாதையைப் பாழாக்கும் உருவகத்திற்கு ‘சிதைத்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: נְתִיבָתִי
  choice: என் பாதையை
  rationale: נְתִיבָה என்பது பாதை அல்லது தடம்; ‘பாதை’ என்பது நேரடிப் படிமத்தையும் வாழ்க்கைப் போக்கைக் குறிக்கும் சாத்தியத்தையும் பாதுகாக்கிறது.
- source_word: לְהַוָּתִי
  choice: என் அழிவை
  rationale: הַוָּה அழிவு, கேடு, பேரிடர் ஆகிய பொருள்களைத் தருகிறது; இங்கு ‘என் அழிவு’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יֹעִילוּ
  choice: முன்னெடுக்கிறார்கள்
  rationale: יעל என்பதன் ஹிஃபில் வடிவம் ஒன்றுக்குப் பயனளித்தல் அல்லது அதை முன்னேற்றுதல் எனப் பொருள்படலாம்; முந்தைய தொடரில் உள்ள யோபின் அழிவையே மறைபொருள் செயப்படுபொருளாகக் கொண்டு ‘முன்னெடுக்கிறார்கள்’ என மொழிபெயர்ப்பது பகைமையான சூழலைத் தெளிவாக்குகிறது.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: அவர்களுக்கு உதவுபவன் எவனும் இல்லை
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான பெயரெச்ச அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; அவர்கள் உதவியின்றிச் செயல்படுகிறார்கள் என்ற மாற்றுப் புரிதலும் சாத்தியம்.
theological_decisions:
- issue: இறுதித் தொடரின் தொடர்பும் பொருளும்
  choice: ‘அவர்களுக்கு உதவுபவன் எவனும் இல்லை’ என்று முதன்மை உரையில் வைத்தல்
  alternative: ‘யாருடைய உதவியும் இல்லாமலேயே’ என்று அவர்களின் தனிச்செயலைக் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: לֹא עֹזֵר לָמוֹ என்பது சுருக்கமானதும் இருபொருள் கொள்ளத்தக்கதுமாக உள்ளது. முதன்மை உரை அதன் மேற்பரப்பு இலக்கணத்தைக் காக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளைப் பதிவு செய்கிறது. இது தனிப்பட்ட இறையியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. பாதை மற்றும் அழிவு என்ற எபிரெயப் படிமங்கள் காக்கப்பட்டுள்ளன; தெளிவிற்காக יֹעִילוּ வினையின் மறைபொருள் செயப்படுபொருளாக ‘என் அழிவு’ எடுத்துரைக்கப்பட்டுள்ளது. மூலத்தின் இருபொருள் வாய்ந்த இறுதித் தொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
