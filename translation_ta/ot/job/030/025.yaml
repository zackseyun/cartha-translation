  text: אִם לֹ֣א בָ֭כִיתִי לִ/קְשֵׁה י֑וֹם עָֽגְמָ֥ה נַ֝פְשִׁ֗/י לָ/אֶבְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: ta
  text: கடினமான நாளைச் சந்தித்தவனுக்காக நான் அழவில்லையா? ஏழைக்காக என் உள்ளம் துயரப்படவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துன்ப நாளில் இருந்தவனுக்காக” / “துன்பத்தில் இருந்தவனுக்காக.” எபிரெயத்தில் சுருக்கமாக, “கடினமான நாளையுடையவன்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: நான் ...வில்லையா?
  rationale: இங்கு இது சாதாரண நிபந்தனை அல்ல; யோபின் தற்காப்பை வலியுறுத்தும் எதிர்பார்ப்புள்ள வினாவாக உள்ளது.
- source_word: בָכִיתִי
  choice: அழவில்லையா
  rationale: அழுதல்/கண்ணீர் விடுதல் என்ற உணர்ச்சிச் செறிவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִקְשֵׁה יוֹם
  choice: கடினமான நாளைச் சந்தித்தவனுக்காக
  rationale: எபிரெய உரையின் ‘கடினமான நாள்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, துன்பகாலத்தை அனுபவிப்பவனைக் குறிக்கும் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: עָגְמָה
  choice: துயரப்படவில்லையா
  rationale: மனம் வருந்துதல் அல்லது வேதனைப்படுதல் என்ற பொருளை இணைவரியிலுள்ள அழுதலுடன் இயல்பாகப் பொருத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: யோபின் அகமனிதன் அல்லது முழு உள்ளார்ந்த சுயத்தைச் சுட்டுகிறது; தமிழில் ‘என் ஆத்துமா’ ஏற்படுத்தக்கூடிய தொழில்நுட்பக் கோட்பாட்டு அர்த்தத்தைத் தவிர்க்கிறது.
- source_word: לָאֶבְיוֹן
  choice: ஏழைக்காக
  rationale: வறிய அல்லது தேவையுள்ள நபரைக் குறிக்கும் பொதுமையான ஒருமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மனித இயல்பியல் பொருள்
  choice: ‘என் உள்ளம்’ என்று, யோபின் உள்ளார்ந்த சுயத்தைக் குறிக்கும் கவிதைமொழியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் ஆத்துமா’ அல்லது ‘நான்’
  rationale: மூலத்தின் உள்ளார்ந்த சுயக் குறிப்பைத் தக்கவைத்தும், உடலிலிருந்து பிரிந்த ஓர் அங்கத்தைப் பற்றிய குறிப்பிட்ட கோட்பாட்டை உரைக்குள் புகுத்தாமலும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் யோபின் தற்காப்பு வினாக்களின் இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘கடினமான நாள்’ என்ற எபிரெய உருவகம் இயன்றவரை தக்கவைக்கப்பட்டுள்ளது.
