base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: ta
  text: ஆனால் இப்போதோ, என்னைவிட வயதில் இளையவர்கள் என்னைப் பார்த்து ஏளனமாகச் சிரிக்கிறார்கள்; என் மந்தையின் நாய்களோடுகூட சேர்த்து வைப்பதற்குத் தகுதியற்றவர்களாக நான் கருதியவர்களே அவர்களுடைய தந்தையர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆடுகளைக் காக்கும் நாய்களோடுகூட சேர்த்து வைப்பதற்குத் தகுதியற்றவர்களாக நான் கருதியவர்களே அவர்களுடைய தந்தையர்.” எபிரேய மொழியில் நேரடியாக, “என் மந்தையின் நாய்களோடுகூட” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போதோ
  rationale: முந்தைய அதிகாரத்தில் யோபு பெற்றிருந்த மதிப்புக்கும் அவரது தற்போதைய இழிநிலைக்கும் இடையிலான கூர்மையான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂחֲקוּ עָלַי
  choice: என்னைப் பார்த்துச் சிரிக்கிறார்கள்
  rationale: வினைச்சொல்லின் நேரடியான ‘சிரி’ என்ற உருவகத்தைப் பாதுகாத்து, சூழலில் உள்ள ஏளனத்தையும் தமிழில் உணர்த்துகிறது.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: என்னைவிட வயதில் இளையவர்கள்
  rationale: ‘நாட்களில் என்னைவிட இளையவர்கள்’ என்ற எபிரேய வயது மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: நான் இகழ்ந்தேன்
  rationale: מָאַסְתִּי என்பது வெறும் மறுப்பை மட்டுமல்லாமல் மதிப்பற்றதாகக் கருதுதல் அல்லது இகழ்தல் என்ற வலுவான பொருளையும் கொண்டுள்ளது; இங்குள்ள கடுமையான சமூக அவமதிப்பை இது தக்கவைக்கிறது.
- source_word: אֲבוֹתָם
  choice: அவர்களுடைய தந்தையரை
  rationale: இப்போது யோபுவை ஏளனம் செய்யும் இளையவர்களின் தந்தையரையே குறிக்கும் இயல்பான நேரடிப் பொருள்.
- source_word: לָשִׁית עִם כַּלְבֵי צֹאנִי
  choice: என் மந்தையின் நாய்களோடுகூட வைக்க
  rationale: ‘என் மந்தையின் நாய்களுடன் வைக்க’ என்ற மூலத்தின் தெளிவான உருவகத்தையும் கடுமையான ஒப்பீட்டையும் பாதுகாக்கிறது.
