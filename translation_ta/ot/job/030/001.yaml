  register: நவீன நிலையான தமிழில், கவித்துவ மரியாதையையும் யோபுவின் கடுமையான ஏளனத் தொனியையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. எபிரேய மொழியின் வயதைக் குறிக்கும் மரபுத்தொடர் இயல்பான தமிழாக்கம் பெற்றுள்ளது; ‘மந்தையின் நாய்கள்’ என்ற திட்டமிட்ட கடுமையான படிமம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
