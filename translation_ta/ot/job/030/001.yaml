- from: ஆனால் இப்போதோ, என்னைவிட வயதில் இளையவர்கள் என்னைப் பார்த்துச் சிரிக்கிறார்கள்; அவர்களுடைய தந்தையரையோ என் மந்தையின் நாய்களோடுகூட வைக்க நான் இகழ்ந்தேன்.[a]
  to: ஆனால் இப்போதோ, என்னைவிட வயதில் இளையவர்கள் என்னைப் பார்த்து ஏளனமாகச் சிரிக்கிறார்கள்; என் மந்தையின் நாய்களோடுகூட சேர்த்து வைப்பதற்குத் தகுதியற்றவர்களாக நான் கருதியவர்களே அவர்களுடைய தந்தையர்.[a]
