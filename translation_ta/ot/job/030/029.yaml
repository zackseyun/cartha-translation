translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பைத் தக்கவைக்க ‘சகோதரன்—தோழன்’ என்ற சொல் இணை தேர்ந்தெடுக்கப்பட்டது; குறிப்புக் குறி உரையில் இடம்பெற்றுள்ளது.
