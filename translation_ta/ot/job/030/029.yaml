id: JOB.30.29
reference: Job 30:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָ֭ח הָיִ֣יתִי לְ/תַנִּ֑ים וְ֝/רֵ֗עַ לִ/בְנ֥וֹת יַעֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/029.yaml
  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: ta
  text: 'நான் குள்ளநரிகளுக்குச் சகோதரனாகவும்,

    நெருப்புக்கோழிகளுக்குத் தோழனாகவும் ஆகிவிட்டேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “நெருப்புக்கோழியின் மகள்களுக்குத் தோழன்”; இது நெருப்புக்கோழிகளைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: சகோதரன்
  rationale: எபிரெயச் சொல் நேரடியாக ‘சகோதரன்’ என்று பொருள்படும். பாழிடத்து விலங்குகளுடன் தனக்கு ஏற்பட்ட நெருங்கிய தொடர்பைச் சித்தரிக்கும் உருவகத்தை இது காக்கிறது.
- source_word: הָיִיתִי
  choice: ஆகிவிட்டேன்
  rationale: היה என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம். முன்பு ஏற்பட்ட மாற்றத்தின் விளைவாக இப்போது நீடிக்கும் நிலையை இயல்பான நவீன தமிழில் ‘ஆகிவிட்டேன்’ தெரிவிக்கிறது.
- source_word: לְתַנִּים
  choice: குள்ளநரிகளுக்கு
  rationale: பாழடைந்த இடங்களைப் பற்றிய எபிரெயக் கவிதைச் சூழல்களில் תַנִּים பொதுவாகக் குள்ளநரிகளைக் குறிக்கிறது; பழைய மரபிலுள்ள ‘வலுசர்ப்பங்கள்’ போன்ற பொருள் இங்கு பொருத்தமற்றது.
- source_word: וְרֵעַ
  choice: தோழன்
  rationale: רֵעַ என்பது தோழன், நண்பன் அல்லது உடனிருப்பவன் எனப் பொருள்படும். ‘சகோதரன்’ என்பதற்கு இணையான கவிதை நடையையும் நெருக்கமான தொடர்பையும் ‘தோழன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנוֹת יַעֲנָה
  choice: நெருப்புக்கோழிகளுக்கு
  rationale: இந்த எபிரெயத் தொடர் சொற்படியாக ‘நெருப்புக்கோழியின் மகள்கள்’ என இருந்தாலும், நெருப்புக்கோழிகளைச் சுட்டும் மொழிவழக்காகப் புரிந்துகொள்ளப்படுகிறது. முதன்மை உரையில் இயல்பான தமிழ்ப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
