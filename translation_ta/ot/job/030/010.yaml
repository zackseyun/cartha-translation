  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: ta
  text: அவர்கள் என்னை அருவருக்கிறார்கள்; என்னைவிட்டு விலகி நிற்கிறார்கள்; என் முகத்தின்முன் எச்சில் துப்புவதை அவர்கள் தவிர்ப்பதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “என் முகத்தின்முன் எச்சிலைத் தடுத்து வைத்துக்கொள்வதில்லை.” இது யோபை நேரடியாக நோக்கிச் செய்யப்படும் வெளிப்படையான அவமதிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: அவர்கள் என்னை அருவருக்கிறார்கள்
  rationale: תעב கடுமையான வெறுப்பையும் அருவருப்பையும் குறிக்கிறது; ‘அருவருக்கிறார்கள்’ அதன் தீவிரத்தையும் சமூக இழிவுணர்வையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: רָחֲקוּ מֶנִּי
  choice: என்னைவிட்டு விலகி நிற்கிறார்கள்
  rationale: רחק தொலைவில் இருப்பதையோ விலகியிருப்பதையோ குறிக்கிறது; இத்தொடர் உடல்ரீதியான தொலைவையும் சமூகப் புறக்கணிப்பையும் உள்ளடக்குகிறது.
- source_word: וּמִפָּנַי
  choice: என் முகத்தின்முன்
  rationale: מִפָּנַי என்பதன் நேரடிப் பொருள் ‘என் முகத்திலிருந்து/என் முகத்தின்முன்’ என்பதாகும். துப்புதல் இடம்பெறும் சூழலில் நேருக்கு நேர் செய்யப்படும் அவமதிப்பை இது காட்டுகிறது; ‘என் முகத்தில்’ என்று மிகத் திட்டவட்டமாக்காமல் எபிரெய வெளிப்பாட்டின் வடிவம் காக்கப்படுகிறது.
- source_word: לֹא חָשְׂכוּ
  choice: தயங்குவதில்லை
  rationale: חשׂך என்பது தடுத்து வைத்தல் அல்லது விலகியிருத்தலைக் குறிக்கிறது. இங்கு எந்தத் தடையுணர்வும் இன்றி இழிவான செயலில் ஈடுபடுவதை ‘தயங்குவதில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֹק
  choice: துப்புவதற்கும்
  rationale: רֹק என்பது எச்சில் அல்லது துப்புதலைக் குறிக்கும் பெயர்ச்சொல். தமிழ் வாக்கிய அமைப்பில் செயற்பெயராக்கிய ‘துப்புவதற்கும்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
