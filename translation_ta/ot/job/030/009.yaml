  - marker: a
    text: அல்லது, ‘அவர்களின் கேலிப்பாடல்’; ‘அவர்களின் பாடல்’ என்பது இச்சூழலில் இகழ்ச்சிப் பொருள் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பேச்சுப்பொருள்’ அல்லது ‘இகழ்ச்சிச் சொல்’; எபிரெயச் சொல் ஒருவரைக் குறித்துச் சொல்லப்படும் சொல் அல்லது சொல்லாடலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: முன்னைய நிலையோடு யோபின் தற்போதைய இழிநிலையை வேறுபடுத்திக் காட்டும் காலமாற்றத்தையும் எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְגִינָתָם
  choice: அவர்களுடைய பாடல்
  rationale: נְגִינָה என்பதன் அடிப்படைப் பொருளான ‘பாடல்’ என்பதைக் காக்கிறது; சூழலில் உள்ள கேலிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָיִיתִי
  choice: ஆகிவிட்டேன்
  rationale: எபிரெய நிறைவுவினை குறிக்கும் நிகழ்ந்த மாற்றத்தையும் அதன் தற்போதைய விளைவையும் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וָאֱהִי
  choice: இருக்கிறேன்
  rationale: முதல் கூறின் விளைவாகத் தொடரும் யோபின் தற்போதைய இழிநிலையை இயல்பான நிகழ்காலத் தமிழில் எடுத்துரைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: அவர்களுடைய பார்வையிலும் பேச்சிலும் யோபு பெற்றுள்ள நிலையைச் சுட்டும் எபிரெய தத்திவுத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לְמִלָּה
  choice: பழிச்சொல்
  rationale: מִלָּה அடிப்படையில் ‘சொல்/சொல்லாடல்’ என்றாலும், இச்சூழலில் ஒருவரைக் குறித்த இகழ்ச்சியான பேச்சைக் குறிக்கிறது. ‘பழிச்சொல்’ அதன் சொல் சார்ந்த வடிவத்தையும் அவமதிப்பு நுண்ணுணர்வையும் காக்கிறது.
