translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. மூலத்தின் ஆடை உருவகமும் வினைச்சொல்லிலுள்ள உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
