  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: ta
  text: மிகுந்த வலிமையால் என் ஆடை உருக்குலைக்கப்படுகிறது[a]; என் அங்கியின் கழுத்துத் திறப்பைப் போல, அது என்னை இறுக்கிச் சுற்றுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆடை மாற்றப்படுகிறது,” “என் ஆடை உருக்குலைகிறது”; ஒருவேளை, “அவர் என் ஆடையைப் பிடிக்கிறார்.” எபிரெய வினைச்சொல்லின் பொருள் கடினமானது. யோபுவின் துன்பம் ஆடையைப் போல அவரை உருக்குலைத்து அல்லது இறுக்குவதாக இவ்வரி பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “என் அங்கியின் வாய்/திறப்பைப் போல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: மிகுந்த வலிமையால்
  rationale: בְּ என்பதைக் கருவியைக் குறிக்கும் வகையில் கொண்டு, செயல் நிகழும் தீவிரத்தையும் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִתְחַפֵּשׂ
  choice: உருக்குலைக்கப்படுகிறது
  rationale: இந்த இடத்தில் ஹித்பயேல் வினையின் பொருள் கடினமும் விவாதத்திற்குரியதுமாகும். மாற்றப்படுதல் அல்லது அடையாளம் தெரியாதபடி சிதைக்கப்படுதல் என்ற சாத்தியத்தை ‘உருக்குலைக்கப்படுகிறது’ இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְבוּשִׁי
  choice: என் ஆடை
  rationale: பொதுவான உடையைக் குறிக்கும் ஒருமையைப் பாதுகாத்து, அடுத்துள்ள ‘அங்கி’ என்பதுடன் கவித்துவ இணையைத் தக்கவைக்கிறது.
- source_word: כְּפִי
  choice: கழுத்துத் திறப்பைப் போல
  rationale: சொற்படியாக ‘வாய்/திறப்பு போல’ எனினும், ஆடைச் சூழலில் அங்கியின் கழுத்துத் திறப்பைக் குறிக்கிறது. ‘கழுத்துத் திறப்பு’ என்பது ‘காலர்’ என்பதைவிட மூல உருவகத்துக்கு நெருக்கமான தெளிவான தமிழ்.
- source_word: כֻתָּנְתִּי
  choice: என் அங்கி
  rationale: כֻּתֹּנֶת என்பது உடலில் அணியும் நீளமான அங்கி அல்லது உள்ளாடை வகையைச் சுட்டுகிறது; ‘அங்கி’ மரியாதையானதும் சூழலுக்கு ஏற்றதுமான பொதுத் தமிழ்.
- source_word: יַאַזְרֵנִי
  choice: அது என்னை இறுகச் சுற்றிக்கொள்கிறது
  rationale: אזר என்பதன் ‘சுற்றிக் கட்டுதல்/இறுக்குதல்’ என்ற பொருளை, ஆடை உடலை நெருக்கும் உருவகத்துடன் இயல்பாக வெளிப்படுத்துகிறது.
