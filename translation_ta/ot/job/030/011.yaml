revisions:
- from: ஏனெனில், அவர் தமது நாணைத் தளர்த்தி என்னைத் துன்புறுத்தியதால்,[a] அவர்கள் என் முன்னிலையில் கடிவாளத்தை அவிழ்த்துவிட்டார்கள்.[b]
  to: ஏனெனில், அவர் தமது நாணைத் தளர்த்தி என்னைத் துன்புறுத்தினார்; அவர்கள் என் முன்னிலையில் கடிவாளத்தை அவிழ்த்துவிட்டார்கள்.[a][b]
  rationale: The revision removes the unidiomatic duplicate causal marking, retains the Hebrew’s unnamed singular subject and the plural shift, and keeps both lexical images and their anchored explanatory notes. Footnote b is narrowed to avoid adding ‘all’ to the source’s metaphor.
