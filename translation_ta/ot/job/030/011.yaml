  text: כִּֽי יתר/ו פִ֭תַּח וַ/יְעַנֵּ֑/נִי וְ֝/רֶ֗סֶן מִ/פָּנַ֥/י שִׁלֵּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: ta
  text: ஏனெனில், அவர் தமது நாணைத் தளர்த்தி என்னைத் துன்புறுத்தினார்; அவர்கள் என் முன்னிலையில் கடிவாளத்தை அவிழ்த்துவிட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமது வில்நாணைத் தளர்த்தி என்னைத் துன்புறுத்தினார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவான நாணைக் காட்டிலும் குறிப்பாக வில்நாணைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவர்கள் என் முன்னிலையில் கடிவாளத்தை அவிழ்த்துவிட்டார்கள்’; அதாவது, என் முன்னிலையில் கட்டுப்பாட்டைக் கைவிட்டார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கூறப்பட்ட ஏளனத்திற்கும் பகைமைக்கும் காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: יִתְרוֹ
  choice: தமது நாணை
  rationale: எபிரெயச் சொல்லுக்கு பொதுவான கயிறு/நாண் என்றும் குறிப்பாக வில்நாண் என்றும் பொருள் இருக்கலாம். தமிழ் முதன்மை உரையில் இயல்பாகவும் உருவகத்தின் தெளிவின்மையை ஓரளவு காக்கவும் ‘நாண்’ பயன்படுத்தப்பட்டது; ‘வில்நாண்’ அடிக்குறிப்பில் தரப்பட்டது.
- source_word: פִּתַּח
  choice: தளர்த்தி
  rationale: நாணுடன் சேரும்போது ‘திறத்தல்’ என்பதைவிட ‘தளர்த்துதல்’ அல்லது ‘அவிழ்த்தல்’ என்ற பொருள் இயல்பானது.
- source_word: וַיְעַנֵּנִי
  choice: என்னைத் துன்புறுத்தியதால்
  rationale: இது ‘பதில் அளித்தல்’ என்ற ענה I அல்ல; ‘துன்புறுத்துதல்/தாழ்த்துதல்’ என்ற ענה II. யோபின் துயரமும் அவமானமும் நிறைந்த சூழலுக்கு ‘துன்புறுத்துதல்’ பொருந்துகிறது.
- source_word: וְרֶסֶן
  choice: கடிவாளத்தை
  rationale: சொல்லின் நேரடிப் பொருளான ‘கடிவாளம்’ பாதுகாக்கப்பட்டது. கட்டுப்பாட்டைக் கைவிடுதல் என்னும் மரபுத்தொடரின் கருத்து வினையுடன் இயல்பாக வெளிப்படுகிறது.
- source_word: מִפָּנַי
  choice: என் முன்னிலையில்
  rationale: யோபின் கண்முன்னே, அவரைப் பொருட்படுத்தாமல் நடந்துகொள்வதைக் குறிக்கும் இடப்பொருள் இயல்பான நவீன தமிழில் வழங்கப்பட்டது.
- source_word: שִׁלֵּחוּ
  choice: அவிழ்த்துவிட்டார்கள்
  rationale: கடிவாளத்துடன் வரும் இந்த வினை அதை விட்டுவிடுதல் அல்லது கட்டுப்பாட்டை நீக்குதல் என்னும் பொருளைத் தருகிறது. ‘அவிழ்த்துவிட்டார்கள்’ நேரடி உருவகத்தையும் கட்டுப்பாடின்மையையும் இணைக்கிறது.
theological_decisions:
- issue: முதல் ஒருமை எழுவாயான ‘அவர்’ யாரைக் குறிக்கிறது
  choice: மரியாதைப் பன்மை வடிவமான ‘அவர்/தமது’ பயன்படுத்தி, பெயரைச் சேர்க்கவில்லை
  alternative: ‘கடவுள் தமது நாணை...’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய மூலத்தில் எழுவாய் பெயரால் குறிப்பிடப்படவில்லை. சூழலில் கடவுளைக் குறிக்க வாய்ப்பிருந்தாலும், மூலத்தின் மறைமுகத்தன்மையைச் சேர்க்கை விளக்கமின்றி பாதுகாப்பது சிறந்தது.
translation_notes:
  register: நவீன நிலையான தமிழில், இலக்கிய மரியாதையுடனும் பொதுவாசகருக்குப் புரியும் வகையிலும் மொழிபெயர்க்கப்பட்டது. முதல் பாதியில் உள்ள நாண்/வில்நாண் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. இரண்டாம் பாதியில் எபிரெய உருவகமான ‘கடிவாளம்’ முதன்மை உரையிலேயே வைக்கப்பட்டு, அதன் கருத்து அடிக்குறிப்பில் விளக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
