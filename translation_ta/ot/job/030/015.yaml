  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: ta
  text: 'திகில்கள் என்மீது திருப்பப்பட்டுள்ளன;

    அவை காற்றைப்போல் என் மேன்மையைத்[a] துரத்துகின்றன;

    மேகத்தைப்போல் என் மீட்பு[b] கடந்துபோகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மாண்பை,” “என் உயர்நிலையை,” அல்லது “என் செழிப்பை.” எபிரெயச் சொல் உயர்ந்த அல்லது மதிப்புக்குரிய நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் விடுதலை” அல்லது “என் நல்வாழ்வு.” எபிரெயச் சொல் மீட்புடன் நல்வாழ்வையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: என்மீது திருப்பப்பட்டுள்ளன
  rationale: הפך என்பதன் ஹொஃபால் வடிவிலுள்ள செயல்படுபொருள் சார்ந்த, விளைவுநிலைப் பொருளைத் தக்கவைக்கிறது. பின்வரும் பன்மைப் பொருளான ‘திகில்கள்’ என்பதற்கு ஏற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּלָּהוֹת
  choice: திகில்கள்
  rationale: திடீர் அச்சங்களையும் பயங்கர அனுபவங்களையும் குறிக்கும் சொல்லின் தீவிரத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: תִּרְדֹּף
  choice: அவை … துரத்துகின்றன
  rationale: רדף என்பதன் ‘துரத்து, பின்தொடர்ந்து விரட்டு’ என்ற அடிப்படைப் பொருளைக் காக்கிறது. எபிரெய வினை ஒருமையில் இருந்தாலும், முன்னுள்ள பன்மைப் பெயர்ச்சொல் கூட்டாகக் கருதப்படலாம்; தமிழில் அதன் குறிப்பைத் தெளிவாக்க பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּרוּחַ
