- source_word: יְשֻׁעָתִי
  choice: என் மீட்பு
  rationale: ישועה என்பதன் மீட்பு அல்லது விடுவிப்பு என்ற அடிப்படைப் பொருளை அளிக்கிறது; இதை பிற்கால கோட்பாட்டுச் சிறப்புப்பொருளுக்கு மட்டும் கட்டுப்படுத்தாமல், ‘நல்வாழ்வு’ என்ற சூழல்சார் வாய்ப்பையும் அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: יְשֻׁעָתִי என்பதைக் கோட்பாட்டுச் ‘இரட்சிப்பு’ என்ற பொருளுக்கு மட்டும் வரையறுக்கும் அபாயம்
  choice: என் மீட்பு
  alternative: என் விடுதலை; என் நல்வாழ்வு
  rationale: இச்சூழலில் இச்சொல் ஆபத்திலிருந்து மீட்பு அல்லது நலமான நிலை ஆகியவற்றைக் குறிக்கலாம். ‘மீட்பு’ மூலச்சொல்லின் வலிமையைத் தக்கவைக்கிறது; அடிக்குறிப்பு பரந்த பொருள் எல்லையை வெளிப்படுத்துகிறது.
- issue: נְדִבָתִי என்பதன் தெளிவற்ற பொருள்
  choice: என் மேன்மையை
  alternative: என் மாண்பை; என் உயர்நிலையை; என் செழிப்பை
  rationale: யோபு இழந்த மதிப்புக்குரிய அல்லது உயர்ந்த நிலையைக் குறிக்க ‘மேன்மை’ இயல்பான தமிழ். இருப்பினும், எபிரெயச் சொல்லின் பொருள் நிச்சயமற்றதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரிகளின் இணை அமைப்பும் காற்று–மேகம் உவமைகளும் காக்கப்பட்டுள்ளன; அரிய சொற்களின் பொருள் நிச்சயமின்மை அடிக்குறிப்புகளில் வெளிப்படுத்தப்பட்டுள்ளது.
