  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: ta
  text: அவன் தூசியைப் போல் வெள்ளியைக் குவித்தும், களிமண்ணைப் போல் ஆடைகளை ஆயத்தப்படுத்தினாலும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: ஆயத்தப்படுத்தினாலும்
  rationale: אִם என்பதன் நிபந்தனைப் பொருள் தமிழில் வினையுடன் இணைக்கப்பட்டுள்ளது; அடுத்த வசனத்தின் கருத்தோட்டத்துக்கு ஏற்றவாறு இங்கு விட்டுக்கொடுப்பு பொருளில் ‘-ஆலும்’ பயன்படுத்தப்பட்டது. ‘ஆயத்தப்படுத்தினால்’ என்பதும் சாத்தியம்.
- source_word: יִצְבֹּר
  choice: குவித்து
  rationale: צבר என்பது சேர்த்துக் குவித்தல் அல்லது குவியலாக்குதல்; தூசி என்ற உருவகத்தோடு ‘குவித்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: כֶּעָפָר
  choice: தூசியைப் போல
  rationale: כְּ ஒப்புமையையும் עָפָר தூசியையும் குறிக்கின்றன; அளவற்ற மிகுதியை உணர்த்தும் கவித்துவப் படிமம் காக்கப்படுகிறது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: כֶּסֶף நேரடியாக வெள்ளியைக் குறிக்கிறது; ‘பணம்’ என்பதைக் காட்டிலும் மூலமொழியின் கண்கூடான கவித்துவப் படிமத்தை இது காக்கிறது.
- source_word: וְכַחֹמֶר
  choice: களிமண்ணைப் போல
  rationale: חֹמֶר இங்கு களிமண் அல்லது சேற்றைக் குறிக்கலாம்; ஏராளமாகவும் சாதாரணமாகவும் கிடைப்பதைக் காட்டும் ஒப்புமைக்கு ‘களிமண்’ பொருத்தமானது.
- source_word: יָכִין
  choice: ஆயத்தப்படுத்தினாலும்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தம் செய்தல் என்ற பொருளைத் தருகிறது; தமிழில் விட்டுக்கொடுப்பு உட்பொருளையும் தாங்கும் வகையில் வினை வடிவமைக்கப்பட்டது.
- source_word: מַלְבּוּשׁ
  choice: ஆடைகளை
  rationale: מַלְבּוּשׁ உடை அல்லது ஆடைகளைக் குறிக்கும்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கப் பன்மை வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: אִם என்பதன் நிபந்தனை அல்லது விட்டுக்கொடுப்பு வாசிப்பு
  choice: 'விட்டுக்கொடுப்பு: ‘ஆயத்தப்படுத்தினாலும்’'
  alternative: 'நிபந்தனை: ‘ஆயத்தப்படுத்தினால்’'
  rationale: அடுத்த வசனத்தில் அந்தச் செல்வத்தின் நிலையின்மை வெளிப்படுவதால், ‘அவன் இவ்வளவு சேர்த்தாலும்’ என்ற விட்டுக்கொடுப்பு வாசிப்பு சூழலுக்கு நன்றாகப் பொருந்துகிறது; எனினும் எபிரெயச் சொல்லின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கவிதைநடை. ‘வெள்ளி,’ ‘தூசி,’ ‘களிமண்’ ஆகிய மூலப் படிமங்கள் காக்கப்பட்டுள்ளன; வசனம் அடுத்த வசனத்துடன் தொடர்வதை இறுதியிலுள்ள காற்புள்ளி உணர்த்துகிறது.
