  text: וְ/יַשְׁלֵ֣ךְ עָ֭לָי/ו וְ/לֹ֣א יַחְמֹ֑ל מִ֝/יָּד֗/וֹ בָּר֥וֹחַ יִבְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: ta
  text: அவர் அவன்மேல் எறிவார்[a]; இரக்கம் காட்டமாட்டார். அவன் அவருடைய கையிலிருந்து நிச்சயமாகத் தப்பியோடுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எறிவார்’ என்பது எபிரெய வினையின் நேரடியான பொருள்; எது எறியப்படுகிறது என்று கூறப்படவில்லை. ‘அவன்மீது வீசுவார்’ என்றும் மொழிபெயர்க்கலாம்; சூழலில் இது வன்முறைத் தாக்குதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தப்பியோடித் தப்பியோடுவான்’ என்ற வலியுறுத்தும் அமைப்பு உள்ளது; இது ‘நிச்சயமாகத் தப்பியோடுவான்’ அல்லது ‘அவசரமாகத் தப்பியோடுவான்’ என்ற நுணுக்கத்தைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: அவர் அவன்மேல் எறிவார்
  rationale: שׁלך என்பதன் அடிப்படைப் பொருளான ‘எறிதல்/வீசுதல்’ என்பதையும், עַל குறிக்கும் எதிர்நோக்கிய இயக்கத்தையும் காக்கிறது. எறியப்படும் பொருள் எபிரெயத்தில் கூறப்படாததால் தமிழிலும் அதைச் சேர்க்கவில்லை; தாக்குதலின் வன்முறைச் சாயல் சூழலால் வெளிப்படுகிறது.
- source_word: וְלֹא יַחְמֹל
  choice: இரக்கம் காட்டமாட்டார்
  rationale: חמל என்பது ‘இரங்குதல்’ என்றும் ‘விட்டுவைத்தல்/தப்பவிடுதல்’ என்றும் பொருள்படலாம். இயல்பான நவீன தமிழில் கருணையின்மையைத் தெளிவாகக் கூறும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִיָדוֹ
  choice: அவருடைய கையிலிருந்து
  rationale: יָד என்பதன் நேரடிப் படிமமான ‘கை’ காக்கப்படுகிறது; அதிகாரம் அல்லது பிடி என்ற விரிவான பொருளும் இச்சொற்றொடரில் இயல்பாக உணரப்படுகிறது.
- source_word: בָּרוֹחַ יִבְרָח
  choice: தப்பியோடவே தப்பியோடுவான்
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலை, தமிழில் நோக்கமுள்ள மீளுரையால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முதல் வினையின் எழுவாய் மற்றும் இறுதி வினையின் எழுவாய்
  choice: தாக்குபவருக்கு மரியாதை ஒருமையான ‘அவர்’; தப்பியோடுபவனுக்கு ‘அவன்’
  alternative: இரு வினைகளுக்கும் ‘அவன்’ பயன்படுத்துதல் அல்லது முதல் எழுவாயை வெளிப்படையாக ‘தேவன்’ என்று பெயரிடுதல்
  rationale: எபிரெயம் இரு இடங்களிலும் மூன்றாம் நபர் ஆண்பால் ஒருமையைப் பயன்படுத்தினாலும், சூழலில் தாக்குபவரும் தாக்கப்படுபவரும் வேறுபடுகின்றனர். ‘தேவன்’ என்ற பெயர் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், தமிழின் சுட்டுப்பெயர் வேறுபாட்டால் உறவைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தீவிரத்தையும் ‘கை’ என்ற மூலப் படிமத்தையும் காக்கும் கண்ணியமான நடை. எபிரெயத்தில் விடப்பட்டுள்ள எறியப்படும் பொருளை நிரப்பாமல் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
