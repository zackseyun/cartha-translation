- from: '“இது கடவுளிடம்[a] பொல்லாத மனிதனுக்குரிய பங்கு; வல்லமையுள்ளவரிடமிருந்து கொடியவர்கள் பெற்றுக்கொள்ளும்[b] உரிமைப்பங்கு இதுவே:'
  to: '“இது பொல்லாத மனிதனுக்குக் கடவுளிடமிருந்து[a] வரும் பங்கு; இரக்கமற்றவர்கள்[b] எல்லாம் வல்லவரிடமிருந்து பெறுவார்கள்[c] சுதந்தரம்:'
  rationale: The contextual idiomatic force of עִם אֵל is rendered naturally as “கடவுளிடமிருந்து,” while the literal wording and resulting interpretive ambiguity are disclosed in the footnote. The parallel clauses, singular ‘wicked man,’ plural ‘ruthless,’ and the verse’s trailing colon are retained. Terminology is adjusted for standard modern Tamil and the footnote anchors now cover all pertinent audit-trail alternatives.
