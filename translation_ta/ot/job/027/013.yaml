source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֖ם רָשָׁ֥ע עִם אֵ֑ל וְֽ/נַחֲלַ֥ת עָ֝רִיצִ֗ים מִ/שַּׁדַּ֥י יִקָּֽחוּ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: ta
  text: '“இது பொல்லாத மனிதனுக்குக் கடவுளிடமிருந்து[a] வரும் பங்கு; இரக்கமற்றவர்கள்[b] எல்லாம் வல்லவரிடமிருந்து பெறுவார்கள்[c] சுதந்தரம்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக “கடவுளோடு” என்று உள்ளது; இங்கு அது பொல்லாத மனிதனுக்குக் கடவுள் ஒதுக்கும் பங்கு, அதாவது “கடவுளிடமிருந்து” வரும் பங்கு, என்ற பொருளில் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வன்முறையாளர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “எடுத்துக்கொள்வார்கள்”; பங்கு அல்லது சுதந்தரம் கிடைப்பதைக் குறிக்கும் இச்சூழலில் “பெறுவார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: இது
  rationale: அடுத்து கூறப்படும் முடிவைச் சுட்டிக்காட்டும் தொடக்கச் சுட்டுப்பெயர்.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: ஒருவருக்கு ஒதுக்கப்பட்ட பங்கு அல்லது முடிவு என்ற ஞான இலக்கியப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָדָם רָשָׁע
  choice: பொல்லாத மனிதன்
  rationale: ஒருமை வடிவையும் ஒழுக்கரீதியான தீமையையும் துல்லியமாகக் காக்கிறது.
- source_word: עִם אֵל
  choice: கடவுளிடம்
  rationale: עִם என்பதன் அடிப்படை உறவுப்பொருளைத் தக்கவைத்து, ஒருவருக்காகக் கடவுளிடம் இருக்கும் பங்கு என்ற தமிழ்ச் சொல்லாக்கத்தை வழங்குகிறது; ‘கடவுளிடமிருந்து’ என்ற மூலப்பொருள் சூழலில் சாத்தியம்.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: ஒதுக்கப்பட்டு ஒருவருக்குச் சேரும் பங்கை உணர்த்தி, முந்தைய חֵלֶק என்பதிலிருந்து சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: עָרִיצִים
  choice: கொடியவர்கள்
  rationale: வன்முறையாலும் ஒடுக்குதலாலும் அச்சுறுத்தும் இரக்கமற்றவர்களைக் குறிக்கும் சொல்லின் பரப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִשַּׁדַּי
  choice: வல்லமையுள்ளவர்
  rationale: שַׁדַּי என்ற தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் பொருள்பட மொழிபெயர்க்கிறது.
- source_word: יִקָּחוּ
  choice: பெற்றுக்கொள்ளும்
  rationale: அடிப்படையில் ‘எடுத்துக்கொள்வார்கள்’ எனினும், பங்கும் உரிமைப்பங்கும் ஒதுக்கப்படுகின்ற சூழலில் ‘பெற்றுக்கொள்ளும்’ என்பது இயல்பானது; மூல வினையின் செயற்பாட்டுத் தன்மையையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: עִם אֵל என்ற தொடரின் உறவு/மூலப்பொருள்
  choice: கடவுளிடம்
  alternative: கடவுளிடமிருந்து
  rationale: எபிரெயச் சொல்லின் நேரடி உறவுப்பொருளை முதன்மை உரையில் காக்கிறது; கடவுள் ஒதுக்கும் பங்கு என்ற பொருளில் ‘கடவுளிடமிருந்து’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: שַׁדַּי என்ற தெய்வீகப் பட்டம்
  choice: வல்லமையுள்ளவர்
  alternative: ஷத்தாய்
  rationale: இது தனிப்பெயராக மட்டுமல்லாது தெய்வீகப் பட்டமாகச் செயல்படுவதால், நவீன தமிழில் அதன் பொருளை மொழிபெயர்ப்பது வாசகருக்குத் தெளிவாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்துக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இணைவரிசை அமைப்பும் இறுதியில் தொடரைக் காட்டும் முக்காற்புள்ளியும் காக்கப்பட்டுள்ளன.
