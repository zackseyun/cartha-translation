base_translation:
  language: en
  yaml_path: translation/ot/job/027/001.yaml
  text: And Job again took up his discourse and said:[a]
translation:
  language: ta
  text: யோபு மீண்டும் தமது உரையை எடுத்துக்கொண்டு சொன்னார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது பழமொழியை,” “தமது உவமையை,” அல்லது “தமது வாக்கை”; இதற்குரிய எபிரெயச் சொல் செறிவான அல்லது உருவகமான பலவகைக் கூற்றுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: மீண்டும்
  rationale: יסף என்பதற்கு அடிப்படையில் ‘சேர்த்தல்’ அல்லது ‘தொடர்தல்’ என்று பொருள். இங்கு தொடர்ந்து வரும் שׂאת משׁל என்ற சொற்றொடருடன் இணைந்து, யோபு மறுபடியும் உரையாற்றத் தொடங்கியதை ‘மீண்டும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׂאֵת
  choice: எடுத்துரைத்து
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்.’ שׂאת משׁל என்ற மரபுத்தொடரில் முறையான, செறிவான உரையை எடுத்துச் சொல்லுதல் என்பது பொருள்; ‘எடுத்துரைத்து’ அந்த உருவகத்தின் சுவட்டையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מְשָׁלוֹ
  choice: தமது உரையை
  rationale: מָשָׁל என்பது பழமொழி, உவமை, கேலிப்பாடல், தீர்க்கவாக்கு அல்லது விரிவான செறிவான உரை ஆகிய பல பொருள்களைக் கொள்ளக்கூடியது. இங்கு தொடரும் நீண்ட கவிதை உரைக்கு ‘உரை’ பொருத்தமானது; எபிரெயச் சொல்லின் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: אמר என்ற வழக்கமான கதைநடை வினைச்சொல்லை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது யோபுவைக் குறிக்கும் மரியாதை ஒருமையைத் தெளிவாகக் காட்டுகிறது; ‘எடுத்துரைத்துச் சொன்னார்’ என்பது மூலத்தின் ‘மீண்டும்/தொடர்ந்து—எடுத்தல்—சொல்லுதல்’ என்ற அமைப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
