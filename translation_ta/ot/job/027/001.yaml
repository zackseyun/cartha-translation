revisions:
- from: யோபு மீண்டும் தமது உரையை எடுத்துரைத்துச் சொன்னார்:[a]
  to: யோபு மீண்டும் தமது உரையை எடுத்துக்கொண்டு சொன்னார்:[a]
  rationale: The revision removes a minor Tamil redundancy while preserving the source’s resumed formal speech formula. The footnote continues to document the lexical breadth of מָשָׁל but avoids making the ‘oracle’ alternative specifically prophetic.
