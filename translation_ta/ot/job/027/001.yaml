    text: அல்லது, “தமது பழமொழியை,” “தமது உவமையை,” அல்லது “தமது வாக்கை”; இதற்குரிய எபிரெயச் சொல் செறிவான அல்லது உருவகமான பலவகைக் கூற்றுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  revision_rationale: The revision removes a minor Tamil redundancy while preserving the source’s resumed formal speech formula. The footnote continues to document the lexical breadth of מָשָׁל but avoids making the ‘oracle’ alternative specifically prophetic.
