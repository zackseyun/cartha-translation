source:
  edition: WLC
  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: ta
  text: என் நீதியை நான் உறுதியாகப் பற்றிக்கொண்டிருக்கிறேன்; அதை விட்டுவிட மாட்டேன்.[a] என் வாழ்நாளில் ஒருநாளும் என் உள்ளம் என்னைக் கடிந்துகொள்வதில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் நேர்மையை.’ எபிரெயச் சொல் பொதுவாக ‘நீதி’ என்று பொருள்படும்; ஆனால் யோபு நூலில் அது ஒருவரின் தனிப்பட்ட நேர்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் உள்ளம் என் வாழ்நாளெல்லாம் என்னைப் பழிப்பதில்லை.’ எபிரெயத் தொடர் உள்ளார்ந்த சுயக்குற்றச்சாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: என் நீதியை
  rationale: צִדְקָה என்பதன் முதன்மையான அறநெறி மற்றும் நீதிசார் பொருளை ‘நீதி’ காக்கிறது. யோபுவின் சூழலில் இது தனிப்பட்ட நேர்மையையும் உட்படுத்தலாம்.
- source_word: הֶחֱזַקְתִּי
  choice: நான் உறுதியாகப் பற்றிக்கொண்டிருக்கிறேன்
  rationale: חזק என்பதன் Hiphil வடிவம் ஒன்றைத் திடமாகப் பற்றியிருப்பதைக் குறிக்கிறது. எபிரெய நிறைவேற்றுவினையின் தொடரும் விளைவும் யோபுவின் தற்போதைய உறுதியும் இந்தத் தமிழாக்கத்தில் வெளிப்படுகின்றன.
- source_word: וְלֹא אַרְפֶּהָ
  choice: அதை விட்டுவிட மாட்டேன்
  rationale: רפה என்பதன் Hiphil வடிவம் பிடியைத் தளர்த்துதல் அல்லது விடுவித்தல் எனப் பொருள்படும்; பெண்பால் ஒருமை பின்னொட்டு முன் வரும் ‘என் நீதி’யைக் குறிக்கிறது.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: என் உள்ளம் என்னைக் கடிந்துகொள்வதில்லை
  rationale: חרף என்பது பழித்தல், நிந்தித்தல் அல்லது கடிந்துகொள்ளுதல் எனப் பொருள்படும். ‘உள்ளம்’ என்பதைக் கர்த்தாவாக வைத்திருப்பது எபிரெய உருவகத்தைக் காத்து, உள்ளார்ந்த சுயக்குற்றச்சாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִיָּמָי
  choice: என் வாழ்நாளின் எந்த நாளைக் குறித்தும்
  rationale: மறுப்புடன் வரும் מן + ימים தொடரை வாழ்வின் எந்தக் காலப்பகுதியிலும் அல்லது எந்த நாளைக் குறித்தும் என்று புரிந்துகொள்ளலாம். இங்கு மறுப்பின் பரப்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: צִדְקָה என்பதை வலுவான அறநெறிப் பொருளில் ‘நீதி’ என்று மொழிபெயர்ப்பதா, அல்லது சூழல்சார் பொருளில் ‘நேர்மை’ என்று மொழிபெயர்ப்பதா?
  choice: நீதி
  alternative: நேர்மை
  rationale: எபிரெயச் சொல் பொதுவாக நீதி அல்லது சரியான நிலை என்பதைக் குறிக்கிறது. யோபுவின் குற்றமற்ற தன்மையை வலியுறுத்தும் சூழலில் ‘நேர்மை’ சாத்தியமானாலும், ‘நீதி’ மூலச்சொல்லின் அறநெறி மற்றும் நீதிசார் வலிமையைச் சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் உள்ளம்’ என்பது எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘என் மனசாட்சி’ என்பது விளக்கமளிக்கும் மொழியாக இருப்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
