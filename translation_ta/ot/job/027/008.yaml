  source_fidelity: முதன்மை மொழிபெயர்ப்பு יִבְצָע என்பதன் வழக்கமான ‘ஆதாயம் அடைதல்’ பொருளையும், נַפְשׁוֹ என்பதன் இச்சூழலுக்குரிய ‘உயிர்’ பொருளையும் சரியாகக் காக்கிறது. ஆனால் தற்போதைய நீண்ட கோடும் வாக்கிய வரிசையும் சலுகைப் பொருளான ‘அவன் ஆதாயம் அடைந்திருந்தாலும்’ என்பதை ‘கடவுள் உயிரை எடுத்துக்கொள்ளும்போது’ என்ற காலக்கூற்றுடன் இயல்பில்லாமல் இணைக்கின்றன. வாக்கியத்தை மறுவரிசைப்படுத்துவது எபிரெய வினாவின் பொருளைத் தெளிவாகக் காட்டும்.
  naturalness: ‘இறைப்பற்றில்லாதவன்’ நவீன தரத் தமிழில் புரியத்தக்க, கண்ணியமான சொல்லாட்சி. ஆனால் தற்போதைய கேள்விவடிவம் நிறுத்தக்குறி மற்றும் தொடரமைப்பு காரணமாக சற்றுத் தடுமாறுகிறது. ‘கடவுள் ... எடுத்துக்கொள்ளும்போது’ என்ற காலநிலையை முன்வைத்து, பின்னர் சலுகைக் கூற்றையும் முதன்மைக் கேள்வியையும் அமைத்தால் இயல்பாகும்.
  terminology: ‘கடவுள்’, ‘உயிர்’, ‘நம்பிக்கை’ ஆகியவை பொருத்தமானவை. חָנֵף என்பதன் பரந்த சமய-ஒழுக்கப் பொருளுக்கு ‘இறைப்பற்றில்லாதவன்’ ஏற்றது. அடிக்குறிப்பில் உள்ள ‘அறுத்துப்போடும்போது’ என்பது இந்நபர்-அழிவு வாசிப்புக்கு வழக்கமான தமிழல்ல; ‘அவனை அழித்துவிடும்போது’ என மாற்றுதல் தெளிவானது. இவ்வாசிப்பு விவாதத்திற்குரியது என்பதும் காக்கப்படுகிறது.
