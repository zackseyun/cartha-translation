  edition: WLC
  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: ta
  text: கடவுள் அவனுடைய உயிரை எடுத்துக்கொள்ளும்போது, அவன் ஆதாயம் அடைந்திருந்தாலும், இறைப்பற்றில்லாதவனுக்கு என்ன நம்பிக்கை இருக்கிறது?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் ஆதாயம் அடையும்போது.’ இக்கூற்று எபிரெயத்தில் கடினமானது; ‘கடவுள் அவனை அழித்துவிடும்போது’ என்றும் சிலர் பொருள் கொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘கடவுள் அவனுடைய உயிரை இழுத்தெடுக்கும்போது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: நம்பிக்கை
  rationale: எதிர்காலத்தைப் பற்றிய நம்பிக்கையையோ எதிர்பார்ப்பையையோ குறிக்கிறது; இங்கே வரும் வினாவுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: חָנֵף
  choice: இறைப்பற்றில்லாதவன்
  rationale: யோபு நூலில் இச்சொல் வெறும் வெளிவேடக்காரனை மட்டும் அல்லாமல், கடவுளை மதியாத அல்லது நெறிகெட்ட மனிதனையும் குறிக்கலாம். பரந்த சமய-ஒழுக்கப் பொருளை இத்தேர்வு தருகிறது.
- source_word: יִבְצָע
  choice: அவன் ஆதாயம் அடைந்திருந்தாலும்
  rationale: בצע என்ற வேரின் வழக்கமான ‘ஆதாயம் அடைதல்’ என்ற பொருளை முன்னிறுத்துகிறது. இக்கூற்றின் தொடரியல் கடினமானதால், ‘அவன் ஆதாயம் அடையும்போது’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֵשֶׁל
  choice: எடுத்துக்கொள்ளும்போது
  rationale: ஒருவருடைய உயிரை இழுத்தெடுத்தல் அல்லது அகற்றுதல் என்ற சூழல்சார் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் கடவுளைக் குறிக்கும் கவிதைநடை ஒருமைச் சொல்; தமிழில் நேரான பொதுவழக்கு இணை.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிரை
  rationale: இங்கே נֶפֶשׁ மரணத்தில் எடுத்துக்கொள்ளப்படும் மனித உயிரைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்த்து தேவையற்ற மெய்யியல் குறிப்பைச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பியல் பொருள்
  choice: ‘ஆத்துமா’ என்பதற்குப் பதிலாக ‘உயிர்’
  alternative: அவனுடைய ஆத்துமாவை
  rationale: வசனம் மனிதனுடைய உயிரை கடவுள் எடுத்துக்கொள்வதைப் பேசுகிறது; ஆத்துமாவின் மெய்யியல் நிலையைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டை வலியுறுத்தவில்லை.
- issue: יִבְצָע என்ற கடினமான கூற்றின் பொருள்
  choice: அவன் ஆதாயம் அடைந்திருந்தாலும்
  alternative: கடவுள் அவனை அறுத்துப்போடும்போது / அவன் ஆதாயம் அடையும்போது
  rationale: எபிரெய வினையின் நன்கு நிறுவப்பட்ட ஆதாயம் சார்ந்த பொருளையும், rhetorical concessive sense-ஐயும் காக்கிறது; விவாதத்திற்குரிய மாற்றுப் பொருளை மூல உரைக்குள் தீர்மானமாகத் திணிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கவிதைநடை வினாவின் அழுத்தத்தை நீண்ட கோடு காக்கிறது. חָנֵף என்பதற்கு குறுகிய ‘வெளிவேடக்காரன்’ என்பதற்குப் பதிலாக பரந்த ‘இறைப்பற்றில்லாதவன்’ பயன்படுத்தப்பட்டது; יִבְצָע என்பதிலுள்ள உண்மையான உரைமொழி ஐயம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டது.
