  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: ta
  text: 'ஏனெனில், என் உயிர்மூச்சு எனக்குள் இருக்கும் வரையிலும்,

    தேவனுடைய மூச்சு[a] என் நாசிகளில் இருக்கும் வரையிலும்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய ஆவி.” எபிரெயச் சொல் רוּחַ என்பதற்கு “மூச்சு,” “காற்று,” அல்லது “ஆவி” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு כִּי அடுத்து வரும் ஆணையுறுதி போன்ற கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் ‘இருக்கும் வரையிலும்’ என்ற தொடரமைப்பே அந்த இணைப்பை இயல்பாகக் காட்டுவதால், ‘ஏனெனில்’ என்று சேர்ப்பது வசனத்தைத் துண்டாகவும் செயற்கையாகவும் ஆக்கும்.
- source_word: כָל עוֹד
  choice: இருக்கும் வரையிலும்
  rationale: இந்தச் சொற்றொடர் நீடிக்கும் காலம் முழுவதையும் குறிக்கிறது. இரு இணையான அடிகளிலும் ‘இருக்கும் வரையிலும்’ என அமைத்தது தமிழில் இயல்பாகவும் எபிரெயக் கவிதையின் தொடர்ச்சியுணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: נִשְׁמָתִי
  choice: என் உயிர்மூச்சு
  rationale: נְשָׁמָה இங்கு உயிரை நிலைநிறுத்தும் மூச்சைக் குறிக்கிறது. ‘உயிர்மூச்சு’ என்பது ‘மூச்சு’ என்ற உடல்சார் உருவகத்தையும் உயிரின் பொருளையும் இணைத்துப் பாதுகாக்கிறது; ‘ஆத்துமா’ என்பது சூழல் கோராத பொருளைச் சேர்க்கும்.
- source_word: בִי
  choice: எனக்குள்
  rationale: בְּ உள்ளார்ந்த இருப்பைக் குறிக்கிறது. ‘எனக்குள்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְרוּחַ
  choice: தேவனுடைய மூச்சு
  rationale: רוּחַ என்பதற்கு மூச்சு, காற்று, ஆவி ஆகிய பொருள்கள் உண்டு. நாசிகள் மற்றும் உயிர்மூச்சு பற்றிய இணை அமைப்பில் ‘மூச்சு’ முதன்மைப் பொருத்தம் உடையது; ‘ஆவி’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלוֹהַּ
  choice: தேவன்
  rationale: אֱלוֹהַּ என்பது யோபு நூலில் அடிக்கடி வரும் ஒருமைத் தெய்வப் பெயர். நவீன, கண்ணியமான தமிழில் ‘தேவன்’ துல்லியமான தேர்வு.
- source_word: בְּאַפִּי
  choice: என் நாசிகளில்
  rationale: אַף இங்கு மூக்கு அல்லது நாசியைக் குறிக்கிறது; கோபம் என்ற விரிவுப்பொருள் பொருந்தாது. பன்மை வடிவான ‘நாசிகளில்’ சுவாசத்தின் தெளிவான உடல்சார் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: נִשְׁמָתִי என்பதற்கு இணையாக வரும் רוּחַ אֱלוֹהַּ என்பதன் பொருள்
  choice: தேவனுடைய மூச்சு
  alternative: தேவனுடைய ஆவி
  rationale: உயிர்மூச்சு, உடலுக்குள் இருப்பது, நாசிகள் ஆகிய உடனடிச் சூழல் உயிரளிக்கும் சுவாசத்தைக் காட்டுகிறது. ஆகவே முதன்மை உரையில் ‘மூச்சு’ தேர்ந்தெடுக்கப்பட்டது. எனினும் רוּחַ உண்மையாகவே ‘ஆவி’ என்றும் பொருள்படக்கூடியதால், இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் உடல்சார் சுவாச உருவகமும் காக்கப்பட்டுள்ளன. ‘உயிர்மூச்சு’ மற்றும் ‘மூச்சு’ என்ற வேறுபாடு נְשָׁמָה / רוּחַ ஆகிய தனித்த எபிரெயச் சொற்களை ஓரளவு பிரதிபலிக்கிறது. அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கியத்தின் தொடர்ச்சியைச் சுட்டுவதற்காக இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
