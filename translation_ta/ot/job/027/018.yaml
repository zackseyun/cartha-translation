  yaml_path: translation/ot/job/027/018.yaml
  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: ta
  text: 'அவன் தன் வீட்டை அந்துப்பூச்சியைப் போலக் கட்டுகிறான்;

    காவலன் அமைக்கும் குடிலைப் போல.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: கட்டுகிறான்
  rationale: Qal perfect என்றாலும், கவிதைச் சூழலில் பொல்லாதவனின் வழக்கமான செயலைக் குறிக்கும் பொதுநிகழ்காலமாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָעָשׁ
  choice: அந்துப்பூச்சியைப் போல
  rationale: עָשׁ என்பதன் வழக்கமான பொருள் ‘அந்துப்பூச்சி.’ எபிரெய வாக்கியத்தின் சுருக்கமான ஒப்பீட்டையும், அது குறிக்கும் நிலையற்ற தன்மையையும் விளக்கிச் சேர்க்காமல் காக்கிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டை
  rationale: இணைவரியில் வரும் குடிலும் கட்டும் செயலும் ஒரு கட்டடத்தையே சுட்டுவதால், ‘குடும்பம்’ என்பதற்குப் பதிலாக ‘வீடு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וּכְסֻכָּה
  choice: குடிலைப் போலவும்
  rationale: סֻכָּה என்பது பொதுவாகத் தற்காலிகமான குடில் அல்லது மறைவிடத்தைக் குறிக்கிறது. ‘குடில்’ என்பது நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עָשָׂה
  choice: அமைக்கும்
  rationale: கவிதையின் பொதுநிகழ்காலப் பொருளைத் தக்கவைத்து, தற்காலிகக் குடிலை உருவாக்குவதற்கு இயல்பான தமிழ் வினையாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: נֹצֵר
  choice: காவலாளி
  rationale: இந்தப் பெயரெச்ச வடிவம் காப்பவரை அல்லது கண்காணிப்பவரைக் குறிக்கிறது; வயல் அல்லது திராட்சைத்தோட்டக் காவலாளியின் தற்காலிகக் குடில் என்ற காட்சி சூழலுக்குப் பொருந்துகிறது.
