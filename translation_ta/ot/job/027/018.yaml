  source_fidelity: முதல் ஒப்பீடும் ‘தன் வீடு’ என்பதும் மூலத்திற்கு உண்மையாக உள்ளன. ஆனால் இரண்டாம் வரியில் உள்ள ‘...போலவும் கட்டுகிறான்’ என்பதில் வினை மீண்டும் வெளிப்படுவதால், காவலாளி அமைக்கும் குடிலின் உருவகத்துடன் இணைவு சற்றே கனமாகிறது. மூலத்தின் இணை அமைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்ட, இரண்டாம் இடத்தில் வினையை விடுத்து ஒப்பீட்டைத் தொடர்வது பாதுகாப்பானது.
