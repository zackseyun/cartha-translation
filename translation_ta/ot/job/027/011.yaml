base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: ta
  text: கடவுளின் கையைக் குறித்து[a] நான் உங்களுக்குப் போதிப்பேன்; எல்லாம் வல்லவரிடம் உள்ளதை[b] நான் மறைக்கமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் கையைப்பற்றி.’ ‘கடவுளின் கை’ என்பது அவரது வல்லமை, செயல் அல்லது நடத்துதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லாம் வல்லவருக்குரியதை,’ ‘எல்லாம் வல்லவரின் ஆலோசனையை,’ அல்லது ‘எல்லாம் வல்லவரிடமிருந்து வருவதை.’ எபிரெயச் சொற்றொடர் சுருக்கமானதும் ஓரளவு விடுபட்ட பொருளுடையதும் ஆகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: நான் உங்களுக்குப் போதிப்பேன்
  rationale: ירה என்பதன் ஹிஃபில் முற்றுப்பெறா வடிவம் இங்கு அறிவுறுத்துதல் அல்லது போதித்தல் என்ற பொருளில் வருகிறது. யோபின் உறுதியான அறிவிப்பை எதிர்கால வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד אֵל
  choice: கடவுளின் கையைக் குறித்து
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு கருவியைக் குறிப்பதற்குப் பதிலாக போதனையின் பொருளைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. ‘கடவுளின் கை’ என்ற எபிரெய உருவகம் அவரது வல்லமை, செயல் அல்லது நடத்துதலைச் சுட்டக்கூடும் என்பதால் உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இங்கு இறைப்பட்டமாகப் பயன்படுகிறது; ‘கடவுள்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: எல்லாம் வல்லவரிடம் உள்ளதை
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் விடுபட்ட பொருளுடையதாகவும் உள்ளது. ‘உள்ளதை’ என்பது ஆலோசனை, நோக்கம், செயல் போன்ற எந்த ஒரு பொருளையும் தேவையின்றி சேர்க்காமல் அதன் அகலத்தைப் பாதுகாக்கிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: שַׁדַּי என்ற இறைப்பட்டத்தின் பொருளை நவீனத் தமிழில் தெளிவாகவும் மரியாதையுடனும் வழங்குகிறது.
- source_word: לֹא אֲכַחֵד
  choice: நான் மறைக்கமாட்டேன்
  rationale: כחד என்பதன் பியேல் வடிவம் இங்கு மறைத்தல் அல்லது ஒளித்தல் என்று பொருள்படுகிறது; ‘மறைக்கமாட்டேன்’ என்பது சுருக்கமான இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: ‘கடவுளின் கை’ என்பதில் வெளிப்படும் இறைச் செயற்பாடு
  choice: ‘கடவுளின் கை’ என்ற உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘கடவுளின் வல்லமை’ அல்லது ‘கடவுள் செய்வது’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூல உருவகம் வல்லமை, செயல், நடத்துதல் ஆகிய பல நுணுக்கங்களைத் தாங்குகிறது. அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து பொருளைக் குறுக்காமல் உருவகமே பாதுகாக்கப்படுகிறது.
- issue: இரண்டாம் அரையடியிலுள்ள சுருக்கமான இறைத் தொடர்பு
  choice: ‘எல்லாம் வல்லவரிடம் உள்ளதை’ என்று அகன்ற பொருளுடன் வழங்கப்பட்டது.
  alternative: ‘எல்லாம் வல்லவரின் ஆலோசனையை,’ ‘நோக்கத்தை,’ அல்லது ‘தீர்ப்பை’ என்று குறிப்பாக்குதல்.
  rationale: மூலத்தில் வெளிப்படையான பெயர்ச்சொல் இல்லை. எனவே குறிப்பிட்ட இறையியல் கருத்தைச் சேர்க்காமல் உண்மையான தெளிவின்மை தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘கை’ என்ற வேதாகம உருவகமும் இரண்டாம் அரையடியின் பொருள் அகலமும் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளன.
