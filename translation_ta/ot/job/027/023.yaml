  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: ta
  text: அவன் அவனை நோக்கிக் கைகொட்டுகிறான்; தன் இடத்திலிருந்து அவனை நோக்கிச் சீறுகிறான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை நோக்கிச் சீட்டியடிக்கிறான்.” எபிரெய வினைச்சொல் சீட்டியடிப்பதையோ சீறுவதையோ குறிக்கலாம்; இங்கு பகைமையான தொனியை வெளிப்படுத்த “சீறுகிறான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கைகொட்டுகிறான் … சீறுகிறான்” என்பவற்றின் எழுவாய் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. இது கடவுளையோ, மற்ற மனிதர்களையோ, ஆளுருவற்ற ஒரு சக்தியையோ குறிக்கலாம் என்று வெவ்வேறு விதமாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: கைகொட்டுகிறான்
  rationale: שׂפק என்பது கைகளைத் தட்டுதல் அல்லது கொட்டுதல் என்ற செயலைக் குறிக்கிறது. כפים என்பதுடன் வருவதால், அந்தச் செயலை மிகையாக விளக்காமல் இயல்பான தமிழில் “கைகொட்டுகிறான்” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָלֵימוֹ
  choice: அவனைப் பார்த்து
  rationale: על + பின்னொட்டு இங்கு ஒருவரை நோக்கிச் செய்யப்படும் பகைமையான சைகையைக் குறிக்கிறது. தமிழில் “அவனைப் பார்த்து” என்பது கைகொட்டும் செயலுடன் இயல்பாக அமைகிறது.
- source_word: כַפֵּימוֹ
  choice: கை
  rationale: כף என்பதன் அடிப்படைப் பொருள் “உள்ளங்கை” அல்லது “கை.” தமிழில் “கைகொட்டுதல்” என்ற வழக்குச் சொல் இரு கைகளையும் உள்ளடக்குவதால் தனியே பன்மையைக் காட்டத் தேவையில்லை.
- source_word: וְיִשְׁרֹק
  choice: சீறுகிறான்
  rationale: שרק என்பது சீட்டியடித்தல் அல்லது சீறுதல் ஆகிய இரண்டையும் குறிக்கலாம். இச்சூழலின் பகைமையான தொனிக்காக “சீறுகிறான்” தெரிவுசெய்யப்பட்டு, “சீட்டியடிக்கிறான்” அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
- source_word: עָלָיו
  choice: அவனை நோக்கி
  rationale: על + பின்னொட்டு பகைமையான ஒலிச் செயல் செலுத்தப்படும் நபரைச் சுட்டுகிறது; “அவனை நோக்கி” என்பது தமிழில் இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: מִמְּקֹמוֹ
  choice: தன் இடத்திலிருந்து
  rationale: מקום என்பது பொதுவாக “இடம்” என்று பொருள்படும். பின்னொட்டு செயலைச் செய்பவனைக் குறிப்பதாக இயல்பாகப் புரிகிறது; “தன் இடத்திலிருந்து” என்பது அதன் துல்லியமான நுட்பத்தைத் தீர்மானிக்காமல் திறந்துவைக்கிறது.
theological_decisions:
- issue: வசனத்தின் எழுவாய் யார்?
  choice: வெளிப்படையாகப் பெயரிடாமல் “அவன்” என்ற ஒருமை எழுவாய் தக்கவைக்கப்பட்டுள்ளது.
  alternative: கடவுள், மற்ற மனிதர்கள், அல்லது கிழக்குக் காற்று போன்ற ஆளுருவற்ற சக்தி என்று குறிப்பிட்டு மொழிபெயர்த்தல்.
  rationale: எபிரெயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை வினைச்சொற்கள் உள்ளன; ஆனால் வெளிப்படையான எழுவாய் இல்லை. அருகிலுள்ள சூழல் பல விளக்கங்களுக்கு இடமளிப்பதால், வசனமே தீர்மானிக்காத அடையாளத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. “கைகொட்டுகிறான்” என்பது நேரடியான உடல் சைகையை இயல்பாகக் காட்டுகிறது; “சீறுகிறான்” பகைமையான ஒலியைத் தெரிவிக்கிறது. எழுவாயின் அடையாளம் திட்டமிட்டு தெளிவுபடுத்தப்படவில்லை.
