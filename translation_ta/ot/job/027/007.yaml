id: JOB.27.7
reference: Job 27:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְהִ֣י כְ֭/רָשָׁע אֹ֣יְבִ֑/י וּ/מִתְקוֹמְמִ֥/י כְ/עַוָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: ta
  text: என் பகைவன் பொல்லாதவனைப் போலவும், எனக்கு எதிராக எழுகிறவன் அநீதியானவனைப் போலவும் ஆகட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: ஆகட்டும்
  rationale: היה என்பதன் Qal விருப்பவினை வடிவம் விருப்பத்தையோ சாபவுரையையோ தெரிவிக்கிறது; தமிழில் “ஆகட்டும்” அதன் வலிமையை இயல்பாகத் தருகிறது.
- source_word: כְרָשָׁע
  choice: பொல்லாதவனைப் போல
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; רָשָׁע ஒழுக்கரீதியில் பொல்லாத ஒருவரைக் குறிக்கிறது. ஒருமை வடிவத்தையும் ஒப்புமையையும் தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: אֹיְבִי
  choice: என் பகைவன்
  rationale: אויב என்பதுடன் முதலாம் நபர் ஒருமை உரிமை விகுதி இணைந்துள்ளது; “என் பகைவன்” நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: וּמִתְקוֹמְמִי
  choice: எனக்கு எதிராக எழுகிறவன்
  rationale: קום வேரிலான இப்பங்கேற்பு வடிவம் பேசுபவருக்கு எதிராகத் தன்னை நிறுத்திக்கொள்பவனைச் சித்தரிக்கிறது; பொதுவான “எதிரி” என்பதற்குப் பதிலாக மூலத்தின் செயல்படிமத்தைப் பேணுகிறது.
- source_word: כְעַוָּל
  choice: அநீதியானவனைப் போல
  rationale: עַוָּל அநீதி அல்லது தவறான நடத்தையால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது; “அநீதியானவன்” அதன் ஒழுக்க-நீதி சார்ந்த பொருளைப் பேணுகிறது.
theological_decisions:
- issue: வசனத்தின் விருப்பவினை அல்லது சாபவுரைத் தன்மை
  choice: “ஆகட்டும்” என்று வெளிப்படையாகப் பேணப்பட்டது
  alternative: “ஆகிறான்” என்று கூற்றாக மொழிபெயர்த்தல்
  rationale: יְהִי என்பது சாதாரண அறிவிப்பல்ல; விருப்பம் அல்லது எதிர்மறை வேண்டுதலைத் தெரிவிக்கும் jussive வடிவம். அதன் இறையியல் மற்றும் உணர்ச்சி சார்ந்த பதற்றத்தைத் தணிக்காமல் வைத்திருக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். மூல எபிரேயத்தின் இணையான இரு அரையடிகளும், “பொல்லாதவன் / அநீதியானவன்” என்ற நெருங்கிய ஆனால் வேறுபட்ட ஒழுக்கச் சொற்களும், எதிராக ‘எழுதல்’ என்ற செயல்படிமமும் பேணப்பட்டுள்ளன.
