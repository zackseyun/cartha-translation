  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: ta
  text: பயங்கரங்கள் அவனைத் தண்ணீரைப் போல[a] வந்தடைகின்றன; இரவில் புயல்[b] அவனைக் களவாடிக் கொண்டு செல்கிறது.
  philosophy: optimal-equivalence
