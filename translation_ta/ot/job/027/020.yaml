    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: அவனை வந்தடைகின்றன
  rationale: נשׂג என்பதன் ஹிஃபில் வடிவம், துரத்திவந்து எட்டிப் பிடிக்கும் கருத்தைக் கொண்டது. தமிழில் ‘வந்தடைகின்றன’ என்பது அந்த இயக்கத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: כַמַּיִם
  choice: தண்ணீரைப் போல
  rationale: எபிரெயப் பன்மை வடிவமான ‘நீர்கள்’ இங்கு பெருக்கெடுத்து மூழ்கடிக்கும் தண்ணீரின் உருவகத்தைத் தருகிறது; நவீன தமிழில் ‘தண்ணீரைப் போல’ இயல்பாக உள்ளது. ‘வெள்ளம்போல’ என்பது சாத்தியமானாலும் விளக்கவுரையாக அமையும்.
- source_word: בַּלָּהוֹת
  choice: பயங்கரங்கள்
  rationale: திடீரென வரும் அச்சுறுத்தும் கொடுமைகள் அல்லது திகிலூட்டும் நிகழ்வுகளைக் குறிக்கும் பன்மைச் சொல். ‘பயங்கரங்கள்’ அதன் பன்மையையும் கவிதைச் செறிவையும் காக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: பெயர்ச்சொல் இங்கு காலத்தைக் குறிக்கும் வினையடைப் பொருளில் வருகிறது; ‘இரவில்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: גְּנָבַתּוּ
  choice: அவனைத் திருடனைப் போலக் கொண்டுபோகிறது
  rationale: גנב என்பதன் அடிப்படைப் பொருள் ‘திருடுதல்’. புயல் ஒருவனைத் திடீரென, மறைவாக அகற்றும் கவித்துவப் படிமத்தை தமிழில் தெளிவுபடுத்த ‘திருடனைப் போலக் கொண்டுபோகிறது’ என வழங்கப்படுகிறது.
- source_word: סוּפָה
  choice: புயல்
  rationale: வன்மையான புயல் அல்லது சூறாவளியைக் குறிக்கிறது. ‘புயல்’ பொதுவான பொருளைத் தக்கவைத்து, தேவையற்ற வகைத் துல்லியத்தைச் சேர்க்காது.
