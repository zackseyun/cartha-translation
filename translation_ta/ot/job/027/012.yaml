  text: הֵן אַתֶּ֣ם כֻּלְּ/כֶ֣ם חֲזִיתֶ֑ם וְ/לָ/מָּה זֶּ֝֗ה הֶ֣בֶל תֶּהְבָּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: ta
  text: இதோ, நீங்கள் எல்லாரும் கண்டிருக்கிறீர்கள்; அப்படியிருக்க, ஏன் இப்படி வீணாக நடந்துகொள்கிறீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் இப்படி வீண்பேசுகிறீர்கள்?” எபிரெயத்தில் ‘வெறுமை, வீண், பயனின்மை’ என்று பொருள்படும் ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் இணைந்து வலியுறுத்தும் சொல்விளையாட்டை உருவாக்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கண்டனத்தை வலியுறுத்தும் சொல்லாக இயல்பான நவீனத் தமிழில் அமைந்துள்ளது.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: நீங்கள் எல்லாருமே
  rationale: இரண்டாம் நபர் பன்மையையும், அனைவரையும் உள்ளடக்கும் எபிரெய வலியுறுத்தலையும் ‘-மே’ மூலம் வெளிப்படுத்துகிறது.
- source_word: חֲזִיתֶם
  choice: கண்டிருக்கிறீர்கள்
  rationale: அவர்கள் ஏற்கெனவே நேரடியாகக் கண்டுணர்ந்ததைத் தற்போதைய வாதத்துடன் இணைக்கிறது; மூலத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால் தமிழிலும் ஒன்றைச் சேர்க்கவில்லை.
- source_word: וְלָמָּה
  choice: அப்படியிருக்க, ஏன்
  rationale: அவர்கள் கண்டிருக்கிறார்கள் என்ற முன்னுரையிலிருந்து யோபின் கண்டனத்துக்குச் செல்லும் காரணவிளைவு சார்ந்த கேள்வியைத் தெளிவாக்குகிறது.
- source_word: זֶּה
  choice: இப்படி
  rationale: இங்கு தனியான சுட்டுப்பெயராக அல்லாமல், அவர்களுடைய வீணான நிலை அல்லது நடத்தையைச் சுட்டும் வினையடைத் தன்மையில் புரிந்துகொள்ளப்பட்டுள்ளது.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: வீணாகவே வீண்போகிறீர்கள்
  rationale: ஒரே வேர் கொண்ட பெயர்ச்சொல்–வினைச்சொல் இணைப்பின் வலியுறுத்தலையும் சொல்விளையாட்டையும் தமிழில் இயன்றவரை மீட்டெடுக்கிறது; பேச்சு, சிந்தனை, நடத்தை ஆகியவற்றில் ஒன்றை மட்டும் என்று தேவையின்றிக் குறுக்கவில்லை.
