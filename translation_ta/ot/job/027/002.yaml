  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: ta
  text: என் நியாயத்தை[a] அகற்றிய தேவனும், என் உயிரைக் கசப்பாக்கிய[b] சர்வவல்லவரும் உயிரோடிருப்பது எவ்வளவு உறுதியோ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் நியாயம்’ என்பதற்கு ‘என் நீதி,’ ‘என் உரிமை,’ அல்லது ‘என் நியாயமான கோரிக்கை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மிஷ்பாத் நீதி, தீர்ப்பு, அல்லது ஒருவருக்குரிய உரிமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் உயிரை’ என்பதற்கு ‘என் வாழ்க்கையை’ அல்லது ‘என்னை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய நெபெஷ் சூழலுக்கு ஏற்ப உயிர், வாழ்க்கை, அல்லது தன்னையே குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: தேவன் உயிரோடிருப்பது எவ்வளவு உறுதியோ
  rationale: חַי + இறைப்பட்டம் என்பது ஆணையிடும் சூத்திரம். தமிழில் அதன் ஆணை வலிமையை இயல்பாக வெளிப்படுத்த இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு אֵל என்பது ஒலிபெயர்க்க வேண்டிய தனிப்பெயர் அல்ல; பொதுவான இறைப்பட்டம்.
- source_word: הֵסִיר
  choice: பறித்துவிட்ட
  rationale: Hiphil வடிவம் ‘அகற்றுதல்/எடுத்துவிடுதல்’ என்று பொருள்படும். தனக்குரிய நீதி மறுக்கப்பட்டதாக யோபு கூறும் குற்றச்சாட்டின் வலிமையை ‘பறித்துவிட்ட’ தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁפָּטִי
  choice: என் நீதியை
  rationale: מִשְׁפָּטִי என்பது ‘என் நீதி,’ ‘என் உரிமை,’ அல்லது ‘என் நியாயமான கோரிக்கை’ எனப் பொருள்படலாம். ‘என் நீதி’ அதன் கருத்துப் பரப்பையும் கவித்துவச் செறிவையும் காக்கிறது.
- source_word: וְשַׁדַּי
  choice: சர்வவல்லவர்
  rationale: שַׁדַּי என்பது இறைப்பட்டம்; அதன் பொருளைத் தமிழில் வழங்கும் வழக்கமான, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: הֵמַר
  choice: கசப்பாக்கிய
  rationale: מרר என்பதன் Hiphil வடிவம் ‘கசப்பாக்குதல்’ என்று பொருள் தருகிறது; மூலத்தின் உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ இங்கு உயிர், உள்ளம், அல்லது தன்னையே குறிக்கலாம். ‘என் உயிரை’ தமிழில் இயல்பாக இருந்து, வாழ்வனுபவம் முழுவதும் கசப்பானது என்ற பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אֵל மற்றும் שַׁדַּי ஆகிய இறைப்பட்டங்களை வழங்குதல்
  choice: தேவன் ... சர்வவல்லவர்
  alternative: தேவன் ... ஷத்தாய்
  rationale: இவை பெயர்களாக ஒலிபெயர்க்கப்படாமல், பொருள் தரும் இறைப்பட்டங்களாக மொழிபெயர்க்கப்பட்டுள்ளன; எபிரெய இணைநிலையையும் ஆணையின் கம்பீரத்தையும் இது காக்கிறது.
- issue: யோபு தேவனைப் பற்றிக் கூறும் குற்றச்சாட்டின் வலிமை
  choice: என் நீதியைப் பறித்துவிட்ட ... என் உயிரைக் கசப்பாக்கிய
  alternative: என் வழக்கில் இன்னும் தீர்ப்பளிக்காத ... என்னைத் துயரப்படுத்திய
  rationale: மூலவசனம் தேவனைக் குறித்த யோபுவின் கடுமையான கூற்றை நேரடியாகத் தருகிறது. அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமலும் விளக்கத்தால் தீர்த்துவிடாமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். வசனம் அடுத்த வசனங்களில் தொடரும் ஆணையின் தொடக்கமாக இருப்பதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘உயிரோடிருப்பது எவ்வளவு உறுதியோ’ என்ற இணை அமைப்பு இரு இறைப்பட்டங்களுக்கும் பொருந்துமாறு வெளிப்படையாகத் தரப்பட்டுள்ளது.
