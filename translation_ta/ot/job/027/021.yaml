  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: ta
  text: கிழக்குக் காற்று அவனைத் தூக்கிச் செல்கிறது; அவன் போய்விடுகிறான்; அது அவனை அவனுடைய இடத்திலிருந்து சுழற்றிக்கொண்டு போகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: அவனைத் தூக்கிக்கொண்டு போகிறது
  rationale: נשׂא என்பதன் ‘தூக்கு, சுமந்து செல்’ என்ற அடிப்படைப் படிமத்தையும், காற்று வலுக்கட்டாயமாக அகற்றும் சூழலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קָדִים
  choice: கிழக்குக் காற்று
  rationale: קָדִים இங்கு திசையை மட்டும் அல்ல, அழிவுண்டாக்கும் கிழக்குக் காற்றைச் சுட்டுகிறது.
- source_word: וְיֵלַךְ
  choice: அவன் மறைந்துபோகிறான்
  rationale: הלך என்பதன் ‘போகிறான்’ என்ற பொருள் இங்கு காற்றால் அகற்றப்பட்டதன் விளைவைக் குறிக்கிறது; ‘மறைந்துபோகிறான்’ என்பது அவன் அங்கிருந்து இல்லாமற்போவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וִישָׂעֲרֵהוּ
  choice: அவனை ... சுழற்றியடிக்கிறது
  rationale: סער வேரின் புயல், சீற்றம், சுழற்றுதல் ஆகிய வன்மையான இயக்கப் படிமத்தை ‘சுழற்றியடிக்கிறது’ நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִמְּקֹמוֹ
  choice: அவனுடைய இடத்திலிருந்து
  rationale: מקום என்பதன் நேரடியான ‘இடம்’ என்ற பொருளையும், அங்கிருந்து அகற்றப்படுதல் என்ற உறவையும் காக்கிறது.
