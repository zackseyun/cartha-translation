  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: ta
  text: உங்களைச் சரியென்று தீர்ப்பளிப்பது எனக்கு அறவே கூடாது[a]; நான் இறக்கும்வரை, என் நேர்மையை[b] என்னைவிட்டு அகற்றமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை நியாயமானவர்கள் என்று அறிவிப்பது.’ எபிரெய வினைச்சொல், ஒருவரின் பக்கம் நியாயம் இருப்பதாகத் தீர்ப்பளிப்பதைக் குறிக்கும் நீதிமன்றச் சார்ந்த சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் குற்றமின்மையை’ அல்லது ‘என் உத்தமத்தை.’ எபிரெயச் சொல், யோபு தம்மை ஆதரித்துப் பேசும் சூழலில் ஒழுக்க நேர்மையையோ குற்றமற்ற நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: எனக்கு ஆகாத காரியம்
  rationale: கடுமையான மறுப்பை வெளிப்படுத்தும் எபிரெய மரபுத்தொடரை, அதன் வலிமையைக் காக்கும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: உங்களைச் சரியென்று தீர்ப்பளிப்பது
  rationale: צדק என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரின் பக்கம் நியாயம் இருப்பதாகத் தீர்ப்பளிக்கும் நீதிமன்றச் சார்ந்த பொருளைக் கொண்டது; பொதுவான வாசகருக்கும் புரியும் வகையில் அந்தப் பொருள் காக்கப்படுகிறது.
- source_word: עַד אֶגְוָע
  choice: நான் சாகும்வரை
  rationale: גוע என்பதன் ‘இறத்தல்/உயிர்விடுதல்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֹא אָסִיר
  choice: அகற்றமாட்டேன்
  rationale: סור என்பதன் ஹிஃபில் வடிவத்திலுள்ள அகற்றுதல் அல்லது விலக்குதல் என்ற உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: תֻּמָּתִי
  choice: என் நேர்மையை
  rationale: யோபு தம்மீது சுமத்தப்பட்ட குற்றச்சாட்டை ஏற்க மறுத்து வலியுறுத்தும் ஒழுக்க நேர்மையை இது காட்டுகிறது; முழுமையான பாவமின்மை என்ற பொருளைத் தேவையின்றி ஏற்றுவதில்லை.
- source_word: מִמֶּנִּי
  choice: என்னைவிட்டு
  rationale: ‘என்னிடமிருந்து’ என்ற எபிரெய முன்னிடைச்சொல்லின் வெளிப்படையான பொருளையும், முதல் நபரை வலியுறுத்தும் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: யோபு தமது ஒழுக்க நிலையைப் பற்றிக் கூறும் கூற்றின் தன்மை
  choice: என் நேர்மை
  alternative: என் குற்றமின்மை / என் உத்தமம்
  rationale: இச்சொல் யோபு தமது நண்பர்களின் குற்றச்சாட்டை ஏற்காமல் தமது ஒழுக்க நேர்மையை நிலைநிறுத்துவதைக் குறிக்கிறது. ‘நேர்மை’ என்பது முழுமையான பாவமின்மையை வற்புறுத்தாமலும் பின்னாளைய இறையியல் பிரிவுகளைப் புகுத்தாமலும் மூலத்தின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவான வாசகருக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. முதல் கூறின் கடுமையான மறுப்பும், இரண்டாம் கூறின் உறுதியான தற்காப்பும் காக்கப்பட்டுள்ளன; நீதிமன்றச் சார்ந்த நுண்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
