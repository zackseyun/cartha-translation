revisions:
- from: உங்களைச் சரியென்று தீர்ப்பளிப்பது எனக்கு ஆகாத காரியம்[a]; நான் சாகும்வரை, என் நேர்மையை[b] என்னைவிட்டு அகற்றமாட்டேன்.
  to: உங்களைச் சரியென்று தீர்ப்பளிப்பது எனக்கு அறவே கூடாது[a]; நான் இறக்கும்வரை, என் நேர்மையை[b] என்னைவிட்டு அகற்றமாட்டேன்.
