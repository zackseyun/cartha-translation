review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the two clauses: Job emphatically refuses to concede that his friends are in the right, and he resolves to retain his integrity until death. The judicial nuance of אַצְדִּיק is appropriately retained in both the main text and note. אולם, “எனக்கு ஆகாத காரியம்” can primarily suggest impossibility rather than the Hebrew idiom’s emphatic repudiation.'
  naturalness: The register is generally clear, modern, and suitably dignified. Replacing the opening expression with “எனக்கு அறவே கூடாது” gives a more forceful and idiomatic Tamil repudiation. “என்னைவிட்டு அகற்றமாட்டேன்” is understandable and preserves the explicit ‘from me’ formulation.
  terminology: '“சரியென்று தீர்ப்பளிப்பது” suitably conveys the forensic declaration. “என் நேர்மை” is an excellent rendering of תֻּמָּתִי: it communicates moral integrity without asserting absolute sinlessness. The notes provide legitimate alternatives without imposing doctrine.'
  issues:
  - severity: medium
    issue: The opening idiom is slightly weakened.
    rationale: “எனக்கு ஆகாத காரியம்” naturally means ‘an impossible matter for me,’ whereas חָלִילָה לִּי is a strong repudiation, ‘far be it from me’ / ‘certainly not for me.’ “எனக்கு அறவே கூடாது” better conveys this force in modern Tamil.
  revised_text: உங்களைச் சரியென்று தீர்ப்பளிப்பது எனக்கு அறவே கூடாது[a]; நான் இறக்கும்வரை, என் நேர்மையை[b] என்னைவிட்டு அகற்றமாட்டேன்.
