  text: עָשִׁ֣יר יִ֭שְׁכַּב וְ/לֹ֣א יֵאָסֵ֑ף עֵינָ֖י/ו פָּקַ֣ח וְ/אֵינֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: ta
  text: செல்வந்தனாக அவன் படுத்துக்கொள்கிறான்; ஆனால் அவன் சேர்த்துக்கொள்ளப்பட மாட்டான்.[a] அவன் தன் கண்களைத் திறக்கிறான்—அவனோ இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களோடு சேர்த்துக்கொள்ளப்பட மாட்டான்” என்றும், பொதுவாக “சேர்த்துக்கொள்ளப்பட மாட்டான்” என்றும் பொருள்கொள்ளலாம். எபிரேயம் சுருக்கமாக உள்ளது; மரணத்தையோ அடக்கத்தையோ நேரடியாகக் கூறாமல் அவற்றைக் குறிப்பதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: நேரடியாக, “அவன் இல்லை.” இது அவன் போய்விட்டான் அல்லது இனி இல்லை என்பதை உணர்த்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: செல்வந்தனாக
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை என்றாலும், எபிரேயத்தின் சுருக்கமான அமைப்பைக் காக்கவும் ‘மனிதன்’ என்பதைச் சேர்க்காமல் இருக்கவும் இங்கு பயனிலைத் தன்மையில் மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׁכַּב
  choice: படுத்துக்கொள்கிறான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்/படு’. கவிதையின் உயிரோட்டத்தையும் சூழலில் உள்ள வருங்கால அல்லது விளைவு சார்ந்த நுணுக்கத்தையும் இயல்பான தமிழில் தர நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְלֹא יֵאָסֵף
  choice: ஆனால் அவன் சேர்த்துக்கொள்ளப்பட மாட்டான்
  rationale: Niphal வடிவிலுள்ள אָסף என்பது ‘சேர்த்துக்கொள்ளப்படுதல்’ என்றும், மரணம் அல்லது அடக்கம் சார்ந்த மரபுத்தொடராகவும் வரலாம். மூலத்தின் சுருக்கத்தையும் பொருள் தெளிவின்மையையும் காக்க விரிவான விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: עֵינָיו פָּקַח
  choice: அவன் தன் கண்களைத் திறக்கிறான்
  rationale: சொல்லுக்கு சொல் வரிசை ‘தன் கண்களை அவன் திறக்கிறான்’ என்றாலும், திடீர் திருப்பைத் தக்கவைத்து இயல்பான தமிழ்ச் சொற்றொடராக அமைக்கப்பட்டது.
- source_word: וְאֵינֶנּוּ
  choice: அவனோ இல்லை
  rationale: இந்தச் சொற்றொடரின் நேரடிப் பொருள் ‘அவன் இல்லை’. அது காணாமற்போதல் அல்லது இனி உயிரோடு இல்லாமையை உணர்த்தக்கூடும்; ‘அவனோ இல்லை’ என்பது எபிரேயத்தின் திடீர் முடிவையும் genuine ambiguity-யையும் காக்கிறது.
theological_decisions:
- issue: ‘சேர்த்துக்கொள்ளப்படுதல்’ என்பது முன்னோர்களோடு சேர்க்கப்படுதலா, அடக்கமா, அல்லது மரணத்தில் அகற்றப்படுதலா?
  choice: முதன்மை உரையில் ‘சேர்த்துக்கொள்ளப்பட மாட்டான்’ என்ற சுருக்கமான வடிவம்
  alternative: ‘தன் முன்னோர்களோடு சேர்த்துக்கொள்ளப்பட மாட்டான்’ அல்லது பொதுவாக ‘அடக்கம் செய்யப்பட மாட்டான்’
  rationale: எபிரேய உரை எதனோடு அல்லது எங்கு சேர்க்கப்படுகிறான் என்பதைச் சொல்லவில்லை. குறிப்பிட்ட மரணத்துக்குப் பிந்தைய கருத்தையோ அடக்க முறையையோ உரைக்குள் சேர்க்காமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கவிதைநடையின் சுருக்கமும் இரண்டாம் அரையடியின் திடீர் மறைவு உணர்வும் காக்கப்பட்டன; தெளிவில்லாத மரணம்/அடக்கம் குறித்த நுணுக்கம் அடிக்குறிப்பில் விளக்கப்பட்டது.
