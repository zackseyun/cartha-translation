  text: אִם תְּדַבֵּ֣רְנָה שְׂפָתַ֣/י עַוְלָ֑ה וּ֝/לְשׁוֹנִ֗/י אִם יֶהְגֶּ֥ה רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/004.yaml
  text: my lips will not speak injustice[a], nor will my tongue utter deceit.
translation:
  language: ta
  text: என் உதடுகள் அநியாயத்தைப் பேசாது[a]; என் நாவும் வஞ்சகத்தை உரைக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ஆணையுறுதி போன்ற அமைப்பில் ‘என்றால்’ (אִם) பயன்படுத்தப்பட்டு வலுவான மறுப்பு தெரிவிக்கப்படுகிறது. சொற்சொல்லாக, ‘என் உதடுகள் அநியாயத்தைப் பேசினால்…’ என்பது, ‘என் உதடுகள் நிச்சயமாக அநியாயத்தைப் பேசாது’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: பேசாது / உரைக்காது
  rationale: இங்கு אִם ஒரு சாதாரண நிபந்தனையைக் குறிக்காமல், ஆணையுறுதி போன்ற அமைப்பில் வலுவான மறுப்பைக் குறிக்கிறது. ஆகவே இயல்பான தமிழில் எதிர்மறை வினை வடிவால் மொழிபெயர்க்கப்பட்டது.
- source_word: תְּדַבֵּרְנָה
  choice: பேசாது
  rationale: דבר என்பதன் பியேல் வடிவம் ‘பேசுதல்’ என்று பொருள்படும். நிறைவுறா வினை இங்கு யோபுவின் உறுதியான எதிர்காலத் தீர்மானத்தை வெளிப்படுத்துகிறது.
- source_word: שְׂפָתַי
  choice: என் உதடுகள்
  rationale: பேச்சைக் குறிக்கும் உடல் உறுப்புச் சித்திரத்தையும், அடுத்த அடியிலுள்ள ‘என் நாவு’ என்ற இணை அமைப்பையும் காக்கிறது.
- source_word: עַוְלָה
  choice: அநியாயம்
  rationale: இச்சொல் அநீதி, தவறு, நேர்மையின்மை ஆகிய அறநெறிப் பொருள்களை உடையது. அடுத்துள்ள ‘வஞ்சகம்’ என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘அநியாயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּלְשׁוֹנִי
  choice: என் நாவும்
  rationale: ו இணைப்புச் சொல், முந்தைய மறுப்பின் ஆற்றலைத் தொடர்ந்து இரண்டாவது இணையான கூற்றைச் சேர்க்கிறது. தமிழில் ‘-உம்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֶהְגֶּה
  choice: உரைக்காது
  rationale: הגה சூழலுக்கேற்ப முணுமுணுத்தல், உரைத்தல், தியானித்தல் எனப் பொருள்படும். ‘நாவு’ எழுவாயாகவும் ‘வஞ்சகம்’ செயப்படுபொருளாகவும் இருப்பதால் ‘உரைத்தல்’ பொருத்தமானது.
- source_word: רְמִיָּה
  choice: வஞ்சகம்
  rationale: இச்சொல் ஏமாற்றம், வஞ்சனை, துரோகம் ஆகிய பொருள்களைத் தருகிறது. பேச்சின் பொய்மையான நோக்கைத் தெளிவாகக் காட்டவும் ‘அநியாயம்’ என்பதிலிருந்து வேறுபடுத்தவும் ‘வஞ்சகம்’ தேர்ந்தெடுக்கப்பட்டது.
