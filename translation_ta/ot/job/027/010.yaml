  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: ta
  text: அவன் சர்வவல்லவரில் மகிழ்ச்சி காண்பானா?[a] எல்லாக் காலங்களிலும் தேவனை நோக்கி அழைப்பானா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “அவன் சர்வவல்லவரில் மகிழ்ச்சி கண்டால்”; இங்கு எபிரெயச் சொல் மறுப்புப் பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அழைப்பானா?” என்பதை “வேண்டிக்கொள்வானா?” அல்லது “ஜெபிப்பானா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: —ஆனா?
  rationale: இங்கு אִם ஒரு நிபந்தனை வாக்கியத்தைத் தொடங்காமல், இறைப்பற்றற்றவனைப் பற்றிய எதிர்பார்க்கப்படும் மறுப்புப் பதிலைக் கொண்ட வினாவை அறிமுகப்படுத்துகிறது. எனவே தமிழில் வினா வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עַל שַׁדַּי
  choice: சர்வவல்லவரில்
  rationale: התענג என்பதுடன் வரும் עַל, மகிழ்ச்சியின் பொருளைக் குறிக்கிறது. தமிழில் ‘—இல் மகிழ்ச்சியடைதல்’ இயல்பாகவும் மூலத்தின் உறவையும் நெருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: יִתְעַנָּג
  choice: மகிழ்ச்சியடைவான்
  rationale: Hitpael வடிவம் ஒருவர் ஒரு பொருளில் இன்பமும் மகிழ்ச்சியும் காண்பதைக் குறிக்கிறது. தனியே ஒரு செயப்படுபொருள் பிரதிப்பெயரைச் சேர்ப்பது தமிழில் செயற்கையாக இருக்கும் என்பதால் இயல்பான வினை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: இது இறைவனுக்குரிய பட்டப்பெயர்; பெயராக ஒலிபெயர்ப்பதற்குப் பதிலாக அதன் வழக்கமான தமிழ் பொருள் மொழிபெயர்க்கப்பட்டது.
- source_word: יִקְרָא אֱלוֹהַּ
  choice: இறைவனை நோக்கிக் கூப்பிடுவான்
  rationale: இறைவனைச் செயப்படுபொருளாகக் கொண்ட קרא, அவரை வேண்டி அழைப்பதை அல்லது அவரை நோக்கிக் கூப்பிடுவதைச் சுட்டுகிறது. ‘நோக்கிக் கூப்பிடுதல்’ அதன் பரந்த பொருளை வைத்திருக்கிறது; அதை முறையான ஜெபத்திற்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: בְּכָל עֵת
  choice: எல்லா நேரங்களிலும்
  rationale: மூலத்திலுள்ள ‘ஒவ்வொரு காலத்திலும்/நேரத்திலும்’ என்ற விரிவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שַׁדַּי என்ற இறைப் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: இது தனிப்பெயரைக் காட்டிலும் இறைப் பட்டப்பெயராகச் செயல்படுவதால் பொருள் மொழிபெயர்க்கப்பட்டது; இதனால் தமிழ் வாசகருக்கு அதன் பொருள் நேரடியாகப் புரிகிறது.
- issue: இரு வினாக்களின் எதிர்பார்க்கப்படும் பதில்
  choice: மறுப்புப் பதிலை எதிர்பார்க்கும் வினாக்களாக வைத்தல்
  alternative: வெளிப்படையாக ‘அவன் மகிழ்ச்சியடைய மாட்டான்; கூப்பிடவும் மாட்டான்’ என்று கூறுதல்
  rationale: சூழல் மறுப்புப் பதிலை உணர்த்தினாலும், எபிரெய மூலத்தின் வினா வடிவமும் அதன் சொல்லாட்சித் தாக்கமும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கவிதைநடையின் இணையான இரு வினாக்களும், அவற்றிலுள்ள இறையியல் பதற்றமும் வெளிப்படையான விளக்கத்தால் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
