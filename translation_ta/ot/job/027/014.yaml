- from: அவனுடைய மகன்கள் பெருகினால், அவர்கள் வாளுக்கு இரையாவார்கள்; அவனுடைய சந்ததியினருக்கு வயிறு நிறைய அப்பம் கிடைக்காது.[a]
  to: அவனுடைய மகன்கள் பெருகினால், அவர்கள் வாளுக்கு இரையாவார்கள்; அவனுடைய சந்ததியினர் அப்பத்தால் நிறைவடைய மாட்டார்கள்.[a]
  rationale: 'Final clause revised to retain the Hebrew construction more directly: the descendants themselves do not attain satisfaction/fullness with bread. The footnote wording has also been made idiomatic in modern standard Tamil. The conditional formulation, the distinction between sons and descendants, and the sword image are retained.'
