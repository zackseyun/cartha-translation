translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது. ‘வாள்’ மற்றும் ‘அப்பம்’ என்ற மூலப் படிமங்கள் காக்கப்பட்டுள்ளன; எபிரெய மொழியின் சுருக்கமான சொற்றொடர்கள் இயல்பான தமிழ் வாக்கியங்களாக வழங்கப்பட்டுள்ளன.
