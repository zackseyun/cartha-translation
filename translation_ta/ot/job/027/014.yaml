  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: ta
  text: அவனுடைய மகன்கள் பெருகினால், அவர்கள் வாளுக்கு இரையாவார்கள்; அவனுடைய சந்ததியினர் அப்பத்தால் நிறைவடைய மாட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அப்பத்தால் நிறைவடைய மாட்டார்கள்.” இது போதுமான உணவு கிடைக்காததைக் குறிக்கிறது.
    reason: மூல வினைச்சொல்லின் நேரடிப் பொருளையும் ‘அப்பம்’ என்பதன் விரிந்த உணவுப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: אִם
  choice: பெருகினால்
  rationale: நிபந்தனையைக் குறிக்கும் אִם என்பதன் இயல்பான தமிழ் வடிவமாக ‘-னால்’ பயன்படுத்தப்பட்டுள்ளது; ‘பெருகினாலும்’ என்று மாற்றி எதிர்மறை ஒப்புமையைச் சேர்க்காமல் மூலத்தின் நிபந்தனை அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: יִרְבּוּ
  choice: பெருகினால்
  rationale: רבה என்பது எண்ணிக்கையில் அதிகமாதலைக் குறிக்கிறது; ‘பெருகு’ அதைப் பொருத்தமாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: மூலத்தில் ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதே இருப்பதால் அதை ‘பிள்ளைகள்’ என்று விரிவுபடுத்தாமல் துல்லியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְמוֹ חָרֶב
  choice: அவர்கள் வாளுக்கு இரையாவார்கள்
  rationale: சொல்லெழுத்தாக ‘அவர்களுக்கு வாள்’ என்ற சுருக்கமான எபிரெய அமைப்பு, வாளால் ஏற்படும் மரணம் அவர்களுக்குரிய முடிவாக இருப்பதைச் சுட்டுகிறது. இயல்பான தமிழில் அந்தப் படிமத்தையும் விதிக்கப்பட்ட முடிவையும் ‘வாளுக்கு இரையாவார்கள்’ எனத் தெரிவிக்கிறது.
- source_word: וְצֶאֱצָאָיו
  choice: அவனுடைய சந்ததியினர்
  rationale: இந்தச் சொல் உடனடியான மகன்களை மட்டும் அல்லாமல் வழித்தோன்றல்களையும் குறிக்கக்கூடியதால் ‘சந்ததியினர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: வயிறு நிறைய அப்பம் கிடைக்காது
  rationale: שׂבע என்பது நிறைவடைதல் அல்லது வயிறு நிறைதலைக் குறிக்கிறது; לֶחֶם என்ற ‘அப்பம்’ படிமத்தைக் காத்தபடி, போதிய உணவு இல்லாமையை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
