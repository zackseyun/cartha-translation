base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: ta
  text: துன்பம் அவன்மேல் வரும்போது, கடவுள் அவனுடைய கூக்குரலைக் கேட்பாரா?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூக்குரல்’ என்பதை ‘அழுகுரல்’ அல்லது ‘முறையீடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வரும்போது’ என்பதை ‘வந்தால்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய இணைப்புச்சொல் நிபந்தனைப் பொருளையும் தரக்கூடும், என்றாலும் இச்சூழலில் காலப்பொருள் நன்றாகப் பொருந்துகிறது.
    reason: alternative_reading
  - marker: c
    text: ‘துன்பம்’ என்பதை ‘நெருக்கடி,’ ‘இடுக்கண்,’ அல்லது ‘கேடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: அவனுடைய கூக்குரல்
  rationale: צְעָקָה என்பது நெருக்கடியில் எழுப்பப்படும் உரத்த அழுகுரல் அல்லது உதவிக்கான கூக்குரலைக் குறிக்கிறது. ‘கூக்குரல்’ அதன் அவசரத்தையும் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִשְׁמַע
  choice: கேட்பாரா
  rationale: இங்குள்ள yiqtol வடிவம் சூழலில் எதிர்காலப் பொருளுடைய வினாவாக அமைகிறது. இது பதிலை எதிர்பார்க்கும் சாதாரண கேள்வியாக அல்லாமல், கடவுள் கேட்கமாட்டார் என்ற உட்கருத்துள்ள சொல்லாட்சிக் கேள்வியாகவும் நிற்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל என்பதற்கான தெளிவான, பொதுவாகப் புரியக்கூடிய நவீனத் தமிழ்ச் சொல் ‘கடவுள்’; ‘வல்லவர்’ போன்ற விளக்கத்தை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: வரும்போது
  rationale: כִּי பல பொருள்களை ஏற்கக்கூடியது. இச்சூழலில் காலத்தைக் குறிக்கும் ‘போது’ இயல்பாகப் பொருந்துகிறது; நிபந்தனைப் பொருளான ‘வந்தால்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תָבוֹא עָלָיו
  choice: அவன்மேல் வரும்போது
  rationale: בוא + על என்பதன் ‘ஒருவர்மேல் வருதல்’ என்ற உருவகத்தைத் தமிழிலும் நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: צָרָה
  choice: துன்பம்
  rationale: צָרָה என்பது நெருக்கடி, துயரம், இடுக்கண் அல்லது கேடு ஆகிய பரந்த பொருள் வட்டத்தைக் கொண்டது. ‘துன்பம்’ மிகைப்படுத்தாமல் பொதுவான பாதிப்பு மற்றும் நெருக்கடியை உணர்த்துகிறது.
theological_decisions:
- issue: கேள்வியின் சொல்லாட்சித் தன்மை
  choice: கேள்வி வடிவத்தை அப்படியே வைத்தல்
  alternative: ‘கடவுள் அவன் கூக்குரலைக் கேட்கமாட்டார்’ என்று உறுதிமொழியாக்குதல்
  rationale: எபிரெய உரை கேள்வியாகவே உள்ளது. சூழல் எதிர்மறையான பதிலைச் சுட்டினாலும், அதனை வெளிப்படையான உறுதிமொழியாக மாற்றாமல் உரையின் வலிமையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அவன்மேல் வருதல்’ என்ற எபிரெய உருவகம் இயல்பாகத் தக்கவைக்கப்பட்டு, சொல்லாட்சிக் கேள்வியும் தீர்மானமாக மாற்றப்படவில்லை.
