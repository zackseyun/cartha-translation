  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: ta
  text: அவன் அதை ஆயத்தப்படுத்தினாலும்[a], நீதிமான் அதை அணிந்துகொள்வான்[b]; வெள்ளியை குற்றமற்றவன் பங்கிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஆயத்தப்படுத்துவான்; ஆனால் நீதிமான் அதை அணிந்துகொள்வான்.” எபிரெய வினை வடிவத்தை விட்டுக்கொடுப்பு நயம் இல்லாமலும் மொழிபெயர்க்கலாம்; “ஆயத்தப்படுத்தினாலும்” என்ற பொருளை முந்தைய வசனத்தின் சூழல் ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மறைமுகமாக உள்ள செயப்படுபொருள்கள் முந்தைய வசனத்திலிருந்து பெறப்படுகின்றன: அணிவது அங்கு கூறப்பட்ட உடையைக் குறிக்கிறது; பங்கிடப்படுவது அங்கு குவிக்கப்பட்ட வெள்ளியைக் குறிக்கிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: அவன் அதை ஆயத்தப்படுத்தினாலும்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ‘ஆயத்தப்படுத்து, தயாராக்கு’ என்று பொருள்படும். முந்தைய வசனத்தில் குவிக்கப்பட்ட உடையும் செல்வமும் பின்னணியாக இருப்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது. சூழலில் உள்ள எதிர்மறை விளைவை வெளிப்படுத்த ‘-ஆலும்’ என்ற விட்டுக்கொடுப்பு நயம் பயன்படுத்தப்பட்டுள்ளது; எபிரெய வினை வடிவத்தை நேரடியாக ‘அவன் ஆயத்தப்படுத்துவான்’ என்றும் கொள்ளலாம்.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை ஆண்பால் பெயரடை. நவீன தமிழ் வேதாகம நடையில் இயல்பாகவும் சுருக்கமாகவும் ‘நீதிமான்’ என வழங்கப்பட்டுள்ளது.
- source_word: יִלְבָּשׁ
  choice: அதை அணிந்துகொள்வான்
  rationale: לבש என்பதன் கால் வடிவம் ‘அணிதல்’ என்று பொருள்படும். அதன் மறைமுகச் செயப்படுபொருள் முந்தைய வசனத்திலுள்ள உடை என்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֶסֶף
  choice: வெள்ளியை
  rationale: כֶּסֶף என்பது ‘வெள்ளி’ அல்லது ‘பணம்’ எனப் பொருள்படலாம். முந்தைய வசனத்தில் குவிக்கப்பட்ட பொருட்செல்வத்தையும் இங்கு பங்கிடப்படுவதையும் கருத்தில் கொண்டு, உலோகச் செல்வத்தைக் குறிக்கும் ‘வெள்ளி’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: נָקִי
  choice: குற்றமற்றவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பெயரடை குற்றத்திலிருந்து விடுபட்ட அல்லது பழியற்ற ஒருவரைக் குறிக்கிறது. தீயவனுக்கு எதிரான அறநிலை தெளிவாகத் தெரிய ‘குற்றமற்றவன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יַחֲלֹק
  choice: பங்கிட்டுக்கொள்வான்
  rationale: חלק என்பதன் கால் வடிவம் ‘பிரி, பங்கிடு’ என்று பொருள்படும். இங்கு தீயவன் சேர்த்த வெள்ளி குற்றமற்றவனுக்குப் பங்காகக் கிடைக்கும் கருத்தை இயல்பான தமிழில் தெரிவிக்க ‘பங்கிட்டுக்கொள்வான்’ பயன்படுத்தப்பட்டுள்ளது.
