lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: அவனுக்குப் பின் எஞ்சியிருப்பவர்கள்
  rationale: ஒருமை வடிவில் 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு இருந்தாலும், தொடர்ந்து வரும் வினைச்சொல் பன்மையில் உள்ளது; ஆகவே இச்சொல் கூட்டுப் பொருளில், அவனுக்குப் பின் உயிரோடு எஞ்சியவர்களைக் குறிக்கிறது.
- source_word: בַּמָּוֶת
  choice: மரணத்தால்
  rationale: ב முன்னிடைச்சொல் இங்கு சூழ்நிலையையோ கருவி போன்ற காரணத்தையோ குறிக்கலாம். ‘மரணத்தால்’ என்பது மரணமே அவர்களது அடக்கத்தின் விதியாக இருப்பதைக் கூறும் எபிரெயச் சொற்றொடரின் கடுமையான சுருக்கத்தைத் தக்கவைக்கிறது.
- source_word: יִקָּבֵרוּ
  choice: அடக்கம் செய்யப்படுவார்கள்
  rationale: קבר என்பதன் நிஃபால் நிறைவுறா வடிவம் செயல்பாட்டு எதிர்மறைப் பொருளில் ‘அடக்கம் செய்யப்படுவார்கள்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְאַלְמְנֹתָיו
  choice: அவர்களுடைய விதவைகள்
  rationale: மசோரெட்டிக் வாசகத்தில் உள்ள பின்னொட்டு இலக்கணரீதியாக ஒருமை ஆண்பாலைச் சுட்டினாலும், சூழலில் இறந்த எஞ்சியவர்களின் விதவைகளைக் குறிக்கும் இயல்பான தொடர்பைத் தமிழில் ‘அவர்களுடைய’ எனத் தெளிவாக்குகிறது.
- source_word: לֹא תִבְכֶּינָה
  choice: அழமாட்டார்கள்
  rationale: בכה என்பதன் நேரடிப் பொருள் ‘அழுதல்’; ‘துக்கங்கொண்டாடுதல்’ என்ற விரிவான பொருளைவிட இது மூலத்தின் குறிப்பான செயலைத் தக்கவைக்கிறது.
