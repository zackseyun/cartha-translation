  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: ta
  text: அவனுடைய எஞ்சியவர்கள் மரணத்தால்[a] அடக்கம் செய்யப்படுவார்கள்; அவனுடைய விதவைகள் அழமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மரணத்தில் அடக்கம் செய்யப்படுவார்கள்.’ எபிரெயச் சொற்றொடர் சுருக்கமானது; அது அடக்கத்தின் விதியையோ சூழ்நிலையையோ குறிக்கலாம்.
