  text: עַד אָ֥ן תְּמַלֶּל אֵ֑לֶּה וְ/ר֥וּחַ כַּ֝בִּיר אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: ta
  text: “இவற்றை இன்னும் எவ்வளவு காலம் சொல்லிக்கொண்டிருப்பாய்[a]? உன் வாயின் சொற்கள் பலத்த காற்றா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றை இன்னும் எவ்வளவு காலம் பேசுவாய்? உன் வாயின் சொற்கள் வலிமைமிக்க காற்றா?”
    reason: தொடர்ச்சியான செயலை உணர்த்தும் ‘சொல்லிக்கொண்டிருப்பாய்’ என்பதற்குப் பதிலாக எபிரெய வினையின் எளிய ‘பேசுவாய்’ என்ற மொழிபெயர்ப்பும், כַּבִּיר என்பதற்கு ‘வலிமைமிக்க’ என்ற மாற்றும் சாத்தியம்.
lexical_decisions:
- source_word: עַד אָן
  choice: இன்னும் எவ்வளவு காலம்
  rationale: ‘எதுவரை’ என்ற நேரடியான வடிவத்தைவிட, கண்டிப்பின் நீடித்த உணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּמַלֶּל
  choice: பேசிக்கொண்டிருப்பாய்
  rationale: பேசுதல் அல்லது உரைத்தல் என்ற அடிப்படைப் பொருளுடன், சூழலில் பில்தாதின் பொறுமையின்மையையும் தொடர்ந்து பேசும் செயலையும் உணர்த்துகிறது.
- source_word: אֵלֶּה
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரின் பரந்த பொருளைப் பேணி, யோபு முன்பு கூறியவற்றைக் குறிக்கிறது; ‘வார்த்தைகள்’ என்று தேவையின்றி மீண்டும் குறிப்பிடவில்லை.
- source_word: וְרוּחַ כַּבִּיר
  choice: வலிமைமிக்க காற்றாக
  rationale: רוּחַ என்பதன் ‘காற்று’ என்ற உருவகத்தை அப்படியே பேணுகிறது; כַּבִּיר குறிக்கும் வலிமையையும் வெளிப்படுத்துகிறது. இதை ‘வெற்றுப் பேச்சு’ என்று விளக்கி மொழிபெயர்த்து உருவகத்தைத் தீர்த்துவிடவில்லை.
- source_word: אִמְרֵי פִיךָ
  choice: உன் வாயின் சொற்கள்
  rationale: எபிரெயக் கூட்டுச்சொல் அமைப்பையும் கவிதைநடையின் வலியுறுத்தலையும் இயல்பான தமிழில் பேணுகிறது.
