id: JOB.8.5
reference: Job 8:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: ta
  text: ஆனால் நீ கடவுளை முனைப்புடன் தேடி[a], சர்வவல்லவரிடம்[b] அருளுக்காக மன்றாடினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளை அதிகாலையிலேயே தேடி.’ எபிரெய வினைச்சொல் அதிகாலையில் தேடுதல் என்ற பொருளையும் தரக்கூடும்; இங்கு முனைப்புடன் அல்லது அக்கறையுடன் தேடுதல் என்பதே வாய்ப்புள்ள பொருள்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: ‘ஷத்தாய்.’ இது பாரம்பரியமாக ‘சர்வவல்லவர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ஆனால் ... மன்றாடினால்
  rationale: אִם நிபந்தனையை அறிமுகப்படுத்துகிறது. முந்தைய வசனத்துடனான கருத்து மாறுபாட்டை இயல்பான தமிழில் காட்ட ‘ஆனால்’ சேர்க்கப்பட்டு, நிபந்தனைப் பொருள் வினைமுற்றிலுள்ள ‘-ஆல்’ வடிவால் காக்கப்படுகிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; எபிரெயத்தில் வெளிப்படையாக இருப்பதால் தமிழிலும் ‘நீ’ எனத் தரப்பட்டுள்ளது.
- source_word: תְּשַׁחֵר
  choice: முனைப்புடன் தேடி
  rationale: שׁחר என்பதன் பியேல் வடிவம் அதிகாலையில் தேடுதல் என்றோ, அக்கறையோடும் ஊக்கத்தோடும் தேடுதல் என்றோ பொருள்படலாம். இச்சூழலில் கடவுளைத் தீவிரமாக நாடுவதே முதன்மைப் பொருள்; காலக் குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֶל אֵל
  choice: கடவுளை
  rationale: אֶל திசை அல்லது நோக்கைச் சுட்டுகிறது; ‘தேடு’ என்பதுடன் இயல்பான தமிழில் அது தனியே மொழிபெயர்க்கப்படாமல் ‘கடவுளைத் தேடு’ என்ற அமைப்பில் வெளிப்படுகிறது. אֵל இங்கு ‘கடவுள்’ எனத் தரப்பட்டுள்ளது.
- source_word: וְ/אֶל שַׁדַּי
  choice: சர்வவல்லவரிடம்
  rationale: וְ இரண்டு இணையான செயல்களை இணைக்கிறது. אֶל, மன்றாடுதல் என்ற வினையுடன் தமிழில் ‘-இடம்’ என இயல்பாக வெளிப்படுகிறது. שַׁדַּי என்ற தெய்வீகப் பட்டம் அதன் பாரம்பரியப் பொருளைக் காட்டும் வகையில் ‘சர்வவல்லவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּתְחַנָּן
  choice: அருளுக்காக மன்றாடினால்
  rationale: חנן என்பதன் ஹித்பயேல் வடிவம் அருள் அல்லது தயவை வேண்டி இறைஞ்சுவதைக் குறிக்கிறது. ‘அருளுக்காக மன்றாடு’ என்பது அதன் உறவுசார், இரக்கத்தை நாடும் நுண்பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: שַׁדַּי என்ற தெய்வீகப் பட்டத்தின் மொழியாக்கம்
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: இது பெயராக ஒலிபெயர்க்கப்படக்கூடியதாக இருந்தாலும், இங்கு தெய்வீகப் பட்டமாகச் செயல்படுகிறது. அதன் பாரம்பரியமாக ஏற்றுக்கொள்ளப்பட்ட பொருளை வாசகருக்குத் தெரிவிக்க ‘சர்வவல்லவர்’ என மொழிபெயர்த்து, எபிரெய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நிபந்தனைத் தொடரின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘முனைப்புடன்’ என்பது தீவிரமான தேடுதலை இயல்பாக வெளிப்படுத்துகிறது; ‘அதிகாலையில்’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
