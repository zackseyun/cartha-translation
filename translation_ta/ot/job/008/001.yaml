  text: Then Bildad the Shuhite answered and said:[a][b]
translation:
  language: ta
  text: அப்போது, சூகியனாகிய பில்தாத் பதிலளித்துச் சொன்னான்:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறுமொழி கூறினான்.”
