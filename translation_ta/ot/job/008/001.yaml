  - marker: b
    text: “சூகியன்” என்பது சூவாவுடன் தொடர்புடைய மக்கள் அல்லது பகுதியைச் சேர்ந்தவரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்ற வினை இங்கு உரையாடலில் முந்தைய பேச்சுக்குப் பதிலளிப்பதைக் குறிக்கிறது. தொடரும் וַיֹאמַר உடன் சேர்த்து, இயல்பான தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: בִּלְדַּד
  choice: பில்தாத்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הַשּׁוּחִי
  choice: சூகியனான
  rationale: சூவாகு தொடர்புடைய மக்கள் அல்லது பகுதியைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இன/இடப்பெயரடை; தமிழில் இயல்பாக நபரை அடையாளப்படுத்தும் வடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֹאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’. அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்தும் தமிழ் மரபுக்கேற்ப ‘சொன்னது’ என வழங்கப்பட்டுள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம உரைநடையைப் பேணுகிறது. எபிரெய மொழியின் ‘பதிலளித்து—சொன்னான்’ என்ற இரட்டைச் சொற்றொடர் தமிழில் கடினமாக ஒலிக்காதபடி ‘மறுமொழியாகச் சொன்னது’ என ஒருங்கிணைக்கப்பட்டது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
