  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: ta
  text: 'அவர் இன்னும்[a] உன் வாயைச் சிரிப்பினாலும்,

    உன் உதடுகளை ஆரவாரத்தாலும் நிரப்புவார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, முந்தைய வசனத்துடன் இணைத்து: “அவர் உன் வாயைச் சிரிப்பினாலும், உன் உதடுகளை மகிழ்ச்சி ஆரவாரத்தாலும் நிரப்பும்வரை.”'
    reason: עַד என்பதற்கு ‘இன்னும்’ என்பதோடு ‘…வரை’ என்ற கால எல்லைப் பொருளும் உண்டு; பிந்தைய வாசிப்பு இவ்வசனத்தை முந்தைய கூற்றுடன் தொடரியல் முறையில் இணைக்கிறது.
lexical_decisions:
- source_word: עַד
  choice: இன்னும்
  rationale: முந்தைய வசனத்தில் கடவுளே செயல்படும் பொருளாக இருப்பதையும், இங்கு எதிர்கால மீட்பை உறுதியுடன் கூறும் சூழலையும் கருத்தில் கொண்டு, நவீன தமிழில் இயல்பாக ஒலிக்கும் ‘இன்னும்’ பயன்படுத்தப்பட்டுள்ளது. ‘…வரை’ என்ற நேரப் பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְמַלֵּה
  choice: நிரப்புவார்
  rationale: מלא என்பதன் பியேல் முற்றுப்பெறாத வினை வடிவம்; சூழலில் கடவுள் மறைமுக எழுவாய். வாக்குறுதியின் எதிர்கால வலிமையைத் தமிழில் ‘நிரப்புவார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׂחוֹק
  choice: சிரிப்பு
  rationale: இச்சொல்லின் நேரான பொருள் ‘சிரிப்பு’. மீட்பின் சூழலில் இகழ்ச்சிச் சிரிப்பு என்ற எதிர்மறைப் பொருளைச் சேர்க்காமல், கவித்துவப் படிமத்தைக் காக்கிறது.
- source_word: פִּיךָ
  choice: உன் வாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் பெயர்ச்சொல்லின் நேரடி மொழிபெயர்ப்பு; ‘வாயை நிரப்புதல்’ என்ற தெளிவான கவித்துவப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: וּשְׂפָתֶיךָ
  choice: உன் உதடுகள்
  rationale: ‘வாய்’ என்பதோடு அமைந்துள்ள எபிரெயக் கவிதை இணைநிலையைப் பாதுகாக்க உடல் உறுப்பைக் குறிக்கும் நேரான சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְרוּעָה
  choice: ஆரவாரம்
  rationale: இச்சொல் மகிழ்ச்சி அல்லது வெற்றியின் உரத்த முழக்கத்தைக் குறிக்கலாம். ‘ஆரவாரம்’ உரத்த வெளிப்பாட்டைத் தக்கவைத்துக்கொண்டு, வழிபாட்டு அல்லது போர்சார் நுணுக்கத்தை தேவையின்றி வரையறுக்காது; இங்கு மகிழ்ச்சியான பொருள் ‘சிரிப்பு’ என்ற இணைவரியால் தெளிவாகிறது.
theological_decisions:
- issue: வினையின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது உடனடியான சூழலில் கடவுளைக் குறிக்கிறது.
  alternative: ‘உன் வாய் சிரிப்பினால் நிரப்பப்படும்’ என எழுவாயை வெளிப்படுத்தாத செயப்பாட்டு மொழிபெயர்ப்பு.
  rationale: 8:20-ல் கடவுள் செயல்படும் எழுவாயாகக் குறிப்பிடப்படுகிறார்; 8:21 அந்தச் செயலை இயல்பாகத் தொடர்கிறது. ‘அவர்’ என்று மொழிபெயர்ப்பது மீட்பைக் கடவுளின் செயலாகக் காட்டும் மூலமொழியின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- issue: עַד என்பதன் தொடரியல் மற்றும் காலப் பொருள்
  choice: தனி வசனமாக இயல்பாக வாசிக்க ‘இன்னும்’ என்ற எதிர்கால உறுதியுரை.
  alternative: முந்தைய வசனத்துடன் இணைத்து ‘அவர் … நிரப்பும்வரை’ என மொழிபெயர்த்தல்.
  rationale: עַד பொதுவாக ‘வரை’ என்று பொருள்படலாம்; ஆனால் இங்கு தனி வசனத்தின் வாக்குறுதி வடிவில் ‘இன்னும்’ இயல்பானது. உண்மையான தொடரியல் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைந்த கவிதைநடை. ‘வாய்/உதடுகள்’ என்ற இணைநிலையும் ‘சிரிப்பு/ஆரவாரம்’ என்ற உணர்ச்சி உயர்வும் காக்கப்பட்டுள்ளன. கடவுளைக் குறிக்கும் ‘அவர்’ மரியாதை ஒருமையில் வழங்கப்பட்டுள்ளது.
