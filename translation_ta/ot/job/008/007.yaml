translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமான தொனியும் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் இரு அடிகளுக்கிடையிலான மாறுபாடு முதன்மை உரையில் இயல்பாக வெளிப்படுத்தப்பட்டு, சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
