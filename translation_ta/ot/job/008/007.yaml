source:
  edition: WLC
  text: וְ/הָיָ֣ה רֵאשִׁיתְ/ךָ֣ מִצְעָ֑ר וְ֝/אַחֲרִיתְ/ךָ֗ יִשְׂגֶּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: ta
  text: உன் தொடக்கம் சிறியதாக இருந்தபோதிலும்[a], உன் பிற்கால நிலை மிகவும் பெரிதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் தொடக்கம் சிறியதாக இருந்தது; ஆனால் உன் எதிர்காலம் மிகப் பெரிதாகும்.”
    reason: எபிரெய இணைப்புச் சொல்லைச் சேர்க்கையாகப் புரிந்துகொள்ளவும், אַחֲרִית மற்றும் יִשְׂגֶּה ஆகியவற்றை முறையே ‘எதிர்காலம்’, ‘பெரிதாகும்’ என மொழிபெயர்க்கவும் வாய்ப்புள்ளது.
lexical_decisions:
- source_word: וְהָיָה
  choice: இருந்தபோதிலும்
  rationale: இணைப்புச் சொல்லுடன் வரும் היה என்பதன் இறந்தகால வடிவம் சொற்படியாக ‘இருந்தது’ எனப் பொருள்படலாம். இரு கவிதை அடிகளுக்கிடையிலான எதிர்மறை ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்த ‘இருந்தபோதிலும்’ எனத் தரப்பட்டுள்ளது; சேர்க்கைத் தொடர் என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֵאשִׁיתְךָ
  choice: உன் தொடக்கம்
  rationale: רֵאשִׁית என்பது தொடக்கம் அல்லது ஆரம்ப நிலையைக் குறிக்கிறது. ‘உன் தொடக்கம்’ நேரடியும் இயல்பானதுமான தமிழ்.
- source_word: מִצְעָר
  choice: சிறியதாக
  rationale: இந்தச் சொல் சிறுமை அல்லது மிகக் குறைந்த நிலையைக் குறிக்கிறது. பின்னர் வரும் பெருக்கத்துடனான வேறுபாட்டை ‘சிறியதாக’ தெளிவாகக் காட்டுகிறது.
- source_word: אַחֲרִיתְךָ
  choice: உன் பிற்கால நிலை
  rationale: אַחֲרִית என்பது முடிவு, இறுதி விளைவு அல்லது எதிர்கால நிலை எனப் பொருள்படலாம். ‘பிற்கால நிலை’ காலப்பொருளையும் இறுதி நிலை பற்றிய நுணுக்கத்தையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: יִשְׂגֶּה
  choice: பெருகும்
  rationale: שׂגה என்ற வினை வளர்தல், பெருகுதல் அல்லது பெரிதாதல் என்பதைக் குறிக்கிறது. ‘பெருகும்’ என்பது சிறிய தொடக்கத்திலிருந்து பெரிய பிற்கால நிலைக்குச் செல்லும் இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: מְאֹד வலுவான தீவிரத்தைக் குறிக்கும் வினையடை. ‘மிகவும்’ அதன் வலிமையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
