  register: நவீன நிலையான தமிழில், கவிதைநயமும் தாவர உருவகமும் காக்கப்பட்டுள்ளன. ஆண்பால் மனிதச் சித்தரிப்பும், ‘சூரியனுக்கு முன்பாக’ என்பதிலுள்ள இடவியல் தெளிவின்மையும் வேண்டுமென்றே பாதுகாக்கப்பட்டுள்ளன.
