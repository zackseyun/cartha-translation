  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: ta
  text: அவன் சூரியனின் முன்[a] ஈரப்பசையுடன் இருக்கிறான்; அவனுடைய இளந்தளிர்கள்[b] அவன் தோட்டத்தின்மேல் படர்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சூரியனின் முன்” என்பது “சூரியனின் எதிரே” அல்லது “சூரிய ஒளியில்” என்று பொருள்படலாம்; அது சூரிய உதயத்திற்கு முன்பு என்பதைக் கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய இளந்தளிர் அவன் தோட்டத்தின்மேல் வெளிவருகிறது.” மென்மையான புதிய வளர்ச்சியைக் குறிக்கும் எபிரெய ஒருமைப் பெயர்ச்சொல்லைத் தொகுப்பொருளில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: ஈரப்பசை நிறைந்தவனாய்
  rationale: இந்தச் சொல் ஈரமான அல்லது நன்கு நீர்ப்பசை கொண்ட நிலையைக் குறிக்கிறது. தாவர உருவகத்தின் உறுதியான படிமத்தைத் தக்கவைக்க இந்தத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: הוּא
  choice: அவன்
  rationale: எபிரெய உரையில் உள்ள ஆண்பால் ஒருமைப் பெயர்ப்பதிலியைத் தக்கவைத்து, பில்தாதின் உருவகத்தில் தாவரம் மனிதனைப்போல் சித்தரிக்கப்படுவதைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: சூரியனுக்கு முன்பாக
  rationale: சொல்லடியாக உள்ள ‘சூரியனுக்கு முன்பாக’ என்ற இடவியல் வெளிப்பாட்டைத் தக்கவைக்கிறது; இதைச் சூரிய உதயத்திற்கு முந்திய நேரம் என்று மட்டும் முடிவுசெய்யவில்லை.
- source_word: וְעַל
  choice: தோட்டத்தின்மேல்
  rationale: עַל என்பதன் இடவியல் பொருளான ‘மேல்’ என்பதைக் காத்து, தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: גַּנָּתוֹ
  choice: அவன் தோட்டம்
  rationale: பெயர்ச்சொல்லின் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֹנַקְתּוֹ
  choice: அவனுடைய இளந்தளிர்கள்
  rationale: மென்மையான புதிய தளிர் அல்லது கிளைவளர்ச்சியைக் குறிக்கும் சொல்லை நவீனத் தமிழில் தெளிவான தாவரவியல் படிமமாக வழங்குகிறது. எபிரெய ஒருமையைத் தொகுப்பொருளில் புரிந்துகொண்டு பன்மையாக மொழிபெயர்த்துள்ளது.
- source_word: תֵצֵא
  choice: படர்கின்றன
  rationale: சொல்லடியாக ‘வெளியே வருகிறது/புறப்படுகிறது’ என்றாலும், தோட்டத்தின் மேல் நீளும் தாவர வளர்ச்சியை இயல்பான தமிழில் ‘படர்கின்றன’ என்று வழங்குகிறது.
