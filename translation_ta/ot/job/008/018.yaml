  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான செய்யுள் நடை பயன்படுத்தப்பட்டது. ‘அந்த இடம்’ பேசுவதாக அமைந்த ஆளுருவாக்கம் காக்கப்பட்டது. மனிதன்/செடி என்ற எபிரெயப் படிமத்தின் திட்டமிட்ட தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
