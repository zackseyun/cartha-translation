  text: אִם יְבַלְּעֶ֥/נּוּ מִ/מְּקוֹמ֑/וֹ וְ/כִ֥חֶשׁ בּ֝֗/וֹ לֹ֣א רְאִיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: ta
  text: அவன் தன் இடத்திலிருந்து முற்றிலும் அழிக்கப்பட்டால்[a], அந்த இடம் அவனை மறுதலித்து[b], “நான் உன்னைப் பார்த்ததே இல்லை” என்று சொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தன் இடத்திலிருந்து விழுங்கப்பட்டால்.” எபிரெய மொழியில் இங்கு மனிதனும் செடியும் கலந்த படிமம் தொடர்கிறது; வினைச்சொல் ‘விழுங்கப்படுதல்’ அல்லது ‘முற்றிலும் அழிக்கப்படுதல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடனான உறவை மறுக்கும்” / “அவனிடம் பொய்யாக நடக்கும்.” எபிரெய வினைச்சொல் மறுத்தல், உறவை ஏற்காமை, பொய்யாக நடத்தல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: அகற்றப்பட்டால்
  rationale: אִם என்பதன் நிபந்தனைப் பொருளைத் தமிழ் ‘-ஆல்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְבַלְּעֶנּוּ
  choice: அவன் ... அகற்றப்பட்டால்
  rationale: בלע என்ற வினை அடிப்படையில் ‘விழுங்குதல்/முற்றிலும் அழித்தல்’ என்ற படிமத்தைக் கொண்டிருந்தாலும், இங்கு ஒருவனை அவன் இருந்த இடத்திலிருந்து முற்றாக நீக்கப்படுவதை ‘அகற்றப்பட்டால்’ இயல்பாகத் தெரிவிக்கிறது; செயப்படுபொருள் சார்ந்த வாசிப்பையும் காக்கிறது.
- source_word: מִמְּקוֹמוֹ
  choice: தன் இடத்திலிருந்து
  rationale: ஆண்பால் ஒருமை பின்னொட்டு மனிதனையோ செடியையோ குறிக்கக்கூடும். தமிழ் ‘தன்’ அந்த இரட்டைச் சாத்தியத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְכִחֶשׁ בּוֹ
  choice: அந்த இடம் அவனை மறுதலித்து
  rationale: כחש இங்கு மறுத்தல், தொடர்பை ஏற்காமை, பொய்யாக நடத்தல் ஆகிய பொருள்களைத் தரலாம். அடுத்த நேர்க்கூற்றோடு ‘மறுதலித்து’ நன்கு பொருந்துகிறது; ‘அந்த இடம்’ என்பதை வெளிப்படுத்துவது எபிரெயச் செய்யுளின் ஆளுருவாக்கத்தைத் தெளிவாக்குகிறது.
- source_word: לֹא רְאִיתִיךָ
  choice: நான் உன்னைப் பார்த்ததே இல்லை
  rationale: நேரடியான ‘பார்த்தல்’ படிமத்தைப் பாதுகாக்கிறது; ‘-தே இல்லை’ என்பது முழுமையான மறுப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
