  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: ta
  text: உன் மகன்கள் அவருக்கு எதிராகப் பாவம் செய்திருந்தால், அவர் அவர்களை அவர்களுடைய மீறுதலின் வசம் ஒப்புக்கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “அவர்களுடைய மீறுதலின் கையில்.” “கையில்” என்பது ஒருவருடைய அதிகாரம் அல்லது ஆளுகையைக் குறிக்கும் மரபுத்தொடர்.
    reason: மூல எபிரெய உருவகத்தையும் அதன் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: אִם
  choice: செய்திருந்தால்
  rationale: இது நிபந்தனையை அறிமுகப்படுத்தும் எபிரெயச் சொல். பில்தாத் முன்வைக்கும் கூற்றின் நிபந்தனைத் தன்மையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בָּנֶיךָ
  choice: உன் மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் ‘மகன்கள்’ என்று குறிப்பாக உள்ளது; ஆகவே பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அதே பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: חָטְאוּ לוֹ
  choice: அவருக்கு எதிராகப் பாவம் செய்திருந்தால்
  rationale: חטא உடன் வரும் ל பாதிக்கப்பட்டவரைக் குறிக்க முடியும். தமிழில் ‘அவருக்கு எதிராகப் பாவம் செய்தல்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘அவர்’ என்ற பிரதிப்பெயர் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וַיְשַׁלְּחֵם
  choice: அவர் அவர்களை ஒப்புக்கொடுத்தார்
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’; ஆனால் தொடர்ந்து வரும் ‘கையில்’ என்ற மரபுத்தொடருடன், ஒருவரை ஒரு சக்தியின் வசம் ஒப்புக்கொடுப்பதைக் குறிக்கிறது.
- source_word: בְּיַד
  choice: அதிகாரத்துக்கு
  rationale: ‘கையில்’ என்பது ஒருவரின் ஆளுகை அல்லது அதிகாரத்தின் கீழ் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழுக்காக அதன் பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פִּשְׁעָם
  choice: அவர்களுடைய மீறுதல்
  rationale: פשע என்பது பொதுவான பாவத்தைக் காட்டிலும் எதிர்ப்போடு கூடிய வரம்புமீறலைக் குறிக்கக்கூடும். முன்பு வரும் חטא என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டைப் ‘மீறுதல்’ பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவர்’ என்ற பிரதிப்பெயரின் குறிப்பு
  choice: ‘அவர்’ என்ற பிரதிப்பெயரை அப்படியே வைத்து, சூழலில் அது கடவுளைக் குறிப்பதாக விடப்பட்டுள்ளது.
  alternative: ‘கடவுளுக்கு எதிராக’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: சூழல் கடவுளையே வலுவாகச் சுட்டினாலும், எபிரெய மூலத்தில் பெயருக்குப் பதிலாக பிரதிப்பெயரே உள்ளது. அதைத் தக்கவைப்பது மூலத்தின் சொல்வடிவத்தையும் சிறிய அளவிலான உரையாடல் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: மீறுதலுக்கும் விளைவுக்கும் இடையிலான உறவு
  choice: கடவுள் அவர்களை அவர்களுடைய சொந்த மீறுதலின் அதிகாரத்துக்கு ஒப்புக்கொடுத்தார் என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது.
  alternative: ‘அவர்களுடைய மீறுதலுக்காக அவர்களைத் தண்டித்தார்’ என்று காரணத்தையும் தண்டனையையும் நேரடியாக விளக்குதல்.
  rationale: மூலவசனம் தண்டனையின் தன்மையை விரிவாக வரையறுக்காமல், தெய்வீகச் செயலையும் அவர்களுடைய மீறுதலின் ஆற்றலையும் ஒன்றாகக் காட்டுகிறது. விளக்கமான மாற்று தேவையற்ற இறையியல் முடிவைச் சேர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்’ என்பது எபிரெய ஒருமை முன்னிலையைத் துல்லியமாகக் காட்டுகிறது; ‘மகன்கள்,’ ‘பாவம்,’ ‘மீறுதல்,’ ‘ஒப்புக்கொடுத்தார்’ ஆகியவை பொதுவாகப் புரியும் வேதாகமச் சூழலுக்கேற்ற சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
