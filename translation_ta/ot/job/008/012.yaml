translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இளந்தளிர்’ தாவரப் படிமத்தைத் தக்கவைக்கிறது; ‘வாடிவிடுகிறது’ இயல்பான தமிழ் பயன்பாட்டை வழங்குகிறது. மூலத்தின் ஒப்பீட்டு அமைப்பும் இரு உண்மையான சொற்பொருள் மாற்றுகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
