source:
  edition: WLC
  text: עֹדֶ֣/נּוּ בְ֭/אִבּ/וֹ לֹ֣א יִקָּטֵ֑ף וְ/לִ/פְנֵ֖י כָל חָצִ֣יר יִיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: ta
  text: அது இன்னும் தன் இளந்தளிர் நிலையிலிருக்கும்போதே[a], அறுக்கப்படாமலே[b], மற்ற எல்லாப் புற்களும் உலர்வதற்கு முன்பே உலர்ந்துவிடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் பசுமையிலேயே” அல்லது “தன் மொட்டிலேயே.” எபிரெயச் சொல் தாவரத்தின் பசுமையான புதிய வளர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பறிக்கப்படாமலே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: அது இன்னும் ... இருக்கும்போதும்
  rationale: தாவரத்தின் நிலை தொடர்ந்து கொண்டிருப்பதை 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் வினையடை குறிக்கிறது; தமிழில் காலநிலைத் துணைவாக்கியமாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: בְאִבּוֹ
  choice: தன் இளந்தளிரிலேயே
  rationale: אֵב/אִב என்பது பசுமையான புதிய வளர்ச்சி, தளிர் அல்லது மொட்டைக் குறிக்கலாம். சூழலின் தாவரவியல் படிமத்தைத் தெளிவாகவும் இயல்பாகவும் காக்க ‘இளந்தளிர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא יִקָּטֵף
  choice: அறுக்கப்படாமலேயே
  rationale: קטף என்பதன் நிஃபால் வடிவம் அறுக்கப்படுதல் அல்லது பறிக்கப்படுதல் என்ற செயப்பாட்டு பொருளைக் கொண்டது. புல்/நாணல் படிமத்தில் ‘அறுக்கப்படுதல்’ இயல்பானது; ‘பறிக்கப்படுதல்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלִפְנֵי
  choice: முன்னதாக
  rationale: 'இங்கு கால ஒப்பீட்டைச் சுட்டுகிறது: மற்ற புல் வாடுவதற்கு முன்பே இது வாடுகிறது. தமிழில் ‘முன்னதாக’ அந்த ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.'
- source_word: כָל חָצִיר
  choice: மற்ற எந்தப் புல்லையும்விட
  rationale: சூழலில் இது ஒப்பீட்டுப் பொருளுடையது. ‘மற்ற’ என்பது பேசப்படும் தாவரத்தையும் பொதுவான புல்லையும் தெளிவாக வேறுபடுத்துகிறது; ‘எந்தப் ... விட’ כָל என்பதன் பரவலான ஒப்பீட்டு வலிமையைத் தருகிறது.
- source_word: יִיבָשׁ
  choice: வாடிவிடுகிறது
  rationale: יבש என்பது உலர்தல் அல்லது வாடுதல் எனப் பொருள்படும். உயிருள்ள தாவரத்தைப் பற்றிய நவீனத் தமிழில் ‘வாடிவிடுகிறது’ இயல்பாக உள்ளது; நீர் சார்ந்த படிமத்தில் ‘உலர்ந்துவிடுகிறது’ என்பதும் சாத்தியம்.
