  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: ta
  text: ஏனெனில், முந்தைய தலைமுறையிடம் கேள்; அவர்களுடைய தந்தையர்[b] ஆராய்ந்து கண்டவற்றில்[a] மனதைச் செலுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய தந்தையரின் ஆராய்ச்சியில்.” எபிரெயப் பெயர்ச்சொல் ஆராயும் செயலையோ அதன் மூலம் கண்டறியப்பட்டவற்றையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தந்தையர்” என்பதை விரிவான பொருளில் “முன்னோர்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு ஆதாரம் தரும் உரையாடல் இணைப்பாக இங்கு வருகிறது.
- source_word: שְׁאַל נָא
  choice: தயவுசெய்து ... விசாரித்துப் பார்
  rationale: שׁאל என்பது கேட்பது அல்லது விசாரிப்பது; נָא கட்டளையைப் பணிவான வேண்டுகோளாக்குகிறது.
- source_word: לְדֹר רִישׁוֹן
  choice: முந்தைய தலைமுறையினரிடம்
  rationale: רִאשׁוֹן இங்கு முற்காலத்தவர்களைக் குறிக்கிறது; முற்றிலும் முதலாவது தலைமுறையை அவசியமாகக் குறிக்காது.
- source_word: וְכוֹנֵן
  choice: கவனமாகச் சிந்தித்துப் பார்
  rationale: ஒரு பொருளை நோக்கித் தன்னை நிலைப்படுத்தி, அதில் கவனம் செலுத்தும் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לְחֵקֶר
  choice: ஆராய்ந்து கண்டவற்றை
  rationale: חֵקֶר என்பது ஆராயும் செயலையோ அதன் மூலம் கண்டறியப்பட்டவற்றையோ குறிக்கலாம்; சூழலில் முன்னோரின் திரட்டப்பட்ட அறிவைச் சுட்டும் முடிவுப்பொருள் இயல்பாக உள்ளது.
- source_word: אֲבוֹתָם
  choice: அவர்களுடைய தந்தையர்
  rationale: எபிரெயச் சொல்லின் தந்தையர் என்ற வடிவத்தையும், அது முந்தைய தலைமுறையினரின் முன்னோரைச் சுட்டுவதையும் காக்கிறது.
