  register: நவீன நிலையான தமிழில், இயல்பான இரட்டை வினா அமைப்புடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயர்ந்து வளருமா / செழித்து வளருமா’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் பொருள் ஒற்றுமையையும் வினைச்சொல் வேறுபாட்டையும் காக்கிறது.
