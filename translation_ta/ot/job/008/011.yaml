source:
  edition: WLC
  text: הֲ/יִֽגְאֶה גֹּ֭מֶא בְּ/לֹ֣א בִצָּ֑ה יִשְׂגֶּה אָ֥חוּ בְלִי מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/011.yaml
  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: ta
  text: சதுப்புநிலம் இல்லாமல் பாப்பிரஸ் செடி உயர்ந்து வளருமா? தண்ணீர் இல்லாமல் நாணற்புல் செழித்து வளருமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாப்பிரஸ் செடி’ என்பதற்கு ‘கோரை’ என்றும், ‘நாணற்புல்’ என்பதற்கு ‘நாணல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் இணைவரிகளாக இரண்டு சதுப்புநிலத் தாவரங்கள் குறிப்பிடப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִגְאֶה
  choice: உயர்ந்து வளருமா?
  rationale: கேள்வியிடைச்சொல் வினாவை அறிமுகப்படுத்துகிறது; இங்கு גאה தாவரத்தின் மேல்நோக்கிய வளர்ச்சியைக் குறிக்கிறது. ‘உயர்ந்து வளர்’ என்பது அதன் அடிப்படைப் படிமத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: גֹּמֶא
  choice: பாப்பிரஸ் செடி
  rationale: இந்தச் சொல் சதுப்புநிலத்தில் வளரும் பாப்பிரஸ் வகை நாணற்செடியையே பெரும்பாலும் குறிக்கிறது. தமிழில் அறிமுகமில்லாதிருக்கக்கூடிய பெயரை ‘செடி’ என்பதுடன் கொடுத்திருப்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּלֹא בִצָּה
  choice: சதுப்புநிலம் இல்லாமல்
  rationale: בלא இல்லாமையையும் ביצה சதுப்பு அல்லது சேற்றுநிலத்தையும் குறிக்கின்றன. இக்கூற்று எபிரெய இணைப்பை நேரடியாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: יִשְׂגֶּה
  choice: செழித்து வளருமா?
  rationale: שׂגה இங்கு மிகுதியாக அல்லது நன்கு வளர்வதைக் குறிக்கிறது; ‘செழித்து வளர்’ தாவர வளர்ச்சியின் வலிமையையும் இணைவரியின் வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: אָחוּ
  choice: நாணற்புல்
  rationale: இது நீர்நிலையோ சதுப்புநிலையோ சார்ந்து வளரும் புல் அல்லது நாணல் வகைத் தாவரத்தைக் குறிக்கிறது. துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றதால், இயல்பான பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: בְלִי מָיִם
  choice: தண்ணீர் இல்லாமல்
  rationale: நீரின்மையை நேரடியாகக் குறிக்கும் சொற்றொடர். ‘தண்ணீர்’ என்பது சாதாரண நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
