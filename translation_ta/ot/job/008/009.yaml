base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: ta
  text: ஏனெனில், நாம் நேற்றையவர்களே[a]; நாம் அறியோம்; ஏனெனில், பூமியில் நம் நாட்கள் ஒரு நிழல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, நாம் மிக அண்மையில் தோன்றியவர்கள்; ஆகவே நம் அறிவு வரம்புக்குட்பட்டது. ‘நாம் நேற்றுத்தான் தோன்றியவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ‘நேற்றையவர்கள்’ என்ற எபிரெய மொழிநடையின் பொருளையும் இயல்பான தமிழ் மாற்றையும் விளக்குகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பில்தாதின் முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: நாம் நேற்றையவர்களே
  rationale: மனிதர்கள் மிக அண்மையில் தோன்றியவர்கள் என்பதைக் குறிக்கும் ‘நேற்று’ என்ற எபிரெய உருவகத்தை நேரடியாகவும் கவித்துவமாகவும் காக்கிறது.
- source_word: וְלֹא נֵדָע
  choice: நாம் அறியோம்
  rationale: எதை அறியோம் என்று மூலத்தில் குறிப்பிடப்படாததால், தேவையற்ற செயப்படுபொருளைச் சேர்க்காமல் எதிர்மறை வினையைச் சுருக்கமாக மொழிபெயர்க்கிறது.
- source_word: כִּי
  choice: (தமிழ் வாக்கிய அமைப்பில் தனியே மீளுரைக்கப்படவில்லை)
  rationale: இரண்டாவது כִּי மனித அறியாமைக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் அரைப்புள்ளிக்குப் பின் வரும் இறுதி வாக்கியம் அதே காரண உறவை இயல்பாக வெளிப்படுத்துவதால், ‘ஏனெனில்’ என்பதை மீண்டும் கூறுவது தவிர்க்கப்பட்டது.
- source_word: צֵל
  choice: ஒரு நிழல்
  rationale: மனித வாழ்வின் நிலையாமையையும் குறுகிய காலத்தையும் உணர்த்தும் மூல உருவகத்தை அப்படியே காக்கிறது.
- source_word: יָמֵינוּ
  choice: நம் நாட்கள்
  rationale: முதல் நபர் பன்மை உடைமை வடிவத்தை நேரடியாகக் காக்கிறது.
- source_word: עֲלֵי אָרֶץ
  choice: பூமியில்
  rationale: மனித வாழ்வு நிகழும் இடத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
