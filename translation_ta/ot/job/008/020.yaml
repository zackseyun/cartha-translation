source:
  edition: WLC
  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: ta
  text: 'இதோ, கடவுள் குற்றமற்றவரை ஒதுக்கித் தள்ளமாட்டார்;

    தீமை செய்கிறவர்களின் கையைப் பற்றிக்கொள்ளவும் மாட்டார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை செய்கிறவர்களை ஆதரிக்கவும் மாட்டார்”; இன்னும் சொற்சொல்லாக, “தீமை செய்கிறவர்களின் கையைப் பிடிக்கவும் மாட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயச் சொல்லின் உயர்ந்த கவிதைத் தொனியைத் தக்கவைக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இது கடவுளைக் குறிக்கும் பொதுவான கவிதைச் சொல்; ‘சர்வவல்லவர்’ போன்ற மூலத்தில் இல்லாத பொருளைச் சேர்க்கவில்லை.
- source_word: יִמְאַס
  choice: ஒதுக்கித் தள்ளமாட்டார்
  rationale: மָאַס என்பதன் மறுத்தல் அல்லது ஏற்காமல் தள்ளுதல் என்ற உறவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; வெறுப்பு என்ற உணர்ச்சியைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: תָּם
  choice: குற்றமற்றவரை
  rationale: முழுமை, நேர்மை, குற்றமின்மை ஆகிய பொருள் வட்டத்தைச் சேர்ந்த இச்சொல்லை, இங்கு பெயர்ச்சொல்லாகப் பயன்படும் பொதுவான ஒருமை வடிவத்துக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: יַחֲזִיק בְּיַד
  choice: கையைப் பற்றிக்கொள்ள
  rationale: ‘கையைப் பற்றுதல்’ என்ற மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; அதேவேளையில் உதவுதல் அல்லது ஆதரித்தல் என்ற உட்பொருளையும் வாசகர் உணர இடமளிக்கிறது.
- source_word: מְרֵעִים
  choice: தீமை செய்கிறவர்கள்
  rationale: தீமை செய்வதில் ஈடுபடுகிறவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தின் செயற்பாட்டுப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְלֹא יַחֲזִיק בְּיַד מְרֵעִים என்ற சொற்றொடரின் பொருள்
  choice: தீமை செய்கிறவர்களின் கையைப் பற்றிக்கொள்ளவும் மாட்டார்
  alternative: தீமை செய்கிறவர்களை ஆதரிக்கவும் மாட்டார் / அவர்களுடைய கையை வலுப்படுத்தவும் மாட்டார்
  rationale: முதன்மை உரை மூலத்தின் தெளிவான கை உருவகத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு அதன் ஆதரித்தல் அல்லது உதவுதல் என்ற மறைபொருளைக் காட்டுகிறது; இதனால் ஒரு பொருளை மட்டும் இறுதியானதாகத் தீர்மானிப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும், கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் வாக்கியத்தின் வலியுறுத்தலைக் காக்கிறது; இரண்டாம் அடியில் மூலத்தின் கை உருவகம் பாதுகாக்கப்பட்டுள்ளது.
