  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: ta
  text: அவர்கள் உனக்குப் போதித்து, உன்னிடம் சொல்லி, தங்கள் உள்ளத்திலிருந்து வார்த்தைகளை வெளிப்படுத்த மாட்டார்களா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கள் மனத்திலிருந்து’ அல்லது ‘தங்கள் அகத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் ‘உள்ளம்’ என்பது உணர்வுகளோடு சிந்தனையின் மையத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: மாட்டார்களா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழில் இயல்பான எதிர்மறை வினாவாகப் பேணுகிறது.
- source_word: הֵם
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட முற்காலத் தலைமுறையினரைக் குறிக்கும் பன்மைப் பதிலிப்பெயர்.
- source_word: יוֹרוּךָ
  choice: உனக்குப் போதித்து
  rationale: ירה என்பதன் ஹிஃபீல் வடிவம் இங்கு கற்பித்தல் அல்லது போதித்தல் என்ற பொருளைத் தருகிறது; ஞான இலக்கியச் சூழலுக்கு ஏற்றது.
- source_word: יֹאמְרוּ לָךְ
  choice: உன்னிடம் சொல்லி
  rationale: אמר என்பதன் அடிப்படைப் பேச்சுப் பொருளையும் לָךְ என்பதன் தொடர்பையும் தெளிவாகப் பேணுகிறது.
- source_word: וּמִלִּבָּם
  choice: தங்கள் உள்ளத்திலிருந்து
  rationale: לֵבָב குறிக்கும் உள்ளார்ந்த சிந்தனை மற்றும் உணர்வின் மையத்தை, தமிழில் இயல்பாகவும் விரிந்த பொருளுடனும் தெரிவிக்கிறது.
- source_word: יוֹצִיאוּ
  choice: வெளிப்படுத்த
  rationale: יצא என்பதன் ஹிஃபீல் வடிவிலுள்ள ‘வெளியே கொண்டுவருதல்’ என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִלִּים
  choice: வார்த்தைகளை
  rationale: பேசப்படும் சொற்கள் அல்லது கூற்றுகள் என்ற நேரடிப் பொருளைத் தருகிறது.
