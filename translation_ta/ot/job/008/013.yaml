source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: ta
  text: கடவுளை மறந்துவிடுகிற எல்லாருடைய வழிகளும் இப்படித்தான்; இறைபக்தியற்றவனின்[a] நம்பிக்கை அழிந்துபோகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாசாங்குக்காரனின்.” எபிரெயச் சொல் இறைபக்தியற்ற அல்லது இறைமரியாதையற்ற ஒருவரைக் குறிக்கலாம்; இச்சூழலில் “இறைபக்தியற்றவன்” பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: இப்படித்தான்
  rationale: முந்தைய உருவகத்திலிருந்து வரும் ஒப்பீடும் முடிவுரையும் இயல்பான தமிழில் தெளிவாக வெளிப்படுகின்றன.
- source_word: אָרְחוֹת
  choice: வழிகள்
  rationale: வாழ்க்கைப் போக்கைக் குறிக்கும் பன்மை உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: שֹׁכְחֵי אֵל
  choice: கடவுளை மறந்துபோகிற எல்லாரும்
  rationale: எபிரெயப் பங்கேற்பு வடிவை இயல்பான தொடர்புத் தொடராகத் தருகிறது; אֵל இங்கு பொதுவான இறைப் பட்டம் என்பதால் ‘கடவுள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: תִקְוַת
  choice: நம்பிக்கை
  rationale: எதிர்பார்ப்பு அல்லது நம்பிக்கை என்னும் பொருள்களில், இச்சூழலில் ‘நம்பிக்கை’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: חָנֵף
  choice: இறைப்பற்றற்றவன்
  rationale: யோபு நூலில் இச்சொல் வெறும் பாசாங்குக்காரனைவிட இறைமறுப்பான அல்லது பக்தியற்ற நபரைக் குறிக்கும் பரந்த அறநெறி-சமயப் பொருளைக் கொண்டுள்ளது.
- source_word: תֹּאבֵד
  choice: அழிந்துபோகும்
  rationale: אבד வேர்ச்சொல்லின் அழிவு அல்லது இல்லாமற்போதல் என்ற வலிமையைத் தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஞான இலக்கியத்தின் நியாயத்தீர்ப்புச் சூழலில் חָנֵף என்பதன் பொருள்
  choice: இறைப்பற்றற்றவன்
  alternative: வேடதாரி / பாசாங்குக்காரன்
  rationale: இச்சொல் யோபு நூலில் பொதுவாக இறைபக்தியற்ற அல்லது நெறிகெட்ட நபரைச் சுட்டுகிறது. ‘பாசாங்குக்காரன்’ என்பது அதன் பொருளை வெளித்தோற்ற நடிப்பாக மட்டும் குறுக்கக்கூடும்; ஆகவே பரந்த அறநெறி-சமயப் பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் ஞான இலக்கியத்திற்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் பன்மையான ‘வழிகள்’ மற்றும் ஒருமையான பொதுப்படையான ‘இறைப்பற்றற்றவன்’ ஆகியவை காக்கப்பட்டுள்ளன.
