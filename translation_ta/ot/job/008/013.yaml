    reason: lexical_alternative
  revision_rationale: The revision retains the source’s syntax and imagery while improving modern Tamil idiom. It renders חָנֵף as ‘இறைபக்தியற்றவன்,’ preserving its broader impious/godless sense, and gives ‘பாசாங்குக்காரன்’ only as a footnoted alternative.
