source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: ta
  text: கடவுள் நியாயத்தை வளைப்பாரா[a]? அல்லது எல்லாம் வல்லவர் நீதியை வளைப்பாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தீர்ப்பைத் திரிப்பாரா? அல்லது எல்லாம் வல்லவர் நேர்மையைத் திரிப்பாரா?”
    reason: மִשְׁפָּט (‘தீர்ப்பு/நியாயம்’), צֶדֶק (‘நீதி/நேர்மை’), மற்றும் יְעַוֵּת (‘வளைத்தல்/திரித்தல்’) ஆகியவற்றின் சட்ட-ஒழுக்கச் சொற்பொருள் மாற்றுகளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: הַאֵל
  choice: கடவுள் ... புரட்டுவாரா?
  rationale: வினாவைக் குறிக்கும் הַ மற்றும் பொதுவான இறைப் பட்டமான אֵל ஆகியவற்றை இயல்பான தமிழ் ஆம்/இல்லை வினாவாக மொழிபெயர்க்கிறது; இங்கு אֵל தனிப்பெயராக ஒலிபெயர்க்கப்படவில்லை.
- source_word: יְעַוֵּת
  choice: புரட்டுவாரா
  rationale: עוה என்பதன் பியேல் வடிவம் ஒன்றைக் கோணலாக்குதல், சிதைத்தல் என்ற வலுவான சட்ட-ஒழுக்கப் பொருளைக் கொண்டது. ‘புரட்டுதல்’ நீதி நெறியைத் தவறாக்கும் செயலை இயல்பாகவும் வலுவாகவும் தெரிவிக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இச்சூழலில் மִשְׁפָּט நியாயமான தீர்ப்பு அல்லது சட்ட-ஒழுக்கத் தரமான நீதியைக் குறிக்கிறது; ‘நீதி’ நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וְאִם
  choice: அல்லது
  rationale: சொல்லளவில் ‘மேலும்/அப்படியானால்’ என்ற அமைப்பு இருந்தாலும், இணையான இரு வினாக்களில் இது இரண்டாவது மாற்று வினாவை அறிமுகப்படுத்துகிறது; தமிழில் ‘அல்லது’ அந்தச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: שַׁדַּי இங்கு இறைப் பட்டமாக வருகிறது. ஒலிபெயர்ப்பதற்குப் பதிலாக அதன் வழக்கமான பொருளைத் தரும் மரியாதைமிக்க தமிழ்ப் பட்டம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: צֶדֶק
  choice: நேர்மை
  rationale: צֶדֶק நீதி, நேர்மை, சரியானது ஆகிய பொருள்களை உடையது. இணையான முதல் அடியின் מִשְׁפָּט என்பதிலிருந்து சொல்வேறுபாட்டைப் பாதுகாத்தபடி அதன் ஒழுக்க-நீதிசார் பரப்பை ‘நேர்மை’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵל மற்றும் שַׁדַּי என்ற இணையான இறைப் பட்டங்களை மொழிபெயர்த்தல்
  choice: கடவுள் ... எல்லாம் வல்லவர்
  alternative: ஏல் ... ஷத்தாய்
  rationale: இச்சூழலில் இரண்டும் தனிப்பெயர்களாக அல்ல, இறைவனைக் குறிக்கும் பட்டங்களாகச் செயல்படுகின்றன. பொருளை மொழிபெயர்ப்பது கவிதை இணைநிலையையும் சாதாரண வாசகருக்கான தெளிவையும் காக்கிறது.
- issue: מִשְׁפָּט மற்றும் צֶדֶק இடையிலான வேறுபாட்டைக் காத்தல்
  choice: நீதி ... நேர்மை
  alternative: நீதி ... நீதி; தீர்ப்பு ... நீதி
  rationale: எபிரெய வசனம் தொடர்புடைய ஆனால் ஒரே மாதிரியல்லாத இரண்டு சட்ட-ஒழுக்கச் சொற்களை இணையாகப் பயன்படுத்துகிறது. தனித்த தமிழ்ச் சொற்கள் நீதித்தீர்ப்பு சார்ந்த பரப்பையும் ஒழுக்க நேர்மை சார்ந்த பரப்பையும் ஒன்றாக்காமல் காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க கவிதை-வினா நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. இரு இணையான அடிகளின் சொல்லமைப்பும் வினாவியல் வலிமையும் காக்கப்பட்டுள்ளன; அரிதான ஒலிபெயர்க்கப்பட்ட இறைப் பட்டங்கள் தவிர்க்கப்பட்டுள்ளன.
