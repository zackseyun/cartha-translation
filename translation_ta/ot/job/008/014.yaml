  text: אֲשֶׁר יָק֥וֹט כִּסְל֑/וֹ וּ/בֵ֥ית עַ֝כָּבִ֗ישׁ מִבְטַחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/014.yaml
  text: whose confidence is cut off[c][b][a], and whose trust is a spider’s house.
translation:
  language: ta
  text: அவனுடைய நம்பிக்கை[a] அறுந்துபோகும்[b]; அவன் நம்பியிருப்பதோ சிலந்தியின் வீடு[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய எதிர்பார்ப்பு’; இங்குள்ள எபிரெயப் பெயர்ச்சொல் நம்பிக்கை, எதிர்பார்ப்பு அல்லது பாதுகாப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அறுந்துபோகும்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினை அரிதானதும் பொருள் விவாதத்திற்குரியதுமாகும்; ‘துண்டிக்கப்படும்’ என்ற நுண்பொருளும், இங்கு பொருந்துவதற்கான வாய்ப்பு குறைவாக இருந்தாலும் ‘வெறுக்கப்படும்’ என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அவன் நம்பியிருப்பது சிலந்தி வலையைப் போல எளிதில் சிதைந்துபோகக்கூடியது. எபிரெயம் அதை ‘சிலந்தியின் வீடு’ என்று அழைக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவனுடைய
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இறைநெறியற்றவனோடு இந்த உறவுச்சொல் வாக்கியத்தை இணைக்கிறது. தொடர்ச்சியான தமிழில் உடைமை வடிவம் இயல்பாக உள்ளது.
- source_word: יָקוֹט
  choice: அறுந்துபோகும்
  rationale: அரிதானதும் பொருள் விவாதத்திற்குரியதுமான இந்த வினை, இச்சூழலில் நம்பிக்கையின் ஆதாரம் துண்டிக்கப்பட்டு இல்லாமற்போவதைக் குறிக்கிறது. அதன் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּסְלוֹ
  choice: அவனுடைய நம்பிக்கை
  rationale: இங்கு அடுத்த அரையடியில் வரும் מִבְטַחוֹ என்பதற்கு இணையாக, நம்பிக்கை அல்லது பாதுகாப்பு உணர்வைக் குறிக்கிறது; ‘இடுப்பு’ அல்லது ‘மடமை’ என்ற வேறு சூழல்சார் பொருள்கள் இங்கு பொருந்தாது.
- source_word: וּבֵית
  choice: வீடு
  rationale: இணையான இரண்டாம் அரையடியை அறிமுகப்படுத்தும் சொல்லின் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. தமிழில் ‘வீடு’ என்பது எளிமையாகவும் புரியத்தக்கதாகவும் உள்ளது.
- source_word: עַכָּבִישׁ
  choice: சிலந்தியின்
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מִבְטַחוֹ
  choice: அவன் நம்பியிருப்பது
  rationale: இச்சொல் நம்பிக்கையையே மட்டுமல்ல, ஒருவர் நம்பியிருக்கும் பொருள் அல்லது ஆதாரத்தையும் குறிக்கலாம். இங்கு சிலந்தியின் வீட்டோடு அடையாளப்படுத்தப்படும் நம்பிக்கையின் ஆதாரத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
