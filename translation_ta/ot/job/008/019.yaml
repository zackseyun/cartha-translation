source:
  edition: WLC
  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: ta
  text: இதோ[a], இதுவே அவனுடைய வழியின் மகிழ்ச்சி; புழுதியிலிருந்து மற்றவை துளிர்க்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனே தன் வழியின் மகிழ்ச்சி.” எபிரெயச் சுட்டுப்பெயரை ஒருவரைக் குறிப்பதாகவும் வாசிக்கலாம்; ஆனால் முன்பு கூறப்பட்ட தாவரத்தின் நிலையைத் தொகுத்துரைப்பதாகச் சூழல் வாசிக்க இடமளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வேறொன்று புழுதியிலிருந்து துளிர்க்கும்.” எபிரெயில் “வேறொன்று” என்ற சொல் ஒருமையாக இருக்கலாம்; ஆனால் வினைச்சொல் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவிதையில் கவனத்தை ஈர்த்து, வலியுறுத்தும் உரையாடல் இடைச்சொல்லின் ஆற்றலை இயல்பான தமிழில் காக்கிறது.
- source_word: הוּא
  choice: இதுவே
  rationale: இலக்கண வடிவில் ஆண்பால் ஒருமைச் சுட்டுப்பெயராக இருந்தாலும், முன்பு விவரிக்கப்பட்ட தாவரத்தின் நிலை அல்லது முடிவைச் சுட்டும் தொகுப்புரையாக வாசிக்க இயலும்; ‘இதுவே’ அந்தச் சுட்டுத்தன்மையைத் தமிழில் இயல்பாகத் தருகிறது. தனிநபரைக் குறிக்கும் வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מְשׂוֹשׂ
  choice: மகிழ்ச்சி
  rationale: மகிழ்ச்சி அல்லது களிப்பு என்னும் பெயர்ச்சொல் பொருளை நேரடியாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: דַּרְכּוֹ
  choice: அவனுடைய வழி
  rationale: דרך என்பதன் வழி, பாதை, போக்கு ஆகிய நேரடி மற்றும் உருவகப் பொருள் பரப்பை ‘வழி’ காக்கிறது; உடைமைப் பின்னொட்டை ‘அவனுடைய’ என வெளிப்படுத்துகிறது.
- source_word: וּמֵעָפָר
  choice: புழுதியிலிருந்து
  rationale: מן + עפר காட்டும் தோற்றுவாயைத் தெளிவாகத் தருகிறது; ‘புழுதி’ வேதாகமக் கவிதைத் தொனியையும் தாவர உருவகத்தையும் காக்கிறது.
- source_word: אַחֵר
  choice: மற்றவர்கள்
  rationale: சொல் வடிவம் ஒருமையாக இருக்கக்கூடியபோதிலும், அதனுடன் வரும் יִצְמָחוּ பன்மை வினைச்சொல் என்பதால் பன்மை மொழிபெயர்ப்பு வாக்கிய ஒத்திசைவையும் மாற்றாக எழுவோர் என்ற பொருளையும் காக்கிறது.
- source_word: יִצְמָחוּ
  choice: துளிர்ப்பார்கள்
  rationale: צמח என்பதன் தாவர முளைத்தல் அல்லது வளர்தல் என்ற உருவகத்தைத் தெளிவாகக் காக்கிறது. எழுவோர் மனிதர்களாகவும் கருத்தாக்கப்படுவதால் தமிழ் உயர்திணைப் பன்மை விகுதி இயல்பாக அமைகிறது.
theological_decisions:
- issue: הוּא என்பது ஒருவரைக் குறிக்கிறதா, முன் கூறிய நிலையைச் சுட்டுகிறதா?
  choice: முதன்மை உரையில் ‘இதுவே’ என நிலையைச் சுட்டும் தொகுப்புரையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவனே தன் வழியின் மகிழ்ச்சி’ என்று தனிநபரைக் குறிக்கும் வாசிப்பு.
  rationale: முந்தைய வசனங்களின் தாவர உருவகத்தையும் அதன் முடிவையும் தொகுத்துச் சொல்வதாகச் சூழல் ஆதரிக்கிறது; ஆயினும் எபிரெயச் சுட்டுப்பெயரின் தனிப்பட்ட வாசிப்பு உண்மையான மாற்றுவாய்ப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אַחֵר என்ற ஒருமை வடிவத்துக்கும் יִצְמָחוּ என்ற பன்மை வினைக்கும் இடையிலான பதற்றம்
  choice: பன்மை வினைக்கேற்ப ‘மற்றவர்கள் துளிர்ப்பார்கள்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வேறொருவன் புழுதியிலிருந்து துளிர்ப்பான்’ என்ற ஒருமை வாசிப்பு.
  rationale: எபிரெய வினை வெளிப்படையாகப் பன்மையில் இருப்பதால் முதன்மை உரையில் அதற்கு முன்னுரிமை அளிக்கப்படுகிறது; பெயரடையின் ஒருமை வடிவம் அனுமதிக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ,’ ‘வழி,’ ‘புழுதி,’ ‘துளிர்’ ஆகியவை மூலத்தின் கவிதை உருவகத்தையும் கவன ஈர்ப்பையும் காக்கின்றன. மூலத்தில் உள்ள சுட்டுப்பெயர் மற்றும் எண்ணிக்கை சார்ந்த தெளிவின்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
