  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: ta
  text: நீ தூயவனாகவும் நேர்மையானவனாகவும் இருந்தால், நிச்சயமாக இப்போதே அவர் உனக்காக விழித்தெழுந்து[a], உன் நீதியான உறைவிடத்தை மீண்டும் நிலைநிறுத்துவார்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உனக்காக எழுவார்” அல்லது “உன் சார்பாகச் செயல்படத் தம்மைத் தூண்டிக்கொள்வார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழுமையாக்குவார்” அல்லது “ஈடுசெய்வார்”; எபிரெய வினைச்சொல் மீட்டமைத்தல் அல்லது முழுமையாக்குதல் என்ற பொருள்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “உன் நீதியின் உறைவிடம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: பில்தாதின் நிபந்தனைக் கூற்றை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: זַךְ
  choice: தூயவன்
  rationale: ஞான இலக்கியச் சூழலில் ஒழுக்கத் தூய்மையைக் குறிக்கிறது; குற்றமற்றவன் என்று அளவுக்கு மீறி நீதிமன்றப் பொருள் கொடுப்பதைத் தவிர்க்கிறது.
- source_word: יָשָׁר
  choice: நேர்மையானவன்
  rationale: ஒழுக்க நேர்மையைக் குறிக்கும் பொதுவான ஞான இலக்கியச் சொல்; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּי עַתָּה
  choice: நிச்சயமாக இப்போதே
  rationale: כִּי என்பதன் வலியுறுத்தும் தன்மையையும் עַתָּה என்பதன் உடனடித் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: יָעִיר עָלֶיךָ
  choice: அவர் உனக்காக எழுந்தருளி
  rationale: עור என்பதன் விழித்தெழுதல் அல்லது செயல்பட எழுதல் என்ற உருவகத்தை, தேவனைச் சுட்டும் சூழலுக்கு ஏற்ற கண்ணியமான தமிழில் தருகிறது.
- source_word: וְשִׁלַּם
  choice: மீண்டும் நிலைநிறுத்துவார்
  rationale: Piel வடிவில் உள்ள முழுமையாக்குதல், ஈடுசெய்தல், மீட்டமைத்தல் ஆகிய பொருள் வாய்ப்புகளில், உறைவிடத்தைப் பொருளாகக் கொண்ட இச்சூழலுக்கு மீட்டமைத்தல் பொருள் சிறப்பாகப் பொருந்துகிறது.
- source_word: נְוַת
  choice: உறைவிடம்
  rationale: வசிப்பிடம், இல்லம் அல்லது குடும்ப வாழ்விடம் ஆகிய பரப்பைத் தக்கவைக்கும் இயல்பான தமிழ் இணை.
- source_word: צִדְקֶךָ
  choice: உன் நீதியான
  rationale: ‘உன் நீதியின் உறைவிடம்’ என்ற எபிரெய நேரடி கட்டமைப்பை தமிழில் இயல்பான பெயரடைக் கட்டமைப்பாகத் தருகிறது; அடிப்படைத் தொடர்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: வினைகளின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று வைத்து, சூழலின்படி தேவனைச் சுட்டுமாறு விடுதல்
  alternative: மொழிபெயர்ப்பிலேயே ‘தேவன்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயத்தில் பெயர்ச்சொல் எழுவாய் நேரடியாக இல்லை. சூழலில் தேவனே குறிக்கப்படுகிறார்; ‘அவர்’ என்பது மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் தெளிவைத் தருகிறது.
- issue: பில்தாதின் கூற்றின் இறையியல் வலிமை
  choice: அவரது நிபந்தனைக்குட்பட்ட உறுதியான கூற்றை அப்படியே பிரதிநிதித்துவப்படுத்துதல்
  alternative: பேச்சாளரின் கருத்திலிருந்து கதைசொல்லியை விலக்கிக் காட்டும் மென்மையான பொழிப்புரை
  rationale: இது பில்தாதின் பேச்சு. மொழிபெயர்ப்பு அவரது பதிலளிப்பு நீதிக் கருத்தை ஆதரிக்கவோ முன்கூட்டியே திருத்தவோாமல், அவர் கூறிய வலிமையோடு வழங்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எழுந்தருளி’ என்பது தேவனைச் சுட்டும் சூழலில் மரியாதையையும் மூலத்தின் விழித்தெழுதல் உருவகத்தையும் இணைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
