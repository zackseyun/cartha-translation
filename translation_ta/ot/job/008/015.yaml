base_translation:
  language: en
  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: ta
  text: அவன் தன் வீட்டின்மேல் சாய்ந்துகொள்கிறான்[a]; ஆனால் அது நிற்பதில்லை. அவன் அதை இறுகப் பற்றிக்கொள்கிறான்[b]; ஆனால் அது நிலைத்து நிற்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் தன் வீட்டை நம்பியிருக்கிறான்.’ எபிரெய வினைச்சொல் உடலால் ஒன்றின்மேல் சாய்வதையும், ஆதரவுக்காக அதைச் சார்ந்திருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிற்பதில்லை’ என்றும் ‘நிலைத்து நிற்பதில்லை’ என்றும் வரும் இணையான சொற்றொடர்கள் எபிரெயக் கவிதை அமைப்பைப் பாதுகாக்கின்றன; அவன் சார்ந்திருப்பது உறுதியற்றதாகிவிடுகிறது என்பதே கருத்து.
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: சாய்ந்துகொள்கிறான்
  rationale: שׁען என்பதன் நிபால் வடிவம் ஒன்றின்மேல் உடலைச் சாய்த்துக்கொள்வதையும் அதை ஆதரவாக நம்பியிருப்பதையும் குறிக்கலாம். இங்கே உள்ள தெளிவான உருவகத்தைத் தக்கவைக்க ‘சாய்ந்துகொள்கிறான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: மேல்
  rationale: தொடுதல் அல்லது ஆதரவுக்காக ஒன்றின்மேல் சாய்தல் என்ற இயல்பான தமிழ்ப் பொருளை இது தருகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீடு
  rationale: בַּיִת என்பதன் முதன்மைப் பொருள் ‘வீடு.’ இது ஒருவன் நம்பியிருப்பதைக் குறிப்பதாக உருவகப் பொருள் கொள்ளக்கூடியதாயினும், மூல உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: וְלֹא יַעֲמֹד
  choice: ஆனால் அது நிற்பதில்லை
  rationale: עמד என்பது ‘நில், நிலைத்திரு’ என்று பொருள்படும். பழமொழித் தன்மையுள்ள நிகழ்காலச் சித்திரத்தையும் எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: יַחֲזִיק
  choice: இறுகப் பற்றிக்கொள்கிறான்
  rationale: חזק என்பதன் ஹிபீல் வடிவம் பிடித்துக்கொள்வது அல்லது உறுதியாகப் பற்றிக்கொள்வது என்று பொருள்படலாம். ‘இறுகப் பற்றிக்கொள்கிறான்’ என்பது உடல் செயலின் வலிமையான காட்சியைப் பாதுகாக்கிறது.
- source_word: בּוֹ
  choice: அதை
  rationale: חזק உடன் வரும் ב இங்கே பற்றப்படும் பொருளைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக ‘அதை’ என்பது இயல்பானது.
- source_word: וְלֹא יָקוּם
  choice: ஆனால் அது நிலைத்து நிற்பதில்லை
  rationale: קום என்பது ‘எழு, நிமிர்ந்து நில், நிலைபெறு’ என்று பொருள்படலாம். முந்தைய עמד உடன் இணையான அமைப்பில், வீடு உறுதியாக நிற்கவில்லை என்பதே கருத்து; ‘நிலைத்து நிற்பதில்லை’ அந்த இணையான நிற்றல் உருவகத்தைத் தக்கவைக்கிறது.
