id: JOB.8.22
reference: Job 8:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שֹׂנְאֶ֥י/ךָ יִלְבְּשׁוּ בֹ֑שֶׁת וְ/אֹ֖הֶל רְשָׁעִ֣ים אֵינֶֽ/נּוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: ta
  text: உன்னைப் பகைக்கிறவர்கள் அவமானத்தை ஆடையாக அணிந்துகொள்வார்கள்; பொல்லாதவர்களின் கூடாரம் இனி இராது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “பொல்லாதவர்களின் கூடாரம் இல்லை.”
    reason: אֵינֶנּוּ என்பதன் முறையான நிகழ்கால இருப்பு மறுப்பையும், முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்ட எதிர்கால/விளைவு வாசிப்புக்கு மாற்றாகவும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: உன்னைப் பகைக்கிறவர்கள்
  rationale: Qal செயப்பாட்டு நிகழ்காலப் பெயரெச்சத்தின் பன்மை வடிவமும் இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் தெளிவாகப் பாதுகாக்கப்படுகின்றன. நவீனத் தமிழில் இது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: יִלְבְּשׁוּ
  choice: ஆடையாக அணிந்துகொள்வார்கள்
  rationale: לָבַשׁ என்பதன் அடிப்படைப் பொருள் ‘அணிதல்.’ ‘ஆடையாக’ என்பது மூலத்தில் உள்ள அணிதல் உருவகத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֹשֶׁת
  choice: அவமானம்
  rationale: இந்தச் சொல் தனிப்பட்ட வெட்கத்தையும் வெளிப்படையான இழிவையும் குறிக்கலாம். சூழலில் எதிரிகள் அடையும் பொதுவான இழிவை ‘அவமானம்’ இயல்பாகத் தெரிவிக்கிறது; உணர்ச்சியை மட்டும் குறிக்கும் வகையில் பொருளைக் குறுக்கவில்லை.
- source_word: וְאֹהֶל
  choice: கூடாரம்
  rationale: אֹהֶל என்பதன் நேரடியான கூடாரப் படிமம் பாதுகாக்கப்படுகிறது. இது வீடு அல்லது குடும்பத்தைக் குறிக்கும் ஆகுபெயராகவும் வாசிக்கப்படலாம்; மொழிபெயர்ப்பு அந்த வாய்ப்பை மூடவில்லை.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: பன்மை பெயரடை இங்கு ஒரு வகுப்பினரைச் சுட்டும் பெயர்ச்சொல்லாகச் செயல்படுகிறது. ‘பொல்லாதவர்கள்’ என்பது நவீனத் தமிழில் புரியக்கூடிய, இறையியல் தனிச்சார்பு இல்லாத தெரிவு.
- source_word: אֵינֶנּוּ
  choice: இனி இராது
  rationale: இது இலக்கணரீதியாக ‘அது இல்லை’ என்னும் இருப்பு மறுப்பு. ஆனால் முந்தைய எதிர்கால வினையுடனும் 8:20–22 இன் விளைவு நோக்கிய ஓட்டத்துடனும் சேர்ந்து, தமிழில் ‘இனி இராது’ என இயல்பாக வழங்கப்பட்டுள்ளது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றின் காலப் பொருள்
  choice: 'எதிர்கால/விளைவு நோக்கு: ‘கூடாரம் இனி இராது’'
  alternative: 'நிகழ்கால இருப்பு மறுப்பு: ‘கூடாரம் இல்லை’'
  rationale: אֵינֶנּוּ வடிவம் தனித்து நோக்கினால் நிகழ்கால இருப்பு மறுப்பாக இருக்கலாம். எனினும் வசனத்தின் முதல் பாதியிலுள்ள எதிர்கால வினையும் சுற்றியுள்ள உரையின் முடிவு நோக்கிய ஓட்டமும் எதிர்கால விளைவைச் சுட்டுகின்றன. மூலத்தின் உண்மையான காலத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘அவமானத்தை அணிதல்’ மற்றும் ‘கூடாரம்’ ஆகிய உருவகங்கள் காக்கப்பட்டுள்ளன; ‘ஆடையாக’ என்பது தமிழில் அணிதல் உருவகத்தை இயல்பாக்கும் தெளிவாக்கம்.
