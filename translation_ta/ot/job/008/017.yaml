  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: ta
  text: அவனுடைய வேர்கள் கற்குவியலின்மேல் பின்னிப் படர்கின்றன; கற்களின் ஒரு வீட்டை அவன் காண்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல் வீட்டை அவன் காண்கிறான்”; அல்லது, “கற்களாலான ஓர் இடத்தை அவன் காண்கிறான்”; அல்லது, “கற்களாலான ஓர் இடத்திற்குள் அவன் நோக்குகிறான்.” எபிரேயத் தொடர் சொல்லுக்குச் சொல் “கற்களின் வீடு”; அது கற்களால் ஆன ஒரு கட்டமைப்பையையோ கற்கள் நிறைந்த ஓர் இடத்தையையோ குறிக்கலாம்.
    reason: lexical_alternative
