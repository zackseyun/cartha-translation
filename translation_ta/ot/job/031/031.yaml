- from: என் கூடாரத்து ஆட்கள்[a], “அவருடைய இறைச்சியால்[b] நிறைவடையாதவர் யார்?” என்று சொல்லவில்லை என்றால்—
  to: என் கூடாரத்து ஆட்கள்[a], “அவருடைய இறைச்சியை உண்டு திருப்தியடையாதவர் யார்?” என்று சொல்லவில்லை என்றால்—
  rationale: The revision improves Tamil idiom by stating that people ate the meat and were satisfied, which is the contextual meaning of the Hebrew phrase. The oath’s open conditional structure, the household image, and the source’s third-person possessive remain intact. Footnote b is retained to document the literal Hebrew expression and its contextual sense.
