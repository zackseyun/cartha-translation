lexical_decisions:
- source_word: אִם לֹא
  choice: சொல்லவில்லை என்றால்
  rationale: எபிரெய உறுதிமொழியின் நிபந்தனை வடிவமான ‘இல்லையென்றால்’ என்ற அமைப்பைத் தக்கவைக்கிறது; இவ்வசனம் அடுத்த எண்ணத்தோடு தொடர்புடைய நிறைவுபெறாத உறுதிமொழிக் கூறாக இருப்பதையும் காட்டுகிறது.
- source_word: מְתֵי אָהֳלִי
  choice: என் கூடாரத்து ஆட்கள்
  rationale: ‘என் கூடாரத்தின் மனிதர்கள்’ என்ற நேரடிப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இது யோபின் வீட்டார் அல்லது குடும்ப வட்டத்தாரையும் குறிக்கலாம்.
- source_word: מִי יִתֵּן
  choice: யார்?
  rationale: இங்கு சொற்றொடர் வழக்கமான ‘யார் கொடுப்பார்?’ என்ற விருப்பப் பொருளில் அல்லாமல், ‘அப்படிப்பட்டவர் யார்?’ என்ற வலியுறுத்தும் வினாவாகச் செயல்படுகிறது.
- source_word: מִבְּשָׂרוֹ
  choice: அவருடைய இறைச்சியால்
  rationale: בָּשָׂר என்பதன் உடல் சார்ந்த ‘சதை’ என்ற பொருளைத் தேவையின்றி ஏற்படுத்தாமல், உணவுச் சூழலுக்குரிய ‘இறைச்சி’ என்பதைத் தேர்ந்தெடுக்கிறது; ‘அவருடைய’ என்ற மூன்றாம் நபர் சுட்டையும் பாதுகாக்கிறது.
- source_word: לֹא נִשְׂבָּע
  choice: நிறைவடையாதவர்
  rationale: שׂבע என்பதன் ‘நிறைவு பெறுதல், திருப்தியடைதல்’ என்ற பொருளை உணவு உண்டு நிறைவடையும் இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
