  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: ta
  text: அவனுடைய இடுப்பு எனக்கு வாழ்த்துக் கூறாதிருந்தால்[b], என் செம்மறியாடுகளின் மயிர்த்தொகுதியால்[a] அவன் குளிர்காயாதிருந்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் செம்மறியாடுகளின் வெட்டப்பட்ட கம்பளி மயிரால்.’ எபிரெயப் பெயர்ச்சொல் மயிர்த்தொகுதியையோ வெட்டப்பட்ட கம்பளி மயிரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவனுடைய இடுப்பு.’ இது ஆடை பெற்று வெப்பமடைந்த ஏழையின் உடலைக் குறிக்கும் உடற்கூறு சார்ந்த சொல்லாட்சி.
    reason: lexical_alternative
