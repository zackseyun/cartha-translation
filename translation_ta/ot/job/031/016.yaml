  edition: WLC
  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: ta
  text: ஏழைகள் விரும்பியதை அவர்களுக்குக் கிடைக்கவிடாமல் நான் தடுத்திருந்தாலோ[a], விதவையின் கண்கள் சோர்ந்துபோகச் செய்திருந்தாலோ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழைகளிடமிருந்து அவர்கள் விரும்பியதை நான் தடுத்து வைத்திருந்தாலோ’; சூழலின்படி, ‘ஏழைகளுக்குத் தேவையானதை நான் கொடுக்காமல் இருந்திருந்தாலோ.’
    reason: lexical_alternative
  - marker: b
    text: ‘விதவையின் கண்கள் சோர்ந்துபோகச் செய்தல்’ என்பது நீண்ட காத்திருப்பு, ஏக்கம் அல்லது நிறைவேறாமல் தள்ளிப்போகும் நம்பிக்கையை வெளிப்படுத்தும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: …இருந்தாலோ
  rationale: யோபு 31-இன் நிபந்தனை வடிவிலான தன்னைத் தானே சபிக்கும் உறுதிமொழித் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இணையான இரு குற்றச்சாட்டுகளையும் ‘-ஆலோ’ இணைக்கிறது.
- source_word: אֶמְנַע
  choice: கிடைக்கவிடாமல் நான் தடுத்திருந்தாலோ
  rationale: מנע என்பதன் ‘தடுத்தல், கிடைக்காமல் செய்தல்’ என்ற பொருளைப் பேணுகிறது; கடந்தகால நடத்தையைத் திரும்பிப் பார்க்கும் நிபந்தனை அமைப்புக்கும் பொருந்துகிறது.
- source_word: מֵחֵפֶץ
  choice: விரும்பியதை
  rationale: חֵפֶץ என்பதன் முதன்மையான ‘விருப்பம்/விரும்பியது’ என்ற பொருளைப் பேணுகிறது; சூழலில் அது தேவையானதையும் குறிக்கலாம் என்பதால் அந்த மாற்றுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דַּלִּים
  choice: ஏழைகள்
  rationale: דַּלִּים குறிக்கும் பொருளாதார ரீதியாகத் தாழ்ந்த அல்லது வலுவற்ற மக்களை இச்சமூகநீதி சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: וְעֵינֵי אַלְמָנָה
  choice: விதவையின் கண்களை
  rationale: எபிரேய ஒருமை இங்கு ஒரு சமூகப் பிரிவைப் பிரதிநிதித்துவப்படுத்துகிறது. தமிழில் அடுத்த வினையின் செயப்படுபொருளாக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אֲכַלֶּה
  choice: ஏக்கத்தால் சோர்ந்துபோகச் செய்திருந்தாலோ
  rationale: כלה என்பதன் பியேல் வடிவம் ‘முடிவுறச் செய்தல், நலிவுறச் செய்தல்’ எனப் பொருள்படும். ‘கண்கள் சோர்தல்’ என்ற உருவகத்தில் நீண்ட காத்திருப்பாலும் நிறைவேறாத நம்பிக்கையாலும் உண்டாகும் ஏக்கத்தைத் தெளிவுபடுத்துகிறது; உருவகத்தையும் தக்கவைக்கிறது.
