translation_notes:
  register: நவீன செந்தமிழில், சாதாரண வாசகர்களுக்கும் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை உறுதிமொழி அமைப்பைப் பேண இணையான இரு கூறுகளிலும் ‘-ஆலோ’ பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனங்களில் நிறைவுபெறும் வாக்கியத் தொடரைக் காட்ட இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
