base_translation:
  language: en
  yaml_path: translation/ot/job/031/010.yaml
  text: then let my wife grind for another man[a], and let other men kneel over her.
translation:
  language: ta
  text: அப்படியானால், என் மனைவி வேறொருவனுக்காகத் தானியம் அரைக்கட்டும்[a]; மற்ற ஆண்கள் அவள்மேல் மண்டியிடட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்ற ஆண்கள் அவளுடன் பாலுறவு கொள்ளட்டும்.” “அவள்மேல் மண்டியிடட்டும்” என்பது இச்சூழலில் பாலுறவைக் குறிக்கும் நாசூக்கான மறைமொழியாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: மாவரைக்கட்டும்
  rationale: טחן என்பதன் நேரடிப் பொருள் தானியத்தை அரைப்பது. இச்சாபச் சூழலில் அடிமைத்தனமான உழைப்பையும் பாலியல் அவமானத்தையும் மறைமுகமாகக் குறிக்கக்கூடும்; எனவே எபிரெய மொழியின் தெளிவான உருவகத்தை முதன்மை உரை தக்கவைக்கிறது.
- source_word: לְאַחֵר
  choice: வேறொருவனுக்காக
  rationale: אַחֵר என்பது ‘வேறொருவர்’ என்று பொருள்படும். சூழலில் ஆண் ஒருவனைக் குறிப்பதால், இயல்பான தமிழில் ‘வேறொருவனுக்காக’ எனத் தரப்பட்டுள்ளது.
- source_word: אִשְׁתִּי
  choice: என் மனைவி
  rationale: முதல் நபர் ஒருமை உரிமை விகுதியுடன் வரும் אִשָּׁה என்பதன் சூழலுக்குரிய இயல்பான பொருள் ‘என் மனைவி’.
- source_word: וְעָלֶיהָ
  choice: அவள்மேல்
  rationale: עַל என்ற முன்னிடைச்சொல்லின் இடவியல் உருவகத்தைத் தணிக்காமல் ‘அவள்மேல்’ என்று தக்கவைக்கிறது.
- source_word: יִכְרְעוּן
  choice: மண்டியிடட்டும்
  rationale: כרע என்பதன் வழக்கமான பொருள் ‘மண்டியிடு, குனி’. இச்சூழலில் இது பாலுறவுக்கான நாசூக்கான மறைமொழியாக இருக்கலாம்; முதன்மை உரை நேரடி உருவகத்தைத் தக்கவைத்து, அந்தச் சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: אֲחֵרִין
  choice: மற்ற ஆண்கள்
  rationale: ஆண்பால் பன்மையில் உள்ள இச்சொல் சூழலில் மற்ற ஆண்களைக் குறிக்கிறது; தமிழில் குறிப்பைத் தெளிவாக்க ‘மற்ற ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாலியல் மறைமொழியை முதன்மை உரையிலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: ‘மாவரைக்கட்டும் / அவள்மேல் மண்டியிடட்டும்’ என்ற நேரடி உருவகங்களை முதன்மை உரையில் தக்கவைத்து, சாத்தியமான பாலியல் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘என் மனைவி வேறொருவனுக்காக மாவரைக்கட்டும்; மற்ற ஆண்கள் அவளுடன் உறவுகொள்ளட்டும்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை பாலுறவுக்கான வெளிப்படையான வினைச்சொல்லைப் பயன்படுத்தாமல், சூழலில் பாலியல் மறைபொருள் கொண்டிருக்கக்கூடிய உருவக வினைகளைப் பயன்படுத்துகிறது. அந்த உண்மையான தெளிவின்மையையும் உரையின் பதற்றத்தையும் காக்க, உருவகம் முதன்மை உரையிலும் சாத்தியமான விளக்கம் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மாவரைக்கட்டும்’ என்பது טחן என்ற வினையின் உறுதியான தானிய அரைக்கும் படிமத்தைத் தெளிவாக்குகிறது; பாலியல் பொருள் முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
