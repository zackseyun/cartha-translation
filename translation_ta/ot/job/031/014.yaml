source:
  edition: WLC
  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: ta
  text: கடவுள் எழுந்து நிற்கும்போது, அப்போது நான் என்ன செய்வேன்? அவர் என்னிடம் கணக்குக் கேட்கும்போது[a], அவருக்கு என்ன பதில் சொல்வேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் வருகை தரும்போது’ / ‘அவர் ஆராயும்போது.’ இதற்கான எபிரெய வினைச்சொல் வருகை தருதல், கவனித்தல், ஆராய்தல் அல்லது கணக்குக் கேட்டல் ஆகிய பொருள்களைக் கொள்ளலாம்; இங்குள்ள சூழல் நீதிசார் பொறுப்புக்கூறலை முன்னிறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: நான் என்ன
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் מָה, முந்தைய கருத்தைத் தொடர்ந்து யோபுவின் சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான கேள்வி அமைப்பில் அதன் தொடர்ச்சி உணர்வு முழு வாக்கியத்தால் வெளிப்படுகிறது.
- source_word: אֶעֱשֶׂה
  choice: செய்வேன்
  rationale: עשה என்பதன் முதலாம் நபர் ஒருமை நிறைவுறா வடிவம், எதிர்நோக்கும் சூழலில் தாம் என்ன செய்ய இயலும் என்று யோபு கேட்பதைக் குறிக்கிறது; தமிழின் எதிர்கால வினைமுற்று இந்தச் சொல்லாட்சிக் கேள்வியை இயல்பாகத் தருகிறது.
- source_word: כִּי יָקוּם
  choice: எழுந்து நிற்கும்போது
  rationale: כִּי இங்கு காலச் சூழலைக் குறிக்கிறது. קום என்பதன் ‘எழுதல்/எழுந்து நிற்றல்’ உருவகத்தைத் தக்கவைத்து, கடவுள் செயல்பட எழுவதை மிகையாக விளக்காமல் மொழிபெயர்க்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இவ்விடத்தில் பொதுவான இறைப் பெயர்; மூலத்தில் இல்லாத ‘சர்வவல்லவர்’ போன்ற விரிவாக்கம் சேர்க்கப்படவில்லை.
- source_word: וְכִי יִפְקֹד
  choice: அவர் என்னிடம் கணக்குக் கேட்கும்போது[a]
  rationale: פקד என்பதற்கு வருதல், கவனித்தல், ஆராய்தல், தண்டித்தல், கணக்குக் கேட்டல் எனப் பரந்த பொருள் உண்டு. ‘அவருக்கு என்ன பதில் சொல்வேன்?’ என்ற இணைவரி நீதிசார் பொறுப்புக்கூறல் பொருளை முன்னிறுத்துவதால், ‘கணக்குக் கேட்கும்போது’ என மொழிபெயர்க்கப்படுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: அவருக்கு என்ன பதில் சொல்வேன்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு ‘மறுமொழி அளித்தல்’ என்ற வழக்குப் பொருளில் வருகிறது; மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ‘அவருக்கு’ என்று இயல்பாக வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: கடவுளின் நீதித்தீர்ப்பு சார்ந்த உருவகம்
  choice: கடவுள் எழுந்து நின்று யோபுவிடம் கணக்குக் கேட்பதாகப் பொருள்படும் நீதிசார் படிமத்தைப் பாதுகாத்தல்; இதை இறுதி நியாயத்தீர்ப்புக்கு மட்டும் வரையறுக்காதிருத்தல்.
  alternative: ‘அவர் வரும்போது’ அல்லது ‘அவர் கவனிக்கும்போது’ என்று பொதுவாக மொழிபெயர்த்தல்; அல்லது இதைக் குறிப்பாக இறுதி நியாயத்தீர்ப்பு என்று விளக்குதல்.
  rationale: פקד என்பதும், கடவுளுக்குப் பதில் சொல்ல வேண்டிய நிலையும் தெய்வீக விசாரணை மற்றும் பொறுப்புக்கூறலை ஆதரிக்கின்றன. ஆனால் இது குறிப்பாக இறுதிக்கால நியாயத்தீர்ப்பையே குறிக்கிறது என்று எபிரெய உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் தெளிவாக இருக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்து நிற்கும்போது’ என்ற மூல உருவகமும், இரு சொல்லாட்சிக் கேள்விகளின் அழுத்தமும் பாதுகாக்கப்பட்டுள்ளன.
