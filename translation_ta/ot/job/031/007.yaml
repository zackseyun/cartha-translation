  text: אִ֥ם תִּטֶּ֣ה אַשֻּׁרִ/י֮ מִנִּ֪י הַ֫/דָּ֥רֶךְ וְ/אַחַ֣ר עֵ֭ינַ/י הָלַ֣ךְ לִבִּ֑/י וּ֝/בְ/כַפַּ֗/י דָּ֣בַק מֻאֽוּם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: ta
  text: 'என் காலடி வழியைவிட்டு விலகியிருந்தால்,

    என் இதயம் என் கண்களைப் பின்தொடர்ந்திருந்தால்,

    என் உள்ளங்கைகளில் ஏதேனும் கறை ஒட்டியிருந்தால்[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறை’ அல்லது ‘பழுது.’ எபிரேயச் சொல் கறை, குறை, பழுது அல்லது ஊனம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה
  choice: விலகியிருந்தால்
  rationale: נטה இங்கு ஒருவரின் நடத்தை சரியான வழியிலிருந்து பிறழ்வதைக் குறிக்கிறது. אִם தொடங்கும் தன்னைத் தானே சபதத்திற்குட்படுத்தும் நிபந்தனைத் தொடருக்கு ஏற்றவாறு நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אַשֻּׁרִי
  choice: என் காலடி
  rationale: இந்தச் சொல் ‘அடி’ அல்லது ‘நடை’ என்பதைக் குறிக்கிறது. ‘என் காலடி’ என்பது வழி என்ற உருவகத்தோடு இயல்பாக இணைந்து ஒழுக்க நடத்தையையும் உணர்த்துகிறது.
- source_word: מִנִּי הַדָּרֶךְ
  choice: வழியைவிட்டு
  rationale: சரியான பாதையிலிருந்து விலகுவதைச் சுட்டும் மூலமொழியின் வழி உருவகம் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கப்பட்டது.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: என் இதயம் என் கண்களைப் பின்தொடர்ந்திருந்தால்
  rationale: கண்ணால் காண்பதை உள்ளார்ந்த விருப்பம் பின்பற்றும் மூலமொழியின் உயிரோட்டமான உளவியல் உருவகம் தக்கவைக்கப்பட்டுள்ளது. சொற்சொல்லான ‘என் கண்களுக்குப் பின்னால் என் இதயம் சென்றிருந்தால்’ என்பதைவிட இது இயல்பான நவீனத் தமிழ்.
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: ‘இதயம்’ என்பது சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றை உள்ளடக்கும் எபிரேய மானிடவியல் சொல்லாட்சியைத் தக்கவைக்கிறது; அதை ‘மனம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: עֵינַי
  choice: என் கண்கள்
  rationale: பார்வைக்கும் உள்ளார்ந்த விருப்பத்திற்கும் இடையிலான தொடர்பை மூலமொழிபோலத் தெளிவாக வைத்திருக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּבְכַפַּי דָּבַק
  choice: என் உள்ளங்கைகளில் ... ஒட்டியிருந்தால்
  rationale: כף என்பது இங்கு உள்ளங்கையைக் குறிக்கிறது; דבק என்பதன் ‘ஒட்டிக்கொள்’ என்ற உருவகப் பொருள் செயல்களோடு தொடர்புடைய குற்றம் அல்லது மாசைச் சித்தரிக்கிறது.
- source_word: מֻאוּם
  choice: ஏதேனும் கறை
  rationale: இச்சொல் கறை, குறை, பழுது அல்லது ஊனம் போன்ற பொருள்களைக் கொள்ளலாம். இந்த ஒழுக்கச் சூழலில் ‘கறை’ என்பது உருவகத்தை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
theological_decisions:
- issue: ‘வழி’ என்னும் ஒழுக்க உருவகம்
  choice: ‘வழியைவிட்டு’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நேர்மையான நடத்தையிலிருந்து’ என்று கருத்தை வெளிப்படையாக்குதல்
  rationale: மூலவசனம் ஒழுக்க நேர்மையைப் பாதை அல்லது வழி உருவகத்தின் மூலம் கூறுகிறது. அதைத் தக்கவைப்பது இலக்கிய மற்றும் இறையியல் செறிவைப் பாதுகாத்து, தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
- issue: இதயமும் கண்களும் குறித்த மானிடவியல் மொழி
  choice: ‘இதயம்’ மற்றும் ‘கண்கள்’ ஆகியவற்றைத் தக்கவைத்தல்
  alternative: ‘மனம் நான் கண்டவற்றை விரும்பியிருந்தால்’ என்று பொருள்விரித்தல்
  rationale: மூலமொழியில் இதயம் கண்களைப் பின்தொடர்கிறது. இந்த உருவகத்தைத் தக்கவைப்பது பார்வை, ஆசை, மனவுறுதி ஆகியவற்றின் உறவை வாசகர் உணர அனுமதிக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிப்பதில்லை.
- issue: கைகளில் ஒட்டும் מוּם என்பதன் ஒழுக்கப் பொருள்
  choice: முதன்மை உரையில் ‘கறை’ என்று உருவகமாக மொழிபெயர்த்தல்
  alternative: ‘குற்றம்’ அல்லது ‘பாவம்’ என்று நேரடியாக விளக்குதல்
  rationale: ‘குற்றம்’ அல்லது ‘பாவம்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருக்கலாம்; ஆனால் எபிரேயச் சொல்லின் கறை அல்லது குறை என்ற படிமத்தை அவை நீக்கிவிடும். ஆகவே உண்மையான சொற்பொருள் விரிவு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவ நிதானத்தையும் யோபுவின் நிபந்தனைச் சபதத் தொடரையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. மூன்று இணையான நிபந்தனை வரிகளும் ‘இருந்தால்’ என்று அமைக்கப்பட்டுள்ளன. அடுத்த வசனத்தில் நிறைவடையும் இலக்கணத் தொடரைக் காட்ட இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
