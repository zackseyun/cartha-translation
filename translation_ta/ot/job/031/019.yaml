  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: ta
  text: ஆடையின்றி அழிந்துபோகிற ஒருவனையோ[a], போர்த்திக்கொள்ள எதுவும் இல்லாத தேவையுள்ளவனையோ[b] நான் கண்டிருந்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடை இல்லாததால் அழிந்துபோகிற ஒருவனை.”
    reason: מִבְּלִי לְבוּשׁ என்பது ஆடையின்மையான நிலையைக் குறிக்கிறது; சூழலில் அதை ஆடையின்மையால் ஏற்பட்டதாகவும் மொழிபெயர்க்கலாம்.
  - marker: b
    text: அல்லது, “வறியவனையோ.”
    reason: אֶבְיוֹן என்பது தேவையுள்ளவர் அல்லது வறியவர் எனப் பொருள்படும்.
