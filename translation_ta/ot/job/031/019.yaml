  rationale: இரண்டாம் கவிதை அடியிலுள்ள ‘மூடுதல்/போர்த்துதல்’ என்ற கருத்தை முதல் அடியின் ‘ஆடை’ என்பதிலிருந்து வேறுபடுத்திக் காக்கிறது.
- source_word: לָאֶבְיוֹן
