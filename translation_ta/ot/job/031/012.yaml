  edition: WLC
  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: ta
  text: ஏனெனில், அது அழிவு வரை விழுங்கும் நெருப்பு; என் விளைச்சல் அனைத்தையும் வேரோடு பிடுங்கிவிடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அபத்தோன் வரை.’ எபிரெயச் சொல்லான אֲבַדּוֹן என்பது ‘அழிவு’ என்பதையும், சில சூழல்களில் அழிவின் உலகம் அல்லது அழிவின் உருவகப்படுத்தல் என்பதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אֵשׁ הִיא
  choice: அது ... நெருப்பு
  rationale: எபிரெய உருவகத்தின் வலிமையைத் தக்கவைத்து, தமிழில் இயல்பான பயனிலை அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד אֲבַדּוֹן
  choice: அழிவுவரை
  rationale: இங்கு אֲבַדּוֹן பொதுப்பெயராக முழுமையான அழிவைக் குறிக்கிறது; அதன் வேறு சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: תֹּאכֵל
  choice: விழுங்கும்
  rationale: நெருப்பு உண்பது/விழுங்குவது என்ற உயிரோட்டமான மூல உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וּבְכָל תְּבוּאָתִי
  choice: என் விளைச்சல் அனைத்தையும்
  rationale: תְּבוּאָה தரும் நிலவிளைவு அல்லது வருவிளைவு சார்ந்த பரந்த பொருளை ‘விளைச்சல்’ தெரிவிக்கிறது; כָל என்பதன் முழுமையையும் ‘அனைத்தையும்’ காக்கிறது.
- source_word: תְשָׁרֵשׁ
  choice: வேரோடு பிடுங்கிவிடும்
  rationale: பியேல் வினையின் வேரறுக்கும் தீவிரத்தையும் வேளாண்மை உருவகத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲבַדּוֹן என்பதன் பொருள்
  choice: பொதுப்பெயரான ‘அழிவு’
  alternative: ‘அபத்தோன்’ என்ற பெயர் அல்லது அழிவின் உலகம்/உருவகம்
  rationale: இச்சூழலில் பாவத்தின் முற்றான அழிவூட்டும் விளைவே முதன்மைப் பொருள். எனினும் எபிரெயச் சொல்லின் பிற சூழல் சார்ந்த பெயர்ப்பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: வினையின் காலநிலை/முறையுணர்வு
  choice: ‘பிடுங்கிவிடும்’ என்ற எதிர்விளைவு
  alternative: ‘பிடுங்கும்’ அல்லது நிபந்தனைத் தொனியுடன் ‘பிடுங்கிவிடக்கூடும்’
  rationale: முந்தைய வசனங்களின் சத்தியப்பிரமாணச் சூழலில் எதிர்விளைவு உணர்வு உள்ளது; அதேவேளை எபிரெய வினையில் தனியே வெளிப்படாத ஐயப்பாட்டைச் சேர்க்காமல் உறுதியான விளைவாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘விழுங்கும் நெருப்பு’ மற்றும் ‘வேரோடு பிடுங்கிவிடும்’ என்பவை மூலத்தின் இரு வலுவான உருவகங்களையும் சாதாரண வாசகருக்குப் புரியும் வகையில் தக்கவைக்கின்றன.
