  naturalness: ‘இதுவும் நீதித்தீர்ப்புக்குரிய அக்கிரமமாக இருந்திருக்கும்’ என்பது நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘மேலுள்ள கடவுள்’ என்பது சுருக்கமான மூலத் தொடரை தேவையற்ற விரிவாக்கமின்றி இயல்பாக வழங்குகிறது.
  terminology: ‘அக்கிரமம்’ அறநெறி மற்றும் நீதிசார் குற்றத்தின் கனத்தைத் தக்கவைக்கிறது. ‘நீதித்தீர்ப்புக்குரிய’ என்பது פְּלִילִי என்பதன் நீதிசார் பரப்பைச் சரியாகக் காட்டுகிறது; மாற்று விளக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. ‘மறுதலித்திருப்பேன்’ சூழலிலுள்ள கடவுளுக்கான மறுப்பு/விசுவாசத் துரோக நுணுக்கத்திற்கு ஏற்றது.
