source:
  edition: WLC
  text: גַּם ה֭וּא עָוֺ֣ן פְּלִילִ֑י כִּֽי כִחַ֖שְׁתִּי לָ/אֵ֣ל מִ/מָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/028.yaml
  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: ta
  text: இதுவும் நீதித்தீர்ப்புக்குரிய அக்கிரமமாக இருந்திருக்கும்[a]; ஏனெனில் மேலுள்ள கடவுளை நான் மறுதலித்திருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிபதிகளால் தண்டிக்கப்பட வேண்டிய அக்கிரமம்,” “நீதிமன்றக் குற்றம்,” அல்லது “தீர்ப்புக்குரிய அக்கிரமம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் மேலுள்ள கடவுளுக்கு நான் உண்மையற்றவனாக இருந்திருப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: இதுவும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலையே சுட்டி, அதையும் யோபு மறுக்கும் குற்றங்களின் பட்டியலில் சேர்க்கிறது.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: அறநெறிசார் தீமையையும் நீதிசார் குற்றப்பொறுப்பையும் ஒருங்கே தாங்கும் சொல்லாக இச்சூழலில் பொருந்துகிறது.
- source_word: פְּלִילִי
  choice: நீதித்தீர்ப்புக்குரிய
  rationale: நீதித்துறை விசாரணை அல்லது தீர்ப்புக்கு உட்படும் தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் துல்லியமான இலக்கண நுணுக்கம் தெளிவற்றிருப்பதால் மாற்று வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னர் கூறப்பட்ட செயல் ஏன் அக்கிரமமாகும் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: כִחַשְׁתִּי
  choice: நான் மறுதலித்திருப்பேன்
  rationale: சூழலில் இது வெறுமனே பொய் சொல்வதைவிட, வேறு ஒன்றுக்கு வணக்கம் செலுத்துவதன் மூலம் கடவுளை மறுப்பதையோ அவருக்கு உண்மையற்றிருப்பதையோ குறிக்கிறது; Job 31-இன் நிபந்தனைத் தொடரைத் தமிழில் வெளிப்படுத்த இறந்தகால நிபந்தனை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לָאֵל
  choice: கடவுளை
  rationale: எபிரெய முன்னிடைச்சொல் வினையால் ஆளப்படுகிறது; தமிழில் ‘மறுதலித்தல்’ என்பதுடன் நேரடி செயப்படுபொருள் இயல்பாக அமைகிறது.
- source_word: מִמָּעַל
  choice: மேலுள்ள
  rationale: ‘மேலிருந்து/மேலே’ என்ற சுருக்கமான இடச்சுட்டை, முந்தைய வசனங்களில் குறிப்பிடப்படும் வான்பொருட்களோடு உள்ள வேறுபாட்டைக் காக்கும் வகையில் அதிக விளக்கமின்றி வழங்குகிறது.
theological_decisions:
- issue: מִמָּעַל என்பதை ‘வானத்தில் உள்ள’ என்று விரிவாக்க வேண்டுமா?
  choice: மேலுள்ள கடவுள்
  alternative: உன்னதத்திலுள்ள கடவுள்; மேலே வானத்தில் உள்ள கடவுள்
  rationale: மூல எபிரெயம் சுருக்கமாக இருப்பதால் ‘வானத்தில்’ என்ற சொல்லைச் சேர்க்காமல் செங்குத்தான இட வேறுபாட்டை மட்டும் காக்கிறது.
- issue: כחשׁ என்பது கடவுளை மறுப்பதா அல்லது அவருக்கு உண்மையற்றிருப்பதா?
  choice: மறுதலித்திருப்பேன்
  alternative: மேலுள்ள கடவுளுக்கு உண்மையற்றவனாக இருந்திருப்பேன்
  rationale: சூரியன் அல்லது சந்திரனுக்கு வணக்கம் செலுத்தும் உடனடிச் சூழலில் ‘மறுதலித்தல்’ பொருத்தமானது; இருப்பினும் துரோகம் அல்லது உண்மையின்மை என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீதித்தீர்ப்புக்குரிய’ என்பது சட்டநடைச் சாயலைக் காக்கிறது; ‘அக்கிரமம்’ அறநெறி மற்றும் நீதிசார் கனத்தைப் பாதுகாக்கிறது. நிபந்தனைச் சூழல் ‘இருந்திருக்கும்/மறுதலித்திருப்பேன்’ என்ற வடிவங்களால் தெளிவாக்கப்பட்டுள்ளது.
