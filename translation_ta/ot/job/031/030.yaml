translation_notes:
  register: நவீனத் தரத் தமிழில், மூலத்தின் கவித்துவமான ஆகுபெயரையும் நெறிசார் வலியுறுத்தலையும் இயல்பாக எடுத்துரைக்கும் கண்ணியமான நடை. ‘உயிரைக் கேட்பது’ என்ற சற்றே செறிவான மூலமொழி உருவகம், உண்மையான பொருள் இறப்பு அல்லது உயிரிழப்பை வேண்டுதல் என்பதைக் குறிப்பதாக இருந்தாலும், மூலத்தின் பதற்றத்தைப் பாதுகாக்கத் தக்கவைக்கப்பட்டது.
