  source_fidelity: மூலத்தின் முக்கியப் பொருள்கள்—தன் வாயை பாவம் செய்ய அனுமதிக்காதது, அவனுடைய உயிரைக் கேட்டது, சாபம்—வரைவில் உள்ளன. ஆனால் தற்போதைய சொல் வரிசை, ‘என் வாய் பாவம் செய்ய நான் அனுமதிக்கவில்லை’ என்பதில் செயற்பாட்டுத் தொடர்பைச் சற்றுத் தடுமாறச் செய்கிறது. ‘சாபமிட்டு’ என்பது בְּאָלָה-வின் சூழல்சார் பொருளைத் துல்லியமாகத் தருகிறது.
