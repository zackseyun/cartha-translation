  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: ta
  text: சாபமிட்டு அவனுடைய உயிரைக் கேட்பதன் மூலம், என் வாய் பாவம் செய்ய நான் இடமளிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சத்தியத்துடன்.” எபிரெயச் சொல் “சாபம்” அல்லது “சத்தியம்” என்ற இரு பொருள்களையும் தரலாம்; இங்கு ஒருவனுக்குத் தீங்கு நேரிட வேண்டுமென்ற சூழல் “சாபம்” என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: நான் அனுமதிக்கவில்லை
  rationale: ‘கொடுத்தல்’ என்ற வினைச்சொல் இங்கு வினையெச்சத்துடன் சேர்ந்து அனுமதித்தல் என்ற பொருளைத் தருகிறது; தமிழில் இயல்பாக ‘அனுமதிக்கவில்லை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַחֲטֹא
  choice: பாவம் செய்ய
  rationale: חטא என்பதன் வழக்கமான அறநெறிப் பொருளான ‘பாவம் செய்தல்’ இச்சூழலுக்கு ஏற்றது.
- source_word: חִכִּי
  choice: என் வாய்
  rationale: சொல்லின் நேரடிப் பொருள் ‘என் அண்ணம்’; கவிதை வழக்கில் இது பேச்சுறுப்பைக் குறிக்கும் ஆகுபெயராக இருப்பதால், தமிழில் தெளிவாக ‘என் வாய்’ என்று தரப்பட்டது.
- source_word: לִשְׁאֹל
  choice: கேட்டு
  rationale: தீங்கான பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வினையெச்சத்தைத் தமிழின் இயல்பான ‘கேட்டு’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: בְּאָלָה
  choice: சாபத்தால்
  rationale: אָלָה என்பது சாபம் அல்லது தீங்கு வேண்டிக் கூறும் வசையைக் குறிக்கலாம்; பகைவனுக்குத் தீங்கு விரும்பும் சூழலில் ‘சாபம்’ பொருத்தமானது. ‘ஆணை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிரை
  rationale: נפשׁ இங்கு தனி ஆத்துமாவைக் குறித்த கோட்பாட்டுச் சொல்லல்ல; ஒருவனின் உயிரையோ வாழ்வையோ குறிக்கிறது.
