  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ֭/חוּץ לֹא יָלִ֣ין גֵּ֑ר דְּ֝לָתַ֗/י לָ/אֹ֥רַח אֶפְתָּֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/032.yaml
  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: ta
  text: அந்நியர் வெளியே இரவு தங்கியதில்லை[a]; வழிப்போக்கருக்காக என் கதவுகளைத் திறந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியர் தெருவில் இரவு தங்கியதில்லை; வழிப்போக்கருக்காக என் கதவைத் திறந்தேன்.”
    reason: בַּחוּץ என்பதற்கு ‘தெருவில்’ என்றும், גֵּר என்பதற்கு ‘அந்நியர்’ என்றும், דְּלָתַי என்பதற்கு தமிழில் ஒருமையாக ‘என் கதவு’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: בַּחוּץ
  choice: வெளியே
  rationale: இச்சொல் வீட்டுக்கு வெளியே, திறந்த வெளியில் இருப்பதைக் குறிக்கிறது; நவீன தமிழில் ‘வெளியே’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: יָלִין
  choice: இரவைக் கழிக்கவில்லை
  rationale: לין என்பது இரவு தங்குவதைக் குறிப்பாகக் குறிக்கிறது; இந்த மொழிபெயர்ப்பு அதன் காலப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: גֵּר
  choice: அந்நியனான குடியிருப்பவன்
  rationale: גֵּר என்பது பிற இனத்தாரிடையே குடியிருக்கும், சமூக ரீதியில் பாதுகாப்பற்றவராக இருக்கக்கூடிய அந்நியரைச் சுட்டுகிறது. ‘அந்நியன்’ மட்டும் தராத குடியிருப்பு நிலையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: דְּלָתַי
  choice: என் கதவுகளை
  rationale: எபிரெய வடிவம் முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் பன்மையில் உள்ளது; தமிழிலும் பன்மையை இயல்பாகத் தக்கவைக்க முடிகிறது.
- source_word: לָאֹרַח
  choice: வழிப்போக்கருக்காக
  rationale: இச்சூழலில் אֹרַח பாதையையல்ல, பயணம் செய்யும் ஒருவரைக் குறிக்கிறது. ‘வழிப்போக்கர்’ மரியாதையான, எளிதில் புரியும் தமிழ்ச் சொல்.
- source_word: אֶפְתָּח
  choice: திறந்து வைத்தேன்
  rationale: இங்குள்ள imperfect வடிவம் யோபுவின் வழக்கமான கடந்தகால விருந்தோம்பலைக் குறிக்கிறது; ‘திறந்து வைத்தேன்’ கதவுகள் பயணிக்காகக் கிடைக்குமாறு வைத்திருந்த தொடர்ச்சியான மனப்பாங்கை இயல்பாக வெளிப்படுத்துகிறது.
