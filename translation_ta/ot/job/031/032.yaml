revisions:
- from: அந்நியனான குடியிருப்பவன் வெளியே இரவைக் கழிக்கவில்லை[a]; வழிப்போக்கருக்காக என் கதவுகளைத் திறந்து வைத்தேன்.
  to: அந்நியர் வெளியே இரவு தங்கியதில்லை[a]; வழிப்போக்கருக்காக என் கதவுகளைத் திறந்தேன்.
  rationale: The revision improves modern Tamil idiom, preserves the concise parallelism of the Hebrew, and renders the opening of the doors without adding the idea that they were kept open. The footnote retains the legitimate lexical and idiomatic alternatives signaled in the English audit trail.
  reviewer_model: gpt-5.6-terra
