  revision_rationale: The revision improves modern Tamil idiom, preserves the concise parallelism of the Hebrew, and renders the opening of the doors without adding the idea that they were kept open. The footnote retains the legitimate lexical and idiomatic alternatives signaled in the English audit trail.
