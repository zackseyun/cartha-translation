translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபுவின் கண்ணியமான தற்காப்புக் கூற்றுக்கு ஏற்ற வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘அந்நியனான குடியிருப்பவன்’ சற்றே விளக்கமான சொற்றொடராக இருந்தாலும், גֵּר என்பதிலுள்ள அந்நியத்தன்மை மற்றும் தங்கியிருக்கும் சமூக நிலை ஆகிய இரண்டையும் காக்கிறது.
