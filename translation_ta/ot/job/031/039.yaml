  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: ta
  text: அதன் விளைச்சலைப் பணம் கொடுக்காமல் நான் உண்டிருந்தாலோ, அதன் உரிமையாளர்களின் உயிர் தளரச் செய்திருந்தாலோ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல் முறையில், “அதன் உரிமையாளர்களின் உயிர் நீங்கச் செய்திருந்தாலோ” அல்லது “அதன் உரிமையாளர்களை மூச்சுவிடத் திணறச் செய்திருந்தாலோ” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் அரிதானது; இந்தச் சொற்றொடர் கடுமையாக ஒடுக்குவதையோ உயிரிழக்கச் செய்வதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: அதன் விளைச்சல்
  rationale: כֹּחַ என்பதன் அடிப்படைப் பொருள் ‘வலிமை’; நிலத்தைப் பற்றிய வேளாண்மைச் சூழலில் அது நிலத்தின் உற்பத்தித் திறனால் கிடைக்கும் விளைச்சலைக் குறிக்கிறது.
- source_word: אָכַלְתִּי
  choice: நான் உண்டிருந்தாலோ
  rationale: ‘உண்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, இங்கு தொடரும் நிபந்தனைவடிவ உறுதிமொழிக்கு ஏற்றவாறு தமிழில் இறந்தகால நிபந்தனையாக அமைக்கப்பட்டுள்ளது.
- source_word: בְלִי כָסֶף
  choice: பணம் கொடுக்காமல்
  rationale: כֶּסֶף என்பதற்கு நேரடியாக ‘வெள்ளி’ என்று பொருள் இருந்தாலும், இங்கு அது விலை அல்லது கூலியாகச் செலுத்த வேண்டிய பணத்தைக் குறிக்கிறது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: נֶפֶשׁ என்பதன் ‘உயிர்/உயிர்நிலை’ என்ற அடிப்படை உணர்வைத் தக்கவைக்கிறது; அதை வெறும் ‘மனம்’ என்று குறுக்காமல் அடுத்துள்ள அரிய வினைச்சொல்லின் தெளிவின்மையையும் விடுகிறது.
- source_word: בְּעָלֶיהָ
  choice: அதன் உரிமையாளர்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முந்தைய நிலத்தைக் குறிக்கிறது; בַּעַל இச்சூழலில் அதை உடைமையாகக் கொண்டவர்களைக் குறிக்கிறது.
- source_word: הִפָּחְתִּי
  choice: சோரச் செய்திருந்தாலோ
  rationale: נפח என்பதன் இந்த அரிய causative வடிவம் மூச்சுவிடச் செய்தல், உயிர் நீங்கச் செய்தல் அல்லது கடுமையாக வாட்டுதல் ஆகிய உணர்வுகளைத் தரக்கூடும். ‘உயிரைச் சோரச் செய்தல்’ கடுமையான ஒடுக்குதலை இயல்பான தமிழில் தெரிவிக்கிறது; மரணத்தை மட்டும் உறுதியாக்கவில்லை.
