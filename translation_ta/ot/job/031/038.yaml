lexical_decisions:
- source_word: אִם
  choice: -ஆல்
  rationale: யோபுவின் குற்றமற்ற தன்மையை உறுதிப்படுத்தும் நிபந்தனை வாக்கியத்தை இயல்பான தமிழில் காட்ட வினையெச்ச நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: זעק என்பதுடன் இச்சூழலில் நிலம் யோபுவுக்கு எதிராகச் சாட்சி கூறும் குற்றச்சாட்டு சார்ந்த பொருளைத் தருகிறது.
- source_word: אַדְמָתִי
  choice: என் நிலம்
  rationale: விவசாயத்துக்குரிய சொந்த நிலத்தைக் குறிக்கும் இயல்பான, பரவலாகப் புரியும் தமிழ் வடிவம்.
- source_word: תִזְעָק
  choice: கூக்குரலிட்டு
  rationale: துயரம் அல்லது முறையீட்டின் வலிமையான குரலைக் குறிக்கும் זעק என்பதையும் நிலத்தின் உருவகப்படுத்தலையும் பாதுகாக்கிறது.
- source_word: וְיַחַד
  choice: ஒன்றாக
  rationale: உழுசால்கள் கூட்டாக அல்லது ஒரே நேரத்தில் அழும் கவித்துவப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: תְּלָמֶיהָ
  choice: அதன் உழுசால்கள்
  rationale: תלם என்பது உழுவதால் நிலத்தில் உருவாகும் சாலைக் குறிக்கிறது; ‘உழுசால்’ விவசாயப் படிமத்தைத் துல்லியமாகத் தருகிறது.
- source_word: יִבְכָּיוּן
  choice: அழுதால்
  rationale: בכה என்பதன் வழக்கமான ‘அழு’ என்ற பொருளைத் தக்கவைத்து, நிலத்தின் உழுசால்களை மனிதரைப்போல் உருவகப்படுத்தும் கவித்துவத்தை வெளிப்படுத்துகிறது.
