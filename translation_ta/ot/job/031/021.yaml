  source_fidelity: The Tamil accurately retains the conditional-oath protasis, the hostile gesture of raising the hand against the fatherless person, the causal force of כי, and the legal/public setting implied by the city gate. “எனக்கு ஆதரவு இருப்பதை நான் கண்டதால்” appropriately conveys Job's perception of available backing/help.
