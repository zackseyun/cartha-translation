source:
  edition: WLC
  text: אִם הֲנִיפ֣וֹתִי עַל יָת֣וֹם יָדִ֑/י כִּֽי אֶרְאֶ֥ה בַ֝/שַּׁ֗עַר עֶזְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: ta
  text: தகப்பனை இழந்தவனுக்கு எதிராக நான் என் கையை ஓங்கியிருந்தால்—நகரவாசலில்[a] எனக்கு ஆதரவு இருப்பதை நான் கண்டதால்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நகரவாசல் என்பது மூப்பர்கள் வழக்குகளை விசாரித்து, பொதுத் தீர்மானங்களை எடுத்த இடமாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: நேரடியாக, ‘என் உதவியை’; இங்கு சட்ட அல்லது பொது விவகாரத்தில் கிடைக்கும் ஆதரவையோ பின்பலத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: யோபு 31-இன் நிபந்தனை வடிவிலான ஆணைச் சூத்திரத்தைத் தொடரும் வகையில் வாக்கிய முடிவில் இயல்பாக அமைக்கப்பட்டுள்ளது; அதன் விளைவு அடுத்த வசனத்தில் வருகிறது.
- source_word: הֲנִיפוֹתִי
  choice: நான் ... ஓங்கியிருந்தால்
  rationale: Hiphil வடிவம் கையை அச்சுறுத்தும் அல்லது தீங்கு செய்யும் நோக்கில் உயர்த்துவதைக் குறிக்கிறது. ‘கையை ஓங்கு’ என்பது செயலை அளவுக்கு மீறி குறிப்பாக்காமல் பகைமைத் தொனியைத் தருகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: கையை ஓங்குதல் என்ற பகைமைச் செயலில் இதன் எதிர்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָתוֹם
  choice: தகப்பனை இழந்தவன்
  rationale: எபிரெயச் சொல் குறிப்பாகத் தகப்பனை இழந்து சமூகப் பாதுகாப்பற்ற நிலையில் இருப்பவரைக் குறிக்கிறது; பொதுவான ‘அனாதை’ என்பதைவிட இது துல்லியமானது.
- source_word: יָדִי
  choice: என் கையை
  rationale: உடல் உறுப்பைக் குறிக்கும் நேரடிப் பொருள் தக்கவைக்கப்பட்டுள்ளது; தமிழிலும் இந்தச் சொற்றொடரின் அச்சுறுத்தும் வலிமை தெளிவாக உள்ளது.
- source_word: כִּי
  choice: '...தால்'
  rationale: தவறான செயலைத் தூண்டிய காரணத்தைத் தெரிவிக்கும் காரணப் பொருள் தமிழில் இயல்பாகக் காட்டப்பட்டுள்ளது.
- source_word: אֶרְאֶה
  choice: நான் கண்ட
  rationale: இங்கு வெறும் பார்வையை மட்டுமல்லாமல் தனக்குக் கிடைக்கும் ஆதரவை உணர்ந்ததையும் குறிக்கிறது; மூலத்தின் எளிய வினை வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בַשַּׁעַר
  choice: நகரவாசலில்
  rationale: ‘வாசல்’ என்பது நீதித்தீர்ப்பும் பொது முடிவுகளும் நடைபெற்ற நகரவாசலைக் குறிக்கிறது; சூழல் தெளிவாக இருக்க ‘நகர’ சேர்க்கப்பட்டுள்ளது.
- source_word: עֶזְרָתִי
  choice: எனக்கு ஆதரவு
  rationale: சொல்லுக்குச் சொல் ‘என் உதவி’; இங்கு நீதிமன்ற/பொது அரங்கில் கிடைக்கும் துணை அல்லது செல்வாக்கைக் குறிப்பதால் ‘ஆதரவு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
