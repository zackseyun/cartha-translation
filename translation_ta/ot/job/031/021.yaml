  terminology: “தகப்பனை இழந்தவன்” preserves the fatherless and socially vulnerable sense of יָתוֹם; “நகரவாசல்” adequately represents the judicial city gate; and “ஆதரவு” is an idiomatic contextual rendering of “my help.”
