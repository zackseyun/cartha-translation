translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் முடிவுறாத நிபந்தனை அமைப்பையும் அடுத்த வசனத்துடன் உள்ள தொடர்ச்சியையும் காட்ட நீள்கோடு வைக்கப்பட்டுள்ளது. ‘தகப்பனை இழந்தவன்’ என்பது பாலினக் குறிப்புள்ள எபிரெய ஒருமையை நெருக்கமாகப் பாதுகாக்கிறது.
