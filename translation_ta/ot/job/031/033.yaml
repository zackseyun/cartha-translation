  text: אִם כִּסִּ֣יתִי כְ/אָדָ֣ם פְּשָׁעָ֑/י לִ/טְמ֖וֹן בְּ/חֻבִּ֣/י עֲוֺֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: ta
  text: என் மீறுதல்களை மனிதனைப்போல்[a] மூடி, என் அக்கிரமத்தை என் மார்புக்குள் மறைத்திருந்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆதாமைப்போல்.” எபிரெயச் சொல் אָדָם என்பது “மனிதன்” என்ற பொதுப்பெயராகவோ, “ஆதாம்” என்ற இயற்பெயராகவோ வாசிக்கப்படலாம்.
    reason: மூல எபிரெயிலுள்ள பொதுப்பெயர்/இயற்பெயர் இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אִם
  choice: மறைத்திருந்தால்
  rationale: யோபுவின் உறுதிமொழித் தொடரில் நிபந்தனை வாக்கியத்தை அறிமுகப்படுத்துகிறது; தமிழில் வினைமுற்றுடன் இணைந்த ‘-இருந்தால்’ இயல்பாக அந்த நிபந்தனையை வெளிப்படுத்துகிறது.
- source_word: כִּסִּיתִי
  choice: மூடி
  rationale: כסה என்பதன் ‘மூடுதல்/மறைத்தல்’ உருவகத்தை ‘மூடி’ தக்கவைக்கிறது; அடுத்துவரும் ‘மறைத்திருந்தால்’ என்பதிலிருந்து சொற்பொருள் வேறுபாடும் காக்கப்படுகிறது.
- source_word: כְאָדָם
  choice: ஒரு மனிதனைப்போல்[a]
  rationale: אָדָם என்பதை இங்கு பொதுப்பெயரான ‘மனிதன்’ என்று வாசிக்கலாம்; כְ என்ற ஒப்புமையையும் இந்த மொழிபெயர்ப்பு நேரடியாகக் காட்டுகிறது. ‘ஆதாம்’ என்ற இயற்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פְּשָׁעָי
  choice: என் மீறுதல்களை
  rationale: פֶּשַׁע குறிக்கும் ஒழுக்கநெறி அல்லது சட்ட வரம்பை மீறும் செயல் என்ற நுணுக்கத்தை ‘மீறுதல்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִטְמוֹן
  choice: மறைத்திருந்தால்
  rationale: טמן என்பதன் ‘மறைத்து வைத்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; இங்கு முந்தைய ‘மூடி’ என்பதன் விதம் அல்லது விளக்கமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: בְּחֻבִּי
  choice: என் நெஞ்சுக்குள்
  rationale: மார்பு அல்லது மடி போன்ற மறைவான உட்பகுதியைக் குறிக்கும் எபிரெய உருவகத்தை, நவீனத் தமிழில் புரியத்தக்க வகையில் ‘நெஞ்சுக்குள்’ தக்கவைக்கிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עָוֹן என்பதிலுள்ள ஒழுக்கக் கேடு மற்றும் குற்றப்பொறுப்பு சார்ந்த கனத்தை ‘அக்கிரமம்’ வெளிப்படுத்துகிறது; ‘மீறுதல்கள்’ என்பதுடன் முழுமையாக ஒன்றாக்காமல் பொருள் வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: כְאָדָם என்பதில் אָדָם-ஐ எவ்வாறு வாசிப்பது
  choice: 'பொதுப்பெயர்: ‘ஒரு மனிதனைப்போல்’'
  alternative: 'இயற்பெயர்: ‘ஆதாமைப்போல்’'
  rationale: எபிரெயில் אָדָם என்பது ‘மனிதன்/மனிதகுலம்’ என்ற பொதுப்பெயராகவும் ‘ஆதாம்’ என்ற இயற்பெயராகவும் வாசிக்கப்படலாம். சூழல் ஒன்றையே சந்தேகமின்றி நிர்ணயிக்காததால், பொதுப்பெயர் வாசிப்பு முதன்மை உரையிலும் முக்கியமான இயற்பெயர் வாசிப்பு அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. இது தொடரும் உறுதிமொழி வாக்கியத்தின் நிபந்தனைப் பகுதி என்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘மூடி’ மற்றும் ‘நெஞ்சுக்குள்’ ஆகியவை எபிரெயின் தெளிவான உருவகங்களைத் தக்கவைக்கின்றன.
