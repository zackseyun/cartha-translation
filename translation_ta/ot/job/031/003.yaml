source:
  edition: WLC
  text: הֲ/לֹא אֵ֥יד לְ/עַוָּ֑ל וְ֝/נֵ֗כֶר לְ/פֹ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: ta
  text: அநியாயக்காரனுக்குக் கேடும்[a], தீமை செய்கிறவர்களுக்குப் பேரிடரும்[b] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழிவு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பெருந்துன்பமும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரேய வினாவை, இயல்பான தமிழ் சொல்லமைப்பில் வாக்கிய இறுதியில் அமைந்த எதிர்வினாவாகப் பாதுகாக்கிறது.
- source_word: אֵיד
  choice: கேடு
  rationale: அழிவை உண்டாக்கும் துன்பநிலையையோ வீழ்ச்சியையோ குறிக்கிறது. ‘கேடு’ சுருக்கமாகவும் கவிதைநடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לְעַוָּל
  choice: அநியாயக்காரனுக்கு
  rationale: அநீதியால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கும் பெயர்ச்சொல்லைத் தெளிவாகவும் நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְנֵכֶר
  choice: பேரிடரும்
  rationale: இங்கு אֵיד என்பதற்கு இணையான, ஆனால் அதிலிருந்து சற்றே வேறுபட்ட பேராபத்து அல்லது துர்நிகழ்வு என்ற பொருள் சூழலுக்குப் பொருந்துகிறது; ‘அந்நியத்தன்மை’ என்ற சாத்தியமான அடிப்பொருள் இவ்விணைநிலைக்கு இயல்பாக இல்லை.
- source_word: לְפֹעֲלֵי
  choice: செய்கிறவர்களுக்கு
  rationale: பங்கேற்புவினை வடிவம் வழக்கமாக அல்லது தொடர்ந்து செயலில் ஈடுபடுகிறவர்களைக் குறிக்கிறது. தமிழ் மொழியில் இயல்பாக இருக்கும்படி செயற்பாட்டுச் சொல்லாக்கம் பயன்படுத்தப்படுகிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சொல் துன்பம், தீங்கு, பொல்லாப்பு ஆகிய பொருட்களை ஏற்கலாம்; இங்கு அதைச் ‘செய்கிறவர்கள்’ என்பதால் ஒழுக்கரீதியான தீச்செயல் முதன்மையாகிறது.
theological_decisions:
- issue: ஞான இலக்கியத்தில் ஒழுக்கச் செயலுக்கும் கேடுக்கும் உள்ள தொடர்பு
  choice: அநியாயக்காரருக்கும் தீமை செய்கிறவர்களுக்கும் கேடு உரியது என்ற பொதுவான ஒழுக்க நியதியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது கடவுள் நேரடியாக வழங்கும் தண்டனை என்று வெளிப்படையாகக் கூறுவது, அல்லது செயல்களின் இயற்கையான விளைவு மட்டுமே என்று கூறுவது.
  rationale: இவ்வசனம் கேடு யாருக்குரியது என்பதைக் கூறுகிறது; ஆனால் அது நேரடியான இறைத்தண்டனையா அல்லது விரிவான ஒழுக்க ஒழுங்கின் விளைவா என்பதைத் தெளிவுபடுத்தவில்லை. அந்த இறையியல் பதற்றம் மொழிபெயர்ப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான ஞான இலக்கியக் கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேடு / பேரிடர்’ என்ற இணைச்சொற்கள் எபிரேயக் கவிதையின் பொருள் இணைநிலையையும் நுண்ணிய வேறுபாட்டையும் பேணுகின்றன; வினாவை இறுதியில் அமைத்தது இயல்பான தமிழ் எதிர்வினா வடிவை வழங்குகிறது.
