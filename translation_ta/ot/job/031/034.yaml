revisions:
- from: பெருந்திரளைக் கண்டு நான் அஞ்சியதாலும், குலங்களின்[a] இகழ்ச்சி என்னைத் திகிலடையச் செய்ததாலும், மௌனமாக இருந்து வாசலைவிட்டு வெளியே போகாமல் இருந்திருந்தால்—[b]
  to: பெருந்திரளுக்கு அஞ்சி, குலங்களின்[a] இகழ்ச்சி என்னைத் திகிலடையச் செய்ததால், நான் மௌனமாகி வாசலைவிட்டு வெளியே செல்லாமல் இருந்திருந்தால்—[b]
