base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: ta
  text: பெருந்திரளுக்கு அஞ்சி, குலங்களின்[a] இகழ்ச்சி என்னைத் திகிலடையச் செய்ததால், நான் மௌனமாகி வாசலைவிட்டு வெளியே செல்லாமல் இருந்திருந்தால்—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குலங்கள்” என்பதற்கான எபிரெயச் சொல் விரிந்த குடும்பங்கள், உறவுக் குழுக்கள் அல்லது இனக்குழுக்களையும் குறிக்கலாம். “குடும்பங்களின்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இது யோபுவின் குற்றமற்ற தன்மையை உறுதிப்படுத்தும் நிபந்தனைத் தொடரின் ஒரு பகுதி. எபிரெய வாக்கியம் நீள்வட்டமானது; கருத்து: பொதுமக்களின் கருத்துக்கு அஞ்சி, மௌனமாக வீட்டுக்குள் ஒதுங்கியிருந்தால்.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: …அதாலும் / …இருந்திருந்தால்
  rationale: இங்கு כִּי, யோபுவின் குற்றமற்ற தன்மையை உறுதிப்படுத்தும் நிபந்தனைத் தொடருக்குள் காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் காரணப் பெயரெச்சங்களையும் இறுதியில் நிபந்தனை வடிவத்தையும் பயன்படுத்துவது, எபிரெய வாக்கியத்தின் நீள்வட்டமான அமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶעֱרוֹץ
  choice: நான் அஞ்சிய
  rationale: ערץ கடுமையான அச்சம் அல்லது திகிலைச் சுட்டுகிறது. ‘அஞ்சிய’ என்பது கண்ணியமான, இயல்பான நவீனத் தமிழ்; அடுத்த வினையின் தீவிரத்தையும் மங்கச் செய்யாது.
- source_word: הָמוֹן רַבָּה
  choice: பெருந்திரள்
  rationale: הָמוֹן என்பது மக்கள் கூட்டத்தையும் רַבָּה அதன் பெரும் அளவையும் குறிக்கிறது. ‘பெருந்திரள்’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: குலங்களின் இகழ்ச்சி
  rationale: בּוּז என்பது இகழ்ச்சி அல்லது அவமதிப்பு. מִשְׁפָּחוֹת தனிக் குடும்பங்களைவிட விரிந்த உறவுக் குழுக்களையும் குறிக்க முடிவதால் ‘குலங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְחִתֵּנִי
  choice: என்னைத் திகிலடையச் செய்த
  rationale: חתת என்பதன் ஹிஃபில் வடிவம் ஒருவரை அச்சமடையச் செய்தல் அல்லது மனந்தளரச் செய்தல் என்ற வலிமையான பொருளைக் கொண்டது. ‘திகிலடையச் செய்த’ அதன் காரணவினைத் தன்மையையும் தீவிரத்தையும் காக்கிறது.
- source_word: וָאֶדֹּם
  choice: மௌனமாக இருந்து
  rationale: דמם அமைதியாக அல்லது பேசாமல் இருத்தலைக் குறிக்கிறது. இங்கு அச்சத்தின் விளைவாகத் தொடர்ந்த மௌனம் பொருந்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא אֵצֵא פָתַח
  choice: வாசலைவிட்டு வெளியே போகாமல்
  rationale: இந்தச் சொற்றொடர் நுழைவிடம் அல்லது வாசல் வழியாக வெளியே செல்லாத படிமத்தை அளிக்கிறது. ‘வாசலைவிட்டு வெளியே போகாமல்’ என்பது வீட்டுக்குள் ஒதுங்கியிருக்கும் கருத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: வாக்கியத்தின் மறைமுக நிபந்தனை அமைப்பு
  choice: இறுதியில் ‘இருந்திருந்தால்—’ என்று நிபந்தனையை வெளிப்படுத்துதல்
  alternative: ‘ஏனெனில் … இருந்தேன்’ என்று நேரடி காரணக் கூற்றாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் யோபுவின் குற்றமற்ற தன்மைக்கான உறுதிமொழித் தொடரில் உள்ளது; எபிரெயத்தில் கருத்து நீள்வட்டமாக இருந்து தண்டனை வேண்டுகோளுக்கான நிபந்தனை மறைந்துள்ளது. தமிழ் வாசகருக்குத் தொடரை உணர்த்த நிபந்தனை வடிவம் உதவுகிறது; இறுதி நீண்ட கோடு தீர்க்கப்படாத வாக்கியத் தொடரைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பெருந்திரள்’, ‘குலங்கள்’, ‘மௌனமாக’ ஆகிய சொற்கள் கவிதைத் தன்மையை அளவோடு காக்கின்றன. மூலத்தின் நிறைவுறாத உறுதிமொழி அமைப்பைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டது.
