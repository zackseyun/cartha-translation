lexical_decisions:
- source_word: וְאֹכַל
  choice: உண்டு ... இருந்திருந்தால்
  rationale: இயோபு 31-இன் உறுதிமொழி சார்ந்த நிபந்தனைத் தொடர்களுக்கேற்ப, எபிரெய இணைப்புச் சொல்லைத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல், முழு வாக்கியத்தையும் நிபந்தனை வினைமுற்றாக அமைக்கிறது.
- source_word: פִּתִּי
  choice: என் உணவுத் துண்டை
  rationale: ‘துண்டு/கவளம்’ என்ற concrete பொருளையும் உணவைக் குறிக்கும் சூழலையும் காக்கிறது; ‘அப்பம்’ என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: לְבַדִּי
  choice: நான் மட்டும்
  rationale: தனியாகத் தனக்கே உண்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘எனக்காக மட்டும்’ என மூலத்தைவிட வலுப்படுத்தவில்லை.
- source_word: יָתוֹם
  choice: தந்தையற்றவன்
  rationale: தந்தையை இழந்த சமூக ரீதியாகப் பாதுகாப்பற்ற நபரைச் சுட்டும் எபிரெயச் சொல்லின் துல்லியமான பொருளைக் காக்கிறது.
- source_word: מִמֶּנָּה
  choice: அதிலிருந்து
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் வந்த உணவுத் துண்டைக் குறிக்கிறது; தமிழில் பொருளைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்பட்டது.
