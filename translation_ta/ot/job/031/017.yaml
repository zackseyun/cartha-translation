  register: நவீன நிலையான தமிழில், உறுதிமொழி நிபந்தனையின் நிறைவுறாத தொடரை இறுதி நீள்கோடு காக்கிறது. ‘தந்தையற்றவன்’ என்ற துல்லியமான ஆனால் சற்றே இலக்கியச் சொல்லுக்கு அடிக்குறிப்பில் பொதுவழக்கான மாற்று தரப்பட்டுள்ளது.
