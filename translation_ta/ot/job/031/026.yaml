  language: ta
  text: ஒளி பிரகாசிக்கும்போது[a] அதை நான் பார்த்திருந்தாலோ, அல்லது நிலா ஒளிமிகு சிறப்புடன் நகர்ந்துசெல்லும்போது[b] அதைப் பார்த்திருந்தாலோ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சூரியன்’; ‘நிலா’ என்பதற்கு இணையாக இங்குள்ள ‘ஒளி’ சூரியனைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலா ஒளிமிகு சிறப்புடன் நடந்துசென்றபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -இருந்தாலோ
  rationale: யோபுவின் குற்றமற்ற நிலையை உறுதிப்படுத்தும் நிபந்தனை வாக்கியத்தைத் தமிழில் இயல்பாகத் தொடங்குகிறது; இணையான இரு செயல்களுக்கும் ‘-ஆலோ’ அமைப்பு பொருந்துகிறது.
- source_word: אֶרְאֶה
  choice: நான் பார்த்திருந்தாலோ
  rationale: Qal imperfect 1cs இங்கு யோபு செய்திருக்கக்கூடியதாக முன்வைத்து மறுக்கும் செயலைக் குறிக்கிறது; ‘பார்த்திருந்தால்’ அந்தக் கடந்தகால அனுமான நயத்தைத் தருகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது. இணைவரியான ‘நிலா’ காரணமாக இது சூரியனைக் குறிக்கக்கூடும்; ஆனால் மூலத்தில் ‘சூரியன்’ என்று வெளிப்படையாக இல்லை.
- source_word: כִּי
  choice: -த்தபோது
  rationale: பார்த்ததுடன் சேர்ந்த சூழ்நிலையை அறிமுகப்படுத்தும் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָהֵל
  choice: பிரகாசித்த
  rationale: ஒளிவீசுதல் அல்லது பிரகாசித்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְיָרֵחַ
  choice: நிலா ... அதைப் பார்த்திருந்தாலோ
  rationale: இரண்டாவது விண்பொருளை இணையான மாற்று நிபந்தனையாகக் காட்டுகிறது; தமிழின் இயல்புக்காக ‘பார்த்திருந்தாலோ’ மீண்டும் வழங்கப்படுகிறது.
- source_word: יָקָר
  choice: மகிமையுடன்
  rationale: இங்கு ‘விலையுயர்ந்த’ என்பதைக் காட்டிலும் நிலாவின் கம்பீரமான ஒளிமிகு தோற்றத்தைக் குறிக்கும் வினையடைப் பொருளை வழங்குகிறது.
- source_word: הֹלֵךְ
  choice: நகர்ந்தபோது
  rationale: வானில் நிலா தொடர்ந்து செல்லும் இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விண்பொருள் வழிபாட்டைக் குறிக்கும் சாத்தியமான பின்னணி
  choice: ‘ஒளி’ என்ற நேரடி விண்ணகப் படிமத்தை முதன்மை உரையில் தக்கவைத்து, வழிபாட்டைக் குறிக்கும் கருத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘ஒளி’ என்பதை ‘சூரியன்’ என்று மொழிபெயர்த்து விக்கிரக வழிபாட்டு பின்னணியை முன்னிறுத்துதல்.
  rationale: 31:27–28 விண்பொருட்களிடம் வழிபாட்டு ஈர்ப்பு கொள்வதை யோபு மறுப்பதைத் தெளிவுபடுத்துகின்றன. ஆனால் 31:26 தனியாக ‘ஒளி’ மற்றும் ‘நிலா’ என்றே கூறுவதால், அதன் உண்மையான மறைபொருளையும் பதற்றத்தையும் சூழல் விளக்க அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை அமைப்பின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘அதைப் பார்த்தல்’ என்பது வெறும் காணுதலுக்கு மேல் ஈர்ப்புடன் நோக்குதலையும் சூழலில் கொள்ளக்கூடிய தெளிவின்மையுடன் விடப்பட்டுள்ளது.
