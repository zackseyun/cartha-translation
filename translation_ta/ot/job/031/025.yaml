source:
  edition: WLC
  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: ta
  text: என் செல்வம் மிகுதியாக இருந்ததாலும், என் கை ஏராளமாக ஈட்டியிருந்ததாலும் நான் மகிழ்ந்திருந்தால்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: என்றால் / இருந்தால்
  rationale: யோபுவின் குற்றமற்றதன்மையை உறுதிப்படுத்தும் நிபந்தனைச் சத்தியத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֶשְׂמַח
  choice: நான் மகிழ்ந்திருந்தால்
  rationale: செல்வத்தை உடையிருப்பதை அல்ல, அதனால் மனமகிழ்ச்சி அடைந்திருப்பதையே உரை முன்வைக்கிறது; சூழலுக்கேற்ற நிபந்தனை வடிவமும் காக்கப்படுகிறது.
- source_word: רַב חֵילִי
  choice: என் செல்வம் மிகுதியாக இருந்ததால்
  rationale: חֵיל இங்கு பொருளாதாரச் செல்வத்தைக் குறிக்கிறது; רַב அதன் அளவுமிகுதியைக் காட்டுகிறது.
- source_word: וְכִי כַבִּיר מָצְאָה יָדִי
  choice: என் கை ஏராளமாக ஈட்டியிருந்ததால்
  rationale: ‘என் கை கண்டது’ என்ற எபிரெய மொழிமரபின் பொருள், ஒருவரின் சொந்த ஆற்றல் அல்லது முயற்சியால் மிகுதியாகப் பெற்றுக்கொண்டது என்பதாகும். ‘என் கை’ என்ற உருவகம் தனிப்பட்ட ஆற்றலின் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: இந்த வசனம் செல்வத்தையே கண்டிக்கிறதா, அல்லது செல்வமிகுதியிலும் சொந்த முயற்சியால் பெற்றதிலும் மகிழ்வதை மறுக்கிறதா?
  choice: செல்வம் மிகுதியாக இருந்ததாலும் தன் கை ஏராளமாக ஈட்டியதாலும் தான் மகிழ்ந்ததாக யோபு மறுக்கும் விதத்தில் மொழிபெயர்க்கப்பட்டது.
  alternative: செல்வத்தை வைத்திருப்பதே தவறு என்று பொருள்படும்படி பொதுவாக மொழிபெயர்க்கலாம்.
  rationale: இரண்டு כִּי சொற்களும் மகிழ்ச்சிக்கான காரணங்களைச் சுட்டுகின்றன. ஆகவே செல்வத்தை வைத்திருப்பதற்கெதிரான கருத்தைச் சேர்க்காமல், செல்வத்தில் வைக்கும் மகிழ்ச்சியையும் சொந்த ஆற்றல்மீதான சார்பையும் உரை வலியுறுத்தும் அளவில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் கை’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது; நிபந்தனைச் சத்தியம் அடுத்த வசனத்துடன் தொடர்வதைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
