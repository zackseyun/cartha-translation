  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் இரு இணைச் சாபக் கூற்றுகளையும் காக்கிறது: தோள் இணைப்பிடத்திலிருந்து விழுதல், கை/புயம் எலும்பு அல்லது மூட்டு அமைப்பிலிருந்து முறிதல். ‘கழன்று விழட்டும்’ என்பது נפל (‘விழுதல்’) என்ற அடிப்படைப் படிமத்தைத் தக்கவைத்தபடியே சூழலில் உள்ள பிரிதல் கருத்தை இயல்பாக வெளிப்படுத்துகிறது. מִשִּׁכְמָה மற்றும் מִקָּנָה ஆகியவற்றின் உடற்கூறியல் குறிப்பில் உள்ள உறுதியின்மை அடிக்குறிப்புகளில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது.'
