  text: then let my shoulder fall from its socket[b][a], and let my arm be broken from its bone.
translation:
  language: ta
  text: அப்போது என் தோள் அதன் மூட்டிலிருந்து கழன்று விழட்டும்[a]; என் கை அதன் எலும்பிலிருந்து முறிந்துபோகட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தோளிலிருந்து.’ எபிரெயச் சொல் தோள் அல்லது மேல் முதுகுப் பகுதியைக் குறிக்கலாம்; இங்கு தோள் தன் இணைப்பிடத்திலிருந்து கழல்வது பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் மூட்டிலிருந்து.’ இங்குள்ள அரிதான எபிரெயச் சொல் கையின் எலும்பையோ மூட்டு அமைப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: என் தோள்
  rationale: כָּתֵף பொதுவாகத் தோள் அல்லது உடலின் பக்கப்பகுதியைக் குறிக்கிறது; இங்குள்ள உடற்காயச் சூழலிலும் அடுத்துவரும் ‘கை’ என்பதுடனான இணைப்பிலும் ‘தோள்’ இயல்பான பொருத்தமாகும்.
- source_word: מִשִּׁכְמָה
  choice: அதன் மூட்டிலிருந்து
  rationale: שִׁכְמָה தோள் அல்லது முதுகின் மேற்பகுதியைக் குறிக்கக்கூடும். ‘விழட்டும்’ என்ற வினையுடன், தோள் அதன் இணைப்பிடத்திலிருந்து கழல்வதைக் குறிக்கும் உடற்காயப் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்த ‘மூட்டிலிருந்து’ தேர்ந்தெடுக்கப்பட்டது; நேரடியான மாற்றுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִפּוֹל
  choice: கழன்று விழட்டும்
  rationale: נפל என்பதன் அடிப்படைப் பொருள் ‘விழு.’ இச்சூழலில் இணைப்பிடத்திலிருந்து பிரிந்து விழும் கருத்தைத் தமிழில் தெளிவாகவும் உயிரோட்டமாகவும் கூற ‘கழன்று விழட்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶזְרֹעִי
  choice: என் கை
  rationale: זְרוֹעַ பொதுவாகக் கையைக் குறிக்கிறது. தமிழில் சாதாரண வாசகருக்கு இயல்பான உடற்பகுதிப் பெயராக ‘கை’ பயன்படுத்தப்பட்டது.
- source_word: מִקָּנָה
  choice: அதன் எலும்பிலிருந்து
  rationale: קָנֶה இங்கு அரிதான உடற்கூறியல் பயன்பாட்டைக் கொண்டது. இணை அமைப்பும் உடற்காயச் சூழலும் எலும்பு அல்லது மூட்டு அமைப்பைக் குறிக்கின்றன; உரையின் உறுதியின்மையை அடிக்குறிப்பில் பாதுகாத்தபடி ‘எலும்பிலிருந்து’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִשָּׁבֵר
  choice: முறிந்துபோகட்டும்
  rationale: שׁבר என்பதன் நிஃபால் வடிவம் ‘முறிக்கப்படு/முறிந்துபோ’ என்ற பொருளைத் தருகிறது. சாப அல்லது உறுதிமொழி நடைக்கு ஏற்றவாறு ‘முறிந்துபோகட்டும்’ பயன்படுத்தப்பட்டது.
