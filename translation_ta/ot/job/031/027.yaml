  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: ta
  text: 'என் உள்ளம் ரகசியமாகக் கவரப்பட்டு,


    என் கை என் வாய்க்கு முத்தமிட்டிருந்தால்[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சூழலுக்கு ஏற்ற இயல்பான பொருள்: “என் கையால் முத்தம் அனுப்பியிருந்தால்.” இது வானில் காணப்படும் ஒளிக்கோள்களுக்கு வணக்க மரியாதை செலுத்திய ஒரு சைகையாக இருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: கவரப்பட்டு
  rationale: פתה என்பதன் இங்குள்ள செயல்படுபொருள் சார்ந்த பொருள், உள்ளம் ஏதோ ஒன்றினால் ஈர்க்கப்பட்டு வழிதவறத் தூண்டப்படுவதைக் குறிக்கிறது. ‘கவரப்பட்டு’ என்பது ‘ஏமாற்றப்பட்டு’ என்பதைக் காட்டிலும் இச்சூழலின் உள்ளார்ந்த ஈர்ப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּסֵּתֶר
  choice: மறைவாக
  rationale: סתר குறிக்கும் மறைவு அல்லது இரகசியத் தன்மையை இயல்பான வினையடை வடிவில் தருகிறது; செயல் முதலில் உள்ளத்தில், பிறர் அறியாமல் நிகழ்வதையும் உணர்த்துகிறது.
- source_word: לִבִּי
  choice: என் உள்ளம்
  rationale: לֵב இங்கு வெறும் உடல் உறுப்பை அல்லாமல் எண்ணம், விருப்பம், உணர்வு ஆகியவற்றை உள்ளடக்கிய அக மனிதனைக் குறிக்கிறது. நவீன தமிழில் ‘உள்ளம்’ இந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וַתִּשַּׁק
  choice: முத்தமிட்டிருந்தால்
  rationale: נשק என்பதன் நேரடிப் பொருளான ‘முத்தமிடுதல்’ முதன்மை உரையில் காக்கப்படுகிறது. முந்தைய வசனத்தில் தொடங்கும் நிபந்தனை அமைப்பைத் தமிழில் தெளிவாக்க ‘இருந்தால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָדִי
  choice: என் கை
  rationale: குறிப்பிட்ட உடல் சைகையின் செய்பொருளை எபிரெய உரைப்படியே நேரடியாகக் காக்கிறது.
- source_word: לְפִי
  choice: என் வாயை
  rationale: சொல்லுக்கு சொல் பொருள் ‘என் வாய்க்கு’ என்பதாக இருந்தாலும், ‘முத்தமிடு’ என்ற தமிழ் வினையோடு இயல்பாக அமைய ‘என் வாயை’ எனத் தரப்பட்டுள்ளது; சைகையின் பண்பாட்டு உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: வானொளிகளை வணங்கியதைக் குறிக்கக்கூடிய சைகை
  choice: வழிபாடு என்று முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், உடல் சைகையை நேரடியாக வைத்தல்
  alternative: என் கையால் முத்தம் அனுப்பியிருந்தால்
  rationale: யோபு 31:26–28 சூழலில் இச்சைகை சூரியன் அல்லது சந்திரனுக்குச் செலுத்தப்பட்ட வணக்க மரியாதையைக் குறிக்கலாம். ஆனால் இவ்வசனம் வழிபாட்டை நேரடியாகப் பெயரிடாமல் செயலை மட்டும் விவரிப்பதால், அந்தத் தெளிவின்மையும் concrete imagery-யும் முதன்மை உரையில் காக்கப்பட்டு, சாத்தியமான பண்பாட்டு பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் கை என் வாயை முத்தமிட்டிருந்தால்’ என்ற சற்றே அசாதாரணமான உருவகம், மூல எபிரெய மொழியின் உறுதியான உடல் சைகையைப் பாதுகாக்க நோக்கமுடன் வைக்கப்பட்டுள்ளது. இறுதிக் கோடு, அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியத்தைச் சுட்டுகிறது.
