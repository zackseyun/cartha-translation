base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: ta
  text: என்னை வெறுப்பவனுடைய அழிவில் நான் மகிழ்ந்திருந்தாலோ,[a] தீமை அவனை வந்தடைந்தபோது களிகூர்ந்திருந்தாலோ—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழிவு’ என்பதற்கு ‘பேரிடர்’ அல்லது ‘கேடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தீமை அவனை வந்தடைந்தபோது’ என்பதற்கு ‘கேடு அவனுக்கு நேர்ந்தபோது’ அல்லது ‘துரதிர்ஷ்டம் அவனை வந்தடைந்தபோது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …இருந்திருந்தாலோ
  rationale: யோபுவின் குற்றமற்ற தன்மையை உறுதிப்படுத்தும் நிபந்தனை வாக்கியத்தைத் தமிழில் இயல்பாகத் தொடரும் வகையில் ‘-ஆலோ’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶשְׂמַח
  choice: நான் மகிழ்ந்திருந்தாலோ
  rationale: שׂמח என்பதன் மகிழ்தல் என்ற அடிப்படைப் பொருளையும், கடந்த நடத்தையைப் பற்றிய நிபந்தனை மறுப்பின் நுணுக்கத்தையும் காக்கிறது.
- source_word: בְּפִיד
  choice: அழிவைக் கண்டு
  rationale: פִיד குறிக்கும் பேரிடர், வீழ்ச்சி அல்லது அழிவு என்ற பொருள் எல்லையில், இங்கு ஒருவருக்கு நேரும் அழிவைக் கண்டு மகிழ்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பேரிடர்’ என்பது மாற்றாகக் குறிப்பில் தரப்படுகிறது.
- source_word: מְשַׂנְאִי
  choice: என்னை வெறுப்பவனுடைய
  rationale: ‘என் பகைவன்’ என்று பெயர்ச்சொல்லாக்காமல், எபிரேயப் பங்கேற்பு வடிவின் ‘என்னை வெறுப்பவன்’ என்ற வினைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וְהִתְעֹרַרְתִּי
  choice: களிகூர்ந்திருந்தாலோ
  rationale: மற்றொருவருக்கு நேர்ந்த தீமையால் உணர்ச்சிவசப்பட்டு மிகுதியாக மகிழும் இணைநிலைப் பொருளைத் தருகிறது; ‘இகழ்ச்சியுடன் அகமகிழ்தல்’ போன்ற மிகைப்படுத்தப்பட்ட தீய நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: …போது
  rationale: தீமை அவனை வந்தடையும் சூழ்நேரத்தை அறிமுகப்படுத்தும் காலப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מְצָאוֹ
  choice: அவனை வந்தடைந்த
  rationale: מצא என்பதன் ‘கண்டடைதல்/வந்தடைதல்’ என்ற எபிரேய உருவகத்தைத் தமிழில் புரியத்தக்கவாறு காக்கிறது.
- source_word: רָע
  choice: தீமை
  rationale: இங்கு ஒழுக்கத் தீமையைவிட கேடு அல்லது துன்பநிலையைக் குறித்தாலும், רָע என்பதன் அகன்ற மற்றும் சுருக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது; பொருள் தெளிவுக்கான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: தன்னை வெறுப்பவனின் அழிவில் மகிழ்ந்ததாக யோபு மறுக்கும் அறநெறி நுணுக்கம்
  choice: அழிவைக் கண்டு ‘மகிழ்தல்’ மற்றும் தீமை வந்தபோது ‘களிகூர்தல்’ என்று மொழிபெயர்த்து, பிறருடைய கேட்டில் தவறான மகிழ்ச்சி கொள்ளும் கருத்தை வெளிப்படுத்துதல்
  alternative: ‘பகைவனின் பேரிடரில் மகிழ்ந்து, அவனுக்கு கேடு நேர்ந்தபோது எக்காளித்தேன்’ போன்ற தீவிரமான மொழியாக்கம்
  rationale: எபிரேயம் பிறருடைய கேட்டில் எழும் மிகுதியான மகிழ்ச்சியை உணர்த்துகிறது; ஆனால் வெளிப்படையான இகழ்ச்சி அல்லது பழிவாங்கும் நோக்கத்தைச் சொல்லவில்லை. ஆகவே அறநெறி அழுத்தம் காக்கப்பட்டு, அதற்கு மேற்பட்ட நோக்கம் பிரதான உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இரண்டு இணையான நிபந்தனைத் தொடர்களின் கவிதைச் சமநிலை காக்கப்பட்டுள்ளது; அடுத்த வசனத்தில் நிறைவுபெறும் சுயசாப உறுதிமொழித் தொடரைக் குறிக்க இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
