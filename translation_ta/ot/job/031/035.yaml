- source_word: וְסֵפֶר
  choice: குற்றச்சாட்டை எழுத்தில்
  rationale: סֵפֶר என்பதன் அடிப்படைப் பொருள் எழுதப்பட்ட ஆவணம் அல்லது சுருள். இச்சட்டச் சூழலில் அந்த ஆவணத்தின் செயல்பாடு குற்றச்சாட்டைப் பதிவு செய்வதாக இருப்பதால் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: כָּתַב
  choice: எழுத்தில் தரட்டும்
  rationale: வடிவில் நிறைவுற்ற வினையாக இருந்தாலும், விருப்பத் தொடரில் இதை வேண்டுகோள் பொருளில் புரிந்துகொள்ளலாம். எழுத்துப்பூர்வமான குற்றச்சாட்டை அளிப்பதை நவீன தமிழில் இயல்பாகக் கூறுகிறது; வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִישׁ רִיבִי
  choice: என்மீது வழக்குத் தொடுப்பவர்
  rationale: சொல்லர்த்தமாக ‘என் வழக்கின் மனிதர்’ அல்லது ‘என் வாத எதிரி.’ இங்கு யோபுக்கு எதிராக வழக்கு முன்வைப்பவரின் சட்டப் பங்கைத் தெளிவாகக் காட்டுகிறது.
