  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: ta
  text: எனக்குச் செவிகொடுப்பவர் ஒருவர் இருந்தால் எவ்வளவு நன்றாயிருக்கும்! இதோ, என் கையொப்பம்[a]; எல்லாம் வல்லவர் எனக்குப் பதிலளிக்கட்டும்; என்மீது வழக்குத் தொடுப்பவர் தமது குற்றச்சாட்டை எழுத்தில் தரட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் குறி” அல்லது “என் அடையாளம்.” யோபு தன் அறிக்கையை உறுதிப்படுத்த இட்ட சான்றுக் குறியை எபிரெயச் சொல் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'இன்னொரு வாசிப்பு: “என் வழக்கெதிரி எழுதிய ஆவணம்.” எபிரெயில் சொல்லர்த்தமாக, “என் வழக்கின் மனிதர் எழுதிய ஓர் ஆவணம்” என்று உள்ளது; இச்சூழலில் அது யோபுக்கு எதிரான எழுத்துப்பூர்வக் குற்றச்சாட்டைக் குறிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: எவ்வளவு நன்றாயிருக்கும்
  rationale: இந்த எபிரெய மொழிவழக்கு நேரடியான கேள்வி அல்ல; தீவிரமான விருப்பத்தை வெளிப்படுத்துகிறது. நவீன தமிழில் இயல்பான விருப்ப வாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֹׁמֵעַ לִי
  choice: எனக்குச் செவிகொடுப்பவர் ஒருவர்
  rationale: யோபுவின் முறையீட்டைக் கேட்டு விசாரிப்பவரைக் குறிக்கிறது. ‘செவிகொடுப்பவர்’ என்பது கேட்பதையும் அவரது வழக்கைக் கவனிப்பதையும் இயல்பாகத் தெரிவிக்கிறது.
