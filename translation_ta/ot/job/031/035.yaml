- source_word: תָּוִי
  choice: என் கையொப்பம்
  rationale: תָּו என்பது அடையாளம் அல்லது குறி; இங்கு யோபு தன் அறிக்கையை உறுதிப்படுத்தும் குறியாகப் பயன்படுகிறது. ‘கையொப்பம்’ அதன் சட்டச்சூழல் செயல்பாட்டை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: யோபு நூலில் வரும் שַׁדַּי என்ற தெய்வீகப் பட்டத்தை இயல்பான, மரியாதையான தமிழில் வழங்குகிறது.
- source_word: יַעֲנֵנִי
  choice: எனக்குப் பதிலளிக்கட்டும்
