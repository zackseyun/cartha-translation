  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: ta
  text: ஏனெனில், கடவுளிடமிருந்து வரும் பேரழிவு எனக்குத் திகிலாக இருந்தது[a]; அவருடைய மாட்சிமையால் என்னால் நிற்க முடியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் பேரழிவு எனக்குப் பெரும் அச்சமாக இருந்தது.” எபிரெயச் சொற்றொடர் நேரடியாக “கடவுளின் பேரழிவு” என்று மொழிபெயர்க்கப்படலாம்; ஆனால் கடவுளிடமிருந்து வரும் பேரழிவு என்பதே இங்கு பெரும்பாலும் பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய உயர்வால் என்னால் இயலவில்லை.” இங்குள்ள பெயர்ச்சொல் உயர்வு, மேன்மை, அல்லது மாட்சிமையைக் குறிக்கலாம்; வினைச்சொல் பொதுவாக “இயலுதல்” என்று பொருள்படும். அதன் நிரப்புப் பொருள் மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலுக்கு ஏற்ப “தாங்குதல்” அல்லது “நிலைநிற்றல்” எனப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோபு கூறிய ஒழுக்கக் கட்டுப்பாட்டிற்கான காரணத்தை இது அறிமுகப்படுத்துகிறது.
- source_word: פַחַד
  choice: திகில்
  rationale: இது வெறும் அச்ச உணர்வைவிடக் கடுமையான அச்சத்தையும் நடுக்கத்தையும் குறிக்கும் பெயர்ச்சொல்.
- source_word: אֵלַי
  choice: எனக்கு
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் உள்ள முன்னிடைச்சொல், இந்தத் திகில் யோபைத் தனிப்பட்ட முறையில் சார்ந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵיד
  choice: பேரழிவு
  rationale: அழிவை உண்டாக்கும் விபத்து அல்லது கேட்டை இச்சொல் குறிக்கிறது; சூழலில் வரவிருக்கும் தெய்வீகத் தீர்ப்பின் தீவிரத்தை ‘பேரழிவு’ வெளிப்படுத்துகிறது.
- source_word: אֵל
  choice: கடவுளிடமிருந்து வரும்
  rationale: אֵיד אֵל என்ற இணைப்பு, கடவுளால் வரும் பேரழிவு என்ற பொருளில் இயல்பாகப் புரிகிறது; எபிரெய வடிவை பெயராக ஒலிபெயர்ப்பதைவிட இது தெளிவானது.
- source_word: וּמִשְּׂאֵתוֹ
  choice: அவருடைய மாட்சிமையின் காரணமாக
  rationale: שְׂאֵת உயர்வு, மேன்மை அல்லது மாட்சிமையைக் குறிக்கலாம்; prefixed מִן இங்கு காரணத் தொடர்பைக் குறிக்கிறது என்று முதன்மை உரை எடுத்துக்கொள்கிறது.
- source_word: לֹא אוּכָל
  choice: என்னால் எதிர்த்து நிற்க முடியவில்லை
  rationale: יכל இயலுதல் அல்லது ஆற்றல் பெற்றிருத்தலைக் குறிக்கிறது. சூழலில் கடவுளுடைய மாட்சிமைக்கு எதிராக நிலைநிற்க இயலாமை என்ற கருத்தை இது இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லின் திறந்த தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: אֵל என்பதை பொதுவான தெய்வக் குறிப்பாக மொழிபெயர்த்தல்
  choice: கடவுள்
  alternative: வல்லமையுள்ளவர்; ஏல்
  rationale: இவ்வசனம் தனிப்பெயர் வடிவத்தைப் பாதுகாக்க வேண்டிய கட்டாயமின்றி தெய்வீகத் தீர்ப்பையும் மாட்சிமையையும் குறிப்பிடுகிறது. ‘கடவுள்’ என்பது கூடுதல் சமயப் பிரிவு சார்ந்த கருத்தைச் சேர்க்காத தெளிவான நவீனத் தமிழ்.
- issue: யோபுவின் நடத்தையைக் கட்டுப்படுத்திய உந்துதல்
  choice: கடவுளிடமிருந்து வரும் பேரழிவின் திகிலும் அவரது மாட்சிமைக்கு முன் நிற்க இயலாமையும் அவரைக் கட்டுப்படுத்தின
  alternative: தண்டனையைப் பற்றிய சுயநல அச்சம் மட்டும்; கடவுளின் உயர்வைப் பற்றிய கருத்தியல் அச்சம் மட்டும்
  rationale: வசனம் தெய்வீகப் பேரழிவைப் பற்றிய அச்சத்தையும் கடவுளின் மாட்சிமைக்கு முன் உள்ள இயலாமையையும் ஒன்றாக வைத்திருக்கிறது; இவற்றில் ஒன்றாக மட்டும் கருத்தைக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பேரழிவு,’ ‘திகில்,’ ‘மாட்சிமை’ ஆகிய சொற்கள் மூலத்தின் தீவிரத்தையும் உயர்ந்த நடையையும் காக்கின்றன. மூலத்தில் வெளிப்படையாகக் கூறப்படாத வினையின் நிரப்புப் பொருளை முதன்மை உரை ‘எதிர்த்து நிற்க’ எனச் சூழல்படி வெளிப்படுத்துகிறது; அதன் இலக்கணத் திறந்த தன்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
