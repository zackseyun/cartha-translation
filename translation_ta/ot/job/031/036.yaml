translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. சுமத்தல் மற்றும் அணிதல் ஆகிய இரட்டை உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
