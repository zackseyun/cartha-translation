  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: ta
  text: உறுதியாக, அதை என் தோள்மேல் சுமப்பேன்; அதை ஒரு கிரீடம்போல்[a] அணிந்துகொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கிரீடங்கள்’ என்று பன்மையில் உள்ளது; இது வலியுறுத்தும் பன்மையாக இருக்கலாம், ஆகவே ‘ஒரு கிரீடம்போல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: உறுதியாக
  rationale: இங்கு நிபந்தனையைக் காட்டாமல், யோபுவின் உறுதிமொழிச் சூழலில் வலியுறுத்தும் உறுதிப்பாடாக வருகிறது.
- source_word: עַל שִׁכְמִי
  choice: என் தோள்மேல்
  rationale: எபிரெய மூலத்தின் ஒருமையையும், குற்றச்சாட்டை வெளிப்படையாகச் சுமக்கும் உருவகத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: אֶשָּׂאֶנּוּ
  choice: அதை ... சுமப்பேன்
  rationale: נשׂא என்ற வினையின் இச்சூழலுக்குரிய சுமத்தல் அல்லது எடுத்துச் செல்லுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶעֶנְדֶנּוּ
  choice: அதை ... அணிந்துகொள்வேன்
  rationale: ஆபரணத்தைத் தன்னிடம் கட்டிக்கொள்வது அல்லது அணிவது என்ற வினையின் பொருளை இயல்பாகவும் உருவகத்துக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: עֲטָרוֹת
  choice: ஒரு கிரீடம்போல்
  rationale: மூலத்தில் பன்மை வடிவம் இருந்தாலும், அது தீவிர அல்லது தொகுப்புப் பன்மையாக இருக்கக்கூடும்; தமிழில் உவமை இயல்பாக அமைய ஒருமை பயன்படுத்தப்பட்டு, மூலப் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִי
  choice: என்மேல்
  rationale: ענד வினையுடன் வரும் இச்சொல், யோபு அதைத் தானே அணிந்துகொள்வதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
