source:
  edition: WLC
  text: וּ/מֶ֤ה חֵ֣לֶק אֱל֣וֹהַּ מִ/מָּ֑עַל וְֽ/נַחֲלַ֥ת שַׁ֝דַּ֗י מִ/מְּרֹמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: ta
  text: மேலே இருக்கும் கடவுளிடமிருந்து வரும் பங்கும்[a], உயரங்களில் இருக்கும் எல்லாம் வல்லவரிடமிருந்து வரும் சுதந்தரமும் என்ன?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலிருந்து வரும் கடவுளின் பங்கும், உயரங்களிலிருந்து வரும் எல்லாம் வல்லவரின் சுதந்தரமும்.” எபிரெயச் சொற்றொடர்கள், பங்கும் சுதந்தரமும் மேலிருந்து வருவதை வலியுறுத்துவதாகவும் எடுத்துக்கொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: என்ன?
  rationale: וְ என்ற இணைப்பின் தொடர்ச்சியையும் மָה என்ற வினாவின் வலிமையையும், இணையான இரு கூறுகளை ஒரே வினாவாக அமைப்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: ஒருவருக்கு ஒதுக்கப்படும் பங்கு அல்லது பங்கீட்டை குறிக்கும் பொதுவான, இயல்பான தமிழ்ச் சொல்; இணையாக வரும் ‘உரிமைப்பங்கு’ என்பதுடனும் பொருந்துகிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் வரும் கடவுளைக் குறிக்கும் ஒருமை கவிதைச் சொல்லுக்கு நேரான நவீனத் தமிழ் இணை.
- source_word: מִמָּעַל
  choice: மேலிருந்து
  rationale: விண்ணக மூலத்தைக் குறிக்கும் ‘மேலிருந்து’ என்ற அடிப்படை வினையடைப் பொருளைப் பாதுகாக்கிறது.
- source_word: וְנַחֲלַת
  choice: உரிமைப்பங்கும்
  rationale: நַחֲלָה என்பது சுதந்தரமாக அல்லது ஒதுக்கீடாகக் கிடைக்கும் உடைமைப் பங்கைக் குறிக்கிறது. இங்கு ‘சுதந்தரம்’ காலத்திற்கேற்ற இயல்பான பொருளைத் தெளிவாகத் தராததால் ‘உரிமைப்பங்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான பொருளைத் தமிழில் மொழிபெயர்க்கிறது.
- source_word: מִמְּרֹמִים
  choice: உயரங்களிலிருந்து
  rationale: மூலத்தின் பன்மை வடிவத்தையும் மீண்டும் வரும் ‘இருந்து’ என்ற மூலப்பொருளையும் காக்கிறது; ‘வானத்திலிருந்து’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கவிதையில் வரும் இரண்டு தெய்வீகப் பெயரீடுகள்
  choice: אֱלוֹהַּ என்பதை ‘கடவுள்’ என்றும் שַׁדַּי என்பதை ‘எல்லாம் வல்லவர்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘கடவுள் … ஷத்தாய்’ என்று இரண்டாவதை ஒலிபெயர்த்தல்
  rationale: இரண்டு தெய்வீகப் பெயரீடுகளின் இணை அமைப்பை வாசகருக்குத் தெளிவாக வைத்திருக்கிறது; எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்காமல் பட்டத்தின் பொருளைத் தருகிறது.
- issue: מִמָּעַל மற்றும் מִמְּרֹמִים ஆகியவற்றின் இலக்கணத் தொடர்பு
  choice: அவை கடவுளிடமிருந்து வரும் பங்கு மற்றும் உரிமைப்பங்கின் விண்ணக மூலத்தைச் சுட்டுவதாக மொழிபெயர்த்தல்
  alternative: ‘மேலே இருக்கும் கடவுள்’ மற்றும் ‘உயரங்களில் இருக்கும் எல்லாம் வல்லவர்’ என்று தெய்வீகப் பெயரீடுகளை விவரிப்பதாக எடுத்தல்
  rationale: மீண்டும் வரும் מִן முன்னொட்டு மூலத்தைக் குறிக்கும் வாசிப்பை இயல்பாக ஆதரிக்கிறது; அதேவேளை எபிரெயக் கவிதையில் உள்ள தொடர்பின் நெகிழ்வை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் அமைக்கப்பட்டுள்ளது. இணையான இரு அரையடிகளும் ஒரே வினாவாகத் தக்கவைக்கப்பட்டுள்ளன. ‘அளிக்கும்’ என்பது எபிரெய மொழியின் ‘இருந்து’ என்ற மூலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்தச் சேர்க்கப்பட்ட வினை; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
