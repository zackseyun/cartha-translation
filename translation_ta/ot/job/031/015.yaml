  text: הֲֽ֝/לֹא בַ֭/בֶּטֶן עֹשֵׂ֣/נִי עָשָׂ֑/הוּ וַ֝/יְכֻנֶ֗/נּוּ בָּ/רֶ֥חֶם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: ta
  text: கருப்பையில் என்னை உண்டாக்கியவர், அவனையும் உண்டாக்கவில்லையா? ஒருவரே எங்களைக் கருப்பையில் உருவாக்கவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே கருப்பையில் எங்களை உருவாக்கவில்லையா?” எபிரெயில் ‘ஒருவர்’ என்பதை உருவாக்குபவராகப் புரிந்துகொள்ளலாம்; அல்லது ‘ஒரே’ என்பதை ‘கருப்பை’யுடன் இணைத்தும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: உண்டாக்கவில்லையா? … உருவாக்கவில்லையா?
  rationale: உறுதியான ‘ஆம்’ பதிலை எதிர்பார்க்கும் எபிரெய மறுப்புக் கேள்வியை இயல்பான தமிழ் கேள்வி வடிவில் தருகிறது.
- source_word: בַבֶּטֶן
  choice: கருப்பையில்
  rationale: இச்சூழலில் בטן பொதுவான ‘வயிறு’ என்பதைக் காட்டிலும், பிறப்புக்கு முன் உருவாக்கப்படும் இடமான கருப்பையைக் குறிக்கிறது.
- source_word: עֹשֵׂנִי
  choice: என்னை உண்டாக்கியவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெய வினையெச்சத்தின் தனிப்பட்ட வினை வலிமையைத் தக்கவைக்கிறது; ‘என் படைப்பாளர்’ என்று பட்டப்பெயராக மாற்றவில்லை.
- source_word: עָשָׂהוּ
  choice: அவனையும் உண்டாக்க
  rationale: முந்தைய வசனங்களில் வரும் வேலைக்காரனைச் சுட்டும் ஆண்பால் ஒருமைப் பின்னொட்டைத் தக்கவைக்கிறது; ‘-உம்’ இருவரையும் ஒரே படைப்புச் செயலுடன் இணைக்கிறது.
- source_word: וַיְכֻנֶנּוּ
  choice: எங்களை … உருவாக்க
  rationale: כונן இங்கு கருப்பையில் வடிவமைத்தல் அல்லது உருவாக்குதல் என்ற பொருளைக் கொண்டது; பின்னொட்டு இருவரையும் உள்ளடக்கும் முதலாம் நபர் பன்மையாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: בָּרֶחֶם
  choice: கருப்பையில்
  rationale: רחם என்பதன் குறிப்பான உடலியல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶחָד
  choice: ஒருவரே
  rationale: אחד என்பதை ‘ஒருவர்’ என்ற எழுவாயாகப் புரிந்துகொள்வது எபிரெய சொற்றொடரின் இயல்பான சாத்தியத்தைத் தக்கவைத்து, இருவரையும் உருவாக்கியவர் ஒருவரே என்ற கருத்தை வெளிப்படுத்துகிறது. இதை ‘ஒரே கருப்பையில்’ என இணைத்துப் புரிந்துகொள்ளும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இரண்டாம் நபரின் குறிப்பு
  choice: ‘அவன்’ என்பது உடனடிச் சூழலில் யோபின் ஆண் வேலைக்காரனைச் சுட்டுகிறது.
  alternative: இது பொதுவாக எந்தச் சக மனிதருக்கும் பொருந்தும் கூற்றாக விரிவுபடுத்தப்படலாம்.
  rationale: யோபு 31:13–14 அவரது ஆண், பெண் வேலைக்காரர்களின் வழக்கைப் பற்றிப் பேசுகிறது. எபிரெய ஆண்பால் ஒருமையை மொழிபெயர்ப்பு காக்கிறது; பொதுவான மனித சமத்துவத்தை விளக்கவுரையாகச் சேர்க்கவில்லை.
- issue: אֶחָד என்பதன் இலக்கணத் தொடர்பும் பொதுவான படைப்புத் தோற்றமும்
  choice: ‘ஒருவரே எங்களைக் கருப்பையில் உருவாக்கவில்லையா?’—אֶחָד என்பதை உருவாக்கிய ஒருவரைக் குறிக்கும் எழுவாயாக எடுத்துக்கொள்கிறது.
  alternative: ‘ஒரே கருப்பையில் எங்களை உருவாக்கவில்லையா?’—אֶחָד என்பதை רֶחֶם உடன் இணைத்துப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெயில் இரு புரிதல்களுக்கும் இடமுள்ளது. முதன்மை வாசகம் ஒரே படைப்பாளரைக் குறிக்கும் இயல்பான வாசிப்பை வழங்குகிறது; மாற்று வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது. ‘ஒரே கருப்பை’ என்பது யோபுவுக்கும் வேலைக்காரனுக்கும் ஒரே உயிரியல் தாய் இருந்ததாகக் கட்டாயப்படுத்தாமல், பகிர்ந்த மனிதத் தோற்றத்தைக் கவிதைமுறையில் கூறுவதாகப் புரிந்துகொள்ள வேண்டும்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உண்டாக்கு’ முதல் வரியின் עשה சொல்லைத் தொடர்கிறது; ‘உருவாக்கு’ כונן சொல்லின் வடிவமைத்தல் நுணுக்கத்தை வெளிப்படுத்துகிறது. மறுப்புக் கேள்வியின் வலிமையும் மூலத்தில் உள்ள இலக்கணத் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
