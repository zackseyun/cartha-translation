base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: ta
  text: நான் பொய்மையோடு நடந்திருந்தால்[b], என் கால் வஞ்சகத்தை நோக்கி விரைந்திருந்தால்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் கால் வஞ்சகத்தைப் பின்தொடர்ந்து விரைந்திருந்தால்.’ எபிரேய முன்னிடைச்சொல் ‘நோக்கி,’ ‘பின்தொடர்ந்து’ என்ற திசைப் பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நடப்பது’ என்பது ஒருவரின் நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: நடந்திருந்தால் / விரைந்திருந்தால்
  rationale: எபிரெய வாக்கியத்தை யோபுவின் குற்றமற்ற நிலையை உறுதிப்படுத்தும் நிபந்தனைத் தொடராக இயல்பான தமிழில் அமைக்கிறது.
- source_word: הָלַכְתִּי
  choice: நான் ... நடந்திருந்தால்
  rationale: ‘நடத்தல்’ என்ற நேரடிப் படிமத்தையும், ஒருவரின் வாழ்க்கை நடத்தை என்ற எபிரெய மரபுத்தொடரின் பொருளையும் காக்கிறது.
- source_word: עִם
  choice: -ஓடு
  rationale: பொய்மையுடன் கொண்ட தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׁוְא
  choice: பொய்மை
  rationale: இச்சொல்லுக்கு வெறுமை, பயனின்மை, பொய் ஆகிய பொருள் நிழல்கள் இருந்தாலும், இணைவரியில் வரும் ‘வஞ்சகம்’ காரணமாக இங்கு ஒழுக்கநெறி சார்ந்த ‘பொய்மை’ பொருத்தமானது.
- source_word: וַתַּחַשׁ
  choice: விரைந்திருந்தால்
  rationale: விரைந்து செல்லுதல் என்ற வினையின் பொருளையும், ‘என் கால்’ எழுவாயாக வரும் உயிர்ப்பூட்டப்பட்ட கவிப்படிமத்தையும் காக்கிறது.
- source_word: עַל
  choice: நோக்கி
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் இலக்கை நோக்கிய திசையைச் சுட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது; வேறு சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: מִרְמָה
  choice: வஞ்சகம்
  rationale: ஏமாற்றும் அல்லது மோசடியான நடத்தையைப் பொதுவாகக் குறிக்கிறது; தேவையின்றி ஒரு குறிப்பிட்ட வகை மோசடியாகக் குறுக்கவில்லை.
- source_word: רַגְלִי
  choice: என் கால்
  rationale: எபிரெய மூலத்தின் ஒருமையையும், ஒருவரின் நடவடிக்கையை அவரது கால் விரைவதாகச் சித்தரிக்கும் கவிப்படிமத்தையும் தக்கவைக்கிறது.
