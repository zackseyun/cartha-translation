lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உறுதிமொழிக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: הוא
  choice: அது
  rationale: முந்தைய சூழலில் பேசப்பட்ட பாலியல் முறைகேட்டைச் சுட்டுகிறது; மூலத்தின் சுட்டுப்பெயர் அமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: זִמָּה
  choice: ஓர் இழிவான செயல்
  rationale: குறிப்பாக பாலியல் சூழலில் கடுமையாகக் கண்டிக்கத்தக்க ஒழுக்கக்கேடான செயலைக் குறிக்கிறது; நவீன தமிழில் கண்ணியமாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְהִיא
  choice: அது
  rationale: முன்னர் குறிப்பிடப்பட்ட செயலையே தொடர்ந்து சுட்டுகிறது; தமிழில் பாலின இயைபு இல்லாததால் இயல்பாக மீண்டும் ‘அது’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: עָוֺן
  choice: குற்றம்
  rationale: இங்கு ஒழுக்கக் குற்றத்தையும் அதனால் உண்டாகும் சட்டப்பூர்வப் பொறுப்பையும் குறிக்கிறது; நீதித்துறைச் சூழலில் ‘குற்றம்’ இயல்பாக உள்ளது.
- source_word: פְּלִילִים
  choice: நீதிபதிகள் விசாரித்துத் தண்டிக்க வேண்டிய
  rationale: இந்தச் சொல்லின் நீதித்துறை சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நீதிபதிகளுக்குரிய’ என்ற சொற்படியான மொழியாக்கத்தைவிட குற்றம் நீதிமன்றத் தீர்ப்புக்கு உட்பட்டது என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: פְּלִילִים என்பதன் துல்லியமான நீதித்துறை நுணுக்கம்
  choice: நீதிபதிகள் விசாரித்துத் தண்டிக்க வேண்டிய குற்றம்
  alternative: நீதிபதிகளுக்குரிய அக்கிரமம் / நீதித்தீர்ப்புக்குரிய குற்றம்
  rationale: சொல் நீதிபதிகளையோ நீதித்தீர்ப்பையோ சுட்டக்கூடும். முதன்மை உரை நீதிமன்ற விசாரணை மற்றும் தண்டனைக்குரிய குற்றம் என்ற சூழல்பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் கடுமையான ஒழுக்க மதிப்பீடும் நீதித்துறைத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
