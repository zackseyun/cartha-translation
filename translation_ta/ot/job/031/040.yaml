source:
  edition: WLC
  text: תַּ֤חַת חִטָּ֨ה יֵ֥צֵא ח֗וֹחַ וְ/תַֽחַת שְׂעֹרָ֥ה בָאְשָׁ֑ה תַּ֝֗מּוּ דִּבְרֵ֥י אִיּֽוֹב׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: ta
  text: கோதுமைக்குப் பதிலாக முட்செடிகள் முளைக்கட்டும்; வாற்கோதுமைக்குப் பதிலாக துர்நாற்றமுள்ள களை[a] முளைக்கட்டும். யோபுவின் வார்த்தைகள் முடிவடைந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீய களை” அல்லது “தீங்கு விளைவிக்கும் களை”; எபிரெயச் சொல் குறிக்கும் குறிப்பிட்ட தாவரம் எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: …க்குப் பதிலாக
  rationale: இங்கு நிலத்தின் கீழுள்ள இடத்தைக் குறிக்காமல், விரும்பத்தக்க பயிருக்குப் பதிலாக தீய செடிகள் தோன்றும் மாற்றீட்டைக் குறிக்கிறது.
- source_word: חִטָּה
  choice: கோதுமை
  rationale: குறிப்பிடப்பட்ட தானியப் பயிருக்கான இயல்பான, நிலையான தமிழ் சொல்.
- source_word: יֵצֵא
  choice: முளைக்கட்டும்
  rationale: அடிப்படைப் பொருள் ‘வெளியே வருதல்’ என்றாலும், செடிகளைப் பற்றிய சூழலில் நிலத்திலிருந்து முளைத்து வருவதை இயல்பாகக் குறிக்கிறது; இரண்டாம் இணைத் தொடரிலும் விடுபட்டுள்ள வினைச்சொல் இதே பொருளில் நிரப்பப்பட்டுள்ளது.
- source_word: חוֹחַ
  choice: முட்செடிகள்
  rationale: தீங்கு தரும் முட்களுள்ள தாவரத்தைப் பொதுவாகக் குறிக்கிறது; ‘முட்செடிகள்’ என்பது வேளாண்மைச் சாபத்தின் காட்சியைத் தெளிவாகத் தருகிறது.
- source_word: שְׂעֹרָה
  choice: வாற்கோதுமை
  rationale: இந்தத் தானியத்திற்கான நவீன நிலையான தமிழ் பெயர்.
- source_word: בָאְשָׁה
  choice: துர்நாற்றமுள்ள களை
  rationale: தீய நாற்றத்தோடு தொடர்புடைய எபிரெயச் சொல்லின் பொருளை வெளிப்படுத்துகிறது; குறிப்பிட்ட தாவர இனம் உறுதியற்றதால் பொதுவான ‘களை’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּמּוּ
  choice: முடிவடைந்தன
  rationale: யோபுவின் உரைகள் இத்துடன் நிறைவுறுவதைச் சுருக்கமாகவும் கண்ணியமாகவும் குறிக்கும் நிறைவுக் கூற்று.
- source_word: דִּבְרֵי אִיּוֹב
  choice: யோபுவின் வார்த்தைகள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பிரதிபலித்து, இது யோபின் சொற்களுக்கான நிறைவுக் குறிப்பாக இருப்பதைப் பாதுகாக்கிறது.
