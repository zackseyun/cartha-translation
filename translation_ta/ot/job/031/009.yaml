lexical_decisions:
- source_word: נִפְתָּה
  choice: கவரப்பட்டிருந்தால்
  rationale: நிஃபால் வடிவிலுள்ள இந்த வினைச்சொல் கவரப்படுதல், மயக்கப்படுதல், வசப்படுத்தப்படுதல் ஆகிய பொருள்களைத் தரலாம். பாலியல் சோதனையின் சூழலில், உள்ளார்ந்த ஈர்ப்பை இயல்பாகத் தெரிவிக்கவும் பெண்ணின் செயற்பாட்டை அளவுக்கு மீறி வலியுறுத்தாமல் இருக்கவும் ‘கவரப்பட்டிருந்தால்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִבִּי
  choice: என் உள்ளம்
  rationale: எபிரெய ‘இதயம்’ என்பது விருப்பம், எண்ணம், நோக்கம் உள்ளிட்ட அக மனிதனைச் சுட்டுகிறது. தமிழில் ‘என் உள்ளம்’ அந்த நெறிசார் அகநிலையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַל אִשָּׁה
  choice: ஒரு பெண்ணிடம்
  rationale: עַל என்ற முன்னிடைச்சொல் இங்கு கவர்ச்சியின் நோக்கு அல்லது தொடர்பைச் சுட்டுகிறது. ‘ஒரு பெண்ணிடம்’ என்பது ‘பெண்ணால்’ என்று அவள்மீது காரணப் பொறுப்பைச் சுமத்தாமல், பெண்ணை நோக்கிய ஈர்ப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: פֶּתַח
  choice: வாசலில்
  rationale: இந்தச் சூழலில் வீட்டு நுழைவிடத்தையோ கதவண்டையையோ குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல் ‘வாசல்’ ஆகும்.
- source_word: רֵעִי
  choice: என் அயலானின்
  rationale: רֵעַ என்பதற்கு அயலான், நண்பன், தோழன் என்று பொருள் வரலாம். இங்குள்ள சமூக மற்றும் நெறிசார் சூழலில் ‘அயலான்’ விரிவான உறவைக் காட்டுகிறது; தேவையற்ற தனிப்பட்ட நட்பை ஊகிக்கவில்லை.
- source_word: אָרָבְתִּי
  choice: நான் பதுங்கிக் காத்திருந்தால்
  rationale: இந்த வினைச்சொல் மறைவாக, தீய அல்லது முறைகேடான நோக்கத்துடன் காத்திருப்பதை உணர்த்துகிறது. ‘பதுங்கிக் காத்திருந்தால்’ அதன் திட்டமிட்ட இரகசியத் தன்மையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விபசாரத்தைப் பற்றிய யோபுவின் ஆணையின் நெறிசார் அமைப்பு
  choice: உள்ளார்ந்த கவர்ச்சியிலிருந்து அயலானின் வாசலில் திட்டமிட்டுப் பதுங்கிக் காத்திருக்கும் செயலுக்குச் செல்லும் முன்னேற்றத்தைப் பாதுகாத்தல்.
  alternative: இதை வெறும் காதல் ஈர்ப்பாக மென்மைப்படுத்துதல் அல்லது நேரடியாக விபசார முயற்சி என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய உரை அக விருப்பத்தையும் மறைவான வெளிச்செயலையும் இணைக்கிறது. அதன் நெறிசார் தீவிரத்தைப் பாதுகாக்க வேண்டும்; அதேவேளையில் உரையில் வெளிப்படையாக இல்லாத செயல் விவரங்களைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘உள்ளம்’ என்ற சொல் எபிரெய மனிதவியல் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது; ‘பதுங்கிக் காத்திருந்தால்’ மறைவான, திட்டமிட்ட நோக்கத்தைத் தெளிவாக்குகிறது. வசனம் அடுத்த வரியோடு தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
