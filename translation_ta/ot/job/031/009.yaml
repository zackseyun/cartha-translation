    rationale: In modern standard Tamil, ‘ஒரு பெண்ணிடம்’ normally suggests location, interaction, or possession (‘with/to a woman’). ‘ஒரு பெண்ணின்பால்’ naturally denotes attraction or inclination toward a woman and avoids making her the active cause of the enticement.
