  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: ta
  text: 'தங்கத்தை நான் என் நம்பிக்கையாக வைத்திருந்தால்,

    தூய தங்கத்திடம்[a], ‘நீயே என் பாதுகாப்பு[b]’ என்று சொல்லியிருந்தால்—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய தங்கம்’ என்பது כֶּתֶם என்ற எபிரெயச் சொல்லை மொழிபெயர்க்கிறது; அது சுத்திகரிக்கப்பட்ட அல்லது உயர்தரத் தங்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் நம்பிச் சாருவது’ (מִבְטַחִי).
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: என்றால்
  rationale: யோபுவின் குற்றமற்ற நிலையை உறுதிப்படுத்தும் நிபந்தனை வடிவிலான ஆணையுரையின் முன்னுரையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: שַׂמְתִּי
  choice: வைத்திருந்தால்
  rationale: שׂים என்பதன் ‘வை/அமை’ என்ற அடிப்படைப் பொருளையும், தங்கத்தை நம்பிக்கையின் பொருளாக ஆக்கிய விளைவுப் பொருளையும் இவ்விடத்தில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זָהָב
  choice: தங்கத்தை
  rationale: எபிரெயச் சொல்லின் நேரான, பொதுவாகப் புரியும் மொழிபெயர்ப்பு.
- source_word: כִּסְלִי
  choice: என் நம்பிக்கையாக
  rationale: כֶּסֶל இங்கு நம்பிக்கை, எதிர்பார்ப்பு அல்லது சார்பு என்பதைக் குறிக்கலாம். ‘நம்பிக்கை’ செல்வத்தின் மீது வைத்த சார்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלַכֶּתֶם
  choice: தூய தங்கத்திடம்
  rationale: כֶּתֶם சுத்திகரிக்கப்பட்ட அல்லது தூய தங்கத்தைக் குறிக்கிறது; ל முன்னொட்டு ‘சொல்லுதல்’ வினையின் மறைமுகச் செயப்படுபொருளைச் சுட்டுவதால் ‘-த்திடம்’ பயன்படுத்தப்பட்டது.
- source_word: אָמַרְתִּי
  choice: சொல்லியிருந்தால்
  rationale: முந்தைய நிபந்தனையுடன் இணைந்த எபிரெய நிறைவேற்ற வினையைத் தமிழின் எதிர்நிகழா நிபந்தனைத் தொடரில் இயல்பாகக் காட்டுகிறது.
- source_word: מִבְטַחִי
  choice: என் பாதுகாப்பு
  rationale: מִבְטָח என்பது ஒருவர் நம்பிச் சாரும் பாதுகாப்பு அல்லது நம்பிக்கைக்குரிய பொருளைக் குறிக்கிறது. முந்தைய ‘நம்பிக்கை’ என்பதையே மீண்டும் கூறாமல் மூலத்தின் சொல்வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: செல்வத்தில் நம்பிக்கை வைத்ததாக யோபு மறுப்பதை மொழிபெயர்த்தல்
  choice: ‘தங்கத்தை நான் என் நம்பிக்கையாக வைத்திருந்தால்...’ என்ற நிபந்தனை வடிவம்
  alternative: ‘தங்கத்தின்மேல் நான் நம்பிக்கை வைத்திருந்தால்...’
  rationale: யோபுவின் குற்றமற்ற தன்மையை வலியுறுத்தும் ஆணையுரை போன்ற நிபந்தனை அமைப்பையும், செல்வத்தை நம்பிச் சார்வதை அவர் மறுக்கும் அறவியல்-இறையியல் வலிமையையும் இது காக்கிறது; பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவித்துவச் செறிவும் கொண்ட நடை. எபிரெய இணை அமைப்பைக் காக்க இரண்டு வரிகளாக வழங்கப்பட்டுள்ளது. ‘நம்பிக்கை’ மற்றும் ‘பாதுகாப்பு’ மூலம் כִּסְלִי / מִבְטַחִי ஆகிய இரு சொற்களின் நுண்ணிய வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; முடிவிலுள்ள நீண்ட கோடு அடுத்த வசனங்களில் தொடரும் நிபந்தனை ஆணையுரையைக் குறிக்கிறது.
