  text: מִסְפַּ֣ר צְ֭עָדַ/י אַגִּידֶ֑/נּוּ כְּמוֹ נָ֝גִ֗יד אֲקָרֲבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: ta
  text: என் அடிகளின் எண்ணிக்கையை[a] அவரிடம்[b] அறிவிப்பேன்; ஒரு தலைவனைப் போல[c] அவரை அணுகுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அடிகளைப் பற்றிய கணக்கை.”
    reason: lexical_alternative
  - marker: b
    text: “அவர்” என்பது இச்சூழலில் கடவுளையோ யோபுவின்மீது குற்றஞ்சாட்டுபவரையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “ஓர் ஆட்சியாளனைப் போல” அல்லது “ஓர் உயர்குடியினனைப் போல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: எண்ணிக்கையை
  rationale: இந்தப் பெயர்ச்சொல் ‘எண்’ அல்லது ‘கணக்கு’ என்பதைக் குறிக்கிறது. ‘என் அடிகளின் எண்ணிக்கை’ என்பது எபிரெயரின் உருவகத்தை நேரடியாகக் காக்கிறது; வாழ்வின் நடத்தையைப் பற்றிய முழுக் கணக்கு என்ற உட்பொருளை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: צְעָדַי
  choice: என் அடிகள்
  rationale: இது சொற்பொருளில் ஒருவர் எடுத்து வைக்கும் அடிகளைக் குறிக்கிறது; அதேவேளையில் அவரது நடத்தை அல்லது வாழ்க்கைப் போக்கையும் உருவகமாகக் குறிக்க முடியும். ‘அடிகள்’ இரு நிலைகளையும் காக்கிறது.
- source_word: אַגִּידֶנּוּ
  choice: அவரிடம் அறிவிப்பேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘அறிவி, தெரிவி’ எனப் பொருள்படும். மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டைச் சூழலுக்கு ஏற்றவாறு மறைமுகச் செயப்படுபொருளாகக் கொண்டு, முறையான நீதிமன்றத் தொனியை ‘அறிவிப்பேன்’ காக்கிறது.
- source_word: כְּמוֹ
  choice: போல
  rationale: ஒப்புமையைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான நவீனத் தமிழ்ச் சமமான சொல்.
- source_word: נָגִיד
  choice: ஒரு தலைவன்
  rationale: இச்சொல் தலைவன், ஆட்சியாளர், அதிபதி போன்ற உயர்நிலையிலுள்ள ஒருவரைக் குறிக்கலாம். ‘தலைவன்’ அரசனின் மகன் என்ற குறுகிய பொருளைத் தவிர்த்து, யோபுவின் கண்ணியத்தையும் துணிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲקָרֲבֶנּוּ
  choice: அவரை அணுகுவேன்
  rationale: קרב என்பதன் இவ்வடிவம் அருகில் செல்லுதல் அல்லது அணுகுதல் என்பதைக் குறிக்கிறது. தனிப்பட்ட ஆண்பால் ஒருமை பின்னொட்டையும், விசாரணைக்காகத் துணிவுடன் நெருங்கும் தொனியையும் இம்மொழிபெயர்ப்பு காக்கிறது.
theological_decisions:
- issue: ‘அவரிடம் அறிவிப்பேன்,’ ‘அவரை அணுகுவேன்’ என்பவற்றிலுள்ள ஆண்பால் ஒருமைக் குறிப்பின் சுட்டுப்பொருள்
  choice: ‘அவர்’ என்று மட்டும் மொழிபெயர்த்து, வசனத்துக்குள்ளேயே சுட்டுப்பொருளை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: ‘கடவுள்’ அல்லது ‘என்மீது குற்றஞ்சாட்டுபவர்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: அருகிலுள்ள சூழலில் யோபு தனது எதிரி எழுதிய குற்றப்பத்திரத்தையும், பதிலளிக்கத் தயாராயிருப்பதையும் பேசுகிறார். எபிரெய உரை இங்கு அந்த நபரைப் பெயரிட்டுக் குறிப்பிடாததால், இறையியல் சார்ந்த பதற்றத்தையும் இரு சாத்தியங்களையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான மற்றும் உறுதியான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது மரியாதையான பொதுச் சுட்டுப்பெயராக இருந்து, அது கடவுளைக் குறிக்கிறதா குற்றஞ்சாட்டுபவரைக் குறிக்கிறதா என்ற மூலமொழியின் தெளிவின்மையைப் பாதுகாக்கிறது.
