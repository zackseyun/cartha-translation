  yaml_path: translation/ot/job/031/008.yaml
  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: ta
  text: அப்படியானால், நான் விதைக்கட்டும்; வேறொருவன் உண்ணட்டும்; என் சந்ததியினர் வேரோடு பிடுங்கப்படட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் விளைபொருள் வேரோடு பிடுங்கப்படட்டும்.” எபிரெயச் சொல் சந்ததியையோ நிலத்திலிருந்து முளைத்து வரும் விளைபொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: நான் விதைக்கவும்
  rationale: זרע என்பதன் Qal cohortative வடிவம் இங்குள்ள சுயசாபச் சூழலில் விருப்ப/சாபப் பொருளைக் கொண்டது; தொடரின் இறுதியில் வரும் ‘செய்வார்களாக’ அந்த வலிமையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְאַחֵר
  choice: வேறொருவன்
  rationale: אַחֵר என்பதன் ‘மற்றொருவர்’ என்ற பொருளைச் சுருக்கமாகத் தருவதோடு, விதைப்பவனுக்கும் பயனை அனுபவிப்பவனுக்கும் உள்ள முரண்பாட்டைக் காக்கிறது.
- source_word: יֹאכֵל
  choice: உண்ணவும்
  rationale: אכל என்பதன் நேரடியான ‘உண்’ என்ற வேளாண்மைச் சூழலுக்குரிய படிமத்தைக் காக்கிறது.
- source_word: וְצֶאֱצָאַי
  choice: என் சந்ததியினர்
  rationale: צֶאֱצָא என்பது சந்ததி அல்லது விளைபொருள் என இருவகையாகக் குறிக்கலாம். பிரதான உரையில் மனித/குடும்பப் பொருளைத் தேர்ந்தெடுத்து, உண்மையான சொற்பொருள் ஐயத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: יְשֹׁרָשׁוּ
  choice: வேரோடு பிடுங்கப்படவும் செய்வார்களாக
  rationale: שׁרשׁ என்பதன் Piel வடிவம் வேரறுக்கப்படுதல்/வேரோடு பிடுங்கப்படுதல் என்ற தீவிரமான விளைவைத் தருகிறது; தமிழ் வடிவம் வேர் படிமத்தையும் சுயசாபத் தொனியையும் காக்கிறது.
theological_decisions:
- issue: צֶאֱצָא குறிக்கும் மனிதச் சந்ததியா அல்லது நிலத்தின் விளைச்சலா
  choice: பிரதான உரையில் ‘என் சந்ததியினர்’
  alternative: ‘என் விளைச்சல்’
  rationale: இரு பொருள்களும் எபிரெயச் சொல்லுக்குச் சாத்தியம். அருகிலுள்ள ‘வேரோடு பிடுங்கப்படுதல்’ மனிதச் சந்ததியை வேர் உருவகத்தின் மூலம் குறிப்பிட இயலும்; அதே நேரம் முந்தைய விதைத்தல்–உண்ணுதல் வேளாண்மைப் பொருளையும் ஆதரிக்கிறது. ஆகவே பிரதான உரை ஒரு சாத்தியத்தைத் தேர்ந்து, மாற்றுப் பொருளை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சுயசாப வாக்கியமாக வடிவமைக்கப்பட்டது. ‘விதைக்க’, ‘உண்ண’, ‘வேரோடு பிடுங்கப்பட’ ஆகிய சொற்கள் மூலத்தின் வேளாண்மை மற்றும் வேர் படிமங்களைப் பாதுகாக்கின்றன.
