source:
  edition: WLC
  text: בְּ֭רִית כָּרַ֣תִּי לְ/עֵינָ֑/י וּ/מָ֥ה אֶ֝תְבּוֹנֵ֗ן עַל בְּתוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: ta
  text: என் கண்களோடு ஓர் உடன்படிக்கை செய்துகொண்டேன்; அப்படியிருக்க, ஒரு கன்னிப்பெண்ணை நான் எப்படி உற்றுப் பார்ப்பேன்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அப்படியிருக்க, ஒரு கன்னிப்பெண்ணை நான் ஏன் உற்றுப் பார்க்க வேண்டும்?”'
    reason: וּמָה என்பதை இங்கு ‘எப்படி’ என்பதற்குப் பதிலாக ‘ஏன்’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: கட்டுப்படுத்தும் தன்மையுள்ள, முறையான உறுதிப்பாட்டைக் குறிக்கும் எபிரெயச் சொல்லின் கனத்த பொருளையும் ‘உடன்படிக்கை செய்தல்’ என்ற சொல்லிணைப்பையும் இது காக்கிறது.
- source_word: כָּרַתִּי
  choice: செய்துகொண்டேன்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘வெட்டினேன்’ என்றாலும், בְּרִית உடன் இது ‘உடன்படிக்கை செய்தல்’ என்ற மரபுத்தொடர். தன் மீது ஏற்றுக்கொண்ட உறுதி என்பதால் ‘செய்துகொண்டேன்’ இயல்பாக உள்ளது.
- source_word: לְעֵינַי
  choice: என் கண்களோடு
  rationale: கண்களை அந்த உறுதிப்பாட்டின் தொடர்புடைய தரப்பாகச் சித்தரிக்கும் மூலமொழியின் உருவகத்தைத் தமிழில் இயன்றவரை காக்கிறது.
- source_word: וּמָה
  choice: அப்படியிருக்க ... எப்படி
  rationale: முந்தைய உடன்படிக்கையிலிருந்து வரும் விளைவை இயல்பான தமிழில் உணர்த்துகிறது. இது ‘ஏன்’ என்ற கேள்வியாகவும் புரிந்துகொள்ளப்படலாம்; அந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶתְבּוֹנֵן
  choice: உற்றுப் பார்ப்பேன்
  rationale: சாதாரணமாக ஒரு கணம் பார்ப்பதைவிட, கவனமாக அல்லது தொடர்ந்து நோக்குவதை வினைச்சொல் குறிக்கிறது.
- source_word: עַל
  choice: -ஐ
  rationale: பார்த்தல் என்னும் தமிழ்வினையுடன் நோக்கப்படும் பொருளை நேரடி வேற்றுமையில் குறிப்பிடுவது இயல்பான தமிழ் நடை.
- source_word: בְּתוּלָה
  choice: ஒரு கன்னிப்பெண்
  rationale: திருமணமாகாத, கன்னித்தன்மையுள்ள பெண்ணைக் குறிக்கும் முதன்மைப் பொருளைத் தெளிவாகவும் நவீன தமிழிலும் தருகிறது.
theological_decisions:
- issue: இரண்டாம் வாக்கியத்தின் கேள்வி நெறிசார் இயலாமையையா அல்லது நோக்கமின்மையையா வலியுறுத்துகிறது
  choice: ‘எப்படி உற்றுப் பார்ப்பேன்?’ என்று மொழிபெயர்த்து, உடன்படிக்கையின் விளைவாக அத்தகைய பார்வை பொருந்தாதது என்ற உணர்வைக் காத்தல்
  alternative: ‘ஏன் உற்றுப் பார்க்க வேண்டும்?’
  rationale: וּמָה சூழலில் ‘எப்படி’ அல்லது ‘ஏன்’ என்ற இரு நுணுக்கங்களையும் தாங்கக்கூடும். முதன்மை உரை விளைவை முன்னிறுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கண்களோடு உடன்படிக்கை’ என்ற மூலமொழி உருவகம் தளர்த்தப்படாமல் காக்கப்பட்டுள்ளது; ‘உற்றுப் பார்க்க’ என்பது திட்டமிட்ட, நீடித்த பார்வையை உணர்த்துகிறது.
