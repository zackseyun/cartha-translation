  source_fidelity: மூல எபிரெய உரையின் கருத்தும் அமைப்பும் துல்லியமாகக் காக்கப்பட்டுள்ளன. בְּרִית כָּרַתִּי என்பதற்கு ‘உடன்படிக்கை செய்துகொண்டேன்’ பொருத்தமானது; לְעֵינַי என்பதிலுள்ள கண்களை நோக்கிய/கண்களோடு கொண்ட உறுதியின் உருவகமும் காக்கப்படுகிறது. אֶתְבּוֹנֵן என்பதன் கவனமான, நோக்கமுள்ள பார்வையை ‘உற்றுப் பார்ப்பேன்’ நன்றாக வெளிப்படுத்துகிறது. וּמָה-வின் ‘எப்படி’/‘ஏன்’ என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது.
