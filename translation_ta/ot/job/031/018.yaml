  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: ta
  text: ஏனெனில், என் இளமை முதல் அவன் என்னை ஒரு தந்தையைப் போல் வளர்த்தான்;[a] என் தாயின் கருவிலிருந்தே நான் அவளை வழிநடத்தினேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயச் சொற்றொடர் கடினமானது. இதை, “அவன் என்னோடு, தந்தையுடன் இருப்பதுபோல் வளர்ந்தான்” என்றோ, “நான் அவனை ஒரு தந்தையைப் போல் வளர்த்தேன்” என்றோ புரிந்துகொள்வோரும் உண்டு. முதல் அரையடியில் யோபு திக்கற்றவனைப் பராமரித்ததைப் பற்றிப் பேசுகிறார் என்றும் சிலர் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: “அவளை” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட விதவையைக் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோபு கூறிய மறுப்புக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: מִנְּעוּרַי
  choice: என் இளமைமுதல்
  rationale: இளமைப் பருவத்தில் தொடங்கி நீடித்த காலத்தைக் குறிக்கும் எபிரெய காலத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גְּדֵלַנִי
  choice: அவன் என்னை வளர்த்தான்
  rationale: மசோரா உயிர்க்குறியீட்டின்படி, முதலாம் நபர் ஒருமை பின்னொட்டுடன் வரும் இவ்வினைச்சொல்லின் நேரடியான இலக்கண வடிவத்தைப் பாதுகாக்கிறது; சொற்றொடர் கடினமானதாக இருப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְאָב
  choice: ஒரு தந்தையைப்போல்
  rationale: כְּ என்னும் ஒப்புமைக் கூறையும் אָב என்பதன் பொதுவான பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: என் தாயின் கருவிலிருந்தே
  rationale: வாழ்க்கையின் மிக ஆரம்பத்திலிருந்தே என்பதைக் குறிக்கும் மூலமொழியின் காலவழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: אַנְחֶנָּה
  choice: நான் அவளை வழிநடத்தினேன்
  rationale: נחה என்பதன் ஹிஃபில் முதலாம் நபர் ஒருமை வடிவத்தையும் மூன்றாம் நபர் பெண்பால் ஒருமைப் பின்னொட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வசனத்தின் இரு அரையடிகளிலும் குறிப்பிடப்படுபவர் மாறுதல்
  choice: முதல் அரையடியில் ஆண்பால் ஒருமையையும் இரண்டாம் அரையடியில் பெண்பால் ஒருமையையும் அப்படியே வைத்தல்
  alternative: இரு அரையடிகளையும் யோபு திக்கற்ற பிள்ளையையும் விதவையையும் வாழ்நாள் முழுவதும் பராமரித்ததாக விளக்கிச் சீராக்குதல்
  rationale: மூல எபிரெயத்தில் உள்ள ஆண்பால்–பெண்பால் மாற்றம் திட்டவட்டமாகத் தெரிகிறது. அதன் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்காமல், சுட்டுப்பெயர்களை அப்படியே பாதுகாக்கிறது.
- issue: גְּדֵלַנִי என்ற கடினமான முதல் அரையடியின் பொருள்
  choice: மசோரா உரையின் நேரடியான வடிவத்தைப் பின்பற்றி ‘அவன் என்னை … வளர்த்தான்’ என மொழிபெயர்த்தல்
  alternative: ‘அவன் என்னோடு, ஒரு தந்தையிடத்தில் வளர்வதுபோல் வளர்ந்தான்’ அல்லது ‘நான் அவனை ஒரு தந்தையைப்போல் வளர்த்தேன்’
  rationale: மெய்யெழுத்து உரையும் உயிர்க்குறியீடும் பலவாறு விளக்கப்பட்டுள்ளன. உரையை அமைதியாகத் திருத்தாமல் நேரடி வாசிப்பை முதன்மை உரையில் வைத்து, முக்கிய மாற்று வாசிப்புகளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. மூலவசனத்தின் அசாதாரணமான சுட்டுப்பெயர் மாற்றமும் கடினமான முதல் அரையடியும் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; புரிதலுக்கு உதவும் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
