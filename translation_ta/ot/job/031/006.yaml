    text: 'வேறு விதமாக: ‘நீதியின் தராசுகளில்’ அல்லது ‘நேர்மையான தராசுகளில்.’'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு விதமாக: ‘என் குற்றமின்மையை’ அல்லது ‘என் கபடமின்மையை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: அவர் என்னை எடைபோடட்டும்
  rationale: שקל என்பதன் Qal முற்றுப்பெறா வினை இங்கு விருப்பம் அல்லது அழைப்பை வெளிப்படுத்தும் பொருளில் வருகிறது. ‘எடைபோடட்டும்’ என்பது யோபு தன்னை ஆய்வுக்கு உட்படுத்த அழைக்கும் தராசு உருவகத்தையும் அந்த வினை வலிமையையும் நேரடியாகக் காக்கிறது.
- source_word: בְּמֹאזְנֵי צֶדֶק
  choice: நியாயமான தராசில்
  rationale: מֹאזְנַיִם என்பது தராசைக் குறிக்கிறது; צֶדֶק இங்கு நீதியான, நேர்மையான, பக்கச்சார்பற்ற அளவீட்டைக் குறிக்கலாம். ‘நியாயமான தராசில்’ என்பது உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְיֵדַע
  choice: அறியட்டும்
  rationale: இணைப்புச் சொல்லைத் தொடர்ந்து வரும் முற்றுப்பெறா வினை, முந்தைய விருப்ப வினையின் வலிமையைத் தொடரக்கூடும். ‘அறியட்டும்’ அந்த இணையான விருப்பநிலையைப் பாதுகாக்கிறது.
- source_word: אֱלוֹהַּ
  choice: இறைவன்
  rationale: אֱלוֹהַּ என்பது யோபு நூலில் பொதுவாக வரும் கவிதைநடையிலான ஒருமைச் சொல். ‘இறைவன்’ என்பது தேவையற்ற விரிவாக்கமின்றி அதன் பொருளையும் கண்ணியமான நடையையும் தருகிறது.
- source_word: תֻּמָּתִי
  choice: என் உத்தமத்தை
  rationale: תֻּמָּה என்பது முழுமை, குற்றமின்மை அல்லது ஒழுக்க நேர்மை ஆகிய பொருள்களைத் தரலாம். ‘உத்தமம்’ யோபின் ஒழுக்கநேர்மைக் கோரிக்கையைத் தெரிவிக்கிறது; முழுமையான பாவமின்மையை மொழிபெயர்ப்பிலேயே தீர்மானித்து விடுவதில்லை.
theological_decisions:
- issue: யோபு தன்னை விவரிக்கும் சொல்லின் வலிமை
  choice: என் உத்தமத்தை
  alternative: என் குற்றமின்மையை / என் கபடமற்ற தன்மையை
  rationale: யோபு நீதியான இறை மதிப்பீட்டைக் கோருகிறார். ‘உத்தமம்’ அவரது நேர்மைக் கோரிக்கையைப் பாதுகாக்கும் அதே நேரத்தில், அவர் முழுமையாகப் பாவமற்றவர் என்ற கருத்தைத் தேவையின்றி இறுக்கமாக்காது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘எடைபோடட்டும்’ என்ற நேரடி உருவகம் எளிதில் புரியக்கூடியது; ‘நியாயமான தராசு’ நீதியான பரிசோதனை என்ற நீதிமன்றத் தொனியையும் காக்கிறது. மூலத்தின் இரு விருப்ப வினைகளும் ‘-ட்டும்’ வடிவில் இணையாக வைக்கப்பட்டுள்ளன.
