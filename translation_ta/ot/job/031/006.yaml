  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: ta
  text: நியாயமான தராசுகளில்[a] இறைவன் என்னை எடைபோடட்டும்; என் நேர்மையை[b] அவர் அறியட்டும்.
  philosophy: optimal-equivalence
  footnotes:
