  text: הֲ/לֹא ה֭וּא יִרְאֶ֣ה דְרָכָ֑/י וְֽ/כָל צְעָדַ֥/י יִסְפּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: ta
  text: அவர் என் வழிகளைக் காண்கிறார் அல்லவா? என் அடிகள் அனைத்தையும் எண்ணுகிறார் அல்லவா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் என் நடத்தையைக் கவனித்து, என் அடிகள் அனைத்தையும் கணக்கிடுகிறார் அல்லவா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் ஒரே வினாவாக இருந்தாலும், தமிழின் ஓட்டத்திற்காக இரு இணையான வினாக்களிலும் இது இடம்பெறுகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: சூழலில் குறிப்பிடப்படுபவர் தேவன்; மரியாதையையும் இயல்பான தமிழ்ப் பயன்பாட்டையும் காக்க ‘அவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது. தனிப்பெயர் மூலத்தில் இல்லாததால் ‘தேவன்’ என்று விரிவாக்கப்படவில்லை.
- source_word: יִרְאֶה
  choice: காண்கிறார்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காண்’ என்பதையும், தெய்வீகக் கண்காணிப்பை விளக்கவுரையாக்காமல் உள்ளபடியே காட்டும் உருவகத்தையும் காக்கிறது.
- source_word: דְרָכָי
  choice: என் வழிகளை
  rationale: பன்மையையும் எபிரெய உருவகத்தையும் காக்கிறது; இது ஒருவரின் நடத்தை அல்லது வாழ்க்கைப் போக்கையும் குறிக்கக்கூடும் என்ற பொருள் அகலத்தைத் திறந்தே வைக்கிறது.
- source_word: וְכָל
  choice: அனைத்தையும்
  rationale: כָל என்பதின் முழுமைப்படுத்தும் வலிமையை இயல்பான தமிழில் தருகிறது; இரண்டு வாக்கியங்களாக அமைந்ததால் וְ தனியே ‘மற்றும்’ என வெளிப்படுத்தப்படாமல் இணையான அமைப்பால் அதன் தொடர்பு தக்கவைக்கப்படுகிறது.
- source_word: צְעָדַי
  choice: என் அடிகள்
  rationale: தனித்தனி நடைகளையோ செயல்களையோ குறிக்கக்கூடிய நடை உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: יִסְפּוֹר
  choice: எண்ணுகிறார்
  rationale: ספר என்பதன் நேரடியான ‘எண்ணுதல்’ என்ற பொருளைத் தருகிறது; ‘கணக்கில் எடுத்துக்கொள்கிறார்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: மனிதச் செயல்களால் வர்ணிக்கப்படும் தெய்வீக அறிவு
  choice: தேவன் யோபின் வழிகளைக் காண்கிறார், அவரது அடிகள் அனைத்தையும் எண்ணுகிறார் என்ற சொல்லோவியத்தை நேரடியாகக் காத்தல்
  alternative: அவர் என் நடத்தையைக் கவனித்து, என் செயல்கள் அனைத்தையும் கணக்கில் வைத்திருக்கிறார் அல்லவா?
  rationale: மூல எபிரெயம் ‘காணுதல்’, ‘எண்ணுதல்’ என்ற தெளிவான மனிதச்செயல் உருவகங்களைப் பயன்படுத்துகிறது. அவற்றை ‘சர்வஞானம்’ போன்ற கருத்தியல் மொழியாக விரிவாக்காமல், வசனத்தின் இறையியல் வலிமையையும் இயல்பான பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடை. எபிரெயத்தின் ஒரே சொல்லாட்சிவினா தமிழில் இயல்பாக ஒலிக்க இரண்டு இணையான வினாக்களாக அமைக்கப்பட்டுள்ளது. ‘வழிகள்’, ‘அடிகள்’, ‘காண்கிறார்’, ‘எண்ணுகிறார்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
