  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: ta
  text: அவர்கள் எல்லைக் கற்களை இடம் மாற்றுகிறார்கள்[a]; மந்தையைக் கவர்ந்து, அதை மேய்க்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லைக் கற்களை அகற்றுகிறார்கள்.” எபிரெய வினை, மற்றவரின் நிலத்திற்குள் அத்துமீறுவதற்காக நில எல்லைக் குறிகளை நகர்த்துவதையோ அகற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மந்தையைத் திருடி, அதை மேய்க்கிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: எல்லைக் கற்கள்
  rationale: இங்கு பன்மைச் சொல் நிலத்தின் உரிமை எல்லையைக் குறிக்கும் கண்கூடான அடையாளக் கற்களைக் குறிப்பதாகச் சூழல் காட்டுகிறது. நவீன தமிழில் “எல்லைக் கற்கள்” என்பது சட்ட, சமூகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יַשִּׂיגוּ
  choice: இடம் மாற்றுகிறார்கள்
  rationale: நிலத்தை அபகரிப்பதற்காக எல்லைக் குறிகளை நகர்த்துதல் அல்லது அகற்றுதல் என்பதே இச்சூழலின் பொருள். “இடம் மாற்றுகிறார்கள்” என்பது செயலைத் தெளிவாகச் சொல்கிறது; முற்றிலும் அகற்றுவதையும் இது கட்டாயப்படுத்துவதில்லை.
- source_word: עֵדֶר
  choice: மந்தை
  rationale: இந்த ஒருமைத் தொகுப்புப்பெயர் பொதுவாக ஆடு அல்லது கால்நடை மந்தையைக் குறிக்கிறது. விலங்கின் வகையை மூலவாக்கியம் குறிப்பிடாததால் “மந்தை” எனப் பொதுவாக வைக்கப்பட்டுள்ளது.
- source_word: גָּזְלוּ
  choice: கொள்ளையடித்து
  rationale: வலுக்கட்டாயமாகவோ சட்டவிரோதமாகவோ பறித்துக்கொள்ளும் பொருளை இது வெளிப்படுத்துகிறது. வெறும் மறைவான திருட்டு என்று பொருளைக் குறுக்காமல், அநீதியான அபகரிப்பின் வன்மையைப் பாதுகாக்கிறது.
- source_word: וַיִּרְעוּ
  choice: அதை மேய்க்கிறார்கள்
  rationale: רעה என்ற வினை மந்தையை மேய்த்தல் அல்லது பராமரித்தல் எனப் பொருள்படும். கொள்ளையடித்த மந்தையைத் தங்களுடையதுபோல் வெளிப்படையாக மேய்க்கும் செயலை இத்தேர்வு இயல்பாகக் காட்டுகிறது.
