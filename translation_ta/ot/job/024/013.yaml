  terminology: ‘ஒளி,’ ‘கலகம்,’ ‘வழிகள்,’ ‘பாதைகள்’ ஆகியவை பொருத்தமானவை. ‘அதன்’ என்பது எபிரெய ஒருமை ஆண்பால் பின்னொட்டுகளை ஒளியோடு இணைத்து, தேவையற்ற ஆளுருவாக்கத்தைத் தவிர்க்கிறது. அடிக்குறிப்புகள் அந்தத் தேர்வையும் இறந்தகால மாற்றுவாசிப்பையும் சரியாகப் பாதுகாக்கின்றன.
