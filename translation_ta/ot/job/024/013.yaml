  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: ta
  text: இவர்கள் ஒளிக்கு எதிராகக் கலகம் செய்பவர்களில் அடங்கியவர்கள்[a]; அதன் வழிகளை அவர்கள் அறிந்துகொள்வதில்லை[b]; அதன் பாதைகளில் அவர்கள் தங்குவதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் ஒளிக்கு எதிராகக் கலகம் செய்பவர்களில் அடங்கியிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இறந்தகாலமாக வாசிக்கப்படலாம்; எனினும், இந்தக் கவிதைச் சூழலில் அது தொடர்ந்து காணப்படும் ஒரு வகை மனிதர்களை விவரிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல் “அவனுடைய வழிகள் ... அவனுடைய பாதைகள்” என்று உள்ளது. அந்த ஒருமை ஆண்பால் பின்னொட்டுகள் மிக இயல்பாக “ஒளி” என்பதையே சுட்டுகின்றன; ஆகவே தமிழில் “அதன் வழிகள் ... அதன் பாதைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: இவர்கள்
  rationale: தனித்து நிற்கும் வலியுறுத்தல் சுட்டுப்பெயர்; சூழலில் குறிப்பிடப்படும் ஒரு வகை மனிதர்களைச் சுட்டிக்காட்டும் தன்மையை “இவர்கள்” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָיוּ
  choice: சேர்ந்தவர்கள்
  rationale: வடிவில் இது “இருந்தார்கள்” என்ற இறந்தகால வினை. ஆனால் ஞானக் கவிதையில் ஒரு தொடர்ச்சியான மனித வகையை விவரிக்கும் பொதுநிலைப் பொருள் இருப்பதால், தமிழில் நிகழ்நிலை வகுப்புச் சேர்க்கையாக மொழிபெயர்க்கப்பட்டுள்ளது; இறந்தகால வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּמֹרְדֵי
  choice: கலகம் செய்கிறவர்களைச் சேர்ந்தவர்கள்
  rationale: בְּ முன்னொட்டும் செய்பெயர் வடிவும் ஒரு குழுவில் அடங்குதலைக் குறிக்கின்றன. “கலகம் செய்கிறவர்கள்” என்பது מרד என்பதன் செயற்பாட்டுத் தன்மையைக் காக்கிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது. இங்கு ஒளிக்கு இயற்பொருளும் அறநெறி சார்ந்த பொருளும் இருக்கக்கூடும்; மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் நிர்ணயிக்கவில்லை.
- source_word: לֹא הִכִּירוּ
  choice: அறிந்துகொள்வதில்லை
  rationale: הכיר என்பது அறிதல், அடையாளம் காணுதல், ஏற்றுக்கொள்ளுதல் ஆகிய நிழற்பொருள்களைக் கொண்டது. “வழிகள்” என்ற செயப்படுபொருளோடு “அறிந்துகொள்வதில்லை” இயல்பாக இருந்து, உணராமை அல்லது ஒப்புக்கொள்ளாமை என்ற இடைவெளியை முழுமையாக மூடாது.
- source_word: דְרָכָיו
  choice: அதன் வழிகள்
  rationale: மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு, அருகிலுள்ள ஒருமை ஆண்பால் பெயர்ச்சொல்லான אוֹר (“ஒளி”) என்பதையே மிக இயல்பாகச் சுட்டுகிறது. தமிழின் “அதன்” தேவையற்ற ஆளுருவாக்கத்தைத் தவிர்க்கிறது.
- source_word: וְלֹא יָשְׁבוּ
  choice: நிலைத்திருப்பதுமில்லை
  rationale: ישב என்பதற்கு உட்காருதல், குடியிருத்தல், தங்குதல், நிலைத்திருத்தல் ஆகிய பொருள்கள் உண்டு. “பாதைகளில்” என்பதோடு இங்கு நேரடியாக உட்கார்வதைவிட அவற்றில் தொடர்ந்து இருப்பதே கருத்து; “நிலைத்திருத்தல்” அந்த உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: בִּנְתִיבֹתָיו
  choice: அதன் பாதைகளில்
  rationale: נתיבה என்பது பாதை அல்லது தடம். “பாதைகள்” என்பது “வழிகள்” என்பதுடனான கவிதை இணைப்பைக் காக்கும் போதும், வேறுபட்ட எபிரெயச் சொல்லையும் தமிழில் வேறுபடுத்துகிறது. பின்னொட்டு “ஒளி” என்பதைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
theological_decisions:
- issue: “அதன்/அவனுடைய வழிகள்” மற்றும் “அதன்/அவனுடைய பாதைகள்” என்பவற்றிலுள்ள பின்னொட்டுகளின் குறிப்பு
  choice: பின்னொட்டுகள் “ஒளி” என்பதைக் குறிப்பதாகக் கொண்டு, “அதன் வழிகள்” மற்றும் “அதன் பாதைகள்” என்று மொழிபெயர்த்தல்.
  alternative: மறைமுகமாகக் குறிக்கப்படும் ஓர் ஆளைக் குறிப்பதாகக் கொண்டு, “அவனுடைய வழிகள்” மற்றும் “அவனுடைய பாதைகள்” என்று மொழிபெயர்த்தல்.
  rationale: அருகிலுள்ள இலக்கண முன்னிலைச் சொல் ஒருமை ஆண்பாலான אוֹר (“ஒளி”). வசனத்தின் உருவகமும் ஒளிக்கு எதிரான கலகத்தை மையப்படுத்துகிறது. “அதன்” என்பது எபிரெயம் வெளிப்படையாகச் செய்யாத இறையியல் ஆளுருவாக்கத்தைத் தமிழில் சேர்க்காமல், அறநெறி சார்ந்த ஒலிப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “கலகம்,” “வழிகள்,” “பாதைகள்” ஆகியவை மூலத்தின் தீவிரத்தையும் உருவக இணைப்பையும் காக்கின்றன. நிகழ்நிலை வாசிப்பு முதன்மை உரையில் தரப்பட்டு, வடிவியல் இறந்தகால வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
