  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: ta
  text: அப்படி இல்லையென்றால், யார் என்னைப் பொய்யன் என்று நிரூபித்து, என் சொல்லை ஒன்றுமில்லாததாக்க முடியும்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא אֵפוֹ
  choice: அப்படி இல்லையென்றால்
  rationale: முந்தைய வாதங்கள் உண்மையல்ல எனில் தன்னை மறுத்துக் காட்டுமாறு விடுக்கும் நிபந்தனைச் சவாலை இயல்பான நவீனத் தமிழில் தருகிறது; אֵפוֹ-வின் வாதத் தொடர்ச்சி இந்த அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: מִי
  choice: யார்
  rationale: வலியுறுத்தும் சொல்லாட்சிக் கேள்வியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יַכְזִיבֵנִי
  choice: என்னைப் பொய்யன் என்று நிரூபித்து
  rationale: כזב என்பதன் ஹிஃபில் வடிவம் ‘பொய்யன் எனக் காட்டுதல் / பொய்யென நிரூபித்தல்’ என்ற தனிப்பட்டதும் வாதரீதியானதுமான வலிமையைக் கொண்டது; வெறும் ‘மறுத்து’ என்பதைவிட இதைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וְיָשֵׂם לְאַל
  choice: ஒன்றுமில்லாமல் ஆக்க
  rationale: ‘வைத்து/அமைத்து’ என்ற சொல்லைச் சொற்சொல்லாக மொழிபெயர்க்காமல், இங்கு வரும் ‘செல்லாததாக்குதல், ஒன்றுமில்லாததாக்குதல்’ என்ற விளைவை இயல்பாகத் தருகிறது.
- source_word: מִלָּתִי
  choice: என் சொல்லை
  rationale: ‘சொல், கூற்று, உரை’ எனப் பொருள்படும் ஒருமைச் சொல்லின் சுருக்கத்தையும் யோபின் வாதத்தின் எடையையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான சொல்லாட்சி. எபிரெய உரையின் சுருக்கமான சவால் வடிவமும் இரண்டு இணை வினைகளின் வாத வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
