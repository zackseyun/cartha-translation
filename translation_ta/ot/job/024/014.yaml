  text: לָ/א֡וֹר יָ֘ק֤וּם רוֹצֵ֗חַ יִֽקְטָל עָנִ֥י וְ/אֶבְי֑וֹן וּ֝/בַ/לַּ֗יְלָה יְהִ֣י כַ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: ta
  text: விடியற்காலையில் கொலைகாரன் எழுகிறான்[a]; ஏழையையும் வறியவனையும் கொல்கிறான்[b]; இரவிலோ அவன் திருடனைப்போல் இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒளி வரும்போது’ / ‘ஒளியுடன்’; எபிரெயம் எழுத்துப்படி ஒளியைக் குறிப்பிடுகிறது; பெரும்பாலும் விடியற்காலமே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஏழையையும் வறியவனையும் கொலை செய்கிறான்’; ‘கொலைகாரன்’ என்பதற்குப் பயன்படுத்தப்பட்ட சொல்லிலிருந்து வேறான வினைச்சொல் இங்கு எபிரெயத்தில் வருகிறது. எனவே முதன்மை உரை அந்த வேறுபாட்டைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: விடியற்காலையில்
  rationale: எழுத்துப்படி ‘ஒளிக்கு/ஒளியின்போது’ என இருந்தாலும், இங்கு ஒளி தோன்றும் நேரமான விடியற்காலையைக் குறிக்கும் காலப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָקוּם
  choice: எழுகிறான்
  rationale: קום என்பதன் Qal வடிவம் இங்கு எழுந்து செயலில் இறங்குவதைக் குறிக்கிறது; ‘எழுகிறான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: רוֹצֵחַ
  choice: கொலைகாரன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினை வடிவம், கொலை செய்கிற வகையான நபரைக் குறிக்கிறது.
- source_word: יִקְטָל
  choice: கொல்கிறான்
  rationale: இது רצח அல்ல, பொதுவாக ‘கொல்லுதல்’ எனப் பொருள்படும் קטל; ஆகவே ‘கொலைகாரன்’ என்பதுடன் ஒரே எபிரெயச் சொல்லை மீண்டும் பயன்படுத்தியதாகத் தோன்றாதவாறு வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ஏழையையும் வறியவனையும்
  rationale: சமூக ரீதியாகப் பலவீனமானவர்களைக் குறிக்கும் இரண்டு சொற்களின் இணைப்பையும் தனித்தனியாகப் பேணுகிறது.
- source_word: וּבַלַּיְלָה
  choice: இரவிலோ
  rationale: இணைப்புச் சொல்லையும் காலக் குறிப்பையும் கொண்டு, விடியற்காலைக்கும் இரவுக்கும் இடையிலான கவித்துவ எதிர்மறையை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: יְהִי
  choice: இருக்கிறான்
  rationale: היה உடன் כ வந்திருப்பதால் நிலை அல்லது பங்கை ஒப்புமையாகக் காட்டுகிறது; ‘இருக்கிறான்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: כַגַּנָּב
  choice: திருடனைப்போல்
  rationale: כ குறிக்கும் எளிய ஒப்புமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
