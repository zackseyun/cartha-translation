  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: ta
  text: அவர்கள் ஆடையின்றி[a] இரவைக் கழிக்கிறார்கள்; அவர்களுக்கு உடையும் இல்லை, குளிரில் மூடிக்கொள்ள எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் நிர்வாணமாக, உடை இல்லாமல் இரவில் தங்குகிறார்கள்; குளிரில் அவர்களுக்கு மூடிக்கொள்ள எதுவும் இல்லை.”
    reason: עָרוֹם என்பதற்கான நேரடியான ‘நிர்வாணமாக’ என்ற மாற்றையும், יָלִינוּ என்பதன் ‘இரவில் தங்குகிறார்கள்’ என்ற சொல்லமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: עָרוֹם
  choice: ஆடையின்றி
  rationale: இச்சொல் நிர்வாணமாக அல்லது போதிய ஆடையில்லாமல் இருப்பதைக் குறிக்கலாம். சூழலில் காணப்படும் வறுமையையும் அவலத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יָלִינוּ
  choice: இரவைக் கழிக்கிறார்கள்
  rationale: לין என்ற வேர்ச்சொல் இரவு தங்குதல் அல்லது இரவைக் கழித்தலைக் குறிக்கிறது; இத்தேர்வு அதன் காலப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: מִבְּלִי לְבוּשׁ
  choice: ஆடையின்றி
  rationale: இந்தச் சொற்றொடர் ஆடை இல்லாத குறைநிலையைத் தெரிவிக்கிறது. எபிரெயச் செய்யுளிலுள்ள கருத்து மறுகூறலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כְּסוּת
  choice: போர்த்திக்கொள்ள ... எதுவும்
  rationale: இச்சொல் ஆடை உட்பட உடலை மூடி பாதுகாக்கும் பொருளைக் குறிக்கிறது. குறிப்பாகப் போர்வை என்று வரையறுக்காமல் அதன் விரிவான பொருளைக் காக்கிறது.
- source_word: בַּקָּרָה
  choice: குளிரில்
  rationale: בְּ முன்னொட்டின் நேரடியான இடச்சூழல் பொருளைத் தக்கவைத்து, ‘குளிரில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘குளிரிலிருந்து’ அல்லது ‘குளிரைத் தடுக்க’ என்பதும் சூழல்சார் சாத்தியங்கள்.
