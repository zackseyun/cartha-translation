translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். மூலத்தின் வறுமைச் சித்திரம் தெளிவாக இருக்க ‘ஆடையின்றி’ பயன்படுத்தப்பட்டது. எபிரெயத்தில் உள்ள ‘நிர்வாணமாக/ஆடையின்றி’ மற்றும் ‘ஆடை இல்லாமல்’ என்ற இணையான கூறுகள் முதன்மை உரையில் இயல்பான தமிழுக்காக ஒருங்கிணைக்கப்பட்டு, அடிக்குறிப்பில் முறையான மறுகூறல் பாதுகாக்கப்பட்டுள்ளது.
