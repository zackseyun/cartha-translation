source:
  edition: WLC
  text: יִ֭גְזְלוּ מִ/שֹּׁ֣ד יָת֑וֹם וְֽ/עַל עָנִ֥י יַחְבֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/009.yaml
  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: ta
  text: அவர்கள் அனாதைக் குழந்தையை மார்பிலிருந்து பறித்துக்கொள்கிறார்கள்[a]; ஏழையிடமிருந்து பிணைப்பொருளை எடுத்துக்கொள்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அனாதைக் குழந்தையைத் தாயின் மார்பிலிருந்து பறித்துக்கொள்கிறார்கள்.” எபிரெயச் சொற்றொடர் பொருள் காணக் கடினமானது; பாலூட்டப்படும் அனாதைக் குழந்தையைக்கூட கொடியவர்கள் வலுக்கட்டாயமாகக் கொண்டுபோகிறார்கள் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: பறித்துக்கொள்கிறார்கள்
  rationale: גזל என்பது வன்முறையாகவோ அநியாயமாகவோ எடுத்துக்கொள்வதைக் குறிக்கிறது. ‘பறித்துக்கொள்கிறார்கள்’ என்பது இச்சூழலில் உள்ள வலுக்கட்டாயத்தையும் கொடுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשֹּׁד
  choice: மார்பிலிருந்து
  rationale: இங்கு கடினமான שֹׁד என்ற வடிவம், பாரம்பரியமாகத் தாயின் மார்பு அல்லது மடி என்ற பொருளில் புரிந்துகொள்ளப்படுகிறது. ‘மார்பிலிருந்து’ என்பது மூலத்தின் சுருக்கத்தையும் அதன் நிச்சயமின்மையையும் ஓரளவு காக்கிறது.
- source_word: יָתוֹם
  choice: அனாதைக் குழந்தையை
  rationale: יָתוֹם என்பது பொதுவாக அனாதை அல்லது தந்தையற்ற குழந்தையைக் குறிக்கிறது. பாலூட்டப்படும் குழந்தையைப் பற்றிய இச்சூழலில் ‘அனாதைக் குழந்தை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְעַל
  choice: ஏழையிடமிருந்து
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்/எதிராக’ என்றாலும், חבל உடன் இங்கு யாரிடமிருந்து அடைமானம் பெறப்படுகிறது என்பதைக் குறிக்கிறது. அதனால் தமிழில் ‘-இடமிருந்து’ என்பது இயல்பான உருமாற்றம்.
- source_word: עָנִי
  choice: ஏழை
  rationale: עָנִי என்பது ஏழை, துன்புறுபவர், எளியவர் எனப் பொருள்படலாம். கடன் அடைமானம் பற்றிய இணைச்சூழலில் பொருளாதார வறுமையைக் குறிக்கும் ‘ஏழை’ பொருத்தமானது.
- source_word: יַחְבֹּלוּ
  choice: அடைமானம் வாங்குகிறார்கள்
  rationale: חבל இவ்வினைவடிவில் கடனுக்காகப் பிணை அல்லது அடைமானம் பெறுவதைக் குறிக்கிறது. ‘அடைமானம் வாங்குகிறார்கள்’ என்பது சட்ட-பொருளாதாரக் கருத்தை சாதாரண நவீன தமிழில் தெளிவாகத் தருகிறது.
