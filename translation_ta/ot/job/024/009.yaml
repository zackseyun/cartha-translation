  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் அரையடியின் கடினமான எபிரெயச் சொற்றொடர் முதன்மை உரையில் சுருக்கமாக வைக்கப்பட்டு, தாயின் மார்பு என்ற விளக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
