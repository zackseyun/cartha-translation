translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவ இணைநிலையைப் பேணும் வகையில் இரண்டு அடிகளாக அமைக்கப்பட்டுள்ளது. ‘நிர்வாணமாக, உடையின்றி’ என்ற மறுகூற்று மூல எபிரெயின் வலியுறுத்தலைப் பாதுகாக்கிறது; மொழிநடை பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமாகவும் நேரடியாகவும் உள்ளது.
