source:
  edition: WLC
  text: עָר֣וֹם הִ֭לְּכוּ בְּלִ֣י לְב֑וּשׁ וּ֝/רְעֵבִ֗ים נָ֣שְׂאוּ עֹֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: ta
  text: 'அவர்கள் நிர்வாணமாக, உடையின்றி நடக்கிறார்கள்;

    பசியுடன் தானியக் கதிர்க்கட்டுகளைச்[a] சுமக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தானியக் கதிர்க்கட்டை.” எபிரெயப் பெயர்ச்சொல் ஒருமையில் உள்ளது; ஆனால் இங்கு அது தொகுப்புப் பொருளாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: நிர்வாணமாக
  rationale: ஆடையில்லாத அல்லது போதிய ஆடையில்லாத நிலையை நேரடியாகக் குறிக்கிறது; சூழலில் வர்ணிக்கப்படும் கடுமையான வறுமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִלְּכוּ
  choice: நடமாடுகிறார்கள்
  rationale: הלך என்பதன் நடப்பது அல்லது செல்வது என்ற பொருளையும், இங்கு தொடரும் வாழ்க்கைநிலையையும் நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּלִי לְבוּשׁ
  choice: உடையின்றி
  rationale: ஆடை இல்லாமையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; முந்தைய ‘நிர்வாணமாக’ என்பதுடன் எபிரெய உரையின் வலியுறுத்தும் மறுகூற்றையும் காக்கிறது.
- source_word: רְעֵבִים
  choice: பசியோடு
  rationale: மூலச்சொல்லின் ‘பசியாக’ என்ற அடிப்படைப் பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: נָשְׂאוּ
  choice: சுமக்கிறார்கள்
  rationale: அறுவடை செய்யப்பட்ட தானியக் கட்டுகளைத் தூக்கிச் செல்லும் உழைப்பை இயல்பாகக் குறிக்கிறது.
- source_word: עֹמֶר
  choice: தானியக் கதிர்க்கட்டுகளை
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும், பல தொழிலாளர்கள் சுமக்கும் அறுவடைத் தானியத்தை இங்கு தொகுப்பொருளில் குறிக்கலாம்; தமிழில் பன்மை இயல்பாக உள்ளது. ஒருமை வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
