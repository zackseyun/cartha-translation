  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: ta
  text: 'வறட்சியும் வெப்பமும் பனியின் நீரை[a] பறித்துக்கொள்வதுபோல்,

    ஷியோல்[b] பாவம் செய்தவர்களைப் பறித்துக்கொள்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பனி உருகிய நீரை.” எபிரெயத்தில் நேரடியாக, “பனியின் நீரை.”
    reason: lexical_alternative
  - marker: b
    text: “ஷியோல்” என்பது இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்; அல்லது, “கல்லறை.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: வறட்சி
  rationale: இச்சொல் வறண்ட தன்மையையோ நீரின்மையையோ குறிக்கிறது. חֹם என்பதுடன் இணைந்து செயல்படும் உருவகத்தை இயல்பான தமிழில் ‘வறட்சி’ தெளிவாகத் தருகிறது.
- source_word: גַּם
  choice: -உம் … -உம்
  rationale: இரண்டாவது கூறாகிய ‘வெப்பம்’ முதல் கூறுடன் சேர்க்கப்படுவதைத் தமிழின் இணைப்பும்மைகள் இயல்பாக வெளிப்படுத்துகின்றன; தனியாக ‘மேலும்’ என்று இடுவது இங்கு செயற்கையாக இருக்கும்.
- source_word: חֹם
  choice: வெப்பம்
  rationale: צִיָּה என்பதுடன் இணையாக வரும் இப்பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: יִגְזְלוּ
  choice: பறித்துக்கொள்
  rationale: גזל என்பது வலுக்கட்டாயமாகக் கவர்தல் அல்லது பறித்தல் என்ற வலிமையான படிமத்தைக் கொண்டது. உயிரற்ற ‘வறட்சியும் வெப்பமும்’ எழுவாய்களாக இருந்தாலும் ‘பறித்துக்கொள்’ கவிதை உருவகத்தை இயல்பாகப் பேணுகிறது.
- source_word: מֵימֵי שֶׁלֶג
  choice: பனியின் நீர்
  rationale: எபிரெயச் சொற்றொடரின் ‘பனியின் நீர்கள்’ என்ற படிமத்தைத் தமிழில் வாசிக்கத்தக்க ஒருமைத் தொகுப்புப்பொருளாகப் பேணுகிறது. ‘பனி உருகிய நீர்’ என்பது சாத்தியமான விளக்கவுரை; ஆனால் அது மூலத்தைவிட வெளிப்படையாக உள்ளது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இறந்தோரின் உலகைக் குறிக்கும் எபிரெயப் பெயர் ஒலிபெயர்ப்பாக வைக்கப்படுகிறது. இதை ‘கல்லறை’, ‘மரணம்’ அல்லது ‘நரகம்’ என்று ஒரே பொருளுக்குள் சுருக்காமல் மூலத்தின் கருத்து அகலத்தைப் பேணுகிறது.
- source_word: חָטָאוּ
  choice: பாவம் செய்தவர்கள்
  rationale: இது ‘அவர்கள் பாவம் செய்தார்கள்’ என்ற நிறைவுற்ற பன்மை வினை. விடுபட்ட வினையைத் தமிழில் நிறைவு செய்யும்போது ஷியோல் பறித்துக்கொள்ளும் நபர்களை ‘பாவம் செய்தவர்கள்’ என்று குறிப்பிடுவது அதன் வினைத் தன்மையைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் பொருள்
  choice: இறந்தோரின் உலகைக் குறிக்கும் ‘ஷியோல்’ என்ற ஒலிபெயர்ப்பு
  alternative: பாதாளம்; கல்லறை; இறந்தோரின் உலகம்; மரணம்
  rationale: கவிதை ஒப்பீட்டில் வரும் எபிரெயக் கருத்தை ஒலிபெயர்ப்பு பேணுகிறது; இதனை இறுதித் தண்டனையைக் குறிக்கும் ‘நரகம்’ போன்ற பிற்காலக் குறிப்பிட்ட இறையியல் கருத்தாக மாற்றுவதையும், வெறும் தனிப்பட்ட கல்லறையாகக் குறுக்குவதையும் தவிர்க்கிறது.
- issue: இரண்டாம் அரையடியில் விடுபட்ட வினை
  choice: முதல் அரையடியிலுள்ள ‘பறித்துக்கொள்’ என்ற வினையை ‘அதுபோல்’ என்னும் ஒப்பீட்டுடன் வெளிப்படையாகத் தொடர்தல்
  alternative: ‘ஷியோல்—பாவம் செய்தவர்கள்’ என்று எபிரெயச் சொல்லெச்சத்தை அப்படியே தெளிவின்றி விடுதல்
  rationale: எபிரெயக் கவிதையில் இரண்டாம் அரையடியின் வினை விடுபட்டு, முதல் அரையடியிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருள் தெளிவதற்காக வினை மீண்டும் சொல்லப்படுகிறது; ‘-வதுபோல்’ என்பது இரண்டு அரையடிகளின் ஒப்புமை உறவை வெளிப்படுத்துகிறது, ஆனால் ஷியோலின் இயல்பைப் பற்றி கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய செறிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பறித்துக்கொள்’ என்ற உயிரூட்டப்பட்ட படிமம் இரு அரையடிகளையும் இணைக்கிறது. ‘ஷியோல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘நரகம்’ என்ற குறிப்பிட்ட பிற்கால இறையியல் பொருள் தவிர்க்கப்பட்டுள்ளது.
