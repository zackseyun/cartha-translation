  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: ta
  text: அவர்களுடைய வரிசைகளின் நடுவே[a] அவர்கள் எண்ணெய் பிழிகிறார்கள்[b]; திராட்சை ஆலைகளில் மிதிக்கிறார்கள், ஆனாலும் தாகத்தோடு இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய சுவர்களின் நடுவே” அல்லது “அவர்களுடைய படிக்கட்டு வயல்களின் நடுவே” என்றும் கொள்ளலாம். எபிரெயச் சொல் சுவர்கள், வரிசைகள், அல்லது வேளாண்மைக்கான மதில்சூழ்ந்த/படிக்கட்டு இடங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “எண்ணெய் பிழிகிறார்கள்” என்பதற்கான எபிரெய வினைச்சொல் அரிதானது. அது “எண்ணெய்” அல்லது “ஒளிர்வு” தொடர்பான சொல்லோடு இணைக்கப்படுகிறது; இச்சூழலில் ஒலிவ எண்ணெய் எடுப்பதைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: நடுவே
  rationale: வேலையாட்கள் உழைக்கும் இடத்தைச் சுட்டும் இடவியல் முன்னிடைச்சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: שׁוּרֹתָם
  choice: அவர்களுடைய வரிசைகள்
  rationale: இந்தப் பெயர்ச்சொல் சுவர்கள் அல்லது வரிசைகள் எனப் பொருள்படலாம்; வேளாண்மைச் சூழலில் பயிர் வரிசைகள் என்ற சாத்தியத்தை முதன்மைப்படுத்தி, மாற்றுப் பொருளை அடிக்குறிப்பில் வைத்துள்ளது.
- source_word: יַצְהִירוּ
  choice: எண்ணெய் பிழிகிறார்கள்
  rationale: சொல் அரிதானதும் பொருள் விவாதத்திற்குரியதுமாக இருந்தாலும், இச்சூழலில் ஒலிவ எண்ணெயை உற்பத்தி செய்வதைக் குறிப்பதாகப் புரிந்துகொள்வது பொருத்தமானது.
- source_word: יְקָבִים
  choice: திராட்சை ஆலைகள்
  rationale: திராட்சையை மிதித்துச் சாறு எடுக்கும் ஆலைகளைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: דָּרְכוּ
  choice: மிதிக்கிறார்கள்
  rationale: திராட்சைப் பழங்களை ஆலையில் காலால் மிதிக்கும் வழக்கமான செயலை நேரடியாகக் குறிக்கிறது.
- source_word: וַיִּצְמָאוּ
  choice: ஆனாலும் தாகமாயிருக்கிறார்கள்
  rationale: பானம் உற்பத்தி செய்யும் உழைப்பாளிகளே தாகத்துடன் இருப்பதிலுள்ள கடுமையான முரண்பாட்டை வெளிப்படுத்துகிறது.
