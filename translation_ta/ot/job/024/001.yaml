base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: ta
  text: சர்வவல்லவரால் காலங்கள்[a] ஏன் ஒதுக்கிவைக்கப்படுவதில்லை? அவரை அறிந்தவர்கள் அவருடைய நாட்களை[b] ஏன் காண்பதில்லை?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறிக்கப்பட்ட காலங்கள்’; முதல் வரியை, ‘குறிக்கப்பட்ட காலங்கள் ஏன் சர்வவல்லவரால் ஒதுக்கிவைக்கப்படுவதில்லை?’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய நாட்கள்’ என்பது இறைவன் நியாயந்தீர்க்கவோ தலையிடவோ செயல்படும் நாட்களைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: யோபுவின் முறையீட்டை அறிமுகப்படுத்தும் நேரடியான வினாவினை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִשַּׁדַּי
  choice: சர்வவல்லவரால்
  rationale: நிபால் செயப்பாட்டு வினையோடு வரும் מִן முன்னொட்டைச் செயலைக் கட்டுப்படுத்தும் காரணகர்த்தாவைக் குறிப்பதாகப் புரிந்துகொண்டு, ‘by the Almighty’ என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִצְפְּנוּ
  choice: ஒதுக்கிவைக்கப்படுவதில்லை
  rationale: צפן என்பதன் ‘சேமித்து வை, ஒதுக்கி வை, மறைத்து வை’ என்ற பொருள் வளத்திலிருந்து, இங்கு காலங்கள் குறிப்பிட்ட நோக்கத்திற்காக வைத்திருக்கப்படுதல் என்ற கருத்தை இயல்பாகத் தருகிறது; எபிரெய செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: עִתִּים
  choice: காலங்கள்
  rationale: ‘காலங்கள்’ என்ற சுருக்கமான சொல் எபிரெயத்தின் திறந்த பொருளைக் காக்கிறது; ‘குறிக்கப்பட்ட காலங்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיֹדְעָיו
  choice: அவரை அறிந்தவர்கள்
  rationale: இறைவனுடன் தொடர்புடைய அறிவைச் சுட்டும் எபிரெயப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: חָזוּ
  choice: காண்பதில்லை
  rationale: חזה என்பதன் ‘காண்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, இறைவனுடைய செயல்பாட்டு நாட்களை அவர்கள் அனுபவிக்காமை அல்லது உணராமை என்ற இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
- source_word: יָמָיו
  choice: அவருடைய நாட்களை
  rationale: எபிரெயப் பன்மையையும் அதன் கவிதைச் சுருக்கத்தையும் அப்படியே காக்கிறது; ‘நியாயத்தீர்ப்பின் நாட்கள்’ என்று மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அவருடைய நாட்கள்’ என்பதன் பொருள்
  choice: ‘அவருடைய நாட்கள்’ என்ற நேரடி, தெளிவுறுத்தப்படாத சொற்றொடரைத் தக்கவைத்தல்
  alternative: அவர் நியாயந்தீர்க்கும் நாட்கள்; அவர் செயல்படும் காலங்கள்; அவர் நியமித்த தீர்ப்புகள்
  rationale: இறைவன் தலையிடும் அல்லது நியாயந்தீர்க்கும் நாட்களை இது குறிக்கக்கூடும்; ஆனால் எபிரெயம் அதை வெளிப்படையாகச் சொல்லாததால், அதன் இறையியல் பதற்றத்தையும் கவிதைத் தெளிவின்மையையும் முதன்மை உரை பாதுகாக்கிறது.
- issue: முதல் வரியில் מִשַּׁדַּי என்பதன் உறவு
  choice: சர்வவல்லவரால்
  alternative: சர்வவல்லவரிடமிருந்து; சர்வவல்லவருக்கு
  rationale: செயப்பாட்டு வினையுடன் காரணகர்த்தா/கட்டுப்படுத்துபவர் என்ற வாசிப்பு சூழலுக்கு ஏற்றது; இருப்பினும் எபிரெய முன்னொட்டின் உறவு முற்றிலும் ஒரேவிதமாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமுள்ள ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சர்வவல்லவர்’ என்பது யோபு நூலில் שַׁדַּי என்பதற்கான நிலையான இறைப்பட்டமாகப் பயன்படுத்தப்பட்டது. இரண்டு வினாக்களின் இணை அமைப்பும் எபிரெயத்தின் சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
