translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனத்தின் இரண்டு இணைச் செயல்களும் நிகழ்காலப் பன்மையில் அமைக்கப்பட்டுள்ளன. சட்ட-பொருளாதார நுணுக்கத்தைப் பேண ‘அடமானமாக’ பயன்படுத்தப்பட்டுள்ளது; எபிரெயப் பன்மையின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
