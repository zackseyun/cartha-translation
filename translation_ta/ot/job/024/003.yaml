source:
  edition: WLC
  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: ta
  text: அநாதைகளின் கழுதையை அவர்கள் ஓட்டிச் செல்கிறார்கள்[a]; விதவையின் எருதை அடகாக எடுத்துக்கொள்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘அநாதைகள்’ என்பது பன்மையில் உள்ளது. இதை ஒவ்வோர் அநாதைக்கும் உரிய கழுதை எனப் பகிர்ந்துணர்த்தும் வகையிலோ, அநாதைகள் என்னும் குழுவுக்குரிய கழுதை எனக் கூட்டாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கடனுக்கான பிணையமாக விதவையின் எருதை எடுத்துக்கொள்கிறார்கள். மூல வினைச்சொல் சொத்தை அடகாக எடுத்துக்கொள்வதைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: கழுதை
  rationale: வீட்டு வேலைக்கும் சுமை சுமப்பதற்கும் பயன்படும் விலங்கைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்; எபிரெய ஒருமையைப் பேணுகிறது.
- source_word: יְתוֹמִים
  choice: அநாதைகளின்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. அது ஒவ்வோர் அநாதையையும் பகிர்ந்துணர்த்தும் வகையிலோ, அநாதைகளை ஒரு சமூகக் குழுவாகவோ குறிக்கலாம்; தமிழில் பன்மையை நேரடியாகப் பேணுவது இந்தத் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יִנְהָגוּ
  choice: ஓட்டிச் செல்கிறார்கள்
  rationale: נהג என்பதன் ‘ஓட்டு/வழிநடத்து’ என்ற அடிப்படைப் பொருளையும், விலங்கை அதன் உரிமையாளரிடமிருந்து அகற்றிச் செல்லும் சூழலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַחְבְּלוּ
  choice: அடமானமாகப் பறித்துக்கொள்கிறார்கள்
  rationale: கடனுக்கான உத்தரவாதமாகச் சொத்தை எடுத்துக்கொள்ளும் குறிப்பிட்ட சட்ட-பொருளாதாரச் செயலை ‘அடமானமாக’ என்பது காக்கிறது; ‘பறித்துக்கொள்கிறார்கள்’ என்பது இச்சூழலில் வலுக்கட்டாயமான அநீதியை வெளிப்படுத்துகிறது.
- source_word: שׁוֹר
  choice: எருது
  rationale: வேளாண்மை மற்றும் சட்டச் சூழலில் உழவுக்குப் பயன்படும் ஒற்றை மாட்டைக் குறிக்கும் துல்லியமான, வழக்கமான தமிழ்ச் சொல்.
- source_word: אַלְמָנָה
  choice: விதவையின்
  rationale: எபிரெயக் கட்டமைப்பில் உள்ள உடைமை உறவைத் தமிழில் இயல்பான ஆறாம் வேற்றுமை வடிவில் தருகிறது.
