  source_fidelity: 'மூல எபிரெயத்தின் வரிசையும் படிமங்களும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: ரெஹெம் என்பதன் கடுமையான ஆளுருவாக்கம் (‘கருப்பை ... மறந்துவிடும்’), புழுவின் அருவருப்பூட்டும் இனிமை-படிமம், இனி நினைவுகூரப்படாமை, மற்றும் עַוְלָה என்ற அருவப் பெயர்ச்சொல்லின் இறுதியான தெளிவின்மை ஆகியவை அனைத்தும் உள்ளன. எதிர்கால வடிவங்கள் எபிரெய முற்றுப்பெறா வினைகளுக்கு ஏற்றவை. ‘அநீதி’ என்பதை அருவமாக வைத்திருப்பதும் மூலத்திற்குச் சிறந்தது.'
