source:
  edition: WLC
  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: ta
  text: கருப்பை அவனை மறந்துவிடும்; புழு அவனை இனிய உணவாகக் கொள்ளும்[a]. அவன் இனி நினைவுகூரப்படமாட்டான்; அநீதி ஒரு மரத்தைப்போல் முறிக்கப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புழுவுக்கு அவன் இனிப்பாயிருப்பான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அநீதியுள்ளவன் ஒரு மரத்தைப்போல் முறிக்கப்படுவான்.” எபிரெயத்தில் ‘அநீதி/தீமை’ என்ற அருவப் பெயர்ச்சொல் உள்ளது; அது தீமை செய்பவனைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: அவனை மறந்துவிடும்
  rationale: שׁכח என்பதன் Qal முற்றுப்பெறா வினையும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் உள்ளன. சூழலில் தீயவனுக்கு நேரவிருக்கும் முடிவைத் தமிழில் இயல்பாக வெளிப்படுத்த எதிர்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רֶחֶם
  choice: கருப்பை
  rationale: எபிரெயச் சொல்லின் நேரடியான, உருவக வலிமையைப் பாதுகாக்கிறது; ‘தாயின் கருப்பை’ என்று பொருளை விரித்துரைக்கவில்லை.
- source_word: מְתָקוֹ רִמָּה
  choice: புழு அவனை இனிய உணவாகக் கொள்ளும்
  rationale: מתק என்பதன் ‘இனிமையாயிருத்தல்’ என்ற கருத்தையும், רִמָּה என்பதன் ஒருமை வடிவையும் காக்கும் வகையில், புழு அவனை உணவாகச் சுவைப்பது என்ற கொடூரமான படிமம் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: அவன் இனி நினைவுகூரப்படமாட்டான்
  rationale: Niphal வினையின் செயப்பாட்டு நிலையும், עוֹד לֹא குறிக்கும் ‘இனி இல்லை’ என்ற நிறுத்தக் கருத்தும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וַתִּשָּׁבֵר
  choice: முறிக்கப்படும்
  rationale: שׁבר என்பதன் செயப்பாட்டு அர்த்தத்தைச் சுருக்கமாகத் தருகிறது; மரம் முறிக்கப்படும் படிமத்துக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: כָּעֵץ
  choice: ஒரு மரத்தைப்போல்
  rationale: כְּ ஒப்புமையையும் עֵץ என்பதன் வழக்கமான ‘மரம்’ என்ற பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: עַוְלָה
  choice: அநீதி
  rationale: மூலத்தில் உள்ள அருவப் பெயர்ச்சொல்லை அருவமாகவே வைத்திருக்கிறது. ‘அக்கிரமம்’ அல்லது ‘தீமை’ என்பவற்றைவிட சமூக மற்றும் ஒழுக்க அநீதியின் கருத்தை நவீனத் தமிழில் தெளிவாகக் கொண்டுவருகிறது.
theological_decisions:
- issue: עַוְלָה என்பதை அருவமாக ‘அநீதி’ என்று மொழிபெயர்ப்பதா, அல்லது தீயவனைக் குறிக்கும் உருவகப் பயன்பாடாக எடுத்துக்கொள்வதா
  choice: 'அருவ வாசிப்பு: ‘அநீதி ஒரு மரத்தைப்போல் முறிக்கப்படும்’'
  alternative: 'உருவ வாசிப்பு: ‘அநீதியுள்ளவன் ஒரு மரத்தைப்போல் முறிக்கப்படுவான்’'
  rationale: எபிரெய வடிவம் அருவப் பெயர்ச்சொல் என்பதால் முதன்மை உரை அதையே பாதுகாக்கிறது. ஆனால் அது அநீதி செய்பவனை ஆகுபெயராகக் குறிக்கக்கூடும் என்பதால் அந்த வாசிப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது; இதனால் இறையியல் சார்ந்த ஒரு தீர்வு மறைமுகமாகத் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானாலும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கருப்பை மறந்துவிடும்’ மற்றும் ‘அநீதி முறிக்கப்படும்’ என்ற மூலத்தின் கூர்மையான ஆளுருவாக்கங்களும் தீர்க்கப்படாத அர்த்த அழுத்தமும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
