  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அனைவருக்கும் காரிருளே காலை[a][b]; ஏனெனில், காரிருளின் பயங்கரங்களை அவர்கள்[c] நன்கு அறிந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் அனைவருக்கும் காலை காரிருளைப் போன்றது.’ எபிரெயச் சொற்றொடர் மிகவும் செறிவாக இருப்பதால், இரண்டு பெயர்ச்சொற்களுக்கிடையிலான தொடர்பை இவ்வாறும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘காரிருள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் צַלְמָוֶת (த்சல்மாவெத்), ‘மரண நிழல்’ என்றும் மொழிபெயர்க்கப்படலாம். இங்கு அது மரணத்தையே குறிப்பதைவிட அடர்ந்த இருளையோ இருண்மையையோ குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் வினைச்சொல் ஒருமையில், ‘அவன் அறிகிறான்’ அல்லது ‘அவன் அடையாளம் காண்கிறான்’ என்று உள்ளது. ஆனால் அது தீயவர்களை ஒரு வகுப்பாகப் பொதுப்படையாகக் குறிப்பதாகத் தெரிவதால், முதன்மை உரையில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் தீயவர்களைப் பற்றிய விளக்கத்தைத் தொடரும் காரண அல்லது விளக்க இணைப்பாக உள்ளது; இரு இடங்களிலும் ஒரேவிதமாக மொழிபெயர்க்கப்பட்டது.
- source_word: יַחְדָּו
  choice: அவர்கள் அனைவருக்கும்
  rationale: இதன் அடிப்படைப் பொருள் ‘ஒன்றாக’ என்பதாயினும், இங்கு குறிப்பிடப்பட்டவர்களை ஒரு கூட்டமாக உள்ளடக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בֹּקֶר
  choice: காலை
  rationale: வழக்கமான பொருளைத் தக்கவைத்து, காரிருளுடனான கூர்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தில் உள்ள உறவைக் காட்டும் பன்மைப் பதிலிடுபெயரை இயல்பான தமிழில் தருகிறது.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: யோபு நூலில் இச்சொல் பல இடங்களில் மரணத்தையே நேரடியாகக் குறிப்பதைவிட அடர்ந்த இருளையோ துயர்மிக்க இருண்மையையோ குறிக்கிறது; இரு occurrence-களிலும் ஒரே சொல்லால் தரப்பட்டுள்ளது.
- source_word: יַכִּיר
  choice: நன்கு அறிந்திருக்கிறார்கள்
  rationale: எபிரெயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், சூழலில் தீயவர்களின் வகுப்பை பொதுப்படையாகக் குறிக்கிறது. அனுபவத்தால் ஏற்பட்ட பரிச்சயத்தையும் ‘நன்கு அறிந்திருக்கிறார்கள்’ வெளிப்படுத்துகிறது.
- source_word: בַּלְהוֹת
  choice: பயங்கரங்கள்
  rationale: திடீர் அச்சங்களையோ கொடூரமான பயமுறுத்தல்களையோ குறிக்கும் பன்மைச் சொல்லுக்கு நேரான, இயல்பான தமிழாக்கம்.
