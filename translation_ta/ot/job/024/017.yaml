  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் செறிவான முதல் பெயர்வாக்கியத்தை நன்றாகக் காக்கிறது: “அவர்கள் அனைவருக்கும் காரிருளே காலை” என்பது בֹּקֶר ... צַלְמָוֶת என்ற முரண்பாட்டையும் יַחְדָּו-வின் கூட்டுப் பொருளையும் இயல்பாகத் தருகிறது. இரண்டாம் பகுதியில் ஒருமை வினைச்சொல்லின் பொதுப்படையான பயன்பாட்டைச் சூழலுக்கேற்பப் பன்மையில் மொழிபெயர்த்திருப்பது பாதுகாப்பானது. צַלְמָוֶת இரு இடங்களிலும் ஒரேபோல் “காரிருள்” என வந்துள்ளது; בַּלְהוֹת-ன் ‘பயங்கரங்கள்/அச்சங்கள்’ பொருளும் தக்கவைக்கப்பட்டுள்ளது.'
  naturalness: நவீன நிலையான தமிழில் உரை தெளிவாகவும் இலக்கியமான கண்ணியத்துடனும் உள்ளது. “காரிருளே காலை” என்ற சற்றுச் செறிவான நடை, மூலத்தின் கவிதைத் தன்மைக்கும் இருபொருள் வாய்ப்புக்கும் ஏற்றது. “நன்கு அறிந்திருக்கிறார்கள்” என்பது வெறும் அறிவை விட பரிச்சய உணர்வை நன்றாக வெளிப்படுத்துகிறது.
