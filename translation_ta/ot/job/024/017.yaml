translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடியதாயும் இலக்கியக் கண்ணியத்துடனும் அமைக்கப்பட்டது. முதல் அரையடியின் செறிவான, இருபொருள் கொள்ளக்கூடிய பெயர்ச்சொல் அமைப்பு ‘காரிருளே காலை’ என்று ஓரளவு தக்கவைக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. ‘மரண நிழல்’ என்ற பாரம்பரிய வடிவம் முதன்மை உரையில் திணிக்கப்படாமல் சொற்பொருள் மாற்றாகக் குறிப்பிடப்பட்டுள்ளது.
