source:
  edition: WLC
  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: ta
  text: அவர் அவர்களுக்குப் பாதுகாப்பை அளிக்கிறார்[a]; அவர்கள் தாங்கப்படுகிறார்கள்[b]. அவருடைய கண்கள் அவர்களுடைய வழிகளின் மேல் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவனுக்கு’ என்றும் ‘அவன் தாங்கப்படுகிறான்’ என்றும் ஒருமையில் உள்ளன. வசனத்தின் முடிவில் ‘அவர்களுடைய வழிகள்’ என்று வருவதால், இங்கே அவை கூட்டாக ‘அவர்களுக்கு’, ‘அவர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளன.
    reason: alternative_reading
  - marker: b
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: ‘அவர் அவனுக்குப் பாதுகாப்பை அளிக்கிறார்; அவன் தாங்கப்படுகிறான்; அவருடைய கண்கள் அவர்களுடைய வழிகளின் மேல் இருக்கின்றன.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: அளிக்கிறார்
  rationale: נתן என்பதன் Qal முற்றுப்பெறாத வினை வடிவம் இங்கு ‘கொடு/வழங்கு’ என்ற பொருளில் வருகிறது. பொதுவாக நிகழும் செயலை இயல்பான நிகழ்காலத்தில் மொழிபெயர்க்கிறது.
- source_word: לוֹ
  choice: அவர்களுக்கு
  rationale: எபிரெய வடிவம் ஒருமையான ‘அவனுக்கு’ என்றாலும், இறுதியில் வரும் ‘அவர்களுடைய வழிகள்’ என்ற பன்மை, தீயவர்களை ஒரு கூட்டமாகக் குறிக்கும் பகிர்ந்தளிப்பு உணர்வைச் சுட்டுகிறது. மூலத்தின் ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பு
  rationale: בֶּטַח என்பது பாதுகாப்பான நிலை அல்லது பத்திரத்தைக் குறிக்கிறது. ‘பாதுகாப்பு’ என்பது உள்ளார்ந்த தன்னம்பிக்கை என்ற கூடுதல் பொருளைச் சேர்க்காமல் அடிப்படை உணர்வைத் தருகிறது.
- source_word: וְיִשָּׁעֵן
  choice: தாங்கப்படுகிறார்கள்
  rationale: שׁען என்பதன் Nifal வடிவம் ‘தாங்கப்படுதல்’ அல்லது ‘சார்ந்திருத்தல்’ என்று பொருள்படலாம். முந்தைய ‘பாதுகாப்பளிக்கிறார்’ என்பதோடு இணைந்து, கிடைத்த ஆதரவின் விளைவான நிலையை ‘தாங்கப்படுகிறார்கள்’ வெளிப்படுத்துகிறது; இறுதிப் பன்மையுடன் ஒத்திசைய இங்கு கூட்டுப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: וְעֵינֵיהוּ
  choice: அவருடைய கண்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய கண்கள்’. சூழலில் கவனித்துப் பார்ப்பவராகக் கூறப்படுபவர் பெரும்பாலும் கடவுள் எனத் தோன்றினாலும், வசனம் அவரைப் பெயரிட்டு அடையாளப்படுத்தவில்லை.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு இந்த முன்னிடைச்சொல் அவர்களுடைய வழிகள்மீது செலுத்தப்படும் கூர்ந்த கவனத்தைக் குறிக்கிறது.
- source_word: דַּרְכֵיהֶם
  choice: அவர்களுடைய வழிகள்
  rationale: דֶּרֶךְ என்பது நேரடியாகப் பாதையையும் உருவகமாக நடத்தை அல்லது வாழ்க்கை முறையையும் குறிக்கலாம். ‘வழிகள்’ என்ற மொழிபெயர்ப்பு அந்த உருவகத்தையும் நெறிசார் உணர்வையும் திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: வசனத்தில் ஒருமை, பன்மை சுட்டுப்பெயர்கள் மாறிவருவது
  choice: முதல் பாதியைத் தீயவர்களைக் கூட்டாகக் குறிக்கும் பன்மையில் மொழிபெயர்த்து, கவனித்துப் பார்ப்பவரைக் குறிக்கும் ‘அவருடைய கண்கள்’ என்ற ஒருமையைத் தக்கவைத்தல்
  alternative: முழுவதையும் இலக்கண ஒருமைக்கு நெருக்கமாக, ‘அவர் அவனுக்குப் பாதுகாப்பளிக்கிறார்; அவன் தாங்கப்படுகிறான்; அவருடைய கண்கள் அவர்களுடைய வழிகள்மேல் இருக்கின்றன’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் ‘அவனுக்கு’, ‘அவன் தாங்கப்படுகிறான்’ என்ற ஒருமைகளுக்குப் பின் ‘அவர்களுடைய வழிகள்’ என்ற பன்மை வருகிறது. பிரதான உரையின் கூட்டுப் பன்மை தீயவர்களை ஒரு வகுப்பாகப் புரிந்துகொள்ள உதவுகிறது; ‘அவருடைய கண்கள்’ என்பது அவர்களைக் கவனிக்கும் ஒருமை நபரை, சூழலில் பெரும்பாலும் கடவுளை, குறிக்கிறது. மூலத்தின் இலக்கணப் பதற்றம் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளாக இருக்கக்கூடிய ஒருமைச் செய்பவருக்கு ‘அவர்’ என்ற மரியாதை வடிவமும், தீயவர்களின் கூட்டத்திற்கும் தமிழின் வழக்கமான மனிதப் பன்மை வடிவமும் வருவதால் உருவாகும் மேற்பரப்பு ஒற்றுமை, வாக்கிய உறவுகளாலும் அடிக்குறிப்புகளாலும் தெளிவுபடுத்தப்படுகிறது.
