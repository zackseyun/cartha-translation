source:
  edition: WLC
  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: ta
  text: விபசாரம் செய்பவனின் கண் அந்திப்பொழுதுக்காகக் காத்திருக்கிறது[a]. அவன், “எந்தக் கண்ணும் என்னைக் காணாது” என்று கூறுகிறான்; தன் முகத்தை மறைத்துக்கொள்கிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாலை மங்கல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மங்கலான ஒளியுள்ள நேரத்தைக் குறிக்கலாம்; இரகசியமான பாவத்தைப் பற்றிய இச்சூழலில் மாலை அந்தி பொருத்தமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “முகத்தின் மறைவை வைக்கிறான்.” அவன் முகத்தை மூடிக்கொள்கிறான் அல்லது அடையாளம் தெரியாதபடி மறைத்துக்கொள்கிறான் என்பதே இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: கண்
  rationale: இரு இடங்களிலும் எபிரெயச் சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; இரகசியமாகக் காத்திருப்பதையும் பிறர் பார்வையிலிருந்து தப்புவதையும் இணைக்கிறது.
- source_word: נֹאֵף
  choice: விபசாரம் செய்பவன்
  rationale: ஆண்பால் ஒருமை வினையெச்சத்தின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சுருக்கமான ‘விபசாரி’ என்பதற்கு தமிழில் வேறு தொடர்புகள் தோன்றக்கூடும் என்பதால் வினைத்தொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שָׁמְרָה
  choice: காத்திருக்கிறது
  rationale: அடிப்படையில் ‘காக்குதல்/கவனித்திருத்தல்’ என்று பொருள்படும் வினை, இச்சூழலில் இருள் வருவதை எதிர்பார்த்துக் காத்திருப்பதைக் குறிக்கிறது.
- source_word: נֶשֶׁף
  choice: அந்திப்பொழுது
  rationale: மங்கலான ஒளியுள்ள நேரத்தைக் குறிக்கும் சொல்லை, இச்சூழலுக்கேற்ற மாலை அந்தி என்ற இயல்பான பொருளில் வழங்குகிறது; மிகத் துல்லியமாக நேரத்தை வரையறுப்பதில்லை.
- source_word: לֵאמֹר
  choice: என்று சொல்லிக்கொண்டு
  rationale: சொல்லப்பட்ட வார்த்தையையோ உள்ளத்தில் கூறிக்கொண்ட எண்ணத்தையோ அறிமுகப்படுத்தும் எபிரெய வடிவத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: תְשׁוּרֵנִי
  choice: என்னைக் காணாது
  rationale: ‘பார்த்தல்/காணுதல்’ என்ற பொருளை இயல்பாகத் தருவதோடு, வசனத்தின் ‘கண்’ உருவகத்தையும் காக்கிறது.
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  choice: தன் முகத்தை மறைத்துக்கொள்கிறான்
  rationale: ‘முகத்தின் மறைவை வைக்கிறான்’ என்ற சுருக்கமான எபிரெயத் தொடரின் செயற்பொருளைத் தெளிவான தமிழில் தருகிறது; முகத்தை மூடுவதா அல்லது வேடமிட்டு அடையாளத்தை மறைப்பதா என்பதைத் தீர்மானிக்கவில்லை.
