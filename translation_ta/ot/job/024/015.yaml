translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்’ என்ற concrete உருவகம் பாதுகாக்கப்பட்டுள்ளது; எபிரெயத்தில் கண் இலக்கண ரீதியாக எழுவாயாக இருப்பதால் முதல் வாக்கியத்தில் ‘காத்திருக்கிறது’ பயன்படுத்தப்பட்டது. இரண்டாம் வாக்கியத்தில் செய்பவனே எழுவாயாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
