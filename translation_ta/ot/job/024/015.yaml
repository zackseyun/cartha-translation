  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய உருவகங்களும் அமைப்பும் வரைவில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: விபசாரம் செய்பவனின் ‘கண்,’ அந்திப்பொழுதுக்காகக் காத்திருத்தல், ‘என்னைக் காணாது’ என்ற கூற்று, முகத்தை மறைத்தல் ஆகியவை துல்லியமாக உள்ளன. ஆனால் ‘என்று சொல்லிக்கொண்டு’ என்பது தொடர்ச்சியான/ஒரேநேரச் செயலைக் குறிக்கக்கூடும்; לֵאמֹר அறிமுகப்படுத்தும் கூற்றையும் அடுத்த இணைச் செயலையும் தெளிவாகப் பிரதிபலிக்க ‘என்று கூறுகிறான்;’ என மாற்றுவது பாதுகாப்பானது.'
