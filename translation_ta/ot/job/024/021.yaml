source:
  edition: WLC
  text: רֹעֶ֣ה עֲ֭קָרָה לֹ֣א תֵלֵ֑ד וְ֝/אַלְמָנָ֗ה לֹ֣א יְיֵטִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: ta
  text: பிள்ளை பெறாத மலடியை அவன் இரையாக்குகிறான்[a]; விதவைக்கு அவன் எந்த நன்மையும் செய்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிள்ளை பெறாத மலடியை அவன் உணவாக்கிக்கொள்கிறான்.” எபிரெய வினை சொல்லர்த்தமாக “மேய்த்தல்/உண்பித்தல்” என்பதைக் குறிக்கிறது; ஆனால் இச்சூழலில் அது வேட்டையாடிச் சுரண்டும் பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: இரையாக்குகிறான்
  rationale: רעה என்பதன் அடிப்படைப் பொருள் ‘மேய்த்தல்/உண்பித்தல்’ என்றாலும், இங்கு ஆதரவற்ற பெண்களைத் தீயவன் சுரண்டும் பகைமையான சூழல் உள்ளது. ஆகவே ‘இரையாக்குகிறான்’ என்பது எதிர்மறையான, வேட்டையாடும் நுண்ணுணர்வை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: עֲקָרָה
  choice: மலடியை
  rationale: பெண் ஒருத்தியின் மகப்பேறின்மையைக் குறிக்கும் எபிரெயப் பெண்பால் ஒருமையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לֹא תֵלֵד
  choice: பிள்ளை பெறாத
  rationale: சொல்லர்த்தமாக ‘பெற்றெடுக்காதவள்.’ இயல்பான தமிழுக்காக ‘பிள்ளை பெறாத’ என வழங்கப்படுகிறது; ‘பெற இயலாத’ என்று மூலத்தில் வெளிப்படையாக இல்லாத இயலாமை நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: எபிரெயத்தில் குறிப்பிடப்படும் ஆதரவற்ற சமூகப் பிரிவுக்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: לֹא יְיֵטִיב
  choice: எந்த நன்மையும் செய்வதில்லை
  rationale: יטב வினையின் ஹிஃபில் வடிவம் ‘நன்மை செய்தல், நன்றாக நடத்துதல், பயனளித்தல்’ எனப் பொருள்படும். தேர்ந்த மொழிபெயர்ப்பு அதன் ஒழுக்க வலிமையைத் தக்கவைத்து இயல்பாக உள்ளது.
