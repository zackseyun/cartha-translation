  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மலடி’ மூலத்தின் நேரடியான சமூகச் சொல்லைத் தக்கவைக்கிறது; ‘இரையாக்குகிறான்’ சூழலின் எதிர்மறை வலிமையை வெளிப்படுத்துகிறது.
