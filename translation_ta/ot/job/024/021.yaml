  source_fidelity: ரֹעֶה என்பதற்கான சூழல்சார் எதிர்மறைப் பொருளை “இரையாக்குகிறான்” நன்றாக வெளிப்படுத்துகிறது; அது ஆங்கில POB-யின் “preys on” தேர்வுடனும் ஒத்துள்ளது. “பிள்ளை பெறாத மலடி” עֲקָרָה לֹא תֵלֵד என்ற இரண்டு கூறுகளையும் தக்கவைக்கிறது. விதவைக்கு நன்மை செய்யாமை לֹא יְיֵטִיב என்பதற்கு துல்லியமானது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “மலடி” இன்று கடுமையாக ஒலிக்கக்கூடிய சொல் என்றாலும், மூலத்தில் உள்ள நேரடியான சமூக/உடல் நிலையைக் குறிக்கும் சொல்லை மறைக்காமல் தருகிறது; அதனுடன் “பிள்ளை பெறாத” என்பதும் விளக்கமாக அமைகிறது.
  terminology: “விதவை,” “நன்மை செய்வதில்லை,” மற்றும் “இரையாக்குகிறான்” ஆகியவை பொருத்தமானவை. அடிக்குறிப்பு ரעה வினையின் அடிப்படை மேய்த்தல்/உண்பித்தல் தொடர்பான பொருளையும், இச்சூழலில் சுரண்டல் எனப் புரியக்கூடிய மாற்றையும் சரியாகக் குறிக்கிறது.
