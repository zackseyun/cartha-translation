base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: ta
  text: இதோ, காட்டுக் கழுதைகளைப் போல அவர்கள் வனாந்தரத்தில் தங்கள் வேலைக்குப் புறப்பட்டுச் செல்கிறார்கள்; உணவைத் தேடி அதிகாலையிலேயே செல்கிறார்கள். வறண்ட வெளி அவனுக்கும்[a] பிள்ளைகளுக்கும் உணவாகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் “அவனுக்கு” என்பது ஒருமையில் உள்ளது. இறுதிச் சொல் “இளையோர்,” “சிறுவர்கள்,” “இளைஞர்கள்,” அல்லது சூழலுக்கேற்ப “பிள்ளைகள்” என மொழிபெயர்க்கப்படலாம். எனவே, இங்கு ஒருமைச் சொல்லுக்கும் இறுதிப் பன்மைச் சொல்லுக்கும் உள்ள துல்லியமான தொடர்பு தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: காட்சியின்மேல் கவனத்தை ஈர்க்கும் எபிரெய அறிமுகச் சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: פְּרָאִים
  choice: காட்டுக் கழுதைகள்
  rationale: வனாந்தரத்தில் திரியும் பழக்கப்படுத்தப்படாத கழுதைகளைக் குறிக்கும் நேரடியான, தற்காலத் தமிழ் சொற்றொடர்.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: பயிரிடப்படாத பாழ்நிலம் அல்லது வறண்ட வனப்பகுதி என்ற பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: தங்கள் வேலைக்குப் புறப்பட்டுச் செல்கிறார்கள்
  rationale: வாழ்வாதாரத்துக்காக மேற்கொள்ளும் கடினமான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கவிதையின் உயிரோட்டமான நிகழ்காலத் தோற்றமும் நிலைக்கிறது.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: இரைக்காக அதிகாலையிலேயே தேடுகிறார்கள்
  rationale: שׁחר என்பதிலுள்ள அதிகாலை நுட்பத்தையும் טֶרֶף என்பதிலுள்ள இரை/உணவாதாரப் படிமத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: עֲרָבָה
  choice: வறண்ட வெளி
  rationale: வறண்ட சமவெளி அல்லது பாலைப் புல்வெளி என்ற சொல்லின் நிலவியல் தன்மையை பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: எபிரெய மூலத்தின் ஒருமையைச் சீராக்காமல் வைத்திருக்கிறது; இது கூட்டத்திலுள்ள ஒவ்வொருவரையும் பிரதிநிதித்துவப்படுத்தும் ஒருமையாக இருக்கலாம்.
- source_word: לֶחֶם
  choice: உணவு
  rationale: சொல்லின் நேரடிப் பொருள் ‘அப்பம்’ என்றாலும், இங்கு அடிப்படை வாழ்வாதாரம் என்ற விரிந்த பொருள் இயல்பான தமிழில் ‘உணவு’ எனத் தரப்படுகிறது.
- source_word: לַנְּעָרִים
  choice: பிள்ளைகளுக்கு
  rationale: இச்சூழலில் உணவு தேவைப்படும் இளைய சார்ந்தவர்களை இயல்பாகக் குறிக்கிறது; ஆண் பிள்ளைகள் என்று தேவையின்றி வரையறுக்காது.
