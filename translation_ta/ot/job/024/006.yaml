source:
  edition: WLC
  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: ta
  text: வயலில் அவர்கள் கால்நடைத் தீவனத்தை[a] அறுவடை செய்கிறார்கள்; தீயவனின்[b] திராட்சைத்தோட்டத்தில்[c] எஞ்சியவற்றைப் பொறுக்குகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கலப்புத் தீவனம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் வழக்கமான உணவுத் தானியத்தை அல்ல, கால்நடைகளுக்கான தீவனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தீயவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் இச்சொல் ஒருமையில் உள்ளது; அது பொதுவாக ஒரு தீய உரிமையாளரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: ‘தீயவனின் திராட்சைத்தோட்டத்தைப் பொறுக்குகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்; ‘தோட்டத்தில்’ என்பதற்கான இடப்பொருள் உருபு எபிரெயில் வெளிப்படையாக மீண்டும் வரவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: வயலில்
  rationale: בְּ உடன் வரும் שָׂדֶה இடத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான சுருக்கமான வடிவம்.
- source_word: בְּלִילוֹ
  choice: கால்நடைத் தீவனத்தை
  rationale: בְּלִיל என்பது மனிதர்கள் உண்ணும் வழக்கமான தானியத்தை அல்ல, கலக்கப்பட்ட கால்நடை உணவு அல்லது தீவனத்தைக் குறிக்கிறது. மூன்றாம் ஆண்பால் ஒருமை உரிமை விகுதியின் சுட்டுப்பொருள் தெளிவில்லாததால், தமிழில் தேவையற்ற ‘அவனுடைய’ என்பதைச் சேர்க்காமல் பொருளை இயல்பாக வழங்குகிறது.
- source_word: יקצירו
  choice: அறுவடை செய்கிறார்கள்
  rationale: קצר என்பதன் அடிப்படை வேளாண் பொருளான ‘அறுவடை செய்தல்’ என்பதைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וְכֶרֶם רָשָׁע
  choice: தீயவனின் திராட்சைத்தோட்டத்தில்
  rationale: כֶּרֶם என்பது திராட்சைத்தோட்டம்; רָשָׁע ஒருமையில் பெயர்ச்சொல்லாகப் பயன்பட்டு தீய நபரை அல்லது தீய உரிமையாளரைச் சுட்டுகிறது. அடுத்த வினையுடன் இயல்பாக அமைய இடப்பொருள் வேற்றுமை தமிழில் சேர்க்கப்பட்டுள்ளது.
- source_word: יְלַקֵּשׁוּ
  choice: எஞ்சியவற்றைப் பொறுக்குகிறார்கள்
  rationale: לקשׁ என்பதன் பியேல் வடிவம் பிந்திய விளைச்சலை அல்லது அறுவடைக்குப் பின் எஞ்சியவற்றைச் சேகரிப்பதைக் குறிக்கிறது. ‘பொறுக்குகிறார்கள்’ என்பது glean என்ற வேளாண் செயலின் பொருளை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: רָשָׁע என்பதன் குறிப்பு
  choice: தீயவனின்
  alternative: தீயவரின்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருப்பதால் ‘தீயவனின்’ என்று மொழிபெயர்க்கப்பட்டது; இது ஒரு குறிப்பிட்ட ஆளை மட்டுமே கட்டாயமாகக் குறிக்காமல், பொதுவகையான தீய நிலஉரிமையாளரையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேளாண் காட்சியைத் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது. அரிதான மூலச்சொற்களின் பொருள் மிகையாக விளக்கப்படாமல், அவற்றின் உண்மையான மாற்றுவாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
