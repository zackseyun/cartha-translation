- from: அவர்கள் வறியவர்களை வழியைவிட்டு விலக்குகிறார்கள்[a]; நாட்டின் ஏழைகள் அனைவரும் ஒன்றாக ஒளிந்துகொள்கிறார்கள்[b].
  to: அவர்கள் வறியவர்களை வழியிலிருந்து விலக்குகிறார்கள்[a]; நாட்டின் ஏழைகள் ஒருசேர மறைந்திருக்கிறார்கள்[b].
