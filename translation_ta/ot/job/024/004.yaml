translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையில் அமைக்கப்பட்டது. אֶבְיוֹנִים மற்றும் עֲנִיֵּי ஆகிய இணையான சமூகச் சொற்களுக்கு முறையே ‘வறியவர்கள்’, ‘ஏழைகள்’ என்று சொல்வேறுபாடு பேணப்பட்டது.
