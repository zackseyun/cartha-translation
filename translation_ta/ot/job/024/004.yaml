  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: ta
  text: அவர்கள் வறியவர்களை வழியிலிருந்து விலக்குகிறார்கள்[a]; நாட்டின் ஏழைகள் ஒருசேர மறைந்திருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வறியவர்களை வழியிலிருந்து திருப்புகிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “மறைந்திருக்கிறார்கள்” என்பதற்குப் பதிலாக, “மறைக்கப்படுகிறார்கள்” என்றும் மொழிபெயர்க்கலாம்; “நாட்டின் ஏழைகள்” என்பதற்குப் பதிலாக, “பூமியின் ஏழைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: יַטּוּ
  choice: விலக்குகிறார்கள்
  rationale: נטה என்பதன் ஹிஃபில் வடிவம் ‘விலகச் செய்கிறார்கள்’ அல்லது ‘வழியிலிருந்து திருப்புகிறார்கள்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ஒடுக்குமுறையின் சூழலில் ‘விலக்குகிறார்கள்’ என்பது அந்தச் செயலை இயல்பான தமிழில் நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: אֶבְיוֹנִים
  choice: வறியவர்களை
  rationale: אֶבְיוֹן பொருளாதாரமும் சமூகமும் சார்ந்த தேவையிலும் பலவீனத்திலும் இருப்பவரைக் குறிக்கிறது. அடுத்துள்ள עָנִי என்பதிலிருந்து சிறிய சொல்வேறுபாட்டைக் காக்க ‘வறியவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִדָּרֶךְ
  choice: வழியைவிட்டு
  rationale: דֶּרֶךְ என்பதற்கு ‘வழி, சாலை, பாதை’ எனப் பொருள். מן முன்னொட்டுடன் இது வழியிலிருந்து விலக்கப்படுதலைக் குறிக்கிறது; ‘வழியைவிட்டு’ என்பது உருவகத்தையும் மூலத்தின் பொதுத்தன்மையையும் காக்கிறது.
- source_word: יַחַד
  choice: அனைவரும் ஒன்றாக
  rationale: יַחַד கூட்டாக அல்லது ஒருசேர நிகழ்வதைச் சுட்டுகிறது. ‘அனைவரும் ஒன்றாக’ என்பது ஏழைகள் கூட்டாக மறைந்திருக்கும் நிலையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: חֻבְּאוּ
  choice: ஒளிந்துகொள்கிறார்கள்
  rationale: חבא என்பதன் புஅல் வடிவம் ‘மறைக்கப்பட்டார்கள்’ அல்லது சூழலுக்கேற்ப ‘ஒளிந்துகொண்டார்கள்’ எனப் புரியலாம். ஒடுக்குமுறையால் அவர்கள் பொதுவிடத்திலிருந்து மறைவதை இயல்பான தமிழில் சொல்ல ‘ஒளிந்துகொள்கிறார்கள்’ பயன்படுத்தப்பட்டது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֲנִיֵּי אָרֶץ
  choice: நாட்டின் ஏழைகள்
  rationale: עָנִי என்பது ஏழை, துன்புறுத்தப்பட்டவர், ஒடுக்கப்பட்டவர் ஆகிய நிழற்பொருள்களைக் கொண்டது. אֶרֶץ இங்கு மனித சமூகத்தின் நிலப்பரப்பைக் குறிக்கக்கூடும் என்பதால் ‘நாட்டின் ஏழைகள்’ இயல்பான தேர்வு; ‘பூமியின் ஏழைகள்’ என்ற மாற்றும் சாத்தியம்.
