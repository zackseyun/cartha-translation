source:
  edition: WLC
  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: ta
  text: நகரத்திலிருந்து மரணமடைவோர் முனகுகின்றனர்[a]; கொல்லப்பட்டவர்களின் உயிர் உதவிக்காகக் கதறுகிறது. ஆனாலும் கடவுள் இதை அபத்தமானது என்று கருதுவதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தில் மனிதர்கள் முனகுகிறார்கள்.” இங்குள்ள எபிரெயச் சொல் கடினமானது; அது “மனிதர்கள்” என்றும் “மரணமடைவோர்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடரின் எபிரெய மரபுத்தொடர் கடினமானது. “ஆனாலும் கடவுள் இதைக் குற்றமாகக் கருதுவதில்லை” அல்லது “ஆனாலும் கடவுள் அந்தக் கதறலை மதியீனமானது என்று கருதுவதில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: நகரத்திலிருந்து
  rationale: מִן முன்னொட்டு எழும் குரலின் மூல இடத்தைக் குறிக்கிறது; ‘நகரத்திலிருந்து’ என்பது எபிரெய உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: מְתִים
  choice: சாகக் கிடப்பவர்கள்
  rationale: இந்தச் சொல் இங்கு கடினமானது. ‘மனிதர்கள்’ என்ற பொருளும் சாத்தியம்; எனினும் அடுத்துள்ள ‘கொல்லப்பட்டவர்கள்’ என்ற இணைவரி மரணத் துன்பத்தில் இருப்பவர்களைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது.
- source_word: יִנְאָקוּ
  choice: முனகுகிறார்கள்
  rationale: துன்பத்தால் எழும் கேட்கத்தக்க வேதனைக் குரலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וְנֶפֶשׁ
  choice: உயிர்
  rationale: נֶפֶשׁ என்பதற்கு உயிர், ஆள், ஆன்மா ஆகிய பொருள்கள் உண்டு. இங்கு ‘உயிர்’ என்பது எபிரெயச் சொல்லின் உயிர்நிலை சார்ந்த வலிமையைத் தக்கவைத்து இயல்பாக அமைகிறது.
- source_word: חֲלָלִים
  choice: கொல்லப்பட்டவர்கள்
  rationale: வன்முறையால் வெட்டுண்டு வீழ்ந்த அல்லது கொல்லப்பட்டவர்களைச் சொல் பொதுவாகக் குறிக்கிறது; சூழலில் ‘கொல்லப்பட்டவர்கள்’ தெளிவானது.
- source_word: תְּשַׁוֵּעַ
  choice: உதவிக்காகக் கதறுகிறது
  rationale: தீவிரமாக உதவி கோரும் உரத்த அழுகுரலை Piel வடிவம் உணர்த்துகிறது.
- source_word: וֶאֱלוֹהַּ
  choice: ஆனாலும் கடவுள்
  rationale: மனிதரின் கதறலுக்கும் கடவுளின் வெளிப்படையான பதிலின்மைக்கும் இடையிலான எதிர்மறை உறவை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: இதை அபத்தமாகக் கருதுவதில்லை
  rationale: கடினமான மரபுத்தொடரை அதன் நேரடியான ‘அபத்தம்/முறைகேடு என்று வைப்பதில்லை’ என்ற திசையில் மொழிபெயர்க்கிறது; எதைச் சுட்டுகிறது என்பது தெளிவில்லாததால் ‘இதை’ என்று திறந்தவாறே வைக்கப்படுகிறது.
theological_decisions:
- issue: அநீதியின் நடுவே கடவுளின் வெளிப்படையான பதிலின்மை
  choice: ஆனாலும் கடவுள் இதை அபத்தமாகக் கருதுவதில்லை
  alternative: ஆனாலும் கடவுள் குற்றம் சுமத்துவதில்லை / அந்தக் கதறலை மதியீனமென்று கருதுவதில்லை
  rationale: வசனம் யோபுவின் குற்றச்சாட்டிலுள்ள பதற்றத்தை வெளிப்படுத்துகிறது. கடவுளின் நீதியை விளக்கிச் சமரசப்படுத்தாமலும், இறுதி தொடரின் கடினத்தன்மையை முற்றாகத் தீர்மானிக்காமலும் மொழிபெயர்ப்பு அதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கவிதைநடையின் இணை அமைப்பும், இறுதித் தொடரின் உண்மையான தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
