source:
  edition: WLC
  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: ta
  text: ஆயினும், அவன் தன் வல்லமையால் வலியவர்களை இழுத்துச் செல்கிறான்; அவன் எழும்புகிறான்[a], ஆனால் வாழ்வைப் பற்றி அவனுக்கு உறுதியில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவன் எழும்புகிறான்; அவன் வாழ்வில் நம்பிக்கை வைப்பதில்லை.” வேறொரு புரிதல்: “அவன் எழும்பும்போது யாருக்கும் வாழ்வைப் பற்றிய உறுதியில்லை.” இறுதிக் கூறின் எழுவாய் எபிரெயத்தில் தெளிவற்றது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: இழுத்துச் செல்கிறான்
  rationale: משך என்பதன் அடிப்படைப் பொருள் ‘இழு, இழுத்துச் செல்’ என்பதாகும். வலியவர்களைத் தன் வல்லமையால் அடக்கி இழுத்துச் செல்லும் வன்முறையான செயலை இச்சொல் இயல்பாக வெளிப்படுத்துகிறது; ‘நீடிக்கச் செய்கிறான்’ என்பது இங்கு குறைவான நேரடிப் பொருள்.
- source_word: אַבִּירִים
  choice: வலியவர்களை
  rationale: אַבִּירִים என்பது வலிமை அல்லது அதிகாரம் உடையவர்களைக் குறிக்கிறது. ‘வலியவர்கள்’ என்பது உடல் வலிமையையும் சமூக ஆற்றலையும் திறந்த நிலையில் வைத்திருக்கும் இயல்பான தமிழ்.
- source_word: בְּכֹחוֹ
  choice: தன் வல்லமையால்
  rationale: בְּ என்ற கருவிப்பொருளையும் כֹּחַ என்பதன் வலிமை/ஆற்றல் பொருளையும் ‘தன் வல்லமையால்’ தெளிவாகக் கடத்துகிறது.
- source_word: יָקוּם
  choice: அவன் எழும்புகிறான்
  rationale: קום என்பதன் நேரடிப் பொருளான ‘எழு, எழுந்து நில்’ என்ற உருவகத்தை இது காக்கிறது; செயல்பட எழுதல், தன்னை நிலைநிறுத்துதல், தொடர்ந்து நிற்றல் ஆகிய நுணுக்கங்களில் ஒன்றைத் தீர்மானிக்கவில்லை.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: ஆனால் தன் உயிரைக் குறித்து அவனுக்கு உறுதியில்லை
  rationale: எபிரெய வினை ஒருமையில் இருப்பதால் முந்திய ‘அவன்’ என்பதையே எழுவாயாகத் தொடர்வது வடிவத்துக்கு நெருக்கமானது. יַאֲמִין இங்கு நம்பிக்கை அல்லது உறுதி இல்லாமையைச் சுட்டுகிறது; בַּחַיִּין என்பதைக் குறிப்பிட்ட சூழலில் ‘தன் உயிரைக் குறித்து’ என்று இயல்பாகத் தமிழாக்கியுள்ளோம்.
theological_decisions:
- issue: இறுதிக் கூறின் எழுவாய் தெளிவின்மை
  choice: ஒருமை வினையைத் தொடர்ந்து, ஒடுக்குகிறவனே தன் உயிரைக் குறித்து உறுதியற்றவன் என்று முதன்மை உரையில் தரப்பட்டுள்ளது.
  alternative: அவன் எழும்பும்போது யாருக்கும் உயிரைப் பற்றிய உறுதியில்லை; அல்லது ‘அவன் உயிரை நம்புவதில்லை.’
  rationale: எபிரெயத்தில் יַאֲמִין என்பது இலக்கணப்படி ஆண்பால் ஒருமை; ஆகவே முந்திய நபரை எழுவாயாகக் கொள்வது இயல்பானது. இருப்பினும் சுருக்கமான தொடரமைப்பும் சூழலும் பாதிக்கப்படுவோரின் உயிர்ப்பாதுகாப்பின்மையைக் குறிக்கும் வாசிப்புக்கும் இடமளிக்கின்றன; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் செறிவையும் கண்ணியத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆயினும்’, ‘வல்லமை’, ‘உறுதி’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியக்கூடிய இலக்கியத் தரத்தை வழங்குகின்றன; மூலத்தின் எழுவாய் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
