  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: ta
  text: அவன் நீர்ப்பரப்பின்மேல் விரைந்து செல்கிறான்[a]; அவர்களுடைய நிலப்பங்கு நாட்டில் சபிக்கப்பட்டுள்ளது[b]; அவன் திராட்சைத்தோட்டங்களின் வழிக்குத் திரும்புவதில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் நீரின் மேற்பரப்பின்மேல் இலேசானவன்.” எபிரெய வாசகம் கடினமானது; சிலர் இத்தொடர் வேகத்தைக் காட்டாமல், நிலையற்ற தன்மையைக் குறிப்பதாகக் கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வாசகம் கடினமானது; “நாட்டில் அவனுடைய நிலப்பங்கு சபிக்கப்பட்டுள்ளது” என்றும் வாசிக்கலாம்.
    reason: textual_variant
  - marker: c
    text: அல்லது, “அவன் திராட்சைத்தோட்டங்களின் பாதைக்குத் திரும்புவதில்லை.” அவன் இனி பயிரிடப்பட்ட நிலத்துக்கோ செழிப்பான இடங்களுக்கோ திரும்புவதில்லை என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: விரைந்து செல்கிறான்
  rationale: קַל என்பதன் அடிப்படைப் பொருள் ‘இலேசானவன்’; நீர்ப்பரப்பின்மேல் நகரும் இச்சூழலில் அது வேகத்தையோ விரைவில் கடந்துபோகும் நிலையையோ குறிக்கலாம். இயல்பான தமிழுக்காக வினைச்சொல் வடிவில் மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַל־פְּנֵי מַיִם
  choice: நீர்ப்பரப்பின்மேல்
  rationale: ‘நீரின் முகத்தின்மேல்’ என்ற எபிரெய உருவகத்தை, அதன் காட்சியைத் தக்கவைத்து இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: תְּקֻלַּל
  choice: சபிக்கப்பட்டது
  rationale: קלל என்பதன் புஅல் வடிவுக்கு உரிய செயப்பாட்டு அர்த்தமான ‘சபிக்கப்பட்டது’ என்பதே இத்தொடரின் நேரடியான வாசிப்பு.
- source_word: חֶלְקָתָם
  choice: அவர்களுடைய பங்கு
  rationale: கொடுக்கப்பட்ட மெய்யெழுத்து வடிவிலுள்ள பன்மை உடைமை விகுதியைப் பின்பற்றுகிறது. ஒருமை வாசிப்புக்கான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בָּאָרֶץ
  choice: நாட்டிலுள்ள
  rationale: ‘பங்கு’ என்பதுடன் நிலவுடைமை அல்லது ஒதுக்கப்பட்ட நிலப்பகுதி என்ற கருத்தில் இயல்பாக இணைகிறது; ‘பூமியிலுள்ள’ என்பதும் சொற்பொருளளவில் சாத்தியம்.
- source_word: לֹא יִפְנֶה
  choice: நோக்கித் திரும்புவதில்லை
  rationale: פנה என்பதன் ‘திரும்பு/நோக்கித் திரும்பு’ என்ற அடிப்படைச் செயற்படிமத்தைத் தக்கவைத்து, ‘மீண்டும் போவதில்லை’ போன்ற விளக்கவுரையை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: திராட்சைத்தோட்டங்களின் வழி
  rationale: எபிரெய இணைப்புத்தொடரை நெருக்கமாக வழங்கி, அது தோட்டங்களுக்கு இட்டுச் செல்லும் பாதையா அல்லது தோட்டப்பகுதியின் வழியா என்ற தெளிவின்மையைத் தக்கவைக்கிறது.
