  verdict: revise
  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் முக்கிய கூறுகளை நன்றாகப் பின்பற்றுகிறது: கַל என்பதன் வேகம்/இலகுத்தன்மை, நீரின் மேற்பரப்பு, சபிக்கப்பட்ட பங்கு, திராட்சைத்தோட்டங்களின் வழி ஆகியவை உள்ளன. ஆனால் לֹא יִפְנֶה என்பது எளிமையாக ‘திரும்புவதில்லை’ என்பதே; ‘நோக்கித் திரும்புவதில்லை’ என மொழிபெயர்ப்பது ‘நோக்கி’ என்ற கூடுதல் திசைச்சாயலைச் சேர்க்கிறது. மேலும் כְּרָמִים ‘திராட்சைத்தோட்டங்கள்’ என்பதற்கு பன்மை; அடிக்குறிப்பு ‘திராட்சைத்தோட்டங்களுக்குச் செல்லும் பாதை’ என்று ‘க்கு’ சேர்ப்பது மூலத்தின் தெளிவின்மையைச் சற்றுக் குறைக்கிறது.'
  naturalness: ‘நீர்ப்பரப்பின்மேல் விரைந்து செல்கிறான்’ இயல்பான, கண்ணியமான நவீன தமிழ். ‘நாட்டிலுள்ள அவர்களுடைய பங்கு’ என்பதற்குப் பதில் ‘அவர்களுடைய நிலப்பங்கு நாட்டில் சபிக்கப்பட்டுள்ளது’ என அமைத்தால் தமிழ் தொடரமைப்பு இயல்பாகும்; இருப்பினும் மூலத்தின் பெயரடை/வினைத் தெளிவின்மையைத் தேவையற்ற அளவு மாற்றாது. ‘திராட்சைத்தோட்டங்களின் வழி’ இயல்பாக உள்ளது.
  terminology: ‘சபிக்கப்பட்டது’ தְּקֻלַּל என்பதற்குச் சரியான நேரடிச் சொல். ‘நிலப்பங்கு’ חֶלְקָתָם மற்றும் בָּאָרֶץ இணைப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது; அது ‘பூமி’ என்ற மாற்றுச் சாத்தியத்தைத் தீர்மானிப்பதில்லை. ஆள் ஒருமை (‘அவன்’) மற்றும் பன்மை உடைமை (‘அவர்களுடைய’) ஆகிய மூலத்தின் கடினமான மாறுபாடு பாதுகாக்கப்படுகிறது.
