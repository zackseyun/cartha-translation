  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் முறிந்ததும் கடினமானதுமான தொடரமைப்பு முற்றிலும் சீராக்கப்படாமல், ஒருமை–பன்மை மாறுபாடும் உருவகத் தெளிவின்மையும் உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளன.
