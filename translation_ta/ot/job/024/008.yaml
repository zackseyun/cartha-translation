  edition: WLC
  text: מִ/זֶּ֣רֶם הָרִ֣ים יִרְטָ֑בוּ וּֽ/מִ/בְּלִ֥י מַ֝חְסֶ֗ה חִבְּקוּ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: ta
  text: மலைகளின் பெருமழையால் அவர்கள் நனைந்துபோகிறார்கள்[a]; ஒதுங்க இடமில்லாமல், பாறையை அணைத்துக்கொள்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலைகளிலிருந்து பாயும் வெள்ளத்தால்” அல்லது “மலைகளின் புயல்மழையால்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “பாறையை அணைத்துக்கொள்கிறார்கள்”; ஒதுங்குவதற்காக அதனோடு நெருக்கமாக ஒட்டிக்கொள்கிறார்கள் என்ற காட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם
  choice: கொட்டும் மழையால்
  rationale: זֶרֶם என்பது பெருமழை, புயல்மழை, அல்லது பெருக்கெடுத்து ஓடும் நீர் எனப் பொருள்படலாம். மலைப்பகுதியில் புகலின்றி இருப்பவர்கள் நனைவதை இச்சூழல் கூறுவதால், கடுமையான மழையை இயல்பான நவீன தமிழில் வெளிப்படுத்தும் வகையில் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָרִים
  choice: மலைகளில்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. மழை மலைப்பகுதியில் பெய்வதாக இயல்பான தமிழில் கூறுவதற்காக ‘மலைகளில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִרְטָבוּ
  choice: நனைந்துபோகிறார்கள்
  rationale: இந்த வினைச்சொல் நனைதல் அல்லது ஈரமாதலைக் குறிக்கிறது. கடுமையான மழைக்கு முற்றிலும் வெளிப்பட்டிருக்கும் நிலையை ‘நனைந்துபோகிறார்கள்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּמִבְּלִי
  choice: இடமில்லாமல்
  rationale: ‘இல்லாமல்’ அல்லது ‘கிடைக்காததால்’ என்ற பற்றாக்குறையை இக்கட்டமைப்பு குறிக்கிறது. மַחְסֶה என்பதோடு இணைத்து ‘ஒதுங்க இடமில்லாமல்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: מַחְסֶה
  choice: ஒதுங்க இடம்
  rationale: இது புகலிடம், பாதுகாப்பிடம், அல்லது மறைவிடம் என்பதைக் குறிக்கிறது. மழையிலிருந்து உடல் பாதுகாப்பைப் பெறும் உடனடிச் சூழலில் ‘ஒதுங்க இடம்’ சாதாரண வாசகருக்கு இயல்பாக உள்ளது.
- source_word: חִבְּקוּ
  choice: அணைத்துக்கொள்கிறார்கள்
  rationale: இந்த வினைச்சொல்லின் நேரடிப் பொருள் ‘அணைத்துக்கொள்.’ பாறையோடு நெருக்கமாக ஒட்டிக்கொண்டு பாதுகாப்புத் தேடும் உயிரோட்டமான படிமத்தைத் தீர்த்துவிடாமல் காக்க நேரடி மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: צוּר
  choice: பாறை
  rationale: צוּר என்பது பாறை அல்லது கற்பாறைச் சரிவைக் குறிக்கலாம். மூலத்தின் தெளிவான காட்சிப்படிமத்தைப் பாதுகாக்க பொதுவாகப் புரியும் ‘பாறை’ தேர்ந்தெடுக்கப்பட்டது.
