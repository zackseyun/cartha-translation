  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: ta
  text: இருளில் அவன் வீடுகளுக்குள் உடைத்துப் புகுகிறான்[a]; பகலில் அவர்கள் தங்களை உள்ளே அடைத்துக்கொள்கிறார்கள்[b]; அவர்கள் ஒளியை அறிந்ததில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இருளில் அவன் வீடுகளைத் தோண்டி உடைக்கிறான்.” எபிரெய வினைச்சொல் சொல்லளவில் ‘தோண்டு’ அல்லது ‘துளைத்துக் கட’ என்று பொருள்படும்; திருடுவதற்காக வீட்டுச் சுவரைத் தோண்டி உடைத்துப் புகுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பகலில் அவர்கள் தங்களை அடைத்துக்கொள்கிறார்கள்” அல்லது “தங்களை மூடிக்கொள்கிறார்கள்.” எபிரெயச் சொல் ‘முத்திரையிடு, மூடு’ என்பதன் அடிப்படைப் பொருளைக் கொண்டது; பகலின்போது அவர்கள் தங்களை மறைத்துக்கொள்வதை இது வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: “ஒளி” என்பது நேரடியாகப் பகலொளியைக் குறிக்கலாம்; இந்தச் சூழலில் வெளிப்படுதலையும் அறநெறியையும் சார்ந்த நிழற்பொருளும் அதற்கு இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: சுவர்களைத் துளைத்துப் புகுகிறான்
  rationale: இந்த வினைச்சொல் தோண்டுதல் அல்லது சுவரைத் துளைத்தல் என்பதைக் குறிக்கிறது; இச்சூழலில் திருடுவதற்காக வீட்டுச் சுவரை உடைத்துப் புகும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּחֹשֶׁךְ
  choice: இருளில்
  rationale: செயல் நடைபெறும் நேரத்தையும் மறைவான சூழலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בָּתִּים
  choice: வீடுகள்
  rationale: குடியிருப்புகளைக் குறிக்கும் எபிரெயப் பன்மையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: முந்தைய ‘இருளில்’ என்பதற்கு எதிரான கவிதைநயமான கால வேறுபாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: חִתְּמוּ לָמוֹ
  choice: அவர்கள் தங்களை உள்ளே அடைத்துக்கொள்கிறார்கள்
  rationale: ‘முத்திரையிடு, மூடு’ என்ற அடிப்படைப் பொருளையும், பகலில் மறைந்திருக்கத் தங்களை அடைத்துக்கொள்ளும் சூழல்சார் கருத்தையும் தருகிறது.
- source_word: לֹא יָדְעוּ אוֹר
  choice: அவர்கள் ஒளியை அறியார்கள்
  rationale: ‘அறிதல்’ மற்றும் ‘ஒளி’ ஆகிய மூலப்படிமங்களை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பதால், பகலொளி என்ற நேரடிப் பொருளும் அறநெறி சார்ந்த சாத்தியமான நிழற்பொருளும் தொடர்கின்றன.
theological_decisions:
- issue: ‘ஒளி’ என்பதன் நேரடி மற்றும் அறநெறி சார்ந்த பொருள்
  choice: முதன்மை உரையில் ‘ஒளி’ என்ற சொல்லை அப்படியே வைத்தல்
  alternative: ‘பகலொளி’ அல்லது ‘நன்மை’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழலில் இரவுக் குற்றமும் பகல் மறைவும் முதன்மையானவை; எனினும் ஞான இலக்கியச் சூழலில் அறநெறி சார்ந்த நிழற்பொருளும் இருக்கலாம். ‘ஒளி’ இரு சாத்தியங்களையும் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: முதல் வினையின் ஒருமையிலிருந்து பின்னைய பன்மைக்கு மாறுதல்
  choice: ‘அவன்’ என்பதிலிருந்து ‘அவர்கள்’ என்பதற்கு மூலத்தின் மாறுதலைப் பாதுகாத்தல்
  alternative: முழு வசனத்தையும் பன்மையில் அமைத்தல்
  rationale: חָתַר என்பது மூன்றாம் நபர் ஆண்பால் ஒருமை; பின்னர் வரும் חִתְּמוּ மற்றும் יָדְעוּ பன்மை. இதை ஒரே எண்ணாகச் சீராக்காமல், குற்றவாளி ஒருவனிலிருந்து அத்தகையோரின் வகுப்புக்குச் செல்லும் எபிரெய வடிவ மாற்றத்தைத் தமிழ் உரை வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சுவர்களைத் துளைத்துப் புகுகிறான்’ என்பது பழங்கால வீடுகளின் சுவரை உடைத்துத் திருடும் படிமத்தைத் தெளிவாக்குகிறது. வினை எண்ணில் மூல எபிரெயத்தில் உள்ள ஒருமை–பன்மை மாற்றம் திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது; ‘ஒளியை அறியார்கள்’ என்ற சற்றுக் கவிதைநயமுள்ள நடை மூலத்தின் சுருக்கத்தையும் பொருள் இருமையையும் தக்கவைக்கிறது.
