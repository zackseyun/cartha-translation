  source_fidelity: மொத்தத்தில் மூலத்தின் உயர்த்தப்படுதல்–தாழ்த்தப்படுதல், மறைதல், அனைவருக்கும் பொதுவான முடிவு, அறுவடை உருவகம் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் «தானியக் கதிரின் நுனி» என்பது רֹאשׁ שִׁבֹּלֶת என்பதிலுள்ள கதிரின் ‘தலை/தலைப்பகுதி’ என்ற குறிப்பை ‘நுனி’ எனச் சுருக்குகிறது; ஆகவே அது திருத்தப்பட வேண்டும். அரிதான יִקָּפְצוּן வினைக்கான நிச்சயமின்மையை அடிக்குறிப்பு சரியாகக் காட்டுகிறது.
