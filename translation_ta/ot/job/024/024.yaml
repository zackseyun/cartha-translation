  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: ta
  text: சிறிது காலம் அவர்கள் உயர்த்தப்படுகிறார்கள்; பின்னர் அவர்கள் இல்லாமல் போகிறார்கள். அவர்கள் தாழ்த்தப்படுகிறார்கள்; அனைவரைப் போல ஒன்றுசேர அகற்றப்படுகிறார்கள்[a]; தானியக் கதிரின் தலைப்பகுதியைப் போல அறுக்கப்படுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுசேரக் கூட்டப்படுகிறார்கள்” அல்லது “அகற்றப்படுகிறார்கள்.” இங்குள்ள எபிரெய வினை அரிதானது; அதன் துல்லியமான பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “தானியக் கதிரின் தலையைப் போல.”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ
  choice: உயர்த்தப்படுகிறார்கள்
  rationale: רוּם என்பதன் உயர்ந்த நிலைக்கு உயர்த்தப்படுதல் என்ற பொருளையும், பின்னர் வரும் தாழ்த்தப்படுதல் என்ற எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: מְעַט
  choice: சிறிது காலம்
  rationale: சொல்லுக்கு அடிப்படையில் ‘சிறிது’ என்றாலும், அடுத்து அவர்கள் இல்லாமல் போவதாகக் கூறப்படுவதால் இங்கு கால அளவைக் குறிக்கிறது.
- source_word: וְאֵינֶנּוּ
  choice: பிறகு இல்லாமல் போகிறார்கள்
  rationale: எபிரெயச் சொற்றொடர் ஒருவரின் மறைவு அல்லது இனி இராமையைச் சுட்டுகிறது; சுற்றியுள்ள பன்மை வினைகளுக்கு ஏற்ப தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְהֻמְּכוּ
  choice: அவர்கள் தாழ்த்தப்பட்டு
  rationale: உயர்த்தப்பட்ட நிலைக்கு நேர்மாறாக, கீழான நிலைக்குக் கொண்டுவரப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּכֹּל
  choice: எல்லாரையும் போல
  rationale: அவர்கள் எல்லா மனிதர்களுக்கும் பொதுவான முடிவையே அடைகிறார்கள் என்ற ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: יִקָּפְצוּן
  choice: வாரிக்கொள்ளப்படுகிறார்கள்
  rationale: அரிதான இந்த வினை இச்சூழலில் ஒன்றாகச் சேர்க்கப்படுதல் அல்லது அகற்றப்படுதல் எனப் பொருள்படலாம்; ‘வாரிக்கொள்ளப்படுகிறார்கள்’ என்பது அந்த இரு நிழற்பொருள்களையும் ஓரளவு காக்கிறது.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: தானியக் கதிரின் நுனியைப் போல
  rationale: தானியக் கதிரின் தலை அல்லது உச்சிப் பகுதியைக் குறிக்கும் அறுவடை உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: יִמָּלוּ
  choice: அறுக்கப்படுகிறார்கள்
  rationale: அறுவடைச் சூழலில் கதிர் அறுக்கப்படுவதைச் சுட்டுவதோடு, அவர்களுடைய திடீர் முடிவையும் உருவகமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீயோரின் முடிவு பொதுவான மனித மரணமா அல்லது விசேஷ நியாயத்தீர்ப்பா
  choice: ‘எல்லாரையும் போல’ என்ற ஒப்பீட்டை மட்டும் காத்து, மரணம் அல்லது நியாயத்தீர்ப்பு என்று விளக்கமாகத் தீர்மானிக்கவில்லை.
  alternative: இதை நேரடியாகத் தெய்வீக நியாயத்தீர்ப்பில் அழிக்கப்படுதல் என்று மொழிபெயர்த்தல்.
  rationale: மூல உரை அவர்களுடைய வீழ்ச்சியையும் அகற்றப்படுதலையும் கூறுகிறது; ஆனால் அதன் துல்லியமான இறையியல் இயங்குமுறையை வெளிப்படையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவமான உயர்வு–தாழ்வு மற்றும் அறுவடை உருவகங்கள் காக்கப்பட்டுள்ளன. அரிதான எபிரெய வினையின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
