base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: ta
  text: இடப்புறத்தில்[b] அவர் செயல்படும்போது, நான் அவரைப் பற்றிக்கொள்ள முடியவில்லை; வலப்புறத்தில் அவர் தம்மை மூடிக்கொள்கிறார்[a]; அவரை நான் காண்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் வலப்புறமாகத் திரும்புகிறார்.” எபிரெயச் சொல்லுக்கு “மூடு, போர்த்து” என்ற பொருளும் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இடது” மற்றும் “வலது.” இவை சில சூழல்களில் முறையே வடக்கு, தெற்கு ஆகிய திசைகளையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂמֹאול
  choice: இடப்புறத்தில்
  rationale: இந்தச் சொல் அடிப்படையில் ‘இடது/இடப்புறம்’ என்றும், நீட்சியாக ‘வடக்கு’ என்றும் குறிக்கலாம். יָמִין என்பதுடன் அமைந்த கவிதை இணைமுரணைத் தக்கவைக்க ‘இடப்புறம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּעֲשֹׂתוֹ
  choice: அவர் செயல்படும்போது
  rationale: ב முன்னொட்டுடன் வந்த עשה வினையின் infinitive construct காலப்பொருளில் ‘அவர் செய்யும்போது/செயல்படும்போது’ எனப் பொருள்படுகிறது.
- source_word: אָחַז
  choice: அவரைப் பற்றிக்கொள்ள முடியவில்லை
  rationale: אחז என்பதன் அடிப்படைப் பொருள் ‘பிடி, பற்றிக்கொள்’. இங்கு தேவனை அணுகிப் பற்றிக்கொள்ளவோ முழுமையாக அறிந்துகொள்ளவோ இயலாத நிலையைச் சுட்டலாம்; தமிழிலும் அந்த உருவகத் திறந்தநிலை பாதுகாக்கப்படுகிறது.
- source_word: יַעְטֹף
  choice: அவர் தம்மை மூடிக்கொள்கிறார்
  rationale: עטף என்பதன் வழக்கமான பொருள் ‘சுற்று, போர்த்து, மூடு’. கடினமான இவ்வரியில் ‘திரும்புகிறார்’ என்ற பொருளும் முன்வைக்கப்படுகிறது; இருப்பினும் சொல் சார்ந்த ‘மூடிக்கொள்கிறார்’ என்பது அவர் காணப்படாமல் இருப்பதையும் இணைவரியையும் இயல்பாகத் தருகிறது.
- source_word: יָמִין
  choice: வலப்புறத்தில்
  rationale: அடிப்படை உடல்சார் திசையான ‘வலது’ பாதுகாக்கப்படுகிறது; ‘தெற்கு’ என்ற நீட்சிப் பொருள் முதன்மை உரையில் ஏற்கப்படவில்லை.
- source_word: אֶרְאֶה
  choice: நான் காண்பதில்லை
  rationale: ראה என்பதன் நேரடியான பொருள் ‘காண்’. சூழலிலிருந்து ‘அவரை’ என்ற செயப்படுபொருள் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மூன்றாம் நபர் வினைகளும் பதிலிடுபெயரும் யாரைக் குறிக்கின்றன
  choice: சுற்றியுள்ள சூழலின்படி தேவனைக் குறிக்கும் வகையில் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: பெயர் குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் ‘அவன்’
  rationale: இவ்வசனம் தனியாக தேவனைப் பெயரிட்டு அழைக்கவில்லை; ஆனால் யோபு 23:8–10 முழுவதும் யோபு தேடும் தேவனே தெளிவான குறிப்பு. தேவனுடைய பெயரை உரைக்குள் புதிதாகச் சேர்க்காமல் சூழல்சார் குறிப்பைத் தக்கவைக்கிறது.
- issue: יַעְטֹף என்பதன் கடினமான பொருள்
  choice: தம்மை மூடிக்கொள்கிறார்
  alternative: வலப்புறமாகத் திரும்புகிறார்
  rationale: சொல்லின் வழக்கமான ‘மூடு/போர்த்து’ பொருளை முதன்மைப்படுத்தி, தேவன் காணப்படாதிருப்பதைச் சித்தரிக்கும் கவித்துவ உருவகத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் கவித்துவ மரியாதையுடன் மொழிபெயர்க்கப்பட்டது. ‘பற்றிக்கொள்ள’ மற்றும் ‘காண’ என்ற வேறுபட்ட எபிரெய வினைகள் ஒன்றாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; தேவனைச் சுட்டும் வினைகளில் தமிழ் மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
