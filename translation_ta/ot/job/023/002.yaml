  source_fidelity: மூல எபிரெயத்தின் வலுவான מְרִי (‘கலகம்/எதிர்ப்பு’) பொருளை ‘கலகமாகவே’ எனத் தக்கவைக்கிறது. גַּם הַיּוֹם என்பதன் தொடர்ச்சியான கால வலியுறுத்தலும், யாதி (‘என் கை’) என்ற மசோரா வாசகமும், עַל என்பதன் வெளிப்படையாகத் தீர்மானிக்கப்படாத ‘மேல்’ உறவும் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: ‘இன்றும்கூட என் முறையீடு கலகமாகவே இருக்கிறது’ நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான புலம்பல் நடையிலும் உள்ளது. இரண்டாம் அரையடியின் சற்றுக் கடினமான அமைப்பு மூலத்திலேயே உள்ள கடினத்தன்மையை உண்மையாகப் பிரதிபலிக்கிறது; அடிக்குறிப்பு வாசகருக்கு தேவையான உதவியை வழங்குகிறது.
