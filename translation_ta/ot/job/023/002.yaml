  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: ta
  text: இன்றும்கூட என் முறையீடு கலகமாகவே இருக்கிறது[a]; என் முனகலின்மேல் என் கை கனமாக இருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் முறையீடு கசப்பானது’ என்றும் மொழிபெயர்க்கலாம். சூழலை முன்னிட்டு சிலர் எபிரெயச் சொல்லை இவ்வாறு மென்மையாகப் புரிந்துகொள்கிறார்கள்; ஆனால் அதன் நேரடியான பொருள் பொதுவாகக் கலகம் அல்லது எதிர்ப்பு என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘என் முனகலின்மேல் என் கை கனமாக இருக்கிறது.’ சிலர் ‘கை’ என்பதை முறையீட்டை அடக்கிவைப்பதையோ சுமையுடன் வெளிப்படுத்துவதையோ குறிக்கும் வழக்காகப் புரிந்துகொள்கிறார்கள்; வேறு சிலர் எபிரெய உரையைத் திருத்தி ‘அவருடைய கை’ என்று வாசிக்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: இன்றும்கூட
  rationale: நிலைமை இன்றுவரை தொடர்வதை வலியுறுத்தும் காலச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מְרִי
  choice: கலகமாகவே இருக்கிறது
  rationale: இச்சொல் பொதுவாகக் கலகம் அல்லது எதிர்ப்பைக் குறிக்கிறது. சூழலை முன்னிட்டு ‘கசப்பானது’ என்று மென்மையாக்காமல், எபிரெயச் சொல்லின் கூர்மையையும் யோபுவின் பேச்சிலுள்ள பதற்றத்தையும் காக்கிறது.
- source_word: שִׂיחִי
  choice: என் முறையீடு
  rationale: இது உரை, மனச்சிந்தனை, முறையீடு ஆகியவற்றைக் குறிக்கலாம்; முனகலுடன் இணையும் புலம்பல் சூழலில் ‘முறையீடு’ பொருத்தமானது.
- source_word: יָדִי
  choice: என் கை
  rationale: மசோரா உரையின் முதலாம் நபர் ஒருமை உரிமை விகுதியை மாற்றமின்றித் தக்கவைக்கிறது; ‘அவருடைய கை’ என்ற திருத்தப்பட்ட வாசகத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: כָּבְדָה
  choice: கனமாக இருக்கிறது
  rationale: வினையின் கனத்த நிலையை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל אַנְחָתִי
  choice: என் முனகலின்மேல்
  rationale: עַל என்பதன் விரிவான ‘மேல்/மீது’ உறவைப் பாதுகாக்கிறது; காரணப்பொருளாகப் புரிந்துகொள்ளும் வாய்ப்பை மட்டும் கட்டாயப்படுத்தவில்லை. אַנְחָה வேதனையால் எழும் முனகல் அல்லது பெருமூச்சைக் குறிக்கிறது.
theological_decisions:
- issue: யோபுவின் முறையீட்டை பாவமுள்ள எதிர்ப்பாகத் தோன்றாதபடி மென்மையாக்க வேண்டுமா?
  choice: ‘கலகமாகவே இருக்கிறது’ என்ற வலுவான பொருளை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘என் முறையீடு கசப்பானது’
  rationale: மூலச்சொல் கலகம் அல்லது எதிர்ப்பை நேரடியாகக் குறிக்கிறது. நீதிமானின் துன்பமும் எல்லைமீறும் எதிர்ப்பை நெருங்கும் அவனுடைய மொழியும் உருவாக்கும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அமைதியாகத் தீர்த்துவிடக் கூடாது.
- issue: ‘என் கை’ என்ற மசோரா வாசகத்தின் கடினத்தன்மை
  choice: முதன்மை உரையில் ‘என் கை’ என்பதைத் தக்கவைத்து, அதன் சாத்தியமான வழக்குப் பொருளையும் மாற்று உரைத் திருத்தத்தையும் அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அவருடைய கை என் முனகலின்மேல் கனமாக இருக்கிறது’
  rationale: கிடைத்துள்ள எபிரெய உரையின் முதலாம் நபர் வாசகத்திற்கு முன்னுரிமை அளித்து, தெளிவுக்காக உரையை ஊகத்தால் மாற்றாமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கலகமாகவே’ என்பது மூலத்தின் வலிமையைத் தக்கவைக்கிறது; இரண்டாம் அரையடியின் திட்டமிட்ட கடினத்தன்மை அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளது.
