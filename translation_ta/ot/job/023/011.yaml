- from: அவருடைய காலடித் தடத்தை என் கால் உறுதியாகப் பற்றிக்கொண்டது[a]; அவருடைய வழியைக் கடைப்பிடித்தேன்; அதைவிட்டு விலகவில்லை.
  to: அவருடைய அடிச்சுவட்டில் என் கால் உறுதியாகப் பதிந்தது[a]; அவருடைய வழியைக் கடைப்பிடித்தேன்; அதைவிட்டு விலகவில்லை.
  rationale: The revision changes only the first clause to natural modern Tamil. ‘அடிச்சுவட்டில்’ reflects the Hebrew relation to his step/track, while ‘உறுதியாகப் பதிந்தது’ conveys firm adherence in a foot-and-path image. The footnote preserves the more literal ‘grasped’ alternative. The rest of the verse is retained because it accurately and clearly represents the source.
