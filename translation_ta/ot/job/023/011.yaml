  edition: WLC
  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: ta
  text: அவருடைய அடிச்சுவட்டில் என் கால் உறுதியாகப் பதிந்தது[a]; அவருடைய வழியைக் கடைப்பிடித்தேன்; அதைவிட்டு விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய அடிச்சுவட்டை என் கால் பற்றிக்கொண்டது.” எபிரெய உருவகம் கடவுளுடைய அடிச்சுவடுகளை நெருக்கமாகவும் உறுதியாகவும் பின்பற்றுவதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: அவருடைய காலடித் தடத்தை
  rationale: אֲשׁוּר என்பது ‘அடி/காலடித் தடம்’ என்பதைக் குறிக்கிறது. ஒருமையையும், கடவுளின் காலடியை நெருக்கமாகப் பின்பற்றும் உருவகத்தையும் தமிழில் இயல்பாகப் பேண ‘காலடித் தடத்தை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָחֲזָה
  choice: உறுதியாகப் பற்றிக்கொண்டது
  rationale: אחז என்பதன் அடிப்படைப் பொருள் ‘பற்று/பிடி’. இங்கு ‘என் கால்’ எழுவாயாக இருப்பதால், வன்மையாகப் பிடிப்பதைவிட விடாமல் ஒட்டியிருக்கும் உறுதியை இது வெளிப்படுத்துகிறது.
- source_word: רַגְלִי
  choice: என் கால்
  rationale: எபிரெய உரை ஒருமையில் உள்ளது; அதன் தெளிவான உடல் சார்ந்த உருவகத்தைத் தமிழிலும் ஒருமையில் பேணுகிறது.
- source_word: דַּרְכּוֹ
  choice: அவருடைய வழி
  rationale: דֶּרֶךְ என்பது நேரடியாக ‘வழி/பாதை’ என்றும், உருவகமாக வாழ்க்கை நெறி என்றும் பொருள்படும். ‘வழி’ இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: שָׁמַרְתִּי
  choice: கடைப்பிடித்தேன்
  rationale: שׁמר என்பதற்கு ‘காத்தல், பின்பற்றுதல், கடைப்பிடித்தல்’ என்ற பொருள்கள் உள்ளன. ‘வழி’ என்பதோடு ‘கடைப்பிடித்தேன்’ என்பது கவனமான கீழ்ப்படிதலையும் தொடர்ந்த உண்மைத்தன்மையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְלֹא אָט
  choice: அதைவிட்டு விலகவில்லை
  rationale: இறுதி வினை வழியிலிருந்து சாய்தல் அல்லது விலகுதலைக் குறிக்கிறது. ‘அதைவிட்டு’ என்பது முந்தைய ‘வழி’யைத் தெளிவாகச் சுட்டி, பாதை உருவகத்தைத் தொடர்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதிகளின் குறிப்பு (‘அவருடைய காலடித் தடம்’, ‘அவருடைய வழி’)
  choice: அவை கடவுளைக் குறிப்பதாக ‘அவருடைய’ என மொழிபெயர்க்கப்பட்டது.
  alternative: குறிப்பிடப்படாத ஒரு நீதியான வழியைக் குறித்தல்
  rationale: யோபு 23:10–12-ன் உடனடிச் சூழலில் யோபு கடவுளையும் அவருக்கு முன்பாகத் தன் நேர்மையையும் பற்றிப் பேசுகிறார். ‘அவருடைய’ என்பது இந்தத் தனிப்பட்ட குறிப்பைப் பேணுகிறது; அதற்கு மேல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘காலடித் தடம்—வழி—விலகுதல்’ என்ற தொடர்ச்சியான பாதை உருவகம் பேணப்பட்டுள்ளது; எபிரெய ஒருமையான ‘என் கால்’ என்பதும் தக்கவைக்கப்பட்டுள்ளது.
