    reason: lexical_alternative
  revision_rationale: The revision changes only the first clause to natural modern Tamil. ‘அடிச்சுவட்டில்’ reflects the Hebrew relation to his step/track, while ‘உறுதியாகப் பதிந்தது’ conveys firm adherence in a foot-and-path image. The footnote preserves the more literal ‘grasped’ alternative. The rest of the verse is retained because it accurately and clearly represents the source.
