translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனாலும் பொதுவாசகருக்கு எளிதில் புரியும் உரை. எபிரெய மொழியின் ‘பதிலளித்து சொன்னான்’ என்ற இரட்டை வினைத் தொடரைச் சொற்சொல்லாக அமைக்காமல், அதன் இரு கூறுகளையும் காக்கும் இயல்பான தமிழ் பேச்சு அறிமுகமாக வழங்கப்பட்டுள்ளது.
