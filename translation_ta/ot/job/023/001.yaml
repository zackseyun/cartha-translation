lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினை இவ்வுரையாடல் சூழலில் ‘பதிலளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படும். தமிழில் அடுத்துவரும் ‘சொன்னது’ என்பதுடன் இயல்பான பேச்சு அறிமுகத் தொடராக அமைகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் வழக்கமான பொருள் ‘சொல்’ என்பதாகும். வரவிருக்கும் நேரடி உரையை அறிமுகப்படுத்துவதால், தமிழின் இயல்பான நடையில் அஃறிணை வினைமுற்று பயன்படுத்தப்படுகிறது.
- source_word: וַ...וַ...
  choice: அப்போது ... -ஆகச் ...
  rationale: முதல் waw-consecutive கதையின் தொடர்ச்சியை முன்னெடுப்பதால் ‘அப்போது’ எனவும், இரண்டாவது இணைப்பு தமிழில் இயல்பான ‘மறுமொழியாகச் சொன்னது’ என்ற ஒருங்கிணைந்த தொடருக்குள் வெளிப்படுத்தப்பட்டுள்ளது.
