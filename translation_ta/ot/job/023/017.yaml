  register: நவீனத் தரத் தமிழில், கவித்துவமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடையைப் பயன்படுத்துகிறது. חֹשֶׁךְ / אֹפֶל என்ற இரு இருள் சொற்களின் தீவிர வேறுபாடு ‘இருள் / காரிருள்’ எனக் காக்கப்பட்டுள்ளது; கடினமான எபிரெய இலக்கணமும் மாற்றுப் பொருள்களும் அடிக்குறிப்பில் வெளிப்படையாகச் சுட்டப்பட்டுள்ளன.
