  text: כִּֽי לֹ֣א נִ֭צְמַתִּי מִ/פְּנֵי חֹ֑שֶׁךְ וּ֝/מִ/פָּנַ֗/י כִּסָּה אֹֽפֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: ta
  text: ஏனெனில், இருளின் காரணமாக நான் மௌனப்படுத்தப்படவில்லை[a]; காரிருள் என் முகத்தை மூடியதன் காரணமாகவும் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், இருளின் காரணமாக நான் அறுத்துப்போடப்படவில்லை; அடர்ந்த இருள் என் முகத்தை மூடியதன் காரணமாகவும் அல்ல.” இந்த வசனத்தின் எபிரெய உரை கடினமானது. குறிப்பாக, “மௌனப்படுத்தப்படவில்லை” என்பதை “அறுத்துப்போடப்படவில்லை” அல்லது “அழித்தொழிக்கப்படவில்லை” என்றும் புரிந்துகொள்ளலாம். இரண்டாம் பகுதியும் “காரிருள் என் முகத்தை மூடியது” என்பதற்குப் பதிலாக, “காரிருள் என் முகத்திலிருந்து மறைக்கப்பட்டது” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; தமிழ் உரையோட்டத்தில் ‘ஏனெனில்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִצְמַתִּי
  choice: நான் மௌனமாக்கப்படவில்லை
  rationale: צמת என்பதன் நிஃபால் வடிவம் ‘மௌனமாக்கப்படுதல்,’ ‘அறுத்துப்போடப்படுதல்,’ அல்லது ‘முடிவுக்குக் கொண்டுவரப்படுதல்’ எனப் பொருள்படலாம். யோபுவின் தொடரும் உரையோடு ‘மௌனமாக்கப்படவில்லை’ நன்றாகப் பொருந்துகிறது; செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: இருளின் காரணமாக
  rationale: מִפְּנֵי இங்கு இடத்தைக் காட்டுவதைக் காட்டிலும் காரணத்தைக் காட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது; இந்தத் தேர்வு தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: וּמִפָּנַי
  choice: என் முகத்தை
  rationale: முதல் நபர் ஒருமை பின்னொட்டுடன் வரும் פָּנִים என்பதைக் ‘என் முகம்’ எனப் புரிந்துகொள்கிறது. எபிரெய உரையின் முன்னிடைச்சொல் காரணமாக இலக்கணச் சிரமம் இருப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּסָּה
  choice: மூடியது
  rationale: ‘மூடுதல்’ அல்லது ‘மறைத்தல்’ என்ற நேரடியான பொருளைத் தருகிறது; இருளின் உருவகத்திலும் இயல்பாக உள்ளது.
- source_word: אֹפֶל
  choice: காரிருள்
  rationale: சாதாரண חֹשֶׁךְ என்பதைக் காட்டிலும் அடர்ந்த, ஆழ்ந்த இருளைக் குறிக்கிறது. ‘காரிருள்’ இரண்டு எபிரெயச் சொற்களுக்கிடையிலான வேறுபாட்டைச் சுருக்கமாகக் காக்கிறது.
