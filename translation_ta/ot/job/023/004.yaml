  source_fidelity: 'மூல எபிரெயத்தில் இரு வினைகளும் யோபுவின் முந்தைய நிபந்தனை விருப்பத்தின் தொடர்ச்சியாக உள்ளன: அவர் தேவனை அடைய முடிந்தால் தம் வழக்கை முன்வைப்பார். வரைவின் எதிர்கால வடிவங்கள் (‘முன்வைப்பேன்’, ‘நிரப்புவேன்’) இந்த நிபந்தனைத் தொனியைத் தனியாகப் படிக்கும் போது போதியளவு காட்டவில்லை. ‘முன்வைத்திருப்பேன்’, ‘நிரப்பியிருப்பேன்’ என்பவை அந்தத் தொனியைத் தெளிவாகக் காக்கின்றன. சட்டவழக்கு உருவகமும் ‘வாதங்கள்’ என்பதும் பொருத்தமானவை.'
  naturalness: ‘அவர் முன்னிலையில் என் வழக்கை முறையாக முன்வைத்திருப்பேன்; என் வாயை வாதங்களால் நிரப்பியிருப்பேன்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘முறையாக’ என்பது ערך சொல்லின் ஒழுங்குபடுத்தும் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
