  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: ta
  text: அவர் முன்னிலையில் என் வழக்கை முறையாக முன்வைத்திருப்பேன்[a]; என் வாயை வாதங்களால் நிரப்பியிருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் முன்னிலையில் ஒரு சட்டவழக்கை ஒழுங்குபடுத்தி வைத்திருப்பேன்.’ இங்குள்ள எபிரெயச் சொல் நீதிமன்றம் சார்ந்த பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘வாதங்கள்’ என்பதற்குப் பதிலாக ‘கண்டனங்கள்,’ ‘நிரூபணங்கள்’ அல்லது ‘எதிர்வாதங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: முறையாக முன்வைப்பேன்
  rationale: ערך என்பதன் அடிப்படைப் பொருள் ஒன்றை ஒழுங்குபடுத்துதல் அல்லது வரிசைப்படுத்தி வைத்தல். இங்குள்ள நீதிமன்றச் சூழலில், வழக்கை ஒழுங்காக எடுத்துரைக்கும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவருடைய முகத்திற்கு முன்/அவர் முன்னிலையில்’ என்று பொருள். கடவுளின் நேரடி முன்னிலையில் யோபு தன் வழக்கை வைக்க விரும்புவதை இது காக்கிறது.
- source_word: מִשְׁפָּט
  choice: என் வழக்கை
  rationale: מִשְׁפָּט என்பதற்கு ‘தீர்ப்பு,’ ‘நீதி’ போன்ற பொருள்கள் இருந்தாலும், இங்கு அது முன்வைக்கப்படும் சட்டவழக்கைக் குறிக்கிறது. ‘என்’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பேசுபவர் தாம் முன்வைக்கவிருக்கும் வழக்கு என்பது சூழலால் தெளிவாகிறது.
- source_word: וּפִי
  choice: என் வாயை
  rationale: எபிரெய உருவகத்தை நேரடியாகக் காக்கிறது; அடுத்துவரும் ‘நிரப்புவேன்’ என்ற வினையோடும் தமிழில் இயல்பாக இணைகிறது.
- source_word: אֲמַלֵּא
  choice: நிரப்புவேன்
  rationale: ‘நிரப்புதல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது. முந்தைய வினையுடன் இணைந்து, யோபு வாய்ப்பு கிடைத்தால் என்ன செய்வார் என்ற சூழல்சார் பொருளையும் தருகிறது.
- source_word: תוֹכָחוֹת
  choice: வாதங்களால்
  rationale: இந்தப் பன்மைச் சொல் கண்டனங்கள், நிரூபணங்கள், எதிர்வாதங்கள் அல்லது தர்க்கங்கள் ஆகிய பொருள்களை ஏற்கலாம். நீதிமன்றச் சூழலில் ‘வாதங்கள்’ என்பது யோபு தன் தரப்புக் காரணங்களை எடுத்துரைப்பதைத் தெளிவாகக் காட்டுகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளுக்கு முன்பாக யோபு பயன்படுத்தும் நீதிமன்ற உருவகம்
  choice: ‘என் வழக்கை முறையாக முன்வைப்பேன்’ என்றும் ‘வாதங்களால்’ என்றும் சட்டவழக்குத் தொனியைத் தெளிவாக வைத்தல்
  alternative: ‘என் காரியத்தை எடுத்துரைப்பேன்’ அல்லது ‘என் குறைகளைச் சொல்வேன்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: ערך, משפט, תוכחות ஆகிய சொற்கள் சேர்ந்து ஒழுங்காக முன்வைக்கப்படும் சட்டவழக்கை நினைவூட்டுகின்றன. கடவுளுக்கு முன் தன் வழக்கை வைக்க யோபு கொண்ட துணிவை மென்மைப்படுத்தாமலும், அதை அவமதிப்பாக விளக்காமலும் மொழிபெயர்ப்பு பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முறையாக முன்வைப்பேன்’ என்பது ஒழுங்குபடுத்துதல் என்ற மூலக் கருத்தையும் நீதிமன்றத் தொனியையும் இயல்பாக இணைக்கிறது. ‘என் வாயை… நிரப்புவேன்’ என்ற எபிரெய உருவகம் தமிழிலும் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது.
