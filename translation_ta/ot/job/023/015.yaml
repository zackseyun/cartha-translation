  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: ta
  text: ஆகையால், அவருடைய முன்னிலையில் நான் திகிலடைகிறேன்[a]; நான் சிந்தித்துப் பார்க்கும்போது[b], அவருக்குப் பயப்படுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அவருக்கு முன்பாக” அல்லது “அவரால்”; எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக “அவருடைய முகம்/சந்நிதியிலிருந்து” என்பதைக் கொண்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “நான் ஆழ்ந்து சிந்திக்கும்போது” அல்லது “நான் தியானிக்கும்போது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய சூழலிலிருந்து வரும் முடிவை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: מִפָּנָיו
  choice: அவருடைய முன்னிலையில்
  rationale: எபிரெய மொழியின் ‘அவருடைய முகம்/சந்நிதியிலிருந்து’ என்ற concrete presence கருத்தைப் பாதுகாத்து, தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶבָּהֵל
  choice: நான் திகிலடைகிறேன்
  rationale: בהל என்பதன் நிபால் வடிவம் குறிக்கும் கடும் கலக்கம் மற்றும் அச்சத்தை மென்மைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: אֶתְבּוֹנֵן
  choice: நான் சிந்தித்துப் பார்க்கும்போது
  rationale: התבונן இங்கு ஆழ்ந்து எண்ணுதல் அல்லது ஆராய்ந்து சிந்தித்தல் என்ற பொருளைத் தருகிறது; அடுத்துவரும் பயத்தின் காரணத் தொடரையும் தமிழில் தெளிவாக்குகிறது.
- source_word: וְאֶפְחַד
  choice: பயப்படுகிறேன்
  rationale: פחד குறிக்கும் நேரடியான அச்சத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִמֶּנּוּ
  choice: அவருக்குப்
  rationale: פחד உடன் வரும் מן இங்கு அச்சத்தின் இலக்கைச் சுட்டுகிறது; ‘அவருக்குப் பயப்படுகிறேன்’ என்பது இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் பின்னொட்டுகளின் சுட்டுப்பொருள்
  choice: மூலத்தில் உள்ளபடியே ‘அவருடைய/அவருக்கு’ என்ற பதிற்பெயர்கள் பயன்படுத்தப்பட்டு, சூழலில் அவை கடவுளைக் குறிக்கின்றன.
  alternative: வசனத்திலேயே ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரெய உரை தெய்வீகப் பட்டத்தைச் சேர்க்காமல் பதிற்பெயர்களையே பயன்படுத்துகிறது; அதையே காப்பது உரையாடல் ஓட்டத்தையும் மூலத்தின் வடிவத்தையும் பாதுகாக்கிறது.
- issue: கடவுளை எதிர்கொள்ளும் யோபுவின் அச்சத்தின் தீவிரம்
  choice: ‘திகிலடைகிறேன்’ மற்றும் ‘பயப்படுகிறேன்’ என்ற வலுவான அச்ச மொழி பயன்படுத்தப்பட்டது.
  alternative: ‘கலங்குகிறேன்’ அல்லது ‘பயபக்தி கொள்கிறேன்’ போன்ற மென்மையான சொற்கள்.
  rationale: வசனம் உண்மையான பேரச்சத்தை வெளிப்படுத்துகிறது; அதை வெறும் பயபக்தியாக மாற்றாமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கவிதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சந்நிதி’ என்பதற்குப் பதிலாக விரிவாகப் புரியும் ‘முன்னிலை’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; மூலத்தின் concrete idiom அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
