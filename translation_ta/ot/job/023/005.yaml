  yaml_path: translation/ot/job/023/005.yaml
  text: I would know the words with which he would answer me, and understand what he would say to me.
translation:
  language: ta
  text: அவர் எனக்குப் பதிலளிக்கும் வார்த்தைகளை அறிந்துகொள்ள விரும்புகிறேன்; அவர் என்னிடம் என்ன சொல்வார் என்பதையும் புரிந்துகொள்ள விரும்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: நான் அறிந்துகொள்வேன்
  rationale: ידע என்பதன் Qal cohortative வடிவம், கடவுளின் முன்னிலையில் தன் வழக்கை வைக்க முடிந்தால் அதன் விளைவாக அறிந்துகொள்ள வேண்டும் என்ற யோபுவின் விருப்பத்தைக் காட்டுகிறது. தமிழில் இச்சூழலின் நிபந்தனை சார்ந்த விருப்பத்தன்மை முந்தைய வசனங்களால் தெளிவாக இருப்பதால், இயல்பான எதிர்கால வடிவம் பொருத்தமானது.
- source_word: מִלִּים
  choice: வார்த்தைகளால்
  rationale: מִלִּים என்பதன் அடிப்படைப் பொருள் ‘வார்த்தைகள்’. ‘வாதங்கள்’ என மொழிபெயர்ப்பது நீதிமன்றச் சூழலை அளவுக்கு மீறி விளக்கிவிடும். ענה வினையுடன் தமிழில் கருவிப் பொருளைத் தெளிவாக்க ‘வார்த்தைகளால்’ என வழங்கப்பட்டுள்ளது.
- source_word: יַעֲנֵנִי
  choice: அவர் எனக்கு ... பதிலளிப்பார்
  rationale: ענה இங்கு ‘பதிலளி’ என்று பொருள்படும். யோபு விரும்பும் கற்பனைச் சந்திப்பின் சூழலில் எதிர்கால வடிவம் இயல்பாக அந்த நிபந்தனைத் தன்மையைத் தாங்குகிறது.
- source_word: וְאָבִינָה
  choice: புரிந்துகொள்வேன்
  rationale: בין என்பதன் Qal வடிவம் ‘புரிந்துகொள்/பகுத்தறி’ என்ற பொருளுடையது. முதல் கூறிலுள்ள ‘அறிந்துகொள்வேன்’ என்பதற்கு இணையாக இயல்பான தமிழில் ‘புரிந்துகொள்வேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַה
  choice: என்ன
  rationale: கடவுளின் கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வினாப்பெயராக உள்ள எபிரேயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יֹאמַר לִי
  choice: அவர் என்னிடம் ... சொல்வார்
  rationale: אמר என்பது பொதுவான ‘சொல்’ என்னும் வினை. ‘என்னிடம் சொல்வார்’ என்பது எபிரேயத்தின் நேரடித்தன்மையைப் பாதுகாக்கிறது; ‘தெரிவிப்பார்’ போன்ற கூடுதல் நுண்பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: பதில் அளிப்பவரின் அடையாளம்
  choice: ‘அவர்’ என்ற பிரதிப்பெயரைத் தக்கவைத்தல்
  alternative: ‘கடவுள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இவ்வசனத்தின் எபிரேய உரையில் பெயர் வெளிப்படையாக இல்லை; சூழல் கடவுளைக் குறித்தாலும், மூலத்தின் பிரதிப்பெயர் அமைப்பையும் அதன் இலக்கியத் தொடர்ச்சியையும் பாதுகாக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கவிதைநடையின் இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘அறிந்துகொள்வேன் / புரிந்துகொள்வேன்’ என்ற இணை வினைகள் எபிரேயக் கூறுகளின் சமநிலையை வெளிப்படுத்துகின்றன. விளக்க அடிக்குறிப்பு தேவையில்லை.
