  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: ta
  text: ஆனால் அவர் ஒரே மனதாய் இருக்கிறார்[a]; அவரைத் தன் போக்கிலிருந்து திருப்ப யாரால் முடியும்? அவரது உள்ளம் விரும்புவதை[b] அவர் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படியாக, “அவர் ஒன்றில் [இருக்கிறார்]” என்று உள்ளது. இச்சொற்றொடர் அவர் ஒரே மனதோடும் மாறாத தீர்மானத்தோடும் இருப்பதைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவர் விரும்புவதை” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “அவரது நெஃபெஷ்” என்று உள்ளது; இது ஒருவரது உயிர், தன்னையே, அல்லது உள்ளார்ந்த விருப்பத்தைக் குறிக்கக்கூடிய சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: ஆனால் அவர்
  rationale: முந்தைய சூழலுடன் உள்ள வேறுபாட்டை וְ இங்கு உணர்த்துகிறது; தனிப்பட்ட சுட்டுப்பெயரையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: בְאֶחָד
  choice: ஒரே மனதாய் இருக்கிறார்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘ஒன்றில்’ என இருந்தாலும், சூழலில் ஒரே உறுதியான நோக்கம் அல்லது மாறாத தீர்மானத்தைக் குறிக்கிறது. தமிழில் ‘ஒரே மனதாய்’ என்பது மூல உருவகத்தை ஓரளவு காத்து, இயல்பாகவும் புரியும்படியாகவும் உள்ளது.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: அவரைத் திருப்பிவிட யாரால் முடியும்?
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ஒருவரைத் திருப்புதல் அல்லது அவரது போக்கை மாற்றுதல் என்ற படிமத்தைத் தருகிறது; கேள்வியின் எதிர்க்க முடியாத தன்மையையும் தமிழ் வடிவம் காக்கிறது.
- source_word: וְנַפְשׁוֹ
  choice: அவரது உள்ளம்
  rationale: נֶפֶשׁ என்பது உயிர், தன்னையே, உள்ளார்ந்த விருப்பம் ஆகியவற்றைக் குறிக்கலாம். ‘உள்ளம்’ என்பது இங்கு விருப்பத்தின் இருப்பிடத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்லாக இருந்து, மூலத்தின் மனித உருவகப் பேச்சையும் காக்கிறது.
- source_word: אִוְּתָה
  choice: விரும்புவதை
  rationale: இந்த வினை விரும்புதல் அல்லது மனங்கொள்ளுதல் என்னும் பரந்த பொருளைக் கொண்டது; ‘விரும்பு’ தேவையற்ற தீவிரத்தையோ கோட்பாட்டு விளக்கத்தையோ சேர்க்காது.
- source_word: וַיָּעַשׂ
  choice: அவர் செய்கிறார்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’; ‘நிறைவேற்றுகிறார்’ என்று வலுப்படுத்தாமல் மூலத்தின் எளிய வினையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளின் உறுதியான நோக்கத்தை விவரிக்கும் בְאֶחָד என்பதன் பொருள்
  choice: அவர் ஒரே மனதாய் இருக்கிறார்
  alternative: அவர் மாறாதவராய் இருக்கிறார் / அவர் ஒன்றாய் இருக்கிறார்
  rationale: இந்த இடத்தில் எபிரெயம் சுருக்கமாகவும் ஓரளவு தெளிவின்மையுடனும் உள்ளது. ‘மாறாதவர்’ என்பது பிற்கால மெய்யியல் பண்பாக அதிகமாக விரிவுபடுத்தக்கூடும்; ‘ஒன்றாய் இருக்கிறார்’ என்பது தமிழில் பொருள் மங்கலாக இருக்கும். ‘ஒரே மனதாய்’ என்பது ஒருமுகமான, உறுதியான நோக்கத்தை வெளிப்படுத்தி, மூலத்தின் பதற்றத்தையும் அடிக்குறிப்பின் வழியாக அதன் எழுத்துப்படியான வடிவத்தையும் காக்கிறது.
- issue: נֶפֶשׁ என்பதைக் கடவுளைப் பற்றிப் பயன்படுத்தும் மனித உருவக மொழி
  choice: அவரது உள்ளம் விரும்புவதை
  alternative: அவர் விரும்புவதை / அவரது ஆத்துமா விரும்புவதை
  rationale: ‘அவர் விரும்புவதை’ என்பது மூலத்தில் வெளிப்படையாக உள்ள נֶפֶשׁ என்பதை மறைக்கிறது; ‘ஆத்துமா’ என்பது இன்றைய சாதாரண தமிழில் கோட்பாட்டுச் சுமையை ஏற்படுத்தலாம். ‘உள்ளம்’ மூலத்தின் மனித உருவகத்தையும் விருப்பம் என்ற கருத்தையும் இயல்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கவித்துவச் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘ஒரே மனதாய்’ மற்றும் ‘உள்ளம்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் உண்மையான பொருள் நிழல்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
