source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: ta
  text: ஆனால் கடவுள் என் இதயத்தைத் தளரச் செய்தார்[a]; சர்வவல்லவர் என்னைத் திகிலடையச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயத்தை மென்மையாக்கினார்.” எபிரெய வினை சொல்லுக்குச் சொல் “மென்மையாக்கினார்” என்று பொருள்படும்; இங்கு யோபுவின் துணிவும் உள்ளுறுதியும் கரைந்துபோனதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: ஆனால் கடவுள்
  rationale: וְ என்ற இணைப்புச்சொல் அடிப்படையில் ‘மேலும்/மற்றும்’ எனப் பொருள்படலாம்; முந்தைய வசனத்தின் அச்சத்திற்கான காரணத்தை யோபு இங்கு கூறுவதால், சூழலில் உள்ள மாறுபாட்டு நயத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. אֵל என்பதற்கு பொதுவான இறைச்சொல்லாக ‘கடவுள்’ பயன்படுத்தப்பட்டது.
- source_word: הֵרַךְ
  choice: தளரச் செய்தார்
  rationale: רכך என்ற வினை நேரடியாக ‘மென்மையாக்குதல்’ என்று பொருள்படும். ‘இதயம்’ என்பதுடன் வரும்போது துணிவோ உள்ளுறுதியோ கரைந்துபோவதைச் சுட்டுகிறது; ஆகவே தமிழில் இயல்பாகவும் உருவகத்தை ஓரளவு காக்கவும் ‘தளரச் செய்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִבִּי
  choice: என் இதயத்தை
  rationale: לֵב என்பது உள்ளம், மனவுறுதி, துணிவு ஆகியவற்றை உள்ளடக்கும். ‘இதயம்’ என்ற சொல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; வினை அதன் சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְשַׁדַּי
  choice: சர்வவல்லவர்
  rationale: שַׁדַּי இங்கு இறைப்பட்டமாக வருகிறது. பெயராக ஒலிபெயர்ப்பதைவிட அதன் பொருளைத் தரும் ‘சர்வவல்லவர்’ என்ற பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் பட்டம் பயன்படுத்தப்பட்டது.
- source_word: הִבְהִילָנִי
  choice: என்னைப் பயங்கொள்ளச் செய்தார்
  rationale: בהל என்பதன் ஹிபீல் வடிவம் கடும் அச்சம் அல்லது கலக்கத்தை உண்டாக்குதலைக் குறிக்கிறது. ‘பயங்கொள்ளச் செய்தார்’ காரணவினை அமைப்பையும் வலிமையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אֵל மற்றும் שַׁדַּי என்ற இறைச்சொற்களின் மொழிபெயர்ப்பு
  choice: கடவுள் ... சர்வவல்லவர்
  alternative: கடவுள் ... ஷத்தாய்
  rationale: இரண்டு இறை அடையாளங்களும் இணையான அமைப்பில் வருகின்றன. אֵל பொதுவான இறைச்சொல்லாகவும் שַׁדַּי ஒரு பட்டமாகவும் உள்ளதால், அவற்றை முறையே ‘கடவுள்’ என்றும் ‘சர்வவல்லவர்’ என்றும் மொழிபெயர்ப்பது பொருளை நேரடியாகக் காக்கிறது; குறிப்பிட்ட சமயப்பிரிவு சார்ந்த விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய ‘இதயம்’ உருவகம் காக்கப்பட்டுள்ளது; அதன் சூழல்சார் பொருள் ‘தளரச் செய்தார்’ என்பதால் வெளிப்படுகிறது. ‘சர்வவல்லவர்’ இறைப்பட்டமாகத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
