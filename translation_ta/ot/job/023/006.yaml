  text: הַ/בְּ/רָב כֹּ֭חַ יָרִ֣יב עִמָּדִ֑/י לֹ֥א אַךְ ה֝֗וּא יָשִׂ֥ם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: ta
  text: அவர் தமது மிகுந்த வல்லமையைக் கொண்டு என்னோடு வழக்காடுவாரா? இல்லை; நிச்சயமாக அவர் எனக்குச் செவிகொடுப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் என்மீது தம் மனதைச் செலுத்துவார்”; அல்லது, “அவர் என்னுள் வல்லமையை வைப்பார்” என்றும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: தமது மிகுந்த வல்லமையைக் கொண்டு
  rationale: வினாவிடைத் துகளுடன் வரும் בְּרָב כֹּחַ, கடவுள் தமது அளவற்ற வலிமையை அடிப்படையாகக் கொண்டு யோபுடன் வழக்காடுவாரா எனக் கேட்கிறது. தமிழ் நடைமுறைக்கு ஏற்றவாறு ‘மிகுந்த வல்லமையைக் கொண்டு’ என்பது abundance/greatness மற்றும் power ஆகிய இரு கூறுகளையும் வெளிப்படுத்துகிறது.
- source_word: יָרִיב עִמָּדִי
  choice: என்னோடு வழக்காடுவாரா
  rationale: ריב இச்சூழலில் நீதிமன்றம் சார்ந்த வழக்காடுதல் அல்லது எதிர்வாதம் செய்தல் என்ற பொருள் கொண்டது. முந்தைய மற்றும் பிந்தைய வசனங்களின் நீதித்துறைச் சூழலை ‘வழக்காடுவாரா’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֹא אַךְ
  choice: இல்லை; நிச்சயமாக
  rationale: לֹא முந்தைய சாத்தியத்தைத் திட்டவட்டமாக மறுக்கிறது; אַךְ அடுத்த கூற்றை வலியுறுத்துகிறது. ‘இல்லை; நிச்சயமாக’ இந்த எதிர்மறை மற்றும் உறுதியான திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָשִׂם בִּי
  choice: அவர் எனக்குச் செவிகொடுப்பார்
  rationale: שׂים + ב ஒருவர்மீது கவனம் செலுத்துதல் அல்லது அவருக்குச் செவிகொடுத்தல் எனப் பொருள்படலாம். யோபு தன் வழக்கை முன்வைக்க விரும்பும் நீதித்துறைச் சூழலில் ‘எனக்குச் செவிகொடுப்பார்’ இயல்பான முதன்மைப் பொருள்; ‘என்னுள் வல்லமையை வைப்பார்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இரண்டாம் அடியில் கடவுளின் செயல் குறிக்கும் பொருள்
  choice: கடவுள் தம்முடைய வல்லமையால் யோபை ஒடுக்காமல், அவருடைய வழக்கிற்குச் செவிகொடுப்பார் என்று யோபு நம்பிக்கை தெரிவிக்கிறார்.
  alternative: கடவுள் யோபுக்குள் வல்லமையை வைப்பார்; அல்லது பொதுவான பொருளில் தமது கவனத்தை யோபின்மீது வைப்பார்.
  rationale: 'யோபு 23:3–7-இன் உடனடிச் சூழல் நீதித்துறை சார்ந்தது: யோபு கடவுள்முன் தன் வழக்கை எடுத்துரைக்க விரும்புகிறார். ஆகவே, இங்கு கடவுள் அவருக்குச் செவிகொடுப்பார் என்பது சூழலுக்கு மிகவும் பொருத்தமானது. எனினும், எபிரெய சொற்றொடரின் வேறு சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாக வைத்திருப்பதால், கடவுளின் வல்லமைக்கும் அவர் நியாயமாகக் கேட்பார் என்ற யோபின் நம்பிக்கைக்கும் இடையிலான பதற்றம் தீர்த்துவைக்கப்படவில்லை.'
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீதித்துறைச் சாயலைக் காக்க ‘வழக்காடுதல்’ என்றும், நேரடியான புரிதலுக்காக ‘செவிகொடுத்தல்’ என்றும் வழங்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
