  text: כִּֽי יָ֭דַע דֶּ֣רֶךְ עִמָּדִ֑/י בְּ֝חָנַ֗/נִי כַּ/זָּהָ֥ב אֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: ta
  text: ஆனால், நான் செல்லும் வழியை அவர் அறிவார்[a]; அவர் என்னைச் சோதித்த பின்[b], நான் பொன்னைப் போல வெளிவருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வழியை அவர் அறிவார்.’ எபிரெயச் சொற்றொடர் சொற்சொல்லாக ‘என்னுடன் உள்ள வழி’ என உள்ளது; இது யோபின் வழி அல்லது அவர் செல்லும் பாதை என்ற பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் என்னைச் சோதித்தால்’ அல்லது ‘அவர் என்னைச் சோதிக்கும்போது.’ எபிரெய அமைப்பு காலம் அல்லது நிபந்தனை சார்ந்த ஒன்றுக்கு மேற்பட்ட நுணுக்கத்தை அனுமதிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஆனால்
  rationale: இச்சொல் பொதுவாக ‘ஏனெனில்’ என்றும் பொருள்படும். ஆனால், முந்தைய வசனங்களில் யோபால் இறைவனைக் காண முடியாத நிலைக்கும், இறைவன் யோபின் வழியை அறிந்திருப்பதற்கும் இடையிலான மாறுபாட்டை இங்கு இயல்பாக வெளிப்படுத்த ‘ஆனால்’ ஏற்றது.
- source_word: יָדַע
  choice: அறிவார்
  rationale: இறைவன் யோபின் நிலை மற்றும் வாழ்க்கைப் பாதையை முழுமையாக அறிந்திருப்பதை நிகழ்காலப் பொருளில் இயல்பாகக் காட்டுகிறது.
- source_word: דֶּרֶךְ
  choice: வழி
  rationale: இது நேரடியான பாதையையும், உருவகமாக வாழ்க்கையின் போக்கு அல்லது நடத்தையையும் குறிக்கலாம்; ‘வழி’ இந்த உருவக விரிவைத் தக்கவைக்கிறது.
- source_word: עִמָּדִי
  choice: என்னுடன் உள்ள
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான ‘என்னுடன்’ என்ற உறவைப் பாதுகாக்கிறது. ‘என் வழி’ எனச் சீராக்கவும் முடியும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּחָנַנִי
  choice: அவர் என்னைச் சோதித்த பின்
  rationale: בחן என்பது சோதித்தல், ஆராய்தல், தரத்தை நிரூபித்தல் ஆகிய பொருள்களை உடையது. தொடர்ந்து வரும் பொன் உருவகத்துடன் ‘சோதித்தல்’ பொருந்துகிறது; முடிவை நோக்கிய காலத் தொடர்பை ‘சோதித்த பின்’ தெளிவாகவும் இயல்பாகவும் தருகிறது, அதேவேளை பிற சாத்திய நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כַּזָּהָב
  choice: பொன்னைப் போல
  rationale: כ என்ற ஒப்புமைக் குறியை இயல்பான தமிழில் வெளிப்படுத்தி, புடமிடுதல் அல்லது தரச் சோதனை சார்ந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אֵצֵא
  choice: நான் வெளிவருவேன்
  rationale: יצא என்பதன் ‘வெளியே வருதல்’ என்ற அடிப்படைப் பொருளையும், சோதனைக்குப் பின் உண்டாகும் முடிவையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைச் சோதனைக்கும் யோபின் நிரூபணத்திற்கும் உள்ள உறவு
  choice: இறைவன் யோபின் வழியை அறிவதையும், சோதனைக்குப் பின் பொன்னைப் போல வெளிவரும் சாதகமான முடிவையும் மட்டும் மொழிபெயர்த்து, உருவகத்தின் திறந்த பொருளைத் தக்கவைத்தல்.
  alternative: இதை முதன்மையாக நீதிமன்றப் பாணியிலான குற்றமின்மை நிரூபணம் என்றோ, முதன்மையாக ஒழுக்கத் தூய்மைப்படுத்தல் என்றோ விளக்குதல்.
  rationale: பொன் மற்றும் சோதனை உருவகம் குற்றமின்மை நிரூபிக்கப்படுவதையும் தூய்மைப்படுத்தப்படுவதையும் சுட்டக்கூடும். எபிரெய உரை இவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தீர்மானிக்காததால், மொழிபெயர்ப்பும் அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னுடன் உள்ள வழி’ என்பது தமிழில் சற்று குறியீட்டுத்தன்மையுடன் இருந்தாலும், எபிரெயின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; இயல்பாக்கப்பட்ட மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
