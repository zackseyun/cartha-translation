  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: ta
  text: அவரை நான் எங்கே கண்டடையலாம் என்று அறிந்திருந்தால்! அவரது இருப்பிடம்வரை[a] நான் வருவேனே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது இடம்.” எபிரெயச் சொல் நிலைபெற்ற அல்லது நிர்ணயிக்கப்பட்ட இடத்தைக் குறிக்கலாம்; எனவே, அவரைக் காணக்கூடிய இருப்பிடம் என்ற பொருளையும் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: என்று மட்டும் ... தெரிந்தால்!
  rationale: இந்த எபிரெய மொழிவழக்கு, ‘யார் கொடுப்பார்?’ என்ற நேரடிக் கேள்வியல்ல; நிறைவேற வேண்டும் என்ற ஆழ்ந்த ஏக்கத்தை வெளிப்படுத்துகிறது. தமிழில் ‘மட்டும் ... தெரிந்தால்!’ என்பது அந்த விருப்ப உணர்வை இயல்பாகக் காட்டுகிறது.
- source_word: יָדַעְתִּי
  choice: எனக்குத் தெரிந்தால்
  rationale: வடிவத்தில் இது முதல் நபர் ஒருமை நிறைவுவினையாக இருந்தாலும், விருப்ப மொழிவழக்கிற்குள் ஆசைப்படும் நிலையைக் குறிக்கிறது. தமிழில் நிபந்தனை வடிவம் அந்த ஏக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶמְצָאֵהוּ
  choice: அவரை எங்கே கண்டடையலாம்
  rationale: சூழலில் ஆண்பால் ஒருமை பின்னொட்டு கடவுளைக் குறிக்கிறது. எபிரெயில் வெளிப்படையாக இல்லாத ‘எங்கே’ என்பது ‘கண்டடைவது’ மற்றும் அடுத்துள்ள இடக் குறிப்பால் உணர்த்தப்படுவதால் தமிழில் இயல்பிற்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָבוֹא עַד
  choice: நான் செல்வேன்
  rationale: யோபுவின் ஏக்கத்தின் விளைவாக அந்த இடத்தை நோக்கிச் செல்வதை இது குறிக்கிறது. ‘செல்வேன்’ என்பது இலக்கை நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் தருகிறது; ‘-க்கே’ עַד-இன் இலக்கு வலியுறுத்தலைத் தாங்குகிறது.
- source_word: תְּכוּנָתוֹ
  choice: அவரது இருப்பிடம்
  rationale: இந்தப் பெயர்ச்சொல் நிலைபெற்ற அல்லது நிர்ணயிக்கப்பட்ட இடத்தைக் குறிக்கலாம். ‘இருப்பிடம்’ என்பது ‘வீடு’ அல்லது ‘அரியணை’ போன்ற கூடுதல் விளக்கங்களைச் சேர்க்காமல், அவரைக் காணக்கூடிய இடம் என்ற பொருளைத் தருகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டுகளின் குறிப்பு
  choice: சூழலின் அடிப்படையில் கடவுளைக் குறிக்கும் ‘அவர்/அவரது’
  alternative: பெயரைக் குறிப்பிடாமல் ஆண்பால் ஒருமைச் சுட்டை மட்டும் மிக நேரடியாகப் பிரதிபலித்தல்
  rationale: உடனடியான சூழலில் யோபு கடவுளின் முன்னிலையில் தன் வழக்கை எடுத்துரைக்க விரும்புகிறார். வசனம் கடவுளின் பெயரைச் சொல்லாவிட்டாலும், பின்னொட்டுகள் சூழலில் அவரையே குறிக்கின்றன; தமிழின் மரியாதை ஒருமை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் யோபுவின் ஆழ்ந்த ஏக்கத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் வியப்புக்குறி விருப்ப மொழிவழக்கின் உணர்ச்சியைத் தாங்குகிறது; ‘எங்கே’ என்பது எபிரெயில் உள்ளடக்கமாக உணர்த்தப்பட்டதை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
