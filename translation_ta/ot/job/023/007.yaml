  edition: WLC
  text: שָׁ֗ם יָ֭שָׁר נוֹכָ֣ח עִמּ֑/וֹ וַ/אֲפַלְּטָ֥ה לָ֝/נֶ֗צַח מִ/שֹּׁפְטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: ta
  text: அங்கே நேர்மையானவன் அவரோடு வாதிட முடியும்[a]; என் நீதிபதியிடமிருந்து நான் என்றென்றுமாக விடுபடுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரோடு வழக்காட முடியும்” அல்லது “அவர்முன் தன் வழக்கை எடுத்துரைக்க முடியும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் நீதிபதியிடமிருந்து என்றென்றுமாகத் தப்புவேன்”; “என்னை நியாயந்தீர்ப்பவரிடமிருந்து” என்றும் எபிரெய வாசகத்தைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய வசனங்களில் யோபு கற்பனை செய்யும் இறைச் சந்திப்பின் இடத்தைச் சுட்டும் இயல்பான இடவினையடை.
- source_word: יָשָׁר
  choice: நேர்மையானவன்
  rationale: ஒழுக்க நேர்மையையும் குற்றமற்ற நிலைப்பாட்டையும் உணர்த்தும் பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்படுகிறது.
- source_word: נוֹכָח
  choice: வாதிட முடியும்
  rationale: இங்கு நீதிமன்றச் சூழலில் ஒருவரின் வழக்கை எடுத்துரைத்து எதிர்தரப்புடன் விவாதிக்கும் பொருள் உள்ளது; ‘முடியும்’ என்பது சூழலின் சாத்தியநிலையை வெளிப்படுத்துகிறது.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: எபிரெய மொழியின் ‘அவனோடு/அவரோடு’ என்ற நேரடிப் பொருளைப் பேணுகிறது; சூழலில் சுட்டப்படுவது கடவுள் என்பதால் தமிழின் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַאֲפַלְּטָה
  choice: நான் ... விடுபடுவேன்
  rationale: פלט என்ற வேர்ச்சொல் தப்புதல் அல்லது விடுதலை பெறுதல் என்பதைக் குறிக்கிறது. சட்டச் சூழலுக்குப் பொருந்தும் வகையில், ஆனால் ‘குற்றமற்றவன் எனத் தீர்க்கப்படுவேன்’ என்று பொருளை மிகைப்படுத்தாமல், ‘விடுபடுவேன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָנֶצַח
  choice: என்றென்றுமாக
  rationale: நிலையான, முடிவுறாத விடுதலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשֹּׁפְטִי
  choice: என் நீதிபதியிடமிருந்து
  rationale: ‘என் நீதிபதி’ என்ற நீதிமன்ற உருவகத்தைப் பேணி, அவர் கடவுளா அல்லது யோபைத் தீர்ப்பிடுபவரா என்பதை விளக்கிச் சுருக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘என் நீதிபதி’ என்பவரின் அடையாளமும் சட்டப் பொருளும்
  choice: ‘என் நீதிபதி’ என்றே வைத்து, அவர் யார் என்பதை வெளிப்படையாகத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘என்னை நியாயந்தீர்ப்பவர்’ அல்லது ‘என் குற்றஞ்சாட்டுபவர்’
  rationale: எபிரெய வாசகம் நீதிமன்ற உருவகத்தைத் தெளிவாகக் கொண்டிருந்தாலும், அந்தப் பாத்திரத்தை ‘குற்றஞ்சாட்டுபவர்’ எனக் குறுக்கவோ அதன் இறையியல் பதற்றத்தை நீக்கவோ கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் நீதிமன்றச் சொற்களும், நீதிபதியின் அடையாளத்தைச் சார்ந்த உண்மையான தெளிவின்மையும் பேணப்பட்டுள்ளன.
