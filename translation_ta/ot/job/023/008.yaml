  edition: WLC
  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: ta
  text: இதோ[a], நான் கிழக்கே சென்றாலும் அவர் அங்கே இல்லை; மேற்கே சென்றாலும் அவரைக் கண்டுணர முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிழக்கே … மேற்கே’ என்பதற்கு ‘முன்னே … பின்னே’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத் திசைச்சொற்கள் இடஞ்சார்ந்த கிழக்கு/மேற்கு என்ற பொருளிலும், முன்னே/பின்னே என்ற பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: யோபுவின் கூற்றுக்குக் கவனத்தை ஈர்க்கும் இடைச்சொல். நவீனத் தமிழிலும் கண்ணியமான கவிதை நடையிலும் இயல்பாக உள்ளது.
- source_word: קֶדֶם
  choice: கிழக்கே
  rationale: אָחוֹר என்பதுடன் இணைந்த எதிர்த்திசைச் சொல்லாக வருவதால், இங்கே இடஞ்சார்ந்த ‘கிழக்கு’ என்ற பொருள் முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; ‘முன்னே’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶהֱלֹךְ
  choice: நான் ... சென்றாலும்
  rationale: הלך என்பதன் தேடிச் செல்லும் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெய வாவ் இணைப்பில் உள்ள எதிர்மறை விளைவைத் தமிழ் நிபந்தனை-எதிர்மறை அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֵינֶנּוּ
  choice: அவர் அங்கே இல்லை
  rationale: சூழலில் சுட்டப்படுபவர் கடவுள். திசை நோக்கிச் சென்றும் அவரைக் காணாத நிலையைத் தமிழில் தெளிவுபடுத்த ‘அங்கே’ சேர்க்கப்பட்டது; இது அவர் இல்லவே இல்லை என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: אָחוֹר
  choice: மேற்கே
  rationale: קֶדֶם என்பதற்கு எதிர்த்திசையாகக் கவிதை இணையில் வருவதால் ‘மேற்கு’ இயல்பான பொருத்தம். ‘பின்னே’ என்ற சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא אָבִין לוֹ
  choice: அவரைக் கண்டுணர முடியவில்லை
  rationale: בין இங்கே தேடலின் சூழலில் ஒருவரை உணர்ந்து அடையாளம் காணுதல் அல்லது கண்டறிதல் என்ற நுண்பொருளைக் கொண்டது. ‘கண்டுணர’ என்பது வெறும் கண்பார்வையையோ அறிவார்ந்த புரிதலையோ மட்டும் குறிக்காமல் இரு நிழற்பொருள்களையும் தக்கவைக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: சுட்டுப்பெயர் கடவுளைக் குறிப்பதாகக் கொண்டு ‘அவர்/அவரை’ என மொழிபெயர்க்கப்பட்டது.
  alternative: வெளிப்படையாக அடையாளப்படுத்தப்படாத ஓர் ஆண்பால் ஒருமை நபர்
  rationale: சுற்றியுள்ள வசனங்களில் யோபு கடவுளைத் தேடுவதே கருத்தாக இருப்பதால் இக்குறிப்பு சூழலால் உறுதிப்படுகிறது; இதற்கு மேலான இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவாக்கியத்தின் சுருக்கமும் எதிர்த்திசை அமைப்பும் காக்கப்பட்டுள்ளன.
