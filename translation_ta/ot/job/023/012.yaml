source:
  edition: WLC
  text: מִצְוַ֣ת שְׂ֭פָתָי/ו וְ/לֹ֣א אָמִ֑ישׁ מֵ֝/חֻקִּ֗/י צָפַ֥נְתִּי אִמְרֵי פִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: ta
  text: அவருடைய உதடுகளின் கட்டளையைவிட்டு நான் விலகவில்லை; எனக்கு ஒதுக்கப்பட்ட பங்கைவிட அவருடைய வாயின் சொற்களைப் பொக்கிஷமாகப் பேணியிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடினமான எபிரேய சொற்றொடருக்கான பாரம்பரிய விளக்கத்தைப் பின்பற்றி, “எனக்குத் தேவையான உணவைவிட அவருடைய வாயின் சொற்களைப் பொக்கிஷமாகப் பேணியிருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: கட்டளை
  rationale: தனித்த எண்ணிலுள்ள இச்சொல் ‘அவருடைய உதடுகள்’ என்பதுடன் இணைகிறது; ‘கட்டளை’ என்பது அதன் ஒருமை வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שְׂפָתָיו
  choice: அவருடைய உதடுகள்
  rationale: சொல்லின் நேரடியான உருவகத்தைத் தக்கவைத்து, பின்னர் வரும் ‘அவருடைய வாய்’ என்பதுடனான கவிதை இணைப்பைப் பாதுகாக்கிறது; சூழலில் மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி கடவுளைக் குறிக்கிறது.
- source_word: לֹא אָמִישׁ
  choice: நான் விலகவில்லை
  rationale: מוש என்பதன் ஹிஃபில் வடிவம் இங்கு அகலாமல் அல்லது வழிவிலகாமல் இருப்பதைக் குறிக்கிறது; ‘விலகவில்லை’ என்பது கீழ்ப்படிதலின் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: מֵחֻקִּי
  choice: எனக்கு ஒதுக்கப்பட்ட பங்கைவிட
  rationale: முதல் நபர் ஒருமை விகுதியுள்ள இக்கடினமான சொற்றொடர் ஒப்பீட்டுப் பொருளில், தனக்கு விதிக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட பங்கைவிட என்று புரிந்துகொள்ளப்படுகிறது. இந்த மொழிபெயர்ப்பு பெற்ற எபிரேய வடிவத்துக்கு அருகில் இருந்து சூழலில் தெளிவான பொருளைத் தருகிறது.
- source_word: צָפַנְתִּי
  choice: பொக்கிஷமாகப் பேணியிருக்கிறேன்
  rationale: வினைச்சொல் அடிப்படையில் மறைத்து அல்லது சேமித்து வைப்பதைக் குறித்தாலும், ஞான இலக்கியச் சூழலில் மதிப்புடன் உள்ளத்தில் காத்தலை உணர்த்துகிறது; இத்தமிழாக்கம் பாதுகாப்பையும் உயர்ந்த மதிப்பையும் தெரிவிக்கிறது.
- source_word: אִמְרֵי
  choice: சொற்கள்
  rationale: இது பன்மை இணைப்புநிலை வடிவம்; ‘சொற்கள்’ என்பது நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: פִיו
  choice: அவருடைய வாய்
  rationale: நேரடி உருவகத்தைத் தக்கவைத்து, ‘அவருடைய உதடுகள்’ என்பதுடனான கவிதை இணைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவருடைய உதடுகள்’, ‘அவருடைய வாய்’ என்பவற்றிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதிகளின் குறிப்பு
  choice: அவை கடவுளைக் குறிக்கின்றன.
  alternative: பொதுவான பொருளில் குறிப்பிடப்படாத ஒரு பேச்சாளரைக் குறிக்கலாம்.
  rationale: யோபு 23-ன் சூழலில் யோபு கடவுளுக்கு முன்பாகத் தன் உண்மைத்தன்மையையும் கடவுளுடைய சொற்களுக்கான கீழ்ப்படிதலையும் விவரிக்கிறார். ஆகவே விரிவாக்கம் எதையும் சேர்க்காமல் விகுதிகளை ‘அவருடைய’ என்று மொழிபெயர்த்துள்ளோம்.
- issue: מֵחֻקִּי என்பதன் பொருள்
  choice: ஒப்பீட்டுப் பொருளில் ‘எனக்கு ஒதுக்கப்பட்ட பங்கைவிட’
  alternative: ‘என் நியமத்திலிருந்து/கட்டளையிலிருந்து’ அல்லது பாரம்பரிய விளக்கத்தின்படி ‘எனக்குத் தேவையான உணவைவிட’
  rationale: மெய்யெழுத்து உரையும் முதல் நபர் ஒருமை விகுதியும் சேர்ந்த வடிவம் கடினமானது. தேர்ந்தெடுத்த வாசிப்பு பெற்ற வடிவத்துக்கு நெருக்கமாக இருந்து, தனக்கு ஒதுக்கப்பட்டதைவிடக் கடவுளுடைய சொற்களை யோபு உயர்வாக மதித்தார் என்ற சூழலுக்கு ஏற்ற பொருளை அளிக்கிறது. பரவலாக அறியப்பட்ட ‘தேவையான உணவு’ என்ற விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கவிதை நடையைப் பயன்படுத்தியுள்ளோம். ‘உதடுகள்/வாய்’ என்ற இணை உருவகமும், ‘கட்டளை/சொற்கள்’ என்ற கவிதை ஒத்திசைவும் காக்கப்பட்டுள்ளன. கடினமான எபிரேய வாசகத்தின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் மறைக்கப்படாமல் வெளிப்படுத்தப்பட்டுள்ளது.
