id: JOB.23.14
reference: Job 23:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: ta
  text: ஏனெனில், எனக்கென்று குறிக்கப்பட்டிருப்பதை அவர் நிறைவேற்றுவார்[a]; இதுபோன்றவை பல அவரிடத்தில் உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நிர்ணயத்தை,” “என் சட்டத்தை,” அல்லது “எனக்கு ஒதுக்கப்பட்ட பங்கை.” எபிரெயச் சொல் யோபுக்காக விதிக்கப்பட்ட அல்லது நிலைநிறுத்தப்பட்ட ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַשְׁלִים
  choice: நிறைவேற்றுவார்
  rationale: שׁלם என்பதன் ஹிஃபில் வடிவம் ஒன்றை முழுமையாக நிறைவு செய்வதையோ நிறைவேற்றுவதையோ குறிக்கிறது; இச்சூழலில் தேவன் தாம் குறித்ததைச் செய்து முடிப்பார் என்ற பொருளைத் தருகிறது.
- source_word: חֻקִּי
  choice: எனக்கென்று குறிக்கப்பட்டிருப்பதை
  rationale: חֹק என்பது சட்டம், கட்டளை, நிர்ணயம் அல்லது ஒதுக்கப்பட்ட பங்கு எனப் பொருள்படலாம். இங்கு யோபுக்காக நிர்ணயிக்கப்பட்டிருப்பதைச் சுட்டுவதால், சட்டரீதியான பொருளை மட்டும் திணிக்காமல் சூழலுக்கேற்ற பரந்த பொருளைத் தருகிறது.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: இதுபோன்றவை இன்னும் பல
  rationale: அதே வகையைச் சேர்ந்த பல காரியங்கள் உள்ளன என்ற எபிரெய வெளிப்பாட்டின் சுட்டுப்பொருளையும் எண்ணிக்கையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עִמּוֹ
  choice: அவரிடத்தில் உள்ளன
  rationale: நேரடியாக ‘அவருடன்’ என மொழிபெயர்ப்பதைவிட, தமிழில் உடைமை, வசம் அல்லது ஆலோசனையில் இருப்பது ஆகிய பரந்த சாத்தியங்களை இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: חֻקִּי என்பதை சட்டரீதியான ‘என் கட்டளை/சட்டம்’ என்று மொழிபெயர்ப்பதா, அல்லது யோபுக்காகத் தெய்வீகமாக நிர்ணயிக்கப்பட்டது என்று மொழிபெயர்ப்பதா
  choice: எனக்கென்று குறிக்கப்பட்டிருப்பதை
  alternative: என் நிர்ணயத்தை; என் சட்டத்தை; எனக்கு ஒதுக்கப்பட்ட பங்கை
  rationale: உடனடிச் சூழல் யோபின் சொந்தச் சட்டத்தைப் பற்றியதல்ல; தேவன் யோபுக்காக நிர்ணயித்த பாதை அல்லது பங்கைப் பற்றியது. தேர்ந்தெடுத்த மொழியாக்கம் தேவனுடைய ஆளுகையை வெளிப்படுத்தினாலும், குறிப்பாக என்ன நிர்ணயிக்கப்பட்டது என்பதைத் தீர்மானித்து விடாமல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குறிக்கப்பட்டிருப்பதை’ என்பது மூலச்சொல்லின் சட்டம், நிர்ணயம், ஒதுக்கப்பட்ட பங்கு ஆகிய சாத்தியங்களை மிகையாகத் தீர்மானிக்காமல் வாசகருக்குப் புரியும் வகையில் வழங்குகிறது; ‘அவரிடத்தில் உள்ளன’ என்பது עִמּוֹ என்பதன் திட்டம், அதிகாரம், வசம் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது.
