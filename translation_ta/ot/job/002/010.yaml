base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: ta
  text: அதற்கு அவன், “நீ மூடப் பெண்களில் ஒருத்தி பேசுவதுபோல் பேசுகிறாய். நாம் கடவுளிடமிருந்து நன்மையை ஏற்றுக்கொண்டு, தீமையை[a] ஏற்றுக்கொள்ளாமல் இருப்போமா?” என்றான். இவை அனைத்திலும் யோபு தன் உதடுகளால் பாவம் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துன்பத்தை,” “கேட்டை.” இங்குள்ள எபிரெயச் சொல் நன்மைக்கு எதிரான பாதகமான அல்லது துன்பமான சூழ்நிலைகளைக் குறிக்கிறது; மரபாக இது “தீமை” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: நீ மூடப் பெண்களில் ஒருத்தி பேசுவதுபோல் பேசுகிறாய்
  rationale: נְבָלוֹת என்பது வெறும் அறிவுக் குறைவையல்ல, ஒழுக்க மற்றும் இறைநெறி சார்ந்த மூடத்தனத்தையும் குறிக்கலாம். ‘மூடப் பெண்கள்’ என்பது அந்தக் கண்டன வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: நன்மையை நாம் கடவுளிடமிருந்து ஏற்றுக்கொள்வோம்
  rationale: הַטּוֹב என்பதைப் பொதுவாக நன்மையான காரியங்கள் அல்லது நல்வாழ்வு எனத் திறந்த நிலையில் ‘நன்மை’ தக்கவைக்கிறது. அடுத்த எதிர்மறைக் கேள்வியுடன் இணைந்து முழு வாக்கியமும் வினாவாகச் செயல்படுகிறது.
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: தீமையை ஏற்றுக்கொள்ள மாட்டோமா?
  rationale: רָע என்பது சூழலின்படி தீமை, கேடு, துன்பம் அல்லது பாதகமான நிலை ஆகியவற்றைக் குறிக்கக்கூடும். ‘நன்மை—தீமை’ என்ற எபிரெய எதிர்மறை இணையை இது காக்கிறது; இங்கு ஒழுக்கத் தீமையைவிடத் துன்பமான சூழ்நிலையே கருத்து என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: בְּכָל זֹאת
  choice: இவை அனைத்திலும்
  rationale: நடந்த அனைத்தையும் சுட்டும் கதைசொல்லியின் மதிப்பீட்டு முடிவுரையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: யோபு தன் உதடுகளால் பாவம் செய்யவில்லை
  rationale: ‘உதடுகளால்’ என்ற உடலுறுப்பு சார்ந்த எபிரெய வெளிப்பாட்டைத் தக்கவைத்து, மதிப்பீடு குறிப்பாக யோபின் பேச்சைப் பற்றியது என்ற நுட்பத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளிடமிருந்து பெறப்படும் הָרָע என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தீமை’ என்று வைத்து, இச்சூழலில் அது துன்பம் அல்லது கேடான சூழ்நிலையைக் குறிக்கிறது எனக் காலடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: ‘துன்பம்’ அல்லது ‘கேடு’
  rationale: எபிரெயச் சொல் ஒழுக்கத் தீமையையும் அனுபவிக்கப்படும் கேடு அல்லது துன்பத்தையும் குறிக்க வல்லது. இங்கு ‘நன்மை’க்கு எதிராக யோபு அனுபவிக்கும் பாதகமான நிலையே முன்னிலையில் உள்ளது. இருப்பினும், மூலத்தின் பரந்த சொற்பொருளையும் இறையியல் பதற்றத்தையும் முதன்மை உரை முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உரையாடல் இயல்பாகவும், கதைசொல்லியின் இறுதி மதிப்பீடு மூலத்தின் சுருக்கத்துடனும் வைக்கப்பட்டுள்ளது.
