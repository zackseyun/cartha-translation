source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: ta
  text: அப்போது எதிராளி[a] யெகோவாவுக்குப் பதிலளித்து, “தோலுக்குத் தோல்![b] ஒருவனிடம் இருப்பதெல்லாம் தன் உயிருக்கு ஈடாகக் கொடுப்பான்” என்றான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சாத்தான்”; எபிரெயத்தில் இது குறிப்புச் சுட்டுடன் வரும் “அந்த எதிராளி” என்னும் பட்டம் போன்ற வடிவில் உள்ளது. “குற்றஞ்சாட்டுகிறவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “தோலுக்குத் தோல்” என்பது பொருள் முழுமையாக உறுதிசெய்ய முடியாத, சுருக்கமான பழமொழி. ஒருவர் தன் உயிரைக் காப்பாற்ற வேறொன்றை விட்டுக்கொடுப்பார் என்பது இதன் சாத்தியமான கருத்து.
    reason: cultural_note
  - marker: c
    text: “உயிர்” என்பதற்கு “தன் சுயம்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் ஒருவர் தம் உயிரைக் காக்கத் தமக்குள்ளவற்றைத் தருவார் என்பதே பொருத்தமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: எதிராளி
  rationale: எபிரெயச் சொல்லுக்கு முன்னுள்ள குறிப்புச் சுட்டு, இதைத் தனிப்பட்ட பெயராக அல்லாமல் ஒரு பங்கு அல்லது பட்டமாகக் காட்டுகிறது. ‘எதிராளி’ என்பது அந்தப் பங்குப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட வடிவில் இறை திருப்பெயரை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: עוֹר בְּעַד עוֹר
  choice: தோலுக்குத் தோல்
  rationale: மூலத்தின் சுருக்கமான, பழமொழி போன்ற வடிவத்தையும் அதன் திட்டமிட்ட தெளிவின்மையையும் விளக்கவுரையால் நிரப்பாமல் தக்கவைக்கிறது.
- source_word: בְּעַד
  choice: -க்காக / -க்கு
  rationale: முதல் இடத்தில் பரிமாற்றத்தைச் சுருக்கமாகக் காட்ட ‘தோலுக்குத் தோல்’ என்றும், இரண்டாவது இடத்தில் உயிரைப் பாதுகாக்கும் நோக்கத்தை இயல்பாக வெளிப்படுத்த ‘உயிரைக் காப்பதற்காக’ என்றும் சூழலுக்கேற்ப மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: ஒருமை ஆண்பால் வடிவத்தையும் பொதுவான மனிதனைச் சுட்டும் பழமொழித் தன்மையையும் தக்கவைக்கிறது.
- source_word: נַפְשׁוֹ
  choice: தன் உயிர்
  rationale: இங்கு நֶפֶשׁ என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதைக் காட்டிலும் ஒருவர் காத்துக்கொள்ள விரும்பும் உயிரையே குறிக்கிறது.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: தன்னிடமுள்ள எல்லாவற்றையும்
  rationale: உடைமைப் பொருளைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: יִתֵּן
  choice: கொடுத்துவிடுவான்
  rationale: பொதுவாக ஒருவர் என்ன செய்வார் என்பதைக் குறிக்கும் எபிரெய நிறைவுறா வினையின் பழமொழிசார் வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோபு நூலின் முன்னுரையில் הַשָּׂטָן என்பதன் மொழிபெயர்ப்பு
  choice: எதிராளி
  alternative: சாத்தான் / குற்றஞ்சாட்டுகிறவன்
  rationale: குறிப்புச் சுட்டுடன் வரும் எபிரெய வடிவம் நீதிமன்றச் சூழலிலான பங்கு அல்லது பட்டத்தைக் காட்டுகிறது. பிற்கால இறையியல் அடையாளத்தை இவ்வசனத்துக்குள் முன்கூட்டியே புகுத்தாமல், மூலத்தின் பதற்றத்தையும் நுட்பத்தையும் இது காக்கிறது.
- issue: נֶפֶשׁ என்பதன் சூழல்சார் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா / தன்னுயிர் / தன் சுயம்
  rationale: ஒருவர் தமக்குள்ள அனைத்தையும் விட்டுக்கொடுத்து தமது வாழ்வைப் பாதுகாப்பதே இங்குள்ள கருத்து; உடலற்ற ஆத்துமா குறித்த தனிப்பட்ட கோட்பாட்டை வசனம் வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு விளங்கும் வகையிலும் இலக்கியக் கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெயப் பழமொழியின் சுருக்கமும் தெளிவின்மையும் பிரதான உரையில் பாதுகாக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
