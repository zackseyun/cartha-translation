  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: ta
  text: ஆனால், தயவுசெய்து உங்கள் கையை நீட்டி, அவனுடைய எலும்பையும் சதையையும் தொடுங்கள்; அவன் உங்கள் முகத்திற்கு முன்பாகவே உங்களை நிச்சயமாகச் சபிப்பான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லின் நேரடிப் பொருள் “உங்களை ஆசீர்வதிப்பான்.” இங்கே அது கடுமையான சொல்லைத் தவிர்க்கும் மறைமுகச் சொல்லாகப் பயன்பட்டு, “உங்களைச் சபிப்பான்” என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: ஆனால்
  rationale: சாத்தானின் எதிர்வாதத்தை அறிமுகப்படுத்தும் முரண்பாட்டுச் சொல்லாக இயல்பான நவீனத் தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁלַח נָא יָדְךָ
  choice: தயவுசெய்து உங்கள் கையை நீட்டி
  rationale: ‘கையை அனுப்புதல்’ என்ற எபிரெயச் சொற்றொடர் ஒருவருக்கு எதிராகச் செயல்பட கையை நீட்டுவதைக் குறிக்கிறது; נָא என்பதன் வேண்டுகோள் நயம் ‘தயவுசெய்து’ என்பதால் பாதுகாக்கப்படுகிறது.
- source_word: וְגַע
  choice: தொடுங்கள்
  rationale: נגע என்பதன் அடிப்படைப் பொருள் ‘தொடு’; இச்சூழலில் தீங்கு விளைவிக்கும் தொடுதலைக் குறிப்பாக உணர்த்தினாலும், மூலத்தின் உருவகத்தைத் தக்கவைக்க நேரடிப் பொருள் பயன்படுத்தப்பட்டது.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: அவனுடைய எலும்பையும் சதையையும்
  rationale: ஒருமை வடிவில் கூட்டுப்பொருளாக வரும் ‘எலும்பு’ மற்றும் ‘சதை’ ஆகிய உடல் சார்ந்த மூலப்படிமம், ‘உடல்’ என்று பொதுமைப்படுத்தாமல் தக்கவைக்கப்பட்டது.
- source_word: אִם לֹא
  choice: நிச்சயமாக
  rationale: இங்கு இது நிபந்தனையைக் காட்டாமல், ஆணை போன்ற வலியுறுத்தலுடன் சாத்தானின் உறுதியான கூற்றை வெளிப்படுத்துகிறது.
- source_word: אֶל פָּנֶיךָ
  choice: உங்கள் முகத்துக்கு நேராக
  rationale: கடவுளின் முன்னிலையிலேயே வெளிப்படையாக எதிர்ப்பதை உணர்த்தும் எபிரெய வழக்கை இயல்பான தமிழ்ச் சொற்றொடராக அளிக்கிறது.
- source_word: יְבָרֲכֶךָּ
  choice: உங்களைச் சபிப்பான்
  rationale: ברך என்பதன் வழக்கமான பொருள் ‘ஆசீர்வதி’ என்றாலும், யோபு 1:11; 2:5 சூழலில் அது ‘சபி’ என்பதற்கான மரியாதை சார்ந்த மங்கல வழக்காகப் பயன்படுகிறது; நேரடிச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோபுவின் சோதனைக் காட்சிகளில் ברך என்பதன் மங்கல வழக்குப் பயன்பாடு
  choice: முதன்மை உரையில் ‘சபிப்பான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆசீர்வதிப்பான்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்து, சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குதல்
  rationale: துன்பம் வந்தால் யோபு கடவுளை வெளிப்படையாக மறுதலிப்பான் என்பதே சாத்தானின் சவால். முதன்மை உரையில் ‘ஆசீர்வதிப்பான்’ என்பது நவீன வாசகரைத் தவறாக வழிநடத்தும்; எனவே சூழலுக்குரிய பொருள் உரையிலும், மூலத்தின் நேரடிப் பொருள் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை மரியாதைப் பன்மையால் சுட்டும் இயல்பான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எலும்பும் சதையும்’ என்ற மூலத்தின் உறுதியான உடல் சார்ந்த படிமமும், ‘முகத்துக்கு நேராக’ என்ற வெளிப்படையான எதிர்ப்பின் நயமும் தக்கவைக்கப்பட்டுள்ளன.
