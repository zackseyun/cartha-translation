base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: ta
  text: 'யோபுக்கு ஏற்பட்ட இந்த எல்லாத் துன்பங்களையும் அவருடைய மூன்று நண்பர்கள் கேள்விப்பட்டபோது, அவர்கள் ஒவ்வொருவரும் தத்தம் இடத்திலிருந்து வந்தார்கள்: தேமானியனான எலிப்பாஸ், சூகியனான பில்தாத், நாகமாத்தியனான சோப்பார். அவருக்கு இரங்கல் தெரிவிக்கவும்[a] ஆறுதல் கூறவும் வருவதற்கு அவர்கள் ஒருவரோடொருவர் ஏற்பாடு செய்துகொண்டார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு அனுதாபம் காட்டவும்” அல்லது “அவருடன் சேர்ந்து புலம்பவும்.” எபிரெய வினை துன்புறுகிறவருக்கு இரங்கல் அல்லது அனுதாபம் தெரிவிப்பதையும், துயரத்தை வெளிப்படுத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் ஒன்றாகச் சந்திக்க ஏற்பாடு செய்தார்கள்” அல்லது “ஒன்றாக உடன்பட்டார்கள்.” எபிரெய வினை முன்கூட்டியே திட்டமிட்டு ஒருங்கிணைத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: கதைத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய வாவ் தொடர்வினைக்கு தேவையற்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: யோபுடைய நண்பர்கள் மூவர்
  rationale: கட்டுப்பெயர்த் தொடரை இயல்பான நவீன தமிழில் தருகிறது; רֵעַ என்பதன் நேர்ப்பொருள் ‘நண்பர்’.
- source_word: כָּל הָרָעָה הַזֹּאת הַבָּאָה עָלָיו
  choice: யோபுக்கு நேரிட்ட இந்தத் துன்பங்கள் அனைத்தும்
  rationale: רָעָה இங்கு யோபு செய்த அறக்கேட்டை அல்ல, அவரை வந்தடைந்த பேரிடர் மற்றும் வேதனையைக் குறிக்கிறது. ஒருமைக் கூட்டுப்பொருளை இயல்பான தமிழில் பன்மையாக வழங்குகிறது.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: ஒவ்வொருவரும் தத்தம் இடத்திலிருந்து புறப்பட்டு வந்தார்கள்
  rationale: אִישׁ என்பதன் பகிர்வுப் பொருளையும் ஒவ்வொருவரின் தனித்தனி இருப்பிடத்தையும் தெளிவாக்குகிறது; ‘புறப்பட்டு’ என்பது தமிழில் பயணச் சூழலை இயல்பாக்குகிறது.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: தேமானியன் / சூகியன் / நாமாத்தியன்
  rationale: இன அல்லது ஊர்சார் அடையாளப் பெயர்களை தமிழில் ஒலிபெயர்த்து, பெயர்களோடு இயல்பாக இணைக்கிறது.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: அவர்கள் ஒன்றுகூடத் திட்டமிட்டார்கள்
  rationale: நிபால் வினை குறிக்கும் திட்டமிட்ட ஒருங்கிணைப்பு அல்லது சந்திப்புக்கான ஏற்பாட்டை வெளிப்படுத்துகிறது; வெறுமனே தற்செயலாகச் சந்தித்தார்கள் என்று கூறவில்லை.
- source_word: לָבוֹא
  choice: வருவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் அடிப்படை இயக்கப்பொருளைத் தக்கவைக்கிறது.
- source_word: לָנוּד לוֹ
  choice: அவருடன் சேர்ந்து துயரப்பட
  rationale: נוּד இச்சூழலில் இரங்கல் அல்லது அனுதாபத்தை, பெரும்பாலும் துயரின் வெளிப்பாட்டோடு, குறிக்கிறது; அடுத்துள்ள ஆறுதல் வினையிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: וּלְנַחֲמוֹ
  choice: அவருக்கு ஆறுதல் கூற
  rationale: பியேல் வடிவிலுள்ள נחם என்பதன் வழக்கமான ‘தேற்றுதல்/ஆறுதல் கூறுதல்’ பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: רָעָה என்பதன் அறநெறி அல்லது பேரிடர் சார்ந்த பொருள்
  choice: துன்பங்கள்
  alternative: தீமை
  rationale: சூழலில் இது யோபு செய்த அறக்கேட்டைக் குறிக்காமல் அவருக்கு நேரிட்ட பேரிடரையும் வேதனையையும் குறிக்கிறது.
- issue: לָנוּד לוֹ என்பதன் இரங்கல் நுணுக்கம்
  choice: அவருடன் சேர்ந்து துயரப்பட
  alternative: அவருக்கு அனுதாபம் காட்ட
  rationale: மூல வினையில் அனுதாபத்துடன் துயரின் வெளிப்பாடும் இருக்கக்கூடியதால் அதைப் பாதுகாக்கிறது; அதேவேளை மரணத்திற்கான புலம்பல் என்று அளவுக்கு மீறி வரையறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மனிதர் பெயர்களும் ஊர்சார் அடையாளங்களும் வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களுக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன. ‘துன்பங்கள்’ என்பது வாசிப்புக்கு இயல்பாக இருந்தாலும், மூலத்தின் கூட்டொருமை கருத்தை ‘அனைத்தும்’ தக்கவைக்கிறது. முக்கியமான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
