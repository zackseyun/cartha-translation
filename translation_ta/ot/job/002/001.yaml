- from: மறுபடியும் ஒரு நாள், கடவுளின் மகன்கள்[a] யாவே முன்னிலையில் தங்களை நிறுத்திக்கொள்ள வந்தார்கள்; எதிராளியும்[b] அவர்களிடையே யாவே முன்னிலையில் தன்னை நிறுத்திக்கொள்ள வந்தான்.
  to: மறுபடியும் ஒரு நாள், கடவுளின் மகன்கள்[a] யாவே முன்னிலையில் ஆஜராக வந்தார்கள்; எதிராளியும்[b] அவர்களிடையே யாவே முன்னிலையில் ஆஜராக வந்தான்.
  rationale: The revision changes only the repeated Tamil rendering of the formal-attendance verb phrase. “ஆஜராக வந்தார்கள்/வந்தான்” is natural in modern standard Tamil, communicates appearing before a superior, and retains the Hebrew’s deliberate parallelism. No theological interpretation or disputed identification has been added.
