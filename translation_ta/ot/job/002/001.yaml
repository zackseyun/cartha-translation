base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: ta
  text: மறுபடியும் ஒரு நாள், கடவுளின் மகன்கள்[a] யாவே முன்னிலையில் ஆஜராக வந்தார்கள்; எதிராளியும்[b] அவர்களிடையே யாவே முன்னிலையில் ஆஜராக வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘கடவுளின் மகன்கள்.’ இது வானுலக உயிர்களையோ தெய்வீக மன்றத்தின் உறுப்பினர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சாத்தான்’ அல்லது ‘குற்றஞ்சாட்டுபவன்.’ எபிரெயத்தில் வரையறைச் சுட்டுடன் ‘அந்த எதிராளி’ என்று உள்ளது; இங்கு இது தனிப்பெயரைவிட ஒரு பட்டம் அல்லது பங்காக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: மறுபடியும் ஒரு நாள்
  rationale: 1:6-இல் வந்த நிகழ்வமைப்பு இங்கு மீண்டும் நிகழ்வதை ‘மறுபடியும்’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஒரு நாள்’ எபிரெயச் சொல்லாட்சியை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: கடவுளின் மகன்கள்
  rationale: எபிரெய மொழியின் நேரடியான உருவகத்தைப் பாதுகாத்து, அதை ‘வானுலக உயிர்கள்’ என விளக்கி முடிவுசெய்யாமல் உள்ளார்ந்த தெளிவின்மையையும் இறையியல் பதற்றத்தையும் நிலைநிறுத்துகிறது.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: யாவே முன்னிலையில் தங்களை/தன்னை நிறுத்திக்கொள்ள
  rationale: ஒரு மேலானவரின் முன்னிலையில் வந்து ஆஜராகும் அரசவைக் கருத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; இரு இடங்களிலும் ஒரே சொல்லாட்சியைப் பயன்படுத்தி இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַשָּׂטָן
  choice: எதிராளி
  rationale: எபிரெயச் சொல்லுக்கு வரையறைச் சுட்டு இருப்பதால், இங்கு நிலையான தனிப்பெயரைவிட ஒரு பங்கு அல்லது பட்டத்தைக் குறிப்பது இயல்பு; ‘எதிராளி’ அதன் அடிப்படைப் பொருளையும் பட்டத்தன்மையையும் காக்கிறது.
- source_word: בְּתוֹכָם
  choice: அவர்களிடையே
  rationale: கூடியிருந்த அந்தக் குழுவுக்குள் அவனும் வந்தான் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: הַשָּׂטָן என்பது தனிப்பெயரா அல்லது பட்டமா
  choice: எதிராளி
  alternative: சாத்தான்; குற்றஞ்சாட்டுபவன்
  rationale: வரையறைச் சுட்டுடன் வரும் எபிரெய வடிவம் இச்சூழலில் ஒரு பங்கு அல்லது பட்டத்தைக் குறிக்க வாய்ப்புள்ளது. ஆகவே பிற்காலத்தில் நிலைபெற்ற தனிப்பெயர் என்ற புரிதலை உரைக்குள் முன்கூட்டியே கொண்டுவராமல் ‘எதிராளி’ என வழங்கப்படுகிறது.
- issue: בְּנֵי הָאֱלֹהִים என்பவர்களின் அடையாளம்
  choice: கடவுளின் மகன்கள்
  alternative: வானுலக உயிர்கள்; தெய்வீக மன்றத்தினர்
  rationale: மூலத்தின் உருவகச் சொல்லாட்சியை அப்படியே வைத்திருப்பதால், இவர்களின் துல்லியமான அடையாளத்தை மொழிபெயர்ப்பே தீர்மானிக்காமல் genuine ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் எளிமையும் காக்கப்பட்டுள்ளன. ‘தங்களை நிறுத்திக்கொள்ள’ என்பது அரசவை முன்னிலையில் ஆஜராகும் நுண்பொருளை அணுகக்கூடிய தமிழில் தருகிறது. அடிக்குறிக் குறிகள் உரையில் அவை விளக்கும் சொற்களுக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
