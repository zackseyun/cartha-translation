  text: וַ/יֵּשְׁב֤וּ אִתּ/וֹ֙ לָ/אָ֔רֶץ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת לֵיל֑וֹת וְ/אֵין דֹּבֵ֤ר אֵלָי/ו֙ דָּבָ֔ר כִּ֣י רָא֔וּ כִּֽי גָדַ֥ל הַ/כְּאֵ֖ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: ta
  text: அவர்கள் அவனோடு தரையில் ஏழு நாட்களும் ஏழு இரவுகளும் உட்கார்ந்திருந்தார்கள். அவனுடைய வேதனை[a] மிகவும் கடுமையாக இருந்ததை அவர்கள் கண்டதால், ஒருவரும் அவனிடம் ஒரு வார்த்தையும் பேசவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துன்பம்’ அல்லது ‘துயரம்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் உடல் வலியையும் உணர்ச்சிசார் துன்பத்தையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: உட்கார்ந்திருந்தார்கள்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருளான ‘உட்கார்’ என்பதையும், ஏழு பகலும் இரவும் அந்த நிலையில் நீடித்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִתּוֹ
  choice: அவனோடு
  rationale: யோபின் நண்பர்கள் அவனுடன் உடனிருந்து துக்கத்தில் பங்குகொண்டதைக் குறிக்கும் நேரடியான உடனிகழ்ச்சிப் பொருள்.
- source_word: לָאָרֶץ
  choice: தரையில்
  rationale: துக்கம் அனுசரிக்கும் உட்காரும் நிலையை இச்சூழல் சுட்டுவதால், ארץ என்பதற்கு இங்கு இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: ஏழு பகலும் ஏழு இரவும்
  rationale: முழுக் கால அளவைக் குறிக்கும் எபிரெய வெளிப்பாட்டைத் தெளிவாகவும் தமிழின் இணைப்புமுறைக்கு ஏற்றவாறும் காக்கிறது.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: ஒருவரும் அவனிடம் ஒரு வார்த்தையும் பேசவில்லை
  rationale: முற்றிலும் மௌனமாக இருந்ததை வலியுறுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כִּי רָאוּ
  choice: அவர்கள் கண்டதால்
  rationale: அவர்கள் பேசாமல் இருந்ததற்கான காரணத்தை כִּי இங்கு அறிமுகப்படுத்துகிறது.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: அவனுடைய வேதனை மிகவும் கடுமையாக இருந்ததை
  rationale: כאב குறிக்கும் உடல் வலியையும் உள்ளத்தின் வேதனையையும் ‘வேதனை’ உள்ளடக்க முடியும்; גָדַל மற்றும் מְאֹד தரும் தீவிரத்தை ‘மிகவும் கடுமையாக’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כאב என்பதன் உடல் மற்றும் உணர்ச்சி சார்ந்த பரப்பு
  choice: வேதனை
  alternative: உடல் வலி / துன்பம் / துயரம்
  rationale: உடனடிச் சூழலில் யோபின் உடல் நோய் முக்கியமானதாயினும், மூலச்சொல் உடல் வலிக்கு மட்டும் கட்டுப்படாது. ‘வேதனை’ இரு பரிமாணங்களையும் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உட்கார்ந்திருந்தார்கள்’ நீடித்த செயலைக் காட்டுகிறது; ‘ஒரு வார்த்தையும் பேசவில்லை’ மூலத்தின் வலியுறுத்தப்பட்ட முழுமையான மௌனத்தைப் பாதுகாக்கிறது.
