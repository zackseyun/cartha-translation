base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: ta
  text: அப்போது அவனுடைய மனைவி அவனிடம், “உமது நேர்மையை இன்னும் உறுதியாகப் பற்றிக்கொண்டிருக்கிறீரா? கடவுளை வாழ்த்துங்கள்[a]; இறந்துவிடுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில், “கடவுளை வாழ்த்துங்கள்; இறந்துவிடுங்கள்” என்று உள்ளது. இங்கு “வாழ்த்துங்கள்” என்பது கடவுளைப் பற்றிப் பேசும்போது மரியாதை காரணமாக “சபியுங்கள்” என்பதற்குப் பதிலாகப் பயன்படுத்தப்பட்ட மறைமுகச் சொல்லாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: אִשְׁתּוֹ
  choice: அவனுடைய மனைவி
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: עֹדְךָ
  choice: இன்னும்
  rationale: யோபுவின் நிலை தொடர்ந்து நீடிப்பதைக் குறிக்கும் வினையடையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַחֲזִיק בְּתֻמָּתֶךָ
  choice: உமது உத்தமத்தை ... விடாமல் பற்றிக்கொண்டிருக்கிறீரா?
  rationale: חזק என்பதிலுள்ள உறுதியான தொடர்ச்சியையும் תֻּמָּה என்பதிலுள்ள முழுமை, குற்றமற்ற தன்மை, ஒழுக்கநிலை ஆகிய பொருள் வளத்தையும் காக்கிறது. ‘விடாமல் பற்றிக்கொள்’ என்பது தமிழில் இயல்பானதும் கண்டிக்கும் கேள்வியின் தொனிக்கு ஏற்றதும் ஆகும்.
- source_word: בָּרֵךְ
  choice: வாழ்த்துங்கள்
  rationale: எபிரெய வினையின் வெளிப்படையான சொற்பொருள் ‘வாழ்த்து’ என்பதே. சூழலில் எதிர்ப்பொருளான ‘சபி’ என்பதற்கான மரியாதைநய மறைச்சொல்லாக இருக்கலாம் என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது; மூலத்திலுள்ள பதற்றம் முதன்மை உரையில் தீர்க்கப்படவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுளை
  rationale: இது יהוה என்ற உடன்படிக்கைப் பெயர் அல்ல; பொதுவான இறைப்பட்டம் என்பதால் நவீனத் தமிழில் ‘கடவுள்’ பொருத்தமானது.
- source_word: וָמֻת
  choice: இறந்துபோங்கள்
  rationale: இரண்டாவது கட்டளை வினையின் கடுமையையும் சுருக்கத்தையும் காக்கிறது; முன் கட்டளையுடன் உள்ள இணைப்பை அரைப்புள்ளி தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கடவுளைக் குறித்துப் பேசும்போது ‘வாழ்த்து’ என்ற சொல்லின் மறைமுக எதிர்ப்பொருள் பயன்பாடு
  choice: முதன்மை உரையில் ‘கடவுளை வாழ்த்துங்கள்’ என்று எபிரெயச் சொல்லின் வெளிப்படையான பொருளைத் தக்கவைத்து, ‘சபியுங்கள்’ என்ற சாத்தியமான சூழற்பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘கடவுளைச் சபித்துவிட்டு இறந்துபோங்கள்’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: மூல உரை ברך (‘வாழ்த்து’) என்ற வினையையே பயன்படுத்துகிறது. இவ்விடத்தில் அது கடவுளைச் சபிப்பதைக் குறிக்கும் மரியாதைநய மறைச்சொல் என்று பரவலாகப் புரிந்துகொள்ளப்பட்டாலும், வெளிப்படையான சொல்வடிவத்துக்கும் சூழற்பொருளுக்கும் இடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் வாசகருக்குத் தெரிவிப்பது மூலமொழி முதன்மைக்கும் மொழிபெயர்ப்பு வெளிப்படைத்தன்மைக்கும் ஏற்றது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மனைவி யோபுவை ஒருமை மரியாதை வடிவில் அழைப்பதாக ‘உமது’, ‘இருக்கிறீரா’, ‘வாழ்த்துங்கள்’, ‘இறந்துபோங்கள்’ பயன்படுத்தப்பட்டுள்ளன. ‘உத்தமம்’ என்பது வெறும் நேர்மையைவிட תֻּמָּה என்பதன் முழுமை/குற்றமின்மை சார்ந்த பரப்பைச் சிறப்பாகக் காக்கிறது.
