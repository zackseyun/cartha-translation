id: JOB.2.6
reference: Job 2:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: ta
  text: யெகோவா குற்றஞ்சாட்டுகிறவனிடம், “இதோ, அவன் உன் கையில் இருக்கிறான்; அவனுடைய உயிரை மட்டும் காப்பாற்று” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயரைக் குறிக்கும் எபிரெய மெய்யெழுத்துப் பெயரை, தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் வழங்குகிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுகிறவன்
  rationale: இங்கு வரும் அறுதியிட்ட பெயர்ச்சொல்லின் எதிர்ப்பவர்/குற்றஞ்சாட்டுபவர் என்ற பங்கைக் காட்டுகிறது; உடனடியாக அதைத் தனிப்பட்ட பெயராக மட்டும் மாற்றவில்லை.
- source_word: הִנּוֹ
  choice: இதோ
  rationale: பேச்சில் கவனத்தை ஈர்க்கும் மூலச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: בְיָדֶךָ
  choice: உன் கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் ஒப்படைத்தல் என்ற எபிரெய உருவகத்தை அப்படியே வைத்திருக்கிறது.
- source_word: נַפְשׁוֹ
  choice: அவன் உயிரை
  rationale: இந்தச் சூழலில் נֶפֶשׁ என்பது அவனுடைய உயிர்/வாழ்வைக் குறிக்கிறது; ‘ஆத்துமா’ எனப் பிரித்து வாசிப்பதைத் தவிர்க்கிறது.
- source_word: שְׁמֹר
  choice: காப்பாற்று
  rationale: அவனுடைய உயிரைக் காத்து, கொல்லாமல் விட வேண்டும் என்ற கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: הַשָּׂטָן என்பதன் அடையாளம்
  choice: குற்றஞ்சாட்டுகிறவன்
  alternative: சாத்தான்
  rationale: அறுதியிட்ட உருபுடன் வரும் பங்கு-பெயரின் மொழியியல் தன்மையைப் பாதுகாக்கிறது; பின்னைய இறையியல் அடையாளத்தை வசனத்துக்குள் கட்டாயப்படுத்தவில்லை.
- issue: נַפְשׁוֹ என்பதன் பொருள்
  choice: அவன் உயிரை
  alternative: அவன் ஆத்துமாவை
  rationale: உடல் துன்புறுத்தலுக்கு அனுமதி அளித்தாலும் உயிரைக் கொல்லத் தடை விதிக்கும் உடனடிச் சூழலோடு ‘உயிர்’ பொருந்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, நேரடியான உரை. எபிரெய மொழியின் ‘உன் கையில்’ என்ற உருவகமும் ‘இதோ’ என்ற கவன ஈர்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
