  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: ta
  text: அப்பொழுது எதிர்ப்பாளர்[a] யாவேயின் முன்னிலையிலிருந்து புறப்பட்டு, யோபின் உள்ளங்கால் தொடங்கி தலையுச்சிவரை கொடிய புண்களால்[b] தாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அந்த எதிர்ப்பாளர்”; மரபாக “சாத்தான்” என்று மொழிபெயர்க்கப்படுகிறது. இங்கு குறிப்புச் சுட்டுடன் வரும் சொல் “எதிர்ப்பாளர்” என்ற பதவியாகவோ பங்காகவோ செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “கொடிய கொப்புளங்களால்” அல்லது “வேதனைமிக்க புண்களால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: எதிர்ப்பாளர்
  rationale: எபிரெயச் சொல்லுடன் குறிப்புச் சுட்டு இருப்பதால், இச்சூழலில் நிலையான தனிப்பெயரைவிட ஒரு பதவி அல்லது பங்கைக் குறிக்க வாய்ப்புள்ளது. ‘எதிர்ப்பாளர்’ அதன் பொருளையும் அந்தத் தெளிவின்மையையும் காக்கிறது.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: யாவேயின் முன்னிலையிலிருந்து
  rationale: פנים இக்கட்டமைப்பில் ஒருவரின் முன்னிலை அல்லது சந்நிதியைக் குறிக்கிறது; יהוה என்பது வெளிப்படுத்தப்பட்ட இறைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: נכה என்பதன் நேரடியான ‘அடி/தாக்கு’ என்ற வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘வாதித்தார்’ என நோயை மட்டும் குறிப்பதைத் தவிர்க்கிறது.
- source_word: בִּשְׁחִין רָע
  choice: கொடிய புண்களால்
  rationale: שְׁחִין அழற்சியுள்ள தோல் புண் அல்லது கொப்புளத்தைக் குறிக்கிறது; רָע இங்கு ஒழுக்கத் தீமையையல்ல, அதன் கொடுமை அல்லது கடுமையைக் குறிக்கிறது.
- source_word: מִכַּף רַגְלוֹ
  choice: உள்ளங்கால் தொடங்கி
  rationale: כף רגל என்பது பாதத்தின் அடிப்பகுதியான உள்ளங்காலைக் குறிக்கிறது; தமிழில் இயல்பான முழு உடல் எல்லைத் தொடரின் தொடக்கமாக அமைக்கப்பட்டுள்ளது.
- source_word: עַד קָדְקֳדוֹ
  choice: உச்சந்தலைவரை
  rationale: קָדְקֹד தலையின் உச்சிப்பகுதியைக் குறிக்கிறது; ‘உச்சந்தலை’ துல்லியமான, இயல்பான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: யோபு முன்னுரையில் הַשָּׂטָן என்பதன் மொழிபெயர்ப்பு
  choice: எதிர்ப்பாளர்
  alternative: சாத்தான்; அந்தச் சாத்தான்
  rationale: எபிரெயத்தில் குறிப்புச் சுட்டு இருப்பது இங்கு ஒரு பதவி அல்லது செயல்பாட்டைக் குறிக்கலாம். ‘எதிர்ப்பாளர்’ என்று மொழிபெயர்ப்பது பிற்காலத்தில் நிலைபெற்ற தனிப்பெயர் புரிதலை வசனத்துக்குள் முன்கூட்டியே புகுத்தாமல், மூலத்தின் இறையியல் பதற்றத்தைக் காக்கிறது.
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று வழங்குவது வெளிப்படுத்தப்பட்ட பெயரைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டுள்ளது. ‘அப்பொழுது’ கதைத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. ‘உள்ளங்கால் தொடங்கி உச்சந்தலைவரை’ என்ற நடை முழு உடலையும் தாக்கிய அளவைத் தெளிவாக வெளிப்படுத்துகிறது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
