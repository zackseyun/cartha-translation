  terminology: ‘யாவே,’ ‘குற்றஞ்சாட்டுபவன்,’ ‘ஊழியன்,’ ‘கடவுளுக்கு அஞ்சி,’ மற்றும் ‘தீமையைவிட்டு விலகுகிறவன்’ ஆகியவை பொருத்தமானவை. ‘குற்றஞ்சாட்டுபவன்’ ஒரு பங்குப் பெயர் என்பதைக் குறிக்கும் அடிக்குறிப்பும் நன்றாக உள்ளது. ‘உத்தமம்’ என்பதற்குப் பதில் ‘நேர்மை’ இங்கு நவீன வாசகருக்குத் தெளிவானது; முன்னருள்ள ‘நேர்மையானவன்’ உடனான தொடர்பும் மூலத்தில் תָּם/תֻמָּה உள்ள தொடர்பைத் தக்கவைக்கிறது.
