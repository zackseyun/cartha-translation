  revised_text: அப்போது யாவே குற்றஞ்சாட்டுபவனிடம்[a], “என் ஊழியனாகிய யோபின்மேல் உன் கவனத்தைச் செலுத்தினாயா?[b] பூமியில் அவனைப் போன்றவன் ஒருவனும் இல்லை. அவன் குற்றமற்றவனும் நேர்மையானவனும், கடவுளுக்கு அஞ்சி தீமையைவிட்டு விலகுகிறவனுமாக இருக்கிறான். காரணமின்றி அவனை அழித்துப்போடும்படி நீ என்னை அவனுக்கு எதிராகத் தூண்டியபோதிலும், அவன் இன்னும் தன் நேர்மையை உறுதியாகப் பற்றிக்கொண்டிருக்கிறான்[c][d]” என்றார்.
