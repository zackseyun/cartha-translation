  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: ta
  text: அப்போது யாவே குற்றஞ்சாட்டுபவனிடம்[a], “என் ஊழியனாகிய யோபின்மேல் உன் கவனத்தைச் செலுத்தினாயா?[b] பூமியில் அவனைப் போன்றவன் ஒருவனும் இல்லை. அவன் குற்றமற்றவனும் நேர்மையானவனும், கடவுளுக்கு அஞ்சி தீமையைவிட்டு விலகுகிறவனுமாக இருக்கிறான். காரணமின்றி அவனை அழித்துப்போடும்படி நீ என்னை அவனுக்கு எதிராகத் தூண்டியபோதிலும், அவன் இன்னும் தன் நேர்மையை உறுதியாகப் பற்றிக்கொண்டிருக்கிறான்[c][d]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் הַשָּׂטָן (ஹஸ்ஸாத்தான்), “குற்றஞ்சாட்டுபவன்”; மரபாக “சாத்தான்” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “என் ஊழியனாகிய யோபின்மேல் உன் மனதைச் செலுத்தினாயா?” எபிரெயத்தில் சொல்லுக்குச் சொல், “உன் இருதயத்தை என் ஊழியனாகிய யோபின்மேல் வைத்தாயா?” என்று உள்ளது.'
    reason: lexical_alternative
  - marker: c
    text: “அழித்துப்போட” என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் “விழுங்கிப்போட” என்று பொருள்படும்; “நாசமாக்க” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “காரணமின்றி” என்பதை “எதுவுமின்றி” அல்லது “பலனின்றி” என்றும் புரிந்துகொள்ளலாம். இதே எபிரெயச் சொல் யோபு 1:9-லும் வருகிறது; அங்கே யோபு கடவுளுக்கு அஞ்சுவது “எதுவுமின்றியா?” என்று குற்றஞ்சாட்டுபவன் கேட்கிறான்.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரைப் பட்டப்பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுபவன்
  rationale: குறிப்புச் சுட்டுடன் வரும் எபிரெயச் சொல் இங்கு தனிப்பெயரைவிட நீதிமன்ற/எதிர்ப்பு சார்ந்த பங்கைக் குறிக்கிறது.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: உன் கவனத்தைச் செலுத்தினாயா?
  rationale: சொல்லுக்குச் சொல் ‘உன் இருதயத்தை வைத்தாயா’ என்ற உருவகத்தின் சூழல்சார் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: இங்கு அடிமைநிலையை முன்னிறுத்தாமல், கடவுளுக்குச் சொந்தமானவராகவும் அவருக்குப் பணிபுரிபவராகவும் உள்ள உறவைக் குறிக்கிறது.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: பூமியில் அவனைப் போன்றவன் ஒருவனும் இல்லை
  rationale: வானுலகக் காட்சியின் விரிந்த சூழலில் אֶרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: குற்றமற்றவனும் நேர்மையானவனும்
  rationale: תָּם என்பது பாவமே இல்லாத பரிபூரணத்தை அவசியமாகக் குறிக்காமல் முழுமை/பழியற்ற நடத்தை குறிக்கிறது; יָשָׁר நேர்மையைக் குறிக்கிறது.
- source_word: יְרֵא אֱלֹהִים
  choice: கடவுளுக்கு அஞ்சி
  rationale: வெறும் பயம் அல்லாத பயபக்தியின் வினைச்சொல் வலிமையைப் பாதுகாக்கிறது.
- source_word: וְסָר מֵרָע
  choice: தீமையைவிட்டு விலகுகிறவன்
  rationale: தீமையிலிருந்து தொடர்ந்து விலகும் குணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: அவன் இன்னும் தன் உத்தமத்தை உறுதியாகப் பற்றிக்கொண்டிருக்கிறான்
  rationale: מַחֲזִיק என்பதன் வலிமையையும் תֻמָּה என்பதன் முழுமை/நேர்மை சார்ந்த பொருளையும் காக்கிறது.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: நீ என்னை அவனுக்கு எதிராகத் தூண்டியபோதிலும்
  rationale: தூண்டுதல் என்ற காரணவினைப் பொருளையும், சூழலில் உள்ள விட்டுக்கொடுப்பு உறவையும் வெளிப்படுத்துகிறது.
- source_word: לְבַלְּעוֹ
  choice: அவனை அழித்துப்போடும்படி
  rationale: சொல்லர்த்தமான ‘விழுங்குதல்’ இங்கு உருவகமாக அழிவு/நாசத்தைக் குறிக்கிறது; இயல்பான பொருள் முதன்மை உரையில், உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חִנָּם
  choice: காரணமின்றி
  rationale: எந்த நியாயமான காரணமும் இல்லாமல் என்பதைக் தெளிவாகக் கூறுகிறது; யோபு 1:9 உடனான சொல்விளையாட்டு அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: யோபின் துன்பத்தில் யாவேயின் நேரடி ஈடுபாட்டைக் குறிக்கும் மொழி
  choice: “நீ என்னை அவனுக்கு எதிராகத் தூண்டியபோதிலும்” என்று நேரடியாகத் தக்கவைத்தல்
  alternative: “அவனுக்குத் தீங்கு நேர அனுமதிக்கும்படி நீ என்னைத் தூண்டியபோதிலும்”
  rationale: எபிரெய உரை தெய்வீகச் செயற்பாட்டை மென்மையாக்கவில்லை. இறையாண்மைக்கும் கதையின் அறச்சிக்கலுக்கும் இடையிலான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: הַשָּׂטָן என்பவரின் அடையாளம்
  choice: பங்கைக் குறிக்கும் “குற்றஞ்சாட்டுபவன்”
  alternative: “சாத்தான்”
  rationale: குறிப்புச் சுட்டுடன் வரும் வடிவம் இக்காட்சியில் ஒரு பட்டம்/பணியைச் சுட்டுகிறது; பிற்கால தனிப்பெயர் அடையாளத்தை உரைக்குள் முன்கூட்டியே திணிக்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய உருவகங்கள் தமிழில் குழப்பமளிக்கும் இடங்களில் தெளிவான சூழல்சார் பொருள் முதன்மை உரையிலும், சொல்லர்த்த வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது. இறைச்செயற்பாட்டின் பதற்றம் மென்மையாக்கப்படவில்லை.
