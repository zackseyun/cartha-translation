  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் பொருளை நம்பகமாகத் தருகிறது: הַשָּׂטָן-ஐப் பங்குப் பெயராகவும், வினாவை கவனித்தல்/கருத்தில் கொள்ளுதல் என்ற பொருளிலும், யாவேயைத் தூண்டியதன் நேரடித் தன்மையையும், חִנָּם-ஐ ‘காரணமின்றி’ என்றும் சரியாகக் காக்கிறது. ஆனால் அடிக்குறிப்பு d, யோபு 1:9-இன் ‘for nothing’ என்ற சொல்லிணைப்பை ‘எதுவும் பெறாமலா?’ என்று மட்டும் விளக்குவதால், மூலத்தின் திறந்த பொருளையும் நேரடியான சொல்லிணைப்பையும் போதிய அளவு தக்கவைக்கவில்லை.'
