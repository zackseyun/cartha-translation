source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: ta
  text: யாவே குற்றஞ்சாட்டுகிறவனிடம்[a], “நீ எங்கிருந்து வருகிறாய்?” என்றார். அதற்குக் குற்றஞ்சாட்டுகிறவன் யாவேக்குப் பதிலளித்து, “பூமியில் சுற்றித்திரிந்தும், அதில் அங்குமிங்கும் நடந்தும் வருகிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஹஸ்ஸாத்தான்’ (நேரடியாக, ‘அந்தக் குற்றஞ்சாட்டுகிறவன்’); இங்கு இது இயற்பெயராக இல்லாமல், ‘குற்றஞ்சாட்டுகிறவன்’ அல்லது ‘எதிராளி’ என்ற பொருளுடைய பட்டமாக இருக்கலாம்.
    reason: மாற்று வாசிப்பையும் எபிரெயச் சொல்லின் பட்டத்தன்மையையும் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுகிறவன்
  rationale: எபிரெயச் சொல்லுக்கு முன் குறித்த சுட்டு உருபு இருப்பதால், இங்கு அது இயற்பெயராக இருப்பதைவிட ஒரு பங்கு அல்லது பட்டத்தைக் குறிப்பதாகத் தெரிகிறது. நீதிமன்றச் சூழலுக்குரிய குற்றஞ்சாட்டும் நுண்பொருளையும் இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: நீ எங்கிருந்து வருகிறாய்?
  rationale: வருகையின் தொடக்க இடத்தைக் கேட்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: பதிலளித்து ... என்றான்
  rationale: மூலத்தில் உள்ள ‘பதிலளித்தான் ... சொன்னான்’ என்ற இரு வினைகளின் தொடரை, தமிழில் செயற்கையாக ஒலிக்காமல் பாதுகாக்கிறது.
- source_word: מִשֻּׁט בָּאָרֶץ
  choice: பூமியெங்கும் சுற்றித் திரிந்துவிட்டு
  rationale: שׁוט என்பதிலுள்ள அங்குமிங்கும் சுற்றும் இயக்கத்தையும், אֶרֶץ இங்கு குறிப்பிட்ட நாடல்லாமல் பூமியைக் குறிப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: அதில் அங்குமிங்கும் நடந்துவிட்டு
  rationale: התהלך என்பதிலுள்ள தொடர்ச்சியான அல்லது பல திசைகளில் நிகழும் நடமாட்டத்தைப் பாதுகாக்கிறது; ‘காவல் சுற்றுதல்’ போன்ற மூலத்தில் கட்டாயமில்லாத குறிப்பிட்ட பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: הַשָּׂטָן என்பதை ‘சாத்தான்’ என்ற இயற்பெயராகவா, ஒரு பங்கு அல்லது பட்டமாகவா மொழிபெயர்ப்பது
  choice: குற்றஞ்சாட்டுகிறவன்
  alternative: சாத்தான்; எதிராளி
  rationale: இச்சொல்லுடன் எபிரெயக் குறித்த சுட்டு உருபு இருப்பதும், பரலோக அவைக் காட்சியில் அது ஒரு பங்கைச் சுட்டுவதும் காரணமாக, பிற்கால இயற்பெயர் புரிதலை வசனத்திற்குள் முன்கூட்டியே புகுத்தாமல் பட்டத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குற்றஞ்சாட்டுகிறவன்’ என்ற திரும்பத் திரும்ப வரும் நீளமான வடிவம், மூலத்தின் பட்டத்தன்மையைத் துல்லியமாகப் பாதுகாப்பதற்காக ஏற்றுக்கொள்ளப்பட்டது; யாவேக்கான மரியாதைப் பன்மையும் குற்றஞ்சாட்டுகிறவனுக்கான ஒருமையும் உரையாடலில் வேறுபடுத்தப்பட்டுள்ளன.
