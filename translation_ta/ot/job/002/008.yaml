  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: ta
  text: அவன் தன்னைச் சுரண்டிக்கொள்ள[b] ஒரு மண்பாண்ட ஓடு[a] எடுத்தான்; அவன் சாம்பலின் நடுவில் உட்கார்ந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடைந்த மண்பாண்டத் துண்டை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன்னைச் சொறிந்துகொள்ள.’ எபிரெய வினைச்சொல் சொறிவதையோ சுரண்டுவதையோ குறிக்கலாம்; மண்பாண்ட ஓடு பயன்படுத்தப்படுவதால் ‘சுரண்டிக்கொள்ள’ இங்கு பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: அவன் ... எடுத்துக்கொண்டு
  rationale: לקח என்பதன் wayyiqtol வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. לוֹ-வைத் தனியே ‘தனக்காக’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருப்பதால், இயல்பான வினைத்தொடரில் அதன் பொருள் உள்ளடக்கப்பட்டுள்ளது.
- source_word: חֶרֶשׂ
  choice: ஒரு மண்பாண்ட ஓட்டை
  rationale: இச்சொல் சுடுமண் பாத்திரத்தின் உடைந்த துண்டைக் குறிக்கிறது. ‘மண்பாண்ட ஓடு’ என்பதைவிட ‘மண்பாண்ட ஓட்டை’ என்பது இவ்வாக்கியத்தில் கருவியாகப் பயன்படுத்தப்படும் உடைந்த துண்டைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְהִתְגָּרֵד בּוֹ
  choice: தன்னைச் சுரண்டிக்கொள்வதற்காக
  rationale: Hitpael வடிவம் செயல் அவன்மீதே நிகழ்வதைக் காட்டுகிறது; בּוֹ அந்த மண்பாண்ட ஓடு கருவி என்பதைக் குறிக்கிறது. கடினமான ஓட்டால் உடலைத் தேய்த்துச் சுரண்டும் காட்சிக்கு ‘சுரண்டிக்கொள்’ பொருத்தமானது; ‘சொறிந்துகொள்’ என்பதும் சாத்தியம்.
- source_word: וְהוּא יֹשֵׁב
  choice: உட்கார்ந்திருந்தான்
  rationale: இது பிரதான செயலுடன் ஒரே நேரத்தில் நீடித்திருந்த அவனுடைய நிலையைக் காட்டுகிறது. தமிழில் வாக்கிய இறுதியிலுள்ள ‘உட்கார்ந்திருந்தான்’ அந்தச் சூழ்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: சாம்பலின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்’ என்ற இடப்பொருளை நேரடியாகப் பாதுகாக்கிறது; הָאֵפֶר-ஐ ‘சாம்பல்’ என அளிக்கிறது. மூலத்தில் ‘சாம்பல் மேடு’ என்று வெளிப்படையாக இல்லை என்பதால் அதைச் சேர்க்கவில்லை.
