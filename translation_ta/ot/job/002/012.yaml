base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: ta
  text: அவர்கள் தொலைவிலிருந்து[a] அவரை ஏறிட்டுப் பார்த்தபோது, அவரை அடையாளம் கண்டுகொள்ளவில்லை. அவர்கள் உரக்கக் குரலெழுப்பி அழுதார்கள்; ஒவ்வொருவரும் தன் மேலங்கியைக் கிழித்து, தன் தலைக்குமேல் புழுதியை வானத்தை நோக்கி வீசினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூரத்திலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: இது துக்கத்தை வெளிப்படுத்தும் ஒரு செய்கை; புழுதியை மேல்நோக்கி வீசுவது இதில் அடங்கும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: அவரை ஏறிட்டுப் பார்த்தபோது
  rationale: எபிரெய மொழிமரபின் பொருள் பார்வையை உயர்த்திப் பார்ப்பதாகும்; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் ‘ஏறிட்டுப் பார்த்த’ என வழங்கப்பட்டது.
- source_word: מֵרָחוֹק
  choice: தொலைவிலிருந்து
  rationale: இடைவெளியைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; ‘தூரத்திலிருந்து’ என்பதும் சாத்தியம்.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: அவரை அடையாளம் கண்டுகொள்ளவில்லை
  rationale: இங்கு איובின் மாறிய தோற்றத்தால் அவரை அடையாளம் காண இயலாததைக் குறிப்பதால் சூழலுக்குத் துல்லியமான மொழிபெயர்ப்பு.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: அவர்கள் உரத்த குரலில் அழுதார்கள்
  rationale: குரலை உயர்த்தி அழுதார்கள் என்ற எபிரெய புலம்பல் மொழிமரபை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: ஒவ்வொருவரும் தன் மேலங்கியைக் கிழித்துக்கொண்டு
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவரும்’ என்றும், מְעִיל என்பதைக் குறிப்பான வெளி ஆடையான ‘மேலங்கி’ என்றும் தருகிறது.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: வானத்தை நோக்கித் தங்கள் தலைகளுக்குமேல் புழுதியை வீசினார்கள்
  rationale: திசைகாட்டும் הַשָּׁמָיְמָה-வை ‘வானத்தை நோக்கி’ எனப் பாதுகாத்து, புழுதியை மேலே வீசி தலைகள்மேல் விழச் செய்யும் துக்கச் செய்கையையும் தெளிவாகக் காட்டுகிறது.
