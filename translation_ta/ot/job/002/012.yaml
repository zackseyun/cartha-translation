translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழிமரபுகள் தமிழில் இயல்பாக வழங்கப்பட்டாலும், வானத்தை நோக்கிய திசையும் துக்கச் செய்கையின் வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
