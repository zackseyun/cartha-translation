translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடையும் அவசரமான தூதர் அறிக்கையின் ஓட்டமும் பேணப்பட்டுள்ளன. யோபை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள இனப்பெயர், தாக்குதலின் திடீர்மை, ஒரே ஒருவன் தப்பியிருப்பதற்கான வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
