base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: ta
  text: அவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே, வேறொருவன் வந்து, “கல்தேயர்கள் மூன்று தாக்குதல் அணிகளை அமைத்து[a], ஒட்டகங்கள் மீது பாய்ந்து அவற்றைக் கைப்பற்றிக்கொண்டார்கள். இளைஞர்களை[b] வாளால் கொன்றார்கள்[c]. உமக்குத் தெரிவிப்பதற்காக நான் ஒருவன் மட்டுமே தப்பினேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “மூன்று பிரிவுகளை அமைத்து” அல்லது “மூன்று அணிகளாகப் பிரிந்து.” சொல்லுக்குச் சொல்: “மூன்று தலைகளை வைத்தார்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: “இளைஞர்கள்” என்பது இச்சூழலில் வீட்டுப் பணியாளர்களையோ ஊழியர்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல், “வாளின் வாயால் தாக்கினார்கள்”; அதாவது, வாளால் கொன்றார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: இவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: עוֹד என்பதும் நிகழ்கால வினையெச்சமான מְדַבֵּר என்பதும் பேச்சு தொடர்ந்து நடந்துகொண்டிருந்ததைக் குறிக்கின்றன; זֶה முந்தைய தூதனைச் சுட்டுகிறது.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: வேறொருவன் வந்து ... என்றான்
  rationale: தொடர்ந்து வரும் தூதர்களின் வருணனையில் இரண்டாவது זֶה அடுத்த தூதனைச் சுட்டுவதால், இயல்பான தமிழில் ‘வேறொருவன்’ என வழங்கப்பட்டது.
- source_word: כַּשְׂדִּים
  choice: கல்தேயர்கள்
  rationale: தாக்குதல் நடத்திய மக்களினத்தைக் குறிக்கும் பெயர்.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: மூன்று கொள்ளைக் குழுக்களாக அணிவகுத்து
  rationale: சொல்லுக்குச் சொல் ‘மூன்று தலைகளை வைத்தார்கள்’; இச்சூழலில் மூன்று படைப்பிரிவுகள் அல்லது தாக்குதல் குழுக்களை அமைத்ததைக் குறிக்கிறது. ‘கொள்ளைக் குழுக்கள்’ தாக்குதலின் நோக்கைச் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: மேல் பாய்ந்து
  rationale: படையெடுத்து அல்லது திடீரெனத் தாக்குவதைச் சுட்டும் வினையின் வேகத்தையும் வன்முறையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַגְּמַלִּים וַיִּקָּחוּם
  choice: ஒட்டகங்கள்மேல் பாய்ந்து அவற்றைக் கைப்பற்றிக்கொண்டார்கள்
  rationale: வினையுடன் இணைந்த சுட்டுப்பெயர் ஒட்டகங்களையே குறிக்கிறது; கொள்ளைச் சூழலில் ‘கைப்பற்றிக்கொண்டார்கள்’ என்பது לָקַח என்பதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: נְעָרִים என்பதன் முதன்மையான பொருளைப் பாதுகாக்கிறது; இச்சூழலில் அவர்கள் பணியாளர்களாக இருக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: வாளால் வெட்டிக் கொன்றார்கள்
  rationale: ‘வாளின் வாய்/கூரால் தாக்கினார்கள்’ என்ற எபிரேய மரபுத்தொடர் வாளால் கொல்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் முடிவைத் தெளிவாகவும் வழங்கப்பட்டுள்ளது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே தப்பினேன்
  rationale: רַק மற்றும் לְבַדִּי ஆகிய இரண்டும் தூதன் மட்டுமே தப்பியதை வலியுறுத்துகின்றன.
- source_word: לְהַגִּיד לָךְ
  choice: உமக்குத் தெரிவிப்பதற்காக
  rationale: தூதனின் அவசர அறிக்கைச் சூத்திரத்தை மரியாதையான, இயல்பான தமிழில் தருகிறது.
