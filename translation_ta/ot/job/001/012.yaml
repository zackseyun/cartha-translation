  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: ta
  text: யாவே குற்றஞ்சாட்டுபவனிடம்[a], “இதோ, அவனுக்கு இருப்பதெல்லாம் உன் கையில் இருக்கிறது. ஆனால், அவன்மேல் உன் கையை நீட்டாதே” என்றார். பின்பு குற்றஞ்சாட்டுபவன் யாவேயின் முன்னிலையிலிருந்து புறப்பட்டுச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தச் சாத்தான்,” அல்லது “எதிராளி.” எபிரெயில் குறிப்புருபு இருப்பதால், இது ஒரு பட்டம் அல்லது பங்கைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுகிறவன்
  rationale: எபிரெயச் சொல்லுக்கு முன் சுட்டுருபு இருப்பதால், இதை நிலைபெற்ற தனிப்பெயராக அல்லாமல் ஒரு பங்கு அல்லது பட்டமாக வெளிப்படுத்துகிறது; இச்சூழலில் அதன் குற்றச்சாட்டு சார்ந்த பொருளையும் தெளிவாக்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறிப்பின் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: כָל אֲשֶׁר לוֹ
  choice: அவனுக்கு இருப்பதெல்லாம்
  rationale: யோபுக்குச் சொந்தமான அனைத்தையும் குறிக்கும் முழுமையான பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில் இருக்கிறது
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் ‘கை’ உருவகத்தை அடுத்த கட்டளையிலும் வரும் அதே சொல்லுடன் சேர்த்துக் காக்கிறது.
- source_word: רַק
  choice: ஆனால்
  rationale: வழங்கப்பட்ட அதிகாரத்துக்கு விதிக்கப்படும் ஒரே வரம்பைத் தமிழில் தெளிவாகக் குறிக்கிறது; இங்கு சொல்லுக்குச் சொல் ‘மட்டும்’ என்பதைவிட இயல்பாக உள்ளது.
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: அவன் மேல் உன் கையை நீட்டாதே
  rationale: யோபுக்கு எதிரான தீங்கான நடவடிக்கையைத் தடைசெய்யும் பொருளையும், மூலத்தின் ‘கை’ உருவகத்தையும் சொல் மறுமொழியையும் காக்கிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: காட்சியிடத்திலிருந்து வெளியேறிய தொடர்ச்சியான கதைநிகழ்வை இயல்பான தமிழில் தருகிறது.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: யாவேயின் முன்னிலையிலிருந்து
  rationale: ஒருவரின் முகத்திற்கு முன்பாக அல்லது சந்நிதியில் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, வானமன்றக் காட்சியைத் தக்கவைக்கும் நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: யோபு முன்னுரையில் הַשָּׂטָן என்பதன் மொழிபெயர்ப்பு
  choice: குற்றஞ்சாட்டுகிறவன்
  alternative: சாத்தான்; எதிராளி
  rationale: சுட்டுருபுடன் வரும் எபிரெய வடிவம் ஒரு பங்கு அல்லது பட்டத்தைக் காட்டுகிறது. ஆகவே பிற்காலத்தில் நிலைபெற்ற தனிப்பெயர் குறித்த கருத்தை வசனத்துக்குள் முன்கூட்டியே புகுத்தாமல், வானமன்றத்தில் குற்றஞ்சாட்டும் பங்கை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடிய கண்ணியமான நடை. ‘கை’ என்ற மூல உருவகமும் அதன் மறுமொழியும் பாதுகாக்கப்பட்டுள்ளன; הַשָּׂטָן பற்றிய மூல மொழியின் திறந்தநிலை அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
