source:
  edition: WLC
  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: ta
  text: இவை அனைத்திலும் யோபு பாவம் செய்யவில்லை; கடவுள்மீது முறைகேட்டைச் சுமத்தவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள்மீது மடத்தனத்தைச் சுமத்தவும் இல்லை”; அல்லது, “கடவுள்மீது தகாததொன்றைச் சுமத்தவும் இல்லை.”
    reason: תִּפְלָה என்பதற்கு ‘மடத்தனம்,’ ‘தகாத தன்மை,’ ‘முறைகேடு’ ஆகிய பொருள் நிழல்கள் இருக்கக்கூடும்.
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: இவை அனைத்திலும்
  rationale: முன்னர் நிகழ்ந்த சூழ்நிலைகள் அனைத்தையும் உள்ளடக்கும் எபிரெய மொழித் தொடரின் விரிவான பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לֹא חָטָא
  choice: பாவம் செய்யவில்லை
  rationale: חטא என்பதன் வழக்கமான சமய-அறநெறிப் பொருளான ‘பாவம் செய்’ என்பதைத் தெளிவாகப் பேணுகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וְלֹא נָתַן
  choice: சுமத்தவும் இல்லை
  rationale: நேரடியாக ‘கொடுக்கவில்லை’ என்று மொழிபெயர்ப்பதைவிட, תִּפְלָה என்பதையும் கடவுளைக் குறிக்கும் மறைமுகச் செயப்படுபொருளையும் இணைக்கும் சூழலில் ‘ஒன்றைக் கடவுள்மீது சுமத்துதல்’ என்ற கருத்தை இயல்பாகத் தருகிறது.
- source_word: תִּפְלָה
  choice: முறைகேட்டை
  rationale: அறநெறி அல்லது சமயத்துக்கு ஒவ்வாத தன்மை, பழிக்கத்தக்க செயல் என்ற சொல்லின் பரப்பைத் தக்கவைக்கிறது; வெறும் அறிவுக் குறைவைக் குறிக்கும் ‘முட்டாள்தனம்’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது. மூலச்சொல்லின் வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לֵאלֹהִים
  choice: கடவுள்மீது
  rationale: לְ குறிக்கும் தொடர்பை, தமிழில் ‘சுமத்து’ என்ற வினையுடன் இயல்பாக வரும் ‘கடவுள்மீது’ என வழங்குகிறது.
theological_decisions:
- issue: תִּפְלָה என்ற சொல்லை கடவுளுடன் தொடர்புபடுத்தி மொழிபெயர்ப்பது
  choice: கடவுள்மீது முறைகேட்டைச் சுமத்தவும் இல்லை
  alternative: கடவுள்மீது மூடத்தனத்தைச் சுமத்தவும் இல்லை; கடவுளிடம் தகாததொன்றைக் கற்பிக்கவும் இல்லை
  rationale: யோபு தன் துன்பத்தில் கடவுளுக்குப் பழிக்கத்தக்க அல்லது தகாத எதையும் கற்பிக்கவில்லை என்பதே வாக்கியத்தின் மையம். அதேவேளை, תִּפְלָה என்பதிலுள்ள ‘மூடத்தனம்/தகாத தன்மை’ என்ற உண்மையான சொற்பொருள் சாத்தியங்களை அடிக்குறிப்பில் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘பாவம்’ என்ற அடிப்படை வேதாகமச் சொல்லைத் தக்கவைத்து, נתן + תִּפְלָה + לֵאלֹהִים என்ற தொடரை இயல்பான தமிழ் வழக்கில் ‘கடவுள்மீது முறைகேட்டைச் சுமத்துதல்’ என வழங்கியுள்ளது.
