source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: ta
  text: அவனையும், அவன் வீட்டையும், அவனுக்கு உள்ள அனைத்தையும் சுற்றி, எல்லாப் பக்கங்களிலும் நீர் வேலி அமைத்திருக்கவில்லையா?[a] அவன் கைகளின் வேலையை நீர் ஆசீர்வதித்திருக்கிறீர்; அவனுடைய கால்நடைகள் நாடெங்கும் பரவிப் பெருகியிருக்கின்றன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைச் சுற்றி வேலியிட்டுப் பாதுகாக்கவில்லையா?’ எபிரெயச் சொல் பாதுகாப்பான ஓர் அடைப்பை அமைக்கும் கண்கூடிய உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாட்டில் மிகுதியாகப் பெருகியிருக்கின்றன.’ எபிரெய வினை எல்லையை உடைத்துக்கொண்டு விரிவதையோ பொங்கி வளர்வதையோ சொல்லர்த்தமாக உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: வேலி அமைத்திருக்கவில்லையா
  rationale: பாதுகாப்பிற்காகச் சுற்றிலும் அடைப்பு அமைக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘பாதுகாக்கவில்லையா’ என்ற அருவமான மொழிபெயர்ப்பைவிட மூலத்தின் காட்சியை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ
  choice: அவனைச் சுற்றிலும், அவன் வீட்டைச் சுற்றிலும், அவனுக்குள்ள எல்லாவற்றைச் சுற்றிலும்
  rationale: மூலத்தில் மூன்று முறை வரும் சுற்றிப் பாதுகாக்கும் அமைப்பையும் அதன் வலியுறுத்தலையும் தமிழில் தக்கவைக்கிறது.
- source_word: מִסָּבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: பாதுகாப்பு முழுமையாகச் சூழ்ந்திருப்பதைச் சுட்டும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: מַעֲשֵׂה יָדָיו
  choice: அவன் கைகளின் வேலை
  rationale: ஒருவருடைய உழைப்பையும் உற்பத்திச் செயலையும் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவத்தைப் புரிந்துகொள்ளத்தக்க தமிழில் தக்கவைக்கிறது.
- source_word: בֵּרַכְתָּ
  choice: ஆசீர்வதித்திருக்கிறீர்
  rationale: வெறும் பொருளாதார வெற்றியாகச் சுருக்காமல், அந்த வளம் கடவுளுடைய ஆசீர்வாதத்தால் வந்தது என்ற மூலத்தின் கூற்றைத் தக்கவைக்கிறது.
- source_word: מִקְנֵהוּ
  choice: அவனுடைய கால்நடைகள்
  rationale: பொதுவான உடைமைகளை அல்லாமல், வளர்க்கப்படும் மந்தைகளையும் கால்நடைச் செல்வத்தையும் இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
- source_word: פָּרַץ
  choice: பரவிப் பெருகியிருக்கின்றன
  rationale: ‘உடைத்துக்கொண்டு வெளியேறுதல்’ அல்லது ‘எல்லை கடந்து விரிதல்’ என்ற வினையின் உயிரோட்டமான விரிவாக்கப் படிமத்தையும், சூழலுக்குரிய எண்ணிக்கைப் பெருக்கத்தையும் இணைத்துத் தருகிறது.
- source_word: בָּאָרֶץ
  choice: நாடெங்கும்
  rationale: வெறும் இருப்பிடத்தைக் காட்டாமல், கால்நடைகள் நிலப்பரப்பெங்கும் விரிந்துள்ள விநியோகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲלֹא
  choice: அமைத்திருக்கவில்லையா?
  rationale: சாத்தான் முன்வைக்கும் குற்றச்சாட்டுத் தொனியுள்ள வினாவை உறுதிப்படுத்தும் கூற்றாக மாற்றாமல் வினாவாகவே தக்கவைக்கிறது.
theological_decisions:
- issue: ஆசீர்வாத மொழியைத் தக்கவைத்தல் அல்லது அதை பொருளாதார வளமாக மட்டும் மாற்றுதல்
  choice: அவன் கைகளின் வேலையை நீர் ஆசீர்வதித்திருக்கிறீர்
  alternative: அவன் கைகளின் வேலையை நீர் செழிக்கச் செய்திருக்கிறீர்
  rationale: ברך என்பது நேரடியாக ‘ஆசீர்வதித்தல்’ என்று பொருள்படுகிறது. யோபுவின் வளத்தைத் தெய்வீக ஆசீர்வாதத்தோடு இணைக்கும் மூலத்தின் இறையியல் கூற்றை இந்தத் தேர்வு பாதுகாக்கிறது.
- issue: சுற்றிப் பாதுகாக்கும் வேலி உருவகத்தைப் பாதுகாத்தல்
  choice: வேலி அமைத்திருக்கவில்லையா?
  alternative: பாதுகாக்கவில்லையா?
  rationale: மூலம் பயன்படுத்தும் கண்கூடிய சுற்றடைப்பு உருவகத்தை அருவமான பாதுகாப்புக் கருத்தாகத் தட்டையாக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனாலும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘இருக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மும்முறை ‘சுற்றிலும்’ அமைப்பும் சொல்லாட்சிசார் வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது.
