  rationale: திருத்தம் தமிழ்ச் சொற்றொடரின் இயல்பையும் இலக்கணத் தெளிவையும் மேம்படுத்துகிறது; பொருளில் மாற்றமில்லை. ‘சுற்றி, எல்லாப் பக்கங்களிலும்’ என்பது שׂוּךְ, בְּעַד, מִסָּבִיב ஆகியவற்றின் முழுச் சூழல்-பாதுகாப்பு படிமத்தைத் தக்கவைக்கிறது. ‘பரவிப் பெருகியிருக்கின்றன’ என்பது பָּרַץ வினையின் விரிதல் மற்றும் மிகுதியாகுதல் ஆகிய இரு நிழற்பொருள்களையும், உரைத் தேர்வில் தேவையற்ற குறுக்கீடின்றி, வெளிப்படுத்துகிறது.
