base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: ta
  text: அவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே, வேறொருவன் வந்து, “கடவுளின் நெருப்பு வானத்திலிருந்து விழுந்து, ஆடுகளையும் இளைஞர்களையும் பற்றியெரிந்து சுட்டெரித்தது. உங்களிடம் இதைச் சொல்ல நான் ஒருவன் மட்டுமே தப்பினேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: கடவுளின் நெருப்பு
  rationale: எபிரெயச் சொற்றொடரின் நேரடி வடிவத்தையும், அது கடவுளால் அனுப்பப்பட்ட நெருப்பையோ மிகப் பெரும் இயற்கை நெருப்பையோ குறிக்கக்கூடிய தெளிவின்மையையும் காக்கிறது.
- source_word: בַצֹּאן
  choice: ஆடுகளுக்கும்
  rationale: צֹאן என்பது சிறு கால்நடை மந்தையைக் குறிக்கலாம்; யோபுவின் சொத்து விவரிப்பில் உள்ள சூழலுக்கும் தமிழ் இயல்புக்கும் ஏற்ப ‘ஆடுகள்’ என வழங்கப்பட்டது.
- source_word: בַנְּעָרִים
  choice: இளைஞர்களுக்கும்
  rationale: נְעָרִים என்பதன் அடிப்படைப் பொருளான ‘இளைஞர்கள்’ காக்கப்படுகிறது; அவர்களை வேலைக்காரர்கள் என மட்டும் விளக்கிச் சுருக்கவில்லை.
- source_word: וַתֹּאכְלֵם
  choice: அவர்களை அழித்துவிட்டது
  rationale: நெருப்பு ‘தின்றது’ என்ற எபிரெய உருவகத்தின் விளைவைக் காட்டும் இயல்பான தமிழ்; ஆடுகளும் இளைஞர்களும் முற்றிலும் அழிந்ததை வெளிப்படுத்துகிறது.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே தப்பினேன்
  rationale: தூதன் மட்டும் உயிர்தப்பியதை வலியுறுத்தும் மூலத்தின் இரட்டிப்பு வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ‘கடவுளின் நெருப்பு’ என்பதன் தன்மை
  choice: கடவுளின் நெருப்பு
  alternative: மின்னல் / கடவுள் அனுப்பிய நெருப்பு
  rationale: மூலவாசகம் நிகழ்வின் இயற்கை அல்லது அதிசயத் தன்மையைத் தீர்மானிக்கவில்லை; ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். தொடர்ச்சியாக வரும் பேரழிவுச் செய்தியின் வேகத்தை ‘இன்னும் பேசிக்கொண்டிருக்கும்போதே’ வெளிப்படுத்துகிறது. மரியாதை ஒருமைச் சூழலுக்கேற்ற வகையில் யோபை நோக்கிய לָךְ ‘உங்களிடம்’ என வழங்கப்பட்டது.
