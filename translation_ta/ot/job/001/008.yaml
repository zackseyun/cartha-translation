source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: ta
  text: யாவே குற்றஞ்சாட்டுபவனிடம்[b], “என் ஊழியனான யோபின்மேல் உன் மனத்தைச் செலுத்தினாயா?[a] பூமியில் அவனைப்போல் வேறு யாரும் இல்லை. அவன் குற்றமற்றவனும் நேர்மையானவனும், கடவுளுக்குப் பயந்து தீமையைவிட்டு விலகுகிற மனிதன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வழக்கமான மொழிபெயர்ப்பில், “என் ஊழியனான யோபைக் கவனித்தாயா?” எபிரெயத்தில் சொல்லர்த்தமாக, “என் ஊழியனான யோபின்மேல் உன் இதயத்தை வைத்தாயா?”
    reason: lexical_alternative
  - marker: b
    text: “குற்றஞ்சாட்டுபவன்” என்பதற்கான எபிரெயச் சொல்லை “சாத்தான்” அல்லது “எதிரி” என்றும் மொழிபெயர்க்கலாம். இங்கு அது தனிப்பட்ட பெயராகத் தெளிவாகச் செயல்படுவதைவிட ஒரு பட்டத்தை அல்லது பங்கைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுகிறவன்
  rationale: எபிரெயச் சொல்லுக்கு முன் வரையறைச் சுட்டு இருப்பதால், தனிப்பட்ட பெயராகத் தீர்மானிக்காமல் குற்றஞ்சாட்டும் பங்கு அல்லது பட்டத்தைக் காட்டுகிறது.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: உன் உள்ளத்தை வைத்தாயா?
  rationale: ‘இதயத்தை வை’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் ஓரளவு காத்து, கவனத்தைச் செலுத்துதல் என்ற பொருளைத் தெரிவிக்கிறது.
- source_word: עַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: இங்கு அடிமைத்தனத்தை அல்ல, கடவுளுக்குச் சொந்தமாய் அவருக்குச் சேவை செய்யும் நிலையைச் சுட்டுகிறது.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: பூமியில் அவனைப்போல் வேறு யாரும் இல்லை
  rationale: ஒப்பற்ற தன்மையையும், இவ்விடத்தில் இயல்பாகத் தோன்றும் உலகளாவிய பரப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: குற்றமற்றவனும் நேர்மையானவனுமாய் ... மனிதன்
  rationale: தָּם என்பதைக் பாவமற்ற பரிபூரணமாக மிகைப்படுத்தாமல் நன்னடத்தை மற்றும் முழுமையான நேர்மையின் பொருளில் ‘குற்றமற்றவன்’ எனவும், יָשָׁר என்பதை ‘நேர்மையானவன்’ எனவும் தருகிறது.
- source_word: יְרֵא אֱלֹהִים
  choice: கடவுளுக்குப் பயந்து
  rationale: பயபக்தி நிறைந்த தொடர்ச்சியான இறைப்பற்றைக் குறிக்கும் வேதாகம மொழிநடையைப் பாதுகாக்கிறது.
- source_word: וְסָר מֵרָע
  choice: தீமையைவிட்டு விலகுகிற
  rationale: தீமையை வழக்கமாகத் தவிர்த்து நிராகரிக்கும் தொடர்ச்சியான செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: הַשָּׂטָן என்பது தனிப்பட்ட பெயரா, பங்கு அல்லது பட்டமா?
  choice: குற்றஞ்சாட்டுகிறவன் என்ற பங்கு சார்ந்த சொல்லாட்சி
  alternative: சாத்தான்; எதிரி
  rationale: எபிரெயத்தில் வரையறைச் சுட்டு இருப்பது இச்சூழலில் பட்டம் அல்லது பங்கைக் குறிக்கிறது; பின்னாளைய தனிப்பெயர் பயன்பாட்டை முன்கூட்டியே உரையில் புகுத்தாமல் இருக்கிறது.
- issue: תָּם என்பது முற்றிலும் பாவமற்ற பரிபூரணத்தைக் குறிக்கிறதா?
  choice: நன்னடத்தையில் குற்றம் சாட்ட இயலாத நேர்மையைக் குறிக்கும் ‘குற்றமற்றவன்’
  alternative: பரிபூரணமானவன்; முழுமையானவன்
  rationale: ஞான இலக்கியச் சூழலும் ‘நேர்மையானவன்’ என்ற இணைச்சொல்லும் முழுமையான பாவமின்மையை அல்ல, ஒழுக்க ஒருமைப்பாட்டையே சுட்டுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான வேதாகம நடை. ‘உள்ளத்தை வைத்தாயா’ என்ற உருவகம் வாசகருக்குப் புரியும் வகையில் காக்கப்பட்டு, அடிக்குறிப்பில் அதன் பொருள்சார் மாற்று தரப்பட்டுள்ளது. [a], [b] குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு அருகில் அமைக்கப்பட்டுள்ளன.
