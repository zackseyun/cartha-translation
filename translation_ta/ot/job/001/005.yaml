  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: ta
  text: விருந்தின் நாட்களின் சுழற்சி முடிந்ததும், யோபு அவர்களை வரவழைத்து, அவர்களைப் பரிசுத்தப்படுத்துவார். அவர் அதிகாலையில் எழுந்து, அவர்கள் அனைவரின் எண்ணிக்கைக்கு ஏற்பத் தகனபலிகளைச் செலுத்துவார். ஏனெனில், “ஒருவேளை என் மகன்கள் பாவம் செய்து, தங்கள் உள்ளங்களில் கடவுளைச் சபித்திருக்கலாம்” என்று யோபு சொன்னார். இவ்வாறே யோபு எல்லாக் காலமும் செய்து வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: விருந்தின் நாட்கள் ஒரு சுற்று முடிந்ததும்
  rationale: הקיף என்பதன் ‘சுற்றிவருதல்/ஒரு சுற்றை முடித்தல்’ என்ற படிமத்தையும், பிள்ளைகளின் முறைவைத்து நடத்தப்பட்ட விருந்துச் சுழற்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיְקַדְּשֵׁם
  choice: அவர்களைத் தூய்மைப்படுத்துவார்
  rationale: קדש இங்கு சடங்குமுறைப்படி பரிசுத்தப்படுத்துதல் அல்லது ஆயத்தப்படுத்துதல் எனப் பொருள்படும்; ‘தூய்மைப்படுத்துதல்’ சாதாரண வாசகருக்குத் தெளிவாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் தொழில்நுட்பச் சொல்; பொதுவான ‘பலிகள்’ என்பதைக் காட்டிலும் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מִסְפַּר כֻּלָּם
  choice: அவர்கள் ஒவ்வொருவருக்காகவும்
  rationale: சொல்லுக்கு சொல் ‘அவர்கள் எல்லாருடைய எண்ணிக்கைப்படி’; தமிழில் இயல்பாக, ஒவ்வொரு பிள்ளைக்கும் ஒரு பலி என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: בֵרֲכוּ אֱלֹהִים
  choice: கடவுளைச் சபித்திருக்கலாம்
  rationale: எழுத்துப்படி ‘கடவுளை வாழ்த்தினர்’; ஆனால் இச்சூழலில் ברך என்பது மரியாதைத் தவிர்ப்புச் சொல்லாக ‘சபித்தல்’ எனப் பயன்படுகிறது.
- source_word: כָּל הַיָּמִים
  choice: எப்போதும்
  rationale: சொற்றொடரின் வழக்கமான தொடர்ச்சிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: யோபின் பலிகள் பிள்ளைகளின் பாவத்தை நிச்சயமாக நீக்கியதாக வசனம் கூறுகிறதா?
  choice: யோபின் முன்னெச்சரிக்கையான எண்ணத்தையும் வழக்கமான செயலையும் மட்டும் மொழிபெயர்த்தல்
  alternative: பலிகள் அவர்களின் பாவங்களுக்கு பரிகாரம் செய்தன என்று விளக்கிச் சேர்த்தல்
  rationale: மூலவசனம் யோபின் ‘ஒருவேளை’ என்ற எண்ணத்தையும் அவர் செய்த பலியையும் கூறுகிறது; அதன் விளைவைக் குறித்து இறையியல் முடிவைச் சேர்க்கவில்லை.
- issue: ברך என்பதிலுள்ள சொற்பொருள்–சூழற்பொருள் பதற்றம்
  choice: முதன்மை உரையில் ‘சபித்திருக்கலாம்’
  alternative: ‘கடவுளை வாழ்த்தியிருக்கலாம்’ என்று எழுத்துப்படி மொழிபெயர்த்தல்
  rationale: பாவம் செய்திருக்கலாம் என்ற முன்னுரையும் யோபு நூலில் இதே மரியாதைத் தவிர்ப்புப் பயன்பாடும் எதிர்மறைப் பொருளை உறுதிப்படுத்துகின்றன; எழுத்துப்படியான வடிவம் தமிழில் தவறான பொருள் தரும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். எபிரேய வினைத் தொடரின் பழக்கச் செயல் நுணுக்கம் ‘செய்துவந்தார்/செலுத்துவார்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
