revisions:
- from: விருந்தின் நாட்கள் ஒரு சுற்று முடிந்ததும், யோபு தன் பிள்ளைகளை அழைத்தனுப்பி அவர்களைத் தூய்மைப்படுத்துவார். அதிகாலையில் எழுந்து, அவர்கள் ஒவ்வொருவருக்காகவும் தகனபலிகளைச் செலுத்துவார். ஏனெனில், “ஒருவேளை என் பிள்ளைகள் பாவம் செய்து, தங்கள் உள்ளத்தில் கடவுளைச் சபித்திருக்கலாம்” என்று யோபு நினைத்தார். இவ்வாறே யோபு எப்போதும் செய்துவந்தார்.
  to: விருந்தின் நாட்களின் சுழற்சி முடிந்ததும், யோபு அவர்களை வரவழைத்து, அவர்களைப் பரிசுத்தப்படுத்துவார். அவர் அதிகாலையில் எழுந்து, அவர்கள் அனைவரின் எண்ணிக்கைக்கு ஏற்பத் தகனபலிகளைச் செலுத்துவார். ஏனெனில், “ஒருவேளை என் மகன்கள் பாவம் செய்து, தங்கள் உள்ளங்களில் கடவுளைச் சபித்திருக்கலாம்” என்று யோபு சொன்னார். இவ்வாறே யோபு எல்லாக் காலமும் செய்து வந்தார்.
