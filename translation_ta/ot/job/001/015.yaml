translation_notes:
  register: நவீன தரநிலைத் தமிழில், கதையின் அவசரமான செய்தியாளர் நடையைப் பேணும் வகையில் குறுகிய வாக்கியங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘பணியாளர்கள்’ என்பது சூழல் சார்ந்த தெளிவாக்கம்; ‘சேபா நாட்டினர்’ குழுவைக் குறிக்கும் இயல்பான தமிழ். மேற்கோள் நிறைவு குறி, முந்தைய வசனத்தில் தொடங்கிய செய்தியாளர் உரையின் தொடர்ச்சியை உணர்த்துகிறது.
