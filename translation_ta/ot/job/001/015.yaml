base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: ta
  text: சேபா நாட்டினர் அவற்றின்மேல் பாய்ந்து வந்து, அவற்றைக் கைப்பற்றிக்கொண்டார்கள்[a]. இளைஞர்களை வாளால் வெட்டிக் கொன்றார்கள்[b]. உங்களிடம் இதைத் தெரிவிக்க நான் ஒருவன் மட்டுமே தப்பிவந்தேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் “சேபா” என்ற பெயரே உள்ளது; இங்கு அது சேபாவிலிருந்து வந்த கொள்ளையர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொற்சொல்லாக, “வாளின் வாயால் அடித்தார்கள்”; இது வாளால் வெட்டிக் கொன்றதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: சேபா நாட்டினர் அவர்கள்மேல் திடீரெனத் தாக்கி
  rationale: נפל என்பதன் பகைமைத் தாக்குதல் சார்ந்த பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது. שְׁבָא என்பது இடப்பெயர் வடிவில் இருந்தாலும், சூழலில் சேபாவிலிருந்து வந்த கொள்ளைக் குழுவைக் குறிக்கிறது; ஆகவே ‘சேபா நாட்டினர்’ எனத் தெளிவாக்கப்பட்டது.
- source_word: וַתִּקָּחֵם
  choice: அவற்றைக் கைப்பற்றிக்கொண்டார்கள்
  rationale: ஆண்பால் பன்மை பின்னொட்டு முந்தைய வசனத்தின் எருதுகளையும் கழுதைகளையும் சுட்டுகிறது. தமிழில் உயிரற்ற விலங்குக் கூட்டத்தைப் பின்னோக்கிச் சுட்ட ‘அவற்றை’ இயல்பானது; கொள்ளைச் சூழலை ‘கைப்பற்றிக்கொண்டார்கள்’ வெளிப்படுத்துகிறது.
- source_word: הַנְּעָרִים
  choice: பணியாளர்களை
  rationale: נַעַר என்பது இளைஞர்களையோ பணியாளர்களையோ குறிக்கலாம். இங்கு கால்நடைகளைப் பராமரித்த யோபின் பணியாளர்கள் என்பதே சூழல் சார்ந்த பொருள்; வயதைத் தேவையின்றி நிர்ணயிக்காமல் அவர்களின் பணியைத் தெளிவாக்குகிறது.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: வாளால் வெட்டிக் கொன்றார்கள்
  rationale: ‘வாளின் வாயால் அடித்தார்கள்’ என்ற எபிரேய மொழிமரபின் பொருள் வாளால் கொல்வதாகும். சொற்சொல் மொழிபெயர்ப்பின் இயல்பின்மையைத் தவிர்த்து, வன்முறையின் தன்மையையும் முடிவையும் தெளிவாகக் கூறுகிறது.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே தப்பிவந்தேன்
  rationale: רַק மற்றும் לְבַדִּי ஆகியவற்றின் வலியுறுத்தப்பட்ட தனிமையை ‘ஒருவன் மட்டுமே’ காக்கிறது. செய்தியாளர் இப்போது வந்து நிற்பதை ‘தப்பிவந்தேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַגִּיד לָךְ
  choice: உங்களிடம் இதைத் தெரிவிக்க
  rationale: அறிக்கை அளிக்கும் சூழலில் נגד என்பதற்கு ‘தெரிவிக்க’ என்பது நவீன, மரியாதையான தமிழ். யோபிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது.
