  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: ta
  text: இவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே, வேறொருவன் வந்து, “உங்கள் மகன்களும் மகள்களும் தங்கள் மூத்த சகோதரனின் வீட்டில் சாப்பிட்டுக்கொண்டும் திராட்சரசம் குடித்துக்கொண்டும் இருந்தார்கள்[a],” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருந்துண்டுகொண்டும் திராட்சரசம் குடித்துக்கொண்டும் இருந்தார்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “சாப்பிட்டுக்கொண்டும் திராட்சரசம் குடித்துக்கொண்டும் இருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: இவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: முந்தைய தூதன் பேசி முடிப்பதற்குள் அடுத்தவன் வந்ததை, நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டும் எபிரெயப் பயன்பாட்டுக்கு ஏற்ப இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְזֶה בָּא
  choice: வேறொருவன் வந்து
  rationale: சொல்லுக்குச் சொல் ‘இவன் வந்தான்’ என்றாலும், தொடர்ச்சியாக வரும் வெவ்வேறு தூதர்களைக் குறிக்கும் உரையாடல் செயல்பாட்டை ‘வேறொருவன்’ தெளிவாகத் தருகிறது.
- source_word: וַיֹּאמַר
  choice: என்றான்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடை வடிவத்தை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: உங்கள் மகன்களும் மகள்களும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக இரண்டையும் பாதுகாக்கிறது.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: சாப்பிட்டு திராட்சரசம் குடித்துக்கொண்டிருந்தார்கள்
  rationale: நிகழ்ந்துகொண்டிருந்த செயலைப் பங்கேற்பு வடிவங்கள் காட்டுகின்றன. ‘விருந்துண்டு’ என்று பொருள்விரிவாக்காமல், சாப்பிடுதல் மற்றும் திராட்சரசம் குடித்தல் என்ற மூலத்தின் இரு செயல்களையும் வைத்திருக்கிறது.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: தங்கள் மூத்த சகோதரனின் வீட்டில்
  rationale: הַבְּכוֹר உடன்பிறந்தவர்களில் பிறப்பு வரிசையைச் சுட்டுகிறது; இச்சூழலில் ‘மூத்த சகோதரன்’ என்பது இயல்பான நவீனத் தமிழ். ‘முதற்பேறான சகோதரன்’ என்பது சொல்லுக்கு நெருக்கமானதாயினும் இங்கு செயற்கையாக ஒலிக்கும்.
