translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. யோபை நோக்கிப் பேசும் மரியாதைப் பன்மை ‘உங்கள்’ எனக் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளது.
