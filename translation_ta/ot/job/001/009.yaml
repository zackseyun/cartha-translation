source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: ta
  text: அப்போது குற்றஞ்சாட்டுபவன்[a] யாவேக்குப் பதிலளித்து, “யோபு எந்தப் பயனுமின்றியா[b] கடவுளுக்குப் பயப்படுகிறான்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அந்தச் சாத்தான்’ அல்லது ‘அந்த எதிரி’ என்றும் மொழிபெயர்க்கலாம். இங்கு இச்சொல் குறிப்புச் சுட்டுடன் வந்து ஒரு பதவி அல்லது பட்டமாகச் செயல்படுவதால், ‘குற்றஞ்சாட்டுபவன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘காரணமின்றியா’ என்றும் மொழிபெயர்க்கலாம். யோபு தன்னலமின்றிக் கடவுளுக்குப் பயப்படுகிறானா என்பதே இக்கேள்வியின் உட்கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: ענה என்ற வினை உரையாடல் சூழலில் ‘பதிலளித்தல்’ என்று பொருள்படும்; எபிரெயக் கதைத் தொடரையும் இயல்பான தமிழையும் இது காக்கிறது.
- source_word: הַשָּׂטָן
  choice: குற்றஞ்சாட்டுபவன்
  rationale: மூலத்தில் சொல்லுக்கு குறிப்புச் சுட்டு இருப்பதால், இங்கு அது தனிப்பெயரைவிட ஒரு பங்கு அல்லது பட்டமாகச் செயல்படுகிறது. நீதிமன்றத்தை ஒத்த இச்சூழலில் உள்ள குற்றஞ்சாட்டும் பங்கை இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמַר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை முடிக்கும் இயல்பான தமிழ் வடிவம்; எபிரெய மொழியின் ‘சொன்னான்’ என்ற கதைச் சூத்திரத்தின் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: הֲחִנָּם
  choice: வெறுமனேவா
  rationale: ‘எந்தப் பலனும் இல்லாமல்’, ‘காரணமின்றி’ ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கும் இயல்பான தமிழ்க் கேள்வி வடிவம்; யோபின் இறைப்பற்று தன்னலமற்றதா என்ற சவாலை முன்கூட்டியே தீர்த்துவிடவில்லை.
- source_word: יָרֵא
  choice: பயப்படுகிறான்
  rationale: கடவுளைக் குறித்த பயபக்தியைச் சுட்டும் ירא என்பதன் அடிப்படை வலிமையைப் பாதுகாக்கிறது; ‘மதிக்கிறான்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு மெய்யான கடவுளைக் குறிக்கும் אֱלֹהִים என்பதற்கான நேரடியும் பொதுவாகப் புரியக்கூடியதுமான தமிழ் இணை.
theological_decisions:
- issue: הַשָּׂטָן என்பதில் உள்ள குறிப்புச் சுட்டுடன் கூடிய பட்டம்
  choice: குற்றஞ்சாட்டுபவன்
  alternative: சாத்தான்; எதிரி
  rationale: மூல எபிரெயத்தில் இது குறிப்புச் சுட்டுடன் வருவதால், இக்காட்சியில் ஒரு தனிப்பெயராக மட்டுமே கருதாமல் பங்கு அல்லது பட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது. இதனால் பிற்கால அடையாளக் கருத்துகளை வசனத்துக்குள் திணிக்காமல் அதன் கதைச் சூழலும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
- issue: יהוה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கையின் இறைப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிப்பெயர்த்து வழங்குகிறது.
- issue: חנם எழுப்பும் யோபின் இறைப்பற்றின் நோக்கம் பற்றிய கேள்வி
  choice: வெறுமனேவா
  alternative: எந்தப் பலனும் இல்லாமலா; காரணமின்றியா
  rationale: யோபின் இறைப்பற்று கைம்மாறு எதிர்பாராததா அல்லது காரணமற்றதா என்ற மூலத்தின் பல்பொருள் வாய்ப்பைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் செறிவும் காக்கப்பட்டுள்ளன. ‘வெறுமனேவா’ என்பது பேச்சுவழக்கில் மட்டும் சுருங்காத, சாதாரண வாசகருக்கு இயல்பாகப் புரியும் வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது; அடிக்குறிப்புகள் மூலத்தின் மாற்று நிழற்பொருள்களை வெளிப்படுத்துகின்றன.
