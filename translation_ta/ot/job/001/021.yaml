  choice: யாவேயின் பெயர்
  rationale: எபிரெய இணைப்புச் சொற்றொடரைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: מְבֹרָךְ
  choice: போற்றப்படுவதாக
  rationale: ‘ஆசீர்வதிக்கப்பட்டதாக’ என்பது தமிழில் இங்கு செயற்கையாகவும் பொருள் குழப்பமாகவும் அமையலாம்; ‘போற்றப்படுவதாக’ என்பது மனிதர்கள் தெய்வீகப் பெயரை வாழ்த்திப் புகழும் பொருளை இயல்பாக எடுத்துரைக்கிறது, அதேவேளை அடிக்குறிப்பில் நேரடியான ‘ஆசீர்வதிக்கப்பட்டதாக’ என்ற மாற்று தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக வருகிறது. அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: שָׁמָה (‘அங்கே’) என்பதன் குறிப்பு
  choice: ‘அங்கே’ என்பதைத் தக்கவைத்து இலக்கை வெளிப்படையாகக் குறிப்பிடாமல் விடுதல்
  alternative: மண்ணுக்குத் திரும்புவேன்; கல்லறைக்குத் திரும்புவேன்; தாயின் கருப்பைக்குத் திரும்புவேன்
  rationale: எபிரெயம் இலக்கை விளக்காமல் ‘அங்கே’ என்று மட்டுமே கூறுகிறது. அது கருப்பையை உருவகமாகவோ, மண் அல்லது கல்லறையையோ, எதுவுமற்ற நிலையையோ சுட்டலாம்; மொழிபெயர்ப்பு இந்த விளக்கத் திறப்பை மூடவில்லை.
- issue: מְבֹרָךְ என்பதன் தமிழ் வெளிப்பாடு
  choice: போற்றப்படுவதாக
  alternative: ஆசீர்வதிக்கப்பட்டதாக
  rationale: எபிரெய வடிவம் சொற்படியாக ‘ஆசீர்வதிக்கப்பட்ட’ எனினும், கடவுளின் பெயரைப் பற்றிய வாழ்த்துக் கூற்றில் ‘போற்றப்படுவதாக’ என்பது இயல்பான தமிழில் நோக்கத்தைத் தெளிவாகத் தருகிறது. நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணமாகவே’ என்பது மூலத்தின் மறுமொழி வலியுறுத்தலைத் தக்கவைக்கிறது. ‘அங்கே’ என்ற திட்டமற்ற சுட்டுச் சொல் விளக்கிச் சரிசெய்யப்படாமல் பாதுகாக்கப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
