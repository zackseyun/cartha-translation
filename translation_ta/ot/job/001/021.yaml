- source_word: לָקָח
  choice: எடுத்துக்கொண்டார்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘எடுத்தார்’ என்பதை இழப்புச் சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பறித்தார்’ போன்ற அதிகப்படியான எதிர்மறை நிழலைச் சேர்க்கவில்லை.
- source_word: יְהִי
  choice: போற்றப்படுவதாக
  rationale: விருப்பம் அல்லது வாழ்த்தைக் குறிக்கும் jussive வடிவை இயல்பான தமிழ் வேண்டுதல் வடிவில் தருகிறது.
