base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “ஆடையின்றி என் தாயின் கருப்பையிலிருந்து வெளிவந்தேன்; ஆடையின்றியே அங்கே திரும்புவேன்.[a] யாவே கொடுத்தார்; யாவே எடுத்துக்கொண்டார். யாவேயின் பெயர் வாழ்த்தப்படுவதாக!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அங்கே’ என்று உள்ளது; திரும்பும் இடம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. இது உருவகமாகத் தாயின் கருப்பையையோ, விரிவாக மண் அல்லது கல்லறையையோ, எதுவுமற்ற நிலையையோ சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக, ‘ஆசீர்வதிக்கப்பட்டதாக’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: நிர்வாணமாக
  rationale: ஆடையின்றி இருப்பதை நேரடியாகக் குறிக்கும் எபிரெயச் சொல்லைத் தக்கவைத்து, பிறப்பின் நேரடிப் படிமத்தையும் எதுவுமின்றி இருக்கும் விரிவான பொருளையும் வெளிப்படுத்துகிறது.
- source_word: יצתי
  choice: வெளிவந்தேன்
  rationale: יצא என்ற வினை இங்கு கருப்பையிலிருந்து பிறந்து வருவதைக் குறிக்கிறது; ‘வெளிவந்தேன்’ என்பது இயல்பான தமிழில் அந்தத் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: מִבֶּטֶן אִמִּי
  choice: என் தாயின் கருப்பையிலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் உடல்சார் தெளிவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: நிர்வாணமாகவே அங்கே திரும்புவேன்
  rationale: ‘நிர்வாணமாக’ என்பதற்கான வலியுறுத்தலையும் שָׁמָה என்பதன் ‘அங்கே’ என்ற வெளிப்பாட்டையும் தக்கவைத்து, இலக்கை விளக்கிச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
