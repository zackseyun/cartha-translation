  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: ta
  text: இதோ, பாலைநிலத்தின் மறுபக்கத்திலிருந்து ஒரு பெருங்காற்று[a] வந்து, வீட்டின் நான்கு மூலைகளையும் தாக்கியது. அந்த வீடு இளைஞர்கள்மேல்[b] விழுந்தது; அவர்கள் இறந்துபோனார்கள். உமக்குத் தெரிவிக்க நான் ஒருவன் மட்டுமே தப்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமையான காற்று”; “பெரும் புயற்காற்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் “இளைஞர்கள்.” இச்சொல் சில சூழல்களில் “வாலிபர்கள்” அல்லது “வேலைக்காரர்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: நிகழ்வை உயிரோட்டத்துடனும் உடனடித்தன்மையுடனும் அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: רוּחַ גְּדוֹלָה
  choice: ஒரு பெருங்காற்று
  rationale: இச்சூழலில் רוּחַ என்பது ஆவி அல்லது மூச்சு அல்ல, காற்றைக் குறிக்கிறது. பெயரடைச் சொல்லின் வலிமையையும் பேரழிவின் சூழலையும் ‘பெருங்காற்று’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: பாலைநிலத்தின் மறுபக்கத்திலிருந்து ... வந்து
  rationale: מֵעֵבֶר என்பதன் ‘மறுபக்கம்/அப்பால்’ என்ற திசை உணர்வைப் பாதுகாக்கிறது; הַמִּדְבָּר என்பதற்கு நவீன வாசகர்களுக்குப் புரியும் ‘பாலைநிலம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: வீட்டின் நான்கு மூலைகளையும் தாக்கியது
  rationale: נגע என்பதற்கு தொடுதல், எட்டுதல், தாக்குதல் ஆகிய பொருள்கள் இருக்கலாம்; அழிவை விளைவிக்கும் இச்சூழலில் ‘தாக்கியது’ பொருத்தமானது.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: அந்த வீடு இளைஞர்கள்மேல் விழுந்தது
  rationale: எபிரெயில் ஒருமை வினைச்சொல்லின் எழுவாய் வீட்டையே குறிக்கிறது. தமிழில் குழப்பமில்லாமல் இருக்க ‘அந்த வீடு’ வெளிப்படையாக மீண்டும் கூறப்பட்டுள்ளது.
- source_word: הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கும், இயல்பான நவீன தமிழ்ச் சொல். இதை ‘பிள்ளைகள்’ அல்லது ‘வேலைக்காரர்கள்’ என்று சூழலோடு ஒத்திசைத்து தீர்மானிக்கவில்லை.
- source_word: וַיָּמֻתוּ
  choice: அவர்கள் இறந்துபோனார்கள்
  rationale: காரண வினையைச் சேர்க்காமல், எபிரெயின் நேரடியான ‘அவர்கள் இறந்தார்கள்’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே தப்பினேன்
  rationale: רַק மற்றும் לְבַדִּי ஆகிய இரண்டின் வலியுறுத்தும் தனிமை உணர்வை தேவையற்ற இரட்டிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַגִּיד לָךְ
  choice: உமக்குத் தெரிவிக்க
  rationale: தூதுவனின் செய்தியறிவிப்பு மொழிநடைக்கு ஏற்ற கண்ணியமான, தெளிவான தமிழ்.
theological_decisions:
- issue: வீடு யார்மேல் விழுந்தது என்பதில் הַנְּעָרִים சொல்லின் அடையாளம்
  choice: மூலத்தில் உள்ளபடி ‘இளைஞர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: சூழலின் அடிப்படையில் ‘பிள்ளைகள்’ அல்லது ‘வேலைக்காரர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் யோபுவின் மகன்களையும் மகள்களையும் குறிப்பிடினும், இவ்வசனத்தில் உள்ள ஆண்பால் சொல்லை ஒத்திசைத்து மாற்றுவது மூலத்தின் உண்மையான சொற்பொருள் தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. யோபுவை நோக்கிய ஒருமை மரியாதைச் சுட்டாக ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நிகழ்வுகளின் வரிசை மாற்றப்படவில்லை.
