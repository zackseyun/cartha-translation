  text: וְ/הָלְכ֤וּ בָנָי/ו֙ וְ/עָשׂ֣וּ מִשְׁתֶּ֔ה בֵּ֖ית אִ֣ישׁ יוֹמ֑/וֹ וְ/שָׁלְח֗וּ וְ/קָרְאוּ֙ לִ/שְׁלֹ֣שֶׁת אחיתי/הם לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת עִמָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: ta
  text: அவருடைய மகன்கள் ஒவ்வொருவரும் தத்தமது நாளில் தம் வீட்டில் சென்று விருந்து நடத்துவது வழக்கமாக இருந்தது.[a] அவர்கள் தங்கள் மூன்று சகோதரிகளுக்குச் செய்தி அனுப்பி, தங்களுடன் உண்ணவும் குடிக்கவும் அழைப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தத்தமது நாளில்’ என்பது அவரவருக்கு நியமிக்கப்பட்ட நாளையோ, ஒருவேளை அவரவருடைய பிறந்தநாளையோ குறிக்கலாம். எபிரெயத்தில் சொற்சொல்லாக ‘அவனுடைய நாளில்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: வழக்கம்
  rationale: வசனங்கள் 4–5-இன் சூழலில் வினை வடிவம் கடந்தகாலத்தில் மீண்டும் மீண்டும் நடந்த வழக்கத்தைக் குறிக்கிறது; தமிழில் ‘வழக்கம்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை; சகோதரிகள் தனியே குறிப்பிடப்படுவதால் ‘பிள்ளைகள்’ என்பதைவிட ‘மகன்கள்’ துல்லியமானது.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: விருந்து நடத்துவது
  rationale: ‘விருந்து செய்தல்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் கொண்டாட்ட விருந்தை நடத்துதல் என வழங்குகிறது.
- source_word: בֵּית אִישׁ
  choice: ஒவ்வொருவரும் ... தங்கள் வீட்டில்
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ஒவ்வொரு மகனையும் குறிக்கிறது; தமிழ் தொடரில் ஒவ்வொருவரின் சொந்த வீடு தெளிவாகிறது.
- source_word: יוֹמוֹ
  choice: தத்தமது நாளில்
  rationale: ‘அவனுடைய நாளில்’ என்ற மூலத்தின் தெளிவின்மையைப் பாதுகாத்து, ஒவ்வொருவருக்கும் உரிய நாள் என்ற பகிர்நிலைப் பொருளையும் இயல்பாகக் காட்டுகிறது; பிறந்தநாள் என முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: ஆள் அனுப்பி அழைப்பு விடுப்பார்கள்
  rationale: செய்தி அனுப்புதலும் அழைத்தலும் ஆகிய இரு வினைகளையும் தமிழில் இயல்பான இணைச்சொற்றொடராகப் பாதுகாக்கிறது.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: தங்கள் மூன்று சகோதரிகளுக்கும்
  rationale: எண்ணிக்கையையும், அவர்கள் இவர்களுடைய சகோதரிகள் என்பதையும் நேரடியாகக் காட்டுகிறது.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: உண்டு குடிப்பதற்காக
  rationale: விருந்தில் பங்கேற்பதைக் குறிக்கும் இரட்டை இறந்தநிலை வினைகளை இயல்பான தமிழில் அளிக்கிறது.
- source_word: עִמָּהֶם
  choice: தங்களோடு
  rationale: சகோதரர்கள் உடனிருந்து பகிர்ந்து உண்ணுவதையும் குடிப்பதையும் குறிக்கிறது.
theological_decisions:
- issue: יוֹמוֹ என்பதன் பொருள்
  choice: தத்தமது நாளில்
  alternative: தத்தமது பிறந்தநாளில் / அவரவருக்கு நியமிக்கப்பட்ட நாளில்
  rationale: எபிரெயம் வெறுமனே ‘அவனுடைய நாள்’ எனக் கூறுகிறது. அது விருந்துச் சுழற்சியில் அவரவருக்குரிய நாளையோ பிறந்தநாளையோ குறிக்கலாம்; முதன்மை உரை இந்தத் தெளிவின்மையைத் தீர்க்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடந்தகால வழக்கச் செயலை ‘வழக்கம்’ மற்றும் ‘விடுப்பார்கள்’ காட்டுகின்றன. ‘தத்தமது நாளில்’ மூலத்தின் உண்மையான பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
