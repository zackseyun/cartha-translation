base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: ta
  text: ஊஸ் நாட்டில் யோபு என்ற பெயருடைய ஒரு மனிதர் இருந்தார். அந்த மனிதர் பழிக்கிடமற்றவரும் நேர்மையானவரும், கடவுளுக்குப் பயந்தவரும் தீமையை விட்டு விலகியவருமாய் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீமையைத் தவிர்ப்பவருமாய்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை தீமையிலிருந்து விலகுதல், அதை விட்டுச் செல்லுதல் அல்லது தவிர்த்தல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: ஒரு மனிதர் இருந்தார்
  rationale: எபிரேயக் கதையின் எளிய அறிமுக அமைப்பையும், குறிப்பிடப்படுவது ஓர் ஆண் என்பதையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְאֶרֶץ עוּץ
  choice: ஊத்ஸ் நாட்டில்
  rationale: אֶרֶץ இங்கு புவியியல் பகுதியைக் குறிக்கிறது; עוּץ என்ற இடப்பெயர் தமிழ் ஒலிபெயர்ப்பாகத் தரப்படுகிறது.
- source_word: אִיּוֹב שְׁמוֹ
  choice: யோபு என்ற பெயருடைய
  rationale: பெயரை அடையாளப்படுத்தும் எபிரேய உட்பொருளைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: תָּם
  choice: குற்றமற்றவர்
  rationale: முழுமையான பாவமின்மையை வற்புறுத்தாமல், ஒழுக்க நேர்மையும் பழிக்கிடமின்மையும் கொண்டவர் என்ற ஞானநூல் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יָשָׁר
  choice: நேர்மையானவர்
  rationale: நெறிசார் செம்மையையும் ஒழுக்க நேர்மையையும் தெளிவான பொதுத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וִירֵא אֱלֹהִים
  choice: கடவுளுக்குப் பயந்து
  rationale: பீதியை மட்டும் அல்லாமல் பயபக்தியுடன் வாழ்வதைக் குறிக்கும் வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது; אֱלֹהִים இச்சூழலில் ஒருமை அர்த்தமுடையது.
- source_word: וְסָר מֵרָע
  choice: தீமையை விட்டு விலகுகிறவர்
  rationale: தீமையிலிருந்து திரும்புதல், அதைத் தவிர்த்தல் ஆகிய எபிரேய வினையின் செயற்பாட்டுத் தன்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோபுவின் ஒழுக்கப் பண்பின் பொருள்
  choice: அவர் பழிக்கிடமற்ற ஒழுக்க ஒருமைப்பாடும் நேர்மையும் கொண்டவர் என விவரிக்கப்படுகிறார்.
  alternative: அவர் முற்றிலும் பாவமற்றவர் அல்லது அறநிலையில் முழுமையானவர்.
  rationale: תָּם மற்றும் יָשָׁר ஆகிய சொற்கள் வலுவான ஒழுக்கப் பாராட்டைக் கொடுத்தாலும், முழுமையான பாவமின்மையை அவசியமாகக் குறிக்கவில்லை.
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: சொல் வடிவத்தில் பன்மையாக இருந்தாலும், இங்குள்ள சொற்றொடரும் கதையின் சூழலும் ஒருமையான கடவுளையே சுட்டுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் யோபுவை இயல்பாகக் குறிப்பிடுகின்றன. இறையியல் மரபுசார் தனிப்பட்ட விளக்கங்களைச் சேர்க்காமல், மூலத்தின் ஒழுக்கப் பாராட்டும் சொற்பொருள் நுட்பமும் பாதுகாக்கப்பட்டுள்ளன.
