  source_fidelity: 'மூல எபிரெய வினைத் தொடரின் எல்லாச் செயல்களும் துல்லியமாக உள்ளன: யோபு எழுந்தான், மேலங்கியைக் கிழித்தான், தலையை மழித்தான், தரையில் விழுந்தான், வணங்கினான். “தரையில் விழுந்து வணங்கினான்” என்பது וַיִּפֹּל אַרְצָה மற்றும் וַיִּשְׁתָּחוּ ஆகிய தனித்த செயல்களைத் தெளிவாகவும் மூலத்துக்கு மீறி ‘வழிபட்டான்’ என்று வெளிப்படுத்தாமலும் தருகிறது.'
