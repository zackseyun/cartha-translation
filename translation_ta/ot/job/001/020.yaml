base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: ta
  text: அப்போது யோபு எழுந்து, தன் மேலங்கியைக் கிழித்து, தன் தலையை மழித்துக்கொண்டான்; பின்பு தரையில் விழுந்து வணங்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னைத் தரையில் தாழ்த்திக்கொண்டான்.’ எபிரெய வினை உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கும்; அது பெரும்பாலும் மரியாதை அல்லது வழிபாட்டின் செயலாக அமைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்ற வினையின் தொடர்நிகழ்வு வடிவம் அடுத்த செயலைக் குறிக்கிறது; ‘எழுந்து’ என்பது இயல்பான தமிழ் கதைநடைச் சொல்.
- source_word: מְעִילוֹ
  choice: தன் மேலங்கியை
  rationale: מְעִיל என்பது பொதுவாக வெளியில் அணியும் முக்கியமான ஆடையைக் குறிக்கிறது; ‘மேலங்கி’ அதன் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: தன் மேலங்கியைக் கிழித்து
  rationale: துக்கத்தின் அடையாளமாக ஆடையைக் கிழிக்கும் நேரடியான செயலை קרע குறிக்கிறது; ‘கிழித்து’ என்பது தெளிவான, வழக்கிலுள்ள சொல்.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: தன் தலையை மழித்துக்கொண்டான்
  rationale: גזז என்பது முடியை வெட்டுதல் அல்லது மழித்தலைக் குறிக்கலாம். இத்துக்கச் சூழலில் ‘தலையை மழித்துக்கொண்டான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּפֹּל אַרְצָה
  choice: தரையில் விழுந்து
  rationale: אַרְצָה என்ற திசை வடிவம் தரையை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘தரையில் விழுந்து’ அதைச் சுருக்கமாகத் தருகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: வணங்கினான்
  rationale: שׁחה என்பதன் இவ்வடிவம் உடலைத் தாழ்த்திப் பணிதல் அல்லது வணங்குதலைக் குறிக்கும்; சூழலில் இறைநோக்கிய மரியாதை இருந்தாலும், ‘வணங்கினான்’ உடல் செயலும் வழிபாட்டு நுண்ணுணர்வும் இரண்டையும் வைத்திருக்கிறது.
theological_decisions:
- issue: யோபின் இறுதிச் செயலை வெறும் உடல் பணிவாகக் காட்டுவதா அல்லது வெளிப்படையான வழிபாடாகக் காட்டுவதா
  choice: வணங்கினான்
  alternative: பணிந்து விழுந்தான்; வழிபட்டான்
  rationale: எபிரெய வினை உடலைத் தாழ்த்தும் செயலை முதன்மையாகக் குறித்தாலும், அது மரியாதை அல்லது வழிபாட்டுச் சூழலில் அடிக்கடி வருகிறது. அடுத்த வசனத்தின் தேவனை நோக்கிய உரை இங்கு வழிபாட்டு நுண்ணுணர்வை ஆதரிக்கிறது; இருப்பினும் ‘வழிபட்டான்’ என்று மட்டும் மொழிபெயர்த்து உடல் செயலை மறைக்காமல், ‘தரையில் விழுந்து வணங்கினான்’ என இரு பரிமாணங்களும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் கதைநடை பயன்படுத்தப்பட்டுள்ளது. துக்கச் செயல்களின் தொடர்ச்சி தெளிவாக இருக்க அரைப்புள்ளி சேர்க்கப்பட்டுள்ளது; மூலத்தின் வினைத் தொடரும் பாதுகாக்கப்பட்டுள்ளது.
