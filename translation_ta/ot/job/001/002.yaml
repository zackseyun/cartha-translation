  language: ta
  text: அவனுக்கு ஏழு மகன்களும் மூன்று மகள்களும் பிறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: பிறந்தார்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவம் பிறத்தலைச் செயல்பாட்டு காரணத்தை வலியுறுத்தாமல் நிகழ்வாகக் கூறுகிறது. தமிழில் மனிதர்களைக் குறிக்கும் இயல்பான மரியாதைப் பன்மையுடன் “பிறந்தார்கள்” என வழங்கப்பட்டுள்ளது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: לְ முன்னொட்டுடன் வந்த மூன்றாம் நபர் ஆண்பால் ஒருமை உருபு, இப்பிறப்பு வாய்பாட்டில் பெற்றோர் உறவைச் சுட்டுகிறது; “அவனுக்கு” என்பது தமிழில் இயல்பானதும் துல்லியமானதும்.
- source_word: שִׁבְעָה בָנִים
  choice: ஏழு மகன்கள்
  rationale: ஆண் பிள்ளைகளைக் குறிக்கும் בָנִים என்பதன் பாலினத் தகவலை “மகன்கள்” தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: மூன்று மகள்கள்
  rationale: וְ இணைப்பைத் தமிழின் “-உம்” ஒருங்கிணைப்பு வெளிப்படுத்துகிறது; בָּנוֹת குறிக்கும் பெண் பிள்ளைகள் “மகள்கள்” எனத் துல்லியமாக வழங்கப்பட்டுள்ளனர்.
