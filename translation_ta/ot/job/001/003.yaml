  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: ta
  text: 'அவனுடைய கால்நடைகள்: ஏழாயிரம் செம்மறியாடுகள், மூவாயிரம் ஒட்டகங்கள், ஐந்நூறு ஜோடி ஏர் மாடுகள், ஐந்நூறு பெண் கழுதைகள், மிகப் பெரும் பணியாளர் கூட்டம் ஆகியவை இருந்தன. அந்த மனிதன் கிழக்கத்திய மக்கள் அனைவரிலும் மிகப் பெரியவனாக இருந்தான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: அவனுக்கு ... இருந்தன
  rationale: இச்சொல் உடைமையான கால்நடைகளைக் குறிக்கிறது; தொடர்ந்து வரும் பட்டியலைத் தமிழில் இயல்பாக அறிமுகப்படுத்த உடைமைக் கட்டமைப்பு பயன்படுத்தப்பட்டது.
- source_word: צֹאן
  choice: செம்மறியாடுகள்
  rationale: צֹאן ஆடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடும்; இங்கு எண்ணப்பட்ட மந்தையைக் குறிக்கும் வழக்கமான பொருளாக ‘செம்மறியாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גְמַלִּים
  choice: ஒட்டகங்கள்
  rationale: நேரடியான தமிழ்ச் சமமான சொல்.
- source_word: צֶמֶד בָּקָר
  choice: ஏர் மாடுகள்
  rationale: צֶמֶד என்பது இணையாகப் பூட்டப்படும் ஜோடியைக் குறிக்கிறது; בָּקָר உடன் சேர்ந்து உழவுக்குப் பயன்படுத்தப்படும் மாட்டு ஜோடிகளைக் குறிக்கும். தமிழ் வேளாண் வழக்கில் ‘ஏர் மாடுகள்’ அந்தச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; எண்ணிக்கை ஐந்நூறு ஜோடிகளைக் குறிக்கிறது.
- source_word: אֲתוֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் பெண்பாலைக் குறிப்பாகக் காட்டுவதால் அது தமிழிலும் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: மிகப் பெரிய பணியாளர் கூட்டம்
  rationale: இத்தொடர் மிகுதியான வேலை/சேவையையோ, அதனைச் செய்யும் பெரும் பணியாளர் அமைப்பையோ குறிக்கலாம். சூழலில் யோபுவின் பெரிய உடைமை நிர்வாகத்துடன் தொடர்புடைய பணியாளர் கூட்டம் இயல்பான பொருள்; ‘வீட்டார்’ எனக் கூறி குடும்பத்தையும் சேர்த்துவிடுவது தவிர்க்கப்பட்டது.
- source_word: גָּדוֹל מִכָּל
  choice: அனைவரிலும் மிகப் பெரியவன்
  rationale: ஒப்பீட்டுக் கட்டமைப்பு மற்ற எல்லாரையும் விஞ்சிய செல்வம், செல்வாக்கு, உயர்நிலை ஆகியவற்றைக் குறிக்கிறது; மூலத்தின் பரந்த பொருளை ‘பெரியவன்’ பாதுகாக்கிறது.
- source_word: בְּנֵי קֶדֶם
  choice: கிழக்கத்திய மக்கள்
  rationale: சொல்லுக்கு சொல் ‘கிழக்கின் மகன்கள்’ என்றாலும், இது கிழக்குப் பகுதி மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் ‘கிழக்கத்திய மக்கள்’ இயல்பாகவும் பிரதிநிதித்துவப் பொருளுடனும் உள்ளது.
theological_decisions:
- issue: בְּנֵי קֶדֶם என்ற மரபுத்தொடரின் பாலினமும் புவியியல் பொருளும்
  choice: கிழக்கத்திய மக்கள்
  alternative: கிழக்கின் மகன்கள்
  rationale: இது ஆண் பிள்ளைகளை மட்டும் குறிப்பிடுவதல்ல; ஒரு பிராந்திய மக்களைக் குறிக்கும் மரபுத்தொடர். தமிழில் சொல்லுருவை அப்படியே வைத்தால் தவறான குறுகிய பொருள் தோன்றக்கூடும் என்பதால் நோக்கப்பட்ட கூட்டுப் பொருள் வழங்கப்பட்டது.
- issue: גָּדוֹל என்பதன் பரந்த மதிப்பீடு
  choice: மிகப் பெரியவன்
  alternative: மிகச் செல்வந்தன் / மிகச் சிறந்தவன்
  rationale: சூழல் செல்வத்தையும் சமூக மேன்மையையும் சுட்டினாலும், எபிரெயச் சொல் அவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்கவில்லை. ஆகவே அதன் திட்டமிட்ட பரப்பு பாதுகாக்கப்பட்டது.
- issue: עֲבֻדָּה என்பதன் குறிப்பு
  choice: பணியாளர் கூட்டம்
  alternative: மிகுதியான வேலை / மிகப் பெரிய வீட்டார்
  rationale: இங்கு பெரும் பண்ணை உடைமைகளைச் செயல்படுத்திய சேவை அமைப்பு அல்லது பணியாளர்களைச் சுட்டும் பொருள் பொருத்தமானது. எனினும் ‘வேலை/சேவை’ என்ற சொற்பொருளின் சிறிய தெளிவின்மை இருப்பதை மொழிபெயர்ப்பு முழுமையாக நீக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, வாசிக்க எளிய நடை. விலங்குப் பட்டியலின் தாளம் காக்கப்பட்டது. ‘ஏர் மாடுகள்’ தமிழில் இயல்பான வேளாண் சொல்; அது ஐந்நூறு ஜோடிகள் என்ற மூலப் பொருளை வாசகர் தெளிவாக அறிய வேண்டுமானால் பதிப்பாசிரியர் ‘ஐந்நூறு ஜோடி ஏர் மாடுகள்’ என வெளிப்படுத்தலாம். இவ்வடிவில் அடிக்குறிப்புகள் இல்லை.
