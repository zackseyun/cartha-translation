- from: அவனுக்கு ஏழாயிரம் செம்மறியாடுகளும், மூவாயிரம் ஒட்டகங்களும், ஐந்நூறு ஏர் மாடுகளும், ஐந்நூறு பெண் கழுதைகளும், மிகப் பெரிய பணியாளர் கூட்டமும் இருந்தன. அந்த மனிதன் கிழக்கத்திய மக்கள் அனைவரிலும் மிகப் பெரியவனாக இருந்தான்.
