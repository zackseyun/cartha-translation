  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: ta
  text: அப்போது யாவே எதிராளியிடம்[a], “நீ எங்கிருந்து வருகிறாய்?” என்று கேட்டார். அதற்கு எதிராளி யாவேக்குப் பதிலளித்து, “பூமியில் சுற்றித் திரிந்து, அதில் அங்குமிங்கும் நடந்து வருகிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “அந்தச் சாத்தான்.” இங்கு இச்சொல் நிர்ணய உருபுடன் வந்து, தனிப்பட்ட பெயராக அல்லாமல் “எதிராளி” என்ற பட்டம் அல்லது பங்காகச் செயல்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் வெளிப்படுத்தப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: הַשָּׂטָן
  choice: எதிராளி
  rationale: முன்னொட்டாகத் தெளிவான சுட்டுச் சொல் இருப்பதால், இங்கு இது தனிப்பட்ட பெயராக அல்லாமல் ஒரு பங்கு அல்லது பட்டமாகச் செயல்படுகிறது; ‘எதிராளி’ அதன் பரந்த எதிர்ப்பு சார்ந்த பொருளைக் காட்டுகிறது.
- source_word: מֵאַיִן תָּבֹא
  choice: நீ எங்கிருந்து வருகிறாய்?
  rationale: வருகையின் தொடக்க இடத்தை வினவும் இயல்பான நவீனத் தமிழ் உரையாடல் வடிவம்.
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: கதை உரையாடலில் வரும் ‘பதில் சொன்னான்’ என்ற அடிப்படைப் பொருளை முறையான, இயல்பான தமிழில் தருகிறது.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: பூமியில் சுற்றித் திரிந்துவிட்டு
  rationale: שׁוט என்பதிலுள்ள அங்குமிங்கும் உலவும் இயக்கத்தையும், בּ preposition குறிக்கும் இடவெளியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: அதில் அங்குமிங்கும் நடந்துவிட்டு
  rationale: התהלך என்பதிலுள்ள தொடர்ந்து அல்லது பல திசைகளில் நடமாடும் நுணுக்கத்தைத் தக்கவைக்கிறது; ‘காவல் சுற்றுதல்’ போன்ற கூடுதல் விளக்கத்தைப் புகுத்தவில்லை.
theological_decisions:
- issue: הַשָּׂטָן என்பதைத் தனிப்பட்ட பெயராகவா, பட்டம்/பங்காகவா எடுத்துக்கொள்வது
  choice: 'பட்டம்/பங்கு: “எதிராளி”'
  alternative: 'தனிப்பட்ட பெயர்: “சாத்தான்”; வடிவத்திற்கு நெருக்கமானது: “அந்தச் சாத்தான்”'
  rationale: எபிரெயத்தில் definite article இடம்பெறுவது, இந்தச் சூழலில் சொல்லை ஒரு பெயரைவிடப் பட்டம் அல்லது பங்காகப் புரிந்துகொள்வதற்கு வலுவான ஆதாரமாகிறது. பிற்காலத்தில் நிலைபெற்ற பெயர்சார் பயன்பாட்டை இவ்வசனத்திற்குள் முன்கூட்டியே கொண்டுவராமல் இருக்க ‘எதிராளி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான கதைநடை. எபிரெய உரையின் உரையாடல் அமைப்பு தக்கவைக்கப்பட்டாலும், தமிழில் இயல்பற்ற ‘பதிலளித்துச் சொன்னான்’ என்ற இரட்டிப்பு தவிர்க்கப்பட்டது. இறுதி பதில், முன் நடந்த செயல்களிலிருந்து தற்போதைய வருகையை இயல்பாக இணைக்க ‘திரிந்துவிட்டு... நடந்துவிட்டு வருகிறேன்’ என அமைக்கப்பட்டது.
