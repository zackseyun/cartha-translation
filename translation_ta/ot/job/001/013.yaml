  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: ta
  text: ஒரு நாள், அவனுடைய மகன்களும் மகள்களும் தங்கள் மூத்த சகோதரனின்[a] வீட்டில் உணவு உண்டும் திராட்சரசம் குடித்துக்கொண்டும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் முதற்பிறந்த சகோதரனின்.”
    reason: ‘மூத்த’ என்று மொழிபெயர்க்கப்பட்ட הַבְּכוֹר என்ற எபிரெயச் சொல் சொல்லுக்கு நெருக்கமாக ‘முதற்பிறந்த’ என்றும் பொருள்படும்.
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ஒரு நாள்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒரு புதிய நிகழ்வுக் காட்சியை அறிமுகப்படுத்தும் வழக்குச் சொல்லாக இங்கு வருகிறது. ‘ஒரு நாள்’ என்பது அதன் காலப் பின்னணி அமைக்கும் பணியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: அவனுடைய மகன்களும் மகள்களும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக இரண்டையும் வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: சாப்பிட்டுத் ... குடித்துக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினைகள் நடந்துகொண்டிருந்த செயலைச் சித்தரிக்கின்றன. தமிழ் தொடர்நிலை வினை அந்தக் காட்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: יין என்பதற்கான தெளிவான, வழக்கமான வேதாகமத் தமிழ் இணை; பானத்தின் தன்மையைப் பொதுமைப்படுத்தாமல் தருகிறது.
- source_word: בְּבֵית אֲחִיהֶם
  choice: தங்கள் ... சகோதரனின் வீட்டில்
  rationale: இடத்தையும் குடும்ப உறவையும் நேரடியாகத் தருகிறது. எழுவாய் பலரைக் குறிப்பதால் ‘தங்கள்’ என்பது இயல்பான தற்சுட்டுப் பெயராகும்.
- source_word: הַבְּכוֹר
  choice: மூத்த
  rationale: குடும்பத்தின் பிறப்பு வரிசையில் முதல்வனான சகோதரனை இயல்பான நவீனத் தமிழில் அடையாளப்படுத்துகிறது; சொல்லுக்கு நெருக்கமான ‘முதற்பேறான’ என்பது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
