source:
  edition: WLC
  text: וּ/מַלְאָ֛ךְ בָּ֥א אֶל אִיּ֖וֹב וַ/יֹּאמַ֑ר הַ/בָּקָר֙ הָי֣וּ חֹֽרְשׁ֔וֹת וְ/הָ/אֲתֹנ֖וֹת רֹע֥וֹת עַל יְדֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: ta
  text: ஒரு தூதுவன் யோபிடம் வந்து, “மாடுகள் உழுதுகொண்டிருந்தன; கழுதைகள்[a] அவற்றின் அருகே மேய்ந்துகொண்டிருந்தன,” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பெண் கழுதைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: ஒரு தூதுவன்
  rationale: מַלְאָךְ என்பது சூழலுக்கேற்ப மனிதத் தூதுவனையோ தேவதூதனையோ குறிக்கலாம். இங்கு பேரழிவை அறிவிக்க வரும் மனிதனைக் குறிப்பதால் ‘தூதுவன்’ பொருத்தமானது; வாக்கியத் தொடக்கத்தில் וּ-வைத் தனியே ‘மேலும்’ என மொழிபெயர்ப்பது இயல்பான தமிழ் நடைக்கு அவசியமில்லை.
- source_word: בָּא אֶל אִיּוֹב
  choice: யோபிடம் வந்து
  rationale: בוא மற்றும் אֶל இணைந்து யோபை நோக்கி வந்து சேர்ந்ததைக் குறிக்கின்றன; ‘யோபிடம் வந்து’ இயல்பான நவீனத் தமிழ்.
- source_word: וַיֹּאמַר
  choice: என்று கூறினான்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையைத் தமிழில் இயல்பான நேர்கூற்று அமைப்பாக வழங்குகிறது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר பொதுவாக மாட்டினத்தைக் குறிக்கிறது. உழும் சூழல் அவை வேலைக்குப் பயன்படுத்தப்பட்ட மாடுகள் என்பதைத் தெளிவாக்குவதால், பாலினத்தைத் தேவையின்றிக் குறிப்பாக்கும் ‘எருதுகள்’ என்பதற்குப் பதில் ‘மாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: உழுதுகொண்டிருந்தன
  rationale: கடந்தகாலத்தில் தொடர்ந்து நடைபெற்ற செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהָאֲתֹנוֹת
  choice: கழுதைகள்[a]
  rationale: אֲתֹנוֹת என்பது குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது. தமிழ் முதன்மை உரையில் ‘கழுதைகள்’ இயல்பாக இருப்பதால், பாலினத் துல்லியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֹעֹות
  choice: மேய்ந்துகொண்டிருந்தன
  rationale: רעה இங்கு விலங்குகள் புல் மேய்வதைக் குறிக்கிறது; தொடர்ந்த செயலைத் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: עַל יְדֵיהֶם
  choice: அவற்றின் அருகே
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவற்றின் கைகளருகே’ என்றாலும், இச்சொற்றொடர் இங்கு இடவியல் அண்மையைக் குறிக்கிறது; ‘அவற்றின் அருகே’ பொருளை இயல்பாகத் தருகிறது.
