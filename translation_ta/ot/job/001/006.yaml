base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: ta
  text: ஒரு நாள், கடவுளின் மகன்கள்[a] யாவேக்கு முன்பாக நிற்க வந்தார்கள்; எதிராளியும்[b] அவர்களிடையே வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் மகன்கள்” என்பது வானுலக அரசவையைச் சேர்ந்த உயிர்களைக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: மரபாக, “சாத்தான்” என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயத்தில் “எதிராளி” என்ற சொல்லுக்கு முன் நிர்ணயச் சுட்டுச்சொல் உள்ளது; ஆகவே அது இங்கு தனிப்பெயரைக் காட்டிலும் ஒரு பட்டமாகவோ பங்காகவோ செயல்படக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ஒரு நாள்
  rationale: இது புதிய நிகழ்வுக் காட்சியை அறிமுகப்படுத்தும் எபிரெயக் கதைநடைச் சொற்றொடர். ‘ஒரு நாள்’ என்பது இயல்பான நவீனத் தமிழில் அதன் காலச்சூழல் அறிமுகப் பணியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: கடவுளின் மகன்கள்
  rationale: எபிரெயச் சொல்லாட்சியையும் அதன் உருவக மற்றும் இறையியல் தெளிவின்மையையும் நேரடியாகப் பாதுகாக்கிறது; ‘வானுலக உயிர்கள்’ என்று பொருளை முன்கூட்டியே விளக்கவில்லை.
- source_word: לְהִתְיַצֵּב
  choice: தங்களை முன்னிறுத்த
  rationale: மேலான ஒருவரின் முன்னிலையில் வந்து ஆஜராகுதல் என்ற இச்சூழலின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இந்த வினையுடன் עַל என்பது ஒருவரின் முன்னிலையில் ஆஜராவதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை அதன் எபிரெய வடிவுக்கு நெருக்கமான, தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַשָּׂטָן
  choice: எதிராளி
  rationale: திட்டவட்டச் சுட்டுடன் வரும் எபிரெயச் சொல் இங்கு தனிப்பெயராக மட்டுமல்லாமல் ஒரு பட்டம் அல்லது பங்கைக் குறிக்கக்கூடும்; ‘எதிராளி’ அதன் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּתוֹכָם
  choice: அவர்களிடையே
  rationale: அந்தக் குழுவின் நடுவில் அல்லது அவர்களோடு வந்தான் என்ற பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: הַשָּׂטָן என்பதைத் தனிப்பெயராகவா, பட்டமாகவா மொழிபெயர்ப்பது
  choice: எதிராளி
  alternative: சாத்தான்; குற்றஞ்சாட்டுபவன்
  rationale: எபிரெயத்தில் திட்டவட்டச் சுட்டு இருப்பதால், இங்கு அது உறுதியாக நிலைபெற்ற தனிப்பெயர் என்பதைக் காட்டிலும் ஒரு பங்கு அல்லது பட்டமாக இருக்கலாம். மரபான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּנֵי הָאֱלֹהִים என்பதை விளக்கமாகவா, வடிவுக்கு நெருக்கமாகவா மொழிபெயர்ப்பது
  choice: கடவுளின் மகன்கள்
  alternative: வானுலக உயிர்கள்; தெய்வீக உயிர்கள்
  rationale: இது வானுலக அரசவையைச் சேர்ந்த உயிர்களைக் குறிக்கக்கூடும்; எனினும் மூலமொழியின் உருவகத்தையும் தெளிவின்மையையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணைப்பு அமைப்பு அரைப்புள்ளியால் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பிறகு வைக்கப்பட்டுள்ளன.
