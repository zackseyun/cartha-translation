  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: ta
  text: ஆனால், தயவுசெய்து உமது கையை நீட்டி, அவனுக்கு உரிய அனைத்தையும் தொடும்; அவன் நிச்சயமாக உமது முகத்துக்கு நேராக உம்மைச் சபிப்பான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “உம்மை ஆசீர்வதிப்பான்.” யோபு நூலின் முன்னுரையில் இது “உம்மைச் சபிப்பான்” என்பதற்குப் பதிலாக, மரியாதைக் காரணமாகப் பயன்படுத்தப்பட்ட மறைமுகச் சொல்லாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய கூற்றை வலுவாக மறுத்து எதிர்மறையான சவாலைத் தொடங்கும் இணைப்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: שְׁלַח נָא יָדְךָ
  choice: தயவுசெய்து உமது கையை நீட்டி
  rationale: செயலில் அதிகாரத்தைச் செலுத்துவதைக் குறிக்கும் எபிரேயக் கை உருவகத்தைப் பாதுகாக்கிறது; נָא என்பதன் வேண்டுகோள் அல்லது சவால் நயத்தை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: וְגַע
  choice: தொட்டுப் பாரும்
  rationale: נגע என்பதன் அடிப்படைப் பொருளான ‘தொடு’ என்பதைப் பாதுகாக்கிறது; இச்சூழலில் தீங்கு விளைவிக்கும் செயலைச் சவாலாக முன்வைக்கும் நயத்தை ‘பாரும்’ இயல்பாக உணர்த்துகிறது.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: அவனுக்குள்ள எல்லாவற்றையும்
  rationale: யோபுக்குச் சொந்தமான உடைமைகள் அனைத்தையும் குறிக்கும் எபிரேயச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִם לֹא
  choice: நிச்சயமாக
  rationale: இது எளிய நிபந்தனையாக அல்லாமல், சத்தியவாக்கு போன்ற உறுதியூட்டும் மரபுத்தொடராகச் செயல்படுவதால் அதன் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: עַל פָּנֶיךָ
  choice: உமது முகத்துக்கு நேராகவே
  rationale: மறைவின்றி நேரடியாக எதிர்ப்பதைக் குறிக்கும் எபிரேய உருவகத்தையும் அதன் வலியுறுத்தலையும் பாதுகாக்கிறது.
- source_word: יְבָרֲכֶךָּ
  choice: உம்மைச் சபிப்பான்
  rationale: ברך என்பதன் வழக்கமான பொருள் ‘ஆசீர்வதி’ என்றாலும், யோபு நூலின் முன்னுரையில் இது மரியாதை காரணமான மாற்றுச்சொல்லாக ‘சபி’ என்ற பொருளில் பயன்படுகிறது; சூழலின் தெளிவான கருத்தை முதன்மை உரையில் தருகிறது.
theological_decisions:
- issue: யோபு நூலின் முன்னுரையில் ברך என்பதன் நயக்குறிப்பான பயன்பாடு
  choice: முதன்மை உரையில் ‘உம்மைச் சபிப்பான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உம்மை ஆசீர்வதிப்பான்’ என்ற சொற்பொருள் மொழிபெயர்ப்பு
  rationale: 'சாத்தானின் கூற்று எதிர்மறையானது: துன்பம் வந்தால் யோபு கடவுளை வெளிப்படையாக மறுதலிப்பான் என்பதே குற்றச்சாட்டு. ஆகவே சூழல்பொருளை முதன்மை உரையில் தருவதோடு, எபிரேயச் சொல்லின் நேரடிப் பொருளை அடிக்குறிப்பில் வைத்து உள்ளார்ந்த சொல் நயத்தையும் வெளிப்படைத்தன்மையையும் பாதுகாக்கிறது.'
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது,’ ‘உம்மை,’ ‘பாரும்’ ஆகியவை எபிரேய ஒருமையைப் பேணுகின்றன. மூலத்தின் ‘கை’ மற்றும் ‘முகத்துக்கு நேராக’ என்ற உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன.
