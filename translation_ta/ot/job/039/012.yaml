source:
  edition: WLC
  text: הֲ/תַאֲמִ֣ין בּ֭/וֹ כִּי ישוב זַרְעֶ֑/ךָ וְֽ/גָרְנְ/ךָ֥ יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: ta
  text: அது உன் தானியத்தைத் திரும்பக் கொண்டுவந்து, அதை உன் கதிரடிக்கும் களத்தில் சேர்க்கும் என்று அதை நம்புவாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “உன் விதை”; இச்சூழலில் இது வயலிலிருந்து கொண்டுவரப்படும் அறுவடைத் தானியத்தை அல்லது விளைச்சலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין בּוֹ
  choice: அதை நம்புவாயா?
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு காட்டெருதை நடைமுறையில் நம்பிச் சார்ந்திருக்க முடியுமா என்று கேட்கிறது. தமிழில் விலங்கைக் குறிக்க இயல்பான ஒருமைச் சுட்டுப்பெயரான ‘அது/அதை’ பயன்படுத்தப்பட்டது.
- source_word: כִּי
  choice: என்று
  rationale: நம்பிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது; தமிழில் ‘என்று’ இயல்பான இணைப்பு.
- source_word: יָשׁוּב
  choice: கொண்டுவந்து
  rationale: שׁוב அடிப்படையில் ‘திரும்புதல்’ எனப் பொருள்பட்டாலும், זרעך என்பதைச் செயப்படுபொருளாகக் கொண்ட இச்சூழலில் வயலிலிருந்து தானியத்தைக் கொண்டுவருதல் என்ற விளைபொருள் தெளிவாகிறது. தமிழில் தேவையற்ற ‘திரும்ப’ என்பதைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: זַרְעֶךָ
  choice: உன் தானியத்தை
  rationale: சொல்லின் நேரடிப் பொருள் ‘உன் விதை’; அறுவடைச் சூழலில் அது விதைக்கப்பட்ட பயிரிலிருந்து கிடைக்கும் தானியம் அல்லது விளைச்சலைக் குறிக்கலாம். வாசகத் தெளிவுக்காக ‘தானியம்’ தேர்ந்தெடுக்கப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: גָרְנְךָ
  choice: உன் களத்துமேட்டில்
  rationale: גֹּרֶן என்பது களஞ்சியமோ சேமிப்புக் கட்டிடமோ அல்ல; தானியம் போரடிக்கும் அல்லது சூடடிக்கும் களம். அதற்குரிய சுருக்கமான தமிழ் வேளாண்மைச் சொல் ‘களத்துமேடு’.
- source_word: יֶאֱסֹף
  choice: சேர்க்கும்
  rationale: אָסַף என்பது சேகரித்தல் அல்லது ஒன்றுசேர்த்தல். முந்தைய ‘தானியம்’ இதன் மறைமுகச் செயப்படுபொருளாகத் தமிழில் இயல்பாகப் புரிகிறது.
