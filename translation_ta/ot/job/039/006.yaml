- source_word: אֲשֶׁר
  choice: அதற்கு
  rationale: முந்தைய வசனத்திலுள்ள காட்டுக் கழுதையைச் சுட்டும் தொடர்புச் சொல்லின் பொருளைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: שַׂמְתִּי
  choice: நான் அமைத்தேன்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருளான ‘வைத்தல்/அமைத்தல்’ என்பதைக் காத்து, கடவுள் அதற்குரிய வாழிடத்தை நியமித்த கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲרָבָה
  choice: பாழ்நிலம்
  rationale: வறண்ட, வெட்டவெளியான பாலைவனப் புல்வெளியைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் புரியக்கூடிய பொதுவான இணை.
- source_word: בֵיתוֹ
  choice: வீடாக
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘அதன் வீடு’ என்ற உருவகத்தைக் காத்து, שַׂמְתִּי உடன் தமிழில் தேவையான ‘ஆக’ உறவை வெளிப்படுத்துகிறது.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: அதன் குடியிருப்புகளாக
  rationale: மூலத்தின் பன்மை வடிவத்தைத் தமிழிலும் காத்து, கவிதைநடையிலுள்ள பரந்த வாழிட உணர்வைச் சுருக்காமல் விடுகிறது.
- source_word: מְלֵחָה
  choice: உவர்நிலம்
  rationale: உப்புப் படிந்த, வளமற்ற நிலத்தைக் குறிக்கும் செறிவானதும் இயல்பானதுமான தமிழ்ச் சொல்.
