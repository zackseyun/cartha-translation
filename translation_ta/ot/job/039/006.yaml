  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: ta
  text: அதன் வீட்டாகப் பாழ்நிலத்தையும்[a], அதன் குடியிருப்புகளாக உவர்நிலத்தையும்[b][c] நான் வைத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாழ்நிலம்’ என்பதற்கு ‘வனாந்தரம்’ அல்லது ‘வறண்ட வெட்டவெளி’ என்றும் மொழிபெயர்க்கலாம் (עֲרָבָה).
    reason: lexical_alternative
  - marker: b
    text: ‘உவர்நிலம்’ என்பதற்கு ‘உப்புநிலம்’ அல்லது ‘உப்புப் பாழ்வெளி’ என்றும் மொழிபெயர்க்கலாம் (מְלֵחָה).
    reason: lexical_alternative
  - marker: c
    text: ‘குடியிருப்புகள்’ என்பது எபிரெயத்தில் பன்மை; இது கவிதைநடையில் ஒரு வாழிடத்தை வலியுறுத்தும் பன்மையாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
