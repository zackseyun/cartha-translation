translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான நேரடி வினா வடிவம் பயன்படுத்தப்பட்டது. ‘உழுசால்’ மற்றும் ‘பரம்படித்தல்’ ஆகியவை வேளாண் காட்சியைத் துல்லியமாகத் தரும் சொற்கள்; அரிதாக இருக்கக்கூடிய ‘பரம்படித்தல்’ அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மூலத்தின் இரு இணையான சொல்லாட்சிவினாக்களும் அப்படியே பாதுகாக்கப்பட்டுள்ளன.
