source:
  edition: WLC
  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: ta
  text: காட்டெருதை[a] அதன் கயிற்றால் உழுசாலில் கட்டுவாயா? அல்லது அது உனக்குப் பின்னால் பள்ளத்தாக்குகளைப் பரம்படிக்குமா[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காட்டுக்காளை’ அல்லது ‘ஆரக்ஸ்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் רֵים வலிமைமிக்க காட்டு மாட்டினத்தைக் குறிக்கிறது; பழைய மொழிபெயர்ப்புகளில் உள்ள புராண ‘ஒற்றைக்கொம்பன்’ அல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘பள்ளத்தாக்குகளை உழுமா?’ அல்லது ‘பள்ளத்தாக்குகளின் நிலத்தைச் சமப்படுத்துமா?’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், உழுத மண்ணைக் கட்டியடித்து அல்லது பரம்படித்துச் சமப்படுத்துவது போன்ற நிலப் பணியை இன்னும் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: கட்டுவாயா?
  rationale: קשר என்பது கட்டுதல் அல்லது பிணைத்தல் என்று பொருள்படும். அடங்காத விலங்கை வேளாண் வேலைக்காகக் கட்டுப்படுத்த முடியுமா என்ற வினாவை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: רֵים
  choice: காட்டெருது
  rationale: இச்சொல் வலிமைமிக்க காட்டு மாட்டினத்தைக் குறிக்கிறது; பழைய மொழிபெயர்ப்புகளில் காணப்படும் புராண ‘ஒற்றைக்கொம்பன்’ என்ற பொருள் எபிரெயச் சொல்லுக்கு ஏற்றதல்ல. ‘காட்டெருது’ நவீன வாசகருக்குத் தெளிவானது.
- source_word: בְּתֶלֶם
  choice: உழுசாலில்
  rationale: תלם என்பது உழுததால் உருவாகும் சால் அல்லது வரப்பள்ளத்தைக் குறிக்கிறது. ‘உழுசால்’ வேளாண் காட்சியைத் துல்லியமாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: עֲבֹתוֹ
  choice: அதன் கயிற்றால்
  rationale: עבות என்பது கட்டுவதற்கான தடித்த கயிறு அல்லது வடத்தைக் குறிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு காட்டெருதையே சுட்டுகிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இங்கு אִם நிபந்தனையை அல்ல, இணையான இரண்டாவது வினாவை அறிமுகப்படுத்துகிறது. ஆகவே ‘அல்லது’ பொருத்தமானது.
- source_word: יְשַׂדֵּד
  choice: பரம்படிக்குமா
  rationale: வேளாண் சூழலில் שׂדד உழுத மண்ணை மீண்டும் வேலைசெய்து கட்டிகளை உடைத்துச் சமப்படுத்துவதைக் குறிக்கலாம். ‘பரம்படித்தல்’ இந்த வேளாண் நுணுக்கத்தைப் பாதுகாத்து, முதல் உழுதலிலிருந்து வேறுபடுத்துகிறது.
- source_word: עֲמָקִים
  choice: பள்ளத்தாக்குகளை
  rationale: עמקים என்பதன் நேரடியான பொருள் பள்ளத்தாக்குகள் அல்லது தாழ்வான இடங்கள். வேளாண் நிலம் என்று பொதுமைப்படுத்தாமல் மூலத்தின் நிலக்காட்சியை இது காக்கிறது.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பின்னால்
  rationale: விலங்கு உழவனைப் பின்தொடர்ந்து அவன் வழிநடத்தலின்படி வேலைசெய்யும் காட்சியை இயல்பாக வெளிப்படுத்துகிறது.
