  source_fidelity: தீக்கோழி, அதன் களிப்பான/உற்சாகமான சிறகசைவு, மற்றும் நாரை (stork) தொடர்பான வினாவுரைக் ஒப்பீடு ஆகியவை மூலத்திற்கும் ஆங்கில ஆய்வுத் தடத்திற்கும் ஏற்ப உள்ளன. ஆனால் אֶבְרָה மற்றும் וְנֹצָה ஆகிய வேறுபட்ட இறகு-சொற்களை ‘இறக்கைச் சிறகுகள்’ என்று தருவது தன்னைத்தானே மீளச்சொல்லுவதாகவும் இயல்பற்றதாகவும் உள்ளது.
