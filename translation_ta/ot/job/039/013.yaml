translation_notes:
  register: நவீன பொதுத்தமிழில், கவித்துவ மரியாதையைத் தக்கவைத்த மொழிநடை. அரிதான தொழில்நுட்பச் சொல்லுக்குப் பதிலாக ‘இறக்கைச் சிறகுகள்’ பயன்படுத்தப்பட்டு, ‘இறகுகள்’ என்பதிலிருந்து அதன் குறிப்பான பொருள் வேறுபடுத்தப்பட்டுள்ளது. மூலத்தின் கடினத்தன்மையும் கேள்விக்குரிய ஒப்பீடும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
