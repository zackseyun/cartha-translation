  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: ta
  text: தீக்கோழியின் சிறகுகள் மகிழ்ச்சியுடன் படபடக்கின்றன—அவை நாரையின் சிறகிறகும் இறகுத் தொகுதியுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீக்கோழியின் சிறகு பெருமிதத்துடன் படபடக்கிறது; ஆனால் அது நாரையின் சிறகிறகும் இறகுத் தொகுதியுமா?” எபிரெய வாசகம் கடினமானது; அது பல விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: சிறகுகள்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும், இங்கு இணையான உடல் உறுப்பைக் குறிக்கும் தொகுப்பொருள் கொண்டதால் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டது.
- source_word: רְנָנִים
  choice: தீக்கோழியின்
  rationale: சுற்றியுள்ள விலங்கியல் சூழலும் அடுத்த வசனங்களும் இச்சொல் தீக்கோழியைக் குறிப்பதை ஆதரிக்கின்றன; சொல்லின் வடிவம் அரிதானதாயினும், இங்கு இதுவே பொருத்தமான விலங்குப் பெயர்.
- source_word: נֶעֱלָסָה
  choice: மகிழ்ச்சியுடன் படபடக்கின்றன
  rationale: வினைச்சொல்லிலுள்ள களிப்பு அல்லது பெருமித உணர்வையும், சிறகுகளின் அசைவையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: அவை ... மா?
  rationale: எபிரெயத்தில் இது ஒப்பீட்டை முன்வைக்கும் கேள்வியாகப் புரிந்துகொள்ளப்படலாம்; தமிழில் கேள்வி வடிவம் அதன் சொல்லப்படாத வாக்கிய அமைப்பையும் வினாவுணர்வையும் காக்கிறது.
- source_word: אֶבְרָה
  choice: இறக்கைச் சிறகுகள்
  rationale: முழுச் சிறகைக் காட்டிலும் பறப்பதற்குரிய பெரிய இறகுகள் அல்லது pinions என்பதைக் குறிக்கும் சிறப்புப் பொருளை எளிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲסִידָה
  choice: நாரையின்
  rationale: இங்கு அறம் அல்லது பற்றுறுதி குறிக்கும் பெயரடை அல்ல; பறவையின் பெயரான stork என்பதே இணை அமைப்புக்கும் விலங்கியல் சூழலுக்கும் பொருந்துகிறது.
- source_word: וְנֹצָה
  choice: இறகுகளும்
  rationale: பறவையின் இறகுத்தொகுதியைக் குறிக்கும் சொல்லை இயல்பான, பொதுவாகப் புரியும் தமிழில் தருகிறது.
