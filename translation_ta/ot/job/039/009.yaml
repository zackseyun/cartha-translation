  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: ta
  text: காட்டெருது உனக்குப் பணிசெய்ய விரும்புமா? அது உன் தீவனத் தொட்டியருகே இரவைக் கழிக்குமா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் தீவனிடும் இடத்தில்.’ எபிரெயச் சொல் விலங்குகள் உண்பதற்கான இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காட்டுக்காளை’; இங்கு வரும் எபிரெயச் சொல் எந்த விலங்கினத்தைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: விரும்புமா
  rationale: אבה என்பது வெறும் இயலுமையையல்ல, மனமுவந்து இணங்குவதையோ விருப்பத்தையோ குறிக்கிறது. தமிழில் இயல்பான வினாவாக ‘விரும்புமா’ அந்த மனவிருப்ப நுணுக்கத்தைப் பேணுகிறது.
- source_word: רֵּים
  choice: காட்டெருது
  rationale: குறிப்பிடப்படும் விலங்கினம் உறுதியாக அடையாளம் காணப்படவில்லை. அடக்கப்படாத காட்டு மாட்டினத்தைச் சுட்டும் பரவலாகப் புரியக்கூடிய சொல்லாக ‘காட்டெருது’ தேர்ந்தெடுக்கப்பட்டது; மிகக் குறிப்பிட்ட விலங்கியல் அடையாளம் திணிக்கப்படவில்லை.
- source_word: עָבְדֶךָ
  choice: உனக்குப் பணிசெய்ய
  rationale: עבד இங்கு ஒரு மனித எஜமானுக்குச் செய்யும் நடைமுறைப் பணி அல்லது உழைப்பைக் குறிக்கிறது. ‘உனக்குப் பணிசெய்ய’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אִם
  choice: அது ... மா?
  rationale: கவிதை இணைப்பில் אִם இரண்டாவது வினாவை அறிமுகப்படுத்துகிறது. தமிழில் தனித்த இரண்டாவது சொல்லாட்சிக் கேள்வியாக அமைப்பது இயல்பானது; ‘அல்லது’ என்பதை வெளிப்படையாகச் சேர்க்கத் தேவையில்லை.
- source_word: יָלִין
  choice: இரவைக் கழிக்குமா
  rationale: לין என்பது இரவில் தங்குவதைக் குறிக்கிறது. ‘இரவைக் கழிக்குமா’ என்பது விலங்கு அங்கு இரவு முழுவதும் தங்கும் காட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַל
  choice: அருகே
  rationale: עַל அடிப்படையில் ‘மேல்/அருகில்’ போன்ற இட உறவைக் குறிக்கலாம். தீவனத் தொட்டியுடன் தமிழில் ‘அருகே’ என்பது இயல்பான இடத்தொடர்பைத் தருகிறது.
- source_word: אֲבוּסֶךָ
  choice: உன் தீவனத் தொட்டி
  rationale: אֲבוּס என்பது விலங்குகள் உண்பதற்கான தொட்டி அல்லது தீவனமிடும் இடம். ‘தீவனத் தொட்டி’ தெளிவான, தற்போதைய, துல்லியமான தமிழ் வழக்கு.
