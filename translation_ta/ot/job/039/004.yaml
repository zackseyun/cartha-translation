  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: ta
  text: அவற்றின் குட்டிகள் வலிமை பெறுகின்றன; திறந்த வெளியில்[a] வளர்கின்றன; அவை புறப்பட்டுச் செல்கின்றன; அவற்றிடம் திரும்பி வருவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காட்டில்’ அல்லது ‘திறந்த நாட்டுப்புறத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: வலிமை பெறுகின்றன
  rationale: חלם என்ற வினை இச்சூழலில் குட்டிகள் உடல்நலத்துடனும் வலுவுடனும் செழித்து வளர்வதைக் குறிக்கிறது; ‘வலிமை பெறுகின்றன’ என்பது இயல்பான தமிழில் அந்த உடல் வலிமையைத் தெரிவிக்கிறது.
- source_word: בְנֵיהֶם
  choice: அவற்றின் குட்டிகள்
  rationale: சொல்லடிப்படையில் ‘அவற்றின் பிள்ளைகள்/மகன்கள்’ என்றாலும், விலங்குகளைப் பற்றிய இச்சூழலில் பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் ‘குட்டிகள்’ என்பது இயல்பாக உள்ளது.
- source_word: יִרְבּוּ
  choice: வளர்கின்றன
  rationale: רבה பொதுவாக ‘பெருகு’ என்று பொருள்படலாம்; ஆனால் இங்கு குட்டிகளின் உடல் வளர்ச்சியையும் முதிர்ச்சியையும் குறிக்கும் இணைநிலையில் ‘வளர்கின்றன’ என்பது பொருத்தமானது. ‘பெருகுகின்றன’ என்ற எண்ணிக்கை சார்ந்த பொருளும் சொல்லில் சாத்தியமானதாக இருந்தாலும் சூழலில் குறைவாக இயல்புள்ளது.
- source_word: בַבָּר
  choice: திறந்த வெளியில்
  rationale: בָּר இங்கு பயிரிடப்பட்ட நிலத்துக்கு மாறான திறந்த, காட்டு நிலப்பரப்பைக் குறிக்கிறது. ‘திறந்த வெளியில்’ என்பது உருவகத்தை தெளிவான நவீன தமிழில் தருகிறது; ‘காட்டில்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: יָצְאוּ
  choice: புறப்பட்டுப் போய்
  rationale: יצא என்பதன் வெளியேறிச் செல்லும் இயக்கத்தைத் தெளிவாகத் தெரிவிக்கிறது; தாய் விலங்குகளிடமிருந்து பிரிவதை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: அவற்றிடம் திரும்பி வருவதில்லை
  rationale: שוב உடன் வரும் לָמוֹ குட்டிகள் தாய் விலங்குகளிடம் திரும்பாததைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘ஒருபோதும்’ என்ற வலியுறுத்தலைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
