  rationale: קִרְיָה என்பது நகரம் அல்லது பட்டணம் எனப் பொருள்படும்; காட்டுக் கழுதையின் வாழிடத்துக்கு எதிராக மனிதக் குடியிருப்பை இங்கு ‘நகரம்’ தெளிவாகக் குறிக்கிறது.
