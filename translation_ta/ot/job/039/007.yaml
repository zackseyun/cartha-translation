    text: அல்லது, ‘நகரத்தின் இரைச்சலைக் கண்டு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வேலை வாங்குகிறவனின்’ அல்லது ‘மேற்பார்வையாளனின்.’ எபிரெயச் சொல், ஓட்டுகிறவனையோ உழைப்பை வற்புறுத்தி வாங்குகிறவனையோ பரந்த பொருளில் குறிக்கலாம்.
