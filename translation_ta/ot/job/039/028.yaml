revisions:
- from: அது செங்குத்துப் பாறையில் குடியிருந்து, அங்கே இரவைக் கழிக்கிறது[a]; பாறையின் பல் போன்ற கூர்முனையிலும், அரண்போன்ற உயரிடத்திலும் தங்குகிறது[b].
  to: அது செங்குத்துப் பாறையில் குடியிருக்கிறது; அங்கே இரவைக் கழிக்கிறது[a]; பாறையின் பல்லிலும்[b], அரணிலும்[c].
  rationale: 'திருத்தம் எபிரெய வாக்கிய அமைப்பை நெருக்கமாகப் பின்பற்றுகிறது: இரண்டு வினைச்சொற்களுக்குப் பின் அவற்றின் இடத்தைக் குறிக்கும் கவித்துவமான இரண்டு பெயர்ச்சொல் தொடர்கள் வருகின்றன. ‘பாறையின் பல்’ மற்றும் ‘அரண்’ ஆகிய படிமங்கள் உரையில் பாதுகாக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.'
