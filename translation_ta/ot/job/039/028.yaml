translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவப் படிமத்தைப் பாதுகாத்தபடியே சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் ‘பாறையின் பல்’ உருவகம் விளக்கச் சொல்லுடன் தக்கவைக்கப்பட்டுள்ளது; வாக்கிய இயல்புக்காக இறுதியில் ‘தங்குகிறது’ மறுபடியும் வெளிப்படையாக இடப்பட்டுள்ளது.
