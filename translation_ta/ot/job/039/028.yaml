  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: ta
  text: அது செங்குத்துப் பாறையில் குடியிருக்கிறது; அங்கே இரவைக் கழிக்கிறது[a]; பாறையின் பல்லிலும்[b], அரணிலும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அங்கே இரவு தங்குகிறது’ அல்லது ‘அங்கே இரவைக் கழித்து தங்குகிறது.’
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘பாறையின் பல்’; கூரான பாறை நீட்சி அல்லது உச்சியைக் குறிக்கும் எபிரெயப் படிமம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘கோட்டை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: செங்குத்துப் பாறை
  rationale: இங்கு கழுகு குடியிருக்கும் எட்ட முடியாத பாறை உயரத்தைச் சுட்டுவதால், நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘செங்குத்துப் பாறை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׁכֹּן
  choice: குடியிருந்து
  rationale: שׁכן என்பதன் நிலையான வசிப்பிடத்தில் வாழ்தல் என்ற பொருளை ‘குடியிருந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיִתְלֹנָן
  choice: அங்கே இரவைக் கழிக்கிறது
  rationale: לון/לין வேரின் இரவு தங்குதல் என்ற காலநுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘அங்கே’ என்பது சூழலிலிருந்து தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டது.
- source_word: שֶׁן סֶלַע
  choice: பாறையின் பல் போன்ற கூர்முனை
  rationale: ‘பாறையின் பல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, அது கூரான பாறை நீட்சி என்பதை ‘போன்ற கூர்முனை’ தெளிவுபடுத்துகிறது.
- source_word: וּמְצוּדָה
  choice: அரண்போன்ற உயரிடம்
  rationale: מְצוּדָה என்பதன் அரண் அல்லது பாதுகாப்பான எட்ட முடியாத இடம் என்ற இரு நுணுக்கங்களையும் விலங்கின் வாழிடச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
