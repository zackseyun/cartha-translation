  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: ta
  text: ஏனெனில், கடவுள் அவளிடமிருந்து ஞானத்தை அகற்றினார்[a]; பகுத்தறிவில் அவளுக்குப் பங்கு அளிக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் அவளை ஞானத்தை மறக்கச் செய்தார்,” அல்லது “கடவுள் அவளுக்கு ஞானம் இல்லாதிருக்கச் செய்தார்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “பகுத்தறிவில் அவளுக்குப் பங்கிட்டுக் கொடுக்கவில்லை”; அதாவது, பகுத்தறிவில் அவளுக்கு ஒரு பங்கு கொடுக்கவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள சூழலில் தீக்கோழியின் நடத்தைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெய மொழியின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הִשָּׁהּ
  choice: அவளுக்கு ... இல்லாமல் செய்தார்
  rationale: נשה என்பதன் ஹிஃபில் வடிவம், ஞானம் அவளிடம் இல்லாதிருக்கக் கடவுள் காரணமானார் என்ற செயப்பாட்டு பொருளைக் கொண்டுள்ளது. ‘மறக்கச் செய்தார்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் வரும் ஒருமைத் தெய்வப் பெயருக்கான நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: நல்ல தீர்மானம் அல்லது இயல்பான அறிவாற்றலைக் குறிக்கும் சொல்லின் விரிவான பொருளை நேரடியாகத் தருகிறது.
- source_word: וְלֹא
  choice: '... அளிக்கவில்லை'
  rationale: இரண்டாம் கூற்றை முதலாம் கூற்றுடன் இணைத்து மறுக்கும் எபிரெய அமைப்பைத் தெளிவான தமிழில் பிரதிபலிக்கிறது.
- source_word: חָלַק לָהּ
  choice: அவளுக்குப் பங்கு அளிக்கவில்லை
  rationale: חלק என்பதன் அடிப்படைப் பொருளான ‘பகுத்தளித்தல்’ என்பதைப் பாதுகாத்து, அவளுக்கு ஒரு பங்கு ஒதுக்கப்படவில்லை என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בַּבִּינָה
  choice: புரிந்துகொள்ளும் திறனில்
  rationale: בינה குறிக்கும் புரிதல் அல்லது பகுத்தறிவை இயல்பான தமிழில் தருகிறது; ‘ஞானம்’ என்பதிலிருந்து அதன் சொற்பொருள் வேறுபாட்டையும் வைத்திருக்கிறது.
theological_decisions:
- issue: தீக்கோழியிடம் ஞானம் இல்லாதிருப்பதில் கடவுளின் செயற்பாடு
  choice: ஞானம் இல்லாமல் செய்தவர் கடவுளே என்றும், புரிந்துகொள்ளும் திறனில் அவளுக்குப் பங்கு அளிக்காதவர் அவரே என்றும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: கடவுளின் செயற்பாட்டை மென்மையாக்கி, ‘அவளுக்கு ஞானம் இல்லை’ என்று மட்டும் கூறுதல்.
  rationale: இரு வினைகளுக்கும் אֱלוֹהַּ என்பதே வெளிப்படையான எழுவாய். ஆகவே இறையியல் பதற்றத்தை மென்மையாக்காமல் மூலத்தின் நேரடி காரண attribution பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமுள்ள ஆனால் சாதாரண வாசகருக்கும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. பெண்பால் சுட்டான ‘அவள்’ முந்தைய வசனங்களில் வரும் தீக்கோழியைத் தொடர்கிறது. மூலத்தின் இணையான இரு கூறுகளும் கடவுளின் நேரடி செயற்பாடும் பாதுகாக்கப்பட்டுள்ளன.
