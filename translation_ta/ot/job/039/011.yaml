  text: הֲֽ/תִבְטַח בּ֭/וֹ כִּי רַ֣ב כֹּח֑/וֹ וְ/תַעֲזֹ֖ב אֵלָ֣י/ו יְגִיעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: ta
  text: அதன் வலிமை மிகுந்தது என்பதால் அதை நம்புவாயா? உன் உழைப்பை[a] அதனிடம் விட்டுவிடுவாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உழைப்பின் பலனை.” எபிரெயச் சொல் உழைப்பையே அல்லது அந்த உழைப்பால் கிடைக்கும் பலனைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  choice: அதை நம்புவாயா?
  rationale: בטח என்பதன் நம்புதல் அல்லது சார்ந்திருத்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; הֲ குறிக்கும் வினாவையும் காக்கிறது. சூழலில் ஆண் பாலில் குறிப்பிடப்படும் காட்டெருதைத் தமிழ் இயல்புப்படி அஃறிணை ஒருமையாகக் குறிப்பிடுகிறது.
- source_word: כִּי רַב כֹּחוֹ
  choice: அதன் வலிமை மிகுந்தது என்பதால்
  rationale: כִּי-யின் காரணப் பொருளையும் רַב כֹּחוֹ என்பதன் ‘அதன் வலிமை பெரிது’ என்ற கருத்தையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: அதனிடம் விட்டுவிடுவாயா?
  rationale: עזב என்பதன் அடிப்படைப் பொருளான ‘விட்டுவிடுதல்’ என்பதைப் பேணுகிறது; אֵלָיו குறிக்கும் திசை அல்லது ஒப்படைப்பை ‘அதனிடம்’ இயல்பாக வெளிப்படுத்துகிறது. எபிரெய வாக்கியத்தின் இணைப்பைத் தமிழில் தனி சொல்லாட்சிவினாவாக அளிப்பது அதன் வினாவியல் வலிமையைத் தெளிவாக்குகிறது.
- source_word: יְגִיעֶךָ
  choice: உன் உழைப்பின் பலனை
  rationale: יְגִיעַ என்பது உழைப்பு, கடும் முயற்சி, அல்லது அதன் விளைவு எனப் பொருள்படலாம். வேளாண்மைச் சூழலில் ‘உழைப்பின் பலன்’ பொருத்தமான முதன்மைத் தேர்வு; இருப்பினும் மூலத்தின் பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. காட்டெருதைத் தமிழ் இலக்கண மரபுப்படி ‘அது’ எனக் குறிப்பிடுகிறது. தொடர்ச்சியான எபிரெய வினா தமிழில் இரண்டு சொல்லாட்சிவினாக்களாக அமைக்கப்பட்டுள்ளது.
