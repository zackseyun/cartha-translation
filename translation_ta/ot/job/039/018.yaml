  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: ta
  text: அவள் மேலே எழும்பும்போது[a], குதிரையையும் அதன் சவாரியாளனையும் கேலி செய்கிறாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவள் உயரத்தில் தன் சிறகுகளை விரிக்கும்போது’ அல்லது ‘அவள் சிறகடித்து மேலெழும்பும்போது.’ எபிரெய வினை பொதுவாக மேலே எழுவதைக் குறிக்கிறது; ஆனால் அதன் துல்லியமான நுண்பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கேலி செய்கிறாள்’ என்பதற்கு ‘சிரிக்கிறாள்’ அல்லது ‘இகழ்கிறாள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: எழும்பும்போது
  rationale: இச்சொல் இங்கு காலச் சூழலை அறிமுகப்படுத்துகிறது; தமிழில் வினையுடன் இணைந்த ‘போது’ இயல்பாக அதன் காலப் பொருளைத் தருகிறது.
- source_word: בַּמָּרוֹם
  choice: உயரத்திற்கு
  rationale: மָרוֹם உயரத்தையோ உயரமான இடத்தையோ குறிக்கிறது. பறவை முழுமையாகப் பறக்கிறது என்று மிகைப்படுத்தாமல், மேல்நோக்கிய இயக்கத்தை ‘உயரத்திற்கு’ வெளிப்படுத்துகிறது.
- source_word: תַּמְרִיא
  choice: எழும்பு
  rationale: இந்த வினை மேலே எழுவதையோ தன்னை உயர்த்திக்கொள்வதையோ குறிக்கலாம். தீக்கோழி சூழலில் விவாதத்துக்குரிய நுண்பொருளைத் தீர்மானித்துவிடாமல் ‘எழும்பு’ பாதுகாக்கிறது.
- source_word: תִּשְׂחַק
  choice: பார்த்துச் சிரி
  rationale: שׂחק என்பதற்கு சிரித்தல் என்றும் ஏளனம் செய்தல் என்றும் பொருள் உண்டு. ‘பார்த்துச் சிரிக்கிறாள்’ என்பது பொருளை இயல்பான தமிழில் தருவதோடு, அதன் ஏளனச் சாயலை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: לַסּוּס
  choice: குதிரையை
  rationale: எபிரெய மொழியின் உருபுடன் கூடிய ஒருமை இங்கு ஒரு வகையைப் பொதுவாகக் குறிக்கிறது; தமிழில் ‘குதிரை’ அதைப் போதுமான முறையில் வெளிப்படுத்துகிறது.
- source_word: וּלְרֹכְבוֹ
  choice: அதன்மேல் சவாரி செய்பவனை
  rationale: உடைமைப் பின்னொட்டு குதிரையைக் குறிக்கிறது. ‘அதன்மேல் சவாரி செய்பவன்’ அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
