    text: நேரடியாக, “வாளின் முன்னிலையிலிருந்து திரும்புவதில்லை.”
    reason: literal_rendering
lexical_decisions:
- source_word: יִשְׂחַק
  choice: சிரிக்கிறது
  rationale: שׂחק என்ற வினையின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; போர்க்களத்தில் குதிரை அச்சத்தை அலட்சியப்படுத்தும் நுட்பமும் சூழலில் வெளிப்படுகிறது.
- source_word: לְפַחַד
  choice: அச்சத்தைப் பார்த்து
  rationale: לְ உடன் வரும் פחד என்பதன் ‘அச்சத்தை எதிர்கொண்டு/அச்சத்தைக் கண்டு’ என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֵחָת
  choice: கலங்குவதில்லை
  rationale: חתת என்பதன் நிபால் வடிவம் இங்கு மனம் உடைதல் அல்லது திகிலடைதலைக் குறிக்கிறது; ‘கலங்குவதில்லை’ போர்ச்சூழலில் இயல்பாகவும் அளவான தீவிரத்துடனும் உள்ளது.
- source_word: יָשׁוּב
  choice: பின்வாங்குவதுமில்லை
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருள் இப்போர்ச் சூழலில் ‘பின்வாங்குதல்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: מִפְּנֵי
  choice: கண்டு
  rationale: ‘முன்னிலிருந்து/எதிரில்’ என்ற எபிரெயச் சொற்றொடர், அச்சுறுத்தும் வாளை எதிர்கொள்ளும் நிலையில் தமிழில் ‘வாளைக் கண்டு’ என இயல்பாக அமைகிறது.
- source_word: חָרֶב
  choice: வாள்
  rationale: ஒருமை உருவகத்தைக் காத்து, போராயுதத்தையும் போரின் அச்சுறுத்தலையும் சுருக்கமாகக் குறிக்கிறது.
