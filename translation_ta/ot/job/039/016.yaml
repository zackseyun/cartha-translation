  register: நவீன நிலையான தமிழில், விலங்கு குறிக்கப்படுவதால் பாலினம் காட்டாத ‘அது/அதன்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் சுருக்கத்தையும் கவித்துவத் தன்மையையும் காக்கும் வகையில் இயல்பான, கண்ணியமான நடை பின்பற்றப்பட்டுள்ளது.
