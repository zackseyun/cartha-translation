  edition: WLC
  text: הִקְשִׁ֣יחַ בָּנֶ֣י/הָ לְּ/לֹא לָ֑/הּ לְ/רִ֖יק יְגִיעָ֣/הּ בְּלִי פָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: ta
  text: தன் குஞ்சுகளைத் தனக்குரியவை அல்லாததுபோல் கடுமையாக நடத்துகிறது[a]; அதன் உழைப்பு வீணாகிறது; அதற்கு அச்சமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “தன் பிள்ளைகளைத் தனக்குரியவை அல்லாததுபோல் கடினப்படுத்துகிறது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: கடுமையாக நடத்துகிறது
  rationale: קשׁח என்பதன் ஹிஃபில் வடிவம் ‘கடினமாக்குதல்’ அல்லது ‘கடுமையாக நடத்துதல்’ என்ற பொருளைத் தருகிறது. தீக்கோழி தன் குஞ்சுகளிடம் நடந்துகொள்வதைச் சுட்டும் இச்சூழலில், இயல்பான தமிழில் ‘கடுமையாக நடத்துகிறது’ என்பது பொருத்தமானது.
- source_word: בָּנֶיהָ
  choice: தன் குஞ்சுகளை
  rationale: சொல்லுக்கு நேரான பொருள் ‘அவளுடைய பிள்ளைகள்/மகன்கள்’ என்றாலும், விலங்கைப் பற்றிய சூழலில் ‘குஞ்சுகள்’ என்பது இயல்பான தமிழ்ச் சொல்.
- source_word: לְלֹא לָהּ
  choice: தன்னுடையவை அல்லாததுபோல்
  rationale: எபிரெயச் சொற்றொடர் நேராக ‘அவளுக்குரியவை அல்லாதவையாக’ எனப் பொருள்படும். ஒப்புமையின் நுட்பத்தையும் தாய்க்குரிய பற்றின்மையையும் தமிழில் தெளிவாக வெளிப்படுத்த இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְרִיק
  choice: வீணானாலும்
  rationale: ריק இங்கு பயனின்மை அல்லது வீண்போவதைக் குறிக்கிறது. அடுத்துள்ள ‘அஞ்சுவதில்லை’ என்பதோடு இயல்பாக இணைக்க, concessive உறவு ‘வீணானாலும்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: יְגִיעָהּ
  choice: அதன் உழைப்பு
  rationale: இச்சொல் ஈன்றெடுப்பதிலும் குஞ்சுகளை வளர்ப்பதிலும் செலுத்தப்படும் முயற்சி அல்லது பாடுபாட்டைக் குறிக்கலாம். ‘உழைப்பு’ இந்தப் பரப்பைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: בְּלִי פָחַד
  choice: அது அஞ்சுவதில்லை
  rationale: நேரான பொருள் ‘அச்சமின்றி.’ தமிழில் முழு வாக்கியமாக இயல்பாக அமைய ‘அது அஞ்சுவதில்லை’ என மொழிபெயர்க்கப்பட்டது; இழப்பு குறித்து கவலைப்படாத தன்மையையும் இது உணர்த்துகிறது.
