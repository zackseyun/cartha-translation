- from: தன் குஞ்சுகளைத் தன்னுடையவை அல்லாததுபோல் கடுமையாக நடத்துகிறது[a]; அதன் உழைப்பு வீணானாலும், அது அஞ்சுவதில்லை.
  to: தன் குஞ்சுகளைத் தனக்குரியவை அல்லாததுபோல் கடுமையாக நடத்துகிறது[a]; அதன் உழைப்பு வீணாகிறது; அதற்கு அச்சமில்லை.
  rationale: The revision removes the unsupported concessive nuance in the second clause and corrects the footnote’s added ‘against herself’ language. It retains the draft’s idiomatic animal-context term «குஞ்சுகள்», its contextual rendering «கடுமையாக நடத்துகிறது», and the source’s compact statement that the animal’s labor is futile and it is without fear.
