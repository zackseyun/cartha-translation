translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவிதைநடையின் கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் இரண்டு தேடுதல் வினைகளின் வேறுபாட்டை ‘அலைந்து தேடுகிறது’ மற்றும் ‘நாடித் தேடுகிறது’ என ஓரளவு காத்துள்ளது.
