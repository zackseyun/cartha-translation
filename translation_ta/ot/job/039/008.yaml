  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: ta
  text: தன் மேய்ச்சலுக்காக அது மலைகளில் சுற்றித் தேடுகிறது; பசுமையான அனைத்தையும் தேடுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பசுமையான அனைத்தும்” என்பது இச்சூழலில் புதிதாகப் பசுமையுடன் வளரும் தாவரங்களையும் மேய்ச்சலுக்குரிய பசுந்தீவனத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: அலைந்து தேடுகிறது
  rationale: תור என்பதன் ஆராய்ந்து தேடுதல், பரந்து சுற்றுதல் ஆகிய இரு நுணுக்கங்களையும் காட்டுக் கழுதையின் சுதந்திரமான நடமாட்டச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָרִים
  choice: மலைகளில்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருள் ‘மலைகள்’; தமிழில் இடப்பொருளை இயல்பாகக் காட்ட ‘மலைகளில்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִרְעֵהוּ
  choice: தன் மேய்ச்சலுக்காக
  rationale: מִרְעֶה என்பது மேய்ச்சல் அல்லது மேயும் இடத்தைக் குறிக்கலாம்; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டைத் தமிழில் எழுவாயையே சுட்டும் ‘தன்’ என இயல்பாகக் காக்கிறது.
- source_word: וְאַחַר
  choice: நாடி
  rationale: אַחַר இங்கு ஒன்றைப் பின்தொடர்ந்து தேடும் நோக்கத்தைக் காட்டுகிறது; ‘நாடி’ அந்தத் திசைநோக்கிய தேடலை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: כָּל இங்கு பசுமையான தாவர வளர்ச்சி முழுவதையும் பரவலாகக் குறிக்கிறது.
- source_word: יָרוֹק
  choice: பசுமையான செடிகொடிகள்
  rationale: יָרוֹק என்பது இச்சூழலில் பசுமையான புதிய தாவர வளர்ச்சியைக் குறிக்கிறது; ‘செடிகொடிகள்’ என்பது பொதுவாசகருக்குப் புரியும் இயல்பான கூட்டுப்பெயர், ஆனால் சொல்லின் பரந்த பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: יִדְרֹשׁ
  choice: தேடுகிறது
  rationale: דרשׁ என்பதன் செயற்பாட்டுள்ள தேடுதல் என்ற பொருள், உணவுக்காகத் தேடும் விலங்கின் சூழலுக்கு ஏற்றவாறு ‘தேடுகிறது’ என வழங்கப்பட்டுள்ளது.
