- from: தன் மேய்ச்சலுக்காக அது மலைகளில் அலைந்து தேடுகிறது; பசுமையான செடிகொடிகள் அனைத்தையும் நாடித் தேடுகிறது.[a]
  to: தன் மேய்ச்சலுக்காக அது மலைகளில் சுற்றித் தேடுகிறது; பசுமையான அனைத்தையும் தேடுகிறது.[a]
  rationale: The revision retains the Hebrew's two related but distinct search verbs and the sense of seeking grazing in the mountains. It replaces the overly specific “செடிகொடிகள்” with a broad expression corresponding to יָרוֹק (‘what is green’), while the footnote supplies the contextual sense of fresh vegetation.
