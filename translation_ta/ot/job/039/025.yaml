translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியமும் வேகமும் காக்கப்பட்டுள்ளன. போர்க்குதிரையைக் குறிக்கும் ஒருமை நடுநிலைச் சுட்டுப்பெயர் ‘அது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மணம் மற்றும் இடி உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; கடைசி வினை எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் வாக்கிய நிறைவுக்கும் இயல்புக்கும் ‘கேட்கிறது’ சேர்க்கப்பட்டுள்ளது.
