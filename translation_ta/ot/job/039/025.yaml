revisions:
- from: எக்காளம் முழங்கும்போது அது, “ஆகா!” என்று கனைக்கிறது[a]. தொலைவிலிருந்தே அது போரின் வாசனையை அறிகிறது; படைத்தலைவர்களின் இடிமுழக்கத்தையும் போர்முழக்கத்தையும் கேட்கிறது[b].
  to: எக்காளம் முழங்கும்போது அது, “ஆகா!” என்று சொல்கிறது[a]. தொலைவிலிருந்தே அது போரையும், படைத்தலைவர்களின் இடிமுழக்கத்தையும் போர்முழக்கத்தையும் முகர்கிறது[b].
  rationale: The revision restores the explicit speech verb and removes the unsupported verb “hears.” It also preserves the Hebrew’s marked sensory imagery by allowing “முகர்கிறது” to govern all three coordinated objects, while the footnote explains this deliberate poetic construction.
