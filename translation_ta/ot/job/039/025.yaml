  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: ta
  text: எக்காளம் முழங்கும்போது அது, “ஆகா!” என்று சொல்கிறது[a]. தொலைவிலிருந்தே அது போரையும், படைத்தலைவர்களின் இடிமுழக்கத்தையும் போர்முழக்கத்தையும் முகர்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “அது, ‘ஆகா!’ என்று சொல்கிறது.” இது போருக்குச் செல்ல ஆவலுடன் இருக்கும் குதிரையின் உற்சாகத்தை மனிதப் பேச்சாகச் சித்தரிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் “முகர்கிறது” என்பது போர், படைத்தலைவர்களின் “இடிமுழக்கம்,” மற்றும் “போர்முழக்கம்” ஆகிய அனைத்துடனும் தொடர்புபடுத்தப்பட்டுள்ளது. “இடிமுழக்கம்” படைத்தலைவர்களின் உரத்த போரொலிக்கான உருவகம். “போர்முழக்கம்” போர்க்கூக்குரலையோ சமிக்ஞை ஒலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: எக்காளம் முழங்கும்போது
  rationale: இந்த எபிரெய மொழிவழக்கு எக்காளம் ஒலிக்கும் தருணத்தைக் குறிக்கிறது. ‘முழங்கும்போது’ என்பது இயல்பான தமிழில் காலச் சூழலையும் போருக்கான சமிக்ஞையின் வலிமையையும் தருகிறது.
- source_word: יֹאמַר הֶאָח
  choice: “ஆகா!” என்று கனைக்கிறது
  rationale: יֹאמַר என்பது சொல்லுதல் என்றாலும், இங்கு போர்க்குதிரை மனிதனைப்போல் பேசுவதாகக் காட்டும் உயிரூட்டல் உள்ளது. தமிழில் குதிரையின் குரலை இயல்பாகச் சுட்ட ‘கனைக்கிறது’ பயன்படுத்தப்பட்டு, הֶאָח என்பதின் ஆர்வமிக்க வியப்பு ‘ஆகா!’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: וּמֵרָחוֹק
  choice: தொலைவிலிருந்தே
  rationale: தூரத்திலிருந்தே போரைக் கண்டுணரும் குதிரையின் கூருணர்வை ‘-இருந்தே’ இயல்பாக வலியுறுத்துகிறது.
- source_word: יָרִיחַ מִלְחָמָה
  choice: போரின் வாசனையை அறிகிறது
  rationale: ריח வேரின் மணத்தால் உணரும் தெளிவான உருவகத்தைப் பாதுகாக்கிறது. ‘வாசனையை அறிகிறது’ என்பது ‘முகர்கிறது’ என்பதைவிட இங்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: רַעַם שָׂרִים
  choice: படைத்தலைவர்களின் இடிமுழக்கம்
  rationale: רַעַם என்பதன் நேரடியான ‘இடி’ உருவகம் பாதுகாக்கப்படுகிறது; போர்ச் சூழலில் שָׂרִים அரச குமாரர்களைவிட படைத்தலைவர்களைக் குறிக்கிறது.
- source_word: וּתְרוּעָה
  choice: போர்முழக்கம்
  rationale: இந்தச் சொல் ஆரவாரக் கூச்சலையோ சமிக்ஞை ஒலியையோ குறிக்கலாம். சூழலில் போர்வீரர்களின் கூக்குரல் என்ற பொருள் இயல்பானது; ‘போர்முழக்கம்’ ஒலியின் வலிமையையும் ஒரு அளவு பொருள் விரிவையும் தக்கவைக்கிறது.
