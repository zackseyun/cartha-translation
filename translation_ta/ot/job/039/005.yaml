- source_word: עָרוֹד
  choice: காட்டுக் கழுதை
  rationale: இச்சொல் வேறொரு காட்டுக் கழுதைப் பெயராகவோ குறிப்பிட்ட காட்டுக் கழுதை இனமாகவோ புரிந்துகொள்ளப்படலாம்; ஆதாரமின்றி ‘வேகமான’ என்ற பண்பைச் சேர்க்காமல் இணைவரியின் பொருளைத் தக்கவைக்கிறது.
- source_word: פִתֵּחַ
  choice: அவிழ்த்தவர்
  rationale: கட்டுகளுடன் வரும் சூழலில் ‘தளர்த்துதல்/அவிழ்த்தல்’ என்பதே இயல்பான பொருள்.
