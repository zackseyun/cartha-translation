  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: ta
  text: காட்டுக் கழுதையைச் சுதந்திரமாகப் போகவிட்டவர் யார்? காட்டுக் கழுதையின் கட்டுகளை அவிழ்த்தவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
