    text: எபிரெய மொழியில் இரண்டாம் வரியிலுள்ள עָרוֹד என்பது காட்டுக் கழுதைக்கான வேறொரு சொல்லாகவோ, குறிப்பிட்ட ஒரு காட்டுக் கழுதை இனத்தைக் குறிக்கும் சொல்லாகவோ புரிந்துகொள்ளப்படலாம்; சில மொழிபெயர்ப்புகள் அதை ‘ஓனகர்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
