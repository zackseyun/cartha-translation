  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: ta
  text: அதன் மேல் அம்பறாத்தூணி சலசலக்கிறது[a]; மின்னும் ஈட்டியும் எறிவேலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதற்கு எதிராக அம்பறாத்தூணி ஒலிக்கிறது” என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல்லும் வினைச்சொல்லும் இடம் மற்றும் ஒலி சார்ந்த சற்றே மாறுபட்ட நுணுக்கங்களை அனுமதிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “ஈட்டியும் எறிவேலும் ஆகியவற்றின் தீச்சுடர்/கூர்ப்பகுதி.” இது ஆயுதங்களின் மின்னும் பளபளப்பைக் குறிக்கும் கவித்துவச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: עַל என்னும் முன்னிடைச்சொல்லின் இடம்சார்ந்த பொருளைப் பாதுகாக்கிறது; சூழலில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் குதிரையைக் குறிப்பதால், இயல்பான தமிழில் அஃறிணை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תִּרְנֶה
  choice: கலகலக்கிறது
  rationale: அம்பறாத்தூணி அசையும்போது எழும் கூர்மையான தொடரொலியை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; ‘ஒலிக்கிறது’ என்பதைவிட போர்க்களத்தின் திடமான ஒலிப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: אַשְׁפָּה
  choice: அம்பறாத்தூணி
  rationale: அம்புகளை வைத்திருக்கும் உறைக்கான துல்லியமான, இலக்கியத்தன்மையுள்ள நிலையான தமிழ்ச் சொல்.
- source_word: לַהַב
  choice: தீப்பொறிபோல் மின்னுகின்றன
  rationale: ‘தீச்சுடர்/கூர்முனை’ என்ற சொல்லின் கவித்துவப் படிமத்தை, ஆயுதங்களின் பளபளப்பாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲנִית
  choice: ஈட்டி
  rationale: நீண்ட குத்தாயுதத்தைக் குறிக்கும் பொதுவான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: כִידוֹן
  choice: எறிவேல்
  rationale: חֲנִית என்பதிலிருந்து வேறுபடும், எறிவதற்குரிய இலகுவான ஆயுதம் என்ற வேறுபாட்டைப் பாதுகாக்கிறது.
