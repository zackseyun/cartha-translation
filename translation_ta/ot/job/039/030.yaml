base_translation:
  language: en
  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: ta
  text: அதன் குஞ்சுகள் இரத்தத்தை உறிஞ்சிக் குடிக்கின்றன[a]; கொல்லப்பட்டவர்கள் எங்கே இருக்கிறார்களோ[b], அங்கே அது இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் குஞ்சுகள் இரத்தத்தை நக்கிக் குடிக்கின்றன.” எபிரெய வினை உறிஞ்சுதல், பேரார்வத்துடன் விழுங்கிக் குடித்தல், அல்லது நக்கிக் குடித்தல் ஆகிய உயிரோட்டமான பொருள் நிழல்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிணங்கள் எங்கே இருக்கின்றனவோ, அங்கே அது இருக்கிறது.” எபிரெயச் சொல் வன்முறையாகக் கொல்லப்பட்டவர்களைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: அதன் குஞ்சுகள்
  rationale: சூழலில் கழுகின் இளம் பறவைகளைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் இனத்தை அளவுக்கு மீறிக் குறிப்பாக்காமலும் ‘குஞ்சுகள்’ பொருளைத் தருகிறது.
- source_word: יְעַלְעוּ
  choice: உறிஞ்சிக் குடிக்கின்றன
  rationale: எபிரெய வினை ஆர்வத்துடன் உறிஞ்சுதல் அல்லது விழுங்கிக் குடித்தல் என்னும் உயிரோட்டமான படிமத்தைத் தருகிறது; ‘இரத்தம்’ என்பதுடன் ‘உறிஞ்சிக் குடித்தல்’ தமிழில் இயல்பாக அமைகிறது.
- source_word: דָם
  choice: இரத்தம்
  rationale: நேரடியான சொற்பொருள்; படிமத்தை மென்மைப்படுத்த வேண்டிய சூழல் காரணம் இல்லை.
- source_word: וּבַאֲשֶׁר
  choice: எங்கே ... ஓ
  rationale: இடத்தைக் குறிக்கும் தொடர்பு வாக்கியத்தைத் தொடங்குகிறது. ‘எங்கே ... ஓ, அங்கே’ என்ற அமைப்பு தமிழில் இயல்பாகவும் எபிரெய இணைப்பைத் தெளிவாகவும் வழங்குகிறது.
- source_word: חֲלָלִים
  choice: கொல்லப்பட்டவர்கள்
  rationale: வன்முறையாகக் கொல்லப்பட்ட அல்லது உயிரிழக்கும்படி காயமடைந்தவர்களைக் குறிக்கும் சொல்லின் வன்மரண நிழலைத் தக்கவைக்கிறது; வெறும் ‘பிணங்கள்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: שָׁם הוּא
  choice: அங்கே அது இருக்கிறது
  rationale: சுற்றியுள்ள வசனங்களில் விவரிக்கப்படும் பறவையையே ஒருமைச் சுட்டுப்பெயர் குறிக்கிறது. பொதுவான விலங்கு விளக்கத்தில் ‘அது’ இயல்பான தமிழ்; நிகழ்காலக் கவிதை வருணனையும் தக்கவைக்கப்படுகிறது.
