  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: ta
  text: 'ஏனெனில், அது தன் முட்டைகளைத் தரையில் விட்டுவிட்டு,

    புழுதியின்மேல் அவற்றைச் சூடேற்றுகிறது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் முட்டைகளைத் தரையில் கைவிடுகிறது.” எபிரெய வினைச்சொல் வெறுமனே “விடுகிறது” என்பதைவிட வலுவான பொருளைக் கொண்டிருக்கலாம். ஆனால் அடுத்த வரி, அவை முற்றிலும் கைவிடப்படுவதைக் காட்டிலும் திறந்தவெளியில் தரையில் வைக்கப்படுவதையே சுட்டிக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வருணனைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: תַעֲזֹב
  choice: விட்டுவைத்து
  rationale: עזב என்பதற்கு ‘விடுதல், கைவிடுதல்’ என்ற பொருள்கள் உண்டு. இச்சூழலில் ‘விட்டுவைத்து’ என்பது தரையில் முட்டைகளை வைப்பதைக் கூறுவதோடு, முற்றிலும் புறக்கணிக்கிறது என்று மிகைப்படுத்தாமல் இருக்கிறது; வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לָאָרֶץ
  choice: தரையில்
  rationale: சொல்லின் நேரடியான நிலம்/தரைப் படிமத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அடுத்துள்ள ‘புழுதியின்மேல்’ என்பதுடனும் பொருந்துகிறது.
- source_word: בֵּצֶיהָ
  choice: தன் முட்டைகளை
  rationale: பெண்பால் ஒருமை உடைமைப் பின்னொட்டைக் கொண்ட பன்மைப் பெயர்ச்சொல்லை, சூழலில் குறிப்பிடப்படும் நெருப்புக்கோழியைச் சுட்டும் இயல்பான தமிழ் தற்சுட்டுப் பயன்பாட்டால் மொழிபெயர்க்கிறது.
- source_word: וְעַל עָפָר
  choice: புழுதியின்மேல்
  rationale: עָפָר என்பதன் ‘புழுதி’ என்ற தெளிவான படிமத்தையும் עַל என்பதன் ‘மேல்’ என்ற இடத்தொடர்பையும் காக்கிறது.
- source_word: תְּחַמֵּם
  choice: அவற்றைச் சூடாக்குகிறது
  rationale: Piel வடிவின் ‘சூடாக்குதல்’ என்ற நேரடிப் பொருளை வழங்குகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முன் கூறப்பட்ட முட்டைகளிலிருந்து தமிழில் இயல்பாக நிரப்பப்பட்டுள்ளது; ‘அடைகாக்கிறது’ என்பது தேவைக்கு அதிகமான விளக்கமாக இருக்கும்.
