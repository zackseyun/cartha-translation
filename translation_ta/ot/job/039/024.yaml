  text: בְּ/רַ֣עַשׁ וְ֭/רֹגֶז יְגַמֶּא אָ֑רֶץ וְ/לֹֽא יַ֝אֲמִ֗ין כִּי ק֥וֹל שׁוֹפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: ta
  text: கொந்தளிப்போடும் சீற்றத்தோடும் அது தரையை விழுங்குகிறது[a]; எக்காளத்தின் ஒலி கேட்டதும் அது அசையாமல் நிற்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தரையை விழுங்குகிறது.’ குதிரை மிக வேகமாகவும் ஆர்வத்தோடும் பாய்ந்து செல்வதைச் சித்தரிக்கும் உயிரோட்டமான உருவகம் இது.'
    reason: lexical_alternative
  - marker: b
    text: இதனை, ‘எக்காளத்தின் ஒலி கேட்டதும் அது தன்னைக் கட்டுப்படுத்திக்கொள்ளாது’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள வினைச்சொல்லின் வழக்கமான நேரடிப் பொருள் ‘நம்புதல்’; ஆனால் இச்சூழலில் அது நிலைத்திருத்தல் அல்லது பின்வாங்கி நிற்றல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: கொந்தளிப்போடும்
  rationale: רַעַשׁ என்பது அதிர்வு, பேரிரைச்சல் அல்லது வன்மையான கொந்தளிப்பைக் குறிக்கலாம். போர்க்குதிரையின் பாய்ச்சலைச் சித்தரிக்கும் இச்சூழலில், ‘கொந்தளிப்போடும்’ அதன் வன்மையான கிளர்ச்சியையும் வேகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְרֹגֶז
  choice: சீற்றத்தோடும்
  rationale: רֹגֶז என்பதற்கு கிளர்ச்சி, நடுக்கம், சினம் ஆகிய பொருள்கள் உண்டு. முந்தைய சொல்லுடன் இணைந்து குதிரையின் உக்கிரத்தை வலுப்படுத்துவதால் ‘சீற்றத்தோடும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְגַמֶּא
  choice: விழுங்குகிறது
  rationale: גמא என்பதன் அடிப்படைப் பொருள் ‘விழுங்குதல்’. குதிரை மிக வேகமாக நிலத்தைக் கடப்பதை, நிலத்தையே விழுங்குவதுபோல் சித்தரிக்கும் மூல உருவகம் பாதுகாக்கப்பட்டது.
- source_word: אָרֶץ
  choice: தரையை
  rationale: இங்கு אֶרֶץ உலகையோ நாட்டையோ அல்லாமல் குதிரை பாய்ந்து கடக்கும் நிலப்பரப்பைக் குறிக்கிறது; ஆகவே ‘தரையை’ என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: וְלֹא יַאֲמִין
  choice: அது அசையாமல் நிற்காது
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘நம்புதல்’ என்று பொருள்படும். ஆனால் இச்சூழலில் நிலைத்திருத்தல் அல்லது தன்னைக் கட்டுப்படுத்திக்கொள்ளுதல் என்ற வழக்குப் பொருள் இருக்கலாம். போர்க்குதிரையின் பதற்றமான ஆவலைத் தெளிவாகச் சொல்ல ‘அசையாமல் நிற்காது’ எனத் தரப்பட்டது; சொல்லாட்சியின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּי
  choice: கேட்டதும்
  rationale: כִּי இங்கு எக்காள ஒலியுடன் தொடர்புடைய சூழ்நிலையை அறிமுகப்படுத்துகிறது. தமிழில் அதன் காலச்சார்ந்த பொருளை ‘கேட்டதும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קוֹל שׁוֹפָר
  choice: எக்காளத்தின் ஒலி
  rationale: שׁוֹפָר என்பது குறிப்பாகப் போரில் அறிகுறி கொடுக்கப் பயன்பட்ட கொம்பு அல்லது எக்காளம். ‘எக்காளத்தின் ஒலி’ மூலத்தின் பெயர்ச்சொல் அமைப்பையும் போர்ச் சூழலையும் தக்கவைக்கிறது.
