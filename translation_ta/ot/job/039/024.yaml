translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவித்துவமான போர்க்குதிரைச் சித்திரத்தின் வேகமும் உக்கிரமும் குன்றாத வகையிலும் மொழிபெயர்க்கப்பட்டது. உயிரற்ற பால்வேறுபாட்டைத் தவிர்க்க குதிரையை ‘அது’ என்று குறிப்பிடுகிறது. மூலத்தின் விழுங்குதல் உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு விளக்கப்பட்டுள்ளது; וְלֹא יַאֲמִין என்பதிலுள்ள உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
