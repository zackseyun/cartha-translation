  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: ta
  text: உன் கட்டளையின்படிதானா[b] கழுகு[c] உயரப் பறந்து[a], தன் கூட்டை உயரத்தில் அமைக்கிறது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயர எழுகிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “உன் வாயின்மேல்”; இது “உன் கட்டளையின்படி” அல்லது “உன் சொல்லின்படி” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “கழுகு” என்பதற்கான எபிரெயச் சொல் சில சூழல்களில் பிணந்தின்னிக் கழுகு உள்ளிட்ட பெரிய இரைப் பறவைகளையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
