translation_notes:
  register: நவீன நிலையான தமிழில், தேவன் யோபிடம் எழுப்பும் சொல்லாட்சிக் கேள்வியின் வலிமையைத் தக்கவைத்துள்ளோம். ‘கூட்டை உயரத்தில் அமைக்கிறது’ என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பை விடச் சூழலின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; அதன் அடிப்படை உயர்த்தும் படிமம் குறிப்பில் விளக்கத் தேவையில்லாத அளவு பிரதான உரையிலேயே ‘உயரத்தில்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
