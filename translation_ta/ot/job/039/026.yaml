lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: உன் புரிந்துகொள்ளுதலினாலா
  rationale: வினாவிடை הֲ, கருவிப் பொருளுடைய מִן, ‘புரிந்துகொள்ளுதல்/பகுத்தறிவு’ எனும் בִּינָה, இரண்டாம் நபர் ஒருமை பின்னொட்டு ஆகியவற்றை நேரடியாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: יַאֲבֶר
  choice: மேலெழுந்து பறந்து
  rationale: אבר என்பதன் ஹிஃபில் வடிவம் பறவை சிறகெடுத்து மேலே பறக்கும் இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘மேலெழுந்து பறந்து’ என்பது அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נֵץ
  choice: வல்லூறு
  rationale: இந்த எபிரெயச் சொல் பருந்து/வல்லூறு வகையைச் சேர்ந்த வேட்டைப் பறவையைப் பொதுவாகக் குறிக்கக்கூடும்; இனத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் ‘வல்லூறு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִפְרֹשׂ
  choice: விரிக்கிறது
  rationale: פרשׂ என்பதன் அடிப்படைப் பொருள் ‘விரித்தல்’; முதன்மை வினையுடன் இணைந்த செயலைத் தமிழில் இயல்பான வினைமுற்றாகக் கொடுக்கிறது.
- source_word: כְּנָפוֹ
  choice: தன் சிறகுகளை
  rationale: மூலத்தில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருகிறது; பறவையின் பறத்தலைக் குறிக்கத் தமிழில் பன்மையான ‘சிறகுகளை’ இயல்பானது. உடைமை மீள்சுட்டாக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְתֵימָן
  choice: தெற்கை நோக்கி
  rationale: לְ திசையையும் תֵימָן தெற்கையும் குறிக்கின்றன; ‘தெற்கை நோக்கி’ என்பது திசை சார்ந்த பொருளை இயல்பாகத் தருகிறது.
