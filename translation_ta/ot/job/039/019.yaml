  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: ta
  text: 'குதிரைக்கு வலிமையைக் கொடுப்பது நீயா?


    அதன் கழுத்துக்குப் பிடரிமயிரை ஆடையாக அணிவிப்பது நீயா?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ரַעְמָה என்பதற்கு, ஒரு பழைய விளக்க மரபின்படி, ‘இடி’ என்றும் பொருள் கொள்ளலாம். ஆனால் இங்கு குதிரையின் கழுத்துக்கு ஆடை அணிவிக்கும் உருவகம் இருப்பதால், ‘பிடரிமயிர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: கொடுப்பவர் நீயா?
  rationale: கேள்வி இடைச்சொல்லுடன் வரும் இரண்டாம் நபர் ஒருமை வினை, யோபை நோக்கிய சொல்லாட்சிக் கேள்வியாக உள்ளது. தமிழில் இயல்பாகவும் நேரடியான சவாலைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לַסּוּס
  choice: குதிரைக்கு
  rationale: எபிரெய மொழியில் உள்ள குறிப்புச் சுட்டு, இங்கு குதிரை இனத்தைப் பொதுவாகக் குறிக்கும் கவித்துவப் பயன்பாடு. தமிழில் ‘குதிரைக்கு’ என்பது இயல்பாக அந்தப் பொதுப்பொருளைத் தருகிறது.
- source_word: גְּבוּרָה
  choice: வலிமை
  rationale: இந்தச் சொல் வலிமை, ஆற்றல், வீரியம் ஆகிய பொருள்களைக் கொள்ளலாம். சூழலில் குதிரையின் உடல் ஆற்றலைத் தெளிவாகக் குறிக்க ‘வலிமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֲתַלְבִּישׁ
  choice: ஆடையாக அணிவிப்பவர் நீயா?
  rationale: לבש என்பதன் ஹிஃபில் வடிவம் ‘உடுத்துவித்தல்/அணிவித்தல்’ எனப் பொருள்படும். கழுத்தை மயிரால் ஆடையிடும் உயிரோட்டமான உருவகத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: צַוָּארוֹ
  choice: அதன் கழுத்துக்கு
  rationale: ஆண்பால் ஒருமை பின்னொட்டு குதிரையைக் குறிக்கிறது; இது இலக்கணப் பால் மட்டுமே என்பதால், குறிப்பாக ஆண் குதிரை என்ற எண்ணத்தைச் சேர்க்காமல் தமிழின் இயல்பான அஃறிணை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רַעְמָה
  choice: பிடரிமயிரை
  rationale: சூழலில் குதிரையின் கழுத்தை அலங்கரிக்கும் மயிரைக் குறிக்கிறது. ‘பிடரிமயிர்’ என்பது கழுத்தில் வளரும் குதிரை மயிரை நவீன தமிழில் துல்லியமாகச் சொல்கிறது; ‘இடி’ என்ற பழைய விளக்க மரபும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
