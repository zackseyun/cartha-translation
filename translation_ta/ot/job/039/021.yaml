  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: ta
  text: அது பள்ளத்தாக்கில் குளம்பால் நிலத்தைக் கிளறி[a], தன் வலிமையில் களிகூர்கிறது; ஆயுதங்களை[b] எதிர்கொள்ளப் புறப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “பள்ளத்தாக்கில் தோண்டி” அல்லது “பள்ளத்தாக்கின் நிலத்தைக் குளம்பால் கீறி.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “தோண்டு”; இங்கு அது போர்க்குதிரையின் குளம்புச் செயலைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “போரை.” எபிரெயப் பெயர்ச்சொல் ஆயுதங்களையோ போர்க்கருவிகளையோ தொகுப்பாகவும், விரிவான பொருளில் ஆயுத மோதலாகிய போரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: குளம்பால் நிலத்தைக் கிளறி
  rationale: חפר என்பதன் அடிப்படைப் பொருள் ‘தோண்டு’ என்பதாகும். இங்கு போர்க்குதிரை குளம்பால் நிலத்தைக் கீறும் அல்லது கிளறும் செயலைக் குறிக்கிறது. இயல்பான தமிழ் காட்சியைத் தருவதற்காக ‘குளம்பால் நிலத்தைக் கிளறி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בָעֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: עֵמֶק பொதுவாகப் பள்ளத்தாக்கு அல்லது தாழ்நிலத்தைக் குறிக்கும்; ‘பள்ளத்தாக்கில்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וְיָשִׂישׂ
  choice: களிகூர்கிறது
  rationale: שׂושׂ மகிழ்ச்சி, பேருவகை, களிப்பு ஆகியவற்றைக் குறிக்கிறது. குதிரையின் வலிமைமிக்க உற்சாகத்தை ‘களிகூர்கிறது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּכֹחַ
  choice: தன் வலிமையில்
  rationale: בְּ + כֹּחַ என்ற அமைப்பின் ‘வலிமையில்’ என்ற நெகிழ்வைத் தக்கவைத்து, சூழலில் அது குதிரையின் வலிமை என்பதை ‘தன்’ தெளிவாக்குகிறது.
- source_word: יֵצֵא
  choice: புறப்படுகிறது
  rationale: יָצָא என்பதன் அடிப்படைப் பொருள் ‘வெளியே செல்/புறப்படு.’ மூலத்தில் இல்லாத ‘பாய்கிறது’ போன்ற கூடுதல் வேக உணர்வைச் சேர்க்காமல் ‘புறப்படுகிறது’ என வழங்கப்பட்டது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: לקראת என்பது ஒருவரையோ ஒன்றையோ சந்திக்க அல்லது அதை நோக்கிச் செல்லுதல் என்ற பொருளுடையது. போர்ச் சூழலில் ‘எதிர்கொள்ள’ இயல்பாக உள்ளது.
- source_word: נָשֶׁק
  choice: ஆயுதங்களை
  rationale: נֶשֶׁק போராயுதங்களை அல்லது ஆயுதப்படையைத் தொகுப்பாகக் குறிக்கலாம். விரிந்த ‘போர்’ என்ற பொருளைவிட மூலத்தின் concrete martial sense-ஐ ‘ஆயுதங்களை’ தக்கவைக்கிறது.
