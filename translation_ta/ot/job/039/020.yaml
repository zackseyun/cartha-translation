  text: הְֽ֭/תַרְעִישֶׁ/נּוּ כָּ/אַרְבֶּ֑ה ה֖וֹד נַחְר֣/וֹ אֵימָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: ta
  text: 'வெட்டுக்கிளியைப்போல் அதைத் துள்ளவிடுவது நீயா?[a]


    அதன் சீறுமூச்சின் மாட்சிமை திகிலூட்டுகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெட்டுக்கிளியைப்போல் அதை அதிரவிடுவது நீயா?” எபிரெய வினைச்சொல் குலுக்குதல், அதிரச் செய்தல், அல்லது வலிமையாக நகரச் செய்தல் ஆகிய பொருள்களைத் தரலாம்; இவ்வுருவகம் இயக்கத்தோடு ஒலியையும் வலியுறுத்துவதாகச் சிலர் கருதுகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: அதைத் துள்ளச் செய்வது நீயா?
  rationale: רעשׁ என்பதன் ஹிஃபில் வடிவம் குலுக்குதல், அதிரச் செய்தல், அல்லது வலிமையாக நகரச் செய்தல் என்ற பொருள்களைத் தரலாம். போர்க்குதிரையையும் வெட்டுக்கிளியையும் ஒப்பிடும் இச்சூழலில், திடீரென வலிமையுடன் துள்ளும் இயக்கமே முதன்மையாகத் தெரிகிறது; கேள்வி வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: כָּאַרְבֶּה
  choice: வெட்டுக்கிளியைப்போல்
  rationale: ஒருமை வடிவம் இனத்தைக் கூட்டாகக் குறிக்கலாம். தமிழில் இயல்பான உவமையாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: הוֹד
  choice: மாட்சிமை
  rationale: மகத்துவம், பொலிவு, கம்பீரம் ஆகிய உயர்ந்த கவித்துவப் பொருள்களை உள்ளடக்கும் சொல்லாக ‘மாட்சிமை’ பொருந்துகிறது.
- source_word: נַחְרוֹ
  choice: அதன் சீறுமூச்சின்
  rationale: மூக்குத்துளைகளின் வழியே வலிமையாக வெளிப்படும் குதிரையின் மூச்சொலியைக் குறிக்கிறது. ‘சீறுமூச்சு’ இயக்கத்தையும் ஒலியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵימָה
  choice: திகிலூட்டுகிறது
  rationale: ‘திகில்/அச்சம்’ என்னும் பெயர்ச்சொல் பொருளை இயல்பான தமிழ் பயனிலைத் தொடராகத் தருகிறது; எபிரெயச் சொல்லின் வலிமை காக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், தெய்வீக உரையின் நேரடியான கேள்வித் தொனியையும் எபிரெயக் கவிதையின் கம்பீரத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. குதிரையைத் தமிழில் இயல்பாக அஃறிணையாகக் குறிப்பிட்டுள்ளது.
