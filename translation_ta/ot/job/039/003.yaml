lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: அவை குனிந்து
  rationale: כרע என்பது உடலைத் தாழ்த்துதல், குனிதல் அல்லது மண்டியிடுதல் எனப் பொருள்படும். இங்கு விலங்குகள் ஈனும்போது உடலைத் தாழ்த்துவதைக் குறிக்க இயல்பான தமிழில் ‘குனிந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יַלְדֵיהֶן
  choice: தங்கள் குட்டிகளை
  rationale: ילד இங்கு பெண் விலங்குகளிடமிருந்து பிறக்கும் சந்ததியைக் குறிக்கிறது; விலங்குகளைப் பற்றிய சூழலில் ‘குட்டிகள்’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: תְּפַלַּחְנָה
  choice: ஈன்றெடுக்கின்றன
  rationale: פלח என்ற வினையின் அடிப்படைப் படிமத்தில் பிளத்தல் அல்லது பீறிட்டு வெளிவரச் செய்தல் என்ற நுணுக்கம் இருந்தாலும், இப்பிறப்புச் சூழலில் குட்டிகளைப் பெற்றெடுப்பதே பொருள். ‘ஈன்றெடுக்கின்றன’ கவிதைநயத்தையும் தெளிவையும் காக்கிறது.
- source_word: חֶבְלֵיהֶם
  choice: தங்கள் பேறுகால வேதனைகளை
  rationale: חבל என்பதற்குக் கயிறுகள் என்ற பொருளும் உண்டு; ஆனால் இங்குள்ள ஈனும் சூழலும் கவிதை இணைப்பும் ‘பேறுகால வேதனைகள்’ என்ற பொருளைக் கோருகின்றன. எபிரெய உரையில் பாலினப் பின்னொட்டு மாறுபட்டிருந்தாலும், அது முன்னுள்ள பெண் விலங்குகளையே சூழலின்படி குறிக்கிறது.
- source_word: תְּשַׁלַּחְנָה
  choice: அகற்றிவிடுகின்றன
  rationale: שלח என்பதன் அடிப்படைப் பொருள் அனுப்புதல் அல்லது விடுவித்தல். பிரசவத்திற்குப் பின் வேதனைகள் நீங்குவதை இயல்பான தமிழில் ‘அகற்றிவிடுகின்றன’ என அளித்துள்ளோம்; மூலத்தின் செயப்படிமம் இதனால் காக்கப்படுகிறது.
