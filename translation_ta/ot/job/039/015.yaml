  edition: WLC
  text: וַ֭/תִּשְׁכַּח כִּי רֶ֣גֶל תְּזוּרֶ֑/הָ וְ/חַיַּ֖ת הַ/שָּׂדֶ֣ה תְּדוּשֶֽׁ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/015.yaml
  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: ta
  text: ஒரு கால் அவற்றை[a] நசுக்கிவிடக்கூடும் என்பதையும், காட்டு விலங்கு[b] அவற்றை மிதித்துவிடக்கூடும் என்பதையும் அது மறந்துவிடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘அதை நசுக்கிவிடக்கூடும் … அதை மிதித்துவிடக்கூடும்.’ எபிரெய மொழியிலுள்ள பெண்பால் ஒருமை பின்னொட்டு, அங்கே விட்டுவந்த முட்டைகளை ஒரு தொகுதியாகச் சுட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘வெளியின் விலங்கு’; இது திறந்த நிலத்தில் வாழும் ஒரு காட்டு விலங்கைக் குறிக்கும் எபிரெயச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: அது மறந்துவிடுகிறது
  rationale: שׁכח என்பதன் Qal wayyiqtol மூன்றாம் நபர் பெண்பால் ஒருமை வடிவம். தீக்கோழியைப் பற்றிய கவிதைநடையிலான உயிரோட்டமான தொடர்விளக்கத்திற்கு நிகழ்காலத் தமிழ் இயல்பாக அமைகிறது.
- source_word: כִּי
  choice: என்பதையும் … என்பதையும்
  rationale: இங்கு כִּי காரணத்தை அல்ல, மறக்கப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. இரண்டு இணையான கூற்றுகளையும் தமிழில் இயல்பாக இணைக்க இந்த அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: רֶגֶל
  choice: ஒரு கால்
  rationale: ஒருமை பெயர்ச்சொல் குறிப்பிட்ட ஒரு காலை அல்லாமல் எந்தக் காலையும் குறிக்கும் பொதுவான பொருளில் வருகிறது; நேரடியான காட்சியையும் இது காக்கிறது.
- source_word: תְּזוּרֶהָ
  choice: அவற்றை நசுக்கிவிடக்கூடும்
  rationale: இந்தச் சூழலில் זוּר/זור என்பது காலால் மிதிப்பதால் ஏற்படும் சேதத்தைக் குறிக்கிறது. முட்டைகளைத் தொகுதியாகச் சுட்டும் பெண்பால் ஒருமை பின்னொட்டு, இயல்பான தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது; அதன் இலக்கண வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்கு
  rationale: சொல்லுக்கு சொல் ‘வெளியின் விலங்கு’ எனும் எபிரெயச் சொற்றொடர், திறந்த நிலத்தில் வாழும் காட்டுவிலங்கைச் சுட்டுகிறது. ‘காட்டு விலங்கு’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: תְּדוּשֶׁהָ
  choice: அவற்றை மிதித்துவிடக்கூடும்
  rationale: דושׁ என்பதன் அடிப்படைப் பொருள் ‘மிதித்தல்’. இது முந்தைய அடியுடன் இணையான செயலைத் தெளிவாக வெளிப்படுத்துகிறது; பெண்பால் ஒருமை பின்னொட்டு சூழலுக்கேற்ப பன்மையாக வழங்கப்பட்டுள்ளது.
