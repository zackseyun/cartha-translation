translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், கவிதையின் காட்சித்தன்மையைப் பேணும் கண்ணியமான எளிய நடை பயன்படுத்தப்பட்டுள்ளது. தீக்கோழிக்கான பெண்பால் இலக்கணத்தைத் தமிழில் செயற்கையாகத் திணிக்காமல் ‘அது’ என இயல்பாகக் குறிப்பிடப்பட்டுள்ளது; சாத்தியத்தை வெளிப்படுத்த ‘-க்கூடும்’ பயன்படுத்தப்பட்டுள்ளது.
