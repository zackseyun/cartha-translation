  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: ta
  text: அங்கிருந்து அது உணவைத் தேடுகிறது[a]; அதன் கண்கள் தொலைவிலிருந்து நோக்குகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் கண்கள் தொலைவிலிருந்து அதைக் காண்கின்றன.” தொலைவில் இருக்கும் இரையைக் கண்டறிவதை வலியுறுத்தும் வகையில் எபிரெய வாசகத்தை இவ்வாறும் பொருள்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: கழுகு இருக்கும் உயரமான இடத்தையே அதன் பார்வை தொடங்கும் இடமாகச் சுட்டுகிறது; இது தமிழில் இயல்பான இடவியல் சொல்லாக்கம்.
- source_word: חָפַר
  choice: தேடுகிறது
  rationale: இந்த வினை பொதுவாக ‘தோண்டுதல்’ என்று பொருள்பட்டாலும், கழுகு உணவைத் தேடும் இச்சூழலில் ‘தேடுகிறது’ என்பது அதன் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹכֶל
  choice: உணவை
  rationale: எபிரெயச் சொல் பொதுவாக ‘உணவு’ என்று பொருள்படும். சூழலில் அது இரையைக் குறிக்கலாம்; இருப்பினும் ‘உணவு’ மூலத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לְמֵרָחוֹק
  choice: தொலைவிலிருந்தே
  rationale: மிகுந்த தூரத்திலிருந்து பார்ப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘-ஏ’ கழுகின் தொலைநோக்குப் பார்வையை வலியுறுத்துகிறது.
- source_word: עֵינָיו יַבִּיטוּ
  choice: அதன் கண்கள் நோக்குகின்றன
  rationale: ‘கண்கள்’ என்ற வெளிப்படையான உருவகத்தையும், குறிவைத்துப் பார்ப்பதைக் குறிக்கும் வினையின் அடிப்படைச் சாயலையும் காக்கிறது.
