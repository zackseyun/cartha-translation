translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கழுகைக் குறிக்க இயல்பான ஒருமை அஃறிணைப் பெயரான ‘அது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உருவகத்தைப் பாதுகாக்க ‘அதன் கண்கள்’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
