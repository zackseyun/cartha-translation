  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: ta
  text: 'அவை நிறைவேற்றும் மாதங்களை நீ எண்ணுகிறாயா?

    அவை ஈனும் நேரத்தை நீ அறிந்திருக்கிறாயா?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: நீ எண்ணுகிறாயா?
  rationale: ספר என்பதன் Qal முற்றுப்பெறா வடிவம் இங்கு தேவன் கேட்கும் சொல்லாட்சிக் கேள்வியாக உள்ளது. நிகழ்கால வினாவாக மொழிபெயர்ப்பது தமிழில் இயல்பாகவும் உரையாடலின் ஓட்டத்திற்கு ஏற்றதாகவும் இருக்கிறது.
- source_word: יְרָחִים
  choice: மாதங்களை
  rationale: இந்தச் சொல் பொதுவாக ‘மாதங்கள்’ என்று பொருள்படும். ‘சந்திர மாதங்கள்’ என விரிவுபடுத்துவது மூலத்தில் இல்லாத அளவுக்கு குறிப்பாக்கிவிடும்.
- source_word: תְּמַלֶּאנָה
  choice: அவை நிறைவேற்றும்
  rationale: מלא என்பதன் Piel, பெண்பால் பன்மை வடிவம்; முன் வசனத்தில் கூறப்பட்ட பெண் விலங்குகளைச் சுட்டுகிறது. கருவுற்ற காலத்தின் மாதங்கள் முழுமை பெறுவதே கருத்து. மூலத்தின் செயப்பாட்டு வடிவத்தையும் உள்ளார்ந்த உருவகத்தையும் காக்க ‘நிறைவேற்றும்’ பயன்படுத்தப்பட்டது.
- source_word: וְיָדַעְתָּ
  choice: நீ அறிந்திருக்கிறாயா?
  rationale: தொடர்ச்சியான சொல்லாட்சிக் கேள்வியில் வரும் Qal perfect 2ms. தமிழில் தற்போதைய அறிவைப் பற்றிக் கேட்கும் ‘அறிந்திருக்கிறாயா?’ என்பது இயல்பாக உள்ளது.
- source_word: עֵת
  choice: நேரத்தை
  rationale: עת என்பது நேரம் அல்லது குறிப்பிட்ட காலத்தைக் குறிக்கலாம். ‘நேரம்’ மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது; ‘நியமிக்கப்பட்ட நேரம்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
- source_word: לִדְתָּנָה
  choice: அவை ஈனும்
  rationale: ילד என்பதன் infinitive construct, 3fp பின்னொட்டுடன், அந்தப் பெண் விலங்குகள் குட்டிகளைப் பெறுவதைக் குறிக்கிறது. விலங்குகளின் பிரசவத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல் ‘ஈனும்’ ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனுடைய கண்ணியமான சொல்லாட்சிக் கேள்வியின் தொனி காக்கப்பட்டுள்ளது. விலங்குகளைக் குறிக்க இயல்பான ‘அவை’ என்பதும், அவை குட்டிகளைப் பெறுவதைக் குறிக்க ‘ஈனும்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. மூல எபிரெயத்தின் சற்றே அசாதாரணமான செயப்பாட்டு அமைப்பு முதன்மை உரையில் தக்கவைக்கப்பட்டு, மேலும் இயல்பான தமிழ் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
