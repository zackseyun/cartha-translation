  source_fidelity: 'மூல எபிரெய வினாவாக்கியத்தின் இரு கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: காட்டாடுகளின் ஈற்றுக்காலத்தை அறிதல், பெண் மான்களின் பிரசவநிலையைக் கவனித்தல். יַעֲלֵי סָלַע என்பதன் பாறை/மலைவாழ் காட்டு ஆடு பொருளும், אַיָּלוֹת என்பதன் பெண்பால் குறிப்பும் தெளிவாக வெளிப்படுகின்றன. ‘கவனிக்கிறாயா?’ என்பது תִּשְׁמֹר-இன் சூழல்சார்ந்த ‘கவனித்து நோக்கு/கண்காணி’ பொருளை, பாதுகாப்புப் பொறுப்பைத் திணிக்காமல், நன்றாகக் கொடுக்கிறது.'
