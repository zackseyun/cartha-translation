  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: ta
  text: பாறைகளில் வாழும் காட்டாடுகள்[a] குட்டிபோடும் காலம் உனக்குத் தெரியுமா? பெண் மான்கள்[b] பிரசவ வேதனைப்படுவதை நீ கவனிக்கிறாயா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், ‘பாறையின் காட்டாடுகள்’; இது மலைப்பாறைகளில் வாழும் காட்டு ஆடுகளை, ஒருவேளை ஐபெக்ஸ் இனத்தை, குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் குறிப்பாகப் பெண் மான்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இவ்வினைச்சொல்லுக்கு ‘உற்றுப் பார்,’ ‘கண்காணி,’ அல்லது ‘காவல் காத்துக்கொள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: உனக்குத் தெரியுமா?
  rationale: வினாவிடைத் துகள் הֲ உடன் வரும் ידע வினை, சூழலில் இறைவன் யோபிடம் எழுப்பும் சொல்லாட்சிசார் கேள்வியாக உள்ளது; நவீன தமிழில் இவ்வாறு இயல்பாக வெளிப்படுகிறது.
- source_word: עֵת לֶדֶת
  choice: குட்டிபோடும் காலம்
  rationale: עֵת என்பது ‘காலம்/வேளை’; ילד வினையின் infinitive construct விலங்குகளின் ஈற்றைக் குறிக்கிறது. ‘குட்டிபோடும் காலம்’ தெளிவான இயல்புத் தமிழ்.
- source_word: יַעֲלֵי סָלַע
  choice: பாறைகளில் வாழும் காட்டாடுகள்
  rationale: சொல்லுக்கு சொல் ‘பாறையின் காட்டாடுகள்’; இது மலைப்பாறைப் பகுதிகளில் வாழும் காட்டு ஆடுகளை, ஒருவேளை ஐபெக்ஸ் இனத்தை, குறிக்கிறது. இனத்தைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் வாழிடத்தையும் காட்டுத் தன்மையையும் காக்கிறது.
- source_word: חֹלֵל
  choice: பிரசவ வேதனைப்படுவதை
  rationale: חול இங்கு ஈற்றின்போது நெளிதல் அல்லது பிரசவ வேதனைப்படுதல் என்ற பொருளில் உள்ளது; ‘பிரசவ வேதனைப்படுதல்’ செயற்பாட்டையும் நிலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַיָּלוֹת
  choice: பெண் மான்கள்
  rationale: பெண்பால் பன்மை வடிவம் என்பதால் பொதுவான ‘மான்கள்’ என்பதைக் காட்டிலும் ‘பெண் மான்கள்’ மூலத்தின் பாலினக் குறிப்பைத் தெளிவாகக் காக்கிறது.
- source_word: תִּשְׁמֹר
  choice: நீ கவனிக்கிறாயா?
  rationale: שׁמר என்பதற்கு காத்தல், கண்காணித்தல், உற்றுக் கவனித்தல் ஆகிய பொருள்கள் உண்டு. இங்கு ‘கவனிக்கிறாயா’ என்பது வெறும் பார்வையையும் பாதுகாப்புப் பொறுப்பையும் கட்டாயப்படுத்தாமல் மூலத்தின் பொருள் விரிவை இயல்பாக வைத்திருக்கிறது.
theological_decisions:
- issue: תִּשְׁמֹר என்பதன் பொருள்—உற்றுக் கவனித்தலா அல்லது பாதுகாத்துப் பராமரித்தலா
  choice: நீ கவனிக்கிறாயா?
  alternative: நீ காவல் காக்கிறாயா? / நீ கண்காணிக்கிறாயா?
  rationale: சூழல் படைப்பின் ஈற்றுக்காலத்தை அறிந்து கவனிக்கும் திறனைச் சுட்டுகிறது. ‘காவல் காக்கிறாயா’ என்பது பராமரிப்பு அல்லது பாதுகாப்பு என்ற கருத்தை அளவுக்கு மீறி முன்வைக்கலாம்; ‘கவனிக்கிறாயா’ இரு சாத்தியங்களுக்கும் இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான இரு சொல்லாட்சிசார் கேள்விகளாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘குட்டிபோடும்’ என்பது விலங்குகளின் ஈற்றுக்கு இயல்பான பொதுமொழி; ‘பிரசவ வேதனை’ மூலத்தின் நெளிதல்/ஈற்றுவலி நுணுக்கத்தை dignified register-இல் காக்கிறது. ஒருமை இரண்டாம் நபர் ‘உனக்கு/நீ’ எபிரெய 2ms வடிவத்தைப் பிரதிபலிக்கிறது.
