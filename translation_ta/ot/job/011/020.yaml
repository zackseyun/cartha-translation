  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: ta
  text: 'ஆனால் பொல்லாதவர்களின் கண்கள் சோர்ந்துபோகும்;

    அவர்களிடமிருந்து தப்பிக்கும் வழி மறைந்துபோகும்;

    அவர்களுடைய நம்பிக்கை உயிர் பிரியும் மூச்சே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய நம்பிக்கை உயிரை வெளியே விடுதலே.” இதற்கான எபிரேயச் சொற்றொடர் பொருள் காணக் கடினமானது; அது உயிர் பிரியும் கடைசி மூச்சைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: பொல்லாதவர்களின் கண்கள் சோர்ந்துபோகும்
  rationale: ‘கண்கள்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, எதிர்பார்த்துக் காத்திருப்பதால் கண்கள் வலுவிழப்பதைக் குறிக்கும் כלה வினையின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: அவர்களுக்கு அடைக்கலம் இல்லாமற்போகும்
  rationale: מָנוֹס என்பது தப்பிச் செல்லும் வழி அல்லது பாதுகாப்பான புகலிடம் எனப் பொருள்படலாம். இங்கு ‘அடைக்கலம்’ இணைவரியின் நம்பிக்கையின்மையோடு இயல்பாகப் பொருந்துகிறது; ‘இல்லாமற்போகும்’ என்பது அது அவர்களிடமிருந்து மறைந்துபோவதைத் தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: תִקְוָתָם
  choice: அவர்களுடைய நம்பிக்கை
  rationale: תִּקְוָה என்பதன் வழக்கமான பொருளான ‘நம்பிக்கை’யை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַפַּח נָפֶשׁ
  choice: உயிர் பிரியும் மூச்சு
  rationale: கடினமான இச்சொற்றொடரில் உள்ள மூச்சு மற்றும் உயிர் உருவகங்களைத் தக்கவைத்து, மரணத் தருவாயின் இறுதி மூச்சைக் குறிக்கும் சாத்தியமான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழில், கவிதைநடையின் மூன்று இணை வரிகளையும் மரியாதையான தொனியையும் காத்துள்ளோம். ‘கண்கள்’ மற்றும் ‘மூச்சு’ என்ற மூல உருவகங்கள் நீக்கப்படவில்லை; கடினமான இறுதி சொற்றொடரின் நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
