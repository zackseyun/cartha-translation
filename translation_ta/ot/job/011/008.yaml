source:
  edition: WLC
  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: ta
  text: அது வானங்களைவிட உயரமானது—உன்னால் என்ன செய்ய முடியும்? பாதாளத்தைவிட ஆழமானது—உன்னால் என்ன அறிய முடியும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “கல்லறையைவிட ஆழமானது” அல்லது “இறந்தோரின் உலகத்தைவிட ஆழமானது.” எபிரெயத்தில்: ஷியோல்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: வானங்களைவிட உயரமானது
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘வானங்களின் உயரங்கள்’ எனப் பொருள்படும். முந்தைய வசனத்திலிருந்து தொடரும் மறைமுகப் பொருளைச் சுட்டி, கவிதை இணைநிலையை இயல்பான தமிழில் ஒப்பீடாக வெளிப்படுத்துகிறது.
- source_word: מַה
  choice: என்ன
  rationale: இரு அரையடிகளிலும் வினாவை அறிமுகப்படுத்தும் சொல்லின் நேரடியான வலிமையையும் சொல்லாட்சியையும் காக்கிறது.
- source_word: תִּפְעָל
  choice: உன்னால் என்ன செய்ய முடியும்
  rationale: פעל என்பதன் பொருள் ‘செய், நிறைவேற்று.’ இங்குள்ள முற்றுப்பெறா வினை மனிதனின் திறனைச் சவாலிடும் வினாவாக இருப்பதால், ‘முடியும்’ என்பது அதன் சூழல் சார்ந்த வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֲמֻקָּה
  choice: ஆழமானது
  rationale: முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் மறைமுகப் பொருளுடன் இயையும் ‘ஆழமான’ என்ற பெயரடை. ‘பாதாளத்தைவிட’ என்பதே ஒப்பீட்டைக் காட்டுவதால் தமிழில் தனியாக ‘மேலும் ஆழமானது’ எனச் சேர்க்க வேண்டியதில்லை.
- source_word: מִשְּׁאוֹל
  choice: பாதாளத்தைவிட
  rationale: מִן ஒப்பீட்டைக் குறிக்கிறது. שְׁאוֹל என்பது வெறும் கல்லறையைவிட விரிவாக இறந்தோரின் கீழுலகைக் குறிக்கக்கூடும்; தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘பாதாளம்’ அந்தக் கருத்தைச் சுருக்காமல் இயல்பாகத் தருகிறது. அடிக்குறிப்பு மூலச்சொல்லையும் மாற்றுப் பொருள்களையும் தெரிவிக்கிறது.
- source_word: תֵּדָע
  choice: உன்னால் என்ன அறிய முடியும்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறி.’ இணையான முதல் வினாவைப் போல இதுவும் மனித அறிவின் வரம்பைச் சுட்டும் திறன் வினாவாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: கல்லறை; இறந்தோரின் உலகம்; ஷியோல்
  rationale: இந்தச் சொல் ஆழத்தைப் பற்றிய கவிதை ஒப்பீட்டில் வருகிறது. ‘கல்லறை’ என்பது பொருளை உடல் அடக்கத்துக்கு மட்டும் குறுக்கக்கூடும்; ‘நரகம்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத தண்டனை சார்ந்த கருத்தைச் சேர்க்கக்கூடும். ‘பாதாளம்’ இறந்தோரின் கீழுலகைக் குறிக்கும் பரந்த கருத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் விருப்பங்களைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியமும் இரு அரையடிகளின் இணைநிலையும் காக்கப்பட்டுள்ளன. ஒருமை ஆண்பால் முகவரியான எபிரெய வடிவத்துக்கு இயல்பாக ‘உன்னால்’ பயன்படுத்தப்பட்டுள்ளது. ‘நரகம்’ தவிர்க்கப்பட்டுள்ளது; அது மூலச்சொல்லின் பரந்த பொருளை தேவையின்றி சமயக் கோட்பாட்டு வகையில் குறுக்கக்கூடும்.
