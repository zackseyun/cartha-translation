  text: אִם יַחֲלֹ֥ף וְ/יַסְגִּ֑יר וְ֝/יַקְהִ֗יל וּ/מִ֣י יְשִׁיבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: ta
  text: அவர் கடந்து சென்று, ஒருவரை அடைத்து வைத்து, அவையைக் கூட்டினால்[b], அவரைத் திருப்ப யாரால் முடியும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் செய்ததை மாற்ற யாரால் முடியும்?” எபிரெயச் சொல்லை, செய்பவராகிய “அவரை” திருப்புவது என்றோ, அவர் செய்த செயலைப் பொதுவாக மாற்றுவது என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவையைக் கூட்டுதல்” என்பதை “ஒன்றுகூட்டுதல்” அல்லது “கூட்டிச் சேர்த்தல்” என்றும் மொழிபெயர்க்கலாம்; இங்கு நீதித்துறை சார்ந்த நுண்பொருளும் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: —ஆல் (கூட்டினால்)
  rationale: எபிரெய நிபந்தனைச் சொல்லின் பொருளைத் தமிழில் இயல்பான நிபந்தனை வினைமுற்றால் வெளிப்படுத்துகிறது.
- source_word: יַחֲלֹף
  choice: கடந்து சென்று
  rationale: חלף என்பதன் ‘கடந்து செல்லுதல்’ என்ற அடிப்படைப் படிமத்தை அழிவைக் குறிக்கும் பொருளாக மிகைப்படுத்தாமல் காக்கிறது.
- source_word: וְיַסְגִּיר
  choice: ஒருவரை அடைத்துவைத்து
  rationale: סגר என்பதன் காரணவினை வடிவம் ‘அடைத்தல், காவலில் வைத்தல், ஒப்படைத்தல்’ எனப் பொருள்படலாம். இங்கு ‘அடைத்துவைத்து’ என்பது தெளிவான படிமத்தைக் காக்கிறது; எபிரெயத்தில் மறைமுகமாக உள்ள செயப்படுபொருள் தமிழின் இயல்புக்காக ‘ஒருவரை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְיַקְהִיל
  choice: அவையைக் கூட்டினால்
  rationale: קהל என்பதன் காரணவினைப் பொருளான ‘ஒன்றுகூட்டுதல், அவையைக் கூட்டுதல்’ என்பதைக் காட்டுகிறது; ‘அவை’ என்பது பொதுவான அல்லது நீதிமன்றச் சூழலையும் திறந்தவாறு வைக்கிறது.
- source_word: וּמִי
  choice: யாரால் முடியும்?
  rationale: இணைப்புச் சொல்லோடு வரும் வினாவைத் தமிழில் இயல்பான, இயலாமையை வலியுறுத்தும் சொல்லாட்சியாக அளிக்கிறது.
- source_word: יְשִׁיבֶנּוּ
  choice: அவரைத் திருப்பிவிட
  rationale: שוב என்பதன் காரணவினைப் பொருளான ‘திரும்பச் செய்தல், திருப்புதல்’ என்பதையும் ஆண்பால் ஒருமை பின்னொட்டின் தனிப்பட்ட குறிப்பையும் காக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் வினைகளின் எழுவாயும் இறுதி பின்னொட்டின் குறிப்பும்
  choice: எழுவாய் தேவனைக் குறிப்பதாகவும், இறுதி பின்னொட்டு தனிப்பட்ட முறையில் ‘அவரை’ எனவும் மொழிபெயர்க்கப்பட்டது.
  alternative: இறுதி பின்னொட்டை அவர் செய்த செயலைக் குறிக்கும் ‘அதை’ என்று பொருள்கொண்டு, ‘அதை மாற்றியமைக்க யாரால் முடியும்?’ என மொழிபெயர்க்கலாம்.
  rationale: சுற்றியுள்ள பகுதி தேவனுடைய அறிவையும் தடுக்க முடியாத செயலையும் பேசுவதால் தனிப்பட்ட குறிப்பு இயல்பானது. எனினும் செயலை மாற்றுதல் என்ற பொருளும் சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சபை’ என்பதனால் ஏற்படக்கூடிய தனிப்பட்ட சமய அமைப்புச் சாயலைத் தவிர்த்து, பொது அல்லது நீதித்துறைச் சூழலைத் திறந்தவாறு வைக்க ‘அவை’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
