source:
  edition: WLC
  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: ta
  text: அதன் அளவு பூமியைவிட நீளமானது; கடலைவிட அகலமானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் பரப்பு பூமியைவிட நீண்டது; கடலைவிட விரிந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: நீளமானது
  rationale: இது מִדָּהּ என்பதுடன் பொருந்தும் பெண்பால் ஒருமை பெயரடை. ஒப்பீட்டைக் குறிக்கும் מִן உடன் வருவதால், தமிழில் ‘பூமியைவிட நீளமானது’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאֶרֶץ
  choice: பூமியைவிட
  rationale: இங்குள்ள מִן பிரிவை அல்ல, ஒப்பீட்டைக் குறிக்கிறது. ‘கடல்’ என்பதற்கு இணையாக வரும் அண்டவெளி சார்ந்த ஒப்பீட்டில் אֶרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது.
- source_word: מִדָּהּ
  choice: அதன் அளவு
  rationale: מִדָּה என்பது அளவு அல்லது பரப்பு எனப் பொருள்படும். மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டைத் தமிழில் ‘அதன்’ என்று மொழிபெயர்ப்பது, முந்தைய வசனத்திலுள்ள கருத்தைக் குறிப்பதுடன் அதன் அடையாளத்தை இவ்வசனத்துக்குள் விளக்கிச் சேர்க்காமல் காக்கிறது.
- source_word: וּרְחָבָה
  choice: கடலைவிட அகலமானது
  rationale: இது אֲרֻכָּה என்பதற்கு இணையான பெண்பால் ஒருமை பெயரடை. அடுத்துள்ள ஒப்பீட்டு מִן காரணமாக ‘அகலமானது’ என்ற ஒப்பீட்டு அமைப்பு இயல்பானது.
- source_word: מִנִּי יָם
  choice: கடலைவிட
  rationale: מִנִּי என்பது கவிதை நடையிலான מִן வடிவம்; இங்கு ஒப்பீட்டைக் குறிக்கிறது. יָם என்பதன் நேரடியான படிமத்தை ‘கடல்’ காக்கிறது.
theological_decisions:
- issue: ‘அதன்’ என்பதன் முன்னிலைச் சுட்டு
  choice: முந்தைய வசனத்தின் கருத்தைச் சுட்டும் ‘அதன்’ என்ற வடிவம் அப்படியே வைக்கப்பட்டது.
  alternative: ‘கடவுளின் ஞானத்தின் அளவு’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: எபிரெய உரை பெண்பால் ஒருமை பின்னொட்டை மட்டுமே கொண்டுள்ளது; குறிப்பிட்ட பெயர்ச்சொல்லை இவ்வசனத்தில் மீண்டும் சொல்லவில்லை. ஆகவே விளக்கத்தை உரைக்குள் இறக்காமல் மூலத்தின் சுட்டுப்பொருள் சார்ந்த திறந்த தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவாக்கிய அமைப்பும் பூமி–கடல் ஒப்புமையும் காக்கப்பட்டுள்ளன.
