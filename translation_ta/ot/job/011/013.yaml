  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: ta
  text: நீ உன் உள்ளத்தை ஆயத்தப்படுத்தி, அவரை நோக்கி உன் கைகளை விரித்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை நோக்கி உன் உள்ளங்கையை விரித்தால்.’ எபிரெயத்தில் ‘உள்ளங்கை/கை’ என்ற பெயர்ச்சொல் ஒருமையில் உள்ளது; ஆனால் இந்தச் சொற்றொடர் பொதுவாக ஜெபத்தில் கைகளை விரிக்கும் அசைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -ஆல் (விரித்தால்)
  rationale: இது நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கியத்தின் இறுதி வினையில் வரும் ‘-ஆல்’ விகுதி அந்த நிபந்தனைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: யோபுவை நேரடியாகக் குறிப்பிடும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்; மூலத்தில் உள்ள வலியுறுத்தலைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: הֲכִינוֹתָ
  choice: ஆயத்தப்படுத்தி
  rationale: כון என்பதன் ஹிஃபில் வடிவம் உறுதிப்படுத்துதல், தயாராக்குதல், சரியாகச் செலுத்துதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. உள்ளார்ந்த செயலை அளவுக்கு மீறி விளக்காமல், இங்கு ‘ஆயத்தப்படுத்தி’ இயல்பாகப் பொருந்துகிறது.
- source_word: לִבֶּךָ
  choice: உன் உள்ளத்தை
  rationale: לֵב என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, விருப்பம், தீர்மானம் உட்பட்ட அக மனிதனைக் குறிக்கலாம். நவீன தமிழில் ‘உள்ளம்’ இந்த விரிந்த பொருளை இயல்பாக எடுத்துரைக்கிறது.
- source_word: וּפָרַשְׂתָּ
  choice: விரித்தால்
  rationale: פרשׂ என்பதன் விரித்தல் அல்லது நீட்டுதல் என்ற பொருளைத் தருகிறது. இங்கு ஜெபத்தின் உடல் அசைவைக் குறிக்க ‘கைகளை விரித்தால்’ இயல்பான தமிழ்.
- source_word: אֵלָיו
  choice: அவரை நோக்கி
  rationale: ஆண்பால் ஒருமை சுட்டுப்பெயரை நோக்கிய திசையை முன்னிடைச்சொல் காட்டுகிறது. சூழலில் இது கடவுளைக் குறித்தாலும், மூலத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரைச் சேர்க்காமல் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: כַּפֶּךָ
  choice: உன் கைகளை
  rationale: எபிரெயத்தில் ‘உன் உள்ளங்கை/கை’ என்று ஒருமையில் இருந்தாலும், இது ஜெபத்தில் கைகளை விரிக்கும் வழக்கமான அசைவைக் குறிக்கிறது. தமிழில் பன்மை இயல்பாக இருப்பதால் அதைப் பயன்படுத்தி, சொல் வடிவிலுள்ள மாற்றை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: אֵלָיו என்பதிலுள்ள சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: சூழலின்படி கடவுளைக் குறிக்கும் ‘அவரை நோக்கி’ என்று மொழிபெயர்த்தல்
  alternative: தெளிவுக்காக ‘கடவுளை நோக்கி’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: உடனடிச் சூழல் கடவுளுக்கு முன்பான மனமாற்றத்தையும் மன்றாட்டையும் பற்றியது. எனினும், மூல உரை பெயர்ச்சொல்லுக்குப் பதிலாக சுட்டுப்பெயரையே பயன்படுத்துவதால், ‘அவரை’ என்பது அதன் வடிவத்தையும் சூழல் தரும் தெளிவையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் நிறைவு பெறும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
