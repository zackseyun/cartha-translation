source:
  edition: WLC
  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: ta
  text: ஆனால், அறிவற்ற மனிதன் அறிவடைவான்—காட்டுக் கழுதைக் குட்டி மனிதனாகப் பிறக்கும்போது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “குழிவான மனிதன் இதயத்தைப் பெறுவான்.” இங்கு “இதயத்தைப் பெறுதல்” என்பது அறிவையோ பகுத்தறிவையோ அடைவதைக் குறிக்கும் எபிரெய மொழிப்பயன்பாடு.
    reason: lexical_alternative
  - marker: b
    text: 'இந்த வரி ஏளனமாகக் கூறப்பட்டிருக்கலாம்: காட்டுக் கழுதைக் குட்டி மனிதனாகப் பிறப்பது எவ்வளவு சாத்தியமற்றதோ, அறிவற்றவன் அறிவடைவதும் அவ்வளவு சாத்தியமற்றது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: மனிதன்
  rationale: இங்கு ஓர் ஆண் மனிதரைக் குறிக்கும் பொதுப்பெயர் பழமொழித் தன்மையுடன் வருகிறது; மூலத்தின் ஒருமை மற்றும் ஆண்பால் வடிவத்தைத் தக்கவைக்கிறது.
- source_word: נָבוּב
  choice: அறிவற்ற
  rationale: அடிப்படையில் ‘குழிவான/வெறுமையான’ என்று பொருள்படும் இச்சொல், இங்கு அறிவின்மையை உருவகமாகக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்தப் பொருளை ‘அறிவற்ற’ தெளிவாகக் கூறுகிறது; நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִלָּבֵב
  choice: அறிவடைவான்
  rationale: சொல்லுக்குச் சொல் ‘இதயத்தைப் பெறுவான்’; எபிரெய மொழிப்பயன்பாட்டில் இது பகுத்தறிவு அல்லது புரிதலைப் பெறுவதைக் குறிக்கிறது. முற்றுப்பெறாத வினை வடிவத்தின் எதிர்கால நுணுக்கத்தையும் தமிழ் எதிர்கால வினை தக்கவைக்கிறது.
- source_word: וְ
  choice: ஆனால்
  rationale: சூழலில் இணைப்புச் சொல் முரண்பாட்டையும் ஏளனத் திருப்பத்தையும் அறிமுகப்படுத்துகிறது; அதனால் வெறும் ‘மேலும்’ என்பதைக் காட்டிலும் ‘ஆனால்’ பொருத்தமானது.
- source_word: עַיִר פֶּרֶא
  choice: காட்டுக் கழுதைக் குட்டி
  rationale: இணைச்சொற்றொடர் காட்டுக் கழுதையின் இளங்குட்டியைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் இவ்வாறு வழங்கப்படுகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: விலங்குக் குட்டி மனிதனாகப் பிறப்பது என்ற சாத்தியமற்ற ஒப்பீட்டில் வரும் ஒருமை மனிதப் பெயரைத் தக்கவைக்கிறது.
- source_word: יִוָּלֵד
  choice: பிறக்கும்போது
  rationale: நிபால் வடிவத்தின் ‘பிறக்கப்படுதல்/பிறத்தல்’ என்னும் பொருளை இயல்பாகக் கொடுக்கிறது; ‘போது’ என்பது இரண்டு நிகழ்வுகளுக்கிடையிலான சாத்தியமற்ற நிபந்தனைத் தொடர்பை வாசிக்க உதவுகிறது.
theological_decisions:
- issue: பழமொழியின் ஏளனமும் சாத்தியமின்மையும்
  choice: அறிவற்றவன் அறிவடைவது, காட்டுக் கழுதைக் குட்டி மனிதனாகப் பிறப்பதற்கு ஒப்பானது எனத் தோன்றும் ஏளனமான கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: அறிவற்ற மனிதன் ஒருநாள் ஞானமடையலாம் என்ற விருப்பமாகவோ முன்னறிவிப்பாகவோ வாசித்தல்.
  rationale: எபிரெய உரை சுருக்கமாகவும் கடினமாகவும் இருந்தாலும், இரு வரிகளின் இணை அமைப்பு அபத்தமான ஒப்பீட்டின் மூலம் சாத்தியமின்மையை உணர்த்துவதாகத் தெரிகிறது. இருப்பினும் ‘மட்டுமே’ போன்ற விளக்கச் சொல்லை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பழமொழித் தொனியும் கண்ணியமான நடையும் பேணப்பட்டுள்ளன. ‘அறிவற்ற’ என்பது தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் ‘குழிவான’ உருவகமும் ‘இதயம் பெறுதல்’ என்ற மொழிப்பயன்பாடும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
