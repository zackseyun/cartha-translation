  text: הֲ/רֹ֣ב דְּ֭בָרִים לֹ֣א יֵעָנֶ֑ה וְ/אִם אִ֖ישׁ שְׂפָתַ֣יִם יִצְדָּֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: ta
  text: ஏராளமான சொற்களுக்குப் பதிலளிக்கப்படாமல் போகலாமா? வாய்ப்பேச்சுக்காரன்[a] சரியானவன் என நிரூபிக்கப்படுவானா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “உதடுகளின் மனிதன்.” இந்த எபிரெய மரபுத்தொடர் பேச்சால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது; பொதுவாக மிகுதியாகவோ வெறுமையாகவோ பேசுபவரைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: சொற்களின் பெருக்கு
  rationale: רֹב דְּבָרִים என்பது ஏராளமான அல்லது அளவுக்கு மீறிய சொற்களைக் குறிக்கிறது. “சொற்களின் பெருக்கு” என்பது கவிதைநயத்தையும் மிகுதியான பேச்சு என்ற எதிர்மறைத் தொனியையும் காக்கிறது.
- source_word: לֹא יֵעָנֶה
  choice: மறுமொழி சொல்லப்படாமல் போக வேண்டுமா?
  rationale: ענה என்பதன் நிஃபால் வடிவம் இங்கு “பதில் அளிக்கப்படுதல்” என்ற பொருளைத் தருகிறது. எதிர்மறையுடன் கூடிய எபிரெய வினாவை, இயல்பான தமிழ் சொல்லாட்சியில் அதன் சொல்லாட்சிசார் மறுப்பையும் சொல்லாற்றல்மிக்க வினாவையும் காக்குமாறு மொழிபெயர்க்கிறது.
- source_word: וְאִם
  choice: '[இணையான இரண்டாம் வினாவாகத் தொடரப்பட்டுள்ளது]'
  rationale: கவிதை இணைவாக்கியத்தில் இது ஒரு சாதாரண நிபந்தனையைவிட இணையான சொல்லாற்றல் வினாவை அறிமுகப்படுத்துகிறது. தமிழில் தனி வினாவாகத் தொடர்வது இயல்பாக உள்ளது.
- source_word: אִישׁ שְׂפָתַיִם
  choice: வாய்ப்பேச்சுக்காரன்
  rationale: சொல்லுக்கு சொல் “உதடுகளின் மனிதன்.” இது பேச்சால்—இங்கு மிகுதியான அல்லது வெறும் பேச்சால்—அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கும் மரபுத்தொடர். “வாய்ப்பேச்சுக்காரன்” அந்த இழிவுத் தொனியை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִצְדָּק
  choice: சரியானவன் என்று ஆகிவிடுவானா?
  rationale: צדק என்பதன் கால் வடிவம் இங்கு ஒருவர் தமது வாதத்தில் சரியானவராக அல்லது நியாயமுள்ளவராக இருப்பதைக் குறிக்கிறது. இத்தேர்வு பிற்கால இறையியல் சார்ந்த சிறப்புப் பொருளை இறக்குமதி செய்யாமல் மதிப்பீட்டு/வாதச் சூழலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יִצְדָּק என்பதன் பொருள்
  choice: வாதத்தில் “சரியானவன்” என்ற மதிப்பீட்டு அர்த்தம்
  alternative: “நீதிமானாக்கப்படுவானா?” அல்லது “நீதிமானாக இருப்பானா?”
  rationale: சோப்பாரின் சொல்லாற்றல் வினா, அதிகம் பேசுவதாலேயே ஒருவர் தமது வாதத்தில் சரியானவர் ஆகிவிடுவதில்லை என்பதைக் குறிக்கிறது. இங்கு தொழில்நுட்பமான இரட்சிப்பியல் பொருளைச் சேர்க்காமல், எபிரெயச் சொல்லின் நீதிசார் நிழற்பொருளைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபு நூலின் கவிதைநயத்திற்கேற்ற கண்ணியமான சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான சொல்லாற்றல் வினாக்களும் காக்கப்பட்டுள்ளன; மூலத்தின் அசாதாரண “உதடுகளின் மனிதன்” என்ற உருவகம் வாசிப்பைத் தடையாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
