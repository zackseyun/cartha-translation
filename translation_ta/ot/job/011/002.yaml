- from: சொற்களின் பெருக்கு மறுமொழி சொல்லப்படாமல் போக வேண்டுமா? வாய்ப்பேச்சுக்காரன்[a] சரியானவன் என்று ஆகிவிடுவானா?
  to: ஏராளமான சொற்களுக்குப் பதிலளிக்கப்படாமல் போகலாமா? வாய்ப்பேச்சுக்காரன்[a] சரியானவன் என நிரூபிக்கப்படுவானா?
