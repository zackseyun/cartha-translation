lexical_decisions:
- source_word: רָבַצְתָּ
  choice: நீ படுத்திருப்பாய்
  rationale: பாதுகாப்பாகப் படுத்திருக்கும் காட்சியை நேரடியாகக் காக்கிறது; வெறும் தூக்கத்தையோ பொதுவான ஓய்வையோ தேவையின்றி சேர்க்கவில்லை.
- source_word: מַחֲרִיד
  choice: உன்னை அச்சுறுத்த
