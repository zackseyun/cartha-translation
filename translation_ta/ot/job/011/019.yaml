- source_word: חִלּוּ פָנֶיךָ
  choice: உன் தயவை நாடுவார்கள்
  rationale: சொல்லுக்குச் சொல் ‘உன் முகத்தை மன்றாடுவார்கள்’ என அமையும் எபிரெய மரபுத்தொடரின் உறவுசார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: רַבִּים
  choice: பலர்
  rationale: பெரும் எண்ணிக்கையிலான மக்களைக் குறிக்கும் சொல்லின் நேரான, சுருக்கமான தமிழ் இணை.
