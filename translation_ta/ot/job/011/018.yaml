  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் மரியாதையும் கவித்துவச் சுருக்கமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எதிர்கால வாக்குறுதி வடிவமும் இரு உட்பிரிவுகளின் காரண–விளைவு தொடர்பும் காக்கப்பட்டுள்ளன.
