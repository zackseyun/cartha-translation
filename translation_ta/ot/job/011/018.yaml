source:
  edition: WLC
  text: וּֽ֭/בָטַחְתָּ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ֝/חָפַרְתָּ֗ לָ/בֶ֥טַח תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/018.yaml
  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: ta
  text: நம்பிக்கை இருப்பதால் நீ பாதுகாப்பாக இருப்பாய்; சுற்றுமுற்றும் பார்த்துவிட்டு[a] பாதுகாப்பாகப் படுத்துக்கொள்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுற்றிலும் தோண்டுவாய்.’ இதற்கான எபிரெய வினைச்சொல் அடிப்படையில் ‘தோண்டு’ என்பதைக் குறிக்கிறது; இங்கு படுப்பதற்கு முன் சுற்றுப்புறத்தை ஆராய்வதையோ இடத்தை ஆயத்தப்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: நீ அச்சமின்றி இருப்பாய்
  rationale: בטח இங்கு நம்பிக்கை இருப்பதால் விளையும் உறுதி அல்லது பாதுகாப்பான மனநிலையைக் குறிக்கிறது. ‘அச்சமின்றி இருப்பாய்’ என்பது ‘நம்புவாய்’ என்று செயலை மட்டும் குறிப்பிடாமல், சூழலுக்கேற்ற விளைவு நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: நம்பிக்கை இருப்பதால்
  rationale: תִּקְוָה என்பதன் வழக்கமான பொருள் ‘நம்பிக்கை/எதிர்பார்ப்பு.’ כִּי-யின் காரணப் பொருளைத் தமிழில் இயல்பாகக் காட்ட ‘இருப்பதால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְחָפַרְתָּ
  choice: சுற்றுமுற்றும் பார்த்துவிட்டு
  rationale: חפר என்பதன் அடிப்படைப் பொருள் ‘தோண்டு.’ ஆனால் இச்சூழலில் படுப்பதற்கு முன் சுற்றுப்புறத்தை ஆராய்வது அல்லது இடத்தை ஆயத்தப்படுத்துவது எனப் புரிந்துகொள்ளப்படுகிறது. முதன்மை உரை இயல்பான சூழற்பொருளைத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பாக
  rationale: לָבֶטַח என்பது பாதுகாப்பான, அச்சமற்ற நிலையைக் குறிக்கும் வினையடைத் தொடர். ‘படுத்துக்கொள்வாய்’ என்பதுடன் ‘பாதுகாப்பாக’ இயல்பாக இணைகிறது.
- source_word: תִּשְׁכָּב
  choice: படுத்துக்கொள்வாய்
  rationale: שׁכב என்பதன் நேரடிப் பொருள் ‘படு.’ தமிழில் இச்சூழலில் ‘படுத்துக்கொள்வாய்’ என்பது ஓய்வுக்காகப் படுக்கும் தெளிவான, இயல்பான சொல்லாக்கம்.
