  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: ta
  text: 'ஞானத்தின் மறைபொருள்களை[a] அவர் உனக்கு வெளிப்படுத்தினால் நன்றாயிருக்கும்; ஏனெனில் உண்மையான ஞானம் இருமடங்கானது[b]. ஆகவே அறிந்துகொள்: உன் அக்கிரமத்தில் சிலவற்றைக் கடவுள் கணக்கில் கொள்ளாமல் விட்டிருக்கிறார்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஞானத்தின் இரகசியங்களை.’
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘உறுதியான ஞானத்திற்கு இரட்டிப்பு உண்டு.’ இந்தக் கடினமான எபிரெயச் சொற்றொடர், ஞானம் தோன்றுவதைவிட ஆழமானது அல்லது பல பரிமாணங்கள் உடையது என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உன் அக்கிரமத்திற்குத் தகுந்ததைவிடக் குறைவாகவே கடவுள் உன்னிடமிருந்து கேட்கிறார்’; அல்லது, ‘உன் அக்கிரமத்தில் சிலவற்றைக் கடவுள் மறந்திருக்கிறார்.’ இதற்கான எபிரெய வினைச்சொல்லின் பொருள் தெளிவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד
  choice: அவர் உனக்கு வெளிப்படுத்தினால் நன்றாயிருக்கும்
  rationale: முந்தைய வசனத்தின் விருப்பக் கூற்றைத் தொடர்ந்து வரும் ஹிப்ஈல் வினையின் பொருளைத் தமிழில் இயல்பாகத் தொடர்கிறது; ‘அறிவித்தல்/வெளிப்படுத்துதல்’ என்ற அடிப்படை உணர்வையும் காக்கிறது.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: ஞானத்தின் மறைபொருள்கள்
  rationale: மறைக்கப்பட்ட அல்லது புலப்படாத காரியங்கள் என்ற பன்மை உணர்வையும், ‘ஞானத்தின்’ என்ற தொடர்பையும் காக்கிறது.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: மெய்ஞானத்திற்குப் பல பக்கங்கள் உண்டு
  rationale: כִפְלַיִם என்பதன் சொற்படியான ‘இரட்டிப்பு’ கருத்தை இயந்திரமாக மொழிபெயர்க்காமல், தושיה என்பதின் ஆழமும் பல்முகத் தன்மையும் குறிக்கும் கடினமான சொற்றொடரை இயல்பான தமிழில் தருகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְדַע
  choice: ஆகவே அறிந்துகொள்
  rationale: கட்டளைத் தன்மையையும் முன்னுள்ள காரணத்திலிருந்து வரும் முடிவையும் வெளிப்படுத்துகிறது.
- source_word: יַשֶּׁה לְךָ
  choice: கணக்கில் கொள்ளாமல் விட்டிருக்கிறார்
  rationale: கடினமான נשׁה வினையின் ‘மறத்தல்/விட்டுவிடுதல்’ உணர்வை, இச்சூழலில் முழுமையாகக் குற்றம் சுமத்தாதிருத்தல் என்ற பொருளில் இயல்பாகத் தருகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: מֵעֲוֺנֶךָ
  choice: உன் அக்கிரமத்தில் சிலவற்றை
  rationale: עון என்பதன் ஒழுக்கக் குற்ற உணர்வையும், מן முன்னொட்டின் பகுதி சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: אֱלוֹהַ
  choice: கடவுள்
  rationale: கவிதை நடையிலான ஒருமை ‘God’ என்பதற்கு நவீன பொதுத் தமிழில் சமயப்பிரிவு சாராத இயல்பான சொல்.
theological_decisions:
- issue: யோபின் அக்கிரமத்தைப் பற்றிய சோப்பாரின் கூற்று
  choice: யோபின் அக்கிரமத்தில் சிலவற்றைக் கடவுள் கணக்கில் கொள்ளாமல் விட்டிருக்கிறார்
  alternative: கடவுள் உன் குற்றத்திற்குத் தகுந்ததைவிடக் குறைவாகவே உன்னிடமிருந்து கேட்கிறார்; அல்லது கடவுள் உன் அக்கிரமத்தில் சிலவற்றை மறந்திருக்கிறார்
  rationale: சூழலில் சோப்பார், யோபு தகுதியான முழுத் தண்டனையைப் பெறவில்லை என்று குற்றஞ்சாட்டுகிறார். இது சோப்பாரின் கூற்றாகவே மொழிபெயர்க்கப்படுகிறது; அவரது இறையியல் மதிப்பீட்டை மொழிபெயர்ப்பு உண்மை எனத் தீர்ப்பளிக்கவில்லை.
- issue: כִפְלַיִם לְתוּשִׁיָּה என்ற தெளிவில்லாத ஞானச் சொற்றொடர்
  choice: மெய்ஞானத்திற்குப் பல பக்கங்கள் உண்டு
  alternative: மெய்ஞானம் இரட்டிப்பானது
  rationale: எபிரெயச் சொற்றொடரின் இலக்கண வடிவம் ‘இரட்டிப்பு’ என்பதைச் சுட்டினாலும் துல்லியமான உவமை தெளிவில்லை. முதன்மை உரை அதன் பல்முக/ஆழமான தன்மையை இயல்பாகக் காட்டுகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவிதைநடைத் தொனியும் காக்கப்பட்டுள்ளன. ‘மெய்ஞானம்’, ‘அக்கிரமம்’ ஆகியவை ஞான இலக்கியத்திற்குரிய செறிவைக் காக்கின்றன; கடினமான எபிரெயச் சொற்றொடர்களின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
