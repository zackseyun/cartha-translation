  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: ta
  text: ஏனெனில், அப்போது நீ களங்கமின்றி உன் முகத்தை உயர்த்துவாய்[a]; நீ உறுதியாக நிலைத்திருப்பாய்[b], அஞ்சமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவமானமின்றி தலைநிமிர்ந்து நிற்பாய்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘களங்கமின்றி உன் முகத்தை உயர்த்துவாய்’ என்று உள்ளது; இது மீட்கப்பட்ட தன்னம்பிக்கையையும் அவமானத்திலிருந்து கிடைக்கும் விடுதலையையும் உருவகமாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாதுகாப்பாக இருப்பாய்’ அல்லது ‘உறுதியாக நிலைநிறுத்தப்படுவாய்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: ஏனெனில், அப்போது
  rationale: முந்தைய நிபந்தனையின் விளைவை அறிமுகப்படுத்தும் காரண–விளைவு தொடர்பையும், אָז என்பதன் காலக் குறிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: உன் முகத்தை உயர்த்துவாய்
  rationale: மீண்டும் கிடைக்கும் தன்னம்பிக்கையையும் அவமானத்திலிருந்து விடுதலையையும் உணர்த்தும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: מִמּוּם
  choice: களங்கமின்றி
  rationale: מוּם என்பதன் அடிப்படைப் பொருள் குறை அல்லது பழுது. இங்கு அது உருவகமாகப் பயன்படுத்தப்படுவதால், ‘களங்கமின்றி’ என்பது குற்றக்கறை அல்லது அவமானம் நீங்கிய நிலையைக் காட்டுவதோடு மூல உருவகத்தையும் தக்கவைக்கிறது.
- source_word: מֻצָק
  choice: உறுதியாக நிலைத்திருப்பாய்
  rationale: יצק வேரிலிருந்து வந்த இச்சொல் இங்கு உறுதி, நிலைத்தன்மை அல்லது பாதுகாப்பாக நிறுவப்பட்ட நிலையை உணர்த்துகிறது. இந்தத் தமிழாக்கம் அந்த நிலைத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא תִירָא
  choice: அஞ்சமாட்டாய்
  rationale: எதிர்கால மறுப்புடன் வரும் ירא என்பதன் நேரடியான, சுருக்கமான தமிழாக்கம்.
