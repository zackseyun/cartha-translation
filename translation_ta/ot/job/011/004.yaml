source:
  edition: WLC
  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: ta
  text: ஏனெனில் நீ, “என் போதனை தூய்மையானது[a]; உமது பார்வையில் நான் மாசற்றவனாய் இருக்கிறேன்” என்று சொல்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் அறிவுரை’ அல்லது ‘என் உரை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் ஒருவர் கற்றுக்கொண்டதையோ போதனையாக எடுத்துரைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: நீ ... என்று சொல்கிறாய்
  rationale: இது இலக்கணப்படி இறந்தகாலமாகவும் மொழிபெயர்க்கப்படலாம். ஆனால் சோப்பார், யோபு தற்போது முன்வைத்துவரும் கூற்றை எடுத்துரைப்பதால், நிகழ்காலம் தமிழில் இயல்பாக உள்ளது.
- source_word: זַךְ
  choice: தூய்மையானது
  rationale: யோபின் ‘போதனை’ குறித்த தூய்மை அல்லது கலப்பின்மையைக் குறிக்கிறது; அடுத்துள்ள בַר என்பதிலிருந்து சொல்லாட்சியில் வேறுபடுத்துகிறது.
- source_word: לִקְחִי
  choice: என் போதனை
  rationale: לקח என்பது பெற்றுக்கொண்ட அல்லது எடுத்துரைக்கப்படும் கற்றல், அறிவுரை, போதனை ஆகியவற்றைக் குறிக்கலாம். இங்கு யோபு முன்வைத்த கருத்துகளின் உள்ளடக்கத்தை ‘போதனை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבַר
  choice: குற்றமற்றவனாய்
  rationale: בַר என்பதன் அடிப்படைப் பொருள் தூய்மை அல்லது சுத்தம். ஒருவரைப் பற்றிய இச்சூழலில் ‘குற்றமற்றவன்’ என்பது நவீன தமிழில் இயல்பாகவும், முதல் அடியில் உள்ள ‘தூய்மை’ என்ற சொல்லை வெறுமனே மீண்டும் கூறாமலும் உள்ளது.
- source_word: הָיִיתִי
  choice: நான் ... இருக்கிறேன்
  rationale: எபிரெயத்தில் இது நிறைவுவினை வடிவம் என்றாலும், மேற்கோளிடப்பட்ட தற்போதைய நிலைக் கூற்றாகத் தமிழில் நிகழ்காலம் இயல்பாகிறது.
- source_word: בְעֵינֶיךָ
  choice: உமது பார்வையில்
  rationale: மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது. ஒருமை முன்னிலை கடவுளைக் குறிப்பதாகச் சூழல் உணர்த்தினாலும், மொழிபெயர்ப்பு பெயரைச் சேர்த்து வெளிப்படையாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: בְעֵינֶיךָ என்பதிலுள்ள இரண்டாம் நபர் ஒருமையின் குறிப்பு
  choice: ‘உமது பார்வையில்’ என்று பெயரைக் குறிப்பிடாமல் ஒருமை மரியாதை வடிவில் மொழிபெயர்த்தல்; சூழலில் இது கடவுளை நோக்கியதாகப் புரிகிறது
  alternative: ‘கடவுளின் பார்வையில்’ என்று குறிப்பை வெளிப்படையாக்குதல், அல்லது உரையாடுபவரை பொதுவாகக் குறிப்பதாக எடுத்தல்
  rationale: சோப்பார், கடவுளுக்கு முன்பாகத் தான் தூயவன் என்று யோபு கூறுவதாகச் சுருக்குகிறார். எனினும் மூலத்தில் ‘கடவுள்’ என்ற பெயர் நேரடியாக இல்லை; ஆகவே உண்மையான மறைமுகத்தன்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை விவாதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. கடவுளை நோக்கிய ஒருமைக்கு ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரையிலுள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
