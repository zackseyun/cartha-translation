source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: ta
  text: தீமை உன் கையில் இருந்தால்[a], அதைத் தூரமாக அகற்றிவிடு; அநியாயம் உன் கூடாரங்களில்[b] குடியிருக்க விடாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் கையில்’ என்பது ஒருவருடைய செயலில் அல்லது கட்டுப்பாட்டில் இருப்பதைக் குறிக்கலாம்.
    reason: idiom_note
  - marker: b
    text: ‘உன் கூடாரங்களில்’ என்பது ஒருவரின் வீட்டு அல்லது குடும்ப வாழ்க்கைச் சூழலைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: எபிரெய மொழியின் நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சொல் துன்பம், கேடு, தீய செயல் ஆகிய பொருள்களைக் கொள்ளலாம்; இங்கு ஒழுக்கநெறி சார்ந்த அறிவுரையிலும் עַוְלָה என்பதுடன் இணையாகவும் வருவதால் ‘தீமை’ பொருத்தமானது.
- source_word: בְּיָדְךָ
  choice: உன் கையில்
  rationale: ஒருவருடைய செயல் அல்லது கட்டுப்பாட்டில் இருப்பதைக் குறிக்கக்கூடிய எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: הַרְחִיקֵהוּ
  choice: அதைத் தூரமாக அகற்றிவிடு
  rationale: காரணவினை வடிவத்தின் செயற்படுத்தும் வலிமையையும், தீமையை வெறுமனே நிறுத்தாமல் தூரப்படுத்த வேண்டும் என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: וְאַל תַּשְׁכֵּן
  choice: குடியிருக்க விடாதே
  rationale: ‘குடியிருக்கச் செய்யாதே’ அல்லது ‘தங்க அனுமதிக்காதே’ என்ற தடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּאֹהָלֶיךָ
  choice: உன் கூடாரங்களில்
  rationale: எபிரெய மூலத்தின் பன்மையையும் பண்டைய வாழ்விட உருவகத்தையும் பாதுகாக்கிறது.
- source_word: עַוְלָה
  choice: அநியாயம்
  rationale: தவறு, நீதிக்கேடு ஆகிய ஒழுக்கப் பொருளைத் தருவதோடு, முந்தைய אָוֶן என்பதிலிருந்து தொடர்புடைய ஆனால் வேறுபட்ட சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கவிதை இணைநிலையில் வரும் ஒழுக்கநெறிச் சொற்கள்
  choice: אָוֶן என்பதற்கு ‘தீமை’ என்றும் עַוְלָה என்பதற்கு ‘அநியாயம்’ என்றும் தொடர்புடைய இரு வேறு சொற்களைப் பயன்படுத்துதல்
  alternative: இரண்டையும் ஒரே சொல்லால் மொழிபெயர்த்தல் அல்லது பொதுவாக ‘தீமை’ என வழங்குதல்
  rationale: எபிரெயக் கவிதையின் இணைநிலையையும் சொல் வேறுபாட்டையும் காக்கிறது; அதேவேளையில், மூலவசனம் கோராத தொழில்நுட்பமான இறையியல் வேறுபாட்டை உருவாக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான அறிவுரைத் தொனியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கை’ மற்றும் ‘கூடாரங்கள்’ என்ற எபிரெய உருவகங்கள் தக்கவைக்கப்பட்டு, அவற்றின் பொருள் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்பட்டுள்ளது.
