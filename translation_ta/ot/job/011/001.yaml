  yaml_path: translation/ot/job/011/001.yaml
  text: 'Then Zophar the Naamathite answered and said:'
translation:
  language: ta
  text: 'அப்போது நாமாத்தியனான சோப்பார் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்ற வினை உரையாடல் சூத்திரத்தில் ‘மறுமொழி கூறுதல்’ என்ற பொருளைத் தருகிறது. அடுத்துள்ள וַיֹּאמַר உடன் சேர்த்து இயல்பான நவீன தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: צֹפַר
  choice: சோப்பார்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: הַנַּעֲמָתִי
  choice: நாமாத்தியனான
  rationale: இது நாமா என்ற இடத்துடனான பிறப்பிட அல்லது தொடர்பு அடையாளத்தைக் குறிக்கும் இன/இடப்பெயரடை; அந்தத் தொடர்பின் இயல்பை தேவையின்றி தீர்மானிக்காமல் பெயரடையாகவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ என்பதைக் காக்கிறது; தமிழ் உரையாடல் அறிமுக நடையில் முந்தைய வினையுடன் சேர்ந்து இயல்பாக அமைகிறது.
