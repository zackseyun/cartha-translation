translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் உரை. எபிரெய மொழியின் இரட்டை வினைச் சூத்திரத்தை சொற்சொல்லாக ‘மறுமொழி கூறி, சொன்னான்’ என மீளுரைப்பதற்குப் பதிலாக, அதன் உரையாடல் பண்பை ‘மறுமொழியாகச் சொன்னது’ என்று இயல்பாக ஒருங்கிணைக்கிறது; அடுத்துவரும் நேரடி உரைக்கு ஏற்றவாறு நடுநிலை அறிமுக வடிவம் பயன்படுத்தப்பட்டுள்ளது.
