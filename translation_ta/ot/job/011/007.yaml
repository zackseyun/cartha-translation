  text: הַ/חֵ֣קֶר אֱל֣וֹהַ תִּמְצָ֑א אִ֤ם עַד תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: ta
  text: தேவனுடைய ஆழங்களை உன்னால் கண்டறிய முடியுமா?[a] சர்வவல்லவரின் எல்லையை உன்னால் கண்டுபிடிக்க முடியுமா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனை ஆராய்ந்து அறிய உன்னால் முடியுமா?” எபிரெயச் சொல் தேடுதல், ஆராய்தல், அல்லது ஆராய்ந்து அறியப்படுவது ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சர்வவல்லவரின் முடிவை,” “சர்வவல்லவரின் முழு அளவை,” அல்லது “சர்வவல்லவரின் நிறைவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: ஆழத்தை
  rationale: חֵקֶר என்பது தேடுதல், ஆராய்தல், அல்லது ஆராய்ந்து அறியப்படுவது ஆகியவற்றைக் குறிக்கலாம். இவ்வினாவில் மனித ஆராய்ச்சிக்கு எட்டாத தேவனின் ஆழத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֱלוֹהַ
  choice: தேவன்
  rationale: யோபு நூலில் வரும் ஒருமைத் தெய்வப் பட்டத்திற்கான தெளிவான, வழக்கமான தமிழ் மொழிபெயர்ப்பு; இணை அடியிலுள்ள שַׁדַּי என்பதோடும் பொருந்துகிறது.
- source_word: תִּמְצָא
  choice: கண்டறிய
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘கண்டுபிடி.’ முதல் அடியில் חֵקֶר உடன் வருவதால், ஆராய்ச்சியின் மூலம் அறிதல் என்ற நுண்பொருளை ‘கண்டறிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: முடியுமா
  rationale: இங்கு אִם நிபந்தனையை அல்ல, முதல் அடிக்கு இணையான வினாவை அறிமுகப்படுத்துகிறது. தமிழில் ஆற்றலை வினவும் எதிர்மறை விடையை எதிர்பார்க்கும் சொல்லாட்சியாக ‘முடியுமா’ பொருத்தமாக உள்ளது.
- source_word: עַד תַּכְלִית
  choice: எல்லையை
  rationale: עַד உடன் வரும் תַּכְלִית முடிவு, கடைசி எல்லை, முழு அளவு ஆகிய கருத்துகளைத் தருகிறது. ‘எல்லை’ என்பது இறுதி வரம்பை இயல்பாகச் சொல்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: שַׁדַּי என்ற தெய்வப் பட்டத்திற்கான தமிழில் நிலைபெற்ற பொருள் மொழிபெயர்ப்பு; ஒலிபெயர்ப்பை விட வாசகருக்கு உடனடியாகப் புரிகிறது.
- source_word: תִּמְצָא
  choice: கண்டுபிடிக்க
  rationale: இரண்டாம் அடியில் ‘எல்லை’ என்பதோடு இயல்பாக இணைகிறது; முதல் அடியில் உள்ள அதே எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: மனிதன் தேவனை அறிந்துகொள்ளும் வரம்பைப் பற்றிய சொல்லாட்சி
  choice: தேவனின் ஆழத்தையும் சர்வவல்லவரின் எல்லையையும் மனிதனால் கண்டறிய முடியுமா என்ற சொல்லாட்சிக் கேள்வியாக மொழிபெயர்க்கப்பட்டது.
  alternative: மனிதனால் தேவனை எவ்விதத்திலும் அறிய முடியாது என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய உரை தேவனைப் பற்றிய எல்லா உண்மையான அறிவையும் மறுப்பதில்லை; அவரை முழுமையாக ஆராய்ந்து அவரது இறுதி எல்லையை எட்ட முடியாமையையே வலியுறுத்துகிறது. அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் கேள்வி வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கவித்துவமான இணை வினாக்களின் அமைப்பைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘உன்னால் … முடியுமா?’ என்பது எபிரெய சொல்லாட்சிக் கேள்வியின் வலிமையை இயல்பாகத் தருகிறது; நடை மரியாதையும் கண்ணியமும் கொண்டது.
