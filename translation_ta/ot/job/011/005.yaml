    text: ‘உனக்கு எதிராக’ அல்லது ‘உன்னிடம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் ‘உன்னுடன்’; இச்சூழலில் அது எதிர்கொள்ளும் நுண்பொருளையும் கொண்டிருக்கலாம்.
