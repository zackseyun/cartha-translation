  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: ta
  text: ஆனால், கடவுள் பேசவும் உன்னுடன் தம் உதடுகளைத் திறக்கவும் செய்தால் எவ்வளவு நன்றாயிருக்கும்![a]
  philosophy: optimal-equivalence
