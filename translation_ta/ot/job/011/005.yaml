lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: சோப்பாரின் முந்தைய குற்றச்சாட்டிலிருந்து வலுவான எதிர்மறைத் திருப்பத்தைக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்பு.
- source_word: מִי יִתֵּן
  choice: எவ்வளவு நன்றாயிருக்கும்
  rationale: இது சொல்லர்த்தமான ‘யார் கொடுப்பார்?’ என்ற கேள்வியல்ல; ஆழ்ந்த விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். தமிழில் நிபந்தனை வினையுடன் இவ்வாறு அமைப்பது அந்த ஏக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: ஒருமைத் தெய்வப் பெயரை எந்த விளக்கச் சேர்க்கையும் இன்றி நேரடியாகக் குறிக்கிறது.
- source_word: דַּבֵּר
  choice: பேசி
  rationale: விருப்பத்தைக் குறிக்கும் முதன்மை அமைப்புடன் இணைந்து, கடவுள் பேச வேண்டும் என்ற எதிர்பார்ப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְיִפְתַּח
  choice: திறந்தால்
  rationale: פתח என்பதன் நேரான பொருளான ‘திற’ என்பதைக் காத்து, விருப்ப வாக்கியத்தின் நிபந்தனை அமைப்பை நிறைவு செய்கிறது.
- source_word: שְׂפָתָיו
  choice: தம் உதடுகளை
  rationale: மூலத்தில் உள்ள ‘அவருடைய உதடுகள்’ என்ற மனித உருவக மொழியை ‘வாய்’ எனப் பொதுமைப்படுத்தாமல் காக்கிறது; கடவுளைக் குறிக்கும் மரியாதைப் பிரதிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִמָּךְ
  choice: உனக்கு எதிராக
  rationale: முன்னிடைச்சொல்லின் அடிப்படைப் பொருள் ‘உன்னுடன்’ என்றாலும், சோப்பார் கடவுள் யோபின் கூற்றுகளை எதிர்கொண்டு பதிலளிக்க வேண்டும் என விரும்பும் சூழலில் மோதல் சார்ந்த நுண்பொருள் வலுவாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: கடவுள் ‘தம் உதடுகளைத் திறப்பது’ என்ற மனித உருவக மொழி
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘உன்னிடம் பேசுதல்’ என்று ஒரே கருத்தாகப் பொழிப்புரை செய்தல்
  rationale: மூலத்தின் தெளிவான, உடலுறுப்பு சார்ந்த பேச்சுருவகத்தைப் பாதுகாப்பது உரையின் இலக்கிய வலிமையை காக்கிறது; இதனால் கடவுளுக்கு உடல் உண்டு என்ற கோட்பாட்டு முடிவு கட்டாயப்படுத்தப்படுவதில்லை.
- issue: עִמָּךְ என்பதன் சூழல்சார் வலிமை
  choice: ‘உனக்கு எதிராக’ என்று மொழிபெயர்த்தல்
  alternative: ‘உன்னுடன்’ அல்லது ‘உன்னிடம்’
  rationale: சோப்பாரின் பேச்சுச் சூழல் நடுநிலையான உரையாடலைவிட யோபை எதிர்கொண்டு மறுமொழி கூறுவதை நோக்குகிறது. ஆயினும் எபிரெய முன்னிடைச்சொல்லின் உண்மையான மாற்றுவாய்ப்புகள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கவிதைநயமும் கண்ணியமும் கொண்ட நடை. ‘தம் உதடுகள்’ என்பது கடவுளைக் குறிக்கும் மரியாதை வழக்கையும் மூலத்தின் மனித உருவகத்தையும் காக்கிறது; עִמָּךְ-இன் ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
