source:
  edition: WLC
  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: ta
  text: உன் வெற்றுப் பேச்சு மனிதர்களை மௌனமாக்குமா?[a] நீ ஏளனம் செய்யும்போது, ஒருவரும் உன்னை வெட்கப்படுத்த மாட்டாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் வீம்புப் பேச்சு’ அல்லது ‘உன் பிதற்றல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறுமையான, பயனற்ற, வீம்பான அல்லது பொய்யான பேச்சைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: உன் வெற்றுப் பேச்சு
  rationale: בַּדִּים என்பது சூழலின்படி வெறுமையான, பயனற்ற, வீம்பான அல்லது பொய்யான பேச்சைக் குறிக்கலாம். யோபின் சொற்களைச் சோப்பார் இகழும் இச்சூழலில், ‘வெற்றுப் பேச்சு’ அதன் கடுமையான தொனியையும் சொல்லின் பரந்த பொருளையும் காக்கிறது; ‘பொய்கள்’ என்று அளவுக்கு மீறித் தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: מְתִים
  choice: மனிதர்களை
  rationale: இப்பன்மைச் சொல் மனிதர்கள் அல்லது ஆட்களைக் குறிக்கிறது. இங்கு யோபின் பேச்சைக் கேட்கும் பிறரைப் பொதுவாகக் குறிப்பதால், நவீனத் தமிழில் இயல்பான மற்றும் உள்ளடக்கமான ‘மனிதர்களை’ பொருத்தமானது.
- source_word: יַחֲרִישׁו
  choice: மௌனமாக்குமா
  rationale: חרש என்பதன் ஹிஃபில் வடிவம் மௌனமாக இருக்கச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘மௌனமாக்குமா’ அந்தக் காரணவினை நுணுக்கத்தையும் வினாவையும் சுருக்கமாகக் காக்கிறது.
- source_word: וַתִּלְעַג
  choice: நீ ஏளனம் செய்யும்போது
  rationale: לעג என்பது ஏளனம் செய்தல் அல்லது இகழ்தல். கவிதைநடைச் சொல்லிணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘செய்யும்போது’ என இரண்டாம் வினாவுடன் இணைக்கப்பட்டுள்ளது.
- source_word: מַכְלִם
  choice: உன்னை வெட்கப்படுத்த
  rationale: כלם என்பதன் ஹிஃபில் வினையெச்சம் ஒருவரை வெட்கத்திற்கோ அவமானத்திற்கோ உள்ளாக்குபவரைக் குறிக்கிறது. ‘வெட்கப்படுத்த’ என்பது ‘கடிந்துகொள்ள’ என்பதைக் காட்டிலும் மூலத்தின் அவமானப்படுத்தும் வலிமையை நேரடியாகக் காக்கிறது.
