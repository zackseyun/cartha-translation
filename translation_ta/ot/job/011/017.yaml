  edition: WLC
  text: וּֽ֭/מִ/צָּהֳרַיִם יָק֣וּם חָ֑לֶד תָּ֝עֻ֗פָ/ה כַּ/בֹּ֥קֶר תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: ta
  text: உன் வாழ்நாள்[b] நண்பகலைவிட ஒளிமிக்கதாக எழும்பும்[a]; இருள் சூழ்ந்தாலும்[c], அது காலையைப்போல் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘உன் வாழ்க்கை நண்பகலைவிட ஒளிமிக்கதாகும்; இருள் காலையைப்போல் ஆகும்.’ குறிப்பாக இரண்டாம் அடியில், எபிரெய மொழியில் செறிவான பல கவித்துவச் சொற்றொடர்கள் உள்ளன.'
    reason: alternative_reading
  - marker: b
    text: ‘வாழ்நாள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘வாழ்க்கை’ அல்லது விரிந்த பொருளில் ஒருவரின் இவ்வுலக வாழ்வு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘இருள் சூழ்ந்தாலும்’ என்று மொழிபெயர்க்கப்பட்டுள்ள அரிதான எபிரெயச் சொல்லின் பொருள் உறுதியில்லை; ‘இருளடைவு,’ ‘மங்கல்,’ அல்லது ‘தெளிவின்மை’ என்பவையும் சாத்தியமான பொருள்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: நண்பகலைவிட ஒளிமிக்கதாய்
  rationale: מִן இங்கு ஒப்பீட்டுப் பொருளில் வருவதாகக் கொண்டு, நண்பகலின் ஒளியைவிட மிகுந்த பிரகாசத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָקוּם
  choice: எழும்பும்
  rationale: קום என்பதன் ‘எழுதல்’ என்ற உருவகத்தைத் தக்கவைத்து, யோபுவின் வாழ்க்கை ஒளிமிக்க நிலைக்கு உயர்வதைக் காட்டுகிறது.
- source_word: חָלֶד
  choice: உன் வாழ்நாள்
  rationale: இந்தச் சொல் வாழ்க்கை, வாழ்நாள் அல்லது இவ்வுலக வாழ்வு எனப் பொருள்படலாம்; இச்சூழலில் யோபுவின் வாழ்க்கைக் காலத்தைக் குறிக்க ‘வாழ்நாள்’ பொருத்தமானது.
- source_word: תָּעֻפָה
  choice: இருள் சூழ்ந்தாலும்
  rationale: அரிதானதும் பொருள் உறுதியில்லாததுமான இச்சொல், அடுத்துவரும் ‘காலை’ என்பதற்கு எதிராக இருள் அல்லது மந்தாரத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. எபிரெயக் கவிதையில் உள்ள மறைமுக விட்டுக்கொடுப்பு உறவைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘-ஆலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּבֹּקֶר
  choice: காலையைப்போல்
  rationale: כְּ குறிக்கும் உவமையையும் בֹּקֶר என்பதன் ‘காலை’ என்ற நேரடிப் பொருளையும் தக்கவைக்கிறது.
- source_word: תִּהְיֶה
  choice: ஆகும்
  rationale: היה அடிப்படையில் ‘இரு’ எனப் பொருள்பட்டாலும், இருளிலிருந்து காலைபோன்ற ஒளிக்கு மாறும் கவித்துவப் படிமத்தை ‘ஆகும்’ தெளிவாக வெளிப்படுத்துகிறது.
