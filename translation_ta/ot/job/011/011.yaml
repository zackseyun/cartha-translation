source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: ta
  text: ஏனெனில், பொய்யான மனிதர்களை அவர் அறிவார்; அவர் அக்கிரமத்தைக் காணும்போது, அதைக் கவனிக்காமல் இருப்பாரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அக்கிரமத்தைக் கண்டு, அதைக் கவனிப்பதில்லை.” எபிரேய இறுதிக் கூறை நேரடி எதிர்மறைக் கூற்றாக வாசிக்கலாம்; ஆனால் சூழல், “அதைக் கவனிக்காமல் இருப்பாரா?” என்ற சொல்லாட்சிக் கேள்வியை வலுவாக ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனனில்
  rationale: சோப்பாரின் கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் வாதத்தின் ஓட்டத்துக்கு இயல்பான இணைப்பு.
- source_word: הוּא
  choice: அவர்
  rationale: சூழலில் கடவுளைக் குறிக்கிறது; நவீனத் தமிழில் மரியாதைப் பன்மை இயல்பானது.
- source_word: יָדַע
  choice: அறிவார்
  rationale: கடவுளின் நிலையான, பொதுவான அறிவை நிகழ்காலத்தில் வெளிப்படுத்துகிறது.
- source_word: מְתֵי שָׁוְא
  choice: பொய்மையுள்ள மனிதர்களை
  rationale: மொழிமுதலின் ‘பொய்/வெறுமை சார்ந்த மனிதர்கள்’ என்ற அமைப்பையும் ஒழுக்கப் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: וַיַּרְא
  choice: அவர் ... காணும்போது
  rationale: அடுத்துள்ள வினாவுடன் இயல்பாக இணையும் காலவியல் உட்பிரிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָוֶן
  choice: அக்கிரமத்தை
  rationale: இங்கு சொல்லின் தீமை, குற்றம், ஒழுக்கக்கேடு ஆகிய பொருள்களில் ஒழுக்கத் தீமையைச் சுட்டுகிறது.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: அதைக் கவனிக்காமல் இருப்பாரா?
  rationale: சூழலின் வாதத்துக்கு ஏற்ற சொல்லாட்சிக் கேள்வியாக வழங்குகிறது; ‘கவனித்து ஆராய்தல்’ என்ற வினையின் பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וְלֹא יִתְבּוֹנָן என்ற இறுதிக் கூறின் வலிமை
  choice: “அதைக் கவனிக்காமல் இருப்பாரா?” என்ற சொல்லாட்சிக் கேள்வி
  alternative: “அவர் அதைக் கவனிப்பதில்லை” என்ற நேரடி எதிர்மறைக் கூற்று
  rationale: எபிரெய மெய்யெழுத்து உரை நேரடி எதிர்மறைக் கூற்றை அனுமதித்தாலும், பொய்மையானவர்களையும் அக்கிரமத்தையும் கடவுள் அறிகிறார் என்ற சோப்பாரின் வாதத்தோடு சொல்லாட்சிக் கேள்வியே சிறப்பாகப் பொருந்துகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது சூழலில் கடவுளைக் குறிக்கும் மரியாதைப் பன்மை. மூலத்தின் இறுதிக் கூறிலுள்ள உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
