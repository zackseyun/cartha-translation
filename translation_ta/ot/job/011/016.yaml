source:
  edition: WLC
  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: ta
  text: ஏனெனில், நீ துன்பத்தை மறந்துவிடுவாய்; கடந்துபோன நீரைப்போல அதை நினைவுகூருவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடந்தோடிய நீரைப்போல மட்டுமே அதை நினைவுகூருவாய்.” எபிரெய உருவகம் முந்தைய துன்பத்தைக் கடந்துபோய்விட்ட நீருடன் ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வாக்குறுதிக்கான காரணத்தையோ விளைவையோ அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், சூழலில் அதன் விளக்கத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் எபிரெயத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் இருப்பதால் தமிழிலும் தக்கவைக்கப்பட்டது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: இச்சொல் வருத்தம், தொல்லை, கடின உழைப்பு அல்லது துயரம் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு பின்னால் விடப்படும் வேதனையான அனுபவத்தைக் குறிக்க இயல்பான, பரந்த சொல்லாக ‘துன்பம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִּשְׁכָּח
  choice: மறந்துவிடுவாய்
  rationale: Qal முற்றுப்பெறா வினை, இச்சூழலில் எதிர்காலப் பொருளில் வருகிறது; ‘விடு’ துணைவினை மறத்தல் நிறைவடையும் உணர்வையும் இயல்பான தமிழையும் தருகிறது.
- source_word: כְ/מַיִם
  choice: நீரைப்போல
  rationale: כְ ஒப்புமையைக் குறிக்கிறது. எபிரெயத்தில் ‘நீர்கள்’ எனப் பன்மை இருந்தாலும், தமிழில் ‘நீர்’ இயல்பாகத் திரள்பெயராகச் செயல்பட்டு கவித்துவ உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: עָבְרוּ
  choice: கடந்துபோன
  rationale: עבר என்ற வேரின் Qal நிறைவுவினை; ஏற்கெனவே கடந்து இப்போது அங்கே இல்லாத நீரைச் சித்தரிக்கிறது. ‘கடந்துபோன’ என்பது முடிந்த செயலும் மறைந்துபோன நிலையும் இரண்டையும் காக்கிறது.
- source_word: תִזְכֹּר
  choice: அதை நினைவுகூருவாய்
  rationale: Qal முற்றுப்பெறா இரண்டாம் நபர் ஆண்பால் ஒருமை. நேரடிச் செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முன்னுள்ள துன்பத்தைக் குறிக்க தமிழில் ‘அதை’ சேர்ப்பது ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் ஆக்குகிறது.
