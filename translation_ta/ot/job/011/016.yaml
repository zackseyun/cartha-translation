translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்ற திரள்பெயர் எபிரெயப் பன்மையின் உருவகப் பொருளை இயல்பான தமிழில் வழங்குகிறது; மறத்தலும் நினைவுகூர்தலும் இடையிலான மூலவசனத்தின் கவித்துவப் பதற்றம் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளது.
