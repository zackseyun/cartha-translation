source:
  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: ta
  text: ஏனெனில், மனிதனுடைய செயலுக்கேற்ப அவர் அவனுக்குக் கைம்மாறு அளிப்பார்; ஒருவனுடைய வழிக்கேற்ப அவனை அடையச் செய்வார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவனுடைய வழிக்கேற்ப அவனுக்கு நேரிடச் செய்வார்,” அல்லது “அதை அவன்மேல் கொண்டுவருவார்.” எபிரெய வினைச்சொல்லின் காரணவினைப் பொருளை இவை பிரதிபலிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள எலிகூவின் கூற்றுக்கு ஆதாரத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: פֹעַל
  choice: செயல்
  rationale: ஒருவன் செய்வதைக் குறிக்கும் இச்சொல், அறநெறி மற்றும் கைம்மாறு சார்ந்த சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: தனி மனிதனைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமையின் பிரதிநிதித்துவமான, பொதுவான பொருளைத் தமிழில் தக்கவைக்கிறது.
- source_word: יְשַׁלֶּם לוֹ
  choice: அவர் அவனுக்குப் பதிலளிப்பார்
  rationale: שלם என்பதன் தீவிர வினைவடிவம் இங்கு ஒருவனுடைய செயலுக்கு ஏற்ற கைம்மாறு அளிப்பதைக் குறிக்கிறது; 'பதிலளிப்பார்' என்பது நீதிசார் கைம்மாற்றைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וּכְאֹרַח
  choice: வழிக்கேற்ப
  rationale: אֹרַח என்பதன் நேரடியான 'வழி/பாதை' உருவகத்தையும், வாழ்க்கை நடத்தை என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய ஒருமையையும் אָדָם உடனான இணைநிலையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יַמְצִאֶנּוּ
  choice: அவன் அனுபவிக்கும்படி செய்வார்
  rationale: מצא என்பதன் காரணவினை வடிவம், ஒருவன் தன் வழிக்கு ஏற்ற விளைவைச் சந்திக்கச் செய்வதை இங்கு குறிக்கிறது; சொற்சொல்லான ஆனால் தமிழில் செயற்கையான 'கண்டடையச் செய்வார்' என்பதற்குப் பதிலாக பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: மனித நடத்தைக்கு ஏற்ற இறை கைம்மாறு
  choice: கடவுள் ஒவ்வொரு மனிதனுக்கும் அவனுடைய செயலுக்கும் வழிக்கும் ஏற்றவாறு கைம்மாறு அளிக்கிறார் என்ற பொதுக் கொள்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு துன்பமும் தனிப்பட்ட பாவத்திற்கான துல்லியமான, நேரடியான தண்டனை என்று உலகளாவிய முடிவாக வாசித்தல்.
  rationale: வசனத்தின் உடனடிச் சொற்கள் இறைநீதியின் பொதுக் கொள்கையை முன்வைக்கின்றன. யோபு நூலின் விரிவான இறையியல் பதற்றத்தை எளிமைப்படுத்தி முடித்துவிடாமல் அந்தக் கொள்கையை மட்டும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமுள்ள, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இணைநிலை அமைப்பும் 'செயல்/வழி' என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன; இறைநீதியை நூலின் முழுத் துன்பப் பிரச்சினைக்கான எளிய தீர்வாக விரிவாக்கவில்லை.
