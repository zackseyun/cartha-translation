source:
  edition: WLC
  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: ta
  text: 'வல்லவர்களை விசாரணையின்றி[a] அவர் நொறுக்குகிறார்;

    அவர்களுடைய இடத்தில் மற்றவர்களை நிறுத்துகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசாரணை இல்லாமல்,’ ‘தேடல் இல்லாமல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘விசாரணை இல்லை’ என்று வருகிறது. வல்லவர்களை வீழ்த்துவதற்கு முன் நீண்ட ஆராய்ச்சி அவருக்குத் தேவையில்லை என்பதையும் இது சூழலில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: நொறுக்குகிறார்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் வலிமையாக உடைத்தல், அழித்தல் அல்லது வீழ்த்துதல் என்ற பொருளைத் தருகிறது. ஆற்றல்மிக்கவர்களைத் தீர்மானமாக வீழ்த்தும் செயலை ‘நொறுக்குகிறார்’ இயல்பாகவும் வலுவாகவும் வெளிப்படுத்துகிறது.
- source_word: כַּבִּירִים
  choice: வல்லவர்களை
  rationale: அதிகாரமும் செல்வாக்கும் உடைய வலிமைமிக்க மனிதர்களைக் குறிக்கிறது. குறிப்பாக அரசர்கள் என்றோ பதவியாளர்கள் என்றோ வரம்புபடுத்தாமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לֹא חֵקֶר
  choice: விசாரணையின்றி
  rationale: சொல்லுக்குச் சொல் அமைப்பில் ‘விசாரணை/ஆராய்ச்சி இல்லை’ என வருகிறது. நீண்ட விசாரணை தேவையின்றி அவர் செயல்படுகிறார் என்ற சூழல்சார் கருத்தைச் சுருக்கமாகத் தருகிறது; சொற்றொடரின் சாத்தியமான நுண்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיַּעֲמֵד
  choice: நிறுத்துகிறார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், நிலைநிறுத்துதல், நியமித்தல்’ எனப் பொருள்படும். தொடரும் ‘அவர்களுக்குப் பதிலாக’ என்பதுடன் சேர்ந்து, மாற்றாக வேறு நபர்களை ஏற்படுத்துவதை இயல்பாகக் காட்டுகிறது.
- source_word: אֲחֵרִים
  choice: வேறு ஆட்களை
  rationale: முன்பு குறிப்பிடப்பட்ட வல்லவர்களுக்குப் பதிலாக வரும் பிற மனிதர்களைக் குறிக்கும் வரையறையற்ற பன்மை. தமிழில் மனிதர்களைக் குறிக்கிறது என்பதைத் தெளிவாக்க ‘வேறு ஆட்களை’ என வழங்கப்பட்டுள்ளது.
- source_word: תַּחְתָּם
  choice: அவர்களுக்குப் பதிலாக
  rationale: சொல்லடிப்படையில் ‘அவர்களுக்குக் கீழே’ என்றாலும், மாற்றீட்டுச் சூழலில் ‘அவர்களுக்குப் பதிலாக’ என்பதே இயல்பான பொருள். ஒருவரை அகற்றி மற்றவரை அவரது இடத்தில் நிறுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: வினைச்சொற்களின் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: சூழலின் அடிப்படையில் கடவுளைக் குறிக்கும் ‘அவர்’ எழுவாயாக வழங்கப்பட்டுள்ளது.
  alternative: உடனடி கவிதை ஓட்டத்தில் எழுவாயை வெளிப்படையாகச் சொல்லாமல் விடுதல்.
  rationale: எலிகூவின் உரையின் சுற்றியுள்ள வசனங்கள் ஆட்சியாளர்களை நியாயந்தீர்க்கும் கடவுளின் செயல்களை விவரிக்கின்றன. ஆகவே ‘அவர்’ என்பது சூழலால் உறுதிப்படுத்தப்படுகிறது; மூலத்தில் இல்லாத தனிப்பட்ட கோட்பாட்டை இது சேர்ப்பதில்லை.
- issue: לֹא חֵקֶר என்பதன் நுண்பொருள்
  choice: மூலத்தின் சுருக்கமான அமைப்பைத் தக்கவைத்து ‘விசாரணையின்றி’ என மொழிபெயர்த்து, தேவையின்மை சார்ந்த வாசிப்பை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘விசாரிக்க வேண்டிய தேவையின்றி’ அல்லது ‘ஆராய்ந்து அறிய முடியாத வகையில்’ என உரையிலேயே விளக்கமாக்குதல்.
  rationale: எபிரெயச் சொற்றொடர் மிகச் சுருக்கமாக இருப்பதால், அது விசாரணை இல்லாமையை அல்லது விசாரணை தேவையில்லாமையைச் சுட்டலாம். கடவுள் ஆதாரமின்றி தீர்ப்பளிக்கிறார் என்ற கருத்தை வலியுறுத்தாமலும், மூலத்தின் உண்மையான சுருக்கத்தையும் பதற்றத்தையும் அழிக்காமலும் அடிக்குறிப்பு உதவுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், கவிதைநடையின் கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. முதல் அடியில் கடவுளைக் குறிக்கும் ‘அவர்’ வலியுறுத்தலுக்காக வினைக்கு முன் வைக்கப்பட்டுள்ளது. இரு இணையான செயல்களையும் அரைப்புள்ளி பிரிக்கிறது.
