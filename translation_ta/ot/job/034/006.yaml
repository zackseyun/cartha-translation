  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: ta
  text: என் உரிமையைக் குறித்து நான் பொய் சொல்ல வேண்டுமா?[a] என்னில் எந்த மீறுதலும் இல்லாதபோதும், என் காயம் குணப்படுத்த முடியாததாக இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, முதல் சொற்றொடரை வினாவாக அல்லாமல் ஒரு கூற்றாக எடுத்தால்: “என் உரிமைக்கு எதிராக நான் பொய்யன் எனக் கருதப்படுகிறேன்.”'
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “என் அம்பு குணப்படுத்த முடியாததாக இருக்கிறது”; இங்கு “அம்பு” என்பது அவர்மீது வந்த காயம் அல்லது துன்பத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: குறித்து
  rationale: இங்கு மִשְׁפָּטִי என்பதோடு இணைந்து ‘பற்றி/குறித்து’ என்ற பொருளைத் தருகிறது; எதிரான நிலையைச் சுட்டும் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְׁפָּטִי
  choice: என் உரிமை
  rationale: சட்டம் சார்ந்த ‘என் நியாயமான உரிமை/என் வழக்கு’ என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֲכַזֵּב
  choice: நான் பொய் சொல்ல வேண்டுமா?
  rationale: כזב என்பதன் பியேல் வடிவம் ‘பொய் சொல்’ என்ற பொருளைத் தரலாம்; சூழலில் இது வினாவுருவ எதிர்ப்பாகப் புரிந்துகொள்ளப்படுகிறது. ‘நான் பொய்யன் எனக் கருதப்படுகிறேன்’ என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָנ֖וּשׁ
  choice: குணமாகாததாக இருக்கிறது
  rationale: குணப்படுத்த முடியாத அல்லது மிக மோசமான நிலையைக் குறிக்கும் பெயரடை; காயத்துடன் இணைத்து இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חִצִּי
  choice: என் காயம்
  rationale: சொல்லுக்குச் சொல் ‘என் அம்பு’; இங்கு தன்மீது விழுந்த அம்பால் உண்டான காயம் அல்லது துன்பத்தைக் குறிக்கும் உருவகமாகப் புரிந்துகொள்ளப்படுகிறது. நேரடி படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְלִי
  choice: இல்லாதபோதும்
  rationale: ‘இல்லாமல்’ என்ற அடிப்படைப் பொருளைச் சூழலின் விட்டுக்கொடுப்பு உறவோடு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָשַׁע
  choice: மீறுதல்
  rationale: சாதாரண தவறை விடக் கடுமையான, ஒழுக்க மற்றும் இறை உறவு சார்ந்த சட்டமீறல் அல்லது கலகத்தைச் சுட்டும் சொல்லாக உள்ளது.
theological_decisions:
- issue: யோபின் கூற்றை எலிகூ மேற்கோள் காட்டும் விதத்தின் பொருள்
  choice: முதல் வாக்கியத்தை வினாவுருவ எதிர்ப்பாகவும், அடுத்ததை குற்றமின்றி அனுபவிக்கும் ஆறாத துன்பத்தைப் பற்றிய முறையீடாகவும் மொழிபெயர்த்தல்.
  alternative: முதல் வாக்கியத்தை ‘என் உரிமைக்கு எதிராக நான் பொய்யன் எனக் கருதப்படுகிறேன்’ என்ற கூற்றாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை சுருக்கமாகவும் பல பொருள் கொள்ளத்தக்கதாகவும் உள்ளது. முதன்மை வாசிப்பு சட்டம் சார்ந்த உரிமையையும் துன்ப முறையீட்டையும் காக்கிறது; மாற்று வாசிப்பை அடிக்குறிப்பு மூலம் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: חִצִּי என்ற உருவகத்தின் விளக்கம்
  choice: வாசகருக்குப் பொருள் தெளிவாக ‘என் காயம்’ என்று உரையில் தருதல்.
  alternative: சொல்லுக்குச் சொல் ‘என் அம்பு’ என்று தருதல்.
  rationale: ‘அம்பு’ என்பது யோபின்மீது வந்த துன்பம் அல்லது அதனால் ஏற்பட்ட காயத்தைக் குறிக்கும் உருவகம். படிமத்தை முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் அதன் நேரடிப் பொருள் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உரிமை’, ‘மீறுதல்’ ஆகிய சொற்கள் மூலத்தின் சட்ட மற்றும் ஒழுக்கத் தீவிரத்தைப் பேணுகின்றன; எபிரெய உரையின் இலக்கண மற்றும் உருவகத் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
