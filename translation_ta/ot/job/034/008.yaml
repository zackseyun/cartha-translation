source:
  edition: WLC
  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: ta
  text: தீமை செய்பவர்களோடு கூட்டாகச் செல்கிறான்[a]; தீய மனிதர்களோடு[b] நடக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூட்டுச் சேர்கிறான்.’ எபிரெய வினைச்சொல் மற்றவர்களுடன் சேர்ந்துசெல்லுதல் அல்லது அவர்களோடு தன்னை இணைத்துக்கொள்ளுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பொல்லாதவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: கூட்டாகச் செல்கிறான்
  rationale: ארח என்பதுடன் לְחֶבְרָה இணைந்திருப்பது வெறும் பயணத்தை மட்டுமல்லாமல், ஒருவருடன் சேர்ந்துசெல்லுதல் அல்லது உறவுகொள்ளுதல் என்ற கருத்தையும் தருகிறது. ‘கூட்டாகச் செல்கிறான்’ என்பது பயண உருவகத்தையும் சமூகச் சேர்க்கையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: עִם
  choice: -ஓடு
  rationale: இரு சொற்றொடர்களிலும் உடனிருத்தலையும் தொடர்பையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்பவர்கள்
  rationale: ‘தீமையைச் செய்பவர்கள்’ என்ற எபிரெயக் கட்டமைப்பின் செயற்பாட்டு வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְ/לָ/לֶכֶת
  choice: நடக்கிறான்
  rationale: הלך என்ற சொல்லின் நடத்தல் உருவகத்தைத் தக்கவைக்கிறது; இங்கு அது ஒருவரின் வாழ்க்கை வழியையும் அவர் வைத்திருக்கும் உறவையும் சுட்டலாம்.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: பொல்லாத மனிதர்கள்
  rationale: רֶשַׁע என்பதன் ஒழுக்கத் தீமையைத் தெளிவாகக் காட்டுகிறது; אַנְשֵׁי என்பதற்கு ‘மனிதர்கள்’ என்பது இயல்பான, மரியாதையான தமிழ் வடிவம்.
theological_decisions:
- issue: אַנְשֵׁי רֶשַׁע என்பதில் உள்ள ஆண்பால் வடிவம்
  choice: பொல்லாத மனிதர்கள்
  alternative: பொல்லாத ஆண்கள்
  rationale: எபிரெயச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் குறிப்பாக ஆண்களை மட்டும் வேறுபடுத்திக் காட்டுவதாகத் தெளிவில்லை. ‘மனிதர்கள்’ என்பது மனிதக் கூட்டத்தைக் குறிக்கும் பொதுவான தமிழ்ச் சொல்லாக இருந்து, மூலத்தின் பொருளைத் தேவையின்றிக் குறுக்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் ஞான இலக்கியத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரு இணைச் சொற்றொடர்களிலும் உள்ள சேர்ந்து செல்லுதல்/நடத்தல் உருவகம் பாதுகாக்கப்பட்டுள்ளது.
