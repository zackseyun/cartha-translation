source:
  edition: WLC
  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: ta
  text: நான் காணாததை[a] நீர் எனக்குக் கற்றுத்தாரும்; நான் தவறு செய்திருந்தால், அதை மீண்டும் செய்யமாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்படியாக, “நான் காண்பதற்கு அப்பாற்பட்டதை நீர் எனக்குக் கற்றுத்தாரும்.” எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால், “நான் காணாததை நீர் எனக்குக் காட்டும்/கற்றுத்தாரும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்படியாக, “இனி நான் சேர்க்கமாட்டேன்”; அதாவது, “அதைத் தொடரமாட்டேன்” அல்லது “அதை மீண்டும் செய்யமாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי
  choice: நான் ... காணாததை
  rationale: இச்சொல் אֶחֱזֶה என்பதுடன் சேர்ந்துள்ள இடைச்சொல் விடுபட்ட சுருக்கமான எபிரெய வழக்காகும். ‘நான் காணாததை’ என்பது அதன் பொருளை இயல்பான தமிழில் தருகிறது; ‘நான் காண்பதற்கு அப்பாற்பட்டதை’ என்பது சொற்படியான மாற்றாகும்.
- source_word: אֶחֱזֶה
  choice: காணாததை
  rationale: חזה என்பதன் அடிப்படைப் படிமமான ‘காணுதல்’ என்பதைக் காக்கிறது; சூழலில் அது உணர்ந்து அறிதலையும் குறிக்கலாம்.
- source_word: אַתָּה הֹרֵנִי
  choice: நீர் எனக்குக் கற்றுத்தாரும்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் ‘கற்பி/அறிவுறுத்து’ என்ற பொருளுடையது. இங்கு வடிவம் வேண்டுகோள் அல்லது கட்டளைநிலையாக இருப்பதால், கடவுளை நோக்கிய மரியாதையான வேண்டுகோளாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִם
  choice: செய்திருந்தால்
  rationale: אִם அறிமுகப்படுத்தும் நிபந்தனையை இயல்பான தமிழில் ‘-இருந்தால்’ வடிவம் தெளிவாகத் தருகிறது.
- source_word: עָוֶל
  choice: தவறு
  rationale: עָוֶל என்பது அநீதி, ஒழுக்கக்கேடு, தவறான செயல் ஆகியவற்றைக் குறிக்கலாம். ‘தவறு’ என்பது குற்றத்தின் தன்மையை அளவுக்கு மீறிக் குறிப்பாக்காமல் பரந்த பொருளைக் காக்கிறது.
- source_word: פָּעַלְתִּי
  choice: செய்திருந்தால்
  rationale: פעל என்பது பொதுவாகச் செய்தல் அல்லது செயல்படுதல் எனப் பொருள்படும்; நிபந்தனைத் தொடரில் ‘செய்திருந்தால்’ இயல்பாக அமைகிறது.
- source_word: לֹא אֹסִיף
  choice: அதை மீண்டும் செய்யமாட்டேன்
  rationale: ‘இனி சேர்க்கமாட்டேன்’ என்பது சொற்படியான வடிவம்; இச்சூழலில் அதற்குப் ‘அதைத் தொடரமாட்டேன்/மீண்டும் செய்யமாட்டேன்’ என்ற வழக்குப் பொருள் உள்ளது. தமிழில் உட்பொருளைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளிடமிருந்து திருத்தம் பெறும் மனநிலையும் தவறை மீண்டும் செய்யாத உறுதியும்
  choice: அறியாததைத் தமக்குக் கற்பிக்கும்படி கடவுளிடம் வேண்டி, தவறு செய்திருந்தால் அதை மீண்டும் செய்யமாட்டேன் என்று உரைப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் காண்பதற்கு அப்பாற்பட்டதை நீர் எனக்குக் காட்டும்; நான் அநியாயம் செய்திருந்தால், இனி சேர்க்கமாட்டேன்’ என்று சொற்படியாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரையிலுள்ள தாழ்மையான கற்றுக்கொள்ளும் மனநிலையையும் தவறை நிறுத்தும் உறுதியையும் காக்கிறது; முறையான பாவஅறிக்கை அல்லது குறிப்பிட்ட மனந்திரும்புதல் கோட்பாடு போன்ற கூடுதல் இறையியல் கருத்துகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய உரைக்கு ‘நீர்’ மற்றும் ‘கற்றுத்தாரும்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘காணுதல்’ என்ற படிமமும் முதல் தொடரின் உண்மையான சுருக்கத் தெளிவின்மையும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
