  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: ta
  text: ஏனெனில், அவன் தன் பாவத்தோடு கலகத்தையும் சேர்க்கிறான்; நம் நடுவில் தன் கைகளை ஒன்றோடொன்று அடிக்கிறான்[a]; கடவுளுக்கு எதிராகத் தன் வார்த்தைகளைப் பெருக்குகிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கைகளைத் தட்டுகிறான்.’ இச்சைகை ஏளனம், எதிர்ப்பு அல்லது பரிகாசத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளிடம்.’ எபிரெய முன்னிடைச்சொல் நடுநிலையாகப் பேச்சின் திசையைக் குறிக்கலாம்; ஆனால் இச்சூழல் ‘கடவுளுக்கு எதிராக’ என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் விளக்கக் காரணத்தை இயல்பாகக் காட்டுகிறது.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: தன் பாவத்தோடு ... சேர்க்கிறான்
  rationale: ஏற்கெனவே உள்ள பாவத்துடன் இன்னொரு குற்றத்தைச் சேர்ப்பது என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶשַׁע
  choice: கலகம்
  rationale: பொதுவான மீறுதலைவிட எதிர்த்து எழும், கீழ்ப்படிய மறுக்கும் தன்மையை இச்சொல் வலியுறுத்துகிறது.
- source_word: בֵּינֵינוּ
  choice: நம் நடுவில்
  rationale: சொல்லுக்குச் சொல் 'நமக்கிடையில்'; இங்கு கூடியிருப்போரின் மத்தியில் என்பதே இயல்பான பொருள்.
- source_word: יִסְפּוֹק
  choice: கைகளைத் தட்டுகிறான்
  rationale: கையால் செய்யப்படும் உறுதியான சைகையைத் தக்கவைக்கிறது; அதன் சரியான உணர்ச்சி நோக்கம் தெளிவாக இல்லாததால் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: தன் வார்த்தைகளைப் பெருக்குகிறான்
  rationale: பேச்சை அதிகரித்துக் குவிப்பது என்ற வலுவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: לָאֵל
  choice: கடவுளுக்கு எதிராக
  rationale: לְ என்ற முன்னிடைச்சொல் அடிப்படையில் திசை அல்லது நோக்கைக் குறிக்கக்கூடும்; ஆனால் கலகத்தைக் குற்றஞ்சாட்டும் இச்சூழலில் எதிரான பேச்சு என்ற பொருள் பொருத்தமாக உள்ளது.
theological_decisions:
- issue: யோபு கடவுளிடம் பேசுகிறாரா, கடவுளுக்கு எதிராகப் பேசுகிறாரா என்பது
  choice: கடவுளுக்கு எதிராக
  alternative: கடவுளிடம்
  rationale: பாவத்துடன் கலகத்தைச் சேர்ப்பதாகத் தொடங்கும் குற்றச்சாட்டின் தீவிர ஏற்றத்தை இது பாதுகாக்கிறது. அதேவேளையில், எபிரெய முன்னிடைச்சொல்லின் நடுநிலையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கலகம்,’ ‘வார்த்தைகளைப் பெருக்குகிறான்’ ஆகியவை எலிகூவின் தீவிரமான குற்றச்சாட்டையும் மூலத்தின் சொல்லோவியத்தையும் தக்கவைக்கின்றன. தெளிவில்லாத கைச்சைகையும் לָאֵל என்பதன் மாற்று வாசிப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
