source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: ta
  text: 'ஆகவே, விவேகமுள்ள ஆண்களே[a], எனக்குச் செவிகொடுங்கள்: கடவுள் தீமை செய்வார் என்பதும், சர்வவல்லவர் அநீதி செய்வார் என்பதும் நினைத்துக்கூட பார்க்க முடியாதவை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, ‘இருதயமுள்ள ஆண்களே.’ இங்கு ‘இருதயம்’ என்பது புரிந்துணர்வையும் விவேகத்தையும் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீமை கடவுளுக்கு வெகுதூரம்; அநீதி சர்வவல்லவருக்கு வெகுதூரம்.’ இத்தகைய தீமையைக் கடவுளோடு தொடர்புபடுத்துவது நினைத்துக்கூட பார்க்க முடியாதது என்பதை எபிரெய் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுட்டும் உரையாடல் இணைப்பாக இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אַנֲשֵׁי לֵבָב
  choice: விவேகமுள்ள ஆண்களே
  rationale: எபிரெயில் சொற்சொல்லாக ‘இருதயமுள்ள ஆண்கள்’; இங்கு ‘இருதயம்’ புரிந்துணர்வையும் பகுத்தறிவையும் குறிக்கும். ஆண்பால் பன்மையையும் சொல்லின் இடைமொழிப் பொருளையும் இத்தேர்வு காக்கிறது.
- source_word: שִׁמְעוּ לִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: பேசுகிறவரை நோக்கிக் கவனமாகக் கேட்கும்படி அழைக்கும் கட்டளை. கண்ணியமான தமிழில் அதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: חָלִילָה
  choice: நினைத்துப் பார்க்கவே முடியாதவை
  rationale: ஒரு காரியத்தை முற்றிலும் மறுத்து, அது எண்ணத்திற்கே இடமற்றது என்று கூறும் வலுவான எபிரெய் மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָאֵל מֵרֶשַׁע
  choice: கடவுள் பொல்லாப்புச் செய்வதும்
  rationale: பொல்லாப்பு கடவுளோடு தொடர்புபடுத்தப்படுவதையே எபிரெய் விலக்குகிறது; பெயர்ச்சொல்லில் மறைந்துள்ள செயற்பொருளைத் தமிழில் வினைத்தொடராக வெளிப்படுத்துகிறது.
- source_word: וְשַׁדַּי
  choice: சர்வவல்லவர்
  rationale: שַׁדַּי இங்கு கடவுளுக்குரிய பட்டப்பெயர்; அதன் பொருளை வாசகருக்குத் தெரிவிக்க மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֵעָוֶל
  choice: அநீதி செய்வதும்
  rationale: עָוֶל என்பது அநீதி, நேர்மையின்மை, தவறு ஆகிய பொருட்களை உடையது. இணையான முதல் கூறுடன் ஒத்த வினை அமைப்பில் ‘அநீதி செய்வதும்’ தெளிவாக அமைகிறது.
theological_decisions:
- issue: שַׁדַּי என்ற இறைப் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: இது இங்கு தனிப்பெயரைவிட இறைப் பட்டப்பெயராகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- issue: אַנֲשֵׁי לֵבָב என்பதிலுள்ள பாலினக் குறிப்பு
  choice: விவேகமுள்ள ஆண்களே
  alternative: விவேகமுள்ளவர்களே
  rationale: மூல எபிரெய் இலக்கணரீதியாக ஆண்பால் பன்மையில் இருப்பதால் அதை நடுநிலைப்படுத்தாமல் காக்கிறது; அதேவேளையில் ‘இருதயம்’ என்ற இடைமொழியின் பொருளை ‘விவேகம்’ என்று தெளிவுபடுத்துகிறது.
- issue: חָלִילָה என்பதின் வலுவான மறுப்பு
  choice: நினைத்துப் பார்க்கவே முடியாதவை
  alternative: கடவுளிடமிருந்து பொல்லாப்பு வெகுதூரமாயிருப்பதாக
  rationale: எபிரெய் சொல்லாக்கம் தீமையை கடவுளோடு தொடர்புபடுத்துவது எண்ணத்திற்கே இடமற்றது என வலுவாக மறுக்கிறது. தமிழில் செயற்கையான சொற்சொல் வடிவத்தைத் தவிர்த்து அந்த வலிமையையும் இரு இணைக் கூறுகளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுங்கள்’ என்பது வேண்டுகோளின் solemn வலிமையைக் காக்கிறது; ‘நினைத்துப் பார்க்கவே முடியாதவை’ என்பது எபிரெய் மரபுத்தொடரின் தீவிர மறுப்பை இயல்பான தமிழில் தருகிறது.
