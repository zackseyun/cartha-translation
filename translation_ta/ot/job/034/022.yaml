base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: ta
  text: தீமை செய்கிறவர்கள் தங்களை மறைத்துக்கொள்ளக்கூடிய இருளும் இல்லை; காரிருளும்[a] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மரண நிழல்’; எபிரெயச் சொல் கவிதைச் சூழல்களில் ஆழ்ந்த இருளை அல்லது இருண்மையைக் குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: இல்லை
  rationale: இருப்பின்மையைக் குறிக்கும் எபிரெய மறுப்பைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: மறைவிடமாகக் கருதப்படும் பொதுவான இருளைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: கவிதைச் சூழலில் மிக ஆழ்ந்த இருள் அல்லது அடர்ந்த இருளைக் குறிக்கிறது; இங்கு மரணத்தைவிட மறைத்துக்கொள்ள முடியாமையே கருத்தாக இருப்பதால் ‘காரிருள்’ பொருத்தமானது.
- source_word: לְהִסָּתֶר
  choice: தங்களை மறைத்துக்கொள்ள
  rationale: வினையின் தற்சுட்டுப் பொருளையும், மறைவதற்கான நோக்கத்தைக் குறிக்கும் לְ முன்னொட்டின் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: தங்களை மறைத்துக்கொள்ள இருளும் இல்லை
  rationale: எபிரெயத்தின் ‘அங்கே’ என்பதைத் தமிழில் தனியே மொழிபெயர்ப்பதைவிட, மறைத்துக்கொள்ள இடமளிக்கும் இருள் எதுவும் இல்லை என்ற தொடர்பாக அமைப்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிறவர்கள்
  rationale: சொற்றொடரின் செயற்பாட்டு உருவகத்தையும் அதன் அறநெறிப் பொருளையும் சாதாரண நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சூழலில் குற்றமும் ஒழுக்கக்கேடும் சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கவிதைச் சூழலில் צַלְמָוֶת என்பதன் பொருள்
  choice: காரிருள்
  alternative: மரண நிழல்; ஆழ்ந்த இருள்
  rationale: வசனம் கடவுளின் பார்வையிலிருந்து தீமை செய்கிறவர்கள் மறைய முடியாததைப் பற்றியது; மரணத்தை நேரடியாகப் பற்றியது அல்ல. ஆகவே ஆழமான, அடர்ந்த இருளை மையப்படுத்தும் மொழிபெயர்ப்பு முதன்மை உரையில் தரப்பட்டு, மரபான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இருள்—காரிருள்’ என்ற இணை எபிரெயக் கவிதையின் தீவிரப்படுத்தலைக் காக்கிறது.
