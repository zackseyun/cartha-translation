source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו אָ֑רְצָ/ה וּ/מִ֥י שָׂ֝֗ם תֵּבֵ֥ל כֻּלָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: ta
  text: 'பூமிக்கு அவரைப் பொறுப்பாளராக நியமித்தவர் யார்?[a]

    முழு உலகத்தையும் அவரிடம் ஒப்படைத்தவர் யார்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியை அவருடைய பொறுப்பில் ஒப்படைத்தவர் யார்? முழு உலகத்தையும் அவர்மேல் வைத்தவர் யார்?” எபிரெய வினைச்சொல் פקד, நியமித்தல், பொறுப்பளித்தல், அல்லது ஒப்படைத்தல் எனப் பொருள்படலாம். இரண்டாம் அடியில் உள்ள ‘வைத்தல்’ என்ற வினை, முதல் அடியின் பொறுப்பளிப்பு கருத்தைத் தொடர்வதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: பָּקַד என்பதன் பொருள் வரம்பையும், இரண்டாம் அடியில் முதல் அடியின் உறவைக் குறிக்கும் சொல்லை மனத்தில் கொள்ளும் இணை அமைப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: פָקַד
  choice: பொறுப்பை … ஒப்படைத்தவர்
  rationale: பָּקַד என்பதற்கு நியமித்தல், பொறுப்பு அளித்தல், மேற்பார்வைக்கு ஒப்படைத்தல் ஆகிய பொருள்கள் உண்டு. עַל உடன் வரும் இச்சூழலில், பூமிக்கான அதிகாரத்தையும் பொறுப்பையும் ஒருவர் தேவனிடம் ஒப்படைத்தாரா என்ற வினாவை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: அவரிடம் / அவர்மேல்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு சூழலில் தேவனைக் குறிக்கிறது. முதல் அடியில் பொறுப்பு ஒப்படைத்தலைக் குறிக்க இயல்பாக ‘அவரிடம்’ என்றும், இரண்டாம் அடியில் எபிரெய இணைப்பைத் தெளிவாக வைத்திருக்க ‘அவர்மேல்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָרְצָה
  choice: பூமி
  rationale: תֵּבֵל என்ற ‘உலகம்’ என்பதுடன் இணைந்து வருவதால், உள்ளூர் நிலப்பகுதியை அல்லாமல் முழுப் பூமியைக் குறிக்கிறது.
- source_word: שָׂם
  choice: வைத்தவர்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’ அல்லது ‘அமைத்தல்.’ மூலத்தின் திறந்த பொருளையும் இரண்டாம் அடியின் சுருக்கத்தையும் காக்க ‘வைத்தவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: உலகம் முழுவதையும்
  rationale: תֵּבֵל ஒழுங்குபெற்ற அல்லது மக்கள் வாழும் உலகைக் குறிக்கலாம்; כֻּלָּהּ அதன் முழுமையை வலியுறுத்துகிறது. இயல்பான தமிழில் ‘உலகம் முழுவதையும்’ அந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: עָלָיו என்பதிலுள்ள பின்னொட்டின் குறிப்பு
  choice: தேவனைக் குறிக்கும் ‘அவரிடம்/அவர்மேல்’
  alternative: சில வாசிப்புகளில் பொருளை மறைமுகமாக அல்லது ‘அதன்மேல்’ எனப் புரிந்துகொள்ளலாம்.
  rationale: யோபு 34:10–15 சூழலில், தேவனைப் பூமிக்குப் பொறுப்பாளராக நியமித்த மேலான அதிகாரி யாருமில்லை என்பதே எலிகூவின் வாதம். ஆண்பால் ஒருமைப் பின்னொட்டும் தேவனைக் குறிப்பதையே இயல்பாக ஆதரிக்கிறது.
- issue: இரண்டாம் அடியில் עָלָיו பொருளைத் தொடர்வது
  choice: இணைவடிவின் அடிப்படையில் ‘அவர்மேல்’ என்பதை வெளிப்படையாகக் கொடுத்தல்
  alternative: ‘உலகம் முழுவதையும் அமைத்தவர் யார்?’ என்று தனித்த படைப்புச் செயலாக மொழிபெயர்த்தல்.
  rationale: שָׂם என்பதற்குப் பின் திசை அல்லது இடம் வெளிப்படையாகக் கூறப்படவில்லை. முதல் அடியுடன் உள்ள இணைவடிவு, ‘உலகம் முழுவதையும் அவர்மேல் வைத்தார்’ என்ற பொறுப்பு சுமத்தும் கருத்தை ஆதரிக்கிறது; இருப்பினும் மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்க கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘பொறுப்பு,’ ‘ஒப்படைத்தவர்’ போன்ற சொற்கள் சாதாரண வாசகர்களுக்குத் தெளிவாக இருக்கின்றன; இரண்டாம் அடியில் மூலத்தின் உருவகமான ‘அவர்மேல் வைத்தவர்’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
