source:
  edition: WLC
  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: ta
  text: மெய்யாகவே, இறைவன் தீமை செய்யமாட்டார்[a]; எல்லாம் வல்லவர் நீதியைப் புரட்டமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அநியாயமாகக் குற்றவாளி என்று தீர்ப்பளிக்கமாட்டார்” அல்லது “குற்றவாளி என அறிவிக்கமாட்டார்.” எபிரெய வினைச்சொல் சில சூழல்களில் நீதித்துறை சார்ந்த பொருளைக் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: மெய்யாகவே
  rationale: இரு சொற்களும் சேர்ந்து கூற்றை வலியுறுத்தி உறுதிப்படுத்துகின்றன. ‘மெய்யாகவே’ என்பது இந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு இந்தச் சொல் இஸ்ரவேலின் கடவுளைக் குறிக்கும் தெய்வப் பெயராகப் பயன்படுகிறது. இணைவரியில் வரும் ‘எல்லாம் வல்லவர்’ என்பதோடு இயல்பாக அமைகிறது.
- source_word: יַרְשִׁיעַ
  choice: தீமை செய்யமாட்டார்
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் சில சூழல்களில் ‘குற்றவாளி என்று தீர்ப்பளித்தல்’ என்ற நீதித்துறைப் பொருளைக் கொள்ளலாம். ஆனால் இங்கு ‘நீதியைப் புரட்டமாட்டார்’ என்ற இணைவரியும், கடவுளின் ஒழுக்க நேர்மையைப் பற்றிய விரிந்த வாதமும், ‘தீமை செய்யமாட்டார்’ என்ற பொதுவான பொருளை ஆதரிக்கின்றன. நீதித்துறைப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: தெய்வப் பட்டத்தை ஒலிபெயர்ப்பதற்குப் பதிலாக அதன் வழக்கமான தமிழ்ப் பொருள் தரப்பட்டுள்ளது. யோபு நூலின் சூழலில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְעַוֵּת
  choice: புரட்டமாட்டார்
  rationale: வளைத்தல், திரித்தல், சீர்குலைத்தல் என்ற வினையின் பொருளை ‘நீதியைப் புரட்டுதல்’ என்ற இயல்பான தமிழ்ச் சேர்க்கை துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இங்கு இது நீதியான தீர்ப்பையோ நீதியின் நெறியையோ குறிக்கிறது. ‘நீதி’ என்பது இணைவரியின் கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: יַרְשִׁיעַ என்பது இறைவனின் இயல்புடன் தொடர்புபடும் விதம்
  choice: இறைவன் தீமை செய்யமாட்டார்
  alternative: இறைவன் அநியாயமாகக் குற்றவாளி என்று தீர்ப்பளிக்கமாட்டார் / குற்றவாளி என அறிவிக்கமாட்டார்
  rationale: வசனம் இறைவனின் ஒழுக்க மற்றும் நீதித்துறை நேர்மையை உறுதிப்படுத்துகிறது. வினைச்சொல்லுக்கு நீதிமன்றச் சார்ந்த பொருள் இருக்க முடிந்தாலும், இணைவரியின் அமைப்பு தீய செயல் அனைத்தையும் மறுக்கும் விரிந்த பொருளை ஆதரிக்கிறது. சாத்தியமான நீதித்துறைப் பொருளை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இணைவரியின் செறிவும் உறுதியான தொனியும் காக்கப்பட்டுள்ளன; சாத்தியமான நீதித்துறைப் பொருள் முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
