source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: ta
  text: ஏனெனில், அவருடைய கண்கள் ஒரு மனிதனின் வழிகளை நோக்கியுள்ளன[a]; அவனுடைய அடிகள் அனைத்தையும் அவர் காண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒருவரின் வழிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “ஒரு மனிதனின் வழிகள்” என்று ஆண்பால் ஒருமை வடிவம் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עֵינָיו
  choice: அவருடைய கண்கள்
  rationale: பன்மைப் பெயர்ச்சொல்லையும் மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியையும் நேரடியாகப் பிரதிபலிக்கிறது. சூழலில் சுட்டப்படுபவர் கடவுள் என்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל
  choice: வழிகள்மேல் இருக்கின்றன
  rationale: கண்கள் ஒருவரின் வழிகளைக் கவனித்துக்கொண்டிருப்பதைச் சுட்டும் எபிரெய முன்சொல்லின் அடிப்படை உருவகத்தைத் தமிழில் காக்கிறது.
- source_word: דַּרְכֵי אִישׁ
  choice: ஒரு மனிதனின் வழிகள்
  rationale: דֶּרֶךְ என்பது பாதையையும் உருவகமாக வாழ்க்கை நடத்தை அல்லது போக்கையும் குறிக்கலாம். אִישׁ ஆண்பால் ஒருமையாக இருந்தாலும் இங்கு பொதுவான பிரதிநிதிப் பொருள் கொண்டது; அதைப் பிரதான உரையில் காத்து, பொதுப்பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְכָל
  choice: அனைத்தையும்
  rationale: முழுமையைக் குறிக்கும் כָל என்பதன் வலிமையை இயல்பான தமிழ் சொல்வரிசையில் வெளிப்படுத்துகிறது.
- source_word: צְעָדָיו
  choice: அவனுடைய அடிகள்
  rationale: நடையின் அடிகள் என்ற konkrete உருவகத்தையும், ஒருவரின் செயல்கள் அல்லது வாழ்க்கைப் போக்கு என்ற விரிந்த பொருளையும் காக்கிறது.
- source_word: יִרְאֶה
  choice: அவர் காண்கிறார்
  rationale: ראה வினையின் எளிய ‘காணுதல்’ பொருளைத் தருகிறது; இங்கு பொதுவாகத் தொடரும் உண்மையைத் தமிழ் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ என்ற பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ஒரு மனிதன்
  alternative: மனிதர் / ஒருவர்
  rationale: எபிரெயத்தின் ஆண்பால் ஒருமை வடிவத்தை மறைக்காமல் பிரதான உரையில் காக்கிறது; அதேவேளை இது மனிதர்கள் அனைவருக்கும் பொருந்தும் பொதுப்பயன்பாடு என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: தெய்வீகக் கண்காணிப்பின் பரப்பு
  choice: அடிகள் அனைத்தையும் அவர் காண்கிறார்
  alternative: அவனுடைய செயல்கள் அனைத்தையும் அவர் அறிகிறார்
  rationale: ‘அடிகள்’ மற்றும் ‘காண்கிறார்’ என்ற மூல உருவகங்களை வைத்திருப்பதால், கடவுளின் அறிவைப் பற்றிய கருத்தை விளக்கமாக விரிவாக்காமல் வசனத்தின் சொந்த உருவகத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதைப் பன்மையும், மனிதனைக் குறிக்கும் சுட்டுப்பெயரில் ஒருமையும் பயன்படுத்தப்பட்டதால் மூல உரையின் இரு குறிப்புகளும் தெளிவாக வேறுபடுகின்றன.
