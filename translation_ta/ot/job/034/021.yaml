revisions:
- from: ஏனெனில், அவருடைய கண்கள் ஒரு மனிதனின் வழிகள்மேல் இருக்கின்றன[a]; அவனுடைய அடிகள் அனைத்தையும் அவர் காண்கிறார்.
  to: ஏனெனில், அவருடைய கண்கள் ஒரு மனிதனின் வழிகளை நோக்கியுள்ளன[a]; அவனுடைய அடிகள் அனைத்தையும் அவர் காண்கிறார்.
