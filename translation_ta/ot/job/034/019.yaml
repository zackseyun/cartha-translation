source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: ta
  text: 'அவர் தலைவர்களிடம் பாரபட்சம் காட்டுவதில்லை;

    ஏழையைவிடச் செல்வந்தனை உயர்வாகக் கருதுவதுமில்லை;

    ஏனெனில், அவர்கள் அனைவரும் அவருடைய கைகளின் படைப்பே.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְנֵי שָׂרִים
  choice: தலைவர்களிடம் பாரபட்சம் காட்டுவதில்லை
  rationale: ‘முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர், ஒருவரின் பதவி காரணமாக அவருக்குச் சலுகை காட்டுவதைக் குறிக்கிறது. שָׂרִים என்பதற்கு இங்கு இயல்பான பொதுச் சொலாக ‘தலைவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: ஏழையைவிடச் செல்வந்தனை உயர்வாகக் கருதுவதுமில்லை
  rationale: נכר என்பதன் ‘மதித்தல்/அங்கீகரித்தல்’ சார்ந்த பொருளையும், לִפְנֵי என்பதன் ஒப்பீட்டு அல்லது முன்னுரிமை நுணுக்கத்தையும் சேர்த்து, செல்வந்தனை ஏழைக்கு மேலாக மதிக்காதிருப்பதாக இயல்பாக மொழிபெயர்க்கிறது.
- source_word: מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: அவர்கள் அனைவரும் அவருடைய கைகளின் படைப்பே
  rationale: மூலத்தின் கைவேலை உருவகத்தையும், எல்லா சமூக நிலைகளையும் உள்ளடக்கும் ‘அனைவரும்’ என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: கடவுளின் பாரபட்சமின்மை
  choice: சமூக அதிகாரம் அல்லது செல்வம் காரணமாக அவர் ஒருவரை மற்றொருவரைவிட உயர்வாகக் கருதுவதில்லை என்று உரை கூறுகிறது.
  alternative: இதை பொதுவான மனித சமத்துவக் கோட்பாடாக விரிவுபடுத்துதல்.
  rationale: வசனத்தின் உடனடி கவனம் தலைவர்கள், செல்வந்தர், ஏழை ஆகியோரிடையே கடவுள் காட்டும் பாரபட்சமின்மையில் உள்ளது; அதற்கு அப்பாற்பட்ட கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: ‘அவருடைய கைகளின் படைப்பு’ என்ற மொழி
  choice: உருவகத்தை அப்படியே வைத்தல்.
  alternative: ‘அவரே அனைவரையும் படைத்தார்’ என்று வெளிப்படையாக மாற்றுதல்.
  rationale: மூலத்தின் கவித்துவமான உடல்-உருவகத்தையும் படைப்பாளர்–படைப்பு உறவையும் நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைத் தன்மையும் கண்ணியமான நடையும் காக்கப்பட்டுள்ளன. ‘பிரபுக்கள்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘தலைவர்கள்’ பயன்படுத்தப்பட்டது; ‘பாரபட்சம் காட்டுதல்’ என்ற வழக்குச் சொல் எபிரெய மரபுத்தொடரின் செயல்பாட்டு பொருளைத் தெளிவாகத் தருகிறது.
