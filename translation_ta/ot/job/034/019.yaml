  terminology: “தலைவர்கள்” is a reasonable accessible rendering of שָׂרִים in this context. “செல்வந்தன்/ஏழை” preserves the social contrast. “அவருடைய கைகளின் படைப்பே” retains the source’s poetic ‘work of his hands’ imagery without adding doctrinal explanation.
