theological_decisions:
- issue: யோபின் தன்னிலை வாதத்திலுள்ள வழக்காடல் நுணுக்கம்
  choice: ‘என் பக்கம் நியாயம் இருக்கிறது’
  alternative: ‘நான் நீதிமான்’ அல்லது ‘நான் நீதியுள்ளவன்’
  rationale: இது யோபு பாவமே இல்லாத முழுமையானவர் என்று கூறியதாகப் பொருளை விரிவுபடுத்தாமல், தேவனுக்கு முன்பான தன் வழக்கில் தானே சரியானவன் என்ற அவரது வாதத்தைப் பாதுகாக்கிறது.
- issue: מִשְׁפָּטִי என்பதன் சட்ட மற்றும் ஒழுக்கப் பொருள்
  choice: ‘எனக்குரிய நீதி’ என்பதை முதன்மை உரையில் பயன்படுத்துதல்
  alternative: ‘என் உரிமை,’ ‘எனக்குக் கிடைக்கவேண்டிய நியாயம்,’ அல்லது ‘என் வழக்கு’
  rationale: எபிரெயச் சொல் நீதி, சட்ட உரிமை, தீர்ப்பு ஆகியவற்றைத் தொடக்கூடியது. முதன்மை உரை அதன் பரந்த பொருளை வைத்திருக்கிறது; அடிக்குறிப்பு இயல்பான மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பக்கம் நியாயம் இருக்கிறது’ என்பது வழக்காடல் சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘எனக்குரிய நீதி’ மூலச்சொல்லின் பொருள் அகலத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு விளக்கப்படும் சொற்றொடருக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளது.
