  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: ta
  text: ஆகவே, அவர்களுடைய செயல்களை அவர் அறிகிறார்; இரவிலே அவர்களைக் கவிழ்க்கிறார்[a]; அவர்கள் நொறுக்கப்படுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவிலே அவர்களை வீழ்த்துகிறார்.” எபிரெய மூலத்தில் “கவிழ்க்கிறார்” என்பதன் செயப்படுபொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; ஆனால் சூழல் தீர்ப்புக்குள்ளாகும் பொல்லாத வல்லவர்களையே சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் தர்க்கரீதியான முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יַכִּיר
  choice: அவர் அறிந்திருக்கிறார்
  rationale: הכיר என்பதன் இச்சூழலிலான ‘அடையாளம் கண்டு அறிதல், கவனத்தில் கொள்ளுதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; தேவன் அவர்களுடைய செயல்களைத் தெளிவாக அறிந்திருப்பதைக் குறிக்கிறது.
- source_word: מַעְבָּדֵיהֶם
  choice: அவர்களுடைய செயல்களை
  rationale: அவர்கள் செய்தவற்றைக் குறிக்கும் பொதுவான, தெளிவான நவீனத் தமிழ் சொற்றொடர்.
- source_word: וְהָפַךְ
  choice: அவர்களைக் கவிழ்த்துப்போடுகிறார்
  rationale: הפך என்பதன் ‘கவிழ்த்தல்/வீழ்த்துதல்’ என்ற வலிமையான தீர்ப்புக் காட்சியைப் பாதுகாக்கிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலிலுள்ள பொல்லாத வல்லவர்களையே குறிக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; திடீரென நிகழும் இரவுநேரத் தீர்ப்பையும் தக்கவைக்கிறது.
- source_word: וְיִדַּכָּאוּ
  choice: அவர்கள் நொறுக்கப்படுகிறார்கள்
  rationale: דכא என்பதன் ‘நசுக்கப்படுதல்/நொறுக்கப்படுதல்’ என்ற வலுவான செயப்பாட்டு அர்த்தத்தையும் தெய்வீகத் தீர்ப்பின் தீவிரத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்ப்புக் காட்சியில் மறைந்துள்ள எழுவாயும் செயப்படுபொருளும்
  choice: வினைகளின் எழுவாய் தேவன்; ‘கவிழ்த்துப்போடுகிறார்’ என்பதன் மறைந்த செயப்படுபொருள் சூழலில் பேசப்படும் பொல்லாத வல்லவர்கள் என்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இரவை அவர் மாற்றுகிறார்’ என்று இலக்கணரீதியில் சாத்தியமானாலும் சூழலுக்கு இயல்பற்ற வகையில் வாசித்தல்; அல்லது வினைகளை எழுவாயற்றவையாகக் கொள்ளுதல்.
  rationale: யோபு 34:24–26 சூழல், வல்லமையுள்ள பொல்லாதவர்களின் செயல்களை அறிந்து அவர்களைத் தீர்ப்பிடும் தேவனைப் பற்றிப் பேசுகிறது. எபிரெயம் மறைமுகமாக விட்ட செயப்படுபொருளைத் தமிழில் ‘அவர்களை’ என்று வழங்குவது சூழலின் தெளிவான பொருளை வெளிப்படுத்துகிறது; அதேவேளை அடிக்குறிப்பு மூலமொழியின் அமைப்பைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘கவிழ்த்துப்போடுகிறார்’ தீர்ப்பின் காட்சித் தீவிரத்தைத் தக்கவைக்கிறது; ‘நொறுக்கப்படுகிறார்கள்’ மூலத்தின் வலுவான செயப்பாட்டு முடிவைப் பாதுகாக்கிறது.
