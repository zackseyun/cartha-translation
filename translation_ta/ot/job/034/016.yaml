  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: ta
  text: உனக்குப் புரிந்துகொள்ளும் திறன் இருந்தால், இதைக் கேள்; என் சொற்களின் ஒலிக்குச் செவிகொடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சொற்களின் குரலுக்குச் செவிகொடு.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள், “என் சொற்களின் ஒலி/குரலுக்கு” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: இருந்தால்
  rationale: இணைப்பிடைச் சொல்லுடன் வரும் நிபந்தனைத் துகள், கேட்பவரிடம் புரிந்துகொள்ளும் திறன் இருப்பதை நிபந்தனையாகக் கொண்டு வேண்டுகோளை முன்வைக்கிறது. இயல்பான தமிழில் நிபந்தனை வினைமுற்று இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּינָה
  choice: புரிந்துகொள்ளும் திறன்
  rationale: இந்தச் சொல் புரிதல், பகுத்தறிவு, நுண்ணறிவு ஆகிய பொருள்களைத் தரலாம். இங்கு எலிகூவின் வாதத்தை உணரும் ஆற்றலைக் குறிக்க இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁמְעָה
  choice: கேள்
  rationale: שׁמע என்பதன் கட்டளை வடிவம். நேரடியான அழைப்பைத் தக்கவைத்து, அடுத்து வரும் கவனமாகச் செவிகொடுக்கும் கட்டளையிலிருந்து வேறுபடுத்துகிறது.
- source_word: זֹּאת
  choice: இதை
  rationale: எலிகூ இப்போது கூறும் செய்தியைச் சுட்டுகிறது. விளக்கப் பெயர்ச்சொல் எதையும் சேர்க்காமல் எபிரெயச் சுட்டுப்பெயரைக் காக்கிறது.
- source_word: הַאֲזִינָה
  choice: செவிகொடு
  rationale: கவனத்துடன் கேட்பதை வலியுறுத்தும் வினை. நவீனத் தமிழிலும் கண்ணியமான நடையிலும் இயல்பாக இருந்து, முந்தைய ‘கேள்’ என்பதைக் காட்டிலும் தீவிரமான கவனத்தைக் குறிக்கிறது.
- source_word: לְקוֹל
  choice: ஒலிக்கு
  rationale: קוֹל என்பது ‘ஒலி’ அல்லது ‘குரல்’ எனப் பொருள்படலாம். ‘என் சொற்கள்’ என்பதுடன் இணைந்துள்ள எபிரெயக் கட்டமைப்பைச் சுருக்காமல் ‘ஒலி’ என்று நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: מִלָּי
  choice: என் சொற்கள்
  rationale: பேசப்பட்ட சொற்கள் அல்லது உரைகளைக் குறிக்கும் பன்மை வடிவம். ‘என் சொற்கள்’ என்பது அதன் திடமான பன்மையையும் நேரடிப் பொருளையும் காக்கிறது.
