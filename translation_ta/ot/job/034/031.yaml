source:
  edition: WLC
  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: ta
  text: ஏனெனில், கடவுளிடம், “நான் தாங்கினேன்[a]; இனிமேல் தவறு செய்யமாட்டேன்” என்று யாராவது சொல்லியிருக்கிறாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “நான் தாங்கினேன்; நான் கேடாக நடக்கமாட்டேன்.” ‘தாங்கினேன்’ என்பதற்கான செயப்படுபொருளை எபிரெயம் குறிப்பிடவில்லை; அது தண்டனை, கண்டிப்பு, அல்லது குற்றச்சுமையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל אֵל
  choice: கடவுளிடம்
  rationale: אֶל என்ற முன்னிடைச்சொல்லும் אֵל என்ற இறைப்பட்டமும் இங்கு இயல்பாக ‘கடவுளிடம்’ எனப் பொருள்படுகின்றன.
- source_word: הֶאָמַר
  choice: யாராவது ... சொல்லியிருக்கிறாரா?
  rationale: வடிவவியல்படி இது மூன்றாம் நபர் ஆண்பால் ஒருமை வினை என்றாலும், சூழலில் பொதுவான ஒருவரைக் குறிக்கும் வினாவாகப் புரிந்துகொள்ளப்படுகிறது; தமிழ் மொழிநடையில் அந்த மறைமுக எழுவாயை ‘யாராவது’ என வெளிப்படுத்துவது இயல்பானது.
- source_word: נָשָׂאתִי
  choice: நான் தண்டனையைத் தாங்கிக்கொண்டேன்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/தாங்குதல்.’ எபிரெயத்தில் அதன் செயப்படுபொருள் சொல்லப்படவில்லை; இச்சூழலில் தண்டனை அல்லது கண்டிப்பைத் தாங்குதல் என்பது சாத்தியமான உட்பொருள். வாசிப்புத் தெளிவுக்காக ‘தண்டனையை’ முதன்மை உரையில் சேர்த்து, மூலத்தின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
- source_word: לֹא אֶחְבֹּל
  choice: இனி தவறு செய்யமாட்டேன்
  rationale: חבל இங்கு ஒழுக்கநிலையில் தவறாக அல்லது கேடாக நடப்பதைக் குறிக்கிறது. வாக்குறுதி சார்ந்த எதிர்கால நோக்கை இயல்பான தமிழில் ‘இனி ... செய்யமாட்டேன்’ எனத் தெரிவித்துள்ளோம்.
theological_decisions:
- issue: נָשָׂאתִי என்பதன் சொல்லப்படாத செயப்படுபொருள்
  choice: முதன்மை உரையில் ‘தண்டனையை’ என்று வெளிப்படுத்தி, அடிக்குறிப்பில் அதன் ஊகத்தன்மையைக் குறிப்பிடுதல்
  alternative: ‘நான் தாங்கிக்கொண்டேன்’ என்று செயப்படுபொருள் இல்லாமல் நேரடியாக மொழிபெயர்த்தல்
  rationale: ஒப்புதல் மற்றும் திருந்தும் உறுதி பற்றிய சூழலில் தண்டனை என்பது வலுவான சாத்தியம்; எனினும் மூல எபிரெயம் தண்டனை, கண்டிப்பு, அல்லது குற்றச்சுமை ஆகியவற்றில் ஒன்றைத் திட்டவட்டமாகத் தேர்ந்தெடுக்கவில்லை. ஆகவே பொருள் தெளிவையும் மூலத்தின் உண்மையான தெளிவின்மையையும் இரண்டையும் காக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபு நூலின் விவாதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. நேரடி மேற்கோளின் திருந்தும் உறுதி இயல்பாக ஒலிக்க ‘இனி’ பயன்படுத்தப்பட்டுள்ளது; அது தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதற்காக அல்ல.
