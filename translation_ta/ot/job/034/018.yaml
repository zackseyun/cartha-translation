  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: ta
  text: அரசனிடம், “அயோக்கியனே!”[a] என்றும் பிரபுக்களிடம், “பொல்லாதவர்களே!”[b] என்றும் சொல்லலாமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அயோக்கியனே” என்பதற்கான எபிரெயச் சொல் மதிப்பின்மை அல்லது இழிவைக் குறிக்கிறது; இங்கு அது பிற்காலத் தனிப்பெயரான “பெலியால்” என்று அவசியம் பொருள்படாது.
    reason: lexical_alternative
  - marker: b
    text: “பொல்லாதவன்” என்பது எபிரெயத்தில் ஒருமை வடிவில் உள்ளது; ஆனால் பன்மையான “பிரபுக்கள்” என்பவர்களை நோக்கிக் கூறப்படுவதால் தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: சொல்லலாமா?
  rationale: முன்னொட்டு இங்கு வினாக்குறிப்பாகப் புரிந்துகொள்ளப்பட்டு, எபிரெயச் சொல்லமைப்பில் மறைந்துள்ள ‘இது தகுமா?’ என்ற பொருள் இயல்பான தமிழில் வினாவாக வெளிப்படுத்தப்படுகிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனிடம்
  rationale: לְ பேச்சின் முகவரியைக் குறிக்கிறது; பெயர்ச்சொல்லுக்குக் குறிப்புச் சுட்டு இல்லாததால் பொதுவாக ‘அரசனிடம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּלִיָּעַל
  choice: கயவனே
  rationale: இங்கு இது பிற்காலத் தனிப்பெயரான ‘பெலியால்’ அல்ல; மதிப்பற்ற, இழிந்த ஒருவனைக் குறிக்கும் கடுஞ்சொல். இயல்பான தமிழ் விளிப்பாக ‘கயவனே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רָשָׁע
  choice: பொல்லாதவர்களே
  rationale: எபிரெயத்தில் ஒருமை வடிவமாக இருந்தாலும், பன்மையான ‘பிரபுக்கள்’ என்பவர்களை நோக்கிய இணை விளிப்பாக அமைந்ததால் தமிழில் பன்மையாக வழங்கப்பட்டது.
- source_word: אֶל נְדִיבִים
  choice: பிரபுக்களிடம்
  rationale: אֶל பேச்சின் முகவரியைக் குறிக்கிறது. נְדִיבִים இச்சூழலில் சமூக அல்லது ஆட்சிநிலையில் உயர்ந்தவர்களைக் குறிப்பதால் ‘பிரபுக்கள்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: הַאֲמֹר என்பதன் வாக்கியச் செயல்பாடு
  choice: ‘சொல்லலாமா?’ என்ற வினா
  alternative: ‘சொல்கிறவர்’ என்ற தொடர்புத் தொடர்
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள הַ־ வடிவம் வினா முன்னொட்டாக வாசிக்க இயல்பானது. ஆகவே ஆங்கில ஆலோசனை உரையின் தொடர்புத் தொடர் வாசிப்பை அப்படியே பின்பற்றாமல், மூலமொழியின் வினாத்தன்மை காக்கப்பட்டது. இவ்வினா, அதிகாரத்தில் இருப்பவர்களை இவ்வாறு அழைப்பது தகுமா என்ற சொல்லாட்சித் திருப்பத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வினாவாக அமைக்கப்பட்டது. ‘கயவனே’ மற்றும் ‘பொல்லாதவர்களே’ நேரடியான கடுஞ்சொற்களின் வலிமையைக் காக்கின்றன; ‘பிரபுக்கள்’ அரசன் என்பதுடன் இணையான சமூக-அரசியல் உயர்நிலையைக் காட்டுகிறது.
