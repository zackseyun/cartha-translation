  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதைமிக்க ஏவல் தொனியும் கொண்ட மொழிநடை. இரண்டு விளியழைப்புகளும் இரண்டு இணை ஏவல்களும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
