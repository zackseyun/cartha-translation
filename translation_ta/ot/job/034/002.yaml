  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: ta
  text: ஞானிகளே, என் சொற்களைக் கேளுங்கள்; அறிந்தவர்களே, எனக்குச் செவிகொடுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: שׁמע என்பதன் பன்மை ஏவல் வடிவம்; நேரடியான அழைப்பையும் அடுத்த இணை ஏவலுடனான கவிதை இணைத்தன்மையையும் இயல்பாகக் காக்கிறது.
- source_word: חֲכָמִים
  choice: ஞானிகளே
  rationale: பெயர்ச்சொல்லாகவும் விளிவடிவிலும் வரும் பன்மைச் சொல். நவீனத் தமிழில் இயல்பான மரியாதைமிக்க நேரடி அழைப்பு; ஆண்பால் பன்மையைத் தமிழ் தனியே குறிக்க வேண்டியதில்லை.
- source_word: מִלָּי
  choice: என் சொற்களை
  rationale: யோபு நூலுக்குரிய சொல்லாட்சியில் 'சொல்/உரை' எனப் பொருள்படும் பன்மை வடிவம்; உடைமைப் பின்னொட்டுடன் உள்ள தெளிவான பொருளைக் காக்கிறது.
- source_word: וְיֹדְעִים
  choice: அறிந்தவர்களே
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை நிகழ்கால வினையெச்சத்தின் அழைப்புத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் குறிப்பிடப்படாத அறிவின் பொருளைச் சேர்க்கவில்லை.
- source_word: הַאֲזִינוּ
  choice: செவிகொடுங்கள்
  rationale: אזן என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவத்தில் உள்ள 'செவி சாய்த்துக் கேள்' என்ற உருவகத்தைத் தமிழில் காக்கிறது; முதல் 'கேளுங்கள்' என்பதுடனான இணைநிலையையும் வேறுபாட்டையும் தக்கவைக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: முன்னிடைச்சொல் மற்றும் முதலாம் நபர் ஒருமைப் பின்னொட்டை வெளிப்படையாக மொழிபெயர்க்கிறது; 'எனக்குச் செவிகொடுங்கள்' என்பது இயல்பான தமிழ் வழக்கு.
