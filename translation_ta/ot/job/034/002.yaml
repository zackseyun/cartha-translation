  naturalness: “ஞானிகளே, என் சொற்களைக் கேளுங்கள்; அறிந்தவர்களே, எனக்குச் செவிகொடுங்கள்” என்பது நவீன நிலையான தமிழில் இயல்பாகவும், செய்யுளுக்கேற்ற மரியாதைமிக்க அழைப்புத் தொனியுடனும் உள்ளது. “செவிகொடுங்கள்” இரண்டாம் ஏவலின் கவனமாய்க் கேட்கும் நுணுக்கத்தைச் சரியாக வெளிப்படுத்துகிறது.
