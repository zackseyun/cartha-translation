  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: ta
  text: என் தந்தையே[a], தீய மனிதர்கள் அளிப்பதுபோன்ற பதில்களின் காரணமாக, யோபு முழுமையாகச் சோதிக்கப்படட்டும்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “என் தந்தை” என்று உள்ளது. இது பெரும்பாலும் ஓர் அழைப்பாகப் புரிந்துகொள்ளப்படுகிறது; ஆயினும் இதை வேறுவிதமாகவும் விளக்குகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “என்றென்றும்” அல்லது “நிரந்தரம் வரை”; இங்கு முடிவில்லாத காலத்தைவிட முழுமையான அல்லது உச்சமான சோதனையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தீய மனிதர்களோடு” அல்லது “தீய மனிதர்களிடையே”; எபிரெய முன்னிடைச்சொல் ஒப்புமையையோ உடன்சேர்க்கையையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: என் தந்தையே
  rationale: இச்சொல்லின் நேர்ப்பொருள் ‘என் தந்தை’; இங்கு விளிவேற்றுமை அழைப்பாகப் புரிந்துகொள்வது மெய்யெழுத்து உரைக்கும் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: יִבָּחֵן
  choice: சோதிக்கப்படட்டும்
  rationale: בחן என்பதன் நிஃபால் வடிவம் ‘சோதிக்கப்படுதல்/ஆராயப்படுதல்’ என்று பொருள்படும்; இவ்வாக்கியத்தின் விருப்ப அல்லது வேண்டுகோள் வலிமையை ‘-ட்டும்’ வெளிப்படுத்துகிறது.
- source_word: עַד נֶצַח
  choice: முழுமையாக
  rationale: நேரடியாக ‘என்றென்றும்/நிரந்தரம் வரை’ என்றாலும், நீதித்தீர்ப்புக்குரிய சோதனைச் சூழலில் அதன் தீவிரத்தையும் முழுமையையும் குறிக்கும் வாய்ப்பு அதிகம். தமிழில் ‘முழுமையாக’ என்பது முடிவில்லாத காலத்தைத் தேவையின்றி வலியுறுத்தாமல் அந்தக் கருத்தை இயல்பாகத் தருகிறது.
- source_word: עַל
  choice: நிமித்தம்
  rationale: யோபு சோதிக்கப்பட வேண்டும் என்ற விருப்பத்திற்கான காரணத்தை இம்முன்னிடைச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: תְּשֻׁבוֹת
  choice: அளித்த பதில்கள்
  rationale: விவாதச் சூழலில் இப்பெயர்ச்சொல் ‘பதில்கள்/மறுமொழிகள்’ எனப் பொருள்படும். இயல்பான தமிழ் தொடருக்காக ‘அளித்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: தீய மனிதர்களைப் போல
  rationale: בְּ முன்னிடைச்சொல் இங்கு ஒப்புமையையோ உடன்சேர்க்கையையோ குறிக்கலாம். முதன்மை உரையில் ஒப்புமைப் பொருள் தேர்ந்தெடுக்கப்பட்டாலும், மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யோபைச் சோதிக்க வேண்டும் என்ற எலிகூவின் விருப்பத்தின் பொருள்
  choice: தீய மனிதர்களுடைய பதில்களைப் போன்ற பதில்களை யோபு அளித்ததால், அவர் முழுமையாகச் சோதிக்கப்பட வேண்டும் என்ற வேண்டுகோள்
  alternative: யோபு தீய மனிதர்களோடு சேர்ந்து சோதிக்கப்பட வேண்டும் என்ற வேண்டுகோள்; அல்லது அவர் என்றென்றும் சோதிக்கப்பட வேண்டும் என்ற கூற்று
  rationale: எபிரெய வாக்கிய அமைப்பு கடினமானது. முதன்மை உரை அதன் விருப்ப வலிமையையும் குற்றஞ்சாட்டும் தொனியையும் தருகிறது; அதேவேளை காலநீளம் மற்றும் உடன்சேர்க்கை பற்றிய மாற்றுப் புரிதல்களை அடிக்குறிப்புகள் வெளிப்படையாகப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் தந்தையே’ என்ற அழைப்பு சற்றே இலக்கியத் தன்மை கொண்டாலும் வேதாகம உரையாடலுக்கு இயல்பானது. எபிரெயத்தின் உண்மையான தொடரியல் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
