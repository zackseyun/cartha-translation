  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: ta
  text: ஏனெனில், ஒரு மனிதன் நியாயத்தீர்ப்புக்காகக் கடவுளின் முன்னிலையில் ஆஜராக, அவர் அவனுக்காக மேலும் ஒரு காலத்தை நிர்ணயிப்பதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதன் நியாயத்தீர்ப்புக்காகக் கடவுளின் முன்னிலையில் ஆஜராக, அவர் அவனுக்காக இனிமேல் எந்தக் காலத்தையும் நிர்ணயிப்பதில்லை.” எபிரெய வாசகம் கடினமானதும் மிகவும் சுருக்கமானதும் ஆகும்; தீர்ப்பளிப்பதற்கு முன் கடவுளுக்குக் கூடுதல் விசாரணையோ தாமதமோ தேவையில்லை என்பதே இதன் கருத்தாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; எலிகூவின் வாத ஓட்டத்துக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: עַל אִישׁ
  choice: ஒரு மனிதனுக்காக
  rationale: שׂים என்பதுடன் வரும் עַל, ஒருவருக்காக ஒன்றை நியமிப்பதைக் குறிக்கலாம். אִישׁ என்ற ஆண்பால் ஒருமையைப் பேணியபடியே தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָשִׂים
  choice: நிர்ணயிப்பதில்லை
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை, ஏற்படுத்து, நியமி’ என்பதாகும்; இங்கு காலத்தை நிர்ணயித்தல் என்ற நீதித்துறைச் சூழலுக்கு இது பொருந்துகிறது.
- source_word: עוֹד
  choice: வேறொரு காலத்தை
  rationale: עוֹד என்பது ‘மேலும், மறுபடியும், இன்னும்’ எனப் பொருள்படும். எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத ‘காலம்’ என்பதை சூழலின் அடிப்படையில் நிரப்பி, கூடுதல் அல்லது மறுமுறை வாய்ப்பை ‘வேறொரு’ என்பதன் மூலம் காட்டுகிறது.
- source_word: לַהֲלֹךְ אֶל אֵל
  choice: கடவுள்முன் செல்லும்படி
  rationale: சொல்லர்த்தமாக ‘கடவுளிடம் செல்ல’ என்பதாக இருந்தாலும், நீதித்துறைச் சூழலில் விசாரணைக்காகக் கடவுளின் முன்னிலையில் ஆஜராவதை இயல்பாக உணர்த்துகிறது.
- source_word: בַּמִּשְׁפָּט
  choice: நியாயத்தீர்ப்புக்காக
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நீதி அல்லது சட்ட விசாரணையைக் குறிக்கலாம். இங்கு நீதிமன்றச் சூழலைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עוֹד என்பதையும் יָשִׂים என்பதற்குப் பின் மறைந்துள்ள செயப்படுபொருளையும் கொண்ட சுருக்கமான கடின வாக்கியத்தின் பொருள்
  choice: ஒரு மனிதன் நியாயத்தீர்ப்புக்காகத் தம்முன் வருவதற்கு, கடவுள் வேறொரு காலத்தை நிர்ணயிக்க வேண்டியதில்லை.
  alternative: கடவுள் ஒரு மனிதனைத் தம்முடன் வழக்காட வரவழைப்பதற்குமுன் அவன்மீது மேலும் கவனம் செலுத்துவதில்லை; அல்லது, ஒருவர் நியாயத்தீர்ப்புக்காகக் கடவுளிடம் செல்ல எந்தக் காலத்தையும் அவர் நியமிப்பதில்லை.
  rationale: எபிரெய வாசகம் சுருக்கமானதும் பலவாறு புரிந்துகொள்ளக்கூடியதுமாக உள்ளது. மனிதர்களைப் பற்றிய கடவுளின் அறிவு முழுமையானது என்ற உடனடி சூழலில், தீர்ப்பளிப்பதற்கு அவருக்கு இன்னொரு விசாரணையோ தாமதமோ தேவையில்லை என்ற வாசிப்பு עוֹד, ‘செல்ல’ என்ற வினையெச்சம், மற்றும் நீதித்துறைச் சொற்றொடர் ஆகியவற்றை நன்றாக இணைக்கிறது. மாற்று வாசிப்புகள் அடிக்குறிப்பில் மறைக்கப்படாமல் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்முன்’ என்பது நீதிமன்றத்தில் முன்னிலையாவதைக் காட்டுகிறது; மூலத்தின் சுருக்கத்தால் உருவாகும் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
