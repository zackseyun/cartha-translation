revisions:
- from: ஏனெனில், ஒரு மனிதன் நியாயத்தீர்ப்புக்காகக் கடவுள்முன் செல்லும்படி, அவர் அவனுக்காக வேறொரு காலத்தை நிர்ணயிப்பதில்லை.[a]
  to: ஏனெனில், ஒரு மனிதன் நியாயத்தீர்ப்புக்காகக் கடவுளின் முன்னிலையில் ஆஜராக, அவர் அவனுக்காக மேலும் ஒரு காலத்தை நிர்ணயிப்பதில்லை.[a]
