  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய இணைநிலையை ‘அறிவு’ மற்றும் ‘புரிந்துணர்வு’ என்ற வேறுபட்ட சொற்கள் மூலம் காக்கிறது.
