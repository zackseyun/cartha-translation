  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: ta
  text: யோபு அறிவில்லாமல் பேசுகிறார்; அவரது வார்த்தைகளில் புரிந்துணர்வு இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: அறிவில்லாமல்
  rationale: בְּ உடன் வரும் דַּעַת இங்கு பேசும் முறையைக் குறிக்கிறது; அறிவின் குறைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְדַבֵּר
  choice: பேசுகிறார்
  rationale: இம்பெர்ஃபெக்ட் வடிவம் இங்கு ஏலிகூ யோபுவைப் பற்றி கூறும் நிகழ்கால மதிப்பீடாகச் செயல்படுகிறது.
- source_word: דְבָרָיו
  choice: அவரது வார்த்தைகள்
  rationale: பன்மை வடிவத்தின் நேரடியான பொருளையும் இரண்டாம் அரையடியின் கவித்துவ அமைப்பையும் காக்கிறது.
- source_word: בְהַשְׂכֵּיל
  choice: புரிந்துணர்வு இல்லை
  rationale: שׂכל என்பதிலுள்ள புரிதல், நுண்ணறிவு ஆகிய கருத்துகளைத் தெரிவிக்கிறது; முதல் அரையடியிலுள்ள ‘அறிவில்லாமல்’ என்பதோடு இணையான அமைப்பை உருவாக்குகிறது.
- source_word: לֹא
  choice: இல்லாமல் / இல்லை
  rationale: இரு இடங்களிலும் மறுப்பை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது; எபிரெய மொழியின் மறுக்கப்பட்ட முறை/நிலைப் பொருள் காக்கப்படுகிறது.
