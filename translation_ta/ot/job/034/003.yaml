translation_notes:
  register: நவீன தரத் தமிழில், பழமொழிக்குரிய சுருக்கமும் செவி–அண்ணம் என்ற புலனுறுப்பு இணைநிலையும் காக்கப்பட்டுள்ளன. בחן மற்றும் טעם ஆகியவற்றின் அறிதல் சார்ந்த இணைப்பை வெளிப்படுத்த ‘சோதித்தறிகிறது / சுவைத்தறிகிறது’ என்ற சமச்சீர் வினைகள் பயன்படுத்தப்பட்டுள்ளன.
