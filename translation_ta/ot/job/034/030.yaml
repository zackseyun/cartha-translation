  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: ta
  text: இறைநெறியற்றவன் ஆட்சி செய்யாதிருக்கவும், மக்களுக்குக் கண்ணிகள் ஏற்படாதிருக்கவும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைநெறியற்றவன் ஆட்சி செய்யாதிருக்கவும், மக்களுக்குக் கண்ணிகள் இல்லாதிருக்கவும்.” எபிரெய வாசகம் மிகவும் சுருக்கமாக உள்ளது; கடைசித் தொடரை “மக்களின் கண்ணிகளிலிருந்து” அல்லது “மக்களின் கண்ணிகளினிமித்தம்” என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: ஆட்சி செய்யாதபடிக்கும்
  rationale: מִן முன்னொட்டுடன் வரும் מלך வினையெச்சம், முந்தைய வசனத்தைச் சார்ந்த சூழலில் தடுப்பு அல்லது நோக்கம்/விளைவைக் குறிக்கலாம். தமிழில் ‘ஆட்சி செய்யாதபடிக்கும்’ என்பது அந்தச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: ஒரு மனிதன் என்பதைக் குறிக்கும் ‘-வன்’ வடிவம்
  rationale: இங்கு אָדָם மனிதகுலம் முழுவதையும் அல்ல, ஆட்சி செய்யக்கூடிய தனிநபரைக் குறிக்கிறது; அடுத்த சொல்லுடன் இணைத்து ‘இறைநெறியற்றவன்’ என வழங்கப்பட்டுள்ளது.
- source_word: חָנֵף
  choice: இறைநெறியற்றவன்
  rationale: ஞான இலக்கியத்தில் இச்சொல் வெறும் பாசாங்குக்காரனைவிட, கடவுளைப் பொருட்படுத்தாத அல்லது பக்தியற்ற நபரைக் குறிக்கிறது. ‘இறைநெறியற்றவன்’ அதன் அற-சமய வலிமையை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: מִמֹּקְשֵׁי
  choice: கண்ணிகள் ஏற்படாதபடிக்கும்
  rationale: מוֹקֵשׁ என்பது கண்ணி அல்லது பொறி. சுருக்கமான எபிரெயக் கவிதை அமைப்பில் மִן தடுப்பைக் குறிக்கலாம்; மக்களுக்கு கண்ணிகள் ஏற்படாமல் இருப்பது என்ற நோக்கப் பொருள் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது. பன்மை ‘கண்ணிகள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עָם
  choice: மக்களுக்கு
  rationale: பொது ஆட்சியும் ஒடுக்குதலும் பற்றிய சூழலில், ஆட்சிக்குட்பட்ட சமூகத்தைப் பொதுவாகக் குறிக்கும் வகையில் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: சுருக்கமான எபிரெய தொடரமைப்பின் பொருள்
  choice: இறைநெறியற்றவன் ஆட்சி செய்யாமலும் மக்களுக்கு கண்ணிகள் ஏற்படாமலும் இருக்கும்படி கடவுள் செயல்படுகிறார்.
  alternative: ‘இறைநெறியற்றவன் ஆட்சி செய்யாதிருக்கட்டும்; மக்களின் கண்ணிகளிலிருந்தும் காக்கட்டும்’ அல்லது ‘மக்களின் கண்ணிகளினிமித்தம்’ என இரண்டாம் தொடரைப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெயம் வினைச்சொல் விடுபட்ட சுருக்கமான கவிதை நடையில் உள்ளது; வசனம் 29-ஐச் சார்ந்து நோக்கம் அல்லது விளைவைச் சுட்டுவது சூழலுக்கு ஏற்றது. இருப்பினும் ‘மக்களின் கண்ணிகள்’ என்ற இலக்கண வாய்ப்பை அடிக்குறிப்பில் மறைக்காமல் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இறைநெறியற்றவன்’ என்பது நாத்திகன் என்ற குறுகிய பொருளைத் தவிர்த்து, חָנֵף என்பதின் பக்தியின்மை மற்றும் அறக்கேடு சார்ந்த நுண்ணுணர்வைத் தருகிறது. மூலத்தின் சுருக்கமும் பொருள் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
