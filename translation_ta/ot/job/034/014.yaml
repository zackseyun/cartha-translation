base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: ta
  text: அவர் தம்மீதே தமது உள்ளத்தைச் செலுத்தி[a], தமது ஆவியையும் தமது உயிர்மூச்சையும் தம்மிடமே சேர்த்துக்கொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இதற்கு தமது உள்ளத்தைச் செலுத்தி.” “உள்ளத்தைச் செலுத்துதல்” என்ற எபிரெயச் சொற்றொடர், கவனத்தை அல்லது நோக்கத்தை ஒரு காரியத்தின்மீது திருப்புவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -கொண்டால்
  rationale: நிபந்தனைப் பொருளை இயல்பான தமிழ் வாக்கிய முடிவால் வெளிப்படுத்துகிறது.
- source_word: יָשִׂים
  choice: செலுத்தி
  rationale: שׂים என்பதன் ‘வைத்தல்/செலுத்துதல்’ பொருளையும், ‘உள்ளத்தைச் செலுத்துதல்’ என்ற கவனம் அல்லது நோக்கம் சார்ந்த சொல்லாட்சியையும் காக்கிறது.
- source_word: אֵלָיו
  choice: தம்மீதே
  rationale: தேவனையே சுட்டும் தன்மறுப்புப் பொருளைத் தெளிவாக்குகிறது; அதேவேளை இச்சொற்றொடரின் பொருள் பற்றிய மாற்றுவாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לִבּוֹ
  choice: தமது உள்ளத்தை
  rationale: எபிரெய ‘இதயம்’ இங்கு உள்ளார்ந்த கவனம், எண்ணம் அல்லது நோக்கத்தைக் குறிக்கிறது. நவீன தமிழில் ‘உள்ளம்’ இயல்பாகவும் கண்ணியமாகவும் அந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: רוּחוֹ
  choice: தமது ஆவியை
  rationale: רוּחַ மற்றும் נְשָׁמָה ஆகிய இரு சொற்களையும் ஒன்றாக்காமல், முதலாவதை ‘ஆவி’ என்று வேறுபடுத்துகிறது.
- source_word: וְנִשְׁמָתוֹ
  choice: தமது உயிர்மூச்சையும்
  rationale: נְשָׁמָה என்பதன் மூச்சு/உயிரளிக்கும் மூச்சு என்ற பொருளைத் தெளிவாகக் காட்டி, ‘ஆவி’ என்பதிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: יֶאֱסֹף
  choice: தம்மிடமே சேர்த்துக்கொண்டால்
  rationale: אָסַף என்பதன் ‘சேர்த்தல்’ என்ற படிமத்தைத் தக்கவைத்து, இங்கு உயிரைத் தம்மிடம் மீண்டும் எடுத்துக்கொள்ளும் உட்பொருளை இயல்பான தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை ஆண்பால் சுட்டுப்பெயர்களின் குறிப்பு
  choice: அனைத்தும் தேவனைக் குறிக்கின்றன; மரியாதைப் பன்மை வடிவில் மொழிபெயர்க்கப்பட்டுள்ளன.
  alternative: முதல் אֵלָיו என்பதை ‘இதன்மீது/இதற்கு’ என்று, தேவன் ஒரு காரியத்தில் கவனம் செலுத்துவதாகப் புரிந்துகொள்ளலாம்.
  rationale: சூழலில் செய்பவர் தேவன் என்பது தெளிவு. எனினும் ‘தம்மீதே’ என்ற தன்மறுப்புப் பொருளுக்கும் ‘இதற்கு’ என்ற கவனம் சார்ந்த பொருளுக்கும் இடையிலான உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தேவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கவிதைநடையின் இணை அமைப்பை காக்க ‘ஆவி’ மற்றும் ‘உயிர்மூச்சு’ தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன.
