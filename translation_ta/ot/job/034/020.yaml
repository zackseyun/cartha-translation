  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: ta
  text: 'ஒரு கணத்தில் அவர்கள் இறந்துபோகிறார்கள்;

    நள்ளிரவில் மக்கள் உலுக்கப்பட்டு மறைந்துபோகிறார்கள்;

    வல்லவன் கையால் அல்ல, அகற்றப்படுகிறான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதக் கையால் அல்லாமல்.’ எபிரெயில் நேரடியாக ‘கையால் அல்ல’ என்று உள்ளது; மனிதச் செயலாண்மையின்றி அகற்றப்படுவதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: ஒரு கணத்தில்
  rationale: மிகக் குறுகிய நேரத்தைக் குறிக்கும் எபிரெயச் சொல்லின் காலப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: יָמֻתוּ
  choice: அவர்கள் இறந்துபோகிறார்கள்
  rationale: மரணத்தைக் குறிக்கும் பொதுவான வினையை நேரடியாகவும், திடீர் நிகழ்வின் கருத்துக்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: וַחֲצוֹת לָיְלָה
  choice: நள்ளிரவில்
  rationale: ‘இரவின் பாதியில்’ என்ற மூலமொழி அமைப்புக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְגֹעֲשׁוּ
  choice: உலுக்கப்பட்டு
  rationale: געשׁ என்பதிலுள்ள குலுக்கம், கலக்கம் ஆகிய பொருள் நிழல்களைச் சுருக்கமாகத் தருகிறது; இங்கு மக்கள் மீது நிகழும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָם
  choice: மக்கள்
  rationale: ஒரு கூட்டு மக்களைக் குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது; தமிழில் வரையறையற்ற ஒருமையைச் சுட்டும் தனிக் கட்டுரைச்சொல் இல்லாததால் ‘ஒரு’ சேர்க்கப்படவில்லை.
- source_word: וְיַעֲבֹרוּ
  choice: மறைந்துபோகிறார்கள்
  rationale: சொற்பொருளில் ‘கடந்துபோகிறார்கள்’ என்றாலும், மரணமும் அகற்றப்படுதலும் பேசப்படும் இச்சூழலில் அவர்கள் இல்லாமற்போவதை இயல்பாகக் குறிக்கிறது.
- source_word: וְיָסִירוּ
  choice: அகற்றப்படுகிறான்
  rationale: எபிரெயில் செய்பவர் குறிப்பிடப்படாத பன்மை வினை உள்ளது; தமிழில் செய்பவரைக் குறிப்பிடாத செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אַבִּיר
  choice: வல்லவன்
  rationale: வலிமை அல்லது அதிகாரம் உடைய ஒருவனைக் குறிக்கும் ஒருமை வடிவத்தைச் சுருக்கமான, dignified தமிழில் தருகிறது.
- source_word: לֹא בְיָד
  choice: கையால் அல்லாமல்
  rationale: ‘கையால் அல்ல’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்து, அது குறிப்பாக மனிதச் செயலாண்மையைக் குறிக்கிறதா என்பதை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: ‘கையால் அல்லாமல்’ என்பதில் மறைமுகமாகக் குறிக்கப்படும் செயலாண்மை
  choice: முதன்மை உரையில் மூலமொழியின் மரபுத்தொடர் நேரடியாக வைக்கப்பட்டுள்ளது; வல்லவன் சாதாரண மனிதச் செயலாண்மையின்றி அகற்றப்படுவதை இது சுட்டலாம்.
  alternative: மனிதக் கையால் அல்லாமல்
  rationale: தெய்வீகச் செயலை வெளிப்படையாகச் சேர்த்து மூலத்தின் தெளிவின்மையைத் தீர்த்துவிடாமல், இறையாண்மை குறித்த உட்கருத்தை வாசகன் காண இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதைநடையின் மூன்று படிகள் அரைப்புள்ளிகளாலும் வரிப்பிரிப்பாலும் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் குறிப்பிடப்படாத செய்பவர் மொழிபெயர்ப்பிலும் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
