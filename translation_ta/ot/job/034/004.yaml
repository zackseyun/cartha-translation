  register: நவீன நிலையான தமிழில், மரியாதையும் கவித்துவச் சமநிலையும் கொண்ட கூட்டு அழைப்பாக வடிவமைக்கப்பட்டது. முதல் அடியின் מִשְׁפָּט மற்றும் இரண்டாம் அடியின் טוֹב ஆகியவற்றுக்கிடையிலான நெறிசார் இணைநிலை பாதுகாக்கப்பட்டுள்ளது.
