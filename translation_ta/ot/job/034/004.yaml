  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: ta
  text: நீதியானதை நமக்கெனத் தேர்ந்தெடுப்போம்[a]; நம்மிடையே நல்லது எது என்பதை அறிந்துகொள்வோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியை நமக்கெனத் தேர்ந்தெடுப்போம்; நம்மிடையே நல்லது எது என்பதைப் பகுத்தறிவோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: நீதியானதை
  rationale: இந்தச் சூழலில் இச்சொல் நீதியையோ நியாயமானதையோ குறிக்கிறது; நீதிமன்றத் தீர்ப்பு என்பதைவிட, ஆராய்ந்து தேர்ந்தெடுக்க வேண்டிய நெறிசார் பொருளே முன்னிலையில் உள்ளது.
- source_word: נִבְחֲרָה
  choice: தேர்ந்தெடுப்போம்
  rationale: முதல் நபர் பன்மை exhortative/cohortative வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָּנוּ
  choice: நமக்காக
  rationale: לְ முன்னிடைச்சொல்லின் நன்மை அல்லது தொடர்பு சார்ந்த பொருளைப் பாதுகாக்கிறது; குழுவினர் தங்களுக்காகச் செய்யும் தேர்வை உணர்த்துகிறது.
- source_word: נֵדְעָה
  choice: அறிந்துகொள்வோம்
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காத்துக்கொண்டு, இங்கு ஆராய்ந்து தெளிவடையும் நுட்பத்தையும் தமிழில் உணர்த்துகிறது.
- source_word: בֵינֵינוּ
  choice: நமக்குள்
  rationale: குழுவினரிடையே நடைபெறும் பரஸ்பர ஆலோசனை அல்லது பகுத்தறிதலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מַה טּוֹב
  choice: நல்லது எது
  rationale: טוֹב என்பதன் பரந்த ‘நல்லது’ என்ற பொருளைக் காத்து, அதனை நெறிசார் அல்லது பயன்சார் ஒரே விளக்கத்திற்குள் குறுக்கவில்லை.
