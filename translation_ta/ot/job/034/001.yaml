lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்ற வினை இங்கு அடுத்த உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதையாடல் வடிவில் உள்ளது. தமிழில் ‘மறுமொழியாகச் சொன்னது’ என்பது பதிலுரையின் தன்மையையும் தொடர்ந்து வரும் உரைக்கான அறிமுகத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלִיהוּא
  choice: எலிகூ
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் வாசிக்க இயல்பான, பரவலாக அறியப்பட்ட வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பது பொதுவான பேச்சு வினை. எபிரெயில் வரும் ‘மறுமொழி கூறி, சொன்னான்’ என்ற இரட்டைச் சொல்லாக்கத்தைத் தமிழில் தேவையற்ற மறுபடியாக்கமின்றி, உரை தொடங்குவதைத் தெளிவுபடுத்தும் வகையில் இணைத்துள்ளது.
- source_word: וַ
  choice: பின்பு
  rationale: தொடக்க waw உடன் வரும் wayyiqtol கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ அந்த வரிசை முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
