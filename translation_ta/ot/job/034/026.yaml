source:
  edition: WLC
  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: ta
  text: அவர் அவர்களைத் தீயவர்களாகப் பலர் பார்க்கும் இடத்தில் அடிக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய தீமைக்காக அவர் அவர்களைப் பலர் பார்க்கும் இடத்தில் அடிக்கிறார்.” தொடக்கத்திலுள்ள கடினமான சொற்றொடர், அவர்கள் தீயவர்கள் என்ற நிலையில் அடிக்கப்படுவதைக் குறிப்பதற்குப் பதிலாக, அவர்களுடைய தண்டனைக்கான காரணத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: தீயவர்களாக
  rationale: இங்கு תַּחַת என்பது அடிக்கப்படும் நிலை அல்லது அடையாளத்தைச் சுட்டுவதாகக் கொள்ளப்படுகிறது; காரணத்தைக் குறிக்கும் வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: பன்மை பெயரடையான இது பெயர்ச்சொல்லாகச் செயல்பட்டு, பாலின வரம்பின்றி தீயவர்களைக் குறிக்கிறது.
- source_word: סְפָקָם
  choice: அவர் அவர்களை ... அடிக்கிறார்
  rationale: வினைச்சொல் அடித்தலைக் குறிக்கிறது; ‘வீழ்த்துகிறார்’ போன்ற விளைவை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: בִּמְקוֹם רֹאִים
  choice: எல்லாரும் காணும்படி
  rationale: சொற்றொடர் பார்ப்போர் முன்னிலையில் நிகழும் வெளிப்படையான தண்டனையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘எல்லாரும்’ என்பது பொதுப் பார்வையை வெளிப்படுத்தும் வழக்குச் சொல்.
theological_decisions:
- issue: תַּחַת רְשָׁעִים என்ற கடினமான சொற்றொடரின் தொடர்பு
  choice: அவர்கள் தீயவர்கள் என்ற நிலையில் அடிக்கப்படுகிறார்கள்
  alternative: அவர்களின் தீமைக்காக அடிக்கப்படுகிறார்கள்
  rationale: இலக்கண அமைப்பு நிலை/அடையாள வாசிப்பை அனுமதிக்கிறது; காரண வாசிப்பும் உண்மையான சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும், நீதித்தீர்ப்பின் பொது வெளிப்பாட்டைத் தெளிவாகவும் கூறும் கண்ணியமான நடை. மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
