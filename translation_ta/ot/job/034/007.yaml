  text: מִי גֶ֥בֶר כְּ/אִיּ֑וֹב יִֽשְׁתֶּה לַּ֥עַג כַּ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: ta
  text: யோபைப் போல ஏளனத்தைத் தண்ணீரைப் போலக் குடிப்பவன் எந்த மனிதன்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: மனிதன் யார்?
  rationale: מִי அறிமுகப்படுத்தும் வினாவையும், גֶבֶר குறிக்கும் ஒருமை ஆண்பாலான மனிதரையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. ‘வலிமைமிக்க மனிதன்’ என்பது இச்சூழலில் தேவையற்ற மிகைமொழிபெயர்ப்பாகும்.
- source_word: כְּאִיּוֹב
  choice: யோபைப் போன்ற
  rationale: முன்னொட்டு כְּ குறிக்கும் ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: יִשְׁתֶּה
  choice: குடிக்கிறானே
  rationale: இச்சொல் சொல்லாட்சிசார் அல்லது இயல்பை விவரிக்கும் செயலைக் குறிக்கிறது. நிகழ்காலம் அதைப் பொருத்தமாக வெளிப்படுத்துகிறது; ‘-ஆனே’ வினாவிலுள்ள வியப்பும் கண்டனமும் கலந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: לַּעַג
  choice: ஏளனம்
  rationale: இகழ்ந்து கேலி செய்வதைக் குறிக்கும் பெயர்ச்சொல். ‘ஏளனம்’ நவீனத் தமிழில் தெளிவாகவும் இங்கு குடிக்கப்படும் ஒன்றாக உருவகிக்கப்பட்டுள்ள கேலியைப் பொருத்தமாகவும் தெரிவிக்கிறது.
- source_word: כַּמָּיִם
  choice: தண்ணீரைப் போல
  rationale: ஒப்புமையையும் எளிதாகவும் மிகுதியாகவும் உட்கொள்வதைக் காட்டும் உயிரோட்டமான உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: யோபு ஏளனத்தைக் ‘குடிப்பது’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்காமல் அப்படியே வைத்தல்
  alternative: யோபு பிறரை ஏளனம் செய்கிறார் அல்லது பிறரின் ஏளனத்தைத் தாங்குகிறார் என்று வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய வாசகம் ஏளனம் செய்பவர் யார் அல்லது அதன் திசை என்ன என்பதை விரிவாகத் தீர்மானிக்கவில்லை. ஆகவே அந்தச் சொல்லாட்சியின் இறையியல் மற்றும் சூழல்சார் பதற்றத்தை மொழிபெயர்ப்பு மௌனமாகத் தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கவித்துவ உருவகத்தையும் வினாவின் கண்டனத் தொனியையும் காக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொற்றொடரின் இயல்பான பிரிவைத் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது.
