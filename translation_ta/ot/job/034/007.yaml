  source_fidelity: மூல எபிரெயத்தின் அடிப்படைப் பொருள்கள்—யோபுடனான ஒப்பீடு, ஏளனத்தைத் தண்ணீரைப்போல் குடித்தல் என்ற உருவகம்—வரைவில் காக்கப்பட்டுள்ளன. ஆனால் எபிரெயத்தில் ஒரே சொல்லாட்சிவினாவாக வரும் தொடர்புத்தொடர், தமிழில் இரு வாக்கியங்களாகப் பிரிக்கப்பட்டு இரண்டாவது பகுதி வினாவிலிருந்து விலகி வியப்புவாக்கியமாகியுள்ளது.
