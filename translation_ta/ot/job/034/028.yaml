  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: ta
  text: ஏழையின் கூக்குரல் அவர்முன்[a] வரும்படி செய்தார்கள்; துன்புறுவோரின்[b] கூக்குரலை அவர் கேட்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன்மேல்’ அல்லது ‘அவனுக்கு எதிராக’; இங்குள்ள எபிரெய முன்னிடைச்சொல்லைப் பல விதங்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஏழைகளின்’ அல்லது ‘ஒடுக்கப்பட்டோரின்’; இவ்விரு எபிரெயச் சொற்களின் பொருள்கள் ஒன்றுடன் ஒன்று ஒட்டினாலும், அவை முற்றிலும் ஒரே பொருளுடையவை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: கொண்டுவரும்படியாக
  rationale: לְ முன்னொட்டுடன் வரும் ஹிஃபில் வினையெச்சம் முந்தைய சூழலின் விளைவு அல்லது நோக்கத்தைக் குறிக்கிறது. ‘கொண்டுவரும்படியாக’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עָלָיו
  choice: அவர்முன்
  rationale: בוא உடன் வரும் על, கூக்குரல் கடவுளின் கவனத்துக்குக் கொண்டுவரப்படுவதை இங்கு குறிக்கலாம். ‘அவர்முன்’ என்பது நீதிபதியிடம் ஒரு முறையீடு வைக்கப்படுவது போன்ற கருத்தை இயல்பாகத் தருகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு தக்கவைக்கிறது.
- source_word: צַעֲקַת
  choice: கூக்குரல்
  rationale: צעקה துயரத்திலிருந்து எழும் உரத்த முறையீடு அல்லது கூக்குரலைக் குறிக்கிறது. ‘கூக்குரல்’ நேரடியானதும் இச்சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: דָּל
  choice: ஏழை
  rationale: דָּל பொருளாதார ஏழ்மையையும் சமூக வலுவின்மையையும் குறிக்கக்கூடும். இங்கு ‘ஏழை’ பொதுவாகப் புரியும் இயல்பான தேர்வு.
- source_word: וְצַעֲקַת
  choice: கூக்குரலையும்
  rationale: எபிரெய உரையில் பெயர்ச்சொல் மீண்டும் வருவதால், கவிதை இணைநிலையைத் தக்கவைக்க தமிழிலும் ‘கூக்குரல்’ மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: עֲנִיִּים
  choice: துன்புறுவோர்
  rationale: עֲנִיִּים ஏழைகள், துன்புறுவோர் அல்லது ஒடுக்கப்பட்டோர் எனப் பொருள்படலாம். דָּל என்பதிலிருந்து வேறுபாட்டை ஓரளவு காத்தபடி இரு சொற்களின் பொருள் ஒட்டுமையையும் இது விடுகிறது.
- source_word: יִשְׁמָע
  choice: அவர் கேட்கும்படியாக
  rationale: இங்கு இறைவனைச் சுட்டும் ஒருமை வினை கவிதைச் சூழலில் அவரது வழக்கமான செயலைக் குறிக்கிறது. முந்தைய நோக்கம்/விளைவு அமைப்போடு இயல்பாக இணைய தமிழில் ‘கேட்கும்படியாக’ என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: עָלָיו என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு மற்றும் יִשְׁמָע என்பதன் எழுவாய்
  choice: கூக்குரல் கடவுளின் முன்னிலையில் கொண்டுவரப்படுகிறது; துன்புறுவோரின் கூக்குரலைக் கேட்பவர் கடவுள்.
  alternative: கூக்குரல் கொடியவனுக்கு எதிராகக் கொண்டுவரப்படுகிறது; ஆனால் அதைக் கேட்பவர் கடவுள்; அல்லது கூக்குரல் ஒடுக்குகிறவன்மேல் வந்து, அவனே அதைக் கேட்கிறான்.
  rationale: உடனடிச் சூழலில் எலிகூ கொடியவர்களின் ஒடுக்குதலையும் கடவுளின் நீதியுள்ள கவனத்தையும் விவரிக்கிறார். ஆகவே இறுதி ஒருமை வினையின் மறைமுக எழுவாய் கடவுள் என்பதே இயல்பான வாசிப்பு. எனினும் עָלָיו என்பதன் இலக்கணப் பலபொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைநிலையும் துயர முறையீட்டின் வலிமையும் காக்கப்பட்டுள்ளன. ‘அவர்’ இறைவனை மரியாதையுடன் சுட்டுகிறது. வசனம் முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடர்வதால், தமிழிலும் நோக்கம்/விளைவைச் சுட்டும் இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
