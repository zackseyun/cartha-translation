  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: ta
  text: நீதியை வெறுப்பவன்கூட ஆட்சி செய்ய முடியுமா?[a] நீதியுள்ள வல்லவரை நீ குற்றவாளி என்று தீர்ப்பாயா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆள முடியுமா?’, ‘கட்டுப்படுத்த முடியுமா?’ அல்லது சொல்லுக்குச் சொல், ‘கட்ட முடியுமா?’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் எபிரெய வினைச்சொல் ஆட்சி அல்லது கட்டுப்பாட்டைச் செலுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதியுள்ள வலிமைமிக்கவனை’ அல்லது ‘நீதியுள்ள மகத்தானவரை’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் இந்தச் சொற்றொடர் பெரும்பாலும் கடவுளைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: முடியுமா?
  rationale: கேள்வித் துகளுடன் சேர்ந்த אַף வலியுறுத்தலுள்ள சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான சொல்லாட்சிக் கேள்வியாக ‘முடியுமா?’ அதை வெளிப்படுத்துகிறது.
- source_word: שׂוֹנֵא
  choice: வெறுக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இப்பெயரெச்சம், வெறுப்பால் வகைப்படுத்தப்படும் ஒருவனைக் குறிக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இங்கு தனிப்பட்ட ஒரு தீர்ப்பைவிட, நேர்மையான ஆட்சிக்கும் ஒழுங்குக்கும் அடிப்படையான நீதியே கருத்தாக உள்ளது.
- source_word: יַחֲבֹשׁ
  choice: ஆட்சி செய்ய
  rationale: வினையின் அடிப்படைப் பொருள் ‘கட்டுதல்’; இச்சூழலில் அதிகாரம் செலுத்துதல் அல்லது கட்டுப்படுத்துதல் என்ற வழக்குப் பொருள் பொருந்துவதால் ‘ஆட்சி செய்ய’ என வழங்கப்பட்டது.
- source_word: צַדִּיק
  choice: நீதியுள்ள
  rationale: இது ஒழுக்க மற்றும் நீதிசார் நேர்மையைக் குறிக்கிறது; அடுத்த சொல்லோடு இயல்பாக இணைய ‘நீதியுள்ள’ பயன்படுத்தப்பட்டது.
- source_word: כַּבִּיר
  choice: வல்லவர்
  rationale: ‘வல்லவர்’ என்பது வலிமைமிக்கவர் அல்லது மகத்தானவர் என்ற பெயரடைப் பெயர்ச்சொல் பயன்பாட்டைப் பாதுகாக்கிறது; சூழலில் இது பெரும்பாலும் கடவுளைக் குறிக்கிறது.
- source_word: תַּרְשִׁיעַ
  choice: குற்றவாளி என்று தீர்ப்பாயா
  rationale: רשע என்பதன் ஹிபீல் வடிவம் ஒருவரைக் குற்றவாளி என அறிவித்தல் அல்லது கண்டனம் செய்தல் என்பதைக் குறிக்கிறது; நீதிமன்றத் தொனியை இவ்வடிவம் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ‘நீதியுள்ள வல்லவர்’ என்பதன் குறிப்பு
  choice: முதன்மையாகக் கடவுளைக் குறிக்கும் வாசிப்பு; ‘வல்லவர்’ என்ற மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டது.
  alternative: நீதியுள்ள வலிமைமிக்க ஆட்சியாளர் ஒருவரைப் பொதுவாகக் குறிப்பது.
  rationale: எலிகூவின் வாதத்தில், நீதியை வெறுப்பவன் ஆள இயலாது என்பதையும், உயர்ந்த நீதியுள்ள ஆளுநரை மனிதன் குற்றவாளி எனத் தீர்க்க முடியாது என்பதையும் இணைக்கும் சொல்லாட்சிக் கேள்வி இது. எனினும் எபிரெயச் சொற்றொடர் தனியே வெளிப்படையான இறைப்பெயரை வழங்காததால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் ஞான இலக்கியத்துக்கேற்ற கண்ணியமான தொனியில் மொழிபெயர்க்கப்பட்டது. இரு சொல்லாட்சிக் கேள்விகளின் இணைநிலை காக்கப்பட்டது. ‘குற்றவாளி என்று தீர்ப்பாயா’ என்பது மூலத்தின் நீதிமன்றப் பொருளைத் தெளிவாக்குகிறது; எபிரெயத்தின் சொற்பொருள் மற்றும் சாத்தியமான பொதுவான மனிதக் குறிப்பு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
