  terminology: “குற்றவாளி என்று தீர்ப்பளிக்க,” “தமது முகத்தை மறைத்தால்,” “நாடு,” and “மனிதன்” are suitable, source-sensitive choices. Respectful singular reference to God is consistently maintained.
