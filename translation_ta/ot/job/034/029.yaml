  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: ta
  text: அவர் அமைதியை அளித்தால், யார் குற்றவாளி என்று தீர்ப்பளிக்க முடியும்?[a] அவர் தமது முகத்தை மறைத்தால், யார் அவரைக் காண முடியும்?[b] ஒரு நாட்டுக்கும் ஒரு மனிதனுக்கும் இது சமமாகப் பொருந்தும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யார் அவரைக் குற்றவாளி என்று அறிவிக்க முடியும்?’ எபிரெய வினைச்சொல் ஒருவரைப் பொல்லாதவர் அல்லது குற்றவாளி என்று நீதித்துறையில் தீர்ப்பளிக்கும் பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யார் அவரை உற்றுநோக்க முடியும்?’ இங்குள்ள வினைச்சொல் ‘பார்’, ‘உற்றுநோக்கு’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘ஒரு நாட்டின்மேலும் ஒரு மனிதன்மேலும் ஒருசேர.’ இக்கூற்று ஒரு நாட்டுக்கும் ஒரு தனி மனிதனுக்கும் சமமாகப் பொருந்துவதே இதன் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: அமைதியை அளித்தால்
  rationale: שׁקט என்பதன் ஹிஃபில் வடிவம் அமைதியையோ சாந்த நிலையையோ உண்டாக்குவதைக் குறிக்கிறது. ‘அமைதியை அளித்தால்’ என்பது அந்தக் காரணவினைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יַרְשִׁעַ
  choice: குற்றவாளி என்று தீர்ப்பளிக்க முடியும்
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் நீதித்துறைச் சூழலில் ஒருவரைக் குற்றவாளி அல்லது பொல்லாதவர் என்று தீர்ப்பளிப்பதைக் குறிக்கலாம். செயப்படுபொருளை வெளிப்படையாகச் சேர்க்காமல் இருப்பது எபிரெய உரையின் சுருக்கத்தையும் திறந்த நிலையையும் காக்கிறது.
- source_word: יַסְתֵּר פָּנִים
  choice: தமது முகத்தை மறைத்தால்
  rationale: ‘முகத்தை மறைத்தல்’ என்ற மூலமொழியின் உருவகத்தை அப்படியே காக்கிறது; அதை வெறும் ஆதரவை விலக்கிக்கொள்வதாக மட்டும் விளக்கி அதன் பொருளைக் குறுக்கவில்லை.
- source_word: יְשׁוּרֶנּוּ
  choice: அவரைக் காண முடியும்
  rationale: שור என்பது பார்த்தல் அல்லது உற்றுநோக்குதல் என்று பொருள்படும். நவீனத் தமிழில் ‘அவரைக் காண’ என்பது இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ஆண்பால் ஒருமை பின்னொட்டு தேவனையே சுட்டுகிறது.
- source_word: גּוֹי
  choice: ஒரு நாடு
  rationale: இங்கு גוי ஒரு கூட்டு அரசியல் அல்லது சமூக அமைப்பைக் குறிக்கிறது; எனவே ‘நாடு’ பொருத்தமானது.
- source_word: אָדָם
  choice: ஒரு மனிதன்
  rationale: கூட்டான ‘நாடு’ என்பதற்கு எதிராகத் தனிப்பட்ட மனிதரை ஒருமையில் குறிக்கிறது. ‘ஒரு மனிதன்’ அந்த வேறுபாட்டைக் காக்கிறது.
- source_word: יָחַד
  choice: ஒருசேர
  rationale: இந்த நியதி நாடு, தனிமனிதன் ஆகிய இருவருக்கும் சமமாகப் பொருந்துவதை יחד சுட்டுகிறது; ‘ஒருசேர’ அதன் வினையடைப் பொருளைக் காக்கிறது.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: ஒரு நாட்டுக்கும் ஒரு மனிதனுக்கும் ஒருசேர இது பொருந்தும்
  rationale: על என்பதன் பரந்த பொருளை இங்கு இடவியல் அல்லது தண்டனைப் பொருளாகக் குறுக்காமல், முந்தைய கூற்றின் பயன்பாட்டு வரம்பாக இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தேவன் தமது முகத்தை மறைத்தல்
  choice: ‘தமது முகத்தை மறைத்தால்’ என்ற மனிதவடிவச் சொல்லாட்சியை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘அவர் தமது ஆதரவை விலக்கிக்கொண்டால்’ அல்லது ‘அவர்களிடமிருந்து திரும்பிக்கொண்டால்’
  rationale: மூலமொழியின் இறையியல் உருவகம் தேவனின் மறைவையும் விலகலையும் விரிவாக உணர்த்துகிறது. அதை அருள் அல்லது ஆதரவு விலக்கப்படுதல் என்ற ஒரே விளக்கத்துக்குள் அடக்காமல் வைத்திருக்கிறது.
- issue: இறுதிக் கூறின் பயன்பாட்டு வரம்பு
  choice: முந்தைய கூற்று ஒரு நாட்டுக்கும் ஒரு தனி மனிதனுக்கும் சமமாகப் பொருந்துகிறது என்று வழங்குதல்
  alternative: ‘ஒரு நாட்டுக்கு எதிராகவும் ஒரு மனிதனுக்கு எதிராகவும்’ என்று தண்டனை அல்லது எதிர்ப்புப் பொருளில் வழங்குதல்
  rationale: על என்ற முன்னிடைச்சொல்லின் பொருள் இங்கு திறந்துள்ளது. இறுதிக் கூறு கூட்டான நிலையையும் தனிப்பட்ட நிலையையும் இணைப்பதால், தண்டனைப் பொருளைத் தேவையின்றி சேர்க்காமல் சமப் பயன்பாட்டைக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனைச் சுட்டும் இடங்களில் மரியாதை ஒருமையான ‘அவர்/தமது/அவரை’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு வினாவாக்கியங்களும் இறுதியில் வரும் கூட்டு–தனி பயன்பாட்டு விரிவாக்கமும் தெளிவாகக் காக்கப்பட்டுள்ளன.
