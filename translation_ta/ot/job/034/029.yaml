- from: அவர் அமைதியை அளித்தால், யார் குற்றவாளி என்று தீர்ப்பளிக்க முடியும்?[a] அவர் தமது முகத்தை மறைத்தால், யார் அவரைக் காண முடியும்?[b] ஒரு நாட்டுக்கும் ஒரு மனிதனுக்கும் ஒருசேர இது பொருந்தும்.[c]
