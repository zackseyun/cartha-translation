  source_fidelity: 'மூல எபிரெயத்தின் இணை அமைப்பைத் துல்லியமாகக் காக்கிறது: אַנְשֵׁי לֵבָב என்பதன் கருத்துப்பொருள் ‘பகுத்தறிவுள்ளவர்கள்’ எனவும், יֹאמְרוּ לִי-யின் எதிர்பார்ப்பு/எதிர்கால நயம் ‘சொல்வார்கள்’ எனவும், וְגֶבֶר חָכָם שֹׁמֵעַ לִי என்பதன் ஆண்பால் ஒருமை மற்றும் கேட்கும்/செவிகொடுக்கும் உறவு இயல்பாகவும் வெளிப்படுகின்றன. இரண்டாம் இணைத் தொடரில் மூலத்தில் விடப்பட்டுள்ள ‘சொல்வான்’ தமிழின் இலக்கணத் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது; அது பொருளை மாற்றவில்லை. இறுதிக் காற்புள்ளி அடுத்த வசனத்துடன் தொடரும் மூல வாக்கிய ஓட்டத்தை உரிய வகையில் காட்டுகிறது.'
