translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய இணைவாக்கியத்தில் இரண்டாம் எழுவாய்க்குரிய வினை மறைந்திருப்பதைத் தமிழில் இயல்பாக்க ‘சொல்வான்’ மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் வாக்கிய அமைப்பைக் காட்ட இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
