lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: பகுத்தறிவுள்ளவர்கள்
  rationale: சொல்லர்த்தமாக ‘இதயமுள்ள மனிதர்கள்’ என்றாலும், எபிரெய மொழியில் ‘இதயம்’ சிந்தனை, புரிதல், நிதானிப்பு ஆகிய உள்ளார்ந்த திறன்களைக் குறிக்கும் மரபுத்தொடராக இங்கு வருகிறது. எனவே இயல்பான நவீன தமிழில் அதன் பொருளை ‘பகுத்தறிவுள்ளவர்கள்’ என்று வழங்குகிறது.
- source_word: יֹאמְרוּ לִי
  choice: என்னிடம் சொல்வார்கள்
  rationale: யிக்தோல் வடிவத்தின் எதிர்கால அல்லது எதிர்பார்ப்பு நயத்தைத் தக்கவைத்து, எலிகூ பகுத்தறிவுள்ள கேட்போர் கூறப்போவதை எதிர்நோக்குவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְגֶבֶר חָכָם
  choice: ஞானமுள்ளவனும்
  rationale: இணைவாக்கியத்தில் ‘பகுத்தறிவுள்ளவர்கள்’ என்பதற்கு இணையாக ஒரு ஞானமுள்ள மனிதனைக் குறிக்கிறது. தமிழில் பாலினச் சுட்டை முற்றிலும் அகற்றாமல், இயல்பாகவும் சுருக்கமாகவும் ‘ஞானமுள்ளவனும்’ என வழங்கப்பட்டுள்ளது.
- source_word: שֹׁמֵעַ לִי
  choice: எனக்குச் செவிகொடுக்கும்
  rationale: இப்பெயரெச்சம் அந்த ஞானமுள்ளவன் எலிகூவைக் கேட்பவன் என விவரிக்கிறது. வெறும் ஒலி கேட்டலைவிட கவனித்துக் கேட்கும் நயம் சூழலில் இருப்பதால் ‘செவிகொடுக்கும்’ எனத் தேர்ந்தெடுக்கப்பட்டது.
