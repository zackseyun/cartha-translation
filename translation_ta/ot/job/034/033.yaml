  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: ta
  text: நீ அதை நிராகரித்ததால்[b], அவர் உன் விருப்பத்தின்படி[a] அதற்குக் கைம்மாறு செய்ய வேண்டுமா? நீதான் தேர்ந்தெடுக்க வேண்டும், நான் அல்ல; உனக்குத் தெரிந்ததைச் சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உனக்கேற்ப கைம்மாறு செய்ய வேண்டுமா?” எபிரெயத் தொடக்கம் வழக்குச் சொல்லாட்சியாகவும் பொருள் காணக் கடினமாகவும் உள்ளது; கடவுளின் கைம்மாறு யோபுவின் விருப்பத்தால் நிர்ணயிக்கப்படுவதில்லை என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: “அதை” என்பது கடவுளின் தீர்ப்பையோ, அவர் ஆளும் முறையையோ, இங்கு பேசப்படும் கைம்மாறையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: உன் விருப்பத்தின்படி
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘உன்னிடமிருந்து/உன்னோடு இருந்து’ என வரும் இந்தக் கடினமான எபிரெயச் சொல்லாட்சி, இச்சூழலில் கடவுளின் கைம்மாறு யோபுவின் விருப்பத்தால் நிர்ணயிக்கப்படுமா என்ற கேள்வியைக் குறிக்கிறது. ‘உன் விருப்பத்தின்படி’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְשַׁלְמֶנָּה
  choice: அதற்குக் கைம்மாறு செய்ய வேண்டுமா
  rationale: Piel வடிவிலுள்ள שלם என்பதற்கு ‘திருப்பிச் செலுத்து, கைம்மாறு செய்’ என்று பொருள். பெண்பால் ஒருமை பின்னொட்டை ‘அதற்கு’ என்று வெளிப்படுத்தி, எதைக் குறிக்கிறது என்ற சூழல் சார்ந்த தெளிவின்மையைத் தக்கவைத்துள்ளது.
- source_word: כִּי מָאַסְתָּ
  choice: நீ அதை நிராகரித்ததால்
  rationale: מאס என்பதன் அடிப்படைப் பொருள் ‘நிராகரி, ஏற்க மற’. அதன் மறைமுகச் செயப்படுபொருளை ‘அதை’ எனக் கூறுவது மூலத்தின் தெளிவின்மையைத் தீர்க்காமல் தக்கவைக்கிறது.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: நீதான் தேர்ந்தெடுக்க வேண்டும், நான் அல்ல
  rationale: בחר என்பதன் நேரடிப் பொருள் ‘தேர்ந்தெடு’. வலியுறுத்தப்பட்ட אַתָּה மற்றும் ‘நான் அல்ல’ என்ற முரண்பாட்டை ‘நீதான் ... நான் அல்ல’ என்று இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: உனக்குத் தெரிந்ததைச் சொல்
  rationale: ‘நீ அறிந்ததைப் பேசு’ என்ற நேரடிக் கட்டளையை, பொருளை மாற்றாமல் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கடவுளின் கைம்மாறு யாருடைய விருப்பத்தால் நிர்ணயிக்கப்படுகிறது
  choice: கேள்வியை யோபுவின் விருப்பத்துடன் தொடர்புபடுத்தி, கடவுளின் கைம்மாறு அவனால் நிர்ணயிக்கப்படுமா எனக் கேட்கிறது
  alternative: ‘அது உன்னிடமிருந்தா?’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: எபிரெயத் தொடக்கம் இடியமாகவும் கடினமாகவும் உள்ளது. சூழல் கடவுளின் ஆட்சியையோ தீர்ப்பையோ யோபு நிர்ணயிக்க முடியாது என்பதைக் குறித்தாலும், அதை விரிவான கோட்பாட்டு வாக்கியமாக மாற்றாமல் கேள்வியின் அழுத்தத்தை மட்டும் வெளிப்படுத்துகிறது.
- issue: ‘அதை’ என்பதன் குறிப்பு
  choice: குறிப்பைத் தீர்மானிக்காமல் ‘அதை’ என வைத்தல்
  alternative: அதை ‘கடவுளின் தீர்ப்பு’, ‘கடவுளின் ஆட்சி முறை’ அல்லது ‘கைம்மாறு’ என்று வெளிப்படையாக அடையாளப்படுத்தல்
  rationale: மூலத்தில் செயப்படுபொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; எனவே உண்மையான பொருள் தெளிவின்மையைத் தக்கவைத்தல் வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கைம்மாறு’ என்பது தண்டனை அல்லது வெகுமதி என முன்கூட்டியே தீர்மானிக்காமல் שלם என்பதன் ஈடு/பதில் செயல் சார்ந்த பரப்பைத் தக்கவைக்கிறது. ‘நீதான்’ என்ற வலியுறுத்தல் எபிரெய எதிர்மறை ஒப்புமையை தெளிவாகக் காட்டுகிறது.
