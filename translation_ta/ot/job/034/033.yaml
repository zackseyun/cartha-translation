  source_fidelity: மூல எபிரெயத்தின் கடினமான הֲמֵעִמְּךָ சொல்லாட்சியை ‘உன் விருப்பத்தின்படி’ எனச் சூழலுக்கு ஏற்றவாறு வழங்குகிறது; இது கடவுளின் கைம்மாறு யோபுவின் விருப்பத்தால் தீர்மானிக்கப்படுமா என்ற வினாவைத் தக்கவைக்கிறது. יְשַׁלְמֶנָּה-வின் கைம்மாறு/ஈடு செய்யும் பொருளும், மௌனமாக உள்ள செயப்படுபொருளின் தெளிவின்மையும் ‘அதற்கு/அதை’ மூலம் பாதுகாக்கப்படுகின்றன. இறுதிக் கட்டளை ‘உனக்குத் தெரிந்ததைச் சொல்’ மூலத்தின் வலியுறுத்தலைச் சரியாகத் தருகிறது.
  naturalness: நவீன பொதுத்தமிழில் வாக்கியம் இயல்பாகவும் கண்ணியமான வேதாகம உரைநடையிலும் உள்ளது. வினா, முரண்பாடு (‘நீதான் ... நான் அல்ல’), பின்னர் வரும் கட்டளை ஆகியவை தெளிவாக இணைகின்றன.
  terminology: ‘கைம்மாறு’ என்பது வெகுமதி அல்லது தண்டனை என்று முன்கூட்டியே வரையறுக்காமல் שלם-ன் பரந்த ஈடு/பதில் பொருளைத் தருகிறது. ‘நிராகரி,’ ‘தேர்ந்தெடு,’ ‘சொல்’ ஆகியவை இயல்பான, துல்லியமான சொற்கள். பெயர்கள் அல்லது இறையியல் சொற்களில் மாற்றம் தேவையில்லை.
