translation:
  language: ta
  text: மாம்சமுள்ள அனைத்தும் ஒருசேர உயிர்விடும்; மனிதன்[a] புழுதிக்குத் திரும்புவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதகுலம் புழுதிக்குத் திரும்பும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் אָדָם ஒருமையில் இருந்தாலும், அது மனிதகுலம் முழுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: உயிர்விடும்
  rationale: גוע என்பது உயிர் நீங்குதல் அல்லது இறத்தலைக் குறிக்கிறது. முந்தைய வசனத்திலிருந்து தொடரும் நிபந்தனை விளைவையும் மரணத்தின் தீவிரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל בָּשָׂר
  choice: மாம்சமுள்ள அனைத்தும்
  rationale: ‘எல்லா மாம்சமும்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, மரணத்திற்குட்பட்ட உயிர்கள் அனைத்தையும் குறிக்கும் பொருளை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: יָחַד
  choice: ஒருசேர
  rationale: அனைத்தும் ஒரே சமயத்தில் அல்லது கூட்டாக நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் உணர்த்துகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: எபிரெய ஒருமை வடிவத்தையும் ஆதியாகமத்தின் புழுதி உருவகத்துடனான ஒலிப்பையும் காக்கிறது; இங்கு அது மனிதகுலத்தைப் பொதுவாகக் குறிக்கக்கூடும் என்பதால் மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל עָפָר
  choice: புழுதிக்கு
  rationale: שוב என்பதுடன் சேர்ந்துள்ள மரண உருவகத்தில் ‘புழுதிக்குத் திரும்புதல்’ என்பது தமிழில் இயல்பானதும், மனிதன் மண்ணிலிருந்து உருவாக்கப்பட்டான் என்ற வேதாகமப் பின்னணியைச் சுட்டுவதுமாகும்.
- source_word: יָשׁוּב
  choice: திரும்புவான்
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைக் காக்கிறது; முந்தைய வசனத்தின் நிபந்தனைச் சூழலில் விளைவைக் குறிக்கும் எதிர்கால வடிவமாக அமைகிறது.
theological_decisions:
- issue: אָדָם என்பதை மனிதரைப் பொதுவாகக் குறிக்கும் சொல்லாக மொழிபெயர்த்தல்
  choice: மனிதன்
  alternative: மனிதகுலம்
  rationale: ஒருமை வடிவத்தையும் புழுதிக்குத் திரும்பும் தனிமனித உருவகத்தையும் முதன்மை உரை காக்கிறது. அதேவேளை, இச்சொல் மனிதகுலம் முழுவதையும் கூட்டாகக் குறிக்கக்கூடிய உண்மையான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சமுள்ள அனைத்தும்’ என்ற சொற்றொடர் எபிரெய உருவகத்தைத் தக்கவைத்தபடியே சாதாரண வாசகருக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளது; இரு வினைகளின் எதிர்கால வடிவம் முந்தைய வசனத்திலிருந்து தொடரும் நிபந்தனை விளைவைக் கொண்டுள்ளது.
