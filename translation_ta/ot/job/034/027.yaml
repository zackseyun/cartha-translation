  source_fidelity: மூல எபிரெயத்தின் காரணத் தொடர்பு (אֲשֶׁר עַל־כֵּן), ‘அவரைப் பின்பற்றுவதிலிருந்து விலகுதல்’ என்ற מֵאַחֲרָיו மரபுத்தொடர், மற்றும் மறுப்புடன் வரும் ‘அவருடைய வழிகளில் எதையும்’ என்ற வலியுறுத்தல் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘புரிந்துகொள்ளவில்லை’ என்பது הִשְׂכִּילוּ என்பதற்கான ஏற்கத்தக்க நேரடியான மொழிபெயர்ப்பு; கருத்தில் கொள்ளுதல் என்ற நுணுக்கம் அடிக்குறிப்பில் உரியவாறு வழங்கப்பட்டுள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவரைப் பின்பற்றுவதிலிருந்து விலகினார்கள்’ என்பது மூலத்தின் உறவுசார் உருவகத்தை இயல்பாகத் தெரிவிக்கிறது. அரைப்புள்ளி இரு இணைந்த குற்றச்சாட்டுகளையும் வாசிப்பில் தெளிவாகப் பிரிக்கிறது.
