  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அவரைப் பின்பற்றுவதிலிருந்து விலகினார்கள்[a]; அவருடைய வழிகளில் எதையும் அவர்கள் புரிந்துகொள்ளவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, ‘அவருக்குப் பின்னாலிருந்து’; இது ‘அவரைப் பின்பற்றுவதிலிருந்து’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய வழிகள் அனைத்தையும் அவர்கள் கருத்தில் கொள்ளவில்லை.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: ஏனெனில்
  rationale: இச்சொற்றொடர் முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீன தமிழில் அதன் காரணப் பொருளை இயல்பாக வெளிப்படுத்துவது ‘ஏனெனில்’.
- source_word: סָרוּ
  choice: விலகினார்கள்
  rationale: סור என்பது விலகுதல் அல்லது திரும்பிச் செல்லுதல் என்று பொருள்படும். இங்கு ஒருவரைப் பின்பற்றுவதை நிறுத்தும் உறவுசார் மற்றும் ஒழுக்கசார் நுணுக்கத்தை ‘விலகினார்கள்’ காக்கிறது.
- source_word: מֵאַחֲרָיו
  choice: அவரைப் பின்பற்றுவதிலிருந்து
  rationale: எழுத்துப்படி ‘அவருக்குப் பின்னாலிருந்து’ என்ற எபிரெய மரபுத்தொடர், ஒருவரைப் பின்பற்றுவதை விட்டுவிடுதல் என்ற பொருளைத் தருகிறது. தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל דְּרָכָיו
  choice: அவருடைய வழிகளில் எதையும்
  rationale: எபிரெயத்தில் எழுத்துப்படி ‘அவருடைய எல்லா வழிகளையும்’ என்று இருந்தாலும், தொடர்ந்து வரும் மறுப்புடன் தமிழில் ‘வழிகளில் எதையும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. ‘வழிகள்’ என்பது அவரது செயல்முறைகளையோ ஒழுக்கக் கோரிக்கைகளையோ குறிக்கக்கூடிய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לֹא הִשְׂכִּילוּ
  choice: புரிந்துகொள்ளவில்லை
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் புரிந்துகொள்ளுதல், நுண்ணறிவு பெறுதல், கருத்தில் கொள்ளுதல் ஆகிய பொருட்களை ஏற்கலாம். முதன்மை உரையில் அதன் நேரடியான அறிவுணர்வுப் பொருளை வைத்துக் கொண்டு, ‘கருத்தில் கொள்ளவில்லை’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: ‘அவரைப் பின்பற்றுவதிலிருந்து’ மற்றும் ‘அவருடைய வழிகள்’ என்பவற்றிலுள்ள ஒருமை ஆண்பால் சுட்டுப்பெயரின் குறிப்பு
  choice: சூழலில் கடவுளைக் குறிப்பதாக ஏற்கப்படுகிறது; பெயரைச் சேர்க்காமல் ‘அவர்’ என்ற சுட்டுப்பெயரே வைக்கப்படுகிறது.
  alternative: உடனடி முன்னிலையாக ஓர் உலகியலான ஆட்சியாளரையோ நீதிபதியையோ குறிக்கலாம்.
  rationale: எலிகூவின் உரையின் விரிந்த சூழல் கடவுள் மனித நடத்தையைக் கண்டு நியாயந்தீர்ப்பதைப் பற்றிப் பேசுகிறது. எனினும், எபிரெய மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால் தமிழிலும் ‘கடவுள்’ என்று விளக்கிச் சேர்க்காமல் சுட்டுப்பெயர் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது தமிழின் இயல்பான மரியாதை ஒருமையாக உள்ளது; மூலத்தில் இல்லாத தெய்வப்பெயர் சேர்க்கப்படவில்லை. அரைப்புள்ளி இரண்டு இணையான செயல்களைத் தெளிவாகப் பிரிக்கிறது.
