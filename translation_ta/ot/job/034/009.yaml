  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: ta
  text: ஏனெனில், அவன், “கடவுளில் மகிழ்ச்சியடைவதால் மனிதனுக்கு எந்தப் பயனும் இல்லை” என்று சொல்லியிருக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் மனிதனில் மகிழ்ச்சியடையும்போது மனிதனுக்கு எந்தப் பயனும் இல்லை,” அல்லது, “கடவுளின் தயவை நாடுவதால் மனிதனுக்கு எந்தப் பயனும் இல்லை.” எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால் ஒன்றுக்கு மேற்பட்ட விதத்தில் பொருள் கொள்ள இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் எலிகூ முன்வைத்த குற்றச்சாட்டுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אָמַר
  choice: சொல்லியிருக்கிறான்
  rationale: கடந்த காலத்தில் கூறப்பட்டு தற்போதைய வாதத்துக்கும் பொருத்தமுள்ள கூற்றைக் குறிக்கிறது.
- source_word: לֹא יִסְכָּן
  choice: எந்தப் பயனும் இல்லை
  rationale: பயன் அல்லது ஆதாயம் கிடைக்காது என்ற எபிரெயக் கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: גָּבֶר
  choice: மனிதன்
  rationale: ஆண்பால் ஒருமைச் சொல் இங்கு பொதுவாக மனிதரைப் பிரதிநிதித்துவப்படுத்துகிறது; தமிழ் மொழியில் ‘மனிதன்’ அந்த வடிவத்தையும் பொதுப்பொருளையும் தக்கவைக்கிறது.
- source_word: בִּרְצֹתוֹ
  choice: மகிழ்ச்சியடைவதால்
  rationale: רצה என்ற சொல்லின் இவ்வடிவம் மகிழ்ச்சி அல்லது விருப்பம் கொள்வதைச் சுட்டுகிறது; இங்கு மனிதனையே செய்பொருளாகக் கொள்ளும் முதன்மை வாசிப்பு பின்பற்றப்படுகிறது.
- source_word: עִם אֱלֹהִים
  choice: கடவுளில்
  rationale: சொல்லுக்கு சொல் ‘கடவுளுடன்’ என்றாலும், மகிழ்ச்சியின் தொடர்புப் பொருளை இயல்பான தமிழில் ‘கடவுளில்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בִּרְצֹתוֹ עִם אֱלֹהִים என்ற சுருக்கமான சொற்றொடரின் பொருள்
  choice: மனிதன் கடவுளில் மகிழ்ச்சியடைவதால் அவனுக்குப் பயன் இல்லை
  alternative: கடவுள் மனிதனில் மகிழ்ந்தாலும் அவனுக்குப் பயன் இல்லை; அல்லது கடவுளின் தயவை நாடுவதால் மனிதனுக்குப் பயன் இல்லை
  rationale: பின்னொட்டின் செய்பொருளாக மனிதனைக் கொள்வது சூழலில் நேரடியான வாசிப்பு; ஆயினும் எபிரெயக் கட்டமைப்பு ஒன்றுக்கு மேற்பட்ட விளக்கங்களை அனுமதிப்பதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மேற்கோளின் கடுமையான குற்றச்சாட்டும் மூலத்தின் பொருள் தெளிவின்மையும் தக்கவைக்கப்பட்டுள்ளன.
