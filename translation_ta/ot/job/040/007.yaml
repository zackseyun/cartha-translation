  variant: modern standard Tamil
source:
  edition: WLC
  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: ta
  text: ஒரு மனிதனைப் போல உன் இடையை இறுக்கிக் கட்டிக்கொள்[a]; நான் உன்னிடம் கேள்வி கேட்பேன்; நீ எனக்குத் தெரியப்படுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீரனைப் போல ஆயத்தமாகு.” எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு மனிதனைப் போல உன் இடையை இறுக்கிக் கட்டிக்கொள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר
  choice: கட்டிக்கொள்
  rationale: இது אזר என்பதன் கட்டளை வடிவம்; கட்டுதல் அல்லது கச்சையைக் கட்டுதல் என்ற நேரடியான உடல் சார்ந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: נָא
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இந்தத் துகள் வேண்டுகோள், வலியுறுத்தல் அல்லது உடனடித் தன்மையைச் சுட்டலாம். இங்கு ‘தயவுசெய்து’ என்பது தேவனுடைய சவாலை அளவுக்கு மீறி மென்மையாக்கும்; ‘இப்போது’ என்பது இல்லாத காலக் குறிப்பைத் தெளிவாகச் சேர்க்கும். கட்டளை வாக்கியத்தின் தொனியே அதன் வலியுறுத்தலை எடுத்துரைக்கிறது.
- source_word: כְגֶבֶר
  choice: ஆண்மகனைப் போல
  rationale: גבר என்பது ஆணைக் குறிக்கிறது; பலம் அல்லது வீரத்தன்மை என்ற நிழற்பொருளையும் கொள்ளலாம். பாலினச் சுட்டையும் மூலத்தின் திறந்த நிழற்பொருளையும் இத்தேர்வு காக்கிறது.
- source_word: חֲלָצֶיךָ
  choice: உன் இடுப்பை
  rationale: இந்தப் பெயர்ச்சொல் இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது. தமிழில் இயல்பாகவும் உடல் சார்ந்த உருவகத்தைத் தக்கவைத்தும் ‘இடுப்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶשְׁאָלְךָ
  choice: நான் உன்னிடம் கேள்வி கேட்பேன்
  rationale: שאל என்பதன் அடிப்படைப் பொருள் கேட்பது; இச்சூழலில் விசாரிக்கும் சவாலின் வலிமையை ‘கேள்வி கேட்பேன்’ தெளிவாகத் தருகிறது.
- source_word: וְהוֹדִיעֵנִי
  choice: நீ எனக்குத் தெரியப்படுத்து
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய், தெரியப்படுத்து’ என்று பொருள்படும். ‘பதில் சொல்’ என்பதைவிட காரணவினைப் பொருளை இது நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: גבר என்பதிலுள்ள பாலினச் சுட்டு
  choice: ஆண்மகனைப் போல
  alternative: வீரனைப் போல / வலிமையுள்ளவனைப் போல
  rationale: யோபை நோக்கிய ஆண்பால் ஒருமைச் சவாலை மூலத்தின்படி தக்கவைக்கிறது; அதேவேளை வீரத்தன்மை கட்டாயமான ஒரே பொருள் என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இடுப்பைக் கட்டிக்கொள்’ என்ற மூல உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் செயல்பாட்டு பொருளான ஆயத்தமாதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
