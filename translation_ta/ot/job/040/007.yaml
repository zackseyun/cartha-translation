revisions:
- from: ஆண்மகனைப் போல உன் இடுப்பைக் கட்டிக்கொள்[a]; நான் உன்னிடம் கேள்வி கேட்பேன்; நீ எனக்குத் தெரியப்படுத்து.
  to: ஒரு மனிதனைப் போல உன் இடையை இறுக்கிக் கட்டிக்கொள்[a]; நான் உன்னிடம் கேள்வி கேட்பேன்; நீ எனக்குத் தெரியப்படுத்து.
  rationale: The revision replaces a Tamil term that can mean ‘male child/son’ with the ordinary equivalent of ‘man’ and makes the girding idiom natural in modern Tamil. It does not add an explicit temporal equivalent for נא, does not make ‘warrior’ the primary reading, and retains the causative ‘make known to me.’
