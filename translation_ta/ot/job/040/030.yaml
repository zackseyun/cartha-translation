source:
  edition: WLC
  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: ta
  text: வணிகர்கள் அவனைப் பற்றிப் பேரம் பேசுவார்களா?[a] அவர்கள் அவனை வியாபாரிகளிடையே பங்கிடுவார்களா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோழர்கள் அவனை விருந்தாக உண்பார்களா?” முதல் வாக்கியத்திலுள்ள எபிரெய வாசகம் பொருள் காண்பதற்குக் கடினமானது; חַבָּרִים என்ற சொல்லைச் சிலர் வணிகப் பொருளில் அல்லாமல் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் “கானானியர்கள்”; இச்சூழலில் அது “வியாபாரிகள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ עָלָיו
  choice: அவனுக்காகப் பேரம் பேசுவார்களா
  rationale: כּרה என்பதன் அடிப்படைப் பொருள் ‘தோண்டு’ என்றாலும், இங்கு மனிதச் செய்பவர்களும் வணிகப் பின்னணியும் இருப்பதால், על உடன் சேர்ந்த இச்சொற்றொடர் அந்த உயிரினத்தைப் பற்றி விலைபேசி ஒப்பந்தம் செய்வதைக் குறிக்கிறது. இயல்பான தமிழில் ‘அவனுக்காகப் பேரம் பேசு’ இதைத் தெரிவிக்கிறது.
- source_word: חַבָּרִים
  choice: வணிகர்கள்
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாக ‘தோழர்கள்/கூட்டாளிகள்’ எனப் பொருள்படலாம். ஆனால் அடுத்த அடியில் வியாபாரிகளிடையே பங்கிடுவது கூறப்படுவதால், வணிகப் பொருள் சூழலுக்கு ஏற்றது; மூலத்தின் சிரமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יֶחֱצוּהוּ
  choice: அவனைப் பங்கிடுவார்களா
  rationale: חצה என்பது ‘பிரி, பங்கிடு’ என்பதாகும். வெட்டிக் கூறுபோடுவதை வெளிப்படையாகச் சேர்க்காமல், விற்பனைப் பொருளாகப் பகிர்வது உட்பட மூலச் சொல்லின் விரிவை ‘பங்கிடு’ பாதுகாக்கிறது.
- source_word: בֵּין
  choice: இடையே
  rationale: பலரைக் குறிக்கும் பெயர்ச்சொல்லுடன், விநியோகத்தை இயல்பான தமிழில் ‘இடையே’ எனக் கூறலாம்.
- source_word: כְּנַעֲנִים
  choice: வியாபாரிகள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘கானானியர்கள்.’ ஆனால் எபிரெயப் பயன்பாட்டில் இது வணிகர்களைக் குறிக்கலாம்; இங்குள்ள வணிக இணைநிலை காரணமாக பொருள்சார் மொழிபெயர்ப்பு முதன்மை உரையில் ஏற்றது, நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
