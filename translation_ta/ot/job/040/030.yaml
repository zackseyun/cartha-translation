translation_notes:
  register: நவீனத் தரத் தமிழில், கேள்வி வடிவ இணைநிலையைப் பேணி, மரியாதையும் பொதுவாசகருக்கான தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. உயிரினத்தைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டு ‘அவன்’ எனத் தொடர்ச்சியாக வைக்கப்பட்டது; மூலத்தின் உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
