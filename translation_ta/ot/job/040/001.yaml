base_translation:
  language: en
  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: ta
  text: யாவே யோபுக்குப் பதிலளித்துச் சொன்னார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: ענה என்ற வினை இங்குள்ள உரையாடல் சூத்திரத்தில் ‘பதிலளித்தல்’ என்று பொருள்படும்; எபிரெய உரையின் பதில் அமைப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது ‘யோபு’ என்பதை நேரடிச் செயப்படுபொருளாகக் குறிக்கும் இலக்கணக் குறியீடு; தமிழில் வேற்றுமை உருபால் இயல்பாக வெளிப்படுகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: אמר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ என்பதையும், மூலத்திலுள்ள தொடர்ச்சியான ‘பதிலளித்து—சொன்னார்’ அமைப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்திலுள்ள இரட்டை உரை அறிமுகமான ‘பதிலளித்து—சொன்னார்’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
