  text: הֲ֭/רֹב עִם שַׁדַּ֣י יִסּ֑וֹר מוֹכִ֖יחַ אֱל֣וֹהַּ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: ta
  text: எல்லாம் வல்லவரோடு வாதிடுகிறவன் அவரைத் திருத்துவானா?[a] கடவுளோடு வாதிடுகிறவன் இதற்குப் பதில் சொல்லட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாம் வல்லவரிடம் குறைகாண்கிறவன் அவருக்கு அறிவுறுத்துவானா அல்லது அவரைக் கண்டிப்பானா?” எபிரெயச் சொற்களில் வழக்காடுதல் மற்றும் திருத்துதல் ஆகிய இரு நுணுக்கங்களும் இணைந்துள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதற்குப் பதில் அளிக்கட்டும்” அல்லது “அவருக்குப் பதில் சொல்லட்டும்.” எபிரெயப் பின்னொட்டு நேரடியாகக் கடவுளைக் காட்டாமல், எழுப்பப்பட்ட விவகாரத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: வாதிடுகிறவன்
  rationale: ריב என்ற வேர்ச்சொல்லின் வழக்கு தொடுப்பது, சர்ச்சையிடுவது என்ற நீதிமன்றச் சூழல் சார்ந்த பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם
  choice: -ஓடு
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருள் ‘உடன்’; வாதிடுதல் என்ற சூழலில் எதிர்நிலையையும் தமிழில் ‘எல்லாம் வல்லவரோடு வாதிடுதல்’ இயல்பாக உணர்த்துகிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: யோபில் வரும் שדי என்ற இறைப்பட்டத்தின் பொருளைத் தமிழில் மொழிபெயர்க்கும் மரபான, புரிந்துகொள்ளத்தக்க வடிவம்.
- source_word: יִסּוֹר
  choice: அவரைத் திருத்துவானா?
  rationale: יסר என்பது பயிற்றுவித்தல், கண்டித்தல், திருத்துதல் ஆகிய பொருள்களை உடையது. இங்கு மனிதன் எல்லாம் வல்லவரையே திருத்த முற்படுகிறான் என்ற வினாவை ‘திருத்துவானா?’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מוֹכִיחַ
  choice: குற்றஞ்சாட்டுகிறவன்
  rationale: יכח என்பதன் வாதிடுதல், கண்டித்தல், வழக்குரைத்தல் ஆகிய பரப்பை இச்சூழலில் ‘குற்றஞ்சாட்டுகிறவன்’ நன்கு காட்டுகிறது; இது கடவுளுக்கு எதிராகத் தன் வழக்கை முன்வைப்பவனைச் சுட்டுகிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபில் வழக்கமான கவிதைநடை ஒருமை இறைப்பெயர்; தேவையற்ற கூடுதல் வலியுறுத்தலின்றி நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַעֲנֶנָּה
  choice: இதற்குப் பதில் சொல்லட்டும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்வைக்கப்பட்ட விவகாரம் அல்லது குற்றச்சாட்டைக் குறிக்கலாம். தமிழில் ‘இதற்கு’ என்பது அந்தச் சுருக்கமான சுட்டுதலை இயல்பாகப் பாதுகாக்கிறது; ‘அவருக்குப் பதில் சொல்லட்டும்’ என்ற வாய்ப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மனிதன் கடவுளைத் திருத்துகிறானா, அல்லது கடவுள் மனிதனைத் திருத்துகிறாரா?
  choice: எல்லாம் வல்லவரோடு வாதிடும் மனிதன் அவரைத் திருத்த முற்படுவதாக வினா சித்தரிக்கிறது.
  alternative: எல்லாம் வல்லவரோடு வாதிடுகிறவன் திருத்தத்தை ஏற்றுக்கொள்ள வேண்டும்.
  rationale: வாக்கிய அமைப்பும் இரு அடிகளின் இணைநிலையும் יִסּוֹר என்பதற்கு மனித வாதிடுபவனையே எழுவாயாகக் கொள்ள ஆதரிக்கின்றன. அடுத்த அடி கடவுளைக் குற்றஞ்சாட்டுகிறவனைப் பதில் சொல்ல அழைப்பதால் இதே கண்டனத்தை வலுப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் அடியின் சட்டவாத/திருத்துதல் சொற்பரப்பும், இரண்டாம் அடியின் சுட்டுப்பெயர் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
