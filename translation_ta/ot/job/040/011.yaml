  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: ta
  text: உன் கோபத்தின் சீற்றப் பெருக்குகளைச் சிதறவிடு[a]; பெருமையுள்ள ஒவ்வொருவரையும் பார்த்து, அவரைத் தாழ்த்து[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கோபத்தின் சீற்றப் பெருக்குகளைப் பாயவிடு.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொரு பெருமையுள்ளவர்” என்ற பகிர்மான ஒருமை அமைப்பும், “அவரைத் தாழ்த்து” என்பதற்கான ஒருமைச் சுட்டுப்பெயரும் உள்ளன; ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: பாயவிடு
  rationale: இந்த ஏவல் வினை வலிமையாக வெளியே அனுப்புதல் அல்லது சிதறச் செய்தல் என்ற படிமத்தைக் கொண்டது. கோபத்தின் ‘சீற்றப் பெருக்குகள்’ என்பதுடன் ‘பாயவிடு’ இயல்பாக இணைந்து, கட்டுப்படுத்தப்பட்ட வல்லமை விடுவிக்கப்படுவதை வெளிப்படுத்துகிறது.
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: உன் கோபத்தின் சீற்றப் பெருக்குகள்
  rationale: עֶבְרוֹת என்ற பன்மை பொங்கிவழியும் கடுஞ்சினத்தின் தீவிரமான வெளிப்பாடுகளைக் குறிக்கிறது; אַף இங்கு உடல் உறுப்பான ‘மூக்கு’ அல்ல, கோபத்தைக் குறிக்கும் வழக்குச்சொல். ‘சீற்றப் பெருக்குகள்’ பன்மையையும் தீவிரத்தையும் காக்கிறது.
- source_word: וּרְאֵה
  choice: பார்த்து
  rationale: இது வெறுமனே காண்பதல்ல, ஒருவர்மேல் கவனம் செலுத்திப் பார்ப்பதைக் குறிக்கும் ஏவல் வினை; அடுத்து வரும் தாழ்த்தும் செயலுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: כָל גֵּאֶה
  choice: பெருமைகொண்ட ஒவ்வொருவனையும்
  rationale: ஒருமை பெயரடை இங்கு பெயர்ச்சொல்லாக வந்து, பெருமைகொண்ட ஒவ்வொரு நபரையும் தனித்தனியாகக் குறிக்கிறது. ‘ஒவ்வொருவனையும்’ அந்தப் பகிர்மான ஒருமையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: וְהַשְׁפִּילֵהוּ
  choice: அவனைத் தாழ்த்திவிடு
  rationale: שׁפל என்பதன் causative வடிவம் உயர்ந்திருப்பவனைத் தாழ்ந்த நிலைக்குக் கொண்டுவருதல் என்று பொருள் தருகிறது. பெருமைக்கும் தாழ்த்துதலுக்கும் இடையிலான கவிதை எதிர்மறையை இந்தத் தேர்வு காக்கிறது.
theological_decisions:
- issue: பெருமைகொண்ட அனைவரையும் குறிக்கும் பொதுப்பொருளும், ஒருமை ஆண்பால் பின்னொட்டும்
  choice: ‘ஒவ்வொருவனையும் ... அவனை’ என்று தனிநபர் சார்ந்த ஒருமையைப் பேணுதல்
  alternative: ‘பெருமைகொண்ட அனைவரையும் ... அவர்களை’ என்று பன்மையில் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை பொதுவாக எல்லாப் பெருமையாளர்களையும் உள்ளடக்கியபோதும், இலக்கணத்தில் ஒவ்வொருவரையும் தனித்தனியாக எதிர்கொள்ளும் ஒருமையைப் பயன்படுத்துகிறது. தமிழிலும் அந்தச் சிறப்பைத் தக்கவைத்தல் பொருத்தமானது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கவிதைத் தீவிரத்தைத் தக்கவைக்க ‘சீற்றப் பெருக்குகள்’ என்றும், வாசிப்பில் இயல்பைத் தர ‘பாயவிடு’ என்றும் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் மாற்று ‘சிதறவிடு’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
