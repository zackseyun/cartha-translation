translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான இறை உரையின் கண்ணியத்தையும் சொல்லாட்சியின் வலிமையையும் காக்கும் வகையில் அமைக்கப்பட்டுள்ளது. இரு வினாக்களிலும் ‘உன்னால் முடியுமா?’ என்ற சொல்லமைப்பு இயல்பான தமிழில் சொல்லாட்சிசார் கேள்வியை வெளிப்படுத்துகிறது. எபிரெயத்தின் கடினமான இரண்டாம் உருவகம் முதன்மை உரையில் வாசிக்கத் தெளிவாகவும், அதன் சொற்படையான மாற்றுகள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளன.
