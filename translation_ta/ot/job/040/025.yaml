  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: ta
  text: லிவியாதானைத் தூண்டிலால் இழுத்தெடுக்க உன்னால் முடியுமா? கயிற்றால் அதன் நாவைக் கீழே அமிழ்த்த முடியுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “கயிற்றால் அதன் நாவைத் தாழ்த்த முடியுமா?” அல்லது “கயிற்றால் அதன் நாவை அழுத்திப் பிடிக்க முடியுமா?” எபிரெய உருவகம் கடினமானது; கயிற்றைப் பயன்படுத்தி உயிரினத்தை அதன் வாய்ப்பகுதியில் கட்டுப்படுத்துவதை இது குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: இழுத்துப் பிடிக்க
  rationale: மָשַׁךְ என்பதன் அடிப்படைப் பொருள் ‘இழு’. மீன்பிடிக்கும் சூழலில், தூண்டிலில் சிக்கிய உயிரினத்தை இழுத்துப் பிடிப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִוְיָתָן
  choice: லிவியாதான்
  rationale: இது ஒரு தனிப்பெயர் அல்லது தனிப்பட்ட உயிரினத்தைக் குறிக்கும் பெயராக இருப்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּחַכָּה
  choice: தூண்டிலால்
  rationale: חַכָּה என்பது மீன்பிடிக்கப் பயன்படும் கொக்கி அல்லது தூண்டிலைக் குறிக்கிறது; ‘தூண்டில்’ நவீனத் தமிழில் இயல்பான தேர்வு.
- source_word: וּבְחֶבֶל
  choice: கயிற்றால்
  rationale: חֶבֶל என்பது கயிறு அல்லது வடத்தைக் குறிக்கும் பொதுவான சொல். ‘கயிறு’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: תַּשְׁקִיעַ
  choice: அடக்க
  rationale: שׁקע என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘கீழே அமிழ்த்து/தாழ்த்து’ என்று பொருள்படலாம். நாவையும் கயிற்றையும் இணைக்கும் கடினமான உருவகத்தில், உயிரினத்தை வாய்ப்பகுதியில் கட்டுப்படுத்தும் கருத்தை ‘அடக்க’ இயல்பாகத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְשֹׁנוֹ
  choice: அதன் நாவை
  rationale: எபிரெய உரை நேரடியாக ‘அதன் நாவை’ என்கிறது. உயிரினத்தைக் குறிக்கும் இயல்பான தமிழ் சுட்டுப்பெயராக ‘அதன்’ பயன்படுத்தப்பட்டுள்ளது.
