  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: ta
  text: ஏனெனில், மலைகள் அவனுக்கு உணவை விளைவிக்கின்றன[a]; காட்டு விலங்குகள் அனைத்தும்[b] அங்கே விளையாடுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலைகள் அவனுக்கு விளைச்சலைத் தருகின்றன.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “வயல்வெளியின் எல்லா விலங்குகளும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய விவரிப்புக்கு விளக்கம் அல்லது காரணம் அளிக்கும் இணைப்பாக இங்கு வருகிறது.
- source_word: בּוּל
  choice: உணவு
  rationale: இச்சொல் நிலத்தின் விளைச்சல் அல்லது மகசூலைக் குறிக்கிறது; அந்த விலங்கிற்கு மலைகள் அளிக்கும் வாழ்வாதாரத்தை இயல்பான தமிழில் ‘உணவு’ எனத் தருகிறது. ‘விளைச்சல்’ என்பதும் சாத்தியம்.
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெயச் சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: יִשְׂאוּ לוֹ
  choice: அவனுக்கு ... விளைவிக்கின்றன
  rationale: בּוּל என்பதுடன் சேர்ந்தபோது, சுமத்தல் என்பதைவிட உணவு அல்லது விளைச்சலை உண்டாக்கித் தருதல் என்ற பொருளைத் தருகிறது.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்குகள் அனைத்தும்
  rationale: நிலப்பரப்பில் வாழும் வனவிலங்குகளைக் குறிக்கும் கூட்டுச் சொற்றொடரை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: יְשַׂחֲקוּ
  choice: விளையாடுகின்றன
  rationale: שׂחק என்பதன் பியேல் வடிவம் இங்கு விலங்குகளின் விளையாட்டுத்தனமான செயல்பாட்டைக் குறிக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: மலைப்பகுதி அல்லது அதனுடன் தொடர்புடைய வாழிடத்தைக் குறிக்கும் இடவினையடை.
