source:
  edition: WLC
  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: ta
  text: அல்லது, கடவுளுடைய புயத்தைப் போன்ற புயம் உனக்கு இருக்கிறதா?[a] அவருடைய குரலைப் போல் உன்னால் இடிமுழங்க முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, குறைவாகச் சாத்தியமாக, ‘ஒரு தெய்வத்தின் புயத்தைப் போன்ற புயம்’; ஆனால் இச்சூழலில் ‘கடவுள்’ என்பதே மிகவும் பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: அல்லது, ... இருக்கிறதா?
  rationale: முந்தைய சவாலைத் தொடரும் வினாவாக இருப்பதால், எபிரேய இணைப்புச் சொல்லின் தொடர்ச்சி மற்றும் எதிர்நிலைத் தொனியை இயல்பான தமிழில் ‘அல்லது’ வெளிப்படுத்துகிறது.
- source_word: זְרוֹעַ
  choice: புயம்
  rationale: இச்சொல் நேரடியாக ‘கை/புயம்’ எனும் உருவகத்தைத் தருகிறது; வெறும் ‘வல்லமை’ என்று மாற்றாமல் உடல் உறுப்பின் படிமத்தையும் அதனூடான வலிமைக் கருத்தையும் காக்க ‘புயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּאֵל
  choice: கடவுளுடையதைப் போன்ற
  rationale: இங்கு பேசுகிற கடவுளையே אֵל குறிப்பதாகச் சூழல் வலுவாகக் காட்டுகிறது. ‘புயம்’ என்பதோடு இயல்பாக இணைய தமிழில் உடைமை ஒப்புமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: לָךְ
  choice: உனக்கு இருக்கிறதா
  rationale: சொல்லுக்குச் சொல் ‘உனக்கு’ என்றாலும், உடைமையைக் குறிக்கும் எபிரேய அமைப்பு தமிழிலும் ‘உனக்கு இருக்கிறதா’ என்று இயல்பாக அமைகிறது.
- source_word: וּבְקוֹל
  choice: குரலில்
  rationale: בְּ இங்கு கருவி அல்லது வெளிப்பாட்டு முறையைக் குறிக்கிறது; இடிமுழக்கம் குரலின் மூலம் நிகழ்வதை ‘குரலில்’ சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָּמֹהוּ
  choice: அவருடையதைப் போன்ற
  rationale: பின்னொட்டு கடவுளைச் சுட்டுகிறது; ஒப்பிடப்படுவது குரல் என்பதால் ‘அவரைப் போன்ற’ என்பதற்குப் பதில் உடைமை ஒப்புமை துல்லியமானது.
- source_word: תַרְעֵם
  choice: உன்னால் இடிமுழக்கம் செய்ய முடியுமா
  rationale: רעם என்பதன் ஹிஃபில் வடிவம் இடியை முழங்கச் செய்தல் அல்லது இடிபோல் முழங்குதல் என்ற கருத்தைக் கொண்டது. திறனைச் சவாலிடும் வினாவையும் புயல்-தெய்வவெளிப்பாட்டுப் படிமத்தையும் இம்மொழிபெயர்ப்பு காக்கிறது.
theological_decisions:
- issue: אֵל என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம்
  rationale: யோபைச் சவாலிடுகிற இஸ்ரவேலின் கடவுளே உடனடிச் சூழலில் பேசுபவர்; ஆகவே இங்கு אֵל அவரையே குறிப்பதாக வாசிப்பது இயல்பானது. இருப்பினும் சொல்லை பொதுப்பொருளில் எடுத்தால் அமையக்கூடிய மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுள் யோபிடம் முன்வைக்கும் உயரிய ஆனால் நேரடியான சொல்லாட்சியைப் பேணுகிறது. ‘புயம்’ மூலத்தின் உடல்-வலிமைப் படிமத்தைத் தக்கவைக்கிறது; ‘இடிமுழக்கம்’ רעם என்பதன் புயல் சார்ந்த ஒலியையும் தெய்வீக வல்லமைச் சவாலையும் காக்கிறது.
