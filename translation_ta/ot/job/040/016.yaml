  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: ta
  text: பாருங்கள், அவனுடைய வலிமை அவனுடைய இடுப்பில் இருக்கிறது; அவனுடைய ஆற்றல் அவனுடைய வயிற்றுத் தசைகளில் இருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வயிற்றுத் தசைநாண்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்; נָא இங்கு வலியுறுத்தலைச் சேர்க்கிறது. நவீனத் தமிழில் இயல்பாகவும் கவித்துவக் கண்ணியத்துடனும் உடனடி கவனத்தை ஈர்க்க ‘இதோ’ போதுமானது.
- source_word: כֹחוֹ
  choice: அவனுடைய வலிமை
  rationale: כֹחַ இச்சூழலில் உடல்சார்ந்த வலிமையைக் குறிக்கிறது; இணையான אֹון என்பதிலிருந்து இயல்பான சொல்லியல் வேறுபாட்டையும் இது காக்கிறது.
- source_word: בְמָתְנָיו
  choice: அவனுடைய இடுப்பில்
  rationale: מָתְנַיִם இடுப்பு/அரைக்கட்டுப் பகுதியைக் குறிக்கிறது. ‘இடுப்பு’ என்பது சாதாரண வாசகருக்குத் தெளிவான, இயல்பான உடற்கூற்றுச் சொல்.
- source_word: וְאֹנוֹ
  choice: அவனுடைய ஆற்றல்
  rationale: אוֹן வலிமை, வீரியம், ஆற்றல் ஆகிய பொருள்களைக் கொள்ளலாம். ‘ஆற்றல்’ என்பது כֹחַ-க்கு இணையாக இருந்தாலும் எபிரெயக் கவிதையின் நெருங்கிய சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
- source_word: בִּשְׁרִירֵי
  choice: தசைகளில்
  rationale: שְׁרִירִים தசைகள், நரம்புகள் அல்லது உறுதியான சதைப்பகுதிகளைக் குறிக்கக்கூடும். உடல்வருணனையில் ‘தசைகள்’ நவீன வாசகருக்கு மிகத் தெளிவான தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִטְנוֹ
  choice: அவனுடைய வயிற்று
  rationale: בֶּטֶן இங்கு வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிக்கிறது. ‘வயிற்றுத் தசைகள்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
