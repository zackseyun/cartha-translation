- from: இதோ, அவனுடைய வலிமை அவனுடைய இடுப்பில் இருக்கிறது; அவனுடைய ஆற்றல் அவனுடைய வயிற்றுத் தசைகளில் இருக்கிறது.[a]
  to: பாருங்கள், அவனுடைய வலிமை அவனுடைய இடுப்பில் இருக்கிறது; அவனுடைய ஆற்றல் அவனுடைய வயிற்றுத் தசைகளில் இருக்கிறது.[a]
