  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: ta
  text: அது உன்னிடம் பல வேண்டுதல்களை[a] விடுக்குமா? அல்லது உன்னிடம் மென்மையான வார்த்தைகளை[b] பேசுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மன்றாட்டுகளை.” எபிரெயச் சொல் தயவு அல்லது இரக்கம் நாடும் உருக்கமான வேண்டுதல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கனிவான வார்த்தைகளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: பல ... விடுக்குமா?
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் ‘பலவாக்குதல்/மிகுதியாகச் செய்தல்’ என்ற பொருளைத் தருகிறது; கேள்விக்குறிய הֲ-ஐயும் சேர்த்து, தமிழில் இயல்பாக ‘பல ... விடுக்குமா?’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: אֶל முன்னிடைச்சொல்லின் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு பேச்சு செலுத்தப்படும் நபரை நேரடியாகக் குறிக்கிறது.
- source_word: תַּחֲנוּנִים
  choice: வேண்டுதல்கள்
  rationale: இச்சொல் தயவு அல்லது இரக்கம் கோரும் உருக்கமான மன்றாட்டுகளைக் குறிக்கிறது. ‘வேண்டுதல்கள்’ என்பது தெளிவான, இன்றைய தமிழுக்கு இயல்பான சொல்.
- source_word: אִם
  choice: அல்லது
  rationale: இங்கு אִם நிபந்தனையை அல்ல, இணையான இரண்டாவது வினாவை அறிமுகப்படுத்துவதால் ‘அல்லது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְדַבֵּר
  choice: பேசுமா?
  rationale: דבר என்பதன் பியேல் வடிவத்திற்குரிய வழக்கமான ‘பேசுதல்’ என்ற பொருள் தக்கவைக்கப்பட்டுள்ளது.
- source_word: רַכּוֹת
  choice: மென்மையான வார்த்தைகள்
  rationale: רך என்பதன் பெண்பால் பன்மை பெயரடை இங்கு பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டு மென்மையான பேச்சைக் குறிக்கிறது. ‘இனிமையான’ அல்லது ‘நயமான’ என்பது முகஸ்துதி போன்ற கூடுதல் கருத்தைத் தரக்கூடும் என்பதால் ‘மென்மையான வார்த்தைகள்’ தேர்ந்தெடுக்கப்பட்டது.
