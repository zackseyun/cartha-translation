  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: ta
  text: இதோ, நான் அற்பமானவன்[a]; உமக்கு என்ன பதில் சொல்வேன்? என் கையை என் வாய்மேல் வைத்தேன்.
