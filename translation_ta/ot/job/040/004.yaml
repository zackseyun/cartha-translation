lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: பேச்சாளரின் திடீர் உணர்வையும் கவனத்தை ஈர்க்கும் எபிரெயத் துகளின் வலிமையையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קַלֹּתִי
  choice: நான் அற்பமானவன்
  rationale: קלל என்பதன் இச்சூழலுக்குரிய சிறுமை, மதிப்பின்மை, முக்கியத்துவமின்மை ஆகிய பொருள்களைத் தருகிறது; அறநெறிசார் ‘கேடானவன்’ என்ற மிகையான பொருளைத் திணிக்கவில்லை.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: உமக்கு என்ன பதில் சொல்வேன்?
  rationale: מָה என்பதைக் ‘என்ன’ என்றும், שוב என்பதன் ஹிஃபில் வடிவத்தை இங்கு ‘பதில் சொல்’ என்றும் நேரடியாகவும் இயல்பாகவும் தருகிறது. வினா யோபுவின் பதிலளிக்க இயலாமையைச் சூழலில் உணர்த்துகிறது.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: என் கையை என் வாய்மேல் வைத்துக்கொள்கிறேன்
  rationale: மௌனத்தையும் அடக்கத்தையும் குறிக்கும் உடல் அசைவைத் தமிழிலும் அதே உருவகத்தோடு காக்கிறது. எபிரெயக் கத்தால் வடிவம் நிகழ்காலத் தீர்மானம் அல்லது உடனடி செயலைக் குறிக்கக்கூடியதால் இயல்பான தமிழ் நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: யோபுவின் தன்னைப் பற்றிய சொல்லை அறநெறிசார் குற்ற ஒப்புதலாக மொழிபெயர்க்க வேண்டுமா
  choice: நான் அற்பமானவன்
  alternative: நான் கேடானவன்; நான் மதிப்பற்றவன்
  rationale: קַלֹּתִי இங்கு சிறியவன் அல்லது பொருட்படுத்தத்தக்கவன் அல்ல என்ற தாழ்வுணர்வை முதன்மையாகக் குறிக்கிறது. ‘கேடானவன்’ என்பது இவ்வசனம் தெளிவாகச் சொல்லாத அறநெறிசார் சீர்கேட்டைச் சேர்த்துவிடும்; ‘அற்பமானவன்’ தாழ்மையைப் பாதுகாத்து அந்த மிகைப்படுத்தலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளிடம் உரையாடுவதால் மரியாதைப் பன்மை ‘உமக்கு’ தேர்ந்தெடுக்கப்பட்டது. வசனத்தின் சுருக்கமும், தாழ்மையும், மௌனத்தை வெளிப்படுத்தும் கை-வாய் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
