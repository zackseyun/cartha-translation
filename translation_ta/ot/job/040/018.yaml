  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: ta
  text: அதன் எலும்புகள் வெண்கலக் குழாய்களைப் போன்றவை[a]; அதன் எலும்புகள் இரும்புக் கம்பியைப் போன்றவை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெண்கலக் கால்வாய்கள்’ என்றும் மொழிபெயர்க்கலாம்; אֲפִיקֵי என்பது குறிப்பாகக் குழாய்களையே அல்லாமல் கால்வாய்கள் அல்லது நீண்ட தண்டுவடிவ அமைப்புகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அதன் எலும்புகள் வார்க்கப்பட்ட இரும்புப் பொருளைப் போன்றவை’ என்றும் மொழிபெயர்க்கலாம்; מְטִיל என்பது வார்க்கப்பட்ட உலோகப் பொருள் அல்லது கட்டியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: அதன் எலும்புகள்
  rationale: עֶצֶם என்பதன் நேரடியான உடற்கூறியல் பொருள் ‘எலும்பு’; அடுத்த அரையடியின் உடல்-வலிமை உருவகத்துடனும் இது பொருந்துகிறது.
- source_word: אֲפִיקֵי
  choice: குழாய்கள்
  rationale: אֲפִיקִים என்பது கால்வாய்கள், கடத்தும் வழிகள் அல்லது நீண்ட உறுதியான அமைப்புகளைக் குறிக்கலாம். எலும்புகளைக் குறிக்கும் இவ்விடத்தில் ‘குழாய்கள்’ என்பது உருவகத்தின் வடிவத்தையும் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: נְחוּשָׁה
  choice: வெண்கலம்
  rationale: இச்சொல் செம்பு அல்லது வெண்கலத்தைக் குறிக்கலாம்; வலிமையைச் சித்தரிக்கும் கவிதை உருவகத்தில் ‘வெண்கலம்’ பொருத்தமானது.
- source_word: גְּרָמָיו
  choice: அதன் உறுப்புகள்
  rationale: גֶּרֶם என்பதற்கு ‘எலும்பு’ என்றும் பொருள் உண்டு; ஆனால் இணைவரியில் உள்ள கவிதை வேறுபாட்டையும் முழு உடலின் உறுதியையும் வெளிப்படுத்த ‘உறுப்புகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּמְטִיל
  choice: கம்பிகள் போன்றவை
  rationale: מָטִיל என்பது வார்க்கப்பட்ட அல்லது நீளமாக உருவாக்கப்பட்ட உலோகப் பொருளைக் குறிக்கலாம். உடல் வலிமை உருவகத்தில் ‘கம்பிகள்’ என்பது கடினத்தன்மையையும் திடத்தன்மையையும் தெளிவாகத் தருகிறது.
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: בַּרְזֶל என்பதன் வழக்கமான பொருள் ‘இரும்பு’; முந்தைய அரையடியின் வெண்கல உருவகத்துடன் இது இணைகிறது.
