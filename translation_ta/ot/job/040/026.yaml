  text: הֲ/תָשִׂ֣ים אַגְמ֣וֹן בְּ/אַפּ֑/וֹ וּ֝/בְ/ח֗וֹחַ תִּקּ֥וֹב לֶֽחֱי/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/026.yaml
  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: ta
  text: அதன் மூக்கில் நாணற்கயிற்றைச்[a] செலுத்த உன்னால் முடியுமா? கொக்கியால்[b] அதன் தாடையைத்[c] துளைக்க முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் மூக்கில் ஒரு நாணலை.” אַגְמוֹן என்ற எபிரெயச் சொல் நேரடியாக நாணல் அல்லது கோரைப்புல்லைக் குறிக்கிறது; இங்கு நாணலால் செய்யப்பட்ட கயிறு குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முள்ளால்.” חוֹחַ என்ற எபிரெயச் சொல் முள் அல்லது கொக்கி எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதன் கன்னத்தை.” לְחִי என்ற எபிரெயச் சொல் தாடை அல்லது கன்னம் எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: செலுத்த உன்னால் முடியுமா?
  rationale: கேள்வித்துகள் הֲ மற்றும் நிறைவுறா வினை வடிவம் சேர்ந்து யோபுக்கு விடுக்கப்படும் சொல்லாட்சிக் கேள்வியை உருவாக்குகின்றன. தமிழில் ‘உன்னால் முடியுமா?’ என்பது அந்தச் சவாலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַגְמוֹן
  choice: நாணற்கயிறு
  rationale: இந்தச் சொல் அடிப்படையில் நாணல் அல்லது கோரைப்புல்லைக் குறிக்கலாம்; இச்சூழலில் மூக்கின் வழியே செலுத்தி விலங்கைக் கட்டுப்படுத்தும் நாணலால் செய்யப்பட்ட கயிறு எனப் பொருள்படுவது இயல்பானது. ‘நாணற்கயிறு’ மூல உருவகத்தையும் செயல்பாட்டையும் தக்கவைக்கிறது.
- source_word: בְּאַפּוֹ
  choice: அதன் மூக்கில்
  rationale: אַף என்பது மூக்கு அல்லது மூக்குத்துளையைக் குறிக்கும். בְּ முன்னொட்டுடன் இங்கு கயிற்றை மூக்கில் அல்லது மூக்கின் வழியே செலுத்தும் காட்சி வருகிறது; ‘மூக்கில்’ அந்த இடவியல் தெளிவின்மையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: וּבְחוֹחַ
  choice: கொக்கியால்
  rationale: חוֹחַ என்பதற்கு முள் அல்லது கொக்கி என்ற பொருள்கள் உண்டு. பெரிய விலங்கைப் பிடித்துக் கட்டுப்படுத்தும் சூழலில் ‘கொக்கி’ பொருத்தமான செயல்பாட்டு பொருளைத் தருகிறது.
- source_word: תִּקּוֹב
  choice: துளைக்க முடியுமா?
  rationale: נקב வேர்ச்சொல் துளையிடுதல் அல்லது ஊடுருவித் துளைத்தல் என்பதைக் குறிக்கிறது. ‘துளைக்க’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: לֶחֱיוֹ
  choice: அதன் தாடையை
  rationale: לְחִי என்பது கன்னம் அல்லது தாடையைக் குறிக்கலாம். கொக்கி கொண்டு விலங்கைக் கட்டுப்படுத்தும் காட்சியில் ‘தாடை’ இயல்பான முதன்மைத் தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
