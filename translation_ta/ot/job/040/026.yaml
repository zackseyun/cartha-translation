translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியானதும் கண்ணியமானதும் வாய்மொழியாக வாசிக்க ஏற்றதுமான நடை பயன்படுத்தப்பட்டுள்ளது. சொல்லாட்சிக் கேள்வியின் சவால் ‘உன்னால் முடியுமா?’ எனத் தெளிவாக்கப்பட்டுள்ளது. விலங்கைக் குறிக்க இயல்பான தமிழ் ஒருமை அஃறிணைப் பெயர்ப்பதிலியான ‘அதன்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
