source:
  edition: WLC
  text: הֲ/יִכְרֹ֣ת בְּרִ֣ית עִמָּ֑/ךְ תִּ֝קָּחֶ֗/נּוּ לְ/עֶ֣בֶד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: ta
  text: அது உன்னோடு ஓர் உடன்படிக்கை செய்துகொள்ளுமா[a]? நீ அதை என்றென்றும் அடிமையாக வைத்துக்கொள்வாயா[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “உன்னோடு ஓர் உடன்படிக்கையை வெட்டுமா?” இது ‘உடன்படிக்கை செய்துகொள்வது’ என்பதற்கான வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ அதை என்றென்றும் அடிமையாக எடுத்துக்கொள்வாயா?” இரண்டாம் பகுதியை முதல் கேள்வியின் விளைவாக அல்லது நோக்கமாகவும் புரிந்துகொள்ளலாம். ‘அடிமை’ என்பதற்கான எபிரெயச் சொல் ‘பணியாள்’ என்றும் பொருள்படலாம்.
    reason: ambiguity
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: ஓர் உடன்படிக்கை செய்துகொள்ளுமா
  rationale: כרת ברית என்பது சொற்படியாக ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், உடன்படிக்கை செய்துகொள்வதைக் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர். இயல்பான நவீனத் தமிழில் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עִמָּךְ
  choice: உன்னோடு
  rationale: யோபை நோக்கிய ஒருமை இரண்டாம் நபர் உரையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: תִּקָּחֶנּוּ
  choice: நீ அதை ... வைத்துக்கொள்வாயா
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. ஒருவரை நிரந்தரப் பணிநிலையில் எடுத்துக்கொள்வது என்ற இச்சூழலில் ‘வைத்துக்கொள்’ என்பது இயல்பான தமிழாகவும் உடைமையாக்கும் கருத்தைத் தெளிவாகவும் தருகிறது. குறிக்கப்படும் உயிரினத்துக்கு ‘அதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְעֶבֶד
  choice: அடிமையாக
  rationale: עֶבֶד என்பது ‘பணியாள்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். עוֹלָם உடன் வரும் இச்சூழல் நிரந்தரமாகக் கட்டுப்பட்ட நிலையைக் காட்டுவதால் ‘அடிமை’ பொருத்தமானது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத அல்லது நிரந்தர காலத்தைக் குறிக்கும் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இரண்டாம் வினாவின் முதல் வினாவுடனான தொடரியல் உறவு
  choice: தனி, தொடர்ச்சியான வினாவாக மொழிபெயர்த்தல்
  alternative: ‘நீ அதை என்றென்றும் அடிமையாக வைத்துக்கொள்ளும்படி’ என்று முதல் வினாவின் விளைவு அல்லது நோக்கமாக இணைத்தல்
  rationale: எபிரெயத்தில் இரண்டாம் வினைச்சொல்லுக்கு முன் வெளிப்படையான இணைப்புச்சொல் இல்லை. அது முதல் கேள்வியின் விளைவாகவும் அடுத்த இணையான கேள்வியாகவும் புரியக்கூடும். இரண்டு வினாக்களாக வழங்குவது சொல்லாட்சியின் இறுக்கத்தையும் உண்மையான தொடரியல் தெளிவின்மையையும் காக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அமைக்கப்பட்டது. உயிரினத்தைச் சுட்டுவதால் ‘அது/அதை’ பயன்படுத்தப்பட்டது. இரு குறுங்கேள்விகளாக அமைத்தல் எபிரெயக் கவிதைநடையின் சொல்லாட்சியையும் வினாவலிமையையும் காக்கிறது.
