  text: טָמְנֵ֣/ם בֶּ/עָפָ֣ר יָ֑חַד פְּ֝נֵי/הֶ֗ם חֲבֹ֣שׁ בַּ/טָּמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/013.yaml
  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: ta
  text: அவர்களைப் புழுதியில் ஒன்றாக மறை[a]; மறைவிடத்தில் அவர்களுடைய முகங்களைக் கட்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைப் புழுதியில் ஒன்றாகப் புதை.” எபிரெய வினைச்சொல் “மறை” என்று பொருள்படும்; இச்சூழலில் அது புதைப்பதையும் சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மறைவாக அவர்களுடைய முகங்களைக் கட்டு.” இறுதித் தொடர் பொருள் காணக் கடினமானது; அது ஒரு மறைக்கப்பட்ட இடத்தைக் குறிக்கலாம், மேலும் தொடக்கத்திலுள்ள “மறை” என்ற சொல்லை எதிரொலிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: அவர்களை மறைத்துவிடு
  rationale: טמן என்பதன் அடிப்படைப் பொருள் ‘மறைத்தல், ஒளித்தல்.’ புழுதியும் மரணமும் சார்ந்த சூழலில் இது புதைத்தலைக் குறிக்கக்கூடும்; எனினும் மூலத்தின் உருவகத்தையும் இறுதிச் சொல்லுடனான எதிரொலியையும் காக்க ‘மறைத்துவிடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בֶּעָפָר
  choice: புழுதியில்
  rationale: עָפָר என்பது புழுதி அல்லது தளர்ந்த மண்ணைக் குறிக்கும். இக்கவிதைச் சூழலிலுள்ள மரணச் சாயலை ‘புழுதி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָחַד
  choice: அனைவரையும் ஒன்றாக
  rationale: கூட்டாகச் செய்யப்படும் செயலைக் குறிக்கும் வினையடை. தமிழில் பன்மைச் சுட்டைத் தெளிவுபடுத்த ‘அனைவரையும் ஒன்றாக’ என வழங்கப்பட்டது.
- source_word: פְּנֵיהֶם
  choice: அவர்களுடைய முகங்களை
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘அவர்களுடைய முகங்கள்.’ நபர்களையோ தோற்றத்தையோ ஆகுபெயராகக் குறிக்கக்கூடிய நிலையிருந்தாலும், மூலத்தின் தெளிவான உடல் உருவகம் தக்கவைக்கப்பட்டது.
- source_word: חֲבֹשׁ
  choice: கட்டிவிடு
  rationale: חבשׁ என்பதன் அடிப்படைப் பொருள் ‘கட்டுதல்.’ இங்கு அடக்குதல் அல்லது சிறைப்படுத்துதல் என்ற நிழற்பொருள் இருக்கலாம்; ஆயினும் உருவகத்தைத் தீர்மானிக்காமல் ‘கட்டிவிடு’ எனத் தரப்பட்டது.
- source_word: בַּטָּמוּן
  choice: மறைவிடத்தில்
  rationale: இது טמן (‘மறைத்தல்’) வேரிலிருந்து வந்த, ‘மறைக்கப்பட்ட இடம்’ அல்லது ‘மறைவிடம்’ எனப் பொருள்படும் கடினமான வடிவமாக இருக்கலாம். தொடக்க வினையுடனான சொல்லெதிரொலியை ‘மறைவிடத்தில்’ காக்கிறது.
