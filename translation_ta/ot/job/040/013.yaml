translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கட்டளை வினைகளில் ‘-விடு’ பயன்படுத்தி எபிரெய ஆணையின் வலிமை வெளிப்படுத்தப்பட்டது. மூலத்தின் கவிதை உருவகம், ‘மறை/மறைவிடம்’ சொல்லெதிரொலி, மற்றும் இறுதித் தொடரின் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டன.
