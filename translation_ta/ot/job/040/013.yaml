revisions:
- from: அவர்கள் அனைவரையும் ஒன்றாகப் புழுதியில் மறைத்துவிடு[a]; மறைவிடத்தில் அவர்களுடைய முகங்களைக் கட்டிவிடு[b].
  to: அவர்களைப் புழுதியில் ஒன்றாக மறை[a]; மறைவிடத்தில் அவர்களுடைய முகங்களைக் கட்டு[b].
  rationale: ‘அனைவரையும்’ நீக்கப்பட்டதால், பன்மைச் சுட்டையும் ‘ஒன்றாக’ என்ற யாஹத் சொல்லின் பொருளும் கூடுதலான வலியுறுத்தல் இன்றி துல்லியமாகத் தரப்படுகின்றன. எளிய கட்டளை வடிவங்கள் மூலத்தின் செறிவான கவிதை நடையையும் இரு இணை வரிகளின் சமநிலையையும் மேம்படுத்துகின்றன. அடிக்குறிப்புகள் மூலத்தின் புதைத்தல் சாத்தியத்தையும் இறுதித் தொடரின் தீர்மானிக்க முடியாத தன்மையையும் காக்கின்றன.
