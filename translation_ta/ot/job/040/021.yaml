  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: ta
  text: தாமரை மரங்களின் கீழ், நாணல்களும் சதுப்புநிலமும் தரும் மறைவில் அது படுத்துக்கொள்கிறது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிழல் தரும் மரங்களின் கீழ்.” இங்கு வரும் எபிரெயச் சொல் எந்தத் தாவர இனத்தைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை; “தாமரை மரங்கள்” என்பது சூழலின் அடிப்படையில் பொதுவாகக் கூறப்படும் அடையாளம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: கீழ்
  rationale: ஒரு பொருளின் அடியில் அமைந்துள்ள இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: צֶאֱלִים
  choice: தாமரை மரங்கள்
  rationale: ஆற்றங்கரைச் சூழலில் நிழல் தரும் ஒரு வகை மரத்தைக் குறிக்கலாம்; பொதுவான சூழல்சார் அடையாளத்தை முதன்மை உரையில் வைத்தும், துல்லியமான தாவர இனம் உறுதியற்றதை அடிக்குறிப்பில் தெரிவித்தும் உள்ளது.
- source_word: יִשְׁכָּב
  choice: அது படுத்துக்கொள்கிறது
  rationale: Qal imperfect மூன்றாம் நபர் ஆண்பால் ஒருமை; இங்கு விலங்கின் வழக்கமான அல்லது உயிரோட்டமான நிகழ்காலச் செயலைக் குறிக்கிறது. தமிழில் உயிரற்ற ஒன்றாக அல்லாமல் விலங்கைக் குறிப்பிட இயல்பாக ‘அது’ பயன்படுத்தப்பட்டது.
- source_word: בְּסֵתֶר
  choice: தரும் மறைவில்
  rationale: மறைவு, மூடிடம், பாதுகாப்பான ஒதுக்கிடம் ஆகிய கருத்துகளைத் தருகிறது; சுற்றியுள்ள தாவரங்கள் உருவாக்கும் மறைவைக் குறிக்க இச்சொற்றொடர் இயல்பாக உள்ளது.
- source_word: קָנֶה
  choice: நாணல்கள்
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும் கூட்டுப்பொருளில் வரும் தாவரத் தொகுதியை நவீனத் தமிழில் பன்மையாக வழங்குவது இயல்பு.
- source_word: וּבִצָּה
  choice: சதுப்புநிலமும்
  rationale: ஈரமும் சேறும் நிறைந்த நிலப்பகுதியைக் குறிக்கும்; ‘சதுப்புநிலம்’ தெளிவான, பொதுவாகப் புரியும் தமிழ் சொல்.
