source:
  edition: WLC
  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: ta
  text: அகந்தையுள்ள ஒவ்வொருவனையும் நோக்கு; அவனைத் தாழ்த்து; பொல்லாதவர்களை அவர்கள் இருக்கும் இடத்திலேயே[a] மிதித்து நசுக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய இடத்திலேயே.”
    reason: תַּחְתָּם என்பதற்கான இடப்பொருளின் மாற்றுச் சொல்லாக்கம்; மூலத்தின் சொற்பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: רְאֵה
  choice: நோக்கி
  rationale: யோபை நோக்கிக் கூறப்படும் கட்டளையின் வலிமையைத் தக்கவைத்து, வெறுமனே காண்பதைக் காட்டிலும் தீர்ப்புக்குரியவர்கள்மீது கவனத்தைத் திருப்பும் பொருளை வெளிப்படுத்துகிறது.
- source_word: כָל גֵּאֶה
  choice: பெருமையுள்ள ஒவ்வொருவனையும்
  rationale: כָל என்பதன் பகிர்ந்தளிக்கும் பொருளையும், பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட גֵּאֶה என்பதன் ‘பெருமையுள்ளவர்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַכְנִיעֵהוּ
  choice: அவனைத் தாழ்த்திவிடு
  rationale: כנע என்பதன் ஹிஃபீல் கட்டளை வடிவம், பெருமையுள்ள ஒருவனைத் தாழ்ந்த நிலைக்குக் கொண்டுவருவதைக் குறிக்கிறது; பெருமை–தாழ்வு எதிர்மறையையும் தெளிவாக வைத்திருக்கிறது.
- source_word: וַהֲדֹךְ
  choice: மிதித்து நசுக்கு
  rationale: அரிதாக வரும் இந்த வினை தீர்ப்பின் சூழலில் வலுக்கட்டாயமாகக் கீழ்ப்படுத்தி அழுத்தி நசுக்கும் கருத்தைக் கொண்டுள்ளது. ‘மிதித்து நசுக்கு’ என்பது அதன் உருவகத்தையும் தீவிரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்களை
  rationale: ஒழுக்கரீதியாகத் தீமை செய்கிற ஒரு வகுப்பினரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: תַּחְתָּם
  choice: அவர்கள் நிற்கும் இடத்திலேயே
  rationale: תחת + பன்மைச் சுட்டுப்பெயர் பின்னொட்டு இங்கு ‘அவர்கள் இருக்கும் இடத்திலேயே’ அல்லது ‘அவர்களுடைய இடத்திலேயே’ எனப் பொருள்படலாம். உடனடித் தீர்ப்பை இயல்பாக வெளிப்படுத்த ‘நிற்கும் இடத்திலேயே’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: யோபுக்குக் கொடுக்கப்படும் கட்டளையின் தன்மை
  choice: இறைத் தீர்ப்புக்குரிய செயல்களைச் செய்யுமாறு யோபுக்கு விடுக்கப்படும் நேரடியான சவாலாகக் கட்டளை வடிவத்தைத் தக்கவைத்தல்
  alternative: யோபுக்கு உண்மையாகவே இறைத் தீர்ப்பை நிறைவேற்றும் அதிகாரம் வழங்கப்படுவதாக மொழிபெயர்த்தல்
  rationale: சூழலில் கடவுள், தமது ஆட்சிக்கும் தீர்ப்புக்கும் உரிய செயல்களைச் சுட்டிக்காட்டி யோபுக்குச் சவால் விடுக்கிறார். மூலத்தின் கட்டளை வலிமை காக்கப்படுகிறது; அதேவேளையில் யோபுக்கு உண்மையில் இறை அதிகாரம் வழங்கப்படுகிறது என்ற கோட்பாட்டுக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், உயர்வான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை ‘ஒவ்வொருவனையும்—அவனை’ என்ற எபிரெயப் பொருத்தம் காக்கப்பட்டுள்ளது; இரண்டாம் அடியில் பொல்லாதவர்களைக் குறிக்கும் பன்மையும் தக்கவைக்கப்பட்டுள்ளது.
