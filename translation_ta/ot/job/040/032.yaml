  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: ta
  text: அதன்மேல் உன் கையை வை; போராட்டத்தை நினைத்துக்கொள்—மீண்டும் அப்படிச் செய்யாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “மேலும் சேர்க்காதே”; சூழலில், “மீண்டும் அப்படிச் செய்யாதே” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: வை
  rationale: שׂים என்பதன் கட்டளை வடிவத்தை நேரடியாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: עַל + மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி என்பதன் அடிப்படைப் பொருள் ‘அதன்மேல்.’ சூழலில் லிவியாதான் ஒரு விலங்காக இருப்பதால் தமிழில் ‘அது’ இயல்பானது.
- source_word: כַּפֶּךָ
  choice: உன் கையை
  rationale: כַּף என்பது உள்ளங்கை அல்லது கை எனப் பொருள்படும்; இச்சூழலில் செயலைத் தெளிவாகச் சொல்ல ‘கை’ இயல்பான தேர்வு.
- source_word: זְכֹר
  choice: நினைத்துக்கொள்
  rationale: זכר என்பதன் கட்டளைத் தன்மையைப் பேணுவதோடு, எதிர்கொள்ளவிருக்கும் போராட்டத்தை மனத்தில் கொள்ள வேண்டும் என்ற எச்சரிக்கையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִלְחָמָה
  choice: போராட்டத்தை
  rationale: מִלְחָמָה போர் அல்லது சண்டையைக் குறிக்கும். இங்கு லிவியாதானுடன் நேரிடும் மோதலைக் குறிக்க ‘போராட்டம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַל תּוֹסַף
  choice: மீண்டும் அப்படிச் செய்யாதே
  rationale: சொல்லர்த்தமாக ‘மேலும் சேர்க்காதே’ என்றாலும், இங்கு முன்சொன்ன கையை வைக்கும் முயற்சியை மறுபடியும் செய்யாதே என்பதே மரபுத்தொடரின் சூழல்சார் பொருள். எபிரெயக் கட்டளை வடிவத்தைத் தீர்மானமான எதிர்காலக் கூற்றாக மாற்றாமல் பேணுகிறது.
