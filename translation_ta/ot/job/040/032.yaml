  source_fidelity: 'The Tamil accurately represents the Hebrew sequence of imperatives: “put/lay,” “remember,” and the negative idiom אַל־תּוֹסַף. “அதன்மேல்” appropriately renders עָלָיו without forcing a personal gender distinction that Tamil does not require for the creature. The final “மீண்டும் அப்படிச் செய்யாதே” supplies the contextual action naturally while retaining the Hebrew’s prohibitive force; it does not adopt the English audit trail’s interpretive future as though it were explicit in the Hebrew.'
  naturalness: The wording is clear, idiomatic modern standard Tamil and maintains the direct, solemn warning of the passage. “போராட்டத்தை நினைத்துக்கொள்” is natural in context for the impending conflict, and the dash effectively marks the forceful consequence/warning.
  terminology: “கை,” “நினைத்துக்கொள்,” and “போராட்டம்” are suitable, non-sectarian choices. No theological terminology is involved. The note correctly identifies the literal sense of the final Hebrew expression and explains the contextual Tamil rendering.
