translation_notes:
  register: நவீன பொதுத்தமிழில் நேரடியான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் உள்ள தொடர் கட்டளைகளும் இறுதி எச்சரிக்கையின் வலிமையும் பேணப்பட்டுள்ளன.
