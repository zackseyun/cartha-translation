  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: ta
  text: அது கடவுளின் செயல்களில் முதலானது[a]; அதை உண்டாக்கியவர் தமது வாளை அதனருகில் கொண்டுவரட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது கடவுளுடைய வழிகளில் முதலானது.” רֵאשִׁית என்பது “தலைசிறந்தது” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த இறுதிக் கூற்றின் எபிரெய வாசகம் கடினமானது. “அதை உண்டாக்கியவர் மட்டுமே வாளுடன் அதை அணுக முடியும்” என்றோ, “அதை உண்டாக்கியவர் அதற்கு வாளை அளித்தார்” என்றோ இதைப் புரிந்துகொள்ளலாம். “அவரது வாள்” என்பதில் உள்ள உடைமைச் சுட்டின் குறிப்பு விவாதத்துக்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: முதன்மையானது
  rationale: இச்சூழலில் காலவரிசையில் ‘முதலாவது’ என்பதையும் தரத்தில் ‘முதன்மையானது’ என்பதையும் குறிக்கக்கூடிய சொல்லாக உள்ளது. ‘முதன்மையானது’ படைப்புகளிடையே அதன் சிறப்பிடத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דַּרְכֵי אֵל
  choice: கடவுளின் செயல்களில்
  rationale: דֶּרֶךְ என்பதன் அடிப்படைப் பொருள் ‘வழி’ என்றாலும், இங்கு கடவுளின் செயற்பாடுகளையோ படைப்புச் செயல்களையோ குறிக்கிறது. ‘செயல்களில்’ என்பது ‘படைப்புகளில்’ என்று தேவைக்கு மேல் குறிப்பாக்காமல் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு பொதுவான இறைப்பட்டமாக வரும் אֵל என்பதற்கு நவீனத் தரத் தமிழில் இயல்பான, சமயப் பிரிவுசார்பற்ற இணைச்சொல்.
- source_word: הָעֹשׂוֹ
  choice: அதை உண்டாக்கியவர்
  rationale: குறிப்பிட்ட உயிரினத்தைச் செய்தவரைக் குறிக்கும் எபிரெயப் பெயரெச்சத் தொடரை தெளிவான உறவுத்தொடராக மொழிபெயர்க்கிறது.
- source_word: יַגֵּשׁ
  choice: அருகில் கொண்டுவர முடியும்
  rationale: Hiphil வடிவத்தின் அடிப்படைப் பொருளான ‘அருகில் கொண்டுவருதல்’ என்பதைக் காக்கிறது. ‘முடியும்’ என்பது இச்சூழலில் உண்டாக்கியவர் மட்டுமே அதனை எதிர்கொள்ள வல்லவர் என்ற சாத்தியப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַרְבּוֹ
  choice: தமது வாளை
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியை, உடனடி எழுவாயான உண்டாக்கியவரோடு இணைத்து மரியாதைப் பன்மையில் வழங்குகிறது. இறுதிக் கூற்றின் வேறு இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: கடினமான இறுதி அரையடியின் பொருள்
  choice: அதை உண்டாக்கியவர் மட்டுமே தமது வாளை அதனருகில் கொண்டுவர முடியும்
  alternative: அதை உண்டாக்கியவர் தாமே அதற்கு அதன் வாளை அளித்தார்; அல்லது, அதை உண்டாக்கியவர் மட்டுமே வாளுடன் அதை அணுக முடியும்
  rationale: எபிரெயக் கூற்று சுருக்கமானதும் இலக்கண ரீதியாகப் பலவாறு புரிந்துகொள்ளத்தக்கதுமாக உள்ளது. முதன்மை உரை அதன் உண்டாக்கியவரால் மட்டுமே அதை எதிர்கொள்ள இயலும் என்ற வாசிப்பை அளிக்கிறது; மற்ற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெகேமோத் எனும் உயிரினத்தைக் குறிக்க ‘அது’ பயன்படுத்தப்பட்டு, கடவுளைக் குறிக்கும் இடத்தில் மரியாதை வினை மற்றும் ‘தமது’ பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
