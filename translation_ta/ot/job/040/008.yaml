  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: ta
  text: என் நீதியையே நீ ரத்து செய்வாயா? நீ நீதிமானாக நிரூபிக்கப்படுவதற்காக என்னைக் குற்றவாளி எனத் தீர்ப்பாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தீர்ப்பையே.” எபிரேயச் சொல் தீர்ப்பு, நீதி, அல்லது சட்ட உரிமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: -யையே ... -ஆ?
  rationale: கேள்வித் தன்மையையும் அதிர்ச்சியுடன் கூடிய வலியுறுத்தலையும் தமிழில் இயல்பாக வெளிப்படுத்த, கேள்வி விகுதியோடு ‘-யையே’ என்னும் வலியுறுத்தல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: תָּפֵר
  choice: செல்லாததாக்குவாயா
  rationale: Hiphil வடிவிலுள்ள פרר என்பது ஒன்றைச் செல்லுபடியாகாததாக்குதல் அல்லது பயனற்றதாக்குதல் எனப் பொருள்படும். நீதித்துறைச் சூழலைத் தக்கவைக்க ‘செல்லாததாக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מִשְׁפָּטִי
  choice: என் நீதி
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நீதி, சட்ட உரிமை ஆகிய பொருள்களைக் கொண்டிருக்கலாம். இங்கு கடவுளின் நீதியான ஆட்சியும் தீர்ப்பும் கேள்விக்குள்ளாக்கப்படுவதால், பரந்த பொருளுடைய ‘என் நீதி’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; ‘என் தீர்ப்பு’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּרְשִׁיעֵנִי
  choice: என்னைக் குற்றவாளி என்று தீர்ப்பாயா
  rationale: רשע என்பதன் Hiphil வடிவம் நீதிமன்றப் பொருளில் ஒருவரைக் குற்றவாளி என அறிவித்தல் அல்லது கண்டனம் செய்தல் என்பதைக் குறிக்கிறது. ‘குற்றவாளி என்று தீர்ப்பது’ அந்தச் சட்டவியல் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: לְמַעַן
  choice: -வதற்காக
  rationale: நோக்கத்தை அல்லது விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் தொடர்பை இயல்பான தமிழில் ‘-வதற்காக’ வெளிப்படுத்துகிறது.
- source_word: תִּצְדָּק
  choice: நீ நீதிமான் என்று நிலைநாட்டப்பட
  rationale: צדק இங்கு நீதித்துறைச் சூழலில் சரியானவர் அல்லது நீதியுள்ளவர் என நிறுவப்படுவதைக் குறிக்கிறது. ‘நிலைநாட்டப்பட’ என்பது தன்னை நியாயப்படுத்திக்கொள்ளும் கருத்தையும் ‘குற்றவாளி என்று தீர்ப்பது’ என்பதுடனான சட்டவியல் முரணையும் காக்கிறது.
theological_decisions:
- issue: வசனத்தின் சட்டவியல் பொருளா அல்லது பொதுவான ஒழுக்கவியல் பொருளா
  choice: ‘நீதி ... குற்றவாளி என்று தீர்ப்பாயா ... நீதிமான் என்று நிலைநாட்டப்பட’ என்ற சட்டவியல் மொழிநடை
  alternative: ‘என் நேர்மையை மறுத்து, நீ சரியானவன் என்று காட்டுவதற்காக என்னைத் தவறானவனாக்குவாயா?’ போன்ற பொதுவான ஒழுக்கவியல் மொழிபெயர்ப்பு
  rationale: מִשְׁפָּט, רשע, צדק ஆகிய சொற்கள் வலுவான நீதிமன்றப் பின்னணியைக் கொண்டவை. ஆகவே கடவுளுடைய நீதியைப் பற்றிய யோபின் சவாலில் உள்ள இறையியல் பதற்றத்தைத் தணிக்காமல் சட்டவியல் மொழி பாதுகாக்கப்பட்டுள்ளது.
- issue: מִשְׁפָּטִי என்பதன் மொழிபெயர்ப்பு
  choice: என் நீதி
  alternative: என் தீர்ப்பு
  rationale: சூழல் ஒரு தனிப்பட்ட தீர்ப்பை மட்டுமல்லாமல் கடவுளின் நீதியான ஆட்சியையும் யோபு அதைப் பற்றிச் செய்த மதிப்பீட்டையும் தொடுகிறது. இருப்பினும் ‘என் தீர்ப்பு’ என்பதும் உண்மையான சொற்பொருள் வாய்ப்பு என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான சட்டவியல் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான வினாக்களின் அமைப்பும், கடவுளைக் குற்றவாளியாகத் தீர்த்து மனிதன் தன்னை நீதிமானாக நிலைநாட்டும் கூர்மையான முரணும் பாதுகாக்கப்பட்டுள்ளன.
