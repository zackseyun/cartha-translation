translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவ மரியாதையையும் உடற்கூறு விளக்கத்தின் தெளிவையும் சமநிலைப்படுத்தும் நடை. விலங்கைத் தமிழில் இயல்பாகச் சுட்ட ‘அது/அதன்’ பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் உள்ள இரண்டு முக்கிய சொற்பொருள் ஐயங்களும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
