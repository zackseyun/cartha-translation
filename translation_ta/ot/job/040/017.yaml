  text: יַחְפֹּ֣ץ זְנָב֣/וֹ כְמוֹ אָ֑רֶז גִּידֵ֖י פחד/ו יְשֹׂרָֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: ta
  text: அது தன் வாலை கேதுரு மரத்தைப்போல் விறைக்கச் செய்கிறது; அதன் தொடைகளின் நரம்புகள் பின்னிப் பிணைந்திருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொடைகளின் நரம்புகள்” என்பதற்குப் பதிலாக “இடுப்பின் தசைநார்கள்” என்றும், இன்னும் குறிப்பாக “இனப்பெருக்க உறுப்புகளின் தசைகள் அல்லது நரம்புகள்” என்றும் பொருள் கொள்ளலாம். இங்குள்ள எபிரெயச் சொல் உறுதியற்றதும் விவாதத்திற்குரியதும் ஆகும். “விறைக்கச் செய்கிறது” என்பதற்கும் “வளைக்கிறது” அல்லது “அசைக்கிறது” என்ற மாற்றுப் பொருள்கள் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: விறைக்கச் செய்கிறது
  rationale: חפץ என்பதன் வழக்கமான பொருள் ‘விரும்பு/மகிழ்’ என்றாலும், இங்கு வாலும் கேதுரு மரத்துடனான ஒப்பீடும் உடல்சார்ந்த செயலைக் குறிக்கின்றன. ‘விறைக்கச் செய்கிறது’ என்பது உறுதியான, நேராக நிற்கும் தோற்றத்தை இயல்பான தமிழில் தருகிறது; மூல வினையின் அரிதான பயன்பாட்டால் உருவாகும் ஐயத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: זְנָבוֹ
  choice: தன் வாலை
  rationale: பெயர்ச்சொல்லையும் மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: כְמוֹ אָרֶז
  choice: கேதுரு மரத்தைப்போல்
  rationale: வலிமை மற்றும் உறுதித் தோற்றத்தைச் சுட்டும் கேதுரு மர உவமையைப் பாதுகாக்கிறது.
- source_word: גִּידֵי
  choice: நரம்புகள்
  rationale: גיד என்பது தசைநார் அல்லது நாணைக் குறிக்கலாம். பொதுவான நவீன தமிழில் உடலியல் படிமத்தை தெளிவாகவும் இயல்பாகவும் தர ‘நரம்புகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פחדו
  choice: அதன் தொடைகளின்
  rationale: இந்த அரிய சொல்லின் உடற்கூறு குறிப்பு சர்ச்சைக்குரியது. முதன்மை உரையில் வாசிக்க இயல்பான ‘தொடைகள்’ பயன்படுத்தப்பட்டு, இடுப்பு அல்லது இனப்பெருக்க உறுப்புகளின் தசைநார்கள் என்ற மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יְשֹׂרָגוּ
  choice: பின்னிப் பிணைந்திருக்கின்றன
  rationale: ஒன்றோடொன்று இறுக்கமாகப் பின்னப்பட்ட அல்லது பிணைக்கப்பட்ட நிலையைச் சுட்டும் வினையின் கவித்துவப் படிமத்தை இயல்பான தமிழில் வழங்குகிறது.
