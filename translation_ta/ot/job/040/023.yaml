source:
  edition: WLC
  text: הֵ֤ן יַעֲשֹׁ֣ק נָ֭הָר לֹ֣א יַחְפּ֑וֹז יִבְטַ֓ח כִּֽי יָגִ֖יחַ יַרְדֵּ֣ן אֶל פִּֽי/הוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: ta
  text: இதோ, ஆறு பெருக்கெடுத்து வந்தாலும் அது பதற்றமடைவதில்லை; யோர்தான் அதன் வாயை நோக்கிப் பாய்ந்தாலும் அது நம்பிக்கையுடன் இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יַעֲשֹׁק נָהָר
  choice: ஆறு பெருக்கெடுத்து வந்தாலும்
  rationale: יַעֲשֹׁק என்பதன் அடிப்படைப் பொருள் ‘ஒடுக்குதல்/வன்மையுடன் தாக்குதல்’; இச்சூழலில் ஆற்றின் வலிமையான பெருக்கை இயல்பாக வெளிப்படுத்துகிறது, ஆனால் அரிய வினைச்சொல்லின் துல்லிய நிழல் ஓரளவு தெளிவற்றதே.
- source_word: לֹא יַחְפּוֹז
  choice: அது பதற்றமடைவதில்லை
  rationale: ‘அவசரப்படுதல்/திடுக்கிடுதல்’ என்ற கருத்தை, மிருகம் அஞ்சிக் கலங்காத நிலையாக நவீன தமிழில் தருகிறது.
- source_word: יִבְטַח
  choice: அது நம்பிக்கையுடன் இருக்கிறது
  rationale: בטח என்பதன் ‘பாதுகாப்பாக உணர்தல், நம்பிக்கையோடு இருத்தல்’ என்ற பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: யோர்தான் அதன் வாயை நோக்கிப் பாய்ந்தாலும்
  rationale: יָגִיחַ என்பதிலுள்ள வலிமையான பாய்ச்சலைக் காட்டுகிறது; אֶל־פִּיהוּ என்பதைக் ‘அதன் வாயை நோக்கி’ என முறையாகத் தருகிறது.
theological_decisions:
- issue: விலங்கைக் குறிக்கும் மூன்றாம் நபர் சுட்டுப்பெயர்
  choice: அது / அதன்
  alternative: அவன் / அவனுடைய
  rationale: தமிழில் விலங்கைக் குறிப்பிட இயல்பான அஃறிணை வடிவம் பயன்படுத்தப்பட்டது; இதனால் உரையின் உயிரியல் உருவகமோ இறையியல் அடையாளமோ கூடுதலாக நிர்ணயிக்கப்படவில்லை.
- issue: யோர்தான் என்ற பெயரின் பயன்பாடு
  choice: யோர்தான்
  alternative: ஒரு நதி
  rationale: மூலத்தில் உள்ள குறிப்பிட்ட நதிப்பெயரைப் பாதுகாத்து, அதை பொதுவான பெருவெள்ளமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, தெளிவான நடையில், மூலத்தின் இரு இணைநிலை வாக்கியங்களும் வலிமை மற்றும் அமைதி இடையிலான முரணும் காக்கப்பட்டுள்ளன.
