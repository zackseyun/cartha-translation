  source_fidelity: 'மூல எபிரெயத்தின் இரு இணை வாக்கியங்களும் நன்றாகப் பிரதிபலிக்கப்படுகின்றன: ஆற்றின் வன்மையான பெருக்கு/தாக்குதலுக்கு மிருகம் பதறாது; யோர்தான் அதன் வாயை நோக்கிப் பாய்ந்தாலும் அது உறுதியுடன் உள்ளது. יַעֲשֹׁק என்ற அரிய சொல்லின் நுட்பம் ஓரளவு விவாதத்துக்குரியது; ‘பெருக்கெடுத்து வந்தாலும்’ என்பது சூழலுக்கு ஏற்ற, தேவையற்ற விளக்கத்தைச் சேர்க்காத பாதுகாப்பான வடிவம். அֶל־פִּיהוּ என்பதற்கான ‘அதன் வாயை நோக்கி’ என்பதும் மூலத்தின் திசைச் சுட்டலைக் காக்கிறது.'
  naturalness: நவீன நிலையான தமிழில் வாசகம் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘பதற்றமடைவதில்லை’ மற்றும் ‘நம்பிக்கையுடன் இருக்கிறது’ ஆகியவை வலிமையான நீர்ப்பெருக்கின் எதிரில் அஞ்சாத நிலையை இயல்பாகத் தெரிவிக்கின்றன. இருமுறை வரும் ‘அது’ முந்தைய சூழலிலுள்ள மிருகத்தையே தெளிவாகக் குறிக்கிறது.
