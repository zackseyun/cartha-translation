  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: ta
  text: ஒருமுறை பேசினேன்[a]; நான் பதிலளிக்கமாட்டேன். இருமுறை பேசினேன்; எதையும் சேர்த்துச் சொல்லமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருமுறை பேசினேன்; ஆனால் பதிலளிக்கமாட்டேன். இருமுறை பேசினேன்; அதற்கு மேல் தொடரமாட்டேன்.” ‘சேர்’ என்பதற்கான எபிரெய வினைச்சொல், ஒரு செயலைத் தொடர்வதையோ மீண்டும் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: ஒருமுறை
  rationale: பெண்பால் எண் இங்கு வினையோடு வினையடைபோல் வந்து ‘ஒருமுறை’ எனப் பொருள்படுகிறது.
- source_word: דִּבַּרְתִּי
  choice: பேசிவிட்டேன்
  rationale: முடிந்த செயலும் அதன் தற்போதைய விளைவும் வெளிப்படும்படி எபிரெய நிறைவுநிலை வினை இயல்பான தமிழில் தரப்படுகிறது.
- source_word: וְלֹא אֶעֱנֶה
  choice: இனி நான் பதிலளிக்கமாட்டேன்
  rationale: ענה என்பதன் அடிப்படைப் பொருளான ‘பதிலளி’ பாதுகாக்கப்படுகிறது; சூழலில் யோபின் இனிமேல் பதில் கூறாத தீர்மானத்தை ‘இனி’ தெளிவாக்குகிறது.
- source_word: וּשְׁתַּיִם
  choice: இருமுறை
  rationale: ‘ஒருமுறை’ என்பதற்கு இணையான வினையடைப் பயன்பாடாக ‘இருமுறை’ இயல்பாக அமைகிறது.
- source_word: וְלֹא אוֹסִיף
  choice: இனி எதையும் சேர்த்துச் சொல்லமாட்டேன்
  rationale: יסף என்பதிலுள்ள ‘சேர்’ என்ற உருவகத்தைப் பாதுகாத்தபடியே, இங்கு மேலும் பேசுவதைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
