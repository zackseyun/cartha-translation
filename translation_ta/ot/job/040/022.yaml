  text: தாமரை மரங்கள் தங்கள் நிழலால் அதனை மூடுகின்றன[a]; நீரோடையின் வில்லோ மரங்கள் அதனைச் சூழ்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
