  choice: அதனை மூடுகின்றன
  rationale: סכך என்பதன் நேரடியான ‘மூடுதல்/மறைத்தல்’ என்ற பொருளைப் பேணுகிறது; இங்கு மரங்களின் நிழல் பாதுகாப்பாகப் படர்வதையும் இயல்பாக உணர்த்துகிறது.
- source_word: צֶאֱלִים
  choice: தாமரை மரங்கள்
  rationale: துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றதாயினும், யோபு நூலில் வழக்கமாக வழங்கப்படும் ‘lotus trees’ என்ற அடையாளத்தைப் பேணுகிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִלֲלוֹ
  choice: தங்கள் நிழலால்
  rationale: צֵל என்பதன் ‘நிழல்’ என்ற அடிப்படைப் பொருளை நேரடியாக வெளிப்படுத்தி, ‘மூடுகின்றன’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: יְסֻבּוּהוּ
  choice: அதனைச் சூழ்ந்திருக்கின்றன
  rationale: סבב என்பதன் ‘சுற்றியிருத்தல்/சூழ்தல்’ என்ற பொருளைத் தெளிவாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: עַרְבֵי נָחַל
  choice: ஓடையின் அலரி மரங்கள்
