translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் குறிப்பில் வரும் உயிரினத்தின் இலக்கணப் பால் தமிழில் ஊகிக்கப்படாமல் ‘அதனை’ என வழங்கப்பட்டுள்ளது. இரண்டு தாவரவியல் சொற்களிலும் உள்ள நிச்சயமின்மை அடிக்குறிப்புகளால் வெளிப்படையாகப் பேணப்பட்டுள்ளது.
