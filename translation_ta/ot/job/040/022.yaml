    text: ‘தாமரை மரங்கள்’ என்பதற்குப் பதிலாக ‘நிழல் தரும் மரங்கள்’ என்றும் மொழிபெயர்க்கலாம்; צֶאֱלִים என்ற சொல்லின் துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றது.
    reason: lexical_alternative
