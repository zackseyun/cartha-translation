source:
  edition: WLC
  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: ta
  text: அப்போது யாவே புயலிலிருந்து யோபுக்குப் பதிலளித்துச் சொன்னார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுழற்காற்றிலிருந்து.”
    reason: சְעָרָה என்பதற்கு ‘புயல்’ என்பதோடு ‘சுழற்காற்று’ என்ற பொருளும் உண்டு; அந்த நியாயமான மாற்று மொழிபெயர்ப்பை இக்குறிப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּעַן
  choice: அப்போது ... பதிலளித்துச்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ענה இங்கு ‘பதிலளித்தல்’ என்று பொருள்படுகிறது. ‘அப்போது’ நிகழ்வின் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இறைநாமமாகிய நான்கு எழுத்துப் பெயர். அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்க தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת אִיּוֹב
  choice: யோபுக்கு
  rationale: אֵת யோபை வினையின் தொடர்புடைய நபராகக் குறிக்கிறது. தமிழில் ‘யோபுக்குப் பதிலளித்தார்’ என்பது இயல்பான வழக்கு.
- source_word: מִן סְעָרָה
  choice: புயலிலிருந்து
  rationale: סְעָרָה கடும் புயல், சுழற்காற்று அல்லது பெருங்காற்றைக் குறிக்கலாம். ‘புயல்’ மூலச்சொல்லின் பரந்த பொருளையும் இறைத்தோற்றச் சூழலையும் மிகையாகக் குறிப்பாக்காமல் தருகிறது.
- source_word: וַיֹּאמַר
  choice: 'சொன்னார்:'
  rationale: இது தொடர்ந்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வழக்கமான எபிரேய கதைச்சொல்; அடுத்த வசனத்தில் உரை வருவதைக் காட்ட முக்காற்புள்ளி இடப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலவசனம் பட்டப்பெயரை அல்ல, நான்கு எழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பதிலளித்துச் சொன்னார்’ என்ற இணைப்பு மூலத்திலுள்ள இரண்டு தனித்த வினைகளையும் பாதுகாக்கிறது; ‘புயல்’ பொதுவாசகருக்குத் தெளிவான சொல்.
