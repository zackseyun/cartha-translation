base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: ta
  text: இப்போது[a], மாட்சியையும் உயர்வையும் அணிந்துகொள்; பொலிவையும் மாண்பையும் உடுத்திக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயவுசெய்து.” எபிரெயச் சொல் வேண்டுகோள் அல்லது வலியுறுத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדֵה
  choice: உன்னை அலங்கரித்துக்கொள்
  rationale: தன்னை அணிகலன்களால் அலங்கரித்துக்கொள்ளும் பொருளுடைய இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை. பின்னருள்ள ஆடை அணியும் உருவகத்தோடு இயல்பாக இணைகிறது.
- source_word: נָא
  choice: '[a] அடிக்குறிப்பில் ‘இப்போது’'
  rationale: வேண்டுகோள் அல்லது வலியுறுத்தலைக் குறிக்கும் இடைச்சொல். இங்கு தேவனுடைய சவாலின் சூழலில் தமிழ் முதன்மை உரையில் ‘தயவுசெய்து’ என்பது பொருந்தாமல் மென்மையாக்கக்கூடும்; ‘இப்போது’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: גָאוֹן
  choice: மாட்சி
  rationale: இச்சூழலில் பாவமான பெருமையை அல்ல, உயர்ந்த அரச மேன்மையையும் மகத்துவத்தையும் குறிக்கிறது.
- source_word: גֹּבַהּ
  choice: மேன்மை
  rationale: அடிப்படையில் ‘உயரம்’; גָאוֹן உடன் இணைந்து உயர்ந்த பெருமிதமான தோற்றத்தைக் குறிக்கிறது. எதிர்மறையான ‘செருக்கு’ என்பதைத் திணிக்காமல் கவித்துவ இணையைப் பாதுகாக்கிறது.
- source_word: הוֹד
  choice: ஒளிமை
  rationale: கண்ணுக்குப் புலப்படும் பொலிவையும் கம்பீரத்தையும் குறிக்கிறது; மாட்சி என்பதிலிருந்து சொல்லியல் வேறுபாட்டைப் பேணுகிறது.
- source_word: הָדָר
  choice: மாண்பு
  rationale: கண்ணியம், மேன்மை, அழகு ஆகிய நிழற்பொருள்களைக் கொண்ட சொல். ‘ஒளிமை’க்கு இணையானதாயிருந்தும் தனித்த நுண்பொருளைத் தருகிறது.
- source_word: תִּלְבָּשׁ
  choice: ஆடையாக அணிந்துகொள்
  rationale: முந்தைய கட்டளையைத் தொடரும் வினை; எபிரெய உரையின் ஆடை உருவகத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: גָאוֹן மற்றும் גֹּבַהּ ஆகியவற்றை எதிர்மறையான செருக்கு/கர்வமாகவா, அரச அல்லது தெய்வீக மகத்துவமாகவா மொழிபெயர்ப்பது
  choice: நேர்மறையான ‘மாட்சி’ மற்றும் ‘மேன்மை’
  alternative: ‘பெருமை’ மற்றும் ‘செருக்கு’ போன்ற எதிர்மறைச் சொற்கள்
  rationale: யோபு தேவனுக்குரிய பேராற்றலையும் அதிகாரத்தையும் ஏற்றுக்காட்டும்படி சவால் விடப்படும் உடனடிச் சூழலும், ஒளிமை மற்றும் மாண்பை ஆடையாக அணியும் இணை உருவகமும், ஒழுக்கக் குற்றத்தைவிட அரச/தெய்வீக மகத்துவத்தையே ஆதரிக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த கவிதைநடை. நான்கு எபிரெய மகத்துவச் சொற்களின் நெருங்கிய ஆனால் வேறுபட்ட நுண்பொருள்களை மாட்சி, மேன்மை, ஒளிமை, மாண்பு எனப் பிரித்துப் பேணுகிறது. נָא முதன்மை உரையில் தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல், அதன் ‘இப்போது’ என்ற சாத்தியம் [a] அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
