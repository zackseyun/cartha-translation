revisions:
- from: மாட்சியாலும் மேன்மையாலும் உன்னை அலங்கரித்துக்கொள்[a]; ஒளிமையையும் மாண்பையும் ஆடையாக அணிந்துகொள்.
  to: இப்போது[a], மாட்சியையும் உயர்வையும் அணிந்துகொள்; பொலிவையும் மாண்பையும் உடுத்திக்கொள்.
  rationale: The revision explicitly renders נא as “இப்போது,” preserving its exhortative force without softening the divine challenge. It also uses natural modern Tamil clothing verbs and retains a positive regal semantic field for all four nouns. The footnote preserves the viable alternative force of נא without treating negative renderings of the grandeur terms as the preferred sense.
