translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. விலங்கைக் குறிக்க இயல்பான ‘அது’ பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் சுருக்கமும் வினைச்சொற்களின் எழுவாய் குறித்த தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
