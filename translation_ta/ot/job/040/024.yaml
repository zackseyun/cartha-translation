  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: ta
  text: அது பார்த்துக்கொண்டிருக்கும்போதே யாராவது அதைப் பிடிக்க முடியுமா? கண்ணிகளால் அதன் மூக்கைத் துளைக்க முடியுமா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது பார்த்துக்கொண்டிருக்கும்போதே அவன் அதைப் பிடிப்பானா? கண்ணிகளால் அதன் மூக்கைத் துளைப்பானா?” எபிரெய வாசகம் சுருக்கமாகவும் பொருள் காணக் கடினமாகவும் உள்ளது; வினைச்சொற்களைப் பொதுப்படையான ‘யாராவது’ என்ற பொருளின்றியும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் “கண்ணிகளால்” என்று உள்ளது. சில மரபுவழி மொழிபெயர்ப்புகள் “கொக்கிகளால்” என்பதற்கு நெருக்கமான உருவகத்தை வழங்குகின்றன; ஆனால் இங்குள்ள பெயர்ச்சொல் பொதுவாகப் பொறிகள் அல்லது கண்ணிகளையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: அது பார்த்துக்கொண்டிருக்கும்போதே
  rationale: בְּ + ‘கண்கள்’ என்பது இங்கு கருவிப்பொருளை அல்ல, விலங்கு பார்த்துக்கொண்டிருக்கும்போதே அதன் முன்னிலையில் நிகழும் செயலைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது. இந்தத் தமிழாக்கம் கேள்வியின் சவாலான தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִקָּחֶנּוּ
  choice: யாராவது அதைப் பிடிக்க முடியுமா?
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; வேட்டையாடும் சூழலில் ‘பிடித்தல்’ பொருத்தமானது. எபிரெய வாக்கியம் சுருக்கமாக இருந்தாலும், சூழமைவு இதை இயலாமையை உணர்த்தும் வினாவாக வாசிக்க ஆதரிக்கிறது.
- source_word: בְּמוֹקְשִׁים
  choice: கண்ணிகளால்
  rationale: מוֹקֵשׁ பொதுவாக விலங்கைப் பிடிக்கும் கண்ணி அல்லது பொறியைக் குறிக்கிறது; ‘கொக்கிகள்’ என்று மாற்றுவது மூலச்சொல்லின் வழக்கமான பொருளிலிருந்து விலகும்.
- source_word: יִנְקָב
  choice: துளைக்க
  rationale: נקב என்பது துளைத்தல் அல்லது ஊடுருவித் துளையிடுதல். ‘துளைக்க’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: אָף
  choice: மூக்கை
  rationale: אַף சில இடங்களில் ‘கோபம்’ எனப் பொருள்பட்டாலும், இங்கு உடலுறுப்பான மூக்கையே குறிக்கிறது; துளைத்தல் என்ற வினையோடும் இது இயல்பாகப் பொருந்துகிறது.
