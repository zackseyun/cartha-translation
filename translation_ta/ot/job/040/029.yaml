  register: நவீன நிலையான தமிழில், கடவுள் யோபுவிடம் எழுப்பும் ஏளனத் தொனியுடைய வினாக்களைத் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது. மூலத்தின் இரு இணையான வினாக்களும் காக்கப்பட்டுள்ளன; לְנַעֲרוֹתֶיךָ என்பதிலுள்ள வயது/சமூக நிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
