  yaml_path: translation/ot/job/040/029.yaml
  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: ta
  text: ஒரு பறவையோடு விளையாடுவதுபோல் அதனோடு[a] விளையாடுவாயா? அல்லது உன் இளம்பெண்களுக்காக அதைக் கட்டிவைப்பாயா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் லிவியாதானைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் உள்ளது; தமிழில் விலங்கைக் குறிக்கும் இயல்பான வழக்கின்படி ‘அது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் சிறுமிகளுக்காக’ அல்லது ‘உன் இளம் பெண்களுக்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: விளையாடுவாயா
  rationale: שׂחק என்பதன் Qal வடிவம் ‘விளையாடு/வேடிக்கையாகக் கையாளு’ எனப் பொருள்படும். பறவையைப் பழக்கப்பட்ட செல்லப்பிராணிபோல் கையாளும் உருவகத்திற்கு இயல்பான நவீனத் தமிழ் சொல் ‘விளையாடு’.
- source_word: בּוֹ
  choice: அதனோடு
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் லிவியாதானைக் குறிக்கிறது. விலங்கைக் குறிக்கும் இயல்பான தமிழில் ‘அது’ பயன்படுத்தப்பட்டாலும், ‘அதனோடு’ மூலத்தின் உடனிகழ்வுப் பொருளைத் தக்கவைக்கிறது.
- source_word: כַּצִּפּוֹר
  choice: ஒரு பறவையோடு விளையாடுவதுபோல்
  rationale: צִפּוֹר பொதுவாகப் பறவையைக் குறிக்கிறது. தமிழில் ஒப்புமையும் ‘விளையாடு’ வினையின் இயல்பான இணைப்பும் தெளிவாக இருக்க ‘பறவையோடு விளையாடுவதுபோல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: அதைக் கட்டிவைப்பாயா
  rationale: קשר என்பது கட்டுதல் அல்லது பிணைத்தல். ஓர் உயிரினத்தை வீட்டுப் பயன்பாட்டிற்காகக் கட்டிவைக்கும் காட்சியை ‘கட்டிவை’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. இணைப்புச் சொல் தொடர்ச்சியான இரண்டாம் வினாவாகத் தமிழில் ‘அல்லது’ என வழங்கப்பட்டது.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: உன் இளம்பெண்களுக்காக
  rationale: נַעֲרוֹת என்பது இளம் பெண்கள் அல்லது சிறுமிகளைக் குறிக்கக்கூடிய பெண்பால் பன்மைச் சொல். வயதைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்காமல், கண்ணியமான நவீனத் தமிழில் ‘இளம்பெண்கள்’ தேர்ந்தெடுக்கப்பட்டது.
