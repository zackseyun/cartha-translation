translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சொல்லாட்சிக் கேள்வியாக வடிவமைக்கப்பட்டது. முதல் அடியின் ‘நிரப்ப’ என்ற மூலப்படிமம் காக்கப்பட்டுள்ளது; தமிழில் இரண்டாம் அடி முழுமையான வாக்கியமாக இயங்க ‘குத்த’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. அரிய கருவிப் பெயர்களின் நிச்சயமின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
