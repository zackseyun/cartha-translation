base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: ta
  text: அதன் தோலைக் குத்தீட்டிகளால்[a] நிரப்ப முடியுமா? அதன் தலையை மீன்பிடி ஈட்டிகளால்[b] நிரப்ப முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முள் கொண்ட இரும்புக் கருவிகளால்’ அல்லது ‘தூண்டில்களால்’; இங்கு வரும் எபிரெயச் சொல் அரிதானது. அது பொதுவாகக் கூர்மையான அல்லது முள் கொண்ட வேட்டைக் கருவிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மீன்பிடித் தூண்டில்களால்’; எபிரெயச் சொற்றொடர் பொதுவாக மீன் பிடிக்கும் ஒரு கருவியைக் குறிக்கலாம். ‘மீன்பிடி ஈட்டிகள்’ என்பது இங்குள்ள இணையான படிமத்திற்கு ஏற்ற ஒரு மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: நிரப்ப முடியுமா?
  rationale: கேள்வித் துகளுடன் வரும் பியேல் வினை வடிவம் சொல்லாட்சிக் கேள்வியாக ஒரு சவாலை முன்வைக்கிறது; ‘முடியுமா?’ என்பது அந்த ஆற்றல் குறித்த சவாலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְשֻׂכּוֹת
  choice: குத்தீட்டிகளால்
  rationale: அரிதான இச்சொல் கூர்மையான அல்லது முள் கொண்ட வேட்டை/மீன்பிடிக் கருவிகளைக் குறிக்கலாம். இணையான அடுத்த அடியுடன் பொருந்துமாறு, தோலைத் துளைக்கும் பல ஆயுதங்களின் படிமத்தை ‘குத்தீட்டிகள்’ தருகிறது.
- source_word: עוֹרוֹ
  choice: அதன் தோலை
  rationale: பெரிய விலங்கின் வெளிப்புறத் தோலை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: וּבְצִלְצַל דָּגִים
  choice: மீன்பிடி ஈட்டிகளால்
  rationale: எபிரெயச் சொற்றொடர் மீனுடன் தொடர்புடைய பிடிப்பு அல்லது தாக்குதல் கருவியைக் குறிக்கிறது. முந்தைய அடியின் கூரிய ஆயுதப் படிமத்துக்கும் தலையைத் தாக்கும் சூழலுக்கும் ‘மீன்பிடி ஈட்டிகள்’ நன்றாகப் பொருந்துகிறது.
- source_word: רֹאשׁוֹ
  choice: அதன் தலையை
  rationale: உடற்பகுதியைக் குறிக்கும் நேரடியான பொருள்; ‘அதன் தோல்’ என்பதுடனான இணை அமைப்பையும் காக்கிறது.
