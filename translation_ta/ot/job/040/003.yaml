  text: וַ/יַּ֖עַן אִיּ֥וֹב אֶת יְהוָ֗ה וַ/יֹּאמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/003.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: ta
  text: அப்போது யோபு யாவேவுக்குப் பதிலளித்துச் சொன்னான்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய உரை: ‘YHWH’; இதை ‘யாவே’ அல்லது ‘யெகோவா’ என்றும் ஒலிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாகச் சொன்னது
  rationale: ענה என்பதன் Qal wayyiqtol வடிவம் யோபின் பதிலை அறிமுகப்படுத்துகிறது. அடுத்துள்ள וַיֹּאמַר உடன் சேர்ந்து வரும் எபிரேயப் பேச்சு அறிமுக மரபை, இயல்பான தமிழில் இரு வினைகளின் பொருளும் உள்ளவாறு மொழிபெயர்க்கிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் வேற்றுமை உருபால் அதன் பணி வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் Qal wayyiqtol வடிவம். வַיַּעַן உடன் இணைந்துள்ள ‘மறுமொழி அளித்து சொன்னான்’ என்ற மூல அமைப்பை இயல்பான தமிழ்ப் பேச்சு அறிமுகமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; மாற்று வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தின் இரட்டை பேச்சு அறிமுக வினைகளைச் சொல்லுக்குச் சொல் கடினமாகப் பிரதிபலிக்காமல், ‘மறுமொழியாகச் சொன்னது’ என இயல்பாக இணைக்கிறது; அடுத்த வசனங்களில் வரும் நேரடி உரைக்கு ஏற்ற வகையில் நடுநிலை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
