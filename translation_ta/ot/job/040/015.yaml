reference: Job 40:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: ta
  text: இதோ, உன்னோடு சேர்த்து நான் படைத்த பெஹேமோத்தை[a] இப்போது பார்; அது மாட்டைப் போலப் புல் தின்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த விலங்கை.” ‘பெஹேமோத்’ என்பது ஒரு குறிப்பிட்ட மகத்தான உயிரினத்தின் பெயர் அல்லது அடையாளச் சொல் என்று பலர் கருதுகின்றனர்; வேறு சிலர் இதை நீர்யானை அல்லது வேறொரு பெரிய விலங்குடன் அடையாளப்படுத்துகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ ... இப்போது பார்
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சொல்லாகவும், נָא இச்சூழலில் உடனடியான கவனத்தை வலியுறுத்துவதாகவும் உள்ளது. நவீனத் தமிழில் இயல்பாகவும் வலிமையாகவும் இருக்க இரண்டும் இந்த அமைப்பில் வழங்கப்பட்டுள்ளன.
- source_word: בְהֵמוֹת
  choice: பெஹேமோத்
  rationale: இச்சொல் பொதுவாக விலங்குகளைக் குறிக்கும் சொல்லோடு தொடர்புடையதாயினும், இப்பகுதியில் ஒரு குறிப்பிட்ட மகத்தான உயிரினத்தின் பெயர் அல்லது தனிப்பட்ட அடையாளச் சொல்லாகச் செயல்படுகிறது. அதன் உயிரியல் அடையாளத்தை முடிவுசெய்யாமல் இருக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר עָשִׂיתִי עִמָּךְ
  choice: உன்னோடு சேர்த்து நான் படைத்த
  rationale: עשה என்பதன் எளிய பொருளான ‘படைத்த’ என்பதும், עם குறிக்கும் உடனிணைவு அல்லது படைப்பில் சேர்ந்த நிலை என்பதும் காக்கப்படுகின்றன. மனிதன் பெஹேமோத்தைப் படைப்பதில் பங்குபெற்றான் என்ற தவறான பொருள் வராதபடி சொல் வரிசை அமைக்கப்பட்டுள்ளது.
- source_word: חָצִיר
  choice: புல்
  rationale: இது புல் அல்லது பசுந்தாவர உணவைக் குறிக்கிறது; இங்கு ‘புல்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: כַבָּקָר
  choice: மாட்டைப் போல
  rationale: בקר மாடு அல்லது மாட்டினத்தைக் குறிக்கலாம். ஒப்புமையை இயல்பான ஒருமை வடிவில் வழங்க ‘மாட்டைப் போல’ தேர்ந்தெடுக்கப்பட்டது; ‘காளை’ என்பது தேவையற்ற வகையில் குறிப்பானது.
- source_word: יֹאכֵל
  choice: அது ... தின்கிறது
  rationale: எபிரெய வினை ஆண்பால் ஒருமையில் இருந்தாலும், தமிழில் விலங்கைக் குறிக்கும் இயல்பான இடப்பெயர் ‘அது’. ஆண்பால் வடிவத்தைச் செயற்கையாகத் திணிக்காமல், தொடர்ந்து நடைபெறும் உணவுப் பழக்கத்தை நிகழ்காலம் தெரிவிக்கிறது.
theological_decisions:
- issue: בְהֵמוֹת என்பதன் அடையாளம்
  choice: ஒரு குறிப்பிட்ட உயிரினத்தின் பெயர் அல்லது அடையாளச் சொல்லாகக் கருதி ‘பெஹேமோத்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘அந்த விலங்கு’ என்று பொதுப்பெயராக மொழிபெயர்த்தல், அல்லது ‘நீர்யானை’ போன்ற அறியப்பட்ட விலங்காகத் திட்டவட்டமாக அடையாளப்படுத்தல்
  rationale: கவிதைச் சூழல் ஒரு தனித்துவமான மகத்தான உயிரினத்தை முன்வைக்கிறது; ஆனால் அது எந்த உயிரினம் என்பதை இவ்வசனம் தெளிவாக நிர்ணயிக்கவில்லை. ஒலிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இலக்கிய வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ ... இப்போது பார்’ என்பது தெய்வீக உரையின் நேரடியான கவன ஈர்ப்பை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் [a] என இடம்பெற்றுள்ளது.
