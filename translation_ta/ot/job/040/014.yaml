source:
  edition: WLC
  text: וְ/גַם אֲנִ֥י אוֹדֶ֑/ךָּ כִּֽי תוֹשִׁ֖עַ לְ/ךָ֣ יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: ta
  text: அப்போது நானும்கூட உன்னைப் புகழ்வேன்; ஏனெனில் உன் வலது கை உன்னைக் காப்பாற்ற முடியும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்காகக் காப்பாற்ற முடியும்” அல்லது “உன்னையே காப்பாற்ற முடியும்”; எபிரேயத்தில் “உனக்கு/உனக்காக” என்ற நன்மைப் பொருளுடைய முன்னிடைச்சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: அப்போது நானும்கூட
  rationale: முந்தைய சவாலின் விளைவைத் தொடர்ச்சியுடனும் வலியுறுத்தலுடனும் காட்டுகிறது; வெளிப்படையாக உள்ள אֲנִי என்பதன் அழுத்தத்தையும் ‘நானும்கூட’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: אוֹדְךָ
  choice: உன்னைப் புகழ்வேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் புகழ்தல் அல்லது பாராட்டுதல் என்ற பொருளைத் தருகிறது; யோபின் ஆற்றலைக் கடவுள் ஒப்புக்கொள்வதாக அமைந்துள்ள சவாலுக்கு ‘புகழ்வேன்’ பொருத்தமானது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: תוֹשִׁיעַ
  choice: மீட்க முடியும்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்று/மீட்டு’ என்று பொருள்படும். முந்தைய நிபந்தனை சார்ந்த சவாலின் சூழலில், செயலை நிறைவேற்றும் திறனை ‘முடியும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְךָ
  choice: உன்னை
  rationale: לְ நன்மை அல்லது சாதகப் பொருளைக் குறிக்கலாம்; தமிழின் இயல்பான நேர்செயப்படுபொருள் அமைப்பு ‘உன்னை மீட்க’ எனத் தரப்படுகிறது. ‘உனக்காக/உன்னையே’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְמִינְךָ
  choice: உன் வலக்கை
  rationale: வலிமையைக் குறிக்கும் எபிரேய உருவகத்தை விளக்கமாக மாற்றாமல், மூலத்தின் தெளிவான உடல்-உருவகத்தையே தக்கவைக்கிறது.
theological_decisions:
- issue: வல்லமையைக் குறிக்கும் மனிதவடிவ உருவகம்
  choice: உன் வலக்கை உன்னை மீட்க முடியும்
  alternative: உன் சொந்த வலிமை உன்னை மீட்க முடியும்
  rationale: மூல எபிரேயம் ‘வலக்கை’ என்ற திடமான உருவகத்தைப் பயன்படுத்துகிறது. அதை ‘வலிமை’ என்று விளக்கி விடாமல் பிரதான உரையில் பாதுகாப்பது மூலத்தின் படிமத்தையும் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வலக்கை’ என்ற வேதாகமப் படிமம் தக்கவைக்கப்பட்டு, வாக்கியத்தின் சவால் சார்ந்த தொனிக்காக ‘அப்போது’ மற்றும் திறனை உணர்த்த ‘முடியும்’ பயன்படுத்தப்பட்டுள்ளன.
