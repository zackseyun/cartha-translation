  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: ta
  text: என் வாழ்வு ஒரு மூச்சு[a] என்பதை நினைவில் கொள்க; என் கண் மீண்டும் நன்மையைக் காணாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வாழ்வு காற்று.” எபிரெயச் சொல் “மூச்சு,” “காற்று,” அல்லது “ஆவி” எனப் பொருள்படலாம்; இங்கு அது வாழ்வின் நிலையாமையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “நன்மையைக் காண என் கண் திரும்பாது”; அதாவது, நான் இனி நல்வாழ்வையோ செழிப்பையோ அனுபவிக்கமாட்டேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவில் கொள்ளும்
  rationale: இது கடவுளை நோக்கிக் கூறப்படும் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை. நவீனத் தமிழில் வேண்டுகோளின் மரியாதையையும் நேரடியான கட்டளையின் வலிமையையும் இயல்பாகத் தருகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: நினைவில் கொள்ள வேண்டிய கருத்தை அறிமுகப்படுத்தும் உள்ளடக்க இணைப்பாக இங்கு வருகிறது.
- source_word: רוּחַ
  choice: மூச்சு
  rationale: רוּחַ என்பதற்கு ‘மூச்சு,’ ‘காற்று,’ ‘ஆவி’ என்ற பொருள்கள் உண்டு. இப்புலம்பலில் வாழ்வின் நிலையாமையையும் கணநேரத் தன்மையையும் ‘மூச்சு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַיָּי
  choice: என் வாழ்வு
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் வந்துள்ள ‘வாழ்வு’ என்பதன் இயல்பான தமிழாக்கம்.
- source_word: לֹא תָשׁוּב
  choice: மீண்டும் … காணாது
  rationale: ‘திரும்பாது’ என்ற அடிப்படை உருவகத்தைச் சொற்சொல்லாக வைத்தால் தமிழில் இயல்பற்றதாகும். இங்கு திரும்பிக் காணுதல் என்பது மறுபடியும் காணுதலைக் குறைப்பதால் ‘மீண்டும் … காணாது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரெய உரை ஒருமையில் இருப்பதால் அதன் கவிதைநடையைப் பாதுகாக்க ஒருமையே வைக்கப்பட்டது.
- source_word: לִרְאוֹת
  choice: காண
  rationale: ראה என்ற வினையின் அடிப்படைப் பொருளையும், நேரடியாகக் காணுதல் மற்றும் அனுபவித்தல் ஆகிய இரு சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: טוֹב
  choice: நன்மை
  rationale: טוֹב என்பது நன்மை, நல்வாழ்வு, செழிப்பு எனப் பரந்த பொருள் தரக்கூடும். ‘நன்மை’ அந்தப் பொருள் அகலத்தை மிகையாகக் குறுக்காமல் காக்கிறது.
