  text: so that my soul chooses strangling[b][a], death rather than my bones.
translation:
  language: ta
  text: என் உயிர் கழுத்து நெரித்தலையும்[a], என் எலும்புகளைவிட மரணத்தையும் தேர்ந்துகொள்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூச்சுத்திணறலையும்’ அல்லது ‘மூச்சடைத்துச் சாவதையும்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘என் எலும்புகளிலிருந்து மரணம்.’ இங்கு ‘என் எலும்புகளைவிட மரணம்’ என்ற ஒப்பீட்டுப் பொருள் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; துன்புறும் உடல் நிலையில் தொடர்வதைவிட மரணத்தை அவர் விரும்புகிறார் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: தேர்ந்துகொள்கிறது
  rationale: בחר என்பதன் அடிப்படைப் பொருள் ‘தேர்ந்துகொள்.’ கவிதை ஓட்டத்தில் எபிரெய வினை வடிவத்தை நிகழ்கால உணர்வுடன் இயல்பாகத் தருகிறது; ‘தேர்ந்துகொள்ளும்’ என்பதும் சூழல்சார் மாற்றாகும்.
- source_word: מַחֲנָק
  choice: கழுத்து நெரிக்கப்பட்டுச் சாவது
  rationale: இந்தப் பெயர்ச்சொல் கழுத்து நெரித்தல், மூச்சுத்திணறல் ஆகிய பொருள்களைக் கொண்டது. தமிழில் கடுமையான உடல்சார் படிமத்தைத் தெளிவாகவும் இயல்பாகவும் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: נֶפֶשׁ என்பது உயிர், ஆள், தன், ஆன்மா எனச் சூழலுக்கேற்ப பொருள்படும். இங்கு மரணத்தை நாடும் யோபுவின் உயிரையே குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘உயிர்’; ‘ஆத்துமா’ என்று தேவையின்றி தனிப் பொருளாக்குவதை இது தவிர்க்கிறது.
- source_word: מָוֶת
  choice: மரணம்
  rationale: מָוֶת என்பதற்கான நேரடியான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: מֵעַצְמוֹתָי
  choice: இந்த எலும்புகளோடு வாழ்வதைவிட
  rationale: சொல்லர்த்தமாக ‘என் எலும்புகளிலிருந்து/என் எலும்புகளைவிட.’ מן இங்கு ஒப்பீட்டுப் பொருளில் புரிந்துகொள்ளப்படுகிறது. ‘எலும்புகள்’ என்ற மூலப் படிமத்தைத் தக்கவைத்து, துன்புற்ற உடல்நிலையில் தொடர்ந்து வாழ்வதைக் காட்ட தமிழில் குறைந்த அளவு வெளிப்படுத்தப்பட்டுள்ளது.
