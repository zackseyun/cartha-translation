translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் கடுமையான கவிதைப் படிமத்தையும் எபிரெய வாசகத்தின் சுருக்கத்தையும் இயன்றவரை தக்கவைத்துள்ளது. ‘என் உயிர்’ என்பது பொதுவாசகருக்கு இயல்பானது; ‘இந்த எலும்புகளோடு வாழ்வதைவிட’ என்பது தெளிவுக்கான அளவான விரிவாக்கம்.
