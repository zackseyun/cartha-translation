  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: ta
  text: நான் பாவம் செய்திருந்தால்[a], மனிதகுலத்தைக் கண்காணிப்பவரே, உமக்கு நான் என்ன செய்ய முடியும்? ஏன் என்னை உமது இலக்காக வைத்தீர்[b], அதனால் எனக்கே நான் ஒரு சுமையாகிவிட்டேன்?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பாவம் செய்தேன்.” எபிரெய வடிவம் நேரடியாக இவ்வாறு உள்ளது; சூழல் அதை விட்டுக்கொடுப்பு அல்லது நிபந்தனை நயமுள்ள கூற்றாகப் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “ஏன் என்னை உமக்கான ஓர் இலக்காக வைத்தீர்?”
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மசோரா உரை, “எனக்கே ஒரு சுமை” என்று வாசிக்கிறது; சில பழங்கால மொழிபெயர்ப்புகள், “உமக்கு ஒரு சுமை” என்ற வாசகத்தைப் பிரதிபலிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்திருந்தால்
  rationale: இது வடிவத்தில் முதலாம் நபர் ஒருமை நிறைவுவினை, ‘நான் பாவம் செய்தேன்.’ ஆனால் யோபின் வாதமுறைச் சூழலில் நிபந்தனை அல்லது விட்டுக்கொடுப்பு நயம் உள்ளது; அதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘செய்திருந்தால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מָה אֶפְעַל לָךְ
  choice: உமக்கு நான் என்ன செய்ய முடியும்?
  rationale: கடவுளைத் தன்னுடைய செயல் எவ்வாறு பாதிக்க முடியும் என்ற இயலாமையை வலியுறுத்தும் வினாவாக இருப்பதால், ‘என்ன செய்வேன்?’ என்பதைக் காட்டிலும் ‘என்ன செய்ய முடியும்?’ என்பது சூழலின் வாதநயத்தைத் தெளிவாகக் காக்கிறது.
- source_word: נֹצֵר הָאָדָם
  choice: மனிதகுலத்தைக் கண்காணிப்பவரே
  rationale: נֹצֵר என்பது காத்தல், கவனித்தல், உற்றுநோக்குதல் ஆகிய பொருள் நயங்களைக் கொண்டது. குற்றச்சாட்டுச் சூழலில் பாதுகாப்புக்கும் இடைவிடாத கண்காணிப்புக்கும் இடையிலான தெளிவின்மையை ‘கண்காணிப்பவர்’ காக்கிறது. הָאָדָם இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: ஏன் என்னை உமது இலக்காக வைத்தீர்?
  rationale: מִפְגָּע என்பது தாக்கப்படும் பொருள் அல்லது இலக்கு என்ற கருத்தைக் கொண்டது. לָךְ என்பதைக் ‘உமது’ என்ற இயல்பான உடைமை வடிவில் இணைத்துள்ளோம்.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: அதனால் எனக்கே நான் ஒரு சுமையாகிவிட்டேன்
  rationale: மசோரா உரையின் עָלַי இயல்பாக ‘எனக்கு/என்மீது’ என்று பொருள்படுவதால், கடினமான ஆனால் நன்கு ஆதரிக்கப்படும் ‘எனக்கே சுமை’ என்ற வாசகம் முதன்மை உரையில் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: הָאָדָם என்ற பொதுமைப் பெயரின் மொழிபெயர்ப்பு
  choice: மனிதகுலம்
  alternative: மனிதன்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு மனித இனத்தைப் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘மனிதகுலம்’ பாலினத் தவறான புரிதலைத் தவிர்த்து, அந்தப் பொதுமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- issue: חָטָאתִי என்பதை ஒப்புக்கொள்ளலாகவா நிபந்தனையாகவா மொழிபெயர்ப்பது
  choice: நான் பாவம் செய்திருந்தால்
  alternative: நான் பாவம் செய்தேன்
  rationale: எபிரெய வடிவம் நேரடியான நிறைவுவினையாக இருந்தாலும், இச்சூழலில் யோபு வாதரீதியாகக் கேட்பதால் நிபந்தனை நயம் சாத்தியம். தமிழில் அந்த உரையாடல் வலிமையைப் பாதுகாக்க நிபந்தனை வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- issue: עָלַי மற்றும் பழங்கால மாற்று வாசகம்
  choice: எனக்கே நான் ஒரு சுமையாகிவிட்டேன்
  alternative: உமக்கு நான் ஒரு சுமையாகிவிட்டேன்
  rationale: மசோரா உரை ‘எனக்கு/என்மீது’ என்ற வாசகத்தை ஆதரிக்கிறது. சில பழங்கால மொழிபெயர்ப்புகள் ‘உமக்கு’ என்று பிரதிபலிப்பதால், அந்த மாற்று உரை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது; முதன்மை உரையில் கலக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபின் வேதனையும் எதிர்வினாவும் காக்கப்படும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உமக்கு/உமது/வைத்தீர்’ என்ற மரியாதை ஒருமை தொடர்ச்சியாகப் பேணப்பட்டுள்ளது. ‘கண்காணிப்பவர்’ என்பது பாதுகாப்பவர் மற்றும் கூர்ந்து உற்றுநோக்குபவர் என்ற இரு நயங்களையும் முழுமையாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
