  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: ta
  text: அவ்வாறே, பயனற்ற மாதங்கள்[a] எனக்குப் பங்காக அளிக்கப்பட்டுள்ளன; துன்பம் நிறைந்த இரவுகள்[b] எனக்கெனக் குறிக்கப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயனற்ற மாதங்கள்” என்பதற்கு “வெறுமையான மாதங்கள்” அல்லது “வீணான மாதங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “துன்பம் நிறைந்த இரவுகள்” என்பதற்கு “தொல்லை நிறைந்த இரவுகள்,” “துயரமான இரவுகள்,” அல்லது “கடின உழைப்பின் இரவுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்திலுள்ள ஒப்புமையிலிருந்து யோபுவின் சொந்த அனுபவத்துக்குச் செல்லும் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: הָנְחַ֣לְתִּי לִי
  choice: எனக்குப் பங்காக அளிக்கப்பட்டுள்ளன
  rationale: வினையின் பெறுபவர் யோபு என்பதையும், இந்தக் காலப்பகுதி அவரது விருப்பமின்றி அவருக்குரிய பங்காக ஆக்கப்பட்டதையும் செயப்பாட்டு வடிவில் வெளிப்படுத்துகிறது.
- source_word: יַרְחֵי שָׁוְא
  choice: பயனற்ற மாதங்கள்
  rationale: שָׁוְא இங்கு வெறுமை, வீண் தன்மை, பயனின்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. நீண்டகால வேதனையின் பயனற்ற தன்மையை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְלֵילוֹת עָמָל
  choice: துன்பம் நிறைந்த இரவுகள்
  rationale: עָמָל என்பதன் உழைப்பு, தொல்லை, துயரம் ஆகிய பொருள் வரம்புகளில், யோபுவின் இரவுநேர வேதனைக்கு ஏற்ற அனுபவப் பொருளைத் தெரிவிக்கிறது.
- source_word: מִנּוּ לִי
  choice: எனக்கெனக் குறிக்கப்பட்டுள்ளன
  rationale: அந்த இரவுகள் யோபுவுக்காக நியமிக்கப்பட்டவை அல்லது பங்கிடப்பட்டவை என்ற செயப்பாட்டு அர்த்தத்தைப் பாதுகாக்கிறது; முதல் அரையடியின் சொல்லாட்சியை அப்படியே மீண்டும் கூறுவதையும் தவிர்க்கிறது.
