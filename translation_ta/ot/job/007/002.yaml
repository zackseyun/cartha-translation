  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: ta
  text: நிழலுக்காக ஏங்கும் அடிமையைப் போலவும்[a], தன் கூலிக்காகக் காத்திருக்கும் கூலித் தொழிலாளியைப் போலவும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமை’ என்பதற்குப் பதிலாக ‘பணியாள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இரு பொருள்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கூலி’ என்பதற்குப் பதிலாக ‘ஊதியம்’ அல்லது ‘உழைப்பின் பலன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֶבֶד
  choice: அடிமையைப் போல
  rationale: עֶבֶד என்பது பணியாளரையோ அடிமையையோ குறிக்கலாம். கடுமையான உழைப்பும் சமூகக் கட்டுப்பாடும் முன்னிலையில் இருப்பதால், இங்கு ‘அடிமை’ மூலச்சொல்லின் வலிமையைச் சிறப்பாகத் தக்கவைக்கிறது.
- source_word: יִשְׁאַף
  choice: ஏங்கும்
  rationale: שׁאף தீவிரமாக விரும்புதல், மூச்சிரைத்துத் தேடுதல் போன்ற உணர்வைக் கொண்டது. ‘ஏங்கும்’ என்பது அந்தத் தீவிர விருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צֵל
  choice: நிழல்
  rationale: இங்கு צֵל வெயிலிலிருந்து கிடைக்கும் இளைப்பாறுதலைக் குறிக்கிறது. ‘நிழல்’ என்பது தமிழில் இயல்பாகவே அந்தப் பொருளைத் தருகிறது.
- source_word: וּכְשָׂכִיר
  choice: கூலித் தொழிலாளியைப் போலவும்
  rationale: שָׂכִיר என்பது கூலிக்கு அமர்த்தப்பட்ட தொழிலாளி. ‘கூலித் தொழிலாளி’ அதன் பொருளாதார நிலையையும் வேலை உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: יְקַוֶּה
  choice: காத்திருக்கும்
  rationale: קוה என்பது காத்திருத்தல் அல்லது நம்பிக்கையுடன் எதிர்பார்த்தல் எனப் பொருள்படும். உழைப்புக்குரிய கூலியை எதிர்பார்க்கும் சூழலில் ‘காத்திருக்கும்’ பொருத்தமானது.
- source_word: פָעֳלוֹ
  choice: தன் கூலிக்காக
  rationale: פעל என்பது வேலை, அதன் பலன் அல்லது அதற்கான ஊதியம் ஆகியவற்றைக் குறிக்கலாம். கூலித் தொழிலாளி என்ற இணைப்பில், இங்கு உழைப்புக்குரிய ‘கூலி’ என்பதே இயல்பான பொருள்.
