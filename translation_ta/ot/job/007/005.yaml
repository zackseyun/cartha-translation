source:
  edition: WLC
  text: לָ֘בַ֤שׁ בְּשָׂרִ֣/י רִ֭מָּה ו/גיש עָפָ֑ר עוֹרִ֥/י רָ֝גַ֗ע וַ/יִּמָּאֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/005.yaml
  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: ta
  text: என் சதை புழுக்களையும் தூசிக் கட்டிகளையும் ஆடையாக அணிந்துள்ளது; என் தோல் இறுகி[a], பின்னர் மீண்டும் வெடிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தோல் மூடிக்கொண்டு, பின்னர் மீண்டும் சீழ்பிடிக்கிறது.” கடைசி இரண்டு எபிரெய வினைச்சொற்களின் பொருள் தெளிவில்லை; தோல் சிறிது நேரம் ஆறி மூடியபின் மீண்டும் வெடிப்பதை இவ்வரி விவரிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: ஆடையாக அணிந்திருக்கிறது
  rationale: ‘உடுத்துதல்/அணிதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, சதையைப் புழுக்களும் மண் கட்டிகளும் மூடியிருக்கும் கொடூரமான காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּשָׂרִי
  choice: என் சதை
  rationale: உடல் என்பதைக் காட்டிலும் மூலத்தின் நேரடியான உடல்சார் தீவிரத்தை ‘சதை’ தக்கவைக்கிறது.
- source_word: רִמָּה
  choice: புழுக்கள்
  rationale: அழுகலுடன் தொடர்புடைய புழுக்கள் அல்லது குடம்புழுக்களைக் குறிக்கும் பொதுவான சொல்; தேவையற்ற வகைத் துல்லியத்தைத் தவிர்க்கிறது.
- source_word: גיש עפר
  choice: மண் கட்டிகள்
  rationale: அரிய முதல் சொல்லின் ‘திரள்/கட்டி’ என்ற சாத்தியமான பொருளையும் עפר என்பதன் ‘மண்/தூசி’ என்ற பொருளையும் இயல்பாக இணைக்கிறது.
- source_word: עוֹרִי
  choice: என் தோல்
  rationale: மனித உடலுக்குரிய வழக்கமான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: רָגַע
  choice: இறுகி
  rationale: நோயுற்ற தோல் சிறிது நேரம் இழுத்து மூடிக்கொள்வதையோ கடினமாவதையோ குறிக்கக்கூடிய சூழல்சார் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது; எபிரெய வினையின் சிரமம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיִּמָּאֵס
  choice: மறுபடியும் வெடிக்கிறது
  rationale: உடல்சார் சூழலில் தோல் மீண்டும் திறந்து புண்ணாவதாகப் பலர் புரிந்துகொள்ளும் பொருளை அளிக்கிறது; வினையின் நிச்சயமற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
