translation_notes:
  register: நவீன நிலையான தமிழில், யோபின் உடல் வேதனையின் தீவிரத்தையும் மூலத்தின் ஆடை உருவகத்தையும் தக்கவைக்கும் கண்ணியமான நடை. கடைசி இரு வினைகளின் உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
