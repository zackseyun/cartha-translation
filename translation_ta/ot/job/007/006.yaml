  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: ta
  text: என் நாட்கள் நெசவாளரின் ஓடக்கட்டையைவிட வேகமாகச் செல்கின்றன; அவை நம்பிக்கையின்றி முடிவுக்கு வருகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; யோபு தன் வாழ்நாட்களை நாள் நாளாக அனுபவிப்பதையும் காக்கிறது.
- source_word: קַלּוּ
  choice: வேகமாகக் கடந்து
  rationale: קלל என்பதன் இச்சூழலுக்குரிய ‘விரைவாக இரு/செல்’ என்ற பொருளை இயல்பான தமிழில் வினைமுறையாக வழங்குகிறது; מן குறிக்கும் ஒப்பீடு ‘-விட’ என்பதால் வெளிப்படுகிறது.
- source_word: מִנִּי אָרֶג
  choice: நெசவாளரின் ஓடக்கட்டையைவிட
  rationale: אֹרֵג வடிவம் சொற்பொருளில் ‘நெசவாளர்’ எனவும் புரியக்கூடும்; ஆயினும் வேகத்தை மையப்படுத்தும் உருவகத்தில் தறியில் விரைந்து ஓடும் shuttle-ஐக் குறிப்பதாக மரபாகப் புரிந்துகொள்ளப்படுகிறது. தமிழில் அதற்குரிய தெளிவான சொல் ‘ஓடக்கட்டை’.
- source_word: וַיִּכְלוּ
  choice: முடிந்துபோகின்றன
  rationale: כלה என்பதன் ‘முற்றுப்பெறு, முடிவுக்கு வா’ என்ற பொருளை, வாழ்நாட்கள் தீர்ந்துபோவதைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: நம்பிக்கையின்றி
  rationale: אֶפֶס குறிக்கும் முற்றான இன்மையையும் תִּקְוָה குறிக்கும் நம்பிக்கையையும் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் யோபுவின் நம்பிக்கையற்ற புலம்பலின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘ஓடக்கட்டை’ என்பது நெசவுத் தறியின் shuttle-ஐக் குறிக்கும் துல்லியமான தமிழ்ச்சொல்; வாசகர்களுக்கான சாத்தியமான எபிரெயச் சொற்பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
