  source_fidelity: 'மூல எபிரெயத்தின் முக்கியக் கூறுகள் நன்றாகப் பிரதிபலிக்கப்படுகின்றன: “என் நாட்கள்,” நெசவுக் கருவியைவிட வேகம், மற்றும் நம்பிக்கையற்ற முடிவு. ஆயினும், இரண்டு வினைநிலைகளையும் கமாவால் இணைப்பதைவிடத் தனித்த வாக்கியங்களாக அமைப்பது மூலத்தின் தொடர்ச்சியையும் தமிழின் தெளிவையும் மேம்படுத்தும்.'
