  text: When I say[a], ‘My bed will comfort me[b]; my couch will bear my complaint,’
translation:
  language: ta
  text: “என் படுக்கை என்னைத் தேற்றும்; என் படுக்குமிடம் என் புலம்பலைத் தாங்கும்” என்று நான் சொல்லும்போது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஏனெனில் நான் சொன்னேன்” அல்லது “நான் சொன்னால்.” இங்குள்ள எபிரெய כִּי என்பதற்குப் பலவாறு பொருள் கொள்ளலாம்; உடனடிச் சூழலுக்கும் அடுத்த வசனத்திற்குச் செல்லும் கருத்தோட்டத்திற்கும் “நான் சொல்லும்போது” என்பது நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: சொல்லும்போது
  rationale: இங்கு כִּי என்பது யோபின் எண்ணத்தை அடுத்த வசனத்துடன் இணைக்கும் காலச் சூழலைக் குறிக்கலாம். ஆகவே இயல்பான தமிழில் ‘என்று சொல்லும்போது’ என மொழிபெயர்க்கப்பட்டது; காரண அல்லது நிபந்தனைப் பொருள்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אָמַרְתִּי
  choice: நான் ... என்று சொல்லும்போது
  rationale: எபிரெய வடிவம் முற்றுப்பெற்ற செயலைக் குறித்தாலும், சூழலில் யோபு மீண்டும் மீண்டும் அல்லது தற்போது தனக்குள் சொல்லிக்கொள்வதைத் தமிழ் நிகழ்கால அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּנַחֲמֵנִי
  choice: என்னைத் தேற்றும்
  rationale: נחם என்பதன் பியேல் வடிவம் ஆறுதல் அல்லது தேற்றுதல் என்ற பொருளைக் கொண்டது. துன்பத்திலிருந்து கிடைக்கும் ஆறுதலை ‘தேற்றும்’ என்பது சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַרְשִׂי
  choice: என் படுக்கை
  rationale: עֶרֶשׂ என்பது படுக்கை அல்லது மஞ்சத்தைக் குறிக்கும். அடுத்த இணைச்சொல்லிலிருந்து சிறு வேறுபாட்டைப் பேண ‘படுக்கை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יִשָּׂא
  choice: தாங்கும்
  rationale: נשא என்பதன் அடிப்படைப் பொருள் தூக்குதல், சுமத்தல் அல்லது தாங்குதல். யோபின் புலம்பலை ஒரு சுமையாகக் காட்டும் உருவகத்தை ‘தாங்கும்’ பேணுகிறது.
- source_word: בְשִׂיחִי
  choice: என் புலம்பலை
  rationale: שִׂיחַ சிந்தனை, தியானம் அல்லது புலம்பல் நிறைந்த பேச்சைக் குறிக்கலாம். யோபின் துன்பச் சூழலில் ‘புலம்பல்’ மிகவும் பொருத்தமானது; பிற வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מִשְׁכָּבִי
  choice: என் படுக்குமிடம்
  rationale: מִשְׁכָּב என்பது படுக்கும் இடம் அல்லது படுக்கையைக் குறிக்கும். கவிதை இணைத்தன்மையையும் அருகிலுள்ள עַרְשִׂי என்பதுடனான சொல் வேறுபாட்டையும் பேண ‘படுக்குமிடம்’ தேர்ந்தெடுக்கப்பட்டது.
