translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யோபின் கவிதைநடையின் கண்ணியத்தைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘படுக்கை / படுக்குமிடம்’ என்ற அருகிய இணைச்சொற்கள் எபிரெயக் கவிதை இணைத்தன்மையை வெளிப்படுத்துகின்றன. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
