lexical_decisions:
- source_word: יָשׁוּב
  choice: திரும்பமாட்டான்
  rationale: שׁוב என்பதன் வழக்கமான பொருள் ‘திரும்புதல்.’ மறுப்புடன் சேர்ந்து, இறந்தவன் தன் வழக்கமான வாழ்க்கைக்கும் வீட்டிற்கும் மீண்டும் வராததை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: עוֹד (முதல் இடம்)
  choice: இனி
  rationale: மறுப்புடன் வரும் עוֹד, இனிமேல் நிகழாததைக் குறிக்கிறது. ‘இனி ... திரும்பமாட்டான்’ என்பது தமிழில் இயல்பாகவும் எபிரெய காலப் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: לְבֵיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு.’ உடைமையைக் குறிக்கும் எபிரெய வடிவத்தைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘தன் வீட்டுக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַכִּירֶנּוּ
  choice: அவனை அறியாது
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் ‘அறிதல்,’ ‘அடையாளம் காணுதல்,’ அல்லது ‘ஏற்றுக்கொள்ளுதல்’ என்ற பொருட்களைத் தரலாம். இடத்தை மனிதப் பண்புடன் காட்டும் எபிரெயக் கவிதை உருவகத்தை ‘அவனை அறியாது’ என்பது சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עוֹד (இரண்டாம் இடம்)
  choice: இனி
  rationale: இங்கும் மறுப்புடன் வரும் עוֹד, அந்த இடம் அவனை இனிமேல் அறியாத நிலையைச் சுட்டுகிறது.
- source_word: מְקֹמוֹ
  choice: அவனுடைய இடம்
  rationale: מָקוֹם என்பதன் அடிப்படைப் பொருள் ‘இடம்.’ அவனோடு தொடர்புடைய வழக்கமான இடத்தை இது குறிக்கலாம்; ‘அவனுடைய இடம்’ என்பது அதன் கவிதைச் சுருக்கத்தையும் ஆளுருவாக்கத்தையும் காக்கிறது.
