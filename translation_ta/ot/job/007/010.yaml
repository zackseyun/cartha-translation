  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: ta
  text: 'அவன் இனி தன் வீட்டுக்குத் திரும்பமாட்டான்;

    அவனுடைய இடமும் இனி அவனை அறியாது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனை அடையாளம் காணாது” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெய வினைச்சொல் அறிதல், அடையாளம் காணுதல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற பொருட்களைத் தரக்கூடும்.
