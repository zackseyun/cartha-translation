  source_fidelity: மூல எபிரெயத்தின் இரட்டைச் செயற்படிமமான ‘மேகம் கலைந்து/முடிவடைந்து போகிறது’ என்பதையும், அதனைத் தொடர்ந்து வரும் உவமையையும் மொழிபெயர்ப்பு நன்றாகக் காக்கிறது. ‘ஷியோலுக்கு இறங்குகிறவன் மேலே வருவதில்லை’ என்பது יוֹרֵד மற்றும் לֹא יַעֲלֶה ஆகியவற்றின் கீழிறங்குதல்–மேலேவருதல் படிமத்தைத் துல்லியமாகத் தருகிறது. நிகழ்கால வடிவம் எபிரெயத்தின் பொதுவான உண்மைக் கூறலை இயல்பாக வெளிப்படுத்துகிறது.
