  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: ta
  text: மேகம் கலைந்து மறைந்துபோகிறது; அதுபோல, ஷியோலுக்கு[a] இறங்குகிறவன் மேலே வருவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கல்லறைக்கு” அல்லது “இறந்தோரின் உலகத்திற்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: கலைந்து
  rationale: இந்த வினை முடிவுக்கு வருதல் அல்லது தீர்ந்துபோதலைக் குறிக்கிறது. மேகத்தைப் பற்றிய சூழலில், அது வடிவிழந்து இல்லாமற்போவதை இயல்பான தமிழில் “கலைந்து” தெரிவிக்கிறது.
- source_word: עָנָן
  choice: மேகம்
  rationale: மேகம் மறைந்துபோகும் இயல்பான காட்சியே இங்கு உவமையாக இருப்பதால், நேரடியான பெயர்ச்சொல் பொருள் பயன்படுத்தப்பட்டது.
- source_word: וַיֵּלַךְ
  choice: மறைந்துபோகிறது
  rationale: சொல்லளவில் “போயிற்று” என்றாலும், கலைந்த மேகம் காணாமற்போவதே சூழலின் கருத்து. “மறைந்துபோகிறது” அந்த விளைவை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: כֵּן
  choice: அதுபோல
  rationale: மேகத்தின் காட்சியையும் ஷியோலுக்கு இறங்குகிறவனின் நிலையையும் ஒப்பிடும் உவமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יוֹרֵד
  choice: இறங்குகிறவன்
  rationale: எபிரெயப் பங்கேற்புவினை இங்கு பொதுவாக ஒருவரைக் குறிக்கும் பெயர்ச்சொல் செயல்பாட்டில் உள்ளது; “இறங்குகிறவன்” அந்தப் பொதுவான, தொடர்நிலைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: “கல்லறை” அல்லது “இறந்தோரின் உலகம்” என்று பொருளைச் சுருக்கித் தீர்மானிக்காமல், எபிரெயக் கருத்துலகின் தெளிவின்மையைப் பாதுகாக்க மூலச்சொல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לֹא יַעֲלֶה
  choice: மேலே வருவதில்லை
  rationale: இது ஒரு பொதுவான உண்மையைச் சொல்கிறது. “மேலே வருவதில்லை” என்பது “இறங்குகிறவன்” என்பதற்கு எதிரான செங்குத்துத் திசைப் படிமத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: இந்த எபிரெயச் சொல் கல்லறை, கீழுலகம், அல்லது இறந்தோரின் நிலை/உலகம் ஆகியவற்றோடு தொடர்புடைய பரந்த கருத்தைக் கொண்டிருக்கலாம். அதை “ஷியோல்” என்று ஒலிபெயர்ப்பது, உரை தானாகத் தீர்மானிக்காத பொருளை மொழிபெயர்ப்பு தீர்மானித்துவிடுவதைத் தவிர்க்கிறது. இச்சூழலில் யோபு மனித அனுபவத்தின் பார்வையில் மரணத்தின் மீளாமையைப் பேசுகிறார்; உயிர்த்தெழுதலைப் பற்றிய முழுமையான கோட்பாட்டை இவ்வசனம் மட்டும் முன்வைக்கிறது என்று மொழிபெயர்ப்பு கூறவில்லை.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் மேகம்–இறங்குதல்–மேலே வருதல் ஆகிய படிமங்களும், ஷியோல் என்ற சொல்லின் கருத்துத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
