review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the paired sin terms, the burial-in-dust image, and the final statement of disappearance. However, ‘இப்போதே’ does not clearly express the causal force of כִּי (‘for/because’), and ‘படுத்துக்கொள்வேன்’ can suggest a voluntary act rather than the impending state of death conveyed by the poetic image.
  naturalness: The respectful singular address is appropriate and the verse is generally fluent. Adding an explicit causal connector and using ‘படுத்திருப்பேன்’ makes the Tamil sequence more natural and better suited to the death imagery.
  terminology: ‘மீறுதல்’ and ‘அக்கிரமம்’ suitably retain the distinction between פשע and עון. ‘தீவிரமாகத் தேடுவீர்’ is a more direct modern-standard equivalent for the intensive sense of שׁחר than ‘ஆவலுடன் தேடுவீர்,’ which can imply mere eagerness.
  issues:
  - severity: medium
    issue: The causal force of כִּי is omitted.
    rationale: '‘இப்போதே நான்...’ conveys time but not the stated reason: Job asks for pardon because he is about to lie in the dust. ‘ஏனெனில், இப்போது...’ retains both the causal and temporal elements.'
  - severity: low
    issue: ‘படுத்துக்கொள்வேன்’ may imply voluntary self-placement.
    rationale: In this context the phrase is poetic imagery for impending death and burial. ‘புழுதியில் படுத்திருப்பேன்’ better communicates the resulting condition without paraphrasing it as death.
  - severity: low
    issue: ‘ஆவலுடன்’ is somewhat less precise for the intensive seeking sense.
    rationale: The Piel verb can retain an early-seeking nuance, but in context it denotes earnest/diligent seeking. ‘தீவிரமாகத் தேடுவீர்’ communicates this naturally.
  revised_text: என் மீறுதலை ஏன் மன்னிக்காமல் இருக்கிறீர்? என் அக்கிரமத்தை ஏன் அகற்றாமல் இருக்கிறீர்? ஏனெனில், இப்போது நான் புழுதியில் படுத்திருப்பேன்; நீர் என்னைத் தீவிரமாகத் தேடுவீர்[a], ஆனால் நான் இருக்கமாட்டேன்.
