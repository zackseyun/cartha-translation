source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: ta
  text: என் மீறுதலை ஏன் மன்னிக்காமல் இருக்கிறீர்? என் அக்கிரமத்தை ஏன் அகற்றாமல் இருக்கிறீர்? ஏனெனில், இப்போது நான் புழுதியில் படுத்திருப்பேன்; நீர் என்னைத் தீவிரமாகத் தேடுவீர்[a], ஆனால் நான் இருக்கமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீர் என்னை அதிகாலையில் தேடுவீர்.’ எபிரெய வினைச்சொல்லுக்கு அதிகாலை என்ற சாயல் இருக்கலாம்; இங்கு அது தீவிரமாக அல்லது விடாமுயற்சியுடன் தேடுவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: மன்னிக்காமல்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’; மீறுதலைப் பொருளாகக் கொள்ளும்போது அது குற்றத்தை நீக்கி மன்னிப்பதைக் குறிக்கும் மரபுத்தொடராகும்.
- source_word: פִשְׁעִי
  choice: என் மீறுதலை
  rationale: פשע திட்டமிட்ட எல்லைமீறல் அல்லது கலகத்தன்மையுள்ள குற்றத்தைக் குறிக்கலாம்; ‘மீறுதல்’ அதன் தீவிரத்தையும் இணைச் சொல்லிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: וְתַעֲבִיר
  choice: அகற்றாமல்
  rationale: עבר என்பதன் ஹிப்ஃபில் வடிவம் ‘கடந்துபோகச் செய்தல்’ என்பதிலிருந்து ‘அகற்றுதல்’ என்ற பொருளைத் தருகிறது; இங்கு அக்கிரமத்தை நீக்குவதைக் குறிக்கிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עון அக்கிரமம், குற்றப்பழி அல்லது அதற்கான தண்டனை ஆகியவற்றைக் குறிக்கலாம்; פשע உடன் இணையாக வருவதால் அறநெறிசார் தீவிரத்தைப் பாதுகாக்க ‘அக்கிரமம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי עַתָּה
  choice: இப்போதே
  rationale: כִּי காரணத் தொடர்பையும் עַתָּה உடனடியான கால உணர்வையும் தருகிறது; யோபுவின் நெருங்கிய மரண எதிர்பார்ப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: நான் புழுதியில் படுத்துக்கொள்வேன்
  rationale: ‘புழுதியில் படுத்தல்’ மரணம் மற்றும் அடக்கம் பற்றிய மூலத்தின் கவித்துவப் படிமத்தை நேரடியாகக் காக்கிறது.
- source_word: וְשִׁחֲרְתַּנִי
  choice: நீர் என்னை ஆவலுடன் தேடுவீர்
  rationale: שׁחר என்பதற்கு அதிகாலையில் தேடுதல் என்ற சொற்பிறப்புச் சாயலும் தீவிரமாக அல்லது ஆர்வத்துடன் தேடுதல் என்ற இடியோமப் பொருளும் உண்டு; சூழலில் பிந்தையதே இயல்பானது.
- source_word: וְאֵינֶנִּי
  choice: ஆனால் நான் இருக்கமாட்டேன்
  rationale: எபிரெயத்தில் சொற்பட ‘நான் இல்லை’; இங்கு வருங்கால மரணம் அல்லது மறைவைச் சுட்டுவதால், அதன் சுருக்கமான இருப்பியல் அழுத்தத்தை ‘நான் இருக்கமாட்டேன்’ காக்கிறது.
theological_decisions:
- issue: இரு பாவச் சொற்களின் வேறுபாடு
  choice: פשע என்பதற்கு ‘மீறுதல்’, עון என்பதற்கு ‘அக்கிரமம்’
  alternative: இரண்டிற்கும் ‘பாவம்’ அல்லது ‘குற்றம்’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் தொடர்புடையதாயினும் வேறுபட்ட இரு சொற்கள் உள்ளன; அவற்றை வேறுபடுத்துவது கவிதை இணைநிலையையும் அறநெறிசார் சொல்வளத்தையும் காக்கிறது.
- issue: לֶעָפָר אֶשְׁכָּב என்ற மரணப் படிமம்
  choice: ‘புழுதியில் படுத்துக்கொள்வேன்’ என்ற நேரடியான படிமத்தை வைத்தல்
  alternative: ‘நான் இறந்துவிடுவேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மரணம் மற்றும் அடக்கம் குறித்த மூலத்தின் கவித்துவப் படிமத்தையும் அதிலுள்ள அழுத்தத்தையும் விளக்கவுரை மூலம் தட்டையாக்காமல் காக்கிறது.
- issue: וְאֵינֶנִּי என்பதன் இருப்பியல் சுருக்கம்
  choice: ‘ஆனால் நான் இருக்கமாட்டேன்’
  alternative: ‘ஆனால் நான் மறைந்துபோயிருப்பேன்’
  rationale: மரணத்திற்குப் பிந்தைய நிலையை விரிவாக வரையறுக்காமல், மூலத்தின் ‘நான் இல்லை’ என்ற கூற்றையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை மரியாதையுடன் ஒருமையில் குறிக்கும் ‘நீர்/இருக்கிறீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவித்துவமான ‘புழுதி’ படிமமும், ‘நான் இருக்கமாட்டேன்’ என்ற சுருக்கமான இறுதி முரணும் காக்கப்பட்டுள்ளன.
