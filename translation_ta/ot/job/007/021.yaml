revisions:
- from: என் மீறுதலை ஏன் மன்னிக்காமல் இருக்கிறீர்? என் அக்கிரமத்தை ஏன் அகற்றாமல் இருக்கிறீர்? இப்போதே நான் புழுதியில் படுத்துக்கொள்வேன்; நீர் என்னை ஆவலுடன் தேடுவீர்[a], ஆனால் நான் இருக்கமாட்டேன்.
