  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: ta
  text: நீர் என்மேல் காவல்[b] வைக்கும்படி நான் கடலா, அல்லது கடல் அரக்கனா[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் தன்னீன்; ‘பெரும்பாம்பு’ அல்லது ‘அரக்கன்’ என்றும் மொழிபெயர்க்கலாம். கடல் அல்லது குழப்பப் படிமங்களில் வரும் பேரச்சுறுத்தலான உயிரினத்தை இச்சொல் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னை கண்காணிக்கிறீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: நான் கடலா
  rationale: வினாவிடை எதிர்பாராத வினாவைக் குறிக்கும் הֲ என்பதையும், யָם என்பதன் நேரடியான ‘கடல்’ பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இணையான இரு வினாப் படிமங்களுக்கிடையில் இது பிரிநிலை இணைப்பாகச் செயல்படுகிறது.
- source_word: תַּנִּין
  choice: கடல் அரக்கன்
  rationale: கடலுடன் இணையும் சூழலில், பெரும் அச்சுறுத்தும் கடல்வாழ் உயிரினம் அல்லது குழப்பத்தின் கவிதைப் படிமத்தை இது தெளிவாகக் காக்கிறது; குறிப்பிட்ட புராண அடையாளத்தைத் திணிக்கவில்லை.
- source_word: כִּי
  choice: … வைப்பதற்கு?
  rationale: யோபுவின்மேல் காவல் வைக்கப்படுவதற்கான காரணத்தைச் சவாலாகக் கேட்கும் தொடர்பை இயல்பான தமிழ் நோக்க வினை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: תָשִׂים
  choice: நீர் … வைப்பதற்கு
  rationale: שׂים என்பதன் ‘வை/அமை’ பொருளைத் தருகிறது; கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்’ பயன்படுத்தப்படுகிறது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: கண்காணிப்பு அல்லது கட்டுப்பாடு யோபுவின்மேல் செலுத்தப்படுவதை இயல்பாகக் குறிக்கிறது.
- source_word: מִשְׁמָר
  choice: காவல்
  rationale: கண்காணிப்பு, பாதுகாப்புக் காவல், அல்லது கட்டுப்படுத்தும் காவல் என்ற மூலச்சொல்லின் பொருள் பரப்பைக் காக்கிறது.
theological_decisions:
- issue: תַּנִּין என்ற சொல்லின் கடல்/குழப்பப் படிமம்
  choice: கடல் அரக்கன்
  alternative: பெரும்பாம்பு; அரக்கன்
  rationale: யோபுவைக் கட்டுப்படுத்த வேண்டிய பேரச்சுறுத்தலாக நடத்தப்படுவதாக அவர் முறையிடும் கவிதைப் படிமத்தைப் பாதுகாக்கிறது; வசனத்தில் வெளிப்படையாக இல்லாத விரிவான புராண அமைப்பைச் சேர்க்கவில்லை.
- issue: கடவுள் யோபுவின்மேல் காவல் வைப்பதைக் குறித்த முறையீடு
  choice: வினாவின் குற்றஞ்சாட்டும் இறுக்கத்தை அப்படியே வைத்தல்
  alternative: கடவுளின் பாதுகாப்புக் கவனிப்பு என மென்மைப்படுத்துதல்
  rationale: மִשְׁמָר என்பதில் காவல்/கண்காணிப்பு என்ற இருமுகச் சாத்தியம் உள்ளது. சூழலில் யோபு அதை ஒடுக்குமுறையான கண்காணிப்பாக உணர்கிறார்; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்த்து விடக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தீவிரமும் மரியாதை ஒருமையும் காக்கப்பட்டுள்ளன. முதல் வினாவுக்குப் பின் தனி வினாவாக அமைத்தது தமிழில் யோபுவின் கூர்மையான முறையீட்டை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
