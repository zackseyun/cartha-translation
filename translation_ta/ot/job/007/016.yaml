  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: ta
  text: என் வாழ்வை நான் வெறுக்கிறேன்[a]; நான் என்றென்றும் வாழப்போவதில்லை. என்னை விட்டுவிடும்; ஏனெனில் என் நாட்கள் ஒரு மூச்சே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை நான் வெறுக்கிறேன்,” “அதை நான் புறக்கணிக்கிறேன்.” எபிரெயத்தில் வெறுக்கப்படுவது எது என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “மூச்சு” என்பதற்கான எபிரெயச் சொல் “நீராவி” என்றும் பொருள்படலாம்; வாழ்நாட்கள் எவ்வளவு குறுகியதும் நிலையற்றதும் என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: என் வாழ்வை நான் வெறுக்கிறேன்
  rationale: מָאַסְתִּי என்பது ‘வெறுத்தல், புறக்கணித்தல், தள்ளிவிடுதல்’ என்ற வலுவான உணர்வைக் குறிக்கிறது. எபிரெயத்தில் அதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; சூழலின் அடிப்படையில் ‘என் வாழ்வை’ என்று உரையில் நிரப்பி, அதைக் குறிப்பு [a] மூலம் வெளிப்படையாகச் சுட்டியுள்ளோம்.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: நான் என்றென்றும் வாழப்போவதில்லை
  rationale: இச்சொற்றொடர், தான் என்றென்றும் வாழமாட்டான் என்ற யோபுவின் நிலையுணர்வைச் சொல்கிறது. ‘வாழப்போவதில்லை’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, இதை விருப்பவாக்கியமாக மாற்றாமல் எதிர்கால உண்மையாக வைத்திருக்கிறது.
- source_word: חֲדַל מִמֶּנִּי
  choice: என்னை விட்டுவிடும்
  rationale: חדל என்ற கட்டளை ‘நிறுத்து, விலகு’ என்றும், מן இணைந்தபோது இங்கு ‘என்னை விட்டுவிடு’ என்றும் பொருள்படுகிறது. ‘விட்டுவிடும்’ என்பது கடவுளை நோக்கிய ஒருமைக் கட்டளையின் நேர்மையையும் வேண்டுதலுக்கேற்ற கண்ணியமான தமிழ்நடையையும் இணைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோபுவின் வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரண இணைப்புச் சொல்லான ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֶבֶל
  choice: ஒரு மூச்சு
  rationale: הֶבֶל என்பது ‘மூச்சு, நீராவி, நிலையின்மை’ ஆகிய கருத்துகளைத் தாங்குகிறது. வாழ்நாளின் மிகக் குறுகிய, நிலையற்ற தன்மையை ‘ஒரு மூச்சு’ தெளிவாகவும் உருவகத்தைப் பாதுகாத்தும் காட்டுகிறது.
- source_word: יָמָי
  choice: என் நாட்கள்
  rationale: இது யோபுவின் வாழ்நாட்களைக் குறிக்கும் நேரான உடைமைப் பன்மை வடிவம்.
theological_decisions:
- issue: மָאַסְתִּי என்பதன் சொல்லப்படாத செயப்படுபொருள்
  choice: முதன்மை உரையில் ‘என் வாழ்வை’ என்று சூழலுக்கேற்ப நிரப்பி, அடிக்குறிப்பில் எபிரெயத்தின் தெளிவின்மையைக் குறிப்பிடுதல்
  alternative: ‘அதை நான் வெறுக்கிறேன்’ அல்லது செயப்படுபொருளின்றி ‘நான் வெறுத்துவிட்டேன்’
  rationale: இயல்பான தமிழுக்கு ஒரு செயப்படுபொருள் தேவைப்படுகிறது; ‘என் வாழ்வை’ என்பது யோபுவின் புலம்பல் சூழலுக்கு ஏற்றது. எனினும் எபிரெயம் அதை வெளிப்படையாகக் கூறாததால், இந்த விளக்கம் மட்டும் சாத்தியம் என்று உரை மறைமுகமாகத் தீர்மானிக்காதபடி அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
