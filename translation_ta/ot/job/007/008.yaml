source:
  edition: WLC
  text: לֹֽא תְ֭שׁוּרֵ/נִי עֵ֣ין רֹ֑אִי עֵינֶ֖י/ךָ בִּ֣/י וְ/אֵינֶֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: ta
  text: என்னைக் காண்பவரின் கண் இனி என்னைக் காணாது[a]; உமது கண்கள் என்னை நோக்கும்[b], ஆனால் நான் இல்லாமல் போயிருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் காணும் கண் என்னைக் காணாது.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லாட்சியில், “உமது கண்கள் என்மேல் இருக்கும்; ஆனால் நான் இல்லை.” அதாவது, என்னைத் தேடிப் பார்க்கும்போது நான் இல்லாமல் போயிருப்பேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: என்னைக் காணாது
  rationale: שׁור என்பதன் பொருள் ‘பார், உற்றுநோக்கு, கண்ணுறு.’ இங்கு கண் என்ற உருவகத்துடன் இயல்பாக அமையவும், காட்சியிலிருந்து யோபு மறைவதைத் தெளிவாகச் சொல்லவும் ‘காணாது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵין רֹאִי
  choice: என்னைப் பார்க்கிறவனின் கண்
  rationale: ‘என்னைப் பார்ப்பவனின் கண்’ என்ற எபிரெயக் கட்டமைப்பையும் கண் குறித்த கவித்துவப் படிமத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֹא
  choice: இனி ... காணாது
  rationale: அடிப்படையில் ‘இல்லை/அல்ல’ என்ற மறுப்பு. வரவிருக்கும் மறைவைச் சுட்டும் சூழலில் அதன் காலப்பொருளை இயல்பான தமிழில் ‘இனி ... காணாது’ என வெளிப்படுத்துகிறது.
- source_word: עֵינֶיךָ
  choice: உமது கண்கள்
  rationale: எபிரெயில் உள்ள பன்மையைப் பாதுகாக்கிறது. தேவனை நேரடியாக விளிக்கும் மரியாதையான நவீனத் தமிழ் நடைக்கு ‘உமது’ பொருந்துகிறது.
- source_word: בִּי
  choice: என்னை நோக்கும்
  rationale: சொல்லாட்சியில் ‘என்மேல்’ என்றாலும், கண்கள் ஒருவர்மேல் செலுத்தப்படுவதைத் தமிழில் இயல்பாக ‘என்னை நோக்கும்’ என்று கூறலாம்.
- source_word: וְאֵינֶנִּי
  choice: ஆனால் நான் இல்லாமற்போயிருப்பேன்
  rationale: சொல்லாட்சியில் ‘நான் இல்லை.’ இச்சூழலில் மறைவு அல்லது மரணத்தை உணர்த்தும் தொடர்; எதிர்கால நோக்கையும் மூலத்தின் கடுமையான இருப்பின்மையையும் காக்க ‘இல்லாமற்போயிருப்பேன்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: ‘உமது கண்கள்’ என்பதன் விளிப்புக்குரியவர்
  choice: தேவனை நோக்கிய நேரடி விளிப்பு
  alternative: பொதுவாகப் பார்க்கும் ஒருவரை நோக்கிய விளிப்பு
  rationale: அருகிலுள்ள வசனங்களில் யோபு தேவனிடம் நேரடியாகப் பேசுகிறார். எனினும் மூலத்தில் தேவனுடைய பெயர் இங்கு இல்லாததால், அதை உரைக்குள் சேர்க்காமல் இரண்டாம் நபர் விளிப்பை மட்டும் வைத்துள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்/கண்கள்’ என்ற எபிரெயப் படிமமும், தேவனை நோக்கிய நேரடி உரையும் பாதுகாக்கப்பட்டுள்ளன; ‘இல்லாமற்போயிருப்பேன்’ என்பது மறைவு மற்றும் மரணம் ஆகிய இரண்டையும் முற்றிலும் குறுக்காமல் தாங்குகிறது.
