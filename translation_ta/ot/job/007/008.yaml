review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Hebrew visual imagery, the temporal sense of the negated imperfect, the plural ‘your eyes,’ and Job’s disappearance. The addressee remains appropriately implicit. A minor adjustment makes the final Tamil idiom more natural while retaining the source’s terse ‘and I am not.’
  naturalness: ‘என்னைப் பார்க்கிறவனின்’ is understandable but slightly colloquial and masculine-specific in a generic sense. ‘என்னைக் காண்பவரின்’ is smoother in modern standard Tamil. ‘இல்லாமற்போயிருப்பேன்’ is awkward; ‘இல்லாமல் போயிருப்பேன்’ is idiomatic and preserves the contextual sense of being gone.
  terminology: ‘கண்/கண்கள்,’ ‘உமது,’ and ‘நோக்கும்’ appropriately retain the Hebrew poetic image and reverent direct address without unnecessarily naming God. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: Generic observer is expressed with a masculine-specific form.
    rationale: ‘என்னைப் பார்க்கிறவனின்’ can sound unnecessarily male-specific. ‘என்னைக் காண்பவரின்’ naturally conveys the generic observer intended by עֵין רֹאִי.
  - severity: medium
    issue: The final expression is not idiomatic Tamil.
    rationale: ‘இல்லாமற்போயிருப்பேன்’ is linguistically awkward. ‘இல்லாமல் போயிருப்பேன்’ is standard usage and communicates the contextual sense of disappearance without over-specifying death.
  revised_text: என்னைக் காண்பவரின் கண் இனி என்னைக் காணாது[a]; உமது கண்கள் என்னை நோக்கும்[b], ஆனால் நான் இல்லாமல் போயிருப்பேன்.
