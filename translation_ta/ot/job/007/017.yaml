  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: ta
  text: மரணமுள்ள மனிதன் எம்மாத்திரம், நீர் அவனைப் பெரிதாக்குகிறீர்; அவன்மேல் உமது இதயத்தை வைக்கிறீர்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה
  choice: எம்மாத்திரம்
  rationale: மனிதனின் நிலையையும் முக்கியத்துவத்தையும் குறித்து எழும் வினாவை இயல்பான, சுருக்கமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: மரணத்துக்குரிய மனிதன்
  rationale: אֱנוֹשׁ என்பது நிலையற்ற, சாகக்கூடிய மனிதகுலத்தை ஒருமை வடிவில் குறிக்கிறது; தமிழிலும் அந்தப் பிரதிநிதித்துவ ஒருமையும் மனிதப் பலவீனத்தின் நிழலும் காக்கப்படுகின்றன.
- source_word: כִּי
  choice: — …வும்
  rationale: எபிரெய வினாவுக்குப் பின்வரும் இரு இணையான உட்பொருள் கூறுகளையும் தமிழில் இயல்பாக இணைக்க வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְגַדְּלֶנּוּ
  choice: அவனைப் பெரிதாக்கவும்
  rationale: גדל என்ற வேர்ச்சொல்லின் பியேல் வடிவிலுள்ள ‘பெரிதாக்கு/மகத்துவப்படுத்து’ என்ற அடிப்படைப் பொருளைக் காக்கிறது; இங்கு அது மனிதனுக்கு மிகுந்த முக்கியத்துவம் அளிப்பதையும் குறிக்கலாம்.
- source_word: וְכִי
  choice: (இணை அமைப்பிலுள்ள இரண்டாவது) …வும்
  rationale: முதல் வினைச்சொல்லுடன் இரண்டாவது கூறை இணைத்து மூலத்தின் கவிதை இணைநிலையைத் தமிழில் காக்கிறது.
- source_word: תָשִׁית
  choice: வைக்கவும்
  rationale: שׁית என்பதன் ‘வை/நிறுத்து’ என்ற அடிப்படைப் பொருளையும் இதயத்தை ஒருவர்மேல் வைப்பது என்ற உருவகத்தையும் நேரடியாகத் தருகிறது.
- source_word: אֵלָיו
  choice: அவன்மேல்
  rationale: தெய்வீக கவனம் எந்த மனிதனை நோக்கியது என்பதைத் தமிழின் இயல்பான வேற்றுமை வடிவில் காட்டுகிறது.
- source_word: לִבֶּךָ
  choice: உமது இதயத்தை
  rationale: ‘இதயம்’ என்பதை ‘கவனம்’ அல்லது ‘மனம்’ என்று விளக்கி முடிவுசெய்யாமல், மூலத்தின் மனிதப் பண்புருவகத்தையும் கவித்துவத்தையும் காக்கிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்பதன் பிரதிநிதித்துவ ஒருமையும் மனிதனின் மரணத்தன்மையும்
  choice: மரணத்துக்குரிய மனிதன்
  alternative: மனிதன்; மனிதகுலம்
  rationale: ஒருமையைப் பன்மையாக மாற்றாமல், இந்த எபிரெயச் சொல்லில் உள்ள சாகக்கூடிய மனிதநிலையின் நிழலை வெளிப்படுத்துகிறது; சங்கீதம் 8:4-இன் இலக்கிய எதிரொலியையும் ஆதரிக்கிறது.
- issue: மனிதனுக்கு அளிக்கப்படும் தெய்வீக முக்கியத்துவம்
  choice: அவனைப் பெரிதாக்கவும்
  alternative: அவனை அவ்வளவு பெரிதாகக் கருதவும்; அவனை மேன்மைப்படுத்தவும்
  rationale: மூல வினைச்சொல்லின் ‘பெரிதாக்குதல்’ என்ற உருவகத்தைத் தக்கவைத்து, அது மதிப்பளித்தல், முக்கியத்துவம் கொடுத்தல், அல்லது உயர்த்துதல் எனத் தரக்கூடிய பதற்றத்தைத் தீர்மானித்து விடாமல் விடுகிறது.
- issue: தேவனுடைய இதயத்தைப் பற்றிய மனிதப் பண்புருவகம்
  choice: அவன்மேல் உமது இதயத்தை வைக்கவும்
  alternative: அவன்மேல் கவனம் செலுத்தவும்; அவன்மேல் மனதை வைக்கவும்
  rationale: மூலத்தில் உள்ள ‘இதயம்’ என்ற சொல் சிந்தனை, கவனம், அக்கறை ஆகியவற்றை உள்ளடக்கலாம்; அதை ஒரு கருத்தாக மட்டும் சுருக்காமல் உருவகத்தைக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான “நீர்,” “உமது” காக்கப்பட்டுள்ளன. இடைக்கோடு வினாவின் இரு இணை கூறுகளையும் தெளிவுபடுத்துகிறது.
