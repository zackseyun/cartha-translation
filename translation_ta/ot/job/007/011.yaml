  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: ta
  text: நானும் என் வாயை அடக்க மாட்டேன்[a]; என் ஆவியின் வேதனையில் பேசுவேன்[b]; என் உயிரின் கசப்பில் முறையிடுவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வாயைத் தடுத்து நிறுத்த மாட்டேன்.” எபிரெய மொழிவழக்கு வாயைக் கட்டுப்படுத்தாமல் பேசுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் ஆவியின் நெருக்கடியில்” அல்லது “என் ஆவியின் துயரத்தில்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “புலம்புவேன்,” “பேசுவேன்.” எபிரெய வினை சூழலுக்கேற்ப சிந்தித்துப் பேசுதல், புலம்புதல், அல்லது முறையிடுதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: நானும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளான ‘நானும்’ என்பதை நேரடியாகத் தக்கவைக்கிறது; காரணத் தொடர்பைக் காட்டும் ‘ஆகவே’ என்பதைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: என் வாயை அடக்க மாட்டேன்
  rationale: ‘வாயைத் தடுக்காமல் பேசுதல்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; ‘மௌனமாக இருக்க மாட்டேன்’ என்பதைவிட மூலத்தின் உடல்சார் படிமத்திற்கு நெருக்கமானது.
- source_word: אֲדַבְּרָה
  choice: பேசுவேன்
  rationale: இங்கு முதல் நபரின் உறுதியான நோக்கத்தை எளிமையாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּצַר רוּחִי
  choice: என் ஆவியின் வேதனையில்
  rationale: צַר குறிக்கும் நெருக்கம், துயரம், வேதனை ஆகிய உணர்வுகளை இயல்பான தமிழில் ‘வேதனை’ வெளிப்படுத்துகிறது; רוּחַ என்பதை ‘ஆவி’ எனத் தனியாகப் பேணுகிறது.
- source_word: אָשִׂיחָה
  choice: முறையிடுவேன்
  rationale: இந்த வினை சிந்தித்துப் பேசுதல், புலம்புதல், முறையிடுதல் போன்ற பொருள்களை ஏற்கலாம். யோபுவின் துன்பமும் அடுத்துள்ள ‘கசப்பு’ என்பதும் இங்கு முறையீட்டின் தொனியை ஆதரிக்கின்றன.
- source_word: בְּמַר נַפְשִׁי
  choice: என் உயிரின் கசப்பில்
  rationale: מַר என்பதன் ‘கசப்பு’ படிமத்தைப் பேணுகிறது. נֶפֶשׁ என்பதை இங்கு ‘உயிர்’ என மொழிபெயர்ப்பதால் முழு ஆளுமை/உயிர் என்ற எபிரெயப் பரப்பும், முன்னுள்ள ‘ஆவி’ என்பதிலிருந்து உள்ள வேறுபாடும் தக்கவைக்கப்படுகின்றன.
theological_decisions:
- issue: רוּחַ மற்றும் נֶפֶשׁ ஆகிய மனித இயல்பைக் குறிக்கும் சொற்கள் கவிதை இணைப்பில் வருதல்
  choice: அவற்றை முறையே ‘ஆவி’ மற்றும் ‘உயிர்’ என்று வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘உள்ளம்’ அல்லது ‘மனம்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்; அல்லது נֶפֶשׁ என்பதை ‘ஆன்மா’ என மொழிபெயர்த்தல்
  rationale: மூலத்தில் இரு வேறு சொற்கள் உள்ளதால் அவற்றின் கவிதை நுணுக்கத்தைப் பேணுகிறது. அதே நேரத்தில், இவை மனிதனின் தனித்தனி கூறுகள் என்று ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்தின் மீது திணிப்பதில்லை.
- issue: אָשִׂיחָה என்பதன் பேச்சு/புலம்பல் சார்ந்த தெளிவின்மை
  choice: சூழலுக்கேற்ற முதன்மைப் பொருளாக ‘முறையிடுவேன்’
  alternative: ‘புலம்புவேன்’, ‘பேசுவேன்’, அல்லது ‘சிந்தித்துப் பேசுவேன்’
  rationale: கசப்பும் துன்பமும் நிறைந்த சூழல் முறையீட்டின் பொருளை ஆதரித்தாலும், எபிரெய வினையின் பரந்த பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பேணப்படுகிறது.
