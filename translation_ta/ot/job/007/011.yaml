  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வாயை அடக்குதல்’, ‘ஆவியின் வேதனை’, ‘உயிரின் கசப்பு’ ஆகிய கவிதைப் படிமங்கள் எளிய வாசகருக்கும் புரியுமாறு தக்கவைக்கப்பட்டுள்ளன; சொற்களின் உண்மையான பொருள் விரிவுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
