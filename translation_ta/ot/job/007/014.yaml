  yaml_path: translation/ot/job/007/014.yaml
  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: ta
  text: அப்போது நீர் கனவுகளால் என்னைத் திகிலடையச் செய்கிறீர்; தரிசனங்களால் என்னைப் பயமுறுத்துகிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் கனவுகளில் என்னைத் திகிலடையச் செய்கிறீர்; தரிசனங்களிலிருந்து என்னைப் பயமுறுத்துகிறீர்.” எபிரெய முன்னிடைச்சொற்களை இன்னும் சொல்நெருக்கமாக “இல்/ஆல்” என்றும் “இலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் யோபு படுக்கையில் ஆறுதல் தேடுவதைத் தொடர்ந்து நிகழும் விளைவைச் சூழல் காட்டுவதால், வெறும் ‘மேலும்’ என்பதற்குப் பதிலாக ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חִתַּתַּנִי
  choice: என்னைத் திகிலடையச் செய்கிறீர்
  rationale: பியேல் வினை வடிவம் கடுமையான மனக் கலக்கத்தையும் அச்சத்தையும் குறிக்கிறது. உடல்சார்ந்த ‘நொறுக்குதல்’ என்ற பொருளைத் தவிர்த்து, இச்சூழலுக்கேற்ற தீவிர அச்சத்தை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בַחֲלֹמוֹת
  choice: கனவுகளால்
  rationale: ב முன்னிடைச்சொல் இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; அதனை இயல்பான தமிழில் ‘-ஆல்’ வேற்றுமையால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: தரிசனங்களால்
  rationale: מן முன்னிடைச்சொல் மூலத்தையோ வழிமுறையையோ குறிக்கலாம். இணையான முதலாவது அடியோடு கவிதை ஒத்திசைவைப் பேண ‘-ஆல்’ என வழங்கப்பட்டது; ‘தரிசனம்’ இங்கு இரவில் காணப்படும் வெளிப்பாட்டுக் காட்சியைக் குறிக்கிறது.
- source_word: תְּבַעֲתַנִּי
  choice: என்னைப் பயமுறுத்துகிறீர்
  rationale: பியேல் வடிவிலுள்ள வினை திடீர் அச்சுறுத்தலையும் பீதியையும் குறிக்கிறது. முதல் அடியின் ‘திகிலடையச் செய்கிறீர்’ என்பதோடு பொருள் இணையாகவும், தேவையற்ற சொல் மறுபதிப்பைத் தவிர்க்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
