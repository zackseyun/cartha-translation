  text: וַ/תִּפְקְדֶ֥/נּוּ לִ/בְקָרִ֑ים לִ֝/רְגָעִ֗ים תִּבְחָנֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: ta
  text: காலைதோறும் அவரைக் கவனித்து[a], கணந்தோறும் அவரைச் சோதிக்கிறீரா[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலைதோறும் அவரைப் பார்வையிட்டு.” எபிரெய வினைச்சொல் ‘பார்வையிடுதல்,’ ‘கவனித்தல்,’ அல்லது ‘குறித்துக்கொள்ளுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கணந்தோறும் அவரை ஆராய்கிறீரா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: அவரைக் கவனித்து
  rationale: פקד இங்கு ‘சந்தித்தல்,’ ‘கவனித்தல்,’ ‘குறித்துக்கொள்ளுதல்’ போன்ற பொருள்களைத் தரக்கூடும். அடுத்துவரும் ‘சோதிக்கிறீர்’ என்பதுடன் இணைந்து, யோபுவுக்குச் சுமையாகத் தோன்றும் கடவுளின் தொடர்ந்த கவனிப்பைக் ‘கவனித்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְקָרִים
  choice: காலைதோறும்
  rationale: பன்மை வடிவமும் ל முன்னொட்டும் மீண்டும் மீண்டும் நிகழ்வதைக் குறிக்கின்றன; ‘காலைதோறும்’ அந்தத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לִרְגָעִים
  choice: கணந்தோறும்
  rationale: רגעים மிகக் குறுகிய நேரப்பகுதிகளைக் குறிக்கிறது; ‘கணந்தோறும்’ இடைவிடாத மறுநிகழ்வையும் கவிதைநயத்தையும் காக்கிறது.
- source_word: תִּבְחָנֶנּוּ
  choice: அவரைச் சோதிக்கிறீர்
  rationale: בחן கூர்ந்து ஆராய்ந்து சோதித்தல் அல்லது பரிசோதித்தல் என்ற பொருளுடையது. சூழலிலுள்ள கடுமையான கண்காணிப்பின் தொனியை ‘சோதிக்கிறீர்’ தெளிவாகக் காக்கிறது.
- source_word: ־נּוּ
  choice: அவரை
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்திலுள்ள மனிதனைக் குறிக்கிறது. தமிழில் மரியாதை ஒருமையான ‘அவரை’ இயல்பாகவும் கண்ணியமாகவும் அந்தச் சுட்டுதலைத் தொடர்கிறது.
theological_decisions:
- issue: கடவுளின் கண்காணிப்பின் தொனி
  choice: ஆறுதலான பராமரிப்பாக மென்மையாக்காமல், யோபுவுக்குச் சுமையாகத் தோன்றும் நெருக்கமான, இடைவிடாத கவனிப்பாக மொழிபெயர்த்தல்
  alternative: அன்பான சந்திப்பு அல்லது பரிவான பராமரிப்பு என்று மொழிபெயர்த்தல்
  rationale: யோபுவின் புலம்பல் சூழலில் இந்தக் கேள்வி ஆறுதலை அல்ல, இடைவிடாத தெய்வீக ஆய்வின் பாரத்தை வெளிப்படுத்துகிறது. மூலத்திலுள்ள இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘காலைதோறும் / கணந்தோறும்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் இணைநிலையையும் தொடர்ச்சியையும் காக்கிறது; ‘கவனித்து / சோதிக்கிறீர்’ என்பது சூழலின் சுமையான தொனியைப் பாதுகாக்கிறது.
