  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: ta
  text: பூமியில் மனிதனுக்குக் கடினமான கட்டாயச் சேவை இருக்கிறதல்லவா?[a] அவனுடைய நாட்கள் கூலித் தொழிலாளியின் நாட்களைப் போன்றவை அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியில் மனிதனுக்குப் படைத்துறைச் சேவை அல்லது போர் இருக்கிறதல்லவா?” எபிரெயச் சொல் צָבָא படைத்துறைச் சேவை அல்லது போரைக் குறிக்கலாம். ஆனால் இங்கு “கூலித் தொழிலாளி” என்ற இணை ஒப்புமை இருப்பதால், சுமையான கட்டாயச் சேவை அல்லது உழைப்பு என்பதே அதிகம் பொருந்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் எதிர்மறை வினாவாகப் பாதுகாக்கிறது.
- source_word: צָבָא
  choice: கடினமான பணி நியமிக்கப்பட்டிருக்கிறது
  rationale: இந்தச் சொல் படைப்பணி அல்லது போர் என்பதையும், கட்டாயமான கடின சேவைக்காலம் என்பதையும் குறிக்கலாம். கூலித் தொழிலாளியுடன் வரும் இணைப்பைக் கருத்தில் கொண்டு, சுமையான நியமிக்கப்பட்ட பணியை முதன்மை உரை வெளிப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: மனிதகுலத்தைப் பொதுவாகவும் அதன் நிலையாமை மற்றும் பலவீனத்தை மறைமுகமாகவும் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: עַל־אָרֶץ
  choice: பூமியில்
  rationale: ஒரு குறிப்பிட்ட நிலப்பகுதியை அல்லாமல் மனித வாழ்வின் பரந்த உலகச் சூழலைக் குறிக்கிறது.
- source_word: וְכִימֵי
  choice: அவனுடைய நாட்கள் ... நாட்களைப் போன்றவை
  rationale: ஒப்புமையை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; இரண்டாம் வினாவிலும் முதல் பகுதியின் வினாவியல் வலிமையைத் தொடர்கிறது.
- source_word: שָׂכִיר
  choice: கூலித் தொழிலாளி
  rationale: கூலிக்காக ஒரு காலவரையறைக்குள் உழைக்கும் பணியாளரை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: יָמָיו
  choice: அவனுடைய நாட்கள்
  rationale: வாழ்க்கைக் காலத்தை ‘நாட்கள்’ என்று சொல்லும் மூலத்தின் கால உருவகத்தைப் பாதுகாக்கிறது.
