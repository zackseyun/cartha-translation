  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: ta
  text: நான் படுக்கும்போது[a], ‘எப்போது எழுந்திருப்பேன்?’ என்று சொல்கிறேன். ஆனால் மாலைப்பொழுது நீண்டுகொண்டே போகிறது[b]; விடியற்காலைவரை[c] புரளுதல்களால் நிறைந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் படுத்தால்.’ எபிரெயச் சொல் நிபந்தனைப் பொருளில் வரக்கூடும்; ஆனால் இங்கு திரும்பத் திரும்ப நிகழும் சூழலை, ‘நான் படுக்கும்போது,’ என்று குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘மாலைப்பொழுது அளக்கப்படுகிறது.’ மாலை மிகவும் மெதுவாக நீள்வதுபோல் தோன்றுவதே இதன் பொருள்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொல் மங்கலொளி நேரத்தைக் குறிக்கும்; அது மாலை அல்லது காலை மங்கலொளியாக இருக்கலாம். இங்கு விடியற்காலையைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: படுக்கும்போது
  rationale: இது பொதுவாக ‘என்றால்’ என்ற நிபந்தனைப் பொருளைத் தரக்கூடியது. ஆனால் இங்கு யோபு இரவுதோறும் அனுபவிக்கும் தொடர்ச்சியான நிலையைக் குறிப்பிடுவதால், காலப்பொருளில் ‘படுக்கும்போது’ என்று மொழிபெயர்க்கப்பட்டது; ‘என்றால்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שָׁכַבְתִּי / וְאָמַרְתִּי
  choice: நான் படுக்கும்போது … கேட்கிறேன்
  rationale: இவ்வினைகள் முடிந்த ஒரே நிகழ்வை அல்லாமல், திரும்பத் திரும்ப நிகழும் இரவுநேர அனுபவத்தை இங்கு சுட்டுகின்றன. எனவே நவீன தமிழில் வழக்கநிலையை வெளிப்படுத்தும் நிகழ்கால அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: מָתַי אָקוּם
  choice: எப்போது எழுந்திருப்பேன்?
  rationale: קום என்பது இங்கு படுக்கையிலிருந்து எழுவதைக் குறிக்கிறது. ‘எழுந்திருப்பேன்’ என்பது இரவு முடிவதற்காக யோபு ஏங்குவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִדַּד עָרֶב
  choice: ஆனால் மாலைப்பொழுது நீண்டுகொண்டே போகிறது
  rationale: מדד என்பதன் அடிப்படைப் பொருள் ‘அளத்தல்’. இச்சூழலில் மாலை மெதுவாக நீண்டு செல்வதுபோல் யோபுக்குத் தோன்றுவதை இயல்பாகத் தெரிவிக்க ‘நீண்டுகொண்டே போகிறது’ எனப்பட்டது. עָרֶב என்பதற்கேற்ப ‘மாலைப்பொழுது’ தக்கவைக்கப்பட்டது.
- source_word: וְשָׂבַעְתִּי נְדֻדִים
  choice: புரண்டு புரண்டு சலித்துப்போகிறேன்
  rationale: שבע என்பது ‘நிறைவடைதல், திகட்டுமளவு அடைதல்’ என்றும், נְדֻדִים என்பது அமைதியின்றிப் புரளுதல்களையும் குறிக்கிறது. எதிர்மறையான இச்சூழலில் இரவெல்லாம் புரள்வதால் திகட்டிப்போன உணர்வை இயல்பான தமிழில் இச்சொற்றொடர் தருகிறது.
- source_word: עֲדֵי נָשֶׁף
  choice: விடியற்காலைவரை
  rationale: נָשֶׁף என்பது மாலை அல்லது காலை மங்கலொளியைக் குறிக்கலாம். படுத்ததிலிருந்து எழுவதற்காக இரவு முழுவதும் காத்திருக்கும் சூழலில் இது காலை மங்கலொளியை, அதாவது விடியற்காலையை, குறிக்கிறது.
