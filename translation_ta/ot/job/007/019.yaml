  text: כַּ֭/מָּה לֹא תִשְׁעֶ֣ה מִמֶּ֑/נִּי לֹֽא תַ֝רְפֵּ֗/נִי עַד בִּלְעִ֥/י רֻקִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: ta
  text: எவ்வளவு காலம் என்னிடமிருந்து உமது பார்வையைத் திருப்பமாட்டீர்? என் உமிழ்நீரை நான் விழுங்கும்வரைகூட என்னை விட்டுவிடமாட்டீரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடமிருந்து உமது பார்வையை விலக்கமாட்டீரா? என் உமிழ்நீரை நான் விழுங்கும்வரையாவது என்னை விட்டுவிடமாட்டீரா?” “உமிழ்நீரை விழுங்கும்வரை” என்பது மிகச் சிறிது நேரத்தைக் குறிக்கும் சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: எவ்வளவு காலம்
  rationale: புலம்பல் சூழலில் இது கால அளவைக் குறித்த முறையீடாக இருப்பதால், இயல்பான நவீனத் தமிழில் ‘எவ்வளவு காலம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: என்னைவிட்டு உமது பார்வையைத் திருப்பாமல் இருப்பீர்
  rationale: שׁעה இங்கு பார்வையை ஒரு திசையிலிருந்து திருப்புவதைக் குறிக்கிறது. தம்மைத் தொடர்ந்து உற்றுநோக்குவதை கடவுள் நிறுத்த வேண்டும் என்ற யோபுவின் வேண்டுகோளை இத்தொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תַרְפֵּנִי
  choice: என்னைத் தனியே விடமாட்டீரா
  rationale: רפה என்பதன் இச்செயப்பாட்டு வடிவம் பிடியைத் தளர்த்துதல் அல்லது ஒருவரை விட்டுவிடுதல் என்ற பொருளைத் தருகிறது; ‘தனியே விடுதல்’ நவீனத் தமிழில் இயல்பாகவும் இணைவரியின் கருத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: עַד
  choice: வரைகூட
  rationale: கிடைக்க வேண்டிய ஓய்வின் மிகக் குறுகிய எல்லையைச் சுட்டுகிறது; எதிர்மறை வினாவுடன் ‘வரைகூட’ என்பது வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
- source_word: בִּלְעִי רֻקִּי
  choice: என் உமிழ்நீரை நான் விழுங்கும்
  rationale: எபிரெய உரையின் உடல்சார்ந்த நேரடித் தோற்றத்தைப் பாதுகாக்க ‘உமிழ்நீர்’ பயன்படுத்தப்பட்டது; முழுத் தொடர் மிகச் சிறிய நேரத்தைக் குறிக்கும் உவமைவழக்காகும்.
