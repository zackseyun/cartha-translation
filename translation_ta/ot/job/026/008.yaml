  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: ta
  text: 'அவர் தமது மேகங்களில்[a] நீரைக் கட்டிவைக்கிறார்;

    ஆயினும், அவற்றின் கீழ்[c] மேகம் பிளவுபடுவதில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அடர்மேகங்களில்”; எபிரெயச் சொல் அடர்ந்த மேகத்திரளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெடித்துவிடுவதில்லை”; எபிரெயச் சொல் நேரடியாகப் ‘பிளவுபடுதல்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “அவற்றின்” என்பது நீரையோ மேகத்திரள்களையோ சுட்டலாம்; எபிரெயத்தில் சுட்டுப்பொருள் தெளிவாகக் குறிப்பிடப்படவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: צֹרֵר
  choice: கட்டிவைக்கிறார்
  rationale: צרר என்ற வினை கட்டுதல், சுற்றிப் பொதிதல், அடக்கிவைத்தல் ஆகிய கருத்துகளைத் தருகிறது. “கட்டிவைக்கிறார்” என்பது நீரை மேகங்களுக்குள் கட்டுப்படுத்தி வைத்திருக்கும் கவித்துவப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מַיִם
  choice: நீரை
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், தமிழ் வழக்கில் நீர் என்பது இயல்பாகத் திரள்பொருள் பெயராக வருகிறது; ஆகவே செயற்கையான பன்மையைத் தவிர்த்து “நீரை” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעָבָיו
  choice: தமது மேகங்களில்
  rationale: עָב என்பது மேகத்தையும், குறிப்பாக அடர்ந்த மேகத்திரளையும் குறிக்கலாம். உடைமைப் பின்னொட்டை வெளிப்படுத்த “தமது” என்றும், வாசிப்பின் இயல்புக்காக முதன்மை உரையில் “மேகங்களில்” என்றும் தரப்பட்டுள்ளது.
- source_word: וְלֹא
  choice: … பிளந்துவிடுவதில்லை
  rationale: இணைப்புச்சொல் இங்கு முன் வரியுடன் முரண்பாட்டுத் தொடர்பை உருவாக்குகிறது. தமிழின் அரைப்புள்ளியும் எதிர்மறை வினைமுற்றும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: נִבְקַע
  choice: பிளந்துவிடுவதில்லை
  rationale: בקע என்பதன் நிஃபால் வடிவம் ‘பிளக்கப்படுதல்/பிளந்துபோதல்’ என்ற செயப்பாட்டு அல்லது தன்னிகழ்வுப் பொருளைக் கொண்டது. “பிளந்துவிடுவதில்லை” அந்தத் தெளிவான உடற்படிமத்தைக் காக்கிறது.
- source_word: עָנָן
  choice: மேகம்
  rationale: மூலத்தில் ஒருமை இருப்பதால் “மேகம்” என ஒருமையிலேயே வைக்கப்பட்டுள்ளது; கவிதையில் இது பொதுவான அல்லது தொகுதிப் பொருளிலும் இயங்கலாம்.
- source_word: תַּחְתָּם
  choice: அவற்றின் கீழே
  rationale: மூலத்தின் பின்னொட்டு ஆண்பால் பன்மை. அதன் சுட்டுப்பொருள் நீராகவோ மேகத்திரள்களாகவோ புரிந்துகொள்ளப்படலாம்; “அவற்றின் கீழே” என்பது பன்மையையும் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
