  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: ta
  text: இறந்தோரின் ஆவிகள் நீருக்குக் கீழே நடுங்குகின்றன[a]; அவற்றில் வாழ்பவர்களும் நடுங்குகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறந்தோர் நீருக்குக் கீழே வேதனையில் நெளிகிறார்கள்.’ எபிரெயத்தில் רְפָאִים என்பது ‘இறந்தோர்’ அல்லது ‘நிழல்கள்’ என்றும், יְחוֹלָלוּ என்பது ‘வேதனையில் நெளிகிறார்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: இறந்தோரின் ஆவிகள்
  rationale: இங்கு இந்தச் சொல் பண்டைய ரெப்பாயீம் மக்களைக் குறிக்காமல், பாதாளத்தில் உள்ள இறந்தோரைப் பற்றிய கவித்துவக் குறிப்பாக வருகிறது. ‘இறந்தோரின் ஆவிகள்’ என்பது அந்தப் பொருளை நவீன தமிழில் தெளிவாகவும் கவித்துவ நயத்துடனும் தருகிறது.
- source_word: יְחוֹלָלוּ
  choice: நடுங்குகின்றன
  rationale: חול என்ற வேரிலிருந்து வரும் இவ்வினைச்சொல் நடுங்குதல், துடித்தல் அல்லது வேதனையில் நெளிதல் ஆகிய பொருள்களை ஏற்கலாம். கடவுளுக்கு முன் அண்டமும் பாதாளமும் அஞ்சுவதை விவரிக்கும் சூழலில் ‘நடுங்குகின்றன’ இயல்பாகப் பொருந்துகிறது; ‘வேதனையில் நெளிகின்றன’ என்பதும் சாத்தியம்.
- source_word: מִתַּחַת מַיִם
  choice: தண்ணீர்களுக்குக் கீழே
  rationale: எபிரெயச் சொற்றொடரின் இடவியல் படிமத்தை நேரடியாகப் பாதுகாக்கிறது. பன்மையான מַיִם என்பதன் கவித்துவத் தோற்றத்தை ‘தண்ணீர்கள்’ தக்கவைக்கிறது.
- source_word: וְשֹׁכְנֵיהֶם
  choice: அவற்றில் குடியிருப்போரும்
  rationale: பன்மைச் சுட்டுப்பெயர் பின்னொட்டு ‘தண்ணீர்கள்’ என்பதைக் குறிப்பதாக இயல்பாகப் புரிகிறது. ‘அவற்றில் குடியிருப்போர்’ என்பது சுட்டப்படும் இடத்தைத் தெளிவாக்கி எபிரெய இணைநிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: רְפָאִים என்பதன் குறிப்பு
  choice: பாதாளத்திலுள்ள இறந்தோரின் ஆவிகள்
  alternative: ரெப்பாயீம் என்னும் பண்டைய மக்கள்
  rationale: யோபு 26-இன் கவித்துவச் சூழல் கடவுளின் ஆளுகை பாதாளம் உட்பட அண்டத்தின் எல்லாப் பகுதிகளிலும் இருப்பதைச் சொல்கிறது. ஆகவே இங்கு இனப்பெயரைவிட இறந்தோரைக் குறிக்கும் கவித்துவப் பொருளே பொருத்தமானது.
- issue: இறுதி வினைச்சொல்லின் தமிழாக்கம்
  choice: ‘நடுங்குகின்றனர்’ என்பதைத் தெளிவுக்காக மீண்டும் வழங்குதல்
  alternative: ‘அவற்றில் குடியிருப்போரும்’ என்று வினைச்சொல்லை மறைமுகமாக விடுதல்
  rationale: எபிரெயத்தில் ஒரே வினை இரு எழுவாய்களுக்கும் பொருந்துகிறது. தமிழில் இரண்டாம் எழுவாய்க்குப் பின் வினையை மீண்டும் கூறுவது பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தண்ணீர்கள்’ என்ற பன்மை அசாதாரணமாக இருந்தாலும் மூலத்தின் அண்டவியல் படிமத்தைக் காக்கிறது. உயிரற்ற ‘ஆவிகள்’ என்பதற்கு ‘நடுங்குகின்றன’ என்றும், மனிதர்களைக் குறிக்கும் ‘குடியிருப்போர்’ என்பதற்கு ‘நடுங்குகின்றனர்’ என்றும் இயல்பான தமிழ் இயைபு பயன்படுத்தப்பட்டுள்ளது.
