revisions:
- from: இறந்தோரின் ஆவிகள் தண்ணீர்களுக்குக் கீழே நடுங்குகின்றன[a]; அவற்றில் குடியிருப்போரும் நடுங்குகின்றனர்.
  to: இறந்தோரின் ஆவிகள் நீருக்குக் கீழே நடுங்குகின்றன[a]; அவற்றில் வாழ்பவர்களும் நடுங்குகின்றனர்.
