  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עַמּוּדֵ֣י שָׁמַ֣יִם יְרוֹפָ֑פוּ וְ֝/יִתְמְה֗וּ מִ/גַּעֲרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: ta
  text: வானத்தின் தூண்கள் நடுங்குகின்றன[a]; அவருடைய கண்டிப்பினால்[c] அவை திகைத்துப்போகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசைகின்றன.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மலைத்துப்போகின்றன’ / ‘பிரமித்துப்போகின்றன.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘அவருடைய கண்டிப்பிலிருந்து’; இதற்கு ‘அவருடைய கண்டிப்பின் காரணமாக’ என்றும் பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: வானத்தின் தூண்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘வானத்தின் தூண்கள்’ என்ற கவித்துவமான அண்டவெளிப் படிமத்தை விளக்கி மாற்றாமலும், நவீன கருத்துகளுக்கு ஏற்ப தட்டையாக்காமலும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: יְרוֹפָפוּ
  choice: நடுங்குகின்றன
  rationale: רפף குறிக்கும் குலுக்கம் அல்லது அதிர்வையும், இச்சூழலிலுள்ள அச்சமும் பிரமிப்பும் கலந்த தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִתְמְהוּ
  choice: திகைத்துப்போகின்றன
  rationale: תמהּ குறிக்கும் வியப்பு, அதிர்ச்சி, மலைப்பு ஆகியவை கலந்த எதிர்வினையை இயல்பாக வெளிப்படுத்துகிறது; வெறும் ஆச்சரியமாகவோ ஒழுக்கரீதியான அருவருப்பாகவோ பொருளைக் குறுக்கவில்லை.
- source_word: מִגַּעֲרָתוֹ
  choice: அவருடைய கண்டிப்பினால்
  rationale: מִן இங்கு மூலத்தையோ காரணத்தையோ குறிக்கலாம். தமிழின் ‘-ஆல்’ உருபு கருவி/மூலம் மற்றும் காரணம் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளித்து, வாக்கியத்தை இயல்பாக வைத்திருக்கிறது.
theological_decisions:
- issue: ‘வானத்தின் தூண்கள்’ என்னும் அண்டவெளிப் படிமம்
  choice: கவித்துவமான அண்டவெளிப் படிமத்தை அப்படியே தக்கவைத்தல்
  alternative: அதை மலைகள் என்று விளக்குதல் அல்லது சொல்லாட்சியிலேயே நேரடியான பண்டைய அண்டவியல் கூற்றாக விரித்துரைத்தல்
  rationale: யோபின் கவிதை வழங்கும் படிமத்தை மொழிபெயர்ப்பு விளக்கி நீக்கவோ நவீனப்படுத்தவோ கூடாது; அதன் உண்மையான கவித்துவத் திறந்தநிலையைத் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கவிதைக்குரிய கண்ணியமுள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவை’ என்பது இரண்டாம் வினைச்சொல்லின் எழுவாயைத் தமிழில் தெளிவாக்கச் சேர்க்கப்பட்டுள்ளது; புதிய பொருள் எதுவும் சேர்க்கப்படவில்லை.
