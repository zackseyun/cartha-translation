  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: ta
  text: 'அவர் வடக்கை[a] வெறுமையின்மேல்[b] விரிக்கிறார்;

    பூமியை ஒன்றுமில்லாததின்மேல் தொங்கவிடுகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வடதிசை வானம்.’ எபிரெயத்தில் ‘வடக்கு’ என்றே உள்ளது; இந்தக் கவித்துவச் சூழலில் அது வடதிசை வானங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெற்றுவெளி.’ இதற்கான எபிரெயச் சொல் வெறுமை, பாழ்நிலை, அல்லது உருவமற்ற வெளி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: விரிக்கிறார்
  rationale: נטה என்பதன் Qal வினையெச்ச வடிவம் விரித்தல் அல்லது நீட்டுதல் என்னும் பொருளைத் தருகிறது. படைப்புலகைப் பற்றிய கவித்துவக் காட்சியை இயல்பான நவீனத் தமிழில் ‘விரிக்கிறார்’ தக்கவைக்கிறது.
- source_word: צָפוֹן
  choice: வடக்கை
  rationale: இந்தச் சொல் அடிப்படையில் ‘வடக்கு’ என்று பொருள்படும். சூழலில் வடதிசை வானத்தைக் குறிக்கக்கூடும் என்றாலும், எபிரெயச் சொல்லின் சுருக்கத்தையும் பொருள் மயக்கத்தையும் ‘வடக்கு’ காக்கிறது.
- source_word: תֹּהוּ
  choice: வெறுமை
  rationale: תֹּהוּ என்பது வெறுமை, பாழ்நிலை அல்லது உருவமற்ற வெளி ஆகிய பொருட்களை ஏற்கக்கூடியது. ‘வெறுமை’ தெளிவாகவும், சொல்லின் விரிந்த பொருள் வாய்ப்பை மிகையாகக் குறுக்காமலும் உள்ளது.
- source_word: תֹּלֶה
  choice: தொங்கவிடுகிறார்
  rationale: תלה என்பதன் Qal வினையெச்சம் தொங்கவைத்தல் அல்லது தொங்கவிடுதல் என்று பொருள்படும். பூமி எதன்மீதும் தாங்கப்படாமல் இருப்பதாக வரையப்படும் காட்சியை இது நேரடியாகத் தருகிறது.
- source_word: אֶרֶץ
  choice: பூமியை
  rationale: இந்தப் படைப்புலகச் சூழலில் אֶרֶץ ஒரு குறிப்பிட்ட நிலப்பகுதியை அல்ல, பூமியை அல்லது உலகைக் குறிக்கிறது.
- source_word: בְּלִי מָה
  choice: ஒன்றுமில்லாததின்மேல்
  rationale: בְּלִי מָה என்பதன் நேர்ப்பொருள் ‘எதுவும் இல்லாமல்/ஒன்றுமில்லாமல்’ என்பதாகும். அதற்கு முன் வரும் עַל என்பதையும் சேர்த்து, கவித்துவமான இடவியல் உருவகத்தைத் தக்கவைக்க ‘ஒன்றுமில்லாததின்மேல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל
  choice: மேல் / மீது
  rationale: 'இரு இடங்களிலும் வரும் עַל என்பதன் இடவியல் தொடர்பு தமிழில் பின்னொட்டுடன் இயல்பாக வெளிப்படுகிறது: ‘வெறுமையின்மேல்’ மற்றும் ‘ஒன்றுமில்லாததின்மேல்’.'
theological_decisions:
- issue: படைப்புலகக் காட்சிமொழி
  choice: தேவன் படைப்புலகின்மேல் கொண்ட ஆளுகையை விவரிக்கும் கவித்துவக் காட்சியாக வசனத்தை மொழிபெயர்த்தல்
  alternative: இதை விண்வெளியில் தொங்கும் பூமையைப் பற்றிய துல்லியமான நவீன அறிவியல் கூற்றாக எடுத்தல்; அல்லது ‘வடக்கு’ என்பதை விளக்கவுரை சேர்த்து வெளிப்படையான புராணக் குறிப்பாக மாற்றுதல்
  rationale: இது ஞான இலக்கியத்தின் கவித்துவ மொழி. எபிரெயத்தில் உள்ள காட்சியை எளிய உவமையாகக் குறைத்துவிடாமலும், நவீன அறிவியல் கூற்றாக மிகைப்படுத்தாமலும், புராணப் பின்னணியை வசனத்திற்குள் இறக்குமதி செய்யாமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் அதே நேரத்தில் கண்ணியமான கவித்துவ நடையுடன் வடிவமைக்கப்பட்டுள்ளது. இரண்டு இணை வாக்கியங்களின் அமைப்பும் ‘விரிக்கிறார் / தொங்கவிடுகிறார்’ என்ற நிகழ்கால வடிவங்களும் எபிரெய வினையெச்சங்களின் தொடர்ச்சியான செயற்பாட்டுக் காட்சியை வெளிப்படுத்துகின்றன.
