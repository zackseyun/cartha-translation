source:
  edition: WLC
  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: ta
  text: தமது வல்லமையால் கடலை அடக்கினார்; தமது புரிதலால் ராகாபை நொறுக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ராகாப் என்பது தேவனால் அடக்கப்படும் குழப்ப சக்தி அல்லது கடல் அரக்கனுக்கான கவித்துவப் பெயர்; இதை விளக்கமாக ‘கடல் அரக்கன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: தமது வல்லமையால்
  rationale: בְּ கருவிப்பொருளைச் சுட்டுகிறது; כֹּחַ இங்குள்ள அண்டம்சார் கவித்துவச் சூழலில் ‘வல்லமை’ என்று இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்படுகிறது.
- source_word: רָגַע
  choice: அமைதிப்படுத்தினார்
  rationale: יָם என்பதோடு வருவதால், கடலை அடக்கி ஓயச் செய்தல் என்ற பொருள் இங்கு பொருத்தமானது; ‘கலக்கினார்’ என்ற சாத்தியமான வேர் பொருளைச் சூழல் ஆதரிப்பதில்லை.
- source_word: הַיָּם
  choice: கடலை
  rationale: יָם என்பதன் நேரடியான பொருளைத் தக்கவைத்து, உண்மையான கடலையும் குழப்பத்தின் கவித்துவ உருவகத்தையும் ஒருங்கே உணர இடமளிக்கிறது.
- source_word: וּבִתְבוּנָתוֹ
  choice: தமது புரிந்துணர்வால்
  rationale: תְּבוּנָה என்பது புரிந்துகொள்ளும் ஆழ்ந்த அறிவையும் விவேகத்தையும் குறிக்கிறது; ‘புரிந்துணர்வு’ யோபின் ஞானக் கருப்பொருளையும் கருவிப்பொருள் அமைப்பையும் தக்கவைக்கிறது.
- source_word: מָחַץ
  choice: நொறுக்கினார்
  rationale: מָחַץ வலிமையாக நசுக்குதல் அல்லது உடைத்தல் என்னும் பொருளுடையது; ‘நொறுக்கினார்’ தீர்மானமான வெற்றியின் கவித்துவ வலிமையை வெளிப்படுத்துகிறது.
- source_word: רָהַב
  choice: ராகாபை
  rationale: இங்கு அது எரிகோவின் பெண்ணைக் குறிக்காமல், குழப்ப சக்தி அல்லது கடல் அரக்கனுக்கான கவித்துவப் பெயராகப் புரிந்துகொள்ளப்படுகிறது. பெயரை ஒலிபெயர்ப்பது எபிரெய உருவகத்தை விளக்கவுரையாகச் சுருக்கிவிடாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: רָהַב என்பதைத் தனிப்பெயராகவா அல்லது பொதுப்பொருள் விளக்கமாகவா மொழிபெயர்ப்பது
  choice: குழப்ப சக்தி அல்லது கடல் அரக்கனைக் குறிக்கும் ‘ராகாப்’ என்ற தனிப்பெயர்
  alternative: ‘கடல் அரக்கன்’ அல்லது ‘பெருமை’
  rationale: யோபின் கவித்துவ அண்டம்சார் சூழலில் רָהַב தேவனால் அடக்கப்படும் குழப்ப சக்தியின் உருவக எதிரியாகச் செயல்படுகிறது. ஒலிபெயர்ப்பு மூலத்தின் திட்டமிட்ட உருவகத் திறப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் சாத்தியமான பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவத்தையும் கண்ணியத்தையும் காக்கும் எளிதில் புரியக்கூடிய நடை. எபிரெய இணை அமைப்பை ‘தமது...ஆல்’ என்ற மீளுருவாக்கத்தால் தக்கவைத்துள்ளது; மரியாதைப் பன்மை வினைமுற்று தேவனைச் சுட்டும் இயல்பான தமிழ் வழக்குக்காகப் பயன்படுத்தப்பட்டுள்ளது.
