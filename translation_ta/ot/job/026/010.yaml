  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: ta
  text: நீர்ப்பரப்பின்மேல் அவர் ஒரு வட்டத்தை வரைந்தார்[a]—ஒளியும் இருளும் சந்திக்கும் எல்லைவரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர்ப்பரப்பின்மேல் அவர் ஓர் எல்லையை அமைத்தார்—ஒளியும் இருளும் சந்திக்கும் வரம்புவரை.”
    reason: חֹק חָג என்ற சொற்றொடரை வட்டம் வரைவதாகவோ, நிலையான எல்லை அமைப்பதாகவோ புரிந்துகொள்ளலாம்; இந்த உண்மையான சொற்பொருள் நுட்பத்தை மாற்று மொழிபெயர்ப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: חֹק חָג
  choice: ஒரு வட்டத்தை வரைந்தார்
  rationale: חֹק நிலையான வரம்பைக் குறிக்கவும், חָג வட்டமிடுதல் அல்லது வட்டத்தை வரைவதைக் குறிக்கவும் முடியும். இரண்டும் சேர்ந்துள்ள இக்கவித்துவப் படிமத்தை இயல்பான தமிழில் ‘ஒரு வட்டத்தை வரைந்தார்’ என்று வழங்குவது பொருத்தமானது; ‘ஒரு எல்லையை அமைத்தார்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל פְּנֵי מָיִם
  choice: நீர்ப்பரப்பின்மேல்
  rationale: פְּנֵי என்பதன் நேரடிப் படிமமான ‘முகம்/மேற்பரப்பு’ என்பதைக் காத்து, நவீனத் தமிழில் இயல்பாக ‘நீர்ப்பரப்பின்மேல்’ என வழங்கப்பட்டுள்ளது.
- source_word: עַד תַּכְלִית
  choice: எல்லைவரை
  rationale: עַד என்பது எதுவரை என்ற விரிவையும், תַּכְלִית என்பது முடிவு அல்லது வரம்பையும் குறிக்கின்றன. ‘எல்லைவரை’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: ஒளியும் இருளும் சந்திக்கும்
  rationale: எபிரெயில் சொற்சொல்லாக ‘இருளுடன் ஒளி’ என்று உள்ளது. இங்கு இரண்டின் சந்திப்பு அல்லது பிரிவு வரம்பைக் குறிக்கும் கவித்துவ உறவை, அளவுக்கு மீறி விளக்காமல் ‘ஒளியும் இருளும் சந்திக்கும்’ எனத் தருகிறது.
