  yaml_path: translation/ot/job/026/002.yaml
  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: ta
  text: வலிமையற்றவனுக்கு நீ எவ்வளவு உதவியிருக்கிறாய்! பலமில்லாத புயத்தை நீ எவ்வளவு காப்பாற்றியிருக்கிறாய்![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “வலிமையற்ற ஒருவனுக்கு நீ என்ன உதவி செய்தாய்? பலமில்லாத புயத்தை நீ எப்படிக் காப்பாற்றினாய்?” எபிரெய வாசகம் கூர்மையான ஏளனத் தொனியுடையது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  choice: எவ்வளவாய்
  rationale: இங்கு מֶה சாதாரணமாக ‘என்ன?’ என்று தகவல் கேட்பதல்ல; பில்தாத்தை நோக்கிய கூர்மையான ஏளன வியப்பைக் குறிக்கிறது. ‘எவ்வளவாய்’ என்பது அந்த வியப்பையும் இரு இணைவரிகளின் ஏளனத் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָזַרְתָּ
  choice: உதவியிருக்கிறாய்
  rationale: עזר என்பதன் நேரான பொருள் ‘உதவு’. எபிரெய நிறைவுவினையின் முடிந்த செயலும் தற்போதைய உரையாடலில் அதற்குள்ள தாக்கமும் தமிழின் ‘உதவியிருக்கிறாய்’ வடிவில் பொருத்தமாக வெளிப்படுகின்றன.
- source_word: לְלֹא כֹחַ
  choice: வலிமையற்றவனுக்கு
  rationale: ‘வலிமை இல்லாத ஒருவனுக்கு’ என்ற ஒருமை மனிதக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பொதுவான பன்மைப் பொருளாக மாற்றப்படவில்லை.
- source_word: הוֹשַׁעְתָּ
  choice: காப்பாற்றியிருக்கிறாய்
  rationale: ישע என்பதன் ‘காப்பாற்று/விடுவி’ என்ற மையப் பொருளை ‘காப்பாற்று’ தெளிவாகத் தருகிறது; முதல் வரியோடு இணையும் ஏளன நிறைவுவினை வடிவமும் பேணப்படுகிறது.
- source_word: זְרוֹעַ
  choice: புயத்தை
  rationale: ‘புயம்’ என்பது வல்லமைக்கான எபிரெய உருவகத்தை ‘வலிமை’ என்று விளக்கி மறைக்காமல், கவிதைநயத்துடன் காக்கிறது.
- source_word: לֹא עֹז
  choice: பலமில்லாத
  rationale: עֹז என்பதன் ‘பலம்/வல்லமை’ என்ற பொருளைத் தருகிறது; முந்தைய כֹחַ உடனான பொருள் இணைப்பைப் பேணியபடியே ஒரே சொல்லை இயந்திரமாக மீண்டும் பயன்படுத்துவதைத் தவிர்க்கிறது.
