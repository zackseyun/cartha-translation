lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: கால் வடிவிலுள்ள ענה இங்கு முந்தைய உரைக்குப் பதிலளிப்பதைக் குறிக்கிறது. ‘மறுமொழியாக’ என்பது உரையாடல் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: இப்பெயர் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவத்தின்படி எழுதப்பட்டுள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: ענה-க்குப் பின்வரும் אמר எபிரெய மொழியின் வழக்கமான உரை அறிமுகச் சூத்திரம். ‘மறுமொழியாகச் சொன்னார்’ என இரு வினைகளின் கூறுகளும் பாதுகாக்கப்படுகின்றன; அதேவேளை தமிழ் இயல்பும் பேணப்படுகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் உரையாடல் நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. ‘அப்போது’ நிகழ்வரிசையை இயல்பான தமிழில் உணர்த்துகிறது.
