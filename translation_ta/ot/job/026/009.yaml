source:
  edition: WLC
  text: מְאַחֵ֥ז פְּנֵי כִסֵּ֑ה פַּרְשֵׁ֖ז עָלָ֣י/ו עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: ta
  text: அவர் தமது அரியணையின் முகப்பை மறைக்கிறார்[a][b]; அதன்மேல் தமது மேகத்தை விரிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அரியணையின் முகப்பைப் பற்றிப் பிடிக்கிறார்.” எபிரெய வினைச்சொல் பொதுவாக “பற்றிக்கொள்,” “பிடித்திரு” என்று பொருள்படும்; இங்கு அடுத்த வரியில் மேகத்தை விரிப்பதாகக் கூறப்படுவதால், “மறைத்தல்” என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “அரியணையின் முகப்பு”; “தமது” என்பது வெளிப்படையாக இல்லை. சூழலும் “தமது மேகம்” என்ற தொடரும் அது தேவனுடைய அரியணை என்பதை உணர்த்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: மறைத்து
  rationale: אחז என்பதன் அடிப்படைப் பொருள் ‘பற்றிக்கொள்’ அல்லது ‘பிடித்திரு.’ ஆனால் அடுத்த அடியில் மேகத்தை அதன்மேல் விரிப்பதாக வருவதால், இங்கு அரியணையைப் பார்வையிலிருந்து மறைக்கும் செயல் குறிக்கப்படுவது இயல்பானது. அடிப்படைச் சொல்லின் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: פְּנֵי
  choice: முகப்பை
  rationale: פנים என்பதன் ‘முகம்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, அரியணையின் காணக்கூடிய முன்புறம் அல்லது மேற்பரப்பு என்ற பொருளை இயல்பான தமிழில் ‘முகப்பு’ தெரிவிக்கிறது.
- source_word: כִסֵּה
  choice: தமது அரியணையின்
  rationale: כִּסֵּא என்பது ‘அரியணை.’ எபிரெயத்தில் இங்கு உடைமைச் சுட்டு வெளிப்படையாக இல்லாவிட்டாலும், இறுதியில் வரும் ‘அவரது மேகம்’ என்பதும் சூழலில் தேவனே எழுவாய் என்பதும் இது அவருடைய அரியணை என்பதை உணர்த்துகின்றன; இதைத் தமிழில் ‘தமது’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: פַּרְשֵׁז
  choice: விரிக்கிறார்
  rationale: இந்த வடிவம் ‘விரி, பரப்பு’ என்ற செயலைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்தில் நிகழ்கால வினையாக அமைப்பது எபிரெயக் கவிதையின் இணையான இரு செயல்களையும் தெளிவாக்குகிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன்னுள்ள ‘அரியணை’யைக் குறிப்பதாக இயல்பாகப் புரிகிறது. தமிழில் உயிரற்ற பொருளைக் குறிக்க ‘அதன்மேல்’ பொருத்தமானது.
- source_word: עֲנָנוֹ
  choice: தமது மேகத்தை
  rationale: ஒருமை பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு உள்ளது. எழுவாய் தேவன் என்பதால் மரியாதை ஒருமையில் ‘தமது மேகம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மறைக்கப்படுவது தேவனுடைய சொந்த அரியணையா என்பது
  choice: தேவன் தமது மேகத்தால் தமது அரியணையை மறைப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: எபிரெயத்தின் வெளிப்படையான வடிவத்தை நெருக்கமாகப் பின்பற்றி, உடைமைச் சொல்லின்றி ‘அரியணை’ என்று மட்டும் கூறலாம்.
  rationale: எபிரெயத்தில் ‘அரியணை’ என்பதற்கு உடைமைப் பின்னொட்டு இல்லை. ஆயினும் தேவனே மறைமுக எழுவாய் என்பதும் ‘அவரது மேகம்’ என்ற வெளிப்படையான உடைமைக் குறிப்பும் அரியணையும் அவருக்குரியது என்பதைச் சூழலில் உணர்த்துகின்றன. தமிழ் வாசகத் தெளிவுக்காக ‘தமது’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- issue: מְאַחֵז என்பது பிடித்தலைக் குறிக்கிறதா, மறைத்தலைக் குறிக்கிறதா என்பது
  choice: மேகத்தை விரிக்கும் இணைவரியின் அடிப்படையில் ‘மறைத்து’ என்று பிரதான உரையில் தரப்பட்டது.
  alternative: ‘அரியணையின் முகப்பைப் பற்றிப் பிடித்து’ அல்லது ‘பிடித்துவைத்து’ என்று நேரடியாக மொழிபெயர்க்கலாம்.
  rationale: வினையின் வழக்கமான அடிப்படைப் பொருள் ‘பற்று/பிடி’ என்பதே; எனினும் இக்கவித்துவச் சூழல் மறைத்தல் அல்லது மூடுதல் என்ற விளைவை வலியுறுத்துகிறது. சொற்பொருள் சாத்தியத்தை நீக்காமல் அடிக்குறிப்பில் வைத்திருப்பது மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணையின் முகப்பு’ என்பது எபிரெய உருவகத்தைத் தக்கவைத்தும் சாதாரண வாசகருக்குப் புரியும்படியும் உள்ளது. தேவனைக் குறிக்கும் இடங்களில் மரியாதை ஒருமையான ‘அவர்/தமது’ பயன்படுத்தப்பட்டுள்ளது.
