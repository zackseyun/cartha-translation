base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: ta
  text: இதோ, இவை அவருடைய வழிகளின் ஓரங்கள்[a] மட்டுமே! அவரைப்பற்றி நாம் கேட்பது எவ்வளவு மெல்லிய கிசுகிசுப்பு[b]! ஆனால் அவருடைய வல்லமையின் இடிமுழக்கத்தை யாரால் புரிந்துகொள்ள முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய வழிகளின் முனைகள்/விளிம்புகள்.” கடவுள் செய்வதில் மிக வெளிப்புறமான பகுதிகள் மட்டுமே இங்கு பார்வைக்கு வருகின்றன என்பதை எபிரெயச் சொல் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைப்பற்றி நாம் கேட்பது எவ்வளவு மங்கலான ஒரு குறிப்பு!” அரிதான எபிரெயத் தொடர், அவருடைய வல்லமையின் “இடிமுழக்கத்துடன்” ஒப்பிடும்போது கேட்கப்படுவது எவ்வளவு சிறியது என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தும் இடைச்சொல்லின் ஆற்றலை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: קְצוֹת
  choice: ஓரங்கள்
  rationale: முனைகள் அல்லது வெளிப்புற விளிம்புகள் என்ற பொருளைத் தருகிறது; கடவுளுடைய செயல்பாடுகளில் மனிதருக்குப் புலப்படுவது மிக வெளிப்புறமான சிறு பகுதியே என்ற கவித்துவக் கருத்தைப் பாதுகாக்கிறது.
- source_word: דרכיו
  choice: அவருடைய வழிகள்
  rationale: கடவுள் செயல்படும் விதத்தைக் குறிக்கும் எபிரெய உருவகத்தை மிகையாக விளக்காமல் தக்கவைக்கிறது.
- source_word: שֵׁמֶץ דָּבָר
  choice: மெல்லிய முணுமுணுப்பு
  rationale: அரிதான இத்தொடர் மிகச் சிறிய அளவையும் மங்கலான ஒலியையும் உணர்த்துகிறது; 'கேட்பது' என்பதோடும் பின்னுள்ள 'இடிமுழக்கம்' என்பதோடும் இயல்பான ஒலியியல் எதிர்மறையை உருவாக்குகிறது.
- source_word: נִשְׁמַע בּוֹ
  choice: அவரைப்பற்றி நாம் கேட்பது
  rationale: மனிதர்கள் கடவுளைப்பற்றிக் கேட்டு அறியும் அளவு மிகக் குறைவு என்பதே சூழலின் கருத்து; 'அவரிடமிருந்து' என்று நேரடி உரையை உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: רַעַם גבורתו
  choice: அவருடைய வல்லமையின் இடிமுழக்கம்
  rationale: இடி என்ற செவிப்புலப் படிமத்தையும் கடவுளுடைய பெருவல்லமையையும் பாதுகாத்து, மெல்லிய முணுமுணுப்புடன் உள்ள கவித்துவ எதிர்மறையைத் தக்கவைக்கிறது.
- source_word: יִתְבּוֹנָן
  choice: புரிந்துகொள்ளக்கூடியவர்
  rationale: ஆழ்ந்து உணர்தல் அல்லது பகுத்தறிதல் என்ற வினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; வினாவடிவம் மனித வரம்பை வலியுறுத்துகிறது.
theological_decisions:
- issue: கடவுளைப்பற்றிய மனித அறிவின் எல்லை
  choice: மனிதருக்குப் புலப்படுபவை கடவுளுடைய வழிகளின் வெளிப்புற ஓரங்கள் மட்டுமே என்று கவிதை கூறுகிறது.
  alternative: இதைப் படைப்பில் காணப்படும் கடவுளுடைய செயல்களை மட்டும் குறிக்கும் குறுகிய கூற்றாக வாசிக்கலாம்.
  rationale: உடனடி சூழல் கடவுளுடைய அண்டச் செயல்களை விவரிக்கிறது. இருப்பினும் வசனம் அவரது 'வழிகள்' மற்றும் 'வல்லமை' என்று பரந்த கவித்துவ மொழியைப் பயன்படுத்துவதால், அதை கடவுளுடைய முழு இருப்பைப் பற்றிய முறையான தத்துவக் கூற்றாகவும், படைப்புச் செயல்களுக்கு மட்டுமே கட்டுப்பட்ட கூற்றாகவும் மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “மெல்லிய முணுமுணுப்பு” மற்றும் “இடிமுழக்கம்” என்ற செவிப்புல எதிர்மறை பாதுகாக்கப்பட்டுள்ளது; “மட்டுமே” என்பது קְצוֹת என்ற ‘வெளிப்புற ஓரங்கள்’ கருத்தையும் வசனத்தின் மொத்த வலியுறுத்தலையும் தமிழில் தெளிவாக்குகிறது.
