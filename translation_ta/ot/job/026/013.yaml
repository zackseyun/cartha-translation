  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: ta
  text: 'அவருடைய மூச்சினால்[a] வானங்கள் பொலிவூட்டப்பட்டன;

    அவருடைய கை தப்பியோடும் பாம்பை[c] துளைத்தது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய ஆவியினால்’ அல்லது ‘அவருடைய காற்றினால்.’ எபிரெயச் சொல் மூச்சு, காற்று, ஆவி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய கை தப்பியோடும் பாம்பை உருவாக்கியது.’ இங்குள்ள வினைச்சொல்லை வேறு விதமாகவும் புரிந்துகொள்ளலாம்; ஆயினும் ‘துளைத்தது’ என்பது இவ்வரியின் போராட்டப் படிமத்துக்கு நன்கு பொருந்துகிறது.
    reason: alternative_reading
  - marker: c
    text: ‘தப்பியோடும் பாம்பு’ என்பது அண்டக் குழப்பத்தை உருவகிக்கும் பாம்பை நினைவூட்டக்கூடும்; ஏசாயா 27:1-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: அவருடைய மூச்சினால்
  rationale: רוּחַ என்பதற்கு ‘மூச்சு,’ ‘காற்று,’ ‘ஆவி’ ஆகிய பொருள்கள் உண்டு. இங்குள்ள படைப்பாற்றலைச் சித்தரிக்கும் கவிதை மொழியில் ‘மூச்சு’ உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது; בְּ என்ற முன்னொட்டு கருவிப்பொருளை, அதாவது ‘மூலம்/ஆல்’ என்பதைக் குறிக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: உயர்ந்த கவிதைநடையிலும் அண்டம் சார்ந்த சூழலிலும் எபிரெயப் பன்மை வடிவத்தை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: שִׁפְרָה
  choice: பொலிவுபெற்றன
  rationale: שׁפר என்ற வேர் அழகு, பொலிவு, ஒளிமை ஆகிய கருத்துகளைத் தருகிறது. ‘பொலிவுபெற்றன’ என்பது அழகாக்கப்பட்ட விளைவையும் கவிதைத் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: חֹלֲלָה
  choice: குத்தித் துளைத்தது
  rationale: חול என்ற வினை இக்கவிதைப் பயன்பாட்டில் துளைத்தல், உருவாக்குதல், நெளியச் செய்தல் போன்ற விதங்களில் புரிந்துகொள்ளப்படலாம். ‘அவருடைய கை’ எழுவாயாகவும் பாம்பு செயப்படுபொருளாகவும் இருப்பதால், போராட்டப் படிமத்திற்கு ஏற்ற பகைமைச் செயலை ‘குத்தித் துளைத்தது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יָדוֹ
  choice: அவருடைய கை
  rationale: மூலத்தின் தெளிவான உடல் சார்ந்த படிமத்தைப் பாதுகாக்கிறது; கவிதையில் இது செயல்படும் வல்லமையையும் உணர்த்துகிறது.
- source_word: נָחָשׁ בָּרִיחַ
  choice: தப்பியோடும் பாம்பு
  rationale: בָּרִיחַ என்பது தப்பியோடும், விரைந்து செல்லும், நீண்டமைந்த போன்ற பொருள்களைத் தரக்கூடும். ஏசாயா 27:1-இல் உள்ள ஒத்த அண்டப் போராட்டப் படிமத்தோடு ‘தப்பியோடும் பாம்பு’ நன்கு பொருந்துகிறது; அதன் அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிப்பதையும் தவிர்க்கிறது.
theological_decisions:
- issue: רוּחַ என்பதை தனிப்பட்ட திரித்துவக் குறிப்பாக ‘ஆவி’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: முதன்மை உரையில் ‘மூச்சு’
  alternative: ‘ஆவி’ அல்லது ‘காற்று’
  rationale: இவ்வசனம் கடவுளுடைய படைப்பாற்றலைக் கவிதையாகக் கூறுகிறது. ‘ஆவி’ என்பது சாத்தியமான பொருள் என்றாலும், தனிப்பட்ட தெய்வீக நபரைக் குறிக்கிறது என்று எபிரெயம் கட்டாயப்படுத்தவில்லை. ஆகவே இறையியல் முடிவை உரைக்குள் சேர்க்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: נָחָשׁ בָּרִיחַ என்பதை சாத்தான் அல்லது லெவியாதான் என்று வெளிப்படையாக அடையாளப்படுத்த வேண்டுமா
  choice: ‘தப்பியோடும் பாம்பு’ என்ற மூலப் படிமம் தக்கவைக்கப்பட்டது
  alternative: லெவியாதான்; அண்டக் குழப்பத்தை உருவகிக்கும் பாம்பு; சாத்தான்
  rationale: இங்கு அண்டப் போராட்டத்தை நினைவூட்டும் கவிதைப் படிமம் உள்ளது; ஆனால் இந்த வசனம் பாம்பைச் சாத்தான் அல்லது லெவியாதான் என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை. எனவே மூலத்தின் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கவிதைக்குரிய கண்ணியத்தையும் சுருக்கத்தையும் பேணும் நடை. ‘பொலிவுபெற்றன’ அழகும் ஒளிமையும் சேர்ந்த பொருள்வெளியைத் தக்கவைக்கிறது; ‘குத்தித் துளைத்தது’ போராட்டப் படிமத்தை நேரடியாக வெளிப்படுத்துகிறது.
