  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: ta
  text: ஷியோல் அவருக்கு முன் நிர்வாணமாகக் கிடக்கிறது[a]; அபத்தோனுக்கு[b] மூடுதலே இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஷியோல் அவருக்கு முன் மறைவின்றி வெளிப்பட்டிருக்கிறது.”
    reason: lexical_alternative
  - marker: b
    text: “அபத்தோன்” என்பதை “அழிவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: நிர்வாணமாகக் கிடக்கிறது
  rationale: ‘நிர்வாணமான, வெறுமையான, வெளிப்பட்ட’ என்னும் அடிப்படைப் பொருளையும், அடுத்த அடியிலுள்ள ‘மூடுதல்’ என்ற உருவகத்துடனான இணைப்பையும் காக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இது வெறும் தனிப்பட்ட கல்லறையைக் குறிப்பதல்ல; இறந்தோரின் மறைவிடத்தைக் குறிக்கும் எபிரெயக் கருத்துலகச் சொல்லாக இருப்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: נֶגְדּוֹ
  choice: அவருக்கு முன்
  rationale: ‘அவருக்கு முன்னால், அவரது முன்னிலையில்’ என்ற எபிரெயச் சொல்லின் நேரான பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் ‘அவர்’ கடவுளைக் குறிக்கிறார்.
- source_word: אֵין
  choice: இல்லை
  rationale: இல்லாமையைக் குறிக்கும் எபிரெய அமைப்பை, ‘அபத்தோனுக்கு மூடுதல் இல்லை’ என்ற இயல்பான தமிழ் உடைமை அமைப்பில் தருகிறது.
- source_word: כְּסוּת
  choice: மூடுதல்
  rationale: மூடி மறைக்கும் போர்வை அல்லது மறைப்பு என்ற பொருளைக் காத்து, முதல் அடியிலுள்ள ‘நிர்வாணமாக’ என்ற உருவகத்தோடு இணைகிறது.
- source_word: אֲבַדּוֹן
  choice: அபத்தோன்
  rationale: இச்சொல் ‘அழிவு’ எனப் பொருள்படலாம்; ஆனால் இங்கு ஷியோலுக்கு இணையான ஓர் இடப்பெயர்போல் கவிதையில் வருவதால் ஒலிபெயர்ப்பு அதன் உருவக வலிமையையும் தனித்துவத்தையும் காக்கிறது.
theological_decisions:
- issue: נֶגְדּוֹ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதியின் சுட்டுப்பொருள்
  choice: சூழலின்படி கடவுளைக் குறிக்கும் ‘அவருக்கு முன்’
  alternative: உடனடி உரையாடலில் குறிப்பிடப்படாத வேறொரு பார்வையாளருக்கு முன்
  rationale: சுற்றியுள்ள வசனங்கள் மறைந்த உலகங்கள்மீதான கடவுளின் அறிவையும் ஆற்றலையும் விவரிக்கின்றன. அதேவேளையில், பெயரைச் சேர்த்து விளக்காமல் எபிரெயின் சுட்டுப்பெயர் அமைப்பு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கேற்ற, கவிதைநயம் கொண்ட கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஷியோல்’, ‘அபத்தோன்’ ஆகிய மூலமொழிக் கருத்துலகச் சொற்கள் ஒலிபெயர்க்கப்பட்டு, தேவையான பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
