  text: מַה יָּ֭עַצְתָּ לְ/לֹ֣א חָכְמָ֑ה וְ֝/תוּשִׁיָּ֗ה לָ/רֹ֥ב הוֹדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/003.yaml
  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: ta
  text: ஞானமில்லாதவனுக்கு நீ எப்படியெல்லாம் ஆலோசனை கூறினாய்[a]! நல்லறிவை எவ்வளவு மிகுதியாக அறியச் செய்தாய்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானமில்லாதவனுக்கு நீ என்ன ஆலோசனை கூறினாய்? நல்லறிவை எவ்வளவு மிகுதியாக அறியச் செய்தாய்!” எபிரெயத் தொடக்கச் சொல்லை “என்ன” என்றும் வியப்புத் தொனியில் “எப்படியெல்லாம்” என்றும் புரிந்துகொள்ளலாம்; முதன்மை உரை யோபின் கிண்டலைப் பிரதிபலிக்கும் வியப்புக் கூற்றைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: எவ்வளவு நன்றாக / எவ்வளவு மிகுதியாக
  rationale: இங்கு מַה கேள்விச் சொல்லாக மட்டுமல்லாமல் வியப்புத் தொனியுடைய கிண்டலை அறிமுகப்படுத்துகிறது. தமிழில் ‘எவ்வளவு’ என்ற அமைப்பு அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது; முதல் அடியில் ‘நன்றாக’ என்பது சூழலிலுள்ள கிண்டலைத் தெளிவாக்குகிறது.
- source_word: יָּעַצְתָּ
  choice: ஆலோசனை கொடுத்தாய்
  rationale: יעץ என்பதன் அடிப்படைப் பொருள் ‘ஆலோசனை கூறுதல்/கொடுத்தல்’. நவீனத் தமிழில் இயல்பாகவும் ஞான இலக்கியத்துக்கேற்ற கண்ணியமான நடையிலும் உள்ளது.
- source_word: לְלֹא חָכְמָה
  choice: ஞானமில்லாதவனுக்கு
  rationale: לְ உடன் வரும் ‘ஞானம் இல்லாத’ என்ற எபிரெய அமைப்பைத் தமிழில் மறைமுகமான மனிதப் பெறுநராக இயல்பாக வெளிப்படுத்துகிறது; அது யார் என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: ஞான இலக்கியத்தில் நிலையான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: וְתוּשִׁיָּה
  choice: ஆழ்ந்த ஞானம்
  rationale: תּוּשִׁיָּה என்பது செயல்திறமிக்க உறுதியான ஞானம், வளமான அறிவுத்திறன், அல்லது நல்ல தீர்மானம் ஆகிய நிழற்பொருள்களைக் கொண்டது. ‘ஆழ்ந்த ஞானம்’ இதை வாசிக்க எளிதான தமிழில் வேறுபடுத்திக் காட்டுகிறது; வெறும் ‘வெற்றி’ என்று குறுக்கவில்லை.
- source_word: לָרֹב
  choice: மிகுதியாக
  rationale: அறியப்படுத்தப்பட்டதன் அளவை வலியுறுத்தும் ‘மிகுதியாக/பெருமளவில்’ என்ற பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: הוֹדָעְתָּ
  choice: தெரியப்படுத்தினாய்
  rationale: ידע என்பதன் ஹிஃபில் வடிவான ‘அறியச் செய்தல்’ என்பதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: யோபின் கூற்றிலுள்ள கிண்டல்
  choice: வியப்புக் கூற்றின் வடிவிலும் சூழலால் உணரப்படும் கிண்டலுடனும் மொழிபெயர்க்கப்பட்டது.
  alternative: நேரடியான கேள்வியாக அல்லது வெளிப்படையாக ‘கிண்டலாக’ என்ற விளக்கத்தைச் சேர்த்தல்.
  rationale: மூல எபிரெயம் கிண்டலை விளக்கமாகச் சொல்லாமல் வியப்புக் கட்டமைப்பிலும் சூழலிலும் வெளிப்படுத்துகிறது. அதே இலக்கிய இறுக்கத்தைத் தமிழிலும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்குப் புரியும் நடை. எபிரெய இணை அமைப்பு இரண்டு வியப்புக் கூற்றுகளாக வைக்கப்பட்டுள்ளது. ‘நன்றாக’ என்பது முதல் அடியின் தமிழ்ச் சொற்றொடரை இயல்பாக்கி கிண்டலை உணர்த்துகிறது; அடிக்குறிப்பு מַה என்பதன் ‘என்ன/எவ்வளவு’ தெளிவின்மையைப் பாதுகாக்கிறது.
