id: JOB.26.4
reference: Job 26:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶת מִ֭י הִגַּ֣דְתָּ מִלִּ֑ין וְ/נִשְׁמַת מִ֝י יָצְאָ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: ta
  text: நீ யாருக்கு வார்த்தைகளை அறிவித்தாய்? உன்னிடமிருந்து வெளிவந்தது யாருடைய மூச்சு[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னிடமிருந்து வெளிவந்தது யாருடைய ஆவி?” எபிரெயச் சொல் “மூச்சு” என்றும், சில சூழல்களில் “ஆவி” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: யாருக்கு
  rationale: אֶת followed by the interrogative identifies the person to whom or for whom the words were declared. In this rhetorical question, ‘யாருக்கு’ is idiomatic and preserves that relation.
- source_word: הִגַּדְתָּ
  choice: அறிவித்தாய்
  rationale: The Hiphil of נגד means to tell, declare, or make known. ‘அறிவித்தாய்’ is natural, dignified Tamil and retains the sense of communicating something to another.
- source_word: מִלִּין
  choice: வார்த்தைகளை
  rationale: This Aramaizing plural in Job refers to spoken words or utterances. ‘வார்த்தைகளை’ is direct and readily understandable.
- source_word: וְנִשְׁמַת מִי
  choice: யாருடைய மூச்சு
  rationale: נשמה most concretely denotes breath or life-breath, while also allowing the sense ‘spirit’ in some contexts. ‘யாருடைய மூச்சு’ preserves the concrete image and the possessive force of מִי.
- source_word: יָצְאָה מִמֶּךָּ
  choice: உன்னிடமிருந்து வெளிவந்தது
  rationale: יצא denotes going or coming out. This rendering preserves the poetic picture of breath—or spirit—proceeding from the addressee.
theological_decisions:
- issue: Whether נְשָׁמָה means ‘breath’ or ‘spirit’ here
  choice: மூச்சு
  alternative: ஆவி
  rationale: The verb ‘came out from you’ supports the concrete image of breath associated with speech, but the Hebrew can also suggest spirit or inspiration. The main text keeps the concrete sense, and the footnote preserves the genuine lexical and theological ambiguity.
translation_notes:
  register: Modern standard Tamil with a dignified poetic tone. The two direct rhetorical questions preserve Job’s pointed challenge without adding an interpretive identification of whose breath or spirit is meant.
