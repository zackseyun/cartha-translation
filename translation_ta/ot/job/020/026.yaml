  source_fidelity: முதல் வாக்கியத்தில் ‘அவனுக்காக’ என்பது לִצְפּוּנָיו-இன் சாத்தியமான பொருளில் ஒன்று; ஆனால் முதன்மை உரை ‘அவனுக்காக ... சேமித்து’ எனத் தெளிவுபடுத்துவதால், ‘அவனுடைய மறைவான சேமிப்புகளுக்காக/அவற்றில்’ என்ற மற்ற முக்கியமான வாசிப்பு உரைக்கு வெளியே செல்கிறது. அடிக்குறிப்பு இதைச் சரியாகக் குறிக்கிறது. மூன்றாம் வாக்கியத்தில் יֵרַע-ன் அடிப்படைப் பொருள் ‘தீங்கு செய்யும்’; ‘அழிக்கும்’ என்பது சாத்தியமான சூழல்சார் விளக்கமாக இருந்தாலும் சற்றே வலுப்படுத்துகிறது. ‘தீங்கு செய்யும்’ மூலம் மூலத்தின் திறந்த தன்மை சிறப்பாகக் காக்கப்படும்.
  naturalness: நடை நவீனத் தமிழில் இயல்பாகவும் கவித்துவத் தீவிரத்துடனும் உள்ளது. ‘இருள் அனைத்தும்’ என்பதற்குப் பதில் ‘எல்லா இருளும்’ என்பது பொதுத்தமிழில் இன்னும் சீராக அமையும். ‘எஞ்சியிருப்பதை’ என்பது பொருள்/நபர் என்ற இரட்டை வாய்ப்பை ஓரளவு காக்கிறது; ஆனால் ‘எஞ்சியதற்கு’ எனத் தத்துவ/கவிதை நடையில் அமைத்தால் יֵרַע-உடன் நன்றாக இணையும்.
  terminology: ‘கூடாரம்,’ ‘நெருப்பு,’ ‘விழுங்கும்’ ஆகியவை பொருத்தமானவை. ‘ஊதப்படாத நெருப்பு’ மூலப் படிமத்தை நன்றாகப் பாதுகாக்கிறது. அடிக்குறிப்பு b-யில் ‘விசிறிவிடப்படாத’ என்பதற்குப் பதில் ‘ஊதி விசிறப்படாத’ அல்லது ‘ஊதிக் கொழுந்துவிடச் செய்யப்படாத’ என்பதே வழக்கமானது; இருப்பினும் விளக்கத்தைச் சுருக்கமாக வைத்தல் நல்லது.
