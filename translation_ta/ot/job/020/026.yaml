source:
  edition: WLC
  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: ta
  text: எல்லா இருளும் அவனுக்காகச் சேமித்து வைக்கப்பட்டுள்ளது[a]; ஊதப்படாத நெருப்பு அவனை விழுங்கும்[b]; அவனுடைய கூடாரத்தில் எஞ்சியதற்கு அது தீங்கு செய்யும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய மறைவான சேமிப்புகளுக்காக எல்லா இருளும் பதுக்கப்பட்டுள்ளது.’ எபிரெயச் சொற்றொடர் கடினமானது; அவனுக்காக ஒதுக்கப்பட்ட பேரிடரையோ, அவன் மறைத்து வைத்த சேமிப்புகளையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘ஊதப்படாத நெருப்பு’ என்பது மனித மூச்சால் மூட்டப்படாத அல்லது விசிறப்படாத நெருப்பைக் குறிக்கலாம்; தெய்வீகமாக அனுப்பப்பட்ட நெருப்பு என்ற உட்குறிப்பும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவனுடைய கூடாரத்தில் தப்பியவனுக்கு அது தீங்கு செய்யும்’ / ‘அவனுடைய கூடாரத்தில் எஞ்சியவர்களை அது விழுங்கும்.’
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: இருள் அனைத்தும்
  rationale: ‘இருள்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, முழுமையைக் குறிக்கும் כָּל என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் இது பேரிடர் அல்லது தீர்ப்பைச் சுட்டலாம்.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: அவனுக்காக ... சேமித்து வைக்கப்பட்டுள்ளது
  rationale: இந்தக் கடினமான சொற்றொடரில் உள்ள மறைத்து வைக்கப்படுதல், எதிர்காலத்திற்காக ஒதுக்கப்படுதல் ஆகிய இரு நிழற்பொருள்களையும் இயன்றவரை வெளிப்படுத்துகிறது.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: நெருப்பு அவனை விழுங்கும்
  rationale: ‘உண்ணும்’ என்ற மூல வினையின் வலிமையையும் அழிக்கும் நெருப்பின் கவித்துவப் படிமத்தையும் ‘விழுங்கும்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: לֹא נֻפָּח
  choice: ஊதப்படாத
  rationale: நெருப்பை ஊதி மூட்டுதல் அல்லது விசிறிவிடுதல் என்ற படிமத்தை நேரடியாகப் பாதுகாக்கிறது; மனிதனால் மூட்டப்படாத நெருப்பு என்ற உட்குறிப்பை உரையிலேயே விரிவாக்கவில்லை.
- source_word: יֵרַע שָׂרִיד
  choice: எஞ்சியிருப்பதை அது அழிக்கும்
  rationale: יֵרַע என்பதன் ‘தீங்கு செய்யும்’ பொருளையும் שָׂרִיד என்பதன் ‘எஞ்சியது/தப்பியவர்’ என்ற தெளிவின்மையையும் கருத்தில் கொண்டு, நெருப்பின் சூழலுக்கு ஏற்ற பொதுவான அழிவுப் பொருள் தரப்படுகிறது.
- source_word: בְּאָהֳלוֹ
  choice: அவனுடைய கூடாரத்தில்
  rationale: ‘கூடாரம்’ என்ற நேரடியான, கவித்துவமான படிமத்தைத் தக்கவைக்கிறது; அது வீடு அல்லது குடும்பத்தையும் குறிக்கக்கூடும்.
theological_decisions:
- issue: ஊதப்படாத நெருப்பின் தோற்றம்
  choice: மூலத்தின் ‘ஊதப்படாத’ என்ற படிமம் மட்டும் உரையில் வைக்கப்பட்டது.
  alternative: ‘தேவனால் அனுப்பப்பட்ட நெருப்பு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: தெய்வீகத் தீர்ப்பு என்ற உட்குறிப்பு இருக்கலாம்; ஆனால் மூல எபிரெயம் அதை நேரடியாகக் கூறாததால் அந்தத் தத்துவ விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: கூடாரத்தில் எஞ்சியது யார் அல்லது எது
  choice: ‘எஞ்சியிருப்பதை’ என்ற பொதுவான வடிவம்.
  alternative: ‘தப்பியவனை’ அல்லது ‘மீதியானவர்களை’ என்று ஆளைக் குறித்தல்.
  rationale: שָׂרִיד என்பது உயிர்தப்பியவர் அல்லது எஞ்சியவை/மீதம் ஆகியவற்றைக் குறிக்கலாம்; மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் யோபின் கவித்துவத் தீவிரத்தையும் ‘இருள்’, ‘நெருப்பு’, ‘கூடாரம்’ ஆகிய நேரடி படிமங்களையும் காக்கும் கண்ணியமான நடை. கடினமான எபிரெயச் சொற்றொடர்களின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டுள்ளது.
