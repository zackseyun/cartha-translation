  text: רֹאשׁ פְּתָנִ֥ים יִינָ֑ק תַּֽ֝הַרְגֵ֗/הוּ לְשׁ֣וֹן אֶפְעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: ta
  text: 'நாகப்பாம்புகளின்[b] நஞ்சை[a] அவன் உறிஞ்சுவான்;

    விரியன் பாம்பின் நாக்கு அவனைக் கொல்லும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாகப்பாம்புகளின் விஷம்.” எபிரெய மொழியில் நேரடியாக “நாகப்பாம்புகளின் தலை”; இச்சூழலில் “தலை” என்பது நஞ்சைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரிய மொழிபெயர்ப்புகளில் வேறு சில நச்சுப்பாம்புப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; இங்கு குறிக்கப்படும் துல்லியமான பாம்பு வகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: நஞ்சு
  rationale: இந்தச் சொல் பொதுவாக ‘தலை’ என்று பொருள்பட்டாலும், நச்சுப்பாம்பையும் இணைவரியில் வரும் கொல்லும் நாக்கையும் குறிக்கும் இச்சூழலில் மரபுத்தொடராக ‘நஞ்சு’ என்று பொருள்படுகிறது.
- source_word: פְּתָנִים
  choice: நாகப்பாம்புகள்
  rationale: இது நச்சுப்பாம்பு வகையைக் குறிக்கிறது. பாரம்பரியமான தெளிவற்ற பெயர்களைவிட ‘நாகப்பாம்பு’ நவீனத் தமிழில் எளிதாகப் புரிகிறது; ஆயினும் துல்லியமான உயிரின வகை உறுதியாக இல்லை.
- source_word: יִינָק
  choice: உறிஞ்சுவான்
  rationale: ‘உறிஞ்சுதல்/பால் குடித்தல்’ என்ற வினையின் நேரடியான, உயிரோட்டமுள்ள படிமத்தைப் பாதுகாக்கிறது.
- source_word: תַּהַרְגֵהוּ
  choice: அவனைக் கொல்லும்
  rationale: பெண்பால் ஒருமை எழுவாயான ‘நாக்கு’ அவனுக்குச் செய்யும் உறுதியான விளைவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְשׁוֹן
  choice: நாக்கு
  rationale: பாம்பின் பல் அல்லது கடி என விளக்கிப் பொருள்கொள்ளாமல், எபிரெய உரையின் நேரடியான கவிதைப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אֶפְעֶה
  choice: விரியன் பாம்பு
  rationale: ஒரு நச்சுப்பாம்பைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் புரியக்கூடிய இணை; மூலத்தில் இல்லாத அளவுக்கு உயிரினத் துல்லியத்தை வற்புறுத்தவில்லை.
