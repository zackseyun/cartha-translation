base_translation:
  language: en
  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: ta
  text: ஆகையால், எனக்குள் எழும் கலக்கத்தினால் என் எண்ணங்கள் என்னைப் பதிலளிக்கத் தூண்டுகின்றன[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எண்ணங்கள் எனக்குப் பதிலளிக்கின்றன” அல்லது “என் கலக்கமான எண்ணங்கள் என்னைப் பதிலளிக்கச் செய்கின்றன.” எபிரெயத் தொடர் சுருக்கமாக இருப்பதால், எண்ணங்கள் எனக்குள் பதிலளிப்பதையோ என்னைப் பதிலளிக்கத் தூண்டுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குள் இருக்கும் என் அவசரத்தினால்.” எபிரெயச் சொல் ‘அவசரம்’ என்று பொருள்படலாம்; இச்சூழலில் அது உள்ளக் கிளர்ச்சி அல்லது பதற்றத்துடன் கூடிய அவசர உணர்வைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய பேச்சினால் எழும் விளைவு அல்லது முடிவைச் சுட்டும் உரையாடல் இணைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שְׂעִפַּי
  choice: என் எண்ணங்கள்
  rationale: இச்சொல் கலங்கிய அல்லது பிளவுபட்ட எண்ணங்களையும் குறிக்கலாம்; எனினும் தனி விளக்கச் சொல்லைச் சேர்க்காமல் அடிப்படைப் பொருளை முதன்மை உரையில் வைத்துப் பின்னணிக் கலக்கத்தை அடுத்த தொடரில் வெளிப்படுத்துகிறது.
- source_word: יְשִׁיבוּנִי
  choice: என்னைப் பதிலளிக்கத் தூண்டுகின்றன
  rationale: ஹிபீல் வடிவத்தின் சொற்பொருள் ‘என்னைத் திரும்பச் செய்கின்றன’ என்பதாக இருந்தாலும், இங்கு எண்ணங்கள் பேச்சாளரை மறுமொழி கூறத் தூண்டும் சுருக்கமான எபிரெய மரபுத்தொடராகப் புரிகிறது. உள்ளத்தில் எண்ணங்கள் பதிலளிக்கின்றன என்ற மாற்றுப் புரிதலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּבַעֲבוּר
  choice: …தினால்
  rationale: காரணத்தைக் குறிக்கும் தொடரை இயல்பான தமிழில் காரண வேற்றுமை உருபால் வழங்குகிறது.
- source_word: חוּשִׁי
  choice: என் பதற்றமான அவசரம்
  rationale: חוּשׁ என்பது ‘அவசரம்’ என்ற பொருளையும், சூழலில் உளக் கிளர்ச்சி அல்லது பதற்றமான உந்துதல் என்ற பொருளையும் தரக்கூடும். இரு நுணுக்கங்களையும் தமிழில் இணைத்துப் பாதுகாக்கிறது.
- source_word: בִי
  choice: எனக்குள் இருக்கும்
  rationale: அந்த அவசரமும் பதற்றமும் பேச்சாளருக்குள் எழுகின்றன என்பதை வெளிப்படையாகக் காட்டுகிறது.
