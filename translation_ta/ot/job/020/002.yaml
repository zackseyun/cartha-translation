translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநடையின் கண்ணியத்தையும் எபிரெய மூலத்தின் சுருக்கமான காரணத் தொடர்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. முதன்மை உரை இயல்பாக அமைய ‘பதிலளிக்கத் தூண்டுகின்றன’ எனத் தெளிவாக்கப்பட்டாலும், மூலத்தின் உண்மையான இலக்கண ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
