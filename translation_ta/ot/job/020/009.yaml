  text: עַ֣יִן שְׁ֭זָפַתּ/וּ וְ/לֹ֣א תוֹסִ֑יף וְ/לֹא ע֝֗וֹד תְּשׁוּרֶ֥/נּוּ מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/009.yaml
  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: ta
  text: அவனைப் பார்த்த கண் இனி அவனைப் பார்க்காது[a]; அவனுடைய இடமும் இனி அவனைக் காணாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனை உற்றுப் பார்த்த கண் இனி அப்படிப் பார்க்காது.’ எபிரெயத்தில் ‘கண்’ ஒருமையில் கவித்துவமாக வருகிறது; இரண்டாம் அடியில் ‘அவனுடைய இடம்’ மனிதரைப்போல் காண்பதாக உருவகிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: கண்
  rationale: எபிரெய மூலத்தின் ஒருமை வடிவையும் கவித்துவமான உயிரூட்டலையும் நேரடியாகப் பாதுகாக்கிறது; ‘யாரும்’ என்று பொருளை விரித்துரைக்கவில்லை.
- source_word: שְׁזָפַתּוּ
  choice: அவனைப் பார்த்த
  rationale: இந்த வினை ‘பார்த்தல்/உற்றுப் பார்த்தல்’ என்ற பொருள் தருகிறது. இங்கு இயல்பான நவீனத் தமிழில் ‘பார்த்த’ என்பது அடுத்த அடியின் காணுதல் கருத்தோடும் பொருந்துகிறது.
- source_word: וְלֹא תוֹסִיף
  choice: இனி ... பார்க்காது
  rationale: יסף என்னும் வினை மறுப்புடன் வரும்போது ‘மீண்டும் செய்யாது/இனி செய்யாது’ என்ற தொடராமையை உணர்த்துகிறது; முன் கூறப்பட்ட அவனைப் பார்ப்பதே தமிழில் இயல்பாக மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְלֹא עוֹד
  choice: இனி
  rationale: ‘இனிமேல் இல்லை/மீண்டும் இல்லை’ என்ற தொடராமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: תְּשׁוּרֶנּוּ
  choice: அவனைக் காணாது
  rationale: שׁור என்பது ‘நோக்குதல், காணுதல்’ எனப் பொருள்படும். முதல் அடியின் ‘பார்க்காது’ என்பதிலிருந்து சிறிய சொல் வேறுபாட்டை வைத்தே கவித்துவ இணைப்பைப் பாதுகாக்கிறது.
- source_word: מְקוֹמוֹ
  choice: அவனுடைய இடம்
  rationale: மூலத்தின் ‘அவனுடைய இடம்’ என்ற நேரடிப் பொருளையும், அந்த இடம் அவனை இனி காணாது என்ற உயிரூட்டலையும் பாதுகாக்கிறது.
