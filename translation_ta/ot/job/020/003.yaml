  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு எபிரெயத்தின் இரு உறுப்புகளையும் நன்றாகப் பிரதிபலிக்கிறது: முּסַר ‘கண்டனம்’, כְּלִמָּתִי ஏற்படுத்தும் அவமானம், மற்றும் מִבִּינָתִי-யின் மூல/தோற்ற நுணுக்கம் ஆகியவை காக்கப்பட்டுள்ளன. ‘ஆவி’ என்பது רוּחַ-க்கான பொருத்தமான, உருவகத்தைப் பாதுகாக்கும் தெரிவாகும். யַעֲנֵנִי-க்கான மாற்றுக் காரணவினைப் புரிதலை அடிக்குறிப்பில் வைத்திருப்பது ஏற்றது.'
