  text: I hear a rebuke that shames me[b][a], and the spirit of my understanding answers me.
translation:
  language: ta
  text: என்னை அவமானப்படுத்தும் கண்டனத்தை நான் கேட்கிறேன்; என் புரிதலிலிருந்து எழும் ஆவி[a] எனக்குப் பதிலளிக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் புரிதலின் ஆவி எனக்குப் பதிலளிக்கிறது”; எபிரெயச் சொற்றொடர் ஆவிக்கும் அவரது புரிதலுக்கும் உள்ள தொடர்பை இவ்வாறு குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைப் பதிலளிக்கச் செய்கிறது”; அவரது உள்ளார்ந்த ஆவி அவரைப் பதில் சொல்லச் செய்கிறது என்ற பொருளையும் இவ்வினை தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: கண்டனம்
  rationale: இச்சூழலில் இது பொதுவான பயிற்சியையோ ஒழுக்கத்தையோ அல்லாமல், சோப்பார் தன்மீது கூறப்பட்டதாக உணரும் வாய்மொழிக் கண்டிப்பைக் குறிக்கிறது.
- source_word: כְּלִמָּתִי
  choice: என்னை அவமானப்படுத்தும்
  rationale: முதலாம் நபர் பின்னொட்டுடன் வரும் இச்சொல், அந்தக் கண்டனம் பேச்சாளருக்கு ஏற்படுத்தும் அவமானம் அல்லது இழிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶשְׁמָע
  choice: நான் கேட்கிறேன்
  rationale: சூழலில் நிகழ்காலத்தில் கண்டனத்தைப் பெறுவதை எபிரெய வினை உணர்த்துகிறது.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இது காற்றையோ மூச்சையோ அல்லாமல் உள்ளார்ந்த உந்துதல் அல்லது மனப்பாங்கைக் குறிக்கிறது; அதேவேளையில் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מִבִּינָתִי
  choice: என் புரிதலிலிருந்து எழும்
  rationale: מִן என்பதன் மூலத்தைக் குறிக்கும் ‘இலிருந்து’ என்ற பொருளைத் தெளிவாகப் பாதுகாத்து, இந்த ஆவி பேச்சாளரின் புரிதலிலிருந்து எழுவதாக இயல்பான தமிழில் கூறுகிறது.
- source_word: יַעֲנֵנִי
  choice: எனக்குப் பதிலளிக்கிறது
  rationale: ענה என்பதன் வழக்கமான ‘பதிலளி’ என்ற பொருளையும், முதலாம் நபர் பொருள் பின்னொட்டையும் நேரடியாகக் காட்டுகிறது; ‘என்னைப் பதிலளிக்கத் தூண்டுகிறது’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
