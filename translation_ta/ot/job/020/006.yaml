  text: אִם יַעֲלֶ֣ה לַ/שָּׁמַ֣יִם שִׂיא֑/וֹ וְ֝/רֹאשׁ֗/וֹ לָ/עָ֥ב יַגִּֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/006.yaml
  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: ta
  text: அவனுடைய மேன்மை வானங்கள்வரை உயர்ந்தாலும்[a][b], அவனுடைய தலை மேகங்கள்வரை எட்டினாலும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய உயரம் வானங்கள்வரை உயர்ந்தால்.” எபிரேயச் சொல் אִם என்பதை எளிய நிபந்தனையாக (“என்றால்”) அல்லது இச்சூழலில் விட்டுக்கொடுக்கும் பொருளில் (“...ஆனாலும்”) புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மேன்மை” என்பதற்கு “உயரம்” அல்லது “உன்னதம்” என்றும் பொருள் கொள்ளலாம்; இந்த உருவகம் உடல் உயரத்தையும், உயர்ந்த நிலையையும் அல்லது செருக்கையும் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: உயர்ந்தாலும்
  rationale: இச்சூழலில் אִם ஒரு சாதாரண நிபந்தனையைவிட விட்டுக்கொடுப்பு பொருளை ('...ஆனாலும்') தருகிறது; அடுத்த வசனத்தில் வரும் எதிர்மறையான முடிவோடு இது இயல்பாக இணைகிறது.
- source_word: יַעֲלֶה
  choice: உயர்ந்தாலும்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לַשָּׁמַיִם
  choice: வானங்கள்வரை
  rationale: שָׁמַיִם என்பதன் பன்மைத் தோற்றத்தையும் உயர்ந்த கவிதை உருவகத்தையும் காக்கிறது.
- source_word: שִׂיאוֹ
  choice: அவனுடைய மேன்மை
  rationale: שִׂיאוֹ என்பது உயரம், உன்னத நிலை, மேன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. இங்கு உடல் உயரம் மட்டுமல்லாமல் அவனுடைய உயர்வான நிலை அல்லது செருக்கையும் சுட்டக்கூடிய 'மேன்மை' தெரிவுசெய்யப்பட்டது.
- source_word: וְרֹאשׁוֹ
  choice: அவனுடைய தலை
  rationale: רֹאשׁ என்பதன் நேரடியான பொருளைத் தக்கவைத்து, மிக உயரமாக நிற்கும் ஒருவனின் உருவகத்தை இயல்பாகக் காட்டுகிறது.
- source_word: לָעָב
  choice: மேகங்கள்வரை
  rationale: עָב என்பது மேகம் அல்லது அடர்ந்த மேகத்திரளைக் குறிக்கலாம்; இணையான கவிதை வரியில் 'மேகங்கள்' இயல்பாக ஒலிக்கிறது.
- source_word: יַגִּיעַ
  choice: எட்டினாலும்
  rationale: இங்கு נגע ஒரு எல்லைவரை சென்று அடைதலைக் குறிக்கிறது; 'எட்டு' இடவியல் உருவகத்தைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: שִׂיאוֹ என்பதன் உருவகம்
  choice: மேன்மை
  alternative: உயரம் / உன்னதம்
  rationale: சொல்லை வெறும் உடல் உயரமாகக் கட்டுப்படுத்தாமல், தீயவனின் உயர்ந்த நிலை அல்லது செருக்கு என்ற சாத்தியமான பொருளையும் காக்கிறது; எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபுவின் கவிதைநடைக்கேற்ற கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. இணைவரிகளின் வானம்–மேகம் உருவகமும் விட்டுக்கொடுப்பு அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
