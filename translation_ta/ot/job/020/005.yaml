base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: ta
  text: 'ஏனெனில், தீயவர்களின் ஆர்ப்பரிப்பு சிறிது காலமே நீடிக்கும்;

    இறைப்பற்றற்றவனின்[a] மகிழ்ச்சி ஒரு கணம் மட்டுமே நிலைக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாசாங்குக்காரனின்.” எபிரெயச் சொல் பாசாங்குக்காரனைக் குறிக்கலாம்; ஆனால் இங்கு அது இறைப்பற்றற்ற மனிதனைப் பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் ஆற்றலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רִנְנַת
  choice: மகிழ்ச்சி முழக்கம்
  rationale: வெறும் உள்ளார்ந்த மகிழ்ச்சியை மட்டுமல்லாமல், குரலெழுப்பி வெளிப்படுத்தப்படும் மகிழ்ச்சியையும் குறிக்கும் மூலச்சொல்லின் நுணுக்கத்தைப் பேணுகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஒழுக்க ரீதியில் குற்றமுள்ளவர்களைக் குறிக்கும் பன்மைச் சொல்லுக்கு இயல்பான, தெளிவான தமிழ் இணை.
- source_word: מִקָּרוֹב
  choice: சிறிது காலமே நீடிக்கும்
  rationale: இங்கு இடவியல் அருகாமையைவிட காலத்தின் குறுகிய தன்மையைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְשִׂמְחַת
  choice: மகிழ்ச்சி
  rationale: முதல் அடியுடன் இணையான கவிதை அமைப்பைப் பேணும் நேரடியான பொருள்.
- source_word: חָנֵף
  choice: இறைப்பற்றற்றவன்
  rationale: யோபு நூலில் இச்சொல் வெறும் பாசாங்குக்காரனை மட்டும் அல்லாமல், இறைநெறியை மதிக்காத மனிதனைப் பரந்த வகையில் குறிக்கக்கூடும்; இணை அடியிலுள்ள ‘தீயவர்கள்’ என்பதற்கும் இது பொருந்துகிறது.
- source_word: עֲדֵי רָגַע
  choice: ஒரு கணப்பொழுது மட்டுமே
  rationale: மிகக் குறுகிய கால எல்லைவரை என்பதைக் கவிதைச் சுருக்கத்துடனும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חָנֵף என்பதன் பொருள் வரம்பு
  choice: இறைப்பற்றற்றவன்
  alternative: பாசாங்குக்காரன்
  rationale: மூலச்சொல் பாசாங்கைக் குறிக்கக்கூடியதாயினும், யோபு நூலின் பயன்பாட்டிலும் இவ்வசனத்தின் இணைவடிவத்திலும் ‘இறைப்பற்றற்றவன்’ என்ற பரந்த பொருள் அதிகம் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
