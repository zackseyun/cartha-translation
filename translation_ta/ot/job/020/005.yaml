  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் இரு இணை அடிகளும் காலத்தின் சுருக்கத்தை வலியுறுத்தும் அமைப்பும் பேணப்பட்டுள்ளன.
