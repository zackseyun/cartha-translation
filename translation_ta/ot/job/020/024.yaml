  yaml_path: translation/ot/job/020/024.yaml
  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: ta
  text: அவன் இரும்பு ஆயுதத்திலிருந்து தப்பியோடுவான்; வெண்கல வில் அவனை ஊடுருவிச் செல்லும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “வெண்கல வில் அவனைக் கடந்து செல்லும்.” இங்கு வில்லிலிருந்து எய்யப்படும் அம்பு அவனை ஊடுருவிச் செல்வது பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: தப்பியோடினாலும்
  rationale: ברח என்பது தப்பி ஓடுவதைக் குறிக்கிறது. அடுத்த அரையடியுடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்த ‘-ஆலும்’ பயன்படுத்தப்பட்டுள்ளது; அவன் ஒரு ஆபத்திலிருந்து தப்பினாலும் மற்றொன்று அவனைத் தாக்கும் என்பதே கவிதைச் சூழல்.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: இரும்பு ஆயுதத்திலிருந்து
  rationale: נשק என்பது பொதுவாக ஆயுதம் அல்லது ஆயுத வகையைக் குறிக்கலாம்; בַּרְזֶל அதை ‘இரும்பு’ என வரையறுக்கிறது. எனவே குறிப்பிட்ட ஆயுத வடிவைச் சேர்க்காமல் பொதுவான பொருள் பாதுகாக்கப்படுகிறது.
- source_word: תַּחְלְפֵהוּ
  choice: அவனை ஊடுருவிச் செல்லும்
  rationale: חלף என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்/ஊடாகச் செல்.’ வில் ஆயுதமாகச் செயல்படும் இச்சூழலில், அதன் அம்பு அவனை ஊடுருவிச் செல்வது உள்ளுறையாகப் புரிந்துகொள்ளப்படுகிறது; மூலத்தின் உருவகச் சுருக்கத்தைத் தக்கவைக்க ‘வில்’ என்பதே எழுவாயாக வைக்கப்பட்டுள்ளது.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: வெண்கல வில்
  rationale: קשת என்பதற்கு ‘வில்’; נחושה என்பது இங்கு வெண்கலத்தைக் குறிக்கிறது. தமிழில் இயல்பான பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
