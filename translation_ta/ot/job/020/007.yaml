  text: כְּֽ֭/גֶלֲל/וֹ לָ/נֶ֣צַח יֹאבֵ֑ד רֹ֝אָ֗י/ו יֹאמְר֥וּ אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: ta
  text: தன் மலத்தைப் போலவே[a] அவன் என்றென்றும் அழிந்துபோவான்; அவனைப் பார்த்தவர்கள், ‘அவன் எங்கே?’ என்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் கழிவைப் போலவே.’ எபிரெயச் சொல் வேண்டுமென்றே இழிவுபடுத்தும் ஓர் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: தன் மலத்தைப் போலவே
  rationale: גֶּלֶל என்பது மலம் அல்லது கழிவைக் குறிக்கிறது. இங்கு வேண்டுமென்றே பயன்படுத்தப்பட்டுள்ள இழிவுபடுத்தும் உருவகத்தை ‘மலம்’ நேரடியாகவும் இயல்பாகவும் காக்கிறது; உடைமைப் பின்னொட்டு ‘தன்’ எனத் தரப்பட்டுள்ளது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தை உணர்த்தும் נֶצַח என்பதன் வலிமையை இச்சூழலில் ‘என்றென்றும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֹאבֵד
  choice: அழிந்துபோவான்
  rationale: אבד என்பதன் அழிவு, இல்லாமற்போதல் ஆகிய பொருள்களைத் தீர்ப்பைப் பற்றிய இக்கவிதைச் சூழலில் ‘அழிந்துபோவான்’ தெளிவாகக் காக்கிறது.
- source_word: רֹאָיו
  choice: அவனைப் பார்த்தவர்கள்
  rationale: ‘அவனைப் பார்ப்பவர்கள்/பார்த்தவர்கள்’ என்ற பங்கேற்புவினை வடிவத்தை, அவன் முன்பு இருந்ததை அறிந்தவர்களைக் குறிக்கும் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: יֹאמְרוּ
  choice: என்பார்கள்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்வார்கள்’; தொடர்ந்து நேரடிக் கூற்று வருவதால் தமிழில் ‘என்பார்கள்’ இயல்பாக அமைகிறது.
- source_word: אַיּוֹ
  choice: அவன் எங்கே?
  rationale: இடத்தைக் கேட்கும் எபிரெய வினாவை கூடுதல் விளக்கமின்றி நேரடியாகத் தருகிறது.
