source:
  edition: WLC
  text: עַ֭צְמוֹתָי/ו מָלְא֣וּ עלומ/ו וְ֝/עִמּ֗/וֹ עַל עָפָ֥ר תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: ta
  text: அவனுடைய எலும்புகள் அவனது இளமையின் வலிமையால் நிறைந்திருந்தன[a]; ஆனால் அது அவனோடு புழுதியில் படுத்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய எலும்புகள் அவனது இளமையால் நிறைந்திருந்தன.” எபிரெயச் சொல் இளமையையே அல்லது இளமையோடு தொடர்புடைய வலிமையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: அவனுடைய எலும்புகள்
  rationale: עֶצֶם என்பதன் வழக்கமான பொருள் ‘எலும்பு’; பன்மை மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியை நேரடியாகவும், எபிரெயத்தின் உருவகத்தைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: מָלְאוּ
  choice: நிறைந்திருந்தன
  rationale: מלא வினையின் கால் நிறைவுவடிவம்; பன்மை எழுவாயான ‘எலும்புகள்’ என்பதோடு பொருந்துகிறது. கடந்த காலத்தில் இருந்த இளமைச் செழுமையை இச்சூழலில் இயல்பாகச் சொல்கிறது.
- source_word: עֲלוּמָיו
  choice: அவனது இளமைத் துடிப்பு
  rationale: עֲלוּמִים என்பது இளமையையோ இளமையுடன் தொடர்புடைய உயிர்த்துடிப்பு மற்றும் வலிமையையோ குறிக்கலாம். சூழலிலுள்ள உடல் வலிமையை இயல்பாக வெளிப்படுத்த ‘இளமைத் துடிப்பு’ தேர்ந்தெடுக்கப்பட்டது; அடிப்படைச் சொல்லின் இருபொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְעִמּוֹ
  choice: ஆனால் அதுவும் அவனோடு
  rationale: עִם என்பது ‘உடன்/ஓடு’ என்று பொருள்படும். இணைப்புச் சொல் இங்கு கருத்து மாறுதலைக் காட்டுவதால் தமிழில் ‘ஆனால்’ என்றும், தொடரும் பொருளைத் தெளிவாக்க ‘அதுவும்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: עַל־עָפָר
  choice: புழுதியில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், மரணம் மற்றும் அடக்கம் பற்றிய இக்கவித்துவச் சூழலில் தமிழின் இயல்பான ‘புழுதியில்’ என்பது தூசி/மண் உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: תִּשְׁכָּב
  choice: படுத்துக்கொள்ளும்
  rationale: שׁכב வினையின் கால் நிறைவுறா வடிவம் இங்கு வருங்கால விளைவைக் குறிக்கிறது. மறைமுக எழுவாயான இளமைத் துடிப்பே அவனுடன் புழுதிக்குச் செல்வதாக உள்ள கவித்துவ ஆளுருவாக்கம் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: அவனுடன் புழுதியில் படுப்பதன் எழுவாய்
  choice: ‘அதுவும்’ என்பது முன் குறிப்பிடப்பட்ட இளமைத் துடிப்பைக் குறிக்கிறது
  alternative: எலும்புகளே அவனுடன் புழுதியில் படுக்கின்றன என்று பன்மையாகப் பொருள்கொள்ளுதல்
  rationale: תִּשְׁכָּב என்பது மூன்றாம் நபர் பெண்பால் ஒருமை; ஆகவே பன்மையான ‘எலும்புகள்’ என்பதைவிட, இளமை/இளமைத் துடிப்பு என்னும் கருத்தை எழுவாயாகக் கொள்வது இலக்கணத்திற்கும் கவித்துவ ஓட்டத்திற்கும் ஏற்றது. தமிழில் பால்வேறுபாடு வெளிப்படாததால் ‘அதுவும்’ என்று வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எலும்புகள்’, ‘புழுதி’, ‘படுத்துக்கொள்ளும்’ ஆகிய சொற்கள் மூலத்தின் உறுதியான உடல் மற்றும் மரண உருவகங்களைத் தக்கவைக்கின்றன; ‘இளமைத் துடிப்பு’ சாதாரண வாசகருக்குப் புரியும் வகையில் இளமையின் உயிர்ப்பையும் வலிமையையும் வெளிப்படுத்துகிறது.
