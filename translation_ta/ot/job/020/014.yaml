  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: ta
  text: அவனுடைய உணவு அவன் வயிற்றில் மாறுகிறது[a]; அது அவனுக்குள் நாகப்பாம்புகளின் நஞ்சே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய அப்பம் அவனுடைய உள்ளுறுப்புகளில் மாறுகிறது; அது அவனுக்குள் நச்சுப் பாம்புகளின் பித்தம்.”
    reason: לַחְמוֹ, בְּמֵעָיו, נֶהְפָּךְ, மְרוֹרַת ஆகியவற்றின் அதிகச் சொற்படியான மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לַחְמוֹ
  choice: அவன் உண்ட உணவு
  rationale: לֶחֶם என்பதன் நேர்ப்பொருள் ‘அப்பம்’ என்றாலும், இங்கு அது அவன் உட்கொண்ட உணவைக் குறிக்கிறது. தமிழில் செரிமானச் சூழலை இயல்பாகத் தெரிவிக்க ‘அவன் உண்ட உணவு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּמֵעָיו
  choice: அவன் வயிற்றில்
  rationale: இந்தச் சொல் உடலின் உள்ளுறுப்புகள் அல்லது குடற்பகுதியைக் குறிக்கலாம்; இவ்வசனத்தின் உணவு மற்றும் நஞ்சு உருவகத்தில் ‘வயிற்றில்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: נֶהְפָּךְ
  choice: மாறிப்போகிறது
  rationale: Niphal வடிவம் ஒன்று வேறொன்றாக மாறும் நிலையைச் சுட்டுகிறது. ‘மாறிப்போகிறது’ என்பது அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது; அடுத்த அரையடியில் அது நஞ்சாகிறது என்பது விளங்குகிறது.
- source_word: מְרוֹרַת
  choice: நஞ்சு
  rationale: இச்சொல் அடிப்படையில் ‘கசப்பு/பித்தம்’ என்ற பொருளுடையது; ஆனால் விஷப்பாம்புகளோடு சேர்ந்துள்ள இச்சூழலில் உயிர்க்கொல்லும் நஞ்சைக் குறிக்கிறது.
- source_word: פְּתָנִים
  choice: நாகப்பாம்புகள்
  rationale: פֶּתֶן ஒரு நச்சுப்பாம்பைக் குறிக்கிறது; பாரம்பரியமாக ‘asp’ என்றும், நவீன மொழிபெயர்ப்புகளில் ‘cobra’ என்றும் வழங்கப்படுகிறது. ‘நாகப்பாம்புகள்’ என்பது நவீனத் தமிழ் வாசகருக்கு புரியக்கூடிய பொருத்தமான இணை.
- source_word: בְּקִרְבּוֹ
  choice: அவனுக்குள்
  rationale: அந்த நஞ்சு அந்த மனிதனின் உடலுக்குள் இருப்பதை இச்சொல் குறிக்கிறது. ‘அவனுக்குள்’ என்பது உள்ளார்ந்த உடல்சார் படிமத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
