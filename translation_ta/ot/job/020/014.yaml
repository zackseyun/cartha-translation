revisions:
- from: அவன் உண்ட உணவு அவன் வயிற்றில் மாறிப்போகிறது[a]; அது அவனுக்குள் நாகப்பாம்புகளின் நஞ்சாகிறது.
  to: அவனுடைய உணவு அவன் வயிற்றில் மாறுகிறது[a]; அது அவனுக்குள் நாகப்பாம்புகளின் நஞ்சே.
  rationale: 'The revision retains the source''s concrete bodily imagery and the English POB''s “food / belly / venom / cobras” decisions, while making the Tamil predicate structure closer to the Hebrew: the food changes in his belly, and what it is there is cobra venom. The note preserves the viable literal alternatives without asserting a disputed modern snake species.'
