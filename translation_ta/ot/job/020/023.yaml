  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: ta
  text: அவன் தன் வயிற்றை நிரப்பப்போகும் வேளையில், அவர் தமது கொதிக்கும் கோபத்தை அவன்மேல் அனுப்புவார்; அதை அவனுடைய உணவாக அவன்மேல் பொழிவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் உண்ணும்போது அதை அவன்மேல் பொழிவார்.” இறுதி எபிரேயச் சொற்றொடர் தெளிவற்றது; அது பொழியப்படும் தண்டனையை அவனுடைய உணவோடு நேரடியாக இணைக்கலாம் அல்லது அவன் உண்ணும் நேரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: அவன் தன் வயிற்றை நிரப்பப்போகும் வேளையில்
  rationale: יְהִי உடன் வரும் לְמַלֵּא இச்சூழலில் காலச் சூழ்நிலையைக் குறிக்கிறது; ‘வயிற்றை நிரப்புதல்’ என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְשַׁלַּח בּוֹ
  choice: அவர் ... அவன்மேல் அனுப்பி
  rationale: சூழலின்படி மறைமுக எழுவாய் கடவுள்; בּוֹ பகைநோக்கிய திசையை உணர்த்துவதால் ‘அவன்மேல்’ இயல்பான தமிழ்.
- source_word: חֲרוֹן אַפּוֹ
  choice: தமது கடுங்கோபத்தை
  rationale: சொற்றொடர் கோபத்தின் எரிவையோ தீவிரத்தையோ குறிக்கிறது. ‘கடுங்கோபம்’ நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: அதை ... அவன்மேல் பொழிவார்
  rationale: மழையாகப் பொழியும் தண்டனை உருவகத்தை ‘பொழிவார்’ பாதுகாக்கிறது; கவிதை வடிவமான עָלֵימוֹ இங்கு ஒருமைத் தீயவனையே குறிக்கிறது.
- source_word: בִּלְחוּמוֹ
  choice: அவனுடைய உணவாக
  rationale: கடினமான இச்சொற்றொடரை உணவுடன் நேரடியாக இணைக்கும் வாசிப்பை முதன்மை உரை ஏற்கிறது; காலப்பொருளான ‘அவன் உண்ணும்போது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தண்டனைச் செயல்களின் மறைமுக எழுவாய்
  choice: மரியாதை ஒருமையில் ‘அவர்’, ‘தமது’ என்று கடவுளைக் குறித்தல்
  alternative: எழுவாயைக் குறிப்பிடாமல் செயப்பாட்டு அல்லது ஆளில்லா வடிவில் மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழலும் ‘அவருடைய கோபம்’ என்ற பொருளும் கடவுளையே எழுவாயாகச் சுட்டுகின்றன; தமிழில் தெளிவுக்காக அவரைக் குறிப்பிடுவது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
- issue: בִּלְחוּמוֹ என்பதன் தொடர்பும் பொருளும்
  choice: பொழியப்படும் கோபம் ‘அவனுடைய உணவாக’ இருப்பதாக மொழிபெயர்த்தல்
  alternative: தண்டனை ‘அவன் உண்ணும்போது’ பொழிகிறது எனக் காலப்பொருளில் மொழிபெயர்த்தல்
  rationale: எபிரெய இறுதிச் சொற்றொடர் தெளிவற்றது. முதன்மை உரை உணவோடு நேரடித் தொடர்பைக் காக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். கடவுளைக் குறிக்க மரியாதை ஒருமையும், தீய மனிதனைக் குறிக்க இயல்பான ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. கவிதையின் வயிறு, பொழிதல், உணவு ஆகிய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
