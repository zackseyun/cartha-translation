source:
  edition: WLC
  text: אַל יֵ֥רֶא בִ/פְלַגּ֑וֹת נַהֲרֵ֥י נַ֝חֲלֵ֗י דְּבַ֣שׁ וְ/חֶמְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: ta
  text: தேன், பாலேடு நிறைந்த நீரோடைகளையும், ஆறுகளையும், காட்டாறுகளையும் அவன் காணமாட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேன் மற்றும் தயிர்க்கட்டி நிறைந்த கால்வாய்களையும், ஆறுகளையும், ஓடைகளையும் அவன் காணமாட்டான்.”
    reason: פּלגות என்பதற்கு ‘கால்வாய்கள்’ என்றும், נחל என்பதற்கு ‘ஓடைகள்’ அல்லது ‘பருவநீர் பள்ளத்தாக்குகள்’ என்றும் கொள்ளலாம். חמאה என்பதற்கு ‘தயிர்க்கட்டி,’ ‘வெண்ணெய்,’ அல்லது ‘பாலேடு’ எனச் சூழலுக்கேற்ப பொருள் வரலாம்.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: அவன் காணமாட்டான்
  rationale: கவிதைச் சூழலில் אַל உடன் வரும் நிறைவுறா வினை, தடையுத்தரவாக அல்லாமல் தீயவன் இந்த வளத்தை அனுபவிக்கமாட்டான் என்ற எதிர்கால மறுப்பைத் தெரிவிக்கிறது. ראה என்பதன் நேரடியான காட்சிப்பொருளை ‘காணமாட்டான்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בִפְלַגּוֹת
  choice: நீரோடைகளையும்
  rationale: פּלגות என்பது நீரோடைகள் அல்லது நீர்க்கால்வாய்களைக் குறிக்கும். முன்னொட்டு ב இங்கு ראה உடன் இணைந்த கவிதைநடைப் பயன்பாடாக இருப்பதால், தமிழில் செயப்படுபொருளாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: נַהֲרֵי
  choice: ஆறுகளையும்
  rationale: נהר என்பதன் பன்மை இணைப்புவடிவம்; எபிரெயத்தில் அடுக்கப்படும் வளமையின் நீர்ப்படிமத்தைத் தனிச் சொல்லாகப் பாதுகாக்கிறது.
- source_word: נַחֲלֵי
  choice: காட்டாறுகளையும்
  rationale: נחל என்பது பருவநீர் ஓடும் பள்ளத்தாக்கு, காட்டாறு, அல்லது ஓடை எனப் பொருள்படலாம். ‘காட்டாறு’ நீரோடை மற்றும் ஆறு என்பவற்றிலிருந்து இதை வேறுபடுத்தி, மூன்று எபிரெயப் பெயர்ச்சொற்களின் அடுக்கையும் காக்கிறது.
- source_word: דְּבַשׁ
  choice: தேன்
  rationale: வளமைப் படிமத்தில் வரும் சொல்லின் நேரடியான, வழக்கமான தமிழ் இணை.
- source_word: וְחֶמְאָה
  choice: மற்றும் தயிர்க்கட்டி
  rationale: חמאה என்பது தயிர்க்கட்டி, வெண்ணெய், அல்லது பாலேடு எனப் பொருள்படலாம். பண்டைய மேய்ப்புச் சூழலில் உறைந்த பால் உணவைக் குறிக்க ‘தயிர்க்கட்டி’ தேர்ந்தெடுக்கப்பட்டது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: אַל יֵרֶא என்பதன் வினைநிலை
  choice: 'நிகழாத அனுபவத்தைச் சுட்டும் எதிர்கால மறுப்பு: ‘அவன் காணமாட்டான்’'
  alternative: விருப்பம் அல்லது தடையாக ‘அவன் காணாதிருக்கட்டும்’
  rationale: சோப்பாரின் உரையில் தீயவனுக்கு மறுக்கப்படும் செழிப்பை அறிவிக்கும் சூழல் எதிர்கால மறுப்பை ஆதரிக்கிறது; இதனால் எந்தத் தனிப்பட்ட கோட்பாட்டு முடிவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் வரும் மூன்று நீர்வழிப் பெயர்களின் அடுக்கு நீரோடைகள்—ஆறுகள்—காட்டாறுகள் எனப் பாதுகாக்கப்பட்டது; [a] குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
