language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: ta
  text: இந்த உண்மையை நீ பண்டைக்காலம் முதலே, மனிதன்[a] பூமியில் வைக்கப்பட்ட காலமுதல் அறிந்திருக்கிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனித இனம்.”
    reason: אָדָם என்பதன் பொதுவான, மனிதகுலத்தைக் குறிக்கும் பொருளைத் தெளிவுபடுத்தும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: הֲ/זֹאת
  choice: இதை
  rationale: சுட்டுப்பெயர் வினாவின் உள்ளடக்கத்தைச் சுட்டுகிறது; கூடுதல் விளக்கத்தைச் சேர்க்காமல் இயல்பான தமிழில் ‘இதை’ என வழங்கப்படுகிறது.
- source_word: יָדַעְתָּ
  choice: நீ அறிந்திருக்கிறாய் அல்லவா?
  rationale: Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை, வினாத்துகளுடன் சொல்லாட்சியால் எதிர்பார்க்கப்படும் ஒப்புதலைக் கோரும் கேள்வியாக வருகிறது; ‘அறிந்திருக்கிறாய் அல்லவா?’ என்பது நீடிக்கும் அறிவையும் சொல்லாட்சியின் வலிமையையும் தருகிறது.
- source_word: מִנִּי עַד
  choice: பழங்காலந்தொட்டே
  rationale: இந்தக் காலவழக்கு தொலைந்த பழங்காலத்தைச் சுட்டுகிறது; ‘பழங்காலந்தொட்டே’ சுருக்கமாகவும் இயல்பாகவும் அந்த அர்த்தத்தைத் தருகிறது.
- source_word: מִנִּי שִׂים
  choice: வைக்கப்பட்ட காலத்திலிருந்து
  rationale: ‘வைத்தது முதல்’ என்ற தொடக்கக் காலப்பொருளைத் தெளிவான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: שִׂים
  choice: வைக்கப்பட்ட
  rationale: பூமியின் மேல் மனிதன் வைக்கப்பட்டதைக் குறிக்கும் செயப்படுபொருள் சார்ந்த கருத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: எபிரெயச் சொல் இங்கு ஒருமையில் மனித இனத்தைப் பொதுவாகப் பிரதிநிதித்துவப்படுத்துகிறது; தமிழ் ‘மனிதன்’ அந்த ஒருமை வடிவையும் பொதுப்பொருளையும் காக்கிறது.
- source_word: עֲלֵי אָרֶץ
  choice: பூமியில்
  rationale: இடப்பொருளைச் சுருக்கமான, இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: பொதுவான மானுடவியல் கூற்றில் אָדָם என்பதன் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: மனித இனம்
  rationale: எபிரெயில் אָדָם ஒருமை வடிவில் இருந்தாலும் இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்துகிறது. ‘மனிதன்’ மூலத்தின் இலக்கண வடிவை காக்கிறது; அது தனியொரு ஆணை மட்டும் குறிக்கிறது என்ற தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்பில் பொதுப்பொருள் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநூலுக்கேற்ற கண்ணியமான நடை. எபிரெய வாக்கியத்தின் இரு காலக் குறிப்புகளும் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக அவற்றின் வரிசை அமைக்கப்பட்டுள்ளது. சொல்லாட்சியால் ஒப்புதலை எதிர்பார்க்கும் கேள்வி ‘அல்லவா?’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
