  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: ta
  text: செல்வத்தை[a] அவன் விழுங்கினான்; ஆனால் அதை வாந்தியெடுப்பான். அவனுடைய வயிற்றிலிருந்து கடவுள் அதை வெளியேற்றுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செல்வம்’ என்பதற்குப் பதிலாக ‘செல்வவளம்’ என்றும் மொழிபெயர்க்கலாம் (חַיִל).
    reason: lexical_alternative
  - marker: b
    text: ‘வெளியேற்றுவார்’ என மொழிபெயர்க்கப்பட்ட எபிரெய வினை, அவனை அந்தச் செல்வத்திலிருந்து உரிமையிழக்கச் செய்வார் என்ற நுண்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: செல்வம்
  rationale: இச்சூழலில் חַיִל என்பது வலிமையையோ படையையோ அல்ல, தீயவன் சேர்த்த பொருளாதாரச் செல்வத்தைக் குறிக்கிறது. ‘செல்வம்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בָּלַע
  choice: விழுங்கினான்
  rationale: உட்கொள்ளும் உருவகத்தை நேரடியாகக் காக்கிறது; தொடர்ந்து வரும் ‘வாந்தியெடுப்பான்’ மற்றும் ‘வயிறு’ ஆகிய சொற்களோடு படிம ஒற்றுமையையும் பேணுகிறது.
- source_word: וַיְקִאֶנּוּ
  choice: ஆனால் அதை வாந்தியெடுப்பான்
  rationale: קיא என்பதன் தெளிவான உடல்சார் பொருள் ‘வாந்தியெடு.’ விழுங்கியதைத் தக்கவைக்க முடியாத தலைகீழ் மாற்றத்தை ‘ஆனால்’ வெளிப்படுத்துகிறது; சூழலின் தீர்ப்புக் கூறும் ஓட்டத்துக்கு ஏற்ப எதிர்கால வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִבִּטְנוֹ
  choice: அவனுடைய வயிற்றிலிருந்து
  rationale: בטן என்பதன் இங்குள்ள நேரடியான பொருள் ‘வயிறு.’ விழுங்கப்பட்ட செல்வம் வலுக்கட்டாயமாக வெளியேற்றப்படும் உயிரோட்டமான உடல்சார் படிமத்தை இது காக்கிறது.
- source_word: יוֹרִשֶׁנּוּ
  choice: அதை வெளியேற்றுவார்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு விழுங்கிய செல்வத்தை அவனுக்குள் இருந்து அகற்றச் செய்வதைச் சுட்டுகிறது. ‘வெளியேற்றுவார்’ காரணச் செயலும் வலுக்கட்டாய அகற்றலும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל என்பது இறைவனைச் சுட்டும் பொதுப் பெயர்; தெய்வீகப் பெயரான יהוה அல்ல. ‘கடவுள்’ நவீனத் தமிழில் நேரடியான, பிரிவுசார்பற்ற மொழிபெயர்ப்பு.
theological_decisions:
- issue: தீயவன் விழுங்கிய செல்வம் வெளியேற்றப்படுவதில் தீர்ப்பின் செயற்பாட்டாளர்
  choice: செல்வத்தை வெளியேற்றுபவர் கடவுள் என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
  alternative: இழப்பை இயல்பான விளைவாகவோ, விதி அல்லது சூழ்நிலை ஏற்படுத்துவதாகவோ மங்கலாகக் கூறுதல்.
  rationale: எபிரெய உரையில் אֵל என்பது יוֹרִשֶׁנּוּ என்பதன் வெளிப்படையான எழுவாய். ஆகவே தெய்வீகச் செயற்பாட்டை மென்மைப்படுத்தாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘விழுங்குதல்—வாந்தியெடுத்தல்—வயிற்றிலிருந்து வெளியேற்றுதல்’ என்ற மூலத்தின் தீவிரமான உடல்சார் உருவகம் முழுமையாகப் பேணப்பட்டுள்ளது; கடவுளின் நேரடி செயற்பாடும் மறைக்கப்படவில்லை.
