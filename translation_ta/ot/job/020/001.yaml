  text: וַ֭/יַּעַן צֹפַ֥ר הַ/נַּֽעֲמָתִ֗י וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/001.yaml
  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: ta
  text: அப்போது நாமாத்தியனான சோப்பார் மறுமொழியாகச் சொன்னான்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாமாத்தியனான சோப்பார் மறுமொழியாகச் சொன்னான்.”
    reason: தொடக்கத்திலுள்ள எபிரேய இணைப்பை காலவரிசையைக் காட்டும் ‘அப்போது’ என்று மொழிபெயர்க்கலாம்; அல்லது தமிழில் தனியே வெளிப்படுத்தாமல் எளிய இணைப்பாகக் கொள்ளலாம்.
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற வினை உரையாடல் சூத்திரத்தில் ‘பதிலளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படும். அடுத்துள்ள ‘சொன்னான்’ என்பதுடன் இயல்பான நவீனத் தமிழில் அமைய ‘மறுமொழியாக’ என வழங்கப்பட்டது.
- source_word: צֹפַר
  choice: சோப்பார்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: הַנַּעֲמָתִי
  choice: நாமாத்தியனான
  rationale: இவ்வடைகுடிப் பெயர் சோப்பாரின் ஊர் அல்லது குலத் தொடர்பைக் குறிக்கிறது; பெயரடையாக இயல்பாக அமைய ‘நாமாத்தியனான’ என வழங்கப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: אמר என்பதன் வழக்கமான பொருள் ‘சொல்’ ஆகும். ‘மறுமொழியாகச் சொன்னான்’ என்பது எபிரேய இரட்டை உரையாடல் சூத்திரத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: וַ
  choice: அப்போது
  rationale: முன்னொட்டான waw கதைநடையை முன்னெடுக்கிறது. இங்கு முந்தைய உரைக்குப் பின் சோப்பார் பேசத் தொடங்குவதைக் காட்ட ‘அப்போது’ இயல்பாக உள்ளது; இணைப்புச் சொல்லாக மட்டுமே கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான உரையாடல் அறிமுகமாக வடிவமைக்கப்பட்டது. ‘பதிலளித்துக் கூறினான்’ என்ற சொற்சொல் அமைப்பைவிட ‘மறுமொழியாகச் சொன்னான்’ இயல்பானதாகவும், மூலத்தின் இரு வினைகளின் செயலையும் தக்கவைத்ததாகவும் உள்ளது.
