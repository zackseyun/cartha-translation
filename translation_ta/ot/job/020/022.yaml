translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஞான இலக்கிய நடையைப் பயன்படுத்துகிறது. எபிரேயத்தின் ‘நிறைவு,’ ‘நெருக்கடி,’ ‘கை’ ஆகிய உருவகங்கள் இயன்றவரை காக்கப்பட்டுள்ளன; עָמֵל என்பதிலுள்ள உழைப்பு/துயரம் சார்ந்த பொருள் தெளிவின்றி இருப்பதால் முதன்மை உரையிலும் அடிக்குறிப்பிலும் அந்த விரிவு பாதுகாக்கப்பட்டுள்ளது.
