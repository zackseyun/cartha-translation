source:
  edition: WLC
  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: ta
  text: அவனுடைய செழிப்பு நிறைவாக இருக்கும்போது[a], அவனுக்கு நெருக்கடி உண்டாகும்; துன்பத்தில் உழல்வோர் ஒவ்வொருவரின் கையும் அவனுக்கு எதிராக வரும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் போதுமானது முழுமையாக இருக்கும்போது.” எபிரேயச் சொற்றொடர் சுருக்கமானது; இங்குள்ள பெயர்ச்சொல் ‘போதுமானது,’ ‘மிகுதி,’ அல்லது ‘செழிப்பு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “துன்பத்தில் உழல்வோர் ஒவ்வொருவரின் கை” என்பதை “உழைப்போர் ஒவ்வொருவரின் கை” அல்லது “துயருறுவோர் ஒவ்வொருவரின் கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: நிறைவாக இருக்கும்போது
  rationale: בְּ உடன் வரும் מלא வடிவம் காலச் சூழலைக் குறிக்கிறது; ‘நிறைவாக இருக்கும்போது’ என்பது எபிரேயத்தின் நிறைவு உருவகத்தையும் காலப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: שִׂפְקוֹ
  choice: அவனுடைய செழிப்பு
  rationale: שׂפק இங்கு போதிய வளம், மிகுதி அல்லது செழிப்பைக் குறிக்கிறது. சூழலில் தீயவனின் வளமான நிலையைச் சுட்டுவதால் ‘செழிப்பு’ இயல்பாகப் பொருந்துகிறது; ‘போதுமானது’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יֵצֶר לוֹ
  choice: அவனுக்கு நெருக்கடி உண்டாகும்
  rationale: இந்தச் சொற்றொடர் இடுக்கண் அல்லது நெருக்கமான நிலை அவனுக்கு ஏற்படுவதை உணர்த்துகிறது. ‘நெருக்கடி உண்டாகும்’ என்பது அந்த உருவகத்தின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כָּל יַד
  choice: ஒவ்வொருவரின் கையும்
  rationale: כָּל என்பதன் பகிர்வுப் பொருளையும் יַד என்பதன் தெளிவான ‘கை’ உருவகத்தையும் தமிழில் காக்கிறது.
- source_word: עָמֵל
  choice: துன்பத்தில் உழல்வோர்
  rationale: עָמֵל உழைப்பவர், வருந்துபவர், துயருறுபவர் ஆகிய நெருங்கிய பொருட்களை ஏற்கக்கூடியது. ‘துன்பத்தில் உழல்வோர்’ என்பது உழைப்பு மற்றும் துயரம் ஆகிய இரு நிழற்பொருட்களையும் இயல்பாக இணைக்கிறது.
- source_word: תְּבוֹאֶנּוּ
  choice: அவனுக்கு எதிராக வரும்
  rationale: בוא உடன் இணைந்த சுட்டுப்பெயர் ‘அவனிடம்/அவன்மேல் வரும்’ எனப் பொருள்படும்; ‘கை’ என்ற பகைமையான செயற்பாட்டுச் சூழலில் ‘எதிராக’ என்பது உள்ளார்ந்த எதிர்ப்பைத் தெளிவாக்குகிறது.
