base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: ta
  text: 'தான் உழைத்துச் சேர்த்ததைத் திருப்பிக் கொடுக்கிறான்;

    அதை விழுங்குவதில்லை.

    தன் பரிமாற்றத்தில் கிடைத்த செல்வத்தின் அளவுக்கு[a]

    அவன் மகிழ்ச்சியடைவதில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தான் உழைத்துச் சேர்த்ததைத் திருப்பிக் கொடுத்து, அதை அனுபவிப்பதில்லை; பரிமாற்றத்தால் பெற்ற செல்வத்தில் அவன் களிகூருவதில்லை.” இரண்டாம் அடியின் எபிரெய வாசகம் சுருக்கமாக இருப்பதால், ஒன்றுக்கொன்று நெருக்கமான பல மொழிபெயர்ப்புகளுக்கு இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: திருப்பிக் கொடுக்கிறான்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ஒன்றைத் திரும்பச் செய்வதைக் குறிக்கிறது. சூழலில், தீயவன் தான் பெற்றதை விட்டுக்கொடுக்க வேண்டியிருப்பதால், இந்தத் தமிழ் சொற்றொடர் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: יָגָע
  choice: தான் உழைத்துச் சேர்த்ததை
  rationale: இந்தப் பெயர்ச்சொல் உழைப்பு அல்லது உழைப்பால் கிடைத்ததைக் குறிக்கலாம். מֵשִׁיב என்பதற்கு நேரடி பொருளாக வருவதால், உழைப்பின் மூலம் சேர்த்த பொருள் என்ற விளைபொருள் சார்ந்த அர்த்தம் இங்கே பொருத்தமானது.
- source_word: וְלֹא יִבְלָע
  choice: அதை விழுங்குவதில்லை
  rationale: בלע என்பதன் நேரடிப் பொருள் ‘விழுங்குதல்.’ பெற்ற ஆதாயத்தைத் தக்கவைத்து அனுபவிக்க முடியாமையை உணர்த்தும் மூலமொழியின் உயிரோட்டமான உருவகத்தைத் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: כְּחֵיל
  choice: செல்வத்திற்கேற்ப
  rationale: חֵיל இங்கே படைவலிமையைவிடச் செல்வம் அல்லது உடைமையைக் குறிக்கிறது. முன்னொட்டு כְּ தெளிவற்றதாக இருப்பினும், இச்சூழலில் அளவு அல்லது விகிதத் தொடர்பை ‘-க்கேற்ப’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּמוּרָתוֹ
  choice: தன் பரிமாற்றத்தில் கிடைத்த
  rationale: תְּמוּרָה என்பது பரிமாற்றம், ஈடு, அல்லது பரிமாற்றத்தில் கிடைத்தது என்பவற்றைக் குறிக்கலாம். ‘பரிமாற்றத்தில் கிடைத்த’ என்பது அடிப்படைச் சொல்லுணர்வைக் காத்தபடி செல்வத்தோடு இயல்பாக இணைகிறது.
- source_word: וְלֹא יַעֲלֹס
  choice: அவன் மகிழ்ச்சியடைவதில்லை
  rationale: עלס மகிழ்தல் அல்லது களிகூர்தலைக் குறிக்கிறது. தான் பெற்ற செல்வத்தில் அவனால் இன்புற முடியாது என்ற கருத்தை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: இரண்டாம் அடியின் இலக்கணச் சுருக்கமும் பொருள் தொடர்பும்
  choice: ‘தன் பரிமாற்றத்தில் கிடைத்த செல்வத்திற்கேற்ப அவன் மகிழ்ச்சியடைவதில்லை’ என்று அளவு/விகிதத் தொடர்புடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தான் உழைத்துச் சேர்த்ததைத் திருப்பிக் கொடுத்து, அதை அனுபவிப்பதில்லை; பரிமாற்றத்தால் பெற்ற செல்வத்தில் அவன் களிகூருவதில்லை.’
  rationale: எபிரெய இரண்டாம் அடி மிகவும் சுருக்கமானது; כְּ என்பதன் தொடர்பும் תְּמוּרָתוֹ என்பதன் நுட்பமும் பல நெருங்கிய மொழிபெயர்ப்புகளுக்கு இடமளிக்கின்றன. ஆகவே ஒரு விளக்கத்தை இறுதியானதாக ஆக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விழுங்குவதில்லை’ என்ற நேரடி உருவகம் மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது; தெளிவற்ற இரண்டாம் அடிக்கு [a] அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
