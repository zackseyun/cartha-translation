  text: יִ֭גֶל יְב֣וּל בֵּית֑/וֹ נִ֝גָּר֗וֹת בְּ/י֣וֹם אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: ta
  text: அவன் வீட்டின் விளைச்சல் அகன்றுபோகும்[a]; அவனுடைய கோபத்தின் நாளில்[b] வழிந்துபோகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகடத்தப்படும்” அல்லது “அப்புறப்படுத்தப்படும்.” இவ்வினைச்சொல் அகன்றுபோதலையோ அகற்றப்படுதலையோ குறிக்கலாம்; இங்கு பொல்லாதவனின் வீட்டைச் சேர்ந்த விளைச்சல் அல்லது வளம் நீங்கிப்போவதைச் சொல்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது பெரும்பாலும் கடவுளுடைய கோபத்தைக் குறிக்கிறது; ஆனால் எபிரெய உரை கோபமுடையவர் யார் என்பதை வெளிப்படையாகப் பெயரிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: அகன்றுபோகும்
  rationale: גלה என்பதன் Qal வடிவம் இங்கு வீட்டின் விளைச்சல் அல்லது வளம் அங்கிருந்து நீங்கிப்போவதைக் குறிக்கிறது. ‘அகன்றுபோகும்’ என்பது செயப்படுபொருள் வடிவத்தைத் தேவையின்றி சேர்க்காமல், நீக்கம் அல்லது நாடுகடத்தப்படுதல் என்ற சொல்லின் நிழற்பொருளையும் ஓரளவு காக்கிறது.
- source_word: יְבוּל
  choice: விளைச்சல்
  rationale: இந்தச் சொல் விளைவு, மகசூல், பெருக்கம் ஆகியவற்றைக் குறிக்கலாம். வீட்டுடன் இணைந்த நிலையில், அதன் உடைமைகளும் வருவாயும் உட்படும் கூட்டுப்பொருளை இயல்பான தமிழில் ‘விளைச்சல்’ எடுத்துரைக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவன் வீட்டின்
  rationale: எபிரெயச் சொற்றொடரின் ‘அவன் வீடு’ என்ற உருவகத்தை நேரடியாகக் காக்கிறது; சூழலில் இது வீட்டார், உடைமைகள், குடும்பச் சொத்து ஆகிய பரந்த பொருளையும் கொள்ளலாம்.
- source_word: נִגָּרוֹת
  choice: வெள்ளம்போல் வழிந்தோடும்
  rationale: נגר என்பதன் இந்த வடிவம் ஊற்றப்படுதல் அல்லது நீரைப்போல் ஓடிப்போதல் என்ற படிமத்தைக் கொண்டுள்ளது. ‘வெள்ளம்போல்’ என்பது அழிவோடு வெளியே அடித்துச் செல்லப்படும் இயக்கத்தைத் தமிழில் தெளிவாக்குகிறது; ‘வழிந்தோடும்’ மூலப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: மூலத்தின் காலத்தைக் குறிக்கும் சொற்றொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: אַפּוֹ
  choice: அவனுடைய கோபம்
  rationale: אַפּ anger அல்லது wrath என்று பொருள்படும்; பின்னொட்டு ஆண்பால் ஒருமையைக் குறிக்கிறது. சூழலில் இது பெரும்பாலும் கடவுளின் கோபமாகப் புரிந்துகொள்ளப்பட்டாலும், மூலத்தில் பெயர் வெளிப்படையாக இல்லை; ஆகவே பொதுவான சுட்டுப்பெயர் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவனுடைய கோபம்’ என்பதில் சுட்டப்படுபவர் யார்?
  choice: முதன்மை உரையில் ‘அவனுடைய’ என்று மட்டும் வைத்து, கடவுளின் பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘கடவுளுடைய கோபத்தின் நாளில்’
  rationale: சூழல் தெய்வீக நியாயத்தீர்ப்பை வலுவாகச் சுட்டுவதால் கடவுளே பெரும்பாலும் குறிக்கப்படுகிறார். எனினும் எபிரெய உரை பெயரைச் சொல்லாமல் ஆண்பால் ஒருமைப் பின்னொட்டை மட்டும் கொண்டிருப்பதால், அந்த மறைபொருள் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்துக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வெள்ளம்போல் வழிந்தோடும்’ என்பது மூலத்தின் நீரோட்டப் படிமத்தை வாசகருக்குத் தெளிவாக்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
