lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: அதை விட்டுவிட மனமில்லாமல்
  rationale: חמל என்பதன் அடிப்படைப் பொருள் இரக்கம் காட்டுதல் அல்லது விட்டுவைத்தல். முந்தைய வசனத்தில் தீமை இனிப்பான ஒன்றாகச் சித்தரிக்கப்படுவதால், அதை இழக்க விரும்பாத மனநிலையை இயல்பான நவீன தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: לֹא יַעַזְבֶנָּה
  choice: அதைக் கைவிடாமல்
  rationale: עזב என்பது விட்டுவிடுதல் அல்லது கைவிடுதல். தீமையைப் பற்றிக்கொண்டிருக்கும் செயலைத் தெளிவாகக் காட்ட ‘கைவிடாமல்’ பொருத்தமானது.
- source_word: יִמְנָעֶנָּה
  choice: வைத்துக்கொள்கிறான்
  rationale: מנע இங்கு விழுங்காமல் வாய்க்குள் தடுத்து வைத்திருப்பதைக் குறிக்கிறது. தமிழில் ‘வைத்துக்கொள்கிறான்’ உடல் சார்ந்த படிமத்தையும் விரும்பிப் பாதுகாக்கும் கருத்தையும் இயல்பாகத் தருகிறது.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: தன் வாய்க்குள்
  rationale: חך குறிப்பாக அண்ணம் அல்லது வாயின் மேல்விதானத்தைக் குறித்தாலும், முழுச் சொற்றொடர் வாய்க்குள் வைத்திருக்கும் படிமத்தைத் தருகிறது. இயல்பான தமிழுக்காக ‘வாய்க்குள்’ பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
