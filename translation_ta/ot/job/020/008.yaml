  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: ta
  text: கனவைப்போல் அவன் பறந்துபோவான்; அவனைக் கண்டுபிடிக்க முடியாது[a]. இரவின் தரிசனத்தைப்போல் அவன் விரட்டப்படுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவனைக் கண்டுபிடிக்கமாட்டார்கள்.” எபிரேயத்தில் குறிப்பிடப்படாத பன்மை எழுவாயும், ‘அவனை’ என்னும் பொருட்சுட்டுப் பின்னொட்டும் உள்ளன.
    reason: lexical_alternative
  - marker: b
