    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: கனவைப்போல்
  rationale: כ முன்னொட்டு உவமையைக் குறிக்கிறது; חֲלוֹם என்பது ‘கனவு’. தமிழில் இயல்பான உவமையாகவும் எபிரேயக் கவித்துவப் படிமத்தைப் பேணுவதாகவும் உள்ளது.
- source_word: יָעוּף
  choice: அவன் பறந்துபோவான்
  rationale: עוּף என்பதன் அடிப்படைப் பொருள் ‘பறத்தல்’. வெறுமனே ‘மறைந்துபோவான்’ என்று பொருளைத் தட்டையாக்காமல், விரைவாக அகன்றுபோகும் மூலப்படிமத்தைப் பேணுகிறது.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: அவனைக் காணமுடியாது
  rationale: மூலத்தில் குறிப்பிடப்படாத பன்மை எழுவாயுடன் ‘அவர்கள் அவனைக் காணமாட்டார்கள்’ என்ற செய்பாட்டு அமைப்பு உள்ளது. தமிழில் குறிப்பிடப்படாத தேடுவோரைக் முன்னிறுத்தாமல் அதன் பொருளை இயல்பாகத் தெரிவிக்க இவ்வமைப்பு தேர்ந்தெடுக்கப்பட்டது; நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיֻדַּד
  choice: அவன் துரத்தப்படுவான்
  rationale: Hophal வடிவம் அவன் விரட்டப்பட்டு அகற்றப்படுவதைத் தெரிவிக்கிறது. ‘துரத்தப்படுவான்’ மூலத்தின் இயக்கத்தையும் வலிமையையும் காக்கிறது.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: இரவின் தரிசனத்தைப்போல்
  rationale: חֶזְיוֹן என்பது ‘தரிசனம்’; לָיְלָה இங்கு உடைமை/தொடர்பு உறவைக் காட்டுகிறது. ‘இரவின் தரிசனம்’ கவித்துவத்தையும் மூலத்தின் சுருக்கமான அமைப்பையும் பேணுகிறது.
