translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் அரையடியின் நுகர்வு/விழுங்குதல் படிமமும், இரண்டாம் அரையடியிலுள்ள அரிய வினைச்சொல்லின் பொருள் உறுதியின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
