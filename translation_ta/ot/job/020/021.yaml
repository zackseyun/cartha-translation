source:
  edition: WLC
  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/021.yaml
  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: ta
  text: அவன் விழுங்குவதற்கு எதுவும் மீதியிருக்கவில்லை[a]; ஆகையால் அவனுடைய செழிப்பு நிலைக்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவன் உண்பதற்கென மீந்தது எதுவுமில்லை.” שָׂרִיד என்ற சொல் ‘தப்பிய ஒன்று,’ ‘மீதியானது’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: “நிலைக்காது” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல்லின் பொருள் இங்கு உறுதியற்றது; “நீடிக்காது” அல்லது, இவ்விடத்தில் சாத்தியம் குறைவாக, “செழிக்காது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: எதுவும் மீதியிருக்கவில்லை
  rationale: אֵין என்பது இல்லாமையைக் குறிக்கிறது; שָׂרִיד என்பதன் நேர்ப்பொருள் ‘தப்பிய ஒன்று/மீதியானது.’ இச்சூழலில் ஒன்றுகூட மீந்திருக்கவில்லை என்ற இயல்பான தமிழாக்கம் பொருத்தமானது.
- source_word: לְאָכְלוֹ
  choice: அவன் விழுங்குவதற்கு
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘சாப்பிடுதல்.’ இங்கு பொல்லாதவனின் அளவற்ற பேராசையையும் முழுமையாக நுகர்வதையும் காட்டுவதால், ‘விழுங்குவதற்கு’ என்பது இயல்பாகவும் படிமத்தைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்திய கூற்றிலிருந்து வரும் விளைவை அறிமுகப்படுத்தும் வழக்கமான காரணவிளைவு இணைப்பாகும்.
- source_word: יָחִיל
  choice: நிலைக்காது
  rationale: இவ்வினைச்சொல்லின் பொருள் இவ்விடத்தில் கடினமானது. טוּבוֹ என்பதுடன் வருவதால், அவனுடைய செழிப்பு தொடர்ந்து நீடிக்காது என்ற பொருள் சூழலுக்கு ஏற்றது.
- source_word: טוּבוֹ
  choice: அவனுடைய செழிப்பு
  rationale: நேரடியாக ‘அவனுடைய நன்மை/நல்லவை’ எனப் பொருள்படலாம்; தீர்ப்பைப் பற்றிய இச்சூழலில் அவனுடைய வளமான நிலை அல்லது செல்வச்செழிப்பைக் குறிக்கிறது.
