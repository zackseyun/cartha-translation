  yaml_path: translation/ot/job/020/025.yaml
  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: ta
  text: அவன் அதை உருவி எடுக்கிறான்[a]; அது அவனுடைய உடலிலிருந்து வெளியே வருகிறது; ஒரு பளபளக்கும் முனை அவனுடைய பித்திலிருந்து வெளிவருகிறது; பேரச்சங்கள் அவன்மேல் வருகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பளபளக்கும் வாள் அவனுடைய பித்தப்பையிலிருந்து வெளியே வருகிறது.” எபிரெயம் உயிரோட்டமான உடல்சார்ந்த காட்சியைப் பயன்படுத்துகிறது; ஆயுதம் வெளியே உருவி எடுக்கப்படும்போது அதன் பளபளக்கும் முனை வெளிப்படுவதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: அவன் அதை உருவி எடுக்கிறான்
  rationale: வினைச்சொல் ஆயுதத்தை உருவுதல் அல்லது இழுத்தெடுத்தல் என்பதைக் குறிக்கிறது. எது உருவப்படுகிறது என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாததால், சூழலில் உடலில் பாய்ந்த ஆயுதத்தைக் குறிக்கும் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּצֵא
  choice: அது ... வெளியே வருகிறது
  rationale: ‘வெளியே போதல்/வருதல்’ என்பது அடிப்படைப் பொருள். உடலுக்குள் இருந்த ஆயுதம் வெளியே வருவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִגֵּוָה
  choice: அவனுடைய உடலிலிருந்து
  rationale: גֵּוָה உடல் அல்லது உடற்பகுதியைக் குறிக்கலாம். குறிப்பிட்ட உடற்பகுதியைத் தேவையின்றி வரையறுக்காமல் ‘உடல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבָרָק
  choice: பளபளக்கும் அதன் முனை
  rationale: בָּרָק என்பதன் நேர்ப்பொருள் மின்னல் அல்லது மின்னும் ஒளி. இங்கு உருவப்படும் ஆயுதத்தின் பளபளக்கும் முனையைக் குறிப்பதாக உருவகப் பயன்பாட்டில் எடுத்துக்கொள்ளப்பட்டுள்ளது; ‘அதன்’ என்பது முன்பு மறைமுகமாகக் குறிப்பிடப்பட்ட ஆயுதத்துடன் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: מִמְּרֹרָתוֹ
  choice: அவனுடைய பித்திலிருந்து
  rationale: இந்தச் சொல் பித்து/பித்தநீர் அல்லது நீட்டிப்பாகக் கசப்பு எனப் பொருள்படும். உடற்காயத்தைச் சித்தரிக்கும் சூழலில் உடல்சார்ந்த ‘பித்து’ பொருத்தமானது; ‘பித்தப்பை’ என மிகத் துல்லியமாக்கப்படவில்லை.
- source_word: יַהֲלֹךְ עָלָיו
  choice: அவன்மேல் வருகின்றன
  rationale: הלך உடன் על வரும்போது ஒருவர்மேல் வந்து சேருதல் அல்லது சூழ்தல் என்ற கருத்தைத் தரலாம். பன்மையான ‘பேரச்சங்கள்’ என்பதோடு இயல்பாக அமைகிறது.
- source_word: אֵמִים
  choice: பேரச்சங்கள்
  rationale: பன்மைச் சொல் மிகுந்த அச்சங்கள் அல்லது பயங்கரங்களைச் சுட்டுகிறது. பன்மைத் தீவிரத்தை ‘பேரச்சங்கள்’ தக்கவைக்கிறது.
