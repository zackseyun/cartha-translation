source:
  edition: WLC
  text: בָּ֭נָי/ו יְרַצּ֣וּ דַלִּ֑ים וְ֝/יָדָ֗י/ו תָּשֵׁ֥בְנָה אוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: ta
  text: அவனுடைய மகன்கள் ஏழைகளிடம் தயவைப் பெற முயல்வார்கள்[a]; அவனுடைய கைகளே அவனுடைய செல்வத்தைத் திருப்பிக் கொடுக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழைகளைச் சமாதானப்படுத்துவார்கள்.” எபிரெய வினைச்சொல், தயவை நாடுதல் அல்லது பாதிக்கப்பட்டவர்களைச் சமாதானப்படுத்துதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய உடைமையை” அல்லது “அவனுடைய வலிமையை.” எபிரெயப் பெயர்ச்சொல் செல்வம், உடைமை, வளம் அல்லது வலிமையைக் குறிக்கலாம்; இச்சூழலில் “செல்வம்” பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: ஆண்பால் பன்மையில் அமைந்த எபிரெயச் சொல்லையும் மூன்றாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְרַצּוּ
  choice: தயவை நாடுவார்கள்
  rationale: רצה என்பதன் பியேல் வடிவம் இங்கு ஏற்றுக்கொள்ளப்படுதலையோ தயவையோ நாடுதல் என்ற உறவுசார் பொருளைக் கொடுக்கிறது; பாதிக்கப்பட்டவர்களைச் சமாதானப்படுத்துதல் என்ற சாத்தியமும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: דַלִּים
  choice: ஏழைகள்
  rationale: பொருளாதாரத்திலும் சமூக நிலையிலும் தாழ்ந்த அல்லது வலுவற்ற மக்களைக் குறிக்கும் இச்சொல்லுக்கு, சூழலில் இயல்பான நேரடிப் பொருத்தம் ‘ஏழைகள்’ என்பதாகும்.
- source_word: יָדָיו
  choice: அவனுடைய கைகளே
  rationale: மூலத்தின் ‘அவனுடைய கைகள்’ என்ற எழுவாயைத் தக்கவைத்து, ‘-ஏ’ மூலம் அவனே திருப்பிக் கொடுக்க வேண்டிய வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּשֵׁבְנָה
  choice: திருப்பிக் கொடுக்கும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவமான ‘திரும்பச் செய்தல்’ என்பதை, இழந்ததை மீளக் கொடுக்கும் இச்சூழலில் இயல்பான தமிழில் வழங்குகிறது.
- source_word: אוֹנוֹ
  choice: அவனுடைய செல்வம்
  rationale: אוֹן என்பது செல்வம், உடைமை, வளம் அல்லது வலிமை எனப் பொருள்படலாம்; ஏழைகளுக்குச் செய்யப்படும் ஈட்டுத்தொகை அல்லது மீட்பளிப்பு சார்ந்த சூழலுக்கு ‘செல்வம்’ சிறப்பாகப் பொருந்துகிறது, மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: செல்வம் எவ்வகையில் பெறப்பட்டது என்பதைக் கூறுதல்
  choice: மூலத்தில் உள்ள பொதுவான ‘அவனுடைய செல்வம்’ என்பதையே தக்கவைத்தல்
  alternative: ‘அநியாயமாகச் சேர்த்த செல்வம்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழல் அநியாயமான சேர்க்கையை உணர்த்தக்கூடும்; ஆனால் אוֹנוֹ என்ற சொல்லே அதனை வெளிப்படையாகக் கூறவில்லை. ஆகவே விளக்கத்தை வசனத்துக்குள் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கைகளே’ என்ற உயிரற்ற பன்மை எழுவாயுடன் தமிழின் இயல்புக்கேற்ப ஒருமை வினைமுற்று அமைக்கப்பட்டுள்ளது. பெறுநர் மூலத்தில் வெளிப்படையாக மீண்டும் சொல்லப்படாததால், ‘ஏழைகளுக்கு’ என்பதை இரண்டாம் கூறில் சேர்க்கவில்லை.
