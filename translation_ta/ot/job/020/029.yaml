source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: ta
  text: 'தீய மனிதனுக்குக் கடவுளிடமிருந்து வரும் பங்கு இதுவே;

    வல்லமையுள்ளவரிடமிருந்து அவனுக்காக நிர்ணயிக்கப்பட்ட உரிமைப்பங்கும் இதுவே.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה
  choice: இதுவே
  rationale: சோப்பாரின் முடிவுரையை வலியுறுத்தும் சுட்டுப்பெயராக இயல்பான தமிழில் தருகிறது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: ஒருவருக்கு ஒதுக்கப்படும் பங்கு அல்லது விளைவைக் குறிக்கிறது; இந்நியாயத்தீர்ப்புச் சூழலுக்கு ஏற்ற எளிய, நேர்த்தியான சொல்.
- source_word: אָדָם רָשָׁע
  choice: தீய மனிதன்
  rationale: எபிரெயத்தின் ஆண்பால் ஒருமை வடிவத்தையும் பொதுப்பொருளையும் காக்கிறது; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: מֵאֱלֹהִים
  choice: கடவுளிடமிருந்து
  rationale: தீயவனுக்குரிய பங்கின் மூலமாக ஒரே கடவுளைக் குறிப்பிடுகிறது.
- source_word: וְנַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: חֵלֶק என்பதோடு இணையாக, ஒருவருக்கு உரியதாக ஒதுக்கப்பட்ட பங்கு என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִמְרוֹ
  choice: அவனுக்கென உரைக்கப்பட்ட
  rationale: אמר என்ற சொல்லின் பேச்சு/உரைப்பு சார்ந்த வடிவத்தை ஓரளவு காத்தபடியே, சூழலில் கடவுள் அவனுக்காக அறிவித்த அல்லது தீர்மானித்த பங்கு என்ற பொருளைத் தருகிறது; மூலத்தின் சுட்டுப்பெயர் சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאֵל
  choice: வல்லமையுள்ளவரிடமிருந்து
  rationale: אֵל என்ற இறைப்பட்டத்தின் வல்லமை சார்ந்த நுண்ணுணர்வையும், முதல் அடியிலுள்ள ‘கடவுள்’ என்பதுடனான கவிதை வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: אָדָם என்ற பொதுமைப் பொருளுள்ள ஆண்பால் ஒருமையின் மொழிபெயர்ப்பு
  choice: தீய மனிதன்
  alternative: தீயவர்
  rationale: மூலத்தின் இலக்கண ஆண்பால் ஒருமையைத் தக்கவைத்தாலும், இச்சொற்றொடர் பொதுவாக எந்தத் தீய மனிதனையும் குறிக்கிறது.
- issue: אִמְרוֹ என்பதன் பொருள் மற்றும் சுட்டுப்பெயர் தொடர்பு
  choice: அவனுக்கென உரைக்கப்பட்ட
  alternative: அவனுடைய சொல் / அவனுடைய உரை
  rationale: அதன் நேரடிப் பொருள் ‘அவனுடைய சொல்/உரை’ என இருக்கலாம்; ஆனால் சூழலும் இணை அமைப்பும் கடவுளால் அவனுக்காக உரைக்கப்பட்ட அல்லது தீர்மானிக்கப்பட்ட பங்கைக் குறிப்பதாகத் தெரிகிறது. உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்திற்கேற்ற கண்ணியமான நடையுடன் இரண்டு இணையான கவிதை அடிகளாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுள் / வல்லமையுள்ளவர்’ என்ற வேறுபாடு எபிரெயக் கவிதையின் இறைப்பெயர் மாறுபாட்டைக் காக்கிறது.
