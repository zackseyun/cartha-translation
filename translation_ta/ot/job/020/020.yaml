  terminology: «அமைதி», «வயிறு», «விரும்பியவை», «தப்பமாட்டான்» ஆகிய தேர்வுகள் இயல்பானவை; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை. அடிக்குறிப்பு மூலத்தில் உள்ள ‘நிம்மதி/அமைதி’ மற்றும் ‘தப்புதல்/தன்னைக் காப்பாற்றுதல்’ ஆகிய சாத்தியங்களை உதவிகரமாகக் காட்டுகிறது.
