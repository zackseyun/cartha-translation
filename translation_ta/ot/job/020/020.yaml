  source_fidelity: மூல எபிரேயத்தின் இரண்டு செய்யுள் அலகுகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. כִּי-யின் காரணத் தொடர்பு «ஏனெனில்» எனவும், לֹא יָדַע-ன் நிறைவுவினை «அறியவில்லை» எனவும், எதிர்கால/விளைவு நிழலுள்ள לֹא יְמַלֵּט «தப்பமாட்டான்» எனவும் பொருத்தமாகத் தரப்பட்டுள்ளன. «தன் வயிற்றுக்குள்» என்பது בְּבִטְנוֹ-வின் உடல்சார் உருவகத்தைப் பாதுகாக்கிறது; «தான் விரும்பியவற்றைக் கொண்டு» என்பது בַּחֲמוּדוֹ-வின் கருவிப்பொருள் தொடர்பையும், ‘விரும்பத்தக்க/விலையுயர்ந்த பொருள்கள்’ என்ற திறந்த பொருள் பரப்பையும் காக்கிறது.
