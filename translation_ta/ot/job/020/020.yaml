  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: ta
  text: ஏனெனில், தன் வயிற்றுக்குள் அவன் அமைதியை அறியவில்லை; தான் விரும்பியவற்றைக் கொண்டு அவன் தப்பமாட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஏனெனில், தன் வயிற்றில் அவன் நிம்மதியை அறியவில்லை; தான் விரும்புவதால் அவன் தன்னைக் காப்பாற்றிக்கொள்ள மாட்டான்.”'
    reason: שָׁלֵו, בַּחֲמוּדוֹ, יְמַלֵּט ஆகிய சொற்களின் சாத்தியமான மாற்றுப் பொருள்களையும் தொடரியல் தொடர்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் செய்யுளின் கருத்தோட்டத்துக்கு இயல்பாக உள்ளது.
- source_word: לֹא יָדַע
