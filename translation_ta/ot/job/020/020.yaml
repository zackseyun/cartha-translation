- source_word: בַּחֲמוּדוֹ
  choice: தான் விரும்பியவற்றைக் கொண்டு
  rationale: חמד வேரின் ‘விரும்பப்படுவது/இன்பம் தருவது’ என்ற பரப்பை வைத்திருக்கிறது; ‘செல்வங்கள்’ என்று குறுக்காமல், கருவிப்பொருள் அல்லது வழிமுறை என்ற בְּ பயன்பாட்டையும் காட்டுகிறது.
- source_word: לֹא יְמַלֵּט
  choice: அவன் தப்பமாட்டான்
  rationale: Piel வடிவத்தின் ‘தப்புதல்/விடுவித்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; தன்னைக் காப்பாற்றுதல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
