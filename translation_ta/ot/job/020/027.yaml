base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: ta
  text: வானங்கள் அவனுடைய அக்கிரமத்தை[a] வெளிப்படுத்தும்; பூமி[b] அவனுக்கு எதிராக எழும்பும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய குற்றத்தை’; எபிரெயச் சொல் ஒழுக்கத் தீமையையோ அதனால் ஏற்படும் குற்றப்பொறுப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலம்’; எனினும் இக்கவிதைச் சூழலில் ‘வானங்கள்’ என்பதற்கு இணையாக ‘பூமி’ என்பது சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: வெளிப்படுத்தும்
  rationale: גלה என்பதன் பியேல் வடிவம் இங்கு மறைந்திருப்பதை அறியச் செய்தல் அல்லது வெளிக்கொணர்தல் என்ற பொருளைத் தருகிறது. ‘வெளிப்படுத்தும்’ என்பது இயல்பான நவீனத் தமிழில் நீதித்தீர்ப்புசார் அம்பலப்படுத்தலைத் தக்கவைக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல் பன்மை வடிவில் இருந்து ஒருமைத் தொகுப்புப் பொருளிலும் வரலாம். இங்கு மனிதப் பண்பு கொடுக்கப்பட்ட பிரபஞ்சச் சாட்சியையும் உயர்ந்த கவிதை நடையையும் ‘வானங்கள்’ காக்கிறது.
- source_word: עֲוֺנוֹ
  choice: அவனுடைய அக்கிரமத்தை
  rationale: עָוֹן என்பது ஒழுக்கக்கேடு, குற்றப்பொறுப்பு, அல்லது அதற்கான தண்டனை ஆகிய பொருட்களை ஏற்கலாம். இச்சூழலில் பொல்லாதவனின் ஒழுக்கத் தீமை அம்பலமாவது முன்னிலையிலுள்ளதால் ‘அக்கிரமம்’ பொருத்தமானது; ‘குற்றம்’ என்பதும் சாத்தியம்.
- source_word: וְאֶרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள் வரலாம். ‘வானங்கள்’ என்பதுடன் அமைந்த கவிதை இணைப்பில் ‘பூமி’ பிரபஞ்ச அளவிலான மனிதப்பண்பூட்டலைச் சிறப்பாக வெளிப்படுத்துகிறது.
- source_word: מִתְקוֹמָמָה
  choice: எழும்பும்
  rationale: קום வேரிலிருந்து வந்த இவ்வடிவம் எதிர்ப்புடன் எழுந்து நிற்பதைக் குறிக்கிறது. ‘எழும்பும்’ என்ற சொல் மூலத்தின் உயிரோட்டமான மனிதப்பண்பூட்டலைக் காக்கிறது; எதிர்ப்புப் பொருள் அடுத்துள்ள சொல்லால் தெளிவாகிறது.
- source_word: לוֹ
  choice: அவனுக்கு எதிராக
  rationale: לְ பொதுவாக ‘அவனுக்கு’ எனப் பொருள்பட்டாலும், பகைமையுடன் எழுதல் குறிக்கும் வினையுடன் இங்கு எதிர்ப்புப் பொருளைக் கொண்டுள்ளது. எனவே ‘அவனுக்கு எதிராக’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
