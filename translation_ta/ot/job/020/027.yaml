  register: நவீன நிலையான தமிழில், யோபு நூலுக்கேற்ற கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டது. வானங்களும் பூமியும் சாட்சிகள்போல் செயல்படும் மூலத்தின் மனிதப்பண்பூட்டல் பாதுகாக்கப்பட்டுள்ளது. இரு அடிகளின் இணை அமைப்பைத் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
