base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: ta
  text: தீமை அவன் வாய்க்கு இனிமையாக இருந்தாலும்[a], அதைத் தன் நாவின்கீழ் மறைத்துவைக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை அவன் வாய்க்கு இனிமையாக இருந்தால்.” எபிரெயச் சொல் ‘என்றால்’ என்ற நிபந்தனைப் பொருளையோ ‘இருந்தாலும்’ என்ற விட்டுக்கொடுப்பு பொருளையோ தரலாம்; சூழல் விட்டுக்கொடுப்பு பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தாலும்
  rationale: இச்சூழலில் אִם ஒரு சாதாரண நிபந்தனையைவிட விட்டுக்கொடுப்பு பொருளைத் தருகிறது; எனினும் ‘என்றால்’ என்ற நிபந்தனை வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּמְתִּיק
  choice: இனிமையாக இருந்தாலும்
  rationale: מתק என்பதன் ஹிப்இல் வடிவம் இங்கு רָעָה என்பதை எழுவாயாகக் கொண்டு ‘இனிமையாக இரு/இன்பமாக இரு’ என்ற நிலைப்பொருளில் வருகிறது; தமிழில் இயல்பாக இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּפִיו
  choice: அவன் வாய்க்கு
  rationale: ‘வாய்’ என்ற நேரடியான உருவகத்தைத் தக்கவைத்து, தமிழில் சுவை உணர்வைக் குறிக்கும் இயல்பான வேற்றுமை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: רָעָה
  choice: தீமை
  rationale: இங்கு ஒழுக்கரீதியான தீமையைச் சுட்டும் பரந்த, இயல்பான தமிழ்ச் சொல்.
- source_word: יַכְחִידֶנָּה
  choice: அதை ... மறைத்துவைக்கிறான்
  rationale: כחד என்பதன் ஹிப்இல் வடிவம் மறைத்தல் அல்லது ஒளித்துவைத்தல் எனப் பொருள்படும்; பெண்பால் ஒருமை பின்னொட்டு ‘தீமை’யைச் சுட்டுகிறது.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: தன் நாவின்கீழ்
  rationale: வாயில் தீமையை இரகசியமாக வைத்துச் சுவைக்கும் தெளிவான இடவியல் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אִם என்பதன் வாக்கிய உறவு
  choice: 'விட்டுக்கொடுப்பு: ‘இருந்தாலும்’'
  alternative: 'நிபந்தனை: ‘என்றால்’'
  rationale: தீயவன் தீமையை ரசித்துப் பாதுகாப்பதைத் தொடர்ந்து விவரிக்கும் சூழல் விட்டுக்கொடுப்பு வாசிப்பை ஆதரிக்கிறது; ஆனால் எபிரெயச் சொல்லின் உண்மையான நிபந்தனைச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவ உருவகத்தைத் தக்கவைத்து சாதாரண வாசகருக்கும் தெளிவாக அமைக்கப்பட்டுள்ளது. ‘வாய்க்கு இனிமை’ மற்றும் ‘நாவின்கீழ்’ ஆகிய இணை உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
