translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நசுக்கி’ என்ற உருவகம் மூலத்தின் வன்மையைப் பாதுகாக்கிறது; ‘கட்டியெழுப்பமாட்டான்’ என்பது வீட்டைப் பற்றிய בנה வினையின் இயல்பான தமிழாக்கமாகவும், ‘மீண்டும் கட்டுதல்’ என்ற விளக்கத்தைத் திணிக்காததாகவும் உள்ளது.
