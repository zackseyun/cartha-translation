  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: ta
  text: ஏனெனில், அவன் ஏழைகளை நசுக்கிக் கைவிட்டான்[a]; ஒரு வீட்டை அபகரித்தான்; அதை அவன் கட்டியெழுப்பமாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏழைகளை” என்பது “பலவீனமானவர்களை” அல்லது “எளியவர்களை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கூறப்பட்ட தண்டனைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רִצַּץ
  choice: நசுக்கி
  rationale: வெறும் பொதுவான ‘ஒடுக்கி’ என்பதைவிட, மூல வினையின் வன்மையான ‘நொறுக்குதல்/நசுக்குதல்’ படிமத்தைத் தக்கவைக்கிறது.
- source_word: עָזַב
  choice: கைவிட்டான்
  rationale: பாதிப்புக்குள்ளான ஏழைகளை உதவியின்றி விட்டுவிடும் குற்றத்தன்மையை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: דַּלִּים
  choice: ஏழைகளை
  rationale: இச்சொல் ஏழைகள், பலவீனர்கள், சமூகத்தில் பாதுகாப்பற்றவர்கள் ஆகிய பொருள்களை ஏற்கக்கூடும்; இங்கு ‘ஏழைகள்’ நேரடியான, இயல்பான தெரிவு.
- source_word: בַּיִת
  choice: ஒரு வீட்டை
  rationale: அபகரித்தல் மற்றும் அதைக் கட்டியெழுப்பாதிருத்தல் என்ற இணைப்பு, குடும்பத்தையல்லாமல் கட்டிடம் அல்லது சொத்தையே முதன்மையாகச் சுட்டுகிறது.
- source_word: גָּזַל
  choice: அபகரித்தான்
  rationale: பலவந்தமாகவோ அநியாயமாகவோ பிறருடையதைப் பறித்துக்கொள்ளும் பொருளைத் தருகிறது; இரகசியத் திருட்டு என்ற குறுகிய எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: ஆனால் அதை அவன் கட்டியெழுப்பமாட்டான்
  rationale: வீட்டைச் சுட்டும் பொருட்பெயர் பின்னொட்டையும், בנה என்பதன் கட்டுதல்/நிலைநிறுத்துதல் படிமத்தையும் காக்கிறது. எதிர்மறை முற்றா வினையைச் சூழலுக்கேற்ற எதிர்கால விளைவாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மீண்டும்’ என்பதைச் சேர்க்கவில்லை.
