translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியும் கண்ணியமுமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு இணையான வினாக்களும் காக்கப்பட்டுள்ளன; இரண்டாம் பகுதியின் மூலமொழி நீள்வட்ட அமைப்பு தமிழில் புரியும்படி ‘இருந்தன’ என்று நிறைவு செய்யப்பட்டுள்ளது.
