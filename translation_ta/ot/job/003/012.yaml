source:
  edition: WLC
  text: מַ֭דּוּעַ קִדְּמ֣וּ/נִי בִרְכָּ֑יִם וּ/מַה שָּׁ֝דַ֗יִם כִּ֣י אִינָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/012.yaml
  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: ta
  text: முழங்கால்கள்[a] ஏன் என்னை ஏற்றுக்கொண்டன? நான் பாலருந்துவதற்கு மார்பகங்கள் ஏன் இருந்தன[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழங்கால்கள்’ என்பது, பிறந்த குழந்தையை முழங்கால்களின்மீது அல்லது மடியில் ஏற்றுக்கொள்வதைக் குறிக்கும் படிமமாக இருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெய வினைச்சொல், ஒரு குழந்தை மார்பிலிருந்து பாலை உறிஞ்சிக் குடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: யோபுவின் புலம்பலில் நேரடியான காரண வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: קִדְּמוּנִי
  choice: என்னை ஏற்றுக்கொண்டன
  rationale: קדם என்பதன் ‘எதிர்கொண்டு வரவேற்றல்/பெற்றுக்கொள்ளுதல்’ என்ற சூழல்சார் பொருளைத் தருகிறது; பிறந்த குழந்தையை முழங்கால்களில் அல்லது மடியில் ஏற்றுக்கொள்ளும் காட்சிக்கு இது பொருந்துகிறது.
- source_word: בִרְכָּיִם
  choice: முழங்கால்கள்
  rationale: எபிரெய மூலத்தின் உறுதியான உடற்கூறு உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: וּמַה
  choice: ஏன்
  rationale: சொல்லுக்குச் சொல் ‘மற்றும் என்ன’ என்றாலும், முதல் வினாவுக்கு இணையான கவிதை அமைப்பில் காரணத்தை வினவும் ‘ஏன்’ என்பதே தமிழில் இயல்பானது.
- source_word: שָׁדַיִם
  choice: மார்பகங்கள்
  rationale: தாய்ப்பால் ஊட்டும் உடற்கூற்றைக் குறிக்கும் மூலச்சொல்லைத் தெளிவாகவும் கண்ணியமான நவீன நடையிலும் தருகிறது; மூலத்தில் இல்லாத ‘தாயின்’ என்பதைச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: பாலருந்துவதற்கு
  rationale: இரண்டாம் வினாவோடு தொடர்புடைய நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பான வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: אִינָק
  choice: நான் பாலருந்துவதற்கு
  rationale: இச்சூழலில் வினைச்சொல் குழந்தை மார்பிலிருந்து பாலை உறிஞ்சிக் குடிப்பதைக் குறிக்கிறது. ‘பாலருந்துதல்’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
