source:
  edition: WLC
  text: יֹ֣אבַד י֭וֹם אִוָּ֣לֶד בּ֑/וֹ וְ/הַ/לַּ֥יְלָה אָ֝מַ֗ר הֹ֣רָה גָֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: ta
  text: 'நான் பிறந்த அந்த நாள் அழிந்துபோகட்டும்;

    ‘ஓர் ஆண் குழந்தை கருத்தரிக்கப்பட்டது’[a] என்று சொன்ன அந்த இரவும் அழிந்துபோகட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் ஆண் கருத்தரிக்கப்பட்டான்.’
    reason: גָבֶר என்பது ஆண் நபரைக் குறிக்கிறது; கருத்தரிப்பு அறிவிப்பின் இச்சூழலில் அது ‘ஆண் குழந்தை’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: יֹאבַד
  choice: அழிந்துபோகட்டும்
  rationale: எளிய எதிர்காலக் கூற்றாக அல்லாமல், யோபின் சாபவிருப்பத்தை வெளிப்படுத்தும் வேண்டுதல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יוֹם אִוָּלֶד בּוֹ
  choice: நான் பிறந்த அந்த நாள்
  rationale: குறிப்பிட்ட பிறந்த நாளையே சுட்டுகிறது; எபிரெயச் சொல்லமைப்பை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וְהַלַּיְלָה אָמַר
  choice: என்று சொன்ன அந்த இரவும்
  rationale: நாள் மற்றும் இரவு ஆகிய இரு இணையான கூறுகளையும் காக்கிறது; இரவு பேசுவதாக வரும் உருவகப்படுத்தலையும் தக்கவைக்கிறது.
- source_word: הֹרָה
  choice: கருவானான்
  rationale: ஒரு ஆண் கருத்தரிக்கப்பட்ட நிகழ்வைக் குறிக்கும் பிறப்புத் தகவலைச் சுருக்கமாகத் தருகிறது; இரவே கருத்தரித்ததாகப் பொருள்படுவதைத் தவிர்க்கிறது.
- source_word: גָבֶר
  choice: ஓர் ஆண்
  rationale: ஆண் நபரைக் குறிக்கும் மூலச்சொல்லை நேரடியாகக் காக்கிறது; இச்சூழலில் ‘ஆண் குழந்தை’ என்ற பொருளும் சாத்தியமானது என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பைத் தெளிவாக்க இரண்டாம் கூறில் ‘அழிந்துபோகட்டும்’ மீண்டும் சொல்லப்பட்டுள்ளது; இது மூலத்தில் கருத்தால் உட்பொதிந்துள்ளது.
