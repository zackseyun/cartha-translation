source:
  edition: WLC
  text: לָ֤/מָּה יִתֵּ֣ן לְ/עָמֵ֣ל א֑וֹר וְ֝/חַיִּ֗ים לְ/מָ֣רֵי נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: ta
  text: துன்புறுபவனுக்கு ஒளியும்[b], உள்ளம் கசந்தவர்களுக்கு வாழ்வும் ஏன் கொடுக்கப்படுகின்றன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துன்புறுபவனுக்கு அவர் ஏன் ஒளியையும், உள்ளம் கசந்தவர்களுக்கு வாழ்வையும் கொடுக்கிறார்?’ கொடுப்பவர் யார் என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை; சூழலில் கடவுள் குறிக்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘ஒளி’ என்பது தொடர்ந்து உயிரோடு இருப்பதைக் குறிக்கும் கவிதை உருவகம். முதல் கூறிலும் எபிரெய உரை நேரடியாக ‘வாழ்வு’ என்று சொல்லாமல் இந்த உருவகத்தையே பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: யோபுவின் புலம்பலில் எழும் நேரடியான காரணவினாவை இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: יִתֵּן
  choice: கொடுக்கப்படுவதும்
  rationale: எபிரெயச் சொல் மூன்றாம் நபர் ஆண்பால் ஒருமை வினையாக இருந்தாலும், கொடுப்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழ் செயப்பாட்டு வடிவம் அந்த மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- source_word: לְעָמֵל
  choice: துன்பத்தில் உழல்கிறவனுக்கு
  rationale: இங்கு עָמֵל என்பது சாதாரணமாக உழைப்பவனை அல்ல, துயரத்திலும் வேதனையிலும் இருப்பவனைக் குறிக்கிறது. இந்தத் தேர்வு துன்பத்தின் தொடர்ச்சியையும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: தொடர்ந்து உயிரோடு இருப்பதைக் கவிதைநயமாகக் குறிக்கும் மூலமொழியின் உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: וְחַיִּים
  choice: வாழ்வு
  rationale: எபிரெயில் வடிவத்தால் பன்மையாக இருந்தாலும், இச்சொல் வழக்கமாக ஒருமைப் பொருளில் ‘வாழ்வு’ என்பதைக் குறிக்கிறது.
- source_word: לְמָרֵי נָפֶשׁ
  choice: உள்ளம் கசந்தவர்களுக்கு
  rationale: ‘ஆத்துமாவில் கசந்தவர்கள்’ என்ற மூலமொழி மரபுத்தொடரின் ஆழ்ந்த மனவேதனையை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יִתֵּן என்ற வினையின் மறைந்துள்ள எழுவாய்
  choice: கொடுப்பவரைக் குறிப்பிடாமல் செயப்பாட்டு வடிவத்தைப் பயன்படுத்துதல்
  alternative: ‘அவர் ஏன் ... கொடுக்கிறார்?’ என்று மறைமுகமான தெய்வீக எழுவாயுடன் செயவினை வடிவத்தைப் பயன்படுத்துதல்
  rationale: சூழலில் கடவுளே கொடுப்பவர் எனக் கருத வாய்ப்பிருந்தாலும், இவ்வசனத்தில் எபிரெய உரை அவரை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே யோபுவின் கேள்வியிலுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை. ‘ஒளி’ என்ற மூல உருவகமும், கொடுப்பவர் பெயரிடப்படாதிருப்பதும் பாதுகாக்கப்பட்டுள்ளன. இணையான இரு கூறுகளிலும் வினை மீண்டும் சொல்லப்படுவது இயல்பான தமிழ் ஓட்டத்திற்காகும்.
