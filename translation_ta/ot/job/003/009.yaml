  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: ta
  text: 'அதன் அந்தி மங்கலின் விண்மீன்கள் இருண்டுபோகட்டும்;


    அது ஒளிக்காகக் காத்திருக்கட்டும், ஆனால் ஒளி இருக்கக்கூடாது;


    விடியலின் இமைகளை அது காணாதிருக்கட்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: இருண்டிருக்கட்டும்
  rationale: சாப விருப்பத்தை வெளிப்படுத்தும் இவ்வினைவடிவை இயல்பான தமிழ் வேண்டுதல் வடிவில் தருகிறது; விண்மீன்கள் ஒளியின்றி இருண்டிருப்பதைச் சுருக்கமாகக் காக்கிறது.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: அதன் அந்திவேளையின் விண்மீன்கள்
  rationale: எபிரெயக் கட்டுநிலைத்தொடரையும் உடைமைப் பின்னொட்டையும் காக்கிறது. נֶשֶׁף என்பது குறிப்பாக மாலை மங்கும் அந்திவேளையைக் குறிக்கக்கூடும்.
- source_word: יְקַו לְאוֹר
  choice: அது வெளிச்சத்திற்காகக் காத்திருக்கட்டும்
  rationale: קוה என்பதிலுள்ள எதிர்பார்ப்புடன் காத்திருக்கும் பொருளைக் காக்கிறது; உருவகமாக மனிதப் பண்பு பெற்ற இரவை அளவுக்கு மீறி உளவியல் சார்ந்ததாக ஆக்கவில்லை.
- source_word: וָאַיִן
  choice: ஆனால் வெளிச்சம் இல்லாமல் போகட்டும்
  rationale: எதிர்பார்க்கப்பட்ட வெளிச்சம் வராமல் போகவேண்டும் என்ற சாப விருப்பத்தையும் முந்தைய கூறுடனான முரண்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאַל יִרְאֶה
  choice: அது காணாதிருக்கட்டும்
  rationale: אַל உடன் வரும் எதிர்மறை விருப்பவினையின் சாபத் தொனியைத் தமிழ் வேண்டுதல் வடிவில் காக்கிறது.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: விடியலின் இமைகளை
  rationale: விடியற்காலத்தின் முதல் ஒளித்தோற்றத்தை ‘இமைகள்’ என உருவகிக்கும் எபிரெயக் கவித்துவப் படிமத்தை விளக்கிச் சீராக்காமல் நேரடியாகக் காக்கிறது.
