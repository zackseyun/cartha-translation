  text: לֹ֤א שָׁלַ֨וְתִּי וְ/לֹ֖א שָׁקַ֥טְתִּי וְֽ/לֹא נָ֗חְתִּי וַ/יָּ֥בֹא רֹֽגֶז׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: ta
  text: நான் நிம்மதியாக இருக்கவில்லை[a]; நான் அமைதியாக இருக்கவில்லை; நான் ஓய்வெடுக்கவில்லை; கலக்கம் வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சாந்தியுடன் இருக்கவில்லை; நான் அமைதியாக இருக்கவில்லை; நான் ஓய்வெடுக்கவில்லை.” எபிரெய மொழி, யோபுவுக்கு எந்தத் தணிவும் கிடைக்கவில்லை என்பதை வலுப்படுத்தும் வகையில் பொருளில் நெருக்கமான மூன்று வினைச்சொற்களை இணையாகப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கலக்கம்” என்பதற்கு “தொல்லை” அல்லது “அமைதியின்மை” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் குழப்பம், அமைதியின்மை, அல்லது கொந்தளிப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: நான் நிம்மதியாக இருக்கவில்லை
  rationale: שׁלה/שׁלו என்பது நிம்மதி, தொந்தரவற்ற அமைதி, பாதுகாப்புணர்வு ஆகிய பொருட்களைத் தருகிறது. இங்கு “நிம்மதியாக” என்பது அனுபவ நிலையைக் காட்டி, வெளிப்புறப் பாதுகாப்பு என்ற பொருளை மிகைப்படுத்தாமல் உள்ளது.
- source_word: שָׁקַטְתִּי
  choice: நான் அமைதியாக இருக்கவில்லை
  rationale: שׁקט என்பது தொந்தரவின்றி அமைதியாக அல்லது அடங்கியிருப்பதைக் குறிக்கிறது. “அமைதியாக” என்பது முதல் மற்றும் மூன்றாம் வினைகளிலிருந்து போதிய வேறுபாட்டுடன் இயல்பாக உள்ளது.
- source_word: נָחְתִּי
  choice: நான் ஓய்வாக இருக்கவில்லை
  rationale: נוח என்பது ஓய்வெடுப்பது அல்லது நிலைகொள்வது. “ஓய்வாக இருக்கவில்லை” என்பது மூன்று நிலைசார் வினைகளின் இணைநடையைப் பேணுகிறது.
- source_word: רֹגֶז
  choice: கலக்கம்
  rationale: רֹגֶז என்பது கிளர்ச்சி, நடுக்கம், அமைதியின்மை, குழப்பம் ஆகிய பொருட்களைக் கொள்ளலாம். யோபுவின் புலம்பலில் “கலக்கம்” என்பது அதை வெறும் கோபமாகவோ பொதுவான துன்பமாகவோ குறுக்காமல் உள்ளும் புறமும் ஏற்பட்ட அமைதியின்மையை எடுத்துரைக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தது
  rationale: வினைச்சொல் רֹגֶז வந்தடைந்ததை நேரடியாகக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால் “என்மேல் வந்தது” போன்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: நான் ... இருக்கவில்லை; நான் ... இருக்கவில்லை; நான் ... இருக்கவில்லை
  rationale: மூன்று முறை வரும் மறுப்பு யோபுவின் தீவிரமான புலம்பலையும் ஓசைநடையையும் உருவாக்குகிறது. தமிழிலும் ஒவ்வொரு கூறிலும் மறுப்பைத் திரும்பச் சொல்வது அந்த வலியுறுத்தலைப் பேணுகிறது.
