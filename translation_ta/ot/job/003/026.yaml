translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டது. மூன்று இணையான மறுப்புகளும் அவற்றின் நுண்ணிய பொருள் வேறுபாடுகளும் பேணப்பட்டுள்ளன. மூலத்தின் இறுதி கூறில் “என்மேல்” இல்லாததால் அது சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
