  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: ta
  text: கைதிகள் ஒன்றாக நிம்மதியாக இருக்கிறார்கள்; கட்டாய வேலை வாங்குபவனின்[a] குரலை அவர்கள் கேட்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒடுக்குபவனின்” அல்லது “கடுமையாகக் கோருபவனின்”; இச்சொல் வேலை, வரி, அல்லது கடனை வற்புறுத்தி வாங்குபவரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: எல்லாரும் ஒன்றாக
  rationale: கைதிகள் ஒரே நிலையில் கூட்டாக நிம்மதியுடன் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲסִירִים
  choice: கைதிகள்
  rationale: கட்டப்பட்டவர்கள் அல்லது சிறைப்படுத்தப்பட்டவர்களைக் குறிக்கும் எபிரெயச் சொல்லுக்கு தெளிவான நவீனத் தமிழ் இணை.
- source_word: שַׁאֲנָנוּ
  choice: நிம்மதியாக இருக்கிறார்கள்
  rationale: தொந்தரவும் கட்டாய உழைப்பின் அழுத்தமும் இல்லாத அமைதியான நிலையைக் காட்டுகிறது; முழுமையான இறையியல் ‘இளைப்பாறுதலை’ தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: לֹא שָׁמְעוּ
  choice: கேட்பதில்லை
  rationale: கவிதைச் சூழலில் தொடரும் நிலையை விவரிக்கும் qatal வடிவத்தை இயல்பான தமிழ் நிகழ்காலத்தில் தருகிறது.
- source_word: קוֹל
  choice: குரல்
  rationale: கட்டளையிடுகிற அல்லது வேலை கோருகிற நபரிடமிருந்து கேட்கும் ஒலியை நேரடியாகக் குறிக்கிறது.
- source_word: נֹגֵשׂ
  choice: கட்டாய வேலை வாங்குபவன்
  rationale: வேலையைத் திணித்து வாங்குகிறவர் அல்லது கடுமையாகக் கோருகிறவர் என்ற சொல்லின்具体மான பொருளைச் சூழலுக்கு ஏற்ற நவீன தமிழில் தருகிறது.
