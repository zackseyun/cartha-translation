translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கவிதையின் இரண்டு இணையான கூறுகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; மரணத்திற்குப் பிந்தைய நிலை குறித்து வசனம் கூறுவதைவிட அதிகமான இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
