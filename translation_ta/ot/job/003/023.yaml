  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: ta
  text: தன் வழி மறைக்கப்பட்டிருக்கும், கடவுள் அவனைச் சுற்றி வேலியிட்டிருக்கும் ஒரு மனிதனுக்கு?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֶבֶר
  choice: ஒரு மனிதனுக்கு
  rationale: முந்தைய வசனத்தில் தொடங்கும் ‘ஒளி ஏன் கொடுக்கப்படுகிறது?’ என்ற வினாவின் மறைமுகப் பொருளாக לְ வருகிறது. גֶבֶר இங்கு ஒருமை ஆண்பால் மனிதனைக் குறிக்கிறது.
- source_word: אֲשֶׁר דַּרְכּוֹ
  choice: தன் வழி
  rationale: דֶּרֶךְ என்பது நேரடியான பாதையையோ வாழ்க்கையின் போக்கு அல்லது திசையையோ குறிக்கலாம். ‘வழி’ என்ற சொல் இந்த உருவகத்தையும் அதன் பொருள் நெகிழ்வையும் காக்கிறது.
- source_word: נִסְתָּרָה
  choice: மறைக்கப்பட்டிருக்கிற
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு அல்லது நிலை சார்ந்த பொருளை இது தருகிறது; அந்த மனிதனிடமிருந்து வழி மறைக்கப்பட்டதா அல்லது பொதுவாக மறைந்துள்ளதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וַיָּסֶךְ
  choice: சுற்றி அடைத்திருக்கிற
  rationale: இந்த வினை தடுத்து எல்லையிடுதல் அல்லது சுற்றி அடைத்தல் என்ற கருத்தைத் தருகிறது. தொடரும் விளைவைக் கொண்ட இறைச்செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் வரும் ஒருமை கவிதைச்சொல்லுக்கு நேரடியான, இயல்பான தமிழ்ச் சமமான சொல்.
- source_word: בַּעֲדוֹ
  choice: தன்னைச் சுற்றி
  rationale: இந்த வினையுடன் בַּעַד ஒருவரைச் சுற்றியுள்ள அடைப்பு அல்லது தடையைக் குறிக்கிறது. ‘தன்னை’ என்பது வாக்கியத்தின் மனிதனையே தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: துன்பகரமான அடைப்பின் செய்பவர்
  choice: மனிதனைச் சுற்றி அடைத்தவர் கடவுள் என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
  alternative: இறைச் செயற்பாட்டை மறைக்கும் வகையில் செயப்பாட்டு வாக்கியமாக மட்டும் மொழிபெயர்த்தல்.
  rationale: אֱלוֹהַּ என்பது வினையின் வெளிப்படையான எழுவாய். ஆகவே யோபுவின் முறையீட்டில் கடவுளுக்குக் கூறப்படும் செயற்பாட்டை மொழிபெயர்ப்பு மென்மைப்படுத்தவோ மறைக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், முந்தைய வசனத்திலிருந்து தொடரும் வினாவாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘வழி’ என்ற உருவகமும் கடவுளின் வெளிப்படையான செயற்பாடும் காக்கப்பட்டுள்ளன; ‘மறைக்கப்பட்ட’ என்பதன் உள்ளார்ந்த தெளிவின்மையும் தீர்க்கப்படாமல் விடப்பட்டுள்ளது.
