revisions:
- from: பூமியின் அரசர்களோடும் ஆலோசகர்களோடும்—தங்களுக்காகப் பாழிடங்களைக் கட்டியவர்களோடும்—
  to: தங்களுக்காகப் பாழிடங்களைக் கட்டிய பூமியின் அரசர்களோடும் ஆலோசகர்களோடும்,
  rationale: The revision attaches ‘who built desolate places/ruins for themselves’ directly to ‘kings and counselors of the earth.’ It retains the ambiguity and rhetorical oddity of building ‘பாழிடங்கள்’ and preserves the verse as a continuing clause, ending with a comma.
