source:
  edition: WLC
  text: עִם מְ֭לָכִים וְ/יֹ֣עֲצֵי אָ֑רֶץ הַ/בֹּנִ֖ים חֳרָב֣וֹת לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: ta
  text: தங்களுக்காகப் பாழிடங்களைக் கட்டிய பூமியின் அரசர்களோடும் ஆலோசகர்களோடும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים
  choice: அரசர்கள்
  rationale: ‘Kings’ என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יֹעֲצֵי אָרֶץ
  choice: பூமியின் ஆலோசகர்கள்
  rationale: Construct phrase-ஐ நேரடியாகப் பேணுகிறது; அரச ஆலோசகர்கள் என்று மூலத்தில் இல்லாத வரையறையைச் சேர்க்கவில்லை.
- source_word: חֳרָבוֹת
  choice: பாழிடங்கள்
  rationale: இச்சொல் பாழடைந்த அல்லது வெறிச்சோடிய இடங்கள்/இடிபாடுகளைக் குறிக்கலாம். ‘கட்டினார்கள்’ என்ற வினையுடன் தமிழில் இயல்பாக அமையவும், மூலத்தின் வியப்பூட்டும் பதற்றத்தைப் பேணவும் ‘பாழிடங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָמוֹ
  choice: தங்களுக்காக
  rationale: மூன்றாம் நபர் பன்மை நலப்பொருள்/பயன்பாட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பாழிடங்களைக் கட்டுதல்’ என்ற முரண்பாடுபோன்ற உருவகம்
  choice: உருவகத்தை விளக்காமல் அப்படியே பேணுதல்
  alternative: தங்களுக்காக அரண்மனைகள் அல்லது நினைவுச் சின்னங்களைக் கட்டியவர்கள்
  rationale: மூல எபிரெயத்தில் அரண்மனைகள், கல்லறைகள், நினைவுச் சின்னங்கள் என்று வெளிப்படையாக இல்லை; அவ்வாறு குறிப்பாக்குவது உரையின் உண்மையான பொருள் தெளிவின்மையைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன, கண்ணியமான, வாசிக்க எளிய தமிழ். இது முந்தைய மற்றும் அடுத்த வசனங்களோடு தொடரும் வாக்கியத் துணுக்கு என்பதால் இறுதியில் முற்றுப்புள்ளி இடாமல் காற்புள்ளி வைக்கப்பட்டுள்ளது; இணை அமைப்பை தெளிவாக்க நீண்ட கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
