  text: לָ֤/מָּה לֹּ֣א מֵ/רֶ֣חֶם אָמ֑וּת מִ/בֶּ֖טֶן יָצָ֣אתִי וְ/אֶגְוָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/011.yaml
  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: ta
  text: கருப்பையிலிருந்தே நான் ஏன் இறக்கவில்லை?[a] தாயின் வயிற்றிலிருந்து வெளியே வந்து ஏன் உயிர்விடவில்லை?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கருப்பையிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இது பிறப்பைச் சூழ்ந்த நிலையைக் குறிக்கிறது; ‘கருப்பை’ என்ற சொல்லே பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘சாகவில்லை’ அல்லது ‘கடைசி மூச்சை விடவில்லை’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் முந்தைய ‘இற’ என்பதிலிருந்து வேறுபட்டது; உயிர் பிரிவதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தை வினவும் இயல்பான நவீனத் தமிழ் சொல்; யோபுவின் புலம்பல் தொனியையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: מֵרֶחֶם
  choice: கருப்பையிலிருந்து வெளிவந்தபோதே
  rationale: רֶחֶם என்பது கருப்பையைக் குறிக்கிறது. இவ்விடத்தில் מִן பிறப்பு நிகழும் நேரத்தைக் குறிக்கக்கூடும்; அதனால் தமிழில் இயல்பாகவும், தாயின் உடலைச் சார்ந்த மூல உருவகத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָמוּת
  choice: நான் ... இறக்கவில்லை
  rationale: முதல் நபர் ஒருமை வினை, கடந்துபோன பிறப்பு நிகழ்வைக் குறித்து வருந்தும் எதிர்நிலை வினாவாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מִבֶּטֶן
  choice: தாயின் வயிற்றிலிருந்து
  rationale: בֶּטֶן வயிறு அல்லது கருப்பை எனப் பொருள்படலாம். இணைவரியில் רֶחֶם என்பதிலிருந்து உள்ள சொல் வேறுபாட்டைத் தக்கவைக்க ‘தாயின் வயிறு’ பயன்படுத்தப்பட்டுள்ளது; ‘தாயின்’ என்பது சூழலைத் தெளிவாக்குகிறது.
- source_word: יָצָאתִי
  choice: வெளியே வந்து
  rationale: ‘வெளியேறினேன்/வெளியே வந்தேன்’ என்ற மூலத்தின் தெளிவான உடல்சார் உருவகத்தைத் தக்கவைக்கிறது; ‘பிறந்து’ என்று சுருக்கவில்லை.
- source_word: וְאֶגְוָע
  choice: உயிர்விடவில்லை
  rationale: גוע என்பது இறத்தலை, குறிப்பாக உயிர் பிரிவதைச் சுட்டலாம். முதல் வரியின் מות என்பதற்கான ‘இற’ என்பதிலிருந்து மென்மையான சொல் வேறுபாட்டை இது காக்கிறது.
