translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ‘கருப்பை’ மற்றும் ‘வயிறு’ என வரும் தொடர்புடைய ஆனால் வேறுபட்ட தாயுடல் சொற்களும், ‘இறத்தல்’ மற்றும் ‘உயிர்விடுதல்’ என்ற இரு வினைச்சொற்களின் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. மூலத்தில் ‘ஏன்’ ஒருமுறை மட்டுமே வந்தாலும், தமிழில் இரு இணை வினாக்களின் உறவைத் தெளிவாகவும் இயல்பாகவும் காட்ட அது இரண்டாம் வரியிலும் உணர்த்தப்பட்டுள்ளது.
