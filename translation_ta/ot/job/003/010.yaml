  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: ta
  text: ஏனெனில், அது என் தாயின் கருப்பையின்[a] கதவுகளை மூடவில்லை; என் கண்களிலிருந்து துன்பத்தை மறைக்கவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வயிற்றின்.’ பிறப்புச் சூழலில் ‘கருப்பை’ பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சாபத்திற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய causal தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: סָגַר
  choice: மூடவில்லை
  rationale: கதவுகளை மூடுதல் என்ற மூலத்தின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; எபிரெய மறுப்பு வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: דַּלְתֵי
  choice: கதவுகளை
  rationale: பிறப்பைத் தடுத்திருக்க வேண்டிய கருப்பையின் திறப்பை கதவுகளாகச் சித்தரிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בִטְנִי
  choice: என் தாயின் கருப்பையின்
  rationale: சொல்லுருவில் ‘என் வயிறு/கருப்பை’ என்றிருந்தாலும், ஆண் பேச்சாளரான யோபின் பிறப்பிடத்தைக் குறிக்கும் சூழலில் இயல்பான தமிழுக்கு ‘என் தாயின் கருப்பை’ என்று வெளிப்படுத்துவது அவசியம்.
- source_word: וַיַּסְתֵּר
  choice: மறைக்கவில்லை
  rationale: முந்தைய לֹא என்ற மறுப்பு இரண்டாம் வினைக்கும் பொருளளிப்பதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது; ‘மறைத்தல்’ மூலப் பொருளைத் தக்கவைக்கிறது.
- source_word: עָמָל
  choice: வருத்தம்
  rationale: துன்பம், வேதனை, கடும் உழைப்பு ஆகிய பொருள் வரம்பைக் கொண்ட சொல்லை, யோபின் புலம்பலில் அனுபவிக்கப்படும் துயரைக் குறிக்கும் பரந்த தமிழ் சொல்லால் தருகிறது.
- source_word: מֵעֵינָי
  choice: என் கண்களுக்கு
  rationale: ‘என் கண்களிலிருந்து’ என்ற எபிரெய சொல்லாட்சியின் பொருளை இயல்பான தமிழில் வழங்கி, வருத்தம் யோபின் பார்வைக்கும் அனுபவத்திற்கும் வராமல் மறைக்கப்படவில்லை என்பதைச் சொல்கிறது.
theological_decisions:
- issue: בִטְנִי என்பதன் உரிமைச் சுட்டும் பிறப்புச் சூழலும்
  choice: என் தாயின் கருப்பையின்
  alternative: என் கருப்பையின் / என் வயிற்றின்
  rationale: மூலத்தில் முதல் நபர் உரிமைச் சுட்டு இருந்தாலும், யோபே பேசுவதால் சொற்சொல்லான ‘என் கருப்பை’ தமிழில் தவறாகப் புரியக்கூடும். பிறப்புச் சூழலில் யோபைச் சுமந்த தாயின் கருப்பை குறிக்கப்படுவதைத் தெளிவாக்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; புலம்பலுக்கேற்ற கண்ணியமான தொனி. ‘கருப்பையின் கதவுகள்’ என்ற எபிரெயக் கவித்துவ உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது. வசனத்தின் இரு எதிர்மறை உறுப்புகளும் தமிழில் வெளிப்படையாகத் தரப்பட்டுள்ளன.
