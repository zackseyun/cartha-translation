base_translation:
  language: en
  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: ta
  text: இதற்குப் பிறகு[a], யோபு தன் வாயைத் திறந்து தன் நாளை[b]ச் சபித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதற்குப் பிறகு’ என்பதை ‘அதற்குப் பிறகு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் நாள்’ என்பது சூழலில் யோபு பிறந்த நாளைக் குறிக்கிறது; எபிரேயத்தில் சொல்லர்த்தமாக ‘அவனுடைய நாள்’ என்றுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: நிகழ்வுகளின் தொடர்ச்சியைக் காட்டும் இயல்பான காலத் தொடர்; எபிரேயச் சொற்றொடரின் ‘இதற்குப் பிறகு/அதற்குப் பிறகு’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: தன் வாயைத் திறந்து
  rationale: இது பேசத் தொடங்குவதைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘பேசத் தொடங்கி’ என்று பொருளை மட்டும் கொடுக்காமல், மூலத்தின் சொல்லமைப்பையும் அதன் ஆழ்ந்த உரைநடையையும் பாதுகாக்கிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: וַיְקַלֵּל
  choice: சபித்தான்
  rationale: இங்கு קלל என்பதன் பியேல் வடிவம் ‘சபித்தல்’ என்று பொருள்படும். யோபின் புலம்பலை அறிமுகப்படுத்தும் மூலத்தின் கடுமையை மென்மையாக்காமல் தருகிறது.
- source_word: אֶת יוֹמוֹ
  choice: தன் நாளை
  rationale: சொல்லர்த்தமாக ‘அவனுடைய நாள்.’ அடுத்த வசனங்கள் இது அவன் பிறந்த நாளைக் குறிப்பதாக விளக்கினாலும், இவ்வசனத்தின் சுருக்கமான மூலவடிவம் இங்கே பாதுகாக்கப்படுகிறது. தமிழில் எழுவாயைக் குறிப்பதற்கு ‘தன்’ இயல்பானது.
theological_decisions:
- issue: ‘தன் நாள்’ என்பது யோபு பிறந்த நாளைக் குறிக்கிறது என்பதை முதன்மை உரையிலேயே வெளிப்படுத்த வேண்டுமா?
  choice: முதன்மை உரையில் ‘தன் நாளை’ என்ற சுருக்கமான தொடரை வைத்தல்
  alternative: ‘தான் பிறந்த நாளை’ அல்லது ‘தன் பிறந்த நாளை’
  rationale: இந்த வசனத்தின் எபிரேய உரையில் ‘பிறப்பு’ என்பது வெளிப்படையாக இல்லை; தொடர்ந்து வரும் சூழல் அதைப் புலப்படுத்துகிறது. ஆகவே மூல உரையின் படிப்படியான வெளிப்பாட்டையும் அதன் சுருக்கத்தையும் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் வாயைத் திறந்து’ என்ற மூல மரபுத்தொடரும் ‘தன் நாள்’ என்ற திட்டமிட்ட சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
