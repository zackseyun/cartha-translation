  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: ta
  text: ஏனெனில், என் உணவுக்கு[b] முன்பே என் பெருமூச்சு வருகிறது; என் கதறல்கள்[a] தண்ணீரைப்போல் கொட்டுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கர்ஜனைகள்”; எபிரெயச் சொல் விலங்கின் கர்ஜனை போன்ற உரத்த குரலைக் குறிக்கக்கூடும்; இது யோபின் வேதனையின் தீவிரத்தை எடுத்துக்காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் அப்பம்”; எபிரெயச் சொல் நேரடியாக ‘அப்பம்’ என்பதைக் குறித்தாலும், ஒருவர் உண்ணும் உணவைக் பொதுவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புலம்பலில் யோபின் நிலையை விளக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לִפְנֵי
  choice: முன்பே
  rationale: இங்கு உண்பதற்கு முன்னதாகப் பெருமூச்சு வருகிறது என்ற காலத் தொடர்பை வெளிப்படுத்துகிறது; ‘-ஏ’ தொடர்ச்சியான வேதனையை வலியுறுத்துகிறது.
- source_word: לַחְמִי
  choice: என் உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இங்கு ஒருவர் உண்பதைக் குறிக்கும் விரிவான பொருள் இயல்பான தமிழில் ‘என் உணவு’ எனத் தரப்படுகிறது.
- source_word: אַנְחָתִי
  choice: என் பெருமூச்சு
  rationale: துயரத்தால் எழும் ஆழ்ந்த sigh/groan-ஐ ‘பெருமூச்சு’ இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: תָבֹא
  choice: வருகிறது
  rationale: בוא என்பதன் எளிய ‘வருதல்’ பொருளையும் யோபின் தொடரும் அனுபவத்தையும் நிகழ்காலத்தில் காக்கிறது.
- source_word: וַיִּתְּכוּ
  choice: கொட்டுகின்றன
  rationale: נתך குறிக்கும் கட்டுப்பாடற்ற ஊற்றுதல் அல்லது பாய்தலைத் தண்ணீர் உவமையுடன் உயிரோட்டமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַמַּיִם
  choice: தண்ணீரைப்போல்
  rationale: மூலத்தின் நேரடியான உவமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: שַׁאֲגֹתָי
  choice: என் கதறல்கள்
  rationale: שׁאג என்பது உரத்த, கர்ஜனை போன்ற துயரக் குரல்களைக் குறிக்கலாம். ‘கதறல்கள்’ மனித வேதனையின் சூழலில் இயல்பாக இருந்து அதன் தீவிரத்தையும் காக்கிறது; மேலும் நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
