translation:
  language: ta
  text: 'அளவுகடந்து மகிழ்கிறவர்கள்,

    கல்லறையை[b] கண்டடையும்போது[a] களிகூர்கிறார்கள்—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறையைக் கண்டடைவதால்.’ இங்குள்ள எபிரேய இணைப்புச்சொல் காலத்தையோ காரணத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஒரு கல்லறையை.’ எபிரேயச் சொல்லில் குறிப்பின்மை சாத்தியமாகும்; ஆனால் இச்சூழலில் பொதுவான பொருளில் ‘கல்லறை’ இயல்பாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים אֱלֵי גִיל
  choice: அளவில்லாமல் மகிழ்கிறவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரேய வினையெச்சத்தையும், ‘களிப்பை நோக்கி’ என்ற சொற்றொடரின் தீவிரப்படுத்தும் இடியமையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָשִׂישׂוּ
  choice: களிகூர்கிறார்கள்
  rationale: முந்தைய ‘மகிழ்கிறவர்கள்’ என்பதோடு பொருள் ஒட்டினாலும், உயர்ந்த பேருவகையைச் சுட்டும் கவிதைநய வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: காணும்போது
  rationale: கல்லறையைக் கண்டடைவதே களிகூரும் சந்தர்ப்பம் என்பதை இயல்பாகக் காட்டுகிறது; காரணப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִמְצְאוּ
  choice: காணும்
  rationale: מצא என்பதன் நேரடியான பொருளை இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: קָבֶר
  choice: கல்லறை
  rationale: மரணத்தையும் அடக்கத்தையும் நோக்கிய ஏக்கத்தின் இலக்கைத் தமிழில் தெளிவாகக் குறிக்கிறது; எபிரேயத்தில் இது குறிப்பில்லாத ‘ஒரு கல்லறை’ என்றும் அமையலாம்.
