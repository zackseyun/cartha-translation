translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், யோபின் கவிதைக்குரிய கண்ணியமான சுருக்கத்துடனும் வடிவமைக்கப்பட்டுள்ளது. இரு அடிகளிலும் வரும் “அங்கே” என்பதன் மீளுரைத்தல் எபிரெயக் கவிதை இணைப்பைத் தக்கவைக்கிறது; רֹגֶז என்பதிலுள்ள பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
