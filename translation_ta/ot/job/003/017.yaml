source:
  edition: WLC
  text: שָׁ֣ם רְ֭שָׁעִים חָ֣דְלוּ רֹ֑גֶז וְ/שָׁ֥ם יָ֝נ֗וּחוּ יְגִ֣יעֵי כֹֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: ta
  text: 'அங்கே தீயவர்களின் கொந்தளிப்பு அடங்குகிறது[a];

    அங்கே வலிமை தீர்ந்து சோர்ந்தவர்கள்[b] ஓய்வெடுக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொந்தளிப்பு” என்பதற்கு “அமைதியின்மை,” “சீற்றம்,” அல்லது “கலக்கம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “வலிமையால் சோர்ந்தவர்கள்”; அதாவது, வலிமை தீர்ந்து களைத்தவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னைய சூழலில் யோபு குறிப்பிடும் இடத்தைச் சுட்டும் இடவினையுரையாகவும், கவிதை இணை அமைப்பைப் பேணும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஒழுக்க ரீதியாகத் தீயவர்களைக் குறிக்கும் பெயரடைசார் பெயர்ச்சொல்லைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: חָדְלוּ
  choice: நிறுத்துகிறார்கள்
  rationale: ‘ஓய்தல், நிறுத்துதல்’ என்ற வினையின் பொருளை, இங்கு விவரிக்கப்படும் பொதுநிலைக்கு ஏற்ற நிகழ்காலத்தில் தருகிறது.
- source_word: רֹגֶז
  choice: கொந்தளிப்பதை
  rationale: அமைதியின்மை, சீற்றம், கலக்கம் அல்லது தொந்தரவு ஏற்படுத்துதல் ஆகிய பொருள் நிழல்களை முற்றிலும் ஒன்றாகக் குறுக்காமல், கவிதைச் சூழலில் உள்ள தீவிரமான அமைதியின்மையை வெளிப்படுத்துகிறது.
- source_word: וְשָׁם
  choice: அங்கே
  rationale: இரண்டாம் கவிதை அடியிலும் இடச்சுட்டை மீண்டும் கூறி, எபிரெய இணை அமைப்பையும் வலியுறுத்தலையும் பேணுகிறது; தமிழில் இணைப்புச் சொல் இல்லாமலும் அரைப்புள்ளி மூலம் தொடர்பு இயல்பாகத் தெரிகிறது.
- source_word: יָנוּחוּ
  choice: ஓய்வடைகிறார்கள்
  rationale: ‘ஓய்தல், இளைப்பாறுதல்’ என்ற பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְגִיעֵי כֹחַ
  choice: வலிமை தீர்ந்து சோர்ந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘வலிமையில் சோர்ந்தவர்கள்’ என்ற எபிரெய மரபுத்தொடரை, வலிமை முற்றிலும் குன்றிய நிலையைக் காட்டும் தெளிவான தமிழில் தருகிறது; ‘வலிமை’ என்ற கூறையும் வெளிப்படையாகப் பேணுகிறது.
