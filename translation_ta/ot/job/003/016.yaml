base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: ta
  text: அல்லது, மறைத்து வைக்கப்பட்ட கருச்சிதைந்த கருவைப் போல[a]—ஒளியைக் காணாத[b] பச்சிளம் குழந்தைகளைப் போல—நான் இருந்திருக்க மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைத்து வைக்கப்பட்ட உயிரற்றுப் பிறந்த குழந்தையைப் போல.’ எபிரெயச் சொல் கருச்சிதைவில் வெளியான கருவையோ உயிரற்றுப் பிறந்த குழந்தையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒளியைக் காணுதல்’ என்பது இவ்வுலக வாழ்வில் நுழைந்து அதை அனுபவிப்பதைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: அல்லது
  rationale: யோபு விரும்பிய, பிறக்காமலிருந்திருப்பதற்கான மற்றொரு சாத்தியத்தை அறிமுகப்படுத்துகிறது.
- source_word: כְ/נֵ֣פֶל
  choice: கருச்சிதைந்த கருவைப் போல
  rationale: נֵפֶל என்பது கருச்சிதைவில் வெளியான கருவையோ உயிரற்றுப் பிறந்த குழந்தையையோ குறிக்கலாம். முதன்மை உரையில் சுருக்கமான, நேரடியான சொல்லாக்கம் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: טָ֭מוּן
  choice: மறைத்து வைக்கப்பட்ட
  rationale: טמן என்பதன் மறைத்தல் அல்லது ஒளித்து வைத்தல் என்ற செயலற்ற பொருளைப் பாதுகாக்கிறது; இதைத் திட்டவட்டமாக ‘புதைக்கப்பட்ட’ என்று விளக்கவில்லை.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: நான் இருந்திருக்க மாட்டேன்
  rationale: பிறக்கவே இல்லாதிருந்தால் என்ற முந்தைய எதிர்நிலை விருப்பத்தின் தொடர்ச்சியாக, கடந்தகாலத்தில் நிகழாத இருப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: பச்சிளம் குழந்தைகளைப் போல
  rationale: עֹלְלִים மிக இளம் குழந்தைகளைக் குறிக்கிறது; ‘பச்சிளம் குழந்தைகள்’ நவீனத் தமிழில் வயது மற்றும் சார்புநிலையைத் தெளிவாக உணர்த்துகிறது.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: ஒளியைக் காணாத
  rationale: ‘ஒளியைக் காணுதல்’ என்ற எபிரெய உருவகத்தை அப்படியே பாதுகாக்கிறது; இங்கு அது உலக வாழ்வில் நுழைந்து அதை அனுபவிப்பதைக் குறிக்கிறது.
