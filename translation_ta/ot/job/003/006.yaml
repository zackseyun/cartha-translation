base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: ta
  text: அந்த இரவோ, காரிருள் அதைப் பற்றிக்கொள்ளட்டும்; ஆண்டின் நாட்களிடையே அது மகிழாதிருக்கட்டும்[a]; மாதங்களின் எண்ணிக்கையில் அது இடம்பெறாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டின் நாட்களோடு அது சேராதிருக்கட்டும்.” இங்குள்ள எபிரெய வினைச்சொல் அரிதானது; சிலர் இதை மகிழாமையைக் குறிப்பதாகவும், வேறு சிலர் ஆண்டுக் கணக்கிலிருந்து விலக்கப்படுவதைக் குறிப்பதாகவும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: அந்த இரவோ
  rationale: முன்னிலைப்படுத்தப்பட்ட எபிரெயத் தொடரின் வலியுறுத்தலைத் தமிழின் தலைப்புச் சுட்டான ‘-ஓ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִקָּחֵהוּ
  choice: அதைப் பற்றிக்கொள்ளட்டும்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/கைப்பற்று.’ காரிருள் ஓர் இரவைக் கைப்பற்றும் உருவகத்தை இயல்பான தமிழில் இது தக்கவைக்கிறது.
- source_word: אֹפֶל
  choice: காரிருள்
  rationale: இச்சொல் சாதாரண இருளைவிட அடர்ந்த இருள் அல்லது இருண்மையைக் குறிக்கலாம்; கவிதைநடையின் தீவிரத்தைக் காக்க ‘காரிருள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַל יִחַדְּ
  choice: அது மகிழாதிருக்கட்டும்
  rationale: அரிதான יחד வடிவத்தை மகிழ்ச்சியில் பங்குகொள்ளுதல் என்ற சாத்தியமான பொருளில் மொழிபெயர்க்கிறது. ‘சேருதல்’ என்ற மற்றொரு முக்கியப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִּימֵי שָׁנָה
  choice: ஆண்டின் நாட்களிடையே
  rationale: வருடச் சுழற்சியிலுள்ள நாட்களின் தொகுதிக்குள் இருப்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: மாதங்களின் எண்ணிக்கையில்
  rationale: மாதங்களின் கணக்கில் இடம்பெறுதல் என்ற மூலமொழியின் எண்ணும் படிமத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: אַל יָבֹא
  choice: அது இடம்பெறாதிருக்கட்டும்
  rationale: בוא என்பதன் ‘வருதல்/நுழைதல்’ கருத்தை, ஓர் எண்ணிக்கைக்குள் சேர்க்கப்படுதல் என்ற இச்சூழலில் இயல்பான தமிழாக வழங்குகிறது.
