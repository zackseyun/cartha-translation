  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: ta
  text: சாவுக்காகக் காத்திருக்கிறவர்கள்—ஆனால் அது வருவதில்லை[a]—மறைவான புதையல்களைத் தேடுவதைவிட அதிகமாக அதைத் தோண்டித் தேடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மற்றும் அது அங்கே இல்லை.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘மற்றும் அது இல்லை’; அதாவது, சாவு தோன்றுவதோ வந்து சேருவதோ இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: காத்திருக்கிறவர்கள்
  rationale: חכה என்பதன் அடிப்படைப் பொருள் எதிர்பார்ப்புடன் காத்திருப்பது. சூழலில் ஏக்கம் தொனித்தாலும், அதை வெளிப்படையாகச் சேர்க்காமல் மூலச்சொல்லின் நேரடிப் பொருள் காக்கப்படுகிறது.
- source_word: לַמָּוֶת
  choice: சாவுக்காக
  rationale: לְ முன்னொட்டும் מָוֶת பெயர்ச்சொல்லும் சேர்ந்து, காத்திருப்பதன் இலக்காகச் சாவைக் குறிப்பிடுகின்றன. இயல்பான நவீன தமிழில் ‘சாவுக்காக’ என வழங்கப்படுகிறது.
- source_word: וְאֵינֶנּוּ
  choice: ஆனால் அது வருவதில்லை
  rationale: சொல்லுக்குச் சொல் ‘அது இல்லை’ என்று பொருள்படும் இத்தொடரில், ஆண்பால் ஒருமை பின்னொட்டு ‘சாவை’ச் சுட்டுகிறது. இச்சூழலில் சாவு வந்து சேராததைக் குறிக்கும் உட்பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்படுகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיַּחְפְּרֻהוּ
  choice: அதைத் தோண்டித் தேடுகிறார்கள்
  rationale: חפר என்பதன் நேரடிப் பொருள் ‘தோண்டு’. புதையலைத் தோண்டித் தேடும் வலுவான உருவகத்தைத் தக்கவைத்து, தமிழில் நோக்கம் தெளிவாக இருக்க ‘தேடுகிறார்கள்’ என்பதும் இணைக்கப்படுகிறது.
- source_word: מִמַּטְמוֹנִים
  choice: மறைவான புதையல்களைத் தேடுவதைவிட அதிகமாக
  rationale: מַטְמוֹן என்பது மறைத்து அல்லது சேமித்து வைக்கப்பட்ட செல்வத்தைக் குறிக்கிறது; இங்கு מִן ஒப்பீட்டுப் பொருளில் வருகிறது. தோண்டும் உருவகத்துடன் இயல்பாக இணையுமாறு ஒப்பீட்டின் விடுபட்ட செயல் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
