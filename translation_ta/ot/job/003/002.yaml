lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்பதன் இவ்வடிவம் ஒருவரின் கூற்றுக்குப் பதிலளித்தல் அல்லது அதற்குத் தொடர்ச்சியாகப் பேசுதல் என்ற பொருளில் பேச்சை அறிமுகப்படுத்துகிறது. முன் வசனத்தில் நேரடியான கேள்வி இல்லாததால், இயல்பான தமிழில் ‘மறுமொழியாக’ என்பது ‘பதிலளித்து’ என்பதைவிட விரிந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பதன் எளிய உரையாடல் வலிமையை ‘சொன்னது’ இயல்பாகக் காட்டுகிறது. அடுத்த வசனங்களில் வருவது யோபின் நேரடி உரை என்பதால், தமிழில் உரை அறிமுக வடிவமாக இது பொருந்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் இரு வினைச்சொற்களைக் கொண்ட பேச்சு அறிமுக வாய்பாட்டைத் தக்கவைத்தபடியே, தமிழில் தேவையற்ற செயற்கைத்தன்மையைத் தவிர்க்க ‘மறுமொழியாகச் சொன்னது’ என வழங்கப்பட்டுள்ளது.
