  text: הִנֵּ֤ה הַ/לַּ֣יְלָה הַ֭/הוּא יְהִ֣י גַלְמ֑וּד אַל תָּבֹ֖א רְנָנָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: ta
  text: இதோ, அந்த இரவு மலடாக இருக்கட்டும்; மகிழ்ச்சிக் குரல் அதற்குள் வராதிருக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலிமையையும், இங்கு தொடரும் சாபவாக்கின் கண்ணியமான கவித்துவ நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: גַלְמוּד
  choice: பிள்ளைப்பேறற்றதாக
  rationale: இச்சூழலில், யோபு பிறந்த இரவு எந்தப் பிறப்பையும் கொண்டாடாத இரவாக இருக்க வேண்டும் என்ற உருவகத்தைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் ‘தனிமையானது’ என்பதைவிட பிறப்பு சார்ந்த சொல்லாட்சிக்கு ஏற்றது.
- source_word: רְנָנָה
  choice: மகிழ்ச்சி ஆரவாரம்
  rationale: மகிழ்ச்சியுடன் எழும் உரத்த குரல் அல்லது கொண்டாட்ட ஒலியைச் சுட்டுகிறது; பொதுவான ‘மகிழ்ச்சி’ என்பதைக் காட்டிலும் மூலத்தின் ஒலிசார் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: תָּבוֹא ... בוֹ
  choice: அதற்குள் நுழையாதிருக்கட்டும்
  rationale: ‘அதனுள் வருதல்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காக்கிறது; ஆங்கில ஆலோசனை உரையின் ‘enter it’ என்பதுடனும் ஒத்துள்ளது.
theological_decisions:
- issue: גַלְמוּד என்பதன் பொருள்
  choice: பிள்ளைப்பேறற்றதாக
  alternative: தனிமையானதாக / வெறுமையானதாக
  rationale: சொல் ‘தனித்தது, பிள்ளையற்றது, மலட்டானது’ என்ற பொருள் பரப்பைக் கொண்டது. பிறந்த இரவை யோபு சபிக்கும் உடனடி சூழலில் பிள்ளைப்பேறின்மை முன்னிலைப்படுகிறது; ஆனால் இரவின் உருவகத் தன்மை அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவித்துவ நடை. இரு வேண்டுதல்/சாபவாக்குகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது; தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
