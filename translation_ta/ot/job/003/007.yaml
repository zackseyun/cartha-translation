  source_fidelity: மூல எபிரெயத்தின் இரட்டை விருப்ப/சாபவாக்கு அமைப்பும், ‘அந்த இரவு’ என்ற குறிப்பும், மகிழ்ச்சியான கூக்குரல் அதனுள் வரக்கூடாது என்பதும் வரைவில் காக்கப்பட்டுள்ளன. ஆனால் גַלְמוּד என்பது ‘தனித்த/வெறுமையான, மலட்டான’ என்ற உருவகப் பொருளை உடையது; இரவுக்குச் ‘பிள்ளைப்பேறற்றதாக’ என்பதைக் கூறுவது தமிழில் தேவையற்ற மனிதர்மயமாக்கலையும் குறுகிய விளக்கத்தையும் தருகிறது.
  naturalness: ‘மலடாக’ என்பது இச்சாபக் கவிதையின் உருவகத்துக்கு இயல்பான, சுருக்கமான தமிழ். ‘மகிழ்ச்சிக் குரல்’ רְנָנָהவின் மகிழ்ச்சியான முழக்கம்/கூக்குரல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘அதற்குள் வராதிருக்கட்டும்’ மூலத்தின் ‘அதனுள் வருதல்’ உருவகத்தைத் தக்கவைக்கிறது.
