id: JOB.3.8
reference: Job 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִקְּבֻ֥/הוּ אֹרְרֵי י֑וֹם הָ֝/עֲתִידִ֗ים עֹרֵ֥ר לִוְיָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: ta
  text: நாட்களைச் சபிப்பவர்கள்—லிவியாதானை எழுப்பத் தயாராய் இருப்பவர்கள்—அதைச் சபிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: நாட்களைச் சபிப்பவர்கள்
  rationale: יוֹם ஒருமை வடிவில் இருந்தாலும், ஒரு வகுப்பைக் குறிக்கும் பொதுப்பொருளில் வருவதால் ‘நாட்களை’ என இயல்பாக மொழிபெயர்க்கப்பட்டது; முன்னுள்ள ‘அந்த இரவை’ குறிக்கும் ‘அதை’ என்ற சுட்டைத் தக்கவைக்கிறது.
- source_word: הָעֲתִידִים
  choice: தயாரானவர்கள்
  rationale: இங்கு ‘ஆயத்தமாயிருப்பவர்கள்/துணிவுடையவர்கள்’ என்ற பொருள் சாத்தியம்; சூழலில் லிவியாதானை எழுப்பும் திறனும் ஆயத்தமும் கொண்ட சாபவல்லுநர்களைக் குறிக்கும் இயல்பான சொல்.
- source_word: עֹרֵר
  choice: எழுப்ப
  rationale: ‘கிளர்த்துதல், விழித்தெழச் செய்தல்’ என்ற செயற்பொருளை நேரடியாகத் தருகிறது.
- source_word: לִוְיָתָן
  choice: லிவியாதான்
  rationale: குறிப்பிட்ட மர்மமான கடல் உயிரின் பெயரை விளக்கிப் பொருள்மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் கவித்துவ மற்றும் புராணவியல் ஒலிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: லிவியாதானின் அடையாளம்
  choice: பெயரை ‘லிவியாதான்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘கடல் அரக்கன்’ அல்லது குறிப்பிட்ட இயற்கை விலங்காக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் அதன் துல்லிய அடையாளத்தை விளக்கவில்லை. ஆகவே அதை சாத்தான், முதலை, அல்லது வேறு உயிரினம் என்று தீர்மானித்து மொழிபெயர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபுவின் சாபக் கவிதைக்குரிய உயர்ந்த ஆனால் எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. எபிரேய இணைவரி அமைப்பை வெளிப்படுத்த இரண்டாம் வரியில் ‘அதைச் சபிக்கட்டும்’ மீளக் கூறப்பட்டுள்ளது; இது தமிழில் உறவைத் தெளிவாக்கும் வெளிப்படுத்தப்பட்ட நிரப்பு.
