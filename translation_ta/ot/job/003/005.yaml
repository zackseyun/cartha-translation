  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: ta
  text: இருளும் ஆழ்ந்த இருளும்[a] அதை மீண்டும் கைப்பற்றட்டும்; மேகம் அதன்மேல் குடிகொள்ளட்டும்; பகலின் இருள்கள்[b] அதைத் திகிலுறச் செய்யட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: צַלְמָוֶת என்பதற்கு ‘மரண நிழல்’ அல்லது ‘காரிருள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பகலின் இருள்கள்’ என்ற சொற்றொடரின் பொருள் தெளிவில்லை; இதை ‘பகலின் கருமை,’ ‘பகலை இருளாக்கும் நிகழ்வுகள்’ அல்லது, சாத்தியம் குறைவாக, ‘பகலின் கசப்புகள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: அதை மீண்டும் தமதாக்கிக்கொள்ளட்டும்
  rationale: גאל என்பதன் மீட்டல் அல்லது உரிமையோடு மீண்டும் எடுத்துக்கொள்ளுதல் என்ற அடிப்படை உணர்வைப் பாதுகாக்கிறது. இங்கு இருள் அந்த நாளைத் திரும்பப் பெற்றுக்கொள்வது போன்ற எதிர்மறையான உருவகம் இருப்பதால், நன்மை சார்ந்த இறையியல் பொருளைத் தூண்டக்கூடிய ‘மீட்கட்டும்’ என்பதற்குப் பதிலாக இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: பிறந்த நாள் இல்லாமற்போக வேண்டும் என்ற யோபின் சாப வேண்டுதலில் வரும் நேரடியான இருள் உருவகத்தை இயல்பாகக் காட்டுகிறது.
- source_word: צַלְמָוֶת
  choice: ஆழ்ந்த இருள்
  rationale: இச்சொல் மரண நிழல் என்றும் மிக ஆழமான இருள் என்றும் புரிந்துகொள்ளப்படலாம். மூலத்தின் அச்சமூட்டும் தீவிரத்தைக் காத்து, ‘மரணம்’ என்பதைத் தேவையின்றி உறுதிப்படுத்தாமல் இருக்க ‘ஆழ்ந்த இருள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִּשְׁכָּן עָלָיו
  choice: அதன்மேல் குடிகொள்ளட்டும்
  rationale: שׁכן என்பதன் தங்குதல், வசித்தல் என்ற நீடித்த உணர்வையும், மேகம் அந்த நாளின்மேல் நிலைத்திருக்கும் கவித்துவப் படிமத்தையும் காக்கிறது.
- source_word: עֲנָנָה
  choice: மேகம்
  rationale: வானிலை சார்ந்த தெளிவான ஒருமை உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: יְבַעֲתֻהוּ
  choice: அதைத் திகிலடையச் செய்யட்டும்
  rationale: בעת என்பதன் தீவிரமான அச்சுறுத்தல் அல்லது திடீர் திகில் ஏற்படுத்துதல் என்ற காரணவினைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: כִּמְרִירֵי יוֹם
  choice: பகலின் இருள்கள்
  rationale: இது பொருள் தெளிவில்லாத சொற்றொடர். சுற்றியுள்ள இருள் மற்றும் மேகப் படிமங்களோடு பொருந்தும் ‘இருட்டுகள்/கருமைகள்’ என்ற புரிதல் முதன்மைப்படுத்தப்படுகிறது. எபிரெயப் பன்மையையும் கவித்துவமான புதிர்த்தன்மையையும் ‘இருள்கள்’ காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் உள்ளன.
