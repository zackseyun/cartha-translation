translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நான் அஞ்சிய அச்சமே’ என்பது சற்றே இலக்கியத் தன்மை கொண்டிருந்தாலும், மூலத்தின் வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது; இரு இணை அடிகளிலும் ‘என்மேல்’/‘எனக்கு’ என்ற வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
