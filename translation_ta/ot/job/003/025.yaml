source:
  edition: WLC
  text: כִּ֤י פַ֣חַד פָּ֭חַדְתִּי וַ/יֶּאֱתָיֵ֑/נִי וַ/אֲשֶׁ֥ר יָ֝גֹ֗רְתִּי יָ֣בֹא לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: ta
  text: ஏனெனில், நான் அஞ்சிய அச்சமே என்மேல் வந்துவிட்டது[a][b]; நான் பயந்தது எனக்கு வந்துவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பயந்த காரியமே என்மேல் வந்துவிட்டது.” எபிரெயத்தில் வலியுறுத்துவதற்காக ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன—சொல்லுக்குச் சொல், “நான் அஞ்சிய அச்சம்.”
    reason: lexical_alternative
  - marker: b
    text: முதல் அடியிலுள்ள வினைச்சொல், “என்மேல் வந்தது” அல்லது “என்னை வந்தடைந்தது” என்று பொருள்படலாம்; இரண்டாம் அடி இன்னும் நேரடியாக, “எனக்கு வந்தது” என்று கூறுகிறது. இவ்வாறு எபிரெய இணை அடிகளில் ஒரு நுட்பமான வேறுபாடு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோபு கூறிய புலம்பலுக்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פַחַד פָּחַדְתִּי
  choice: நான் அஞ்சிய அச்சமே
  rationale: ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லையும் வினைச்சொல்லையும் பயன்படுத்தும் எபிரெய வலியுறுத்தலைத் தமிழிலும் முடிந்தவரை காக்கிறது; ‘அச்சமே’ என்பது தீவிரத்தையும் தருகிறது.
- source_word: וַיֶּאֱתָיֵנִי
  choice: என்மேல் வந்துவிட்டது
  rationale: ஒரு தீங்கு ஒருவர்மேல் வந்து நேரிடுதல் என்ற பொருளைத் தருவதோடு, இரண்டாம் அடியின் ‘எனக்கு வந்துவிட்டது’ என்பதிலிருந்து எபிரெயத்தில் உள்ள நுட்பமான வேறுபாட்டையும் காக்கிறது.
- source_word: וַאֲשֶׁר
  choice: நான் பயந்தது
  rationale: தொடர்புப்பெயரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, இரண்டாம் இணை அடியைத் தெளிவாக அமைக்கிறது.
- source_word: יָגֹרְתִּי
  choice: நான் பயந்தது
  rationale: அஞ்சுதல் அல்லது பயப்படுதல் என்ற பொருளை நேரடியாகத் தருகிறது; முதல் அடியின் வலியுறுத்தப்பட்ட சொற்றொடருக்கு இணையாகவும் வேறுபட்ட சொல்லாட்சியுடனும் அமைகிறது.
- source_word: יָבֹא לִי
  choice: எனக்கு வந்துவிட்டது
  rationale: எபிரெயத்தின் எளிய ‘எனக்கு வரும்’ என்ற இயக்க உருவகத்தைத் தக்கவைத்து, நிகழ்வு ஏற்கெனவே நேர்ந்துள்ள சூழலைத் தமிழின் நிறைவுப்பொருள் வடிவில் இயல்பாகச் சொல்கிறது.
