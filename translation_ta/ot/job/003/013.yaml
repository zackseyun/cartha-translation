  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: ta
  text: ஏனெனில், இப்போது நான் படுத்து, அமைதியாக இருந்திருப்பேன்[a]; நான் உறங்கியிருப்பேன்—அப்போது எனக்கு ஓய்வு இருந்திருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமைதியாக இருந்திருப்பேன்” என்பதற்கு “சலனமின்றி இருந்திருப்பேன்” அல்லது “நிம்மதியாக இருந்திருப்பேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அப்போது நான் ஓய்வில் இருந்திருப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோபு வெளிப்படுத்திய விருப்பத்திற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: பிறந்தபோதே இறந்திருந்தால் தற்போதைய நிலை எப்படியிருக்கும் என்ற எதிர்நிகழ்வுக் கருத்தின் காலக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: שָׁכַבְתִּי
  choice: நான் படுத்து ... இருந்திருப்பேன்
  rationale: שכב என்பதன் உடல்சார்ந்த ‘படுத்தல்’ உருவகத்தைப் பாதுகாத்து, சூழலுக்குரிய கடந்தகால எதிர்நிகழ்வை ‘இருந்திருப்பேன்’ என்ற வடிவில் வெளிப்படுத்துகிறது.
- source_word: וְאֶשְׁקֹט
  choice: அமைதியாக இருந்திருப்பேன்
  rationale: שקט குறிக்கும் தொந்தரவற்ற அமைதியைப் பாதுகாக்கிறது; ‘சமாதானத்தில்’ என்று மொழிபெயர்த்து கூடுதல் விளக்கம் புகுத்துவதைத் தவிர்க்கிறது.
- source_word: יָשַׁנְתִּי
  choice: நான் உறங்கியிருப்பேன்
  rationale: மரணத்தைக் குறிக்கும் உறக்க உருவகத்தை விளக்கமாக மாற்றாமல், எபிரெயச் சொல்லின் சாதாரண பொருளையே தக்கவைக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: படுத்தல் மற்றும் உறக்கத்தைத் தொடர்ந்து வரும் ஓய்வின் விளைவு நிலையைச் சுட்டுகிறது.
- source_word: יָנוּחַ לִי
  choice: எனக்கு ஓய்வு கிடைத்திருக்கும்
  rationale: ‘எனக்காக ஓய்வு இருந்திருக்கும்’ என்பதற்கு நெருக்கமான எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய ‘அமைதி’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: மரணம் உறக்கம் மற்றும் ஓய்வு என்ற உருவகங்களால் சித்தரிக்கப்படுதல்
  choice: படுத்தல், உறங்குதல், ஓய்வு ஆகிய சொற்களை உருவகங்களாகவே தக்கவைத்தல்
  alternative: ‘நான் இறந்திருப்பேன்’ அல்லது ‘மரணத்தில் ஓய்வடைந்திருப்பேன்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் மரணத்தில் விரும்பப்படும் இளைப்பாறுதலைக் கவித்துவமாகச் சித்தரிக்கிறது; ஆனால் இறந்தோரின் நிலையைப் பற்றிய முழுமையான கோட்பாட்டை வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் உருவகமும் இறையியல் பதற்றமும் தீர்க்கப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கடந்தகால எதிர்நிகழ்வை ‘இருந்திருப்பேன்/உறங்கியிருப்பேன்/கிடைத்திருக்கும்’ என்ற தொடரால் தெளிவாக்கி, எபிரெயக் கவிதையின் படுத்தல்–உறக்கம்–ஓய்வு இணைப்பைத் தக்கவைக்கிறது.
