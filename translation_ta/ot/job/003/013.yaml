- from: ஏனெனில், இப்போது நான் படுத்து அமைதியாக இருந்திருப்பேன்[a]; நான் உறங்கியிருப்பேன்—அப்போது எனக்கு ஓய்வு கிடைத்திருக்கும்[b].
  to: ஏனெனில், இப்போது நான் படுத்து, அமைதியாக இருந்திருப்பேன்[a]; நான் உறங்கியிருப்பேன்—அப்போது எனக்கு ஓய்வு இருந்திருக்கும்[b].
