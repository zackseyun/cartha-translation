source:
  edition: WLC
  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: ta
  text: சிறியவரும் பெரியவரும் அங்கே இருக்கிறார்கள்; அடிமை[a] தன் எஜமானிடமிருந்து விடுதலையாக இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமை’ என்பதற்கான எபிரேயச் சொல் ‘வேலைக்காரன்’ என்றும் பொருள்படலாம்; ஆனால் எஜமானிடமிருந்து விடுதலையாக இருப்பது என்ற எதிரிணை இங்கே அடிமை நிலையைக் குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: சிறியோன்
  rationale: גָדוֹל என்பதற்கு எதிரிணையாக, உடல் அளவை மட்டும் அல்லாமல் தாழ்ந்த சமூக நிலை அல்லது முக்கியத்துவம் குறைந்தவரைக் குறிக்கிறது; எபிரேயத்தின் சுருக்கமான எதிரிணையைப் பாதுகாக்கிறது.
- source_word: גָדוֹל
  choice: பெரியோன்
  rationale: קָטֹן என்பதற்கு எதிரிணையாக, உயர்ந்த நிலை அல்லது முக்கியத்துவம் உடையவரைக் குறிக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய சூழலில் கூறப்படும் மரணத்தின் இடத்தைச் சுட்டுகிறது; சுட்டிடைச் சொல்லின் இயல்பைத் தக்கவைக்கிறது.
- source_word: הוּא
  choice: இருக்கிறார்கள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும், முன்வரும் சிறியோன்–பெரியோன் என்ற இணையைச் சேர்த்துக் கூறுகிறது; தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது. மூலத்தில் வெளிப்படையாக இல்லாத ‘ஒரே நிலையில்’ போன்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: எஜமானிடமிருந்து விடுதலை என்ற எதிர்மறை இணைப்பு கட்டுப்பட்ட அடிமை நிலையைக் குறிப்பாக முன்னிறுத்துவதால், ‘வேலைக்காரன்’ என்பதைக் காட்டிலும் ‘அடிமை’ பொருத்தமானது.
- source_word: חָפְשִׁי
  choice: விடுதலையாக
  rationale: அடிமைத்தனத்திற்கு எதிரான சுதந்திர நிலையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מֵאֲדֹנָיו
  choice: தன் எஜமானிடமிருந்து
  rationale: מִן பிரிவைக் குறிக்கிறது; உடைமைப் பின்னொட்டு ‘தன்’ என்று இயல்பாக வழங்கப்படுகிறது; மனித அடிமை–எஜமானன் உறவுக்கு ‘எஜமான்’ பொருந்துகிறது.
