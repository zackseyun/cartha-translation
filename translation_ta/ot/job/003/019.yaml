  register: நவீன தரத் தமிழில், கவிதைக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. சமூக நிலையைச் சுட்டும் קָטֹן / גָדוֹל எதிரிணைக்கு ‘சிறியோன் / பெரியோன்’ பயன்படுத்தப்பட்டது. அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
