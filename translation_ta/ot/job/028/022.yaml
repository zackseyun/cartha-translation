source:
  edition: WLC
  text: אֲבַדּ֣וֹן וָ֭/מָוֶת אָ֣מְר֑וּ בְּ֝/אָזְנֵ֗י/נוּ שָׁמַ֥עְנוּ שִׁמְעָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: ta
  text: 'அபத்தோனும் மரணமும் சொல்கின்றன[a]: “எங்கள் காதுகளால் அதைப் பற்றிய செய்தியைக் கேட்டிருக்கிறோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அழிவும் மரணமும் சொன்னன: ‘எங்கள் காதுகளால் அதைப் பற்றிய ஒரு செய்தியைக் கேட்டோம்.’”'
    reason: ‘அபத்தோன்’ என்பதற்கு ‘அழிவு’ என்றும், வினைகளை இறந்தகாலத்திலும், שִׁמְעָהּ என்பதை ‘செய்தி/வதந்தி’ என்றும் மொழிபெயர்க்கலாம் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: அபத்தோன்
  rationale: அழிவு நிலையையோ சக்தியையோ குறிக்கும் எபிரேயப் பெயரை ஒலிபெயர்த்துள்ளோம். மரணத்துடன் இணைந்து பேசுவதாக உருவகப்படுத்தப்பட்டிருப்பதால், ‘அழிவு’ என்று கருத்தை மட்டும் கூறாமல் கவித்துவ ஆளுருவாக்கத்தைப் பாதுகாக்கிறது.
- source_word: וָמָוֶת
  choice: மரணமும்
  rationale: இணைப்புச் சொல்லை ‘-உம்’ மூலம் இயல்பாகத் தந்து, அபத்தோனுடன் சேர்ந்து பேசும் ஆளுருவாக்கப்பட்ட மரணத்தைப் பாதுகாக்கிறது.
- source_word: אָמְרוּ
  choice: சொல்கின்றன
  rationale: வடிவியல் அடிப்படையில் இறந்தகால வினையாக இருந்தாலும், இக்கவிதைச் சூழலில் உயிரோட்டமான அல்லது பொதுநிலை நிகழ்காலமாகப் பொருள்கொள்ள முடியும். உயிரற்ற நிலைகள் ஆளுருவாக்கப்படுவதால் தமிழ் இலக்கண இயல்புப்படி அஃறிணைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּאָזְנֵינוּ
  choice: எங்கள் காதுகளால்
  rationale: நேரடியாகக் கேட்டதைக் குறிக்கும் எபிரேய மொழியுருவை இயல்பான தமிழில் முடிந்தவரை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שָׁמַעְנוּ
  choice: கேட்டிருக்கிறோம்
  rationale: முன்பு கேட்ட செய்தி இப்போதைய கூற்றுக்கு ஆதாரமாக இருப்பதைத் தெரிவித்து, எபிரேய நிறைவுற்ற வினையின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁמְעָהּ
  choice: அதைப் பற்றிய செய்தி
  rationale: இச்சொல் ‘செய்தி’, ‘கேள்வி’, ‘வதந்தி’ ஆகிய பொருட்களை ஏற்கலாம். சூழலில் பெண்பால் பின்னொட்டு ஞானத்தைச் சுட்டுவதால் ‘அதைப் பற்றிய செய்தி’ எனத் தரப்பட்டுள்ளது; நேரடி அறிவுக்கு மாறாகக் கேள்விப்பட்ட அறிவு என்ற நுணுக்கமும் நிலைக்கிறது.
theological_decisions:
- issue: அபத்தோனும் மரணமும் ஆளுருவாக்கப்படுதல்
  choice: இரண்டையும் பேசவும் கேட்கவும் செய்பவையாகக் கவித்துவ ஆளுருவாக்கத்துடன் மொழிபெயர்த்தல்
  alternative: ‘அழிவும் மரணமும்’ என்று அருவக் கருத்துகளாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் அவற்றைப் பேசுபவர்களாகவும் காதுகளால் கேட்பவர்களாகவும் காட்டுகிறது. ‘அபத்தோன்’ என்ற ஒலிபெயர்ப்பு இந்த உருவகத்தைப் பாதுகாக்கிறது; அதேவேளை அவை தனிப்பட்ட ஆன்மிக உயிர்கள் என்று உரை கூறுவதைக் காட்டிலும் அதிகமான முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அபத்தோன்’ பொதுவாசகருக்கு அறிமுகமற்றிருக்கலாம் என்பதால் அடிக்குறிப்பில் ‘அழிவு’ என்ற பொருள் தரப்பட்டுள்ளது. ‘சொல்கின்றன’ என்பது தமிழ் அஃறிணைப் பன்மை இலக்கணத்துக்கு ஏற்றது; ஆளுருவாக்கத்தை மறைக்காது.
