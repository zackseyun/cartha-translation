source:
  edition: WLC
  text: רָאמ֣וֹת וְ֭/גָבִישׁ לֹ֣א יִזָּכֵ֑ר וּ/מֶ֥שֶׁךְ חָ֝כְמָ֗ה מִ/פְּנִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: ta
  text: 'பவளமும் படிகமும் குறிப்பிடத்தக்கவை அல்ல;

    ஞானத்தின் விலையோ முத்துக்களைவிட[a] உயர்ந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முத்துக்கள்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் எந்த விலைமதிப்புள்ள பொருளைக் குறிக்கிறது என்பது உறுதியில்லை; “பவளங்கள்” அல்லது “விலைமதிப்புள்ள கற்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: פְּנִינִים என்ற அரிய பொருட்பெயரின் உண்மையான குறிப்பு விவாதத்திற்குரியது; மூலத்தின் தெளிவின்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: רָאמוֹת
  choice: பவளம்
  rationale: இந்த அரிய எபிரெயச் சொல்லுக்கு இச்சூழலில் பொதுவாக ஏற்கப்படும் பொருள் ‘பவளம்’; விலைமதிப்புள்ள பொருட்களின் பட்டியலுக்கும் இது பொருந்துகிறது.
- source_word: גָבִישׁ
  choice: படிகம்
  rationale: தெளிவான கனிமப் பொருளைக் குறிக்கும் சொல்லாக ‘படிகம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לֹא יִזָּכֵר
  choice: குறிப்பிடத்தக்கவை அல்ல
  rationale: சொல்லுக்கு நேரடியாக ‘குறிப்பிடப்படாது’ என்று பொருள்; ஒப்பீட்டுச் சூழலில், ஞானத்துக்கு முன் அவை மதிப்பிடத் தகாதவை என்பதைக் கூறும் இயல்பான தமிழ் வடிவம் இது.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: ஞானத்தின் விலை
  rationale: מֶשֶׁךְ என்பது அரிதான சொல்லாக இருந்தாலும், இங்குள்ள விலைமதிப்பு ஒப்பீட்டில் ‘ஞானத்தின் விலை’ என்பது சூழலுக்கு ஏற்ற, வாசிக்க இயல்பான மொழிபெயர்ப்பு.
- source_word: פְּנִינִים
  choice: முத்துக்கள்
  rationale: விலைமதிப்புள்ள அணிகலப் பொருட்களைக் குறிக்கும் மரபான புரிதலைப் பின்பற்றுகிறது; துல்லியமான கல் அல்லது பொருள் குறித்து உறுதியின்மை இருப்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டது.
theological_decisions:
- issue: ஞானத்தின் ஒப்பற்ற மதிப்பு
  choice: ஞானத்தின் விலை முத்துக்களைவிட உயர்ந்தது
  alternative: ஞானத்தைப் பெறுவது முத்துக்களைவிட மேலானது
  rationale: மூலத்தின் பொருளாதார மதிப்பு உருவகத்தைத் தக்கவைத்து, ஞானத்தை வாங்கிக்கொள்ள முடியும் என்ற தேவையற்ற கோட்பாட்டுத் தீர்மானத்தைச் சேர்க்காமல் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. இரண்டு இணையான அடிகளாக அமைத்து, ஞானத்துக்கும் விலைமதிப்புள்ள பொருட்களுக்கும் இடையிலான தீவிர ஒப்பீட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
