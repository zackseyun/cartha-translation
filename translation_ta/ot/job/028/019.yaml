  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: ta
  text: கூஷின் புஷ்பராகம் அதற்கு ஈடாகாது[a]; தூய தங்கத்தாலும் அதன் மதிப்பை அளவிட முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூஷின் கிரிசோலைட்’ அல்லது ‘கூஷின் பெரிடாட்’; פִּטְדָה குறிக்கும் கல் எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: அதற்கு ஈடாகாது
  rationale: ערך இங்கு மதிப்பு அல்லது தகுதியில் ஒப்பாக இருப்பதைக் குறிக்கிறது. சூழலில் பெண்பால் ஒருமை பின்னொட்டு ஞானத்தைக் குறிக்கிறது; தமிழில் இயல்பாக ‘அதற்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: פִּטְדַת כּוּשׁ
  choice: கூஷின் புஷ்பராகம்
  rationale: פִּטְדָה என்பது ஒரு விலையுயர்ந்த கல்; அதன் துல்லியமான கனிம அடையாளம் உறுதியில்லை. மரபாக அறியப்படும் ‘புஷ்பராகம்’ முதன்மை உரையில் வைக்கப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. כּוּשׁ பெயர்ப்பெயராக ‘கூஷ்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכֶתֶם טָהוֹר
  choice: தூய தங்கத்தாலும்
  rationale: כֶּתֶם உயர்தரமான அல்லது சுத்திகரிக்கப்பட்ட தங்கத்தையும், טָהוֹר தூய்மையையும் குறிக்கின்றன. ב மதிப்பீட்டின் அளவுகோல் அல்லது கருவியைக் குறிப்பதால் தமிழில் ‘தங்கத்தாலும்’ இயல்பாக உள்ளது.
- source_word: תְסֻלֶּה
  choice: அதன் மதிப்பை அளவிட முடியாது
  rationale: இச்சூழலில் வினை வெறும் உடல் எடையை நிறுப்பதைவிட மதிப்பிடுதல் அல்லது விலை நிர்ணயித்தலைக் குறிக்கிறது. ஞானத்தின் ஒப்பற்ற மதிப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
