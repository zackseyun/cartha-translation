reference: Job 28:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: ta
  text: ஆழம், “அது என்னுள் இல்லை” என்கிறது; கடல், “அது என்னுடன் இல்லை” என்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: ஆழம்
  rationale: பெரும் நீராழத்தைக் குறிக்கும் எபிரெயச் சொல்லைச் சுருக்கமாகவும், அடுத்த அடியிலுள்ள ‘கடல்’ என்பதுடன் கவிதை இணைநிலையைப் பேணும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: אָמַר
  choice: என்கிறது
  rationale: எபிரெயக் கவிதையில் உயிரூட்டப்பட்ட ஆழமும் கடலும் இப்போது பேசுவதுபோன்ற நேரடியான காட்சியை நிகழ்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא בִי הִיא
  choice: அது என்னுள் இல்லை
  rationale: בִי என்பதன் ‘என்னுள்’ என்ற இடவுணர்வை நேரடியாகப் பேணுகிறது. הִיא என்பது சூழலில் ஞானத்தைக் குறிக்கும் பெண்பால் ஒருமைச் சுட்டுப்பெயர்; தமிழில் ‘ஞானம்’ இயல்பாக ‘அது’ எனச் சுட்டப்படுவதால் முதன்மை உரையில் அதைப் பயன்படுத்தி, மூலத்தின் பெண்பால் வடிவத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: יָם
  choice: கடல்
  rationale: சொல்லின் இயல்பான பொருளையும் ‘ஆழம்’ என்பதுடனான கவிதை இணைநிலையையும் தக்கவைக்கிறது.
- source_word: אֵין עִמָּדִי
  choice: அது என்னுடன் இல்லை
  rationale: உடனிராமை அல்லது தன்னிடம் இல்லாமை ஆகிய இரு நிழற்பொருள்களையும் கொண்ட எபிரெயச் சொற்றொடரின் இட-உறவு உருவகத்தைத் தீர்த்துவிடாமல் பேணுகிறது.
theological_decisions:
- issue: ஞானத்தைக் குறிக்கும் பெண்பால் சுட்டுப்பெயரும் ஆளுருவாக்கமும்
  choice: முதன்மை உரையில் தமிழுக்கு இயல்பான ‘அது’; மூலத்தின் ‘அவள்’ வடிவம் அடிக்குறிப்பில்
  alternative: முதன்மை உரையிலேயே ‘அவள்’
  rationale: எபிரெயில் ஞானத்தைக் குறிக்கும் הִיא பெண்பால் வடிவில் உள்ளது. ஆனால் தமிழில் ‘ஞானம்’ என்பதற்கு ‘அவள்’ என்பது இயல்புக்கு மீறிய தனிநபர் பொருளைச் சேர்க்கக்கூடும். பேசும் ‘ஆழம்’ மற்றும் ‘கடல்’ வழியாக ஆளுருவாக்கம் உரையிலேயே தொடர்கிறது; பெண்பால் விவரம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் உள்ள கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. இரு இணை அடிகளிலும் ‘என்கிறது’ என்ற நிகழ்கால வடிவமும் ‘என்னுள்/என்னுடன்’ என்ற வேறுபாடும் மூலத்தின் அமைப்பைப் பேணுகின்றன.
