  to: 'அது எல்லா உயிரினங்களின் கண்களுக்கும் மறைவாக உள்ளது;

    வானத்துப் பறவைகளுக்கும் அது மறைக்கப்பட்டுள்ளது.'
  rationale: 'A minimal stylistic revision replaces an awkward Tamil collective genitive with an idiomatic expression for the universal living-creature scope. No footnote is needed: ‘வானத்துப் பறவைகள்’ is clear in Tamil and adequately represents the Hebrew ‘birds of the heavens.’'
