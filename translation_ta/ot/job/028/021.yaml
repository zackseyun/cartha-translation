  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: ta
  text: 'அது எல்லா உயிரினங்களின் கண்களுக்கும் மறைவாக உள்ளது;

    வானத்துப் பறவைகளுக்கும் அது மறைக்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: அது ... மறைவாக இருக்கிறது
  rationale: עלם என்பதன் நிஃபால் முற்றுவினை, முந்தைய சூழலில் வரும் பெண்பால் பொருளான ஞானத்தைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய எழுவாயாக ‘அது’ சேர்க்கப்பட்டு, மறைந்திருக்கும் விளைவு நிலை காக்கப்பட்டுள்ளது.
- source_word: מֵעֵינֵי
  choice: கண்களுக்கும் மறைவாக
  rationale: מן + עיניים என்ற எபிரெய உருவகத்தை ‘கண்கள்’ என்பதன் மூலம் காக்கிறது; ‘-க்கும்’ இங்கு ஒருவரின் பார்வைக்கு எட்டாதிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָל חָי
  choice: உயிருள்ள அனைத்தின்
  rationale: இந்தச் சொற்றொடரின் பரந்த, உலகளாவிய பொருளைக் காக்கிறது; மனிதர்களுக்கு மட்டும் வரையறுக்காமல் உயிருள்ள அனைத்தையும் உள்ளடக்குகிறது.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகளுக்கும்
  rationale: עוֹף என்பதை இயல்பாக ‘பறவைகள்’ என்றும், הַשָּׁמַיִם என்பதை கவிதை நடைக்கு ஏற்ற ‘வானம்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: נִסְתָּרָה
  choice: அது மறைக்கப்பட்டுள்ளது
  rationale: סתר என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு/விளைவு நிலையைக் காக்கிறது. முதல் அரையடியின் சொல்லை அப்படியே மீண்டும் பயன்படுத்தாமல், எபிரெய இணைநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
