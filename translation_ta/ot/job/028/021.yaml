translation_notes:
  register: நவீனத் தரத் தமிழில், யோபின் கவிதைநடைக்கு ஏற்ற கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இரண்டு இணையான அரையடிகளும் அரைப்புள்ளி மற்றும் வரிப்பிரிப்பால் தெளிவாக்கப்பட்டுள்ளன; விளக்கவுரை அல்லது சமயப்பிரிவு சார்ந்த கருத்து சேர்க்கப்படவில்லை.
