source:
  edition: WLC
  text: בַּ֭/צּוּרוֹת יְאֹרִ֣ים בִּקֵּ֑עַ וְ/כָל יְ֝קָ֗ר רָאֲתָ֥ה עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: ta
  text: அவன் பாறைகளுக்குள் நீர்வழிகளை[a] வெட்டுகிறான்; அவனுடைய கண் விலைமதிப்புள்ள ஒவ்வொன்றையும்[b] காண்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘நீரோடைகளை’ அல்லது ‘கால்வாய்களை’; எபிரெயச் சொல் நீர்ப்பாதைகளைக் குறிக்கலாம். இங்குள்ள சுரங்கப் பணி உருவகத்தில், பாறைக்குள் வெட்டப்பட்ட நீர்வழிகள் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘மதிப்புமிக்க ஒவ்வொன்றையும்’ அல்லது ‘விலைமதிப்புள்ள ஒவ்வொரு தாதுவையும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: பாறைகளுக்குள்
  rationale: צוּר என்பது கடினமான பாறை அல்லது கற்பாறையைக் குறிக்கிறது. முன்னொட்டு ב இங்கு பாறைகளின் ஊடாக அல்லது அவற்றுக்குள் வெட்டும் இடச்சார்ந்த பொருளைத் தருகிறது; தமிழில் ‘பாறைகளுக்குள்’ என்பது சுரங்கச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: יְאֹרִים
  choice: நீர்வழிகளை
  rationale: יְאֹרִים என்பது ஆறுகள், கால்வாய்கள், நீரோடைகள் போன்ற நீர்வழிகளைக் குறிக்கக்கூடும். சுரங்கப் பணியின் சூழலில் பாறைக்குள் வெட்டப்பட்ட நீர்க்கால்கள் அல்லது வாய்க்கால்கள் எனப் புரிந்துகொள்ளலாம்; ‘நீர்வழிகள்’ மூலச்சொல்லின் நீர்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: בִּקֵּעַ
  choice: வெட்டுகிறான்
  rationale: בקע என்பதன் அடிப்படைப் பொருள் பிளத்தல் அல்லது உடைத்துத் திறத்தல். இங்கு பாறைக்குள் வழி உண்டாக்கும் செயலை இயல்பான தமிழில் ‘வெட்டுகிறான்’ என வழங்குவது பொருத்தமானது.
- source_word: יְקָר
  choice: விலைமதிப்புள்ள ஒவ்வொன்றையும்
  rationale: יְקָר என்பது அரிய, விலையுயர்ந்த அல்லது மதிப்புமிக்க ஒன்றைக் குறிக்கிறது. மூலத்தில் தாது அல்லது ரத்தினம் என்று வரையறுக்கப்படாததால், ‘விலைமதிப்புள்ள ஒவ்வொன்றையும்’ என்ற விரிவான மொழிபெயர்ப்பு தெளிவற்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: רָאֲתָה עֵינוֹ
  choice: அவனுடைய கண் ... காண்கிறது
  rationale: எபிரெயத்தில் நேரடியாக ‘அவனுடைய கண் கண்டது’ என்ற உருவகம் உள்ளது. இந்தக் கவிதை வருணனையில் நிகழ்காலத்தைப் பயன்படுத்தி, ‘அவன் காண்கிறான்’ என்று தட்டையாக்காமல் கண் என்னும் உயிரோட்டமான படிமம் பாதுகாக்கப்படுகிறது.
