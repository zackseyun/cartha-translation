translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் சுரங்கப் பணி உருவகமும் ‘அவனுடைய கண்’ என்ற நேரடி படிமமும் பாதுகாக்கப்பட்டுள்ளன; יְאֹרִים மற்றும் יְקָר ஆகிய சொற்களின் பொருள் விரிவு அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
