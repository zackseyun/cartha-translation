  yaml_path: translation/ot/job/028/025.yaml
  text: when he gave the wind its weight and measured the waters by measure[b][a],
translation:
  language: ta
  text: அவர் காற்றுக்கு எடையை நிர்ணயித்து,[a] நீரை அளவின்படி அளந்தபோது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காற்றுக்கு எடையை ஏற்படுத்தி’ அல்லது ‘காற்றுக்கு எடையை ஏற்படுத்தும்போது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் உள்ள infinitive அமைப்பு, இங்கு முந்தைய வசனத்தில் தொடரும் செயலின் காலப்பொருளில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: நிர்ணயித்து ... தீர்மானித்தபோது
  rationale: לְ முன்னொட்டுடன் வரும் infinitive construct, முந்தைய வசனத்தின் செயலைத் தொடர்ந்து காலப் பொருளை வெளிப்படுத்துகிறது. தமிழில் வாக்கிய ஓட்டத்திற்காக ‘போது’ இரண்டாம் கூறுடன் இணைக்கப்பட்டுள்ளது.
- source_word: לָרוּחַ
  choice: காற்றுக்கு
  rationale: רוּחַ என்பதற்கு காற்று, ஆவி, மூச்சு ஆகிய பொருள்கள் இருக்கலாம்; இங்கு ‘நீர்’ என்பதுடனான படைப்புலக இணைநிலை காரணமாக ‘காற்று’ பொருத்தமானது.
- source_word: מִשְׁקָל
  choice: எடையை
  rationale: מִשְׁקָל என்பது எடை அல்லது எடைபோடுதலைக் குறிக்கிறது. காற்றுக்குரிய ஒழுங்கை தேவன் நிர்ணயிப்பதை ‘எடையை நிர்ணயித்து’ இயல்பாகவும் உருவகத்தைப் பாதுகாக்கும் வகையிலும் தெரிவிக்கிறது.
- source_word: וּמַיִם
  choice: நீரின்
  rationale: מַיִם வடிவத்தில் பன்மையாக இருந்தாலும், தமிழில் இயற்கையான திரள்பொருள் சொல்லாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִּכֵּן
  choice: தீர்மானித்த
  rationale: תכן அளத்தல், எடைபோடுதல், துல்லியமாக நிர்ணயித்தல் ஆகிய பொருள்களை உடையது. அடுத்துள்ள ‘அளவு’ என்பதுடன் தேவையற்ற சொல் மறுமொழியைத் தவிர்த்து, துல்லிய ஒழுங்கை ‘தீர்மானித்த’ தெரிவிக்கிறது.
- source_word: בְּמִדָּה
  choice: அளவை
  rationale: בְּמִדָּה அளவிட்ட விகிதம் அல்லது அளவுக்கோலைக் குறிக்கிறது. தமிழில் ‘நீரின் அளவைத் தீர்மானித்தார்’ என்பது இயல்பாகவும் மூலக் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் எழுவாய்
  choice: மறைமுக எழுவாய் தேவன் என்பதால் ‘அவர்’ என வழங்கப்பட்டது.
  alternative: எழுவாயைக் குறிப்பிடாமல் infinitive அமைப்பை முறையாகப் பின்பற்றுதல்.
  rationale: சுற்றியுள்ள உரையில் செய்பவர் தேவன். தமிழில் தெளிவிற்காக ‘அவர்’ சேர்ப்பது சூழலிலுள்ள எழுவாயை வெளிப்படுத்துவதே அன்றி புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கவிதைக்குரிய கண்ணியமான நடை. வசனம் அடுத்த கூறுடன் தொடர்வதை உணர்த்த இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘காற்று’ என்ற இயற்கைச் சூழலுக்குரிய பொருள் முதன்மை உரையில் தெளிவாக இருப்பதால் அதற்கென தனி அடிக்குறிப்பு தேவையில்லை.
