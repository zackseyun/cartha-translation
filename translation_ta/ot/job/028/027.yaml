source:
  edition: WLC
  text: אָ֣ז רָ֭אָ/הּ וַֽ/יְסַפְּרָ֑/הּ הֱ֝כִינָ֗/הּ וְ/גַם חֲקָרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: ta
  text: அப்போது அவர் அதைக் கண்டார்; அதை அறிவித்தார்[a]; அதை நிலைநிறுத்தினார்; மேலும் அதை ஆராய்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «அதை எண்ணினார்», «அதை எடுத்துரைத்தார்», அல்லது «அதை விவரித்தார்». எபிரெய வினை எண்ணுதல், எடுத்துரைத்தல், அல்லது அறிவித்தல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கவிதை விவரிப்பில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான காலவினையடை.
- source_word: רָאָהּ
  choice: அவர் அதைக் கண்டு
  rationale: ראה என்பதன் நேரடியான ‘காணுதல்’ என்ற பொருளைப் பேணுகிறது; பெண்பால் பின்னொட்டு முன்சூழலிலுள்ள ஞானத்தைக் குறிக்கிறது.
- source_word: וַיְסַפְּרָהּ
  choice: அதை விவரித்தார்
  rationale: ספר என்பதற்கு எண்ணுதல், எடுத்துரைத்தல், விவரித்தல் ஆகிய பொருள்கள் உண்டு. இங்கு ‘விவரித்தார்’ என்பது அதன் அறிவித்தல்/எடுத்துரைத்தல் நுணுக்கத்தையும் மூலத்தின் பல்பொருள் வாய்ப்பையும் இயன்றவரை பேணுகிறது.
- source_word: הֱכִינָהּ
  choice: அதை நிலைநிறுத்தி
  rationale: Hiphil வடிவிலுள்ள כון, உறுதிப்படுத்துதல் அல்லது நிலைபெறச் செய்தல் என்ற பொருளைத் தருகிறது; தமிழில் ‘நிலைநிறுத்தி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְגַם
  choice: மேலும்
  rationale: செயல்களின் தொடரில் இறுதிக் கூறைச் சேர்க்கும் கூட்டுச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: חֲקָרָהּ
  choice: அதை ஆராய்ந்தறிந்தார்
  rationale: חקר குறிக்கும் ஆழமாக ஆராய்ந்து கண்டறிதல் என்ற நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பெண்பால் பின்னொட்டுகளின் சுட்டுப்பொருள்
  choice: அனைத்தும் உடனடிச் சூழலில் வரும் ‘ஞானம்’ என்பதையே குறிக்கின்றன; தமிழில் ‘அது’ என வழங்கப்பட்டது.
  alternative: ஞானத்தின் அளவு அல்லது அதன் ஒழுங்கை மறைமுகமாகக் குறிப்பதாக எடுத்துக்கொள்ளலாம்.
  rationale: முந்தைய சூழல் ஞானத்தை இறைவனின் காணுதல், விவரித்தல், நிலைநிறுத்துதல், ஆராய்தல் ஆகியவற்றின் பொருளாகக் காட்டுகிறது. ‘அது’ என்பது தேவையற்ற மேலதிக ஆளுருவாக்கத்தைச் சேர்க்காமல் சுட்டுப்பொருளைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கவிதைநடை. மூல எபிரெய வினைகளின் தொடர் அமைப்பும் ஞானத்தைச் சுட்டும் ஒரே பொருள் தொடர்ச்சியும் பேணப்பட்டுள்ளன.
