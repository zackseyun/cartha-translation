  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: ta
  text: தங்கமும் கண்ணாடியும்[a] அதற்கு ஈடாக முடியாது; தூய தங்கப் பொருளை அதற்கு மாற்றாகக் கொடுக்க முடியாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கண்ணாடி’ என்பதற்குப் பதிலாக ‘படிகம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெளிப்படையான விலையுயர்ந்த பொருளைக் குறிக்கலாம்; ‘கண்ணாடி’ என்பதே அதிகம் சாத்தியமான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூய தங்கப் பாத்திரத்தை அதற்கு மாற்றாகக் கொடுக்க முடியாது.’ எபிரெய மொழியில் ‘பொருள்’ என்று மொழிபெயர்க்கப்பட்ட சொல் இன்னும் குறிப்பாக ‘பாத்திரம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: அதற்கு ஈடாகா
  rationale: ערך இங்கு மதிப்பிட்டு ஒப்பிடுதல் அல்லது ஈடாக நிறுத்துதல் என்ற பொருளில் வருகிறது. பெண்பால் ஒருமை பின்னொட்டு சூழலில் உள்ள ஞானத்தைக் குறிக்கிறது; தமிழில் இயல்பாக ‘அதற்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: விலைமதிப்புள்ள உலோகத்திற்கான வழக்கமான, நேரடியான தமிழ் சொல்.
- source_word: זְכוֹכִית
  choice: கண்ணாடி
  rationale: பண்டைய உலகில் ஆடம்பரப் பொருளாக இருந்த வெளிப்படையான கண்ணாடியை இச்சொல் பெரும்பாலும் குறிக்கிறது. ‘படிகம்’ என்பது சாத்தியமான மாற்றுப் பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תְמוּרָתָהּ
  choice: அதற்கு மாற்றாகக் கொடுக்க
  rationale: תמורה என்பதிலுள்ள பரிமாற்றம் அல்லது பதிலீடு என்ற வணிக உருவகத்தை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּלִי פָז
  choice: புடமிட்ட தங்கப் பொருள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் பலவகை உருவாக்கப்பட்ட பொருள்களையும் குறிக்கலாம்; எனவே ‘பொருள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது. פָז என்பது உயர்தரமான, புடமிட்ட தங்கத்தைக் குறிக்கிறது.
