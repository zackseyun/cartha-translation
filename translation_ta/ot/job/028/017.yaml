translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநடையின் சுருக்கத்தையும் மதிப்பிட முடியாத ஞானம் பற்றிய வணிக உருவகத்தையும் தக்கவைக்கும் கண்ணியமான நடை. முதல் கூறில் உள்ள எதிர்மறை இரண்டாம் கூறிலும் தொடர்வதைத் தமிழில் வெளிப்படையாகச் சொல்லி இயல்பாக்கப்பட்டுள்ளது.
