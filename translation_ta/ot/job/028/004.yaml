  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: ta
  text: 'மக்கள் வாழும் இடத்திலிருந்து விலகி ஒருவன் சுரங்கக் குழியை வெட்டித் திறக்கிறான்[a];

    காலடிகளால் மறக்கப்பட்டவர்களாய்[b],

    மனிதர்களிடமிருந்து தொலைவில் அவர்கள் தொங்குகிறார்கள்[c]; ஊசலாடுகிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தற்காலிகமாகத் தங்குபவன் இருக்கும் இடத்திலிருந்து விலகி ஒரு கால்வாயை/நீரோடைப் பள்ளத்தை வெட்டித் திறக்கிறான்.” இங்குள்ள נַחַל (‘ஓடை, கால்வாய், நீரோடைப் பள்ளம்’) மற்றும் גָּר (‘அந்நியன், தற்காலிகமாகத் தங்குபவன்’) ஆகிய எபிரெயச் சொற்களால் இவ்வரி பொருள் காணக் கடினமானது. இவ்வதிகாரத்தின் சுரங்கத் தொழில் சூழலை முன்னிட்டு நַחַל இங்கு ‘சுரங்கக் குழி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்கு சொல், “காலிலிருந்து/காலால் மறக்கப்பட்டவர்கள்.” மேலே நடந்துசெல்வோரின் கவனத்திற்கும் எட்டாத தொலைவிலுள்ள இடத்தையோ தொழிலாளர்களையோ இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கீழிறக்கப்படுகிறார்கள்” அல்லது “தொங்கி ஆடுகிறார்கள்.” எபிரெய வினை தொங்கவிடப்படுவதையோ கீழே இறக்கப்படுவதையோ குறிக்கலாம்; சுரங்கத்தில் கயிற்றால் இறக்கப்படும் தொழிலாளர்களின் படிமம் இங்கு இருக்கலாம்.
    reason: lexical_alternative
