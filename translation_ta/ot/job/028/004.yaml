translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்கும் புரியும் வகையில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் முதலில் வரும் ஒருமைச் செய்பவரிலிருந்து பின்னர் வரும் பன்மைத் தொழிலாளர்களுக்கான திடீர் மாறுதல் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் கடினத்தன்மையை மறைக்காமல், முதன்மை உரை சுரங்கச் சூழலுக்கு ஏற்றவாறு அமைக்கப்பட்டு மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
