  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: ta
  text: அவன் இருளுக்கு ஒரு முடிவை வைக்கிறான்; ஒவ்வொரு எல்லைவரையும் தேடி ஆராய்கிறான்—காரிருளும் ஆழ்ந்த இருளும் நிறைந்த கற்களை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்படியாகவும் பாரம்பரியமாகவும்: “காரிருளும் மரண நிழலும் நிறைந்த கல்.”'
    reason: אֶבֶן என்பதின் ஒருமை வடிவத்தையும் צַלְמָוֶת என்பதின் பாரம்பரியப் பொருளையும் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: இருளுக்கு ஒரு முடிவை வைக்கிறான்
  rationale: קֵץ என்பது ‘முடிவு’ அல்லது ‘எல்லை’ எனப் பொருள்படும்; שָׂם உடன் சேர்ந்தபோது இருளுக்கு முடிவு வைப்பதை இயல்பாகவும் உருவகத்தின் வலிமையுடனும் தெரிவிக்கிறது.
- source_word: וּלְכָל תַּכְלִית הוּא חוֹקֵר
  choice: எல்லா எல்லைகளையும் ஆராய்ந்து
  rationale: תַּכְלִית இங்கு நிறைவுத்தன்மையை அல்ல, கடைசி எல்லை அல்லது தொலைவான முனையைச் சுட்டுகிறது; חקר முழுமையாகத் தேடி ஆராய்வதைக் குறிக்கிறது. தமிழ் தொடரமைப்புக்காக வினையெச்சமாக வழங்கப்பட்டுள்ளது.
- source_word: אֶבֶן
  choice: கற்கள்
  rationale: எபிரேயத்தில் ஒருமையாக இருந்தாலும் சுரங்கச் சூழலில் கூட்டுப்பொருள் கொள்ளக்கூடும்; தமிழில் ‘கற்கள்’ என்பது அந்தக் கருத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֹפֶל
  choice: காரிருள்
  rationale: אֹפֶל அடர்ந்த இருளைக் குறிக்கிறது; முன்னுள்ள חֹשֶׁךְ என்பதிலிருந்து வேறுபடுத்த ‘காரிருள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צַלְמָוֶת
  choice: ஆழ்ந்த இருள்
  rationale: யோபு நூலின் இச்சுரங்கச் சூழலில் நிலத்தடி ஆழிருளே முதன்மையாகத் தெரிகிறது; ‘மரண நிழல்’ என்ற பாரம்பரிய வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: צַלְמָוֶת என்பதன் மொழிபெயர்ப்பு
  choice: ஆழ்ந்த இருள்
  alternative: மரண நிழல்
  rationale: சுரங்கச் சூழல் மிக ஆழமான நிலத்தடி இருளைக் குறிக்கிறது. எனினும் மரணத்துடன் தொடர்புடைய பாரம்பரியப் புரிதலைத் தீர்மானமாக நீக்காமல் அடிக்குறிப்பில் வைத்திருக்கிறோம்.
- issue: אֶבֶן אֹפֶל וְצַלְמָוֶת என்பதன் தொடரியல்
  choice: காரிருளிலும் ஆழ்ந்த இருளிலும் உள்ள கற்கள்
  alternative: காரிருள் மற்றும் மரண நிழலின் கல்
  rationale: אֶבֶן என்பதைச் சுரங்கப் பின்னணியில் கூட்டுப்பொருளாகவும், தொடர்ந்து வரும் இருள் சொற்களை அந்தக் கற்களின் இருப்பிடச் சூழலாகவும் எடுத்துள்ளது. எபிரேயத்தின் சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. சுரங்கப் பின்னணியைத் தெளிவாக்க இயல்பான தமிழ் தொடரமைப்பு தேர்ந்தெடுக்கப்பட்டாலும், எபிரேயத்தின் உண்மையான சொற்பொருள் மற்றும் தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
