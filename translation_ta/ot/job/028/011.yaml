  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: ta
  text: ஆறுகளின் கசிவுகளை அவர் அடைக்கிறார்[a]; மறைந்திருப்பதை வெளிச்சத்திற்குக் கொண்டுவருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறுகளின் ஊற்றுகளை அவர் அடைக்கிறார்.” “கசிவுகள்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அது “அழுகை” அல்லது துளித்துளியாகக் கசியும் நீர் என்ற படிமத்தையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: கசிவுகளை
  rationale: இச்சொல் அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமாகும். சுரங்கப்பணியின் சூழலில் ஆற்று நீரின் ஊற்று, கசிவு, அல்லது துளித்தோடுதலைக் குறிக்கலாம். ‘கசிவுகளை’ என்பது நீரைக் கட்டுப்படுத்தும் செயலை இயல்பாக வெளிப்படுத்துகிறது; ‘அழுகை’ என்ற சொல்லுருவப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נְהָרוֹת
  choice: ஆறுகளின்
  rationale: இது ‘ஆறுகள்’ அல்லது ‘நீரோடைகள்’ எனப் பொருள்படும் வழக்கமான பன்மைச் சொல். இங்கு நிலத்தடி நீரோட்டங்களையும் உள்ளடக்கக்கூடிய பொதுவான சொல்லாக ‘ஆறுகள்’ பயன்படுத்தப்படுகிறது.
- source_word: חִבֵּשׁ
  choice: அடைக்கிறார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் கட்டுதல் அல்லது கட்டுப்படுத்துதல். சுரங்கத்தில் நீர்க்கசிவை நிறுத்தும் சூழலில் ‘அடைக்கிறார்’ என்பது செயற்பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: תַּעֲלֻמָהּ
  choice: மறைந்திருப்பதை
  rationale: மறைக்கப்பட்ட அல்லது கண்ணுக்குப் புலப்படாத ஒன்றைக் குறிக்கிறது. அதைத் தாது அல்லது புதையல் என்று குறிப்பாக வரையறுக்காமல் மூலத்தின் பரந்த பொருளை இத்தேர்வு காக்கிறது.
- source_word: יֹצִא
  choice: கொண்டுவருகிறார்
  rationale: יצא என்பதன் ஹிஃபீல் வடிவம் ‘வெளியே வரச் செய்தல்’ எனப் பொருள்படும். ‘கொண்டுவருகிறார்’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אוֹר
  choice: வெளிச்சத்திற்கு
  rationale: மறைந்திருந்த ஒன்று புலப்படுத்தப்படுவதைக் காட்டும் இயல்பான தமிழ் சொற்றொடராக ‘வெளிச்சத்திற்குக் கொண்டுவருகிறார்’ அமைகிறது.
