    text: எபிரெயில் ‘ஞானம்’ பெண்பால் இலக்கண வடிவத்தில் இருப்பதால், ‘அதன் வழி’ மற்றும் ‘அதன் இடம்’ என்பவற்றை ‘அவளுடைய வழி’ மற்றும் ‘அவளுடைய இடம்’ என்றும் மொழிபெயர்க்கலாம்.
