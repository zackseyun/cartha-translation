lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், ஒருமைச் செயப்பாடுகளுடன் இங்கு ஒரே கடவுளைக் குறிக்கிறது.
- source_word: הֵבִין
  choice: அறிந்திருப்பவர்
  rationale: בין என்பதன் ஹிஃபில் வடிவம் புரிந்துகொள்ளுதல் அல்லது பகுத்தறிந்து அறிதல் என்பதைக் குறிக்கிறது. வலியுறுத்தப்பட்ட הוּא உடன் இணைத்து, கடவுளுக்கே உரிய நிலையான அறிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דַּרְכָּהּ
  choice: அதன் வழியை
  rationale: பெண்பால் பின்னொட்டு சூழலில் ஞானத்தைக் குறிக்கிறது. தமிழில் உயிரற்ற கருத்துப்பெயரான ஞானத்தை இயல்பாகச் சுட்டுவதற்கு ‘அதன்’ பொருத்தமானது; ‘வழி’ என்ற உருவகமும் காக்கப்படுகிறது.
- source_word: וְהוּא
  choice: கடவுளே … அவர்
  rationale: தனி சுட்டுப்பெயர் தரும் வலியுறுத்தலை தமிழில் ‘கடவுளே’ என்பதன் மூலம் வெளிப்படுத்தி, அடுத்த கூறில் மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָדַע
  choice: அறிவார்
  rationale: இது அறிதலைக் குறிக்கிறது; கவிதையின் காலங்கடந்த பொதுவுண்மையைத் தமிழின் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת מְקוֹמָהּ
  choice: அதன் இருப்பிடத்தை
  rationale: מָקוֹם என்பது இடம் அல்லது இருப்பிடம். இங்கு ஞானம் எங்கு இருக்கிறது என்ற சூழல்சார்ந்த பொருளை ‘இருப்பிடம்’ தெளிவாகவும் மிகை விளக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: பெண்பால் பின்னொட்டுகள் குறிக்கும் ஞானத்தைத் தமிழில் எவ்வாறு சுட்டுவது
  choice: ‘அதன் வழி … அதன் இருப்பிடம்’ என்று உயிரற்ற கருத்துப்பெயருக்குரிய சுட்டுப்பெயரால் மொழிபெயர்த்தல்
  alternative: ‘அவளுடைய வழி … அவளுடைய இருப்பிடம்’ என்று ஞானத்தின் பெண்பால் உருவகப்படுத்தலை வெளிப்படையாக்குதல்
  rationale: எபிரெயில் பின்னொட்டுகள் பெண்பாலில் இருப்பது ‘ஞானம்’ என்ற சொல்லின் இலக்கணப் பாலுக்கும் கவிதை உருவகப்படுத்தலுக்கும் பொருந்துகிறது. ஆனால் நவீன தமிழில் ஞானத்தை ‘அவள்’ என்று குறிப்பிடுவது மூல இலக்கணம் மட்டும் கட்டாயப்படுத்தாத அளவுக்கு ஆளுமைப்படுத்தலை வலுப்படுத்தும். ‘அதன்’ என்பது இயல்பான தமிழையும் மூலப் பொருளையும் காக்கிறது.
- issue: וְהוּא தரும் வலியுறுத்தல்
  choice: ‘கடவுளே’ என்று வலியுறுத்துதல்
  alternative: ‘அவர்’ என்ற சுட்டுப்பெயரை மட்டும் பயன்படுத்துதல்
  rationale: மூலத்தில் உள்ள தனி ஆண்பால் சுட்டுப்பெயர் கடவுளை வலியுறுத்துகிறது. தமிழில் ‘கடவுளே’ என்பது அந்த வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் கடத்துகிறது; கடவுள் மட்டுமே ஞானத்தின் வழியையும் இடத்தையும் அறிவார் என்ற சூழல்சார் எதிர்மறையையும் பாதுகாக்கிறது.
