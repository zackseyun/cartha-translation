- source_word: בְּכֶתֶם אוֹפִיר
  choice: ஓப்பீரின் தூய தங்கத்தாலும்
  rationale: כֶּתֶם என்பது உயர்தரமான அல்லது சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கிறது; אוֹפִיר அதன் புகழ்பெற்ற பிறப்பிடத்தைக் குறிப்பிடுகிறது. கருவி அல்லது மதிப்பீட்டு அளவைக் காட்டும் בְּ என்பதை ‘-ஆலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֹׁהַם
  choice: ஓனிக்ஸ் கல்
  rationale: கல்லின் துல்லியமான அடையாளம் உறுதியற்றது. பரவலாக அறியப்படும் பாரம்பரிய அடையாளத்தை முதன்மை உரையில் வைத்து, மாற்று அடையாளத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: יָקָר
  choice: விலையுயர்ந்த
  rationale: கல்லின் அருமையையும் அதிக மதிப்பையும் தெளிவான நவீன தமிழில் காட்டுகிறது.
- source_word: סַפִּיר
  choice: நீலமணி
  rationale: பாரம்பரியமாக ‘sapphire’ எனப் புரிந்துகொள்ளப்படும் கல்லுக்கு இயல்பான தமிழ் பெயர்; பண்டைய கனிம வகைப்பாட்டில் அது லாபிஸ் லாசுலியாக இருந்திருக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
