id: JOB.28.26
reference: Job 28:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/עֲשֹׂת֣/וֹ לַ/מָּטָ֣ר חֹ֑ק וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: ta
  text: அவர் மழைக்கு ஒரு விதியையும், இடிமுழக்கங்களின் மின்னலுக்கு ஒரு பாதையையும் வகுத்தபோது,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: அவர் ... வகுத்தபோது
  rationale: בְּ + பெயரெச்ச வினையெச்ச அமைப்பு இங்கு காலப் பொருளில் வருகிறது. தமிழில் இயல்பாகவும், அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பைத் தக்கவைக்கவும் ‘வகுத்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַמָּטָר
  choice: மழைக்கு
  rationale: மָטָר என்பது மழையைக் குறிக்கிறது; לְ முன்னொட்டு மழைக்காக விதி நிர்ணயிக்கப்பட்டதைக் காட்டுகிறது.
- source_word: חֹק
  choice: ஒரு விதி
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட ஒழுங்கு, விதி அல்லது எல்லையைக் குறிக்கலாம். படைப்புலகச் சூழலில் ‘விதி’ என்பது சட்ட மொழியாக மிகக் கடுமையாக்காமல், கடவுள் ஏற்படுத்திய நிலையான ஒழுங்கைத் தெரிவிக்கிறது.
- source_word: וְדֶרֶךְ
  choice: ஒரு பாதை
  rationale: דֶּרֶךְ என்பதன் அடிப்படைப் பொருள் வழி அல்லது பாதை. வானில் இயற்கை நிகழ்வுக்கு வகுக்கப்பட்ட போக்கைச் சித்தரிக்கும் கவித்துவ உருவகத்தை ‘பாதை’ காக்கிறது.
- source_word: לַחֲזִיז קֹלוֹת
  choice: இடிமின்னலுக்கு
  rationale: חֲזִיז என்பது மின்னல் அல்லது இடிமின்னல்; קֹלוֹת என்பது ஒலிகள், இச்சூழலில் இடிமுழக்கங்கள். ‘இடிமின்னல்’ தமிழில் இந்தப் புயல் நிகழ்வை இயல்பாகச் சுருக்கிக் கூறுகிறது; எபிரெயச் சொற்றொடரின் அதிக நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இயற்கைக்கு கடவுள் ஏற்படுத்திய ஒழுங்கு
  choice: மழைக்கும் இடிமின்னலுக்கும் கடவுள் விதியும் பாதையும் வகுத்ததாக உரையை நேரடியாகக் காட்டுதல்
  alternative: இயற்கை முழுவதையும் கடவுள் தமது பராமரிப்பால் கட்டுப்படுத்துகிறார் என்று விரிவாக விளக்குதல்
  rationale: எபிரெயக் கவிதை படைப்புலகில் கடவுள் ஏற்படுத்திய ஒழுங்கைச் சித்தரிக்கிறது. அதிலுள்ள இறையியல் உட்கருத்தைக் காக்கிறோம்; ஆனால் மூலத்தில் இல்லாத முறைப்படுத்தப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. வசனம் அடுத்த கருத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டது. ‘இடிமின்னல்’ வாசிப்பிற்கு இயல்பானது; மூலத்தின் ‘ஒலிகள்/இடிமுழக்கங்கள்’ என்ற பன்மை அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
