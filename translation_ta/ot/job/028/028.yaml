source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: ta
  text: 'அவர் மனிதனிடம்[a] சொன்னார்: “இதோ, ஆண்டவருக்குப் பயப்படுவதே ஞானம்; தீமையை விட்டு விலகுவதே விவேகம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுலத்திடம்.” எபிரெயத்தில் ‘மனிதன்’ என்பது ஒருமையில் இருந்தாலும், இங்கு மனிதகுலம் முழுவதையும் பிரதிநிதித்துவப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: தொடர்ச்சியை உணர்த்தும் வַ முன்னொட்டுடன் வரும் אמר வினைச்சொல்லை இயல்பான தமிழ் உரைநடையில் வழங்குகிறது; காலவரிசையைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: לָאָדָם
  choice: மனிதனிடம்
  rationale: אָדָם இலக்கணத்தில் ஒருமையாக இருந்தாலும், இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் பொதுப்பொருளில் வருகிறது. ‘மனிதனிடம்’ என்ற ஒருமை மூலவடிவத்தைப் பேணுகிறது; அதன் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றுக்கு ஆழ்ந்த வலியுறுத்தலை அளிக்கும் எபிரெய இடைச்சொல்லின் குறியிடப்பட்ட தன்மையைப் பேணுகிறது.
- source_word: יִרְאַת אֲדֹנָי
  choice: ஆண்டவருக்குப் பயப்படுவது
  rationale: יִרְאָה என்பதிலுள்ள அச்சம், பயபக்தி, வியப்பு ஆகிய முழு பொருள் பரப்பையும் ‘பயம்’ தக்கவைக்கிறது; அதை வெறும் ‘மரியாதை’ என்று மென்மையாக்கவில்லை.
- source_word: הִיא חָכְמָה
  choice: அதுவே ஞானம்
  rationale: הִיא தரும் அடையாளப்படுத்தும் வலியுறுத்தலைத் தமிழில் ‘-வே’ மூலம் வெளிப்படுத்துகிறது.
- source_word: וְסוּר מֵרָע
  choice: தீமையை விட்டு விலகுவது
  rationale: சூழலில் רָע ஒழுக்கத் தீமையைக் குறிக்கிறது; סוּר அதிலிருந்து வேண்டுமென்றே விலகும் செயலைக் குறிக்கிறது.
- source_word: בִּינָה
  choice: விவேகம்
  rationale: ஞான இலக்கியச் சூழலில் புரிந்து பகுத்தறியும் திறனை இயல்பான, சுருக்கமான தமிழில் குறிக்கிறது; ‘ஞானம்’ என்பதோடும் தெளிவாக வேறுபடுகிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் אָדָם என்பதன் மொழிபெயர்ப்பு
  choice: மனிதனிடம்
  alternative: மனிதகுலத்திடம்
  rationale: எபிரெயச் சொல் ஒருமை வடிவில் மனிதகுலம் முழுவதையும் பிரதிநிதித்துவப்படுத்துகிறது. முதன்மை உரை அந்த ஒருமையைப் பேணுகிறது; உள்ளடக்கும் கூட்டுப்பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: יִרְאַת אֲדֹנָי என்பதில் ‘பயம்’
  choice: ஆண்டவருக்குப் பயப்படுவது
  alternative: ஆண்டவரிடம் பயபக்தி கொள்வது
  rationale: மூலச்சொல்லிலுள்ள உண்மையான அச்சம் மற்றும் பயபக்தி சார்ந்த இறுக்கத்தைத் தக்கவைக்க ‘பயம்’ நேரடியாக வைக்கப்பட்டது; அதை மரியாதை என்ற ஒரே கருத்தாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான ஞான இலக்கிய நடையைப் பயன்படுத்துகிறது. இணையான இரு வாக்கியப் பகுதிகளிலும் ‘-வே’ அமைப்பு எபிரெய அடையாளப்படுத்தும் வலியுறுத்தலையும் கவிதை இணைப்பையும் வெளிப்படுத்துகிறது.
