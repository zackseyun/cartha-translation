  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: ta
  text: 'ஆனால் ஞானம் எங்கிருந்து கிடைக்கும்?[a]


    புரிதலின் இடம் எங்கே?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சொல்லாக: ‘ஞானம் எங்கிருந்து கண்டுபிடிக்கப்படும்?’'
    reason: מֵאַיִן என்பது ‘எங்கிருந்து’ என்றும், תִּמָּצֵא என்பது செயலேற்கும் வடிவில் ‘கண்டுபிடிக்கப்படும்’ என்றும் பொருள்படும். முதன்மை உரையின் ‘கிடைக்கும்’ என்பது இந்தக் கவிதைநய வினாவின் இயல்பான தமிழ் வடிவமாகும்.
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: ஆனால் ஞானம்
  rationale: முன்னுள்ள சுரங்கத் தேடல் விவரிப்பிலிருந்து ஞானத்தைப் பற்றிய கேள்விக்குத் திருப்பம் ஏற்படுவதால் וְ என்பதை இயல்பான தமிழில் ‘ஆனால்’ என வழங்குகிறது; חָכְמָה என்பது ‘ஞானம்’.
- source_word: מֵאַיִן
  choice: எங்கிருந்து
  rationale: இந்தச் சொல் வெறும் இருப்பிடத்தை மட்டுமல்லாமல் தோற்றம் அல்லது கிடைக்கும் மூலத்தையும் கேட்கும் ‘எங்கிருந்து’ என்ற பொருளுடையது; மூலமொழியின் நுட்பம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: תִּמָּצֵא
  choice: கிடைக்கும்
  rationale: מצא என்பதன் நிபால் முற்றுப்பெறாத வடிவம் ‘கண்டுபிடிக்கப்படுதல்/கிடைத்தல்’ எனப் பொருள்படும். கவிதைநயமுள்ள வினாவில் ‘கிடைக்கும்?’ என்பது சாத்தியத்தையும் தேடலையும் இயல்பாக உணர்த்துகிறது.
- source_word: וְאֵי זֶה מְקוֹם
  choice: இருக்கும் இடம் எங்கே
  rationale: אֵי זֶה מְקוֹם என்ற எபிரெய மொழிநடை ‘இடம் எங்கே?’ என்று கேட்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக ‘இருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בִּינָה
  choice: புரிந்துகொள்ளும் திறன்
  rationale: בִּינָה என்பது புரிதல், பகுத்தறிதல், நுண்ணறிவு ஆகிய பொருள் வரம்பைக் கொண்டது. ‘புரிந்துகொள்ளும் திறன்’ என்பது ஞானத்துடனான இணைநிலையைப் பாதுகாத்து, சாதாரண வாசகருக்கு இயல்பாக உள்ளது.
