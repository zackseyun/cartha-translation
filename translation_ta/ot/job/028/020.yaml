  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: ta
  text: ஆனால், ஞானம் எங்கிருந்து வருகிறது? புத்தியின் இடம் எங்கே?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “ஞானம் எங்கிருந்து வரும்? புத்தியின் இடம் எங்கே?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: ஆனால் ஞானம்
  rationale: חָכְמָה என்பதற்கு இயல்பான தமிழ் இணைச்சொல் ‘ஞானம்’. முன்னொட்டான וְ இங்கு கவிதையின் மையக் கேள்வியை முரண்பாட்டுடன் மீண்டும் முன்வைப்பதால், ‘ஆனால்’ என்பது சூழலின் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאַיִן
  choice: எங்கிருந்து
  rationale: מִן முன்னொட்டுடன் வரும் வினாச்சொல் மூலத்தையோ தோற்றத்தையோ கேட்கிறது. ‘எங்கிருந்து’ என்பது வெறும் ‘எங்கே’ என்பதைவிட அந்த மூலப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: תָּבוֹא
  choice: வருகிறது
  rationale: בוא என்பதன் Qal imperfect மூன்றாம் நபர் பெண்பால் ஒருமை வடிவம் இச்சூழலில் பொதுவான, சொல்லாட்சிக் கேள்வியை வெளிப்படுத்துகிறது. ஆகவே நவீன தமிழில் நிகழ்காலமான ‘வருகிறது’ இயல்பானது; எதிர்காலத்தை மட்டும் குறிக்கும் ‘வரும்’ எனக் குறுக்கவில்லை.
- source_word: וְאֵי זֶה
  choice: எங்கே
  rationale: אֵי זֶה என்பது இடத்தைப் பற்றிய வினா. அடுத்துவரும் ‘இருப்பிடம்’ என்பதுடன் ‘எங்கே?’ என மொழிபெயர்ப்பது தெளிவான நவீன தமிழை வழங்குகிறது; இரண்டாவது וְ தமிழின் இயல்பான இணைப்பில் வெளிப்படையாகத் தேவைப்படவில்லை.
- source_word: מְקוֹם
  choice: இருப்பிடம்
  rationale: מְקוֹם என்பது ‘இடம்’ அல்லது ‘இருப்பிடம்’. ஞானக் கவிதையில் புரிந்துகொள்ளும் திறன் எங்கு காணப்படும் என்ற உருவகத்தைத் தெளிவாகக் காக்க ‘இருப்பிடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִּינָה
  choice: புரிந்துகொள்ளும் திறன்
  rationale: בִּינָה என்பது புரிதல், பகுத்துணர்வு, விவேகம் ஆகிய பொருள்களை உடையது. ‘புரிந்துகொள்ளும் திறன்’ என்பது ‘ஞானம்’ என்பதிலிருந்து அதன் நுண்ணிய வேறுபாட்டைக் காத்து, சாதாரண நவீன வாசகருக்கும் தெளிவாக உள்ளது.
