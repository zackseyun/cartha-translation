lexical_decisions:
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: எபிரெயச் சொல்லின் வழக்கமான, நேரடியான பொருள் இரும்பு.
- source_word: מֵעָפָר
  choice: மண்ணிலிருந்து
  rationale: עָפָר என்பது தூசி, புழுதி, தளர்ந்த மண் ஆகியவற்றைக் குறிக்கலாம். கனிமத்தை நிலத்திலிருந்து எடுக்கும் சூழலில், நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘மண்ணிலிருந்து’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יֻקָּח
  choice: எடுக்கப்படுகிறது
  rationale: לקח என்பதன் செயப்பாட்டு வடிவை நேரடியாகப் பிரதிபலிக்கிறது; ‘தோண்டியெடுக்கப்படுகிறது’ என்று மூலத்தில் இல்லாத செய்முறை விவரத்தைச் சேர்க்கவில்லை.
- source_word: וְאֶבֶן
  choice: கல்லிலிருந்து
  rationale: אֶבֶן என்பதன் அடிப்படைப் பொருள் ‘கல்’. இரண்டாம் அரையடியின் உலோகப் பிரித்தெடுப்பு உறவைத் தமிழில் தெளிவாக்க ‘இலிருந்து’ சேர்க்கப்பட்டது.
- source_word: יָצוּק
  choice: உருக்கிப் பிரித்தெடுக்கப்படுகிறது
  rationale: יצק என்பதற்கு ஊற்றுதல், வார்த்தல், உருக்குதல் போன்ற பொருள்கள் உண்டு. தாதுக்கல்லிலிருந்து உலோகம் பெறப்படும் இச்சுரங்கச் சூழலில், வெறும் ‘உருக்கப்படுகிறது’ என்பதைவிட உத்தேசிக்கப்பட்ட செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: נְחוּשָׁה
  choice: செம்பு
  rationale: இந்த எபிரெயச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம். கல்லிலுள்ள தாதுவிலிருந்து உலோகம் பெறுவது பற்றிய சூழலில், கலப்பு உலோகமான வெண்கலத்தைவிட ‘செம்பு’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
