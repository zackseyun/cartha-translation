  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: ta
  text: இரும்பு மண்ணிலிருந்து எடுக்கப்படுகிறது; கல்லிலிருந்து செம்பு[a] உருக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெண்கலம்.’ எபிரெயச் சொல் செம்பையையோ வெண்கலத்தையையோ குறிக்கலாம். இங்கு தாதுக்கல்லிலிருந்து உலோகம் பெறப்படுவது பற்றிய சூழல் இருப்பதால் ‘செம்பு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
