  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: ta
  text: அதற்கு ஈடாகப் புடமிட்ட தங்கத்தைக் கொடுக்க முடியாது[a][c]; அதன் விலையாக வெள்ளியை எடைபோடவும் முடியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புடமிட்ட தங்கம்’ என்பதற்கு ‘தூய தங்கம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அதன் விலையைச் செலுத்துவதற்காக வெள்ளியை எடைபோட்டுக் கொடுக்க முடியாது. பழங்காலத்தில் வெள்ளி எடையின்படி பணமாக வழங்கப்பட்டது; சுற்றியுள்ள வசனங்கள் ஞானத்தின் அளவிட முடியாத மதிப்பைப் பேசுகின்றன.
    reason: cultural_note
  - marker: c
    text: ‘அதைப் புடமிட்ட தங்கத்திற்கு ஈடாகக் கொடுக்க முடியாது’ என்பது முந்தைய மொழிபெயர்ப்பு; ஆனால் எபிரெய இலக்கணத்தில் புடமிட்ட தங்கமே கொடுக்கப்படும் பொருளாக உள்ளது.
    reason: previous_rendering
lexical_decisions:
- source_word: יֻתַּן
  choice: கொடுக்க முடியாது
  rationale: נתן என்பதன் செயலப்பாட்டு வடிவம் இங்கு பரிமாற்றமாகக் கொடுக்கப்படுவதைக் குறிக்கிறது; לֹא உடன் வரும் மதிப்பீட்டுச் சூழலில் இயலாமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סְגוֹר
  choice: புடமிட்ட தங்கம்
  rationale: இச்சொல் பொதுவான தங்கத்தைவிடச் சுத்திகரிக்கப்பட்ட, உயர்தரத் தங்கத்தைக் குறிக்கிறது; ‘புடமிட்ட தங்கம்’ அந்தப் பொருளையும் கவிதைநயத்தையும் காக்கிறது.
- source_word: תַּחְתֶּיהָ
  choice: அதற்கு ஈடாக
  rationale: תחת இங்கு இடத்தைக் குறிக்காமல் பதிலீடு அல்லது பரிமாற்றத்தைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு முந்தைய சூழலில் உள்ள ஞானத்தைச் சுட்டுகிறது.
- source_word: יִשָּׁקֵל
  choice: எடைபோடவும் முடியாது
  rationale: שקל என்பதன் செயலப்பாட்டு வடிவம் வெள்ளியைப் பணமாக எடைபோட்டுக் கொடுக்கும் பழக்கத்தைச் சுட்டுகிறது; முதல் அரையடியுடன் இணையான இயலாமையையும் இத்தேர்வு காக்கிறது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு வெள்ளி பணமாகப் பயன்பட்டாலும், மூலத்தின் உறுதியான பழங்காலப் பொருளாதாரப் படிமத்தை ‘வெள்ளி’ காக்கிறது.
- source_word: מְחִירָהּ
  choice: அதன் விலையாக
  rationale: מְחִיר என்பது வாங்கும் விலை அல்லது பரிமாற்ற மதிப்பு; பெண்பால் பின்னொட்டு ஞானத்தைச் சுட்டுவதால் ‘அதன் விலையாக’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: முதல் அரையடியின் இலக்கண எழுவாய்
  choice: புடமிட்ட தங்கமே கொடுக்கப்பட முடியாத பொருள் என மொழிபெயர்க்கப்பட்டது.
  alternative: ஞானத்தைப் புடமிட்ட தங்கத்திற்கு ஈடாகக் கொடுக்க முடியாது.
  rationale: எபிரெய உரையில் סְגוֹר என்பது செயலப்பாட்டு வினையான יֻתַּן என்பதன் எழுவாயாக உள்ளது; תַּחְתֶּיהָ என்பது ‘அதற்கு ஈடாக’ என்ற முன்னிடைத் தொடராகும். மாற்று வாசிப்பு பொருள் அளவில் சாத்தியமானதாகத் தோன்றினாலும் இலக்கண அமைப்பைத் தலைகீழாக்குகிறது; அது அடிக்குறிப்பில் மட்டும் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘புடமிட்ட தங்கம்’ கவிதைநயமுள்ளதாய் இருந்தாலும் பொதுவாகப் புரிந்துகொள்ளக்கூடியது. ‘எடைபோடுதல்’ பழங்காலத்தில் வெள்ளியை எடையிட்டு வழங்கிய முறையை நேரடியாகக் காக்கிறது; அதன் பணப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
