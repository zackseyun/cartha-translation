  register: நவீன செந்தமிழ் கலந்த பொதுநடை; கவிதைச் சுருக்கமும் மேற்பரப்பு–அடிப்பகுதி முரணும் காக்கப்பட்டுள்ளன. ‘அப்பம்’ என்ற concrete உருவகம் பொதுவான ‘உணவு’ என விரிவாக்கப்படவில்லை.
