  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: ta
  text: 'பூமியிலிருந்து அப்பம் கிடைக்கிறது;

    ஆனால், அதற்குக் கீழே உள்ள பகுதி நெருப்பால் புரட்டப்பட்டதுபோல் இருக்கிறது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்குக் கீழே உள்ள பகுதி நெருப்பைப் போல் புரட்டப்படுகிறது.” எபிரெய ஒப்பீடு, அது புரட்டப்படும் முறையை (“நெருப்பால் புரட்டப்பட்டதுபோல்”) குறிக்கலாம்; அல்லது வெறுமனே நெருப்புடனான ஒற்றுமையை (“நெருப்பைப் போல்”) குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: பூமி
  rationale: உணவு விளையும் மேற்பரப்பையும் சுரங்கத் தோண்டுதலால் மாற்றப்படும் கீழ்ப்பகுதியையும் வசனம் எதிரெதிராகக் காட்டுவதால், குறிப்பிட்ட ஒரு நாட்டைக் குறிக்கும் ‘நிலம்’ என்பதைவிட விரிவான ‘பூமி’ பொருத்தமானது.
- source_word: מִמֶּנָּה
  choice: அதிலிருந்து
  rationale: பெண்பால் ஒருமை பின்னொட்டு ‘பூமி’யைச் சுட்டுகிறது; உயிரற்ற பொருளுக்கான இயல்பான தமிழ் வடிவம் ‘அதிலிருந்து’.
- source_word: יֵצֵא
  choice: விளைகிறது
  rationale: எபிரெய வினை அடிப்படையில் ‘வெளியே வருகிறது’ எனினும், பூமியிலிருந்து அப்பம் வருவது பயிர் விளைச்சலைக் குறிக்கும் இயல்பான உருவகம் என்பதால் ‘விளைகிறது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לָחֶם
  choice: அப்பம்
  rationale: ‘உணவு’ என்று பொதுமைப்படுத்தாமல், எபிரெயத்தின் குறிப்பான சொல்லையும் அதன் வழக்கமான வேளாண் உருவகத்தையும் காக்கிறது.
- source_word: וְתַחְתֶּיהָ
  choice: ஆனால் அதன் அடிப்பகுதி
  rationale: இணைப்புச்சொல் மேற்பரப்பின் விளைச்சலுக்கும் கீழ்ப்பகுதியின் புரட்டப்படுதலுக்கும் இடையிலான முரணைக் காட்டுவதால் ‘ஆனால்’ பயன்படுத்தப்பட்டது; ‘அடிப்பகுதி’ இயல்பான தமிழில் கீழுள்ள பகுதியைக் குறிக்கிறது.
- source_word: נֶהְפַּךְ
  choice: புரட்டப்பட்டதுபோல் இருக்கிறது
  rationale: நிபால் வடிவம் திருப்பப்படுதல் அல்லது புரட்டப்படுதல் என்ற பொருளைத் தருகிறது. சுரங்கத் தோண்டுதலால் கீழ்ப்பகுதி தலைகீழாக்கப்படும் படிமத்தை ‘புரட்டப்பட்ட’ காக்கிறது.
- source_word: כְּמוֹ אֵשׁ
  choice: நெருப்பால் ... போல்
  rationale: ஒப்பீடு நெருப்பின் விளைவால் நிகழ்ந்ததுபோன்ற முறையைக் குறிக்கலாம். தமிழில் இயல்பாக இருக்க ‘நெருப்பால் புரட்டப்பட்டதுபோல்’ என அமைக்கப்பட்டது; நேரடியான ‘நெருப்பைப் போல்’ என்ற வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
