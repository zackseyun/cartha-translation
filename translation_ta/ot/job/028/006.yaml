  yaml_path: translation/ot/job/028/006.yaml
  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: ta
  text: 'அதன் கற்கள் நீலமணியின்[a] இருப்பிடமாக உள்ளன;

    அதற்கு பொன் புழுதி உண்டு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘லாபிஸ் லாசுலி’ எனப்படும் ஆழ்நீல மணிக்கல். இங்கு வரும் எபிரெயச் சொல் துல்லியமாக எந்தப் பழங்கால மணிக்கல்லைக் குறிக்கிறது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: இருப்பிடம்
  rationale: ‘இடம்/இருப்பிடம்’ என்ற அடிப்படைப் பொருளையும், சுரங்கச் சூழலில் அந்த மணிக்கல் கிடைக்கும் இடம் என்ற கவித்துவப் படிமத்தையும் காக்கிறது.
- source_word: סַפִּיר
  choice: நீலமணி
  rationale: பாரம்பரியமாக ‘sapphire’ என மொழிபெயர்க்கப்படும் பழங்கால மணிக்கல்லுக்கு எளிதில் புரியும் தமிழ் சொல்; துல்லியமான கனிம அடையாளம் உறுதியற்றதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲבָנֶיהָ
  choice: அதன் கற்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முந்தைய நிலம்/பூமியைக் குறிக்கிறது; தமிழில் இயல்பாக ‘அதன்’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: וְעַפְרֹת
  choice: அதன் புழுதியில்
  rationale: ‘புழுதி/துகள்மண்’ என்ற படிமத்தைப் பேணுகிறது. உடைமைக்கான לוֹ என்பதோடு இயல்பான தமிழில் சேர்ந்து, பொன் அந்தப் புழுதியில் இருப்பதைத் தெரிவிக்கிறது.
- source_word: זָהָב
  choice: பொன்
  rationale: விலைமதிப்புள்ள உலோகத்தைக் குறிக்கும் இயல்பான, கவித்துவமான தமிழ் சொல்.
- source_word: לוֹ
  choice: உண்டு
  rationale: எபிரெய மொழியின் ‘அதற்கு உண்டு’ என்ற உடைமை/உள்ளடக்க அமைப்பை, தமிழில் இயல்பான இருப்புச் சொல்லால் வெளிப்படுத்துகிறது.
theological_decisions: []
