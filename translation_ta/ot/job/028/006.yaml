  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரியின் இணை அமைப்பும் சுரங்கப் படிமமும் காக்கப்பட்டுள்ளன; கனிமத்தின் உறுதியற்ற அடையாளம் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
