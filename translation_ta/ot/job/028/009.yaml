- source_word: הָפַךְ
  choice: புரட்டிப்போடுகிறான்
  rationale: הפך என்பது திருப்புதல், புரட்டுதல், தலைகீழாக்குதல் ஆகிய பொருள்களை உடையது. மலைகளையே அடியிலிருந்து புரட்டும் தீவிரமான சுரங்கச் செயலை இத்தேர்வு தெளிவாகக் காட்டுகிறது.
- source_word: מִשֹּׁרֶשׁ
  choice: அவற்றின் வேரிலிருந்து
  rationale: எபிரெயத்தில் ‘வேர்’ ஒருமையில் இருந்தாலும், பன்மையான ‘மலைகள்’ என்பதுடன் தொகுப்புப் பொருளில் வருகிறது. தமிழில் ஒவ்வொரு மலையின் அடிவேரையும் குறிக்க ‘அவற்றின் வேரிலிருந்து’ இயல்பாக உள்ளது.
- source_word: הָרִים
  choice: மலைகளை
  rationale: הָרִים என்பதன் நேரான பொருள் ‘மலைகள்.’ கவிதைநடையின் பொதுப்பொருளை இயல்பாகக் காக்கத் தமிழில் தனியாகச் சுட்டுச்சொல் சேர்க்கப்படவில்லை.
