lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: கடினப் பாறையின்மேல்
  rationale: חַלָּמִישׁ என்பது தீக்கல் அல்லது மிகக் கடினமான பாறையைக் குறிக்கலாம். சுரங்கத் தொழில் சூழலில், ב முன்னிடைச்சொல்லின் நெகிழ்வையும் பாறையின்மீது செய்யப்படும் வேலையையும் இயல்பான தமிழில் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: שָׁלַח יָדוֹ
