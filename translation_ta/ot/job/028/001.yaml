  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: ta
  text: உண்மையாகவே, வெள்ளிக்குச் சுரங்கம் ஒன்று உண்டு[a]; பொன்னைப் புடமிடும் இடமும் உண்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளிக்குத் தோன்றுமிடம் ஒன்று உண்டு.” מוֹצָא என்ற எபிரெயச் சொல் ‘மூலம்,’ ‘தோன்றுமிடம்,’ அல்லது ‘பிறப்பிடம்’ எனப் பொருள்படலாம்; இங்குள்ள கனிமத் தோண்டுதல் சூழலால் ‘சுரங்கம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பொன்னை உருக்கித் தூய்மையாக்கும் இடமும் உண்டு.” இங்குள்ள வினை உலோகத்தைப் புடமிடுவதையோ உருக்கித் தூய்மையாக்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: உண்மையாகவே
  rationale: இச்செய்யுளின் தொடக்கத்தில் காரணத்தைக் காட்டுவதைவிட வலியுறுத்தும் இடைச்சொல்லாக வருகிறது; ‘உண்மையாகவே’ அதன் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵשׁ
  choice: உண்டு
  rationale: இருப்பைச் சுட்டும் எபிரெயச் சொல்; தமிழில் இயல்பான இணை ‘உண்டு’.
- source_word: לַכֶּסֶף מוֹצָא
  choice: வெள்ளிக்குச் சுரங்கம் ஒன்று
  rationale: מוֹצָא என்பதன் அடிப்படைப் பொருள் தோன்றுமிடம் அல்லது பிறப்பிடம். யோபு 28-இன் கனிமத் தோண்டுதல் சூழலில் ‘சுரங்கம்’ தெளிவான பொருத்தமான சொல்லாகும்; விரிந்த சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמָקוֹם לַזָּהָב
  choice: பொன்னைப் … இடமும்
  rationale: מָקוֹם என்பது பொதுவாக ‘இடம்’; לַזָּהָב பொன்னுடன் அந்த இடத்திற்குள்ள தொடர்பைக் காட்டுகிறது. தமிழின் இயல்பான வாக்கிய அமைப்பிற்காக வினைத்தொடருடன் இணைக்கப்பட்டுள்ளது.
- source_word: יָזֹקּוּ
  choice: புடமிடும்
  rationale: זקק உலோகத்தை உருக்கி அல்லது வேறு முறையில் தூய்மைப்படுத்துவதைக் குறிக்கலாம். ‘புடமிடும்’ என்பது பொன்னைத் தூய்மையாக்கும் செயலைச் சுருக்கமாகவும் சூழலுக்கேற்றவாறும் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
