  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: ta
  text: 'செருக்குமிக்க விலங்குகள்[a] அதில் கால்பதித்ததில்லை;

    சிங்கம் அதைக் கடந்துசென்றதில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘செருக்கின் மகன்கள்.’ இத்தொடர் செருக்குமிக்க காட்டு விலங்குகளை, குறிப்பாக வேட்டை விலங்குகளைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: அதில் கால்பதித்ததில்லை
  rationale: דרך என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ஒரு பாதையில் நடந்து செல்லுதல் அல்லது அதை மிதித்துக் கடத்தல் என்ற பொருளைத் தருகிறது. மறைந்திருக்கும் பாதையை எந்த விலங்கும் பயன்படுத்தவில்லை என்பதைக் ‘கால்பதித்ததில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי שָׁחַץ
  choice: செருக்குமிக்க விலங்குகள்
  rationale: சொல்லர்த்தமாக ‘செருக்கின் மகன்கள்’ எனும் கவிதைத் தொடர், இணைவரியில் வரும் சிங்கத்தைக் கருத்தில் கொண்டால், செருக்கான அல்லது கம்பீரமான காட்டு விலங்குகளை—குறிப்பாக வேட்டை விலங்குகளை—குறிப்பதாகத் தெரிகிறது. இனத்தைக் தேவையின்றிக் குறுக்காமல் ‘விலங்குகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עָדָה עָלָיו
  choice: அதைக் கடந்துசென்றதில்லை
  rationale: על உடன் வரும் עדה இங்கு மேலாக அல்லது குறுக்காகச் சென்றதைக் குறிக்கிறது. ‘கடந்துசென்றதில்லை’ முதல் அடியின் இயக்கப் படிமத்துடன் இயல்பாக இணைகிறது.
- source_word: שָׁחַל
  choice: சிங்கம்
  rationale: שׁחל என்பது வலிமை அல்லது மூர்க்கத்தன்மையின் நிழற்பொருள் கொண்ட கவிதை வழக்கிலான சிங்கத்தைக் குறிக்கும் சொல். தமிழில் தெளிவாகவும் மிகைவிளக்கம் இன்றியும் ‘சிங்கம்’ என வழங்கப்பட்டது.
