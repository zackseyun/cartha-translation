  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: ta
  text: மனிதன் அதன் மதிப்பை[a] அறிவதில்லை[b]; உயிரோடிருப்போரின் நாட்டில் அது காணப்படுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் பெறுமதியை’ அல்லது ‘அதன் விலையை.’ எபிரெயச் சொல் மதிப்பீடு அல்லது மதிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதன்’ என்பது மரணத்திற்குட்பட்ட மனிதரைக் குறிக்கக்கூடிய ஒருமை எபிரெயச் சொல்லை பிரதிநிதித்துவமாக மொழிபெயர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: சாகும் மனிதன்
  rationale: இந்த ஒருமை எபிரெயச் சொல் மனிதனை அவனது நிலையாமை மற்றும் மரணத்திற்குட்பட்ட தன்மையோடு பிரதிநிதித்துவமாகக் குறிக்கிறது. ‘சாகும் மனிதன்’ அந்த நுண்பொருளையும் ஒருமை அமைப்பையும் காக்கிறது.
- source_word: יָדַע
  choice: அறியான்
  rationale: இங்குள்ள வினை வடிவம் சூழலில் பொதுவான உண்மையைச் சொல்கிறது. ‘அறியான்’ இயலாமையைச் சேர்க்காமல் ‘அறிவதில்லை’ என்ற பொருளைச் சுருக்கமான கவிதை நடையில் தருகிறது.
- source_word: עֶרְכָּהּ
  choice: அதன் மதிப்பு
  rationale: ערך வேரிலிருந்து வந்த பெயர்ச்சொல் மதிப்பீடு, மதிப்பு அல்லது விலை என்பவற்றைக் குறிக்கலாம். ‘மதிப்பு’ வணிகப் பொருளை அளவுக்கு மீறி வலியுறுத்தாமல் பரந்த கருத்தைக் காக்கிறது.
- source_word: תִּמָּצֵא
  choice: அது காணப்படுவதில்லை
  rationale: நிபால் வினை வடிவத்தின் செயல்பாட்டுப்பாட்டு பொருளை இது இயல்பாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘காண முடியாது’ என்ற இயலாமைப் பொருளைச் சேர்க்கவில்லை.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: உயிருள்ளோரின் நாட்டில்
  rationale: பூமியில் உயிரோடு வாழும் மனிதர்களின் உலகைக் குறிக்கும் எபிரெயக் கவிதை மரபுத்தொடரை தமிழிலும் அதன் உருவகத்துடன் காக்கிறது.
