  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: ta
  text: ஏனெனில், அவர் பூமியின் எல்லைகள் வரை[a] நோக்குகிறார்; எல்லா வானங்களின் கீழும்[b] காண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியின் மிகத் தொலைவான பகுதிகள் வரை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘வானங்கள்’ என்பது பன்மை வடிவத்தில் உள்ளது. அல்லது, ‘வானம் முழுவதின் கீழும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: சூழலில் இந்தச் சுட்டுப்பெயர் கடவுளைக் குறிக்கிறது; மரியாதைப் பன்மையான ‘அவர்’ நவீனத் தமிழில் இயல்பானது.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: பூமியின் கடையெல்லைகள் வரை
  rationale: பூமியின் மிகத் தொலைவான எல்லைகளைக் குறிக்கும் எபிரெய உருவகத்தையும் לְ முன்னிடைச்சொல்லின் திசை/எல்லை உணர்வையும் காக்கிறது.
- source_word: יַבִּיט
  choice: நோக்குகிறார்
  rationale: נבט என்பதன் திசைசெலுத்திய பார்வையை ‘பார்க்கிறார்’ என்பதைக் காட்டிலும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: எல்லா வானங்களின் கீழும்
  rationale: ‘கீழ்’ என்ற இடவியல் உருவகத்தையும் שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் முடிந்தவரை நேரடியாகப் பேணுகிறது.
- source_word: יִרְאֶה
  choice: காண்கிறார்
  rationale: ראה என்பதன் பொதுவான ‘காணுதல்’ பொருளைத் தக்கவைத்து, ‘நோக்குகிறார்’ என்பதுடன் உள்ள கவிதை இணைப்பை வேறுபட்ட வினைச்சொல்லால் காட்டுகிறது.
theological_decisions:
- issue: הוּא என்ற சுட்டுப்பெயரின் குறிப்பு
  choice: இது கடவுளைக் குறிக்கிறது.
  alternative: குறிப்பிடப்படாத வேறொரு ஞானமுள்ள பொருளைக் குறிக்கிறது.
  rationale: உடனடியான சூழலில் ஞானத்தின் இருப்பிடத்தை அறிந்து படைப்பு முழுவதையும் காண்பவர் கடவுளே; இது உரைச் சூழலால் தெளிவாகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நோக்குகிறார் / காண்கிறார்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் பொருள் இணைப்பைப் பேணுகிறது; ‘எல்லா வானங்களின் கீழும்’ என்பது வழக்கத்தைவிடச் சற்றே முறைசார்ந்திருந்தாலும் மூலத்தின் இடவியல் உருவகத்தையும் பன்மையையும் காக்கிறது.
