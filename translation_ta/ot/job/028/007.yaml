source:
  edition: WLC
  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: ta
  text: அந்தப் பாதையை இரைகொல்லிப் பறவை அறியாது; வல்லூறின் கண் அதைக் கண்டதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பருந்தின்.’ எபிரெயச் சொல் ஓர் இரைகொல்லிப் பறவையைக் குறிக்கிறது; அதன் துல்லியமான இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: பாதை
  rationale: மறைந்திருக்கும் வழித்தடம் அல்லது பாதை என்ற எபிரெயக் கவித்துவப் படிமத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא יְדָעוֹ
  choice: அந்தப் பாதையை ... அறியாது
  rationale: יָדַע வினையுடன் உள்ள மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு ‘அதை அறியாது’ எனப் பொருள்படும்; தமிழில் சுட்டுப்பொருளைத் தெளிவுபடுத்த ‘அந்தப் பாதையை’ என வழங்கப்பட்டது.
- source_word: עָיִט
  choice: இரைகொல்லிப் பறவை
  rationale: ஒரு குறிப்பிட்ட இனத்தைக் காட்டாமல், இரையை வேட்டையாடும் பறவைக்கான பொதுப்பெயரைப் பாதுகாக்கிறது.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: அதைக் கண்டதில்லை
  rationale: שׁזף என்பது காணுதல் அல்லது கண்ணுற்றல் எனப் பொருள்படும்; இணை அமைப்பைப் பாதுகாக்கத் தெளிவான தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֵין
  choice: கண்
  rationale: ‘கண்’ என்ற நேரடியான கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אַיָּה
  choice: வல்லூறு
  rationale: இது ஓர் இரைகொல்லிப் பறவையைக் குறிக்கிறது; துல்லியமான இனம் உறுதியில்லை. ‘வல்லூறு’ தமிழில் பரிச்சயமான, இனத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாத தேர்வு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எபிரெயக் கவிதையின் இரண்டு இணையான கூறுகளையும் ‘அறியாது / கண்டதில்லை’ என்ற அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு வசனத்தின் முடிவில் இடப்பட்டுள்ளது.
