source:
  edition: WLC
  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: ta
  text: அவரிடத்தில் ஞானமும் வல்லமையும் உள்ளன[a]; ஆலோசனையும் புரிந்துணர்வும் அவருக்கு உரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குள் ஞானமும் வல்லமையும் உள்ளன; ஆலோசனையும் புரிந்துணர்வும் அவருடையவை.”
    reason: עִמּוֹ என்பதன் அடிப்படைப் பொருள் ‘அவருடன்/அவரிடத்தில்’ என்பதாக இருந்தாலும், இங்கு பண்புகள் அவரில் இருப்பதை வலியுறுத்தும் வகையில் ‘அவருக்குள்’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: עִמּוֹ
  choice: அவரிடத்தில்
  rationale: עִם என்னும் முன்னிடைச்சொல் பின்னொட்டுடன் பொதுவாக ‘அவருடன்/அவரிடத்தில்’ என்ற தொடர்பையோ உடைமையையோ குறிக்கிறது. இக்கவிதைச் சூழலில் ‘அவரிடத்தில்’ என்பது இந்தப் பண்புகள் அவரிடம் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: திறமையான அறிவையும் மெய்யுணர்வையும் குறிக்கும் இச்சொல்லுக்கான நிலையான, சூழலுக்கு ஏற்ற தமிழ் இணை.
- source_word: וּגְבוּרָה
  choice: வல்லமை
  rationale: גְבוּרָה என்பது பலம், ஆற்றல், வல்லமை ஆகியவற்றைக் குறிக்கிறது. ‘வல்லமை’ உயர்ந்த கவிதை நடையைப் பேணுவதோடு ‘ஞானம்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: לוֹ
  choice: அவருக்கு உரியவை
  rationale: לְ முன்னிடைச்சொல் பின்னொட்டுடன் இங்கு உடைமையைக் குறிக்கிறது. ‘அவருக்கு உரியவை’ என்பது வினையற்ற எபிரெய வாக்கியத்தின் உடைமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵצָה
  choice: ஆலோசனை
  rationale: திட்டமிடுதலுக்கான அறிவுரை அல்லது தீர்மானிக்கும் திறனை இச்சொல் குறிக்கிறது; ‘ஆலோசனை’ பொதுவாகப் புரியக்கூடியதும் கவிதை இணைப்புக்கு ஏற்றதுமாகும்.
- source_word: וּתְבוּנָה
  choice: புரிந்துணர்வு
  rationale: תְבוּנָה என்பது ஆழ்ந்த புரிதல், பகுத்துணர்வு, நுண்ணறிவு ஆகிய பொருள்களைக் கொண்டது. ‘புரிந்துணர்வு’ அதன் அறிவுசார் ஆழத்தையும் ‘ஆலோசனை’ என்பதுடனான இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: பிரதிப்பெயர் பின்னொட்டுகள் யாரைக் குறிக்கின்றன?
  choice: சூழலின் அடிப்படையில் அவை கடவுளைக் குறிக்கின்றன; எனினும் மூலத்தைப் போல மொழிபெயர்ப்பிலும் ‘அவர்’ என்றே வைக்கப்பட்டுள்ளது.
  alternative: ‘கடவுளிடத்தில்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: உடனடி சூழல் கடவுளின் ஞானத்தையும் வல்லமையையும் பேசுகிறது. ஆனால் எபிரெய மூலத்தில் பெயர் இவ்வசனத்தில் வெளிப்படையாக இல்லை; ஆகவே சூழல் சுட்டுப்பொருளைத் தீர்மானிக்க அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பைப் பேண இரண்டு சமச்சீர் அரைவாக்கியங்கள் அமைக்கப்பட்டுள்ளன; தேவையற்ற இறையியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
