    reason: נֶפֶשׁ, רוּחַ, மற்றும் כָּל בְּשַׂר אִישׁ ஆகியவற்றின் மேலும் நேரடியான சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: அவருடைய கையில்
  rationale: தொடர்புச் சொல்லையும் ‘அவருடைய கையில்’ என்ற சொற்றொடரையும் தமிழில் இயல்பாக இணைக்கிறது; கடவுளின் அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் ‘கை’ உருவகத்தைக் காக்கிறது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இங்கு தனியான பொருளற்ற ஆன்மாவை விட உயிரினங்களை உயிரோடு வைத்திருக்கும் உயிரையே குறிக்கிறது; רוּחַ என்பதுடன் உள்ள கவிதை இணைநிலைக்கும் பொருந்துகிறது.
- source_word: כָּל חָי
  choice: உயிருள்ள அனைத்தும்
  rationale: உயிரோடிருக்கும் எல்லாப் படைப்புகளையும் உள்ளடக்கும் எபிரெயச் சொற்றொடரின் விரிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְרוּחַ
  choice: உயிர்மூச்சு
  rationale: இந்த இணைநிலையில் ‘காற்று’ அல்லது தனியாக வரையறுக்கப்பட்ட ‘ஆவி’ என்பதைவிட உயிரளிக்கும் மூச்சு என்ற பொருள் இயல்பானது; சொல்லிலுள்ள உயிர் மற்றும் மூச்சு ஆகிய இரு நிழற்பொருள்களையும் இணைக்கிறது.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: மனிதர் அனைவரின்
  rationale: சொல்லுக்கு சொல் ‘மனிதனின் மாம்சம் அனைத்தும்’ என்று தருவது தமிழில் இயல்பற்றது. இச்சொற்றொடரின் பொதுவான மனிதகுலக் குறிப்பைத் தெளிவாகவும் உள்ளடக்கமாகவும் தருகிறது.
theological_decisions:
- issue: נֶפֶשׁ மற்றும் רוּחַ என்னும் மனிதவியல் சொற்கள்
  choice: ‘உயிர்’ மற்றும் ‘உயிர்மூச்சு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆத்துமா’ மற்றும் ‘ஆவி’
  rationale: இவ்வசனம் உயிரினங்களின் வாழ்வும் மனிதர்களின் உயிர்மூச்சும் கடவுளின் கையில் இருப்பதை வலியுறுத்துகிறது. பின்னாளைய உடல்–ஆத்துமா பிரிவை மூல எபிரெயத்துக்குள் திணிக்காமல், கவிதை இணைநிலையையும் சொற்களின் உறுதியான உடல்சார் நிழற்பொருளையும் காக்கிறது.
- issue: כָּל בְּשַׂר אִישׁ என்பதிலுள்ள மனிதகுலக் குறிப்பு
  choice: ‘மனிதர் அனைவரின்’ என்று கூட்டாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மனித மாம்சம் அனைத்தின்’
  rationale: எபிரெயத்தில் ‘மாம்சம்’ மனிதரின் மரணத்திற்குட்பட்ட படைப்புநிலையை உணர்த்தினாலும், சொல்லுக்கு சொல் வடிவம் தமிழில் கடினமாக இருக்கும். முதன்மை உரை மனிதர் அனைவரையும் குறிக்கும் பொருளைத் தெளிவாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமுள்ள தமிழ். ‘கையில்’ என்ற எபிரெய உருவகம் அப்படியே காக்கப்பட்டுள்ளது. ‘உயிர்மூச்சு’ என்பது சாதாரண வாசகருக்குப் புரியும்படியும் רוּחַ என்பதின் உயிரளிக்கும் மூச்சு என்ற பொருளைத் துல்லியமாகவும் வெளிப்படுத்துகிறது.
