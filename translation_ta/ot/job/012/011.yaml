  register: நவீன, கண்ணியமான பொதுத்தமிழ். எபிரெயக் கவிதையின் ‘காது—அண்ணம்’ உணர்வு உறுப்புகளுக்கிடையிலான இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘அண்ணம்’ துல்லியமான சொல்; சூழலும் அடிக்குறிப்பும் வாசிப்பைத் தெளிவாக்குகின்றன.
