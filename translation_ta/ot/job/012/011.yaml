- source_word: אֹזֶן
  choice: காது
  rationale: கேட்டறியும் திறனைக் குறிக்கும் உருவகப் பயன்பாட்டை விளக்கிவிடாமல், எபிரெய உடல் உறுப்புப் படிமத்தைப் பேணுகிறது.
- source_word: מִלִּין
  choice: சொற்களை
  rationale: ‘சொற்கள்/பேச்சு’ என்ற பொருள் வரம்பில், எபிரெய பன்மை வடிவத்துக்கு நேரானதும் ஒப்புமைக்கு ஏற்றதுமான சொல்.
- source_word: תִּבְחָן
  choice: சோதித்தறியாதோ
  rationale: வெறுமனே கேட்பதல்லாமல் ஆராய்ந்து மதிப்பிடுதல் என்ற வினையின் நுட்பத்தை ‘சோதித்தறி’ இயல்பாகத் தருகிறது.
- source_word: חֵךְ
  choice: அண்ணம்
