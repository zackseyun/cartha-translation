- source_word: יִטְעַם
  choice: சுவைப்பதுபோல்
  rationale: ‘சுவைத்தல்’ என்ற அடிப்படை உணர்ச்சிசார் செயலைப் பேணி, முதல் அடியின் சோதித்தறிதலுடன் ஒப்புமையாக இணைக்கிறது.
- source_word: לוֹ
  choice: தனி வார்த்தையாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்குள்ள suffix அண்ணம் தானே உணவைச் சுவைக்கும் இயல்பான தொடர்பைச் சுட்டும் idiomatic dative ஆகப் புரிந்துகொள்ளலாம்; தமிழில் ‘தனக்காக’ எனச் சேர்த்தால் நோக்கம்/பயன் என்ற தேவையற்ற நிழற்பொருள் தோன்றும்.
