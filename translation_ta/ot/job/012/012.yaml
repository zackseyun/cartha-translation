- from: முதியோரிடம் ஞானம் உள்ளது[a]; நீண்ட ஆயுளோடு[b] புரிந்துணர்வு உள்ளது.
  to: முதியோரிடம் ஞானம் உள்ளது[a]; நீண்ட வாழ்நாளில் பகுத்தறிவு உள்ளது[b].
