  text: בִּֽ/ישִׁישִׁ֥ים חָכְמָ֑ה וְ/אֹ֖רֶךְ יָמִ֣ים תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: ta
  text: முதியோரிடம் ஞானம் உள்ளது[a]; நீண்ட வாழ்நாளில் பகுத்தறிவு உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முதியோரிடையே ஞானம் உள்ளது.’ எபிரெய முன்னிடைச்சொல் உடனிருத்தலையோ ஓரிடத்தில் காணப்படுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘நாட்களின் நீளம்’; அதாவது, நீண்ட வாழ்நாள் அல்லது பல நாட்கள். இரண்டாம் அடியில் உள்ள தொடர்புப் பொருள் முதல் அடியுடன் உள்ள இணை அமைப்பிலிருந்து புரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: முதியோரிடம்
  rationale: בְּ முன்னிடைச்சொல் உடனிருத்தல் அல்லது ஓரிடத்தில் காணப்படுதல் என்ற பொருளைத் தரக்கூடும். ‘முதியோரிடம்’ என்பது இவ்விரு நுணுக்கங்களையும் இயல்பான தமிழில் ஓரளவு காத்து, முதிய ஆண்கள் என்று தேவையின்றிக் குறுக்குவதையும் தவிர்க்கிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: ஞான இலக்கியத்தில் חָכְמָה என்பதற்கான நிலையான, இயல்பான தமிழ் இணை; அனுபவத்தால் பெறப்படும் ஆழ்ந்த அறிவையும் வாழ்வறிவையும் குறிக்க ஏற்றது.
- source_word: וְאֹרֶךְ יָמִים
  choice: நீண்ட ஆயுளோடு
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘நாட்களின் நீளம்.’ தமிழில் ‘நீண்ட ஆயுள்’ அதன் கருத்தையும் கவிதைநயமுள்ள இணை அமைப்பையும் தெளிவாக வழங்குகிறது; ‘-ஓடு’ உடனிருத்தலைக் காக்கிறது.
- source_word: תְּבוּנָה
  choice: புரிந்துணர்வு
  rationale: תְּבוּנָה குறிக்கும் ஆழமாகப் புரிந்து பகுத்தறியும் திறனை ‘புரிந்துணர்வு’ வெளிப்படுத்துகிறது; இதனால் ‘ஞானம்’ என்பதுடன் உள்ள பொருள் வேறுபாடும் நிலைக்கிறது.
