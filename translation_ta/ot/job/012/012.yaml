translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பு ‘முதியோரிடம்…; நீண்ட ஆயுளோடு…’ எனக் காக்கப்பட்டுள்ளது. இவ்வசனம் யோபுவின் உரையில் வரும் பொதுக்கூற்றாக இருப்பதால், அது முழுமையான இறையியல் விதி என விளக்கிச் சேர்க்கப்படவில்லை.
