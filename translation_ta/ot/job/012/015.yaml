  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: ta
  text: இதோ, அவர் தண்ணீரைத் தடுத்து நிறுத்தினால், அது வற்றிப்போகும்; அவர் அதைப் பாயவிட்டால், அது பூமியைப் புரட்டிப்போடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தைப் புரட்டிப்போடும்.” எபிரெயச் சொல் பூமியையோ நிலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றை வலியுறுத்தும் எபிரெயச் சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעְצֹר בַּמַּיִם
  choice: தண்ணீரைத் தடுத்து நிறுத்தினால்
  rationale: עצר என்பதன் கட்டுப்படுத்துதல் அல்லது ஓடவிடாமல் தடுத்தல் என்ற பொருளைத் தெளிவாகக் கூறுகிறது; מים எபிரெயில் பன்மை வடிவமாயினும் தமிழில் இயல்பாகத் தொகுப்பொருள் ஒருமையாக வருகிறது.
- source_word: וְיִבָשׁוּ
  choice: அவை வறண்டுபோகும்
  rationale: வினையின் எழுவாய் எபிரெயில் வெளிப்படையாகக் குறிப்பிடப்படாததால் அந்தத் தெளிவின்மையை ஓரளவு காக்கிறது; அருகிலுள்ள 'தண்ணீர்' என்பதைச் சுட்டும் பன்மைப் பதிலிடுபெயர் எபிரெய இலக்கணத்துக்கும் இணங்குகிறது.
- source_word: וִישַׁלְּחֵם
  choice: அவர் அவற்றைக் கட்டவிழ்த்தால்
  rationale: தண்ணீரைக் கட்டுப்பாட்டிலிருந்து விடுதல் என்ற சூழல்சார் படிமத்தை இயல்பான தமிழில் வலுவாக வெளிப்படுத்துகிறது; இணையான இரு நிபந்தனைப் பகுதிகளையும் காக்கிறது.
- source_word: וְיַהַפְכוּ
  choice: அவை ... புரட்டிப்போடும்
  rationale: הפך என்பதிலுள்ள அழிவூட்டும் தலைகீழாக்கம் அல்லது பெரும் புரட்டல் என்ற வலிமையை, வெறும் 'வெள்ளமூட்டும்' என்று குறுக்காமல் காக்கிறது.
- source_word: אָרֶץ
  choice: பூமி
  rationale: ஞானக் கவிதையின் பரந்த, உலகளாவிய சூழலுக்கு 'பூமி' பொருந்துகிறது; எனினும் 'நிலம்' என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தெய்வீக ஆட்சியை விவரிக்கும் ஞானக் கவிதையில் אָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: தண்ணீரைக் கட்டுப்படுத்தும் கடவுளின் வல்லமை பரந்த அளவில் சித்தரிக்கப்படுவதால் 'பூமி' முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது. குறிப்பிட்ட ஒரு வெள்ள நிகழ்வை உரையில் புகுத்தாமல், 'நிலம்' என்ற சாத்தியத்தையும் அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், ஞானக் கவிதைக்குரிய கண்ணியமும் வலிமையும் நீடிக்குமாறும் வடிவமைக்கப்பட்டது. இணையான நிபந்தனை அமைப்பும் தண்ணீரைக் கட்டுப்படுத்துதல்/கட்டவிழ்த்தல் என்ற எதிரெதிர் படிமமும் காக்கப்பட்டுள்ளன.
