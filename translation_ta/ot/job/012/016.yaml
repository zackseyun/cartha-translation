  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: ta
  text: வலிமையும் நல்விவேகமும் அவரிடம் உள்ளன; வழிதவறுகிறவனும் மற்றவரை வழிதவறச் செய்கிறவனும்[a] அவருக்குச் சொந்தமானவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏமாறுகிறவனும் ஏமாற்றுகிறவனும்.” எபிரெய வினையெச்ச இணையைச் சூழலின்படி இவ்வாறு சுருக்கமாகவும் புரிந்துகொள்ளலாம்; முதன்மை உரை, ஒருவன் வழிதவறுவதற்கும் மற்றொருவன் வழிதவறச் செய்வதற்கும் இடையிலான வினை வடிவ வேறுபாட்டைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: அவரிடம் உள்ளன
  rationale: எபிரெயச் சொற்றொடர் உடனிருத்தலையும் உடைமை/வசப்படுதலையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘அவரிடம் உள்ளன’ என்பது அந்த இரு நிழற்பொருள்களையும் தக்கவைக்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: உடல் அல்லது ஆட்சிசார் பலம் என்ற பரந்த பொருளை இயல்பாகத் தரும் பொதுத் தமிழ்ச்சொல்.
- source_word: תּוּשִׁיָּה
  choice: நுண்ணறிவு
  rationale: ஞான இலக்கியத்தில் இச்சொல் வெறும் அறிவைவிடச் சரியான தீர்மானத்திற்கும் பயனுள்ள செயலுக்கும் உதவும் ஆழ்ந்த அறிவைக் குறிக்கலாம். ‘நுண்ணறிவு’ அந்தச் செறிவை வாசிக்க எளிய தமிழில் தருகிறது; ‘வெற்றி’ என்று விளைவாக மட்டும் சுருக்குவதையும் தவிர்க்கிறது.
- source_word: לוֹ
  choice: அவருக்குச் சொந்தமானவர்கள்
  rationale: לֹו இங்கு உடைமை அல்லது ஆளுகை சார்ந்த உறவைக் குறிக்கிறது. இருவரும் அவருடைய அதிகார எல்லைக்குள் இருப்பதைக் கூறும் வலுவான எபிரெயக் கூற்றை இது தெளிவாகவும், காரணத்தைக் கூடுதலாகச் சேர்க்காமலும் வழங்குகிறது.
- source_word: שֹׁגֵג
  choice: வழிதவறுகிறவன்
  rationale: שׁגה வேரின் Qal வினையெச்ச வடிவம் தவறுகிற அல்லது வழிதவறுகிற ஒருவனைக் குறிக்கிறது. செயல்படுவினை/தன்னிலைத் தன்மையைப் பாதுகாக்க இந்த மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מַשְׁגֶּה
  choice: வழிதவறச் செய்கிறவன்
  rationale: அதே வேரின் Hiphil வினையெச்ச வடிவம் மற்றொருவரைத் தவறச் செய்பவனைக் குறிக்கிறது. முந்தைய சொல்லுடனான வினைசார் எதிரிணையையும் காரணவினை வேறுபாட்டையும் இது காக்கிறது.
theological_decisions:
- issue: வழிதவறுகிறவனுக்கும் வழிதவறச் செய்கிறவனுக்கும் கடவுளோடு உள்ள உறவு
  choice: இருவரும் அவருக்குச் சொந்தமானவர்கள் என்று மொழிபெயர்க்கப்பட்டது; ஒழுக்கத் தீமைக்கு அவர் நேரடிக் காரணம் என்று கூறப்படவில்லை.
  alternative: இருவரையும் அவர் அறிந்திருக்கிறார்; இருவரையும் தமது பராமரிப்பில் கட்டுப்படுத்துகிறார்; அல்லது தவறுக்கும் ஏமாற்றத்துக்கும் அவரே மூல காரணம்.
  rationale: எபிரெயம் இருவரும் ‘அவருக்கு/அவருடையவர்கள்’ என்று வலுவாகக் கூறினாலும், அந்த உறவு எவ்வாறு செயல்படுகிறது என்பதை விளக்கவில்லை. ஆகவே இறையாட்சியை மெலிதாக்காமலும், மூலத்தில் இல்லாத நேரடி ஒழுக்கக் காரணத்தைச் சேர்க்காமலும் உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒரே எபிரெய வேரிலிருந்து வந்த இரு வினையெச்சங்களின் எதிரிணை ‘வழிதவறுகிறவன் / வழிதவறச் செய்கிறவன்’ என வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
