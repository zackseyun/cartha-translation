source:
  edition: WLC
  text: א֤וֹ שִׂ֣יחַ לָ/אָ֣רֶץ וְ/תֹרֶ֑/ךָּ וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗ דְּגֵ֣י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: ta
  text: அல்லது, பூமியிடம்[a] பேசு; அது உனக்குக் கற்பிக்கும்[b]. கடலின் மீன்களும் உனக்குச் சொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலத்திடம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயில் אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நிலம்’ என இருவகையிலும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லர்த்தமாக, ‘அவள் உனக்குக் கற்பிப்பாள்’; ‘பூமி’ என்பதோடு ஒத்துப் பெண்பால் ஒருமை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: அல்லது
  rationale: முந்தைய வசனத்தில் தொடங்கிய அழைப்புகளின் வரிசையைத் தொடரும் பிரிநிலை இடைச்சொல்; தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שִׂ֣יחַ
  choice: பேசு
  rationale: לָאָרֶץ என்பதுடன் வரும் இக்கட்டளை வடிவம், உள்ளார்ந்து சிந்திப்பதைவிடப் பூமியை நோக்கிப் பேசுவதைக் குறிக்கிறது.
- source_word: לָאָ֣רֶץ
  choice: பூமியிடம்
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படலாம். விலங்குகள், பறவைகள், கடல் மீன்கள் என விரியும் சூழல் இங்கு ‘பூமி’ என்பதை ஆதரிக்கிறது; ‘-இடம்’ உயிரூட்டிப் பேசும் கவித்துவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְתֹרֶךָּ
  choice: அது உனக்குக் கற்பிக்கும்
  rationale: ירה என்பதன் ஹிபில் வடிவம் ‘கற்பி/அறிவுறுத்து’ என்று பொருள்படும். ‘கற்பிக்கும்’ என்பது தெளிவான நவீனத் தமிழ்; எபிரெயில் பூமியோடு ஒத்த பெண்பால் வினை வடிவம் இருப்பது அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: וִיסַפְּרוּ לְךָ
  choice: உனக்குச் சொல்லும்
  rationale: ספר என்பதன் பியேல் வடிவம் ‘சொல், விவரி, அறிவி’ எனப் பொருள்படும். இக்கவிதை இணைப்பில் ‘சொல்லும்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: דְּגֵי הַיָּם
  choice: கடலின் மீன்கள்
  rationale: எபிரெயக் கூட்டுச் சொல்லின் உருவகத்தையும் பொருளையும் நேரடியாகப் பேணும் இயல்பான தமிழாக்கம்.
