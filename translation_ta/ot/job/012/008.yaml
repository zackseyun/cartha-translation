translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் உயிரூட்டலையும் பேணியுள்ளோம். ஒருமை ‘பூமி’க்குப் பின் வரும் ‘அது ... கற்பிக்கும்’ மற்றும் பன்மை ‘மீன்கள்’க்குப் பின் வரும் ‘சொல்லும்’ ஆகிய வடிவங்கள் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளன.
