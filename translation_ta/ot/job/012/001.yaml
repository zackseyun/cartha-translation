  text: Then Job answered and said:[a]
translation:
  language: ta
  text: அப்போது யோபு பதிலளித்துக் கூறினான்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோபு பதிலளித்துக் கூறினான்.”
