lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்பதன் தொடர்நிலை உரையாடல் வடிவம் முந்தைய பேச்சுக்குப் பதிலளிப்பதைச் சுட்டுகிறது. அடுத்து வரும் ‘சொன்னது’ என்பதுடன் இயல்பான தமிழில் இணைவதற்காக ‘மறுமொழியாக’ என வழங்கப்பட்டுள்ளது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயரொலிபெயர்ப்பு.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பது பேசுதலைக் குறிக்கும் வழக்கமான எபிரெய வினை. அடுத்து வரும் உரையை அறிமுகப்படுத்தும் இயல்பான தமிழ் நடை ‘சொன்னது’.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் உரையாடலின் தொடர்ச்சியையும் அடுத்த நிகழ்வையும் குறிக்கிறது. நவீன தமிழில் ‘அப்போது’ இயல்பாக இதை வெளிப்படுத்துகிறது; ‘மேலும்/மற்றும்’ என்ற நேரடி இணைப்பும் சாத்தியம்.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில், உரையாடலை அறிமுகப்படுத்தும் கண்ணியமான மற்றும் எளிதில் புரியும் நடை. எபிரெயத்தின் இரட்டை பேச்சுச் சூத்திரம் (‘பதிலளித்து… சொன்னான்’) தமிழில் செயற்கையாக ஒலிக்காமல் இருக்க ‘மறுமொழியாகச் சொன்னது’ எனச் சுருக்கமாகவும் பொருள் குன்றாமலும் வழங்கப்பட்டுள்ளது.
