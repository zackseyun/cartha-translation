source:
  edition: WLC
  text: מוֹלִ֣יךְ יוֹעֲצִ֣ים שׁוֹלָ֑ל וְֽ/שֹׁפְטִ֥ים יְהוֹלֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: ta
  text: 'அவர் ஆலோசகர்களை உடைமைகள் பறிக்கப்பட்ட நிலையில்[a] அழைத்துச் செல்கிறார்;

    நீதிபதிகளை மூடராக்குகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளையிடப்பட்ட நிலையில்” அல்லது “சூறையாடப்பட்ட நிலையில்”; எபிரெயச் சொல், ஆலோசகர்கள் அவமானப்படுத்தப்பட்டு உடைமைகளை இழந்த நிலையில் அழைத்துச் செல்லப்படுவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: அழைத்துச் செல்கிறார்
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் பிறரைப் போகச் செய்யும் காரணவினைப் பொருளைத் தருகிறது. இங்கு தோல்வியுற்றவர்களை நடத்திச் செல்வதைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடராக இது அமைகிறது.
- source_word: יוֹעֲצִים
  choice: ஆலோசகர்களை
  rationale: ஆலோசனை வழங்குகிறவர்களைக் குறிக்கும் நேரடியான, நவீனத் தமிழ் சொல்; ஞான மற்றும் ஆட்சிசார் சூழலுக்கும் பொருந்துகிறது.
- source_word: שׁוֹלָל
  choice: உடைமைகள் பறிக்கப்பட்டவர்களாக
  rationale: שלל தொடர்பான இச்சொல் கொள்ளையிடப்பட்ட அல்லது உடைமைகள் பறிக்கப்பட்ட அவமான நிலையைக் குறிக்கிறது. 'நிர்வாணமாக' அல்லது 'வெறுங்காலுடன்' என்று தேவையின்றி குறிப்பாக்காமல், இழப்பு மற்றும் அவமானம் இரண்டையும் இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: שֹׁפְטִים
  choice: நீதிபதிகளை
  rationale: שפט என்பதன் வழக்கமான பொருளான நீதித் தீர்ப்பு வழங்குகிறவர்களை நேரடியாகக் குறிக்கிறது; ஆட்சியாளர்கள் என்ற விரிவான பொருளை உரையில் திணிக்கவில்லை.
- source_word: יְהוֹלֵל
  choice: மூடர்களாக்குகிறார்
  rationale: הלל II என்பதன் பியேல் வடிவம் ஒருவரை மூடத்தனமான அல்லது பகுத்தறிவற்ற நிலைக்கு ஆக்குவதைக் குறிக்கிறது. காரணவினைப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் இது தருகிறது.
theological_decisions:
- issue: வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத எழுவாய்
  choice: '''அவர்'' என்பது சூழலில் தேவனைக் குறிக்கும் எழுவாயாக வைக்கப்பட்டுள்ளது.'
  alternative: எழுவாயைச் சொல்லாமல் வினைமுற்றுகளை மட்டும் பயன்படுத்துதல்
  rationale: யோபு 12-இன் சுற்றியுள்ள வசனங்கள் இச்செயல்களை தேவனுக்கே உரியவையாகக் கூறுகின்றன. தமிழில் தொடர்ச்சியையும் தெளிவையும் காக்க 'அவர்' சேர்க்கப்படுகிறது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் இணை அமைப்பைப் பாதுகாக்கும் கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியக்கூடிய மொழிநடை பயன்படுத்தப்பட்டுள்ளது. 'அழைத்துச் செல்கிறார்' என்பது தொடர்ச்சியான தெய்வீகச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
