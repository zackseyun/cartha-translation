source:
  edition: WLC
  text: גַּם לִ֤/י לֵבָ֨ב כְּֽמוֹ/כֶ֗ם לֹא נֹפֵ֣ל אָנֹכִ֣י מִ/כֶּ֑ם וְ/אֶת מִי אֵ֥ין כְּמוֹ אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: ta
  text: உங்களைப் போல எனக்கும் சிந்திக்கும் திறன் உண்டு; நான் உங்களைவிடத் தாழ்ந்தவன் அல்ல.[a] இத்தகையவற்றை அறியாதவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “உங்களைப் போல எனக்கும் இதயம் உண்டு.” இங்கு “இதயம்” என்பது சிந்திக்கும் அல்லது புரிந்துகொள்ளும் திறனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: எனக்கும் சிந்திக்கும் திறன் உண்டு
  rationale: לֵבָב என்பதன் நேரடிப் பொருள் ‘இதயம்’; இச்சூழலில் அது சிந்தனை மற்றும் புரிதலுக்கான உள்ளார்ந்த திறனைக் குறிக்கிறது. நவீன தமிழில் ‘சிந்திக்கும் திறன்’ கருத்தை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: כְּמוֹכֶם
  choice: உங்களைப் போல
  rationale: யோபு தன் உரையாடல் தோழர்களோடு தன்னை ஒப்பிடுவதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: நான் உங்களைவிடத் தாழ்ந்தவன் அல்ல
  rationale: נפל + מן என்ற எபிரெய மரபுத்தொடர் ஒருவரைவிடக் கீழானவராக அல்லது குறைந்தவராக இல்லாததைக் குறிக்கிறது; தமிழில் இந்த ஒப்பீட்டு வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: இத்தகையவற்றை அறியாதவர் யார்?
  rationale: மூலவாக்கியம் சுருக்கப்பட்ட, மரபுத்தொடரான வினாவாக உள்ளது. தோழர்களின் கருத்துகள் பொதுவாக அனைவரும் அறிந்தவையே என்று யோபு கூறும் சொல்லாட்சியின் வினாவலிமையை இந்த மொழிபெயர்ப்பு காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் யோபின் உறுதியான மறுப்புத் தொனியைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘சிந்திக்கும் திறன்’ என்பது ‘இதயம்’ என்ற எபிரெய உருவகத்தின் சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
