review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic/ironic opening, the plural address, and the image that wisdom will die with the addressees. However, «அந்த» (“that/those”) has no explicit counterpart in the Hebrew. The definite, idiomatic force of אַתֶּם עָם is better retained in Tamil without adding a demonstrative.
  naturalness: «உங்களோடு ஞானமும் இறந்துவிடும்» is natural modern standard Tamil and preserves the vivid personification. «நீங்கள்தான் மக்கள்» is deliberately close to the marked Hebrew idiom; the footnote helps readers recognize its ironic force.
  terminology: «ஞானம்» is the standard and appropriate equivalent for חָכְמָה. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The main text adds «அந்த» in «அந்த மக்கள்».
    rationale: The Hebrew says literally “you are the people,” with a definite/idiomatic sarcastic force, but contains no demonstrative. «அந்த» may suggest a specifically identified external group rather than Job’s ironic claim that his friends are “the people” par excellence.
  - severity: low
    issue: «இறந்துபோகும்» is slightly less direct than necessary.
    rationale: «இறந்துவிடும்» is a more idiomatic rendering of the imperfect “will die” while retaining the personified irony.
  revised_text: '“உண்மையாகவே, நீங்கள்தான் மக்கள்;

    உங்களோடு ஞானமும் இறந்துவிடும்!”'
