  to: '“உண்மையாகவே, நீங்கள்தான் மக்கள்;

    உங்களோடு ஞானமும் இறந்துவிடும்!”'
  rationale: «அந்த» நீக்கப்பட்டதால் மூலத்தில் இல்லாத சுட்டுதல் சேர்க்கப்படவில்லை. «மக்கள்» என்ற சற்றே குறியிடப்பட்ட சொற்றொடர் மூலத்தின் ஏளனமான “the people” என்ற இடியத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்பு மற்றும் ஏளனக் குறிப்பு அடிக்குறிப்பில் வழங்கப்படுகின்றன. வினை «இறந்துவிடும்» எனத் திருத்தப்பட்டு மூலத்தின் நேரடியான உருவகம் இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
