  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: ta
  text: '“உண்மையாகவே, நீங்கள்தான் மக்கள்;

    உங்களோடு ஞானமும் இறந்துவிடும்!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: உண்மையாகவே
  rationale: இரு சொற்களும் சேர்ந்து வலியுறுத்தும் உறுதிப்பாட்டைத் தருகின்றன. சூழலில் இது யோபு தன் நண்பர்களை நோக்கிக் கூறும் குத்தலான ஏளனமாக இயல்பாகப் புரிகிறது.
- source_word: אַתֶּם
  choice: நீங்கள்தான்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மையைத் தெரிவிப்பதோடு, எபிரெய வாக்கியத்தில் உள்ள நேரடியான அழுத்தத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָם
  choice: அந்த மக்கள்
  rationale: ‘மக்கள்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘அந்த’ என்பது இவர்கள் மட்டுமே குறிப்பிடத்தக்க மக்கள் என்பதுபோன்ற ஏளனமான சுட்டுதலைத் தமிழில் உணர்த்துகிறது.
- source_word: וְעִמָּכֶם
  choice: உங்களோடு
  rationale: உடனிகழ்வைக் குறிக்கும் எபிரெய முன்னிடைச்சொல் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: תָּמוּת
  choice: இறந்துபோகும்
  rationale: ‘இறத்தல்’ என்ற வினையின் நேரடியான உருவகத்தைப் பாதுகாத்து, ஞானம் இவர்களோடு முடிந்துவிடும் என்ற குத்தலான கருத்தைத் தெளிவாக்குகிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: இச்சொல்லின் வழக்கமான பொருளையும், நண்பர்கள் தங்களுக்கே உரியதாகக் கருதுவதாக யோபு ஏளனம் செய்யும் பண்பையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதும் நேரடியானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கூர்மையான ஏளனம் வியப்புக்குறி மூலமும் சொல் அழுத்தம் மூலமும் வெளிப்படுத்தப்பட்டுள்ளது; அதை வெறும் நேரடியான கூற்றாக மாற்றவில்லை.
