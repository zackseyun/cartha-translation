  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: ta
  text: கொள்ளையடிப்பவர்களின் கூடாரங்கள் நிம்மதியாக இருக்கின்றன; கடவுளைச் சினமூட்டுகிறவர்கள் பாதுகாப்பாக இருக்கின்றனர்—தங்கள் கையில் தெய்வத்தைக் கொண்டுவருகிறவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தம் கைக்குள் ஒப்படைக்கிறவர்கள்,” அல்லது “யாருடைய கைக்குக் கடவுள் [ஏதோ ஒன்றைக்] கொண்டுவருகிறாரோ அவர்கள்.” இறுதிக் கூறின் எபிரெயத் தொடரமைப்பு கடினமானது. அது மெய்யான கடவுளின் ஆளுகையைக் குறிக்கலாம்; அல்லது, தீயவன் தன் கை வல்லமையையே ‘தெய்வம்’ எனக் கருதுவதை ஏளனமாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: நிம்மதியாக இருக்கின்றன
  rationale: שלה என்ற வேர்ச்சொல் பொருளாதாரச் செழிப்பை மட்டும் அல்லாமல், தொந்தரவில்லாத அமைதியையும் நிம்மதியையும் குறிக்கிறது; சூழலிலுள்ள அறநெறி முரண்பாட்டையும் இச்சொல் காக்கிறது.
- source_word: אֹהָלִים
  choice: கூடாரங்கள்
  rationale: மூலத்தின் concrete உருவகத்தைத் தக்கவைக்கிறது; இங்கு அது வாழ்விடங்களையோ குடும்பங்களையோ ஆகுபெயராகவும் குறிக்கலாம்.
- source_word: לְשֹׁדְדִים
  choice: அழிவுண்டாக்குகிறவர்களின்
  rationale: வன்முறையாகச் சூறையாடி அழிப்பவர்களைக் குறிக்கும் பெயரெச்ச வடிவம்; திருடர்களாக மட்டும் பொருளைக் குறுக்காமல் அதன் பரந்த வன்முறைப் பொருளைக் காக்கிறது.
- source_word: וּבַטֻּחוֹת
  choice: பாதுகாப்பாக இருக்கின்றனர்
  rationale: בטח என்பதன் பாதுகாப்பு மற்றும் அச்சமின்மை சார்ந்த பொருளை, முந்தைய இணை வரியோடு இயல்பாகப் பொருந்துமாறு தருகிறது.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: கடவுளைச் சினமூட்டுகிறவர்கள்
  rationale: רגז என்பதன் Hiphil வடிவம் இங்கு கடவுளுக்குச் சினமுண்டாக்குதல் அல்லது அவரைத் தூண்டுதல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது.
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: தங்கள் கைக்குக் கொண்டுவருகிற வல்லமையையே தெய்வமாகக் கொண்டவர்கள்
  rationale: இறுதிக் கூறின் கடினமான தொடரமைப்பை, தங்களுடைய கை வல்லமையையே தெய்வமாகக் கருதும் தீயவர்களைப் பற்றிய ஏளனக் குறிப்பாக வெளிப்படுத்துகிறது; எபிரெயில் சாத்தியமான வேறு இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள אֱלוֹהַּ என்பதன் சுட்டுப்பொருள்
  choice: தீயவர்களின் கை வல்லமை அவர்களுக்குத் ‘தெய்வம்’ எனும் ஏளனப் பொருள்
  alternative: “கடவுள் தம் கையில் ஒப்படைக்கிறவர்கள்” அல்லது “யாருடைய கைக்குக் கடவுள் கொண்டுவருகிறாரோ அவர்கள்” என்று மெய்யான கடவுளைக் குறிக்கும் வாசிப்பு
  rationale: தீயவர்களின் நிம்மதியையும் பாதுகாப்பையும் வலியுறுத்தும் உடனடிச் சூழலில், அவர்களுடைய சொந்த ஆற்றலே அவர்களுக்குத் தெய்வமாகச் செயல்படுகிறது என்ற வாசிப்பு பொருந்துகிறது. ஆயினும் மூலத்தின் தொடரமைப்பு உறுதியற்றதால், மெய்யான கடவுளைக் குறிக்கும் வாசிப்புகள் நிராகரிக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “கூடாரங்கள்” என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது; இறுதிக் கூறின் உண்மையான தெளிவின்மை பிரதான வாசிப்பிலும் அடிக்குறிப்பிலும் வெளிப்படுத்தப்பட்டுள்ளது.
