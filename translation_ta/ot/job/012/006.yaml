  source_fidelity: முதல் இரண்டு இணைவரிகள் மூலத்திற்கும் பொருளுக்கும் நன்றாக ஒத்துள்ளன. ஆனால் இறுதிக் கூறில் உள்ள הֵבִיא אֱלוֹהַּ בְּיָדוֹ என்பதை “தங்கள் கைக்குக் கொண்டுவருகிற வல்லமையையே தெய்வமாகக் கொண்டவர்கள்” என்று மொழிபெயர்ப்பது, மூலத்தில் வெளிப்படையாக இல்லாத ‘வல்லமை’ மற்றும் ‘தெய்வமாகக் கொண்டவர்கள்’ என்ற விளக்கத்தைச் சேர்க்கிறது. மூலத்தின் கடினமும் விவாதத்திற்குரியதுமான தொடரமைப்பை முதன்மை வாசிப்பில் இயன்றவரை நேரடியாகக் காக்க வேண்டும்.
  naturalness: “அழிவுண்டாக்குகிறவர்கள்” மற்றும் “கடவுளைச் சினமூட்டுகிறவர்கள்” புரிந்துகொள்ளத்தக்கவை; எனினும் “கொள்ளையடிப்பவர்கள்” என்பது שֹׁדְדִים-இன் வன்முறைச் சூறையாடல் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது. இறுதிக் கூறு மூலத்திலேயே கடினமானதால், தமிழிலும் சிறிது செறிவான நடை தவிர்க்க முடியாதது; அடிக்குறிப்பு அதைத் தெளிவுபடுத்துகிறது.
  terminology: “கூடாரங்கள்,” “கடவுள்,” “பாதுகாப்பாக,” மற்றும் “தெய்வம்” பொருத்தமானவை. ‘தெய்வம்’ என்பதைச் சிற்றெழுத்துப் பொதுப்பொருளில் வைத்திருப்பது, இறுதிக் கூறின் ஏளன/மாற்று வாசிப்பு வாய்ப்பைத் திறந்துவைக்கிறது.
