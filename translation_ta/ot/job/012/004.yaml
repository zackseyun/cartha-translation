source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: ta
  text: என் நண்பனுக்கு நான் கேலிப்பொருளாக இருக்கிறேன்[a]—தேவனை நோக்கிக் கூப்பிட்டவன் நான்; அவர் அவனுக்குப் பதிலளித்தார்[b]—நீதிமானும் நேர்மையுள்ளவனுமான நான் கேலிப்பொருளாக இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்பட, “அவனுடைய நண்பனுக்கு.” சூழலில் யோபு தன் நண்பர்களைப் பற்றிப் பேசுவதால், “என் நண்பனுக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர் எனக்குப் பதிலளித்தார்.” எபிரெய வடிவம் சொற்பட “அவனுக்குப் பதிலளித்தார்” என்று இருந்தாலும், அந்த ‘அவன்’ யோபையே குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: கேலிப்பொருள்
  rationale: ஒருவரை நோக்கிச் செய்யப்படும் சிரிப்பையும் இகழ்ச்சியையும் குறிக்கும் பெயர்ச்சொல். தமிழில் ஒருவன் பிறரின் கேலிக்கு இலக்காகியிருப்பதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לְרֵעֵהוּ
  choice: என் நண்பனுக்கு
  rationale: எபிரெய வடிவம் சொற்பட மூன்றாம் நபர் உரிமையைக் காட்டினாலும், யோபு தன்னையும் தன் நண்பரையும் குறித்துப் பேசும் சூழல் முதல் நபர் பொருளை ஆதரிக்கிறது; வடிவிலுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אֶהְיֶה
  choice: நான் ... இருக்கிறேன்
  rationale: முற்றுப்பெறாத வினைவடிவம் இங்கு யோபின் நிகழ்கால நிலையைச் சுட்டுகிறது. நிகழ்காலத் தமிழ் புலம்பலின் உடனடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: தேவனை நோக்கிக் கூப்பிட்டவன்
  rationale: தொடர்ந்து வரும் இறந்தகால நிகழ்வோடு இணையும் வினையெச்சப் பொருளை உறவுத்தொடராக அளித்து, யோபின் கூப்பிடுதலையும் அதற்குக் கிடைத்த பதிலையும் வரிசைப்படுத்துகிறது.
- source_word: וַיַּעֲנֵהוּ
  choice: அவர் அவனுக்குப் பதிலளித்தார்
  rationale: எபிரெயிலுள்ள மூன்றாம் நபர் செயப்படுபொருளை வெளிப்படையாகப் பாதுகாக்கிறது; ‘அவன்’ யோபையே குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: ஞான இலக்கியத்தின் அறநெறிசார் நீதியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: תָּמִים
  choice: குற்றமற்றவன்
  rationale: முழுமையான பாவமின்மையை அல்ல, நேர்மையும் ஒழுக்க முழுமையும் கொண்ட நிலையை இங்கு குறிக்கிறது. யோபைப் பற்றிய நூலின் தொடக்க வருணனையுடனும் ஒத்திருக்கிறது.
theological_decisions:
- issue: யோபின் תָּמִים என்ற தற்குறிப்பு முழுமையான பாவமின்மையைக் குறிக்கிறதா
  choice: ஒழுக்க நேர்மையைக் குறிக்கும் ‘குற்றமற்றவன்’
  alternative: ‘பரிபூரணமானவன்’ அல்லது முழுமையாகப் பாவமற்றவன்
  rationale: ஞான இலக்கியத்தில் תָּמִים ஒருவரின் முழுமை, நேர்மை, குற்றஞ்சாட்ட முடியாத ஒழுக்க நிலை ஆகியவற்றைக் குறிக்கும்; மெய்யியல் பொருளில் முழுமையான பாவமின்மையை கட்டாயப்படுத்தாது.
- issue: இறுதி צַדִּיק תָּמִים யாரைக் குறிக்கிறது
  choice: கேலிப்பொருளாகிய யோபை மறுபடியும் வருணிக்கும் இணைநிலைச் சொற்றொடர்
  alternative: நீதிமானும் குற்றமற்றவனுமான வேறொருவருக்கு யோபு கேலிப்பொருள்
  rationale: இறுதித் தொடருக்கு முன் ‘-க்கு’ என்பதற்கான எபிரெய முன்னொட்டு இல்லை. ஆகவே அது யோபையே ‘நீதிமானும் குற்றமற்றவனும்’ என்று இணைநிலையில் வருணிப்பதாக எடுத்துக்கொள்வது எபிரெய தொடரமைப்புக்கும் சூழலுக்கும் நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இருமுறை வரும் ‘கேலிப்பொருள்’ திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது. நடுவிலுள்ள மூன்றாம் நபர் வடிவத்தின் இயல்பற்ற பதற்றமும் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
