  text: מוֹלִ֣יךְ כֹּהֲנִ֣ים שׁוֹלָ֑ל וְ/אֵֽתָנִ֣ים יְסַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: ta
  text: அவர் ஆசாரியர்களைக் கொள்ளையடிக்கப்பட்டவர்களாக அழைத்துச் செல்கிறார்[a]; வலிமைமிக்கவர்களை வீழ்த்துகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியர்களை உடைமைகள் பறிக்கப்பட்டவர்களாக அழைத்துச் செல்கிறார்” அல்லது “கொள்ளைப்பொருளாக அழைத்துச் செல்கிறார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிலைத்திருப்பவர்களை”; அதாவது, உறுதியாக நிலைபெற்றவர்கள் என்று கருதப்படுவோரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: நடத்திச் செல்கிறார்
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் ஒருவரைச் செல்லச் செய்வதைக் குறிக்கிறது. இங்கு சிறைபிடித்தோ தோற்கடித்தோ அழைத்துச் செல்லும் நியாயத்தீர்ப்புச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: சமய மற்றும் சமூக முக்கியத்துவமுள்ள כהנים என்பதன் நேரான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: שׁוֹלָל
  choice: உடைமைகள் பறிக்கப்பட்டவர்களாக
  rationale: שלל சார்ந்த இவ்வடிவம் கொள்ளையிடப்பட்டு, உடைமையும் மதிப்பும் இழந்த நிலையைக் குறிக்கிறது. தமிழில் தெளிவாகவும் இயல்பாகவும் அந்த இழிவுறுத்தலைத் தெரிவிக்கிறது.
- source_word: אֵתָנִים
  choice: வலிமைமிக்கவர்கள்
  rationale: איתן வலிமை, உறுதி, நிலைத்தன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. அதிகாரமுள்ளவர்களும் நிலைபெற்றவர்களும் தாழ்த்தப்படுகின்ற சூழலில் ‘வலிமைமிக்கவர்கள்’ இயல்பான முதன்மைத் தெரிவாகும்.
- source_word: יְסַלֵּף
  choice: கவிழ்க்கிறார்
  rationale: סלף என்பதன் பியேல் வடிவம் திரித்தல் அல்லது நிலைகுலையச் செய்தல் என்ற கருத்தைக் கொண்டது. உறுதியாகத் தோன்றுவோரை வீழ்த்தும் இச்சூழலில் ‘கவிழ்க்கிறார்’ அதன் விளைவைச் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோபு 12-ஆம் அதிகாரச் சூழலில் மறைமுகமாகத் தொடரும் எழுவாய்
  choice: கடவுளைக் குறிக்கும் ‘அவர்’ என்ற ஒருமைச் சுட்டுப்பெயரைப் பயன்படுத்துதல்
  alternative: தெளிவுக்காக ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள வசனங்களில் கடவுளுடைய செயல்கள் தொடர்ந்து விவரிக்கப்படுகின்றன; ஒவ்வொரு அடியிலும் அவருடைய பெயர் மீண்டும் சொல்லப்படவில்லை. ‘அவர்’ என்பது எபிரெயக் கவிதையின் தொடர்ச்சியைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடைமைகள் பறிக்கப்பட்டவர்களாக’ என்பது பழமையான அல்லது அரிதான சொல்லைத் தவிர்த்து שׁוֹלָל என்பதிலுள்ள இழப்பு மற்றும் அவமானத்தை வெளிப்படுத்துகிறது; ‘வலிமைமிக்கவர்கள்’ முதன்மைப் பொருளாக வைக்கப்பட்டு, நிலைத்தன்மை என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
