    text: அல்லது, “வானப் பறவைகள்.” எபிரேயத்தில் சொல்லர்த்தமாக, “வானங்களின் பறவைகள்.”
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew’s single entreating imperative (שְׁאַל נָא) and lets it govern both ‘animals’ and ‘birds.’ It preserves the poetic sequence ‘teach you’ / ‘tell you,’ uses consistent singular direct address, and supplies a corrected footnote for the literal Hebrew expression.
