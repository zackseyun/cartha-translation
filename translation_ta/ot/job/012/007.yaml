translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய் இணைநிலையைத் தெளிவாக்க இரண்டாம் அரையடியில் ‘கேட்டுப்பார்’ மீண்டும் வழங்கப்பட்டுள்ளது; அது மூலத்தில் முதல் கட்டளையிலிருந்து உள்ளடக்கமாகத் தொடர்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘வானத்துப் பறவைகள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
