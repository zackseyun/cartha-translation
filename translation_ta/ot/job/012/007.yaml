review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the animals, the birds of the heavens, and the paired actions ‘teach’ and ‘tell.’ However, it adds a second explicit imperative in the second colon and uses the honorific-like ‘கேட்டுப்பார்’ alongside singular informal ‘உனக்கு.’ The Hebrew has one imperative governing both coordinated objects.
  naturalness: ‘கேட்டுப்பார்’ is not a natural match for the singular informal address elsewhere in the verse. A direct imperative, ‘கேள்,’ is clear, idiomatic modern standard Tamil, and retains the concise poetic parallelism.
  terminology: ‘விலங்குகள்’ is suitable for בְּהֵמוֹת, and ‘வானத்துப் பறவைகள்’ is a natural rendering of עוֹף הַשָּׁמַיִם. ‘சொல்லும்’ is more direct and contextually natural than ‘தெரிவிக்கும்’ for the final verb. The footnote should correct ‘எபிரெயில்’ to ‘எபிரேயத்தில்’ and should identify the literal plural expression.
  issues:
  - severity: medium
    issue: Repeated imperative in the second colon
    rationale: The Hebrew has a single imperative, ‘ask,’ followed by coordinated objects; the second imperative is not explicit in the source. Tamil can preserve the source structure by coordinating both objects under one ‘கேள்.’
  - severity: medium
    issue: Register/person mismatch in ‘கேட்டுப்பார்’ with ‘உனக்கு’
    rationale: ‘கேட்டுப்பார்’ carries a polite/honorific flavor, whereas ‘உனக்கு’ is singular informal. ‘கேள்’ provides consistent direct singular address.
  - severity: low
    issue: Footnote wording contains an incorrect form and lacks the lexical alternative clearly
    rationale: Use ‘எபிரேயத்தில்,’ and state that the Hebrew literally reads ‘the birds of the heavens.’
  revised_text: ஆனால், தயவுசெய்து விலங்குகளையும் வானத்துப் பறவைகளையும்[a] கேள்; அவை உனக்குக் கற்பிக்கும்; அவை உனக்குச் சொல்லும்.
  revised_footnotes:
