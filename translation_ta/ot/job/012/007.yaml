source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם שְׁאַל נָ֣א בְהֵמ֣וֹת וְ/תֹרֶ֑/ךָּ וְ/ע֥וֹף הַ֝/שָּׁמַ֗יִם וְ/יַגֶּד לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: ta
  text: ஆனால், தயவுசெய்து விலங்குகளையும் வானத்துப் பறவைகளையும்[a] கேள்; அவை உனக்குக் கற்பிக்கும்; அவை உனக்குச் சொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானப் பறவைகள்.” எபிரேயத்தில் சொல்லர்த்தமாக, “வானங்களின் பறவைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: யோபுவின் உரையில் வரும் முரண்பாட்டுத் திருப்பத்தை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: שְׁאַל נָא
  choice: தயவுசெய்து ... கேட்டுப்பார்
  rationale: שְׁאַל என்பது ‘கேள்’; נָא என்பது காலத்தைக் குறிக்கும் ‘இப்போது’ என்பதைக் காட்டிலும் வேண்டுகோள் அல்லது வலியுறுத்தலின் நயத்தைச் சேர்க்கிறது. ஒருமை முன்னிலையை நவீன தமிழில் இயல்பாகக் காட்ட ‘கேட்டுப்பார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְהֵמוֹת
  choice: விலங்குகள்
  rationale: இங்கு கால்நடைகளை மட்டும் அல்லாமல் நிலவாழ் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; பறவைகளுடன் அமைந்த இணைப்புக்கும் இது பொருந்துகிறது.
- source_word: וְתֹרֶךָּ
  choice: அவை உனக்குக் கற்பிக்கும்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் ‘கற்பி/போதித்தறிவி’ என்று பொருள்படும். எபிரெயில் கூட்டு ஒருமையோடு வினை அமைந்தாலும், தமிழில் ‘விலங்குகள்’ என்பதற்கேற்ப பன்மை இயல்பாக உள்ளது.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: עוֹף இச்சூழலில் பறவைகளைக் குறிக்கிறது; הַשָּׁמַיִם என்பதன் சொற்பொருள் ‘வானங்கள்’ என்றாலும், ‘வானத்துப் பறவைகள்’ என்பது தமிழில் இயல்பாகவும் கவித்துவத் தன்மையுடனும் உள்ளது.
- source_word: וְיַגֶּד לָךְ
  choice: அவை உனக்குத் தெரிவிக்கும்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவி, அறிவி, சொல்லு’ என்று பொருள்படும். முதல் வரியின் ‘கற்பிக்கும்’ என்பதிலிருந்து கவிதை இணைநிலையின் நுண்ணிய வேறுபாட்டைக் காக்க ‘தெரிவிக்கும்’ தேர்ந்தெடுக்கப்பட்டது.
