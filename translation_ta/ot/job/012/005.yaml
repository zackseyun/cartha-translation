  text: לַ/פִּ֣יד בּ֭וּז לְ/עַשְׁתּ֣וּת שַׁאֲנָ֑ן נָ֝כ֗וֹן לְ/מ֣וֹעֲדֵי רָֽגֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/005.yaml
  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: ta
  text: 'நிம்மதியாக இருப்பவனின் எண்ணத்தில் தீப்பந்தம்[a] இகழப்படுகிறது;

    கால் சறுக்குபவர்களுக்காக அது ஆயத்தமாயிருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீப்பந்தம்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பொதுவாக அதையே குறிக்கிறது; சிலர் இங்கு அதை ‘துன்பம்’ அல்லது ‘அழிவு’ என்று புரிந்துகொள்கிறார்கள்.
    reason: மூலவசனத்தின் அரிதான, விவாதத்திற்குரிய உருவகத்தை வாசகர் அறியச் செய்கிறது.
lexical_decisions:
- source_word: לַפִּיד
  choice: தீப்பந்தம்
  rationale: மசோரெத்திய உயிர்க்குறிப்புகளின்படி இச்சொல்லின் வழக்கமான பொருள் ‘தீப்பந்தம்’. வசனத்தின் உருவகத் தன்மையை விளக்கிச் சீராக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: בּוּז
  choice: இகழப்படுகிறது
  rationale: ‘இகழ்ச்சி’ என்ற பெயர்ச்சொல் கருத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் செயலற்ற வினையாகக் கொடுக்கிறது.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: நிம்மதியாக இருப்பவனின் எண்ணத்தில்
  rationale: עַשְׁתּוּת என்பதை ‘எண்ணம்/சிந்தனை’ என்றும் שַׁאֲנָן என்பதை கவலையின்றி நிம்மதியாக இருப்பவன் என்றும் எடுத்துக்கொள்கிறது.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: கால் சறுக்குபவர்களுக்காக
  rationale: מוֹעֲדֵי என்பதைக் ‘சறுக்குகிறவர்கள்’ என்ற பொருளிலும் רָגֶל என்பதைக் கூட்டுப் பொருளுடைய ஒருமை ‘கால்’ என்றும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: வசனத்தின் கடினமான உருவகத் தொடர்பு
  choice: ‘தீப்பந்தம்’ என்பதையும் ‘அது’ என்ற சுட்டையும் மாற்றாமல் வைத்தல்
  alternative: ‘துன்பம்/அழிவு’ என்று பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய மசோரெத்திய உரையின் நேரடி சொற்பொருளையும் அதன் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது; யோபின் நோக்கத்தை மொழிபெயர்ப்பிலேயே ஒரே விளக்கமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified, சுருக்கமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணை அடிகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; உருவகத்தின் தெளிவின்மை திட்டமிட்டு காக்கப்பட்டுள்ளது.
