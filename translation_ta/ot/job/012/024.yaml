source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: ta
  text: அவர் தேசத்து மக்களின் தலைவர்களின் புரிந்துகொள்ளும் திறனை அகற்றி,[a] வழியில்லாத பாழ்வெளியில் அவர்களை அலையச் செய்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேசத்து மக்களின் தலைவர்கள்’ என்பதற்கு மாற்றாக, ‘பூமியின் மக்களின் தலைவர்கள்’ என்றும் மொழிபெயர்க்கலாம். ‘புரிந்துகொள்ளும் திறன்’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘இதயம்’ என்று பொருள்படும்; இங்கு அது அறிவையும் தீர்மானத் திறனையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘பாழ்வெளியில்—வழி இல்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: அகற்றி
  rationale: הסיר என்பதன் காரணவினைப் பொருளான ‘அகற்றுதல், எடுத்துப்போடுதல்’ என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அடுத்த வினையுடன் இணைந்து தமிழில் சரளமாக அமைகிறது.
- source_word: לֵב
  choice: புரிந்துகொள்ளும் திறனை
  rationale: நேரடிப் பொருள் ‘இதயம்’ என்றாலும், இங்கு לֵב சிந்தனை, பகுத்தறிவு, தீர்மானத் திறன் ஆகிய உள்ளார்ந்த அறிவாற்றலைக் குறிக்கிறது. உணர்ச்சியை மட்டும் குறிக்கும் விதமாகத் தவறாகப் புரிந்துகொள்ளப்படாமல் இருக்க செயல்பாட்டுப் பொருள் தரப்பட்டது.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: தேசத்து மக்களின் தலைவர்களின்
  rationale: רָאשֵׁי என்பது சொல்லுக்கு சொல் ‘தலைகள்’ என்றாலும், இங்கு மக்களை வழிநடத்துவோரைக் குறிக்கும் மரபுத்தொடர். הָאָרֶץ என்பதற்கு ‘தேசம்’ அல்லது ‘பூமி’ என இரு வாய்ப்புகள் உள்ளன; உடனடியான அரசியல்-சமூகச் சூழலுக்கு ‘தேசம்’ இயல்பானது, மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּתְעֵם
  choice: அவர்களை அலையச் செய்கிறார்
  rationale: תעה என்பதன் ‘வழிதவறி அலைதல்’ என்ற உருவகத்தையும், Hiphil வடிவின் காரணவினைத் தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּתֹהוּ
  choice: பாழ்வெளியில்
  rationale: תֹהוּ குறிக்கும் வெறுமை, பாழ்மை, ஒழுங்கற்ற வெட்டவெளி ஆகிய கருத்துகளில், இச்சூழலின் திசையற்ற அலைச்சல் உருவகத்திற்கு ‘பாழ்வெளி’ இயல்பாகப் பொருந்துகிறது.
- source_word: לֹא דָרֶךְ
  choice: வழியில்லாத
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘வழி இல்லாத’ என்பதை இயல்பான தமிழ் அடைமொழித் தொடராகத் தந்து, பாதையற்ற இடம் என்ற படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வினைகளில் வெளிப்படையாகச் சொல்லப்படாத எழுவாய்
  choice: முந்தைய சூழலிலிருந்து எழுவாயை ‘அவர்’ என்று வெளிப்படுத்தி, கடவுளின் செயலைக் குறித்தல்
  alternative: எழுவாயைச் சொல்லாமல் வினை வடிவங்களால் மட்டும் உணர்த்துதல்
  rationale: யோபு 12-ன் சூழலில் செய்பவர் கடவுள் என்பது தெளிவு. தமிழில் வசனம் தனியாகவும் தெளிவாக இருக்க ‘அவர்’ சேர்க்கப்பட்டுள்ளது; இதனால் உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதயம்’ என்ற நேரடி வடிவம் இன்றைய தமிழில் உணர்ச்சியை முதன்மையாக உணர்த்தக்கூடும் என்பதால் சூழற்பொருள் பயன்படுத்தப்பட்டது. தேசம்/பூமி என்ற மெய்யான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
