base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: ta
  text: அவர் இருளிலிருந்து ஆழமானவற்றை வெளிப்படுத்துகிறார்; மரண நிழலை[a] வெளிச்சத்திற்குக் கொண்டுவருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது “காரிருளை” அல்லது “மரண இருளை” (எபிரெயம்: צַלְמָוֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: வெளிப்படுத்துகிறார்
  rationale: גלה என்பதன் பங்கேற்புவடிவம் மறைந்திருப்பதைத் திறந்து காட்டுதல் அல்லது அறியச்செய்தல் என்ற பொருளைக் கொண்டது. நிகழ்காலத் தொடர்ச்சியையும் இயல்பான தமிழையும் இத்தேர்வு தருகிறது.
- source_word: עֲמֻקוֹת
  choice: ஆழமானவற்றை
  rationale: பெண்பால் பன்மை உரிச்சொல் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. இடவியல் ‘ஆழங்கள்’ என்றும் மறைவான அல்லது ஆழ்ந்த காரியங்கள் என்றும் கொள்ளக்கூடிய விரிவை இத்தேர்வு தக்கவைக்கிறது.
- source_word: מִנִּי חֹשֶׁךְ
  choice: இருளிலிருந்து
  rationale: மறைந்திருந்தவை இருளிலிருந்து வெளிப்படுகின்ற மூலத்தையும் இயக்கப் படிமத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֹּצֵא
  choice: கொண்டுவருகிறார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்கிறார்’ என்ற காரணவினைப் பொருளுடையது. இலக்கைச் சுட்டும் அடுத்த சொற்றொடருடன் ‘கொண்டுவருகிறார்’ தெளிவாக இணைகிறது.
- source_word: לָאוֹר
  choice: வெளிச்சத்திற்கு
  rationale: ஒளியை நோக்கிய இயக்கத்தைச் சுட்டுகிறது. ‘வெளிச்சத்திற்குக் கொண்டுவருகிறார்’ என்பது மூலத்தின் இயக்கத்தையும் தமிழின் இயல்பையும் பேணுகிறது.
- source_word: צַלְמָוֶת
  choice: மரண நிழல்
  rationale: மரபான கூட்டுச்சொல் விளக்கத்தைப் பேணுவதோடு கவிதையின் தீவிரத்தையும் தருகிறது. ‘காரிருள்’ அல்லது ‘மரண இருள்’ என்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பதிவு செய்யப்படுகின்றன.
theological_decisions:
- issue: צַלְמָוֶת என்பதன் பொருள்
  choice: மரண நிழல்
  alternative: காரிருள் அல்லது மரண இருள்
  rationale: இது முதன்மையாகச் சொற்பொருள் மற்றும் கவிதைநடை சார்ந்த தெளிவின்மை. மரபான ‘மரண நிழல்’ மொழிபெயர்ப்பு எபிரெயச் சொல்லின் அமைப்பையும் தீவிரமான படிமத்தையும் காக்கிறது; மிக ஆழ்ந்த இருள் என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இணையான இரு கவிதை அடிகளும், இருள்–வெளிச்சம் எதிர்மறைப் படிமமும், மூலத்தில் உள்ள சொற்பொருள் தெளிவின்மையும் பேணப்பட்டுள்ளன.
