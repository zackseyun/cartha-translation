source:
  edition: WLC
  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: ta
  text: நம்பிக்கைக்குரியவர்களிடமிருந்து பேசும் திறனை அவர் அகற்றுகிறார்[a]; மூத்தவர்களிடமிருந்து பகுத்தறிவை எடுத்துக்கொள்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கைக்குரியவர்களிடமிருந்து உதட்டை அவர் அகற்றுகிறார்.” ‘உதடு’ என்பது இங்கு பேச்சை அல்லது சொல்வன்மையை ஆகுபெயராகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பகுத்தறிவு’ என்பதற்குப் பதிலாக “தீர்மானிக்கும் திறன்,” “விவேகம்,” அல்லது “புரிந்துணர்வு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: அகற்றுகிறார்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை இல்லாமற்போகச் செய்வதைக் குறிக்கிறது. ‘அகற்றுகிறார்’ என்பது அந்தக் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂפָה
  choice: பேச்சாற்றல்
  rationale: இதன் நேரடிப் பொருள் ‘உதடு.’ இங்கு அது ஆகுபெயராகப் பேசும் திறனை அல்லது சொல்வன்மையைக் குறிக்கிறது; ‘பேச்சாற்றல்’ அந்தச் சூழற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְנֶאֱמָנִים
  choice: நம்பிக்கைக்குரியவர்களிடமிருந்து
  rationale: נֶאֱמָנִים என்பது உண்மையுள்ளவர்கள், நம்பத்தகுந்தவர்கள் அல்லது பிறரின் நம்பிக்கையைப் பெற்றவர்கள் எனப் பொருள்படலாம். இங்கு ‘நம்பிக்கைக்குரியவர்கள்’ என்பதால் அந்தப் பொருள் வேறுபாடுகள் தேவையின்றிக் குறுக்கப்படாமல் நிற்கின்றன.
- source_word: טַעַם
  choice: பகுத்தறிவு
  rationale: இதன் அடிப்படைப் பொருள் ‘சுவை’; உருவகமாக இது விவேகம், மதிப்பீட்டுத் திறன் அல்லது புரிந்துணர்வைக் குறிக்கிறது. ஞான இலக்கியச் சூழலில் ‘பகுத்தறிவு’ இயல்பான தேர்வு.
- source_word: זְקֵנִים
  choice: மூத்தவர்கள்
  rationale: இந்தச் சொல் வயதானவர்களையும் சமூகத்தில் அனுபவமும் மதிப்பும் பெற்ற மூப்பர்களையும் குறிக்கலாம். ‘மூத்தவர்கள்’ என்பது வயது மற்றும் அனுபவம் ஆகிய இரண்டையும் தாங்குகிறது; குறிப்பிட்ட சமயப் பதவியைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: יִקָּח
  choice: பறித்துக்கொள்கிறார்
  rationale: לקח என்பதன் பொதுப் பொருள் ‘எடுத்துக்கொள்.’ இணைநிலை அமைப்பில் இது ஒருவரிடம் இருந்ததை நீக்குவதைச் சொல்வதால், ‘பறித்துக்கொள்கிறார்’ அந்த வலிமையான இழப்புணர்வைத் தருகிறது.
theological_decisions:
- issue: வினைச்செயலின் எழுவாய்
  choice: ‘அவர்’ என்று வைத்து, சூழலில் தேவனைக் குறிக்க அனுமதித்தல்
  alternative: ‘தேவன்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரையில் இந்த வசனத்துக்குள் பெயர்ச்சொல் எழுவாய் மீண்டும் கூறப்படவில்லை; முந்தைய சூழலிலிருந்து அது புரிகிறது. ‘அவர்’ என்பது மூலத்தின் தொடர்ச்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஞான இலக்கியத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இரு அரையடிகளின் இணை அமைப்பும், ‘அகற்றுகிறார் / பறித்துக்கொள்கிறார்’ என்ற இழப்பு சார்ந்த இயக்கமும் பாதுகாக்கப்பட்டுள்ளன. ‘மூப்பர்கள்’ என்பது குறிப்பிட்ட சமயப் பதவியாகப் புரிந்துகொள்ளப்படக் கூடுமாதலால், வயதும் அனுபவமும் இரண்டையும் குறிக்கும் ‘மூத்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
