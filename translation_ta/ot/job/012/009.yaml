- from: இவை அனைத்திலும் எது அறியாது—இதை யாவே[a]யின் கை செய்தது என்று?
  to: இவை அனைத்திலும், யாவேயின் கை இதைச் செய்தது என்று அறியாதது எது?[a]
  rationale: The revision preserves every principal source feature while recasting the question in idiomatic modern Tamil. ‘இதைச்’ supplies the normal Tamil euphonic linker before ‘செய்தது’; the singular demonstrative remains intact. The footnote anchor is retained after the sentence, attached to ‘யாவே’ by reference.
