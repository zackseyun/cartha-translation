id: JOB.12.9
reference: Job 12:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: ta
  text: இவை அனைத்திலும், யாவேயின் கை இதைச் செய்தது என்று அறியாதது எது?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); மரபாக “கர்த்தர்” அல்லது “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: எது
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட விலங்குகள், பறவைகள், பூமி, மீன்கள் ஆகியவற்றில் ஒன்றைக் குறிக்கும் வினாப்பெயராகத் தமிழில் இயல்பாக ‘எது’ வருகிறது; எபிரெயச் சொல்லின் வினாவும் சொல்லாட்சியின் உயிர்ப்பும் காக்கப்படுகின்றன.
- source_word: לֹא יָדַע
  choice: அறியாது
  rationale: எதிர்மறை வினாவாக அமைந்துள்ள எபிரெயச் சொற்றொடரை, பொதுவாக எல்லாம் அறிந்திருக்கின்றன என்ற கருத்தை உணர்த்தும் இயல்பான தமிழ் நிகழ்கால வடிவில் தருகிறது.
- source_word: בְּ/כָל אֵלֶּה
  choice: இவை அனைத்திலும்
  rationale: בְּ இங்கு தொகுதியினுள் ஒன்றைச் சுட்டும் பொருளில் உள்ளது. ‘இவை அனைத்திலும்’ என்பது ‘இவற்றுள்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי
  choice: என்று
  rationale: அறியப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் மேற்கோள்/உள்ளடக்க இணைப்பான ‘என்று’ பொருத்தமானது.
- source_word: יַד
  choice: கை
  rationale: இறைவனுடைய செயலாற்றலையும் ஆற்றலையும் குறிக்கும் உருவகத்தை விளக்கிச் சுருக்காமல், மூலத்தின் மனிதவுருவச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עָשְׂתָה
  choice: செய்தது
  rationale: עשה என்பதன் பரந்த ‘செய்’ பொருளையும், நிறைவேறிய செயலைக் குறிக்கும் எபிரெய நிறைவுவடிவையும் நேரடியாகத் தருகிறது.
- source_word: זֹּאת
  choice: இதை
  rationale: மூலத்தில் உள்ள ஒருமைச் சுட்டுப்பெயரைப் பாதுகாத்து, விவாதிக்கப்படும் முழு நிகழ்வையும் கூட்டாகச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூல எபிரெயம் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகக் கொண்டுள்ளது. ஆகவே பெயரை ஒலிபெயர்த்து, மரபுவழிப் பட்டத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. வலியுறுத்தும் எதிர்மறை வினாவைத் தெளிவாக்க நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ‘கை’ உருவகமும் ‘இதை’ என்ற ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
