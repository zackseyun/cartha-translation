revisions:
- from: இதோ[a], அவர் இடித்துப்போட்டால், அதை மீண்டும் கட்ட முடியாது; அவர் ஒரு மனிதனை அடைத்துவிட்டால்[b], அதைத் திறக்க முடியாது.
  to: இதோ[a], அவர் இடித்துப்போட்டால், அதை மீண்டும் கட்ட முடியாது; அவர் ஒரு மனிதனை அடைத்தால்[b], திறக்க முடியாது.
  rationale: The revision removes the problematic object pronoun from the final clause, preserving the Hebrew’s implicit object and the concrete confinement image. It also changes “அடைத்துவிட்டால்” to “அடைத்தால்” for closer verbal aspect and cleaner parallelism. The remaining wording and both footnote anchors are retained.
  reviewer_model: gpt-5.6-terra
