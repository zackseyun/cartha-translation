source:
  edition: WLC
  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: ta
  text: இதோ[a], அவர் இடித்துப்போட்டால், அதை மீண்டும் கட்ட முடியாது; அவர் ஒரு மனிதனை அடைத்தால்[b], திறக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெய்யாகவே” அல்லது “பார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு மனிதனை உள்ளே அடைத்தால்” அல்லது “ஒரு மனிதனைக் கட்டுப்படுத்தி வைத்தால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றை வலியுறுத்தும் துகளின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் தருகிறது; ‘மெய்யாகவே’ என்பதும் சாத்தியம்.
- source_word: יַהֲרוֹס
  choice: இடித்துப்போட்டால்
  rationale: הרס என்பதன் கட்டுமானத்தை இடித்தல் அல்லது தகர்த்தல் என்ற பொருளையும், அடுத்து வரும் ‘மீண்டும் கட்ட’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: וְלֹא יִבָּנֶה
  choice: அதை மீண்டும் கட்ட முடியாது
  rationale: நிஃபால் வடிவின் செயல்பாட்டு நிலையை வெளிப்படுத்துவதுடன், தெய்வீகச் செயலின் மாற்றமுடியாத விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: ஒரு மனிதனை அடைத்துவிட்டால்
  rationale: סגר ... על איש என்பதிலுள்ள ஒருவரை அடைத்து வைக்கும் நேரடியான படிமத்தைப் பாதுகாக்கிறது; ‘சிறையில் அடைத்தால்’ என்று நிறுவனரீதியான சிறைத்தண்டனையைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: וְלֹא יִפָּתֵחַ
  choice: அதைத் திறக்க முடியாது
  rationale: פתח என்பதன் நிஃபால் வடிவிலுள்ள ‘திறக்கப்படுதல்’ என்ற படிமத்தைக் காத்து, முதல் அரையடியின் ‘மீண்டும் கட்ட முடியாது’ என்பதற்கு இணையான அமைப்பை வழங்குகிறது.
theological_decisions:
- issue: தெய்வீக எழுவாயின் குறிப்பு
  choice: அவர்
  alternative: தேவன் / ஆண்டவர்
  rationale: எபிரெய வசனத்தில் வெளிப்படையான தெய்வீகப் பெயர் இல்லாமல் மூன்றாம் நபர் ஒருமை வினைகள் மட்டுமே உள்ளன. சூழலில் குறிக்கப்படுபவர் தேவன் என்றாலும், வசனத்தில் இல்லாத பட்டப்பெயரைச் சேர்க்காமல் ‘அவர்’ என்று மொழிபெயர்ப்பது மூலத்தின் வடிவைப் பாதுகாக்கிறது.
- issue: விளைவின் மாற்றமுடியாமை
  choice: முடியாது
  alternative: மீண்டும் கட்டப்படாது / திறக்கப்படாது
  rationale: எபிரெயத்தில் மறுப்புடன் வரும் நிறைவுறாத வினை வடிவங்கள் சொற்சொல்லாக எதிர்காலச் செயலின்மையைக் குறிக்கலாம்; இச்சூழலில் அவர் செய்ததை யாராலும் மாற்ற இயலாது என்ற ஆற்றலை ‘முடியாது’ இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கட்டுமானம் மற்றும் அடைப்பு ஆகிய இணை உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. ஆண்பால் ஒருமையான אִישׁ என்பதற்கு ‘ஒரு மனிதன்’ பயன்படுத்தப்பட்டுள்ளது.
