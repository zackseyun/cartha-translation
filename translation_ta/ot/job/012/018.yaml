  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: ta
  text: 'அவர் அரசர்களின் கட்டுகளை[a] அவிழ்க்கிறார்;

    அவர்களுடைய இடுப்பில் ஒரு கச்சையைக் கட்டுகிறார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசர்களுக்குரிய கண்டிப்பை.” எபிரெயப் பெயர்ச்சொல் ‘கண்டிப்பு/ஒழுக்கப்படுத்துதல்’ அல்லது ‘கட்டு/தளை’ என்று பொருள்படலாம்; ‘அவிழ்க்கிறார்’ என்பதுடனும் அடுத்த அடியின் ‘கட்டுகிறார்’ என்பதுடனும் ‘கட்டுகள்’ நன்கு பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த உருவகம் அரசர்கள் தாழ்த்தப்படுவதையோ அடக்கப்படுவதையோ குறிக்கலாம். எனினும், அவர்களைச் செயலுக்கு ஆயத்தப்படுத்தும்படி கச்சைகட்டுவதாகவும் இதைப் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: கட்டுகள்
  rationale: இந்தப் பெயர்ச்சொல் ‘கண்டிப்பு/ஒழுக்கப்படுத்துதல்’ என்றும் ‘கட்டு/தளை’ என்றும் பொருள்படலாம். பின்வரும் ‘கட்டுகிறார்’ என்பதற்கு எதிரிணையாக வரும் ‘அவிழ்க்கிறார்’ என்ற வினையுடன், உருவகத்தைத் தெளிவாக வைத்திருக்கும் ‘கட்டுகள்’ இங்கு பொருத்தமானது.
- source_word: פִּתֵּחַ
  choice: அவிழ்க்கிறார்
  rationale: அடிப்படைப் பொருள் ‘திறத்தல்’ அல்லது ‘தளர்த்துதல்.’ கட்டுகளுடன் சேரும்போது ‘அவிழ்த்தல்’ இயல்பான தமிழாகவும், மூலத்தின் உடல்சார் உருவகத்தைப் பேணுவதாகவும் உள்ளது.
- source_word: מְלָכִים
  choice: அரசர்கள்
  rationale: எபிரெயச் சொல்லின் வழக்கமான நேர்ப்பொருள் ‘அரசர்கள்’; பொதுவான ‘ஆட்சியாளர்கள்’ என்று விரிவுபடுத்தப்படவில்லை.
- source_word: וַיֶּאְסֹר
  choice: கட்டுகிறார்
  rationale: இந்த வினை ‘கட்டுதல்/பிணைத்தல்’ என்று பொருள்படும். முதல் அடியின் ‘அவிழ்க்கிறார்’ என்பதுடன் உள்ள எதிர்மாற்றை இது நேரடியாகப் பேணுகிறது.
- source_word: אֵזוֹר
  choice: ஒரு கச்சை
  rationale: இடுப்பைச் சுற்றி அணியும் பட்டை அல்லது கச்சையை இச்சொல் குறிக்கிறது. ‘கச்சை’ பண்டைய உடைச்சூழலுக்கு இயல்பான, அதேவேளை அதன் நோக்கத்தை மிகையாக விளக்காத தமிழ்ச் சொல்.
- source_word: בְּמָתְנֵיהֶם
  choice: அவர்களுடைய இடுப்பில்
  rationale: இது இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது. ‘இடுப்பில்’ என்பது பழமையான சொல்வழக்கைத் தவிர்த்து, இடத்தைக் தெளிவாகக் காட்டும் நவீனத் தமிழ்.
theological_decisions:
- issue: அரசர்களின் நிலை தலைகீழாக்கப்படுவதைக் காட்டும் உருவகத்தின் பொருள்
  choice: தேவன் அரசர்களின் கட்டுகளை அவிழ்த்து, பின்னர் அவர்களுடைய இடுப்பில் கச்சையைக் கட்டுவதாக உள்ள எதிர்மாற்று உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: அவர் அரசர்களை விடுவித்து செயலுக்காகக் கச்சைகட்டுகிறார்; அல்லது அரசர்கள் பிறர்மீது செலுத்தும் அதிகாரத்தை நீக்கி அவர்களையே அடக்குகிறார்.
  rationale: எபிரெய உருவகம் சுருக்கமாகவும் பலவிதமாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. ‘அவிழ்க்கிறார்/கட்டுகிறார்’ என்ற எதிரிணை தேவனுடைய இறையாண்மையால் நிகழும் நிலைமாற்றைக் காட்டுகிறது; ஆனால் அது விடுதலையா, ஆயத்தப்படுத்துதலா, தாழ்த்தப்படுதலா என்பதை மொழிபெயர்ப்பு ஒரே விளக்கமாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவிழ்க்கிறார்/கட்டுகிறார்’ என்ற சொல்லிணை மூலத்தின் கவிதை எதிர்மாற்றைப் பேணுகிறது; தெளிவில்லாத உருவகப் பொருள் அடிக்குறிப்பில் திறந்தவாறே வைக்கப்பட்டுள்ளது.
