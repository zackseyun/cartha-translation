  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: ta
  text: அவர் பிரபுக்கள்மேல் இகழ்ச்சியைப் பொழிகிறார்; வலிமைமிக்கவர்களின்[a] இடைக்கச்சையை[b]த் தளர்த்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லவர்கள்” அல்லது “அதிகாரமுள்ளவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இடைக்கச்சையைத் தளர்த்துவது என்பது ஒருவரின் வலிமை, ஆயத்தநிலை அல்லது அதிகாரத்தை அகற்றுவதைக் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: பொழிகிறார்
  rationale: ‘ஊற்றுதல்/பொழிதல்’ என்ற உயிரோட்டமான உருவகத்தைத் தக்கவைத்து, இகழ்ச்சி ஒருவர்மேல் வரச் செய்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בּוּז
  choice: இகழ்ச்சி
  rationale: அவமதிப்பு அல்லது ஏளனம் என்ற பொருளைத் தருகிறது; சமூக நிலையில் உயர்ந்தவர்கள் பொதுவாகத் தாழ்த்தப்படுவதை இச்சொல் தெளிவாகக் காட்டுகிறது.
- source_word: נְדִיבִים
  choice: பிரபுக்கள்
  rationale: இங்கு தாராளமானவர்களைக் காட்டிலும் உயர்நிலையிலும் ஆட்சிச் செல்வாக்குடனும் இருப்பவர்களைக் குறிக்கிறது; ‘இளவரசர்கள்’ என்று முடியாட்சியை அளவுக்கு மீறிக் குறிப்பதையும் தவிர்க்கிறது.
- source_word: מְזִיחַ
  choice: இடைக்கச்சை
  rationale: உடலை இறுக்கிக் கட்டி வேலைக்கோ போருக்கோ ஆயத்தப்படுத்தும் இடுப்புப் பட்டை/கச்சை என்ற பண்டைய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֲפִיקִים
  choice: வலிமைமிக்கவர்கள்
  rationale: இந்த இணைவாக்கியத்தில் அதிகாரமும் ஆற்றலும் உடையவர்களைக் குறிக்கும் பொருள் பொருத்தமானது; சொல்லின் அரிய தன்மையை அடிக்குறிப்பில் மாற்றுப் பொருளுடன் சுட்டுகிறது.
- source_word: רִפָּה
  choice: தளர்த்துகிறார்
  rationale: ‘தளரச் செய்தல்’ என்ற நேரடிப் பொருளையும், ஆயத்தம் அல்லது ஆற்றலைக் குலைக்கும் உருவகத்தையும் ஒருசேரப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைவன் மனித உயர்நிலையையும் வலிமையையும் தலைகீழாக்கும் உருவகம்
  choice: ‘வலிமைமிக்கவர்களின் இடைக்கச்சையைத் தளர்த்துகிறார்’ என்ற திடமான உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘வலிமைமிக்கவர்களை ஆயுதமற்றவர்களாக்குகிறார்’ அல்லது ‘அவர்களின் வலிமையைப் பறிக்கிறார்’
  rationale: எபிரெய உரை அவமானப்படுத்துதலையும் வலுவிழக்கச் செய்தலையும் இடைக்கச்சை உருவகத்தின் வழியாகச் சொல்கிறது. அதை விளக்கவுரையாகச் சுருக்காமல் வைத்திருப்பது கவித்துவத்தையும், இராணுவம் மட்டுமல்லாத பரந்த பொருள் வாய்ப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதை இணைநிலையும் மூலத்தின் திடமான உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
