base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: ta
  text: அவர் தேசங்களைப் பெரிதாக்குகிறார்; அவற்றை அழிக்கிறார். தேசங்களை விரிவாக்குகிறார்; அவற்றை அகற்றிச் செல்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றை வழிநடத்துகிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பொதுவாக வழிநடத்துதலைக் குறிக்கிறது; இச்சூழலில் தேசங்களை வேறிடத்திற்குக் கொண்டு செல்வதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: பெரிதாக்குகிறார்
  rationale: שׂגא என்பதன் காரணவினைப் பொருளான ‘பெரிதாகச் செய், வளரச் செய்’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செழிப்பை மட்டும் குறிப்பதாகப் பொருளைச் சுருக்கவில்லை.
- source_word: לַגּוֹיִם
  choice: தேசங்களை
  rationale: இங்கு גּוֹיִם என்பது இஸ்ரவேலரல்லாதவர்களை மட்டும் அல்லாமல் அரசியல் மக்களினங்களையோ தேசங்களையோ பொதுவாகக் குறிக்கிறது.
- source_word: וַיְאַבְּדֵם
  choice: அவற்றை அழிக்கிறார்
  rationale: אבד என்பதன் இச்சூழலிலுள்ள காரணப் பொருளைச் சுருக்கமாகவும் முதல் கூற்றின் எதிர்மாற்றைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: שֹׁטֵחַ
  choice: தேசங்களை விரிவடையச் செய்கிறார்
  rationale: שטח என்பதிலுள்ள ‘பரப்புதல், விரிவாக்குதல்’ என்ற உருவகத்தை, தேசங்களின் நிலப்பரப்பு அல்லது செல்வாக்கு பெருகுவதாக இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וַיַּנְחֵם
  choice: அவற்றை வழிநடத்திச் செல்கிறார்
  rationale: נחה என்பதன் அடிப்படைப் பொருளான ‘வழிநடத்து’ என்பதையும் நகர்வையும் காக்கிறது. சூழலில் இது நன்மையான வழிகாட்டுதலை அவசியம் குறிக்காது; தேசங்களை வேறிடத்திற்கு நடத்திச் செல்வதையும் குறிக்கலாம்.
theological_decisions:
- issue: இரண்டாம் அடியின் தேசங்களுக்கான இயக்கம்
  choice: தேசங்களை விரிவடையச் செய்து, பின்னர் அவற்றை வழிநடத்திச் செல்கிற கடவுளின் ஆட்சியுரிமை என மொழிபெயர்க்கப்பட்டது.
  alternative: தேசங்களை விரிவடையச் செய்து அவற்றுக்கு நல்வழி காட்டுகிறார்; அல்லது அவற்றை அகற்றிச் செல்கிறார்.
  rationale: נחה இயல்பாக ‘வழிநடத்து’ என்று பொருள்படும்; ஆனால் அழிவு மற்றும் விரிவாக்கம் ஆகிய எதிர்மாற்றுகள் நிறைந்த இணைப்பில் அது நன்மையான வழிகாட்டுதலை மட்டும் கட்டாயப்படுத்தாது. ‘வழிநடத்திச் செல்கிறார்’ என்பது நகர்வையும் சூழலின் பதற்றத்தையும் காக்கிறது; அடிக்குறிப்பு மாற்றுச் சாத்தியத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதை இணைப்பையும் எதிர்மாற்றையும் காக்கும் கண்ணியமான நடை. ‘தேசங்கள்’ அரசியல் மக்களினங்களைப் பொதுவாகக் குறிக்கிறது; ‘வழிநடத்திச் செல்கிறார்’ என்பது அளவுக்கு மீறிய நல்வழிகாட்டுதல் சார்ந்த பொருளைத் தவிர்க்கிறது.
