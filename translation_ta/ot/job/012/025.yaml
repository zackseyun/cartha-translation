  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: ta
  text: அவர்கள் இருளில், வெளிச்சமின்றி, தடவித் தேடுகிறார்கள்; அவர் அவர்களைக் குடிபோதையில் இருப்பவனைப்போல் தள்ளாடச் செய்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களை அலையச் செய்கிறார்” அல்லது “வழிதவறச் செய்கிறார்.” எபிரெய வினை அலைதல் அல்லது வழிதவறுதலைக் குறிக்கலாம்; குடிபோதையில் இருப்பவனுடனான ஒப்பீடு இங்கு “தள்ளாடச் செய்கிறார்” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: தடவித் தேடுகிறார்கள்
  rationale: פיעל வடிவம், பார்வையின்றித் தொடுவதன் மூலம் வழி தேடுவதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் இந்தக் காட்சியை ‘தடவித் தேடுகிறார்கள்’ தெளிவாகக் கொண்டுவருகிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: சொல்லின் நேரான பொருளைத் தருகிறது; இங்கு உள்ள மெய்யான மற்றும் உருவகச் சாத்தியங்களை இரண்டையும் திறந்துவைக்கிறது.
- source_word: וְלֹא אוֹר
  choice: வெளிச்சமில்லாத
  rationale: சொல்லுக்கு சொல் ‘வெளிச்சம் இல்லாமல்’ என்பதாகும். ‘வெளிச்சமில்லாத இருளில்’ என்பது தமிழில் இயல்பாகவும் எபிரெயச் சொற்றொடரின் அழுத்தத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: וַיַּתְעֵם
  choice: அவர் அவர்களைத் தள்ளாடச் செய்கிறார்
  rationale: תעה என்பதன் அடிப்படைப் பொருள் அலைதல் அல்லது வழிதவறுதல். குடிபோதையிலுள்ள ஒருவருடனான ஒப்பீட்டினால், இங்கு உண்டாக்கப்படும் நிலைகுலைவை ‘தள்ளாடச் செய்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: -ם (suffix in וַיַּתְעֵם)
  choice: அவர்களை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை வினைப்பொருள் பின்னொட்டை வெளிப்படையாகக் காட்டுகிறது.
- source_word: כַּשִּׁכּוֹר
  choice: குடிபோதையில் இருப்பவனைப்போல்
  rationale: குடித்துப் போதையுற்ற ஒருவரைக் குறிக்கும் ஒருமைச் சொல்லை, இழிவான பேச்சுவழக்கைத் தவிர்த்து இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: וַיַּתְעֵם என்பதன் மறைந்துள்ள எழுவாய்
  choice: அவர் அவர்களைத் தள்ளாடச் செய்கிறார்
  alternative: அவர்கள் தள்ளாடுகிறார்கள்
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமை எழுவாயையும் பன்மை வினைப்பொருளையும் காட்டுகிறது. முந்தைய சூழலில் இந்த ‘அவர்’ கடவுளைக் குறிக்கிறது. பெயரை விளக்கமாகச் சேர்க்காமல், இலக்கணத்தையும் உரையிலுள்ள இறையியல் அழுத்தத்தையும் ‘அவர்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இருள், தடவித் தேடுதல், குடிபோதையால் தள்ளாடுதல் ஆகிய மூலப்படிமங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘அவர்’ என்பதன் குறிப்பு சூழலிலிருந்து புரியுமாறு விடப்பட்டுள்ளது.
