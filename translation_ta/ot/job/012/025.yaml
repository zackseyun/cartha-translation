  naturalness: ‘இருளில், வெளிச்சமின்றி’ is natural modern standard Tamil while retaining the deliberately emphatic pairing in Hebrew. ‘தடவித் தேடுகிறார்கள்’ and ‘தள்ளாடச் செய்கிறார்’ clearly convey the physical imagery.
  terminology: ‘குடிபோதையில் இருப்பவனைப்போல்’ is dignified contemporary Tamil and avoids colloquial or stigmatizing wording. The implicit subject remains ‘அவர்,’ without importing an explicit name not present in the verse.
