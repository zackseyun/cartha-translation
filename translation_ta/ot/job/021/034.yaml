  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: ta
  text: அப்படியிருக்க, வெறுமையைக் கொண்டு[a] நீங்கள் எப்படி எனக்கு ஆறுதல் அளிக்க முடியும்? உங்கள் பதில்களில் எஞ்சியிருப்பதோ துரோகம் மட்டுமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் எப்படி வீணாக எனக்கு ஆறுதல் அளிக்க முடியும்? உங்கள் பதில்கள் துரோகமாகவே எஞ்சுகின்றன?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: அப்படியிருக்க, எப்படி
  rationale: கேள்விக்குரிய ‘எப்படி’ என்பதுடன், வாவ் இணைப்பின் சூழல்சார் தொடர்ச்சியை ‘அப்படியிருக்க’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּנַחֲמוּנִי
  choice: நீங்கள் எப்படி எனக்கு ஆறுதல் அளிக்க முடியும்
  rationale: נחם என்பதன் பியேல் வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் ‘எனக்கு ஆறுதல் அளித்தல்’ என்று பொருள்படும்; வினாவிலுள்ள சவாலை ‘முடியும்’ வெளிப்படுத்துகிறது.
- source_word: הָבֶל
  choice: வெறுமையைக் கொண்டு
  rationale: הבל என்பது வெறுமை, பயனின்மை ஆகிய பொருள்களைக் கொண்ட பெயர்ச்சொல். நண்பர்களின் ஆறுதலில் உள்ளடக்கமே இல்லை என்ற குற்றச்சாட்டை, வெறும் முயற்சி தோல்வியடைந்தது என்று மாற்றாமல் இத்தேர்வு காக்கிறது.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: உங்கள் பதில்களில்
  rationale: תשובה இங்கு நண்பர்களின் உரைகளில் தரப்பட்ட பதில்களைக் குறிக்கிறது. அடுத்த எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் வழங்க இடவெற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: נִשְׁאַר
  choice: எஞ்சியிருப்பது
  rationale: שׁאר என்பதன் நிஃபால் வடிவம் ‘எஞ்சியிருத்தல்’ அல்லது ‘மீதியாயிருத்தல்’ என்று பொருள்படும்.
- source_word: מָעַל
  choice: நம்பிக்கைத் துரோகம் மட்டுமே
  rationale: מעל என்பது வெறும் தவறான தகவலை அல்ல, உண்மைத்தவறுதல், நம்பிக்கை மீறல் அல்லது துரோகம் ஆகியவற்றைக் குறிக்கிறது. ‘மட்டுமே’ என்பது பதில்களின் இறுதி தன்மை இதுதான் என்ற வாக்கியத்தின் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
