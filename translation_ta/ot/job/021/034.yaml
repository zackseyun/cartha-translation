translation_notes:
  register: நவீனத் தரத் தமிழில், யோபுவின் நேரடியான கண்டனத் தொனியையும் கண்ணியமான மொழிநடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. הבל என்பதன் பெயர்ச்சொல் வலிமையும் מעל என்பதிலுள்ள நம்பிக்கை மீறலின் தீவிரமும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
