  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: ta
  text: “சர்வவல்லவர் எம்மாத்திரம், நாம் அவருக்குச் சேவை செய்ய? அவரிடம் மன்றாடினால் நமக்கு என்ன பயன்?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: சர்வவல்லவர் யார்
  rationale: מַה இங்கு அடையாளத்தை அறிய விரும்பும் நேரடியான கேள்வியல்ல; அவரைச் சேவிப்பதற்கான காரணத்தையும் மதிப்பையும் இகழ்ச்சியுடன் கேள்விக்குட்படுத்துகிறது. இயல்பான தமிழில் ‘யார்’ அந்த சொல்லாட்சியின் வலிமையைத் தருகிறது; שַׁדַּי என்ற தெய்வீகப் பட்டம் ‘சர்வவல்லவர்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: நாம் அவருக்குச் சேவை செய்வதற்கு
  rationale: עבד என்பதன் கடவுளை நோக்கிய விரிவான பொருள் வழிபாட்டில் மட்டும் சுருங்காமல் சேவை, கீழ்ப்படிதல், பற்றுறுதி ஆகியவற்றை உள்ளடக்குகிறது. கேள்வியின் நோக்கத் தொடர்பைத் தமிழின் ‘செய்வதற்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמַה נּוֹעִיל
  choice: நமக்கு என்ன பயன்
  rationale: יעל வினைச்சொல் பயனளித்தல் அல்லது இலாபம் தருதல் என்ற பொருளுடையது. ‘நமக்கு என்ன பயன்’ என்பது பேசுவோரின் பயன்நோக்குக் கேள்வியைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: அவரிடம் மன்றாடுவதால்
  rationale: פגע + ב இச்சூழலில் ஒருவரிடம் வேண்டுதல் அல்லது மன்றாட்டுச் செய்தல் என்பதைக் குறிக்கிறது. כִּי-யை தமிழில் காரண/நிபந்தனைச் செயலின் விளைவைக் காட்டும் ‘-வதால்’ அமைப்பில் வழங்குவது இரண்டாம் கேள்வியை இயல்பாக்குகிறது.
theological_decisions:
- issue: שַׁדַּי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: இது தனிப்பெயராக மட்டும் அல்லாமல் தெய்வீகப் பட்டமாகச் செயல்படுகிறது. பொருளை வாசகருக்குத் தெளிவாகக் கொண்டுசெல்ல ‘சர்வவல்லவர்’ என மொழிபெயர்க்கப்பட்டது.
- issue: மַה שַׁדַּי என்ற இகழ்ச்சியான வினாவின் வடிவம்
  choice: சர்வவல்லவர் யார்
  alternative: சர்வவல்லவர் என்ன
  rationale: எபிரெய מַה வடிவை இயந்திரமாக ‘என்ன’ என்று தராமல், ஒருவரைக் குறித்த தமிழின் இயல்பான வினாவாக ‘யார்’ பயன்படுத்தப்படுகிறது. இருப்பினும் இது அவரது அடையாளத்தைப் பற்றிய கேள்வியல்ல; அவரைச் சேவிப்பதன் மதிப்பை மறுக்கும் சூழல்சார் வினா.
translation_notes:
  register: நவீன நிலையான தமிழில், யோபு மேற்கோளிடும் பொல்லாதவர்களின் இகழ்ச்சியும் பயன்நோக்குப் பார்வையும் தெளிவாகத் தோன்றும் வகையில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டது. வசனத்துக்கு விளக்கக் குறிப்புகள் தேவையில்லை; ஆகவே முதன்மை உரையில் அடிக்குறி குறியீடு சேர்க்கப்படவில்லை.
