source:
  edition: WLC
  text: כַּ/מָּ֤ה נֵר רְשָׁ֘עִ֤ים יִדְעָ֗ךְ וְ/יָבֹ֣א עָלֵ֣י/מוֹ אֵידָ֑/ם חֲ֝בָלִ֗ים יְחַלֵּ֥ק בְּ/אַפּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: ta
  text: 'தீயவர்களின் விளக்கு எத்தனை முறை அணைந்துபோகிறது?[a][b]

    அவர்களுடைய பேரழிவு அவர்கள்மேல் எத்தனை முறை வருகிறது?

    அவர் தமது கோபத்தில் வேதனைகளை எத்தனை முறை அவர்களுக்குப் பங்கிட்டுக் கொடுக்கிறார்?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவர்களின் விளக்கு எத்தனை தடவை அணைக்கப்படுகிறது?” இது வெறும் எண்ணிக்கையைக் கேட்கும் கேள்வி அல்ல; தீயவர்கள் இவ்வாறு தவறாமல் தண்டிக்கப்படுகிறார்கள் என்ற கருத்தைச் சவாலிடும் சொல்லாட்சிக் கேள்வி.
    reason: lexical_alternative
  - marker: b
    text: “விளக்கு” என்பது ஒருவருடைய வாழ்க்கை, செழிப்பு அல்லது தொடரும் நல்வாய்ப்பைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: c
    text: “வேதனைகள்” என்பதற்குப் பதிலாக “வலிகள்” அல்லது “பிரசவ வேதனைகள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இத்தொடர்புடைய பல பொருள்களைக் கொள்ளக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: எத்தனை முறை
  rationale: இங்கு எண்ணிக்கையை மட்டும் கேட்காமல், இது உண்மையில் எவ்வளவு அடிக்கடி நிகழ்கிறது என்று சவால்விடும் சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது. ‘எத்தனை முறை’ என்பது அந்தத் தொனியை இயல்பாகக் காக்கிறது.
- source_word: נֵר
  choice: விளக்கு
  rationale: மூலச்சொல்லின் நேரடிப் படிமத்தைத் தக்கவைக்கிறது; இங்கு அது வாழ்க்கை, செழிப்பு அல்லது தொடரும் நல்வாய்ப்பைக் குறிக்கும் உருவகமாக உள்ளது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஞான இலக்கியச் சூழலில் குற்றமும் தீய நடத்தையும் உடையவர்களைக் குறிக்கும் இயல்பான, புரிந்துகொள்ள எளிய தமிழாக்கம்.
- source_word: יִדְעָךְ
  choice: அணைந்துபோகிறது
  rationale: விளக்கு ஒளியிழந்து அணைவதைத் துல்லியமாகக் குறிக்கிறது. யாரால் அணைக்கப்படுகிறது என்பதை மூலத்தைவிட வெளிப்படையாக்காமல் விடுகிறது.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: அவர்களுடைய பேரழிவு அவர்கள்மேல் வருகிறது
  rationale: אֵיד என்பதன் அழிவு, பேரிடர், கேடு ஆகிய கருத்துகளை ‘பேரழிவு’ தெளிவாக வெளிப்படுத்துகிறது; ‘அவர்கள்மேல் வருகிறது’ என்ற அமைப்பு மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: חֲבָלִים
  choice: வேதனைகள்
  rationale: இச்சொல் வேதனைகள், வலிகள், பிரசவ வேதனைகள் போன்ற தொடர்புடைய பொருள்களைக் கொள்ளலாம். தீர்ப்பின் துன்பங்களைச் சுட்டும் பரந்த பொருளில் ‘வேதனைகள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְחַלֵּק
  choice: பங்கிட்டுக் கொடுக்கிறார்
  rationale: பிரித்தளித்தல் அல்லது ஒதுக்கிக்கொடுத்தல் என்ற Piel வினையின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּאַפּוֹ
  choice: தமது கோபத்தில்
  rationale: אַף என்ற சொல்லின் இச்சூழலிலான ‘கோபம்’ என்ற பொருளை நேரடியாகத் தருகிறது. மரியாதை ஒருமை வடிவம் சூழலில் இறைவனைச் சுட்டுவதை இயல்பாகக் காட்டினாலும், பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְחַלֵּק בְּאַפּוֹ என்பதில் மறைந்துள்ள மூன்றாம் நபர் ஒருமை எழுவாயின் குறிப்பு
  choice: ‘அவர்’ என்று மட்டும் வைத்து, சூழலிலிருந்து இறைவனைக் குறிக்க அனுமதித்தல்
  alternative: ‘இறைவன்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்; அல்லது ஆளற்ற அமைப்பாக மொழிபெயர்த்தல்
  rationale: எபிரெய வினையில் எழுவாய் மறைந்துள்ளது. சூழல் இறைவனை வலுவாகச் சுட்டினாலும், இவ்வரியில் அவர் பெயரிடப்படவில்லை. ஆகவே மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்க ‘அவர்’ என்று மட்டுமே தரப்பட்டுள்ளது.
- issue: வசனத்தின் கேள்விகளின் சொல்லாட்சித் தன்மை
  choice: ஒவ்வொரு உறுப்பிலும் ‘எத்தனை முறை’ என்பதைத் தமிழில் வெளிப்படுத்தி, தீயவர்கள் வழக்கமாகத் தண்டிக்கப்படுகிறார்கள் என்ற கருத்தை யோபு சவாலிடுவதைத் தெளிவாக்குதல்
  alternative: முதல் கேள்வியில் மட்டும் ‘எத்தனை முறை’ வைத்து, பிற உறுப்புகளை நேரடியான கேள்விகளாக அமைத்தல்
  rationale: כַּמָּה என்பதன் தாக்கம் இணையான மூன்று உறுப்புகளுக்கும் பொருந்துகிறது. தமிழில் அதை மீண்டும் கூறுவது சொல்லாட்சிக் கேள்வியின் ஒருமைப்பாட்டையும் சவாலான தொனியையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைப்பையும் சொல்லாட்சிக் கேள்வியின் சவாலான தொனியையும் காக்கும் கண்ணியமான நடை. ‘விளக்கு’ என்ற எபிரெய உருவகம் அப்படியே வைக்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாகப் பெயரிடப்படாத இறை எழுவாய் ‘அவர்’ என மட்டும் தரப்பட்டுள்ளது.
