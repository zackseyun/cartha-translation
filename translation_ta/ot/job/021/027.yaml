source:
  edition: WLC
  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: ta
  text: இதோ, உங்கள் எண்ணங்களையும், எனக்குத் தீங்கிழைக்க நீங்கள் தீட்டும் சூழ்ச்சிகளையும் நான் அறிவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிராக நீங்கள் தீட்டும் சூழ்ச்சிகளையும்” அல்லது “எனக்கு எதிராக நீங்கள் வகுக்கும் வன்முறையான திட்டங்களையும்.” எபிரெய வினை வன்முறை செய்தல், ஒடுக்குதல் அல்லது அநியாயம் செய்தல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் இடைச்சொல்லின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: முற்றுவினை இங்கு தற்போது நிலவும் அறிவைச் சுட்டுவதால், இயல்பான தமிழ் நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: உங்கள் எண்ணங்கள்
  rationale: சொல் எண்ணங்கள், திட்டங்கள், நோக்கங்கள் ஆகிய பொருள்களைக் கொள்ளலாம்; ‘எண்ணங்கள்’ மூலச்சொல்லின் பரப்பைத் திறந்தவாறு வைக்கிறது.
- source_word: וּמְזִמּוֹת
  choice: சூழ்ச்சிகள்
  rationale: இச்சூழலில் திட்டமிட்ட பகைமையான நோக்கைக் காட்டும் இயல்பான தமிழ் சொல்.
- source_word: עָלַי
  choice: எனக்குத் தீங்கிழைக்க
  rationale: தொடர்ந்து வரும் வினையுடன் இணைந்து யோபுக்கு எதிரான செயலைக் குறிக்கிறது; தமிழில் நோக்கத்தொடராக இயல்பாக வழங்கப்பட்டது.
- source_word: תַּחְמֹסוּ
  choice: நீங்கள் தீட்டும்
  rationale: இலக்கண அமைப்பில் ‘சூழ்ச்சிகள்’ என்பதுடன் இணைத்து தமிழாக்கப்பட்டது; வன்முறை செய்தல், ஒடுக்குதல், அநியாயம் செய்தல் என்ற வினையின் தீங்கான வலிமை ‘தீங்கிழைக்க’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய மொழியின் இறுதித் தொடரிலுள்ள இலக்கண மற்றும் சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
