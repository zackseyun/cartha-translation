  yaml_path: translation/ot/job/021/010.yaml
  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: ta
  text: அவனுடைய காளையின் இனச்சேர்க்கை வீணாகப் போவதில்லை[a]. அவனுடைய பசு கன்றுபோடுகிறது; கருச்சிதைவு அடைவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தள்ளிவிடுவதில்லை” / “அது மலடாக்குவதில்லை.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் தெளிவற்றது. இணைவாக்கியத்தின் பொருளுக்கு ஏற்ப, காளையின் இனச்சேர்க்கை பலனற்றுப் போவதில்லை என்ற கருத்து முதன்மை உரையில் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: அவனுடைய காளை
  rationale: שׁוֹר என்பது மாட்டினத்தைக் குறிக்கும்; இனப்பெருக்கச் சூழலில் ஆண் இனப்பெருக்க மாடு குறிக்கப்படுவதால் ‘காளை’ துல்லியமானது.
- source_word: עִבַּר
  choice: இனச்சேர்க்கை செய்கிறது
  rationale: இங்கு עבר விலங்குகளின் இனப்பெருக்கத்தைச் சுட்டுகிறது. தமிழில் செயலை இயல்பாகவும் தெளிவாகவும் கூற ‘இனச்சேர்க்கை செய்கிறது’ என மொழிபெயர்க்கப்பட்டது; அதன் வெற்றிகரமான விளைவை அடுத்த வினைச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: וְלֹא יַגְעִל
  choice: அது வீண்போவதில்லை
  rationale: געל என்பதன் ஹிஃபில் வடிவம் இவ்விடத்தில் கடினமானது. இணைவாக்கிய அமைப்பின்படி காளையின் இனச்சேர்க்கை பலனற்றுப் போவதில்லை என்பதே பொருள்; ஆனால் எபிரெய வினையின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תְּפַלֵּט
  choice: கன்றுபோடுகிறது
  rationale: פלט என்பதன் பியேல் வடிவம் இங்கு குட்டியை ஈன்றெடுப்பதைக் குறிக்கிறது. பசுவுக்குரிய இயல்பான நவீனத் தமிழ் சொல் ‘கன்றுபோடுகிறது’.
- source_word: פָּרָתוֹ
  choice: அவனுடைய பசு
  rationale: פָּרָה என்பதற்கான இயல்பான தமிழ் இணை ‘பசு’; இளம் பெண் மாடு என்ற குறிப்பை மூலச்சொல் கட்டாயப்படுத்தவில்லை.
- source_word: וְלֹא תְשַׁכֵּל
  choice: அது கருச்சிதைவதில்லை
  rationale: שׁכל என்பதன் பியேல் வடிவம் குட்டியை இழத்தல் அல்லது பிள்ளையற்றுப் போதலைக் குறிக்கலாம். இப்பிறப்புச் சூழலில் ‘கருச்சிதைவதில்லை’ என்பது சுருக்கமான, இயல்பான பொருத்தம்.
