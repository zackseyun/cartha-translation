base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: ta
  text: பள்ளத்தாக்கின் மண்கட்டிகள் அவனுக்கு இனிமையாய் இருக்கும்[a]; எல்லா மனிதரும் அவனைப் பின்தொடர்வார்கள்[b][c]; அவனுக்கு முன்னால் இருப்பவர்களோ எண்ணிலடங்காதவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீரோடைப் படுகையின் மண்கட்டிகள் அவனுக்கு இதமாயிருக்கும்.” נחל என்பது பள்ளத்தாக்கு, குறுக்கு பள்ளத்தாக்கு, அல்லது பருவகால நீரோடைப் படுகையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “ஒவ்வொரு மனிதனும்”; இங்கு அது மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: 'இந்த வரி ஓர் இறுதி ஊர்வலத்தையோ, அல்லது மனிதர்கள் அனைவரும் மரணத்தை நோக்கிச் செல்லும் பொதுவான பயணத்தையோ சுட்டலாம்: எண்ணற்றோர் அவனுக்கு முன் இருக்கிறார்கள்; அனைவரும் அவனைப் பின்தொடர்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ לּוֹ
  choice: அவனுக்கு இனிமையாய் இருக்கும்
  rationale: מתק என்பதன் ‘இனிமை/மனதிற்கினிமை’ என்ற உருவகத்தைத் தக்கவைத்து, இறந்தவனுக்கு அடக்கநிலத்தின் மண் இதமாயிருப்பதைச் சுட்டுகிறது.
- source_word: רִגְבֵי נָחַל
  choice: பள்ளத்தாக்கின் மண்கட்டிகள்
  rationale: רֶגֶב என்பதன் காட்சிப்பூர்வமான ‘மண்கட்டி’ என்ற பொருளையும், נחל என்பதன் பள்ளத்தாக்கு/பள்ளம்/நீரோடைப் படுகை என்ற பொருள் வரம்பையும் இயன்றவரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל אָדָם
  choice: மனிதர் அனைவரும்
  rationale: אָדָם இங்கு தனிப்பட்ட ஆணை அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் கூட்டுப்பொருள் உடையது.
- source_word: וְאַחֲרָיו ... יִמְשׁוֹךְ
  choice: அவனுக்குப் பின்னால் செல்வார்கள்
  rationale: משך என்பதன் அடிப்படைப் பொருள் ‘இழு’ என்றாலும், இச்சூழலில் பின்னால் தொடர்தல் என்ற இடைமொழிப் பொருள் இயல்பானது; இறுதி ஊர்வலம் அல்லது மரணத்தை நோக்கிய மனிதகுலத்தின் பொதுப்பயணம் ஆகிய இரண்டுக்கும் இடமளிக்கிறது.
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  choice: அவனுக்கு முன்னால் சென்றவர்களோ எண்ணிலடங்காதவர்கள்
  rationale: ‘அவனுக்கு முன்னால்’ என்பதிலுள்ள இட/கால இருபொருளைத் தக்கவைத்து, אֵין מִסְפָּר என்ற மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: அடக்கம்/மரணம் சார்ந்த காட்சியின் பொருள்
  choice: இறுதி ஊர்வலத்தையும், அனைவரும் மரணத்தில் முன்னும் பின்னும் செல்கிறார்கள் என்ற விரிந்த பொருளையும் அனுமதிக்கும் வகையில் சொற்சித்திரம் பாதுகாக்கப்பட்டது.
  alternative: இதை இறுதி ஊர்வலத்தை மட்டும் குறிக்கும் வசனமாகவோ, மரணத்தின் உலகளாவிய தன்மையை மட்டும் கூறும் கருத்தாகவோ வெளிப்படையாக விளக்கலாம்.
  rationale: எபிரெயச் சொற்கள் இரு வாசிப்புகளுக்கும் இடமளிக்கின்றன. ஆகவே மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் திணிக்காமல் உண்மையான பொருள் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமான நடையில் வடிவமைக்கப்பட்டது. ‘மண்கட்டிகள்’ என்ற உறுதியான அடக்கக் காட்சி மற்றும் ‘இனிமை’ என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
