  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: கால் வடிவில் வரும் ענה உரையாடல் சூழலில் ‘பதில் அளித்தல்/மறுமொழி கூறுதல்’ எனப் பொருள்படும். அடுத்துள்ள ‘சொன்னது’ என்பதுடன் இயல்பான நவீனத் தமிழில் இணைவதற்காக ‘மறுமொழியாக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אִיּוֹב
  choice: யோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னது
  rationale: אמר என்பது இங்கு உரையை அறிமுகப்படுத்தும் வழக்கமான வினை. அடுத்த வசனங்களில் நேரடி உரை வருவதால், தமிழில் இயல்பான உரை அறிமுகச் சூத்திரமாக ‘சொன்னது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் கதைநிகழ்வின் தொடர்ச்சியைச் சுட்டுகிறது. அந்த வரிசைத் தொடர்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அப்போது’ பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியத்தக்கதும் இலக்கிய மரியாதை கொண்டதுமான உரை. எபிரேய மொழியின் ‘பதிலளித்து, சொன்னான்’ என்ற இரட்டை பேச்சுச் சூத்திரம் தமிழில் கனமாகத் தோன்றாமல் இருக்க ‘மறுமொழியாகச் சொன்னது’ என இயல்பாக்கப்பட்டுள்ளது; அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்த இருபுள்ளி வைக்கப்பட்டுள்ளது.
