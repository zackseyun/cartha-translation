  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: ta
  text: வேறொருவனோ உள்ளம் கசந்த நிலையில் இறக்கிறான்; அவன் நன்மையை அனுபவித்ததே இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஒருவன் உள்ளம் கசந்த நிலையில் இறக்கிறான்; அவன் நன்மையைச் சாப்பிட்டதில்லை.” வாழ்க்கையின் நன்மையை அனுபவிப்பதை எபிரெய மொழி ‘சாப்பிடுதல்’ என்ற உருவகத்தால் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: வேறொருவனோ
  rationale: எபிரெய மொழியில் சொற்பட ‘இந்த ஒருவனோ’ என்றிருந்தாலும், முந்தைய வசனத்தில் கூறப்பட்ட மனிதனுக்கு மாறான இன்னொரு மனிதனை இங்கு சுட்டுகிறது. ‘வேறொருவனோ’ என்பது அந்த எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָמוּת
  choice: இறக்கிறான்
  rationale: இது ஒரு குறிப்பிட்ட எதிர்கால நிகழ்வை முன்னறிவிப்பதல்ல; பொதுவாக நிகழக்கூடிய இரு வேறுபட்ட நிலைகளை ஒப்பிடும் கவிதைநடை. ஆகவே நிகழ்காலப் பொதுமை வடிவம் பொருத்தமானது.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: உள்ளம் கசந்த நிலையில்
  rationale: נֶפֶשׁ மָרָה என்பது சொற்பட ‘கசப்பான உயிர்/ஆத்துமாவுடன்’ எனினும், இங்கு ஒருவர் இறக்கும்போதுள்ள ஆழ்ந்த அகநிலை மற்றும் துயரைக் குறிக்கிறது. ‘உள்ளம் கசந்த நிலையில்’ என்பது உருவகத்தையும் உணர்ச்சியின் ஆழத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְ/לֹא אָכַל
  choice: அனுபவித்ததே இல்லை
  rationale: אָכַל என்பதன் அடிப்படைப் பொருள் ‘சாப்பிடு’; ஆனால் இங்கு நன்மையில் பங்குபெறுதல் அல்லது அதை அனுபவித்தல் என்ற உருவகப் பொருளில் வருகிறது. முதன்மை உரையில் இயல்பான தமிழைத் தேர்ந்தெடுத்து, சாப்பிடும் உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: בַּ/טּוֹבָה
  choice: நன்மையை
  rationale: טוֹבָה என்பது நன்மை, நல்வாழ்வு, செழிப்பு ஆகியவற்றை உள்ளடக்கக்கூடிய விரிவான சொல். ‘நன்மை’ அதன் திறந்த பொருள் எல்லையைப் பாதுகாக்கிறது; ‘செழிப்பு’ என்று மொழிபெயர்ப்பது பொருளாதார நிலையுடன் அளவுக்கு மீறிக் குறுக்கிவிடும்.
