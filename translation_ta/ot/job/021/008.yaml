source:
  edition: WLC
  text: זַרְעָ֤/ם נָכ֣וֹן לִ/פְנֵי/הֶ֣ם עִמָּ֑/ם וְ֝/צֶאֱצָאֵי/הֶ֗ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: ta
  text: அவர்களுடைய சந்ததி அவர்களுக்கு முன்பாக, அவர்களோடு உறுதியாக நிலைத்திருக்கிறது[a]; அவர்களுடைய வழித்தோன்றல்கள் அவர்களுடைய கண்முன் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சந்ததி அவர்களுக்கு முன்பாகப் பாதுகாப்பாக இருக்கிறது; அவர்களுடைய வழித்தோன்றல்கள் அவர்களுடைய பார்வையில் இருக்கிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעָם
  choice: அவர்களுடைய சந்ததி
  rationale: זֶרַע என்பது கூட்டுப்பொருளில் பிள்ளைகள், சந்ததி, வழிவருவோர் ஆகியோரைக் குறிக்கலாம். இங்கு குடும்பச் செழிப்பைப் பற்றிய சூழலில், வயதைச் சுருக்கிக் காட்டாமல் கூட்டுப்பொருளைப் பாதுகாக்கும் இயல்பான தமிழ்ச் சொலாக ‘சந்ததி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נָכוֹן
  choice: நிலைபெற்றிருக்கிறது
  rationale: இந்தச் சொல் உறுதியாக நிலைநிறுத்தப்பட்ட அல்லது நிலைத்திருக்கும் நிலையைக் குறிக்கிறது. ‘நிலைபெற்றிருக்கிறது’ அதன் நிலைசார் பொருளைப் பாதுகாக்கிறது; ‘பாதுகாப்பாக இருக்கிறது’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: לִפְנֵיהֶם
  choice: அவர்கள் முன்னிலையில்
  rationale: ‘அவர்களுக்கு முன்பாக’ என்ற எபிரேய உருவகத்தை இயல்பான தமிழில் காத்து, தங்கள் சந்ததி வாழ்ந்து நிலைப்பதை அவர்கள் நேரில் காண்கிறார்கள் என்ற கருத்தை வெளிப்படுத்துகிறது.
- source_word: עִמָּם
  choice: அவர்களுடன்
  rationale: עִם என்பதன் நேரடியான பொருள் ‘உடன்’. சந்ததி அவர்களுடைய பார்வையில் இருப்பதோடு அவர்களுடன் வாழ்கிறது என்ற எபிரேய வலியுறுத்தலை இது காக்கிறது.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: அவர்களுடைய வழித்தோன்றல்கள்
  rationale: צֶאֱצָאִים என்பது வழிவந்தோர் அல்லது சந்ததியினரைக் குறிக்கிறது. முதல் கூட்டுப்பெயரான ‘சந்ததி’யிலிருந்து இணைச்சொல் வேறுபாட்டைக் காத்துக்கொள்ள ‘வழித்தோன்றல்கள்’ பயன்படுத்தப்பட்டது.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்முன்
  rationale: ‘அவர்களுடைய கண்களுக்கு முன்பாக’ என்ற உயிரோட்டமுள்ள எபிரேய மரபுத்தொடரை, நேரடியாகப் பார்ப்பதைக் குறிக்கும் சுருக்கமான இயல்பான தமிழில் வழங்குகிறது.
