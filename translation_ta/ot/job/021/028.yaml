  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சின் இரு இணையான கேள்விகளும் காக்கப்பட்டுள்ளன. ‘பிரபு’ சமூக உயர்நிலையைச் சுட்டுகிறது; அரசப் பதவி என உறுதியாக்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
