  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: ta
  text: ஏனெனில் நீங்கள், “உயர்குடியைச் சேர்ந்தவரின்[a] வீடு எங்கே? பொல்லாதவர்களின் குடியிருப்பாகிய கூடாரம்[b] எங்கே?” என்று சொல்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயர்குடியைச் சேர்ந்தவர்” என்பதற்குப் பதிலாக “பிரபு” அல்லது “தலைவன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தாராள மனமுள்ள ஒருவரை மட்டுமல்லாமல், சமூகத்தில் உயர்ந்த நிலையுள்ள அல்லது அரசகுலத்தைச் சேர்ந்த ஒருவரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இத்தொடர், “கூடாரம்—பொல்லாதவர்களின் குடியிருப்புகள்” என்று சுருக்கமாக அமைந்துள்ளது. இது பொல்லாதவர்கள் குடியிருக்கும் கூடாரத்தைக் குறிக்கலாம்; அல்லது அந்தக் கூடாரத்தையே அவர்களுடைய குடியிருப்பாக அடையாளப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்துடன் இந்த வசனத்தை இணைத்து, யோபின் எதிராளிகள் கூறுவதை விளக்கமாக அறிமுகப்படுத்துகிறது.
- source_word: תֹאמְרוּ
  choice: நீங்கள் ... கேட்கிறீர்கள்
  rationale: இங்கு முற்றுப்பெறாத வினைவடிவு பிரதிநிதித்துவமான நிகழ்காலக் கூற்றைக் குறிக்கிறது; நேரடிப் பேச்சு கேள்வியாக இருப்பதால் தமிழில் ‘கேட்கிறீர்கள்’ இயல்பானது.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: எபிரெயச் சொல்லின் கேள்விப் பொருளை இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: בֵית
  choice: வீடு
  rationale: அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அரண்மனை அல்லது குடும்பம் என்று மிகையாக விளக்கவில்லை.
- source_word: נָדִיב
  choice: பிரபு
  rationale: இச்சூழலில் தாராள குணமுள்ளவர் என்பதைவிட உயர்ந்த சமூக நிலையுடைய அல்லது ஆளுமைமிக்க மனிதரைக் குறிக்கும் பொருள் பொருத்தமானது.
- source_word: אֹהֶל
  choice: கூடாரம்
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளையும் அதன் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: பொல்லாதவர்கள் குடியிருந்த
  rationale: எபிரெயிலுள்ள சுருக்கமான பன்மைத் தொடரை இயல்பான தமிழில் கூடாரத்தை விளக்கும் தொடராக வழங்குகிறது; எண்ணிக்கை சார்ந்த நெருக்கத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: ஒழுக்கரீதியான வகைப்பாட்டைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
