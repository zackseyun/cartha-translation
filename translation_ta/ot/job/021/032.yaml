  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: ta
  text: ஆயினும், அவன் கல்லறைகளுக்குக் கொண்டுசெல்லப்படுகிறான்[c]; கல்லறை மேட்டின்மேல்[b] அவன் காவல் காக்கிறான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினை ஆண்பால் ஒருமையில் உள்ளது; அதன் எழுவாய் தனியாக மீண்டும் குறிப்பிடப்படவில்லை. அது முன்னுள்ள “அவன்” என்பதைக் குறிக்கும் எனப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; ஆயினும், இச்சுருக்கமான தொடரின் துல்லியமான காட்சி விவாதத்திற்குரியது.
    reason: alternative_reading
  - marker: b
    text: “மேடு” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் குவியல் அல்லது அடுக்கப்பட்ட திரளைக் குறிக்கிறது; இங்கு அது கல்லறையின்மேல் உயர்த்தப்பட்ட மண் மேட்டைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் “கல்லறைகளுக்கு” என்பது பன்மை; அது கல்லறைப் பகுதியைத் தொகுப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: ஆயினும், அவன்
  rationale: וְ சூழலில் எதிர்மறைத் திருப்பைக் குறிக்கலாம்; வெளிப்படையான הוּא என்ற சுட்டுப்பெயரும் காக்கப்படுகிறது.
- source_word: לִקְבָרוֹת
  choice: கல்லறைகளுக்கு
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. தமிழிலும் பன்மையை வைத்திருப்பது மூலவடிவத்தைப் பாதுகாக்கிறது; இது கல்லறைப் பகுதியைத் தொகுப்பாகக் குறிக்கக்கூடும்.
- source_word: יוּבָל
  choice: கொண்டுசெல்லப்படுகிறான்
  rationale: יבל என்பதன் ஹோஃபால் வடிவம் ஒருவன் வழிநடத்தப்படுவதையோ சுமந்து செல்லப்படுவதையோ குறிக்கிறது; அடக்கச் சூழலில் இத்தேர்வு இயல்பாக உள்ளது.
- source_word: וְעַל
  choice: மேட்டின்மேல்
  rationale: עַל என்பதன் இடப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָּדִישׁ
  choice: கல்லறை மேடு
  rationale: இந்தச் சொல் குவியல் அல்லது அடுக்கப்பட்ட திரள் என்பதைக் குறிக்கிறது; இங்கு கல்லறையின்மேல் குவிக்கப்பட்ட மண் மேடு எனச் சூழல் சுட்டுகிறது.
- source_word: יִשְׁקֹד
  choice: காவல் காக்கப்படுகிறது
  rationale: שׁקד விழித்திருத்தல் அல்லது காவல் காத்தலைக் குறிக்கிறது. எபிரெயத்தில் செய்பவர் வெளிப்படையாக இல்லை; செயப்பாட்டு வடிவம் குறிப்பிட்ட எழுவாயைத் திணிக்காமல் அந்தத் தெளிவின்மையைப் பேணுகிறது.
theological_decisions:
- issue: יִשְׁקֹד என்ற வினையின் மறைந்த எழுவாய்
  choice: காவல் காக்கப்படுகிறது
  alternative: அவன் மேட்டின்மேல் காவல் காக்கிறான்
  rationale: மூலத்தில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. புதைக்கப்பட்ட மனிதனையே எழுவாயாகக் கொள்வது சாத்தியம் என்றாலும் உறுதியல்ல; ஆகவே முதன்மை உரை அதை முடிவுசெய்யாமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பன்மையும் இரண்டாம் அடியில் உள்ள எழுவாய் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன; “கல்லறை மேடு” என்பது சாதாரண வாசகருக்கு உருவகத்தைத் தெளிவாக்குகிறது.
