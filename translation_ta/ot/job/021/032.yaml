  source_fidelity: முதல் அடியில் எபிரெயத்தின் பன்மையான לִקְבָרוֹת, ஹோஃபால் செயப்பாட்டு יוּבָל ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் יִשְׁקֹד ஆண்பால் ஒருமைச் செயல்வினை; “காவல் காக்கப்படுகிறது” என்ற ஆளற்ற செயப்பாட்டு வடிவம் மூலத்தின் செயல்வினைத் தன்மையையும் அதன் இலக்கண எண்ணையும் மாற்றுகிறது. எழுவாய் தனிப்பட்ட பெயர்ச்சொல்லாக மீண்டும் சொல்லப்படவில்லை என்றாலும், வினை வடிவம் ஆண்பால் ஒருமை; முன்னுள்ள “அவன்” அதற்கான இயல்பான தொடர்பாகும்.
  naturalness: “ஆயினும்” மற்றும் “கல்லறைகளுக்குக் கொண்டுசெல்லப்படுகிறான்” நவீனத் தரமான தமிழில் இயல்பாக உள்ளன. “கல்லறை மேட்டின்மேல் அவன் காவல் காக்கிறான்” தெளிவான, கண்ணியமான நடையில் செயல்வினையை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: “கல்லறைகள்,” “கல்லறை மேடு,” மற்றும் “காவல் காக்கிறான்” ஆகியவை பொருத்தமானவை. “கல்லறை மேடு” גָּדִישׁ என்பதன் குவிந்த மண்-மேடு என்ற சூழல்சார் பொருளை விளக்குகிறது. பன்மைக்கான குறிப்பு மற்றும் மேட்டிற்கான பண்பாட்டுக் குறிப்பு தக்கவை.
