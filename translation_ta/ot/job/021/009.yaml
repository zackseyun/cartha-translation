  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: ta
  text: அவர்களுடைய வீடுகள் பயமின்றிப் பாதுகாப்பாக இருக்கின்றன[a]; கடவுளின் கோல் அவர்கள்மேல் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய குடும்பங்கள் அச்சமின்றிப் பாதுகாப்பாக இருக்கின்றன.”
    reason: lexical_alternative
  - marker: b
    text: “கடவுளின் கோல்” என்பது கடவுள் தாக்குவதையோ, கண்டிப்பதையோ, துன்பத்திற்கு உட்படுத்துவதையோ குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: அவர்களுடைய வீடுகள்
  rationale: בַּיִת என்பதன் பன்மை வடிவம் இங்கு நேரடியாக ‘வீடுகள்’ என்று பொருள்படும்; அது குடும்பங்களையும் குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁלוֹם מִפָּחַד
  choice: பயமின்றிப் பாதுகாப்பாக
  rationale: שָׁלוֹם இச்சூழலில் நலமாகவும் பாதுகாப்பாகவும் இருக்கும் நிலையைக் குறிக்கிறது; מִפָּחַד அச்சத்திலிருந்து விடுபட்டிருப்பதைச் சொல்கிறது. இயல்பான தமிழில் இரண்டையும் இணைத்து வழங்குகிறது.
- source_word: שֵׁבֶט
  choice: கோல்
  rationale: இச்சொல் கோல், தடி, செங்கோல் போன்ற பொருள்களை உடையது. இங்கு கடவுளின் தாக்குதல், கண்டிப்பு அல்லது துன்புறுத்தலை உருவகமாகக் குறிக்கிறது; ‘கோல்’ உருவகத்தின் அகலத்தைக் காக்கிறது.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யோபு நூலில் கடவுளைக் குறிக்கும் கவிதைநடை ஒருமை வடிவம்; தமிழில் நேரடியான பொதுப் பெயர் பயன்படுத்தப்படுகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல்
  rationale: עַל இங்கு ஒரு கோல் அவர்கள்மீது விழுவது அல்லது செயல்படுவது போன்ற உருவகத்தைத் தக்கவைக்கும் வகையில் ‘அவர்கள்மேல்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘கடவுளின் கோல்’ குறிக்கும் தெய்வீகச் செயலின் இயல்பு
  choice: ‘கடவுளின் கோல்’ என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: கடவுளின் தண்டனை / கடவுளின் கண்டிப்பு / கடவுள் தரும் துன்பம்
  rationale: எபிரெய உருவகம் தண்டனை, கண்டிப்பு, தாக்குதல் அல்லது துன்பம் ஆகியவற்றில் ஒன்றை மட்டும் தெளிவாக நிர்ணயிக்கவில்லை. குறிப்பிட்ட ஒரு இறையியல் விளக்கமாகச் சுருக்காமல் மூலத்தின் தெளிவின்மையும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பயமின்றிப் பாதுகாப்பாக’ என்பது எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ‘கோல்’ என்ற கவிதை உருவகம் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
