  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: ta
  text: ஒருவன் தன் முழு வலிமையோடு இறக்கிறான்; அவன் முற்றிலும் நிம்மதியாகவும் பாதுகாப்பாகவும் இருக்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה
  choice: ஒருவன்
  rationale: எதிரெதிரான மனித அனுபவங்களில் ஒரு பிரதிநிதி நிகழ்வைச் சுட்டுகிறது; நவீன தமிழில் ‘ஒருவன்’ இயல்பாக உள்ளது.
- source_word: יָמוּת
  choice: இறக்கிறான்
  rationale: இங்கு imperfect பொதுவாக நிகழ்வதை எடுத்துரைக்கும் gnomic பயன்பாட்டில் இருப்பதால் நிகழ்கால வடிவம் பொருத்தமானது.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: தன் வலிமை முழுமையாய் இருக்கும்போதே
  rationale: עֶצֶם என்பதன் ‘சாரம்/வலிமை’ உணர்வும் תֻּמּוֹ என்பதன் ‘முழுமை/குன்றாத நிலை’ உணர்வும் இணைந்து, உடல் வலிமை குன்றாத நிலையைக் குறிக்கின்றன; ‘போதே’ அந்த நிலையிலேயே மரணம் நேரும் முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֻּלּוֹ
  choice: முற்றிலும்
  rationale: பின்வரும் இரு அமைதி சார்ந்த பண்புகளையும் வலுப்படுத்தும் வினையடைச் செயல்பாட்டைத் தருகிறது.
- source_word: שַׁלְאֲנַן
  choice: கவலையின்றி
  rationale: தொந்தரவும் அச்சமும் இல்லாத நிம்மதியான நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; பொருளாதாரச் செழிப்பைத் தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: וְשָׁלֵיו
  choice: பாதுகாப்பாக
  rationale: அமைதியோடு கூடிய நிலையான நலன் அல்லது அச்சமின்மையை வெளிப்படுத்தி, முந்தைய சொல்லுக்கு இணையானதாயினும் தனித்த நுண்பொருளைத் தக்கவைக்கிறது.
