translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் ஞான இலக்கியத்திற்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. எபிரெய இணைவாக்கியத்தின் இரு நெருங்கிய பண்புகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
