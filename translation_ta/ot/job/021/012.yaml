  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: ta
  text: அவர்கள் தப்புக்கும் யாழுக்கும் இசைவாகப் பாடுகிறார்கள்[a]; குழலின் ஓசையைக் கேட்டு மகிழ்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தப்புடனும் யாழுடனும் உயர்த்துகிறார்கள்” என்று உள்ளது; எதை உயர்த்துகிறார்கள் என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. குரலை அல்லது பாடலை உயர்த்துவதாகப் பொருள் கொள்ளலாம்.
    reason: יִשְׂאוּ என்ற வினையின் சொல்லப்படாத செயப்படுபொருள் காரணமாக உள்ள உண்மையான மொழியியல் சுருக்கத்தையும் ambiguity-யையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: பாடுகிறார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘உயர்த்துகிறார்கள்/எடுத்துக்கொள்கிறார்கள்’; இங்கு இசைக்கருவிகளுடன் வரும் சூழலில், சொல்லப்படாமல் விடப்பட்டுள்ள ‘குரல்’ அல்லது ‘பாடல்’ என்னும் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்த ‘பாடுகிறார்கள்’ என மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תֹף
  choice: தப்பு
  rationale: கையால் அடிக்கப்படும் சிறிய தோற்கருவியைக் குறிக்கும்; நவீன வாசகருக்குப் புரியும் பொதுவான தமிழ்ச் சொல்.
- source_word: כִּנּוֹר
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவியான lyre-க்கு தமிழில் இயல்பான, மரியாதைமிக்க இணைச்சொல்.
- source_word: עוּגָב
  choice: குழல்
  rationale: இங்கு ஒரு ஊதுகருவியைக் குறிக்கிறது; அதன் துல்லிய வடிவம் உறுதியல்லாததால், குறிப்பிட்ட நவீன கருவிப் பெயரைத் திணிக்காமல் பொதுவான ‘குழல்’ பயன்படுத்தப்பட்டது.
- source_word: לְקוֹל
  choice: ஓசையைக் கேட்டு
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஓசையில்’ எனலாம்; மகிழ்ச்சிக்கான இசைத் தூண்டுதலை இயல்பான நவீன தமிழில் தெரிவிக்க இவ்வாறு அமைக்கப்பட்டது.
