  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: ta
  text: என்னை நோக்கித் திரும்புங்கள்; திகைத்துப்போங்கள்[a]; உங்கள் கையை உங்கள் வாயின்மேல் வையுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதிர்ச்சியடையுங்கள்.’ எபிரெய வினை திகைத்தல், அதிர்ச்சியடைதல், அல்லது பாழடைதல் ஆகிய பொருள்களைக் குறிக்கலாம்; இங்கே அது அதிர்ச்சியான எதிர்வினையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: என்னை நோக்கித் திரும்புங்கள்
  rationale: פנה என்பதன் பன்மை ஏவல் வடிவமும் אֵלַי என்பதன் திசைப் பொருளும் நேரடியாகப் பாதுகாக்கப்படுகின்றன. இது கவனத்தையும் முகத்தையும் யோபுவை நோக்கித் திருப்புமாறு விடுக்கும் அவசர அழைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְהָשַׁמּוּ
  choice: திகைத்துப்போங்கள்
  rationale: שׁמם என்ற வினையின் இவ்வடிவம் அதிர்ச்சி, திகைப்பு, பாழடைந்ததுபோன்ற மனநிலை ஆகிய பொருள் நிழல்களைக் கொண்டது. சூழலில் யோபுவின் நிலையைப் பார்த்து அதிர்ச்சியடையும் எதிர்வினையைச் சுட்டுவதால், ‘திகைத்துப்போங்கள்’ இயல்பாகவும் வலிமையாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְשִׂימוּ יָד עַל־פֶּה
  choice: உங்கள் கையை வாயின்மேல் வைத்துக்கொள்ளுங்கள்
  rationale: שׂים என்பதற்கு ‘வை’ என்ற பொதுவான பொருளும், ‘வாயின்மேல் கை’ என்பது மௌனம் அல்லது அதிர்ச்சியால் பேச்சடங்கும் சைகையும் பாதுகாக்கப்படுகின்றன. எபிரெயில் உடைமைச் சுட்டு வெளிப்படையாக இல்லாவிட்டாலும், பன்மை ஏவலின் சூழலில் ஒவ்வொருவரும் தம் கையை வைப்பது தமிழில் ‘உங்கள் கையை’ என இயல்பாக வெளிப்படுகிறது.
