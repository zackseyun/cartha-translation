translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஏவல் தொனியும் கவிதைநயமுள்ள கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வாயின்மேல்’ என்பது செறிவான, எளிதில் புரியும் உடல் சைகையாக வைக்கப்பட்டுள்ளது.
