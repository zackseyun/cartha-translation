source:
  edition: WLC
  text: יַ֭חַד עַל עָפָ֣ר יִשְׁכָּ֑בוּ וְ֝/רִמָּ֗ה תְּכַסֶּ֥ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: ta
  text: அவர்கள் ஒன்றாகப் புழுதியில் படுத்துக்கொள்வார்கள்; புழுக்கள்[a] அவர்களை மூடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈப்புழுக்கள்.’ உடல் அழுகும் சூழலில் எபிரெயச் சொல் רִמָּה புழுக்களையோ ஈப்புழுக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ஒன்றாக
  rationale: முன்னுள்ள சூழலில் வேறுபட்ட இருவருக்கும் மரணம் பொதுவான முடிவு என்பதை இந்த வினையடை உணர்த்துகிறது; ‘ஒன்றாக’ என்பது அதன் நேரடியான வலியுறுத்தலைக் காக்கிறது.
- source_word: עַל עָפָר
  choice: புழுதியில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், மரணம் மற்றும் அடக்கம் குறித்த சூழலில் தமிழில் ‘புழுதியில் படுத்துக்கொள்வார்கள்’ என்பது இயல்பாகவும் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יִשְׁכָּבוּ
  choice: படுத்துக்கொள்வார்கள்
  rationale: இங்கு நிறைவுறும் பொதுவான முடிவை எபிரெய வினை சுட்டுகிறது. மரணத்தைப் பற்றிய ‘படுத்துக்கொள்ளுதல்’ என்ற உருவகத்தை இந்தத் தேர்வு காக்கிறது; ‘இளைப்பாறுவார்கள்’ என்று விளக்கிப் பொருள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: רִמָּה
  choice: புழுக்கள்
  rationale: அழுகும் உடலுடன் தொடர்புடைய புழுக்களையோ ஈப்புழுக்களையோ இச்சொல் குறிக்கலாம். எபிரெயத்தில் ஒருமை வடிவில் வந்தாலும் கூட்டுப்பொருள் கொண்டதால், தமிழில் இயல்பான பொதுப்பன்மையான ‘புழுக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְּכַסֶּה
  choice: மூடும்
  rationale: புழுக்கள் உடலை மூடும் என்ற தீவிரமான காட்சியை நேரடியாகக் காக்கிறது. எபிரெயத்தில் கூட்டுப்பொருளுடைய ஒருமை எழுவாய்க்கு ஏற்ற ஒருமை வினை உள்ளது; தமிழ் மொழிபெயர்ப்பில் பன்மை எழுவாயுடனும் வினை வடிவம் ‘மூடும்’ என்றே அமைகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களை
  rationale: ‘அவர்கள்மேல்’ என்ற முன்னிடைச்சொல் பொருள், தமிழின் இயல்பான ‘அவர்களை மூடும்’ என்ற வினைத்தொடரில் உள்ளடக்கப்பட்டுள்ளது.
