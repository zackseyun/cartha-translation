id: JOB.21.21
reference: Job 21:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י מַה חֶפְצ֣/וֹ בְּ/בֵית֣/וֹ אַחֲרָ֑י/ו וּ/מִסְפַּ֖ר חֳדָשָׁ֣י/ו חֻצָּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: ta
  text: ஏனெனில், அவனுடைய மாதங்களின் எண்ணிக்கை முடிவுக்குக் கொண்டுவரப்படும்போது[c], அவனுக்குப் பின் அவனுடைய வீட்டைப் பற்றி[b] அவனுக்கு என்ன அக்கறை?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பின் அவனுடைய வீட்டில் அவனுக்கு என்ன மகிழ்ச்சி இருக்கிறது?”
    reason: lexical_alternative
  - marker: b
    text: “வீடு” என்பது “வீட்டார்” அல்லது “குடும்பம்” என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனுடைய மாதங்களின் எண்ணிக்கை நிர்ணயிக்கப்படும்போது/பகுத்தளிக்கப்படும்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: מַה
  choice: என்ன
  rationale: அவனுக்கு அக்கறை ஏதுமில்லை என்பதை உணர்த்தும் சொல்லாட்சிக் கேள்வியை இயல்பாகத் தக்கவைக்கிறது.
- source_word: חֶפְצוֹ
  choice: அவனுக்கு என்ன அக்கறை?
  rationale: חֵפֶץ என்பது விருப்பம், மகிழ்ச்சி, நாட்டம் அல்லது அக்கறையைக் குறிக்கலாம். இச்சூழலில் சொல்லாட்சிக் கேள்வியின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּבֵיתוֹ
  choice: அவனுடைய வீட்டைப் பற்றி
  rationale: בְּ இங்கு அக்கறை அல்லது நாட்டத்தின் பொருளைக் குறிக்கிறது. בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ முதன்மை உரையில் வைக்கப்பட்டு, ‘வீட்டார்/குடும்பம்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்
  rationale: அவன் இறந்த அல்லது சென்றுபோன பின்புள்ள காலத்தைக் குறிக்கிறது; மூலத்தின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: அவனுடைய மாதங்களின் எண்ணிக்கை ... போது
  rationale: ‘மாதங்கள்’ என்ற மூலத்தின் துல்லியமான கால உருவகத்தைத் தக்கவைத்து, இணைப்பைச் சூழலுக்கேற்ற காலத் தொடர்பாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֻצָּצוּ
  choice: முடிவுக்குக் கொண்டுவரப்படும்போது
  rationale: செயப்பாட்டு வடிவத்தையும் வாழ்நாள் முடிவுறும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நிர்ணயிக்கப்படுதல்/பகுத்தளிக்கப்படுதல்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறந்த பின் ஒருவனுக்கும் அவன் வீட்டிற்கும் உள்ள தொடர்பு
  choice: ‘அவனுக்குப் பின்’ என்ற மூலத்தின் மொழியை விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘அவன் இறந்த பின்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: வசனம் அவனுடைய மறைவுக்குப் பின்புள்ள நிலையைச் சுட்டினாலும், மரணத்துக்குப் பிந்தைய உணர்வு அல்லது அறிவு குறித்த முடிவைத் தானாகத் தீர்மானிப்பதில்லை. ஆகவே மூலத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் சொல்லாட்சிக் கேள்வி இயல்பாக வைக்கப்பட்டுள்ளது; ‘வீடு,’ ‘மாதங்கள்,’ ‘அவனுக்குப் பின்’ ஆகிய மூல உருவகங்களும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
