source:
  edition: WLC
  text: שָׂ֭אוּ/נִי וְ/אָנֹכִ֣י אֲדַבֵּ֑ר וְ/אַחַ֖ר דַּבְּרִ֣/י תַלְעִֽיג׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: ta
  text: என்னைப் பொறுத்துக்கொள்ளுங்கள்[a]; நான் பேசுவேன்; நான் பேசிய பிறகு[b], நீ கேலி செய்யலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைச் சகித்துக்கொள்ளுங்கள்.” எபிரெயச் சொல் சொற்சொல்லாக ‘தூக்குதல், சுமந்து செல்லுதல்’ என்பதைக் குறித்தாலும், இங்கே ஒருவர் பேசுவதற்கு இடமளித்து அவரைப் பொறுத்துக்கொள்ளும் பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் பேசிய பிறகு, நீ கேலி செய்வாய்.” எபிரெயை எளிய எதிர்காலமாகவும், அனுமதி அல்லது விட்டுக்கொடுக்கும் பொருளில் “நீ கேலி செய்யலாம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּ/נִי
  choice: என்னைப் பொறுத்துக்கொள்ளுங்கள்
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல், சுமத்தல்’; இச்சொற்பொழிவுச் சூழலில், யோபு பேசும்வரை அவரைப் பொறுத்துக்கொள்ளுமாறு கேட்பதை இது மரபுத்தொடராகக் குறிக்கிறது. நவீனத் தமிழில் ‘என்னைப் பொறுத்துக்கொள்ளுங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְ/אָנֹכִי
  choice: நான்
  rationale: אָנֹכִי வலியுறுத்தப்பட்ட முதலாம் நபர் ஒருமைப் பெயர்ப்பதிலி. தமிழில் வெளிப்படையாக வரும் ‘நான்’ அந்த வலியுறுத்தலைப் போதுமான அளவு தருகிறது; இணைப்பின் இயல்பு வாக்கியப் பிரிப்பால் வெளிப்படுகிறது.
- source_word: אֲדַבֵּר
  choice: பேசுவேன்
  rationale: דבר என்பதன் பியேல் வடிவம் பொதுவாக ‘பேசுதல்’ என்று பொருள்படும். ‘பேசுவேன்’ நேரடியானதும் இச்சூழலின் கண்ணியமான நடைக்கு ஏற்றதும் ஆகும்.
- source_word: וְ/אַחַר
  choice: பிறகு
  rationale: אַחַר அடுத்துச் சம்பவிக்கும் செயலைக் காலவரிசையில் அறிமுகப்படுத்துகிறது. தமிழில் ‘பிறகு’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: דַּבְּרִי
  choice: நான் பேசி முடித்த
  rationale: முதலாம் நபர் பின்னொட்டுடன் உள்ள infinitive construct என்பதால் சொற்சொல்லாக ‘என் பேசுதல்’ எனப் பொருள்படும். தமிழில் காலத் துணைவாக்கியமாக ‘நான் பேசி முடித்த’ என்பது செயல் நிறைவடைந்த பின்பே அடுத்த செயல் நிகழ்வதை இயல்பாகக் காட்டுகிறது; ‘முடித்த’ என்பது சூழலால் உணரப்படும் நிறைவை வெளிப்படுத்துகிறது.
- source_word: תַלְעִיג
  choice: நீ கேலி செய்யலாம்
  rationale: לעג என்பதன் ஹிப்ஃபில் வடிவம் ‘கேலி செய்தல், ஏளனம் செய்தல்’ என்று பொருள்படும். வினை இலக்கணப்படி ஆண்பால் ஒருமையில் இருப்பதால் ‘நீ’ பயன்படுத்தப்பட்டுள்ளது. ‘செய்யலாம்’ என்பது சூழலுக்கு ஏற்ற அனுமதி அல்லது விட்டுக்கொடுக்கும் நயத்தைத் தருகிறது; ஆனால் எளிய எதிர்கால வாசிப்பும் சாத்தியம்.
theological_decisions:
- issue: תַלְעִיג என்பதிலுள்ள வினைநயத்தின் ambiguity
  choice: அனுமதி/விட்டுக்கொடுக்கும் நயமாக ‘நீ கேலி செய்யலாம்’
  alternative: எளிய நிகழ்காலம் அல்லது எதிர்காலமாக ‘நீ கேலி செய்வாய்’
  rationale: எபிரெய வடிவம் தன்னிச்சையாக அனுமதிப் பொருளைக் குறிக்கவில்லை; ஆயினும், ‘முதலில் நான் பேச அனுமதியுங்கள்; பின்னர் கேலி செய்யுங்கள்’ என்ற சூழல்சார் நகர்வு அனுமதி அல்லது சவாலான விட்டுக்கொடுக்கும் நயத்தை ஆதரிக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் நேரடியான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. முதல் கட்டளையில் பன்மை/மரியாதை வடிவமான ‘பொறுத்துக்கொள்ளுங்கள்’ உள்ளது; இறுதி எபிரெய வினை ஒருமையில் இருப்பதால் ‘நீ’ என வழங்கப்பட்டுள்ளது. இந்த எண்ணிக்கை மாற்றம் மூலத்தின் உண்மையான வடிவத்தைப் பாதுகாக்கிறது.
