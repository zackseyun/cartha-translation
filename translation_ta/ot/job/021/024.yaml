- from: அவனுடைய பால் பாத்திரங்கள் பால் நிரம்பியிருக்கின்றன[a]; அவனுடைய எலும்புகளின் மஜ்ஜை ஈரப்பதத்துடன் இருக்கிறது.
  to: அவனுடைய பால் பாத்திரங்கள் பாலால் நிறைந்திருக்கின்றன[a]; அவனுடைய எலும்புகளின் மஜ்ஜை நன்கு ஈரமூட்டப்பட்டிருக்கிறது.
  rationale: The revision retains the source’s lexical uncertainty in both the main text and footnote, improves Tamil idiom in the first colon, and renders the passive, well-supplied moisture image of the final verb more fully without adding an interpretation of the poetic imagery.
