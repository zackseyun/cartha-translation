  text: עֲ֭טִינָי/ו מָלְא֣וּ חָלָ֑ב וּ/מֹ֖חַ עַצְמוֹתָ֣י/ו יְשֻׁקֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: ta
  text: அவனுடைய பால் பாத்திரங்கள் பாலால் நிறைந்திருக்கின்றன[a]; அவனுடைய எலும்புகளின் மஜ்ஜை நன்கு ஈரமூட்டப்பட்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய மடிகள் பாலால் நிறைந்திருக்கின்றன.” இங்குள்ள எபிரெயச் சொல் அரிதானது; அது பால் மடிகளையோ பால் பாத்திரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: அவனுடைய பால் பாத்திரங்கள்
  rationale: இந்த அரிய எபிரெயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை; அது பால் கறக்கும் மடிகளையோ பாலை வைத்திருக்கும் பாத்திரங்களையோ குறிக்கலாம். மனிதனைப் பற்றிய இக்கவிதைச் சூழலில் இயல்பாகவும் வளமையின் படிமத்தைத் தக்கவைத்தும் இருப்பதால், முதன்மை உரையில் ‘பால் பாத்திரங்கள்’ எனத் தரப்பட்டு, மற்றொரு சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: מָלְאוּ
  choice: நிரம்பியிருக்கின்றன
  rationale: முழுமையாக நிறைந்துள்ள செழிப்பான நிலையைக் குறிக்கும் எபிரெய நிறைவேற்ற வினையைத் தமிழில் இயல்பான நிலை வினையாக வெளிப்படுத்துகிறது.
- source_word: חָלָב
  choice: பால்
  rationale: சொல்லின் நேரடிப் பொருளையும், செழிப்பு மற்றும் வளமை பற்றிய கவிதைப் படிமத்தையும் தக்கவைக்கிறது.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: அவனுடைய எலும்புகளின் மஜ்ஜை
  rationale: எபிரெயக் கட்டமைப்பையும் உடல்நலம் மற்றும் வலிமையை உணர்த்தும் தெளிவான உடற்படிமத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְשֻׁקֶּה
  choice: ஈரப்பதத்துடன் இருக்கிறது
  rationale: பானம் அல்லது ஈரம் அளிக்கப்படுதல் என்ற புவால் வினையின் கருத்தை வெளிப்படுத்துகிறது. தமிழில் ‘நன்கு நீர்ப்பாய்ச்சப்பட்டுள்ளது’ என்பது உடலைப் பற்றிக் கூறும்போது செயற்கையாக ஒலிப்பதால், உயிர்ச்செழிப்பைக் குறிக்கும் ஈரத்தன்மையை இயல்பாகத் தருகிறது.
