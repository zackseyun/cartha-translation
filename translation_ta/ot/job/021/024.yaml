translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. அரிய சொல்லின் உண்மையான பொருள் ஐயத்தை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது; இரண்டாம் பாதியின் உடற்படிமம் விளக்கவுரையாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
