base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: ta
  text: “தேவன் அவனுடைய அக்கிரமத்தை அவனுடைய மகன்களுக்கெனச் சேமித்து வைக்கிறாரா?[a][b][c] அவனுக்கே கைம்மாறு செய்யட்டும்; அப்போது அவன் அறிந்துகொள்வான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இதை நேரடிக் கூற்றாகவும் மொழிபெயர்க்கலாம்: “தேவன் அவனுடைய அக்கிரமத்தை அவனுடைய மகன்களுக்கெனச் சேமித்து வைக்கிறார்; அவனுக்கே கைம்மாறு செய்யட்டும்; அப்போது அவன் அறிந்துகொள்வான்.” எபிரெயத்தில் வெளிப்படையான வினாக்குறி இல்லை; ஆனால் சூழல் இதை யோபு சவாலிடும் கருத்தாகப் புரிந்துகொள்ள ஆதரவளிக்கிறது.'
    reason: alternative_reading
  - marker: b
    text: “மகன்கள்” என்பதே எபிரெயச் சொல்; சூழலில் அது ஒருவனுடைய சந்ததியினரை விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “அக்கிரமம்” என்பதற்கான எபிரெயச் சொல் சூழலுக்கேற்ப தீமை, துன்பம், அல்லது அக்கிரமத்துக்கான தண்டனை அல்லது விளைவு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: தேவன்
  rationale: யோபு நூலில் வரும் இறைவனைக் குறிக்கும் பொதுவான ஒருமைச் சொல்; நவீனத் தமிழில் இயல்பான, கண்ணியமான இணை.
- source_word: יִצְפֹּן
  choice: சேமித்து வைக்கிறாரா
  rationale: צפן என்பதன் ‘சேர்த்து/ஒதுக்கி வைத்தல்’ என்ற பொருளைத் தெளிவாகக் காட்டுகிறது; சூழலுக்கேற்ப வினாவாக்கப்பட்டுள்ளது.
- source_word: לְבָנָיו
  choice: அவனுடைய மகன்களுக்காக
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவனுடைய மகன்கள்’ என்று இருப்பதால் ஆண்பால் பன்மை பாதுகாக்கப்படுகிறது; சூழலில் சந்ததியினரையும் விரிவாகக் குறிக்கக்கூடும்.
- source_word: אוֹנוֹ
  choice: அவனுடைய அக்கிரமத்தை
  rationale: אָוֶן என்பதன் ‘அக்கிரமம்/தீமை/துன்பம்’ என்ற பொருள் வரம்பில், மூலத்தின் குற்றத்தைக் குறிக்கும் சொல்லை விளக்கவுரையான ‘தண்டனை’ என மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְשַׁלֵּם
  choice: திருப்பிச் செலுத்தட்டும்
  rationale: Piel வடிவின் கைம்மாறு செய்தல் அல்லது திருப்பிச் செலுத்துதல் என்ற பொருளையும், இங்கு பொருத்தமான விருப்ப/கட்டளை நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: அவனுக்கே
  rationale: மகன்களுக்கு அல்ல, அக்கிரமம் செய்த மனிதனுக்கே கைம்மாறு வரவேண்டும் என்ற முரண்பாட்டைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וְיֵדָע
  choice: அப்போது அவன் அதை அறிந்துகொள்வான்
  rationale: ידע என்பதன் அடிப்படை ‘அறிதல்’ பொருளைப் பாதுகாத்து, இணைப்பைச் சூழலுக்கு ஏற்ற விளைவு உறவாக வழங்குகிறது; மறைந்துள்ள செயப்படுபொருளை ‘அதை’ என இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தொடக்கக் கூற்று யோபுவின் உறுதிப்படுத்தலா, அல்லது அவர் சவாலிடும் கருத்தா?
  choice: 'சூழலின் வாத ஓட்டத்திற்கேற்ப அதை வினாவாக வழங்குதல்: ‘தேவன் ... சேமித்து வைக்கிறாரா?’'
  alternative: ‘தேவன் அவனுடைய அக்கிரமத்தை அவனுடைய மகன்களுக்காகச் சேமித்து வைக்கிறார்’ என்று நேரடியான உறுதிக் கூற்றாக வழங்குதல்.
  rationale: எபிரெயத்தில் வெளிப்படையான வினாத்துகள் இல்லை என்றாலும், யோபு 21-ன் சூழலில் தீயவனுக்குரிய கைம்மாறு அவன் பிள்ளைகள்மீது தள்ளிவைக்கப்பட வேண்டும் என்ற கருத்தை யோபு சவாலிடுகிறார். தொடர்ந்து வரும் விருப்பவினை இதை ஆதரிக்கிறது; இருப்பினும் இலக்கண ரீதியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אָוֶן என்பதைக் குற்றமாகவா, தண்டனையாகவா மொழிபெயர்ப்பது?
  choice: ‘அக்கிரமம்’ என்று மொழிபெயர்த்து மூலத்தின் சொல்லியல் பதற்றத்தைப் பாதுகாத்தல்.
  alternative: ‘தண்டனை’ அல்லது ‘அக்கிரமத்தின் விளைவு’ என்று சூழலுக்கேற்ப விளக்கமாக வழங்குதல்.
  rationale: இந்தச் சொல் தீமை, அக்கிரமம், துன்பம் அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ மூலத்துக்கு நெருக்கமானது; தண்டனை என்ற காரணவிளைவு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அவனுக்கே’ என்பது மகன்களுக்கும் குற்றவாளிக்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டைக் காக்கிறது. கவிதை வாதத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் வைத்திருக்கிறது.
