source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: ta
  text: அவனுடைய கண்கள் அவனுடைய அழிவைக் காணட்டும்[b][a]; சர்வவல்லவரின் கடுங்கோபத்தை அவன் குடிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கண்கள் அவனுடைய அழிவைக் காணும்; சர்வவல்லவரின் கடுங்கோபத்தை அவன் குடிப்பான்.” எபிரெய மொழியிலுள்ள முற்றுபெறாத வினைவடிவங்களை விருப்பமாக அல்லாமல் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “அழிவு” என்பதை “கேடு” அல்லது “பேரிடர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: காணட்டும்
  rationale: ראה என்பதன் Qal imperfect 3mp வடிவம்; பன்மை எழுவாயான ‘அவனுடைய கண்கள்’ என்பதுடன் பொருந்துகிறது. சூழலில் தீயவன் தானே தண்டனையை அனுபவிக்க வேண்டும் என்ற யோபுவின் விருப்பத்தை வெளிப்படுத்துவதால், விருப்ப/ஏவல் நிழலுடன் ‘காணட்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵינָיו
  choice: அவனுடைய சொந்தக் கண்களே
  rationale: 3ms பின்னொட்டுள்ள பெயர்ச்சொல் நேரடியாக ‘அவனுடைய கண்கள்’ என்று பொருள். தீயவன் தனிப்பட்ட முறையில் விளைவைப் பார்க்க வேண்டும் என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்த ‘சொந்த’ மற்றும் ‘-ஏ’ சேர்க்கப்பட்டன.
- source_word: כִּידוֹ
  choice: அவனுடைய அழிவு
  rationale: כיד என்பது அழிவு, கேடு, பேரிடர் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு தீயவனுக்கு நேரும் வீழ்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்க ‘அழிவு’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וּמֵחֲמַת
  choice: கடுங்கோபத்திலிருந்து
  rationale: חֵמָה என்பது கடுங்கோபம், சீற்றம், சில சூழல்களில் நஞ்சு என்றும் பொருள்படும். ‘குடித்தல்’ என்ற உருவகத்துடனும் தெய்வீகத் தீர்ப்பின் சூழலிலும் ‘கடுங்கோபம்’ பொருத்தமானது; מִן முன்னொட்டின் ‘-இலிருந்து’ பொருளும் காக்கப்பட்டுள்ளது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: யோபு நூலில் வரும் שדי என்ற இறைப்பட்டத்திற்கான நிலையான, கண்ணியமான தமிழ் வடிவம்; எபிரெயச் சொல்லுக்கு அப்பாற்பட்ட தனிப்பட்ட கோட்பாட்டு நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: יִשְׁתֶּה
  choice: குடிக்கட்டும்
  rationale: שתה என்பதன் Qal imperfect 3ms வடிவம். முதல் உட்பிரிவுக்கு இணையாக விருப்பத்தை வெளிப்படுத்தும் வடிவில் தரப்பட்டது. தண்டனையை அனுபவித்தல் என்ற உருவகத்தைத் தட்டையாக்காமல் ‘குடி’ என்பதே காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இவ்வசனத்திலுள்ள imperfect வினைகளின் வலிமை
  choice: 'விருப்பத்தை வெளிப்படுத்தும் வடிவம்: ‘காணட்டும் ... குடிக்கட்டும்’'
  alternative: 'எதிர்கால முன்னறிவிப்பு: ‘அவனுடைய கண்கள் ... காணும்; அவன் ... குடிப்பான்’'
  rationale: பிள்ளைகளுக்குத் தண்டனை ஒத்திவைக்கப்படுவது போதாது; தீயவன் தானே தீர்ப்பை அனுபவிக்க வேண்டும் என்று யோபு வலியுறுத்தும் சூழலில், விருப்ப வடிவம் சொற்பொழிவின் உந்துதலை நன்கு காட்டுகிறது. இருப்பினும் எபிரெய imperfect வடிவங்கள் எதிர்கால முன்னறிவிப்பாகவும் வாசிக்கப்படலாம் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சொந்தக் கண்களே’ என்பது தனிப்பட்ட அனுபவத்தின் வலியுறுத்தலைத் தெரிவிக்கிறது. ‘கடுங்கோபத்திலிருந்து குடித்தல்’ என்ற எபிரெய உருவகம் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் பிரதான உரையில் தொடர்புடைய சொற்றொடருக்குப் பின் வரிசையாக [a][b] என இடப்பட்டுள்ளன.
