source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: ta
  text: ஆனாலும் அவர்கள் தேவனிடம், “எங்களைவிட்டு விலகிப்போம்[a]; உமது வழிகளைப் பற்றிய அறிவை நாங்கள் விரும்பவில்லை” என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “எங்களிடமிருந்து விலகிவிடும்”; “எங்களைவிட்டுப் போய்விடும்.”'
    reason: סוּר என்பதற்கு ‘விலகு,’ ‘அகன்று போ’ ஆகிய நெருங்கிய பொருள்கள் உள்ளதால் சொல்லியல் மாற்றுகள் தரப்பட்டுள்ளன.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ஆனாலும் ... சொல்கிறார்கள்
  rationale: 'இங்கு வரும் வாவ் இணைப்புச் சொல் சூழலில் எதிர்மறைத் திருப்பத்தைக் காட்டுகிறது: பொல்லாதவர்கள் செழித்திருந்தும் தேவனைப் புறக்கணிக்கிறார்கள். யோபு அவர்களுடைய வழக்கமான மனப்பான்மையை விவரிப்பதால் நிகழ்காலம் இயல்பாக உள்ளது.'
- source_word: לָאֵל
  choice: தேவனிடம்
  rationale: אֵל இங்கு தனிப்பெயராக அல்ல, தேவனைக் குறிக்கும் பொதுவான இறைச்சொல்லாகப் பயன்படுகிறது.
- source_word: סוּר מִמֶּנּוּ
  choice: எங்களைவிட்டு விலகிப்போ
  rationale: சொல் நேரடியாகக் கட்டளையிடும் ஒருமை வடிவில் உள்ளது; தேவன் தங்களிடமிருந்து அகல வேண்டும் என்ற கடுமையான மறுப்பை இது காக்கிறது.
- source_word: וְדַעַת
  choice: அறிவை
  rationale: דַּעַת என்பதை வெறும் புரிதல் என மெலிதாக்காமல் ‘அறிவு’ என்று மொழிபெயர்க்கிறது. וְ என்பதன் இணைப்பு, காரணவிளக்கமாக மாற்றப்படாமல் அரைப்புள்ளி மூலம் இணையான இரண்டாம் கூற்றாகக் காக்கப்பட்டுள்ளது.
- source_word: דְּרָכֶיךָ
  choice: உமது வழிகளைப் பற்றிய
  rationale: דֶּרֶךְ என்பதன் பன்மை இங்கு தேவனுடைய செயல்முறைகளையும் நெறிகளையும் குறிக்கலாம்; ‘உமது வழிகள்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: לֹא חָפָצְנוּ
  choice: நாங்கள் விரும்பவில்லை
  rationale: חפץ விருப்பம், நாட்டம் அல்லது இன்பம் கொள்ளுதல் ஆகிய பொருள்களை உடையது. இங்கு அறிவைப் பெறுவதற்கான மனப்பூர்வ மறுப்பை ‘விரும்பவில்லை’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பொல்லாதவர்கள் தேவனிடம் பேசும் நேரடி கூற்று
  choice: “எங்களைவிட்டு விலகிப்போ” என்ற நேரடி கட்டளை தக்கவைக்கப்பட்டது
  alternative: “எங்களைத் தனியாக விட்டுவிடும்” போன்ற மறைமுக அல்லது பேச்சுவழக்குப் பரிமாற்றம்
  rationale: எபிரெய உரை தேவனை நோக்கிச் சொல்லப்படும் நேரடியான, கடுமையான கட்டளையை வழங்குகிறது. அதை மென்மைப்படுத்தாமல் வைத்திருப்பது மனிதக் கலகத்தின் இறையியல் அதிர்ச்சியையும் பதற்றத்தையும் காக்கிறது.
- issue: இரு கூற்றுகளுக்கிடையிலான உறவு
  choice: இணைப்பு உறவு காரணவிளக்கமாகத் தீர்மானிக்கப்படாமல் வைக்கப்பட்டது
  alternative: “ஏனெனில் உமது வழிகளை...” என்று காரண உறவை வெளிப்படையாக்குதல்
  rationale: וְ அடிப்படையில் இணைப்புச் சொல். இரண்டாம் கூற்று முதலாம் கூற்றிற்குக் காரணமாகப் புரிந்துகொள்ளப்படலாம் என்றாலும், அதை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்தாமல் மூலத்தின் திறந்த உறவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் நேரடி உரையின் கண்ணியமான கடுமையைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது.
