source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: ta
  text: 'அவர்கள் தங்கள் நாட்களை செழிப்பில் கழிக்கிறார்கள்;

    ஒரு கணத்தில் ஷியோலுக்கு[a] இறங்குகிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கல்லறை,” “இறந்தோரின் உலகம்,” அல்லது “மரணம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் “ஷியோல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: கழிக்கிறார்கள்
  rationale: பியேல் வினைவடிவம், அவர்களுடைய நாட்கள் கடந்து செல்லுதல் அல்லது பயன்படுத்தப்படுதல் என்ற காலச்சார்ந்த பொருளைத் தருகிறது. நவீன தமிழில் ‘நாட்களைக் கழிக்கிறார்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בַטּוֹב
  choice: நல்வாழ்வில்
  rationale: טוֹב என்பதன் அடிப்படைப் பொருள் ‘நன்மை.’ இச்சூழலில் அது செழிப்பு, நலம், சுகவாழ்வு ஆகியவற்றை உள்ளடக்கிய வாழ்நிலையைக் குறிக்கிறது. ‘நல்வாழ்வில்’ என்பது பொருளை மிகையாகச் சுருக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְמֵיהֶם
  choice: தங்கள் நாட்களை
  rationale: எபிரெய மொழியின் காலத்தைக் குறிக்கும் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; எழுவாயுடனான உடைமையைத் தமிழில் இயல்பாகக் காட்ட ‘தங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבְרֶגַע
  choice: ஒரு கணத்தில்
  rationale: רֶגַע மிகக் குறுகிய நேரத்தைக் குறிக்கிறது. முழு வாழ்நாளின் நல்வாழ்வுக்கும் திடீர் முடிவுக்கும் இடையிலான முரணை ‘ஒரு கணத்தில்’ பாதுகாக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இச்சொல்லை ‘கல்லறை’ அல்லது ‘மரணம்’ என்று மட்டும் வரையறுக்காமல், இறந்தோரின் இருப்பிடத்தைக் குறிக்கும் எபிரெயக் கருத்தின் பரப்பையும் தெளிவின்மையையும் ஒலிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: יֵחָתּוּ
  choice: இறங்குகிறார்கள்
  rationale: ஷியோலுடன் சேர்ந்துள்ளதால் கீழ்நோக்கிச் செல்லும் உருவகமே இங்கு பொருத்தமானது. ‘இறங்குகிறார்கள்’ என்பது மூலத்தின் படிமத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்; மரணம்
  rationale: பிற்காலக் கோட்பாட்டுச் சொல்லான ‘நரகம்’ என்பதை வசனத்திற்குள் கொண்டுவராமல், எபிரெயச் சொல்லின் கருத்தியல் திறந்தநிலையை ஒலிபெயர்ப்பு பாதுகாக்கிறது. வாசகர்களுக்குத் தேவையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சார்புடைய, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. முதல் அடியின் நீண்டகால நல்வாழ்வுக்கும் இரண்டாம் அடியின் கணநேர இறக்கத்திற்கும் இடையிலான கவித்துவ முரண் பாதுகாக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில உரையில் [a] குறி ‘prosperity’ என்பதற்குப் பின் இருந்தாலும், அடிக்குறிப்பு שְׁאוֹל பற்றியது என்பதால் தமிழில் ‘ஷியோல்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
