translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கவிதைநயமும் கண்ணியமும் உள்ள நடை பயன்படுத்தப்பட்டது. எபிரெயக் கவிதையின் இரு இணை அடிகள் அரைப்புள்ளி மற்றும் வரிப்பிரிப்பால் பாதுகாக்கப்பட்டுள்ளன; ‘தங்கள்’ முதல் அடியின் உரிமைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
