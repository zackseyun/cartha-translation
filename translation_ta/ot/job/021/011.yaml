source:
  edition: WLC
  text: יְשַׁלְּח֣וּ כַ֭/צֹּאן עֲוִילֵי/הֶ֑ם וְ֝/יַלְדֵי/הֶ֗ם יְרַקֵּדֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: ta
  text: 'தங்கள் சின்னஞ்சிறு பிள்ளைகளை[b] ஒரு மந்தையைப் போல்[a] வெளியே அனுப்புகிறார்கள்;

    அவர்களுடைய பிள்ளைகள் ஆடித் துள்ளுகிறார்கள்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆடுகளைப் போல்.’ எபிரெயச் சொல் צֹאן ஆடுகளையோ, ஆடு-வெள்ளாடு போன்ற சிறுகால்நடைகளையோ கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் கைக்குழந்தைகளை.’ எபிரெயச் சொல் மிகவும் இளம் பிள்ளைகளைக் குறிக்கிறது. புதிதாகப் பிறந்த குழந்தைகளை மட்டும் குறிப்பதாகத் தோன்றாதபடி ‘சின்னஞ்சிறு பிள்ளைகள்’ என்பது தேர்ந்தெடுக்கப்பட்டது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘துள்ளிக் குதிக்கிறார்கள்.’ எபிரெய வினைச்சொல் உயிர்ப்பான, மகிழ்ச்சியான அசைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: வெளியே அனுப்புகிறார்கள்
  rationale: שלח என்பதன் பியேல் வடிவம் ‘வெளியே அனுப்புதல்’ அல்லது ‘புறப்படவிடுதல்’ என்ற செயற்பொருளைத் தருகிறது. இங்கு பிள்ளைகள் தடையின்றி வெளியே செல்வதைக் குறிக்க இயல்பான நவீனத் தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כַצֹּאן
  choice: ஒரு மந்தையைப் போல்
  rationale: צֹאן என்பது பொதுவாக ஆடுகள் போன்ற சிறுகால்நடைகளின் கூட்டுப் பெயர். כ முன்னொட்டு உவமையைக் குறிக்கிறது; கூட்டமாகச் செல்லும் காட்சியை ‘ஒரு மந்தையைப் போல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲוִילֵיהֶם
  choice: தங்கள் சின்னஞ்சிறு பிள்ளைகளை
  rationale: עויל மிக இளம் பிள்ளைகளைக் குறிக்கிறது. ‘சின்னஞ்சிறு பிள்ளைகள்’ வயதின் இளமையைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் புதிதாகப் பிறந்த குழந்தைகள் மட்டுமே என்ற குறுகிய பொருளை ஏற்படுத்தாது.
- source_word: יַלְדֵיהֶם
  choice: அவர்களுடைய பிள்ளைகள்
  rationale: ילד இங்கு பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியைக் குறிக்கிறது. முதல் அடியின் இளம் பிள்ளைகளுடன் இணையாகவும் நவீனத் தமிழில் இயல்பாகவும் ‘பிள்ளைகள்’ அமைகிறது.
- source_word: יְרַקֵּדוּן
  choice: ஆடித் துள்ளுகிறார்கள்
  rationale: רקד மகிழ்ச்சியுடன் ஆடுதல், துள்ளுதல், குதித்தல் போன்ற உயிர்ப்பான அசைவைக் குறிக்கலாம். ‘ஆடித் துள்ளுகிறார்கள்’ அந்த இயக்கத்தையும் மகிழ்ச்சியான சூழலையும் பாதுகாக்கிறது.
