  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: ta
  text: என் பேச்சைக் கவனமாகக் கேளுங்கள்; இதுவே உங்கள் ஆறுதலாக இருக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “உங்கள் ஆறுதல்கள்” என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: கவனமாகக் கேளுங்கள்
  rationale: ஒரே வினையின் கட்டளை வடிவத்துடன் வரும் வினையெச்சத் தனித்தொடர் கேட்பதற்கான வலியுறுத்தலைக் குறிக்கிறது; தமிழில் இயல்பாக அதனை ‘கவனமாக’ என்ற வினையடையால் வெளிப்படுத்துகிறது.
- source_word: מִלָּתִי
  choice: என் பேச்சை
  rationale: முதல் நபர் ஒருமை உடைமை விகுதி பெற்ற ஒருமைச் சொல். இங்கு யோபு சொல்லவிருப்பதைக் குறிக்க ‘என் பேச்சை’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: וּתְהִי
  choice: இருக்கட்டும்
  rationale: விருப்பம் அல்லது வேண்டுகோளைத் தெரிவிக்கும் வடிவத்தைத் தமிழின் இயல்பான அனுமதி/விருப்ப வினைமுற்று எடுத்துரைக்கிறது.
- source_word: זֹאת
  choice: இதுவே
  rationale: ‘இது’ என்ற சுட்டுப்பெயரைப் பேணுவதோடு, அவர்கள் கவனமாகக் கேட்பதே ஆறுதலாக இருக்கட்டும் என்ற அழுத்தத்தை ‘வே’ இயல்பாக உணர்த்துகிறது.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: உங்கள் ஆறுதல்
  rationale: எபிரெயத்தில் பன்மையாக இருந்தாலும், தமிழில் கருத்துப்பெயரான ‘ஆறுதல்’ ஒருமையில் இயல்பாக வருகிறது. அவர்களுடைய கேட்பதே அவர்கள் தரும் ஆறுதலாக அமையட்டும் என்ற, ஒருவேளை நையாண்டி கலந்த பொருளையும் இது திறந்தவாறு வைக்கிறது.
