  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: ta
  text: பயணிகளிடம்[a] நீங்கள் கேட்டதில்லையா? அவர்களுடைய குறிகளை[b] நீங்கள் அடையாளம் காணவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழியில் பயணம் செய்பவர்களிடம்’ அல்லது ‘வழியாகக் கடந்து செல்பவர்களிடம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய அடையாளங்களை’ அல்லது ‘அவர்களுடைய சான்றுகளை.’ பயணிகளின் அறிக்கைகளுடன் தொடர்புடைய சான்றுக் குறிப்புகளை இச்சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: கேட்டதில்லையா? / அறிந்துகொள்ளவில்லையா?
  rationale: எதிரிலுள்ளவர்கள் ஒப்புக்கொள்ள வேண்டும் என்ற எதிர்பார்ப்புடன் கேட்கப்படும் வினாவின் கண்டிக்கும் தொனியைத் தமிழ் எதிர்மறை வினா இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁאֶלְתֶּם
  choice: நீங்கள் கேட்டதில்லையா
  rationale: ‘கேள், விசாரி’ என்ற பொருளை எளிய, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: עֹבְרֵי דָרֶךְ
  choice: வழிப்போக்கர்களிடம்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘வழியைக் கடந்து செல்பவர்கள்’; பயண அனுபவமுள்ள வழிப்பயணிகளைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וְאֹתֹתָם
  choice: அவர்களுடைய அடையாளங்களை
  rationale: אוֹת என்பதன் முதன்மைப் பொருளான ‘அடையாளம்/குறி’ என்பதைக் காக்கிறது; இங்கு பயணிகள் அறிந்த அல்லது வழங்கும் சான்றுக் குறிப்புகள் என்ற சூழற்பொருளை மட்டும் உரைக்குள் திணிக்கவில்லை.
- source_word: לֹא תְנַכֵּרוּ
  choice: நீங்கள் அறிந்துகொள்ளவில்லையா
  rationale: பியேல் வடிவிலுள்ள נכר இங்கு ‘அடையாளம் காணுதல், உணர்ந்தறிதல், ஏற்றறிதல்’ என்ற பொருள் தரலாம். ‘அறிந்துகொள்ள’ என்பது அடையாளங்களை உணர்ந்து ஏற்றுக்கொள்வதைக் குறிக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: ‘அவர்களுடைய அடையாளங்கள்’ என்பது பயணிகளின் சாட்சியமா, அவர்கள் அறிந்த சான்றுகளா என்பது தெளிவாக இல்லை
  choice: அவர்களுடைய அடையாளங்கள்
  alternative: அவர்கள் கூறும் சான்றுகள்
  rationale: எபிரெயச் சொற்றொடரின் உண்மையான தெளிவின்மையைக் காக்கிறது; விளக்கமான மாற்றை முதன்மை உரையில் கொண்டு வந்து பொருளை ஒரே விதமாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான இரண்டு எதிர்மறை வினாக்கள் எபிரெய உரையின் கண்டிக்கும் சொல்லாட்சியையும் வலியுறுத்தலையும் காக்கின்றன.
