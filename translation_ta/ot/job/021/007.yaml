base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: ta
  text: தீயவர்கள் ஏன் தொடர்ந்து வாழ்கிறார்கள், முதுமை அடைகிறார்கள், செல்வத்திலும் பெருகுகிறார்கள்[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமையிலும் வல்லவர்களாகிறார்கள்.” חָיִל (ஹயில்) என்ற எபிரெயச் சொல் செல்வம், வளங்கள், வலிமை, அல்லது படை வல்லமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: யோபுவின் எதிர்ப்புணர்வு நிறைந்த நேரடியான கேள்வியை இயல்பான தமிழில் காக்கிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: சட்டரீதியாகக் குற்றவாளிகள் என்பதை மட்டும் அல்லாமல், ஒழுக்கத்தில் தீயவர்களைக் குறிக்கும் ஞான இலக்கியப் பயன்பாட்டைத் தெளிவாகத் தருகிறது.
- source_word: יִחְיוּ
  choice: தொடர்ந்து வாழ்ந்து
  rationale: எதிர்பார்க்கப்படும் தண்டனை வராமல் அவர்கள் உயிர்வாழ்ந்து கொண்டிருப்பதைப் பற்றிய கேள்வியின் அழுத்தத்தை வெளிப்படுத்துகிறது.
- source_word: עָתְקוּ
  choice: முதுமை அடைந்து
  rationale: இச்சூழலில் நீண்ட காலம் வாழ்ந்து வயது முதிர்வதைக் குறிக்கும் வாய்ப்புள்ள பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: גַּם
  choice: -லும்கூட
  rationale: அவர்கள் உயிர்வாழ்வதும் முதுமை அடைவதும் மட்டுமல்லாமல் மேலும் வலிமை பெறுகிறார்கள் என்ற படிப்படியான வலியுறுத்தலைக் காக்கிறது.
- source_word: גָּבְרוּ
  choice: வலிமை பெறுகிறார்கள்
  rationale: வலிமை, ஆற்றல் அல்லது செல்வாக்கில் பெருகுதல் என்ற வினையின் அடிப்படை உணர்வைத் தருகிறது.
- source_word: חָיִל
  choice: செல்வத்தில்
  rationale: தீயவர்களின் வளமான நிலையைப் பற்றிய இச்சூழலில் செல்வம் அல்லது பொருள்வளம் என்ற பொருள் பொருத்தமானது; மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
