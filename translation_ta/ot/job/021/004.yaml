source:
  edition: WLC
  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: ta
  text: என்னைப் பொறுத்தவரை, என் முறையீடு மனிதனிடமா? அப்படியில்லை என்றால், என் ஆவி ஏன் பொறுமையிழக்கக் கூடாது?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: என் முறையீடு
  rationale: இச்சூழலில் யோபுவின் புலம்பலும் எதிர்வாதமும் கலந்த உரையைச் சுட்டுகிறது; ‘முறையீடு’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאָדָם
  choice: மனிதனிடமா
  rationale: לְ என்பதன் திசை/முகப்பு சார்ந்த பொருளைத் தக்கவைத்து, யோபுவின் முறையீடு மனிதனை நோக்கியதா என்ற கேள்வியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: எபிரெயச் சொல்லின் உருவகத் திறப்பையும் உள்நிலைப் பொருளையும் குறுக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: תִקְצַר
  choice: பொறுமையிழக்க
  rationale: ‘ஆவி குறுகுதல்’ என்ற எபிரெய மொழிவழக்கின் சூழல்பொருள் பொறுமையின்மை அல்லது சகிப்புத்தன்மை குறைதல்; நவீனத் தமிழில் இயல்பாக அளிக்கப்படுகிறது.
theological_decisions:
- issue: யோபுவின் முறையீடு யாரை நோக்கியது
  choice: ‘மனிதனிடமா?’ என்ற கேள்வியின் மறுப்புச் சாயலைத் தொடர்ந்து வரும் ‘அப்படியில்லை என்றால்’ என்பதன் மூலம் தக்கவைத்தல்
  alternative: ‘மனிதனுக்கு எதிராகவா?’ அல்லது இரண்டாம் கேள்வியை நேரடியாக ‘ஏன்’ என்று தொடங்குதல்
  rationale: மூலத்தின் לְאָדָם என்பதைக் ‘எதிராக’ என மிகத் தெளிவுபடுத்தாமல் வைத்ததுடன், וְאִם என்பதிலுள்ள நிபந்தனைத் தொடர்பையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தின் இரண்டு வினாக்குறி அமைப்பும், இரண்டாம் வாக்கியத்தின் தர்க்கத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
