  to: 'எத்தனை முறை அவர்கள் காற்றின் முன் வைக்கோலைப் போலவும்,

    புயல் பறித்துச் செல்லும் பதரைப் போலவும் ஆவார்கள்?[a]'
  rationale: The revision represents the line as the continuation of the rhetorical question in the preceding verse, rather than as an independent wish. It also improves the Tamil idiom and retains the lexical footnote for the Hebrew verb’s literal ‘steal’ sense. The explicit ‘எத்தனை முறை’ reflects the inherited interrogative scope and does not add a new claim.
