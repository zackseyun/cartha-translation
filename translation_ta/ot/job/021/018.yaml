  text: יִהְי֗וּ כְּ/תֶ֥בֶן לִ/פְנֵי ר֑וּחַ וּ֝/כְ/מֹ֗ץ גְּנָבַ֥תּ/וּ סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: ta
  text: 'எத்தனை முறை அவர்கள் காற்றின் முன் வைக்கோலைப் போலவும்,

    புயல் பறித்துச் செல்லும் பதரைப் போலவும் ஆவார்கள்?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் ‘திருடிச் செல்லும்’; இங்கு ‘பறித்துச் செல்லும்’ என்றும் மொழிபெயர்க்கலாம். புயல் திடீரென அகற்றுவதை இது கவிதைநயத்துடன் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: ஆவார்களாக
  rationale: இச்சூழலில் இந்த நிறைவுறா வினைமுற்று விருப்பம் அல்லது வேண்டுதல் போன்ற நுணுக்கத்தைக் கொண்டதாகப் புரிந்துகொள்ளலாம். ‘ஆவார்களாக’ என்பது அதைப் பெருமிதமில்லாத, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘ஆகிறார்கள்’ என்று மொழிபெயர்ப்பது அந்த முறைநிலையை மறைத்துவிடும்.
- source_word: כְּתֶבֶן
  choice: வைக்கோலைப் போல
  rationale: תבן என்பது பொதுவாக அறுவடைக்குப் பின் கிடைக்கும் உலர்ந்த தண்டுகளான வைக்கோலைக் குறிக்கிறது. ‘வைக்கோல்’ நவீன வாசகர்களுக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִפְנֵי רוּחַ
  choice: காற்றுக்கு முன்னால்
  rationale: காற்றின் விசைக்கு முன்பாகத் தள்ளப்படும் பொருளின் உருவகத்தை இந்தச் சொற்றொடர் காட்டுகிறது. ‘காற்றுக்கு முன்னால்’ எபிரெய உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וּכְמֹץ
  choice: பதரைப் போலவும்
  rationale: מֹץ என்பது தானியத்திலிருந்து பிரிக்கப்படும் இலகுவான கழிவான பதரைக் குறிக்கிறது. காற்றில் பறந்துபோகும் நிலையின்மையின் உருவகத்திற்கு ‘பதர்’ துல்லியமான தமிழ்ச் சொல்.
- source_word: גְּנָבַתּוּ
  choice: அடித்துச் செல்லும்
  rationale: גנב என்பதன் அடிப்படைப் பொருள் ‘திருடுதல்’; ஆனால் புயலுடன் வரும் இந்தக் கவிதைச் சேர்க்கையில் திடீரெனப் பறித்துக்கொண்டு போதலைக் குறிக்கிறது. ‘அடித்துச் செல்லும்’ என்பது தமிழில் புயலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது; சொல்லடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: סוּפָה
  choice: புயல்
  rationale: סוּפָה என்பது புயல் அல்லது கடும்புயலைக் குறிக்கிறது. ‘புயல்’ தெளிவானதும், ‘சுழற்காற்று’ போன்ற குறுகிய பொருளைத் தேவையின்றி புகுத்தாததும் ஆகும்.
theological_decisions:
- issue: 'வாக்கியத்தின் முறைநிலை: வேண்டுதலா அல்லது சாதாரண கூற்றா'
  choice: ‘ஆவார்களாக’ என்ற விருப்ப/வேண்டுதல் வடிவம்
  alternative: ‘ஆகிறார்கள்’ அல்லது முந்தைய வசனத்தின் ‘எத்தனை முறை’ என்பதுடன் இணைத்து ‘எத்தனை முறை ... ஆகிறார்கள்?’
  rationale: יִהְיוּ வடிவமும் யோபின் கவிதைச் சொல்லோட்டமும் விருப்பத்தன்மையுள்ள வாசிப்பை அனுமதிக்கின்றன; அதையே முதன்மை உரை வெளிப்படுத்துகிறது. இருப்பினும், தொடரமைப்பின் காரணமாகக் கேள்வியின் தொடர்ச்சியாக வாசிப்பதும் இலக்கணரீதியாகச் சாத்தியம்; முதன்மை உரை அந்த மாற்று வாசிப்பை இறையியல் முடிவால் நிராகரிப்பதற்காகத் தேர்ந்தெடுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வைக்கோல்—பதர்’ மற்றும் ‘காற்று—புயல்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் ஒத்திசைவைத் தக்கவைக்கிறது.
