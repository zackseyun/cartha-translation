  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: ta
  text: 'அவனுடைய நடத்தையை அவன் முகத்துக்கு நேராக எடுத்துச் சொல்பவன் யார்?[a]


    அவன் செய்ததற்காக[b] அவனுக்குப் பதில் செலுத்துபவன் யார்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் முன்னிலையில்.” சொல்லுக்குச் சொல், “அவன் முகத்தின்மேல்”; இது நேரடியாக எதிர்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயம் சுருக்கமாக, “அவன் செய்தான்; அவனுக்குப் பதில் செலுத்துபவன் யார்?” என்கிறது. இங்கு அதன் பொருள் “அவன் செய்ததற்காக” என்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: யார்?
  rationale: இரு அடிகளிலும் எதிர்மறையான விடையை உணர்த்தும் வினாவாக இருந்தாலும், எபிரெய உரையின் வினா வடிவம் அப்படியே காக்கப்படுகிறது.
- source_word: יַגִּיד
  choice: எடுத்துச் சொல்பவன்
  rationale: נגד என்பதன் ஹிப்இல் வடிவம் ‘தெரிவித்தல், அறிவித்தல்’ என்று பொருள்படும்; இங்கு ஒருவனுடைய நடத்தையை அவன் முன்னிலையில் வெளிப்படையாகச் சுட்டிக்காட்டும் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עַל פָּנָיו
  choice: அவன் முகத்துக்கு நேராக
  rationale: சொல்லெழுத்தாக ‘அவன் முகத்தின்மேல்’; ஒருவரை அவரது முன்னிலையில் நேரடியாக எதிர்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
- source_word: דַּרְכּוֹ
  choice: அவனுடைய நடத்தை
  rationale: דֶּרֶךְ என்பதன் ‘வழி’ என்ற உருவகப் பொருள் இச்சூழலில் ஒருவனின் வாழ்க்கை முறை அல்லது நடத்தையைக் குறிக்கிறது. ‘நடத்தை’ சாதாரண வாசகருக்கு பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְהוּא עָשָׂה
  choice: அவன் செய்ததற்காக
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாக ‘அவன் செய்தான்’ என உள்ளது; அடுத்துள்ள கைம்மாறு பற்றிய வினாவுடன் அதன் தொடர்பைத் தமிழில் தெளிவாக்க ‘செய்ததற்காக’ என வழங்கப்படுகிறது, மேலும் மாற்று நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְשַׁלֶּם לוֹ
  choice: அவனுக்குப் பதிலளிப்பவன்
  rationale: שלם என்பதன் பிஎல் வடிவம் இங்கு ஒருவனது செயலுக்குத் தக்க கைம்மாறு செய்வதைக் குறிக்கிறது. ‘பதிலளித்தல்’ செயற்பலனைத் திருப்பிக் கொடுக்கும் நீதிசார் நுணுக்கத்தைத் தாங்குகிறது; இது வெறும் வாய்மொழிப் பதில் அல்ல.
theological_decisions:
- issue: கேள்விகளின் மறைமுக எதிர்மறைப் பொருள்
  choice: ‘யார்?’ என்ற வினா வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘ஒருவனும் இல்லை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இங்கு தீயவனின் அதிகாரத்தையோ தண்டனையிலிருந்து அவன் தப்புவதையோ வலியுறுத்தும் சொல்லாட்சித் திறனுடைய வினாக்கள் உள்ளன. அவற்றை நேரடி மறுப்பாக மாற்றாமல் இருப்பது மூலத்தின் பதற்றத்தையும் வாதநடையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் மொழியாக்கப்பட்டுள்ளது. ‘முகத்துக்கு நேராக’ நேரடி எதிர்கொள்ளுதலைக் காக்கிறது; ‘நடத்தை’ உருவகமான ‘வழி’ என்பதன் சூழற்பொருளைத் தெளிவாக்குகிறது. இரண்டாம் அடியின் எபிரெயச் சுருக்கம் முதன்மை உரையில் மென்மையாக்கப்பட்டு, அதன் நேரடி அமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
