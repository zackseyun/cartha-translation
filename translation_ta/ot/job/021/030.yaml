source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: ta
  text: ஏனெனில், தீயவன் பேரிடரின் நாளுக்காகக் காப்பாற்றப்படுகிறான்[a]; கடுஞ்சினத்தின் நாளுக்காக அவர்கள் கொண்டுசெல்லப்படுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவன் பேரிடரின் நாளுக்காகத் தடுத்து வைக்கப்படுகிறான்” அல்லது “ஒதுக்கி வைக்கப்படுகிறான்.” எபிரெய வினைச்சொல் “காப்பாற்றப்படுகிறான்,” “தடுத்து வைக்கப்படுகிறான்,” அல்லது “ஒதுக்கி வைக்கப்படுகிறான்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் கடுஞ்சினத்தின் நாளுக்காகக் கொண்டுவரப்படுகிறார்கள்.” இறுதி வினைச்சொல் அந்த நாளுக்காகக் கொண்டுசெல்லப்படுவதையோ கொண்டுவரப்படுவதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; சூழலின் வாதத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: לְיוֹם אֵיד
  choice: பேரழிவின் நாளுக்காக
  rationale: לְ என்பது வரவிருக்கும் ஒரு நாளை நோக்கிய காலத் தொடர்பைக் காட்டுகிறது; אֵיד என்பது அழிவு, பேரிடர், கேடு ஆகிய பொருள்களைக் கொண்டது. ‘பேரழிவின் நாள்’ அதன் தீவிரத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יֵחָשֶׂךְ
  choice: தப்பவைக்கப்படுகிறான்
  rationale: חשׂך என்பதன் நிபால் வடிவம் ‘தப்பவைக்கப்படுதல்,’ ‘தடுத்து வைக்கப்படுதல்,’ அல்லது ‘ஒதுக்கிவைக்கப்படுதல்’ என்று பொருள்படலாம். முதன்மை உரை உடனடி அழிவிலிருந்து தப்பவைக்கப்படும் கருத்தைத் தருகிறது; எதிர்காலத்திற்காக ஒதுக்கிவைக்கப்படுதல் என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: רָע
  choice: தீயவன்
  rationale: ஒருமை பெயரடையான இது பெயர்ச்சொல்லாகப் பயன்பட்டு ஒரு தீய அல்லது பொல்லாத நபரைக் குறிக்கிறது. ‘தீயவன்’ ஒருமையையும் பிரதிநிதித்துவப் பொருளையும் சுருக்கமாகக் காக்கிறது.
- source_word: לְיוֹם עֲבָרוֹת
  choice: கடுங்கோபத்தின் நாளுக்காக
  rationale: עֲבָרוֹת என்பது பெருக்கெடுக்கும் சினம் அல்லது கடும் கோபத்தைக் குறிக்கும் பன்மை வடிவம்; இங்கு பன்மை தீவிரத்தை உணர்த்துவதாகக் கொள்ளப்படுகிறது. ‘கடுங்கோபம்’ அந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוּבָלוּ
  choice: அவர்கள் கொண்டுசெல்லப்படுகிறார்கள்
  rationale: יבל என்பதன் ஹோபால் வடிவம் ‘கொண்டுவரப்படுதல்,’ ‘கொண்டுசெல்லப்படுதல்,’ அல்லது ‘வழிநடத்தப்படுதல்’ என்று பொருள்படும். எபிரெய உரையில் ஒருமையிலிருந்து பன்மைக்கு ஏற்படும் மாற்றத்தை ‘அவர்கள்’ காக்கிறது; செல்லும் திசையையோ செய்பவரையோ தேவையின்றி குறிப்பாக்கவில்லை.
theological_decisions:
- issue: இறைத் தீர்ப்புடன் தொடர்புடைய வசனத்தின் காலப்பொருள்
  choice: தீயவர் உடனடி பேரழிவிலிருந்து தப்பவைக்கப்பட்டு, வரவிருக்கும் கடுங்கோபத்தின் நாளை நோக்கிக் கொண்டுசெல்லப்படுகிறார்கள்.
  alternative: தீயவர் பேரழிவின் நாளை அனுபவிக்காதபடி முற்றிலும் விலக்கிக் காக்கப்படுகிறார்கள்; அல்லது கடுங்கோபத்தின் நாளை எதிர்கொள்ள அப்போதே வெளியே கொண்டுவரப்படுகிறார்கள்.
  rationale: לְיוֹם என்ற இணையான காலச் சொற்றொடர்களும் இரு செயப்பாட்டு வினைகளும் எதிர்காலத் தீர்ப்புக்காகத் தப்பவைத்தல் அல்லது ஒதுக்கிவைத்தல் என்ற பொருளை இயல்பாக ஆதரிக்கின்றன. ஆயினும், எபிரெய வினைகளிலுள்ள மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன; இறைத் தீர்ப்பின் நேரத்தை மொழிபெயர்ப்பு தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் ஒருமை ‘தீயவன்’ என்பதிலிருந்து பன்மை ‘அவர்கள்’ என்பதற்கான திடீர் மாற்றம் அப்படியே காக்கப்பட்டுள்ளது. ‘தப்பவைக்கப்படுகிறான்’ மற்றும் ‘கொண்டுசெல்லப்படுகிறார்கள்’ என்பவற்றின் உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டுள்ளது.
