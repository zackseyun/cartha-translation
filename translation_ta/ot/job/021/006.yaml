  text: וְ/אִם זָכַ֥רְתִּי וְ/נִבְהָ֑לְתִּי וְ/אָחַ֥ז בְּ֝שָׂרִ֗/י פַּלָּצֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: ta
  text: நான் அதை நினைக்கும்போது திகிலடைகிறேன்; என் உடலை நடுக்கம் பற்றிக்கொள்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם זָכַרְתִּי
  choice: நான் அதை நினைக்கும்போது
  rationale: இங்கு אִם சொல்லாட்சியில் காலநிலைப் பொருளில், ‘நினைக்கும்போது’ என இயல்பாகப் புரிகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைத் தமிழில் தேவையான ‘அதை’ மூலம் முந்தைய கருத்தோடு இணைக்கிறது.
- source_word: וְנִבְהָלְתִּי
  choice: திகிலடைகிறேன்
  rationale: בהל வேரின் திடுக்கம், அச்சம், மனக்கலக்கம் ஆகிய வலுவான உணர்வை ‘திகிலடைகிறேன்’ நேர்த்தியாக வெளிப்படுத்துகிறது.
- source_word: וְאָחַז בְּשָׂרִי פַּלָּצוּת
  choice: என் உடலை நடுக்கம் பற்றிக்கொள்கிறது
  rationale: אָחַז என்பதன் ‘பற்றிக்கொள்’ உருவகத்தையும், בשר என்பதன் உடல் சார்ந்த பொருளையும், פלצות என்பதன் நடுக்கம்/திகில் உணர்வையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் இரண்டு இணை வாக்கியங்களும், நினைவால் எழும் மனத் திகிலும் உடல் நடுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
