  source_fidelity: 'The Tamil accurately represents the Hebrew sequence: recollection leads to dismay, followed by a physical seizure of trembling. The supplied object “அதை” is a natural Tamil clarification of the implied referent and does not materially narrow the sense. “நடுக்கம் பற்றிக்கொள்கிறது” appropriately retains the Hebrew image of trembling/horror taking hold of the speaker''s flesh.'
