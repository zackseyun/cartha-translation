  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: ta
  text: கடவுளுக்கு யாராவது அறிவைக் கற்றுக்கொடுக்க முடியுமா? உயர்ந்தவர்களை நியாயந்தீர்ப்பவர் அவரே அல்லவா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்ந்தவர்கள்’ என்பது உயர்ந்த பதவியிலுள்ளவர்களையோ, ஒருவேளை வானுலக உயிர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: யாராவது கடவுளுக்கு ... கற்றுக்கொடுக்க முடியுமா?
  rationale: לְאֵל என்பது ‘கடவுளுக்கு’ என நேரடியாகப் பொருள்படும்; கேள்வித் துகள் הֲ இதை மறுப்பை எதிர்பார்க்கும் வினாவாக ஆக்குகிறது. இயல்பான தமிழுக்காக மறைந்துள்ள பொதுவான எழுவாய் ‘யாராவது’ என்றும், வினாவின் சாத்தியத்தன்மை ‘முடியுமா’ என்றும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְלַמֶּד
  choice: கற்றுக்கொடுக்க
  rationale: למד என்பதன் பியேல் வடிவம் ‘கற்பி/அறிவுறுத்து’ என்று பொருள்படும். இங்கு ‘கற்றுக்கொடுக்க’ என்பது நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: דָּעַת
  choice: அறிவை
  rationale: דעת குறிக்கும் அறிவு/அறிதலை அருவப்பெயராகவே தக்கவைக்க ‘அறிவு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וְהוּא
  choice: அவர் ... போது
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவரோ/அவர்’ என இணைக்கிறது. சூழலில் இது வினாவுக்கான ஆதாரத்தை வழங்கினாலும், காரண உறவை மிகத் திட்டவட்டமாக்காமல் தமிழ் வாக்கியத்தில் ‘...போது’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: רָמִים
  choice: உயர்ந்தவர்களை
  rationale: רום வேரிலிருந்து வந்த ஆண்பால் பன்மை பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘உயர்ந்தவர்கள்’ என்பது பூமிக்குரிய அதிகாரிகளையோ பரலோக உயிர்களையோ மட்டும் குறிப்பதாகச் சுருக்காமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יִשְׁפּוֹט
  choice: நியாயந்தீர்க்கிற
  rationale: שפט என்பதன் கால் வடிவத்தின் அடிப்படைப் பொருள் ‘நியாயந்தீர்/தீர்ப்பளி.’ கடவுளின் நீதித்தீர்ப்புச் செயலைத் தெளிவாகக் காட்ட ‘நியாயந்தீர்க்கிறார்’ என்ற சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: רָמִים என்பதன் குறிப்பு
  choice: ‘உயர்ந்தவர்கள்’ என்ற பரந்த, நோக்கத்துடன் தெளிவுபடுத்தப்படாத குறிப்பு
  alternative: ‘பரலோக உயிர்கள்’ அல்லது ‘உயர் பதவியிலுள்ள ஆட்சியாளர்கள்’
  rationale: எபிரெயச் சொல் உயர்ந்த நிலையிலுள்ளவர்களைப் பொதுவாகக் குறிக்க முடியும். அவர்கள் பரலோக உயிர்களா அல்லது பூமிக்குரிய அதிகாரிகளா என்பதை வசனம் தீர்மானிக்காததால், மொழிபெயர்ப்பும் அந்த இறையியல் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நியாயந்தீர்க்க’ என்பது வேதாகமச் சூழலுக்கு ஏற்றதாய் இருந்தாலும் இன்றும் புரியக்கூடிய சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது; கடவுளைக் குறிக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
