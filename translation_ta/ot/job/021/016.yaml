  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: ta
  text: இதோ, அவர்களுடைய செழிப்பு அவர்களுடைய கையில் இல்லையா? தீயவர்களின் ஆலோசனை என்னைவிட்டு வெகு தொலைவில் உள்ளது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய உரையிடைச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: טוּבָם
  choice: அவர்களுடைய செழிப்பு
  rationale: சூழலில் தீயவர்களின் பொருளாதார நல்வாழ்வையும் வளத்தையும் குறிக்கிறது; பொதுவான ‘நன்மை’ என்பதைவிட இங்கு ‘செழிப்பு’ தெளிவானது.
- source_word: בְיָדָם
  choice: அவர்களுடைய கையில்
  rationale: கட்டுப்பாடு அல்லது அதிகாரத்தைக் குறிக்கும் மூலமொழியின் உருவகத்தை அப்படியே காக்கிறது.
- source_word: עֲצַת רְשָׁעִים
  choice: தீயவர்களின் ஆலோசனை
  rationale: ‘திட்டம்’ என்றும் பொருள்படக்கூடிய עֵצָה என்பதன் அறிவுரை/சிந்தனை சார்ந்த பரப்பை ‘ஆலோசனை’ காக்கிறது.
- source_word: רָחֲקָה מֶנִּי
  choice: எனக்கு வெகுதொலைவில் இருக்கிறது
  rationale: யோபு தீயவர்களின் ஆலோசனையைத் தன்னிடமிருந்து விலக்கிக் கூறும் மூல உருவகத்தையும் நிகழ்காலப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: முதல் அரையடியை வினாவாகவா கூற்றாகவா வாசிப்பது
  choice: ‘அவர்களுடைய செழிப்பு அவர்களுடைய கையில் இல்லை’ என்ற கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களுடைய செழிப்பு அவர்களுடைய கையில்தானே இருக்கிறது?’ அல்லது ‘அவர்களுடைய கையில் இல்லையா?’ என்ற வினா வாசிப்பு.
  rationale: WLC உரையில் לֹא நேரடியான மறுப்பாக உள்ளது; வெளிப்படையான வினாக் குறியீடு இல்லை. ஆகவே எபிரேய உரையின் மிக இயல்பான தொடரமைப்பைப் பின்பற்றி கூற்றாக வைத்தோம்; சூழலில் உள்ள வாதத் திணறலை விளக்கமாகத் தீர்த்துவிடவில்லை.
- issue: ‘தீயவர்களின் ஆலோசனை எனக்கு வெகுதொலைவில்’ என்பதன் தன்மை
  choice: யோபுவின் விலகியிருக்கும் நிலையை நேரடியாகக் காக்கப்பட்டது.
  alternative: ‘அவர்களின் சிந்தனையை நான் முற்றிலும் நிராகரிக்கிறேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலத்தின் இடவுருவகம் திட்டமிட்டே காக்கப்பட்டது; இதனால் அறநெறி சார்ந்த மறுப்பு வெளிப்பட்டாலும், உரையில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ளது. எபிரேய இணை அமைப்பும் ‘கையில்’/‘வெகுதொலைவில்’ என்ற இரு இடவுருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
