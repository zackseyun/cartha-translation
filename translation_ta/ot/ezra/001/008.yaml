  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: ta
  text: பெர்சியாவின் அரசன் கோரேசு, கருவூல அதிகாரியான மித்ரேதாத் மூலம்[a] அவற்றை வெளியே கொண்டுவந்து, யூதாவின் தலைவரான[b] சேஷ்பத்சாருக்கு அவற்றை எண்ணிக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “மித்ரேதாத்தின் கையால்”; இந்த எபிரேய மரபுத்தொடருக்கு “மித்ரேதாத் மூலமாக” என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “யூதாவின் இளவரசர்” அல்லது “யூதாவின் ஆளுநர்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் பொதுவாக ஒரு தலைவர் அல்லது ஆட்சியாளரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: அவற்றை வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும். முந்தைய வசனத்தில் கூறப்பட்ட ஆலயப் பொருட்களே பன்மைச் சுட்டுப்பெயரின் குறிப்பு.
- source_word: עַל יַד
  choice: மூலம்
  rationale: சொல்லுக்குச் சொல் ‘கையால்’ என்ற எபிரேய மரபுத்தொடர் இங்கு செயல் நிறைவேற்றப்பட்ட வழிமுறையையோ முகவரையையோ குறிக்கிறது; நவீன தமிழில் ‘மூலம்’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: מִתְרְדָת
  choice: மித்ரேதாத்
  rationale: பாரசீகப் பெயரின் எபிரேய வடிவத்தைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הַגִּזְבָּר
  choice: பொருளாளர்
  rationale: கருவூலம் அல்லது பொருட்களுக்குப் பொறுப்பான அதிகாரியைக் குறிக்கிறது; சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்.
- source_word: וַיִּסְפְּרֵם
  choice: அவற்றை எண்ணி ஒப்படைத்தான்
  rationale: ספר இங்கு பொருட்களை எண்ணுதல் அல்லது பட்டியலிடுதல் எனப் பொருள்படும். לְשֵׁשְׁבַּצַּר உடன் சேர்ந்த சூழலில் எண்ணி அவரிடம் கொடுத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘எண்ணினான்’ என்ற அடிப்படைப் பொருளும் காக்கப்படுகிறது.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: சேஷ்பத்சாரிடம்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, לְ முன்னிடைச்சொல் பெறுநரைக் குறிக்கும் ‘-இடம்’ வேற்றுமையால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַנָּשִׂיא
  choice: தலைவர்
  rationale: נָשִׂיא என்பது தலைவர், முதன்மையானவர் அல்லது இளவரசர் எனப் பொதுவாகக் குறிக்கலாம். வம்ச வழி இளவரசர் அல்லது குறிப்பிட்ட பாரசீக ஆளுநர் பதவி என்ற கருத்தைத் திணிக்காமல் ‘தலைவர்’ அகன்ற பொருளைக் காக்கிறது.
- source_word: לִיהוּדָה
  choice: யூதாவின்
  rationale: சேஷ்பத்சார் யூதாவுடன் கொண்டுள்ள தலைமைத் தொடர்பை இயல்பான தமிழ் உடைமைத் தொடரால் தெரிவிக்கிறது.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: பெர்சிய அரசன் கோரேசு
  rationale: அரசனின் பெயர், பதவி, ஆட்சி நாடு ஆகிய அனைத்தையும் இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
theological_decisions:
- issue: הַנָּשִׂיא என்பதன் பதவிப் பொருள்
  choice: தலைவர்
  alternative: இளவரசர்; ஆளுநர்
  rationale: மூலச்சொல் பொதுவாக ஒரு முதன்மைத் தலைவர் அல்லது ஆட்சியாளரைக் குறிக்கிறது. ‘இளவரசர்’ மரபுரிமை அரச அந்தஸ்தையும் ‘ஆளுநர்’ குறிப்பிட்ட நிர்வாகப் பதவியையும் ஊகிக்கச் செய்யலாம்; ஆகவே தெளிவின்மையைப் பாதுகாக்க ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவற்றை’ என்பது முந்தைய வசனத்தின் ஆலயப் பொருட்களைக் குறிக்கிறது. பெயர்கள் மூல எபிரேய வடிவங்களை அடிப்படையாகக் கொண்டு தமிழ் ஒலிப்புக்கு ஏற்றவாறு வழங்கப்பட்டுள்ளன.
