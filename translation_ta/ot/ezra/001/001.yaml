revisions:
- from: 'பெர்சியாவின் அரசனாகிய கோரேசின் முதலாம் ஆண்டில், எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட யாவேயின் வார்த்தை நிறைவேறும்படி[a], யாவே பெர்சியாவின் அரசனாகிய கோரேசின் உள்ளுணர்வைத் தூண்டினார்[b]. அதனால் கோரேசு தன் அரசு முழுவதும் ஓர் அறிவிப்பைப் பரப்பி, அதை எழுத்திலும் வெளியிட்டார்[c]:'
  to: 'பெர்சியாவின் அரசனான கோரேசின் முதலாம் ஆண்டில், எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட[a] யாவேயின் வார்த்தை நிறைவேறும்படி, யாவே பெர்சியாவின் அரசனான கோரேசின் ஆவியைத் தூண்டினார்[b]. அவர் தன் அரசாட்சி முழுவதும் ஓர் அறிவிப்பைப் பரப்பி, எழுத்து வடிவிலும் அறிவித்தார்[c]:'
  rationale: ‘உள்ளுணர்வு’ என்பதற்கு மாற்றாக ‘ஆவி’ பயன்படுத்தப்பட்டுள்ளது; இது רוּחַ-இன் சொல்லியல் அகலத்தையும் மூலத்தின் மொழிநடையையும் காக்கிறது. தேவையற்ற வலுவான காரணவியல் இணைப்பான ‘அதனால்’ நீக்கப்பட்டுள்ளது. இராச்சியத்தின் ஆட்சிப்பரப்பைத் தெளிவுபடுத்த ‘அரசாட்சி முழுவதும்’ பயன்படுத்தப்பட்டு, எழுத்திலான அறிவிப்பும் மூலத்துக்கு நெருக்கமாகச் சொல்லப்பட்டுள்ளது. அடிக்குறிப்பு a இப்போது ‘வாய்மூலம்’ என்ற தொடர்புடைய சொற்றொடரிலேயே இணைக்கப்பட்டுள்ளது.
