source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: ta
  text: 'பெர்சியாவின் அரசனான கோரேசின் முதலாம் ஆண்டில், எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட[a] யாவேயின் வார்த்தை நிறைவேறும்படி, யாவே பெர்சியாவின் அரசனான கோரேசின் ஆவியைத் தூண்டினார்[b]. அவர் தன் அரசாட்சி முழுவதும் ஓர் அறிவிப்பைப் பரப்பி, எழுத்து வடிவிலும் அறிவித்தார்[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “எரேமியாவின் வாயிலிருந்து வந்த யாவேயின் வார்த்தை நிறைவடையும்படி.” “எரேமியாவின் வாய்மூலம்” என்பது யாவேயின் வார்த்தையை அறிவித்த மனிதப் பேச்சாளராக எரேமியா இருந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆவி” என்பதற்கான எபிரெயச் சொல் “மனநிலை” அல்லது “உள்ளார்ந்த உந்துதல்” என்றும் பொருள்படலாம்.
    reason: lexical_ambiguity
  - marker: c
    text: நேர்ச்சொல்லாக, “தன் அரசாட்சி முழுவதும் ஓர் அறிவிப்பைக் கடந்து செல்லச் செய்து, எழுத்திலும்.” இது அதிகாரப்பூர்வ அறிவிப்பைப் பொதுவாகப் பரப்பியதைக் குறிக்கிறது.
    reason: idiom
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: முதலாம் ஆண்டில்
  rationale: எபிரெய காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; தொடக்க வாவ் இங்கு கதைத் தொடர்ச்சியைச் சுட்டுவதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: பெர்சியாவின் அரசனாகிய கோரேசின்
  rationale: அரசரின் பெயரையும் பட்டத்தையும் தெளிவான தமிழ் உடைமைத் தொடரில் வழங்குகிறது.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை நிறைவேறும்படி
  rationale: ‘வார்த்தையை நிறைவுக்குக் கொண்டுவருதல்’ என்ற மூலப்பொருளை, தீர்க்கதரிசன வார்த்தை வரலாற்றில் செயல்படுவதைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: מִפִּי יִרְמְיָה
  choice: எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட
  rationale: ‘எரேமியாவின் வாயிலிருந்து’ என்ற எபிரெய உவமையைப் பாதுகாத்தபடி, அவர் மனிதப் பேச்சாளராக இருந்ததைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֵעִיר אֶת רוּחַ כֹּרֶשׁ
  choice: கோரேசின் உள்ளுணர்வைத் தூண்டினார்
  rationale: רוּחַ என்பதன் ‘ஆவி, மனநிலை, உள்ளார்ந்த உந்துதல்’ என்ற பொருள் பரப்பை இச்சூழலில் புரியத்தக்க தமிழில் தருகிறது; அது வெறும் அறிவாற்றலை மட்டும் குறிக்கும் வகையில் சுருக்கப்படவில்லை.
- source_word: וַיַּעֲבֶר קוֹל
  choice: ஓர் அறிவிப்பைப் பரப்பி
  rationale: அறிவிப்பை அரசு முழுவதும் செல்லச் செய்தல் என்ற எபிரெய மரபுத்தொடரின் அதிகாரப்பூர்வப் பொது அர்த்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: தன் அரசு முழுவதும்
  rationale: அறிவிப்பு பரவிய முழு ஆட்சிப்பரப்பையும் தெளிவாகக் குறிக்கிறது.
- source_word: וְגַם בְּמִכְתָּב
  choice: அதை எழுத்திலும் வெளியிட்டார்
  rationale: வாய்வழிப் பொது அறிவிப்புடன் எழுத்து வடிவமும் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: தொடர்ந்து வரும் நேரடிக் கூற்றை தமிழில் இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பு பாதுகாக்கிறது.
- issue: לִכְלוֹת דְּבַר יְהוָה என்பதன் நிறைவேற்ற மொழி
  choice: யாவேயின் வார்த்தை நிறைவேறும்படி
  alternative: யாவேயின் வார்த்தையை நிறைவுக்குக் கொண்டுவரும்படி
  rationale: கோரேசின் நடவடிக்கையைத் தீர்க்கதரிசன வார்த்தையின் வரலாற்று நிறைவேற்றமாக வசனம் அமைக்கிறது; அதற்கு மேல் எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
- issue: רוּחַ כֹּרֶשׁ என்பதன் பொருள்
  choice: கோரேசின் உள்ளுணர்வு
  alternative: கோரேசின் ஆவி
  rationale: இங்கு அரசனைச் செயல்படத் தூண்டும் உள்ளார்ந்த மனப்பாங்கு அல்லது உந்துதல் குறிக்கப்படுகிறது. ‘உள்ளுணர்வு’ வாசிப்புத் தெளிவை அளிக்கிறது; மூலச்சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, கண்ணியமும் பொதுவாசிப்புத் தெளிவும் கொண்ட நடை. அரசவைக் காலக் குறிப்பு மற்றும் தீர்க்கதரிசன நிறைவேற்றத் தொடர்பு பாதுகாக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடர்களின் நேரடி வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
