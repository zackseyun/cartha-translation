  revised_text: 'பெர்சியாவின் அரசனான கோரேசின் முதலாம் ஆண்டில், எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட[a] யாவேயின் வார்த்தை நிறைவேறும்படி, யாவே பெர்சியாவின் அரசனான கோரேசின் ஆவியைத் தூண்டினார்[b]. அவர் தன் அரசாட்சி முழுவதும் ஓர் அறிவிப்பைப் பரப்பி, எழுத்து வடிவிலும் அறிவித்தார்[c]:'
