revisions:
- from: அப்போது யூதா, பென்யமீன் ஆகியோரின் தந்தைவழிக் குடும்பத் தலைவர்களும், ஆசாரியர்களும், லேவியர்களும்—கடவுள் எவர்களுடைய உள்ளார்ந்த ஆவியைத் தூண்டினாரோ அவர்கள் அனைவரும்—எருசலேமில் இருக்கிற யாவேயின் இல்லத்தைக் கட்டுவதற்காக அங்கே செல்ல எழுந்தார்கள்.[a][b]
