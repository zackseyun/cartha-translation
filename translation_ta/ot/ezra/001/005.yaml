base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: ta
  text: அப்போது, யூதா மற்றும் பென்யமீன் கோத்திரங்களின் தந்தைவழிக் குடும்பத் தலைவர்களும், ஆசாரியர்களும், லேவியர்களும், கடவுள் யாருடைய ஆவியைத் தூண்டினாரோ அவர்கள் அனைவரும்[a], எருசலேமில் உள்ள யாவேயின் இல்லத்தைக்[b] கட்டுவதற்காக மேலே செல்ல எழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவி” என்பதை “மனம்” என்றும் பொருள்படுத்தலாம்; முழுத் தொடரை “கடவுள் யாரை உள்ளத்தில் தூண்டினாரோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாவேயின் இல்லம்” என்பது இங்கு ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: எழுந்தார்கள்
  rationale: קום என்பதன் கால் வடிவம் பதிலளிக்கும் செயலின் தொடக்கத்தைக் குறிக்கிறது; பயணத்தைத் தொடங்கிவிட்டார்கள் என்று மிகைப்படுத்தாமல் கதை நகர்வைப் பேணுகிறது.
- source_word: רָאשֵׁ֣י הָאָב֗וֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: மூதாதையர் வழிக் குடும்ப அமைப்பின் தலைவர்களைக் குறிக்கும் சமூகச் சொல்லை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִֽיהוּדָה֙ וּבִנְיָמִ֔ן
  choice: யூதா, பென்யமீன் ஆகியோரின்
  rationale: לְ இங்கு திசையையல்ல, கோத்திரச் சார்பைக் குறிக்கிறது.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும், லேவியர்களும்
  rationale: வழிபாட்டு மற்றும் கோத்திரக் குழுக்களுக்கான வழக்கமான தமிழ் வேதாகமச் சொற்கள்.
- source_word: לְכֹ֨ל הֵעִ֤יר הָאֱלֹהִים֙ אֶת־רוּח֔וֹ
  choice: கடவுள் எவர்களுடைய உள்ளார்ந்த ஆவியைத் தூண்டினாரோ அவர்கள் அனைவரும்
  rationale: கடவுளின் உள்தூண்டுதலைத் தெளிவாக வைத்தபடியே, רוּחַ இங்கு உள்ளார்ந்த மனப்பாங்கு அல்லது இயக்கும் ஆவியைக் குறிக்கும் நுட்பத்தையும் காக்கிறது.
- source_word: לַעֲל֣וֹת
  choice: அங்கே செல்ல
  rationale: எருசலேமுக்குச் செல்வதற்கான עלה என்ற மரபுவழிச் சொல்லை இயல்பான தமிழில் தருகிறது; சொற்படியான ‘மேலே செல்ல’ தமிழ் வாசகருக்கு தவறான உடல்திசைப் பொருளை முன்னிறுத்தலாம்.
- source_word: לִבְנ֔וֹת
  choice: கட்டுவதற்காக
  rationale: எபிரெயச் சொல் ‘கட்டுதல்’ என்றே உள்ளது; சூழலில் மறுகட்டுதல் உட்பொருளாக இருந்தாலும் அதை உரைக்குள் சேர்க்கவில்லை.
- source_word: בֵּ֥ית יְהוָ֖ה
  choice: யாவேயின் இல்லம்
  rationale: ‘ஆலயம்’ என்ற சூழல்சார் விளக்கத்தை நேரடியாக உரையில் இடாமல், ‘வீடு/இல்லம்’ என்ற எபிரெய உருவகத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எழுத்துகளைக் பொதுப்பட்டப் பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁ֥ר בִּירוּשָׁלִָם
  choice: எருசலேமில் இருக்கிற
  rationale: இல்லத்தின் இருப்பிடத்தை அடையாளப்படுத்தும் தொடர்புத் தொடரை நிகழ்காலத்தில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் திருநாமம் நேரடியாக உள்ளது; அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் தனிப்பெயராகப் பேணுகிறது.
- issue: הֵעִיר הָאֱלֹהִים אֶת־רוּחוֹ என்பதில் கடவுளின் செயலும் மனிதரின் உள்நிலையும்
  choice: கடவுள் எவர்களுடைய உள்ளார்ந்த ஆவியைத் தூண்டினாரோ
  alternative: கடவுள் யாரை ஏவினாரோ / ஊக்கப்படுத்தினாரோ
  rationale: உள்ளார்ந்த தூண்டுதலைக் கடவுளுக்கே உரியதாக மூல உரை கூறுகிறது; அதன் செயல்முறையை மேலும் கோட்பாட்டாக்காமல், ஆவி என்ற சொல்லின் இறையியல் நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தந்தைவழிக் குடும்பம்’ மூலம் பண்டைய உறவுமுறைத் தொழில்நுட்பச் சொல்லை விளங்கத்தக்கவாறு வைத்துள்ளது. வாக்கியத்தின் இடைச்செருகல் அமைப்பு கடவுளால் தூண்டப்பட்ட அனைவரையும் முன் பட்டியலுடன் இணைக்கிறது; [a], [b] குறிகள் உரையில் உள்ளன.
