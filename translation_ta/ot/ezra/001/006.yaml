base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: ta
  text: அவர்களைச் சுற்றியிருந்த அனைவரும் வெள்ளிப் பாத்திரங்கள், பொன், உடைமைகள், கால்நடைகள், விலையுயர்ந்த பொருள்கள் ஆகியவற்றால் அவர்களுக்கு ஆதரவளித்தார்கள்[a]; மேலும், மனமுவந்து அளிக்கப்பட்ட அனைத்தையும் சேர்த்து[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவர்களுடைய கைகளை வலுப்படுத்தினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒவ்வொரு தன்னார்வக் காணிக்கையையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: அவர்களைச் சுற்றிலும் வாழ்ந்த அனைவரும்
  rationale: சுற்றியுள்ள பகுதியில் இருந்தவர்களைக் குறிக்கும் சொல்லை, ‘அயலார்’ என்று தேவையின்றி குறுக்காமல் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: அவர்களுக்கு ஆதரவளித்தார்கள்
  rationale: ‘அவர்களுடைய கைகளை வலுப்படுத்தினார்கள்’ என்ற எபிரெய வழக்குச்சொல் இச்சூழலில் பொருளுதவி செய்து துணைநிற்பதைக் குறிக்கிறது; தமிழில் அதன் செயல்பாட்டு பொருளை இயல்பாகத் தருகிறது.
- source_word: בִּכְלֵי כֶסֶף
  choice: வெள்ளிப் பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரம், பொருள் அல்லது கருவி எனப் பரந்த பொருளுடையது; மதிப்புமிக்க நன்கொடைப் பட்டியலில் ‘வெள்ளிப் பாத்திரங்கள்’ பொருத்தமானது.
- source_word: בַּזָּהָב
  choice: பொன்
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயர்ச்சொல் வடிவையும், பட்டியலின் சுருக்கத்தையும் இயல்பாகப் பேணுகிறது.
- source_word: בָּרְכוּשׁ
  choice: உடைமைகள்
  rationale: அசையும் சொத்து அல்லது பொருளாதார உடைமைகளைக் குறிக்கும் சொல்லின் பரந்த பொருளைப் பேணுகிறது.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: வீட்டு வளர்ப்பு விலங்குகளைச் சொத்தாகக் குறிக்கும் கூட்டுப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבַמִּגְדָּנוֹת
  choice: விலையுயர்ந்த பொருள்கள்
  rationale: மதிப்புமிக்க அல்லது தேர்ந்தெடுக்கப்பட்ட பரிசுப் பொருள்களைக் குறிக்கும் பரந்த பொருளை வைத்துக்கொண்டு, உணவுப்பண்டங்கள் என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: לְבַד
  choice: இவை தவிர
  rationale: முன் பட்டியலிடப்பட்ட உதவிகளுடன் கூடுதலாக மற்றொரு வகை கொடை இருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל כָּל הִתְנַדֵּב
  choice: மனமுவந்து கொடுக்கப்பட்ட அனைத்தையும்
  rationale: נדב என்பதிலுள்ள தன்னார்வக் கொடையின் கருத்தைப் பேணுகிறது; சுருக்கமான எபிரெய தொடரில் இல்லாத ஒரு குறிப்பிட்ட செய்பவரைச் சேர்ப்பதில்லை.
