  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: ta
  text: தங்கம், வெள்ளியாலான பொருட்கள் அனைத்தும் மொத்தம் ஐயாயிரத்து நானூறு இருந்தன.[a] நாடுகடத்தப்பட்டவர்கள் பாபிலோனிலிருந்து எருசலேமுக்கு மேலே கொண்டுவரப்பட்டபோது, சேஸ்பத்சார் அவற்றை அவர்களுடன் மேலே கொண்டுவந்தார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «பொருட்கள்» என்பதற்கு «பாத்திரங்கள்» என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கருவிகள், பாத்திரங்கள் அல்லது பொருட்கள் எனப் பரந்த பொருளைக் கொண்டது; இங்கே அது குறிப்பாக ஆலயப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் «மேலே கொண்டுவருதல்» என்ற வினை இவ்வசனத்தில் இருமுறை வருகிறது; எருசலேமுக்குச் செல்வதை «மேலே செல்வது» என்று குறிப்பிடும் வழக்கத்தை இது பிரதிபலிக்கிறது.
    reason: cultural_note
  - marker: c
    text: «நாடுகடத்தப்பட்டவர்கள்» என்பதற்கு «நாடுகடத்தப்பட்ட சமூகம்» என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: பொருட்கள் அனைத்தும்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், பொருட்கள் எனப் பரந்த பொருளுடையது. ஆலயச் சூழலில் «பொருட்கள்» என்பது அதன் பரப்பை இயல்பாகக் காக்கிறது.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: தங்கம் மற்றும் வெள்ளியால் ஆன
  rationale: இங்குள்ள ל முன்னொட்டு பொருட்களை அவற்றின் மூலப்பொருளின்படி வகைப்படுத்துகிறது; தமிழில் இந்த வடிவம் பொருளைத் தெளிவாக்குகிறது.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: மொத்தம் ஐயாயிரத்து நானூறு
  rationale: எண்ணிக்கையையும் הַכֹּל குறிக்கும் மொத்தத்தையும் இயல்பான தமிழ் நடையில் தருகிறது.
- source_word: הֶעֱלָה
  choice: மேலே கொண்டுவந்தார்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற பொருளையும் எருசலேமுக்குச் செல்லும் ஏற்ற மொழிவழக்கையும் காக்கிறது.
- source_word: שֵׁשְׁבַּצַּר
  choice: சேஸ்பத்சார்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டவர்கள் ... ஏற்றிக்கொண்டுவரப்பட்டபோது
  rationale: ஹிஃபில் வினையின் இறந்தேற்பாட்டு/காரணவினை நுணுக்கத்தையும், திரும்பிவந்த மக்களைக் குறிக்கும் הַגּוֹלָה என்பதையும் காலவாக்கியமாகக் காக்கிறது.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: பாபிலோனிலிருந்து எருசலேமுக்கு
  rationale: இடப்பெயர்களையும் இயக்கத்தின் தொடக்கம் மற்றும் இலக்கையும் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: עלה என்பதில் எருசலேமுக்கான ஏற்ற மொழி
  choice: இரு இடங்களிலும் ஏற்ற/மேலே கொண்டுவருதல் என்ற கருத்தைக் காத்தல்
  alternative: வெறுமனே «கொண்டுவந்தார்» அல்லது «வந்தபோது» என்று மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் ஒரே வேர் இருமுறை வருவதையும் எருசலேமுக்குப் ‘மேலே’ செல்லும் வழக்கமான புவியியல்-இலக்கிய நுணுக்கத்தையும் இது காக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: הַגּוֹלָה என்பதன் குறிப்பு
  choice: நாடுகடத்தப்பட்டவர்கள்
  alternative: நாடுகடத்தல் அல்லது நாடுகடத்தப்பட்ட சமூகத்தார்
  rationale: இச்சூழலில் பாபிலோனிலிருந்து திரும்பும் மக்களே குறிக்கப்படுகிறார்கள்; அதேவேளை சொல்லின் கூட்டுச்சமூக நுணுக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. «ஏற்றிக்கொண்டுவரப்பட்டபோது» என்பது சற்றே செறிவான வடிவமாக இருந்தாலும் மூலத்தின் ஹிஃபில் நுணுக்கத்தையும் எருசலேமுக்கான ஏற்றக் கருத்தையும் காக்கிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் உரையில் இடம்பெற்றுள்ளன.
