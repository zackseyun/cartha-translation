source:
  edition: WLC
  text: כְּפוֹרֵ֤י זָהָב֙ שְׁלֹשִׁ֔ים כְּפ֤וֹרֵי כֶ֨סֶף֙ מִשְׁנִ֔ים אַרְבַּ֥ע מֵא֖וֹת וַ/עֲשָׂרָ֑ה כֵּלִ֥ים אֲחֵרִ֖ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/010.yaml
  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: ta
  text: தங்கக் கிண்ணங்கள் 30, இரண்டாம் வகையான[a] வெள்ளிக் கிண்ணங்கள் 410, மற்ற பாத்திரங்கள் 1,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரண்டாம் வகையான” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், இந்தப் பட்டியல் சூழலில் பொருள் உறுதியற்றது. அது இரண்டாம் வகை, நகல் தொகுப்பு, அல்லது இரட்டையான வடிவம் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: கிண்ணங்கள்
  rationale: இச்சொல் ஒரு வகைப் பாத்திரத்தைக் குறிக்கிறது. அதன் துல்லியமான வடிவம் தெளிவாக இல்லாததால், வடிவத்தை மிகையாகக் குறிப்பாக்காமல் இயல்பான தமிழில் ‘கிண்ணங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: זָהָב
  choice: தங்க
  rationale: பாத்திரங்கள் செய்யப்பட்ட பொருளைக் குறிக்கும் வழக்கமான சொல்; தமிழில் பெயரடைத் தொடராக ‘தங்கக் கிண்ணங்கள்’ என வழங்கப்பட்டது.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: பட்டியல் நடைக்கு ஏற்ற தெளிவுக்காக எண்ணால் எழுதப்பட்டது.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: வெள்ளிக் கிண்ணங்கள்
  rationale: முன்னர் வந்த அதே பாத்திரச் சொல்லை ஒரேவிதமாக மொழிபெயர்த்து, பொருளைக் குறிக்கும் ‘வெள்ளி’ என்பதை இயல்பான தமிழ்த் தொகையாக வழங்குகிறது.
- source_word: מִשְׁנִים
  choice: இரண்டாம் வகையான
  rationale: இந்தப் பட்டியல் சூழலில் இச்சொல்லின் பொருள் உறுதியற்றது. ‘இரட்டையானவை’ என்று துல்லியப்படுத்தாமல், வேறொரு வகை அல்லது தொகுப்பைக் குறிக்கக்கூடிய ‘இரண்டாம் வகையான’ என்ற மொழிபெயர்ப்பு மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: எண்ணிக்கைப் பட்டியலில் வாசிப்புத் தெளிவுக்காக எண்ணால் எழுதப்பட்டது.
- source_word: כֵּלִים
  choice: பாத்திரங்கள்
  rationale: ஆலயப் பொருட்களைக் குறிக்கும் பரந்த சொல். இங்கு முன் பட்டியலிடப்பட்ட கிண்ணங்களோடு தொடர்புடைய பொருட்களுக்கு ‘பாத்திரங்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: אֲחֵרִים
  choice: மற்ற
  rationale: முன்னர் கூறப்பட்ட வகைகளிலிருந்து இவற்றை நேரடியாக வேறுபடுத்துகிறது.
- source_word: אָלֶף
  choice: 1,000
  rationale: மற்ற எண்ணிக்கைகளுடன் ஒருமைப்பாட்டுக்கும் பட்டியல் தெளிவுக்கும் எண்ணால் எழுதப்பட்டது.
