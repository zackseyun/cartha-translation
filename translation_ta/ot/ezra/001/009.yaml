base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/009.yaml
  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: ta
  text: 'அவற்றின் எண்ணிக்கை இதுதான்: தங்கக் கிண்ணங்கள் 30, வெள்ளிக் கிண்ணங்கள் 1,000, கத்திகள் 29[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறு பாத்திரங்கள்,” “நகல் பாத்திரங்கள்,” அல்லது “மாற்றுப் பாத்திரங்கள்”; இதற்கான எபிரெயச் சொல்லின் பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கை இதுதான்
  rationale: சொல்லுக்குச் சொல் வடிவில் ‘இவையே அவற்றின் எண்ணிக்கை’ என்றிருந்தாலும், பட்டியலை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲגַרְטְלֵי
  choice: கிண்ணங்கள்
  rationale: ஆலயப் பயன்பாட்டுக்குரிய திறந்த பாத்திரங்களைச் சுட்டும் சொல்; ‘கிண்ணங்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: זָהָב / כֶסֶף
  choice: தங்க / வெள்ளி
  rationale: பாத்திரங்கள் செய்யப்பட்ட பொருளைக் குறிக்கும் பெயர்ச்சொற்கள் தமிழில் இயல்பான பண்புப்பெயர் வடிவில் தரப்பட்டன.
- source_word: מַחֲלָפִים
  choice: கத்திகள்
  rationale: பொருள் உறுதியாகத் தெரியாத இச்சொல்லுக்கு நீண்டகாலமாக வழங்கப்படும் சாத்தியமான பொருள் இது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: பட்டியலை எளிதில் வாசிக்க எண்கள் இலக்கங்களாகத் தரப்பட்டன.
