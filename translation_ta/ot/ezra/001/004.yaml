revisions:
- from: எஞ்சியிருக்கும் ஒவ்வொருவரும்[a] தாம் தங்கியிருக்கும் எந்த இடத்திலிருந்தாலும், அந்த இடத்து ஆண்கள்[b] அவர்களுக்கு வெள்ளியும் பொன்னும், உடைமைகளும் கால்நடைகளும் கொடுத்து உதவ வேண்டும்[c]. இவற்றுடன், எருசலேமிலுள்ள கடவுளின் ஆலயத்திற்கான மனமுவந்த காணிக்கையையும் கொடுக்க வேண்டும்.
  to: எந்த இடத்தில் எஞ்சியிருக்கும் ஒருவர் வசித்துக்கொண்டிருக்கிறாரோ, அந்த இடத்தைச் சேர்ந்த ஆண்கள் அவருக்கு வெள்ளி, பொன், உடைமைகள், கால்நடைகள் ஆகியவற்றைக் கொடுத்து உதவ வேண்டும்; இவற்றோடு சேர்த்து, எருசலேமிலுள்ள கடவுளின் ஆலயத்திற்கான மனமுவந்த காணிக்கையையும் கொடுக்க வேண்டும்.[a][b][c]
  rationale: The revision makes the remaining resident explicitly the beneficiary—“அவருக்கு”—and the local men the grammatical subject, matching the Hebrew clause structure. It keeps the list of material support and links the voluntary offering with it. Footnote a is adjusted to preserve the residence/sojourning ambiguity without adding an explicit foreigner designation.
