base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: ta
  text: எந்த இடத்தில் எஞ்சியிருக்கும் ஒருவர் வசித்துக்கொண்டிருக்கிறாரோ, அந்த இடத்தைச் சேர்ந்த ஆண்கள் அவருக்கு வெள்ளி, பொன், உடைமைகள், கால்நடைகள் ஆகியவற்றைக் கொடுத்து உதவ வேண்டும்; இவற்றோடு சேர்த்து, எருசலேமிலுள்ள கடவுளின் ஆலயத்திற்கான மனமுவந்த காணிக்கையையும் கொடுக்க வேண்டும்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எஞ்சியிருப்பவர்” அல்லது “வசித்துக்கொண்டிருப்பவர் எங்கிருந்தாலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவருடைய இடத்து ஆண்கள்”; இது அந்த இடத்தில் வாழும் மக்கள் அல்லது அக்கம்பக்கத்தாரை விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “அவருக்கு ஆதரவளிக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “தூக்குதல்” அல்லது “சுமத்தல்”; இங்கு பொருளுதவி செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: எஞ்சியிருக்கும் ஒவ்வொருவரும்
  rationale: நிபால் வினையெச்சம் எஞ்சியிருப்பவரைக் குறிக்கிறது; திரும்பிச் செல்லாமல் அந்தந்த இடங்களில் இருக்கும் ஒவ்வொருவரையும் இயல்பான தமிழில் சுட்டுகிறது.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: தாம் தங்கியிருக்கும் எந்த இடத்திலிருந்தாலும்
  rationale: גּוּר என்பது தங்குதல் அல்லது அந்நியராக வசித்தல் எனப் பொருள்படலாம். இங்கு சிதறியிருப்போர் வாழும் இடத்தைக் குறிக்கிறது; ‘தங்கியிருக்கும்’ என்பது அந்நியத் தங்குதலின் நிழற்பொருளையும் ஓரளவு காக்கிறது.
- source_word: יְנַשְּׂאֻהוּ
  choice: கொடுத்து உதவ வேண்டும்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்கு/சும’ என்பதாக இருந்தாலும், பொருட்களின் பட்டியலுடன் இங்கு நடைமுறை ஆதரவு வழங்குவதைக் குறிக்கிறது.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: அந்த இடத்து ஆண்கள்
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் உள்ளது. அதன் வடிவத்தை முதன்மை உரையில் காத்து, அது உள்ளூர் குடியிருப்போரை விரிவாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: வெள்ளியும் பொன்னும்
  rationale: விலைமதிப்புள்ள உலோகங்களைக் குறிக்கும் வழக்கமான சொற்கள்; அவற்றை ‘பணம்’ என்று மிகையாகக் குறிப்பாக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: וּבִרְכוּשׁ
  choice: உடைமைகளும்
  rationale: רְכוּשׁ என்பது அசையும் சொத்து அல்லது உடைமைகளைக் குறிக்கிறது; பட்டியலில் ‘உடைமைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וּבִבְהֵמָה
  choice: கால்நடைகளும்
  rationale: வீட்டு அல்லது பண்ணை விலங்குகளைத் தொகுப்பாகக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: עִם הַנְּדָבָה
  choice: இவற்றுடன் ... மனமுவந்த காணிக்கையையும்
  rationale: נְדָבָה கட்டாயமற்ற, விருப்பத்துடன் அளிக்கப்படும் காணிக்கையைக் குறிக்கிறது. ‘மனமுவந்த காணிக்கை’ அதன் தன்னார்வ இயல்பைத் தெளிவாகத் தருகிறது.
- source_word: לְבֵית הָאֱלֹהִים
  choice: கடவுளின் ஆலயத்திற்கான
  rationale: சொல்லெழுத்தாக ‘கடவுளின் வீடு’ என்றாலும், இங்கு எருசலேம் ஆலயமே குறிக்கப்படுகிறது. நவீனத் தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: எருசலேமிலுள்ள
  rationale: கடவுளின் ஆலயம் அமைந்துள்ள இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: אַנְשֵׁי מְקֹמוֹ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: அந்த இடத்து ஆண்கள்
  alternative: அந்த இடத்து மக்கள் / அக்கம்பக்கத்தார்
  rationale: எபிரெய மூலத்தின் வெளிப்படையான ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; இருப்பினும் சமூகக் குறிப்பாக இது உள்ளூர் மக்களை விரிவாகக் குறிக்கலாம் என்ற உண்மையான சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: יְנַשְּׂאֻהוּ என்பதன் சூழல்சார் பொருள்
  choice: கொடுத்து உதவ வேண்டும்
  alternative: அவரைத் தூக்க வேண்டும் / அவருக்கு ஆதரவளிக்க வேண்டும்
  rationale: ‘தூக்கு/சும’ என்ற சொல்லெழுத்துப் பொருள் இச்சூழலில் தவறாகப் புரியக்கூடும். பின்வரும் வெள்ளி, பொன், உடைமைகள், கால்நடைகள் ஆகியவை பொருளுதவியையே காட்டுகின்றன.
- issue: בֵית הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் ஆலயம்
  alternative: கடவுளின் வீடு
  rationale: ‘வீடு’ என்பது எபிரெய வடிவத்திற்கு நெருக்கமானது; ஆனால் இவ்வரலாற்றுச் சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது. நவீன வாசகருக்கான தெளிவுக்காக ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் குறிப்பைத் தமிழில் மீண்டும் மீண்டும் பயன்படுத்துவதால் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்க்க ‘ஒவ்வொருவரும்/அவர்களுக்கு’ என்ற மரியாதைப் பன்மை அமைப்பு பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; ‘இவற்றுடன்’ என்பது עִם எனும் இணைப்பைத் தெளிவாகக் காக்கிறது.
