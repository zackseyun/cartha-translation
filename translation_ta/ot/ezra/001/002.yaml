source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: ta
  text: '“பாரசீக அரசன் கோரேசு கூறுவது இதுவே: வானத்தின் கடவுளாகிய யாவே பூமியிலுள்ள எல்லா அரசுகளையும் எனக்குக் கொடுத்திருக்கிறார். யூதாவிலுள்ள எருசலேமில் தமக்காக ஓர் இல்லத்தைக் கட்டும்படி அவரே என்னை நியமித்திருக்கிறார்[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கட்டளையிட்டிருக்கிறார்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, எருசலேமிலுள்ள ஆலயம்.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: அரச அறிவிப்புக்குரிய முறையான தொடக்கத்தைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாக அமைகிறது.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: பெர்சிய அரசன் கோரேசு
  rationale: பெயரையும் அரசப் பதவியையும் தமிழின் இயல்பான அடைமொழி வரிசையில் தருகிறது.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா அரசுகளையும்
  rationale: மַמְלְכוֹת என்பதன் பன்மையையும், இங்கு பேரரசு சார்ந்த பரந்த பொருளுடைய הָאָרֶץ என்பதையும் பிரதிபலிக்கிறது.
- source_word: נָתַן לִי
  choice: எனக்குக் கொடுத்திருக்கிறார்
  rationale: கடந்த செயல் தற்போது தொடரும் ஆட்சியுரிமையை விளைவித்திருப்பதைத் தமிழ் நிறைவுவினை இயல்பாக உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: பரலோகத்தின் கடவுள்
  rationale: எபிரெயப் பட்டத்தின் பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וְהוּא
  choice: அவரே
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் தக்கவைக்கிறது.
- source_word: פָקַד עָלַי
  choice: என்னை நியமித்திருக்கிறார்
  rationale: ஒரு பணிக்காக அதிகாரபூர்வமாகப் பொறுப்பளித்தல் என்ற சூழல்சார் பொருளைத் தருகிறது; ‘கட்டளையிட்டிருக்கிறார்’ என்பதும் சாத்தியம்.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: தமக்கென்று ஓர் இல்லத்தைக் கட்டும்படி
  rationale: בַיִת என்பதன் அடிப்படைப் பொருளான ‘இல்லம்’ என்பதைக் காக்கிறது; சூழலில் அது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: யூதாவிலுள்ள எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் தொடர்புச் சொற்றொடரின் முழுப் பொருளையும் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; எனவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בַיִת என்பதை ‘இல்லம்’ என்றா ‘ஆலயம்’ என்றா தருவது
  choice: இல்லம்
  alternative: ஆலயம்
  rationale: முதன்மை உரையில் மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: פָקַד עָלַי என்பதிலுள்ள பொறுப்பளித்தல் அல்லது கட்டளையிடுதல் என்ற நுணுக்கம்
  choice: என்னை நியமித்திருக்கிறார்
  alternative: எனக்குக் கட்டளையிட்டிருக்கிறார்
  rationale: ஒரு குறிப்பிட்ட கட்டுமானப் பணிக்காக கோரேசு நியமிக்கப்பட்டார் என்ற ஆணைப்பொறுப்பை முதன்மை உரை வெளிப்படுத்துகிறது; கட்டளை என்ற வலிமையான வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச அறிவிப்புக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கூறுவது இதுவே’, ‘அவரே’ ஆகியவை மூலத்தின் முறையான அறிவிப்பு நடையையும் வலியுறுத்தலையும் காக்கின்றன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
