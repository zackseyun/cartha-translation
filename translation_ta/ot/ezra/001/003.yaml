revisions:
- from: உங்களிடையே அவருடைய மக்கள் அனைவரிலும் யார் இருக்கிறாரோ, அவருடைய கடவுள் அவரோடு இருப்பாராக. அவர் யூதாவிலுள்ள எருசலேமுக்குப் போய், இஸ்ரவேலின் கடவுளாகிய யெகோவாவின் ஆலயத்தை மீண்டும் கட்டட்டும்[a]. எருசலேமில் இருக்கிற கடவுள் அவரே[b].
  to: அவருடைய மக்கள் அனைவரிலும் உங்களிடையே எவராவது இருந்தால், அவருடைய கடவுள் அவரோடு இருப்பாராக. அவர் யூதாவிலுள்ள எருசலேமுக்கு ஏறிச் சென்று, இஸ்ரவேலின் கடவுளாகிய யாவேயின் ஆலயத்தை மீண்டும் கட்டட்டும்[a]. எருசலேமில் இருக்கிற கடவுள் அவரே[b].
  rationale: The revision corrects the divine-name rendering to conform to the project’s Yahweh decision, restores the ascent nuance of the Hebrew travel verb, and recasts the opening into idiomatic modern Tamil without narrowing its indefinite invitation. It preserves the restoration-context rendering ‘மீண்டும் கட்டட்டும்,’ with its lexical alternative footnote, and retains the ancient locative identification of God with Jerusalem.
