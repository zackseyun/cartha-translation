  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: ta
  text: அவருடைய மக்கள் அனைவரிலும் உங்களிடையே எவராவது இருந்தால், அவருடைய கடவுள் அவரோடு இருப்பாராக. அவர் யூதாவிலுள்ள எருசலேமுக்கு ஏறிச் சென்று, இஸ்ரவேலின் கடவுளாகிய யாவேயின் ஆலயத்தை மீண்டும் கட்டட்டும்[a]. எருசலேமில் இருக்கிற கடவுள் அவரே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தைக் கட்டட்டும்.” எபிரெய வினைச்சொல் நேரடியாக “கட்டு” என்றே பொருள்படும்; அழிக்கப்பட்ட ஆலயத்தைத் திரும்பக் கட்டும் சூழலை “மீண்டும்” என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் எருசலேமில் இருக்கும் கடவுள்.” எபிரெயச் சொற்றொடரை இவ்வாறு இன்னும் சுருக்கமாகவும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: உங்களிடையே அவருடைய மக்கள் அனைவரிலும் யார் இருக்கிறாரோ
  rationale: מִי இச்சூழலில் வெறும் வினாவாக இல்லாமல் திறந்த அழைப்பைக் குறிக்கிறது. בָכֶם மற்றும் מִכָּל עַמּוֹ ஆகிய இரு கூறுகளையும் வெளிப்படையாகத் தக்கவைத்து, 3ஆம் ஆண்பால் ஒருமை பின்னொட்டின் ‘அவருடைய’ என்ற தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: அவருடைய கடவுள் அவரோடு இருப்பாராக
  rationale: விருப்பம் அல்லது ஆசீர்வாதத்தைக் குறிக்கும் יְהִי என்பதன் கட்டளைவிருப்பத் தொனியை ‘இருப்பாராக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיַעַל
  choice: அவர் ... போய்
  rationale: עלה எருசலேமுக்குச் செல்வதற்கான வழக்குச் சொல்லாகும். தமிழில் ‘மேலே போகட்டும்’ என்பது இங்கு இயல்பற்றதாக இருக்கக்கூடும் என்பதால் இலக்கையும் பயணத்தையும் தெளிவாகக் கூறும் ‘போய்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: யூதாவிலுள்ள எருசலேமுக்கு
  rationale: இடத்தைக் குறிப்பிடும் தொடர்புத் தொடரை நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וְיִבֶן
  choice: மீண்டும் கட்டட்டும்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு’; நாடுகடத்தலுக்குப் பிந்தைய மறுசீரமைப்புச் சூழல் காரணமாக ‘மீண்டும்’ சேர்க்கப்பட்டுள்ளது. சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בֵּית என்பதன் சூழல்சார் குறிப்பு ஆலயம் என்பதால் சாதாரண வாசகருக்குத் தெளிவான ‘ஆலயம்’ பயன்படுத்தப்படுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யெகோவா’ என்று வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: הוּא הָאֱלֹהִים
  choice: கடவுள் அவரே
  rationale: הוּא தரும் வலியுறுத்தலையும் הָאֱלֹהִים இலுள்ள குறிப்புச் சுட்டையும் தமிழின் ‘அவரே’ என்ற வலியுறுத்தல் இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: எருசலேமில் இருக்கிற
  rationale: மசோரெட்டிய உரையின் இடச்சார்ந்த கூற்றை மென்மைப்படுத்தாமலும் பின்னைய இறையியல் விளக்கத்தைச் சேர்க்காமலும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ அதைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் பாதுகாக்கிறது.
- issue: ‘எருசலேமில் இருக்கிற கடவுள்’ என்ற இடச்சார்ந்த கூற்று
  choice: எருசலேமில் இருக்கிற கடவுள் அவரே
  alternative: அவரே கடவுள்; அவருடைய ஆலயம் எருசலேமில் இருக்கிறது
  rationale: இந்த வசனம் கோரேசின் வரலாற்றுக் கட்டளை மொழியைப் பிரதிபலிக்கிறது. இடச்சார்ந்த கூற்றை விரிவான இறையியல் கருத்தோடு ஒத்திசைக்காமல், அதன் உண்மையான பதற்றத்தோடு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது. அரச அறிவிப்பின் கண்ணியமான ஆசீர்வாதத் தொனி ‘இருப்பாராக’ மற்றும் ‘கட்டட்டும்’ வழியாகத் தக்கவைக்கப்பட்டுள்ளது. மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையும் எருசலேமைச் சார்ந்த பழங்கால இடமொழியும் திட்டமிட்டு மென்மைப்படுத்தப்படவில்லை.
