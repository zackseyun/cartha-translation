  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: ta
  text: கோரேசு அரசன் யாவேவின்[a] ஆலயப் பாத்திரங்களை[b] வெளியே கொண்டுவந்தான். அவற்றை நேபுகாத்நேச்சார் எருசலேமிலிருந்து கொண்டுவந்து, தன் தெய்வாலயத்தில் வைத்திருந்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: יהוה (YHWH); இது இங்கே “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: divine_name
  - marker: b
    text: 'எழுத்துப்படி: “யாவேவின் வீட்டுப் பாத்திரங்கள்”; இங்கு “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “அவன் தெய்வம்” அல்லது “அவன் தெய்வங்கள்” எனப் புரியக்கூடிய வடிவம் உள்ளது.
    reason: source_ambiguity
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: கோரேசு அரசன்
  rationale: தமிழின் இயல்பான பெயர்–பட்ட வரிசையைப் பின்பற்றுகிறது; எபிரெய உரையிலுள்ள அரச பட்டத்தையும் தெளிவாகக் காக்கிறது.
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்தான்
  rationale: Hiphil வடிவின் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்ற பொருளை வெளிப்படுத்துகிறது; வசனத்தில் இருமுறை வரும் வினையின் தொடர்பையும் காக்கிறது.
- source_word: כְּלֵי
  choice: பாத்திரங்கள்
  rationale: ஆலயச் சூழலில் பயன்படும் பொருட்களைக் குறிக்கும் இயல்பான தமிழ் சொல்; அவற்றின் துல்லியமான வடிவம் அல்லது பயன்பாட்டை உரை கூறாததால் அதற்கு மேல் குறிப்பாக்கவில்லை.
- source_word: בֵית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: எழுத்துப்படி ‘யாவேவின் வீடு’; நவீன தமிழில் கட்டடத்தின் சமயப் பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: எருசலேமிலிருந்து கொண்டுவந்து
  rationale: நேபுகாத்நேச்சார் செய்த முந்தைய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; முதல் הוֹצִיא உடனான வினைத் தொடர்பையும் ‘கொண்டுவந்து’ என்பதன் மூலம் காக்கிறது.
- source_word: וַיִּתְּנֵם
  choice: அவற்றை ... வைத்திருந்தான்
  rationale: தொடரும் இடக்குறிப்புடன் נתן இங்கு ‘வைத்தல்’ என்று பொருள்படுகிறது. ‘வைத்திருந்தான்’ என்பது கோரேசின் செயலுக்கு முன் நிகழ்ந்த பின்னணிச் செயலைத் தெளிவாக்குகிறது.
- source_word: בְּבֵית אֱלֹהָיו
  choice: தன் தெய்வத்தின் ஆலயத்தில்
  rationale: மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டை ‘தன்’ என்று இயல்பாகத் தருகிறது; אֱלֹהָיו வடிவின் இங்குள்ள ஒருமைப் பொருளை ‘தெய்வம்’ எனக் காக்கிறது; வசனத்தின் இரு ‘வீடு/ஆலயம்’ குறிப்புகளுக்கிடையிலான இணைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரான YHWH-ஐப் பயன்படுத்துகிறது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: நேபுகாத்நேச்சாரின் தெய்வத்தைக் குறிக்கும் எண்ணிக்கை
  choice: தன் தெய்வம்
  alternative: தன் தெய்வங்கள்
  rationale: אֱלֹהָיו இங்கு ஒருமைப் பொருளுடைய மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை வடிவமாகச் சூழலில் செயல்படுகிறது; ஆகவே பாபிலோனியப் பலதெய்வ வழிபாட்டைப் பற்றிய வெளிப்புற தகவலை வசனத்திற்குள் சேர்க்காமல் ஒருமை காக்கப்பட்டது.
- issue: இரு ஆலயங்களுக்கிடையிலான சொல்லியல் இணைவு
  choice: யாவேவின் ஆலயம் ... தன் தெய்வத்தின் ஆலயம்
  alternative: யாவேவின் வீடு ... தன் தெய்வத்தின் கோவில்
  rationale: மூலத்தில் இரு இடங்களுக்கும் בֵית என்ற ஒரே சொல் வருகிறது. இயல்பான தமிழுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டாலும், இரு இடங்களிலும் அதே சொல்லை வைத்து உரையின் திட்டமிட்ட இணைவும் எதிர்மறை ஒப்புமையும் காக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. ‘இல்லம்/வீடு’ என்ற எழுத்துப்படியான வடிவத்துக்குப் பதில் சூழலுக்கேற்ற ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, எழுத்துப்படியான சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டது. முதல் எபிரெய வாக்கியம் தமிழின் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டது; கருத்து உறவும் நிகழ்வுகளின் கால வரிசையும் காக்கப்பட்டன.
