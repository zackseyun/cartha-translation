source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: ta
  text: தங்கள் மனைவிகளை அனுப்பிவிடுவதாக அவர்கள் உறுதியளித்தார்கள்[a]. குற்றமுள்ளவர்களான அவர்கள், தங்கள் குற்றத்திற்காக மந்தையிலிருந்து ஒரு செம்மறியாட்டுக் கடாவைப் பலியாகச் செலுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பொருளாக, “தங்கள் கையைக் கொடுத்தார்கள்”; இது உறுதிமொழி அல்லது கட்டுப்படுத்தும் ஒப்புதல் அளிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் வெளிப்படையாக, “தங்கள் குற்றத்திற்காக மந்தையிலிருந்து ஒரு செம்மறியாட்டுக் கடாவைக் குற்றநிவாரணப் பலியாகச் செலுத்தினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: அவர்கள் உறுதியளித்தார்கள்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘தங்கள் கையைக் கொடுத்தார்கள்’ என்று வரும் இச்சொற்றொடர், உறுதிமொழி அல்லது கட்டுப்படுத்தும் ஒப்புதல் அளிப்பதைக் குறிக்கும் மரபுத்தொடர். அதன் பொருளை இயல்பான நவீன தமிழில் ‘உறுதியளித்தார்கள்’ என வழங்குகிறது.
- source_word: לְהוֹצִיא
  choice: அனுப்பிவிடுவதாக
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் இங்கு ‘வெளியே போகச் செய்தல்’ அல்லது ‘அனுப்பிவிடுதல்’ என்று பொருள்படும். மனைவிகளைப் பிரித்து அனுப்பும் இச்சூழலில் ‘அனுப்பிவிடு’ என்பது தெளிவான இயல்பான தேர்வு.
- source_word: נְשֵׁיהֶם
  choice: தங்கள் மனைவிகளை
  rationale: இங்கு נָשִׁים என்ற சொல் பொதுவாகப் பெண்களை அல்ல, திருமண உறவிலுள்ள மனைவிகளைக் குறிக்கிறது.
- source_word: וַאֲשֵׁמִים
  choice: குற்றமுள்ளவர்களான அவர்கள்
  rationale: இது அவர்கள் குற்றத்திற்குப் பொறுப்பான நிலையில் இருந்ததைக் குறிக்கிறது. ‘குற்றமுள்ளவர்களான’ என்பது அந்தக் குற்றநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵיל צֹאן
  choice: மந்தையிலிருந்து ஒரு செம்மறியாட்டுக் கடா
  rationale: אֵיל என்பது பலிக்குரிய ஆண் செம்மறியாட்டைக் குறிக்கிறது; צֹאן அது மந்தையைச் சேர்ந்தது என்பதைச் சொல்கிறது. இத்தேர்வு விலங்கையும் அதன் மந்தைச் சார்பையும் தெளிவாகக் காக்கிறது.
- source_word: עַל אַשְׁמָתָם
  choice: தங்கள் குற்றத்திற்காக
  rationale: עַל இங்கு பலி செலுத்தப்பட்டதற்கான காரணத்தைச் சுட்டுகிறது; אַשְׁמָה அவர்களுடைய குற்றத்தைக் குறிக்கிறது. ஆகவே ‘தங்கள் குற்றத்திற்காக’ என்பது சுருக்கமாகவும் நேராகவும் உள்ளது.
theological_decisions:
- issue: பலியைத் தொழில்நுட்பப் பெயரான ‘குற்றநிவாரணப் பலி’ என்று முதன்மை உரையிலேயே வெளிப்படையாகக் குறிப்பிடலாமா என்பது
  choice: முதன்மை உரையில் ‘செம்மறியாட்டுக் கடாவைப் பலியாகச் செலுத்தினார்கள்’ என்று வழங்கப்பட்டது.
  alternative: ‘தங்கள் குற்றத்திற்காக மந்தையிலிருந்து ஒரு செம்மறியாட்டுக் கடாவைக் குற்றநிவாரணப் பலியாகச் செலுத்தினார்கள்’
  rationale: எபிரெய உரை கடாவையும் அவர்களுடைய குற்றத்தையும் வெளிப்படையாகக் குறிப்பிடுகிறது; ஆனால் இக்கூற்றில் ‘குற்றநிவாரணப் பலி’ என்பதற்கான தனியான தொழில்நுட்பப் பெயர் இல்லை. வினைச்சொல் விடுபட்டுள்ளதால் தமிழின் தெளிவுக்காக ‘பலியாகச் செலுத்தினார்கள்’ சேர்க்கப்பட்டது; கூடுதல் தொழில்நுட்ப விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘கையைக் கொடுத்தார்கள்’ என்ற சொற்படியான எபிரெய மரபுத்தொடர் முதன்மை உரையில் இயல்பான ‘உறுதியளித்தார்கள்’ எனவும், அதன் சொற்பொருள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது. பலியின் தொழில்நுட்ப வகை முதன்மை உரையில் மிகைப்படுத்தப்படாமல், மாற்று விளக்கமாக அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
