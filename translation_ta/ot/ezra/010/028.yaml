translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமான மற்றும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியைக் காட்ட וּ என்பதற்கு ‘மேலும்’ என வழங்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிக் குறிகள் அவற்றின் குறிப்புகளோடு பொருந்தாமல் இடம் பெற்றிருந்ததால், [a] ‘மகன்களில்’ என்பதற்குப் பின்னும் [b] ‘யெகோஹானான்’ என்பதற்குப் பின்னும் பொருளுக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளன.
