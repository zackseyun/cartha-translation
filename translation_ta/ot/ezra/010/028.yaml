source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י בֵּבָ֑י יְהוֹחָנָ֥ן חֲנַנְיָ֖ה זַבַּ֥י עַתְלָֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: ta
  text: 'மேலும், பேபாயின் மகன்களில்[a]: யெகோஹானான்[b], அனனியா, சப்பாய், அத்லாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்கள்’ என்பதற்கான எபிரெயச் சொல், இங்கே பேபாயின் குடும்ப வழியைச் சேர்ந்தவர்களையோ அவரது வழித்தோன்றல்களையோ பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யெகோஹானான்’ என்ற முழு எபிரெயப் பெயர் சில மொழிபெயர்ப்புகளில் சுருக்கமாக ‘யோகனான்’ என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: மேலும், … மகன்களில்
  rationale: இணைப்பிடைச்சொல், ‘இலிருந்து/இல்’ என்ற முன்னொட்டு, ‘மகன்கள்’ என்பதன் இணைநிலை வடிவம் ஆகியவற்றைச் சேர்த்து இயல்பான தமிழில் வழங்குகிறது. இப்பட்டியல் சூழலில் ‘மகன்கள்’ என்பது குடும்ப வழியினரையும் குறிக்கக்கூடும்; இருப்பினும் மூலத்தின் வடிவத்தைப் பாதுகாக்க ‘மகன்களில்’ என வைக்கப்பட்டுள்ளது.
- source_word: בֵּבָי
  choice: பேபாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்திற்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: יְהוֹחָנָן
  choice: யெகோஹானான்
  rationale: பெயரிலுள்ள முழு எபிரெய வடிவத்தையும், தொடக்க இறைப்பெயர்க் கூறையும் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: חֲנַנְיָה
  choice: அனனியா
  rationale: தமிழில் புரிந்துகொள்ளத்தக்க, வழக்கில் நிலைபெற்ற ஒலிபெயர்ப்பு; தொடக்க எபிரெய உரசொலி தமிழில் இயல்பாக மெலிவுறுகிறது.
- source_word: זַבַּי
  choice: சப்பாய்
  rationale: எபிரெய மெய்யொலி இரட்டிப்பையும் இறுதி ஒலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַתְלָי
  choice: அத்லாய்
  rationale: எபிரெய பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
