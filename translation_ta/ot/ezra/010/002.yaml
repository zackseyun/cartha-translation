base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: ta
  text: 'அப்போது ஏலாம் வம்சத்தைச் சேர்ந்த யெகியேலின் மகன் செக்கனியா எஸ்றாவுக்குப் பதிலளித்துக் கூறினான்: “நாங்கள் எங்கள் கடவுளுக்கு நம்பிக்கைத் துரோகம் செய்து, தேசத்து மக்களினங்களைச் சேர்ந்த அந்நியப் பெண்களை மணந்துகொண்டோம்.[a] ஆயினும் இப்போது இந்தக் காரியத்தைக் குறித்து இஸ்ரவேலுக்கு நம்பிக்கை இருக்கிறது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேசத்து மக்களினங்களைச் சேர்ந்த அந்நியப் பெண்களை மனைவிகளாக ஏற்றுக்கொண்டோம்.”
    reason: וַנֹּשֶׁב நָשִׁים நָכְרִיּוֹת என்ற எபிரெயத் திருமணச் சொல்லாக்கத்தை இன்னும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: “இந்தக் காரியத்தைக் குறித்து” என்பது “இந்த விவகாரத்தில்” என்றும் பொருள்படலாம்.
    reason: עַל־זֹאת என்ற எபிரெயத் தொடரின் தொடர்புப் பொருளில் உள்ள இயல்பான நுண்ணிய தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: எபிரெயக் கதைநடையில் உரையாடலுக்குப் பதிலளிப்பதைக் குறிக்கும் வழக்கமான வினை; இயல்பான தமிழில் அடுத்துள்ள ‘என்றான்’ என்ற கருத்தோடு இணைகிறது.
- source_word: שְׁכַנְיָה בֶן־יְחִיאֵל
  choice: யெகியேலின் மகன் செக்கனியா
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, எபிரெய உறவுமுறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִבְּנֵי עֵילָם
  choice: ஏலாம் வம்சத்தைச் சேர்ந்த
  rationale: בני என்பது இங்கு தனிப்பட்ட ‘மகன்கள்’ என்பதைக் காட்டிலும் குல அல்லது வம்சச் சார்பைக் குறிக்கிறது; நவீனத் தமிழில் ‘வம்சத்தைச் சேர்ந்த’ தெளிவானது.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: நம் கடவுளுக்கு நம்பிக்கைத் துரோகம் செய்து
  rationale: מעל என்பதிலுள்ள கடவுளுக்கு எதிரான விசுவாசக்கேடு அல்லது உறவுமீறலின் வலிமையைப் பாதுகாக்கிறது; பொதுவான ‘பாவம் செய்தோம்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மணந்துகொண்டோம்
  rationale: וַנֹּשֶׁב என்பதன் திருமணச் சூழலை இயல்பான தமிழில் வெளிப்படுத்தி, נָשִׁים என்பதைக் ‘பெண்கள்’ என்றே வைத்திருக்கிறது.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: இந்நாட்டின் மக்களினங்களிலிருந்து
  rationale: עמי என்ற பன்மையையும், הארץ என்பதன் உள்ளூர் நிலப்பரப்புக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל־זֹאת
  choice: இதைக் குறித்து இஸ்ரவேலுக்கு இன்னும் நம்பிக்கை இருக்கிறது
  rationale: מִקְוֶה என்பதற்கு ‘நம்பிக்கை’ என்றும், עַל־זֹאת என்பதன் திறந்த தொடர்பை ‘இதைக் குறித்து’ என்றும் மொழிபெயர்க்கிறது; ‘இன்னும்’ என்பது וְעַתָּה குறிக்கும் தற்போதைய திருப்பத்தை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: מָעַלְנוּ என்பதிலுள்ள உடன்படிக்கை சார்ந்த விசுவாசக்கேடு
  choice: நம் கடவுளுக்கு நம்பிக்கைத் துரோகம் செய்து
  alternative: நம் கடவுளுக்கு எதிராகப் பாவம் செய்து
  rationale: மூல வினை சாதாரணப் பாவத்தை மட்டுமல்லாமல் நம்பிக்கையை மீறிய செயலைக் குறிக்கிறது; எந்தக் குறிப்பிட்ட சமயக் கோட்பாட்டையும் சேர்க்காமல் அதன் உறவுசார் தீவிரத்தைப் பாதுகாக்கிறது.
- issue: נָשִׁים נָכְרִיּוֹת என்பதன் இன/சமூக அடையாளம்
  choice: அந்நியப் பெண்கள்
  alternative: அந்நிய மனைவிகள்
  rationale: பெயர்ச்சொல்லை ‘பெண்கள்’ என நெருக்கமாக வைத்துக்கொண்டு, திருமண உறவை வினைச்சொல் வெளிப்படுத்த அனுமதிக்கிறது.
- issue: עַל־זֹאת என்பதன் தொடர்பு
  choice: இதைக் குறித்து
  alternative: இது இருந்தபோதிலும்
  rationale: எபிரெயத் தொடர் ‘இந்த விவகாரம் குறித்து’ அல்லது ‘இதன் காரணமாக/மேல்’ என்ற தொடர்பைத் திறந்தவாறு விடுகிறது; ‘இது இருந்தபோதிலும்’ என எதிர்மறைச் சலுகைப் பொருளை மட்டும் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்களினங்கள்’ மூலம் எபிரெயப் பன்மை தெளிவாக்கப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. மேற்கோள் அடுத்த வசனத்தில் தொடருவதால் இங்கு முடிப்பு மேற்கோள் குறி இடப்படவில்லை.
