- from: அப்போது ஏலாம் வம்சத்தைச் சேர்ந்த யெகியேலின் மகன் செக்கனியா எஸ்றாவிடம் மறுமொழியாக, “நாங்கள் நம் கடவுளுக்கு நம்பிக்கைத் துரோகம் செய்து, இந்நாட்டின் மக்களினங்களிலிருந்து அந்நியப் பெண்களை மணந்துகொண்டோம்.[a] ஆனாலும், இதைக் குறித்து இஸ்ரவேலுக்கு இன்னும் நம்பிக்கை இருக்கிறது.[b]
  to: 'அப்போது ஏலாம் வம்சத்தைச் சேர்ந்த யெகியேலின் மகன் செக்கனியா எஸ்றாவுக்குப் பதிலளித்துக் கூறினான்: “நாங்கள் எங்கள் கடவுளுக்கு நம்பிக்கைத் துரோகம் செய்து, தேசத்து மக்களினங்களைச் சேர்ந்த அந்நியப் பெண்களை மணந்துகொண்டோம்.[a] ஆயினும் இப்போது இந்தக் காரியத்தைக் குறித்து இஸ்ரவேலுக்கு நம்பிக்கை இருக்கிறது.[b]'
