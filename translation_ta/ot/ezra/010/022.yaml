  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: ta
  text: 'பஷ்ஹூரின் மகன்களில்: எலியோயேனாய், மாசேயா, இஷ்மாயேல், நெதனேல், யோசாபாத், எலாசா ஆகியோர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: மகன்களில்
  rationale: מִן முன்னொட்டின் பகுதியெடுக்கும் பொருளையும், בְּנֵי என்பதன் குடும்ப/வம்சக் குழு குறிக்கும் பயன்பாட்டையும் இயல்பான தமிழில் காட்டுகிறது. பட்டியல் வடிவில் தொடக்க ו இணைப்பைத் தனியாக மொழிபெயர்க்காமல் இருப்பது தமிழில் இயல்பானது.
- source_word: פַּשְׁחוּר
  choice: பஸ்கூர்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: אֶלְיוֹעֵינַי
  choice: எலியோயேனாய்
  rationale: எபிரெயப் பெயரின் மெய்-உயிர் அமைப்பைத் தமிழில் நெருக்கமாகப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: பெயரின் எபிரெய ஒலியமைப்பை தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கிறது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: எபிரெயப் பெயரை மூல ஒலிக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: எபிரெயப் பெயரின் அசை அமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: יוֹזָבָד
  choice: யோசபாத்
  rationale: தொடக்க יוֹ ஒலியை 'யோ' என்றும், இறுதி ד ஒலியைத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: וְ/אֶלְעָשָׂה
  choice: எலயாசா ஆகியோர்
  rationale: பெயரை எபிரெயத்திலிருந்து ஒலிபெயர்த்து, பட்டியலின் இறுதியை இயல்பான தமிழில் 'ஆகியோர்' என நிறைவு செய்கிறது; prefixed ו-வின் இணைப்புப் பணி இதனால் வெளிப்படுகிறது.
