base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: ta
  text: அப்போது எஸ்றா தேவனுடைய இல்லத்தின் முன்பிருந்து எழுந்து, எலியாசிபின் மகனான யெகோஹானானின்[a] அறைக்குச் சென்றார். அங்கே சென்ற அவர் அப்பம் உண்ணவுமில்லை, தண்ணீர் குடிக்கவுமில்லை; ஏனெனில் நாடுகடத்தப்பட்டோரின்[c] நம்பிக்கைத்துரோகத்தைக்[b] குறித்து அவர் துக்கங்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யெகோஹானான்’ என்பதை ‘யோகானான்’ என்றும் பெயர்த்தெழுதலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நம்பிக்கைத்துரோகம்’ என்பதை ‘உண்மையின்மை’ அல்லது ‘துரோகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நாடுகடத்தப்பட்டோர்’ என்பது நாடுகடத்தலிலிருந்து திரும்பிவந்த சமூகத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லத்தின் முன்பிருந்து
  rationale: எபிரெய இடவியல் சொல்லாட்சியான ‘தேவனுடைய இல்லத்தின் முன்பிருந்து’ என்பதைக் காத்து, ஆலயத்தைக் குறிக்கும் மூல உருவகத்தையும் நிலைநிறுத்துகிறது.
- source_word: לִשְׁכַּת
  choice: அறை
  rationale: ஆலயம் அல்லது அதிகாரபூர்வ வளாகத்திலுள்ள தனி அறையை இச்சொல் குறிக்கிறது; நவீனத் தமிழில் ‘அறை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: எலியாசிபின் மகனான யெகோனான்
  rationale: எபிரெயப் பெயர்களின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: וַיֵּלֶךְ שָׁם
  choice: அவர் அங்கே சென்று
  rationale: மூலத்தில் ‘சென்றார்’ என்ற வினை மீண்டும் வருவதையும் அதன் சற்றுத் திடீர் அமைப்பையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: அப்பம் உண்ணாமலும் தண்ணீர் குடிக்காமலும் இருந்தார்
  rationale: ‘அப்பம்,’ ‘தண்ணீர்’ என்ற இரு வெளிப்படையான பொருட்களையும் காத்து, முழுமையான உண்ணாநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִתְאַבֵּל
  choice: துக்கங்கொண்டிருந்தார்
  rationale: விரதத்துடன் வெளிப்படும் ஆழ்ந்த துயரத்தை இங்கு குறிக்கிறது; தொடர்நிலை வினை வடிவம் எபிரெயப் பங்கேற்புச் சொல்லின் நீடித்த நிலையைக் காட்டுகிறது.
- source_word: מַעַל
  choice: நம்பிக்கைத் துரோகம்
  rationale: உடன்படிக்கைச் சூழலில் நேர்மையையும் விசுவாசத்தையும் மீறிய செயலைக் குறிக்கிறது; வெறும் ‘குற்றம்’ என்பதைவிட மூலத்தின் உறவுசார் மற்றும் இறையியல் கனத்தைப் பாதுகாக்கிறது.
- source_word: הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டோர்
  rationale: சொல்லின் அடிப்படை நாடுகடத்தல் சார்ந்த குறிப்பை நிலைநிறுத்துகிறது; இங்கு திரும்பிவந்த சமூகமே குறிக்கப்படுகிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: מַעַל என்ற சொல்லின் உடன்படிக்கை மீறல் சார்ந்த பொருள்
  choice: நம்பிக்கைத் துரோகம்
  alternative: உண்மையின்மை; துரோகம்; குற்றம்
  rationale: சமூகத்தின் செயலை வெறும் சட்டக் குற்றமாகச் சுருக்காமல், தேவனுக்கு உரிய உண்மையையும் உடன்படிக்கை நம்பிக்கையையும் மீறியதாக உள்ள மூலப் பொருளைக் காக்கிறது.
- issue: בֵּית הָאֱלֹהִים என்பதைக் ‘இல்லம்’ என்றா ‘ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: தேவனுடைய இல்லம்
  alternative: தேவனுடைய ஆலயம்
  rationale: இச்சூழலில் குறிப்பு புரியத்தக்கதாக இருப்பதால், மூலத்தின் ‘இல்லம்’ என்ற உருவகத்தை விளக்கமாக ‘ஆலயம்’ என்று மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம நிகழ்வின் கண்ணியத்தையும் துக்கத் தொனியையும் காக்கும் நடை. மூலத்தின் மீளுரைப்பும் ‘தேவனுடைய இல்லம்,’ ‘அப்பம்,’ ‘தண்ணீர்’ போன்ற தெளிவான உருவகங்களும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
