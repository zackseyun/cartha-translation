translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் நடையைப் பயன்படுத்துகிறது. தனிப்பெயர்கள் மூல எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; விளக்கக் குறிப்புக்கான [a] குறியீடு உரையிலேயே சேர்க்கப்பட்டுள்ளது.
