base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: ta
  text: 'மேலும், லேவியர்களில் இருந்தவர்கள்: யோசபாத், சிமெயி, கேலாயா (அதாவது, கேலித்தா)[a], பெத்தகியா, யூதா, எலியேசர் ஆகியோர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேலாயா, அவனே கேலித்தா” என்பது எபிரெயச் சொல்லமைப்பு; கேலித்தா என்பது அதே நபரின் மற்றொரு பெயர் அல்லது அவரது பெயரின் வேறொரு வடிவம் என்பதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: லேவியர்களில்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது பட்டியலின் ஒரு துணைப்பிரிவை அறிமுகப்படுத்துகிறது.
- source_word: יוֹזָבָד
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்தது.
- source_word: וְשִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: கேலாயா (அதாவது, கேலித்தா)[a]
  rationale: הוּא இங்கு விளக்க இணைப்பாக இருந்து, கேலித்தா என்பது அதே நபருக்கான வேறு பெயர் அல்லது பெயர் வடிவம் என்பதைச் சுட்டுகிறது; மூலத்தின் அடையாளப்படுத்தும் அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: פְּתַחְיָה
  choice: பெத்தகியா
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்யொலி அமைப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இச்சூழலில் கோத்திரத்தையோ நாட்டையோ அல்ல, ஒரு தனிநபரைக் குறிக்கும் பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וֶאֱלִיעֶזֶר
  choice: எலியேசர்
  rationale: மெய்யெழுத்து வடிவமும் உயிர்க்குறிப்பும் எலியேசர் என்ற வாசிப்பை ஆதரிக்கின்றன; பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
