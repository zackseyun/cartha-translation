translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. சொல் வரிசை தமிழுக்கு இயல்பாக மாற்றப்பட்டாலும், எபிரெய உரையின் விதிவிலக்கு வலியுறுத்தலும் ‘எதிர்த்து நின்றார்கள்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
