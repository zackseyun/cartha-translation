language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: ta
  text: ஆசகேலின் மகன் யோனத்தானும், திக்வாவின் மகன் யக்செயாவும்[a] மட்டுமே இதை எதிர்த்து நின்றார்கள்; மெசுல்லாமும் லேவியனான சப்பெத்தாயும் அவர்களுக்கு ஆதரவளித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திக்வாவின் மகன் யகசியா.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுக்கு உதவினார்கள்’ அல்லது ‘அவர்களுக்குத் துணைநின்றார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: மட்டுமே
  rationale: முந்தைய வசனத்தில் தெரிவிக்கப்பட்ட பொதுவான ஒப்புதலிலிருந்து இவர்கள் மட்டும் விதிவிலக்காக இருந்ததைச் சுட்டும் கட்டுப்படுத்தும் பொருளை இயல்பாகத் தருகிறது.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: ஆசகேலின் மகன் யோனத்தான்
  rationale: எபிரெயப் பெயர்களின் ஒலியைத் தமிழில் அண்மையாகத் தருகிறது; בֶּן என்பதை இயல்பான உறவுமுறைச் சொல்லாக்கத்தில் ‘மகன்’ என்று மொழிபெயர்க்கிறது.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: திக்வாவின் மகன் யக்செயா
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள எபிரெய வடிவத்தின் ஒலியை அண்மையாகப் பெயர்த்தெழுதுகிறது; பாரம்பரிய மாற்றுப் பெயர்வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָמְדוּ עַל זֹאת
  choice: இதை எதிர்த்து நின்றார்கள்
  rationale: இந்தச் சூழலில் முன்வைக்கப்பட்ட நடவடிக்கைக்கு எதிரான நிலைப்பாட்டை இந்த மரபுத்தொடர் குறிக்கிறது. ‘நின்றார்கள்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே எதிர்ப்பின் பொருளைத் தெளிவாக்குகிறது.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: மெசுல்லாமும் லேவியனான சப்பெத்தாயும்
  rationale: הַלֵּוִי என்ற அடைமொழி எபிரெயச் சொல் வரிசைப்படி சப்பெத்தாயை மட்டும் குறிப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲזָרֻם
  choice: அவர்களுக்கு ஆதரவளித்தார்கள்
  rationale: עזר என்பது உதவுதல் அல்லது துணைநிற்றல் என்று பொருள்படும்; இங்கு இருவரின் நிலைப்பாட்டை மற்றவர்கள் ஆதரித்த நடைமுறைச் சூழலை இந்தச் சொல்லாக்கம் இயல்பாக வெளிப்படுத்துகிறது.
