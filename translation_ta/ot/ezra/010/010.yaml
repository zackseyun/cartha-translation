base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: ta
  text: அப்போது ஆசாரியரான எஸ்றா எழுந்து அவர்களிடம், “நீங்கள் உண்மையற்றவர்களாய் நடந்துகொண்டு, அந்நியப் பெண்களை[a] மனைவிகளாக ஏற்றுக்கொண்டு, இஸ்ரவேலின் குற்றத்தை அதிகரித்துள்ளீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நிய மனைவிகளை.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “அந்நியப் பெண்கள்”; இச்சூழலில் அது மனைவிகளாக ஏற்றுக்கொள்ளப்பட்ட பெண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து நின்று
  rationale: சபையின் முன் எஸ்றா மேற்கொண்ட வெளிப்படையான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியரான
  rationale: எஸ்றாவை அடையாளப்படுத்தும் பதவிப் பெயரை இயல்பான தமிழ் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: מְעַלְתֶּם
  choice: உண்மைத்தவறி
  rationale: מעל என்பதிலுள்ள நம்பிக்கை அல்லது உடன்படிக்கை விசுவாசத்தை மீறிய கருத்தை, வெறும் பொதுவான தவறு என்று குறுக்காமல் தெரிவிக்கிறது.
- source_word: וַתֹּשִׁיבוּ
  choice: ஏற்றுக்கொண்டதால்
  rationale: Hiphil வடிவின் சொற்பொருள் ‘குடியிருக்கச் செய்தல்’; இச்சூழலில் பெண்களை மனைவிகளாகக் குடும்பத்திற்குள் கொண்டுவந்ததைக் குறிக்கிறது. ‘மனைவிகளாக’ என்பதோடு சேர்ந்து தமிழ் இயல்பாக அமைகிறது.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மனைவிகளாக
  rationale: எபிரெயச் சொற்றொடரின் ‘அந்நியப் பெண்கள்’ என்ற வடிவத்தையும், சூழல் காட்டும் திருமண உறவையும் இரண்டையும் காக்கிறது.
- source_word: לְהוֹסִיף
  choice: அதிகரித்திருக்கிறீர்கள்
  rationale: முந்தைய செயலால் இஸ்ரவேலின் குற்றம் கூடிவிட்ட விளைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אַשְׁמַת
  choice: குற்றத்தை
  rationale: இங்கு பலியைக் குறிக்காமல் குற்றநிலையையும் அதனால் உண்டான பொறுப்பையும் குறிக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலின்
  rationale: உடன்படிக்கைச் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் பெயராகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் கூட்டு உடன்படிக்கைக் குற்றப்பொறுப்பு
  choice: இஸ்ரவேலின் குற்றத்தை அதிகரித்திருக்கிறீர்கள்
  alternative: உங்கள் குற்றத்தை அதிகரித்திருக்கிறீர்கள்
  rationale: எபிரெய உரை தனிநபர்களின் தவறை மட்டும் அல்லாமல், அவர்களின் செயலால் இஸ்ரவேல் சமூகத்தின் குற்றம் அதிகரித்ததாகக் கூறுகிறது; அந்தக் கூட்டு பரிமாணம் பாதுகாக்கப்படுகிறது.
- issue: נָשִׁים என்பதிலுள்ள பெண்கள்/மனைவிகள் பொருள் நுட்பம்
  choice: அந்நியப் பெண்களை மனைவிகளாக
  alternative: அந்நிய மனைவிகளை
  rationale: மூலத்தின் ‘பெண்கள்’ என்ற சொல்வடிவத்தை வைத்துக்கொண்டே, இப்பகுதியின் திருமணச் சூழலைத் தெளிவாக்குகிறது; அடிக்குறிப்பு மாற்று சுருக்கமான வாசிப்பைக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உண்மைத்தவறி’ என்பது உடன்படிக்கை சார்ந்த நம்பிக்கை மீறலைச் சுருக்கமாகக் காட்டுகிறது; ‘மனைவிகளாக ஏற்றுக்கொண்டதால்’ என்பது மூலத்தின் குடியிருக்கச் செய்தல் என்ற உருவகத்தையும் திருமணச் சூழலையும் இணைக்கிறது.
