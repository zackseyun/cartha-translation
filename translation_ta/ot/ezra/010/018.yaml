base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: ta
  text: அந்நியப் பெண்களை மனைவிகளாகக் கொண்டிருந்த[a] ஆசாரியர் வம்சத்தினரில் சிலர் காணப்பட்டனர்; அவர்களில், யோசாதாக்கின் மகன் யெசுவாவின் மகன்களிலும் அவருடைய சகோதரர்களிலும் மாசெயா, எலியேசர், யாரீப், கெதலியா ஆகியோர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியப் பெண்களை மணந்திருந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: காணப்பட்டனர்
  rationale: எபிரெய வினை ஒருமையில் இருந்தாலும், தொடர்ந்து பல ஆண்களின் பட்டியல் வருவதால் தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டுள்ளது; கண்டறியப்பட்டனர் என்ற நிர்வாகத் தொனியைவிட காணப்பட்டனர் மூலத்தின் சொல்லாட்சிக்கு நெருக்கமானது.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் மகன்களில்
  rationale: בְּנֵי என்பதன் குடும்பவழிச் சொல்லாட்சியை மகன்கள் என்று தக்கவைத்து, מִן இங்கு குழுவினுள் உள்ளவர்களைக் குறிப்பதை -இல் விகுதி வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மனைவிகளாகக் கொண்டிருந்த
  rationale: הֹשִׁיבוּ என்ற அபூர்வமான சொற்றொடர் இச்சூழலில் திருமண உறவை ஏற்படுத்திய அல்லது தொடர்ந்து வைத்திருந்த பொருளைத் தருகிறது. கொண்டிருந்த என்பது அதன் நிலைத்த உறவுப் பொருளை இயல்பான தமிழில் தருகிறது; பெண்கள் என்ற மூலச் சொல்லும் பிரதான உரையில் பாதுகாக்கப்படுகிறது.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்கள்
  rationale: நேரடியான சொற்பொருளைத் தக்கவைத்து, மனைவிகளாக என்ற சூழல்சார் கூறால் திருமண உறவு தெளிவாக்கப்படுகிறது.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: யோசாதாக்கின் மகன் யெசுவாவின் மகன்களில்
  rationale: மீண்டும் வரும் מִבְּנֵי என்ற வம்சவழிச் சொல்லாட்சியை மகன்களில் என்று வெளிப்படையாகத் தக்கவைக்கிறது; பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்களிலும்
  rationale: மூன்றாம் நபர் ஒருமை பின்னொட்டு யெசுவாவைக் குறிக்கிறது. אָח என்பதற்கான நேரடி பொருளான சகோதரர் பயன்படுத்தப்பட்டு, பட்டியலின் இலக்கணத் தொடர்புக்காக -இலும் சேர்க்கப்பட்டுள்ளது.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: மாசெயா, எலியேசர், யாரீப், கெதலியா
  rationale: தனிப்பெயர்கள் பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
theological_decisions:
- issue: அந்நியப் பெண்களுடனான உறவின் விளக்கம்
  choice: அந்நியப் பெண்களை மனைவிகளாகக் கொண்டிருந்த
  alternative: அந்நியப் பெண்களை மணந்திருந்த
  rationale: மூலச் சொற்றொடரின் திருமணச் சூழலைத் தெளிவாக்கினாலும், அது திருமணச் சடங்கை மட்டும் குறிப்பதாகச் சுருக்காமல், ஏற்படுத்தப்பட்ட அல்லது தொடர்ந்த மணவுறவின் பரப்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வேதாகமப் பட்டியலுக்கேற்ற கண்ணியமான நடையும் தெளிவான வம்சவழி அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. ஆசாரியர் என்பது பரவலாக அறியப்படும் வேதாகமச் சொல்; மகன்கள் என்ற வடிவம் மூலத்தின் குடும்பவழிச் சொல்லாட்சியைப் பாதுகாக்கிறது.
