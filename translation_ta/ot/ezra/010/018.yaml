  source_fidelity: மூலத்தின் குழு-அறிமுகமும் பெயர்ப்பட்டியலும் பெரும்பாலும் சரியாக உள்ளன. ஆனால் “யெசுவாவின் மகன்களிலும் அவனுடைய சகோதரர்களிலும்” என்ற வடிவம், பட்டியலில் உள்ள நபர்களுடனான தொடர்பைத் தமிழில் சற்றே தெளிவற்றதாகவும் இணைப்பு இயல்பற்றதாகவும் ஆக்குகிறது. எபிரெயத்தின் இரண்டாம் מִבְּנֵי-அமைப்பையும் וְאֶחָיו-வையும் காக்கும் வகையில் மறுசீரமைக்கப்பட்டுள்ளது.
  naturalness: “ஆசாரியர்களின் மகன்கள்” என்பதற்குப் பதிலாக “ஆசாரியர் வம்சத்தினரில்” என்பது நவீன தரத் தமிழில் இச்சூழலின் குழு/வம்சக் குறியீட்டை அதிக இயல்பாகத் தருகிறது; இருப்பினும் மூலத்தின் குடும்பவழி உணர்வு நிலைக்கிறது. பட்டியலுக்கு முன்னர் “அவர்களில்” சேர்ப்பது தமிழ்ச் சொற்றொடரமைப்பைத் தெளிவாக்குகிறது.
