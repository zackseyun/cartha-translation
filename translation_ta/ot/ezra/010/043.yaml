translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணியுள்ளோம். மூலத்தில் பெயருக்கான குறிப்பு தெளிவற்ற இடத்தில் மட்டுமே அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது; ஆங்கில ஆலோசனை உரையில் குறிப்புக்குறி யெயியேலுக்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் ידו என்ற உறுதியற்ற பெயரைச் சாருவதால் தமிழில் ‘யத்தாய்’ என்பதற்குப் பின் சரியாக அமைக்கப்பட்டுள்ளது.
