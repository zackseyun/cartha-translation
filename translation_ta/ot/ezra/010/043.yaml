reference: Ezra 10:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ/בְּנֵ֖י נְב֑וֹ יְעִיאֵ֤ל מַתִּתְיָה֙ זָבָ֣ד זְבִינָ֔א ידו וְ/יוֹאֵ֖ל בְּנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: ta
  text: 'நேபோவின் மக்களில்: யெயியேல், மத்தித்தியா, சாபாத், செபீனா, யத்தாய்[a], யோவேல், பெனாயா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘யத்தாய்’ என்று தரப்பட்டுள்ள எபிரெயப் பெயர் உறுதியற்றது; இதை ‘இத்தோ’ அல்லது ‘யெதோ’ என்றும் பெயரெழுத்தாக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: மக்களில்
  rationale: מִן முன்னொட்டுடன் வரும் בְּנֵי, பெரிய பட்டியலுக்குள் நேபோவின் வழிவந்தவர்களைச் சேர்ந்த சிலரை அறிமுகப்படுத்துகிறது. பட்டியல் நடையில் இயல்பாகவும் சுருக்கமாகவும் இதைத் தமிழில் ‘மக்களில்’ எனத் தந்துள்ளோம்.
- source_word: נְבוֹ
  choice: நேபோ
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயன்றவரை பேணும் பெயரெழுத்தாக்கம்.
- source_word: יְעִיאֵל
  choice: யெயியேல்
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிரொலிகளுக்கு நெருக்கமான தமிழ் பெயரெழுத்தாக்கம்.
- source_word: מַתִּתְיָה
  choice: மத்தித்தியா
  rationale: இரட்டித்த மெய்யையும் பெயரின் இறுதி வடிவத்தையும் பேணும் தமிழ் பெயரெழுத்தாக்கம்.
- source_word: זָבָד
  choice: சாபாத்
  rationale: எபிரெயப் பெயரைத் தமிழில் வாசிக்க ஏற்றபடி ஒலிபெயர்த்துள்ளோம்.
- source_word: זְבִינָא
  choice: செபீனா
  rationale: எபிரெயப் பெயரின் நீண்ட ī ஒலியைப் பேணும் தமிழ் பெயரெழுத்தாக்கம்.
- source_word: ידו
  choice: யத்தாய்[a]
  rationale: இங்குள்ள மெய்யெழுத்து வடிவம் தெளிவற்றது; பட்டியலில் இது ஒரு நபரின் பெயராக இருப்பதால் ‘யத்தாய்’ என முதன்மை உரையில் கொடுத்து, மாற்று வாசிப்புகளை அடிக்குறிப்பில் பதிவு செய்துள்ளோம்.
- source_word: וְ/יוֹאֵל
  choice: யோவேல்
  rationale: பெயரின் எபிரெய ஒலிவடிவத்தைப் பேணியுள்ளோம். தமிழ் பட்டியலில் இறுதிப் பெயருக்கு முன் தனியான இணைப்புச்சொல் தேவையில்லாததால் וְ என்பதைக் காற்புள்ளிப் பட்டியல் அமைப்பால் வெளிப்படுத்தியுள்ளோம்.
- source_word: בְּנָיָה
  choice: பெனாயா
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான, தமிழில் இயல்பாக வாசிக்கக்கூடிய பெயரெழுத்தாக்கம்.
