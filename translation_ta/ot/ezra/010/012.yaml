translation:
  language: ta
  text: அப்போது கூட்டத்தார் அனைவரும் உரத்த குரலில், “ஆம், நீங்கள் சொன்னபடியே நாங்கள் செய்ய வேண்டும்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: பதிலளித்து
  rationale: இச்சூழலில் ענה என்பது எஸ்றாவின் உரைக்கு மக்கள் அளித்த பதிலை அறிமுகப்படுத்துகிறது; ‘பதிலளித்து’ என்பது அதன் உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָל הַקָּהָל
  choice: கூட்டத்தார் அனைவரும்
  rationale: קָהָל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘கூட்டத்தார்’ அதன் கூடியிருக்கும் மக்கள் என்ற பொருளைத் தருகிறது; כָל என்பதற்கு ‘அனைவரும்’ நேரான இணை.
- source_word: וַיֹּאמְרוּ
  choice: சொன்னார்கள்
  rationale: אָמַר என்பதன் பொதுவான பேச்சுச் செயலை ‘சொன்னார்கள்’ நேரடியாகக் காட்டுகிறது; ‘பதிலளித்துச் சொன்னார்கள்’ என்ற தொடரும் எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: קוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: சொல்லுக்கு சொல் ‘பெரிய குரல்’ என்றாலும், இங்கு வலிமையான பொது அறிவிப்பைக் குறிக்கும் இயல்பான தமிழாக்கம் ‘உரத்த குரலில்’.
- source_word: כֵּן
  choice: ஆம்
  rationale: இங்கு כֵּן முன்வைக்கப்பட்ட கோரிக்கைக்கு நேரடியான ஒப்புதலைத் தெரிவிக்கிறது; ‘ஆம்’ அந்தச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִדְבָרֶיךָ
  choice: நீங்கள் சொன்னபடியே
  rationale: சொல்லுக்கு சொல் ‘உமது வார்த்தைகளின்படி’; நவீன மரியாதைத் தமிழில் ‘நீங்கள் சொன்னபடியே’ என்பது பொருளையும் இரண்டாம் நபர் ஒருமையின் மரியாதையையும் இயல்பாகத் தருகிறது.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: செய்வது எங்கள் கடமை
  rationale: சொல்லுக்கு சொல் ‘செய்வது எங்கள்மேல் உள்ளது’; இங்கு பொறுப்பு அல்லது கட்டாயம் தங்கள்மேல் இருப்பதைக் குறிக்கும் எபிரெய மொழிவழக்கை ‘எங்கள் கடமை’ இயல்பாக வெளிப்படுத்துகிறது.
