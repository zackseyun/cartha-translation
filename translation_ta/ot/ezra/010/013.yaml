  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: ta
  text: ஆனால் மக்கள் ஏராளமாக இருக்கிறார்கள்; இது மழைக்காலம். வெளியே நின்றுகொண்டிருக்க எங்களுக்குச் சக்தியில்லை. இந்த வேலை ஒரு நாளிலோ இரண்டு நாட்களிலோ முடிக்கக்கூடியதல்ல; ஏனெனில் இந்தக் காரியத்தில் நாங்கள் மிகவும் மீறி நடந்திருக்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியத்தில் நாங்கள் பெரும் பாவம் செய்திருக்கிறோம்.”
    reason: פשׁע என்பதற்கு ‘மீறுதல்,’ ‘கலகம் செய்தல்,’ அல்லது சூழலின்படி ‘பாவம் செய்தல்’ என்ற பொருள் நிழல்கள் இருக்கலாம்.
