theological_decisions:
- issue: לִפְשֹׁעַ குறிப்பிடும் குற்றத்தின் தன்மை
  choice: மீறி நடந்திருக்கிறோம்
  alternative: பாவம் செய்திருக்கிறோம்; கலகமாக நடந்திருக்கிறோம்
  rationale: மூலச்சொல்லின் கடுமையையும் உடன்படிக்கை மீறலின் நிழற்பொருளையும் காக்கிறது; அதேவேளையில் இந்த வசனம் வெளிப்படையாக வரையறுக்காத கோட்பாட்டு வகையை அதன்மேல் சுமத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மூலத்தின் தொடர் காரணவாத அமைப்பு காக்கப்பட்டாலும், காலநீட்சியைக் குறிக்கும் சொற்றொடர் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
