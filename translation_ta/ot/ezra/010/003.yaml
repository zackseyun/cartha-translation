source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: ta
  text: ஆகையால் இப்போது, எல்லாப் பெண்களையும் அவர்களுக்குப் பிறந்தவர்களையும் அனுப்பிவிடுவோம் என்று, என் ஆண்டவரினதும் நம் கடவுளின் கட்டளைக்கு நடுங்குகிறவர்களினதும் ஆலோசனைப்படி, நம் கடவுளோடு ஓர் உடன்படிக்கை செய்வோம்; திருச்சட்டத்தின்படி செய்யப்படட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: ஓர் உடன்படிக்கை செய்வோம்
  rationale: எபிரெய மொழியின் சொற்பொருளான ‘உடன்படிக்கையை வெட்டுதல்’ என்பதற்குப் பதிலாக, தமிழில் இயல்பாகவும் அதன் உடன்படிக்கை சார்ந்த வலிமையைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: לְהוֹצִיא
  choice: அனுப்பிவிடுவோம்
  rationale: இங்கு ஹிஃபில் வினை பெண்களையும் அவர்களுக்குப் பிறந்தவர்களையும் சமூகத்திலிருந்து அகற்றி அனுப்புவதைக் குறிக்கிறது; ‘விவாகரத்து செய்வோம்’ என்பது மூலத்தில் நேரடியாக இல்லாத சட்ட விளக்கத்தைச் சேர்க்கும்.
- source_word: הַנּוֹלָד מֵהֶם
  choice: அவர்களுக்குப் பிறந்தவர்கள்
  rationale: மூலத்தின் ஒருமைத் தொகுப்புச் சொல்லை பாலினத்தைக் குறிப்பிடாமல் இயல்பான தமிழ் பன்மையில் வழங்குகிறது; சூழலில் பிள்ளைகள் குறிக்கப்பட்டாலும் அதனை உரைக்குள் விளக்கமாகச் சேர்க்கவில்லை.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவர்
  rationale: மசோரா உயிர்க்குறிகளின்படி இது முதல் நபர் ஒருமை உடைமை வடிவமான ‘என் ஆண்டவர்’; தேவநாமமான יהוה அல்ல.
- source_word: הַחֲרֵדִים
  choice: நடுங்குகிறவர்கள்
  rationale: கடவுளின் கட்டளைக்கான ஆழ்ந்த அச்சமும் கீழ்ப்படிதலும் அடங்கிய மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תּוֹרָה
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் வழிகாட்டும் தெய்வீகச் சட்டத்தைக் குறிக்கிறது; ‘போதனை’ என்ற பரந்த பொருளைவிட சட்டச் சூழலைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: אֲדֹנָי என்பது கடவுளைக் குறிக்கிறதா அல்லது மனிதத் தலைவரைக் குறிக்கிறதா
  choice: என் ஆண்டவர்
  alternative: ஆண்டவர்
  rationale: மெய்யெழுத்து வடிவம் சூழலின்றி வேறு விதமாகப் புரியக்கூடியதாயினும், WLC-யின் மசோரா வாசிப்பும் தொடரமைப்பும் ‘என் ஆண்டவர்’ என்ற மனித மரியாதை அழைப்பை ஆதரிக்கின்றன; அதைத் தேவநாமமாக மாற்றவில்லை.
- issue: பெண்களை அனுப்புவது விவாகரத்தாகத் தெளிவுபடுத்தப்பட வேண்டுமா
  choice: அனுப்பிவிடுவோம்
  alternative: விவாகரத்து செய்து அனுப்பிவிடுவோம்
  rationale: மூலம் ‘வெளியே அனுப்புதல்’ என்றே கூறுகிறது. உரையின் கடினமான வரலாற்று-இறையியல் பதற்றத்தை மென்மையாக்காமலும், அதே சமயம் மூலத்தில் இல்லாத சட்டப் பதத்தைச் சேர்க்காமலும் வைத்திருக்கிறது.
- issue: ஆலோசனை யாருடையது
  choice: என் ஆண்டவரின் ஆலோசனைப்படியும் ... நடுங்குகிறவர்களின் ஆலோசனைப்படியும்
  alternative: என் ஆண்டவர் மற்றும் ... நடுங்குகிறவர்களின் ஆலோசனைப்படி
  rationale: וְ இணைப்பை இரு ஆலோசனை ஆதாரங்களையும் இணைப்பதாக வெளிப்படையாக வழங்குகிறது; எபிரெய தொடரமைப்பின் சாத்தியமான குழப்பத்தைத் தமிழில் தேவையின்றி வேறு திசையில் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை. வசனத்தின் கடுமையான செயலை மறைக்காமல் நேரடியாகத் தருகிறது. ‘கடவுள்’ இயல்பான பொதுப்பெயராகவும், ‘திருச்சட்டம்’ சட்டச் சூழலை உணர்த்தவும் பயன்படுத்தப்பட்டது.
