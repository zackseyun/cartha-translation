language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: ta
  text: 'மேலும், பாகாத்-மோவாபின் மகன்களில்: அத்னா, கெலால், பெனாயா, மாசெயா, மத்தனியா, பெசலேல், பின்னூயி, மனாசே ஆகியோர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: மகன்களில்
  rationale: பட்டியலின் தொடர்ச்சியைத் தமிழ்ச் சூழல் இயல்பாகக் காட்டுகிறது; בְּנֵי என்பதன் நேரடியான உறவுச் சொல்லையும் מִן என்பதன் ‘இலிருந்து/இல்’ பொருளையும் இணைக்கிறது. வசனம் தனியாக மேற்கோளிடப்படும்போது தொடக்க ‘וּ’வை ‘மேலும்’ என வெளிப்படையாக மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருப்பதால் பட்டியல் அமைப்பில் உணர்த்தப்பட்டுள்ளது.
- source_word: פַּחַת מוֹאָב
  choice: பாகாத்-மோவாப்
  rationale: குடும்ப அல்லது குலப்பெயராக இருப்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; கூட்டு பெயர் இணைப்புக்குறியுடன் தரப்பட்டுள்ளது.
- source_word: עַדְנָא
  choice: அத்னா
  rationale: எபிரெய மெய்யொலிகளை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּ/כְלָל
  choice: கெலால்
  rationale: כ ஒலியை இச்சூழலில் ‘க’ என்றும், பெயரின் உயிரமைப்பை ‘கெலால்’ என்றும் ஒலிபெயர்க்கிறது; பெயருக்கு முன் உள்ள இணைப்புச்சொல் தமிழ்ப் பட்டியல் நிறுத்தக்குறியால் இயல்பாக வெளிப்படுகிறது.
- source_word: בְּנָיָה
  choice: பெனாயா
  rationale: எபிரெயப் பெயரின் ஒலிக்கு அண்மையான தமிழ் வடிவம்.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: ע ஒலிக்கு தமிழில் துல்லியமான இணை இல்லாததால் இயல்பான தமிழ் உச்சரிப்புடன் எபிரெய உயிர்வரிசையை அணுகும் ஒலிபெயர்ப்பு.
- source_word: מַתַּנְיָה
  choice: மத்தனியா
  rationale: தக்கேஷ் சுட்டும் இரட்டித்த மெய்யை ‘த்த’ மூலம் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְצַלְאֵל
  choice: பெசலெயேல்
  rationale: பெயரின் எபிரெய ஒலியமைப்பைத் தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கிறது.
- source_word: וּ/בִנּוּי
  choice: பின்னூயி
  rationale: இரட்டித்த נ ஒலியையும் நீண்ட உயிரையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; இணைப்புச்சொல் பட்டியல் நிறுத்தக்குறியால் வெளிப்படுகிறது.
- source_word: וּ/מְנַשֶּׁה
  choice: மனாசே ஆகியோர்
  rationale: பெயர் எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்படுகிறது; இறுதி וּ-வின் பட்டியல் இணைப்பைத் தமிழில் ‘ஆகியோர்’ இயல்பாக நிறைவு செய்கிறது.
