translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டது. தனிப்பெயர்கள் ஆங்கில மரபு வடிவங்களை அப்படியே சாராமல் எபிரெய மூல ஒலிகளிலிருந்து தமிழாக்கப்பட்டுள்ளன. ‘மகன்கள்’ என்பது வம்சத்தார் அல்லது குல உறுப்பினர்களையும் குறிக்கக்கூடிய மூலப் பட்டியல் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
