  register: நவீன நிலையான தமிழில், குலப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொற்கள் தமிழின் இயல்பான பட்டியல் நிறுத்தக்குறிகளாலும் இறுதியில் ‘ஆகியோர்’ என்பதாலும் வழங்கப்பட்டுள்ளன.
