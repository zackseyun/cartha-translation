  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: ta
  text: 'இஸ்ரவேலிலிருந்து, பாரோஷின் மகன்களில்: ரமியா, யிஸ்ஸியா, மல்கியா, மியாமீன், எலெயாசார், மல்கியா[a], பெனாயா ஆகியோர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் “மல்கியா” என்ற பெயர் இந்தப் பட்டியலில் இருமுறை வருகிறது; இது ஒரே பெயரைக் கொண்ட இரு வேறு நபர்களைக் குறிக்கலாம்.
    reason: மூலப் பட்டியலில் பெயர் இருமுறை வருவதைத் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  choice: இஸ்ரவேலரில்
  rationale: முந்தைய பட்டியலின் தொடர்ச்சியில், இஸ்ரவேல் சமூகத்தைச் சேர்ந்தவர்களை அறிமுகப்படுத்தும் מִן முன்னிடைச்சொல்லை இயல்பான தமிழில் ‘இஸ்ரவேலரில்’ என வழங்குகிறது.
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: பரோசின் மகன்களில்
  rationale: בְּנֵי என்பதன் ‘மகன்கள்’ என்ற நேரடிப் பொருளையும் குலப் பட்டியல் நடையையும் தக்கவைக்கிறது; இங்கு அது பரோசின் வழிவந்தவர்களையோ குடும்ப உறுப்பினர்களையோ குறிக்கலாம்.
- source_word: רַמְיָה וְיִזִּיָּה וּמַלְכִּיָּה וּמִיָּמִן וְאֶלְעָזָר וּמַלְכִּיָּה וּבְנָיָה
  choice: ரமியா, இசியா, மல்கியா, மியாமின், எலெயாசார், மல்கியா, பெனாயா
  rationale: எபிரெய தனிப்பெயர்கள் நவீனத் தமிழில் உச்சரிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் மல்கியா பெயர் இரு இடங்களிலும் விடாமல் தக்கவைக்கப்பட்டுள்ளது.
