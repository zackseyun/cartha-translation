  text: וּ/כְ/הִתְפַּלֵּ֤ל עֶזְרָא֙ וּ/כְ֨/הִתְוַדֹּת֔/וֹ בֹּכֶה֙ וּ/מִתְנַפֵּ֔ל לִ/פְנֵ֖י בֵּ֣ית הָ/אֱלֹהִ֑ים נִקְבְּצוּ֩ אֵלָ֨י/ו מִ/יִּשְׂרָאֵ֜ל קָהָ֣ל רַב מְאֹ֗ד אֲנָשִׁ֤ים וְ/נָשִׁים֙ וִֽ/ילָדִ֔ים כִּֽי בָכ֥וּ הָ/עָ֖ם הַרְבֵּה בֶֽכֶה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: ta
  text: எஸ்ரா இறைவனின் இல்லத்தின் முன்பாக ஜெபித்து, பாவ அறிக்கை செய்து, அழுது, விழுந்துகிடந்தபோது, இஸ்ரவேலிலிருந்து ஆண்களும் பெண்களும் பிள்ளைகளும் அடங்கிய மிகப் பெரிய கூட்டம் அவரிடம் திரண்டது. ஏனெனில் மக்கள் மிகவும் அழுதார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “மிகுந்த அழுகையோடு அழுதார்கள்.”
    reason: மூல எபிரெயத்தில் வினைச்சொல்லும் அதே வேருடன் தொடர்புடைய பெயர்ச்சொல்லும் சேர்ந்து அழுகையின் தீவிரத்தை வலியுறுத்துகின்றன; முதன்மை உரை அதை இயல்பான தமிழில் தருகிறது.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: எஸ்ரா ... மன்றாடி ... இருந்தபோது
  rationale: כְּ முன்னொட்டு ஒரே நேரத்தில் நடந்த பின்னணிச் செயலைக் குறிக்கிறது. தமிழில் தொடர்ச்சியான வினையெச்சங்களுடன் முடியும் ‘இருந்தபோது’ அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது; ‘மன்றாடி’ என்பது இச்சூழலில் உள்ள பக்தியும் வேண்டுதலும் நிறைந்த ஜெபச் செயலைக் காட்டுகிறது.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: பாவ அறிக்கை செய்து
  rationale: התודה இங்கு ஒப்புக்கொள்ளுதல் அல்லது பாவ அறிக்கை செய்தல் என்ற பொருளுடையது. யாருடைய தனிப்பட்ட பாவங்கள் என்று மூலத்தில் வெளிப்படையாகக் கூறப்படாததால், ‘தன் பாவங்களை’ என்று சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: அழுது, விழுந்துகிடந்தபோது
  rationale: இரு வடிவங்களும் தொடர்ந்த செயலைக் காட்டுகின்றன. ‘விழுந்துகிடந்தபோது’ என்பது தாழ்ந்து வேண்டிக்கொண்ட உடல்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; முழுமையாக முகங்குப்புறக் கிடந்தார் என்று மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: இறைவனின் இல்லத்துக்கு முன்பாக
  rationale: ‘இறைவனின் இல்லம்’ என்பது மூலத்தின் ‘தேவனுடைய வீடு/இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அது ஆலயத்தைக் குறித்தாலும், ‘ஆலயம்’ என்று மாற்றிப் பொருளை மட்டும் தரவில்லை.
- source_word: נִקְבְּצוּ אֵלָיו
  choice: அவரிடம் திரண்டது
  rationale: קבץ என்பதன் செயப்பாட்டு வடிவம் கூடிவருதலைக் குறிக்கிறது; אֵלָיו என்பதற்கு ‘அவரிடம்’ நேரான, இயல்பான இணையாகும். கூட்டம் ஒருமை என்பதால் ‘திரண்டது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: இஸ்ரவேலரிலிருந்து ... மிகப் பெரிய கூட்டம்
  rationale: מִן என்பது இஸ்ரவேல் சமூகத்திலிருந்து வந்தவர்களைக் குறிக்கிறது. קהל என்பதற்கு இச்சூழலில் சமய அமைப்புச் சாயல் சேர்க்காத ‘கூட்டம்’ பொருத்தமானது; רַב מְאֹד அதன் மிகப் பெரிய அளவைச் சுட்டுகிறது.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: ஆண்களும் பெண்களும் பிள்ளைகளும் அடங்கிய
  rationale: மூலத்தில் தெளிவாகக் கூறப்பட்ட மூன்று குழுக்களும் அப்படியே பாதுகாக்கப்பட்டுள்ளன. ‘அடங்கிய’ என்பது தமிழில் கூட்டத்தின் அமைப்பை இயல்பாக இணைக்கிறது.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: ஏனெனில் மக்கள் மிகவும் அழுதார்கள்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டுள்ளது. הַרְבֵּה בֶכֶה என்பது அழுகையின் தீவிரத்தை வலியுறுத்தும் எபிரெயச் சொற்றொடர்; ‘மிகவும் அழுதார்கள்’ அதைக் கூடுதல் உணர்ச்சிப் பொருள் சேர்க்காமல் இயல்பாகத் தருகிறது.
