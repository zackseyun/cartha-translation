translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ஒரேநேரச் செயல்கள் வினையெச்சத் தொடராகவும், கூட்டத்தின் அமைப்பு தெளிவான பட்டியலாகவும் தரப்பட்டுள்ளது. ‘இறைவனின் இல்லம்’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘பாவ அறிக்கை’ குறிப்பிட்ட நபரின் தனிப்பட்ட பாவங்கள் என்று தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
