  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָנִי
  choice: பானி
  rationale: וּ என்பது பெயர்ப்பட்டியலைத் தொடரும் இணைப்புச் சொல். இயல்பான தமிழ் பட்டியல் நடைக்காக இங்கு தனியாக ‘மற்றும்’ என்று மொழிபெயர்க்கப்படவில்லை; בָנִי என்ற ஆள்பெயர் எபிரெய உச்சரிப்பை ஒட்டி ‘பானி’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בִנּוּי
  choice: பின்னூயி
  rationale: וּ பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் காற்புள்ளி மூலம் அந்தத் தொடர்பு இயல்பாக வெளிப்படுகிறது. בִנּוּי என்ற ஆள்பெயர் எபிரெய வடிவத்துக்கு நெருக்கமாக ‘பின்னூயி’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: שִׁמְעִי என்பது ஆள்பெயர். அதன் எபிரெய ஒலியமைப்பைத் தெளிவாகப் பிரதிபலிக்க ‘சிமெயி’ என ஒலிபெயர்க்கப்பட்டது; இதற்கு முன் இணைப்புச் சொல் இல்லை.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் முதல் இரு பெயர்களுக்கு முன் உள்ள வாவ் இணைப்புகள் தமிழில் மீள்மீளும் ‘மற்றும்’ என்பதற்குப் பதிலாக பட்டியல் நிறுத்தக்குறிகளால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
