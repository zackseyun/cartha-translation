  register: நவீன நிலையான தமிழில், நேரடியானதும் கண்ணியமானதுமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் வினைகள் ஆண்பால் ஒருமையில் இருந்தாலும், எஸ்றாவை மரியாதையுடன் ஒருமையில் அழைப்பதற்குத் தமிழின் மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
