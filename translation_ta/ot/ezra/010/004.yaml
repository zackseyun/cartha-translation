  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: ta
  text: எழுந்திருங்கள்[a]; ஏனெனில் இந்தக் காரியம் உங்கள் பொறுப்பில் உள்ளது; நாங்கள் உங்களுடன் இருக்கிறோம். திடமாக இருங்கள்; அதைச் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இந்தக் காரியம் உங்கள்மீது உள்ளது” என்றும், “இந்தப் பொறுப்பு உங்களுடையது” என்றும் மொழிபெயர்க்கலாம். இந்த விவகாரத்தைக் கையாளும் பொறுப்பு எஸ்றாவிடம் இருப்பதை எபிரெய மொழிநடை குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: எழுந்திருங்கள்
  rationale: קום என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம் உடனடியாகச் செயல்படுமாறு அழைக்கிறது. எஸ்றாவை மரியாதையுடன் ஒருமையில் அழைக்கும் நவீனத் தமிழில் ‘எழுந்திருங்கள்’ இயல்பாகவும் அறிவுறுத்தலின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துவதால், தமிழில் தெளிவான காரணத் தொடர்பை ‘ஏனெனில்’ தருகிறது.
- source_word: עָלֶיךָ הַדָּבָר
  choice: இந்தக் காரியம் உங்கள் பொறுப்பில் உள்ளது
  rationale: על + நபர் என்ற எபிரெய மொழிநடை, இந்த விவகாரத்தைக் கையாளும் பொறுப்பு எஸ்றாவிடம் இருப்பதைக் குறிக்கிறது. சொற்சொல்லான ‘உங்கள்மேல் உள்ளது’ தமிழில் சுமை அல்லது குற்றம் என்ற தேவையற்ற நிழற்பொருளைத் தரக்கூடும்; எனவே மொழிநடையின் பொருள் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: நாங்களும் உங்களுடன் இருக்கிறோம்
  rationale: ஆதரவும் ஒருமைப்பாடும் வெளிப்படுகின்றன. ‘நாங்களும்’ என்பது முன்னுள்ள பொறுப்பு எஸ்றாவுடையது என்ற கருத்துடன் அவர்களது துணையையும் இயல்பாக இணைக்கிறது.
- source_word: חֲזַק
  choice: திடன்கொள்ளுங்கள்
  rationale: חזק என்ற கட்டளை இச்சூழலில் வலிமையுடனும் உறுதியுடனும் இருக்குமாறு ஊக்குவிக்கிறது. ‘திடன்கொள்ளுங்கள்’ உடல் வலிமையை மட்டும் அல்லாமல் செயலுக்கான மனவுறுதியையும் இயல்பாகக் காட்டுகிறது.
- source_word: וַעֲשֵׂה
  choice: அதைச் செய்யுங்கள்
  rationale: עשה என்ற கட்டளை நடைமுறைச் செயலைக் கோருகிறது. ‘அதை’ என்பது முன்கூறிய காரியத்தைச் சுட்டுகிறது; எபிரெயத்தில் மறைமுகமாக உள்ள செயப்படுபொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
