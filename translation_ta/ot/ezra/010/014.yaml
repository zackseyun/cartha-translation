base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: ta
  text: முழுச் சபையின் சார்பில் நம் தலைவர்கள் நிற்கட்டும்.[a] நம் நகரங்களில் அந்நியப் பெண்களை மனைவிகளாகக் கொண்ட ஒவ்வொருவரும் நியமிக்கப்பட்ட நேரங்களில் வரட்டும்; அவர்களோடு அந்தந்த நகரத்தின் மூப்பர்களும் அதன் நீதிபதிகளும் வரட்டும். இந்தக் காரியம் தொடர்பாக நம் கடவுளின் எரியும் கோபம் நம்மைவிட்டு விலகும்வரை இவ்வாறு வரட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “முழுச் சபைக்காக நம் தலைவர்கள் நிற்கட்டும்.” இங்கு தலைவர்கள் சபையின் சார்பில் முன்நின்று பொறுப்பேற்பது குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தக் காரியத்தினால் நம் கடவுளின் எரியும் கோபம் நம்மைவிட்டு விலகும்வரை.” இறுதி எபிரெயச் சொற்றொடர் ‘இந்தக் காரியம் தொடர்பாக’ என்றும் ‘இந்தக் காரியத்தினால்’ என்றும் இணைக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: செயல்படட்டும்
  rationale: நָא உடன் வரும் வேண்டுகோள்/முன்மொழிவு நயத்தை ‘-ட்டும்’ வடிவம் இயல்பாகக் காட்டுகிறது. இச்சூழலில் ‘நிற்கட்டும்’ என்பது தமிழில் நோக்கத்தைத் தெளிவாகச் சொல்லாததால், நிர்வாகப் பொறுப்பேற்று நிற்பதைக் ‘செயல்படட்டும்’ என மொழிபெயர்த்தோம்.
- source_word: שָׂרֵינוּ
  choice: நம் தலைவர்கள்
  rationale: שׂרים என்பது இங்கு அரச குமாரர்களை அல்ல, சமூகத்தின் தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது.
- source_word: לְכָל הַקָּהָל
  choice: சபை முழுவதின் சார்பாக
  rationale: לְ இங்கு தலைவர்கள் முழுச் சபையையும் பிரதிநிதித்துவப்படுத்திச் செயல்படுவதைக் குறிக்கலாம்; தமிழில் இந்த உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மனைவிகளாக ஏற்றுக்கொண்ட
  rationale: எபிரெயச் சொற்றொடர் சொல்லளவில் ‘அந்நியப் பெண்களை குடியிருக்கச் செய்த’ எனினும், குடும்பத்தில் மனைவிகளாகச் சேர்த்துக்கொண்ட திருமணச் சூழலைக் குறிக்கிறது.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: குறிக்கப்பட்ட காலங்களில்
  rationale: வழக்குகளை விசாரிப்பதற்காக முன்கூட்டியே நிர்ணயிக்கப்பட்ட நேரங்களைச் சுட்டுகிறது.
- source_word: זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: அந்தந்த நகரத்தின் மூப்பர்களும் நீதிபதிகளும்
  rationale: עִיר וָעִיר என்பதன் பகிர்ந்தளிக்கும் பொருளான ‘ஒவ்வொரு நகரமும்’ என்பதை ‘அந்தந்த நகரம்’ இயல்பாகத் தருகிறது; நீதிபதிகள் அந்த நகரத்துக்குரியவர்கள் என்பதும் காக்கப்படுகிறது.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: நம் கடவுளின் எரியும் கோபம்
  rationale: எபிரெய மொழியின் தீவிரமான ‘எரியும் கோபம்’ என்ற உருவகத்தைச் சீராக்காமல், நவீன தமிழில் புரியுமாறு பாதுகாக்கிறது.
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: நம்மைவிட்டு விலகும்வரை
  rationale: கோபம் சமூகத்திடமிருந்து திருப்பப்படுதல் அல்லது அகற்றப்படுதல் என்ற விளைவை இயல்பான தமிழில் தருகிறது; அதைச் செய்பவர் யார் என்பதைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தினால்
  rationale: இறுதித் தொடர் இலக்கண ரீதியாகக் கடினமும் ஓரளவு தெளிவற்றதுமாக உள்ளது. சூழலில் இந்தக் காரியத்தை முன்னிட்டு கோபம் வந்தது என்ற பொருளைத் தருகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளின் கோபத்தைக் குறிக்கும் மொழியை மென்மையாக்காமல் மொழிபெயர்த்தல்
  choice: நம் கடவுளின் எரியும் கோபம்
  alternative: நம் கடவுளின் கடுங்கோபம்
  rationale: חֲרוֹן אַף என்பதில் உள்ள எரிதல் உருவகத்தையும் உடன்படிக்கை மீறலுக்கான தெய்வீகக் கோபத்தின் தீவிரத்தையும் உரை வெளிப்படையாகக் கூறுகிறது; பிற்காலக் கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் அதைத் தக்கவைக்கிறது.
- issue: கோபம் விலகுவதற்கான செயப்படுபவர்
  choice: நம்மைவிட்டு விலகும்வரை
  alternative: நம்மைவிட்டு திருப்பப்படும்வரை
  rationale: எபிரெய இலக்கணம் கோபத்தைத் திருப்புதல் என்ற காரணவினை எண்ணத்தை கொண்டிருந்தாலும், செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. தமிழ் மொழிபெயர்ப்பும் அந்தத் திறந்த நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் பொதுவாசிப்புக்கு ஏற்ற தெளிவும் காக்கப்பட்டுள்ளன. ‘சபை’, ‘மூப்பர்கள்’, ‘நீதிபதிகள்’ ஆகியவை வரலாற்று-நிர்வாகச் சூழலைக் காட்டுகின்றன. வேண்டுகோள் மற்றும் முன்மொழிவு நயம் ‘-ட்டும்’ வினைமுற்றுகளால் தொடர்ச்சியாக வெளிப்படுத்தப்பட்டுள்ளது.
