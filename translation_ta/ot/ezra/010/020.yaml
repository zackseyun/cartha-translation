translation:
  language: ta
  text: 'இம்மேரின் மகன்களில்: ஹனானியும் செபதியாவும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: மகன்களில்
  rationale: מִן உடன் வரும் בְּנֵי, பட்டியலில் அந்தக் குடும்பத்தைச் சேர்ந்தவர்களை அறிமுகப்படுத்துகிறது. தமிழில் ‘மகன்களில்’ என்பது பட்டியல் அமைப்பையும் வம்சத் தொடர்பையும் இயல்பாகப் பாதுகாக்கிறது; வசனத் தொடக்கத்தில் உள்ள וּ தொடர்ச்சிக் கட்டமைப்பாக இருப்பதால் தனியாக ‘மேலும்’ என மொழிபெயர்க்கத் தேவையில்லை.
- source_word: אִמֵּר
  choice: இம்மேர்
  rationale: ஆசாரியக் குடும்பத்தின் எபிரெயப் பெயர்; தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: חֲנָנִי
  choice: அனானி
  rationale: எபிரெயத் தனிப்பெயர் חֲנָנִי, அதன் உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/זְבַדְיָה
  choice: செபதியாவும்
  rationale: זְבַדְיָה என்ற தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, முன்னொட்டு וּ பெயர்ப்பட்டியலின் இரண்டாம் நபரை இணைக்கும் ‘-உம்’ விகுதியால் வெளிப்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பெயர்ப்பட்டியல் நடையைப் பேணி, நவீனத் தரமான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய உச்சரிப்பை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன.
