translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலைத் தொடர்வதால் தொடக்க வாவைச் செயற்கையாக ‘மேலும்’ என்று சேர்க்காமல், இயல்பான தொடர்ச்சியாக வைத்திருக்கிறது. பெயர்கள் மூல எபிரெய ஒலியமைப்பிலிருந்து தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
