lexical_decisions:
- source_word: וּ/מִ/בְּנֵי זַתּוּא
  choice: சத்தூவின் மக்களில்
  rationale: தொடரும் பட்டியலில் இடம்பெறும் ‘மற்றும்/மேலும்’ என்ற வாவ் இணைப்பைத் தமிழில் தனியே கூறாமல் இயல்பான பட்டியல் தொடர்ச்சியால் உணர்த்துகிறது. מִן + בְּנֵי என்பதைக் ‘மக்களில்’ என நேரடியாகவும் சுருக்கமாகவும் வழங்குகிறது; இங்கு ‘மக்கள்’ என்பது சந்ததியினர் அல்லது குலத்தாரையும் குறிக்கக்கூடிய எபிரெய மரபுப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: זַתּוּא
  choice: சத்தூ
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֶלְיוֹעֵנַי
  choice: எலியோயேனாய்
  rationale: எபிரெயப் பெயரின் மெய்-உயிர் அமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֶלְיָשִׁיב
  choice: எலியாசிப்
  rationale: எபிரெய שׁ ஒலியை ‘ச’ என்றும் இறுதி ב ஒலியை ‘ப்’ என்றும் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: מַתַּנְיָה
  choice: மத்தனியா
  rationale: இரட்டித்த ת ஒலியையும் இறுதி யா கூறையும் தக்கவைக்கும் தமிழாக்கம்.
- source_word: וִֽ/ירֵמוֹת
  choice: எரேமோத்
  rationale: முன்னொட்டு வாவ் பட்டியல் அமைப்பில் தனியாக மொழிபெயர்க்கப்படவில்லை; பெயரின் WLC உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: וְ/זָבָד
  choice: சாபாத்
  rationale: பெயரை எபிரெய ஒலிக்கு ஏற்ப எழுத்துப்பெயர்க்கிறது; வாவ் தமிழ்ப் பட்டியல் நடையில் உட்கொள்ளப்படுகிறது.
- source_word: וַ/עֲזִיזָא
  choice: அசிசா
  rationale: எபிரெயப் பெயரின் தொடக்க அயின் தமிழில் உயிரொலியாகவும் ז ஒலி ‘ச’ ஆகவும் பிரதிபலிக்கப்படுகிறது; இறுதி வாவ் ‘ஆகியோர்’ என்னும் இயல்பான பட்டியல் முடிவில் வெளிப்படுகிறது.
