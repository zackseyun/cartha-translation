translation_notes:
  register: சுருக்கமான பெயர்ப்பட்டியலின் அமைப்பு காக்கப்பட்டுள்ளது. ‘ஆகியோர்’ என்பதால் தமிழில் வாக்கியம் இயல்பாக நிறைவடைகிறது; மொழிநடை நவீனமானதும் மரியாதைக்குரியதும் ஆகும்.
