base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: ta
  text: 'ஹாஷூமின் மகன்களில்: மத்தெனாய், மத்தத்தா, சாபாத், எலிபெலேத், யெரேமாய், மனாசே, சிமெயி ஆகியோர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי חָשֻׁם
  choice: ஹாசூமின் மகன்களில்
  rationale: מִן உடன் வரும் בְּנֵי இங்கு ஒரு குடும்பக் குழுவைச் சேர்ந்தவர்களைப் பட்டியலிடுகிறது. ‘மகன்களில்’ என்பது அந்தப் பகுதியியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַתְּנַי
  choice: மத்தெனாய்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: מַתַּתָּה
  choice: மத்தத்தா
  rationale: எபிரெய மூலத்திலுள்ள மெய்யொலி இரட்டிப்பையும் இறுதி உயிரொலியையும் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: זָבָד
  choice: சாபாத்
  rationale: எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֱלִיפֶלֶט
  choice: எலிபெலேத்
  rationale: பெயரை மொழிபெயர்க்காமல், மூல ஒலியமைப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: יְרֵמַי
  choice: எரேமாய்
  rationale: தொடக்க எபிரெய y ஒலியின் இவ்விடத்திலுள்ள மெல்லிய உச்சரிப்பையும் இறுதி -மாய் ஒலியையும் இயல்பான தமிழில் தருகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெயப் பெயரின் பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவத்துடன் ஒத்த எழுத்துப்பெயர்ப்பு.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: மூலத்திலுள்ள ஷின் மற்றும் இறுதி இரட்டை உயிரொலி வரிசையை வாசிக்க எளிய நவீன தமிழில் பிரதிபலிக்கிறது.
