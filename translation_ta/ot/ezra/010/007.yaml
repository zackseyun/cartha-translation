translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய நிர்வாக அறிவிப்பின் வலிமை காக்கப்பட்டுள்ளது; בני הַגּוֹלָה என்ற மரபுத்தொடரின் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
