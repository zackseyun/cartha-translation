language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעֲבִ֨ירוּ ק֜וֹל בִּ/יהוּדָ֣ה וִ/ירֽוּשָׁלִַ֗ם לְ/כֹל֙ בְּנֵ֣י הַ/גּוֹלָ֔ה לְ/הִקָּבֵ֖ץ יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: ta
  text: யூதாவிலும் எருசலேமிலும் எங்கும், சிறையிருப்பின் மக்கள் அனைவரும்[a] எருசலேமில் ஒன்றுகூட வேண்டும் என்று அவர்கள் அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘சிறையிருப்பின் மகன்கள்.’ இதை ‘சிறையிருப்பிலிருந்து திரும்பி வந்தவர்கள் அனைவரும்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: அவர்கள் அறிவித்தார்கள்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் קול என்பதுடன் சேர்ந்து ஓர் அறிவிப்பைப் பரவச் செய்தல் என்ற மரபுத்தொடர் பொருளைத் தருகிறது. தமிழில் ‘அறிவித்தார்கள்’ என்பது செயப்பாட்டை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  choice: யூதா மற்றும் எருசலேம் எங்கும்
  rationale: ב முன்னிடைச்சொல் அறிவிப்பு பரப்பப்பட்ட முழுப் பகுதியையும் குறிக்கிறது; ‘எங்கும்’ அதன் பரவலான தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: சிறையிருப்பின் மக்கள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘சிறையிருப்பின் மகன்கள்’ என்றாலும், בני என்பது இங்கு அந்தச் சமூகத்தைச் சேர்ந்தவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘மக்கள்’ பாலின வரம்பைத் தவிர்த்து, சமூகப் பொருளை நவீன தமிழில் தருகிறது; சொற்பொருளும் மாற்றுப் புரிதலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְהִקָּבֵץ
  choice: ஒன்றுகூட வேண்டும் என்று
  rationale: நிஃபால் வினையெச்சம் அறிவிப்பின் உள்ளடக்கமாகிய அழைப்பை அல்லது கட்டளையைத் தெரிவிக்கிறது. ‘வேண்டும் என்று’ நிர்வாக அழைப்பின் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְרוּשָׁלָם
  choice: எருசலேமில்
  rationale: ஒன்றுகூடும் இடத்தை எபிரெயம் நேரடியாகக் குறிப்பிடுகிறது; தமிழில் ‘எருசலேமில் ஒன்றுகூட’ என்பது இயல்பான இடவியல் அமைப்பு.
