  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: ta
  text: 'பானியின் மகன்களில்: மெஷுல்லாம், மல்லூக், அதாயா, யாஷூப், ஷெஆல், யெரேமோத்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இந்தப் பெயர் உயிர்க்குறிகளின்றி உள்ளது; எனவே இதன் வாசிப்பும் பெயர்வடிவமும் சில மரபுகளில் மாறுபடலாம்.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: பானியின் மகன்களில்
  rationale: இணைப்புச்சொல், ‘இருந்து/இல்’ என்ற முன்னொட்டு, ‘மகன்கள்’ என்ற பன்மை வடிவம் ஆகியவற்றைத் தமிழ்ப் பட்டியல் நடைக்கு இயல்பாக ஒருங்கிணைக்கிறது; குலத்திலுள்ள ஒரு பகுதியை அறிமுகப்படுத்தும் பொருளையும் காக்கிறது.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: מַלּוּךְ
  choice: மல்லூக்
  rationale: எபிரெய மெய்யெழுத்துகளையும் நீண்ட உயிரொலியையும் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: וַ/עֲדָיָה
  choice: அதாயா
  rationale: இணைப்புச்சொல் தமிழ்ப் பட்டியலின் காற்புள்ளிகளால் வெளிப்படுகிறது; தனிப்பெயர் எபிரெய ஒலிக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: יָשׁוּב
  choice: யாசூப்
  rationale: மசோரா உயிர்க்குறிப்புகளின்படி தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகத் தருகிறது.
- source_word: וּ/שְׁאָל
  choice: சேயால்
  rationale: எபிரெயப் பெயரின் இரு அசைகளையும் தெளிவாகக் காட்டும் தமிழெழுத்துப்பெயர்ப்பு; முன்னுள்ள இணைப்புச்சொல் பட்டியல் அமைப்பில் உட்கொள்ளப்பட்டுள்ளது.
- source_word: ירמות
  choice: எரேமோத்
  rationale: இச்சூழலிலும் பழமையான பட்டியல் மரபிலும் தனிப்பெயராகப் புரிந்துகொள்ளப்படும் வழக்கமான வாசிப்பைத் தருகிறது; உயிர்க்குறியில்லாத வடிவத்தால் எழக்கூடிய பெயர்வடிவ வேறுபாடு அடிக்குறிப்பில் சுட்டப்படுகிறது.
