translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘கடவுளின் இல்லம்,’ ‘இந்தக் காரியம்’ போன்ற மூல உருவகங்களும் சூழல்சுட்டும் சொற்களும் தக்கவைக்கப்பட்டுள்ளன; இடவியல் மற்றும் மழையின் தீவிரம் பற்றிய தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
