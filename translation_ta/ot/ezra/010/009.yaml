  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: ta
  text: ஆகவே, யூதா மற்றும் பென்யமீனைச் சேர்ந்த ஆண்கள் அனைவரும் மூன்று நாட்களுக்குள்[a] எருசலேமில் கூடினார்கள்[b]. அன்று ஒன்பதாம் மாதத்தின் இருபதாம் நாள். மக்கள் அனைவரும் கடவுளின் இல்லத்தின் திறந்தவெளிச் சதுக்கத்தில்[c] உட்கார்ந்திருந்தார்கள்; இந்தக் காரியத்தினாலும் மழையினாலும்[d] நடுங்கிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முன்பு அறிவிக்கப்பட்ட மூன்று நாள் காலக்கெடு முடிவதற்குள்.
    reason: temporal_clarification
  - marker: b
    text: எபிரெயத்தில் இங்கு பயன்படுத்தப்பட்ட சொல் இலக்கண ரீதியாக ‘ஆண்கள்’ என்று பொருள்படும்; அழைக்கப்பட்ட ஆண் குடும்பத் தலைவர்கள் அல்லது பிரதிநிதிகள் குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_clarification
  - marker: c
    text: அல்லது, ‘கடவுளின் இல்லத்துக்கு முன்பிருந்த சதுக்கத்தில்.’ எபிரெயச் சொல் அகன்ற திறந்த இடத்தைக் குறிக்கிறது; அது கட்டாயமாக ஆலயத்தின் உள் முற்றத்தைக் குறிக்காது.
    reason: spatial_ambiguity
  - marker: d
    text: எபிரெயத்தில் ‘மழைகள்’ என்று பன்மையில் உள்ளது; இது பருவமழையையோ தொடர்ச்சியான மழையையோ குறிக்கலாம்.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: கூடினார்கள்
  rationale: קבץ என்பதன் நிஃபால் வடிவம் ஒன்றாகக் கூடுதல் அல்லது திரண்டு வருதலைக் குறிக்கிறது; நவீனத் தமிழில் ‘கூடினார்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: யூதா மற்றும் பென்யமீனைச் சேர்ந்த ஆண்கள் அனைவரும்
  rationale: אַנְשֵׁי என்பது இலக்கண ரீதியாக ‘ஆண்கள்’ என்று பொருள்படும். ‘மக்கள்’ எனப் பொதுமைப்படுத்தாமல் மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: மூன்று நாட்களுக்குள்
  rationale: முன்பு அறிவிக்கப்பட்ட மூன்று நாள் காலக்கெடுவுக்குள் அவர்கள் வந்ததை இச்சொற்றொடர் சுட்டுகிறது.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: அன்று ஒன்பதாம் மாதத்தின் இருபதாம் நாள்
  rationale: எபிரெய தேதிக் குறிப்பைச் சுருக்கமின்றி இயல்பான நவீனத் தமிழ் நடைமுறையில் வழங்குகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: உட்கார்ந்திருந்தார்கள்
  rationale: ישׁב இங்கு உட்கார்ந்திருத்தலைக் குறிக்கிறது; தொடர்ந்திருந்த நிலையைத் தமிழ் வினைவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தின் திறந்தவெளிச் சதுக்கத்தில்
  rationale: רְחוֹב ஒரு அகன்ற திறந்த இடம் அல்லது சதுக்கத்தைக் குறிக்கிறது; அதை உள் முற்றம் என்று கட்டடவியல் ரீதியாக மிகுதியாகக் குறிப்பதை இத்தேர்வு தவிர்க்கிறது. בֵּית הָאֱלֹהִים என்பதற்கு ‘கடவுளின் இல்லம்’ என்ற உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: מַרְעִידִים
  choice: நடுங்கிக்கொண்டிருந்தார்கள்
  rationale: רעד உடல் நடுக்கத்தைக் குறிக்கிறது; அடுத்து கூறப்படும் இரு காரணங்களுடனும் இச்சொல் இயல்பாகப் பொருந்துகிறது.
- source_word: עַל הַדָּבָר
  choice: இந்தக் காரியத்தினாலும்
  rationale: הַדָּבָר சூழலில் விவாதிக்கப்பட்ட திருமண நெருக்கடியைக் குறிக்கிறது; ‘இந்தக் காரியம்’ அதன் சூழல்சுட்டும் தன்மையையும் தீவிரத்தையும் தக்கவைக்கிறது.
- source_word: וּמֵהַגְּשָׁמִים
  choice: மழையினாலும்
  rationale: מִן காரணத்தைக் குறிக்கிறது; גְּשָׁמִים பன்மையில் இருந்தாலும் தமிழில் கூட்டுப்பொருளாக ‘மழை’ என்பது இயல்பானது. மூலத்தில் வெளிப்படையாக இல்லாத ‘கடும்’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
