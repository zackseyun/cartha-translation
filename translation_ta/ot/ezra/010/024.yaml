translation_notes:
  register: சுருக்கமான பட்டியல் நடையை அப்படியே பேணி, நவீன நிலையான தமிழில் கண்ணியமாகவும் எளிதில் புரியுமாறும் வழங்கப்பட்டுள்ளது. மூலத்தில் வினைச்சொல் இல்லாததால் தமிழிலும் ஒன்றைச் சேர்க்கவில்லை; பிரிவுகளையும் பெயர்களையும் வேறுபடுத்த முக்காற்புள்ளி மற்றும் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளன.
