  yaml_path: translation/ot/ezra/010/024.yaml
  text: 'And from the singers: Eliashib; and from the gatekeepers: Shallum, Telem, and Uri.'
translation:
  language: ta
  text: 'பாடகர்களில்: எலியாசிப்; வாயிற்காவலர்களில்: சல்லூம், தெலெம், ஊரி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: -இல்
  rationale: இணைப்பிடைச்சொல்லுடன் கூடிய முன்னிடைச்சொல் பெரிய பட்டியலுக்குள் மேலும் இரு பிரிவுகளை அறிமுகப்படுத்துகிறது. தமிழில் பட்டியல் தொடர்ச்சியும் ‘அவர்களில்’ என்ற பகுதியுணர்வும் இயல்பாக வெளிப்பட ‘-இல்’ பயன்படுத்தப்பட்டது; அரைப்புள்ளி அமைப்பு எபிரெயின் சேர்க்கைத் தொடரைத் தக்கவைக்கிறது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר வேரிலிருந்து வந்த இப்பெயரெச்ச வடிவம் ஆலய வழிபாட்டில் பாடும் பணியாளர்களைக் குறிக்கிறது; ‘பாடகர்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: אֶלְיָשִׁיב
  choice: எலியாசிப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலய நிர்வாகச் சூழலில் வாயில்களைக் காக்க நியமிக்கப்பட்டவர்களை இச்சொல் குறிக்கிறது; ‘வாயிற்காவலர்கள்’ அவர்களின் பணியைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: שַׁלֻּם
  choice: சல்லூம்
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலி இரட்டிப்பையும் நீண்ட உயிரையும் இயன்றவரைத் தக்கவைக்கும் பெயர்த்தெழுத்து.
- source_word: טֶלֶם
  choice: தேலெம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் பெயர்த்தெழுதுகிறது.
- source_word: אוּרִי
  choice: ஊரி
  rationale: எபிரெய தனிப்பெயரின் தொடக்க நீண்ட உயிரொலியைத் தக்கவைக்கும் பெயர்த்தெழுத்து.
