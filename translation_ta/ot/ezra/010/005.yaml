base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: ta
  text: அப்போது எஸ்றா எழுந்து, ஆசாரியர்களின் தலைவர்களையும் லேவியர்களையும் இஸ்ரவேலர் அனைவரையும் இந்தக் காரியத்தின்படி[a] செய்வதாகச் சத்தியம் செய்யவைத்தார்; அவர்களும் சத்தியம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த வார்த்தையின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் பேசப்பட்ட வார்த்தையையோ, இங்கு விவாதிக்கப்படும் காரியத்தையோ அல்லது முன்மொழிவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்நிகழ்வு வடிவம் எஸ்றா நடவடிக்கை எடுக்கத் தீர்மானமாக எழுந்ததை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: וַיַּשְׁבַּע
  choice: ஆணையிட்டுச் சத்தியம் செய்யவைத்தார்
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவத்திலுள்ள பிறவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது; வெறும் அறிவுறுத்தல் அல்ல, ஆணையின்கீழ் சத்தியம் செய்ய வைத்த செயல் இது.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் தலைவர்கள்
  rationale: שָׂרֵי என்பதன் தலைவர் அல்லது முதன்மையானவர் என்ற பொருளையும், הַכֹּהֲנִים உடனான உருபுத்தொடரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தையும் ஆலயப் பணிக்குழுவையும் குறிக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: கூட்டாகிய இஸ்ரவேலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வினையின் செயப்படுபொருள் நிலையும் தெளிவாகிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்யுமாறு
  rationale: עשה என்பதன் பரந்த ‘செய்’ பொருளையும், சத்தியத்தின் நோக்கத்தைக் குறிக்கும் ל முன்னொட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தின்படி
  rationale: דָּבָר இச்சூழலில் முன்வைக்கப்பட்ட விவகாரம் அல்லது திட்டத்தைக் குறிக்கிறது. ‘காரியம்’ சூழலுக்கு இயல்பானது; ‘வார்த்தை’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וַיִּשָּׁבֵעוּ
  choice: அவர்களும் சத்தியம் செய்தார்கள்
  rationale: שׁבע என்பதன் நிஃபால் வடிவத்தின் நேரடியான விளைவைச் சொல்லி, எபிரேய மூலத்திலுள்ள சத்தியம் குறித்த மறுபடியுரைத்தலைப் பாதுகாக்கிறது.
