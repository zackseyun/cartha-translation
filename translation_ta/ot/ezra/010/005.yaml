translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்களின் தலைவர்கள்’ என்பது பதவிநிலையைத் தெளிவாகக் காட்டுகிறது; ‘ஆணையிட்டுச் சத்தியம் செய்யவைத்தார்’ என்பது மூலத்தின் பிறவினை வலிமையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு முழு ‘இந்தக் காரியத்தின்படி’ தொடருடன் தொடர்புடையதால் வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
