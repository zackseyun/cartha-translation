  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: ta
  text: அந்நியப் பெண்களை மனைவிகளாக ஏற்றுக்கொண்டிருந்த ஆண்கள் அனைவரையும் குறித்த விசாரணையை, முதலாம் மாதத்தின் முதல் நாளுக்குள்[a] அவர்கள் முடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலாம் மாதத்தின் முதல் நாள் வரை.” எபிரெயக் காலக் குறிப்பு நிறைவு அடைந்த கால எல்லையைச் சுட்டுவதால் இருவிதமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: அவர்கள் முடித்தார்கள்
  rationale: כלה என்னும் வினை இங்கு முந்தைய வசனங்களில் கூறப்பட்ட விசாரணைச் செயல்முறை நிறைவடைந்ததைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בַכֹּל אֲנָשִׁים
  choice: ஆண்கள் அனைவரையும் குறித்த
  rationale: בַכֹּל என்பது விசாரணைக்கு உட்பட்டவர்களின் முழுத் தொகையையும் குறிக்கிறது; אֲנָשִׁים ஆண்பால் பன்மை. தமிழில் ‘அனைத்து ஆண்களையும் குறித்த’ என்பது நடைமுறைச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַהֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மனைவிகளாக ஏற்றுக்கொண்டிருந்த
  rationale: הֹשִׁיבוּ என்பதன் நேரடிப் பொருள் ‘குடியிருக்கச் செய்தனர்’; இச்சூழலில் பெண்களைத் தங்கள் குடும்பத்தில் மனைவிகளாக ஏற்றுக்கொண்டதைக் குறிக்கிறது. ‘திருமணம் செய்திருந்த’ என்பது சாத்தியமானாலும் எபிரெயச் சொல்லைவிட சட்டரீதியாகக் கூடுதல் துல்லியத்தைத் திணிக்கலாம்; ஆகவே மூல மொழியின் உருவகத்தையும் சூழலின் மண உறவையும் காக்க இத்தேர்வு செய்யப்பட்டது.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்கள்
  rationale: נָכְרִיּוֹת என்பது வேறு இன அல்லது சமூகத்தைச் சேர்ந்த பெண்களைக் குறிக்கிறது. ‘அந்நியப் பெண்கள்’ என்பது நவீனத் தமிழில் இயல்பானதும், மூலத்தின் சமூக அடையாளக் குறிப்பை தேவையின்றி விரிவுபடுத்தாததும் ஆகும்.
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்தின் முதல் நாளுக்குள்
  rationale: עַד கால எல்லையைச் சுட்டுகிறது. நிறைவுற்ற செயலைத் தமிழில் இயல்பாகக் காட்ட ‘நாளுக்குள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; ‘நாள் வரை’ என்பதும் எபிரெயின் சாத்தியமான மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
