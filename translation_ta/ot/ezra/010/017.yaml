translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை பயன்படுத்தப்பட்டது. விசாரணை என்பது முந்தைய சூழலிலிருந்து வெளிப்படும் செயல் என்பதால், ‘அவர்களுடன் முடித்தார்கள்’ என்ற தமிழில் இயல்பற்ற நேரடி வடிவத்திற்குப் பதிலாக வெளிப்படையாகச் சேர்க்கப்பட்டது. மூலத்தில் உள்ள மண உறவின் மறைமுகச் சொல்லாட்சி மிகைப்படுத்தப்படாமல் காக்கப்பட்டது.
