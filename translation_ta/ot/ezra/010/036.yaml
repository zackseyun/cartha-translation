lexical_decisions:
- source_word: וַנְיָה
  choice: வனியா
  rationale: இது ஓர் ஆளின் பெயர். எபிரேய ஒலிப்பை நவீனத் தமிழில் இயல்பாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מְרֵמוֹת
  choice: மெரேமோத்
  rationale: இது ஓர் ஆளின் பெயர். எபிரேய மெய்யெழுத்துகளையும் உயிரொலிகளையும் முடிந்தவரை தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֶלְיָשִׁיב
  choice: எலியாசீப்
  rationale: இது ஓர் ஆளின் பெயர். எபிரேய உச்சரிப்பை அடிப்படையாகக் கொண்டு, தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
