  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: ta
  text: ஆகவே இப்போது, உங்கள் தந்தையரின் கடவுளாகிய யாவேக்கு நன்றி செலுத்துங்கள்[a]; அவருடைய விருப்பத்தைச் செய்யுங்கள். நாட்டின் மக்களிடமிருந்தும் அந்நியப் பெண்களிடமிருந்தும்[b] உங்களைப் பிரித்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு அறிக்கை செய்யுங்கள்.” இங்குள்ள எபிரெயச் சொற்றொடர் சூழலுக்கேற்ப நன்றி செலுத்துதல் அல்லது அறிக்கையிடுதல் என்ற பொருளைக் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அந்நிய மனைவிகளிடமிருந்தும்.” பரந்த சூழல் திருமணங்களைப் பற்றியது; ஆனால் இங்கு எபிரெயம் நேரடியாக “அந்நியப் பெண்கள்” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: புகழ்ந்து அறிக்கையிடுங்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் நன்றி அல்லது புகழ் செலுத்துவதையும் அறிக்கையிடுவதையும் குறிக்கக்கூடும். சூழலில் தவற்றை ஒப்புக்கொண்டு கீழ்ப்படிதல் இடம்பெறுவதால், இரு நுணுக்கங்களையும் இயல்பான தமிழில் திறந்தவையாக வைத்திருக்க இந்த இணைந்த சொல்லாக்கம் பயன்படுத்தப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவை
  rationale: יהוה என்ற இறைப்பெயரைப் பொதுவாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குவது, மூலத்தில் உள்ள தனிப்பட்ட பெயரைப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: ‘தந்தையர்’ என்பது மூலத்தின் ஆண்பால் பன்மையையும் உடன்படிக்கை சார்ந்த மூதாதையர் மொழியையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: அவருடைய விருப்பத்தின்படி செய்யுங்கள்
  rationale: רצון என்பது விருப்பம், சித்தம், பிரியம் ஆகிய பொருள்களைத் தருகிறது. இந்தத் தமிழ் சொல்லாக்கம் கட்டளையின் செயற்பாட்டு வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: וְהִבָּדְלוּ
  choice: உங்களைப் பிரித்துக்கொள்ளுங்கள்
  rationale: நிஃபால் கட்டளை வடிவத்தின் தற்சுட்டு அல்லது பிரதிபலிப்பு வலிமையைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: இந்நாட்டின் மக்களிடமிருந்து
  rationale: עמי என்பது பன்மை; ‘மக்கள்’ என்ற தமிழ் வடிவம் பல இனக்குழுக்களைக் குறிக்கக்கூடியதாக உள்ளது. குறிப்பிட்ட சூழலில் הָאָרֶץ என்பதற்கு ‘இந்நாடு’ இயல்பானது.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: அந்நியப் பெண்களிடமிருந்து
  rationale: இந்த வசனத்தின் எபிரெயம் நேரடியாக ‘அந்நியப் பெண்கள்’ என்கிறது; சூழல் மனைவிகளைப் பற்றியது என்றாலும் அதை முதன்மை உரையில் சேர்த்து விளக்கவில்லை.
theological_decisions:
- issue: תודה என்பது புகழா, நன்றியா, அல்லது பாவ அறிக்கையா?
  choice: புகழ்ந்து அறிக்கையிடுங்கள்
  alternative: நன்றி செலுத்துங்கள்; அல்லது, அறிக்கையிடுங்கள்
  rationale: சொற்றொடரின் பரந்த பொருளையும், பாவத்தை ஒப்புக்கொண்டு கீழ்ப்படிய அழைக்கும் உடனடிச் சூழலையும் ஒரே ஒரு பொருளுக்குள் சுருக்காமல் வைத்திருக்கிறது. சாத்தியமான மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
- issue: הַנָּשִׁים הַנָּכְרִיּוֹת என்பது பெண்களா அல்லது மனைவிகளா?
  choice: அந்நியப் பெண்கள்
  alternative: அந்நிய மனைவிகள்
  rationale: மூல வசனம் ‘பெண்கள்’ என்றே கூறுகிறது; திருமண உறவு பரந்த சூழலில் தெளிவாக இருந்தாலும், அதை உரைக்குள் மறைமுகமாகச் சேர்க்காமல் அடிக்குறிப்பில் குறிப்பிடுவது மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. ‘சித்தம்’ என்பதற்குப் பதிலாக இயல்பான ‘விருப்பத்தின்படி’ பயன்படுத்தப்பட்டது. இறைப்பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது; மூலத்தின் சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
