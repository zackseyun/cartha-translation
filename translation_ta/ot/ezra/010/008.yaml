source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: ta
  text: அதிகாரிகளும் மூப்பர்களும் எடுத்த முடிவின்படி, மூன்று நாட்களுக்குள் வராத ஒவ்வொருவருடைய உடைமைகள் அனைத்தும் பறிமுதல் செய்யப்படும்[a]; அவரும் நாடுகடத்தப்பட்டவர்களின் சபையிலிருந்து பிரித்து வைக்கப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தடைக்கு உட்படுத்தப்படும்” அல்லது “அழிவுக்கென ஒப்புக்கொடுக்கப்படும்.” எபிரெய வினைச்சொல் חרם என்பது ஒன்றை மீளப்பெற முடியாத தடைக்குள் வைப்பதைக் குறிக்கிறது; சூழலைப் பொறுத்து அது அழித்தல் அல்லது பறிமுதல் செய்தல் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: வராத ஒவ்வொருவருடைய
  rationale: பொதுவான நிபந்தனையையும் ஒவ்வொருவருக்கும் தனித்தனியாகப் பொருந்தும் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: மூன்று நாட்களுக்குள்
  rationale: அழைப்புக்கு இணங்க வேண்டிய காலக்கெடுவைத் தெளிவாகக் காட்டுகிறது.
- source_word: כַּעֲצַת
  choice: எடுத்த முடிவின்படி
  rationale: עֵצָה என்பதற்கு ஆலோசனை அல்லது தீர்மானம் என்ற பொருள் உண்டு; இங்கு தலைவர்களின் அதிகாரப்பூர்வ முடிவு சூழலுக்குப் பொருத்தமானது.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: அதிகாரிகளும் மூப்பர்களும்
  rationale: சிறைப்பட்டிருப்புக்குப் பிந்தைய நிர்வாகச் சூழலில் שׂרים என்பதற்கு ‘அதிகாரிகள்’ இயல்பானது; זקנים என்பதற்கு ‘மூப்பர்கள்’ நேரான இணை.
- source_word: יָחֳרַם
  choice: தடைப்பொருளாக்கப்படும்
  rationale: חרם என்ற தொழில்நுட்பச் சொல்லின் ‘தடைக்குள் ஒதுக்குதல்/மீளப்பெற முடியாதபடி அர்ப்பணித்தல்’ என்ற வலிமையைப் பேணுகிறது; சூழலில் பறிமுதல் என்பது நடைமுறை விளைவாக இருக்கலாம்.
- source_word: כָּל רְכוּשׁוֹ
  choice: உடைமைகள் அனைத்தும்
  rationale: רכוש குறிக்கும் சொத்துகள் அல்லது உடைமைகளை சட்டரீதியான சூழலில் தெளிவாகக் கூறுகிறது.
- source_word: וְהוּא יִבָּדֵל
  choice: அவரும் ... பிரித்து வைக்கப்படுவார்
  rationale: வெளிப்படையான சுட்டுப்பெயரின் வலியுறுத்தலையும் בדל என்பதன் பிரித்தல் என்ற அடிப்படைப் பொருளையும் பேணுகிறது.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டவர்களின் சபையிலிருந்து
  rationale: קהל என்பதற்கு ‘சபை’ என்றும் הגולה என்பதற்கு நாடுகடத்தப்பட்ட சமூகத்தினர் என்றும் நேராக மொழிபெயர்க்கிறது; பின்னாளைய திருச்சபைச் சிறப்புப் பொருளைத் திணிக்கவில்லை.
theological_decisions:
- issue: உடைமைகள்மேல் விதிக்கப்படும் חרם தண்டனையின் பொருள்
  choice: முதன்மை உரையில் ‘தடைப்பொருளாக்கப்படும்’ என்று வழங்கி, பறிமுதல் மற்றும் அழிவுக்கென அர்ப்பணித்தல் ஆகிய பொருள் நுட்பங்களை அடிக்குறிப்பில் தருதல்.
  alternative: ‘பறிமுதல் செய்யப்படும்’ அல்லது ‘அழிவுக்கென அர்ப்பணிக்கப்படும்.’
  rationale: சூழலில் நடைமுறை விளைவு பறிமுதலாக இருக்கக்கூடும்; எனினும் חרם என்பது சாதாரண பறிமுதலைவிட வலிமையான, தடைக்கு உட்படுத்தும் தொழில்நுட்பச் சொல். பிரதான உரை அந்தத் தெளிவின்மையையும் இறையியல் நிறையையும் பாதுகாக்கிறது.
- issue: சமூகத்திலிருந்து பிரித்தலின் இயல்பு
  choice: ‘பிரித்து வைக்கப்படுவார்’
  alternative: ‘விலக்கப்படுவார்’ அல்லது ‘சபைநீக்கம் செய்யப்படுவார்.’
  rationale: வசனம் நாடுகடத்தப்பட்டவர்களின் சபையிலிருந்து பிரித்தலை மட்டுமே கூறுகிறது. பின்னாளைய சமய நிறுவனப் பிரிவான ‘சபைநீக்கம்’ என்பதைத் திணிக்காமல் மூலச்சொல்லின் பொருளைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டரீதியான அறிவிப்புக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘தடைப்பொருளாக்கப்படும்’ என்பது வழக்கமான சொல் அல்ல என்றாலும், חרם என்ற தொழில்நுட்பச் சொல்லின் தனித்துவத்தையும் பொருள் இழுபறியையும் பாதுகாக்க வேண்டி பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு இயல்பான மாற்றுப் பொருள்களை விளக்குகிறது.
