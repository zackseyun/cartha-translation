  text: מִ/בְּנֵ֣י בָנִ֔י מַעֲדַ֥י עַמְרָ֖ם וְ/אוּאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/034.yaml
  text: 'From the sons of Bani: Maadai, Amram, and Uel.'
translation:
  language: ta
  text: 'பானியின் மகன்களில்: மாதாய், அம்ராம், ஊவேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: மகன்களில்
  rationale: מִן முன்னொட்டுடன் வரும் בְּנֵי, பெரிய குடும்பப் பட்டியலுக்குள் ஒரு உட்பிரிவை அறிமுகப்படுத்துகிறது. தமிழில் ‘மகன்களில்’ என்பது அதன் பகுதியைக் குறிக்கும் பொருளை இயல்பாகத் தருகிறது.
- source_word: בָנִי
  choice: பானி
  rationale: எபிரெய தனிப்பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מַעֲדַי
  choice: மாதாய்
  rationale: எபிரெய தனிப்பெயர்; மெய்யெழுத்து அமைப்பையும் உச்சரிப்பையும் அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַמְרָם
  choice: அம்ராம்
  rationale: எபிரெய தனிப்பெயர்; தமிழில் அறியத்தக்க நேரடியான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וְ/אוּאֵל
  choice: ஊவேல்
  rationale: וְ இணைப்புச்சொல் பட்டியலின் இறுதி உறுப்பை இணைக்கிறது; தமிழ்ப் பட்டியல் நிறுத்தக்குறி நடை காரணமாக தனியே ‘மற்றும்’ சேர்க்காமல் இயல்பாக விடப்பட்டது. אוּאֵל என்பது ‘ஊவேல்’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்ச/குடும்பப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. மூலத்தின் பகுதியைக் குறிக்கும் அமைப்பு ‘மகன்களில்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
