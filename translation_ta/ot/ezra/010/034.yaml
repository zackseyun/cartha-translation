  source_fidelity: 'மூல எபிரெயப் பட்டியல் அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்பட்டுள்ளது: מִבְּנֵי பானியின் குடும்பத்துக்குள் உள்ள ஒரு உட்பிரிவைக் குறிக்கும் வகையில் ‘பானியின் மகன்களில்’ எனவும், மூன்று பெயர்களும் சரியான வரிசையிலும் தரப்பட்டுள்ளன. இறுதி וְ இணைப்பைத் தமிழ்ப் பட்டியல் நடையில் காற்புள்ளியால் இணைத்திருப்பது ஏற்றது.'
  naturalness: '‘பானியின் மகன்களில்: மாதாய், அம்ராம், ஊவேல்.’ என்பது நவீன நிலையான தமிழில் வம்சப் பட்டியலுக்குச் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.'
  terminology: தனிப்பெயர்கள் ஒலிபெயர்ப்பாகவே கையாளப்பட்டுள்ளன. ‘ஊவேல்’ என்பது Uel என்ற பெயருக்கான நிலையான தமிழாக்கத் தோற்றமாக ஏற்றுக்கொள்ளத்தக்கது; இவ்வசனத்தில் எந்தத் தெய்வவியல் சொல் சிக்கலும் இல்லை.
