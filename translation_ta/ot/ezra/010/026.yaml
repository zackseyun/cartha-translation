translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் வடிவம் பெருங்குடல் குறியால் தெளிவாக்கப்பட்டுள்ளது; பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழ் ஒலியமைப்புக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
