  terminology: “ஏலாம்,” “மத்தனியா,” “சகரியா,” “யெகியேல்,” “அப்தி,” and “எலியா” are appropriate established or source-near Tamil name forms. “யெரேமோத்” more accurately represents ירמות than “எரேமோத்.”
