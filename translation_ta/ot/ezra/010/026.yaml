source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י עֵילָ֑ם מַתַּנְיָ֤ה זְכַרְיָה֙ וִ/יחִיאֵ֣ל וְ/עַבְדִּ֔י וִ/ירֵמ֖וֹת וְ/אֵלִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: ta
  text: 'மேலும், ஏலாமின் மகன்களில்: மத்தனியா, சகரியா, யெகியேல், அப்தி, யெரேமோத், எலியா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: மகன்களில்
  rationale: இது וּ (‘மேலும்/மற்றும்’) + מִן (‘இருந்து/இல்’) + בְּנֵי (‘மகன்கள்’) என்ற தொடராகும். வம்ச அல்லது குடும்பப் பட்டியல் சூழலில் ‘மகன்களில்’ என்பது எபிரெய மரபுத்தொடரின் வடிவத்தையும் இயல்பான தமிழையும் காக்கிறது; இங்குள்ள தொடக்க இணைப்பு முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் அமைப்பால் உணரப்படுகிறது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இச்சூழலில் குடும்ப அல்லது குல முன்னோரின் இயற்பெயர்; ஆகவே பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: מַתַּנְיָה
  choice: மத்தனியா
  rationale: எபிரெய இயற்பெயரின் தமிழுக்கு ஏற்ற தெளிவான ஒலிபெயர்ப்பு.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: எபிரெய இயற்பெயரின் பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவம்; மூல ஒலியையும் வாசகர் அறிமுகத்தையும் சமநிலைப்படுத்துகிறது.
- source_word: וִ/יחִיאֵל
  choice: யெகியேல்
  rationale: יחיאל என்ற இயற்பெயரின் எபிரெய ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு; முன் இணைப்புச்சொல் பட்டியல் நிறுத்தக்குறிகளால் இயல்பாக வெளிப்படுகிறது.
- source_word: וְ/עַבְדִּי
  choice: அப்தி
  rationale: இது பட்டியலில் வரும் இயற்பெயர்; ‘என் ஊழியன்’ என்று பொதுப்பெயர்ப் பொருளில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וִ/ירֵמוֹת
  choice: எரேமோத்
  rationale: எபிரெய இயற்பெயரின் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு; பெயரின் இறுதி மெய்யொலியும் காக்கப்படுகிறது.
- source_word: וְ/אֵלִיָּה
  choice: எலியா
  rationale: எபிரெயப் பெயருக்குரிய தமிழில் பரவலாக அறியப்பட்ட வடிவம்; முன் இணைப்புச்சொல் பட்டியல் அமைப்பில் தனியே மொழிபெயர்க்கப்படவில்லை.
