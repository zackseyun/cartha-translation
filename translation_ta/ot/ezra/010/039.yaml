lexical_decisions:
- source_word: שֶׁלֶמְיָה
  choice: செலேமியா
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பட்ட பெயரின் பரவலாக அறியப்பட்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עֲדָיָה
  choice: அதாயா
  rationale: எபிரெய தனிப்பட்ட பெயரை அதன் ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וְ / וַ
  choice: பட்டியலில் காற்புள்ளி
  rationale: எபிரெய வாவ் ஒவ்வொரு பெயரையும் இணைக்கிறது; தமிழில் பெயர்ப்பட்டியலை இயல்பாக வாசிக்க காற்புள்ளிகள் போதுமானவை, மேலும் இறுதிப் பெயருக்கு முன்பும் தனியாக ‘மற்றும்’ சேர்க்க வேண்டியதில்லை.
