  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: ta
  text: இவர்கள் அனைவரும் அந்நியப் பெண்களைத் திருமணம் செய்திருந்தார்கள்; அவர்களில் சிலருக்கு பிள்ளைகளைப் பெற்ற மனைவிகள் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சொல்லாக: “அவர்களிடையே மனைவிகள் இருந்தார்கள்; அவர்கள் மகன்களைப் பெற்றிருந்தார்கள்.” வசனத்தின் இறுதியில் உள்ள எபிரெயத் தொடர் சுருக்கமானதும், அதன் துல்லியமான தொடர்பைப் புரிந்துகொள்வது சற்றுக் கடினமானதும் ஆகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களைத் திருமணம் செய்திருந்தார்கள்
  rationale: נשׂא உடன் ‘பெண்கள்’ வருவது திருமணம் செய்துகொள்வதைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘எடுத்திருந்தார்கள்’ என்பதைவிட இத்தமிழாக்கம் இயல்பாகவும் பொருளில் தெளிவாகவும் உள்ளது.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்கள்
  rationale: இது தங்கள் மக்கள் அல்லது உடன்படிக்கைச் சமூகத்திற்கு வெளியிலிருந்த பெண்களைக் குறிக்கிறது. ‘அந்நியப் பெண்கள்’ என்பது நவீனத் தமிழில் இயல்பானதும் மூலத்தின் வேறுபாட்டைக் காக்கிறதுமான சொல்.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: அவர்களில் சிலருக்கு மனைவிகளும்
  rationale: எபிரெய இருப்பைச் சுட்டும் தொடரை இயல்பான தமிழில் ‘அவர்களில் சிலருக்கு’ என்று கொடுத்து, נָשִׁים என்பதன் உறவுநிலைப் பொருளை ‘மனைவிகள்’ என வெளிப்படுத்துகிறது.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: பிள்ளைகளும் இருந்தார்கள்
  rationale: இறுதித் தொடர் சுருக்கமானதும் பொருள் காண்பதில் கடினமானதும் ஆகும். சொற்சொல்லான ‘மகன்களை வைத்தார்கள்’ தமிழில் தவறான எண்ணத்தைத் தரும்; சூழலில் அந்தத் திருமணங்களால் பிள்ளைகள் இருந்தனர் என்பதே கருத்தாகத் தெரிகிறது.
- source_word: בָּנִים
  choice: பிள்ளைகள்
  rationale: சொல்லின் வடிவப்பொருள் ‘மகன்கள்’ என்றாலும், இச்சூழலில் அது சந்ததி அல்லது பிள்ளைகளைப் பொதுவாகக் குறிக்கக்கூடும். மூலத்தின் சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
