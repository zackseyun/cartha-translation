  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கடினமான இறுதித் தொடரை முதன்மை உரையில் இயல்பாக வழங்கி, அதன் சொற்சொல்லான வடிவமும் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
