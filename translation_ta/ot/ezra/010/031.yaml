base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: ta
  text: 'மேலும், ஹாரீமின் மகன்களில்[a]: எலியேசர், இஷ்ஷியா[b], மல்கியா, செமாயா, ஷிமியோன்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “ஹாரீமின் மகன்கள்: எலியேசர், இஷ்ஷியா, மல்கியா, செமாயா, ஷிமியோன்.” இங்கு “மகன்களில்” என்று பொருள் நிரப்பாமல், இச்சொற்றொடரை ஒரு சாதாரண பட்டியல் தலைப்பாகவும் எடுத்துக்கொள்ளலாம்.'
    reason: lexical_alternative
  - marker: b
    text: இப்பெயரை “யெஷியா” அல்லது “இஷியா” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இப்பெயர் பாரம்பரியமாக “சிமியோன்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மேலும், … மகன்களில்
  rationale: וּ என்ற இணைப்பை “மேலும்” எனக் காத்து, இந்தப் பட்டியலில் ஒரு குலத்தைச் சேர்ந்தவர்களிலிருந்து குறிப்பிட்ட நபர்கள் பெயரிடப்படுவதால் בְנֵי என்பதைக் “மகன்களில்” என வழங்குகிறது. எபிரெயச் சொற்றொடரை எளிய பட்டியல் தலைப்பாகவும் புரிந்துகொள்ள முடியும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חָרִם
  choice: ஹாரீம்
  rationale: குடும்ப/குலப் பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלִיעֶזֶר
  choice: எலியேசர்
  rationale: எபிரெயப் பெயரின் தமிழில் வாசிக்கத்தக்க வழக்கமான ஒலிபெயர்ப்பு.
- source_word: יִשִּׁיָּה
  choice: இஷ்ஷியா
  rationale: மெய்யெழுத்து இரட்டிப்பையும் பெயரின் எபிரெய ஒலியையும் இயன்றவரை தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַלְכִּיָּה
  choice: மல்கியா
  rationale: כּ ஒலியை “க்” என்றும் இறுதி יָה கூறை “யா” என்றும் நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் எளிதில் அறியத்தக்க வடிவம்; எபிரெயப் பெயரின் முக்கிய ஒலிக்கூறுகளையும் காக்கிறது.
- source_word: שִׁמְעוֹן
  choice: ஷிமியோன்
  rationale: தொடக்க שׁ ஒலியை “ஷ்” மூலம் தெளிவாகப் பிரதிபலிக்கிறது; பாரம்பரிய “சிமியோன்” வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
