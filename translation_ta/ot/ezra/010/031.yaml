translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் இணைப்பும் காக்கப்பட்டுள்ளன; சூழலால் நிரப்பப்பட்ட “மகன்களில்” என்பதற்கான உண்மையான இலக்கண மாற்றுவாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் அவை சார்ந்த சொற்றொடர் அல்லது பெயருக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
