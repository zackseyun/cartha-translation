  yaml_path: translation/ot/ezra/010/021.yaml
  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: ta
  text: 'மேலும், ஆரீமின் மகன்களில்: மாசெயா[a], எலியா, செமாயா, யெகியேல், உசியா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்றாக, இன்னும் சொற்சொல்லாக: ‘மேலும், ஆரீமின் மகன்களிலிருந்து.’ எபிரெயத் தொடர், பட்டியலில் இது மற்றொரு குடும்ப உட்பிரிவு என்பதைக் குறிக்கிறது.'
