lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: வழிவந்தவர்களில்
  rationale: וּ என்ற இணைப்பும் מִן என்ற பகுதிப்பொருளும் சேர்ந்த இத்தொடர், பட்டியலில் ஆரீமின் குடும்பத்தைச் சேர்ந்த ஒரு உட்பிரிவை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘வழிவந்தவர்களில்’ என்பது குடும்ப வம்சத்தையும் ‘அவர்களில் சிலர்’ என்ற பகுதிப்பொருளையும் இயல்பாகத் தெரிவிக்கிறது; தொடக்க இணைப்பு பட்டியல் அமைப்பால் உணரப்படுகிறது.
- source_word: חָרִם
  choice: ஆரீம்
  rationale: குடும்ப அல்லது முன்னோர் பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை தெளிவாக ஒலிபெயர்த்துள்ளது.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: எபிரெய தனிப்பெயரின் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: וְ/אֵלִיָּה
  choice: எலியா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவில் தரப்பட்டுள்ளது; பட்டியலின் நிறுத்தற்குறிகள் இணைப்பின் பணியைச் செய்கின்றன.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரின் தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וִ/יחִיאֵל
  choice: யெகியேல்
  rationale: பெயரின் தொடக்க எபிரெய y ஒலியையும் நடுவிலுள்ள தொண்டை ஒலிக்கு நெருக்கமான தமிழ் வடிவையும் பேணும் ஒலிபெயர்ப்பு.
- source_word: וְ/עֻזִיָּה
  choice: உசியா
  rationale: எபிரெய தனிப்பெயருக்கான பரவலாக அறியக்கூடிய தமிழ் வேதாகம ஒலிபெயர்ப்பு.
