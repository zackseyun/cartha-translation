revisions:
- from: நாடுகடத்தப்பட்டோரின் மகன்கள்[a] அவ்வாறே செய்தார்கள். ஆசாரியனாகிய எஸ்றா, தந்தைவழிக் குடும்பங்களின் தலைவர்களான ஆண்களை அவரவர் தந்தைவழிக் குடும்பத்தின்படி பெயர் குறிப்பிட்டுத் தனியே பிரித்தெடுத்தார்[b][c]. அவர்கள் அந்தக் காரியத்தை விசாரிப்பதற்காகப் பத்தாம் மாதத்தின் முதலாம் நாளில் அமர்ந்தார்கள்.
  to: நாடுகடத்தப்பட்டோரின் மகன்கள்[a] அவ்வாறே செய்தனர். ஆசாரியனாகிய எஸ்றாவும், தந்தைவழிக் குடும்பங்களின் தலைவர்களான ஆண்களும்[c], அவரவர் தந்தைவழிக் குடும்பத்தின்படி, அனைவரும் பெயர் பெயராகத் தனியே ஒதுக்கப்பட்டார்கள்[b]. அவர்கள் அந்தக் காரியத்தை விசாரிப்பதற்காகப் பத்தாம் மாதத்தின் முதலாம் நாளில் அமர்ந்தனர்.
  rationale: எபிரெயத்தின் பன்மை நிஃபால் வினையை முன்னுரிமைப்படுத்தி, எஸ்றாவும் குடும்பத் தலைவர்களும் தனியே ஒதுக்கப்பட்டனர் எனத் திருத்தப்பட்டுள்ளது. இது விசாரணைக்கான பிரதிநிதிகள் நியமிக்கப்பட்ட நிர்வாகச் சூழலுக்கு ஏற்றதாகவும், அவர்கள் தாமே பிரிந்துகொண்டார்களா அல்லது பிரிக்கப்பட்டார்களா என்ற இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாப்பதாகவும் உள்ளது. “அவரவர் தந்தைவழிக் குடும்பத்தின்படி” மற்றும் “பெயர் பெயராக” ஆகியவை தேர்ந்தெடுக்கப்பட்ட குடும்பத் தலைவர்களின் அடையாள/ஒழுங்கமைப்பு விவரத்தைத் தக்கவைக்கின்றன.
