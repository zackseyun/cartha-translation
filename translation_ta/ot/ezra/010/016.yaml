  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: ta
  text: நாடுகடத்தப்பட்டோரின் மகன்கள்[a] அவ்வாறே செய்தனர். ஆசாரியனாகிய எஸ்றாவும், தந்தைவழிக் குடும்பங்களின் தலைவர்களான ஆண்களும்[c], அவரவர் தந்தைவழிக் குடும்பத்தின்படி, அனைவரும் பெயர் பெயராகத் தனியே ஒதுக்கப்பட்டார்கள்[b]. அவர்கள் அந்தக் காரியத்தை விசாரிப்பதற்காகப் பத்தாம் மாதத்தின் முதலாம் நாளில் அமர்ந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகடத்தப்பட்டவர்கள்.” எபிரெயத்தில் சொற்சொல்லாக, “நாடுகடத்தப்பட்டோரின் மகன்கள்”; இது நாடுகடத்தலிலிருந்து திரும்பிவந்த சமூகத்தைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தனியே பிரிந்துகொண்டார்கள்” அல்லது “தனியே பிரிக்கப்பட்டார்கள்.” எபிரெய வினை பன்மை வடிவத்தில் உள்ளது; அது தனியே பிரிதல் அல்லது தனியே ஒதுக்கப்படுதல் என்ற பொருளைத் தரலாம்.
    reason: alternative_reading
  - marker: c
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது ஒரே மூதாதையரின் வழிவந்த குல அல்லது விரிவான குடும்பப் பிரிவுகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டோரின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘நாடுகடத்தலின் மகன்கள்’ என்ற வடிவத்தையும், திரும்பிவந்த சமூகத்தைக் கூட்டாகக் குறிக்கும் அதன் பயன்பாட்டையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּבָּדְלוּ
  choice: தனியே பிரித்தெடுத்தார்
  rationale: בדל என்பதன் பிரித்தல்/தனியே ஒதுக்குதல் என்ற அடிப்படைப் பொருளைப் பாதுகாத்தபடி, விசாரணைக்காகப் பிரதிநிதிகளைத் தேர்ந்தெடுக்கும் சூழலை இயல்பாக வெளிப்படுத்துகிறது. எபிரெய வினையின் பன்மை வடிவத்தால் ஏற்படும் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: ஆசாரியனாகிய எஸ்றா
  rationale: இவ்வசனத்தில் உள்ள ‘ஆசாரியன்’ என்ற பட்டத்தை மட்டும் தருகிறது; அருகிலுள்ள சூழலிலிருந்து ‘வேதபாரகன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்களான ஆண்கள்
  rationale: אֲנָשִׁים என்பதிலுள்ள ஆண் குறியீட்டையும், רָאשֵׁי הָאָבוֹת குறிக்கும் குல/மூதாதையர் குடும்பத் தலைமையையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: அவரவர் தந்தைவழிக் குடும்பத்தின்படி
  rationale: தேர்ந்தெடுக்கப்பட்டவர்கள் தங்கள் மூதாதையர் அல்லது தந்தைவழிக் குடும்பப் பிரிவுகளின்படி ஒழுங்குபடுத்தப்பட்டதைத் தெளிவாகக் கூறுகிறது.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: பெயர் குறிப்பிட்டு
  rationale: ஒவ்வொருவரும் தனிப்பட்ட பெயரால் அடையாளப்படுத்தப்பட்டனர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֵּשְׁבוּ
  choice: அமர்ந்தார்கள்
  rationale: ישב என்பதன் நேரடிப் படிமத்தைப் பாதுகாப்பதோடு, நிர்வாக விசாரணைக்காக அவர்கள் கூடிச் செயல்பட்ட சூழலுக்கும் பொருந்துகிறது.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: பத்தாம் மாதத்தின் முதலாம் நாளில்
  rationale: ‘மாதத்தின் நாள் ஒன்று’ என்ற எபிரெய நாள்காட்டி மரபை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: அந்தக் காரியத்தை விசாரிப்பதற்காக
  rationale: דרש என்பதன் தேடுதல்/ஆராய்ந்து விசாரித்தல் என்ற நிர்வாகச் சூழலுக்குரிய பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיִּבָּדְלוּ என்ற பன்மை வினையின் தொடரமைப்பு
  choice: எஸ்றா ஆண்களைத் தனியே பிரித்தெடுத்தார்
  alternative: எஸ்றாவும் குடும்பத் தலைவர்களான ஆண்களும் தனியே பிரிந்துகொண்டார்கள்
  rationale: மெய்யெழுத்து உரையின் பன்மை வினை மாற்று தொடரமைப்பை அனுமதித்தாலும், வாக்கியத்தின் நிர்வாகச் சூழலும் பழமையான மொழிபெயர்ப்பு சான்றும் எஸ்றா விசாரணையாளர்களைத் தனியே தேர்ந்தெடுத்தார் என்ற புரிதலை ஆதரிக்கின்றன. உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ என்ற சொற்றொடர் எபிரெய சமூக அமைப்பை மிகையாக எளிமைப்படுத்தாமல் விளக்குகிறது; ‘தனியே பிரித்தெடுத்தார்’ என்பது மூல வினையின் பிரித்தல் உணர்வையும் சூழலின் தேர்வு உணர்வையும் இணைக்கிறது.
