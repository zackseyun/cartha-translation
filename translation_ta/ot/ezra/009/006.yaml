source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: ta
  text: 'நான் சொன்னேன்: “என் இறைவனே, உம்மை நோக்கி என் முகத்தை உயர்த்த நான் வெட்கப்பட்டு நாணமடைகிறேன், என் இறைவனே! ஏனெனில் எங்கள் அக்கிரமங்கள் எங்கள் தலைக்குமேல்[a] பெருகிவிட்டன; எங்கள் குற்றப்பழி வானம்வரை உயர்ந்துவிட்டது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் தலைகளுக்குமேல்.” எபிரெயில் ஒருமை ‘தலை’ வந்தாலும், அது இங்கு பன்மையான உடைமைப்பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: எபிரெய ஒருமை மரபுத்தொடருக்கும் இயல்பான பன்மைப் புரிதலுக்கும் இடையிலான மொழியியல் வேறுபாட்டைக் காட்டுகிறது.
lexical_decisions:
- source_word: בֹּשְׁתִּי
  choice: வெட்கப்பட்டு
  rationale: சூழலில் நீடிக்கும் தனிப்பட்ட வெட்கநிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנִכְלַמְתִּי
  choice: அவமானமடைகிறேன்
  rationale: முந்தைய ‘வெட்கப்பட்டு’ என்பதுடன் இணைந்து எஸ்றாவின் ஆழ்ந்த இழிவுணர்வை வலுப்படுத்துகிறது; இரண்டு எபிரெய வினைகளின் வேறுபாட்டையும் காக்கிறது.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: என் முகத்தை உம்மை நோக்கி உயர்த்த
  rationale: தேவனை வெளிப்படையாக எதிர்கொள்ளும் எபிரெய மரபுத்தொடரைக் காக்கிறது; மூலத்தில் உள்ள ‘முகம்’ என்பதை ‘கண்கள்’ என்று மாற்றவில்லை.
- source_word: עֲוֺנֹתֵינוּ
  choice: எங்கள் அக்கிரமங்கள்
  rationale: ஒழுக்கரீதியான தீமையையும் வக்கிரத்தையும் குறிக்கும் சொல்லின் கனத்தைத் தருகிறது; பின்னர் வரும் אַשְׁמָה என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: רָבוּ
  choice: பெருகிவிட்டன
  rationale: வெறுமனே அதிகமாக இருப்பதைவிட, எண்ணிக்கையிலும் அளவிலும் வளர்ந்திருப்பதைச் சுட்டும் வினைச்சொல் வலிமையைப் பாதுகாக்கிறது.
- source_word: לְמַעְלָה רֹאשׁ
  choice: எங்கள் தலைக்குமேல்
  rationale: கட்டுப்படுத்த முடியாத அளவுக்கு அக்கிரமங்கள் உயர்ந்துள்ளன என்ற செங்குத்து உருவகத்தையும், எபிரெயிலுள்ள ஒருமை ‘தலை’ என்ற கூட்டுப்பொருள் பயன்பாட்டையும் காக்கிறது.
- source_word: אַשְׁמָתֵנוּ
  choice: எங்கள் குற்றப்பழி
  rationale: இங்கு பலியைக் குறிக்காமல் குற்றத்தால் ஏற்பட்ட பழியையும் பொறுப்பையும் குறிக்கிறது; עֲוֺנֹתֵינוּ என்பதற்குத் தேர்ந்த ‘அக்கிரமங்கள்’ என்பதிலிருந்து வேறுபடுகிறது.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: வானம்வரை உயர்ந்துவிட்டது
  rationale: எபிரெய மிகைப்படுத்திய உயர உருவகத்தை இயல்பான தமிழில் தருகிறது; எபிரெயிலுள்ள ‘வானங்கள்’ என்பது தமிழில் வழக்கமான ஒருமை ‘வானம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: நேரடி அழைப்பையும் தனிப்பட்ட உறவையும் காட்டுகிறது; மூலத்தில் இருமுறை வருவதால் இரு இடங்களிலும் காக்கப்பட்டுள்ளது.
- source_word: וָאֹמְרָה
  choice: நான் சொன்னேன்
  rationale: எளிய கதைத் தொடர்ச்சியை இயல்பாகத் தருகிறது; எபிரெய இணைப்புச் சொல்லின் பணியை தமிழில் நிறுத்தக்குறி மற்றும் தொடரமைப்பு நிறைவேற்றுகின்றன.
theological_decisions:
- issue: எஸ்றா தனிப்பட்டவராகப் பேசினாலும் சமூகத்தின் அக்கிரமத்தையும் குற்றப்பழியையும் ‘எங்கள்’ என்று அறிக்கையிடுதல்
  choice: மூலத்திலுள்ள முதல் நபர் பன்மையை மாற்றாமல் ‘எங்கள்’ என்று வைத்தல்
  alternative: ‘அவர்களின்’ அல்லது ‘இஸ்ரவேலரின்’ என்று விளக்கமாக்குதல்
  rationale: எஸ்றா தன்னை சமூகத்திலிருந்து பிரிக்காமல் செய்யும் கூட்டு அறிக்கையின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது; தனிப்பட்ட குற்றத்தின் அளவை உரை இங்கு தனியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘உம்மை’ என்ற மரியாதை வடிவமும் ‘என் இறைவனே’ என்ற இருமுறை அழைப்பும் மூலத்தின் உணர்ச்சி வலிமையைத் தக்கவைக்கின்றன.
