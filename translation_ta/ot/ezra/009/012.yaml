  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: ta
  text: ஆகவே இப்போது, உங்கள் மகள்களை அவர்களுடைய மகன்களுக்குத் திருமணம் செய்து கொடுக்காதீர்கள்; அவர்களுடைய மகள்களை உங்கள் மகன்களுக்கு மணம் முடிக்காதீர்கள். அவர்களுடைய சமாதானத்தையும் நலனையும் ஒருபோதும் நாடாதீர்கள்.[a] நீங்கள் வலிமையடைந்து, நாட்டின் நன்மையை உண்டு, அந்த நாட்டை உங்கள் மகன்களுக்கு என்றென்றும் மரபுரிமையாக அளிக்கும்படியாக இவ்வாறு செய்யுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “அவர்களுடைய சமாதானத்தையும் அவர்களுடைய நன்மையையும் என்றென்றும் நாடாதீர்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதை உங்கள் மகன்கள் என்றென்றும் உரிமையாகப் பெறச் செய்யுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: உங்கள் மகள்களை அவர்களுடைய மகன்களுக்குக் கொடுக்காதீர்கள்
  rationale: எபிரெயச் சொற்றொடரின் அமைப்பை நெருக்கமாகப் பேணுகிறது; இணையான அடுத்த கூறுடன் சேர்ந்து இது திருமணத்தைக் குறிப்பது தமிழிலும் தெளிவாக உள்ளது.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: அவர்களுடைய மகள்களை உங்கள் மகன்களுக்காக எடுக்காதீர்கள்
  rationale: נשא என்ற திருமண மரபுத்தொடரின் ‘எடுத்தல்’ என்ற உருவகத்தையும், לִבְנֵיכֶם என்பதன் ‘உங்கள் மகன்களுக்காக’ என்ற உறவையும் பேணுகிறது.
- source_word: תִדְרְשׁוּ
  choice: நாடாதீர்கள்
  rationale: דרש என்பதன் செயற்பூர்வமாகத் தேடுதல் அல்லது நாடுதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹמָם
  choice: அவர்களுடைய சமாதானம்
  rationale: שָׁלוֹם என்பதன் நேரடியான ‘சமாதானம்’ என்ற பொருளைப் பேணுகிறது; அதன் விரிவான நல்வாழ்வுப் பொருள் அடுத்த சொல்லால் துணைநிற்கப்படுகிறது.
- source_word: וְטוֹבָתָם
  choice: அவர்களுடைய நலன்
  rationale: טוֹבָה இங்கு அவர்களுக்கான நன்மை, நல்வாழ்வு ஆகியவற்றைக் குறிக்கிறது; ‘நலன்’ என்பது பொருளாதாரச் செழிப்புக்கு மட்டும் சுருக்காமல் அந்த அகலத்தைக் காக்கிறது.
- source_word: עַד עוֹלָם
  choice: ஒருபோதும்
  rationale: தடையுடன் வரும் இந்தச் சொற்றொடரின் தொடர்ந்தும் எக்காலத்திலும் செய்யக்கூடாது என்ற வலிமையை இயல்பான தமிழில் தருகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: இதனால் நீங்கள் வலிமையடைந்து
  rationale: לְמַעַן குறிக்கும் நோக்கம் அல்லது விளைவையும், חזק என்பதன் வலிமை அடைதல் என்ற பொருளையும் திறந்தவாறே வைத்திருக்கிறது.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: நாட்டின் நன்மையை உண்டு
  rationale: நாட்டின் வளத்தை அனுபவித்தல் என்ற மரபுத்தொடரின் கருத்து புரியும்படியாக இருக்கும்போதே, மூலத்தின் ‘உண்ணுதல்’ என்ற தெளிவான உருவகத்தைப் பேணுகிறது.
- source_word: וְהוֹרַשְׁתֶּם
  choice: உரிமைச் சொத்தாக விட்டுச் செல்வீர்கள்
  rationale: ירש என்பதன் ஹிஃபில் வடிவிலுள்ள பிறர் உரிமைபெறச் செய்தல் என்ற காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִבְנֵיכֶם
  choice: உங்கள் மகன்களுக்கு
  rationale: எபிரெயில் உள்ள ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைப் பொதுமைப்படுத்தாமல் துல்லியமாகப் பேணுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: சந்ததியினருக்கு நிலைத்திருக்கும் உரிமைச் சொத்தைக் குறிக்கும் இறுதிச் சொற்றொடரின் நீடித்த காலப் பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: சிறையிருப்புக்குப் பிந்தைய உடன்படிக்கைச் சூழலில் இன மற்றும் சமயப் பிரிவைக் கூறும் மொழி
  choice: சுற்றியிருந்த மக்களுடன் திருமண உறவு கொள்ளவும் அவர்களுடைய சமாதானத்தையும் நலனையும் நாடவும் விதிக்கப்பட்ட தடையை அதன் குறிப்பிட்ட வரலாற்றுச் சூழலில் நேரடியாக மொழிபெயர்த்தல்
  alternative: இதை ஆவிக்குரிய தீங்கு தரும் கூட்டுறவுகளுக்கு எதிரான பொதுவான எச்சரிக்கையாக மென்மைப்படுத்துதல் அல்லது எல்லாக் காலத்திலும் வெளிப்புற மக்களுடன் பழகுவது குறித்த கட்டளையாக விரிவுபடுத்துதல்
  rationale: வசனம் எஸ்றாவின் சிறையிருப்புக்குப் பிந்தைய உடன்படிக்கைச் சூழலில் பேசுகிறது. மொழிபெயர்ப்பு கட்டளையின் கடுமையைத் தணிக்கவும் கூடாது; வசனத்தில் இல்லாத காலந்தோறும் பொருந்தும் கோட்பாட்டைச் சேர்க்கவும் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொடுத்தல்/எடுத்தல்’, ‘நாட்டின் நன்மையை உண்ணுதல்’ ஆகிய மூல உருவகங்கள் இயன்றவரை பேணப்பட்டுள்ளன; கருத்தை தேவையின்றி விரிவுபடுத்தவில்லை.
