base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: ta
  text: 'ஆனால் இப்போதோ, சிறிது நேரத்திற்கு, எங்கள் கடவுளாகிய யாவேவிடமிருந்து எங்களுக்குத் தயவு கிடைத்துள்ளது: தப்பிப் பிழைத்த ஒரு மீதியை எங்களுக்காக விட்டுவைக்கவும், அவருடைய பரிசுத்த இடத்தில் எங்களுக்கு ஓர் ஆணியைத் தரவும்[a], எங்கள் கடவுள் எங்கள் கண்களுக்கு ஒளியூட்டவும்[b], எங்கள் அடிமைத்தனத்தில்[c] எங்களுக்குச் சிறிதளவு புத்துயிர் அளிக்கவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறுதியான ஒரு நிலை.’ எபிரேய மொழி உறுதியாகப் பதிக்கப்பட்ட ஒன்றின் திடமான உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘எங்கள் கண்களுக்கு வெளிச்சம் தரவும்.’ இந்த மரபுத்தொடர் புதுப்பிக்கப்பட்ட உயிராற்றல் அல்லது நம்பிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எங்கள் அடிமைநிலையில்’ அல்லது ‘எங்கள் அடிமைத்தனத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: தயவு
  rationale: இச்சூழலில் இச்சொல் மக்களின் விண்ணப்பத்தைக் குறிக்காமல், யாவேவிடமிருந்து அவர்களுக்குக் கிடைத்த இரக்கமுள்ள ஆதரவைக் குறிக்கிறது; ஆகவே இயல்பான ‘தயவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּלֵיטָה
  choice: தப்பிப் பிழைத்த ஒரு மீதியானோர்
  rationale: அழிவிலிருந்தும் சிறையிருப்பிலிருந்தும் தப்பிப் பாதுகாக்கப்பட்ட சமூகத்தைக் குறிக்கும் உயிர்பிழைப்பு மற்றும் மீதியானோர் ஆகிய இரு பொருள்களையும் இது தக்கவைக்கிறது.
- source_word: יָתֵד
  choice: ஓர் ஆணி
  rationale: உறுதியாகப் பதிக்கப்பட்ட ஆணி அல்லது முளை என்ற எபிரேய மொழியின் உருவகத்தை அருவமான விளக்கமாக மாற்றாமல் முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்த இடத்தில்
  rationale: ஆலயத்தை மையமாகக் கொண்ட பொருளுக்கு இடமளித்தபடியே, எபிரேய சொற்றொடரை மிகையாகக் குறிப்பாக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: எங்கள் கண்களுக்கு ஒளியூட்ட
  rationale: புதுப்பிக்கப்பட்ட உயிராற்றல் மற்றும் நம்பிக்கையைக் குறிக்கும் மூலமொழி உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִחְיָה
  choice: புத்துயிர்
