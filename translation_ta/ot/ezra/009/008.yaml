  rationale: தயவின் ஊற்றாக யாவே இருப்பதை வலியுறுத்தும் מֵאֵת என்பதன் பொருளைத் தக்கவைத்தபடி தமிழில் இயல்பான வாக்கிய அமைப்பை அளிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: יָתֵד என்ற உருவகத்தின் பொருள்
  choice: ஆணி என்ற திடமான உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: உறுதியான நிலை என்று உருவகத்தை விளக்கிவிடுதல்
  rationale: உருவகம் பாதுகாப்பான நிலை அல்லது நிலைத்திருக்கும் இடத்தைக் குறிக்கலாம்; எனினும் மூல உரை அதன் துல்லியமான பயன்பாட்டை விளக்காமல் திடமான படிமத்தையே தருவதால் அந்தத் திறந்த தன்மை பாதுகாக்கப்பட்டது.
