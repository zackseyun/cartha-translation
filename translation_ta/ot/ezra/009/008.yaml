  to: 'ஆனால் இப்போதோ, சிறிது நேரத்திற்கு, எங்கள் கடவுளாகிய யாவேவிடமிருந்து எங்களுக்குத் தயவு கிடைத்துள்ளது: தப்பிப் பிழைத்த ஒரு மீதியை எங்களுக்காக விட்டுவைக்கவும், அவருடைய பரிசுத்த இடத்தில் எங்களுக்கு ஓர் ஆணியைத் தரவும்[a], எங்கள் கடவுள் எங்கள் கண்களுக்கு ஒளியூட்டவும்[b], எங்கள் அடிமைத்தனத்தில்[c] எங்களுக்குச் சிறிதளவு புத்துயிர் அளிக்கவும்.'
