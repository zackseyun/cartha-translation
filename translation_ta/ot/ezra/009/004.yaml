revisions:
- from: அப்போது, நாடுகடத்தப்பட்ட மக்களின் துரோகத்தால், இஸ்ரவேலின் தேவனுடைய வார்த்தைகளுக்கு நடுங்கிய அனைவரும் என்னிடம் கூடிவந்தார்கள்.[a] நானோ மாலைப் படையல் நேரம்வரை திகைத்துப்போய் உட்கார்ந்திருந்தேன்.[b]
  to: அப்போது, நாடுகடத்தப்பட்டோர் சமூகத்தின் நம்பிக்கை மீறலினால், இஸ்ரவேலின் தேவனுடைய வார்த்தைகளைக் கண்டு நடுங்கிய அனைவரும் என்னிடம் கூடிவந்தார்கள்.[a] நானோ மாலைப் படையல் வரை திகைத்தவனாய் அமர்ந்திருந்தேன்.[b]
  rationale: The revision retains the verse’s syntax and meaning while using a more source-sensitive rendering for מַעַל and a more precise collective rendering for הַגּוֹלָה. It also makes the trembling expression more idiomatic in modern standard Tamil and preserves the ambiguity of minḥah through the footnote.
