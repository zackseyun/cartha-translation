base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: ta
  text: அப்போது, நாடுகடத்தப்பட்டோர் சமூகத்தின் நம்பிக்கை மீறலினால், இஸ்ரவேலின் தேவனுடைய வார்த்தைகளைக் கண்டு நடுங்கிய அனைவரும் என்னிடம் கூடிவந்தார்கள்.[a] நானோ மாலைப் படையல் வரை திகைத்தவனாய் அமர்ந்திருந்தேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாடுகடத்தப்பட்டோர் சமூகத்தின் நம்பிக்கை மீறலினால்” என்பதை “நாடுகடத்தப்பட்டோரின் துரோகத்தினால்” அல்லது “நாடுகடத்தப்பட்டோர் சமூகத்தின் குற்றத்தினால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “படையல்” என்பது மின்கா (minḥah) என்ற எபிரெயச் சொல்லின் மொழிபெயர்ப்பு. அது பெரும்பாலும் தானியப் படையலைக் குறிக்கும்; இங்கு ஆலயத்தில் வழக்கமாகச் செலுத்தப்பட்ட மாலைப் படையலின் நேரத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: கூடிவந்தார்கள்
  rationale: நிஃபால் வடிவம் மக்கள் எஸ்றாவிடம் ஒன்றுகூடியதைக் குறிக்கிறது. “கூடிவந்தார்கள்” என்பது செயப்பாட்டு அல்லது இடைநிலை நுட்பத்தை மிகையாகத் தீர்மானிக்காமல் இயல்பான தமிழில் கூட்டுச் செயலை வெளிப்படுத்துகிறது.
- source_word: כֹּל חָרֵד
  choice: நடுங்கிய அனைவரும்
  rationale: כֹּל என்பதற்குப் பின் வரும் ஒருமைச் சொல் இங்கு கூட்டுப் பொருளுடையது. “நடுங்கிய அனைவரும்” என்பது அச்சத்தையும் ஆழ்ந்த பயபக்தியையும் உள்ளடக்கக்கூடிய எபிரெயச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேவனுடைய வார்த்தைகளுக்கு
  rationale: בְּ என்பது இங்கு நடுக்கத்தின் பொருளையோ காரணத்தையோ குறிக்கலாம். “வார்த்தைகளுக்கு நடுங்கிய” என்ற அமைப்பு அந்த இரு நுட்பங்களையும் முழுமையாகக் குறுக்காமல், மூலத்தின் பன்மையான “வார்த்தைகள்” என்பதையும் காக்கிறது.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: நாடுகடத்தப்பட்ட மக்களின் துரோகத்தால்
  rationale: מַעַל என்பது சாதாரணத் தவறை விட நம்பிக்கையை மீறிய துரோகத்தைக் குறிக்கிறது. הַגּוֹלָה என்பது நாடுகடத்தப்பட்டு பின்னர் திரும்பிய சமூகத்தைக் குறிக்கக்கூடும்; சுருக்கமாக “நாடுகடத்தப்பட்ட மக்கள்” என வழங்கப்பட்டுள்ளது.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: திகைத்துப்போய் உட்கார்ந்திருந்தேன்
  rationale: இந்தச் சொற்றொடர் எஸ்றாவின் தொடர்ந்த அமர்ந்த நிலையையும் அதிர்ச்சியால் செயலற்றுப்போன நிலையையும் காட்டுகிறது. “திகைத்துப்போய்” என்பது வெறும் ஆச்சரியத்தை விட ஆழ்ந்த அதிர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: மாலைப் படையல் நேரம்வரை
  rationale: מִנְחָה குறிப்பாக தானியப் படையலைக் குறிக்கலாம்; இங்கு வழக்கமான மாலை ஆலய வழிபாட்டின் நேரக்குறிப்பாகவும் செயல்படுகிறது. “படையல்” மூலச் சொல்லின் வழிபாட்டுச் சார்பைக் காத்து, “பலி” என்று மிகைப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் מַעַל என்பதன் பொருள்
  choice: துரோகம்
  alternative: நம்பிக்கை மீறல்; குற்றம்
  rationale: இச்சொல் தேவனுக்கு எதிரான உறவுசார் நம்பிக்கை மீறலைக் குறிக்கிறது. “துரோகம்” அந்தக் கடுமையையும் உறவுச் சார்ந்த பரிமாணத்தையும் தெளிவாகக் காட்டுகிறது; பிற்கால இறையியல் வகைப்பாடுகளைச் சேர்ப்பதில்லை.
- issue: הַגּוֹלָה குறிக்கும் சமூகத்தின் அடையாளம்
  choice: நாடுகடத்தப்பட்ட மக்கள்
  alternative: நாடுகடத்தப்பட்டோர் சமூகம்; நாடுகடத்தலிலிருந்து திரும்பியவர்கள்
  rationale: இந்தப் பெயர்ச்சொல் நாடுகடத்தப்பட்டு இப்போது திரும்பிய மக்களைக் குறிக்கிறது. முதன்மை உரை மூலத்தின் சுருக்கத்தைப் பேணுகிறது; மாற்று விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. “தேவன்,” “படையல்,” “துரோகம்” ஆகிய சொற்கள் வழிபாட்டு மற்றும் உடன்படிக்கைச் சூழலைத் தெளிவாக்குகின்றன; அதேவேளை மூலத்தில் உள்ள சொற்பொருள் நுட்பங்களை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
