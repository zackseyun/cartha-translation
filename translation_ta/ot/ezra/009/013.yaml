  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: ta
  text: நமது தீய செயல்களாலும் நமது பெரும் குற்றத்தாலும் இவையெல்லாம் நமக்கு நேர்ந்த பிறகும்—எங்கள் கடவுளே, எங்கள் அக்கிரமங்களுக்குத் தகுதியான அளவைவிடக் குறைவாகவே எங்களைத் தண்டித்து,[a] இத்தகைய மீந்தோரை எங்களுக்குக் கொடுத்திருக்கிறீரே—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் அக்கிரமங்களுக்குரிய முழு அளவிலான தண்டனையை எங்கள்மேல் வரவிடாமல்.” எபிரெய மரபுத்தொடர், அவர்களுடைய குற்றத்தின் அளவுக்குக் கீழாகத் தீர்ப்பைத் தடுத்து வைத்ததைச் சொல்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל הַבָּא עָלֵינוּ
  choice: இவையெல்லாம் நமக்கு நேர்ந்த பிறகும்
  rationale: தொடர்ச்சியைக் காட்டும் וְ, காலத் தொடர்பைக் காட்டும் אַחֲרֵי, மக்கள்மேல் வந்த அனைத்துத் துன்பங்களையும் குறிக்கும் சொற்றொடர் ஆகியவற்றை இயல்பான தமிழில் தருகிறது. வாக்கியத்தின் concessive ஓட்டத்திற்கேற்ப ‘பிறகும்’ பயன்படுத்தப்பட்டது.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: நமது தீய செயல்களாலும்
  rationale: בְּ இங்கு காரணத்தைக் குறிக்கிறது; ‘செயல்கள்’ என்பது מַעֲשִׂים என்பதன் பொதுவான, தெளிவான தமிழ் இணை.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: நமது பெரும் குற்றத்தாலும்
  rationale: אַשְׁמָה வெறும் குற்றவுணர்வை அல்ல, உண்மையான குற்றப்பொறுப்பைக் குறிக்கிறது. ‘பெரும் குற்றம்’ அதைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי אַתָּה אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: நேரடி அழைப்பை இயல்பான தமிழில் தருகிறது; כִּי-யின் உரையாடல் உறவு முழு வாக்கிய அமைப்பிலும் ‘பிறகும்’ மற்றும் இறுதி ‘-ஏ’ வழியாக வெளிப்படுகிறது.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: எங்கள் அக்கிரமங்கள் தகுதியான அளவைக் காட்டிலும் குறைவாகவே எங்களைத் தண்டித்து
  rationale: ‘தடுத்து வைத்தல்/விட்டுவைத்தல்’ என்ற எபிரெய மரபுத்தொடர், அவர்களுடைய அக்கிரமம் கோரிய முழு அளவிலான தண்டனை வழங்கப்படவில்லை என்பதைக் குறிக்கிறது. தெளிவுக்காகப் பொருளை வெளிப்படையாகத் தருகிறது; மாற்று வடிவம் அடிக்குறிப்பில் உள்ளது.
- source_word: עָוֺן
  choice: அக்கிரமங்கள்
  rationale: עָוֺן என்பதிலுள்ள ஒழுக்கக் குற்றமும் அதனால் வரும் குற்றப்பொறுப்பும் ‘அக்கிரமம்’ என்பதில் வலுவாகப் பிரதிபலிக்கின்றன.
- source_word: וְנָתַתָּה לָּנוּ פְּלֵיטָה כָּזֹאת
  choice: இத்தகைய மீந்தோரைக் கொடுத்திருக்கிறீரே
  rationale: פְּלֵיטָה அழிவிலிருந்து தப்பிப் பாதுகாக்கப்பட்டவர்களைச் சுட்டுகிறது. ‘மீந்தோர்’ புலம்பெயர்வுக்குப் பிந்தைய சூழலையும் உயிர் தப்பிய குழுவையும் இயல்பாக வெளிப்படுத்துகிறது; perfect வினையின் நிகழ்காலப் பொருத்தம் ‘கொடுத்திருக்கிறீர்’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தகுதியான தண்டனையுடன் ஒப்பிடப்படும் இறை இரக்கம்
  choice: எங்கள் அக்கிரமங்கள் தகுதியான அளவைக் காட்டிலும் குறைவாகவே எங்களைத் தண்டித்து
  alternative: எங்கள் அக்கிரமத்திற்குரிய முழு அளவிலான தண்டனையை எங்கள்மேல் வரவிடாமல்
  rationale: மக்களின் குற்றத்தின் தீவிரத்தையும், அதற்குரிய முழுத் தீர்ப்பை வழங்காமல் கடவுள் காட்டிய இரக்கத்தையும் ஒன்றாகக் காக்கிறது; எபிரெய மரபுத்தொடரின் சாத்தியமான நேரடியான புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: פְּלֵיטָה என்பதன் வரலாற்று-இறையியல் நுட்பம்
  choice: மீந்தோர்
  alternative: தப்பிப்பிழைத்தோர் / தப்புதல்
  rationale: இச்சூழலில் பாதுகாக்கப்பட்டு மீந்த சமூகத்தைச் சுட்டுவதால், செயற்பாடான ‘தப்புதல்’ என்பதைக் காட்டிலும் மனிதக் குழுவைக் குறிக்கும் ‘மீந்தோர்’ பொருத்தமானது; மாற்று அர்த்தங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான நேரடி அழைப்பு மற்றும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நீண்ட நிபந்தனைச் சொல்லாக்கத்தின் பகுதியாக இருப்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
