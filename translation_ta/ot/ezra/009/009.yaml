base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: ta
  text: ஏனெனில், நாம் அடிமைகள்; ஆனாலும், நமது அடிமைத்தனத்திலே நமது கடவுள் நம்மைக் கைவிடவில்லை. மாறாக, பெர்சிய அரசர்களின் முன்னிலையில் அவர் நம்மேல் மாறாத அன்பைக் காட்டினார்[a]; நமக்குப் புத்துயிர் அளிக்கவும், நமது கடவுளின் ஆலயத்தை எழுப்பவும், அதன் பாழடைந்த பகுதிகளைச் சீரமைக்கவும், யூதாவிலும் எருசலேமிலும் நமக்குச் சுவர் அளிக்கவும் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாறாத அன்பு” என்பதற்கு “உறுதியான அன்பு,” “தயவு,” அல்லது “இரக்கம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் விசுவாசமும் அருளும் நிறைந்த அன்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “சுவர்” என்பதற்கு “வேலி” அல்லது “பாதுகாப்புச் சுற்று” என்றும் மொழிபெயர்க்கலாம். இது நேரடியான கட்டுமானத்தை மட்டுமல்லாமல், யூதாவிலும் எருசலேமிலும் கிடைத்த பாதுகாப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: அடிமைகள் / நமது அடிமைத்தனத்தில்
  rationale: பேரரசின் கீழிருந்த கட்டுப்பட்ட நிலையையும், எபிரெயச் சொற்களுக்கிடையிலான தொடர்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֲזָבָנוּ
  choice: நம்மைக் கைவிடவில்லை
  rationale: விட்டுவிடுதல் அல்லது கைவிடுதல் என்ற பொருளை இயல்பான தமிழ் இறைவேண்டல் நடையில் தருகிறது.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: நம்மேல் உடன்படிக்கைப் பேரன்பைப் பொழிந்தார்
  rationale: חֶסֶד என்பதிலுள்ள நிலையான, அருள்நிறைந்த உடன்படிக்கைச் சார்ந்த அன்பைப் பாதுகாக்கிறது; נטה குறிக்கும் ஒருவர்மேல் செலுத்தும் இயக்கத்தைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: பெர்சிய அரசர்களுக்கு முன்பாக
  rationale: அரசர்களின் முன்னிலையில் அல்லது அவர்களுடனான தொடர்பில் என்பதைக் கூடுதல் விளக்கமின்றி வைத்திருக்கிறது.
- source_word: מִחְיָה
  choice: புத்துயிர்
  rationale: உயிர் காக்கப்படுதலும் மீண்டும் உயிர்ப்பிக்கப்படுதலும் ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகக் கொண்டுள்ளது.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: நமது கடவுளின் ஆலயத்தை எழுப்ப
  rationale: בית என்பதன் சூழல்சார் குறிப்பு ஆலயம்; רום என்பதன் உயர்த்துதல் அல்லது எழுப்புதல் உருவகத்தையும் காக்கிறது.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: அதன் பாழிடங்களை மீண்டும் நிலைநிறுத்த
  rationale: ஹிஃபில் வினையின் ‘நிற்கச் செய்தல்’ என்ற கருத்தையும், பாழடைந்தவற்றை மீள அமைத்தல் என்ற சூழல்சார் பொருளையும் இயல்பாக இணைக்கிறது.
- source_word: גָדֵר
  choice: பாதுகாப்பு அரண்
  rationale: சுவர் அல்லது வேலி என்ற திட உருவகத்தையும், பாதுகாப்பு என்ற விரிவான சூழல்சார் பொருளையும் வைத்திருக்கிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கைப் பேரன்பு
  alternative: மாறாத அன்பு; இரக்கம்; தயவு
  rationale: கடவுள் தமது மக்களிடம் காட்டும் விசுவாசமுள்ள அருளன்பின் உடன்படிக்கை நுணுக்கத்தை வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: גָדֵר என்பதன் உருவகப் பொருள்
  choice: பாதுகாப்பு அரண்
  alternative: சுவர்; வேலி; பாதுகாப்புச் சுற்று
  rationale: இது சொற்பொருளில் ஒரு தடுப்பைக் குறிக்கலாம்; இவ்வசனத்தில் பாரசீக ஆட்சியின்கீழ் கிடைத்த பாதுகாப்பையும் குறிக்கக்கூடும். தமிழ் முதன்மை உரை இரு நுணுக்கங்களையும் இணைத்துக் காட்டுகிறது; அடிக்குறிப்பு குழப்பத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்/அடிமைத்தனம்’ என்ற சொல் மீளுரை எபிரெய மூலத்தின் வலிமையைப் பாதுகாக்கிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், காரண–விளைவு தொடர்பு காக்கப்பட்டுள்ளது.
