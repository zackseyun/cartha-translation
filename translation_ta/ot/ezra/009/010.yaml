  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: ta
  text: இப்போதோ[a], எங்கள் தேவனே, இதற்குப் பிறகு நாங்கள் என்ன சொல்ல முடியும்? ஏனெனில், உமது கட்டளைகளை நாங்கள் கைவிட்டுவிட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் என்ன சொல்வோம்?” எபிரெய வினை வடிவத்தை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: ו என்ற இணைப்பையும் עַתָּה என்ற காலக் குறிப்பையும் தமிழில் இயல்பான உரையாடல் மாற்றமாகச் சுருக்கமாக வெளிப்படுத்துகிறது; முந்தைய வேண்டுதலிலிருந்து அடுத்த எண்ணத்துக்குச் செல்கிறது.
- source_word: מַה נֹּאמַר
  choice: நாங்கள் என்ன சொல்ல முடியும்?
  rationale: முதல் நபர் பன்மை imperfect இங்கு வெறும் எதிர்காலத்தைக் காட்டாமல், குற்றவுணர்வினால் பதில் சொல்ல இயலாத நிலையை உணர்த்தும் ஆலோசனைசார் வினாவாக உள்ளது. இந்தத் தமிழ் வடிவம் அந்த வினாவியல் இயலாமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் தேவனே
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டையும், ஜெபத்தில் வரும் நேரடி அழைப்பையும் தமிழின் விளிவேற்றுமை வடிவத்தில் தெளிவாகக் காட்டுகிறது.
- source_word: אַחֲרֵי זֹאת
  choice: இதற்குப் பிறகு
  rationale: முன்னர் விவரிக்கப்பட்ட பாவத்தையும் நெருக்கடியையும் பின்னோக்கிச் சுட்டும் காலவியல் தொடரை இயல்பாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எஸ்றா ஏன் எதுவும் சொல்ல இயலாத நிலையில் இருக்கிறார் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָזַבְנוּ
  choice: நாங்கள் கைவிட்டுவிட்டோம்
  rationale: உடன்படிக்கை மற்றும் ஒழுக்கச் சூழலில் עזב வெறுமனே விட்டுச் செல்வதைவிடக் கடமையைத் துறத்தல் என்ற கனமான பொருளைக் கொண்டுள்ளது; ‘கைவிட்டுவிட்டோம்’ அந்த நிறைவேறிய மீறலையும் அதன் தீவிரத்தையும் தெரிவிக்கிறது.
- source_word: מִצְוֺתֶיךָ
  choice: உமது கட்டளைகளை
  rationale: தெய்வீக ஆணைகளைக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ் வடிவம்; இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமையை மரியாதை நடையில் ‘உமது’ என வழங்குகிறது.
theological_decisions:
- issue: எஸ்றாவின் அறிக்கையின் தொனி
  choice: தேவனுக்கு முன் குற்றத்தை ஒப்புக்கொண்டு, பதில் சொல்ல இயலாத நிலையை வெளிப்படுத்தும் வினாவியல் அறிக்கை
  alternative: அடுத்து என்ன சொல்ல வேண்டும் என்று வழிகாட்டுதல் கேட்கும் சாதாரண வினா
  rationale: ‘நாங்கள் என்ன சொல்ல முடியும்? ... உமது கட்டளைகளை நாங்கள் கைவிட்டுவிட்டோம்’ என்பது நடுநிலையான ஆலோசனை அல்ல; மனந்திரும்புதலும் குற்றவுணர்வும் நிறைந்த வினாவியல் மொழி. எபிரெய உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்காமல் இந்த இறுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஜெபத்திற்குரிய மரியாதை நடைக்காக ‘எங்கள் தேவனே’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
