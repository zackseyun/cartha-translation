base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: ta
  text: '“உமது ஊழியர்களாகிய தீர்க்கதரிசிகள் மூலம் நீர் கட்டளையிட்டது இதுவே: ‘நீங்கள் உரிமையாக்கிக்கொள்ள நுழைகிற நாடு, நாடுகளின் மக்களின் தீட்டினாலும் அவர்களுடைய அருவருப்பான செயல்களினாலும் தீட்டுப்பட்ட நாடாகும்[b]. அவர்கள் அந்த நாட்டைத் தங்கள் அருவருப்பான செயல்களால் ஒரு முனையிலிருந்து மறுமுனைவரை[a] தங்கள் அசுத்தத்தால் நிரப்பியிருக்கிறார்கள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “வாயிலிருந்து வாய்வரை”; இது நாடு முழுவதும், ஒரு முனையிலிருந்து மறுமுனைவரை என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “தீட்டு” மற்றும் “அசுத்தம்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்கள் சடங்குசார் அசுத்தத்தையும் ஒழுக்கரீதியான மாசையும் குறிக்கும் நிழற்பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: மூலம்
  rationale: ‘கையினால்’ என்பது எபிரெய மொழியில் செயற்படுத்தும் இடைநிலையைக் குறிக்கும் மரபுத்தொடர்; நவீன தமிழில் ‘மூலம்’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: உமது ஊழியர்களாகிய தீர்க்கதரிசிகள்
  rationale: இங்கு עבד என்பது அடிமைநிலையை வலியுறுத்தாமல், கடவுளுக்குப் பணிபுரியும் தீர்க்கதரிசிகளை மரியாதையுடன் குறிக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ என்பதில் நாட்டைச் சுதந்தரித்தல் அல்லது கைப்பற்றி உடைமையாக்குதல் ஆகிய நிழற்பொருள்கள் உள்ளன; இத்தேர்வு அவற்றை மிகையாகக் குறுக்காமல் தருகிறது.
- source_word: אֶרֶץ נִדָּה
  choice: தீட்டுப்பட்ட நாடு
  rationale: נִדָּה குறிக்கும் அசுத்தம்/தீட்டு மொழியைத் தமிழில் தெளிவாகத் தருகிறது; சடங்கு அல்லது ஒழுக்கம் என்ற ஒரே தளத்துக்குள் பொருளை வரையறுக்கவில்லை.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: பல்வேறு நாடுகளின் மக்களுடைய தீட்டினால்
  rationale: הָאֲרָצוֹת என்ற பன்மையையும், בְּ முன்னொட்டின் காரணப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: அவர்கள் தங்கள் அருவருப்பான செயல்களாலும்
  rationale: תּוֹעֵבָה என்பது வெறும் உணர்ச்சிசார் வெறுப்பை அல்ல, வெறுக்கத்தக்க நடைமுறைகளைக் குறிக்கும்; ‘செயல்கள்’ என்பதைச் சேர்ப்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: מִפֶּה אֶל־פֶּה
  choice: ஒரு முனையிலிருந்து மறுமுனைவரை
  rationale: சொல்லுக்குச் சொல் ‘வாயிலிருந்து வாய்வரை’; இங்கு நாடு முழுவதையும் குறிக்கும் இடவியல் மரபுத்தொடராக இருப்பதால் பொருள்சார் மொழிபெயர்ப்பு வழங்கப்பட்டது.
- source_word: בְּטֻמְאָתָם
  choice: தங்கள் தீட்டினாலும்
  rationale: טֻמְאָה என்பதன் தீட்டு/அசுத்தப் பொருளைத் தக்கவைத்து, வசனத்தின் ஒழுக்க மற்றும் சடங்கு சார்ந்த இரட்டை நிழலைத் திறந்தவாறு வைத்திருக்கிறது.
theological_decisions:
- issue: நாட்டின் தீட்டின் தன்மை
  choice: சடங்குசார் அசுத்தம் அல்லது ஒழுக்கச் சீரழிவு என்று மட்டும் குறுக்காமல் ‘தீட்டு’ மொழியில் மொழிபெயர்த்தல்
  alternative: முழுவதும் ‘சடங்குத் தூய்மையின்மை’ அல்லது முழுவதும் ‘ஒழுக்கக்கேடு’ என்று மொழிபெயர்த்தல்
  rationale: נִדָּה, טֻמְאָה, תּוֹעֵבָה ஆகிய சொற்கள் சடங்கு, ஒழுக்கம், உடன்படிக்கை சார்ந்த நிழற்பொருள்களை ஒன்றோடொன்று இணைக்கின்றன; மூலத்தின் இந்த இறையியல் இழுவிசை பாதுகாக்கப்படுகிறது.
- issue: தீர்க்கதரிசிகளின் வழியான கட்டளை
  choice: ‘தீர்க்கதரிசிகள் மூலம்’ என்று முகமையை வெளிப்படுத்துதல்
  alternative: ‘தீர்க்கதரிசிகளின் கையினால்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்
  rationale: கட்டளையின் மூலராக கடவுளையும், அதை எடுத்துரைத்த இடைநிலையாளர்களாக தீர்க்கதரிசிகளையும் வேறுபடுத்தி இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘தீட்டு’ என்ற பொதுமக்களுக்கு விளங்கும் சொல் மீளுருவாகப் பயன்படுத்தப்பட்டு மூலத்தின் கருத்துத் தொடர் காக்கப்பட்டது; ‘கையினால்’ போன்ற தமிழில் செயற்கையாக ஒலிக்கும் எபிரெய மரபுத்தொடர் இயல்பாக்கப்பட்டது.
