- from: '“உமது ஊழியர்களாகிய தீர்க்கதரிசிகள் மூலம் நீர் கட்டளையிட்டது இதுவே: ‘நீங்கள் உரிமையாக்கிக்கொள்ள நுழைகிற நாடு, பல்வேறு நாடுகளின் மக்களுடைய தீட்டினால் தீட்டுப்பட்ட நாடு. அவர்கள் தங்கள் அருவருப்பான செயல்களாலும் தீட்டினாலும் அதை ஒரு முனையிலிருந்து மறுமுனைவரை[a] நிரப்பியிருக்கிறார்கள்.’”[b]'
  to: '“உமது ஊழியர்களாகிய தீர்க்கதரிசிகள் மூலம் நீர் கட்டளையிட்டது இதுவே: ‘நீங்கள் உரிமையாக்கிக்கொள்ள நுழைகிற நாடு, நாடுகளின் மக்களின் தீட்டினாலும் அவர்களுடைய அருவருப்பான செயல்களினாலும் தீட்டுப்பட்ட நாடாகும்[b]. அவர்கள் அந்த நாட்டைத் தங்கள் அருவருப்பான செயல்களால் ஒரு முனையிலிருந்து மறுமுனைவரை[a] தங்கள் அசுத்தத்தால் நிரப்பியிருக்கிறார்கள்.’”'
  rationale: 'The revision preserves the source’s sequence: the land is defiled because of the peoples’ impurity and abominations; their abominations are the means by which they filled it throughout; and their uncleanness is the pervasive defilement. It also moves the lexical footnote to its relevant expression and updates its wording to cover both Tamil renderings of the Hebrew impurity vocabulary.'
