  source_fidelity: மூலத்தின் காலத் தொடர்ச்சியும், கூட்டாகத் தீர்ப்புக்கு ஒப்புக்கொடுக்கப்பட்டமைவும், வாள், சிறை, கொள்ளை, முக அவமானம் என்ற பட்டியலும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் “குற்றப்பழிக்கு உள்ளாகியிருக்கிறோம்” என்பது אַשְׁמָה-வின் ‘குற்றநிலை/guilt’ என்பதற்குப் பதிலாக வெளிப்புறப் பழி அல்லது குற்றச்சாட்டுக்கு ஆளாதலைக் குறிக்க வாய்ப்புள்ளது.
  naturalness: நடை பொதுவாக நவீனத் தமிழில் இயல்பாக உள்ளது. “பெரும் குற்றநிலையில் இருந்துவருகிறோம்” என்பது மூலத்தின் தொடர்ச்சியான குற்றநிலையையும் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
  terminology: ‘அக்கிரமங்கள்’ (עָוֹן) என்பதை ‘குற்றநிலை’ (אַשְׁמָה) என்பதிலிருந்து வேறுபடுத்துவது பொருத்தமானது. ‘ஆசாரியர்கள்,’ ‘ஒப்புக்கொடுக்கப்பட்டோம்,’ ‘முகக்கேடு’ ஆகியவை இவ்வசனத்தின் முறையான பதிவுக்குப் பொருந்துகின்றன.
  issues:
  - severity: medium
    issue: “பெரும் குற்றப்பழிக்கு உள்ளாகியிருக்கிறோம்”
    rationale: אַשְׁמָה என்பது முதன்மையாகப் பேச்சாளர்கள் இருக்கும் குற்றநிலையை/குற்றப்பழியைச் சுட்டுகிறது; “உள்ளாகியிருக்கிறோம்” என்பது அவர்கள் பிறரால் பழி சுமத்தப்படுவதுபோல் பொருள்படலாம். எனவே ‘பெரும் குற்றநிலையில் இருந்துவருகிறோம்’ என மாற்றுவது மூலத்தின் நிலைச்சொல்லையும் ‘மூதாதையரின் காலத்திலிருந்து ... இன்றுவரை’ என்ற தொடர்ச்சியையும் காக்கிறது.
  revised_text: எங்கள் மூதாதையரின் காலத்திலிருந்து இன்றுவரை நாங்கள் பெரும் குற்றநிலையில் இருந்துவருகிறோம். எங்கள் அக்கிரமங்களின் காரணமாக நாங்களும் எங்கள் அரசர்களும் எங்கள் ஆசாரியர்களும் பல நாடுகளின் அரசர்களுடைய கையில் ஒப்புக்கொடுக்கப்பட்டோம்—வாளுக்கும், சிறையிருப்புக்கும், கொள்ளைக்கும், முகக்கேட்டுக்கும்[a] ஆளானோம். இன்றும் நிலைமை அப்படியே இருக்கிறது.
  revised_footnotes:
  - marker: a
    text: அல்லது, “வெளிப்படையான அவமானத்துக்கும்” அல்லது “இழிவுக்கும்”; எபிரெயத்தில் நேரடியாக, “முகத்தின் வெட்கத்துக்கும்.”
    reason: בֹשֶׁת פָּנִים என்ற சொற்றொடரின் உருவகப் பொருளையும் இயல்பான தமிழ் மாற்றுகளையும் காட்டுகிறது.
  revision_rationale: முதல் வாக்கியத்தில் மட்டும் பாதுகாப்பான திருத்தம் செய்யப்பட்டுள்ளது. இது אַשְׁמָה-வின் குற்றநிலை என்ற பொருளைத் தெளிவாக்கி, עָוֹן-க்கான ‘அக்கிரமங்கள்’ என்ற சொல்லிலிருந்து வேறுபாட்டையும் பாதுகாக்கிறது. பிற சொற்கள், பட்டியல் அமைப்பு, மற்றும் அடிக்குறிப்பு மூலத்திற்கும் நவீன பொதுத்தமிழுக்கும் ஏற்றவையாக உள்ளன.
