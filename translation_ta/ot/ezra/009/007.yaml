  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: ta
  text: எங்கள் மூதாதையரின் காலத்திலிருந்து இன்றுவரை நாங்கள் பெரும் குற்றநிலையில் இருந்துவருகிறோம். எங்கள் அக்கிரமங்களின் காரணமாக நாங்களும் எங்கள் அரசர்களும் எங்கள் ஆசாரியர்களும் பல நாடுகளின் அரசர்களுடைய கையில் ஒப்புக்கொடுக்கப்பட்டோம்—வாளுக்கும், சிறையிருப்புக்கும், கொள்ளைக்கும், முகக்கேட்டுக்கும்[a] ஆளானோம். இன்றும் நிலைமை அப்படியே இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளிப்படையான அவமானத்துக்கும்” அல்லது “இழிவுக்கும்”; எபிரெயத்தில் நேரடியாக, “முகத்தின் வெட்கத்துக்கும்.”
    reason: בֹשֶׁת פָּנִים என்ற சொற்றொடரின் உருவகப் பொருளையும் இயல்பான தமிழ் மாற்றுகளையும் காட்டுகிறது.
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: எங்கள் மூதாதையரின் காலத்திலிருந்து
  rationale: מִן தொடக்கக் காலத்தைக் குறிக்கிறது; אֲבֹתֵינוּ இங்கு தனிப்பட்ட தந்தையரை மட்டுமல்ல, முந்தைய தலைமுறையினரையும் குறிக்கும் என்பதால் ‘மூதாதையர்’ இயல்பானது.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: நாங்கள் பெரும் குற்றப்பழிக்கு உள்ளாகியிருக்கிறோம்
  rationale: אַשְׁמָה வெறும் வெட்க உணர்வை அல்ல, உண்மையான குற்றநிலையைக் குறிக்கிறது. ‘உள்ளாகியிருக்கிறோம்’ என்பது மூதாதையரின் காலத்திலிருந்து இன்றுவரை தொடரும் நிலையை வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கடந்த காலத்திலிருந்து பேச்சாளரின் நிகழ்காலம் வரை தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: எங்கள் அக்கிரமங்களின் காரணமாக
  rationale: בְּ இங்கு காரணத்தைக் குறிக்கிறது; עָוֹן என்பதை ‘அக்கிரமங்கள்’ என்று மொழிபெயர்ப்பது אַשְׁמָה என்பதற்குப் பயன்படுத்திய ‘குற்றப்பழி’யிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: נִתַּנּוּ
  choice: ஒப்புக்கொடுக்கப்பட்டோம்
  rationale: נָתַן என்பதன் நிஃபால் வடிவம் செயப்பாட்டு பொருளுடையது. பகை அரசர்களின் அதிகாரத்துக்குள் கொடுக்கப்பட்டதைக் ‘ஒப்புக்கொடுக்கப்பட்டோம்’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: ஒருவரின் அதிகாரத்துக்குள் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: பல நாடுகளின் அரசர்கள்
  rationale: אֲרָצוֹת என்பது இச்சூழலில் முழு பூமியை அல்ல, பல்வேறு பிற நாடுகளைச் சுட்டுகிறது. தமிழில் எண்ணிக்கையற்ற பன்மையை இயல்பாகக் காட்ட ‘பல’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּחֶרֶב
  choice: வாளுக்கு
  rationale: போர் மூலமான கொலையையும் அழிவையும் குறிக்கும் தீர்ப்புச் சொல்லாட்சியைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בַּשְּׁבִי
  choice: சிறையிருப்புக்கு
  rationale: שְׁבִי சிறைபிடிக்கப்பட்ட நிலையைக் குறிக்கிறது; ‘நாடுகடத்தல்’ என்று குறுக்காமல் அதன் விரிந்த பொருளைக் காக்கிறது.
- source_word: וּבַבִּזָּה
  choice: கொள்ளைக்கு
  rationale: பகைவரால் பொருட்கள் சூறையாடப்படுவதை நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: முகக்கேட்டுக்கு
  rationale: சொல்லுக்கு சொல் ‘முகத்தின் வெட்கம்’ என்ற உருவகத்தையும் பொதுமக்கள் புரிந்துகொள்ளும் வெளிப்படையான அவமானம் என்ற பொருளையும் ‘முகக்கேடு’ இயல்பாக இணைக்கிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: இன்றும் நிலைமை அப்படியே இருக்கிறது
  rationale: முன் விவரிக்கப்பட்ட தீர்ப்பின் விளைவுகள் அன்றைய நிகழ்காலத்திலும் காணப்படுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אַשְׁמָה மற்றும் עָוֹן ஆகிய அறநெறி சார்ந்த சொற்களின் வேறுபாடு
  choice: אַשְׁמָה என்பதை ‘குற்றப்பழி’ என்றும் עָוֹן என்பதை ‘அக்கிரமங்கள்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் பொதுவாக ‘பாவம்’ என்று மொழிபெயர்த்தல்
  rationale: குற்றநிலையையும் அதற்குக் காரணமான அக்கிரமங்களையும் வசனம் அடுக்கிக் கூறுகிறது. அவற்றை வேறுபடுத்துவது மூலத்தின் ஒப்புதல் மொழியிலுள்ள நுணுக்கத்தைப் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டுப் பொருள் புகுத்தப்படவில்லை.
- issue: கூட்டுப் பொறுப்புணர்வுடன் செய்யப்படும் பாவ அறிக்கை
  choice: ‘நாங்களும் எங்கள் அரசர்களும் எங்கள் ஆசாரியர்களும்’ என்ற கூட்டுச் சேர்க்கையைத் தக்கவைத்தல்
  alternative: தலைவர்களின் குற்றத்தை மட்டும் முன்னிறுத்தும் வகையில் வாக்கியத்தை மாற்றியமைத்தல்
  rationale: எபிரெய உரை சமூகத்தையும் அதன் அரசர்களையும் ஆசாரியர்களையும் ஒன்றாகத் தீர்ப்புக்குள் சேர்க்கிறது. இந்த வரலாற்று மற்றும் இறையியல் பதற்றம் மென்மைப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளையில் பாவ அறிக்கைக்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மூதாதையர்,’ ‘அக்கிரமங்கள்,’ ‘ஆசாரியர்கள்’ ஆகியவை வேதாகமச் சூழலுக்குப் பொருத்தமான முறையான சொற்கள்; அரிதான பழந்தமிழ் நடை தவிர்க்கப்பட்டுள்ளது.
