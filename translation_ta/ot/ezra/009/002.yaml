base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் தங்களுக்காகவும் தங்கள் மகன்களுக்காகவும் அந்த மக்களுடைய மகள்களில் சிலரை எடுத்துக்கொண்டார்கள்[a]. மேலும், பரிசுத்த சந்ததி[b] தேசங்களின் மக்களோடு கலந்துவிட்டது. இந்த நம்பிக்கைத் துரோகத்தில் அதிகாரிகளும் துணை ஆளுநர்களுமே முன்னின்றார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மக்களுடைய மகள்களில் சிலரைத் திருமணம் செய்துகொண்டார்கள்.” எபிரெயில் சொல்லுக்கு சொல், “அவர்களுடைய மகள்களிலிருந்து எடுத்துக்கொண்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “பரிசுத்த சந்ததி” என்பதை “பரிசுத்த வம்சம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உடன்படிக்கைச் சமூகத்தின் வம்சத் தொடரைக் குறிக்கும் சொல்லாட்சியைப் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் சொல்லுக்கு சொல், “இந்த நம்பிக்கைத் துரோகத்தில் அதிகாரிகள் மற்றும் துணை ஆளுநர்களின் கை முதலாவதாக இருந்தது”; அதாவது, அவர்களே இதில் முன்னிலை வகித்து முதன்மைப் பொறுப்பு ஏற்றார்கள்.
    reason: idiom
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: அந்த மக்களுடைய மகள்களில் சிலரை எடுத்துக்கொண்டார்கள்
  rationale: נשא என்பதன் அடிப்படைச் சொல்லாட்சியை ‘எடுத்துக்கொண்டார்கள்’ எனத் தக்கவைத்தாலும், சூழல் இது திருமணத்தைக் குறிக்கிறது என்பதைத் தெளிவாக்க அடிக்குறிப்பு தரப்படுகிறது. מן என்பதன் பகுதியைக் குறிக்கும் பொருள் ‘மகள்களில் சிலரை’ என்பதால் வெளிப்படுகிறது.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: தங்களுக்காகவும் தங்கள் மகன்களுக்காகவும்
  rationale: לְ முன்னொட்டு பயனாளி அல்லது பெறுநரைக் குறிக்கிறது; இரண்டு தலைமுறையினரும் இத்திருமணங்களில் ஈடுபட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהִתְעָרְבוּ
  choice: கலந்துவிட்டது
  rationale: התערב என்பதன் பரஸ்பர/தன்னிலை கலப்பு உணர்வைத் தருகிறது; ஒருமை எழுவாயான ‘சந்ததி’க்கு ஏற்ப ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: பரிசுத்த சந்ததி
  rationale: זרע இங்கு வம்சத் தொடரையும் உடன்படிக்கைச் சமூகத்தையும் குறிக்கிறது. தமிழில் ‘வித்து’ உயிரியல் பொருளை மிகுதியாகத் தூண்டக்கூடும் என்பதால், சொல்லாட்சியின் வம்ச வழிப் பொருளைக் காக்க ‘சந்ததி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: தேசங்களின் மக்களோடு
  rationale: பலவினையான ארצות-ஐ ‘தேசங்கள்’ எனவும், கலப்பைச் சுட்டும் בְ-ஐ இயல்பான தமிழில் ‘மக்களோடு’ எனவும் வழங்குகிறது.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: அதிகாரிகளும் துணை ஆளுநர்களும்
  rationale: இரு நிர்வாகத் தலைமைக் குழுக்களின் வேறுபாட்டை நவீன வாசகருக்குப் புரியும் வகையில் தருகிறது; அரச குமாரர்கள் என்ற தேவையற்ற முடியாட்சி அர்த்தத்தைத் தவிர்க்கிறது.
- source_word: מַּעַל
  choice: நம்பிக்கைத் துரோகம்
  rationale: מעל என்பது சாதாரண மீறலைவிட ஒப்பந்த அல்லது உடன்படிக்கை விசுவாசத்தை மீறுவதைக் குறிக்கிறது; ‘நம்பிக்கைத் துரோகம்’ அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: וְיַד ... הָיְתָה ... רִאשׁוֹנָה
  choice: அதிகாரிகளும் துணை ஆளுநர்களுமே முன்னின்றார்கள்
  rationale: எபிரெய ‘கை’ என்ற செயற்பாட்டு மரபுத்தொடரையும் ‘முதலில்/முன்னிலையில்’ என்ற பொறுப்பையும் சொற்சொறாகக் கொடுத்தால் தமிழ் இயல்பிழக்கும். ‘முன்னின்றார்கள்’ அவர்கள் முதன்மைப் பொறுப்பு வகித்ததைக் காட்டுகிறது.
theological_decisions:
- issue: கலப்புத் திருமணச் சூழலில் ‘பரிசுத்த சந்ததி’ என்பதன் பொருள்
  choice: உடன்படிக்கைச் சமூகத்தின் வம்சத் தொடரைக் குறிக்கும் ‘பரிசுத்த சந்ததி’ என வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘பரிசுத்த வித்து’ எனச் சொற்சொறாக மொழிபெயர்த்தல் அல்லது இனத் தூய்மை பற்றிய விளக்கமாக விரித்துரைத்தல்
  rationale: மூலத்தின் வலுவான வம்ச/உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்க வேண்டும்; அதேவேளை பிற்கால இனவாத வகைப்பாடுகளை வசனத்திற்குள் இறக்குமதி செய்யக்கூடாது.
- issue: தலைவர்களின் குற்றப்பொறுப்பு
  choice: ‘அதிகாரிகளும் துணை ஆளுநர்களுமே முன்னின்றார்கள்’ என முதன்மைப் பொறுப்பைத் தெளிவாக்குதல்
  alternative: ‘அவர்களுடைய கை முதலாவதாக இருந்தது’ என எபிரெய மரபுத்தொடரைச் சொற்சொறாக வைத்தல்
  rationale: மூல மரபுத்தொடரின் கருத்து செயற்பாட்டிலும் குற்றத்திலும் தலைவர்கள் முன்னிலை வகித்தார்கள் என்பதாகும்; இயல்பான தமிழில் அதைத் தெளிவாகச் சொல்வது பொருத்தமான சமநிலை மொழிபெயர்ப்பு.
- issue: וְ இணைப்பின் உறவு
  choice: தமிழில் இயல்பாக விளைவை இணைக்கும் ‘இவ்வாறு’ பயன்படுத்துதல்
  alternative: ‘மேலும்’ அல்லது ‘அதனால்’
  rationale: எபிரெய வாவ் பொதுவான இணைப்பைத் தருகிறது. ‘இவ்வாறு’ முன் கூறிய திருமணங்களுக்கும் பின் கூறும் கலப்புக்கும் உள்ள சூழல்சார் விளைவு உறவைத் தெரிவிக்கிறது; திட்டமிட்ட நோக்கத்தைச் சுட்டும் ‘அதற்காக’ போன்ற மொழியைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பரிசுத்த’, ‘சந்ததி’, ‘நம்பிக்கைத் துரோகம்’ ஆகியவை வேதாகமச் சூழலின் உடன்படிக்கைத் தொனியைத் தக்கவைக்கின்றன. எபிரெய மரபுத்தொடரான ‘கை முதலாவதாக இருந்தது’ முதன்மை உரையில் இயல்பான தமிழாக்கமாகவும், அடிக்குறிப்பில் அதன் சொற்சொல் வடிவத்துடனும் தரப்பட்டுள்ளது.
