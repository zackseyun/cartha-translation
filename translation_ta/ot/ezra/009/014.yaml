source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: ta
  text: நாங்கள் மீண்டும் உமது கட்டளைகளை மீறி, இந்த அருவருப்பான செயல்களைச் செய்யும் மக்களோடு திருமண உறவு கொள்வோமா?[a] எங்களில் மீதமிருப்பவரோ தப்பிப்பிழைத்தவரோ எவரும் இல்லாதபடி எங்களை முற்றிலும் அழிக்கும்வரை நீர் எங்கள்மீது கோபம் கொள்ள மாட்டீரா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “இந்த அருவருப்புகளின் மக்களோடு.” இச்சொற்றொடர், இத்தகைய அருவருப்பான செயல்களால் அடையாளப்படுத்தப்பட்ட மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மீதமிருப்பவரோ தப்பியவரோ இல்லாதபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: நாங்கள் மீண்டும் ... கொள்வோமா?
  rationale: שוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’; தொடர்ந்து வரும் வினைகளுடன் இது முந்தைய கீழ்ப்படியாமையை மீண்டும் செய்வதைக் குறிக்கிறது. தமிழில் ‘மீண்டும்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: לְהָפֵר
  choice: மீறி
  rationale: உடன்படிக்கை அல்லது சட்டச் சூழலில் הפר என்பது கட்டளையை மீறுதல் அல்லது உடைத்தல். ‘மீறுதல்’ நவீனத் தமிழில் இயல்பும் துல்லியமும் உடையது.
- source_word: מִצְוֺתֶיךָ
  choice: உமது கட்டளைகளை
  rationale: பன்மைச் சொல்லும் இரண்டாம் நபர் ஒருமை உரிமை விகுதியும் நேரடியாகக் கடவுளை நோக்குகின்றன; ‘உமது’ ஜெபத்திற்கேற்ற கண்ணியமான நடை.
- source_word: וּלְהִתְחַתֵּן
  choice: திருமண உறவு கொள்வோமா
  rationale: חתן என்பதன் ஹித்பயேல் வடிவம் வேறொரு குழுவுடன் திருமண வழி உறவுக்குள் நுழைவதைக் குறிக்கிறது. இச்சொற்றொடர் தனிப்பட்ட திருமணத்தையும் குழுக்களுக்கிடையிலான மண உறவையும் உள்ளடக்குகிறது.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: இந்த அருவருப்பான செயல்களைச் செய்யும் மக்களோடு
  rationale: எபிரெயக் கட்டமைப்பு சொற்படி ‘இந்த அருவருப்புகளின் மக்கள்’ என்று சுருக்கமாக உள்ளது. சூழலில் மக்களை அவர்களின் செயல்களோடு தொடர்புபடுத்துவதாகப் புரிந்துகொண்டு, இனத்தையே இயல்பாக அருவருப்பானது என்று கூறாத வகையில் பொருள் தெளிவாக்கப்பட்டது.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: நீர் எங்கள்மேல் கோபங்கொள்ள மாட்டீரா?
  rationale: אנף கடும் கோபத்தைக் குறிக்கிறது; எதிர்பார்க்கப்படும் உறுதிப்பாட்டைக் கொண்ட சொல்லாட்சிக் கேள்வியைத் தமிழில் இவ்வடிவம் காக்கிறது.
- source_word: עַד כַּלֵּה
  choice: எங்களை முற்றிலும் அழிக்கும்வரை
  rationale: כלה இங்கு முடிவுக்குக் கொண்டுவருதல் அல்லது முழுமையாக அழித்தல் என்ற வலிமையான பொருளுடையது. வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலிருந்து தமிழில் இயல்புக்காக வழங்கப்பட்டுள்ளது.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: எங்களில் மீதியானவரோ தப்பிப்பிழைத்தவரோ எவரும் இல்லாதபடி
  rationale: לְאֵין முழு அழிவின் விளைவாக எதுவும் அல்லது எவரும் எஞ்சாததைக் குறிக்கிறது. שְׁאֵרִית மற்றும் פְלֵיטָה ஆகிய இணைச் சொற்களின் வேறுபாடு ‘மீதியானவர்’ மற்றும் ‘தப்பிப்பிழைத்தவர்’ எனக் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘அருவருப்புகள்’ என்பதற்கும் சுற்றியுள்ள மக்களுக்கும் உள்ள தொடர்பு
  choice: அந்த மக்களை அருவருப்பான செயல்களைச் செய்பவர்களாகக் குறிப்பிடுதல்
  alternative: ‘இந்த அருவருப்புகளின் மக்களோடு’
  rationale: எபிரெயில் உள்ள இணைப்புக் கட்டமைப்பு சுருக்கமாகவும் ஓரளவு தெளிவின்மையுடனும் உள்ளது. சூழல் தடைசெய்யப்பட்ட சமய-ஒழுக்க நடைமுறைகளை மையப்படுத்துவதால், இனத்தை இயல்பாக இழிவுபடுத்தாமல் செயல்களுடனான தொடர்பை முதன்மை உரையில் தெளிவாக்கி, சொற்படியான வடிவத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
- issue: שְׁאֵרִית மற்றும் פְלֵיטָה ஆகிய இரட்டைச் சொல்லாட்சி
  choice: ‘மீதியானவர்’ மற்றும் ‘தப்பிப்பிழைத்தவர்’ என்ற இரு கருத்துகளையும் காத்தல்
  alternative: ‘ஒருவரும் எஞ்சாதபடி’ என்று ஒரே பொதுச்சொல்லாகச் சுருக்குதல்
  rationale: நியாயத்தீர்ப்புக்குப் பின்பும் மீந்திருப்போர் மற்றும் தப்பியோர் என்ற வேதாகமத் தொடர்புகளை இந்த இணைச்சொற்கள் சுமக்கின்றன; ஆகவே இரண்டும் தனித்தனியாக மொழிபெயர்க்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான ‘உமது/நீர்’ நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய சொல்லாட்சிக் கேள்வி தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், காரண-விளைவும் கேள்வியின் வலிமையும் காக்கப்பட்டுள்ளன. அடிக்குறி குறியீடுகள் தொடர்புடைய முதன்மை உரைப் பகுதிகளிலேயே இடம்பெற்றுள்ளன.
