  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: ta
  text: மாலை காணிக்கையின்போது[a], நான் என் உபவாசத்திலிருந்து எழுந்தேன். என் உடையும் மேலங்கியும் கிழிந்திருந்த நிலையில், நான் முழங்கால்படியிட்டு, என் கடவுளாகிய யாவேவை நோக்கி என் கைகளை விரித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் குறிப்பாக, “மாலைத் தானியக் காணிக்கையின்போது.” எபிரெயச் சொல் பல இடங்களில் தானியக் காணிக்கையைக் குறிக்கிறது; இங்கு அது பொதுவாக மாலை காணிக்கையின் நேரத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: மாலை நேரக் காணிக்கையின் வேளையில்
  rationale: מִנְחָה என்பது பொதுவாகக் காணிக்கையையும், வழிபாட்டுச் சூழலில் குறிப்பாகத் தானியக் காணிக்கையையும் குறிக்கலாம். இங்கு மாலைப் பலி செலுத்தப்பட்ட நேரத்தையும் விரிவாகச் சுட்டக்கூடும் என்பதால், முதன்மை உரையில் பொதுவான ‘காணிக்கை’ பயன்படுத்தப்பட்டு, குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: நான் என் உபவாசத்திலிருந்து எழுந்தேன்
  rationale: קום என்பதன் எழுதல் என்ற இயக்கத்தையும், תַּעֲנִית என்பதன் இச்சூழலுக்குரிய உபவாசம் என்ற நேரடிப் பொருளையும் பாதுகாக்கிறது. இது உபவாசத்தை அப்போது முடித்தார் என்று அவசியமாகக் கூறாமல், உபவாசத்துடன் சேர்ந்திருந்த துக்கநிலையிலிருந்து அவர் எழுந்ததைக் காட்டுகிறது.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: என் உடையும் மேலங்கியும் கிழிந்திருந்த நிலையில்
  rationale: בֶּגֶד மற்றும் מְעִיל ஆகிய இரு ஆடைச் சொற்களுக்கிடையிலான வேறுபாட்டை ‘உடை’, ‘மேலங்கி’ என்று காக்கிறது. எபிரெய வடிவம் உடைகள் கிழிந்திருந்தது உடன்நிகழும் சூழ்நிலை என்பதை உணர்த்துவதால், இயல்பான தமிழில் நிலைமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: நான் முழங்காலில் விழுந்து
  rationale: כרע என்பது குனிதல் அல்லது முழங்கால்படியிடுதலைக் குறிக்கிறது; ‘முழங்காலில் விழுந்து’ என்பது உணர்ச்சிமிக்க ஜெபச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: என் கைகளை விரித்தேன்
  rationale: פרשׂ உடன் כף வருவது ஜெபத்தில் கைகளையோ உள்ளங்கைகளையோ திறந்து நீட்டும் செயலைக் குறிக்கிறது. ‘கைகளை விரித்தேன்’ என்பது உருவகத்தைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: என் கடவுளாகிய யாவேவை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை ‘நோக்கி’ வெளிப்படுத்துகிறது; אֱלֹהָי என்பது ‘என் கடவுள்.’ יהוה என்ற தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலியமைப்பைத் தமிழில் தருகிறது; பட்டப்பெயராக மாற்றாமல் உடன்படிக்கையின் பெயரைப் பாதுகாக்கிறது.
- issue: מִתַּעֲנִיתִי என்பது உபவாசமா அல்லது தன்னைத் தாழ்த்துதல்/வருத்துதலா
  choice: என் உபவாசத்திலிருந்து
  alternative: என் தன்னைத் தாழ்த்துதலிலிருந்து; என் வருத்த நிலையிலிருந்து
  rationale: இந்தப் பெயர்ச்சொல் தன்னை வருத்துதல் அல்லது தாழ்த்துதல் என்ற பரந்த பின்னணியைக் கொண்டிருந்தாலும், இச்சூழலில் அதன் வழக்கமான நடைமுறைப் பொருள் உபவாசம். இருப்பினும், ‘எழுந்தேன்’ என்பது உபவாசத்தை முறித்தார் எனத் தெளிவாகச் சொல்லாதவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு மரியாதையும் துக்கத்தின் உணர்ச்சித் தீவிரமும் காக்கப்பட்டுள்ளன. ‘உடை/மேலங்கி’ என்ற வேறுபாடு பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மாலை நேரக் காணிக்கை’ என்ற சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
