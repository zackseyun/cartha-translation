revisions:
- from: இஸ்ரவேலின் கடவுளாகிய யாவே, நீர் நீதியுள்ளவர். ஏனெனில், இன்றிருப்பதுபோல, தப்பிப் பிழைத்த எஞ்சியோராக நாங்கள் விடப்பட்டிருக்கிறோம்.[a] இதோ, எங்கள் குற்றத்தோடு உமக்கு முன்பாக நிற்கிறோம். இதன் காரணமாக உமக்கு முன்பாக நிலைநிற்க இயலாது.[b]
  to: இஸ்ரவேலின் கடவுளாகிய யாவே, நீர் நீதியுள்ளவர். ஏனெனில், இன்றுவரை தப்பிப் பிழைத்த எஞ்சியவர்களாக நாங்கள் விடப்பட்டிருக்கிறோம்.[a] இதோ, எங்கள் குற்றத்தோடு உமக்கு முன்பாக நிற்கிறோம். இதன் காரணமாக உமக்கு முன்பாக யாரும் நிலைநிற்க முடியாது.[b]
