base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே, நீர் நீதியுள்ளவர். ஏனெனில், இன்றுவரை தப்பிப் பிழைத்த எஞ்சியவர்களாக நாங்கள் விடப்பட்டிருக்கிறோம்.[a] இதோ, எங்கள் குற்றத்தோடு உமக்கு முன்பாக நிற்கிறோம். இதன் காரணமாக உமக்கு முன்பாக யாரும் நிலைநிற்க முடியாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தப்பிப் பிழைத்த எஞ்சியவர்களாக’ என்பதை ‘தப்பிய சிலராக’ அல்லது ‘உயிர்தப்பியவர்களாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘இதன் காரணமாக உமக்கு முன்பாக நிற்றல் இல்லை’; குற்றநிலையில் கடவுளின் முன்னிலையில் நிலைத்திருக்க அல்லது தாங்கி நிற்க இயலாததைக் குறிக்கும் சொற்றொடர்.
    reason: idiom_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவப்பெயரான நான்கு மெய்யெழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: צַדִּיק
  choice: நீதியுள்ளவர்
  rationale: இங்கு கடவுளின் ஒழுக்க மற்றும் நியாயத்தீர்ப்பு சார்ந்த நேர்மையைச் சுட்டுகிறது; ‘நியாயமானவர்’ என்பதைக் காட்டிலும் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: נִשְׁאַרְנוּ
  choice: நாங்கள் விடப்பட்டிருக்கிறோம்
  rationale: நிஃபால் வடிவிலுள்ள செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: פְלֵיטָה
  choice: தப்பிப் பிழைத்த எஞ்சியோர்
  rationale: நியாயத்தீர்ப்பிலிருந்து தப்பி எஞ்சிய மக்களைச் சுட்டும் சொல்லின் இரு நுணுக்கங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: இன்றிருப்பதுபோல
  rationale: பேசப்படும் நாளில் கண்முன் நிலவும் சூழலைக் குறிக்கும் எபிரேய காலச் சொற்றொடரைச் சுருக்கமாக வழங்குகிறது.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: இதோ, உமக்கு முன்பாக நிற்கிறோம்
  rationale: הִנְנוּ என்பதன் நிகழ்நிலைச் சுட்டுதலையும், கடவுளின் முன்னிலையில் இருப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: எங்கள் குற்றத்தோடு
  rationale: மக்கள் தங்கள் குற்றநிலையிலேயே கடவுளுக்கு முன் இருப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: இதன் காரணமாக உமக்கு முன்பாக நிலைநிற்க இயலாது
  rationale: כִּי என்பதன் காரணவிளக்கத் தொடர்பையும், எபிரேய மொழியின் ஆளற்ற ‘நிற்றல் இல்லை’ என்ற அமைப்பையும் இயன்றவரை காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தேவப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: கடவுள் ‘நீதியுள்ளவர்’ என்பதன் பொருள்
  choice: நீதியுள்ளவர்
  alternative: நியாயமானவர்
  rationale: வசனம் கடவுளின் நீதியைத் தண்டனைக்கு மட்டும் குறுக்கவில்லை; நியாயத்தீர்ப்பும் எஞ்சியோரை விட்டுவைத்த இரக்கமும் இணைந்துள்ள பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
- issue: אֵין לַעֲמוֹד என்பதன் எழுவாய்
  choice: நிலைநிற்க இயலாது
  alternative: ஒருவராலும் நிலைநிற்க இயலாது
  rationale: மூல எபிரேயத்தில் வெளிப்படையான ‘நாங்கள்’ அல்லது ‘ஒருவரும்’ என்ற எழுவாய் இல்லை. ஆளற்ற தமிழ் அமைப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இறைவேண்டல் நடையைக் கையாள்கிறது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளன; மிகப் பழமையான சொற்களும் குறிப்பிட்ட சமயப்பிரிவுக்கே உரிய கலைச்சொற்களும் தவிர்க்கப்பட்டுள்ளன.
