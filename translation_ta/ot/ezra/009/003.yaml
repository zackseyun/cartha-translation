translation_notes:
  register: நவீன தரநிலைத் தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் மொழியாக்கப்பட்டுள்ளது. தொடர்ச்சியான முதலாம் நபர் செயல்கள் இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் இணைக்கப்பட்டுள்ளன; מְשׁוֹמֵם என்பதின் தீவிரமான உணர்ச்சி ‘திகைத்துப்போய்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
