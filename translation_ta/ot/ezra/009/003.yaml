  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: ta
  text: இந்தச் செய்தியை நான் கேட்டவுடனே[a], என் உடையையும் மேலங்கியையும் கிழித்து, என் தலைமுடியிலிருந்தும் தாடியிலிருந்தும் சில முடிகளைப் பிடுங்கி[b], திகைத்துப்போய் உட்கார்ந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியத்தை நான் கேட்டபோது”.
    reason: lexical_alternative
  - marker: b
    text: உடைகளைக் கிழிப்பதும் முடியைப் பிடுங்குவதும் துயரம், பேரதிர்ச்சி அல்லது புலம்பலை வெளிப்படுத்திய அக்கால வழக்கங்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: நான் கேட்டவுடனே
  rationale: כְּ உடன் வரும் கேட்பதைக் குறிக்கும் வடிவம் காலத் தொடர்பைக் காட்டுகிறது; நிகழ்வைக் கேட்ட உடனேயான எதிர்வினையை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தச் செய்தி
  rationale: דָּבָר என்பதற்கு சொல், காரியம், செய்தி எனப் பரந்த பொருள் உண்டு. இங்கு எஸ்றாவிடம் தெரிவிக்கப்பட்ட நிலைமையைச் சுட்டுவதால் ‘செய்தி’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது; ‘இந்தக் காரியம்’ என்பதும் சாத்தியம்.
- source_word: קָרַעְתִּי
  choice: கிழித்து
  rationale: துயரம் அல்லது திகைப்பின் மரபுவழிச் செயலாக உடையைக் கிழிப்பதை நேரடியாகவும் கண்ணியமாகவும் குறிக்கிறது.
- source_word: בִּגְדִי
  choice: என் உடை
  rationale: בֶּגֶד என்பது பொதுவாக ஓர் உடை அல்லது ஆடையைக் குறிக்கும்; எபிரேய ஒருமையைத் தக்கவைக்க ‘உடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּמְעִילִי
  choice: மேலங்கி
  rationale: מְעִיל என்பது பொதுவாக வெளிப்புறத்தில் அணியும் அங்கி அல்லது மேலாடை; ‘மேலங்கி’ நவீன தமிழில் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וָאֶמְרְטָה
  choice: பிடுங்கிக்கொண்டு
  rationale: முடியை வலுக்கட்டாயமாகப் பறித்தெடுக்கும் செயலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: என் தலைமுடியிலும் தாடியிலும் கொஞ்சத்தை
  rationale: முடிக்கு முன் வரும் מִן பகுதியெடுக்கும் பொருளைக் கொண்டிருக்கலாம்; எல்லா முடியையும் அல்ல, அவற்றிலிருந்து ஒரு பகுதியைப் பிடுங்கியதாக ‘கொஞ்சத்தை’ வெளிப்படுத்துகிறது.
- source_word: וָאֵשְׁבָה
  choice: உட்கார்ந்தேன்
  rationale: செயல்களின் தொடரில் வரும் சாதாரண ‘உட்கார்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְשׁוֹמֵם
  choice: திகைத்துப்போய்
  rationale: அதிர்ச்சி, திகைப்பு, பேரச்சத்தால் செயலற்ற நிலை ஆகிய நிழற்பொருள்களைச் சூழலுக்கு ஏற்ற நவீன தமிழில் தருகிறது; வெறும் வியப்பாகக் குறைத்துவிடவில்லை.
