  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: ta
  text: இவையெல்லாம் முடிந்தபின், அதிகாரிகள் என்னிடம் வந்து, “இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும் பிற நாடுகளின் மக்களிடமிருந்து தங்களைப் பிரித்துக்கொள்ளவில்லை; அந்த மக்கள் கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர் ஆகியோர்; அவர்களுடைய அருவருப்பான பழக்கவழக்கங்களுக்கேற்ப அவர்கள் நடந்துகொள்கிறார்கள்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய அருவருப்புகளுக்கு ஏற்ப” என்றும் மொழிபெயர்க்கலாம். இச்சொல் வலிமையானது; வழிபாட்டிலும் அறநெறியிலும் அருவருக்கத்தக்க செயல்கள் அல்லது பழக்கவழக்கங்களைக் குறிக்க அடிக்கடி பயன்படுகிறது; சில சூழல்களில் சிலைவழிபாட்டுடனும் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: இவையெல்லாம் முடிந்தபோது
  rationale: וּ plus כְּ with the infinitive construct forms a temporal clause. This rendering naturally marks the sequence without adding an explicit ‘now.’
- source_word: נִגְּשׁוּ אֵלַי
  choice: என்னிடம் வந்து
  rationale: The Niphal of נגשׁ denotes approaching. ‘என்னிடம் வந்து’ is natural modern Tamil and retains movement toward Ezra.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שׂרים denotes governing leaders or officials in this Persian-period setting; ‘அதிகாரிகள்’ avoids the misleading hereditary sense of ‘princes.’
- source_word: לֹא נִבְדְּלוּ
  choice: தங்களைப் பிரித்துக்கொள்ளவில்லை
  rationale: This preserves the reflexive/separative force of the Niphal without specifying an unstated motive.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும்
  rationale: The three coordinated groups are all retained under the scope of the same accusation.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: பிற நாடுகளின் மக்களிடமிருந்து
  rationale: The plural peoples and lands is represented idiomatically in Tamil; ‘பிற’ clarifies that these are peoples outside Israel without limiting them to a merely geographical neighborhood.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: அவர்களுடைய அருவருப்பான செயல்களைப் பொறுத்தவரை
  rationale: This preserves the strong moral-religious force of תועבות and uses the כְּ phrase to qualify the sphere or respect in which separation had not occurred, without adding a second verb such as ‘followed.’
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர்
  rationale: The Hebrew singular gentilics designate ethnic groups; Tamil plural people-name forms convey that collective reference naturally.
theological_decisions:
- issue: תוֹעֵבוֹת என்ற உடன்படிக்கை சார்ந்த அறநெறி மற்றும் வழிபாட்டுச் சொல்லின் வலிமை
  choice: அருவருப்பான செயல்கள்
  alternative: வெறுக்கத்தக்க பழக்கவழக்கங்கள்; அருவருப்புகள்
  rationale: The choice retains the severe moral-religious judgment while remaining understandable in modern Tamil. The footnote preserves the more compact formal equivalent.
- issue: குற்றச்சாட்டின் கீழ் வரும் இஸ்ரவேலர் குழுக்களின் வரம்பு
  choice: இஸ்ரவேல் மக்கள், ஆசாரியர்கள், லேவியர்கள் ஆகிய மூன்று குழுக்களும் ஒரே வினைச்சொல்லின் கீழ் சேர்க்கப்படுகின்றனர்
  alternative: பொதுமக்கள் மட்டுமே முதன்மையாகக் குறிக்கப்படுகின்றனர்
  rationale: The Hebrew coordinates all three groups, so the translation does not narrow the accusation.
- issue: כְּתוֹעֲבֹתֵיהֶם என்பதன் தொடரியல் உறவு
  choice: பிரிவினை நிகழாத துறையை ‘அவர்களுடைய அருவருப்பான செயல்களைப் பொறுத்தவரை’ எனக் குறித்தல்
  alternative: அவர்கள் அருவருப்பான செயல்களைப் பின்பற்றினார்கள் என்று தனி வினைச்சொல் சேர்த்தல்
  rationale: The Hebrew permits comparison/conformity or respect, but contains no explicit verb meaning ‘follow.’ The rendering preserves that tension rather than converting the report into a more explicit claim.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதிகாரிகள்’ என்பது பாரசீகக் கால நிர்வாகச் சூழலுக்கு ஏற்றது. மூலத்தில் பட்டியல் ஒருமை இனப்பெயர்களால் அமைந்திருந்தாலும், தமிழில் மக்களினங்களைக் குறிக்கும் இயல்பான பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ஆலோசனை ஆங்கில உரையில் [a] குறி காலவாக்கியத்துக்குப் பின் இருந்தது; ஆனால் அதன் அடிக்குறிப்பு תועבות பற்றியது என்பதால், தமிழில் குறி அதற்குரிய ‘அருவருப்பான செயல்கள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
