  source_fidelity: 'வரைவில் உள்ள ‘அவர்களுடைய அருவருப்பான செயல்களைப் பொறுத்தவரை அவர்களிடமிருந்து’ என்ற தொடர் தமிழில் தெளிவற்றதாக உள்ளது: ‘அவர்களிடமிருந்து’ என்பது உடனடி முன்னிலைப் பெயரான செயல்களையா, பிறநாட்டு மக்களையா குறிக்கிறது என்பதும், எபிரெயத்தின் ‘மக்களிடமிருந்து’ மற்றும் ‘அவர்களுடைய அருவருப்புகளுக்கு ஏற்ப’ என்ற உறவும் மங்குகின்றன. பட்டியலிடப்பட்ட மக்களினங்களைத் தெளிவாக முன்னிலைப்படுத்தி, அடுத்துச் சொந்தப்பெயரால் அருவருப்பான பழக்கவழக்கங்களை இணைப்பது மூலத்தின் கட்டமைப்பையும் குற்றச்சாட்டின் வலிமையையும் காக்கிறது.'
  naturalness: திருத்தப்பட்ட உரை நவீன தரநிலைத் தமிழில் இயல்பாகவும் வாசிக்கச் சீராகவும் உள்ளது. ‘மக்களிடமிருந்து’ என்பதன் குறிப்பு தெளிவாகிறது; ‘அருவருப்பான பழக்கவழக்கங்களுக்கேற்ப’ என்பது எபிரெயச் சொல்லின் ஒப்புமை/ஒத்துப்போதல் உறவைத் தேவையற்ற தனி வினையாக மாற்றாமல் வெளிப்படுத்துகிறது.
