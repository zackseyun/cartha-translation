  revised_text: இவையெல்லாம் முடிந்தபின், அதிகாரிகள் என்னிடம் வந்து, “இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும் பிற நாடுகளின் மக்களிடமிருந்து தங்களைப் பிரித்துக்கொள்ளவில்லை; அந்த மக்கள் கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர் ஆகியோர்; அவர்களுடைய அருவருப்பான பழக்கவழக்கங்களுக்கேற்ப அவர்கள் நடந்துகொள்கிறார்கள்[a]” என்று சொன்னார்கள்.
