- from: இவையெல்லாம் முடிந்தபோது, அதிகாரிகள் என்னிடம் வந்து, “இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும், பிற நாடுகளின் மக்களுடைய அருவருப்பான செயல்களைப்[a] பொறுத்தவரை அவர்களிடமிருந்து தங்களைப் பிரித்துக்கொள்ளவில்லை. அந்த மக்கள் கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர் ஆகியோர்” என்று சொன்னார்கள்.
  to: இவையெல்லாம் முடிந்தபின், அதிகாரிகள் என்னிடம் வந்து, “இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும் பிற நாடுகளின் மக்களிடமிருந்து தங்களைப் பிரித்துக்கொள்ளவில்லை; அந்த மக்கள் கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர் ஆகியோர்; அவர்களுடைய அருவருப்பான பழக்கவழக்கங்களுக்கேற்ப அவர்கள் நடந்துகொள்கிறார்கள்[a]” என்று சொன்னார்கள்.
  rationale: 'வரைவின் தெளிவின்மையைத் தீர்க்கும் நோக்கில் உரை மறுசீரமைக்கப்பட்டது. ஆனால் மூலத்தில் இல்லாத ‘நடந்துகொள்கிறார்கள்’ என்ற தனி வினையைச் சேர்ப்பது பொருளை மிகைப்படுத்தும் என்பதால், பாதுகாப்பான திருத்தமாக அது ஏற்றதல்ல. எனவே இறுதி உரை மூலத்தின் ஒரே வினைச்சொல்லான ‘தங்களைப் பிரித்துக்கொள்ளவில்லை’ என்பதையே தக்கவைத்து, மக்களினப் பட்டியலையும் அருவருப்புகள் பற்றிய தகுதிப்பாட்டையும் அதனுடன் இணைக்க வேண்டும். பாதுகாப்பான முழுத் திருத்தம்: “இவையெல்லாம் முடிந்தபின், அதிகாரிகள் என்னிடம் வந்து, ‘இஸ்ரவேல் மக்களும் ஆசாரியர்களும் லேவியர்களும் பிற நாடுகளின் மக்களிடமிருந்து—கானானியர், ஏத்தியர், பெரிசியர், எபூசியர், அம்மோனியர், மோவாபியர், எகிப்தியர், எமோரியர் ஆகியோரிடமிருந்து—அவர்களுடைய அருவருப்பான பழக்கவழக்கங்களுக்கேற்ப தங்களைப் பிரித்துக்கொள்ளவில்லை[a]’ என்று சொன்னார்கள்.” அடிக்குறிப்பு மேலே கொடுக்கப்பட்டவாறே அமையும்.'
