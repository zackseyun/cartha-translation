  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: ta
  text: 'செருபாபேலுடன் வந்தவர்கள்: யேசுவா, நெகேமியா, செராயா, ரெயெலாயா[a], மொர்தெகாய், பில்சான், மிஸ்பார்[b], பிக்வாய், ரெகூம்[c], பானா. இஸ்ரவேல் மக்களைச் சேர்ந்த ஆண்களின் எண்ணிக்கை:[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நெகேமியா 7:7-இல் உள்ள இணைப் பட்டியலில், ‘ரெயெலாயா’ என்பதற்குப் பதிலாக ‘ராமியா’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: நெகேமியா 7:7-இல் உள்ள இணைப் பட்டியலில், ‘மிஸ்பார்’ என்பதற்குப் பதிலாக ‘மிஸ்பெரேத்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: c
    text: நெகேமியா 7:7-இல் உள்ள இணைப் பட்டியலில், ‘ரெகூம்’ என்பதற்குப் பதிலாக ‘நெகூம்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: d
    text: அடுத்த வசனத்தில் தரப்படும் மக்கள்தொகைக் கணக்கை இந்தச் சொற்றொடர் அறிமுகப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ
  choice: வந்தவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைத் தொடர்ந்து விளக்கும் தொடர்புச் சொற்றொடர். בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ காக்கப்படுகிறது; நாடுகடத்தலிலிருந்து ‘திரும்பிவந்தவர்கள்’ என்ற சூழல் சார்ந்த பொருள் வினைக்குள் சேர்க்கப்படவில்லை.
- source_word: עִם
  choice: உடன்
  rationale: உடன்வருதலையும் துணைநிலையையும் இயல்பாகக் குறிக்கும் தமிழ்ச் சொல்.
- source_word: זְרֻבָּבֶל
  choice: செருபாபேல்
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகக் காட்டும் பரவலான வடிவம்.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: இங்கு காணப்படும் எபிரேயப் பெயர்வடிவத்தை நேரடியாக ஒலிபெயர்க்கிறது; வேறு பெயர்வடிவமாக மாற்றப்படவில்லை.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: மசோரா உரையில் உள்ள பெயர்வடிவமே முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: רְעֵלָיָה
  choice: ரெயெலாயா
  rationale: மசோரா உரையின் பெயர்வடிவத்தை ஒலிக்கேற்ற தமிழில் தருகிறது; இணைப் பட்டியலிலுள்ள வேறுபட்ட வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִסְפָּר
  choice: மிஸ்பார்
  rationale: இங்கு இது ‘எண்ணிக்கை’ என்ற பொதுப்பெயர் அல்ல, ஒருவரின் பெயர். எனவே பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களைச் சேர்ந்த ஆண்களின் எண்ணிக்கை
  rationale: מִסְפַּר என்பதன் ‘எண்ணிக்கை’ என்ற பொருளையும், אַנְשֵׁי עַם יִשְׂרָאֵל என்பதன் உறவையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
