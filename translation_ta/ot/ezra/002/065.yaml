translation:
  language: ta
  text: அவர்களுடைய ஆண் அடிமைகளும் பெண் அடிமைகளும் கூடுதலாக 7,337 பேர் இருந்தனர்.[a] அவர்களிடம் ஆண் பாடகர்களும் பெண் பாடகர்களும் 200 பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் பணியாளர்களும் பெண் பணியாளர்களும்.” எபிரெயச் சொற்கள் பொதுவாக வீட்டுப் பணியாளர்களையும் குறிக்கலாம்; ஆனால் இந்தக் கணக்கெடுப்புச் சூழலில் அவர்களுடைய சார்புநிலையை ‘அடிமைகள்’ என்பது தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: தவிர
  rationale: முந்தைய மொத்த எண்ணிக்கையில் சேராத, கூடுதலான ஒரு பிரிவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עַבְדֵיהֶם
  choice: அவர்களுடைய ஆண் அடிமைகள்
  rationale: עבד என்பது சூழலுக்கேற்ப பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம்; பெண்பால் சொல்லுடன் இணைந்துள்ள இந்த மக்கள்தொகைக் கணக்கில் சார்புநிலையையும் பாலின வேறுபாட்டையும் தெளிவாகக் காட்ட ‘ஆண் அடிமைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַמְהֹתֵיהֶם
  choice: பெண் அடிமைகள்
  rationale: אָמָה என்பது பெண் அடிமை அல்லது வீட்டுப் பணிப்பெண்ணைக் குறிக்கலாம்; இணையான ஆண்பால் சொல்லுடனும் கணக்கெடுப்புச் சூழலிலும் இருப்பதால் ‘பெண் அடிமைகள்’ சமூக நிலையைக் கூடுதல் தெளிவுடன் பிரதிபலிக்கிறது.
- source_word: אֵלֶּה
  choice: இவர்கள் ... பேர்
  rationale: மனிதர்களின் எண்ணிக்கையைச் சொல்லும் இயல்பான நவீனத் தமிழ் அமைப்பாக எபிரெயச் சுட்டுப்பெயரும் மறைமுக வினையும் வழங்கப்பட்டுள்ளன.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337
  rationale: கணக்குப் பட்டியலில் வாசிப்பை எளிதாக்க இலக்கங்களில் தரப்பட்டு, மூலத்தின் துல்லியமான எண் காக்கப்பட்டுள்ளது.
- source_word: וְלָהֶם
  choice: அவர்களிடம் ... இருந்தனர்
  rationale: உடைமை அல்லது அவர்களோடு இருந்தவர்களைக் குறிக்கும் எபிரெய அமைப்பு, மனிதர்களைக் குறிக்கும் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: ஆண் பாடகர்களும் பெண் பாடகர்களும்
  rationale: மூலத்தில் தனித்தனியாகக் காணப்படும் ஆண்பால், பெண்பால் வடிவங்களைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מָאתָיִם
  choice: 200 பேர்
  rationale: கணக்குப் பட்டியலின் வாசிப்புத் தெளிவுக்காக இலக்கங்கள் பயன்படுத்தப்பட்டு, மனிதர்களைக் குறிப்பதை ‘பேர்’ தெளிவுபடுத்துகிறது.
