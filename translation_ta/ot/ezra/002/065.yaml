translation_notes:
  register: நவீன நிலையான தமிழில், கணக்குப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்’ என்ற நேரடியான சமூக-வரலாற்றுச் சொல் முதன்மை உரையில் வைக்கப்பட்டு, ‘பணியாளர்கள்’ என்ற பொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
