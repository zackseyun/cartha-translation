  terminology: ‘ஆண் அடிமைகள்’ and ‘பெண் அடிமைகள்’ are appropriate, historically direct renderings in this paired census context. The footnote responsibly preserves the broader ‘servants/household workers’ lexical possibility. ‘ஆண் பாடகர்கள்’ and ‘பெண் பாடகர்கள்’ preserve the explicit gender distinction in the Hebrew.
