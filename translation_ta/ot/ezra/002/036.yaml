  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: לְבֵית
  choice: குடும்பத்தைச் சேர்ந்தவர்கள்
  rationale: இங்குள்ள לְ முன்னொட்டுடன் கூடிய ‘வீடு/குடும்பம்’ என்பது குடும்ப அல்லது வம்சத் தொடர்பைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்படுகிறது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: மூல எபிரெய வடிவத்தை நெருக்கமாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு; தொடர்புடைய ‘யோசுவா’ என்ற பெயருடன் இதைச் சமப்படுத்தவில்லை.
