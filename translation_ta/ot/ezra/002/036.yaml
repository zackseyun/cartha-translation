  language: ta
  text: 'ஆசாரியர்கள்: யெதாயாவின் மகன்கள்[a], யேசுவாவின் குடும்பத்தைச் சேர்ந்தவர்கள்[b]—973 பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யெதாயாவின் சந்ததியினர்.’ எபிரெய மொழியில் சொற்சொல்லாக ‘யெதாயாவின் மகன்கள்’ என்று உள்ளது; இது வம்சப் பட்டியல்களில் வழக்கமாகப் பயன்படுத்தப்படும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘யேசுவா’ என்பது சிறையிருப்புக்குப் பிந்தைய காலத்தில் வழங்கப்பட்ட ஒரு நபர்ப் பெயர்; இது ‘யோசுவா’ என்ற பெயருடன் தொடர்புடையது.
    reason: cultural_note
