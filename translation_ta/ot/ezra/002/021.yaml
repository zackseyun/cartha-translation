  language: ta
  text: பெத்லகேமைச் சேர்ந்தவர்கள் நூற்று இருபத்து மூன்று பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: சேர்ந்தவர்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’ என்றாலும், இங்கு அதைத் தொடர்ந்து வருவது ஓர் ஊர்ப்பெயர்; எஸ்றாவின் குடிப்பட்டியல் சூழலில் அது அந்த ஊரைச் சேர்ந்த மக்களைக் குறிக்கிறது. ஆகவே இயல்பான நவீன தமிழில் ‘சேர்ந்தவர்கள்’ என்று வழங்கப்பட்டது.
- source_word: בֵית לָחֶם
  choice: பெத்லகேம்
  rationale: இந்த இடப்பெயர் தமிழில் வழக்கமாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டது; அதன் சொற்பொருளான ‘அப்பத்தின் வீடு’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: நூற்று இருபத்து மூன்று
  rationale: எபிரெய எண்ணிக்கை 123 என்பதைத் தெளிவாகவும் தமிழின் இயல்பான எண்ணமைப்பின்படியும் வழங்குகிறது.
