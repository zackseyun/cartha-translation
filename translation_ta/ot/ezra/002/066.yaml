translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. இரு கூறுகளிலும் உள்ள உரிமைப் பொருள் வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது; அரைப்புள்ளி இணையான எண்ணிக்கைப் பட்டியலைத் தெளிவாக்குகிறது.
