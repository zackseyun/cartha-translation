  yaml_path: translation/ot/ezra/002/066.yaml
  text: Their horses were seven hundred thirty-six; their mules, two hundred forty-five.
translation:
  language: ta
  text: அவர்களுடைய குதிரைகள் எழுநூற்று முப்பத்தாறு; அவர்களுடைய கோவேறு கழுதைகள் இருநூற்று நாற்பத்தைந்து.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: அவர்களுடைய குதிரைகள்
  rationale: סוּס என்பது ‘குதிரை’ என்று பொருள்படும்; பன்மை வடிவத்துடன் இணைந்த மூன்றாம் நபர் ஆண்பால் பன்மை உரிமை விகுதி, ‘அவர்களுடைய குதிரைகள்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: எழுநூற்று முப்பத்தாறு
  rationale: எபிரெய எண் தொடர் 736 என்ற மொத்த எண்ணை நேரடியாகக் குறிக்கிறது; இது தமிழில் இயல்பான எண்ணுருவாக்கம்.
- source_word: פִּרְדֵיהֶם
  choice: அவர்களுடைய கோவேறு கழுதைகள்
  rationale: פֶּרֶד என்பது குதிரைக்கும் கழுதைக்கும் பிறந்த கலப்பின விலங்கான ‘கோவேறு கழுதை’யைக் குறிக்கிறது; பன்மை உரிமை விகுதியும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: இருநூற்று நாற்பத்தைந்து
  rationale: எபிரெய எண் தொடர் 245 என்ற மொத்த எண்ணைத் தெளிவாகக் குறிக்கிறது; தமிழ் நடைமுறைக்கேற்ற இயல்பான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
