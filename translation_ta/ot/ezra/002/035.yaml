lexical_decisions:
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் இணைப்புநிலைப் பன்மை வடிவம். இங்குள்ள மக்கள் கணக்குப் பட்டியல் சூழலில், ஒரு குலத்தையோ வம்சக் குழுவையோ குறிக்கிறது; எனவே நவீனத் தமிழில் தெளிவான ‘வழித்தோன்றல்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: סְנָאָה
  choice: செனாவா
  rationale: இது ஓர் இடப்பெயராகவோ குழுப்பெயராகவோ புரிந்துகொள்ளக்கூடிய இயற்பெயர். எபிரெய மெய்யெழுத்து வடிவத்தின் இறுதி ஒலியையும் பிரதிபலிக்கும் வகையில் ‘செனாவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 3,630 பேர்
  rationale: எபிரெய மொழியின் கூட்டல் முறையிலான எண்ணிக்கை ‘மூவாயிரத்து அறுநூற்று முப்பது’ என்பதைக் குறிக்கிறது. பட்டியலின் வாசிப்புத் தெளிவுக்காக இலக்கங்களிலும், கணக்கிடப்பட்ட மனிதர்களைக் காட்ட ‘பேர்’ என்பதுடனும் வழங்கப்பட்டது.
