translation:
  language: ta
  text: ஆதீனின் மகன்கள்[a] 454 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்கள்’ என்பது இங்கு ஆதீனின் நேரடி மகன்களை மட்டுமல்லாமல், அவருடைய குடும்பத்தை அல்லது வழிவந்தோரையும் குறிக்கலாம்.
    reason: בְּנֵי என்ற சொல்லின் நேரடிப் பொருளையும், திரும்பிவந்தோர் பட்டியலில் அதற்குள்ள விரிந்த குடும்ப/குலப் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எஸ்றாவின் திரும்பிவந்தோர் பட்டியலில் இது ஒரு குடும்ப அல்லது குலக் குழுவை அறிமுகப்படுத்துகிறது. ‘மகன்கள்’ என்பது எபிரெயச் சொல்லின் வடிவத்தையும் பட்டியலின் வம்சாவளி அமைப்பையும் காக்கிறது; இங்கு அது நேரடி மகன்களை மட்டுமல்லாமல் வழிவந்தோரையும் குறிக்கலாம்.
- source_word: עָדִין
  choice: ஆதீன்
  rationale: இது ஒரு நபரின் பெயர்; அதன் எபிரெய உச்சரிப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבַּע מֵאוֹת חֲמִשִּׁים וְאַרְבָּעָה
  choice: 454 பேர்
  rationale: எண்ணிக்கை துல்லியமாக 454. பட்டியல் நடையில் இயல்பாகவும் உடனடியாகப் புரியுமாறும் தமிழ் எண்களுக்குப் பதிலாக பொதுவாகப் பயன்படுத்தப்படும் இலக்கங்களும் மனிதர்களைக் குறிக்கும் ‘பேர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
