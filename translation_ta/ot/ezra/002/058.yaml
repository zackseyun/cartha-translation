  yaml_path: translation/ot/ezra/002/058.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: ta
  text: ஆலயப் பணியாளர்களும்[a] சாலொமோனின் பணியாளர்களின் மகன்களும் சேர்த்து முந்நூற்றுத் தொண்ணூற்றிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நெதினீம் (נְתִינִים); ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பினரைக் குறிக்கும் தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: அனைவரும் … மொத்தம்
  rationale: இரு குழுக்களையும் உள்ளடக்கிய முழு எண்ணிக்கையை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பைக் குறிக்கும் பிற்கால எபிரெயத் தொழில்நுட்பச் சொல்லின் பணியை நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது; மூலச்சொல்லின் சிறப்புப் பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבְנֵי
  choice: மகன்களும்
  rationale: குழு அல்லது வம்சப் பெயராக வரும் எபிரெய வடிவத்தை முறையாகப் பாதுகாக்கிறது; ‘சந்ததியினரும்’ என்பது சாத்தியமான பொருள் விளக்க மொழிபெயர்ப்பு.
- source_word: עַבְדֵי
  choice: பணியாளர்களுடைய
  rationale: עֶבֶד என்பதற்கு பணியாளர் அல்லது அடிமை என்ற இரு பொருள்களும் இருக்கலாம். இங்கு நிர்வாக/வம்சப் பட்டியலில் நிலையான குழுப் பெயராக வருவதால் ‘பணியாளர்கள்’ என்பது சூழலுக்கு ஏற்றது; அடிமைத்தன்மையை உரை வெளிப்படையாக முன்னிறுத்தவில்லை.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: முந்நூற்றுத் தொண்ணூற்றிரண்டு
  rationale: எபிரெய எண்ணை இயல்பான, செம்மையான தமிழ் எண்ணுருவில் நேரடியாக வழங்குகிறது.
