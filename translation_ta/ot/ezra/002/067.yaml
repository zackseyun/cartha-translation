lexical_decisions:
- source_word: גְּמַלֵּיהֶם
  choice: அவர்களுடைய ஒட்டகங்கள்
  rationale: גמל என்பதன் பன்மை வடிவத்துடன் மூன்றாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டு இணைந்திருப்பதால், உடைமையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אַרְבַּע מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: '435'
  rationale: எபிரெய எண்ணுத் தொடர் மொத்தம் 435 என்பதைக் குறிக்கிறது; பட்டியல் சூழலில் தெளிவுக்கும் எளிதான வாசிப்புக்கும் எண்களாகக் கொடுக்கப்பட்டது.
- source_word: חֲמֹרִים
  choice: கழுதைகள்
  rationale: חמור என்பதற்கான நேரடியான, நவீனத் தமிழில் பொதுவாகப் புரியும் பன்மைச் சொல்.
- source_word: שֵׁשֶׁת אֲלָפִים שְׁבַע מֵאוֹת וְעֶשְׂרִים
  choice: 6,720
  rationale: எபிரெய எண்ணுத் தொடர் மொத்தம் 6,720 என்பதைக் குறிக்கிறது; கணக்குப் பட்டியலின் நடை மற்றும் வாசிப்புத் தெளிவுக்காக எண்களாகக் கொடுக்கப்பட்டது.
