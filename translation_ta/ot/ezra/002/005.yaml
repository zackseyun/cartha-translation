  language: ta
  text: 'ஆராஹின் வழிவந்தவர்கள்: எழுநூற்று எழுபத்தைந்து பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இந்தக் கணக்குப் பட்டியலில் இச்சொல் ஒருவரின் நேரடி மகன்களை மட்டும் அல்லாமல், அவரிடமிருந்து வந்த குடும்ப அல்லது குலத்தினரைக் குறிக்கிறது. ஆகவே நவீனத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் ‘வழிவந்தவர்கள்’ என வழங்கப்பட்டது.
- source_word: אָרַח
  choice: ஆராகு
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது. உடைமைத் தொடர்பில் ‘ஆராகின்’ என வருகிறது.
- source_word: שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: எழுநூற்று எழுபத்தைந்து பேர்
  rationale: எபிரெய எண்ணிக்கை 700 + 5 + 70, அதாவது 775. பட்டியலின் இலக்கிய நடையைப் பேண எண்ணெழுத்துகளுக்குப் பதிலாகச் சொற்களால் தரப்பட்டு, மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
