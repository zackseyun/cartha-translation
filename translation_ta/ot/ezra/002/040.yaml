  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: ta
  text: 'லேவியர்கள்: யேசுவா மற்றும் கத்மியேலின் சந்ததியார், ஹோதவியாவின் சந்ததியாரில், எழுபத்து நான்கு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: குறிப்பிட்ட சமூகக் குழுவை அறிமுகப்படுத்தும் பட்டியல் தலைப்பாக இயல்பான, நேரடியான தமிழாக்கம்.
- source_word: בְּנֵי
  choice: மக்கள்
  rationale: வம்சாவளி மற்றும் கணக்கெடுப்புப் பட்டியல் சூழலில் குடும்பத்தார் அல்லது வழிவந்தோரைக் குறிக்கிறது; தமிழில் ‘மக்கள்’ என்பது மூலத்தின் வடிவத்தை ஓரளவு காத்து இயல்பாக உள்ளது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: சிறையிருப்புக்குப் பிந்தைய காலத்துக்குரிய எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: וְקַדְמִיאֵל
  choice: கத்மியேல்
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பெயர்; பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִבְנֵי
  choice: மக்களைச் சேர்ந்த
  rationale: யேசுவாவையும் கத்மியேலையும் ஓதவியாவின் குலத்துடன் இணைக்கும் வம்ச/வகைப்பாட்டு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹדַוְיָה
  choice: ஓதவியா
  rationale: மசோரா மூலத்தில் இவ்வசனத்தில் உள்ள பெயர்வடிவமே முதன்மைப் பனுவலில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: எழுபத்து நான்கு பேர்
  rationale: எண்ணிக்கையை நவீனத் தமிழில் இயல்பாகக் கூறி, நபர்களின் எண்ணிக்கை என்பதை ‘பேர்’ தெளிவுபடுத்துகிறது.
