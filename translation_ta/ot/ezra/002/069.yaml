source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: ta
  text: அவர்கள் தங்கள் திறனுக்கேற்ப பணிக்கான கருவூலத்திற்கு 61,000 தங்கத் தாரிக்குகளையும்[a], 5,000 மினா அளவு வெள்ளியையும்[b], ஆசாரியர்களுக்கான 100 அங்கிகளையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்க நாணயங்கள்’; எபிரேயச் சொல் குறிப்பாகப் பாரசீக தாரிக் நாணயங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மினா என்பது பண்டைய காலத்து எடை மற்றும் பண மதிப்பு அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: தங்கள் வசதிக்கேற்ப
  rationale: כְּ + כֹּחַ இங்கு அவரவர் கொடுக்கக்கூடிய அளவு அல்லது பொருளாதாரத் திறனுக்கு ஏற்ப என்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: மூலத்தின் பொதுவான ‘கொடு’ என்ற வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: ஆலயப் பணிக்கான கருவூலத்திற்கு
  rationale: אוֹצָר என்பது கருவூலம்; מְלָאכָה இச்சூழலில் ஆலயத்தை மீண்டும் கட்டும் பணியைக் குறிக்கிறது. ‘ஆலய’ என்பது சூழலால் தெளிவாகும் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: דַּרְכְּמוֹנִים
  choice: தங்க தாரிக்குகள்
  rationale: இது பாரசீகத் தங்க நாணயமான daric-ஐக் குறிக்கும் வரலாற்றுச் சிறப்புடைய சொல்; பொதுவான ‘நாணயங்கள்’ என்பதைவிடத் துல்லியமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000
  rationale: எபிரெய எண்ணிக்கை ‘ஆறு பத்தாயிரங்களும் ஓராயிரமும்’ என்பதற்கு நவீன எண் வடிவம்.
- source_word: מָנִים
  choice: மினா
  rationale: மָנֶה என்பது பண்டைய எடை மற்றும் பண மதிப்பு அலகு; துல்லியமற்ற நவீன அலகால் மாற்றாமல் வரலாற்று அலகே ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: பட்டியலில் தெளிவுக்காக நவீன எண் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: ஆசாரிய அங்கிகள்
  rationale: כָתְנֹת என்பது உடலில் அணியும் நீண்ட அங்கிகள் அல்லது மேலாடைகளைக் குறிக்கிறது; ‘அங்கிகள்’ என்பது ஆடைகளின் வகையை மிகப் பொதுமைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: מֵאָה
  choice: '100'
  rationale: மற்ற அளவுகளுடன் ஒத்த பட்டியல் நடைக்காக எண் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
