translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம வாசிப்புக்கேற்ற செறிவும் உள்ள நடை. வரலாற்று நாணய மற்றும் அளவுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன; எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
