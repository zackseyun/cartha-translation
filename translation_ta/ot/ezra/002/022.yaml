lexical_decisions:
- source_word: אַנְשֵׁי
  choice: சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் பன்மை இணைப்புவடிவம்; இந்தக் கணக்கெடுப்புப் பட்டியலில் ஓர் ஊரைச் சேர்ந்த ஆண் உறுப்பினர்களையோ குடும்பப் பிரதிநிதிகளையோ குறிக்கிறது. தமிழில் இடப்பெயருடன் இயல்பாக இணைவதற்காக ‘சேர்ந்த ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נְטֹפָה
  choice: நெத்தோபா
  rationale: இது ஓர் ஊரின் பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֲמִשִּׁים וְשִׁשָּׁה
  choice: ஐம்பத்தாறு
  rationale: எபிரெய எண்ணடுக்கு 56-ஐக் குறிக்கிறது. ‘ஐம்பதும் ஆறும்’ என்ற சொற்கூறு வடிவத்தைவிட ‘ஐம்பத்தாறு’ என்பது இன்றைய தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
