  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: ta
  text: ஆகவே ஆசாரியர்களும் லேவியர்களும் மக்களில் சிலரும் பாடகர்களும் வாயிற்காவலர்களும் ஆலயப் பணியாளர்களும்[a] தங்கள் நகரங்களில் குடியிருந்தார்கள்; இஸ்ரவேலர் அனைவரும் தங்கள் நகரங்களில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நெதினீம்’; ஆலயச் சேவைக்காக ஒதுக்கப்பட்ட ஒரு வகுப்பினரைக் குறிக்கும் சிறப்புப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישׁב இச்சூழலில் ஓர் இடத்தில் வசிக்கத் தொடங்கி அங்கே வாழ்வதைக் குறிக்கிறது. ‘குடியிருந்தார்கள்’ என்பது குடியேறுதல் மற்றும் தொடர்ந்து வசித்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: சிறையிருப்புக்குப் பிந்தைய ஆலயச் சூழலில் כהנים என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: ஆசாரியர்களிலிருந்து தனியே குறிப்பிடப்படும் லேவி கோத்திர ஆலயப் பணிக்குழுவைக் குறிக்கும் நிலையான பெயர்.
- source_word: וּמִן הָעָם
  choice: மக்களில் சிலர்
  rationale: מן இங்கு பகுதிப்பொருளில் வந்து, மக்களிலிருந்து ஒரு பகுதியினரைக் குறிக்கிறது; இந்த எபிரெய வழக்கை ‘மக்களில் சிலர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: ஆலயப் பணியில் பாடுவதற்காக நியமிக்கப்பட்டவர்களை நேரடியாகக் குறிக்கிறது.
- source_word: הַשּׁוֹעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாயில்களைக் காத்துப் பராமரித்த ஆலயப் பணியாளர்களைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: ஆலயச் சேவைக்காக ஒதுக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பினரைக் குறிக்கும் தொழில்நுட்பச் சொல்லின் செயல்பாட்டை நவீன வாசகருக்குத் தெளிவுபடுத்துகிறது; மூலப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעָרֵיהֶם
  choice: தங்கள் நகரங்களில்
  rationale: עיר என்பதையும் உடைமைப் பின்னொட்டையும் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: திரும்பிவந்த உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கும் கூட்டுப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵיהֶם
  choice: தங்கள் நகரங்களில் குடியிருந்தார்கள்
  rationale: இரண்டாம் தொடரில் எபிரெய மொழியில் விடுபட்டுள்ள முதன்மை வினைச்சொல் தமிழில் தெளிவுக்காக மீண்டும் வழங்கப்படுகிறது.
theological_decisions:
- issue: הַנְּתִינִים என்ற தொழில்நுட்பப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆலயப் பணியாளர்கள்
  alternative: நெதினீம்
  rationale: இது ஆலயச் சேவைக்காக ஒதுக்கப்பட்ட தனிப்பட்ட குழுவின் பெயர். ஒலிபெயர்ப்பை மட்டும் பயன்படுத்தாமல் அதன் பணியை முதன்மை உரையில் தெளிவாகக் கூறி, வரலாற்றுச் சிறப்புப் பெயரை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; இரண்டாம் கூறில் வினைச்சொல் இயல்பான தமிழுக்காக மீண்டும் சொல்லப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘ஆலயப் பணியாளர்கள்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
