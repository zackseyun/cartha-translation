lexical_decisions:
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: எஸ்றாவின் நாடு திரும்பியோர் பட்டியலில் இந்தச் சொல் ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் கூட்டுப் பொருளைத் தெளிவாகவும் தெரிவிக்க ‘வழித்தோன்றல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זַתּוּא
  choice: சத்தூ
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: תְּשַׁע מֵאוֹת וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: 945 பேர்
  rationale: எபிரெய எண்ணிக்கை 900 + 40 + 5 என்பதைக் குறிக்கிறது. நபர்களின் பட்டியல் என்பதால் தமிழில் இயல்பாக எண்ணுக்குப் பின் ‘பேர்’ சேர்க்கப்பட்டது.
