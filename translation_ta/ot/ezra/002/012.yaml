  text: அஸ்காத்தின் மகன்கள் 1,222 பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது בֵּן என்பதன் இணைப்புநிலைப் பன்மை. திரும்பிவந்தவர்களின் பட்டியலில் இது ஒரு குடும்ப அல்லது வம்சக் குழுவைச் சுட்டலாம்; ‘மகன்கள்’ என்பது மூலத்தின் வடிவத்தைப் பாதுகாக்கும் இயல்பான தமிழ் சொல்லாக்கம்.
- source_word: עַזְגָּד
  choice: அஸ்காத்
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் இயற்பெயர்; எபிரெய உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1,222 பேர்
  rationale: எபிரெய எண்ணுத் தொடர் மொத்தம் 1,222 என்பதைக் குறிக்கிறது. பட்டியல் வகைக்கு ஏற்ற வாசிப்புத் தெளிவுக்காக எண்கள் இலக்கங்களாகவும், மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்ட ‘பேர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
