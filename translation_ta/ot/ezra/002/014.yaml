lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: எஸ்றா 2-ன் வம்ச/குடும்பப் பட்டியல் சூழலில், இது நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு முன்னோரின் குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בִגְוָי
  choice: பிக்வாய்
  rationale: மொழிபெயர்க்கப்படாத தனிப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַלְפַּיִם חֲמִשִּׁים וְשִׁשָּׁה
  choice: 2,056 பேர்
  rationale: எபிரெய மூலத்தின் கூட்டல் முறையிலான எண்ணிக்கையை, பட்டியல் நடைக்கு ஏற்ற தெளிவான தமிழ் எண்ணுருவில் தருகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்டுகிறது.
