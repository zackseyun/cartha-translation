  text: 'The men of Bethel and Ai: two hundred twenty-three.'
translation:
  language: ta
  text: 'பெத்தேல், ஆயி ஆகிய ஊர்களைச் சேர்ந்த ஆண்கள்: இருநூற்று இருபத்து மூன்று பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஆண்கள்
  rationale: אִישׁ என்பதன் ஆண்பால் பன்மைக் கட்டுநிலை வடிவம்; இந்தக் கணக்குப் பட்டியலில் இடங்களுடன் தொடர்புடைய ஆண்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் ஆண்பால் குறிப்பைத் தக்கவைத்தும் ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵית אֵל
  choice: பெத்தேல்
  rationale: இது ஓர் இடப்பெயர்; பொருளாக்காமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָעָי
  choice: ஆயி
  rationale: இணைப்புச் சொல்லுடன் வரும் இடப்பெயர். எபிரெயத்தில் உள்ள குறிப்புச் சுட்டு தமிழில் தனியாகத் தேவையில்லாததால், இயல்பான இடப்பெயராக ‘ஆயி’ என வழங்கப்பட்டுள்ளது; ‘ஆகிய’ இரு ஊர்களையும் பட்டியலாக இணைக்கிறது.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: இருநூற்று இருபத்து மூன்று
  rationale: மூலத்தின் எண்ணிக்கையை நேராகவும் தெளிவாகவும் வழங்கும் நவீனத் தமிழ் எண்ணுரு.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். பட்டியல் வசனத்தின் சுருக்கத்தையும் கணக்கெடுப்பு நடையையும் காக்க, இடங்களுடனான தொடர்பு ‘ஆகிய ஊர்களைச் சேர்ந்த’ என்று இயல்பாக்கப்பட்டுள்ளது; எண்ணிக்கைக்குப் பின் ‘பேர்’ சேர்ப்பது தமிழில் மனிதர்களின் எண்ணைக் குறிக்கத் தெளிவளிக்கிறது.
