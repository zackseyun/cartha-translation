lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: திரும்பிவந்தோரின் குலப்பட்டியலில் בְּנֵי என்பது நேரடி மகன்களை மட்டும் குறிக்காமல் ஒரு குடும்பம் அல்லது குலத்தின் வழிவந்தோரையும் குறிக்கிறது. ஆகவே நவீனத் தமிழில் பொருளைத் தெளிவாகக் காட்டும் வகையில் ‘வழிவந்தவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: פַחַת מוֹאָב
  choice: பாகாத்-மோவாப்
  rationale: இது இங்கு ஒரு குடும்ப அல்லது குலப் பெயராக இருப்பதால், பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது; கூட்டுப் பெயரின் அமைப்பைக் காட்ட இடைக்கோடு வைக்கப்பட்டது.
- source_word: לִבְנֵי
  choice: வழிவந்தவர்களில்
  rationale: முன்னர் குறிப்பிடப்பட்ட பாகாத்-மோவாப் குலத்திற்குள் யெசுவா, யோவாப் வழியினரைச் சேர்ந்த துணைப்பிரிவை לְ இணைக்கிறது. தமிழில் இந்த உறவை இயல்பாக வெளிப்படுத்த ‘வழிவந்தவர்களில்’ பயன்படுத்தப்பட்டது.
- source_word: יֵשׁוּעַ
  choice: யெசுவா
  rationale: நாடுகடத்தலுக்குப் பிந்தைய காலத்துக்குரிய இந்தப் பெயரின் எபிரெய ஒலிவடிவம் தமிழில் ‘யெசுவா’ எனப் பிரதிபலிக்கப்பட்டது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812 பேர்
  rationale: எபிரெய எண்ணிக்கை நேரடியானது. பட்டியல் வாசிப்பை எளிதாக்க இலக்கங்கள் பயன்படுத்தப்பட்டன; இது மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
