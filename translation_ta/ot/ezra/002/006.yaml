translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற சொல் நேரடி சந்ததியையே குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும் என்பதால், குலவழி உறவைத் தெளிவாக்க ‘வழிவந்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் குலம்–துணைக்குலம் அமைப்பு இயன்றவரை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
