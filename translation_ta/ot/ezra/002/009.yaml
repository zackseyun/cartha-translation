translation_notes:
  register: திரும்பிவந்தவர்களின் குடும்பப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நவீன தமிழ் நடை. ‘மகன்கள்’ என்பதால் நேரடி ஆண் பிள்ளைகள் என்ற தவறான குறுக்கீடு ஏற்படாமல், வம்ச/குடும்பச் சார்பை வெளிப்படுத்த ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டது.
