  text: சக்காயின் வழிவந்தவர்கள் 760 பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: குடும்பப் பட்டியல் சூழலில் இந்தச் சொல் நேரடி மகன்களை மட்டும் குறிக்காமல், ஒருவரின் குடும்பம் அல்லது குலவழியைச் சேர்ந்தவர்களையும் குறிக்கலாம்; ஆகவே இயல்பான தமிழில் ‘வழிவந்தவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: זַכָּי
  choice: சக்காய்
  rationale: எபிரெயப் பெயரின் மெய்யொலிகளையும் இரட்டித்த காப் ஒலியையும் நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 760 பேர்
  rationale: எபிரெய உரையிலுள்ள ‘எழுநூற்று அறுபது’ என்ற மொத்த எண்ணிக்கையை, மக்கள் தொகைப் பட்டியலுக்கேற்ற தெளிவான நவீன தமிழ் நடையில் எண்ணாலும் ‘பேர்’ என்ற மனிதர் எண்ணும் சொல்லாலும் வழங்குகிறது.
