  text: அனாதோத்தின் ஆண்கள் நூற்று இருபத்தெட்டுப் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஆண்கள்
  rationale: אִישׁ என்பதன் construct பன்மை வடிவம்; இந்தக் கணக்குப் பட்டியலில் ஓர் ஊரைச் சேர்ந்த ஆண் உறுப்பினர்களைக் குறிக்கிறது. பாலினக் குறிப்பைத் தக்கவைத்துக்கொள்ள “ஆண்கள்” என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲנָתוֹת
  choice: ஆனதோத்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: நூற்று இருபத்தெட்டு
  rationale: மூலத்தில் உள்ள எண்ணிக்கைச் சொற்றொடரை இயல்பான நவீனத் தமிழில் எழுத்தால் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள வடிவம். எண்ணிக்கைக்குப் பின் “பேர்” சேர்ப்பது தமிழில் மனிதர்களின் எண்ணிக்கையை இயல்பாகக் குறிப்பிட உதவுகிறது; மூலத்தின் ஆண்பால் குறிப்பு “ஆண்கள்” என்பதில் பாதுகாக்கப்பட்டுள்ளது.
