  source_fidelity: The masculine construct plural אַנְשֵׁי is accurately represented by “ஆண்கள்,” and the total is correctly rendered as 128. However, the place name’s vowels are better represented as “அனாதோத்” (short initial அ, long second ஆ) rather than “ஆனதோத்.”
