  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எஸ்றாவின் திரும்பிவந்தோர் பட்டியலில் குடும்ப அல்லது குலக் குழுக்களை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் ஒரேமாதிரியான பட்டியல் வடிவத்தை இது காக்கிறது. சூழலில் ‘வழித்தோன்றல்கள்’ என்ற விரிந்த பொருள் இருக்கக்கூடும்; இருப்பினும் மூலத்தின் முறையான அமைப்பைத் தக்கவைக்க ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נְצִיחַ
  choice: நெசீயா
  rationale: இது ஒரு பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது. צ எழுத்தின் இச்சூழலிலான ஒலிக்கு ‘ச’வும், நீள உயிருக்கு ‘ீ’யும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: חֲטִיפָא
  choice: அத்தீபா
  rationale: இது ஒரு பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது. தொடக்க ח தமிழில் இயல்பாக ‘அ’ எனவும், טִי ‘த்தீ’ எனவும், פ இங்கு ‘ப’ எனவும் வழங்கப்பட்டுள்ளன.
