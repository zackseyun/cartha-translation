translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘בְּנֵי’ என்பதன் குலச்சார்ந்த பொருளை வெளிப்படுத்த ‘வழிவந்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் அவை விளக்கும் பெயர்களுக்கு அடுத்ததாக இல்லாததால், தமிழில் [a] மெஊனீமுக்கும் [b] நெபிசீமுக்கும் நேரடியாக இணைக்கப்பட்டன.
