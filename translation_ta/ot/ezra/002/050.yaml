  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: ta
  text: அஸ்னாவின் சந்ததியினர்; மெஉனீமின்[a] சந்ததியினர்; நெபிசீமின்[b] சந்ததியினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயர் சில மொழிபெயர்ப்பு மரபுகளில் “மாஓனீம்” என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
