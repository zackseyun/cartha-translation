lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: திரும்பிவந்தோரின் குலப்பட்டியலில் இந்தச் சொல் உடனடியான மகன்களை மட்டும் அல்லாமல், ஒருவரின் பெயரால் அறியப்பட்ட சந்ததியினர் அல்லது குலத்தாரையும் குறிக்கிறது. எனவே இயல்பான நவீன தமிழில் குழுவார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; மூலத்தின் மீளுரையும் தக்கவைக்கப்பட்டது.
- source_word: אַסְנָה
  choice: அஸ்னா
  rationale: தனிநபர் அல்லது குலப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מעינים
  choice: மெஊனீம்
  rationale: குலப்பட்டியலில் வரும் பெயராகக் கருதி ஒலிபெயர்க்கப்பட்டது. பெயரின் வடிவம் மரபுகளில் மாறுபடுவதால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டது.
- source_word: נפיסים
  choice: நெபிசீம்
  rationale: குழு அல்லது குலப்பெயராகத் தமிழில் ஒலிபெயர்க்கப்பட்டது. வாசிப்பு மற்றும் ஒலிபெயர்ப்பு மரபில் காணப்படும் மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
