  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: ta
  text: 'ஆலயப் பணியாளர்கள்: சீகாவின் வழிவந்தவர்கள், ஹசூபாவின் வழிவந்தவர்கள், தப்பாவோத்தின் வழிவந்தவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் திரும்பத் திரும்ப வரும் சொற்றொடர் நேரடியாக ‘சீகாவின் மகன்கள், ஹசூபாவின் மகன்கள், தப்பாவோத்தின் மகன்கள்’ என்று பொருள்படும்; வம்சப் பட்டியலில் அது அவர்களுடைய வழிவந்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: எபிரெயச் சொல் ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட பணியாளர் பிரிவைக் குறிக்கிறது. ஒலிபெயர்ப்பை விட அதன் பணியைத் தெளிவாகக் கூறும் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: வம்சப் பட்டியல் சூழலில் இச்சொல் உடனடியான மகன்களை மட்டும் அல்லாமல் குடும்ப அல்லது குல வழியினரையும் குறிக்கலாம்; ஆகவே மூன்று இடங்களிலும் ‘வழிவந்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: צִיחָא
  choice: சீகா
  rationale: எபிரெய வடிவத்தின் நீண்ட உயிரையும் இறுதி உயிரொலியையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: חֲשׂוּפָא
  choice: அசூபா
  rationale: எபிரெயப் பெயரின் உச்சரிப்பைத் தமிழில் இயல்பாக அணுகும் ஒலிபெயர்ப்பு; தொடக்க ח ஒலிக்குத் தமிழில் துல்லிய இணை இல்லாததால் ‘அ’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: טַבָּעוֹת
  choice: தப்பாவோத்
  rationale: இங்கு பொதுப்பெயராக அல்ல, நபர் அல்லது குலப்பெயராகச் செயல்படுவதால் பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
