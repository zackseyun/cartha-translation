translation:
  language: ta
  text: கிப்பாரின் மகன்கள் தொண்ணூற்று ஐந்து பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘மகன்கள்’; இத்திரும்பிவந்தோர் பட்டியலில் இது ஒரு குடும்பம் அல்லது வம்சத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான பட்டியல் சொல்லாகவும் செயல்படுகிறது. தமிழ் வாசகத்தில் ‘பேர்’ சேர்ப்பது எண்ணிக்கையை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: גִבָּר
  choice: கிப்பார்
  rationale: இது ஒரு தனிப்பெயர்; மொழிபெயர்க்காமல் எபிரெய மெய்யெழுத்து மற்றும் உயிர்க்குறிப்புகளுக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: தொண்ணூற்று ஐந்து
  rationale: எபிரெயில் நேரடியாக ‘தொண்ணூறும் ஐந்தும்’ என்ற அமைப்பு உள்ளது; நவீனத் தமிழின் இயல்பான எண்ணிக்கை வடிவமான ‘தொண்ணூற்று ஐந்து’ அதே மதிப்பைத் துல்லியமாக வழங்குகிறது.
