  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மக்கள்
  rationale: வம்சப் பட்டியல் சூழலில் இச்சொல் சொற்படியாக ‘மகன்கள்’ என்றாலும், இங்கு ஓர் இடத்துடன் தொடர்புடைய மக்கள் குழுவைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְרֵחוֹ
  choice: எரிகோ
  rationale: இடப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டது.
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: முந்நூற்று நாற்பத்தைந்து பேர்
  rationale: எபிரெய எண்ணிக்கை 345 என்பதை நேரடியாகக் குறிக்கிறது. மனிதர்களின் எண்ணிக்கை என்பதால் தமிழில் இயல்பாக ‘பேர்’ சேர்க்கப்பட்டது.
