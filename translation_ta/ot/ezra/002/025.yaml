    issue: The transliteration “கிரியாத்-ஆரீம்” adds a final long-vowel/consonantal form and an initial long vowel not represented by קִרְיַת עָרִים.
    rationale: The Hebrew place name is qiryat ʿarim. “கிரியத்-அரீம்” more closely represents its constituent form and avoids altering the name.
  revised_text: 'கிரியத்-அரீம், கெபீரா, பெயேரோத் ஆகிய ஊர்களைச் சேர்ந்தவர்கள்: 743 பேர்.'
