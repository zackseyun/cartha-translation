  text: בְּנֵ֨י קִרְיַ֤ת עָרִים֙ כְּפִירָ֣ה וּ/בְאֵר֔וֹת שְׁבַ֥ע מֵא֖וֹת וְ/אַרְבָּעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/025.yaml
  text: 'The sons of Kiriath-arim[a], Kephirah, and Beeroth: 743.'
translation:
  language: ta
  text: 'கிரியத்-அரீம், கெபீரா, பெயேரோத் ஆகிய ஊர்களைச் சேர்ந்தவர்கள்: 743 பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ஊர்களைச் சேர்ந்தவர்கள்
  rationale: இங்கு בְּנֵי என்பது நேரடி மகன்களைக் குறிப்பதைவிட, தொடர்ந்து வரும் ஊர்களோடு தொடர்புடைய திரும்பிவந்த மக்களைக் பட்டியலிடும் அறிமுகச் சொல்லாக உள்ளது. எனவே நவீன தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: קִרְיַת עָרִים
  choice: கிரியாத்-ஆரீம்
  rationale: இது ஓர் இடப்பெயர்; மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: כְּפִירָה
  choice: கெபீரா
  rationale: இடப்பெயரான இதன் எபிரெய உச்சரிப்பை நவீன தமிழில் இயன்றவரை இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבְאֵרוֹת
  choice: பெயேரோத்
  rationale: வாவ் இணைப்பின் பொருள் தமிழ் பட்டியல் அமைப்பில் ‘ஆகிய’ என்பதால் வெளிப்படுகிறது; இடப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 பேர்
  rationale: பட்டியல் வாசிப்பை எளிதாக்க எண்ணிக்கை இலக்கங்களாகத் தரப்பட்டது; தமிழில் இது மக்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தவிர்க்கப்பட்டு, இடங்களோடு தொடர்புடைய மக்களைச் சுட்டும் எபிரெயப் பயன்பாடு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
