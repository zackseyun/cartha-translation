lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: குடும்பம் அல்லது குலத்தை அறிமுகப்படுத்தும் இந்தக் கணக்கெடுப்புப் பட்டியலின் வழக்கமான அமைப்பை நேரடியாகப் பாதுகாக்கிறது. சூழலில் இது சந்ததியினரையும் குறிக்கக்கூடும்; எனினும் ‘மகன்கள்’ என்பது மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
- source_word: בָנִי
  choice: பானி
  rationale: இது ஓர் ஆள்பெயர்; தமிழ் ஒலிப்பெயர்ப்பில் ‘பானி’ என்று வழங்கப்படுகிறது.
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁנָיִם
  choice: அறுநூற்று நாற்பத்திரண்டு பேர்
  rationale: குலத்தின் மொத்த எண்ணிக்கையான 642-ஐத் துல்லியமாகத் தருகிறது; மனிதர்களைக் கணக்கிடும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
