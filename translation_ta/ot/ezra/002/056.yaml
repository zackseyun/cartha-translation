translation:
  language: ta
  text: யாலாவின் மகன்கள், தர்கோனின் மகன்கள், கித்தேலின் மகன்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இந்தப் பட்டியலில் இது குடும்பத்தார் அல்லது வழித்தோன்றல்களைக் குறிக்கக்கூடும்; எனினும் எபிரெய வடிவத்தை இயல்பான தமிழில் காக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יַעְלָה
  choice: யாலா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; பெயரின் தொடக்கத்திலுள்ள יַ மற்றும் நீண்ட ā ஒலி தமிழில் இயல்பாகப் பிரதிபலிக்கப்படுகின்றன.
- source_word: דַרְקוֹן
  choice: தர்கோன்
  rationale: எபிரெய தனிப்பெயர் பொருள் மொழிபெயர்க்கப்படாமல், அதன் மெய் மற்றும் உயிரொலிகளுக்கு நெருக்கமாக ஒலிப்பெயர்க்கப்பட்டது.
- source_word: גִדֵּל
  choice: கித்தேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு. இரட்டித்த דּ ஒலியைத் தமிழில் ‘த்த’ என்றும், இறுதி ēl ஒலியை ‘ேல்’ என்றும் பிரதிபலிக்கிறது.
