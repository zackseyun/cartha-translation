  source_fidelity: மூல எபிரெயத்தில் வரும் மூன்று முறைப்பட்ட בְּנֵי (‘மகன்கள்’) ஒவ்வொரு பெயருடனும் தமிழில் முழுமையாகக் காக்கப்பட்டுள்ளது. மூன்று தனிப்பெயர்களும் ஒலிப்பெயர்ப்பாகவே வழங்கப்பட்டுள்ளன; பட்டியல் வடிவத்திற்கும் மூலத்தின் சுருக்கத்திற்கும் இது உண்மையுள்ளது.
  naturalness: “யாலாவின் மகன்கள், தர்கோனின் மகன்கள், கித்தேலின் மகன்கள்” என்பது நவீன நிலையான தமிழில் தெளிவானதும், மரபுவழிப் பட்டியல் நடைக்கு இயல்பானதுமாக உள்ளது. மீளுரைத்தல் மூலத்தின் அமைப்பைச் சரியாகப் பிரதிபலிக்கிறது.
  terminology: “மகன்கள்” என்பது בְּנֵי என்பதற்கான நேரடியான, சூழலுக்கேற்ற தெரிவாகும். பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிப்பெயர்க்கப்பட்டுள்ளன. “கித்தேல்” தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவமாக ஏற்கத்தக்கது.
