  register: நவீன, கண்ணியமான பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று பெயர்களுக்கும் ஒரே தொடரமைப்பு பயன்படுத்தப்பட்டு மூலத்தின் ஒத்திசைவும் மீளுரையும் காக்கப்பட்டுள்ளன.
