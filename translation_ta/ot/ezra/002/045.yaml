  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: ta
  text: லெபானாவின் மகன்கள்[a], அகாபாவின் மகன்கள், அக்கூபின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்கள்’ என்பதற்கான எபிரெயச் சொல் இங்கு உடனடிப் பிறப்பான மகன்களை மட்டும் அல்லாமல், ஒரு குடும்ப வழியையோ குலக் குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இந்தப் பெயர்ப்பட்டியல் சூழலில் இச்சொல் உடனடிப் பிறப்பான மகன்களை மட்டும் குறிக்காமல், ஒரு குடும்ப வழி அல்லது குலக் குழுவைச் சேர்ந்தவர்களையும் குறிக்கலாம். ஆகவே இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாகக் காட்டும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; எபிரெய உரையின் மீளுரையும் பாதுகாக்கப்பட்டது.
- source_word: לְבָנָה
  choice: லெபானா
  rationale: மசோரா உயிர்க்குறிப்புகளின் ஒலிப்பை அணுகும் வகையில் இக்குடும்பப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֲגָבָה
  choice: அகாபா
  rationale: எபிரெய தொடக்க எழுத்தான ח இங்கு மென்மையான தொண்டை ஒலியைக் கொண்டது; தமிழில் இயல்பாக வாசிக்கக்கூடிய அண்மித்த ஒலிபெயர்ப்பாக ‘அகாபா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַקּוּב
  choice: அக்கூப்
  rationale: ע தொடக்க உயிரொலியாகவும், இரட்டிக்கப்பட்ட ק ‘க்க’ என்றும், இறுதி ב ‘ப்’ என்றும் எபிரெய வடிவத்தை அணுகி ஒலிபெயர்க்கப்பட்டது.
