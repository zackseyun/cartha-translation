  naturalness: ‘ராமா மற்றும் கேபாவின் வழித்தோன்றல்கள்’ என்பது பட்டியல் நடையில் தெளிவாகவும் நவீனத் தரத் தமிழில் இயல்பாகவும் உள்ளது. ‘ஆகிய ஊர்களைச் சேர்ந்தவர்கள்’ என்பதைக் காட்டிலும் இது எபிரெயப் பட்டியல் மரபைச் சிறப்பாகப் பாதுகாக்கிறது.
