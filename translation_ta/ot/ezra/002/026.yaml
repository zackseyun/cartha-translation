translation:
  language: ta
  text: ராமா மற்றும் கேபாவின் வழித்தோன்றல்கள்[a]—621 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ராமா மற்றும் கேபாவின் மகன்கள்.” இந்தப் பட்டியலில் “மகன்கள்” என்ற எபிரெய மரபுத்தொடர், உடனடிப் புதல்வர்களை மட்டுமல்லாமல் அந்த ஊர்களைச் சேர்ந்த மக்களையோ அவர்களுடைய வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ஊர்களைச் சேர்ந்தவர்கள்
  rationale: இந்த மக்கள்தொகைப் பட்டியலில் எபிரெய ‘மகன்கள்’ என்ற மரபுத்தொடர் உடனடிப் புதல்வர்களை மட்டும் குறிக்காமல், ஒரு குலத்தையோ ஊர்ச் சமூகத்தையோ சேர்ந்தவர்களைக் குறிக்கலாம். ராமா, கேபா இரண்டும் இங்கு ஊர்ப் பெயர்களாக இருப்பதால், இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்கப்பட்டது; சொல்லடித் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: הָרָמָה
  choice: ராமா
  rationale: எபிரெய ஊர்ப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது. பெயருக்கு முன் உள்ள குறிப்புச் சுட்டு தமிழில் தனியே மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: וָגָבַע
  choice: கேபா
  rationale: வாவ் இணைப்புடன் வரும் எபிரெய ஊர்ப் பெயர்; தமிழில் வழக்கமான ஒலியமைப்புக்கு ஏற்ப ‘கேபா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: 621 பேர்
  rationale: மக்களைக் கணக்கிடும் எண்ணிக்கை என்பதால், தெளிவுக்காக ‘பேர்’ சேர்த்து நவீன எண் வடிவில் வழங்கப்பட்டது.
