  yaml_path: translation/ot/ezra/002/047.yaml
  text: the sons of Giddel[a], the sons of Gahar, the sons of Reaiah.
translation:
  language: ta
  text: கித்தேலின் மகன்கள், கஹாரின் மகன்கள், ரெயாயாவின்[a] மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ராயா என்றும் பெயர்த்தெழுதலாம்.
    reason: ரְאָיָה என்ற பெயருக்கான மாற்றுப் பெயர்த்தெழுத்து (Raiah) ஆங்கில ஆய்வுக் குறிப்பில் வழங்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: திரும்பிவந்தோரின் குடும்பப் பட்டியல் சூழலில், בְּנֵי என்பது நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்பத்தையோ குலவழியையோ குறிக்கலாம்; ஆகவே இயல்பான தமிழில் ‘சந்ததியினர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: גִדֵּל
  choice: கித்தேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது; நடுவிலுள்ள இரட்டிப்பு மெய்யொலியும் பிரதிபலிக்கப்படுகிறது.
- source_word: גַחַר
  choice: காகார்
  rationale: எபிரெய தனிப்பெயர் பொருளாக்கப்படாமல், அதன் உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் பெயர்த்தெழுதப்பட்டது.
- source_word: רְאָיָה
  choice: ரெயாயா
  rationale: எபிரெய வடிவத்தின் ஒலியையும் அசை அமைப்பையும் தமிழில் தெளிவாகப் பிரதிபலிக்கும் பெயர்த்தெழுத்து.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ஒவ்வொரு בְּנֵי என்பதும் குடும்ப/குலச் சந்ததியைக் குறிக்கும் வகையில் ஒரே சீராக மொழிபெயர்க்கப்பட்டுள்ளது.
