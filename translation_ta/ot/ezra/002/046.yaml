  - marker: a
    text: 'ஷம்லாய்: சில மொழிபெயர்ப்புகளிலும் தொடர்புடைய பெயர் மரபுகளிலும் “ஷல்மாய்” என்றும் வழங்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தோரின் குலப்பட்டியலில் வரும் எபிரெய மரபுவழிச் சூத்திரத்தை முறையாகப் பேணுகிறது. இங்கு அது நேரடி மகன்களை மட்டுமன்றி ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களையும் குறிக்கக்கூடும்.
- source_word: חָגָב
  choice: ஆகாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தொடக்க ח ஒலிக்கு நவீனத் தமிழில் இயல்பான உயிர்த்தொடக்கம் பயன்படுத்தப்பட்டது.
- source_word: שמלי
  choice: சம்லாய்
  rationale: மெய்யெழுத்து வடிவமான שמלי-ஐ நெருக்கமாகப் பிரதிபலிக்கும் தனிப்பெயர் ஒலிப்பெயர்ப்பு.
- source_word: חָנָן
  choice: ஆனான்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; இரண்டாம் அசையின் நீண்ட உயிர் பேணப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணுகிறது. மூன்று பெயர்களுக்கும் ஒரே மரபுவழிச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சம்லாய்’ பெயருக்குப் பின்பு வைக்கப்பட்டுள்ளது.
