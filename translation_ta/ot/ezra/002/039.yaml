lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல்லின் வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கிறது; இத்தகைய மக்கள் கணக்குப் பட்டியலில் இது உடனடிப் பிறப்பு மகன்களை மட்டும் அல்லாமல் ஒரு குடும்பவழியினரையோ குலத்தினரையோ குறிக்கலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: חָרִם
  choice: ஆரீம்
  rationale: தனிநபர் அல்லது குடும்பப் பெயர் என்பதால், எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶלֶף וְשִׁבְעָה עָשָׂר
  choice: 1,017
  rationale: ‘ஆயிரத்துப் பதினேழு’ என்ற நேரடியான எண்ணிக்கையை, கணக்குப் பட்டியலில் எளிதாக வாசிக்க இலக்கங்களால் தருகிறது.
