translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள் கணக்குப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூலத்தின் ‘மகன்கள்’ என்ற சொற்றொடர் முதன்மை உரையில் காக்கப்பட்டு, அதன் விரிந்த குடும்ப/குலப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
