    text: அல்லது, “ஹாரீமின் வழிவந்தவர்கள்.” “மகன்கள்” என்பதற்கான எபிரெயச் சொல் உடனடிப் பிறப்பு மகன்களை மட்டும் அல்லாமல், விரிந்த குடும்பவழியினரையோ குலத்தினரையோ குறிக்கலாம்.
