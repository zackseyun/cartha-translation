  yaml_path: translation/ot/ezra/002/060.yaml
  text: 'the sons of Delaiah, the sons of Tobiah, the sons of Nekoda: six hundred fifty-two.'
translation:
  language: ta
  text: 'தெலாயாவின் மகன்கள், தொபியாவின் மகன்கள், நெகோதாவின் மகன்கள்: அறுநூற்று ஐம்பத்திரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்ச மற்றும் பட்டியல் சூழலில் குடும்பக் குழுவைக் குறிக்கும் எபிரெயக் கட்டமைப்பை முறையாகப் பாதுகாக்கிறது. இங்கு எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதைத் தமிழில் இயல்பாக்க இறுதியில் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: דְלָיָה
  choice: தெலாயா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழ் எழுத்துப்பெயர்ப்பில் நெருக்கமாக வழங்குகிறது.
- source_word: טוֹבִיָּה
  choice: தொபியா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: נְקוֹדָא
  choice: நெகோதா
  rationale: மூலமொழிப் பெயரின் மெய் மற்றும் உயிர் ஒலிகளைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: அறுநூற்று ஐம்பத்திரண்டு பேர்
  rationale: எபிரெய எண்ணைத் தெளிவான, இயல்பான நவீனத் தமிழில் வழங்குகிறது; பட்டியலிடப்படுவது மனிதர்கள் என்பதால் ‘பேர்’ சேர்க்கப்படுகிறது.
