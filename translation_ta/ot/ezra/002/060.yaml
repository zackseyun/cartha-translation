  register: வம்சப் பட்டியலுக்குரிய சுருக்கமான, கண்ணியமான நடையைப் பேணுகிறது. பெயர்கள் மூல எபிரெய ஒலியமைப்பை அடிப்படையாகக் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
