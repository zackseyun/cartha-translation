  register: நவீன நிலையான தமிழில், வம்சாவளிப் பட்டியலுக்குரிய கண்ணியமான நடையைப் பேணுகிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; ‘இவர்களில்’ என்பது தொடர்புச் சொல்லின் முன்சுட்டியைத் தெளிவாக்குகிறது.
