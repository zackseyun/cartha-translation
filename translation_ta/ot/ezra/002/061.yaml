source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: ta
  text: 'ஆசாரியர்களின் மக்களில்: ஓபாயாவின் வம்சத்தினர், அக்கோசின் வம்சத்தினர், பர்சிலாயின் வம்சத்தினர். இந்தப் பர்சிலாய், கீலேயாத்தியனான பர்சிலாயின் மகள்களில் ஒருத்தியை மனைவியாக எடுத்துக்கொண்டு, அவர்களுடைய பெயரால் அழைக்கப்பட்டான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான நடையில், “அவர்களுடைய பெயரை ஏற்றுக்கொண்டான்.” எபிரெயத்தில் சொல்லுக்கு சொல், “அவர்களுடைய பெயரால் அழைக்கப்பட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் மக்களில்
  rationale: מִן என்பதன் பகுதிப்பொருளையும், பட்டியலின் வம்சாவளி நடையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: ஓபாயாவின் மக்களும், அக்கோசின் மக்களும், பர்சிலாயின் மக்களும்
  rationale: மீண்டும் வரும் בְּנֵי என்பதைக் ‘மக்கள்’ எனத் தொடர்ந்து மொழிபெயர்த்து வம்சப் பட்டியலின் அமைப்பைப் பாதுகாக்கிறது; பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: என்பவன் ... மகள்களில் ஒருத்தியை மனைவியாக எடுத்துக்கொண்டு
  rationale: לקח ... אשה என்ற ‘மனைவியாக எடுத்தல்’ என்னும் எபிரெய மரபுத்தொடரையும், מִן குறிக்கும் ‘மகள்களில் ஒருத்தி’ என்ற பகுதிப்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: கீலேயாத்தியனான பர்சிலாய்
  rationale: הַגִּלְעָדִי என்ற இன/இட அடையாளப் பெயரடையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: அவர்களுடைய பெயரால் அழைக்கப்பட்டான்
  rationale: நிபால் வினையின் செயப்பாட்டு வடிவத்தையும், பன்மை உடைமைப் பின்னொட்டின் தெளிவின்மையையும் தீர்க்காமல் எபிரெயச் சொல்லாக்கத்திற்கு நெருக்கமாகப் பாதுகாக்கிறது.
