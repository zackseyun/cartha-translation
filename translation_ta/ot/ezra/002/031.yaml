  text: the sons of another Elam[a], 1,254.
translation:
  language: ta
  text: வேறொரு ஏலாமின் சந்ததியினர்[a] 1,254 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏலாமின் சந்ததியினரில் மற்றொரு குழுவினர்”; இந்த அதிகாரத்தில் முன்பு பட்டியலிடப்பட்ட ஏலாம் குலத்திலிருந்து இவர்களை இது வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: வம்சப் பட்டியல் மற்றும் மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் இச்சொல் ஒரு குடும்பக் கிளையைச் சேர்ந்தவர்களைக் குறிக்கிறது; நவீன தமிழில் ‘சந்ததியினர்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இது திரும்பிவந்தோரின் பட்டியலில் வரும் தனிப்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַחֵר
  choice: வேறொரு
  rationale: இதே அதிகாரத்தில் முன்னதாகக் குறிப்பிடப்பட்ட ஏலாம் குழுவிலிருந்து இக்குழுவை வேறுபடுத்துகிறது. ‘வேறொரு’ என்பது அந்த வேறுபாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 பேர்
  rationale: எபிரெய எண்ணின் மொத்தம் 1,254. பட்டியல் நடைக்கு ஏற்ற வாசிப்புத் தெளிவுக்காக எண்கள் இலக்கங்களாகவும், மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ என்பதுடனும் தரப்பட்டுள்ளன.
