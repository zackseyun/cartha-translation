translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற நேரடி வடிவத்திற்குப் பதிலாக, குடும்பக் கிளையைச் சுட்டும் சூழல்பொருளைத் தெளிவாக வெளிப்படுத்த ‘சந்ததியினர்’ தேர்ந்தெடுக்கப்பட்டது.
