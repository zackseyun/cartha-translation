  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: பாரசீகக் கால நிர்வாகப் பொருளுடைய ‘மாகாணம்,’ ஏற்றத் திசையுடைய ‘மேலே வந்த,’ நாடுகடத்தல் மற்றும் சிறைநிலை என்ற இரட்டைக் கருத்து, நேபுகாத்நேச்சாரின் கட்டாய நாடுகடத்தல், மற்றும் திரும்புதல். ஆனால் இறுதி வாக்கியத்தில் ‘சென்றார்கள்’ என்ற தனி வினை மூலத்தில் இல்லாத கூடுதல் இயக்கத்தை உருவாக்குகிறது; ஒரே ‘திரும்பினார்கள்’ வினையால் மூலத்தின் அமைப்பைத் துல்லியமாகக் காக்கலாம்.'
  naturalness: தொடக்கத்தில் நீண்ட முன்நிறுத்தப்பட்ட தொடர்புத்தொடர் தமிழில் ஏற்கத்தக்கது; இருப்பினும் சிறிய நிறுத்தக்குறி மாற்றமும் ‘தம்’ பயன்பாடும் உரையைச் சீராக்குகின்றன. ‘எருசலேமுக்கும் யூதாவுக்கும், ஒவ்வொருவரும் தம் நகரத்திற்கும்’ என்ற இணை அமைப்பு மூலத்தின் இரு இலக்குகளையும் தமிழில் தெளிவாக்குகிறது.
