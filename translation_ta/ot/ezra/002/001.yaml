- from: பாபிலோன் அரசன் நேபுகாத்நேச்சார்[c] பாபிலோனுக்கு நாடுகடத்தியவர்களாகிய, நாடுகடத்தப்பட்டோரின் சிறையிருப்பிலிருந்து[b] மேலே வந்த மாகாணத்தின் மக்கள்[a] இவர்களே. அவர்கள் எருசலேமுக்கும் யூதாவுக்கும் திரும்பி, ஒவ்வொருவரும் தத்தம் நகரத்திற்குச் சென்றார்கள்.
  to: பாபிலோன் அரசன் நேபுகாத்நேச்சார்[c] பாபிலோனுக்கு நாடுகடத்திய நாடுகடத்தப்பட்டோரின் சிறைநிலையிலிருந்து[b] மேலே வந்த மாகாணத்தின் மக்கள்[a] இவர்களே. அவர்கள் எருசலேமுக்கும் யூதாவுக்கும், ஒவ்வொருவரும் தம் நகரத்திற்கும், திரும்பினார்கள்.
