translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுப் பட்டியலுக்கேற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய ஏற்றத் திசைமொழியும் ‘சிறையிருப்பு/நாடுகடத்தப்பட்டோர்’ என்ற இரட்டைக் கூறும் இயன்றவரை காக்கப்பட்டுள்ளன; ‘மாகாணத்தின் மகன்கள்’ என்ற சொற்படியான ஆனால் தமிழில் இயல்பற்ற வடிவம் முதன்மை உரையில் பொருள்வழியாக வழங்கப்பட்டுள்ளது.
