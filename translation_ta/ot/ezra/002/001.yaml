  edition: WLC
  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: ta
  text: பாபிலோன் அரசன் நேபுகாத்நேச்சார்[c] பாபிலோனுக்கு நாடுகடத்திய நாடுகடத்தப்பட்டோரின் சிறைநிலையிலிருந்து[b] மேலே வந்த மாகாணத்தின் மக்கள்[a] இவர்களே. அவர்கள் எருசலேமுக்கும் யூதாவுக்கும், ஒவ்வொருவரும் தம் நகரத்திற்கும், திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்பட ‘மாகாணத்தின் மகன்கள்’; இது மாகாணத்தைச் சேர்ந்த மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரேயத் தொடர் சொற்பட ‘நாடுகடத்தப்பட்டோரின் சிறைநிலையிலிருந்து’ என்று இரு கருத்துகளையும் இணைக்கிறது; ‘நாடுகடத்தலிலிருந்து’ அல்லது ‘சிறைநிலையிலிருந்து’ என்றும் சுருக்கமாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில் வேறு இடங்களில் வரும் பெயர்வடிவத்தை அடிப்படையாகக் கொண்டு, இப்பெயரை ‘நேபுகாத்ரேச்சார்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: மாகாணத்தின் மக்கள்
  rationale: בְּנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’ என்றாலும், இங்கு அது ஒரு குழுவைச் சேர்ந்தவர்களைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘மாகாணத்தின் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது; הַמְּדִינָה என்பதன் பாரசீகக் கால நிர்வாகப் பொருளை ‘மாகாணம்’ காக்கிறது.
- source_word: הָעֹלִים
  choice: மேலே வந்த
  rationale: עלה என்ற வினையின் ஏறிச் செல்லும் திசைமொழியைப் பாதுகாக்க ‘மேலே வந்த’ என மொழிபெயர்க்கப்பட்டது. இதை ‘திரும்பிய’ என மாற்றினால், பின்னர் வரும் וַיָּשׁוּבוּ என்பதன் தனித்த பொருள் மறைந்துவிடும்.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டோரின் சிறையிருப்பிலிருந்து
  rationale: שְׁבִי (‘சிறையிருப்பு’) மற்றும் גּוֹלָה (‘நாடுகடத்தப்பட்டோர்/நாடுகடத்தல்’) ஆகிய இரு கூறுகளையும் ஒரே பொதுச் சொல்லாகச் சுருக்காமல் மொழிபெயர்க்கிறது.
- source_word: הֶגְלָה
  choice: நாடுகடத்திய
  rationale: גלה என்பதன் ஹிஃபீல் வடிவம் கட்டாயமாகத் தாய்நாட்டிலிருந்து அகற்றி அனுப்பியதைச் சுட்டுகிறது. ‘நாடுகடத்திய’ என்பது இதைச் சுருக்கமாகவும் வரலாற்றுச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: וַיָּשׁוּבוּ
  choice: அவர்கள் ... திரும்பி
  rationale: இவ்வினை வெளிப்படையாகத் திரும்புதலைக் குறிக்கிறது; முந்தைய ‘மேலே வந்த’ என்பதிலிருந்து வேறுபடுத்திக் காக்கப்பட்டுள்ளது.
- source_word: אִישׁ לְעִירוֹ
  choice: ஒவ்வொருவரும் தத்தம் நகரத்திற்குச் சென்றார்கள்
  rationale: אִישׁ இங்கு பகிர்வுப்பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது. ‘தத்தம் நகரம்’ ஒவ்வொருவருக்கும் உரிய நகரத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்.
