  text: 'ஹாஷூமின் மகன்கள்: இருநூற்று இருபத்துமூன்று பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தவர்களின் பட்டியலில் இச்சொல் ஓர் ஆண் மூதாதையிடமிருந்து வந்த குடும்ப அல்லது குலக் குழுவைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெய உரையின் பட்டியல் மற்றும் வம்சவழி அமைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: חָשֻׁם
  choice: ஹாசூம்
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலியமைப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: இருநூற்று இருபத்துமூன்று பேர்
  rationale: எபிரெய எண்ணிக்கை ‘இருநூறு, இருபது, மூன்று’ என்று அமைந்துள்ளது. தமிழில் மொத்த எண்ணிக்கையை இயல்பாகத் தெரிவிக்க ‘இருநூற்று இருபத்துமூன்று’ என்றும், பட்டியலிடப்பட்ட மனிதர்களைக் குறிக்க ‘பேர்’ என்றும் வழங்கப்பட்டுள்ளது.
