  source_fidelity: 'மூல எபிரெயத்தின் கணக்கெடுப்புப் பட்டியல் அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: ஆத்தேரின் எசேக்கியா-சார்ந்த கிளை, அதன் பின் எண்ணிக்கை. “தொண்ணூற்று எட்டுப் பேர்” என்பது תִּשְׁעִים וּשְׁמֹנָה என்பதற்கு சரியான இயல்பான தமிழ் வழங்கல்.'
  naturalness: '“எசேக்கியாவைச் சேர்ந்த ஆத்தேரின் மகன்கள்: தொண்ணூற்று எட்டுப் பேர்” என்பது நவீனத் தரத் தமிழில் தெளிவாகவும், பட்டியல் நடைக்கு ஏற்ற சுருக்கத்துடனும் உள்ளது. இரட்டைப்புள்ளி எண்ணிக்கை-பட்டியல் நடையில் இயல்பானது.'
  terminology: ஆத்தேர் மற்றும் எசேக்கியா ஆகிய பெயர்கள் பொருத்தமாக ஒலிபெயர்க்கப்பட்டுள்ளன. בְּנֵי என்பதற்கான “மகன்கள்” வம்ச/குடும்பப் பட்டியல் பதிவின் மரபான சொல்லாட்சியைப் பாதுகாக்கிறது. לִיחִזְקִיָּה-வின் உட்பிரிவு அல்லது தொடர்பு நுணுக்கத்தை “எசேக்கியாவைச் சேர்ந்த” சரியாக வெளிப்படுத்துகிறது.
