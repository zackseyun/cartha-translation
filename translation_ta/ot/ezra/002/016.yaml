  text: 'எசேக்கியாவைச் சேர்ந்த ஆத்தேரின் மகன்கள்: தொண்ணூற்று எட்டுப் பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்ச அல்லது கணக்கெடுப்புப் பட்டியலில் இது குடும்ப வழியினரைக் குறிக்கலாம்; மூலத்தின் மரபுவழி அமைப்பைப் பேணும் வகையில் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָטֵר
  choice: ஆத்தேர்
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் இயற்பெயர்; தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִיחִזְקִיָּה
  choice: எசேக்கியாவைச் சேர்ந்த
  rationale: முன்னொட்டு ל இங்கு உறவு அல்லது உட்பிரிவைக் குறிக்கிறது. ‘எசேக்கியாவைச் சேர்ந்த’ என்பது ஆத்தேர் குடும்பத்தின் இந்தக் கிளையை இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: தொண்ணூற்று எட்டுப் பேர்
  rationale: எண்ணிக்கையைத் தரமான தமிழில் வழங்கி, பட்டியலிடப்படுவது மனிதர்கள் என்பதை ‘பேர்’ தெளிவாக்குகிறது.
