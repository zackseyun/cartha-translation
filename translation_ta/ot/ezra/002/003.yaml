  register: நவீனத் தரத் தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான, dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘மகன்கள்’ மூலத்தின் சொல் வடிவத்தைப் பேணுகிறது; அதன் விரிவான குலப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
