translation:
  language: ta
  text: பாரோஷின் மகன்கள்[a], 2,172 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாரோஷின் வழிவந்தவர்கள்.’ எபிரெய மூலத்தில் நேரடியாக ‘பாரோஷின் மகன்கள்’ என்று உள்ளது; இத்தகைய பட்டியல்களில் இது ஒரு குடும்பம் அல்லது குலத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘மகன்கள்’ என்று பொருள்படும்; இந்தக் கணக்கெடுப்புப் பட்டியலில் அது ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான சொற்றொடராக உள்ளது. மூலத்தின் பட்டியல் நடையைப் பேணுவதற்காக நேரடி வடிவம் பயன்படுத்தப்பட்டது.
- source_word: פַרְעֹשׁ
  choice: பாரோஷ்
  rationale: இது ஒருவரின் அல்லது குடும்பத்தின் இயற்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַלְפַּיִם מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: எபிரெய எண்ணின் மொத்தம் 2,172. கணக்கெடுப்புப் பட்டியலில் தெளிவாக வாசிக்க இலக்கங்கள் பயன்படுத்தப்பட்டன; ‘பேர்’ என்பது எண்ணப்படுவது மனிதர்கள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
