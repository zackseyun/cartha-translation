  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் இணைப்புநிலைப் பன்மை. திரும்பிவந்தவர்களின் இந்தப் பட்டியலில் இது குடும்ப வழியினரையோ குலத்தாரையோ குறிக்கலாம்; எபிரெய வடிவத்தை நேரடியாகப் பேணுவதற்காக ‘மகன்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנִיקָם
  choice: அதோனிக்காம்
  rationale: தனிப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁשָּׁה
  choice: அறுநூற்று அறுபத்தாறு பேர்
  rationale: எபிரெய எண்ணிக்கை ‘ஆறு நூறுகள், அறுபது, மேலும் ஆறு’ என்று தெளிவாக 666-ஐக் குறிக்கிறது. நபர்களின் எண்ணிக்கை என்பதை இயல்பான தமிழில் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டது.
