revisions:
- from: இவர்கள் வம்சாவளியின்படி பதிவு செய்யப்பட்டவர்களிடையே தங்களுக்குரிய ஆவணத்தைத் தேடினார்கள்; ஆனால் அவர்கள் அதில் காணப்படவில்லை. எனவே, அவர்கள் ஆசாரியத்துவத்துக்குத் தகுதியற்றவர்களாகக் கருதப்பட்டார்கள்.[a]
  to: இவர்கள் தங்கள் பதிவை வம்சாவளிப் பதிவேட்டில் தேடினார்கள்; ஆனால் அதில் அவர்கள் காணப்படவில்லை. அவர்கள் ஆசாரியத்துவத்திலிருந்து விலக்கப்பட்டார்கள்.[a]
  rationale: The revision more closely follows the source’s administrative-genealogical setting and makes the exclusion from priestly status explicit. It avoids overdefining the exact nature of the written record and preserves the semantic range of וַיְגֹאֲלוּ—defilement or disqualification—in the anchored footnote.
