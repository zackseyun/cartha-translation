  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: ta
  text: இவர்கள் தங்கள் பதிவை வம்சாவளிப் பதிவேட்டில் தேடினார்கள்; ஆனால் அதில் அவர்கள் காணப்படவில்லை. அவர்கள் ஆசாரியத்துவத்திலிருந்து விலக்கப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “அவர்கள் ஆசாரியத்துவத்தைப் பொறுத்தவரை தீட்டுப்பட்டவர்களாகக் கருதப்பட்டார்கள்” அல்லது “ஆசாரியத்துவத்திலிருந்து தகுதிநீக்கம் செய்யப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். அவர்களுடைய வம்சாவளியை உறுதிப்படுத்த முடியாததால், ஆசாரிய நிலைக்குத் தகுதியற்றவர்களாக நடத்தப்பட்டார்கள் என்ற கருத்தை எபிரெய வினைச்சொல் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட ஆசாரிய உரிமை கோரியவர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்.
- source_word: בִּקְשׁוּ
  choice: தேடினார்கள்
  rationale: בקשׁ என்பதன் ‘தேடு’ என்ற நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כְתָבָם
  choice: தங்களுக்குரிய ஆவணம்
  rationale: כְּתָב என்பது எழுத்துப்பூர்வமான ஆவணம் அல்லது பதிவு. இங்கு வம்சாவளியை உறுதிப்படுத்தும் அதிகாரப்பூர்வச் சான்றைக் குறிக்கிறது; அதன் துல்லியமான வடிவத்தை மொழிபெயர்ப்பு ஊகிக்கவில்லை.
- source_word: הַמִּתְיַחְשִׂים
  choice: வம்சாவளியின்படி பதிவு செய்யப்பட்டவர்கள்
  rationale: יחשׂ என்பதன் இத்பயேல் வடிவம் வம்சவழியை நிறுவுதல் அல்லது அதன்படி பதிவுசெய்யப்படுதல் என்ற நிர்வாகப் பொருளைத் தருகிறது.
- source_word: וְלֹא נִמְצָאוּ
  choice: ஆனால் அவர்கள் அதில் காணப்படவில்லை
  rationale: எபிரெயப் பன்மை வினை மனிதர்களையே இலக்கண எழுவாயாக வைத்திருக்கிறது. ‘அதில்’ என்பது சூழலில் உள்ள வம்சாவளிப் பதிவைக் குறிப்பிட்டு தமிழில் வாக்கியத்தைத் தெளிவாக்குகிறது.
- source_word: וַיְגֹאֲלוּ
  choice: தகுதியற்றவர்களாகக் கருதப்பட்டார்கள்
  rationale: இங்கு גאל வடிவம் தீட்டுடையவர்களாக அல்லது தகுதியற்றவர்களாக நடத்தப்படுதல் என்ற அரிய பொருளைக் கொண்டுள்ளது. முதன்மை உரை ஆசாரிய நிலைக்கான தகுதியிழப்பைத் தெளிவாகச் சொல்கிறது; ‘தீட்டு’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִן הַכְּהֻנָּה
  choice: ஆசாரியத்துவத்துக்கு
  rationale: כְּהֻנָּה என்பது ஆசாரியத்துவம் அல்லது ஆசாரியப் பதவியைக் குறிக்கிறது. ‘தகுதியற்றவர்கள்’ என்பதுடன் தமிழில் இயல்பாக இணைவதற்காக வேற்றுமை உருபு பொருளுக்கேற்ப மாற்றப்பட்டுள்ளது.
theological_decisions:
- issue: וַיְגֹאֲלוּ என்பதன் ஆசாரிய நிலை தொடர்பான பொருள்
  choice: ஆசாரியத்துவத்துக்குத் தகுதியற்றவர்களாகக் கருதப்பட்டார்கள்
  alternative: ஆசாரியத்துவத்தைப் பொறுத்தவரை தீட்டுப்பட்டவர்களாகக் கருதப்பட்டார்கள்; ஆசாரியத்துவத்திலிருந்து விலக்கப்பட்டார்கள்
  rationale: வினைச்சொல் தீட்டு, தகுதியின்மை, அதனால் ஏற்படும் விலக்கம் ஆகிய தொடர்புடைய கருத்துகளைத் தாங்குகிறது. வம்சாவளி உறுதிப்படுத்தப்படாததால் ஏற்பட்ட அதிகாரப்பூர்வத் தகுதியிழப்பை முதன்மை உரை தெரிவிக்கிறது; இது சடங்குசார் தீர்ப்பை அளவுக்கு மீறி வலியுறுத்தாமல், மூலத்தின் நுண்பொருளை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வம்சாவளி’, ‘ஆவணம்’, ‘ஆசாரியத்துவம்’ ஆகியவை இச்சூழலின் நிர்வாக மற்றும் சமயத் தன்மையைத் துல்லியமாகக் காக்கின்றன. எபிரெய மொழியின் பன்மை எழுவாய் ‘அவர்கள் அதில் காணப்படவில்லை’ என்று பாதுகாக்கப்பட்டுள்ளது.
