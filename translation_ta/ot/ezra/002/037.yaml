lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: நாடுதிரும்பியோரின் பட்டியலில் இச்சொல் ஒரு குடும்ப அல்லது குலக் குழுவைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெயச் சொல்லமைப்பை நேரடியாகப் பாதுகாக்கிறது; எண்ணிக்கை நபர்களைக் குறிக்கிறது என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אִמֵּר
  choice: இம்மேர்
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: 1,052
  rationale: எபிரெயில் ‘ஆயிரம், ஐம்பது, மற்றும் இரண்டு’ என வரும் மொத்த எண்ணிக்கை, பட்டியல் சூழலுக்கு ஏற்றவாறு எண்களால் தரப்பட்டுள்ளது.
