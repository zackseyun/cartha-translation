translation:
  language: ta
  text: உஸ்ஸாவின் மகன்கள்[a], பசேயாவின் மகன்கள், பேசாயின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இங்கு வரும் “மகன்கள்” என்ற சொல் நேரடி மகன்களை மட்டுமல்லாமல், விரிவான குடும்ப மரபினரையோ சந்ததியினரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: திரும்பிவந்தோரின் குடும்பப் பட்டியலான இச்சூழலில், בְּנֵי என்பது உடனடியாகப் பிறந்த மகன்களை மட்டும் அல்லாமல் ஒருவரின் குடும்ப மரபினர் அல்லது சந்ததியினரையும் குறிக்கலாம். நவீன தமிழில் ‘வழிவந்தவர்கள்’ என்பது அந்த விரிவான பொருளை இயல்பாகத் தருகிறது; மூன்று முறை வரும் எபிரெயக் கட்டமைப்பும் அப்படியே மீளுருவாக்கப்பட்டுள்ளது.
- source_word: עֻזָּא
  choice: ஊசா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: פָסֵחַ
  choice: பாசேயா
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்-உயிர் அமைப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது; இறுதி ח மென்மையான மூச்சொலியாக இருப்பதால் தனியாகக் கடின மெய்யொலி சேர்க்கப்படவில்லை.
- source_word: בֵסָי
  choice: பேசாய்
  rationale: எபிரெய தனிப்பெயரின் நீண்ட முதல் உயிரையும் இறுதி -ai ஒலியையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
