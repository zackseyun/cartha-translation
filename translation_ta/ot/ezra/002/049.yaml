translation_notes:
  register: திரும்பிவந்தோரின் பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற சொல்லால் ஏற்படக்கூடிய உடனடி உயிரியல் உறவு என்ற குறுகிய புரிதலைத் தவிர்த்து, பட்டியல் சூழலின் குடும்ப/சந்ததி பொருளை ‘வழிவந்தவர்கள்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
