source:
  edition: WLC
  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: ta
  text: 'வாசற்காவலர்களின் சந்ததியினர்: சல்லூமின் சந்ததியினர், ஆத்தேரின் சந்ததியினர், தல்மோனின் சந்ததியினர், அக்கூபின் சந்ததியினர், ஹதீதாவின் சந்ததியினர், சோபாயின் சந்ததியினர்—மொத்தம் நூற்று முப்பத்தொன்பது பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: வம்ச மற்றும் திரும்பிவந்தோர் பட்டியல் சூழலில் இச்சொல் நேரடியான மகன்களை மட்டும் அல்லாமல், ஒருவரின் வம்சத்தையோ குடும்பக் குழுவையோ குறிக்கிறது. ஆகவே இயல்பான நவீன தமிழில் ‘சந்ததியினர்’ என்று வழங்கப்பட்டது.
- source_word: הַשֹּׁעֲרִים
  choice: வாசற்காவலர்கள்
  rationale: ஆலய வாசல்களைக் காத்து அங்கு பணியாற்றியவர்களைக் குறிக்கும் சொல். ‘வாசற்காவலர்கள்’ என்பது பணியின் தன்மையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரேய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: אָטֵר
  choice: ஆத்தேர்
  rationale: எபிரேய தனிப்பெயரின் மெய் மற்றும் உயிர் ஒலிகளை நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்த்தது.
- source_word: טַלְמוֹן
  choice: தல்மோன்
  rationale: மசோரா உயிர்க்குறிப்புகளின் அடிப்படையில் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַקּוּב
  choice: அக்கூப்
  rationale: நடுவிலுள்ள இரட்டித்த மெய்யொலியையும் நீண்ட உயிரொலியையும் காட்டும் தமிழாக்கம்.
- source_word: חֲטִיטָא
  choice: அத்தித்தா
  rationale: எபிரேய ח ஒலிக்கு தமிழில் துல்லிய இணை இல்லாததால் இயல்பாக வாசிக்கக்கூடிய ‘அ’ தொடக்கத்துடன், பெயரின் பிற ஒலிக்கூறுகளைப் பிரதிபலித்து ஒலிபெயர்க்கப்பட்டது.
- source_word: שֹׁבָי
  choice: சோபாய்
  rationale: மசோரா வாசிப்பில் காணப்படும் இறுதி இரட்டை உயிரொலியைப் பிரதிபலிக்கும் தமிழ்ச் சொல்வடிவம்.
- source_word: הַכֹּל
  choice: மொத்தம்
  rationale: முன்னர் பட்டியலிடப்பட்ட குழுக்களின் கூட்டுத்தொகையை அறிவிக்கும் கணக்கெடுப்புச் சூழலில் ‘மொத்தம்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: நூற்று முப்பத்தொன்பது பேர்
  rationale: எண்ணை நவீனத் தமிழின் வழக்கமான கூட்டெண் வடிவில் வழங்கி, மனிதர்களின் எண்ணிக்கை என்பது தெளிவாக ‘பேர்’ சேர்க்கப்பட்டது.
