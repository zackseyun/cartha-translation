translation_notes:
  register: திரும்பிவந்தோரின் அதிகாரப்பூர்வப் பட்டியல் நடையைப் பேணும் வகையில் சுருக்கமான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற சொற்சொல்லான வடிவம் நேரடி தந்தை–மகன் உறவைத் தவறாக உணர்த்தக்கூடும் என்பதால் பட்டியல் சூழலுக்கேற்ற ‘சந்ததியினர்’ தேர்ந்தெடுக்கப்பட்டது. பெயர்கள் மூல எபிரேய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
