  register: மக்கள்தொகைப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பட்டியல் அமைப்பைத் தெளிவாகக் காட்ட முக்காற்புள்ளி இடப்பட்டுள்ளது.
