  language: ta
  text: 'மிக்மாஸ் ஊரைச் சேர்ந்த ஆண்கள்: நூற்று இருபத்திரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஊரைச் சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் பன்மை இணைப்புவடிவம். இந்த மக்கள்தொகைப் பட்டியல் சூழலில், அடுத்து குறிப்பிடப்படும் ஊருடன் தொடர்புடைய ஆண்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் துல்லியமாகவும் இருக்க ‘ஊரைச் சேர்ந்த ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִכְמָס
  choice: மிக்மாஸ்
  rationale: இது ஓர் ஊரின் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: நூற்று இருபத்திரண்டு
  rationale: எபிரெய எண்ணமைப்பு 100 + 20 + 2 என்று நேரடியாக உள்ளது; நவீனத் தமிழின் இயல்பான எண்ணுருவில் தரப்பட்டது.
