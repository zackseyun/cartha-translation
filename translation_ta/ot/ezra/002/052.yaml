    text: எபிரெயப் பட்டியல் வழக்கில் בְּנֵי என்பது ஒவ்வொரு இடத்திலும் ‘மகன்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது உடனடிப் புதல்வர்களை மட்டுமல்லாமல் ஒரு குடும்ப அல்லது குல வழியைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
