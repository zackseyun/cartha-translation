lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: திரும்பிவந்தோரின் இந்தப் பட்டியலில் இச்சொல் உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஒரு குடும்ப அல்லது குல வழியைச் சேர்ந்தவர்களைக் குறிக்கும். ஆகவே இயல்பான தமிழில் ‘சந்ததியினர்’ என வழங்கப்பட்டது.
- source_word: בַצְלוּת
  choice: பஸ்லூத்
  rationale: எபிரெயப் பெயரின் மெய்யொலிகளை நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்த்த வடிவம்.
- source_word: מְחִידָא
  choice: மெகிதா
  rationale: எபிரெய மொழியிலுள்ள ח ஒலியை இப்பெயரில் தமிழுக்கு இயல்பாக ‘க’ என அண்மைப்படுத்தி ஒலிபெயர்த்தது.
- source_word: חַרְשָׁא
  choice: அர்சா
  rationale: தொடக்க ח ஒலியை உயிரொலியுடன் இயல்பாகவும், שׁ ஒலியை ‘ச’ என்றும் தமிழில் ஒலிபெயர்த்தது; இறுதி அலெஃப் தனி மெய்யொலியாகக் காட்டப்படவில்லை.
