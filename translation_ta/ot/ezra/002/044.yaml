translation:
  language: ta
  text: கேரோஸின் மகன்கள்[a], சியாகாவின் மகன்கள், பாதோனின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப்பட்டியல்களில் “மகன்கள்” என்பது நேரடி ஆண் பிள்ளைகளை மட்டுமல்லாமல், “வழித்தோன்றல்கள்” அல்லது ஒரு குடும்ப வழியைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய வம்சப்பட்டியல் சூத்திரத்தின் வடிவத்தைப் பேணுகிறது. இச்சூழலில் இது நேரடி ஆண் பிள்ளைகளை மட்டுமல்லாமல், வழித்தோன்றல்களையோ அந்தக் குடும்பப் பிரிவைச் சேர்ந்தவர்களையோ குறிக்கக்கூடும்; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: קֵרֹס
  choice: கேரோஸ்
  rationale: மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்ட தனிப்பெயர்.
- source_word: סִיעֲהָא
  choice: சியாகா
  rationale: மசோரா உரையின் முழு பெயர்வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு; இணையான மரபுகளில் காணப்படும் சுருக்கமான வடிவம் இங்கு ஏற்கப்படவில்லை.
- source_word: פָדוֹן
  choice: பாதோன்
  rationale: எபிரெய உயிர்க்குறிப்புடன் கூடிய பெயர்வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
