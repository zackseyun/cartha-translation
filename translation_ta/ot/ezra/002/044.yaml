  register: திரும்பிவந்த குடும்பக் குழுக்களின் பட்டியல் நடையைப் பேணும் வகையில் சுருக்கமான, இயல்பான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் மீண்டும் மீண்டும் வரும் ‘மகன்கள்’ என்ற அமைப்பு அப்படியே பேணப்பட்டுள்ளது.
