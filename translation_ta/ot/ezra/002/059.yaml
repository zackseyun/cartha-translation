  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: ta
  text: தெல்-மெலக், தெல்-ஹர்ஷா, கெரூப், அதான், இம்மேர் ஆகியவற்றிலிருந்து வந்தவர்கள் இவர்களே. ஆனால், தங்கள் தந்தைவழிக் குடும்பத்தையும் தங்கள் சந்ததியையும், தாங்கள் இஸ்ரயேலரைச் சேர்ந்தவர்களா என்பதையும் அவர்களால் தெரிவிக்க முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “தங்கள் தந்தையரின் வீட்டையும் தங்கள் விதையையும்.” இந்த எபிரெயச் சொற்றொடர் தந்தைவழி மூதாதையர் குடும்பத்தையும் அவர்களுடைய சந்ததியையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: வந்தவர்கள்
  rationale: நாடு திரும்பியவர்களின் பட்டியல் என்ற சூழலில், எபிரெயச் சொல்லின் ‘மேலேறி வருதல்’ என்ற புவியியல் மரபுத்தொடரைத் தமிழில் இயல்பாக ‘வந்தவர்கள்’ என வழங்குகிறது; ‘திரும்பி வந்தவர்கள்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: தெல்-மெலாஹ், தெல்-ஹர்ஷா, கெரூப், அத்தான், இம்மேர் ஆகிய இடங்களிலிருந்து
  rationale: இவை இடப்பெயர்கள் அல்லது குலப்பெயர்களாக இருக்கக்கூடிய பெயர்கள் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. இவ்வசனத்தின் புறப்படும் இடங்களைக் குறிக்கும் சூழல் காரணமாக ‘ஆகிய இடங்களிலிருந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: தெரிவித்து ... உறுதிப்படுத்த முடியவில்லை
  rationale: நிர்வாக மற்றும் வம்சாவளிப் பட்டியல் சூழலில் נגד என்பது தகவலை அறிவித்தல் அல்லது முன்வைத்தல் என்ற பொருளைக் கொண்டுள்ளது. முழு வாக்கியத்தில் அவர்களின் இஸ்ரயேல் வம்சத் தொடர்பை நிலைநாட்ட இயலாமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֵּית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பம்
  rationale: சொல்லுக்கு சொல் ‘தங்கள் தந்தையரின் வீடு’; இங்கு தந்தைவழி மூதாதையர் குடும்பம் அல்லது வம்சக் குழுவைக் குறிக்கும் தொழில்நுட்பமான மரபுவழிச் சொற்றொடர்.
- source_word: וְזַרְעָם
  choice: தங்கள் வம்சம்
  rationale: זֶרַע என்பதன் அடிப்படை உருவகம் ‘விதை’; இங்கு சந்ததி அல்லது மரபுவழியைக் குறிக்கிறது. ‘வம்சம்’ பட்டியலின் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: தாங்கள் இஸ்ரயேலைச் சேர்ந்தவர்களா
  rationale: אִם இங்கு ‘ஆகிறார்களா/இல்லையா’ என்ற உறுதியின்மையை வெளிப்படுத்துகிறது. ‘இஸ்ரயேலைச் சேர்ந்தவர்கள்’ என்பது இங்கு நாட்டுக் குடியுரிமையை மட்டும் அல்லாமல் இஸ்ரயேல் வம்சத் தொடர்பைக் குறிக்கிறது.
