  text: 'The sons of Azmaveth: forty-two[a].'
translation:
  language: ta
  text: 'அஸ்மாவேத்தின் மகன்கள்: நாற்பத்திரண்டு பேர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அஸ்மாவேத்தின் வழித்தோன்றல்கள்.’ எபிரெய மொழியில் ‘மகன்கள்’ என்பது உடனடியாகப் பிறந்த ஆண் பிள்ளைகளை மட்டுமல்லாமல், விரிவான குடும்ப மரபினரையோ குலத்தினரையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம். இத்தகைய வம்ச/மக்கள்தொகைப் பட்டியலில் இது நேரடி மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையோ ஒரு குடும்பக் குழுவினரையோ குறிக்கலாம். மூலத்தின் வடிவத்தைப் பாதுகாக்க முதன்மை உரையில் ‘மகன்கள்’ என்றும், பரந்த பொருளை அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: இது ஒரு இயற்பெயர்; பொருளாக்காமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. இப்பட்டியலில் இது மூதாதையின் பெயரையோ அந்தக் குழுவுடன் தொடர்புடைய இடத்தையோ சுட்டக்கூடும்.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: நாற்பத்திரண்டு பேர்
  rationale: எபிரெய எண்ணான ‘நாற்பது மற்றும் இரண்டு’ என்பது இயல்பான நவீன தமிழில் ‘நாற்பத்திரண்டு’ என வழங்கப்படுகிறது. மனிதர்களின் எண்ணிக்கை என்பதைக் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
