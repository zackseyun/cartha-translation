  text: the sons of Rezin[a], the sons of Nekoda, the sons of Gazzam;
translation:
  language: ta
  text: ரெசீனின் மகன்கள்[a], நெகோதாவின் மகன்கள், கஸ்ஸாமின் மகன்கள்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு திரும்பத் திரும்ப வரும் ‘மகன்கள்’ என்பது உடனடியாகப் பிறந்த ஆண் பிள்ளைகளை மட்டுமல்லாமல், ‘வழித்தோன்றல்கள்’ அல்லது ஒரு குடும்பக் குழுவினரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இத்தகைய வம்சப் பட்டியலில் இது ஒரு குடும்பத்தையோ குலவழியினரையோ குறிக்கக்கூடும்; எனினும் எபிரெயச் சொல்லின் வடிவத்தைத் தெளிவாகப் பாதுகாக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רְצִין
  choice: ரெசீன்
  rationale: இது ஒரு பெயர்; WLC உயிர்க்குறிப்புகளுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: נְקוֹדָא
  choice: நெகோதா
  rationale: இது ஒரு பெயர்; எபிரெய வடிவத்தின் ஒலியமைப்பைப் பின்பற்றி ஒலிபெயர்க்கப்பட்டது.
- source_word: גַזָּם
  choice: கஸ்ஸாம்
  rationale: இது ஒரு பெயர்; זּ-இன் வலிய இரட்டிப்பு ஒலியை ‘ஸ்ஸ’ என்றும் நீண்ட உயிரை ‘ஆ’ என்றும் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
