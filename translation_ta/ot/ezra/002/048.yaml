  source_fidelity: மூல எபிரெயத்தின் மும்முறை வரும் בְּנֵי ... அமைப்பும், பெயர்களின் வரிசையும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘மகன்கள்’ என்பது இவ்வகை வம்ச/குடும்பப் பட்டியலில் உள்ள எபிரெயச் சொல்லின் நேரடியான இணையாகும்.
  naturalness: ‘ரெசீனின் மகன்கள், நெகோதாவின் மகன்கள், கஸ்ஸாமின் மகன்கள்’ என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ள பட்டியல் நடை. நிறுத்தற்குறியும் பட்டியல் தொடர்வதைக் குறிக்க ஏற்றது.
  terminology: பெயர்கள் ஒலிபெயர்ப்பாகச் சரியாகக் கையாளப்பட்டுள்ளன. ‘மகன்கள்’ என்ற சொல்லுக்கான அடிக்குறிப்பு, உடனடிப் பிறந்த ஆண் பிள்ளைகள் என்ற வரம்பைத் திணிக்காமல் குடும்ப வழித்தோன்றல்/குழு என்ற சாத்தியத்தைத் தக்கவைக்கிறது.
