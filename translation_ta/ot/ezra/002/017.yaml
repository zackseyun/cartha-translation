translation_notes:
  register: திரும்பிவந்த குடும்பங்களின் கணக்குப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நவீனத் தமிழ் நடை. ‘மகன்கள்’ என்பது மூலத்தின் வடிவைத் தக்கவைத்தாலும், இச்சூழலில் குடும்பத்தார் அல்லது வழித்தோன்றல்கள் என்ற விரிந்த பொருளையும் ஏற்கிறது.
