translation:
  language: ta
  text: பெசாயின் மகன்கள், முந்நூற்று இருபத்து மூன்று பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தோரின் பட்டியலில் குடும்பம் அல்லது குலத்தைச் சேர்ந்த ஆண் வழியினரைக் குறிக்கும் எபிரெயச் சொல்லை, பட்டியல் நடைக்கு ஏற்ற மரபான மற்றும் தெளிவான தமிழில் மொழிபெயர்க்கிறது; இங்கு நேரடி மகன்கள் மட்டுமல்லாமல் வழித்தோன்றல்களையும் உள்ளடக்கக்கூடும்.
- source_word: בֵצָי
  choice: பெசாய்
  rationale: எபிரெயப் பெயரான בֵצָי என்பதன் ஒலிப்பை நவீனத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு பெயர்த்தெழுதுகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: முந்நூற்று இருபத்து மூன்று பேர்
  rationale: எபிரெய எண்ணிக்கையை இயல்பான நவீனத் தமிழில் தருகிறது; பட்டியலிடப்பட்ட மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
