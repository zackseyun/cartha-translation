translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டது. ‘மகன்கள்’ என்ற சொற்சொல் வடிவத்திற்கு பதிலாக, இடப்பெயர்களைக் குறிக்கும் சூழலைத் தெளிவாக வெளிப்படுத்தும் ‘ஊர்களைச் சேர்ந்தவர்கள்’ பயன்படுத்தப்பட்டது.
