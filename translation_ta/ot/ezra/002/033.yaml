    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: ஆகிய ஊர்களைச் சேர்ந்தவர்கள்
  rationale: திரும்பிவந்தோரின் இந்தப் பட்டியலில் בְּנֵי என்பது உடனடிப் பிள்ளைகளை மட்டும் குறிக்காமல், குறிப்பிடப்பட்ட ஊர்களோடு தொடர்புடைய மக்கள் குழுவையும் குறிக்கலாம். தொடர்ந்து வரும் மூன்றும் இடப்பெயர்கள் என்பதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לֹד
  choice: லோத்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு. பிற்கால வடிவமான ‘லித்தா’ முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
- source_word: חָדִיד
  choice: காதீத்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: וְאוֹנוֹ
  choice: ஓனோ
  rationale: וְ இணைப்பின் பொருள் தமிழ் பட்டியல் அமைப்பில் ‘ஆகிய’ என்பதால் வெளிப்படுகிறது; இடப்பெயர் ஒலிப்பெயர்க்கப்பட்டது.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: எழுநூற்று இருபத்தைந்து பேர்
  rationale: எபிரெய எண்ணின் துல்லிய மதிப்பு 725. பட்டியலில் எண்ணப்படுவது மக்கள் என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
