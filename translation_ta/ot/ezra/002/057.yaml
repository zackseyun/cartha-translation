  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: ta
  text: செபத்தியாவின் மகன்கள், ஹத்தீலின் மகன்கள், பொகெரெத்-ஹஸ்ஸெபாயீமின்[a] மகன்கள், ஆமியின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செபாயீமைச் சேர்ந்த பொகெரெத்.” எபிரெயச் சொற்றொடரை ஒரு கூட்டுக் குடும்பப்பெயராகவோ, அல்லது ஒரு பெயருக்குப் பின்வரும் தகுதிப்படுத்தும் கூறாகவோ வாசிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: இந்த வம்சப் பட்டியல் சூழலில் இது நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களையும் குறிக்கலாம். ஆகவே, எபிரெயச் சொல்லின் உறவுப் பொருளையும் பட்டியலின் இயல்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁפַטְיָה
  choice: செபத்தியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: חַטִּיל
  choice: ஹத்தீல்
  rationale: தனிநபர் அல்லது குலப்பெயராக இருப்பதால் பொருள் மொழிபெயர்க்காமல் எபிரெய ஒலிவடிவத்திற்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: பொகெரெத்-ஹசெபாயிம்
  rationale: இரு கூறுகளும் நெருக்கமாக இணைந்த கூட்டுக் குடும்பப்பெயராக இருக்கக்கூடும் என்பதால் இணைப்புக்குறியுடன் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; வேறு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָמִי
  choice: ஆமி
  rationale: தனிநபர் அல்லது குலப்பெயராக இருப்பதால் எபிரெய ஒலிவடிவத்திற்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
