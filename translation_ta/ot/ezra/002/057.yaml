translation_notes:
  register: நவீன, கண்ணியமான பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. בְּנֵי என்பதற்கு நேரடி மகன்கள் என்ற வரம்பைத் தவிர்க்க ‘வழித்தோன்றல்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான பட்டியல் அமைப்பும் பெயர்களின் ஒலிவடிவமும் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு அது சார்ந்த தெளிவற்ற பெயருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
