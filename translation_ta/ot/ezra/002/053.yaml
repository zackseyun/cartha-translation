translation:
  language: ta
  text: பர்கோசின் சந்ததியினர், சீசராவின் சந்ததியினர், தாமாஹின் சந்ததியினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: திரும்பிவந்தவர்களின் குலப்பட்டியலில் இச்சொல் நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்பம் அல்லது குலவழியைச் சேர்ந்தவர்களையும் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘சந்ததியினர்’ என வழங்கப்பட்டது.
- source_word: בַרְקוֹס
  choice: பர்கோஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; பெயரின் தொடக்க மெய்யொலியைத் தமிழில் இயல்பாக ‘ப’ என வழங்குகிறது.
- source_word: סִיסְרָא
  choice: சிசரா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; இங்கு அது குலமுன்னோரின் பெயராக வருகிறது.
- source_word: תָמַח
  choice: தேமா
  rationale: மசோரா உயிர்க்குறிப்புகளின்படி எபிரெய தனிப்பெயர் ஒலிப்பெயர்க்கப்பட்டது.
