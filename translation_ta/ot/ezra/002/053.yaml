translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. ‘மகன்கள்’ என்பதால் நேரடி புதல்வர்கள் என்ற தவறான குறுகிய பொருள் தோன்றாமல் இருக்க ‘சந்ததியினர்’ பயன்படுத்தப்பட்டது.
