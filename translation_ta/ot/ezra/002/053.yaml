revisions:
- from: பர்கோசின் சந்ததியினர், சிசராவின் சந்ததியினர், தேமாவின் சந்ததியினர்.
  to: பர்கோசின் சந்ததியினர், சீசராவின் சந்ததியினர், தாமாஹின் சந்ததியினர்.
  rationale: 'The list formula is retained unchanged. The proper names are corrected directly against the Hebrew vocalization and consonantal form: סִיסְרָא → «சீசரா» and תָמַח → «தாமாஹ்». No footnote is needed, since these are straightforward transliteration corrections rather than a textual uncertainty.'
  reviewer_model: gpt-5.6-terra
