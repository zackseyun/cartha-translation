  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד כֹּהֵ֖ן לְ/אוּרִ֥ים וּ/לְ/תֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: ta
  text: அப்போது ஆளுநர்[a] அவர்களிடம், ஊரீமும் தும்மீமும்[c] கொண்ட ஓர் ஆசாரியன் தோன்றும்வரை அவர்கள் மிகவும் பரிசுத்தமானவற்றிலிருந்து[b] உண்ணக் கூடாது என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திர்ஷாத்தா’; இது ஒரு பாரசீக நிர்வாகப் பட்டம்.
    reason: lexical_alternative
  - marker: b
    text: இது மிகவும் பரிசுத்தமானவையாகக் கருதப்பட்ட காணிக்கைகளில் ஆசாரியர்களுக்குரிய உணவுப் பங்குகளைக் குறிக்கிறது; ‘மகா பரிசுத்த ஸ்தலம்’ எனப்படும் ஆலயத்தின் உட்புற இடத்தைக் குறிக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: ஊரீமும் தும்மீமும் ஆசாரியர் கடவுளிடம் விசாரிப்பதற்குப் பயன்படுத்திய பரிசுத்த சாதனங்கள்; அவற்றின் சரியான வடிவமும் பயன்படுத்தப்பட்ட முறையும் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: ஆளுநர்
  rationale: இது பாரசீக நிர்வாகப் பட்டம். ஒலிபெயர்ப்பை மட்டும் தராமல், இன்றைய வாசகர்களுக்குப் பொருள் தெளிவாக இருக்கும்படி பதவிப் பெயராக மொழிபெயர்க்கப்பட்டது; மூலப் பட்டம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: அவர்கள் ... உண்ணக் கூடாது என்று
  rationale: ஆளுநர் கூறிய மறைமுகக் கட்டளையின் உள்ளடக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: மிகவும் பரிசுத்தமானவற்றிலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் உயர்நிலைப் பொருளைப் பாதுகாக்கிறது. சூழலில் இது உண்ணத்தக்க பரிசுத்த காணிக்கைப் பங்குகளைக் குறிக்கிறது; ஆலயத்தின் உட்புற இடமான மகா பரிசுத்த ஸ்தலத்தைக் குறிக்கவில்லை.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: ஓர் ஆசாரியன் தோன்றும்வரை
  rationale: தடை நீடிக்கும் எதிர்கால எல்லையைத் தெளிவாகக் காட்டுகிறது. עמד என்பதன் ‘எழுந்து நிற்றல்/முன்வருதல்’ கருத்தை இச்சூழலில் இயல்பான தமிழில் ‘தோன்றுதல்’ என வழங்குகிறது.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: ஊரீமும் தும்மீமும் கொண்ட
  rationale: துல்லியமான வடிவமும் செயல்முறையும் உறுதியாக அறியப்படாத இந்த ஆசாரிய விசாரணைச் சாதனங்களின் தொழில்நுட்பப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. לְ என்ற முன்னிடைச்சொல் இங்கு ஆசாரியன் அவற்றுடன் செயல்படுவதை இயல்பாகக் குறிக்கும் வகையில் வழங்கப்பட்டது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்பதன் இச்சூழலுக்குரிய பொருள்
  choice: ஆசாரியர்கள் உண்ணும் மிகவும் பரிசுத்தமான காணிக்கைப் பங்குகள்
  alternative: மகா பரிசுத்த ஸ்தலம் என்ற இடம்
  rationale: இங்கு விவாதிக்கப்படுவது ஆசாரிய வம்சாவளி உறுதிப்படுத்தப்படாதவர்கள் பரிசுத்த உணவை உண்ணலாமா என்பதே. ஆகவே உண்ணுதல் என்ற வினையுடன் வரும் இச்சொற்றொடர் உணவாகிய காணிக்கைப் பங்குகளைக் குறிக்கிறது; ஆலயத்தின் உட்புற இடத்தைக் குறிக்கவில்லை.
- issue: ஊரீம், தும்மீம் என்பவற்றை வழங்கும் முறை
  choice: தொழில்நுட்பப் பெயர்களாக ஒலிபெயர்த்தல்
  alternative: ‘ஒளிகள் மற்றும் நிறைவுகள்’ என்று சொற்பிறப்பியல் அடிப்படையில் மொழிபெயர்த்தல்
  rationale: அவற்றின் சரியான வடிவமும் பயன்படுத்தப்பட்ட முறையும் விவாதத்திற்குரியவை. பொருளை ஊகித்து மொழிபெயர்ப்பதைவிட ஒலிபெயர்ப்பு மூலத்தின் வழிபாட்டு தனித்தன்மையையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், நிர்வாகத் தீர்ப்புக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘பரிசுத்தமான’ போன்ற பரவலாகப் புரியக்கூடிய வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தெளிவற்ற பழமையான தொழில்நுட்பச் சொற்கள் அடிக்குறிப்புகளால் விளக்கப்பட்டுள்ளன.
