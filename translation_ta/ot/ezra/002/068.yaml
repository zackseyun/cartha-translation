base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: ta
  text: தந்தைவழிக் குடும்பத் தலைவர்களில் சிலர்[a] எருசலேமிலுள்ள யாவேயின் ஆலயத்திற்கு வந்தபோது, கடவுளின் ஆலயத்தை அதன் உரிய இடத்தில் நிறுவுவதற்காகத் தாமாக முன்வந்து காணிக்கைகள் கொடுத்தார்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூதாதையர் குடும்பத் தலைவர்களில் சிலர்.” எபிரெயச் சொற்றொடர் இஸ்ரவேலின் தந்தைவழி மரபுக் குடும்ப அலகுகளின் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனமுவந்து காணிக்கைகள் கொடுத்தார்கள்.” எபிரெய வினை, கொடுத்தல் கட்டாயமின்றித் தன்னார்வமாக நடந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதன் அடித்தளத்தின் மேல் நிறுவுவதற்காக.” எபிரெயச் சொல் ஆலயத்தின் நிர்ணயிக்கப்பட்ட இடத்தையோ அதன் அடித்தளத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்களில் சிலர்
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; ஆகவே எல்லாத் தலைவர்களும் அல்ல, அவர்களில் சிலர். רָאשֵׁי הָאָבוֹת என்பது இஸ்ரவேலின் தந்தைவழி மரபுக் குடும்ப அலகுகளின் தலைவர்களைக் குறிக்கிறது.
- source_word: בְּבוֹאָם
  choice: வந்தபோது
  rationale: בְּ + வினையெச்சப் பெயர் காலப் பொருளைத் தருவதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְבֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்திற்கு
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது; தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது. יהוה என்பது தனிப்பெயராக ‘யெகோவா’ என வழங்கப்பட்டது.
- source_word: הִתְנַדְּבוּ
  choice: தாமாக முன்வந்து காணிக்கைகள் கொடுத்தார்கள்
  rationale: נדב என்பதன் Hitpael வடிவம் விருப்பத்துடன், கட்டாயமின்றிக் கொடுப்பதை வலியுறுத்துகிறது; சூழல் காணிக்கை அளிப்பதைக் காட்டுகிறது.
- source_word: לְבֵית הָאֱלֹהִים
  choice: கடவுளின் ஆலயத்தை
  rationale: לְ இங்கு கொடையின் நோக்கத்துடன் தொடர்புடையது. தமிழில் அடுத்துள்ள நோக்கவாக்கியத்தோடு இயல்பாக இணைய, ஆலயத்தை எழுப்புவதற்காக என அமைக்கப்பட்டது.
- source_word: לְהַעֲמִידוֹ
  choice: எழுப்புவதற்காக
  rationale: עמד என்பதன் Hiphil வடிவம் ‘நிற்கச் செய்தல், நிறுவுதல், எழுப்புதல்’ எனப் பொருள்படும்; ஆலய மறுகட்டுமானச் சூழலில் ‘எழுப்புதல்’ பொருத்தமானது.
- source_word: עַל מְכוֹנוֹ
  choice: அதன் நிலையான இடத்தில்
  rationale: מָכוֹן என்பது அடித்தளத்தையோ நிர்ணயிக்கப்பட்ட இடத்தையோ குறிக்கலாம். மூலத்தின் ambiguity-ஐ மிகையாகத் தீர்மானிக்காமல் locative sense பிரதான உரையில் வைக்கப்பட்டது; மாற்று ‘அடித்தளத்தின் மேல்’ அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. நவீனத் தமிழ்க் கிறிஸ்தவ வாசகர்களுக்கு பரவலாக அறிமுகமான தனிப்பெயர் வடிவமாக ‘யெகோவா’ பயன்படுத்தப்பட்டது; அதை ‘கர்த்தர்’ எனப் பட்டப்பெயராக்கவில்லை.
- issue: הָאָבוֹת குறிக்கும் சமூக அமைப்பு
  choice: தந்தைவழிக் குடும்பங்கள்
  alternative: மூதாதையர் குடும்பங்கள்
  rationale: இது பொதுவாகக் குடும்பங்கள் என்பதை மட்டும் அல்லாமல், ஆண் மூதாதையரை அடிப்படையாகக் கொண்ட இஸ்ரவேலிய உறவமைப்பைக் குறிக்கிறது; எனவே அந்த வரலாற்றுச் சமூகத் தன்மை பாதுகாக்கப்பட்டது.
- issue: מְכוֹנוֹ என்பதன் பொருள்
  choice: அதன் நிலையான இடத்தில்
  alternative: அதன் அடித்தளத்தின் மேல்
  rationale: இச்சொல் நிர்ணயிக்கப்பட்ட தலம் அல்லது அடித்தளம் இரண்டையும் குறிக்கக்கூடும். பிரதான உரை இடப்பொருளை எடுத்தாலும், மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வீடு’ என்பதற்குப் பதில் சூழலுக்கேற்ற ‘ஆலயம்’ பயன்படுத்தப்பட்டது. மூலத்தின் தந்தைவழிச் சமூகக் குறிப்பு மற்றும் מָכוֹן என்பதிலுள்ள பொருள் ambiguity அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டன.
