translation:
  language: ta
  text: 'பாடகர்கள்: ஆசாப்பின் மகன்கள், நூற்று இருபத்தெட்டுப் பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר என்பதிலிருந்து வந்த இப்பெயரெச்ச வடிவம் பாடுகிறவர்களைக் குறிக்கிறது. பட்டியல் சூழலில் “பாடகர்கள்” என்பது நேரடியானதும் இயல்பானதும்; “இசைக்கலைஞர்கள்” என்பது பொருளைத் தேவையின்றி விரிவுபடுத்தும்.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்ச மற்றும் குழுப் பட்டியல்களில் בְּנֵי ஒரு குடும்ப அல்லது மரபுவழிக் குழுவை அறிமுகப்படுத்துகிறது. “மகன்கள்” எபிரெய வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; சூழலில் வழித்தோன்றல்களையும் உள்ளடக்கக்கூடும் என்ற இயல்பான விரிவைத் தடுக்காது.
- source_word: אָסָף
  choice: ஆசாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகக் கொண்டுவரும் வழக்கமான எழுத்துப்பெயர்ப்பு.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: நூற்று இருபத்தெட்டுப் பேர்
  rationale: எபிரெய எண்ணிக்கை 100 + 20 + 8 என நேரடியாக அமைந்துள்ளது. மனிதர்களை எண்ணும் தமிழ் வழக்கிற்கேற்ப “பேர்” சேர்க்கப்பட்டுள்ளது.
