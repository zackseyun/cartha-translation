  register: நவீன நிலையான தமிழில், பட்டியலுக்குரிய சுருக்கத்தையும் மரியாதையான வேதாகம நடையையும் காக்கும் மொழிபெயர்ப்பு. எபிரெய வசனத்தின் தலைப்புப்போன்ற அமைப்பைத் தக்கவைக்க முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
