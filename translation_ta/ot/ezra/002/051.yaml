  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur.
translation:
  language: ta
  text: பக்பூக்கின் மகன்கள்[a], ஹகூபாவின் மகன்கள், ஹர்ஹூரின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ஒவ்வொரு முறையும் வரும் “மகன்கள்” என்பதை “வழிவந்தவர்கள்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய வம்சவழிச் சொற்றொடர் நேரடி மகன்களை மட்டுமல்லாமல் ஒரு குடும்ப வழியினரையோ குலத்தினரையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம். வம்சப் பட்டியல் சூழலில் இது நேரடி மகன்களை மட்டுமல்லாமல் ஒரு குடும்ப வழியினரையோ குலத்தினரையோ குறிக்கலாம்; மூலமொழியின் வடிவத்தைப் பேணுவதற்காக முதன்மை உரையில் ‘மகன்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: בַקְבּוּק
  choice: பக்பூக்
  rationale: எபிரெய தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் இயன்றவரை நெருக்கமாக ஒலிபெயர்த்த வடிவம்.
- source_word: חֲקוּפָא
  choice: ஹகூபா
  rationale: எபிரெய தனிப்பெயரை மொழிபெயர்க்காமல், தொடக்க ח ஒலியையும் நடுவிலுள்ள நீண்ட உயிரொலியையும் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַרְחוּר
  choice: ஹர்ஹூர்
  rationale: இரண்டு ח ஒலிகளையும் பெயரின் உயிரமைப்பையும் இயன்றவரை வெளிப்படுத்தும் தமிழ் ஒலிபெயர்ப்பு.
