  source_fidelity: மூல எபிரெய உரையில் மூன்று முறை வரும் בְּנֵי (“...இன் மகன்கள்”) என்ற வம்சப் பட்டியல் அமைப்பும், மூன்று தனிப்பெயர்களும் துல்லியமாகப் பிரதிபலிக்கப்பட்டுள்ளன. பெயர்களின் வரிசையும் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: “பக்பூக்கின் மகன்கள், ஹகூபாவின் மகன்கள், ஹர்ஹூரின் மகன்கள்” என்பது நவீன தரத் தமிழில் தெளிவான, இயல்பான பட்டியல் நடை. இத்தகைய வம்சப் பட்டியல் சூழலுக்கு “மகன்கள்” பொருத்தமானது.
  terminology: “மகன்கள்” என்பது בְּנֵי என்பதற்கான முறையான நேரடி இணை. அடிக்குறிப்பு இது உடனடியான மகன்களை மட்டும் அல்லாமல் குடும்ப/குல வழியினரையும் குறிக்கலாம் என்பதை சரியாக விளக்குகிறது. பக்பூக், ஹகூபா, ஹர்ஹூர் என்ற ஒலிபெயர்ப்புகள் மூலப் பெயர்களுக்கும் ஆங்கில POB தடத்திற்கும் ஏற்றவை.
