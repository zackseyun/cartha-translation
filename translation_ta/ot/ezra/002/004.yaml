  language: ta
  text: 'செபத்தியாவின் வழிவந்தவர்கள்: முந்நூற்று எழுபத்திரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: வம்சப் பட்டியல் சூழலில் בְּנֵי என்பது நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்பத் தலைவர் அல்லது மூதாதையிடமிருந்து வந்த குடும்பக் குழுவினரையும் குறிக்கலாம். இங்கு எண்ணப்படும் சமூகக் குழுவை நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்க ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: שְׁפַטְיָה
  choice: செபத்தியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் காட்டும் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: שְׁלֹשׁ מֵאוֹת שִׁבְעִים וּשְׁנָיִם
  choice: முந்நூற்று எழுபத்திரண்டு பேர்
  rationale: எபிரெய எண்ணிக்கையை இயல்பான நவீன தமிழ் எண்ணுருவில் மொழிபெயர்க்கிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
