translation:
  language: ta
  text: மக்பீஷின் மகன்கள் நூற்று ஐம்பத்தாறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தவர்களின் பட்டியலில் இந்தச் சொல் ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெயச் சொல்லின் வடிவத்தை வெளிப்படையாகப் பேணுவதோடு, இங்கு கூட்டுப்பொருளில் இயல்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: מַגְבִּישׁ
  choice: மக்பீசு
  rationale: இது ஆளின் பெயரா இடத்தின் பெயரா என்பது உறுதியில்லை; ஆகவே பொருள் ஊகிக்காமல் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. வேற்றுமை உருபு சேரும்போது ‘மக்பீசின்’ என வருகிறது.
- source_word: מֵאָה חֲמִשִּׁים וְשִׁשָּׁה
  choice: நூற்று ஐம்பத்தாறு
  rationale: எபிரெய எண்ணிக்கை நேரடியாக 156 என்பதைக் குறிக்கிறது. பட்டியலின் கண்ணியமான நவீன நடைக்கு ஏற்றவாறு சொற்களால் எழுதப்பட்டுள்ளது.
