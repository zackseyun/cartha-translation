  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எண்ணப்பட்ட நபர்கள் என்பதைக் இயல்பாகத் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது; இது மூலத்தின் பொருளை மாற்றாது.
