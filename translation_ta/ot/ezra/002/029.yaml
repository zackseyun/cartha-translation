lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தவர்களின் பட்டியலில் ஒரு குலத்தையோ ஓர் இடத்துடன் தொடர்புடைய குழுவையோ அறிமுகப்படுத்தும் எபிரெயத் தொடர். ‘மகன்கள்’ என்பது மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது; தமிழில் எண்ணிக்கையுடன் இயல்பாக அமைய ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: נְבוֹ
  choice: நேபோ
  rationale: இது ஓர் இடத்தின் அல்லது குலத்தின் பெயராக இருக்கக்கூடிய தனிப்பெயர்; ஆகவே மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: ஐம்பத்திரண்டு
  rationale: எபிரெய எண்ணிக்கையை நவீனத் தமிழின் இயல்பான எண்ணுருவில் வழங்குகிறது.
