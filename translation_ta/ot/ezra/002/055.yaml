  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: ta
  text: 'சாலொமோனின் பணியாளர்களின் வழிவந்தவர்கள்: சோத்தாயின் வழிவந்தவர்கள், ஹஸ்ஸோபெரெத்தின் வழிவந்தவர்கள், பெரூதாவின்[a] வழிவந்தவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எஸ்றாவின் எபிரெய உரையில் “பெரூதா” என்று உள்ளது; நெகேமியா 7:57-இல் உள்ள இணைப் பட்டியலில் “பெரீதா” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இந்த வம்சப் பட்டியல் சூழலில் இது உடனடியாகப் பிறந்த மகன்களை மட்டும் அல்லாமல், ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்த வழித்தோன்றல்களையும் குறிக்கிறது. எனவே மீண்டும் மீண்டும் வரும் எபிரெய அமைப்பைப் பேணியபடி இயல்பான தமிழில் ‘வழிவந்தவர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: עֶבֶד என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ என்று பொருள் வரலாம். இங்கு ‘சாலொமோனின் பணியாளர்கள்’ என்பது திரும்பிவந்தோரின் பட்டியலிலுள்ள ஒரு நிலையான குழுப் பெயர்; அடிமைத்தனத்தின் நிலையை வலியுறுத்தாததால் ‘பணியாளர்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: סֹטַי
  choice: சோத்தாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: הַסֹּפֶרֶת
  choice: ஹஸ்ஸோபெரெத்
  rationale: பெயருடன் இணைந்துள்ள எபிரெயச் சுட்டிடைச்சொல்லையும் இரட்டித்த மெய்யொலியையும் பெயரின் ஓர் அங்கமாகக் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளது; இதைப் பொதுப்பெயராக மொழிபெயர்க்காமல் குடும்பப் பெயராகப் பேணுகிறது.
- source_word: פְרוּדָא
  choice: பெரூதா
  rationale: எஸ்றாவின் மசோரா எபிரெய உரையில் உள்ள உயிரொலி வடிவத்தைப் பின்பற்றிய எழுத்துப்பெயர்ப்பு. நெகேமியாவிலுள்ள இணைப் பட்டியலின் வேறுபட்ட வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
