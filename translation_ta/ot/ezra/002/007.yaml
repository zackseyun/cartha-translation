lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம்; இந்தக் கணக்குப் பட்டியலில் ஒரு குடும்ப அல்லது குலக் குழுவைக் குறிக்கிறது. மூலத்தின் வம்சவழிப் பட்டியல் அமைப்பை நேரடியாகப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இது ஒரு இயற்பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 பேர்
  rationale: எபிரெய எண்ணுச் சொற்றொடரின் மொத்தம் 1,254. கணக்குப் பட்டியலில் எளிதாக வாசிக்க இலக்கங்கள் பயன்படுத்தப்பட்டன; தமிழில் மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகத் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டது.
