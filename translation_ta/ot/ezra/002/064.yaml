revisions:
- from: சபையார் அனைவரும் ஒன்றாக நாற்பத்தீராயிரத்து முந்நூற்று அறுபது பேர்.[a]
  to: முழுக் கூட்டத்தினரும் ஒட்டுமொத்தமாக நாற்பத்திரண்டாயிரத்து முந்நூற்று அறுபது பேர்.[a]
  rationale: The revision corrects the total to 42,360, renders the gathered body in natural, non-ecclesiastical modern Tamil, and retains the collective force of כְּאֶחָד with a literal footnote alternative.
