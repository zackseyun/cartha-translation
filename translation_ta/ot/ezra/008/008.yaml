translation_notes:
  register: வம்சப்பட்டியலுக்குரிய சுருக்கமான நடையைப் பேணியபடியே, தமிழில் முழுமையான வாக்கியமாக இயங்குவதற்காக ‘வந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; இது முந்தைய வசனங்களில் தொடங்கும் பயணப் பட்டியலின் சூழலால் தெளிவாக உணர்த்தப்படும் கருத்தாகும். மொழிநடை நவீனமானது, கண்ணியமானது, பொதுவாசகர்களுக்குப் புரியக்கூடியது.
