  yaml_path: translation/ot/ezra/008/008.yaml
  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: ta
  text: 'செப்பத்தியாவின் மகன்களில்[a]: மிகாயேலின் மகன் செபதியா; அவனோடு எண்பது ஆண்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் உள்ள ‘மகன்கள்’ என்பது உடனடியாகப் பிறந்த மகன்களை மட்டுமல்லாமல், ஒரு விரிவான குலவழியினரையும், அதாவது ‘வழித்தோன்றல்களையும்’ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: மகன்களில்
  rationale: இது எழுத்துப்படியான ‘மகன்களில்’ என்ற வடிவத்தைப் பேணுகிறது. இந்த வம்சப்பட்டியல் சூழலில், உடனடியாகப் பிறந்த மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையும் இது குறிக்கக்கூடும்; அந்த விரிவான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: שְׁפַטְיָה
  choice: செபத்தியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: זְבַדְיָה
  choice: செபதியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: ஒரு குறிப்பிட்ட தந்தையின் பெயருடன் நேரடியாக இணைந்திருப்பதால், இங்கு ‘மகன்’ என்பதே இயல்பான வம்ச உறவுப் பொருள்.
- source_word: מִיכָאֵל
  choice: மிகாயேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்பு வடிவம்.
- source_word: וְעִמּוֹ
  choice: அவனுடன்
  rationale: தலைவருடன் வந்த குழுவைக் குறிக்கும் பட்டியல் அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁמֹנִים
  choice: எண்பது
  rationale: எபிரெய மூலத்தின் எண்ணிக்கையை நேரடியாகத் தருகிறது.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: எபிரெயச் சொல் பாலினத்தைக் குறிப்பாகச் சுட்டுகிறது. நவீனத் தமிழில் ‘ஆண்கள்’ என்பது துல்லியமாகவும் இயல்பாகவும் உள்ளது.
