  naturalness: The revised Tamil is fluent modern standard Tamil. Separating the examination and resulting discovery into coordinated clauses more directly reflects the Hebrew sequence than the temporal construction “ஆராய்ந்து பார்த்தபோது.”
  terminology: “ஆசாரியர்கள்” is appropriate for priests, and “லேவியின் மக்களில்” preserves the Hebrew genealogical expression. The footnote explains its conventional sense, ‘Levites.’ “ஆறு” is retained, with ‘canal’ supplied as the lexical alternative.
