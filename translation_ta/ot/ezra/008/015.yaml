translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’ என்பது வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல். மூலத்தின் வம்சவழிச் சுட்டை ‘லேவியின் மக்களில்’ என்று முதன்மை உரையில் காத்து, அதன் பொருளை அடிக்குறிப்பில் விளக்கியுள்ளோம்.
