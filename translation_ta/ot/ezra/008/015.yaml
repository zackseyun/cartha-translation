base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: ta
  text: அகாவாவுக்குச் செல்லும் ஆற்றுக்கு[a] அவர்களைக் கூட்டினேன். அங்கே நாங்கள் மூன்று நாட்கள் முகாமிட்டோம். மக்களையும் ஆசாரியர்களையும் ஆராய்ந்து பார்த்தேன்; அங்கே லேவியின் மக்களில்[b] ஒருவரையும் காணவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகாவாவுக்குச் செல்லும் கால்வாய்.” இச்சூழலில் எபிரேயச் சொல் இயற்கையான ஆற்றையோ மனிதர் வெட்டிய நீர்வழியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, லேவியர்கள். எபிரேயத்தில், “லேவியின் மக்களில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: அவர்களைக் கூட்டினேன்
  rationale: קבץ என்பதன் அடிப்படைப் பொருள் ‘ஒன்றுகூட்டுதல்’; எஸ்றா குழுவினரைத் திட்டமிட்டு ஒரே இடத்தில் சேர்த்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: அகாவாவுக்குச் செல்லும் ஆறு
  rationale: נָהָר பொதுவாக ‘ஆறு’ எனப் பொருள்படும்; இச்சூழலில் கால்வாயையும் குறிக்கக்கூடும். הַבָּא אֶל என்பதிலுள்ள திசை சார்ந்த தெளிவின்மையை ‘செல்லும்’ என்பது அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
- source_word: וַנַּחֲנֶה
  choice: நாங்கள் முகாமிட்டோம்
  rationale: חנה என்பதன் ‘முகாமிடுதல்’ என்ற பொருளை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יָמִים שְׁלֹשָׁה
  choice: மூன்று நாட்கள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகத் தரும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: וָאָבִינָה
  choice: நான் ஆராய்ந்து பார்த்தபோது
  rationale: בין வினையின் இப்பயன்பாடு கவனமாகப் பரிசீலித்து அறிதலைக் குறிக்கிறது; கூடியிருந்தவர்களின் அமைப்பை எஸ்றா ஆய்வு செய்த சூழலுக்கு இது பொருந்துகிறது.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: மக்களையும் ஆசாரியர்களையும்
  rationale: עָם மற்றும் כֹּהֲנִים ஆகிய இரு குழுக்களையும் வேறுபடுத்தி, தமிழில் தெளிவான இணை அமைப்பாக வழங்குகிறது.
- source_word: וּמִבְּנֵי לֵוִי
  choice: லேவியின் மக்களில்
  rationale: ‘லேவியின் மக்களிலிருந்து’ என்ற எபிரெய மரபுவழிப் பொருளையும் வம்சச் சுட்டையும் காக்கிறது; இதன் நடைமுறைப் பொருள் லேவியர்கள் என்பதாகும்.
- source_word: לֹא מָצָאתִי שָׁם
  choice: ஒருவரையும் அங்கே காணவில்லை
  rationale: மறுக்கப்பட்ட எபிரெய வினையிலுள்ள மறைமுகப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தி, அக்குழுவைச் சேர்ந்த எவரும் இல்லாததைத் தெளிவாக்குகிறது.
