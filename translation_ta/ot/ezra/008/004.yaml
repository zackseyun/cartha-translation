translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வைத்துள்ளது. குலப் பெயர்களும் தனிப்பட்ட பெயர்களும் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் பாலினக் குறிப்பு ‘ஆண்கள்’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
