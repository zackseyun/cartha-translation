  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: ta
  text: 'பாகாத்-மோவாபின் மகன்களில்: செராகியாவின் மகன் எலியேஹோயேனாய்; அவனுடன் இருநூறு ஆண்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு பொதுவாக ‘மக்கள்’ என்று சொல்லாமல், ஆண் பாலினத்தைக் குறிப்பாகச் சுட்டும் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: மகன்களில்
  rationale: மִן முன்னொட்டையும், வம்ச அல்லது குலப் பட்டியலில் בְּנֵי என்பதன் வழக்கமான ‘மகன்கள்’ என்ற வடிவத்தையும் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: פַּחַת מוֹאָב
  choice: பாகாத்-மோவாப்
  rationale: இது ஒரு குடும்ப அல்லது குலப் பெயர்; பொருள் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶלְיְהוֹעֵינַי
  choice: எலியோகேனாய்
  rationale: எபிரெயப் பெயரின் மெய்-உயிர் அமைப்பை இயன்றவரை பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן זְרַחְיָה
  choice: செராகியாவின் மகன்
  rationale: வெளிப்படையான தந்தை–மகன் உறவை இயல்பான தமிழ் உடைமைத் தொடரால் தருகிறது.
- source_word: וְעִמּוֹ
  choice: அவனுடன்
  rationale: பெயரிடப்பட்ட தலைவரோடு வந்தவர்களின் எண்ணிக்கையைத் தெளிவாக அறிமுகப்படுத்துகிறது; தமிழில் தேவையற்ற இணைப்புச் சொல்லைத் தவிர்க்கிறது.
- source_word: מָאתַיִם
  choice: இருநூறு
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: பொதுவாக மனிதர்களைக் குறிக்கும் சொல்லுக்குப் பதிலாக, மூலத்தில் உள்ள பாலினக் குறிப்பை இயல்பான நவீன தமிழில் துல்லியமாகப் பாதுகாக்கிறது.
