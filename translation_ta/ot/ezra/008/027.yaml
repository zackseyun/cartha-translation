  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: ta
  text: ஆயிரம் தாரிக் நாணயங்கள் மதிப்புள்ள இருபது தங்கக் கிண்ணங்கள்[a], தங்கத்தைப் போல மதிப்புமிக்க ஒளிவீசும் உயர்தர வெண்கலப் பாத்திரங்கள் இரண்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மொத்தம் ஆயிரம் தாரிக் நாணயங்கள் மதிப்புள்ள இருபது தங்கக் கிண்ணங்கள்.’ கிண்ணங்கள் அனைத்தின் மொத்த மதிப்பையே எபிரெய வாசகம் குறிப்பிடலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நன்கு மெருகூட்டப்பட்ட வெண்கலப் பாத்திரங்கள் இரண்டு.’ வெண்கலத்தை விவரிக்கும் அரிதான எபிரெயத் தொடர், மிகவும் நேர்த்தியாகச் செய்யப்பட்டு ஒளிவீசும் தன்மையைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: கிண்ணங்கள்
  rationale: இச்சொல் விலைமதிப்புள்ள பொருட்களை வைக்கவும் ஆலயப் பணியிலும் பயன்படுத்தப்பட்ட கிண்ண வடிவப் பாத்திரங்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: ஆயிரம் தாரிக் நாணயங்கள் மதிப்புள்ள
  rationale: אדרכונים என்பது பாரசீக தாரிக் நாணயங்களைச் சுட்டுகிறது; இங்குள்ள ל மதிப்பீட்டைக் குறிப்பதாகப் புரிந்துகொண்டு, வரலாற்றுச் சொல்லைத் தக்கவைத்தபடி தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: כְלֵי נְחֹשֶׁת
  choice: வெண்கலப் பாத்திரங்கள்
  rationale: כלי என்பது பொதுவாகப் பாத்திரம் அல்லது பொருள்; ஆலயக் கருவூலப் பட்டியலுக்கு ‘பாத்திரங்கள்’ பொருத்தமானது. נחשת செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; வடிவமைக்கப்பட்ட உயர்தரப் பாத்திரங்கள் என்பதால் ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֻצְהָב טוֹבָה
  choice: ஒளிவீசும் உயர்தர
  rationale: அரிதான இத்தொடர் சிறப்பாகச் செய்யப்பட்டு மினுமினுக்கும் வெண்கலத்தை விவரிப்பதாகத் தெரிகிறது. பாத்திரங்கள் உண்மையில் தங்கமுலாம் பூசப்பட்டவை என்று உறுதிப்படுத்தாமல், அவற்றின் ஒளிர்வையும் தரத்தையும் தெரிவிக்கிறது.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: தங்கத்தைப் போல மதிப்புமிக்க
  rationale: חֲמוּדֹת என்பதன் விரும்பத்தக்க தன்மை அல்லது பெருமதிப்பு, தங்கத்துடனான வெளிப்படையான ஒப்பீட்டின் அடிப்படையில் இயல்பான தமிழில் தரப்பட்டுள்ளது.
