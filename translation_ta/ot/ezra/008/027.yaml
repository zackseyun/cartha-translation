translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயக் கருவூலப் பட்டியலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்று நாணயப் பெயரான ‘தாரிக்’ தக்கவைக்கப்பட்டு ‘நாணயங்கள்’ என்று தெளிவுபடுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் வாக்கிய அமைப்பை நிறைவு செய்ய ‘கொடுத்தேன்’ சேர்க்கப்பட்டுள்ளது; எபிரெய மூலத்தின் பட்டியல் தன்மையும் இரு அரிதான சொற்றொடர்களின் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
