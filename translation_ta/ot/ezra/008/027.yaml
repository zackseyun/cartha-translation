  source_fidelity: திருத்தம் தேவை. எபிரெய மூலத்தில் இவ்வசனம் முந்தைய வசனத்திலிருந்து தொடரும் பொருட்பட்டியல்; இங்கே தனியாக ‘கொடுத்தேன்’ என்ற வினைச்சொல் இல்லை. அந்த வினைச்சொல் சேர்க்கப்படுவது மூலத்தின் பட்டியல் வடிவத்தை மாற்றுவதோடு, சூழலில் ‘எடைபோட்டு ஒப்படைத்தேன்’ என்ற செயலைக் குறிப்பதற்குப் பதிலாக ‘கொடுத்தேன்’ எனத் தவறாகக் குறிக்கக்கூடும். மற்ற முக்கிய சொற்கள்—தங்கக் கிண்ணங்கள், தாரிக், வெண்கலப் பாத்திரங்கள், தங்கத்தோடு ஒப்பிடப்படும் மதிப்பு—மூலத்துக்கு ஏற்ப உள்ளன.
  naturalness: ‘ஒளிவீசும் உயர்தர வெண்கலப் பாத்திரங்கள்’ நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ஆனால் முடிவில் சேர்க்கப்பட்ட ‘கொடுத்தேன்’ நீக்கப்பட வேண்டும். பட்டியல் அமைப்பைத் தமிழில் இயல்பாகக் காக்க, வினையற்ற பெயர்த்தொடர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
  terminology: ‘தாரிக் நாணயங்கள்’, ‘தங்கக் கிண்ணங்கள்’, ‘வெண்கலப் பாத்திரங்கள்’ ஆகியவை பொருத்தமானவை. முּצְהָב என்பதன் துல்லியமான பொருள் நிச்சயமற்றதால் ‘ஒளிவீசும் உயர்தர’ என்பதும், அடிக்குறிப்பில் ‘நன்கு மெருகூட்டப்பட்ட’ என்பதும் பாதுகாப்பான தெரிவுகள். חֲמוּדֹת כַּזָּהָב என்பதன் ஒப்பீடு ‘தங்கத்தைப் போல மதிப்புமிக்க’ எனத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
