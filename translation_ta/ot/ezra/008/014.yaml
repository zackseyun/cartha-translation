translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைத் தெளிவாகவும் கண்ணியமாகவும் வைத்துள்ளது. எபிரெயத்தில் வெளிப்படையாக இல்லாத தமிழுக்குத் தேவையான ‘வந்தார்கள்’ என்ற வினை சேர்க்கப்பட்டுள்ளது. ‘அவனுடன்’ என்ற ஒருமை மூலத்தின் உண்மையான இலக்கணத் தயக்கத்தைப் பேணுகிறது; அடிக்குறிப்புகள் எல்லாம் முதன்மை உரையில் குறிக்கப்பட்டுள்ளன.
