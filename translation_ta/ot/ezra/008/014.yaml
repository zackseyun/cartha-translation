  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: ta
  text: பிக்வாயின் மக்களில் ஊத்தாயும் சப்பூதும்[b]; அவனுடன்[a] எழுபது ஆண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘அவனுடன்’ என்று ஒருமையில் உள்ளது. இரண்டு பெயர்கள் குறிப்பிடப்படுவதால் சில மொழிபெயர்ப்புகள் இதை ‘அவர்களுடன்’ என வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சில உரை மரபுகளும் பண்டைய மொழிபெயர்ப்புகளும் இங்குள்ள இரண்டாவது பெயரை வேறுவிதமாகக் கொண்டுள்ளன; மசோரா உரையில் ‘சப்பூத்’ என்றே உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בִגְוַי
  choice: பிக்வாயின் மக்களில்
  rationale: מִן + בְּנֵי பட்டியலில் ஒரு வம்சக் குழுவை அறிமுகப்படுத்துகிறது. ‘மக்களில்’ என்பது எபிரெய அமைப்பை நெருக்கமாகப் பேணுவதோடு, இங்கு நேரடி மக்களைவிட வழித்தோன்றல்களையும் குறிக்கக்கூடும்.
- source_word: עוּתַי
  choice: ஊத்தாய்
  rationale: எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: ו/זבוד
  choice: சப்பூதும்
  rationale: மசோரா உரையில் உள்ள זבוד என்ற பெயரை ஒலிபெயர்த்து, முன்னொட்டான இணைப்புச் சொல்லையும் ‘-உம்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: וְ/עִמּ/וֹ
  choice: அவனுடன்
  rationale: 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டைத் துல்லியமாகப் பேணுகிறது; இரண்டு பெயர்கள் முன்னதாக வந்தாலும் எபிரெயம் ஒருமையிலேயே உள்ளது.
- source_word: שִׁבְעִים הַ/זְּכָרִים
  choice: ஆண்கள் எழுபது பேர்
  rationale: זְכָרִים ஆண்பாலினரைக் குறிப்பாகக் குறிக்கிறது. தமிழில் இயல்பான எண்ணிக்கை அமைப்புக்காக ‘ஆண்கள் எழுபது பேர்’ என வழங்கப்படுகிறது.
