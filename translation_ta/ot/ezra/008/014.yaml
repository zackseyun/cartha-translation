- from: பிக்வாயின் மக்களில் ஊத்தாயும் சப்பூதும்[b] வந்தார்கள்; அவனுடன்[a] ஆண்கள் எழுபது பேர் வந்தார்கள்.
  to: பிக்வாயின் மக்களில் ஊத்தாயும் சப்பூதும்[b]; அவனுடன்[a] எழுபது ஆண்கள்.
  rationale: The revision removes the contextually supplied and repeated verb in order to preserve the terse list structure of the Hebrew. It keeps the singular “அவனுடன்” in the main text, with a footnote explaining why some translations use a plural, and preserves the textual-variant note on Zabbud.
