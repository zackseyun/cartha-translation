revisions:
- from: பின்பு, நாங்கள் எங்கள் கடவுளுக்கு முன்பாக எங்களைத் தாழ்த்திக்கொண்டு[a], எங்களுக்கும் எங்கள் சிறுபிள்ளைகளுக்கும் எங்கள் உடைமைகள் அனைத்துக்கும் நேரான பாதையை[b] அவரிடம் வேண்டுவதற்காக, அங்கே அகாவா ஆற்றருகே ஒரு நோன்பை அறிவித்தேன்.
  to: அங்கே, அகாவா ஆற்றருகே, எங்கள் கடவுளின் முன்பாக நாங்கள் எங்களைத் தாழ்த்திக்கொண்டு, எங்களுக்கும் எங்கள் சிறுபிள்ளைகளுக்கும் எங்கள் எல்லா உடைமைகளுக்கும் நேரான பாதையை அவரிடமிருந்து வேண்டிப் பெறுவதற்காக, நான் ஒரு நோன்பை அறிவித்தேன்.[a][b]
  rationale: மூல எபிரெயத்தின் மிம்மென்னூ (‘அவரிடமிருந்து’) என்ற கூறைத் தெளிவுபடுத்தி, தமிழ் வாக்கிய ஓட்டத்தை இயல்பாக்கியுள்ளேன். அடிக்குறிப்பு a தாழ்த்திக்கொள்ளுதல்/வருத்திக்கொள்ளுதல் என்ற வழக்கின் மாற்று நுண்பொருளைக் காக்கிறது; அடிக்குறிப்பு b நேரான பாதை என்ற உருவகத்திற்கான மாற்று விளக்கங்களைப் பாதுகாக்கிறது.
