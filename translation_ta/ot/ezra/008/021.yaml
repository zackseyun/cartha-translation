base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: ta
  text: அங்கே, அகாவா ஆற்றருகே, எங்கள் கடவுளின் முன்பாக நாங்கள் எங்களைத் தாழ்த்திக்கொண்டு, எங்களுக்கும் எங்கள் சிறுபிள்ளைகளுக்கும் எங்கள் எல்லா உடைமைகளுக்கும் நேரான பாதையை அவரிடமிருந்து வேண்டிப் பெறுவதற்காக, நான் ஒரு நோன்பை அறிவித்தேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் கடவுளின் முன்பாக எங்களை வருத்திக்கொண்டு.’ இந்த எபிரெய வழக்கு, குறிப்பாக நோன்பின்போது கடைப்பிடிக்கும் சுயமறுப்பையோ தன்னைத் தாழ்த்துவதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சரியான வழி’ அல்லது ‘பாதுகாப்பான பயணம்.’ எபிரெய மூலத்தில் சொல்லடிப்படையாக ‘நேரான பாதை’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: பின்பு ... அறிவித்தேன்
  rationale: இச்சூழலில் קרא என்பது பொதுவாக அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்று பொருள்படும். கதைத் தொடரை இயல்பாகக் காட்ட வாவ் தொடர்ச்சிக்கு ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: צוֹם
  choice: ஒரு நோன்பு
  rationale: இப்பெயர்ச்சொல் நோன்பு அனுசரிப்பைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஒரு நோன்பு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: அகாவா ஆற்றருகே
  rationale: ஆற்றுடன் வரும் עַל இங்கே ‘அருகே/அண்டையில்’ என்ற இடப்பொருளைக் குறிக்கலாம். அகாவா இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְהִתְעַנּוֹת
  choice: எங்களைத் தாழ்த்திக்கொண்டு
  rationale: நோன்புச் சூழலில் ענה என்பதன் ஹித்பயேல் வடிவம் சுயமறுப்பு அல்லது கடவுளுக்கு முன்பாகத் தன்னைத் தாழ்த்துதலைக் குறிக்கிறது. உடலுக்கு ஊறு செய்வதாகத் தவறாகப் புரியாதவாறு உள்ளார்ந்த தாழ்மையை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: எங்கள் கடவுளுக்கு முன்பாக
  rationale: கடவுளின் சந்நிதியில் கொள்ளும் மனநிலையையும் உறவுநிலையையும் குறிக்கும் எபிரெய வழக்கு தமிழில் நேரடியாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: அவரிடம் வேண்டுவதற்காக
  rationale: בקש என்பது தேடுதல் அல்லது கேட்டுப் பெற நாடுதல் என்று பொருள்படும். இங்கு கடவுளைச் சார்ந்த மன்றாட்டை இயல்பான தமிழில் ‘அவரிடம் வேண்டுதல்’ வெளிப்படுத்துகிறது.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: நேரான பாதை
  rationale: சொல்லடிப்படையில் ‘நேரான வழி/பாதை’ என்று பொருள். பயணப் பாதுகாப்பை மட்டும் கூறாமல் சரியான வழிநடத்துதலையும் உள்ளடக்கும் மூல உருவகத்தை இது காக்கிறது.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: எங்களுக்கும் எங்கள் சிறுபிள்ளைகளுக்கும் எங்கள் உடைமைகள் அனைத்துக்கும்
  rationale: טף சிறு குழந்தைகளையோ பயணக் குழுவிலுள்ள சார்ந்தவர்களையோ குறிக்கலாம்; ‘சிறுபிள்ளைகள்’ அதன் முதன்மை நுண்பொருளைக் காக்கிறது. רְכוּשׁ அவர்கள் எடுத்துச் சென்ற சொத்து அல்லது உடைமைகளைக் குறிக்கிறது.
theological_decisions:
- issue: நோன்புடன் தொடர்புடைய לְהִתְעַנּוֹת என்ற வழக்கை மொழிபெயர்த்தல்
  choice: எங்களைத் தாழ்த்திக்கொண்டு
  alternative: எங்களை வருத்திக்கொண்டு
  rationale: சொல்லடிப்படையான மாற்று உடலுக்குத் தீங்கு செய்வதைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும். தேர்ந்த சொற்றொடர் நோன்போடு இணைந்த சுயமறுப்பையும் கடவுளுக்கு முன்பான தாழ்மையையும் காட்டுகிறது; மாற்று நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: דֶּרֶךְ יְשָׁרָה என்பதன் பரப்பை மொழிபெயர்த்தல்
  choice: நேரான பாதை
  alternative: சரியான வழி; பாதுகாப்பான பயணம்
  rationale: சூழல் பயணத்தைப் பற்றியதாக இருந்தாலும், எபிரெயச் சொற்றொடர் உடல் பாதுகாப்பைக் காட்டிலும் விரிந்த சரியான வழிநடத்துதலைக் குறிக்கக்கூடும். ‘நேரான பாதை’ என்ற உருவகம் இந்தப் பொருள் இழுபறியைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நோக்கம் தெளிவாக இருக்கத் தமிழ் சொல்வரிசை இயல்பாக்கப்பட்டுள்ளது; மூலத்தின் உருவகமும் பொருள் இருமையும் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன.
