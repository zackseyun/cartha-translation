  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் அனைத்தும் உள்ளன: நோன்பை அறிவித்தல், அகாவா ஆற்றங்கரை, கடவுளின் முன் தங்களைத் தாழ்த்துதல், அவரிடமிருந்து நேரான பாதையைக் கேட்பது, மேலும் குழுவினர், சிறுபிள்ளைகள், உடைமைகள் ஆகிய மூன்று பயனாளர்கள். ஆனால் ‘அவரிடம் வேண்டுதல்’ என்பது מִמֶּנּוּ (‘அவரிடமிருந்து’) என்ற மூலத்தின் திசைநிலையைச் சற்றே மங்கச் செய்கிறது.'
