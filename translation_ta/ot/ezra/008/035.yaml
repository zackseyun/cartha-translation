base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: ta
  text: 'சிறைப்பட்ட நிலையிலிருந்து வந்த நாடுகடத்தப்பட்டோர், இஸ்ரவேலின் கடவுளுக்குத் தகனபலிகளைச் செலுத்தினார்கள்: இஸ்ரவேல் முழுவதற்காகப் பன்னிரண்டு காளைகள், தொண்ணூற்றாறு ஆட்டுக்கடாக்கள், எழுபத்தேழு செம்மறியாட்டுக் குட்டிகள், பாவநிவாரண பலியாகப் பன்னிரண்டு வெள்ளாட்டுக்கடாக்கள். இவை அனைத்தும் யாவேக்குச் செலுத்தப்பட்ட தகனபலியாக இருந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முன்னதாகப் பாவநிவாரண பலிக்கான வெள்ளாட்டுக்கடாக்களும் குறிப்பிடப்பட்டிருந்தாலும், எபிரெய மூலத்தில், “இவை அனைத்தும் யாவேக்கான தகனபலி” என்று உள்ளது.
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: சிறையிருப்பிலிருந்து வந்தவர்கள்
  rationale: வரையறுக்கப்பட்ட குழுவைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள எபிரெயப் பங்கேற்புவினையையும், שְׁבִי என்பதன் சிறைப்பட்ட நிலை என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְנֵי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டோர்
  rationale: சொல்லுக்குச் சொல் 'நாடுகடத்தலின் மகன்கள்' என்பது நவீன தமிழில் இயல்பற்றது; இங்கு மீண்டுவந்த நாடுகடத்தப்பட்ட மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருள் நேரடியாக வழங்கப்படுகிறது.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: தகனபலிகளைச் செலுத்தினார்கள்
  rationale: பலிச் சூழலில் הקריב என்பதற்கு 'செலுத்து' இயல்பானது; עֹלָה முழுமையாக எரிக்கப்படும் பலி வகையைக் குறிக்கும் நிலையான தமிழ்ச் சொல் 'தகனபலி' என மொழிபெயர்க்கப்படுகிறது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்காக
  rationale: עַל இங்கு பிரதிநிதித்துவ அல்லது சார்பான பொருளைக் கொண்டிருக்கலாம்; 'முழுவதற்காக' அந்தப் பொருளை இயல்பாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: אֵילִים
  choice: ஆட்டுக்கடாக்கள்
  rationale: பலிக்குரிய வயதுவந்த ஆண் செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: כְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: பலிப் பட்டியலில் இச்சொல் பொதுவாக ஆட்டுக்குட்டிகளைக் குறிக்கிறது; வெள்ளாடுகளிலிருந்து வேறுபடுத்த 'செம்மறியாட்டு' சேர்க்கப்படுகிறது.
- source_word: צְפִירֵי חַטָּאת
  choice: பாவநிவாரண பலியாக வெள்ளாட்டுக்கடாக்கள்
  rationale: צְפִירֵי ஆண் வெள்ளாடுகளையும் חַטָּאת இங்கு பாவத்திற்கான பலி வகையையும் குறிக்கிறது.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: இவை அனைத்தும் யெகோவாவுக்குச் செலுத்தப்பட்ட தகனபலியாக இருந்தன
  rationale: முன்னதாகப் பாவநிவாரண பலி குறிப்பிடப்பட்டிருந்தாலும், எபிரெய மூலத்தின் முடிவுச் சுருக்கத்தைத் திருத்தாமலும் ஒத்திசைக்காமலும் பாதுகாக்கிறது.
- source_word: יהוה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரைப் பொதுப்பட்டமான 'ஆண்டவர்' என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது; 'யெகோவா' நவீன தமிழ் வேதாகமப் பயன்பாட்டில் அறியத்தக்க வடிவம்.
- issue: பாவநிவாரண பலிகளைக் குறிப்பிட்ட பின் 'இவை அனைத்தும் தகனபலி' என்று கூறும் பதற்றம்
  choice: எபிரெயச் சுருக்கவாக்கியத்தை அப்படியே பாதுகாத்தல்
  alternative: இறுதி வாக்கியம் தகனபலிக்குரிய விலங்குகளை மட்டுமே குறிக்கிறது என வெளிப்படையாக விளக்குதல்
  rationale: மூல உரையின் வெளிப்படையான பதற்றத்தை மொழிபெயர்ப்பில் அமைதியாகத் தீர்க்காமல் வாசகருக்குத் தெரியுமாறு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு மரியாதையைக் காக்கும் அதேவேளையில் சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மரபுத்தொடர் இயல்பான தமிழாக்கமாகத் தரப்பட்டுள்ளது; பலிவகைகளுக்கிடையிலான மூல உரைப் பதற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
