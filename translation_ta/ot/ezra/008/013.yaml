revisions:
- from: அதோனிக்காமின் மக்களில்[a] கடைசியாக வந்தவர்கள்—அவர்களுடைய பெயர்கள் எலிபெலேத், எயியேல், செமாயா; அவர்களுடன் ஆண்கள் அறுபது பேர் இருந்தார்கள்.
  to: 'அதோனிக்காமின் மக்களிலிருந்து, கடைசியானவர்கள்[a]; அவர்களுடைய பெயர்கள் இவை: எலிபெலேத், யெயியேல், செமாயா; அவர்களுடன் அறுபது ஆண்கள் இருந்தார்கள்.'
  rationale: The revision removes the added notion of arriving, retains the source's possible sense of a final/latter subgroup, corrects the footnote placement, and improves the transliteration of Jeiel. The syntax remains a dignified, readable Tamil rendering of the Hebrew list formula.
