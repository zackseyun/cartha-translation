translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் தன்மையைப் பேணியபடி இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. எபிரெயத்தின் தொடர்ச்சியான இணைப்புச் சொற்கள் தமிழில் அசௌகரியமாக அமையாதபடி நிறுத்தக்குறிகளாலும் இயல்பான வாக்கிய அமைப்பாலும் வெளிப்படுத்தப்பட்டன.
