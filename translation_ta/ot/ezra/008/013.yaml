  text: וּ/מִ/בְּנֵ֣י אֲדֹנִיקָם֮ אַחֲרֹנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם אֱלִיפֶ֖לֶט יְעִיאֵ֣ל וּֽ/שְׁמַעְיָ֑ה וְ/עִמָּ/הֶ֖ם שִׁשִּׁ֥ים הַ/זְּכָרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: ta
  text: 'அதோனிக்காமின் மக்களிலிருந்து, கடைசியானவர்கள்[a]; அவர்களுடைய பெயர்கள் இவை: எலிபெலேத், யெயியேல், செமாயா; அவர்களுடன் அறுபது ஆண்கள் இருந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைசியானவர்கள்” என்பதற்கு “பிந்தியவர்கள்” அல்லது “கடைசிவர்கள்” என்றும் மொழிபெயர்க்கலாம். அதோனிக்காமின் வம்சத்திலிருந்து வந்த முந்தைய ஒரு குழுவிலிருந்து வேறுபடுத்தப்படும் இறுதிக் குழுவை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי אֲדֹנִיקָם
  choice: அதோனிக்காமின் மக்களில்
  rationale: בְּנֵי என்பதன் நேர்ப்பொருள் ‘மக்கள்’; இத்தகைய வம்சப் பட்டியலில் அது வழித்தோன்றல்களையும் குறிக்கலாம். எபிரெய வடிவத்தையும் பட்டியல் நடையையும் காக்க ‘மக்களில்’ எனத் தரப்பட்டது.
- source_word: אַחֲרֹנִים
  choice: கடைசியாக வந்தவர்கள்
  rationale: இந்தச் சொல் ‘கடைசியானவர்கள்’, ‘பிந்தியவர்கள்’ எனப் பொருள்படலாம். அதோனிக்காமின் வம்சத்திலிருந்து வந்த இறுதிக் குழுவைக் குறிக்கும் சாத்தியமான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: அவர்களுடைய பெயர்கள்
  rationale: எபிரெயத்தில் வினைச்சொல் இல்லாத பட்டியல் அறிமுகச் சொற்றொடர். தமிழில் இயல்பான சுருக்கமான பட்டியல் நடையாகத் தரப்பட்டது.
- source_word: אֱלִיפֶלֶט יְעִיאֵל וּשְׁמַעְיָה
  choice: எலிபெலேத், எயியேல், செமாயா
  rationale: தனிப்பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டன.
- source_word: וְעִמָּהֶם שִׁשִּׁים הַזְּכָרִים
  choice: அவர்களுடன் ஆண்கள் அறுபது பேர் இருந்தார்கள்
  rationale: הַזְּכָרִים பாலினத்தைத் தெளிவாகக் குறிக்கும் ‘ஆண்கள்’; எண்ணிக்கையுடன் இயல்பான தமிழுக்காக ‘பேர்’ மற்றும் மறைமுகமாக உள்ள வினை ‘இருந்தார்கள்’ சேர்க்கப்பட்டன.
