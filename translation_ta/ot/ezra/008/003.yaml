base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: ta
  text: 'செக்கனியாவின் மகன்களில், பாரோஷின் மகன்களில்: சகரியா; அவருடன் வம்சவரிசைப்படி பதிவு செய்யப்பட்ட[a] ஆண்கள் நூற்றைம்பது பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வம்சவரிசைப்படி கணக்கிடப்பட்டவர்கள்.’ எபிரெய வினைச்சொல், வம்சப் பதிவேட்டில் முறையாகப் பதிவு செய்யப்படுவதையோ கணக்கிடப்படுவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי שְׁכַנְיָה מִבְּנֵי פַרְעֹשׁ
  choice: செக்கனியாவின் மகன்களில், பாரோஷின் மகன்களில்
  rationale: இருமுறை வரும் מִבְּנֵי என்ற பட்டியல் அமைப்பைப் பாதுகாக்கிறது. எபிரெயச் சொற்றொடரின் உறவு தெளிவற்றிருப்பதால், அதை ஒரே வம்சத் தொடராகவோ இரண்டு தனிப் பதிவுகளாகவோ விளக்கிச் சீராக்கவில்லை.
- source_word: שְׁכַנְיָה
  choice: செக்கனியா
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: פַרְעֹשׁ
  choice: பாரோஷ்
  rationale: குடும்பப் பெயரின் எபிரெய உச்சரிப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமானதும் எபிரெயப் பெயருக்கு ஏற்றதுமான வடிவம்.
- source_word: וְעִמּוֹ
  choice: அவருடன்
  rationale: சகரியாவோடு தொடர்புடையவர்களைச் சுருக்கமாகக் குறிக்கும் எபிரெயத் தொடரைப் பாதுகாக்கிறது.
- source_word: הִתְיַחֵשׂ
  choice: வம்சாவளிப்படி பதிவுசெய்யப்பட்டவர்கள்
  rationale: இது வெறும் உயிரியல் வழித்தோன்றலை அல்ல, வம்சப் பதிவேட்டில் முறையாகப் பதிவுசெய்யப்படுதல் அல்லது கணக்கிடப்படுதலைக் குறிக்கிறது.
- source_word: לִזְכָרִים
  choice: ஆண்கள்
  rationale: எபிரெயச் சொல் வயதுவந்தவர்கள் என்பதைவிட ஆண்பாலினரைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: 150 பேர்
  rationale: பட்டியல் மற்றும் கணக்கெடுப்பு நடைக்கு ஏற்ற வாசிக்க எளிய எண் வடிவம்; எண்ணிக்கையைத் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: செக்கனியா மற்றும் பாரோஷ் குறித்த இரட்டை வம்சத் தொடரின் தொடர்பு
  choice: எபிரெயச் சொல்வரிசையைப் பாதுகாத்து, தொடர்பைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘பாரோஷின் மகன்களில் ஒருவரான செக்கனியாவின் மகன்களில்’ என்று ஒரே வம்சத் தொடராக விளக்குதல், அல்லது செக்கனியாவைத் தனிப் பட்டியல் தலைப்பாகக் கருதுதல்
  rationale: மசோரா உரையின் சொல்வரிசையும் இடைநிறுத்தக் குறிகளும் உறவை முழுமையாகத் தெளிவுபடுத்தவில்லை. ஆகவே மூலத்தில் உள்ள உரைநிலைத் தெளிவின்மையை மொழிபெயர்ப்பு செயற்கையாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பெயர்ப்பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் சற்றுக் கடினமான பட்டியல் அமைப்பு, அதன் உண்மையான தெளிவின்மையை இழக்காத அளவில் பாதுகாக்கப்பட்டுள்ளது.
