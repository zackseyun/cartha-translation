translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட பெயர்ப்பட்டியல் வாசிக்க எளிதாக இரு குழுக்களாக அமைக்கப்பட்டது; எல்நாத்தான் என்ற பெயரின் மூன்று நிகழ்வுகளும் மூலத்தின்படி பாதுகாக்கப்பட்டன. [a] தலைவர்கள் என்ற சொல்லுடன், [b] முழு ‘விவேகமுள்ளவர்கள்’ சொற்றொடருடன் தொடர்புபடுமாறு உரையில் இடப்பட்டுள்ளன.
