base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: ta
  text: அப்போது நான் தலைவர்களான எலியேசர், அரியேல், செமாயா, எல்நாத்தான், யாரீப், எல்நாத்தான், நாத்தான், சகரியா, மெசுல்லாம் ஆகியோரையும்[a], விவேகமுள்ளவர்களான[b] யோயாரீப், எல்நாத்தான் ஆகியோரையும் வரச்சொல்லி ஆளனுப்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்கள்’ என்பதற்கான எபிரெயச் சொல் எழுத்துப்படி ‘தலைகள்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘விவேகமுள்ளவர்கள்’ என்பதை ‘புரிந்துணர்வுள்ளவர்கள்’ அல்லது ‘அறிவாற்றலுள்ளவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: வரச்சொல்லி ஆளனுப்பினேன்
  rationale: שׁלח என்பதன் தொடர்நிகழ்வு வடிவம் கதையின் அடுத்த செயலைக் குறிக்கிறது. இங்கு பெயரிடப்பட்டவர்களை எஸ்றா தன்னிடம் வரவழைப்பதே சூழல்; ஆகவே வெறுமனே ‘அனுப்பினேன்’ என்பதைவிட இந்தத் தமிழ் நடை பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: எலியேசர் ... எல்நாத்தான் ஆகியோரையும்
  rationale: மீண்டும் வரும் ל, அழைப்பு எவர்களை நோக்கியது என்பதைக் குறிக்கிறது. ‘வரச்சொல்லி ஆளனுப்பினேன்’ என்ற தமிழ் அமைப்பில் அந்த உறவு ‘ஆகியோரையும்’ என்ற வேற்றுமை வடிவில் இயல்பாக வெளிப்படுகிறது.
- source_word: רָאשִׁים
  choice: தலைவர்கள்
  rationale: எபிரெயச் சொல் எழுத்துப்படி ‘தலைகள்’ என்றாலும், இச்சூழலில் முன்னிலை அல்லது பொறுப்பு வகித்தவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது உருவகப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְבִינִים
  choice: விவேகமுள்ளவர்கள்
  rationale: בין வேரிலிருந்து வந்த இப்பங்கேற்பு வடிவம் புரிந்துணரவும் பகுத்தறியவும் கூடியவர்களைக் குறிக்கிறது. ‘விவேகமுள்ளவர்கள்’ என்பது ‘போதகர்கள்’ போன்ற குறிப்பிட்ட பதவியைத் தேவையின்றி சேர்க்காமல் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: விவேகமுள்ளவர்களான யோயாரிப், எல்நாத்தான் ஆகியோரையும்
  rationale: இறுதி விளக்கச்சொல் இயல்பாக அதற்கு உடனே முந்தும் யோயாரிப், எல்நாத்தான் ஆகிய இருவரையே விவரிக்கிறது. தமிழில் பெயர்களுக்கு முன் விளக்கச்சொல்லை அமைப்பது அந்தத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: יוֹיָרִיב
  choice: யோயாரிப்
  rationale: எபிரெயப் பெயரின் இச்சூழலுக்குரிய குறுகிய வடிவத்தைத் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: אֶלְנָתָן
  choice: எல்நாத்தான்
  rationale: இந்தப் பெயர் வசனத்தில் மூன்று முறை வருகிறது. மூலத்தின் மீளுரைப்பை நீக்காமல் ஒவ்வொரு முறையும் பாதுகாக்கப்பட்டுள்ளது; ஒரே பெயருடைய வெவ்வேறு நபர்களாக இருக்கக்கூடும்.
