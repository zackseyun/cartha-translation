base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: ta
  text: 'இவை: அர்த்தசஷ்டா அரசனின் ஆட்சிக்காலத்தில் என்னுடன் பாபிலோனிலிருந்து மேலே சென்றவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்களும், அவர்களுடைய வம்சப் பதிவும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வம்சாவளி” அல்லது “வம்சப்படி பதிவு செய்யப்பட்டவர்கள்.” எபிரெயச் சொல் வெறும் மூதாதை வழியை மட்டுமல்லாமல், வம்ச அடிப்படையிலான பதிவு அல்லது பட்டியலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: பின்வரும் பட்டியலை அறிமுகப்படுத்தும் சுட்டுப்பெயராக இயல்பாக அமைகிறது; எபிரெய இணைப்பின் உரையாடல் தொடர்பு தமிழ்ச் சொல் வரிசையால் வெளிப்படுகிறது.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: அவர்களுடைய மூதாதையர் குடும்பத் தலைவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய தந்தையரின் தலைவர்கள்’ என்பதல்ல; நிர்வாக மற்றும் வம்சவழிச் சூழலில் தந்தைவழி மூதாதையர் குடும்பங்களின் தலைமைப் பிரதிநிதிகளைக் குறிக்கும்.
- source_word: וְהִתְיַחְשָׂם
  choice: அவர்களுடைய வம்சப் பதிவு
  rationale: வெறும் வம்சாவளியை மட்டுமல்லாமல், வம்ச அடிப்படையில் செய்யப்பட்ட பதிவு அல்லது பட்டியலையும் குறிக்கக்கூடிய சொல்லின் நிர்வாக நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: הָעֹלִים
  choice: மேலே வந்தவர்கள்
  rationale: பாபிலோனிலிருந்து யூதாவை நோக்கிச் செல்வதை ‘மேலே செல்லுதல்’ என்று கூறும் எபிரெய மரபுச்சொல்லைத் தமிழில் இயன்றவரை வெளிப்படையாகப் பாதுகாக்கிறது; இலக்கு மூலவசனத்தில் இல்லாததால் ‘எருசலேமுக்கு’ என்று சேர்க்கப்படவில்லை.
- source_word: עִמִּי
  choice: என்னுடன்
  rationale: எஸ்றாவின் முதலாம் நபர் உரையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּמַלְכוּת
  choice: ஆட்சிக்காலத்தில்
  rationale: அரசரின் ஆட்சி நடைபெற்ற காலப்பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: அர்தசஷ்டா அரசன்
  rationale: அரசரின் பெயரை வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவில் வழங்கி, பெயரும் பட்டமும் இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: מִבָּבֶל
  choice: பாபிலோனிலிருந்து
  rationale: புறப்பட்ட இடத்தைத் தெளிவாகவும் மூலத்துக்கு நேர்மையாகவும் குறிக்கிறது.
