  source_fidelity: 'கருத்து மற்றும் வாக்கியத் தொடர்பில் வரைவு எபிரெய மூலத்தைத் துல்லியமாகப் பின்பற்றுகிறது: பயணப் புறப்பாடு, தேதியிடல், எருசலேமுக்கான நோக்கம், தேவனுடைய கை என்ற உருவகம், பகைவரின் கை, வழியில் பதுங்கிக் காத்திருப்பவர் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் אֲהֲוָא (Ahava) என்ற பெயரை ‘அகாவா’ எனத் தருவது மூலத்தின் /h/ ஒலியை /k/ ஆக மாற்றுகிறது; ‘அஹவா’ என்பது துல்லியமான ஒலிபெயர்ப்பு.'
  naturalness: ‘புறப்பட்டோம்’, ‘எருசலேமுக்குப் போவதற்காக’, ‘எங்கள் தேவனுடைய கை எங்கள்மீது இருந்தது’ ஆகியவை நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளன. ‘பதுங்கித் தாக்கக் காத்திருந்தவன்’ என்பது புரியக்கூடியது; இருப்பினும் மூலத்தின் ‘பதுங்கிக் காத்திருப்பவர்’ என்ற பங்கேற்பு வடிவத்தை நெருக்கமாகக் காக்கும் வகையில் ‘பதுங்கிக் காத்திருந்தவனிடமிருந்தும்’ என அமைக்கப்பட்டுள்ளது.
