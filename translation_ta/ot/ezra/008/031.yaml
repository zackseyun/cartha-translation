base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: ta
  text: முதல் மாதத்தின் பன்னிரண்டாம் நாளில், எருசலேமுக்குப் போவதற்காக அஹவா ஆற்றிலிருந்து புறப்பட்டோம். எங்கள் தேவனுடைய கை எங்கள்மீது இருந்தது; வழியில் பகைவரின் கையிலிருந்தும் பதுங்கிக் காத்திருந்தவனிடமிருந்தும்[a] அவர் எங்களை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதுங்கித் தாக்கும் ஆபத்திலிருந்தும்” அல்லது “பதுங்கித் தாக்குதலிலிருந்தும்.” எபிரெயச் சொல் பதுங்கிக் காத்திருக்கும் நபரைக் குறிக்கலாம்; சூழலில் பதுங்கித் தாக்கும் ஆபத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: புறப்பட்டோம்
  rationale: נסע இப்பயணச் சூழலில் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. நவீனத் தமிழில் ‘புறப்பட்டோம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִנְּהַר אֲהֲוָא
  choice: அகாவா ஆற்றிலிருந்து
  rationale: נָהָר என்பதற்கு ‘ஆறு’ என்று மொழிபெயர்த்து, அֲהֲוָא என்ற இடப்பெயர் ‘அகாவா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தின் பன்னிரண்டாம் நாளில்
  rationale: எபிரெய மொழியில் மறைந்துள்ள ‘நாள்’ என்பதைத் தமிழில் தெளிவுக்காக வெளிப்படையாகச் சேர்க்கிறது.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: எருசலேமுக்குப் போவதற்காக
  rationale: הלך என்பதன் நோக்கப் பொருளை ‘போவதற்காக’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: எங்கள் தேவனுடைய கை எங்கள்மேல் இருந்தது
  rationale: தேவனுடைய செயல்வல்ல ஆதரவையும் பாதுகாப்பையும் குறிக்கும் எபிரெய உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: וַיַּצִּילֵנוּ
  choice: அவர் எங்களை விடுவித்தார்
  rationale: נצל என்பது ஆபத்திலிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கிறது; இங்கு ‘விடுவித்தார்’ வாக்கிய அமைப்போடு இயல்பாகப் பொருந்துகிறது.
- source_word: מִכַּף אוֹיֵב
  choice: பகைவரின் கையிலிருந்து
  rationale: כַּף என்பதன் ‘கை/பிடி’ உருவகத்தைத் தக்கவைத்து, முன்பு வரும் தேவனுடைய ‘கை’ என்பதுடனான இலக்கிய இணைப்பையும் பாதுகாக்கிறது.
- source_word: וְאוֹרֵב
  choice: பதுங்கித் தாக்கக் காத்திருந்தவனிடமிருந்து
  rationale: ארב என்ற ஆண்பால் ஒருமைப் பங்கேற்பு வடிவம் பதுங்கிக் காத்திருக்கும் நபரை நேரடியாகக் குறிக்கலாம். தமிழில் அதன் செயற்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; ‘பதுங்கித் தாக்கும் ஆபத்து’ என்ற நிகழ்வுப்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: עַל הַדָּרֶךְ
  choice: வழியில்
  rationale: பயணப் பாதையில் ஏற்பட்ட ஆபத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: தேவ பாதுகாப்பைக் குறிக்கும் மனித உடலுறுப்பு உருவகம்
  choice: ‘எங்கள் தேவனுடைய கை எங்கள்மேல் இருந்தது’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘எங்கள் தேவன் எங்களைப் பாதுகாத்தார்’
  rationale: எபிரெய உரை தேவனுடைய ‘கை’ என்று வெளிப்படையாகக் கூறுகிறது. இது எஸ்றா–நெகேமியாவில் தேவனுடைய அருள்மிகு செயற்பாட்டைக் குறிக்கும் தொடர்ச்சியான இலக்கிய-இறையியல் உருவகம்; எனவே அதை விளக்கவுரையாகக் குறுக்காமல் பாதுகாப்பது பொருத்தமானது.
- issue: אוֹרֵב என்பது நபரையா பதுங்குத் தாக்குதலையா குறிக்கிறது
  choice: நபரைக் குறிக்கும் ‘பதுங்கித் தாக்கக் காத்திருந்தவன்’
  alternative: ‘பதுங்கித் தாக்கும் ஆபத்து’ அல்லது ‘பதுங்கித் தாக்குதல்’
  rationale: மூலத்தில் உள்ள ஒருமைப் பங்கேற்பு வடிவம் பதுங்கிக் காத்திருக்கும் நபரை இயல்பாகக் குறிக்கிறது; எனினும் ஆபத்து அல்லது பதுங்குத் தாக்குதல் என்ற நிகழ்வுப்பொருளும் சூழலில் சாத்தியமாதலால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தேவனுடைய கை’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டது; אוֹרֵב என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
