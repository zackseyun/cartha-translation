base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: ta
  text: காசிபியா என்னும் இடத்தில் தலைவராக இருந்த இத்தோவிடம் அவர்களை அனுப்பினேன். நம் கடவுளின் இல்லத்தில் பணிவிடை செய்வோரை[b] எங்களிடம் அழைத்துவரும்படி, காசிபியா என்னும் இடத்தில் இருந்த இத்தோவிடமும் அவருடைய சகோதரர்களாகிய ஆலயப் பணியாளர்களிடமும்[a] அவர்கள் பேச வேண்டிய வார்த்தைகளை அவர்களுக்குக் கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “நெத்தினீம்”; ஆலயப் பணிக்கென நியமிக்கப்பட்டிருந்த ஒரு தனிப்பட்ட பணியாளர் வகுப்பு.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “பணிவிடை செய்வோர்” என்பது ஆலயத்தில் சேவை செய்பவர்களைக் குறிக்கிறது; பிற்காலத்தில் உருவான முறைப்படியான சமயப் பதவி ஒன்றை அவசியம் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: அனுப்பினேன்
  rationale: יצא என்பதன் ஹிப்இல் வடிவம் இச்சூழலில் தூதுக்குழுவைச் செல்லச் செய்வதைக் குறிக்கிறது; நவீன தமிழில் “அனுப்பினேன்” இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: தலைவரான இத்தோ
  rationale: הָרֹאשׁ என்பதன் நேர்ப்பொருள் “தலை”; இங்கு பொறுப்பில் இருந்த ஒருவரின் பட்டமாக வருவதால் “தலைவர்” தெளிவான தேர்வு.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: காசிபியா என்னும் இடம்
  rationale: மூலத்தில் இடப்பெயருடன் מָקוֹם, “இடம்,” வெளிப்படையாக இருப்பதைத் தக்கவைத்தபடியே இயல்பான தமிழ் தொடராக அமைக்கப்பட்டது.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: அவர்கள் பேச வேண்டிய வார்த்தைகளை அவர்களுக்குக் கொடுத்தேன்
  rationale: “அவர்களுடைய வாய்களில் வார்த்தைகளை வைத்தேன்” என்ற எபிரெய உருவகம், சொல்ல வேண்டிய செய்தியை ஒப்படைப்பதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்கவும் “வார்த்தைகள்” என்ற மூலப் படிமத்தின் ஓர் அம்சம் நிலைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: இத்தோவிடமும் அவருடைய சகோதரர்களிடமும்
  rationale: தொடர்ந்து வரும் பன்மை வடிவமும் சூழலும் אָחִיו என்பதைப் பன்மையான “அவருடைய சகோதரர்கள்” எனப் புரிந்துகொள்ள ஆதரிக்கின்றன.
- source_word: הַנְּתוּנִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: எஸ்றா–நெகேமியாவில் இது ஆலயப் பணிக்கென இணைக்கப்பட்டிருந்த தனித்த பணியாளர் வகுப்பைக் குறிக்கிறது. ஒலிபெயர்ப்பைவிட செயல்பாட்டைச் சொல்லும் மொழிபெயர்ப்பு பொதுவாசகருக்குத் தெளிவாக உள்ளது.
- source_word: מְשָׁרְתִים
  choice: பணிவிடை செய்வோர்
  rationale: இது சேவை செய்பவர்களைக் குறிக்கிறது. הַנְּתוּנִים என்ற குறிப்பிட்ட ஆலயப் பணியாளர் வகுப்பிலிருந்து சொல்லாக்க வேறுபாட்டைத் தக்கவைத்து, பிற்கால சமயப் பதவியைக் குறிக்காத நடுநிலையான தமிழாக அமைந்துள்ளது.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: நம் கடவுளின் இல்லத்தில்
  rationale: “நம் கடவுளின் இல்லம்” என்பது மூலத்தின் בית אלהינו என்ற சொல்லாட்சியையும் அதன் சமயச் சாயலையும் காக்கிறது; பணிவிடையின் இடத்தைத் தமிழில் இயல்பாகக் காட்ட “இல்லத்தில்” பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: הַנְּתוּנִים என்ற வரலாற்றுச் சேவகர் வகுப்பின் பெயர்
  choice: ஆலயப் பணியாளர்கள்
  alternative: நெத்தினீம்
  rationale: இது முதன்மையாகச் சொற்பொருள் மற்றும் வரலாற்று அடையாளம் சார்ந்தது. செயல்பாட்டு மொழிபெயர்ப்பு வாசகருக்குத் தெளிவைத் தருகிறது; மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מְשָׁרְתִים என்பதற்கு பிற்கால சமயப் பதவிப் பொருள் ஏற்றாமல் மொழிபெயர்த்தல்
  choice: பணிவிடை செய்வோர்
  alternative: ஊழியர்கள்
  rationale: மூலச்சொல் இங்கு கடவுளின் இல்லத்தில் சேவை செய்வோரைக் குறிக்கிறது; பிற்காலத் திருச்சபை அல்லது வேறு அமைப்பின் முறைப்படியான பதவியை அவசியம் குறிக்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் dignified நடையில் அமைக்கப்பட்டது. “கடவுளின் இல்லம்” என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; “வாயில் வார்த்தைகளை வைத்தல்” என்ற தமிழில் இயல்பற்ற சொற்றொடர் பொருள் தெளிவாக மாற்றப்பட்டுள்ளது. இரண்டு வேறு எபிரெயச் சேவைச் சொற்களும் தமிழில் வேறுபடுத்தப்பட்டுள்ளன.
