  text: מִ/בְּנֵ֥י שְׁכַנְיָ֖ה בֶּן יַחֲזִיאֵ֑ל וְ/עִמּ֕/וֹ שְׁלֹ֥שׁ מֵא֖וֹת הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/005.yaml
  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: ta
  text: சேகனியாவின் மக்களில், யகசியேலின் மகன்; அவனுடன் முந்நூறு ஆண்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய உரை வயதையோ சமூக நிலையைவோ அல்ல, குறிப்பாகப் பாலினத்தைக் குறிக்கும் சொல்லைப் பயன்படுத்துகிறது. அல்லது: “ஆண்பாலினர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: மக்களில்
  rationale: מִן + בְּנֵי பெரிய பட்டியலுக்குள் ஒரு குடும்பக் குழுவை அறிமுகப்படுத்துகிறது. பட்டியல் நடையில் இயல்பாகவும் சுருக்கமாகவும் இருக்க “மக்களில்” என மொழிபெயர்க்கப்பட்டது; இது வம்சத்தாரையும் குறிக்கக்கூடும்.
- source_word: שְׁכַנְיָה
  choice: சேகனியா
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகக் கடத்தும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן יַחֲזִיאֵל
  choice: யகசியேலின் மகன்
  rationale: בֶּן என்பதன் ஒருமையையும், யகசியேலுடன் உள்ள உறவையும் நேரடியாகப் பாதுகாக்கிறது. எபிரேயத்தில் இந்த மகனின் சொந்தப் பெயர் இங்கு தரப்படவில்லை.
- source_word: וְעִמּוֹ
  choice: அவனுடன்
  rationale: பட்டியலில் குறிப்பிடப்பட்ட தலைவருடன் எண்ணப்பட்ட குழு வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: முந்நூறு
  rationale: எண்ணிக்கையின் நேரடியான, வழக்கமான தமிழ் வடிவம்.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: זְכָרִים பாலினத்தைத் தெளிவாகக் குறிக்கிறது. “ஆண்கள்” என்பது நவீன தமிழில் இயல்பாக இருந்து அந்தச் சிறப்புப் பொருளையும் தக்கவைக்கிறது; வயது அல்லது சமூக நிலையை மட்டும் குறிக்கும் சொல் அல்ல.
theological_decisions:
- issue: בֶּן יַחֲזִיאֵל என்பதன் தொடர்பும் பெயரிடப்படாத நபரும்
  choice: “யகசியேலின் மகன்” என்பதை பெயரிடப்படாத தனி நபராக எபிரேயச் சொற்றொடரின் வரிசைப்படியே வைத்தல்
  alternative: “யகசியேலின் மகனான சேகனியா” என்று בֶּן יַחֲזִיאֵל-ஐ சேகனியாவுடன் இணைத்தல்
  rationale: மசோரா எபிரேய உரையில் “சேகனியாவின் மக்களில்” என்பதற்குப் பின் “யகசியேலின் மகன்” என்று வருகிறது; அந்த மகனின் பெயர் வெளிப்படையாக இல்லை. சேகனியாவையே யகசியேலின் மகன் என்று மாற்றுவது வாசகத்தைச் சீராக்கினாலும், உரையிலுள்ள உண்மையான தொடரியல் சிக்கலை மறைத்துவிடும். ஆகவே அதைத் தீர்மானமாகச் சீராக்காமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எஸ்றாவின் பெயர்–குடும்பம்–எண்ணிக்கை பட்டியல் நடையைப் பேணும் சுருக்கமான, கண்ணியமான வடிவம். மூல எபிரேயத்தில் பெயரிடப்படாமல் நிற்கும் “யகசியேலின் மகன்” என்ற தொடரை ஊகத்தால் நிரப்பவில்லை; வசனம் முந்தைய மற்றும் அடுத்த பட்டியல் உறுப்புகளுடன் தொடரும் வாக்கியத் துணுக்காகவே வைக்கப்பட்டுள்ளது.
