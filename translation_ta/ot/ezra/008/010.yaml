  text: சிலோமித், யோசிபியாவின் மகன், என்பவனின் மக்களிலிருந்து; அவனுடன் 160 ஆண்பாலினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: மக்களில்
  rationale: இணைப்புச் சொல்லும் பகுதிப்பொருள் தரும் முன்னொட்டும் சேர்ந்துள்ள எபிரெயச் சொற்றொடர், பட்டியலில் ‘மக்களில்’ என்று இயல்பாகவும் சுருக்கமாகவும் தரப்படுகிறது. ‘மக்கள்’ என்ற நேர்ப்பொருள் குலவழியினரையும் குறிக்கக்கூடும்; அந்த விரிவை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: שְׁלוֹמִית
  choice: சிலோமித்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: மூலத்தில் உள்ள ஒருமை உறவுப்பெயரை அப்படியே காக்கிறது. எபிரெய வாசகம் சுருக்கமான பட்டியல் நடையில் இருப்பதால், குறிப்பிடப்படாத பெயரைச் சேர்த்து அதன் பொருளைத் தீர்மானிக்கவில்லை.
- source_word: יוֹסִפְיָה
  choice: யோசிபியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை இயல்பான தமிழில் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְ/עִמּוֹ
  choice: அவனுடன்
  rationale: இணைப்பையும், முன் குறிப்பிடப்பட்ட ஆண் நபருடன் வந்தவர்களையும் நேரடியாகக் குறிக்கிறது.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: மூல எண்ணிக்கையைத் தெளிவான நவீன எண் வடிவில் தருகிறது.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: இச்சொல் வயது வந்த மனிதர்களை மட்டும் அல்லாமல் ஆண்பாலினரைக் குறிப்பிடுவதால், ‘ஆண்கள்’ என்பது பட்டியல் சூழலில் தெளிவான தேர்வு.
