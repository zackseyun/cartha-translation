base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: ta
  text: நான்காம் நாளில், வெள்ளியும் தங்கமும் பாத்திரங்களும்[a] நமது கடவுளின் ஆலயத்தில் எடைபோடப்பட்டு, உரியாவின் மகனாகிய ஆசாரியன் மெரெமோத்தின் பொறுப்பில் ஒப்படைக்கப்பட்டன[b]. அவனுடன் பினெகாசின் மகன் எலெயாசாரும், அவர்களுடன் லேவியர்களான யெசுவாவின் மகன் யோசபாதும் பின்னூயியின் மகன் நோவதியாவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஆலயப் பயன்பாட்டுப் பாத்திரங்கள்.
    reason: cultural_note
  - marker: b
    text: சொற்சொறாக, “மெரெமோத்தின் கையில்.” இந்த எபிரெய மரபுத்தொடர் அவரது காவலில் அல்லது பொறுப்பில் ஒப்படைக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: நான்காம் நாளில்
  rationale: தொடர்கதைச் சூழலில் இயல்பான காலக் குறிப்பாக உள்ளது; எபிரெயில் இல்லாத ‘அதற்குப் பிறகு’ போன்ற தகவல் சேர்க்கப்படவில்லை.
- source_word: נִשְׁקַל
  choice: எடைபோடப்பட்டு
  rationale: நிஃபால் வினைவடிவின் செயப்பாட்டு பொருளைப் பாதுகாக்கிறது; வெள்ளி, தங்கம், பாத்திரங்கள் ஆகிய கூட்டுப் பொருளுக்கு இயல்பான தமிழ்த் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: வெள்ளியும் தங்கமும் பாத்திரங்களும்
  rationale: கோவில் களஞ்சியச் சூழலில் כֵּלִים என்பது வழிபாட்டில் பயன்படுத்தப்பட்ட பாத்திரங்கள் அல்லது பொருட்களைக் குறிக்கலாம்; ‘பாத்திரங்கள்’ அதன் உருவகமற்ற, பொருள்சார் தன்மையைப் பாதுகாக்கிறது.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: நமது கடவுளின் ஆலயத்தில்
  rationale: ‘எங்கள் கடவுளின் வீடு’ என்பது சொற்சொறான வடிவமாயினும், இங்கு குறிக்கப்படுவது எருசலேம் ஆலயம் என்பதால் நவீன தமிழில் தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது; ‘நமது கடவுள்’ என்ற உடன்படிக்கைச் சார்ந்த உரிமைத்தொனி நிலைநிறுத்தப்பட்டது.
- source_word: עַל יַד
  choice: மெரெமோத்தின் பொறுப்பில் ஒப்படைக்கப்பட்டன
  rationale: ‘கையின்மேல்/கைக்குள்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் காவல் அல்லது பொறுப்பில் ஒப்படைப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நிர்வாகச் செயலின் நோக்கம் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொற்சொறான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: உரியாவின் மகனாகிய ஆசாரியன் மெரெமோத்
  rationale: சூழலின்படி ‘ஆசாரியன்’ என்பது மெரெமோத்தை அடையாளப்படுத்துவதாகத் தெளிவாக அமைக்கப்பட்டது; தமிழில் அது உரியாவைக் குறிப்பதாகத் தவறாகப் புரியாத சொல் வரிசை பயன்படுத்தப்பட்டது.
- source_word: וְעִמּוֹ ... וְעִמָּהֶם
  choice: அவனுடன் ... அவர்களுடன்
  rationale: ஒருமை மற்றும் பன்மைப் பிரதிப்பெயர்களின் வேறுபாட்டையும், அதிகாரிகள் படிப்படியாக அறிமுகப்படுத்தப்படும் எபிரெய வாக்கிய அமைப்பையும் பாதுகாக்கிறது.
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֽוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: லேவியர்களான யெசுவாவின் மகன் யோசபாத்தும் பின்னூயியின் மகன் நோவதியாவும்
  rationale: இறுதியிலுள்ள பன்மைச் சொல் ‘லேவியர்கள்’ கடைசியாகக் குறிப்பிடப்பட்ட இருவரையும் கூட்டாக அடையாளப்படுத்துகிறது; தமிழ் வாக்கியத்தில் அந்தத் தொடர்பு தெளிவாக முன்வைக்கப்பட்டது.
theological_decisions:
- issue: ‘ஆசாரியன்’ என்ற அடைமொழி யாரைக் குறிக்கிறது
  choice: மெரெமோத்தை அடையாளப்படுத்துவதாக மொழிபெயர்க்கப்பட்டது
  alternative: உரியாவை அடையாளப்படுத்துவதாக வாசித்தல்
  rationale: வாக்கியச் சூழலும் இணையான நிர்வாகப் பட்டியலும் மெரெமோத் ஆசாரியன் என்பதையே இயல்பான வாசிப்பாக ஆதரிக்கின்றன; தமிழில் உள்ளார்ந்த இலக்கணத் தெளிவின்மை தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. தனிப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு அண்மையாக வழங்கப்பட்டுள்ளன.
