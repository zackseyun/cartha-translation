base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: ta
  text: ஏனெனில், வழியில் எதிரியிடமிருந்து எங்களுக்கு உதவுவதற்காகப் படைவீரர்களையும் குதிரைவீரர்களையும் அரசனிடம் கேட்க நான் வெட்கப்பட்டேன்.[a] ஏனெனில், “எங்கள் தேவனுடைய கை அவரை நாடுகிற அனைவர்மேலும் நன்மைக்காக இருக்கிறது; ஆனால் அவருடைய வல்லமையும் கோபமும் அவரைக் கைவிடுகிற அனைவருக்கும் எதிராக இருக்கின்றன” என்று அரசனிடம் நாங்கள் சொல்லியிருந்தோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழியில் எதிரிக்கு எதிராக எங்களுக்கு உதவுவதற்காக” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொற்றொடர் எழுத்துப்படி “வழியில் எதிரியிடமிருந்து” என்று உள்ளது; சூழல் பயணத்திற்கான இராணுவப் பாதுகாப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேவனுடைய கை” என்பது அவருடைய செயற்படும் ஆற்றல் அல்லது ஆதரவைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: நான் வெட்கப்பட்டேன்
  rationale: இந்த வினை வெறும் சங்கடத்தை அல்ல, தான் முன்பு கூறிய நம்பிக்கை வாக்கிற்கு முரணாக நடந்துகொள்வதால் ஏற்படும் வெட்க உணர்வைக் குறிக்கிறது.
- source_word: חַיִל וּפָרָשִׁים
  choice: படைவீரர்களையும் குதிரைவீரர்களையும்
  rationale: חַיִל இச்சூழலில் அரசன் வழங்கக்கூடிய ஆயுதப் படையைக் குறிக்கிறது; פָרָשִׁים என்பது குதிரைமேல் செல்லும் வீரர்களைக் குறிக்கிறது. இரண்டையும் தனித்தனியாக வைத்திருப்பது மூலத்தின் இணைப்பைப் பாதுகாக்கிறது.
- source_word: מֵאוֹיֵב בַּדָּרֶךְ
  choice: வழியில் எதிரியிடமிருந்து
  rationale: מן என்பதன் இயல்பான பிரிவுப்பொருளை ‘எதிரியிடமிருந்து’ எனப் பாதுகாத்து, בַּדֶּרֶךְ என்பதைக் பயணத்தின்போது என இயல்பாகக் காட்டுகிறது.
- source_word: יַד אֱלֹהֵינוּ
  choice: எங்கள் தேவனுடைய கை
  rationale: தேவனுடைய செயற்படும் ஆற்றலையும் ஆதரவையும் குறிக்கும் எபிரெய உருவகத்தை விளக்கிச் சமப்படுத்தாமல் அப்படியே பாதுகாக்கிறது.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: அவரைத் தேடுகிற அனைவருக்கும் நன்மை செய்யத் துணைநிற்கிறது
  rationale: עַל மற்றும் לְטוֹבָה இணைந்து தேவனுடைய நன்மை பயக்கும் ஆதரவைத் தெரிவிக்கின்றன. தமிழில் உருவகத்தையும் பொருளையும் இயல்பாக இணைக்க ‘துணைநிற்கிறது’ பயன்படுத்தப்பட்டது.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: அவருடைய வல்லமையும் கோபமும்
  rationale: இரண்டு ஒருங்கிணைக்கப்பட்ட பெயர்ச்சொற்களையும் ஒன்றாகக் கலக்காமல் வேறுபடுத்திக் காட்டுகிறது; עֹז என்பதற்கு ‘வல்லமை’, אַף என்பதன் மொழிமரபுப் பொருளுக்கு ‘கோபம்’ இயல்பானவை.
- source_word: עַל כָּל עֹזְבָיו
  choice: அவரைக் கைவிடுகிற அனைவருக்கும் எதிராக
  rationale: עזב இங்கு சாதாரணமாக விட்டுச் செல்வதைவிட உறவுசார் விசுவாசத்தைத் துறத்தலைக் குறிக்கிறது; ‘கைவிடுகிற’ அந்த வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יַד אֱלֹהֵינוּ என்ற மானுட உருவகம்
  choice: ‘எங்கள் தேவனுடைய கை’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘எங்கள் தேவனுடைய வல்லமை’ அல்லது ‘எங்கள் தேவனுடைய தயவு’
  rationale: மூலம் தேவனுடைய செயலாற்றலை உடல் சார்ந்த உருவகத்தால் கூறுகிறது. அதை ஒரே கருத்தான வல்லமை அல்லது தயவு என்று சுருக்குவது பொருளின் பரப்பைக் குறைக்கும்.
- issue: וְעֻזּוֹ וְאַפּוֹ என்பதில் தேவனுடைய எதிர்ப்பு
  choice: ‘அவருடைய வல்லமையும் கோபமும்’ என்று இரண்டு கூறுகளையும் தனித்தனியாக மொழிபெயர்த்தல்
  alternative: ‘அவருடைய வல்ல கோபம்’ என்று ஒன்றிணைத்தல்
  rationale: எபிரெய உரை இரண்டு இணையான பெயர்ச்சொற்களை வழங்குகிறது. அவற்றைத் தனித்தனியாக வைத்திருப்பது தேவனுடைய எதிர்ப்பின் ஆற்றலையும் கோபத்தையும் ஒன்றாகவும் வேறுபட்டவையாகவும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசன்’, ‘தேவன்’, ‘வல்லமை’ போன்ற வேதாகமச் சூழலுக்கு ஏற்ற, ஆனால் மிகப் பழமையானதல்லாத சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் ‘தேவனுடைய கை’ உருவகமும் ‘வல்லமை’ மற்றும் ‘கோபம்’ ஆகிய இரட்டைச் சொல்லாக்கமும் பாதுகாக்கப்பட்டன.
