source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה אֲלֵ/הֶ֗ם אַתֶּ֥ם קֹ֨דֶשׁ֙ לַ/יהוָ֔ה וְ/הַ/כֵּלִ֖ים קֹ֑דֶשׁ וְ/הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ נְדָבָ֔ה לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: ta
  text: நான் அவர்களிடம், “நீங்கள் யாவேக்குப் பரிசுத்தமானவர்கள்; பாத்திரங்களும் பரிசுத்தமானவை. வெள்ளியும் தங்கமும் உங்கள் தந்தையரின் கடவுளாகிய யாவேக்குத் தன்னார்வக் காணிக்கையாகும்” என்று சொன்னேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: நான் ... சொன்னேன்
  rationale: אמר என்பதன் தொடர்நிலை வினை வடிவம் எஸ்றாவின் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான கதைத் தொடருக்காக தனியான ‘அப்போது/மேலும்’ சேர்க்கப்படவில்லை.
- source_word: אַתֶּם קֹדֶשׁ לַיהוָה
  choice: நீங்கள் யாவேக்குப் பரிசுத்தமானவர்கள்
  rationale: קֹדֶשׁ இங்கு யாவேக்கு அர்ப்பணிக்கப்பட்ட, அவருக்குரிய பரிசுத்த நிலையைக் குறிக்கிறது; ‘பரிசுத்தமானவர்கள்’ வழிபாட்டுச் சூழலையும் மனிதர்களைக் குறிக்கும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: הַכֵּלִים
  choice: இந்தப் பாத்திரங்கள்
  rationale: ஆலயச் சூழலில் כֵּלִים என்பது புனிதப் பயன்பாட்டுக்கான பாத்திரங்கள் அல்லது உபகரணங்களைக் குறிக்கிறது. உடனிருக்கும் பொருட்களைச் சுட்டும் தமிழ் நடை காரணமாக ‘இந்தப்’ பயன்படுத்தப்பட்டது.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: இந்த வெள்ளியும் தங்கமும்
  rationale: இரு பெயர்ச்சொற்களும் குறிப்பிட்ட வெள்ளியையும் தங்கத்தையும் குறிக்கின்றன; தமிழ் இணைப்புமுறை ‘-உம் ... -உம்’ எபிரேயச் சமநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְדָבָה
  choice: தன்னார்வக் காணிக்கை
  rationale: נְדָבָה கட்டாயமின்றி மனமுவந்து கொடுக்கப்பட்ட காணிக்கையைக் குறிக்கிறது; ‘தன்னார்வக் காணிக்கை’ அந்த வழிபாட்டுப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் உடன்படிக்கைச் சூத்திரத்தையும் காக்க ‘தந்தையர்’ பயன்படுத்தப்படுகிறது; ‘முன்னோர்’ என்று பாலினத்தைப் பொதுமைப்படுத்தவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அதன் பெயர்த்தன்மையைப் பாதுகாக்கிறது.
- issue: קֹדֶשׁ לַיהוָה என்பதன் அர்ப்பணிப்பு சார்ந்த பொருள்
  choice: யாவேக்குப் பரிசுத்தமானவர்கள்
  alternative: யாவேக்கென்று பிரித்துவைக்கப்பட்டவர்கள்
  rationale: ‘பரிசுத்தம்’ என்ற வழிபாட்டுச் சொல்லையும் யாவேக்குரியவர்களாக அர்ப்பணிக்கப்பட்ட நிலையும் இவ்வடிவம் ஒன்றாகக் காக்கிறது; விளக்கவுரையாக விரிவாக்கப்படவில்லை.
- issue: אֱלֹהֵי אֲבֹתֵיכֶם என்ற உடன்படிக்கைச் சொற்றொடர்
  choice: உங்கள் தந்தையரின் கடவுள்
  alternative: உங்கள் முன்னோர்களின் கடவுள்
  rationale: எபிரேய மூலத்தின் ஆண்பால் பன்மை வடிவமும் பிதாக்களைச் சுட்டும் பாரம்பரிய உடன்படிக்கை மொழியும் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம வழிபாட்டுச் செறிவும் கொண்ட இயல்பான நடை. நீண்ட எபிரேய ஒருங்கிணைப்பை வாசிக்க எளிதாக இரண்டு வாக்கிய அலகுகளாக அமைத்தாலும், பொருளின் இணைநிலையும் நேரடிக் கூற்றின் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
