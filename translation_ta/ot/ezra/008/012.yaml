  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: ta
  text: 'அஸ்காத்தின் சந்ததியாரில்: ஹக்காத்தானின் மகன் யோகனான்; அவனோடு 110 ஆண்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עַזְגָּד
  choice: அஸ்காதின் வழித்தோன்றல்களில்
  rationale: בְּנֵי என்பது இங்கு உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஒரு பரந்த குடும்ப வழியினரைக் குறிக்கிறது. பட்டியலின் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தர ‘வழித்தோன்றல்கள்’ பயன்படுத்தப்பட்டது.
- source_word: יוֹחָנָן
  choice: யோகனான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: בֶּן הַ/קָּטָן
  choice: அக்காத்தானின் மகன்
  rationale: இந்தப் பெயர்ப்பட்டியல் சூழலில் הַקָּטָן என்பதை விளக்க அடைமொழியாக அல்லாமல் தந்தையின் இயற்பெயராகக் கொள்ளுவது பொருத்தம்; இருப்பினும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְ/עִמּוֹ
  choice: அவனோடு
  rationale: பெயரிடப்பட்ட தலைவருடன் வந்த குழுவின் எண்ணிக்கையை அறிமுகப்படுத்தும் எஸ்றா 8-ன் வழக்கமான பட்டியல் வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: ‘நூற்றுப்பத்து’ என்ற எண்ணை நவீன வாசிப்பிற்கு எளிதாக இலக்கங்களில் தருகிறது.
- source_word: הַ/זְּכָרִים
  choice: ஆண்கள்
  rationale: זְכָרִים பாலினத்தைக் குறிப்பாகச் சுட்டுகிறது; ‘மனிதர்கள்’ போன்ற பொதுச்சொல்லைவிட ‘ஆண்கள்’ மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: הַקָּטָן என்பது இயற்பெயரா அல்லது விளக்க அடைமொழியா
  choice: அக்காத்தான் என்ற இயற்பெயர்
  alternative: ‘இளையவர்’ அல்லது ‘சிறியவர்’ என்பவரின் மகன்
  rationale: வம்சத் தலைவர்களின் பெயர்ப்பட்டியலில் இது தந்தைவழிப் பெயராகச் செயல்படுவதாகக் கொள்வது முதன்மையான வாசிப்பு; எபிரெயின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான மொழி பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் வாக்கியத் துணுக்கு தமிழில் முழுமையாக ஒலிக்க ‘வந்தார்கள்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; இது எஸ்றா 8:1–14 பட்டியலில் உள்ள பயணக் குழுவைக் குறிக்கிறது.
