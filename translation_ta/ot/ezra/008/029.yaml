  rationale: மூலத்தில் இல்லாத ‘அவ்வாறே செய்யுங்கள்’ நீக்கப்பட்டுள்ளது. இதனால் காத்துக்கொள்ளும் கட்டளை, எருசலேம் ஆலய அறைகள், அதிகாரிகளின் முன்னிலை, மற்றும் எடைபோடும் வரையிலான கால எல்லை ஆகியவை மூலத்தின் ஒரே தொடராகத் தக்கவைக்கப்படுகின்றன. அடிக்குறிப்பு b-க்குரிய கருத்து உரையில் உள்ளதால் அதன் குறியீடு பொருத்தமான இடத்தில் தக்கவைக்கப்பட வேண்டும்.
