id: EZR.8.29
reference: Ezra 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: ta
  text: விழிப்புடன் இருந்து, அவற்றைக் காத்துக்கொள்ளுங்கள்[a]; எருசலேமில் யாவேயின் இல்லத்தின் அறைகளில்[c], ஆசாரியர்களின் தலைவர்களும் லேவியர்களும் இஸ்ரவேலின் மூதாதையர் குடும்பங்களின் தலைவர்களும் முன்னிலையில் அவற்றை எடைபோடும் வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அக்கறையுடன் இருந்து, அவற்றைக் காத்துக்கொள்ளுங்கள்.” எபிரெய ஏவல் வினைகள் ஒப்படைக்கப்பட்ட பொருட்கள்மீது விழிப்பான கவனம் செலுத்துவதை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “யாவேயின் இல்லம்”; அதாவது, ஆலயம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ
  choice: விழிப்புடன் இருந்து
  rationale: שׁקד என்பதன் பன்மை ஏவல் வடிவம் விழிப்பான கவனத்தையும் அக்கறையையும் குறிக்கிறது. ஒப்படைக்கப்பட்ட பொருட்களைக் கவனமாகக் காக்கும் சூழலில் இது இயல்பான தமிழ்.
- source_word: וְשִׁמְרוּ
  choice: அவற்றைப் பாதுகாத்துக்கொள்ளுங்கள்
  rationale: שׁמר என்பதன் ‘காத்தல், பாதுகாத்தல், கவனித்துக்கொள்ளுதல்’ என்ற பொருளை வெளிப்படுத்துகிறது. ‘அவற்றை’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட பொருட்களைக் குறிக்கச் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: עַד תִּשְׁקְלוּ
  choice: அவற்றை எடைபோடும் வரை
  rationale: יקרமான பொருட்களைப் பொறுப்புக் கணக்கிற்காக எடைபோடுவதை שקל குறிக்கிறது. மூலத்தில் இல்லாத ‘ஒப்படைத்தல்’ என்ற கருத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: அதிகாரிகளின் நேரடி சாட்சியத்தில் எடைபோடப்படுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் தலைவர்கள்
  rationale: שׂרים என்பது தலைவர்கள் அல்லது அதிகாரிகள். பிற்காலத் தொழில்நுட்பப் பதவிப்பெயரை இங்கே திணிக்காமல் எபிரெயச் சொற்றொடரின் அமைப்பைப் பாதுகாக்கிறது.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இன-சமயக் குழுவுக்கான வழக்கமான தமிழ் பெயர்ப்பு.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூதாதையர் குடும்பங்களின் தலைவர்கள்
  rationale: தந்தைவழி அல்லது மூதாதையர் இல்லங்களின் தலைவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரை, குல-குடும்ப நுணுக்கத்துடன் இன்றைய வாசகருக்குப் புரியும் தமிழில் வழங்குகிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: הַלִּשְׁכוֹת
  choice: அறைகளில்
  rationale: ஆலய வளாகத்திலுள்ள அறைகளைக் குறிக்கிறது; அவை குறிப்பாகக் களஞ்சிய அறைகளே என்று மூலத்தைவிடக் குறுக்காமல் பொதுவான கட்டடப் பொருள் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லத்து
  rationale: בית என்பதன் ‘இல்லம்’ என்ற உருவகத்தைத் தக்கவைத்து, יהוה என்ற திருப்பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: בית יהוה என்பதிலுள்ள ‘இல்லம்’ உருவகம்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: ‘இல்லம்’ என்பது எபிரெய வடிவத்தைத் தக்கவைக்கிறது; இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைத்தாலும், கட்டளையின் தொடர்ச்சியை ‘அவ்வாறே செய்யுங்கள்’ என்பதால் தக்கவைத்துள்ளது. இடத்தைக் குறிக்கும் தொடர்கள் அதிகாரிகளின் பட்டியலிலிருந்து காற்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன.
