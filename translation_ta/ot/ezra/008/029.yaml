revisions:
- from: நீங்கள் விழிப்புடன் இருந்து, அவற்றைப் பாதுகாத்துக்கொள்ளுங்கள்[a]. எருசலேமில், யாவேயின் இல்லத்து அறைகளில்[c], ஆசாரியர்களின் தலைவர்கள், லேவியர்கள், இஸ்ரவேலின் மூதாதையர் குடும்பங்களின் தலைவர்கள்[b] ஆகியோரின் முன்னிலையில் அவற்றை எடைபோடும் வரை அவ்வாறே செய்யுங்கள்.
