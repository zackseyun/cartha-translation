base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: ta
  text: ஆகவே நாங்கள் உண்ணாவிரதமிருந்து, இதைக் குறித்து எங்கள் கடவுளிடம் வேண்டிக்கொண்டோம்; அவர் எங்கள் மன்றாட்டை ஏற்றுக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் எங்கள் வேண்டுதலுக்குப் பதிலளித்தார்”; இன்னும் சொற்சொல்லாக, “அவர் எங்களால் மன்றாடப்பட்டார்.”
    reason: וַיֵּעָתֵר לָנוּ என்பதன் செயலற்ற எபிரெய வடிவத்தையும் இயல்பான மற்றொரு மொழிபெயர்ப்பையும் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: நாங்கள் உண்ணாவிரதமிருந்து
  rationale: צום என்பதன் நேரடிப் பொருள் ‘உண்ணாவிரதம் இருத்தல்’. இங்கு உண்ணாவிரதத்தை அறிவித்ததாக அல்ல, குழுவினர் உண்ணாவிரதம் இருந்ததாக வினை தெரிவிக்கிறது.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: எங்கள் கடவுளிடம் வேண்டிக்கொண்டோம்
  rationale: בקשׁ என்பது ‘தேடுதல்’ அல்லது ‘கேட்டல்/வேண்டுதல்’ எனப் பொருள்படும். מן முன்னொட்டுடன் கடவுளை நோக்கிய வேண்டுதலைக் குறிப்பதால், தமிழில் ‘கடவுளிடம் வேண்டிக்கொண்டோம்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: עַל זֹאת
  choice: இதைக் குறித்து
  rationale: இந்தச் சொற்றொடர் முந்தைய சூழலில் கூறப்பட்ட காரியத்தைக் குறிக்கிறது. ‘இதைக் குறித்து’ என்பது அதன் தொடர்புப்பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: அவர் எங்கள் மன்றாட்டை ஏற்றுக்கொண்டார்
  rationale: Niphal வடிவிலுள்ள עתר, மன்றாட்டுக்கு இணங்கி சாதகமாகப் பதிலளிப்பதைக் குறிக்கிறது. ‘மன்றாட்டை ஏற்றுக்கொண்டார்’ என்பது எபிரெயச் செயலற்ற வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல் அதன் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וַיֵּעָתֵר என்ற இறை மறுமொழி வினையின் மொழிபெயர்ப்பு
  choice: அவர் எங்கள் மன்றாட்டை ஏற்றுக்கொண்டார்
  alternative: அவர் எங்கள் வேண்டுதலுக்குப் பதிலளித்தார்; சொற்சொல்லாக, அவர் எங்களால் மன்றாடப்பட்டார்
  rationale: வினை கடவுள் உண்ணாவிரதத்துடனான வேண்டுதலுக்கு இணங்கிச் சாதகமாக மறுமொழி அளித்ததைக் கூறுகிறது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்தக் கருத்தைக் காக்கிறது; அதேவேளையில், வேண்டிய அனைத்தும் குறிப்பிட்ட விதத்தில் நிறைவேறியது போன்ற கூடுதல் கூற்றைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உண்ணாவிரதம்’, ‘வேண்டிக்கொண்டோம்’, ‘மன்றாட்டு’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் இருந்து, ஜெபச் சூழலின் கண்ணியத்தையும் காக்கின்றன. எபிரெய மொழியின் உண்மையான செயலற்ற கட்டமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
