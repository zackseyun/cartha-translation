  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: ta
  text: மெராரியின் சந்ததியினரில்[a] அசபியாவையும், அவரோடு எசாயாவையும், அவருடைய சகோதரர்களையும் அவர்களுடைய மகன்களையும், மொத்தம் இருபது பேரை;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘மெராரியின் மக்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: அசபியாவையும்
  rationale: וְ தொடரும் பட்டியலை இணைக்கிறது; אֶת நேரடிச் செயப்படுபொருளைக் குறிக்கிறது. தமிழில் பெயருடன் ‘-ஐயும்’ சேர்த்து இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது. חֲשַׁבְיָה என்ற பெயர் தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்ப ‘அசபியா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: அவரோடு எசாயாவையும்
  rationale: אִתּוֹ என்பது ‘அவரோடு’ என்ற உடனிருப்பைக் குறிக்கிறது; יְשַׁעְיָה தனிநபர் பெயராக ‘எசாயா’ என ஒலிபெயர்க்கப்பட்டது. ‘-ஐயும்’ தொடரும் செயப்படுபொருள் பட்டியலைத் தெளிவாக்குகிறது.
- source_word: מִבְּנֵי מְרָרִי
  choice: மெராரியின் சந்ததியினரில்
  rationale: எபிரெயச் சொற்றொடரின் நேரடி பொருள் ‘மெராரியின் மக்களில்.’ இங்கு பல தலைமுறைகளுக்குப் பிந்தைய குலவழியினரைச் சுட்டுவதால், இயல்பான தமிழில் ‘சந்ததியினரில்’ என மொழிபெயர்க்கப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶחָיו
  choice: அவருடைய சகோதரர்களையும்
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘அவருடைய சகோதரர்கள்’ பாதுகாக்கப்படுகிறது. இப்பட்டியல் சூழலில் இது உடன்பிறந்தவர்களை மட்டுமல்லாமல் அதே குலத்தைச் சேர்ந்த நெருங்கிய ஆண் உறவினரையும் குறிக்கக்கூடும் என்பதால் விளக்கக் குறிப்பு சேர்க்கப்பட்டது.
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய மகன்களையும்
  rationale: பன்மை ஆண்பால் வடிவையும் வம்சப்பட்டியல் சூழலையும் காக்க ‘அவர்களுடைய மகன்கள்’ என மொழிபெயர்க்கப்பட்டது; ‘பிள்ளைகள்’ எனப் பொதுமைப்படுத்தப்படவில்லை.
- source_word: עֶשְׂרִים
  choice: மொத்தம் இருபது பேரை
  rationale: இருபது என்பது முன் குறிப்பிடப்பட்ட குழுவினரின் எண்ணிக்கையாக இயல்பாகப் புரிகிறது. தமிழில் அது எண்ணிக்கை என்பதைத் தெளிவாக்க ‘மொத்தம்’ மற்றும் மனிதர்களுக்குரிய ‘பேர்’ சேர்க்கப்பட்டன; செயப்படுபொருள் தொடர்ச்சிக்காக ‘-ஐ’ பயன்படுத்தப்பட்டது.
