translation_notes:
  register: நவீன, மரியாதைமிக்க, வாசிக்க எளிய தமிழ் பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தில் உள்ள வினைச்சொல்லைத் தொடர்ந்து வரும் பட்டியல் என்பதால், பெயர்களுக்கு செயப்படுபொருள் உருபு சேர்க்கப்பட்டு, தனி முற்றுவினை சேர்க்கப்படவில்லை. எண்ணிக்கையைத் தெளிவாகப் பிரித்துக் காட்ட நீண்ட கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
