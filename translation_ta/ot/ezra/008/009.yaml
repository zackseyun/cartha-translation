translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வைத்துள்ளது. மூலத்தில் இல்லாத விளக்கமோ சமயப் பிரிவு சார்ந்த கருத்தோ சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் யெகியேலுக்குப் பின் இருந்த அடிக்குறி, அதன் உரை எண்ணின் மாற்று எழுத்துவடிவத்தைப் பற்றியது என்பதால் மூல ஆதாரத்துடன் பொருந்தவில்லை; தமிழ் வெளியீட்டில் தேவையற்ற அந்த அடிக்குறி சேர்க்கப்படவில்லை.
