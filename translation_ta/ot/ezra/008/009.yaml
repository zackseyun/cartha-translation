  terminology: '“யோவாபின் வழித்தோன்றல்களில்” appropriately treats בְּנֵי־יוֹאָב as a genealogical/clan label rather than asserting immediate sons. The personal names are acceptable transliterations. No footnote is needed: the English audit footnote is misplaced, since its stated numeral alternative does not correspond to its anchor after “Jehiel.”'
