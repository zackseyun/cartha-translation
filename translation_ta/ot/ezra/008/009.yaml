source:
  edition: WLC
  text: מִ/בְּנֵ֣י יוֹאָ֔ב עֹבַדְיָ֖ה בֶּן יְחִיאֵ֑ל וְ/עִמּ֕/וֹ מָאתַ֛יִם וּ/שְׁמֹנָ֥ה עָשָׂ֖ר הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: ta
  text: 'யோவாபின் வழித்தோன்றல்களில்: யெகியேலின் மகன் ஒபதியா; அவருடன் 218 ஆண்பாலினர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: வழித்தோன்றல்களில்
  rationale: இந்தத் திரும்பிவந்தோர் பட்டியலில் ஒரு வம்சக் குழுவை அறிமுகப்படுத்துகிறது. நேரடியாக ‘மகன்களில்’ என்று மொழிபெயர்ப்பது உடனடிப் புதல்வர்களை மட்டும் குறிக்கக்கூடும் என்பதால், வம்ச உறவை இயல்பாக வெளிப்படுத்த ‘வழித்தோன்றல்களில்’ எனத் தரப்பட்டது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான முறையில் எழுத்துப்பெயர்த்தது.
- source_word: עֹבַדְיָה
  choice: ஒபதியா
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் வரும் நேரடி தந்தை–மகன் உறவைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: יְחִיאֵל
  choice: யெகியேல்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: וְעִמּוֹ
  choice: அவருடன்
  rationale: பெயரிடப்பட்ட தலைவரோடு வந்தவர்களின் எண்ணிக்கையை இயல்பான தமிழில் இணைக்கிறது; ‘וְ’ காட்டும் பட்டியல் தொடர்ச்சி நிறுத்தக்குறியின் வழியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: எபிரேய எண்ணின் மதிப்பை பட்டியல் வாசிப்புக்கு ஏற்ற இலக்க வடிவில் தெளிவாக வழங்குகிறது.
- source_word: הַזְּכָרִים
  choice: ஆண் உறுப்பினர்கள்
  rationale: இச்சொல் வயது வந்த ஆண்களை மட்டும் அல்லாமல் ஆண்பாலினரைக் குறிப்பிடுகிறது. ‘ஆண்கள்’ என்று மட்டும் தருவதால் ஏற்படக்கூடிய வயது வரம்பைத் தவிர்த்து, கணக்கிடப்பட்ட வம்சக் குழுவின் ஆண்பால் உறுப்பினர்கள் என்ற பொருளைப் பாதுகாக்கிறது.
