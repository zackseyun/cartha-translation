    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: பெபாயின் மகன்களில்
  rationale: எபிரெயச் சொற்றொடரின் ‘மகன்களில்’ என்ற வடிவத்தைத் தக்கவைக்கிறது; இப்பட்டியல் சூழலில் இது சந்ததியினர் அல்லது குடும்பவழியைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
- source_word: בֵבַי
  choice: பெபாய்
  rationale: நபரின் பெயர் நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் வேதாகம ஒலிவடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: உடனடி தந்தை–மகன் உறவைக் காட்டும் பெயரிணைப்பில் இயல்பான, நேரடியான மொழிபெயர்ப்பு.
- source_word: וְעִמּוֹ
  choice: அவனுடன்
  rationale: சகரியாவோடு வந்தவர்களைக் குறிக்கும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: இருபத்தெட்டு
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: எபிரெயச் சொல் வயதுவந்தவர்கள் என்பதைவிட ஆண்பாலினரைக் குறிப்பாகச் சுட்டுகிறது; பட்டியல் சூழலில் ‘ஆண்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் பேணுகிறது. எபிரெய வாக்கியம் வினைச்சொல் இல்லாத பட்டியல் வடிவில் இருந்தாலும், தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய ‘வந்தார்கள்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
