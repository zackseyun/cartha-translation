  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: ta
  text: அறுநூற்று ஐம்பது தாலந்து வெள்ளியையும், நூறு தாலந்து மதிப்புள்ள வெள்ளிப் பாத்திரங்களையும்[a], நூறு தாலந்து தங்கத்தையும் எடைபோட்டு அவர்களிடம் ஒப்படைத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நூறு தாலந்து மதிப்பிடப்பட்ட நூறு வெள்ளிப் பாத்திரங்களையும்.” இவ்விடத்தில் எபிரெய வாசகம் சுருக்கமாக உள்ளது; வெள்ளிப் பாத்திரங்களின் மொத்த மதிப்பு நூறு தாலந்து என்பது அதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: எடைபோட்டு ... ஒப்படைத்தேன்
  rationale: שׁקל என்பது இச்சூழலில் விலையுயர்ந்த பொருட்களை எடையிட்டு ஒப்படைப்பதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் செயலையும் அதன் நோக்கத்தையும் இயல்பாகத் தெரிவிக்க இரு கூறுகளாக மொழிபெயர்க்கப்பட்டது.
- source_word: עַל יָדָם
  choice: அவர்களிடம் ஒப்படைத்தேன்
  rationale: சொல்லர்த்தமாக ‘அவர்களுடைய கைகளின்மேல்’ என்றாலும், இந்த மரபுத்தொடர் அவர்களுடைய பொறுப்பில் கொடுப்பதைக் குறிக்கிறது. நவீன தமிழில் ‘அவர்களிடம் ஒப்படைத்தேன்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு நாணயப் பணம் அல்ல, எடையிடப்பட்ட விலையுயர்ந்த உலோகமே குறிக்கப்படுவதால் ‘வெள்ளி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כִּכָּרִים
  choice: தாலந்து
  rationale: כִּכָּר என்பது பெரிய எடை அலகு. வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘தாலந்து’ என்ற வடிவம் இங்கு தக்கவைக்கப்பட்டது.
- source_word: שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: அறுநூற்று ஐம்பது
  rationale: வெள்ளியின் தாலந்து எண்ணிக்கையை நேரடியாகக் குறிக்கும் எண்ணுப்பெயர்.
- source_word: וּכְלֵי כֶסֶף
  choice: வெள்ளிப் பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், பொருட்கள் அல்லது கருவிகள் எனப் பொருள்படலாம். ஆலயக் கருவூலப் பட்டியல் சூழலில் ‘பாத்திரங்கள்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: מֵאָה לְכִכָּרִים
  choice: நூறு தாலந்து மதிப்புள்ள
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் இலக்கண ரீதியாகத் தெளிவின்மையுடனும் உள்ளது. வெள்ளிப் பாத்திரங்களின் மொத்த மதிப்பு நூறு தாலந்து என்பதைச் சூழல் உணர்த்துவதால், அந்தப் பொருள் வாசிக்கத்தக்க தமிழில் தரப்பட்டது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: விலையுயர்ந்த உலோகத்தைக் குறிக்கும் வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: מֵאָה כִכָּר
  choice: நூறு தாலந்து
  rationale: தங்கத்தின் அளவைக் குறிக்கும் எண் மற்றும் எடை அலகு நேரடியாக மொழிபெயர்க்கப்பட்டன.
