translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைத் தக்கவைத்துக் கண்ணியமாக மொழிபெயர்க்கப்பட்டது. ‘தாலந்து’ என்பது பழங்கால எடை அலகாகப் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘கைகளின்மேல்’ என்ற உருவகத்தைச் சொல்லுக்குச் சொல் தராமல், பொறுப்பில் ஒப்படைத்தல் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
