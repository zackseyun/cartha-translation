lexical_decisions:
- source_word: וַנָּבוֹא
  choice: இவ்வாறு நாங்கள் ... வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ காக்கப்படுகிறது. தொடர்ச்சியான wayyiqtol வடிவம் முந்தைய பயண நிகழ்வின் முடிவைக் காட்டுவதால், நவீன தமிழில் ‘இவ்வாறு’ இயல்பான இணைப்பாக உள்ளது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: இடப்பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டு, வருகையின் இலக்கைச் சுட்ட ‘-க்கு’ வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: וַנֵּשֶׁב
  choice: தங்கினோம்
  rationale: ישב என்பது உட்காருதல், குடியிருத்தல், தங்குதல் ஆகிய பொருட்களைக் கொள்ளலாம். பயணத்திற்குப் பிந்தைய தற்காலிக இருப்பை இச்சூழலில் ‘தங்கினோம்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எருசலேமைத் திரும்பச் சுட்டும் இயல்பான தமிழ் இடவினையடை.
- source_word: יָמִים שְׁלֹשָׁה
  choice: மூன்று நாட்கள்
  rationale: கால நீட்டிப்பைக் குறிக்கும் எபிரெயச் சொற்றொடர் தமிழில் நேரடியாகவும் இயல்பாகவும் ‘மூன்று நாட்கள்’ என வழங்கப்படுகிறது.
