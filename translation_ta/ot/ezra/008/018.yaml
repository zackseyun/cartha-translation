revisions:
- from: எங்கள் கடவுளின் நல்ல கை எங்கள்மேல் இருந்தபடியால்[a], அவர்கள் மக்லியின் வழிவந்தவர்களில் விவேகமுள்ள ஒருவராகிய சேரெபியாவையும், அவருடைய மகன்களையும் சகோதரர்களையும்—மொத்தம் பதினெட்டுப் பேரை—எங்களிடம் அழைத்து வந்தார்கள். மக்லி லேவியின் மகன்; லேவி இஸ்ரயேலின் மகன்.
  to: எங்கள் கடவுளின் நற்கரம் எங்கள்மேல் இருந்தபடியால்[a], இஸ்ரயேலின் மகனான லேவியின் மகனான மக்லியின் சந்ததியாரில் விவேகமுள்ள ஒருவரை—அதாவது சேரெபியாவை—அவருடைய மகன்களையும் சகோதரர்களையும் சேர்த்து, பதினெட்டுப் பேரை அவர்கள் எங்களிடம் அழைத்து வந்தார்கள்.
  rationale: 'The revision preserves the Hebrew sequence and apposition: Mahli is identified as Levi''s son, and Levi as Israel''s son; Sherebiah is the discerning man; and his sons and brothers are included in the total of eighteen. ‘நற்கரம்’ retains the metaphor of God''s good hand in natural modern Tamil. The alternative represented by כְּ remains available in the footnote.'
  reviewer_model: gpt-5.6-terra
