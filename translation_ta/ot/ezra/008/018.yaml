base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: ta
  text: எங்கள் கடவுளின் நற்கரம் எங்கள்மேல் இருந்தபடியால்[a], இஸ்ரயேலின் மகனான லேவியின் மகனான மக்லியின் சந்ததியாரில் விவேகமுள்ள ஒருவரை—அதாவது சேரெபியாவை—அவருடைய மகன்களையும் சகோதரர்களையும் சேர்த்து, பதினெட்டுப் பேரை அவர்கள் எங்களிடம் அழைத்து வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் கடவுளின் நற்கரம் எங்கள்மேல் இருந்ததற்கு ஏற்ப.” இந்த எபிரெய மரபுத்தொடர் கடவுளின் சாதகமான பராமரிப்பையும் உதவியையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: அவர்கள் ... எங்களிடம் அழைத்து வந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு ‘வரச் செய்தார்கள்/அழைத்து வந்தார்கள்’ என்று பொருள்படும். மனிதர்களைச் சூழலோடு இயல்பாகக் குறிப்பிட ‘அழைத்து வந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: எங்கள் கடவுளின் நல்ல கை எங்கள்மேல் இருந்தபடியால்
  rationale: கடவுளின் சாதகமான அருளாட்சியையும் உதவியையும் குறிக்கும் எபிரெய உருவகத்தை ‘நல்ல கை’ எனத் தக்கவைத்து, כְּ முன்னொட்டின் சூழல்சார் காரண/நிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ שֶׂכֶל
  choice: விவேகமுள்ள ஒருவர்
  rationale: שׂכל என்பது வெறும் திறமையை அல்ல, புரிந்துணர்வையும் நிதானமான விவேகத்தையும் குறிக்கிறது. தமிழில் ‘விவேகமுள்ள ஒருவர்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִבְּנֵי מַחְלִי
  choice: மக்லியின் வழிவந்தவர்களில்
  rationale: வம்சப்பட்டியல் சூழலில் בְּנֵי என்பது நேரடி மகன்களை மட்டுமல்ல, சந்ததியாரையும் குறிக்கலாம். ‘வழிவந்தவர்கள்’ அந்த வம்சப் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: மக்லி லேவியின் மகன்; லேவி இஸ்ரயேலின் மகன்
  rationale: மீண்டும் வரும் בֶּן என்ற வம்சத் தொடர் தமிழில் தெளிவாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் வழங்கப்படுகிறது.
- source_word: וְשֵׁרֵבְיָה
  choice: ஒருவராகிய சேரெபியாவையும்
  rationale: சேரெபியா முன் கூறப்பட்ட ‘விவேகமுள்ள ஒருவர்’ என்பவரை அடையாளப்படுத்தும் இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது. ‘ஒருவராகிய’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் அந்த இணைப்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וּבָנָיו וְאֶחָיו
  choice: அவருடைய மகன்களையும் சகோதரர்களையும்
  rationale: குடும்ப உறவுகளையும் இணைப்பு அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שְׁמֹנָה עָשָׂר
  choice: மொத்தம் பதினெட்டுப் பேரை
  rationale: எபிரெயத்தில் எண்ணிக்கை மட்டும் இருந்தாலும், தமிழில் மனிதர்களைக் குறிக்கும் எண்ணிக்கைக்கு ‘பேர்’ தேவைப்படுகிறது; ‘மொத்தம்’ என்பது சேரெபியாவும் அவருடன் குறிப்பிடப்பட்டவர்களும் அடங்கிய எண்ணிக்கையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: கடவுளின் கையைப் பற்றிய அருளாட்சி உருவகத்தின் மொழிபெயர்ப்பு
  choice: எங்கள் கடவுளின் நல்ல கை எங்கள்மேல் இருந்தபடியால்
  alternative: எங்கள் கடவுளின் நல்ல கை எங்கள்மேல் இருந்ததற்கு ஏற்ப
  rationale: தெய்வீக உதவியையும் சாதகமான அருளாட்சியையும் குறிக்கும் ‘கை’ உருவகத்தைத் தக்கவைக்கிறது; அதை வெறும் ‘ஆசீர்வாதம்’ என்று கருத்தாக்கி மூலத்தின் உருவகத்தை அழிக்கவில்லை. כְּ என்பதின் காரண அல்லது ஒத்திசைவு நிழற்பொருளை அடிக்குறிப்பு திறந்துவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையும் பொதுவாசகர்களுக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. ‘நல்ல கை’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; வம்சத் தொடர்பு தனி வாக்கியமாக வழங்கப்பட்டு நீண்ட தொடரின் குழப்பம் தவிர்க்கப்பட்டுள்ளது.
