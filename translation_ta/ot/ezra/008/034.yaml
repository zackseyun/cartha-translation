translation:
  language: ta
  text: அனைத்தும் எண்ணப்பட்டும் எடைபார்க்கப்பட்டும், மொத்த எடையும் அப்போது பதிவு செய்யப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “எண்ணிக்கையால், எடையால், அனைத்திற்கும்; எடை முழுவதும் அந்த நேரத்தில் எழுதப்பட்டது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: எண்ணிக்கையின்படி
  rationale: מִסְפָּר என்பது ‘எண், எண்ணிக்கை’ என்பதைக் குறிக்கிறது. பொருட்களை ஒப்படைத்துச் சரிபார்க்கும் சூழலில், எண்ணிக்கையை அடிப்படையாகக் கொண்ட கணக்கெடுப்பை இச்சொல் இயல்பாகக் காட்டுகிறது.
- source_word: בְּמִשְׁקָל
  choice: எடையின்படி
  rationale: מִשְׁקָל என்பதன் அடிப்படைப் பொருள் ‘எடை.’ בְּמִסְפָּר என்பதுடன் இணையாக வரும் எபிரெய அமைப்பையும் சரிபார்ப்பு முறையையும் இது காக்கிறது.
- source_word: לַכֹּל
  choice: எல்லாமும்
  rationale: இந்தச் சொற்றொடர் எண்ணுவதும் எடை பார்ப்பதும் ஒப்படைக்கப்பட்ட பொருட்கள் அனைத்துக்கும் பொருந்தியதைத் தெரிவிக்கிறது.
- source_word: וַיִּכָּתֵב
  choice: பதிவு செய்யப்பட்டது
  rationale: כתב என்பதன் நிஃபால் வடிவம் ‘எழுதப்பட்டது’ என்ற செயப்பாட்டு பொருளுடையது. நிர்வாகச் சூழலில் ‘பதிவு செய்யப்பட்டது’ என்பது அதன் ஆவணப்படுத்தும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַמִּשְׁקָל
  choice: மொத்த எடையும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘எடை முழுவதும்’ எனலாம்; இங்கு கணக்கிடப்பட்ட ஒட்டுமொத்த எடையைக் குறிப்பதால் ‘மொத்த எடையும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בָּעֵת הַהִיא
  choice: அப்போது
  rationale: ‘அந்த நேரத்தில்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
