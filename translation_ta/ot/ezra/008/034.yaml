translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நிர்வாக நடையைப் பயன்படுத்துகிறது. ‘சரிபார்க்கப்பட்டன’ என்பது சூழலில் எண்ணி எடைபார்த்த செயலைத் தெளிவாக்குகிறது; அடிக்குறிப்பு எபிரெய மூலத்தின் சுருக்கமான சொற்றொடர் அமைப்பைக் காக்கிறது.
