base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: ta
  text: அரசரும் அவருடைய ஆலோசகர்களும் அதிகாரிகளும் அங்கே இருந்த இஸ்ரயேலர் அனைவரும் நம் கடவுளின் இல்லத்திற்காக அளித்திருந்த காணிக்கையான[a] வெள்ளியையும் தங்கத்தையும் பாத்திரங்களையும் நான் அவர்களுக்கு எடையிட்டு ஒப்படைத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புனிதப் பயன்பாட்டுக்கெனப் பிரித்து அளிக்கப்பட்ட பங்களிப்பு” என்றும் பொருள் கொள்ளலாம்.
    reason: תְּרוּמָה என்பது புனிதப் பயன்பாட்டுக்காகப் பிரித்து அளிக்கப்படும் காணிக்கை அல்லது பங்களிப்பைக் குறிக்கக்கூடியது.
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: நான் அவர்களுக்கு நிறுத்துக் கொடுத்தேன்
  rationale: שקל என்பது எடையிடுதலைக் குறிக்கிறது; לָהֶם பெறுபவர்களைக் குறிக்கிறது. சூழலில் அளவிட்ட பொருட்களை அவர்களிடம் ஒப்படைப்பதால், ‘நிறுத்துக் கொடுத்தேன்’ என்பது எடையிட்டதையும் ஒப்படைத்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֶּסֶף וְאֶת־הַזָּהָב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: இவை பணத்தைக் காட்டிலும், பாத்திரங்களுடன் பட்டியலிடப்பட்டுள்ள விலையுயர்ந்த உலோகங்களைக் குறிக்கின்றன.
- source_word: הַכֵּלִים
  choice: பாத்திரங்களையும்
  rationale: כֵּלִים என்பது பொருட்கள் அல்லது கருவிகள் என்ற பரந்த பொருளுடையது; ஆலயச் சூழலில் ‘பாத்திரங்கள்’ இயல்பான, மரபில் நிலைபெற்ற சொல்லாகும்.
- source_word: תְּרוּמַת
  choice: காணிக்கையாகிய
  rationale: புனிதப் பயன்பாட்டுக்கெனப் பிரித்து அளிக்கப்பட்ட பங்களிப்பை இச்சொல் குறிக்கிறது. ‘காணிக்கை’ ஆலயச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; குறிப்பிட்ட பலிவகையைத் தேவையின்றி சுட்டுவதில்லை.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: நம் கடவுளின் இல்லத்திற்காக
  rationale: எபிரெயச் சொல்லாட்சியிலுள்ள ‘நம் கடவுளின் வீடு/இல்லம்’ என்ற உருவகத்தைப் பேணுகிறது; இங்கு அதன் குறிப்பு ஆலயமே.
- source_word: הֵרִימוּ
  choice: அளித்த
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘உயர்த்துதல்’ என்றாலும், இச்சூழலில் புனிதப் பயன்பாட்டுக்காகப் பங்களிப்பைச் செலுத்துவதைக் குறிக்கிறது.
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: அவருடைய ஆலோசகர்களும் அதிகாரிகளும்
  rationale: முதற்சொல் ஆலோசனை வழங்குவோரையும், இரண்டாவது பாரசீக நிர்வாகச் சூழலில் அரசுப் பொறுப்பாளர்களையும் குறிக்கிறது.
- source_word: וְכָל־יִשְׂרָאֵל הַנִּמְצָאִים
  choice: அங்கே இருந்த இஸ்ரயேலர் அனைவரும்
  rationale: הַנִּמְצָאִים என்பது அந்த இடத்தில் இருந்தவர்களைச் சுட்டுகிறது; ‘இஸ்ரயேலர் அனைவரும்’ என்பது கூட்டுமக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ஆலய நன்கொடையைச் சுட்டும் תְּרוּמָה என்ற வழிபாட்டுச் சொல்
  choice: காணிக்கை
  alternative: பங்களிப்பு / அர்ப்பணம்
  rationale: இது புனிதப் பயன்பாட்டுக்கென அளிக்கப்பட்ட பொருட்களைக் குறிக்கிறது. ‘காணிக்கை’ அந்த அர்ப்பணிப்பு சார்ந்த பொருளைப் பேணுகிறது; இதை ஒரு குறிப்பிட்ட பலிச்சடங்காகக் குறுக்குவதில்லை.
- issue: בֵּית אֱלֹהֵינוּ என்பதன் உருவகம்
  choice: நம் கடவுளின் இல்லம்
  alternative: நம் கடவுளின் ஆலயம்
  rationale: ‘இல்லம்’ மூலத்தின் உருவகத்தைப் பேணுகிறது. சூழலில் அது ஆலயத்தைக் குறித்தாலும், மொழிபெயர்ப்பில் அந்த உருவகத்தை நேரடியாக மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தமிழ் வாக்கிய ஓட்டத்திற்காக கொடையாளர்கள் முதலில் வைக்கப்பட்டுள்ளனர்; பொருட்களின் பட்டியலும் அவற்றை எடையிட்டு ஒப்படைத்த செயலும் தெளிவாகப் பேணப்பட்டுள்ளன.
