base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: ta
  text: ஆகவே, ஆசாரியர்களும் லேவியர்களும் வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றின் எடையளவை[a] எருசலேமிலுள்ள நம் கடவுளின் இல்லத்துக்குக்[b] கொண்டுசெல்வதற்காகப் பெற்றுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றின் எடையை.” எபிரெயச் சொல் அளக்கப்பட்ட எடையையோ, எடையிட்டு நிர்ணயிக்கப்பட்ட அளவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் கடவுளின் ஆலயத்துக்கு.” சொல்லுக்குச் சொல், “நம் கடவுளின் இல்லத்துக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: பெற்றுக்கொண்டார்கள்
  rationale: கால் வினை வடிவம் இங்கு எஸ்றாவிடமிருந்து பொறுப்புடன் ஒப்படைக்கப்பட்ட பொருட்களைப் பெற்றுக்கொண்டதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும் லேவியர்களும்
  rationale: இரு definite பன்மைப் பெயர்களையும் இணைப்பையும் இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: מִשְׁקַל
  choice: எடையளவை
  rationale: இச்சொல் எடையையோ எடையிட்டு நிர்ணயிக்கப்பட்ட அளவையோ குறிக்கலாம். சூழலில் ஒப்படைக்கப்பட்ட மதிப்புப் பொருட்களின் கணக்கிடப்பட்ட அளவு முன்னிலையாக இருப்பதால் ‘எடையளவு’ அந்த இரு நுணுக்கங்களையும் சுருக்கமாகக் காக்கிறது.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றின்
  rationale: כסף, זהב ஆகியவை நேரடியாக ‘வெள்ளி’, ‘தங்கம்’ எனவும், ஆலயப் பயன்பாட்டுச் சூழலில் כלים ‘பாத்திரங்கள்’ எனவும் தரப்பட்டுள்ளன.
- source_word: לְהָבִיא
  choice: கொண்டுசெல்வதற்காக
  rationale: ל உடனான infinitive construct நோக்கத்தைக் காட்டுகிறது. இலக்கு எருசலேம் என்பதால் தமிழில் ‘கொண்டுசெல்’ இயல்பானது.
- source_word: לִירוּשָׁלַם
  choice: எருசலேமுக்கு
  rationale: இடப்பெயரையும் திசை/இலக்கைக் குறிக்கும் முன்னொட்டையும் வழக்கமான தமிழில் தருகிறது.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: நம் கடவுளின் இல்லத்துக்கு
  rationale: ‘நம் கடவுளின் வீடு/இல்லம்’ என்ற எபிரெய நேரடி உருவகத்தைப் பாதுகாக்கிறது; ‘ஆலயம்’ என்பது பொருள்விளக்கமான மாற்று.
