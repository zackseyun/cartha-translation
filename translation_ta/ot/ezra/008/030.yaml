translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையில் ‘எருசலேமுக்கு, நம் கடவுளின் இல்லத்துக்கு’ என்று இருந்தாலும், இலக்கு உறவைத் தமிழில் தெளிவாக்க ‘நம் கடவுளின் இல்லத்துக்கு, எருசலேமுக்கு’ என அமைக்கப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘லேவியர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
