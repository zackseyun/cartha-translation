translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். மூன்று மரபுவழிக் கூறுகளிலும் ஒரே தொடரமைப்பு காக்கப்பட்டுள்ளது; வசனத்தின் பட்டியல் தன்மைக்கு ஏற்ப சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது.
