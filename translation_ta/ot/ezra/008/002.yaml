translation:
  language: ta
  text: பினெகாஸின் மகன்களில் கெர்ஷோம்; இத்தாமாரின் மகன்களில் தானியேல்; தாவீதின் மகன்களில் ஹத்தூஷ்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: மகன்களில்
  rationale: מִן உடன் வரும் בְּנֵי இப்பட்டியலில் ஒரு வம்சத்திலிருந்து வந்தவரை அறிமுகப்படுத்துகிறது. ‘மகன்களில்’ என்பது எபிரெயச் சொற்றொடரின் மறுமொழி அமைப்பைக் காத்து, தமிழிலும் பட்டியல் நடையை இயல்பாகத் தருகிறது; சூழலில் ‘வம்சத்தாரில்’ என்ற பரந்த பொருளும் இருக்கலாம்.
- source_word: פִינְחָס
  choice: பினெகாஸ்
  rationale: தனிப்பெயர்; எபிரெய ஒலிவடிவத்திற்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: גֵּרְשֹׁם
  choice: கெர்சோம்
  rationale: தனிப்பெயர்; மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: אִיתָמָר
  choice: இத்தாமார்
  rationale: தனிப்பெயர்; எபிரெய ஒலிவடிவத்தின்படி ஒலிபெயர்க்கப்பட்டது.
- source_word: דָּנִיֵּאל
  choice: தானியேல்
  rationale: தனிப்பெயர்; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: דָוִיד
  choice: தாவீது
  rationale: தனிப்பெயர்; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம். இங்கு தாவீதின் வம்சத்தைக் குறிக்கிறது.
- source_word: חַטּוּשׁ
  choice: அத்தூஷ்
  rationale: தனிப்பெயர்; எபிரெயச் சொல்லின் தொடக்க ח ஒலியைத் தமிழில் இயல்பான அண்மித்த வடிவமாகவும், இரட்டித்த மெய்யையும் நீண்ட உயிரையும் பிரதிபலிக்கும் வகையிலும் ஒலிபெயர்க்கப்பட்டது.
