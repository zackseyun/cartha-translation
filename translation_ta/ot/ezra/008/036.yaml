  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான நிர்வாக நடையைப் பயன்படுத்துகிறது. வரலாற்றுத் துல்லியத்திற்காக ‘சத்ரபதிகள்’ என்ற குறிப்பிட்ட பதவி வைக்கப்பட்டுள்ளது. இரண்டாவது ‘அவர்கள்’ என்பதன் முன்சுட்டை எபிரெய உரையைப் போலவே வெளிப்படையாகத் தீர்மானிக்காமல் விடுகிறது.
