base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: ta
  text: அவர்கள் அரசனுடைய ஆணைகளை அரசனுடைய சத்ராப்புகளிடமும், “நதிக்கு அப்பால்” பகுதியின் ஆளுநர்களிடமும் ஒப்படைத்தார்கள்; அவர்கள் மக்களுக்கும் தேவனுடைய இல்லத்திற்கும்[c] ஆதரவளித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உதவினார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘தூக்கினார்கள்’ அல்லது ‘சுமந்தார்கள்’; இங்கு ஆதரவு கொடுத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ‘தேவனுடைய ஆலயம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ஒப்படைத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்கள்’; அரச ஆணைகள் அதிகாரிகளிடம் முறையாகச் சேர்க்கப்பட்ட நிர்வாகச் சூழலில் ‘ஒப்படைத்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: அரசனுடைய ஆணைகள்
  rationale: பாரசீகக் கால நிர்வாகச் சூழலில் דָּתֵי என்பது அதிகாரபூர்வமான உத்தரவுகள் அல்லது ஆணைகளைக் குறிக்கிறது; முழுமையான சட்டத் தொகுப்பு என்ற எண்ணத்தைத் தவிர்க்க ‘ஆணைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: சத்ரபதிகள்
  rationale: இது பாரசீகப் பேரரசின் மாகாண ஆட்சியாளர்களுக்கான குறிப்பிட்ட வரலாற்றுப் பதவி; அடுத்துவரும் ‘ஆளுநர்கள்’ என்பதிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: פַחֲוֹת
  choice: ஆளுநர்கள்
  rationale: פחה என்பது ஒரு பகுதி அல்லது மாகாணத்தை நிர்வகிக்கும் அதிகாரிகளைக் குறிக்கிறது; ‘ஆளுநர்கள்’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: עֵבֶר הַנָּהָר
  choice: “நதிக்கு அப்பால்” பகுதி
  rationale: இது யூபிராத்து நதிக்கு மேற்கிலிருந்த பாரசீக நிர்வாகப் பகுதிக்கான பெயர். மேற்கோள் குறிகளும் ‘பகுதி’ என்பதும் அதன் நிர்வாகப் பெயர்தன்மையைத் தெளிவாக்குகின்றன.
- source_word: וְנִשְּׂאוּ
  choice: ஆதரவளித்தார்கள்
  rationale: נשא என்பதன் நேரடிப் பொருள் ‘தூக்குதல்/சுமத்தல்’; இங்கு மக்களுக்கும் தேவனுடைய இல்லத்திற்கும் உதவி மற்றும் ஆதரவு வழங்கியதைக் குறிக்கும் வழக்குப் பொருள் பொருந்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெய உரை பொதுவாக ‘மக்கள்’ என்றே கூறுகிறது; ‘இஸ்ரவேல் மக்கள்’ போன்ற கூடுதல் அடையாளம் உரைக்குள் சேர்க்கப்படவில்லை.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் அது ஆலயத்தைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
