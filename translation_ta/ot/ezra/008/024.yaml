  verdict: revise
  source_fidelity: மூல எபிரெய வாக்கியத்தின் எண்ணிக்கை/பெயர்ப் பட்டியல் அமைப்பு விவாதத்திற்குரியது. வரைவு முதன்மை உரையில் செரெபியா, அசபியா, மேலும் பத்து சகோதரர்களை முன்கூறிய பன்னிரண்டு ஆசாரியத் தலைவர்களுக்குப் புறம்பான கூடுதல் நபர்களாகக் காட்டுகிறது. இது சாத்தியமான வாசிப்பாயினும், வாக்கியத்தின் இயல்பான பட்டியல் அமைப்பையும் இணை உரை மரபையும் கருத்தில் கொண்டால், அவர்கள் அந்தப் பன்னிருவரின் அடையாளமாகவே அமையலாம். எனவே முதன்மை உரையில் ‘பன்னிருவரில்’ என்ற அமைப்பைத் தெளிவாகக் கொண்டு, கூடுதல்-நபர்கள் வாசிப்பை அடிக்குறிப்பில் பாதுகாப்பது பாதுகாப்பானது. ‘நியமித்தேன்’ என்பது בדל (‘பிரித்து/ஒதுக்கி வைத்தேன்’) என்பதைக் கடந்துவிடுவதால் நீக்கப்பட்டுள்ளது.
  naturalness: ‘ஆசாரியத் தலைவர்களில் பன்னிருவரை’ மற்றும் ‘அவர்களுடைய சகோதரர்களில் பத்துப் பேரை’ நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளன. பெயர்களின் இணைப்புப் பட்டியலைத் தமிழில் வாசிக்க எளிதாக்கப் புணர்ச்சிக்குறியும் ‘அவர்களோடு’ வடிவும் பயன்படுத்தப்பட்டுள்ளன.
  terminology: ‘ஆசாரியர்’ என்பது כֹּהֲנִים என்பதற்கான நிலையான சொல். ‘ஆசாரியத் தலைவர்கள்’ שָׂרֵי הַכֹּהֲנִים என்பதன் தலைமைப் பொருளைத் தக்கவைக்கிறது. ‘தனியே பிரித்துவைத்தேன்’ Hiphil בדל-இன் செயற்பொருளை நேரடியாக வெளிப்படுத்துகிறது. ‘சகோதரர்கள்’ என்ற நேரடிப் பொருள் வைத்திருக்கப்படுகிறது; விரிவான பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
