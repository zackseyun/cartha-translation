translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தனியே பிரித்து நியமித்தேன்’ என்பது மூலத்தின் பிரித்துவைத்தல் கருத்தையும் இச்சூழலின் பொறுப்பு நியமனத்தையும் இணைக்கிறது. எண்ணிக்கைக் கட்டமைப்பில் உள்ள உண்மையான ambiguity முதன்மை உரையில் அமைதியாகத் தீர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
