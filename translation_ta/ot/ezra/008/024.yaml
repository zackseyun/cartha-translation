base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: ta
  text: 'பின்பு, ஆசாரியத் தலைவர்களில் பன்னிருவரைத் தனியே பிரித்துவைத்தேன்: செரெபியா, அசபியா, அவர்களோடு அவர்களுடைய சகோதரர்களில் பத்துப் பேர்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மையான ஆசாரியர்களில் பன்னிருவரை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத் தொடரைச் சிலர், செரெபியா, அசபியா, அவர்களுடைய சகோதரர்களில் பத்துப் பேர் ஆகியோரையும் பன்னிருவருக்குப் புறம்பாகத் தனியே பிரித்துவைத்ததாகப் புரிந்துகொள்கிறார்கள். “சகோதரர்கள்” என்பது விரிவான பொருளில் அவர்களுடைய உறவினர்களையோ உடன்சேவை செய்தவர்களையோ குறிக்கலாம்; ஆனால் எபிரெயம் ஆண்பால் உறவுமுறைச் சொல்லையே பயன்படுத்துகிறது.
    reason: structural_ambiguity; lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: தனியே பிரித்து நியமித்தேன்
  rationale: בדל என்பதன் ஹிஃபில் வடிவம் ‘பிரித்துவைத்தல்’ அல்லது ‘தனியே ஒதுக்குதல்’ என்று பொருள்படும். இங்கு புனிதப் பொறுப்புக்காக ஆட்களைத் தேர்ந்து ஒதுக்கும் சூழலை ‘தனியே பிரித்து நியமித்தேன்’ இயல்பாக வெளிப்படுத்துகிறது; וָ־ தொடர்ச்சியை ‘பின்பு’ காட்டுகிறது.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: ஆசாரியத் தலைவர்களில்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது முதன்மையானவர்கள் என்பதையும், מִן இங்கு ஒரு குழுவிலிருந்து எடுக்கப்பட்ட பகுதியையும் குறிக்கிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேரை
  rationale: மனிதர்களைக் கணக்கிடும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: மேலும் செரெபியாவையும் அசபியாவையும்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. செரெபியாவுக்கு முன் உள்ள לְ־, முன்னர் கூறப்பட்ட பன்னிரண்டு ஆசாரியத் தலைவர்களோடு இவர்களையும் சேர்த்துக் குறிப்பிடுவதாக முதன்மை உரையில் புரிந்துகொள்ளப்பட்டுள்ளது; வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעִמָּהֶם
  choice: அவர்களுடன்
  rationale: எபிரெயச் சேர்க்கை அமைப்பை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: מֵאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களில்
  rationale: אָח என்ற ஆண்பால் உறவுமுறைச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது உறவினர்களையோ உடன்சேவை செய்பவர்களையோ விரிவாகக் குறிக்கக்கூடும் என்பதைக் குறிப்பு தெரிவிக்கிறது.
- source_word: עֲשָׂרָה
  choice: பத்துப் பேரை
  rationale: மனிதர்களைக் கணக்கிடும் இயல்பான தமிழ் வடிவம்.
