  to: 'பின்பு, ஆசாரியத் தலைவர்களில் பன்னிருவரைத் தனியே பிரித்துவைத்தேன்: செரெபியா, அசபியா, அவர்களோடு அவர்களுடைய சகோதரர்களில் பத்துப் பேர்.[a][b]'
