translation:
  language: ta
  text: 'ஆதீனின் சந்ததியினரிலிருந்து: யோனத்தானின் மகன் ஏபேத்; அவனுடன் ஐம்பது ஆண்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: சந்ததியினரில்
  rationale: பட்டியலில் ஒரு குலத்தையோ வம்சக் குழுவையோ அறிமுகப்படுத்தும் בְּנֵי என்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘சந்ததியினரில்’ என மொழிபெயர்க்கப்பட்டது; தொடர் பட்டியலின் இணைப்பு தமிழில் இயல்பாகப் புரிவதால் וּ தனியாகச் சொல்லப்படவில்லை.
- source_word: עָדִין
  choice: ஆதீன்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: עֶבֶד
  choice: ஏபேத்
  rationale: இங்கு இது ‘வேலைக்காரன்/அடிமை’ என்ற பொதுப்பெயர் அல்ல, ஆள்பெயர். ஆகவே எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சத் தொடர்பைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; தமிழில் இயல்பான மரபுவழிக் குறிப்பாக வழங்கப்பட்டது.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய ஆள்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וְ/עִמּוֹ
  choice: அவனுடன்
  rationale: பெயரிடப்பட்ட தலைவரோடு வந்தவர்களின் எண்ணிக்கையை இணைக்கிறது. தமிழில் ‘அவனுடன்’ என்பதே சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: חֲמִשִּׁים
  choice: ஐம்பது
  rationale: எண்ணிக்கையின் நேரடியான தமிழ் வடிவம்.
- source_word: הַזְּכָרִים
  choice: ஆண்கள்
  rationale: זְכָרִים ஆண்பாலினரைத் தனிப்படக் குறிக்கிறது. பட்டியலின் மனிதச் சூழலில் ‘ஆண்கள்’ என்பது பாலினக் குறிப்பைத் தக்கவைத்தபடியே நவீன தமிழில் இயல்பாக உள்ளது.
