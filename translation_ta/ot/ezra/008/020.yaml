base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: ta
  text: லேவியர்களின் பணிக்காகத் தாவீதும் அதிகாரிகளும் நியமித்திருந்த ஆலயப் பணியாளர்களில் 220 பேர் இருந்தனர்.[a] அவர்கள் அனைவரும் பெயரால் குறிப்பிடப்பட்டிருந்தனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயப் பணியாளர்கள்’ என்பதற்கான எபிரெயச் சொல் நெதினீம் (נְתִינִים); இது ஆலயப் பணிக்காக இணைக்கப்பட்டிருந்த ஒரு குறிப்பிட்ட பணியாளர் வகுப்பைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் அனைவரும் பெயர் வாரியாகப் பட்டியலிடப்பட்டிருந்தனர்.’
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: இது பொதுவான பணியாளர்களைக் குறிக்காமல், ஆலயப் பணியுடன் இணைக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பினரைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘ஆலயப் பணியாளர்கள்’ என்பது அதன் செயல்பாட்டை நவீன வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שֶׁנָּתַן
  choice: நியமித்திருந்த
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடுத்தான்’ என்றாலும், இங்கு மனிதர்களை ஒரு பணிக்காக ஒதுக்கிய நிர்வாகச் சூழல் இருப்பதால் ‘நியமித்திருந்த’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שׂרים என்போர் ஆட்சியிலும் நிர்வாகத்திலும் பொறுப்புடைய தலைவர்களைக் குறிக்கின்றனர்; பழமையான ‘பிரபுக்கள்’ என்பதைக் காட்டிலும் ‘அதிகாரிகள்’ நவீனத் தமிழில் இயல்பானது.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: லேவியர்களின் பணிக்காக
  rationale: இந்தத் தொடர் லேவியர்களின் ஆலயப் பணியை ஆதரிப்பதற்கான நியமனத்தைக் குறிக்கிறது. அவர்களுக்குக் கீழ்ப்படிந்து பணியாற்றினார்களா அல்லது அவர்களோடு இணைந்து பணியாற்றினார்களா என்பதைத் தேவையின்றி தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 220 பேர்
  rationale: எண்ணைத் துல்லியமாகவும் நவீன வாசிப்புக்கு எளிதாகவும் வழங்குகிறது; மனிதர்களைக் குறிப்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֻּלָּם
  choice: அவர்கள் அனைவரும்
  rationale: எபிரெயச் சொல்லில் உள்ள முழுமையான, பகிர்ந்தளிக்கும் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: பெயர்பெயராகக் குறிப்பிடப்பட்டிருந்தார்கள்
  rationale: ஒவ்வொருவரும் பெயரால் குறிப்பாக அடையாளப்படுத்தப்பட்டனர் என்ற நிர்வாக நுணுக்கத்தை இது வெளிப்படுத்துகிறது; ‘பட்டியலிடப்பட்டிருந்தார்கள்’ என்பதும் சாத்தியம்.
