translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வாக்கியம் முந்தைய வசனத்தின் தொடராக இருந்தாலும், தனி வசனமாக வாசிக்க இயலுமாறு ‘வந்தார்கள்’ என்பது சூழலிலிருந்து நிறைவு செய்யப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
