base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: ta
  text: அப்போது, எருசலேமிலுள்ள கடவுளின் ஆலயப் பணி[a] நின்றுபோனது[b]. அது பெர்சிய அரசன் தரியுவின் ஆட்சியின் இரண்டாம் ஆண்டுவரை முடங்கிய நிலையிலேயே இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘கடவுளின் வீடு.’ இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நிறுத்தப்பட்டது’ அல்லது ‘ஓய்ந்தது’ என்றும் மொழிபெயர்க்கலாம். அரமேய மூலச்சொல் பணி நின்றதையோ நிறுத்தப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அது முடங்கிய நிலையிலேயே இருந்தது’ என்பது பணி தொடர்ந்து நிறுத்தப்பட்டிருந்த நிலையைக் குறிக்கிறது; இது பணி நின்றது என்பதை வெறுமனே மீண்டும் கூறுவதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: அப்போது
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து நிகழ்ந்ததைச் சுட்டும் அரமேயக் கால/தொடர்ச்சி வினையடை; நவீன தமிழில் இயல்பான இணைப்பு.
- source_word: בְּטֵלַת עֲבִידַת
  choice: பணி நின்றுபோனது
  rationale: בטל என்பது நிற்றல் அல்லது நிறுத்தப்படுதல் என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். செயப்படுபொருள் வினை வடிவத்தைத் திணிக்காமல், பணி முடங்கியதை இயல்பாகச் சொல்கிறது.
- source_word: בֵּית אֱלָהָא
  choice: கடவுளின் ஆலயம்
  rationale: சொல்லர்த்தமாக ‘கடவுளின் வீடு’; இச்சூழலில் தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; சொல்லர்த்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: எருசலேமிலுள்ள
  rationale: உறவுத்தொடரையும் இடத்தையும் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַהֲוָת בָּטְלָא
  choice: நிறுத்தப்பட்ட நிலையிலேயே இருந்தது
  rationale: முதலில் பணி நின்ற நிகழ்வை மீண்டும் கூறாமல், தொடர்ந்து நிலவிய முடக்கநிலையை வெளிப்படுத்துகிறது.
- source_word: עַד שְׁנַת תַּרְתֵּין לְמַלְכוּת דָּרְיָוֶשׁ
  choice: தரியுவின் ஆட்சியின் இரண்டாம் ஆண்டுவரை
  rationale: அரசாண்டுக் காலக்குறிப்பைத் தெளிவான தமிழ் மரபில் தருகிறது.
- source_word: מֶלֶךְ פָּרָס
  choice: பெர்சிய அரசன்
  rationale: அரச பட்டத்தை இயல்பான தமிழ் சொல் வரிசையில் வழங்குகிறது.
