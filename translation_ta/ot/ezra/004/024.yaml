  register: நவீன பொதுத்தரத் தமிழ்; கண்ணியமான வேதாகம நடையுடன் எளிதில் புரியும் வாக்கிய அமைப்பு. ‘ஆலயம்’ சூழல்சார் தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் சொல்லர்த்தமான ‘வீடு’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. בטל என்பதிலுள்ள செய்நிலை/செயப்பாட்டு தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
