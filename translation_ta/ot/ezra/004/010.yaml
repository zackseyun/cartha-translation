  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: ta
  text: பெருமையும் கண்ணியமும் மிக்க ஒஸ்னப்பார்[a] நாடுகடத்திச் சமாரியா நகரத்தில் குடியமர்த்திய மீதமுள்ள மக்களும், ஆற்றுக்கு அப்பாலுள்ள பகுதியில் இருந்த மற்றவர்களும்[b]—இப்பொழுது:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒஸ்னப்பார் பொதுவாக அசீரிய அரசன் அசூர்பானிப்பாலுடன் அடையாளப்படுத்தப்படுகிறார். எனினும், மூல அரமேய உரையிலுள்ள பெயர் வடிவமே இங்கே வைக்கப்பட்டுள்ளது.
    reason: cross_reference
  - marker: b
    text: ‘ஆற்றுக்கு அப்பால்’ என்பது ஐப்பிராத்து ஆற்றுக்கு மேற்கிலிருந்த பகுதிக்கான பாரசீக நிர்வாகப் பெயர்.
    reason: cultural_note
  - marker: c
    text: இறுதிச் சொற்றொடர் அரமேயக் கடிதங்களில் பயன்படுத்தப்பட்ட ஒரு சூத்திரம். இதை ‘மற்றும் பல’ அல்லது ‘இத்தருணத்தில்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: எஞ்சிய மக்களும்
  rationale: שְׁאָר என்பது எஞ்சிய பகுதியையும், אֻמַּיָּא என்பது பல்வேறு மக்கள் குழுக்களையும் குறிக்கிறது. முந்தைய வசனத்திலிருந்து தொடரும் கடிதத்தின் எழுத்தாளர் பட்டியலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַגְלִי
  choice: நாடுகடத்தி
  rationale: பேரரசின் கட்டாய இடமாற்றத்தையும் புலம்பெயரச் செய்தலையும் சுருக்கமாகவும் வரலாற்றுப் பொருத்தத்துடனும் தெரிவிக்கிறது.
- source_word: אָסְנַפַּר
  choice: ஒஸ்னப்பார்
  rationale: அரமேய மூலத்தில் காணப்படும் பெயர் வடிவமே ஒலிபெயர்க்கப்படுகிறது; வரலாற்று அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: רַבָּא וְיַקִּירָא
  choice: பெருமையும் மேன்மையும் கொண்ட
  rationale: அரசவைக்குரிய இரட்டை மரியாதை அடைமொழிகளின் உயர்ந்த தொனியை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: குடியமர்த்திய
  rationale: காரணவினை வடிவம் குறிக்கும் திட்டமிட்ட மறுகுடியேற்றத்தை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: சமாரியா நகரத்தில்
  rationale: மூலத்தின் ஒருமை வடிவமான ‘நகரம்’ என்பதைக் காக்கிறது; சூழலின் அடிப்படையில் பன்மையாக்கவில்லை.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள மாகாணத்தின் மற்ற இடங்களிலும்
  rationale: עֲבַר נַהֲרָה என்பதை ஐப்பிராத்துக்கு மேற்கிலிருந்த பாரசீக நிர்வாகப் பகுதியெனத் தெளிவுபடுத்துகிறது; ‘மற்றவை’ என்பதன் இடவியல் பொருளை தமிழில் இயல்பாக்குகிறது.
- source_word: וּכְעֶנֶת
  choice: இப்பொழுது—
  rationale: கடிதத்தின் முதன்மைப் பொருளுக்குள் செல்லும் அரமேயக் கடிதச் சூத்திரத்தின் உரையாடல் செயல்பாட்டைக் காட்டுகிறது; அதன் பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
