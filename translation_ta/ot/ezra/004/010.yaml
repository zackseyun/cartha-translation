translation_notes:
  register: நவீன தரநிலைத் தமிழ்; வரலாற்றுக் கடிதத்தின் மரியாதைத் தொனியையும் பட்டியல் தொடர்ச்சியையும் காக்கும் வகையில் அமைக்கப்பட்டது. வசனம் முந்தைய வசனத்திலிருந்து தொடரும் துண்டாக இருப்பதால் ‘எழுதுவது’ சேர்க்கப்பட்டுள்ளது; இறுதி சூத்திரத்துக்குப் பின் நீள்கோடு அதன் தொடர்ச்சியைக் குறிக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
