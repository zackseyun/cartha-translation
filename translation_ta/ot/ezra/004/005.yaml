  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: ta
  text: அவர்கள் அவர்களுக்கு எதிராக ஆலோசகர்களைக் கூலிக்கு அமர்த்தினார்கள்; அவர்களுடைய திட்டத்தை[a] முறியடிப்பதற்காக, பெர்சிய அரசன் கோரேசின் நாட்களெல்லாம், பெர்சிய அரசன் தரியுவின் ஆட்சிக்காலம் வரையிலும் அவ்வாறு செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய ஆலோசனையைப் பயனற்றதாக்க” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான עֲצָה என்பதற்கு “ஆலோசனை,” “திட்டம்,” அல்லது “நோக்கம்” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: கூலிக்கு அமர்த்தி
  rationale: שׂכר என்பதன் இச்சூழல் பொருள் பணம் கொடுத்து ஒருவரின் சேவையைப் பெறுவது. ஊழல் நோக்கமுள்ள ‘லஞ்சம் கொடுத்தனர்’ என்று குறிப்பாக்காமல், எபிரெயச் சொல்லின் பொதுப் பொருளை இது இயல்பாகத் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: இவர்களுக்கு எதிராக
  rationale: எதிர்ப்புச் சூழலும் தொடர்ந்து வரும் ‘முறியடிக்க’ என்ற நோக்கமும் עַל இங்கே எதிர்நிலைப் பொருளில் வருவதைக் காட்டுகின்றன.
- source_word: יוֹעֲצִים
  choice: ஆலோசகர்கள்
  rationale: יעץ வேரிலிருந்து வரும் சொல் ஆலோசனை வழங்குவோரைக் குறிக்கிறது; நிர்வாக-அரசியல் சூழலுக்கும் ‘ஆலோசகர்கள்’ பொருந்துகிறது.
- source_word: לְהָפֵר
  choice: முறியடிக்க
  rationale: הפר என்பது முறித்தல், செல்லாததாக்குதல், நிறைவேறாமல் செய்தல் ஆகிய பொருள்களைக் கொள்ளும். திட்டத்தைச் செயலிழக்கச் செய்வதை ‘முறியடிக்க’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲצָתָם
  choice: இவர்களுடைய திட்டம்
  rationale: עֵצָה என்பதற்கு ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருள்கள் உண்டு. ஆலய மறுகட்டுமானச் சூழலில் ‘திட்டம்’ தெளிவானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל יְמֵי
  choice: காலமெல்லாம்
  rationale: முழுக் காலப்பகுதியையும் குறிக்கும் எபிரெயக் காலவியல் தொடரை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: பெர்சிய அரசன் கோரேசு
  rationale: பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு அரசப் பட்டம் மொழிபெயர்க்கப்படுகிறது; தமிழின் இயல்பான பட்டம்-பெயர் வரிசை பயன்படுத்தப்படுகிறது.
- source_word: וְעַד
  choice: தொடங்கி ... வரையிலும்
  rationale: கோரேசின் காலத்திலிருந்து தரியுவின் ஆட்சிவரை தொடர்ந்த கால எல்லையைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: מַלְכוּת
  choice: ஆட்சிக்காலம்
  rationale: இந்தக் காலவியல் அமைப்பில் מַלְכוּת அரசாட்சிப் பரப்பை அல்ல, மன்னன் ஆட்சி செய்த காலத்தைச் சுட்டுகிறது.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: பெர்சிய அரசன் தரியு
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு அரசப் பட்டம் மொழிபெயர்க்கப்படுகிறது.
