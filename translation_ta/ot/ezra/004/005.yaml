translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ்நடை. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது. முந்தைய வசனத்தில் வரும் எதிரிகளையும் யூத மக்களையும் வேறுபடுத்த ‘அவர்கள்/இவர்கள்’ பயன்படுத்தப்பட்டுள்ளது. ‘முயன்றார்கள்’ என்பது நோக்கத்தைக் குறிக்கும் לְ + infinitive அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தடுப்பு வெற்றியடைந்தது என்று அளவுக்கு மீறி உறுதிப்படுத்தவில்லை.
