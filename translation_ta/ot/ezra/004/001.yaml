reference: Ezra 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: ta
  text: யூதாவுக்கும் பென்யமீனுக்கும் எதிரிகளானவர்கள், நாடுகடத்தப்பட்டோரின் சந்ததியினர்[a] இஸ்ரவேலின் கடவுளாகிய யாவேக்காக ஓர் ஆலயத்தைக் கட்டிக்கொண்டிருந்தார்கள் என்று கேள்விப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘நாடுகடத்தலின் மகன்கள்’; நாடுகடத்தப்பட்ட சமூகத்தோடு வம்சம் அல்லது சமூக அடையாளத்தால் இணைந்தவர்களைக் குறிக்கிறது.
    reason: ‘சந்ததியினர்’ என்ற தமிழ்ச் சொல்லால் ஏற்படக்கூடிய மிகக் குறுகிய உயிரியல்-வம்சப் புரிதலைத் தவிர்த்து, மூல எபிரெய மரபுத்தொடரையும் அதன் சமூகப் பயன்பாட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: שׁמע இங்கு கடந்தகாலக் கதைநிகழ்வைக் குறிக்கிறது. தமிழ் வழக்கில் தகவல் அறிந்ததைக் இயல்பாகத் தெரிவிக்க ‘கேள்விப்பட்டார்கள்’ பொருந்துகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: צָרֵי
  choice: எதிரிகள்
  rationale: צר என்பதன் பன்மை இணைப்புவடிவம் பகைமை கொண்ட எதிர்த்தரப்பினரைக் குறிக்கிறது. ‘எதிரிகள்’ என்பது தேவையற்ற இராணுவப் பொருளைச் சேர்க்காமல் அந்த எதிர்ப்புணர்வைக் காக்கிறது.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: யூதா, பென்யமீன் ஆகியோர்
  rationale: இவை கோத்திரம் அல்லது பிரதேசத்தைக் குறிக்கும் இயற்பெயர்கள்; தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי அவர்கள் கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கும் ‘ஏனெனில்’ அல்ல.
- source_word: בְנֵי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டவர்களின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘நாடுகடத்தலின் மகன்கள்’. தமிழில் இயல்பாகவும், நாடுகடத்தப்பட்ட சமூகத்தோடு சந்ததி அல்லது சமூக அடையாளத்தால் இணைந்தவர்களைக் குறிக்கும் விரிவையும் காக்கும் வகையிலும் ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; நேரடிச் சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בּוֹנִים
  choice: கட்டிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலக் கதைச்சூழலில் இந்தப் பெயரெச்ச வடிவம் தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கிறது. ‘மீண்டும் கட்டிக்கொண்டிருந்தார்கள்’ என்று மூல வினையில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: הֵיכָל
  choice: ஆலயம்
  rationale: היכל சில சூழல்களில் அரண்மனையைக் குறிக்கலாம்; இங்கு அது யாவேக்காகக் கட்டப்படுவதால் கடவுளை வழிபடும் ஆலயமே சூழலுக்குப் பொருந்தும்.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: ל முன்னொட்டு இங்கு கட்டுமானத்தின் நோக்கத்தைச் சுட்டுவதால் ‘-க்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இந்த இணைப்புத் தொடர் யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்துகிறது; தமிழில் நேரடியாகவும் இயல்பாகவும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் தருவது உடன்படிக்கைப் பெயரின் தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வாக்கியத்தின் தகவல் அமைப்பும், எதிரிகளின் அடையாளமும், கட்டுமானம் தொடர்ந்து நடந்துகொண்டிருந்த தன்மையும் காக்கப்பட்டுள்ளன. ‘தேவாலயம்’ இன்று கிறிஸ்தவ சபைக் கட்டடத்தைக் குறிக்கக்கூடும் என்பதால், நடுநிலையான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
