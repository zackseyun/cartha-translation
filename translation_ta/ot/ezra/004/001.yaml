  verdict: revise
  source_fidelity: மூலத்தின் நிகழ்காலத் தொடர்ச்சியுடைய கடந்தகாலச் செயல், எதிர்ப்பாளர்கள், ஆலயம், யாவே என்ற இறைப்பெயர் ஆகியவை சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘நாடுகடத்தப்பட்டவர்களின் மக்கள்’ என்பது தமிழில் தெளிவற்றதும் இயல்பற்றதுமாக உள்ளது; அது நாடுகடத்தப்பட்டவர்களுக்குச் சொந்தமான பொதுமக்களைக் குறிக்கவும் வாய்ப்புண்டு. எபிரெய ‘நாடுகடத்தலின் மகன்கள்’ என்ற சமூக/வம்ச அடையாளத்தைத் தெளிவாகக் காட்ட வேண்டும்.
  naturalness: ‘யூதா, பென்யமீன் ஆகியோரின் எதிரிகள்’ புரிந்துகொள்ளத்தக்கது; இருப்பினும் ‘யூதாவுக்கும் பென்யமீனுக்கும் எதிரிகளானவர்கள்’ என்பது அவர்கள் எதிர்த்த தரப்பினர் என்ற பொருளை நவீனத் தரத் தமிழில் மிகத் தெளிவாகத் தருகிறது. ‘சந்ததியினர்’ என்பது இவ்விடத்தில் தற்போதைய ‘மக்கள்’ என்பதைக் காட்டிலும் துல்லியமும் இயல்பும் உடையது.
