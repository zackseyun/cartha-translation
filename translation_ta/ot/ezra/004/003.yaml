  revised_text: ஆனால் செருபாபேலும், யேசுவாவும், இஸ்ரவேலின் மற்ற தந்தைவழிக் குடும்பத் தலைவர்களும் அவர்களிடம், “எங்கள் கடவுளுக்கு ஓர் ஆலயத்தைக்[b] கட்டுவதில் உங்களுக்கு எங்களோடு பங்கு இல்லை. இஸ்ரவேலின் கடவுளாகிய யாவேவுக்காக நாங்கள் மட்டுமே[a] அதைக் கட்டுவோம்; பெர்சிய அரசரான கோரேசு எங்களுக்குக் கட்டளையிட்டபடியே கட்டுவோம்” என்றார்கள்.
