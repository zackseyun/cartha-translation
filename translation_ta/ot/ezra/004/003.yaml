base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: ta
  text: ஆனால் செருபாபேலும், யேசுவாவும், இஸ்ரவேலின் மற்ற தந்தைவழிக் குடும்பத் தலைவர்களும் அவர்களிடம், “எங்கள் கடவுளுக்கு ஓர் ஆலயத்தைக்[b] கட்டுவதில் உங்களுக்கு எங்களோடு பங்கு இல்லை. இஸ்ரவேலின் கடவுளாகிய யாவேவுக்காக நாங்கள் மட்டுமே[a] அதைக் கட்டுவோம்; பெர்சிய அரசரான கோரேசு எங்களுக்குக் கட்டளையிட்டபடியே கட்டுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “நாங்கள் ஒன்றாகக் கட்டுவோம்.” இச்சூழலில், உதவ முன்வந்தவர்களோடு சேராமல் தாங்களே ஒன்றாகக் கட்டுவோம் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: மூலமொழியில், “வீடு”; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்கள்
  rationale: எபிரெய மொழியில் ஒருமை வினை வடிவம் வந்தாலும், செருபாபேல், யேசுவா, மற்ற தலைவர்கள் ஆகிய கூட்டெழுவாய்க்கு இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: செருபாபேலும், யேசுவாவும்
  rationale: எபிரெயப் பெயர்களின் ஒலிப்பை நவீன தமிழில் தெளிவாக எழுத்துப்பெயர்த்த வடிவங்கள்.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: இஸ்ரவேலின் மற்ற தந்தைவழிக் குடும்பத் தலைவர்களும்
  rationale: இது வெறும் பொதுத் தலைவர்களை அல்ல, குல அல்லது மூதாதையர் குடும்பங்களின் தலைவர்களைக் குறிக்கும் சமூக அமைப்புச் சொற்றொடர்; ‘தந்தைவழிக் குடும்பம்’ அதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: உங்களுக்கு எங்களோடு பங்கு இல்லை
  rationale: கூட்டாகப் பங்கேற்கும் உரிமையை மறுக்கும் எபிரெயச் சொற்றொடரின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיִת לֵאלֹהֵינוּ
  choice: எங்கள் கடவுளுக்கு ஓர் ஆலயம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; இச்சூழலில் அது கடவுளுடைய ஆலயத்தைக் குறிப்பதால், தமிழில் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டு நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: நாங்கள் மட்டுமே அதைக் கட்டுவோம்
  rationale: יַחַד என்பதன் நேரடிப் பொருள் ‘ஒன்றாக’; ஆனால் முன் வந்த மறுப்புடன் சேர்ந்து, வேண்டுகோள் விடுத்தவர்களின்றி இஸ்ரவேலரே கட்டுவார்கள் என்ற எதிர்மறை வேறுபாட்டை இங்கு காட்டுகிறது. மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல், அதன் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிப்பெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: எங்களுக்குக் கட்டளையிட்டபடியே
  rationale: அரச ஆணையின் அதிகாரத் தொனியையும், அதற்கேற்பச் செயல்படுதல் என்ற ஒப்புமையையும் பாதுகாக்கிறது.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: பெர்சிய அரசரான கோரேசு
  rationale: மூலத்தின் அரசப் பட்டத்தை இயல்பான தமிழ்ச் சொல் வரிசையில் வழங்குகிறது; எபிரெயத்தில் ‘அரசன்’ இருமுறை வருவது தமிழில் தேவையற்ற மறுமொழியாக இருப்பதால் ஒருமுறை மட்டுமே தரப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிப்பெயர்க்கப்பட்டது.
- issue: יַחַד என்பதன் பொருள்
  choice: நாங்கள் மட்டுமே
  alternative: நாங்கள் ஒன்றாக
  rationale: ‘ஒன்றாக’ என்பது நேரடிப் பொருள். ஆயினும் முன் வாக்கியத்தில் மற்றவர்களின் பங்கு திட்டவட்டமாக மறுக்கப்படுவதால், இங்கு யூதத் தலைவர்களின் குழுவே தனியாகக் கட்டும் பொருள் சூழலால் பெறப்படுகிறது. நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டு உண்மையான மொழியியல் வேறுபாடு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ என்பது பழங்காலக் குடும்ப அமைப்பைத் தட்டையாக்காமல் காட்டுகிறது. உரையாடல் அதிகாரபூர்வமாகவும் நேரடியாகவும் வைக்கப்பட்டுள்ளது.
