  terminology: செருபாபேல், யேசுவா, கோரேசு, பெர்சியா, யாவே ஆகிய பெயர்வடிவங்கள் சீராக உள்ளன. “ஆலயம்” என்பது சூழலுக்கு ஏற்ற தெளிவாக்கம்; மூலத்தின் ‘வீடு’ என்ற சொல்லை அடிக்குறிப்பு உரியவாறு பாதுகாக்கிறது. யாவேக்கு என்பதற்குப் பதிலாக யாவேவுக்காக என்பது לַיהוָה-வின் நோக்க/அர்ப்பணிப்பு உறவைத் தமிழில் சற்று இயல்பாக வெளிப்படுத்துகிறது.
