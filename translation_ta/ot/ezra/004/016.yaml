base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: ta
  text: 'நாங்கள் அரசருக்குத் தெரிவிப்பது இதுவே: இந்த நகரம் மீண்டும் கட்டப்பட்டு, அதன் மதில்கள் முழுமையாகக் கட்டப்பட்டால், இதன் விளைவாக ஆற்றுக்கு அப்பாலுள்ள மாகாணத்தில்[b] உமக்கு எந்தப் பங்கும்[a] இருக்காது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பங்கு” என்பதற்கான அரமேயச் சொல் “பங்குரிமை” அல்லது இச்சூழலில் இன்னும் குறிப்பாக “வருவாய்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆற்றுக்கு அப்பால்” என்பது ஐப்பிராத்து ஆற்றுக்கு மேற்கிலிருந்த பாரசீக மாகாணத்தின் அதிகாரப்பூர்வப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: அரசருக்குத் தெரிவிப்பது என்னவென்றால்
  rationale: அதிகாரப்பூர்வக் கடிதத்தின் அறிவிப்பு நடையை இயல்பான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது; பன்மை எழுவாய் வினை வடிவத்தில் உள்ளடங்கியுள்ளது.
- source_word: דִּי הֵן
  choice: என்னவென்றால், … என்றால்
  rationale: அறிக்கையின் உள்ளடக்கத்தையும் அதற்குள் வரும் நிபந்தனையையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: קִרְיְתָא דָךְ
  choice: இந்த நகரம்
  rationale: דָךְ என்பதன் அண்மைச் சுட்டுப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תִּתְבְּנֵא
  choice: திரும்பக் கட்டப்பட்டு
  rationale: செயப்பாட்டு வடிவத்தையும் நகரம் மீண்டும் கட்டப்படுதல் என்ற சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: அதன் மதில்களும் கட்டி முடிக்கப்பட்டால்
  rationale: நகரின் அரண்மதில்களைக் குறிக்கும் சொல்லையும் அவை முழுமை பெறும் கட்டுமானப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: לָקֳבֵל דְּנָה
  choice: அதன் விளைவாக
  rationale: முன்னுள்ள நிபந்தனையிலிருந்து வரும் விளைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חֲלָק
  choice: பங்கு
  rationale: அடிப்படைச் சொற்பொருளான ‘பங்கு/பங்குரிமை’ என்பதைப் பாதுகாக்கிறது; வருவாய் அல்லது அரசியல் உரிமை எனக் குறிப்பாக்காமல் மூலத்தின் பொருள் அகலத்தைத் தக்கவைக்கிறது.
- source_word: בַּעֲבַר נַהֲרָא
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதியில்
  rationale: பாரசீக ஆட்சிக்குட்பட்ட அதிகாரப்பூர்வ பிராந்தியப் பெயரைக் குறிக்கும் சூழலை வாசகருக்குத் தெளிவாக்குகிறது; ‘பகுதி’ என்பது விளக்கத்திற்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: לָא אִיתַי לָךְ
  choice: உமக்கு … இருக்காது
  rationale: அரசரை நோக்கிய ஒருமை மரியாதையையும் அரமேய இருப்பு-உடைமை அமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
