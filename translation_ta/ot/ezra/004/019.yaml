translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். அரசாணை மற்றும் ஆவண ஆய்வு ஆகிய நிர்வாகச் சூழலைத் தெளிவாக வைத்துக்கொண்டு, அரமேய மூலத்தின் அரசியல் எதிர்ப்பு சார்ந்த சொற்களுக்கிடையிலான நுட்ப வேறுபாட்டையும் காக்கிறது.
