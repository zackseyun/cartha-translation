  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: ta
  text: என் உத்தரவின்படி ஓர் ஆணை பிறப்பிக்கப்பட்டது; அவர்கள் ஆராய்ந்து, இந்த நகரம் பண்டைய நாட்களிலிருந்தே அரசர்களுக்கு எதிராக எழுந்து வந்ததையும்[a], அதில் கிளர்ச்சியும் கலகமும் நடைபெற்றதையும்[b] கண்டறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரசர்களுக்கு எதிராகத் தன்னை உயர்த்தி வந்தது.’ அரமேய வினை தன்னை உயர்த்திக்கொள்வதைக் குறிக்கலாம்; இச்சூழலில் அது எதிர்த்து எழுவதையும் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதில் கிளர்ச்சியும் கலகமும் செய்யப்பட்டன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: என்னிடமிருந்து ஓர் ஆணை பிறப்பிக்கப்பட்டது
  rationale: ‘ஓர் ஆணையை ஏற்படுத்து’ என்ற அரமேய நிர்வாக மரபுத்தொடரை இயல்பான தமிழில் அதிகாரப்பூர்வ ஆணையாகத் தருகிறது; וּמִנִּי என்பதன் ‘என்னிடமிருந்து’ என்ற மூலத்தையும் காக்கிறது.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: அவர்கள் ஆராய்ந்து ... கண்டறிந்தார்கள்
  rationale: அரசுப் பதிவுகளில் மேற்கொள்ளப்பட்ட விசாரணையையும் அதன் முடிவையும் தெளிவாகக் காட்டுகிறது.
- source_word: קִרְיְתָא דָךְ
  choice: இந்த நகரம்
  rationale: விவாதிக்கப்படும் நகரைச் சுட்டும் அரமேயச் சுட்டுப்பெயரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: מִן יוֹמָת עָלְמָא
  choice: பண்டைய நாட்களிலிருந்தே
  rationale: தொன்றுதொட்ட காலத்தைச் சுட்டும் மரபுத்தொடரின் வரலாற்று ஆழத்தைக் காக்கிறது.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: அரசர்களுக்கு எதிராக எழுந்து வந்தது
  rationale: வினையின் ‘தன்னை உயர்த்துதல்’ மற்றும் அரசியல் எதிர்ப்பாக எழுதல் ஆகிய இரு நிழற்பொருள்களையும் முற்றிலும் ‘கலகம் செய்தது’ எனச் சுருக்காமல் காக்கிறது.
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  choice: கலகமும் அரசுக்கு எதிரான கிளர்ச்சியும்
  rationale: ஒன்றோடொன்று தொடர்புடைய இரு அரசியல் எதிர்ப்புச் சொற்களையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது; அரிதான சட்டச்சொல்லைக் காட்டிலும் பொதுவாகப் புரியும் மொழியைப் பயன்படுத்துகிறது.
- source_word: מִתְעֲבֶד בַּהּ
  choice: அதில் ... நடைபெற்று வந்தது
  rationale: நகருக்குள் இத்தகைய செயல்கள் தொடர்ந்து நிகழ்ந்தன என்ற செயலற்ற/தொடர்நிலை உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
