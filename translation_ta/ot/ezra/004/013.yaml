base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: ta
  text: 'இப்போது அரசருக்குத் தெரியட்டும்: இந்த நகரம் மறுபடியும் கட்டப்பட்டு, அதன் மதில்கள் கட்டி முடிக்கப்பட்டால், அவர்கள் கப்பம், வரி, சுங்கம் ஆகியவற்றைச் செலுத்தமாட்டார்கள்; இறுதியில் அது அரசர்களின் வருவாய்க்குத் தீங்கு விளைவிக்கும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறுதியில் அது அரசர்களுக்கு இழப்பை ஏற்படுத்தும்.” அரமேயத் தொடர் சுருக்கமாக இருப்பதால், செலுத்தப்படாத கப்பம், வரி, சுங்கம் ஆகியவற்றின் சூழலிலிருந்தே இது வருவாய் இழப்பு என்று கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: இப்போது
  rationale: எச்சரிக்கையையும் முடிவுரையையும் அறிமுகப்படுத்தும் அரமேய உரையாடல் இடைச்சொல்லின் இயல்பான தமிழ் இணை.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: அரசர் இதை அறிந்துகொள்வாராக
  rationale: அதிகாரபூர்வக் கடிதத்தில் வரும் ‘அரசருக்குத் தெரியட்டும்’ என்ற சூத்திரத்தை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: קִרְיְתָא דָךְ
  choice: இந்த நகரம்
  rationale: எழுதுபவர்களின் பார்வையில் சுட்டப்படும் எருசலேமை குறிக்கும் அண்மைச் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: תִּתְבְּנֵא
  choice: மறுபடியும் கட்டப்பட்டு
  rationale: நிபந்தனைச் சூழலில் நகரம் மீண்டும் கட்டப்படுவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: அதன் மதில்கள் கட்டிமுடிக்கப்பட்டால்
  rationale: நகரின் அரண்மதில்கள் முழுமையாகக் கட்டி நிறைவேற்றப்படுதல் என்ற பொருளைத் தருகிறது.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: கப்பம், வரி, சுங்கம்
  rationale: பாரசீக நிர்வாகத்தின் மூன்று வேறுபட்ட வருவாய் வகைகளையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: לָא יִנְתְּנוּן
  choice: அவர்கள் … செலுத்தமாட்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘கொடுக்கமாட்டார்கள்’ என்பதற்குப் பதிலாக வரிவிதிப்புச் சூழலுக்கு ஏற்ற இயல்பான வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது; மறைந்துள்ள பன்மை எழுவாய் நகரவாசிகளைக் குறிக்கிறது.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: இறுதியில் அது அரசர்களின் வருவாய்க்குத் தீங்கு விளைவிக்கும்
  rationale: சுருக்கமான அரமேய தொடரை வரிவருவாய் பற்றிய உடனடி சூழலின் அடிப்படையில் வாசிக்கிறது; ‘இறுதியில்’ என்ற காலநிலையையும் அரசர்களுக்கு ஏற்படும் இழப்பையும் பாதுகாக்கிறது.
