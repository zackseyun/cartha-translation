base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: ta
  text: அப்போது, ஆணையாளர்[a] ரெகூமும், எழுத்தர் சிம்சாயும், அவர்களுடைய மற்ற கூட்டாளிகளான தீனாயர்களும்[b], அப்பர்சத்தக்கியர்களும்[c], தர்பேலியர்களும், பெர்சியர்களும், எரேக்கியர்களும், பாபிலோனியர்களும், சூசா நகரத்தாரும் (அதாவது, ஏலாமியரும்)—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த அரமேயப் பட்டத்தின் சொற்பொருள் ‘ஆணையின் பொறுப்பாளர்’ என்பதாக இருக்கலாம்; ‘முதன்மை அலுவலர்’ அல்லது ‘ஆலோசகர்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: பதவிப் பெயரின் துல்லியமான நிர்வாகப் பொருள் உறுதியாக இல்லை.
  - marker: b
    text: அல்லது, “நீதிபதிகளும்.” அரமேயச் சொல்லை ஒரு மக்கள் குழுவின் பெயராகவோ நிர்வாகப் பதவியாகவோ புரிந்துகொள்ளலாம்.
    reason: மக்கள் பெயர் மற்றும் நிர்வாகப் பதவி ஆகிய இரு வாசிப்புகளையும் காக்கிறது.
  - marker: c
    text: இந்த அரமேயப் பெயர் தெளிவற்றது; இதை ஒரு மக்கள் குழுவின் பெயராகவும், ஓர் அதிகாரிகள் குழுவைக் குறிக்கும் சொல்லாகவும் புரிந்துகொண்டுள்ளனர்.
    reason: அடையாளம் உறுதியாகாத சொல்லின் மாற்று நிர்வாக விளக்கத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: אֱדַיִן
  choice: அப்போது
  rationale: அரமேய நிகழ்வுத் தொடரில் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: רְחוּם
  choice: ரெகூம்
  rationale: தனிப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּעֵל טְעֵם
  choice: ஆணையாளர்
  rationale: சொல்லுக்கு நேரடியாக ‘ஆணை/தீர்மானத்தின் பொறுப்பாளர்’ என்ற நிர்வாகப் பொருள் உண்டு; துல்லியமான பதவி உறுதியாகாததால் பொதுவான அதிகாரப் பட்டம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שִׁמְשַׁי
  choice: சிம்சாய்
  rationale: தனிப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: סָפְרָא
  choice: எழுத்தர்
  rationale: ஆவணங்களை எழுதும் நிர்வாக அலுவலரைக் குறிக்கும் அரமேயப் பதவிக்கு இயல்பான தமிழ் இணை.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: அவர்களுடைய மற்ற கூட்டாளிகள்
  rationale: அவர்களுடன் இணைந்திருந்த எஞ்சிய குழுவினரை இயல்பான தமிழில் குறிக்கிறது.
- source_word: דִּינָיֵא
  choice: தீனாயர்கள்
  rationale: இது மக்கள் குழுவின் பெயராகவோ ‘நீதிபதிகள்’ என்ற நிர்வாகப் பெயராகவோ புரிந்துகொள்ளப்படலாம்; பட்டியலின் வடிவத்தையும் மூலத்தின் தெளிவின்மையையும் காக்க ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲפַרְסַתְכָיֵא
  choice: அப்பர்சத்தக்கியர்கள்
  rationale: அடையாளம் உறுதியாகாத குழுப் பெயர்; ஊகமான நிர்வாகப் பொருளை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: טַרְפְּלָיֵא
  choice: தர்பேலியர்கள்
  rationale: அடையாளம் உறுதியாகாத இன அல்லது மக்கள் குழுப் பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲפָרְסָיֵא
  choice: பெர்சியர்கள்
  rationale: பெர்சிய மக்களைக் குறிக்கும் தெளிவான பெயர்.
- source_word: אַרְכְּוָיֵא
  choice: எரேக்கியர்கள்
  rationale: எரேக்/உருக் நகரைச் சேர்ந்தவர்களைக் குறிக்கும் பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: בָבְלָיֵא
  choice: பாபிலோனியர்கள்
  rationale: பாபிலோனைச் சேர்ந்த மக்களுக்கான வழக்கமான தமிழ் பெயர்.
- source_word: שׁוּשַׁנְכָיֵא
  choice: சூசானியர்கள்
  rationale: சூசா நகரைச் சேர்ந்தவர்களைக் குறிக்கும் குழுப் பெயர்.
- source_word: דֶּהָיֵא
  choice: தெகாயர்கள்
  rationale: மசோரா உரையில் தனியான, அடையாளம் உறுதியாகாத குழுப் பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: עֵלְמָיֵא
  choice: ஏலாமியர்கள்
  rationale: ஏலாம் மக்களைக் குறிக்கும் தெளிவான பெயர்.
