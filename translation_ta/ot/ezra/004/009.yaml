  source_fidelity: 'மூல அரமேயத்தில் பாபிலோனியர்களுக்குப் பின் வரும் சொற்கள் שׁוּשַׁנְכָיֵא דִּי־הוּא עֵלְמָיֵא: ‘சூசா நகரத்தார், அதாவது ஏலாமியர்’ என்பதாகும். வரைவில் உள்ள ‘தெகாயர்களும்’ என்பதற்கு மூலத்தில் இணையான குழுப்பெயர் இல்லை; இது ‘that is/அதாவது’ என்ற விளக்கத் தொடரைத் தவறாகக் குழுப்பெயராக மாற்றியுள்ளது. மற்றத் தெளிவற்ற குழுப்பெயர்களை ஒலிபெயர்ப்பாக வைத்திருப்பது மூலத்தின் நிச்சயமின்மையை நன்றாகக் காக்கிறது.'
