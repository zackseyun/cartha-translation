  register: நவீன நிலையான தமிழில், அரச நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. வாக்கியம் அடுத்த வசனத்தில் தொடர்வதை இறுதி நீள்கோடு காட்டுகிறது. தெளிவற்ற குழுப் பெயர்கள் ஊகமாகப் பொருளாக்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; முக்கிய மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
