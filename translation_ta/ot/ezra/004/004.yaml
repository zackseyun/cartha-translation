translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் ‘கைகளைத் தளரச் செய்தல்’ என்ற முக்கிய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; இறுதி இலக்கணத் தொடர்பிலுள்ள நுண்ணிய தெளிவின்மை மாற்று வாசகமாகக் கொடுக்கப்பட்டுள்ளது.
