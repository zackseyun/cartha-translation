source:
  edition: WLC
  text: וַ/יְהִי֙ עַם הָ/אָ֔רֶץ מְרַפִּ֖ים יְדֵ֣י עַם יְהוּדָ֑ה ו/מבלהים אוֹתָ֖/ם לִ/בְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/004.yaml
  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: ta
  text: அப்போது அந்நாட்டின் மக்கள் யூதா மக்களின் கைகளைத் தளரச் செய்தும்[a], கட்டுவதைத் தடுக்க அவர்களை அச்சுறுத்தியும் வந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “கைகளைத் தளரச் செய்து”; அதாவது, அவர்களை மனந்தளரச் செய்து அவர்களுடைய உறுதியைக் குலைத்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கட்டுவதற்கு அவர்களை அஞ்சச் செய்தார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது
  rationale: தொடர்ச்சியான அடுத்த நிகழ்வை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: עַם הָאָרֶץ
  choice: அந்நாட்டின் மக்கள்
  rationale: சூழலில் திரும்பிவந்தவர்களை எதிர்த்த உள்ளூர் மக்களைக் குறிக்கும் எபிரெயச் சொற்றொடரின் உருவத்தையும் பொருளையும் காக்கிறது.
- source_word: מְרַפִּים יְדֵי
  choice: கைகளைத் தளரச் செய்து
  rationale: துணிவையும் செயலாற்றும் வலிமையையும் குன்றச் செய்வதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: עַם יְהוּדָה
  choice: யூதா மக்கள்
  rationale: கட்டுமானப் பணியில் ஈடுபட்ட யூதாவின் சமூகத்தைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וּמְבַלְהִים
  choice: அச்சுறுத்திக்கொண்டிருந்தார்கள்
  rationale: அச்சம் அல்லது கலக்கத்தை ஏற்படுத்துதல் என்ற தொடர்ச்சியான செயலைச் சூழலுக்கேற்ற தமிழில் தெரிவிக்கிறது.
- source_word: אוֹתָם
  choice: அவர்களை
  rationale: யூதா மக்களைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: לִבְנוֹת
  choice: கட்டுவதைத் தொடர முடியாதபடி
  rationale: לִבְנוֹת என்பதன் நேரடி வடிவம் ‘கட்ட’ என்றாலும், இங்கு அச்சுறுத்தலால் கட்டும் பணி தடுக்கப்பட்டதைக் காட்ட இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டுள்ளது; மாற்று நேரடி அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
