  text: וּ/בִ/ימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּ/שְׁאָ֣ר כנות/ו עַל ארתחששתא מֶ֣לֶךְ פָּרָ֑ס וּ/כְתָב֙ הַֽ/נִּשְׁתְּוָ֔ן כָּת֥וּב אֲרָמִ֖ית וּ/מְתֻרְגָּ֥ם אֲרָמִֽית־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: ta
  text: அர்தசஷ்டாவின் நாட்களில், பிஷ்லாம், மித்ரெதாத், தாபெயேல் ஆகியோரும் அவனுடைய மற்ற கூட்டாளிகளும்[b] பெர்சியாவின் அரசனான அர்தசஷ்டாவுக்கு எழுதினார்கள். அந்தக் கடிதத்தின் உரை அரமேய மொழியில் எழுதப்பட்டு, அரமேய மொழியில் மொழிபெயர்க்கப்பட்டிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆவணம் அரமேய எழுத்துமுறையில் எழுதப்பட்டு, அரமேய மொழியில் மொழிபெயர்க்கப்பட்டிருந்தது.” எபிரெய-அரமேய வாசகம் கடினமானது. இது எழுத்துமுறைக்கும் மொழிக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறதா, அல்லது எழுதுதலுக்கும் மொழிபெயர்த்தல்/விளக்குதலுக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறதா என்பதில் கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய மற்ற கூட்டாளிகளும்.” ‘அவனுடைய’ என்பதற்கான பின்னொட்டு வடிவில் ஒருமையாக இருந்தாலும், அது கூட்டாக அந்தக் குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: நாட்களில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; இதைத் தொழில்நுட்பமான ஆட்சிக்காலக் குறிப்பாக மிகுதியாக விளக்கவில்லை.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: அர்தசஷ்டா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற அரசப் பெயரின் ஒலிபெயர்ப்பு.
- source_word: כָּתַב
  choice: எழுதினார்கள்
  rationale: வினைச்சொல்லின் எளிய பொருளான ‘எழுது’ என்பதையே தருகிறது; இவ்வசனம் நேரடியாகச் சொல்லாத ‘குற்றச்சாட்டு’ போன்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: பிஷ்லாம், மித்ரெதாத், தாபெயேல்
  rationale: மூன்று தனிப்பட்ட பெயர்களையும் மூலமொழியின் ஒலிக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּשְׁאָר כנותו
  choice: அவனுடைய மற்ற கூட்டாளிகளும்
  rationale: שְׁאָר என்பதன் ‘மற்றவர்கள்/மீதியானவர்கள்’ என்ற பொருளையும், சிக்கலான כנותו என்பதன் பொதுவாக ஏற்கப்படும் ‘கூட்டாளிகள்’ என்ற பொருளையும் தருகிறது. ஒருமை வடிவிலுள்ள உடைமைப் பின்னொட்டு ‘அவனுடைய’ என்று பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל
  choice: அர்தசஷ்டாவுக்கு
  rationale: כתב உடன் வரும் நிர்வாகச் சூழலில், எழுதப்பட்ட செய்தியைப் பெறுபவரைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை உருபு; ‘எதிராக’ என்ற பொருளை இவ்வசனத்தில் கட்டாயப்படுத்தவில்லை.
- source_word: מֶלֶךְ פָּרָס
  choice: பெர்சியாவின் அரசனான
  rationale: அர்தசஷ்டாவை அடையாளப்படுத்தும் அரசப் பட்டத்தைத் தெளிவான தமிழ் அடைமொழித் தொடராகத் தருகிறது.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: அந்தக் கடிதத்தின் உரை
  rationale: כְתָב என்பதன் ‘எழுத்து/உரை’ என்ற பொருளையும், அரிய நிர்வாகச் சொல்லான נשתון குறிக்கும் கடித ஆவணத்தையும் இயல்பாக இணைக்கிறது.
- source_word: כָּתוּב אֲרָמִית
  choice: அரமேய மொழியில் எழுதப்பட்டு
  rationale: இத்தொடர் பொதுவாகக் குறிக்கும் மொழியை முதன்மை உரையில் தருகிறது; எழுத்துமுறையைக் குறிக்கலாம் என்ற வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וּמְתֻרְגָּם אֲרָמִית
  choice: அரமேய மொழியில் மொழிபெயர்க்கப்பட்டிருந்தது
  rationale: מְתֻרְגָּם என்பதன் மொழிபெயர்த்தல்/விளக்குதல் என்ற பொருளையும், மீண்டும் வரும் אֲרָמִית என்பதையும் மிகுதியாகத் தீர்மானிக்காமல் நெருக்கமாகப் பாதுகாக்கிறது.
