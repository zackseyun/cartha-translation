translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; நிர்வாகச் சூழல் தெளிவாக்கப்பட்டாலும் மூலத்தில் இல்லாத குற்றச்சாட்டு போன்ற தகவல் சேர்க்கப்படவில்லை. இறுதித் தொடரின் உண்மையான மொழியியல் சிக்கல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
