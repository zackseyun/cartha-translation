  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: ta
  text: உங்கள் முன்னோர்களின்[a] பதிவேட்டில் தேடுதல் நடத்தப்படட்டும். அப்போது, பதிவேட்டில் நீங்கள் கண்டறிந்து, இந்த நகரம் கலகம் புரியும் நகரம் என்றும், அரசர்களுக்கும் மாகாணங்களுக்கும் தீங்கு விளைவிப்பது என்றும், பண்டைய காலம் முதலே அந்த நகரத்தில் கலகம் செய்யப்பட்டு வந்துள்ளது என்றும் அறிந்துகொள்வீர்கள்.[b] இதனால்தான் இந்த நகரம் பாழாக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “உங்கள் தந்தையரின்” அல்லது “உங்களுக்கு முன்பிருந்த ஆட்சியாளர்களின்”; சொல்லளவில், “உங்கள் தந்தையரின்.”'
    reason: lexical_alternative
  - marker: b
    text: இங்கு பயன்படுத்தப்பட்டுள்ள அரமேயச் சொற்றொடர், அந்த நகரத்தில் கலகம் அல்லது கிளர்ச்சி நிகழ்த்தப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: தேடிப் பார்க்கும்படி செய்யுங்கள்
  rationale: செயப்படுபொருள் சார்ந்த வேண்டுகோள் உணர்வைத் தமிழில் இயல்பான அரச நிர்வாகக் கோரிக்கையாக வெளிப்படுத்துகிறது.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: பதிவேடு
  rationale: அரசின் அதிகாரப்பூர்வ எழுத்துப் பதிவுத் தொகுப்பைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் சொல்.
- source_word: אֲבָהָתָךְ
  choice: உங்கள் முன்னோர்கள்
  rationale: சொல்லளவில் ‘தந்தையர்’ என்றாலும், இச்சூழலில் அரசருக்கு முன்பிருந்த அரசர்களையோ ஆட்சியாளர்களையோ குறிக்கும் பொருளைத் தெளிவுபடுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּתְהַשְׁכַּח ... וְתִנְדַּע
  choice: நீங்கள் கண்டறிந்து ... அறிந்துகொள்வீர்கள்
  rationale: தேடலின் விளைவாகக் கண்டுபிடித்து உறுதியாக அறிதல் என்ற நிர்வாகச் சூழலை இயல்பாகத் தருகிறது.
- source_word: קִרְיָא מָרָדָא
  choice: கலகம் செய்யும் நகரம்
  rationale: பேரரசின் அதிகாரத்திற்கு எதிராகச் செயல்படும் நகரம் என்ற குற்றச்சாட்டை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: அரசர்களுக்கும் மாகாணங்களுக்கும் தீங்கு விளைவிப்பது
  rationale: அரசியல், பொருளாதார இழப்பு ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய மூலத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: கிளர்ச்சி தூண்டப்பட்டு வந்தது
  rationale: கடினமான அரமேயச் சொற்றொடரின் கலகம் அல்லது அரசுக்கு எதிரான எழுச்சி உருவாக்கப்பட்டு வந்தது என்ற பொருளை இயல்பாகத் தருகிறது; தொடர்ச்சியான பழக்கத்தைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: מִן יוֹמָת עָלְמָא
  choice: பண்டைய காலம் முதல்
  rationale: மெய்யியல் சார்ந்த நித்தியத்தைக் குறிக்காமல், மிகப் பழங்காலத்திலிருந்து என்ற வரலாற்றுக் கூற்றை வெளிப்படுத்துகிறது.
- source_word: הָחָרְבַת
  choice: பாழாக்கப்பட்டது
  rationale: நகரம் அழிவுக்குள்ளாக்கப்பட்ட செயப்பாட்டு வடிவத்தையும் அதன் பாழ்நிலையையும் பாதுகாக்கிறது.
