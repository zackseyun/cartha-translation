translation_notes:
  register: நவீனத் தரத் தமிழில், அரச நிர்வாகக் கடிதத்திற்கேற்ற கண்ணியமான முறையான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட மூல வாக்கியம் வாசிப்புத் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; குற்றச்சாட்டின் வலிமையும் மூலத்திலுள்ள காரண–விளைவு தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
