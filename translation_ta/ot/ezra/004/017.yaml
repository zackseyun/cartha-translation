translation_notes:
  register: நவீனத் தரத் தமிழில், அரசக் கடிதத்திற்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்கு எளிதில் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘மாகாணம்’ சேர்க்கப்படவில்லை; பதவிப்பெயரின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
