base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: ta
  text: 'அரசர், நிர்வாக அதிகாரியான ரெகூமுக்கும்[a], எழுத்தரான சிம்சாயிக்கும், சமாரியாவில் குடியிருக்கும் அவர்களுடைய மீதமுள்ள கூட்டாளிகளுக்கும், நதிக்கு அப்பாலுள்ள[b] மற்றவர்களுக்கும் மறுமொழி அனுப்பினார்: “அமைதி[c]. இப்பொழுது—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரமேயப் பதவிப்பெயரின் துல்லியமான பொருள் உறுதியில்லை; “தலைமை அதிகாரி” அல்லது “ஆலோசனை அதிகாரி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நதிக்கு அப்பால்” என்பது ஐபிராத்து நதிக்கு மேற்கே இருந்த பாரசீக நிர்வாகப் பகுதியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வாழ்த்துகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: மறுமொழி
  rationale: இது அரசரால் அனுப்பப்பட்ட அதிகாரப்பூர்வச் செய்தியைக் குறிக்கிறது; முந்தைய கடிதத்துக்குப் பதிலாக வருவதால் ‘மறுமொழி’ என்பது சூழலுக்கு ஏற்றது.
- source_word: שְׁלַח
  choice: அனுப்பினார்
  rationale: ‘அனுப்பு’ என்ற வினையின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מַלְכָּא
  choice: அரசர்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட பாரசீக அரசரைக் குறிக்கும் உறுதிநிலை வடிவம்.
- source_word: בְּעֵל טְעֵם
  choice: நிர்வாக அதிகாரி
  rationale: இப்பதவிப்பெயரின் துல்லியமான நிர்வாகச் செயல்பாடு உறுதியாகத் தெரியாததால், அளவுக்கு மீறிய துல்லியத்தைத் தவிர்க்கும் பரந்த, இயல்பான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: סָפְרָא
  choice: எழுத்தர்
  rationale: எழுத்து மற்றும் ஆவணப் பணியில் இருந்த அதிகாரப்பூர்வ பதவியைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: அவர்களுடைய மற்ற கூட்டாளிகள்
  rationale: பெயர் குறிப்பிடப்பட்ட அதிகாரிகளுடன் இணைந்திருந்தவர்களைக் குறிக்கும் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: சமாரியாவில் குடியிருக்கும்
  rationale: அங்கே நிலையாக வசிப்பதை உணர்த்தும் பங்கேற்புவினை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: நதிக்கு அப்பாலுள்ள மற்றவர்கள்
  rationale: மூலத்தில் ‘மாகாணம்’ என்ற சொல் இல்லாததால் அதைச் சேர்க்காமல், அந்தப் பிராந்தியச் சுட்டைத் தக்கவைக்கிறது.
- source_word: שְׁלָם
  choice: அமைதி உண்டாகட்டும்
  rationale: கடித வாழ்த்தாக இருந்தாலும், ‘அமைதி’ என்ற மூலச் சொல்லின் நேரடிப் பொருளையும் வாழ்த்தின் இயல்பையும் தக்கவைக்கிறது.
- source_word: וּכְעֶת
  choice: இப்பொழுது—
  rationale: அரசரின் மறுமொழியின் உட்பகுதியை அறிமுகப்படுத்தும் சூத்திரம்; கருத்து அடுத்த வசனத்தில் தொடர்வதை நீண்ட கோடு காட்டுகிறது.
