  source_fidelity: மூல அரமேய உரையின் பெறுநர் பட்டியல், சமாரியா மற்றும் நதிக்கு அப்பாலுள்ள பகுதி, அரசரின் மறுமொழி, மற்றும் அடுத்த வசனத்திற்குத் தொடரும் ‘இப்பொழுது’ என்ற சூத்திரம் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ஆனால் שְׁלָם என்பது இங்கு பெயர்ச்சொல் வடிவிலான கடித வாழ்த்து; ‘அமைதி உண்டாகட்டும்’ என்ற விருப்பவினை மூலத்தில் இல்லாத ஒரு வெளிப்படையான வேண்டுதலைச் சேர்க்கிறது.
  naturalness: நடை நவீனத் தரத் தமிழுக்கும் அரசக் கடிதச் சூழலுக்கும் ஏற்றதாக உள்ளது. ‘அவர்களுடைய மற்ற கூட்டாளிகள்’ என்பதற்குப் பதில் ‘அவர்களுடைய மீதமுள்ள கூட்டாளிகள்’ என்பது שְׁאָר (‘மீதமுள்ளோர்’) என்பதையும் தமிழின் இயல்பையும் இன்னும் நன்றாக வெளிப்படுத்தும்.
