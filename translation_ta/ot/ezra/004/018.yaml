lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: ஆவணம்
  rationale: இது அதிகாரப்பூர்வமான எழுத்துத் தகவலைக் குறிக்கும் பேரரசுக் கால அரமேயச் சொல். நிர்வாகச் சூழலுக்கு ‘ஆவணம்’ பொருத்தமானது; ‘கடிதம்’ என்பதும் சாத்தியம்.
- source_word: דִּי
  choice: நீங்கள் ... அனுப்பிய
  rationale: ‘ஆவணம்’ என்பதைக் குறிப்பாக்கும் தொடர்புத் துகள்; தமிழில் பெயரெச்சத் தொடராக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלַחְתּוּן
  choice: நீங்கள் ... அனுப்பிய
  rationale: அரமேய மொழியில் இரண்டாம் நபர் ஆண்பால் பன்மை நிறைவுவினை. சூழலில் முடிந்த செயலைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עֲלֶינָא
  choice: எங்களுக்கு
  rationale: கடிதப் பரிமாற்றச் சூழலில் அரசவைக்கு அனுப்பப்பட்டதைக் குறிக்கும் ‘எங்களுக்கு’ என்ற பொருள் இயல்பானது; ‘எங்களுக்கு எதிராக’ என்பது இங்கு பொருந்தாது.
- source_word: מְפָרַשׁ
  choice: தெளிவாக
  rationale: வாசிப்பு தெளிவாக அல்லது விளங்குமாறு செய்யப்பட்டதைச் சுட்டுகிறது. மொழிபெயர்க்கப்பட்டது அல்லது விளக்கப்பட்டது என்று தேவையின்றி குறிப்பாக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: קֱרִי
  choice: வாசிக்கப்பட்டது
  rationale: இச்சூழலில் செயப்பாட்டு பொருள் கொண்டது; அரசன் முன்னிலையில் ஆவணம் வாசிக்கப்பட்ட முடிந்த செயலைத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: קָדָמָי
  choice: என் முன்னிலையில்
  rationale: அரசனின் சந்நிதியில் செயல் நடைபெற்றதைக் குறிக்கும் அரசவைச் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ்.
