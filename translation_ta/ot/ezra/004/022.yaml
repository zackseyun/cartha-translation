  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: ta
  text: இந்தக் காரியத்தைச் செய்வதில் அலட்சியமாக இருக்காதபடி கவனமாக இருங்கள்.[a] அரசர்களுக்குச் சேதம் ஏற்படுமாறு இந்தத் தீங்கு ஏன் பெருக வேண்டும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியத்தை நிறைவேற்றுவதில் அலட்சியமாக இருந்துவிடாதபடி எச்சரிக்கையாக இருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அரமேய மூலத்தில் “அரசர்கள்” என்பது பன்மையில் உள்ளது. இது ஓர் அரசனை மட்டும் அல்லாமல் அரச நலன் அல்லது அரச வம்சத்தை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: கவனமாக இருங்கள்
  rationale: எச்சரிக்கையுடனும் விழிப்புடனும் இருக்க வேண்டும் என்ற கட்டளைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: இதைச் செய்வதில் அலட்சியம் காட்டாதபடி
  rationale: கொடுக்கப்பட்ட அரச கட்டளையை நிறைவேற்றுவதில் தளர்வோ கவனக்குறைவோ இருக்கக்கூடாது என்ற அரமேயச் சொற்றொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: לְמָה יִשְׂגֵּא
  choice: ஏன் பெருக வேண்டும்?
  rationale: மூலத்திலுள்ள சொல்லாட்சிக் கேள்வியையும் சேதம் அதிகரிக்கும் சாத்தியத்தையும் தக்கவைக்கிறது.
- source_word: חֲבָלָא
  choice: அந்தச் சேதம்
  rationale: கலகம் அல்லது கட்டளையை மீறுவதால் ஏற்படக்கூடிய பாதிப்பைக் குறிக்கும் நிர்வாகச் சூழலுக்கு ஏற்ற பொதுவான சொல்லாகும்.
- source_word: לְהַנְזָקַת
  choice: தீங்கு உண்டாகும்படி
  rationale: விளைவு அல்லது பாதகத்தைச் சுட்டும் לְ முன்னொட்டின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַלְכִין
  choice: அரசர்களுக்கு
  rationale: அரமேய மூலத்தில் உள்ள பன்மையை ஒருமையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
