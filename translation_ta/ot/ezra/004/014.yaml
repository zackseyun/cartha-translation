- from: இப்போது, நாங்கள் அரண்மனையின் உப்பை உண்பதால்[a], அரசருக்கு ஏற்படும் அவமதிப்பை நாங்கள் பார்த்துக்கொண்டிருப்பது தகாது. ஆகவே, இதை அரசருக்குத் தெரிவிக்க நாங்கள் செய்தி அனுப்பியுள்ளோம்.
  to: இப்போது, நாங்கள் அரண்மனையின் உப்பை உண்கிறோம் என்பதாலும், அரசரின் மானக்கேட்டைக் காண்பது எங்களுக்குத் தகாததாலும், நாங்கள் அனுப்பி அரசருக்குத் தெரிவித்தோம்.
  rationale: The revision preserves the explicit opening marker, the palace-salt idiom, and the concise reference to the king’s dishonor. It also restores the source’s two coordinated concluding actions rather than turning them into a purpose clause. The footnote remains anchored to the retained idiom.
