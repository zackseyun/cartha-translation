  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: ta
  text: இப்போது, நாங்கள் அரண்மனையின் உப்பை உண்கிறோம் என்பதாலும், அரசரின் மானக்கேட்டைக் காண்பது எங்களுக்குத் தகாததாலும், நாங்கள் அனுப்பி அரசருக்குத் தெரிவித்தோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: இப்போது
  rationale: இது அராமிய மொழியில் காலத்தையும் உரையின் அடுத்த கட்டத்தையும் சுட்டும் சொல்லாக இருப்பதால், மூலத்தில் உள்ள தொடக்கச் சுட்டைத் தக்கவைக்கிறது.
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: நாங்கள் அரண்மனையின் உப்பை உண்பதால்
  rationale: அரண்மனை ஆதரவில் வாழ்வதையும் அதற்குக் கடமைப்பட்டிருப்பதையும் குறிக்கும் மூல உருவகத்தைத் தக்கவைக்கிறது; தமிழில் பொருள் புரிய அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: עַרְוַת מַלְכָּא
  choice: அரசருக்கு ஏற்படும் அவமதிப்பு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘நிர்வாணம்/மானக்கேடு’; இச்சூழலில் அரசருக்கு நேரும் இழிவு அல்லது அவமானம் என்பதே இயல்பான பொருள்.
- source_word: לָא אֲרִיךְ לַנָא לְמֶחֱזֵא
  choice: நாங்கள் பார்த்துக்கொண்டிருப்பது தகாது
  rationale: ‘பார்ப்பது எங்களுக்குத் தகாது’ என்ற மூலக் கருத்தை இயல்பான தமிழில் தருகிறது; செயலின்றி கண்டுகொண்டிருப்பதன் நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא לְמַלְכָּא
  choice: இதை அரசருக்குத் தெரிவிக்க நாங்கள் செய்தி அனுப்பியுள்ளோம்
  rationale: ‘அனுப்பினோம், அரசருக்குத் தெரிவித்தோம்’ என்ற இணை வினைகளை இயல்பான நிர்வாகக் கடித நடையில் ஒருங்கிணைக்கிறது.
