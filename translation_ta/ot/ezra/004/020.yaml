  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: ta
  text: வல்லமைமிக்க அரசர்கள் எருசலேமின்மேல் ஆட்சி செய்தார்கள்; ஆற்றுக்கு அப்பாலுள்ள பகுதி முழுவதையும்[a] அவர்கள் ஆண்டார்கள். அவர்களுக்குத் திறை, வரி, வழிக்கட்டணம்[b] செலுத்தப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆற்றுக்கு அப்பால்” என்பது ஐபிராத்து ஆற்றுக்கு மேற்கே இருந்த பேரரசின் நிர்வாகப் பகுதியைக் குறிக்கும் அதிகாரப்பூர்வப் பெயர்.
    reason: cultural_note
  - marker: b
    text: “திறை, வரி, வழிக்கட்டணம்” என்பவை பேரரசுக்குச் செலுத்தப்பட்ட மூன்று வேறுபட்ட வருவாய் வகைகள். இவற்றை முறையே “கப்பம், வரி, சுங்கம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: வல்லமைமிக்க அரசர்கள்
  rationale: பன்மையான ‘அரசர்கள்’ என்பதையும் வலிமை அல்லது அதிகாரத்தைக் குறிக்கும் பெயரடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: எருசலேமின்மேல் ஆட்சி செய்தார்கள்
  rationale: עַל என்பது இங்கு இருப்பிடத்தை அல்ல, எருசலேமின்மீதான ஆட்சியதிகாரத்தைக் குறிக்கிறது; தமிழில் வெறும் ‘இருந்தார்கள்’ என்பதைவிட இவ்வாறு பொருள் தெளிவாகிறது.
- source_word: שַׁלִּיטִין בְּכֹל עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதி முழுவதையும் அவர்கள் ஆண்டார்கள்
  rationale: שַׁלִּיטִין என்பதன் ஆட்சிசெய்தல் என்ற கருத்தைப் பாதுகாக்கிறது. ‘ஆற்றுக்கு அப்பால்’ என்பது ஐபிராத்துக்கு மேற்கிலிருந்த பேரரசு நிர்வாகப் பகுதியின் பெயராகப் பயன்படுகிறது; வாசிப்புத் தெளிவுக்காக ‘பகுதி’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִדָּה
  choice: திறை
  rationale: அரச அதிகாரத்திற்கு உட்பட்டோர் செலுத்தும் கட்டாயப் பணம் அல்லது காணிக்கையைக் குறிக்கும் மரபான, இன்னும் புரியக்கூடிய தமிழ் சொல்.
- source_word: בְלוֹ
  choice: வரி
  rationale: மூவகை அரச வருவாய்களில் தனித்தொரு வரிவகையைக் குறிக்கும் பொதுவான, தெளிவான தமிழ் சொல்.
- source_word: הֲלָךְ
  choice: சுங்கம்
  rationale: போக்குவரத்து, கடத்தல் அல்லது எல்லைக் கடப்புடன் தொடர்புடைய கட்டணத்தைக் குறிக்க ஏற்ற இயல்பான தமிழ் சொல்.
- source_word: מִתְיְהֵב לְהוֹן
  choice: அவர்களுக்குச் ... செலுத்தப்பட்டன
  rationale: வருவாய்கள் அரசர்களுக்குக் கொடுக்கப்பட்டன என்ற மூலத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
