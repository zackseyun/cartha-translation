translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. முதல் இரண்டு அராமிய ஆட்சிக் கூறுகள் தமிழில் தேவையற்ற மீளுரையைத் தவிர்க்கத் தொடர்புடைய இரு வாக்கியக்கூறுகளாக அமைக்கப்பட்டுள்ளன; ‘திறை, வரி, சுங்கம்’ என்ற நிர்வாக மூவகை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
