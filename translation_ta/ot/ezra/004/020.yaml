  source_fidelity: மூல அராமியத்தின் இரு ஆட்சிக் கூறுகளும், ‘ஆற்றுக்கு அப்பால்’ என்ற நிர்வாகப் புவியியல் குறிப்பும், மூவகை வருவாய் பட்டியலும் வரைவு உரையில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் הֲלָךְ என்பதற்கான ‘toll’ கருத்தை ‘சுங்கம்’ என்பதைக் காட்டிலும் ‘வழிக்கட்டணம்’ தெளிவாகக் குறிக்கிறது; சுங்கம் பொதுவாகச் சுங்க/சரக்குவரி கருத்தைத் தரக்கூடும்.
  naturalness: வரைவு பொதுவாக நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘எருசலேமின்மேல் ஆட்சி செய்தார்கள்’ என்பதிலுள்ள ஆட்சியதிகாரக் கருத்து தெளிவானது. திருத்தப்பட்ட உரை, மூலத்தின் இணை ஆட்சிக் கூறுகளை ஒரே வாக்கியத்தில் இயல்பாக இணைக்கிறது.
  terminology: ‘வல்லமைமிக்க அரசர்கள்,’ ‘திறை,’ ‘வரி’ ஆகியவை பொருத்தமானவை. கடைசி வருவாய் வகைக்கு ‘வழிக்கட்டணம்’ பயன்படுத்தப்படுவதால் வரி மற்றும் பயண/போக்குவரத்துக் கட்டணத்தின் வேறுபாடு தெளிவாகிறது. ‘ஆற்றுக்கு அப்பால்’ என்பது ஐபிராத்துக்கு மேற்கேயுள்ள பாரசீக நிர்வாகப் பகுதிக்கான அதிகாரப்பூர்வப் பெயர் என்பதை அடிக்குறிப்பு தக்கவாறு விளக்குகிறது.
