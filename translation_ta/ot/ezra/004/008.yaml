- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: அர்த்தசஷ்டா அரசனுக்கு
  rationale: அரசப் பட்டத்தையும் பெயரையும் காத்து, இயல்பான தமிழ் சொல் வரிசையில் அமைக்கப்பட்டது.
- source_word: כְּנֵמָא
