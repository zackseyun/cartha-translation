- source_word: אִגְּרָה חֲדָה
  choice: ஒரு கடிதம்
  rationale: חֲדָה என்பது ‘ஒன்று’ எனப் பொருள்படலாம்; இங்கு பேரரசுக் கால அரமேய மொழிநடையில் கடிதத்தை அறிமுகப்படுத்தும் வரையறையற்ற சொல்லாக இயங்குவதால் எண்ணிக்கையை வலியுறுத்தாமல் ‘ஒரு கடிதம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל יְרוּשְׁלֶם
  choice: எருசலேமுக்கு எதிராக
