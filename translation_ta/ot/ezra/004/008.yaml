  choice: தலைமை அதிகாரி
  rationale: இது ஓர் அரமேய நிர்வாகப் பதவி. அதன் துல்லியமான பாரசீக நிர்வாக இணை உறுதியாகத் தெரியாததால், அதிகாரத்தையும் தலைமைப் பொறுப்பையும் உணர்த்தும் பொதுவான நவீன தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
