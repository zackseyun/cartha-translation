  text: 'தலைமை அதிகாரியான[a] ரெகூமும் எழுத்தரான சிம்சாயும் எருசலேமுக்கு எதிராக அர்த்தசஷ்டா அரசனுக்கு ஒரு கடிதம் எழுதினார்கள். அதன் விவரம் வருமாறு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலோசனைத் தலைவர்.” அரமேய மொழியிலுள்ள בְּעֵל טְעֵם என்பது ஓர் அதிகாரப் பதவி; இதற்கு இணையான துல்லியமான பாரசீக நிர்வாகப் பதவி எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
