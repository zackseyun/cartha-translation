base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: ta
  text: 'அவர்கள் அர்த்தசஷ்டா அரசனுக்கு அனுப்பிய கடிதத்தின் நகல் இதுவே: “ஆற்றுக்கு அப்பாலுள்ள மனிதர்களாகிய உமது பணியாளர்கள்[a], இப்பொழுது—[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆற்றுக்கு அப்பாலிருந்து வந்த உமது பணியாளர்கள்.” “ஆற்றுக்கு அப்பால்” என்பது ஐப்பிராத்து ஆற்றின் மேற்கிலிருந்த பாரசீக மாகாணத்திற்கான நிர்வாகப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள அரமேயச் சொற்றொடர் கடிதங்களில் பயன்படுத்தப்பட்ட முறையான தொடக்கச் சூத்திரமாகும். இதை “இத்தகைய காலத்தில்” என்றும் “மற்றும் இவ்வாறாக” என்றும் மொழிபெயர்ப்பது வழக்கம். உரை அடுத்த வசனத்தில் தொடர்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא
  choice: கடிதத்தின் நகல் இதுவே
  rationale: அதிகாரபூர்வ ஆவணத்தின் நகலை அறிமுகப்படுத்தும் அரமேயச் சொற்றொடரை இயல்பான, மரியாதைமிக்க நவீன தமிழில் அளிக்கிறது.
- source_word: שְׁלַחוּ עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: அவர்கள் அர்தசஷ்டா அரசனுக்கு அனுப்பிய
  rationale: இங்கு முன்னிடைச்சொற்கள் கடிதம் சென்ற பெறுநரைக் குறிக்கின்றன; எதிராக அல்லது குறித்து என்ற பொருள் சூழலுக்குப் பொருந்தாது.
- source_word: עַבְדָיךְ
  choice: உமது பணியாளர்கள்
  rationale: அரசனிடம் கீழ்ப்படிவுடன் தங்களைக் குறிப்பிடும் அரசவை மொழிநடையைப் பாதுகாக்கிறது; ‘அதிகாரிகள்’ என்பது தேவையற்ற விளக்கமாகிவிடும்.
- source_word: אֱנָשׁ עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள மனிதர்களான
  rationale: ஆண்பால் கூட்டுப்பொருளையும் ‘ஆற்றுக்கு அப்பால்’ என்ற பாரசீக நிர்வாகப் புவியியல் பெயரின் நேரடி வடிவத்தையும் காக்கிறது.
- source_word: וּכְעֶנֶת
  choice: இப்பொழுது—
  rationale: கடிதத் தொடக்கத்தில் வரும் முறையான அரமேயச் சொற்றொடரின் இடைநிறுத்தப்பட்ட தன்மையை கோடு மூலம் காட்டி, வாக்கியம் அடுத்த வசனத்தில் தொடர்வதைக் காக்கிறது.
