  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: ta
  text: இப்போது, இந்த மனிதர்கள் நிறுத்தப்படும்படி ஓர் ஆணை பிறப்பியுங்கள்[a]; நான் ஓர் ஆணை பிறப்பிக்கும்வரை[b] இந்த நகரம் கட்டப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘ஓர் ஆணையை வையுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘என்னிடமிருந்து ஓர் ஆணை வைக்கப்படும்வரை.’
    reason: lexical_alternative
lexical_decisions:
