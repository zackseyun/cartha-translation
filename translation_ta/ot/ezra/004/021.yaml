  choice: இந்த நகரம் மீண்டும் கட்டப்படக் கூடாது
  rationale: மூலத்தின் எதிர்மறைச் செயப்பாட்டு வடிவத்தையும் அரசாணைக்குரிய தடைத் தொனியையும் தெளிவாகக் காக்கிறது; நகரம் முன்பு இருந்ததால் תתבנא இங்கு ‘மீண்டும் கட்டப்படுதல்’ என இயல்பாகப் புரிகிறது.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
