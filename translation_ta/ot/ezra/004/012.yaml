base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: ta
  text: 'அரசருக்குத் தெரியப்படுத்தப்படட்டும்: உம்மிடமிருந்து எங்களிடம் வந்த யூதர்கள்[a] எருசலேமுக்கு வந்திருக்கிறார்கள். அவர்கள் அந்தக் கலகக்காரரும் தீயதுமான நகரத்தை மறுபடியும் கட்டி, மதில்களை முடித்து, அஸ்திவாரங்களைச் சீரமைத்து[b] வருகிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதா நாட்டினர்’ என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் யூதா/யூதேயாவைச் சேர்ந்த மக்களையும், விரிவான பொருளில் யூதர்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அஸ்திவாரங்களை அமைத்து வருகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொற்றொடர் தெளிவற்றது; ஏற்கெனவே உள்ள அஸ்திவாரங்களைச் சீரமைப்பதையோ அவற்றை அமைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: அரசருக்குத் தெரியப்படுத்துவது
  rationale: அரசருக்கு ஓர் அதிகாரபூர்வ அறிக்கையை அறிமுகப்படுத்தும் அரமேயக் கடிதச் சூத்திரத்தை இயல்பான, கண்ணியமான நவீன தமிழில் வழங்குகிறது.
- source_word: יְהוּדָיֵא
  choice: யூதர்கள்
  rationale: இச்சொல் யூதர்களையோ யூதா நாட்டினரையோ குறிக்கலாம்; பொதுவாகப் புரியும் ‘யூதர்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: உம்மிடமிருந்து எங்களிடம் வந்த
  rationale: அரசரிடமிருந்து கடிதம் எழுதுவோரின் பகுதிக்கு நிகழ்ந்த இயக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘மேலே வந்த’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால் இயக்கத்தின் அடிப்படைப் பொருள் முன்னிலைப்படுத்தப்படுகிறது.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: எருசலேமுக்கு வந்திருக்கிறார்கள்
  rationale: அவர்கள் வந்ததன் தற்போதைய தொடர்பை கடித அறிக்கை நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: கலகமும் தீமையும் நிறைந்த அந்த நகரத்தை
  rationale: குற்றஞ்சாட்டுவோரின் அரசியல் மற்றும் அறவியல் மதிப்பீட்டை அவர்களுடைய பகைமைத் தொனியுடன் பாதுகாக்கிறது.
- source_word: בָּנַיִן
  choice: திரும்பக் கட்டி
  rationale: முன்பிருந்த எருசலேம் மீண்டும் கட்டப்படுவதைச் சூழல் காட்டுவதால், மறுகட்டுமானப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: மதில்களை முடித்து
  rationale: நகர மதில்களையும் அவற்றை முழுமைப்படுத்தும் செயற்பாட்டையும் சுருக்கமாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: அஸ்திவாரங்களைச் சீரமைத்து வருகிறார்கள்
  rationale: கடினமான அரமேயச் சொற்றொடருக்கு மறுசீரமைப்புச் சூழலுடன் பொருந்தும் வாசிப்பை அளிக்கிறது; அஸ்திவாரங்களை அமைத்தல் என்ற வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
