base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: ta
  text: அப்போது அவர்கள் செருபாபேலிடமும் தந்தைவழிக் குடும்பத் தலைவர்களிடமும் வந்து, அவர்களிடம், “நாங்களும் உங்களோடு சேர்ந்து கட்டுவோம்; ஏனெனில் உங்களைப் போல நாங்களும் உங்கள் கடவுளைத் தேடுகிறோம்[b]. எங்களை இங்கே கொண்டுவந்த அசீரிய அரசன் எசரத்தோனின் நாட்களிலிருந்து அவருக்குப் பலி செலுத்திவருகிறோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மெய்யெழுத்து உரை, “நாங்கள் பலி செலுத்தவில்லை” என்று வாசிக்கிறது. ஆனால் சூழலை முன்னிட்டு, பலர் இதை “அவருக்கு நாங்கள் பலி செலுத்துகிறோம்” என்று வாசிக்கின்றனர் அல்லது நேர்மறைப் பொருளில் புரிந்துகொள்கின்றனர்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “உங்கள் கடவுளை வழிபடுகிறோம்” அல்லது “உங்கள் கடவுளிடம் விசாரிக்கிறோம்.” எபிரெய வினைச்சொல் சமயச் சூழலில் இத்தகைய பொருள்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: வந்து
  rationale: נגשׁ என்பது அணுகுதல் அல்லது அருகில் வருதல். இங்கு ‘வந்து’ என்பது இலக்கைத் தெளிவாகக் குறிப்பதோடு இயல்பான தமிழ் கதைநடையையும் தருகிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: எபிரெய சமூகத்தின் மூதாதையர் சார்ந்த குடும்ப அமைப்பை ‘குடும்பத் தலைவர்கள்’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נִבְנֶה עִמָּכֶם
  choice: நாங்களும் உங்களோடு சேர்ந்து கட்டுவோம்
  rationale: முதலாம் நபர் பன்மை imperfect இங்குப் பரிந்துரை/விருப்பப் பொருளில் வருகிறது. தமிழில் ‘சேர்ந்து கட்டுவோம்’ அந்தக் கூட்டுப் பணிக்கான அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי כָכֶם
  choice: ஏனெனில் உங்களைப் போல நாங்களும்
  rationale: ஒத்த சமய நடைமுறையைக் காரணமாக முன்வைக்கும் ஒப்பீட்டைத் தெளிவாகத் தொடர்கிறது; அவர்கள் உண்மையிலேயே ஒரே நிலையினர் என்று மொழிபெயர்ப்பு உறுதிப்படுத்தவில்லை.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: உங்கள் கடவுளைத் தேடுகிறோம்
  rationale: דרשׁ என்பதன் ‘தேடு’ என்ற அடிப்படைப் பொருளையும், வழிபாடு அல்லது இறைவனிடம் விசாரித்தல் ஆகிய சமய நிழற்பொருள்களையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: அவருக்குப் பலி செலுத்திவருகிறோம்
  rationale: எழுதப்பட்ட לא (‘இல்லை/அல்ல’) வாசகம் சூழலில் கடினமானது; மரபுவழி வாசிப்பான לו (‘அவருக்கு’) மற்றும் பேச்சாளர்களின் வாதச் சூழலுக்கு ஏற்ற நேர்மறைப் பொருள் முதன்மை உரையில் தரப்பட்டு, சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: எசரத்தோனின் நாட்களிலிருந்து
  rationale: கடந்த காலத்திலிருந்து தொடரும் காலப்பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: எங்களை இங்கே கொண்டுவந்த
  rationale: ஹிபில் காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தின் திசை சார்ந்த ‘மேலே’ என்பதை தமிழில் சேர்ப்பது இங்கு செயற்கையாக இருப்பதால் விடப்பட்டுள்ளது.
theological_decisions:
- issue: குடியேறிய மக்களின் சமய உரிமைக்கூற்று
  choice: ‘உங்கள் கடவுளைத் தேடுகிறோம்’ என்றும் ‘அவருக்குப் பலி செலுத்திவருகிறோம்’ என்றும் அவர்களுடைய கூற்றாக நடுநிலையுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்கள் கடவுளை வழிபடுகிறோம்’ அல்லது ‘உங்கள் கடவுளிடம் விசாரிக்கிறோம்.’
  rationale: இந்த வசனம் அவர்களுடைய கூற்றைப் பதிவு செய்கிறது; அதன் உண்மைத்தன்மையையோ முறையான தன்மையையோ மொழிபெயர்ப்பே தீர்மானிக்கக் கூடாது. சுற்றியுள்ள கதைச்சூழல் அந்த இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ சமூக-குடும்ப அமைப்பைத் தக்கவைக்கிறது; ‘கடவுளைத் தேடுகிறோம்’ மூலத்தின் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
