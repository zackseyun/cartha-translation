translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் ‘ஆட்சி’ கருத்து பாதுகாக்கப்பட்டுள்ளது. குற்றச்சாட்டு எழுதப்பட்டதாக மட்டுமே மூல உரை கூறுவதால், ‘அனுப்பினார்கள்’ போன்ற கூடுதல் செயல் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் அடிக்குறிக் குறி பெயருக்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் שִׂטְנָה என்பதைக் குறிக்கும் காரணத்தால் தமிழில் ‘குற்றச்சாட்டு’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
