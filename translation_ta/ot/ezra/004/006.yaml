base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: ta
  text: அகாஸ்வேருவின் ஆட்சிக்காலத்தில், அவரது ஆட்சியின் தொடக்கத்தில், யூதாவிலும் எருசலேமிலும் குடியிருந்தவர்களுக்கு எதிராக அவர்கள் ஒரு குற்றச்சாட்டை[a] எழுதினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முறையீடு’ அல்லது ‘பகைமையான குற்றச்சாட்டு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், முறைப்படியான குற்றச்சாட்டாக வெளிப்படுத்தப்பட்ட எதிர்ப்பு என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: ஆட்சிக்காலத்தில்
  rationale: முன்னொட்டுகளுடன் வரும் מַלְכוּת இங்கு அரசன் ஆட்சிசெய்த காலத்தைச் சுட்டும் கால அமைப்பாக உள்ளது. நவீன தமிழில் ‘ஆட்சிக்காலத்தில்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்த்துள்ளது; வரலாற்று அடையாளமாகக் கருதப்படும் ‘செர்க்செஸ்’ என்ற பெயரை மூல உரைக்குள் கொண்டு வரவில்லை.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: அவரது ஆட்சியின் தொடக்கத்திலேயே
  rationale: அவருடைய ஆட்சியின் ஆரம்பக் காலத்தை இத்தொடர் குறிக்கிறது. ‘-ஏ’ தொடக்கத்திலேயே இது நடந்தது என்ற மூலத்தின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּתְבוּ
  choice: அவர்கள் ... எழுதினார்கள்
  rationale: வினைச்சொல்லின் எளிய பொருள் ‘எழுதினார்கள்.’ எபிரெயத்தில் வெளிப்படையாகப் பெயரிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ எனத் தொடர்ந்து தெளிவுபடுத்தாமல் அப்படியே வைத்துள்ளது.
- source_word: שִׂטְנָה
  choice: ஒரு குற்றச்சாட்டை[a]
  rationale: எதிர்ப்புணர்வுடன் முன்வைக்கப்பட்ட குற்றச்சாட்டு அல்லது முறையீடு என்ற பொருளை இச்சொல் தருகிறது. ஆவணத்தின் துல்லியமான வகையை நிர்ணயிக்காமல், நிர்வாகச் சூழலுக்கு ஏற்ற பொதுவான சொல்லாக ‘குற்றச்சாட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל
  choice: எதிராக
  rationale: குற்றச்சாட்டு யாரைக் குறிவைத்தது என்பதை இச்சூழலில் குறிக்கிறது; ‘எதிராக’ என்பது பகைமை அல்லது எதிர்ப்பின் திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: யூதாவிலும் எருசலேமிலும் குடியிருந்தவர்கள்
  rationale: ‘குடியிருப்போர்’ எனப் பெயர்ச்சொல் போலச் செயல்படும் எபிரெயப் பங்கேற்பு வடிவத்தை இயல்பான நவீன தமிழில் வழங்குகிறது. இரு இடங்களிலும் வாழ்ந்த மக்களைக் குறிக்க ‘-இலும்’ பயன்படுத்தப்பட்டுள்ளது.
