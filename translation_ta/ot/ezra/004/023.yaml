base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: ta
  text: அப்போது, அர்த்தசஷ்டா அரசனுடைய கடிதத்தின் நகல் ரெகூமுக்கும், எழுத்தராகிய சிம்சாயிக்கும், அவர்களுடைய கூட்டாளிகளுக்கும் முன்பாக வாசிக்கப்பட்டவுடன், அவர்கள் எருசலேமுக்கு, யூதர்களுக்கு எதிராக[a] விரைந்து சென்று, அவர்களைப் பலத்தாலும் வலிமையாலும்[b] தடுத்து நிறுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களிடம்.” அரமேய முன்னிடைச்சொல் செல்லும் இலக்கை மட்டும் குறிக்கலாம்; தொடர்ந்து வரும் செயல் அதன் பகைமைத் தன்மையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “கரத்தாலும் வலிமையாலும்.” இது வற்புறுத்தும் வல்லமையைக் குறிக்கும் சொல்லிணைவு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் அரமேயக் கதைத் தொடர் வினையடை; நவீனத் தமிழில் இயல்பான தொடர்ச்சியைத் தருகிறது.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: கடிதத்தின் நகல்
  rationale: முதல் சொல் நகல் அல்லது படியைக் குறிக்கிறது; இரண்டாவது அதிகாரப்பூர்வ எழுத்துத் தகவல் அல்லது கடிதத்தைக் குறிக்கிறது.
- source_word: קֱרִי קֳדָם
  choice: முன்பாக வாசிக்கப்பட்டவுடன்
  rationale: அதிகாரிகளின் முன்னிலையில் கடிதம் வாசிக்கப்பட்டதைச் சூழல் உணர்த்துகிறது; அடுத்த நடவடிக்கை உடனே நடந்ததையும் தமிழ் வாக்கிய அமைப்பு தெளிவாக்குகிறது.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: ரெகூமுக்கும், எழுத்தராகிய சிம்சாயிக்கும், அவர்களுடைய கூட்டாளிகளுக்கும்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; סָפְרָא என்பதற்கு வெளிப்படையான பதவிப் பெயராக ‘எழுத்தர்’ பயன்படுத்தப்பட்டுள்ளது; כְנָוָתְהוֹן சகாக்கள் அல்லது கூட்டாளிகளைக் குறிக்கிறது.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: விரைந்து சென்று
  rationale: செல்லுதல் மற்றும் அவசரம் ஆகிய இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עַל יְהוּדָיֵא
  choice: யூதர்களுக்கு எதிராக
  rationale: עַל என்பது இங்கு யூதர்களை நோக்கிய பகைமையான நடவடிக்கையைக் குறிக்கக்கூடும்; தொடர்ந்து வரும் பலவந்தத் தடுப்பு இந்தப் பொருளை ஆதரிக்கிறது. இருப்பினும் இடத்தை அல்லது இலக்கை மட்டும் குறிக்கும் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: அவர்களைத் தடுத்து நிறுத்தினார்கள்
  rationale: வினையின் காரணவினைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் நேரடியாகச் சொல்லப்படாத ‘வேலை’ என்ற பெயர்ச்சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: பலவந்தமாகவும் வல்லமையாலும்
  rationale: உடல் அல்லது அதிகார வலிமையால் கட்டாயப்படுத்தியதை இயல்பாகத் தெரிவிக்கிறது; சொற்சார்ந்த ‘கரத்தாலும் வலிமையாலும்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
