base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: ta
  text: இஸ்ரயேல் மக்கள், ஆசாரியர்கள், லேவியர்கள், நாடுகடத்தப்பட்ட மக்களில் மற்றவர்கள் ஆகியோர் இறைவனுடைய இந்த இல்லத்தின் அர்ப்பணிப்பை மகிழ்ச்சியுடன் கொண்டாடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: கொண்டாடினார்கள்
  rationale: அர்ப்பணிப்பு என்னும் சடங்கு நிகழ்வை நிறைவேற்றுதல் அல்லது அனுசரித்தல் என்பதே இங்கு வினையின் பொருள்; தமிழில் ‘அர்ப்பணிப்பைக் கொண்டாடினார்கள்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: ‘இஸ்ரயேலின் பிள்ளைகள்’ என்ற நேர்ச்சொல் மொழிபெயர்ப்பைவிட, மூலத்தின் சமூக அடையாளத்தை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָּהֲנַיָּא
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணிக்குரிய ஆசாரிய வகுப்பைக் குறிக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: וְלֵוָיֵא
  choice: லேவியர்கள்
  rationale: ஆலயப் பணியாற்றிய லேவி மரபினரைக் குறிக்கும் வழக்கமான பெயர்.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: நாடுகடத்தப்பட்டவர்களில் எஞ்சியவர்கள்
  rationale: ஆசாரியர்களும் லேவியர்களும் தவிர நாடுகடத்தப்பட்ட சமூகத்தின் மற்ற உறுப்பினர்களைக் குறிக்கிறது. மூலத்தின் ‘நாடுகடத்தலின் பிள்ளைகள்’ என்ற மொழிநடையை நவீன தமிழில் பொருள் தெளிவாக வழங்குகிறது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חֲנֻכַּת
  choice: அர்ப்பணிப்பு
  rationale: ஒரு இல்லம் அல்லது ஆலயத்தை இறைப்பயன்பாட்டிற்கென அர்ப்பணிக்கும் நிகழ்வைக் குறிக்கும் நேரான, இயல்பான சொல்.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: இந்த இறைவனின் இல்லம்
  rationale: ‘இந்த இறைவனின் வீடு/இல்லம்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; ‘ஆலயம்’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: בְחֶדְוָה
  choice: மகிழ்ச்சியுடன்
  rationale: முன்னிடைச்சொல் மற்றும் பெயர்ச்சொல் சேர்ந்த மூலத் தொடரை இயல்பான தமிழ் வினையடைத் தொடராக வழங்குகிறது.
