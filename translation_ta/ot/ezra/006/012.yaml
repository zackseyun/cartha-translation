source:
  edition: WLC
  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: ta
  text: தமது பெயரை அங்கே குடியிருக்கச் செய்த கடவுள்[a], இதை மாற்றவோ எருசலேமில் உள்ள இந்தக் கடவுளின் ஆலயத்தை அழிக்கவோ கைநீட்டும் எந்த அரசனையோ மக்களையோ வீழ்த்துவாராக. தாரியுவாகிய நானே இந்த ஆணையைப் பிறப்பித்தேன்; இது முழு கவனத்துடனும் விரைவாகவும் நிறைவேற்றப்படட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே தமது பெயரை நிலைநிறுத்திய.” கடவுளின் பெயருடன் ஆலயத்தை உடன்படிக்கை அடிப்படையில் இணைக்கும் அரமேய மரபுத்தொடர் இது.
    reason: lexical_alternative
  - marker: b
    text: “முழு கவனத்துடனும் விரைவாகவும்” என்பதற்கு “விரைவாக” என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் தாமதமின்றியும் கவனத்துடனும் ஆணையை நிறைவேற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: தமது பெயரை அங்கே குடியிருக்கச் செய்த
  rationale: பெயரை ஓர் இடத்தில் குடியிருக்கச் செய்வது என்ற ஆலயத்துடன் தொடர்புடைய அரமேய மரபுத்தொடரைத் தக்கவைக்கிறது; கடவுளே அந்த இடத்தைத் தமது பெயருடன் தொடர்புபடுத்தியதை உணர்த்துகிறது.
- source_word: יְמַגַּר
  choice: வீழ்த்துவாராக
  rationale: அரச ஆணையின் சாபச் சூத்திரத்தில் ஒருவரை அதிகாரத்திலிருந்து அல்லது நிலையிலிருந்து கவிழ்த்தழிக்கும் நியாயத்தீர்ப்பின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: எந்த அரசனையும் மக்களினத்தையும்
  rationale: ஆணையை மீறும் யாரையும் பொதுவாகக் குறிக்கும் பகிர்ந்தளிக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁלַח יְדֵהּ
  choice: தன் கையை நீட்டுகிற
  rationale: எதற்கெதிராகவும் நடவடிக்கை எடுப்பதைக் குறிக்கும் செமித்திய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: לְהַשְׁנָיָה
  choice: இதை மாற்ற
  rationale: சட்ட-நிர்வாகச் சூழலில் முன் கூறப்பட்ட ஆணை அல்லது ஏற்பாட்டை மாற்றுவதைக் குறிக்கும்; 'இதை' என்பதன் குறிப்பு சூழலால் நிரப்பப்படுகிறது.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: இந்தக் கடவுளுடைய ஆலயத்தை அழிக்க
  rationale: ஆலயத்தைச் சேதப்படுத்துதல் அல்லது பாழாக்குதல் என்ற வினையின் கடுமையான விளைவை 'அழிக்க' இயல்பாகக் காட்டுகிறது.
- source_word: שָׂמֶת טְעֵם
  choice: இந்த ஆணையைப் பிறப்பித்தேன்
  rationale: பேரரசு நிர்வாகச் சூத்திரத்தின் அதிகாரப்பூர்வ தன்மையை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אָסְפַּרְנָא
  choice: முழு முனைப்புடன்
  rationale: விரைவையும் கவனமான தீவிர நிறைவேற்றத்தையும் ஒருங்கே உணர்த்துகிறது; மூல வினையுரிச்சொல்லின் பொருள் பரப்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: יִתְעֲבִד
  choice: நிறைவேற்றப்படட்டும்
  rationale: செயப்பாட்டு வடிவத்தையும் அதிகாரமிக்க விருப்பக் கட்டளைத் தொனியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுள் தமது பெயரை ஆலயத்தில் குடியிருக்கச் செய்தார் என்ற ஆலய-பெயர் இறையியல்
  choice: '''தமது பெயரை அங்கே குடியிருக்கச் செய்த'' என்ற மரபுத்தொடரைத் தக்கவைத்தல்'
  alternative: '''தமது பெயரை அங்கே வைத்த'' அல்லது ''அங்கே குடியிருக்கிற கடவுள்'''
  rationale: இந்தச் சொற்றொடர் கடவுள் ஆலயத்தால் இடவரம்புக்குள் அடைக்கப்பட்டவர் என்று கூறாமல், ஆலயத்தைத் தமது பெயருடன் உடன்படிக்கை சார்ந்து இணைத்ததை உணர்த்துகிறது. 'பெயர்' மற்றும் 'குடியிருக்கச் செய்தல்' ஆகிய இரண்டையும் தக்கவைப்பது அந்த நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் அதிகாரப்பூர்வ அரசாணைத் தொனி பேணப்பட்டுள்ளது. 'கடவுளுடைய ஆலயம்' என்பது அரமேயச் சொற்றொடரின் வடிவத்தைப் பாதுகாக்கிறது; 'மக்களினம்' என்பது அரசியல்-இனக் கூட்டத்தைக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தெளிவாக இல்லாத 'இதை' என்பதன் குறிப்பு ஆணை அல்லது ஏற்பாடு என உரையிலேயே தீர்மானிக்கப்படவில்லை.
