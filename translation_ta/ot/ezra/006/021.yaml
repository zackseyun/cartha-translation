  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: ta
  text: நாடுகடத்தலிலிருந்து திரும்பிவந்த இஸ்ரவேல் மக்களும்[a], நாட்டிலிருந்த மக்களினங்களின் தீட்டிலிருந்து[b] தங்களைப் பிரித்து அவர்களுடன்[c] சேர்ந்துகொண்ட அனைவரும், இஸ்ரவேலின் கடவுளாகிய யாவேவைத் தேடுவதற்காக உண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: lexical_alternative
  - marker: b
    text: “அசுத்தத்திலிருந்து” அல்லது “மாசிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எழுத்துப்படி, “அவர்களிடம்”; அதாவது, நாடுகடத்தலிலிருந்து திரும்பிவந்த சமூகத்துடன் அவர்கள் இணைந்தார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: உண்டார்கள்
  rationale: எபிரெய வினைச்சொல் பொதுவாக ‘உண்டார்கள்’ என்றே பொருள்படும். முந்தைய வசனத்தில் கூறப்பட்ட பஸ்கா உணவே மறைமுகச் செயப்படுபொருள்; அதை இங்கே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றாலும், இங்கு ஆண்களை மட்டும் குறிக்காமல் இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: நாடுகடத்தலிலிருந்து திரும்பிவந்த
  rationale: திரும்பிவந்த யூத நாடுகடத்தப்பட்டவர்களை அடையாளப்படுத்தும் பங்கேற்பு வினைத் தொடர். ‘சிறையிருப்பு’ என்பதைக் காட்டிலும் ‘நாடுகடத்தல்’ இச்சூழலுக்குத் துல்லியமானது.
- source_word: וְכֹל הַנִּבְדָּל
  choice: தங்களைப் பிரித்து ... சேர்ந்துகொண்ட அனைவரும்
  rationale: நிபால் வடிவம் தங்களை வேறுபடுத்திக்கொண்டவர்களைக் குறிக்கிறது. ‘அனைவரும்’ என்ற கூட்டு வடிவம் தமிழில் இயல்பானது; அடுத்துள்ள אֲלֵהֶם உடன் இணைத்து உறவை வெளிப்படுத்துகிறது.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: நாட்டின் பிற இனத்தாரின் தீட்டிலிருந்து
  rationale: טֻמְאָה சடங்கு மற்றும் ஒழுக்கம் சார்ந்த அசுத்தம் அல்லது தீட்டைக் குறிக்கலாம். ‘தீட்டு’ பஸ்கா சூழலின் சடங்கு ஒலிப்பைத் தக்கவைக்கிறது. גּוֹיֵי הָאָרֶץ என்பது அந்த நாட்டிலிருந்த பிற மக்களினங்களைக் குறிக்கிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களுடன் சேர்ந்துகொண்ட
  rationale: எழுத்துப்படி ‘அவர்களிடம்/அவர்களுக்கு’ எனினும், இங்கு திரும்பிவந்த சமூகத்துடன் இணைந்ததைக் குறிக்கிறது. ‘சேர்ந்துகொண்ட’ என்பது அந்த உறவுப்பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לִדְרֹשׁ
  choice: தேடுவதற்காக
  rationale: கடவுளை நோக்கிய דרשׁ பக்தியுடனும் உடன்படிக்கை விசுவாசத்துடனும் அவரை நாடுவதைக் குறிக்கும். ‘தேடுதல்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவை
  rationale: יהוה என்ற தனிப்பெயரை அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கிறது; பொதுப்பட்டமான ‘ஆண்டவர்’ என மாற்றவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய உடைமைத் தொடரை இயல்பான தமிழில் வழங்கி, இஸ்ரவேலுடன் கடவுளுக்குள்ள உடன்படிக்கை அடையாளத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பஸ்காவில் கூடுதலாகப் பங்கேற்றவர்களின் அடையாளம்
  choice: அவர்கள் நாட்டின் பிற இனத்தாரின் தீட்டிலிருந்து தங்களைப் பிரித்து, திரும்பிவந்த சமூகத்துடன் சேர்ந்தவர்கள் என்று மட்டும் விவரிக்கப்பட்டுள்ளனர்.
  alternative: அவர்கள் குறிப்பாக பிற இன மதமாற்றத்தினர்; அல்லது நாட்டிலேயே தங்கியிருந்த இஸ்ரவேலர் என்று வரையறுப்பது.
  rationale: எபிரெய வாசகம் அவர்களை மதமாற்றத்தினர் என்றோ இனத்தால் இஸ்ரவேலர் என்றோ வெளிப்படையாக அடையாளப்படுத்தவில்லை. எனவே அந்தத் திறந்தநிலையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: אֲלֵהֶם என்பதன் தொடர்பு
  choice: ‘அவர்களுடன் சேர்ந்துகொண்ட’ என்று உறவுப்பொருளை முதன்மை உரையில் வெளிப்படுத்துதல்.
  alternative: சொல்லுக்குச் சொல் ‘அவர்களிடம்’ என்று மட்டும் மொழிபெயர்த்தல் அல்லது அதை மொழிபெயர்க்காமல் விடுதல்.
  rationale: אֲלֵהֶם உரையில் வெளிப்படையாக உள்ளது. அதன் சுருக்கமான எபிரெய உறவுப்பொருளை இயல்பான தமிழில் தர ‘சேர்ந்துகொண்ட’ உதவுகிறது; இது அவர்களின் இன அடையாளத்தைத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் உறவுகள் தெளிவாகத் தெரிய சொற்றொடர்கள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத பங்கேற்பாளர்களின் இன அல்லது மத அடையாளம் சேர்க்கப்படவில்லை.
