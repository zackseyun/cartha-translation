revisions:
- from: ஏனெனில், ஆசாரியர்களும் லேவியர்களும் ஒருமனப்பட்டுத் தங்களைத் தூய்மைப்படுத்தியிருந்தார்கள்; அவர்கள் அனைவரும் தூய்மையானவர்களாயிருந்தார்கள். நாடுகடத்தப்பட்டுத் திரும்பிய அனைவருக்காகவும், தங்கள் சகோதரர்களாகிய ஆசாரியர்களுக்காகவும், தங்களுக்காகவும் அவர்கள் பஸ்காப் பலியை அறுத்தார்கள்.
  to: ஏனெனில், ஆசாரியர்களும் லேவியர்களும் ஒன்றாகத் தங்களைத் தூய்மைப்படுத்தியிருந்தார்கள்; அவர்கள் அனைவரும் தூய்மையானவர்களாயிருந்தார்கள். நாடுகடத்தப்பட்ட சமூகத்தினர் அனைவருக்காகவும், தங்கள் சகோதரர்களாகிய ஆசாரியர்களுக்காகவும், தங்களுக்காகவும் அவர்கள் பஸ்கா பலியை அறுத்தார்கள்.
  rationale: The revision replaces an interpretively narrowed expression with wording that retains the Hebrew ambiguity and collective force of כְּאֶחָד. It also renders “sons of the exile” idiomatically as the exile community without adding the unstated action of returning. The remaining wording faithfully reflects the Hebrew syntax and all three stated recipients of the sacrifice.
  reviewer_model: gpt-5.6-terra
