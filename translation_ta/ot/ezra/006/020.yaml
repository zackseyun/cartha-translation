base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: ta
  text: ஏனெனில், ஆசாரியர்களும் லேவியர்களும் ஒன்றாகத் தங்களைத் தூய்மைப்படுத்தியிருந்தார்கள்; அவர்கள் அனைவரும் தூய்மையானவர்களாயிருந்தார்கள். நாடுகடத்தப்பட்ட சமூகத்தினர் அனைவருக்காகவும், தங்கள் சகோதரர்களாகிய ஆசாரியர்களுக்காகவும், தங்களுக்காகவும் அவர்கள் பஸ்கா பலியை அறுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: ஒருமனப்பட்டு
  rationale: சொல்லெழுத்தாக ‘ஒருவரைப்போல்/ஒன்றாக’ என்பதைக் குறிக்கும் இச்சொற்றொடர், இங்கு ஆசாரியர்களும் லேவியர்களும் ஒருங்கிணைந்து ஒரே நிலைப்பாட்டில் தூய்மைப்படுத்திக்கொண்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டுத் திரும்பிய அனைவரும்
  rationale: எழுத்துப்பொருள் ‘நாடுகடத்தலின் பிள்ளைகள்’; எஸ்றாவின் சூழலில் நாடுகடத்தலிலிருந்து திரும்பிய சமூகத்தைக் குறிக்கிறது. தமிழில் தவறான உயிரியல் பொருள் ஏற்படாமல் சமூகச் சுட்டைத் தெளிவாக்குகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்காப் பலி
  rationale: இங்கு வினைச்சொல் ‘அறுத்தார்கள்’ என்பதால், பண்டிகை முழுவதையும் அல்லாமல் பஸ்காவுக்கான பலியையே குறிப்பது தெளிவு.
- source_word: וַיִּשְׁחֲטוּ
  choice: அறுத்தார்கள்
  rationale: பலிக்குரிய மிருகத்தைச் சடங்குமுறையில் கொல்வதைக் குறிக்கும் எபிரெய வினையின் நேரடியான, வழக்கமான தமிழ் இணை.
theological_decisions:
- issue: כְאֶחָד என்பதன் பொருள்
  choice: ஒருமனப்பட்டு
  alternative: ஒன்றாக / ஒருவரைப்போல்
  rationale: ஒற்றுமையையும் கூட்டு நடவடிக்கையையும் காக்கிறது; இருப்பினும் தனிப்பட்ட சுத்திகரிப்பு வேறுபாடுகளை உரையில் சேர்ப்பதில்லை.
- issue: பஸ்காவை அறுத்தவர்கள் யார்?
  choice: அருகிலுள்ள பன்மை எழுவாயான ஆசாரியர்களும் லேவியர்களும் எனத் திறந்தே வைத்தல்
  alternative: லேவியர்கள் மட்டும்
  rationale: எபிரெய உரையின் பன்மை வினைச்சொல் முந்தைய இரு குழுக்களையும் இலக்கணரீதியாகக் குறிக்கக்கூடும்; உரை தெளிவாகச் சொல்லாத தனிப்பட்ட குழுவை மட்டும் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுமக்களுக்கு எளிதில் புரியும் மரியாதையான நடை. ‘ஆசாரியர்’, ‘லேவியர்’, ‘பஸ்கா’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
