  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: ta
  text: 'மேலும், நான் ஓர் ஆணை பிறப்பிக்கிறேன்: இந்த அரசாணையை மாற்றுகிற எவனுடைய வீட்டிலிருந்தும் ஒரு மரத்தூண்[a] பிடுங்கி எடுக்கப்பட்டு, அவன் அதன்மேல் கழுவேற்றப்பட வேண்டும்[b]; இதன் காரணமாக அவனுடைய வீடு குப்பைமேடாக்கப்பட வேண்டும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, வீட்டின் கட்டுமானத்திலிருந்த ஒரு மரம் அல்லது உத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் அதன்மேல் தொங்கவிடப்பட வேண்டும்.”
    reason: alternative_reading
  - marker: c
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “சாணமேடாக்கப்பட வேண்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: ஓர் ஆணை பிறப்பிக்கிறேன்
  rationale: ‘ஆணையை ஏற்படுத்துதல்/வைத்தல்’ என்ற அரச நிர்வாக மரபுத்தொடரை இயல்பான நவீன தமிழில் அதிகாரப்பூர்வ ஆணை பிறப்பிப்பதாக வழங்குகிறது.
- source_word: יְהַשְׁנֵא
  choice: மாற்றுகிற
  rationale: அரசாணையின் வாசகத்தை மாற்றுதல் அல்லது அதில் கையாடல் செய்தல் என்பதே சூழலுக்குப் பொருத்தம்; வெறுமனே கீழ்ப்படியாமை என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: פִּתְגָמָא דְנָה
  choice: இந்த அரசாணையை
  rationale: இங்கு ‘சொல்’ என்பது பேரரசின் அதிகாரப்பூர்வ ஆணையைக் குறிக்கிறது; ‘அரசாணை’ நிர்வாகச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: அவனுடைய வீட்டிலிருந்தும் ஒரு மரத்தூண் பிடுங்கி எடுக்கப்பட்டு
  rationale: தண்டனைக்குப் பயன்படுத்துவதற்காக வீட்டின் கட்டுமான மரம் பிடுங்கப்படுவதைத் தெளிவாகவும் காட்சிப்படுத்தும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: அவன் அதன்மேல் கழுவேற்றப்பட வேண்டும்
  rationale: உயர்த்தப்பட்ட மரத்தூணில் உடலை ஏற்றி நிலைநிறுத்தும் பண்டைய கொடிய தண்டனையை ‘கழுவேற்றுதல்’ சுருக்கமாகக் குறிக்கிறது; தொங்கவிடுதல் என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: נְוָלוּ
  choice: குப்பைமேடு
  rationale: அவமானகரமான அசுத்த அல்லது கழிவுக் குவியலாக மாற்றப்படுதல் என்ற கருத்தை நவீன வாசகருக்குத் தெளிவாக வழங்குகிறது; பாரம்பரியமான ‘சாணமேடு’ மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָל אֱנָשׁ
  choice: எவனுடைய
  rationale: மூலத்தின் ஒருமை ஆண்பால் பொதுப்பயன்பாட்டைத் தமிழின் இயல்பான சட்டவாக்கிய அமைப்பில் காக்கிறது.
theological_decisions:
- issue: பேரரசுத் தண்டனையைக் குறிக்கும் சொற்றொடரின் தன்மை
  choice: முதன்மை உரையில் ‘கழுவேற்றப்பட வேண்டும்’
  alternative: ‘அதன்மேல் தொங்கவிடப்பட வேண்டும்’
  rationale: அரமேயச் சொற்றொடர் வீட்டிலிருந்து பிடுங்கிய மரத்தில் குற்றவாளியை உயர்த்தி ஏற்றுதல் அல்லது நிலைநிறுத்துதலைக் குறிக்கிறது. பிற்காலத் தூக்குமேடைத் தண்டனையை மனதில் எழுப்பாமல் பண்டைய சூழலைக் காட்ட ‘கழுவேற்றுதல்’ முதன்மை உரையில் வைக்கப்படுகிறது; மொழியிலுள்ள சாத்தியமான ‘தொங்கவிடுதல்’ பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச ஆணைக்குரிய கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. தண்டனையின் கொடுமை மென்மைப்படுத்தப்படவில்லை; அதேவேளை அரமேயச் சொல்லாக்கத்தின் ‘கழுவேற்றுதல்/தொங்கவிடுதல்’ தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
