  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான ஆவண-வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூல அரமேயத்தின் இடவரிசையைத் தமிழுக்கேற்றவாறு அமைத்து, செயப்பாட்டு வடிவமும் மேற்கோளை அறிமுகப்படுத்தும் முடிவிலுள்ள இருபுள்ளியும் காக்கப்பட்டுள்ளன.
