  text: וְ/הִשְׁתְּכַ֣ח בְּ/אַחְמְתָ֗א בְּ/בִֽירְתָ֛/א דִּ֛י בְּ/מָדַ֥י מְדִינְתָּ֖/ה מְגִלָּ֣ה חֲדָ֑ה וְ/כֵן כְּתִ֥יב בְּ/גַוַּ֖/הּ דִּכְרוֹנָֽ/ה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: ta
  text: 'மேதியா மாகாணத்திலுள்ள எக்பத்தானா[a] கோட்டையில்[b] ஒரு சுருள் கண்டெடுக்கப்பட்டது. அதில் நினைவுப்பதிவாக[c] இவ்வாறு எழுதப்பட்டிருந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அக்மெத்தா”; இது எக்பத்தானா என்பதற்கான அரமேயப் பெயரின் ஒலிக்கு நெருக்கமான வடிவம்.
    reason: lexical_alternative
  - marker: b
    text: “கோட்டை” என்பதற்கு “அரண்” என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் அரண் சூழ்ந்த அரச அல்லது நிர்வாக வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “நினைவுப்பதிவு” என்பதற்கு “ஆவணக் குறிப்பு” என்றும் மொழிபெயர்க்கலாம். இது நினைவிற்காகப் பாதுகாக்கப்பட்ட அதிகாரபூர்வ எழுத்துப் பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: கண்டெடுக்கப்பட்டது
  rationale: அரமேய வினையின் செயப்பாட்டு பொருளை இயல்பான தமிழில் தருகிறது; ஆவணக் காப்பகத்தில் தேடிக் கண்டுபிடிக்கப்பட்ட சூழலுக்கும் பொருந்துகிறது.
- source_word: אַחְמְתָא
  choice: எக்பத்தானா
  rationale: மேதியாவின் தலைநகருக்குரிய பரவலாக அறியப்பட்ட வரலாற்றுப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; அரமேய வடிவிற்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בִּירְתָא
  choice: கோட்டை
  rationale: அரச அல்லது நிர்வாகப் பயன்பாடுடைய அரண் சூழ்ந்த வளாகத்தைக் குறிக்கும் சொல்லை பொதுவாகப் புரியக்கூடிய தமிழில் தருகிறது.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: மேதியா மாகாணத்திலுள்ள
  rationale: இடத்தைக் குறிக்கும் தொடர்புத் தொடரையும் நிர்வாகப் பிரிவான மாகாணத்தையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: מְגִלָּה חֲדָה
  choice: ஒரு சுருள்
  rationale: חֲדָה இங்கு எண்ணிக்கையை வலியுறுத்தாமல் வரையறையற்ற ‘ஒரு’ என்ற இயல்பில் அமைகிறது; சுருள் என்பது ஆவணத்தின் வடிவை நேரடியாகக் காட்டுகிறது.
- source_word: וְכֵן כְּתִיב
  choice: இவ்வாறு எழுதப்பட்டிருந்தது
  rationale: தொடர்ந்து வரவிருக்கும் மேற்கோளை அறிமுகப்படுத்தும் சுட்டுப் பொருளை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: בְּגַוַּהּ
  choice: அதில்
  rationale: சுருளுக்குள் எழுதப்பட்டிருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: דִּכְרוֹנָה
  choice: நினைவுப்பதிவாக
  rationale: அதிகாரபூர்வமாக நினைவில் வைத்துப் பாதுகாக்கப்பட்ட ஆவணக் குறிப்பைக் குறிக்கும் மூலச்சொல்லின் பொருளை காக்கிறது; ‘ஆவணக் குறிப்பு’ என்ற சூழல்சார் மாற்றும் சாத்தியம்.
