translation_notes:
  register: நவீன நிலையான தமிழில் அரச ஆணைக்குரிய கண்ணியமும் நேரடித்தன்மையும் பேணப்பட்டுள்ளன. அரமேய மூலத்திலுள்ள மூன்றாம் நபர் உடைமை விகுதி ‘அவர்களுடைய’ என்று பாதுகாக்கப்பட்டது. உறுதியற்ற அֲפַרְסְכָיֵא சொல்லுக்கு விளக்க மொழிபெயர்ப்பைத் திணிக்காமல் எழுத்துப்பெயர்ப்பும் அடிக்குறிப்பும் பயன்படுத்தப்பட்டுள்ளன.
