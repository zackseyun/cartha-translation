  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: ta
  text: இப்போது, ஆற்றுக்கு அப்பாலுள்ள மாகாணத்தின்[b] ஆளுநன் தத்தெனாயே, சேத்தார்-போஸ்னாயே, ஆற்றுக்கு அப்பால் உள்ள அபர்சக்கேயர்களான[a] அவர்களுடைய சகாக்களே, அந்த இடத்திலிருந்து விலகியே இருங்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அபர்சக்கேயர்கள்’ என்ற சொல் பாரசீக நிர்வாக அதிகாரிகளைக் குறிக்கலாம்; அதன் துல்லியமான அடையாளம் உறுதியற்றது.
    reason: alternative_reading
  - marker: b
    text: ‘ஆற்றுக்கு அப்பால்’ என்பது பாரசீகப் பேரரசின் பார்வையில் யூபிராத்து ஆற்றுக்கு மேற்கே இருந்த மாகாணத்திற்கான நிர்வாகப் பெயர்.
    reason: cultural_note
  - marker: c
    text: இதைக் கூடுதலாகச் சொல்லுக்குச் சொல்லாக, ‘அங்கிருந்து தொலைவில் இருங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: இப்போது
  rationale: அரசனின் கட்டளையை அறிமுகப்படுத்தும் அரமேய உரையாடல் இடைச்சொல்லை இயல்பான தமிழில் காட்டுகிறது; காரணவியல் தொடர்பைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள மாகாணத்தின் ஆளுநன்
  rationale: פַּחַת என்பது பேரரசின் மாகாண ஆளுநனைக் குறிக்கிறது; עֲבַר נַהֲרָה என்பது யூபிராத்துக்கு மேற்கிலிருந்த பாரசீக நிர்வாகப் பகுதியின் பெயர். தமிழில் நிர்வாகப் பொருள் தெளிவாக இருக்க ‘மாகாணம்’ சேர்க்கப்பட்டது.
- source_word: תַּתְּנַי
  choice: தத்தெனாய்
  rationale: தனிப்பெயர் மூல மொழியின் ஒலிக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שְׁתַר בּוֹזְנַי
  choice: சேத்தார்-போஸ்னாய்
  rationale: கூட்டுப் பெயரின் அமைப்பை இணைப்புக்குறியுடன் பாதுகாக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וּכְנָוָתְהוֹן
  choice: அவர்களுடைய சகாக்களும்
  rationale: ־הוֹן என்பது மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி; ஆகவே ‘உங்கள்’ என்பதற்குப் பதில் மூலத்தின் ‘அவர்களுடைய’ என்பதே பாதுகாக்கப்பட்டது.
- source_word: אֲפַרְסְכָיֵא
  choice: அபர்சக்கேயர்கள்
  rationale: இந்த நிர்வாக அல்லது இன அடையாளச் சொல்லின் துல்லியமான பொருள் உறுதியற்றதால் ‘பாரசீக அதிகாரிகள்’ என்று தீர்மானித்து மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: அந்த இடத்திலிருந்து விலகியே இருங்கள்
  rationale: சொல்லுக்குச் சொல் ‘அங்கிருந்து தொலைவில் இருங்கள்’ என்ற அரச கட்டளையை இயல்பான, வலியுறுத்தலுள்ள நவீன தமிழில் வழங்குகிறது.
