  source_fidelity: மொத்தத்தில் மூல அரமேயத்தின் தொடர்ச்சியான ‘கட்டுதல்’ மற்றும் ‘வெற்றியடைதல்’ செயலும், நிறைவு கடவுளின் ஆணை மற்றும் பாரசீக அரசர்களின் ஆணைகள் ஆகிய இரண்டுடனும் இணைக்கப்படுவதும் காக்கப்பட்டுள்ளன. ஆனால் முதல் வாக்கியத்தில் பெயர்த்தொடர் அமைப்பு இயல்பாக இல்லை; மேலும் ‘பெர்சிய அரசன்’ என்பதற்குப் பதிலாக நவீன தமிழில் ‘பாரசீகத்தின் அரசனான’ என்பது துல்லியமாகவும் இயல்பாகவும் உள்ளது.
  naturalness: ‘கட்டிக்கொண்டும் ... முன்னேறிக்கொண்டும் இருந்தார்கள்’ என்ற இரட்டைத்தொடர் கனமாக உள்ளது. ‘கட்டிக்கொண்டும் வெற்றியடைந்துகொண்டும் இருந்தார்கள்’ என்பது மூலத்தின் இரு தொடர்வினைகளையும் நேரடியாகவும் வாசிக்க இயல்பாகவும் தருகிறது. ‘இறைவாக்கினர் ஆகாயும் ... சகரியாவும் உரைத்த’ என்பதற்குப் பதிலாக இருவரையும் தெளிவாக இணைக்கும் பெயர்த்தொடர் தேவைப்படுகிறது.
  terminology: ‘மூப்பர்கள்,’ ‘இறைவாக்கினர்,’ ‘ஆணை,’ ‘இஸ்ரவேலின் கடவுள்’ ஆகியவை பொருத்தமானவை. ஆகாய், இத்தோ, சகரியா, கோரேசு, தரியு, அர்த்தசஷ்டா ஆகிய பெயர்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. ‘பாரசீகம்’ என்ற வடிவம் பரிந்துரைக்கப்படுகிறது.
