  to: யூதர்களின் மூப்பர்கள் கட்டிக்கொண்டும், இறைவாக்கினரான ஆகாய் மற்றும் இத்தோவின் மகன் சகரியா ஆகியோரின் இறைவாக்கினால் வெற்றியடைந்துகொண்டும் இருந்தார்கள்.[a] அவர்கள் இஸ்ரவேலின் கடவுளுடைய ஆணையின்படியும்[b][c], கோரேசு, தரியு, பாரசீகத்தின் அரசனான அர்த்தசஷ்டா ஆகியோரின் ஆணையின்படியும் கட்டி முடித்தார்கள்.
