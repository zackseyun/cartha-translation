base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: ta
  text: யூதர்களின் மூப்பர்கள் கட்டிக்கொண்டும், இறைவாக்கினரான ஆகாய் மற்றும் இத்தோவின் மகன் சகரியா ஆகியோரின் இறைவாக்கினால் வெற்றியடைந்துகொண்டும் இருந்தார்கள்.[a] அவர்கள் இஸ்ரவேலின் கடவுளுடைய ஆணையின்படியும்[b][c], கோரேசு, தரியு, பாரசீகத்தின் அரசனான அர்த்தசஷ்டா ஆகியோரின் ஆணையின்படியும் கட்டி முடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செழித்துக்கொண்டும்’ அல்லது ‘முன்னேறிக்கொண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆணையின்படி’ என்பதற்கு ‘கட்டளையின்படி’ அல்லது ‘தீர்மானத்தின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்த வசனம் கட்டுமானப் பணி நிறைவேறியதை கடவுளுடைய ஆணைக்கும் பாரசீக அரசர்களின் ஆணைகளுக்கும் உரியதாகக் கூறுகிறது; கடவுளுடைய ஆணை முதலில் குறிப்பிடப்படுகிறது.
    reason: theological_clarification
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: யூதர்களின் மூப்பர்கள்
  rationale: சமூகத் தலைவர்களாக இருந்த மூப்பர்களையும் அவர்களின் யூத அடையாளத்தையும் நேரடியாகக் காட்டுகிறது; இதை புவியியல் சார்ந்த ‘யூதாவின் மூப்பர்கள்’ என்று மாற்றவில்லை.
- source_word: בָּנַיִן
  choice: கட்டிக்கொண்டும்
  rationale: அரமேயப் பங்கேற்புவினையின் தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மறுபடியும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וּמַצְלְחִין
  choice: வெற்றியுடன் முன்னேறிக்கொண்டும்
  rationale: வேலை நன்கு நடைபெற்று வெற்றியடைந்தது என்ற சொல்லின் பரப்பை இயல்பாகக் காட்டுகிறது; ‘செழித்தல்’, ‘வெற்றியடைதல்’ ஆகிய நிழற்பொருள்களும் குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: בִּנְבוּאַת
  choice: உரைத்த இறைவாக்கினால்
  rationale: தீர்க்கதரிசன ஊழியம் கட்டுமானப் பணியின் முன்னேற்றத்திற்கான வழிமுறையாக இருந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: חַגַּי נביאה
  choice: இறைவாக்கினர் ஆகாய்
  rationale: பெயருடன் வரும் பதவிப் பெயரைத் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: இத்தோவின் மகன் சகரியா
  rationale: அரமேய மகவுறவுச் சொல்லான ‘பர்’ என்பதைக் தமிழில் இயல்பாக அளிக்கிறது.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: கட்டி முடித்தார்கள்
  rationale: ‘கட்டினார்கள்; நிறைவுசெய்தார்கள்’ என்ற இரட்டை வினைத் தொடரை அதன் முழுப் பொருளையும் காத்து இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: מִן טַעַם
  choice: ஆணையின்படி
  rationale: அதிகாரப்பூர்வமான கட்டளை, ஆணை அல்லது தீர்மானம் என்ற அரச நிர்வாகப் பொருளைத் தருகிறது; கடவுளுக்கும் அரசர்களுக்கும் ஒரே சொல்லைத் திரும்பப் பயன்படுத்தி மூலத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: மூலத்தின் உரிமைத் தொடர்புடைய தெய்வீகப் பட்டத்தை நேரடியாக அளிக்கிறது.
- source_word: מֶלֶךְ פָּרָס
  choice: பெர்சிய அரசன் அர்த்தசஷ்டா
  rationale: ஒருமையில் உள்ள பட்டம் உடனடியாக முந்திய அர்த்தசஷ்டாவோடு இலக்கண ரீதியாக இணைவதைப் பாதுகாக்கிறது; அதை மூவரையும் குறிக்கும் பன்மைப் பட்டமாக மாற்றவில்லை.
theological_decisions:
- issue: ஆலயப் பணி நிறைவேறியதில் தெய்வீக ஆணைக்கும் பேரரசர்களின் ஆணைகளுக்கும் உள்ள உறவு
  choice: நிறைவேற்றம் இஸ்ரவேலின் கடவுளுடைய ஆணையின்படியும் பெர்சிய அரசர்களின் ஆணையின்படியும் நிகழ்ந்ததாக, கடவுளுடைய ஆணையை முதலில் குறிப்பிட்டு மொழிபெயர்க்கப்பட்டது.
  alternative: அரசர்களின் ஆணைகள் கடவுளுடைய ஆணையின் கீழ்ப்பட்ட வெளிப்பாடுகள் என்று வெளிப்படையாக விளக்குதல்.
  rationale: மூலம் தெய்வீக ஆணையையும் மனித அரச ஆணைகளையும் அருகருகே கூறுகிறது; அவற்றின் உறவை மேலதிக கோட்பாட்டால் தீர்மானிக்காமல் அந்த இறையியல் இழுவிசையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இறைவாக்கினர்’ மற்றும் ‘ஆணை’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. அரசர்களின் பெயர்கள் தமிழ் வேதாகம மரபில் அறிமுகமான வடிவங்களுக்கு நெருக்கமாக வைக்கப்பட்டன; மூலத்தின் தொடர்ச்சியான செயலும் இணை ஆணை அமைப்பும் பாதுகாக்கப்பட்டன.
