source:
  edition: WLC
  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: ta
  text: மோசேயின் நூலில் எழுதப்பட்டுள்ளபடி[b], அவர்கள் ஆசாரியர்களை அவரவர் பிரிவுகளிலும், லேவியர்களை அவரவர் பிரிவுகளிலும்[a], எருசலேமில் நடைபெறும் கடவுளுக்கான சேவைக்காக நியமித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிப்பிரிவுகள்’ என்றும் மொழிபெயர்க்கலாம்; ஆசாரியர்களையும் லேவியர்களையும் குறிக்கும் இவ்விரு அரமேயச் சொற்களும் பொருளில் நெருக்கமான அமைப்புசார் சொற்கள்.
    reason: lexical_alternative
  - marker: b
    text: ‘மோசேயின் நூலில் எழுதப்பட்டிருப்பதற்கேற்ப’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: நியமித்தார்கள்
  rationale: קום என்பதன் காரணவினை வடிவம் ‘நிற்கச் செய்தல்,’ ‘உரிய இடத்தில் அமர்த்துதல்,’ அல்லது ‘நியமித்தல்’ எனப் பொருள்படும். ஆலயப் பணியாளர்களை ஒழுங்காகப் பொறுப்பில் அமர்த்தும் இச்சூழலில் ‘நியமித்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָהֲנַיָּא
  choice: ஆசாரியர்களை
  rationale: ஆலய வழிபாட்டுப் பணியைச் செய்த அறியப்பட்ட ஆசாரியர் குழுவைக் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: அவரவருடைய பிரிவுகளின்படி
  rationale: இந்தச் சொல் ஒழுங்கமைக்கப்பட்ட பிரிவுகளையோ பணி முறைகளையோ குறிக்கிறது. ‘பிரிவுகளின்படி’ என்பது அந்த அமைப்புசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֵוָיֵא
  choice: லேவியர்களை
  rationale: லேவி குலத்தைச் சேர்ந்த ஆலயப் பணியாளர்களைக் குறிக்கும் நிலையான பெயர்ப்பு.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: அவரவருடைய பணிப்பிரிவுகளின்படி
  rationale: ஒதுக்கப்பட்ட குழுக்கள் அல்லது பணிப்பிரிவுகளைக் குறிக்கிறது. ஆசாரியர்களுக்குப் பயன்படுத்தப்பட்ட தொடர்புடைய சொல்லிலிருந்து இதைச் சற்றே வேறுபடுத்திக் காட்ட ‘பணிப்பிரிவுகள்’ எனப் பெயர்க்கப்பட்டது; இரண்டிற்கும் உள்ள பொருள் நெருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: கடவுளின் பணிக்காக
  rationale: עַל உடன் வரும் עֲבִידַת என்பது ஒரு பணிக்குப் பொறுப்பாக அல்லது அதற்காக அமர்த்தப்படுதலைக் குறிக்கலாம். ‘பணிக்காக’ என்பது ஆலயச் சேவைக்கான நியமிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דִּי בִירוּשְׁלֶם
  choice: எருசலேமிலுள்ள
  rationale: அரமேய உறவுத்தொடர், கடவுளின் பணியை எருசலேமில் நடைபெறும் ஆலயப் பணியோடு இணைக்கிறது.
- source_word: כִּכְתָב
  choice: எழுதப்பட்டுள்ளபடி
  rationale: எழுத்துப்பூர்வமான அறிவுறுத்தலுக்கு ஏற்பச் செய்யப்பட்டதை அறிமுகப்படுத்தும் சொற்றொடர். ‘எழுதப்பட்டுள்ளபடி’ அதன் அதிகாரப்பூர்வ ஒத்திசைவைச் சுருக்கமாகத் தருகிறது.
- source_word: סְפַר מֹשֶׁה
  choice: மோசேயின் நூல்
  rationale: סְפַר என்பது நூலையோ சுருளையோ குறிக்கலாம். இச்சூழலில் ‘மோசேயின் நூல்’ தெளிவானதும் நிலையானதும் ஆகும்.
theological_decisions:
- issue: ஆலயப் பணி ஒழுங்குக்கும் மோசேயின் எழுத்துப்பூர்வ அறிவுறுத்தலுக்கும் உள்ள உறவு
  choice: ஆசாரியர்களும் லேவியர்களும் மோசேயின் நூலில் எழுதப்பட்டுள்ளதற்கு ஏற்ப ஆலயப் பணிக்காக ஒழுங்குபடுத்தப்பட்டனர்.
  alternative: இது எழுத்துப்பூர்வ கட்டளையோடு நேரடியாக இணைக்கப்படாத வழக்கமான நிர்வாக ஒழுங்கு மட்டுமே என்று வாசித்தல்.
  rationale: இறுதித் தொடர் இந்த ஒழுங்கை மோசேயின் நூலில் எழுதப்பட்டுள்ளதோடு வெளிப்படையாக இணைக்கிறது. அதற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் இந்த இணைப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல் வரிசையைத் தமிழின் இயல்பான வாக்கிய அமைப்புக்காக மாற்றியிருந்தாலும், ஆசாரியர் மற்றும் லேவியர் பிரிவுகள், எருசலேமிலுள்ள கடவுளின் பணி, மோசேயின் நூலுக்கான ஒத்திசைவு ஆகிய அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
