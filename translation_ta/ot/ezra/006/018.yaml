  source_fidelity: 'மூல அரமேயத்தின் முக்கியக் கூறுகள் அனைத்தும் வரைவில் உள்ளன: ஆசாரியர், லேவியர், அவரவர் அமைப்புப் பிரிவுகள், எருசலேமோடு தொடர்புடைய கடவுளுக்கான சேவை, மோசேயின் நூலில் உள்ள எழுத்துப்பூர்வ வழிகாட்டல். ஆனால் “எருசலேமிலுள்ள கடவுளின் பணி” என்பது இலக்கண ரீதியாகக் கடவுளே எருசலேமில் உள்ளவர் எனவும் புரிய வாய்ப்புள்ளது; மூலத்தில் எருசலேம் ‘சேவை’யைச் சுட்டுகிறது. இரு அமைப்புசார் சொற்களுக்கும் வேறுபட்ட தமிழ் சொற்களைப் பயன்படுத்தத் தேவையான அளவுக்கு மூலத்தில் பொருள் வேறுபாடு உறுதியாக இல்லை.'
  naturalness: “அவரவர் பிரிவுகளில்” மற்றும் “எருசலேமில் நடைபெறும் கடவுளுக்கான சேவை” நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் அமைகின்றன. “பணிப்பிரிவுகள்” என்பது சாத்தியமான விளக்கம் என்றாலும், முதன்மை உரையில் வெறும் ‘பிரிவுகள்’ என வைத்தல் மூலத்தின் நெருக்கமான இணைச்சொல் பயன்பாட்டைச் சிறப்பாகப் பாதுகாக்கிறது.
  terminology: “ஆசாரியர்கள்,” “லேவியர்கள்,” “மோசேயின் நூல்,” “நியமித்தார்கள்” ஆகியவை பொருத்தமானவை. “கடவுளுக்கான சேவை” என்பது עֲבִידַת אֱלָהָא என்பதன் ஆலயச் சேவைப் பொருளை இயல்பாகத் தருகிறது; எந்தப் பிற்காலக் கோட்பாட்டையும் சேர்ப்பதில்லை.
