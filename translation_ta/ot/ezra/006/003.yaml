base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: ta
  text: 'கோரேஸ் அரசனின் முதலாம் ஆண்டில், கோரேஸ் அரசன் ஓர் ஆணை பிறப்பித்தான்: “எருசலேமிலுள்ள கடவுளின் வீடு பலிகள் செலுத்தப்படும் இடமாக மறுபடியும் கட்டப்படட்டும்; அதன் அஸ்திவாரங்கள் இடப்படட்டும்[a]. அதன் உயரம் அறுபது முழமும், அகலம் அறுபது முழமும் இருக்கட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் அஸ்திவாரங்கள் நிலைநிறுத்தப்படட்டும்/உயர்த்தப்படட்டும்.” இந்த அரமேயச் சொற்றொடரின் பொருள் தெளிவில்லை; மொழிபெயர்ப்புகள் வேறுபடுகின்றன. கட்டுமானச் சூழலுக்கு “அஸ்திவாரங்கள் இடப்படட்டும்” என்பது நன்கு பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: ஓர் ஆணை பிறப்பித்தான்
  rationale: அரமேய நிர்வாக மரபுத்தொடர் அதிகாரபூர்வமான ஆணையை வெளியிடுவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் முறையான நடையிலும் இதைத் தெரிவிக்கிறது.
- source_word: בֵּית אֱלָהָא
  choice: கடவுளின் ஆலயம்
  rationale: சொல்லர்த்தம் ‘கடவுளின் வீடு’ என்றாலும், இங்கு எருசலேம் திருக்கோயிலையே தெளிவாகக் குறிக்கிறது. ‘ஆலயம்’ சாதாரண நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது; அடுத்துள்ள ‘ஆலயம்’ என்பதுடனான மீளுரைப்பும் காக்கப்படுகிறது.
- source_word: יִתְבְּנֵא
  choice: மறுபடியும் கட்டப்படட்டும்
  rationale: வினைச்சொல் அடிப்படையில் ‘கட்டப்படட்டும்’ என்பதாகும்; அழிக்கப்பட்ட ஆலயத்தை மீட்டுக் கட்டும் வரலாற்றுச் சூழல் ‘மறுபடியும்’ என்பதை நியாயப்படுத்துகிறது. ஆணையின் கட்டளைத் தன்மையும் காக்கப்படுகிறது.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: பலிகள் செலுத்தப்படும் இடமாக
  rationale: அரமேயத்தில் ஒரே வேரைச் சேர்ந்த வினையும் பெயரும் சேர்ந்து வரும் மரபுத்தொடரை, பொருளை இழக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: அதன் அஸ்திவாரங்கள் இடப்படட்டும்
  rationale: இது பொருள் தெளிவில்லாத அரமேயச் சொற்றொடர். கட்டுமானச் சூழலில் அஸ்திவாரங்களை இடுதல் என்ற பொருள் பொருத்தமானது; பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: רוּמֵהּ
  choice: அதன் உயரம்
  rationale: கட்டடத்தின் செங்குத்தான அளவைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: אַמִּין שִׁתִּין
  choice: அறுபது முழம்
  rationale: பண்டைய அளவான cubit-ஐ தமிழில் வழக்கமான வேதாகம அளவுச்சொல்லான ‘முழம்’ என்று வழங்கி, நவீன அலகாக மாற்றாமல் மூலத்தின் வரலாற்றுத் தன்மை காக்கப்படுகிறது.
- source_word: פְּתָיֵהּ
  choice: அகலம்
  rationale: கட்டடத்தின் பக்கவாட்டு அளவைக் குறிக்க நவீனத் தமிழில் இயல்பான சொல்.
