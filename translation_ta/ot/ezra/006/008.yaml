translation_notes:
  register: நவீனத் தரத் தமிழில், அரச ஆணையின் கண்ணியமான நிர்வாக நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘தேவனுடைய இந்த ஆலயம்’ என்று மூலத்தின் சுட்டுப்பெயர் துல்லியமாகக் காக்கப்பட்டது; ‘வரி’ அரச வருவாயின் மூலமாகத் தெளிவாக்கப்பட்டது.
