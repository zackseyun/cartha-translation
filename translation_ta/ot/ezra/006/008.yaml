base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: ta
  text: 'மேலும், இந்த யூத மூப்பர்கள் தேவனுடைய இந்த ஆலயத்தை மீண்டும் கட்டும் பணியில் இருக்கும்போது, நீங்கள் அவர்களுக்காக என்ன செய்ய வேண்டும் என்பதைக் குறித்து நான் ஓர் ஆணை பிறப்பிக்கிறேன்: வேலை தடைபடாதபடி, ஆற்றுக்கு அப்பாலுள்ள பகுதியிலிருந்து[a] வசூலிக்கப்படும் வரியாகிய அரசனுடைய வருவாயிலிருந்து அவர்களுடைய செலவுகள் தாமதமின்றி கொடுக்கப்பட வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆற்றுக்கு அப்பாலுள்ள பகுதி” என்பது ஐப்பிராத்து ஆற்றுக்கு மேற்கே இருந்த நிலப்பகுதிகளுக்கான பாரசீக நிர்வாகப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: மேலும் ... நான் ஓர் ஆணை பிறப்பிக்கிறேன்
  rationale: அரமேய நிர்வாக மரபுத்தொடரின் அதிகாரப்பூர்வ ஆணையையும், அரசனே பேசுபவர் என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: இந்த யூத மூப்பர்கள்
  rationale: யூத சமூகத்தின் தலைவர்களைக் குறிக்கும் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: தேவனுடைய இந்த ஆலயத்தைத் திரும்பக் கட்டும்போது
  rationale: דֵךְ என்பதன் பொருள் ‘இந்த’ என்பதே; ‘உங்கள்’ அல்ல. சூழலில் முன்பு இருந்த ஆலயம் மீண்டும் கட்டப்படுவதால் ‘திரும்பக் கட்ட’ இயல்பானது.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதியிலிருந்து வசூலிக்கப்படும் வரியாகிய அரச வருவாயிலிருந்து
  rationale: מִדַּת என்பது மாகாணத்தை அல்ல, வரி அல்லது திறையைக் குறிக்கிறது; அரச நிதியின் ஆதாரத்தைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: אָסְפַּרְנָא
  choice: உடனுக்குடன்
  rationale: இந்த நிர்வாகச் சூழலில் விரைவாகவும் தவறாமல் செய்யப்பட வேண்டிய செலுத்துதலை இயல்பாக உணர்த்துகிறது.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: இவர்களுடைய செலவுகள் ... கொடுக்கப்பட வேண்டும்
  rationale: மூலத்தின் செயப்பாட்டு அமைப்பையும், கட்டுமானச் செலவுகள் மூப்பர்களுக்கு வழங்கப்பட வேண்டும் என்ற பொருளையும் காக்கிறது.
- source_word: דִּי לָא לְבַטָּלָא
  choice: வேலை தடைபடாதபடி
  rationale: சொல்லப்படாமல் உள்ள சூழல்சார் பொருளான கட்டுமான வேலையை வெளிப்படுத்தி, நிறுத்தம் ஏற்படக் கூடாது என்ற நோக்கத்தைத் தருகிறது.
