base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: ta
  text: இந்த வீடு[a] ஆதார் மாதத்தின் மூன்றாம் நாளுக்குள்[b] கட்டி முடிக்கப்பட்டது. அது தரியு அரசன் ஆட்சி செய்த ஆறாம் ஆண்டாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த ஆலயம்.’ அரமேய மொழியில் சொல்லுக்குச் சொல் ‘இந்த வீடு’ என்று உள்ளது; எஸ்றா நூலில் ‘வீடு’ என்பது ஆலயத்தைக் குறிக்கும் வழக்கமான சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆதார் மாதத்தின் மூன்றாம் நாளில்.’ இந்தச் சொற்றொடர், ஆலயம் அந்தக் குறிப்பிட்ட நாளில் கட்டி முடிக்கப்பட்டது என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: கட்டி முடிக்கப்பட்டது
  rationale: கட்டுமானப் பணி நிறைவுக்குக் கொண்டுவரப்பட்டதைச் சூழல் காட்டுகிறது. அரமேய மொழியின் செயப்பாட்டு வடிவத்தையும் ஆலயத்தின் மீதுள்ள கவனத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בַּיְתָה דְנָה
  choice: இந்த வீடு
  rationale: மூலத்தில் நேரடியாக ‘இந்த வீடு’ என்று உள்ளது. எஸ்றாவில் இது ஆலயத்தைக் குறிக்கும் வழக்கமான சொல் என்பதால், மூல உருவகத்தை முதன்மை உரையில் வைத்துப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: עַד יוֹם תְּלָתָה
  choice: மூன்றாம் நாளுக்குள்
  rationale: עַד என்பது வேலை அந்தத் தேதிக்குள் நிறைவடைந்த எல்லைப்புள்ளியைக் குறிக்கலாம். ‘நாளுக்குள்’ என்பது இப்பொருளை இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட நாளிலேயே முடிந்தது என்ற வாசிப்பும் சாத்தியம்.
- source_word: לִירַח אֲדָר
  choice: ஆதார் மாதத்தின்
  rationale: மாதத்தின் பெயரையும் அதனுடன் உள்ள தொடர்பையும் நேரடியாகவும் தமிழின் தேதி வழக்குக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: அது … ஆறாம் ஆண்டாக இருந்தது
  rationale: முன்னர் குறிப்பிடப்பட்ட தேதி அரசாட்சியின் ஆறாம் ஆண்டில் வந்தது என்பதை அரமேய உறவுத்தொடரின் பொருளோடு இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמַלְכוּת
  choice: ஆட்சியின்
  rationale: காலக்கணிப்பு சூத்திரத்தில் இது அரசரின் ஆட்சிக்காலத்தைக் குறிக்கிறது; ‘ஆட்சியின்’ என்பது சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: தரியு அரசன்
  rationale: அரசரின் பெயரையும் மூலத்தில் வெளிப்படையாக உள்ள அரச பட்டத்தையும் பாதுகாக்கிறது.
