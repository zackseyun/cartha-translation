source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: ta
  text: அவர்கள் பரலோகத்தின் தேவனுக்கு இனிய நறுமணமுள்ள பலிகளைச் செலுத்தவும்[a], அரசனும் அவன் மகன்களும் வாழ்வதற்காக வேண்டிக்கொள்ளவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனிய நறுமணங்களை.” இந்த அரமேயச் சொல், ஏற்றுக்கொள்ளத்தக்க பலிகளோடு தொடர்புடைய இனிய அல்லது மனநிறைவளிக்கும் நறுமணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசனுக்கும் அவன் மகன்களுக்கும் நலனுக்காக.” சொல்லடியாக, “அரசனும் அவன் மகன்களும் வாழ்வதற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי לֶהֱוֺן
  choice: அவர்கள் ... செய்யும்படி
  rationale: דִּי இங்கு நோக்கத்தை அறிமுகப்படுத்துகிறது; לֶהֱוֺן தொடரும் பங்கேற்புவினைகளுடன் நோக்கம் அல்லது வாய்ப்பைக் குறிக்கிறது. தமிழில் ‘செய்யும்படி’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְהַקְרְבִין
  choice: செலுத்தி
  rationale: קרב என்பதன் இந்த வடிவம் பலியிடும் சூழலில் காணிக்கைகளை அர்ப்பணிப்பதைக் குறிக்கிறது. ‘செலுத்தி’ என்பது வழிபாட்டுச் சூழலுக்கு ஏற்ற, இயல்பான தமிழ் சொல்.
- source_word: נִיחוֹחִין
  choice: இனிய நறுமணம் எழுப்பும் பலிகள்
  rationale: இந்தச் சொல் ஏற்றுக்கொள்ளத்தக்க பலிகளின் இனிய அல்லது மனநிறைவளிக்கும் நறுமணத்தைக் குறிக்கிறது. தமிழில் வெறும் ‘நறுமணங்கள்’ என்று சொல்வது இயல்பற்றதாக இருப்பதால், பலியிடும் கருத்தையும் நறுமண உருவகத்தையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: பரலோகத்தின் தேவனுக்கு
  rationale: לְ இங்கு பலி செலுத்தப்படும் பெறுநரைக் குறிக்கிறது. ‘பரலோகத்தின் தேவன்’ என்ற பட்டம் எஸ்றா நூலிலுள்ள மூல வடிவத்தைத் தக்கவைக்கிறது.
- source_word: וּמְצַלַּיִן
  choice: வேண்டிக்கொள்ள
  rationale: இந்தப் பங்கேற்புவினை ஜெபிப்பதைக் குறிக்கிறது. அரசனுக்காகச் செய்யப்படும் ஜெபம் என்ற சூழலில் ‘வேண்டிக்கொள்ள’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְחַיֵּי
  choice: வாழ்வுக்காக
  rationale: சொல்லடியாக இது ‘வாழ்வு/உயிருக்காக’ என்று பொருள்படும். நலவாழ்வு அல்லது பாதுகாப்பு என்ற விரிவான பொருள் சாத்தியமானாலும், மூலத்தின் நேரடியான உருவைத் தக்கவைக்க ‘வாழ்வுக்காக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַלְכָּא
  choice: அரசன்
  rationale: இது பொதுவான ‘அரசன்’ என்ற அரமேயச் சொல். இங்கு பாரசீகப் பேரரசரைக் குறிப்பிட்டாலும், மூலத்தின் சொல் பயன்பாடு பாதுகாக்கப்படுகிறது.
- source_word: וּבְנוֹהִי
  choice: அவன் மகன்கள்
  rationale: மூலச்சொல் குறிப்பாக ஆண்பால் பன்மையைக் குறிக்கிறது; எனவே பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ஆலயப் பலிகளைக் குறிக்கும் נִיחוֹחִין என்ற வழிபாட்டுச் சொல்
  choice: ‘இனிய நறுமணம் எழுப்பும் பலிகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இனிய நறுமணங்கள்’ அல்லது ‘ஏற்றுக்கொள்ளத்தக்க பலிகள்’
  rationale: இது பலிகளின் நறுமண உருவகத்தை அழிக்காமல், தமிழில் பலி செலுத்துதல் என்ற செயலைத் தெளிவாகக் காட்டுகிறது. ‘ஏற்றுக்கொள்ளத்தக்க’ என்று மட்டும் கூறுவது மூலத்தின் நறுமணப் படிமத்தை இழக்கச் செய்யும்.
- issue: அரசனுடைய சந்ததியைக் குறிக்கும் ஆண்பால் சொல்
  choice: ‘அவன் மகன்கள்’ என்று குறிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவன் பிள்ளைகள்’
  rationale: மூல அரமேயச் சொல் ஆண்பால் பன்மையைத் தெளிவாகக் குறிக்கிறது; அதனைப் பொதுப்பாலாக்காமல் பாதுகாக்கிறது.
- issue: அரசனுக்கும் அவன் மகன்களுக்கும் செய்யப்படும் வேண்டுதலின் நோக்கம்
  choice: ‘வாழ்வுக்காக’ என்ற சொல்லடிக்கு நெருக்கமான வடிவம் பயன்படுத்தப்பட்டது.
  alternative: ‘நலனுக்காக’ அல்லது ‘நல்வாழ்வுக்காக’
  rationale: அரசரின் நலம் மற்றும் பாதுகாப்பு என்ற பொருள் சூழலில் சாத்தியமானது. ஆயினும் ‘வாழ்வு’ என்ற மூலச் சொல்லின் இறுக்கத்தையும் அதன் சாத்தியமான விரிவான பொருளையும் அடிக்குறிப்பின் மூலம் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அரசனுடையவும் அவன் மகன்களுடையவும்’ என்ற இணைப்பு மூலத்தில் இருவருக்கும் பொதுவாக நிற்கும் ‘வாழ்வு’ என்ற கருத்தைத் தெளிவாக இணைக்கிறது. நறுமண உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டு, அதன் பலிசார் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
