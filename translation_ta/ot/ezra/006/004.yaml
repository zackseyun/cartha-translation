  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: ta
  text: செப்பனிடப்பட்ட கற்களால் மூன்று அடுக்குகளும்[a], புதிய மரத்தால் ஓர் அடுக்கும் அமைக்கப்பட வேண்டும்; அதற்கான செலவு அரசனுடைய வீட்டிலிருந்து[b] கொடுக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செதுக்கப்பட்ட கற்களால் மூன்று வரிசைகளும்.”
    reason: lexical_alternative
  - marker: b
    text: “அரசனுடைய வீடு” என்பது இங்கு அரச கருவூலத்தையோ அரச நிதியையோ குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: அடுக்குகள் / அடுக்கு
  rationale: கட்டுமானத்தில் ஒன்றன்மேல் ஒன்றாக அமைக்கப்படும் வரிசைகள் அல்லது தளங்களை இச்சொல் குறிக்கிறது. பொதுவான நவீன தமிழில் ‘அடுக்கு’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘வரிசை’ என்ற கட்டடவியல் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶבֶן גְּלָל
  choice: செப்பனிடப்பட்ட கற்கள்
  rationale: சொல்லின் நேரடியான உருவகப் பொருள் உறுதியற்றதாக இருந்தாலும், இக்கட்டுமானச் சூழலில் வடிவமைத்துச் சீராக்கப்பட்ட கட்டுமானக் கற்களைக் குறிப்பதாகக் கொள்வது பொருத்தமானது. ‘செப்பனிடப்பட்ட’ என்பது வெட்டிச் சீராக்கப்பட்ட கற்களின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: תְּלָתָא
  choice: மூன்று
  rationale: முன்னுள்ள கட்டுமான அடுக்குகளின் எண்ணிக்கையைக் குறிக்கும் எண்.
- source_word: אָע חֲדַת
  choice: புதிய மரக்கட்டைகள்
  rationale: கட்டுமானச் சூழலில் אָע என்பது பொதுவாக மரம் என்பதைக் காட்டிலும் கட்டுமானத்துக்கான மரப்பொருளைக் குறிக்கிறது. ஆகவே ‘மரக்கட்டைகள்’ இயல்பாக உள்ளது; חֲדַת என்பதன் ‘புதிய’ என்ற பொருளும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: נִפְקְתָא
  choice: செலவு
  rationale: நிர்வாக ஆணையின் சூழலில் செலவினம் அல்லது ஆகும் தொகையைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: מִן בֵּית מַלְכָּא
  choice: அரசனுடைய வீட்டிலிருந்து
  rationale: அரமேய மொழியின் ‘அரசனின் வீட்டிலிருந்து’ என்ற வடிவைத் தக்கவைக்கிறது. சூழலில் இது அரச கருவூலத்தையோ அரச நிதியையோ குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது; முதன்மை உரை அந்த விளக்கத்தைத் தீர்மானமாக்கவில்லை.
- source_word: תִּתְיְהִב
  choice: கொடுக்கப்பட வேண்டும்
  rationale: செலவை அரச தரப்பிலிருந்து வழங்க வேண்டும் என்ற நிர்வாக ஆணையின் கட்டாய வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
