  register: நவீனத் தரத் தமிழில், அரச ஆணைக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கட்டுமானச் சொற்களிலுள்ள நுண்ணிய ஐயமும் ‘அரசனுடைய வீடு’ என்ற சொற்றொடரின் உருவகச் சாத்தியமும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
