  source_fidelity: 'மூல அரமேயத்தின் முக்கிய அம்சங்கள் சரியாக உள்ளன: பொன்-வெள்ளிப் பாத்திரங்கள், நேபுகாத்நேச்சார் எருசலேம் ஆலயத்திலிருந்து அவற்றை எடுத்துப் பாபிலோனுக்குக் கொண்டுசென்றது, அவற்றை மீட்டளித்து எருசலேமுக்கு அனுப்புதல், இறுதியில் நேரடியான ஒருமை கட்டளை ஆகியவை காக்கப்பட்டுள்ளன. ஆயினும், “திருப்பிக் கொடுக்கப்பட்டு ... கொண்டுவரப்படட்டும்” என்பது கட்டளைத் தொடரை வினையெச்சமாக்கி சற்றே தெளிவற்றதாக்குகிறது. இரு கட்டளை வடிவங்களாக அமைப்பது மூலத்தின் அரசாணைத் தன்மையைத் தெளிவாகத் தரும். கடினமான וִיהָךְ வடிவம் குறித்த ஐயம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.'
  naturalness: “திருப்பி அளிக்கப்படட்டும்; அவை ... கொண்டுவரப்படட்டும்” என்பது நவீன பொதுத்தரத் தமிழில் தெளிவான, கண்ணியமான அரசாணை நடை. “கடவுளுடைய வீடு” என்பது மூலத்தின் ‘house of God’ மற்றும் பின்னர் வரும் ‘temple’ என்ற வேறுபாட்டைத் தக்கவைக்கும் வகையில் வைத்திருக்கப்படுகிறது.
