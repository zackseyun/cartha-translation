base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: ta
  text: மேலும், நேபுகாத்நேச்சார் எருசலேமில் இருந்த ஆலயத்திலிருந்து எடுத்துப் பாபிலோனுக்குக் கொண்டுவந்த கடவுளுடைய வீட்டின் தங்கம் மற்றும் வெள்ளிப் பாத்திரங்கள் திருப்பி அளிக்கப்படட்டும்; அவை எருசலேமிலுள்ள ஆலயத்துக்கு, ஒவ்வொன்றும் அதனதன் இடத்திற்குக் கொண்டுவரப்படட்டும்[a]. அவற்றைக் கடவுளுடைய வீட்டில் வை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை மீண்டும் வைக்கப்படட்டும்; அவை எருசலேமிலுள்ள ஆலயத்துக்குச் சென்று, ஒவ்வொன்றும் அதனதன் இடத்துக்குச் செல்லட்டும்.” “கொண்டுவரப்படட்டும்/செல்லட்டும்” என்ற பகுதியின் அரமேயச் சொல்லமைப்பு ஓரளவு கடினமானது; ஆலயப் பாத்திரங்கள் எருசலேமிலுள்ள அவற்றின் உரிய இடங்களுக்கு மீட்டளிக்கப்பட வேண்டும் என்பதே கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: மேலும்
  rationale: கூடுதலான அரசாணைக் குறிப்பை அறிமுகப்படுத்தும் இணைப்பு மற்றும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מָאנֵי
  choice: பாத்திரங்கள்
  rationale: வழிபாட்டிலும் ஆலயப் பயன்பாட்டிலும் இருந்த பலவகைப் பொருட்களைச் சுட்டும் பரந்த, வழக்கமான சொல்.
- source_word: בֵית אֱלָהָא
  choice: கடவுளுடைய வீடு
  rationale: மூலத்தின் நேரடியான சொல்லாட்சியைப் பேணுவதோடு, இவ்வசனத்திலுள்ள הֵיכְלָא என்பதற்கான ‘ஆலயம்’ என்ற மொழிபெயர்ப்பிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: தங்கம் மற்றும் வெள்ளிப் பாத்திரங்கள்
  rationale: பாத்திரங்கள் செய்யப்பட்ட பொருளை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הַנְפֵּק
  choice: எடுத்த
  rationale: ஆலயத்திலிருந்து அவற்றை வெளியே கொண்டுபோன செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֵיכְלָא
  choice: ஆலயம்
  rationale: இச்சூழலில் எருசலேம் ஆலயத்தையே குறிக்கிறது; ‘கடவுளுடைய வீடு’ என்பதிலிருந்து மூலச் சொல் வேறுபாட்டைப் பேணுகிறது.
- source_word: וְהֵיבֵל
  choice: கொண்டுவந்த
  rationale: பாத்திரங்களைப் பாபிலோனுக்கு எடுத்துச் சென்ற நிகழ்வை இயல்பான கதைநடையில் தருகிறது.
- source_word: יַהֲתִיבוּן
  choice: திருப்பிக் கொடுக்கப்பட்டு
  rationale: அரசாணையில் உள்ள மீட்டளிக்கும் கட்டளையையும் செயல்படுவினைத் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: וִיהָךְ
  choice: கொண்டுவரப்படட்டும்
  rationale: சொல்லமைப்பு கடினமானதாயினும், எருசலேமிலுள்ள உரிய இடங்களுக்கு மீளக் கொண்டுசெல்லும் கட்டளையைச் சூழலுக்கு ஏற்றவாறு தருகிறது; ஐயத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: לְאַתְרֵהּ
  choice: ஒவ்வொன்றும் அதனதன் இடத்திற்கு
  rationale: ஒருமை உடைமை வடிவத்தின் பகிர்ந்தளிக்கும் பொருளைத் தமிழில் தெளிவாக்கி, ஒவ்வொரு பாத்திரத்திற்குமான உரிய இடத்தைச் சுட்டுகிறது.
- source_word: וְתַחֵת
  choice: அவற்றை ... வை
  rationale: இரண்டாம் நபர் ஒருமையில் ஓர் அதிகாரியிடம் நேரடியாகக் கூறப்படும் அரசாணைக் கட்டளையின் வலிமையைப் பேணுகிறது.
