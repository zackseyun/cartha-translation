  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: ta
  text: அப்போது, ஆற்றுக்கு அப்பாலுள்ள பகுதியின்[a] ஆளுநரான தத்தெனாய், சேத்தார்-போஸ்னாய், அவர்களுடைய கூட்டாளிகள் ஆகியோர், தரியு அரசன் அனுப்பியிருந்ததற்கு இணங்க, அப்படியே மிகத் துல்லியமாகச் செயல்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆற்றுக்கு அப்பாலுள்ள பகுதி’ என்பது யூபிராத்து ஆற்றுக்கு மேற்கேயிருந்த பிரதேசத்தைக் குறிக்கப் பாரசீக ஆட்சியில் பயன்படுத்தப்பட்ட நிர்வாகப் பெயர்.
    reason: cultural_note
  - marker: b
    text: ‘கவனமாகச் செய்தார்கள்’ அல்லது ‘முழுத் துல்லியத்துடன் நிறைவேற்றினார்கள்’ என்றும் மொழிபெயர்க்கலாம். அரசனுடைய அறிவுறுத்தலுக்குத் துல்லியமாக இணங்கி நடந்ததை அரமேயச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் அரமேயக் கதைத் தொடர்ச்சிச் சொல்; நவீன தமிழில் இயல்பான வரிசைத் தொடர்பை அளிக்கிறது.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதியின் ஆளுநர்
  rationale: פַּחַת என்பது மாகாண ஆளுநரைக் குறிக்கிறது; עֲבַר נַהֲרָה என்பது பாரசீக நிர்வாகப் பார்வையில் யூபிராத்து ஆற்றுக்கு மேற்கேயிருந்த பிரதேசத்துக்கான பெயர். மூலத்தின் தலைப்புப்போன்ற புவியியல் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: שְׁתַר בּוֹזְנַי
  choice: சேத்தார்-போஸ்னாய்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்புக்குறி பெயரின் இரு கூறுகளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּכְנָוָתְהוֹן
  choice: அவர்களுடைய கூட்டாளிகள்
  rationale: அவர்களோடு அதிகாரபூர்வமாக இணைந்து செயல்பட்டவர்களைச் சூழல் குறிக்கிறது; பொதுவான ‘தோழர்கள்’ என்பதைவிட ‘கூட்டாளிகள்’ நிர்வாகச் சூழலுக்கு ஏற்றது.
- source_word: לָקֳבֵל דִּי
  choice: அனுப்பியிருந்ததற்கு இணங்க
  rationale: அரசனிடமிருந்து வந்தவற்றுக்கு ஒத்திசைந்து அல்லது அதன்படி செயல்பட்டதைக் குறிக்கும் மரபுத்தொடர்; தமிழில் கீழ்ப்படிதலையும் இணக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלַח
  choice: அனுப்பியிருந்த
  rationale: வினையின் நேரடிப் பொருள் ‘அனுப்பினான்’. கட்டளை முன்பே அனுப்பப்பட்டு, பின்னர் அவர்கள் செயல்பட்ட நிகழ்வுவரிசையை ‘அனுப்பியிருந்த’ தெளிவாக்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டளை’ என்ற பெயர்ச்சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: அப்படியே மிகத் துல்லியமாக
  rationale: இந்த இணைந்த வினையடைச் சொற்றொடர் அரசனுடைய அறிவுறுத்தலைக் கவனமாகவும் சரியாகவும் நிறைவேற்றியதை வலியுறுத்துகிறது. ‘அப்படியே மிகத் துல்லியமாக’ என்பது conformity மற்றும் careful exactness ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: עֲבַדוּ
  choice: செயல்பட்டார்கள்
  rationale: பொதுவாக ‘செய்தார்கள்’ எனப் பொருள்படும் வினை; இங்கு அனுப்பப்பட்ட அரச ஆணைக்கு ஏற்ப நடந்துகொண்டதைக் குறிக்கும் இயல்பான தமிழாக்கம். மூலத்தில் சொல்லப்படாத நேரடிச் செயப்படுபொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
