  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: ta
  text: நாடுகடத்தப்பட்டவர்கள்[a] முதல் மாதத்தின் பதினான்காம் நாளில் பஸ்காவைக் கொண்டாடினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, ‘நாடுகடத்தலின் மகன்கள்.’ இது நாடுகடத்தப்பட்ட சமூகத்தைச் சேர்ந்தவர்களைக் கூட்டாகக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: கொண்டாடினார்கள்
  rationale: ‘செய்தார்கள்’ என்பது சொல்லடியாக இருந்தாலும், פֶּסַח என்பதுடன் வரும் போது சடங்கை அனுசரித்தல் அல்லது விழாவைக் கொண்டாடுதல் என்பதே பொருள். நவீன தமிழில் ‘பஸ்காவைக் கொண்டாடினார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְנֵי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டவர்களின் சந்ததியினர்
  rationale: எபிரெய மொழிமரபின் சொல்லடிப் பொருள் ‘நாடுகடத்தலின் மகன்கள்.’ இங்கு அது நாடுகடத்தப்பட்ட சமூகத்தைச் சேர்ந்தவர்களை கூட்டாகக் குறிக்கிறது. ‘சந்ததியினர்’ என்பது பாலின வரம்பின்றி அந்த வரலாற்றுச் சமூக அடையாளத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: இது பஸ்கா அனுசரிப்பை விரிவாகக் குறிக்கிறது; பலி, உணவு அல்லது விழா என்று ஒன்றை மட்டும் குறிப்பாகச் சுருக்காமல் நிலையான வேதாகமப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְאַרְבָּעָה עָשָׂר
  choice: பதினான்காம் நாளில்
  rationale: எபிரெய தேதி அமைப்பில் ‘பதினான்கு’ என்று மட்டும் உள்ளது; தெளிவான தமிழ் நாட்காட்டி நடைக்காக ‘நாள்’ சேர்க்கப்படுகிறது.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்தின்
  rationale: தேதி அமைப்பை நெருக்கமாகவும் இயல்பாகவும் காட்டும் தமிழ் வடிவம்.
