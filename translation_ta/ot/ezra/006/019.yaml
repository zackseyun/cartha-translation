translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய கூட்டுப்பெயர் மொழிமரபின் பொருளை முதன்மை உரையில் இயல்பாகக் கொடுத்து, அதன் சொல்லடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
