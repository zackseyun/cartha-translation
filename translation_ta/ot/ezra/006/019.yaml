revisions:
- from: நாடுகடத்தப்பட்டவர்களின் சந்ததியினர்[a] முதலாம் மாதத்தின் பதினான்காம் நாளில் பஸ்காவைக் கொண்டாடினார்கள்.
  to: நாடுகடத்தப்பட்டவர்கள்[a] முதல் மாதத்தின் பதினான்காம் நாளில் பஸ்காவைக் கொண்டாடினர்.
  rationale: The revision removes the unsupported implication that the referents are descendants, while retaining the collective sense of the Hebrew idiom in natural Tamil. It also uses the more standard modern date expression. The footnote preserves the literal wording and explains its corporate force.
