base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: ta
  text: அவர்கள் இறைவனுடைய இந்த ஆலயத்தின் அர்ப்பணிப்பு விழாவுக்காக நூறு காளைகளையும், இருநூறு செம்மறியாட்டுக் கடாக்களையும், நானூறு செம்மறியாட்டுக் குட்டிகளையும், இஸ்ரயேல் முழுவதற்காக[a] பாவநிவாரணப் பலியாக[b] பன்னிரண்டு வெள்ளாட்டுக் கடாக்களையும்—இஸ்ரயேல் கோத்திரங்களின் எண்ணிக்கையின்படி—பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இஸ்ரயேல் முழுவதன் சார்பாகவும் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பாவநிவாரணப் பலி’ என்பதைக் ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: பலியிட்டார்கள்
  rationale: הקרב என்னும் காரணவினை வழிபாட்டுச் சூழலில் பலிக்காக விலங்குகளைச் செலுத்துவதைக் குறிக்கிறது; தமிழில் ‘பலியிட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַחֲנֻכַּת
  choice: அர்ப்பணிப்பு விழாவுக்காக
  rationale: חנכה ஓர் இடத்தைத் தொடக்கமாக அர்ப்பணிக்கும் நிகழ்வைக் குறிக்கிறது. ‘அர்ப்பணிப்பு விழா’ அதன் சடங்கு மற்றும் தொடக்க நிகழ்வு ஆகிய இரு அம்சங்களையும் வெளிப்படுத்துகிறது.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: இறைவனுடைய இந்த ஆலயம்
  rationale: மூலத்தின் ‘இறைவனுடைய இந்த வீடு’ என்ற சொல்லமைப்பை, தமிழில் வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் இயல்பான ‘ஆலயம்’ என்று வழங்குகிறது.
- source_word: תּוֹרִין
  choice: காளைகள்
  rationale: பலிப்பட்டியலில் வரும் ஆண் மாடுகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: דִּכְרִין
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: ஆண் செம்மறியாடுகள் என்பதைக் குழப்பமின்றித் துல்லியமாகக் குறிக்கிறது.
- source_word: אִמְּרִין
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: இச்சொல் இளம் செம்மறியாடுகளைக் குறிக்கிறது; ‘குட்டிகள்’ என்பதுடன் விலங்கு வகையையும் வெளிப்படையாகச் சொல்வது தமிழில் தெளிவளிக்கிறது.
- source_word: וּצְפִירֵי עִזִּין
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: ஆண் வெள்ளாடுகளைக் குறிக்கும் மூலச் சொற்றொடரின் பாலினத்தையும் விலங்கு வகையையும் பாதுகாக்கிறது.
- source_word: לחטיא
  choice: பாவநிவாரணப் பலியாக
  rationale: இது பாவம் அல்லது தூய்மையாக்குதல் தொடர்பான பலிக்குரிய தொழில்நுட்பச் சொல். தமிழ் வேதாகமப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்க ‘பாவநிவாரணப் பலி’ என்பதைத் தேர்ந்தெடுத்து, மாற்று நுண்பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரயேல் முழுவதற்காக
  rationale: עַל இங்கு பயன் அல்லது பிரதிநிதித்துவத்தைக் குறிக்கலாம். ‘முழுவதற்காக’ என்பது இஸ்ரயேலின் மொத்த அளவைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் கோத்திரங்களின் எண்ணிக்கையின்படி
  rationale: பன்னிரண்டு வெள்ளாட்டுக் கடாக்கள் செலுத்தப்பட்டதற்கான எண்ணிக்கை சார்ந்த விளக்கத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நாடுகடத்தலுக்குப் பிந்தைய சூழலில் ‘இஸ்ரயேல் முழுவதும்’ என்பதன் வரம்பு
  choice: திரும்பிவந்தவர்களுக்கு மட்டும் என்று குறுக்காமல் ‘இஸ்ரயேல் முழுவதற்காக’ என்று வைத்தல்
  alternative: திரும்பிவந்த நாடுகடத்தப்பட்டோர் அனைவருக்காக
  rationale: மூலம் வெளிப்படையாக ‘இஸ்ரயேல் முழுவதும்’ என்று கூறி, உடனே பன்னிரண்டு கோத்திரங்களின் எண்ணிக்கையோடு இதை இணைக்கிறது. மொழிபெயர்ப்பு இந்தக் கூட்டுப்பரப்பை அப்படியே வைத்திருக்கிறது; அது வரலாற்றில் எவ்வாறு பிரதிநிதித்துவம் பெற்றது என்பதைத் தீர்மானிக்கவில்லை.
- issue: חטיא என்பதன் பலியியல் நுண்பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இந்தச் சொல் பாவத்திற்கான பலி என்றும் தூய்மைப்படுத்தும் பலி என்றும் புரிந்துகொள்ளப்படலாம். பிரதான உரையில் பழக்கமான பெயரைப் பயன்படுத்தி, நுண்பொருள் வேறுபாட்டை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. விலங்குகளின் வகையும் பாலினமும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன. நீண்ட பட்டியல் வாசிக்க எளிதாக இருக்க, பன்னிரண்டு என்ற எண்ணுக்கும் கோத்திரங்களின் எண்ணிக்கைக்கும் உள்ள தொடர்பு இடைக்கோடுகளால் வெளிப்படுத்தப்பட்டுள்ளது.
