  source_fidelity: 'மூல அரமேயத்தின் கட்டளைத் தொனி நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: ஆலயப் பணியில் தலையிடுவதை நிறுத்துமாறு கூறி, யூதர்களின் ஆளுநரும் மூப்பர்களும் ஆலயத்தை அதன் தலத்தில் கட்டுவதற்கு அனுமதிக்கிறது. “மீண்டும் கட்டட்டும்” என்பது இச்சூழலின் மறுகட்டுமானப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் பொருளை மாற்றுவதில்லை.'
