  text: שְׁבֻ֕קוּ לַ/עֲבִידַ֖ת בֵּית אֱלָהָ֣/א דֵ֑ךְ פַּחַ֤ת יְהוּדָיֵ/א֙ וּ/לְ/שָׂבֵ֣י יְהוּדָיֵ֔/א בֵּית אֱלָהָ֥/א דֵ֖ךְ יִבְנ֥וֹן עַל אַתְרֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: ta
  text: இந்த இறைவனுடைய ஆலயப் பணியில் தலையிடாதீர்கள்.[a] யூதர்களின் ஆளுநரும் யூதர்களின் மூப்பர்களும் இந்த இறைவனுடைய ஆலயத்தை அதன் இடத்திலேயே மீண்டும் கட்டட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதர்கள்’ என்பதற்குப் பதிலாக ‘யூதா நாட்டினர்’ என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் யூதா மக்களை இன அடையாளத்திலோ பிரதேச அடையாளத்திலோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: பணியில் தலையிடாதீர்கள்
  rationale: שבק என்பதன் பன்மை ஏவல் வடிவம் இச்சூழலில் பணியை விட்டுவிடுவது மட்டுமல்ல, அதில் குறுக்கிடுவதை நிறுத்துமாறு ஆணையிடுகிறது. இயல்பான நவீனத் தமிழில் இந்தக் கட்டளை வலிமையை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: இந்த இறைவனுடைய ஆலயம்
  rationale: דֵךְ குறிப்பிடப்பட்டுள்ள குறிப்பிட்ட ஆலயத்தைச் சுட்டுகிறது. கட்டுமானச் சூழலில் בֵּית என்பதற்கு வெறும் ‘வீடு’ என்பதைக் காட்டிலும் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פַּחַת
  choice: ஆளுநர்
  rationale: மாகாண நிர்வாக அதிகாரியைக் குறிக்கும் சொல்லுக்கு ‘ஆளுநர்’ தெளிவான, பொதுவான இணைச்சொல்.
- source_word: יְהוּדָיֵא
  choice: யூதர்கள்
  rationale: இச்சொல் யூத மக்களையோ யூதா பிரதேசத்தவர்களையோ குறிக்கலாம். முதன்மை உரையில் வழக்கமாகப் புரிந்துகொள்ளப்படும் ‘யூதர்கள்’ வைக்கப்பட்டு, பிரதேச அடையாளம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: யூதர்களின் மூப்பர்கள்
  rationale: שָׂבֵי சமூகத்தின் மூத்த தலைவர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ அதன் நிர்வாக மற்றும் சமூகத் தலைமைப் பொருளைத் தக்கவைக்கிறது.
- source_word: יִבְנוֹן
  choice: மீண்டும் கட்டட்டும்
  rationale: அரசாணை நடையில் இக்குறையெச்ச வடிவம் அனுமதி அல்லது கட்டளை சார்ந்த விருப்பப் பொருளைக் கொண்டுள்ளது. ஆலயத்தைப் புதுப்பித்துக் கட்டும் சூழலை ‘மீண்டும்’ தெளிவாக்குகிறது.
- source_word: עַל אַתְרֵהּ
  choice: அதன் இடத்திலேயே
  rationale: அதே தலத்தில் கட்ட வேண்டும் என்ற இடவியல் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
