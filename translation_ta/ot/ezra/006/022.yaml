base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: ta
  text: அவர்கள் புளிப்பில்லா அப்பப் பண்டிகையை ஏழு நாட்கள் மகிழ்ச்சியுடன் கொண்டாடினார்கள். ஏனெனில், யாவே அவர்களை மகிழச் செய்து, இஸ்ரவேலின் கடவுளாகிய கடவுளின் ஆலயப் பணியில் அவர்களுடைய கைகளைப் பலப்படுத்துவதற்காக அசீரிய அரசனின்[a] மனதை அவர்கள்பால் திருப்பியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல எபிரெயம், “அசீரிய அரசன்” என்று கூறுகிறது. எஸ்றாவின் காலத்தில் ஆட்சியாளர் பெர்சிய அரசராக இருந்தார். இந்தப் பழைய அரசப் பெயரிடுதல் பெர்சிய ஆட்சியாளரைக் குறிக்கலாம்; அதன் துல்லியமான காரணம் உறுதியானதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: கொண்டாடினார்கள்
  rationale: ஒரு பண்டிகையுடன் வரும் עשה, அதைச் ‘செய்தார்கள்’ என்பதற்குப் பதிலாகக் ‘கொண்டாடினார்கள்/கடைப்பிடித்தார்கள்’ என்ற பொருளைத் தருகிறது; இங்கு இயல்பான தமிழ் ‘கொண்டாடினார்கள்’.
- source_word: חַג מַצּוֹת
  choice: புளிப்பில்லா அப்பப் பண்டிகை
  rationale: இஸ்ரவேலின் குறிப்பிட்ட பண்டிகைப் பெயரைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: எபிரெய முன்னிடைச்சொல் தொடரின் வினையடைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׂמְּחָם
  choice: அவர்களை மகிழச் செய்து
  rationale: 'பியேல் வினையின் காரணவினைப் பொருளைத் தக்கவைக்கிறது: யாவே அவர்களை மகிழும்படி செய்தார்.'
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பெயரொலியைத் தமிழில் தருகிறது.
- source_word: וְהֵסֵב לֵב
  choice: மனதை … திருப்பியிருந்தார்
  rationale: அரசனின் உள்ளார்ந்த மனப்பாங்கு அவர்கள்பால் திருப்பப்பட்டதை நெருக்கமாகக் காட்டுகிறது; ‘சாதகமாக்கினார்’ என்று விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: வரலாற்றுச் சூழலை ஒத்திசைப்பதற்காக ‘பெர்சிய அரசன்’ என்று மாற்றாமல், எபிரெய உரையின் பெயரிடுதலைத் தக்கவைக்கிறது.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: அவர்களுடைய கைகளைப் பலப்படுத்தும்படி
  rationale: உதவியும் வலிமையும் அளித்தல் என்னும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயப் பணியில்
  rationale: ‘கடவுளின் வீட்டுப் பணி’ என்ற சொற்சொல் அமைப்பைவிட இயல்பாக, ஆலயத்தைச் சார்ந்த பணியைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதைப் பெயரொலியாகப் பாதுகாக்கிறது.
- issue: பெர்சியக் காலச் சூழலில் ‘அசீரிய அரசன்’ என்ற வரலாற்றுப் பெயரிடுதல்
  choice: முதன்மை உரையில் ‘அசீரிய அரசன்’ என்பதையே தக்கவைத்தல்
  alternative: பெர்சிய அரசன்
  rationale: மூல எபிரெயம் வெளிப்படையாக ‘அசீரிய அரசன்’ என்று கூறுகிறது. வரலாற்றை ஒத்திசைக்க உரையை மாற்றாமல், தேவையான விளக்கத்தை அடிக்குறிப்பில் தருவது மூலத்திற்கு உண்மையாகும்.
- issue: ‘மனதைத் திருப்புதல்’ என்பதன் பொருள்
  choice: உருவகத்தைத் தக்கவைத்து ‘மனதை அவர்கள்பால் திருப்பினார்’
  alternative: அவர்களுக்கு ஆதரவாக இருக்கச் செய்தார்
  rationale: அரசனின் ஆதரவு சூழலில் உட்கிடந்தாலும், எபிரெய உருவகம் மனப்பாங்கின் திருப்பத்தை மட்டும் நேரடியாகச் சொல்கிறது; விளக்கப் பொருளை உரையில் மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் உள்ள நடை. எபிரெய உருவகங்களான ‘மனதைத் திருப்புதல்’, ‘கைகளைப் பலப்படுத்துதல்’ ஆகியவை புரியத்தக்க தமிழில் பாதுகாக்கப்பட்டுள்ளன. இறுதியிலுள்ள ‘இஸ்ரவேலின் கடவுள்’ என்ற இணைப்புரை, மூலத்தின் கடவுள் குறித்த மறுபெயரிடுதலைத் தெளிவாகவும் இயல்பாகவும் தர நீண்ட கோட்டுக்குப் பின் வைக்கப்பட்டுள்ளது.
