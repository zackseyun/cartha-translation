base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: ta
  text: மேலும், வானத்தின் தேவனுக்குச் செலுத்தும் தகனபலிகளுக்குத் தேவையான இளங்காளைகள், ஆட்டுக்கடாக்கள், செம்மறியாட்டுக் குட்டிகள் ஆகியவற்றையும், கோதுமை, உப்பு, திராட்சரசம், எண்ணெய் ஆகியவற்றையும் எருசலேமிலுள்ள ஆசாரியர்கள் சொல்கிறபடி[a], நாள்தோறும் தவறாமல்[b] அவர்களுக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “எருசலேமிலுள்ள ஆசாரியர்களின் வார்த்தையின்படி”; இதை “ஆசாரியர்களின் அறிவுறுத்தலின்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எந்தக் குறைவும் ஏற்படாதபடி.” நாள்தோறும் வழங்க வேண்டிய பொருட்கள் விடுபடவோ வழங்கல் நின்றுபோகவோ கூடாது என்பதை இறுதித் தொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: தேவையான
  rationale: ‘எது தேவையோ’ என்ற திறந்த பொருளை இயல்பான நிர்வாக நடையில் ‘தேவையான’ என்று வழங்குகிறது; அடுத்துவரும் பொருட்களின் பட்டியலை இது தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: בְנֵי תוֹרִין
  choice: இளங்காளைகள்
  rationale: சொல்லர்த்தமாக ‘காளைகளின் மகன்கள்’; பலிக்குத் தகுந்த இளம் காளைகளைச் சுட்டும் அரமேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: דִכְרִין
  choice: ஆட்டுக்கடாக்கள்
  rationale: ஆண் செம்மறியாடுகளைக் குறிக்கும் பலியியல் சொல்லைத் துல்லியமாக வழங்குகிறது.
- source_word: אִמְּרִין
  choice: செம்மறியாட்டுக் குட்டிகள்
