- source_word: לַעֲלָוָן
  choice: தகனபலிகளுக்கு
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலிகளைக் குறிக்கும் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல்.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: வானத்தின் தேவனுக்கு
  rationale: எஸ்றாவின் அரமேயப் பகுதிகளில் வரும் தெய்வீகப் பட்டத்தை அதன் இயல்பான உறவுநிலையுடன் பாதுகாக்கிறது.
- source_word: חִנְטִין
  choice: கோதுமை
