- source_word: יוֹם בְּיוֹם דִּי לָא שָׁלוּ
  choice: நாள்தோறும் தவறாமல்
  rationale: ஒவ்வொரு நாளும் வழங்கல் விடுபடவோ நின்றுபோகவோ கூடாது என்ற நிர்வாகக் கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘வானத்தின் தேவன்’ என்ற பட்டம்
  choice: வானத்தின் தேவன்
  alternative: வானங்களின் தேவன்
  rationale: அரமேயச் சொல்லின் வடிவத்தை இயந்திரமாகப் பன்மையாக்காமல், தமிழில் நிலைபெற்ற தெய்வீகப் பட்டத்தைப் பயன்படுத்துகிறது; எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசாணைக்குரிய கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. பலியியல் சொற்கள் சாதாரண வாசகருக்குப் புரியுமாறு துல்லியமாக வைக்கப்பட்டுள்ளன. பட்டியலின் நீளத்தைத் தெளிவாக்க ‘ஆகியவற்றையும்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பொருள்சார் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
