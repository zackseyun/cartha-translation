  rationale: பலிக்கான பொருட்கள் வழங்கப்படும் சூழலில் மதுவகையைத் தெளிவாகவும் வழக்கமான வேதாகம நடையிலும் குறிக்கிறது.
- source_word: וּמְשַׁח
  choice: எண்ணெய்
  rationale: மூலத்தில் எண்ணெயின் வகை தனியாகக் குறிப்பிடப்படாததால் ‘ஒலிவ எண்ணெய்’ என்று மிகைப்படுத்தாமல் பொதுப்பெயர் வைக்கப்பட்டது.
- source_word: כְּמֵאמַר
  choice: சொல்கிறபடி
