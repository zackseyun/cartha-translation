base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: ta
  text: அப்போது தரியு அரசன் ஓர் ஆணை பிறப்பித்தான்[a]; பாபிலோனில் பொக்கிஷங்கள் சேமித்து வைக்கப்பட்டிருந்த ஆவணக் காப்பகத்தில்[b][c] அவர்கள் தேடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘தரியு அரசன் ஓர் ஆணையை வைத்தான்.’ தொடர்ந்து வரும் அரமேய வினைச்சொல் மூன்றாம் நபர் பன்மையில் (‘அவர்கள் தேடினார்கள்’) உள்ளது; அது ‘தேடப்பட்டது’ என்ற ஆளற்ற பொருளிலும் செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘ஆவணக் காப்பகம்’ என்பது சொல்லுக்குச் சொல் ‘நூல்கள்/ஆவணங்களின் இல்லம்’; இது அரசின் அதிகாரப்பூர்வப் பதிவுகள் வைக்கப்பட்ட இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘பொக்கிஷங்கள்’ என்பதை இன்னும் பரந்த பொருளில், காப்பக வளாகத்தில் சேமிக்கப்பட்ட மதிப்புள்ள பொருட்கள் அல்லது வைப்புகள் என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் அரமேயக் கதைத் தொடர் இணைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: தரியு அரசன்
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, அரச பட்டத்தை மூலத்தின் வரிசைக்கு நெருக்கமாகவும் தமிழுக்கு இயல்பாகவும் தருகிறது.
- source_word: שָׂם טְעֵם
  choice: ஓர் ஆணை பிறப்பித்தான்
  rationale: சொல்லுக்குச் சொல் ‘ஆணையை வைத்தான்’ என்பதாக இருந்தாலும், அரச நிர்வாகச் சூழலில் ‘ஆணை பிறப்பித்தான்’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבַקַּרוּ
  choice: அவர்கள் தேடினார்கள்
  rationale: மூலத்திலுள்ள மூன்றாம் நபர் பன்மைச் செயப்பாட்டு வடிவத்தைப் பேணுகிறது; அது சூழலில் பெயர் குறிப்பிடப்படாத அதிகாரிகளைக் குறிக்கலாம்.
- source_word: בְּבֵית סִפְרַיָּא
  choice: ஆவணக் காப்பகத்தில்
  rationale: சொல்லுக்குச் சொல் ‘நூல்கள்/ஆவணங்களின் இல்லத்தில்’; அரச ஆவணங்கள் வைக்கப்பட்ட பதிவகத்தைக் குறிக்கும் பொருளை நவீன வாசகருக்குத் தெளிவாக அளிக்கிறது.
- source_word: גִנְזַיָּא
  choice: பொக்கிஷங்கள்
  rationale: சேமித்து வைக்கப்பட்ட செல்வங்கள் அல்லது மதிப்புள்ள பொருட்கள் என்ற அடிப்படைப் பொருளைப் பேணுகிறது; இச்சூழலில் இது பரந்த பொருளில் களஞ்சியப் பொருட்களையும் குறிக்கலாம்.
- source_word: מְהַחֲתִין
  choice: சேமித்து வைக்கப்பட்டிருந்த
  rationale: பொருட்கள் அங்கே வைக்கப்பட்டு நிலைத்திருந்ததைக் குறிக்கும் மூலத்தின் விளைவு/நிலைப் பொருளுள்ள வடிவத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תַּמָּה בְּבָבֶל
  choice: பாபிலோனில்
  rationale: ‘அங்கே, பாபிலோனில்’ என்ற இடச்சுட்டை தமிழில் தேவையற்ற இரட்டிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது.
