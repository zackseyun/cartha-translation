  text: כִּ֗י בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן ה֣וּא יְסֻ֔ד הַֽ/מַּעֲלָ֖ה מִ/בָּבֶ֑ל וּ/בְ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֗י בָּ֚א אֶל יְר֣וּשָׁלִַ֔ם כְּ/יַד אֱלֹהָ֖י/ו הַ/טּוֹבָ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: ta
  text: முதலாம் மாதத்தின் முதல் நாளில் அவன் பாபிலோனிலிருந்து மேலே செல்லும் பயணத்தைத் தொடங்கினான்; ஐந்தாம் மாதத்தின் முதல் நாளில், அவன்மேல் இருந்த அவனுடைய கடவுளின் நற்கரத்தின் துணையால், அவன் எருசலேமுக்கு வந்து சேர்ந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: எருசலேமுக்குப் புறப்பட்டான்
  rationale: இந்த அரிதான சொற்றொடர் பயணத்தைத் தொடங்குதல் அல்லது ஏற்பாடு செய்தல் என்ற பொருளைத் தருகிறது. சூழலில் ‘பாபிலோனிலிருந்து மேலே செல்லும் பயணத்தைத் தொடங்கினான்’ என்பதே நோக்கம்; தமிழில் இயல்பாகவும் இலக்கைத் தெளிவாகவும் சொல்ல ‘எருசலேமுக்குப் புறப்பட்டான்’ என வழங்கப்பட்டது.
- source_word: כְיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: அவனுடைய கடவுளின் நல்ல கை அவன்மேல் இருந்ததால்
  rationale: ‘கை’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, கடவுளின் அருளான உதவியும் வழிநடத்தலும் பயணம் வெற்றியடைந்ததற்கான காரணம் என்பதை ‘இருந்ததால்’ வெளிப்படுத்துகிறது.
- source_word: הַמַּעֲלָה
  choice: எருசலேமுக்குப் பயணம்
  rationale: எருசலேமுக்குச் செல்வதை ‘மேலே செல்லுதல்’ எனக் கூறும் எபிரெய வழக்கின் கருத்தை இலக்குச் சூழலுக்கேற்ற இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கடவுளின் ‘நல்ல கை’
  choice: உருவகத்தை அப்படியே பாதுகாத்தல்
  alternative: கடவுளின் அருள்/உதவி அவனோடு இருந்ததால்
  rationale: மூலத்தின் உடல்-உருவகம் கடவுளின் செயற்படும் அருளையும் பாதுகாப்பையும் சுட்டுகிறது; அதை விளக்கச் சொல்லால் மாற்றாமல் பாதுகாப்பது உரையின் தனித்துவத்தையும் 7:6, 7:28 போன்ற இடங்களுடனான தொடர்பையும் நிலைநிறுத்துகிறது.
- issue: כְּ முன்னொட்டின் உறவு
  choice: காரண உறவாக ‘இருந்ததால்’
  alternative: ‘அவன்மேல் இருந்த நல்ல கையின்படி’ என்ற முறையியல் சார்ந்த மொழிபெயர்ப்பு
  rationale: இங்கு கடவுளின் நல்ல கை அவன்மேல் இருந்ததே அவன் வந்து சேர்ந்ததற்கான காரணம்/அடிப்படை எனச் சூழல் காட்டுகிறது. இது எந்தத் தனிப்பிரிவுச் சிறப்புக் கோட்பாட்டையும் சேர்க்காது.
translation_notes:
  register: நவீன தரமான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அதே நேரத்தில் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. வசனத்தின் காலவரிசை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; ‘நல்ல கை’ என்ற முக்கிய எபிரெய உருவகம் விடப்படவில்லை.
