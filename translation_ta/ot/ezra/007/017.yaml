base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: ta
  text: ஆகையால், இந்த வெள்ளியைக்[b] கொண்டு காளைகளையும், செம்மறியாட்டுக் கடாக்களையும், செம்மறியாட்டுக் குட்டிகளையும், அவற்றிற்குரிய தானியக் காணிக்கைகளையும் பானக் காணிக்கைகளையும் மிகுந்த கவனத்துடன்[a] வாங்கி, எருசலேமிலுள்ள உங்கள் கடவுளுடைய இல்லத்தின்[c] பலிபீடத்தின்மேல் அவற்றைச் சமர்ப்பிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகுந்த கவனத்துடன்” என்பதற்கு “துல்லியமாக” அல்லது “முழு அக்கறையுடன்” என்றும் மொழிபெயர்க்கலாம்; அரமேயச் சொல் கட்டளையைச் சரியாக நிறைவேற்றுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “வெள்ளி” பணமாகப் பயன்படுத்தப்படுவதைக் குறிக்கலாம்; மூலத்தில் நேரடியாக “வெள்ளி” என்றே உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, “உங்கள் கடவுளுடைய ஆலயம்”; மூலத்தில் நேரடியாக “உங்கள் கடவுளுடைய இல்லம்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: ஆகையால்
  rationale: காரணத்திலிருந்து வரும் முடிவைக் குறிக்கும் அரமேய மரபுத்தொடரின் தொடர்பாற்றலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אָסְפַּרְנָא
  choice: மிகுந்த கவனத்துடன்
  rationale: கட்டளையை அக்கறையுடனும் துல்லியமாகவும் நிறைவேற்ற வேண்டிய வலியுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் வேகத்தைக் குறிக்கவில்லை.
- source_word: תִקְנֵא
  choice: வாங்கி
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வாங்குதல்’; அடுத்துவரும் பலியிடும் செயலுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בְּכַסְפָּא דְנָה
  choice: இந்த வெள்ளியைக் கொண்டு
  rationale: நிர்வாகச் சூழலில் இது பணத்தைக் குறித்தாலும், மூலத்தின் நேரடியான ‘வெள்ளி’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תּוֹרִין
  choice: காளைகள்
  rationale: பலியிடப்படும் ஆண் மாடுகளைக் குறிக்கும் பொருத்தமான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: דִּכְרִין
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: ஆண் செம்மறியாடுகள் என்ற குறிப்பான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִמְּרִין
  choice: ஆட்டுக்குட்டிகள்
  rationale: பலிச் சூழலில் இளம் ஆடுகளைக் குறிக்கும் இயல்பான தமிழ் இணை.
- source_word: מִנְחָתְהוֹן
  choice: அவற்றிற்குரிய தானியக் காணிக்கைகள்
  rationale: இங்கு மிருகபலிகளுடன் சேர்க்கப்படும் தானியக் காணிக்கைகளைக் குறிக்கிறது; உருபிலுள்ள ‘அவற்றின்’ தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: נִסְכֵּיהוֹן
  choice: பானக் காணிக்கைகள்
  rationale: ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கும் வழிபாட்டுச் சொல்லை வாசகருக்கு எளிதில் புரியும் வகையில் தருகிறது.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: அவற்றைப் பலியிட வேண்டும்
  rationale: வினையின் நேரடிப் பொருள் ‘அருகே கொண்டுவருதல்/சமர்ப்பித்தல்’; பலிபீடச் சூழலில் அதன் சடங்குசார் பொருளை ‘பலியிடுதல்’ தெளிவாகத் தருகிறது.
- source_word: עַל מַדְבְּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: בֵּית אֱלָהֲכֹם
  choice: உங்கள் கடவுளுடைய இல்லம்
  rationale: இது ஆலயத்தைக் குறித்தாலும், மூலத்திலுள்ள ‘வீடு/இல்லம்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய இல்லம்’ என்பதன் குறிப்பு
  choice: இல்லம்
  alternative: ஆலயம்
  rationale: குறிப்பிடப்படுவது எருசலேம் ஆலயமே; எனினும் மூலத்தில் உள்ள ‘இல்லம்’ என்ற வெளிப்பாட்டை உரையில் வைத்துப் பொருளை அடிக்குறிப்பில் விளக்குவது மூல உருவகத்தையும் தெளிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அரசாணை நடையைப் பேணுகிறது. ஒருமை ஆணை வினை (‘வாங்கி… பலியிட வேண்டும்’) மற்றும் மூலத்திலுள்ள பன்மை உடைமை (‘உங்கள் கடவுள்’) இரண்டும் வேறுபாடின்றி பாதுகாக்கப்பட்டுள்ளன. வழிபாட்டுச் சொற்கள் பொதுவாசகர்களுக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன.
