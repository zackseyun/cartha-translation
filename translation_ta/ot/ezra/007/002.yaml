lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் வரும் எபிரெயக் கட்டமைப்புச் சொல்லான בֶּן என்பதற்கு இயல்பான நேரடி இணை ‘மகன்’. சுருக்கப்பட்ட வம்சப் பட்டியல்களில் இது சில நேரங்களில் தொலைவான வழித்தோன்றலையும் குறிக்கலாம்; இருப்பினும் இவ்வசனத்தின் உடனடிச் சூழல் நேரடி வம்சவழிச் சூத்திரத்தை மாற்ற வேண்டிய கட்டாயத்தை அளிக்கவில்லை.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைப் பாதுகாக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: צָדוֹק
  choice: சாதோக்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் அதன் மூல ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲחִיטוּב
  choice: அகித்தூப்
  rationale: எபிரெயத் தனிப்பெயர் பொருள் மொழிபெயர்ப்பாக அல்லாமல், மூல உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
