translation_notes:
  register: நவீன நிலையான தமிழில், அரசாணைக்குரிய கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நீண்ட காரண வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக அரைப்புள்ளியால் ஒழுங்குபடுத்தப்பட்டுள்ளது; அரமேயத்தின் அதிகாரப்பூர்வத் தன்மையும் ‘உன் கையில்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
