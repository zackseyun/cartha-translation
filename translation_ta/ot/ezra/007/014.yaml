base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: ta
  text: ஏனெனில், அரசரின் முன்னிலையிலிருந்தும்[a] அவருடைய ஏழு ஆலோசகர்களிடமிருந்தும் நீ அனுப்பப்பட்டிருக்கிறாய்; உன் கையில் இருக்கும்[b] உன் கடவுளின் சட்டத்தின்படி யூதாவையும் எருசலேமையும் குறித்து விசாரிப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரசரின் சந்நிதியிலிருந்து.’ இந்த அரமேய அரண்மனை வழக்கு, எஸ்றாவின் பணிப்பு அரச முன்னிலையிலிருந்து வந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன்னிடம் இருக்கும்’ அல்லது ‘உன்னிடம் ஒப்படைக்கப்பட்டிருக்கும்.’ சொல்லர்த்தமாக, ‘உன் கையில் இருக்கும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: ஏனெனில்
  rationale: இந்த அரமேய மரபுத்தொடர் அரசாணைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִן קֳדָם מַלְכָּא
  choice: அரசரின் முன்னிலையிலிருந்து
  rationale: சொல்லர்த்தமாக ‘அரசரின் முன்னிலையிலிருந்து’; அரச முன்னிலையிலிருந்து அதிகாரப்பூர்வமாக வழங்கப்பட்ட பணிப்பைச் சுட்டும் அரண்மனை வழக்கை இது காக்கிறது.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: அவருடைய ஏழு ஆலோசகர்களிடமிருந்து
  rationale: இவர்கள் அரசருக்கு ஆலோசனை வழங்கும் அதிகாரிகள்; ‘ஆலோசகர்கள்’ என்பது இயல்பானதும் அரண்மனைச் சூழலுக்கு ஏற்றதுமான சொல். ‘இருந்தும்’ என்பதன் பொருள் அரசரும் ஆலோசகர்களும் இணைந்த அனுப்புதலாகும்.
- source_word: שְׁלִיחַ
  choice: நீ அனுப்பப்பட்டிருக்கிறாய்
  rationale: செயப்பாட்டு வினையெச்சத்தின் அதிகாரப்பூர்வ அனுப்புதல் என்ற பொருளை, கூடுதல் விளக்கம் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: לְבַקָּרָא
  choice: விசாரிப்பதற்காக
  rationale: தேடி ஆராய்தல், பரிசோதித்தல், விசாரணை செய்தல் ஆகிய பொருள் எல்லையை நிர்வாகச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: யூதாவையும் எருசலேமையும் குறித்து
  rationale: விசாரணையின் பொருளாக யூதாவும் எருசலேமும் இருப்பதை ‘குறித்து’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּדָת אֱלָהָךְ
  choice: உன் கடவுளின் சட்டத்தின்படி
  rationale: விசாரணைக்கு அளவுகோலாக அல்லது நெறியாக கடவுளின் சட்டம் இருப்பதை ‘சட்டத்தின்படி’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: דִּי בִידָךְ
  choice: உன் கையில் இருக்கும்
  rationale: ‘உன் கையில்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; அது வைத்திருத்தல், பொறுப்பாக ஒப்படைக்கப்பட்டிருத்தல், அல்லது அதிகாரப்பூர்வக் காவலில் இருத்தல் ஆகிய நுணுக்கங்களை திறந்தவையாக வைக்கிறது.
