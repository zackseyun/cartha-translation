    issue: Footnote a uses “அரசரின் சமூகத்திலிருந்து.”
    rationale: “சமூகம்” normally denotes a community or fellowship, not a royal presence. “அரசரின் சந்நிதியிலிருந்து” conveys the intended court-presence alternative.
