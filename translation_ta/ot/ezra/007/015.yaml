  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: ta
  text: அரசனும் அவனுடைய ஆலோசகர்களும் இஸ்ரவேலின் கடவுளுக்கு மனமுவந்து காணிக்கையாகக் கொடுத்த வெள்ளியையும் தங்கத்தையும் கொண்டு வருவதற்கும், அவருடைய உறைவிடம் எருசலேமில் உள்ள இஸ்ரவேலின் கடவுளுக்கு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: மேலும் ... எடுத்துச் செல்ல வேண்டும்
  rationale: அரமேய வினையெச்சம் அரச கட்டளையின் நோக்கத்தையும் கடமையையும் குறிக்கிறது. பணத்தை எருசலேமுக்குக் கொண்டு செல்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כְּסַף וּדְהַב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: பின்வரும் தொடர்புச் சொற்றொடர் குறிப்பிட்ட காணிக்கைப் பொருட்களை அடையாளப்படுத்துகிறது; தமிழின் வேற்றுமை உருபுகள் வாக்கிய உறவைத் தெளிவாக்குகின்றன.
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: அரசனும் அவனுடைய ஆலோசகர்களும்
  rationale: அரசவையைச் சேர்ந்த ஆலோசகர்கள் என்ற பொருளைச் சரியாகவும் இன்றைய வாசகர்களுக்குப் புரியும் வகையிலும் தருகிறது.
- source_word: הִתְנַדַּבוּ
  choice: மனமுவந்து காணிக்கையாகக் கொடுத்த
  rationale: வினைச்சொல்லிலுள்ள தன்னார்வமான, விருப்பத்துடன் அளித்தல் என்ற கருத்தைப் பாதுகாக்கிறது; சூழலில் இது கடவுளுக்கான காணிக்கை என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுக்கு
  rationale: தெய்வீகப் பட்டத்தையும் காணிக்கை அர்ப்பணிக்கப்படும் இலக்கையும் நேரடியாகக் காட்டுகிறது.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: அந்தக் கடவுளின் உறைவிடம் எருசலேமில் உள்ளது
  rationale: மூலத்தில் வினையல்லாமல் ‘உறைவிடம்’ என்ற பெயர்ச்சொல் பயன்படுத்தப்பட்டிருப்பதைப் பாதுகாக்கிறது. தமிழில் தொடர்புச் சொற்றொடரின் குழப்பத்தைத் தவிர்க்க தனி வாக்கியமாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: מִשְׁכְּנֵהּ என்பதில் கடவுளுக்கும் எருசலேமுக்கும் உள்ள தொடர்பு
  choice: அந்தக் கடவுளின் உறைவிடம் எருசலேமில் உள்ளது
  alternative: எருசலேமில் குடியிருக்கிற கடவுள்
  rationale: மூல அரமேயம் ‘குடியிருக்கிறார்’ என்ற எளிய வினை வடிவத்தை அல்ல, ‘அவருடைய உறைவிடம்’ என்ற பெயர்ச்சொல் அமைப்பைப் பயன்படுத்துகிறது. தெரிவுசெய்த மொழிபெயர்ப்பு ஆலயத்தை மையமாகக் கொண்ட உரையின் வலியுறுத்தலைப் பாதுகாக்கிறது; அதே நேரத்தில் கடவுள் எருசலேமுக்குள் மட்டுமே கட்டுப்பட்டவர் என்று விளக்கிச் சொல்லவோ மறுத்துச் சொல்லவோ இல்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் தெளிவும் கொண்ட நடை. நீண்ட தொடர்புச் சொற்றொடரால் தமிழில் தோன்றக்கூடிய சார்புக் குழப்பத்தைத் தவிர்க்க இறுதிக் கருத்து தனி வாக்கியமாக வழங்கப்பட்டுள்ளது. ‘மனமுவந்து’ என்பது காணிக்கையின் தன்னார்வத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
