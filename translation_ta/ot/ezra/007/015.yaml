revisions:
- from: மேலும், அரசனும் அவனுடைய ஆலோசகர்களும் இஸ்ரவேலின் கடவுளுக்கு மனமுவந்து காணிக்கையாகக் கொடுத்த வெள்ளியையும் தங்கத்தையும் எடுத்துச் செல்ல வேண்டும். அந்தக் கடவுளின் உறைவிடம் எருசலேமில் உள்ளது.[a]
  to: அரசனும் அவனுடைய ஆலோசகர்களும் இஸ்ரவேலின் கடவுளுக்கு மனமுவந்து காணிக்கையாகக் கொடுத்த வெள்ளியையும் தங்கத்தையும் கொண்டு வருவதற்கும், அவருடைய உறைவிடம் எருசலேமில் உள்ள இஸ்ரவேலின் கடவுளுக்கு.
  rationale: மூலத்தின் இணைப்புத் தொடரும் நோக்கத்தைச் சுட்டும் வினையெச்ச அமைப்பும் ‘கொண்டு வருவதற்கும்’ என்பதன் மூலம் காக்கப்பட்டுள்ளன. இறுதிப் பெயர்ச்சொல்-அடிப்படையிலான தொடர்புத் தொடர் மீண்டும் ‘இஸ்ரவேலின் கடவுள்’ என்பதோடு இணைக்கப்பட்டுள்ளது. இதனால் மூலத்தின் இலக்கணத் தொடர்பு தெளிவாகிறது; கடவுளின் இருப்பைப் பற்றிய கூடுதல் இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை. அடிக்குறிப்பு ஆங்கில audit trail-இல் உள்ள மாற்றுவாசிப்பையும் அரமேயத்தின் சொல்லர்த்த அமைப்பையும் துல்லியமாகப் பிரதிபலிக்கிறது.
