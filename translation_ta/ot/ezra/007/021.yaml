base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: ta
  text: '“மேலும், அரசனாகிய அர்தசஷ்டாவான நான், ஆற்றுக்கு அப்பாலுள்ள பகுதியில் உள்ள எல்லாக் கருவூல அதிகாரிகளுக்கும் இந்த ஆணையைப் பிறப்பிக்கிறேன்: பரலோகத்தின் தேவனுடைய சட்டத்தின் எழுத்தரான எஸ்றா ஆசாரியர் உங்களிடம் எதைக் கேட்டாலும், அது துல்லியமாக நிறைவேற்றப்பட வேண்டும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துல்லியமாக” என்பதற்கான அரமேயச் சொல், கவனமாகவும் முழுமையாகவும் நிறைவேற்றுதல் என்ற கருத்தை வலியுறுத்துகிறது; “முழுமையாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: மேலும் ... நான்
  rationale: அரசனின் தனிப்பட்ட அதிகாரத்தையும் வெளிப்படையான முதலாம் நபர் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: அரசனாகிய அர்தசஷ்டா
  rationale: பெயரையும் அரச பட்டத்தையும் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது.
- source_word: שִׂים טְעֵם
  choice: பிறப்பிக்கும் ஆணை
  rationale: அதிகாரபூர்வமாக ஓர் உத்தரவை நிறுவி வெளியிடும் அரமேய மரபுத்தொடரின் நிர்வாகப் பொருளைக் காட்டுகிறது.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: எல்லாக் கருவூல அதிகாரிகளுக்கும்
  rationale: இவர்கள் பொருளகத்தின் நிர்வாக அலுவலர்கள் என்பதை ‘கருவூலக்காரர்கள்’ என்பதைக் காட்டிலும் தெளிவாக உணர்த்துகிறது.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதியின்
  rationale: பாரசீக நிர்வாகப் பெயரின் சொற்பொருளைத் தக்கவைத்தபடி, அது ஒரு குறிப்பிட்ட மாகாணப் பகுதி என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: உங்களிடம் எதைக் கேட்டாலும்
  rationale: கேட்பது அல்லது கோருவது என்ற வினையின் அளவை மிகைப்படுத்தாமல், வரம்பற்ற தொடர்பியல் அமைப்பை இயல்பாக வழங்குகிறது.
- source_word: עֶזְרָא כָהֲנָה
  choice: எஸ்றா என்னும் ஆசாரியர்
  rationale: பெயரையும் ஆசாரியப் பதவியையும் தெளிவான இணைப்பாக வழங்குகிறது.
- source_word: סָפַר דָּתָא
  choice: திருச்சட்ட அறிஞர்
  rationale: סָפַר என்பதிலுள்ள எழுத்தர் மற்றும் சட்டத்தில் தேர்ந்த அறிஞர் ஆகிய இரு கூறுகளையும் இச்சூழலில் எளிதில் புரியும் தமிழில் பிரதிபலிக்கிறது; வெறும் நகலெழுதுபவர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: பரலோகத்தின் தேவனுடைய
  rationale: இஸ்ரவேலின் தேவனுக்கான பேரரசுக் காலப் பட்டத்தை வழக்கமான வேதாகமத் தமிழில் தக்கவைக்கிறது.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: அது முழுமையாக நிறைவேற்றப்பட வேண்டும்
  rationale: அரமேய வினையடை வலியுறுத்தும் கவனமான, துல்லியமான, முழுமையான இணக்கத்தைச் சூழலுக்கு ஏற்ற சட்டநடையில் வெளிப்படுத்துகிறது; வேகத்தை மட்டும் வலியுறுத்துவதில்லை.
