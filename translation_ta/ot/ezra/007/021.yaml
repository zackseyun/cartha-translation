translation_notes:
  register: நவீன பொதுத்தமிழில், அரசாணைக்குரிய கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘என்னிடமிருந்து, நான்’ என்ற இரட்டை வலியுறுத்தல் தமிழில் செயற்கையாகாமல் இருக்க ‘மேலும் ... நான் ... பிறப்பிக்கும் ஆணை’ என மறுவடிவமைக்கப்பட்டுள்ளது. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
