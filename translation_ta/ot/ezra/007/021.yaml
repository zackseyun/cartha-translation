- from: '“மேலும், அரசனாகிய அர்தசஷ்டாவாகிய நான், ஆற்றுக்கு அப்பாலுள்ள பகுதியின்[a] எல்லாக் கருவூல அதிகாரிகளுக்கும் பிறப்பிக்கும் ஆணை இதுவே: பரலோகத்தின் தேவனுடைய திருச்சட்ட அறிஞரான எஸ்றா என்னும் ஆசாரியர் உங்களிடம் எதைக் கேட்டாலும், அது முழுமையாக நிறைவேற்றப்பட வேண்டும்.[b]”'
  to: '“மேலும், அரசனாகிய அர்தசஷ்டாவான நான், ஆற்றுக்கு அப்பாலுள்ள பகுதியில் உள்ள எல்லாக் கருவூல அதிகாரிகளுக்கும் இந்த ஆணையைப் பிறப்பிக்கிறேன்: பரலோகத்தின் தேவனுடைய சட்டத்தின் எழுத்தரான எஸ்றா ஆசாரியர் உங்களிடம் எதைக் கேட்டாலும், அது துல்லியமாக நிறைவேற்றப்பட வேண்டும்.[a]”'
  rationale: The revision removes the added qualifier “திரு-,” restores the source’s scribal title, smooths the royal self-identification into natural formal Tamil, and renders the compliance adverb as “துல்லியமாக.” The cultural note is retained but is not required as an in-text anchor; the lexical note is anchored to the compliance clause.
