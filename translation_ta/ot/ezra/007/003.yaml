translation:
  language: ta
  text: அமரியாவின் மகன்[a], அசரியாவின் மகன், மெராயோத்தின் மகன்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சப் பட்டியல்களில் “மகன்” என்பது உடனடி தந்தை–மகன் உறவை மட்டும் குறிக்காமல், ஒருவரின் வழித்தோன்றலையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் בֶּן என்பதற்கான இயல்பான, நேரடியான தமிழ் இணைச்சொல். இத்தகைய பட்டியல்களில் இது உடனடி மகனை மட்டுமல்லாமல் வழித்தோன்றலையும் குறிக்கக்கூடும்; அந்த வகைசார் விரிவை அடிக்குறிப்பு விளக்குகிறது.
- source_word: אֲמַרְיָה
  choice: அமரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தல்.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாக எழுத்துப்பெயர்த்தல்.
- source_word: מְרָיוֹת
  choice: மெராயோத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்துக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
