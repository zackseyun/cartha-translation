base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: ta
  text: ஏனெனில், எஸ்றா யாவேயின் சட்டத்தை ஆராயவும்[a], அதைக் கடைப்பிடிக்கவும், இஸ்ரவேலில் நியமங்களையும் நியாயத்தீர்ப்புகளையும் கற்பிக்கவும் தம் மனதை ஆயத்தப்படுத்தியிருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆராய” என்பதற்கு “தேட” அல்லது “விசாரித்து அறிய” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தம் மனதை ஆயத்தப்படுத்தியிருந்தார்” என்பது திட்டமிட்ட உள்ளார்ந்த தீர்மானத்தைக் குறிக்கும் எபிரெய மொழிமரபாகும்; “தம் மனதை உறுதியாக நிலைநிறுத்தியிருந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கூறப்பட்ட இறைநன்மைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הֵכִין לְבָבוֹ
  choice: தன் உள்ளத்தை உறுதிப்படுத்தியிருந்தார்
  rationale: எபிரெய மொழிமரபில் இது திட்டமிட்ட உள்ளார்ந்த தீர்மானத்தைக் குறிக்கிறது; தமிழ் மொழியில் செயற்படும் உறுதியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִדְרוֹשׁ
  choice: ஆராய
  rationale: דרש என்பதில் தேடுதல், விசாரித்தல், ஆராய்தல் ஆகிய அர்த்தங்கள் உள்ளன. இங்கு திருச்சட்டத்தைக் கவனமாக அறிந்துகொள்ளும் செயலைக் காட்டுவதுடன், வெறும் கல்விப் படிப்பாக அதைக் குறுக்காமல் இருக்கிறது.
- source_word: תּוֹרַת יְהוָה
  choice: யெகோவாவின் திருச்சட்டம்
  rationale: இந்த ஆசாரிய-வேதபாரகச் சூழலில் תּוֹרָה உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ அதன் புனிதத்தையும் சட்டப் பொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள இறைப்பெயரை பொதுப் பெயரான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: וְלַעֲשֹׂת
  choice: அதன்படி நடக்க
  rationale: எபிரெயில் நேரடியாக ‘செய்ய’ என்றாலும், மறைமுகப் பொருள் முன் கூறப்பட்ட திருச்சட்டம். தமிழில் ‘அதன்படி நடக்க’ என்பது கீழ்ப்படிதலின் நடைமுறைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּלְלַמֵּד
  choice: கற்பிக்க
  rationale: Piel வடிவிலுள்ள למד என்பதன் நேரடியான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: எஸ்றாவின் போதனை நடைபெற்ற சமூக மற்றும் தேசியச் சூழலை நேரடியாகக் குறிக்கிறது.
- source_word: חֹק וּמִשְׁפָּט
  choice: கட்டளைகளையும் நீதித்தீர்ப்புகளையும்
  rationale: இணையாக வரும் இரு சட்டச் சொற்களையும் வேறுபடுத்திக் காக்கிறது. எபிரெய ஒருமை வடிவங்கள் இங்கு தொகுப்புப் பொருளில் வருவதால், இயல்பான தமிழுக்காகப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதன் தனிப்பெயர் இயல்பைத் தக்கவைத்து, தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- issue: תּוֹרָה என்பதன் பொருள் வரம்பு
  choice: திருச்சட்டம்
  alternative: போதனை; தோரா
  rationale: சிறையிருப்புக்குப் பிந்தைய ஆசாரிய-வேதபாரகச் சூழலில் இது பொதுவான போதனையைவிட உடன்படிக்கைச் சட்டத்தையே சிறப்பாகக் குறிக்கிறது.
- issue: חֹק וּמִשְׁפָּט என்ற ஒருமைச் சட்டச் சொற்கள்
  choice: கட்டளைகளையும் நீதித்தீர்ப்புகளையும்
  alternative: கட்டளையையும் நீதித்தீர்ப்பையும்
  rationale: மூலத்தின் ஒருமை வடிவங்கள் தொகுப்பு அல்லது வகைப்பொருளில் இயங்குகின்றன. தமிழில் பன்மை அந்தப் பொதுத்தொகுப்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; இரண்டு சட்டப் பிரிவுகளின் வேறுபாடும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘திருச்சட்டம்’, ‘நீதித்தீர்ப்புகள்’ ஆகியவை வேதாகமச் சட்டச் சூழலுக்கேற்ற முறையான சொற்கள்; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக இருக்கும்படி அமைக்கப்பட்டுள்ளது.
