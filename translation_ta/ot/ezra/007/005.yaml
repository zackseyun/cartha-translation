  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: ta
  text: 'அபிசூவாவின் மகன்[a], பினெகாஸின் மகன், எலெயாசரின் மகன், தலைமை ஆசாரியரான[b] ஆரோனின் மகன்.


    [a] அல்லது, “வழித்தோன்றல்.” எபிரெய மரபுப் பட்டியல்களில் “மகன்” என்பது நேரடி மகனை மட்டுமல்லாமல், பிற்கால வழித்தோன்றலையும் குறிக்கலாம்.


    [b] மரபான மொழிபெயர்ப்பில், “பிரதான ஆசாரியர்.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “ஆசாரியர், தலைவர்” என்று உள்ளது; “பிரதான ஆசாரியர்” என்பதற்குப் பொதுவாகப் பயன்படுத்தப்படும் வழக்கமான சொற்றொடர் இங்கு இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழித்தோன்றல்.” எபிரெய மரபுப் பட்டியல்களில் “மகன்” என்பது நேரடி மகனை மட்டுமல்லாமல், பிற்கால வழித்தோன்றலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரபான மொழிபெயர்ப்பில், “பிரதான ஆசாரியர்.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “ஆசாரியர், தலைவர்” என்று உள்ளது; “பிரதான ஆசாரியர்” என்பதற்குப் பொதுவாகப் பயன்படுத்தப்படும் வழக்கமான சொற்றொடர் இங்கு இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: மரபுப் பட்டியலில் நேரடி உறவை வெளிப்படுத்தும் அடிப்படைப் பொருளை முதன்மை உரையில் காக்கிறது. தலைமுறைகள் விடப்பட்டிருக்கக்கூடும் என்பதால் “வழித்தோன்றல்” என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲבִישׁוּעַ
  choice: அபிசூவா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: פִּינְחָס
  choice: பினெகாஸ்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் தெளிவாகவும் வாசிக்க எளிதாகவும் எழுத்துப்பெயர்க்கிறது.
- source_word: אֶלְעָזָר
  choice: எலெயாசர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அறியத்தக்க வடிவில் தருகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: הַכֹּהֵן
  choice: குரு
  rationale: ஆலய மற்றும் பலிச் சேவையைச் செய்பவரைக் குறிக்கும் כֹּהֵן என்பதற்கு இயல்பான, சுருக்கமான நவீனத் தமிழ் இணை.
- source_word: הָרֹאשׁ
  choice: தலைமை
  rationale: רֹאשׁ என்பதன் ‘தலை/முதன்மை’ என்ற பொருளை பதவிச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத வழக்கமான தொழில்நுட்பப் பட்டத்தைத் திணிக்காது.
theological_decisions:
- issue: ஆரோனின் குருத்துவப் பட்டத்தை மொழிபெயர்த்தல்
  choice: தலைமைக் குரு
  alternative: பிரதான குரு
  rationale: הַכֹּהֵן הָרֹאשׁ என்பது சொல்லுக்குச் சொல் ‘குரு, தலைவர்/முதன்மையானவர்’ என்று பொருள்படும். ஆகவே “தலைமைக் குரு” என்பது רֹאשׁ என்ற சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது; ‘பிரதான குரு’ என்பதற்குப் பொதுவாக வரும் הַכֹּהֵן הַגָּדוֹל என்ற வேறு எபிரெயச் சொற்றொடரை இங்கு மறைமுகமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: மரபுப் பட்டியலில் בֶּן என்பதன் உறவு范围
  choice: மகன்
  alternative: வழித்தோன்றல்
  rationale: மூலத்தின் மீளுருவாக்கப்பட்ட மரபியல் சூத்திரத்தை “மகன்” என்று நேரடியாகப் பாதுகாக்கிறது. இருப்பினும் எபிரெய மரபுப் பட்டியல்கள் இடைப்பட்ட தலைமுறைகளை விடக்கூடும் என்பதால் பரந்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட மரபுப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மீண்டும் மீண்டும் வரும் “மகன்” அமைப்பு பாதுகாக்கப்பட்டுள்ளது. “ஆசாரியன்” என்பதற்குப் பதில் இன்றைய பொதுவாசகருக்கு நேரடியான “குரு” பயன்படுத்தப்பட்டாலும், எபிரெயப் பட்டத்தின் தனிப்பட்ட வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
