base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: ta
  text: மீதியுள்ள வெள்ளியையும் தங்கத்தையும் கொண்டு என்ன செய்வது உனக்கும் உன் சகோதரர்களுக்கும் நல்லதாகத் தோன்றுகிறதோ[a], அதை உங்கள் கடவுளுடைய விருப்பத்தின்படி[b] செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உனக்கும் உன் சகோதரர்களுக்கும் எது நல்லதாக இருக்கிறதோ.’ அரமேய மரபுத்தொடரை ‘நல்லதாக இருக்கிறது’ என்று சொல்லுக்கு நெருக்கமாகவும், ‘நல்லதாகத் தோன்றுகிறது’ என்று இயல்பாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் கடவுளுடைய சித்தத்தின்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: என்ன ... தோன்றுகிறதோ, அதை
  rationale: இந்த அரமேயச் சொற்றொடர் வரையறுக்கப்படாத தொடர்புச் சொல்லமைப்பை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்ன ... தோன்றுகிறதோ, அதை’ என்பது அதன் திறந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: உனக்கும் உன் சகோதரர்களுக்கும் நல்லதாகத் தோன்றுகிறதோ
  rationale: יטב உடன் על வரும் மரபுத்தொடர் ஒருவருக்கு நல்லதாக அல்லது விருப்பமானதாகத் தெரிவதைக் குறிக்கிறது. ‘நல்லதாகத் தோன்றுகிறதோ’ என்பது ஆலோசித்து முடிவெடுக்க வழங்கப்பட்ட அனுமதியின் நுணுக்கத்தைப் பேணுகிறது.
- source_word: אַחַיִךְ
  choice: உன் சகோதரர்கள்
  rationale: மூலச்சொல் நேரடியாக ‘சகோதரர்கள்’ எனப் பொருள்படும். சூழலில் உடன் இருந்த யூதர்களையோ கூட்டாளிகளையோ குறிக்கலாம் என்றாலும், மூலத்தின் உறவுமுறைச் சொல்லே தக்கவைக்கப்படுகிறது.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: மீதியுள்ள வெள்ளியையும் தங்கத்தையும் கொண்டு
  rationale: שְׁאָר என்பது எஞ்சியிருப்பதைக் குறிக்கிறது. ‘கொண்டு’ என்பது அந்த நிதியைப் பயன்படுத்திச் செய்யும் செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְמֶעְבַּד
  choice: என்ன செய்வது
  rationale: עבד இங்கு நிதியைக் கொண்டு எதையாவது செய்வது அல்லது நிறைவேற்றுவது என்ற பொதுவான பொருளில் வருகிறது; ஆகவே மூலத்தின் பொதுத்தன்மை பேணப்படுகிறது.
- source_word: כִּרְעוּת
  choice: விருப்பத்தின்படி
  rationale: இந்தப் பெயர்ச்சொல் விருப்பம், சித்தம் அல்லது பிரியம் என்பவற்றைக் குறிக்கலாம். ‘விருப்பம்’ மூலத்தின் பொருள் வரம்பை இயல்பாகப் பேணுகிறது.
- source_word: אֱלָהֲכֹם
  choice: உங்கள் கடவுள்
  rationale: இது எஸ்றாவும் அவருடன் இருந்தவர்களும் வணங்கிய குறிப்பிட்ட கடவுளைக் குறிக்கிறது; பன்மை உடைமை வடிவம் ‘உங்கள்’ என்று துல்லியமாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: תַּעַבְדוּן
  choice: செய்யுங்கள்
  rationale: இந்த வினைவடிவு அரசாணையின் சூழலில் அனுமதியோடு கூடிய கட்டளையாகச் செயல்படுகிறது. மரியாதைப் பன்மை ஏவல் தமிழில் அதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: אֱלָהֲכֹם என்ற இறைக் குறிப்பின் தனித்துவம்
  choice: உங்கள் கடவுள்
  alternative: உங்கள் தெய்வம்
  rationale: குறிப்பு பொதுவான ஒரு தெய்வத்தை அல்ல, எஸ்றாவும் அவருடைய தோழர்களும் வணங்கிய கடவுளையே சுட்டுகிறது. தமிழ் எழுத்தில் பெரிய எழுத்து வேறுபாடு இல்லாததால், குறிப்பிட்ட பொருள் சூழலாலும் சொல் தேர்வாலும் வெளிப்படுகிறது.
- issue: כִּרְעוּת என்பதன் ‘விருப்பம்/சித்தம்’ பொருள் நுணுக்கம்
  choice: விருப்பத்தின்படி
  alternative: சித்தத்தின்படி
  rationale: ‘சித்தம்’ இறையியல் மரபில் வலுவான சொல்லாக இருந்தாலும், அரமேயச் சொல் ‘விருப்பம்’ அல்லது ‘பிரியம்’ என்றும் பொருள்படலாம். ‘விருப்பம்’ அந்தப் பரந்த பொருள் வரம்பையும் அரசாணையின் நேரடித் தொனியையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசாணைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை முகவரியான எஸ்றாவுக்கு ‘உனக்கும்’ என்றும், எஸ்றாவும் அவருடைய சகோதரர்களும் சேர்ந்த குழுவுக்கு ‘உங்கள்’ மற்றும் ‘செய்யுங்கள்’ என்றும் எண்ணியல் வேறுபாடு பேணப்பட்டுள்ளது.
