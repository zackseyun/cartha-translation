- from: உன் கடவுளின் ஆலயப் பணிக்காக[a] உன்னிடம் கொடுக்கப்படும் பாத்திரங்களை, எருசலேமின் கடவுளுக்கு முன்பாக முழுமையாக ஒப்படைத்துவிடு.[b]
  to: உன் கடவுளின் ஆலயப் பணிக்காக[a] உனக்குக் கொடுக்கப்படும் பாத்திரங்களை எருசலேமின் கடவுளின் முன்னிலையில் முழுமையாக ஒப்படை.[b]
  rationale: The revision retains the draft’s faithful lexical choices while improving idiomatic Tamil for the phrase ‘before the God of Jerusalem.’ It also revises footnote b so that its alternative rendering of ‘deliver in full’ does not omit the source phrase ‘before the God of Jerusalem.’
