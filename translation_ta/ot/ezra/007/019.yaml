base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: ta
  text: உன் கடவுளின் ஆலயப் பணிக்காக[a] உனக்குக் கொடுக்கப்படும் பாத்திரங்களை எருசலேமின் கடவுளின் முன்னிலையில் முழுமையாக ஒப்படை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளின் ஆலய வழிபாட்டிற்காக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எருசலேமின் கடவுளின் முன்னிலையில் முழுமையாகச் சமர்ப்பி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: பாத்திரங்களை
  rationale: ஆலயத்தில் பயன்படுத்தப்படும் கருவிகள் அல்லது பாத்திரங்களைக் குறிக்கும் அரமேயச் சொல்; தமிழில் ‘பாத்திரங்கள்’ இயல்பாகவும் மரபான ஆலயச் சூழலுக்கும் ஏற்றதாகவும் உள்ளது.
- source_word: דִּי
  choice: -ப்படும்
  rationale: பாத்திரங்களை விவரிக்கும் தொடர்புப்பொருளைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வெளிப்படுத்துகிறது.
- source_word: מִתְיַהֲבִין לָךְ
  choice: உன்னிடம் கொடுக்கப்படும்
  rationale: செயப்பாட்டு வினைத் தன்மையைப் பாதுகாக்கிறது; நிகழ்கால அல்லது எதிர்நோக்கிய ஆணைச் சூழலுக்கு ஏற்ற தமிழாக்கம்.
- source_word: לְפָלְחָן
  choice: பணிக்காக
  rationale: வழிபாடு உட்பட ஆலயத்தில் செய்யப்படும் சேவையைப் பரந்த வகையில் குறிக்கிறது; மூலச்சொல்லை வழிபாடு என்ற ஒரே பொருளுக்குள் சுருக்கவில்லை.
- source_word: בֵּית אֱלָהָךְ
  choice: உன் கடவுளின் ஆலய
  rationale: ‘உன் கடவுளின் வீடு’ என்பதன் சூழல்சார் பொருளை இயல்பான நவீன தமிழில் ‘ஆலயம்’ என வழங்குகிறது.
- source_word: הַשְׁלֵם
  choice: முழுமையாக ஒப்படைத்துவிடு
  rationale: பாத்திரங்களை குறைவின்றி முறையாகக் கையளிக்க வேண்டும் என்ற கட்டளைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קֳדָם
  choice: முன்பாக
  rationale: ‘முன்’ அல்லது ‘சந்நிதியில்’ என்ற அரமேய முன்னிடைச்சொல்லின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: எருசலேமின் கடவுள்
  rationale: பாரசீகக் கால நிர்வாக மொழிநடையில் காணப்படும், கடவுளை எருசலேமுடன் தொடர்புபடுத்தும் சொல்லமைப்பை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆலயம் சார்ந்த פְּלָחָן என்ற சொல்லின் பொருள்
  choice: ஆலயப் பணி
  alternative: ஆலய வழிபாடு
  rationale: இச்சொல் வழிபாட்டை உள்ளடக்கினாலும், ஆலயத்தில் நடைபெறும் சேவையைப் பரந்த பொருளில் குறிக்க முடியும். ‘பணி’ என்பது அந்த அகலத்தைப் பாதுகாக்கிறது.
- issue: אֱלָהּ יְרוּשְׁלֶם என்ற தொடர்பின் விளக்கம்
  choice: எருசலேமின் கடவுள்
  alternative: எருசலேமிலுள்ள கடவுள்
  rationale: மூலத்தின் சுருக்கமான தொடர்புச் சொல்லமைப்பைத் தீர்மானமாக விரித்துரைக்காமல் பாதுகாக்கிறது; இது கடவுளின் இருப்பிடத்தை வரையறுப்பதாக அவசியம் எடுத்துக்கொள்ளப்பட வேண்டியதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசாணைக்குரிய நேரடியான கட்டளைத் தொனியும் கண்ணியமான வேதாகம நடையும் பேணப்பட்டுள்ளன. ‘ஆலயப் பணி’ என்பது சாதாரண வாசகர்களுக்குப் புரியும்படியும் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது.
