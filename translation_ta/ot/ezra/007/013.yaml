translation_notes:
  register: நவீன நிலையான தமிழில், அரசாணைக்குரிய கண்ணியமான நடையும் பொதுவாசகருக்குப் புரியும் இயல்பான சொற்றொடரும் இணைக்கப்பட்டுள்ளன. மூலத்தில் உள்ள ஒருமை பொதுப்பொருள் தமிழில் ‘எவராவது ... அவர்’ எனப் பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
