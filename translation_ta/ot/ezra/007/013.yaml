source:
  edition: WLC
  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: ta
  text: '“நான் ஆணையிடுவது இதுவே: என் அரசில் உள்ள இஸ்ரவேல் மக்களிலும், அவர்களுடைய ஆசாரியர்களிலும்[b] லேவியர்களிலும், உன்னோடு எருசலேமுக்குச் செல்லத் தாமாக முன்வருகிற எவரும் செல்லலாம்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனமுவந்து முன்வருகிற எவரும்.” அரமேயப் பங்கேற்புவினை தன்னார்வமான, கட்டாயமற்ற செயலை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அரமேயப் பின்னொட்டை வேறுவிதமாகப் புரிந்துகொண்டால், “அவனுடைய ஆசாரியர்கள்” என்றும் மொழிபெயர்க்கலாம்; சூழல் அது இஸ்ரவேல் மக்களுடைய ஆசாரியர்களைக் குறிப்பதையே ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: என்னிடமிருந்து இந்த ஆணை பிறப்பிக்கப்படுகிறது
  rationale: அரசனிடமிருந்து ஆணை வெளியாவதைக் குறிக்கும் அரமேய நிர்வாகச் சொல்லாட்சியை, இயல்பான நவீனத் தமிழ் அரசாணை நடையில் தருகிறது.
- source_word: כָל מִתְנַדַּב
  choice: எவராவது ... தாமாக முன்வந்தால்
  rationale: Hitpael வினையெச்சம் காட்டும் தன்னார்வத்தையும் சுயமுனைப்பையும் தெளிவாகப் பேணுகிறது; தமிழில் பொதுவான தனிநபரைக் குறிப்பிடும் இயல்பான வடிவம்.
- source_word: בְּמַלְכוּתִי
  choice: என் அரசில் உள்ள
  rationale: அரசனின் ஆட்சிக்குட்பட்ட பரப்பைக் குறிக்கும்; ‘அரசு’ என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִן עַמָּה יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிலோ
  rationale: தன்னார்வமாகச் செல்லக்கூடியவர் எந்த மக்கள்குழுவைச் சேர்ந்தவர் என்பதைத் தெளிவுபடுத்துகிறது; அடுத்த குழுக்களுடன் ‘-லோ’ அமைப்பு இயல்பாக இணைகிறது.
- source_word: וְכָהֲנוֹהִי
  choice: அவர்களுடைய ஆசாரியர்களிலோ
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டைச் சூழலின்படி இஸ்ரவேல் மக்களைக் குறிப்பதாகப் புரிந்து, தமிழில் இயல்பான கூட்டுப்பால் சுட்டுப்பெயரால் வழங்குகிறது; வேறு இலக்கணப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֵוָיֵא
  choice: லேவியர்களிலோ
  rationale: ஆலயப் பணியுடன் தொடர்புடைய குழுவின் வழக்கமான தமிழ்ப் பெயரைப் பயன்படுத்துகிறது.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: உன்னோடு எருசலேமுக்குப் போக
  rationale: எஸ்றாவுடன் சேர்ந்து எருசலேமை நோக்கிச் செல்லும் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהָךְ
  choice: அவர் போகலாம்
  rationale: அரசாணைச் சூழலில் இந்த வடிவம் வழங்கும் அனுமதிப் பொருளை ‘போகலாம்’ தெளிவாகக் காட்டுகிறது; கட்டளையாகவோ வெறும் எதிர்காலமாகவோ மாற்றவில்லை.
