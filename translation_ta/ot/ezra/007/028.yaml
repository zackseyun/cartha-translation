base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: ta
  text: அரசன், அவனுடைய ஆலோசகர்கள், அரசனுடைய வல்லமைமிக்க அதிகாரிகள் அனைவரின் முன்னிலையிலும் அவர் எனக்குத் தமது மாறாத அன்பை அளித்தார்[a]. என் கடவுளாகிய யாவேயின் கை என்மேல் இருந்ததால் நான் துணிவடைந்தேன்[b]; என்னோடு ஏறிச் செல்வதற்காக இஸ்ரவேலிலிருந்து தலைவர்களை[c] ஒன்றுகூட்டினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குத் தயவு காட்டினார்.”
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொற்படியாக, “என் கடவுளாகிய யாவேயின் கை என்மேல் இருந்ததற்கு ஏற்ப நான் என்னைப் பலப்படுத்திக்கொண்டேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில் “தலைகள்”; அதாவது, இஸ்ரவேலின் தலைவர்கள் அல்லது முதன்மையானவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: தமது மாறாத அன்பை அளித்தார்
  rationale: ‘நீட்டினார்/சாயச் செய்தார்’ என்ற எபிரேய வினைப்படிமத்தைச் சொற்படியாகத் தமிழாக்குவது இயல்பற்றதாகும். ‘அளித்தார்’ என்பது அந்தச் செயப்பொருளை இயல்பாகத் தெரிவிக்கிறது; ‘மாறாத அன்பு’ חֶסֶד என்பதிலுள்ள உறுதியான, உண்மையுள்ள அன்பின் கனத்தைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அரசவையின் முன்னிலையிலும் பார்வையிலும் எஸ்றாவுக்கு இறைஅன்பு வெளிப்பட்டதை நேரடியாகக் காட்டுகிறது.
- source_word: יֹעֲצָיו
  choice: அவனுடைய ஆலோசகர்கள்
  rationale: பாரசீக அரசவைச் சூழலுக்கு ஏற்ற தெளிவான நவீனத் தமிழ் சொல்.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: அரசனுடைய வல்லமைமிக்க அதிகாரிகள்
  rationale: שָׂרִים என்பதன் உயர்நிலை நிர்வாகப் பதவியையும் הַגִּבֹּרִים என்பதன் வலிமை அல்லது செல்வாக்கையும் பாதுகாக்கிறது.
- source_word: הִתְחַזַּקְתִּי
  choice: நான் துணிவடைந்தேன்
  rationale: இச்சூழலில் வலுப்பெற்று மனத்துணிவு அடைந்ததைக் குறிக்கும் இயல்பான தமிழ்; வலிமை எஸ்றாவிடமிருந்தே தோன்றியது என உணர்த்தாமல் அடுத்த இறைக்கைச் சொற்றொடருடன் இணைகிறது.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: என் கடவுளாகிய யாவேயின் கை என்மேல் இருந்ததால்
  rationale: כְּ என்பதன் தொடர்பை இங்கு காரணமாக இயல்பாக வெளிப்படுத்தி, இறைவனின் வழிநடத்தலையும் வல்லமையையும் குறிக்கும் ‘கை’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரேய இறைப்பெயரின் தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: רָאשִׁים
  choice: தலைவர்கள்
  rationale: சொற்பொருள் ‘தலைகள்’; இங்கு இஸ்ரவேல் சமூகத்தின் அங்கீகரிக்கப்பட்ட முதன்மை நபர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ நவீனத் தமிழில் இயல்பாக அந்தப் பங்கைத் தெரிவிக்கிறது.
- source_word: לַעֲלוֹת
  choice: ஏறிச் செல்வதற்காக
  rationale: எருசலேமுக்குச் செல்வதை ‘ஏறிச் செல்லுதல்’ என்று கூறும் வேதாகமத் திசைமொழியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, இறைவனுடைய தனிப்பெயரான திருநான்கெழுத்தைப் பயன்படுத்துகிறது. ஆகவே தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: எஸ்றாவின் துணிவுக்கும் இறைவனுடைய கைக்கும் இடையிலான தொடர்பு
  choice: ‘கை என்மேல் இருந்ததால் நான் துணிவடைந்தேன்’ என்ற காரணத் தொடர்பு
  alternative: ‘என்மேலிருந்த கைக்கு ஏற்ப நான் என்னைப் பலப்படுத்திக்கொண்டேன்’ என்ற சொற்படியான வாசிப்பு
  rationale: כְּ என்ற முன்னிடைச்சொல் முறை அல்லது அளவையும் சுட்டக்கூடியதால் மாற்று வாசிப்பு சாத்தியம். எனினும் சூழலில் இறைவனுடைய அருளும் கையும் எஸ்றாவின் துணிவுக்கு அடிப்படை என்பதே இயல்பான பொருள்; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: חֶסֶד என்பதின் பொருள்
  choice: மாறாத அன்பு
  alternative: தயவு
  rationale: இங்கு அரசவையின்முன் கிடைத்த சாதகநிலையை ‘தயவு’ தெளிவாகச் சொன்னாலும், எஸ்றா அதனை இறைவனிடமிருந்து வரும் חֶסֶד எனக் கூறுவதால் அதன் உண்மையுள்ள, நிலையான அன்பின் இறையியல் கனத்தை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியது. அரசவைச் சொற்களுக்கு புரியக்கூடிய நிர்வாக மொழி தேர்ந்தெடுக்கப்பட்டது. ‘கை’ மற்றும் ‘ஏறிச் செல்லுதல்’ போன்ற முக்கிய எபிரேய உருவகங்கள் பாதுகாக்கப்பட்டன; பொருள் மங்கக்கூடிய இடங்களில் அடிக்குறிப்புகள் வழங்கப்பட்டன.
