  source_fidelity: 'முதன்மை உரை எபிரேயத்தின் பொருளை நன்றாகப் பாதுகாக்கிறது: இறைவன் காட்டிய חֶסֶד, அரசவையின்முன் கிடைத்த தயவு, யாவேயின் கை எஸ்றாவின்மேல் இருந்தமை, இஸ்ரவேலிலிருந்து தலைவர்களை ஒன்றுகூட்டுதல், அவரோடு ‘ஏறிச் செல்லுதல்’ ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. இருப்பினும் அரசன், ஆலோசகர்கள், அதிகாரிகள் ஆகியோருடனான ‘முன்பாக’ என்ற தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டச் சிறு தொடரியல் திருத்தம் தேவை.'
  naturalness: ‘அரசனுக்கும் … அனைவருக்கும் முன்பாக’ என்பது புரிந்துகொள்ளத்தக்கது; ஆனால் தொடர்ச்சியான -க்கும் வேற்றுமை உருபுகள் ‘முன்பாக’ என்பதோடு சற்றே கனமாகவும், சில வாசகர்களுக்கு ‘அவர்களுக்கு’ என்ற திசையையும் தரக்கூடியதாகவும் உள்ளது. ‘அனைவரின் முன்னிலையிலும்’ என்பது நவீன நிலையான தமிழில் அரசவைக் காட்சியைத் தெளிவாகத் தருகிறது. அடிக்குறிப்பு b-யின் மாற்று வாசிப்பும் சொற்றொடர் ஒழுங்கில் இயல்பாக்கப்பட்டுள்ளது.
  terminology: ‘யாவே’ என்பது יְהוָה-வின் தனிப்பெயர் தன்மையைச் சரியாகப் பாதுகாக்கிறது. ‘மாறாத அன்பு’ חֶסֶד-இன் நிலைத்த/உண்மையுள்ள அன்பு என்ற கனத்தை நன்றாக வெளிப்படுத்துகிறது; ‘தயவு’ மாற்றாக அடிக்குறிப்பில் தக்கவாறு உள்ளது. ‘வல்லமைமிக்க அதிகாரிகள்,’ ‘துணிவடைந்தேன்,’ ‘தலைவர்கள்,’ ‘ஏறிச் செல்வதற்காக’ ஆகியவை சூழலுக்கும் நவீன தமிழுக்கும் ஏற்றவை.
