revisions:
- from: 'அரசன் அர்தசஷ்டா, ஆசாரியரும் எழுத்தருமான எஸ்றாவுக்குக் கொடுத்த அதிகாரப்பூர்வ ஆவணத்தின் நகல்[a] இதுவே. எஸ்றா, இஸ்ரவேலுக்கான[b] யாவேயின் கட்டளைகளின் வார்த்தைகளையும் அவருடைய சட்டங்களையும் எழுதும் எழுத்தர்:'
  to: 'அரசன் அர்தசஷ்டா ஆசாரியனும் எழுத்தருமான எஸ்றாவுக்குக் கொடுத்த ஆவணத்தின் நகல்[a] இதுவே: யாவேயின் கட்டளைகளின் வார்த்தைகளுக்கும் இஸ்ரவேலுக்கான[b] அவருடைய சட்டங்களுக்கும் உரிய எழுத்தர்.'
  rationale: எஸ்றாவின் ஆசாரியர் மற்றும் எழுத்தர் அடையாளங்களையும், யாவேயின் கட்டளைகளின் வார்த்தைகள் மற்றும் சட்டங்களோடு அவருக்குள்ள தொடர்பையும் மூலத்தின் ஒரே அடைமொழித் தொடராக மீட்டமைத்துள்ளேன். ‘எழுதும்’ என்ற ஆதாரமற்ற செயற்பொருள் நீக்கப்பட்டுள்ளது. ஆவணத்தின் அரசச் சூழலை வாசகர் சூழலிலிருந்தே உணர முடிவதால் மூலத்தில் இல்லாத ‘அதிகாரப்பூர்வ’ என்பதும் நீக்கப்பட்டுள்ளது. அடிக்குறிப்பு a உண்மையான சொற்பொருள் மாற்றுகளை மட்டும் தருமாறு திருத்தப்பட்டுள்ளது.
