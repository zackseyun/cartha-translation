source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: ta
  text: 'அரசன் அர்தசஷ்டா ஆசாரியனும் எழுத்தருமான எஸ்றாவுக்குக் கொடுத்த ஆவணத்தின் நகல்[a] இதுவே: யாவேயின் கட்டளைகளின் வார்த்தைகளுக்கும் இஸ்ரவேலுக்கான[b] அவருடைய சட்டங்களுக்கும் உரிய எழுத்தர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவணத்தின் உரை’ அல்லது ‘ஆவணத்தின் படியெழுத்து’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலைப் பற்றிய’ அல்லது ‘இஸ்ரவேலின்மேல்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: அதிகாரப்பூர்வ ஆவணத்தின் நகல்
  rationale: இச்சொற்றொடர் ஓர் அதிகாரப்பூர்வ எழுத்தாவணத்தின் நகல் அல்லது படியைக் குறிக்கிறது. ‘ஆவணத்தின் நகல்’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது; ‘அதிகாரப்பூர்வ’ என்பது பாரசீக அரச ஆவணச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וְזֶה
  choice: இதுவே
  rationale: பின்வரும் அரச ஆவணத்தை அறிமுகப்படுத்தும் சுட்டுத் தொடராக இயல்பாக அமைகிறது; மூலத்தில் இல்லாத காலப்பொருளைச் சேர்க்கவில்லை.
- source_word: נָתַן
  choice: கொடுத்த
  rationale: வினையின் அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது; ‘பிறப்பித்த’ என ஆணையாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: அரசன் அர்தசஷ்டா
  rationale: பட்டம் தமிழாக்கப்பட்டு, தனிப்பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: ஆசாரியரும் எழுத்தருமான
  rationale: எஸ்றாவின் இரு பணிகளையும் இணைநிலையாகக் காக்கிறது. ‘எழுத்தர்’ என்பது நிர்வாக மற்றும் திருமறை எழுத்துப்பணி ஆகிய இரு சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: யாவேயின் கட்டளைகளின் வார்த்தைகளையும் ... எழுதும் எழுத்தர்
  rationale: மூலத்தின் மீளுரையையும் ‘கட்டளைகளின் வார்த்தைகள்’ என்ற அமைப்பையும் பெருமளவு காக்கிறது. ‘வல்லுநர்’ அல்லது ‘அறிஞர்’ என்று மட்டும் மொழிபெயர்த்து எழுத்தர் என்ற வெளிப்படையான சொல்லை மறைக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְחֻקָּיו
  choice: அவருடைய சட்டங்களையும்
  rationale: חֹק என்பதன் சட்ட அல்லது விதிமுறைப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; உடைமைத் தொடர்பும் காக்கப்படுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கான
  rationale: கட்டளைகளும் சட்டங்களும் இஸ்ரவேலுக்குப் பொருந்துவதை இயல்பாகத் தெரிவிக்கிறது; ‘இஸ்ரவேலைப் பற்றிய’ என்ற மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ‘யாவே’ என்ற தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- issue: עַל יִשְׂרָאֵל என்பதன் தொடர்பு
  choice: இஸ்ரவேலுக்கான
  alternative: இஸ்ரவேலைப் பற்றிய; இஸ்ரவேலின்மேல் அதிகாரமுள்ள
  rationale: இங்கு யாவேயின் கட்டளைகளும் சட்டங்களும் இஸ்ரவேலுக்கு உரியவை அல்லது அதற்குப் பொருந்துபவை என்பதே சூழலுக்கு ஏற்ற வாசிப்பு. எனினும் முன்னிடைச்சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அரச ஆவணத்தின் மேற்கோள் அடுத்த வசனத்தில் தொடங்குவதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே அமைக்கப்பட்டுள்ளன.
