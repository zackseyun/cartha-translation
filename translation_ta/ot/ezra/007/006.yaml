  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: ta
  text: இந்த எஸ்றா பாபிலோனிலிருந்து ஏறிச் சென்றார். அவர் இஸ்ரவேலின் கடவுளாகிய யாவே கொடுத்த மோசேயின் சட்டத்தில் திறமைமிக்க எழுத்தராக இருந்தார். அவருடைய கடவுளாகிய யாவேயின் கை அவர்மேல் இருந்ததற்கேற்ப, அரசர் அவர் கேட்ட அனைத்தையும் அவருக்கு வழங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயின் கை அவர்மேல் இருந்தது” என்பது யாவேயின் அருள், வல்லமை, அல்லது பராமரிக்கும் உதவியைக் குறிக்கக்கூடிய எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: பாபிலோனிலிருந்து எருசலேமுக்கு ஏறிவந்தார்
  rationale: עָלָה என்பது எருசலேமை நோக்கிய பயணத்தை ‘ஏறுதல்’ என்று கூறும் வழக்கைத் தக்கவைக்கிறது. இலக்கு எபிரேயத்தில் வெளிப்படையாக இல்லாவிட்டாலும் உடனடிச் சூழலில் தெளிவாக இருப்பதால் இயல்பான தமிழுக்காக ‘எருசலேமுக்கு’ சேர்க்கப்பட்டது.
- source_word: סֹפֵר מָהִיר
  choice: தேர்ச்சிபெற்ற மறைநூல் அறிஞர்
  rationale: סֹפֵר என்பது எழுத்தர், செயலர், அல்லது நூல்களில் தேர்ந்த அறிஞர் எனப் பொருள்படலாம்; ‘மோசேயின் திருச்சட்டத்தில்’ என்ற தொடரால் இங்கு நூல்சார் சட்ட அறிஞர் என்ற பொருள் முதன்மை பெறுகிறது. מָהִיר இங்கு உடல் வேகத்தைவிட திறமையையும் தேர்ச்சியையும் குறிக்கிறது.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டத்தில்
  rationale: תּוֹרָה அடிப்படையில் போதனை அல்லது அறிவுறுத்தல் எனினும், இச்சூழலில் மோசே வழியாக அளிக்கப்பட்ட உடன்படிக்கைச் சட்டத்தைச் சுட்டுகிறது. ‘திருச்சட்டம்’ நவீன தமிழில் புனிதத்தன்மையையும் சட்டப் பொருளையும் தெளிவாகக் கூறுகிறது.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யெகோவா அருளிய
  rationale: נתן என்பதன் ‘கொடுத்த’ என்ற அடிப்படைப் பொருள், கடவுள் திருச்சட்டத்தை அளித்தார் என்ற சூழலில் இயல்பான உயர்நடைக்காக ‘அருளிய’ என மொழிபெயர்க்கப்பட்டது. தொடர்புச் சொற்றொடர் திருச்சட்டத்தையே விளக்குகிறது.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: அவர் கேட்ட அனைத்தையும் அரசர் அவருக்கு வழங்கினார்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய வேண்டுகோள் அனைத்தையும்’ என்பதற்குப் பதிலாக, முழு வேண்டுகோளும் நிறைவேற்றப்பட்டது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: அவருடைய கடவுளாகிய யெகோவாவின் கை அவர்மேல் இருந்தபடியால்
  rationale: தெய்வீக அருள், வல்லமை, அல்லது பராமரிப்பு உதவி ஆகியவற்றில் ஒன்றாக மட்டும் சுருக்காமல் ‘கை அவர்மேல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. כְּ வெளிப்படுத்தும் தொடர்பு தமிழில் இயல்பாக காரணத் தொடரால் கூறப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நன்கு அறியப்பட்ட தெய்வீகப் பெயர் வடிவம்; பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பெயரை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் வைத்திருக்கிறது. ‘யெகோவா’ தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம்.
- issue: ‘யெகோவாவின் கை அவர்மேல்’ என்ற உருவகத்தின் விளக்கம்
  choice: உருவகத்தை முதன்மை உரையில் தக்கவைத்து அடிக்குறிப்பில் அதன் பொருள் வரம்பைக் குறிப்பிடுதல்
  alternative: ‘யெகோவா அவருக்கு ஆதரவாயிருந்ததால்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த மரபுத்தொடர் அருள், ஆற்றல், வழிநடத்தல், பராமரிப்பு உதவி போன்ற ஒன்றோடொன்று தொடர்புடைய நுணுக்கங்களை உடையது. அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து இறையியல் பொருளைச் சுருக்காமல் உருவகம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மறைநூல் அறிஞர்’ என்பது ‘எழுத்தர்’ என்ற சொல் இன்று தரக்கூடிய வெறும் நகலெழுதுபவர் என்ற குறுகிய எண்ணத்தைத் தவிர்த்து, மோசேயின் திருச்சட்டத்தில் தேர்ந்த சோஃபேர் என்ற சூழல்பொருளை வெளிப்படுத்துகிறது. எபிரேய உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
