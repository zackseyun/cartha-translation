translation:
  language: ta
  text: நூறு தாலந்து வெள்ளி வரை, நூறு கோர் கோதுமை வரை, நூறு பாத் திராட்சரசம் வரை, நூறு பாத் எண்ணெய் வரை, அளவு நிர்ணயிக்கப்படாத உப்பும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “எழுதப்படாத உப்பு”; அதாவது, உப்புக்கு ஒரு குறிப்பிட்ட அளவு நிர்ணயிக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: வரையிலும்
  rationale: நிர்வாகப் பட்டியலான இச்சூழலில், ஒவ்வொரு பொருளுக்கும் அனுமதிக்கப்பட்ட உச்ச அளவை இது குறிக்கிறது. மீண்டும் மீண்டும் வரும் மூலமொழி அமைப்பைப் பேணும் வகையில் ‘வரையிலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כְּסַף
  choice: வெள்ளி
  rationale: இச்சொல் வெள்ளி என்ற உலோகத்தைக் குறிக்கிறது; அது தாலந்து என்னும் எடை அலகால் அளக்கப்படுவதால் ‘பணம்’ என்பதைவிட ‘வெள்ளி’ துல்லியமானது.
- source_word: כַּכְּרִין
  choice: தாலந்து
  rationale: இது பண்டைய எடை அலகு. ஊகமான நவீன மாற்றீட்டைத் தவிர்த்து, வழக்கிலுள்ள ஒலிபெயர்ப்பு பேணப்பட்டுள்ளது.
- source_word: מְאָה
  choice: நூறு
  rationale: மூலத்தின் ஆணைநடை அளவுப் பட்டியலைப் பேணுவதற்காக ஒவ்வொரு பொருளுடனும் எண்ணிக்கை மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: חִנְטִין
  choice: கோதுமை
  rationale: இச்சொல் பொதுவான தானியத்தை அல்ல, குறிப்பாகக் கோதுமையைக் குறிக்கிறது.
- source_word: כֹּרִין
  choice: கோர்
  rationale: இது பண்டைய உலர் அளவை. நிச்சயமற்ற நவீன அளவாக மாற்றாமல், அலகின் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמַר
  choice: திராட்சரசம்
  rationale: ஆலயத்திற்கான பொருட்களின் இப்பட்டியலில் இச்சொல் திராட்சையிலிருந்து தயாரிக்கப்பட்ட மதுவைக் குறிக்கிறது; நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘திராட்சரசம்’ என வழங்கப்பட்டுள்ளது.
- source_word: בַּתִּין
  choice: பாத்
  rationale: இது பண்டைய திரவ அளவான ‘பாத்’ என்பதன் பன்மை. ஊகமான மாற்றீட்டுக்குப் பதிலாகப் பழைய அலகு பேணப்பட்டுள்ளது.
- source_word: מְשַׁח
  choice: எண்ணெய்
  rationale: இச்சொல் எண்ணெயைக் குறிக்கிறது. சூழலில் அது ஒலிவ எண்ணெயாக இருக்கக்கூடும் என்றாலும், மூலத்தில் அது வெளிப்படையாகக் குறிப்பிடப்படாததால் பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מְלַח
  choice: உப்பு
  rationale: பட்டியலில் இறுதியாகக் குறிப்பிடப்படும் பொருளுக்கான நேரடியான தமிழாக்கம்.
- source_word: דִּי לָא כְתָב
  choice: அளவு குறிப்பிடப்படாத
  rationale: சொல்லுக்குச் சொல் ‘எழுதப்படாதது’ என்றாலும், நிர்வாகச் சூழலில் உப்புக்கு ஒரு நிர்ணயிக்கப்பட்ட அளவு பதிவு செய்யப்படவில்லை என்பதே பொருள். மூலத்தின் உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
