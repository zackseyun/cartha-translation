base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: ta
  text: உன் தேவனுடைய சட்டத்தையும் அரசனுடைய சட்டத்தையும் கடைப்பிடிக்காத எவருக்கும் உடனடியாகத் தீர்ப்பு நிறைவேற்றப்பட வேண்டும்; அது மரணமாயினும், நாடுகடத்தலாயினும்[a], உடைமைகள் பறிமுதல் செய்யப்படுதலாயினும், சிறைத்தண்டனையாயினும் இருக்கலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியேற்றப்படுதலாயினும்”; சொல்லளவில், “வேரோடு பிடுங்கப்படுதலாயினும்.” அராமியச் சொல் அரிதானது; ஒருவர் தமது இடத்திலிருந்தோ சமூகத்திலிருந்தோ அகற்றப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: எவனுக்கும்
  rationale: சட்ட மொழிநடையில், நிபந்தனைக்குட்படும் எந்த நபரையும் குறிக்கும் அராமியத் தொடரின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: கடைப்பிடிக்காத
  rationale: சொல்லளவில் ‘செய்யாத’ என்றாலும், சட்டத்துடன் வரும் இத்தொடர் அதற்கு இணங்கி நடக்காததைக் குறிக்கிறது; ‘கடைப்பிடிக்காத’ என்பது சட்டச் சூழலுக்கு இயல்பானது.
- source_word: דָּתָא
  choice: சட்டம்
  rationale: இச்சொல் சட்டம், ஆணை, அரசாணை ஆகிய பொருள்களைத் தரக்கூடும். தேவனுடைய சட்டமும் அரசனுடைய சட்டமும் இணையாகக் கூறப்படுவதால் ‘சட்டம்’ பொருத்தமானது.
- source_word: אֱלָהָךְ
  choice: உன் தேவன்
  rationale: எஸ்றாவை நோக்கிய ஒருமை முன்னிலை உடைமை வடிவை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: அரசனுடைய சட்டம்
  rationale: ‘உன் தேவனுடைய சட்டம்’ என்பதுடன் உள்ள இணை அமைப்பையும் முறையான சட்ட மொழிநடையையும் காக்கிறது.
- source_word: אָסְפַּרְנָא
  choice: உடனடியாக
  rationale: நீதித்தீர்ப்பைத் தாமதமின்றி அல்லது விரைவாகச் செயல்படுத்த வேண்டும் என்ற வினையடைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: அவனுக்கும் எதிரான தீர்ப்பு ... நிறைவேற்றப்பட வேண்டும்
  rationale: குற்றவாளிக்கு எதிராக நீதித்தீர்ப்பு செயல்படுத்தப்படுவதைக் குறிக்கும் அராமியச் செயப்பாட்டு சட்ட அமைப்பைத் தமிழில் காக்கிறது.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: அது ... -ஓ ... -ஓ ... -ஓ ... ஆக இருக்கலாம்
  rationale: பல மாற்றுத் தண்டனைகளைப் பட்டியலிடும் மூலமொழி அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְמוֹת
  choice: மரணம்
  rationale: மரணத்தை விதிக்கப்படும் தண்டனைகளில் ஒன்றாக நேரடியாகக் குறிப்பிடுகிறது; ‘மரண தண்டனை’ என்று விரிவாக்காமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: לשרשו
  choice: நாடுகடத்தப்படுதல்
  rationale: அரிதான இச்சொல்லின் அடிப்படைப் பொருள் ‘வேரோடு பிடுங்குதல்’; சட்டச் சூழலில் ஒருவரை அவரது இடம் அல்லது சமூகத்திலிருந்து அகற்றுவதைக் குறிக்கலாம். அந்தச் சாத்தியமான பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; ஐயப்பாடு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: உடைமைகள் பறிமுதல் செய்யப்படுதல்
  rationale: உடைமைகள் தொடர்பான அரசுத் தண்டனையைத் தெளிவாகக் குறிக்கிறது; இது அபராதத்தையும் குறிக்கக்கூடிய பரந்த மூலத் தொடரின் சூழல்சார் வாசிப்பு.
- source_word: וְלֶאֱסוּרִין
  choice: சிறைத்தண்டனை
  rationale: சொல்லளவில் கட்டுகள் அல்லது கட்டப்படுதல் எனப் பொருள்படலாம்; நீதித்தண்டனைகளின் பட்டியலில் சிறையிடப்படுதலே இயல்பான பொருள்.
theological_decisions:
- issue: தேவனுடைய சட்டத்திற்கும் அரசனுடைய சட்டத்திற்கும் இடையிலான உறவு
  choice: இரண்டையும் இணையான முறையில், ‘உன் தேவனுடைய சட்டத்தையும் அரசனுடைய சட்டத்தையும்’ என்று மொழிபெயர்த்தல்
  alternative: அரசனுடைய சட்டம் தேவனுடைய சட்டத்தைச் செயல்படுத்துவது மட்டுமே எனவோ, ஒன்றை மற்றொன்றுக்குக் கீழ்ப்படுத்தியோ மொழிபெயர்த்தல்
  rationale: பாரசீக அரசாணையின் சொற்கள் இரண்டு சட்ட அதிகாரங்களையும் இணையாக முன்வைக்கின்றன. வசனம் வெளிப்படையாகக் கூறாத இறையியல் படிநிலையை மொழிபெயர்ப்பு சேர்க்காமல், அந்தப் பதற்றத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசாணைக்குரிய கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட வாக்கியம் வாசிக்க எளிதாக அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது. அரிதான தண்டனைச் சொல்லின் ஐயப்பாடு முதன்மை உரையில் இயல்பான பொருளாலும் அடிக்குறிப்பில் சொல்லளவுப் பொருளாலும் பாதுகாக்கப்பட்டுள்ளது.
