lexical_decisions:
- source_word: וְ/אַחַר הַ/דְּבָרִים הָ/אֵלֶּה
  choice: இந்த நிகழ்வுகளுக்குப் பிறகு
  rationale: וְ தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் தேவையற்ற தொடக்க இணைப்பைச் சேர்க்காமல் இயல்பான உரைநடையில் தொடர்ச்சி வெளிப்படுகிறது. דְּבָרִים இச்சூழலில் முந்தைய நிகழ்வுகளைக் குறிக்கிறது.
- source_word: בְּ/מַלְכוּת
  choice: ஆட்சிக்காலத்தில்
  rationale: இங்கு அரசின் நிலப்பரப்பை அல்ல, அரசன் ஆட்சி செய்த காலத்தை இந்தச் சொல் குறிக்கிறது.
- source_word: אַרְתַּחְשַׁסְתְּא מֶלֶךְ פָּרָס
  choice: பெர்சிய அரசன் அர்தசஷ்டா
  rationale: அரசப் பெயருக்கும் பெர்சியாவைக் குறிக்கும் அடைமொழிக்கும் இயல்பான தமிழ் வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֶזְרָא
  choice: எஸ்றா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: בֶּן שְׂרָיָה בֶּן עֲזַרְיָה בֶּן חִלְקִיָּה
  choice: செராயாவின் மகனும், அசரியாவின் பேரனும், இல்க்கியாவின் கொள்ளுப்பேரனுமான
  rationale: மீண்டும் வரும் בֶּן என்ற எபிரெய மரபுப்பட்டியல் சூத்திரத்தை இயல்பான தமிழில் தலைமுறை உறவுகளாக வெளிப்படுத்துகிறது; அது நேரடி மகன் உறவைத் தாண்டிய சந்ததியையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் பாதுகாக்கிறது.
