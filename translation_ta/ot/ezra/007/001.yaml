  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: ta
  text: இந்த நிகழ்வுகளுக்குப் பிறகு, பெர்சியாவின் அரசன் அர்தசஷ்டாவின் ஆட்சிக்காலத்தில், இல்க்கியாவின் மகன் அசரியாவின் மகன் செராயாவின் மகன் எஸ்றா[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுப்பட்டியல்களில் “மகன்” என்பதற்கான எபிரெயச் சொல், உடனடியான தந்தை–மகன் உறவை மட்டுமல்லாமல், பிற்காலச் சந்ததியினரையும் குறிக்கலாம்.
