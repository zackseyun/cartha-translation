translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாக ஆணையின் கண்ணியமான தொனியைப் பேணும் இயல்பான நடை. ‘வீடு’ என்பதற்குப் பதில் சூழலுக்கேற்ற ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; அரச கருவூலத்தைக் குறிக்கும் சிக்கலான மூல அமைப்பு வாசிப்புத் தெளிவுக்காகச் சீராக்கப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
