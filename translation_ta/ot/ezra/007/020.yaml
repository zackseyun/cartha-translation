base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: ta
  text: உன் கடவுளின் ஆலயத்துக்கு வேறு ஏதேனும் தேவை நீ வழங்க வேண்டியதாக ஏற்பட்டால், அதற்குத் தேவையானதை அரசரின் கருவூலத்திலிருந்து வழங்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அரசரின் கருவூலங்களின் வீட்டிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: தேவையான வேறு எதையாவது
  rationale: இணைப்புச்சொல்லும் பெயர்ச்சொற்களும் முன்பு பட்டியலிடப்பட்டவற்றுக்கு மேலான, குறிப்பிடப்படாத கூடுதல் தேவையைச் சுட்டுகின்றன. இத்தமிழாக்கம் ‘மீதியான தேவை’ என்ற சொல்லுக்குச் சொல் நடையைத் தவிர்த்து இயல்பாகப் பொருளைத் தருகிறது.
- source_word: בֵּית אֱלָהָךְ
  choice: உன் கடவுளின் ஆலயம்
  rationale: சொல்லர்த்தம் ‘உன் கடவுளின் வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால், நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: கொடுக்க வேண்டிய பொறுப்பு உனக்கு வந்தால்
  rationale: ‘உன்மேல் விழும்’ என்ற அரமேய மரபுத்தொடர் ஒருவருக்கு வந்து சேரும் கடமை அல்லது பொறுப்பைக் குறிக்கிறது. நிபந்தனைச்சார்ந்த தொடர்பையும் infinitive-இன் ‘கொடுக்க’ என்ற பொருளையும் இவ்வாறு இயல்பாகப் பாதுகாக்கிறது.
- source_word: תִּנְתֵּן
  choice: அதை ... கொடுக்க வேண்டும்
  rationale: மூலத்தில் ‘கொடு’ என்ற கருத்து வலியுறுத்தலாக மீண்டும் வருகிறது. தமிழில் முன்னுள்ள தேவையைச் சுட்ட ‘அதை’ சேர்த்து, ஆணையின் வலிமையை ‘வேண்டும்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: அரசரின் கருவூலத்திலிருந்து
  rationale: அரமேயச் சொற்றொடரின் நேர்ப்பொருள் ‘அரசரின் கருவூலங்களின் வீட்டிலிருந்து.’ அது அரச கருவூல அமைப்பைக் குறிப்பதால், இயல்பான தமிழில் ஒருமைத் தொகுப்புப்பெயராக மொழிபெயர்க்கப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
