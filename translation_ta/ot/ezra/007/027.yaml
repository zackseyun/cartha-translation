id: EZR.7.27
reference: Ezra 7:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: ta
  text: எருசலேமிலுள்ள யாவேயின் இல்லத்தை அழகுபடுத்தும் இந்த எண்ணத்தை அரசரின் உள்ளத்தில் வைத்த நம் தந்தையரின் கடவுளாகிய யாவே வாழ்த்தப்படுவாராக!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: வாழ்த்தப்படுவாராக
  rationale: இது இறைவனைப் போற்றும் வாழ்த்துரை. எபிரெயச் செயல்பாட்டு வடிவத்தையும் துதிப் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இறைவனுடைய தனிப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: நம் தந்தையரின் கடவுள்
  rationale: எபிரெய மூலத்தில் உள்ள ஆண்பால் பன்மைச் சொல்லையும் உடன்படிக்கைச் சூழலின் மரபுத் தொடரையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: இந்த எண்ணத்தை அரசரின் உள்ளத்தில் வைத்தவர்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘வைத்தார்’ என்பதையும், ‘உள்ளத்தில்’ என்பது நோக்கம் அல்லது தீர்மானத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர் என்பதையும் இயல்பான தமிழில் காட்டுகிறது. כָּזֹאת இங்கு முன்வரும் அரசரின் நோக்கத்தைக் குறிக்கும் ‘இந்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְפָאֵר
  choice: அழகுபடுத்த
  rationale: ஆலயத்தைச் சிறப்பும் அழகும் உடையதாகச் செய்வது என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘மகிமைப்படுத்த’ என்ற அதிக அருவமான பொருளை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: ‘யாவேயின் வீடு/இல்லம்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: எருசலேமிலுள்ள
  rationale: யாவேயின் இல்லம் அமைந்த இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘இல்லம்’ உருவகம்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: சூழலில் இது ஆலயத்தைக் குறித்தாலும், மூலத்தின் ‘இல்லம்’ என்ற மொழியையும் அதன் இறையியல் ஒலியையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான துதிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ‘இல்லம்’ உருவகமும் இறைத்தனிப்பெயரும் பாதுகாக்கப்பட்டுள்ளன; நீண்ட எபிரெய வாக்கியம் இயல்பான தமிழ்ச் சொல்லொழுங்கில் அமைக்கப்பட்டுள்ளது.
