base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: ta
  text: அர்த்தசஷ்டா அரசனின் ஆட்சியின் ஏழாம் ஆண்டில், இஸ்ரவேல் மக்களில் சிலரும்[a], ஆசாரியர்களில் சிலரும், லேவியர்களும், பாடகர்களும், வாயிற்காவலர்களும், ஆலயப் பணியாளர்களும்[b] எருசலேமுக்கு ஏறிப் போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் மகன்களில் சிலர்.’ எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்களில்’ என்று உள்ளது; அது அந்தக் குழுவில் ஒரு பகுதியினரை மட்டும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நெதினீமியர்.’ இது ஆலயத்தில் பணிபுரிந்த ஒரு குறிப்பிட்ட பணியாளர் பிரிவைக் குறிக்கும் தொழில்நுட்பப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ஏறிப் போனார்கள்
  rationale: எருசலேமுக்குச் செல்வதைப் பற்றிய עָלָה என்ற வினையின் நிலவியல் மற்றும் வழிபாட்டுச் சார்ந்த ‘மேலே செல்லுதல்’ நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களில் சிலர்
  rationale: מִן காட்டும் பகுதியுணர்வை ‘சிலர்’ என்று தெளிவாக்குகிறது; எபிரெயச் சொற்றொடரின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுப் பணியைச் செய்தவர்களைக் குறிக்கும் நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: குலத்தையும் ஆலயப் பணிப்பிரிவையும் குறிக்கும் பெயரின் நிலையான தமிழாக்கம்.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: இச்சொல் ஆலயப் பணியில் பாடியவர்களை குறிப்பாகக் குறிக்கிறது; பொதுவான ‘இசைக்கலைஞர்கள்’ என்பதைவிடத் துல்லியமானது.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலய வாயில்களைக் காத்த பணியாளர்களின் பொறுப்பைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினீமியர் என்ற தனிப்பட்ட ஆலயப் பணிப்பிரிவின் செயல்பாட்டை நவீன வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது; தொழில்நுட்பப் பெயர் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֶל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: இடத்தை நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: ஆட்சியின் ஏழாம் ஆண்டில்
  rationale: அரசரின் ஆண்டுக்கணக்கைக் குறிக்கும் காலத் தொடரைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: அர்தசஷ்டா அரசன்
  rationale: அரசரின் பெயரையும் பட்டத்தையும் தற்போதைய மரியாதையான தமிழ் நடையில் தருகிறது.
