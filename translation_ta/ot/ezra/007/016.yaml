revisions:
- from: மேலும், பாபிலோன் மாகாணம் முழுவதிலும் உனக்குக் கிடைக்கும் வெள்ளி, தங்கம் அனைத்தையும், எருசலேமிலுள்ள தங்கள் இறைவனின் ஆலயத்திற்காக மக்களும் குருமார்களும் மனமுவந்து அளிக்கும் காணிக்கையோடு சேர்த்து எடுத்துக்கொள்.[a]
  to: மேலும், பாபிலோன் மாகாணம் முழுவதிலும் உனக்குக் கிடைக்கும் எல்லா வெள்ளியையும் தங்கத்தையும், எருசலேமில் உள்ள தங்கள் தேவனின் ஆலயத்திற்காக மக்களும் ஆசாரியர்களும் மனமுவந்து அளிக்கும் காணிக்கையையும்,
  rationale: The revision removes the unsupported added imperative and retains the source’s syntactic continuation by ending with a comma. It renders the coordinated objects explicitly with “காணிக்கையையும்,” uses the more precise temple-priest term “ஆசாரியர்கள்,” and keeps the voluntary and temple-directed senses intact. No footnote is needed because the relevant meanings are expressed directly in the text.
