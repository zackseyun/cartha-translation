  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: ta
  text: மேலும், பாபிலோன் மாகாணம் முழுவதிலும் உனக்குக் கிடைக்கும் எல்லா வெள்ளியையும் தங்கத்தையும், எருசலேமில் உள்ள தங்கள் தேவனின் ஆலயத்திற்காக மக்களும் ஆசாரியர்களும் மனமுவந்து அளிக்கும் காணிக்கையையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל כְּסַף וּדְהַב
  choice: மேலும் ... வெள்ளி, தங்கம் அனைத்தையும்
  rationale: வாக்கியத்தை முந்தைய கட்டளையுடன் இணைக்கும் וְ என்பதையும், כֹל என்பதன் முழுமையான அளவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: דִּי תְהַשְׁכַּח
  choice: உனக்குக் கிடைக்கும்
  rationale: எஸ்றாவை நோக்கிய இரண்டாம் நபர் கூறைத் தக்கவைத்து, ‘காண்கிற’ என்பதைவிட இச்சூழலில் பெறப்படும் நிதியைக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: பாபிலோன் மாகாணம் முழுவதிலும்
  rationale: מְדִינָה என்பதன் பேரரசு நிர்வாகப் பொருளை ‘மாகாணம்’ எனத் தெளிவாகக் காட்டுகிறது.
- source_word: עִם הִתְנַדָּבוּת
  choice: மனமுவந்து அளிக்கும் காணிக்கையோடு சேர்த்து
  rationale: தன்னார்வமாக அளிக்கப்படும் வழிபாட்டுச் சார்ந்த கொடை என்ற பொருளையும், עִם குறிக்கும் சேர்க்கையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמָּא וְכָהֲנַיָּא מִתְנַדְּבִין
  choice: மக்களும் குருமார்களும் மனமுவந்து அளிக்கும்
  rationale: பங்கேற்பு வினை வடிவத்தின் தொடரும் செயற்பொருளையும், ஒரே வேர்ச்சொல்லால் உருவாகும் தன்னார்வக் கொடைச் சாயலையும் காக்கிறது.
- source_word: לְבֵית אֱלָהֲהֹם דִּי בִירוּשְׁלֶם
  choice: எருசலேமிலுள்ள தங்கள் இறைவனின் ஆலயத்திற்காக
  rationale: ‘இறைவனின் வீடு’ என்பது இங்கு ஆலயத்தைக் குறிக்கும் நிலையான பண்பாட்டு மொழிவழக்கு என்பதால், சாதாரண வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது; பன்மை உடைமை ‘தங்கள்’ எனப் பாதுகாக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழ்; நிர்வாகச் சூழலுக்கு ‘மாகாணம்’, வழிபாட்டுச் சூழலுக்கு ‘ஆலயம்’, ‘காணிக்கை’ ஆகிய பொதுவாகப் புரியும் மரியாதைமிக்க சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அராமிய வாக்கியம் முந்தைய வசனத்துடன் தொடர்வதால், தமிழில் முழுமையான கட்டளையாகப் புரிய ‘எடுத்துக்கொள்’ சேர்க்கப்பட்டுள்ளது.
