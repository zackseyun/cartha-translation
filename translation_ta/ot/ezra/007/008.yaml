  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: ta
  text: அவன் ஐந்தாம் மாதத்தில்[a] எருசலேமுக்கு வந்தான்; அது அரசனுடைய ஆட்சியின் ஏழாம் ஆண்டாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஐந்தாம் மாதத்தில் எருசலேமுக்கு வந்தடைந்தான்; அது அரசனுடைய ஆட்சியின் ஏழாம் ஆண்டாக இருந்தது.”
    reason: வருகையைச் சுட்டும் בוא என்பதற்கு ‘வந்தான்’ அல்லது நிறைவைக் கூடுதலாக வெளிப்படுத்தும் ‘வந்தடைந்தான்’ என மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பதன் எளிய இயக்கப் பொருளையும், வாவ் தொடரால் குறிக்கப்படும் அடுத்த நிகழ்வையும் இயல்பான தமிழில் தருகிறது; ‘வந்து சேர்ந்தான்’ என்பதும் சாத்தியம்.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: ஐந்தாம் மாதத்தில்
  rationale: ב முன்னிடைச்சொல்லின் காலப் பொருளையும் வரிசை எண்ணால் குறிக்கப்படும் மாதத்தையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִיא
  choice: அது
  rationale: முன்னர் கூறப்பட்ட காலக் குறிப்பை அடுத்த அரசாண்டுக் குறிப்புடன் இணைக்கும் எபிரெயப் பெண்பால் சுட்டுப்பெயரின் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: ஏழாம் ஆண்டு
  rationale: அரசாட்சிக் காலக் கணக்கில் வரும் வரிசை ஆண்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுடைய ஆட்சியின்
  rationale: அரசனைச் சார்ந்த ஆண்டு என்ற எபிரெய உறவுப் பொருளைத் தமிழில் தெளிவாக்குகிறது; சூழலிலிருந்து ‘அர்தசஷ்டா’ என்ற பெயரை இவ்வசனத்துக்குள் சேர்க்கவில்லை.
