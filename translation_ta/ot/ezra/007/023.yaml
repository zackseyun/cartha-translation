source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: ta
  text: பரலோகத்தின் தேவனால் கட்டளையிடப்படும் அனைத்தும், அரசனுடைய அரசாட்சியின்மீதும் அவனுடைய மகன்கள்மீதும் கடுங்கோபம் உண்டாகாதபடி[b], பரலோகத்தின் தேவனுடைய இல்லத்திற்காக[a] மிகுந்த அக்கறையுடன் செய்யப்படட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரலோகத்தின் தேவனுடைய இல்லம்’ என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: இன்னும் சொல்லுக்குச் சொல்லாக, ‘அரசனுடைய அரசாட்சியின்மீதும் அவனுடைய மகன்கள்மீதும் ஏன் கடுங்கோபம் உண்டாக வேண்டும்?’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: கட்டளையிடப்படும் அனைத்தும்
  rationale: இந்தத் தொடர் ‘எதுவெல்லாமோ அவையெல்லாம்’ என்ற முழுமையான உறவுப்பொருளைத் தருகிறது; ‘அனைத்தும்’ என்பது அதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן טַעַם
  choice: தேவனால் கட்டளையிடப்படும்
  rationale: טַעַם இங்கு கட்டளை அல்லது ஆணையைக் குறிக்கிறது; מִן அதன் மூலத்தைச் சுட்டுவதால் செயப்பாட்டு அமைப்பில் ‘தேவனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: பரலோகத்தின் தேவன்
  rationale: எஸ்றாவின் அரமேயப் பகுதியில் வரும் நிலையான இறைப் பட்டத்தைத் தெளிவாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: יִתְעֲבֵד
  choice: செய்யப்படட்டும்
  rationale: செயப்பாட்டு வினையின் சூழல்சார் கட்டளைப் பொருளைப் பாதுகாக்கிறது; கடமையின் அளவைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: אַדְרַזְדָּא
  choice: மிகுந்த அக்கறையுடன்
  rationale: செயலைக் கவனமாகவும் முனைப்பாகவும் துல்லியமாகவும் நிறைவேற்ற வேண்டும் என்ற நிர்வாகச் சூழலின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: לְבֵית
  choice: இல்லத்திற்காக
  rationale: மூலத்தின் ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: דִּי לְמָה
  choice: உண்டாகாதபடி
  rationale: மூலத்தில் வினாவடிவில் அமைந்த எதிர்மறை நோக்க அல்லது விளைவு எச்சரிக்கையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶהֱוֵא קְצַף
  choice: கடுங்கோபம் உண்டாக
  rationale: ‘கோபம் இருக்க/உண்டாக’ என்ற மூலப்பொருளைத் தக்கவைக்கிறது; கோபம் யாருடையது என்பதை மூலத்தைவிட வெளிப்படையாகக் குறிப்பிடவில்லை.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: அரசனுடைய அரசாட்சியின்மீது
  rationale: கோபம் அரசனின் தனிநபர்மீது மட்டுமல்லாமல் அவனுடைய ஆளுகை அல்லது அரசின்மீது வருவதைக் காட்டுகிறது.
- source_word: וּבְנוֹהִי
  choice: அவனுடைய மகன்கள்மீதும்
  rationale: ‘மகன்கள்’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘வம்சத்தார்’ என்ற விரிவான விளக்கத்தை மூலத்தில் சேர்க்கவில்லை.
theological_decisions:
- issue: בֵית אֱלָהּ שְׁמַיָּא என்ற ஆலயத் தொடரை மொழிபெயர்த்தல்
  choice: பரலோகத்தின் தேவனுடைய இல்லத்திற்காக
  alternative: பரலோகத்தின் தேவனுடைய ஆலயத்திற்காக
  rationale: இங்கு ‘இல்லம்’ என்பது ஆலயத்தைக் குறித்தாலும், முதன்மை உரையில் மூல உருவகத்தைப் பாதுகாத்து அதன் சூழல்சார் பொருளை அடிக்குறிப்பில் தருவது மூலமொழிக்கு நெருக்கமாக உள்ளது.
- issue: דִּי לְמָה לֶהֱוֵא קְצַף என்ற எச்சரிக்கைத் தொடரின் வடிவம்
  choice: கடுங்கோபம் உண்டாகாதபடி
  alternative: அரசனுடைய அரசாட்சியின்மீதும் அவனுடைய மகன்கள்மீதும் ஏன் கடுங்கோபம் உண்டாக வேண்டும்?
  rationale: அரமேயத் தொடர் சொல்லுக்குச் சொல்லாக வினாவடிவில் இருந்தாலும், அதன் சூழல்சார் நோக்கம் கோபத்தைத் தவிர்ப்பதற்கான எச்சரிக்கை. முதன்மை உரை அந்தச் செயல்பாட்டை இயல்பான தமிழில் தருகிறது; வினாவடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைக்குரிய வேதாகம நடையிலும் அமைக்கப்பட்டது. மூலத்தின் செயப்பாட்டு கட்டளைநடை, ‘இல்லம்’ என்ற உருவகம், கோபத்தின் உரிமையாளரை வெளிப்படையாகச் சொல்லாத தன்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக எச்சரிக்கைத் தொடர் முதன்மை கட்டளைக்கு முன் வைக்கப்பட்டுள்ளது.
