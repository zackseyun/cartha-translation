base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: ta
  text: 'அரசர்களின் அரசனாகிய அர்தசஷ்டா, ஆசாரியரும் பரலோகத்தின் கடவுளுடைய சட்டத்தின் எழுத்தருமான எஸ்றாவுக்கு: நிறைவான சமாதானம்[b]. இப்பொழுது—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: இது அரமேயக் கடிதங்களில் வரும் மரபுவழி வாழ்த்துரை. இதை ‘முழுமையான சமாதானம்’ என்றோ, பொருள்வழியாக ‘வாழ்த்துகள்’ என்றோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: அர்தசஷ்டா
  rationale: பாரசீக அரசரின் பெயர்; தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: அரசர்களின் அரசன்
  rationale: அரமேய அரசப் பட்டத்தை இயல்பான தமிழில் அதன் மிகைமேன்மைப் பொருள் குன்றாமல் தருகிறது.
- source_word: לְעֶזְרָ֣א
  choice: எஸ்றாவுக்கு
  rationale: לְ முன்னொட்டு கடிதம் யாருக்கு எழுதப்படுகிறது என்பதைக் குறிக்கிறது.
- source_word: כָהֲנָא
  choice: ஆசாரியர்
  rationale: மதப்பணியைக் குறிக்கும் כָהֲנָא என்பதற்கான தெளிவான, மரியாதையான தமிழ் சொல்.
- source_word: סָפַר דָּתָא
  choice: சட்டத்தின் எழுத்தர்
  rationale: סָפַר என்பதன் அடிப்படைப் பொருளான ‘எழுத்தர்’ என்பதையும், இச்சூழலில் דָּתָא குறிக்கும் தெய்வீகச் சட்டத்தையும் முறையாகப் பாதுகாக்கிறது.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: பரலோகத்தின் கடவுளுடைய
  rationale: דִּי குறிக்கும் உடைமை உறவையும் ‘பரலோகத்தின் கடவுள்’ என்ற பட்டத்தையும் நேரடியாகத் தருகிறது.
- source_word: גְּמִיר
  choice: நிறைவான
  rationale: ‘முழுமையான, நிறைவான’ என்ற பொருளை வாழ்த்துரையுடன் இணைத்துப் பாதுகாக்கிறது.
- source_word: וּכְעֶנֶת
  choice: இப்பொழுது—
  rationale: அதிகாரபூர்வ கடிதத்தின் வாழ்த்துரையிலிருந்து ஆணையின் உட்பகுதிக்கு மாறும் இடைச்சொல்; கருத்து அடுத்த வசனத்தில் தொடர்வதை நீண்ட கோடு காட்டுகிறது.
theological_decisions:
- issue: எஸ்றாவின் பணியுடன் தொடர்புடைய דָּתָא என்பதன் பொருள்
  choice: சட்டம்
  alternative: ஆணை
  rationale: இச்சொல் அரச ஆணையையும் குறிக்கக்கூடும். ஆனால் இங்கு அது ‘பரலோகத்தின் கடவுள்’ என்பதுடன் இணைந்து எஸ்றாவை விவரிப்பதால், இறைவனுடைய சட்டம் என்ற பொருள் சூழலுக்கு மிகவும் பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- issue: גְּמִיר וּכְעֶנֶת என்ற சுருக்கமான கடிதத் தொடர்
  choice: நிறைவான சமாதானம் உண்டாவதாக. இப்பொழுது—
  alternative: வாழ்த்துகள். இப்பொழுது—
  rationale: மூலத்தின் ‘நிறைவு’ மற்றும் ‘சமாதானம்’ சார்ந்த வாழ்த்துப் பொருளையும் அடுத்த பகுதிக்கான மாற்றத்தையும் பாதுகாத்து, தமிழில் புரியும் வாக்கியமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசக் கடிதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘எழுதுவது’ என்பது தமிழில் கடிதத் தலைப்பை இயல்பாக்கச் சேர்க்கப்பட்ட சொல். ஆங்கில ஆலோசனை உரையில் [a] குறியீடு அரசரின் பெயருக்குப் பின் இருந்தபோதிலும், அதன் அடிக்குறிப்பு דָּתָא பற்றியது என்பதால் தமிழில் உரிய ‘சட்டம்’ என்பதற்குப் பின் வைக்கப்பட்டது.
