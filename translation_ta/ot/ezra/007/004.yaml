  text: செரகியாவின் மகன், உஸ்ஸியின் மகன், புக்கியின் மகன்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்சவரிசைச் சூத்திரத்தில் בֶּן என்பதன் இயல்பான நேரடி பொருள் ‘மகன்’. சில வம்சவரிசைகள் தலைமுறைகளை விடுத்துக் கூறக்கூடும் என்றாலும், இங்கு மூலத்தின் உறவுமுறையை மாற்றாமல் ‘மகன்’ என வழங்கப்படுகிறது.
- source_word: זְרַחְיָה
  choice: செரகியா
  rationale: எபிரெய ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு; பெயரின் இறுதியில் உள்ள யாஹ் கூறும் பிரதிபலிக்கப்படுகிறது.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: עֻזִּי என்ற எபிரெயப் பெயரின் உயிரொலி மற்றும் மெய்யொலிக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֻּקִּי
  choice: புக்கி
  rationale: எபிரெயப் பெயரிலுள்ள வலியுறுத்தப்பட்ட க் மெய்யை இரட்டித்து, ஒலியமைப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் வடிவம்.
