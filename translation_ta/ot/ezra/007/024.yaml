  source_fidelity: மூல அரமேயத்தின் அதிகாரபூர்வ அறிவிப்பு, ஆலயச் சேவகர் பிரிவுகளின் பட்டியல், மற்றும் மூவகை வரி/கட்டணத் தடை ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘ஆகியோரில் எவர்மீதும்’ என்பது எதிர்மறை சட்டக் கூற்றில் כָל என்பதன் முழுமையான பரப்பை இயல்பாகக் காட்டுகிறது. ‘விதிக்க அதிகாரம் இல்லை’ என்பது לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם என்ற சட்ட அதிகார மறுப்பைச் சரியாகத் தருகிறது.
  naturalness: நவீனத் தரத் தமிழில் நடை தெளிவாகவும் அதிகாரபூர்வ அறிவிப்புக்கேற்றதாகவும் உள்ளது. பட்டியலும் இறுதிச் சட்டக் கூற்றும் இயல்பாக இணைகின்றன. ‘வாயிற்காவலர்கள்,’ ‘வழிச் சுங்கம்,’ மற்றும் ‘இந்தக் கடவுளின் இல்லத்தில் பணிபுரிபவர்கள்’ என்பன சூழலுக்கேற்ற புரிந்துகொள்ளத்தக்க சொற்களாக உள்ளன.
  terminology: ‘ஆசாரியர்கள்,’ ‘லேவியர்கள்,’ ‘பாடகர்கள்,’ ‘வாயிற்காவலர்கள்,’ ‘ஆலயப் பணியாளர்கள்,’ மற்றும் ‘கப்பம், வரி, வழிச் சுங்கம்’ ஆகியவை மூலத்தின் வேறுபட்ட பணிப் பிரிவுகளையும் நிதிசார் மும்மொழித் தொடரையும் பாதுகாக்கின்றன. நெதினீம் என்பதற்கான மாற்றுப் பெயர் அடிக்குறிப்பில் பொருத்தமாக வழங்கப்பட்டுள்ளது.
