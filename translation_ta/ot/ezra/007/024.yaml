translation_notes:
  register: நவீனத் தரத் தமிழில், அதிகாரபூர்வ அரசாணையின் கண்ணியமான தொனியைத் தக்கவைத்து, சாதாரண வாசகர்களுக்கும் எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பட்டியலின் தனித்தனி ஆலயப் பணிப் பிரிவுகள் வேறுபடுத்தப்பட்டுள்ளன; வரிவகைகளின் துல்லிய எல்லைகள் உறுதியற்றதால் அவை அடிக்குறிப்பில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
