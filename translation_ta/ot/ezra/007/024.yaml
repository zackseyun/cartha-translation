  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: ta
  text: மேலும், ஆசாரியர்கள், லேவியர்கள், பாடகர்கள், வாயிற்காவலர்கள், ஆலயப் பணியாளர்கள்[a], இந்தக் கடவுளின் இல்லத்தில் பணிபுரிபவர்கள் ஆகியோரில் எவர்மீதும் கப்பம், வரி, வழிச் சுங்கம்[b] ஆகியவற்றை விதிக்க அதிகாரம் இல்லை என்பதை உங்களுக்குத் தெரிவிக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரமேய மூலச்சொல் ‘நெதினீம்’ எனவும் ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த மூன்று நிதிசார் சொற்களும் வெவ்வேறு வகையான பேரரசுக் கட்டணங்களைக் குறித்திருக்கலாம்; ‘கப்பம், வரி, வழிச் சுங்கம்’ என்பவற்றை ‘கப்பம், சுங்கவரி, போக்குவரத்துக் கட்டணம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: தெரிவிக்கிறோம்
  rationale: அரசாணை சார்ந்த அதிகாரபூர்வ அறிவிப்பு நடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל
  choice: ஆகியோரில் எவர்மீதும்
  rationale: தொடர்ந்து வரும் எதிர்மறைச் சட்டக் கூற்றில், பட்டியலிடப்பட்ட எந்தப் பிரிவினர்மீதும் விதிக்கக்கூடாது என்ற முழுமையான பொருளைத் தெளிவாக்குகிறது.
- source_word: כָּהֲנַיָּא
  choice: ஆசாரியர்கள்
  rationale: ஆலய ஆசாரியப் பிரிவைக் குறிக்கும் தமிழில் பரவலாக அறியப்பட்ட சொல்.
- source_word: לֵוָיֵא
  choice: லேவியர்கள்
  rationale: லேவி குலத்தைச் சேர்ந்த ஆலயப் பணியாளர்களுக்கான வழக்கமான பெயர்ப்பு.
- source_word: זַמָּרַיָּא
  choice: பாடகர்கள்
  rationale: ஆலய இசைப் புகழ்ச்சியில் பாடியவர்களை நேரடியாகக் குறிக்கிறது.
- source_word: תָרָעַיָּא
  choice: வாயிற்காவலர்கள்
  rationale: வாயில்களைக் காத்தவர்களின் பணியைத் தெளிவாகக் கூறுகிறது.
- source_word: נְתִינַיָּא
  choice: ஆலயப் பணியாளர்கள்
  rationale: ஒலிபெயர்ப்பை மட்டும் பயன்படுத்தாமல், இக்குழுவினரின் ஆலயப் பணி சார்ந்த அடையாளத்தை வாசகருக்கு விளங்குமாறு தருகிறது; மரபுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: இந்தக் கடவுளின் இல்லத்தில் பணிபுரிபவர்கள்
  rationale: மூலத்தில் உள்ள ‘இந்தக் கடவுளின் இல்லத்தில் சேவை செய்பவர்கள்’ என்ற விரிந்த பொருளைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘மற்ற’ என்பதைச் சேர்க்கவில்லை.
- source_word: מִנְדָּה
  choice: கப்பம்
  rationale: அரசுக்கு அல்லது பேரரசுக்கு விதிக்கப்படும் கட்டாயத் தொகை என்ற நிர்வாகப் பொருளைத் தருகிறது.
- source_word: בְלוֹ
  choice: வரி
  rationale: மூன்று நிதிசார் சொற்களில் பொதுவான வரி வகையைக் குறிக்கிறது; மற்ற இரண்டிலிருந்தும் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: וַהֲלָךְ
  choice: வழிச் சுங்கம்
  rationale: பாதை, போக்குவரத்து அல்லது எல்லைக் கடத்தலுடன் தொடர்புடைய சுங்கம் என்ற சாத்தியமான பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: அவர்கள்மீது ... விதிக்க அதிகாரம் இல்லை
  rationale: இது சட்டபூர்வ அதிகாரம் மறுக்கப்படுவதைச் சொல்கிறது; வெறும் தனிப்பட்ட தடையாக மாற்றாமல் நிர்வாகத் தொனியைப் பாதுகாக்கிறது.
