base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: ta
  text: நீயோ, எஸ்றாவே, உன் கையில் உள்ள[a] உன் கடவுளின் ஞானத்தின்படி, ஆற்றுக்கு அப்பாலுள்ள[b] மக்கள் அனைவருக்கும்—உன் கடவுளின் சட்டங்களை அறிந்த அனைவருக்கும்—நீதி வழங்கும்படி நீதித்துறை அதிகாரிகளையும் நீதிபதிகளையும் நியமி. அவற்றை அறியாதவர்களுக்கு நீங்கள் கற்றுக்கொடுங்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் கையில் உள்ள’ என்பது அரமேய மரபுத்தொடர்; ‘நீ பெற்றிருக்கும்’ அல்லது ‘உன்னிடம் ஒப்படைக்கப்பட்டுள்ள’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆற்றுக்கு அப்பால்’ என்பது பாரசீக நிர்வாகத்தில் யூபிராத்து ஆற்றுக்கு மேற்கே இருந்த பிரதேசத்தைக் குறிக்கும் பெயர்.
    reason: cultural_note
  - marker: c
    text: வசனத்தின் தொடக்கத்தில் எஸ்றா ஒருமையில் அழைக்கப்படுகிறார்; ஆனால் ‘கற்றுக்கொடுங்கள்’ என்பது அரமேய மூலத்தில் பன்மையில் உள்ளது. இது எஸ்றாவையும் அவருடன் பணியாற்றுவோரையும் குறிக்கலாம்.
    reason: textual_grammar
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: உன் கடவுளின் ஞானத்தின்படி
  rationale: כְּ என்பது ஒன்றுக்கு ஏற்ப அல்லது அதன்படி செயல்படுவதைக் குறிக்கிறது. ‘ஞானத்தின்படி’ என்பது அந்த உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: דִּי בִידָךְ
  choice: உன் கையில் உள்ள
  rationale: மூலத்தின் ‘உன் கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; இது உடைமையையோ ஒப்படைக்கப்பட்ட அதிகாரத்தையோ குறிக்கக்கூடிய அரமேய மரபுத்தொடர்.
- source_word: מֶנִּי
  choice: நியமி
  rationale: நிர்வாகச் சூழலில் அதிகாரிகளைப் பதவியில் அமர்த்துவதைக் குறிக்கும் தெளிவான நவீனத் தமிழ் வினை.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: நீதித்துறை அதிகாரிகளையும் நீதிபதிகளையும்
  rationale: இரண்டு சட்ட நிர்வாகப் பதவிகளையும் ஒன்றாகச் சுருக்காமல் வேறுபடுத்திக் காட்டுகிறது; ‘மாகிஸ்திரேட்டுகள்’ என்பதைவிட பொதுவாசகருக்கு எளிதில் புரியும்.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: நீதி வழங்கும்படி
  rationale: நியமிக்கப்படுவோரின் பணியையும் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְכָל עַמָּה
  choice: மக்கள் அனைவருக்கும்
  rationale: கூட்டொருமையான ‘மக்கள் முழுவதையும்’ தமிழில் இயல்பான வகையில் தருகிறது.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள
  rationale: பாரசீகப் பேரரசின் பார்வையில் யூபிராத்துக்கு மேற்கிலிருந்த நிர்வாகப் பகுதியைக் குறிக்கும் பெயர்போன்ற சொற்றொடரைத் தக்கவைக்கிறது.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: உன் கடவுளின் சட்டங்களை அறிந்த அனைவருக்கும்
  rationale: דָּתֵי என்பதன் பன்மையை ‘சட்டங்கள்’ என்று காத்து, சட்ட-சமயச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וְדִי לָא יָדַע
  choice: அவற்றை அறியாதவர்களுக்கு
  rationale: முன்னர் குறிப்பிடப்பட்ட கடவுளின் சட்டங்களையே ‘அவற்றை’ என்பது சுட்டுகிறது; தமிழில் தேவையான செயப்படுபொருளை வெளிப்படையாக்குகிறது.
- source_word: תְּהוֹדְעוּן
  choice: நீங்கள் கற்றுக்கொடுங்கள்
  rationale: ידע என்பதன் காரணவினை வடிவம் ‘அறியச் செய்’ என்று பொருள்படும்; சட்டங்களின் சூழலில் ‘கற்றுக்கொடுங்கள்’ இயல்பானது. மூலத்தில் இங்கு காணப்படும் பன்மை அழைப்பையும் காக்கிறது.
theological_decisions:
- issue: ‘உன் கையில் உள்ள’ என்ற சொற்றொடரின் பொருள்
  choice: மூல உருவகத்தை உரையில் தக்கவைத்து, அதன் பொருள் வரம்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘நீ பெற்றிருக்கும்’ அல்லது ‘உன்னிடம் ஒப்படைக்கப்பட்டுள்ள’ என்று நேரடியாகப் பொருள்படுத்துதல்
  rationale: இது உடைமை, பெற்ற ஞானம், அல்லது ஒப்படைக்கப்பட்ட அதிகாரம் ஆகிய நுணுக்கங்களைத் தாங்கலாம்; அவற்றில் ஒன்றை மட்டும் உரையில் உறுதிப்படுத்துவது மூலத்தின் திறந்த தன்மையைச் சுருக்கும்.
- issue: எஸ்றாவை ஒருமையில் அழைத்த பின் இறுதி வினை பன்மையில் வருதல்
  choice: ‘நீங்கள் கற்றுக்கொடுங்கள்’ என்று பன்மையைப் பாதுகாத்தல்
  alternative: முழு வசனத்துக்கும் இசைவாக ‘நீ கற்றுக்கொடு’ என்று ஒருமைப்படுத்துதல்
  rationale: அரமேய உரை தொடக்கத்திலும் ‘நியமி’ என்பதிலும் எஸ்றாவை ஒருமையில் குறிப்பிடுகிறது; ஆனால் இறுதியில் பன்மை வினை வருகிறது. இது எஸ்றாவையும் அவருடன் பணியாற்றுவோரையும் உள்ளடக்கக்கூடும்; அந்த இலக்கண மாற்றத்தை அமைதியாக நீக்காமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிர்வாக-சட்ட நடையைப் பயன்படுத்துகிறது. ‘நீதித்துறை அதிகாரிகள்’ என்பது அரிதான அயல்மொழிப் பதவிப்பெயரைத் தவிர்த்து முதல் அதிகாரி வகையை வேறுபடுத்துகிறது. மூலத்தின் ஒருமை–பன்மை மாறுபாடும் ‘கையில்’ என்ற உருவகமும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
