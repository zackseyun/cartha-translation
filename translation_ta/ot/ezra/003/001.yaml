base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: ta
  text: ஏழாம் மாதம் வந்தபோது, இஸ்ரவேலின் மகன்கள்[a] நகரங்களில் இருந்தார்கள். அப்போது மக்கள் ஒரே மனிதனைப்போல்[b] எருசலேமுக்கு ஒன்றுகூடி வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “ஒரே மனிதனைப்போல்” என்பது அவர்கள் ஒருமனப்பட்டு, ஒன்றுபட்டுச் செயல்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: வந்தபோது
  rationale: נגע என்பதன் அடிப்படைப் பொருள் ‘தொடு/எட்டு’ என்பதாக இருந்தாலும், காலத்தைக் குறிக்கும் ‘ஏழாம் மாதம்’ என்பதோடு இது அந்த மாதம் ‘வந்தபோது’ என்ற இயல்பான காலப்பொருளைத் தருகிறது.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதம்
  rationale: எபிரெய வரிசை எண்ணையும் ‘மாதம்’ என்ற பொதுப்பெயரையும் நேரடியாகத் தக்கவைக்கிறது; பிற்கால மாதப்பெயர் சேர்க்கப்படவில்லை.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தின் ஆண்பால் பன்மையான ‘மகன்கள்’ என்ற வடிவத்தை வெளிப்படையாகத் தக்கவைக்கிறது; ‘இஸ்ரவேலர்கள்’ என்பது அடிக்குறிப்பில் இயல்பான மாற்றாக வழங்கப்படுகிறது.
- source_word: בֶּעָרִים
  choice: நகரங்களில் இருந்தார்கள்
  rationale: எபிரெயத்தில் வெளிப்படையாக இல்லாத இணைப்புவினை தமிழில் முழுமையான வாக்கியத்திற்காக வழங்கப்படுகிறது. ‘அவர்களுடைய’ என்பது மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடி வந்தார்கள்
  rationale: Niphal வடிவம் மக்கள் கூடிவந்த கூட்டுச் செயலைக் குறிக்கிறது. அடுத்துள்ள இலக்கான எருசலேமுக்கான நகர்வையும் இயல்பான தமிழில் வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: திரும்பிவந்த சமூகத்தை மொத்தமாகக் குறிக்கும் எளிய, இயல்பான கூட்டுப்பெயர்.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: ‘ஒரே மனிதனைப்போல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, மக்களின் ஒருமித்த செயலைக் காட்டுகிறது; அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֶל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: אֶל குறிக்கும் இலக்கை நோக்கிய நகர்வை தமிழின் வேற்றுமை உருபான ‘-க்கு’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל மற்றும் כְּאִישׁ אֶחָד ஆகியவற்றிலுள்ள ஆண்பால் சார்ந்த கூட்டுமொழி
  choice: முதன்மை உரையில் ‘இஸ்ரவேலின் மகன்கள்’ மற்றும் ‘ஒரே மனிதனைப்போல்’ என்று தக்கவைத்தல்
  alternative: ‘இஸ்ரவேலர்கள்’ மற்றும் ‘ஒருமனதாக’
  rationale: மூலத்தின் ஆண்பால் வடிவங்களையும் உருவகத்தையும் மறைக்காமல் காட்டுகிறது. அதேவேளையில், இவை சமூகமெங்கும் ஒன்றுபட்டுச் செயல்பட்டதைக் குறிக்கும் வழக்குச் சொற்கள் என்பதை அடிக்குறிப்புகள் தெளிவுபடுத்துகின்றன; எந்தக் குறிப்பிட்ட சமயக் கோட்பாடும் இதில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் நீண்ட இணைப்பை தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்து, ‘அப்போது’ என்ற இயல்பான தொடர்புச்சொல் பயன்படுத்தப்பட்டுள்ளது. மூலத்திலுள்ள இலக்கை நோக்கிய நகர்வு ‘எருசலேமுக்கு’ என்பதால் தக்கவைக்கப்பட்டுள்ளது.
