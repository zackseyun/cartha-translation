  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: ta
  text: அதற்குப் பிறகு, வழக்கமாகச் செலுத்தப்படும் தகனபலியையும்[a], மாதப்பிறப்பு நாட்களுக்கான பலிகளையும்[b], யாவேக்கெனப் பரிசுத்தமாக்கப்பட்ட நியமிக்கப்பட்ட பண்டிகைகள் அனைத்திற்குமான பலிகளையும்[c], மனமுவந்து யாவேக்குத் தன்னார்வக் காணிக்கை செலுத்திய அனைவரின் காணிக்கைகளையும் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடர்ந்து செலுத்தப்படும் தகனபலி’ அல்லது ‘தினந்தோறும் செலுத்தப்படும் தகனபலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘புதுநிலவுகள்’; இது ஒவ்வொரு மாதத்தின் தொடக்கத்திலும் கடைப்பிடிக்கப்பட்ட புனித வழிபாட்டு நாட்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘யாவேயின் நியமிக்கப்பட்ட காலங்கள் அனைத்திற்குமான பலிகள்’ அல்லது ‘யாவேயின் திருவிழாக்கள் அனைத்திற்குமான பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பலிச் செயல்களைத் தொடர்ந்து நடந்தவற்றை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: עֹלַת תָּמִיד
  choice: வழக்கமாகச் செலுத்தப்படும் தகனபலி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலியையும், תָּמִיד தொடர்ந்து அல்லது ஒழுங்காக நிகழ்வதையும் குறிக்கிறது; ‘தினந்தோறும்’ என்று எபிரெயச் சொல்லைவிட மிகத் துல்லியமாக வரையறுக்காமல் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֶחֳדָשִׁים
  choice: மாதப்பிறப்பு நாட்களுக்கான பலிகள்
  rationale: இங்கு חֹדֶשׁ பொதுவாக மாதங்களை அல்ல, ஒவ்வொரு மாதத்தின் தொடக்கத்தில் கடைப்பிடிக்கப்பட்ட புதுநிலவு வழிபாட்டு நாட்களைக் குறிக்கிறது. தமிழில் புரியத்தக்க வகையில் ‘மாதப்பிறப்பு நாட்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: யாவேக்கென ... நியமிக்கப்பட்ட பண்டிகைகள் அனைத்திற்குமான பலிகள்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட காலத்தையும், இச்சூழலில் அந்தக் காலங்களில் கடைப்பிடிக்கப்பட்ட திருவிழாக்களையும் குறிக்கிறது. பலிகள் என்பது எபிரெய வாக்கியத்தில் சூழலால் உணர்த்தப்படுவதால் தமிழில் தெளிவுக்காக நிரப்பப்பட்டுள்ளது.
- source_word: הַמְקֻדָּשִׁים
  choice: பரிசுத்தமாக்கப்பட்ட
  rationale: நியமிக்கப்பட்ட காலங்கள் அல்லது பண்டிகைகள் புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைக்கப்பட்டிருந்ததைச் சுட்டும் செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பேணுகிறது.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: மனமுவந்து விருப்பக் காணிக்கை செலுத்திய ஒவ்வொருவரின் காணிக்கை
  rationale: மூலத்தில் ஒரே வேர் சார்ந்த வினை மற்றும் பெயர்ச்சொல் இணைந்து காணிக்கையின் தன்னார்வத் தன்மையை வலியுறுத்துகின்றன. தமிழில் இயல்பாகவும் அந்த வலியுறுத்தலைப் பேணவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பெயரான יהוה ஒலிபெயர்த்து ‘யாவே’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டமல்லாமல் நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது; எனவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
- issue: תָּמִיד என்பதன் காலவியல் நுணுக்கம்
  choice: வழக்கமாகச் செலுத்தப்படும்
  alternative: தினந்தோறும் செலுத்தப்படும்
  rationale: வழிபாட்டு நடைமுறையில் இது தினசரிப் பலியைக் குறிக்கலாம்; ஆனால் சொல்லின் நேரடிப் பொருள் தொடர்ச்சியான அல்லது ஒழுங்காக நிகழும் செயலைக் குறிக்கிறது. ஆகவே மூலத்தின் பரந்த பொருள் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டுள்ளது. மூல வாக்கியத்தில் முந்தைய சூழலிலிருந்து எடுத்துக்கொள்ளப்படும் ‘செலுத்தினார்கள்’ என்ற வினையும் இணையான தொடர்களில் உணர்த்தப்படும் ‘பலிகள்’ என்பதும் தமிழின் தெளிவுக்காக வெளிப்படையாக வழங்கப்பட்டுள்ளன. ‘தகனபலி’, ‘விருப்பக் காணிக்கை’ ஆகியவை வழிபாட்டு நுட்பச்சொற்களாக இருந்தாலும் சூழலில் எளிதில் புரியும் வகையில் வைக்கப்பட்டுள்ளன.
