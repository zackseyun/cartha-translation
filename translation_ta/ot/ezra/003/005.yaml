  source_fidelity: மூலத்தின் வரிசை, பலிவகைகள், யாவே என்ற இறைப் பெயர், மற்றும் தன்னார்வக் காணிக்கையின் கருத்து பெரும்பாலும் துல்லியமாகப் பேணப்பட்டுள்ளன. ஆனால் வினைச்சொல்-பெயர்ச்சொல் இணைப்பில் ‘மனமுவந்து விருப்பக் காணிக்கை செலுத்திய ஒவ்வொருவரின் காணிக்கையையும்’ என்பது மூலத்தின் ஒரே வேர் வழியிலான வலியுறுத்தலைச் சற்றே மங்கலாக்குகிறது; மேலும் ‘ஒவ்வொருவரின் காணிக்கை’ இயல்பாக அந்த நபருக்குச் சொந்தமான காணிக்கை என்ற பொருளைத் தரக்கூடும்.
