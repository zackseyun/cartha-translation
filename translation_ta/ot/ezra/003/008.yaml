  terminology: “தேவனுடைய இல்லம்,” “லேவியர்கள்,” “சிறையிருப்பு,” மற்றும் இறைநாமமான “யாவே” ஆகியவை ஒத்திசைவாகவும் பொருத்தமாகவும் உள்ளன. பெயர்வடிவங்கள் ஏற்கத்தக்கவை. அடிக்குறிப்பு מֵהַשְּׁבִי-யின் செல்லத்தக்க மாற்றுப் பொருளைச் சுருக்கமாகக் குறிக்கிறது.
