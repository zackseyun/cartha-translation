base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: ta
  text: அவர்கள் எருசலேமிலுள்ள தேவனுடைய இல்லத்திற்கு வந்து சேர்ந்த இரண்டாம் ஆண்டின் இரண்டாம் மாதத்தில், செயல்தியேலின் மகன் செருபாபேலும், யோசாதாக்கின் மகன் யேசுவாவும், அவர்களுடைய மற்ற சகோதரர்களான ஆசாரியர்களும் லேவியர்களும், சிறையிருப்பிலிருந்து[a] எருசலேமுக்கு வந்திருந்த அனைவரும் பணியைத் தொடங்கினார்கள். மேலும், யாவேயின் இல்லத்தின் பணியை மேற்பார்வையிட இருபது வயதுமுதல் அதற்கு மேற்பட்ட வயதுடைய லேவியர்களை நியமித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகடத்தப்பட்ட நிலையிலிருந்து.”
    reason: מֵהַשְּׁבִי என்பது சிறையிருப்பு அல்லது நாடுகடத்தப்பட்ட வாழ்நிலை என்ற நெருக்கமான பொருட்களை ஏற்கக்கூடியது.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: வந்து சேர்ந்த
  rationale: லְ முன்னொட்டுடன் வரும் infinitive construct இங்கு காலத்தைக் குறிக்கிறது; தமிழில் ஆண்டைக் குறிக்கும் தொடரோடு இயல்பாக அமைய ‘வந்து சேர்ந்த’ என வழங்கப்பட்டது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: ‘ஆலயம்’ என்பது சூழலுக்கு ஏற்றதாயினும் விளக்க மொழிபெயர்ப்பு; எபிரெயச் சொல்லின் ‘வீடு/இல்லம்’ உருவகத்தைத் தக்கவைக்க ‘இல்லம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֵחֵלּוּ
  choice: பணியைத் தொடங்கினார்கள்
  rationale: எபிரெயத்தில் வினையின் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், வசனத்தின் இறுதியில் குறிப்பிடப்படும் கட்டுமானப் பணியே சூழலில் இயல்பாகப் புரிகிறது; தமிழில் முழுமையான வாக்கியத்திற்காக ‘பணியை’ சேர்க்கப்பட்டது.
- source_word: וַיַּעֲמִידוּ
  choice: நியமித்தார்கள்
  rationale: ஒரு பொறுப்புக்காக ஒருவரை நிலைநிறுத்துதல் என்ற Hiphil பொருள் இங்கு நிர்வாக நியமனத்தைக் குறிக்கிறது.
- source_word: אֶת הַלְוִיִּם
  choice: லேவியர்களை
  rationale: குலத்தையும் வழிபாட்டுப் பணியையும் குறிக்கும் பெயர் வழக்கமான தமிழ் வடிவில் வழங்கப்பட்டது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: வயதின் கீழ் எல்லையைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: לְנַצֵּחַ
  choice: மேற்பார்வையிட
  rationale: இச்சூழலில் இசை நடத்துதலை அல்ல, கட்டுமான வேலையின் மேற்பார்வைப் பொறுப்பைக் குறிக்கிறது.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: யாவேயின் இல்லத்திற்கான பணி
  rationale: מְלֶאכֶת என்பதன் வேலை/உழைப்பு பொருளையும், இங்கு இல்லத்தின் கட்டுமானம் தொடர்பான பணியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரான நான்கு எழுத்து இறைநாமத்தை பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய மற்ற சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் உறவுமுறைச் சொல்லையும் தக்கவைக்கிறது.
- source_word: מֵהַשְּׁבִי
  choice: சிறையிருப்பிலிருந்து
  rationale: சிறைப்பட்ட நிலை அல்லது நாடுகடத்தப்பட்ட வாழ்நிலையைக் குறிக்கும் சொல்லை மூலத்திற்கு நெருக்கமாக வழங்குகிறது; மாற்று அர்த்தம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் பொதுப்பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே அதை மறைக்காமல் தமிழ் ஒலிவடிவில் தருகிறது.
- issue: בֵּית הָאֱלֹהִים என்பதைக் ‘ஆலயம்’ என்று விளக்குவதா
  choice: தேவனுடைய இல்லம்
  alternative: தேவனுடைய ஆலயம்
  rationale: இது ஆலயத் தளத்தைக் குறித்தாலும், மூலத்தின் ‘இல்லம்’ என்ற உடன்படிக்கை மற்றும் வழிபாட்டு மொழியைத் தக்கவைத்து, தேவையற்ற விளக்கத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டது. பெயர்கள் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாக அமைக்கப்பட்டன; ‘இல்லம்’ என்ற மூல உருவகம் இரு இடங்களிலும் தக்கவைக்கப்பட்டது.
