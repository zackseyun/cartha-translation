  source_fidelity: மொத்தத்தில் மூலத்தின் காலக் குறிப்பு, பங்கேற்பாளர்களின் பட்டியல், சிறையிருப்பிலிருந்து எருசலேமுக்கு வந்தோர், லேவியரின் வயது வரம்பு, மற்றும் மேற்பார்வைப் பொறுப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் “இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய” என்பது வயது வரம்பை இயல்பாகவும் இலக்கணத் தெளிவுடனும் தெரிவிக்கவில்லை. மேலும், מְלֶאכֶת בֵּית יְהוָה என்பதற்குத் “யாவேயின் இல்லத்தின் பணி” என்பது மூலத்தின் உறவைத் தெளிவாகவும் நெருக்கமாகவும் காட்டுகிறது.
