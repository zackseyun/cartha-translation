translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆரவாரம்’ மகிழ்ச்சிக் கூச்சலையும் அதன் பெரும் ஒலியையும் தாங்குகிறது; ‘வேறுபடுத்தி அறிய’ என்பது சூழலில் உள்ள இரு சத்தங்களைப் பிரித்துணர முடியாமையைத் தெளிவாக்குகிறது.
