base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: ta
  text: மகிழ்ச்சியின் ஆரவாரத்தையும் மக்களின் அழுகைச் சத்தத்தையும் மக்களால் வேறுபடுத்தி அறிய முடியவில்லை[a]. ஏனெனில் மக்கள் மிகுந்த ஆரவாரம் எழுப்பினார்கள்[b]; அந்தச் சத்தம் வெகுதூரம் வரை கேட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிழ்ச்சியான ஆரவாரத்தையும் மக்களின் அழுகைச் சத்தத்தையும் மக்களால் அடையாளம் காண முடியவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘மிகுந்த ஆரவாரத்துடன் ஆரவாரம் எழுப்பினார்கள்’; இதை ‘உரத்த ஆரவாரம் எழுப்பினார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: வேறுபடுத்தி அறிய முடியவில்லை
  rationale: இங்கு הפעיל வடிவம் இரண்டு சத்தங்களையும் ஒன்றிலிருந்து மற்றொன்றாகப் பிரித்துணரும் திறனைச் சுட்டுகிறது; ‘வேறுபடுத்தி அறிதல்’ இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: קוֹל
  choice: சத்தம்
  rationale: பேச்சின் உள்ளடக்கத்தைவிடக் கேட்கப்படும் ஒலியே இங்கு கருத்தாக இருப்பதால், நவீன தமிழில் இயல்பான ‘சத்தம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: மகிழ்ச்சி ஆரவாரத்தின் சத்தம்
  rationale: תְּרוּעָה என்பது உரத்த ஆரவாரத்தைக் குறிக்கிறது; மகிழ்ச்சியுடனான அதன் தொடர்பையும் பெயர்ச்சொல் அமைப்பையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: மக்களின் அழுகைச் சத்தம்
  rationale: இரண்டு கேட்கக்கூடிய சத்தங்களுக்கிடையிலான ஒப்பீட்டைத் தெளிவாக வைத்தபடி, בְּכִי என்பதன் உணர்ச்சிசார் வலிமையை ‘அழுகை’ காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ பொருத்தமானது.
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: பேராரவாரம் செய்தார்கள்
  rationale: எபிரெயச் சொற்பிறப்புத் தொடர்பையும் பெரும், உரத்த கூச்சலின் கருத்தையும் தமிழில் இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: נִשְׁמַע
  choice: கேட்டது
  rationale: எபிரெய நிஃபால் வடிவத்தின் கேட்கப்படுதல் என்னும் கருத்தை இயல்பான தமிழ் வாக்கியத்தில் தெரிவிக்கிறது.
- source_word: עַד לְמֵרָחוֹק
  choice: வெகுதூரம்வரை
  rationale: சத்தம் தொலைதூரம் வரை சென்றடைந்து கேட்கப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
