source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: ta
  text: அவர்கள் பலிபீடத்தை அதன் அடித்தளங்களின்மேல்[a] நிலைநிறுத்தினார்கள். தேசங்களின் மக்களைக் கண்டு அவர்களுக்கு அச்சம் இருந்ததால், அதன்மேல் யாவேக்கு எரிபலிகளைச் செலுத்தினார்கள்—காலையிலும் மாலையிலும் எரிபலிகளைச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் அடிப்பகுதியின்மேல்’ அல்லது ‘அதற்கென நிர்ணயிக்கப்பட்ட இடத்தில்.’
    reason: מְכוֹנוֹתָיו என்பதன் பொருள் அடித்தளம், தாங்கும் அடிப்பகுதி, அல்லது நிலையான இடம் என அமையலாம்.
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: நிலைநிறுத்தினார்கள்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு பலிபீடத்தை உரிய இடத்தில் அமைத்து பயன்பாட்டுக்குத் தயாராக்குவதைக் குறிக்கிறது. ‘நிலைநிறுத்தினார்கள்’ என்பது நிறுவுதல் மற்றும் உறுதியாக அமைத்தல் ஆகிய இரு நுட்பங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடத்தை
  rationale: பலியிடும் சூழலில் מזבח என்பதற்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: עַל מְכ֣וֹנֹתָיו
  choice: அதன் அடித்தளங்களின்மேல்
  rationale: מְכוֹנוֹתָיו என்பது அதன் அடித்தளங்கள், தாங்கும் அடிப்பகுதிகள், அல்லது நிர்ணயிக்கப்பட்ட இடம் எனப் பொருள்படலாம். பன்மையையும் உருவகத்தின் திடத்தன்மையையும் இத்தேர்வு காக்கிறது.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: சுற்றியிருந்த தேசங்களின் மக்களால் அவர்கள்மேல் அச்சம் படர்ந்திருந்ததால்
  rationale: எபிரெய மொழியின் ‘அவர்கள்மேல் அச்சம்’ என்ற அமைப்பைத் தமிழில் புரியக்கூடிய வகையில் காக்கிறது. מִן அச்சத்தின் மூலத்தையோ காரணத்தையோ குறிக்கிறது; சூழலில் அருகிலுள்ள பல பிராந்திய மக்களைக் குறிப்பதால் ‘சுற்றியிருந்த’ என்பது வெளிப்படையாகிறது.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: அதன்மேல் ... எரிபலிகளைச் செலுத்தினார்கள்
  rationale: עלה என்பதன் ஹிஃபில் வடிவமும் עֹלוֹת என்பதும் சேர்ந்து முழுவதும் எரிக்கப்படும் பலிகளைச் செலுத்துவதற்கான வழக்கமான எபிரெய சொற்றொடராகும். தொடரும் கூட்டு எழுவாயைத் தமிழில் பன்மையாகக் கொள்வது இயல்பு.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் எளிதாக உச்சரிக்கக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: காலையிலும் மாலையிலும் செலுத்த வேண்டிய எரிபலிகளை
  rationale: மூலத்தில் עֹלוֹת மீண்டும் வருவதைத் தமிழிலும் மீட்டுரைத்து, அன்றாட காலை மற்றும் மாலை பலிகளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதைப் பொதுப் பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: அச்சத்துக்கும் பலிபீடம் அமைத்தலுக்கும் உள்ள தொடர்பு
  choice: அச்சம் இருந்ததால் அவர்கள் பலிபீடத்தை அமைத்து பலியிட்டார்கள் என்ற மூலத்தின் காரணத் தொடர்பை அப்படியே வைத்தல்
  alternative: அச்சம் இருந்தபோதிலும் அவர்கள் பலிபீடத்தை அமைத்தார்கள்
  rationale: כִּי பொதுவாக காரணத்தை அறிமுகப்படுத்துகிறது; ‘இருந்தபோதிலும்’ என மாற்றுவது மூலத்தில் வெளிப்படையாக இல்லாத concessive பொருளைச் சேர்க்கும். வசனத்தில் உள்ள பதற்றம் விளக்கித் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மொழியின் ‘அவர்கள்மேல் அச்சம்’ என்ற உருவகம் இயல்பான தமிழில் ஓரளவு பாதுகாக்கப்பட்டுள்ளது; காலை–மாலை எரிபலிகளைக் குறிக்கும் இறுதி மீட்டுரை விடப்படவில்லை.
