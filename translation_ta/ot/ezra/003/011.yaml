  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: ta
  text: 'அவர்கள் யாவேயைப் புகழ்ந்து நன்றி செலுத்தி, மாறிமாறிப் பாடினார்கள்[a]: “அவர் நல்லவர்; இஸ்ரவேல்மீது அவர் காட்டும் மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது[b].” யாவேயின் ஆலயம் நிறுவப்பட்டதால்[c], மக்கள் அனைவரும் யாவேயைப் புகழ்ந்து பெரும் முழக்கமிட்டார்கள்.


    [a] அல்லது, “மறுமொழி கூறினார்கள்.” இங்கு வரும் எபிரெய வினைச்சொல் “பதிலளித்தார்கள்” அல்லது “மறுமொழி கூறினார்கள்” என்றும் பொருள்படும்; இந்த வழிபாட்டுச் சூழலில் அவர்கள் மாறிமாறிப் புகழ்ந்து பாடியதைக் குறிக்கலாம்.


    [b] இன்னொரு விதமாக, “இஸ்ரவேல்மீது அவர் காட்டும் மாறாத அன்பு என்றென்றும் உள்ளது.”


    [c] எழுத்துப்படி, “யாவேயின் இல்லம் நிறுவப்பட்டதால்.” இச்சூழலில் இது ஆலயத்தின் அடித்தளம் இடப்பட்டதைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறுமொழி கூறினார்கள்.” இங்கு வரும் எபிரெய வினைச்சொல் “பதிலளித்தார்கள்” அல்லது “மறுமொழி கூறினார்கள்” என்றும் பொருள்படும்; இந்த வழிபாட்டுச் சூழலில் அவர்கள் மாறிமாறிப் புகழ்ந்து பாடியதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னொரு விதமாக, “இஸ்ரவேல்மீது அவர் காட்டும் மாறாத அன்பு என்றென்றும் உள்ளது.”
    reason: lexical_alternative
  - marker: c
    text: எழுத்துப்படி, “யாவேயின் இல்லம் நிறுவப்பட்டதால்.” இச்சூழலில் இது ஆலயத்தின் அடித்தளம் இடப்பட்டதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: மாறிமாறிப் பாடினார்கள்
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘மறுமொழி கூறுதல்.’ புகழ்ச்சி சார்ந்த இவ்வழிபாட்டுச் சூழலில் எதிரொலிப்பாக அல்லது மாறிமாறிப் பாடிய செயலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; அடிப்படைச் சொல்லாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: புகழ்ந்து நன்றி செலுத்தி
  rationale: புகழ்தல், நன்றி செலுத்துதல் என்ற இரு தனித்த வழிபாட்டுச் செயல்களையும் வினை வடிவில் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைபெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי טוֹב
  choice: அவர் நல்லவர்
  rationale: எபிரெய மொழியில் மறைந்துள்ள எழுவாயையும் இணைப்பையும் தமிழில் தெளிவாக்கி, வழக்கமான துதிப்பிரகடனத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேல்மீது அவர் காட்டும் மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது
  rationale: חסד என்பதிலுள்ள உறுதியான விசுவாச அன்பின் கருத்தை ‘மாறாத அன்பு’ எனத் தருகிறது; עַל என்பதன் தொடர்பை ‘இஸ்ரவேல்மீது’ எனக் காக்கிறது; לְעוֹלָם என்பதன் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: பெரும் ஆரவாரம் செய்தார்கள்
  rationale: எபிரெயத்தின் ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தும் வலியுறுத்தலை சொல்லுக்குச் சொல் செயற்கையாகப் பின்பற்றாமல், அதன் தீவிரத்தை ‘பெரும் ஆரவாரம்’ என இயல்பாகத் தருகிறது.
- source_word: בְּהַלֵּל לַיהוָה
  choice: யாவேயைப் புகழ்ந்து
  rationale: மக்களின் ஆரவாரம் யாவேக்குச் செலுத்திய புகழ்ச்சி என்பதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: யாவேயின் ஆலயம் நிறுவப்பட்டதால்
  rationale: Hophal வடிவின் ‘நிறுவப்பட்டது’ என்ற பொருளை முதன்மை உரையில் காக்கிறது; வரலாற்றுச் சூழலில் அடித்தளம் இடப்பட்டதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யாவே’ என்பது Yahweh என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- issue: חַסְדּוֹ என்பதன் உடன்படிக்கை சார்ந்த பொருள்
  choice: அவர் காட்டும் மாறாத அன்பு
  alternative: அவருடைய இரக்கம் / உடன்படிக்கை அன்பு
  rationale: இச்சொல்லிலுள்ள நிலைத்த விசுவாசம், அன்பு, நன்மை ஆகிய பரந்த கருத்துகளை ஒரே கோட்பாட்டுச் சொல்லால் குறுக்காமல், சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது.
- issue: ஆலயம் ‘நிறுவப்பட்டது’ என்பதன் அளவு
  choice: மூலத்தின் ‘ஆலயம் நிறுவப்பட்டது’ என்ற கூறை முதன்மை உரையில் வைத்தல்
  alternative: ஆலயத்தின் அடித்தளம் இடப்பட்டது
  rationale: הוּסַד என்ற வினையின் வடிவை முதன்மை உரையில் காக்கிறது; இங்கு கட்டிடம் முழுமையடைந்ததாகத் தவறாகப் புரிந்துகொள்ளாதபடி வரலாற்றுச் சூழலை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் இயல்பானதும் மரியாதைமிக்கதுமான நடையைக் கடைப்பிடிக்கிறது. வழிபாட்டுச் சூழலின் உயர்வைத் தக்கவைத்தபோதும் பழமையான அல்லது பிரிவுசார் சொற்களைத் தவிர்க்கிறது. மூலத்தின் சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
