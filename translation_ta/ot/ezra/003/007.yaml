translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘யாப்போ,’ ‘சீதோன்,’ ‘தீரு,’ ‘கோரேசு’ ஆகியவை பரவலான தமிழ் வேதாகமப் பெயர்வடிவங்களுக்கு ஏற்றவாறு பயன்படுத்தப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
