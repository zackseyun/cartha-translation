  to: ஆகவே, அவர்கள் கல் வெட்டுபவர்களுக்கும் கைவினைஞர்களுக்கும் பணம்[a] கொடுத்தார்கள்; லெபனோனிலிருந்து கேதுரு மரக்கட்டைகளை யாப்போவின் கடற்கரைக்குக்[b] கொண்டுவருவதற்காக சீதோனியர்களுக்கும் தீரியர்களுக்கும் உணவும் பானமும் எண்ணெயும் கொடுத்தார்கள்; பெர்சிய அரசன் கோரேசு அவர்களுக்கு அளித்த அனுமதியின்படியே இதைச் செய்தார்கள்.[c]
