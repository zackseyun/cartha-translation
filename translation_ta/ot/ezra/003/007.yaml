base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: ta
  text: ஆகவே, அவர்கள் கல் வெட்டுபவர்களுக்கும் கைவினைஞர்களுக்கும் பணம்[a] கொடுத்தார்கள்; லெபனோனிலிருந்து கேதுரு மரக்கட்டைகளை யாப்போவின் கடற்கரைக்குக்[b] கொண்டுவருவதற்காக சீதோனியர்களுக்கும் தீரியர்களுக்கும் உணவும் பானமும் எண்ணெயும் கொடுத்தார்கள்; பெர்சிய அரசன் கோரேசு அவர்களுக்கு அளித்த அனுமதியின்படியே இதைச் செய்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளி.’ எபிரெயச் சொல் வெள்ளி என்னும் உலோகத்தையோ, கொடுப்பனவுச் சூழலில் பணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘யாப்போவின் கடலுக்கு’; இதை ‘யாப்போ துறைமுகத்துக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பெர்சிய அரசன் கோரேசு அவர்களுக்கு வழங்கிய அதிகாரத்தின்படி.’ எபிரெயச் சொற்றொடர் அனுமதி அல்லது அதிகாரப்பூர்வ ஒப்புதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ஆகவே, அவர்கள் கொடுத்தார்கள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீன தமிழில் முன்னெடுக்கிறது; முந்தைய சூழலின் விளைவையும் தொடர்ச்சியையும் காட்டுகிறது.
- source_word: כֶסֶף
  choice: பணம்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வெள்ளி’ என்றாலும், இங்குள்ள கூலி அல்லது கொடுப்பனவுச் சூழலில் ‘பணம்’ என்பதே பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַחֹצְבִים
  choice: கல் வெட்டுகிறவர்கள்
  rationale: חצב என்பதன் கல் வெட்டுதல் அல்லது கல் எடுத்தல் என்ற தொழில்சார் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְלֶחָרָשִׁים
  choice: கைவினைஞர்கள்
  rationale: חָרָשׁ என்பது குறிப்பிட்ட ஒரு பொருளில் மட்டும் வேலை செய்பவரை அல்லாமல் பலவகைத் திறன்மிக்க தொழிலாளர்களைக் குறிக்கலாம்; ஆகவே அளவுக்கு மீறிக் குறிப்பாக்காமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: உணவும் பானமும் எண்ணெயும்
  rationale: வழங்கப்பட்ட பொருட்களின் பட்டியலை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘எண்ணெய்’ என்பதை எபிரெயத்தில் இல்லாத ‘ஒலிவ எண்ணெய்’ எனக் குறிப்பாக்கவில்லை.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: சீதோனியர்களுக்கும் தீரியர்களுக்கும்
  rationale: சீதோன், தீரு ஆகிய ஊர்களைச் சேர்ந்த மக்களைக் குறிக்கும் இன/இடப்பெயர்ச் சொற்களைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: עֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகள்
  rationale: கட்டுமானச் சூழலில் கொண்டு வரப்பட்ட cedar மரப்பொருளைக் குறிக்கிறது; ‘மரங்கள்’ என்பதைவிட இச்சூழலுக்கு இயல்பானது.
- source_word: אֶל יָם יָפוֹא
  choice: யாப்போவின் கடற்கரைக்கு
  rationale: சொல்லுக்கு சொல் ‘யாப்போவின் கடலுக்கு’; துறைமுகம் என்று வெளிப்படையாகக் குறிப்பாக்காமல் கடலோர இலக்கை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כְּרִשְׁיוֹן ... עֲלֵיהֶם
  choice: அவர்களுக்கு அளித்த அனுமதியின்படி
  rationale: רִשְׁיוֹן என்பதன் அரச அனுமதி/ஒப்புதல் சார்ந்த பொருளையும் עֲלֵיהֶם என்பதன் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
