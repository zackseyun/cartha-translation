  source_fidelity: திருத்தம் தேவை. வரைவில் ‘யூதாவின் மகன்கள்’ என்பது கத்மியேலும் அவரது மகன்களும் என்போருக்கு மட்டும் இணையான அடையாளமாக மாற்றப்பட்டுள்ளது; எபிரெயப் பட்டியல் அமைப்பில் அது தனிக் குழுவாகவும் புரிந்துகொள்ளப்படக்கூடியதால், அந்த இணைப்பை முதன்மை உரையில் திணிக்காமல் காக்க வேண்டும். மேலும் עֹשֵׂה הַמְּלָאכָה என்பது நடைபெறும் பணியைச் செய்பவர்களைக் குறிக்கிறது; ‘வேலை செய்தவர்களை’ என்ற இறந்தகாலம் பொருந்தாது.
