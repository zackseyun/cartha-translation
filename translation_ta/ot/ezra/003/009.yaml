source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: ta
  text: அப்போது யேசுவாவும் அவரது மகன்களும் சகோதரர்களும், கத்மியேலும் அவரது மகன்களும், யூதாவின் மகன்களும்[a], ஹேனாதாதின் மகன்களும் அவர்களுடைய மகன்களும் சகோதரர்களுமாகிய லேவியர்களும், தேவனுடைய ஆலயத்தில் பணிசெய்கிறவர்களை மேற்பார்வையிட ஒன்றாக நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலபாடம்: “யூதாவின் மகன்கள்.” சில பழங்கால மொழிபெயர்ப்புகளும் நவீன மொழிபெயர்ப்புகளும் “ஹோதவியாவின் மகன்கள்” என்று வாசிக்கின்றன.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்றார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நில்’ என்பதைக் காத்து, பல குழுக்கள் ஒருங்கிணைந்து மேற்பார்வைப் பொறுப்பை ஏற்ற சூழலுக்கு இயல்பான பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: எஸ்றா நூலில் வரும் இப்பெயரின் எபிரெய ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: בָּנָיו וְאֶחָיו
  choice: அவருடைய மகன்களும் சகோதரர்களும்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொற்களையும் குடும்ப அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: קַדְמִיאֵל וּבָנָיו בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்களான கத்மியேலும் அவருடைய மகன்களும்
  rationale: கத்மியேலையும் அவரது மகன்களையும் ‘யூதாவின் மகன்கள்’ என்று அடையாளப்படுத்தும் எபிரெய தொடரைத் தமிழில் தெளிவான இயல்பான வரிசையில் வழங்குகிறது.
- source_word: כְּאֶחָד
  choice: ஒன்றாக இணைந்து
  rationale: குழுக்கள் ஒரே நோக்குடன் கூட்டாகச் செயல்பட்டதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְנַצֵּחַ
  choice: மேற்பார்வையிட
  rationale: இந்தக் கட்டுமானப் பணிச் சூழலில் נצח என்பது இசை வழிநடத்துதலை அல்ல, பணியாளர்களை மேற்பார்வை செய்வதைக் குறிக்கிறது.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: வேலை செய்தவர்களை
  rationale: ஒருமை வடிவிலுள்ள எபிரெய வினையெச்சம் இங்கு கூட்டுப்பொருளில் வருவதால், பணியைச் செய்த மக்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயத்தில்
  rationale: ‘தேவனுடைய வீடு’ என்ற எபிரெய ஆலயச் சொற்றொடரின் சூழற்பொருளை சாதாரண வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: ஹெனாதாதின் மகன்களும் அவர்களுடைய மகன்களும் சகோதரர்களுமாகிய லேவியர்களும்
  rationale: இறுதிக் குடும்பக் குழுவையும், அவர்களை லேவியர்கள் என அடையாளப்படுத்தும் பின்வரும் விளக்கத்தையும் மூலத்தின் பட்டியல் அமைப்புக்கு நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: בְּנֵי יְהוּדָה என்பதிலுள்ள மூலபாட வேறுபாடு
  choice: மசோரா மூலபாடத்தின்படி ‘யூதாவின் மகன்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஹோதவியாவின் மகன்கள்’
  rationale: கொடுக்கப்பட்ட WLC மூலபாடம் ‘யூதா’ என்று வாசிக்கிறது. சில பழங்கால மொழிபெயர்ப்புகளின் வேறு வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; முதன்மை உரையில் அது அமைதியாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. குடும்பப் பட்டியலின் மீளுரைப்பை மூலத்துக்கு ஏற்ப காத்தபடியே, நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவாக ஓடுமாறு அமைக்கப்பட்டுள்ளது. ‘தேவனுடைய ஆலயம்’ என்பது ஆலயச் சூழலைச் சாதாரண வாசகருக்கு உடனடியாகத் தெளிவாக்குகிறது.
