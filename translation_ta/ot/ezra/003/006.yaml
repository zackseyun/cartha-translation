base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: ta
  text: ஏழாம் மாதத்தின் முதல் நாளிலிருந்து அவர்கள் யாவேக்கு தகனபலிகளைச் செலுத்தத் தொடங்கினார்கள். ஆனால்[a] யாவேயின் ஆலயத்தின் அஸ்திவாரம் இன்னும் இடப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய இணைப்புச்சொல்லை இங்கு “மற்றும்” என்றும் மொழிபெயர்க்கலாம். சூழலில், ஆலயத்தின் அஸ்திவாரம் இடப்படுவதற்கு முன்பே பலிகள் செலுத்தத் தொடங்கப்பட்டன என்பது கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד
  choice: முதல் நாளிலிருந்து
  rationale: מִן காலத்தின் தொடக்கப் புள்ளியைக் குறிக்கிறது; ‘முதல் நாளிலிருந்து’ என்பது அந்த நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தின்
  rationale: குறிப்பிடப்பட்ட நாள் ஏழாம் மாதத்துக்குரியது என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הֵחֵלּוּ
  choice: தொடங்கினார்கள்
  rationale: வினைச்சொல்லின் ‘ஆரம்பித்தல்’ என்ற பொருளை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: தகனபலிகளைச் செலுத்த
  rationale: பலியை மேலே எழச் செய்வது என்ற சொல்லாட்சியின் வழிபாட்டுச் சூழல் பொருள், முழுவதும் எரிக்கப்படும் பலிகளை அர்ப்பணிப்பதாகும்; ‘தகனபலி’ அந்த பலிவகையைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ பலியின் பெறுநரைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהֵיכַל יְהוָה
  choice: ஆனால் யாவேயின் ஆலயம்
  rationale: הֵיכָל இச்சூழலில் ஆலயத்தைக் குறிக்கிறது. וְ இங்கு முந்தைய செயலுக்கும் ஆலயத்தின் கட்டப்படாத நிலைக்கும் இடையிலான எதிர்மறைத் தொடர்பாக வாசிக்கப்படுகிறது; அதன் எளிய இணைப்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא יֻסָּד
  choice: அஸ்திவாரம் இன்னும் போடப்படவில்லை
  rationale: יסד என்பதன் செயப்பாட்டு வடிவம் அஸ்திவாரம் இடப்படுதலைக் குறிக்கிறது. எபிரேயத்தில் உள்ள மறுப்பையும், நிகழ்வுகளின் காலத் தொடர்பில் இயல்பாக உணரப்படும் ‘இன்னும்’ என்பதையும் தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக வருகிறது. அதனை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பேணுகிறது.
- issue: ஆலயம் நிறுவப்படுமுன் பலிகள் தொடங்கியதைக் காட்டும் தொடர்பு
  choice: ஆனால்
  alternative: மற்றும் / இருந்தபோதிலும்
  rationale: இணைப்புச்சொல் வְ பொதுவாக ‘மற்றும்’ எனப் பொருள்படலாம்; இச்சூழலில் பலிகள் ஆலய அஸ்திவாரம் போடப்படுவதற்கு முன்பே தொடங்கியதை எதிர்மறைத் தொடர்புடன் காட்டுவது இயல்பானது. இருப்பினும் மூலத்தின் இலக்கணப் பலவாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகனபலி’, ‘ஆலயம்’, ‘அஸ்திவாரம்’ ஆகியவை சாதாரண வாசகருக்குப் புரியக்கூடிய நிலைபெற்ற சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; மூலத்தின் இணைப்புச்சொல் கொண்டுள்ள பொருள் நெகிழ்வு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
