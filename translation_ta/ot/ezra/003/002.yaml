base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: ta
  text: அப்போது யோசாதாக்கின் மகன் யேசுவாவும் அவருடைய சகோதரர்களான ஆசாரியர்களும், செயல்த்தியேலின் மகன் செருபாபேலும் அவருடைய சகோதரர்களும் எழுந்து, தேவனுடைய மனிதரான மோசேயின் சட்டத்தில்[b] எழுதப்பட்டபடியே, அதன்மேல் தகனபலிகளைச் செலுத்துவதற்காக இஸ்ரவேலின் தேவனுடைய பலிபீடத்தைக் கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘சட்டம்’ என்பது எபிரெய ‘தோரா’ என்பதன் மொழிபெயர்ப்பு; அதற்கு ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்றும் பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்ற வினை இங்கு தீர்மானமான செயல் தொடங்குவதைச் சுட்டுகிறது; உடல்ரீதியாக எழுந்து நின்றார்கள் என்று மட்டும் குறுக்காமல் எபிரெயக் கதைநகர்வைப் பேணுகிறது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: எஸ்றா–நெகேமியாவில் காணப்படும் நாடுகடத்தலுக்குப் பிந்தைய எபிரெயப் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: அவருடைய சகோதரர்களான ஆசாரியர்கள்
  rationale: אח என்பதன் முதன்மைப் பொருளான ‘சகோதரர்கள்’ என்பதைக் காத்து, அடுத்து வரும் ‘ஆசாரியர்கள்’ அவர்களின் குழுவை அடையாளப்படுத்துவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: செயல்த்தியேலின் மகன் செருபாபேல்
  rationale: தனிப்பெயர்களை எபிரெய வடிவங்களுக்கு நெருக்கமாகவும் தமிழில் வாசிக்கத்தக்க வகையிலும் ஒலிபெயர்க்கிறது.
- source_word: וַיִּבְנוּ
  choice: கட்டி
  rationale: בנה என்பதன் நேரடிப் பொருள் ‘கட்டு’; வரலாற்றுச் சூழலைக் கொண்டு ‘மீண்டும் கட்டினர்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேவனுக்குரிய பலிபீடம்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழில் உரிமை/சார்புப் பொருளுடன் தருகிறது.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: அதன்மேல் தகனபலிகளைச் செலுத்த
  rationale: עלה என்பதன் ஹிஃபில் வடிவமும் עֹלוֹת என்பதும் சேர்ந்த பலியிடும் மரபுத்தொடரைத் தெளிவாகத் தருவதோடு, பலிபீடத்தின் மேல் செலுத்தப்படுவதைப் பேணுகிறது.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டபடியே
  rationale: எழுதப்பட்ட கட்டளைக்கு ஏற்ப அவர்கள் செயல்பட்டனர் என்ற மூலத்தின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: תּוֹרַת מֹשֶׁה
  choice: மோசேயின் போதனைச் சட்டம்
  rationale: תורה என்பதிலுள்ள ‘போதனை/அறிவுறுத்தல்’ மற்றும் இச்சூழலில் உள்ள அதிகாரமிக்க எழுத்துச் சட்டம் ஆகிய இரு கூறுகளையும் தமிழில் இணைத்துப் பேணுகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: மோசேக்கு வழங்கப்படும் எபிரெயப் பட்டத்தை விளக்கவுரையால் மாற்றாமல் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: אחים என்ற உறவுமுறைச் சொல்லின் பரந்த பொருள்
  choice: சகோதரர்கள்
  alternative: உறவினர்கள் / உடன் பணியாற்றியவர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் முதன்மையான உறவுமுறைச் சொல்லையும் காக்கிறது; யேசுவாவின் குழுவை ‘ஆசாரியர்கள்’ என்ற அடுத்த சொல் தெளிவுபடுத்துகிறது. பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: תּוֹרָה என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: போதனைச் சட்டம்
  alternative: சட்டம் / போதனை / தோரா
  rationale: பலியைப் பற்றிய எழுதப்பட்ட அதிகாரமிக்க விதி என்ற உடனடிச் சூழலையும், תורה என்பதன் விரிந்த ‘போதனை, அறிவுறுத்தல்’ பொருளையும் ஒருசேர வெளிப்படுத்துகிறது.
- issue: אִישׁ הָאֱלֹהִים என்ற மோசேயின் பட்டம்
  choice: தேவனுடைய மனிதர்
  alternative: இறைமனிதர்
  rationale: எபிரெயத் தொடரின் உறவுநிலையைத் தெளிவாகக் காத்து, குறிப்பிட்ட சமய மரபின் விளக்கத்தைச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்’, ‘பலிபீடம்’, ‘தகனபலி’ போன்ற நிலைபெற்ற வழிபாட்டுச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
