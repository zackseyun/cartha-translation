source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: ta
  text: கட்டுமானப் பணியாளர்கள் யாவேயின் ஆலயத்துக்கு அடித்தளம் அமைத்தபோது, இஸ்ரவேலின் அரசனான தாவீதின் வழிகாட்டுதலின்படி யாவேயைப் புகழ்வதற்காக, ஆடையணிந்த ஆசாரியர்களை எக்காளங்களுடனும், ஆசாப்பின் மக்களான லேவியர்களைக் கைத்தாளங்களுடனும் நிறுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: கட்டுநர்கள் ... அடித்தளம் அமைத்தபோது
  rationale: יסד என்பது கட்டடச் சூழலில் அடித்தளம் அமைப்பதைக் குறிக்கிறது; הַבֹּנִים பெயர்ச்சொல் தன்மையில் ‘கட்டுநர்கள்’ என வழங்கப்படுகிறது.
- source_word: הֵיכַל יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: הֵיכָל இங்கு வழிபாட்டுக்குரிய ஆலயத்தைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיַּעֲמִידוּ
  choice: நிறுத்தினார்கள்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் வழிபாட்டுப் பணிக்காக உரிய இடங்களில் நிறுத்தியதை அல்லது நிலைநிறுத்தியதைத் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: ஆசாரியர்களை அவர்களுக்குரிய ஆடைகளை அணிந்தவர்களாக
  rationale: מְלֻבָּשִׁים என்பதன் அடிப்படைப் பொருள் ‘ஆடை அணிந்தவர்கள்’. வழிபாட்டுச் சூழல் காரணமாக ‘அவர்களுக்குரிய ஆடைகள்’ என இயல்பாக வழங்கப்பட்டுள்ளது; குறிப்பிட்ட துணிவகை சேர்க்கப்படவில்லை.
- source_word: בַּחֲצֹצְרוֹת
  choice: எக்காளங்களுடன்
  rationale: חֲצֹצְרוֹת என்பது ஆலய வழிபாட்டில் பயன்படுத்தப்பட்ட நேரான சடங்கு எக்காளங்களைக் குறிக்கிறது.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: ஆசாப்பின் மக்களான லேவியர்கள்
  rationale: ‘ஆசாப்பின் மக்கள்’ என்ற குடும்ப அல்லது வம்ச அடையாளத்தையும் அவர்கள் லேவியர்கள் என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַּמְצִלְתַּיִם
  choice: கைத்தாளங்களுடன்
  rationale: מְצִלְתַּיִם என்பது ஒன்றோடொன்று மோதிச் சத்தமிடும் வழிபாட்டு இசைக்கருவியான கைத்தாளங்களைக் குறிக்கிறது.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: யாவேயைப் புகழ்வதற்காக
  rationale: לְ உடனான வினையெச்சம் இங்கு ஆசாரியர்களும் லேவியர்களும் நிறுத்தப்பட்ட நோக்கத்தைக் குறிப்பிடுகிறது.
- source_word: עַל יְדֵי דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய தாவீதின் வழிகாட்டுதலின்படி
  rationale: ‘தாவீதின் கையால்’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் தாவீது வகுத்த வழிபாட்டு ஏற்பாடு அல்லது வழிகாட்டுதலைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: עַל יְדֵי דָּוִיד என்பதன் வழிபாட்டுச் சூழல் பொருள்
  choice: தாவீதின் வழிகாட்டுதலின்படி
  alternative: தாவீதின் கையால்
  rationale: சொல்லுக்குச் சொல் வடிவம் தாவீதின் நேரடி உடல் செயல்பாட்டைத் தவறாக உணர்த்தலாம். இங்கு தாவீது ஏற்படுத்திய அல்லது வகுத்த வழிபாட்டு முறையின்படி நடந்தது என்ற பொருள் சூழலுக்கு ஏற்றது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; வழிபாட்டுச் சொற்களான ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘எக்காளங்கள்’, ‘கைத்தாளங்கள்’ ஆகியவை இயல்பான தமிழ்ச் சொல் வழக்கில் வைக்கப்பட்டுள்ளன.
