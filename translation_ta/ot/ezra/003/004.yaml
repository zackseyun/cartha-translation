revisions:
- from: எழுதப்பட்டிருந்தபடியே அவர்கள் கூடாரப் பண்டிகையைக் கொண்டாடினார்கள். ஒவ்வொரு நாளுக்கும் விதிக்கப்பட்டிருந்த முறைப்படி, அந்தந்த நாளுக்குரிய எண்ணிக்கையில் தகனபலிகளைச் செலுத்தினார்கள்.
  to: எழுதப்பட்டபடியே அவர்கள் கூடாரப் பண்டிகையைக் கொண்டாடினார்கள்; ஒவ்வொரு நாளும் அந்தந்த நாளுக்குரிய எண்ணிக்கையில், விதிமுறைப்படி தகனபலிகளைச் செலுத்தினார்கள்.
  rationale: The revision retains the draft’s accurate festival and sacrificial terminology, explicitly renders the daily recurrence, preserves the distinct ideas of prescribed number, ordinance, and each day’s requirement, and improves idiomatic modern Tamil. No footnote is needed because the verse itself does not identify the written authority more specifically.
