source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: ta
  text: எழுதப்பட்டபடியே அவர்கள் கூடாரப் பண்டிகையைக் கொண்டாடினார்கள்; ஒவ்வொரு நாளும் அந்தந்த நாளுக்குரிய எண்ணிக்கையில், விதிமுறைப்படி தகனபலிகளைச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: கூடாரப் பண்டிகை
  rationale: ‘சுக்கோத்/கூடாரங்கள்’ என்ற விழாவின் பெயரை நவீனத் தமிழில் தெளிவாகவும் மரபுடன் தொடர்புடையதாகவும் வழங்குகிறது.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டிருந்தபடியே
  rationale: எந்த எழுத்து அல்லது நூல் என்று மூலத்தில் வெளிப்படையாகச் சொல்லப்படாததைச் சேர்க்காமல், ‘எழுதப்பட்டபடி’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: עֹלַת יוֹם בְּיוֹם
  choice: தகனபலிகளை ... ஒவ்வொரு நாளுக்கும்
  rationale: עֹלָה என்பதன் பலியியல் பொருளை ‘தகனபலி’ எனத் துல்லியமாகக் கொடுத்து, יוֹם בְּיוֹם என்பதன் நாள்தோறும் நிகழும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפָּר
  choice: எண்ணிக்கையில்
  rationale: ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட பலிகளின் எண்ணிக்கையைக் குறிக்கும் மூலச்சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: כְּמִשְׁפָּט
  choice: விதிக்கப்பட்டிருந்த முறைப்படி
  rationale: இங்கு ‘நியாயத்தீர்ப்பு’ அல்ல, ஒழுங்காக நிர்ணயிக்கப்பட்ட விதிமுறை அல்லது சட்டமுறை என்பதே சூழல்சார் பொருள்.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: அந்தந்த நாளுக்குரிய
  rationale: ஒவ்வொரு நாளுக்கும் உரிய கடமை அல்லது தேவையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘எழுதப்பட்டிருந்தபடி’ என்பது எதைக் குறிக்கிறது
  choice: குறிப்பிட்ட நூல் அல்லது மோசேயின் சட்டம் என்று உரையிலேயே விரிவாக்காமல் விடப்பட்டது.
  alternative: ‘மோசேயின் சட்டத்தில் எழுதப்பட்டபடி’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: உடனடி சூழல் சட்டத்தைச் சுட்டினாலும், இவ்வசனத்தின் எபிரெய உரை அதனைப் பெயரிட்டு குறிப்பிடவில்லை; ஆகவே மூலத்தின் மறைமுகத்தன்மை காக்கப்படுகிறது.
- issue: பலிகளின் எண்ணிக்கையும் தினசரி ஒழுங்கும்
  choice: ஒவ்வொரு நாளுக்கும் விதிக்கப்பட்ட முறை மற்றும் அந்த நாளுக்குரிய எண்ணிக்கை ஆகிய இரண்டையும் வெளிப்படுத்தியது.
  alternative: ‘தினசரி தகனபலிகளைச் செலுத்தினார்கள்’ என்று மட்டும் சுருக்குதல்.
  rationale: בְּמִסְפָּר, כְּמִשְׁפָּט, דְּבַר יוֹם בְּיוֹמוֹ ஆகிய தனித்த கூறுகளை இழக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. பலியியல் சொல்லான ‘தகனபலி’ துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
