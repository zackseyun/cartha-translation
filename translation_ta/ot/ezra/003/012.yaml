translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ சூழலிலுள்ள தேவாலயக் கட்டிடத்தைக் குறிக்கிறது; ‘கோவில்’ என்பதால் உருவாகக்கூடிய வேறு சமயச் சங்கதிகளைத் தவிர்க்கிறது. அழுகையும் மகிழ்ச்சி ஆரவாரமும் ஒரே நேரத்தில் நிகழும் மூலமொழியின் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
