base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: ta
  text: ஆனால் ஆசாரியர்களிலும் லேவியர்களிலும் தந்தைவழிக் குடும்பத் தலைவர்களிலும்[a] முதலாம் ஆலயத்தை[b] பார்த்திருந்த முதியவர்கள் பலர், தங்கள் கண்முன்னே இந்த ஆலயத்துக்கு அடித்தளம் இடப்பட்டபோது[c] உரத்த குரலில் அழுதார்கள்; வேறு பலரோ மகிழ்ச்சி ஆரவாரத்துடன் தங்கள் குரலை உயர்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தைவழிக் குடும்பத் தலைவர்கள்” என்பது மூதாதையர் வழியாக அமைந்த விரிவான குடும்ப அல்லது குலக் குழுக்களின் தலைவர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “முதலாம் ஆலயம்” என்பதை “முந்தைய ஆலயம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் எழுத்துப்படி “முதலாம் வீடு” என்று உள்ளது; அது முந்தைய ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இந்த ஆலயம் நிறுவப்படும்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: ஆனால் ... பலர்
  rationale: וְ முந்தைய வசனத்தின் மகிழ்ச்சி ஆரவாரத்துடன் இங்குள்ள அழுகையை முரண்படுத்துவதால், தமிழில் ‘ஆனால்’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: ஆசாரியர்களிலும் லேவியர்களிலும் தந்தைவழிக் குடும்பத் தலைவர்களிலும்
  rationale: מִן பகுதியைக் குறிக்கிறது; ‘-இலும்’ என்பது இக்குழுக்களில் பலர் என்பதைக் காட்டுகிறது. רָאשֵׁי הָאָבוֹת என்பது மூதாதையர் வழிக் குடும்ப அல்லது குலக் குழுக்களின் தலைவர்களைக் குறிக்கிறது.
- source_word: הַזְּקֵנִים
  choice: முதியவர்கள்
  rationale: இங்கு பதவியைவிட வயதே முதன்மை; அவர்கள் முந்தைய ஆலயத்தைப் பார்த்திருக்கும் அளவுக்கு முதியவர்கள்.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: முதலாம் ஆலயத்தை பார்த்திருந்த
  rationale: הַבַּיִת הָרִאשׁוֹן என்பது எழுத்துப்படி ‘முதலாம் வீடு’; சூழலில் அது ஆலயத்தைத் தெளிவாகக் குறிக்கிறது. ‘பார்த்திருந்த’ என்பது முந்தைய அனுபவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: இந்த ஆலயம் அடித்தளமிடப்பட்டபோது
  rationale: יסד இங்கு ஆலயத்தின் அடித்தளம் இடப்பட்ட நிகழ்வைக் குறிக்கிறது; தமிழில் இது துல்லியமும் இயல்பும் உடைய வடிவம்.
- source_word: בְּעֵינֵיהֶם
  choice: தங்கள் கண்முன்னே
  rationale: நேரில் கண்டதை வலியுறுத்தும் எபிரெய மொழிவழக்கின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: உரத்த குரலில் அழுதார்கள்
  rationale: தொடர்ச்சியாக நடந்த அழுகையையும் ‘பெரிய/உரத்த குரல்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְרַבִּים
  choice: வேறு பலரோ
  rationale: இரண்டு குழுக்களின் ஒரேநேர எதிர்வினைகளைத் தெளிவுபடுத்துகிறது; ‘வேறு’ என்பது சூழலால் உணர்த்தப்படும் வேறுபாட்டை மட்டும் வெளிப்படுத்துகிறது.
- source_word: בִּתְרוּעָה בְשִׂמְחָה
  choice: மகிழ்ச்சி ஆரவாரத்துடன்
  rationale: תְרוּעָה என்பதின் உரத்த ஆரவாரத்தையும் שִׂמְחָה என்பதின் மகிழ்ச்சியையும் ஒன்றாகத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהָרִים קוֹל
  choice: தங்கள் குரலை உயர்த்தினார்கள்
  rationale: ‘குரலை உயர்த்துதல்’ என்ற எபிரெய உருவகத்தை தமிழிலும் புரியத்தக்கவாறு பாதுகாக்கிறது.
