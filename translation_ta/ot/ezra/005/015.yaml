translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நேரடி உரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ மற்றும் ‘தேவனுடைய இல்லம்’ என்ற இரு சொற்களால் மூலத்தின் הֵיכְל / בֵית வேறுபாடு காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி உரையின் தொடர்புடைய இறுதிக் கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
