base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: ta
  text: அவர் அவனிடம், “இந்தப் பாத்திரங்களை எடுத்துக்கொண்டு போய் எருசலேமிலுள்ள ஆலயத்தில் வை; தேவனுடைய இல்லம் அதன் இடத்திலேயே மீண்டும் கட்டப்படட்டும்[a]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் இடத்தில் கட்டப்படட்டும்.” அரமேயச் சொற்றொடர், தேவனுடைய இல்லம் அதற்குரிய இடத்திலேயே கட்டப்படுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: அவர் அவனிடம் ... என்று சொன்னார்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை வினையையும் לֵהּ என்பதன் ‘அவனிடம்’ என்ற பொருளையும் இயல்பான தமிழ் நேரடி உரை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: אֵלֶּה מָאנַיָּא
  choice: இந்தப் பாத்திரங்கள்
  rationale: இச்சூழலில் மָאנַיָּא என்பது ஆலயத்திலிருந்து எடுத்துச் செல்லப்பட்ட புனிதப் பயன்பாட்டுப் பொருட்களைக் குறிக்கிறது; ‘பாத்திரங்கள்’ என்பது தெளிவான, வழக்கமான தமிழ்.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: எடுத்துக்கொண்டு போய் ... வை
  rationale: ‘எடு, போ, அவற்றை வை’ என்ற தொடர் கட்டளைகளை அவற்றின் வரிசையைக் காத்து இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: எருசலேமிலுள்ள ஆலயத்தில்
  rationale: הֵיכְלָא இங்கு எருசலேம் ஆலயத்தையே குறிக்கிறது; דִּי உறவுத் தொடரை தமிழில் பெயரெச்ச வடிவில் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: וּבֵית אֱלָהָא
  choice: தேவனுடைய இல்லம்
  rationale: בֵית என்பதன் ‘இல்லம்/வீடு’ என்ற உருவகத்தைப் பாதுகாப்பதோடு, முன்வரும் הֵיכְלָא என்பதற்குப் பயன்படுத்திய ‘ஆலயம்’ என்ற சொல்லுடனான மூலமொழி வேறுபாட்டையும் காக்கிறது.
- source_word: יִתְבְּנֵא
  choice: மீண்டும் கட்டப்படட்டும்
  rationale: வினையின் செயப்பாட்டு பொருள் ‘கட்டப்படட்டும்’; அழிக்கப்பட்ட ஆலயம் பழைய இடத்தில் எழுப்பப்படும் வரலாற்றுச் சூழலை ‘மீண்டும்’ தெளிவாக்குகிறது.
- source_word: עַל אַתְרֵהּ
  choice: அதன் இடத்திலேயே
  rationale: அந்த இல்லத்திற்குரிய இடத்திலேயே அது எழுப்பப்பட வேண்டும் என்ற வலியுறுத்தலை ‘-இலேயே’ இயல்பாக வெளிப்படுத்துகிறது.
