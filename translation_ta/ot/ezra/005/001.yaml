source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: ta
  text: தீர்க்கதரிசியான ஆகாயும், இத்தோவின் மகன் சகரியாவும்—அந்தத் தீர்க்கதரிசிகள்—யூதாவிலும் எருசலேமிலும் இருந்த யூதர்களிடம்[a], அவர்கள்மேல் இருந்த இஸ்ரவேலின் கடவுளுடைய பெயரில்[b] தீர்க்கதரிசனம் உரைத்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதா நாட்டினரிடம்’ என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் யூத மக்களையோ, புவியியல் அடிப்படையில் யூதாவைச் சேர்ந்த மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் கடவுளுடைய அதிகாரத்தால்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்கள்மேல் இருந்த’ என்ற இறுதிச் சொற்றொடர், கடவுள் அவர்கள்மேல் கொண்டிருந்த அதிகாரம், மேற்பார்வை அல்லது உடனிருப்பைக் குறிக்கலாம்.
    reason: ambiguity
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: அரமேய வினைச்சொல் இரு தீர்க்கதரிசிகளையும் கூட்டு எழுவாயாகக் கொண்டு நிற்கிறது. தமிழில் பன்மை வினை இயல்பானது. தொடக்க וְ தனியான காலச்சுட்டுச் சொல்லல்ல; ஆகவே ‘இப்போது’ அல்லது ‘அப்போது’ என்று சேர்க்கப்படவில்லை.
- source_word: חַגַּי נביאה
  choice: தீர்க்கதரிசியான ஆகாய்
  rationale: பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, தீர்மான வடிவிலுள்ள அடைமொழி இயல்பான தமிழில் பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: இத்தோவின் மகன் சகரியா
  rationale: בַר என்பதன் நேர்பொருள் ‘மகன்’; தனிப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: נביאיא
  choice: அந்தத் தீர்க்கதரிசிகள்
  rationale: ஆகாயையும் சகரியாவையும் மீண்டும் தொகுத்துக் குறிப்பிடும் மூலமொழியின் பன்மை இணைப்புப் பெயரைத் தவிர்க்காமல் வெளிப்படையாக வைத்துள்ளது.
- source_word: עַל יְהוּדָיֵא
  choice: யூதர்களிடம்
  rationale: இங்கு עַל தீர்க்கதரிசனத்தின் கேட்போரைச் சுட்டுகிறது; எதிராக உரைத்தார்கள் என்ற பகைமைப் பொருள் சூழலுக்கு ஏற்றதல்ல. יְהוּדָיֵא மக்களினத்தையோ யூதா பகுதியைச் சேர்ந்தவர்களையோ குறிக்க முடியும்.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: யூதாவிலும் எருசலேமிலும் இருந்த
  rationale: דִּי சார்புத்தொடரை அறிமுகப்படுத்துகிறது. பழைய ஏற்பாட்டின் நிலப்பகுதிப் பெயருக்கு ‘யூதா’ என்பதே பொருத்தமானது.
- source_word: בְּשֻׁם
  choice: பெயரில்
  rationale: தெய்வீக அதிகாரத்தையும் பிரதிநிதித்துவத்தையும் குறிக்கும் மரபுத்தொடர். ‘பெயரில்’ என்பது மூலவடிவத்தையும் அதன் அதிகாரப் பொருளையும் காக்கிறது.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: உடைமைத் தொடர்பை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עֲלֵיהוֹן
  choice: அவர்கள்மேல் இருந்த
  rationale: இந்தச் சொற்றொடர் மிக இயல்பாக ‘இஸ்ரவேலின் கடவுள்’ என்பதைக் குறிப்பதாகப் புரிகிறது. ‘ஆட்சி செய்த’ என்று விளக்கி மொழிபெயர்க்காமல், மேற்பார்வை, அதிகாரம் அல்லது உடனிருப்பு ஆகிய நுணுக்கங்களுக்கு இடமளிக்கும் வகையில் நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: עֲלֵיהוֹן என்ற இறுதிச் சொற்றொடரின் தொடர்பும் பொருளும்
  choice: ‘இஸ்ரவேலின் கடவுள்’ என்பதைக் குறிப்பதாகக் கொண்டு ‘அவர்கள்மேல் இருந்த’ என்று மொழிபெயர்த்தல்
  alternative: அதை தீர்க்கதரிசனச் செயலுடன் தளர்வாக இணைத்து, கடவுளின் செய்தி அல்லது ஆவியின் வருகை ‘அவர்கள்மேல்’ இருந்ததாகப் புரிந்துகொள்ளுதல்
  rationale: தொடரமைப்பு இதை அருகிலுள்ள ‘இஸ்ரவேலின் கடவுள்’ என்பதோடு இணைப்பதையே அதிகம் ஆதரிக்கிறது. எனினும் ‘அவர்கள்மேல்’ என்பதில் அதிகாரம், பாதுகாப்பு, உடனிருப்பு ஆகியவை ஒன்றுக்கொன்று விலக்காக இல்லாததால், அவற்றில் ஒன்றை மட்டும் உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘தீர்க்கதரிசனம் உரைத்தார்கள்’ என்பது தெளிவானதும் வேதாகமச் சூழலுக்கு ஏற்றதுமான சொல்லாக்கம். மூலத்தில் மீளக் கூறப்படும் ‘தீர்க்கதரிசிகள்’ என்பது நீக்கப்படாமல், தமிழில் வாசிக்க உதவும் இடைக்கோடுகளுக்குள் வைக்கப்பட்டுள்ளது.
