  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: ta
  text: இப்போது, அரசருக்கு நல்லதாகத் தோன்றினால், எருசலேமில் உள்ள இறைவனுடைய இந்த இல்லத்தைக் கட்டுவதற்கு[a] கோரேசு அரசர் ஓர் ஆணை பிறப்பித்தாரா என்று பாபிலோனில் உள்ள அரச கருவூலத்தில் தேடிப் பார்க்கப்படட்டும். இந்தக் காரியத்தைப் பற்றிய அரசரின் விருப்பத்தை[b] எங்களுக்கு அனுப்பிவைக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமில் உள்ள இறைவனுடைய இந்த இல்லத்தை மறுபடியும் கட்டுவதற்கு.” அரமேய வினைச்சொல்லை நேரடியாக “கட்ட” என்று மொழிபெயர்க்கலாம்; அழிக்கப்பட்ட ஆலயம் மீட்டுக் கட்டப்படும் சூழலை “மறுபடியும் கட்ட” என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசரின் சித்தத்தை” அல்லது “அரசரின் தீர்மானத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: இப்போது
  rationale: கோரிக்கையின் முடிவான அடுத்த நடவடிக்கையை அறிமுகப்படுத்தும் அரமேய இணைப்புச் சொல்; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: அரசருக்கு நல்லதாகத் தோன்றினால்
  rationale: அரசவைக்குரிய பணிவான நிபந்தனை மொழியைப் பொருளுடன் காக்கிறது.
- source_word: יִתְבַּקַּר
  choice: தேடிப் பார்க்கப்படட்டும்
  rationale: ஆவணத்தைத் தேடி ஆராய வேண்டும் என்ற செயப்பாட்டு வேண்டுகோள் பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: அரச கருவூலத்தில்
  rationale: சொல்லர்த்தமாக ‘பொக்கிஷங்களின் இல்லம்’; அரச ஆவணங்களும் மதிப்புள்ள பொருட்களும் வைக்கப்பட்ட இடத்தைக் குறிக்கும் இயல்பான நிர்வாகச் சொல்.
- source_word: דִּי מַלְכָּא תַמָּה דִּי בְּבָבֶל
  choice: பாபிலோனில் உள்ள
  rationale: தேடப்பட வேண்டிய அரச கருவூலத்தின் இருப்பிடத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: הֵן אִיתַי דִּי
  choice: …ஆ என்று
  rationale: அத்தகைய ஆணை உண்மையில் உள்ளதா என்பதை உறுதிசெய்யும் மறைமுக வினாவாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: கோரேசு அரசர் ஓர் ஆணை பிறப்பித்தாரா
  rationale: טְעֵם என்பது அதிகாரப்பூர்வ ஆணையைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் செய்பாட்டு வடிவம் இயல்பாகவும் மூலத்தின் முகவரைத் தெளிவாகவும் காட்டுகிறது.
- source_word: לְמִבְנֵא
  choice: கட்டுவதற்கு
  rationale: அரமேய வினைச்சொல்லின் நேரடிப் பொருளான ‘கட்டு’ என்பதைக் காக்கிறது; மறுபடியும் கட்டுதல் என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: இறைவனுடைய இந்த இல்லம்
  rationale: ‘இறைவனுடைய இல்லம்’ என்ற மூல உருவகத்தையும் சுட்டுப்பெயரான ‘இந்த’ என்பதையும் காக்கிறது; ‘ஆலயம்’ என்பது சூழலுக்கு ஏற்றதாயினும் சற்றே விளக்கமான மொழிபெயர்ப்பு.
- source_word: וּרְעוּת מַלְכָּא
  choice: அரசரின் விருப்பம்
  rationale: அரசரின் சித்தம் அல்லது தீர்மானத்தைக் குறிக்கும் அரசவை மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: עַל דְּנָה
  choice: இந்தக் காரியத்தைப் பற்றிய
  rationale: சுட்டுப்பெயரின் நிர்வாகச் சூழலைத் தெளிவுபடுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: எங்களுக்கு அனுப்பிவைக்கட்டும்
  rationale: மூலத்தின் வேண்டுகோள் தன்மையையும் ‘எங்களிடம் அனுப்புதல்’ என்ற நேரடிப் பொருளையும் காக்கிறது.
