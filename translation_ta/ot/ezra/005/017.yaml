  register: நவீனத் தரத் தமிழில், அரசரிடம் சமர்ப்பிக்கப்படும் கடிதத்திற்கேற்ற பணிவும் நிர்வாகத் தொனியும் காக்கப்பட்டுள்ளன. ‘இறைவனுடைய இல்லம்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; வாக்கியம் வாசிக்க எளிதாக இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
