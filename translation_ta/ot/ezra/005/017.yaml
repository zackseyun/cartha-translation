  source_fidelity: 'மூல அரமேயத்தின் கருத்தும் வாக்கிய அமைப்பும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: அரசருக்கான பணிவான நிபந்தனை, பாபிலோனிலுள்ள அரச கருவூலத்தில் செய்யப்பட வேண்டிய தேடல், கோரேசின் ஆணை இருந்ததா என்ற விசாரணை, பின்னர் அரசரின் விருப்பத்தை அனுப்புமாறு விடுக்கப்படும் கோரிக்கை ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. לְמִבְנֵא என்பதன் நேரடிப் பொருளான “கட்டுவதற்கு” முதன்மை உரையில் சரியாக உள்ளது; “மறுபடியும் கட்ட” என்பது அடிக்குறிப்பில் மட்டுமே மாற்றாகக் கொடுக்கப்பட்டுள்ளது.'
  naturalness: நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது. “அரசருக்கு நல்லதாகத் தோன்றினால்” மற்றும் “தேடிப் பார்க்கப்படட்டும்” ஆகியவை நிர்வாக/அரசவைச் சூழலுக்கு ஏற்ற பணிவான தொனியைத் தருகின்றன. இரு வாக்கியங்களாகப் பிரித்தமை கருத்தோட்டத்தைப் பாதிக்கவில்லை.
