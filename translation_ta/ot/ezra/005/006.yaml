base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: ta
  text: ஆற்றுக்கு அப்பாலுள்ள பகுதியின் ஆளுநரான தத்தெனாயும், சேத்தார்-பொஸ்னாயும், ஆற்றுக்கு அப்பாலுள்ள பகுதியில் இருந்த அவருடைய சகாக்களான அதிகாரிகளும்[a] தரியு மன்னனுக்கு அனுப்பிய கடிதத்தின் நகல் இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரிகள்’ என்பதற்குப் பதிலாக, இச்சொல்லை ஓர் இனத்தின் அல்லது நிர்வாகக் குழுவின் பெயராகக் கொண்டால், ‘அஃபர்சகாயர்’ எனவும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: நகல்
  rationale: அதிகாரப்பூர்வ ஆவணத்தின் எழுத்துப்படியை அல்லது பிரதியைச் சுட்டுகிறது; ‘நகல்’ இயல்பான நவீனத் தமிழில் இச்சூழலுக்கு ஏற்றது.
- source_word: אִגַּרְתָּא
  choice: கடிதம்
  rationale: அதிகாரப்பூர்வமாக அனுப்பப்பட்ட எழுத்துத் தகவலைத் தெளிவாகக் குறிக்கிறது.
- source_word: שְׁלַח
  choice: அனுப்பிய
  rationale: சார்பு வாக்கியத்தில் கடிதத்தை அனுப்பிய செயலை இயல்பான தமிழில் தருகிறது.
- source_word: תַּתְּנַי
  choice: தத்தெனாய்
  rationale: அராமியப் பெயரின் ஒலிவடிவம் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: פַּחַת
  choice: ஆளுநர்
  rationale: அகாமெனிய நிர்வாகச் சூழலில் ஒரு பிராந்தியத்தின் நிர்வாகத் தலைவரைக் குறிக்கும் எளிய, துல்லியமான சொல்.
- source_word: עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பால் பகுதி
  rationale: இது யூபிராத்து ஆற்றுக்கு மேற்கிலிருந்த பாரசீக நிர்வாகப் பிராந்தியத்தின் பெயராகப் பயன்படுகிறது; மூலத்தில் ஆற்றின் பெயர் சொல்லப்படாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: சேத்தார்-பொஸ்னாய்
  rationale: தனிநபர் பெயர் ஒலிப்பெயர்ப்பாக வழங்கப்பட்டது; கூட்டுப் பெயரின் அமைப்பை இணைப்புக்குறி காட்டுகிறது.
- source_word: וּכְנָוָתֵהּ
  choice: அவருடைய சகாக்கள்
  rationale: அவரோடு இணைந்து செயல்பட்டவர்களைச் சுட்டுகிறது; ஒருமை உடைமைப் பின்னொட்டை ‘அவருடைய’ என்று பாதுகாக்கிறது.
- source_word: אֲפַרְסְכָיֵא
  choice: அதிகாரிகள்
  rationale: சொல் தெளிவற்றது; இங்கு ஒரு நிர்வாகப் பணிக்குழுவைக் குறிக்கும் செயல்பாட்டு பொருள் சூழலுக்கு ஏற்றது. இன அல்லது குழுப் பெயராக வாசிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: தரியு அரசன்
  rationale: அரசப் பட்டத்தையும் பெயரையும் இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
