translation_notes:
  register: நவீன நிலையான தமிழில், அதிகாரப்பூர்வ ஆவணச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. அராமிய மூலத்தின் நீண்ட வாக்கிய அமைப்பு வாசிப்பிற்கு இயல்பாக ஒழுங்குபடுத்தப்பட்டாலும், அனுப்புநர்கள், பதவிகள், பிராந்தியம், பெறுநர் ஆகிய தகவல்கள் பாதுகாக்கப்பட்டுள்ளன.
