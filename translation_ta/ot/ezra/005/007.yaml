base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: ta
  text: 'அவர்கள் அவருக்கு ஓர் அறிக்கையை அனுப்பினார்கள்.[a] அதில் எழுதப்பட்டிருந்தது இதுதான்: “தரியு அரசருக்கு: எல்லா நலமும் உண்டாகட்டும்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிக்கை’ என்பதற்கான அராமியச் சொல் அதிகாரபூர்வமான செய்தி, ஆவணம் அல்லது கடிதம் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லா நலமும் உண்டாகட்டும்’ என்பது முழுமையான சமாதானத்தையும் நல்வாழ்வையும் வேண்டுகிற முறைப்படியான கடித வாழ்த்து.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: அறிக்கை
  rationale: அரச நிர்வாகச் சூழலில் இது அதிகாரபூர்வமான செய்தி, அறிக்கை அல்லது ஆவணத்தைக் குறிக்கலாம். இங்கு அரசருக்கு அனுப்பப்பட்ட எழுத்துப்பூர்வத் தகவல் என்பதால் ‘அறிக்கை’ இயல்பாகப் பொருந்துகிறது.
- source_word: שְׁלַחוּ
  choice: அனுப்பினார்கள்
  rationale: Peal இறந்தகால மூன்றாம் நபர் பன்மையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: עֲלוֹהִי
  choice: அவருக்கு
  rationale: שׁלח வினையுடன் வரும் இச்சொல் இங்கு செய்தி சென்றடையும் பெறுநரைக் குறிக்கிறது.
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: அதில் எழுதப்பட்டிருந்தது இதுதான்
  rationale: ஆவணத்திற்குள் இருந்த சொற்களை அறிமுகப்படுத்தும் அராமியத் தொடரின் சுட்டும் தன்மையையும் செயப்பாட்டு பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: தரியு அரசருக்கு
  rationale: לְ பெறுநரையும் מַלְכָּא பெயருடன் இணைந்த அரச பட்டத்தையும் குறிக்கிறது; தமிழில் பெயருக்கு அடுத்து பட்டத்தை அமைப்பது இயல்பானது.
- source_word: שְׁלָמָא כֹלָּא
  choice: எல்லா நலமும் உண்டாகட்டும்
  rationale: கடித வாழ்த்தில் שְׁלָמָא சமாதானம் மட்டுமல்லாது நல்வாழ்வு, நலம் ஆகியவற்றையும் குறிக்கிறது; כֹלָּא அதன் முழுமையை வலியுறுத்துகிறது. தமிழ் கடித வாழ்த்தாக இவ்வடிவம் பொருளைத் தெளிவாக வழங்குகிறது.
