base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: ta
  text: 'அப்போது நாங்கள் அந்த மூப்பர்களிடம் விசாரித்து, அவர்களிடம் இவ்வாறு சொன்னோம்: “இந்த ஆலயத்தைக் கட்டவும் இந்தக் கட்டமைப்பை நிறைவுசெய்யவும் உங்களுக்கு ஆணை வழங்கியவர் யார்?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படியான மொழிபெயர்ப்பு: “இந்த வீட்டைக் கட்டவும் இந்தக் கட்டமைப்பை நிறைவுசெய்யவும்”; இங்கே “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “கட்டமைப்பு” என மொழிபெயர்க்கப்பட்ட அரமேயச் சொல், கட்டிடத்தின் அமைப்பு, சட்டகம் அல்லது அதனுடன் தொடர்புடைய கட்டுமானப் பகுதியை இன்னும் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: அப்போது
  rationale: கதை அறிக்கையின் நிகழ்வுத் தொடரைக் குறிக்கும் அரமேய வினையடை; நவீனத் தமிழில் இயல்பாகக் காலத் தொடரை வெளிப்படுத்துகிறது.
- source_word: שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ
  choice: நாங்கள் அந்த மூப்பர்களிடம் விசாரித்து
  rationale: வினவுதல் என்ற பொருளையும், அறிக்கையின் முறையான நடையையும் காக்கிறது; אִלֵּךְ என்பதன் சுட்டுப்பொருளை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: அவர்களிடம் இவ்வாறு கேட்டோம்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் மூலத்தின் அமைப்பை இயல்பான தமிழில் தருகிறது; ஒரே வினவலைக் குறிக்கும் தேவையற்ற சொல்லிரட்டிப்பைத் தவிர்க்கிறது.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: உங்களுக்கு ஆணை பிறப்பித்தவர் யார்?
  rationale: டְעֵם என்பதன் நிர்வாகச் சூழலிலான அதிகாரபூர்வ ஆணை என்ற பொருளையும், அதை வழங்கிய அதிகாரியைப் பற்றிய கேள்வியையும் தெளிவாகக் காக்கிறது.
- source_word: בַּיְתָא דְנָה
  choice: இந்த ஆலயம்
  rationale: சொற்பொருள் ‘இந்த வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ சாதாரண தமிழ்வாசகருக்கு உடனடியாகத் தெளிவளிக்கிறது, சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמִבְנְיָה
  choice: கட்டவும்
  rationale: வினைச்சொல் ‘கட்டுதல்’ என்பதே; சூழல் மறுகட்டுதலைக் குறித்தாலும் மூலத்தில் வெளிப்படையாக இல்லாத ‘மீண்டும்’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: இந்தக் கட்டமைப்பை
  rationale: அரிதான பெயர்ச்சொல் கட்டிடத்தின் அமைப்பு, சட்டகம் அல்லது கட்டுமானப் பகுதியைக் குறிக்கலாம்; ‘கட்டமைப்பு’ அதன் உறுதியற்ற பரப்பைத் திறந்தே வைக்கிறது.
- source_word: לְשַׁכְלָלָה
  choice: நிறைவுசெய்யவும்
  rationale: வேலையை முழுமைக்குக் கொண்டுவருதல் என்ற பொருளை முறையான, இயல்பான தமிழில் தருகிறது.
