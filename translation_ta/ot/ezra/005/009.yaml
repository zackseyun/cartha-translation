translation_notes:
  register: நவீனத் தரத் தமிழில், முறையான நிர்வாக அறிக்கையின் கண்ணியமான தொனி காக்கப்பட்டுள்ளது. மூல அரமேயத்தின் கேள்வி வடிவமும் கட்டுமானச் சொல்லின் பொருள் உறுதியின்மையும் பாதுகாக்கப்பட்டுள்ளன.
