base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: ta
  text: அக்காலத்தில், ஆற்றுக்கு அப்பாலுள்ள பகுதியின்[b] ஆளுநரான தத்தெனாயும், சேத்தார்-போஸ்னாயும், அவர்களுடைய கூட்டாளிகளும் அவர்களிடம் வந்து, “இந்த ஆலயத்தைக் கட்டி, இந்தக் கட்டமைப்பை[c] நிறைவுசெய்ய உங்களுக்கு ஆணை[a] கொடுத்தது யார்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆணை’ என்பதற்கு ‘அரசாணை’ என்றும் மொழிபெயர்க்கலாம். அரமேயச் சொல் ஓர் அதிகாரப்பூர்வ உத்தரவு அல்லது ஆணையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆற்றுக்கு அப்பாலுள்ள பகுதி’ என்பது ஐபிராத்து ஆற்றின் மேற்குப் பகுதிக்கான பாரசீக நிர்வாகப் பெயர்.
    reason: cultural_note
  - marker: c
    text: ‘கட்டமைப்பு’ என மொழிபெயர்க்கப்பட்டுள்ள அரமேயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; அது குறிப்பாக ஆலயத்தின் கட்டிட அமைப்பையோ, ‘சுவர்’ அல்லது ‘கட்டுமானம்’ ஒன்றையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: அக்காலத்தில்
  rationale: நிகழ்வின் காலப் பின்னணியை இயல்பான நவீன தமிழில் குறிக்கும் அரமேய காலவழக்கு.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: அவர்களிடம் வந்து
  rationale: கட்டுமானப் பணியில் ஈடுபட்டிருந்தவர்களை அதிகாரிகள் அணுகியதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּתְּנַי
  choice: தத்தெனாய்
  rationale: அரமேய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதியின் ஆளுநர்
  rationale: פַּחַת என்பது மாகாண ஆளுநரைக் குறிக்கிறது; עֲבַר נַהֲרָה என்பது ஐபிராத்து ஆற்றின் மேற்குப் பகுதிக்கான பாரசீக நிர்வாகப் பெயர்.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: சேத்தார்-போஸ்னாய்
  rationale: கூட்டுப் பெயரின் வடிவத்தை இணைப்புக்குறியுடன் காக்கும் ஒலிபெயர்ப்பு.
- source_word: וּכְנָוָתְהוֹן
  choice: அவர்களுடைய கூட்டாளிகள்
  rationale: அவர்களோடு இணைந்திருந்த அதிகாரிகள் அல்லது துணைவர்களைக் குறிக்கும் பரந்த பொருளை இயல்பாகக் காக்கிறது.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: என்று கேட்டார்கள்
  rationale: நேரடியுரையில் ஒரு கேள்வி தொடர்வதால், தமிழில் ‘கேட்டார்கள்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: உங்களுக்கு ஆணை கொடுத்தது யார்?
  rationale: טְעֵם இங்கு அதிகாரப்பூர்வ ஆணை அல்லது அரசாணையைக் குறிக்கலாம்; ‘ஆணை’ அந்த நிர்வாகப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: இந்த ஆலயத்தைக் கட்டி
  rationale: בַּיְתָא என்பதன் அடிப்படைப் பொருள் ‘வீடு/இல்லம்’ என்றாலும், இச்சூழலில் அது ஆலயத்தைச் சுட்டுகிறது; ‘கட்ட’ என்ற பொருளை மட்டும் காத்து ‘மறுபடியும் கட்ட’ எனச் சேர்க்கவில்லை.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: இந்தக் கட்டுமானப் பணியை
  rationale: இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றது; சுவர், கட்டமைப்பு அல்லது ஆலயக் கட்டுமான வேலை எனப் புரிந்துகொள்ளலாம். ‘கட்டுமானப் பணி’ தேவையற்ற குறிப்பாக்கமின்றி பரந்த பொருளைக் காக்கிறது.
- source_word: לְשַׁכְלָלָה
  choice: முடிக்க
  rationale: ஒன்றை நிறைவுக்குக் கொண்டுவருதல் என்ற வினையின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
