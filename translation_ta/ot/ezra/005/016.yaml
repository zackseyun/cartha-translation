base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: ta
  text: அப்போது இந்தச் சேஷ்பாத்சார் வந்து, எருசலேமிலுள்ள தேவனுடைய வீட்டின் அடித்தளங்களை அமைத்தார்[a]. அன்றுமுதல் இன்றுவரை அது கட்டப்பட்டு வருகிறது[b]; ஆனாலும் அது இன்னும் கட்டி முடிக்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லாட்சிக்கு நெருக்கமாக, ‘அடித்தளங்களை வைத்தார்.’ அரமேய மரபுத்தொடர் சொல்லுக்குச் சொல் ‘அடித்தளங்களைக் கொடுத்தார்’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது கட்டப்பட்டுக்கொண்டிருக்கிறது.’ அரமேய வினைச்சொல் தொடர்ந்து நடைபெறும் செயப்பாட்டு நிகழ்வாக மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִין
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் காலத் தொடர்ச்சியைக் குறிக்கும் அரமேய வினையடை; இயல்பான நவீனத் தமிழில் ‘அப்போது’ பொருத்தமானது.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: இந்தச் சேஷ்பாத்சார்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; דֵּךְ என்பதன் சுட்டுப்பொருளை ‘இந்த’ தக்கவைக்கிறது.
- source_word: אֲתָא
  choice: வந்து
  rationale: எளிய கதைநடை வினை; அடுத்த கட்டுமானச் செயலுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: יְהַב אֻשַּׁיָּא
  choice: அடித்தளங்களை அமைத்தார்
  rationale: சொல்லுக்குச் சொல் ‘அடித்தளங்களைக் கொடுத்தார்’ என்ற அரமேய மரபுத்தொடர், தமிழ்க் கட்டுமான வழக்கில் இயல்பாக ‘அடித்தளங்களை அமைத்தார்’ என்று தரப்படுகிறது.
- source_word: בֵית אֱלָהָא
  choice: தேவனுடைய ஆலயம்
  rationale: மூலத்தில் ‘தேவனுடைய வீடு’; இங்கு எருசலேம் வழிபாட்டுக் கட்டடத்தைக் குறிப்பதால் தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது, அதேவேளை குறிப்பை விரிவாக்கவில்லை.
- source_word: דִּי בִירוּשְׁלֶם
  choice: எருசலேமிலுள்ள
  rationale: இடத்தைக் குறிக்கும் சார்பு தொடரைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: அன்றுமுதல் இன்றுவரை
  rationale: அடித்தளம் அமைக்கப்பட்ட காலத்திலிருந்து பேச்சாளரின் நிகழ்காலம் வரையிலான காலவெளியைத் துல்லியமாகக் காட்டுகிறது.
- source_word: מִתְבְּנֵא
  choice: அது கட்டப்பட்டு வருகிறது
  rationale: செயப்பாட்டு மற்றும் தொடர்நிலைப் பொருளைத் தக்கவைத்து, கடந்த காலத்தில் தொடங்கி தற்போதும் நீளும் கட்டுமானச் செயல்முறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלָא שְׁלִם
  choice: ஆனாலும் அது இன்னும் கட்டி முடிக்கப்படவில்லை
  rationale: தற்போதைய நிறைவின்மையைத் தெளிவாகக் காட்டுகிறது; சூழலில் எதிர்மறைத் தொடர்பை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
