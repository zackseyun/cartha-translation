base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: ta
  text: 'அரசருக்குத் தெரியப்படுத்தப்படுவது என்னவென்றால்: நாங்கள் யூதா மாகாணத்திலுள்ள மாபெரும் கடவுளின் ஆலயத்திற்குச் சென்றோம். அது மிகப் பெரிய கற்களால் கட்டப்பட்டு வருகிறது; சுவர்களில் மரக்கட்டைகள் பதிக்கப்படுகின்றன. இந்த வேலை முனைப்புடன்[a] செய்யப்படுகிறது; அவர்களால் அது வெற்றிகரமாக முன்னேறி வருகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முனைப்புடன்” என்பதற்கு “கவனமாக” அல்லது “விரைவாக” என்றும் மொழிபெயர்க்கலாம். அரமேய வினையடையின் நுண்பொருள் விவாதத்திற்குரியது; எனினும் வேலை திறம்பட முன்னேறுவதை அது தெளிவாகக் குறிக்கிறது.
    reason: lexical_alternative
