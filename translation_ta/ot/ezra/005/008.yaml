  rationale: அதிகாரப்பூர்வ அறிக்கையை அறிமுகப்படுத்தும் அரமேய நிர்வாகச் சூத்திரத்தின் முறையான தொனியை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: אֲזַלְנָא
  choice: நாங்கள் ... சென்றோம்
  rationale: அறிக்கை அளிப்போரின் பார்வையிலிருந்து இயக்கத்தைக் குறிக்கும் வினையின் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: לִיהוּד מְדִינְתָּא
  choice: யூதா மாகாணத்திலுள்ள
  rationale: மְדִינְתָּא என்பது பேரரசின் நிர்வாக மாகாணத்தைக் குறிக்கிறது; அடுத்த இடச்சொற்றொடருடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: மகத்தான கடவுளின் ஆலயத்திற்கு
  rationale: בֵּית என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இங்கு குறிப்பது ஆலயம் என்பது தெளிவு; ‘மகத்தான கடவுள்’ என்ற மரியாதைத் தொனி பாதுகாக்கப்படுகிறது.
- source_word: מִתְבְּנֵא
  choice: கட்டப்பட்டு வருகிறது
  rationale: தொடர்ந்து நடைபெறும் கட்டுமானத்தை அரமேயச் செயல்பாட்டு வடிவுக்கு ஏற்றவாறு எடுத்துரைக்கிறது.
- source_word: אֶבֶן גְּלָל
  choice: மிகப் பெரிய கற்களால்
  rationale: கட்டுமானத்துக்குப் பயன்படுத்தப்பட்ட பாரிய கற்களைக் குறிக்கும் சொற்றொடர்; ‘உருட்டப்பட்ட கற்கள்’ என்ற அளவுக்கு மீறிய சொற்பிறப்பியல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: சுவர்களில் மரக்கட்டைகள் பதிக்கப்படுகின்றன
  rationale: கட்டுமானச் சூழலில் மரம் சுவர் அமைப்புக்குள் வைக்கப்படுவதை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: וַעֲבִידְתָּא דָךְ
  choice: இந்த வேலை
  rationale: கட்டுமானப் பணியை மிகைப்படுத்தாமல் நேரடியாகக் குறிக்கிறது.
- source_word: אָסְפַּרְנָא מִתְעַבְדָא
  choice: முனைப்புடன் நடைபெற்று
