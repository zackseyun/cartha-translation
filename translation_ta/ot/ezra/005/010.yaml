base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: ta
  text: மேலும், உமக்குத் தெரிவிப்பதற்காக, அவர்களுடைய பெயர்களை நாங்கள் அவர்களிடம் கேட்டோம்; அவர்களுக்குத் தலைவர்களாக இருந்த மனிதர்களின் பெயர்களை எழுதுவதற்காகவும் கேட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவர்களின் தலைகளில் இருந்த மனிதர்கள்”; அதாவது, அவர்களிடையே தலைமை வகித்த மனிதர்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: மேலும்
  rationale: அதிகாரிகளின் அறிக்கையில் இன்னொரு தகவலைச் சேர்க்கும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁמָהָתְהֹם
  choice: அவர்களுடைய பெயர்களையும்
  rationale: மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டையும், וְאַף என்பதன் சேர்க்கைப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: நாங்கள் அவர்களிடம் கேட்டோம்
  rationale: அரமேய வினையின் எளிய ‘கேள்/விசாரி’ பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לְהוֹדָעוּתָךְ
  choice: அவற்றை உமக்குத் தெரிவித்து
  rationale: ידע வேரின் causative infinitive நோக்கத்தைத் தருகிறது; ‘அவற்றை’ என்பது முன்வந்த பெயர்களைக் குறிக்கிறது. அரசனை நோக்கிய உரை என்பதால் ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: דִּי נִכְתֻּב
  choice: எழுதிவைப்பதற்காகவே
  rationale: ஆவணத்தில் பதிவு செய்யும் சூழலில் ‘எழுது’ என்பதன் நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘வே’ தொடர் நோக்கத்தைத் தெளிவுபடுத்துகிறது.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: மனிதர்களின் பெயர்களை
  rationale: שֻׁם வடிவில் ஒருமையாக இருந்தாலும் இங்கு பன்மைக் குழுவுடன் கூட்டுப்பொருளில் வருவதால் தமிழில் ‘பெயர்களை’ எனத் தரப்பட்டுள்ளது; גֻּבְרַיָּא என்பதன் அடிப்படைப் பொருள் தனியே பாதுகாக்கப்படுகிறது.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: அவர்களுக்குத் தலைவர்களாக இருந்த
  rationale: சொல்லுக்குச் சொல் ‘அவர்களின் தலையில்/முன்னிலையில் இருந்த’ என்ற உருவகத்தின் சூழல்சார் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
