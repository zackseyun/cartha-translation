translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்கு அளிக்கப்படும் அதிகாரப்பூர்வ அறிக்கைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமக்கு’ என்பது அரசனை நேரடியாகச் சுட்டும் ஒருமை மரியாதை வடிவம். மூலத்தின் நீண்ட நோக்கத் தொடரை தமிழில் தெளிவாக்கியபோதும் அதன் தகவல் வரிசை பாதுகாக்கப்பட்டுள்ளது.
