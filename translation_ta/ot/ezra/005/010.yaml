    text: 'சொல்லுக்குச் சொல்: “அவர்களின் தலைகளில் இருந்த மனிதர்கள்”; அதாவது, அவர்களிடையே தலைமை வகித்த மனிதர்கள்.'
    reason: lexical_alternative
  revision_rationale: The revision removes the misleading completed-action participle, redundant ‘அப்படிக் கேட்டோம்,’ and unsupported emphasis. It renders both source purpose elements clearly in formal, natural Tamil while retaining the distinction that the queried names were those of the men leading the group.
