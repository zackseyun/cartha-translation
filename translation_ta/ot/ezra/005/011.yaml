base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: ta
  text: அவர்கள் எங்களுக்குத் திருப்பிக் கூறிய பதில் இதுதான்:[a] “நாங்கள் வானத்துக்கும் பூமிக்கும் தேவனின் சேவகர்கள். பல ஆண்டுகளுக்கு முன்பு கட்டப்பட்ட ஆலயத்தை நாங்கள் கட்டிக்கொண்டிருக்கிறோம்.[b] இஸ்ரயேலின் பெரிய அரசர் ஒருவர் அதைக் கட்டி முடித்தார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எங்களுக்குத் திருப்பி அனுப்பிய செய்தி இதுவே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலயத்தை நாங்கள் மீண்டும் கட்டிக்கொண்டிருக்கிறோம்.” அரமேயப் பங்கேற்பு வடிவம் தொடர்ந்து நடைபெறும் கட்டுமானத்தைக் குறிக்கிறது; ஆலயம் முன்பு இருந்ததைச் சூழல் தெளிவுபடுத்துவதால் ‘மீண்டும்’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא לְמֵמַר
  choice: அவர்கள் எங்களுக்குத் திருப்பிக் கூறிய பதில் இதுதான்
  rationale: இந்த அரமேயச் சொற்றொடர் பதிலின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ‘திருப்பிக் கூறிய பதில்’ என்பது הֲתִיבוּנָא என்பதிலுள்ள ‘திருப்புதல்’ என்ற உருவகத்தையும் சூழலுக்குரிய பதிலளித்தல் என்ற பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: עַבְדוֹהִי
  choice: ஊழியர்கள்
  rationale: இச்சூழலில் இது அடிமை நிலையைக் காட்டுவதைவிட, தேவனுக்குச் செய்யும் பணியையும் அவருக்கு உட்பட்டிருப்பதையும் குறிக்கிறது; நவீன தமிழில் ‘ஊழியர்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: வானத்துக்கும் பூமிக்கும் தேவனானவர்
  rationale: வானம், பூமி அனைத்தின்மேலும் தேவனுக்குள்ள ஆட்சியுரிமையை வெளிப்படுத்தும் அரமேயப் பட்டப்பெயரைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וּבָנַיִן
  choice: கட்டிக்கொண்டிருக்கிறோம்
  rationale: பங்கேற்பு வடிவம் தொடர்ந்து நடைபெறும் செயலைக் குறிக்கிறது. ஆலயம் முன்பே இருந்ததால் ‘மீண்டும் கட்டுகிறோம்’ என்பதும் சூழலுக்கு ஏற்றது; ஆனால் அந்தக் கருத்தை வினைச்சொல் வெளிப்படையாகச் சொல்லாததால் முதன்மை உரையில் பொதுவான தொடர்செயல் வடிவம் வைக்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּיְתָא
  choice: ஆலயம்
  rationale: நேரடிப் பொருள் ‘வீடு’ என்றாலும், இங்கு குறிப்பது தேவாலயத்தை என்பதால் சாதாரண வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: பல ஆண்டுகளுக்கு முன்பு கட்டப்பட்டிருந்த
  rationale: ‘இதற்கு முன் பல ஆண்டுகள்’ என்ற காலக் கருத்தையும், முந்தைய கட்டுமானத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: இஸ்ரயேலின் பெரிய அரசர் ஒருவர்
  rationale: ரַב என்பது இங்கு பெருமை அல்லது மேன்மையைக் குறிக்கிறது. அரசரின் பெயரை மூல உரை குறிப்பிடாததால் மொழிபெயர்ப்பிலும் குறிப்பிடப்படவில்லை.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: இதைக் கட்டி முடித்தார்
  rationale: கட்டத் தொடங்கியதையும் முழுமைக்கு கொண்டுவந்ததையும் குறிக்கும் இரு வினைகளையும் இயல்பான தமிழில் ‘கட்டி முடித்தார்’ என்பதன் மூலம் தெரிவிக்கிறது.
theological_decisions:
- issue: அரச நிர்வாகக் கடிதத்தில் வரும் தெய்வப் பட்டப்பெயர்
  choice: வானத்துக்கும் பூமிக்கும் தேவனானவர்
  alternative: வானங்கள் மற்றும் பூமியின் தேவன்
  rationale: இந்தப் பட்டப்பெயர் இஸ்ரயேலின் தேவனை ஒரு உள்ளூர் தெய்வமாகக் குறுக்காமல், வானம் மற்றும் பூமி அனைத்தின்மேலும் அவருக்குள்ள ஆட்சியை நேரடியாகக் கூறுகிறது. தமிழில் இயல்பான ஒருமை ‘வானம்’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகருக்குத் தெளிவான, கண்ணியமான நடை. மூலத்தின் நிர்வாக அறிக்கைத் தொனியும் நேரடி மேற்கோளும் காக்கப்பட்டுள்ளன. ‘வீடு’ என்பதற்குப் பதில் சூழல் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; ‘மீண்டும் கட்டுதல்’ என்ற சூழல்சார் விளக்கம் முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
