source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: ta
  text: மேலும், தேவனுடைய வீட்டின் பொன், வெள்ளிப் பாத்திரங்களை நேபுகாத்நேச்சார் எருசலேமிலிருந்த ஆலயத்திலிருந்து வெளியே எடுத்துப் பாபிலோனின் ஆலயத்துக்குக் கொண்டுவந்திருந்தார். கோரேசு அரசர் அவற்றைப் பாபிலோனின் ஆலயத்திலிருந்து வெளியே எடுத்து, தான் ஆளுநராக நியமித்திருந்த சேஷ்பாத்சார் என்பவரிடம்[a] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “சேஷ்பாத்சார் என்று பெயருடையவரிடம் கொடுத்தார்; அவரை ஆளுநராக நியமித்திருந்தார்.”'
    reason: שְׁמֵהּ (‘அவருடைய பெயர்’) என்ற அரமேய அடையாளப்படுத்தும் சொல்லாட்சியின் முறையான மாற்று மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: וְאַף
  choice: மேலும்
  rationale: கூடுதல் தகவலை அறிமுகப்படுத்தும் அரமேய இணைப்புச் சொல்லின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מָאנַיָּא
  choice: பாத்திரங்கள்
  rationale: ஆலயத்தில் பயன்படுத்தப்பட்ட பொருட்களைக் குறிக்கும் சூழலுக்கேற்ற, தெளிவான பொதுத் தமிழ்ச் சொல்.
- source_word: בֵית אֱלָהָא
  choice: தேவனுடைய வீடு
  rationale: மூலத்தின் ‘தேவனுடைய வீடு’ என்ற சொல்லாட்சியைப் பேணுகிறது; பின்னர் வரும் הֵיכְלָא என்பதற்கு ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: பொன், வெள்ளிப் பாத்திரங்கள்
  rationale: பாத்திரங்கள் செய்யப்பட்ட பொருட்களைத் தமிழில் இயல்பான அடைமொழி அமைப்பில் தெரிவிக்கிறது.
- source_word: הַנְפֵּק
  choice: வெளியே எடுத்தார்
  rationale: ஆலயத்திலிருந்து பொருட்களை அகற்றிக் கொண்டுசென்ற செயலை நேரடியாகத் தெரிவிக்கிறது; முதல் நிகழ்வில் ‘கொண்டுவந்திருந்தார்’ என்பதுடன் இணைந்து முந்திய காலவரிசையும் தெளிவாகிறது.
- source_word: הֵיכְלָא
  choice: ஆலயம்
  rationale: எருசலேமிலும் பாபிலோனிலும் உள்ள வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் இச்சூழலில் பொருத்தமான சொல்.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: கொண்டுவந்திருந்தார்
  rationale: பாத்திரங்களைக் கொண்டுவந்த செயலைப் பொருள் இழப்பின்றித் தருவதோடு, கோரேசின் பின்னைய செயலுக்கு முந்திய நிகழ்வு என்பதையும் காட்டுகிறது.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: கோரேசு அரசர்
  rationale: பெயரையும் அரசப் பட்டத்தையும் நவீனத் தமிழில் இயல்பான வரிசையில் தருகிறது.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: சேஷ்பாத்சார் என்பவரிடம் கொடுத்தார்
  rationale: ‘அவருடைய பெயர் சேஷ்பாத்சார்’ என்ற அரமேய அடையாளப்படுத்தும் சொற்றொடரை இயல்பான தமிழில் பொருள் மாறாமல் வழங்குகிறது.
- source_word: פֶחָה
  choice: ஆளுநர்
  rationale: பாரசீக நிர்வாகப் பதவிக்கான துல்லியமும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான தமிழ்ச் சொல்.
- source_word: שָׂמֵהּ
  choice: நியமித்திருந்த
  rationale: அதிகாரப்பூர்வப் பதவியில் அமர்த்தியதைக் காட்டுகிறது; பாத்திரங்கள் கொடுக்கப்படுவதற்கு முன்பே நியமனம் நிகழ்ந்ததை வினைநிலை வெளிப்படுத்துகிறது.
