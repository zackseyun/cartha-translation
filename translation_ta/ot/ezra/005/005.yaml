  verdict: revise
  source_fidelity: 'முதற் வாக்கியத்தில் இறை உருவகம், ‘அவர்களுடைய’ என்னும் பின்னொட்டு, மற்றும் யூத மூப்பர்கள் என்பவை நன்றாகத் தக்கவைக்கப்பட்டுள்ளன. ஆனால் வரைவில் மூலத்தின் நிகழ்வுவரிசை மாற்றப்பட்டுள்ளது: மூலத்தில் தரியுவிடம் தீர்மானம்/ஆணை செல்லுதல் முதலில்; பின்னர் அவர்கள் இந்த விஷயத்தைப் பற்றிய கடிதத்தைத் திருப்பி அனுப்புதல். வரைவில் அறிக்கை தரியுவிடம் சென்று, அதன்பின் பதில் திரும்பிவருவது எனப் பொருள் மாறுகிறது. மேலும் טַעְמָא என்பதற்கு முதன்மை உரையில் ‘அறிக்கை’ என்பது போதிய ஆதாரமற்ற தேர்வு; ‘தீர்மானம்’ அல்லது ‘ஆணை’ பொருத்தமானது.'
  naturalness: ‘கடவுளின் கண் ... மேல் இருந்தது’ என்பது மூல உருவகத்தைச் சற்றும் விளக்கவுரையாக்காமல் நவீன பொதுத்தமிழில் இயல்பாகத் தருகிறது. திருத்தப்பட்ட வாக்கியத்தில் தொடர்புடைய காலவரிசை தெளிவாகவும் நிர்வாகச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
  terminology: ‘யூதர்களின் மூப்பர்கள்’ என்பது שָׂבֵי יְהוּדָיֵא-க்கு துல்லியமானது. טַעְמָא-க்கு ‘தீர்மானம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘ஆணை’ மாற்றுவாசிப்பாகக் குறிக்கப்படுகிறது. נִשְׁתְּוָנָא-க்கு ‘கடிதம்’ என்பதே நேரடியானது; ‘பதில்’ என்பதை முதன்மை உரையில் சேர்ப்பது தேவையற்ற விளக்கமாகும்.
