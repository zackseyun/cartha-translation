  to: ஆனால் அவர்களுடைய கடவுளின் கண் யூதர்களின் மூப்பர்கள்மேல் இருந்தது[a]. தரியுவிடம் ஒரு தீர்மானம் செல்லும் வரையும், பின்னர் இதைக் குறித்து அவர்கள் ஒரு கடிதத்தைத் திருப்பி அனுப்பும் வரையும், அவர்கள் அவர்களை நிறுத்திவிடவில்லை[b][c].
  rationale: 'திருத்தம் மூல அரமேயத்தின் வரிசையை மீட்டெடுக்கிறது: முதலில் தரியுவிடம் தீர்மானம்/ஆணை செல்லுதல்; பின்னர் இந்த விஷயத்தைக் குறித்த கடிதத்தை அவர்கள் திருப்பி அனுப்புதல். சுட்டுப்பெயர்களின் மூலத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது; ‘அதிகாரிகள்,’ ‘பணி,’ மற்றும் தரியுவிடமிருந்து ‘பதில்’ போன்ற சூழல்சார் சேர்க்கைகள் நீக்கப்பட்டுள்ளன. இறை கண் என்ற உருவகம் அப்படியே தக்கவைக்கப்பட்டுள்ளது.'
