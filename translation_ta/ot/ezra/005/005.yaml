base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: ta
  text: ஆனால் அவர்களுடைய கடவுளின் கண் யூதர்களின் மூப்பர்கள்மேல் இருந்தது[a]. தரியுவிடம் ஒரு தீர்மானம் செல்லும் வரையும், பின்னர் இதைக் குறித்து அவர்கள் ஒரு கடிதத்தைத் திருப்பி அனுப்பும் வரையும், அவர்கள் அவர்களை நிறுத்திவிடவில்லை[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கடவுள் யூதர்களின் மூப்பர்களைக் கண்காணித்துக்கொண்டிருந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தரியுவிடம் ஒரு ஆணை செல்லும் வரை” அல்லது “தரியுவிடம் ஒரு தீர்மானம் செல்லும் வரை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பின்னர் இதைக் குறித்து அவர்கள் ஒரு கடிதம் அனுப்பும் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: ஆனால் அவர்களுடைய கடவுளின் கண் ... மேல் இருந்தது
  rationale: அரமேய மூலத்தின் ஒருமை உருவகமான ‘கண்’ என்பதையும் ‘அவர்களுடைய’ என்ற பின்னொட்டையும் தக்கவைக்கிறது; முந்தைய வசனத்தின் எதிர்ப்புடன் உள்ள கருத்து மாறுபாட்டை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: யூதர்களின் மூப்பர்கள்
  rationale: שָׂבֵי என்பது பொதுவான தலைவர்களை அல்ல, சமூகத்தின் மூப்பர்களைக் குறிக்கிறது.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: அதிகாரிகள் அவர்களைப் பணியை நிறுத்தச் செய்யவில்லை
  rationale: Pael வினையின் செயலை நிறுத்தச் செய்யும் பொருளை வெளிப்படுத்துகிறது. தமிழில் எழுவாய் தெளிவாக இருக்க முந்தைய சூழலில் உள்ள அதிகாரிகள் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளனர்; ‘பணி’ என்பது ஆலயக் கட்டுமானத்தைக் குறிக்கும் சூழல்சார் நிரப்பல்.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: இந்த விவகாரம் குறித்த அறிக்கை தரியுவிடம் சென்று
  rationale: பாரசீக நிர்வாகச் சூழலில் טְעֵם என்பது அரசாணை/தீர்மானம் மட்டுமன்றி அதிகாரப்பூர்வ அறிக்கை அல்லது விவகாரத்தையும் குறிக்கலாம். இங்கு அது தரியுவிடம் அனுப்பப்பட்டு பின்னர் எழுத்துப்பூர்வப் பதில் வருவதால் ‘அறிக்கை’ சூழலுக்கு ஏற்றது.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: அதற்கான எழுத்துப்பூர்வமான பதில் திரும்பிவரும் வரை
  rationale: יְתִיבוּן என்பதன் ‘திருப்பி அனுப்புதல்/திரும்புதல்’ கருத்தையும் נִשְׁתְּוָנָא என்பதன் அதிகாரப்பூர்வ எழுத்துத் தொடர்பையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: கடவுளின் கண் என்ற மனித உருவக மொழி
  choice: அவர்களுடைய கடவுளின் கண் ... மேல் இருந்தது
  alternative: அவர்களுடைய கடவுள் ... கண்காணித்துக்கொண்டிருந்தார்
  rationale: மூலத்தின் தெளிவான உருவகத்தை விளக்கவுரையாக மாற்றாமல் தக்கவைத்து, கடவுளின் பாதுகாப்பான கண்காணிப்பை வாசகர் உணர இடமளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’, ‘எழுத்துப்பூர்வமான பதில்’ ஆகிய சொற்கள் வரலாற்று-நிர்வாகச் சூழலைத் தெளிவாகக் காட்டுகின்றன. மூலத்தின் நீண்ட காலவாக்கியம் தமிழில் இயல்பாக அமைய முன்னிலைத் துணைவாக்கியங்களாக ஒழுங்குபடுத்தப்பட்டுள்ளது.
