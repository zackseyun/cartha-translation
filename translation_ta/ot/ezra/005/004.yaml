source:
  edition: WLC
  text: אֱדַ֥יִן כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן אִנּוּן֙ שְׁמָהָ֣ת גֻּבְרַיָּ֔/א דִּֽי דְנָ֥ה בִנְיָנָ֖/א בָּנַֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/004.yaml
  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: ta
  text: 'அப்போது நாங்கள் அவர்களிடம் இவ்வாறு சொன்னோம்: “இந்தக் கட்டிடத்தைக் கட்டுகிற ஆண்களின் பெயர்கள் என்ன?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அப்போது நாங்கள் அவர்களிடம் இவ்வாறு சொன்னோம்: ‘இந்தக் கட்டிடத்தைக் கட்டுகிற ஆண்களின் பெயர்கள் என்ன?’”'
    reason: ‘கேட்டோம்’ என்று பொருள் விளக்காமல், மூல அரமேயத்தின் ‘சொன்னோம்’ என்ற வினையையும் ‘இவ்வாறு’ என்ற வடிவையும் வெளிப்படையாகக் காட்டும் மாற்று வடிவம்.
lexical_decisions:
- source_word: אֱדַיִן
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த செயலை அறிமுகப்படுத்தும் கால அடைமொழி; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: כְּנֵמָא
  choice: இவ்வாறு
  rationale: ‘இப்படியாக/பின்வருமாறு’ என்ற பொருளைத் தருகிறது; தொடர்ந்து வரும் நேரடிக் கூற்றுக்கு ஏற்ற இயல்பான தமிழ் வடிவம்.
- source_word: אֲמַרְנָא לְּהֹם
  choice: நாங்கள் அவர்களிடம் ... சொன்னோம்
  rationale: மூலத்தில் உள்ள முதலாம் நபர் பன்மையையும் ‘சொல்’ என்ற வினையின் அடிப்படைப் பொருளையும் பாதுகாக்கிறது. கூற்று கேள்வியாக இருந்தாலும் ‘கேட்டோம்’ என்று மாற்றாமல் மூலச் சொல்லுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: பெயர்கள் என்ன?
  rationale: பெயர்களைக் குறித்து அடையாளம் கேட்கும் கேள்வியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גֻּבְרַיָּא
  choice: ஆண்கள்
  rationale: மூல அரமேயச் சொல் ஆண்பாலினரைக் குறிப்பதால் பாலினத் துல்லியம் பாதுகாக்கப்படுகிறது.
- source_word: דִּי
  choice: கட்டுகிற
  rationale: ‘ஆண்கள்’ என்பவர்களை அவர்களது செயல் மூலம் விளக்கும் தொடர்புச் சொல்லின் பொருள் தமிழில் வினையெச்சத் தொடர்பாக இயல்பாக வெளிப்படுகிறது.
- source_word: דְנָה בִנְיָנָא
  choice: இந்தக் கட்டிடம்
  rationale: சுட்டுப்பெயரையும் கட்டப்படுகின்ற பொருளையும் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: בָּנַיִן
  choice: கட்டுகிற
  rationale: நடைபெற்றுக்கொண்டிருக்கும் கட்டுமானச் செயலை நிகழ்காலத் தொடர்பு வடிவில் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மறுபடியும் கட்டுதல்’ என்ற கருத்தைச் சேர்க்கவில்லை.
