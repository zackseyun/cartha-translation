revisions:
- from: ஆனால், எங்கள் முன்னோர்கள் பரலோகத்தின் கடவுளுக்குச் சினமூட்டியதால்[a], அவர் அவர்களைப் பாபிலோன் அரசனான கல்தேயன் நேபுகாத்நேச்சாரின் கையில் ஒப்படைத்தார். அவன் இந்த இல்லத்தை[b] அழித்து, அதன் மக்களைப் பாபிலோனுக்கு நாடுகடத்தினான்[c].
  to: ஆகையால், எங்கள் முன்னோர்கள் பரலோகத்தின் கடவுளுக்குச் சினமூட்டியதால்[a], அவர் அவர்களைக் கல்தேயனான பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் கையில் ஒப்படைத்தார். அவன் இந்த இல்லத்தை[b] அழித்து, மக்களைப் பாபிலோனுக்கு நாடுகடத்தினான்[c].
  rationale: The revision replaces the adversative connector with the inferential ‘ஆகையால்,’ removes the added possessive in ‘அதன் மக்களை,’ and improves the ordering of Nebuchadnezzar’s ethnic and royal appositions. It retains the source’s direct attribution of judgment to God, the literal ‘house’ for the temple, and the deportation sense of the final verb. Footnote c is adjusted so that it offers a genuine, non-contradictory lexical alternative to ‘நாடுகடத்தினான்.’
