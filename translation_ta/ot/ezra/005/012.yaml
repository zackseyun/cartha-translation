base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: ta
  text: ஆகையால், எங்கள் முன்னோர்கள் பரலோகத்தின் கடவுளுக்குச் சினமூட்டியதால்[a], அவர் அவர்களைக் கல்தேயனான பாபிலோன் அரசன் நேபுகாத்நேச்சாரின் கையில் ஒப்படைத்தார். அவன் இந்த இல்லத்தை[b] அழித்து, மக்களைப் பாபிலோனுக்கு நாடுகடத்தினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரலோகத்தின் கடவுளைக் கோபப்படுத்தியதால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘இல்லம்’ என்பது இங்கே ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘மக்களைப் பாபிலோனுக்குக் கொண்டு சென்றான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: ஆனால்
  rationale: இச்சூழலில் முந்தைய வசனத்தில் கூறப்பட்ட நிலைக்கு மாறான வரலாற்றுக் காரணத்தை அறிமுகப்படுத்தும் அரமேய இணைப்புச்சொல்; ‘ஆனால்’ அதன் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִן דִּי
  choice: …தால்
  rationale: காரணத்தைக் குறிக்கும் அரமேயச் சொற்றொடரைத் தமிழின் இயல்பான காரண விகுதியால் மொழிபெயர்க்கிறது.
- source_word: הַרְגִּזוּ
  choice: சினமூட்டியதால்
  rationale: רגז என்பதன் காரணவினைப் பொருளான ‘சினம் ஏற்படுத்துதல்’ என்பதைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: אֲבָהֳתַנָא
  choice: எங்கள் முன்னோர்கள்
  rationale: சொல்லுக்கு நேரான ‘எங்கள் தந்தையர்’ என்பதைக் காட்டிலும், தலைமுறைக்கு முந்தியவர்களைக் குறிக்கும் பொருளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: பரலோகத்தின் கடவுள்
  rationale: சிறைப்பிடிப்புக்குப் பிந்தைய காலத்தில் பயன்படுத்தப்பட்ட இறைப்பட்டத்தை அதன் அமைப்போடு காக்கிறது.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: அவர்களை … கையில் ஒப்படைத்தார்
  rationale: மற்றொருவரின் அதிகாரத்திற்குள் கொடுத்தல் என்ற வேதாகமச் சொல்லியக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: பாபிலோன் அரசனான கல்தேயன் நேபுகாத்நேச்சார்
  rationale: அரசப் பட்டத்தையும் நேபுகாத்நேச்சாருடன் ஒருமையில் நிற்கும் இன அடையாளமான ‘கல்தேயன்’ என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: וּבַיְתָה דְנָה
  choice: இந்த இல்லத்தை
  rationale: மூலத்தில் ‘ஆலயம்’ என்பதற்குப் பதில் ‘இல்லம்/வீடு’ என்ற சொல் இருப்பதால் அதை முதன்மை உரையில் காத்து, அதன் குறிப்பை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: סַתְרֵהּ
  choice: அழித்து
  rationale: கட்டிடத்தை இடித்தழித்தல் என்ற வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: அதன் மக்களைப் பாபிலோனுக்கு நாடுகடத்தினான்
  rationale: ‘அதன் மக்கள்’ என்ற உடைமைத் தொடர்பையும், கட்டாயமாக வேறிடத்திற்குச் சிறையாக்கிக் கொண்டு செல்லுதல் என்ற காரணவினைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: இறைத்தீர்ப்பின் நேரடியான காரணச் செயல்
  choice: அவர் அவர்களை … கையில் ஒப்படைத்தார்
  alternative: அவர்கள் … கையில் விழ அவர் அனுமதித்தார்
  rationale: மூல உரை கடவுள் நேரடியாக ஒப்படைத்ததாகக் கூறுகிறது; வெறும் அனுமதியாக மாற்றி இறைச்செயலை மென்மைப்படுத்தவில்லை.
- issue: ஆலயத்தைக் குறிக்கும் ‘இல்லம்’ என்ற உருவகம்
  choice: இந்த இல்லத்தை
  alternative: இந்த ஆலயத்தை
  rationale: குறிப்பது ஆலயத்தையே என்றாலும், மூலத்தின் ‘இல்லம்’ என்ற இறையியல் நிறைந்த சொல்லாட்சியை முதன்மை உரையில் காக்கிறது; வாசகருக்காக அடிக்குறிப்பில் குறிப்பை விளக்குகிறது.
- issue: முன்னோர்களின் செயலும் அதற்கான தீர்ப்பும்
  choice: முன்னோர்கள் … சினமூட்டியதால் … ஒப்படைத்தார்
  alternative: முன்னோர்கள் தவறு செய்ததால் அவர்கள் தோற்கடிக்கப்பட்டார்கள்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைத் தொடர்பையும் காரண-விளைவு வலிமையையும் பொதுவான ஒழுக்கக் கூற்றாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகப் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்னோர்கள்’ என்பது தலைமுறைப் பொருளைத் தெளிவாக்குகிறது; ‘இல்லம்’ மூல உருவகத்தைப் பாதுகாக்கிறது. கடவுளைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்றும் நேபுகாத்நேச்சாரைக் குறிக்கும் ஒருமை வினைமுற்றும் வேறுபடுத்தப்பட்டுள்ளன.
