translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இறைவனின் இல்லம்’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘ஆணை பிறப்பித்தார்’ அரச நிர்வாகச் சொல்லாட்சியை இயல்பாக வழங்குகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
