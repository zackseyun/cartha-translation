  text: בְּרַם֙ בִּ/שְׁנַ֣ת חֲדָ֔ה לְ/כ֥וֹרֶשׁ מַלְכָּ֖/א דִּ֣י בָבֶ֑ל כּ֤וֹרֶשׁ מַלְכָּ/א֙ שָׂ֣ם טְעֵ֔ם בֵּית אֱלָהָ֥/א דְנָ֖ה לִ/בְּנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: ta
  text: ஆனால், பாபிலோனின் அரசனான கோரேசின் ஆட்சியின் முதலாம் ஆண்டில், இந்த இறைவனின் இல்லத்தை மீண்டும் கட்டும்படி[a] கோரேசு அரசன் ஓர் ஆணை பிறப்பித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த இறைவனின் இல்லத்தைக் கட்டும்படி.’ அரமேய வினை நேரடியாக ‘கட்டு’ என்று பொருள்படும்; ‘மீண்டும் கட்டு’ என்பது ஆலயம் மீட்டமைக்கப்படும் சூழலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள எதிர்மறைத் திருப்பத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּשְׁנַת חֲדָה
  choice: ஆட்சியின் முதலாம் ஆண்டில்
  rationale: அரசாட்சி ஆண்டைக் குறிக்கும் அரமேய தேதி மரபைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: பாபிலோனின் அரசனான கோரேசின்
  rationale: கோரேசு பாபிலோனின் அரசராக இருந்த ஆட்சியாண்டையே தேதி குறிக்கிறது என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂם טְעֵם
  choice: ஓர் ஆணை பிறப்பித்தார்
  rationale: சொல்லுக்கு சொல் ‘ஆணையை வைத்தார்’ என்றாலும், அரச நிர்வாகச் சூழலில் அதிகாரப்பூர்வ ஆணை வெளியிடுவதை இச்சொற்றொடர் குறிக்கிறது.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: இந்த இறைவனின் இல்லத்தை
  rationale: ஆலயமே குறிக்கப்பட்டாலும், மூலத்தின் ‘இறைவனின் இல்லம்’ என்ற உருவகத்தையும் சொல் அமைப்பையும் பாதுகாக்கிறது.
- source_word: לִבְנֵא
  choice: மீண்டும் கட்டும்படி
  rationale: அரமேய வினை அடிப்படையில் ‘கட்டுதல்’ என்று பொருள்படும்; அழிக்கப்பட்ட ஆலயம் மீட்டுக் கட்டப்படும் சூழலை ‘மீண்டும்’ தெளிவாக்குகிறது, அதேவேளை சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
