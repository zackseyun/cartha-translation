  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: ta
  text: அப்பொழுது செயல்த்தியேலின் மகன் செருபாபேலும் யோசதாக்கின் மகன் யெசுவாவும்[b] எழுந்து, எருசலேமிலுள்ள தேவனுடைய இல்லத்தை[a] கட்டத் தொடங்கினார்கள். தேவனுடைய தீர்க்கதரிசிகள் அவர்களுடன் இருந்து, அவர்களுக்கு உதவினர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய ஆலயத்தை.” அரமேய மொழியில் நேரடியாக, “தேவனுடைய இல்லத்தை” என்றுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு தனிப்பெயர் “யெசுவா” என்ற வடிவில் உள்ளது; வேறு இடங்களில் காணப்படும் தொடர்புடைய பெயர்வடிவம் “யோசுவா.”
    reason: lexical_alternative
  - marker: c
    text: “துணைசெய்தனர்” அல்லது “ஆதரவளித்தனர்” என்றும் மொழிபெயர்க்கலாம். அரமேயப் பங்கேற்புவினை செயலில் ஆதரித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: அப்பொழுது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் அரமேய உரைக்குறியை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: קָמוּ
  choice: எழுந்து
  rationale: சொல்லின் நேரடிப் பொருளையும், செயலில் இறங்குவதைக் குறிக்கும் கதைநடைப் பயன்பாட்டையும் காக்கிறது.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: செயல்த்தியேலின் மகன் செருபாபேல்
  rationale: தனிப்பெயர்களைத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்த்து, அரமேய தந்தைவழி உறவைக் தெளிவாகக் காட்டுகிறது.
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: யோசதாக்கின் மகன் யெசுவா
  rationale: மூலத்தில் உள்ள குறுகிய பெயர்வடிவமான யெசுவாவைப் பாதுகாத்து, தந்தைவழி உறவை நேரடியாகத் தருகிறது.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: கட்டத் தொடங்கினார்கள்
  rationale: ‘தொடங்கினார்கள்’ என்ற துணைவினையையும் ‘கட்ட’ என்ற வினையெச்சத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: בֵּית אֱלָהָא
  choice: தேவனுடைய இல்லம்
  rationale: மூலத்தின் நேரடிப் பொருளான ‘தேவனுடைய வீடு/இல்லம்’ என்பதைப் பாதுகாக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: דִּי בִירוּשְׁלֶם
  choice: எருசலேமிலுள்ள
  rationale: தேவனுடைய இல்லத்தின் இருப்பிடத்தைச் சுருக்கமாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
- source_word: מְסָעֲדִין לְהוֹן
  choice: அவர்களுக்கு உதவிவந்தார்கள்
  rationale: தீர்க்கதரிசிகள் தொடர்ந்து செயல்பூர்வமாக உதவியதை அரமேயப் பங்கேற்புவினையின் தொடர்நிலை உணர்வுடன் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தேவனுடைய இல்லம்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘தேவனுடைய இல்லம்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: தேவனுடைய ஆலயம்
  rationale: மூலம் நேரடியாக ‘தேவனுடைய இல்லம்’ என்கிறது. சூழலில் ‘ஆலயம்’ சரியான விளக்கமாக இருந்தாலும், மூல உருவகத்தை முதன்மை உரையில் காப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘மகன்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் ‘தேவனுடைய இல்லம்’ என்ற சொற்றொடர் காக்கப்பட்டு, ‘ஆலயம்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்பட்டுள்ளது.
