  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: ta
  text: திருக்கூடாரம் நிறுவப்பட்ட நாளில், மேகம் திருக்கூடாரத்தை, அதாவது சாட்சிக் கூடாரத்தை[a], மூடியது. மாலையில் அது திருக்கூடாரத்தின்மேல் நெருப்பின் தோற்றம்போல் காலைவரை இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாட்சிக் கூடாரம்” என்பதை “சான்றின் கூடாரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இரு பொருள்நிழல்களையும் தாங்குகிறது; இங்கு வழிபாட்டுச் சூழலில் நிலைபெற்ற “சாட்சி” என்பது பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: நாளில்
  rationale: வாவ் இணைப்பின் உரையாடல் தொடர்ச்சி தமிழில் தனியாகச் சேர்க்கப்படாமல், காலச் சூழலை இயல்பாகக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: הָקִים
  choice: நிறுவப்பட்ட
  rationale: திருக்கூடாரம் அமைத்து நிலைநிறுத்தப்பட்ட நிகழ்வைக் குறிக்கும் காலவினைத் தொடரை இயல்பான தமிழ்ச் செயப்பாட்டு வடிவில் தருகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரப் பயணத்தில் இஸ்ரவேலரின் எடுத்துச் செல்லக்கூடிய புனித உறைவிடத்தைக் குறிக்கும் மִשְׁכָּן என்பதற்குத் தெளிவான, மரியாதைமிக்க நவீனத் தமிழ் இணை.
- source_word: כִּסָּה
  choice: மூடியது
  rationale: மேகம் திருக்கூடாரத்தின்மேல் பரவி அதை மூடியதைக் குறிக்கும் நேரடியான வினை.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: இஸ்ரவேலரின் வனாந்தரப் பயணத்துடன் தொடர்புடைய, சூழலில் ஏற்கெனவே அறியப்பட்ட குறிப்பிட்ட மேகத்தைச் சுட்டுகிறது.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: அதாவது சாட்சிக் கூடாரத்தை
  rationale: இந்தத் தொடர் திருக்கூடாரத்தை மேலும் அடையாளப்படுத்தும் உடனிலை விளக்கமாக எடுத்துக்கொள்ளப்பட்டது; עֵדוּת என்பதற்கு வழிபாட்டுச் சூழலில் நிலைபெற்ற ‘சாட்சி’ பயன்படுத்தப்பட்டது.
- source_word: וּבָעֶרֶב
  choice: மாலையில்
  rationale: பகலிலிருந்து இரவுக்கான கால மாற்றத்தை இயல்பான தமிழில் காட்டுகிறது; இணைப்புச் சொல் தனியே தேவைப்படவில்லை.
- source_word: יִהְיֶה
  choice: இருந்தது
  rationale: வடிவில் imperfect ஆக இருந்தாலும், இங்கு தொடர்ந்து அல்லது வழக்கமாக நிலவிய கடந்தகால நிலையை விவரிக்கிறது.
- source_word: עַל הַמִּשְׁכָּן
  choice: திருக்கூடாரத்தின்மேல்
  rationale: மேகம் திருக்கூடாரத்தின் மேல் இருந்த இடநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: நெருப்பின் தோற்றம்போல்
  rationale: அது நெருப்பே என்று அடையாளப்படுத்தாமல், நெருப்பைப் போன்ற காட்சியாக இருந்தது என்ற ஒப்பீட்டை பாதுகாக்கிறது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘திருக்கூடாரம்’ என்பதற்கும் ‘சாட்சிக் கூடாரம்’ என்பதற்கும் உள்ள தொடர்பு
  choice: இரண்டாவது தொடர் முதலாவதை அடையாளப்படுத்தும் உடனிலை விளக்கம்
  alternative: לְ என்ற முன்னொட்டுக்கு இடம் அல்லது திசை சார்ந்த நுணுக்கம் கொடுத்து, இரண்டையும் ஓரளவு தனித்தனியாக வாசித்தல்
  rationale: எபிரெயச் சொற்றொடரின் இயல்பான தொடரமைப்பு ‘சாட்சிக் கூடாரம்’ என்பதை ‘திருக்கூடாரம்’ என்பதற்கான விளக்க அடையாளமாகப் புரிந்துகொள்ள ஆதரிக்கிறது; ‘அதாவது’ இதைத் தமிழில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘திருக்கூடாரம்’ மற்றும் ‘சாட்சிக் கூடாரம்’ என்ற சொற்கள் வேறுபடுத்தப்பட்டுள்ளன; எபிரெயத்தில் உள்ள ஒப்பீடும் உடனிலை விளக்கமும் பாதுகாக்கப்பட்டுள்ளன.
