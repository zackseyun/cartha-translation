base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: ta
  text: மேலும், உங்களோடு குடியிருக்கும் பிறநாட்டவர் ஒருவர் யாவேக்காகப் பஸ்காவைக் கடைப்பிடிக்க விரும்பினால், பஸ்காவுக்குரிய நியமத்தின்படியும் அதன் முறைப்படியும் அவர் அதைக் கடைப்பிடிக்க வேண்டும். உங்களுக்கும், குடியிருக்கும் பிறநாட்டவருக்கும்[a], நாட்டில் பிறந்தவருக்கும்[b] ஒரே நியமம் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் வழிப்போக்கரை மட்டும் குறிக்காமல், இஸ்ரவேலரிடையே வசிக்கும் பிறநாட்டவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாட்டின் பூர்வீகக் குடியினருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …விரும்பினால்
  rationale: இணைப்புடன் கூடிய நிபந்தனைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய சட்டவிதியுடனான தொடர்ச்சியை வாக்கிய ஓட்டம் காட்டுகிறது.
- source_word: יָגוּר ... גֵּר
  choice: உங்களோடு குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது வழிப்போக்கரை அல்ல, இஸ்ரவேலரிடையே வசிக்கும் பிறநாட்டவரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியர்’ அதன் நிலையான வசிப்பையும் சட்டச் சூழலையும் தெளிவாக்குகிறது.
- source_word: וְעָשָׂה פֶסַח
  choice: பஸ்காவைக் கடைப்பிடிக்க
  rationale: ‘பஸ்காவைச் செய்தல்’ என்ற எபிரெய மரபுத்தொடர், அந்தச் சடங்கு அல்லது பண்டிகையை அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடிக்க’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: לְ முன்னிடைச்சொல் பஸ்கா அனுசரிப்பு யெகோவாவை நோக்கியதும் அவருக்குரியதுமாக இருப்பதைக் காட்டுகிறது; יְהוָה என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: பஸ்காவுக்குரிய நியமத்தின்படி
  rationale: חֻקָּה என்பது விதிக்கப்பட்ட சட்ட நியமத்தைக் குறிக்கிறது; சட்ட-சடங்கு தன்மையை ‘நியமம்’ தக்கவைக்கிறது.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: அதன் முறைப்படி
  rationale: מִשְׁפָּט இங்கு சடங்கை நடத்துவதற்குரிய ஒழுங்கு அல்லது செயல்முறையைக் குறிக்கிறது; அருகிலுள்ள חֻקָּה என்பதிலிருந்து வேறுபாடு தெளிவாகிறது.
- source_word: כֵּן יַעֲשֶׂה
  choice: அவர் அதைக் கடைப்பிடிக்க வேண்டும்
  rationale: குறிப்பிட்ட முறைப்படியே செயல்பட வேண்டும் என்ற கட்டளை வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: ஒரே நியமம் இருக்க வேண்டும்
  rationale: இரு தரப்பினருக்கும் ஒரே கட்டுப்படுத்தும் விதி பொருந்துவதைத் தெளிவாகவும் சட்டப்பாங்குடனும் கூறுகிறது.
- source_word: לָכֶם וְלַגֵּר
  choice: உங்களுக்கும், குடியிருக்கும் அந்நியருக்கும்
  rationale: மீண்டும் வரும் לְ முன்னிடைச்சொல்லின் சமமான பயன்பாட்டு வலியுறுத்தலை ‘-க்கும்’ என்ற இணையான வடிவங்கள் தக்கவைக்கின்றன.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: நாட்டில் பிறந்தவருக்கும்
  rationale: אֶזְרָח என்பது גֵּר என்பதற்கு மாறாக, அந்த நாட்டைச் சேர்ந்த பிறப்பினரைக் குறிக்கிறது; நவீன அரசியல் பொருளுடைய ‘குடிமகன்’ என்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; உச்சரிப்பின் மறுகட்டமைப்பு உறுதியற்றது.
- issue: இஸ்ரவேலருக்கும் குடியிருக்கும் அந்நியருக்கும் பொருந்தும் சட்டத்தின் வரம்பு
  choice: பஸ்கா அனுசரிப்பின் உடனடிச் சூழலில் ஒரே நியமம் இருவருக்கும் பொருந்துகிறது
  alternative: இவ்வசனம் அனைத்து துறைகளிலும் முழுமையான சட்டச் சமத்துவத்தை அறிவிக்கிறது
  rationale: ‘ஒரே நியமம்’ என்பதைத் தெளிவாகத் தக்கவைத்தாலும், இவ்வசனத்தின் உடனடிச் சூழலான பஸ்கா நடைமுறையைத் தாண்டி அதன் பொருளை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. ‘பஸ்கா’ என்ற வழக்கமான வேதாகமச் சொல் தக்கவைக்கப்பட்டது. இணை அமைப்புகள் வாசிப்புக்கு இயல்பாக்கப்பட்டாலும், ஒரே நியமம் இரு குழுக்களுக்கும் பொருந்தும் என்ற மூலத்தின் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
