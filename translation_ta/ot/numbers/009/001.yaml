  terminology: ‘யாவே’ யְהוָה என்ற தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் சரியாகக் காட்டுகிறது. ‘சீனாய் வனாந்தரம்’ பொருத்தமான வேதாகமப் பதிவையும் நவீன புரிதலையும் தக்கவைக்கிறது. மாற்று வாசிப்புக்கான அடிக்குறிப்பு மִדְבָּר-இன் பொருள் எல்லையைச் சரியாகக் குறிக்கிறது.
