  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: ta
  text: 'இஸ்ரயேல் மக்கள் எகிப்து நாட்டிலிருந்து புறப்பட்டு வந்த இரண்டாம் ஆண்டின் முதல் மாதத்தில், சீனாய் வனாந்தரத்தில்[a] யாவே மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சீனாய் பாலைநிலத்தில்.’
    reason: מִדְבָּר என்பதற்கு ‘வனாந்தரம்’ என்றும் ‘பாலைநிலம்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: வினைச்சொல்லின் இயல்பான பொருளையும் எபிரெயக் கதைநடையின் முன்னேற்றத்தையும் காக்கிறது; தமிழில் தேவையற்ற ‘அப்போது’ என்பதைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; எனவே தமிழில் ஒலிபெயர்த்து வழங்கப்பட்டுள்ளது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சைப் பெறுபவரை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: בְּמִדְבַּר סִינַי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: மִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது; இடப்பெயருடனான மூலமொழித் தொடர்பும் காக்கப்பட்டுள்ளது.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: இரண்டாம் ஆண்டின்
  rationale: காலக் குறிப்பைத் தமிழில் இயல்பாகத் தொடர்ந்து வரும் ‘முதல் மாதத்தில்’ என்பதுடன் இணைக்கிறது.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: இஸ்ரயேல் மக்கள் எகிப்து நாட்டிலிருந்து புறப்பட்டு வந்த
  rationale: மூலத்தில் உள்ள பன்மைச் சுட்டின் சூழல்சார் குறிப்பை ‘இஸ்ரயேல் மக்கள்’ என்று வெளிப்படுத்தி, எகிப்திலிருந்து வெளியேறிய நிகழ்வைத் தெளிவாக்குகிறது; אֶרֶץ என்பதற்காக ‘நாடு’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: நேரடியானதும் இயல்பானதுமான காலக் குறிப்பு.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு பேசினார்:'
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்தும் לֵאמֹר என்பதன் செயல்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘பேசி, கூறியதாவது’ என்ற செயற்கையான இரட்டிப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. ‘ஆண்டவர்’ என்று பட்டப்பெயராக மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் தருவது அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெயக் காலத்தொடர் தமிழில் இயல்பாக அமைய முன்வைக்கப்பட்டுள்ளது; இறுதிக் காலக் குறிப்புக்குப் பின் முதன்மை வாக்கியம் வருகிறது.
