  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: யாவே பேசுதல், மோசே பெறுநராக இருப்பது, சீனாய் வனாந்தரம், எகிப்திலிருந்து வெளியேறிய பின்வரும் இரண்டாம் ஆண்டு, முதல் மாதம், அடுத்த வசன உரையை அறிமுகப்படுத்தும் கூறு ஆகியவை தெளிவாக உள்ளன. ‘இஸ்ரயேல் மக்கள்’ என்பது பன்மைச் சுட்டுக்கான சூழல்சார் வெளிப்படுத்தலாகும்; பொருளை மாற்றவில்லை.'
