  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: ta
  text: மேலும், இஸ்ரவேலின் மகன்கள் பஸ்காவை அதற்கென நியமிக்கப்பட்ட காலத்தில் கடைப்பிடிக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெய மொழியில் நேரடியாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: கடைப்பிடிக்கட்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’; ஆனால் פֶּסַח அதன் செயப்படுபொருளாக வரும்போது பஸ்காவைக் கடைப்பிடித்தல் என்ற மரபுசார் பொருளைத் தருகிறது. சூழலில் உள்ள கட்டளைத் தன்மையையும் இந்த வடிவம் வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் குடும்ப உறவுச் சொல்லாக்கத்தை இங்கு தக்கவைத்துள்ளோம்.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: פֶּסַח என்பது பஸ்காப் பலியையோ விழாவையோ விரிந்த வகையில் குறிக்கக்கூடும். வசனம் அதை மேலும் குறுக்காததால், பரவலாக அறியப்படும் ‘பஸ்கா’ என்ற சொல்லே வைக்கப்பட்டுள்ளது.
- source_word: בְּמוֹעֲדוֹ
  choice: அதற்குக் குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது; மூன்றாம் நபர் ஒருமை பின்னொட்டு பஸ்காவைக் குறிப்பதால் ‘அதற்குக்’ என அதன் தொடர்பு வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கடைப்பிடிக்கட்டும்’ கட்டளைத் தன்மையையும் சடங்குசார் பயன்பாட்டையும் தருகிறது; ‘இஸ்ரவேலின் மகன்கள்’ மூலத்தின் நேரடி குடும்ப உறவுச் சொல்லாக்கத்தைப் பாதுகாக்கிறது.
