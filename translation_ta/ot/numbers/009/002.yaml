    issue: The phrase “அதற்குக் குறிக்கப்பட்ட காலத்தில்” is somewhat awkward in contemporary Tamil.
    rationale: The source means at the Passover’s appointed time; “அதற்கென நியமிக்கப்பட்ட காலத்தில்” expresses this more idiomatically and precisely.
  revised_text: மேலும், இஸ்ரவேலின் மகன்கள் பஸ்காவை அதற்கென நியமிக்கப்பட்ட காலத்தில் கடைப்பிடிக்கட்டும்.[a]
