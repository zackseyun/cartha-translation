source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: ta
  text: சில சமயங்களில் மேகம் திருவாசஸ்தலத்தின் மேல் சில நாட்கள் தங்கியிருக்கும். யாவேயின் கட்டளைப்படி அவர்கள் முகாமிடுவார்கள்[a]; யாவேயின் கட்டளைப்படி புறப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் வாயின்படி”; அதாவது, யாவேயின் கட்டளைப்படி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: சில சமயங்களில்
  rationale: மாறுபட்ட காலநிலைகளில் நிகழ்ந்த ஒரு வழக்கமான சூழலை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה הֶעָנָן
  choice: மேகம் ... தங்கியிருக்கும்
  rationale: இங்கு היה வெறும் இருப்பை அல்ல, திருவாசஸ்தலத்தின்மேல் மேகம் தொடர்ந்து நிலைத்திருப்பதைக் குறிக்கிறது.
- source_word: יָמִים מִסְפָּר
  choice: சில நாட்கள்
  rationale: எண்ணிக்கைக்குட்பட்ட, வரையறுக்கப்பட்ட நாட்களைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது; குறிப்பாக மிகக் குறைந்த நாட்கள் என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: עַל הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின்மேல்
  rationale: מִשְׁכָּן என்பது வனாந்தரத்தில் இருந்த இறை வாசஸ்தலக் கூடாரத்தைக் குறிக்கும் நிலையான சொல்; ‘மேல்’ என்பது மேகத்தின் இடநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל פִּי יְהוָה
  choice: யெகோவாவின் கட்டளைப்படி
  rationale: சொல்லுக்குச் சொல் ‘யெகோவாவின் வாயின்படி’ என்றாலும், இச்சூழலில் அதிகாரமுள்ள இறைக் கட்டளைக்குக் கீழ்ப்படிதல் என்பதே மரபுத்தொடரின் பொருள்.
- source_word: יַחֲנוּ
  choice: முகாமிட்டிருப்பார்கள்
  rationale: இம்பெர்ஃபெக்ட் வடிவம் இங்கு மீண்டும் மீண்டும் கடைப்பிடிக்கப்பட்ட நடைமுறையைக் குறிக்கிறது; மேகம் தங்கியிருந்த காலத்தில் அவர்கள் முகாமிலேயே தொடர்ந்திருந்ததையும் வெளிப்படுத்துகிறது.
- source_word: יִסָּעוּ
  choice: புறப்படுவார்கள்
  rationale: נסע என்பது இச்சூழலில் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்படுவார்கள்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கப்படுகிறது; தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதையான தமிழ் நடை. ‘முகாமிட்டிருப்பார்கள் / புறப்படுவார்கள்’ என்ற வடிவங்கள் தொடர்ச்சியாக நிகழ்ந்த வழக்கத்தைப் பிரதிபலிக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதல் கட்டளைச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
