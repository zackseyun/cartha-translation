revisions:
- from: சில சமயங்களில் மேகம் சில நாட்கள் திருவாசஸ்தலத்தின்மேல் தங்கியிருக்கும். யெகோவாவின் கட்டளைப்படி அவர்கள் முகாமிட்டிருப்பார்கள்[a]; யெகோவாவின் கட்டளைப்படி புறப்படுவார்கள்.
  to: சில சமயங்களில் மேகம் திருவாசஸ்தலத்தின் மேல் சில நாட்கள் தங்கியிருக்கும். யாவேயின் கட்டளைப்படி அவர்கள் முகாமிடுவார்கள்[a]; யாவேயின் கட்டளைப்படி புறப்படுவார்கள்.
  rationale: The revision aligns the divine name with the supplied source and English POB audit trail, restores the simple customary force of the paired imperfect verbs, and makes minor orthographic adjustments for natural modern Tamil. It preserves the limited, unspecified duration of “some/a number of days” and the literal alternative underlying “by Yahweh’s command.”
