translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீள்வாக்கிய அமைப்பும், நேரத்தைக் குறிக்கும் சொற்றொடரின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
