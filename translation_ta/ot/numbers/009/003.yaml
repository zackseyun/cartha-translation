source:
  edition: WLC
  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: ta
  text: இந்த மாதத்தின் பதினான்காம் நாளில், இரு மாலைகளுக்கு இடையில்[a], அதற்குக் குறிக்கப்பட்ட நேரத்தில் அதைக் கடைப்பிடியுங்கள். அதற்குரிய எல்லாச் சட்டங்களின்படியும், அதற்குரிய எல்லா முறைமைகளின்படியும் அதைக் கடைப்பிடியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரு மாலைகளுக்கு இடையில்” என்பது அந்தி நேரத்தைச் சுற்றியுள்ள காலப்பகுதியைக் குறிக்கும் மரபுவழி எபிரேயச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின் பதினான்காம் நாளில்
  rationale: எபிரேய தேதிக் குறிப்பை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: בֵּין הָעַרְבַּיִם
  choice: இரு மாலைகளுக்கு இடையில்
  rationale: பஸ்கா நேரத்தைக் குறிக்கும் மரபுவழித் தொழில்நுட்பச் சொற்றொடரின் உண்மையான தெளிவின்மையையும் உருவகத்தையும் பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: அதைக் கடைப்பிடியுங்கள்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பஸ்காவை நோக்கிப் பயன்படுத்தப்படும்போது அதைக் கொண்டாடுதல் அல்லது அனுசரித்தல் என்பதே சூழல்சார் பொருள். இருமுறை வரும் சொற்றொடரும் ஒரேவிதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּמוֹעֲדוֹ
  choice: அதற்குக் குறிக்கப்பட்ட நேரத்தில்
  rationale: מוֹעֵד என்பதில் உள்ள நிர்ணயிக்கப்பட்ட காலம் அல்லது நியமிக்கப்பட்ட நிகழ்நேரம் என்ற வழிபாட்டுக் காலண்டர் பொருளைப் பாதுகாக்கிறது.
- source_word: כְּכָל חֻקֹּתָיו
  choice: அதற்குரிய எல்லாச் சட்டங்களின்படியும்
  rationale: חֻקּוֹת என்பது விதிக்கப்பட்ட சட்டங்கள் அல்லது நியமங்களைக் குறிக்கிறது; ‘சட்டங்கள்’ அதன் முறையான சட்ட-வழிபாட்டுப் பொருளைத் தருகிறது.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: அதற்குரிய எல்லா முறைமைகளின்படியும்
  rationale: מִשְׁפָּטִים இங்கு கடைப்பிடிக்க வேண்டிய ஒழுங்குகள் அல்லது விதிமுறைகளைக் குறிக்கிறது. ‘முறைமைகள்’ என்பது முந்தைய ‘சட்டங்கள்’ என்பதிலிருந்து வேறுபாட்டை ஓரளவு பாதுகாக்கிறது.
