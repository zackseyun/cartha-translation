  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: ta
  text: 'யாவேயின் கட்டளைப்படி[a] இஸ்ரவேல் மக்கள் புறப்பட்டார்கள்; யாவேயின் கட்டளைப்படி அவர்கள் முகாமிட்டார்கள். மேகம் திருவாசஸ்தலத்தின் மேல் தங்கியிருந்த நாட்களெல்லாம் அவர்கள் முகாமிட்டிருந்தார்கள்.


    [a] எபிரெய மொழியில், “யாவேயின் வாயின்படி”; இது “யாவேயின் கட்டளைப்படி” என்னும் பொருளுடைய மரபுத்தொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் வாயின்படி”; இது “யாவேயின் கட்டளைப்படி” என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வாயின்படி’ என்றாலும், இச்சூழலில் இது அதிகாரமுள்ள கட்டளை அல்லது வழிநடத்துதலைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் அதன் பொருளைத் தெளிவாகத் தருகிறது; நேரடிச் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יִסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பது பயணச் சூழலில் முகாமிலிருந்து கிளம்பிப் பயணம் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டார்கள்’ என்பது கூடுதல் விவரத்தைச் சேர்க்காமல் இதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுருவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றிருந்தாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் வழக்குப் பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைத் தேவையின்றிக் குறுக்காமல் பொதுவான குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַחֲנוּ
  choice: முகாமிட்டார்கள் / முகாமிட்டிருந்தார்கள்
  rationale: חנה என்பதன் அடிப்படைப் பொருள் ‘முகாமிடுதல்’. முதல் இடத்தில் செயலைவும், காலநீட்டிப்பைக் குறிக்கும் இறுதி வாக்கியத்தில் தொடர்ந்த நிலையையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: தங்கியிருந்த நாட்களெல்லாம்
  rationale: காலநீட்டிப்பைக் குறிக்கும் எபிரெய அமைப்பை ‘நாட்களெல்லாம்’ என நெருக்கமாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: יִשְׁכֹּן
  choice: தங்கியிருந்த
  rationale: שׁכן என்பது தங்குதல் அல்லது குடியிருத்தலைக் குறிக்கும். மேகத்தைப் பற்றிய இச்சூழலில், அதன் தொடர்ந்திருக்கும் இருப்பை ‘தங்கியிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: வழிநடத்திய கண்கூடான மேகத்தைக் குறிக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது தேவனுடைய பரிசுத்த உறைவிடத்தைக் குறிக்கிறது. ‘திருவாசஸ்தலம்’ அதன் உறைவிடப் பொருளையும் பரிசுத்தப் பயன்பாட்டையும் தக்கவைக்கிறது; இதனை אֹהֶל מוֹעֵד எனும் ‘சந்திப்புக் கூடாரம்’ என்பதோடு கலக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் உடன்படிக்கையின் தனிப்பெயரான YHWH-ஐ நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் இந்த எபிரெயச் சொற்றொடர் பயணித்த முழுச் சமூகத்தையும் குறிக்கிறது. ஆகவே உயிரியல் ஆண்களை மட்டும் குறிக்கும் வாசிப்பைத் தவிர்த்து, அதன் கூட்டு அடையாளத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புறப்பட்டார்கள்—முகாமிட்டார்கள்’ என்ற இணை அமைப்பு மூலத்தின் சமநிலையைப் பாதுகாக்கிறது; இறுதியில் ‘முகாமிட்டிருந்தார்கள்’ என்பது நீடித்த நிலையைக் காட்டுகிறது.
