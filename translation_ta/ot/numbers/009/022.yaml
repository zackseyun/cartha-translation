language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: ta
  text: மேகம் திருக்கூடாரத்தின்மேல் தங்கி அங்கே நிலைத்திருக்கும் காலம் இரண்டு நாட்களாக இருந்தாலும், ஒரு மாதமாக இருந்தாலும், அல்லது பல நாட்களாக[a] இருந்தாலும், இஸ்ரவேல் மக்கள் முகாமிட்டிருப்பார்கள்; புறப்பட மாட்டார்கள். ஆனால் மேகம் மேலெழும்பும்போது, அவர்கள் புறப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘நாட்கள்’ என்று உள்ளது; இச்சூழலில் அது நீண்ட காலத்தை, அதாவது பல நாட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: '... நாட்களோ, ... மாதமோ, ... நாட்களோ'
  rationale: மீண்டும் வரும் பிரிநிலை இடைச்சொல்லையும் கால அளவுகளின் வரிசையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יֹמַיִם
  choice: இரண்டு நாட்கள்
  rationale: எபிரெய இருமை வடிவம் துல்லியமாக ‘இரண்டு நாட்கள்’ என்பதைக் குறிக்கிறது.
- source_word: חֹדֶשׁ
  choice: ஒரு மாதம்
  rationale: கால அளவுகளின் பட்டியலில் எண்ணிக்குறிப்பில்லாத ஒருமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָמִים
  choice: இன்னும் பல நாட்கள்
  rationale: முன்னுள்ள ‘இரண்டு நாட்கள்’, ‘ஒரு மாதம்’ ஆகியவற்றுக்குப் பின் வரும் இச்சொல் நீண்ட காலத்தைக் குறிக்கிறது; அதேவேளை அதன் நேரடிப் பொருளான ‘நாட்கள்’ என்பதையும் காக்கிறது.
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: மேகம் ... தங்கியிருந்த காலமெல்லாம்
  rationale: மேகம் தொடர்ந்து நீடித்திருப்பதையும் அதனுடன் இணைந்த வழக்கமான செயற்பாட்டையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: வனாந்தரப் பயணத்தில் இருந்த இறைவனுக்குரிய எடுத்துச் செல்லக்கூடிய உறைவிடத்தை நவீன, கண்ணியமான தமிழில் குறிக்கிறது.
- source_word: לִשְׁכֹּן עָלָיו
  choice: அதன்மேல் குடிகொண்டிருந்து
  rationale: שכן என்பதன் நிலையான உறைதல் பொருளையும் משכן என்பதுடனான சொற்பொருள் தொடர்பையும் இயன்றவரை பிரதிபலிக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: கூட்டாகிய இஸ்ரவேலரை இயல்பான நவீன தமிழில் குறிக்கிறது; சூழலில் பாலின வலியுறுத்தல் இல்லை.
- source_word: יַחֲנוּ ... וְלֹא יִסָּעוּ
  choice: முகாமிட்டிருப்பார்கள்; புறப்பட மாட்டார்கள்
  rationale: மேகம் தங்கியிருக்கும் ஒவ்வொரு சந்தர்ப்பத்திலும் நிகழ்ந்த வழக்கமான செயலைத் தமிழ் எதிர்கால-வழக்கநிலை அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: ஆனால் அது மேலெழும்பும்போது புறப்படுவார்கள்
  rationale: மேகம் மேலெழுவது பயணத்திற்கான அறிகுறியாக இருந்த எதிர்மறை ஒப்பீட்டைத் தெளிவாகக் காக்கிறது; எபிரெய வடிவம் தானெழுதல் அல்லது உயர்த்தப்படுதல் என்ற இரு புரிதல்களையும் அனுமதிப்பதால் செயப்பாட்டு காரணியைச் சேர்க்கவில்லை.
theological_decisions:
- issue: மேகம் ‘மேலெழுந்தது’ அல்லது ‘மேலெழுப்பப்பட்டது’ என்ற வினைநிலை
  choice: அது மேலெழும்பும்போது
  alternative: அது மேலே எடுத்துக்கொள்ளப்படும்போது
  rationale: וּבְהֵעָלֹתוֹ என்ற வடிவம் சூழலில் மேகத்தின் மேலெழுதலைக் குறிக்கிறது; செயற்படுத்துபவரைத் தமிழ் மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் இடைவெளியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘திருவுறைவிடம்’ என்பது משכן என்பதன் புனித உறைவிடப் பொருளைத் தெரிவிக்கிறது. வழக்கமாக மீண்டும் நிகழ்ந்த செயலை ‘முகாமிட்டிருப்பார்கள் / புறப்பட மாட்டார்கள் / புறப்படுவார்கள்’ என வழங்கப்பட்டுள்ளது.
