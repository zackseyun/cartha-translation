lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் எனில் ‘இஸ்ரவேலின் மகன்கள்’; ஆனால் இங்கு இஸ்ரவேல் சமூகத்தாரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: לַעֲשֹׂת
  choice: கடைப்பிடிக்கும்படி
  rationale: பஸ்கா தொடர்பில் ‘செய்தல்’ என்பது விழாவை அனுசரித்து நடத்துவதைக் குறிக்கும்; ‘கடைப்பிடித்தல்’ அந்தச் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: இஸ்ரவேலரின் பஸ்கா விழாவைக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமப் பெயர்.
- source_word: וַיְדַבֵּר
  choice: கூறினார்
  rationale: மோசே அவர்களிடம் பேசி அறிவுறுத்தினார் என்பதைக் காட்டும் இயல்பான தமிழ் வினை; அடுத்துள்ள நோக்கத் தொடருடன் நன்றாக இணைகிறது.
