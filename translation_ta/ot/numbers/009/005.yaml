source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: ta
  text: அவர்கள் முதல் மாதத்தில், மாதத்தின் பதினான்காம் நாளில், அந்திப்பொழுதில், சீனாய் வனாந்தரத்தில் பஸ்காவைக் கொண்டாடினார்கள்; யாவே மோசேக்குக் கட்டளையிட்ட அனைத்தின்படியே இஸ்ரவேலின் மகன்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: கொண்டாடினார்கள் / செய்தார்கள்
  rationale: பֶּסַח என்பதுடன் வரும் עשה, பஸ்காவைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்ற சடங்குசார் பொருளைத் தருகிறது; முடிவிலுள்ள அதே வினைச்சொல் அதன் நேரடிப் பொருளான ‘செய்தார்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: இச்சூழலில் இது பலியை மட்டும் குறுக்காமல் பஸ்கா அனுசரிப்பை முழுமையாகக் குறிக்கிறது; தமிழில் பரவலாக அறியப்படும் ‘பஸ்கா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָּרִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: எபிரெயச் சொல்லில் ‘மாதம்’ மறைமுகமாக இருந்தாலும், அடுத்து வரும் நாள்காட்டிக் குறிப்பினால் தமிழில் தெளிவுக்காக அது வெளிப்படுத்தப்படுகிறது.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: பதினான்காம் நாளில்
  rationale: ‘முதல் மாதத்தின்’ என்பதுடன் இயல்பாக இணைத்து, எபிரெய நாள்காட்டிச் சூத்திரத்தின் பொருள் தெளிவாக வழங்கப்படுகிறது.
- source_word: בֵּין הָעַרְבַּיִם
  choice: அந்தி நேரத்தில்
  rationale: சொல்லுக்கு சொல் ‘இரு மாலைகளுக்கு இடையில்’ எனும் எபிரெய மரபுத்தொடர் அந்திப்பொழுதைக் குறிக்கிறது; நேரடிவடிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּמִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מִדְבָּר குடியேற்றமற்ற வறண்ட வனப்பகுதியைக் குறிக்கிறது; மரியாதையான வேதாகமத் தமிழில் இயல்பான ‘வனாந்தரம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியே
  rationale: கட்டளையின் முழுமைக்கும் துல்லியமாக இணங்கியதை ‘அனைத்து’ மற்றும் வலியுறுத்தும் ‘ஏ’ வெளிப்படுத்துகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் வடிவைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: பஸ்கா கொண்டாடப்படுவதற்கு முன்பே மோசேக்குக் கொடுக்கப்பட்ட கட்டளையைக் குறிக்கிறது; தமிழில் சார்பு வினையெச்ச அமைப்பு காலவரிசையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வெளிப்படையான ஆண்பால்-வம்சச் சொல்லாக்கத்தைப் பாதுகாக்கிறது; இது சூழலில் உடன்படிக்கை மக்களைத் தொகுப்பாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலம் தனிப்பெயரையே பயன்படுத்துகிறது; ஆகவே ‘ஆண்டவர்’ போன்ற பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறித்த கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் வெளிப்படையான ‘மகன்கள்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது; அதேவேளை இது இங்கு உடன்படிக்கை மக்களைத் தொகுப்பாகக் குறிக்கிறது.
- issue: הַפֶּסַח என்பதன் பொருள் வரம்பு
  choice: பஸ்காவைக் கொண்டாடினார்கள்
  alternative: பஸ்காப் பலியைச் செலுத்தினார்கள்
  rationale: இச்சூழலில் சொல் பலியை மட்டும் அல்லாமல் மொத்த அனுசரிப்பையும் குறிக்கக்கூடும்; எனவே பொருளை பலிக்கு மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘பஸ்கா’, ‘வனாந்தரம்’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு மட்டும் இயல்பான தற்போதைய தமிழுக்கு ஏற்ப எளிமைப்படுத்தப்பட்டுள்ளது.
