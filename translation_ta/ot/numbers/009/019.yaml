source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: ta
  text: மேகம் பல நாட்கள் திருக்கூடாரத்தின் மேல் தங்கியிருந்தபோது, இஸ்ரவேலின் மகன்கள்[a] யாவேயின் கட்டளையை[b] கடைப்பிடித்தார்கள்; புறப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரெயத்தில் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேயின் காவற்பொறுப்பை,’ ‘யாவேயின் ஒப்படைக்கப்பட்ட கடமையை,’ அல்லது ‘யாவேயின் நியமத்தை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: மேகம் ... தங்கியிருந்தபோது
  rationale: בְ + infinitive construct காலச் சூழலை அறிமுகப்படுத்துகிறது; אָרַךְ இங்கு மேகம் நீண்ட காலம் தொடர்ந்து இருந்ததைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘தங்கியிருந்தபோது’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַל הַמִּשְׁכָּן
  choice: திருக்கூடாரத்தின் மேல்
  rationale: வனாந்தரத்தில் இஸ்ரவேலரின் நடுவே இருந்த புனித உறைவிடத்தையே מִשְׁכָּן குறிக்கிறது. ‘திருக்கூடாரம்’ தெளிவான, வழக்கமான தமிழ்ச் சொல்; עַל என்பதற்கு இங்கு ‘மேல்’ பொருத்தமானது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: எபிரெயச் சொற்றொடரின் கால அளவை நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் குடும்ப-உடன்படிக்கை வடிவத்தையும் ஆண்பால் பன்மையையும் பாதுகாக்கிறது; இயல்பான மாற்றாக ‘இஸ்ரவேலர்’ இருக்கிறது என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: யாவே விதித்த கடமையை
  rationale: מִשְׁמֶרֶת என்பது ஒப்படைக்கப்பட்ட பொறுப்பு, கடமை, அல்லது கடைப்பிடிக்க வேண்டிய நியமத்தைக் குறிக்கிறது. ‘விதித்த கடமை’ என்பது இச்சூழலில் மேகம் நகரும்வரை முகாமை விட்டுப் புறப்படாமல் இருக்க வேண்டிய கடப்பாட்டை நவீனத் தமிழில் தெளிவாக்குகிறது; மூலத்தின் ‘காவல்/பொறுப்பு’ மொழிநடை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלֹא יִסָּעוּ
  choice: புறப்படவில்லை
  rationale: נסע இவ்வனாந்தரப் பயணச் சூழலில் முகாமிலிருந்து பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்படவில்லை’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் பட்டமல்ல, உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே பெயரைப் பாதுகாக்கும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: בְנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினம் மற்றும் குடும்ப மொழிநடை
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் குடும்ப-உடன்படிக்கைத் தொனியையும் வெளிப்படையாக வைத்திருக்கிறது; அது முழு மக்களையும் குறிக்கும் இயல்பான இனப்பெயராகப் புரிந்துகொள்ளப்படலாம் என்பதும் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: מִשְׁמֶרֶת יְהוָה என்பதன் உறவு
  choice: யாவே விதித்த கடமை
  alternative: யாவேயின் காவற்பொறுப்பு; யாவேயின் நியமம்
  rationale: இந்தச் சூழலில் இஸ்ரவேலர் கடைப்பிடிக்க வேண்டிய தெய்வீகக் கடப்பாட்டைக் குறிக்கிறது. ‘கட்டளை’ என்று மட்டும் தட்டையாக்காமல் கடமை/பொறுப்பு நுணுக்கத்தைப் பாதுகாக்கிறது; சொற்படிவத்திற்கு நெருக்கமான மாற்று அடிக்குறிப்பில் உள்ளது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருக்கூடாரம்,’ ‘கடமை,’ ‘புறப்படவில்லை’ ஆகியவை சூழலைத் தெளிவாக்குகின்றன; எபிரெய மூலத்தின் குடும்ப மொழிநடை, இறைப்பெயர், மற்றும் מִשְׁמֶרֶת என்பதன் பொறுப்பு/கடமை நுணுக்கம் பாதுகாக்கப்பட்டுள்ளன.
