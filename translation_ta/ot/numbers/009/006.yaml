id: NUM.9.6
reference: Numbers 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: ta
  text: மனிதப் பிணத்தால்[a] தீட்டுப்பட்டிருந்த சில ஆண்கள் இருந்தார்கள். அதனால் அவர்களால் அந்த நாளில் பஸ்காவைக் கடைப்பிடிக்க முடியவில்லை. அந்த நாளிலேயே அவர்கள் மோசேக்கும் ஆரோனுக்கும் முன்பாக வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்பட, “ஒரு மனிதனின் נֶפֶשׁ (நெஃபெஷ்) காரணமாகத் தீட்டுப்பட்டவர்கள்”; இங்கு இது மனிதப் பிணத்தால் ஏற்பட்ட தீட்டைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: சில ஆண்கள் இருந்தார்கள்
  rationale: היה இங்கு ஒரு புதிய நிகழ்ச்சிச் சூழலை அறிமுகப்படுத்துகிறது; אֲנָשִׁים ஆண்பால் பன்மை என்பதால் ‘ஆண்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டது. இயல்பான தமிழுக்காக ‘சில’ சேர்க்கப்பட்டது.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: மனிதப் பிணத்தால் தீட்டுப்பட்டிருந்த
  rationale: ஆசாரத் தூய்மைச் சட்டச் சூழலில் இது மனித சடலத்தால் உண்டான சடங்குசார் தீட்டைக் குறிக்கும் மரபுத்தொடர்; ஒழுக்கக்கேடு அல்லது தனிப்பட்ட பாவம் எனப் பொருள் கொள்ளாமல் தெளிவாக வழங்குகிறது.
- source_word: וְלֹא יָכְלוּ
  choice: அதனால் அவர்களால் ... முடியவில்லை
  rationale: முந்தைய தீட்டு நிலையால் ஏற்பட்ட இயலாமையை இயல்பான தமிழில் காரண–விளைவு தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: பஸ்காவைக் கடைப்பிடிக்க
  rationale: எபிரெய மொழியில் சொற்பட ‘பஸ்காவைச் செய்ய’ என்றாலும், இங்கு விதிப்படி அனுசரிப்பதே பொருள்; ‘கடைப்பிடிக்க’ என்பது உடன்படிக்கைச் சடங்கின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில் / அந்த நாளிலேயே
  rationale: முதல் இடத்தில் நேரக் குறிப்பை நேரடியாக வழங்குகிறது; இரண்டாம் இடத்தில் மூலத்தின் மீளுரையையும் அதே நாளில் அணுகியதையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: முன்பாக வந்தார்கள்
  rationale: קרב என்பதன் ‘அணுகுதல்/அருகில் வருதல்’ பொருளையும் לִפְנֵי என்பதன் ‘முன்பாக’ என்ற முறையான முன்னிலையையும் பாதுகாக்கிறது; மனு செய்தார்கள் என உரையில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: மோசே ... ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டன.
theological_decisions:
- issue: தீட்டின் தன்மை
  choice: மனிதப் பிணத்தால் ஏற்பட்ட சடங்குசார் தீட்டாக மொழிபெயர்த்தல்
  alternative: ‘மனிதனுடைய நெஃபெஷுக்காகத் தீட்டுப்பட்டவர்கள்’ என்று சொற்பட மொழிபெயர்த்தல்
  rationale: எண்ணாகமத்தின் ஆசாரத் தூய்மைச் சூழலில் இத்தொடர் மரண உடலோடு தொடர்புடைய தீட்டைக் குறிக்கிறது; இதை ஒழுக்கத் தீமையாகவோ தனிப்பட்ட பாவமாகவோ மாற்றக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தீட்டுப்பட்டிருந்த’ மற்றும் ‘பஸ்காவைக் கடைப்பிடிக்க’ ஆகியவை ஆசாரச் சட்டச் சூழலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கின்றன; மூலத்தில் இருமுறை வரும் ‘அந்த நாள்’ குறிப்பு பாதுகாக்கப்பட்டுள்ளது.
