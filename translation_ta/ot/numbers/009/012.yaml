  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: ta
  text: அதில் எதையும் காலை வரை மீதியாக வைக்கக்கூடாது; அதில் உள்ள எந்த எலும்பையும் முறிக்கக்கூடாது.[a] பஸ்காவிற்கான முழு நியமத்தின்படி அதை அனுசரிக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் எந்த எலும்பையும் முறிக்கக்கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: எலும்பை முறிக்கக்கூடாது என்ற இந்த நியமம் யாத்திராகமம் 12:46-இல் உள்ள பஸ்கா அறிவுறுத்தலை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: அதில் எதையும் காலைய்வரை மீதியாக வைக்கக்கூடாது
  rationale: ஹிபில் வினை ‘மீதியாக விடுதல்/வைத்தல்’ எனப் பொருள்படும்; מן பகுதியைக் குறிக்கும் பொருளில் இருப்பதால் ‘அதில் எதையும்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: அதன் எலும்பு எதையும் முறிக்கக்கூடாது
  rationale: எபிரெய ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் வருவதால், தமிழில் இயல்பாகவும் முழுத் தடையைத் தெளிவாகவும் காட்ட ‘எலும்பு எதையும்’ என வழங்கப்பட்டது.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: பஸ்காவுக்குரிய எல்லா நியமங்களின்படியும்
  rationale: חֻקָּה என்பது விதிக்கப்பட்ட நியமம் அல்லது ஒழுங்குமுறை; כל உடன் வந்துள்ள ஒருமைக் கூட்டுப்பொருளை தமிழில் ‘எல்லா நியமங்களின்படியும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: இச்சூழலில் சொல் பலியையும் உணவையும் மொத்த அனுசரிப்பையும் குறிக்கக்கூடும்; ‘பஸ்கா’ அந்தப் பரந்த சடங்குப் பொருளை வரையறுக்காமல் காக்கிறது.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: அதை அனுசரிக்க வேண்டும்
  rationale: திருவிழா அல்லது கட்டளையுடன் עשה வரும்போது ‘கடைப்பிடித்தல்/அனுசரித்தல்’ என்பது பொருத்தமான பொருள்; ‘அனுசரிக்க’ என்பது நவீனத் தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: எலும்பு முறிக்கப்படாதிருக்க வேண்டும் என்ற கட்டளையின் பிற்காலத் தொடர்பு
  choice: முதன்மை உரையில் பஸ்கா நியமமாக மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: பிற்கால கிறிஸ்தவ நிறைவேற்றத்தை முன்னிறுத்தும் வகையில் வசனத்தின் மொழியை அமைத்தல்
  rationale: உடனடிச் சூழல் பஸ்காவை அனுசரிப்பதற்கான கட்டளையைத் தருகிறது. பிற்காலத் தொடர்பை மொழிபெயர்ப்புக்குள் புகுத்தாமல், யாத்திராகமத்துடனான தொடர்பை அடிக்குறிப்பில் மட்டும் சுட்டுவது மூலத்தின் வரலாற்றுச் சூழலையும் இறையியல் திறந்த நிலையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பஸ்கா’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது. கட்டளையின் பன்மை எழுவாய் தமிழில் பொதுவான விதிமுறை வடிவமான ‘வேண்டும்/கூடாது’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டது.
