revisions:
- from: அதில் எதையும் காலைய்வரை மீதியாக வைக்கக்கூடாது; அதன் எலும்பு எதையும் முறிக்கக்கூடாது.[a] பஸ்காவுக்குரிய எல்லா நியமங்களின்படியும் அதை அனுசரிக்க வேண்டும்.[b]
  to: அதில் எதையும் காலை வரை மீதியாக வைக்கக்கூடாது; அதில் உள்ள எந்த எலும்பையும் முறிக்கக்கூடாது.[a] பஸ்காவிற்கான முழு நியமத்தின்படி அதை அனுசரிக்க வேண்டும்.[b]
