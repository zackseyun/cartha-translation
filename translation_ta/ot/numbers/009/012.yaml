review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two prohibitions and the required observance. A small revision better represents the Hebrew distributive singular עֶצֶם ('a/any bone') and the collective singular force of כָּל־חֻקַּת ('the whole prescribed statute').
  naturalness: ‘அதன் எலும்பு எதையும்’ is not idiomatic modern standard Tamil. ‘அதில் உள்ள எந்த எலும்பையும்’ is clear and natural. ‘காலை வரை’ is also set as two words for standard readability.
  terminology: ‘பஸ்கா’ is an established Tamil Christian term and appropriately retains the broad ritual sense. ‘அனுசரிக்க’ is suitable in this formal biblical register. ‘முழு நியமத்தின்படி’ preserves the Hebrew’s singular collective expression more closely than a plural ‘எல்லா நியமங்களின்படியும்.’
  issues:
  - severity: medium
    issue: The phrase ‘அதன் எலும்பு எதையும்’ is grammatically awkward and obscures the distributive force of the Hebrew singular.
    rationale: The Hebrew prohibits breaking any individual bone. ‘அதில் உள்ள எந்த எலும்பையும்’ expresses this naturally without changing the sense.
  - severity: low
    issue: ‘எல்லா நியமங்களின்படியும்’ pluralizes the Hebrew collective singular חֻקַּת.
    rationale: The sense is the whole prescribed Passover regulation. ‘பஸ்காவிற்கான முழு நியமத்தின்படி’ retains that collective force in idiomatic Tamil.
  revised_text: அதில் எதையும் காலை வரை மீதியாக வைக்கக்கூடாது; அதில் உள்ள எந்த எலும்பையும் முறிக்கக்கூடாது.[a] பஸ்காவிற்கான முழு நியமத்தின்படி அதை அனுசரிக்க வேண்டும்.[b]
