source:
  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: ta
  text: அந்த மனிதர்கள் அவரிடம், “ஒரு மனிதப் பிணத்தினால் நாங்கள் தீட்டடைந்திருக்கிறோம்.[a] இஸ்ரவேல் மக்களின் நடுவில், குறித்த காலத்தில் யாவேயின் காணிக்கையைச் சமர்ப்பிப்பதிலிருந்து நாங்கள் ஏன் விலக்கப்பட வேண்டும்?[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு மனிதரின் நெஃபெஷ் தொடர்பாக.” ஆசாரச் சட்டச் சூழலில் இது மனிதப் பிணத்தால் ஏற்படும் தீட்டைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேயின் காணிக்கையைக் கொண்டுவருவதிலிருந்து நாங்கள் ஏன் தடுக்கப்பட வேண்டும்?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: அந்த மனிதர்கள் அவரிடம் … என்றார்கள்
  rationale: எபிரெயக் கதைநடையின் இயல்பான சொல்வரிசையையும் சுட்டுப்பெயரின் குறிப்புத்தன்மையையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: טְמֵאִים
  choice: தீட்டுப்பட்டிருக்கிறோம்
  rationale: சடங்குசார் அசுத்த நிலையைக் குறிக்கும் வழக்கமான, எளிதில் புரியும் தமிழ்ச் சொல்.
- source_word: לְנֶפֶשׁ אָדָם
  choice: மனிதப் பிணத்தினால்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘மனித உயிர்/நபர் தொடர்பாக’ என்றிருந்தாலும், ஆசாரச் சட்டச் சூழலில் மனித சடலத்தால் ஏற்படும் தீட்டையே இந்த மரபுத்தொடர் குறிக்கிறது.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: செலுத்துவதிலிருந்து … விலக்கப்பட வேண்டும்
  rationale: נגרע என்பதன் நிஃபால் வடிவிலுள்ள செயல்படுபொருள் பொருளையும், பலி சார்ந்த הקריב என்பதன் ‘சமர்ப்பி/செலுத்து’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קָרְבַּן יְהוָה
  choice: யாவேயின் காணிக்கை
  rationale: קָרְבָּן என்பதை விரிவான ‘காணிக்கை’ எனவும், יהוה என்ற தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ எனவும் வழங்குகிறது.
- source_word: בְּמֹעֲדוֹ
  choice: குறிக்கப்பட்ட காலத்தில்
  rationale: முன்கூட்டியே நிர்ணயிக்கப்பட்ட ஆசார நேரத்தைக் குறிக்கும் מועד என்பதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் நடுவில்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய இனக்குழுப் பெயரைத் தமிழில் பாலினக் கட்டுப்பாடு தோன்றாத இயல்பான சமூகப்பெயராக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்துத் தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பு மறுவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- issue: לְנֶפֶשׁ אָדָם குறிக்கும் தீட்டின் காரணம்
  choice: மனிதப் பிணத்தினால்
  alternative: இறந்த மனிதனால்; ஒரு மனித உயிரினால்
  rationale: இது மனிதச் சடலத்துடன் ஏற்பட்ட தொடர்பினால் உண்டான ஆசாரத் தீட்டைக் குறிக்கும் மரபுத்தொடர்; காரணத்தைத் தெளிவாக்குகிறது, ஆனால் நேரடி தொடுதல் நடந்ததாக மூலத்தைவிட அதிகமாகச் சொல்லவில்லை.
- issue: נִגָּרַע என்பதிலுள்ள கேள்வியின் நயம்
  choice: நாங்கள் ஏன் விலக்கப்பட வேண்டும்?
  alternative: நாங்கள் ஏன் தடுக்கப்பட வேண்டும்?; எங்களுக்கு ஏன் குறை ஏற்பட வேண்டும்?
  rationale: அவர்கள் வழிபாட்டில் பங்கேற்க முடியாமல் ஒதுக்கப்படுவதை எதிர்த்துக் கேட்கும் நயத்தைப் பேணுகிறது; யார் விலக்குகிறார்கள் என்பதைத் தேவையின்றி நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுமக்கள் புரிந்துகொள்ளும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பது இங்கு ஒழுக்கக் குற்றத்தைக் குறிக்காமல் சடங்குசார் நிலையைக் குறிக்கிறது. வினாவிலுள்ள முறையீட்டு நயம் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
