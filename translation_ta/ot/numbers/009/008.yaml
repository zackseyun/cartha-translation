  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: ta
  text: மோசே அவர்களிடம், “காத்திருங்கள்[a]; யாவே உங்களைக் குறித்து என்ன கட்டளையிடுவார் என்பதை நான் கேட்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நில்லுங்கள்”; அதாவது, அங்கேயே இருந்து காத்திருங்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: மோசே அவர்களிடம் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; אֲלֵהֶם என்பதன் பன்மைச் சுட்டும் காக்கப்படுகிறது.
- source_word: עִמְדוּ
  choice: காத்திருங்கள்
  rationale: இதன் சொற்பொருள் ‘நில்லுங்கள்’ என்றாலும், இச்சூழலில் அவர்கள் அங்கேயே இருந்து பதிலுக்காகக் காத்திருக்க வேண்டும் என்பதே நடைமுறைப் பொருள்; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֶשְׁמְעָה
  choice: நான் கேட்டு அறிந்துகொள்கிறேன்
  rationale: முதலாம் நபர் நோக்கத்தை வெளிப்படுத்தும் வடிவம். ‘கேட்பேன்’ மட்டும் தமிழில் வெறும் ஒலி கேட்டலைக் குறிக்கக்கூடும்; தேவனிடமிருந்து பதிலைப் பெறும் பொருளை, மூலத்தின் ‘கேள்’ உருவகத்தைத் தக்கவைத்தபடி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַה יְצַוֶּה
  choice: என்ன கட்டளையிடுவார்
  rationale: מַה என்பதன் விசாரணைப் பொருளையும், צוה என்பதன் பியேல் வடிவிலுள்ள ‘கட்டளையிடு’ என்ற வலுவான பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வாசகர்களிடையே நிலைபெற்றுள்ள தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு; பட்டப்பெயரால் மாற்றாமல் எபிரெய நான்கெழுத்துப் பெயரைத் தனிப்பெயராகக் காட்டுகிறது.
- source_word: לָכֶם
  choice: உங்களைக் குறித்து
  rationale: இச்சூழலில் கட்டளை அவர்களுடைய நிலைமை பற்றியது என்பதைக் காட்டுகிறது; ‘உங்களுக்காக’ அல்லது ‘உங்களிடம்’ என்பதும் இலக்கணரீதியாகச் சாத்தியம், ஆனால் இங்கு குறைந்த இயல்புடையது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ‘ஆண்டவர்’ என்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது. உச்சரிப்பு முழுமையாக உறுதியானதல்ல; நவீன ஆய்வில் ‘யாவே’ பரவலாகக் கருதப்பட்டாலும், ‘யெகோவா’ தமிழில் நிலைபெற்ற வடிவமாக இருப்பதால் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் பன்மை மரியாதை வினைமுற்றுகள் காக்கப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் நேரடித்தன்மையும் பேணப்பட்டுள்ளன.
