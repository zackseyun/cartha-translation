source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘உங்களில் ஒருவனோ உங்கள் வருங்காலத் தலைமுறையினரில் ஒருவனோ[b] பிணத்தால் தீட்டுப்பட்டிருந்தாலும்[c], அல்லது தொலைதூரப் பயணத்தில் இருந்தாலும், அவன் யாவேக்குப் பஸ்காவைக் கடைப்பிடிக்க வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “இஸ்ரவேலின் மகன்கள்”; இங்கு இச்சொற்றொடர் இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்பொருளுக்கு நெருக்கமாக, “உங்களுக்கோ உங்கள் தலைமுறைகளுக்கோ.” இந்த விதி அப்போதைய சமூகத்திற்கும் தொடர்ந்து வரும் தலைமுறைகளுக்கும் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, இறந்த மனித உடலால் சடங்குமுறைப்படி தீட்டுப்பட்டிருந்தாலும். எபிரெய மரபுத்தொடர் சொற்பொருளாக “ஒரு நபர்/உயிருக்காகத் தீட்டுப்பட்டவன்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடம் சொல்
  rationale: דַּבֵּר என்பது நேரடியான கட்டளை. בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கைச் சமூகத்தைக் கூட்டாகக் குறிக்கிறது; நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִישׁ אִישׁ
  choice: ஒருவன் ... ஒருவன் / எந்த ஆணாவது என்ற பகிர்ந்தளிக்கும் பொருள்
  rationale: பெயர்ச்சொல்லின் இரட்டிப்பு ஒவ்வொரு தனிநபரையும் உள்ளடக்கும் பகிர்ந்தளிக்கும் வலியுறுத்தலைத் தருகிறது. வாக்கியத்தின் ‘உங்களில் ஒருவனோ ... ஒருவனோ’ அமைப்பு அந்தத் தனிநபர் சார்ந்த சட்டப் பொருளையும் ஆண்பால் வடிவத்தையும் காக்கிறது.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: பிணத்தால் தீட்டுப்பட்டிருந்தாலும்
  rationale: ஆசாரச் சட்டச் சூழலில் נֶפֶשׁ உடன் வரும் இத்தொடர் இறந்த மனித உடலால் ஏற்படும் சடங்குமுறைத் தீட்டைக் குறிக்கிறது. ‘பிணத்தால்’ என்பது ‘தொட்டதால்’ போன்ற மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் காரணத்தைத் தெரிவிக்கிறது.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: தொலைதூரப் பயணத்தில்
  rationale: சொல்லுக்குச் சொல் ‘தொலைவான வழியில்’ என்பதைக் காட்டிலும், பயணத்தின் காரணமாகத் தொலைவில் இருப்பதை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: உங்களில் ஒருவனோ உங்கள் வருங்காலத் தலைமுறையினரில் ஒருவனோ
  rationale: இந்த விதி உடனிருக்கும் கேட்போருக்கும் அவர்களுக்குப் பின்வரும் தலைமுறையினருக்கும் பொருந்துவதைத் தெளிவுபடுத்துகிறது. ‘வருங்கால’ என்பது சூழலில் உள்ள காலவிரிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעָשָׂה פֶסַח
  choice: பஸ்காவைக் கடைப்பிடிக்க வேண்டும்
  rationale: פֶסַח உடன் עשה என்பது பஸ்கா அனுசரிப்பைச் சுட்டும் மரபுத்தொடர். ‘கடைப்பிடிக்க வேண்டும்’ என்பது கடமையைக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘இன்னும்’ என்ற கருத்தைச் சேர்ப்பதில்லை.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, לְ முன்னிடைச்சொல்லின் நோக்கு/அர்ப்பணிப்பு உறவை ‘-க்கு’ மூலம் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துகளுள்ள தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது தற்போதைய ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்பைத் தமிழில் அண்மையாகக் காட்டி, தனிப்பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: பிணத்தால் உண்டாகும் தீட்டின் தன்மை
  choice: பிணத்தால் தீட்டுப்பட்டிருந்தாலும்
  alternative: இறந்த ஒருவரால் சடங்குமுறைப்படி அசுத்தமானவனாக இருந்தாலும்
  rationale: இது ஒழுக்கக் குற்றத்தை அல்ல, ஆசாரச் சட்டத்துக்குரிய தீட்டைக் குறிக்கிறது. ‘தீட்டு’ அந்தச் சட்டப் பிரிவைச் சுருக்கமாகக் காட்டுகிறது; அடிக்குறிப்பு அதை வெளிப்படையாக்குகிறது.
- issue: וְעָשָׂה என்பதன் கட்டளை/கடமை வலிமை
  choice: கடைப்பிடிக்க வேண்டும்
  alternative: கடைப்பிடிக்கலாம்; இருந்தபோதிலும் கடைப்பிடிக்க வேண்டும்
  rationale: நிபந்தனைச் சட்டத்தின் தொடர்ச்சியில் இவ்வினை கடமையை அறிவிக்கிறது. வெறும் அனுமதியாக்குவதும், மூலத்தில் இல்லாத ‘இருந்தபோதிலும்’ என்பதைச் சேர்ப்பதும் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நடை நவீன, செம்மையான, பொதுமக்களுக்கு எளிதில் புரியும் தரத் தமிழில் உள்ளது. ‘ஆசரிக்க’ போன்ற பழைய வழக்கிற்குப் பதிலாக ‘கடைப்பிடிக்க’ பயன்படுத்தப்பட்டது. சட்டவாக்கியத்தின் ஆண்பால் தனிநபர் வடிவம் காக்கப்பட்டாலும், கூட்டுச் சமூகப் பெயர் இயல்பான தமிழில் வழங்கப்பட்டு அடிக்குறிப்பில் சொற்பொருள் பதிவு செய்யப்பட்டுள்ளது.
