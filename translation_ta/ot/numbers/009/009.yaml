  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம் இப்படிக் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசி
  rationale: வாவ் தொடர் வடிவம் நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது. דּבר என்பதற்கு ‘பேசி’ என்பது ஏற்றது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர்; ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: ஒருவரை நோக்கிப் பேசுவதை நவீன தமிழில் இயல்பாகக் குறிக்க ‘-யிடம்’ பயன்படுத்தப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: வரவிருக்கும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வாய்ப்பாட்டை இயல்பான தமிழில் காட்டுகிறது; அடுத்த வசனத்தில் பேச்சு தொடர்வதை இரட்டைப்புள்ளி உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, மரபான மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வசனநடை. எபிரெயத்தின் இரட்டை பேச்சு அறிமுக அமைப்பான ‘பேசி ... கூறியது’ பாதுகாக்கப்பட்டுள்ளது; அடுத்த வசனத்தில் உரை தொடங்குவதால் இரட்டைப்புள்ளி இடப்பட்டுள்ளது.
