source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: ta
  text: யாவே கட்டளையிட்டபடி அவர்கள் முகாமிட்டார்கள்; யாவே கட்டளையிட்டபடி புறப்பட்டார்கள். மோசேயின் மூலமாக[a] யாவே கட்டளையிட்டபடி, அவர்கள் யாவே விதித்த பொறுப்பைக் கடைப்பிடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “மோசேயின் கையால்”; அதாவது, “மோசேயின் மூலமாக” அல்லது “மோசே இடைநிலையாளராகச் செயல்படுவதன் மூலம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: கட்டளையிட்டபடி
  rationale: இந்த எபிரெய மரபுத்தொடர் சொற்படி ‘வாயின்படி’ என்றாலும், இச்சூழலில் அதிகாரப்பூர்வமான கட்டளையையும் வழிநடத்தலையும் குறிக்கிறது. ‘கட்டளையிட்டபடி’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் திருப்பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: יַחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: முகாம் அமைத்துத் தங்குவதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: יִסָּעוּ
  choice: புறப்பட்டார்கள்
  rationale: முகாமை விட்டுப் பயணத்தைத் தொடங்கும் செயலை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁמֶרֶת
  choice: ஒப்படைத்த காவற்பொறுப்பு
  rationale: காக்கும்படி அல்லது கடைப்பிடிக்கும்படி ஒருவரிடம் ஒப்படைக்கப்பட்ட பொறுப்பு என்ற சொல்லின் காவல் மற்றும் கீழ்ப்படிதல் சார்ந்த இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: שָׁמָרוּ
  choice: கடைப்பிடித்தார்கள்
  rationale: இங்கு கொடுக்கப்பட்ட பொறுப்பை உண்மையுடன் அனுசரித்தல் என்பதே கருத்து; ‘கடைப்பிடித்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: சொற்படி ‘மோசேயின் கையால்’ என்ற எபிரெய மரபுத்தொடர், மோசே இடைநிலையாளராக அல்லது கருவியாகச் செயல்பட்டதைக் குறிக்கிறது. தமிழில் ‘மூலமாக’ அந்தப் பொருளை இயல்பாகத் தருகிறது; மூலப்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מִשְׁמֶרֶת יְהוָה என்பதன் பொருள்
  choice: யாவே ஒப்படைத்த காவற்பொறுப்பு
  alternative: யாவேயின் கட்டளை / யாவேக்குரிய காவல்
  rationale: இந்தத் தொடர் கட்டளைக்குக் கீழ்ப்படிதலை மட்டுமல்லாமல், ஒப்படைக்கப்பட்ட ஒன்றைக் கவனமாகக் காத்து அனுசரிக்கும் பொறுப்பையும் உணர்த்தலாம். மொழிபெயர்ப்பு இரு நுணுக்கங்களையும் முழுவதுமாக ஒன்றுக்குள் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ஒரே எபிரெயத் தொடர் עַל־פִּי மூன்று இடங்களிலும் ‘கட்டளையிட்டபடி’ என்று ஒற்றுமையாக வழங்கப்பட்டுள்ளது; இறுதிப் பகுதியின் எபிரெயச் சொல் வரிசை தமிழின் இயல்பான தொடரமைப்புக்காக மாற்றப்பட்டுள்ளது.
