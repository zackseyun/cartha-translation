base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: ta
  text: மேகம் கூடாரத்தின் மேலிருந்து உயர்த்தப்பட்டபோதெல்லாம்[a], அதற்குப் பிறகு இஸ்ரவேல் மக்கள் புறப்பட்டுச் செல்வார்கள்; மேகம் எந்த இடத்தில் தங்குமோ, அங்கேயே இஸ்ரவேல் மக்கள் முகாமிடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘திருவாசஸ்தலக் கூடாரம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயில் நேரடியாக ‘கூடாரம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: உயர்த்தப்பட்டபோதெல்லாம்
  rationale: לְפִי + infinitive இங்கு மீண்டும் மீண்டும் நிகழும் காலச் சூழலைக் குறிக்கிறது. மேகம் தானாக எழுந்தது என்று மட்டும் சொல்லாமல், எதனால் உயர்த்தப்பட்டது என்பதைத் தீர்மானிக்காத எபிரெயச் செயலப்பாட்டு நயத்தையும் இது காக்கிறது.
- source_word: הֶעָנָן
  choice: மேகமானது
  rationale: வனாந்தர வழிநடத்தல் சூழலில் ענן என்பதற்கான இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: מֵעַל הָאֹהֶל
  choice: கூடாரத்தின் மேலிருந்து
  rationale: מֵעַל என்பதன் இடவியல் பொருளையும் אֹהֶל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ என்பதையும் காக்கிறது; இங்கு அது திருவாசஸ்தலக் கூடாரத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: நிகழ்வுகளின் வெளிப்படையான கால வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: יִסְעוּ
  choice: புறப்பட்டுச் செல்வார்கள்
  rationale: சூழலில் imperfect தொடர்ச்சியாக நிகழ்ந்த வழக்கமான செயலைக் குறிக்கிறது; எதிர்காலச் செயல் என்று மட்டும் புரியாதவாறு தமிழ் வழக்குச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: நேரடி வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் இன/கூட்டுப் பெயராக வருகிறது. ‘மக்கள்’ என்பது உள்ளடக்கத்தை இயல்பாகவும் பாலின வரம்பின்றியும் தெரிவிக்கிறது.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: எந்த இடத்தில்
  rationale: குறிப்பிடப்படும் இடத்துடனான தொடர்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁכָּן
  choice: தங்குமோ
  rationale: שׁכן என்பதிலுள்ள தங்குதல்/நிலைகொள்ளுதல் கருத்தை மேகத்துக்கு இயல்பாகப் பொருந்தும் தமிழில் தருகிறது; தேவையற்ற இறையியல் தொழில்நுட்பப் பொருளைச் சேர்க்கவில்லை.
- source_word: שָׁם ... שָׁם
  choice: எந்த இடத்தில் ... அங்கேயே
  rationale: எபிரெயில் இருமுறை வரும் இடச் சுட்டின் தொடர்பும் வலியுறுத்தலும் தமிழின் ‘எந்த இடத்தில் ... அங்கேயே’ அமைப்பில் காக்கப்படுகிறது.
- source_word: יַחֲנוּ
  choice: முகாமிடுவார்கள்
  rationale: தொடர்ச்சியாக நிகழ்ந்த வழக்கமான செயலை நவீன, தெளிவான தமிழில் தெரிவிக்கிறது.
