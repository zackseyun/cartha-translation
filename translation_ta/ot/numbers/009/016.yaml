  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: ta
  text: 'இப்படியே அது எப்போதும் இருந்தது: மேகம் அதை மூடிக்கொண்டிருந்தது; இரவில் நெருப்பின் தோற்றமும் இருந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவில் நெருப்பைப் போலத் தோன்றியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: இப்படியே
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட நிலை தொடர்ந்து அவ்வாறே இருந்ததை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: יִהְיֶה תָמִיד
  choice: அது எப்போதும் இருந்தது
  rationale: எபிரெய நிறைவுறா வினை இங்கு கடந்தகாலத்தில் வழக்கமாகவும் தொடர்ச்சியாகவும் நிலவிய நிலையைக் குறிக்கிறது; ‘எப்போதும்’ அதன் நீடித்த தன்மையைத் தெரிவிக்கிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: உடனடி சூழலில் ஏற்கெனவே அறியப்பட்ட, திருவுறைவிடத்துடன் தொடர்புடைய மேகத்தைக் குறிக்கிறது.
- source_word: יְכַסֶּנּוּ
  choice: அதை மூடியிருந்தது
  rationale: வினைச்சொல் ‘மூடுதல்’ எனப் பொருள்படும். ஆண்பால் ஒருமை பின்னொட்டு சூழலில் திருவுறைவிடத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது; தொடர்ந்த நிலையை ‘மூடியிருந்தது’ வெளிப்படுத்துகிறது.
- source_word: וּמַרְאֵה אֵשׁ
  choice: நெருப்பின் தோற்றம் காணப்பட்டது
  rationale: מַרְאֶה என்பது காணப்படும் தோற்றத்தைக் குறிக்கிறது. இது உண்மையான நெருப்பா அல்லது நெருப்பைப் போன்ற காட்சியா என்பதைத் தீர்மானிக்காமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயப் பயன்பாட்டுக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: יְכַסֶּנּוּ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டின் சுட்டுப்பொருள்
  choice: ‘அதை’—திருவுறைவிடம் அல்லது வாசஸ்தலத்தைக் குறிப்பதாக மொழிபெயர்த்தல்
  alternative: ‘அவனை’ என்று நபரைக் குறிப்பதுபோல் மொழிபெயர்த்தல்
  rationale: உடனடி சூழல் மேகம் மூடிய திருவுறைவிடத்தைப் பற்றியது. தமிழில் ‘அதை’ என்பது அந்த உயிரற்ற சுட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- issue: מַרְאֵה אֵשׁ என்பது நெருப்பையே குறிக்கிறதா அல்லது நெருப்பைப் போன்ற தோற்றத்தையா குறிக்கிறதா
  choice: ‘நெருப்பின் தோற்றம்’ என்று வடிவியல் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘நெருப்பைப் போலத் தோன்றியது’ என்று ஒப்புமையாக வெளிப்படுத்தல்
  rationale: மூலச்சொல் காணப்படும் தோற்றத்தைச் சொல்கிறது; அது உண்மையான நெருப்பா என்பதை வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. மூலத்தின் சுருக்கமான இணை அமைப்பைத் தக்கவைத்தபடி, தமிழில் முழுமையான வாக்கியமாகப் படிக்க ‘காணப்பட்டது’ சேர்க்கப்பட்டுள்ளது.
