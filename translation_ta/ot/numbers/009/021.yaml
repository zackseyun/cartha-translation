base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: ta
  text: சில சமயங்களில் மேகம் மாலையிலிருந்து காலைவரை நிலைத்திருக்கும்; காலையில் மேகம் மேலெழுந்ததும்[a] அவர்கள் புறப்படுவார்கள். அல்லது அது ஒரு பகலும் ஓர் இரவும் நிலைத்திருந்தால், மேகம் மேலெழுந்ததும் அவர்கள் புறப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேகம் உயர்ந்ததும்.’ எபிரெய வினைச்சொல்லை இவ்வாறும் மொழிபெயர்க்கலாம்; இச்சூழலில் மேகம் மேலே எழுவது இஸ்ரவேலர் புறப்படுவதற்கான அடையாளமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: சில சமயங்களில்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட பொதுவான நடைமுறைக்குள் அவ்வப்போது நிகழ்ந்த ஒரு சூழலை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יִהְיֶה הֶעָנָן
  choice: மேகம் ... நிலைத்திருக்கும்
  rationale: היה என்பதன் அடிப்படைப் பொருள் ‘இரு’ என்றாலும், மாலைமுதல் காலைவரை என்ற கால எல்லையுடன் இங்கு தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: மாலைமுதல் காலைவரை
  rationale: தொடக்கத்தையும் முடிவையும் தெளிவாகக் காட்டும் இயல்பான தமிழ்க் காலத் தொடர்.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: மேகம் மேலெழும்பியதும்
  rationale: עלה என்பது இச்சூழலில் மேகம் கூடாரத்தின்மேலிருந்து உயர்ந்து, இஸ்ரவேலர் புறப்படுவதற்கான அடையாளமாக அமைவதைக் குறிக்கிறது. எபிரெய வடிவம் இலக்கணப்படி செயப்பாட்டு அல்லாததால், தமிழில் இயல்பான தன்வினை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: எளிய, இயல்பான நவீனத் தமிழ்க் காலக் குறிப்பு.
- source_word: וְנָסָעוּ
  choice: அவர்கள் புறப்படுவார்கள்
  rationale: வனாந்தரப் பயணச் சூழலில் முகாமிலிருந்து கிளம்பிச் செல்வதைத் தெளிவாகக் குறிக்கிறது; ‘பயணம் செய்வார்கள்’ என்பதைக் காட்டிலும் புறப்படும் தருணத்தை நன்கு வெளிப்படுத்துகிறது.
- source_word: אוֹ
  choice: அல்லது ... இருந்தால்
  rationale: முதல் சூழலுக்கு இணையான மாற்றுச் சூழலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: יוֹמָם וָלַיְלָה
  choice: ஒரு பகலும் ஓர் இரவும்
  rationale: இங்கு மேகம் நிலைத்திருக்கும் கால அளவைக் குறிக்கிறது. ‘பகலிலும் இரவிலும்’ என்பது காலப்பகுதிகளை மட்டும் சுட்டும் வாய்ப்புள்ளதால், நீடிப்பைத் தெளிவுபடுத்த இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
