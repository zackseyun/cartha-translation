translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாயினும் வேதாகம உரைக்கேற்ற கண்ணியமான நடை. தொடர்ச்சியாக நிகழ்ந்த வழக்கத்தை ‘நிலைத்திருக்கும்’, ‘புறப்படுவார்கள்’ என்ற வடிவங்கள் வெளிப்படுத்துகின்றன. வசனத்தின் இணை அமைப்பும் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
