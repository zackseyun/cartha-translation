base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: ta
  text: ஆனால், சடங்குமுறையில் தூய்மையானவனாயும் பயணத்தில் இல்லாதவனாயும் இருக்கும் ஒருவன் பஸ்காவை அனுசரிக்கத் தவறினால், அந்த நபர் தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்[a]. ஏனெனில், அவன் யாவேயின் காணிக்கையை அதற்குக் குறிக்கப்பட்ட காலத்தில் அர்ப்பணிக்கவில்லை. அந்த மனிதன் தன் பாவத்தைச் சுமப்பான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறுத்துப்போடப்படுவான்’ என்ற எபிரேய மரபுத்தொடர் கடுமையான உடன்படிக்கைசார் நீதித்தீர்ப்பைக் குறிக்கலாம்; அது எவ்வாறு நிறைவேற்றப்படும் என்பதை இவ்வசனம் துல்லியமாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் குற்றப்பழியைச் சுமப்பான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: சடங்குப்படி தூய்மையுள்ளவன்
  rationale: இச்சூழலில் இச்சொல் ஒழுக்கத் தூய்மையை அல்ல, சடங்குசார் தூய்மையைக் குறிக்கிறது; அதைத் தெளிவுபடுத்த இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: பயணத்தில் இல்லாதவன்
  rationale: முந்தைய வசனங்களில் பயணம் காரணமாக விலக்கு அளிக்கப்பட்டவருடன் உள்ள வேறுபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: பஸ்காவைக் கொண்டாடத் தவறினால்
  rationale: חָדַל என்பது செய்யாமல் விடுதல் அல்லது தவறுதல் எனப் பொருள்படும்; לעשות הפסח என்பது பஸ்கா அனுசரிப்பை நிறைவேற்றுவதைக் குறிக்கிறது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: இங்கு பலியையே மட்டும் அல்லாமல் பஸ்கா அனுசரிப்பு முழுவதையும் குறிக்கக்கூடும்; அடுத்த வாக்கியம் அதன் காணிக்கை அம்சத்தைத் தனியாகக் குறிப்பிடுகிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் ... அறுத்துப்போடப்படுவான்
  rationale: נפש இங்கு தனிநபரைக் குறிக்கிறது. כרת என்ற உடன்படிக்கைசார் நீதித்தீர்ப்பு மரபுத்தொடரை வெறும் சமூக விலக்காகக் குறுக்காமல், ‘அறுத்துப்போடப்படுவான்’ என்று பாதுகாக்கிறது.
- source_word: מֵעַמֶּיהָ
  choice: தன் மக்களிடமிருந்து
  rationale: பெண்பால் பின்னொட்டு נפש என்ற இலக்கணப் பெண்பால் சொல்லுடன் பொருந்தினாலும், குறிக்கப்படுவது அந்த ஆண்; தமிழ் இயல்புக்கு ஏற்ப ‘தன் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: קָרְבַּן יְהוָה
  choice: யாவேயின் காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கைக்கான பொதுச்சொல்; உடைமைத் தொடர்பும் இறைப்பெயரும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயர் ஒரு பட்டப்பெயராக மாற்றப்படாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: בְּמֹעֲדוֹ
  choice: அதற்குக் குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד என்பது விதிக்கப்பட்ட நிலையான நேரத்தைக் குறிக்கிறது; காணிக்கைக்குரிய காலம் என்பதையும் ‘அதற்கு’ தெளிவாக இணைக்கிறது.
- source_word: לֹא הִקְרִיב
  choice: செலுத்தவில்லை
  rationale: பலிக்காணிக்கையை யாவேக்கு முன் கொண்டுவந்து அர்ப்பணித்தல் என்ற கருத்தை இச்சூழலில் இயல்பான வழிபாட்டு தமிழில் தெரிவிக்கிறது.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: தன் பாவத்தைச் சுமப்பான்
  rationale: குற்றத்திற்கும் அதன் விளைவிற்கும் பொறுப்பேற்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: הָאִישׁ הַהוּא
  choice: அந்த மனிதன்
  rationale: எபிரேய மூலத்தின் வெளிப்படையான ஆண்பால் ஒருமையைத் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அறுத்துப்போடப்படுவான்’ என்ற தண்டனையின் துல்லியமான பொருள்
  choice: மூலத்தின் நீதித்தீர்ப்பு மரபுத்தொடரை அப்படியே பாதுகாத்தல்
  alternative: சமுதாயத்திலிருந்து விலக்கப்படுவான்; கொல்லப்படுவான்
  rationale: இவ்வசனம் இது மரணம், சமூக விலக்கம் அல்லது நேரடியான தெய்வீகத் தீர்ப்பு ஆகியவற்றில் எது என்பதைத் திட்டவட்டமாகக் கூறவில்லை. ஆகவே அந்தத் தத்துவ மற்றும் சட்டத் தெளிவின்மை தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: חֶטְאוֹ יִשָּׂא என்பதன் பொருள்
  choice: தன் பாவத்தைச் சுமப்பான்
  alternative: தன் குற்றப்பழியைச் சுமப்பான்
  rationale: ‘பாவம்’ என்பது மூலச்சொல்லின் நேரடியான கருத்தையும் அதன் விளைவுகளுக்கான பொறுப்பையும் திறந்த நிலையில் வைக்கிறது; ‘குற்றப்பழி’ என்பது சாத்தியமான விளக்க வாசிப்பு.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தரமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சடங்குப்படி’ என்பது טָהוֹר என்பதன் வழிபாட்டுச் சூழலைத் தெளிவுபடுத்துகிறது. ‘அறுத்துப்போடப்படுவான்’ சற்று செறிவான மரபுத்தொடராக இருந்தாலும், மூலத்தின் திட்டமிட்ட சட்ட-இறையியல் தெளிவின்மையைப் பாதுகாப்பதற்காக வைத்திருக்கப்பட்டுள்ளது. அடிக்குறி குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே அமைக்கப்பட்டுள்ளன.
