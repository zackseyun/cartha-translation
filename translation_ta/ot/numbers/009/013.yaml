revisions:
- from: ஆனால், சடங்குப்படி தூய்மையுள்ளவனாகவும் பயணத்தில் இல்லாதவனாகவும் இருக்கும் ஒருவன் பஸ்காவைக் கொண்டாடத் தவறினால், அந்த நபர் தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்[a]. ஏனெனில், அவன் யாவேயின் காணிக்கையை அதற்குக் குறிக்கப்பட்ட காலத்தில் செலுத்தவில்லை. அந்த மனிதன் தன் பாவத்தைச் சுமப்பான்[b].
  to: ஆனால், சடங்குமுறையில் தூய்மையானவனாயும் பயணத்தில் இல்லாதவனாயும் இருக்கும் ஒருவன் பஸ்காவை அனுசரிக்கத் தவறினால், அந்த நபர் தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்[a]. ஏனெனில், அவன் யாவேயின் காணிக்கையை அதற்குக் குறிக்கப்பட்ட காலத்தில் அர்ப்பணிக்கவில்லை. அந்த மனிதன் தன் பாவத்தைச் சுமப்பான்[b].
  rationale: 'The revision changes only two expressions for closer source fidelity and clearer modern Tamil: the Passover is ‘observed,’ and Yahweh’s offering is ‘presented/offered’ rather than ‘paid.’ The ambiguous judicial idiom and all key theological terminology are retained without interpretive expansion.'
  reviewer_model: gpt-5.6-terra
