  source_fidelity: மூல எபிரெயத்தின் காலக் குறிப்பு, ‘மாலைப்பொழுதுகளுக்கு இடையில்’ என்ற மரபுத்தொடரின் பொருள், பஸ்காவை அனுசரிக்கும் கட்டளை, மற்றும் புளிப்பில்லா அப்பம், கசப்பான கீரைகள் ஆகியவற்றுடன் உண்ணுதல் ஆகிய அனைத்தும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘அதை’ என்ற சுட்டுப்பெயர் மூலத்தில் உள்ள אֹתוֹ / יֹאכְלֻהוּ சுட்டுதலையும் காக்கிறது.
