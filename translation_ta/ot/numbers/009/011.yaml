translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அனுசரிக்க வேண்டும்’ என்பது பஸ்காவைச் சடங்காக நிறைவேற்றும் பொருளைக் காக்கிறது; மூலத்தின் ‘அதை’ என்ற சுட்டுப்பெயரும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
