  terminology: ‘மாதம்,’ ‘அந்தி நேரம்,’ ‘அனுசரிக்க,’ ‘புளிப்பில்லாத அப்பம்,’ ‘கசப்பான கீரைகள்’ ஆகிய சொற்கள் சூழலுக்கும் நிலையான வேதாகமப் பயன்பாட்டிற்கும் பொருத்தமானவை. அடிக்குறிப்பு எபிரெய மரபுத்தொடரின் நேரடி வடிவத்தையும் அதன் பொருளையும் முறையாகத் தருகிறது.
