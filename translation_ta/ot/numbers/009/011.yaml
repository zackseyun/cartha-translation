source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: ta
  text: இரண்டாம் மாதத்தின் பதினான்காம் நாளில், அந்தி நேரத்தில்[a] அவர்கள் அதை அனுசரிக்க வேண்டும்; புளிப்பில்லாத அப்பத்துடனும் கசப்பான கீரைகளுடனும் அதை உண்ண வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரு மாலைப்பொழுதுகளுக்கு இடையில்”; இது சூரிய மறைவை ஒட்டிய அந்தி நேரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தின்
  rationale: நாட்காட்டிச் சூழலில் חֹדֶשׁ என்பது ‘மாதம்’ எனப் பொருள்படும்; அடுத்துவரும் நாளைக் குறிக்கும் தொடருடன் இயல்பான தமிழில் இணைக்கப்பட்டது.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: பதினான்காம் நாளில்
  rationale: எபிரெய எண்ணிக்கை அமைப்பு ஒரு தேதியைக் குறிக்கிறது; தமிழில் வரிசை எண்ணாக மொழிபெயர்ப்பது இயல்பானது.
- source_word: בֵּין הָעַרְבַּיִם
  choice: அந்தி நேரத்தில்
  rationale: சூரிய மறைவை ஒட்டிய மாலை மங்கும் நேரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: அவர்கள் அதை அனுசரிக்க வேண்டும்
  rationale: பஸ்கா தொடர்பான சடங்கு-சட்டச் சூழலில் עשה வெறுமனே ‘செய்’ என்பதைக் காட்டிலும் அதைக் கடைப்பிடித்து நிறைவேற்றுவதைக் குறிக்கிறது.
- source_word: עַל מַצּוֹת
  choice: புளிப்பில்லாத அப்பத்துடன்
  rationale: இங்கு עַל உடன்சேர்ந்து உண்பதைக் குறிக்கிறது; מַצּוֹת புளிப்பூட்டப்படாத அப்பத்தைக் குறிக்கிறது.
- source_word: וּמְרֹרִים
  choice: கசப்பான கீரைகளுடன்
  rationale: இந்தப் பன்மைச் சொல் பஸ்கா உணவோடு உண்ணப்படும் கசப்பான தாவர உணவுகளைக் குறிக்கிறது; ‘கீரைகள்’ சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: יֹאכְלֻהוּ
  choice: அதை உண்ண வேண்டும்
  rationale: மூன்றாம் நபர் பன்மை வினையும் ஆண்பால் ஒருமைச் சுட்டுப்பின்னொட்டும் உள்ளன; சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
