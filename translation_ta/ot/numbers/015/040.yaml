  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: ta
  text: நீங்கள் என் கட்டளைகள் அனைத்தையும் நினைவில் கொண்டு செய்து, உங்கள் கடவுளுக்குப் பரிசுத்தமானவர்களாய்[a] இருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளுக்கெனப் பிரித்துவைக்கப்பட்டவர்களாய்.”
    reason: கְדֹשִׁים לֵאלֹהֵיכֶם என்பதற்கான சொல் மாற்று; 'பரிசுத்தமானவர்களாய்' என்பதிலே சரியாகக் குறியிடப்பட்டுள்ளது.
lexical_decisions:
- source_word: לְמַעַן
  choice: இருப்பதற்காக
  rationale: எபிரெய நோக்கப் பொருளைத் தமிழில் இயல்பான இறுதி நோக்கத் தொடராக வெளிப்படுத்துகிறது; முழு வாக்கியத்தின் நோக்கக் கட்டமைப்பை முடிவில் நிறைவு செய்கிறது.
- source_word: תִּזְכְּרוּ
  choice: நீங்கள் நினைவுகூர்ந்து
  rationale: זכר என்பதன் நினைத்தல்/நினைவில் கொள்ளுதல் என்ற உடன்படிக்கைச் சூழலிலான பொருளைக் காக்கிறது.
- source_word: וַעֲשִׂיתֶם
  choice: கடைப்பிடித்து
  rationale: கட்டளைகளைச் செயலில் நிறைவேற்றுதல் என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் நினைவில் வைத்திருப்பதிலிருந்து நடைமுறை கீழ்ப்படிதலை வேறுபடுத்துகிறது.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: என் கட்டளைகள் அனைத்தையும்
  rationale: כָּל, முதல் நபர் உரிமை விகுதி, மற்றும் מִצְוֹת ஆகிய அனைத்தையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וִהְיִיתֶם
  choice: இருப்பதற்காக
  rationale: היה உடன் வரும் நிலைப் பயனிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘ஆகுதல்’ என்ற செயல்முறையைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: קְדֹשִׁים
  choice: பரிசுத்தமானவர்களாய்
  rationale: நெறி, உடன்படிக்கை, வழிபாட்டு அர்ப்பணிப்பு ஆகிய பரந்த பொருள் வளத்தைத் தக்கவைக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: לֵאלֹהֵיכֶם
  choice: உங்கள் கடவுளுக்குப்
  rationale: לְ குறிக்கும் கடவுளுடனான தொடர்பு/அர்ப்பணிப்பை ‘கடவுளுக்கு’ எனச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் பரிசுத்தம் என்பதன் பொருள்
  choice: உங்கள் கடவுளுக்குப் பரிசுத்தமானவர்களாய்
  alternative: உங்கள் கடவுளுக்கெனப் பிரித்துவைக்கப்பட்டவர்களாய்
  rationale: ‘பரிசுத்தம்’ என்பது நெறிசார் தூய்மை, உடன்படிக்கைச் சேர்ந்திருத்தல், வழிபாட்டுக்கான பிரித்துவைப்பு ஆகிய அனைத்தையும் உள்ளடக்க முடியும்; ஒரே பரிமாணமாகக் குறுக்காமல் மூலத்தின் இறையியல் செறிவைக் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தில் தனி lexical alternative குறிப்பு இல்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு ‘commandments’ என்பதற்கு பொருந்தாததாகத் தோன்றுவதால் தமிழில் சேர்க்கப்படவில்லை.
