base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: ta
  text: ஆனால் நீங்கள் அறியாமல் வழிதவறி, யாவே மோசேயிடம் கூறிய இந்தக் கட்டளைகள் அனைத்தையும் செய்யாமல் போனால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அறியாமல் தவறு செய்து.” எபிரெய வினை ‘வழிதவறுதல்’ அல்லது ‘தவறுதல்’ என்பதைக் குறிக்கிறது; இச்சூழலில் அது கட்டளைகளை அறியாமல் செய்யத் தவறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால் ... போனால்
  rationale: தொடர்ந்து வரும் சட்டவிதியில் ஒரு நிபந்தனையான, சற்றே மாறுபட்ட சூழலை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: תִשְׁגּוּ
  choice: நீங்கள் அறியாமல் வழிதவறி
  rationale: שׁגה என்பதிலுள்ள ‘வழிதவறுதல்/தவறுதல்’ என்ற உருவகத்தையும், இச்சட்டச் சூழலில் உள்ள அறியாமை அல்லது நோக்கமின்மை நுணுக்கத்தையும் காக்கிறது.
- source_word: וְלֹא תַעֲשׂוּ
  choice: செய்யாமல் போனால்
  rationale: கட்டளைகளைச் செய்யத் தவறுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இதை வேண்டுமென்ற கீழ்ப்படியாமை என்று மிகைப்படுத்தவில்லை.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: இந்தக் கட்டளைகள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும், மִצְוֺת என்பதன் உடன்படிக்கைச் சட்டப் பொருளையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: யெகோவா மோசேயிடம் கூறிய
  rationale: கட்டளைகளை யெகோவா மோசேயிடம் உரைத்தார் என்ற உறவுச் சொற்றொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: שׁגה என்ற வினையின் சட்ட-பலியியல் நுணுக்கம்
  choice: அறியாமல் வழிதவறுதல்
  alternative: தவறு செய்தல்; அறியாமல் பாவம் செய்தல்
  rationale: உடனடி சூழல் நோக்கமின்றிச் செய்யப்பட்ட மீறுதலைப் பற்றியது. ‘வழிதவறுதல்’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘அறியாமல்’ என்பது வேண்டுமென்ற மீறுதலிலிருந்து வேறுபடுத்துகிறது; ‘பாவம்’ என்ற சொல்லை மூலத்தில் இல்லாத இடத்தில் நேரடியாகச் சேர்ப்பதில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் உள்ளது. பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயரையே வழங்கி, தமிழில் பரவலாகப் பயன்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நிபந்தனை வாக்கியம் அடுத்த வசனங்களுக்குத் தொடர்வதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
