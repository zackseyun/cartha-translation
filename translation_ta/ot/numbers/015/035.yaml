source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “அந்த மனிதன் நிச்சயமாகக் கொல்லப்பட வேண்டும்[a]. சமூகத்தினர் அனைவரும் அவனைக் கல்லெறிந்து கொல்ல வேண்டும்[b]; அது முகாமுக்கு வெளியே நடக்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கொல்லப்படவே கொல்லப்பட வேண்டும்” என வலியுறுத்தும் அமைப்பு.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, “அவனைக் கற்களால் கல்லெறிய வேண்டும்”; இது கல்லெறிந்து மரணதண்டனை நிறைவேற்றுவதைக் குறிக்கும் வலியுறுத்தப்பட்ட நீதித்துறைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற வடிவில் வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் நடையில் காலவரிசையை வெளிப்படுத்துகிறது.
- source_word: מוֹת יוּמַת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயருருவும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலையும், செயல்படுபொருள் மறைந்துள்ள வினை வடிவையும் காக்கிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: முன்னரே அடையாளப்படுத்தப்பட்ட குற்றவாளியைத் தெளிவாகச் சுட்டுகிறது.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: அவனைக் கல்லெறிந்து கொல்ல வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘கற்களால் கல்லெறியுங்கள்’ என்பது தமிழில் இயல்பற்றதால், கல்லெறிதல் மரணதண்டனை என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; மூலத்தின் வலியுறுத்தல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: உடன்படிக்கைச் சமூகத்தின் ஒன்றுகூடிய மொத்தக் குழுவைக் குறிக்கும் முறையான கூட்டுப்பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: மரணதண்டனை நிறைவேற்றப்பட வேண்டிய இடத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாஹ்வே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ‘ஆண்டவர்’ என்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. ‘யாஹ்வே’ சாத்தியமான மறுகட்டமைப்பு; ‘யெகோவா’ நவீன தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம்.
- issue: மரணதண்டனைக் கட்டளையின் வலியுறுத்தல்
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: கொல்லப்படவே வேண்டும்
  rationale: מוֹת יוּמַת என்ற எபிரெய வலியுறுத்தலைத் தணிக்காமலும், கட்டளையின் செயல்படுபொருள் மறைந்துள்ள வடிவத்தைச் செயப்பாட்டு வினையாகவும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்ட-கதை நடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் இரண்டு வலியுறுத்தல் அமைப்புகளும் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன.
