revisions:
- from: திராட்சரசத்தைப் பானபலியாக அரை ஹின் அளவு செலுத்த வேண்டும். அது யெகோவாவுக்கு இனிய நறுமணமுள்ள நெருப்புப் பலி[a].
  to: திராட்சரசத்தையும் பானபலியாக அரை ஹின் அளவு செலுத்த வேண்டும்; அது யாவேக்கு இனிய நறுமணமுள்ள நெருப்புப் பலி[a].
  rationale: The revision preserves the Hebrew’s additive conjunction, renders the divine name consistently with the supplied POB audit trail, and presents the sacrificial formula in a direct, natural Tamil structure. The note is narrowed to secure alternatives for אִשֶּׁה without importing a disputed ‘food offering’ sense.
