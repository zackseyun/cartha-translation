reference: Numbers 15:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: திராட்சரசத்தையும் பானபலியாக அரை ஹின் அளவு செலுத்த வேண்டும்; அது யாவேக்கு இனிய நறுமணமுள்ள நெருப்புப் பலி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெருப்பால் செலுத்தப்படும் பலி’ அல்லது ‘நெருப்பினால் செய்யப்பட்ட காணிக்கை.’
    reason: אִשֶּׁה என்பதற்கான பாரம்பரிய மற்றும் சொற்சார்ந்த மாற்று மொழிபெயர்ப்புகளைத் தருகிறது.
lexical_decisions:
- source_word: וְ/יַיִן
  choice: திராட்சரசத்தை
  rationale: יַיִן என்பது திராட்சரசத்தைக் குறிக்கிறது. தமிழில் வினையோடு இயல்பாக அமைய இரண்டாம் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது; וְ இங்குள்ள தொடர்ச்சியை வாக்கிய ஓட்டம் வெளிப்படுத்துகிறது.
- source_word: תַּקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபீல் வடிவம் பலியை அணுகச் செய்தல் அல்லது சமர்ப்பித்தல் என்ற பொருளுடையது. பலியைக் குறித்த சூழலில் ‘செலுத்த வேண்டும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַ/נֶּסֶךְ
  choice: பானபலியாக
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் திரவப் பலியைக் குறிக்கிறது. ‘பானபலி’ தமிழில் சுருக்கமாகவும் புரியும்படியாகவும் அந்தச் சடங்குச் சொல்லை வெளிப்படுத்துகிறது.
- source_word: חֲצִי הַ/הִין
  choice: அரை ஹின் அளவு
  rationale: பண்டைய அளவலகான הִין அப்படியே ஒலிபெயர்க்கப்பட்டு, அளவைக் குறிக்கிறது என்பது தெளிவாகும்படி ‘அளவு’ சேர்க்கப்பட்டது.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: אִשֵּׁה என்ற ஆசாரியச் சொல்லின் நெருப்புடன் தொடர்புடைய நேரடியான பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது. ‘நெருப்பால் செலுத்தப்படும் பலி’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமுள்ள
  rationale: இந்த நிலையான பலியியல் சொற்றொடர் யெகோவாவுக்கு ஏற்றுக்கொள்ளத்தக்க இனிய மணத்தைக் குறிக்கிறது. தமிழில் ‘இனிய நறுமணம்’ இயல்பான இணைச்சொல்.
- source_word: לַ/יהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டு, לְ என்பதன் திசை/பெறுநர் பொருள் நான்காம் வேற்றுமையால் காட்டப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு மெய்யெழுத்துகளாலான இறைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் தனிப்பெயராக வெளிப்படுத்துகிறது. எபிரெய உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படாததால் ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: אִשֵּׁה என்ற பலியியல் சொல்லின் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் படையல் / நெருப்பால் செலுத்தப்படும் பலி
  rationale: சொல்லின் துல்லியமான சொற்பிறப்பும் பரப்பும் விவாதத்திற்குரியவை. இவ்வசனத்தில் நெருப்புடன் தொடர்புடைய பாரம்பரிய பலியியல் பொருளைப் பிரதான உரை காக்கிறது; செய்முறையை மிகத் துல்லியமாக நிர்ணயிக்காமல் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. பண்டைய அளவலகான ‘ஹின்’ மாற்றமின்றி வைக்கப்பட்டுள்ளது; பலியியல் சொற்கள் சுருக்கமாகவும் இயல்பாகவும் அமைக்கப்பட்டுள்ளன.
