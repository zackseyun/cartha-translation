  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: ta
  text: உங்களோடு குடியேறி வாழும் ஓர் அந்நியர், அல்லது தலைமுறைதோறும் உங்களிடையே இருக்கும் எவராவது, யெகோவாவுக்குப் பிரியமான நறுமணமுள்ள நெருப்புப் பலியை[a]ச் செலுத்தினால், நீங்கள் செய்வதுபோலவே அவனும் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெருப்பில் செலுத்தப்படும் காணிக்கை’ அல்லது ‘அக்கினிக் காணிக்கை.’
    reason: அִשֶּׁה என்பதன் நேரடியான பலிச் சொல்லாக்க மாற்றுகளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וְכִי יָגוּר אִתְּכֶם גֵּר
  choice: உங்களோடு ஒரு குடியிருப்பு அந்நியன் தங்கியிருந்தாலோ
  rationale: גֵּר என்பது இஸ்ரவேலரல்லாதபோதும் அவர்களிடையே வசிக்கும் சட்டப்பூர்வ சமூகப் பிரிவைக் குறிக்கிறது. ‘குடியிருப்பு அந்நியன்’ அந்த நிலையைத் தெளிவாக்குகிறது; יָגוּר என்பதன் வசித்தல்/தங்குதல் பொருளையும் தனியே காக்கிறது.
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: அல்லது உங்களிடையே எவராவது இருந்தாலோ
  rationale: எபிரெய உறவுநிலைத் தொடரின் பரந்த, உள்ளடக்கும் பொருளை இயல்பான தமிழில் தருகிறது; இதனை முந்தைய ‘குடியிருப்பு அந்நியன்’ என்பதோடு முற்றிலும் ஒன்றாக்காமல் வைத்திருக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: இந்த விதி அடுத்தடுத்த தலைமுறைகளிலும் தொடர்ந்து பொருந்துவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וְעָשָׂה אִשֵּׁה
  choice: நெருப்புப் பலியைச் செலுத்தும்போது
  rationale: עשה பலிச் சூழலில் ‘செலுத்துதல்’ என இயல்பாக வருகிறது. אִשֵּׁה என்பது நெருப்பில் செலுத்தப்படும் காணிக்கையைச் சுட்டுவதால், ‘நெருப்புப் பலி’ மூலச்சொல்லின் தொடர்பை நேரடியாகக் காக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமான
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதைக் காட்டும் மண உருவகத்தை இயல்பாகவும் கண்ணியமாகவும் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பொதுப்பட்டமாக மாற்றாமல் பெயராக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: நீங்கள் செய்வது போலவே அவனும் செய்ய வேண்டும்
  rationale: ஒப்புமையைக் கூறும் சட்டச் சூத்திரத்தையும் அதன் கட்டாயப் பொருளையும் தெளிவான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரல்லாத ஒருவரின் பலிவழிபாட்டில் பங்கேற்பு நிலை
  choice: இந்தச் சூழலில் இஸ்ரவேலர் கடைப்பிடிக்கும் அதே பலிச் செயன்முறையை அவர்களிடையே வாழும் நபரும் கடைப்பிடிக்க வேண்டும் என மொழிபெயர்க்கப்பட்டது.
  alternative: இது உடன்படிக்கைச் சமூகத்தில் ஏற்கெனவே ஒருங்கிணைக்கப்பட்ட குடியிருப்பு அந்நியருக்கு மட்டுமே பொருந்தும் என்று குறுகலாக வாசிக்கலாம்.
  rationale: ‘நீங்கள் செய்வது போலவே அவனும் செய்ய வேண்டும்’ என்ற எபிரெய சட்டச் சூத்திரம் இங்கு நடைமுறைச் சமத்துவத்தை வலியுறுத்துகிறது. ஆனால் அந்த நபரின் விரிவான உடன்படிக்கை நிலை குறித்து வசனம் கூறாத முடிவை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதியின் கண்ணியமும் கட்டாயத் தொனியும் பாதுகாக்கப்பட்டுள்ளன. ‘குடியிருப்பு அந்நியன்’ என்பது தொழில்நுட்பமான வேதாகமச் சமூகச் சொல்லாக இருந்தாலும் சாதாரண வாசகருக்குப் புரியுமாறு அமைந்துள்ளது. மூலத்தில் இல்லாத அடிக்குறிப்பு குறியீடு சேர்க்கப்படவில்லை.
