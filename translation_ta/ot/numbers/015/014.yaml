    reason: அִשֶּׁה என்பதன் நேரடியான பலிச் சொல்லாக்க மாற்றுகளைச் சுட்டுகிறது.
  revision_rationale: The revision improves modern Tamil idiom, preserves the resident-foreigner category expressed by גֵּר, and represents the conditional legal construction more directly. It retains the source’s comparison—‘just as you do, so he shall do’—without extending the verse’s implications beyond the sacrificial procedure stated here.
