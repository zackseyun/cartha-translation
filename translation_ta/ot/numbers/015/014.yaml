review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the conditional legal instruction and the parity formula. However, its wording for the resident foreigner is awkward, and the sacrifice clause is more naturally and precisely rendered as a conditional action. The Hebrew אִשֶּׁה denotes an offering made by fire; the Tamil rendering should retain that sense without treating the offering itself as merely an aroma.
  naturalness: ‘ஒரு குடியிருப்பு அந்நியன்’ is not idiomatic modern standard Tamil. ‘உங்களோடு குடியேறி வாழும் ஓர் அந்நியர்’ is clearer and retains the legal-social sense of גֵּר. Restructuring the sentence also avoids the cumbersome repeated ‘இருந்தாலோ’.
  terminology: ‘யெகோவா’ is retained for יהוה, consistently with the draft. ‘நெருப்புப் பலி’ is retained for אִשֶּׁה, with the explanatory lexical alternative supplied in a footnote. ‘பிரியமான நறுமணமுள்ள’ preserves the sacrificial idiom רֵיחַ נִיחֹחַ without adding a theological interpretation.
  issues:
  - severity: medium
    issue: Unnatural designation for גֵּר
    rationale: ‘குடியிருப்பு அந்நியன்’ is a calqued and awkward noun phrase in modern Tamil. The source denotes a non-native person residing among the Israelites; ‘உங்களோடு குடியேறி வாழும் ஓர் அந்நியர்’ communicates both elements naturally.
  - severity: low
    issue: Conditional flow in the sacrificial clause
    rationale: ‘செலுத்தும்போது’ makes the action primarily temporal, whereas the Hebrew presents the action within the conditional legal case. ‘செலுத்தினால்’ better carries the conditional sequence and fits the Tamil legal instruction.
  - severity: low
    issue: No footnote for the lexical alternative for אִשֶּׁה
    rationale: The English audit trail preserves ‘offering by fire/fire offering’ as an alternative. A Tamil footnote anchored to ‘நெருப்புப் பலி’ documents this lexical issue while leaving the main text readable.
  revised_text: உங்களோடு குடியேறி வாழும் ஓர் அந்நியர், அல்லது தலைமுறைதோறும் உங்களிடையே இருக்கும் எவராவது, யெகோவாவுக்குப் பிரியமான நறுமணமுள்ள நெருப்புப் பலியை[a]ச் செலுத்தினால், நீங்கள் செய்வதுபோலவே அவனும் செய்ய வேண்டும்.
