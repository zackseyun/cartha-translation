  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: ta
  text: சபையாரின் கவனத்துக்கு வராமல் அது தவறுதலாகச் செய்யப்பட்டிருந்தால், சபையார் அனைவரும் மாட்டுமந்தையிலிருந்து ஓர் இளங்காளையை யாவேக்கு இனிய நறுமணமான தகனபலியாகச் செலுத்த வேண்டும்; அதனுடன் முறைப்படி அதற்குரிய தானியபலியையும் பானபலியையும், பாவப்பலியாக[a] ஓர் ஆண் வெள்ளாட்டையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.” எபிரேய חַטָּאת என்பது பாவத்துடன் தொடர்புடைய பலியையும், அது நிறைவேற்றும் சடங்குத் தூய்மைப்படுத்துதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: சபையாரின் கவனத்துக்கு வராமல்
  rationale: ‘சபையின் கண்களிலிருந்து’ என்ற எபிரேய மரபுத்தொடர், ஒரு செயல் சபையாரால் கவனிக்கப்படாமல் போனதைக் குறிக்கிறது; இத்தமிழாக்கம் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: அது தவறுதலாகச் செய்யப்பட்டிருந்தால்
  rationale: שְׁגָגָה வேண்டுமென்றே செய்த மீறுதலுக்கு மாறாக, அறியாமையாலோ கவனக்குறைவாலோ நிகழ்ந்த தவற்றைக் குறிக்கிறது.
- source_word: כָל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה இங்கு இஸ்ரவேல் உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது; כָל என்பதன் முழுமையும் ‘அனைவரும்’ என்பதால் காக்கப்படுகிறது.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: மந்தையிலிருந்து ஓர் இளங்காளை
  rationale: இந்தச் சொற்றொடர் மாட்டுமந்தையைச் சேர்ந்த ஒரு காளையைக் குறிக்கிறது; பலிக்குரிய இளம் காளை என்ற இயல்பான தமிழ்ச் சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலிக்கான நிலையான ஆசாரச் சொல்; ‘தகனபலி’ அதன் தன்மையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமான
  rationale: இது பலி கடவுளுக்கு ஏற்புடையதாக இருப்பதைக் காட்டும் ஆசார உருவகம்; அதன் மணம் சார்ந்த உருவகமும் தமிழில் காக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல், ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וּמִנְחָתוֹ
  choice: அதற்குரிய தானியபலியையும்
  rationale: முன்னுள்ள தகனபலியுடன் சேர்த்துச் செலுத்தப்படும் தானியப் பலியையும், இணைந்துள்ள உரிமைச் சுட்டையும் இச்சொல்லாக்கம் தெளிவாக்குகிறது.
- source_word: וְנִסְכּוֹ
  choice: பானபலியையும்
  rationale: נֶסֶךְ பலியுடன் ஊற்றிச் செலுத்தப்படும் திரவப் படையலைக் குறிக்கிறது; ‘பானபலி’ சுருக்கமான ஆசாரச் சொல்லாகும்.
- source_word: כַּמִּשְׁפָּט
  choice: முறைப்படி
  rationale: இங்கு מִשְׁפָּט ஏற்கெனவே விதிக்கப்பட்ட பலிச் செயல்முறையைக் குறிக்கிறது; ‘முறைப்படி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ஓர் ஆண் வெள்ளாடு
  rationale: שְׂעִיר עִזִּים என்பது வெறுமனே ஆடு அல்ல, குறிப்பாக ஆண் வெள்ளாட்டைக் குறிக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: חַטָּאת பாவத்துடன் தொடர்புடைய பலியையும் அதன் சுத்திகரிப்பு விளைவையும் குறிக்கக்கூடும்; ‘பாவநிவாரணப் பலி’ பாவத் தொடர்பைத் தெளிவாக வைத்திருக்கிறது, மாற்று ஆசார நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஆசாரச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இந்த எபிரேயச் சொல் பாவத்துக்குரிய பலி என்ற தொடர்பையும் சடங்கின் தூய்மைப்படுத்தும் விளைவையும் தாங்கக்கூடும். முதன்மை உரை பரிச்சயமான பாவத் தொடர்பைக் காக்கிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே உள்ளது; எனவே அது தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆசாரச் சொற்களான ‘தகனபலி’, ‘தானியபலி’, ‘பானபலி’, ‘பாவநிவாரணப் பலி’ ஆகியவை தெளிவும் தொடர்ச்சியும் கருதி பயன்படுத்தப்பட்டுள்ளன; நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
