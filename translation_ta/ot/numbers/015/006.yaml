revisions:
- from: அல்லது, ஓர் ஆட்டுக்கடாவுக்காக இரண்டு பத்தில் பங்கு எப்பா அளவு[a] நுண்ணிய மாவை மூன்றில் ஒரு பங்கு ஹின் எண்ணெயுடன் கலந்து, தானியக் காணிக்கையாகப் படைக்க வேண்டும்.
  to: அல்லது, ஓர் ஆட்டுக்கடாவுக்காக, எப்பாவில் இரண்டு பத்தில் பங்கு நுண்ணிய மாவைக் கொண்டு, மூன்றில் ஒரு பங்கு ஹின் எண்ணெயுடன் கலந்து தானியக் காணிக்கையைத் தயாரிக்க வேண்டும்.
  rationale: The revision retains the contextual clarification that the two tenths are of an ephah and preserves the ancient hin measure. It replaces an offering-specific verb with «தயாரிக்க வேண்டும்», which more closely represents the Hebrew instruction to make/prepare the grain offering, and it regularizes the Tamil measure construction. The footnote continues to mark that ‘ephah’ is contextually supplied rather than stated in the verse itself.
