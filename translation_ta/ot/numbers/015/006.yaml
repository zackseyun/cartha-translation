source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: ta
  text: அல்லது, ஓர் ஆட்டுக்கடாவுக்காக, எப்பாவில் இரண்டு பத்தில் பங்கு நுண்ணிய மாவைக் கொண்டு, மூன்றில் ஒரு பங்கு ஹின் எண்ணெயுடன் கலந்து தானியக் காணிக்கையைத் தயாரிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֤וֹ
  choice: அல்லது
  rationale: முந்தைய பலிவகைக்கு மாற்றான அடுத்த நிகழ்வை எளிய இணைப்புச் சொல்லாகக் காட்டுகிறது; எபிரேயத்தில் வெளிப்படையாக இல்லாத நிபந்தனையைச் சேர்க்கவில்லை.
- source_word: לָ/אַ֨יִל֙
  choice: ஓர் ஆட்டுக்கடாவுக்காக
  rationale: אַיִל என்பது ஆட்டுக்கடா; לְ இங்கு அதற்குரிய துணைக் காணிக்கையைச் சுட்டுவதால் ‘-க்காக’ இயல்பானது.
- source_word: תַּעֲשֶׂ֣ה
  choice: படைக்க வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/தயாரி’; பலிச் சடங்குச் சூழலில் காணிக்கையை ஆயத்தப்படுத்திப் படைக்கும் கட்டளையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִנְחָ֔ה
  choice: தானியக் காணிக்கை
  rationale: ஆசாரியச் சட்டச் சூழலில் இது பொதுவான பரிசை அல்ல, மாவு அல்லது தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: סֹ֖לֶת
  choice: நுண்ணிய மாவு
  rationale: சֹלֶת காணிக்கைக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கிறது; தானியத்தின் வகையை மூலச்சொல் வெளிப்படையாகக் குறிப்பிடாததால் ‘கோதுமை’ சேர்க்கப்படவில்லை.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: இரண்டு பத்தில் பங்கு எப்பா அளவு
  rationale: சொல்லுக்கு சொல் ‘இரண்டு பத்தில் பங்குகள்’; பலி அளவீட்டு முறையில் விடுபட்டுள்ள ‘எப்பா’ என்பதைப் புரிதலுக்காக வெளிப்படையாக வழங்கி, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: எண்ணெயுடன் கலந்து
  rationale: செயப்பாட்டு வினையெச்சம் மாவு எண்ணெயோடு கலக்கப்படுவதைச் சொல்கிறது; நவீனத் தமிழில் தெளிவான இயல்பான அமைப்பு.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: மூன்றில் ஒரு பங்கு ஹின்
  rationale: பண்டைய அளவலகான ‘ஹின்’ என்பதை மாற்றுக் கணக்காக மாற்றாமல் பாதுகாத்து, அதன் மூன்றில் ஒரு பகுதியைத் துல்லியமாகக் காட்டுகிறது.
