translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘எப்பா’, ‘ஹின்’ ஆகிய பண்டைய அளவலகுகள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளன; சுருக்கமான எபிரேய அளவுக் கூற்றைத் தெளிவுபடுத்த அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
