  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: ta
  text: நீ யாவேக்கு ஒரு காளையைத் தகனபலியாகவோ, பலியாகவோ, நேர்ச்சையை நிறைவேற்றுவதற்காகவோ[a], சமாதானப் பலியாகவோ[b] செலுத்தும்போது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நேர்ச்சையைச் செலுத்துவதற்காக’ அல்லது ‘நேர்ந்துகொண்டதை நிறைவேற்றுவதற்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரேய மரபுத்தொடர், நேர்ந்துகொண்டதை நடைமுறையில் நிறைவேற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உறவுப் பலியாக’ அல்லது ‘நல்வாழ்வுப் பலியாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: செலுத்தும்போது
  rationale: பலிகளைப் பற்றிய தொடர்ச்சியான நடைமுறை அறிவுறுத்தலில், வாவுடன் வரும் כִּי ஒரு நிகழும் சூழலை அறிமுகப்படுத்துகிறது; தமிழில் ‘...ும்போது’ இயல்பாகவும் நிபந்தனைத் தன்மையை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: תַעֲשֶׂה
  choice: செலுத்து
  rationale: עשה அடிப்படையில் ‘செய்/உண்டாக்கு’ என்றாலும், பலியிடும் சூழலில் ஒரு விலங்கைப் பலியாக அர்ப்பணிக்கும் செயலை ‘செலுத்து’ இயல்பாகக் குறிக்கிறது; ‘பலியிடு’ என மொழிபெயர்த்தால் எபிரேயச் சொல்லைவிடக் குறிப்பானதாகிவிடும்.
- source_word: בֶן בָּקָר
  choice: ஒரு காளை
  rationale: ‘மாட்டினத்தின் மகன்’ என்ற சொற்றொடர் மந்தையிலுள்ள ஓர் ஆண் மாட்டைக் குறிக்கும் வழக்குச் சொல்; வயதைத் தெளிவாகச் சேர்க்காமல் ‘காளை’ என வழங்குவது இயல்பானது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரிக்கப்படும் பலிவகைக்கான நிலையான, சுருக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: אוֹ זָבַח
  choice: அல்லது ஒரு பலி
  rationale: זבח என்பது பரந்த பலிச் சொல்; ‘பலி’ அதன் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: நேர்த்திக்கடனை நிறைவேற்றுவதற்காக
  rationale: இங்கு פלא + נדר என்ற மரபுத்தொடர் ஒருவர் நேர்ந்ததை நடைமுறையில் நிறைவேற்றுவதைக் குறிக்கிறது; தமிழில் ‘நேர்த்திக்கடனை நிறைவேற்று’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אוֹ שְׁלָמִים
  choice: அல்லது சமாதானப் பலியாக
  rationale: שְׁלָמִים என்ற பலிவகைக்கு ‘சமாதானப் பலி’ பழக்கமான பெயர்; சொல்லின் உடனுறவு அல்லது நல்வாழ்வு நுணுக்கங்களை மட்டும் முன்னிறுத்தாமல் மரபுப் பலிவகையை அடையாளப்படுத்துகிறது.
- source_word: לַ/יהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה-வை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகக் காட்டுகிறது; தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறோம்; தமிழ் மொழியில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: எபிரேயச் சொல் சமாதானம், முழுமை, நல்வாழ்வு, உடனுறவு ஆகிய தொடர்புடைய நுணுக்கங்களைக் கொண்டிருக்கலாம். பிரதான உரையில் மரபாக அறியப்படும் வகைப்பெயர் வைக்கப்பட்டு, மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பலியியல் சொற்களுக்கான அறியப்பட்ட வேதாகமச் சொல்வழக்கை அளவோடு பயன்படுத்திய கண்ணியமான நடை. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘நேர்த்திக்கடன்’ சாதாரண வாசகருக்குப் புரியும் வகையில் பயன்படுத்தப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
