lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயரைப் பொதுவாக அறியப்படும் தமிழ்ப் பெயர்ப்பில் நேரடியாகக் கொடுக்கிறது.
- source_word: וַיֹּאמֶר
  choice: கூறியது
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: அடுத்த வசனங்களில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துவதால், தமிழில் தேவையற்ற மறுபடியுரையைத் தவிர்த்து முக்காற்புள்ளியால் அதன் செயல்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய பெயர் יהוה
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட பெயரையும் 'ஆண்டவர்' என்ற பட்டத்தையும் வேறுபடுத்திக் காட்டுகிறது; தனிப்பட்ட சமயக் கோட்பாடு எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, இயல்பான தமிழ். இது அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்தும் முழுமையற்ற உரை என்பதால் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
