  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: ta
  text: இஸ்ரவேலருள் பிறந்தவருக்கும், அவர்களிடையே குடியிருக்கும் பிறநாட்டவருக்கும், அறியாமல் செய்கிறவருக்காக உங்களுக்கென ஒரே சட்டம் இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலரில் பிறப்பால் குடிமகனானவர்
  rationale: இச்சொற்றொடர் இஸ்ரவேல் சமூகத்தின் பிறப்புவழி உறுப்பினரைச் சுட்டுகிறது; நவீன தமிழில் அவரது சட்ட-சமூக நிலையைக் தெளிவாகக் கூறுகிறது.
- source_word: וְלַגֵּר
  choice: குடியிருக்கும் அந்நியர்
  rationale: இங்கு גֵּר வழிப்போக்கரை அல்ல, இஸ்ரவேல் சமூகத்துக்குள் தங்கி வாழும் பிறநாட்டவரைக் குறிக்கிறது.
- source_word: הַגָּר בְּתוֹכָם
  choice: உங்களிடையே குடியிருக்கும்
  rationale: எபிரெயப் பங்கேற்புவினை நிலையான வசிப்பைக் குறிக்கிறது; לָכֶם என்பதிலுள்ள நேரடி இரண்டாம் நபர் உரையையும் தமிழ் இயல்பாகத் தக்கவைக்கிறது.
- source_word: תּוֹרָה אַחַת
  choice: ஒரே சட்டம்
  rationale: இரு குழுவினருக்கும் ஒரே சட்டவிதி பொருந்துவதைக் கூறுகிறது; 'ஒரே சட்டம்' என்பது அதன் சமமான பயன்பாட்டை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: பொருந்தும்
  rationale: சட்டச் சூழலில் ஒரு விதி சம்பந்தப்பட்டவர்களுக்குப் பயன்படுவதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: அறியாமல் செய்கிறபோது
  rationale: בִּשְׁגָגָה திட்டமிடாத அல்லது அறியாமையால் நிகழ்ந்த செயலைக் குறிக்கிறது; இத்தொடர் அதனைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: அறியாமல் செய்யப்பட்ட செயல்களில் பிறப்புவழி இஸ்ரவேலருக்கும் குடியிருக்கும் அந்நியருக்கும் சட்டம் சமமாகப் பொருந்தும் எல்லை
  choice: இரு குழுவினருக்கும் அறியாமல் செய்யப்படும் செயலைப் பொறுத்தவரை ஒரே சட்டம் பொருந்துகிறது என்று மொழிபெயர்க்கப்பட்டது.
  alternative: תּוֹרָה אַחַת என்பதை 'ஒரே போதனை' அல்லது 'ஒரே நியமம்' என்றும் மொழிபெயர்க்கலாம்.
  rationale: எபிரெய உரை உடனடியான சட்டச் சூழலில் இரு குழுக்களுக்கும் ஒரே விதி பொருந்துவதை வலியுறுத்துகிறது; இதற்கு அப்பாற்பட்ட விரிவான இறையியல் கூற்றை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் கருத்து வரிசையை இயல்பான தமிழுக்கேற்ப மாற்றியிருந்தாலும், இரு சமூகக் குழுக்கள், ஒரே சட்டம், அறியாமல் செய்தல் ஆகிய கூறுகள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன.
