  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: ta
  text: யாவே மோசே மூலம் உங்களுக்குக் கட்டளையிட்ட அனைத்தையும்—யாவே கட்டளையிட்ட நாளிலிருந்து, உங்கள் தலைமுறைகள்தோறும் தொடர்ந்து—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: אֵת குறிக்கும் நேரடிச் செயப்படுபொருளையும் כָּל אֲשֶׁר என்பதன் முழுமையையும் இயல்பான தமிழில் தருகிறது; வாக்கியம் முந்தைய வசனத்துடன் தொடர்வதால் செயப்படுபொருள் உருபு காக்கப்பட்டுள்ளது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: நிறைவேற்றப்பட்ட கட்டளைச் செயலைவும், அதன் தொடர்ந்த பொருத்தத்தையும் தெளிவாகக் காட்டுகிறது. எபிரேயத்தில் இருமுறை வரும் ஒரே வினைச்சொல்லும் தமிழில் ஒரே சொல்லால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲלֵיכֶם
  choice: உங்களுக்கு
  rationale: கட்டளைகள் யாரை நோக்கிக் கொடுக்கப்பட்டன என்பதைத் தமிழில் இயல்பாகவும் வெளிப்படையாகவும் தருகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘மோசேயின் கையால்’ என்றாலும், இங்கு בְּיַד நடுநிலையாளர் அல்லது வழிமுறையைக் குறிக்கும் மரபுத்தொடர்; ‘மூலம்’ அதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: நாள்முதல்
  rationale: கட்டளைகள் வழங்கப்பட்ட காலத்தின் தொடக்கப் புள்ளியைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וָהָלְאָה
  choice: தொடர்ந்து
  rationale: குறிப்பிட்ட நாளிலிருந்து முன்னோக்கித் தொடர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் முழுவதிலும் தொடரும் பொருந்துதலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּיַד מֹשֶׁה என்பதில் மோசேயின் பங்கு
  choice: மோசேயின் மூலம்
  alternative: மோசேயின் கையால்
  rationale: இத்தொடர் மோசே கட்டளைகளின் மூலாதாரம் என்று சொல்லாமல், யாவேயின் கட்டளைகளை எடுத்துரைத்த நடுநிலையாளர் என்பதைச் சுட்டுகிறது; மரபுத்தொடரின் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்திலிருந்து தொடரும் சார்பு வாக்கியத் துணுக்கு என்பதால் ‘அனைத்தையும்’ என்ற செயப்படுபொருள் வடிவமும் இறுதியிலுள்ள நீண்ட கோடும் காக்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் ‘கட்டளையிட்ட’ என்பதும் மாறுபடுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
