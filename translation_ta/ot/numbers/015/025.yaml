  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: ta
  text: ஆசாரியன் இஸ்ரவேல் மக்களின் முழுச் சபைக்காகப் பாவநிவிர்த்தி செய்வான்; அவர்கள் மன்னிக்கப்படுவார்கள். ஏனெனில் அது தவறுதலாக நிகழ்ந்தது; மேலும் அவர்கள் தங்கள் தவறுதலுக்காக யாவேக்கு நெருப்பில் செலுத்தும் பலியான தங்கள் காணிக்கையையும், யாவே முன்னிலையில் தங்கள் பாவப்பரிகாரப் பலியையும்[a] கொண்டுவந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” பலிசார் சூழல்களில் இங்கு “பாவப்பரிகாரப் பலி” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் தூய்மைப்படுத்துவதற்கான பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பதன் பியேல் வடிவம் பலிசார் சூழலில் பாவத்திற்கான நிவிர்த்தியை ஏற்படுத்துவதைக் குறிக்கிறது; தமிழ் வாசகர்களுக்கு தெளிவான, வழக்கிலுள்ள சமயச் சொற்றொடர் இது.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபை முழுவதற்காகவும்
  rationale: עַל இங்கு ‘சார்பாக/நிமித்தமாக’ என்ற பொருளையும், עֲדָה முழுச் சமூகத்தையும் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதை இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்று வழங்குகிறது.
- source_word: וְנִסְלַח לָהֶם
  choice: அப்போது அவர்கள் மன்னிக்கப்படுவார்கள்
  rationale: எபிரெயச் செயலற்ற வினையின் பொருளைப் பேணுகிறது; மன்னிப்பவரை மூலத்தில் இல்லாதவாறு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: כִּי שְׁגָגָה הִוא
  choice: ஏனெனில் அது தவறுதலாகச் செய்யப்பட்டதாகும்
  rationale: שְׁגָגָה குறிக்கும் அறியாமை அல்லது நோக்கமின்மையைப் பேணுகிறது; வெறும் சாதாரணப் பிழை என்று அதன் அறநெறி மற்றும் பலிசார் பரிமாணத்தைச் சுருக்கவில்லை.
- source_word: אֶת קָרְבָּנָם אִשֶּׁה לַיהוָה
  choice: யாவேக்கு நெருப்பில் செலுத்தும் பலியாகத் தங்கள் காணிக்கையை
  rationale: קָרְבָּן என்பதற்கு ‘காணிக்கை’ என்றும், אִשֶּׁה என்பதன் நெருப்புடன் தொடர்புடைய பலிசார் பொருளை வெளிப்படையாகவும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְחַטָּאתָם
  choice: தங்கள் பாவப்பரிகாரப் பலி
  rationale: இங்கு கொண்டு வரப்படும் ஒரு பலியைச் சுட்டுவதால் חַטָּאת என்பதன் பலிசார் பொருள் தேவைப்படுகிறது; ‘பாவப்பரிகாரப் பலி’ இயல்பான தமிழில் அதன் செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: עַל שִׁגְגָתָם
  choice: தங்கள் தவறுதலுக்காக
  rationale: முன்னர் வந்த שְׁגָגָה என்பதன் அதே மூலச்சொல் மீண்டும் வருவதை ‘தவறுதல்’ என்ற சொல்லால் தொடர்ச்சியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைபெயரையே பயன்படுத்துகிறது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பேணுகிறது.
- issue: חַטָּאת என்பதன் பலிசார் பொருள்
  choice: பாவப்பரிகாரப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: சொல் இங்கு மக்கள் கொண்டுவரும் பலியைக் குறிக்கிறது. ‘தூய்மைப்படுத்தும் பலி’ என்பதும் சாத்தியமான ஆய்வுசார் விளக்கம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்ட மற்றும் பலிசார் கண்ணியமான நடை. நீண்ட எபிரெய வாக்கியத்தின் காரணத் தொடர்பைப் பேணிக்கொண்டே, தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
