translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியமாக இருப்பதால் இறுதியில் முற்றுப்புள்ளி இடப்படவில்லை; திறந்த மேற்கோளும் காற்புள்ளியும் வைக்கப்பட்டுள்ளன.
