  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בְּ/בֹֽאֲ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְ/כֶ֖ם שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம்[a] பேசு; அவர்களிடம் சொல்: “நான் உங்களைக் கொண்டுவரும் நாட்டிற்குள் நீங்கள் வரும்போது,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்”; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: பியேல் கட்டளை வடிவம் மோசே இஸ்ரவேல் மக்களுக்கு இறைச்செய்தியை நேரடியாக அறிவிக்க வேண்டும் என்பதைக் குறிக்கிறது; தொடரும் ‘சொல்’ என்பதுடன் இயல்பாக அமைய ‘பேசி’ பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் இந்த உடன்படிக்கைச் சூழலிலுள்ள வழக்கமான அழைப்பு மொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் தவறாக ஆண்களுக்கு மட்டும் வரையறுக்காமலும் இருக்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: ‘பேசு … சொல்’ என்ற மூலமொழியின் தொடர்ச்சியான கட்டளை அமைப்பைப் பேணுகிறது.
- source_word: בְּבֹאֲכֶם
  choice: நீங்கள் வரும்போது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்சப் பெயர் காலப்பொருளில் ‘நீங்கள் வரும்போது’ எனப் பொருள்படுகிறது.
- source_word: אֶל הָאָרֶץ
  choice: நாட்டிற்குள்
  rationale: בוא உடன் வரும் אֶל வெறும் திசையை அல்ல, நாட்டிற்குள் நுழைவதைக் குறிக்கிறது; ஆகவே ‘நாட்டிற்குள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: நான் உங்களைக் கொண்டுவரும்
  rationale: מֵבִיא என்ற வினையெச்ச வடிவம் நிகழவிருக்கும் இறைச் செயலை உயிரோட்டமாகக் காட்டுகிறது. שָׁמָּה (‘அங்கே’) என்பதன் இடப்பொருள் தமிழில் ‘நாட்டிற்குள்’ என்பதிலேயே வெளிப்படுவதால் தேவையற்ற மறுகூறல் தவிர்க்கப்பட்டது.
