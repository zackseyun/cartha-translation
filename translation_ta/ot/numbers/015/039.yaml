base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: ta
  text: அது உங்களுக்கு ஒரு நூற்குஞ்சமாக[a] இருக்கும். நீங்கள் அதைப் பார்க்கும்போது, யாவேயின் கட்டளைகள் அனைத்தையும் நினைவுகூர்ந்து அவற்றைக் கடைப்பிடியுங்கள். உங்கள் இதயத்தையும் உங்கள் கண்களையும் பின்தொடர்ந்து அலைந்து திரியாதீர்கள்[b]; அவற்றின் பின்னால் நீங்கள் வேசித்தனத்தில் ஈடுபடுகிறீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆடை ஓரத்தின் தொங்கல்.’ எபிரெயச் சொல் ஆடையின் ஓரத்தில் இணைக்கப்பட்ட நூற்குஞ்சத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் இதயத்தையும் உங்கள் கண்களையும் பின்தொடராதீர்கள்.’ எபிரெய வினைச்சொல் அவற்றைத் தேடி அல்லது ஆராய்ந்து அலைதலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயத்தில் பாலியல் துரோகத்தின் உருவகம் பயன்படுத்தப்படுகிறது; இது உடன்படிக்கைக்கு உண்மையற்றிருப்பதைக் குறிக்கிறது. மென்மையான மாற்று: ‘அவற்றின் பின்னால் வழிதவறிச் செல்கிறீர்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: குஞ்சம்
  rationale: ஆடையின் ஓரத்தில் கட்டப்படும் தொங்கும் நூற்குஞ்சத்தைக் குறிக்கிறது. தமிழில் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; மாற்றுச் சொல்லை அடிக்குறிப்பு தருகிறது.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: நீங்கள் அதைப் பார்க்கும்போது
  rationale: 'எபிரெய இணைப்பின் தொடர்விளைவை இயல்பான தமிழில் காலநிலைத் தொடராகத் தருகிறது: அதைப் பார்ப்பது நினைவுகூரத் தூண்டுகிறது.'
- source_word: מִצְוֺת יְהוָה
  choice: யாவேயின் கட்டளைகள்
  rationale: מִצְוֺת என்பதின் உடன்படிக்கை சார்ந்த கட்டளை வலிமையையும் יהוה என்ற இறைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றைக் கடைப்பிடிக்க வேண்டும்
  rationale: கட்டளைகளை 'செய்தல்' என்ற எபிரெய வழக்கின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָתֻרוּ אַחֲרֵי
  choice: பின்னால் அலைந்து திரியாதீர்கள்
  rationale: תור என்பதிலுள்ள தேடி அலைதல் அல்லது பின்தொடர்தல் என்ற உயிரோட்டத்தை வெறும் 'பின்பற்றுதல்' என்று தட்டையாக்காமல் காக்கிறது.
- source_word: לְבַבְכֶם
  choice: உங்கள் இதயம்
  rationale: உணர்ச்சியை மட்டுமல்லாமல் உள்ளார்ந்த விருப்பம், சிந்தனை, நோக்கம் ஆகியவற்றையும் உள்ளடக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: அவற்றின் பின்னால் நீங்கள் வேசித்தனம் செய்கிறீர்கள்
  rationale: பாலியல் துரோகத்தின் கடுமையான உருவகத்தை மென்மையாக்காமல், இதயத்தையும் கண்களையும் பின்பற்றுவதோடு இலக்கணத் தொடர்பை வைத்திருக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: זנה என்பதிலுள்ள உடன்படிக்கைத் துரோக உருவகத்தின் வலிமை
  choice: வேசித்தனம் செய்கிறீர்கள்
  alternative: வழிதவறிச் செல்கிறீர்கள்
  rationale: மூலத்தின் பாலியல் துரோக உருவகத்தையும் அதன் அதிர்ச்சியூட்டும் வலிமையையும் காக்கிறது; பொதுவான 'வழிதவறுதல்' என்று மென்மையாக்கவில்லை.
- issue: இதயம் மற்றும் கண்களைப் பின்தொடர்வதன் பொருள்
  choice: சொற்சித்திரத்தைப் பாதுகாத்தல்
  alternative: உங்கள் ஆசைகளுக்கு இணங்காதீர்கள்
  rationale: இதயம், கண்கள் என்ற எபிரெய மனிதவியல் உருவகங்களை விளக்கவுரையாக மாற்றாமல் வைத்ததால் அவற்றின் உண்மையான பரப்பும் பதற்றமும் நீடிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைநடை இயல்பாக இருக்க ‘வேண்டும்/அலைந்து திரியாதீர்கள்’ அமைப்பு தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் கடுமையான இறுதி உருவகம் திட்டமிட்டு மென்மையாக்கப்படவில்லை.
