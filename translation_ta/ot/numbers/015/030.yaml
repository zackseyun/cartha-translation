source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: ta
  text: ஆனால், உள்நாட்டில் பிறந்தவராயினும் குடியேறிய அந்நியராயினும், எவர் துணிகரமாக[a] நடந்துகொள்கிறாரோ அவர் யாவேவை இகழ்கிறார்; அந்த நபர் தம் மக்களின் நடுவிலிருந்து அறுத்துப்போடப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறுமாப்புடன்” அல்லது “வெளிப்படையாக எதிர்த்து”; சொல்லர்த்தமாக, “உயர்ந்த கையுடன்.”
    reason: எபிரெய மொழிமரபின் சொல்லர்த்தத்தையும் அதன் முக்கிய பொருள் மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: எவர் / அந்த நபர்
  rationale: சட்டப் பின்னணியில் נֶפֶשׁ முழு நபரைக் குறிக்கிறது; ‘ஆத்துமா’ என்பதைவிட இவ்வமைப்பு இயல்பாகவும் பொருளுக்கேற்றதாகவும் உள்ளது.
- source_word: תַּעֲשֶׂה
  choice: நடந்துகொள்கிறாரோ
  rationale: עשה என்பது பொதுவாக ‘செய்’ என்பதாக இருந்தாலும், இங்கு துணிகரமான செயல் அல்லது நடத்தையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; குற்றத்தை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: בְּיָד רָמָה
  choice: துணிகரமாக[a]
  rationale: சொல்லர்த்தமான ‘உயர்த்திய கையுடன்’ என்ற எபிரெய மொழிமரபு வெளிப்படையான எதிர்ப்பையும் செருக்கான துணிவையும் குறிக்கிறது. தமிழில் ‘துணிகரமாக’ அதன் சூழற்பொருளை தெளிவாக வழங்குகிறது; சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָאֶזְרָח
  choice: உள்நாட்டில் பிறந்தவர்
  rationale: சமூகத்தினுள் பிறந்த இஸ்ரவேலரை, குடியேறிய அந்நியருக்கு எதிர்நிலையில் தெளிவாகக் குறிக்கிறது.
- source_word: הַגֵּר
  choice: குடியேறிய அந்நியர்
  rationale: இஸ்ரவேல் சமூகத்தில் தங்கி அதன் சட்டத்திற்கும் பாதுகாப்பிற்கும் உட்பட்ட பிறநாட்டவரைக் குறிக்கிறது; வெறும் ‘அந்நியர்’ என்பதைவிட சட்ட-சமூக நுணுக்கத்தைத் தருகிறது.
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: அவர் யாவேவை அவமதிக்கிறார்
  rationale: גדף என்பது தேவனை இகழ்தல் அல்லது அவருக்கு எதிராக அவமதிப்புடன் நடப்பதைக் குறிக்கிறது. ‘அவமதிக்கிறார்’ என்பது பேச்சுக்கும் செயலுக்கும் இடமளித்து, வசனம் கூறுவதைக் காட்டிலும் குறுகலாக்காது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ திட்டத்தின் வழக்கத்தின்படி பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: וְנִכְרְתָה
  choice: அறுத்துப்போடப்பட வேண்டும்
  rationale: உடன்படிக்கை மற்றும் சட்ட மொழியில் உள்ள כרת நிபால் வடிவின் கடுமையான நீக்கம் அல்லது தீர்ப்பைத் தக்கவைக்கிறது; அது மரணதண்டனையா, சமூக விலக்கா, தெய்வீகத் தீர்ப்பா என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: தம் மக்களின் நடுவிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்தின் மத்தியிலிருந்து நீக்கப்படுதலை வெளிப்படுத்துகிறது. ‘தம்’ பாலினத்தைத் தேவையின்றி வரையறுக்காமல் இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: குற்றத்தின் தன்மையும் தண்டனையின் வடிவமும்
  choice: வெளிப்படையான, துணிகர எதிர்ப்பையும் குற்றவாளி மக்களின் நடுவிலிருந்து ‘அறுத்துப்போடப்படுவார்’ என்பதையும் மொழிபெயர்ப்பு தெரிவிக்கிறது; தண்டனையின் நடைமுறை வடிவத்தைத் தீர்மானிக்கவில்லை.
  alternative: இதைத் திட்டமிட்ட பாவம் என்று மட்டும் குறிப்பாக்குதல்; அல்லது ‘அறுத்துப்போடுதல்’ என்பதை மரணதண்டனை அல்லது சமூக விலக்கு என்று தீர்மானித்தல்.
  rationale: எபிரெய மொழிமரபும் சட்டச் சூத்திரமும் வலிமையானவை; ஆனால் இவ்வசனம் தண்டனையின் துல்லியமான வடிவத்தை விளக்கவில்லை. எனவே அதன் இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப்பூர்வமான கண்ணியத்துடன், பொதுவாசகருக்குப் புரியும் இயல்பான நடை. ‘அறுத்துப்போடப்பட வேண்டும்’ என்ற வலுவான உடன்படிக்கை மொழி நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது.
