  source_fidelity: மொத்தத்தில் எபிரெயச் சட்டநடையையும் முக்கியமான தெளிவின்மைகளையும் வரைவு நன்றாகக் காக்கிறது. ஆனால் מְגַדֵּף என்பதன் இகழ்ச்சி/நிந்தனை வலிமையை ‘அவமதிக்கிறார்’ ஓரளவு மென்மையாக்குகிறது; ‘இகழ்கிறார்’ நேரடியானது. மேலும் וְנִכְרְתָה-வின் விளைவு அறிவிப்பை ‘அறுத்துப்போடப்படுவார்’ என வழங்குவது, ‘வேண்டும்’ என்ற கட்டளை நிழலின்றி மூலத்தின் சட்டத் தீர்ப்பு அறிவிப்பைச் சிறப்பாகப் பிரதிபலிக்கிறது.
  naturalness: திருத்தப்பட்ட நடை நவீன நிலையான தமிழில் இயல்பாகவும் சட்டப்பூர்வமான கண்ணியத்துடனும் உள்ளது. ‘தம் மக்களின் நடுவிலிருந்து’ என்பதற்குப் பதில் ‘தம் மக்களின் நடுவிலிருந்து’ தக்கதே; பாலினத்தைச் சுட்டாமல் மூலத்தின் உடன்படிக்கைச் சமூகக் குறிப்பைத் தக்கவைக்கிறது.
  terminology: ‘யாவே’, ‘குடியேறிய அந்நியர்’, மற்றும் ‘அறுத்துப்போடப்படுவார்’ ஆகியவை சொற்களஞ்சியத்திற்கும் வசனத்தின் சட்ட-இறையியல் பதிவுக்கும் ஏற்றவை. ‘துணிகரமாக’ என்பதற்கு அடிக்குறிப்பு சொல்லர்த்தத்தையும் மாற்றுப் பொருள்களையும் போதுமானவாறு வழங்குகிறது.
