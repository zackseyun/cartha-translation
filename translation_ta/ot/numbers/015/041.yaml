base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: ta
  text: உங்கள் கடவுளாக இருப்பதற்காக எகிப்து நாட்டிலிருந்து உங்களை வெளியே கொண்டுவந்த உங்கள் கடவுளாகிய யாவே நானே. உங்கள் கடவுளாகிய யாவே நானே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய ஒலிப்புக்கு ஏற்ற தமிழாக்கமாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இச்சூழலில் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளையும் உடன்படிக்கை உறவையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם
  choice: உங்களை வெளியே கொண்டுவந்த
  rationale: ஹிஃபில் வினை வடிவத்தின் காரணவினைப் பொருளான ‘வெளியே கொண்டுவருதல்’ என்பதைக் காத்து, தமிழில் இயல்பான தொடர்பெயர் தொடராக அமைக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்திலிருந்து’ என்று சுருக்காமல், மூலத்திலுள்ள ‘நாடு’ என்ற கூறைப் பாதுகாக்கிறது.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: உங்கள் கடவுளாக இருப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் לִ־ அமைப்பையும் உடன்படிக்கை உறவையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲנִי
  choice: நானே
  rationale: வினையற்ற எபிரெய வாக்கியத்தின் அடையாள வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים என்ற உடன்படிக்கைச் சொற்றொடர்
  choice: உங்கள் கடவுளாக இருப்பதற்காக
  alternative: உங்களுக்குக் கடவுளாக இருப்பதற்காக
  rationale: இரண்டு தமிழாக்கங்களும் சாத்தியம்; தேர்ந்த வடிவம் உரிமை மற்றும் உறவை இயல்பாக வெளிப்படுத்துவதோடு மூலத்தின் நோக்கப் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். எபிரெய உரையின் மீளுரையும் உடன்படிக்கைத் தொனியும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை.
