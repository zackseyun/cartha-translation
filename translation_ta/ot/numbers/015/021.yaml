  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: ta
  text: உங்கள் மாவின் முதல் பகுதியிலிருந்து யாவேக்கு ஒரு காணிக்கையைக் தலைமுறைதோறும் கொடுக்க வேண்டும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் மாவு பிசையும் பாத்திரங்களின் முதல் பகுதியிலிருந்து”; எபிரெயச் சொல் மாவையோ, அதனுடன் தொடர்புடைய மாவு பிசையும் பாத்திரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒதுக்கப்பட்ட ஒரு பங்கை”; பாரம்பரியமாக, “உயர்த்தப்படும் காணிக்கையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: முதல் பகுதியிலிருந்து
  rationale: רֵאשִׁית இங்கு காலத் தொடக்கத்தைக் குறிக்காமல், மாவிலிருந்து முதலில் பிரித்தெடுக்கப்படும் பகுதியைக் குறிக்கிறது; ‘முதல் பகுதியிலிருந்து’ என்பது அதன் பகுதிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲרִסֹתֵיכֶם
  choice: உங்கள் மாவின்
  rationale: עֲרִסָה என்பது மாவையோ, தொடர்புப்பெயராக மாவு பிசையும் பாத்திரத்தையோ குறிக்கலாம். காணிக்கையாகப் பிரித்தெடுக்கப்படுவது மாவின் ஒரு பகுதி என்பதால், முதன்மை உரையில் ‘மாவு’ இயல்பான தேர்வாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תִּתְּנוּ
  choice: கொடுக்க வேண்டும்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடு.’ கட்டளையின் வலிமையை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘கொடுக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய உரையில் உள்ள உடன்படிக்கைப் பெயரான יהוה, பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תְּרוּמָה
  choice: ஒரு காணிக்கையை
  rationale: תְּרוּמָה என்பது யாவேக்கெனப் பிரித்தெடுத்துக் கொடுக்கப்படும் பங்கைக் குறிக்கிறது. ‘காணிக்கை’ நவீன தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது; சொல்லின் நுட்பமான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: இந்தச் சொற்றொடர் அடுத்தடுத்த தலைமுறைகள் அனைத்திலும் தொடரும் கடமையைக் குறிக்கிறது. ‘தலைமுறைதோறும்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அந்தப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குவது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கட்டளைத் தன்மை பாதுகாக்கப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றுவதால் தமிழில் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்க்க, தலைமுறைகளைக் குறிக்கும் இறுதிச் சொற்றொடர் தனி வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது.
