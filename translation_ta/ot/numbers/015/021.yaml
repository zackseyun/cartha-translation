revisions:
- from: உங்கள் மாவின் முதல் பகுதியிலிருந்து யாவேக்கு ஒரு காணிக்கையைக் கொடுக்க வேண்டும்[a][b]. தலைமுறைதோறும் இதைச் செய்ய வேண்டும்.
  to: உங்கள் மாவின் முதல் பகுதியிலிருந்து யாவேக்கு ஒரு காணிக்கையைக் தலைமுறைதோறும் கொடுக்க வேண்டும்[a][b].
  rationale: The revision preserves the source’s single command and its duration phrase without adding “இதையைச் செய்ய வேண்டும்.” It also corrects the scope of the lexical alternative in footnote a and gives a clearer traditional alternative for תרומה in footnote b. The divine name is retained as “யாவே,” consistent with the source and supplied translation policy.
