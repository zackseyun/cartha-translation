source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: ta
  text: நீங்கள் அந்த நாட்டின் அப்பத்தைச் சாப்பிடும்போது, யாவேக்கு ஒரு காணிக்கையைப் படைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “ஒரு காணிக்கையை உயர்த்த வேண்டும்” என்று உள்ளது; இது காணிக்கையை அர்ப்பணிப்பதற்கான வழிபாட்டுச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: நீங்கள் ... சாப்பிடும்போது
  rationale: היה உடன் வரும் ב־ முன்னொட்டுடைய வினையெச்சக் கட்டமைப்பு எதிர்காலச் சூழலைக் குறிக்கிறது. தமிழில் ‘சாப்பிடும்போது’ என்பது அதன் காலப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: அந்த நாட்டின் அப்பத்தை
  rationale: מן இங்கு பகுதி/மூலப் பொருளைக் கொண்டுள்ளது. தமிழில் ‘அந்த நாட்டின் அப்பத்தைச் சாப்பிடுதல்’ என்பது அந்நாட்டில் விளைந்த தானியத்தால் செய்யப்பட்ட உணவைச் சாப்பிடுவதை இயல்பாகக் குறிக்கிறது; முந்தைய சூழலில் குறிப்பிடப்பட்ட நாட்டை ‘அந்த நாடு’ சுட்டுகிறது.
- source_word: תָּרִימוּ תְרוּמָה
  choice: ஒரு காணிக்கையைப் படைக்க வேண்டும்
  rationale: רום என்பதன் ஹிஃபில் வடிவமும் תרומה என்பதும் வழிபாட்டுச் சூழலில் கடவுளுக்காகப் பிரித்தெடுத்து அளிக்கும் காணிக்கையைக் குறிக்கின்றன. சொல்லுக்கு சொல் ‘உயர்த்துதல்’ என்பதைவிட ‘காணிக்கையைப் படைத்தல்’ நவீனத் தமிழில் இயல்பாகவும் வழிபாட்டுப் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל அர்ப்பணிப்பின் பெறுநரைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரான יהוה நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் அந்தப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: תָּרִימוּ תְרוּמָה என்ற வழிபாட்டுச் சொற்றொடர்
  choice: ஒரு காணிக்கையைப் படைக்க வேண்டும்
  alternative: ஒரு காணிக்கையை உயர்த்த வேண்டும்
  rationale: இது சாதாரணமாக ஒன்றை மேலே தூக்குவதை மட்டும் குறிக்காமல், கடவுளுக்காக ஒரு பங்கைப் பிரித்து முறையாக அளிப்பதைக் குறிக்கும் வழிபாட்டு மொழி. முதன்மை உரை இயல்பான பொருளைத் தருகிறது; சொற்சார்ந்த உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அப்பம்’ மூலத்தின் לֶחֶם சொல்லைப் பாதுகாக்கிறது; ‘காணிக்கை படைத்தல்’ வழிபாட்டுச் சூழலை இயல்பாக எடுத்துரைக்கிறது.
