translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான இணைப்புகளைத் தமிழில் இயல்பாக அமைத்து, மோசே, ஆரோன், சபையார் ஆகிய மூன்று இலக்குகளையும் தனித்தனியாகக் காட்டும் ‘-இடமும்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
