  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: ta
  text: விறகு சேகரித்துக்கொண்டிருந்த அவனைக் கண்டவர்கள், அவனை மோசேயிடமும் ஆரோனிடமும் முழுச் சபையிடமும் கொண்டுவந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குச்சிகளைச் சேகரித்துக்கொண்டிருந்த.’ எபிரெயச் சொல்லான עֵצִים பொதுவாக விறகையோ, குச்சிகள் போன்ற மரத்துண்டுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: அவனைக் கொண்டுவந்தார்கள்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ஒருவரை அருகில் கொண்டுவருதல் அல்லது முன்னிலைப்படுத்துதல் என்ற பொருளைக் கொண்டது. தமிழில் இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் அமைய ‘அவனைக் கொண்டுவந்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: அவனைக் கண்டவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினை, அவனைக் கண்டுபிடித்தவர்களைக் குறிக்கிறது. ‘அவனைக் கண்டவர்கள்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: விறகு சேகரித்துக்கொண்டிருந்த
  rationale: பங்கேற்புவினை, அவன் கண்டுபிடிக்கப்பட்டபோது தொடர்ந்து செய்துகொண்டிருந்த செயலைக் காட்டுகிறது. עֵצִים என்பது பொதுவாக மரம் அல்லது விறகுத் துண்டுகள்/குச்சிகளைக் குறிக்கலாம்; இச்சூழலில் ‘விறகு’ இயல்பாக உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: மோசேயிடமும் ஆரோனிடமும் சபையார் அனைவரிடமும்
  rationale: மீண்டும் மீண்டும் வரும் אֶל என்பதன் ‘இடம்/நோக்கி’ என்ற திசைச்சார்ந்த பொருளை ‘-இடமும்’ என்ற வடிவம் காக்கிறது. כָּל הָעֵדָה என்பது கூடியிருக்கும் உடன்படிக்கைச் சமூகத்தை முழுமையாகக் குறிக்கிறது; ‘சபையார் அனைவரும்’ என்பது நவீன வாசகருக்குப் புரியும் மரியாதையான நடை.
