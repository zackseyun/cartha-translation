source:
  edition: WLC
  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: ta
  text: மேலும், பானபலியாக[a] மூன்றில் ஒரு ஹின்[b] திராட்சரசத்தை யாவேக்கு இனிய மணமாக[c] நீ சமர்ப்பிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊற்றப்படும் காணிக்கையாக”; எபிரேயச் சொல் பலியுடன் சேர்த்து ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ஹின் என்பது பண்டைய காலத் திரவ அளவின் அலகு.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மனநிறைவு தரும் மணமாக” அல்லது “நறுமணமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: திராட்சரசத்தை
  rationale: יַיִן என்பதன் வழக்கமான பொருள் திராட்சரசம். தமிழில் இது வெறும் ‘ரசம்’ என்பதைக் காட்டிலும் துல்லியமாக மதுவகையைக் குறிக்கிறது; தொடக்க וְ தொடர்ச்சியைச் சுட்டினாலும், முந்தைய வசனத்தோடு இயல்பாக இணையும் தமிழ் வாக்கியத்தில் தனியாக ‘மேலும்’ சேர்க்கத் தேவையில்லை.
- source_word: לַ/נֶּסֶךְ
  choice: பானபலியாக[a]
  rationale: נֶסֶךְ என்பது பலியோடு சேர்த்து ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது. ‘பானபலி’ சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது; ஊற்றப்படும் தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: שְׁלִשִׁית הַ/הִין
  choice: மூன்றில் ஒரு ஹின்[b]
  rationale: அளவைத் தோராயமாக மாற்றாமல், எபிரேய மூலத்தில் உள்ள பண்டைய ‘ஹின்’ அலகு தக்கவைக்கப்படுகிறது.
- source_word: תַּקְרִיב
  choice: நீ செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச்சூழலில் ‘சமர்ப்பி/செலுத்து’ என்று பொருள்படும். ‘செலுத்த வேண்டும்’ என்பது தமிழ் வழிபாட்டு மொழியில் இயல்பாகவும் கட்டளையின் வலிமையைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய மணமாக[c]
  rationale: இந்த நிலையான பலிச்சொற்றொடர் ஏற்றுக்கொள்ளத்தக்க, மகிழ்வூட்டும் மணத்தைச் சுட்டுகிறது. ‘இனிய மணம்’ இயல்பான நவீன தமிழில் உருவகத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַ/יהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல் வெளிப்படையாகப் பெயர்க்கிறது. ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்படும் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டத்தைப் பயன்படுத்தாமல் பெயராகவே தக்கவைக்கப்படுகிறது. உச்சரிப்பு மறுகட்டமைப்பில் உறுதியின்மை இருப்பதால் தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: רֵיחַ נִיחֹחַ என்ற பலிச்சொற்றொடரின் வலிமை
  choice: இனிய மணமாக
  alternative: மனநிறைவு தரும் மணமாக; நறுமணமாக
  rationale: மூலத்தின் மணம் சார்ந்த உருவகத்தையும் காணிக்கை இறைவனுக்கு உகந்ததாக இருப்பதையும் தக்கவைக்கிறது; உருவகத்தை விளக்கவுரையாக மாற்றி எந்தக் குறிப்பிட்ட கோட்பாட்டையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. எபிரேய வாக்கியத்தின் அளவு, காணிக்கை, மணம், இறைப் பெயர் ஆகிய கூறுகள் தெளிவான தமிழ் சொல் வரிசையில் அமைக்கப்பட்டுள்ளன.
