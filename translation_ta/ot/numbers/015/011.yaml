  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: ta
  text: இவ்வாறே ஒரு காளைக்கு, ஒரு செம்மறியாட்டுக் கடாவுக்கு, அல்லது செம்மறியாட்டு இனத்தைச் சேர்ந்தோ வெள்ளாட்டு இனத்தைச் சேர்ந்தோ ஒரு சிறுகால்நடை ஒன்றுக்கு செய்யப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் שֶׂה செம்மறியாடு அல்லது வெள்ளாடு உள்ளிட்ட சிறுகால்நடை ஒன்றைக் குறிக்கலாம்; தொடர்ந்து வரும் சொற்றொடர் அது செம்மறியாட்டு இனத்தையோ வெள்ளாட்டு இனத்தையோ சேர்ந்தது என்பதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: இவ்வாறே
  rationale: கட்டளைச் சூழலில் கூறப்பட்ட முறையைச் சுட்டும் வினையடை; சட்டநடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கிறது.
- source_word: יֵעָשֶׂה
  choice: செய்யப்பட வேண்டும்
  rationale: עשה என்பதன் நிஃபால் முற்றுப்பெறா வடிவம் தரும் செயப்பாட்டு, விதிமுறை சார்ந்த கட்டளை வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: ஒவ்வொரு காளைக்கும்
  rationale: குறிப்பிட்ட உருபுடன் வரும் ‘ஒன்று’ ஒவ்வொரு தனிப்பட்ட பலிவிலங்குக்கும் விதி பொருந்துவதை உணர்த்துகிறது; தமிழில் ‘ஒவ்வொரு’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலிக்குரிய ஆண் செம்மறியாட்டைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: הָאֶחָד
  choice: ஒவ்வொரு
  rationale: மீண்டும் வரும் எண்ணுப்பெயர் விதி தனித்தனி விலங்கிற்குப் பொருந்துவதை வலியுறுத்துகிறது.
- source_word: שֶׂה
  choice: ஒரு சிறுகால்நடை
  rationale: இந்த எபிரெயச் சொல் செம்மறியாடு அல்லது வெள்ளாடு ஆகிய இரண்டிலும் ஒன்றைக் குறிக்கக்கூடும்; அடுத்த சொற்றொடரின் இருவகை வகைப்பாட்டையும் காக்கப் பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַכְּבָשִׂים
  choice: செம்மறியாடுகளில்
  rationale: ב இங்கு ஓர் இனவகையைச் சேர்ந்திருப்பதைக் குறிக்கிறது.
- source_word: בָעִזִּים
  choice: வெள்ளாடுகளில்
  rationale: முந்தைய வகைப்பாட்டுக்கு இணையாக வெள்ளாட்டு இனத்தைச் சேர்ந்திருப்பதைக் குறிக்கிறது.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: '... அல்லது ... அல்லது ... -ஓ ... -ஓ'
  rationale: பலிவிலங்குகளின் மாற்றுத் தேர்வுகளைத் தரும் தொடர்ச்சியான பிரிப்பமைப்பு, தமிழுக்கு இயல்பான இணைப்புகளால் பாதுகாக்கப்படுகிறது.
