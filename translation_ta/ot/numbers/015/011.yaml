  source_fidelity: மூலத்தின் விதிமுறைத் தொனியும், காளை, செம்மறியாட்டுக் கடா, மற்றும் செம்மறியாடு/வெள்ளாட்டு வகையைச் சேர்ந்த שֶׂה என்ற சிறுகால்நடை ஆகிய வேறுபாடுகளும் பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் «ஒவ்வொரு காளைக்கும், ஒவ்வொரு செம்மறியாட்டுக் கடாவுக்கும்» என்பது மூலத்தில் வரும் தனிப்பட்ட ‘ஒன்று’ என்ற குறிப்பை தமிழில் சற்றே அதிகமாகப் பகிர்வாக்குகிறது; மேலும் இறுதித் தொடரின் இணைப்பமைப்பு இயல்பாகத் தெளிவுபடுத்தப்படலாம்.
  naturalness: «செம்மறியாடுகளிலோ வெள்ளாடுகளிலோ உள்ள ஒரு சிறுகால்நடைக்கும்» புரிந்துகொள்ளக்கூடியதே; ஆனால் «செம்மறியாட்டு இனத்தைச் சேர்ந்தோ வெள்ளாட்டு இனத்தைச் சேர்ந்தோ ஒரு சிறுகால்நடைக்கும்» என்பது வகை/இனச் சார்பைக் கூடுதல் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது. «ஒரு சிறுகால்நடை» என்பதற்குப் பதில் «சிறுகால்நடை ஒன்றுக்கு» தனிவிலங்கைக் குறிக்கும் சூழலில் சீரான நடையாகும்.
  terminology: «காளை», «செம்மறியாட்டுக் கடா», «செம்மறியாடு», «வெள்ளாடு» ஆகிய சொற்கள் பொருத்தமானவை. שֶׂה என்பதன் பரந்த சொற்பொருளை «சிறுகால்நடை» என்றும் அடிக்குறிப்பிலும் காப்பது சரியானது; அதை «ஆட்டுக்குட்டி» எனக் குறுக்க வேண்டாம்.
