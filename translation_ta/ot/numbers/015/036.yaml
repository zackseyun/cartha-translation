source:
  edition: WLC
  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அப்பொழுது சபையினர் அனைவரும் அவனை முகாமுக்கு வெளியே கொண்டு சென்று, அவன்மேல் கற்களை எறிந்தார்கள்; அவன் இறந்தான். யாவே மோசேக்குக் கட்டளையிட்டபடியே இவ்வாறு நடந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה இங்கு ஒன்றுகூடிய இஸ்ரயேல் மக்களைக் குறிக்கிறது; ‘சபையார்’ அதன் கூட்டு அடையாளத்தையும் כָּל என்பதற்கு ‘அனைவரும்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: அவனை ... வெளியே கொண்டுபோய்
  rationale: Hiphil வடிவிலுள்ள יצא என்பது ‘வெளியே கொண்டுபோதல்’ என்று பொருள்படும்; அடுத்துள்ள இலக்கிடச் சொற்றொடருடன் இது இயல்பான தமிழாக அமைகிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இந்தச் சொற்றொடர் முகாமின் எல்லைக்கு அப்பாலுள்ள இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: அவன்மேல் கற்களை எறிந்து கொன்றார்கள்
  rationale: רגם மற்றும் வெளிப்படையாகக் குறிப்பிடப்பட்ட בָּאֲבָנִים ஆகிய இரண்டையும் ‘கற்களை எறிந்து’ பிரதிபலிக்கிறது; தமிழில் செயலும் அதன் மரணத் தண்டனை விளைவும் தெளிவாக இருக்க ‘கொன்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது, அதைத் தொடர்ந்து மூலத்தின் וַיָּמֹת தனியே மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்தான்
  rationale: מות என்பதன் நேரடியான பொருள் ‘இறத்தல்’; நீதித் தண்டனை என்ற கூடுதல் விளக்கத்தை இந்தச் சொல்லுக்குள் புகுத்தாமல் தனியே வழங்கப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר என்பது முந்தைய கட்டளைக்கும் நிகழ்ந்த செயலுக்கும் உள்ள சரியான ஒப்புமையைச் சுட்டுகிறது; יְהוָה உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் அமைக்கப்பட்டது. ‘சபையார் அனைவரும்’ என்பது சமூகத்தின் கூட்டு நடவடிக்கையை வலியுறுத்துகிறது; தேவையற்ற பழந்தமிழ் வினைவடிவங்கள் தவிர்க்கப்பட்டன.
