source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: ta
  text: ஆனால் ஒருவர் அறியாமல் பாவம் செய்தால், அவர் பாவநிவாரணப் பலியாக[a] ஓராண்டு வயதுள்ள பெண் வெள்ளாட்டைக் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல் חַטָּאת பாவத்தையோ அசுத்தத்தையோ நீக்குவதற்கான பலியைக் குறிக்கலாம்; அது பாவத்தை மட்டும் குறிக்கும் சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்தால்
  rationale: முந்தைய சட்டவிதியிலிருந்து தனிநபருக்குரிய மாறுபட்ட நிலைக்கு இச்சொற்றொடர் செல்கிறது; ஆகவே தொடர்ச்சியையும் மென்மையான எதிர்மறைத் திருப்பத்தையும் ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: נֶפֶשׁ אַחַת
  choice: ஒருவர்
  rationale: சட்டச் சூழலில் נֶפֶשׁ என்பது ‘ஆத்துமா’ என்பதைவிட ஒரு நபரைக் குறிக்கிறது. ‘ஒருவர்’ தனிநபர் என்ற ஒருமையை இயல்பான தமிழில் தருகிறது.
- source_word: תֶּחֱטָא
  choice: பாவம் செய்தால்
  rationale: நிபந்தனைச் சட்டவாக்கியத்தில் வரும் எபிரெய வினை வடிவத்தைத் தெளிவான தமிழ் நிபந்தனை வடிவில் வழங்குகிறது.
- source_word: בִשְׁגָגָה
  choice: அறியாமல்
  rationale: வேண்டுமென்றோ துணிகரமாகவோ அல்லாமல் நிகழும் தவறு அல்லது பாவத்தை இச்சொல் குறிக்கிறது; ‘அறியாமல்’ என்பது சாதாரண வாசகருக்குத் தெளிவான இயல்பான சொல்.
- source_word: וְהִקְרִיבָה
  choice: கொண்டுவர வேண்டும்
  rationale: பலிச் சூழலில் קרב என்பதன் ஹிஃபீல் வடிவம் பலியை அருகே கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது. ‘கொண்டுவர வேண்டும்’ சட்டக் கடமையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: עֵז
  choice: பெண் வெள்ளாடு
  rationale: எபிரெயப் பெயர்ச்சொல் பெண்பால் வெள்ளாட்டைக் குறிப்பதால், விலங்கின் பாலினம் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: בַּת שְׁנָתָהּ
  choice: ஓராண்டு வயதுள்ள
  rationale: விலங்கு முதல் ஆண்டில் இருப்பதையோ ஓராண்டு வயதுடையதையோ குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாக வழங்குகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: ஆசாரியச் சட்டங்களில் חַטָּאת என்பது பாவத்தைக் கையாளும் குறிப்பிட்ட பலியைச் சுட்டுகிறது. ‘பாவநிவாரணப் பலி’ அதன் நோக்கத்தையும் பலி என்ற சடங்கு வகையையும் தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தனிநபரைக் குறிக்கும் பெண்பால் இலக்கண வடிவங்கள்
  choice: ‘ஒருவர் ... அவர்’ என்ற பாலினப் பொதுமை வடிவம்
  alternative: பெண் நபரை மட்டும் குறிக்கும் வகையில் ‘ஒருத்தி ... அவள்’ என்று மொழிபெயர்த்தல்
  rationale: נֶפֶשׁ என்பது எபிரெயத்தில் இலக்கணப் பெண்பால் பெயர்ச்சொல்; அதனோடு வினைகளும் பெண்பாலில் ஒத்திசைகின்றன. இது சட்டம் பெண்களுக்கு மட்டுமே பொருந்தும் என்று கூறுவதில்லை. தமிழில் ‘ஒருவர் ... அவர்’ என்பது தனிநபர் ஒருமையைப் பாதுகாத்து, மூலத்தின் இலக்கணப் பாலினத்தை உயிரியல் பாலினமாகத் தவறாக மாற்றாமல் விடுகிறது.
- issue: חַטָּאת என்ற பலிப்பெயரின் பொருள்
  choice: முதன்மை உரையில் ‘பாவநிவாரணப் பலி’
  alternative: ‘தூய்மைப்படுத்தும் பலி’
  rationale: இச்சொல் பாவத்துடன் தொடர்புடைய பலியைக் குறிக்கிறது; சில ஆசாரியச் சூழல்களில் அதன் சடங்குசார் தூய்மைப்படுத்தும் செயல்பாடு முன்னிலைப்படலாம். பரவலாகப் புரியக்கூடிய வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவாக்கியத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறியாமல்’ என்பது நோக்கமற்ற பாவத்தைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறி அதற்குரிய ‘பாவநிவாரணப் பலி’ என்ற சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
