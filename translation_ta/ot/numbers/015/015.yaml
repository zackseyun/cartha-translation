review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys one binding statute, its enduring intergenerational force, and parity before Yahweh. However, ‘சபையினராகிய உங்களுக்கும்’ merges ‘the assembly’ with the following second-person plural rather than retaining the Hebrew’s topical reference to the assembly. ‘அந்நியர்’ can be retained, but ‘வெளிநாட்டவர்’ more clearly conveys a resident non-native in contemporary Tamil.
  naturalness: The draft is generally fluent, but ‘நீங்கள் எப்படியோ, அப்படியே ... இருப்பார்’ is somewhat elliptical in Tamil. Reordering ‘யாவேக்கு முன்பாக’ and using a more explicit resident-foreigner expression reads more naturally while preserving the Hebrew comparison.
  terminology: ‘நியமம்’ is suitable for חֻקָּה, and ‘யாவே’ appropriately represents יהוה. ‘தங்கியிருக்கும் வெளிநாட்டவர்’ communicates גֵּר הַגָּר without implying a merely unfamiliar person.
  issues:
  - severity: medium
    issue: ‘சபையினராகிய உங்களுக்கும்’ conflates ‘the assembly’ with ‘you.’
    rationale: הַקָּהָל is a separate topical element, followed by ‘for you and for the resident foreigner.’ Rendering it as ‘members of the assembly, to you’ narrows and syntactically merges these elements.
  - severity: low
    issue: The final comparative clause is awkwardly elliptical.
    rationale: The Hebrew comparison is retained, but placing ‘யாவேக்கு முன்பாக’ first and identifying the resident foreigner more directly produces idiomatic modern Tamil without expanding the scope.
  revised_text: சபையைப் பொறுத்தவரை, உங்களுக்கும் உங்களிடையே தங்கியிருக்கும் வெளிநாட்டவருக்கும்[a] ஒரே நியமம் உண்டு. அது உங்கள் தலைமுறைதோறும் நிலைக்கும் நியமம்[b]. யாவேக்கு முன்பாக நீங்கள் எப்படியோ, தங்கியிருக்கும் வெளிநாட்டவரும் அப்படியே இருப்பார்.
