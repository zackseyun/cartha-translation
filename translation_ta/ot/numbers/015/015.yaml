base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: ta
  text: சபையைப் பொறுத்தவரை, உங்களுக்கும் உங்களிடையே தங்கியிருக்கும் வெளிநாட்டவருக்கும்[a] ஒரே நியமம் உண்டு. அது உங்கள் தலைமுறைதோறும் நிலைக்கும் நியமம்[b]. யாவேக்கு முன்பாக நீங்கள் எப்படியோ, தங்கியிருக்கும் வெளிநாட்டவரும் அப்படியே இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கியிருக்கும் வெளிநாட்டவர்’ என்பதற்கு ‘குடியிருக்கும் அந்நியர்’ அல்லது ‘அயல்நாட்டிலிருந்து வந்து வசிப்பவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிரந்தர நியமம்’ அல்லது ‘என்றென்றைக்கும் உரிய நியமம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: சபையினராகிய உங்களுக்கு
  rationale: கָהָל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ என்ற சொல் அதன் கூட்டு அடையாளத்தை இயல்பான நவீனத் தமிழில் தருகிறது; ‘சபையினராகிய உங்களுக்கு’ என்பது எபிரெய வாக்கியத்தின் தொடக்கத் தலைப்பையும் அடுத்துவரும் இரண்டாம் நபர் பன்மையையும் இணைக்கிறது.
- source_word: חֻקָּה אַחַת
  choice: ஒரே நியமம்
  rationale: חֻקָּה சட்டபூர்வமாக விதிக்கப்பட்ட ஒழுங்கு அல்லது நியமத்தைக் குறிக்கிறது. ‘ஒரே’ என்பது இஸ்ரவேலருக்கும் குடியிருக்கும் அந்நியருக்கும் பொருந்தும் சட்டத்தின் ஒன்றுபட்ட தன்மையை வலியுறுத்துகிறது.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: உங்களுக்கும் உங்களிடையே குடியிருக்கும் அந்நியருக்கும்
  rationale: גֵּר என்பது வெறுமனே அறிமுகமில்லாத ஒருவரை அல்ல, வேறொரு இன அல்லது நாட்டுப் பின்னணியிலிருந்து வந்து சமூகத்தினிடையே வசிப்பவரைக் குறிக்கிறது. גור வேர்ச்சொல்லின் பெயர்ச்சொல்–வினைச்சொல் மீளுருவாக்கத்தை ‘குடியிருக்கும் அந்நியர்’ ஓரளவு காக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலைத்திருக்கும் நியமம்
  rationale: சட்டச் சூத்திரங்களில் עוֹלָם தலைமுறைகளைக் கடந்து தொடரும் நிலைப்பாட்டைக் குறிக்கிறது. ‘நிலைத்திருக்கும்’ என்பது தத்துவார்த்தமான முடிவற்ற காலத்தைத் தேவையின்றி வற்புறுத்தாமல் அந்த நீடித்த பொருளைத் தருகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் அனைத்திலும் தொடர்ந்து பொருந்துவதை இந்தத் தமிழ் மரபுத்தொடர் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: நீங்கள் எப்படியோ, அப்படியே குடியிருக்கும் அந்நியரும் இருப்பார்
  rationale: כ...כ என்ற ஒப்பீட்டு அமைப்பின் சமநிலையையும், இச்சட்ட விஷயத்தில் இரு தரப்பினருக்கும் உள்ள சமநிலையையும் இந்த வடிவம் காக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் நேரடியான ‘முன்பாக/சந்நிதியில்’ என்ற உறவையும், יהוה என்ற தெய்வீகப் பெயரையும் இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ‘Yahweh’ ஒலிபெயர்ப்பை நவீனத் தமிழில் ‘யாவே’ என வழங்குவது, பட்டப்பெயரைப் பதிலிடாமல் தனிப்பெயரை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் வழிபாட்டுச் சட்டத்தில் குடியிருக்கும் அந்நியரின் நிலை
  choice: இச்சூழலில் சபையினருக்கும் அவர்களிடையே குடியிருக்கும் அந்நியருக்கும் ஒரே நியமமும் யாவேக்கு முன்பாக சமநிலையும் இருப்பதாக வசனம் கூறுகிறது.
  alternative: இந்தச் சமநிலை உடனடிச் சூழலில் உள்ள பலிச் சட்டங்களுக்கு மட்டுமே பொருந்துகிறது என்று குறுகலாகப் புரிந்துகொள்ளலாம்.
  rationale: ‘ஒரே நியமம்’ மற்றும் ‘நீங்கள் எப்படியோ, அப்படியே’ என்ற மொழி சமநிலையை வெளிப்படையாக வலியுறுத்துகிறது. அதே நேரத்தில், மொழிபெயர்ப்பு அந்தக் கூற்றை உடனடிச் சட்டச் சூழலைத் தாண்டி விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. சட்ட மொழியின் வலிமைக்காக ‘நியமம்’ பயன்படுத்தப்பட்டது. ‘குடியிருக்கும் அந்நியர்’ என்பது சமூகத்தினிடையே தொடர்ந்து வசிக்கும் גֵּר என்பவரின் நிலையைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
