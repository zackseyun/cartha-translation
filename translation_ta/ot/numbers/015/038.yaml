  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம் பேசி, அவர்களிடம் சொல்: அவர்கள் தலைமுறைதோறும் தங்கள் ஆடைகளின் ஓரங்களில் தொங்கல்களை[a]ச் செய்துகொள்ள வேண்டும்; ஒவ்வோர் ஓரத்தின் தொங்கலிலும் நீல நிற நூற்கயிற்றை[b] வைக்க வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விளிம்புத் தொங்கல்களை.” எபிரெயச் சொல் צִיצִת ஆடையின் ஓரத்தில் தொங்கும் நூல் அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: תְּכֵלֶת என்ற எபிரெயச் சொல் இஸ்ரவேலின் பரிசுத்தப் பொருட்களில் பயன்படுத்தப்பட்ட நீலம் அல்லது நீல-ஊதா நிறச் சாயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவமாக ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעָשׂוּ לָהֶם
  choice: தங்களுக்காகச் செய்துகொள்ள வேண்டும்
  rationale: לָהֶם கூறும் தமக்கான பயன்பாட்டை ‘செய்துகொள்ள’ இயல்பாக வெளிப்படுத்துகிறது; கட்டளையின் தொடர்ச்சியை ‘வேண்டும்’ தெளிவாக்குகிறது.
- source_word: צִיצִת
  choice: தொங்கல்கள்
  rationale: ஆடையின் ஓரத்தில் நூல்களால் செய்யப்பட்டுத் தொங்கும் பொருளை இச்சொல் எளிய நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது; ‘விளிம்புத் தொங்கல்கள்’ என்பது மாற்றாகக் குறிப்பில் தரப்படுகிறது.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: தங்கள் ஆடைகளின் ஓரங்களில்
  rationale: כָּנָף என்பதன் அடிப்படைப் பொருள் ‘சிறகு’; ஆடை குறித்த இச்சூழலில் அது ஓரம் அல்லது மூலையைக் குறிக்கிறது. ‘ஓரம்’ தமிழ் ஆடைப் பயன்பாட்டில் இயல்பானது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடரும் கடமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל צִיצִת הַכָּנָף
  choice: ஒவ்வோர் ஓரத்தின் தொங்கலிலும்
  rationale: எபிரெய ஒருமை இச்சூழலில் பகிர்வுப் பொருளில் வருவதால், ஒவ்வொரு ஆடை ஓரத்திலுள்ள தொங்கலையும் குறிக்கும் விதமாக மொழிபெயர்க்கப்பட்டது.
- source_word: פְּתִיל
  choice: நூற்கயிறு
  rationale: முறுக்கப்பட்ட நூல் அல்லது மெல்லிய கயிறு என்ற பொருளை ‘நூற்கயிறு’ துல்லியமாகவும் காட்சிப்படுத்தக்கூடிய வகையிலும் தருகிறது.
- source_word: תְּכֵלֶת
  choice: நீல நிறம்
  rationale: பரிசுத்தப் பொருட்களில் பயன்படுத்தப்பட்ட நீலம் அல்லது நீல-ஊதா நிறச் சாயத்தைக் குறிக்கும் சொல்லுக்கு வாசகர்களுக்கு எளிதில் புரியும் முதன்மை வடிவம் இது; நிறத்தின் சாத்தியமான நுண்வேறுபாடு குறிப்பில் பாதுகாக்கப்படுகிறது.
