translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லளவான வடிவத்துக்குப் பதிலாக சூழலுக்கேற்ற ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டது. எபிரெய உரையின் செயற்பாட்டு வரிசையும் தலைமுறை தொடர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன.
