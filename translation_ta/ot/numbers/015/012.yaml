  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: ta
  text: நீங்கள் செய்யும் எண்ணிக்கைக்கு ஏற்ப, ஒவ்வொன்றுக்கும் அவற்றின் எண்ணிக்கைக்கு ஏற்ப அவ்வாறே செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: எந்த எண்ணிக்கையில்
  rationale: כְּ முன்னொட்டு காட்டும் ‘எண்ணிக்கைக்கு ஏற்ப’ என்ற உறவை, தமிழின் தொடர்புச் சொற்றொடருடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: நீங்கள் பலிகளை ... செலுத்துகிறீர்களோ
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உருவாக்கு’ என்றாலும், உடனடிப் பலிச் சூழலில் செயற்பாட்டைத் தெளிவுபடுத்த ‘பலிகளைச் செலுத்துதல்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘பலிகள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்ட சொல்.
- source_word: כָּכָה תַּעֲשׂוּ
  choice: இவ்வாறே செய்ய வேண்டும்
  rationale: ככה என்பதன் ‘இவ்வாறு’ என்ற பொருளையும், அறிவுறுத்தலின் கட்டளைத் தன்மையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לָאֶחָד
  choice: ஒவ்வொன்றுக்கும்
  rationale: சொல்லுக்கு சொல் ‘ஒன்றுக்கு’ என்றாலும், இங்கு எண்ணப்பட்ட ஒவ்வொரு பலியையும் பகிர்ந்தளிக்கும் வகையில் குறிக்கிறது.
- source_word: כְמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: பன்மை உடைமைப் பின்னொட்டை ‘அவற்றின்’ எனக் காத்து, எண்ணிக்கைக்கேற்ற விகிதத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
