  to: மேலும், ஒவ்வொரு ஆட்டுக்குட்டிக்கும்[b], தகனபலியுடனோ பலிக்காகவோ செலுத்தும் பானபலிக்காகக் கால் ஹின் திராட்சரசத்தைத் தயாரிக்க வேண்டும்.
