source:
  edition: WLC
  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: ta
  text: மேலும், ஒவ்வொரு ஆட்டுக்குட்டிக்கும்[b], தகனபலியுடனோ பலிக்காகவோ செலுத்தும் பானபலிக்காகக் கால் ஹின் திராட்சரசத்தைத் தயாரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொல்லுக்குச் சொல், “அந்த ஓர் ஆட்டுக்குட்டிக்கு”; கட்டளையின் பகிர்நிலைப் பொருளை “ஒவ்வொரு ஆட்டுக்குட்டிக்கும்” என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: மேலும் ... திராட்சரசத்தை
  rationale: וְ முந்தைய கட்டளையுடன் இதை இணைக்கிறது; יַיִן என்பது திராட்சரசத்தைக் குறிக்கும் பொதுவான எபிரெயச் சொல். இயல்பான தமிழ் வாக்கிய அமைப்புக்காகச் சொல் இடம் மாற்றப்பட்டுள்ளது.
- source_word: לַ/נֶּסֶךְ
  choice: பானபலிக்காக
  rationale: பலிச் சடங்கில் נֶסֶךְ ஊற்றிச் செலுத்தப்படும் திராட்சரசப் பலியைக் குறிக்கிறது. ‘பானபலி’ தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: רְבִיעִית הַ/הִין
  choice: கால் ஹின்
  rationale: பண்டைய அளவான ‘ஹின்’ மாற்றிக் கணக்கிடப்படாமல் தக்கவைக்கப்பட்டு, רְבִיעִית இயல்பான தமிழில் ‘கால்’ என வழங்கப்பட்டுள்ளது.
- source_word: תַּעֲשֶׂה
  choice: தயாரிக்க வேண்டும்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’; இப்பலிச் சடங்கு சூழலில் பானபலிக்கான திராட்சரசத்தை ஆயத்தப்படுத்துவதை ‘தயாரிக்க வேண்டும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל הָ/עֹלָה
  choice: தகனபலியோடு
  rationale: עַל என்பதற்கு சொல்லுக்குச் சொல் ‘மேல்’ என்று பொருள் கொள்ளலாம்; இங்கு பலிச் சடங்கில் உடனிணைந்து செலுத்தப்படுவதைக் குறிக்கும் என்பதால் ‘ஓடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: א֣וֹ לַ/זָּבַח
  choice: அல்லது வேறு பலியோடு
  rationale: זֶבַח என்பது עֹלָה எனும் தகனபலியிலிருந்து வேறுபடுத்தப்படும் பொதுவான பலிச்சொல். தமிழில் அந்த வேறுபாட்டைத் தெளிவாகக் காட்ட ‘வேறு’ சேர்க்கப்பட்டுள்ளது; குறிப்பிட்ட பலிவகை ஒன்றும் திணிக்கப்படவில்லை.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: ஒவ்வொரு ஆட்டுக்குட்டிக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஓர் ஆட்டுக்குட்டிக்கு’; நடைமுறைக் கட்டளையில் ஒவ்வொரு தனிப்பட்ட ஆட்டுக்குட்டிக்கும் இவ்வளவு அளவு தேவை என்ற பகிர்நிலைப் பொருளை ‘ஒவ்வொரு’ தெளிவாக்குகிறது.
