source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: ta
  text: ஏனெனில் அந்த நபர் யாவேவின் வார்த்தையை இகழ்ந்து, யாவேவின் கட்டளையை மீறியிருக்கிறார். அவர் நிச்சயமாக அகற்றப்படுவார்[a]; அவரது குற்றம் அவர்மேலேயே உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிச்சயமாக அகற்றப்படுவார்” என்பது எபிரெயில் வலியுறுத்தப்பட்ட ஒரு சொற்றொடர். இங்கு அந்தத் தீர்ப்பு எவ்வாறு நிறைவேற்றப்படும் என்பது குறிப்பிடப்படவில்லை.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவரது அக்கிரமம் அவர்மேல் உள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: דְבַר יְהוָה
  choice: யாவேவின் வார்த்தை
  rationale: דָּבָר இங்கு யாவே வெளிப்படுத்திய கட்டளையைக் குறிக்கிறது; உடன்படிக்கையின் திருப்பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בָּזָה
  choice: இகழ்ந்து
  rationale: வெறும் அலட்சியமல்லாமல், அவமதிப்போடு நிராகரிக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִצְוָתוֹ
  choice: அவருடைய கட்டளை
  rationale: எபிரெயிலுள்ள ஒருமையைத் தக்கவைத்து, சட்ட மற்றும் உடன்படிக்கைச் சூழலுக்குரிய வலிமையை வெளிப்படுத்துகிறது.
- source_word: הֵפַר
  choice: மீறியிருக்கிறார்
  rationale: தெய்வீகக் கட்டளையைச் செல்லாததாக்கும் அல்லது உடைக்கும் கருத்தை, இச்சூழலில் இயல்பாகப் புரியும் தமிழில் தருகிறது.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: நிச்சயமாக அகற்றப்படுவார்
  rationale: வினையெச்சப் பெயரும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் காட்டுகிறது; தீர்ப்பின் துல்லியமான வடிவத்தைத் தீர்மானிக்காமல் ‘அகற்றப்படுவார்’ என வழங்குகிறது.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர்
  rationale: נֶפֶשׁ சட்டச் சூழலில் தனிநபரைக் குறிக்கிறது; ‘ஆத்துமா’ என மொழிபெயர்த்து தவறான மனிதவியல் கருத்தை உருவாக்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: עֲוֺנָהּ בָּהּ
  choice: அவரது குற்றம் அவர்மேலேயே உள்ளது
  rationale: குற்றத்திற்கான பொறுப்பும் தண்டனைக்குரிய நிலையும் குற்றம் செய்தவர்மீதே இருப்பதைச் சொல்லும் எபிரெயப் பெயர்ச்சொல் வாக்கியத்தைத் தக்கவைக்கிறது; ‘-ஏ’ வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் நான்கு எழுத்துத் திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
- issue: உடன்படிக்கைச் சட்டத்தில் ‘அகற்றப்படுதல்’ என்பதன் துல்லியமான பொருள்
  choice: தீர்ப்பின் வடிவத்தைக் குறிப்பிடாமல் ‘நிச்சயமாக அகற்றப்படுவார்’ என வைத்தல்
  alternative: கொல்லப்படுவார் அல்லது சமூகத்திலிருந்து விலக்கப்படுவார்
  rationale: כרת என்பதன் தீர்ப்பு மரணம், சமூக விலக்கம் அல்லது வேறு உடன்படிக்கைத் தண்டனை ஆகியவற்றில் எதைத் துல்லியமாகக் குறிக்கிறது என்பதை இவ்வசனம் கூறவில்லை; எனவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: עֲוֺנָהּ בָּהּ என்பதன் கால மற்றும் நீதித்துறை நுணுக்கம்
  choice: அவரது குற்றம் அவர்மேலேயே உள்ளது
  alternative: அவரது அக்கிரமம் அவர்மேல் இருக்கும்
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சொற்றொடரை நிகழ்நிலைப் பொறுப்பாக இயல்பாகத் தருகிறது; எதிர்காலத்தைச் சேர்த்து மூலத்தைவிட அதிகமாகக் குறிப்பாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்ட-உடன்படிக்கைச் செறிவைத் தக்கவைக்கும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. குற்றவாளியை இழிவாக ஒருமையில் அழைக்காமல் ‘அந்த நபர்/அவர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; அது மூலத்தின் பொருளை மாற்றாது.
