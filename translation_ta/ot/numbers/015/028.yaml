source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: ta
  text: அறியாமல் பாவம் செய்கிற நபருக்காக ஆசாரியன் யாவேவின் முன்னிலையில் பாவநிவிர்த்தி செய்ய வேண்டும்; அவர் அறியாமல் பாவம் செய்யும்போது, அவருக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும். அப்போது அவர் மன்னிக்கப்படுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பதன் பியேல் வடிவம் ஆசாரியச் சடங்கின் சூழலில் பாவத்திற்கான நிவிர்த்தியைச் செய்வதைக் குறிக்கிறது. ‘பாவநிவிர்த்தி செய்ய’ என்பது அதன் வழிபாட்டுச் சார்ந்த பொருளை ஒரு குறிப்பிட்ட பரிகாரக் கோட்பாட்டுக்குள் சுருக்காமல் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: வழிபாட்டுச் செயலை நிறைவேற்றும் அதிகாரப்பூர்வ நபரைக் குறிக்கும் நேரடியான, தமிழில் நிலைபெற்ற சொல்.
- source_word: עַל הַנֶּפֶשׁ
  choice: அந்த நபருக்காக
  rationale: נפשׁ இங்கு உடலற்ற ‘ஆத்துமா’ அல்ல, தனிநபரையே குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘நபர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַשֹּׁגֶגֶת
  choice: அறியாமல் பாவம் செய்கிற
  rationale: שׁגג திட்டமின்றி அல்லது தவறுதலாகச் செய்யப்படுவதைக் குறிக்கிறது. சூழல் பாவத்தைப் பற்றியதால் வினைத் தொடராக இயல்பாக வழங்கப்பட்டது.
- source_word: בְּחֶטְאָה בִשְׁגָגָה
  choice: அவர் அறியாமல் பாவம் செய்யும்போது
  rationale: முன்னுள்ள שׁגג கருத்தை எபிரெயம் மீண்டும் கூறி குற்றத்தின் சூழலைத் தெளிவுபடுத்துகிறது. அந்த உண்மையான மீளுரைத்தல் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்/சந்நிதியில்’ என்ற உறவுநிலையைக் குறிக்கிறது; יהוה உடன்படிக்கையின் திருப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לְכַפֵּר עָלָיו
  choice: அவருக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: முதன்மை வினையிலுள்ள כפר சொல்லை மீண்டும் கொண்ட நோக்கத் தொடராக இது உள்ளது; மூலத்தின் மீளுரைத்தல் பாதுகாக்கப்பட்டது.
- source_word: וְנִסְלַח לוֹ
  choice: அப்போது அவர் மன்னிக்கப்படுவார்
  rationale: סלח சொல்லின் செயப்பாட்டு வடிவம் மன்னிப்பு அளிக்கப்படும் விளைவைத் தெரிவிக்கிறது. ‘அப்போது’ தமிழில் விளைவு உறவை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக வருகிறது. அது பொதுப்பட்டப் பெயராக மாற்றப்படாமல், உடன்படிக்கையின் தனிப்பெயராக ‘யாவே’ எனத் தரப்பட்டது.
- issue: כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்தி செய்ய
  alternative: பரிகாரம் செய்ய / பாவத்தைப் போக்க
  rationale: ஆசாரியச் சடங்கின் செயலைத் தெரிவிக்கும் பரந்த வழிபாட்டுப் பொருள் பாதுகாக்கப்பட்டது; நிவிர்த்தி எவ்வாறு செயல்படுகிறது என்பதைக் குறித்த ஒரு தனிப்பட்ட இறையியல் விளக்கம் வசனத்துக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியக்கூடிய மரியாதையான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள ‘அறியாமல்’ மற்றும் כפר ஆகியவற்றின் மீளுரைத்தல் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; பாலினத்தைத் தேவையின்றி வலுப்படுத்தாமல் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
