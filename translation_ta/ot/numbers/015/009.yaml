  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், மரியாதையான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால அளவுகளான ‘எப்பா’, ‘ஹின்’ ஆகியவை மூலத்தின் தனித்தன்மையைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டுள்ளன.
