  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב עַל בֶּן הַ/בָּקָר֙ מִנְחָ֔ה סֹ֖לֶת שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֑ים בָּל֥וּל בַּ/שֶּׁ֖מֶן חֲצִ֥י הַ/הִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: ta
  text: அப்போது அவன் அந்தக் காளையோடு, ஓர் எப்பாவின் பத்தில் மூன்று பங்கு நன்றாக அரைக்கப்பட்ட மாவை அரை ஹின் எண்ணெயுடன் கலந்து, தானியக் காணிக்கையாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: அப்போது அவன் ... செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபீல் வடிவம் பலிச்சடங்குச் சூழலில் காணிக்கையைக் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது; தொடக்க வாவ் நடைமுறை வரிசையைச் சுட்டுவதால் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: அந்தக் காளையோடு
  rationale: இங்கு עַל என்பது இடப்பொருளில் ‘மேல்’ என்று அல்லாமல், காளைப் பலியுடன் சேர்ந்து தானியக் காணிக்கையும் செலுத்தப்படுவதைக் குறிக்கிறது.
- source_word: בֶּן הַבָּקָר
  choice: அந்தக் காளை
  rationale: சொல்லுக்கு சொல் ‘மாட்டினத்தின் மகன்’ என்றாலும், பலிக்குரிய ஆண் மாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர் என்பதால் இயல்பான தமிழில் ‘காளை’ என வழங்கப்பட்டது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: ஆசாரியச் சட்டங்களில் இது பொதுவான காணிக்கையை அல்ல, தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கையைச் சுட்டுகிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: காணிக்கைக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட, உயர்தர மாவை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ஓர் எப்பாவின் பத்தில் மூன்று பங்கு[a]
  rationale: மூலத்தில் ‘பத்தில் மூன்று பங்குகள்’ என்று மட்டும் உள்ளது; பலிச்சடங்கு அளவீட்டு மரபின்படி விடுபட்டுள்ள ‘எப்பா’ வாசகருக்குத் தெளிவாக உரையில் சேர்க்கப்பட்டு, அதைக் குறிப்பிட அடிக்குறிப்பு தரப்பட்டது.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்து
  rationale: மாவு எண்ணெயோடு கலக்கப்படுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חֲצִי הַהִין
  choice: அரை ஹின்
  rationale: பண்டைய திரவ அளவான ‘ஹின்’ ஊகமான நவீன மாற்றீடு இன்றி ஒலிபெயர்த்துப் பாதுகாக்கப்பட்டது.
