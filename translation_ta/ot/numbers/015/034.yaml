- from: அவனுக்கு என்ன செய்ய வேண்டும் என்பது தெளிவாகக் குறிப்பிடப்படாததால், அவர்கள் அவனைக் காவலில் வைத்தார்கள்.[a]
  to: அவர்கள் அவனைக் காவலில் வைத்தார்கள்; ஏனெனில், அவனுக்கு என்ன செய்யப்பட வேண்டும் என்பது தெளிவாகக் குறிப்பிடப்படவில்லை.[a]
