base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: ta
  text: அவர்கள் அவனைக் காவலில் வைத்தார்கள்; ஏனெனில், அவனுக்கு என்ன செய்யப்பட வேண்டும் என்பது தெளிவாகக் குறிப்பிடப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு என்ன செய்யப்பட வேண்டும் என்பது இன்னும் திட்டவட்டமாகச் சொல்லப்படவில்லை.”
    reason: לֹא פֹרַשׁ என்பதற்கு ‘தெளிவாக்கப்படவில்லை’ என்றும் ‘திட்டவட்டமாகக் குறிப்பிடப்படவில்லை’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்றை பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: வைத்தார்கள்
  rationale: נוח என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ஒருவரை ஒரு நிலையில் அல்லது இடத்தில் வைப்பதைக் குறிக்கிறது; தமிழில் ‘வைத்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: முந்தைய சூழலில் விறகு சேகரித்துக் கொண்டிருந்ததாகக் கண்டுபிடிக்கப்பட்ட ஆண் நபரைக் குறிக்கும் ஆண்பால் ஒருமை நேர்செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: בַּמִּשְׁמָר
  choice: காவலில்
  rationale: מִשְׁמָר என்பது காவல், தடுப்புக் காவல் அல்லது காவலில் வைக்கும் இடம் ஆகியவற்றைக் குறிக்கலாம். முறையான சிறைத்தண்டனை என்று மிகைப்படுத்தாமல், தற்காலிகமாகக் காவலில் வைக்கப்பட்ட நிலையை ‘காவலில்’ தெரிவிக்கிறது.
- source_word: כִּי
  choice: என்பதால்
  rationale: அவனைக் காவலில் வைத்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரண உறவை இயல்பாக இணைக்கிறது.
- source_word: לֹא פֹרַשׁ
  choice: தெளிவாகக் குறிப்பிடப்படாததால்
  rationale: פרש என்பதன் செயப்பாட்டு வடிவம் ஒரு காரியம் தெளிவாகச் சொல்லப்படாமையையோ குறிப்பிட்டுரைக்கப்படாமையையோ குறிக்கிறது. ‘தெளிவாகக் குறிப்பிடப்படாததால்’ என்பது இவ்விரு நுணுக்கங்களையும் காக்கிறது.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: அவனுக்கு என்ன செய்ய வேண்டும்
  rationale: அந்த நபரைக் குறித்து எந்த நடவடிக்கை எடுக்கப்பட வேண்டும் என்ற சட்டநடைமுறை சார்ந்த கேள்வியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சட்டநடைமுறையில் இருந்த தெளிவின்மையின் தன்மை
  choice: அவனுக்கு எடுக்கப்பட வேண்டிய நடவடிக்கை இன்னும் தெளிவாகக் குறிப்பிடப்படவில்லை என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: குறிப்பிட்ட தண்டனை இன்னும் அறிவிக்கப்படவில்லை என்று குறுகலாக மொழிபெயர்க்கலாம்.
  rationale: לֹא פֹרַשׁ என்பது தெளிவான குறிப்புரை இல்லாமையை மையப்படுத்துகிறது. சட்டத்தைப் பற்றிய பொதுவான அறியாமையையோ குறிப்பிட்ட தண்டனையையோ உரையில் சேர்க்காமல், மூலத்தின் நடைமுறைத் தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான சட்ட-கதைநடை. ‘சிறையில்’ என்பதைத் தவிர்த்து, மூலத்தில் உள்ள தற்காலிகத் தடுப்புக் காவல் பொருளை ‘காவலில்’ எனக் காக்கிறது.
