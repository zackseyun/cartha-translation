base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: ta
  text: உங்களுக்கும் உங்களோடு குடியிருக்கும் அந்நியருக்கும் ஒரே சட்டமும் ஒரே நியமமும் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களோடு வசிக்கும் வெளிநாட்டவர்.” எபிரெயச் சொல், இஸ்ரவேலரின் சமூக ஒழுங்குக்குள் அவர்களிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: சட்டம்
  rationale: இந்தச் சட்டச் சூழலில் கட்டுப்படுத்தும் விதிமுறையைக் குறிக்கிறது; מִשְׁפָּט என்பதிலிருந்து இயல்பாக வேறுபடுத்தவும் ஏற்றது.
- source_word: מִשְׁפָּט
  choice: நியமம்
  rationale: நிறுவப்பட்ட சட்ட விதி அல்லது ஒழுங்கைக் குறிக்கிறது. ‘தீர்ப்பு’ என்பது நீதிமன்றத் தீர்ப்பாகத் தவறாகப் புரியக்கூடும்.
- source_word: אַחַת / אֶחָד
  choice: ஒரே
  rationale: இருமுறை வரும் எபிரெய எண்ணுச் சொல் ஒருமையையும் இரு தரப்புக்கும் பொருந்தும் ஒரே அளவுகோலையும் வலியுறுத்துகிறது; தமிழ் நடையில் ‘ஒரே’ இந்த மறுமொழியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: இங்கு வினைச்சொல் எதிர்கால முன்னறிவிப்பை அல்ல, சட்டக் கட்டளையின் நெறிப்படுத்தும் வலிமையை வெளிப்படுத்துகிறது.
- source_word: גֵּר
  choice: குடியிருக்கும் அந்நியர்
  rationale: இஸ்ரவேலரிடையே அவர்களுடைய சமூக ஒழுங்குக்குள் வாழும், பூர்வகுடியல்லாத நபரைக் குறிக்கிறது. வெறும் ‘அந்நியர்’ என்பதைக் காட்டிலும் குடியிருப்பு நிலையைத் தெளிவுபடுத்துகிறது.
- source_word: הַגָּר
  choice: குடியிருக்கும்
  rationale: גֵּר என்ற பெயர்ச்சொல்லுக்கும் அதே வேரிலான பங்கேற்பு வினைக்கும் இடையிலுள்ள எபிரெய ஒலிப்பொருள் தொடர்பை, தமிழில் இயன்ற அளவு ஒரே சொல்லாக்கத்தில் பிரதிபலிக்கிறது.
- source_word: אִתְּכֶם
  choice: உங்களோடு
  rationale: எபிரெய முன்னிடைச்சொல்லின் நேரடியான ‘உங்களுடன்’ என்ற பொருளைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: இஸ்ரவேலருக்கும் அவர்களிடையே குடியிருக்கும் அந்நியருக்கும் சட்டத்தில் சமமான அளவுகோல்
  choice: இரு தரப்புக்கும் ஒரே சட்டமும் ஒரே நியமமும் பொருந்துவதாக வசனம் கூறுகிறது.
  alternative: சூழலில் உடனடியாக முன்வைக்கப்பட்ட பலிச் சட்டங்களுக்கு மட்டுமே இக்கூற்று பொருந்துகிறது என்று குறுகலாக வாசிக்கலாம்.
  rationale: சொற்றொடர் பரந்ததாக இருந்தாலும் அது ஒரு குறிப்பிட்ட சட்டப் பகுதியின் நடுவில் வருகிறது. மொழிபெயர்ப்பு அந்தப் பரந்த வடிவத்தைப் பாதுகாக்கிறது; ஆனால் அதன் பொருந்தும் எல்லையை விளக்கமாக விரிவுபடுத்தவோ குறுக்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தில் இருமுறை வரும் ‘ஒரு/ஒரே’ வலியுறுத்தல் ‘ஒரே சட்டமும் ஒரே நியமமும்’ எனப் பாதுகாக்கப்பட்டது.
