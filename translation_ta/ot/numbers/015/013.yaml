  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ta
  text: நாட்டில் பிறந்த ஒவ்வொருவரும், யாவேக்கு இனிய நறுமணமுள்ள நெருப்புப் பலியை அர்ப்பணிப்பதற்காக, இவற்றை இவ்வாறே செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெருப்புப் பலி” என்பதற்கு “நெருப்பில் செலுத்தப்படும் பலி” என்றும் மொழிபெயர்க்கலாம்; சிலர் இதை “உணவுப் படையல்” என்றும் விளக்குகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: உள்நாட்டில் பிறந்த ஒவ்வொருவரும்
  rationale: இங்கு כָּל என்பது ஒருமை பெயருடன் பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; הָאֶזְרָח சுற்றியுள்ள சூழலில் அந்நியக் குடியிருப்பவருக்கு எதிராக நாட்டில் பிறந்த சமூக உறுப்பினரைக் குறிக்கிறது. எபிரெய ஆண்பால் ஒருமை சட்ட மொழியில் பொதுப் பிரதிநிதித்துவ வலிமையுடையதால் தமிழில் இயல்பான உள்ளடக்க மொழி பயன்படுத்தப்பட்டது.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: இவற்றை இவ்வாறே செய்ய வேண்டும்
  rationale: சட்டச் சூழலில் imperfect கட்டளை/விதிமுறை வலிமை பெறுகிறது. כָּכָה நடைமுறையின் முறையையும் אֵלֶּה முன் கூறியவற்றையும் சுட்டுகிறது.
- source_word: לְהַקְרִיב
  choice: செலுத்தும்போது
  rationale: பலியியல் சூழலில் ‘அருகே கொண்டுவருதல்’ என்பதிலிருந்து ‘பலியாகச் செலுத்துதல்’ என்ற பொருள் வருகிறது. பிரதான வினையுடன் தமிழில் இயல்பான தொடர்பை உருவாக்க காலவினையெச்ச வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: இந்தப் பலியியல் சொல் நெருப்பில் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘உணவுப் பலி’ என்பது ஒரு விளக்கவுரை சார்ந்த சாத்தியம்; மூலத்தின் நெருப்பு சார்ந்த சொல்லமைப்பை ‘நெருப்புப் பலி’ நேரடியாகக் காக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமான
  rationale: தெய்வீக ஏற்றுக்கொள்ளுதலை வெளிப்படுத்தும் நிலையான பலியியல் சொற்றொடர்; ‘இனிய நறுமணம்’ தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: திருநாம எழுத்துகளான יהוה பெயராகவே வழங்கப்படுகின்றன; தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் திருநாமம் நேரடியாக உள்ளது. பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பட்ட இறைநாமமாகக் காக்கப்பட்டது; தமிழில் நிலைபெற்ற வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: הָאֶזְרָח என்பதிலுள்ள ஆண்பால் ஒருமை
  choice: உள்நாட்டில் பிறந்த ஒவ்வொருவரும்
  alternative: உள்நாட்டில் பிறந்த ஒவ்வொரு ஆணும்
  rationale: இலக்கண வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும், சட்ட விதியில் அது சமூகத்திலுள்ள ஒவ்வொரு சொந்த நாட்டவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது; பாலினத்தை ஆண்களுக்கு மட்டும் கட்டுப்படுத்துவது பொருளைத் தேவையின்றி சுருக்கும்.
- issue: אִשֵּׁה என்பதன் பலியியல் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் படையல்
  rationale: சொல்லின் துல்லியமான வரலாற்று விளக்கம் விவாதத்திற்குரியது. மூலத்தின் நெருப்புடன் தொடர்புடைய வெளிப்பாட்டைக் காத்து, மாற்று விளக்கத்தை அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட விதிக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கிய வரிசையை அப்படியே பின்பற்றாமல், பலி செலுத்தும் சூழலை முதலில் வைத்து தமிழில் இயல்பான நிபந்தனை/கால அமைப்பு உருவாக்கப்பட்டது. ஒரே அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
