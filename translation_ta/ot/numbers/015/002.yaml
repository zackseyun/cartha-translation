source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம்[a] பேசி, அவர்களுக்குச் சொல்: “நான் உங்களுக்குக் கொடுக்கிற, நீங்கள் குடியிருக்கும் நாட்டிற்குள்[b] நுழையும்போது,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “இஸ்ரவேலின் மகன்கள்.” “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “உங்கள் குடியிருப்புகளின் நாடு.” “நீங்கள் குடியேறும் நாடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: דבר என்பதன் பியேல் கட்டளை வடிவம் மோசே அறிவிக்க வேண்டிய இறைக் கட்டளையை அறிமுகப்படுத்துகிறது. தொடரும் וְאָמַרְתָּ என்பதோடு இயல்பான தமிழ்த் தொடராக அமைவதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு அது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால், நவீன தமிழில் தவறான உயிரியல் அல்லது ஆண்களுக்கு மட்டும் உரிய பொருள் தோன்றாதபடி ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களுக்குச் சொல்
  rationale: தொடர்ச்சியான கட்டளைச் சூத்திரத்தைத் தெளிவாகவும் சுருக்கமாகவும் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: நுழையும்போது
  rationale: இங்கு כִּי அடுத்துவரும் சட்டம் பொருந்தும் எதிர்பார்க்கப்பட்ட சூழலை அறிமுகப்படுத்துகிறது. ஆகவே நிபந்தனையான ‘என்றால்’ என்பதற்குப் பதிலாக ‘போது’ பொருத்தமானது.
- source_word: תָבֹאוּ
  choice: நுழைய
  rationale: בוא என்பதற்கு ‘வருதல்/நுழைதல்’ என்று பொருள். ஒரு நாட்டிற்குள் செல்வதை நவீன தமிழில் இயல்பாகச் சொல்ல ‘நுழைய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶרֶץ
  choice: நாடு
  rationale: வாக்குறுதி அளிக்கப்பட்ட நிலப்பரப்பை இச்சூழலில் தெளிவாகக் குறிக்கிறது; ‘நிலம்’ என்பதைக் காட்டிலும் நாட்டிற்குள் நுழைதல் என்ற தொடரில் இயல்பாக உள்ளது.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும்
  rationale: מושב என்பதன் குடியிருப்பு/வாழிடம் என்ற பொருளை இயல்பான தமிழில் தருகிறது. ‘உங்கள் குடியிருப்புகளின் நாடு’ என்ற சொல்-சொல்லான அமைப்பின் அசட்டுத்தன்மையைத் தவிர்க்கிறது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: நான் உங்களுக்குக் கொடுக்கிற
  rationale: נֹתֵן என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடரும் அல்லது உடன்நிகழவிருக்கும் செயல் நுணுக்கத்தையும், இறைவனின் கொடை உறுதியானது என்பதையும் எளிய எதிர்காலமாக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழியாக்கம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: எபிரெய வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கிறது. தமிழ் வாசகர் இதை ஆண்களுக்கு மட்டும் உரிய கட்டளையாகத் தவறாகப் புரிந்துகொள்ளாதபடி இயல்பான கூட்டுப்பெயர் முதன்மை உரையில் தரப்பட்டு, குடும்ப உறவுச் சொல்லின் நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: נֹתֵן என்பதில் இறைவனுடைய கொடையின் கால/நிலை நுணுக்கம்
  choice: நான் உங்களுக்குக் கொடுக்கிற
  alternative: நான் உங்களுக்குக் கொடுக்கும் / நான் உங்களுக்குக் கொடுப்பேன்
  rationale: எபிரெயப் பங்கேற்பு வடிவம் நிகழும் அல்லது நெருங்கிய, உறுதியான கொடையை வெளிப்படுத்துகிறது. ‘கொடுப்பேன்’ என்று மாற்றுவது மூலத்தில் கட்டாயமில்லாத எளிய எதிர்கால நுணுக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் இறைக் கட்டளைக்குரிய கண்ணியமான தொனி பேணப்பட்டுள்ளது. எபிரெய மொழியின் மீளுரைக்கும் கட்டளை அமைப்பு தமிழில் இயல்பான வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது; மேற்கோள் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
