base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் சபை முழுவதற்கும்[a], அவர்கள் நடுவில் குடியிருக்கும் அந்நியக் குடியிருப்பாளருக்கும்[b] மன்னிப்பு அருளப்படும்; ஏனெனில் மக்கள் அனைவரும் அறியாமல் தவறு செய்திருந்தனர்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களின் சமூகம் முழுவதற்கும்.” எபிரெயத்தில், “இஸ்ரவேல் மக்களின் சபை முழுவதற்கும்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அந்நியக் குடியிருப்பாளர்” என்பது இஸ்ரவேலரிடையே வசித்து, அந்தச் சமூகத்தின் சட்டங்களுக்கும் பாதுகாப்புகளுக்கும் உட்பட்ட பிறநாட்டவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “ஏனெனில் அந்தச் செயல் மக்கள் அனைவராலும் அறியாமல் செய்யப்பட்டது.” எபிரெய இறுதித் தொடர் வினையில்லாமல் சுருக்கமாக உள்ளது; எனவே அதை இவ்வாறும் வெளிப்படுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: மன்னிப்பு அருளப்படும்
  rationale: סלח என்பதன் நிஃபால் வடிவம் இங்கு பொருளில் செயப்பாட்டு/ஆளில்லா வினையாக உள்ளது. இயல்பான தமிழில் ‘மன்னிப்பு அருளப்படும்’ என்பது சமூகத்திற்கும் அந்நியக் குடியிருப்பாளருக்கும் மன்னிப்பு கிடைப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபை முழுவதற்கும்
  rationale: עֵדָה என்பது சட்ட மற்றும் வழிபாட்டுச் சூழலில் ‘சபை/சமூகம்’ எனப் பொருள்படும். ‘சபை முழுவதற்கும்’ என்பது கூட்டு மொத்தத்தைக் காக்கிறது; בְּנֵי יִשְׂרָאֵל இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: וְלַגֵּר
  choice: அந்நியக் குடியிருப்பாளருக்கும்
  rationale: גֵּר என்பது பயணியை மட்டுமல்ல, இஸ்ரவேலரிடையே வசித்து அவர்களின் சட்டப் பாதுகாப்புகளுக்கும் கடமைகளுக்கும் உட்பட்ட பிறநாட்டு குடியிருப்பாளரைக் குறிக்கிறது.
- source_word: הַגָּר בְּתוֹכָם
  choice: அவர்கள் நடுவில் குடியிருக்கும்
  rationale: גור என்ற வினையின் தொடர்ச்சியான குடியிருப்பு பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; בְּתוֹכָם என்பதன் ‘அவர்கள் நடுவில்’ என்ற இடப்பொருளும் காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட மன்னிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இங்கு செயல்படுகிறது.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: மக்கள் அனைவருக்கும் அது அறியாமல் நிகழ்ந்த தவறு
  rationale: எபிரெய இறுதித் தொடர் சுருக்கமான பெயர்ச்சொல் அமைப்பு. לְ־ என்பதையும் கூட்டு அளவையும் காத்து, שְׁגָגָה குறிக்கும் அறியாமை/தற்செயல் தவற்றை வெளிப்படுத்துகிறது; செயலைத் திட்டவட்டமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: மன்னிப்பின் கூட்டு வரம்பு
  choice: மன்னிப்பு இஸ்ரவேல் சபை முழுவதற்கும் அவர்கள் நடுவிலுள்ள அந்நியக் குடியிருப்பாளருக்கும் விரிவடைகிறது.
  alternative: இறுதித் தொடரை ‘மக்கள் அனைவரும் தவறிழைத்திருந்ததால்’ என்று வினைமயமாக மொழிபெயர்க்கலாம்.
  rationale: மூலவசனம் சமூகமெங்கும் பரவும் மன்னிப்பையும் அந்நியக் குடியிருப்பாளரின் சேர்க்கையையும் வலியுறுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: בִּשְׁגָגָה என்பதன் சட்ட-இறையியல் வேறுபாடு
  choice: அறியாமல் நிகழ்ந்த தவறு
  alternative: தவறுதலாகச் செய்யப்பட்ட செயல்
  rationale: இது வேண்டுமென்றே, துணிகரமாகச் செய்யும் பாவத்திற்கு எதிராக அறியாமையால் அல்லது தவறுதலால் நிகழ்ந்த குற்றத்தைக் குறிக்கிறது. தமிழாக்கம் அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை’ என்ற சொல் עֵדָה என்பதன் கூட்டு மற்றும் முறையான தன்மையைத் தக்கவைக்கிறது; ‘அந்நியக் குடியிருப்பாளர்’ என்பது வெறும் பயணி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. மூலத்தின் சுருக்கமும் இறுதித் தொடரின் உண்மையான தெளிவின்மையும் முதன்மை உரை மற்றும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
