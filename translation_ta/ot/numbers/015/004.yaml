revisions:
- from: அப்போது, யெகோவாவுக்குத் தன் பலியைக் கொண்டுவருகிறவர், ஒரு எப்பாவில் பத்தில் ஒரு பங்கான[a] நைசான மாவை ஒரு ஹின் எண்ணெயில் நான்கில் ஒரு பங்குடன் கலந்து, தானியக் காணிக்கையாகச் செலுத்த வேண்டும்.
