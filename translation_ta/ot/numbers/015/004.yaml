id: NUM.15.4
reference: Numbers 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: ta
  text: அப்போது தன் காணிக்கையை யாவேக்குச் செலுத்துகிறவர், ஒரு எப்பாவில் பத்தில் ஒரு பங்கான[a] நுண்ணிய மாவை, ஒரு ஹின்னில் நான்கில் ஒரு பங்கு எண்ணெயுடன் கலந்து தானியக் காணிக்கையாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “பத்தில் ஒரு பங்கு”; இந்தப் பலிச் சூழலில் இது ஒரு எப்பாவின் பத்தில் ஒரு பங்கைக் குறிக்கிறது.
    reason: மூலத்தின் சுருக்கமான அளவீட்டுச் சொல்லையும் மொழிபெயர்ப்பில் தெளிவுக்காக நிரப்பப்பட்ட அலகையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: அப்போது ... செலுத்த வேண்டும்
  rationale: வாவ் இணைப்புடன் வந்துள்ள வினைமுற்று, முந்தைய வசனத்திலிருந்து தொடரும் பலிச் சட்ட நடைமுறையைக் குறிக்கிறது; எனவே ‘அப்போது’ அதன் தொடர்ச்சியையும் ‘செலுத்த வேண்டும்’ அதன் கட்டளைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמַּקְרִיב קָרְבָּנוֹ
  choice: தன் பலியைக் கொண்டுவருகிறவர்
  rationale: ஹிஃபில் வினையெச்சம் பலியை இறைவனிடம் கொண்டுவரும் நபரை அடையாளப்படுத்துகிறது. ‘கொண்டுவருகிறவர்’ என்பது ‘அருகில் கொண்டுவருதல்’ என்ற அடிப்படைப் படிமத்தையும் பலியிடும் சூழலையும் தெளிவாகத் தருகிறது.
- source_word: קָרְבָּנוֹ
  choice: தன் பலி
  rationale: קָרְבָּן என்பது இறைவனிடம் கொண்டுவரப்படும் பொதுவான பலி அல்லது காணிக்கையைக் குறிக்கிறது. இங்கு பின்னர் குறிப்பிடப்படும் தானியக் காணிக்கையிலிருந்து இதை வேறுபடுத்த ‘பலி’ பொருத்தமானது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது; ל முன்னிடைச்சொல் ‘-க்கு’ எனக் காக்கப்பட்டுள்ளது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: பலிச் சட்டச் சூழலில் מִנְחָה தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது; இச்சொல் அதன் குறிப்பிட்ட சடங்குப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: סֹלֶת பலிக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கிறது. ‘நைசான மாவு’ என்பது இதற்கான இயல்பான, சுருக்கமான தமிழ் வழக்கு.
- source_word: עִשָּׂרוֹן
  choice: ஒரு எப்பாவில் பத்தில் ஒரு பங்கு
  rationale: எபிரெயில் நேரடியாக ‘பத்தில் ஒரு பங்கு’ என்றாலும், பலி அளவீட்டுச் சூழலில் அது ஒரு எப்பாவின் பத்தில் ஒரு பங்கைக் குறிக்கிறது. அளவின் அடிப்படை அலகு வாசகருக்குத் தெளிவாக முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
- source_word: בָּלוּל
  choice: கலந்து
  rationale: செயப்பாட்டு வினையெச்சம் மாவு எண்ணெயுடன் கலக்கப்பட்டிருப்பதைச் சொல்கிறது; தமிழ் வாக்கிய அமைப்பில் ‘கலந்து’ இயல்பாகச் செயல்முறையைத் தெரிவிக்கிறது.
- source_word: בִּרְבִעִית הַהִין
  choice: ஒரு ஹின் ... நான்கில் ஒரு பங்குடன்
  rationale: பண்டைய அளவீட்டு அலகான ‘ஹின்’ பாதுகாக்கப்பட்டு, רְבִעִית துல்லியமாக ‘நான்கில் ஒரு பங்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׁמֶן
  choice: எண்ணெய்
  rationale: மூல உரை எண்ணெய் என்று மட்டுமே கூறுகிறது; ஆலிவ் எண்ணெய் எனக் கூடுதல் குறிப்பைச் சேர்க்காமல் அதன் பொதுப் பொருள் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது. அதை பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ என வழங்குவது பெயரின் தன்மையைப் பாதுகாக்கிறது; எபிரெய் உயிரொலிப்பைப் பிரதிபலிக்கும் மாற்று வடிவம் ‘யாவே’ என்பதாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான கட்டளை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. பண்டைய ‘எப்பா’, ‘ஹின்’ அளவுகள் மாற்றப்படாமல் வைக்கப்பட்டுள்ளன; வாக்கிய ஓட்டத்திற்காக கூறுகளின் வரிசை தமிழுக்கு இயல்பாக அமைக்கப்பட்டுள்ளது.
