- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: மாடுகளிலிருந்தோ ஆடுமந்தையிலிருந்தோ
  rationale: பெரிய கால்நடைகளையும், செம்மறியாடுகள் மற்றும் வெள்ளாடுகளை உள்ளடக்கும் சிறிய கால்நடை மந்தையையும் வேறுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு அண்மையாகத் தமிழில் தருகிறது.
- issue: רֵיחַ נִיחֹחַ என்ற மனித இயல்பில் கூறப்படும் பலிவழிபாட்டு உருவகம்
  choice: இனிய மணம்
  alternative: மனநிறைவளிக்கும் மணம்
  rationale: கடவுளைத் திருப்திப்படுத்தும் செயல்முறையை உரை கூறுவதைக் காட்டிலும் அதிகமாக விளக்காமல், மூல உருவகத்தையும் அதன் நேர்மறை மதிப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தில் தொடங்கும் நிபந்தனை வாக்கியத்தின் தொடர்ச்சி என்பதால், தமிழில் ‘செலுத்தும்போது’ என்ற அமைப்பும் இறுதியில் தொடர்ச்சியைக் காட்டும் நீண்ட கோடும் பயன்படுத்தப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
