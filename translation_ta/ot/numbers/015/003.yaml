  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: ta
  text: நீங்கள் யாவேக்கு நெருப்புக் காணிக்கையை[a]ச் செலுத்தும்போது—தகனபலியையோ பலியையோ, ஒரு நேர்த்திக்கடனை நிறைவேற்றுவதற்காகவோ, விருப்பக் காணிக்கையாகவோ, அல்லது உங்களுக்குக் குறிக்கப்பட்ட காலங்களிலோ[b], யாவேக்கு இனிய மணம் உண்டாக்குவதற்காக, மாடுகளிலிருந்தோ ஆடுமந்தையிலிருந்தோ செலுத்தினால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெருப்பில் செலுத்தப்படும் காணிக்கை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களுக்குக் குறிக்கப்பட்ட பண்டிகைகளில்.’ எபிரெயச் சொல் பொதுவாகக் குறிக்கப்பட்ட காலங்களையோ, குறிப்பாகப் பண்டிகை நிகழ்வுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: நீங்கள் … செலுத்தும்போது
  rationale: எழுத்துப்படி ‘நீங்கள் செய்வீர்கள்’ என்றாலும், பலியிடும் சூழலிலும் முந்தைய வசனத்துடன் தொடரும் வாக்கிய அமைப்பிலும் ‘செலுத்தும்போது’ என்பது இயல்பாகப் பொருளை வெளிப்படுத்துகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புக் காணிக்கை
  rationale: நெருப்பில் செலுத்தப்படும் பலிக்கான வழிபாட்டுச் சொல்லைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் உள்ள יהוה என்ற இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலைபெற்ற தமிழ்ச் சொல்.
- source_word: זֶבַח
  choice: வேறு பலி
  rationale: עֹלָה என்பதிலிருந்து வேறுபடுத்தப்பட்ட பொதுவான பலியைக் குறிக்கிறது; தமிழில் வெறும் ‘பலி’ என்ற மறுபதிப்பைத் தவிர்க்க ‘வேறு’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְפַלֵּא נֶדֶר
  choice: ஒரு நேர்த்திக்கடனை நிறைவேற்றுவதற்காக
  rationale: செய்த நேர்த்தியை பலி செலுத்தி நிறைவேற்றும் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִנְדָבָה
  choice: மனமுவந்து செலுத்தும் காணிக்கையாக
  rationale: கட்டாயத்தினால் அல்லாமல் விருப்பத்துடன் அளிக்கப்படும் காணிக்கை என்ற வழிபாட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּמֹעֲדֵיכֶם
  choice: உங்களுக்குக் குறிக்கப்பட்ட காலங்களில்
