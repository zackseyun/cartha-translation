base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: ta
  text: உங்கள் பிசைந்த மாவின்[a] முதல் பகுதியிலிருந்து ஒரு அப்பத்தைப் பிரித்து, காணிக்கையாக[b] உயர்த்திப் படையுங்கள்; களத்துமேட்டின் காணிக்கையை உயர்த்திப் படைப்பதைப்போலவே, இதையும் உயர்த்திப் படையுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் மாவு பிசையும் பாத்திரங்களிலிருந்து.” எபிரெயச் சொல் பிசைந்த மாவையோ, ஆகுபெயராக மாவு பிசையும் பாத்திரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரபாக, “உயர்த்திப் படைக்கும் காணிக்கை.” எபிரெயச் சொல் தனியே பிரித்துச் சமர்ப்பிக்கப்படும் பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: முதல் பகுதியிலிருந்து
  rationale: இச்சொல் தொடக்கத்தையோ முதல் பங்கையோ குறிக்கிறது. இங்கு முழு மாவிலிருந்து ஒரு பகுதி எடுக்கப்படுவதால், பகுதியைக் குறிக்கும் பொருள் தெளிவாக வெளிப்படுத்தப்பட்டது.
- source_word: עֲרִסֹתֵיכֶם
  choice: உங்கள் பிசைந்த மாவின்
  rationale: இச்சொல் பிசைந்த மாவையோ, ஆகுபெயராக மாவு பிசையும் பாத்திரத்தையோ குறிக்கக்கூடும். அதிலிருந்து அப்பம் எடுக்கப்படுவதால், இச்சூழலில் மாவு என்பது இயல்பான முதன்மைப் பொருள்; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: חַלָּה
  choice: ஓர் அப்பத்தை
  rationale: இங்கு காணிக்கைக்காகப் பிரிக்கப்படும் வடிவமைக்கப்பட்ட அல்லது சுடப்பட்ட அப்பத்தைக் குறிக்கிறது. இனிப்புப் பண்டம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, நவீன தமிழில் இயல்பாக அமையும் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תָּרִימוּ
  choice: உயர்த்திப் படையுங்கள்
  rationale: רוּם என்பதன் ஹிப்ஃபில் வடிவம் சொல்லடியாக உயர்த்துதலைக் குறித்தாலும், காணிக்கைச் சூழலில் அர்ப்பணித்தல் அல்லது சமர்ப்பித்தல் என்ற செயற்பொருளையும் கொண்டுள்ளது. இரண்டையும் வெளிப்படுத்தும் வகையில் இந்தச் சொற்றொடர் அமைக்கப்பட்டது.
- source_word: תְרוּמָה
  choice: காணிக்கை
  rationale: கடவுளுக்காக அல்லது ஆசாரியப் பயன்பாட்டுக்காகப் பிரித்துச் சமர்ப்பிக்கப்படும் பங்கை இச்சொல் குறிக்கிறது. தொழில்நுட்பமான பழைய சொல்லாக்கத்தைவிட 'காணிக்கை' சாதாரண வாசகருக்குத் தெளிவானது; அதன் குறிப்பான நுட்பம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: களத்துமேட்டின் காணிக்கையைப் போலவே
  rationale: தானியம் போரடிக்கப்படும் இடத்தின் விளைச்சலிலிருந்து வழக்கமாகப் பிரிக்கப்படும் காணிக்கையோடு ஒப்பிடப்படுவதைச் சுருக்கமாகவும் மூலத்தின் உறவமைப்புக்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: גֹּרֶן
  choice: களத்துமேடு
  rationale: தானியத்தைப் போரடித்துப் பதப்படுத்தும் வேளாண் இடத்தைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்லாக்கம்; மூலத்தின் வேளாண் காட்சியையும் காக்கிறது.
- source_word: כֵּן
  choice: போலவே
  rationale: முன்னுள்ள ஒப்பீட்டை முடித்து, அதே முறையில் செய்ய வேண்டும் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֹתָהּ
  choice: இதையும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் கூறப்பட்ட அப்பம் அல்லது காணிக்கையைச் சுட்டுகிறது. தமிழில் பொருத்தமான அண்மைச் சுட்டாக 'இதையும்' பயன்படுத்தப்பட்டது.
