  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரேய வடிவத்தையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிக்
  rationale: வாவ்-தொடருடன் வரும் דּבר அடுத்த நிகழ்வாகத் தெய்வீக உரையை அறிமுகப்படுத்துகிறது. தொடர்ந்து வரும் לֵאמֹר உடன் இயல்பான தமிழில் இணைவதற்காக ‘பேசிக்’ என்று வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சைப் பெறுபவரைச் சுட்டும் אֶל என்பதன் பொருளை இயல்பான நவீனத் தமிழில் ‘-யிடம்’ என்ற வேற்றுமை வடிவம் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משׁה என்ற தனிப்பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: தொடர்ந்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரேய வாய்பாட்டை இயல்பாகவும் மரியாதைமிக்க தமிழிலும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரையே பயன்படுத்துகிறது. அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டு, மரபான பட்டப்பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பேசிக் கூறியதாவது’ என்பது דּבר ... לֵאמֹר என்ற வாய்பாட்டின் இரு கூறுகளையும் தமிழில் இயல்பாகத் தக்கவைத்து, அடுத்த வசனத்தில் உரை தொடர்வதைக் குறிக்கிறது.
