base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்கள் வனாந்தரத்தில் இருந்தபோது, ஓய்வுநாளில் விறகு பொறுக்கிக்கொண்டிருந்த ஒரு மனிதனை அவர்கள் கண்டார்கள்.[a]


    [a] அல்லது, “சுள்ளிகளைச் சேகரித்துக்கொண்டிருந்த.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுள்ளிகளைச் சேகரித்துக்கொண்டிருந்த.”
    reason: מְקֹשֵׁשׁ עֵצִים என்பது பொதுவாக விறகு சேகரிப்பதையும், இன்னும் குறிப்பாகச் சுள்ளிகள் அல்லது சிறு மரத்துண்டுகளைச் சேகரிப்பதையும் குறிக்கலாம்; இந்தச் சொற்பொருள் மாற்று வாசிப்பு பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்தபோது
  rationale: இங்கு היה என்பதன் கதைநடை வடிவம் ஒரு பின்னணிச் சூழலை அமைக்கிறது; அடுத்த நிகழ்வுடன் இயல்பாக இணைக்க “இருந்தபோது” என மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேயச் சொற்றொடரின் கூட்டுப்பொருளை நவீனத் தமிழில் இயல்பாகவும் அனைவரும் புரிந்துகொள்ளும் வகையிலும் தருகிறது; சொற்படியாக “இஸ்ரவேலின் மகன்கள்” என்பது தமிழில் தேவையற்ற பாலினக் குறுகலை ஏற்படுத்தலாம்.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது இஸ்ரவேலரின் பயணப் பின்னணியான மக்கள் குடியிருப்பு குறைந்த வறண்ட நிலப்பரப்பைக் குறிக்கிறது; மணற்பாலையை மட்டும் குறிப்பதாக மிகைப்படுத்தாமல் “வனாந்தரம்” அதைத் தருகிறது.
- source_word: וַיִּמְצְאוּ
  choice: அவர்கள் கண்டார்கள்
  rationale: מצא என்பதன் நேரடியான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: இங்கு ஆண் ஒருவரைத் தெளிவாகக் குறிக்கும் ஒருமைச் சொல்லாக இருப்பதால் பொதுவான “ஒருவரை” என்பதற்குப் பதிலாக “ஒரு மனிதனை” பயன்படுத்தப்பட்டது.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: விறகு பொறுக்கிக்கொண்டிருந்த
  rationale: קשש என்ற வினையெச்சமும் עֵצִים என்ற பெயர்ச்சொல்லும் எரிபொருளாகப் பயன்படும் மரத்துண்டுகளைச் சேகரித்த செயலைக் குறிக்கின்றன. “விறகு பொறுக்குதல்” தமிழில் இயல்பானது; “சுள்ளிகளைச் சேகரித்தல்” என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: “சபத்தின் நாளில்” என்ற முழுச் சொற்றொடரின் காலக் குறிப்பை நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; “நாள்” என்ற பொருள் “ஓய்வுநாள்” என்பதிலேயே அடங்கியுள்ளது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களின் பெயரிடல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: கூட்டத்தைக் குறிக்கும் எபிரேய மரபுச் சொற்றொடரைத் தமிழில் இயல்பாகத் தருகிறது; மூலத்தில் இல்லாத கோட்பாட்டு விளக்கத்தையோ ஆண்களுக்கு மட்டுமே பொருந்தும் என்ற எண்ணத்தையோ சேர்க்கவில்லை.
- issue: சபத் தொடர்பான சொற்பயன்பாடு
  choice: ஓய்வுநாளில்
  alternative: சபத் நாளில்
  rationale: שַׁבָּת என்பதன் அடிப்படை உணர்வையும் காலக் குறிப்பையும் தெளிவான தமிழில் தருகிறது. அந்த நாளின் சட்ட அல்லது இறையியல் முக்கியத்துவம் குறித்து வசனம் கூறாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. “வனாந்தரம்” மற்றும் “ஓய்வுநாள்” ஆகிய பரவலாக அறியப்படும் வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் பின்னணிச் சூழலும் செயல் தொடர்ந்துகொண்டிருந்த தன்மையும் “இருந்தபோது,” “பொறுக்கிக்கொண்டிருந்த” என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளன.
