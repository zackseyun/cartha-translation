revisions:
- from: அவனுடைய படைப்பிரிவும்[a], அவர்களில் எண்ணப்பட்டவர்களும் முப்பத்தைந்தாயிரத்து நானூறு பேர்.
  to: அதன் படைப்பிரிவில் கணக்கெடுக்கப்பட்டவர்களின் எண்ணிக்கை முப்பத்தைந்தாயிரத்து நானூறு பேர்.
  rationale: 'The revision removes unsuitable personal pronouns and renders the Hebrew census construction naturally: the number is the total of those enrolled in the contingent. It preserves both the organized military-style sense of צָבָא and the enrolment sense of פקד, without implying active combat.'
