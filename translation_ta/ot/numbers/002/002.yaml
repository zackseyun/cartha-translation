  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: ta
  text: இஸ்ரவேல் மகன்கள், ஒவ்வொருவரும் தம் கொடியருகே, தங்கள் தந்தைவழிக் குடும்பங்களின் அடையாளங்களின்படி முகாமிட வேண்டும்; சந்திப்புக் கூடாரத்துக்கு எதிரே, அதைச் சுற்றிலும் அவர்கள் முகாமிட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் மகன்கள்” என்பதற்கு “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம். “கொடி” என்பது ஒரு கோத்திரத்தையோ படைப்பிரிவையையோ அடையாளப்படுத்தும் கொடியைக் குறிக்கிறது. “சந்திப்புக் கூடாரம்” என்பதற்கு மரபுவழியாக “ஆசரிப்புக் கூடாரம்” என்றும் கூறப்படுகிறது.
    reason: மூலத்தின் குடும்ப மொழி, דֶּגֶל என்ற சொல்லின் சூழற்பொருள், אֹהֶל מוֹעֵד என்பதற்கான பாரம்பரிய மாற்று ஆகியவற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் வந்து, சமூகத்தின் ஒவ்வொரு உறுப்பினரையும் குறிக்கிறது; இயல்பான தமிழில் ‘ஒவ்வொருவரும்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דִּגְלוֹ
  choice: தங்கள் கொடியின் அருகே
  rationale: דֶּגֶל என்பது கோத்திர அல்லது படைப்பிரிவை அடையாளப்படுத்தும் கொடியைக் குறிக்கிறது. עַל இங்கு அந்தக் கொடியைச் சார்ந்த முகாம் அமைவிடத்தைக் காட்டுவதால் ‘அருகே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְאֹתֹת
  choice: அடையாளங்களின்படி
  rationale: אוֹת என்பதன் அடிப்படைப் பொருள் ‘அடையாளம்’; இச்சூழலில் குடும்பப் பிரிவுகளை அடையாளம் காண உதவும் குறியீடுகள். முன்னிடைச்சொல் ஏற்பாடு அல்லது தொடர்பைக் குறிப்பதால் ‘-இன்படி’ இயல்பாக உள்ளது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்
  rationale: בֵּית אָבוֹת என்பது தந்தைவழி அமைந்த மூதாதையர் குடும்பம் அல்லது குலக் குடும்பப் பிரிவைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ உறவமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יַחֲנוּ
  choice: முகாமிட வேண்டும்
  rationale: அறிவுறுத்தல் சூழலிலுள்ள imperfect வினையின் கட்டளைசார் வலிமையை நவீன தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்ப உறவு சார்ந்த சொற்றொடரைப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு; இது வெறும் இனப்பெயராக மாற்றப்படவில்லை.
- source_word: מִנֶּגֶד
  choice: எதிர்நோக்கி
  rationale: கூடாரத்திற்கு எதிராக அல்லது அதை நோக்கிய நிலையில் இருப்பதை இச்சொல் குறிக்கிறது; திசை மற்றும் அமைவிடம் இரண்டையும் ‘எதிர்நோக்கி’ இயல்பாகத் தருகிறது.
- source_word: סָבִיב
  choice: அதைச் சுற்றிலும்
  rationale: சந்திப்புக் கூடாரத்தை எல்லாப் பக்கங்களிலும் சூழ்ந்த முகாம் அமைப்பை வெளிப்படுத்துகிறது; தமிழில் குறிக்கப்படும் பொருளைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான பொருளைப் பாதுகாக்கிறது; பாரம்பரிய தொழில்நுட்பச் சொல்லை விட நவீன வாசகருக்குத் தெளிவானது.
theological_decisions:
- issue: குடும்ப உறவைக் குறிக்கும் உடன்படிக்கை மொழி
  choice: இஸ்ரவேல் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: בְּנֵי יִשְׂרָאֵל என்ற மூலத்தின் குடும்ப உருவகத்தை மறைக்காமல் பாதுகாக்கிறது; அதேவேளை ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்று என அடிக்குறிப்பில் தரப்படுகிறது.
- issue: வழிபாட்டு இடத்தின் பெயர்
  choice: சந்திப்புக் கூடாரம்
  alternative: ஆசரிப்புக் கூடாரம்
  rationale: אֹהֶל מוֹעֵד என்பதன் நேரடியான பொருளை நவீன தமிழில் தருகிறது; குறிப்பிட்ட பாரம்பரிய மரபின் சொல்லாட்சியை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முகாமிட வேண்டும்’ அறிவுறுத்தலின் வலிமையைத் தருகிறது. ‘தந்தைவழிக் குடும்பங்கள்’ பண்டைய இஸ்ரவேலின் குடும்ப அமைப்பைத் தெளிவாக்குகிறது; தேவையற்ற பிரிவுசார் இறையியல் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
