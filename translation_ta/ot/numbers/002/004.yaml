  text: וּ/צְבָא֖/וֹ וּ/פְקֻדֵי/הֶ֑ם אַרְבָּעָ֧ה וְ/שִׁבְעִ֛ים אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/004.yaml
  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவில்[a] கணக்கெடுக்கப்பட்டவர்கள்[b] எழுபத்து நான்காயிரத்து அறுநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய படையில்” அல்லது “அவனுடைய படைத்திரளில்.” எபிரெயச் சொல் இராணுவப் பொருளைக் கொண்டிருக்கலாம்; இங்கு அது பாளையத்தில் அணிவகுக்கப்பட்ட கோத்திரப் பிரிவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்கள்; “படைக்காகக் கணக்கிடப்பட்டவர்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: צָבָא என்பதற்கு படை அல்லது படைத்திரள் என்ற இராணுவப் பொருள் இருக்கலாம். ஆனால் எண்ணாகமம் 2-இன் பாளைய அணிவகுப்புச் சூழலில், தலைவனின் கீழ் ஒழுங்குபடுத்தப்பட்ட கோத்திரப் படைப்பிரிவை இது குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக இடவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּפְקֻדֵיהֶם
  choice: கணக்கெடுக்கப்பட்டவர்கள்
  rationale: פקד இங்கு மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. ‘கணக்கெடுக்கப்பட்டவர்கள்’ என்பது அந்தப் பதிவுசார் நுணுக்கத்தைத் தெளிவாகக் காக்கிறது; இச்சொற்றொடரில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ என்பதையும் சேர்ப்பதில்லை.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: எழுபத்து நான்காயிரத்து அறுநூறு
  rationale: எபிரெய எண்ணின் மொத்த மதிப்பைத் துல்லியமாகக் காத்து, நவீனத் தமிழின் இயல்பான எண் வரிசையில் தரப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் சுருக்கமான பெயர்ச்சொல் அமைப்பு தமிழில் இயல்பாக அமைய இடவேற்றுமை வாக்கியமாக மாற்றப்பட்டுள்ளது.
