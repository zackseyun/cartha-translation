  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: ta
  text: தாணின் முகாமில் கணக்கிடப்பட்டவர்கள் அனைவரும் 1,57,600 பேர். அவர்கள் தங்கள் கொடிகளின்படி[a] கடைசியாகப் புறப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் கொடிகளின் கீழ்.” எபிரெயச் சொல் இஸ்ரவேலின் முகாம் அமைப்பில் பயன்படுத்தப்பட்ட குலக் கொடிகளையோ, அவற்றோடு தொடர்புடைய அணிவகுப்புப் பிரிவுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: கணக்கிடப்பட்ட அனைவரும்
  rationale: מפקד சார்ந்த פקד என்பதன் செயப்பாட்டு பொருளைத் தெளிவாகக் காட்டுகிறது; எபிரெயத்தில் இவ்வசனத்தில் மீண்டும் இல்லாத ‘ஆண்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: לְמַחֲנֵה דָן
  choice: தாணின் முகாமைச் சேர்ந்தவர்களில்
  rationale: לְ குறிக்கும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்தி, கணக்கிடப்பட்டோர் தாணின் முகாம் என்ற அணிவகுப்பைச் சேர்ந்தவர்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 1,57,600 பேர்
  rationale: மூலத்தின் துல்லியமான மொத்த எண்ணிக்கையை இந்தியத் தமிழ் எண் பிரிப்பு முறையில் வாசிக்க எளிதாகத் தருகிறது.
- source_word: לָאַחֲרֹנָה
  choice: கடைசியாக
  rationale: பயண அணிவகுப்பில் இறுதி இடத்தைக் குறிக்கும் வினையடைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִסְעוּ
  choice: புறப்பட வேண்டும்
  rationale: வனாந்தரப் பயணச் சூழலில் נסע என்பது முகாமிலிருந்து பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; இங்கு வரும் imperfect வடிவின் ஒழுங்குமுறை/எதிர்கால நுணுக்கத்தை ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְדִגְלֵיהֶם
  choice: தங்கள் கொடிப்பிரிவுகளின்படி
  rationale: דגל என்பது வெறும் கொடியை மட்டுமல்ல, அந்தக் கொடியின் கீழ் அமைந்த முகாம் அல்லது அணிவகுப்புப் பிரிவையும் குறிக்கக்கூடும்; ‘கொடிப்பிரிவுகள்’ இச்சூழலுக்கு இயல்பான தமிழ்.
