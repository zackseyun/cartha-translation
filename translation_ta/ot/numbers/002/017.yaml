- from: 'பின்பு சந்திப்புக் கூடாரம், லேவியரின் முகாமுடன், மற்ற முகாம்களின் நடுவில் புறப்படும். அவர்கள் எவ்வாறு முகாமிடுகிறார்களோ அவ்வாறே புறப்பட வேண்டும்; ஒவ்வொருவரும் தத்தம் இடத்தில்[a], தங்கள் கொடிகளின்படி[b] செல்ல வேண்டும்.


