  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: ta
  text: 'பின்பு லேவியரின் முகாமோடு சந்திப்புக் கூடாரம் முகாம்களின் நடுவில் புறப்பட வேண்டும். அவர்கள் எவ்வாறு முகாமிடுகிறார்களோ, அவ்வாறே புறப்பட வேண்டும்; ஒவ்வொருவரும் தத்தம் இடத்தில்[a], தங்கள் கொடிகளின்படி[b] புறப்பட வேண்டும்.


    [a] “தத்தம் நிலையில்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இது சொல்லர்த்தமாக “அவரவர் கை/பக்கம்” என அமைந்து, பயண அணிவகுப்பில் ஒவ்வொருவருக்கும் ஒதுக்கப்பட்ட இடத்தைக் குறிக்கிறது.


    [b] “தங்கள் கொடியணிகளின்படி” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு கொடியையும், அந்தக் கொடியின்கீழ் அமைந்த அணியையும் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தத்தம் நிலையில்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இது சொல்லர்த்தமாக “அவரவர் கை/பக்கம்” என அமைந்து, பயண அணிவகுப்பில் ஒவ்வொருவருக்கும் ஒதுக்கப்பட்ட இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தங்கள் கொடியணிகளின்படி” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு கொடியையும், அந்தக் கொடியின்கீழ் அமைந்த அணியையும் குறிக்கக்கூடும்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְנָסַע
  choice: பின்பு ... புறப்படும்
  rationale: முகாம் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கும் נָסַע என்பதன் சூழல்சார் பொருளை இயல்பான நவீன தமிழில் தருகிறது; וְ தொடர்ச்சியை இங்கு “பின்பு” வெளிப்படுத்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: கூடாரம் என்ற பொருளையும், சந்திப்புக்குரிய வழிபாட்டுச் செயலையும் பாதுகாக்கும் தெளிவான தமிழ் வடிவம்.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: லேவியரின் முகாம்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகத் தருவதோடு, லேவியர் என்ற குழுப் பெயரையும் பாதுகாக்கிறது.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: மற்ற முகாம்களின் நடுவில்
  rationale: லேவியர் முகாம் இங்கு குறிப்பிடப்பட்ட முகாம்களில் ஒன்றாக இருப்பதால், தமிழில் “மற்ற” என்பது அது பிற கோத்திர முகாம்களின் மையத்தில் நகர்வதைத் தெளிவாக்குகிறது; בְּתוֹךְ என்பதன் மைய இடப்பொருள் நிலைநிறுத்தப்படுகிறது.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: அவர்கள் எவ்வாறு முகாமிடுகிறார்களோ அவ்வாறே புறப்பட வேண்டும்
  rationale: முகாமிடும் அமைப்புக்கும் பயண அணிவகுப்புக்கும் இடையிலான ஒத்திசைவை, மூலத்தின் இணை அமைப்பைப் பாதுகாத்து இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ பகிர்வுப் பொருளில் ஒவ்வொரு நபர் அல்லது அலகையும் குறிக்கிறது; “ஒவ்வொருவரும்” அந்தச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל יָדוֹ
  choice: தத்தம் இடத்தில்
  rationale: சொல்லர்த்தமாக கை/பக்கம் தொடர்புடைய இந்த மரபுத்தொடர், இச்சூழலில் பயண அணிவகுப்பில் ஒதுக்கப்பட்ட இடத்தைக் குறிக்கிறது. சொல்லர்த்தச் சாயல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְדִגְלֵיהֶם
  choice: தங்கள் கொடிகளின்படி
  rationale: דֶּגֶל என்பதன் காணக்கூடிய கொடி/பதாகைச் சின்னத்தையும் அதன்படி அமைந்த அணிவகுப்பையும் சுருக்கமாக வெளிப்படுத்துகிறது; கொடியணி என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
