base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: ta
  text: எப்பிராயீமின் பாளயக் கொடி[a], அவர்களுடைய படைப்பிரிவுகளின்படி[b], மேற்குப் பக்கத்தில்[c] இருக்கும். எப்பிராயீம் மக்களின்[d] தலைவர் அம்மியூத்தின் மகன் எலிசாமா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொடி’ என்பதற்கு ‘அடையாளக் கொடி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய படைகளின்படி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட படை அல்லது அணிவகுப்புப் பிரிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் நேரடியாக ‘கடலை நோக்கி’; இங்கு அது மேற்குத் திசையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயில் ‘எப்பிராயீமின் மகன்கள்’; இது எப்பிராயீமின் வழிவந்த கோத்திர மக்களைக் குறிக்கும் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: கொடி
  rationale: ஒரு பாளயத்தை அடையாளப்படுத்தி, அதன் கீழ் மக்கள் அணிவகுக்கப் பயன்படும் கொடியைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מַחֲנֵה
  choice: பாளயம்
  rationale: இங்கு ஒரு கோத்திரத்தின் ஒழுங்கமைக்கப்பட்ட முகாம் அல்லது பாளய அமைப்பைக் குறிக்கிறது; எண்ணாகமத்தின் சூழலுக்கு ‘பாளயம்’ பொருத்தமானது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படைப்பிரிவுகளின்படி
  rationale: צָבָא என்பதிலுள்ள ஒழுங்கமைக்கப்பட்ட படைசார் பொருளைத் தக்கவைத்துக்கொள்கிறது; இங்கு நேரடிப் போரைக் காட்டிலும் பாளயத்தின் பிரிவு அமைப்பே முன்னிலையில் உள்ளது.
- source_word: יָמָּה
  choice: மேற்குப் பக்கத்தில்
  rationale: சொல்லின் நேரடிப் படிமம் ‘கடலை நோக்கி’ என்பதாக இருந்தாலும், இஸ்ரவேலரின் நிலவியல் நோக்கில் அது மேற்குத் திசையைக் குறிக்கிறது; இவ்வதிகாரத்தின் பாளய இருப்பிடச் சூத்திரத்தில் ‘மேற்குப் பக்கத்தில்’ இயல்பாக உள்ளது.
- source_word: וְנָשִׂיא
  choice: தலைவர்
  rationale: கோத்திரத்தின் தலைமைப் பொறுப்பில் உள்ளவரைக் குறிக்கிறது. ‘இளவரசர்’ என்பது மரபுரிமை அரசாட்சியைக் குறிப்பதுபோல் தவறாகப் புரியக்கூடும்.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: எப்பிராயீம் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘எப்பிராயீமின் மகன்கள்’ என்று இருந்தாலும், இங்கு எப்பிராயீமின் வழிவந்த கோத்திர மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. இயல்பான தமிழில் கோத்திரப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: அம்மியூதின் மகன் எலிசாமா
  rationale: தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; בֶּן என்பது இயல்பாக ‘மகன்’ என மொழிபெயர்க்கப்பட்டுள்ளது. தமிழ் வாக்கிய நடைக்கேற்ப தந்தையின் பெயர் முதலில் அமைக்கப்பட்டுள்ளது.
