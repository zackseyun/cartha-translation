  naturalness: The concise, list-like construction with a semicolon is natural and suits the Hebrew camp-list context. ‘பென்யமீன் சந்ததியினரின் தலைவன்’ is understandable modern standard Tamil and appropriately identifies the tribal group.
  terminology: ‘கோத்திரம்’ accurately renders מַטֶּה in this context, and ‘தலைவன்’ is a suitable non-royal rendering of נָשִׂיא. ‘சந்ததியினர்’ appropriately communicates בני as the members/descendants of Benjamin’s tribal group. The alternative rendering in the footnote preserves the closely related force of לְ.
