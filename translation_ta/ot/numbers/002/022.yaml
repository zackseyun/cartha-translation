  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தொடக்க וּ தொடர்ச்சியைக் காட்ட ‘அடுத்து’ என வழங்கப்பட்டுள்ளது. எபிரெய வசனத்தின் பட்டியல் போன்ற சுருக்கமான அமைப்பை அரைப்புள்ளி காக்கிறது; ‘சந்ததியினர்’ என்பது בני என்பதன் கோத்திரச் சூழலிலான பொருளைத் தவறாக உடனடிப் புதல்வர்கள் எனப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
