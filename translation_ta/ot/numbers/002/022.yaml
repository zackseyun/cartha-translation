  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ta
  text: 'அடுத்து, பென்யமீன் கோத்திரம்; பென்யமீன் சந்ததியினரின்[a] தலைவன் கிதியோனியின் மகன் அபிதான்.


    [a] அல்லது, “பென்யமீன் சந்ததியினருக்கான.” இங்கு வரும் எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கொன்று நெருக்கமான இவ்விரு பொருள்களிலும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீன் சந்ததியினருக்கான.” இங்கு வரும் எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கொன்று நெருக்கமான இவ்விரு பொருள்களிலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கீடு மற்றும் பாளைய அணிவகுப்புச் சூழலில் இது கைத்தடியைக் குறிக்காமல், இஸ்ரவேலின் ஒரு கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: בִּנְיָמִן
  choice: பென்யமீன்
  rationale: தமிழ் வேதாகம மரபிலும் நவீனப் பயன்பாட்டிலும் அறியப்பட்டுள்ள பெயரெழுத்தாக்கம்.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: கோத்திரத்தின் அங்கீகரிக்கப்பட்ட பிரதிநிதித் தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிக்கும் தேவையற்ற பொருளைச் சேர்க்காமல் அலுவலின் அதிகாரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִבְנֵי בִנְיָמִן
  choice: பென்யமீன் சந்ததியினரின்
  rationale: בני என்பது இங்கு பென்யமீனின் உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் அவருடைய கோத்திரச் சந்ததியினரைக் குறிக்கிறது. ל உறவையோ சார்பையோ குறிக்கக்கூடும்; முதன்மை உரையில் இயல்பான உடைமைத் தொடர்பு பயன்படுத்தப்பட்டு, ‘சந்ததியினருக்கான’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲבִידָן
  choice: அபீதான்
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் பெயரெழுத்தாக்கம்.
- source_word: בֶּן גִּדְעֹנִי
  choice: கிதியோனியின் மகன்
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளக் கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
