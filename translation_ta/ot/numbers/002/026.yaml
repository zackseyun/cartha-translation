  yaml_path: translation/ot/numbers/002/026.yaml
  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவும்[a], அவர்களில் கணக்கெடுக்கப்பட்டவர்களும்[b], அறுபத்திரண்டாயிரத்து எழுநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படையணி’ அல்லது ‘படை’; எபிரெயச் சொல் ஒரு படையையோ ஒழுங்கமைக்கப்பட்ட அணியையோ குறிக்கலாம். இங்கே அது கோத்திரத்தின் படைப்பிரிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘அவர்களிலிருந்து எண்ணப்பட்டவர்கள்.’ இது அந்தக் கோத்திரத்தைச் சேர்ந்தவர்களில் கணக்கெடுக்கப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: צָבָא என்பது படை அல்லது ஒழுங்கமைக்கப்பட்ட அணியைக் குறிக்கலாம். எண்ணிக்கைக் கணக்கீடும் பாளைய அணிவகுப்பும் பற்றிய இந்தச் சூழலில், கோத்திரத்தின் படைப்பிரிவைக் குறிக்கும் வகையில் இயல்பான தமிழில் இடவியல் அமைப்புடன் மொழிபெயர்க்கப்பட்டது.
- source_word: וּפְקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד வேரிலிருந்து வரும் இச்சொல், எண்ணிக்கைக் கணக்கில் பதிவு செய்யப்பட்ட ஆட்களைக் குறிக்கிறது. ‘எண்ணப்பட்டவர்கள்’ என்பது ஆட்களையும் கணக்கெடுப்பு செயலையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: அறுபத்திரண்டாயிரத்து எழுநூறு பேர்
  rationale: எபிரெய எண்ணின் துல்லியமான மதிப்பை நவீனத் தமிழின் இயல்பான எண் வரிசையில் வழங்குகிறது; ‘பேர்’ என்பது எண்ணப்பட்ட மனிதர்களைக் குறிக்கிறது.
