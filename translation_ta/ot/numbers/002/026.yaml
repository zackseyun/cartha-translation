translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய வாக்கியத்தின் துண்டுத்தன்மையைத் தவிர்த்து, முந்தைய வசனத்தோடு தொடரும் கணக்கெடுப்பு வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது; அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
