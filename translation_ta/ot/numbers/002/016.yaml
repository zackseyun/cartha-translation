translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கணக்கெடுப்பின் நிர்வாக-இராணுவச் சூழலைத் தெளிவாக வைத்தபடியே, மூலத்திலுள்ள சுருக்கமான நடையும் புறப்படும் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
