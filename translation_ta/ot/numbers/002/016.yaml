  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: ta
  text: ரூபேனின் பாளயத்தில் எண்ணப்பட்ட அனைவரும், தங்கள் படைப்பிரிவுகளின்படி[a] 1,51,450 பேர். அவர்கள் இரண்டாவதாகப் புறப்படுவார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் படைகளின்படி” அல்லது “தங்கள் அணிகளின்படி.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவர்கள் இரண்டாவதாகப் புறப்படுவார்கள்”; இது பயண அணிவகுப்பில் இந்தப் பாளயத்தின் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: எண்ணப்பட்ட அனைவரும்
  rationale: மக்கள்தொகைக் கணக்கில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கும் எபிரெயச் செயலெச்சத்தின் பொருளையும் כָּל என்பதன் முழுமையான உட்படுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: ரூபேன் பாளயத்தைச் சேர்ந்தவர்களில்
  rationale: לְ குறிக்கும் பாளயச் சார்பைத் தெளிவுபடுத்துகிறது; மொத்த எண்ணிக்கையைக் கூறும் தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 1,51,450 பேர்
  rationale: எபிரெய எண்ணின் சரியான மொத்தம்; இந்தியத் தமிழ் எண்-பிரிப்பு முறையில் இலக்கங்களாக வழங்குவது கணக்கெடுப்புச் சூழலில் வாசிப்பை எளிதாக்குகிறது. 'பேர்' என்பது எண்ணப்பட்ட மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பெயர்.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படைப்பிரிவுகளின்படி
  rationale: צְבָאוֹת என்பதன் ஒழுங்கமைக்கப்பட்ட இராணுவக் குழுக்கள்/பிரிவுகள் என்ற சூழற்பொருளைத் தருகிறது; சொல் கொண்டுள்ள 'படைகள்' அல்லது 'அணிகள்' என்ற மாற்றுச் சாத்தியங்களைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: וּשְׁנִיִּם
  choice: இரண்டாவதாக
  rationale: சொல்லுருவில் எண்ணிக்கைக் குறியீடு இருந்தாலும், இங்கு புறப்படும் வரிசையில் இரண்டாம் இடத்தைக் குறிக்கிறது.
- source_word: יִסָּעוּ
  choice: புறப்பட வேண்டும்
  rationale: வனாந்தரப் பயணச் சூழலில் முகாமிலிருந்து புறப்படுதலை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய imperfect வடிவத்தின் அறிவுறுத்தல்/நிர்ணய நுணுக்கத்தையும் ஏந்துகிறது.
