    issue: Modal force of “புறப்பட வேண்டும்”
    rationale: The form יִסָּעוּ identifies the camp's second departure position; “புறப்படுவார்கள்” communicates this future/ordered sequence without introducing the stronger Tamil obligation expressed by “வேண்டும்.”
  - severity: low
    issue: Awkward relative construction in the first clause
    rationale: Replacing “பாளயத்தைச் சேர்ந்தவர்களில் எண்ணப்பட்ட” with “பாளயத்தில் எண்ணப்பட்ட” removes an unnecessary and less natural ‘among those belonging to’ phrasing while retaining the source relation.
