  text: 'and his company[a], even those numbered of them: fifty-three thousand four hundred.'
translation:
  language: ta
  text: 'அவனுடைய படைப்பிரிவும்[a], அவர்களில் எண்ணப்பட்டவர்களும்: ஐம்பத்து மூவாயிரத்து நானூறு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய சேனை’ அல்லது ‘அவனுடைய படை’; எபிரெயச் சொல், ஒழுங்கமைக்கப்பட்ட கோத்திரக் குழுவைக் குறிக்கும்போது படைத் தன்மையுடைய பொருள்நிழலையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவும்
  rationale: צָבָא என்பது படை, சேனை, அல்லது ஒழுங்கமைக்கப்பட்ட குழுவைக் குறிக்கலாம். எண்ணாகமம் 2-இன் பாளய மற்றும் அணிவகுப்புச் சூழலில், போர்சார் முறையில் ஒழுங்கமைக்கப்பட்ட கோத்திரப் பிரிவை ‘படைப்பிரிவு’ இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்களும்
  rationale: פקד இங்கு மக்கள் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. பன்மை விகுதியை மதித்து, ‘அவர்களில் எண்ணப்பட்டவர்கள்’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் இச்சொற்றொடரிலேயே இல்லாத ‘ஆண்கள்’ என்பது சேர்க்கப்படவில்லை.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ஐம்பத்து மூவாயிரத்து நானூறு பேர்
  rationale: எபிரெய எண்ணின் சரியான மொத்தமான 53,400, நவீனத் தமிழின் இயல்பான எண் வரிசையில் தரப்பட்டுள்ளது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
