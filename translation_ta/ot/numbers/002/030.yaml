translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கணக்கெடுப்பு மற்றும் பாளய ஒழுங்கமைப்பின் சூழலைத் தெளிவாக வைத்தபடியே, மூலத்தின் இணைப்புச் சொற்றொடர் அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
