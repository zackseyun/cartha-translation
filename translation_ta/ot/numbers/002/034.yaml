source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: ta
  text: இஸ்ரவேலர், யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தார்கள்; அவ்வாறே அவர்கள் தங்கள் கொடிகளின்படி[a] முகாமிட்டார்கள்; அவ்வாறே புறப்பட்டார்கள்—ஒவ்வொருவரும் தம் குலங்களின்படியும், தம் தந்தைவழிக் குடும்பங்களின்படியும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கள் சின்னக்கொடிகளின் கீழ்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: דגל என்பது கோத்திர முகாம் அமைப்புடன் தொடர்புடைய கொடி, சின்னக்கொடி, அல்லது அதன்கீழ் அமைந்த அணியைக் குறிக்கக்கூடும்.
  - marker: b
    text: எபிரெயத்தில், ‘தம் தந்தையரின் வீட்டின்படி’; அதாவது தந்தைவழி குடும்ப அல்லது வம்சப் பிரிவின்படி.
    reason: בֵּית אֲבֹתָיו என்ற மரபுத்தொடர் தந்தைவழியான குடும்ப/வம்ச அமைப்பைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர் ... செய்தார்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்சொல்லான வடிவத்தைவிட, முழு மக்களையும் குறிக்கும் எபிரெயக் கூட்டுப்பெயரின் இயல்பான நவீனத் தமிழ் வடிவம் ‘இஸ்ரவேலர்’ ஆகும்.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: கட்டளையிட்ட அனைத்தின்படியும்
  rationale: கட்டளையின் முழுமைக்கும் அதற்கேற்ப நடந்த கீழ்ப்படிதலுக்கும் உரிய விரிவான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் திருப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராக வழங்குகிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כֵּן ... וְכֵן
  choice: அவ்வாறே ... அவ்வாறே
  rationale: கட்டளைக்கும் செயலுக்கும் உள்ள ஒத்திசைவைச் சுட்டும் எபிரெய மறுமொழியைத் தமிழிலும் மீண்டும் வழங்குகிறது.
- source_word: חָנוּ לְדִגְלֵיהֶם
  choice: தங்கள் கொடிகளின்படி முகாமிட்டார்கள்
  rationale: דגל என்பது கோத்திர முகாம் அமைப்பை அடையாளப்படுத்தும் கொடி அல்லது சின்னக்கொடியைக் குறிக்கிறது; ‘கொடிகளின்படி’ என்பது பொருளையும் ஒழுங்கமைப்பையும் இயல்பாகத் தருகிறது.
- source_word: נָסָעוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: முகாமிலிருந்து அடுத்த பயணத்திற்குப் புறப்படுதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: ஒவ்வொருவரும் தங்கள் குலங்களின்படி
  rationale: אישׁ என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொருவரும்’ என்றும், மக்கள்தொகை மற்றும் கோத்திர அமைப்பில் משפחה குறிக்கும் உட்பிரிவை ‘குலங்கள்’ என்றும் வழங்குகிறது.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: தங்கள் மூதாதையர் வீட்டின்படி
  rationale: தந்தைவழி முன்னோர் குடும்ப அல்லது வம்ச வீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. எபிரெய உயிரொலி மரபு முழுமையாக உறுதியற்றிருந்தாலும், தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் ‘அவ்வாறே ... அவ்வாறே’ என்ற மறுமொழி பாதுகாக்கப்பட்டது. ஒருமை ஆண்பால் பகிர்வுச் சொல்லைத் தமிழில் இயல்பான உள்ளடக்கப் பன்மையான ‘ஒவ்வொருவரும் தங்கள்’ என வழங்கியுள்ளோம். எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
