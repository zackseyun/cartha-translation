base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: ta
  text: தாணின் பாளயக் கொடி அவர்களுடைய படைப்பிரிவுகளின்படி வடக்குப் பக்கத்தில் இருக்கும்; தாணின் மக்களுக்குத் தலைவனாக அம்மிசதாயின் மகன் அகியேசர் இருப்பான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: பாளயக் கொடி
  rationale: பழங்குடிக் குழு அணிவகுக்கும் அடையாளக் கொடியைக் குறிக்கிறது; சூழலுடன் தெளிவாக இணைக்க ‘பாளயக் கொடி’ என வழங்கப்பட்டது.
- source_word: מַחֲנֵה דָן
  choice: தாணின் பாளயம்
  rationale: ஒழுங்கமைக்கப்பட்ட தாண் பழங்குடிப் பாளயத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: צָפֹנָה
  choice: வடக்குப் பக்கத்தில்
  rationale: இங்கு நகரும் திசையைவிட பாளய அமைப்பின் இருப்பிடத்தைச் சுட்டுவதால் இடவுணர்வு பாதுகாக்கப்பட்டது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படைப்பிரிவுகளின்படி
  rationale: ஒழுங்கமைக்கப்பட்ட படை போன்ற குழுப்பிரிவுகளைக் குறிக்கும் சொல்லின் சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְנָשִׂיא
  choice: தலைவன்
  rationale: மன்னராட்சிச் சாயல் இல்லாமல் அங்கீகரிக்கப்பட்ட பழங்குடித் தலைமையை இயல்பாகக் குறிக்கிறது.
- source_word: לִבְנֵי דָן
  choice: தாணின் மக்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தைத் தமிழில் செயற்கையாகக் கடினப்படுத்தாமல், தாண் பழங்குடி மக்களைக் குறிக்கும் இயல்பான கூட்டுப்பெயராக வழங்குகிறது.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: அம்மிசதாயின் மகன் அகியேசர்
  rationale: தனிப்பெயர்களை எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்த்து, தந்தை–மகன் உறவைத் தமிழின் இயல்பான வரிசையில் வழங்குகிறது.
theological_decisions:
- issue: בְנֵי דָן என்ற பழங்குடிப் பெயர்ச்சொல்லின் பாலின வடிவம்
  choice: தாணின் மக்கள்
  alternative: தாணின் மகன்கள்
  rationale: எபிரெயத்தில் ஆண்பால் பன்மை இருந்தாலும், இச்சூழலில் அது பழங்குடிக் குழுவுக்கான நிலையான குறிப்பாகச் செயல்படுகிறது. ‘தாணின் மக்கள்’ என்பது பொருளை மாற்றாமல் இயல்பான நவீனத் தமிழில் முழுக் குழுவையும் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. எண்ணாகமம் 2-இன் பாளய அமைப்பு மற்றும் இராணுவ ஒழுங்கு சார்ந்த சொற்கள் தெளிவாகவும் மிகைத் தொன்மையின்றியும் வழங்கப்பட்டன.
