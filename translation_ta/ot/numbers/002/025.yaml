revisions:
- from: தாணின் பாளயக் கொடி வடக்குப் பக்கத்தில், அவர்களுடைய படைப்பிரிவுகளின்படி[a] இருக்க வேண்டும். தாணின் மக்களுக்குத் தலைவன் அம்மிசதாயின் மகன் அகியேசர்.
  to: தாணின் பாளயக் கொடி அவர்களுடைய படைப்பிரிவுகளின்படி வடக்குப் பக்கத்தில் இருக்கும்; தாணின் மக்களுக்குத் தலைவனாக அம்மிசதாயின் மகன் அகியேசர் இருப்பான்.
  rationale: வசனத்தின் இரண்டாம் கூற்றில் தேவையான தமிழ்ப் பயனிலை சேர்க்கப்பட்டது. முதல் கூற்றில் ‘அவர்களுடைய படைப்பிரிவுகளின்படி’ என்பதைப் பாளய அமைப்புடன் நேரடியாக இணைக்கும் வகையில் சொல் வரிசை சீரமைக்கப்பட்டது. பொருள், பெயர்கள், மற்றும் அடிக்குறிப்பின் உரைப்பொருள் மாற்றப்படவில்லை.
