translation_notes:
  register: நவீன நிலையான தமிழில், முகாம் மற்றும் படை அணிவகுப்பு சூழலைக் காக்கும் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தில் உள்ள கணக்கெடுப்பு–படைப்பதிவு நுணுக்கம் முதன்மை உரையிலும் விளக்கக் குறிப்பிலும் இயன்றவரை பாதுகாக்கப்பட்டது.
