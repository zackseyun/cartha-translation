  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: ta
  text: எப்பிராயீமின் முகாமைச் சேர்ந்த கணக்கிடப்பட்ட அனைவரின் எண்ணிக்கை, அவர்களுடைய படைப்பிரிவுகளின்படி[a], 108,100 பேர். அவர்கள் மூன்றாவதாகப் புறப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய படையணிகளின்படி” அல்லது “அவர்களுடைய சேனைகளின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: கணக்கிடப்பட்ட அனைவரும்
  rationale: פקד என்பதன் மக்கள் தொகைக் கணக்கெடுப்பு மற்றும் படை அணிவகுப்புக்கான பதிவு ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது; இச்சூழலில் இயல்பான தமிழாக ‘கணக்கிடப்பட்ட அனைவரும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: எப்பிராயீமின் முகாமைச் சேர்ந்தவர்களில்
  rationale: לְ குறிக்கும் முகாம் சார்ந்த உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108,100 பேர்
  rationale: எபிரெய எண்ணின் துல்லிய மதிப்பை நவீன வாசிப்புக்கு ஏற்ற எண் வடிவில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதைத் தமிழில் இயல்பாக்க ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படைப்பிரிவுகளின்படி
  rationale: צָבָא இங்கு ஒழுங்கமைக்கப்பட்ட படைக் குழுக்கள் அல்லது அணிகளைக் குறிக்கிறது; ‘படைப்பிரிவுகள்’ இராணுவச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: அவர்கள் மூன்றாவதாகப் புறப்பட வேண்டும்
  rationale: וּשְׁלִשִׁים என்பது பயண வரிசையில் மூன்றாம் இடத்தையும் נסע முகாமிலிருந்து புறப்படுதலையும் குறிக்கிறது; கட்டளையுடனான எதிர்கால நுணுக்கத்தை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
