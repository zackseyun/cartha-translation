  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவில்[a] கணக்கெடுக்கப்பட்டவர்களின்[b] எண்ணிக்கை 57,400 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படை’ அல்லது ‘அணி’; இங்குள்ள எபிரெயச் சொல் முகாமின் கணக்கெடுப்புச் சூழலில் ஒழுங்குபடுத்தப்பட்ட இராணுவக் குழுவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பதிவு செய்யப்பட்டவர்கள்’ அல்லது ‘அணிவகுப்புக்காக எண்ணப்பட்டவர்கள்’; எபிரெயச் சொல் அதிகாரப்பூர்வக் கணக்கெடுப்பில் எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: முகாம் அமைப்பும் மக்கள்தொகைக் கணக்கெடுப்பும் குறித்த இச்சூழலில் צָבָא என்பது ஒழுங்குபடுத்தப்பட்ட கோத்திரப் படைப்பிரிவைக் குறிக்கிறது. ‘படைப்பிரிவு’ என்பது போரில் ஈடுபட்டிருப்பதாக மிகைப்படுத்தாமல் அமைப்புசார்ந்த இராணுவக் குழுவைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּפְקֻדָיו
  choice: கணக்கிடப்பட்டவர்கள்
  rationale: פקד வேரிலிருந்து வந்த இவ்வடிவம் அதிகாரப்பூர்வக் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. ‘கணக்கிடப்பட்டவர்கள்’ என்பது எளிய நவீனத் தமிழில் மூலப்பொருளைத் தக்கவைக்கிறது.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400 பேர்
  rationale: எபிரெய எண்ணின் சரியான மதிப்பை நவீனத் தமிழில் இயல்பாகவும் உடனடியாகப் புரியும் வகையிலும் தருகிறது.
