translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வசனத்திற்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. ‘பேர்’ சேர்க்கப்பட்டதால் எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பது இயல்பாகத் தெளிவாகிறது; அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
