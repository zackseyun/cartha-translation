reference: Numbers 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: ta
  text: ரூபன் கோத்திரத்தின் முகாமுக்குரிய கொடி[a] தெற்குப் பக்கத்தில், அவர்களுடைய படைப்பிரிவுகளின்படி[b] இருக்க வேண்டும். ரூபனின் வழிவந்தவர்களுக்குத் தலைவன் சேதேயூரின் மகன் எலிசூர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “அடையாளக்கொடி.”
    reason: lexical_alternative
  - marker: b
    text: வேறு விதமாக, “அவர்களுடைய படைகளின்படி”; எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட படை சார்ந்த பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: கொடி
  rationale: ஒரு கோத்திர முகாமை அடையாளப்படுத்தி, அதன் கீழ் மக்கள் அணிவகுக்க உதவும் கொடியைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מַחֲנֵה
  choice: முகாம்
  rationale: கோத்திரத்தினர் ஒழுங்காகத் தங்கியிருக்கும் முகாம் அமைப்பை நேரடியாகக் குறிக்கிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: תֵּימָנָה
  choice: தெற்குப் பக்கத்தில்
  rationale: தெற்கு நோக்கிய இடத்தைக் குறிக்கும் திசைச் சொல்லின் இடப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படைப்பிரிவுகளின்படி
  rationale: צָבָא என்பதிலுள்ள இராணுவ ஒழுங்கும் குழுப் பிரிவுகளும் இரண்டையும் தக்கவைக்கிறது.
- source_word: וְנָשִׂיא
  choice: தலைவன்
  rationale: இங்கு கோத்திரத்துக்கு நியமிக்கப்பட்ட தலைமையாளரைக் குறிக்கிறது; அரச மரபைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: לִבְנֵי רְאוּבֵן
  choice: ரூபனின் வழிவந்தவர்களுக்கு
  rationale: எபிரெய மொழியின் உறவுமுறைச் சொல்லை, ரூபன் கோத்திரத்தைச் சேர்ந்த சந்ததியினர் என்ற பொருளில் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: சேதேயூரின் மகன் எலிசூர்
  rationale: தனிப்பெயர்களை ஒலிபெயர்த்து, எபிரெய தந்தைவழி அடையாள அமைப்பைத் தமிழின் இயல்பான சொல் வரிசையில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் சுருக்கமான முகாம்-அமைப்பு மொழி தமிழில் தெளிவாக அமைய “இருக்க வேண்டும்” சேர்க்கப்பட்டுள்ளது; கோத்திரச் சூழலை வெளிப்படுத்த “கோத்திரத்தின்” என்பதும் பொருளடிப்படையில் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
