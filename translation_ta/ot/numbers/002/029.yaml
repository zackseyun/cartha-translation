lexical_decisions:
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: எண்ணாகமத்தின் பாளைய ஒழுங்கமைப்புச் சூழலில் இது கோல் என்பதைக் குறிக்காமல், இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இங்கு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட நிர்வாகத் தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய சொற்களைத் தவிர்க்கிறது.
- source_word: לִבְנֵי
  choice: மகன்களுக்கான
  rationale: ל முன்னொட்டின் தொடர்பு/பொறுப்பு நுணுக்கத்தையும், בְּנֵי என்பதன் ஆண்பால் வடிவத்தையும் இயன்றவரை காக்கிறது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: தனிப்பெயரும் கோத்திரப்பெயருமான இதைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲחִירַע
  choice: அகீரா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: வழக்கமான எபிரெயத் தந்தைவழி அடையாள அமைப்பை நேரடியாகத் தருகிறது.
- source_word: עֵינָן
  choice: ஏனான்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
