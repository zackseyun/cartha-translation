base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: ta
  text: அதன் அருகில் முகாமிட்டிருப்பவர்கள் இசக்கார் கோத்திரத்தார். இசக்காரின் மகன்களின்[a] தலைவன் சூவாரின் மகன் நெதனெயேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இசக்காரின் மகன்கள்.” இது இசக்காரின் வழிவந்த கோத்திரத்தாரைக் குறிக்கும் வழக்கமான பெயர்; ஆண்களை மட்டும் குறிப்பதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: முகாமிட்டிருப்பவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினை, முகாமில் நிலைகொண்டிருக்கும் குழுவைக் குறிக்கிறது; தமிழ் வடிவம் அந்தத் தொடர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அதன் அருகில்
  rationale: எண்ணாகமம் 2-இன் முகாம் அமைப்புச் சூழலில் இது முன்பு குறிப்பிடப்பட்ட அணிக்கு அடுத்துள்ள இடத்தைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘அதன்மேல்’ என்பதல்ல.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: இசக்கார் கோத்திரத்தார்
  rationale: מַטֶּה இங்கு கோலையல்ல, கோத்திரத்தைக் குறிக்கிறது. ‘கோத்திரத்தார்’ என்பது முகாமிட்டுள்ள மக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְנָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய ‘இளவரசன்’ தவிர்க்கப்பட்டது.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: இசக்காரின் மகன்களுக்கு
  rationale: எபிரெய மூலத்தின் உறவுமுறைச் சொல்லைத் துல்லியமாகப் பேணுகிறது; இது இசக்காரின் வழிவந்த கோத்திர மக்களைக் குறிக்கும் வழக்கமான குழுப்பெயர்.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: சூவாரின் மகன் நெதனெயேல்
  rationale: தனிப்பெயர்களும் எபிரெயத் தந்தைவழி அடையாள அமைப்பும் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளன.
