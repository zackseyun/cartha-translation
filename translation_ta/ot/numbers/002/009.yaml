  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: ta
  text: யூதாவின் பாளயத்தில் கணக்கிடப்பட்ட அனைவரும், படைப்பிரிவுகளின்படி[a] 1,86,400 பேர். அவர்கள் முதலில் புறப்பட வேண்டும்.[b]
