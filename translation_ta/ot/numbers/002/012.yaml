  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: ta
  text: அதன் அருகில் முகாமிடுபவர்கள் சிமியோன் கோத்திரத்தார்[a]. சிமியோனின் மகன்களின் தலைவர் சூரிசத்தாயியின் மகன் செலுமியேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு அருகில்.” எபிரெயத்தில் உள்ள ஆண்பால் ஒருமை பின்னொட்டு முகாம் அமைப்பில் அருகாமையைக் குறிக்கிறது; அது ஒருவரையோ முன்பு கூறப்பட்ட முகாம் அணியையோ சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: முகாமிடுவோர்
  rationale: חנה என்பதன் பன்மை வினையெச்சம் இங்கு பெயர்ச்சொல்லாகச் செயல்பட்டு, முகாமிட்டிருக்கும் மக்களைக் குறிக்கிறது. ‘முகாமிடுவோர்’ இந்த அமைப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עָלָיו
  choice: அதற்கு அருகில்
  rationale: முகாம் அமைப்பைப் பற்றிய இச்சூழலில் עַל என்பது ‘மேல்’ என்ற நேரடிப் பொருளைவிட இடவியல் அண்மையைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு முன்பு கூறப்பட்ட கொடி அல்லது முகாம் அணியைக் குறிக்கக்கூடும்; உயிரற்ற அந்தச் சுட்டுப்பொருளுக்கு ‘அதற்கு’ என்பது இயல்பான தமிழ்.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: சிமியோன் கோத்திரத்தார்
  rationale: எண்ணிக்கையும் முகாம் அமைப்பும் குறித்த பகுதிகளில் מַטֶּה என்பது கோத்திர அலகைக் குறிக்கிறது. வாக்கியத்தில் முகாமிடும் மக்களைச் சுட்டுவதால் ‘கோத்திரத்தார்’ என வழங்கப்பட்டது.
- source_word: וְנָשִׂיא
  choice: தலைவர்
  rationale: נָשִׂיא இங்கு அங்கீகரிக்கப்பட்ட கோத்திரத் தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய சொல்லைத் தவிர்த்து தெளிவாக வழங்குகிறது.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மகன்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் பன்மையான உறவுமுறைச் சொல்லைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: שְׁלֻמִיאֵל
  choice: செலுமியேல்
  rationale: தனிநபர் பெயர் அதன் எபிரெய ஒலியமைப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: சூரிசத்தாயின் மகன்
  rationale: தந்தை–மகன் உறவு நேரடியாக வழங்கப்பட்டு, צוּרִישַׁדַּי ஒரே தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן என்பதிலுள்ள பாலினம் குறித்த உறவுமுறை மொழி
  choice: சிமியோனின் மகன்கள்
  alternative: சிமியோனின் மக்கள் / சந்ததியினர்
  rationale: மூலத்தில் ஆண்பால் பன்மையான ‘மகன்கள்’ என்ற சொல் உள்ளது. இச்சூழலில் அதை நேரடியாக வழங்குவது பொருளை மறைக்காததால் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- issue: עָלָיו என்பதன் சுட்டுப்பொருள்
  choice: அதற்கு அருகில்
  alternative: அவனுக்கு அருகில்
  rationale: எபிரெய பின்னொட்டு இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், முந்தைய சூழலில் ஆண்பாலான உயிரற்ற ‘கொடி/அணி’யைச் சுட்டக்கூடும். தமிழ் இலக்கணத்தில் அதனை ‘அது’ எனச் சுட்டுவது இயல்பு; தனிநபரைச் சுட்டும் சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘முகாமிடுவோர்’, ‘கோத்திரத்தார்’, ‘தலைவர்’ ஆகியவை பொதுவாகப் புரியும் சொற்கள்; எபிரெய வாக்கியத்தின் இரு கூறுகளும் தெளிவுக்காக இரு வாக்கியங்களாக வழங்கப்பட்டுள்ளன.
