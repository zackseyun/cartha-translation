  naturalness: “அவனுக்கு அடுத்ததாக மனாசே கோத்திரம் இருந்தது; ... தலைவர் ... கமாலியேல்” என்பது நவீன நிலையான தமிழில் இயல்பாகவும், எபிரெயப் பெயர்ச்சொல் வாக்கியத்தின் தகவல் அமைப்பைத் தெளிவாகவும் வழங்குகிறது. “மனாசேயின் மக்களின் தலைவர்” என்பது “மனாசேயின் மக்களுக்குத் தலைவன்” என்பதைக் காட்டிலும் மூலத்தின் உடைமை/பிரதிநிதித்துவ உறவை நேரடியாகக் காட்டுகிறது.
