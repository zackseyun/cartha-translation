  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ta
  text: அவனுக்கு அடுத்ததாக மனாசே கோத்திரம் இருந்தது; மனாசேயின் மக்களின் தலைவர் பெதாசூரின் மகன் கமாலியேல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָיו
  choice: அவனுக்கு அடுத்ததாக ... முகாமிட வேண்டும்
  rationale: எண்ணாகமம் 2-இன் முகாம் அமைப்பு சூழலில் עַל என்னும் முன்னிடைச்சொல் அதிகாரத்தையல்ல, அருகிலுள்ள இடத்தைச் சுட்டுகிறது. முந்தைய வசனங்களில் தொடரும் கட்டளை அமைப்பைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘முகாமிட வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் முகாம் ஒழுங்கமைப்பு சூழலில் இது கோத்திர அலகைக் குறிக்கிறது; கோலையோ கிளையையோ அல்ல.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெயப் பெயர் நவீனத் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு முறைக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: וְנָשִׂיא
  choice: தலைவன்
  rationale: இங்கு נָשִׂיא என்பது நியமிக்கப்பட்ட கோத்திரத் தலைவரைக் குறிக்கிறது. ‘தலைவன்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: மனாசேயின் மக்களுக்கு
  rationale: בְּנֵי என்பதன் வம்சவழிப் பொருளைப் பாதுகாத்து, தலைமைப் பொறுப்பின் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: גַּמְלִיאֵל
  choice: கமாலியேல்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை வழி அடையாளத்தைக் காட்டும் எபிரெயக் கட்டமைப்பின் நேரான தமிழ் இணை.
- source_word: פְּדָהצוּר
  choice: பெதாசூர்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
