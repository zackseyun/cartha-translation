translation:
  language: ta
  text: அவனுடைய படைப்பிரிவும்[a], அதில் எண்ணப்பட்டவர்களும்—ஐம்பத்து நான்காயிரத்து நானூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய படையும், அதில் எண்ணப்பட்டவர்களும்—ஐம்பத்து நான்காயிரத்து நானூறு பேர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவும்
  rationale: צָבָא என்பது படை அல்லது படைத்தொகுதியைக் குறிக்கலாம். எண்ணாகமம் 1–2 அதிகாரங்களின் பாளய மற்றும் கோத்திர ஒழுங்கமைப்புச் சூழலில், ஒழுங்குபடுத்தப்பட்ட கோத்திரப் படைத்தொகுதியைக் குறிக்கும் வகையில் ‘படைப்பிரிவு’ பயன்படுத்தப்பட்டுள்ளது. וּ என்ற இணைப்பும் 3ஆம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியும் முறையே ‘-உம்’, ‘அவனுடைய’ என வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: וּפְקֻדָיו
  choice: அதில் எண்ணப்பட்டவர்களும்
  rationale: פקד என்பதன் இவ்வடிவம் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. ‘எண்ணப்பட்டவர்கள்’ என்பது கணக்கெடுப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது; சூழல் இராணுவ அமைப்பைப் பற்றியதாக இருந்தாலும், ‘போர்வீரர்கள்’ என்று தேவைக்கு அதிகமாகக் குறிப்பாக்கவில்லை. உடைமை விகுதி இயல்பான தமிழில் ‘அதில்’ எனப் படைப்பிரிவைச் சுட்டுகிறது.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ஐம்பத்துநான்காயிரத்து நானூறு பேர்
  rationale: எபிரெய எண்ணின் துல்லியமான மதிப்பு இயல்பான நவீனத் தமிழ் எண் வரிசையில் தரப்பட்டுள்ளது. மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் உள்ள இரு இணைப்புகளும் ‘-உம்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளன; இரண்டாவது சொற்றொடர் முதலாவதை விளக்கும் அமைப்பு நீண்ட கோட்டால் தெளிவாக்கப்பட்டுள்ளது.
