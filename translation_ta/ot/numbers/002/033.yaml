  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: ta
  text: ஆனால், யாவே மோசேக்குக் கட்டளையிட்டபடியே, லேவியர்கள் இஸ்ரவேலின் மகன்களோடு[a] கணக்கிடப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
