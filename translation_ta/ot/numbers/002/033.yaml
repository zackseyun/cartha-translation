    text: அல்லது, ‘இஸ்ரவேலரோடு’; மரபாக, ‘இஸ்ரவேலின் பிள்ளைகளோடு.’ எபிரெய மூலத்தில், ‘இஸ்ரவேலின் மகன்களோடு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: ஆனால் லேவியர்கள்
  rationale: ו முந்தைய கணக்கெடுப்புத் தொகையுடன் உள்ள முரண்பாட்டைக் குறிக்கிறது; நவீன தமிழில் ‘ஆனால்’ அந்த உரையோட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָתְפָּקְדוּ
  choice: கணக்கிடப்படவில்லை
  rationale: פקד என்பதன் ஹித்பயேல் வடிவம் இங்குள்ள மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்து எண்ணப்படுதலைக் குறிக்கிறது; ‘கணக்கிடப்படவில்லை’ தெளிவான இயல்பான தமிழ்.
- source_word: בְּ/תוֹךְ
  choice: உடன்
  rationale: லேவியர்கள் இஸ்ரவேலின் மற்ற மக்களுடன் சேர்த்து கணக்கிடப்படவில்லை என்ற உள்ளடக்கப் பொருளைச் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் ஆண்பால் பன்மை அமைப்பான ‘இஸ்ரவேலின் மகன்கள்’ என்பதை வெளிப்படையாகப் பாதுகாக்கிறது; ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்றாக இருந்தாலும் மூலவடிவத்தை மறைக்கிறது.
- source_word: כַּ/אֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முன்னதாக வழங்கப்பட்ட கட்டளைக்கும் இப்போது அறிக்கையிடப்படும் நிகழ்வுக்கும் உள்ள ஒப்புமையை இயல்பாகக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னரே வழங்கப்பட்ட தெய்வீக ஆணையைக் குறிக்கிறது; தமிழில் சூழலும் ‘படியே’ அமைப்பும் அதன் முன்னிகழ்வைத் தெளிவாக்குவதால் தனியான இறந்தகால நிறைவு வடிவம் தேவையில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவத்தில் தருகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: நேரடி பொருளைக் குறிக்கும் பெயர்; தமிழ் வினை அமைப்பின்படி ‘கட்டளையிடு’ என்பதுடன் நான்காம் வேற்றுமையில் இயல்பாக வருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பட்ட தெய்வீகப் பெயர் உள்ளது. ‘கர்த்தர்’ என்ற பட்டத்தால் அதை மாற்றாமல், தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவம் பயன்படுத்தப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை அணுகும் மாற்று ஒலிபெயர்ப்பு.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலினமும் கூட்டு அடையாளமும்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ‘மகன்கள்’ என்ற உருவக/வம்சவழி சொற்றொடரைப் பாதுகாக்கிறது; அது பொதுவாக இஸ்ரவேல் மக்களைக் குறிக்கக்கூடும் என்ற மாற்றுப் புரிதலை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்றொடர் உரையில் பாதுகாக்கப்பட்டு, இயல்பான கூட்டு இனப்பெயர் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
