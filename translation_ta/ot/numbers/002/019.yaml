base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/019.yaml
  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவில்[a] எண்ணப்பட்டவர்கள் நாற்பதாயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படையில்.” எபிரெயச் சொல் இச்சூழலில் முகாம் ஒழுங்கில் அமைந்த இராணுவப் பிரிவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: முகாம் மற்றும் மக்கள்தொகைக் கணக்கெடுப்பின் சூழலில் צָבָא என்பது அந்தக் கோத்திரத் தலைவருடன் தொடர்புடைய ஒழுங்கமைக்கப்பட்ட படைப்பிரிவைக் குறிக்கிறது. ‘படைப்பிரிவு’ என்பது இராணுவத் தன்மையையும் குழு அமைப்பையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது. எபிரெய இணைப்புச் சொல் தமிழில் இயல்பாக அமைய இடவேற்றுமையால் இணைக்கப்பட்டுள்ளது.
- source_word: וּפְקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד இங்கு கணக்கெடுப்பில் பதிவு செய்யப்பட்டு எண்ணப்பட்டவர்களைக் குறிக்கிறது. பன்மைச் சுட்டின் பொருள் சூழலில் தெளிவாக இருப்பதால், தமிழில் சுருக்கமாகவும் இயல்பாகவும் தரப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ சேர்க்கப்படவில்லை.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பதாயிரத்து ஐந்நூறு பேர்
  rationale: எண்ணிக்கை நேரடியாக நவீனத் தமிழில் தரப்பட்டுள்ளது. மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட இயல்பான எண்ணுப்பெயரான ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எண்ணிக்கைப் பட்டியலின் சுருக்கமான நடையைப் பேணியுள்ளோம். ‘படைப்பிரிவு’ இராணுவ ஒழுங்கமைப்பைத் தெளிவுபடுத்துகிறது; அடிக்குறிப்பு எபிரெயச் சொல்லின் பதிவு/அணிவகுப்பு சார்ந்த மாற்றுப் பொருளைப் பாதுகாக்கிறது.
