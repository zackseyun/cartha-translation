source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேக்கும் ஆரோனுக்கும் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னது
  rationale: וַיְדַבֵּר ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை இயல்பாக இணைக்க ‘பேசிச் சொன்னது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: אֶל என்ற முன்னிடைச்சொல் இரு பெயர்களுக்கும் தனித்தனியே வருவதைக் காட்ட, ‘-யிடமும் ... -னிடமும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: அடுத்த வசனத்தில் வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை இயல்பான தமிழ் தொடராகவும் முக்காற்புள்ளியுடனும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது. ‘யெகோவா’ என்பதற்குப் பதிலாக மூல உச்சரிப்பை நெருங்கிய ‘யாவே’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். வசனம் அடுத்த வசனத்தில் தொடரும் இறையுரையை அறிமுகப்படுத்துவதால், தனியாக இயல்பாக வாசிக்கவும் தொடர்ச்சியைத் தெளிவாகக் காட்டவும் ‘பேசிச் சொன்னது:’ என்ற நடை பயன்படுத்தப்பட்டுள்ளது.
