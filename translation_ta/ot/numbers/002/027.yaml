language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה אָשֵׁ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: ta
  text: 'அதன் அருகில் முகாமிடுவோர்: ஆசேர் கோத்திரத்தார்; ஆசேர் கோத்திரத்தின் தலைவர் ஒக்ரானின் மகன் பகியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: முகாமிடுவோர்
  rationale: חנה வினையின் பங்கேற்பு வடிவம் முகாமிட்டிருப்போரை அல்லது முகாமிடுவோரைச் சுட்டுகிறது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் பங்கேற்புத் தன்மையைப் பாதுகாக்கிறது.
- source_word: עָלָיו
  choice: அதன் அருகில்
  rationale: முகாம் அமைப்பின் சூழலில் עַל மற்றும் பின்னொட்டு, ‘அதன்மேல்’ என்பதைக் காட்டிலும் அதற்கு அடுத்த அல்லது பக்கத்து இடத்தைக் குறிக்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரத்தார்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கீடு மற்றும் முகாம் ஒழுங்கு சூழலில் מַטֶּה ஒரு கோத்திரப் பிரிவைக் குறிக்கிறது; இங்கு முகாமிடும் மக்களைச் சுட்டுவதால் ‘கோத்திரத்தார்’ இயல்பானது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: கோத்திரம் மற்றும் மூதாதையின் பெயர்; தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இங்கு ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அரச வம்சப் பொருளைத் தவிர்த்து, தெளிவான நவீன தமிழை வழங்குகிறது.
- source_word: לִבְנֵי אָשֵׁר
  choice: ஆசேரின் மக்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் ‘ஆசேரின் மகன்களுக்கு/மக்களுக்கு’ என்ற உறவைப் பாதுகாக்கிறது; கோத்திர மக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: פַּגְעִיאֵל
  choice: பகியேல்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை நெருங்கிய தமிழ் எழுத்துப்பெயர்ப்பில் தரப்பட்டது.
- source_word: בֶּן עָכְרָן
  choice: ஒக்ரானின் மகன்
  rationale: தந்தைவழி அடையாளத்தைக் காட்டும் நேரடியான எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
