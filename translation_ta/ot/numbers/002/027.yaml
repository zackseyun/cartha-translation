  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பட்டியல் நடைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தில் உள்ள இணைப்புச் சொற்கள் தமிழில் அரைப்புள்ளியால் இயல்பாக அமைக்கப்பட்டன.
