base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: ta
  text: தங்களுடைய தந்தைவழிக் குடும்பங்களின்படி கணக்கிடப்பட்ட இஸ்ரவேல் மக்களான ஆண்கள்[a][b] இவர்களே. அவரவருடைய படையணிகளின்படி[c] முகாம்களைச் சேர்ந்த கணக்கிடப்பட்ட அனைவரின் மொத்த எண்ணிக்கை ஆறு இலட்சத்து மூவாயிரத்து ஐந்நூற்று ஐம்பது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கணக்கிடப்பட்ட ஆண்கள்’ என்பதற்கு ‘எண்ணப்பட்டவர்கள்’ அல்லது ‘பதிவு செய்யப்பட்ட ஆண்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேல் மக்கள்’ என்பது சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: c
    text: ‘படையணிகளின்படி’ என்பதற்கு ‘பிரிவுகளின்படி’ அல்லது ‘சேனைகளின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: கணக்கிடப்பட்ட ஆண்கள்
  rationale: எண்ணிக்கையில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கும் சொல். எண்ணாகமம் 1–2 இன் சூழலில் படைப்பணிக்குத் தகுதியான ஆண்களே கணக்கிடப்படுவதால், தமிழில் குறிப்பைத் தெளிவாக்க ‘ஆண்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய குடும்பவழி மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது; ‘இஸ்ரவேலின் மகன்கள்’ என்பது சொற்சொல்லான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்பில் சொல்லப்பட்டுள்ள தந்தைவழி வம்சக் குடும்ப அமைப்பைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמַּחֲנֹת
  choice: முகாம்கள்
  rationale: திருவாசஸ்தலத்தைச் சுற்றி அமைந்த கோத்திர முகாம் அமைப்புகளைக் குறிக்கும் தெளிவான சொல்.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படையணிகளின்படி
  rationale: ஒழுங்குபடுத்தப்பட்ட படைசார் பிரிவுகளை உணர்த்துகிறது; உடனடியாகப் போரில் ஈடுபடுகிறார்கள் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ஆறு இலட்சத்து மூவாயிரத்து ஐந்நூற்று ஐம்பது
  rationale: 603,550 என்ற எபிரெய எண்ணைத் தமிழின் இயல்பான எழுத்துவடிவில் அளிக்கிறது.
theological_decisions:
- issue: கணக்கெடுப்பில் பாலினத்தைக் குறிக்கும் மொழி
  choice: ‘கணக்கிடப்பட்ட ஆண்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘கணக்கிடப்பட்டவர்கள்’ அல்லது ‘பதிவு செய்யப்பட்டவர்கள்’
  rationale: இந்த வசனத்தில் ‘ஆண்கள்’ என்பதற்குத் தனியான சொல் இல்லாவிட்டாலும், எண்ணாகமம் 1–2 இன் உடனடிச் சூழல் படைப்பணிக்குத் தகுதியான வயதுவந்த ஆண்களையே கணக்கெடுக்கிறது. ஆகவே குறிப்பை பாலினநடுநிலையாக்காமல் சூழலுக்கேற்ப வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயத் தந்தைவழிக் குடும்ப அமைப்பும் படைசார் ஒழுங்கும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; எண்ணிக்கை சொல்லெழுத்தில் தரப்பட்டுள்ளது.
