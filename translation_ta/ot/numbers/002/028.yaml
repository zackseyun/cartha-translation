  yaml_path: translation/ot/numbers/002/028.yaml
  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவும்[a], அவர்களில் எண்ணப்பட்டவர்களும்[b], நாற்பத்தோராயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய படையும்’ அல்லது ‘அவனுடைய படை அணியும்’; எபிரெயச் சொல் ஒரு படையையோ, பாளையக் கணக்கெடுப்பில் ஒழுங்கமைக்கப்பட்ட ஒரு பிரிவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவர்களுடைய எண்ணப்பட்டவர்கள்’ அல்லது ‘அவர்களில் பதிவு செய்யப்பட்டவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவும்
  rationale: צָבָא என்பது இந்த மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் பாளைய அணிவகுப்புச் சூழலில் ஒழுங்கமைக்கப்பட்ட பழங்குடிப் படைப்பிரிவைக் குறிக்கிறது. ‘படைப்பிரிவு’ என்பது போர் சார்ந்த பொருளையும் ஒழுங்கமைக்கப்பட்ட குழு என்ற பொருளையும் இயல்பாகத் தக்கவைக்கிறது; 3ஆம் ஆண்பால் ஒருமை பின்னொட்டு ‘அவனுடைய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்களும்
  rationale: פקד சார்ந்த இச்சொல் கணக்கெடுப்பில் எண்ணப்பட்ட அல்லது அணிவகுப்புக்காகப் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. எபிரெய மூலத்தில் இவ்வாக்கியப் பகுதியில் ‘ஆண்கள்’ என்று வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், ‘அவர்களில்’ என்ற உறவையும் தக்கவைக்கிறது.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பத்தோராயிரத்து ஐந்நூறு பேர்
  rationale: எபிரெய எண்ணின் மதிப்பு நவீன தமிழின் இயல்பான எண் வரிசையில் வழங்கப்படுகிறது. மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
