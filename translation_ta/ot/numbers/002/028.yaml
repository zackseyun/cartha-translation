translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமத்துக்குரிய கண்ணியத்தையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கும் நடை. மூலத்தின் இரு இணைப்புச் சொற்களையும் ‘-உம்’ வடிவில் தக்கவைத்து, கணக்கெடுப்பு சார்ந்த சொற்பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
