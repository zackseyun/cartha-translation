  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: ta
  text: அவனுடைய படைப்பிரிவும்[a], அவர்களில் எண்ணப்பட்டவர்களும் முப்பத்திரண்டாயிரத்து இருநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படையும்” அல்லது “படைத் தொகுதியும்”; இங்குள்ள எபிரெயச் சொல் צָבָא, முகாமிடுவதற்கும் அணிவகுத்துச் செல்வதற்கும் ஒழுங்குபடுத்தப்பட்ட கோத்திரப் படைப்பிரிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: அவனுடைய படைப்பிரிவும்
  rationale: צָבָא என்பது படை அல்லது படைத்தொகுதியைக் குறிக்கலாம்; எண்ணாகமம் 2-இன் முகாம் மற்றும் அணிவகுப்பு சூழலில், தலைவனின் கீழுள்ள கோத்திரப் படைப்பிரிவை இது குறிக்கிறது. ‘படைப்பிரிவு’ இயல்பான நவீனத் தமிழில் அமைப்புசார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்களும்
  rationale: פקד என்பதிலிருந்து வரும் இவ்வடிவம் கணக்கெடுக்கப்பட்ட அல்லது அணிவகுப்புக்காகப் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. பன்மை பின்னொட்டு அப்பிரிவினரைச் சுட்டுவதால், ‘அவர்களில் எண்ணப்பட்டவர்கள்’ என்பது மூலத்தின் உறவைப் பேணுகிறது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: முப்பத்திரண்டாயிரத்து இருநூறு பேர்
  rationale: எண்ணை நவீனத் தமிழின் இயல்பான வரிசையில் வழங்குகிறது; மனிதர்களின் கணக்கெடுப்பு என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
