translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்பு மற்றும் முகாம் அமைப்புச் சூழலுக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால் தொடக்க இணைப்பான ‘-உம்’ வடிவங்கள் பேணப்பட்டுள்ளன.
