  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: ta
  text: கிழக்குப் பக்கத்தில், சூரியன் உதிக்கும் திசையில், தங்கள் படைப்பிரிவுகளின்படி யூதா முகாமின் கொடியின் கீழ் முகாமிடுவோர் இருப்பார்கள்; யூதா வம்சத்தாருக்குத் தலைவன் அம்மினதாபின் மகன் நகசோன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה מִזְרָחָה
  choice: கிழக்குப் பக்கத்தில், சூரியன் உதிக்கும் திசையை நோக்கி
  rationale: இரு திசைக் குறிப்புகளையும் மீளுரைப்பாக அழிக்காமல், இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: דֶּגֶל
  choice: கொடி
  rationale: முகாமின் பெரிய பிரிவை அடையாளப்படுத்தும் கொடி அல்லது பதாகையைக் குறிக்கும் சொல்; இச்சூழலில் எளிதில் புரியும் ‘கொடி’ பொருத்தமானது.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படைப்பிரிவுகளின்படி
  rationale: ஒழுங்குபடுத்தப்பட்ட படை அல்லது சேவைப் பிரிவுகள் என்ற பன்மைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: கோத்திரத்தின் நியமிக்கப்பட்ட முதன்மை நபரை இயல்பாகக் குறிக்கிறது; ‘அதிபதி’ என்பதைக் காட்டிலும் பொதுவாசகருக்குத் தெளிவானது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மக்கள்
  rationale: எபிரெய மொழியின் உறவுவழிப் பயன்பாட்டை ஆண்களுக்கு மட்டும் வரையறுக்காமல், யூதா கோத்திரத்தாரைக் குறிக்கும் சூழற்பொருளில் வழங்குகிறது.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: அம்மினதாபின் மகன் நகசோன்
  rationale: தனிப்பெயர்களை மூல எபிரெய ஒலியமைப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, தந்தை-மகன் உறவைத் தெளிவாக வைத்திருக்கிறது.
