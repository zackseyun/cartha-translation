translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியல் போன்ற எபிரெய மூலத்தின் சுருக்கமான அமைப்பு இயன்றவரை பேணப்பட்டாலும், தமிழில் உறவு தெளிவாக இருக்க ‘தலைவனாக’ மற்றும் ‘இவன்’ சேர்க்கப்பட்டுள்ளன.
