source:
  edition: WLC
  text: מַטֵּ֖ה זְבוּלֻ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י זְבוּלֻ֔ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: ta
  text: செபுலோன் கோத்திரம்; செபுலோன் மக்களின்[a] தலைவன் ஹேலோனின் மகன் ஏலியாப்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செபுலோன் மக்களுக்கான தலைவன்.” இந்தக் கோத்திர நிர்வாகச் சொற்றொடரில் வரும் எபிரெய முன்னிடைச்சொல், நெருங்கிய தொடர்புடைய ஒன்றுக்கு மேற்பட்ட விதங்களில் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் பாளைய ஒழுங்கமைப்புச் சூழலில் இச்சொல் நேரடியான கோலை அல்ல, இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: கோத்திரப் பெயர்; தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְנָשִׂיא
  choice: தலைவனாக
  rationale: இந்த நிர்வாகச் சூழலில் נָשִׂיא கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக அடுத்துள்ள לִבְנֵי என்பதோடு இணைத்து வழங்கப்பட்டுள்ளது.
- source_word: לִבְנֵי זְבוּלֻן
  choice: செபுலோனின் மக்களுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு அந்தக் கோத்திர மக்களுக்கான தலைமை உறவைக் குறிக்கலாம். 'மக்கள்' என்பது தமிழில் கோத்திர உறுப்பினர்கள் அனைவரையும் இயல்பாகக் குறிக்கிறது; எபிரெயச் சொற்றொடரின் நேரடி 'மகன்கள்' வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלִיאָב
  choice: ஏலியாப்
  rationale: தனிப்பெயர்; தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן חֵלֹן
  choice: இவன் ஏலோனின் மகன்
  rationale: எபிரெய மரபுவழிப் பெயரிணைப்பைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
