lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: கோத்திரமும்
  rationale: எண்ணாகமம் 2-இன் பாளய அமைப்புச் சூழலில் מַטֶּה என்பது நேரடியான ‘கோல்’ அல்ல, கோத்திரப் பிரிவைக் குறிக்கிறது. இணைப்புச் சொல் பட்டியல் தொடர்ச்சியை உணர்த்தும் ‘-உம்’ என வழங்கப்பட்டது.
- source_word: גָּד
  choice: காத்
  rationale: கோத்திரப் பெயர்; நவீனத் தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: וְ/נָשִׂיא
  choice: தலைவன்
  rationale: இந்த நிர்வாகச் சூழலில் נָשִׂיא அங்கீகரிக்கப்பட்ட கோத்திரத் தலைவரைக் குறிக்கிறது; ‘தலைவன்’ தெளிவான இயல்புத் தமிழ்.
- source_word: לִ/בְנֵי גָד
  choice: காத் மக்கள்
  rationale: בְּנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’ என்றாலும், இங்கு காதின் வழிவந்த கோத்திர மக்களைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘காத் மக்கள்’ என வழங்குவது பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אֶלְיָסָף
  choice: எலியாசாப்
  rationale: தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: வழக்கமான தந்தை–மகன் அடையாளச் சூத்திரத்தின் நேரடி மொழிபெயர்ப்பு.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: WLC/மசோரா உரை இவ்வசனத்தில் רְעוּאֵל என்று வாசிக்கிறது; அதையே முதன்மை உரையில் ஒலிபெயர்த்து, இணை வசனத்தின் வேறுபட்ட பெயரை அடிக்குறிப்பில் பாதுகாக்கிறது.
