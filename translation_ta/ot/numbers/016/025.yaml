id: NUM.16.25
reference: Numbers 16:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וַ/יֵּ֖לֶךְ אֶל דָּתָ֣ן וַ/אֲבִירָ֑ם וַ/יֵּלְכ֥וּ אַחֲרָ֖י/ו זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: ta
  text: பின்பு மோசே எழுந்து தாத்தானிடமும் அபிராமிடமும் சென்றார்; இஸ்ரவேலின் மூப்பர்கள் அவருக்குப் பின்னால் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום வினை இங்கு அடுத்தடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; செயலில் இறங்குவதற்காக எழுவதைக் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך என்பதன் பொதுவான பொருள் ‘செல்/நட’; இங்கு பயண முறையை மிகைப்படுத்தாமல் இயல்பான கதைநடைப் பொருளைத் தருகிறது.
- source_word: אֶל דָּתָן וַאֲבִירָם
  choice: தாத்தானிடமும் அபிராமிடமும்
  rationale: אֶל நபர்களை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் நபர்களிடம் செல்வதை ‘-இடம்’ உருபுடன் இயல்பாகக் கூறலாம். பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: அவருக்குப் பின்னால் சென்றார்கள்
  rationale: הלך என்ற வினையையும் אַחֲרָיו என்ற இடவியல் தொடரையும் தனித்தனியாகப் பேணி, ‘அவரைப் பின்தொடர்ந்தார்கள்’ என்று ஒரே வினையாகச் சுருக்காமல் எபிரெய அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: இது இஸ்ரவேலின் அங்கீகரிக்கப்பட்ட மூத்த தலைவர்களைக் குறிக்கும் வழக்கமான இணைப்புச் சொற்றொடர்; ‘மூப்பர்கள்’ மரியாதையும் பதவிப் பொருளும் கொண்ட இயல்பான தமிழ் சொல்.
- source_word: וַ (initial)
  choice: பின்பு
  rationale: தொடக்க waw கதைநிகழ்வின் தொடர்ச்சியை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
