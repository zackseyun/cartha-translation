translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. எபிரெயத்தின் ‘அவருக்குப் பின்னால் சென்றார்கள்’ என்ற உருவக அமைப்பு சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
