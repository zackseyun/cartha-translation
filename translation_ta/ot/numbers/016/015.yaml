base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: ta
  text: அப்போது மோசே மிகவும் கோபமடைந்து யாவேவிடம், “அவர்களுடைய காணிக்கையை நோக்கித் திரும்பாதீர்.[a] அவர்களிடமிருந்து ஒரு கழுதையைக்கூட நான் எடுத்துக்கொண்டதில்லை; அவர்களில் ஒருவருக்கும் நான் தீங்கு செய்ததில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய காணிக்கைக்குச் சாதகமாகக் கவனம் செலுத்தாதீர்” அல்லது “அவர்களுடைய காணிக்கையை ஏற்றுக்கொள்ளாதீர்.” எபிரேய மொழியில் சொல்லுக்குச் சொல், “அவர்களுடைய காணிக்கையை நோக்கித் திரும்பாதீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: அப்போது மோசே மிகவும் கோபமடைந்து
  rationale: חרה ל என்னும் எபிரேய மரபுத்தொடர் ஒருவருக்குள் கோபம் மூள்வதைக் குறிக்கிறது; מְאֹד காட்டும் தீவிரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: அவர்களுடைய காணிக்கையை நோக்கித் திரும்பாதீர்
  rationale: פנה אל என்பதன் 'நோக்கித் திரும்புதல்' என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது சாதகமாகக் கவனித்தல் அல்லது ஏற்றுக்கொள்ளுதல் என்பதையும் உணர்த்தலாம்.
- source_word: מִנְחָתָם
  choice: அவர்களுடைய காணிக்கை
  rationale: מִנְחָה என்பது அன்பளிப்பு, திறை அல்லது வழிபாட்டுக் காணிக்கை எனப் பலவாறு பொருள்படலாம்; உடனடிச் சூழல் தானியக் காணிக்கை என்று கட்டாயப்படுத்தாததால் பொதுவான 'காணிக்கை' தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: அவர்களிடமிருந்து ஒரு கழுதையைக்கூட நான் எடுத்துக்கொண்டதில்லை
  rationale: மோசே அவர்களைப் பொருளாதார ரீதியில் சுரண்டவில்லை என்ற மறுப்பையும், எபிரேயத்தின் குறிப்பான கழுதை உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: அவர்களில் ஒருவருக்கும் நான் தீங்கு செய்ததில்லை
  rationale: רעע என்பதன் காரணவினை வடிவம் தீமை அல்லது தீங்கு செய்வதைக் குறிக்கிறது; எந்தத் தனிநபருக்கும் அநீதி செய்யவில்லை என்ற மறுப்பை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: காணிக்கையை நோக்கித் திரும்பாதீர் என்பதன் பொருள்
  choice: எபிரேய உருவகத்தை முதன்மை உரையில் பாதுகாத்தல்
  alternative: அவர்களுடைய காணிக்கையை ஏற்றுக்கொள்ளாதீர்; அதற்கு ஆதரவு காட்டாதீர்
  rationale: வாக்கியம் சாதகமான கவனம் அல்லது ஏற்றுக்கொள்ளுதலைக் குறிக்கக்கூடும்; ஆனால் மூலத்தின் உருவகம் திட்டவட்டமாகக் கூறாத பொருளைத் தீர்மானிக்காமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நேரடியாக அழைக்கும் வேண்டுதலில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது; மூலத்தின் உருவகமும் பொருள்சார் தெளிவின்மையும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
