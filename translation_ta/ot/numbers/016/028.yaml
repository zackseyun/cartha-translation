  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: ta
  text: 'மோசே சொன்னார்: “யாவே என்னை இந்தச் செயல்கள் அனைத்தையும் செய்ய அனுப்பியிருக்கிறார் என்பதையும், நான் அவற்றை என் சொந்த உள்ளத்தின்படி செய்யவில்லை என்பதையும் இதனால் நீங்கள் அறிந்துகொள்வீர்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: மோசே சொன்னார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான wayyiqtol வடிவை இயல்பான நவீனத் தமிழில் தருகிறது; காலவரிசையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: בְּזֹאת
  choice: இதனால்
  rationale: בְּ என்ற முன்னொட்டின் கருவிப்பொருளைத் தெளிவாகக் காட்டி, அடுத்து நிகழவிருக்கும் அடையாளம் மோசேயின் கூற்றை உறுதிப்படுத்தும் என்பதை உணர்த்துகிறது.
- source_word: תֵּדְעוּן
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை imperfect வடிவத்தின் எதிர்காலப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கெழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: שְׁלָחַנִי
  choice: என்னை அனுப்பியிருக்கிறார்
  rationale: முன்னர் நிறைவேற்றப்பட்ட அனுப்புதலின் தற்போதைய தொடர்பையும் அதிகாரத்தையும் தமிழ் நிறைவுநிலை வினை இயல்பாகக் காட்டுகிறது.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: இந்தச் செயல்கள் அனைத்தையும் செய்வதற்கு
  rationale: עשה மற்றும் מַעֲשִׂים ஆகிய தொடர்புடைய சொற்களின் ‘செய்/செயல்’ ஒற்றுமையைத் தக்கவைத்து, குறிப்பிட்ட எல்லா நடவடிக்கைகளையும் குறிக்கிறது.
- source_word: כִּי לֹא מִלִּבִּי
  choice: இவை என் சொந்த உள்ளத்திலிருந்து வந்தவை அல்ல
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தைத் தக்கவைத்தபடி, இவை மோசேயின் சொந்த முனைவு அல்லது அதிகாரத்தில் தோன்றியவை அல்ல என்ற கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: இரண்டாவது כִּי என்பதன் தொடர்பு
  choice: ‘அல்ல என்பதையும்’ என்று அறிதலின் இரண்டாவது உள்ளடக்கமாக அமைத்தல்
  alternative: ‘ஏனெனில் ... அல்ல’ என்று காரணவாக்கியமாக அமைத்தல்
  rationale: כִּי இங்கு காரணத்தையும் அல்லது ‘அறிந்துகொள்வீர்கள்’ என்பதோடு இணைந்த இரண்டாவது உள்ளடக்கத்தையும் குறிக்கலாம். தொடரமைப்போடு நன்கு பொருந்தும் இரண்டாவது வாய்ப்பை முதன்மை உரையில் எடுத்தாலும், காரணப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘உள்ளத்திலிருந்து’ என்ற மூல உருவகம் திட்டமிட்டு வைக்கப்பட்டு, அதன் மரபுப்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘யாவே’ என்பது இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
