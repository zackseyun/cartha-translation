base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: ta
  text: அவர்கள் தங்களுக்குரிய அனைத்தோடும் உயிரோடே ஷியோலுக்குள்[a] இறங்கினார்கள். பூமி அவர்களை மூடிவிட்டது; அவர்கள் சபையின் நடுவிலிருந்து அழிந்துபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லறைக்குள்” அல்லது “இறந்தோரின் உலகத்துக்குள்.” எபிரெயத்தில், “ஷியோல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கினார்கள்
  rationale: ירד என்பதன் இயல்பான பொருளான ‘கீழே இறங்குதல்’ என்பதையும் நிகழ்வின் திசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: அவர்களும் அவர்களுக்குரிய அனைத்தும்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஆட்களையோ உடைமைகளையோ மட்டும் குறுக்காமல், அவர்களுக்குச் சொந்தமான அல்லது அவர்களோடு தொடர்புடைய அனைத்தையும் உள்ளடக்கும் வகையில் அகலமாக உள்ளது.
- source_word: חַיִּים
  choice: உயிரோடு
  rationale: அவர்கள் இறந்தவர்களாக அல்ல, உயிருடன் இருக்கும்போதே இறங்கினார்கள் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁאֹלָה
  choice: ஷியோலுக்குள்
  rationale: திசையைக் குறிக்கும் எபிரெய இறுதியை ‘-க்குள்’ பிரதிபலிக்கிறது; שְׁאוֹל என்பதை வெறும் கல்லறை என்று குறுக்காமல் ஒலிபெயர்த்து வைத்திருக்கிறது.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: பூமி அவர்களை மூடிக்கொண்டது
  rationale: பூமியே செய்பொருளாக இருந்து அவர்களை மூடியது என்ற காட்சியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֹּאבְדוּ
  choice: அழிந்துபோனார்கள்
  rationale: אבד இங்கு அவர்கள் கூட்டத்தின் மத்தியிலிருந்து இல்லாமற்போனதையும் அழிவுக்குள்ளானதையும் குறிக்கிறது; அழிவின் முறையைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: சபையின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதன் ‘நடுவிலிருந்து’ என்ற இடவுணர்வையும் קָהָל என்பதன் கூடியிருக்கும் மக்கள் சபை என்ற பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: இந்த எபிரெயச் சொல் ஒரு தனிப்பட்ட கல்லறையைவிட அகன்ற பழைய ஏற்பாட்டுக் கருத்தைக் கொண்டிருக்கலாம். அதை ‘நரகம்’ என்று பிற்காலக் கோட்பாட்டால் நிரப்பாமலும், ‘கல்லறை’ என்று குறுக்காமலும் இருக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, பொருள் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான, தீவிரமான நிகழ்வோட்டம் இரண்டு வாக்கியங்களாக இயல்பாக அமைக்கப்பட்டுள்ளது; ‘அவர்களுக்குரிய அனைத்தும்’ என்பது மனிதர்களா உடைமைகளா என்ற மூலத்தின் அகலத்தையும் தெளிவின்மையையும் குறுக்காமல் பாதுகாக்கிறது.
