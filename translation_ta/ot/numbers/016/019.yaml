source:
  edition: WLC
  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: ta
  text: கோரா அவர்களுக்கு எதிராக முழுச் சபையையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் ஒன்றுகூட்டினான். அப்போது யாவேயின்[a] மகிமை முழுச் சபைக்கும் தோன்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயருக்கான மரபுவழி மாற்று மொழியாக்கத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: ஒன்றுகூட்டினான்
  rationale: קהל என்பதன் ஹிஃபில் வடிவம், கோராகு மக்களை ஒன்றுகூடச் செய்தான் என்ற காரணவினைப் பொருளைத் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக
  rationale: கலகச் சூழலில் עַל எதிர்ப்பைக் குறிக்கிறது; எபிரெய உரையின் பன்மைச் சுட்டுப்பெயரைத் தீர்மானித்து பெயர்களாக மாற்றாமல் காக்கிறது.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரையும் / சபையார் அனைவருக்கும்
  rationale: עֵדָה இங்கு ஒன்றுபட்ட சமூகத்தைக் குறிக்கிறது; כָּל என்பதன் முழுமையை ‘அனைவரும்’ காக்கிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: கூட்டம் திரண்டிருந்த இடத்தை இயல்பான தமிழில் குறிக்கிறது; פֶּתַח என்பதற்கு ‘நுழைவாயில்’ என்றும் אֹהֶל מוֹעֵד என்பதற்கு ‘சந்திப்புக் கூடாரம்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּרָא
  choice: தோன்றியது
  rationale: ראה என்பதன் நிஃபால் வடிவம் காணத்தக்க வெளிப்பாட்டைக் குறிக்கிறது; அதன் முறை குறித்து கூடுதல் விளக்கம் சேர்க்காமல் ‘தோன்றியது’ என வழங்கப்படுகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד தெய்வீகப் பிரசன்னத்தின் வெளிப்பாட்டைக் குறிக்கிறது; יְהוָה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל כָּל הָעֵדָה
  choice: சபையார் அனைவருக்கும்
  rationale: தோற்றத்தின் பார்வையாளர்களை אֶל குறிக்கிறது; தமிழில் ‘அனைவருக்கும் தோன்றியது’ இயல்பாகவும் திசை/பெறுநர் உறவைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உள்ள நான்கு எழுத்து இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘அவர்களுக்கு’ என்ற சுட்டுப்பெயர் பெயர்களால் நிரப்பப்படாமல் காக்கப்பட்டுள்ளது; சூழல் அதன் குறிப்பைத் தீர்மானிக்கிறது.
