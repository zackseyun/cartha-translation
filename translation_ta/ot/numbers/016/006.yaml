  text: זֹ֖את עֲשׂ֑וּ קְחוּ לָ/כֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְ/כָל עֲדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: ta
  text: '“இதையே செய்யுங்கள்: கோராவும் அவனுடைய கூட்டத்தார் அனைவரும், தங்களுக்கெனத் தூபக்கலசங்களை[a] எடுத்துக்கொள்ளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்புத் தட்டுகளை.” எபிரேயச் சொல் எரியும் தணல்களை எடுத்துச் செல்ல, குறிப்பாகத் தூபச் சடங்குகளில் பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: நீங்கள் செய்ய வேண்டியது இதுதான்
  rationale: முன்னோக்கி வரும் கட்டளையை அறிமுகப்படுத்தும் எபிரேயச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: קְחוּ לָכֶם
  choice: உங்களுக்காக ... எடுத்துக்கொள்ளுங்கள்
  rationale: பன்மைக் கட்டளையையும் לָכֶם என்பதன் தங்களுடைய பயன்பாட்டிற்காக என்ற தற்சார்பு நுட்பத்தையும் காக்கிறது.
- source_word: מַחְתּוֹת
  choice: தூபக்கலசங்கள்
  rationale: எரியும் தணல்களை ஏந்தவும் தூபச் சடங்கில் பயன்படுத்தவும் செய்யப்பட்ட பாத்திரங்களைச் சூழலுக்கேற்ற தெளிவுடன் குறிக்கிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரேயப் பெயரை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְכָל עֲדָתוֹ
  choice: அவனைச் சேர்ந்த கூட்டத்தார் அனைவரும்
  rationale: עֵדָה என்பதன் கூட்டம்/சபை என்ற பொருளையும், ஒருமை உடைமைப் பின்னொட்டு கோராகைக் குறிப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரேயத்தின் நேரடி அழைப்பில் உள்ள இலக்கணத் தெளிவின்மையைத் தவறாக ஒருமைப்படுத்தாமல், பன்மைக் கட்டளையைத் தெளிவாகக் காட்டுகிறது; மாற்று சொல்வரிசை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
