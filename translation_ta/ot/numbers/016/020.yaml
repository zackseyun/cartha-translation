  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடமும் ஆரோனிடமும் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: «YHWH»; «யாவே» என ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதையும் தொடர்கதை முன்னேற்றத்தைக் குறிக்கும் வாவ் வடிவத்தையும் இயல்பான தமிழ் உரைநடையில் வெளிப்படுத்துகிறது; அடுத்துவரும் לֵאמֹר காரணமாக தனியே ‘சொன்னார்’ என்று மீளுரைப்பதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: மீண்டும் வரும் אֶל முன்னிடைச்சொல்லை இரு தனித்தனி பேச்சுப் பெறுநர்களையும் சுட்டும் இயல்பான தமிழ் இணைப்பு வடிவத்தில் காக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: இதற்குப் பின் நேரடிக் கூற்று தொடங்குவதைக் காட்டும் எபிரெய பேச்சு அறிமுகச் சூத்திரத்தை தமிழில் இயல்பாக முக்காற்புள்ளி வெளிப்படுத்துகிறது; ‘இவ்வாறு கூறினார்’ என்பதும் சாத்தியமான விரிவான மாற்றாகும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயரே உள்ளது. அதன் ஒலிப்பில் முழு உறுதி இல்லாததால், தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவம் முதன்மை உரையில் வைக்கப்படுகிறது; ‘யாவே’ என்பது ஏற்ற மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; சுருக்கமான, கண்ணியமான கதைநடை. எபிரெய மொழியின் இரு பெறுநர்களுக்குமான மீளுருவாக்கம் ‘-யிடமும் … -யிடமும்’ என இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது. அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
