  rationale: ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்–வினைச்சொல் இணைப்பு, யெகோவா நிகழ்த்தும் அசாதாரணமான புதிய செயலை வலியுறுத்துகிறது. தமிழில் இயல்பாக இருக்கும்படி ‘புதிதான ஒன்றைப் படைத்து’ என வழங்கப்பட்டது; மூலத்தின் சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நிலைபெற்ற நேரடி எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
