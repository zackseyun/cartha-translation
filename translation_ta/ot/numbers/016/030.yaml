base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: ta
  text: ஆனால் யாவே புதிதான ஒன்றைப் படைத்து[a], நிலம் தன் வாயைத் திறந்து அவர்களையும் அவர்களுக்குச் சொந்தமான அனைத்தையும் விழுங்கி, அவர்கள் உயிரோடு ஷியோலுக்கு[b] இறங்கினால், இந்த மனிதர்கள் யாவேயை இகழ்ந்திருக்கிறார்கள் என்பதை நீங்கள் அறிந்துகொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு படைப்பைப் படைத்து” அல்லது “புதிய ஒரு செயலைச் செய்து” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் சேர்ந்து, கடவுள் நிகழ்த்தும் அசாதாரணச் செயலை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “ஷியோல்” என்பது இறந்தோரின் உலகத்தைக் குறிக்கும் எபிரெயச் சொல்; இன்னும் நேரடியான பொருளில் “கல்லறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
