  rationale: אֲדָמָה இங்கு அவர்களுக்குக் கீழுள்ள நிலத்தைக் குறிக்கிறது; ‘தன் வாயைத் திறந்து’ என்ற உயிரூட்டப்பட்ட உருவகம் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: וּבָלְעָה
  choice: விழுங்கி
  rationale: בלע என்பதன் நேரடியான ‘விழுங்கு/முழுவதுமாக உட்கொள்’ என்ற காட்சிமிக்க பொருளை இயல்பான தமிழில் தருகிறது.
