theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை / இறந்தோரின் உலகம்
  rationale: இச்சொல் ஒரு தனிப்பட்ட புதைகுழியைவிட விரிவான, இறந்தோருக்குரிய நிலை அல்லது உலகைக் குறிக்கக்கூடும். ஒரே விளக்கத்துக்குள் அதைச் சுருக்காமல் மூலக் கருத்துலகையும் தெளிவின்மையையும் பாதுகாக்க எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: בְּרִיאָה יִבְרָא என்ற வலியுறுத்தல்
  choice: புதிதான ஒன்றைப் படைத்து
  alternative: ஒரு படைப்பைப் படைத்து / முன்னெப்போதும் இல்லாத ஒன்றை உருவாக்கி
  rationale: தெய்வீகமான அசாதாரணச் செயலை உணர்த்தும் அதேவேளையில், ‘முன்னெப்போதும் இல்லாதது’ என மூலத்தைவிட அதிகமாகத் தீர்மானிக்காமல் ‘புதிதான ஒன்று’ என மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை அமைப்பு, நிலம் வாயைத் திறப்பது என்ற உருவகம், ‘உயிரோடு’ இறங்குதல் என்ற இறையியல் பதற்றம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
