base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: ta
  text: அவர்கள் மோசேக்கும் ஆரோனுக்கும் எதிராக ஒன்றுகூடி, அவர்களிடம், “நீங்கள் வரம்பு மீறிவிட்டீர்கள்![a] சமூகத்தினர் அனைவரும்—ஒவ்வொருவரும்—பரிசுத்தமானவர்கள்; யாவே அவர்கள் நடுவில் இருக்கிறார்.[b] அப்படியிருக்க, யாவேயின் சபைக்கு மேலாக உங்களை ஏன் உயர்த்திக்கொள்கிறீர்கள்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “உங்களுக்கு மிகுதி”; “உங்களால் போதும்” என்றும் புரிந்துகொள்ளலாம். இது கடுமையான கண்டன மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது יהוה (YHWH) என்ற எபிரெய இறைப்பெயரின் ஒலிபெயர்ப்பு. “யெகோவா” என்பது ஒரு மரபுவழி மாற்று வடிவம்; பண்டைய உச்சரிப்பு உறுதியாகத் தெரியவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: எதிராக ஒன்றுகூடி
  rationale: நிஃபால் வடிவம் அவர்கள் கூட்டாக ஒன்றுகூடியதைச் சொல்கிறது; עַל இச்சூழலில் எதிர்ப்பைக் குறிக்கிறது.
- source_word: רַב לָכֶם
  choice: நீங்கள் வரம்பு மீறிவிட்டீர்கள்!
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உங்களுக்கு மிகுதி’ என இருந்தாலும், இங்கு அது கடுமையான கண்டன மரபுத்தொடர்; இயல்பான நவீன தமிழில் குற்றச்சாட்டின் வலிமையை இவ்வாறு தருகிறது.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: சபையார் அனைவரும்—அவர்கள் ஒவ்வொருவரும்—
  rationale: כָל ... כֻּלָּם என்பதிலுள்ள முழுமையை வலியுறுத்தும் இரட்டைக் கூறைத் தக்கவைக்கிறது.
- source_word: קְדֹשִׁים
  choice: பரிசுத்தமானவர்கள்
  rationale: קדשׁ என்பதன் வழக்கமான இறையியல் நிறையுள்ள பொருளைத் தருகிறது; பேச்சாளர்களின் கூற்றை விளக்கமோ மதிப்பீடோ சேர்க்காமல் நேரடியாகக் கூறுகிறது.
- source_word: וּבְתוֹכָם יְהוָה
  choice: யெகோவா அவர்கள் நடுவில் இருக்கிறார்
  rationale: சமூகத்தின் நடுவிலுள்ள இறைப் பிரசன்னத்தை இயல்பாக வெளிப்படுத்துகிறது; יהוה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: மேலாக உங்களை ஏன் உயர்த்திக்கொள்கிறீர்கள்
  rationale: התפעל வடிவத்தின் தற்சார்புப் பொருளையும், சபைக்கு மேலாகத் தம்மை உயர்த்துகின்றனர் என்ற குற்றச்சாட்டையும் காக்கிறது.
- source_word: קְהַל יְהוָה
  choice: யெகோவாவின் சபை
  rationale: கூடியிருக்கும் உடன்படிக்கை மக்களைக் குறிக்கும் קהל என்பதற்கு இயல்பான, மரியாதைக்குரிய தமிழாக்கம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய மூலத்தில் வரும் நான்கெழுத்துத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது. துல்லியமான பண்டைய உச்சரிப்பு உறுதியற்றது என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: ‘சபையார் அனைவரும் பரிசுத்தமானவர்கள்’ என்ற கூற்றை மதிப்பிடுதல்
  choice: பேச்சாளர்களின் கூற்றாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பரிசுத்தமானவர்கள் என்று கூறுகின்றனர்’ போன்ற தூரப்படுத்தும் சொற்களைச் சேர்த்தல்
  rationale: வசனத்துக்குள் ஆதரவையோ மறுப்பையோ இறக்குமதி செய்யாமல், அதன் இறையியல் பதற்றத்தையும் கதையோட்டத்தின் மதிப்பீட்டையும் காக்கிறது.
- issue: ரַב לָכֶם என்பதிலுள்ள குற்றச்சாட்டின் இயல்பு
  choice: நீங்கள் வரம்பு மீறிவிட்டீர்கள்
  alternative: உங்களுக்கு மிகுதி; உங்களால் போதும்
  rationale: மூல மரபுத்தொடரின் சரியான நுணுக்கம் ஒன்றுக்கு மேற்பட்ட விதத்தில் புரியக்கூடியதால், முதன்மை உரையில் இயல்பான கண்டனத்தைத் தந்து மாற்றுகளை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘சபையார்’ மற்றும் ‘சபை’ என்பவை עֵדָה, קהל ஆகிய தொடர்புடைய சொற்களை இயல்பான தமிழில் தருகின்றன; மூலத்தின் வலியுறுத்தல் இடைக்கோடுகளால் காக்கப்பட்டது.
