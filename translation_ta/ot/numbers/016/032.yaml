- from: அப்போது பூமி தன் வாயைத் திறந்து, அவர்களையும், அவர்களுடைய வீட்டாரையும்[a], கோராகுக்குச் சொந்தமான மக்கள் அனைவரையும்[b], அவர்களுடைய உடைமைகள் அனைத்தையும் விழுங்கியது.
  to: பூமி தன் வாயைத் திறந்து, அவர்களையும், அவர்களுடைய வீட்டாரையும்[a], கோராகுடன் சேர்ந்திருந்த மக்கள் அனைவரையும்[b], அவர்களுடைய உடைமைகள் அனைத்தையும் விழுங்கியது.
