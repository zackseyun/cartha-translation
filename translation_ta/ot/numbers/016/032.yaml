base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: ta
  text: பூமி தன் வாயைத் திறந்து, அவர்களையும், அவர்களுடைய வீட்டாரையும்[a], கோராகுடன் சேர்ந்திருந்த மக்கள் அனைவரையும்[b], அவர்களுடைய உடைமைகள் அனைத்தையும் விழுங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வீடுகளையும்.” எபிரெயச் சொல் கட்டடங்களாகிய வீடுகளையோ, விரிவான பொருளில் அந்த வீடுகளைச் சேர்ந்த குடும்பத்தாரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “கோராகுக்குரிய ஒவ்வொரு மனிதரையும்.” இங்கு எபிரெய மொழியில் “மனிதன்” என்பது ஒருமை வடிவில் இருந்தாலும் ஒரு குழுவைக் கூட்டாகக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: பூமி தன் வாயைத் திறந்து
  rationale: எபிரெய மூலத்தின் உயிரோட்டமான ‘பூமி தன் வாயைத் திறந்தது’ என்ற உருவகத்தைத் தட்டையாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתִּבְלַע אֹתָם
  choice: அவர்களை விழுங்கியது
  rationale: בלע என்பதன் நேரடியான பொருள் ‘விழுங்குதல்’; சூழலின் வலிமையையும் உருவகத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: בָּתֵּיהֶם
  choice: அவர்களுடைய வீட்டார்
  rationale: בַּיִת என்பதன் பன்மை வடிவம் கட்டடங்களையோ குடும்பக் குழுக்களையோ குறிக்கலாம். இச்சூழலில் மனிதர்களும் உடைமைகளும் தனித்தனியாகக் குறிப்பிடப்படுவதால், குடும்பத்தாரைக் குறிக்கும் ‘வீட்டார்’ இயல்பான முதன்மைத் தேர்வு.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: கோராகுக்குச் சொந்தமான மக்கள் அனைவரும்
  rationale: אָדָם இங்கு ஒருமை வடிவிலுள்ள கூட்டுப்பெயராகப் பயன்படுகிறது. ‘மக்கள் அனைவரும்’ அதன் கூட்டுப் பொருளைத் தெளிவாகத் தருகிறது; לְקֹרַח உறவு அல்லது சார்பை ‘கோராகுக்குச் சொந்தமான’ என்று வெளிப்படுத்துகிறது.
- source_word: כָּל־הָרֲכוּשׁ
  choice: அவர்களுடைய உடைமைகள் அனைத்தும்
  rationale: רְכוּשׁ என்பது சொத்து, பொருள், உடைமைகள் ஆகியவற்றைக் குறிக்கும்; ‘உடைமைகள்’ நவீன தமிழில் தெளிவானதும் பரந்த பொருளுடையதும் ஆகும்.
theological_decisions:
- issue: אָדָם என்ற ஒருமை வடிவிலுள்ள கூட்டுச்சொல்லின் மொழிபெயர்ப்பு
  choice: மக்கள் அனைவரும்
  alternative: ஒவ்வொரு மனிதரும்
  rationale: இங்கு כָּל־הָאָדָם முழுக் குழுவையும் கூட்டாகக் குறிக்கிறது. தமிழில் ‘மக்கள் அனைவரும்’ இயல்பாகவும் மூலத்தின் கூட்டுப் பொருளுக்கு ஏற்றதாகவும் உள்ளது; இலக்கண வடிவை நெருக்கமாகக் காட்டும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘பூமி தன் வாயைத் திறந்து… விழுங்கியது’ என்ற மனிதப்பண்பேற்ற உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
