base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: ta
  text: அப்போது அவர்கள் முகங்குப்புற விழுந்து, “கடவுளே, எல்லா மனிதரின் ஆவிகளின் கடவுளே[a], ஒரே ஒரு மனிதன் பாவம் செய்தால்[b], சபை முழுவதின்மீதும் நீர் கோபங்கொள்வீரா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள அனைவரின் உயிர்மூச்சுகளின் கடவுளே.” இவ்வாசிப்பு, எல்லா உயிர்களுக்கும் உயிர்மூச்சைக் கொடுப்பவர் கடவுள் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஒரே ஒரு மனிதன்” என்பது பிரதிநிதித்துவப் பொருளிலும் அமையலாம்; ஒரு தனிநபரின் பாவம் சபை முழுவதின்மீதும் கோபத்தை வரவழைக்கக்கூடாது என்பதே இந்த வேண்டுகோள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: அவர்கள் முகங்குப்புற விழுந்து
  rationale: தாழ்மை, அச்சம் அல்லது பரிந்துபேசுதல் ஆகியவற்றைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: கடவுளே, எல்லா மனிதரின் ஆவிகளுக்கும் கடவுளே
  rationale: இது கடவுளை நேரடியாக அழைக்கும் சொல்லமைப்பையும், ஒவ்வொரு மனிதரின் உள்ளார்ந்த உயிரையும் ஆவியையும் அறிந்து ஆளுகிறவர் என்ற சூழல்சார் பொருளையும் காக்கிறது. לְכָל־בָּשָׂר என்பதைக் தமிழில் இயல்பாக ‘எல்லா மனிதரின்’ என்று வழங்குகிறது.
- source_word: הָאִישׁ אֶחָד
  choice: ஒரே ஒரு மனிதன்
  rationale: ஆண்பால் ஒருமையையும் ‘ஒருவன் மட்டும்’ என்ற வலியுறுத்தலையும் காக்கிறது; அது பிரதிநிதித்துவப் பொருளில் அமையக்கூடிய சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: יֶחֱטָא
  choice: பாவம் செய்தால்
  rationale: எபிரெய வினையின் நிறைவுபெறாத வடிவத்தை நிபந்தனை சார்ந்த சொல்லாட்சியாக இயல்பான தமிழில் தருகிறது; குற்றத்தின் தனிப்பட்ட தன்மையையும் அதைத் தொடர்ந்து வரும் கூட்டுத் தண்டனை பற்றிய கேள்வியையும் இணைக்கிறது.
- source_word: וְעַל כָּל־הָעֵדָה תִּקְצֹף
  choice: சபை முழுவதின்மீதும் நீர் கோபங்கொள்வீரா?
  rationale: עַל குறிக்கும் கோபத்தின் இலக்கை ‘மீதும்’ எனவும், עֵדָה குறிக்கும் இஸ்ரவேல் சமூகக் கூட்டத்தை ‘சபை’ எனவும் தெளிவாக வழங்குகிறது; மரியாதை ஒருமையான ‘நீர்’ தெய்வத்தை நோக்கிய நேரடி உரைக்கு ஏற்றது.
theological_decisions:
- issue: ‘எல்லா மனிதரின் ஆவிகள்’ என்பதன் மானிடவியல் பொருள்
  choice: ஒவ்வொரு மனிதரின் உள்ளார்ந்த உயிரையும் ஆவியையும் அறிந்து ஆளுகிற கடவுளைக் குறிக்கும் பட்டப்பெயர்
  alternative: உயிருள்ள அனைவருக்கும் மூச்சையும் உயிரையும் கொடுக்கும் கடவுளைக் குறிக்கும் பட்டப்பெயர்
  rationale: ஒருவரின் குற்றத்தையும் முழுச் சமூகத்தின் பொறுப்பையும் வேறுபடுத்துமாறு மோசேயும் ஆரோனும் வேண்டிக்கொள்ளும் சூழலுக்கு ‘ஆவிகள்’ பொருந்துகிறது; எனினும் ‘மூச்சு’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: הָאִישׁ אֶחָד என்பதிலுள்ள பாலினமும் பிரதிநிதித்துவப் பொருளும்
  choice: ஒரே ஒரு மனிதன்
  alternative: ஒரே ஒருவர்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமையை முதன்மை உரை காக்கிறது; அந்த ஒருமை ஒரு தனிநபரைப் பிரதிநிதித்துவ முறையில் குறிக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, வாசிக்க எளிய, அதே நேரத்தில் இறைவனை நோக்கிய உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முகங்குப்புற விழுந்து’ என்ற தெளிவான உடல் உருவகமும், ‘சபை’, ‘பாவம்’, ‘கோபங்கொள்வீர்’ போன்ற பொதுவாகப் புரியும் வேதாகமச் சொற்களும் காக்கப்பட்டுள்ளன.
