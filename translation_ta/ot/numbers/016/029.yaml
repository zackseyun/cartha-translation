id: NUM.16.29
reference: Numbers 16:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: ta
  text: இவர்கள் எல்லா மனிதர்களும் இறப்பதுபோல் இறந்து, எல்லா மனிதர்களுக்கும் நேரிடுவது இவர்களுக்கும் நேரிட்டால், யாவே என்னை அனுப்பவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: இவர்கள் ... இறந்தால்
  rationale: மோசே முன்வைக்கும் நிபந்தனையை இயல்பான தமிழ் நிபந்தனை விகுதி தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּמוֹת כָּל הָאָדָם
  choice: எல்லா மனிதர்களையும் போல இறந்தால்
  rationale: כְּמוֹת என்ற ஒப்புமைக் கட்டமைப்பையும், אָדָם என்பதன் பொதுவான மனிதகுலப் பொருளையும் இயல்பான தமிழில் காக்கிறது; சொல்லுக்குச் சொல் அமைப்பைத் திணிக்கவில்லை.
- source_word: יְמֻתוּן אֵלֶּה
  choice: இவர்கள் ... இறந்தால்
  rationale: אֵלֶּה கோராகையும் அவனோடு சேர்ந்தவர்களையும் சுட்டுகிறது; பாலினத்தைத் தேவையின்றி சேர்க்காமல் ‘இவர்கள்’ என வழங்கப்படுகிறது.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: எல்லா மனிதர்களுக்கும் நேரிடுவது இவர்களுக்கும் நேரிட்டால்
  rationale: פקד என்ற வேரின் பெயர்ச்சொல்–வினைச்சொல் மீளுருவை தமிழில் இயன்றவரை ‘நேரிடுவது—நேரிட்டால்’ எனக் காத்து, சாதாரண மனிதருக்கு உண்டாகும் நிலை அல்லது முடிவு என்ற சூழல்பொருளை வெளிப்படுத்துகிறது.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: யாவே என்னை அனுப்பவில்லை
  rationale: எபிரெய வாக்கியத்தின் முடிவை நேரடியாகக் காக்கிறது; நிறைவேறிய அனுப்புதலைத் தமிழ் இறந்தகாலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரைப் பதிலிடாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: כָּל הָאָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: எல்லா மனிதர்களும் / எல்லா மனிதர்களுக்கும்
  alternative: எல்லா ஆண்களும் / மனிதகுலம்
  rationale: இங்கு אָדָם ஆண்களை மட்டும் குறிக்காமல் மனிதர்களின் பொதுவான நிலையைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் இயல்பாக இருக்க ‘எல்லா மனிதர்கள்’ என்ற வடிவம் பயன்படுத்தப்படுகிறது.
- issue: פְּקֻדָּה மற்றும் פקד என்பவற்றின் சூழல்பொருள்
  choice: நேரிடுவது ... நேரிட்டால்
  alternative: விசாரிப்பு ... விசாரிக்கப்பட்டால் / தண்டனை ... விதிக்கப்பட்டால்
  rationale: இந்தச் சொல்வேர் விசாரிப்பு, நியமிப்பு, ஒருவருக்கு நிகழ்வது போன்ற பல நிழற்பொருள்களைக் கொள்ளும். இங்கு ‘தண்டனை’ என்று மட்டும் குறுக்காமல், மனிதர்களுக்கு வழக்கமாக நேரும் முடிவு என்ற திறந்த பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் இரட்டை நிபந்தனை அமைப்பும் פקד வேரின் மீளுருவும் இயன்ற அளவு இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
