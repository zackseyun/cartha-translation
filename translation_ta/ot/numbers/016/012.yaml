- from: பின்பு மோசே, எலியாபின் மகன்களான தாத்தானையும் அபிராமையும் அழைத்துவர ஆளனுப்பினார். ஆனால் அவர்கள், “நாங்கள் மேலே வரமாட்டோம்[a]” என்றார்கள்.
  to: பின்பு எலியாபின் மகன்களான தாத்தானையும் அபிராமையும் வரவழைக்க மோசே ஆளனுப்பினார். ஆனால் அவர்கள், “நாங்கள் மேலே வரமாட்டோம்[a]” என்றார்கள்.
  rationale: The revision avoids the possible added nuance of having the men fetched or brought, while preserving Moses’ official summons, the sons-of-Eliab identification, the adversative response, and the Hebrew directional ambiguity in both text and footnote.
