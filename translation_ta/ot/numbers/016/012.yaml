  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: ta
  text: பின்பு எலியாபின் மகன்களான தாத்தானையும் அபிராமையும் வரவழைக்க மோசே ஆளனுப்பினார். ஆனால் அவர்கள், “நாங்கள் மேலே வரமாட்டோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் மேலே போகமாட்டோம்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “மேலே போ/ஏறு” என்பதாகும். இங்கு அது மோசே இருந்த இடத்துக்குச் செல்வதையோ, அவரது அழைப்பை ஏற்று அவர்முன் ஆஜராவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பினார்
  rationale: שׁלח என்பது மோசே அவர்களை வரவழைக்க ஒருவரை அனுப்பியதைச் சுருக்கமாகக் குறிக்கிறது; தூதர் யார் என்பதை மிகையாகக் குறிப்பிடாமல் இயல்பான தமிழில் தருகிறது.
- source_word: לִקְרֹא
  choice: அழைத்துவர
  rationale: இங்கு קרא, ஒருவரை வரும்படி அழைப்பது அல்லது வரவழைப்பது என்ற பொருளில் வருகிறது. சூழலில் உள்ள அதிகாரபூர்வ அழைப்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דָתָן וַאֲבִירָם
  choice: தாத்தானையும் அபிராமையும்
  rationale: தனிப்பெயர்கள் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கேற்ப தரப்பட்டுள்ளன.
- source_word: בְּנֵי אֱלִיאָב
  choice: எலியாபின் மகன்களான
  rationale: இருவரையும் எலியாபின் மகன்கள் என்று அடையாளப்படுத்தும் எபிரெய உறவுமுறையை இயல்பான தமிழ் அடைமொழித் தொடராகத் தருகிறது.
- source_word: וַיֹּאמְרוּ
  choice: ஆனால் அவர்கள் ... என்றார்கள்
  rationale: וַ என்பது வடிவில் ‘அப்போது/மேலும்’ என்ற தொடர்ச்சியைத் தரினும், இங்கு அழைப்புக்கு எதிரான மறுப்பு பதிலைச் சுட்டுவதால் ‘ஆனால்’ சூழலின் முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא נַעֲלֶה
  choice: நாங்கள் மேலே வரமாட்டோம்
  rationale: עלה என்பதன் நேரடிப் பொருளான ‘மேலே ஏறு/போ’ என்ற திசைநுட்பத்தைப் பாதுகாக்கிறது; மறுப்பு வாக்கியத்தில் imperfect வடிவம் உறுதியான மறுப்பாக ‘வரமாட்டோம்’ என்று தரப்பட்டுள்ளது.
