translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மேலே வரமாட்டோம்’ என்ற சொற்றொடர் மூலத்தின் இடத்திசை சார்ந்த நுட்பத்தையும், அழைப்பை உறுதியாக மறுக்கும் தொனியையும் காக்கிறது; சாத்தியமான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
