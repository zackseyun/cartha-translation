  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: ta
  text: ஆகவே, நீயும் உன் கூட்டத்தார்[a] அனைவரும் யாவேக்கு[b] எதிராக ஒன்று கூடியிருக்கிறீர்கள்; ஆரோன் எம்மாத்திரம், நீங்கள் அவருக்கு எதிராக முறுமுறுக்கிறீர்கள்[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் கூட்டம்’ அல்லது ‘உன் சபை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரேயத்தில் வரும் YHWH என்ற இறைப்பெயரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு நெருக்கமாக, ‘ஆரோன் என்ன, நீங்கள் அவருக்கு எதிராக முறுமுறுக்கிறீர்கள்?’ எபிரேய வினா ஆரோனின் தனிப்பட்ட முக்கியத்துவத்தைச் சிறுமைப்படுத்தி, கலகம் உண்மையில் யாவேக்கு எதிரானது என்பதை வலியுறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய குற்றச்சாட்டிலிருந்து மோசே கூறும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עֲדָתְךָ
  choice: உன் கூட்டத்தார்
  rationale: கோராகுடன் சேர்ந்த பிரிவினரைக் குறிக்கிறது; ‘சபை’ என்பதைக் காட்டிலும் இச்சூழலில் ‘கூட்டத்தார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַנֹּעָדִים
  choice: கூடியிருக்கிறீர்கள்
  rationale: ஒப்பந்தத்தோடு அல்லது ஒரு நோக்கத்திற்காக ஒன்று கூடிவந்த நிலையைக் குறிக்கும் நிஃபால் வடிவத்தின் பொருளைப் பேணுகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: கலகமும் முறுமுறுப்பும் இடம்பெறும் சூழலில் எதிர்ப்பைக் குறிக்கும் பொருளே பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: ஆரோன்தான் யார்?
  rationale: கலகத்தின் உண்மையான இலக்கு யாவே என்பதற்கு மாறாக, ஆரோனின் தனிப்பட்ட முக்கியத்துவத்தைக் குறைத்துக் காட்டும் வினாவை இயல்பான தமிழில் பேணுகிறது.
- source_word: תלונו
  choice: முறுமுறுப்பதற்கு
  rationale: வனாந்தர நிகழ்வுகளில் திரும்பத் திரும்ப வரும் அதிருப்தியும் கலகத் தன்மையும் கொண்ட குறைகூறுதலை ‘முறுமுறுத்தல்’ நன்கு வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அவருக்கு எதிராக
  rationale: குறை ஆரோனை நோக்கி எதிர்ப்புடன் கூறப்படுவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது; ஆகவே அந்த உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: கலகத்தின் உண்மையான இலக்கு
  choice: கூட்டம் யாவேக்கு எதிராகக் கூடியதாக முதலில் கூறி, பின்னர் ஆரோனின் நிலையை வினாவாகக் குறைத்துக் காட்டுதல்
  alternative: அவர்கள் யாவேக்கும் ஆரோனுக்கும் சமமாக எதிராகக் கூடியதாக மொழிபெயர்த்தல்
  rationale: எபிரெய வாக்கிய அமைப்பு முதன்மையாக யாவேக்கு எதிரான கலகத்தைச் சுட்டுகிறது; ஆரோனைப் பற்றிய ‘அவர் யார்?’ என்ற வினா அவரது தனிப்பட்ட நிலையை இரண்டாம் பட்சமாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘ஆரோன்தான் யார்?’ என்பது மூலத்தின் சொல்லாட்சியை இயல்பாக்கினாலும் அதன் சொல்லாட்சிசார் நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
