- from: ஆகவே, நீயும் உன் கூட்டத்தார்[a] அனைவரும் யாவேக்கு[b] எதிராகக் கூடியிருக்கிறீர்கள். அவருக்கு எதிராக நீங்கள் முறுமுறுப்பதற்கு ஆரோன்தான் யார்[c]?
  to: ஆகவே, நீயும் உன் கூட்டத்தார்[a] அனைவரும் யாவேக்கு[b] எதிராக ஒன்று கூடியிருக்கிறீர்கள்; ஆரோன் எம்மாத்திரம், நீங்கள் அவருக்கு எதிராக முறுமுறுக்கிறீர்கள்[c]?
  rationale: The revision retains the inferential “ஆகவே,” the assembled group’s opposition to Yahweh, and the adversative sense of the grumbling. It restores the Hebrew sequence by placing “ஆரோன் எம்மாத்திரம்” before the clause concerning grumbling, while using a natural Tamil rhetorical question. Footnote c is updated to match the revised wording and explain, rather than overstate, the rhetorical force.
