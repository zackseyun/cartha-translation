- from: எனவே அவர்கள் கோராகு[a], தாத்தான், அபிராம் ஆகியோரின் குடியிருப்பைச் சுற்றியிருந்த இடத்திலிருந்து விலகிச் சென்றார்கள். தாத்தானும் அபிராமும் தங்கள் மனைவிகளோடும் மகன்களோடும் சிறு பிள்ளைகளோடும் தங்கள் கூடாரங்களின் வாசலில் வந்து நின்றார்கள்.
  to: அதனால், அவர்கள் கோராகு, தாத்தான், அபிராம் ஆகியோரின் குடியிருப்பின்[b] சுற்றுப்புறத்திலிருந்து விலகிச் சென்றார்கள்[a]. தாத்தானும் அபிராமும் தங்கள் மனைவிகளோடும் மகன்களோடும் சிறு பிள்ளைகளோடும் தங்கள் கூடாரங்களின் வாசலில் வெளியே வந்து நின்றார்கள்.
