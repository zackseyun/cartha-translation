  verdict: revise
  source_fidelity: 'முதன்மை உரை பெரும்பாலும் எபிரெய மூலத்திற்கு உண்மையாக உள்ளது: இடத்தைவிட்டு விலகுதல், தாத்தான் மற்றும் அபிராம் வெளியே வந்து நிற்றல், கூடாரங்கள் பன்மை, மனைவிகள், மகன்கள், சிறு பிள்ளைகள் ஆகிய வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன. ஆனால் அடிக்குறிப்பு a, கோராகு என்ற பெயருடன் தவறாக இணைக்கப்பட்டுள்ளது; அது முதல் வினைச்சொல்லின் மாற்று வாசிப்புடன் இணைக்கப்பட வேண்டும். மேலும் מִשְׁכָּן என்பதற்கான விளக்க அடிக்குறிப்பு இல்லாததால், அது கர்த்தருடைய திருக்கூடாரம் அல்ல என்ற முக்கியமான சூழல் வேறுபாடு வெளிப்படவில்லை.'
  naturalness: ‘குடியிருப்பின் சுற்றுப்புறத்திலிருந்து விலகிச் சென்றார்கள்’ என்பது நவீன தரத் தமிழில் இயல்பாகவும் இடவியல் பொருளைத் துல்லியமாகவும் தருகிறது. ‘வெளியே வந்து ... வாசலில் நின்றார்கள்’ என்பது மூலத்தில் உள்ள வெளியேறுதலையும் நிற்றலையும் தெளிவாக வெளிப்படுத்துகிறது.
  terminology: ‘குடியிருப்பு’ מִשְׁכָּன் என்பதற்கு ஏற்றது; இது கர்த்தருடைய திருக்கூடாரத்தைக் குறிக்கிறது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. ‘மகன்கள்’ மற்றும் ‘சிறு பிள்ளைகள்’ தனித்தனியாக வைக்கப்பட வேண்டும். பெயர்களின் நடப்பிலுள்ள திட்ட எழுத்துப்பெயர்ப்பான ‘கோராகு, தாத்தான், அபிராம்’ பாதுகாக்கப்பட்டுள்ளது.
