translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘குடியிருப்பு’ என்பது இங்கு ஆண்டவருடைய திருவாசஸ்தலம் அல்ல என்பதைச் சூழலிலேயே உணர்த்துகிறது. குடும்ப உறுப்பினர்களைக் குறிக்கும் எபிரெயச் சொற்களின் வேறுபாடு காக்கப்பட்டுள்ளது.
