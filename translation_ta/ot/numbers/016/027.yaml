base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: ta
  text: அதனால், அவர்கள் கோராகு, தாத்தான், அபிராம் ஆகியோரின் குடியிருப்பின்[b] சுற்றுப்புறத்திலிருந்து விலகிச் சென்றார்கள்[a]. தாத்தானும் அபிராமும் தங்கள் மனைவிகளோடும் மகன்களோடும் சிறு பிள்ளைகளோடும் தங்கள் கூடாரங்களின் வாசலில் வெளியே வந்து நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோராகு, தாத்தான், அபிராம் ஆகியோரின் குடியிருப்பின் சுற்றுப்புறத்திலிருந்து மேலே சென்றார்கள்.” எபிரெய வினைச்சொல் சொற்படியாக “மேலே சென்றார்கள்” என்று பொருள்படும்; ஆனால் இச்சூழலில் அந்த இடத்திலிருந்து விலகிச் சென்றார்கள் என்பதே பொருத்தமான பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘குடியிருப்பு’ என்பது இங்குள்ள எபிரெய மிஷ்கான் என்ற சொல்லின் மொழிபெயர்ப்பு. இது கர்த்தருடைய திருக்கூடாரத்தை அல்ல; கோராகு, தாத்தான், அபிராம் ஆகியோருடன் தொடர்புடைய வசிப்பிடம் அல்லது முகாமிடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: சுற்றியிருந்த இடத்திலிருந்து விலகிச் சென்றார்கள்
  rationale: וַיֵּעָלוּ என்பதன் அடிப்படைப் பொருள் ‘மேலே சென்றார்கள்’ என்றாலும், מֵעַל மற்றும் מִסָּבִיב உடன் இச்சூழலில் அது அந்தப் பகுதியிலிருந்து அகன்று செல்வதைக் குறிக்கிறது. இயல்பான தமிழில் இடவியல் கருத்தைத் தெளிவாகத் தருகிறது; நேரடி மாற்றை அடிக்குறிப்பு காக்கிறது.
- source_word: מִשְׁכַּן
  choice: குடியிருப்பு
  rationale: இங்கு இது கர்த்தருடைய திருவாசஸ்தலத்தைக் குறிக்காமல், கோராகு, தாத்தான், அபிராம் ஆகியோருடன் தொடர்புடைய வசிப்பிடம் அல்லது முகாமிடத்தைக் குறிக்கிறது. ‘குடியிருப்பு’ இந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: יָצְאוּ נִצָּבִים
  choice: வந்து நின்றார்கள்
  rationale: அவர்கள் கூடாரங்களிலிருந்து வெளியே வந்து வாசலில் நின்ற காட்சியை இயல்பான தமிழில் தருகிறது. ‘எதிர்த்து நின்றார்கள்’ எனக் கூறுவது மூலச்சொல்லுக்கு அப்பாற்பட்ட எதிர்ப்புணர்வைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: தங்கள் கூடாரங்களின் வாசலில்
  rationale: எபிரெய மூலத்தில் ‘கூடாரங்கள்’ பன்மையாக உள்ளது; அதைப் பாதுகாத்து, פֶּתַח என்பதற்கு இயல்பான ‘வாசல்’ பயன்படுத்தப்படுகிறது.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: தங்கள் மனைவிகளோடும் மகன்களோடும் சிறு பிள்ளைகளோடும்
  rationale: בְּנֵיהֶם என்பதிலுள்ள ‘மகன்கள்’ என்பதையும், טַף குறிக்கும் சிறு பிள்ளைகள்/சிறியோர் என்பதையும் தனித்தனியாகக் காக்கிறது.
