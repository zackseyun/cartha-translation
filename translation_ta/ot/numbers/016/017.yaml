  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: ta
  text: நீங்கள் ஒவ்வொருவரும் அவரவர் தூபக்கலசத்தை[b] எடுத்துக்கொண்டு, அவற்றின்மேல் தூபப்பொருளை வைத்து, யாவேக்கு[a] முன்பாக அவரவர் தூபக்கலசத்தைக் கொண்டுவருங்கள்—இருநூற்று ஐம்பது தூபக்கலசங்கள்; நீயும் ஆரோனும், ஒவ்வொருவரும் தங்கள் தூபக்கலசத்தைக் கொண்டுவருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH (יהוה). மரபாக ‘கர்த்தர்’ என்றும், மாற்றாக ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘நெருப்புத்தட்டு’; நெருப்புக் கரிகளின்மேல் தூபம் எரிக்கப் பயன்படுத்தப்பட்ட பாத்திரம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: நீங்கள் ஒவ்வொருவரும் அவரவர் தூபக்கலசத்தை எடுத்துக்கொண்டு
  rationale: பன்மை கட்டளையையும் אִישׁ ...־וֹ என்பதன் பகிர்நிலைப் பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: தூபக்கலசம் / தூபக்கலசங்கள்
  rationale: நெருப்புக் கரிகளுடன் தூபம் எரிக்கப் பயன்படும் சடங்குப் பாத்திரத்தைத் தமிழில் தெளிவாகக் குறிக்கிறது; சொற்பொருளுக்கு நெருக்கமான ‘நெருப்புத்தட்டு’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: அவற்றின்மேல் தூபப்பொருளை வைத்து
  rationale: עַל என்பதன் ‘மேல்’ உறவைப் பாதுகாக்கிறது; கְטֹרֶת என்பது எரிக்கப்படும் பொருள் என்பதால் ‘தூபப்பொருள்’ என்று தெளிவுபடுத்தப்படுகிறது.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக ... கொண்டுவருங்கள்
  rationale: קרב என்பதன் கொண்டுவருதல்/அருகே கொண்டுவருதல் என்ற வழிபாட்டுச் சூழலையும் לִפְנֵי என்பதன் ‘முன்பாக’ என்ற பொருளையும் இயல்பாக அளிக்கிறது.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: மொத்தம் இருநூற்று ஐம்பது தூபக்கலசங்கள்
  rationale: எண்ணிக்கையை எழுத்தில் வழங்கி, இது கோராகின் கூட்டத்தாருடைய கலசங்களின் மொத்த எண்ணிக்கை என்பதை ‘மொத்தம்’ தெளிவாக்குகிறது.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: நீயும் ஆரோனும் அவரவர் தூபக்கலசத்தைக் கொண்டுவர வேண்டும்
  rationale: வினையில்லாத சுருக்கமான எபிரெயச் சொற்றொடரில் முந்தைய கட்டளை தொடர்வதைத் தமிழில் தேவையான வினையுடன் வெளிப்படுத்தி, பகிர்நிலை ஒருமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயரே உள்ளது; ‘யாவே’ அதைத் தமிழில் ஒலிபெயர்த்து, பெயருக்கும் பட்டத்துக்கும் உள்ள வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, வாசிக்க எளிதான நடையைக் கடைப்பிடிக்கிறது. முதல் கட்டளையின் பன்மையையும் ஒவ்வொருவருக்குமான பகிர்நிலையையும் ‘நீங்கள் ஒவ்வொருவரும் அவரவர்’ எனவும், மோசே மற்றும் ஆரோனைச் சுட்டும் ஒருமை வடிவை ‘நீயும் ஆரோனும்’ எனவும் வேறுபடுத்துகிறது. ‘அவற்றின்மேல்’ என்பது மூல முன்னிடைச்சொல்லின் திசையைப் பாதுகாக்கிறது.
