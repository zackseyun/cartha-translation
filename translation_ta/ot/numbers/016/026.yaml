source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: ta
  text: அவர் சபையினரிடம், “தயவுசெய்து இந்தப் பொல்லாத மனிதர்களின் கூடாரங்களைவிட்டு விலகிச் செல்லுங்கள். அவர்களுக்குச் சொந்தமான எதையும் தொடாதீர்கள். இல்லாவிட்டால், அவர்களுடைய எல்லாப் பாவங்களால் வருகிற அழிவில் நீங்களும் அழிந்துபோவீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய எல்லாப் பாவங்களின் காரணமாக நீங்களும் அழிந்துபோவீர்கள்.’ எபிரெய வாசகத்தை இன்னும் வெளிப்படையான காரணப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: இது இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ என்பது அதன் கூட்டான தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סוּרוּ נָא
  choice: தயவுசெய்து ... விலகிச் செல்லுங்கள்
  rationale: סוּר விலகிச் செல்லும்படி கட்டளையிடுகிறது; נָא அவசரமான வேண்டுகோள் தொனியைச் சேர்க்கிறது. இந்தத் தொடர் இரண்டையும் தக்கவைக்கிறது.
- source_word: מֵעַל אָהֳלֵי
  choice: கூடாரங்களைவிட்டு
  rationale: இங்கு מֵעַל என்பது கூடாரங்களின் அருகிலிருந்து அகல்வதைச் சூழலுக்கேற்ற வகையில் குறிக்கிறது.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: இந்தப் பொல்லாத மனிதர்கள்
  rationale: குறிப்பிட்ட ஆண்களைச் சுட்டுவதையும் רְשָׁעִים என்பதன் ஒழுக்க மற்றும் நீதித்துறை சார்ந்த எதிர்மறைப் பொருளையும் இது தக்கவைக்கிறது.
- source_word: וְאַל תִּגְּעוּ
  choice: எதையும் தொடாதீர்கள்
  rationale: נגע என்பதன் நேரடியான ‘தொடு’ என்ற பொருளை மேலதிக விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: அவர்களுக்குச் சொந்தமான எதையும்
  rationale: அவர்களுடைய உடைமைகள் அனைத்தையும் உள்ளடக்கும் எபிரெய வெளிப்பாட்டை எதிர்மறைக் கட்டளைக்கேற்ற இயல்பான தமிழில் வழங்குகிறது.
- source_word: פֶּן תִּסָּפוּ
  choice: இல்லாவிட்டால் ... நீங்களும் அழிந்துபோவீர்கள்
  rationale: வரவிருக்கும் நியாயத்தீர்ப்பில் அவர்களுடன் சேர்த்து அழிக்கப்படும் அபாயத்தைக் குறிக்கும் Niphal வினையின் செயப்படுபொருள் சார்ந்த கருத்தை இயல்பான எச்சரிக்கை வடிவில் தருகிறது.
- source_word: בְּכָל חַטֹּאתָם
  choice: அவர்களுடைய எல்லாப் பாவங்களோடு
  rationale: ב என்ற முன்னிடைச்சொல் தொடர்பையோ சூழ்நிலையையோ, காரணத்தையோ குறிக்கக்கூடும். ‘பாவங்களோடு’ என்பது அதை முற்றிலும் காரணவிளக்கமாக மாற்றாமல் தொடர்பின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பொல்லாதவர்களோடு தொடர்பில் இருப்பதால் அவர்களுக்கான நியாயத்தீர்ப்பில் கூட்டாகச் சிக்கிக்கொள்ளுதல்
  choice: மக்கள் பொல்லாதவர்களிடமிருந்தும் அவர்களுடைய உடைமைகளிடமிருந்தும் விலகாவிட்டால், அவர்களுடைய பாவங்களோடு தொடர்புடைய அழிவில் தாங்களும் சிக்குவார்கள் என்ற எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘அவர்களுடைய எல்லாப் பாவங்களின் காரணமாக நீங்களும் அழிந்துபோவீர்கள்’ என்று இறுதிக் கூற்றை முழுமையான காரணத் தொடர்பாக மொழிபெயர்க்கலாம்.
  rationale: எபிரெய வாசகம் அருகாமை அல்லது தொடர்பையும் வரவிருக்கும் நியாயத்தீர்ப்பையும் இணைக்கிறது. பிறருடைய குற்றம் சுமத்தப்படுதல் என்ற கோட்பாட்டை உள்ளே கொண்டுவராமலும், இதை வெறும் காரணத் தொடர்பாகச் சுருக்காமலும் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘தயவுசெய்து’ என்பது נָא-வின் வேண்டுகோள் தொனியையும், ‘விலகிச் செல்லுங்கள்’ கட்டளையின் அவசரத்தையும் தருகிறது. இறுதிக் கூற்றில் எபிரெய முன்னிடைச்சொல்லின் தொடர்பு/காரணம் சார்ந்த இருபொருள் வாய்ப்பு முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
