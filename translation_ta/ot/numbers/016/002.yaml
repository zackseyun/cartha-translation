  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: ta
  text: அவர்கள் மோசேயின் முன் எழுந்தார்கள்; இஸ்ரவேல் மக்களில் இருநூற்று ஐம்பது பேரும் அவர்களோடு எழுந்தார்கள். இந்த இருநூற்று ஐம்பது பேரும் சபையின் தலைவர்களாகவும், சபைக் கூட்டத்திற்கு அழைக்கப்பட்டவர்களாகவும்[a], புகழ்பெற்ற மனிதர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியமிக்கப்பட்ட கூட்டத்திற்கு அழைக்கப்பட்டவர்கள்.’ இந்த எபிரெயச் சொற்றொடர் சமூகத்தின் குறிப்பிட்ட கூடுகைக்கு அதிகாரப்பூர்வமாக வரவழைக்கப்பட்டவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து நின்றார்கள்
  rationale: קום என்பதன் Qal தொடர் வினை வடிவம் எழுதல் அல்லது நின்றுகொள்ளுதல் என்ற செயலைக் குறிக்கிறது. சூழலில் எதிர்ப்பு உள்ளபோதிலும், வினையிலேயே ‘கலகம் செய்தார்கள்’ என்று அதிகமாக விளக்காமல் செயற்பாட்டை இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அடிப்படையான இடம்/உறவு பொருளான ‘முன்னிலையில், முன்பாக’ என்பதைக் காக்கிறது; மோதலின் உணர்வைச் சூழல் வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: அவர்களுடன் இஸ்ரவேல் மக்களில் ... பேர்
  rationale: எபிரெய உரையில் வினைக்குப் பிந்தைய இணைப்பு சுருக்கமாக உள்ளது. தமிழ் தொடரைத் தெளிவாக்க ‘அவர்களுடன்’ சேர்க்கப்பட்டுள்ளது; בְּנֵי יִשְׂרָאֵל என்பது இங்கு இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: இருநூற்று ஐம்பது
  rationale: எண்ணின் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: נְשִׂיאֵי עֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נָשִׂיא என்பது தலைவர் அல்லது முதன்மையானவர்; עֵדָה என்பது கூடிய சமூகத்தைச் சுட்டுகிறது. ‘சபை’ வேதாகமச் சூழலில் புரியக்கூடிய, சுருக்கமான சமூகப் பெயர்.
- source_word: קְרִאֵי מוֹעֵד
  choice: கூடுகைக்கு அழைக்கப்பட்டவர்கள்
  rationale: குறிப்பிட்ட சமூகக் கூடுகைக்கு அதிகாரப்பூர்வமாக அழைக்கப்பட்டவர்களைக் குறிக்கக்கூடிய செயப்பாட்டு பெயரடைத் தொடரை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אַנְשֵׁי שֵׁם
  choice: புகழ்பெற்ற மனிதர்கள்
  rationale: சொல்லடியாக ‘பெயருடைய மனிதர்கள்’; நடைமுறைப் பொருள் நற்பெயர், புகழ் அல்லது சிறப்பு பெற்றவர்கள் என்பதாகும். ‘புகழ்பெற்ற’ என்ற சொல் அந்த எபிரெய மரபுத்தொடரின் வலிமையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: எழுந்து நின்ற செயலின் எதிர்ப்புத் தன்மை
  choice: வினையில் ‘கலகம் செய்தார்கள்’ என்று வெளிப்படையாகச் சேர்க்கப்படவில்லை
  alternative: மோசேக்கு எதிராகக் கிளர்ந்தெழுந்தார்கள்
  rationale: לִפְנֵי என்பதன் அடிப்படைப் பொருள் ‘முன்பாக’; சூழல் மோதலைக் காட்டினாலும், இந்தச் சொற்றொடர் தனியாகவே ‘எதிராக’ என்று தீர்மானிக்க வேண்டியதில்லை. மூலத்தின் பதற்றமும் தெளிவின்மையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் கண்ணியமான நடையிலும் அமைக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் பன்மை எழுவாயை ‘அவர்கள்’ எனத் தக்கவைத்துள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
