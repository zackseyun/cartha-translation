  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: ta
  text: யாவேயிடமிருந்து நெருப்பு புறப்பட்டு வந்து, தூபம் செலுத்திக் கொண்டிருந்த இருநூற்று ஐம்பது பேரையும் எரித்து அழித்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகள், “யாவேயின் முன்னிலையிலிருந்து” என்று தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: நெருப்பு
  rationale: אֵשׁ என்பதன் நேர்பொருள் ‘நெருப்பு’. தொடக்க வாவ் எபிரெயக் கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வாக்கிய ஓட்டம் இயல்பாக இருப்பதால் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல், தொடர்வினை அமைப்பில் அதன் பணி காக்கப்படுகிறது.
- source_word: יָצְאָה
  choice: புறப்பட்டு வந்து
  rationale: יצא என்பது ‘வெளியேறு/புறப்பட்டு வரு’ எனப் பொருள்படும். நெருப்பு இறை முன்னிலையிலிருந்து வெளிப்பட்டதையும் நிகழ்விடத்தை நோக்கி வந்ததையும் இத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵ/אֵת יְהוָה
  choice: யாவேயிடமிருந்து
  rationale: מֵאֵת இங்கு மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் பெயரெழுத்தாக்கமாக ‘யாவே’ என்று தரப்படுகிறது.
- source_word: וַ/תֹּאכַל
  choice: எரித்து அழித்தது
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘உண்’; நெருப்பு எழுவாயாக வரும்போது ‘முற்றிலும் எரித்து அழி/விழுங்கு’ என்ற வழக்குப் பொருள் பெறுகிறது. ‘எரித்து அழித்தது’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: இருநூற்று ஐம்பது பேரையும்
  rationale: எபிரெய எண் தொடர் 250 பேரைக் குறிக்கிறது. மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுமுறை பயன்படுத்தப்பட்டுள்ளது; את குறிக்கும் நேர்ச்செயப்படுபொருள் ‘-ஐயும்’ மூலம் வெளிப்படுகிறது.
- source_word: מַקְרִיבֵי הַ/קְּטֹרֶת
  choice: தூபம் செலுத்திக்கொண்டிருந்த
  rationale: קרב என்ற பங்கேற்புவினை அந்நேரத்தில் நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; קְטֹרֶת வழிபாட்டுத் தூபத்தைக் குறிக்கிறது. ‘செலுத்திக்கொண்டிருந்த’ என்பது தொடர்ச்சியான செயலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை பொதுப்பட்டப் பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராகப் பெயரெழுத்தாக்கம் செய்வது மூலத்தின் தனித்துவத்தைக் காக்கிறது.
- issue: מֵאֵת என்பதின் உறவு
  choice: யாவேயிடமிருந்து
  alternative: யாவேயின் முன்னிலையிலிருந்து
  rationale: இச்சூழலில் இத்தொடர் நெருப்பின் மூலத்தைக் குறிக்க இயலும்; ‘யாவேயின் முன்னிலையிலிருந்து’ என்பது வடிவநெருக்கமான மாற்று வாசிப்பு. அந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வழிபாட்டுச் சூழலுக்குரிய ‘தூபம் செலுத்துதல்’ என்ற வழக்குத் தொடர் பயன்படுத்தப்பட்டுள்ளது; ‘விழுங்கியது’ என்ற நேரடி உருவகத்தைவிட, நெருப்பின் விளைவைத் தெளிவாகச் சொல்லும் ‘எரித்து அழித்தது’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
