  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் அவசரமும் காக்கப்பட்டுள்ளன. ‘விழுங்கிவிடுமோ’ என்பது சற்றே உயர்ந்த ‘விழுங்கிவிடாதபடி’ என்பதைக் காட்டிலும் நேரடி பேச்சில் இயல்பாக அச்சத்தை வெளிப்படுத்துகிறது.
