source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: ta
  text: அவர்களைச் சுற்றிலும் இருந்த இஸ்ரவேலர் அனைவரும் அவர்களுடைய சத்தத்தைக் கேட்டு[a] ஓடிப்போனார்கள்; ஏனெனில், “பூமி நம்மை விழுங்கிவிடுமோ!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கூக்குரலைக் கேட்டு.” எபிரெயச் சொல் சத்தம், குரல் அல்லது கூக்குரல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: இஸ்ரவேலை ஒரு சமூகமாகக் குறிக்கும் எபிரெயக் கூட்டுப்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: அவர்களைச் சுற்றிலும் இருந்த
  rationale: தண்டனைக்கு உள்ளானவர்களின் அருகிலும் சுற்றுப்புறத்திலும் இருந்த மக்களைக் குறிக்கும் உறவுத்தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: נָסוּ
  choice: ஓடிப்போனார்கள்
  rationale: נוּס என்பதன் அவசரமான தப்பியோடும் செயலையும், தமிழில் இயல்பான கதைநடையையும் வெளிப்படுத்துகிறது.
- source_word: לְ/קֹלָם
  choice: அவர்களுடைய சத்தத்தைக் கேட்டு
  rationale: קוֹל என்பதற்குள்ள சத்தம், குரல், கூக்குரல் ஆகிய பொருள் வீச்சை ‘சத்தம்’ ஓரளவு காக்கிறது; לְ இங்கு கேட்ட சத்தத்துக்கு எதிர்வினையாக ஓடியதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כִּי אָמְרוּ
  choice: ஏனெனில் … என்று சொன்னார்கள்
  rationale: அவர்கள் ஓடியதற்கான காரணத்தை அறிமுகப்படுத்தும் כִּי-யின் பங்கை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: פֶּן
  choice: விழுங்கிவிடுமோ
  rationale: פֶּן குறிக்கும் அஞ்சப்படும் விளைவை நவீனத் தமிழின் இயல்பான அச்சவினா வடிவில் தெரிவிக்கிறது.
- source_word: תִּבְלָעֵנוּ
  choice: நம்மை விழுங்கிவிடுமோ
  rationale: பூமி வாய்திறந்து மக்களை விழுங்கிய முந்தைய நிகழ்வின் உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: முந்தைய வசனத்தில் பூமி வாய்திறந்த நிகழ்வோடு உள்ள தொடர்பையும், செயற்படுவது போன்ற உருவகத்தையும் பாதுகாக்கிறது.
