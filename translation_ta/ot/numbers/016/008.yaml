reference: Numbers 16:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: ta
  text: பின்பு மோசே கோராகுவிடம், “லேவியின் மகன்களே, இப்போது கேளுங்கள்,” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லேவியின் மகன்களே, தயவுசெய்து கேளுங்கள்” அல்லது “லேவியர்களே, இப்போது கேளுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: நָא என்பதற்கு ‘இப்போது’ அல்லது வேண்டுகோளை மென்மைப்படுத்தும் ‘தயவுசெய்து’ என்ற நுணுக்கம் இருக்கலாம்; בְּנֵי לֵוִי என்பதை ‘லேவியர்கள்’ என்றும் இயல்பாகக் கூறலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: אֶל קֹרַח
  choice: கோராகிடம்
  rationale: אֶל இங்கு உரையின் முகவரைக் குறிக்கிறது; தமிழில் ‘கோராகிடம்’ இயல்பான வடிவம்.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: שׁמע என்பதன் ஆண்பால் பன்மை கட்டளை வடிவம்; கவனமாகச் செவிகொடுக்கும்படியான அழைப்பின் வலிமையைத் தக்கவைக்கிறது.
- source_word: נָא
  choice: இப்போது
  rationale: கட்டளையை வலியுறுத்தும் அல்லது வேண்டுகோளாக மென்மைப்படுத்தும் துகள்; மோதலான சூழலில் ‘இப்போது’ அவசரமான அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மகன்களே
  rationale: ‘லேவியின் மகன்கள்’ என்ற ஆண்பால் பன்மை உறவுச் சொல்லை நேரடி அழைப்பாகத் தக்கவைக்கிறது; ‘லேவியர்களே’ என்பதும் பொருள்சார்ந்த மாற்றாகும்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயப் பெயருக்குரிய தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் உரையில் ‘கோராகிடம்’ என வருகிறது.
theological_decisions:
- issue: நேரடி அழைப்பிலுள்ள பாலினம் குறிக்கப்பட்ட உறவுச் சொல்
  choice: லேவியின் மகன்களே
  alternative: லேவியர்களே / லேவியின் பிள்ளைகளே
  rationale: எபிரெயம் ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதையே பயன்படுத்துவதால் அதை மறைக்காமல் தக்கவைக்கிறது; உடனடிச் சூழலிலும் ஆண் லேவியர்களே அழைக்கப்படுகின்றனர்.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேளுங்கள்’ என்பது கட்டளையின் சொல்லாற்றலைக் காக்கிறது; ‘மகன்களே’ மூலத்தின் ஆண்பால் பன்மையை வெளிப்படையாகத் தக்கவைக்கிறது.
