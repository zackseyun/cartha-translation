    issue: Inconsistent and incorrect inflection of Korah’s name
    rationale: The lexical decision identifies the name as “கோராகு,” but the translation reads “கோராகிடம்.” For the stated name form, the addressee construction requires “கோராகுவிடம்.” This is a textual-form issue, not a change in meaning.
