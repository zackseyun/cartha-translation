source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: ta
  text: அவர் உன்னையும், உன்னோடு லேவியின் சந்ததியரான உன் சகோதரர்கள் அனைவரையும்[a], தம்மிடம் நெருங்கிவரச் செய்திருக்கிறார்; அப்படியிருந்தும் நீங்கள் ஆசாரியத்துவத்தையும் நாடுகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னோடு உன் சகோதரர்களாகிய லேவியர் அனைவரையும்.”
    reason: ‘உன் சகோதரர்கள்’ என்பதற்கு இணைப்பெயராக வரும் ‘லேவியின் சந்ததியர்’ என்பதைக் குழுவின் வழக்கமான பெயரான ‘லேவியர்’ எனவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: நெருங்கிவரச் செய்திருக்கிறார்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது ‘அணுக அனுமதித்தல்’ என்னும் பொருளைத் தருகிறது. இங்கு வழிபாட்டுப் பணிக்காகக் கடவுளிடம் அணுகும் உரிமையும் நெருக்கமும் இரண்டும் சுட்டப்படுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֹתְךָ
  choice: உன்னையும்
  rationale: கோராகைத் தனிப்பட்ட முறையில் குறிக்கும் இரண்டாம் நபர் ஒருமை நேரடிச் செயப்படுபொருள்.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: உன் சகோதரர்கள் அனைவரையும், அதாவது லேவியின் மக்களையும்
  rationale: אַחֶיךָ என்பதன் நேரடிப் பொருள் ‘உன் சகோதரர்கள்’; בְנֵי לֵוִי அதனை விளக்கும் இணைப்பெயராக ‘லேவியின் மக்கள்’ என்று அடையாளப்படுத்துகிறது. இந்த உறவுமுறையையும் மூலமொழியின் அமைப்பையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: אִתָּךְ
  choice: உன்னோடு
  rationale: கோராகோடு சேர்ந்து அவனுடைய சக லேவியர்களும் அணுகச் செய்யப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבִקַּשְׁתֶּם
  choice: அப்படியிருந்தும் நீங்கள் ... நாடுகிறீர்களா?
  rationale: בקש என்பது ‘நாடுதல், தேடுதல், விரும்புதல்’ என்று பொருள்படும். வினை பன்மையில் இருப்பதால் ‘நீங்கள்’ பயன்படுத்தப்பட்டது. ஏற்கெனவே அளிக்கப்பட்ட சிறப்புரிமைக்கு மேலாக இன்னொன்றை நாடும் முரண்பாட்டை ‘அப்படியிருந்தும்’ வெளிப்படுத்துகிறது; சூழலிலுள்ள கண்டன வினாவும் காக்கப்படுகிறது.
- source_word: גַּם
  choice: -த்தையும்
  rationale: ஏற்கெனவே பெற்ற லேவியப் பணிக்கு மேலாக ஆசாரியத்துவமும் நாடப்படுகிறது என்ற சேர்க்கைப் பொருளைத் தமிழ் இணைவேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּהֻנָּה
  choice: ஆசாரியத்துவம்
  rationale: பொதுவான சமயப் பணியை மட்டும் அல்லாமல், லேவிய ஊழியத்திலிருந்து வேறுபட்ட ஆசாரிய நிலை அல்லது பதவியைக் குறிக்கிறது.
theological_decisions:
- issue: லேவியரின் வழிபாட்டுப் பணிக்கும் ஆசாரியத்துவத்திற்கும் இடையிலான நிலை வேறுபாடு
  choice: ஆசாரியத்துவம்
  alternative: ஆசாரியப் பணி
  rationale: கோராகும் அவனுடைய கூட்டத்தாரும் ஏற்கெனவே பெற்றிருந்த லேவியப் பணியைத் தாண்டி ஆசாரிய நிலையை நாடியதே கண்டிக்கப்படுகிறது. ‘ஆசாரியத்துவம்’ அந்த நிறுவன மற்றும் நிலை வேறுபாட்டைக் காக்கிறது.
- issue: நெருங்கிவரச் செய்தவரின் அடையாளம்
  choice: அவர்
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் எழுவாய் பெயர்ச்சொல்லாக மீண்டும் குறிப்பிடப்படாமல் மூன்றாம் நபர் ஆண்பால் ஒருமை வினையில் மட்டுமே உள்ளது. முந்தைய சூழலில் அது இஸ்ரவேலின் கடவுளைக் குறித்தாலும், இவ்வசனத்தில் இல்லாத தெய்வப் பெயரைச் சேர்க்காமல் ‘அவர்’ என வைத்தது மூலத்தின் வெளிப்பாட்டை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமையான ‘உன்னை’ என்பதிலிருந்து கூட்டத்தாரைக் குறிக்கும் பன்மையான ‘நீங்கள்’ என்பதற்கு மூலத்தில் உள்ள மாற்றம் தெளிவாகக் காக்கப்பட்டது.
