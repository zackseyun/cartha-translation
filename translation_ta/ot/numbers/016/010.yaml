revisions:
- from: அவர் உன்னையும், உன்னோடு உன் சகோதரர்கள் அனைவரையும், அதாவது லேவியின் மக்களையும்[a], தம்மிடம் நெருங்கிவரச் செய்திருக்கிறார்; அப்படியிருந்தும் நீங்கள் ஆசாரியத்துவத்தையும் நாடுகிறீர்களா?
  to: அவர் உன்னையும், உன்னோடு லேவியின் சந்ததியரான உன் சகோதரர்கள் அனைவரையும்[a], தம்மிடம் நெருங்கிவரச் செய்திருக்கிறார்; அப்படியிருந்தும் நீங்கள் ஆசாரியத்துவத்தையும் நாடுகிறீர்கள்.
  rationale: The revision removes the unsupported interrogative form, retains the adversative force of the conjunction through ‘அப்படியிருந்தும்,’ and replaces the less idiomatic ‘லேவியின் மக்கள்’ with the more accurate and natural ‘லேவியின் சந்ததியரான.’ The footnote remains anchored to the appositional phrase and presents the legitimate lexical alternative ‘லேவியர்.’
