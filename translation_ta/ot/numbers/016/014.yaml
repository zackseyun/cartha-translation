  to: உண்மையாகவே, பாலும் தேனும் ஓடும் நாட்டிற்குள் நீ எங்களைக் கொண்டுவரவில்லை; வயல்களும் திராட்சைத்தோட்டங்களும் அடங்கிய பரம்பரைச் சொத்தை எங்களுக்குக் கொடுக்கவும் இல்லை. அந்த மனிதர்களின் கண்களைப் பிடுங்கிவிடுவாயா?[a] நாங்கள் மேலே வரமாட்டோம்.
  rationale: 'திருத்தம் மூலத்தின் பொருளை மாற்றாமல் மூன்று அம்சங்களை மேம்படுத்துகிறது: நிலையான தமிழில் செழிப்பு மரபுத்தொடர், நַחֲלָה-வுக்கான தெளிவான மரபுரிமைச் சொல், மற்றும் עלה-வின் ‘மேலே’ கூறு. கண்களைப் பிடுங்கும் நேரடிப் படிமமும் அதன் சாத்தியமான உருவகக் குறிப்பும் அப்படியே பாதுகாக்கப்பட்டுள்ளன.'
