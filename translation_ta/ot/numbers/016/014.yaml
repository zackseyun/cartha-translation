  verdict: revise
  source_fidelity: மூலத்தின் வலியுறுத்தலான மறுப்பு, பாலும் தேனும் ஓடும் நாடு, வயல் மற்றும் திராட்சைத்தோட்டம் அடங்கிய உரிமைப்பங்கு, கண்களைப் பிடுங்கும் கடுமையான படிமம், மற்றும் மோசேயின் அழைப்பிற்கு மறுக்கும் இறுதி வாக்கியம் ஆகியவை வரைவில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் לֹא נַעֲלֶה என்பதிலுள்ள ‘மேலே’ என்ற இயக்கக் கூறு விடுபட்டுள்ளது; அதனைச் சேர்ப்பது பாதுகாப்பானது. נַחֲלָה-வின் ‘inheritance/allotment’ பொருளுக்கு ‘சுதந்தரச் சொத்து’ என்பதற்குப் பதில் ‘பரம்பரைச் சொத்து’ தெளிவானது.
  naturalness: ‘பாலும் தேனும் ஓடும்’ என்பது நவீன வேதாகமத் தமிழில் இயல்பான நிலையான வடிவம். ‘வயல்களும் திராட்சைத்தோட்டங்களும் அடங்கிய பரம்பரைச் சொத்து’ என்பது மூலத்தின் ஒரே உரிமைப்பங்கையும் தமிழின் இயல்பான தொடரையும் நன்கு வெளிப்படுத்துகிறது. ‘நாங்கள் மேலே வரமாட்டோம்’ சூழலுக்கேற்ற இயல்பான மறுப்பாகும்.
  terminology: ‘பரம்பரைச் சொத்து’ நַחֲלָה குறிக்கும் மரபுரிமை/ஒதுக்கீட்டுச் சொத்து என்ற கருத்தை ‘சுதந்தரச் சொத்து’ விடத் தெளிவாகக் கொடுக்கிறது. ‘கண்களைப் பிடுங்கிவிடுவாயா?’ நקר-ன் வன்மையான நேரடிப் படிமத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு மாற்று உருவக வாசிப்பை முதன்மை உரையாக மாற்றாமல் குறிப்பிடுகிறது.
