id: NUM.16.14
reference: Numbers 16:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: ta
  text: உண்மையாகவே, பாலும் தேனும் ஓடும் நாட்டிற்குள் நீ எங்களைக் கொண்டுவரவில்லை; வயல்களும் திராட்சைத்தோட்டங்களும் அடங்கிய பரம்பரைச் சொத்தை எங்களுக்குக் கொடுக்கவும் இல்லை. அந்த மனிதர்களின் கண்களைப் பிடுங்கிவிடுவாயா?[a] நாங்கள் மேலே வரமாட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மனிதர்களைக் குருடாக்கிவிடுவாயா?” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “கண்களைப் பிடுங்குவது” என்பதாகும்; அவர்கள் உண்மையைக் காணாதவர்கள்போல் நடத்தப்படுவதையும் இது குறிப்பாக உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: உண்மையாகவே, ... இல்லை
  rationale: אַף இங்கு குற்றச்சாட்டை வலியுறுத்துகிறது. ‘உண்மையாகவே’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்தி, לֹא என்பதன் மறுப்பையும் தெளிவாகப் பேணுகிறது.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: பாலும் தேனும் ஓடுகிற ஒரு நாட்டிற்குள்
  rationale: நாட்டின் செழிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் பேணுகிறது; אֶל மற்றும் הֲבִיאֹתָנוּ காட்டும் உள்நோக்கிய நகர்வை ‘நாட்டிற்குள்’ வெளிப்படுத்துகிறது.
- source_word: הֲבִיאֹתָנוּ
  choice: நீ எங்களைக் கொண்டுவரவும் இல்லை
  rationale: இது நிறைவேறாத வாக்குறுதியைக் குற்றச்சாட்டாகச் சொல்கிறது. தமிழில் எதிர்மறை வினைத்தொடர் அந்தச் சொல்லாற்றலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: வயல்களையும் திராட்சைத்தோட்டங்களையும் எங்களுக்குச் சுதந்தரச் சொத்தாகக் கொடுக்கவும் இல்லை
  rationale: נַחֲלָה என்பது பங்காக அல்லது உரிமையாகக் கிடைக்கும் சுதந்தரச் சொத்தைக் குறிக்கிறது. எபிரெய ஒருமை கூட்டுப்பொருளில் இருப்பதால் இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: அந்த மனிதர்களின் கண்களைப் பிடுங்கிவிடுவாயா?
  rationale: Piel வடிவிலுள்ள נקר என்பதன் வன்மையான நேரடிப் படிமத்தை முதன்மை உரையில் பேணுகிறது. இது ஏமாற்றி உண்மையைக் காணவிடாமல் செய்வதையும் மறைமுகமாகக் குறிக்கக்கூடும்; அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֹא נַעֲלֶה
  choice: நாங்கள் வரமாட்டோம்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலேறு’ என்றாலும், இங்கு மோசேயின் அழைப்பை மறுப்பதே கருத்து. அழைத்தவரின் நோக்குநிலையிலிருந்து ‘வரமாட்டோம்’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: கண்களைப் பிடுங்குதல் என்ற சொற்றொடரின் நேரடி அல்லது உருவகப் பொருள்
  choice: நேரடியான வன்மைப் படிமத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘அவர்களைக் குருடாக்கிவிடுவாயா?’ அல்லது ‘அவர்களை ஏமாற்றிவிடுவாயா?’
  rationale: எபிரெய உரை திட்டமிட்டே கடுமையான உடல்சார் படிமத்தைப் பயன்படுத்துகிறது; அதை வெறும் உருவகப் பொருளாக மாற்றுவது மூலத்தின் தீவிரத்தையும் அதன் உண்மையான இருபொருள் வாய்ப்பையும் குறைத்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான தொனி பேணப்பட்டுள்ளது. குற்றச்சாட்டின் கூர்மையும் இறுதி மறுப்பின் உறுதியும் சுருக்கமான வாக்கிய அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளன.
