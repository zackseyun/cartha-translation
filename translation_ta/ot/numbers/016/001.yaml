  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: ta
  text: லேவியின் மகன் கோகாத்தின் மகன் இஸ்ஹாரின் மகனான கோரா, ரூபனின் சந்ததியினரான எலியாபின் மகன்கள் தாத்தான், அபிராம் ஆகியோருடனும், பேலேத்தின் மகன் ஓனுடனும் சேர்ந்து, ஆட்களைத் தன்னோடு கூட்டிக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: ‘அவன் எடுத்தான்.’ எதை எடுத்தான் என்பது அங்கே கூறப்படவில்லை; அடுத்த வசனத்தில் குறிப்பிடப்படும் ஆட்களை மனதில் கொண்டு, தெளிவுக்காக ‘ஆட்களை’ என்பது சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஆட்களைத் தன்னுடன் சேர்த்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தான்/கொண்டான்.’ எபிரெயில் செயப்படுபொருள் வெளிப்படையாக இல்லை. அடுத்த வசனத்தில் 250 பேர் குறிப்பிடப்படுவதால், தமிழில் வாக்கியம் இயல்பாகவும் புரிந்துகொள்ளத்தக்கதாகவும் இருக்க ‘ஆட்களை’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. ‘கலகம் செய்தான்’ போன்ற விளக்கவுரை மூலச் சொல்லை மீறும்.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: லேவியின் மகன் கோகாத்தின் மகன் இத்சாரின் மகன்
  rationale: மூலத்தில் மீண்டும் மீண்டும் வரும் ‘மகன்’ என்ற வம்சத் தொடர்பைப் பாதுகாத்து, தமிழில் நபரின் பெயருக்கு முன் இயல்பான மரபுவழித் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: எலியாபின் மகன்கள் தாத்தான், அபிராம் ஆகியோருடனும்
  rationale: தாத்தானையும் அபிராமையும் கோராகுடன் இணைந்த பங்கேற்பாளர்களாகக் காட்டுகிறது; ‘எலியாபின் மகன்கள்’ என்ற நேரடியான வம்சக் குறிப்பும் தக்கவைக்கப்படுகிறது.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: பேலேத்தின் மகன் ஓனுடனும்
  rationale: தனிப்பெயர்களையும் தந்தை–மகன் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּנֵי רְאוּבֵן
  choice: ரூபனின் வழிவந்தவர்களான
  rationale: இங்கு பன்மையான ‘ரூபனின் மகன்கள்’ என்பது தாத்தான், அபிராம், ஓன் ஆகியோரின் கோத்திர வம்சத்தைக் குறிக்கிறது; அவர்கள் ரூபனின் நேரடி மகன்கள் என்று தமிழில் தவறாகப் புரியாதவாறு ‘வழிவந்தவர்கள்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: தொடக்க வினைச்சொல்லின் விடுபட்ட செயப்படுபொருள்
  choice: அடுத்த வசனத்தின் சூழலை அடிப்படையாகக் கொண்டு ‘ஆட்களை’ என்று நிரப்புதல்
  alternative: செயப்படுபொருளின்றி ‘எடுத்தான்’ என்று மட்டும் மொழிபெயர்த்தல்; அல்லது ‘கலகம் செய்தான்/எழும்பினான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெயில் உள்ள இலக்கணச் சுருக்கத்தை முற்றிலும் மறைக்காமல், தமிழில் பொருள் விளங்க ‘ஆட்களை’ சேர்க்கப்பட்டுள்ளது; இதை அடிக்குறிப்பு வெளிப்படையாக அறிவிக்கிறது. ‘கலகம் செய்தான்’ என்பது கதையின் விளைவைக் கொண்டு வினைக்கு அதிகப் பொருள் ஏற்றும்.
- issue: கோராகுடன் தாத்தான், அபிராம், ஓன் ஆகியோரின் இலக்கணத் தொடர்பு
  choice: அவர்களை கோராகுடன் இணைந்த பங்கேற்பாளர்களாக ‘உடனும் சேர்ந்து’ எனக் காட்டுதல்
  alternative: அவர்களை ‘எடுத்தான்’ என்ற வினையின் செயப்படுபொருள்களாகக் காட்டுதல்
  rationale: வினை ஒருமையில் கோராகை முன்னிறுத்தினாலும், தொடரும் பெயர்கள் இணைந்த பங்கேற்பைச் சுட்டுகின்றன. இந்த அமைப்பு கோராகின் முன்னணிப் பங்கையும் மற்றவர்களின் இணைப்பையும் ஒருங்கே பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொது தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட வம்சத் தொடரை வாசிக்க எளிதாக தமிழுக்குரிய முன்தொடர் அமைப்பில் வழங்கியுள்ளோம். ‘ரூபனின் வழிவந்தவர்கள்’ என்பது கோத்திர அடையாளத்தைத் தெளிவுபடுத்துகிறது; செயப்படுபொருள் நிரப்பப்பட்டிருப்பது அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
