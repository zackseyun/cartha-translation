source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: ta
  text: மோசே கோராகிடம், “நீயும் உன் கூட்டத்தார் அனைவரும் நாளை யாவேவின் முன்னிலையில் இருங்கள்[a]—நீயும் அவர்களும் ஆரோனும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாளை யாவேக்கு முன்பாக இருங்கள்.”
    reason: לִפְנֵי யின் ‘முன்பாக’ என்ற இட-உறவுப் பொருளையும் הֱיוּ என்ற நேரடி பன்மை ஏவலையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: எபிரெயத்தில் தரப்புகள் வலியுறுத்தப்பட்டு, “நீயும் அவர்களும் ஆரோனும்” என்று வெளிப்படையாகப் பட்டியலிடப்படுகின்றன.
    reason: மூலத்தின் மீளுரையும் வலியுறுத்தப்பட்ட பட்டியலிடுதலும் வாசகருக்குத் தெளிவுபடுத்தப்படுகின்றன.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל־קֹרַח
  choice: மோசே கோராகிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; אֶל என்பதன் நேரடி உரையாடல் நோக்கம் ‘கோராகிடம்’ என வெளிப்படுகிறது.
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: நீயும் உன் கூட்டத்தார் அனைவரும்
  rationale: עֵדָה இச்சூழலில் கோராகைச் சேர்ந்த ஒன்றுகூடிய குழுவைக் குறிக்கிறது. ‘கூட்டத்தார்’ என்பது சமூகத் தொகுதியை இயல்பாகக் குறிக்கிறது; ‘அனைவரும்’ כָל என்பதைக் காக்கிறது.
- source_word: הֱיוּ
  choice: இருக்க வேண்டும்
  rationale: היה வினையின் பன்மை ஏவல் வடிவம் சொற்பட ‘இருங்கள்’ எனலாம். எதிர்நாளில் குறிப்பிட்ட முன்னிலையில் ஆஜராக வேண்டிய கட்டளையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்க ‘இருக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/முன்னிலையில்’ என்ற இட-உறவுப் பொருளைப் பாதுகாக்கிறது; திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: நீயும் அவர்களும் ஆரோனும்
  rationale: ஆஜராக வேண்டிய தரப்புகளை எபிரெயம் வலியுறுத்தி மீண்டும் தனித்தனியாகப் பட்டியலிடுகிறது. தமிழிலும் அந்த மீளுரையும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
- source_word: מָחָר
  choice: நாளை
  rationale: காலத்தைக் குறிக்கும் சொல்லின் நேரான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கு எழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. அதை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் வலிமை காக்கப்படுகிறது; அதேவேளையில் எபிரெயத்தின் வெளிப்படையான தரப்புப் பட்டியல் கோடுகளுக்குள் அப்படியே வைக்கப்பட்டுள்ளது. ‘கூட்டத்தார்’ என்பது மதப்பிரிவு சார்ந்த சிறப்புப் பொருளைத் தவிர்த்து சூழலுக்கேற்ற குழுவுணர்வைத் தருகிறது.
