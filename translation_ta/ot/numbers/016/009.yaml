  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: ta
  text: இஸ்ரவேலின் தேவன் உங்களை இஸ்ரவேல் சபையிலிருந்து பிரித்தெடுத்து, தம்மிடம் நெருங்கிவரச் செய்து, யாவேயின் திருக்கூடாரத்தின் பணியை ஆற்றவும், சபையின்முன் நின்று அவர்களுக்குச் சேவை புரியவும் வைத்திருப்பது உங்களுக்கு அற்பமான காரியமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது உங்களுக்குப் போதாதா?” எபிரெய சொல்லாட்சியை “இது உங்களுக்கு அற்பமான காரியமா?” என்றும், பொருளை வெளிப்படையாகக் காட்டும் வகையில் “இது உங்களுக்குப் போதாதா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: உங்களுக்கு அற்பமான காரியமா?
  rationale: கிடைத்த சிறப்புரிமையை அவர்கள் அற்பமாகக் கருதுகிறார்களா என்று கேட்கும் எபிரெய சொல்லாட்சியின் கண்டனத் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: כִּי
  choice: …வைத்தது
  rationale: நேரடியான காரணத்தைக் காட்டாமல், கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் பெயராக்கப்பட்ட வினைமுற்றுத் தொடரால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הִבְדִּיל
  choice: பிரித்தெடுத்து
  rationale: בדל என்பதன் Hiphil வடிவம் பிரித்து வேறுபடுத்துவதைச் சுட்டுகிறது; சூழலில் இஸ்ரவேல் சபையிலிருந்து குறிப்பிட்ட பணிக்காகப் பிரித்தெடுத்தல் பொருந்துகிறது.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேல் சபை
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; ‘சபை’ வழிபாட்டுச் சூழலையும் மொத்த சமூகத்தையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: தம்மிடம் நெருங்கிவரச் செய்து
  rationale: லேவியர்களையே தேவனிடம் அருகில் கொண்டுவரும் உறவு மற்றும் திருப்பணி சார்ந்த பொருளைக் காக்கிறது; பலியிடுதலைத் தேவையின்றி உட்புகுத்தவில்லை.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: யாவேயின் திருக்கூடாரப் பணியைச் செய்ய
  rationale: வினைச்சொல்–பெயர்ச்சொல் சேர்க்கையின் சேவைப் பொருளை இயல்பான தமிழில் ‘பணியைச் செய்ய’ என வழங்குகிறது; מִשְׁכָּן வனாந்தரப் பரிசுத்த கூடாரத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: சபைக்கு முன்பாக நின்று
  rationale: கூடியிருக்கும் மக்களுக்கு முன் அதிகாரபூர்வமாக நின்று சேவை செய்வதை நேரடியாகக் காட்டுகிறது.
- source_word: לְשָׁרְתָם
  choice: அவர்களுக்குப் பணிவிடை செய்ய
  rationale: שרת என்பதிலுள்ள அதிகாரபூர்வமான உதவிப் பணி அல்லது திருப்பணி நுணுக்கத்தை ‘பணிவிடை’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல வசனம் உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: லேவியர்கள் தேவனிடம் நெருங்கச் செய்யப்படுதல்
  choice: தம்மிடம் நெருங்கிவரச் செய்து
  alternative: தமக்கு முன்பாக உங்களை நிறுத்தி
  rationale: קרב என்பதன் அருகில் கொண்டுவருதல் என்ற திருப்பணி சார்ந்த பொருளைக் காக்கிறது; லேவியர்களைப் பலிகளாகக் காட்டும் தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கண்டனத் தொனியும் காக்கப்பட்டுள்ளன. ‘திருக்கூடாரம்’, ‘பணிவிடை’ ஆகியவை வழிபாட்டுச் சூழலைத் தெளிவுபடுத்தினாலும் பொதுவாசகருக்குப் புரியும் சொற்களாக உள்ளன. மூலத்தின் நீண்ட வாக்கிய அமைப்பு வாசிக்கத்தக்க வகையில் காற்புள்ளிகளால் பிரிக்கப்பட்டுள்ளது.
