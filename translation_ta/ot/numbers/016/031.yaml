  yaml_path: translation/ot/numbers/016/031.yaml
  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: ta
  text: அவன் இந்த வார்த்தைகளையெல்லாம் பேசி முடித்தவுடனே, அவர்களுக்குக் கீழிருந்த நிலம் பிளந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: பேசி முடித்தவுடனே
  rationale: כְּ prefixed infinitive construct marks the time at which the action was completed; in context, the natural Tamil form also conveys the immediate sequence.
- source_word: הָאֲדָמָה
  choice: நிலம்
  rationale: Here the noun denotes the ground beneath the people, so நிலம் is clear and natural in modern Tamil.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: அவர்களுக்குக் கீழிருந்த
  rationale: Preserves both the relative construction and the plural pronominal reference ‘beneath them’ without unnecessary expansion.
- source_word: וַתִּבָּקַע
  choice: பிளந்தது
  rationale: Directly expresses the ground splitting open; Tamil does not require an added word equivalent to ‘open’ for clarity.
