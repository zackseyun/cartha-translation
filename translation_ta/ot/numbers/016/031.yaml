  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெய உரையின் நிகழ்வுவரிசையும் ‘அவர்களுக்குக் கீழிருந்த நிலம்’ என்ற இடத்தொடர்பும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
