base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம் பேசினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவே மோசேயிடம் பேசினார், சொல்லி.” தொடக்க இணைப்பை “அப்போது” என்பதற்குப் பதிலாக “மேலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... பேசினார்
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் “அப்போது” அதன் தொடர்ச்சி உணர்வை இயல்பாக வெளிப்படுத்துகிறது. “பேசினார்” என்பது דבר என்பதன் சொற்பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל
  choice: இடம்
  rationale: מֹשֶׁה என்பதுடன் இணைந்து “மோசேயிடம்” என அமைந்து, பேச்சு யாரை நோக்கியது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள இப்பெயரின் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கைத் தமிழில் “பேசிச் சொன்னார்” என இயல்பாக வெளிப்படுத்தி, அடுத்த வசனத்தில் வரும் உரைக்காக வாக்கியத்தைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்துத் தனிப்பெயரே உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வேதாகம உரைநடை. மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; வசனம் அடுத்த நேரடிக் கூற்றை அறிமுகப்படுத்தும் வகையில் முடிகிறது.
