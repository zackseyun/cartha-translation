  source_fidelity: The draft adds an unsupported command, “யாவேக்கு முன்பாக வாருங்கள்” (“come before Yahweh”). The Hebrew instead directs them to put fire in the censers and place incense on them before Yahweh, tomorrow. This must be corrected. The remaining main clauses convey the Hebrew sense well.
