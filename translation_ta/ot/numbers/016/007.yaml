  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: ta
  text: நாளை அவற்றில் நெருப்பை வைத்து, அவற்றின்மேல் யாவேக்கு முன்பாகத் தூபப்பொருளை இடுங்கள். அப்போது, யாவே யாரைத் தேர்ந்தெடுக்கிறாரோ, அவரே பரிசுத்தமானவர். லேவியின் மகன்களே, நீங்கள் எல்லைமீறிவிட்டீர்கள்![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியின் மகன்களே, உங்களுக்கு இது மிகையாக உள்ளது!”
    reason: רַב לָכֶם என்பதன் சொல்லளவிலான மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: அவற்றில் நெருப்பை வைத்து
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தூபக்கலசங்களுக்குள் நெருப்பை இடுவதைக் குறிக்கிறது; ‘வைத்து’ என்பது இயல்பான நவீன தமிழ்.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: அவற்றின்மேல் தூபப்பொருளை வைத்து
  rationale: தூபக்கலசங்களில் உள்ள நெருப்பின்மேல் தூபப்பொருளை இடும் சடங்குச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இறைவனின் முன்னிலையில் செய்யப்படும் வழிபாட்டுச் செயல் என்ற எபிரெய வழக்கை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: நேரத்தைக் குறிக்கும் சொல்லின் நேரான பொருள்.
- source_word: וְהָיָה
  choice: அப்போது
  rationale: சோதனையின் விளைவைக் கூறும் வாக்கியப் பகுதியை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே யாரைத் தேர்ந்தெடுக்கிறாரோ
  rationale: தேர்வு செய்யப்படவிருக்கும் ஒருவரைக் குறிக்கும் எபிரெய உறவுநிலை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הוּא הַקָּדוֹשׁ
  choice: அவரே பரிசுத்தமானவர்
  rationale: குறிப்பிட்ட அந்த நபரே இறைவனால் பரிசுத்தமானவராக அங்கீகரிக்கப்படுகிறார் என்பதை வலியுறுத்தும் הוּא மற்றும் definite adjective-ன் force-ஐப் பாதுகாக்கிறது.
- source_word: רַב לָכֶם
  choice: நீங்கள் எல்லைமீறிவிட்டீர்கள்
  rationale: சொல்லளவில் ‘உங்களுக்கு மிகுதி’ என்றாலும், சூழலில் அதிகார வரம்பை மீறியதற்கான கண்டனமாக உள்ளது; தமிழ் வழக்கில் அதன் சொல்லாற்றலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மக்களே
  rationale: ‘லேவியின் மகன்கள்’ என்ற வம்சவழிச் சொல்லை உள்ளடக்கமான, இயல்பான தமிழ் வம்சக் குறிப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் வரும் நான்கெழுத்து உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: הוּא הַקָּדוֹשׁ என்பதன் வலியுறுத்தல்
  choice: அவரே பரிசுத்தமானவர்
  alternative: அவர் பரிசுத்தமானவர்; அவரே பரிசுத்தர்
  rationale: இறைவன் தேர்ந்தெடுக்கும் நபரையே தனித்துக் காட்டும் மூலத்தின் வலியுறுத்தலையும் definite வடிவத்தையும் காக்கிறது; தனிப்பட்ட கிறிஸ்தவப் பட்டப்பெயராகத் தவறாகப் புரியாதபடி பொதுவான விவரிப்புச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- issue: רַב לָכֶם என்ற கண்டனத்தின் பொருள்
  choice: நீங்கள் எல்லைமீறிவிட்டீர்கள்
  alternative: உங்களுக்கு மிகுதியாகிவிட்டது; போதும் உங்களுக்கு
  rationale: சூழலில் கோராகின் குழுவினர் தங்கள் உரிய வரம்பை மீறியதாக மோசே கூறும் கண்டனத்தை வெளிப்படுத்துகிறது; சொல்லளவிலான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடர்ச்சியான கட்டளைகள் தமிழில் இயல்பாக ஒன்றிணைக்கப்பட்டு, மூலத்தில் உட்கருத்தாக உள்ள ‘யாவேக்கு முன்பாக வருதல்’ வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
