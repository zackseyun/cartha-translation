source:
  edition: WLC
  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: ta
  text: “இந்தச் சபையின்[a] நடுவிலிருந்து விலகுங்கள்; நான் அவர்களை ஒரு கணத்தில்[b] அழித்துவிடுவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தக் கூட்டத்தாரின் நடுவிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரே நொடியில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: விலகிச் செல்லுங்கள்
  rationale: בדל என்பதன் நிஃபால் கட்டளைப் பன்மை வடிவம், ஒரு குழுவிலிருந்து தங்களைப் பிரித்துக்கொள்ளும்படி பலருக்குக் கொடுக்கப்படும் கட்டளையைக் குறிக்கிறது. ‘விலகிச் செல்லுங்கள்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழாகவும் இடமாற்றத்தின் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: מִתּוֹךְ
  choice: நடுவிலிருந்து
  rationale: ஒரு குழுவுக்குள் இருந்த நிலையிலிருந்து பிரிந்து வெளியேறுவதை இந்தச் சொற்றொடர் குறிக்கிறது; அதன் இடம்சார் வலிமையை ‘நடுவிலிருந்து’ காக்கிறது.
- source_word: הָעֵדָה הַזֹּאת
  choice: இந்தச் சபை
  rationale: עֵדָה இங்கு கூடியிருக்கும் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது. ‘சபை’ என்பது ‘சமூகம்’ என்பதைவிட கூடிவந்திருக்கும் மக்களின் கூட்டத்தைக் குறுகிய, இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַאֲכַלֶּה
  choice: அப்போது நான் … முற்றிலும் அழித்துவிடுவேன்
  rationale: כלה என்பதன் தீவிர வினைவடிவம் முடிவுக்குக் கொண்டுவருதல் அல்லது முழுவதுமாக அழித்தல் என்ற கடுமையான நியாயத்தீர்ப்பைக் குறிக்கிறது. முன்னுள்ள கட்டளையோடு அதன் விளைவு/நோக்கத் தொடர்பை ‘அப்போது’ காட்டுகிறது; ‘முற்றிலும்’ வினையின் தீவிரத்தைக் காக்கிறது.
- source_word: אֹתָם
  choice: இவர்களை
  rationale: நியாயத்தீர்ப்புக்கு உட்படும் அருகிலுள்ள சபையினரைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயராக இங்கு ‘இவர்களை’ இயல்பாக உள்ளது.
- source_word: כְּרָגַע
  choice: ஒரு கணத்தில்
  rationale: רֶגַע மிகக் குறுகிய காலப்பொழுதைக் குறிக்கிறது. ‘ஒரு கணத்தில்’ அழிவின் திடீர்மையையும் வேகத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீக நியாயத்தீர்ப்பு அறிவிப்பின் தன்மை
  choice: சபையினரை விரைவாக முற்றிலும் அழிப்பதற்கான உண்மையான தெய்வீக அறிவிப்பாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களைக் கையாளுவேன்’ அல்லது ‘அவர்களை அகற்றுவேன்’ என்று வலிமை குறைத்தல்
  rationale: இந்தச் சூழலில் כלה கடுமையான அழிவுத் தீர்ப்பைக் குறிக்கிறது. பின்னைய இறையியல் விளக்கங்களால் அதை மென்மையாக்காமல், உரையிலுள்ள தீவிரத்தையும் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் நேரடியான தொனியும், தொடர்ந்து வரும் தெய்வீக நியாயத்தீர்ப்பின் கடுமையும் காக்கப்பட்டுள்ளன.
