  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: ta
  text: மோசே அதைக் கேட்டதும், முகங்குப்புற விழுந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “தன் முகத்தின்மேல் விழுந்தார்.” “முகம் தரையில் படும்படி விழுந்தார்” அல்லது “நெடுஞ்சாண்கிடையாக விழுந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: அதைக் கேட்டதும்
  rationale: שׁמע இங்கு தொடர்ச்சியான நிகழ்வைச் சொல்லும் வினையாக ‘கேட்டார்’ என்று பொருள்படுகிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கூறப்பட்டவற்றையே குறிக்கும் ‘அதை’ என்பது இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது. ‘கேட்டதும்’ அடுத்த செயல் உடனே நிகழ்ந்ததை இயல்பாக இணைக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַיִּפֹּל
  choice: விழுந்தார்
  rationale: נפל என்பதன் அடிப்படைப் பொருளான ‘விழுதல்’ பாதுகாக்கப்படுகிறது; தொழுதுகொண்டார் அல்லது வேண்டினார் என்று செயலை விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: עַל־פָּנָיו
  choice: முகங்குப்புற
  rationale: ‘தன் முகத்தின்மேல்’ என்ற எபிரெய மரபுத்தொடரின் உடல் நிலையை இயல்பான நவீன தமிழில் ‘முகங்குப்புற’ தெளிவாகக் காட்டுகிறது; தாழ்மை, துயரம், மன்றாட்டு போன்ற குறிப்பிட்ட நோக்கத்தைத் தீர்மானிப்பதில்லை.
theological_decisions:
- issue: மோசேயின் உடல் நிலையின் பொருள்
  choice: உடல் செயலை மட்டும் ‘முகங்குப்புற விழுந்தார்’ என்று கூறுதல்
  alternative: ‘ஜெபிக்கும்படி பணிந்தார்’ அல்லது ‘துயரத்தில் முகங்குப்புற விழுந்தார்’ என்று விளக்குதல்
  rationale: எபிரெய உரை செயலைக் கூறுகிறது; அது ஜெபம், அதிர்ச்சி, தாழ்மை அல்லது பரிந்துபேசுதல் ஆகியவற்றில் எதைக் குறிப்பாக உணர்த்துகிறது என்பதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான மற்றும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகங்குப்புற’ என்பது பொதுவாகப் புரியும் இயல்பான சொல்; மூலத்தின் உருவகத்தை விளக்கவுரை இன்றிப் பாதுகாக்கிறது.
