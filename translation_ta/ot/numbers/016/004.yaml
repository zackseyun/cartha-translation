  source_fidelity: வַיִּשְׁמַע என்பதற்கான “அதைக் கேட்டதும்” முந்தைய வசனத்தின் பேச்சை இயல்பாகக் குறிக்கிறது. வַיִּפֹּל עַל־פָּנָיו என்ற எபிரெய மரபுத்தொடர் “முகங்குப்புற விழுந்தார்” என்பதில் உடல்நிலையாகவே மொழிபெயர்க்கப்பட்டுள்ளது; அதன் நோக்கம் அல்லது உணர்ச்சிநிலையைச் சேர்த்து விளக்கவில்லை.
  naturalness: “மோசே அதைக் கேட்டதும், முகங்குப்புற விழுந்தார்” என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ள கதைநடை. “முகங்குப்புற” முகம் கீழ்நோக்கிய நிலையைத் தெளிவாகக் கூறுகிறது.
  terminology: “மோசே” நிலைபெற்ற தமிழ்ப் பெயர்வடிவம். அடிப்படை வினையான “விழுந்தார்” பாதுகாக்கப்பட்டுள்ளது; “ஜெபித்தார்” அல்லது “பணிந்தார்” போன்ற விளக்கமான இறையியல்/உணர்ச்சி பொருள் உரையில் திணிக்கப்படவில்லை. அடிக்குறிப்பு எபிரெயத்தின் சொல்லுக்கு-சொல் வடிவத்தையும் ஏற்ற மாற்றுகளையும் சரியாகச் சுட்டுகிறது.
