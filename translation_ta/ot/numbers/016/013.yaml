source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: ta
  text: பாலும் தேனும் ஓடுகிற நாட்டிலிருந்து[a] எங்களை வெளியே கொண்டுவந்து, வனாந்தரத்தில் எங்களைக் கொல்வதற்காக வந்தது சிறிய காரியமா? அதோடு எங்கள்மேல் நீர் அதிகாரம் செலுத்தவும் வேண்டுமோ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பேசுகிறவர்கள் எகிப்தை நையாண்டியாக ‘பாலும் தேனும் ஓடுகிற நாடு’ என்று குறிப்பிடுகிறார்கள்; மற்ற இடங்களில் இச்சொற்றொடர் வாக்குத்தத்த நாட்டைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘எங்களை அடக்கி ஆளவும் வேண்டுமோ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: போதாதென்று
  rationale: இகழ்ச்சியும் சீற்றமும் நிறைந்த எபிரெய வினாவை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அது சிறிய காரியமா?’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட இச்சூழலில் தெளிவானது.
- source_word: הֶעֱלִיתָנוּ
  choice: எங்களை வெளியே அழைத்துவந்து
  rationale: ஹிஃபில் வடிவத்தின் ‘புறப்படச் செய்தல்/மேலே கொண்டுவருதல்’ பொருளையும் எகிப்திலிருந்து வெளியேற்றிய நிகழ்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: பாலும் தேனும் ஓடுகிற நாட்டிலிருந்து
  rationale: செழிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகத் தக்கவைக்கிறது; வாக்காளர்கள் அதை எகிப்துக்குப் பயன்படுத்துவதிலுள்ள நையாண்டியையும் மறைக்கவில்லை.
- source_word: לַהֲמִיתֵנוּ
  choice: எங்களைக் கொன்றுபோடுவது
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் நேரடியான, வலிமையான குற்றச்சாட்டைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலரின் பயணச் சூழலைக் குறிக்கும் מִדְבָּר என்பதற்கான புரிந்துகொள்ளத்தக்க, கண்ணியமான தமிழ்ச் சொல்.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: எங்கள்மேல் நீர் அதிகாரம் செலுத்தத்தான் வேண்டுமோ
  rationale: ஆளுதல் அல்லது தலைவனாக அதிகாரம் செலுத்துதல் என்ற வினையின் பொருளைத் தருகிறது; ‘தான்’ என்பது முற்றுவினையுடன் வந்த இன்ஃபினிட்டிவ் அப்சலூட்டின் வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: גַּם
  choice: அதோடு
  rationale: முந்தைய குற்றச்சாட்டுடன் இன்னொரு குற்றச்சாட்டைச் சேர்க்கும் சொல்லின் பணியைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: எகிப்தை ‘பாலும் தேனும் ஓடுகிற நாடு’ என்று அழைக்கும் நையாண்டி
  choice: அந்த மரபுத்தொடரை முதன்மை உரையில் நேரடியாகத் தக்கவைத்தல்
  alternative: ‘பாலும் தேனும் ஓடியதாக நீங்கள் கூறும் நாடு’ என்று நையாண்டியை வெளிப்படையாக விளக்குதல்
  rationale: நையாண்டியை எபிரெய உரை சூழலின் வழியே உணர்த்துகிறது. அதை மொழிபெயர்ப்பிலேயே விளக்குவது மூலத்தில் இல்லாத பொருள் விளக்கத்தைச் சேர்க்கும்; நேரடி வடிவம் கிளர்ச்சியாளர்களின் திரித்த குற்றச்சாட்டையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மோசேயை நோக்கிய ஒருமை உரையாடலுக்கு மரியாதை வடிவமான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; நையாண்டியும் கடுமையான குற்றச்சாட்டும் மென்மையாக்கப்படவில்லை.
