revisions:
- from: பாலும் தேனும் ஓடுகிற நாட்டிலிருந்து[a] எங்களை வெளியே அழைத்துவந்து, வனாந்தரத்தில் எங்களைக் கொன்றுபோடுவது போதாதென்று, அதோடு எங்கள்மேல் நீர் அதிகாரம் செலுத்தத்தான் வேண்டுமோ?[b]
