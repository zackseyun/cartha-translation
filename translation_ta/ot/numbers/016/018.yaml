  rationale: 'The revision preserves the Hebrew sequence and plural references: each person takes his own vessel; fire and incense are placed in/on the plural vessels; then the men stand together with Moses and Aaron at the entrance. ‘நெருப்புச் சட்டி’ is a clearer modern Tamil rendering of a vessel for carrying fire/coals, while the traditional ‘தூபக்கலசம்’ remains available in the footnote.'
