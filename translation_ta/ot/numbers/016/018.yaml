base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: ta
  text: ஆகவே, ஒவ்வொருவரும் தத்தம் நெருப்புச் சட்டியை[a] எடுத்துக்கொண்டு, அவற்றில் நெருப்பை வைத்து, அவற்றின்மேல் தூபப்பொருளை வைத்தார்கள். பின்னர் அவர்கள் மோசேயுடனும் ஆரோனுடனும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூபக்கலசம்.’ எபிரெயச் சொல், தூபம் செலுத்துவதற்காக எரியும் தணல்களை ஏந்தப் பயன்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: ஒவ்வொருவரும் தத்தம் நெருப்புத்தட்டை எடுத்துக்கொண்டு
  rationale: אִישׁ என்பது இங்கு பகிர்நிலையாக ‘ஒவ்வொருவரும்’ எனப் பொருள்படுகிறது; ஒருமை உடைமைப் பின்னொட்டு ஒவ்வொருவரும் தமக்குரிய பாத்திரத்தை எடுத்ததைக் காட்டுவதால் ‘தத்தம்’ பயன்படுத்தப்பட்டது. מַחְתָּה என்பது எரியும் தணல்களை ஏந்தித் தூபம் செலுத்தப் பயன்படும் பாத்திரம்; தெளிவான ‘நெருப்புத்தட்டு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: அவற்றில் நெருப்பை வைத்து
  rationale: எபிரெய முன்னிடைச்சொல் சொற்படியாக ‘அவற்றின்மேல்’ என்றாலும், பாத்திரங்களுக்குள் நெருப்பு வைக்கப்பட்ட சடங்குச் செயலை இயல்பான தமிழில் ‘அவற்றில்’ எனத் தருகிறது.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: அதன்மேல் தூபப்பொருளை வைத்தார்கள்
  rationale: தூபப்பொருள் பாத்திரங்களிலிருந்த நெருப்பின்மேல் வைக்கப்பட்டது. ‘அதன்மேல்’ என்பது அந்த உறவைத் தெளிவுபடுத்தி, எபிரெய உரையின் இயக்கத்தையும் காக்கிறது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: எரித்து நறுமணப் புகை எழுப்பும் பொருளைக் குறிக்கும் சொல்லாக, சாதாரண வாசகருக்கும் செயல் தெளிவாக இருக்க ‘தூபப்பொருள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: פֶּתַח என்பது நுழைவாயில்; אֹהֶל מוֹעֵד என்பது கடவுள் தம் மக்களைச் சந்திக்கும் வழிபாட்டு அமைப்பைக் குறிக்கும் நிலையான பெயராக ‘சந்திப்புக் கூடாரம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும் அவர்களோடு ... நின்றார்கள்
  rationale: இடக்குறிப்புக்குப் பின் வினையில்லாமல் வரும் பெயர்கள், மோசேயும் ஆரோனும் அங்கே அவர்களுடன் நின்றிருந்ததை இயல்பாகக் குறிக்கின்றன. தமிழில் பொருள் தெளிவாக அமைய பகிரப்பட்ட ‘நின்றார்கள்’ வினையுடன் இணைக்கப்பட்டது.
