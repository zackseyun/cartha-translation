  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: ta
  text: 'அவர் கோராகிடமும் அவனைச் சேர்ந்த கூட்டத்தார் அனைவரிடமும் இவ்வாறு கூறினார்: “காலையில், தமக்குரியவர் யார் என்றும் பரிசுத்தமானவர் யார் என்றும் யாவே வெளிப்படுத்துவார்[a]; அவரைத் தம்மிடம் நெருங்கிவரச் செய்வார்[b]. தாம் தேர்ந்தெடுப்பவரைத் தம்மிடம் நெருங்கிவரச் செய்வார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குரியவர் யார் என்பதை யாவே அறிவார்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “அறிவார்”; இங்கு அது வெளிப்படையாக அறியச் செய்வது அல்லது காட்டுவது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தம்மிடம் நெருங்கிவரச் செய்வார்” என்பது பரிசுத்தப் பணிக்காக யாவேயின் முன்னிலையில் அணுகுவதற்கு அதிகாரம் அளிக்கப்படுவதைக் குறிக்கும் ஆசாரிய மற்றும் வழிபாட்டு மொழி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பது ஒருவரிடம் உரையாற்றுவதைக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் לֵאמֹר அறிமுகப்படுத்தும் நேரடிக் கூற்றிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: עֲדָתוֹ
  choice: அவனைச் சேர்ந்த கூட்டத்தார்
  rationale: עֵדָה என்பது கூடியிருக்கும் குழு அல்லது சபையைக் குறிக்கும். இங்கு கோராகைச் சேர்ந்த குழுவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בֹּקֶר
  choice: காலையில்
  rationale: வினையடைப் பொருளில் வரும் இப்பெயர்ச்சொல்லின் காலக் குறிப்பை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘நாளை’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְיֹדַע יְהוָה
  choice: யாவே வெளிப்படுத்துவார்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’ என்றாலும், இச்சூழலில் யார் உண்மையில் தமக்குரியவர் என்பதை யாவே வெளிப்படையாகக் காட்டுவார் என்ற விளைவுப் பொருள் வலுவாக உள்ளது. சொற்பொருள் மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: தமக்குரியவர் யார்
  rationale: ‘தம்முடையவர் யார்’ என்ற உடைமை/உறவுப் பொருளைக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַקָּדוֹשׁ
  choice: பரிசுத்தமானவர் யார்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை; புனிதப் பணிக்காகப் பிரித்துவைக்கப்பட்டவரைக் குறிக்கும் பொருளைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: וְהִקְרִיב אֵלָיו
  choice: அவரைத் தம்மிடம் நெருங்கிவரச் செய்வார்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் நெருங்க அனுமதித்தல் அல்லது நெருங்கக் கொண்டுவருதல், குறிப்பாக பரிசுத்தப் பணிக்கான அங்கீகரிக்கப்பட்ட அணுகலைக் குறிக்கிறது.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: தாம் தேர்ந்தெடுப்பவரை
  rationale: בחר என்பதன் தனிநபர் சார்ந்த தேர்ந்தெடுத்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יַקְרִיב אֵלָיו
  choice: தம்மிடம் நெருங்கிவரச் செய்வார்
  rationale: மூல எபிரெயத்தில் உள்ள மறுபடியும் கூறுதலைக் காத்து, அங்கீகரிக்கப்பட்ட பரிசுத்த அணுகல் என்ற கருத்தை வலுப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ידע என்பதன் பொருள்
  choice: வெளிப்படுத்துவார்
  alternative: அறிவார்
  rationale: இங்கு யாவே ஏற்கெனவே அறியாத ஒன்றை அறிந்துகொள்வது அல்ல, தமக்குரியவர் யார் என்பதை நிகழ்வின் மூலம் பொதுவாகத் தெளிவாக்குவது சூழலுக்குப் பொருந்துகிறது. ஆயினும் எபிரெயச் சொல்லின் நேரடியான ‘அறிவார்’ என்ற வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ‘நெருங்கிவரச் செய்வார்’ என்பதன் பரிசுத்தப் பணி சார்ந்த தன்மை
  choice: உருவகத்தை அப்படியே காத்தல்
  alternative: பரிசுத்தப் பணிக்கு அதிகாரமளிப்பார்
  rationale: மூலத்தின் ஆசாரிய/வழிபாட்டு மொழியை விளக்கமாக மாற்றித் தீர்க்காமல், அங்கீகரிக்கப்பட்ட அணுகல் என்ற இறையியல் அழுத்தத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் மரியாதைப் பன்மை வடிவங்களும், கோராகைக் குறிக்கும் ஒருமை வடிவங்களும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன. மூலத்தின் இணை அமைப்பும் ‘நெருங்கிவரச் செய்வார்’ என்ற மறுபடியும் கூறுதலும் காக்கப்பட்டுள்ளன.
