base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: ta
  text: 'சபையாரிடம் இவ்வாறு சொல்: “கோரா, தாத்தான், அபிராம் ஆகியோரின் உறைவிடத்தைச் சுற்றியுள்ள இடத்திலிருந்து விலகிச் செல்லுங்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “சுற்றியுள்ள இடத்திலிருந்து மேலே செல்லுங்கள்.” இச்சூழலில், அந்த இடத்திலிருந்து அகன்று செல்லுங்கள் என்பது பொருள்.'
    reason: மூல வினைச்சொல்லின் ‘மேலே செல்லுதல்’ என்ற வடிவத்தையும் சூழலுக்குரிய ‘விலகுதல்’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: இங்கு கூடியிருக்கும் இஸ்ரவேல் சமூகத்தாரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் மனிதர்களைக் குறிக்கும் வடிவம்.
- source_word: הֵעָלוּ מִסָּבִיב
  choice: சுற்றியுள்ள இடத்திலிருந்து விலகிச் செல்லுங்கள்
  rationale: הֵעָלוּ என்பதன் அடிப்படை இயக்கக் கருத்து ‘மேலே செல்லுங்கள்/புறப்பட்டுச் செல்லுங்கள்’; מִסָּבִיב உடன் இச்சூழலில் நோக்கம் அந்த இடத்தைச் சுற்றிய பகுதியிலிருந்து அகல்வதாகும். சொல்லுக்குச் சொல் ‘மேலேறிச் செல்லுங்கள்’ என்பது தமிழில் தவறான நிலவியல் பொருளைத் தரக்கூடும்.
- source_word: מִשְׁכַּן
  choice: உறைவிடம்
  rationale: தங்கும் இடம் அல்லது குடியிருப்பைக் குறிக்கும் பொதுப்பெயர்; இங்கு பரிசுத்த கூடாரத்தைக் குறிக்கும் சிறப்புச் சொல்லாக எடுத்துக்கொள்ளாமல் மூவரோடு தொடர்புடைய உறைவிடமாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: மִשְׁכַּן என்பதைக் கூடாரம் எனச் சிறப்பாக்குவதா அல்லது உறைவிடம் எனப் பொதுவாக வைப்பதா
  choice: உறைவிடம்
  alternative: கூடாரம்
  rationale: எபிரெயச் சொல் ‘உறைவிடம்’ என்ற பரந்த பொருளுடையது. வசனம் குடியிருப்பின் துல்லிய வடிவத்தை நிர்ணயிக்காததால் அந்தத் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியான கட்டளைத் தொனி காக்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம வழக்குடன் ஒத்த ‘கோரா, தாத்தான், அபிராம்’ என வழங்கப்பட்டுள்ளன.
