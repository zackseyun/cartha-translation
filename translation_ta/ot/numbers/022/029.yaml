  source_fidelity: மூல எபிரெயத்தின் கதைநடை, பெண்பால் கொண்ட אָתוֹן, இழிவுபடுத்துதல்/கேலிசெய்தல் என்ற הִתְעַלַּלְתְּ பாங்கு, לוּ-வின் நிகழாத விருப்பநிலை, ‘என் கையில் வாள்’ என்ற படிமம், மற்றும் עַתָּה-வின் உடனடித் தன்மை ஆகியவை நன்றாகப் பிரதிபலிக்கப்படுகின்றன. ‘இப்போதே உன்னைக் கொன்றிருப்பேன்’ என்பது இச்சூழலில் உள்ள எதிர்நிலை மிரட்டலைச் சரியாகத் தருகிறது.
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் கோபமான நேர்கூற்றுக்கேற்ற வகையிலும் உள்ளது. ‘பெண் கழுதை,’ ‘என் கையில் மட்டும் ஒரு வாள் இருந்திருந்தால்,’ ‘இப்போதே’ ஆகியவை தெளிவானவை.
  terminology: ‘பிலேயாம்’ நிலையான பெயர்வடிவமாக உள்ளது. ‘பெண் கழுதை’ மூலத்தில் வெளிப்படையான பெண்பாலைப் பாதுகாக்கிறது. ‘அவமானப்படுத்திவிட்டாயே’ என்பது இங்கு உள்ள கேலி/இழிவான நடத்துதலின் விளைவைக் கருத்துணர்வுடன் வெளிப்படுத்தும் ஏற்ற சொல்.
