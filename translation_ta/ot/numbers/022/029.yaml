translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நேர்கூற்று. ‘பெண் கழுதை’ என்பது மூல எபிரெயத்தின் வெளிப்படையான பெண்பாலைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
