  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: ta
  text: பிலேயாம் அந்தப் பெண் கழுதையிடம், “நீ என்னை இப்படி அவமானப்படுத்திவிட்டாயே! என் கையில் மட்டும் ஒரு வாள் இருந்திருந்தால், இப்போதே உன்னைக் கொன்றிருப்பேன்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னைக் கொல்வேன்” என்றும் மொழிபெயர்க்கலாம். நிகழாத நிபந்தனையின் கீழ் பிலேயாம் உடனே செய்ய விரும்பிய செயலை எபிரெயம் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר בִּלְעָם לָאָתוֹן
  choice: பிலேயாம் அந்தப் பெண் கழுதையிடம் ... என்றான்
  rationale: வழக்கமான எபிரெயக் கதைநடை வினையை இயல்பான நவீனத் தமிழ் நேர்கூற்றாக அமைக்கிறது; אָתוֹן என்பதில் பெண்பால் வெளிப்படையாக இருப்பதால் ‘பெண் கழுதை’ எனக் காக்கப்படுகிறது.
- source_word: כִּי הִתְעַלַּלְתְּ בִּי
  choice: நீ என்னை இப்படி அவமானப்படுத்திவிட்டாயே!
  rationale: Hitpael வடிவம் கேலியாகவோ இழிவாகவோ நடத்தி ஒருவரை அவமானப்படுத்தும் பொருளைத் தருகிறது. கோபமான நேரடிப் பேச்சின் தொனியை ‘இப்படி’ மற்றும் ‘-விட்டாயே’ இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: என் கையில் மட்டும் ஒரு வாள் இருந்திருந்தால்
  rationale: לוּ குறிக்கும் நிகழாத எதிர்நிலை விருப்பத்தைத் தமிழில் ‘மட்டும் ... இருந்திருந்தால்’ இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; ‘என் கையில்’ என்ற மூலப் படிமமும் காக்கப்படுகிறது.
- source_word: כִּי עַתָּה הֲרַגְתִּיךְ
  choice: இப்போதே உன்னைக் கொன்றிருப்பேன்
  rationale: כִּי עַתָּה உடனடித் தன்மையை வலியுறுத்துகிறது; முன்வந்த நிகழாத நிபந்தனையின் விளைவை ‘கொன்றிருப்பேன்’ துல்லியமாகத் தெரிவிக்கிறது.
