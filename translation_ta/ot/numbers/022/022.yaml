source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: ta
  text: ஆனால் அவன் போய்க்கொண்டிருந்ததால் கடவுளின் கோபம் மூண்டது. யாவேயின் தூதர் அவனுக்கு எதிரியாக[a] வழியில் நின்றார். அவன் தன் கழுதையின்மேல்[b] சவாரி செய்துகொண்டிருந்தான்; அவனுடைய இரண்டு இளைஞர்களும் அவனோடு இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரேயச் சொல் שָׂטָן (சாத்தான்) என்பது ‘எதிரி’ அல்லது ‘எதிர்ப்பவர்’ என்று பொருள்படும் பொதுப்பெயர்; இது அவசியமாக ‘சாத்தான்’ என்ற சிறப்புப்பெயரைக் குறிப்பதில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய பெண் கழுதையின்மேல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் குறிப்பாகப் பெண் கழுதையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: கடவுளின் கோபம் மூண்டது
  rationale: எபிரேய மொழியின் ‘கோபம் எரிதல்’ என்ற வலுவான சொல்லோவியத்தை இயல்பான நவீனத் தமிழில் ‘கோபம் மூண்டது’ எனத் தக்கவைக்கிறது.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: அவன் போய்க்கொண்டிருந்ததால்
  rationale: כִּי காரணத்தையும், הוֹלֵךְ தொடர்ந்துகொண்டிருந்த செயலையும் குறிக்கிறது; கடவுள் ஏன் கோபமடைந்தார் என்ற உரையின் பதற்றத்தை விளக்கிச் சரிசெய்யாமல் அப்படியே விடுகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: மַלְאַךְ இச்சூழலில் விண்ணுலகத் தூதரைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּתְיַצֵּב
  choice: வந்து நின்றார்
  rationale: இந்த வினையின் திட்டமிட்டு ஓர் இடத்தில் நிலைகொள்ளும் பொருளை, இயல்பான தமிழில் எதிர்கொண்டு நிற்கும் செயலாக வெளிப்படுத்துகிறது.
- source_word: לְשָׂטָן לוֹ
  choice: அவனுக்கு எதிராளியாக
  rationale: שָׂטָן இங்கு பொதுப்பெயராக இருந்து எதிர்ப்பவரின் பங்கைச் சுட்டுகிறது; பிற்காலச் சிறப்புப்பெயரான ‘சாத்தான்’ என்பதைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- source_word: אֲתֹנוֹ
  choice: தன் கழுதையின்மேல்
  rationale: தமிழ் கதைநடையில் ‘கழுதை’ இயல்பானது; எபிரேயச் சொல் பெண் கழுதையைத் துல்லியமாகக் குறிக்கிறது என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁנֵי נְעָרָיו
  choice: அவனுடைய இரண்டு இளைஞர்கள்
  rationale: נְעָרִים என்பதன் நேரடியான பொருள் ‘இளைஞர்கள்’; சூழல் அவர்களை ஊழியர்கள் அல்லது உதவியாளர்கள் எனத் தெளிவாகக் கட்டுப்படுத்தாததால் அந்தத் தெளிவின்மை காக்கப்படுகிறது.
theological_decisions:
- issue: שָׂטָן என்பதன் இச்சூழலிலான பொருள்
  choice: 'பொதுப்பெயர்: ‘எதிராளி’'
  alternative: 'சிறப்புப்பெயர்: ‘சாத்தான்’'
  rationale: எண்ணாகமம் 22:22-இல் இச்சொல் யாவேயின் தூதர் பிலேயாமை எதிர்க்கும் பங்கை விவரிக்கிறது; தனிப்பட்ட தீய ஆவியின் பெயராக இதைப் புரிந்துகொள்ள எபிரேய இலக்கணமோ சூழலோ கட்டாயப்படுத்தவில்லை.
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்த்து வழங்குகிறது.
- issue: கடவுள் கோபமடைந்ததற்கும் பிலேயாம் செல்வதற்குக் கிடைத்த முந்தைய அனுமதிக்கும் இடையிலான பதற்றம்
  choice: ‘அவன் போய்க்கொண்டிருந்ததால்’ என்று காரணத் தொடர்பை நேரடியாகக் காத்தல்
  alternative: அவன் தவறான நோக்கத்தோடு சென்றதால் என்று விளக்கிச் சேர்த்தல்
  rationale: மூல வசனம் நோக்கம் அல்லது நிபந்தனை மீறல் பற்றிய விளக்கத்தை இங்கே கூறவில்லை; எனவே உரையிலுள்ள உண்மையான இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மூண்டது’, ‘எதிராளியாக’, ‘வந்து நின்றார்’ ஆகியவை மூலத்தின் தீவிரத்தையும் திட்டமிட்ட எதிர்ப்பையும் இயல்பாகத் தக்கவைக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
