revisions:
- from: அதனால் அவன், ஆற்றருகே[a], அவனுடைய மக்களின் புதல்வர்களின் நாட்டில்[b] இருந்த பெத்தோரிலுள்ள பேயோரின் மகன் பிலேயாமை அழைக்கத் தூதுவர்களை அனுப்பி, “இதோ, ஒரு மக்கள் கூட்டம் எகிப்திலிருந்து புறப்பட்டு வந்திருக்கிறது. இதோ, அவர்கள் நிலத்தின் முகப்பை[c] மூடிவிட்டார்கள்; அவர்கள் எனக்கு எதிரே குடியிருக்கிறார்கள்” என்று சொல்லச் சொன்னான்.
  to: அதனால் அவன், ஆற்றருகே[a], அவனுடைய மக்களின் சந்ததியாரின் நாட்டில் உள்ள பெத்தோரில் இருந்த பேயோரின் மகன் பிலேயாமை அழைக்கும்படி தூதர்களை அனுப்பினான். அவர்கள் அவனிடம், “இதோ, ஒரு மக்கள் கூட்டம் எகிப்திலிருந்து வெளியே வந்திருக்கிறது. இதோ, அது நிலத்தின் முகத்தை[c] மூடிவிட்டது; அந்த மக்கள் கூட்டம் எனக்கு எதிரே குடியிருக்கிறது” என்று சொல்லும்படி அனுப்பப்பட்டார்கள்.
  rationale: The revision retains the Hebrew’s uncertain geographical/population phrase and its footnote, preserves the repeated attention marker ‘இதோ,’ and uses singular collective wording for ‘people.’ The opening has been recast for readable Tamil. Footnote b is retained because the ambiguity of ‘his people’ must not be silently resolved.
