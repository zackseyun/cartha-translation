base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: ta
  text: அதனால் அவன், ஆற்றருகே[a], அவனுடைய மக்களின் சந்ததியாரின் நாட்டில் உள்ள பெத்தோரில் இருந்த பேயோரின் மகன் பிலேயாமை அழைக்கும்படி தூதர்களை அனுப்பினான். அவர்கள் அவனிடம், “இதோ, ஒரு மக்கள் கூட்டம் எகிப்திலிருந்து வெளியே வந்திருக்கிறது. இதோ, அது நிலத்தின் முகத்தை[c] மூடிவிட்டது; அந்த மக்கள் கூட்டம் எனக்கு எதிரே குடியிருக்கிறது” என்று சொல்லும்படி அனுப்பப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அந்த ஆறு’; இது பெரும்பாலும் ஐப்பிராத்து ஆற்றைக் குறிக்கும்.
    reason: cross_reference
  - marker: c
    text: சொல்லுக்குச் சொல், ‘நிலத்தின் கண்ணை’; இங்கு அது நிலத்தின் காணப்படும் முகத்தை அல்லது மேற்பரப்பைக் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: அதனால் அவன் ... தூதுவர்களை அனுப்பி
  rationale: வழக்குரையின் தொடர்ச்சியை וַיִּשְׁלַח முன்னெடுக்கிறது; இச்சூழலில் מַלְאָכִים என்பது வானதூதர்களை அல்ல, மனிதத் தூதுவர்களைக் குறிக்கிறது.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: பேயோரின் மகன் பிலேயாம்
  rationale: பெயர்கள் நவீனத் தமிழில் பரவலாக அறியப்படும் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளன.
- source_word: פְּתוֹרָה
  choice: பெத்தோரிலுள்ள
  rationale: இடப்பெயரில் உள்ள திசைச்சுட்டும் முடிவு பெத்தோரை நோக்கிய அனுப்புதலைக் காட்டினாலும், தொடரும் சார்பு வாக்கியம் பிலேயாமின் இருப்பிடத்தை அடையாளப்படுத்துவதால் தமிழில் இவ்வாறு இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: ஆற்றருகே
  rationale: மூலத்தில் குறிப்பிட்ட ஆற்றின் பெயர் இல்லாமல் ‘அந்த ஆறு’ என்றே உள்ளது; அது ஐப்பிராத்து எனப் புரிந்துகொள்ளப்படுவது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: அவனுடைய மக்களின் புதல்வர்களின் நாட்டில்
  rationale: கடினமான எபிரெயச் சொற்றொடரின் ‘மக்களின் புதல்வர்கள்’ என்ற அமைப்பையும், ‘அவனுடைய’ என்பதன் தெளிவற்ற சுட்டுதலையும் பிரதான உரை முடிந்தவரை பாதுகாக்கிறது.
- source_word: לִקְרֹא לוֹ
  choice: அவனை அழைக்க
  rationale: நோக்கத்தைத் தெரிவிக்கும் வினையெச்சம் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது; ‘வரவழைக்க’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத இயக்கத்தை வலுப்படுத்தும்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: இருமுறை வரும் கவன ஈர்ப்பையும் வலியுறுத்தலையும் விடாமல், நவீனத் தமிழில் கண்ணியமாகத் தருகிறது.
- source_word: עַם
  choice: ஒரு மக்கள் கூட்டம்
  rationale: இது பெரிய இனம்சார் மக்கள்குழுவைக் குறிக்கிறது; தமிழில் இயல்பில்லாத ‘ஒரு மக்கள்’ என்பதற்குப் பதிலாக வாசிக்கத் தெளிவான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָצָא מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்திருக்கிறது
  rationale: நிகழ்ந்த செயலும் பேச்சாளருக்கான அதன் தற்போதைய தாக்கமும் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: நிலத்தின் முகப்பை மூடிவிட்டார்கள்
  rationale: עֵין என்பதன் நேர்ப்பொருள் ‘கண்’; இச்சொற்றொடரில் அது காணப்படும் நிலப்பரப்பை அல்லது முகப்பைக் குறிக்கிறது. மூல உருவகத்தை ஓரளவு காக்க ‘முகப்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: அவர்கள் எனக்கு எதிரே குடியிருக்கிறார்கள்
  rationale: எபிரெயத்தில் ‘மக்கள்’ ஒருமை இலக்கண வடிவில் இருந்தாலும், தமிழில் மனிதக் கூட்டத்தைக் குறிப்பிட மரியாதை/பன்மை இயல்பாக இருப்பதால் ‘அவர்கள்’ பயன்படுத்தப்பட்டுள்ளது; יֹשֵׁב இங்கு குடியிருத்தல் அல்லது முகாமிட்டிருத்தலைக் குறிக்கலாம்.
theological_decisions:
- issue: ‘அவனுடைய மக்களின் புதல்வர்களின் நாடு’ என்பதில் ‘அவன்’ யாரைக் குறிக்கிறது?
  choice: தெளிவற்ற சுட்டுப்பெயரை பிரதான உரையில் அப்படியே வைத்தல்
  alternative: ‘அவனுடைய மக்களின் நாடு’ அல்லது ‘தன் சொந்த மக்களின் நாடு’ என்று தெளிவாக்குதல்
  rationale: எபிரெய வாசகம் கடினமானது; சுட்டுப்பெயரின் குறிப்பைத் தீர்மானிப்பது உரையில் இல்லாத விளக்கத்தை இறக்குமதி செய்யும். ஆகவே மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்ற மறுமொழி மூலத்தின் வலியுறுத்தலைக் காக்கிறது. கடினமான இடப்பெயர் சார்பு அமைப்பும் சுட்டுப்பெயர் தெளிவின்மையும் மிகையாகச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
