source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: ta
  text: பெண் கழுதை யாவேயின் தேவதூதரை[a] கண்டபோது, அது சுவரை ஒட்டி தன்னை நெருக்கிக்கொண்டு, பிலேயாமின் பாதத்தைச் சுவரில் அழுத்தியது. அதனால் அவன் அதை மீண்டும் அடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் தூதரை.” இச்சூழலில் இது இயற்கைக்கு அப்பாற்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: கழுதை
  rationale: எபிரெயச் சொல் பெண் கழுதையைக் குறிக்கிறது. தமிழில் இயல்பாக ‘கழுதை’ என்று கூறலாம்; விலங்கின் பாலினத்தை இவ்வசனத்தில் தனியாகச் சுட்டுவது கருத்துக்கு அவசியமில்லை.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இச்சூழலில் இயற்கைக்கு அப்பாற்பட்ட தேவதூதரைக் குறிக்கிறது. ‘தூதர்’ என்பது மூலச்சொல்லின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: சுவரோடு தன்னை நெருக்கிக்கொண்டு
  rationale: கழுதை சுவரை ஒட்டி இறுக்கமாக நகர்ந்ததைக் காட்டும் பிரதிபலிப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: பிலேயாமின் பாதத்தைச் சுவரோடு நசுக்கியது
  rationale: לחץ இங்கு பிலேயாமின் பாதத்தைச் சுவருக்கும் கழுதைக்கும் இடையில் கடுமையாக அழுத்திய செயலைக் குறிக்கிறது; ‘நசுக்கியது’ அதன் உடல்சார் விளைவைத் தெளிவாகக் கூறுகிறது.
- source_word: רֶגֶל
  choice: பாதம்
  rationale: இச்சூழலில் சுவரோடு அழுத்தப்பட்ட உடற்பகுதி ‘பாதம்’ என்பதே நேரான பொருள்.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: அதை மீண்டும் அடித்தான்
  rationale: יָסַף + வினையெச்ச அமைப்பு செயல் திரும்ப நிகழ்ந்ததைச் சுட்டுகிறது; ‘மீண்டும் அடித்தான்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: מַלְאַךְ என்பதன் பொருள்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: இக்கதையில் அந்த உருவம் இயற்கைக்கு அப்பாற்பட்டவர் என்பது தெளிவாக இருந்தாலும், மூலச்சொல்லின் ‘தூதர்/தேவதூதர்’ என்ற பொருள் விரிவை முதன்மை உரையில் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. ‘சுவரோடு’ என்ற வடிவம் இரு தொடர்களிலும் மூலத்தின் மீளுரையைத் தக்கவைக்கிறது; இரண்டாவது இடத்தில் ‘நசுக்கியது’ செயல் ஏற்படுத்திய கடுமையான அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
