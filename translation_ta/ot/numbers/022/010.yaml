  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: ta
  text: பிலேயாம் கடவுளிடம், “சிப்போரின் மகனும் மோவாபின் அரசனுமான பாலாக் என்னிடம் அனுப்பியிருக்கிறான்:[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “என்னிடம் அனுப்பியிருக்கிறான்”; சூழலின்படி, “என்னை அழைக்க அனுப்பியிருக்கிறான்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ்-தொடர்வினை கதைநடையை முன்னெடுக்கிறது. தமிழில் நேரடி உரையின் முடிவில் ‘என்றான்’ என்பது இயல்பான கதைநடை வடிவம்.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் அடையாளம் காணத்தக்க வகையில் ஒலிபெயர்த்தது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: முன்னுள்ள சூழலில் குறிப்பிட்ட ஒரே கடவுளையே இச்சொல் குறிக்கிறது; தமிழில் உரையாடல் பெறுநரை இயல்பாகக் காட்ட ‘கடவுளிடம்’ பயன்படுத்தப்பட்டது.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: சிப்போரின் மகனும் ... பாலாக்
  rationale: தந்தை-மகன் உறவைத் தெளிவாகவும், அடுத்த அடையாளப் பதவியுடன் தமிழில் இயல்பாக இணையும் வகையிலும் மொழிபெயர்த்தது.
- source_word: מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசனுமான
  rationale: பாலாக்கை அடையாளப்படுத்தும் இணைப்புப் பெயர்த் தொடராக உள்ள எபிரெய கட்டமைப்பை இயல்பான தமிழில் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: שָׁלַח אֵלַי
  choice: என்னிடம் ஆட்களை அனுப்பி
  rationale: அடுத்த வசனத்தில் செய்தி மேற்கோள் தொடர்வதால், தமிழில் முடிவுறாத மேற்கோள் அமைப்பாக ‘அனுப்பி’ இயல்பாகிறது. அனுப்பப்பட்டவர்கள் பாலாக்கின் தூதர்கள் என்பது உடனடிச் சூழலில் தெளிவாக இருப்பதால் ‘ஆட்களை’ வெளிப்படுத்தியுள்ளது; எபிரெயில் சொற்சொல்லாக ‘என்னிடம் அனுப்பினான்’ என்பதே உள்ளது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் குறிப்பு
  choice: பிலேயாம் பேசும் ஒரே கடவுள்
  alternative: பொதுவான பொருளில் ஒரு தெய்வம் அல்லது தெய்வங்கள்
  rationale: முந்தைய வசனத்தில் பிலேயாமைச் சந்தித்த இறைவரையே உடனடிச் சூழல் சுட்டுகிறது. ‘கடவுள்’ என்பது அதைக் காட்டுகிறது; கூடுதல் சமயக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. வசனம் 11-இல் தொடரும் மேற்கோளை உணர்த்த இறுதியில் நிறைவுறாத ‘அனுப்பி’ அமைப்பு வைக்கப்பட்டுள்ளது.
