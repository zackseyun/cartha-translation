translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலாம் ஒரே நபர் என்பதால் அவரை நோக்கிய உரையில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; கூட்டொருமையான ‘மக்கள்’ என்பதைக் குறிக்கும் சுட்டுப்பெயர்களும் வினைகளும் தமிழில் இயல்பாகப் பன்மையில் வழங்கப்பட்டுள்ளன.
