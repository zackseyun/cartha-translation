id: NUM.22.11
reference: Numbers 22:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: ta
  text: இதோ, எகிப்திலிருந்து புறப்பட்டுவந்த மக்கள் நாட்டின் மேற்பரப்பையே மூடிவிட்டார்கள்.[a] இப்போது நீர் வந்து, எனக்காக அவர்களைச் சபியும். ஒருவேளை என்னால் அவர்களோடு போரிட்டு அவர்களைத் துரத்தியடிக்க முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “நாட்டின் கண்ணை மூடிவிட்டார்கள்”; இது காணக்கூடிய நிலப்பரப்பை அல்லது நாட்டின் மேற்பரப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிக்கையைக் கவன ஈர்ப்புடனும் அவசர உணர்வுடனும் அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் இயல்பான வேதாகம நடை.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேலை ஒரு கூட்டினமாகக் குறிக்கும் ஒருமைச் சொல்லைத் தமிழில் இயல்பான கூட்டுப்பெயராக வழங்குகிறது.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டுவந்த
  rationale: பெயரடைச் செயல்பாட்டிலுள்ள எபிரெயப் பங்கேற்புவினையை, வெளியேற்ற நிகழ்வால் மக்களை அடையாளப்படுத்தும் தமிழ்த் தொடராக வழங்குகிறது.
- source_word: וַיְכַס
  choice: மூடிவிட்டார்கள்
  rationale: கூட்டொருமைப் பொருளைத் தமிழில் பன்மை இயைபுடன் வழங்கி, நிகழ்ந்த செயலின் தற்போதைய விளைவையும் காட்டுகிறது.
- source_word: עֵין הָאָרֶץ
  choice: நாட்டின் மேற்பரப்பு
  rationale: சொல்லர்த்தமாக ‘நாட்டின் கண்’ என்றாலும், காணக்கூடிய நிலப்பரப்பு முழுவதையும் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாகத் தருகிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: விளக்கத்திலிருந்து அவசர வேண்டுகோளுக்கான மாற்றத்தைக் குறிக்கிறது.
- source_word: לְכָה
  choice: நீர் வந்து
  rationale: செயலுக்கு அழைக்கும் கட்டளையை மரியாதை ஒருமையுடன் இயல்பான தமிழில் வழங்குகிறது.
- source_word: קָבָה
  choice: சபியும்
  rationale: தீங்கு உண்டாகும்படி சாபம் கூறுவதைக் குறிக்கும் வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: לִּי
  choice: எனக்காக
  rationale: பாலாக்கின் சார்பாகவும் நன்மைக்காகவும் செயல் புரிய வேண்டுமென்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: אֹתוֹ
  choice: அவர்களை
  rationale: வடிவில் ஒருமையாக இருந்தாலும் ‘மக்கள்’ என்ற கூட்டுப்பெயரைக் குறிக்கும் சுட்டுப்பெயரைத் தமிழில் பொருளுக்கேற்ற பன்மையாக வழங்குகிறது.
- source_word: אוּלַי אוּכַל
  choice: ஒருவேளை என்னால் ... முடியும்
  rationale: உறுதியல்லாத சாத்தியத்தையும் எதிர்பார்ப்பையும் பாதுகாக்கிறது.
- source_word: לְהִלָּחֶם בּוֹ
  choice: அவர்களோடு போரிட்டு
  rationale: அந்த மக்களுக்கு எதிராகப் போரில் ஈடுபடுவதைக் குறிக்கும் இயல்பான தமிழ்த் தொடர்.
- source_word: וְגֵרַשְׁתִּיו
  choice: அவர்களைத் துரத்தியடிக்க
  rationale: அவர்களை அந்த இடத்திலிருந்து பலவந்தமாக அகற்றும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
