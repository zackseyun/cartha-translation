source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: ta
  text: இப்போது, நீங்களும் தயவுசெய்து இன்றிரவு இங்கே தங்கியிருங்கள்; யாவே என்னிடம் இன்னும் என்ன பேசுவார் என்பதை நான் அறிந்துகொள்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே என்னிடம் வேறு என்ன பேசுவார் என்பதை நான் அறிந்துகொள்வேன்.”
    reason: מַה יֹסֵף என்பதில் உள்ள ‘மேலும்/வேறு என்ன’ என்ற மாற்றுச் சொல்லாட்சிக்கான மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதும்
  rationale: அடுத்த அறிவுறுத்தலை அறிமுகப்படுத்தும் உரையாடல் இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שְׁבוּ נָא
  choice: தங்கியிருங்கள்
  rationale: ישׁב இச்சூழலில் ‘உட்காருங்கள்’ என்பதைக் காட்டிலும் ‘தங்கியிருங்கள்’ என்ற பொருளில் வருகிறது; נָא-வின் மென்மையான வேண்டுகோள் மரியாதைமிக்க ஏவல் வடிவில் இயல்பாக வெளிப்படுகிறது.
- source_word: בָזֶה
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: גַּם אַתֶּם
  choice: நீங்களும்
  rationale: முந்தைய தூதுக்குழுவைப் போல இவர்களும் தங்க வேண்டும் என்ற சேர்க்கைப் பொருளைத் தக்கவைக்கிறது.
- source_word: הַלָּיְלָה
  choice: இந்த இரவு
  rationale: வரவிருக்கும் இரவைக் குறிக்கும் காலப் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְאֵדְעָה
  choice: நான் அறிந்துகொள்வேன்
  rationale: கோஹோர்டேட்டிவ் வடிவின் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מַה יֹּסֵף
  choice: மேலும் ... என்ன
  rationale: יסף உடனான சொல்லாட்சி கூடுதலாக அல்லது தொடர்ந்து சொல்லப்படுவதைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: דַּבֵּר עִמִּי
  choice: என்னிடம் ... பேசுவார்
  rationale: எபிரெயச் சொற்றொடரின் தொடர்புறு தன்மையைத் தக்கவைத்தபடி தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; நவீன தமிழ்ப் பயன்பாட்டில் ‘யெகோவா’ பரவலாக அடையாளம் காணப்படுகிறது.
- issue: பிலேயாம் கூடுதல் வெளிப்பாட்டை எதிர்பார்ப்பது
  choice: மேலும் என்னிடம் என்ன பேசுவார்
  alternative: வேறு என்ன சொல்லுவார்
  rationale: முன்னர் கூறப்பட்டதற்கு மேலாக ஏதேனும் சொல்லப்படுமா என்ற பதற்றத்தைத் தக்கவைக்கிறது; அவனுடைய எதிர்பார்ப்பை ஆதரிக்கவோ கண்டிக்கவோ மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். பன்மை மரியாதை வடிவமும் எபிரெய மூலத்தின் சேர்க்கை வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
