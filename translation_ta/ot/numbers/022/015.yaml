  source_fidelity: 'மையக் கருத்து துல்லியமாக உள்ளது: பாலாக் மீண்டும் ஒரு தூதுக்குழுவை அனுப்பினான்; அவர்கள் முந்தைய குழுவைவிட எண்ணிக்கையிலும் கண்ணிய/அந்தஸ்திலும் உயர்ந்தவர்கள். ஆனால் தற்போதைய ‘அதிக எண்ணிக்கையிலும் உயர்ந்த மதிப்பிலும் இருந்த அதிகாரிகளை’ என்ற அமைப்பு ஒப்பீட்டு உறவைச் சற்றே தளர்வாகவும் ‘மதிப்பு’ என்பதை இயல்புக்கு மாறாகவும் வெளிப்படுத்துகிறது.'
  naturalness: ‘எண்ணிக்கையில் அதிகமானவர்களும் அதிகக் கண்ணியமுள்ளவர்களுமான அதிகாரிகள்’ என்பது நவீன பொதுத்தமிழில் இரு ஒப்பீடுகளையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘முன்பு வந்தவர்கள்’ என்பது முந்தைய தூதுக்குழுவைக் குறிக்கும் சூழல்சார் விளக்கமாக ஏற்றது.
  terminology: ‘அதிகாரிகள்’ என்பது שָׂרִים என்பதற்கு இச்சூழலில் பொருத்தமான நவீன சொல். וְנִכְבָּדִים என்பதற்கு ‘அதிகக் கண்ணியமுள்ள’ என்பது மதிப்பு, பெருமை, உயர் அந்தஸ்து ஆகிய நுணுக்கங்களைத் தக்கவைக்கிறது. ‘பாலாக்’ என்ற பெயர்ப்பும் ஏற்றது.
  issues:
