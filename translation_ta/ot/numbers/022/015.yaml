    rationale: ரַבִּים மற்றும் וְנִכְבָּדִים இரண்டும் מֵאֵלֶּה உடனான ஒப்பீட்டில் உள்ளன. ‘உயர்ந்த மதிப்பிலும் இருந்த’ என்பதற்குப் பதிலாக ‘அதிகக் கண்ணியமுள்ள’ என்பது தமிழில் நபர்களின் சமூக மதிப்பு/அந்தஸ்தை இயல்பாகத் தெரிவிக்கிறது.
