  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: ta
  text: அப்போது பாலாக், முன்பு வந்தவர்களைவிட எண்ணிக்கையில் அதிகமானவர்களும் அதிகக் கண்ணியமுள்ளவர்களுமான அதிகாரிகளை மீண்டும் அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் உயர்ந்த அந்தஸ்துடைய அதிகாரிகளை.” எபிரெயச் சொல் உயர்ந்த கண்ணியம், பெருமை, அல்லது அந்தஸ்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: மீண்டும் அனுப்பினான்
  rationale: யָסַף + வினையெச்சம் என்ற எபிரெய மரபுத்தொடரும் עוֹד என்பதும் செயல் மறுபடியும் நிகழ்ந்ததை வலியுறுத்துகின்றன; இயல்பான தமிழில் ‘மீண்டும் அனுப்பினான்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בָּלָק
  choice: பாலாக்
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழெழுத்துப் பெயர்ப்பில் வழங்கப்பட்டுள்ளது.
- source_word: שָׂרִים
  choice: அதிகாரிகளை
  rationale: இச்சூழலில் உயர்நிலைத் தூதுக் குழுவினராகச் செயல்படும் ஆட்சிசார் பிரதிநிதிகளை குறிக்கிறது; நவீன தமிழில் ‘அதிகாரிகள்’ தெளிவானது.
- source_word: רַבִּים
  choice: அதிக எண்ணிக்கையிலும்
  rationale: מֵאֵלֶּה என்ற ஒப்பீட்டுத் தொடரால், வெறுமனே ‘பலர்’ என்பதைக் காட்டிலும் முன்னைய குழுவைவிட எண்ணிக்கையில் அதிகம் என்பது தெளிவாகிறது.
- source_word: וְנִכְבָּדִים
  choice: உயர்ந்த மதிப்பிலும்
  rationale: כבד வேரிலிருந்து வரும் இச்சொல் மதிப்பு, கண்ணியம், அந்தஸ்து ஆகிய பொருள்களைத் தருகிறது; ‘உயர்ந்த மதிப்பில்’ என்பது உயர்நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: מֵאֵלֶּה
  choice: முன்பு வந்தவர்களைவிட
  rationale: சுட்டுப்பெயர் முந்தைய தூதுக் குழுவைக் குறிக்கிறது; தமிழில் குறிப்பை வெளிப்படையாக்குவது இயல்பும் தெளிவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அப்போது’ கதைத் தொடர்ச்சியைக் காட்டுகிறது; ‘மீண்டும்’ மறுபடியும் அனுப்பிய செயலைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
