  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: ta
  text: அந்த மக்கள் எண்ணிக்கையில் பெருகியிருந்ததால், மோவாப் அவர்களைக் கண்டு மிகவும் பயந்தது; இஸ்ரவேல் மக்களைக்[b] கண்டு மோவாப் கலங்கியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருப்படைந்தது,” “வெறுத்தது,” அல்லது “அச்சத்தால் திகிலடைந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை அருவருப்பு, மன உளைச்சல், அல்லது அச்சம் கலந்த கலக்கம் ஆகியவற்றைக் குறிக்கக்கூடும்; இங்கு மோவாபின் அச்சம் நிறைந்த எதிர்வினையைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; மரபாக, “இஸ்ரவேலின் பிள்ளைகள்.” இங்கு இஸ்ரவேல் மக்கள் அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: மிகவும் பயந்தது
  rationale: גור என்னும் வினை இச்சூழலில் பயம் அல்லது திகிலைக் குறிக்கிறது; מְאֹד என்பதன் வலியுறுத்தலை ‘மிகவும்’ வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי
  choice: கண்டு
  rationale: சொல்லுக்குச் சொல் ‘முகத்தினின்று/முன்னிலையிலிருந்து’ என்றாலும், இங்கு மோவாபின் அச்சத்திற்கான காரணத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: அந்த மக்கள்
  rationale: இது இஸ்ரவேலை ஒரு கூட்டுமக்களாகக் குறிக்கும் ஒருமைச் சொல்; முந்தைய சூழலைச் சுட்டுவதால் ‘அந்த மக்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּי רַב הוּא
  choice: அந்த மக்கள் எண்ணிக்கையில் மிகுந்திருந்ததால்
  rationale: எபிரெயத்தில் கூட்டுப்பெயருடன் ஒருமைச் சுட்டுப்பெயர் வந்தாலும், கருத்து மக்களின் பெரும் எண்ணிக்கையைப் பற்றியது; தமிழ் கூட்டுப் பயன்பாட்டுக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּקָץ
  choice: கடும் திகிலடைந்தது
  rationale: קוץ அருவருப்பு, மனக்கசப்பு, வெறுப்பு அல்லது உடலை உலுக்கும் அச்சத்தைக் குறிக்கக்கூடும். இச்சூழலில் அச்சம் மேலோங்குவதால் ‘கடும் திகிலடைந்தது’ முதன்மை உரையில் இயல்பாக உள்ளது; பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’; ஆனால் இங்கு முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்குச் சொற்றொடர். ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தில் துல்லியமாகவும் உள்ளது.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: இடத்தையும் மக்களையும் குறிக்கும் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
