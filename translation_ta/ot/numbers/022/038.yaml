base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: ta
  text: பிலேயாம் பாலாக்கிடம், “இதோ, இப்போது உம்மிடம் வந்திருக்கிறேன். எதையும் பேச என்னால் உண்மையிலேயே முடியுமா?[a] கடவுள் என் வாயில் வைக்கும் வார்த்தையையே நான் பேசுவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதையாவது பேசுவதற்கான திறன் உண்மையிலேயே எனக்கு இருக்கிறதா?” திறனைக் குறிக்கும் எபிரெய வினையமைப்பு வலியுறுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: பிலேயாமின் வலியுறுத்தலையும் கவனத்தை ஈர்க்கும் சுட்டும் தன்மையையும் இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: இப்போது உம்மிடம் வந்திருக்கிறேன்
  rationale: வருகை நிறைவேறியிருப்பதையும் அதன் தற்போதைய உடனடித் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲיָכוֹל אוּכַל
  choice: உண்மையிலேயே எனக்குத் திறன் உண்டா?
  rationale: வினையெச்ச முழுமையும் வினைமுற்றும் இணைந்த எபிரெய வலியுறுத்தலை இயல்பான தமிழ்க் கேள்வியாகப் பிரதிபலிக்கிறது.
- source_word: דַּבֵּר מְאוּמָה
  choice: எதையாவது பேசுவதற்கு
  rationale: מְאוּמָה என்பதன் ‘எதுவாயினும்’ என்ற பரப்பைச் சுருக்காமல் காக்கிறது; கேள்வியின் வலியுறுத்தல் அடுத்த சொற்றொடரில் வெளிப்படுகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் கடவுளால் அளிக்கப்படும் குறிப்பிட்ட உரையைச் சுட்டும் ஒருமைச் சொல்லை காக்கிறது.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: கடவுள் என் வாயில் வைக்கும்
  rationale: தெய்வீகமாக அளிக்கப்படும் பேச்சைக் குறிக்கும் மூலமொழியின் தெளிவான உருவகத்தை தமிழிலும் காக்கிறது.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: வார்த்தையையே நான் பேசுவேன்
  rationale: ‘-ஏ’ என்னும் தமிழ்ச் சிறப்பும்மை, முன்னிலைப்படுத்தப்பட்ட பொருளின் வரையறுக்கும் வலியுறுத்தலை இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சொல் வடிவில் பன்மையாக இருந்தாலும் ஒருமை வினையும் சூழலும் இஸ்ரவேலின் கடவுளையே குறிக்கின்றன.
theological_decisions:
- issue: பிலேயாமின் பேச்சின்மேல் உள்ள தெய்வீகக் கட்டுப்பாடு
  choice: கடவுள் தன் வாயில் வைக்கும் வார்த்தையையே பேச முடியும் எனப் பிலேயாம் கூறுகிறார்.
  alternative: தான் விரும்பியதைப் பேசும் திறன் இருந்தாலும் தன்னிச்சையாகக் கடவுளின் வார்த்தைக்கு மட்டும் தன்னை வரையறுத்துக்கொள்கிறார்.
  rationale: הֲיָכוֹל אוּכַל என்ற வலியுறுத்தப்பட்ட கேள்வியும் אֹתוֹ אֲדַבֵּר என்ற வரையறுக்கும் அமைப்பும் வெறும் தனிப்பட்ட விருப்பத்தைவிட கட்டுப்படுத்தப்பட்ட தீர்க்கதரிசனப் பேச்சைக் காட்டுகின்றன. எனினும் அதன் செயல்முறையை மொழிபெயர்ப்பு மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனான பாலாக்கிடம் பேசுவதால் மரியாதைப் பன்மையான ‘உம்மிடம்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் சொல்லமைப்பும் தமிழின் இயல்பும் சமநிலைப்படுத்தப்பட்டுள்ளன.
