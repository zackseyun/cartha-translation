source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: ta
  text: அப்போது பிலேயாம் யாவேயின் தூதரிடம்[a], “நான் பாவம் செய்தேன்; ஏனெனில், வழியில் என்னை எதிர்கொள்வதற்காக நீர் நின்றுகொண்டிருந்ததை நான் அறியவில்லை. இப்போது உமது பார்வையில் இது தீமையாயிருந்தால்[b], நான் திரும்பிப் போவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வானதூதரிடம்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “இது உமது கண்களில் தீமையாக இருந்தால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது வானதூதர் எனப் பொருள்படலாம். உருவிய வாளுடன் பிலேயாமை வழியில் எதிர்த்து நிற்பவர் இயற்கைக்கு அப்பாற்பட்ட தூதர் என்பது சூழலில் தெளிவாக இருந்தாலும், தமிழில் ‘தூதர்’ இரு நுணுக்கங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தேன்
  rationale: நிறைவுற்ற வினை பிலேயாம் தன் குற்றத்தை ஒப்புக்கொள்வதைக் குறிக்கிறது; இவ்வடிவம் நவீன தமிழில் நேரடியும் இயல்புமானதும் ஆகும்.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: நான் அறியவில்லை
  rationale: כִּי இங்கு ஒப்புக்கொள்ளப்பட்ட பாவத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் அடுத்த வாக்கியமாக அமைப்பது காரணத் தொடர்பைச் சூழலால் தெளிவாக வைத்தபடி இயல்பான நேரடிப் பேச்சை அளிக்கிறது.
- source_word: נִצָּב לִקְרָאתִי
  choice: என்னை எதிர்கொள்வதற்காக நீர் நின்றுகொண்டிருந்ததை
  rationale: נִצָּב என்பது நிலைகொண்டு நிற்பதையும், לִקְרָאתִי என்பது சந்திக்க எதிரே வருவதையும் குறிக்கிறது. உருவிய வாள் மற்றும் வழிமறித்தல் ஆகிய சூழல் காரணமாக ‘எதிர்கொள்வதற்காக’ என்பது எதிர்ப்புத் தன்மையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: பயணச் சூழலில் இடத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: ஒப்புக்கொள்ளுதலிலிருந்து பிலேயாமின் அடுத்த நடவடிக்கைக்குச் செல்லும் உரைமாற்றத்தை இயல்பாகக் குறிக்கிறது.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: இது உமது பார்வைக்குத் தீமையானதாக இருந்தால்
  rationale: ‘உமது கண்களில் தீமை’ என்ற எபிரெயச் சொற்றொடரின் உருவகத்தையும் அதன் அறநெறி வலிமையையும் ‘உமது பார்வைக்குத் தீமையானது’ எனத் தமிழில் புரியத்தக்க முறையில் தக்கவைக்கிறது.
- source_word: אָשׁוּבָה לִּי
  choice: நான் திரும்பிப் போகிறேன்
  rationale: விருப்பம் அல்லது உறுதியை வெளிப்படுத்தும் cohortative வடிவத்தை நவீன தமிழில் இயல்பான தீர்மானக் கூற்றாக வழங்குகிறது; לִּי தனியாக மொழிபெயர்க்க வேண்டாத நுணுக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கெழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் வேறுபாட்டையும் தக்கவைக்கிறது.
- issue: מַלְאַךְ என்பதன் அடையாளம்
  choice: தூதர்
  alternative: வானதூதர்
  rationale: சூழல் இவர் இயற்கைக்கு அப்பாற்பட்டவர் என்பதை உணர்த்தினாலும், மூலச்சொல் அடிப்படையில் ‘செய்தியாளர்/தூதர்’ என்ற பொருளையும் கொண்டுள்ளது. ‘தூதர்’ genuine lexical ambiguity-ஐத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தெய்வீகத் தூதரிடம் பேசுவதால் ‘நீர்/உமது’ என்ற மரியாதை ஒருமை கையாளப்பட்டது. எபிரெயச் சொற்றொடரின் உருவகத்தை முதன்மை உரையில் புரியத்தக்கவாறு வைத்தும், அதன் சொல்லர்த்த வடிவத்தை அடிக்குறிப்பிலும் பதிவு செய்தும் உள்ளது.
