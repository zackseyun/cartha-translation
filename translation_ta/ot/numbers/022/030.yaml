base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: ta
  text: அப்போது அந்தப் பெண் கழுதை பிலேயாமிடம், “உன் வாழ்நாள் தொடங்கி இந்நாள்வரை நீ ஏறிச் சென்ற உன் கழுதை நானல்லவா? நான் உன்னிடம் இப்படி நடந்துகொள்வது எப்போதாவது என் வழக்கமாக இருந்ததா?” என்று சொன்னது. அதற்கு அவன், “இல்லை” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: அந்தப் பெண் கழுதை / உன் கழுதை
  rationale: אָתוֹן என்பது பெண் கழுதையைக் குறிப்பாகக் குறிக்கிறது. முதல் குறிப்பில் பாலின வேறுபாட்டைத் தெளிவாகக் காட்டி, பின்னர் இயல்பான தமிழ் உரையாடலுக்காக ‘உன் கழுதை’ என வழங்கப்பட்டுள்ளது.
- source_word: הֲלוֹא אָנֹכִי
  choice: நானல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய மறுப்புவடிவ வினாவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: நீ ஏறிச் சென்ற
  rationale: விலங்கின்மேல் சவாரி செய்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை உன் வாழ்நாளெல்லாம்
  rationale: சொல்லுக்கு சொல் ‘நீ இருந்ததிலிருந்து இந்நாள்வரை’ என்பதன் காலநீட்சி உணர்வை தெளிவான நவீன தமிழில் தருகிறது.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: எப்போதாவது ... வழக்கமா?
  rationale: சָכַן வேரின் பழக்கம் அல்லது வழக்கமான நடத்தை என்ற பொருளையும், வினையை வலுப்படுத்தும் எபிரெயக் கட்டமைப்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: உன்னிடம் இப்படி நடந்துகொள்வது
  rationale: כֹּה என்பது தற்போதைய நடத்தையைச் சுட்டுகிறது; ‘இப்படி நடந்துகொள்வது’ என்பது ‘உனக்கு இப்படிச் செய்வது’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பானது.
- source_word: וַיֹּאמֶר לֹא
  choice: அதற்கு அவன், “இல்லை” என்றான்
  rationale: பிலேயாமின் சுருக்கமான எதிர்மறைப் பதிலை இயல்பான தமிழ் கதைநடையில் வழங்குகிறது.
