  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கதைநடை. பெண் கழுதை என்பதைக் குறிப்பாகத் தெரிவிக்கும் மூலமொழி நுணுக்கம் முதற்குறிப்பிலேயே பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
