base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: ta
  text: பின்பு யாவேவின் தூதன் மேலும் முன்னே சென்று, வலப்புறமோ இடப்புறமோ திரும்ப வழியில்லாத ஒரு குறுகலான இடத்தில் நின்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேலும் முன்னே சென்று” என்பதை “தொடர்ந்து சென்றார்” அல்லது “மேலும் கடந்து சென்றார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் தொடர்ந்து முன்னோக்கிச் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: இன்னும் முன்னே சென்று
  rationale: יסף + עבר என்ற எபிரெய மரபுத்தொடர், தொடர்ந்து இன்னும் முன்னே செல்வதைக் குறிக்கிறது; தமிழ் நடையில் இயல்பாகவும் காட்சியின் நகர்வைத் தெளிவாகவும் தருகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள்படலாம்; இங்கு இயற்கைக்கு அப்பாற்பட்ட தூதரைக் குறித்தாலும், மூலச்சொல்லின் ‘தூதர்’ என்ற அடிப்படைப் பொருளையும் அதன் சாத்தியமான நுணுக்கத்தையும் இது காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக வெளிப்படுத்துகிறது; தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: וַיַּעֲמֹד
  choice: நின்றார்
  rationale: עמד என்பதன் நேரடியான பொருளான ‘நில்’ என்பதை இயல்பான தமிழ் மரியாதை ஒருமையில் தருகிறது.
- source_word: בְּמָקוֹם צָר
  choice: ஓர் இடுக்கமான இடத்தில்
  rationale: צָר குறிக்கும் நெருக்கமான, ஒதுங்க இடமில்லாத பரப்பை ‘இடுக்கமான’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: விலகிச் செல்ல வழியில்லாத
  rationale: இங்கு דֶּרֶךְ என்பது பாதையே இல்லை என்பதல்ல; பக்கமாகத் திரும்புவதற்கு இடம் அல்லது வழி இல்லை என்பதே கருத்து. נטה-வின் ‘திரும்பு/விலகு’ பொருளைச் சூழலுக்கேற்றவாறு தருகிறது.
- source_word: יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ
  rationale: இரு திசைகளில் எதற்கும் விலக முடியாத நிலையை இயல்பான தமிழ் இணைப்பால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் பெயராகவே காக்கிறது. உச்சரிப்பின் வரலாற்றுச் சிக்கலை ஏற்றுக்கொண்டபடியே, நவீன தமிழ் வாசகர்களுக்கு அறிமுகமான ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: מַלְאַךְ என்பதன் மொழிபெயர்ப்பு
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: இந்தக் கதைச் சூழல் இயற்கைக்கு அப்பாற்பட்ட தூதரைக் காட்டுகிறது; எனினும் ‘தூதர்’ என்பது மூலச்சொல்லின் ‘messenger/angel’ என்ற பொருள் பரப்பைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. ‘இடுக்கமான இடம்’ மூலத்தின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது; ‘விலகிச் செல்ல’ என்பது வலமோ இடமோ திரும்ப இடமில்லாத சூழலைத் தெளிவாக்குகிறது.
