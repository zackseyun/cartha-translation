source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: ta
  text: மோவாபின் மூப்பர்களும் மீதியானின் மூப்பர்களும் குறிசொல்வதற்கான கூலியைத் தங்கள் கைகளில் எடுத்துக்கொண்டு புறப்பட்டார்கள்.[a] அவர்கள் பிலேயாமிடம் வந்து, பாலாக்கின் வார்த்தைகளை அவனிடம் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறிசொல்லும் பொருட்களைத் தங்கள் கைகளில் எடுத்துக்கொண்டு.” எபிரெயச் சொற்றொடர் குறிசொல்லப் பயன்படும் பொருட்களை அல்லது சகுனங்களைக் குறிக்கலாம்; ஆனால் இச்சூழலில் குறிசொல்வதற்காகக் கொண்டுவரப்பட்ட கூலியைக் குறிப்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: மூப்பர்கள்
  rationale: ஒரு மக்களினத்தின் பெயருடன் வரும் זָקֵן, அக்குழுவின் அங்கீகரிக்கப்பட்ட மூத்த தலைவர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ அந்தச் சமூக-அரசியல் நிலையைக் காக்கிறது.
- source_word: וּקְסָמִים בְּיָדָם
  choice: குறிசொல்வதற்கான கூலியைத் தங்கள் கைகளில் எடுத்துக்கொண்டு
  rationale: קְסָמִים என்பது குறிசொல்லும் செயல்கள் அல்லது அதற்கான பொருட்களைக் குறிக்கலாம்; இச்சூழலில் பிலேயாமின் குறிசொல்லும் சேவைக்காகக் கொண்டுவந்த கூலியை ஆகுபெயராகக் குறிப்பதே அதிகம் இயல்பானது. ‘தங்கள் கைகளில்’ என்ற உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיָּבֹאוּ אֶל
  choice: அவர்கள் ... வந்து
  rationale: בוא אֶל என்பது ஒருவரிடம் வந்து சேர்வதைக் குறிக்கிறது; முந்தைய ‘புறப்பட்டார்கள்’ என்பதற்குப் பின்வரும் நிகழ்வாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: அவனிடம் சொன்னார்கள்
  rationale: דבר אֶל என்பது ‘ஒருவரிடம் பேசுதல்’ எனப் பொருள்படும்; தமிழில் செய்தியின் உள்ளடக்கத்தைத் தெரிவிக்கும் இவ்வாக்கியத்தில் ‘சொன்னார்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: דִּבְרֵי בָלָק
  choice: பாலாக்கின் வார்த்தைகள்
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகக் காத்து, இது நேரடிக் கூற்றா அல்லது ஒப்படைக்கப்பட்ட செய்தியா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וַיֵּלְכוּ
  choice: புறப்பட்டார்கள்
  rationale: தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது. அடுத்ததாக அவர்கள் பிலேயாமிடம் வந்து சேர்வதால், தமிழில் ‘புறப்பட்டார்கள்’ என்பது இயக்கத்தின் தொடக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
