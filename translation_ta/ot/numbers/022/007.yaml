  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’ சமூகப் பதவியையும், ‘குறிசொல்வதற்கான கூலி’ சூழல்சார் முதன்மைப் பொருளையும் தெரிவிக்கின்றன; மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
