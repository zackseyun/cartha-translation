base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: ta
  text: பாலாக் மாடுகளையும் ஆடுமந்தையையும்[a] பலியிட்டு, அவற்றிலிருந்து பிலேயாமுக்கும் அவனோடு இருந்த அதிகாரிகளுக்கும் அனுப்பினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடுமந்தை” என்பது செம்மறியாடுகளோடு வெள்ளாடுகளையும் உள்ளடக்கிய சிறுகால்நடைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் “அனுப்பினான்” என்று மட்டுமே உள்ளது; பலியிடப்பட்ட விலங்குகளின் இறைச்சி அல்லது பலிப்பங்குகள் அனுப்பப்பட்டதாகச் சூழல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டு
  rationale: זבח என்பது பொதுவாக வெறுமனே கொல்வதை அல்ல, பலிக்காக விலங்குகளை அறுப்பதைக் குறிக்கிறது; எனவே அதன் வழிபாட்டுச் சூழலை இச்சொல் காக்கிறது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: בקר என்பது ஆண் விலங்குகளை மட்டும் அல்லாமல் மாட்டினத்தைத் தொகுப்பாகக் குறிக்கிறது; நவீன தமிழில் ‘மாடுகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: צֹאן
  choice: ஆடுமந்தை
  rationale: צאן என்பது செம்மறியாடுகள் மட்டுமல்லாமல் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடை மந்தையைக் குறிக்கலாம்; ‘ஆடுமந்தை’ அந்தக் கூட்டுப்பொருளை இயல்பாகப் பேணுகிறது.
- source_word: וַיְשַׁלַּח
  choice: அவற்றில் சிலவற்றை ... அனுப்பினான்
  rationale: எபிரெய வினை நேரடியாக ‘அனுப்பினான்’ என்றே கூறுகிறது; பலியிடப்பட்ட விலங்குகளைத் தொடர்ந்து வருவதால் அவற்றிலிருந்து சிலவற்றை அனுப்பியதாகச் சூழல் உணர்த்துகிறது. வாசகத் தெளிவுக்காக ‘அவற்றில் சிலவற்றை’ சேர்க்கப்பட்டுள்ளது; ‘பங்குகள்’ என மிகையாகக் குறிப்பாக்கப்படவில்லை.
- source_word: לְבִלְעָם
  choice: பிலேயாமுக்கு
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்பட்டுள்ளது.
- source_word: לַשָּׂרִים
  choice: அதிகாரிகளுக்கு
  rationale: שׂרים என்பது உயர்நிலைத் தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; மரபுரிமை அரசகுமாரர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘அதிகாரிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவனோடு இருந்த
  rationale: ஒருமை பின்னொட்டு அருகிலுள்ள ஒருமை முன்னிலையான பிலேயாமைக் குறிப்பிடுவது இயல்பானது; அதே நேரத்தில் மூலத்தின் பதிலிப்பெயர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
