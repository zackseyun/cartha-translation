source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: ta
  text: காலையில் பாலாக் பிலேயாமை அழைத்துக்கொண்டு, அவரைப் பாமோத்-பாகாலுக்கு[a] ஏற்றிச் சென்றான். அங்கிருந்து அவர் மக்களின் ஓரப்பகுதியை[b] பார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சொற்றொடரை இடப்பெயராக அல்லாமல் விளக்கமாக எடுத்தால், ‘பாகாலின் மேடுகளுக்கு.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அங்கிருந்து இஸ்ரவேல் மக்களின் வெளிப்புறப் பகுதி மட்டுமே தெரிந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயக் கதைநடையின் அடுத்த நிகழ்வுக்கான காலச்சூழலை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அப்போது நிகழ்ந்தது’ என்ற சூத்திரத்தைத் தேவையின்றி சொற்சொல்லாக விரிக்கவில்லை.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: இங்கு பாலாக் பிலேயாமைத் தன்னுடன் வேறோர் இடத்துக்கு அழைத்துச் செல்வதைக் குறிக்கிறது; வெறும் ‘எடுத்தான்’ என்பதைவிட தமிழில் இயல்பாக உள்ளது.
- source_word: וַיַּעֲלֵהוּ
  choice: அவரை ... ஏற்றிச் சென்றான்
  rationale: עלה என்பதன் ஹிபில் வடிவிலுள்ள ‘மேலே போகச் செய்தல்/மேலே கொண்டுசெல்லுதல்’ என்ற காரணவினைப் பொருளையும் உயரமான இடத்துக்குச் சென்றதையும் காக்கிறது.
- source_word: בָּמוֹת בָּעַל
  choice: பாமோத்-பாகால்
  rationale: இச்சூழலில் இது இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்படுகிறது; விளக்கப் பொருளான ‘பாகாலின் மேடுகள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּרְא
  choice: அவர் ... பார்த்தார்
  rationale: ראה என்பதன் பொதுவான ‘பார்’ என்ற பொருள் தரப்படுகிறது. சூழல்படி மறைமுக எழுவாய் பிலேயாம்; மரியாதை ஒருமை தமிழில் இயல்பாகப் பயன்படுத்தப்படுகிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: பார்த்த நிலைப்புள்ளியைக் குறிக்கும் இடவினையடை இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: קְצֵה הָעָם
  choice: மக்களின் ஓரப்பகுதி
  rationale: קצה என்பதன் ‘ஓரம்/கடைசிப் பகுதி’ என்ற பொருளைக் காக்கிறது; மூலத்தில் இல்லாத ‘முகாம்’ என்பதைச் சேர்க்காமல், மக்களில் வெளிப்புறமாக இருந்த பகுதி மட்டுமே புலப்பட்டது என்பதைத் தெளிவாக்குகிறது.
