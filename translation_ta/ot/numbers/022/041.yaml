translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆள் பெயர்கள் ‘பாலாக்’, ‘பிலேயாம்’ என்றும் இடப்பெயர் ‘பாமோத்-பாகால்’ என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன. இரு அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
