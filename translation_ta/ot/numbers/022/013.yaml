  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: ta
  text: காலையில் பிலேயாம் எழுந்து, பாலாக்கின் அதிகாரிகளிடம்[a], “உங்கள் நாட்டுக்குத் திரும்பிப் போங்கள்; ஏனெனில் யாவே என்னை உங்களோடு போக அனுமதிக்க மறுத்துவிட்டார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பாலாக்கின் பிரபுக்கள்” அல்லது “பாலாக்கின் தலைவர்கள்.”
    reason: שָׂרֵי என்பதன் பொருள் வரம்பில் அதிகாரிகள், பிரபுக்கள், தலைவர்கள் ஆகியவை அடங்குவதால் lexical alternative வழங்கப்படுகிறது.
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் கதையின் அடுத்த செயலை அறிமுகப்படுத்துகிறது; தொடர்ந்து வரும் காலக் குறிப்புடன் ‘எழுந்து’ இயல்பாக அமைகிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: இது வழக்கமான காலக் குறிப்பு; எபிரெயத்தில் இல்லாத ‘அதிகாலையில்’ என்ற அழுத்தத்தைச் சேர்க்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׂרֵי בָלָק
  choice: பாலாக்கின் அதிகாரிகள்
  rationale: שָׂרִים என்பது அதிகாரிகள், தலைவர்கள் அல்லது பிரபுக்கள் எனப் பொருள்படலாம். இங்கு அரசனின் தூதுக்குழுவினரைக் குறிப்பதால் ‘அதிகாரிகள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: உங்கள் நாட்டுக்குத் திரும்பிப் போங்கள்
  rationale: சொல்லாக்கத்தில் ‘உங்கள் நாட்டுக்குப் போங்கள்’ என்றாலும், ஏற்கெனவே அங்கிருந்து வந்தவர்களிடம் கூறப்படுவதால் தமிழில் ‘திரும்பிப் போங்கள்’ என்பது சூழலுக்கேற்ற இயல்பான சமமான மொழிபெயர்ப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள கட்டளைக்கான காரணத்தை வெளிப்படையாக அறிமுகப்படுத்துகிறது.
- source_word: מֵאֵן
  choice: மறுத்துவிட்டார்
  rationale: Piel perfect வடிவம் உறுதியான மறுப்பைக் குறிக்கிறது; தமிழில் நிறைவுற்ற தீர்மானத்தின் தற்போதைய விளைவை ‘மறுத்துவிட்டார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְתִתִּי
  choice: என்னை ... அனுமதிக்க
  rationale: נתן + infinitive இங்கு ‘அனுமதி அளித்தல்’ என்ற சொற்றொடர்ப் பொருளைக் கொண்டது; சொற்சொல் வடிவம் தமிழில் இயல்பாக இருக்காது.
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: உங்களோடு போக
  rationale: இங்கு הלך என்பது தூதுக்குழுவுடன் செல்வதைக் குறிக்கிறது; ‘உங்களோடு போக’ நேரடியும் இயல்புமான தமிழாக்கம்.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வழக்கமான கதைநடைப் பேச்சு வினை; மேற்கோளுக்குப் பின் ‘என்றான்’ நவீனத் தமிழில் இயல்பாக அமைகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் தனிப்பட்ட தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘திரும்பிப் போங்கள்’ என்பது சூழல் உணர்த்தும் திரும்பிச் செல்லுதலை இயல்பாக வெளிப்படுத்துகிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; [a] குறியீடு முதன்மை உரையிலும் இடம்பெற்றுள்ளது.
