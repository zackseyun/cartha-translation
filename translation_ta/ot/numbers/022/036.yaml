translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதையாடலின் நிகழ்வு வரிசை தெளிவாக வைக்கப்பட்டுள்ளது. ‘மோவாபின் நகரம்’ மற்றும் גבול என்பதன் ‘எல்லை/நாட்டுப்பகுதி’ பொருள் வேறுபாடுகள் தீர்மானித்துவிடப்படாமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
