base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: ta
  text: பிலேயாம் வந்துவிட்டான் என்று பாலாக் கேள்விப்பட்டபோது, அவனைச் சந்திப்பதற்காக மோவாபின் நகரத்துக்கு[a] அவன் புறப்பட்டுச் சென்றான். அந்த நகரம் அர்னோன் எல்லையில், எல்லையின் விளிம்பில்[b] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபைச் சேர்ந்த ஒரு நகரத்துக்கு.” எபிரெயச் சொற்றொடர் மோவாபிலிருந்த ஒரு குறிப்பிட்ட நகரத்தையோ, பொதுவாக மோவாபைச் சேர்ந்த ஒரு நகரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பகுதியின் முடிவில்.” இங்கு “எல்லை” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் சில சூழல்களில் “பகுதி” அல்லது “ஆட்சிப்பரப்பு” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்.’ இங்கு ஒரு செய்தியை அறிந்துகொண்டதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாக ‘கேள்விப்பட்டபோது’ அமைகிறது; செய்தி எவ்வாறு வந்தது என்பதை இது கூடுதலாகக் கூறுவதில்லை.
- source_word: כִּי בָא בִלְעָם
  choice: பிலேயாம் வந்துவிட்டான் என்று
  rationale: இந்த உட்பிரிவு பாலாக் கேட்ட செய்தியின் உள்ளடக்கத்தைக் கூறுகிறது. நிகழ்வுகளின் வரிசையில் பிலேயாமின் வருகை பாலாக் புறப்படுவதற்கு முந்தியது என்பதை ‘வந்துவிட்டான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא
  choice: அவன் புறப்பட்டுச் சென்றான்
  rationale: יצא என்பது வெளியேறுதல் அல்லது புறப்படுதலைக் குறிக்கிறது. பாலாக் தன் இடத்திலிருந்து பிலேயாமை நோக்கிச் சென்றதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திப்பதற்காக
  rationale: לקראת என்பது ஒருவரை எதிர்கொண்டு சந்திக்க அவரை நோக்கிச் செல்லுதலைக் குறிக்கிறது. ‘சந்திப்பதற்காக’ என்பது வரவேற்பு அல்லது பகைமை போன்ற கூடுதல் உணர்வைச் சேர்க்காத நடுநிலைத் தேர்வு.
- source_word: אֶל עִיר מוֹאָב
  choice: மோவாபின் நகரத்துக்கு
  rationale: இயக்கத்தைக் குறிக்கும் אֶל என்பதற்கு ‘-க்கு’ பொருத்தமானது. עִיר מוֹאָב ஒரு குறிப்பிட்ட, அறியப்பட்ட மோவாபிய நகரத்தைக் குறிக்கலாம்; அதேவேளை ‘மோவாபைச் சேர்ந்த ஒரு நகரம்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: அந்த நகரம் அர்னோன் எல்லையில்
  rationale: עַל גְּבוּל என்பது எல்லையின் மீது அல்லது எல்லையோரத்தில் அமைந்திருப்பதைக் குறிக்கிறது. அர்னோன் இங்கு எல்லையைக் குறித்த புவியியல் அடையாளமாக உள்ளது.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: எல்லையின் கடைக்கோடியில்
  rationale: קצה என்பது முடிவு, ஓரம், கடைக்கோடி ஆகிய பொருள்களைக் கொண்டது. எபிரெய உரையில் גבול மீண்டும் வருவதால், தமிழிலும் ‘எல்லை’ மீண்டும் வழங்கப்பட்டு மூலத்தின் திரும்பக்கூறல் பாதுகாக்கப்பட்டுள்ளது; ‘நாட்டுப்பகுதி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
