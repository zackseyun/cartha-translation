base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: ta
  text: அவன் அவர்களிடம், “இன்றிரவு இங்கே தங்குங்கள். யாவே[a] என்னிடம் பேசுவாரோ, அதன்படியே உங்களுக்கு மறுமொழி தெரிவிப்பேன்[b]” என்றான். எனவே மோவாபின் தலைவர்கள்[c] பிலேயாமுடன் தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'YHWH என்ற தெய்வீகப் பெயரின் மற்றொரு ஒலிபெயர்ப்பு: “யெகோவா”; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று தருகின்றன.'
    reason: alternative_reading
  - marker: b
    text: 'சொல்லுக்கு நெருக்கமாக: “உங்களுக்குச் செய்தியைத் திரும்பக் கொண்டுவருவேன்”; அல்லது, “உங்களுக்குப் பதில் அளிப்பேன்.”'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மோவாபின் அதிகாரிகள்” அல்லது “மோவாபின் பிரபுக்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: இன்றிரவு இங்கே தங்குங்கள்
  rationale: לִינוּ என்பது இரவு தங்குவதற்கான பன்மை கட்டளை; பֹה הַלַּיְלָה இடத்தையும் காலத்தையும் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு அமைகிறது.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: உங்களுக்கு மறுமொழி சொல்வேன்
  rationale: சொல்லைத் திரும்பக் கொண்டுவருதல் என்ற எபிரெய மொழிவழக்கின் பொருள், பதில் அல்லது செய்தியைத் தெரிவித்தல். தமிழில் ‘மறுமொழி சொல்வேன்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: யெகோவா என்னிடம் என்ன பேசுகிறாரோ, அதன்படியே
  rationale: כַּאֲשֶׁר காட்டும் ஒத்திசைவு அல்லது ஏற்பை ‘அதன்படியே’ பாதுகாக்கிறது; יְדַבֵּר என்பதன் பேச்சுச் செயலும் நிலைநிறுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: தங்கினார்கள்
  rationale: ישב என்பதன் அடிப்படைப் பொருள் ‘அமர்தல்/வசித்தல்’ என்றாலும், இரவு தங்கும்படி அழைக்கப்பட்ட இச்சூழலில் ‘தங்கினார்கள்’ என்பதே பொருத்தமானது.
- source_word: שָׂרֵי מוֹאָב
  choice: மோவாபின் தலைவர்கள்
  rationale: שָׂרִים என்பது இங்கு உயர்நிலைத் தூதர்களாக வந்த தலைவர்கள், அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கலாம். ‘தலைவர்கள்’ இயல்பான தமிழாக இருந்து பதவியை அளவுக்கு மீறிக் குறிப்பாக்காது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ‘யெகோவா’ அதை பட்டமாக மாற்றாமல் பெயராகவே தருகிறது; மாற்று ஒலிப்பெயர்ப்பான ‘யாவே’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பிலேயாம் யெகோவாவிடமிருந்து செய்தி பெறுவதாகக் கூறுதல்
  choice: அவனுடைய கூற்றை மூலத்தின்படியே நேரடியாக வைத்தல்
  alternative: அவனுடைய கூற்றை விளக்கவோ அதன் உண்மைத்தன்மையை மதிப்பிடவோ செய்தல்
  rationale: இவ்வசனம் பிலேயாமின் சொற்களை மட்டும் பதிவு செய்கிறது; அவனுடைய நிலை அல்லது நோக்கத்தை மொழிபெயர்ப்பில் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட உரை. உரையாடலில் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது; எபிரெய மொழிவழக்குகள் பொருள் இழக்காமல் இயல்பாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொல்லுக்குப் பின் பிரதான உரையில் இடப்பட்டுள்ளன.
