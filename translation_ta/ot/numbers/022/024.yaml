source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர்[a] திராட்சைத்தோட்டங்களுக்கு நடுவே உள்ள குறுகிய பாதையில் நின்றார்; பாதையின் இருபுறமும் சுவர்கள் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் செய்தியாளர்.’ எபிரெயச் சொல் ‘செய்தியாளர்’ அல்லது ‘தூதர்’ என்று பொருள்படலாம்; இக்கதைச் சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதர் குறிக்கப்படுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: அப்போது ... நின்றார்
  rationale: வழக்குரைத் தொடரை முன்னெடுக்கும் எபிரெய வினை வடிவத்தை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பதற்கு ‘தூதர்’ அல்லது ‘செய்தியாளர்’ என்று பொருள் வரலாம்; இக்கதைச் சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதர் குறிக்கப்படுகிறார். יְהוָה என்பது பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ எனப் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: திராட்சைத்தோட்டங்களுக்கு இடையிலிருந்த குறுகிய பாதையில்
  rationale: מִשְׁעוֹל என்பது இடநெருக்கமுள்ள பாதையைக் குறிக்கிறது; இருபுறச் சுவர்களால் கழுதை விலகிச் செல்ல முடியாத காட்சியையும் இவ்வாசகம் தெளிவாக்குகிறது.
- source_word: גָּדֵר
  choice: சுவர்
  rationale: திராட்சைத்தோட்டத்தைச் சுற்றிய அடைப்புச் சுவர் அல்லது வேலியை இச்சொல் குறிக்கலாம். அடுத்த வசனத்தின் நிகழ்வுக்கு ஏற்றவாறு ‘சுவர்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் குறிப்பிடப்படாத கல் போன்ற கட்டுமானப் பொருள் சேர்க்கப்படவில்லை.
- source_word: מִזֶּה וְגָדֵר מִזֶּה
  choice: ஒருபுறமும் மறுபுறமும் சுவர்
  rationale: பாதையின் இரண்டு பக்கங்களிலும் சுவர் இருந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பெயரெழுத்தாக்குகிறது.
- issue: מַלְאַךְ என்பவரின் இயல்பு
  choice: தூதர்
  alternative: செய்தியாளர்
  rationale: சொல்லின் அடிப்படைப் பொருள் இரண்டையும் அனுமதித்தாலும், பிலேயாம் கதையின் சூழல் இவர் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதர் என்பதைத் தெளிவுபடுத்துகிறது; அதே வேளையில் ‘தூதர்’ என்பது மூலச் சொல்லின் செய்தியாளர் நுணுக்கத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இருபுறமும் தனித்தனியாக ‘சுவர்’ என்று மூலத்தில் வருவதைத் தமிழ் இயல்புக்கேற்ப ஒருங்கிணைத்தாலும், இரண்டு பக்கங்களிலும் சுவர் இருந்த தகவல் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
