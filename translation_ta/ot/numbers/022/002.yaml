translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதும் கண்ணியமானதுமான உரை. எபிரெயச் சொல் வரிசை பெரும்பாலும் காக்கப்பட்டாலும், தமிழ் வாசிப்பின் தெளிவுக்காக இயல்பான வேற்றுமை உருபுகளும் பெயரெச்ச அமைப்பும் பயன்படுத்தப்பட்டுள்ளன.
