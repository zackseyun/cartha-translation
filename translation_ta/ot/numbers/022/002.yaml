  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: ta
  text: சிப்போரின் மகன் பாலாக், இஸ்ரவேல் எமோரியருக்குச் செய்த அனைத்தையும் கண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எமோரியனுக்கு’ என்று ஒருமை இனப்பெயர் கூட்டுப்பொருளில் வருகிறது; அதாவது, ‘எமோரியருக்கு’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; ראה என்பதன் இயல்பான பொருள் ‘கண்டான்’. மூலத்தில் வெளிப்படையான ‘இப்போது’ இல்லாததால் தனியான காலக் குறிப்பு சேர்க்கப்படவில்லை.
- source_word: בָּלָק
  choice: பாலாக்
  rationale: தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן צִפּוֹר
  choice: சிப்போரின் மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பு தமிழில் இயல்பாகவும் சுருக்கமாகவும் தரப்பட்டுள்ளது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: செய்த அனைத்தையும்
  rationale: தொடர்ந்து வரும் செயலை முழுமையாக நேர்செயப்படுபொருளாக்கும் சொற்றொடர்; தமிழில் ‘அனைத்தையும்’ இயல்பான இணைவு.
- source_word: עָשָׂה
  choice: செய்த
  rationale: முன்னரே நிகழ்ந்த செயலைத் தமிழின் பெயரெச்ச வடிவம் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது; தேவையற்ற காலவிளக்கம் சேர்க்கப்படவில்லை.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மக்கள் இனத்தைக் குறிக்கும் பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לָאֱמֹרִי
  choice: எமோரியருக்கு
  rationale: לְ முன்னொட்டின் விரிவான உறவை ‘-க்கு’ காக்கிறது. ஒருமை இனப்பெயர் கூட்டுப்பொருளில் வருவதால் தமிழில் இயல்பான பன்மைக் குடிப்பெயராகத் தரப்பட்டுள்ளது.
