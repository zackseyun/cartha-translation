source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: ta
  text: அப்போது கடவுள் பிலேயாமிடம், “நீ அவர்களுடன் போகக் கூடாது. மக்களைச் சபிக்கக் கூடாது; ஏனெனில் அவர்கள் ஆசீர்வதிக்கப்பட்டவர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “மக்கள்” என்பது கூட்டுப்பொருளுடைய ஒருமைப் பெயராக உள்ளது; எனவே “ஆசீர்வதிக்கப்பட்டது” என்று ஒருமையில் கூறப்பட்டுள்ளது.
    reason: மூல எபிரெயத்தின் கூட்டுப்பொருள் கொண்ட ஒருமை இலக்கணத்தைப் பதிவு செய்து, தமிழில் பயன்படுத்தப்பட்ட இயல்பான பன்மை இயைபை விளக்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்நிலை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ என்பது நவீன தமிழில் இயல்பான கதைத் தொடரைத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் பிலேயாமிடம் பேசுகிற மெய்யான கடவுளைக் குறிக்கிறது; ‘கடவுள்’ நவீனத் தமிழில் பொதுவான, சமயப் பிரிவுசார்பற்ற மொழிபெயர்ப்பு.
- source_word: לֹא תֵלֵךְ
  choice: நீ ... போகக் கூடாது
  rationale: לֹא உடன் வரும் முற்றுப்பெறாத வினை இங்கு தடையை வெளிப்படுத்துகிறது; ‘போகக் கூடாது’ அதன் கட்டாயத் தடை வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: עִמָּהֶם
  choice: அவர்களுடன்
  rationale: பாலாக்கின் தூதர்களைக் குறிக்கும் முன்னிடைச்சொல் மற்றும் பன்மைச் சுட்டுப்பெயர் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: לֹא תָאֹר
  choice: சபிக்கக் கூடாது
  rationale: אָרַר என்பதன் பொருள் ‘சபி’; இங்கும் வடிவம் தடையை வெளிப்படுத்துவதால் முதல் தடையுடன் இணையான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת הָעָם
  choice: அந்த மக்களை
  rationale: הָעָם இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கிறது. தமிழில் குறிப்பிட்ட அந்த மக்களைக் தெளிவாகச் சுட்ட ‘அந்த மக்களை’ இயல்பாக உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ தெளிவான காரண இணைப்புச் சொல்.
- source_word: בָרוּךְ הוּא
  choice: அவர்கள் ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: எபிரெயத்தில் கூட்டுப்பொருளான ‘மக்கள்’ ஒருமை இலக்கணத்தில் குறிப்பிடப்பட்டாலும், தமிழில் ‘மக்கள்’ என்பதோடு பன்மை இயைபே இயல்பானது. மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘ஆசீர்வதிக்கப்பட்ட’ கூறில் சுட்டப்படும் பொருளும் எண்ணும்
  choice: இஸ்ரவேல் மக்களை ஒரு கூட்டமாகக் குறிக்கும் பொருளை இயல்பான தமிழில் ‘அவர்கள் ஆசீர்வதிக்கப்பட்டவர்கள்’ என்று வழங்குதல்
  alternative: ‘அது ஆசீர்வதிக்கப்பட்டது’ என்று எபிரெய ஒருமை இலக்கணத்தை நேரடியாகப் பின்பற்றுதல்
  rationale: בָרוּךְ הוּא ஆண்பால் ஒருமையில் இருந்தாலும் அதன் முன்னிலைச் சொல் הָעָם என்பது கூட்டுப்பொருள் கொண்ட ஒருமைப் பெயர்ச்சொல். தமிழில் ‘மக்கள் ... அவர்கள்’ என்பது இயல்பான இயைபு; ஒருமை இலக்கணத்தின் உண்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது. இது இலக்கணத் தீர்மானமே அன்றி கோட்பாட்டு விரிவாக்கம் அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி உரைநடை. இரு தடை வாக்கியங்களிலும் ‘கூடாது’ பயன்படுத்தப்பட்டதால் தெய்வீகக் கட்டளையின் வலிமையும் இணை அமைப்பும் காக்கப்பட்டுள்ளன.
