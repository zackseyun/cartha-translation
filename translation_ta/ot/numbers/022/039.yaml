  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: ta
  text: பிலேயாம் பாலாக்குடன் சென்றார்; அவர்கள் கிரியாத்-ஹூசோத்துக்கு[a] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிரியாத்-ஹூசோத்” என்பதற்கு “தெருக்களின் நகரம்” அல்லது “திறந்த வெளிகளின் நகரம்” என்று பொருள் இருக்கலாம்.
