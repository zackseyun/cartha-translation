translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைப்புச் சொல் וַ־ இங்கு கதைத்தொடர்ச்சியை வெளிப்படுத்த ‘எனவே’ என வழங்கப்பட்டுள்ளது. இடப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டு, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
