lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך என்பதன் Qal wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை எளிய இயக்க வினையாகக் குறிக்கிறது; நவீனத் தமிழில் ‘சென்றார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் எழுத்துப்பெயர்த்தது.
- source_word: עִם
  choice: உடன்
  rationale: உடன்செல்லுதலை நேரடியாகக் குறிக்கும் முன்னிடைச்சொல்லுக்கு ‘உடன்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בָּלָק
  choice: பாலாக்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபு சேரும்போது ‘பாலாக்குடன்’ என இரட்டிப்பு இயல்பாகிறது.
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் ... வந்தார்கள்
  rationale: בוא என்பதன் பன்மை wayyiqtol வடிவம் அடுத்த கதையாடல் நிகழ்வைக் குறிக்கிறது. ‘வந்தார்கள்’ என்பது நுழைந்தார்கள் அல்லது வந்து சேர்ந்தார்கள் என்று தேவையின்றி மிகைப்படுத்தாமல் அடிப்படை இயக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: קִרְיַת חֻצוֹת
  choice: கிரியாத்-கூசோத்
  rationale: இது இடப்பெயராகச் செயல்படுவதால் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டது; அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
