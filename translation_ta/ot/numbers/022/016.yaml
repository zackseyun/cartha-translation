translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ள நேரடிப் பேச்சு நடை. மூலத்தின் தூதுச் செய்தி சூத்திரம் முறையான தொனியுடன் வைக்கப்பட்டுள்ளது.
