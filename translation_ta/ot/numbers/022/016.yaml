revisions:
- from: 'அவர்கள் பிலேயாமிடம் வந்து அவரிடம், “சிப்போரின் மகன் பாலாக் கூறுவது இதுவே: என்னிடம் வரத் தயங்க வேண்டாம்,” என்றார்கள்.'
  to: 'அவர்கள் பிலேயாமிடம் வந்து அவரிடம், “சிப்போரின் மகன் பாலாக் கூறுவது இதுவே: என்னிடம் வருவதைத் தவிர்க்க வேண்டாம்,” என்றார்கள்.'
  rationale: The revision replaces “தயங்க வேண்டாம்” with “வருவதைத் தவிர்க்க வேண்டாம்” to represent מנע with the following infinitive more directly as refraining from or avoiding coming. No footnote is needed, since the Tamil rendering communicates the source sense naturally without introducing a substantive unresolved ambiguity.
