  text: וַ/יָּבֹ֖אוּ אֶל בִּלְעָ֑ם וַ/יֹּ֣אמְרוּ ל֗/וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן צִפּ֔וֹר אַל נָ֥א תִמָּנַ֖ע מֵ/הֲלֹ֥ךְ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: ta
  text: 'அவர்கள் பிலேயாமிடம் வந்து அவரிடம், “சிப்போரின் மகன் பாலாக் கூறுவது இதுவே: என்னிடம் வருவதைத் தவிர்க்க வேண்டாம்,” என்றார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: அவர்கள் பிலேயாமிடம் வந்து
  rationale: בוא என்பது ‘வருதல்/நுழைதல்’ என்ற அடிப்படை இயக்க வினை; தூதர்கள் பிலேயாமை அணுகும் சூழலில் ‘வந்து’ என்பது இயல்பான தமிழ் நடை.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: அவரிடம் ... என்றார்கள்
  rationale: אמר உடன் மறைமுகப் பொருள் இணைந்துள்ள நேரடி பேச்சு அறிமுகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதுச் செய்திக்குரிய நிலையான சூத்திரத்தின் முறையான தொனியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: சிப்போரின் மகன் பாலாக்
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, construct உறவு இயல்பான உடைமைத் தொடரால் தெரிவிக்கப்படுகிறது.
- source_word: אַל־נָא תִמָּנַע
  choice: தயங்க வேண்டாம்
  rationale: אַל என்பது தடையுத்தரவு; נָא வேண்டுகோள் தொனியைத் தருகிறது. מנע இங்கு வராமல் தன்னைத் தடுத்துக்கொள்ளுதல் அல்லது பின்வாங்குதல் என்ற கருத்தைத் தருவதால், ‘தயங்க வேண்டாம்’ என்பது மரியாதையான அழைப்புச் சூழலில் இயல்பாக உள்ளது.
- source_word: מֵהֲלֹךְ אֵלָי
  choice: என்னிடம் வர
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போதல்/நடத்தல்’; ஆனால் பாலாகின் முதல் நபர் நோக்குநிலையைக் காட்டும் אֵלָי காரணமாக தமிழில் ‘என்னிடம் வர’ என்பது இயல்பான இடநோக்கு வெளிப்பாடு.
