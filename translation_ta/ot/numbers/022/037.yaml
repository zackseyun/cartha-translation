translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனுக்கும் அந்நிய தீர்க்கதரிசிக்கும் இடையிலான உரையாடலுக்கு ஏற்றவாறு ‘உம்மை/நீர்’ என்ற மரியாதை ஒருமை தேர்ந்தெடுக்கப்பட்டது. எபிரெய வினை வலியுறுத்தலின் துல்லியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘கௌரவிக்க’ என்பதன் பொருள் வெறும் பணப்பரிசாகக் குறுக்கப்படவில்லை.
