base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: ta
  text: பாலாக் பிலேயாமிடம், “உம்மை அழைக்க நான் நிச்சயமாகத் தூதர்களை உம்மிடம் அனுப்பவில்லையா?[a] நீர் ஏன் என்னிடம் வரவில்லை?[b] உம்மைக் கௌரவிக்க என்னால் உண்மையிலேயே முடியாதா?”[c] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அனுப்புதல்’ என்ற வினை வலியுறுத்தப்பட்ட வடிவில் உள்ளது; ‘நான் உண்மையாகவே/நிச்சயமாக அனுப்பவில்லையா?’ என்றும் மொழிபெயர்க்கலாம். சிலர் சூழலின் அடிப்படையில் இதைப் பலமுறையோ அவசரமாகவோ அனுப்பியதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘நீர் ஏன் என்னிடம் செல்லவில்லை?’'
    reason: lexical_alternative
  - marker: c
    text: ‘கௌரவிக்க’ என்பது மரியாதை காட்டுவதை மட்டுமல்லாமல், பரிசு அல்லது உயர்ந்த நிலை அளிப்பதையும் இங்குக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான wayyiqtol வடிவத்தை இயல்பான தமிழில் நேரடி உரையின் முடிவில் வரும் ‘என்றான்’ என வழங்குகிறது.
- source_word: הֲלֹא שָׁלֹחַ שָׁלַחְתִּי אֵלֶיךָ
  choice: நான் ஆட்களை அனுப்பவில்லையா?
  rationale: הֲלֹא என்பது உறுதியான பதிலை எதிர்பார்க்கும் எதிர்மறை வினா. שָׁלֹחַ שָׁלַחְתִּי என்ற infinitive absolute அமைப்பு அனுப்புதலை வலியுறுத்துகிறது; தமிழில் வினாவின் அழுத்தமும் சூழலும் அதைத் தெரிவிக்கின்றன. אֵלֶיךָ இங்குச் செய்தியாளர்களை பிலேயாமிடம் அனுப்பியதைக் குறிக்கிறது; ஆகவே இயல்பான தமிழுக்காக ‘ஆட்களை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לִקְרֹא לָךְ
  choice: உம்மை அழைத்து வரும்படி
  rationale: קרא இச்சூழலில் வருமாறு அழைப்பது அல்லது வரவழைப்பது. வெறும் தொலைபேசி சார்ந்த நவீன ‘அழைத்தல்’ எனப் புரியாமல், அழைப்பின் நோக்கத்தை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: நீர் ஏன் என்னிடம் வரவில்லை?
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்’ என்றாலும், பேசுகிற பாலாக்கின் நோக்கிலுள்ள אֵלָי என்பதால் தமிழில் ‘என்னிடம் வரவில்லை’ என்பதே இயல்பானது.
- source_word: הַאֻמְנָם
  choice: உண்மையிலேயே
  rationale: பாலாக்கின் வியப்பும் மனக்குறையும் கலந்த வலியுறுத்தப்பட்ட வினாவை வெளிப்படுத்துகிறது.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: உம்மைக் கௌரவிக்க என்னால் ... முடியாதா?
  rationale: יכל திறனைச் சுட்டுகிறது; כבד என்பதன் piel வடிவம் கௌரவம் அளிப்பதைக் குறிக்கிறது. சூழலில் பரிசும் உயர்ந்த நிலையும்கூட அடங்கலாம்; ஆனால் ‘கௌரவிக்க’ என்ற விரிவான சொல் அந்தப் பல்பொருள் வாய்ப்பைத் தக்கவைக்கிறது.
