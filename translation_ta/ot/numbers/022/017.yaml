  text: כִּֽי כַבֵּ֤ד אֲכַבֶּדְ/ךָ֙ מְאֹ֔ד וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלַ֖/י אֶֽעֱשֶׂ֑ה וּ/לְכָ/ה נָּא֙ קָֽבָ/ה לִּ֔/י אֵ֖ת הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: ta
  text: ஏனெனில், நான் உங்களை மிகவும் கௌரவிப்பேன்[a]; நீங்கள் என்னிடம் சொல்வதையெல்லாம் செய்வேன். ஆகையால், தயவுசெய்து வந்து, எனக்காக இந்த மக்களைச் சபியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களை நிச்சயமாக மிகவும் கௌரவிப்பேன்,” அல்லது “நான் உங்களுக்கு மிகுதியாக வெகுமதி அளிப்பேன்.” எபிரெய மொழியில் வலியுறுத்துவதற்காக ஒரே வேரின் வினையெச்ச வடிவமும் முற்றுவினையும் சேர்த்துப் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பாலாக் மீண்டும் விடுக்கும் வேண்டுகோளுக்கான காரணமாக அவனுடைய வாக்குறுதியை இது அறிமுகப்படுத்துகிறது.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: நான் உங்களை மிகவும் கௌரவிப்பேன்
  rationale: ஒரே வேரின் வினையெச்ச வடிவமும் முற்றுவினையும் இணைந்து வாக்குறுதியை வலியுறுத்துகின்றன; מְאֹד அந்த வலியுறுத்தலை மேலும் தீவிரப்படுத்துகிறது. כבד என்பதன் நேரடியான ‘கௌரவித்தல்’ என்ற கருத்தைத் தமிழ் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: நீங்கள் என்னிடம் சொல்வதையெல்லாம் செய்வேன்
  rationale: כֹל אֲשֶׁר என்பதன் விரிவான ‘எதுவெல்லாமோ/அனைத்தும்’ என்ற பொருளை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: וּלְכָה נָּא
  choice: ஆகையால், தயவுசெய்து வந்து
  rationale: לְכָה இயக்கத்தைச் சுட்டும் கட்டளை; נָא வேண்டுகோளின் பணிவையும் அவசரத்தையும் காட்டுகிறது. முந்தைய வாக்குறுதியோடு வேண்டுகோளை இயல்பாக இணைக்க ‘ஆகையால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: קָבָה
  choice: சபியுங்கள்
  rationale: இந்தச் சூழலில் ஒருவர்மேல் சாபம் உரைக்க அல்லது வரவழைக்கக் கோருவதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: לִּי
  choice: எனக்காக
  rationale: பாலாக் தனது நலனுக்காகவே இந்தச் செயலைக் கோருகிறான் என்பதை நேரடியாகக் காட்டுகிறது.
- source_word: אֵת הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עָם ஒரு கூட்டு மக்களைக் குறிக்கிறது; தமிழில் ‘இந்த மக்களை’ என்பது இயல்பான கூட்டு வெளிப்பாடு.
