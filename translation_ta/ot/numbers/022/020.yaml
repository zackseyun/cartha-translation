base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: ta
  text: இரவில் கடவுள் பிலேயாமிடம் வந்து, அவனிடம், “அந்த மனிதர்கள் உன்னை அழைக்க வந்திருந்தால்[a], எழுந்து அவர்களோடு போ. ஆனால் நான் உன்னிடம் சொல்லும் வார்த்தையின்படி மட்டுமே நீ செய்ய வேண்டும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மனிதர்கள் உன்னைக் கூப்பிட வந்திருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் உன்னிடம் சொல்லும் காரியத்தின்படி மட்டுமே நீ செய்ய வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் இயல்பான கதைநடைப் பொருளான ‘வந்தார்’ என்பதைக் காட்டுகிறது; ‘தோன்றினார்’ என மொழிபெயர்ப்பது மூலத்தில் இல்லாத தரிசனக் கருத்தைச் சேர்க்கும்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்த வசனத்தில் தெய்வப் பெயரான יהוה அல்ல, אֱלֹהִים என்பதே உள்ளது; ஆகவே அருகிலுள்ள வசனங்களோடு ஒத்திசைக்காமல் வேறுபாடு காக்கப்படுகிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: இரவுநேரச் சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: அந்த மனிதர்கள் உன்னை அழைக்க வந்திருந்தால்
  rationale: לקרוא לך என்பதன் ‘உன்னை அழைக்க’ என்ற பொருளையும், ஏற்கெனவே அவர்கள் வந்திருப்பதை நோக்கும் நிபந்தனைத் தன்மையையும் காக்கிறது.
- source_word: קוּם לֵךְ
  choice: எழுந்து ... போ
  rationale: தொடர்ச்சியான இரண்டு எபிரெயக் கட்டளைகளையும் தமிழில் இயல்பான கட்டளைத் தொடராக வழங்குகிறது.
- source_word: אִתָּם
  choice: அவர்களோடு
  rationale: முன்னர் குறிப்பிடப்பட்ட மனிதர்களோடு செல்லுமாறு கூறப்படுவதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: וְאַךְ
  choice: ஆனால் ... மட்டுமே
  rationale: செல்ல அனுமதி இருந்தாலும் கடுமையான வரம்பு விதிக்கப்படுவதை எதிர்மறை-வரையறை அமைப்பில் தெளிவாக்குகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தையை
  rationale: דבר என்பதற்கு ‘காரியம்’ என்றும் பொருள் இருக்கலாம்; ஆனால் அடுத்து வரும் ‘சொல்லும்’ என்ற வினையுடன் உள்ள தொடர்பால் ‘வார்த்தை’ பொருத்தமானது.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: நான் உன்னிடம் சொல்லும்
  rationale: எபிரெய நிறைவுறா வினையின் உடனடி/எதிர்கால நோக்கை இயல்பான தமிழில் காட்டுகிறது; ‘சொல்லப்போகும்’ என்பதும் சாத்தியம்.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: நீ செய்ய வேண்டும்
  rationale: முன்வைக்கப்பட்ட பொருளின் வலியுறுத்தலையும் அதிகாரமுள்ள கட்டளையையும் நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இந்த வசனத்தில் பயன்படுத்தப்படும் தெய்வச் சுட்டுப்பெயர்
  choice: אֱלֹהִים என்பதை ‘கடவுள்’ என மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவர்’
  rationale: மூல எபிரெயத்தில் இவ்வசனம் יהוה என்ற தெய்வப் பெயரை அல்ல, אֱלֹהִים என்பதைப் பயன்படுத்துகிறது. ஆகவே அருகிலுள்ள சூழலின் அடிப்படையில் ‘ஆண்டவர்’ என ஒத்திசைக்காமல் மூலத்தின் வேறுபாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிலேயாம்’ என்ற வழக்கமான பெயர்வடிவமும், ஒருமை ஆண் சுட்டுக்கு ‘அவன்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன; கடவுளின் உரை அதிகாரமுள்ளதாயினும் பழமையான நடையைத் தவிர்க்கிறது.
