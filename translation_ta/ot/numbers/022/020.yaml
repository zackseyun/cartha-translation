review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the narrative setting, the designation אֱלֹהִים as “கடவுள்,” the conditional summons, the paired commands, and the restrictive force of וְאַךְ. The final Tamil phrase, however, renders the Hebrew object emphatically but uses the less idiomatic collocation “வார்த்தையை ... செய்ய வேண்டும்.”
  naturalness: The narrative is clear and uses an appropriate modern standard Tamil register. Recasting the final clause as acting “according to” the word makes the required sense natural Tamil without weakening the restriction.
  terminology: “கடவுள்” appropriately reflects אֱלֹהִים rather than harmonizing it with the divine name used elsewhere. “பிலேயாம்” is a standard Tamil biblical name form. “வார்த்தை” suitably retains the speech-related sense of דָּבָר; the alternative “காரியம்” remains appropriately noted.
  issues:
  - severity: medium
    issue: The phrase “நான் உன்னிடம் சொல்லும் வார்த்தையை மட்டுமே நீ செய்ய வேண்டும்” is not idiomatic Tamil.
    rationale: Tamil normally does not say that one ‘does a word.’ The Hebrew idiom means to act in accordance with the word spoken. “வார்த்தையின்படி ... செய்ய வேண்டும்” communicates this naturally while retaining the word/command connection and the exclusive limitation.
