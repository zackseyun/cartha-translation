source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: ta
  text: அந்தப் பெண் கழுதை யாஹ்வேயின் தூதரைப்[a] பார்த்தபோது, பிலேயாமுக்குக் கீழே படுத்துக்கொண்டது. அப்போது பிலேயாமுக்குக் கோபம் மூண்டது; அவன் தன் கோலால் அந்தக் கழுதையை அடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்’ என்பதற்கான எபிரெயச் சொல் ‘செய்தியாளர்’ என்றும் பொருள்படும்; இங்குள்ள சூழல் இயற்கைக்கு அப்பாற்பட்ட தூதரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: அந்தப் பெண் கழுதை
  rationale: אָתוֹן என்பது குறிப்பாகப் பெண் கழுதையைக் குறிக்கிறது. தமிழில் இதை வெளிப்படையாகக் கூறுவது இயல்பாகவும் மூலத்தின் பாலினக் குறிப்பைத் துல்லியமாகவும் பாதுகாக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாஹ்வேயின் தூதர்
  rationale: מַלְאָךְ என்பதற்கு ‘தூதர்’ அல்லது ‘செய்தியாளர்’ என்று பொருள் வரலாம். இச்சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதர் குறிக்கப்படுகிறார்; ‘தூதர்’ என்ற தமிழ் சொல் மூலத்தின் அடிப்படைப் பொருளையும் மரியாதையான நடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாஹ்வே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் வழக்கமான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וַתִּרְבַּץ
  choice: படுத்துக்கொண்டது
  rationale: רבץ என்பது படுத்தல் அல்லது மடங்கிப் படுத்தல் எனப் பொருள்படும். சவாரி செய்த பிலேயாமுக்குக் கீழே கழுதை படுத்ததை இச்சொல் இயல்பாக எடுத்துரைக்கிறது.
- source_word: תַּחַת בִּלְעָם
  choice: பிலேயாமுக்குக் கீழே
  rationale: תַּחַת என்பதன் நேரடிப் பொருளான ‘கீழே’ என்பதையும், பிலேயாம் கழுதையின் மேல் அமர்ந்திருந்த சூழலையும் பாதுகாக்கிறது.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: பிலேயாமுக்குக் கோபம் மூண்டது
  rationale: ‘கோபம் எரிந்தது’ என்ற எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான நவீனத் தமிழில் ‘கோபம் மூண்டது’ எனத் தருகிறது.
- source_word: וַיַּךְ
  choice: அடித்தான்
  rationale: נכה இங்கு ஓர் அடியைக் குறிக்கிறது. ‘அடித்தான்’ என்பது செயலை மிகைப்படுத்தாமலும் மெலிதாக்காமலும் நேரடியாகத் தருகிறது.
- source_word: בַּמַּקֵּל
  choice: தன் கோலால்
  rationale: מַקֵּל என்பது கோல் அல்லது குச்சி. பயணச் சூழலில் ‘கோல்’ பொருத்தமானது; அது பிலேயாமுடையது என்பது சூழலிலிருந்து தெளிவாக இருப்பதால் தமிழ் இயல்புக்கேற்ப ‘தன்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாஹ்வே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பான ‘யாஹ்வே’ என்று தரப்பட்டுள்ளது.
- issue: מַלְאַךְ என்பதன் தூதர்/செய்தியாளர் பொருள்
  choice: தூதர்
  alternative: செய்தியாளர்; வானதூதர்
  rationale: இச்சூழல் இயற்கைக்கு அப்பாற்பட்ட ஒரு தூதரைக் காட்டினாலும், ‘வானதூதர்’ என்று வெளிப்படையாகச் சேர்த்து மூலத்தைவிட அதிகமாகத் தீர்மானிக்காமல் ‘தூதர்’ எனத் தரப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, தெளிவான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் எபிரெய நிகழ்வுவரிசை காக்கப்பட்டுள்ளதுடன், ‘கோபம் மூண்டது’ போன்ற இயல்பான தமிழ் மரபுத்தொடர் தேர்ந்தெடுக்கப்பட்டுள்ளது.
