source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: ta
  text: அப்போது யாவேயின் வானதூதர் பிலேயாமிடம்[a], “அந்த ஆண்களுடன் செல். ஆனால் நான் உனக்குச் சொல்லும் வார்த்தையை[b] மட்டுமே நீ சொல்ல வேண்டும்” என்றார். ஆகவே பிலேயாம் பாலாக்கின் அதிகாரிகளுடன்[c] சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் தூதர்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “வார்த்தை”; “செய்தி” அல்லது “காரியம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பாலாக்கின் தலைவர்கள்” அல்லது “பாலாக்கின் பிரபுக்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் வானதூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்/செய்தியாளர்’ என்றும் ‘வானதூதர்’ என்றும் பொருள்படலாம். இந்நிகழ்வில் பிலேயாமை எதிர்கொள்ளும் இயற்கைக்கு அப்பாற்பட்ட நபரைச் சூழல் குறிப்பதால் ‘வானதூதர்’ என மொழிபெயர்க்கப்பட்டுள்ளது; பொதுவான ‘தூதர்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: இந்த ஆண்களோடு போ
  rationale: கட்டளை வினையையும் עִם என்பதன் ‘உடன்’ என்ற பொருளையும் நேரடியாகக் காட்டுகிறது. குறிப்பிட்ட ஆண் தோழர்களையே הָאֲנָשִׁים சுட்டுவதால் ‘ஆண்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֶפֶס
  choice: ஆனால் ... மட்டுமே
  rationale: முன் வழங்கப்பட்ட அனுமதிக்கு வலுவான வரம்பை விதிக்கும் எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ மற்றும் ‘மட்டுமே’ இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகின்றன.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: דָּבָר என்பதற்கு ‘செய்தி’, ‘காரியம்’ போன்ற பொருள்களும் உண்டு; இங்கு பேசுதல் என்ற வினை மீண்டும் வருவதால் ‘வார்த்தை’ பொருத்தமானது.
- source_word: אֲדַבֵּר אֵלֶיךָ אֹתוֹ תְדַבֵּר
  choice: நான் உனக்குச் சொல்லும் வார்த்தையை மட்டுமே நீ சொல்ல வேண்டும்
  rationale: முன்னிறுத்தப்பட்ட אֹתוֹ தரும் அழுத்தத்தையும், பிலேயாம் தனக்குக் கொடுக்கப்படும் வார்த்தையையே சொல்ல வேண்டும் என்ற வரம்பையும் இயல்பான தமிழில் காக்கிறது. דבר வேரின் மீளுருவாக்கம் ‘சொல்லும்/சொல்ல’ எனப் பிரதிபலிக்கப்படுகிறது.
- source_word: שָׂרֵי בָלָק
  choice: பாலாக்கின் அதிகாரிகள்
  rationale: שָׂרִים என்பது ஆட்சியாளர்கள், தலைவர்கள், அதிகாரிகள் அல்லது இளவரசர்கள் எனப் பொருள்படலாம். இங்கு தூதுக்குழுவின் அலுவல் நிலைக்கு ‘அதிகாரிகள்’ இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட இறைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், நவீன ஆய்வியல் உச்சரிப்புக்கு அருகான ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ என்பவர் வானதூதரா அல்லது பொதுவான தூதரா
  choice: வானதூதர்
  alternative: தூதர்; செய்தியாளர்
  rationale: சொல் தனியாக இரு பொருள்களையும் அனுமதித்தாலும், எண்ணாகமம் 22-இன் நிகழ்வுச் சூழல் இயற்கைக்கு அப்பாற்பட்ட தெய்வீகத் தூதரைச் சுட்டுகிறது. இருப்பினும் சொல்லின் அடிப்படைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நேரடி உரையில் உள்ள அனுமதியும் கடுமையான வரம்பும் தெளிவாக வைக்கப்பட்டுள்ளன. பண்டைய அரசவைக் குழுவைக் குறிக்கும் שָׂרִים என்பதற்கு நவீனச் சூழலில் தவறாக அரசகுமாரர்கள் எனப் புரிந்துகொள்ளப்படாதவாறு ‘அதிகாரிகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
