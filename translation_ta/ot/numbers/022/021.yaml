  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: ta
  text: காலையில் பிலேயாம் எழுந்து, தன் பெண் கழுதைக்குச் சேணம் கட்டி, மோவாபின் தலைவர்களுடன் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் தொடர் நிகழ்வைக் குறிக்கும் Qal wayyiqtol வடிவம்; எளிய கதைநடையில் இயல்பாக அடுத்த செயலை இணைக்கிறது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயச் சொற்றொடர் பொதுவாக ‘காலையில்’ எனப் பொருள்படும்; ‘அதிகாலையில்’ என்ற தீவிரத்தை உரை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַיַּחֲבֹשׁ
  choice: சேணம் கட்டி
  rationale: கழுதையைச் சவாரிக்குத் தயார்செய்வதைக் குறிக்கும் חבש என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶת אֲתֹנוֹ
  choice: தன் பெண் கழுதைக்கு
  rationale: אָתוֹן என்பது குறிப்பாகப் பெண் கழுதையைக் குறிக்கிறது. தமிழில் ‘பெண் கழுதை’ இயல்பாகவும் துல்லியமாகவும் இருப்பதால் மூலத்தின் பாலினக் குறிப்பை முதன்மை உரையிலேயே பாதுகாக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: הלך என்பதன் எளிய கதைநடைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: עִם
  choice: உடன்
  rationale: உடன்செல்வதைக் குறிக்கும் நேரடியான தமிழ் இணைச்சொல்.
- source_word: שָׂרֵי מוֹאָב
  choice: மோவாபின் தலைவர்கள்
  rationale: שָׂרִים என்பது ஆட்சியதிகாரம் அல்லது உயர்நிலை வகித்தவர்களைக் குறிக்கலாம். நவீன தமிழில் ‘தலைவர்கள்’ இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது; மரபுவழி அரசகுமாரர்கள் என்ற குறிப்பிட்ட பொருளைத் தேவையின்றிச் சேர்ப்பதில்லை.
