translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கதைநடை. எபிரெய தொடர் வினை அமைப்பை இயல்பான தமிழ் வினையெச்சங்களால் இணைத்துள்ளது. பெண் கழுதை என்ற மூலத்தின் குறிப்பான தகவல் அடிக்குறிப்பின்றி முதன்மை உரையில் தெளிவாக வழங்கப்பட்டுள்ளது.
