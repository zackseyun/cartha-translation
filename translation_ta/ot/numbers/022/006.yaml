  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: ta
  text: ஆகவே, இப்போது தயவுசெய்து வந்து, எனக்காக இந்த மக்களுக்குச் சாபமிடுங்கள்[a]. அவர்கள் என்னைவிட வலிமைமிக்கவர்கள். ஒருவேளை நாம் அவர்களைத் தாக்கி, நான் அவர்களை நாட்டிலிருந்து துரத்திவிட முடியும்[b]. ஏனெனில், நீர் யாரை ஆசீர்வதிக்கிறீரோ அவர் ஆசீர்வதிக்கப்பட்டவர் என்றும், யாரைச் சாபமிடுகிறீரோ அவர் சபிக்கப்பட்டவர் என்றும் நான் அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மக்கள்” என்பது எபிரெயத்தில் ஒருமைக் கூட்டுப்பெயராக உள்ளது; தமிழில் அதன் பொருள் இயல்பாகப் பன்மையில் தொடர்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “நாம் அவர்களைத் தாக்கி” என்பது முதல் நபர் பன்மையிலும், “நான் அவர்களைத் துரத்திவிட” என்பது முதல் நபர் ஒருமையிலும் உள்ளது. மக்களைக் குறிக்கும் சுட்டுப்பெயர்கள் எபிரெயத்தில் ஒருமையில் உள்ளன.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: எனவே இப்போது
  rationale: முந்தைய செய்தியோடு உள்ள தொடர்பையும், பாலாக்கின் வேண்டுகோளின் உடனடித் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: לְכָה נָּא
  choice: தயவுசெய்து வந்து
  rationale: கட்டளையோடு இணைந்த பணிவான, அவசரமான வேண்டுகோளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אָרָה לִּי אֶת־הָעָם הַזֶּה
  choice: எனக்காக இந்த மக்களைச் சபியும்
  rationale: ஆரா என்ற வினையின் தீங்கு வரும்படி சாபமிடும் பொருளையும், பாலாக்கின் சார்பாகச் செய்யப்படும் கோரிக்கையையும் காக்கிறது.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: ஏனெனில் அவர்கள் என்னைவிட வலிமைமிக்கவர்கள்
  rationale: எபிரெயத்தில் மக்களைக் குறிக்கும் ஒருமைக் கூட்டுப்பெயர் இருந்தாலும், தமிழில் இயல்பாகப் பன்மைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது; ஒப்பீட்டின் இராணுவ வலிமைத் தன்மையும் காக்கப்படுகிறது.
- source_word: אוּלַי אוּכַל
  choice: ஒருவேளை ... என்னால் முடியும்
  rationale: உறுதியின்மையையும் செயலாற்றும் திறனைப் பற்றிய நம்பிக்கையையும் ஒருசேரத் தெரிவிக்கிறது.
- source_word: נַכֶּה בּוֹ
  choice: அவர்களைத் தாக்கி
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘தாக்கு’ என்பதைக் காக்கிறது; ‘தோற்கடி’ என்று முடிவை முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: וַאֲגָרְשֶׁנּוּ מִן־הָאָרֶץ
  choice: நாட்டிலிருந்து துரத்திவிட
  rationale: גרש என்பதன் வெளியேற்றும் பொருளையும், הארץ என்பதன் நிலப்பரப்பு அல்லது நாடு சார்ந்த பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: நீர் யாரை ஆசீர்வதிக்கிறீரோ அவர் ஆசீர்வதிக்கப்பட்டவர்
  rationale: பொதுவான தொடர்பியல் அமைப்பையும், ஆசீர்வாதத்தின் விளைவுநிலையைக் காட்டும் செயல்பாட்டு எச்சத்தின் பொருளையும் காக்கிறது.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: யாரைச் சபிக்கிறீரோ அவர் சபிக்கப்பட்டவர்
  rationale: முந்தைய ஆசீர்வாதக் கூற்றின் இணை அமைப்பையும், சாபத்தின் விளைவுநிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பிலேயாமின் ஆசீர்வாதமும் சாபமும் தவறாமல் விளையும் என்ற பாலாக்கின் கூற்று
  choice: பாலாக்கின் நம்பிக்கையாகவே நேரடியாக மொழிபெயர்க்கப்பட்டது
  alternative: பிலேயாமுக்கு தனிப்பட்ட ஆன்மீக அதிகாரம் உண்மையில் இருந்ததாக விளக்குதல்
  rationale: வசனம் பாலாக்கின் அறிவிப்பு அல்லது நம்பிக்கையை மட்டுமே பதிவு செய்கிறது; அதன் இறையியல் உண்மைத்தன்மையை மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைச் சுட்டான “நீர்” பயன்படுத்தப்பட்டுள்ளது. மொழிநடை பணிவான வேண்டுகோள், இராணுவ அச்சம், ஆசீர்வாதம்–சாபம் என்ற இணை அமைப்பு ஆகியவற்றைத் தெளிவாகவும் கண்ணியமாகவும் தக்கவைக்கிறது.
