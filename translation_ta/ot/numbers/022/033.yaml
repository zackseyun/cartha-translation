  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: ta
  text: அந்தக் கழுதை என்னைக் கண்டு, இந்த மூன்று முறைகளிலும் எனக்கு முன்பாக விலகியது. அது என் முன்னிலிருந்து விலகாமல் இருந்திருந்தால்[a], இந்நேரத்திற்குள் நான் உன்னைக் கொன்றிருப்பேன்; அதையோ உயிரோடு விட்டிருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லடிப்படையாக, “ஒருவேளை அது என் முன்னிலிருந்து விலகியது.” இங்கு வெளிப்படையான எதிர்மறைச் சொல் இல்லை. ஆனால் சூழலும் அடுத்த கூற்றும் இதை, “அது என் முன்னிலிருந்து விலகாமல் இருந்திருந்தால்” என்ற எதிர்நிகழ் நிபந்தனையாகப் புரிந்துகொள்ளச் செய்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: என்னைக் கண்டு
  rationale: ראה இங்கு நேரடியான பார்வையைக் குறிக்கிறது; நவீன தமிழில் இயல்பான, தெளிவான மொழிபெயர்ப்பு.
- source_word: הָאָתוֹן
  choice: அந்தக் கழுதை
  rationale: ஆதோன் பெண் கழுதையைக் குறித்தாலும், தமிழில் ‘கழுதை’ இயல்பானது; பின்னர் வரும் அஃறிணைச் சுட்டுப்பெயர் தேவையற்ற பாலினச் சுமையைத் தவிர்க்கிறது.
- source_word: וַתֵּט לְפָנַי
  choice: எனக்கு முன்பாக விலகிச் சென்றது
  rationale: נטה என்பதன் விலகுதல்/திசைமாறுதல் என்ற பொருளையும் לְפָנַי என்பதன் இடவுறவையும் தெளிவாகக் காக்கிறது.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: இந்த மூன்று முறையும்
  rationale: சொல்லடிப்படையில் ‘மூன்று கால்கள்/தடவைகள்’ என்றாலும், இங்கு மூன்று நிகழ்வுகள் என்ற வழக்குப் பொருள்; ‘மூன்று முறையும்’ இயல்பான தமிழாகும்.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: அது எனக்கு முன்பாக விலகிச் செல்லாமல் இருந்திருந்தால்
  rationale: மசோரா உரையில் வெளிப்படையான எதிர்மறைச் சொல் இல்லாவிட்டாலும், தொடரின் நிகழ்வியல் தர்க்கம் எதிர்நிகழ் நிபந்தனையை வேண்டுகிறது; இதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிட்டுள்ளது.
- source_word: כִּי עַתָּה
  choice: இந்நேரத்திற்குள்
  rationale: விளைவுக் கூற்றின் உடனடியான கால வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: גַּם אֹתְךָה הָרַגְתִּי
  choice: நான் உன்னைக் கொன்றுவிட்டு
  rationale: எதிர்நிகழ் விளைவுக்கேற்ற வினை அமைப்பு; גם தரும் வலியுறுத்தல் கழுதையை உயிருடன் விடுவதற்கான எதிர்மறை ஒப்புமையில் வெளிப்படுகிறது.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: அதை உயிரோடு விட்டிருப்பேன்
  rationale: חיה என்பதன் ஹிஃபில் வடிவம் ‘உயிரோடு வைத்தல்/விடுதல்’ என்று பொருள் தருகிறது; ‘விட்டிருப்பேன்’ கொல்லாதிருப்பதைக் குறிக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: אוּלַי என்பதற்குப் பின் வெளிப்படையான எதிர்மறை இல்லாதபோதும் எதிர்நிகழ் நிபந்தனையாகப் புரிந்துகொள்வது
  choice: ‘விலகிச் செல்லாமல் இருந்திருந்தால்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒருவேளை அது எனக்கு முன்பாக விலகிச் சென்றது’ என்று சொல்லடிப்படையில் மொழிபெயர்த்தல்
  rationale: கழுதை விலகியதாலேயே பிலேயாம் கொல்லப்படவில்லை என்பது கதைச் சூழலும் அடுத்த விளைவுக் கூற்றும் காட்டும் பொருள். ஆகவே சூழலால் வேண்டப்படும் எதிர்மறையை முதன்மை உரையில் வழங்கி, எபிரெய உரையின் வெளிப்படையான வடிவத்தை அடிக்குறிப்பில் ஆவணப்படுத்துவது உண்மையான உரைத் திணறலை மறைக்காமல் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கழுதை’க்கு இயல்பான அஃறிணைச் சுட்டுப்பெயரான ‘அது’ பயன்படுத்தப்பட்டுள்ளது; மூல மொழியின் பெண்பால் இலக்கணத்தை செயற்கையாகத் தமிழில் திணிக்கவில்லை. மூலத்தின் உரைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
