source:
  edition: WLC
  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: ta
  text: அப்போது யாவே கழுதையின் வாயைத் திறந்தார்[a]. அது பிலேயாமிடம், “நான் உமக்கு என்ன செய்தேன்? நீர் என்னை இந்த மூன்று முறையும்[b] ஏன் அடித்தீர்?” என்று கேட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கழுதை” என்பதற்கான எபிரெயப் பெயர்ச்சொல் பெண்பாலில் உள்ளது; “சொன்னாள்” என்பதற்கான அடுத்த எபிரெய வினைச்சொல்லும் பெண்பால் வடிவிலேயே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இந்த மூன்று கால்கள்”; இது “இந்த மூன்று முறை” அல்லது “இந்த மூன்று சந்தர்ப்பங்களில்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: திறந்தார்
  rationale: פתח என்ற வினை இங்கு நேரடியாக ‘திறந்தார்’ என்று பொருள்படுகிறது; கழுதை பேசும்படி செய்தவர் யாவே என்பதையும் தெய்வீகச் செயல் நேரடியாக இருந்ததையும் இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் தேவனுடைய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: פִּי הָאָתוֹן
  choice: கழுதையின் வாயை
  rationale: எபிரெயக் கட்டமைப்பின் ‘கழுதையின் வாய்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. אָתוֹן என்பது குறிப்பாகப் பெண் கழுதையைக் குறித்தாலும், தமிழில் வெறுமனே ‘கழுதை’ என்பதே இயல்பாக உள்ளது; அந்த விவரம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: அது பிலேயாமிடம் … என்று கேட்டது
  rationale: பெண்பால் ஒருமை வினைச்சொல்லின் பேசுபவர் கழுதை என்பதைக் ‘அது’ தெளிவுபடுத்துகிறது. உரை கேள்வியாக இருப்பதால், இயல்பான தமிழுக்காக ‘என்று கேட்டது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: நான் உமக்கு என்ன செய்தேன்?
  rationale: கழுதையின் எதிர்ப்புக் கேள்வியை நேரடியாகவும் மரியாதை ஒருமையிலும் வழங்குகிறது.
- source_word: כִּי הִכִּיתַנִי
  choice: நீர் என்னை … அடிக்கும்படி
  rationale: כי இணைக்கும் காரணம் அல்லது விளைவு சார்ந்த உறவைத் தமிழில் கேள்வியின் ஒரே வாக்கிய அமைப்புக்குள் இயல்பாகக் கொண்டுவருகிறது; נכה என்பதற்கு மிகைப்படுத்தாமல் ‘அடித்தல்’ பயன்படுத்தப்படுகிறது.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: இப்படி மூன்று முறை
  rationale: சொல்லுக்கு சொல் ‘இந்த மூன்று கால்கள்’ என்று வரும் எபிரெய மரபுத்தொடர் இங்கு ‘மூன்று முறை/மூன்று சந்தர்ப்பங்கள்’ என்பதைக் குறிக்கிறது. ‘இப்படி’ என்பது זֶה-இன் சுட்டும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எபிரெய மெய்யெழுத்துகளால் எழுதப்படும் தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பிலேயாமை நோக்கிய ஒருமை உரையாடலுக்கு ‘நீர்/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. கழுதையின் பாலினத்தைத் தமிழில் செயற்கையாக வெளிப்படுத்தாமல், மூலமொழி விவரம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
