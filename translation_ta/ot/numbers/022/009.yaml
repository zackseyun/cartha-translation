revisions:
- from: அப்போது கடவுள் பிலேயாமிடம் வந்து, “உன்னோடு இருக்கும் இந்த ஆண்கள் யார்?” என்று கேட்டார்.
  to: அப்போது கடவுள் பிலேயாமிடம் வந்து, “உன்னுடன் இருக்கும் இந்த மனிதர்கள் யார்?” என்று கூறினார்.
  rationale: The revision preserves the Hebrew narrative sequence and direct question while rendering וַיֹּאמֶר with a neutral speech verb rather than an interpretively narrowed question verb. It also improves idiomatic modern Tamil without changing the sense.
