id: NUM.22.9
reference: Numbers 22:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: ta
  text: அப்போது கடவுள் பிலேயாமிடம் வந்து, “உன்னுடன் இருக்கும் இந்த மனிதர்கள் யார்?” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: கதைத் தொடரை முன்னெடுக்கும் waw உடன் வந்த בוא வினை இங்கு ‘வந்தார்’ என்று இயல்பாகப் பொருள்படும்; ‘அப்போது’ நிகழ்வின் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடன் வரும் இச்சொல், இச்சூழலில் பிலேயாமிடம் தனிப்பட்ட முறையில் பேசும் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: אֶל־בִּלְעָם
  choice: பிலேயாமிடம்
  rationale: אֶל குறிக்கும் அணுகுதலையும் நோக்கையும் தமிழில் இயல்பாக ‘-ிடம்’ என்ற வேற்றுமை உருபு தெரிவிக்கிறது; பெயர் வழக்கமான தமிழெழுத்துப்பெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், நேரடி வினாவை அறிமுகப்படுத்தும் இவ்விடத்தில் தமிழில் ‘என்று கேட்டார்’ என்பதே இயல்பானதும் பேச்சுச் செயலின் தன்மையைத் துல்லியமாகக் காட்டுவதுமாகும்.
- source_word: מִי
  choice: யார்
  rationale: நபர்களின் அடையாளத்தை வினவும் நேரடியான கேள்விச்சொல்.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: இந்த ஆண்கள்
  rationale: אֲנָשִׁים இங்கு ஆண் தூதர்களைக் குறிக்கிறது; הָאֵלֶּה அருகிலுள்ள குறிப்பிட்ட நபர்களைச் சுட்டுவதால் ‘இந்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִמָּךְ
  choice: உன்னோடு இருக்கும்
  rationale: உடனிருத்தல் அல்லது சேர்க்கையைச் சுட்டும் עם என்பதன் பொருளை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பிலேயாம் கதையில் אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம் / தெய்வீக ஆளுமை
  rationale: אֱלֹהִים வேறு சூழல்களில் பல பொருள்களைக் கொள்ளக்கூடியதாயினும், இங்குள்ள ஒருமை வினையும் கதையின் சூழலும் இஸ்ரவேலின் கடவுளையே சுட்டுகின்றன. ‘கடவுள்’ என்பது கூடுதல் சமயக் கோட்பாட்டைச் சேர்க்காமல் அந்தக் குறிப்பைத் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மரியாதை வினைமுற்றுகள் கடவுளைக் குறிக்கும் எழுவாயுடன் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கவுரை சேர்க்கப்படவில்லை.
