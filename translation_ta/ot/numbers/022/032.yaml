  to: யாவேயின் தூதர் அவனிடம், “உன் கழுதையை இந்த மூன்று முறை ஏன் அடித்தாய்? இதோ, நான் எதிரியாகப் புறப்பட்டு வந்திருக்கிறேன்[a]; ஏனெனில், உன் வழி என் முன்னிலையில் நெறிபிறழ்ந்ததாக இருக்கிறது[b]” என்றார்.
