  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: ta
  text: யாவேயின் தூதர் அவனிடம், “உன் கழுதையை இந்த மூன்று முறை ஏன் அடித்தாய்? இதோ, நான் எதிரியாகப் புறப்பட்டு வந்திருக்கிறேன்[a]; ஏனெனில், உன் வழி என் முன்னிலையில் நெறிபிறழ்ந்ததாக இருக்கிறது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரேயச் சொல் שָׂטָן என்பது ‘எதிரி’ அல்லது ‘எதிர்ப்பவர்’ என்று பொருள்படும் பொதுப்பெயர்; அது ‘சாத்தான்’ என்ற தனிப்பெயரைக் கட்டாயமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘நெறிபிறழ்ந்ததாக இருக்கிறது’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேய வினை மிகவும் அரிதானது. இதை ‘தாறுமாறாக இருக்கிறது,’ ‘அவசரமாகப் பாய்கிறது,’ அல்லது ‘எனக்கு முரணாக இருக்கிறது’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள்படலாம். இக்கதையில் இயற்கைக்கு அப்பாற்பட்ட தூதரைக் குறித்தாலும், ‘தூதர்’ என்பது மூலச்சொல்லின் பரப்பையும் இயல்பான தமிழ் நடையையும் காக்கிறது. יהוה என்பது பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל מָה
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரேயச் சொற்றொடரின் இயல்பான, நேரடியான தமிழாக்கம்.
- source_word: הִכִּיתָ אֶת־אֲתֹנְךָ
  choice: உன் கழுதையை ... அடித்தாய்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’. אֲתוֹן பெண் கழுதையைக் குறிப்பிட்டாலும், இங்கு பாலினத்தை வலியுறுத்தாத இயல்பான தமிழ் சொல்லாக ‘கழுதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: இந்த மூன்று முறை
  rationale: சொல்லுக்குச் சொல் ‘மூன்று கால்கள்/தடவைகள்’ என்ற அமைப்பு இங்கு ‘மூன்று முறை’ என்னும் இடியத்தைத் தருகிறது.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: இதோ, நான் ... புறப்பட்டு வந்திருக்கிறேன்
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் ‘இதோ’ எனவும், יצא சந்திப்பதற்காக வெளியே வந்த செயலைக் குறிக்கும் வகையில் ‘புறப்பட்டு வந்திருக்கிறேன்’ எனவும் தரப்பட்டுள்ளது.
- source_word: לְשָׂטָן
  choice: எதிரியாக
  rationale: שָׂטָן இங்கு பொதுப்பெயராக ‘எதிரி/எதிர்ப்பவர்’ என்று பொருள்படுகிறது; பிற்காலத் தனிப்பெயரான ‘சாத்தான்’ என்பதை இவ்வசனத்தில் இறக்குமதி செய்யவில்லை.
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: நீ செல்லும் வழி என் முன்னிலையில் தாறுமாறாக இருக்கிறது
  rationale: יָרַט மிகவும் அரிதானதும் பொருள் உறுதியற்றதுமான வினை. ‘தாறுமாறாக’ என்பது அவசரமான, நெறிபிறழ்ந்த அல்லது முரணான போக்கை ஒரே பொருளாக முடிவுசெய்யாமல் வெளிப்படுத்துகிறது. ‘நீ செல்லும்’ என்பது சூழலால் தெளிவாகும் உரிமையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: לְשָׂטָן என்பதன் அடையாளம்
  choice: பொதுப்பெயராக ‘எதிரியாக’
  alternative: தனிப்பெயராக ‘சாத்தானாக’
  rationale: இங்கு யாவேயின் தூதரே பிலேயாமின் பயணத்தை எதிர்த்து நிற்கிறார். ஆகவே இச்சொல் ஒரு பணியை அல்லது நிலையை விவரிக்கிறது; பிசாசைக் குறிக்கும் தனிப்பெயராக மொழிபெயர்ப்பது மூலத்தில் இல்லாத இறையியல் கருத்தைச் சேர்க்கும்.
- issue: יָרַט என்பதன் உறுதியற்ற பொருள்
  choice: ‘தாறுமாறாக இருக்கிறது’
  alternative: ‘நெறிபிறழ்ந்ததாக இருக்கிறது’ அல்லது ‘எனக்கு முரணாக இருக்கிறது’
  rationale: அரிதான எபிரேய வினையின் துல்லியப் பொருள் விவாதத்திற்குரியது. முதன்மை உரை அதன் எதிர்மறையான மதிப்பீட்டையும் தெளிவின்மையையும் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற வேதாகம உரையாடல் குறியீடு தக்கவைக்கப்பட்டாலும் பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் அரிய வினையால் உண்டாகும் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
