source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: ta
  text: கழுதை, யாவேயின் தேவதூதர் கையில் உருவிய வாளுடன் பாதையில் நின்றுகொண்டிருப்பதைக் கண்டது[a]. அது பாதையைவிட்டு விலகி வயலுக்குள் சென்றது. அதை மீண்டும் பாதைக்குத் திருப்புவதற்காக பிலேயாம் கழுதையை அடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் தூதர்.”
    reason: மַלְאָךְ என்பதற்கு “தூதர்” அல்லது, இச்சூழலில், “தேவதூதர்” என்று மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: கழுதை
  rationale: ஆதோன் என்பது பெண் கழுதையைக் குறிக்கிறது. தமிழில் இயல்பான ‘கழுதை’ என்பதே சூழலில் போதுமானது; பாலினத்தைத் தனியாக வலியுறுத்த வேண்டிய அவசியமில்லை.
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאָךְ என்பதற்கு ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள் கொள்ளலாம். மூலத்தின் சொற்பொருள் சார்ந்த தெளிவின்மையை ‘தூதர்’ காக்கிறது; சூழல் அவர் இயற்கைக்கு அப்பாற்பட்டவர் என்பதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: பாதையில் நின்றுகொண்டிருப்பது
  rationale: தூதர் பயணப் பாதையில் தடையாக நிற்கும் காட்சியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: கையில் உருவிய வாளுடன்
  rationale: שְׁלוּפָה என்பது உறையிலிருந்து உருவப்பட்ட அல்லது வெளியே எடுக்கப்பட்ட வாளைக் குறிக்கிறது; சுருக்கமான தமிழ் சொற்றொடர் மூலப் படிமத்தைக் காக்கிறது.
- source_word: וַתֵּט ... מִן הַדֶּרֶךְ
  choice: பாதையைவிட்டு விலகி
  rationale: நָטָה இங்கு வழியிலிருந்து திரும்பி விலகுவதைக் குறிக்கிறது.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: வயலுக்குள் சென்றது
  rationale: שָׂדֶה என்பதன் konkretaன வயல் அல்லது திறந்த நிலப் பொருளை இச்சூழலில் இயல்பாக வழங்குகிறது.
- source_word: וַיַּךְ
  choice: அடித்தான்
  rationale: נכה என்பதன் பொதுவான ‘அடி/தாக்கு’ பொருளைத் தருகிறது; ஒரே வினை வடிவிலிருந்து மீண்டும் மீண்டும் அடித்ததாக மிகைப்படுத்தவில்லை.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: அதை மீண்டும் பாதைக்குத் திருப்புவதற்காக
  rationale: கழுதை ஏற்கெனவே பாதையைவிட்டு விலகியிருப்பதால் நோக்கத்தை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘மீண்டும்’ என்பது சூழலால் உணர்த்தப்படுவது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர் / யாவே
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பெயரான நான்கெழுத்துப் பெயர் உள்ளது. தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் அதைத் தனிப்பெயராகக் காக்கிறது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: מַלְאַךְ என்பதிலுள்ள பொருள் விரிவு
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: எபிரெயச் சொல் பொதுவாக ‘தூதர்’ என்றும் சூழலின்படி ‘தேவதூதர்’ என்றும் பொருள்படும். பிரதான உரையில் ‘தூதர்’ என வைத்து மூலத்தின் சொல்விரிவைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, வாசிக்க எளிய, கண்ணியமான தமிழ். எபிரெயக் கதைநடையின் செயல்வரிசை காக்கப்பட்டுள்ளது. ‘உருவிய வாள்’ என்ற மரபுசார்ந்த ஆனால் இன்றும் புரியக்கூடிய சொற்றொடர் காட்சியின் செறிவைத் தக்கவைக்கிறது.
