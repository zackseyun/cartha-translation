  source_fidelity: திருத்தம் தேவை. יְהוָה என்பது தனிப்பெயர்; தரப்பட்ட POB கொள்கையின்படியும் எபிரெயப் பெயருக்கு நெருக்கமாகவும் அதை “யாவே” என்று வழங்குவது பொருத்தமானது; “யெகோவா” பாரம்பரிய வடிவமாக இருந்தாலும் மூலத்தின் பெயரொலிபெயர்ப்பைச் சற்றுத் தள்ளுகிறது. மேலும் இக்காட்சியில் வாளேந்தி வழியை மறித்து நிற்பவர் இயற்கைக்கு அப்பாற்பட்டவராகத் தெளிவாக இருப்பதால், מַלְאַךְ יְהוָה என்பதற்கு முதன்மை உரையில் “யாவேயின் தேவதூதர்” என்பது சூழல்சார் நேரடியான மொழிபெயர்ப்பு. “தூதர்” என்பதைக் காலடிக்குறிப்பில் மாற்றுவழியாகக் காக்கலாம். “உடனே” மூலத்தில் வெளிப்படையாக இல்லை; செயல்வரிசையை மட்டும் காட்டும் வகையில் நீக்கப்பட்டுள்ளது.
