base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: ta
  text: மோவாப் மீதியானின் மூப்பர்களிடம், “வயலின் பசுந்தாவரங்களை மாடு நக்கித் தீர்ப்பதுபோல, இப்போது இந்தக் கூட்டம் நம்மைச் சுற்றியுள்ள அனைத்தையும் நக்கித் தீர்த்துவிடும்” என்றது. அக்காலத்தில் சிப்போரின் மகன் பாலாக் மோவாபின் அரசனாக இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: தேசியப் பெயரையும், ஒருமை வினையுடன் பேசும் உருவகப்படுத்தப்பட்ட அரசியல் சமூகத்தையும் நேரடியாகக் குறிக்கிறது.
- source_word: זִקְנֵי מִדְיָן
  choice: மீதியானின் மூப்பர்கள்
  rationale: இணைப்புநிலை பன்மையான ‘மீதியானின் மூப்பர்கள்’ என்பதற்கான இயல்பான, வெளிப்படையான தமிழ் வடிவம்.
- source_word: עַתָּה
  choice: இப்போது
  rationale: உடனடி அச்சத்தையும் உரையின் முன்னேற்றத்தையும் காட்டுகிறது.
- source_word: יְלַחֲכוּ
  choice: நக்கித் தீர்த்துவிடும்
  rationale: לחך என்பதன் ‘நக்கு’ என்ற நேரடி படிமத்தைப் பாதுகாக்கிறது; விளைவு முழுமையையும் இயல்பான தமிழில் உணர்த்த ‘தீர்த்து’ சேர்க்கப்பட்டது.
- source_word: הַקָּהָל
  choice: இந்தச் சபை
  rationale: கூடியிருக்கும் இஸ்ரயேல் சமூகத்தைக் குறிக்கும் கூட்டுப்பொருளைப் பாதுகாக்கிறது; சூழலின் சுட்டுப்பொருளை ‘இந்த’ வெளிப்படுத்துகிறது.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: நம்மைச் சுற்றியுள்ள அனைத்தையும்
  rationale: ‘நமது சுற்றுப்புறமனைத்தையும்’ என்ற எபிரேயப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: மாடு நக்கித் தீர்ப்பதுபோல
  rationale: ஒப்புமையையும் לחך என்ற வேரின் மீள்பயன்பாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: வயல்வெளியின் பசுந்தழைகள்
  rationale: יֶרֶק என்பதன் புல்லுக்கு மட்டும் வரையறுக்கப்படாத பசுமையான தாவர வளர்ச்சி என்ற பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: சிப்போரின் மகன் பாலாக்
  rationale: தொடர்ந்து வரும் கதைக்கு உரிய அரசனை அறிமுகப்படுத்தும் பின்னணித் தகவலாக இயல்பாக அமைக்கப்பட்டது.
- source_word: מֶלֶךְ לְמוֹאָב
  choice: மோவாபின் அரசனாக இருந்தான்
  rationale: எளிய பயனிலை அமைப்பைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: בָּעֵת הַהִוא
  choice: அக்காலத்தில்
  rationale: கதையின் காலப் பின்னணியைக் குறிக்கும் நேரடியான தமிழ் இணை.
