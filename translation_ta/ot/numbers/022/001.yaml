translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பயண நிகழ்வுகளின் தொடரை ‘புறப்பட்டு… முகாமிட்டார்கள்’ என இயல்பாகக் காட்டுகிறது; புவியியல் நோக்குநிலையின் இயல்பான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
