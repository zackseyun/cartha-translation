base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: ta
  text: 'எண்ணாகமம் 22:1


    பின்பு இஸ்ரவேலின் மகன்கள்[a] புறப்பட்டு, யோர்தானுக்கு அப்பால்[b], எரிகோவுக்கு எதிரே இருந்த மோவாபின் சமவெளிகளில்[c] முகாமிட்டார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் மக்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இது தேசத்தார் அனைவரையும் குறிக்கும் வழக்கமான பெயர்.
    reason: lexical_alternative
  - marker: b
    text: ‘யோர்தானுக்கு மறுபக்கத்தில்’ என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் உரையாளர் நிற்கும் நோக்குநிலையைச் சார்ந்த புவியியல் குறிப்பாகும்.
    reason: lexical_alternative
  - marker: c
    text: மோவாபின் சமவெளிகள் யோர்தானின் கிழக்குப் பகுதியில் இருந்தன; அவற்றின் இருப்பிடத்தைச் சுட்டும் அடையாள இடமாக எரிகோ குறிப்பிடப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: נסע என்ற வினை இங்கு முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது அந்த இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இது முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்கமான தேசியப் பெயர். மூலத்தின் வடிவம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் கூட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது ஓர் இடத்தில் முகாமிடுவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עֲרָבוֹת என்பது புல்வெளி அல்லது வறண்ட சமதளப் பகுதியைக் குறிக்கலாம். இங்குள்ள அறியப்பட்ட புவியியல் பயன்பாட்டுக்கு ‘சமவெளிகள்’ தெளிவாகப் பொருந்துகிறது.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: இந்தச் சொற்றொடர் உரையாளர் நோக்கும் இடத்திலிருந்து யோர்தானின் மறுபக்கத்தைக் குறிக்கிறது. ‘அப்பால்’ அந்த நோக்குநிலை சார்ந்த உறவை மிகையாகத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே
  rationale: எரிகோ இங்கு யோர்தானின் கிழக்கேயுள்ள மோவாபின் சமவெளிகளின் இருப்பிடத்தைச் சுட்டும் அடையாள இடமாக வருகிறது. தமிழில் ‘எரிகோவுக்கு எதிரே’ அந்தப் புவியியல் உறவைத் தெளிவாகக் கூறுகிறது.
