  terminology: ‘இஸ்ரவேலின் மகன்கள்’ மூல வடிவத்தையும் அதன் கூட்டுத் தேசியப் பயன்பாட்டையும் காக்கிறது; மாற்றுவழி அடிக்குறிப்பு வாசகருக்குப் போதுமான விளக்கத்தை அளிக்கிறது. ‘யோர்தான்,’ ‘எரிகோ,’ ‘மோவாப்,’ ‘முகாமிட்டார்கள்,’ ‘சமவெளிகள்’ ஆகியவை பொருத்தமானவை.
