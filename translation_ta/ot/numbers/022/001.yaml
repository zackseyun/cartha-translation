  source_fidelity: மூல எபிரெயத்தின் பயணத் தொடர் (‘புறப்பட்டு… முகாமிட்டார்கள்’), தேசியப் பெயர், மோவாபின் சமவெளிகள், யோர்தானுக்கு அப்பாலான நோக்குநிலை சார்ந்த இடக்குறிப்பு ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. ‘எரிகோவுக்கு எதிரே’ என்பது இச்சூழலில் உள்ள புவியியல் உறவை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் நோக்குநிலை சார்ந்த தன்மையையும் அநாவசியமாகக் குறிப்பிட்ட திசையாக மாற்றவில்லை.
