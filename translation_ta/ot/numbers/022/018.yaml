  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: ta
  text: 'பிலேயாம் பாலாக்கின் ஊழியர்களுக்குப் பதிலளித்துச் சொன்னான்: “பாலாக் தன் வீடு நிறைய வெள்ளியையும் தங்கத்தையும் எனக்குக் கொடுத்தாலும்கூட, சிறியதோ பெரியதோ எதையும் செய்ய, என் கடவுளாகிய யாவேயின் வார்த்தையை மீறிச் செல்ல என்னால் முடியாது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் கடவுளாகிய யாவேயின் வாயைத் தாண்டிச் செல்ல.” யாவே கூறியதையோ கட்டளையிட்டதையோ மீறுதல் என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெயக் கதையாடலில் பதிலை அறிமுகப்படுத்தும் இரு வினைகளின் அமைப்பைப் பேணும் இயல்பான தமிழ் நடை.
- source_word: עַבְדֵי בָלָק
  choice: பாலாக்கின் ஊழியர்கள்
  rationale: சூழலில் பாலாக்கின் தூதர்களாகச் செயல்படும் பணியாளர்களைக் குறிக்கிறது; அடிமைத்தனத்தை மிகைப்படுத்தாமல் மூலச்சொல்லுக்கு நெருக்கமாக உள்ளது.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: பாலாக் ... எனக்குக் கொடுத்தாலும்கூட
  rationale: நிபந்தனை வாக்கியத்தின் கருத்தளவில் உள்ள விட்டுக்கொடுக்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: தன் வீடு நிறைய வெள்ளியையும் தங்கத்தையும்
  rationale: அளவற்ற செல்வத்தைக் காட்டும் ‘வீடு நிறைய’ என்ற மூலப்படிமத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: לֹא אוּכַל
  choice: என்னால் முடியாது
  rationale: வெறும் மறுப்பாக அல்லாமல் இயலாமையாகக் கூறப்படும் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: לַעֲבֹר אֶת פִּי
  choice: வாய்ச்சொல்லை மீறிச் செல்ல
  rationale: ‘வாயைத் தாண்டிச் செல்ல’ என்ற எபிரெய மரபுத்தொடரின் படிமத்தையும், கூறப்பட்டதை மீறுதல் என்ற பொருளையும் இணைத்துப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எபிரெய மெய்யெழுத்துகளைக் குறிக்கும் பெயரைத் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளாகிய
  rationale: பிலேயாமின் ‘என் கடவுள்’ என்ற உரிமைத் தொடர்பை இயல்பான தமிழில் அப்படியே வைத்துள்ளது.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: சிறியதோ பெரியதோ எதையும் செய்வதற்காக
  rationale: சிறியது முதல் பெரியது வரை எதுவாயினும் என்ற முழுமையைக் குறிக்கும் எதிரிணையைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டமல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக வருகிறது; ஆகவே அதை ஒலிபெயர்த்து வேறுபாட்டைப் பேணுகிறது.
- issue: பிலேயாமின் கூற்றில் இயலாமையா அல்லது கீழ்ப்படிய மறுக்காத மனநிலையா
  choice: என்னால் முடியாது
  alternative: நான் மீறமாட்டேன்
  rationale: יכל என்பது திறன் அல்லது இயலாமையைக் குறிக்கிறது. வசனத்தில் கூறப்படும் இயலாமையைத் தன்னிச்சையான மறுப்பாக மாற்றாமல் வைத்துள்ளது.
- issue: ‘யாவேயின் வாய்’ என்ற மரபுத்தொடரின் பொருள்
  choice: யாவேயின் வாய்ச்சொல்லை மீறிச் செல்ல
  alternative: யாவேயின் கட்டளையை மீற
  rationale: கட்டளை என்ற பொருள் சாத்தியமானதாயினும், மூலத்தின் ‘வாய்’ படிமம் பரந்த ‘சொல்/உரை’ கருத்தையும் கொண்டுள்ளது; ‘வாய்ச்சொல்’ அந்தத் திட்டமிட்ட தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான நேரடி உரை. ‘வாய்ச்சொல்’ என்பது மூல எபிரெயப் படிமத்தை ஓரளவு வெளிப்படுத்துவதுடன் வாசகருக்குப் பொருளையும் உணர்த்துகிறது; முழு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
