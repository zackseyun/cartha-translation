- from: அப்போது யாவே பிலேயாமின் கண்களைத் திறந்தார்[a]. வழியில் யாவேயின் தூதர்[b], உருவிய வாளைக் கையில் பிடித்தபடி நிற்பதை அவன் கண்டான். உடனே அவன் குனிந்து, முகங்குப்புற விழுந்து வணங்கினான்[c].
  to: அப்போது யாவே பிலேயாமின் கண்களைத் திறந்தார்[a]. வழியில், உருவிய வாளைத் தம் கையில் பிடித்தபடி நின்றுகொண்டிருந்த யாவேயின் தூதரை[b] அவன் கண்டான். அவன் குனிந்து, முகங்குப்புற விழுந்தான்[c].
  rationale: 'திருத்தம் மூலத்தின் வினைவரிசையைத் தெளிவாகப் பாதுகாக்கிறது: பிலேயாம் முதலில் குனிகிறான்; பின்னர் முகங்குப்புற விழுகிறான். “வணங்கினான்” நீக்கப்பட்டதால், உடல் தாழ்வைக் குறிக்கும் எபிரேயச் சொல்லை வழிபாடு என இறையியல் ரீதியில் விளக்காமல் மொழிபெயர்ப்பு நிற்கிறது. தூதரின் நிலை, கையில் உள்ள உருவிய வாள் ஆகியவை இன்னும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்கப்பட்டுள்ளன.'
