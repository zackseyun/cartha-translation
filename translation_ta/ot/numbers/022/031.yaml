    rationale: וַיִּקֹּד וַיִּשְׁתַּחוּ லְאַפָּיו என்பது குனிதல் மற்றும் முகங்குப்புறத் தாழ்தல் என்ற இரு உடல் செயல்களைத் தருகிறது. “வணங்கினான்” தமிழில் ஏற்கத்தக்கதாக இருந்தாலும், ஏற்கெனவே தெளிவாக மொழிபெயர்க்கப்பட்ட உடல் செயலைக் கடந்த நோக்கவிளக்கத்தைத் தரக்கூடும். உடல்சார் மொழியை மட்டும் வைத்தல் மூலத்தின் திறந்த தன்மையைச் சிறப்பாகப் பாதுகாக்கும்.
