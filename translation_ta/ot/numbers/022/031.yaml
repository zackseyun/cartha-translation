source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: ta
  text: அப்போது யாவே பிலேயாமின் கண்களைத் திறந்தார்[a]. வழியில், உருவிய வாளைத் தம் கையில் பிடித்தபடி நின்றுகொண்டிருந்த யாவேயின் தூதரை[b] அவன் கண்டான். அவன் குனிந்து, முகங்குப்புற விழுந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அட்சரப்பொருளில், “பிலேயாமின் கண்களின் மூடியை அகற்றினார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேயின் வானதூதர்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “முகந்தாழ்ந்து விழுந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: கண்களைத் திறந்தார்
  rationale: גלה என்பதன் அடிப்படைப் பொருள் ‘மூடியிருப்பதை அகற்றுதல்/வெளிப்படுத்துதல்.’ கண்களைப் பற்றிய இந்த எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழில் ‘கண்களைத் திறந்தார்’ என்று மொழிபெயர்க்கப்படுகிறது; அட்சரப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகக் கொடுக்கிறது.
- source_word: עֵינֵי בִלְעָם
  choice: பிலேயாமின் கண்களை
  rationale: எபிரேய இணைப்புநிலையை இயல்பான தமிழ் உடைமைத் தொடராக அளிக்கிறது.
- source_word: וַיַּרְא
  choice: அவன் கண்டான்
  rationale: கண்கள் திறக்கப்பட்டதன் விளைவாக நிகழ்ந்த பார்வையை எளிய கதைநடை இறந்தகாலத்தில் தருகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருளான ‘தூதர்’ என்பதைப் பாதுகாக்கிறது; இச்சூழலில் வானதூதர் என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: வழியில் ... நிற்பதை
  rationale: தூதர் பிலேயாமின் பாதையை மறித்து நிலைகொண்டிருந்த காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: உருவிய வாளைக் கையில் பிடித்தபடி
  rationale: שְׁלֻפָה என்பது உறையிலிருந்து உருவப்பட்ட நிலையைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் உடனிகழ்ச்சியாகத் தெளிவாக அமைக்கப்படுகிறது.
- source_word: וַיִּקֹּד
  choice: அவன் குனிந்து
  rationale: உடலைத் தாழ்த்தும் முதல் அசைவைச் சுருக்கமாகவும் காட்சிப்பூர்வமாகவும் தருகிறது.
- source_word: וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: முகங்குப்புற விழுந்து வணங்கினான்
  rationale: வினைச்சொல்லிலுள்ள தரையில் தாழ்ந்து பணியும் உடல் செயலைப் பாதுகாக்கிறது; ‘வழிபட்டான்’ என்று கூறி அதன் இறையியல் நோக்கத்தைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ என்பதன் பொருள்
  choice: தூதர்
  alternative: வானதூதர்
  rationale: ‘தூதர்’ என்பது சொல்லின் பரந்த அடிப்படைப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதர் என்பது தெளிவாயினும், அந்த விளக்கத்தை முதன்மை உரையில் அதிகப்படியாகச் சேர்க்கவில்லை.
- issue: וַיִּשְׁתַּחוּ என்பது வழிபாட்டையா உடல் பணிவையா குறிக்கிறது
  choice: முகங்குப்புற விழுந்து வணங்கினான்
  alternative: வழிபட்டான்
  rationale: மூலம் உடல் தாழ்வையும் வணக்கத்தையும் குறிக்கக்கூடும். ‘வழிபட்டான்’ என்பது நோக்கத்தை இறையியல் ரீதியில் முன்கூட்டியே தீர்மானிக்கலாம்; தேர்ந்தெடுத்த மொழி செயலைத் தெளிவாகக் காட்டி அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் உடனடியாகப் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உருவிய வாள்,’ ‘முகங்குப்புற’ போன்ற சொற்கள் மூலத்தின் காட்சிப்பூர்வத் தன்மையைச் சுருக்கமாகப் பாதுகாக்கின்றன.
