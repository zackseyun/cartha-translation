  source_fidelity: 'மூலத்தின் நிகழ்வுவரிசையும் முக்கியக் காட்சிப்படிமங்களும் பெரும்பாலும் சரியாக உள்ளன: யாவே பிலேயாமின் கண்களைத் திறத்தல், வழியில் நிற்கும் யாவேயின் தூதர், கையில் உருவிய வாள், குனிதல், முகங்குப்புறத் தாழ்தல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் இறுதியில் “வணங்கினான்” என்பது וַיִּשְׁתַּחוּ என்ற உடல்சார் செயலுக்குப் பொருத்தமானதாக இருந்தாலும், அதற்கும் முன் “முகங்குப்புற விழுந்து” என்பதே அந்தச் செயலைத் தெளிவாகத் தருவதால் தேவையற்ற விளக்கத்தைச் சேர்க்கிறது. மூலத்தின் இரண்டு தொடர்ச்சியான செயல்களையும் தனித்தனியாகக் காட்டுவது சிறந்தது.'
  naturalness: “வழியில் யாவேயின் தூதர், உருவிய வாளைக் கையில் பிடித்தபடி நிற்பதை” என்ற சொல் வரிசை புரிந்துகொள்ளக்கூடியது; இருப்பினும், தூதரையே நேரடிப் பொருளாக முன்னிறுத்தி, அவருடைய உடனிகழ்ச்சிக் குறிப்பை அதனுடன் இணைப்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் அமையும். இறுதி வாக்கியமும் “குனிந்து, முகங்குப்புற விழுந்தான்” எனச் சுருக்கமாக இயல்புறும்.
  terminology: “யாவே” என்பது יהוה-க்கு ஒலிபெயர்ப்பாகச் சீரானது. מַלְאָךְ என்பதற்கு முதன்மை உரையில் “தூதர்” என்பதும், “வானதூதர்” என்பதை அடிக்குறிப்பு மாற்றாகக் கொடுப்பதும் மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது. “உருவிய வாள்” மற்றும் “முகங்குப்புற” ஆகியன பொருத்தமானவை.
  issues:
