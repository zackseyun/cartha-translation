translation:
  language: ta
  text: அப்போது மோவாபின் தலைவர்கள் எழுந்து பாலாக்கிடம் சென்று, “பிலேயாம் எங்களுடன் வர மறுத்துவிட்டார்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: மோவாபின் தலைவர்கள்
  rationale: שָׂרִים என்பது இங்கு பாலாக்கின் சார்பில் அனுப்பப்பட்ட உயர்நிலைத் தூதர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; இயல்பான தமிழில் பரந்த பொருளைத் தக்கவைக்க ‘தலைவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: எபிரெய மொழியின் இயக்கத்தைத் தொடங்கும் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: מֵאֵן
  choice: மறுத்துவிட்டார்
  rationale: ஒரு செயலைச் செய்ய உடன்படாமையைத் தெளிவாகக் குறிக்கிறது; நிறைவேறிய மறுப்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: எங்களுடன் வர
  rationale: எபிரெய வினையெச்சத் தொடரின் பொருளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
