  choice: நீ சொல்ல வேண்டியது
  rationale: மோசேயை நோக்கிய இரண்டாம் நபர் ஒருமை கட்டளை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִתְקַדְּשׁוּ
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்
  rationale: קדשׁ வேரின் தன்னை ஆயத்தப்படுத்தித் தனியே பிரித்துக்கொள்ளும் சமயச் செறிவைத் தக்கவைக்கிறது; வெறும் ‘ஆயத்தமாகுங்கள்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: לְמָחָר
  choice: நாளைக்காக
  rationale: வரவிருக்கும் நாளை முன்னிட்டு செய்யப்படும் ஆயத்தத்தை לְ முன்னிடைச்சொல்லுக்கு ஏற்றவாறு குறிக்கிறது.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: நீங்கள் இறைச்சி சாப்பிடுவீர்கள்
  rationale: בָּשָׂר இச்சூழலில் உண்ணும் இறைச்சியைக் குறிக்கிறது; கட்டளையைத் தொடரும் வினை எதிர்கால விளைவைத் தெரிவிக்கிறது.
- source_word: בְּאָזְנֵי יְהוָה
  choice: யாவே கேட்கும்படி
  rationale: ‘யாவேயின் செவிகளில்’ என்ற எபிரெய உருவகத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவர்களுடைய அழுகை யாவேயின் செவிக்கு எட்டியது என்பதே மையம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: நமக்கு இறைச்சி உண்பிப்பவர் யார்?
  rationale: אכל என்பதன் ஹிஃபில் காரணவினை வடிவமான ‘உண்ணச் செய்வது/உண்பிப்பது’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: எகிப்தில் நமக்கு நன்றாக இருந்தது
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ஒப்பீட்டைச் சேர்க்காமல், மக்களின் கூற்றை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: யாவே உங்களுக்கு இறைச்சி கொடுப்பார்
  rationale: எளிய וְ இணைப்பை காரணவிளக்கச் சொல்லாக மிகைப்படுத்தாமல், யாவேயின் வரவிருக்கும் செயலாக மொழிபெயர்க்கிறது.
- source_word: וַאֲכַלְתֶּם
  choice: நீங்கள் அதைச் சாப்பிடுவீர்கள்
  rationale: எபிரெயத்தில் மீண்டும் வரும் ‘சாப்பிடுவீர்கள்’ என்பதை வலியுறுத்தலுக்காகத் தக்கவைக்கிறது; தமிழின் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்கப்படும் உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: இறைச்சி வழங்கப்படுவதில் அருளா அல்லது தீர்ப்பா என்பது
  choice: எளிய இணைப்பாக மொழிபெயர்த்து இரட்டைத் தொனியைத் திறந்துவைத்தல்
  alternative: ‘ஆகவே’ என்று வெளிப்படையான காரணவிளைவைச் சேர்த்தல்
  rationale: இச்சூழலில் வழங்குதல் மக்களின் முறையீட்டுக்கான பதிலும் வரவிருக்கும் தண்டனைத் தன்மையுள்ள நிகழ்வும் ஆகும்; எபிரெய וְ மட்டும் உள்ளதால் மொழிபெயர்ப்பு அந்த இறையியல் இழுபறியைத் தீர்மானித்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழைய ‘பரிசுத்தம்பண்ணிக்கொள்ளுங்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘தூய்மைப்படுத்திக்கொள்ளுங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; சமயச் செறிவு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மக்களின் மேற்கோளில் மூலத்தின் முதலாம் நபர் பன்மைத் தொனியைத் தக்கவைக்க ‘நமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
