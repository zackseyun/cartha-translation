  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: ta
  text: 'மக்களிடம் நீ சொல்ல வேண்டியது: ‘நாளைக்காக உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்[a]. நீங்கள் இறைச்சி சாப்பிடுவீர்கள். ஏனெனில், “நமக்கு இறைச்சி உண்பிப்பவர் யார்? எகிப்தில் நமக்கு நன்றாக இருந்தது” என்று சொல்லி, யாவேயின் செவிகளில் அழுதீர்கள். யாவே உங்களுக்கு இறைச்சி கொடுப்பார்; நீங்கள் அதைச் சாப்பிடுவீர்கள்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாளைக்காக உங்களைப் புனிதப்படுத்திக்கொள்ளுங்கள்.’ எபிரெய வினைச்சொல், யாவேயின் செயலுக்காகத் தங்களைத் தனியே பிரித்து ஆயத்தப்படுத்திக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
