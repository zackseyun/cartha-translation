reference: Numbers 11:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: ta
  text: ஆனால் இப்போது எங்கள் உணவார்வம் வறண்டுபோயிற்று[a]; எங்கள் கண்முன் மன்னாவைத் தவிர வேறொன்றுமே இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் உயிர் வறண்டுபோயிற்று.” எபிரெயச் சொல் נֶפֶשׁ (நெஃபெஷ்) என்பது “உயிர்,” “ஆத்துமா” அல்லது உணவு தொடர்பான சூழல்களில் “உணவார்வம்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய சூழலுடன் உள்ள மாறுபாட்டை இணைப்புச்சொல்லும் காலக் குறிப்பும் சேர்ந்து உணர்த்துவதால், நவீன தமிழில் ‘ஆனால் இப்போது’ இயல்பாக உள்ளது.
- source_word: נַפְשֵׁנוּ
  choice: எங்கள் பசி
  rationale: נֶפֶשׁ என்பதற்கு ‘உயிர்/ஆத்துமா’ என்ற பொருள்கள் இருந்தாலும், உணவுக்கான ஏக்கம் குறித்த இச்சூழலில் அது பசி அல்லது உணவார்வத்தைக் குறிக்கிறது.
- source_word: יְבֵשָׁה
  choice: வற்றிப்போயிற்று
  rationale: வறண்டு, சோர்ந்துபோன நிலையைச் சித்தரிக்கும் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֵין כֹּל
  choice: வேறொன்றுமே இல்லை
  rationale: எதுவும் இல்லை என்ற வலியுறுத்தலை ‘ஒன்றுமே இல்லை’ தெளிவாக வெளிப்படுத்துகிறது; விலக்குப் பொருளுடன் இயல்பாக அமைய ‘வேறு’ சேர்க்கப்பட்டுள்ளது.
- source_word: בִּלְתִּי אֶל
  choice: தவிர
  rationale: ஒரே ஒன்றை மட்டும் விலக்காகக் காட்டும் எபிரெயக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמָּן
  choice: இந்த மன்னா
  rationale: குறிப்பிட்ட, நன்கு அறிந்த மன்னாவை எபிரெயக் குறிப்புச் சுட்டு காட்டுகிறது; புகாரின் அலுப்பான தொனியையும் தமிழில் ‘இந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵינֵינוּ
  choice: எங்கள் கண்முன்
  rationale: அவர்கள் தொடர்ந்து காண்பது மன்னா மட்டுமே என்ற தெளிவான காட்சிப்படிமத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பியல் சார்ந்த பொருள்
  choice: முதன்மை உரையில் ‘பசி’; அடிக்குறிப்பில் ‘உயிர்’ என்ற மாற்று
  alternative: எங்கள் உயிர் வற்றிப்போயிற்று
  rationale: உணவுப் புகார் சூழலில் ‘பசி’ பொருத்தமான பொருள்; அதேவேளை மூலச்சொல்லின் பரந்த பொருளையும் உருவகத் தெளிவின்மையையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பசி வற்றிப்போயிற்று’ என்பது மூலத்தின் உலர்ச்சி உருவகத்தைத் தக்கவைக்கிறது; ‘மன்னா’ பொதுவாக அறியப்பட்ட வேதாகமப் பெயராக வைக்கப்பட்டுள்ளது.
