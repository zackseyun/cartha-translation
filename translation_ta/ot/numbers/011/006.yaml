revisions:
- from: ஆனால் இப்போது எங்கள் பசி வற்றிப்போயிற்று[a]; எங்கள் கண்முன் இந்த மன்னாவைத் தவிர வேறொன்றுமே இல்லை.
  to: ஆனால் இப்போது எங்கள் உணவார்வம் வறண்டுபோயிற்று[a]; எங்கள் கண்முன் மன்னாவைத் தவிர வேறொன்றுமே இல்லை.
  rationale: The revision removes the unsupported demonstrative ‘இந்த.’ It also renders נֶפֶשׁ as ‘உணவார்வம்’ in keeping with the immediate food-complaint context, while retaining the Hebrew image of dryness and preserving the broader ‘உயிர்/ஆத்துமா’ sense in the footnote.
