  text: לֹֽא אוּכַ֤ל אָנֹכִי֙ לְ/בַדִּ֔/י לָ/שֵׂ֖את אֶת כָּל הָ/עָ֣ם הַ/זֶּ֑ה כִּ֥י כָבֵ֖ד מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: ta
  text: இந்த மக்கள் அனைவரையும் நான் ஒருவனாகச் சுமக்க என்னால் முடியாது; ஏனெனில் அவர்கள் எனக்கு மிகுந்த பாரமாக இருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי
  choice: நான்—நான் ஒருவனாக—வல்லவன் அல்ல
  rationale: மோசே தன் இயலாமையை வலியுறுத்தும் אָנֹכִי என்ற தனிப்பட்ட சுட்டுப்பெயரின் அழுத்தத்தையும், அடுத்து வரும் ‘தனியாக’ என்ற கருத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לְבַדִּי
  choice: நான் ஒருவனாக
  rationale: ‘நான் மட்டும்/தனியாக’ என்ற பொருளைத் தெளிவாகக் கூறி, மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்கு
  rationale: மக்களின் பொறுப்பைத் தாங்குதல் என்ற உருவகப் பொருளைக் கொண்ட மூல வினைச்சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: כָבֵד מִמֶּנִּי
  choice: இது எனக்கு மிகவும் பாரமாக இருக்கிறது
  rationale: ‘எனக்கு அளவுக்கு மீறிய பாரம்’ என்ற மூலக் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘மிகவும்’ என்பது சூழலில் உள்ள தாங்க முடியாத கனத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோசேயின் தனிப்பட்ட இயலாமைக்கு வழங்கப்படும் வலியுறுத்தல்
  choice: ‘நான்—நான் ஒருவனாக—’ என்று வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘என்னால் தனியாக’ என்று சுருக்குதல்
  rationale: மூலத்தில் אָנֹכִי மற்றும் לְבַדִּי இணைந்து தரும் வலியுறுத்தலைச் சீராக்காமல் காக்கிறது; இதனால் மோசே தனக்குத் துணை தேவைப்படுவதைச் சொல்வது தெளிவாகிறது, ஆனால் மேலதிக இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. இடைக்கோடுகள் மூலத்தின் ‘நான், நான் ஒருவனாக’ என்ற வலியுறுத்தலை இயல்பாகக் காட்டுகின்றன.
