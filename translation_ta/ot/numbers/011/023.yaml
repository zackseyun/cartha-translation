  source_fidelity: யְהוָה பெயர் ‘யாவே’ எனத் தொடர்ந்து வழங்கப்பட்டுள்ளது. ‘யாவேயின் கை குறுகிவிட்டதா?’ என்பது הֲיַד יְהוָה תִּקְצָר என்ற உருவகக் கேள்வியைத் தக்கவைக்கிறது. ‘இப்போது நீ காண்பாய்’ மற்றும் ‘என் வார்த்தை உனக்கு நிகழுமா இல்லையா’ ஆகியவை עַתָּה תִרְאֶה மற்றும் הֲיִקְרְךָ דְבָרִי אִם־לֹא என்பவற்றின் காலம், வினா அமைப்பு, மற்றும் ‘உனக்கு’ என்ற தொடர்பை நம்பகமாக வெளிப்படுத்துகின்றன.
