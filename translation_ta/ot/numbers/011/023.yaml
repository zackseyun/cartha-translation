source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “யாவேயின் கை குறுகிவிட்டதா?[a] என் வார்த்தை உனக்கு நிகழுமா இல்லையா[b] என்பதை இப்போது நீ காண்பாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் கை குறுகிவிட்டதா?” என்பது “யாவேயின் வல்லமை வரம்புக்குட்பட்டுவிட்டதா?” என்ற பொருளுடைய உருவகம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நான் சொன்னது உனக்கு நடக்குமா இல்லையா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: யாவேயின் கை குறுகிவிட்டதா?
  rationale: இறை வல்லமை வரம்புக்குட்பட்டதா என்று கேட்கும் எபிரெய உருவகத்தை அதன் வலிமையுடன் தக்கவைக்கிறது.
- source_word: עַתָּה תִרְאֶה
  choice: இப்போது நீ காண்பாய்
  rationale: உடனே நிகழவிருக்கும் உறுதிப்படுத்தலைக் குறிக்கும் காலச் சொல்லையும் எதிர்காலப் பொருளையும் நேரடியாகக் காட்டுகிறது.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: என் வார்த்தை உனக்கு நிகழுமா
  rationale: קרה என்பதன் ‘நிகழ்தல்/நேர்தல்’ என்ற பொருளையும், இரண்டாம் நபர் பின்னொட்டு தரும் ‘உனக்கு’ என்பதையும் காக்கிறது; ‘நிறைவேறுமா’ என விளக்கமாக மட்டும் மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: אִם לֹא
  choice: இல்லையா
  rationale: முந்தைய வினாவுடன் இணைந்து ‘நிகழுமா இல்லையா’ என்ற இயல்பான தமிழ் மாற்றுத் தேர்வு வினாவை உருவாக்குகிறது.
theological_decisions:
- issue: இறை வல்லமைக்கான மனித உடல் உருவகம்
  choice: ‘யாவேயின் கை குறுகிவிட்டதா?’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘யாவேயின் வல்லமை குறைந்துவிட்டதா?’
  rationale: மூலத்தின் உயிரோட்டமான உருவகத்தையும் மோசேயின் ஐயத்தை எதிர்கொள்ளும் சொல்லாட்சியின் வலிமையையும் காக்கிறது; அதேவேளை அடிக்குறிப்பு அதன் கருத்தை விளக்குகிறது.
- issue: மோசேயை நோக்கிய இறைச் சவாலின் வலிமை
  choice: வல்லமை வரம்படைந்ததா என்று வினவும் சொல்லாட்சியாக வழங்குதல்
  alternative: ‘யாவேக்கு இது மிகவும் கடினமானதா?’
  rationale: வேறு வேதாகமப் பகுதிகளின் சொற்றொடரை இங்கு கொண்டுவராமல், இவ்வசனத்தின் சொந்த உருவகத்தையும் இறையாற்றல் குறையவில்லை என்ற மறைமுக உறுதிப்பாட்டையும் பாதுகாக்கிறது.
- issue: דְבָרִי என்பதன் நிகழ்தல் அல்லது நிறைவேறுதல்
  choice: ‘என் வார்த்தை உனக்கு நிகழுமா’
  alternative: ‘நான் சொன்னது உனக்கு நிறைவேறுமா’
  rationale: ‘வார்த்தை’ என்ற மூலச் சொல்லையும் ‘உனக்கு நிகழும்’ என்ற இலக்கண அமைப்பையும் வைத்திருந்து, வாக்குறுதி நிறைவேற்றம் என்ற பொருளை மட்டுமே கட்டாயப்படுத்தாமல் உண்மையான சொற்பொருள் பரப்பை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளை கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கை குறுகுதல்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; இறைப்பெயர் ‘யாவே’ என்று ஒலிப்பெயர்க்கப்பட்டுள்ளது.
