source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: ta
  text: அப்போது மக்கள் மோசேயிடம் கூக்குரலிட்டார்கள். மோசே யாவேயிடம் பிரார்த்தனை செய்தார்; நெருப்பு தணிந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்பு அடங்கியது” அல்லது “நெருப்பு குறைந்தது.” எபிரெய வினைச்சொல் நெருப்பு தணிந்து அடங்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: கூக்குரலிட்டார்கள்
  rationale: צעק என்பது துன்பத்திலோ ஆபத்திலோ உதவி நாடி எழுப்பும் அவசரக் குரலைக் குறிக்கிறது. ‘கூக்குரலிட்டார்கள்’ என்பது அதன் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם இங்கு இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל ஒரு நபரை நோக்கிய செயலைக் குறிக்கிறது; இச்சூழலில் ‘மோசேயிடம்’ என்பது இயல்பான தமிழ் நடை.
- source_word: וַיִּתְפַּלֵּל
  choice: வேண்டிக்கொண்டார்
  rationale: התפלל என்பதன் நேரடிப் பொருள் கடவுளிடம் வேண்டுதல் அல்லது பிரார்த்தனை செய்தல். சூழலில் பரிந்துபேசுதல் உட்பொருளாக இருந்தாலும், அதை வெளிப்படையாகச் சேர்க்காமல் ‘வேண்டிக்கொண்டார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, எபிரெயத் தனிப்பெயரான יהוה. அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கத் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַתִּשְׁקַע
  choice: தணிந்தது
  rationale: שקע அடிப்படையில் கீழிறங்குதல் அல்லது அடங்குதல் என்ற கருத்தைத் தருகிறது. நெருப்பைப் பற்றிய இச்சூழலில் அது குறைந்து அடங்கியதை ‘தணிந்தது’ இயல்பாகக் காட்டுகிறது; முற்றிலும் அணைக்கப்பட்டது என்று தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: הָאֵשׁ
  choice: நெருப்பு
  rationale: אשׁ என்பதன் நேரடிப் பொருள் ‘நெருப்பு’; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நெருப்பையே இங்கு குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை יהוה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல், உடன்படிக்கையின் இறைப் பெயர் என்ற தன்மையைப் பாதுகாக்க ‘யாவே’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான நிகழ்வோட்டம் இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நெருப்பு முற்றிலும் அணைந்ததா என்ற அளவைத் தீர்மானிக்காமல் மூலத்தின் பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
