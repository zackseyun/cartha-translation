revisions:
- from: அப்போது மக்கள் மோசேயிடம் கூக்குரலிட்டார்கள். மோசே யாவேயிடம் வேண்டிக்கொண்டார்; நெருப்பு தணிந்தது.[a]
  to: அப்போது மக்கள் மோசேயிடம் கூக்குரலிட்டார்கள். மோசே யாவேயிடம் பிரார்த்தனை செய்தார்; நெருப்பு தணிந்தது.[a]
  rationale: The revision retains the draft’s faithful rendering of the narrative while using the direct, standard Tamil expression for Moses’ prayer and revising the lexical note so that its alternatives are natural Tamil and accurately reflect the fire’s subsiding rather than a physical descent.
  reviewer_model: gpt-5.6-terra
