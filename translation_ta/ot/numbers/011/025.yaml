base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: ta
  text: அப்போது யாவே மேகத்தில் இறங்கி, மோசேயிடம் பேசினார். மோசேயின்மேல் இருந்த ஆவியிலிருந்து சிறிதை எடுத்து, முதியோர்களான எழுபது பேர்மேல் வைத்தார். ஆவி அவர்கள்மேல் தங்கியபோது, அவர்கள் இறைவாக்குரைத்தார்கள்; ஆனால் தொடர்ந்து இறைவாக்குரைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் இறைவாக்குரைப்பதை நிறுத்தவில்லை.” எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால், ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיֵּרֶד
  choice: இறங்கி
  rationale: கீழ்நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய வினையை இயல்பான தமிழில் தருவதோடு, இறைத்தோற்றத்தின் மனித உருவக மொழியையும் தக்கவைக்கிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: குறிப்பிட்ட அந்த இறைப்பிரசன்ன மேகத்தைக் குறிக்கும் சொல்லின் வரையறுத்த தன்மையைச் சூழல் வழியாகத் தக்கவைக்கிறது.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: மோசேயிடம் பேசினார்
  rationale: எபிரெயில் உள்ள ‘அவனிடம்’ என்பதன் சூழல்சார் முன்னிலையான மோசேயைத் தெளிவுபடுத்தி, தமிழில் ஏற்படக்கூடிய சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: மோசேயின்மேல் இருந்த ஆவியிலிருந்து சிறிதை எடுத்து
  rationale: அரிதான אצל வினையின் ‘இருந்து எடுத்து/பகிர்ந்தளித்து’ என்ற பொருளை வெளிப்படுத்துகிறது; ஆவி குறைந்துவிட்டது என்ற தேவையற்ற கருத்தை உருவாக்காமல் ‘சிறிதை’ என்கிறது.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இங்கு தீர்க்கதரிசனச் செயலுக்கு வல்லமையளிக்கும் இறை ஆவியே சூழல்சார் குறிப்பு; தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் சூழலே இதை உணர்த்துகிறது.
- source_word: וַיִּתֵּן עַל
  choice: மேல் வைத்தார்
  rationale: ‘அவர்கள்மேல் கொடுத்தார்/வைத்தார்’ என்ற மூலப்படிமத்தை தெளிவான தமிழில் காக்கிறது.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: முதியோர்களான அந்த எழுபது பேர்மேல்
  rationale: எழுபது நபர்களும் முதியோர்களே என்ற விளக்க உறவை இயல்பான தமிழில் தருகிறது; தேவையற்ற கடினமான சொல்லடுக்கைத் தவிர்க்கிறது.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: ஆவி அவர்கள்மேல் தங்கியபோது
  rationale: נוח על என்பதன் ‘மேல் தங்குதல்’ என்ற உருவகத்தை நேராகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּתְנַבְּאוּ
  choice: இறைவாக்குரைத்தார்கள்
  rationale: நபா வினையின் தீர்க்கதரிசனப் பேச்சு/செயலை சாதாரண வாசகருக்குப் புரியும் தற்போதைய கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא יָסָפוּ
  choice: ஆனால் தொடர்ந்து இறைவாக்குரைக்கவில்லை
  rationale: இச்சுருக்கமான சொற்றொடரின் முதன்மைச் சூழல்சார் புரிதலான, அந்தச் செயல் தொடரவில்லை என்ற பொருளைத் தருகிறது; மாறுபட்ட புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: רוּחַ என்பது இறை ஆவியையா அல்லது பொதுவான ‘ஆவி’யையா குறிக்கிறது
  choice: இறை ஆவியைக் குறிக்கும் ‘ஆவி’
  alternative: பொதுவான ஆவி அல்லது மனப்பாங்கு
  rationale: மோசேயின்மேல் இருந்தது முதியோர்கள்மேல் தங்கி, அவர்கள் இறைவாக்குரைக்கக் காரணமானதாகச் சூழல் கூறுவதால், இறைவனின் வல்லமையளிக்கும் ஆவியே குறிக்கப்படுகிறது. தமிழில் capitalization இல்லாததால் கூடுதல் விளக்கச் சொல் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: וְלֹא יָסָפוּ என்பதன் பொருள்
  choice: அவர்கள் தொடர்ந்து இறைவாக்குரைக்கவில்லை
  alternative: அவர்கள் இறைவாக்குரைப்பதை நிறுத்தவில்லை
  rationale: சொற்றொடர் மிகவும் சுருக்கமானது; ‘மீண்டும்/தொடர்ந்து செய்யவில்லை’ என்ற பொருள் சூழலில் இயல்பாக உள்ளது. இருப்பினும் ‘நிறுத்தவில்லை’ என்ற பழமையான மாற்றுப் புரிதலும் உண்மையான உரைமொழிபெயர்ப்பு சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடைக்கு ஏற்ற, கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘யாவே’ என்ற இறைப்பெயர் பட்டத்தால் மாற்றப்படவில்லை. சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘மோசே’ இருமுறை வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது; உரையின் இறுதி தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
