translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் சமையல் செயல்கள் மூலத்தின் வரிசைப்படியே வைக்கப்பட்டுள்ளன; கடினமான இறுதிச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
