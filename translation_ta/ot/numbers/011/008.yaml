base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: ta
  text: மக்கள் அங்குமிங்கும் சென்று அதைச் சேகரித்து, திரிகையில் அரைத்தோ உரலில் இடித்தோ, பானையில் வேகவைத்து, அடைகளாகச் செய்தார்கள்; அதன் சுவை செழுமையான எண்ணெயின் சுவையைப் போல இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புதிய எண்ணெயின் சுவையைப் போல.” לְשַׁד הַשָּׁמֶן என்ற எபிரெயச் சொற்றொடரின் பொருள் உறுதியாகத் தெரியவில்லை; அது எண்ணெயின் செழுமையான அல்லது புதிய சாரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: அங்குமிங்கும் சென்று
  rationale: இந்த வினை ஓர் இடப்பரப்பில் இங்குமங்கும் செல்வதைக் குறிக்கிறது; மன்னாவைச் சேகரிப்பதற்காக மக்கள் வழக்கமாகச் செய்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָקְטוּ
  choice: சேகரித்து
  rationale: சிதறிக் கிடப்பவற்றை ஒன்றுசேர்த்தல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: திரிகையில் அரைத்தோ
  rationale: רֵחַיִם என்பது கையால் இயக்கப்படும் அரைக்கும் கல் அல்லது திரிகையைக் குறிக்கிறது; ‘திரிகையில் அரைத்தல்’ கருவியையும் செயலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: உரலில் இடித்தோ
  rationale: דכך என்பது நசுக்குதல் அல்லது இடித்தலைக் குறிக்கிறது; מְדֹכָה என்ற இடிக்கும் பாத்திரத்திற்கு இயல்பான தமிழ் இணை ‘உரல்’ ஆகும்.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: பானையில் வேகவைத்து
  rationale: בשל என்பது சமைத்தல் அல்லது வேகவைத்தலைக் குறிக்கலாம்; ‘வேகவைத்து’ என்பது தேவையற்ற சமையல் விவரத்தைச் சேர்க்காமல் பரந்த மூலப்பொருளை இயல்பாகத் தருகிறது.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: அடைகளாகச் செய்தார்கள்
  rationale: עֻגוֹת என்பது தட்டையான அல்லது வட்டமான சுட்ட உணவுப் பொருட்களைக் குறிக்கிறது; ‘அடைகள்’ நவீனத் தமிழருக்கு புரியக்கூடிய உணவு வடிவத்தைக் காட்டுகிறது.
- source_word: טַעְמוֹ
  choice: அதன் சுவை
  rationale: טַעַם என்பதன் நேரடியான, இயல்பான தமிழ் பொருள் ‘சுவை’.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: செழுமையான எண்ணெயின் சுவை
  rationale: לְשַׁד என்பது செழுமை, கொழுமை அல்லது சாறான சாரம் என்ற கடினமான பொருளுடைய சொல்; வாசிப்பிற்கு இயல்பாக இருக்கும்படி எண்ணெயின் செழுமையைக் காட்டும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
