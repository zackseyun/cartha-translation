  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இரு இணையான சொல்லாட்சிசார் வினாக்களும் பேணப்பட்டுள்ளன; இரண்டாம் பகுதியில் மூலத்தில் நேரடியாக இல்லாத ‘பிடித்தல்’ என்ற கருத்து சேர்க்கப்படவில்லை.
