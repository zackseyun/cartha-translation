  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: ta
  text: அவர்களுக்காக ஆடுமாடுகளை வெட்டினால், அது அவர்களுக்குப் போதுமா? அல்லது கடலிலுள்ள மீன்கள் அனைத்தையும் அவர்களுக்காகத் திரட்டினால், அது அவர்களுக்குப் போதுமா[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்குக் கிடைக்குமா?” என்பது எபிரெய மொழியின் நேரடியான சொற்றொடர்; இச்சூழலில் அது “அவர்களுக்குப் போதுமா?” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: …போதுமா?
  rationale: எபிரெய விசாரணைத் துகள் மோசேயின் எதிர்பாராத மறுப்புப் பதிலைச் சுட்டும் வினாவை அறிமுகப்படுத்துகிறது; தமிழில் வாக்கிய இறுதி வினாவடிவம் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: இணைச்சொல் சிறிய கால்நடைகளையும் மாடுகளையும் குறிக்கிறது. ‘ஆடுமாடுகள்’ என்பது பொதுமக்களுக்கு இயல்பாகப் புரியும் சுருக்கமான தமிழ் வழக்கு.
- source_word: יִשָּׁחֵט
  choice: வெட்டினால்
  rationale: שׁחט என்பதன் நிஃபால் வடிவம் உணவுக்காக விலங்குகளை அறுப்பதைக் குறிக்கிறது. தமிழில் கால்நடைச் சூழலில் ‘வெட்டுதல்’ இயல்பானது; நிபந்தனை வடிவம் சொல்லாட்சியின் கற்பனை வினாவைத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: இங்கு மக்களுக்கான உணவு ஏற்பாட்டைச் சுட்டுவதால் பயனாளிப் பொருளை ‘அவர்களுக்காக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּמָצָא לָהֶם
  choice: அது அவர்களுக்குப் போதுமா
  rationale: מצא இங்கு ‘கிடைத்தல்’ என்ற நேரடிப் பொருளில் அல்லாமல், போதுமானதாக இருத்தல் என்ற மரபுத்தொடர்ப் பொருளில் வருகிறது. இயல்பான தமிழில் அதைப் ‘போதுமா’ என அளிக்கிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இரண்டாவது சொல்லாட்சிசார் மாற்றுவாய்ப்பை அறிமுகப்படுத்தும் பிரிவுணர்வை ‘அல்லது’ இயல்பாகக் காட்டுகிறது; தமிழ் நிபந்தனை வினைமுற்று ‘if’ உணர்வையும் தாங்குகிறது.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: கடலிலுள்ள மீன்கள் அனைத்தையும்
  rationale: ‘அனைத்தையும்’ என்பது כָּל என்பதன் முழுமைப்படுத்தும் வலிமையைப் பேணுகிறது; ‘கடலிலுள்ள மீன்கள்’ நவீனத் தமிழில் இயல்பானது.
- source_word: יֵאָסֵף
  choice: திரட்டினால்
  rationale: אסף என்பதன் நிஃபால் வடிவம் ஒன்றுசேர்க்கப்படுதல் அல்லது திரட்டப்படுதலைக் குறிக்கிறது. ‘பிடித்தால்’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் ‘திரட்டினால்’ பரந்த பொருளைப் பேணுகிறது.
