  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: ta
  text: மோசே வெளியே சென்று, யாவேயின் வார்த்தைகளை மக்களிடம் சொன்னார். பின்பு அவர் மக்களின் மூப்பர்களில் இருந்து எழுபது ஆண்களைக் கூட்டி, கூடாரத்தைச் சுற்றிலும்[b] அவர்களை நிற்க வைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை ஒரு இடத்தில் வைத்தார்’ அல்லது ‘அவர்களை நிறுத்தினார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சொல்லுக்குச் சொல் ‘அவர்களை நிற்கச் செய்தார்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘கூடாரம்’ என்று உள்ளது; சூழலில் இது சந்திப்புக் கூடாரத்தைக் குறிக்க வாய்ப்புள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்று
  rationale: יצא என்ற வினை முந்தைய இடத்திலிருந்து வெளியே செல்வதைக் குறிக்கிறது. ‘வெளியே சென்று’ என்பது இயல்பான நவீனத் தமிழ் நடையாகவும் எபிரெயக் கதையோட்டத்தைத் தெளிவாகவும் தருகிறது.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: யாவே கூறிய வார்த்தைகளை மக்களிடம் சொன்னார்
  rationale: דבר אֶל என்பது மக்களிடம் பேசுவதைக் குறிக்கிறது; דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற பன்மை வடிவமும் காக்கப்பட்டுள்ளது. தமிழில் இயல்பாக இருக்க ‘யாவே கூறிய வார்த்தைகள்’ என்று தொடர்பு தெளிவாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதாகமத்தில் வரும் இறைநாமம். அதன் பரவலான ஒலிபெயர்ப்பை நவீனத் தமிழில் ‘யாவே’ என்று வழங்குவது தனிப்பெயர்த் தன்மையைக் காக்கிறது.
- source_word: וַיֶּאֱסֹף
  choice: கூட்டி
  rationale: אסף என்பது இச்சூழலில் மக்களை ஒன்றாகக் கூட்டுவதைக் குறிக்கிறது. ‘கூட்டி’ என்பது சுருக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: שִׁבְעִים אִישׁ
  choice: எழுபது ஆண்கள்
  rationale: எண்ணுக்குப் பின் ஒருமையில் வரும் אִישׁ இங்கு கூட்டாக ‘ஆண்கள்’ எனப் பொருள்படுகிறது. மூப்பர்களிலிருந்து தேர்ந்தெடுக்கப்பட்ட ஆண்களைத் துல்லியமாகக் குறிக்க பாலினம் காக்கப்பட்டுள்ளது.
- source_word: מִזִּקְנֵי הָעָם
  choice: மக்களின் மூப்பர்களிலிருந்து
  rationale: זִקְנֵי என்பது வயது முதிர்ந்தவர்களை மட்டும் அல்லாமல் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கிறது. מן என்பதன் பகுதியிலிருந்து தேர்வு செய்யும் பொருளை ‘மூப்பர்களிலிருந்து’ காக்கிறது.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: அவர்களை நிறுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தார்’ அல்லது ‘ஒரு இடத்தில் நிறுத்தினார்’ என்ற காரணவினைப் பொருள் தருகிறது. ‘நிறுத்தினார்’ தமிழில் இயல்பாக இருந்து அப்பொருளைக் காக்கிறது.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: கூடாரத்தைச் சுற்றிலும்
  rationale: סְבִיבֹת என்பது ‘சுற்றிலும்’; הָאֹהֶל என்பது சொல்லுக்குச் சொல் ‘அந்தக் கூடாரம்/கூடாரம்.’ மூலத்தில் ‘சந்திப்புக் கூடாரம்’ என்ற முழுச் சொற்றொடர் இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயருக்குப் பதிலாக நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமம் நேரடியாக வருகிறது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- issue: שִׁבְעִים אִישׁ என்பதில் பாலினத்தைக் காட்டுதல்
  choice: எழுபது ஆண்கள்
  alternative: எழுபது பேர்
  rationale: אִישׁ இலக்கணத்திலும் பொருளிலும் ஆண்பாலைக் குறிக்கிறது; இச்சூழலில் மூப்பர்களாகிய ஆண்களே சுட்டப்படுகின்றனர். ஆகவே பாலின வேறுபாட்டை மறைக்காத வாசகம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: הָאֹהֶל என்பதன் சூழல்சார் அடையாளம்
  choice: கூடாரம்
  alternative: சந்திப்புக் கூடாரம்
  rationale: சூழல் சந்திப்புக் கூடாரத்தைக் குறிக்க வாய்ப்புள்ளது; ஆனால் இவ்வசனத்தின் எபிரெய உரையில் ‘சந்திப்பு’ என்ற விளக்கம் இல்லை. எனவே முதன்மை உரை குறுகிய மூலவடிவத்தைக் காக்கிறது; சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மூப்பர்கள்,’ ‘யாவே’ போன்ற மூலத்தின் முக்கியச் சொற்கள் காக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
