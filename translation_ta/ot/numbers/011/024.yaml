revisions:
- from: மோசே வெளியே சென்று, யாவே கூறிய வார்த்தைகளை மக்களிடம் சொன்னார். பின்பு அவர் மக்களின் மூப்பர்களிலிருந்து எழுபது ஆண்களைக் கூட்டி, கூடாரத்தைச்[b] சுற்றிலும் அவர்களை நிறுத்தினார்[a].
  to: மோசே வெளியே சென்று, யாவேயின் வார்த்தைகளை மக்களிடம் சொன்னார். பின்பு அவர் மக்களின் மூப்பர்களில் இருந்து எழுபது ஆண்களைக் கூட்டி, கூடாரத்தைச் சுற்றிலும்[b] அவர்களை நிற்க வைத்தார்[a].
  rationale: The revision removes the added implication that Yahweh specifically “said” the words and instead follows the Hebrew genitive expression, “the words of Yahweh.” It also makes the causative sense of וַיַּעֲמֵד explicit in idiomatic Tamil, slightly improves the partitive phrasing, and relocates the footnote marker for readable Tamil typography. The source’s limited designation “the tent” and the contextual footnote are retained.
