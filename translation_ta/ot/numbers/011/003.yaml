id: NUM.11.3
reference: Numbers 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: ta
  text: அதனால் அவர் அந்த இடத்துக்குத் தபேரா[a] என்று பெயரிட்டார்; ஏனெனில் யாவேவின் நெருப்பு அவர்கள் நடுவில் எரிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தபேரா” என்ற பெயர் எபிரெய மொழியில் “எரிதல்” என்ற சொல்லுடன் ஒத்தொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: அவர் அந்த இடத்துக்குத் ... என்று பெயரிட்டார்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தெளிவாக வழங்குகிறது; செய்பவரை மூலத்தைப் போல ஆண்பால் ஒருமையில் வைத்திருக்கிறது.
- source_word: תַּבְעֵרָה
  choice: தபேரா
  rationale: இடப்பெயரை ஒலிபெயர்த்து, அதற்கும் ‘எரிதல்’ என்பதற்கும் உள்ள சொல் தொடர்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இடத்துக்கு அந்தப் பெயர் இடப்பட்டதற்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָעֲרָה
  choice: எரிந்தது
  rationale: בער என்ற வினையின் நேரடியான பொருளைத் தருவதோடு தபேரா என்ற பெயருடனான சொல் தொடர்பையும் தக்கவைக்கிறது.
- source_word: בָם
  choice: அவர்கள் நடுவில்
  rationale: நெருப்பு அந்த மக்களிடையே அல்லது அவர்களுடைய பாளயத்துக்குள் எரிந்தது என்ற சூழல்சார் பொருளை இயல்பாகக் காட்டுகிறது; ‘அவர்களுக்குள்’ என்ற தவறான உட்புறப் பொருளைத் தவிர்க்கிறது.
- source_word: אֵשׁ יְהוָה
  choice: யாவேவின் நெருப்பு
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகப் பிரதிபலித்து, நெருப்புக்கும் யாவேவுக்கும் உள்ள தொடர்பை மூலத்தில் உள்ளபடியே வைத்திருக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אֵשׁ יְהוָה என்பதில் உறவின் தன்மை
  choice: யாவேவின் நெருப்பு
  alternative: யாவே அனுப்பிய நெருப்பு
  rationale: மூலத்தின் இணைப்புத் தொடர் நெருப்பின் தோற்றம், உடைமை அல்லது தெய்வீகத் தொடர்பைத் துல்லியமாகப் பிரித்துரைக்கவில்லை; ஆகவே விளக்கத்தைச் சேர்க்காமல் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெயரிட்டார்’ என்பது எபிரெயப் பெயரிடும் மரபுத்தொடரின் செயல்பாட்டைத் தெளிவாகத் தருகிறது; ‘அவர்கள் நடுவில்’ என்பது சூழலுக்கு ஏற்ற இடப்பொருளை வழங்குகிறது.
