base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: ta
  text: மக்கள் தங்கள் குலங்களின்படி[a], ஒவ்வொருவனும் தன் கூடாரத்தின் வாசலில் அழுதுகொண்டிருப்பதை மோசே கேட்டார். யாவேயின் கோபம் மிகவும் மூண்டது; அது மோசேயின் பார்வையில் தீமையாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் குடும்பங்களின்படி.’ இதற்கான எபிரெயச் சொல் குடும்பங்களையோ குலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘அது மோசேக்கு விருப்பமில்லாததாக இருந்தது.’ சொல்லுக்குச் சொல்: ‘அது மோசேயின் பார்வையில் தீமையாக இருந்தது.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்
  rationale: שׁמע இங்கு மக்களின் அழுகையை மோசே செவியுற்றதைச் சொல்கிறது; கவனமாகச் செவிசாய்த்தார் என்ற கூடுதல் பொருள் தேவையில்லை.
- source_word: הָעָם בֹּכֶה
  choice: மக்கள் … அழுதுகொண்டிருப்பதை
  rationale: בֹּכֶה என்னும் நிகழ்காலப் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த அழுகையைச் சுட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: தங்கள் குலங்களின்படி
  rationale: מִשְׁפָּחָה குடும்பத்தையோ விரிவான உறவுக் குழுவான குலத்தையோ குறிக்கலாம். முகாமில் குழுக்களாக இருந்த சூழலில் ‘குலங்கள்’ சமூக அமைப்பைத் தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: ஆண்பால் ஒருமைச் சொல்லான אִישׁ இங்கு பகிர்வுப் பொருளில் ஒவ்வொரு தனிநபரையும் குறிக்கிறது. ‘ஒவ்வொருவனும்’ அதன் இலக்கணப் பாலையும் பகிர்வுத்தன்மையையும் காக்கிறது.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: தன் கூடாரத்தின் வாசலில்
  rationale: פֶּתַח கூடாரத்தின் திறப்பு அல்லது நுழைவிடத்தைக் குறிக்கிறது. ‘வாசலில்’ என்பது இடக்காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: யாவேயின் கோபம் மிகவும் மூண்டது
  rationale: חרה אף என்பதிலுள்ள எரியும் கோபம் என்ற எபிரெய உருவகத்தை ‘கோபம் மூண்டது’ காக்கிறது; מְאֹד என்பதன் தீவிரத்தை ‘மிகவும்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். ‘யாவே’ என்பது Yahweh என்பதற்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: அது மோசேயின் கண்களுக்குத் தீமையாக இருந்தது
  rationale: ‘மோசேயின் கண்களில் தீமையாக இருந்தது’ என்ற எபிரெய சொற்றொடரின் மதிப்பீட்டு வலிமையையும், ‘அது’ எதைக் குறிக்கிறது என்ற மறைமுகத்தன்மையையும் இந்த வடிவம் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயர் நேரடியாக வருகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: וּבְעֵינֵי מֹשֶׁה רָע என்பதன் மதிப்பீட்டுப் பொருள்
  choice: அது மோசேயின் கண்களுக்குத் தீமையாக இருந்தது
  alternative: அது மோசேக்கு மனவருத்தமளித்தது
  rationale: ‘மனவருத்தமளித்தது’ என்பது இயல்பான விளக்கமாக இருந்தாலும், רָע என்பதன் ‘தீமை/கேடு’ என்ற வலிமையையும் எது தீமையாக இருந்தது என்ற மூலத்தின் தெளிவின்மையையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கோபம் மூண்டது’ போன்ற இயல்பான தமிழ் உருவகம் எபிரெயப் படிமத்தையும் காக்கிறது. இறுதிக் கூறு சற்றே அசாதாரணமாகத் தோன்றினாலும், மூலத்தின் மதிப்பீட்டு வலிமை மற்றும் சுட்டுப்பொருள் தெளிவின்மையைப் பாதுகாக்க நோக்கத்துடன் நேரடியாக வைக்கப்பட்டுள்ளது.
