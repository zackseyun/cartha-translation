source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: ta
  text: ஆனால் மோசே, “நான் நடுவில் இருக்கும் மக்கள், கால்நடையாகச் செல்லும் ஆறு இலட்சம் பேர்[a]. அப்படியிருக்க, ‘நான் அவர்களுக்கு இறைச்சி கொடுப்பேன்; அவர்கள் ஒரு மாதம் முழுவதும்[b] சாப்பிடுவார்கள்’ என்று நீர் சொல்லியிருக்கிறீரே!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை ‘கால்நடையாகச் செல்லும் ஆறு இலட்சம் ஆண்கள்’ அல்லது ‘ஆறு இலட்சம் காலாட்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘நாட்களைக் கொண்ட ஒரு மாதம்’; இது ஒரு முழு மாதத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் மோசே ... என்றார்
  rationale: தொடர்ச்சியைக் குறிக்கும் வாவ் இங்கு முந்தைய இறைவாக்குக்கு மோசே முன்வைக்கும் மறுப்புணர்வுள்ள பதிலை அறிமுகப்படுத்துகிறது; எனவே இயல்பான தமிழில் ‘ஆனால்’ பொருத்தமானது.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: ஆறு இலட்சம் பேர்
  rationale: எண்ணை நேரடியாகவும், தமிழில் வழக்கமான எண்ணுமுறையிலும் தருகிறது.
- source_word: רַגְלִי הָעָם
  choice: இந்த மக்களில் கால்நடையாகச் செல்பவர்களே
  rationale: רַגְלִי என்பதன் ‘கால்/கால்நடை’ சார்ந்த பொருளைத் தக்கவைத்து, அதைத் தவறாகக் கட்டாயமாக இராணுவ ‘காலாட்படையினர்’ எனக் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: நான் நடுவில் இருக்கிற இந்த மக்கள்
  rationale: בקרבו என்பதன் ‘அவர்களின் நடுவில்’ என்ற இடப்பொருளையும் மோசேயின் வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: அப்படியிருக்க ... என்று நீர் சொல்லியிருக்கிறீரே
  rationale: வெளிப்படையாக வரும் ‘நீர்’ என்பதின் எதிர்மறை வலியுறுத்தலையும், இப்போதும் பொருந்தும் அண்மைய கூற்றின்மீது மோசே காட்டும் வியப்பையும் எதிர்ப்பையும் வெளிப்படுத்துகிறது.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: இச்சூழலில் உணவாக உண்ணப்படும் விலங்கு மாமிசத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אֶתֵּן לָהֶם
  choice: நான் அவர்களுக்கு இறைச்சி கொடுப்பேன்
  rationale: முதல் நபர் எதிர்கால வாக்கை நேரடியாகத் தருகிறது.
- source_word: וְאָכְלוּ
  choice: அவர்கள் ... சாப்பிடுவார்கள்
  rationale: முந்தைய வாக்குடன் இணைந்த எதிர்கால விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֹדֶשׁ יָמִים
  choice: ஒரு மாதம் முழுவதும்
  rationale: சொல்லுக்கு சொல் ‘நாட்களைக் கொண்ட ஒரு மாதம்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான முழு மாதத்தையும் தெளிவான, இயல்பான தமிழில் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: רַגְלִי என்பதன் மக்கள் தொகை அல்லது இராணுவப் பொருள்
  choice: கால்நடையாகச் செல்பவர்கள்
  alternative: காலாட்படை வீரர்கள் / கால்நடையாகச் செல்லும் ஆண்கள்
  rationale: மூலம் ‘கால்’ சார்ந்தவர்களைச் சொன்னாலும் இங்கு இராணுவ அடையாளத்தையோ ஆண்களை மட்டுமோ கட்டாயப்படுத்தவில்லை. முதன்மை உரை அந்தப் பரந்த தன்மையைப் பாதுகாக்கிறது; சாத்தியமான குறுகிய வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மோசேயின் வியப்பும் எதிர்ப்பும் ‘அப்படியிருக்க’ மற்றும் ‘சொல்லியிருக்கிறீரே’ என்பவற்றால் வெளிப்படுகின்றன; மூலத்தில் உள்ள எண்ணியல் வலிமையும் ரַגְלִי என்ற சொல்லின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
