  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: ta
  text: ஆனால் மோசே அவனிடம், “எனக்காக நீ பொறாமைப்படுகிறாயா?[a] யாவேயின் மக்கள் அனைவரும் இறைவாக்கினர்களாக இருந்தால் எவ்வளவு நன்றாயிருக்கும்! யாவே தமது ஆவியை அவர்கள் மேல் வைப்பாராக![b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொறாமைப்படுகிறாயா?’ என்பதற்கு ‘என் சார்பாக ஆர்வம் காட்டுகிறாயா?’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘யாவே தமது ஆவியை அவர்கள் மேல் வைப்பாராக’ என்ற பொருளுடைய சொற்றொடர்; இறைவாக்குரைக்க அவர்களை ஆற்றல்படுத்துவதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: எனக்காக நீ பொறாமைப்படுகிறாயா?
  rationale: קנא இச்சூழலில் மோசேயின் நலனைப் பாதுகாக்கும் நோக்கில் யோசுவா காட்டிய பொறாமை கலந்த பற்றைக் குறிக்கிறது. ‘எனக்காக’ என்பது לִי என்பதன் தனிப்பட்ட நோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִי יִתֵּן
  choice: எவ்வளவு நன்றாயிருக்கும்!
  rationale: இது ‘யார் கொடுப்பார்?’ என்ற நேரடி வினா அல்ல; தீவிரமான விருப்பத்தை வெளிப்படுத்தும் எபிரேய மரபுத்தொடர். தமிழில் விருப்பத் தொனியை இயல்பாகக் காட்டுகிறது.
- source_word: כָּל עַם יְהוָה
  choice: யாவேயின் மக்கள் அனைவரும்
  rationale: யாவேக்கு உரிய முழு மக்களையும் குறிக்கும் இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: נְבִיאִים
  choice: இறைவாக்கினர்கள்
  rationale: இறைவனிடமிருந்து செய்தி பெற்று உரைப்பவர்களைக் குறிக்கும் பெயர்ச்சொல்; நவீனத் தமிழில் புரிந்துகொள்ளக்கூடியதும் மூலத்தின் பெயர்ச்சொல் வடிவைப் பேணுவதுமாகும்.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: யாவே தமது ஆவியை அவர்கள்மேல் வைத்தால்
  rationale: மோசேயின் விருப்பத்தின் உள்ளடக்கத்தைத் தொடர்ந்து வெளிப்படுத்துவதோடு, ஆவி ‘அவர்கள்மேல்’ வைக்கப்படும் என்ற எபிரேய உருவகத்தையும் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான יהוה என்பதன் தமிழ்ச் சீரொலிப்பாகத் தனிப்பெயரைப் பேணுகிறது; ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றவில்லை.
- source_word: רוּחוֹ
  choice: தமது ஆவி
  rationale: சூழல் இறைவாக்குரைக்கும் ஆற்றலை யாவே அளிப்பதைப் பற்றியது; ஆகவே காற்று அல்லது மூச்சு என்பதற்குப் பதிலாக இறை ஆவியைக் குறிக்கும் ‘ஆவி’ பொருத்தமானது. மரியாதை ஒருமையைத் தமிழில் இயல்பாகக் காட்ட ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: רוּחוֹ என்பதன் பொருள்
  choice: தமது ஆவி
  alternative: தமது மூச்சு / தமது காற்று
  rationale: உடனடிச் சூழல் இறைவாக்குரைத்தலை அருளும் இறை வல்லமையைப் பற்றியதால் ‘ஆவி’ என்பதே பொருத்தம்; ஆவி அவர்கள்மேல் வைக்கப்படுதல் என்ற மூல உருவகம் தீர்க்கப்படாமல் பேணப்பட்டுள்ளது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் தமிழ்ச் சீரொலிப்பில் வழங்குகிறது.
- issue: மக்கள் அனைவரும் இறைவாக்கினர்களாக வேண்டும் என்ற மோசேயின் விருப்பம்
  choice: வரம்பிடாமல் நேரடியாகப் பேணப்பட்டது
  alternative: சிலருக்கு மட்டுமே இறைவாக்குரைக்கும் வரம் கிடைக்கும் என விளக்கிச் சுருக்குதல்
  rationale: மூலவசனம் வெளிப்படுத்தும் விரிவான விருப்பத்தையும் அதன் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு தானாகக் கட்டுப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன, பொதுத்தரத் தமிழில் கண்ணியமான நேரடி உரை. ‘இறைவாக்கினர்கள்’ என்பது மரபான ‘தீர்க்கதரிசிகள்’ என்பதைக் காட்டிலும் உடனடியாகப் பொருள் விளங்கும் சொல். மோசேயின் வினாவும் தீவிர விருப்பமும் இயல்பான பேச்சுத் தொனியுடன் பேணப்பட்டுள்ளன.
