base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: ta
  text: இரவில் பனி முகாமின்மேல் இறங்கியபோது[a], மன்னாவும் அதன்மேல் இறங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரவில் பனி முகாமின்மேல் இறங்கும்போது, மன்னா அதன்மேல் இறங்கும்.’ பனிக்கும் மன்னாவுக்கும் எபிரெய மொழியில் ஒரே வினைச்சொல் (‘இறங்கு’) பயன்படுத்தப்பட்டு, இரண்டும் இணையாக வலியுறுத்தப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: இறங்கியபோது
  rationale: வாவ் இணைப்பும் בְּ முன்னொட்டுடன் வந்த ירד வினையின் infinitive construct வடிவமும் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகின்றன. நவீனத் தமிழில் இயல்பாக ‘இறங்கியபோது’ என வழங்கப்படுகிறது.
- source_word: הַטַּל
  choice: பனி
  rationale: இங்கு טַל என்பது இரவில் படியும் பனித்துளி அல்லது பனிப்படலத்தைக் குறிக்கிறது; தமிழில் வழக்கமான வேதாகம மற்றும் பொதுப் பயன்பாட்டுக்கு ‘பனி’ இயல்பானது.
- source_word: עַל הַמַּחֲנֶה
  choice: முகாமின்மேல்
  rationale: עַל என்பதன் ‘மேல்/மீது’ என்ற இடப்பொருளைத் துல்லியமாகக் காக்கிறது; பனி முகாமின்மேல் படியும் காட்சிக்கும் பொருந்துகிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாடு; நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יֵרֵד
  choice: இறங்கியது
  rationale: கதைச் சூழலில் வழக்கமாக நிகழ்ந்த கடந்தகாலச் செயலைக் குறிக்கும் imperfect வடிவம். முந்தைய ירד என்பதுடனான சொல் ஒற்றுமையைத் தமிழிலும் காக்க ‘இறங்கு’ என்பதே மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: הַמָּן
  choice: மன்னா
  rationale: அறியப்பட்ட அதிசய உணவைக் குறிக்கும் பெயர்; தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: எபிரெய 3ஆம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பின்னொட்டை மிகைப்படுத்தாமல் காக்கிறது. இது இலக்கணப்படி முகாமைச் சுட்டுகிறது; பனியுடனான தொடர்பை உரை வெளிப்படையாக நிர்ணயிக்கவில்லை.
