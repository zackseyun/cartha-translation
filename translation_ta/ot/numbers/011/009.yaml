translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்தில் பனியும் மன்னாவும் ‘இறங்குகின்றன’ என்ற இணை அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது. ‘அதன்மேல்’ என்னும் சுட்டுப்பெயர் மூலத்தின் சுட்டலைத் தெளிவாக்காமல் அப்படியே பேணுகிறது.
