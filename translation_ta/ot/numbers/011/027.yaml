  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: ta
  text: அப்போது ஒரு இளைஞன்[a] ஓடி, மோசேயிடம் அறிவித்து, “எல்தாதும் மேதாதும் முகாமில் இறைவாக்குரைத்துக்கொண்டிருக்கிறார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த இளைஞன் ஓடி, மோசேயிடம் அறிவித்தான்.” எபிரெயத்தில் ‘இளைஞன்’ என்பதற்கு குறிப்புச் சுட்டு உள்ளது; சூழலுக்கு ஏற்ப ‘அந்த இளைஞன்’ என்றும் மொழிபெயர்க்கலாம். ‘அறிவித்து’ என்பதற்கு ‘தெரிவித்து’ அல்லது ‘சொல்லி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ஓடிவந்து
  rationale: רוץ என்பதன் நேரடியான பொருள் ‘ஓடு’. அடுத்துவரும் அறிவித்தல் செயலுடன் இயல்பான தமிழில் இணைக்க ‘ஓடிவந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַנַּעַר
  choice: ஓர் இளைஞன்
  rationale: נַעַר என்பது சூழலுக்கேற்ப சிறுவன், இளைஞன், அல்லது இளம் மனிதன் எனப் பொருள்படும். பெயர் குறிப்பிடப்படாத செய்தியாளரை நவீன தமிழில் இயல்பாக அறிமுகப்படுத்த ‘ஓர் இளைஞன்’ தேர்ந்தெடுக்கப்பட்டது; எபிரெயக் குறிப்புச் சுட்டின் முறையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּגֵּד ... וַיֹּאמַר
  choice: மோசேயிடம் … என்று சொன்னான்
  rationale: נגד என்பது தெரிவி அல்லது அறிவி என்றும், אמר என்பது சொல் என்றும் பொருள்படும். நேரடிக் கூற்றை இயல்பான தமிழில் அமைக்க இரண்டின் செயல்பாடும் ‘… என்று சொன்னான்’ என்ற கட்டமைப்பில் வழங்கப்படுகிறது; அறிவித்தான் என்ற மாற்று அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: לְמֹשֶׁה
  choice: மோசேயிடம்
  rationale: மோசே என்ற பெயர் வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவில் தரப்பட்டு, לְ முன்னிடைச்சொல் ‘-யிடம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶלְדָּד וּמֵידָד
  choice: எல்தாதும் மேதாதும்
  rationale: தனிப்பட்ட பெயர்கள் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்பை அணுகும் தமிழ்ப் பெயரெழுத்தாக்கத்தில் தரப்பட்டன.
- source_word: מִתְנַבְּאִים
  choice: இறைவாக்குரைத்துக்கொண்டிருக்கிறார்கள்
  rationale: נבא என்பதன் Hitpael நிகழ்காலப் பங்கேற்புவடிவம் தொடர்ந்து நடைபெறும் தீர்க்கதரிசனச் செயல்பாட்டைக் குறிக்கிறது. நவீன தமிழில் தெளிவாகவும் தொடர்நிலையைப் பாதுகாக்கவும் இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: מַחֲנֶה என்பது இஸ்ரவேலரின் பாளையம் அல்லது முகாமைக் குறிக்கிறது. இன்றைய பொதுத்தமிழில் எளிதில் புரியும் ‘முகாம்’ பயன்படுத்தப்பட்டது.
