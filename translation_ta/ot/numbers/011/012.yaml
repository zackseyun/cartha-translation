  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: ta
  text: இந்த மக்கள் அனைவரையும் நான் கருவுற்றேனா? இவர்களை நான் பெற்றெடுத்தேனா? நீர் என்னிடம், ‘ஒரு பராமரிப்பாளர் பால்குடிக்கும் குழந்தையைச் சுமப்பதுபோல், இவர்களை உமது மடியில் சுமந்துகொண்டு, இவர்களுடைய மூதாதையருக்குச் சத்தியம் செய்து வாக்களித்த நாட்டிற்கு அழைத்துச் செல்’ என்று சொல்கிறீரே! [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மக்கள்’ என்பது கூட்டு ஒருமையாகக் கருதப்பட்டு, ‘அவனை’, ‘அவனுடைய மூதாதையர்கள்’ என்ற ஒருமை வடிவங்கள் வருகின்றன. இதனால் மக்கள் ஒரே குழந்தையாகச் சித்தரிக்கப்படுகிறார்கள். தமிழில் இயல்புக்காகப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: நான் கருவுற்றேனா?
  rationale: வலியுறுத்தும் முதலாம் நபருடன் வரும் வினாப்பகுதியை இயல்பான சொல்லாட்சியில் அமைத்து, கர்ப்பந்தரித்தல் என்ற தாய்மை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: நான் இவர்களைப் பெற்றெடுத்தேனா?
  rationale: יָלַד இங்கு பெற்றெடுத்தலைக் குறிக்கிறது. எபிரெயச் சொற்றொடரில் கூட்டு ஒருமை இருந்தாலும், நவீன தமிழில் மக்களைக் குறிக்கும் மரியாதைப் பன்மை இயல்பாக உள்ளது.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: இவர்களை உமது மார்போடு அணைத்துச் சுமந்துகொண்டு
  rationale: חֵיק என்பதன் மார்பு/மடி உருவகத்தையும், נשׂא என்பதன் சுமத்தல் பொருளையும் தெளிவான தமிழில் இணைக்கிறது.
- source_word: הָאֹמֵן
  choice: ஒரு பராமரிப்பாளர்
  rationale: குழந்தையைப் பேணிச் சுமக்கும் நபரைக் குறிக்கும் இச்சொல் பாலினத்தையோ குறிப்பிட்ட தொழிலையோ தேவையின்றி நிர்ணயிக்காதபடி மொழிபெயர்க்கப்பட்டது.
- source_word: הַיֹּנֵק
  choice: பால்குடிக்கும் குழந்தை
  rationale: இன்னும் தாய்ப்பால் குடிக்கும் பருவத்தைக் குறிக்கும் மூலச்சொல்லின் குறிப்பான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நாட்டுக்கு
  rationale: சுமந்துகொண்டு செல்ல வேண்டிய வாக்குத்தத்த இலக்கைச் சூழல் காட்டுவதால், இயக்கத்தைக் குறிக்கும் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: இவர்களுடைய முற்பிதாக்களுக்கு நீர் ஆணையிட்டுக் கொடுத்த
  rationale: שׁבע என்பதன் ஆணையிடுதல் பொருளையும், வாக்குறுதியுடன் நாட்டைக் கொடுப்பதைக் குறிக்கும் சூழலையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேல் மக்களைக் குறிக்கும் கூட்டு ஒருமை
  choice: தமிழில் இயல்பான மரியாதைப் பன்மையான ‘இவர்கள்/இவர்களுடைய’ பயன்படுத்தப்பட்டது
  alternative: மூலத்தின் இலக்கண ஒருமையைப் பின்பற்றி ‘அவனை/அவனுடைய’ என மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் עָם என்ற கூட்டு ஒருமைக்கு ஒருமை பின்னொட்டுகள் வருகின்றன; அது மக்களை ஒரே குழந்தையாகச் சித்தரிக்கிறது. தமிழில் ஒருமை ஆண்பால் சுட்டுப்பெயர் ஒரு தனி ஆணைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும். ஆகவே உருவகத்தின் ஒருமைப்பாட்டை ‘மக்கள் அனைவரும்’ என்ற கூட்டு கருத்தில் காத்து, இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டது; மூல இலக்கண வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: הָאֹמֵן என்பதன் பராமரிப்புப் பங்கு
  choice: பராமரிப்பாளர்
  alternative: செவிலி / வளர்ப்புத் தந்தை
  rationale: இச்சொல் குழந்தையைப் பேணிச் சுமக்கும் நபரைக் குறிக்கலாம்; பாலினம் அல்லது குறிப்பிட்ட பராமரிப்புப் பங்கை மூலத்தைவிடக் குறுகலாக நிர்ணயிக்காமல் இருக்க ‘பராமரிப்பாளர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மோசேயின் வேதனையும் இரட்டை வினாக்களின் வலிமையும் காக்கப்பட்டுள்ளன. ‘நீர்/உமது’ என்ற மரியாதை வடிவங்கள் இறைவனிடம் நேரடியாகப் பேசும் கண்ணியமான நடையை வழங்குகின்றன; தாய்மை மற்றும் குழந்தைப் பராமரிப்பு உருவகங்கள் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
