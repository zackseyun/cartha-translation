  to: இந்த மக்கள் அனைவரையும் நான் கருவுற்றேனா? இவர்களை நான் பெற்றெடுத்தேனா? நீர் என்னிடம், ‘ஒரு பராமரிப்பாளர் பால்குடிக்கும் குழந்தையைச் சுமப்பதுபோல், இவர்களை உமது மடியில் சுமந்துகொண்டு, இவர்களுடைய மூதாதையருக்குச் சத்தியம் செய்து வாக்களித்த நாட்டிற்கு அழைத்துச் செல்’ என்று சொல்கிறீரே! [a]
