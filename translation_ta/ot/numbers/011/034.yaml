  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: ta
  text: எனவே, அவர் அந்த இடத்திற்குக் கிப்ரோத்-ஹத்தாவா[a] என்று பெயரிட்டார்; ஏனெனில் வேட்கைகொண்ட மக்களை அங்கே புதைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிப்ரோத்-ஹத்தாவா” என்பதற்கு “வேட்கையின் கல்லறைகள்” அல்லது “பேராசையின் கல்லறைகள்” என்று பொருள் இருக்கலாம்.
    reason: இடப்பெயரின் சாத்தியமான சொற்பொருளையும் תַּאֲוָה என்பதிலுள்ள ‘வேட்கை/பேராசை’ நுட்பத்தையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: எனவே, அவர் ... பெயரிட்டார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தையும், ஒருமை ஆண்பால் எழுவாயையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயப் பெயரிடும் மரபுத்தொடரைச் சொற்சொல்லாக அல்லாமல் தெளிவாக வழங்குகிறது.
- source_word: אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: அந்த இடத்திற்கு ... என்று பெயரிட்டார்
  rationale: הַהוּא என்பதன் சுட்டுப்பொருளைத் தக்கவைத்து, ‘அந்த இடத்தின் பெயரை அழைத்தார்’ என்ற இயல்பற்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: கிப்ரோத்-ஹத்தாவா
  rationale: இடப்பெயரை மூல எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இடப்பெயர் சூட்டப்பட்டதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எபிரெய வினையடையின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: קָבְרוּ
  choice: புதைத்தார்கள்
  rationale: קבר என்பதன் எளிய பன்மை வினை வடிவை இயல்பான தமிழில் தருகிறது; குறிப்பிடப்படாத பன்மை எழுவாயைச் சேர்த்து விளக்கவில்லை.
- source_word: הָעָם הַמִּתְאַוִּים
  choice: ஆசைப்பட்ட மக்களை
  rationale: התאוה என்பதன் தீவிர விருப்பம் அல்லது வேட்கை என்ற பரப்பைத் தேவையின்றி பாலியல் பொருளாகச் சுருக்காமல் தருகிறது. பெயரெச்சத் தொடரை இயல்பான தமிழ் சார்பு வடிவில் வழங்குகிறது.
