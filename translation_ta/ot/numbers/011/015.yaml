base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: ta
  text: நீர் என்னை இவ்வாறே நடத்தப்போகிறீரானால், தயவுசெய்து என்னை உடனே கொன்றுவிடுங்கள்; உமது கண்களில் எனக்குத் தயவு கிடைத்திருந்தால், என் துயரத்தை நான் காணாதபடி செய்யுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இடரை” அல்லது “என் பேரிடரை.” எபிரேயச் சொல் ஒழுக்கத் தீமையை மட்டுமல்லாது துன்பம், இடர், அல்லது பேரழிவையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: இவ்வாறே ... ஆனால்
  rationale: தொடக்க இணைப்புச் சொல்லைத் தமிழில் தனியே ‘மேலும்’ என்று வழங்காமல், இயல்பான நிபந்தனை வாக்கியமாகக் கொடுக்கிறது.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: நீர் என்னை ... நடத்துவீரானால்
  rationale: ‘எனக்குச் செய்கிறீர்’ என்ற சொல்லுக்குச் சொல் வடிவத்தை விட, மோசேயிடம் கடவுள் நடந்துகொள்ளும் விதத்தைக் குறிக்கும் உறவுசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் எதிர்பாராத பெண்பால் சுட்டுப்பெயர் இருந்தாலும், இங்கு கடவுளை நோக்கிய உரையில் தமிழில் பால்வேறுபாடற்ற மரியாதை வடிவம் பொருத்தமானது.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: தயவுசெய்து என்னை உடனே கொன்றுவிடும்
  rationale: נָא என்பதின் வேண்டுகோள் நயத்தையும், வினையெச்ச முழுவடிவம் மற்றும் கட்டளை வினையின் சேர்க்கையிலுள்ள தீவிர வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது கண்களில் எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: அனுகூலமான பார்வையைப் பெற்றிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கண் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְאַל אֶרְאֶה
  choice: நான் காணவிடாதேயும்
  rationale: கடவுளை நோக்கிய எதிர்மறை வேண்டுகோளை மரியாதையான, இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: בְּרָעָתִי
  choice: என் துயரத்தை
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை மட்டுமல்லாது துன்பம், இடர், பேரிடர் ஆகியவற்றையும் குறிக்கக்கூடும்; சூழலில் மோசேயின் தனிப்பட்ட வேதனை அல்லது அழிவு முன்னிலைப்படுகிறது.
theological_decisions:
- issue: בְּרָעָתִי என்பதன் பொருள்
  choice: என் துயரத்தை
  alternative: என் இடரை / எனக்கு நேரும் கேட்டை / என் தீமையை
  rationale: மக்களைத் தாங்கும் சுமையால் மோசே அடைந்த மனமுறிவே சூழல்; தனிப்பட்ட ஒழுக்கத் தீமையை ஒப்புக்கொள்வதாக உரையை மாற்றாமல், துன்பம் அல்லது பேரிடர் என்ற பொருளைத் தருகிறது. ஆயினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; கடவுளை நோக்கிய உரையில் ‘நீர்/உமது’ மற்றும் வேண்டுகோளுக்கான ‘-யும்’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மோசேயின் கடுமையான மனமுறிவும் வேண்டுகோளின் தீவிரமும் மெலிதாக்கப்படவில்லை.
