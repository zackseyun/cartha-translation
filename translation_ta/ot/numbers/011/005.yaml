  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: ta
  text: எகிப்தில் நாம் விலையின்றிச் சாப்பிட்ட மீன்களையும்,[a] வெள்ளரிக்காய்களையும், முலாம்பழங்களையும், லீக் கீரைகளையும், வெங்காயங்களையும், பூண்டுகளையும் நினைவுகூருகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இலவசமாக,” “செலவில்லாமல்.” அவர்கள் எகிப்தில் உண்மையில் அடிமைகளாக இருந்தபோதிலும், தங்கள் தற்போதைய புகாரின் பார்வையிலிருந்து அங்கிருந்த வாழ்க்கையை நினைவுகூருகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: நினைத்துப் பார்க்கிறோம்
  rationale: Qal perfect 1cp நேரடிப் பேச்சில் இப்போது நினைவுகூருவதை வெளிப்படுத்துகிறது; நவீன தமிழில் இயல்பான நிகழ்காலச் சொல்லாக்கம்.
- source_word: הַדָּגָה
  choice: மீன்களையும்
  rationale: உணவாகிய மீனைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பட்டியலோடு இயல்பாகப் பொருந்தும் பன்மை வடிவம்.
- source_word: אֲשֶׁר נֹאכַל
  choice: நாம் ... சாப்பிட்ட
  rationale: கடந்தகாலத்தில் வழக்கமாக நிகழ்ந்த செயலைக் குறிக்கும் yiqtol; சூழலில் எளிய இறந்தகாலத் தொடர்பெச்சம் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: நேரடியான இடப்பொருள்.
- source_word: חִנָּם
  choice: இலவசமாக
  rationale: பணம் செலுத்தாமல் அல்லது விலையின்றி என்பதே அடிப்படைப் பொருள்; அடிமைத்தனத்தின் முரண்பாட்டை மொழிபெயர்ப்பிலேயே தீர்க்காமல் புகாராளர்களின் பார்வையைப் பாதுகாக்கிறது.
- source_word: הַקִּשֻּׁאִים
  choice: வெள்ளரிக்காய்களையும்
  rationale: இக்காய்க்கான வழக்கமான மற்றும் தெளிவான தமிழ் அடையாளம்.
- source_word: הָאֲבַטִּחִים
  choice: முலாம்பழங்களையும்
  rationale: ஒருவகை melon-ஐக் குறிக்கிறது; குறிப்பிட்ட இனமாக மிகத் துல்லியப்படுத்தாமல் பொதுவான பழப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: הֶחָצִיר
  choice: லீக்ஸ் கீரைகளையும்
  rationale: உணவுப் பட்டியலில் புல் அல்லது வைக்கோல் என்பதைவிட leek எனும் தோட்டக் காய்கறியே பொருத்தமான பாரம்பரிய அடையாளம்; தமிழ்வாசகருக்குத் தெளிவாக 'கீரை' சேர்க்கப்பட்டது.
- source_word: הַבְּצָלִים
  choice: வெங்காயங்களையும்
  rationale: சொல்லின் வழக்கமான பொருள்.
- source_word: הַשּׁוּמִים
  choice: பூண்டுகளையும்
  rationale: சொல்லின் வழக்கமான பொருள்.
theological_decisions:
- issue: எகிப்திய அடிமைத்தனத்தின் பின்னணியில் חִנָּם என்பதன் பொருள்
  choice: இலவசமாக
  alternative: விலையின்றி / செலவில்லாமல்
  rationale: இது எகிப்தின் அடிமைத்தனத்தைப் பற்றிய உண்மையான மதிப்பீடு அல்ல; மக்களின் புகார் அவர்களுடைய பார்வையிலிருந்து அப்படியே தெரிவிக்கப்படுகிறது. இதனால் உரையிலுள்ள முரணும் ஏளனத் தொனியும் விளக்கமாகத் தீர்க்கப்படாமல் நிலைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. பட்டியலின் எபிரேய இணைப்பு அமைப்பு தமிழின் தொடர்ச்சியான ‘-ஐயும்’ வடிவில் பாதுகாக்கப்பட்டுள்ளது; அறிமுகமில்லாத ‘லீக்ஸ்’ என்பதற்கு விளக்கமாக ‘கீரைகள்’ சேர்க்கப்பட்டுள்ளது.
