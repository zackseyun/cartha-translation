- from: எகிப்தில் நாம் இலவசமாகச் சாப்பிட்ட மீன்களையும்,[a] வெள்ளரிக்காய்களையும், முலாம்பழங்களையும், லீக்ஸ் கீரைகளையும், வெங்காயங்களையும், பூண்டுகளையும் நினைத்துப் பார்க்கிறோம்.
