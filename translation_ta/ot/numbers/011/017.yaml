  rationale: இறுதிக் கூறு மூலத்தின் நேரடியான எதிர்கால மறுப்பைத் தக்கவைக்க ‘நீ அதைத் தனியாகச் சுமக்கமாட்டாய்’ என மாற்றப்பட்டது. தொடக்கத்தில் ‘வந்து’ நீக்கப்பட்டு, இறங்குதல் மற்றும் அங்கே பேசுதல் என்ற எபிரெய இணை அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டது. மற்ற சொல்லாட்சிகளும் அடிக்குறிப்பும் மூலத்திற்கும் ஆங்கில POB ஆய்வுப் பதிவிற்கும் ஏற்றவையாக இருப்பதால் மாற்றப்படவில்லை.
