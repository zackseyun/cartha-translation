  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: ta
  text: நான் இறங்கி, அங்கே உன்னோடு பேசுவேன். உன்மேல் இருக்கும் ஆவியிலிருந்து[a] எடுத்து அவர்கள்மேல் வைப்பேன். அவர்கள் உன்னோடு சேர்ந்து மக்களின் சுமையைச் சுமப்பார்கள்; நீ அதைத் தனியாகச் சுமக்கமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவி” என்பதற்கான எபிரெயச் சொல் காற்று, மூச்சு என்றும் பொருள்படலாம்; இங்கே அது மோசே தலைமைப் பொறுப்பை நிறைவேற்றுவதற்கு வல்லமையளிக்கும் தெய்வீக ஆவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: நான் இறங்கி வந்து
  rationale: ירד என்பதன் அடிப்படைப் பொருளான ‘இறங்குதல்’ என்பதையும், தமிழில் பேசுபவரின் நோக்குநிலைக்கு ஏற்ற ‘வந்து’ என்பதையும் இணைத்து, தேவனை மனிதர்போல் வர்ணிக்கும் மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: அங்கே உன்னோடு பேசுவேன்
  rationale: עם உடன் வரும் דבר பரஸ்பரத் தொடர்பைக் குறிக்கும் ‘உன்னோடு பேசுவேன்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது; שָׁם என்பதன் இடக்குறிப்பும் தக்கவைக்கப்பட்டது.
- source_word: וְאָצַלְתִּי מִן הָרוּחַ
  choice: ஆவியிலிருந்து எடுத்து
  rationale: அரிதான אצל இங்கு மோசேயின்மேல் இருப்பதிலிருந்து எடுத்து மூப்பர்கள்மேல் வைக்கும் மாற்றத்தைக் குறிக்கிறது. எவ்வளவு எடுக்கப்படுகிறது என்ற அளவைச் சேர்க்காமலும், மோசே இழந்துவிடுகிறார் என்று தீர்மானிக்காமலும் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: உன்மேல் இருக்கும் ஆவி
  rationale: רוּחַ என்பதற்கு ஆவி, காற்று, மூச்சு ஆகிய பொருள்கள் உண்டு; இச்சூழலில் தலைமைப் பணிக்காக அளிக்கப்படும் தெய்வீக வல்லமையூட்டும் ஆவியைக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்ற பின்னைய தொழில்நுட்பப் பெயரைச் சேர்க்கவில்லை.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: அவர்கள்மேல் வைப்பேன்
  rationale: שׂים மற்றும் עַל ஆகியவற்றின் எளிய ‘மேல் வைப்பது’ என்ற உருவகத்தை இயல்பான தமிழில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: அவர்கள் உன்னோடு சேர்ந்து மக்களின் சுமையைச் சுமப்பார்கள்
  rationale: נשא மற்றும் מַשָּׂא இடையிலான ‘சுமையைச் சுமத்தல்’ என்ற சொல் தொடர்பைப் பாதுகாத்து, மக்களை வழிநடத்தும் பொறுப்பு பகிரப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: அப்போது நீ அதைத் தனியாகச் சுமக்க வேண்டியிருக்காது
  rationale: முந்தைய ஏற்பாட்டின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட சுமையைக் குறிக்கிறது; לְבַדֶּךָ என்பதன் வலியுறுத்தலை ‘தனியாக’ தக்கவைக்கிறது.
theological_decisions:
- issue: רוּחַ என்பது தெய்வீக ஆவியையா மனித மனப்பாங்கையா குறிக்கிறது?
  choice: ஆவி
  alternative: மனப்பாங்கு அல்லது ஆற்றல்
  rationale: உடனடிச் சூழலில், குறிப்பாக எண்ணாகமம் 11:25-ல், இது மோசேயின்மேல் இருந்து மூப்பர்கள்மேல் வைக்கப்பட்டு அவர்களைப் பணிக்குத் தகுதிப்படுத்தும் தெய்வீக ஆவியைக் குறிக்கிறது. இருப்பினும், ‘பரிசுத்த ஆவி’ போன்ற கூடுதல் கோட்பாட்டுச் சொல்லைச் சேர்க்காமல் மூலத்தின் சொல்லாட்சியே தக்கவைக்கப்பட்டது.
- issue: மோசேயின்மேல் இருந்த ஆவி குறைக்கப்பட்டதா?
  choice: மாற்றம் நிகழ்வதை மட்டும் கூறுதல்
  alternative: மோசேயிடமிருந்து ஆவியின் ஒரு பகுதி நீக்கப்பட்டது என்று வெளிப்படையாகக் கூறுதல்
  rationale: מן மற்றும் אצל மாற்றம் அல்லது பகிர்வைக் காட்டினாலும், மோசேயின் அருளளிப்பு உண்மையில் குறைந்ததா என்பதை வசனம் விளக்கவில்லை. எனவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தேவன் மோசேயிடம் நேரடியாகப் பேசுவதால் ஒருமை நெருக்குச் சுட்டான ‘நீ/உன்’ தக்கவைக்கப்பட்டுள்ளது. வசனத்தின் சுமை–சுமத்தல் சொல் விளையாட்டும் ஆவி ‘மேல்’ இருப்பது/வைக்கப்படுவது என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
