  source_fidelity: மொத்தத்தில் எபிரெய மூலத்தின் வரிசை, ‘ஆவி’ பகிரப்படுதல், மக்கள் தொடர்பான சுமையைப் பகிர்ந்து சுமத்தல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ஆனால் இறுதிக் கூறான וְלֹא תִשָּׂא (‘நீ சுமக்கமாட்டாய்’) என்பதற்கு ‘சுமக்க வேண்டியிருக்காது’ என்பது கடமையின்மை என்ற நுணுக்கத்தைச் சேர்க்கிறது; மூலத்தின் நேரடியான எதிர்கால விளைவைக் காட்டும் சொல்லாக்கம் தேவைப்படுகிறது.
