base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: ta
  text: நீங்கள் ஒரு நாள் மட்டுமோ,[a] இரண்டு நாட்களோ, ஐந்து நாட்களோ, பத்து நாட்களோ, இருபது நாட்களோ சாப்பிடப்போவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “நீங்கள் ஒரு நாள் மட்டும் சாப்பிடமாட்டீர்கள்; இரண்டு நாட்கள் மட்டும் சாப்பிடமாட்டீர்கள்; ஐந்து நாட்கள் மட்டும் சாப்பிடமாட்டீர்கள்; பத்து நாட்கள் மட்டும் சாப்பிடமாட்டீர்கள்; இருபது நாட்கள் மட்டும் சாப்பிடமாட்டீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: சாப்பிடப்போவதில்லை
  rationale: ஒவ்வொரு கால அளவையும் மறுக்கும் எபிரேயத் தொடரின் பொருளைத் தமிழில் இயல்பாக எடுத்துரைக்க, மறுப்பு வினைமுற்றில் ஒருமுறை வெளிப்படுத்தப்பட்டு, கால அளவுகள் ‘-ஓ’ தொடரால் இணைக்கப்பட்டுள்ளன.
- source_word: יוֹם אֶחָד
  choice: ஒரு நாள் மட்டும்
  rationale: எண்ணிக்கைத் தொடரைத் தெளிவாக வைத்திருக்கிறது; அடுத்த வசனத்துடன் இணையும் சூழலில் ‘மட்டும்’ குறுகிய கால அளவு மறுக்கப்படுவதை இயல்பாக உணர்த்துகிறது.
- source_word: תֹּאכְלוּ/ן
  choice: நீங்கள் ... சாப்பிடப்போவதில்லை
  rationale: Qal imperfect இரண்டாம் நபர் ஆண்பால் பன்மை வடிவத்தின் எதிர்கால அறிவிப்பை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יוֹמָיִם
  choice: இரண்டு நாட்கள்
  rationale: இருமை வடிவத்தின் வெளிப்படையான பொருள் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמִשָּׁה יָמִים
  choice: ஐந்து நாட்கள்
  rationale: மேலேறும் எண்ணிக்கைத் தொடரைப் பாதுகாக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: עֲשָׂרָה יָמִים
  choice: பத்து நாட்கள்
  rationale: எபிரேய மூலத்தின் சொல்லாட்சியையும் வலுப்பெறும் தொடரையும் பாதுகாக்கிறது.
- source_word: עֶשְׂרִים יוֹם
  choice: இருபது நாட்கள்
  rationale: எபிரேயத்தில் ‘நாள்’ ஒருமையில் இருந்தாலும், எண்ணுக்குப் பின் நவீன தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְ
  choice: -ஓ ... -ஓ
  rationale: மீண்டும் மீண்டும் வரும் மறுப்புகளுடன் இணைந்த waw-ஐ, மாற்று கால அளவுகளை வரிசைப்படுத்தும் இயல்பான தமிழ்த் தொடராக வழங்குகிறது.
