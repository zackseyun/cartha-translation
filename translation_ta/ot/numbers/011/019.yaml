translation_notes:
  register: நவீன பொதுத் தமிழில் தெளிவான, கண்ணியமான நடை. இது முந்தைய வசனத்தில் கூறப்பட்ட இறைச்சியைச் சுட்டுவதால், தமிழில் தனித்து வாசிக்கும்போதும் பொருள் தெளிவாக இருக்க ‘இறைச்சியை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நீண்ட வாக்கியத்தின் ஒரு பகுதி என்பதால் இறுதியில் தொடர்ச்சியை உணர்த்தும் அமைப்பு வைக்கப்பட்டுள்ளது.
