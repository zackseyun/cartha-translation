  to: நீங்கள் ஒரு நாள் மட்டுமோ,[a] இரண்டு நாட்களோ, ஐந்து நாட்களோ, பத்து நாட்களோ, இருபது நாட்களோ சாப்பிடப்போவதில்லை.
  rationale: The supplied object has been removed because it is absent from the Hebrew text and can be understood from the immediate context. The footnote has been revised so that every negated duration carries the required ‘only/just’ sense, preserving the Hebrew’s repeated rhetorical negation without implying a prohibition of eating on particular calendar days.
