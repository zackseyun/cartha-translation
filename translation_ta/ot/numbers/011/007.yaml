  text: וְ/הַ/מָּ֕ן כִּ/זְרַע גַּ֖ד ה֑וּא וְ/עֵינ֖/וֹ כְּ/עֵ֥ין הַ/בְּדֹֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: ta
  text: மன்னா கொத்தமல்லி விதையைப் போன்றது; அதன் தோற்றம் பிடெல்லியத்தின்[a] தோற்றத்தைப் போன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பிடெல்லியம் என்பது நறுமணமுள்ள பிசின் அல்லது மரப்பிசையாக இருக்கலாம். இந்த எபிரெயச் சொல் துல்லியமாக எதைக் குறிக்கிறது என்பது உறுதியில்லை; முத்து அல்லது படிகம் போன்ற பொருளைக் குறிக்கும் என்றும் சிலர் கருதுகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: மன்னா
  rationale: வனாந்தரத்தில் இஸ்ரவேலருக்குக் கிடைத்ததாகச் சூழலில் ஏற்கெனவே அறியப்பட்ட உணவைக் குறிக்கும் பெயராக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: כִּזְרַע גַּד
  choice: கொத்தமல்லி விதையைப் போல
  rationale: כִּ என்பது ஒப்புமையைக் குறிக்கிறது; גַּד பொதுவாகக் கொத்தமல்லி என அடையாளம் காணப்படுவதால், தெளிவான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעֵינוֹ
  choice: அதன் தோற்றம்
  rationale: עַיִן என்பதன் அடிப்படைப் பொருள் ‘கண்’ என்றாலும், இங்கு அது காணப்படும் தோற்றத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: כְּעֵין
  choice: தோற்றத்தைப் போல
  rationale: மூலத்தில் עַיִן தொடர்பான சொல் மீண்டும் வருவதால், காட்சிசார் ஒப்புமையையும் இணை அமைப்பையும் தமிழிலும் ‘தோற்றம்’ என மீட்டுரைப்பதன் மூலம் காக்கிறது.
- source_word: הַבְּדֹלַח
  choice: பிடெல்லியம்
  rationale: எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது. மரபாக ஏற்றுக்கொள்ளப்பட்ட ‘bdellium’ என்ற அடையாளத்தைத் தமிழில் ஒலிபெயர்த்து, மாற்று அடையாளங்களையும் நிச்சயமின்மையையும் அடிக்குறிப்பில் வைத்துள்ளது.
