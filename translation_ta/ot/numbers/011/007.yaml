translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையான காலக் குறிப்பு இல்லாததால் ‘இப்போது’ போன்ற தொடக்கச் சொல் சேர்க்கப்படவில்லை. இரண்டு ஒப்புமைகளும் ஒரே வாக்கியத்தில் ‘போலவும் ... போலவும் இருந்தது’ என்ற இயல்பான தமிழ் இணை அமைப்பில் தரப்பட்டுள்ளன.
