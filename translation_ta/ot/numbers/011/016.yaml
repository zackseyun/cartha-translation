source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “இஸ்ரவேலின் மூப்பர்களிலிருந்து, மக்களின் மூப்பர்களும் அவர்களது அதிகாரிகளுமாக[b] இருப்பதை நீ அறிந்த எழுபது ஆண்களை எனக்காக ஒன்றுகூட்டு[a]. அவர்களைச் சந்திப்புக் கூடாரத்துக்கு அழைத்துவா; அங்கே அவர்கள் உன்னுடன் நிற்கட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காகக் கூட்டிச்சேர்.”
    reason: אָסַף என்ற வினை ஆட்களை ஒன்றாகத் திரட்டுதல் அல்லது கூட்டிச்சேர்த்தல் ஆகிய நெருங்கிய பொருள்களை உடையது.
  - marker: b
    text: “அதிகாரிகள்” என்பது மூப்பர்களின் கீழ் நிர்வாகப் பொறுப்பு வகித்த அலுவலர்களைக் குறிக்கும்.
    reason: שֹׁטֵר என்ற எபிரெயச் சொல்லின் நிர்வாகச் சார்ந்த பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶסְפָה לִּי
  choice: எனக்காக ஒன்றுகூட்டு
  rationale: ஆட்களை ஒரே இடத்தில் திரட்டும்படி மோசேக்கு இடப்படும் கட்டளையையும் לִּי என்பதன் ‘எனக்காக’ என்ற நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שִׁבְעִים אִישׁ
  choice: எழுபது ஆண்கள்
  rationale: தலைமைப் பொறுப்புக்காகத் தேர்ந்தெடுக்கப்படும் வயது வந்த ஆண்களை இச்சூழலில் אִישׁ குறிக்கிறது.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்களில்
  rationale: מִן குறிக்கும் பெரிய குழுவிலிருந்து செய்யப்படும் தேர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: நீ அறிந்திருக்கிற
  rationale: அவர்கள் ஏற்கெனவே அங்கீகரிக்கப்பட்ட தலைவர்கள் என்பதை மோசே அறிந்திருந்ததன் அடிப்படையில் தேர்வு செய்ய வேண்டும் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: זִקְנֵי הָעָם וְשֹׁטְרָיו
  choice: மக்களின் மூப்பர்களும் அதிகாரிகளும்
  rationale: மக்களின் அங்கீகரிக்கப்பட்ட மூப்பர்களையும் நிர்வாகப் பொறுப்புடைய அலுவலர்களையும் குறிக்கும் இணைச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: וְלָקַחְתָּ אֹתָם
  choice: அவர்களை ... அழைத்துவா
  rationale: குறிப்பிட்ட இடத்துக்கு அவர்களைக் கொண்டுவர வேண்டும் என்பதால், சொற்சொல்லான ‘எடுத்துக்கொள்’ என்பதைக் காட்டிலும் தமிழில் இயல்பான இயக்கவினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் பரிசுத்தக் கூடாரத்தைக் குறிக்கும் எபிரெயப் பெயரை நேரடியாகவும் புரியத்தக்க வகையிலும் வழங்குகிறது.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: அங்கே அவர்கள் உன்னுடன் வந்து நிற்கட்டும்
  rationale: தங்களை முன்னிறுத்தி குறிப்பிட்ட இடத்தில் மோசேயோடு நிலைகொள்ள வேண்டும் என்ற התיצב வினையின் வலிமையையும் கட்டளைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கையின் பெயரை வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மூப்பர்கள்’, ‘அதிகாரிகள்’, ‘சந்திப்புக் கூடாரம்’ ஆகியவை சூழலுக்கேற்ற நிலையான வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; எபிரெய வாக்கிய அமைப்பு தமிழில் இயல்பாக மறுவரிசைப்படுத்தப்பட்டுள்ளது.
