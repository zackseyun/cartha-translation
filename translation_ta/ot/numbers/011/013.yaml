translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மோசேயின் இயலாமையும் மக்களின் அழுகையால் அவர்மீது வரும் அழுத்தமும் இயல்பாக வெளிப்படுகின்றன; עָלַי என்பதிலுள்ள உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
