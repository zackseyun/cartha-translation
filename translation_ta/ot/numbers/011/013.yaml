base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: ta
  text: இந்த மக்கள் அனைவருக்கும் கொடுக்க இறைச்சி எனக்கு எங்கிருந்து கிடைக்கும்? ஏனெனில் அவர்கள் என்னிடம் அழுது முறையிட்டு[a], ‘நாங்கள் சாப்பிடும்படி எங்களுக்கு இறைச்சி கொடுங்கள்’ என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் என்னை நோக்கி அழுகிறார்கள்,” அல்லது “தங்கள் அழுகையால் என்னை நெருக்குகிறார்கள்.” எபிரெயச் சொற்றொடர் சொற்படியாக, “அவர்கள் என்மேல் அழுகிறார்கள்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: எனக்கு எங்கிருந்து கிடைக்கும்?
  rationale: מֵאַיִן மூலத்தைக் குறித்த கேள்வியையும், לִי மோசேயின் வசமின்மையையும் வெளிப்படுத்துகின்றன. இயல்பான தமிழில் இவ்விரண்டையும் இணைத்து வழங்குகிறது.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: உணவுக்கான விலங்கு மாமிசத்தைக் குறிக்கும் சூழலில், நவீன தமிழில் இயல்பான சொல்.
- source_word: לְכָל הָעָם הַזֶּה
  choice: இந்த மக்கள் அனைவருக்கும்
  rationale: עָם என்பது ஒருமை கூட்டுப்பெயர்; தமிழில் இயல்பாகவும் அதன் மொத்தக் குழுப் பொருளைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: יִבְכּוּ עָלַי
  choice: அவர்கள் என்னிடம் அழுது முறையிட்டு
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘என்மேல் அழுகிறார்கள்’ எனினும், இங்கு அழுகை மோசேயை நோக்கிய கோரிக்கையாகவும் அவர்மீது செலுத்தப்படும் அழுத்தமாகவும் உள்ளது. ‘என்னிடம் அழுது முறையிட்டு’ இரண்டையும் மிகைப்படுத்தாமல் உணர்த்துகிறது.
- source_word: תְּנָה לָּנוּ
  choice: எங்களுக்கு இறைச்சி கொடும்
  rationale: கட்டளை வடிவத்தையும் பன்மை பெறுநரையும் தெளிவாகத் தருகிறது; மேற்கோளில் இறைச்சி மீண்டும் குறிப்பிடப்படுவது மூலத்தின் அமைப்பைப் பேணுகிறது.
- source_word: וְנֹאכֵלָה
  choice: நாங்கள் சாப்பிடுவதற்கு
  rationale: கோஹோர்டேட்டிவ் வடிவத்தின் விருப்பம்/நோக்க விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
