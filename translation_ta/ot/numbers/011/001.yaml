  rationale: The revision preserves the difficult comparative complaint expression and the Hebrew hearing and fire imagery. It removes an unnecessary Tamil repetition in the first clause and, most importantly, restores the final Hebrew phrase as a location rather than treating the camp’s outer area as the consumed object. The revised footnote makes the omitted object explicit without resolving it.
