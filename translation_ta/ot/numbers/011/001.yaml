  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: ta
  text: மக்கள் துன்பத்தைப் பற்றிப் புலம்புகிறவர்களைப்போல் யாவேயின் செவிகளில்[a] முறையிட்டனர்[b]. யாவே அதைக் கேட்டார்; அவருடைய கோபம் பற்றியெரிந்தது. யாவேயின் நெருப்பு[c] அவர்களிடையே பற்றியெரிந்து, முகாமின் ஓரப்பகுதியில் எரித்தழித்தது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யாவேயின் செவிகளில்’; அதாவது, அவர்களுடைய முறையீடு யாவேயின் கவனத்துக்கு வந்தது.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் காண்பதில் சற்றுக் கடினமானதும் ஆகும். ‘முறையிடுகிறவர்களாக,’ ‘முறையிட்டுக்கொண்டு,’ அல்லது ‘முறையிடுகிறவர்களைப்போல்’ என்றும் மொழிபெயர்க்கலாம். ‘துன்பத்தைப் பற்றி’ என்பதற்குப் பதிலாக ‘தீமையாக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யாவேயிடமிருந்து வந்த ஒரு நெருப்பு.’
    reason: alternative_reading
  - marker: d
    text: எபிரெயத்தில், ‘முகாமின் ஓரத்தில்/எல்லையில்.’ எரித்தழிக்கப்பட்டது யார் அல்லது எது என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם
  choice: மக்கள் ... முறையிட்டுக்கொண்டிருந்தார்கள்
  rationale: எபிரெயக் கதைநடையின் தொடர் அமைப்பைத் தமிழில் இயல்பான தொடர்நிலை வாக்கியமாக்குகிறது; மூலத்தில் இல்லாத தனியான காலச் சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: כְמִתְאֹנְנִים
  choice: புலம்புகிறவர்களைப்போல் ... முறையிட்டுக்கொண்டிருந்தார்கள்
  rationale: அரிதான Hitpael பங்கேற்பு வடிவத்திலுள்ள தொடர்ச்சியான முறையீட்டையும் כְּ என்பதன் ஒப்புமை நுணுக்கத்தையும் இயன்றவரை தக்கவைக்கிறது.
- source_word: רַע
  choice: துன்பத்தைப் பற்றி
  rationale: இங்கு רַע என்பது அவர்கள் அனுபவித்த இன்னல் அல்லது துன்பத்தைக் குறிக்கலாம். ‘தீமையாக’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
- source_word: בְּאָזְנֵי יְהוָה
  choice: யாவேயின் செவிகளில்
  rationale: முறையீடு யாவேயின் கவனத்துக்கு வந்தது என்னும் சொல்லாடலை, மூலத்தின் கேள்விப்புல உருவகத்தோடு தக்கவைக்கிறது.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: யாவே அதைக் கேட்டார்
  rationale: சூழலில் மறைந்துள்ள பொருளை ‘அதை’ என்று தெளிவாக்கி, முந்தைய செவி/கேள்வி உருவகத் தொடர்பைப் பேணுகிறது.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவருடைய கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ உருவகத்தை நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் தருகிறது.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: யாவேயின் நெருப்பு அவர்களிடையே பற்றியெரிந்து
  rationale: ‘யாவேயின் நெருப்பு’ என்ற இணைப்பையும் בָּם என்பதன் ‘அவர்களிடையே’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: முகாமின் ஓரப்பகுதியை எரித்தழித்தது
  rationale: நெருப்பு ‘உண்டது/விழுங்கியது’ என்ற மூல உருவகத்தின் அழிவுச் செயலை இயல்பான தமிழில் தருகிறது. எரிந்தது மக்கள் தாமா அல்லது அங்கிருந்த பகுதி/பொருள்களா என்பதைத் தீர்மானிக்காமல் ‘ஓரப்பகுதி’ என வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֵשׁ יְהוָה என்பதன் உறவு
  choice: யாவேயின் நெருப்பு
  alternative: யாவேயிடமிருந்து வந்த நெருப்பு
  rationale: எபிரெய இணைப்பை விளக்கித் தீர்க்காமல் நேரடியாக வைத்திருப்பதால், உடைமை/தொடர்பு அல்லது தோற்றுவாய் என்ற இரு சாத்தியங்களும் திறந்திருக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றியெரிந்தது’ என்ற மீளுரைத்தல் கோபத்திலிருந்து நெருப்புக்குச் செல்லும் மூலத்தின் வெப்ப உருவகத் தொடர்பைப் பேணுகிறது. அரிதான כְמִתְאֹנְנִים רַע அமைப்பின் ambiguity அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
