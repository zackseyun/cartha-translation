translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. காலநீட்சியை வலியுறுத்தும் மூன்று அடுக்குத் தொடர் தக்கவைக்கப்பட்டுள்ளது. அளவின் பெயர் ‘ஹோமர்’ என ஒலிபெயர்க்கப்பட்டு, பண்பாட்டு விளக்கமும் உண்மையான சொற்பொருள் மாற்றுவாய்ப்பும் தனித்தனி அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
