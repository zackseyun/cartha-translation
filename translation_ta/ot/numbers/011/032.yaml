base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: ta
  text: மக்கள் எழுந்து, அந்த நாள் முழுவதும், அந்த இரவு முழுவதும், அடுத்த நாள் முழுவதும் காடைகளைச் சேகரித்தார்கள். மிகக் குறைவாகச் சேகரித்தவன்கூட பத்து ஹோமர் அளவு சேகரித்தான். பிறகு அவர்கள் அவற்றைத் தங்களுக்காக முகாமைச் சுற்றிலும் பரப்பி வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: மக்கள் எழுந்து
  rationale: קום என்பதன் நேரடியான எழுதல் என்ற படிமத்தையும், உடனே செயலில் இறங்கிய கதைநடையின் வலிமையையும் காக்கிறது.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: அந்த நாள் முழுவதும், அந்த இரவு முழுவதும், அடுத்த நாள் முழுவதும்
  rationale: சேகரிப்பு இடைவிடாமல் நீடித்ததை வலியுறுத்தும் எபிரெயத் தொடரமைப்பை இயல்பான தமிழில் மீளுரைக்கிறது.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: காடைகளைச் சேகரித்தார்கள்
  rationale: אָסף என்பதற்கு இச்சூழலில் இயல்பான பொருள் ‘சேகரித்தல்’; שְּׂלָו என்பதை தமிழில் பன்மையாக ‘காடைகள்’ என வழங்குவது இயல்பானது.
- source_word: הַמַּמְעִיט
  choice: மிகக் குறைவாகச் சேகரித்தவன்கூட
  rationale: ‘குறைவாக்குகிறவன்’ என்ற சொற்சார்ந்த கருத்தை, அடுத்துள்ள אָסַף மற்றும் சேகரிப்பு என்ற சூழலின் அடிப்படையில் தெளிவாகக் கூறுகிறது; ‘கூட’ குறைந்தபட்ச அளவின் வியப்பை வெளிப்படுத்துகிறது.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: பத்து ஹோமர்
  rationale: חֹמֶר என்பது பெரிய உலர் அளவை குறிக்கும் வழக்கமான அலகு. நவீன அளவாகத் தவறான துல்லியம் கொடுக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: அவர்கள் அவற்றைத் தங்களுக்காக ... பரப்பி வைத்தார்கள்
  rationale: வினையும் அதே வேருடைய வினையெச்ச வடிவமும் செயலை வலியுறுத்துகின்றன. ‘பரப்பி வைத்தார்கள்’ நீடித்த விளைவைக் காட்டுகிறது; לָהֶם என்பது ‘தங்களுக்காக’ என வெளிப்படையாகக் காக்கப்பட்டுள்ளது. உலர்த்துவதற்காக என நோக்கம் ஊகிக்கப்படவில்லை.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: முகாமைச் சுற்றிலும்
  rationale: முகாமைச் சூழ்ந்த எல்லாப் பகுதிகளிலும் என்ற பகிர்ந்தளிப்பு உணர்வை இயல்பான தமிழில் தருகிறது.
