base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: ta
  text: அவர்களிடையே இருந்த கும்பல்[a] பெரும் ஆசை கொண்டது[b]. இஸ்ரவேல் மக்களும்[c] மீண்டும் அழுது, “நமக்கு இறைச்சி உணவளிப்பவர் யார்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கலப்புக் கூட்டம்” என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெயச் சொல் அரிதானதும் இழிவுத் தொனி கொண்டதுமாகும்; இஸ்ரவேலரிடையே இருந்த மையக் குழுவைச் சாராத கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஆசையை ஆசைப்பட்டார்கள்” என்று ஒரே வேர் கொண்ட சொற்கள் சேர்த்து தீவிரமான விருப்பம் வலியுறுத்தப்படுகிறது.
    reason: source_idiom
  - marker: c
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்களும்.” இது இஸ்ரவேல் மக்களைக் குறிக்கும் இனப்பெயர் வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: கும்பல்
  rationale: அரிதாக வரும் இந்தக் கூட்டு பெயர்ச்சொல்லில் இழிவான தொனி உள்ளது. ‘கும்பல்’ அந்த எதிர்மறைத் தொனியையும், இஸ்ரவேலரிடையே இருந்த மையக் குழுவைச் சாராத கூட்டத்தையும் சுருக்கமாக உணர்த்துகிறது.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: அவர்களிடையே இருந்த
  rationale: எபிரெயச் சொற்றொடரின் இடவுறவை இயல்பான தமிழில் தருகிறது; ஒருமை–பன்மை இடர்ப்பாட்டை செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: அடங்காத ஆசைகொண்டது
  rationale: வினைச்சொல்லும் அதே வேர் கொண்ட பெயர்ச்சொல்லும் சேர்ந்துள்ள வலியுறுத்தலை, தமிழில் இயல்பாகவும் தீவிரமாகவும் தெரிவிக்கிறது.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: மீண்டும் அழுது
  rationale: שׁוב இங்கு முந்தைய செயலைத் திரும்பச் செய்தல் அல்லது மீண்டும் தொடங்குதல் என்ற இடியோமப் பொருளில் உள்ளது; ‘திரும்பி அழுதார்கள்’ என்பதைவிட இது தெளிவானது.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களும்
  rationale: இனக்குழுவைக் குறிக்கும் ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய வழக்கை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: நாம் சாப்பிடுவதற்கு இறைச்சி கொடுப்பவர் யார்?
  rationale: அक्षரார்த்தமாக ‘நமக்கு இறைச்சியை உண்ணச் செய்வவர் யார்?’ என்ற causative அமைப்பை, பொருளை இழக்காமல் இயல்பான தமிழில் தருகிறது; בָּשָׂר இங்கு உணவான இறைச்சியைக் குறிக்கிறது.
