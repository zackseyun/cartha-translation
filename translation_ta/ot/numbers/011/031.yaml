  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: ta
  text: அப்போது யாவேயிடமிருந்து ஒரு காற்று புறப்பட்டது; அது கடலிலிருந்து காடைகளை அடித்துக்கொண்டு வந்து, முகாமைச் சுற்றிலும் அவற்றைப் பரப்பியது. அவை முகாமின் ஒரு பக்கத்தில் ஏறக்குறைய ஒரு நாள் பயணத் தொலைவுக்கும், மறுபக்கத்தில் ஏறக்குறைய ஒரு நாள் பயணத் தொலைவுக்கும் பரவியிருந்தன; தரையின் மேற்பரப்புக்கு மேல் ஏறக்குறைய இரண்டு முழம் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில், “தரையின் முகத்தின்மேல் ஏறக்குறைய இரண்டு முழம்.” இது காடைகள் தரைக்கு மேல் பறந்த அல்லது பரவியிருந்த உயரத்தைக் குறிக்கலாம்; அல்லது அவை தரையில் குவிந்திருந்த ஆழத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: ஒரு காற்று
  rationale: רוּחַ என்பது ‘காற்று,’ ‘மூச்சு,’ அல்லது ‘ஆவி’ எனப் பொருள்படலாம். கடலிலிருந்து காடைகளை நகர்த்தும் சூழலில் ‘காற்று’ என்பதே இயல்பான பொருள்; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: யாவேயிடமிருந்து ... புறப்பட்டு
  rationale: காற்றின் இயக்கம் யாவேயிடமிருந்து தொடங்குகிறது என்பதைத் தெளிவாகக் காட்டுகிறது; அதன் செயல்முறையைத் தேவையின்றி விளக்குவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: וַיָּגָז שַׂלְוִים
  choice: காடைகளை அடித்துக்கொண்டு வந்து
  rationale: அரிதான גוז வினைச்சொல் இச்சூழலில் காற்று காடைகளை வலுவாகக் கடலிலிருந்து கொண்டுவருவதைக் குறிக்கிறது. இத்தமிழ்ச் சொற்றொடர் வெறும் ‘கொண்டுவந்தது’ என்பதைவிட அந்த இயக்கத்தை நன்றாக வெளிப்படுத்துகிறது.
- source_word: מִן הַיָּם
  choice: கடலிலிருந்து
  rationale: பறவைகள் வந்த புவியியல் திசை அல்லது மூலத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: முகாமைச் சுற்றிலும் அவற்றைப் பரப்பியது
  rationale: נטשׁ இங்கு ‘பரப்புதல்,’ ‘விட்டுவிடுதல்,’ அல்லது ‘எறிதல்’ என்ற நிழற்பொருள்களைக் கொண்டிருக்கலாம். அடுத்துவரும் சுற்றளவு விளக்கத்துடன் ‘பரப்பியது’ பொருந்துகிறது; பறவைகள் கூடாரங்களின்மேல் நேரடியாக விழுந்தன என்ற தேவையற்ற எண்ணத்தையும் தவிர்க்கிறது.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: ஒரு பக்கத்தில் ஏறக்குறைய ஒரு நாள் பயணத் தொலைவுக்கும், மறுபக்கத்தில் ஏறக்குறைய ஒரு நாள் பயணத் தொலைவுக்கும்
  rationale: எபிரெய மொழியின் இருபக்கத் திரும்புரையைப் பாதுகாத்து, முகாமிலிருந்து பரவிய தொலைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: முகாமைச் சுற்றிலும்
  rationale: பறவைகள் முகாமை முழுமையாகச் சூழ்ந்த பரப்பில் இருந்தன என்ற தொகுப்புப் பொருளைத் தருகிறது.
- source_word: וּכְאַמָּתַיִם
  choice: ஏறக்குறைய இரண்டு முழம்
  rationale: כְּ முன்னொட்டின் தோராயத்தன்மையை ‘ஏறக்குறைய’ என்பதாலும், பழங்கால அளவை ‘முழம்’ என்பதாலும் பாதுகாக்கிறது.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: தரையின் மேற்பரப்புக்கு மேல்
  rationale: சொல்லுக்குச் சொல் ‘தரையின் முகத்தின்மேல்’ என்ற கருத்தை இயல்பான தமிழில் தருகிறது. இது உயரமா அல்லது தரையில் குவிந்த ஆழமா என்ற தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாவேயிடமிருந்து வந்த காற்றின் செயற்பாடு
  choice: யாவேயிடமிருந்து புறப்பட்ட காற்றே காடைகளை அடித்துக்கொண்டு வந்ததாக மொழிபெயர்க்கப்பட்டது.
  alternative: யாவே காற்றின் மூலம் காடைகளை நேரடியாக அனுப்பினார் என்று மேலும் வெளிப்படையாகக் கூறலாம்.
  rationale: எபிரெய உரை காற்றின் தொடக்கம் யாவேயிடமிருந்து எனக் கூறி, காற்றின் செயற்பாட்டையும் விவரிக்கிறது. மொழிபெயர்ப்பு தெய்வீக செயற்பாட்டையும் இயற்கை வழிமுறையையும் ஒன்றாக வைத்திருக்கிறது; காரணச் செயல்முறையை மேலதிகமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டது. ‘காடைகள்,’ ‘முகாம்,’ ‘முழம்’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இடவியல் திரும்புரையும் அளவின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
