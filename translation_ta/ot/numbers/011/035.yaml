  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான பயண விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் இரண்டு தொடர் செயல்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
