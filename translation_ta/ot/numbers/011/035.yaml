  text: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה נָסְע֥וּ הָ/עָ֖ם חֲצֵר֑וֹת וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: ta
  text: கிப்ரோத்-அத்தாவாவிலிருந்து[a] மக்கள் புறப்பட்டு ஆசேரோத்துக்குச் சென்றார்கள்; அவர்கள் ஆசேரோத்தில் தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிப்ரோத்-அத்தாவா’ என்பதற்கு ‘வேட்கையின் கல்லறைகள்’ அல்லது ‘ஆசையின் கல்லறைகள்’ என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: கிப்ரோத்-அத்தாவாவிலிருந்து
  rationale: இது ‘கல்லறைகள்’ மற்றும் ‘வேட்கை/ஆசை’ என்ற பொதுப்பெயர்களால் உருவான இடப்பெயர். நிகழ்வுரையில் தனிப்பட்ட இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָסְעוּ
  choice: புறப்பட்டு
  rationale: பயண விவரிப்புகளில் இந்த வினை முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது அந்த நுணுக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு இஸ்ரவேல் சமூகத்தை ஒரு கூட்டமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது இயல்பான கூட்டுப்பெயர்.
- source_word: חֲצֵרוֹת
  choice: ஆசரோத்
  rationale: இது ஓர் இடப்பெயர் என்பதால் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: அவர்கள் ஆசரோத்தில் தங்கினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவர்கள் ஆசரோத்தில் இருந்தார்கள்’ என்றாலும், பயணப் பட்டியல் சூழலில் ஒரு இடத்தில் தங்கி இருந்ததைக் குறிக்கிறது. ‘தங்கினார்கள்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
