base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: ta
  text: ஆனால் இரண்டு ஆண்கள் முகாமில் தங்கியிருந்தனர். ஒருவனின் பெயர் எல்தாத்; இரண்டாமவனின் பெயர் மேதாத். ஆவி அவர்கள் மேல் தங்கியது. அவர்கள் பதிவுசெய்யப்பட்டவர்களில் இருந்தார்கள்[a]; ஆனால் கூடாரத்திற்குச் சென்றிருக்கவில்லை[b]. அவர்கள் முகாமில் இறைவாக்கு உரைத்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் பட்டியலில் இடம்பெற்றிருந்தார்கள்.” எபிரெயத்தில் சொல்லர்த்தமாக, “அவர்கள் எழுதப்பட்டவர்களில் இருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இச்சம்பவத்தின் சூழலில் இது சந்திப்புக் கூடாரத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: தங்கியிருந்தார்கள்
  rationale: שׁאר என்பது மீந்திருத்தல் அல்லது பின்னால் தங்கியிருத்தலைக் குறிக்கிறது. அவர்கள் ஏன் செல்லவில்லை என்பதை ஊகிக்காமல், கதையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமிலேயே
  rationale: מַחֲנֶה இஸ்ரவேலரின் முகாமைக் குறிக்கிறது. ‘-லேயே’ என்பது அந்த இருவரும் முகாமில் தங்கியிருந்ததையும் அங்கேயே இறைவாக்கு உரைத்ததையும் இயல்பாக வலியுறுத்துகிறது.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: இரண்டு ஆண்கள்
  rationale: אֲנָשִׁים இங்கு ஆண்பால் பன்மை; ஆகவே பாலினக் குறிப்பைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ஒருவனின் பெயர் ... இரண்டாமவனின் பெயர்
  rationale: எபிரெயப் பெயரிடும் அமைப்பையும் ‘இரண்டாமவன்’ என்ற துல்லியத்தையும் வாசிக்கத்தக்க தமிழில் பேணுகிறது.
- source_word: אֶלְדָּד / מֵידָד
  choice: எல்தாத் / மேதாத்
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்பட்டுள்ளன.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: ஆவி அவர்கள்மேல் தங்கியது
  rationale: נוח என்பது வந்து தங்குதல் அல்லது நிலைகொள்ளுதலைக் குறிக்கிறது. சூழலில் ஆவி இறைவனிடமிருந்து வரும் தீர்க்கதரிசன ஆற்றலைக் குறித்தாலும், மூலத்தில் இல்லாத கூடுதல் சொல்லைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: அவர்கள் பதிவுசெய்யப்பட்டவர்களில் இருந்தார்கள்
  rationale: כְּתֻבִים என்பதன் அடிப்படைப் பொருள் ‘எழுதப்பட்டவர்கள்/பதிவுசெய்யப்பட்டவர்கள்.’ பட்டியலில் சேர்க்கப்பட்ட மூப்பர்களைக் குறிக்கும் சூழற்பொருளையும் சொற்பொருளின் உருவகத்தையும் பேணுகிறது.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: கூடாரத்திற்குச் சென்றிருக்கவில்லை
  rationale: אֹהֱלָה-வின் திசைச்சுட்டும் முடிவு கூடாரத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது. முந்திய நிகழ்வைக் குறிக்கும் விதமாகத் தமிழில் ‘சென்றிருக்கவில்லை’ இயல்பாக அமைகிறது.
- source_word: וַיִּתְנַבְּאוּ
  choice: இறைவாக்கு உரைத்தார்கள்
  rationale: נבא என்பதன் இவ்வடிவம் தீர்க்கதரிசனப் பேச்சு அல்லது செயல்பாட்டைக் குறிக்கிறது. தொடக்கநிலையைத் தேவையின்றிச் சேர்க்காமல், இயல்பான நவீன தமிழில் செயலைத் தெரிவிக்கிறது.
theological_decisions:
- issue: הָרוּחַ என்பதை எவ்வாறு குறிப்பிடுவது
  choice: ஆவி
  alternative: இறைவனுடைய ஆவி / ஆவியானவர்
  rationale: உடனடிச் சூழலில் இது மோசேயின்மேல் இருந்த அதே இறை ஆவியைக் குறிக்கிறது. எனினும் மூலத்தில் இல்லாத ‘இறைவனுடைய’ என்பதையோ, தமிழில் கூடுதல் ஆளுமை மற்றும் மரியாதை நுணுக்கத்தைத் தரக்கூடிய ‘ஆவியானவர்’ என்பதையோ சேர்க்காமல் ‘ஆவி’ என வைத்துள்ளது.
- issue: הָאֹהֱלָה என்பதை ‘சந்திப்புக் கூடாரம்’ என்று வெளிப்படுத்தலாமா
  choice: கூடாரம்
  alternative: சந்திப்புக் கூடாரம்
  rationale: சூழல் சந்திப்புக் கூடாரத்தைக் குறிப்பது வலுவாகத் தெரிந்தாலும், இவ்வசனத்தின் எபிரெயம் ‘கூடாரம்’ என்று மட்டுமே கூறுகிறது. ஆகவே முதன்மை உரை மூலத்தின் பொதுமையைப் பேணி, சூழல் அடையாளத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும், கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியும் பெயரிடும் அமைப்பும் இயன்றவரை பேணப்பட்டுள்ளன; இறையியல் விளக்கங்கள் முதன்மை உரைக்குள் சேர்க்கப்படாமல், உண்மையான சொற்பொருள் பொதுமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
