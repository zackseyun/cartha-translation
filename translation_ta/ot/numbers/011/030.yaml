source:
  edition: WLC
  text: וַ/יֵּאָסֵ֥ף מֹשֶׁ֖ה אֶל הַֽ/מַּחֲנֶ֑ה ה֖וּא וְ/זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: ta
  text: பின்பு மோசே இஸ்ரயேலின் மூப்பர்களுடன் முகாமுக்குத் திரும்பினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பின்பு மோசே முகாமுக்குள் மீண்டும் சேர்க்கப்பட்டார்.” எபிரெய வினைச்சொல்லை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் மோசே இஸ்ரயேலின் மூப்பர்களுடன் முகாமுக்குத் திரும்பினார் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: திரும்பினார்
  rationale: אסף என்பதன் நிபால் வடிவம் இச்சூழலில் முந்தைய நிகழ்விடத்திலிருந்து முகாமுக்குத் திரும்பிச் சென்றதைக் குறிக்கிறது. எபிரெயச் சொல்லின் நேரடி வடிவம் செயல்பாட்டுக்குட்பட்டதாகத் தோன்றினாலும், இயல்பான சூழற்பொருளை ‘திரும்பினார்’ தெளிவாக வழங்குகிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: முகாமுக்கு
  rationale: אֶל என்பதன் திசைப் பொருளையும் מַחֲנֶה குறிக்கும் இஸ்ரயேலரின் முகாமையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘முகாமுக்குள்’ என்பது சற்றுக் கூடுதலான விளக்கமாக இருக்கும்.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: அவரும் இஸ்ரயேலின் மூப்பர்களும்
  rationale: הוּא என்ற வெளிப்படையான சுட்டுப்பெயரையும், மோசேயுடன் மூப்பர்களும் திரும்பியதையும் காக்கிறது. தமிழில் வாக்கியத் தெளிவுக்காக ‘திரும்பினார்கள்’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் மூப்பர்கள்
  rationale: எபிரெயக் கட்டமைப்பின் இயல்பான தமிழ் வடிவம்; வேதாகமக் கதைநடைக்கு ஏற்ற, பொதுவாகப் புரியும் சொற்றொடர்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’ என்பது זְקֵנִים என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமச் சொல். எபிரெயில் உள்ள வலியுறுத்தலான ‘அவரும் ... மூப்பர்களும்’ அமைப்பு காக்கப்பட்டு, தமிழில் குழப்பம் தவிர்க்க வினைச்சொல் மீண்டும் இடப்பட்டுள்ளது.
