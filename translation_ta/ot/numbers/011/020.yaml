revisions:
- from: ஒரு முழு மாதம்வரை—அது உங்கள் மூக்குத் துவாரங்களிலிருந்து வெளியே வந்து, உங்களுக்கு அருவருப்பாகும் வரையில்[a]—நீங்கள் உங்களிடையே இருக்கிற யெகோவாவைப் புறக்கணித்து, அவர் முன்னிலையில் அழுது, ‘நாங்கள் ஏன் எகிப்திலிருந்து புறப்பட்டு வந்தோம்?’ என்று சொன்னதால் இப்படியாகும்.”
