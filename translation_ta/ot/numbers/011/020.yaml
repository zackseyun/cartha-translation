  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: ta
  text: ஒரு முழு மாதம் வரை நீங்கள் அதை உண்ணுவீர்கள்; அது உங்கள் மூக்குத்துவாரங்களிலிருந்து வெளியே வந்து உங்களுக்கு அருவருப்பாகும்வரை உண்ணுவீர்கள்.[a] ஏனெனில், உங்களிடையே இருக்கும் யாவேவை நீங்கள் நிராகரித்து, அவர் முன்னிலையில் அழுதுகொண்டு, ‘நாங்கள் ஏன் எகிப்திலிருந்து வெளியேறினோம்?’ என்று சொன்னீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு வெறுப்பூட்டுவதாகும்” அல்லது “உங்களுக்கு வெறுப்பாகும்.” எபிரெயச் சொல் கடுமையான அருவருப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: ஒரு முழு மாதம்வரை
  rationale: ‘ஒரு மாத நாட்கள்வரை’ என்ற எபிரெய மரபுத்தொடர் முழுமையான ஒரு மாத காலத்தை வலியுறுத்துகிறது; இயல்பான தமிழில் இதைத் தெளிவாகக் கூறுகிறது.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: அது உங்கள் மூக்குத் துவாரங்களிலிருந்து வெளியே வந்து
  rationale: אַף என்பதன் உடல்சார்ந்த ‘மூக்கு/மூக்குத் துவாரம்’ என்ற பொருளையும், மூலத்தின் மிகைப்படுத்தப்பட்ட உயிரோட்டமான படிமத்தையும் காக்கிறது.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: உங்களுக்கு அருவருப்பாகும்
  rationale: זָרָא குறிக்கும் கடும் வெறுப்பையும் குமட்டலையும் நவீன, புரிந்துகொள்ளத்தக்க தமிழில் வெளிப்படுத்துகிறது; மாற்று நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַעַן כִּי
  choice: என்று சொன்னதால் இப்படியாகும்
  rationale: இந்தச் சொற்றொடர் முன் கூறப்பட்ட தண்டனைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்பில் காரணத்தை இறுதியில் இயல்பாக இணைக்கிறது.
- source_word: מְאַסְתֶּם
  choice: புறக்கணித்து
  rationale: מָאַסின் ‘நிராகரி/வெறுத்துத் தள்ளு’ என்ற பொருளை இங்கு யெகோவாவின் உடனிருப்பையும் அருளையும் மதிக்காமல் தள்ளிய செயல் எனக் காட்டுகிறது; உணர்ச்சி சார்ந்த மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவில் தருகிறது.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: உங்களிடையே இருக்கிற
  rationale: சமூகத்தின் நடுவில் உள்ள தெய்வீகப் பிரசன்னத்தைக் குறிக்கிறது; ‘உங்களுக்குள்’ எனக் கூறி தனிநபரின் அகத்தைக் குறிப்பதாகத் தவறாகப் புரியாமல் காக்கிறது.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: அவர் முன்னிலையில் அழுது
  rationale: בכה என்பதன் அழுகையையும் לְפָנָיו என்பதன் ‘அவர் முன்னிலையில்’ என்ற உறவுசார் இடநிலையையும் காக்கிறது.
- source_word: לָמָּה זֶּה
  choice: ஏன்
  rationale: கேள்வியின் குறைசொல்லும் தொனி சூழலிலேயே தெளிவாக இருப்பதால், மூலத்தில் வெளிப்படையாக இல்லாத ‘தான்’ அல்லது ‘எப்போதாவது’ போன்ற கூடுதல் வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்தோம்
  rationale: יצא என்பதன் ‘வெளியேறு’ கருத்தையும், பேச்சாளர்கள் தங்களுடைய கடந்த வெளியேற்றத்தைத் திரும்பிப் பார்க்கும் நோக்கையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. அதை பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது; ‘யாவே’ என்பது ஒலிப்பியல் சார்ந்த மாற்று வடிவம்.
- issue: מְאַסְתֶּם என்பதன் வலிமை
  choice: புறக்கணித்து
  alternative: நிராகரித்து / வெறுத்துத் தள்ளி
  rationale: இஸ்ரவேலர் யெகோவாவின் உடனிருப்பை மதிக்காமல் எகிப்தை ஏங்கிய உடன்படிக்கை மீறலைக் காட்டுகிறது. ‘வெறுத்துத் தள்ளி’ என்பது உணர்ச்சியை அதிகப்படுத்தலாம்; ‘நிராகரித்து’ என்பது ஏற்ற மாற்றாக இருந்தாலும் இங்கு சற்றுக் கருத்தியல் தொனியுடையது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் மூக்குத் துவாரப் படிமமும் கடுமையான அருவருப்பும் மென்மைப்படுத்தப்படவில்லை; காரணவாக்கியம் தமிழின் இயல்புக்கேற்ப இறுதியில் அமைக்கப்பட்டது.
