  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான அடைமொழித் தொடரை இடைக்கோடுகளுக்குள் வைத்து வாசிப்பைத் தெளிவாக்கியுள்ளோம்; அதன் உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
