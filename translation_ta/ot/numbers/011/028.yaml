source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: ta
  text: அப்போது நூனின் மகனாகிய யோசுவா—மோசேயின் உதவியாளராகத் தன் இளமைமுதல் இருந்தவன்[a]—மறுமொழியாக, “என் தலைவராகிய மோசேயே, அவர்களைத் தடுத்து நிறுத்துங்கள்[b]!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மோசேயின் இளைஞர்களில் ஒருவன்”; “அவருடைய தேர்ந்தெடுக்கப்பட்டவர்களில் ஒருவன்” என்றும் பொருள்கொள்ளலாம். எபிரெயத் தொடர் சுருக்கமானதும் ஓரளவு தெளிவற்றதும் ஆகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அவர்களுக்குத் தடை விதியுங்கள்.” எபிரெய வினை கட்டுப்படுத்துதல், தடுத்து நிறுத்துதல், அல்லது தடைசெய்தல் எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெயக் கதைநடையின் ‘பதிலளித்து, சொன்னான்’ என்ற இரட்டை அமைப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் அதன் மறுமொழித் தன்மையை இழக்காமலும் தருகிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகனாகிய யோசுவா
  rationale: வேதாகமப் பெயர்களுக்குரிய வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பின்பற்றி, தந்தை–மகன் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: மோசேயின் உதவியாளர்
  rationale: מְשָׁרֵת என்பது தனிப்பட்ட முறையில் சேவைசெய்து உதவுபவரைக் குறிக்கிறது; ‘உதவியாளர்’ என்பது அடிமைத்தனத்தைத் தேவையின்றி உணர்த்தாமல் அந்தப் பணியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִבְּחֻרָיו
  choice: அவருடைய இளைஞர்களில் ஒருவன்
  rationale: இந்தச் சுருக்கமான எபிரெயத் தொடர் இலக்கண வடிவுக்கு நெருக்கமாக, மோசேயைச் சேர்ந்த இளைஞர்களுள் யோசுவா ஒருவன் எனக் காட்டுகிறது; ‘அவருடைய தேர்ந்தெடுக்கப்பட்டவர்களில் ஒருவன்’ அல்லது ‘தன் இளமைமுதல்’ என்பனவும் சாத்தியமாதலால் அவை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: என் தலைவராகிய மோசேயே
  rationale: மனித மேலதிகாரியை நோக்கிய மரியாதைமிக்க அழைப்பைத் தெளிவாகத் தருகிறது; இங்கு இறைமைப் பட்டத்தைக் குறிக்கவில்லை.
- source_word: כְּלָאֵם
  choice: அவர்களைத் தடுத்து நிறுத்துங்கள்
  rationale: כלא என்ற வினையின் கட்டுப்படுத்துதல் அல்லது மேற்கொண்டு செய்வதைத் தடுத்தல் என்ற வலிமையைச் சூழலுக்கு ஏற்ற தமிழில் தருகிறது; ‘தடைசெய்யுங்கள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
