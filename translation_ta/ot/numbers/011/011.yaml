review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal Hebrew terms: Moses’ deferential self-reference, the sharp complaint expressed by הֲרֵעֹתָ, the idiom of finding favor ‘in your eyes,’ and the burden metaphor. However, the final clause is presented as an independent exclamatory assertion (‘வைத்துவிட்டீரே!’), whereas the Hebrew infinitive לָשׂוּם is syntactically linked to Moses’ preceding ‘Why have I not found favor...?’ complaint. A revision should preserve that connection.'
  naturalness: The Tamil is generally clear and dignified in a modern standard biblical register. Recasting the second question so that ‘placing the burden’ is explicitly connected to the lack of favor makes the logic more natural and avoids the slightly abrupt final exclamation.
  terminology: ‘யாவே,’ ‘அடியான்,’ ‘தீங்கு செய்தீர்,’ ‘தயவு,’ and ‘சுமை’ are appropriate. Respectful plural address is consistently maintained. ‘உமது கண்களில்’ in the note correctly explains the Hebrew idiom, while the main text’s ‘உமது பார்வையில்’ is understandable modern Tamil.
  issues:
  - severity: medium
    issue: The final infinitival clause is detached from the preceding why-question.
    rationale: 'לָשׂוּם (‘to place/lay’) follows ‘Why have I not found favor in your eyes?’ and expresses the complained-of result/purpose: why has Moses not found favor, so that the burden of this whole people is placed on him? ‘வைத்துவிட்டீரே!’ makes it an independent exclamation and weakens this syntactic relationship.'
