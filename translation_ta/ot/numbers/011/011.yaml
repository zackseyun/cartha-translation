  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: ta
  text: மோசே யாவேவிடம், “உமது அடியானுக்கு ஏன் தீங்கு செய்தீர்?[a] இந்த மக்கள் அனைவரின் சுமையையும் என்மேல் வைப்பதற்காகவா உமது பார்வையில் எனக்குத் தயவு கிடைக்கவில்லை?[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீங்கு செய்தீர்” என்பதை “கேடு செய்தீர்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை இன்னும் சொற்படியாக ‘தீமை/கேடு செய்தல்’ என்று பொருள்படும்; இங்கே அது மோசேயின் வேதனைமிக்க முறையீட்டை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொற்படியாக, “உமது கண்களில் எனக்குத் தயவு கிடைக்கவில்லை.” இது ஒருவரின் தயவைப் பெறுவதைக் குறிக்கும் பொதுவான மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֲרֵעֹתָ
  choice: தீங்கு செய்தீர்
  rationale: வினையின் ‘கேடு/தீங்கு செய்தல்’ என்ற வலுவான பொருளையும் மோசேயின் வேதனைமிக்க முறையீட்டையும் காக்கிறது; இது உரையில் மோசே எழுப்பும் குற்றச்சாட்டு, கடவுளின் ஒழுக்கத் தன்மையைப் பற்றிய மொழிபெயர்ப்பாளரின் தீர்ப்பு அல்ல.
- source_word: לְעַבְדֶּךָ
  choice: உமது அடியானுக்கு
  rationale: கடவுளிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் மரியாதைமிக்க சுயக்குறிப்பை இயல்பான வேதாகமத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைக்காதது
  rationale: ‘உமது கண்களில் தயவைக் கண்டடைதல்’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தை இயல்பான நவீன தமிழில் ஓரளவு காக்கிறது.
- source_word: לָשׂוּם
  choice: வைத்துவிட்டீரே
  rationale: மக்களின் சுமையை மோசேயின்மேல் வைத்ததைக் குறிக்கும் உருவகத்தைப் பேணுவதோடு, அவரது முறையீட்டின் உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: מַשָּׂא
  choice: சுமை
  rationale: நேரடியான பாரத்தையும் மக்களை வழிநடத்தும் பொறுப்பின் அழுத்தத்தையும் ஒருங்கே உணர்த்துகிறது.
- source_word: כָּל הָעָם הַזֶּה
  choice: இந்த மக்கள் அனைவரின்
  rationale: எபிரேயத்தில் ‘மக்கள்’ ஒருமைக் கூட்டுப்பெயராக இருந்தாலும், தமிழில் இயல்பாகவும் முழுமையைக் குறிக்கும் வகையிலும் வழங்குகிறது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: சுமை உருவகத்துடன் இயல்பாக இணையும் நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: கடவுளை எழுவாயாகக் கொண்ட הֲרֵעֹתָ என்பதன் சாத்தியமான விளைவு
  choice: “தீங்கு செய்தீர்” என்று மொழிபெயர்த்து, இது மோசேயின் முறையீடு என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: “மோசமாக நடத்தினீர்” அல்லது “கேடு செய்தீர்”
  rationale: மூலத்தின் கூர்மையான மொழியையும் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் காக்கிறது; அதேவேளை இந்தச் சொல் மோசேயின் அனுபவத்திலிருந்து எழும் குற்றச்சாட்டு என்பதைச் சுட்டுகிறது.
- issue: மָצָתִי חֵן בְּעֵינֶיךָ என்ற மரபுத்தொடர்
  choice: “உமது பார்வையில் எனக்குத் தயவு கிடைக்காதது”
  alternative: “உம்மிடம் எனக்குத் தயவு கிடைக்காதது”
  rationale: தமிழில் புரியத்தக்க வடிவில் எபிரேய பார்வை உருவகத்தின் தடத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை நோக்கிய மரியாதைப் பன்மையையும் மோசேயின் கூர்மையான முறையீட்டையும் இணைக்கும் கண்ணியமான நடை. ‘அடியான்’, ‘உமது’ ஆகியவை சூழலுக்கேற்ற உயர்நடையை அளிக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கும் தெளிவாக உள்ளது.
