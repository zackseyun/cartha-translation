revisions:
- from: இறைச்சி இன்னும் அவர்களுடைய பற்களுக்கு இடையில் இருந்தபோதே, அது அறுபட்டுப்போவதற்கு முன்பே[a], யாவேக்கு மக்கள்மீது கோபம் பற்றியெரிந்தது. யாவே மக்களை மிகக் கொடிய கொள்ளைநோயால் தாக்கினார்.
  to: இறைச்சி இன்னும் அவர்களுடைய பற்களுக்கு இடையில் இருந்தது; அதை உண்டு முடிப்பதற்கு முன்பே[a], யாவேயின் கோபம் மக்கள்மீது பற்றியெரிந்தது; யாவே மக்களை மிகக் கடுமையான வாதையால் தாக்கினார்.
