base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: ta
  text: இறைச்சி இன்னும் அவர்களுடைய பற்களுக்கு இடையில் இருந்தது; அதை உண்டு முடிப்பதற்கு முன்பே[a], யாவேயின் கோபம் மக்கள்மீது பற்றியெரிந்தது; யாவே மக்களை மிகக் கடுமையான வாதையால் தாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லர்த்தமாக, “அது அறுபடுவதற்கு முன்பே.” இச்சூழலில், இறைச்சி உண்டு முடிக்கப்படுவதற்கு முன்பே என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: இறைச்சி
  rationale: காடைகளை உணவாக உண்ணும் சூழலில் בָּשָׂר என்பது உணவுக்கான விலங்கு இறைச்சியைக் குறிக்கிறது.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: இன்னும் அவர்களுடைய பற்களுக்கு இடையில் இருந்தபோதே
  rationale: இறைச்சி இன்னும் விழுங்கப்படாமல் இருந்தது என்ற எபிரெய மொழியின் உயிரோட்டமான படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: טֶרֶם יִכָּרֵת
  choice: அது அறுபட்டுப்போவதற்கு முன்பே
  rationale: כרת என்ற வினையின் அடிப்படைப் பொருளான ‘அறுபடுதல்/துண்டிக்கப்படுதல்’ என்பதைப் பாதுகாக்கிறது; இச்சூழலில் அது உண்டு முடிக்கப்படுவதைக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וְאַף יְהוָה חָרָה
  choice: யாவேக்கு மக்கள்மீது கோபம் பற்றியெரிந்தது
  rationale: חרה אף என்பதிலுள்ள எரியும் கோபம் என்ற உருவகத்தைத் தமிழில் இயல்பாகவும் வலிமையாகவும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய இறைப்பெயரான יהוה என்பதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கும் தமிழாக்கம்.
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: தீர்ப்புச் சூழலில் נכה என்பதன் வலிமையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: மிகக் கொடிய கொள்ளைநோய்
  rationale: மக்கள்மீது வந்த பேரழிவான தெய்வீகத் தாக்குதலைக் குறிக்கும் מַכָּה என்பதையும், רַבָּה מְאֹד என்பதன் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: தெய்வீகக் கோபத்தின் மனித உணர்வுசார் உருவகம்
  choice: யாவேக்கு மக்கள்மீது கோபம் பற்றியெரிந்தது
  alternative: யாவே மக்கள்மீது கோபமடைந்தார்
  rationale: மூலத்தின் חרה אף என்ற ‘கோபம் எரிதல்’ உருவகத்தை மென்மையாக்காமல் பாதுகாக்கிறது.
- issue: יִכָּרֵת என்பதன் சூழல்சார் பொருள்
  choice: அறுபட்டுப்போவதற்கு முன்பே
  alternative: உண்டு முடிக்கப்படுவதற்கு முன்பே
  rationale: சொல்லின் அடிப்படை உருவகத்தை முதன்மை உரையில் காத்து, உணவுச் சூழலில் சாத்தியமான பொருளை காலடிக்குறிப்பில் தருவதால் உண்மையான பொருள் நுணுக்கம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய உரையின் தெளிவான படிமங்களும் தீவிரமும் காக்கப்பட்டுள்ளன; יִכָּרֵת என்பதிலுள்ள சொற்பொருள்–சூழற்பொருள் வேறுபாடு காலடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
