  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: ta
  text: உங்கள் பங்களிப்பு, போரடிக்கும் களத்திலிருந்து வரும் தானியத்தைப் போலவும், திராட்சை ஆலையிலிருந்து வரும் நிறைவான விளைச்சலைப் போலவும் உங்களுக்குக் கணக்கில் ஏற்றுக்கொள்ளப்படும்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குக் கணக்கிடப்படும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் காணிக்கை”; மரபுவழியாக, “உயர்த்திப் படைக்கும் காணிக்கை.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழியில், “திராட்சை ஆலையிலிருந்து வரும் நிறைவு”; அதாவது, திராட்சை ஆலையின் முழு விளைவு அல்லது உற்பத்தி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: கணக்கிடப்படும்
  rationale: חשׁב என்பதன் நிஃபால் வடிவம் இங்கு ஒன்றை மற்றொன்றுக்கு இணையானதாகக் கருதி கணக்கில் ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் ‘கணக்கிடப்படும்’ என்பது சட்ட-வழிபாட்டுச் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: תְּרוּמַתְכֶם
  choice: உங்கள் பங்களிப்பு
  rationale: תְּרוּמָה என்பது பரிசுத்தப் பயன்பாட்டுக்காகப் பிரித்தளிக்கப்படும் பங்கைக் குறிக்கிறது. இங்கு லேவியர்கள் தங்கள் பத்தில் ஒன்றிலிருந்து கொடுக்கும் பங்கு என்பதால் ‘பங்களிப்பு’ தெளிவும் குறிப்புத்தன்மையும் உடையது.
- source_word: כַּדָּגָן
  choice: தானியத்தைப் போல
  rationale: דָּגָן தானிய விளைபொருளைக் குறிக்கிறது; ஒப்புமையைக் காட்டும் כְּ என்பதையும் தமிழ் இயல்பில் வெளிப்படுத்துகிறது.
- source_word: מִן הַגֹּרֶן
  choice: போரடிக்கும் களத்திலிருந்து கிடைக்கும்
  rationale: גֹּרֶן என்பது அறுவடைத் தானியத்தைப் போரடிக்கும் களம். ‘கிடைக்கும்’ என்பது அந்த இடத்திலிருந்து வரும் விளைபொருள் என்ற ஆகுபெயர்ச் சார்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְכַמְלֵאָה
  choice: நிறைவான விளைச்சலைப் போலவும்
  rationale: מְלֵאָה என்பதன் அடிப்படைப் பொருள் ‘நிறைவு’; இச்சூழலில் அது திராட்சை ஆலையின் முழு விளைவு அல்லது உற்பத்தியைக் குறிக்கிறது. சொல்லுக்குச் சொல் ‘நிறைவு’ என்பதைவிட ‘நிறைவான விளைச்சல்’ நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִן הַיָּקֶב
  choice: திராட்சை ஆலையிலிருந்து கிடைக்கும்
  rationale: יֶקֶב என்பது திராட்சையைப் பிழியும் ஆலை அல்லது அதனுடன் சேர்ந்த தொட்டியைக் குறிக்கலாம். வேளாண்மை சார்ந்த இணை அமைப்பில் ‘திராட்சை ஆலை’ பொருத்தமானது.
