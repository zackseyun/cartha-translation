translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வழிபாட்டு-சட்டச் சூழலின் செறிவும் காக்கப்பட்டுள்ளன. எபிரெய இணை அமைப்பு இயன்றவரை பேணப்பட்டு, இடத்தைக் கொண்டு விளைபொருளைக் குறிக்கும் ஆகுபெயர் ‘கிடைக்கும்’ என்பதன் மூலம் இயல்பான தமிழாகத் தெளிவாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
