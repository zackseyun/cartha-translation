revisions:
- from: ஆனால் நீயும் உன்னோடு உன் மகன்களும் பலிபீடம் தொடர்பான எல்லாவற்றிற்காகவும் திரைக்குள் இருப்பவற்றிற்காகவும் உங்கள் ஆசாரியப் பணியைக் காத்துக்கொண்டு, பணிசெய்ய வேண்டும். உங்கள் ஆசாரியப் பணியைப் பணிசெய்வதற்கான பரிசாக நான் தருகிறேன்[a]. அதிகாரம் பெறாத எவனாவது அருகில் வந்தால், அவன் கொல்லப்பட வேண்டும்[b].
  to: ஆனால், நீயும் உன்னோடிருக்கும் உன் மகன்களும், பலிபீடம் தொடர்பான ஒவ்வொரு காரியத்திலும் திரைக்குள் உள்ள காரியங்களிலும் உங்கள் ஆசாரியப் பணியைக் காத்துக்கொள்ள வேண்டும்; நீங்கள் பணிசெய்ய வேண்டும். உங்கள் ஆசாரியப் பணியைப் பரிசாக அளிக்கப்பட்ட சேவையாக நான் உங்களுக்குக் கொடுக்கிறேன்[a]. அனுமதியற்றவர்[b] அருகே வந்தால், அவர் கொல்லப்பட வேண்டும்.
  rationale: The revision retains the source’s scope, legal force, and cultic terminology, while using natural coordinated Tamil obligations. It renders the compressed gift/service expression without making one disputed syntactic relationship definitive, and it relocates the explanatory footnote to its proper lexical anchor.
