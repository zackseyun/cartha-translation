base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: ta
  text: ஆனால், நீயும் உன்னோடிருக்கும் உன் மகன்களும், பலிபீடம் தொடர்பான ஒவ்வொரு காரியத்திலும் திரைக்குள் உள்ள காரியங்களிலும் உங்கள் ஆசாரியப் பணியைக் காத்துக்கொள்ள வேண்டும்; நீங்கள் பணிசெய்ய வேண்டும். உங்கள் ஆசாரியப் பணியைப் பரிசாக அளிக்கப்பட்ட சேவையாக நான் உங்களுக்குக் கொடுக்கிறேன்[a]. அனுமதியற்றவர்[b] அருகே வந்தால், அவர் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் ஆசாரியப் பணியைச் சேவைக்கான பரிசாக நான் உங்களுக்குக் கொடுக்கிறேன்.” எபிரெயச் சொற்றொடர், சேவை பரிசாக அளிக்கப்படுகிறது என்பதையோ, ஆசாரியப் பணி சேவைக்காக அளிக்கப்பட்ட பரிசு என்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அனுமதியற்றவர்” என்பது இங்கு ஆசாரியப் பணிகளைச் செய்ய அனுமதி இல்லாத எவரையும் குறிக்கிறது; குறிப்பாக வெளிநாட்டவரை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: காத்துக்கொண்டு
  rationale: இங்கு வினைச்சொல் ஆசாரியப் பொறுப்பை விழிப்புடன் காத்து நிறைவேற்றுவதைக் குறிக்கிறது; ‘காத்துக்கொண்டு’ என்பது பாதுகாத்தல், பொறுப்பேற்றல் ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: כְּהֻנַּתְכֶם
  choice: உங்கள் ஆசாரியப் பணி
  rationale: ஆசாரிய நிலை மட்டுமல்லாமல் அதற்குரிய அலுவலையும் செயல்பாட்டையும் குறிக்கிறது; நவீன தமிழில் ‘ஆசாரியப் பணி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: பலிபீடம் தொடர்பான எல்லாவற்றிற்காகவும்
  rationale: דבר என்பதைக் குறிப்பிட்ட சடங்குகளாகச் சுருக்காமல், பலிபீடத்துடன் தொடர்புடைய அனைத்து காரியங்களையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: திரைக்குள் இருப்பவற்றிற்காகவும்
  rationale: திரையின் உள்புறத்திலுள்ள பரிசுத்த இடத்தையும் அதற்குரிய பணிகளையும் சுட்டுகிறது; மூலத்தின் இடவியல் சுருக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וַעֲבַדְתֶּם
  choice: பணிசெய்ய வேண்டும்
  rationale: வழிபாட்டுச் சூழலில் ஆசாரிய சேவையைச் செய்வதைக் குறிக்கிறது; பிற்கால சமயப் பதவிச்சொற்களைப் புகுத்தாமல் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: உங்கள் ஆசாரியப் பணியைப் பணிசெய்வதற்கான பரிசாக நான் தருகிறேன்
  rationale: ‘பணி’ மற்றும் ‘பரிசு’ ஆகிய இரு கூறுகளையும் தக்கவைத்து, ஆசாரியப் பணி இறைவனால் அருளப்பட்ட பொறுப்பு என்ற கருத்தை வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் உறவு வேறு விதமாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: הַזָּר
  choice: அதிகாரம் பெறாத எவனாவது
  rationale: இது இன ரீதியான அந்நியரை அல்ல, ஆசாரியப் பணியைச் செய்ய அனுமதி பெறாத நபரைச் சுட்டுகிறது; இத்தேர்வு தவறான இனவியல் புரிதலைத் தவிர்க்கிறது.
- source_word: הַקָּרֵב
  choice: அருகில் வந்தால்
  rationale: கட்டுப்படுத்தப்பட்ட பரிசுத்த இடம் அல்லது பணியை அணுகுவதைக் குறிக்கும் கரב என்ற வினையின் இடவியல் மற்றும் வழிபாட்டுச் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: ஹோஃபால் வடிவம் வெறும் மரண முன்னறிவிப்பை அல்லாமல், சட்டரீதியாக மரணத்துக்கு உட்படுத்தப்படுவதைச் சுட்டுகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் זָר என்பதன் பொருள்
  choice: அதிகாரம் பெறாத எவனாவது
  alternative: அந்நியன்; வெளிநபர்; ஆசாரியர் அல்லாதவர்
  rationale: தடைசெய்யப்பட்ட ஆசாரியப் பணியை அணுக அதிகாரமில்லாத ஒருவரே இங்கு குறிக்கப்படுகிறார்; இன அல்லது தேசிய அந்நியத்தன்மை தேவையின்றி புகுத்தப்படவில்லை.
- issue: עֲבֹדַת מַתָּנָה என்ற சுருக்கமான சொற்றொடரின் தொடர்பு
  choice: ஆசாரியப் பணி, பணிசெய்வதற்காக வழங்கப்பட்ட பரிசு
  alternative: பரிசாக வழங்கப்பட்ட பணி; பரிசுப் பணி
  rationale: பணி தானே பரிசா அல்லது ஆசாரியத்துவம் பணிக்காக அளிக்கப்பட்ட பரிசா என்பது இலக்கண ரீதியாகச் சற்றுத் திறந்துள்ளது; முதன்மை உரை இயல்பான ஒரு வாசிப்பைத் தருகிறது, அடிக்குறிப்பு மாற்று உறவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பின்பற்றுகிறது. ‘ஆசாரியப் பணி’, ‘பலிபீடம்’, ‘திரை’ போன்ற பரவலாக அறியப்பட்ட வழிபாட்டுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தில் உள்ள கட்டளை/கடமைத் தன்மை ‘வேண்டும்’ என்பதாலும், சட்டரீதியான தண்டனை ‘கொல்லப்பட வேண்டும்’ என்பதாலும் வெளிப்படுத்தப்பட்டுள்ளது.
