review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the altar duties, the area within the veil, the divinely granted priesthood, unauthorized approach, and the legal death penalty. However, its rendering of the gift/service phrase is syntactically awkward and somewhat over-specifies the relationship as a gift 'for doing service.'
  naturalness: Several phrases are unnecessarily repetitive or uneven in modern Tamil, especially “ஆசாரியப் பணியைப் பணிசெய்வதற்கான பரிசாக.” The participial “காத்துக்கொண்டு, பணிசெய்ய வேண்டும்” also reads less naturally than coordinated finite obligations.
  terminology: “பலிபீடம்,” “திரை,” and “ஆசாரியப் பணி” are suitable. “அனுமதியற்றவர்” is more idiomatic and inclusive than “அதிகாரம் பெறாத எவனாவது,” while retaining the technical sense of זָר as a person unauthorized for priestly service.
  issues:
  - severity: medium
    issue: The rendering of עֲבֹדַת מַתָּנָה is awkward and narrows an ambiguous construct relationship.
    rationale: “பணிசெய்வதற்கான பரிசாக” makes the gift explicitly a means for performing service. The Hebrew can instead characterize the service as a gift or the priesthood as a gift-service. A less interpretively narrow main text and a footnote should preserve this ambiguity.
  - severity: medium
    issue: The main clause is stylistically strained.
    rationale: “காத்துக்கொண்டு, பணிசெய்ய வேண்டும்” uses a participle followed by a finite obligation where the Hebrew has coordinated verbal obligations. Finite coordinated Tamil clauses are clearer.
  - severity: low
    issue: The footnote marker for the unauthorized person is placed after the death-penalty clause.
    rationale: Since the note explains זָר, it should be anchored directly to “அனுமதியற்றவர்” rather than to “கொல்லப்பட வேண்டும்.”
  revised_text: ஆனால், நீயும் உன்னோடிருக்கும் உன் மகன்களும், பலிபீடம் தொடர்பான ஒவ்வொரு காரியத்திலும் திரைக்குள் உள்ள காரியங்களிலும் உங்கள் ஆசாரியப் பணியைக் காத்துக்கொள்ள வேண்டும்; நீங்கள் பணிசெய்ய வேண்டும். உங்கள் ஆசாரியப் பணியைப் பரிசாக அளிக்கப்பட்ட சேவையாக நான் உங்களுக்குக் கொடுக்கிறேன்[a]. அனுமதியற்றவர்[b] அருகே வந்தால், அவர் கொல்லப்பட வேண்டும்.
