lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னார்
  rationale: வாவ்-தொடருடன் வரும் דִּבֵּר புதிய உரையாடல் படியை அறிமுகப்படுத்துகிறது. தமிழில் அடுத்துவரும் நேரடிக் கூற்றை இயல்பாக அறிமுகப்படுத்த ‘பேசிச் சொன்னார்’ என்பது செயற்பாட்டின் பொருளையும் சூத்திரத் தொடரையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழ்ச் சொல்லுருபால் காட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் நிலைபெற்ற நவீனத் தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்துவரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய வினையெச்சச் சூத்திரத்தை இயல்பான தமிழ் உரைநடையில் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம உரைக்கேற்ற கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை. வசனம் அடுத்துவரும் நேரடிப் பேச்சை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
