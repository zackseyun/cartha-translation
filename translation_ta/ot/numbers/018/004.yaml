  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: ta
  text: அவர்கள் உன்னோடு இணைந்து, கூடாரத்தின் எல்லாச் சேவைகளையும் செய்வதற்காகச் சந்திப்புக் கூடாரத்தின் காவல் பொறுப்பை மேற்கொள்ள வேண்டும். ஆனால் அனுமதியற்ற எவரும்[a] உங்களிடம் நெருங்கி வரக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியாள் எவரும்.” இங்குள்ள எபிரெயச் சொல் இனத்தால் வேற்றினத்தவரை அவசியம் குறிக்காது; பரிசுத்த இடத்துக்குரிய அனுமதிக்கப்பட்ட பணிக்கு வெளியே இருப்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: அவர்கள் உன்னோடு இணைந்து
  rationale: נלוה உடன் வரும் על, ஆரோனோடு இணைந்து துணைச் சேவை செய்வதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் உறவையும் பணிசார் இணைப்பையும் இது தக்கவைக்கிறது.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: பொறுப்பைக் காத்துக்கொள்ள வேண்டும்
  rationale: ஆசரிப்புக்கூடாரச் சூழலில் இந்தச் சொற்றொடர் ஒப்படைக்கப்பட்ட கடமை அல்லது காவற்பொறுப்பை நிறைவேற்றுவதைக் குறிக்கிறது; 'பொறுப்பு' மற்றும் 'காத்துக்கொள்ளுதல்' ஆகியவை அதன் இரு கூறுகளையும் வெளிப்படுத்துகின்றன.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவனுக்கும் மக்களுக்கும் இடையிலான நியமிக்கப்பட்ட சந்திப்பிடத்தைக் குறிக்கும் பெயரை நேரடியாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: சந்திப்புக் கூடாரத்தின் எல்லாப் பணிகளுக்காகவும்
  rationale: עֲבֹדָה இங்கு வழிபாட்டிடத்துக்குரிய ஒதுக்கப்பட்ட சேவைப் பணிகளைச் சுட்டுகிறது. 'எல்லாப் பணிகள்' என்பது இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: וְזָר
  choice: ஆனால் அதிகாரம் பெறாத எவரும்
  rationale: זָר இங்கு இன அடிப்படையிலான அந்நியரை அல்ல, பரிசுத்த இடத்தை அணுக அனுமதிக்கப்படாதவரைக் குறிக்கிறது. இந்தத் தேர்வு சூழல்சார் அதிகாரமின்மையைத் தெளிவாக்குகிறது.
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: உங்களிடம் நெருங்கி வரக்கூடாது
  rationale: קרב பரிசுத்த இடம் சார்ந்த அணுகுதலைக் குறிக்கிறது; அֲלֵיכֶם பன்மையைத் தமிழின் 'உங்களிடம்' வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசரிப்புக்கூடாரச் சட்டத்தில் זָר என்பதன் பொருள்
  choice: அனுமதிக்கப்பட்ட ஆசாரிய/லேவியப் பணிக்கான அதிகாரம் பெறாதவர்
  alternative: அந்நியர் அல்லது வேற்றினத்தவர்
  rationale: சூழல் இன அடையாளத்தைப் பற்றியது அல்ல; பரிசுத்தப் பணியையும் அணுகும் உரிமையையும் பற்றியது. ஆகவே இனப்பொருளைத் தவிர்த்து, அதிகாரமின்மையை முதன்மைப்படுத்துவது மூலத்தின் நோக்கத்துக்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வாசிக்க எளிதான, கண்ணியமான நடை. ஒருமை 'உன்னோடு' மற்றும் பன்மை 'உங்களிடம்' ஆகிய மூலமொழியின் எண்ணிக்கை மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
