  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: ta
  text: லேவியின் மக்களுக்கு, இதோ, இஸ்ரவேலில் உள்ள எல்லாப் பத்திலொன்றையும், சந்திப்புக் கூடாரத்தின் பணியை அவர்கள் செய்வதற்குப் பதிலாக[a], அவர்களுடைய சுதந்தரப் பங்காகக் கொடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பதிலாக” என்பதை “அவர்களுடைய பணிக்கு ஈடாக” அல்லது “அவர்களுடைய பணிக்கான ஈடாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: லேவியின் மக்களுக்கோ
  rationale: எபிரெய மொழியின் வம்சவழிக் கூறான ‘லேவியின் மக்களுக்கு’ என்பதைப் பாதுகாக்கிறது; சூழலில் இயல்பான தலைப்புமாற்றத்தை ‘-க்கோ’ வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்துவரும் தெய்வீக அறிவிப்பின்மீது கவனத்தை ஈர்க்கும் வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்டும் தொடர்ந்து செல்லுபடியாகியும் இருக்கும் கொடையை எபிரெய நிறைவுவினையின் சூழல்சார் பொருளுக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் கொடுக்கப்படும் எல்லாப் பத்திலொன்றையும்
  rationale: מַעֲשֵׂר என்பதன் ‘பத்திலொரு பங்கு’ என்ற பொருளையும் כָּל என்பதன் மொத்த உள்ளடக்கத்தையும் தெளிவாகக் காட்டுகிறது; ‘கொடுக்கப்படும்’ என்பது தமிழில் இங்கு குறிக்கப்படும் பத்திலொன்று காணிக்கையை இயல்பாக விளக்குகிறது.
- source_word: לְנַחֲלָה
  choice: அவர்களுடைய உரிமைப் பங்காக
  rationale: நிலப்பங்கோடு தொடர்புடைய நியமிக்கப்பட்ட சுதந்தர/உடைமைப் பங்கை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் தனிப்பட்ட சொத்தாகச் சுருக்கவில்லை.
- source_word: חֵלֶף
  choice: பதிலாக
  rationale: பணி செய்ததற்குப் பிரதியாக அல்லது ஈடாக வழங்கப்படுதல் என்ற பரிமாற்றப் பொருளைப் பாதுகாக்கிறது; மிக வணிகரீதியான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: அவர்கள் செய்யும் பணி
  rationale: எபிரெயிலுள்ள ஒரே வேர் சார்ந்த பெயர்ச்சொல்–வினைச்சொல் அமைப்பைத் தமிழில் புரியத்தக்கவாறு தருகிறது; வழிபாட்டுச் சூழலைக் குறுக்காமல் ‘பணி’ என்ற பரந்த சொல்லைப் பயன்படுத்துகிறது.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் பணி
  rationale: கூடாரத்துடன் தொடர்புடைய கடமைகள் என்ற எபிரெய கட்டமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; ‘சந்திப்புக் கூடாரம்’ אֹהֶל מוֹעֵד என்பதன் நோக்கத்தை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: லேவியருக்கான பத்திலொன்றின் தன்மை
  choice: பத்திலொன்று அவர்களுடைய உரிமைப் பங்காகவும் அவர்கள் செய்யும் கூடாரப் பணிக்குப் பதிலாகவும் வழங்கப்படுகிறது.
  alternative: அது சேவைக்கான ஈடு என்ற வலியுறுத்தல் இல்லாமல் வெறுமனே லேவியருக்கு ஒதுக்கப்படுகிறது.
  rationale: לְנַחֲלָה மற்றும் חֵלֶף עֲבֹדָתָם ஆகிய இரு கூறுகளையும் வசனம் வெளிப்படையாக இணைக்கிறது. மொழிபெயர்ப்பு உரிமைப் பங்கையும் பணிக்குப் பிரதியாக வழங்கப்படுவதையும் ஒன்றாகப் பாதுகாக்கிறது.
- issue: ‘பணி’ என்பதன் வழிபாட்டுச் சார்பு
  choice: முதன்மை உரையில் ‘சந்திப்புக் கூடாரத்தின் பணி’ என்று கூறி அதன் குறிப்பிட்ட பண்பைத் தெளிவாக்குதல்.
  alternative: ‘ஊழியம்’ என்று மொழிபெயர்த்து பின்னைய சமய அல்லது திருச்சபைச் சொல்லாட்சியைப் பயன்படுத்துதல்.
  rationale: עֲבֹדָה உழைப்பு, சேவை, வழிபாட்டுக் கடமை ஆகிய பரப்பைக் கொண்டது. ‘பணி’ மூலத்தின் பரப்பைத் திறந்தவாறு வைத்திருக்கிறது; கூடாரச் சூழல் அதன் சமயத் தன்மையைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் எளிமையும் பேணப்பட்டுள்ளது. மூலத்தின் நீளமான அமைப்பு தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாவது வாக்கியத்தின் ‘அதை’ முதல் வாக்கியத்திலுள்ள பத்திலொன்றைக் குறிக்கிறது. ‘லேவியின் மக்கள்’ என்ற வம்சவழிக் கூறும், ‘இதோ’ என்ற வலியுறுத்தலும், உரிமைப் பங்கு மற்றும் பணிக்குப் பதிலான கொடை என்ற இரட்டை கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
