revisions:
- from: லேவியின் மக்களுக்கோ, இதோ, இஸ்ரவேலில் கொடுக்கப்படும் எல்லாப் பத்திலொன்றையும் அவர்களுடைய உரிமைப் பங்காகக் கொடுத்திருக்கிறேன். சந்திப்புக் கூடாரத்தின் பணியாகிய அவர்கள் செய்யும் பணிக்குப் பதிலாக அதை அவர்களுக்குக் கொடுத்திருக்கிறேன்.[a]
  to: லேவியின் மக்களுக்கு, இதோ, இஸ்ரவேலில் உள்ள எல்லாப் பத்திலொன்றையும், சந்திப்புக் கூடாரத்தின் பணியை அவர்கள் செய்வதற்குப் பதிலாக[a], அவர்களுடைய சுதந்தரப் பங்காகக் கொடுத்திருக்கிறேன்.
  rationale: திருத்தப்பட்ட உரை நָתַתִּי என்னும் ஒரே வினையை ஒருமுறையே மொழிபெயர்க்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொடுக்கப்படும்’ என்ற விளக்கத்தையும் நீக்குகிறது. ‘சந்திப்புக் கூடாரத்தின் பணியை அவர்கள் செய்வதற்குப் பதிலாக’ என்பது חֵלֶף עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים אֶת עֲבֹדַת אֹהֶל מוֹעֵד என்ற தொடரில் உள்ள பணி, அதைச் செய்வோர், மற்றும் கூடாரத் தொடர்பு ஆகியவற்றைப் பாதுகாக்கிறது. ‘சுதந்தரப் பங்காக’ லְנַחֲלָה-வின் மரபுரிமை/ஒதுக்கீட்டுச் சொல்லாட்சியைத் தக்கவைக்கிறது.
