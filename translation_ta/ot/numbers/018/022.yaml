  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் இனி சந்திப்புக் கூடாரத்தை நெருங்கக் கூடாது; நெருங்கினால் அவர்கள் பாவத்தைச் சுமந்து சாவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றப்பொறுப்பைச் சுமந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொற்படியாக ‘பாவத்தைச் சுமந்து’ என்று உள்ளது; இது தவறுக்கான பொறுப்பை அல்லது அதனால் வரும் தண்டனைக்குரிய நிலையை ஏற்றுக்கொள்வதைக் குறிக்கும் ஆசாரச் சட்ட வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: நெருங்கக் கூடாது
  rationale: קרב என்பது ‘நெருங்குதல்/அணுகுதல்’ என்று பொருள்படும். பரிசுத்த இடத்தை அணுகும் வழிபாட்டுச் சூழலையும் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘நெருங்கு’ வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: இனி
  rationale: לֹא என்பதுடன் עוֹד சேர்ந்திருப்பதால் ‘இனிமேல் இல்லை/இனி வேண்டாம்’ என்ற பொருள் வருகிறது; தடை வாக்கியத்தில் ‘இனி ... கூடாது’ இயல்பான நவீனத் தமிழ்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது இஸ்ரவேல் சமூகத்தாரைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் இங்கு தேவையற்ற ஆண்பால் வரம்பையும் இயல்பற்ற நடையையும் உருவாக்கும்; ‘இஸ்ரவேல் மக்கள்’ மூலத்தின் கூட்டுப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: אֹהֶל என்பது ‘கூடாரம்,’ מוֹעֵד இங்கு தேவன் சந்திக்கும் நியமிக்கப்பட்ட இடத்தைக் குறிக்கிறது. ‘சந்திப்புக் கூடாரம்’ எபிரெயச் சொல்லமைப்பை வெளிப்படையாகவும் புரியத்தக்கவாறும் தருகிறது.
- source_word: לָשֵׂאת חֵטְא
  choice: பாவத்தைச் சுமந்து
  rationale: எபிரெயில் சொற்படியாக ‘பாவத்தைச் சுமத்தல்’ என்பதே உள்ளது. இது குற்றத்திற்கான பொறுப்பு அல்லது தண்டனைக்குரிய நிலையை ஏற்றுக்கொள்வதைக் குறிக்கக்கூடிய ஆசார/சட்ட வழக்கு; உருவகத்தை முதன்மை உரையில் பாதுகாத்துள்ளோம்.
- source_word: לָמוּת
  choice: சாவார்கள்
  rationale: முந்தைய வினையெச்சத்துடன் இணைந்து வரும் மரண விளைவைத் தெளிவாகக் காட்டுகிறது. எபிரெயின் எச்சரிக்கைத் தொடரை தமிழில் இயல்பாக்க ‘நெருங்கினால் ... சாவார்கள்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: பரிசுத்த இடத்தை அனுமதியின்றி அணுகுவதையும் அதனால் வரும் குற்றப்பொறுப்பையும் மொழிபெயர்ப்பில் வெளிப்படையாக விளக்க வேண்டுமா?
  choice: ‘பாவத்தைச் சுமந்து சாவார்கள்’ என்ற எபிரெயின் சுருக்கமான சட்ட-ஆசார மொழியைப் பாதுகாத்தல்
  alternative: ‘குற்றத்திற்கு ஆளாகிச் சாவார்கள்’ அல்லது ‘பாவத்தின் தண்டனையைச் சுமந்து சாவார்கள்’
  rationale: உடனடிச் சூழலில் லேவியர்/ஆசாரியருக்குரிய பரிசுத்தப் பணியின் எல்லையைப் பொதுவான இஸ்ரவேலர் மீறி நெருங்குவதை வசனம் தடுக்கிறது. ஆனால் மூல உரை ‘அனுமதியின்றி’ அல்லது ‘தண்டனை’ என்று நேரடியாகச் சொல்லாததால் அவற்றை முதன்மை உரையில் சேர்க்காமல், ‘பாவத்தைச் சுமத்தல்’ என்ற இறையியல் மற்றும் சட்டத் திணிவை அப்படியே வைத்துள்ளோம்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தடையை ‘இனி ... கூடாது’ என்றும், அதன் விளைவை ‘நெருங்கினால்’ என்றும் இயல்பாக இணைத்துள்ளோம். ‘சாவார்கள்’ என்பது நேரடியான மூலப் பொருளைத் தருகிறது; ‘மரணமடைவார்கள்’ என்பதைவிட எச்சரிக்கையின் சுருக்கத்தையும் தீவிரத்தையும் காக்கிறது.
