  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: ta
  text: அவர்களுடைய கொடைகளிலிருந்து ஒதுக்கப்பட்ட பங்கும்[a], இஸ்ரவேல் மக்களின் அசைவாட்டுக் காணிக்கைகள் அனைத்தும் உனக்குரியவை. அவற்றை உனக்கும், உன்னோடு இருக்கும் உன் மகன்களுக்கும் உன் மகள்களுக்கும் நிரந்தர நியமமாகக் கொடுத்திருக்கிறேன். உன் குடும்பத்தில் தூய்மையானவர்[b] எவரும் அதை உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒதுக்கப்பட்ட பங்கு’ என்பதற்கு ‘உயர்த்திப் படைக்கப்படும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரிசுத்தப் பயன்பாட்டுக்காகத் தனியே ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘தூய்மையானவர்’ என்பது சடங்குமுறைப்படி தூய்மையானவரைக் குறிக்கிறது; வெறும் உடல் சுத்தத்தையோ ஒழுக்க நேர்மையையோ மட்டும் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: அவர்களுடைய காணிக்கைகளில் ஒதுக்கப்பட்ட பங்கு
  rationale: תְּרוּמָה என்பது பரிசுத்த பயன்பாட்டுக்காகத் தனியே ஒதுக்கப்படும் பங்கைக் குறிக்கிறது; מַתָּנָם என்பதிலுள்ள ‘அவர்களுடைய கொடைகள்’ என்ற பொருளை இச்சூழலில் இயல்பான ‘அவர்களுடைய காணிக்கைகள்’ என வழங்குகிறது.
- source_word: תְּנוּפֹת
  choice: அசைவாட்டுக் காணிக்கைகள்
  rationale: இது கடவுளின் முன்னிலையில் சடங்குமுறையாக அசைத்துப் படைக்கப்படும் காணிக்கைக்கான தொழில்நுட்பச் சொல்; அந்தச் சடங்குச் செயலைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய வழக்கிலுள்ள கூட்டுப்பெயர் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது; நவீனத் தமிழில் ‘மக்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נְתַתִּים
  choice: அவற்றைக் ... கொடுத்திருக்கிறேன்
  rationale: முன்னர் குறிப்பிடப்பட்ட பங்குகளைக் குறிக்கும் பன்மைச் சுட்டையும், முடிவுற்ற கொடை தற்போதும் செல்லுபடியாகும் பொருளையும் காக்கிறது.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: உன்னோடு இருக்கும் உன் மகன்களுக்கும் உன் மகள்களுக்கும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது; ‘உன்னோடு இருக்கும்’ என்பது ஆரோனின் குடும்ப வட்டத்தைக் குறிக்கிறது.
- source_word: לְחָק עוֹלָם
  choice: நிரந்தர நியமமாக
  rationale: חֹק என்பதன் சட்டபூர்வமான ஒழுங்கையும் עוֹלָם என்பதன் தொடரும் நிலைத்தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: உன் குடும்பத்தில் தூய்மையானவர் எவரும்
  rationale: בַּיִת இங்கு கட்டடத்தைவிட குடும்பத்தாரைக் குறிக்கிறது; טָהוֹר என்பதன் சடங்குமுறைத் தூய்மை அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: יֹאכַל אֹתוֹ
  choice: அதை உண்ணலாம்
  rationale: இங்கு வினை அனுமதிக்கப்பட்ட உரிமையை வெளிப்படுத்துகிறது. ஒருமைச் சுட்டான אֹתוֹ-ஐ ‘அதை’ என்று காக்கிறது.
theological_decisions:
- issue: சடங்குமுறைத் தூய்மை
  choice: முதன்மை உரையில் ‘தூய்மையானவர்’ என்று மொழிபெயர்த்து, அடிக்குறிப்பில் சடங்குமுறைப் பொருளைத் தெளிவாக்குதல்
  alternative: ஒழுக்கத்தில் தூயவர்; உடல் அழுக்கில்லாதவர்
  rationale: ஆசாரியச் சட்டச் சூழலில் טָהוֹר என்பது பரிசுத்தப் பங்குகளை உண்பதற்குத் தேவையான சடங்குமுறைத் தூய நிலையைக் குறிக்கிறது; இது வெறும் உடல் சுத்தமோ ஒழுக்க நற்பண்போ அல்ல.
- issue: עוֹלָם என்பதன் காலப் பொருள்
  choice: நிரந்தர நியமம்
  alternative: முடிவில்லாத நியமம்; தலைமுறைதோறும் நிலைக்கும் உரிமை
  rationale: இச்சொல் உடன்படிக்கைச் சட்ட ஒழுங்கில் தொடர்ந்து நிலைக்கும் ஏற்பாட்டைக் குறிக்கிறது. கால எல்லையைப் பற்றிய மேலதிக கோட்பாட்டு முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ஆசாரியச் சட்டத்துக்குரிய ‘அசைவாட்டுக் காணிக்கை’, ‘நியமம்’, ‘தூய்மை’ ஆகிய கருத்துகள் துல்லியமாக வைக்கப்பட்டுள்ளன; தேவையான இடங்களில் அடிக்குறிப்புகள் தொழில்நுட்பப் பொருளை விளக்குகின்றன.
