- from: அவர்களுடைய காணிக்கைகளில் ஒதுக்கப்பட்ட பங்கும்[a], இஸ்ரவேல் மக்களின் அசைவாட்டுக் காணிக்கைகள் அனைத்தும் உனக்குரியவை. அவற்றை உனக்கும், உன்னோடு இருக்கும் உன் மகன்களுக்கும் உன் மகள்களுக்கும் நிரந்தர நியமமாகக் கொடுத்திருக்கிறேன். உன் குடும்பத்தில் தூய்மையானவர்[b] எவரும் அதை உண்ணலாம்.
  to: அவர்களுடைய கொடைகளிலிருந்து ஒதுக்கப்பட்ட பங்கும்[a], இஸ்ரவேல் மக்களின் அசைவாட்டுக் காணிக்கைகள் அனைத்தும் உனக்குரியவை. அவற்றை உனக்கும், உன்னோடு இருக்கும் உன் மகன்களுக்கும் உன் மகள்களுக்கும் நிரந்தர நியமமாகக் கொடுத்திருக்கிறேன். உன் குடும்பத்தில் தூய்மையானவர்[b] எவரும் அதை உண்ணலாம்.
  rationale: A limited lexical revision distinguishes “gifts” (מַתָּנָם) from the technical sacrificial terminology used elsewhere in the verse, while retaining the established rendering for the wave offerings and preserving all grammatical and legal relationships in the Hebrew.
