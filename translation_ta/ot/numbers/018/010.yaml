source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: ta
  text: மிகப் பரிசுத்தமான இடத்தில் அதை நீ சாப்பிட வேண்டும்[a]. ஒவ்வொரு ஆணும் அதைச் சாப்பிடலாம். அது உனக்குப் பரிசுத்தமானதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “பரிசுத்தங்களின் பரிசுத்தத்தில்.” இங்கு இச்சொற்றொடர், மிகப் பரிசுத்தமானதாக வகைப்படுத்தப்பட்டதை ஆசாரியர்கள் உண்ணுவதற்கென நியமிக்கப்பட்ட பரிசுத்த இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: மிகப் பரிசுத்தமான இடத்தில்
  rationale: בְּ என்ற முன்னொட்டின் இடத்தைக் குறிக்கும் பொருளையும், ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற எபிரெய உயர்நிலை மரபுத்தொடரையும் இயல்பான தமிழில் தருகிறது. ‘மகா பரிசுத்த ஸ்தலத்தில்’ என்பது உள்ளறையை மட்டும் குறிக்கிறது என்ற தவறான எண்ணத்தை உண்டாக்கக்கூடும்.
- source_word: תֹּאכֲלֶנּוּ
  choice: அதை நீ சாப்பிட வேண்டும்
  rationale: ஆரோனை நோக்கிய இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தையும், ஆசாரியச் சட்டத்தின் கட்டளைத் தன்மையையும் காக்கிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: உண்ணத் தகுதியுடையவர்களைப் பாலின அடிப்படையில் வரையறுக்கும் எபிரெயச் சொல்லைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יֹאכַל אֹתוֹ
  choice: அதைச் சாப்பிடலாம்
  rationale: இங்கு வினை வடிவம் தகுதியுள்ள ஆண்களுக்கு வழங்கப்படும் அனுமதியைச் சுட்டுகிறது; ‘சாப்பிட வேண்டும்’ என்று மீண்டும் மொழிபெயர்த்தால் அனைவருக்கும் தனித்த கட்டளை போலத் தோன்றலாம்.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: அது உனக்குப் பரிசுத்தமானதாக இருக்கும்
  rationale: קֹדֶשׁ என்ற முக்கிய வழிபாட்டு சொல்லை ‘பரிசுத்தம்’ எனத் தொடர்ந்து வழங்கி, ஆரோனுடனான அதன் பரிசுத்த நிலையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரிய அறிவுரையின் முகவரியும் அதன் பயன்பாடும்
  choice: ஒருமையில் ஆரோன் நேரடியாக அழைக்கப்படுகிறார்; அடுத்த வாக்கியம் தகுதியுள்ள ஆண்கள் அனைவருக்கும் உண்ணும் அனுமதி இருப்பதைத் தெளிவுபடுத்துகிறது.
  alternative: இந்த ஒருமை வடிவம் ஆரோனுக்கு மட்டுமே உரியதாக வாசிக்கப்படலாம்.
  rationale: உடனடிச் சூழல் ஆரோனுக்கும் அவன் மகன்களுக்கும் வழங்கப்பட்ட ஆசாரியப் பங்குகளைப் பற்றியது. ‘நீ’ என்ற ஒருமையைப் பாதுகாப்பது மூல வடிவத்தை மதிக்கிறது; ‘ஆண்கள் அனைவரும்’ என்பது அதன் விரிந்த ஆசாரியப் பயன்பாட்டைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட/வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘நீ’ என்பது மூலத்தின் ஒருமை முகவரியைப் பாதுகாக்கிறது; ‘சாப்பிட வேண்டும்/சாப்பிடலாம்’ என்ற வேறுபாடு கட்டளையையும் அனுமதியையும் தெளிவாகப் பிரிக்கிறது.
