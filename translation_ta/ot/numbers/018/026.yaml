base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: ta
  text: 'லேவியர்களிடம் நீ பேசி, அவர்களிடம் சொல்: “இஸ்ரவேல் மக்களிடமிருந்து நான் உங்களுக்கு உங்கள் உரிமைப் பங்காகக் கொடுத்த பத்தில் ஒரு பங்கை நீங்கள் பெறும்போது, அதிலிருந்து யாவேக்குரிய காணிக்கையாகப் பத்தில் ஒரு பங்கைச் செலுத்த வேண்டும்; அது பத்தில் ஒரு பங்கிலிருந்து ஒரு பத்தில் ஒரு பங்கு.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேக்குரிய காணிக்கை” என்பதை “யாவேக்கான காணிக்கை” என்றும் மொழிபெயர்க்கலாம். “பத்தில் ஒரு பங்கிலிருந்து ஒரு பத்தில் ஒரு பங்கு” என்பது லேவியர்கள் பெற்ற பத்தில் ஒரு பங்கில் பத்தில் ஒரு பகுதியைக் குறிக்கிறது.
    reason: תְּרוּמַת יְהוָה என்பதிலுள்ள உரிமை/இலக்கு உறவின் நுட்பத்தையும், מַעֲשֵׂר מִן־הַמַּעֲשֵׂר என்பதன் பகுதியெடுக்கும் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தாரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் பெயர்.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: நீ பேசி, அவர்களிடம் சொல்ல வேண்டியது
  rationale: எபிரெய சட்ட அறிவுறுத்தலிலுள்ள இரு வினைச்சொற்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כִּי תִקְחוּ
  choice: நீங்கள் பெற்றுக்கொள்ளும்போது
  rationale: இங்கு כִּי காரணத்தை அல்ல, கட்டளை பொருந்தும் காலச்சூழலை அறிமுகப்படுத்துகிறது; லேவியர்கள் பங்கைப் பெறுவதையே சூழல் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது உடன்படிக்கை மக்களுக்கான வழக்கமான குழுப்பெயர்; நவீன தமிழில் ‘மக்கள்’ இயல்பாகவும் உள்ளடக்கத் துல்லியத்துடனும் உள்ளது.
- source_word: הַמַּעֲשֵׂר
  choice: பத்திலொரு பங்கு
  rationale: கட்டாயமாக அளிக்கப்படும் பத்தில் ஒரு பகுதியை சாதாரண வாசகருக்கு உடனடியாக விளங்குமாறு குறிக்கிறது.
- source_word: בְּנַחֲלַתְכֶם
  choice: உங்களுக்குச் சொந்தப் பங்காக
  rationale: லேவியர்களுக்குக் கொடுக்கப்பட்ட வாரிசுரிமைப் பங்கை, நில வாரிசுரிமை எனத் தவறாகக் குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַהֲרֵמֹתֶם
  choice: செலுத்த வேண்டும்
  rationale: வழிபாட்டு/காணிக்கைச் சூழலில் பிரித்தெடுத்து யாவேக்கு அளிக்கும் செயலைத் தெளிவாகக் குறிக்கிறது; பொருளற்ற சொல்லடி ‘உயர்த்துதல்’ தவிர்க்கப்படுகிறது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேக்கான காணிக்கை
  rationale: תְּרוּמָה என்பது பிரித்தளிக்கப்படும் பங்கு அல்லது காணிக்கை; எபிரெய இணைப்பின் இலக்கு/உரிமைத் தெளிவின்மையை முடிந்தவரை இயல்பாகக் காட்டுகிறது.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: பத்திலொரு பங்கிலிருந்து ஒரு பத்திலொரு பங்கு
  rationale: מִן என்பதன் பகுதியெடுக்கும் பொருளைத் தக்கவைத்து, பெறப்பட்ட பத்திலொரு பங்கில் பத்தில் ஒன்றை அளிக்க வேண்டும் என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிப்பெயர்ப்பால் தருகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தில் இலக்கண ரீதியாக ஆண்பால் வடிவம் இருந்தாலும், இச்சொற்றொடர் மொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபுப்பெயர்; தமிழில் ‘மக்கள்’ என்பதே பொருளை இயல்பாகவும் தவறான பாலினக் கட்டுப்பாடின்றியும் தருகிறது.
- issue: תְּרוּמַת יְהוָה என்பதிலுள்ள உறவின் வகை
  choice: யாவேக்கான காணிக்கை
  alternative: யாவேயின் காணிக்கை
  rationale: எபிரெய இணைப்பு உரிமையையோ இலக்கையையோ குறிக்கக்கூடும். இச்சூழலில் யாவேக்காகப் பிரித்தளிக்கும் பங்கு என்ற வாசிப்பு இயல்பானது; மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை. ஒருமையில் மோசேயை நோக்கும் ‘நீ’ என்பதும், பன்மையில் லேவியர்களை நோக்கும் ‘நீங்கள்’ என்பதும் மூலத்தின் எண்ணிக்கை வேறுபாட்டுக்கு ஏற்ப தக்கவைக்கப்பட்டுள்ளன. ‘தசமபாகம்’ என்ற திருச்சபைச் சொல் தவிர்க்கப்பட்டு, பொதுவாசகருக்கு வெளிப்படையான ‘பத்திலொரு பங்கு’ பயன்படுத்தப்பட்டுள்ளது.
