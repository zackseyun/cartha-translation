  choice: சந்திப்புக் கூடாரத்தின் பணியைச் செய்வதற்காக
  rationale: עבד வினையும் עֲבֹדָה பெயர்ச்சொல்லும் குறிக்கும் வழிபாட்டுப் பணியைத் தெளிவாகத் தருகிறது; எபிரெயச் சொல் மீளுருவாக்கத்தை அசட்டான தமிழாக மாற்றாமல் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
