  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: ta
  text: “நானோ, இதோ, உங்கள் சகோதரர்களான லேவியர்களை இஸ்ரவேலின் மக்களிடையிலிருந்து[a] எடுத்திருக்கிறேன். அவர்கள் உங்களுக்கு ஓர் அன்பளிப்பாக வழங்கப்பட்டு, சந்திப்புக் கூடாரத்தின் பணியைச் செய்வதற்காக யாவேக்குக் கொடுக்கப்பட்டவர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இஸ்ரவேலின் புதல்வர்களிடையிலிருந்து.”
    reason: எபிரெய בְּנֵי יִשְׂרָאֵל என்பதன் சொற்சொல் வடிவத்தைத் தெரிவித்து, பிரதான உரையிலுள்ள இயல்பான மரபுத்தொடர் மொழிபெயர்ப்புக்கு ஆதாரமளிக்கிறது.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: நானோ, இதோ
  rationale: முதல் நபருக்குக் கொடுக்கப்பட்டுள்ள வலியுறுத்தலையும், הִנֵּה என்பதன் கவனத்தை ஈர்க்கும் அறிவிப்பு வலிமையையும் இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: לָקַחְתִּי
  choice: எடுத்திருக்கிறேன்
  rationale: לקח என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, லேவியர்களின் நியமனம் தொடர்ந்து பொருந்துகிறது என்பதைக் காட்டும் நிறைவுற்ற நிகழ்கால வடிவத்தைப் பயன்படுத்துகிறது; ‘தேர்ந்தெடுத்திருக்கிறேன்’ என்பது மூலச்சொல்லைவிட விளக்கமானது.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: உங்கள் சகோதரர்களான லேவியர்கள்
  rationale: ஆரோனுடனும் அவன் மகன்களுடனும் லேவியர்களுக்குள்ள உடன்படிக்கைச் சமூக உறவைக் காட்டும் குடும்ப மொழியைப் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடையிலிருந்து
  rationale: בְּנֵי יִשְׂרָאֵל என்ற எபிரெய மரபுத்தொடரின் சூழல்சார் பொருளை இயல்பான நவீன தமிழில் தருகிறது; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: உங்களுக்கு ஓர் அன்பளிப்பாக வழங்கப்பட்டு
  rationale: מַתָּנָה / נְתֻנִים ஆகியவற்றின் ‘அன்பளிப்பு/வழங்குதல்’ கருத்திணைப்பைத் தமிழில் இயன்றவரை தக்கவைத்து, பெறுநர்களாக ஆரோனையும் அவன் மகன்களையும் சுட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
