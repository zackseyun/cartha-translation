  alternative: உங்களுக்காக யாவேக்குக் கொடுக்கப்பட்டவர்கள்
  rationale: லேவியர்கள் ஆரோனுக்கும் அவன் மகன்களுக்கும் அன்பளிப்பாக இருப்பதையும், அதேவேளையில் யாவேக்கு அர்ப்பணிக்கப்பட்டவர்களாக இருப்பதையும் ஒன்றாகத் தக்கவைக்கிறது; இவ்விரண்டில் ஒன்றை மற்றொன்றாகக் கரைத்து விடவில்லை.
