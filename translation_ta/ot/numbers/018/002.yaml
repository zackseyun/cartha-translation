  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: ta
  text: மேலும், உன் சகோதரர்களான லேவி கோத்திரத்தாரை—உன் தந்தையின் கோத்திரத்தாரை—உன்னுடன் சேர்த்துக்கொள். அவர்கள் உன்னோடு இணைந்திருந்து[a] உனக்குப் பணிசெய்யட்டும். நீயும் உன் மகன்களும் உன்னோடு சாட்சியின் கூடாரத்தின் முன்பாக இருப்பீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னுடன் சேர்ந்து இருக்கட்டும்” அல்லது “உன்னோடு இணைக்கப்படட்டும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் ‘லேவி’ என்ற பெயரையும் எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “சாட்சியின் கூடாரம்.” தொடர்புடைய திருக்கூடாரச் சொற்றொடரின் தாக்கத்தால் சில மொழிபெயர்ப்புகள் இங்கு “சந்திப்புக் கூடாரம்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: தொடக்கத்திலுள்ள இணைப்புச் சொல்லின் கூட்டிச் சேர்க்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֶיךָ מַטֵּה לֵוִי שֵׁבֶט אָבִיךָ
  choice: உன் சகோதரர்களாகிய லேவி கோத்திரத்தாரை—உன் தந்தையின் கோத்திரத்தாரை—
  rationale: ‘சகோதரர்கள்’ என்ற குடும்ப உறவுச் சொல்லைப் பேணுவதோடு, அது ஆரோனின் சக லேவியரைக் குறிக்கிறது என்பதை அடுத்த இரு விளக்கத் தொடர்கள் தெளிவுபடுத்துகின்றன.
- source_word: הַקְרֵב אִתָּךְ
  choice: உன்னோடு அருகில் வரச்செய்
  rationale: קרב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அருகில் கொண்டுவா/வரச்செய்’ என்ற வழிபாட்டுப் பணி சார்ந்த நுணுக்கத்தையும் אִתָּךְ என்பதன் உடனிருப்பையும் பேணுகிறது.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: அவர்கள் உன்னோடு இணைந்து
  rationale: לוה என்பதன் ‘இணைக்கப்படுதல், சேர்ந்திருத்தல்’ என்ற பொருளைத் தருகிறது; லேவி என்ற பெயருடனான சொல் எதிரொலியும் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: וִישָׁרְתוּךָ
  choice: உனக்குப் பணிசெய்யட்டும்
  rationale: שרת என்பதன் நேரடியான சேவைப் பொருளை சமயப் பிரிவுசார் சிறப்புச் சொல்லாக்கமின்றி இயல்பாகத் தருகிறது.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: ஆனால் நீயும் உன்னோடுள்ள உன் மகன்களும்
  rationale: லேவியரின் துணைப் பணிக்கும் ஆரோன் மற்றும் அவன் மகன்களின் ஆசாரியப் பொறுப்புக்கும் இடையிலான வேறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: சாட்சியின் கூடாரத்திற்கு முன்பாக
  rationale: மசோரெட்டிக் எபிரெய உரையிலுள்ள ‘சாட்சியின் கூடாரம்’ என்பதையே மொழிபெயர்க்கிறது; பழக்கமான ‘சந்திப்புக் கூடாரம்’ என்பதோடு ஒத்திசைக்கவில்லை.
theological_decisions:
- issue: אֹהֶל הָעֵדֻת என்பதன் மொழிபெயர்ப்பு
  choice: சாட்சியின் கூடாரம்
  alternative: சந்திப்புக் கூடாரம்
  rationale: இவ்வசனத்தின் எபிரெய உரை עֵדֻת, ‘சாட்சி/சான்று’ என்று கூறுகிறது; எனவே தொடர்புடைய ஆனால் வேறான ‘சந்திப்புக் கூடாரம்’ என்ற வழக்குச் சொற்றொடரை இங்கு இறக்குமதி செய்யாமல் மூல உரையின் வேறுபாடு பேணப்படுகிறது.
- issue: லேவியருக்கும் ஆரோனின் மகன்களுக்கும் இடையிலான பணி வேறுபாடு
  choice: லேவியர் ஆரோனோடு இணைந்து அவனுக்குப் பணிசெய்வதாகவும், ஆரோனும் அவன் மகன்களும் கூடாரத்திற்கு முன்பாக இருக்க வேண்டியவர்களாகவும் உரையைத் திறந்தவாறு வைத்தல்
  alternative: பின்னாளைய ஆசாரிய அமைப்புச் சொற்களைச் சேர்த்து பங்குகளை விரிவாக விளக்குதல்
  rationale: வசனம் கூறும் வேறுபாட்டை மட்டும் வெளிப்படுத்தி, எந்தச் சமய மரபின் கூடுதல் பதவிசார் விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. ஒருமை இரண்டாம் நபருக்கான ‘உன்/நீ’ வடிவங்கள் மூலத்தின் நேரடி உரையாடலைப் பேணுகின்றன. நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கோத்திரத்தை விளக்கும் இரட்டை இணைச்சொற்கள் நீண்ட கோடுகளால் குறிக்கப்பட்டுள்ளன.
