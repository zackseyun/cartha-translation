revisions:
- from: மேலும், உன் சகோதரர்களாகிய லேவி கோத்திரத்தாரை—உன் தந்தையின் கோத்திரத்தாரை—உன்னோடு அருகில் வரச்செய். அவர்கள் உன்னோடு இணைந்து[a] உனக்குப் பணிசெய்யட்டும். ஆனால் நீயும் உன்னோடுள்ள உன் மகன்களும் சாட்சியின் கூடாரத்திற்கு முன்பாக இருக்க வேண்டும்.[b]
  to: மேலும், உன் சகோதரர்களான லேவி கோத்திரத்தாரை—உன் தந்தையின் கோத்திரத்தாரை—உன்னுடன் சேர்த்துக்கொள். அவர்கள் உன்னோடு இணைந்திருந்து[a] உனக்குப் பணிசெய்யட்டும். நீயும் உன் மகன்களும் உன்னோடு சாட்சியின் கூடாரத்தின் முன்பாக இருப்பீர்கள்.[b]
  rationale: The revision removes the unsupported adversative, improves idiomatic Tamil for the imperative to bring the Levites into association with Aaron, and avoids making the final clause more explicitly obligatory than the Hebrew wording. It retains the source-specific “tent of the testimony,” the kinship language, and both required footnote anchors.
