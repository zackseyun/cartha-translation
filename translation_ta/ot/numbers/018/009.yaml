source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: ta
  text: 'தீயிலிருந்து ஒதுக்கப்பட்ட மகா பரிசுத்தமான காணிக்கைகளில் உனக்குரியது இதுவே: அவர்களுடைய ஒவ்வொரு காணிக்கையும், ஒவ்வொரு தானியக் காணிக்கையும், ஒவ்வொரு பாவநிவாரணக் காணிக்கையும்[a], ஒவ்வொரு குற்றநிவாரணக் காணிக்கையும்[b]—அவர்கள் இவற்றை எனக்குத் திருப்பிச் செலுத்துகிறார்கள்—இவை உனக்கும் உன் மகன்களுக்கும் மகா பரிசுத்தமானவை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவநிவாரணக் காணிக்கை” என்பதை “தூய்மைப்படுத்தும் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “குற்றநிவாரணக் காணிக்கை” என்பதை “இழப்பீட்டுக் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்தமானவற்றில்
  rationale: இச்சூழலில் இது மகா பரிசுத்த ஸ்தலத்தைக் குறிக்காமல், பலிப்பொருட்களின் மிக உயர்ந்த பரிசுத்த வகைப்பாட்டைக் குறிக்கிறது.
- source_word: מִן הָאֵשׁ
  choice: தீயிலிருந்து ஒதுக்கப்பட்ட
  rationale: எழுத்துப்படி ‘தீயிலிருந்து’; பலியில் தீக்குச் செலுத்தப்படாமல் ஆசாரியருக்காக ஒதுக்கப்படும் பங்கைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָרְבָּנָם
  choice: அவர்களுடைய ஒவ்வொரு காணிக்கையும்
  rationale: தேவனிடம் கொண்டுவரப்படும் பொருளுக்கான பொதுவான பலியியல் சொல்; ‘காணிக்கை’ தெளிவாகவும் வழக்காகவும் உள்ளது.
- source_word: מִנְחָתָם
  choice: ஒவ்வொரு தானியக் காணிக்கையும்
  rationale: ஆசாரிய பலியியல் சூழலில் தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிப்பாகக் குறிக்கிறது.
- source_word: חַטָּאתָם
  choice: ஒவ்வொரு பாவநிவாரணக் காணிக்கையும்
  rationale: இங்கு பாவத்தையே அல்ல, பாவம் அல்லது சடங்குத் தூய்மையின்மையுடன் தொடர்புடைய பலியைக் குறிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשָׁמָם
  choice: ஒவ்வொரு குற்றநிவாரணக் காணிக்கையும்
  rationale: குற்றப்பொறுப்பு மற்றும் அதனுடன் தொடர்புடைய நிவர்த்தியை உள்ளடக்கும் பலியியல் சொல்லாக இயல்பாக உள்ளது; இழப்பீட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: அவர்கள் எனக்குத் திருப்பிச் செலுத்தும்
  rationale: שוב என்பதன் ஹிபீல் வடிவிலுள்ள திருப்புதல் அல்லது மீட்டளித்தல் என்ற சொல்லுருவைத் தக்கவைத்து, அளித்தல்/செலுத்துதல் என்ற சூழல்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: இது பலிப்பங்குகளின் நிலையைச் சுட்டும் உயர்நிலைப் பரிசுத்த வகைப்பாடு; இடத்தைக் குறிக்கும் சொல்லாக மாற்றப்படவில்லை.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: உனக்கும் உன் மகன்களுக்கும்
  rationale: ஆரோனும் அவனுடைய ஆண் ஆசாரிய வழியினரும் நேரடியாகக் குறிக்கப்படுவதால் எபிரெய உரையின் பாலினக் குறிப்புத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: பலிப்பொருட்களின் பரிசுத்த நிலையை உள்ளரங்கப் பரிசுத்த ஸ்தலத்துடன் குழப்பாமல் மொழிபெயர்த்தல்
  choice: மகா பரிசுத்தமானவற்றில் / மகா பரிசுத்தமானது
  alternative: பரிசுத்தங்களின் பரிசுத்தம் / மகா பரிசுத்த ஸ்தலத்திலிருந்து
  rationale: இவ்வசனத்தில் சொற்றொடர் இடவியல் ஆலய அறையைக் காட்டாமல், காணிக்கைகளின் பலியியல் பரிசுத்த வகைப்பாட்டைக் காட்டுகிறது.
- issue: ஆரோனின் வழியினரைப் பாலினத் துல்லியத்துடன் குறிப்பிடுதல்
  choice: உன் மகன்களுக்கும்
  alternative: உன் பிள்ளைகளுக்கும் / உன் சந்ததியினருக்கும்
  rationale: எபிரெயம் வெளிப்படையாக ‘மகன்கள்’ என்கிறது; இவ்வாசாரியச் சூழலில் ஆண் குறிப்பு பொதுப்பாலாக இல்லை.
- issue: חטאת மற்றும் אשם ஆகிய பலியியல் சொற்களின் பொருள்
  choice: பாவநிவாரணக் காணிக்கை / குற்றநிவாரணக் காணிக்கை
  alternative: தூய்மைப்படுத்தும் காணிக்கை / இழப்பீட்டுக் காணிக்கை
  rationale: வழக்கில் எளிதில் புரியும் பெயர்கள் முதன்மை உரையில் பயன்படுத்தப்பட்டு, சடங்குத் தூய்மை மற்றும் ஈடுசெய்தல் சார்ந்த உண்மையான நுணுக்கங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பலியியல் மரியாதைநடையைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘மகா பரிசுத்தம்’ என்ற நிலையான வேதாகமச் சொல்லாட்சி இடத்தைக் காட்டாமல் பலிப்பொருட்களின் வகைப்பாட்டைக் காட்டுமாறு அமைக்கப்பட்டுள்ளது.
