  to: ஒரு மாத வயதுமுதல் மீட்கப்பட வேண்டியவர்களை உன் மதிப்பீட்டின்படி, பரிசுத்த இடத்தின் சேக்கல் அளவின்படி ஐந்து சேக்கல் வெள்ளியாக மீட்க வேண்டும்; அது[a] இருபது கேரா.
