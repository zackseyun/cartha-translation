translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையும் பொதுவாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டாம் நபர் ஒருமை உரை காக்கப்பட்டுள்ளது; எபிரெயிலுள்ள கடினமான பெயரெச்ச அமைப்பு சூழலுக்கேற்ற பொதுப்பன்மையாக இயல்பாக்கப்பட்டுள்ளது.
