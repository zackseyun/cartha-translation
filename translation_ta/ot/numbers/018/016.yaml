source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: ta
  text: ஒரு மாத வயதுமுதல் மீட்கப்பட வேண்டியவர்களை உன் மதிப்பீட்டின்படி, பரிசுத்த இடத்தின் சேக்கல் அளவின்படி ஐந்து சேக்கல் வெள்ளியாக மீட்க வேண்டும்; அது[a] இருபது கேரா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “ஒரு சேக்கல் இருபது கேரா.” எபிரெய மொழியிலுள்ள “அது” என்ற சுட்டுப்பெயர், நிலையான எடை அளவான பரிசுத்த இடத்தின் சேக்கலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: மீட்கப்பட வேண்டியவர்களை
  rationale: פדה வேரிலிருந்து வந்த இச்செயப்படுபொருள் வடிவமும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டும் இலக்கண ரீதியாகக் கடினமானவை. முதற்பேறானவர்களை மீட்பது பற்றிய சூழலில், பொதுவான சட்டவிதியாக மீட்கத்தக்க நபர்களைக் குறிக்கும் வகையில் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִבֶּן חֹדֶשׁ
  choice: ஒரு மாத வயதுமுதல்
  rationale: மீட்புக்கான வயது வரம்பு ஒரு மாத வயதில் தொடங்குவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: תִּפְדֶּה
  choice: நீ மீட்க வேண்டும்
  rationale: சட்டவிதியில் வரும் இரண்டாம் ஆண்பால் ஒருமை நிறைவுறா வினை, கடமையைச் சுட்டும் கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעֶרְכְּךָ
  choice: உன் மதிப்பீட்டின்படி
  rationale: ஆசாரியனிடம் ஒருமையில் உரைக்கப்படும் மதிப்பிடப்பட்ட தொகை என்ற சட்டப் பொருளையும் இரண்டாம் நபர் பின்னொட்டையும் காக்கிறது.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: ஐந்து சேக்கல் வெள்ளி
  rationale: அளவையும் உலோகத்தையும் இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் கணக்கில்
  rationale: தொகையை நிர்ணயிக்கப் பயன்படுத்தப்படும் பரிசுத்த இடத்தின் நிலையான எடை அளவைத் தெளிவாகக் குறிக்கிறது.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: அது இருபது கேரா
  rationale: எபிரெய உரையின் சுட்டுப்பெயரைப் பாதுகாக்கிறது; அது பரிசுத்த இடத்துச் சேக்கல் எனும் நிலையான எடையைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
