  terminology: ‘முதற்பேறு’, ‘மீட்க’, ‘பரிசுத்தமானவை’, ‘பலிபீடம்’, ‘நெருப்புப் பலி’, ‘யாவே’ ஆகியவை நிலையான, பொருத்தமான திருவிவிலியச் சொற்களாக உள்ளன. אִשֶּׁה-க்கு ‘நெருப்புப் பலி’ என்பது இச்சூழலில் ‘உணவுப் பலி’ என்பதைவிடத் தவறான தானியப் பலி தொடர்பைத் தவிர்க்கிறது.
