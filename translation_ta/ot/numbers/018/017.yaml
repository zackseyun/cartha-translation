  source_fidelity: மூல எபிரெயத்தின் எதிர்மறை விலக்கு (אַךְ), மூன்று விலங்கு வகைகளின் முதற்பேறு, அவற்றை மீட்கத் தடை, அவற்றின் பரிசுத்த நிலை, இரத்தத்தைப் பலிபீடத்தின்மேல் தெளித்தல், கொழுப்பை எரித்தல், யாவேக்கு இனிய நறுமணம் ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘மாடு’ என்பது שׁוֹר என்பதன் இங்குள்ள பொதுவான மாட்டின வகைக் குறிப்புக்கு ஏற்றது; பாலினத்தைத் தேவையின்றிக் குறிப்பதில்லை.
