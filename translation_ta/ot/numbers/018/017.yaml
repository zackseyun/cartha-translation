source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: ஆனால் மாட்டின் முதற்பேற்றையோ, செம்மறியாட்டின் முதற்பேற்றையோ, வெள்ளாட்டின் முதற்பேற்றையோ நீ மீட்கக் கூடாது; அவை பரிசுத்தமானவை. அவற்றின் இரத்தத்தைப் பலிபீடத்தின்மேல் தெளித்து, அவற்றின் கொழுப்பை யாவேக்கு இனிய நறுமணம் தரும் நெருப்புப் பலியாக எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய விதியிலிருந்து இந்த விலக்கைத் தெளிவாக அறிமுகப்படுத்தும் எதிர்மறை இணைப்புச் சொல்.
- source_word: בְּכוֹר
  choice: முதற்பேறு
  rationale: முதலில் பிறந்த விலங்கையும் அதன் வழிபாட்டுச் சிறப்பையும் குறிக்கும் துல்லியமான, இயல்பான சொல்.
- source_word: שׁוֹר
  choice: மாடு
  rationale: இங்கு குறிப்பிட்ட பாலினத்தைவிட மாட்டின வகையையே பொதுவாகக் குறிக்கிறது.
- source_word: כֶּשֶׂב
  choice: செம்மறியாடு
  rationale: ஆட்டுக்குட்டி என வயதைக் குறிப்பதற்குப் பதிலாக, இப்பட்டியலில் விலங்கு வகையைப் பொதுவாகக் குறிக்கிறது.
- source_word: עֵז
  choice: வெள்ளாடு
  rationale: செம்மறியாட்டிலிருந்து வேறுபடுத்தி ஆட்டு வகையைத் தெளிவாகக் குறிக்கிறது.
- source_word: לֹא תִפְדֶּה
  choice: நீ மீட்கக் கூடாது
  rationale: பணம் அல்லது மாற்றுப்பொருள் கொடுத்து வழிபாட்டுக் கடமையிலிருந்து விடுவிக்கும் சட்டச் செயலைக் குறிக்கிறது.
- source_word: קֹדֶשׁ הֵם
  choice: அவை பரிசுத்தமானவை
  rationale: அவற்றை மீட்க முடியாததற்கான வழிபாட்டுச் சார்ந்த காரணத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תִזְרֹק
  choice: தெளித்து
  rationale: பலிபீடத்தின் மீது இரத்தத்தை வீசித் தெளிக்கும் பலிச் சடங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֶלְבָּם
  choice: அவற்றின் கொழுப்பு
  rationale: பலியில் எரிக்க ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கும் மூலச்சொல்லைச் சுருக்கமின்றி வழங்குகிறது.
- source_word: תַּקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: பலிபீடத்தில் எரித்துப் புகையெழச் செய்யும் சடங்குச் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் பலி என்ற வழிபாட்டுக் கருத்தைத் தெளிவாகவும் மூலத்திற்கு அணுக்கமாகவும் தருகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம் தரும்
  rationale: ஏற்றுக்கொள்ளத்தக்க அல்லது மனமகிழ்வூட்டும் பலியைக் குறிக்கும் எபிரெய வழிபாட்டு மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִשֶּׁה என்ற பலிச் சொல்
  choice: நெருப்புப் பலி
  alternative: உணவுப் பலி
  rationale: இந்தச் சொல் நெருப்பில் செலுத்தப்படும் பலியைக் குறிக்கிறது; இவ்வசனத்தில் எரிக்கப்படும் கொழுப்பைப் பற்றிய சூழலுடன் ‘நெருப்புப் பலி’ நேரடியாகப் பொருந்துகிறது. ‘உணவுப் பலி’ என்பது இங்கு தானியப் பலி என்று தவறாகப் புரிந்துகொள்ளப்படலாம்.
- issue: רֵיחַ נִיחֹחַ என்ற வழிபாட்டு மரபுத்தொடர்
  choice: யாவேக்கு இனிய நறுமணம் தரும்
  alternative: யாவே ஏற்றுக்கொள்ளும்
  rationale: ஏற்றுக்கொள்ளுதலைக் குறிக்கும் உருவகத்தின் நறுமணப் படிமத்தை விளக்கமாகக் கரைத்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் வழிபாட்டு கண்ணியத்தைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘முதற்பேறு’, ‘பலிபீடம்’, ‘பரிசுத்தம்’, ‘நெருப்புப் பலி’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியக்கூடிய திருவிவிலியப் பதிவைத் தக்கவைக்கின்றன.
