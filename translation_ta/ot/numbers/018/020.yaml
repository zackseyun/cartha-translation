base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: ta
  text: 'யாவே ஆரோனிடம் சொன்னார்: “அவர்களுடைய நிலத்தில் நீ மரபுரிமை பெறமாட்டாய்; அவர்களிடையே உனக்கு எந்தப் பங்கும் இருக்காது. இஸ்ரவேல் மக்களிடையே[a] நானே உன் பங்கும் உன் மரபுரிமையும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படி: “இஸ்ரவேலின் மகன்களிடையே”; அதாவது, இஸ்ரவேல் மக்களிடையே அல்லது இஸ்ரவேலரிடையே.'
    reason: மூல எபிரெய மரபுத்தொடரின் சொற்படி வடிவத்தையும் அதன் கூட்டுப்பொருளையும் காட்டுவதற்காக.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் இயல்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּאַרְצָם
  choice: அவர்களுடைய நாட்டில்
  rationale: இஸ்ரவேலருக்குப் பங்கிடப்பட்ட நிலப்பரப்பைக் குறிக்கும் உடன்படிக்கை மற்றும் நிலவுரிமைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִנְחָל
  choice: உனக்கு உரிமைச்சொத்து கிடைக்காது
  rationale: נחל என்பதன் பரம்பரை அல்லது பங்கீட்டு உரிமையாகப் பெறுதல் என்ற பொருளைத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: பங்கீட்டில் ஒருவருக்குரிய பாகத்தை இயல்பாகக் குறிக்கிறது; பின்னர் வரும் இறைவனின் சுயவிளக்கத்திலும் அதே சொல்லை வைத்திருப்பதால் மூலத்தின் சொல்லிணைப்பு காக்கப்படுகிறது.
- source_word: בְּתוֹכָם
  choice: அவர்கள் நடுவில்
  rationale: இஸ்ரவேல் சமூகத்தினரிடையே ஆரோனுக்கு நிலப்பங்கு இல்லை என்பதைக் காட்டுகிறது.
- source_word: אֲנִי חֶלְקְךָ
  choice: நானே உன் பங்கு
  rationale: வசனத்தின் மையமான இறைவனின் சுயவிளக்கத்தை நேரடியாகவும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: נַחֲלָתְךָ
  choice: உன் உரிமைச்சொத்து
  rationale: நிலம் சார்ந்த சட்ட மற்றும் உடன்படிக்கைப் பின்னணியுடைய பரம்பரை உரிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடையே
  rationale: எபிரெய மரபுத்தொடர் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவையும் குறிக்கும் வழக்கமான கூட்டுப்பெயராக இருப்பதால் நவீனத் தமிழில் இயல்பாகத் தரப்படுகிறது; சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தொடரின் கூட்டுப்பொருள்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: இந்த நிலப்பங்கீட்டுச் சூழலில் இத்தொடர் இஸ்ரவேல் சமூகத்தையே கூட்டாகக் குறிக்கிறது. இயல்பான நவீனத் தமிழை முதன்மை உரையில் பயன்படுத்தி, மூலத்தின் பாலின வடிவத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: இறைவன் ‘பங்கும் உரிமைச்சொத்தும்’ எனக் கூறப்படுதல்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: இறைவன் தேவைகளை வழங்குவார் என விளக்கிப் பொருளுரைத்தல்
  rationale: மூலத்தின் நிலவுரிமை உருவகமும் அதன் இறையியல் அழுத்தமும் விளக்கவுரையால் குறுக்கப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பங்கு’ என்ற சொல்லின் மீளுரைப்பும், ‘பங்கு—உரிமைச்சொத்து’ என்ற நிலவுரிமை உருவகமும் மூலத்தைப் போலவே பாதுகாக்கப்பட்டுள்ளன.
