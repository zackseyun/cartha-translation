source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: ta
  text: நீங்களும் உங்கள் வீட்டாரும்[a] அதை எந்த இடத்திலும் உண்ணலாம்[b]. ஏனெனில், சந்திப்புக் கூடாரத்தில் நீங்கள் செய்யும் சேவைக்கு ஈடாக அது உங்களுக்கான ஊதியம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீட்டார்’ என்பது வீட்டுக் கட்டடத்தை மட்டுமல்லாமல், குடும்பம் அல்லது இல்லத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது ‘உண்ண வேண்டும்’ என மொழிபெயர்க்கலாம்; இச்சட்டச் சூழலில் எபிரேய வினை வடிவம் அனுமதியையோ அறிவுறுத்தலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘கூலி,’ ‘ஈடு,’ அல்லது ‘கைம்மாறு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: அதை உண்ணலாம்
  rationale: சட்டச் சூழலில் இவ்வினை வடிவம் வெறும் இறந்தகால நிகழ்வைக் குறிக்காமல் அனுமதி அல்லது அறிவுறுத்தலை வெளிப்படுத்துகிறது. இங்கு பரிசுத்த இடத்துக்கு வெளியிலும் இதை உண்ண அனுமதி இருப்பதால், ‘உண்ணலாம்’ என்பது சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: בְּכָל מָקוֹם
  choice: எந்த இடத்திலும்
  rationale: இந்தப் பங்கை உண்ணுவதற்குப் பரிசுத்த இடக் கட்டுப்பாடு இல்லை என்பதைக் குறிக்கிறது. நவீன தமிழில் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: நீங்களும் உங்கள் வீட்டாரும்
  rationale: בַּיִת இங்கு கட்டடத்தை மட்டும் அல்லாமல் ஒருவருடைய குடும்பம் அல்லது இல்லக் குழுவைக் குறிக்கிறது; ‘வீட்டார்’ அந்தக் குடும்பச் சார்பைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அனுமதிக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சமகாலத் தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׂכָר
  choice: ஊதியம்
  rationale: செய்த பணிக்காகக் கிடைக்கும் ஈட்டை இச்சொல் குறிக்கிறது. லேவியர்களின் பணிக்கான முறையான ஈடு என்ற கருத்தை ‘ஊதியம்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: חֵלֶף
  choice: பதிலாக
  rationale: செய்யப்பட்ட பணிக்கு ஈடாக வழங்கப்படுவதை இங்கு குறிக்கிறது; வெறும் மாற்றீடு என்ற எண்ணத்தைவிட கைம்மாறான ஈட்டின் தொடர்பைச் சூழல் தெளிவாக்குகிறது.
- source_word: עֲבֹדַתְכֶם
  choice: நீங்கள் செய்யும் பணி
  rationale: ஒப்படைக்கப்பட்ட வழிபாட்டிடச் சேவையைக் குறிக்கிறது. ‘பணி’ இயல்பான நவீன தமிழில் அதிகாரபூர்வமான வேலையின் நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இஸ்ரவேலின் வழிபாட்டுக் கூடாரத்துக்கான நிலையான, பொருள்தெளிவான பெயராகவும் எபிரேய முன்னிடைச்சொல்லின் இடப்பொருளுக்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: லேவியர்களுக்குக் கிடைக்கும் பங்கின் தன்மை
  choice: இந்த உணவு லேவியர்கள் சந்திப்புக் கூடாரத்தில் செய்யும் பணிக்கான நியாயமான ஊதியமாக வழங்கப்படுகிறது; அதை எந்த இடத்திலும் உண்ணலாம்.
  alternative: இதைப் பரிசுத்த வளாகத்திற்குள் மட்டுமே உண்ண வேண்டிய பலியுணவாகக் குறுகலாகப் புரிந்துகொள்ளலாம்.
  rationale: ‘எந்த இடத்திலும்’ என்ற வெளிப்படையான சொற்றொடர், அதிகக் கட்டுப்பாடுள்ள பரிசுத்த காணிக்கைகளிலிருந்து இதை வேறுபடுத்துகிறது. ஆகவே இடக் கட்டுப்பாடற்ற உண்ணும் அனுமதியையும் பணிக்கான ஈடு என்ற கருத்தையும் மொழிபெயர்ப்பு தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடையில் மொழிபெயர்க்கப்பட்டது. ‘உண்ணலாம்’ அனுமதியை இயல்பாகக் காட்டுகிறது; ‘வீட்டார்’ இல்லக் குழுவின் பரந்த பொருளைக் காக்கிறது; ‘சந்திப்புக் கூடாரம்’ பெயரின் செயல்பாட்டு அர்த்தத்தைத் தக்கவைக்கிறது.
