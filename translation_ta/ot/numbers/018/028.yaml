source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: ta
  text: இவ்வாறே, இஸ்ரவேலின் மகன்களிடமிருந்து நீங்கள் பெறும் உங்கள் எல்லாத் தசமபாகங்களிலிருந்தும் நீங்களும் யாவேக்கான பங்கைப் பிரித்தெடுத்துக் கொடுக்க வேண்டும்; அதிலிருந்து யாவேக்கான பங்கை ஆசாரியனாகிய ஆரோனுக்குக் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் மகன்கள்” என்பதற்கு “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: இவ்வாறே
  rationale: முந்தைய கட்டளைக்கு ஒத்த முறையில் இதையும் செய்ய வேண்டும் என்ற தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תָּרִימוּ
  choice: பிரித்தெடுத்துக் கொடுக்க வேண்டும்
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம், תְּרוּמָה சூழலில் ஒரு பங்கை ஒதுக்கி அர்ப்பணிப்பதைக் குறிக்கிறது; சொல்லுக்குச் சொல் 'உயர்த்துதல்' என்பதைவிட இத்தொடர் சடங்குசார் பொருளைத் தெளிவாக்குகிறது.
- source_word: גַם אַתֶּם
  choice: நீங்களும்
  rationale: இஸ்ரவேலர் கொடுப்பதுபோல லேவியர்களும் ஒரு பங்கை ஒதுக்க வேண்டும் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேக்கான பங்கு
  rationale: תְּרוּמָה என்பது ஒதுக்கப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட பங்கைக் குறிக்கிறது; 'பங்கு' என்பது இதை ஒரு குறிப்பிட்ட பலிவகையாகக் குறுக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: உங்கள் எல்லாத் தசமபாகங்களிலிருந்தும்
  rationale: பன்மையையும் 'இலிருந்து' என்ற பகுதிப்பொருளையும் பாதுகாக்கிறது; מַעֲשֵׂר என்பதற்கான வழக்கமான தமிழ்ச் சொல் 'தசமபாகம்'.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிடமிருந்து நீங்கள் பெறும்
  rationale: இந்த நிர்வாகச் சூழலில் לקח என்பதை 'பெறுதல்' என மொழிபெயர்ப்பது இயல்பானது; בְּנֵי יִשְׂרָאֵל என்பதன் முறையான சொற்றொடரையும் பாதுகாக்கிறது.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: அதிலிருந்து ... கொடுக்க வேண்டும்
  rationale: பெற்ற தசமபாகத்திலிருந்து ஒரு பகுதி கொடுக்கப்பட வேண்டும் என்ற பகுதிப்பொருளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனுக்கு
  rationale: לְ என்பதன் பெறுநர் பொருளை 'ஆரோனுக்கு' எனவும், הַכֹּהֵן என்ற இணைநிலைப் பட்டத்தை இயல்பான தமிழிலும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற வெளிப்பாட்டின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: எபிரெயின் சொற்படியான, ஆண்பால் பன்மை உடன்படிக்கைச் சொல்லாட்சியைப் பிரதான உரையில் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதையும் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. சடங்குசார் תְּרוּמָה என்பதற்கு குறுகிய பலியியல் பொருளைத் திணிக்காமல் 'பங்கு' என்றும், செயலை விளக்க 'பிரித்தெடுத்துக் கொடுக்க' என்றும் தரப்பட்டுள்ளது; முறையான 'இஸ்ரவேலின் மகன்கள்' பிரதான உரையில் வைக்கப்பட்டு இயல்பான மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
