  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் ஆண்டவருக்குச் செலுத்தும் பரிசுத்தப் பொருட்களின் காணிக்கைகள் அனைத்தையும் உனக்கும், உன்னோடு இருக்கும் உன் மகன்களுக்கும் உன் மகள்களுக்கும் நிரந்தர நியமமாகக் கொடுத்திருக்கிறேன். இது ஆண்டவரின் முன்னிலையில் உனக்கும் உன்னோடு இருக்கும் உன் சந்ததிக்கும் என்றென்றைக்குமான உப்பு உடன்படிக்கை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உப்பு உடன்படிக்கை” என்பது நீடித்ததும் உறுதியானதுமான உடன்படிக்கையைக் குறிக்கும் பழங்கால உருவகம்; உப்பின் சரியான குறியீட்டுப் பொருள் குறித்து பல விளக்கங்கள் உள்ளன.
    reason: இன்றைய வாசகருக்கு அறிமுகமில்லாத எபிரெயப் பண்பாட்டு உருவகத்தை விளக்கி, அதன் சாத்தியமான பொருளை அளவுக்கு மீறி நிர்ணயிக்காமல் இருக்கிறது.
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: செலுத்தும் காணிக்கைகள்
  rationale: இந்தச் சொல் பிரித்தெடுத்து உயர்த்திச் செலுத்தப்படும் புனிதப் பங்குகளைக் குறிக்கிறது; தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் ‘காணிக்கைகள்’ என வழங்கப்பட்டது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தமானவற்றிலிருந்து
  rationale: பெயர்ச்சொல் சார்ந்த ‘பரிசுத்தப் பொருட்கள்/புனிதமானவை’ என்ற பொருளைத் தக்கவைத்து, காணிக்கைகள் அவற்றைச் சார்ந்தவை என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יָרִימוּ
  choice: செலுத்தும்
  rationale: சொற்படியாக ‘உயர்த்துவர்’ என்றாலும், காணிக்கை சூழலில் ஆண்டவருக்குப் பிரித்துச் செலுத்துதல் என்பதே கருத்து; தமிழில் வெறும் ‘உயர்த்தும்’ என்பது தெளிவற்றதாக இருப்பதால் செயல்பாட்டு இணை தேர்ந்தெடுக்கப்பட்டது.
- source_word: חָק עוֹלָם
  choice: நிரந்தர நியமம்
  rationale: நிலைத்த சட்ட ஏற்பாட்டைக் குறிக்கும் எபிரெயச் சொற்றொடரைச் சுருக்கமாகவும் கண்ணியமாகவும் பிரதிபலிக்கிறது.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: என்றென்றைக்குமான உப்பு உடன்படிக்கை
  rationale: பண்பாட்டு உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே தக்கவைக்கிறது; ‘என்றென்றைக்குமான’ என்பது உடன்படிக்கையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: கூட்டுப் பொருளில் வரும் ‘விதை/வம்சம்’ என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வேதாகம வழக்கில் அறியப்பட்ட மரியாதைமிக்க தலைப்பைப் பயன்படுத்துகிறது; தனிப்பட்ட உச்சரிப்பை உரையில் நிர்ணயிக்கவில்லை.
- issue: ‘உப்பு உடன்படிக்கை’ என்ற உருவகத்தின் பொருள்
  choice: மூல உருவகத்தை உரையில் தக்கவைத்து அடிக்குறிப்பில் சுருக்கமாக விளக்குதல்
  alternative: மாறாத உடன்படிக்கை என்று நேரடியாகப் பொருளாக்குதல்
  rationale: மூலத்தின் பண்பாட்டு உருவகத்தையும் அதன் உண்மையான விளக்கத் திறப்பையும் பாதுகாக்கிறது; ஒரே இறையியல் விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ஆரோனிடம் ஒருமையில் உரையாடப்படுவதால் ‘உனக்கு/உன்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மீளுரைப்பை இயன்றவரை காத்து, தமிழில் இயல்பான வாக்கிய ஓட்டம் வழங்கப்பட்டுள்ளது.
