  to: இஸ்ரவேல் மக்களின் பத்தில் ஒரு பங்கை அவர்கள் ஆண்டவருக்குக் காணிக்கையாக உயர்த்திப் படைக்கிறார்கள்; அதை நான் லேவியர்களுக்கு மரபுரிமைப் பங்காகக் கொடுத்திருக்கிறேன். ஆகையால், ‘இஸ்ரவேல் மக்களிடையே அவர்கள் மரபுரிமைப் பங்கு பெறமாட்டார்கள்’ என்று அவர்களிடம் சொன்னேன்.
  rationale: The revision corrects the Hebrew preposition’s direct addressee (‘to them’) and renders נַחֲלָה consistently as an inherited share. It otherwise preserves the draft’s accurate causal structure, its rendering of the tithe, and the ‘lift up’ imagery of the source.
