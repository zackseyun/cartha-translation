base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் பத்தில் ஒரு பங்கை அவர்கள் ஆண்டவருக்குக் காணிக்கையாக உயர்த்திப் படைக்கிறார்கள்; அதை நான் லேவியர்களுக்கு மரபுரிமைப் பங்காகக் கொடுத்திருக்கிறேன். ஆகையால், ‘இஸ்ரவேல் மக்களிடையே அவர்கள் மரபுரிமைப் பங்கு பெறமாட்டார்கள்’ என்று அவர்களிடம் சொன்னேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: பத்தில் ஒரு பங்கு
  rationale: ‘Tithe’ என்பதன் அளவைச் சாதாரண வாசகருக்குத் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: יָרִימוּ
  choice: உயர்த்திப் படைக்கிறார்கள்
  rationale: எபிரேய வினையின் ‘உயர்த்துதல்’ என்ற உருவகத்தைப் பாதுகாத்து, வழிபாட்டுக் காணிக்கையாகச் செலுத்தும் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: תְּרוּמָה
  choice: காணிக்கை
  rationale: பிரித்தெடுத்து ஆண்டவருக்குச் செலுத்தப்படும் பங்களிப்பைக் குறிக்கும் இயல்பான நவீன தமிழ் சொல்.
- source_word: נַחֲלָה
  choice: உரிமைப் பங்கு
  rationale: இங்கு மரபுரிமையாகக் கிடைக்கும் பங்கு, குறிப்பாக இஸ்ரவேலரிடையே நிலப்பங்கு, என்ற கருத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காட்டிலும், முழுச் சமூகத்தையும் குறிக்கும் மூலப் பயன்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יהוה
  choice: ஆண்டவர்
  rationale: தெய்வீக நாமத்திற்கான மரியாதையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகம மரபை பின்பற்றுகிறது.
theological_decisions:
- issue: லேவியர்களின் ‘உரிமைப் பங்கு’ என்பதன் இயல்பு
  choice: பத்தில் ஒரு பங்கே அவர்களுக்குக் கொடுக்கப்பட்ட உரிமைப் பங்கு என உரை கூறும் தொடர்பைப் பாதுகாத்தல்
  alternative: அவர்களுக்கு எந்தவிதமான சொத்துரிமையும் இல்லை என்று பொதுமைப்படுத்துதல்
  rationale: வசனம் மறுப்பது இஸ்ரவேல் மக்களிடையேயான உரிமைப் பங்கை; அதற்கு மாற்றாகப் பத்தில் ஒரு பங்கை ஆண்டவர் அளிப்பதாகக் கூறுகிறது. உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
- issue: יָרִימוּ என்பதிலுள்ள சடங்கு உருவகம்
  choice: ‘உயர்த்திப் படைக்கிறார்கள்’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘செலுத்துகிறார்கள்’ அல்லது ‘கொடுக்கிறார்கள்’ என்று பொதுவாக்குதல்
  rationale: மூலத்தின் தனித்துவமான ‘உயர்த்துதல்’ மொழியையும் காணிக்கைச் சூழலையும் இணைத்துக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு மரியாதை கொண்டிருந்தாலும் சாதாரண வாசகருக்குப் புரியும் நடை. எபிரேய வாக்கியத்தின் காரணம்–விளைவு அமைப்பு பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
