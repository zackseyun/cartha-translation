  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: ta
  text: 'பின்பு யாவே ஆரோனிடம் கூறினார்: “நீயும், உன் மகன்களும், உன்னோடு உன் தந்தைவழிக் குடும்பத்தாரும் தூயகத்தின் அக்கிரமத்தைச் சுமப்பீர்கள்[a]. நீயும், உன்னோடு உன் மகன்களும் உங்கள் ஆசாரியப் பணியின் அக்கிரமத்தைச் சுமப்பீர்கள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூயகத்தின் குற்றப்பொறுப்பைச் சுமப்பீர்கள்.” தூயகத்துடன் தொடர்புடைய மீறல்களுக்குப் பொறுப்பேற்பதையும் எபிரெயச் சொற்றொடர் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் ஆசாரியப் பணியின் குற்றப்பொறுப்பைச் சுமப்பீர்கள்.” ஆசாரிய அலுவலுடன் தொடர்புடைய மீறல்களுக்குப் பொறுப்பேற்பதையும் எபிரெயச் சொற்றொடர் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்வினையின் கதை நகர்த்தும் தொடர்ச்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵית אָבִיךָ
  choice: உன் தந்தைவழிக் குடும்பத்தார்
  rationale: இது ஒரு கட்டிடத்தை அல்ல, ஆரோனின் தந்தைவழி விரிந்த குடும்பம் அல்லது குல உறவினரைச் சுட்டுவதால், எபிரெய உறவுமுறைச் சொல்லின் பொருளைத் தெளிவாக்குகிறது.
- source_word: אִתָּךְ
  choice: உன்னோடு
  rationale: இரு கூறுகளிலும் உள்ள உடனிருப்பைத் தக்கவைத்து, மூலத்தின் மீளுரைப்பையும் அமைப்பையும் பாதுகாக்கிறது.
- source_word: תִּשְׂאוּ
  choice: சுமப்பீர்கள்
  rationale: נשא + עון என்ற சொற்றொடரில் குற்றம், குற்றப்பொறுப்பு அல்லது அதன் விளைவைச் சுமத்தல் ஆகிய பொருள் நிழல்கள் உள்ளன; ‘சுமப்பீர்கள்’ அவற்றை ஒரே விளக்கமாகக் குறுக்காமல் தக்கவைக்கிறது.
- source_word: עֲוֺן
  choice: அக்கிரமம்
  rationale: இச்சொல் அக்கிரமம், குற்றம், குற்றப்பொறுப்பு அல்லது தண்டனைக்குரிய நிலை ஆகியவற்றைக் குறிக்கக்கூடும். ‘அக்கிரமம்’ அதன் பரந்த இறையியல் வலிமையைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמִּקְדָּשׁ
  choice: தூயகம்
  rationale: புனிதமான வழிபாட்டு இடத்தையும் அதனுடன் தொடர்புடைய பரிசுத்த வட்டாரத்தையும் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் சொல்.
- source_word: כְּהֻנַּתְכֶם
  choice: உங்கள் ஆசாரியப் பணி
  rationale: ஆரோனுக்கும் அவருடைய மகன்களுக்கும் உரிய ஆசாரிய அலுவலையும் சேவையையும் இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: ஆசாரியச் சூழலில் ‘அக்கிரமத்தைச் சுமத்தல்’ என்பதன் பொருள்
  choice: ‘அக்கிரமத்தைச் சுமப்பீர்கள்’ என்ற உருவகச் சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘குற்றப்பொறுப்பை ஏற்றுக்கொள்வீர்கள்’ அல்லது ‘அதற்கு எதிரான குற்றங்களுக்குப் பொறுப்பாவீர்கள்’
  rationale: எபிரெயச் சொற்றொடர் குற்றம், குற்றப்பொறுப்பு, தண்டனைக்குரிய நிலை, புனிதப் பணியுடன் தொடர்புடைய மீறல்களுக்கான பொறுப்பு ஆகியவற்றை உள்ளடக்கக்கூடும். அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து இறையியல் பதற்றத்தை நீக்காமல், மூலத்தின் பன்முகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இணை அமைப்பும் ‘உன்னோடு’ என்ற மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன; அரிதான நிர்வாகச் சொற்களைத் தவிர்த்து ‘தூயகம்’, ‘ஆசாரியப் பணி’ போன்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
