source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: ta
  text: அதிலிருந்து அதன் சிறந்த பகுதியை உயர்த்திப் படைக்கும்போது[a], அதற்காக நீங்கள் பாவப்பழியைச் சுமக்கமாட்டீர்கள். இஸ்ரவேல் மக்களின்[b] பரிசுத்தப் பொருட்களைத் தீட்டுப்படுத்தாதீர்கள்; நீங்கள் சாகமாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் கொழுப்பை’ அல்லது ‘அதன் மிகச் சிறந்த பகுதியை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் חֶלֶב என்பதன் நேர்ப்பொருள் ‘கொழுப்பு’; காணிக்கைச் சூழல்களில் அது செழுமையான அல்லது சிறந்த பங்கைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் நேர்ச்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: பாவப்பழி சுமக்கமாட்டீர்கள்
  rationale: נשא உடன் חטא வருவது குற்றப்பொறுப்பைச் சுமத்தல் அல்லது பாவப்பழியை ஏற்றல் என்ற பொருளைத் தருகிறது. ‘பாவப்பழி சுமத்தல்’ என்பது மூல உருவகத்தையும் தமிழில் இயல்பான குற்றப்பொறுப்பு உணர்வையும் காக்கிறது.
- source_word: עָלָיו
  choice: அதன் காரணமாக
  rationale: இங்குள்ள על, முந்தைய பகுதியில் கூறப்பட்ட தசமபாகம் அல்லது அதனோடு தொடர்புடைய கடமை காரணமாக வரும் பொறுப்பைக் குறிக்கிறது.
- source_word: בַּהֲרִימְכֶם
  choice: உயர்த்திப் படைக்கும்போது
  rationale: רום என்பதன் ஹிஃபில் வடிவம் உயர்த்துவதையும் காணிக்கையாக ஒதுக்கிப் படைப்பதையும் குறிக்கிறது. இத்தேர்வு சடங்கு சார்ந்த ‘உயர்த்துதல்’ உருவகத்தைத் தக்கவைக்கிறது.
- source_word: חֶלְבּוֹ
  choice: அதன் சிறந்த பகுதி
  rationale: חֶלֶב என்பதன் நேர்ப்பொருள் ‘கொழுப்பு’; ஆனால் காணிக்கைச் சூழலில் அது மிகச் செழுமையான அல்லது சிறந்த பகுதியைக் குறிக்கும். இங்கு விளைபொருளின் தசமபாகம் பேசப்படுவதால் ‘சிறந்த பகுதி’ தெளிவானது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: சிறந்த பகுதி எந்தத் தொகுதியிலிருந்து எடுக்கப்படுகிறதோ அந்தத் தசமபாகத்தைக் குறிக்கிறது.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் பரிசுத்தப் பொருட்கள்
  rationale: קָדְשֵׁי என்பது அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பொருட்களை விரிவாகக் குறிக்கிறது. בְנֵי יִשְׂרָאֵל என்பதைக் காலத்திற்கேற்ற இயல்பான கூட்டுப்பெயராக ‘இஸ்ரவேல் மக்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: תְחַלְּלוּ
  choice: பரிசுத்தக்கேடாக்காதீர்கள்
  rationale: חלל என்பதன் பியேல் வடிவம் பரிசுத்தமானதைப் பொதுவானதாக நடத்துதல், அதன் பரிசுத்தத்தைக் கெடுத்தல் ஆகியவற்றைக் குறிக்கிறது. ‘பரிசுத்தக்கேடாக்குதல்’ பரிசுத்தம்–அவமதிப்பு எதிர்மறையைத் தெளிவாகக் காக்கிறது.
- source_word: וְלֹא תָמֻתוּ
  choice: நீங்கள் சாகமாட்டீர்கள்
  rationale: எபிரேய இணைப்பை நோக்க அல்லது நிபந்தனைச் சொற்றொடராக விரிவாக்காமல், கீழ்ப்படிதலோடு இணைந்த மரணமின்மையின் விளைவாக நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான எபிரேய இனக்குழுப் பெயர். தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது ஆண்களை மட்டும் குறிப்பதுபோல் தவறாகப் புரியக்கூடும்; ‘இஸ்ரவேல் மக்கள்’ முழுச் சமூகத்தையும் இயல்பாகக் குறிக்கிறது. மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: காணிக்கைச் சூழலில் חֶלֶב என்பதன் பொருள்
  choice: அதன் சிறந்த பகுதி
  alternative: அதன் கொழுப்பு
  rationale: இங்கு விலங்கின் கொழுப்பு அல்ல, லேவியர்கள் பெற்ற தசமபாகத்திலிருந்து பிரித்தளிக்க வேண்டிய மிகச் சிறந்த பங்கு கருத்தில் உள்ளது. ஆகவே சொல்லின் காணிக்கைச் சூழல் சார்ந்த மரபுப்பொருள் தேர்ந்தெடுக்கப்படுகிறது; நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְלֹא תָמֻתוּ என்பதன் தொடர்பு
  choice: நீங்கள் சாகமாட்டீர்கள்
  alternative: நீங்கள் சாகாதபடிக்கு
  rationale: எபிரேயத்தில் நோக்கத்தைக் குறிக்கும் தனிச் சொல் இல்லாமல் וְ + לֹא + வினை வடிவம் உள்ளது. எனவே நோக்கப்பொருளை வெளிப்படையாகச் சேர்க்காமல், கட்டளைக்குப் பின்வரும் விளைவு அல்லது உறுதியுரை என்ற பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயர்த்திப் படைத்தல்’, ‘பாவப்பழி’, ‘பரிசுத்தக்கேடாக்குதல்’ ஆகியவை மூலத்தின் வழிபாட்டு மற்றும் பரிசுத்த மொழியைத் தக்கவைக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
