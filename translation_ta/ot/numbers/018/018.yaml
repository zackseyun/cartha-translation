  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: ta
  text: ஆனால் அசைவாட்டும் காணிக்கையின்[b] மார்புப்பகுதியும் வலது தொடையும் உனக்குரியதாக இருப்பதுபோல, அவற்றின் சதை[a] உனக்குரியதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சதை’ என்பது எபிரெயச் சொல்லின் நேரடிப் பொருள்; இங்கு பலியிடப்பட்ட விலங்கின் உண்ணத்தக்க இறைச்சிப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அசைவாட்டும் காணிக்கை’ என்பது ஆண்டவரின் முன்னிலையில் சடங்குமுறையில் அசைத்துக் காட்டப்பட்ட பகுதியைக் குறிக்கிறது; இதை ‘சமர்ப்பிக்கும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: ஆனால் அவற்றின் சதை
  rationale: בָּשָׂר என்பதன் நேரடிப் பொருள் ‘சதை’. இங்கு பலியிடப்பட்ட விலங்கின் உண்ணத்தக்க இறைச்சிப் பகுதியைக் குறிக்கிறது. முந்தைய வசனத்தில் இரத்தமும் கொழுப்பும் ஆண்டவருக்குச் செலுத்தப்படுவதற்கு மாறாக இப்பகுதி ஆசாரியருக்குரியது என்பதால் וּ־ என்பதை ‘ஆனால்’ என வழங்கியது.
- source_word: יִהְיֶה לָּךְ / לְךָ יִהְיֶה
  choice: உனக்குரியதாக இருக்கும்
  rationale: היה + לְ என்ற எபிரெய உரைநடை உடைமையையும் சட்டப்பூர்வ ஒதுக்கீட்டையும் குறிக்கிறது. மூலத்தில் இருமுறை வரும் இச்சொற்றொடர் தமிழிலும் இருமுறை வைக்கப்பட்டு வலியுறுத்தல் காக்கப்பட்டது.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையின் மார்புப் பகுதியைப் போல
  rationale: חָזֶה என்பது விலங்கின் மார்புப் பகுதி; תְּנוּפָה என்பது ஆண்டவரின் முன்னிலையில் சடங்குமுறையில் அசைத்து அர்ப்பணிக்கப்படும் காணிக்கை அல்லது அதன் வழங்கல் செயலைக் குறிக்கிறது. ‘அசைவாட்டும் காணிக்கை’ மூலச் சடங்குப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: வலது தொடையைப் போல
  rationale: שׁוֹק பலிப் பங்கீட்டுச் சூழலில் காலின் மேற்பகுதியான தொடையைக் குறிக்கிறது; הַיָּמִין என்பதற்கு ‘வலது’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: இரண்டாம் நபர் ஒருமைப் பின்னொட்டுகளின் பாலின வேறுபாடு
  choice: இரண்டையும் ஆரோனை நோக்கிய ஒருமை ‘உனக்கு’ என வழங்குதல்
  alternative: ஆரோனின் குடும்பத்தாரையும் ஆசாரியர்களையும் வெளிப்படையாகச் சேர்த்து ‘உங்களுக்கு’ எனப் பன்மையில் வழங்குதல்
  rationale: לָּךְ என்பதில் பெண்பால் வடிவமும் לְךָ என்பதில் ஆண்பால் வடிவமும் காணப்பட்டாலும், சூழலில் ஆசாரியப் பங்கு ஆரோனை மையமாகக் கொண்டு ஒதுக்கப்படுகிறது. தமிழில் ஒருமையை வைத்திருப்பது மூலத்தின் வடிவத்தையும் அதன் இலக்கணப் பதற்றத்தை மிகையாகத் தீர்க்காமல் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பலிச் சடங்கின் சட்டப்பூர்வ ஒதுக்கீட்டுத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘உனக்குரியதாக இருக்கும்’ என்ற மீளுரைத்தல் எபிரெய மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
