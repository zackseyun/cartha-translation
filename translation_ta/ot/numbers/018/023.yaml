  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: ta
  text: ஆனால் லேவியனே சந்திப்புக் கூடாரத்தின் பணியைச் செய்ய வேண்டும்; அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்.[a] இது உங்கள் தலைமுறைதோறும் நிலையான விதி. இஸ்ரவேலின் மக்களிடையே அவர்கள் பரம்பரைப் பங்கைப் பெற மாட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் குற்றத்தை” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் குற்றத்தையோ, அக்கிரமத்தையோ, அதனுடன் இணைந்த பொறுப்பையோ விளைவுகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் மகன்களிடையே” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், “அவர்கள் ஒரு சுதந்தரத்தைச் சுதந்தரிக்க மாட்டார்கள்” என்பது சொற்படியான அமைப்பு; ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் மறுபடியும் வருவது கோத்திர நிலப்பங்கு மறுக்கப்படுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: பணியைச் செய்ய வேண்டும்
  rationale: சட்டக் கட்டளையின் சூழலில் எதிர்கால/கடமைப் பொருளைக் கொண்ட வடிவம்; நவீன தமிழில் கட்டாயக் கடமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַלֵּוִי הוּא
  choice: லேவியனே
  rationale: தனிப்பெயர்ச்சொல் தரும் வலியுறுத்தலை ‘-ஏ’ விகுதி சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; தேவையற்ற தனிப்பட்ட விலக்குப் பொருளைச் சேர்ப்பதில்லை.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் பணி
  rationale: עֲבֹדָה இங்கு வழிபாட்டுச் சார்ந்த கடமை/பணியைக் குறிக்கிறது; ‘பணி’ தெளிவான நவீனத் தமிழ். אֹהֶל מוֹעֵד என்பதற்கு ‘சந்திப்புக் கூடாரம்’ மூலப்பொருளைத் தக்கவைக்கிறது.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்
  rationale: נשא עון என்ற சட்ட-வழிபாட்டு மரபுத்தொடரின் உருவகத்தையும், குற்றம்/குற்றப்பொறுப்பு/விளைவு ஆகியவற்றுக்கிடையிலான பொருள் அழுத்தத்தையும் தீர்மானிக்காமல் காக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான கட்டளை
  rationale: உடன்படிக்கைச் சட்ட ஒழுங்கில் தொடர்ந்து செல்லும் விதியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘நித்திய’ என்று காலவரம்பை மிகக் கடுமையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகளில் தொடரும் பொருந்துதலைச் செறிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடையே
  rationale: בני ישראל என்ற இனக்குழுப் பெயரை நவீன தமிழில் இயல்பாக வழங்குகிறது; ‘மக்கள்’ இங்கு இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: பரம்பரைப் பங்கைப் பெற மாட்டார்கள்
  rationale: எபிரெயக் கூட்டு வேர் அமைப்பின் வலியுறுத்தலை தமிழில் பொருள் தெளிவுடன் தருகிறது; சூழலில் இது கோத்திர நிலப்பங்கைக் குறிக்கிறது.
theological_decisions:
- issue: லேவியரின் கடமையோடு இணைந்த அக்கிரமம் அல்லது குற்றப்பொறுப்பை மொழிபெயர்த்தல்
  choice: தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்
  alternative: தங்கள் குற்றத்தைச் சுமப்பார்கள்; தங்கள் பாவத்தின் விளைவுகளை ஏற்றுக்கொள்வார்கள்
  rationale: இந்த எபிரெய மரபுத்தொடர் குற்றம், குற்றப்பொறுப்பு, அதற்குரிய விளைவுகள் ஆகியவற்றை உள்ளடக்கக்கூடும். உருவகத்தைத் தக்கவைத்தல் அந்த இறையியல் அழுத்தத்தை முன்கூட்டியே குறுக்காமல் பாதுகாக்கிறது.
- issue: בני ישראל என்ற பாலின வடிவமுள்ள இனக்குழுப் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: சூழலில் இந்தச் சொற்றொடர் இனக்குழுவை முழுமையாகக் குறிக்கும் வழக்குச் சொல். ‘மக்கள்’ நவீனத் தமிழில் பிரதிநிதித்துவப் பொருளைத் தெளிவாகத் தருகிறது; அடிக்குறிப்பு மூலத்தின் சொற்படியான வடிவத்தைப் பதிவு செய்கிறது.
- issue: லேவியருக்குக் கோத்திர நிலப்பங்கு மறுக்கப்படுதல்
  choice: பரம்பரைப் பங்கைப் பெற மாட்டார்கள்
  alternative: சுதந்தரத்தைச் சுதந்தரிக்க மாட்டார்கள்; அவர்களுக்குச் சுதந்தரம் இல்லை
  rationale: சூழலிலுள்ள நில ஒதுக்கீட்டுப் பொருளைத் தெளிவாக்குகிறது; எபிரெயச் சொல் மறுபடியும் வருவது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் dignified சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘லேவியனே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘அக்கிரமத்தைச் சுமப்பார்கள்’ என்ற மரபுத்தொடர் நோக்கமுடன் விளக்கிப் பரப்பப்படாமல் வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
