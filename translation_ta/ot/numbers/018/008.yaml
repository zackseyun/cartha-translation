  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: ta
  text: 'பின்பு யாவே ஆரோனிடம் பேசினார்: “இதோ, நானே என் காணிக்கைகளின் பொறுப்பை உனக்குக் கொடுத்திருக்கிறேன்; அதாவது, இஸ்ரவேலின் மகன்களின் எல்லாப் பரிசுத்தப் பொருள்களையும். அவற்றை உனக்கு உன் அபிஷேகத்துக்குரிய பங்காகவும், உன் மகன்களுக்கு நிலையான நியமமாகவும் கொடுத்திருக்கிறேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַאֲנִי הִנֵּה
  choice: இதோ, நானே
  rationale: הִנֵּה என்பதன் கவனத்தை ஈர்க்கும் வலிமையையும், வெளிப்படையாக இடம்பெறும் முதல் நபர் சுட்டுப்பெயரின் அழுத்தத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִשְׁמֶרֶת
  choice: கவனித்துக்கொள்ளும் பொறுப்பு
  rationale: ஒப்படைக்கப்பட்ட காவல், பராமரிப்பு, கடமை ஆகிய பொருள்களை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תְּרוּמֹתַי
  choice: என் காணிக்கைகள்
  rationale: யாவேக்கெனப் பிரித்தளிக்கப்படும் பங்களிப்புகள் அல்லது காணிக்கைகளைக் குறிக்கிறது; தொழில்நுட்பமான சடங்குச் சொல்லைத் திணிக்காமல் பொதுவாகப் புரியும் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அர்ப்பணிக்கும் பரிசுத்தப் பொருள்கள் அனைத்தும்
  rationale: קָדְשֵׁי என்பதன் ‘பரிசுத்தப் பொருள்கள்’ என்ற விரிவை வைத்துக்கொண்டு, அவை இஸ்ரவேல் மக்களால் அர்ப்பணிக்கப்படுபவை என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לְמָשְׁחָה
  choice: உன் அபிஷேகத்துக்குரிய பங்காக
  rationale: ஆரோனின் அபிஷேகம் பெற்ற ஆசாரியப் பணியுடன் இப்பங்கு தொடர்புடையது என்பதைக் காட்டுகிறது; அதேவேளை ‘அபிஷேகத்திற்காக’ என்ற சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
- source_word: לְחָק עוֹלָם
  choice: நிலையான நியமமாக
  rationale: חָק என்பதன் சட்டபூர்வமான, நிர்ணயிக்கப்பட்ட ஏற்பாட்டையும் עוֹלָם என்பதன் தொடரும் தன்மையையும் நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לְמָשְׁחָה என்பதன் ஆசாரிய உரிமைப் பொருள்
  choice: உன் அபிஷேகத்துக்குரிய பங்காக
  alternative: அபிஷேகத்திற்காக
  rationale: இங்கு புதிய அபிஷேகச் சடங்குக்கான பொருட்களை விட, அபிஷேகம் பெற்ற ஆரோனின் ஆசாரியப் பதவியினால் அவருக்குரிய பங்கைக் குறிப்பதாகச் சூழல் காட்டுகிறது. எனினும் எபிரெயச் சொல்லமைப்பின் குறுகிய மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சார்ந்த தேசியப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயின் வடிவத்தையும் அதன் மரபான தேசிய அடையாளத்தையும் முதன்மை உரையில் காக்கிறது; அது முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்குச் சொற்றொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வாசிக்க எளிதானதாயினும் தெய்வீக உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் வலியுறுத்தலை “இதோ, நானே” என்றும், נתן என்ற வினையின் மீளுரையை இரண்டு இடங்களிலும் “கொடுத்திருக்கிறேன்/அளித்திருக்கிறேன்” என்றும் வெளிப்படுத்தியுள்ளது. தொழில்நுட்பமான ஆசாரியச் சொற்கள் தேவையான இடங்களில் மட்டும் பயன்படுத்தப்பட்டு, உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
