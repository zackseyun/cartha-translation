  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: ta
  text: எண்ணெயிலுள்ள சிறந்ததையெல்லாம்[a], புதுத் திராட்சரசத்திலும் தானியத்திலும் உள்ள சிறந்ததையெல்லாம்—அவர்கள் யாவேக்குக் கொடுக்கும் அவற்றின் முதற்பலன்களை—நான் உனக்குக் கொடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘எண்ணெயின் கொழுப்பு’ என்று உள்ளது; எண்ணெய், திராட்சரசம், தானியம் போன்ற விளைபொருட்களைப் பற்றியபோது இது அவற்றின் வளமான அல்லது மிகச் சிறந்த பகுதியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: சிறந்த பகுதி
  rationale: இச்சொல்லின் நேர்ப்பொருள் ‘கொழுப்பு’; ஆனால் விளைபொருட்களைப் பற்றிய சூழலில் அது வளமான அல்லது மிகச் சிறந்த பகுதியைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: יִצְהָר
  choice: எண்ணெய்
  rationale: இது பொதுவாகப் புதிதாகப் பிழிந்த எண்ணெயை, பெரும்பாலும் ஒலிவ எண்ணெயை, குறிக்கிறது. மூலச்சொல்லில் ‘ஒலிவ’ வெளிப்படையாக இல்லாததால் ‘எண்ணெய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תִּירוֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: பொதுவான திராட்சரசத்தைக் காட்டிலும் புதிதாக உற்பத்தி செய்யப்பட்ட திராட்சரசத்தை இச்சொல் குறிக்கிறது; எபிரெயச் சொற்களுக்கிடையிலான வேறுபாட்டை இந்தத் தேர்வு காக்கிறது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: பலவகைத் தானிய விளைபொருட்களையும் உள்ளடக்கும் பொதுப்பெயராக இருப்பதால், இயல்பான நவீனத் தமிழில் ‘தானியம்’ பொருத்தமானது.
- source_word: רֵאשִׁיתָם
  choice: அவற்றின் முதற்பலன்கள்
  rationale: வேளாண் காணிக்கைச் சூழலில் ‘முதல் பகுதி’ அல்லது ‘முதலில் விளைந்தவை’ என்பதைக் குறிக்கிறது; ‘முதற்பலன்கள்’ வழிபாட்டுச் சூழலையும் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: அவர்கள் யெகோவாவுக்குக் கொடுக்கும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதைக் காத்து, முதற்பலன்களை யாருக்குக் கொடுக்கிறார்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ‘யெகோவா’ என்ற வடிவில் வெளிப்படுத்துகிறது.
- source_word: לְךָ נְתַתִּים
  choice: நான் உனக்குக் கொடுத்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்டு நிலைநாட்டப்பட்ட ஒதுக்கீட்டை எபிரெய நிறைவினை வடிவம் காட்டுவதால், தமிழில் நிகழ்காலத் தொடர்புடைய நிறைவைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் வெளிப்பாடு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் அதனைப் பொதுப்பட்டமாக மாற்றாமல் வெளிப்படுத்துவது மூலவடிவ வேறுபாட்டைக் காக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் தனிக்கொள்கை இதனால் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உனக்கு’ வைக்கப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பையும் இடைச்செருகல் வலியுறுத்தலையும் நீள்கோடுகள் மூலம் காத்துள்ளோம்.
