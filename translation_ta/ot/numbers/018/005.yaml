source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: ta
  text: பரிசுத்த இடத்திற்கான காவல் பொறுப்பையும், பலிபீடத்திற்கான காவல் பொறுப்பையும் நீங்கள் நிறைவேற்ற வேண்டும்; இதனால் இஸ்ரவேல் மக்கள்மேல்[a] இனி கடுங்கோபம் ஏற்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘இஸ்ரவேலின் மகன்கள்’; அதாவது இஸ்ரவேலர் அல்லது இஸ்ரவேல் மக்கள்.
    reason: மூலச் சொற்றொடரின் ஆண்பால் வடிவத்தையும் அதன் சமூகமுழுமையைக் குறிக்கும் பொருளையும் பதிவு செய்வதற்கான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: காவல்காக்கும் பொறுப்பை நீங்கள் நிறைவேற்ற வேண்டும்
  rationale: שׁמר மற்றும் מִשְׁמֶרֶת ஆகியவற்றின் சேர்க்கை, புனிதமானவற்றைப் பாதுகாக்க ஒப்படைக்கப்பட்ட அதிகாரப்பூர்வப் பொறுப்பைக் குறிக்கிறது. ‘காவல்காக்கும் பொறுப்பு’ என்பது பாதுகாப்பையும் கடமையையும் வெளிப்படுத்துகிறது; ‘நிறைவேற்ற வேண்டும்’ என்பது கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: பலிபீடத்துடன் இணைத்துச் சொல்லப்படும் இச்சூழலில், இது பண்பாகிய பரிசுத்தத்தையல்ல, புனித வளாகத்தை அல்லது பரிசுத்த இடத்தைக் குறிக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் altar என்பதற்கான வழக்கமான, சூழலுக்குப் பொருத்தமான தமிழ்ச் சொல்.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: அப்போது ... இனி ... வராது
  rationale: எபிரெய வாக்கியத்தின் இணைப்பை காரணத்தின் விளைவாக இயல்பான தமிழில் காட்டுகிறது. עוֹד என்பதன் ‘இனி’ என்ற பொருளும் பாதுகாக்கப்படுகிறது; நோக்கம்/விளைவு உறவு மிகையாக விளக்கப்படவில்லை.
- source_word: קֶצֶף
  choice: கடுங்கோபம்
  rationale: இது சாதாரண கோபத்தைவிடத் தீர்ப்புடன் தொடர்புடைய தீவிரமான கோபத்தைக் குறிக்கிறது. ‘கடுங்கோபம்’ அதன் வலிமையை நவீன தமிழில் இயல்பாகக் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இச்சொற்றொடர் இங்கு இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்த்து, சொற்படியான வடிவத்தை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்தை வெறும் எதிர்கால முன்னறிவிப்பாகக் கொள்வதா, அல்லது ஆசாரியப் பொறுப்பு நிறைவேற்றப்படுவதன் விளைவாகக் கொள்வதா
  choice: ‘அப்போது’ என்பதன் மூலம் காவல் பொறுப்பு நிறைவேற்றப்படுவதற்கும் கடுங்கோபம் இனி வராமல் இருப்பதற்கும் உள்ள விளைவு உறவு காட்டப்பட்டுள்ளது.
  alternative: ‘மேலும் ... கடுங்கோபம் இனி இருக்காது’ என்று எளிய எதிர்காலக் கூற்றாக மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல், அனுமதியற்ற அணுகுதலால் வரும் தீர்ப்பைத் தடுக்க ஆசாரியர் மற்றும் லேவியருக்கு அளிக்கப்பட்ட பொறுப்புகளைப் பற்றியது. ஆயினும் எபிரெயத்தில் வெளிப்படையான நோக்க இணைப்புச் சொல் இல்லாததால், மிகத் தெளிவான ‘அதற்காக’ போன்ற சொல்லைச் சேர்க்காமல் ‘அப்போது’ என விளைவு உறவை மிதமாக வெளிப்படுத்துகிறது.
- issue: கடுங்கோபம் யாருடையது என்பதை வெளிப்படையாகச் சொல்வதா
  choice: மூலத்தைப் போலவே அதற்குரியவரை வெளிப்படையாகக் குறிப்பிடாமல் விடப்பட்டுள்ளது.
  alternative: ‘கடவுளுடைய கடுங்கோபம்’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: சூழலில் அது இறைவனுடைய கோபம் என்பது தெளிவாக இருந்தாலும், இவ்வாக்கியத்தில் எபிரெய மூல உரை அதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே மொழிபெயர்ப்பு கூடுதல் பெயரைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘காவல்காக்கும் பொறுப்பு’ என்ற தொடர் மூலத்தில் இருமுறை வருவதுபோலவே இரு பொருட்களுக்கும் மீண்டும் வழங்கப்பட்டுள்ளது; இதனால் பரிசுத்த இடமும் பலிபீடமும் தனித்தனியாக ஒப்படைக்கப்பட்ட பொறுப்புகளாகத் தெளிவாகின்றன.
