  to: பரிசுத்த இடத்திற்கான காவல் பொறுப்பையும், பலிபீடத்திற்கான காவல் பொறுப்பையும் நீங்கள் நிறைவேற்ற வேண்டும்; இதனால் இஸ்ரவேல் மக்கள்மேல்[a] இனி கடுங்கோபம் ஏற்படாது.
