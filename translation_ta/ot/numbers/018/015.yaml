source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: ta
  text: எல்லா உயிரினங்களிலும் கருப்பையைத் திறக்கும் ஒவ்வொரு முதற்பேறும்[a]—மனிதராயினும் விலங்காயினும்—அவர்கள் யாவேக்குச் சமர்ப்பிப்பது[b] உனக்குரியது. ஆனாலும், மனிதரின் முதற்பேற்றைக் கட்டாயம் மீட்க வேண்டும்; தீட்டான விலங்கின் முதற்பேற்றையும் மீட்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழிநடையில் நேரடியாக, ‘கருப்பையைத் திறப்பது எதுவோ அது.’ இது கருப்பையிலிருந்து முதலில் வெளிவரும் சந்ததியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேக்கு அருகே கொண்டுவருவது’ அல்லது ‘யாவேக்குக் காணிக்கையாக அளிப்பது.’ இங்குள்ள வினை காணிக்கைச் சூழலில் கொண்டுவருதல் அல்லது சமர்ப்பித்தல் எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: கருப்பையைத் திறந்து பிறக்கும் ஒவ்வொரு முதற்பேறு
  rationale: கருப்பையிலிருந்து முதலில் வெளிவரும் சந்ததியைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்தபடி, இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: எல்லா உயிரினங்களிலும் ... ஒவ்வொரு
  rationale: மனிதர்களையும் விலங்குகளையும் உள்ளடக்கும் முழுமையான வரம்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: அவர்கள் யாவேக்குச் சமர்ப்பிக்கும்போது
  rationale: הקריב என்பதன் ‘அருகே கொண்டுவருதல்/சமர்ப்பித்தல்’ என்ற காணிக்கைச் சூழலிலான விரிவான பொருளைக் காக்கிறது; மனித முதற்பேறும் இதில் அடங்குவதால் ‘பலியிடுதல்’ என்று குறுக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: மனிதரானாலும் விலங்கானாலும்
  rationale: மனிதர், விலங்கு என்ற இரு பிரிவுகளையும் சுருக்கமாகவும் இயல்பாகவும் வேறுபடுத்துகிறது.
- source_word: יִהְיֶה לָּךְ
  choice: அது உனக்குரியதாகும்
  rationale: ஆசாரியனுக்குரிய உரிமையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முந்தைய உரிமை அறிவிப்புக்கு அடுத்து வரும் முக்கியமான விதிவிலக்கைத் தெளிவாகக் குறிக்கிறது.
- source_word: פָּדֹה תִפְדֶּה
  choice: கட்டாயம் மீட்க வேண்டும்
  rationale: வினையெச்ச மூலவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலை, கடமையையும் உறுதியையும் காட்டும் தமிழ்ச் சொல்லாக்கத்தில் தருகிறது.
- source_word: בְּכוֹר הָאָדָם
  choice: மனிதரின் முதற்பேறு
  rationale: விலங்கின் முதற்பேற்றுடன் உள்ள எதிரிணையைப் பாலினம் குறிக்காத இயல்பான தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: தீட்டான விலங்கின் முதற்பேறு
  rationale: பலிக்குத் தகாத சடங்கியல் வகைப்பாட்டைக் குறிக்கும் הַטְּמֵאָה என்பதற்கு ‘தீட்டான’ என்பது இச்சூழலில் பொருத்தமான வேதாகமத் தமிழ்.
theological_decisions:
- issue: மனித மற்றும் விலங்கு முதற்பேறுகள்மீதான ஆசாரிய உரிமையின் தன்மை
  choice: அவை ஆசாரியனுக்குரியவை; ஆனால் மனித முதற்பேறும் தீட்டான விலங்கின் முதற்பேறும் பலியிடப்படாமல் மீட்கப்பட வேண்டும்.
  alternative: ‘யாவேக்குச் சமர்ப்பித்தல்’ என்பது எல்லா முதற்பேறுகளையும் பலியிடுவதைக் குறிக்கிறது என்று வாசித்தல்.
  rationale: வசனத்தின் இரண்டாம் பகுதியே மனித முதற்பேற்றுக்கும் தீட்டான விலங்கின் முதற்பேற்றுக்கும் மீட்பு கட்டாயம் எனத் தெளிவுபடுத்துகிறது; ஆகவே முதன்மை வினை ‘பலியிடுதல்’ என்று குறுக்கப்படவில்லை.
- issue: אָדָם என்பதன் மொழிபெயர்ப்பு
  choice: மனிதர்
  alternative: ஆண் / மனிதகுலம்
  rationale: இங்கு சொல் பாலினத்தை அல்ல, விலங்குகளுக்கு எதிரான மனித வகையைச் சுட்டுகிறது; ‘மனிதர்’ அந்த எதிரிணையை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘கருப்பையைத் திறந்து பிறக்கும்’ என்ற உருவகம் மூல மொழியின் படிமத்தைத் தக்கவைக்கிறது; ‘முதற்பேறு,’ ‘மீட்க வேண்டும்,’ ‘தீட்டான’ ஆகியவை சூழலுக்கு ஏற்ற, பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
