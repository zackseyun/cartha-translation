revisions:
- from: அவர்கள் உனக்கு ஒப்படைக்கப்பட்ட காவற்பணியையும் கூடாரம் முழுவதற்குமான காவற்பணியையும் மேற்கொள்ள வேண்டும். ஆனால் பரிசுத்தப் பொருட்களையோ பலிபீடத்தையோ அவர்கள் நெருங்கக் கூடாது; இல்லையெனில் அவர்களும் நீங்களும் சாவீர்கள்.
  to: அவர்கள் உன் காவற்பணியையும் கூடாரம் முழுவதற்கான காவற்பணியையும் நிறைவேற்ற வேண்டும். ஆனால் பரிசுத்தப் பொருட்களையோ பலிபீடத்தையோ அவர்கள் நெருங்கக் கூடாது; அவர்களும் நீங்களும் இறந்துபோகாதபடி.
  rationale: The revision resolves the Tamil agreement defect in the final warning by using a natural preventive construction corresponding to the Hebrew warning, while retaining that both the Levites and the addressed priestly group are included. It also makes ‘your charge’ more direct in Tamil. No doctrinal interpretation or additional historical detail has been introduced.
