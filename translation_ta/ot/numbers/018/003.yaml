source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: ta
  text: அவர்கள் உன் காவற்பணியையும் கூடாரம் முழுவதற்கான காவற்பணியையும் நிறைவேற்ற வேண்டும். ஆனால் பரிசுத்தப் பொருட்களையோ பலிபீடத்தையோ அவர்கள் நெருங்கக் கூடாது; அவர்களும் நீங்களும் இறந்துபோகாதபடி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ ... מִשְׁמֶרֶת
  choice: ஒப்படைக்கப்பட்ட காவற்பணியை மேற்கொள்ள வேண்டும்
  rationale: שׁמר மற்றும் מִשְׁמֶרֶת இணைப்பு, ஒப்படைக்கப்பட்ட கடமையைப் பொறுப்புடன் காத்து நிறைவேற்றுவதை குறிக்கிறது. ‘காவற்பணி’ அதன் கண்காணிப்பு சார்ந்த தொழில்நுட்ப நுணுக்கத்தைக் காக்கிறது.
- source_word: מִשְׁמַרְתְּךָ
  choice: உனக்கு ஒப்படைக்கப்பட்ட காவற்பணி
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ஆரோனை நேரடியாகக் குறிக்கிறது; ‘ஒப்படைக்கப்பட்ட’ என்பது மִשְׁמֶרֶת என்பதிலுள்ள பொறுப்பு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: கூடாரம் முழுவதற்குமான காவற்பணி
  rationale: மீண்டும் வரும் மִשְׁמֶרֶת ஒரே சொல்லால் மொழிபெயர்க்கப்படுகிறது; כָּל ‘முழுவதற்குமான’ என்றும் אֹהֶל நேரடியாக ‘கூடாரம்’ என்றும் தரப்படுகிறது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய கடமையின் எல்லையை வரையறுக்கும் விதிவிலக்கை இயல்பாகக் குறிக்கிறது.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: பரிசுத்தப் பொருட்களை
  rationale: כְּלֵי என்பது பாத்திரங்கள், கருவிகள் அல்லது பயன்பாட்டுப் பொருட்கள் எனப் பரந்த பொருளுடையது; ‘பரிசுத்தப் பொருட்கள்’ அந்தப் பரப்பையும் הַקֹּדֶשׁ என்பதன் புனிதத் தன்மையையும் காக்கிறது.
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தையோ
  rationale: எதிர்மறைத் தடையில் தமிழின் ‘-யோ ... -யோ’ அமைப்பு, இரண்டில் எதையும் நெருங்கக் கூடாது என்பதைத் தெளிவாக்குகிறது.
- source_word: לֹא יִקְרָבוּ
  choice: அவர்கள் நெருங்கக் கூடாது
  rationale: קרב என்பதன் இடவியல் சார்ந்த ‘அணுகுதல்/நெருங்குதல்’ பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: இல்லையெனில் அவர்களும் நீங்களும் சாவீர்கள்
  rationale: தடையை மீறினால் ஏற்படும் மரண விளைவை ‘இல்லையெனில்’ இயல்பாக வெளிப்படுத்துகிறது; גַם...גַם இரு தரப்பினரையும் உள்ளடக்குவதால் ‘அவர்களும் நீங்களும்’ என்று நேரடியாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: யார் அழைக்கப்படுகிறார், யாருக்கு வரம்பு விதிக்கப்படுகிறது
  choice: ‘உனக்கு’ என்பது ஆரோனை ஒருமையில் குறிக்கிறது; ‘அவர்கள்’ என்பது லேவியர்களைக் குறிக்கிறது. பரிசுத்தப் பொருட்களையும் பலிபீடத்தையும் அணுகுவதிலிருந்து லேவியர்கள் தடுக்கப்படுகிறார்கள்.
  alternative: ‘உனக்கு’ என்பதை ஆசாரியர்கள் அனைவரையும் பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்ளுதல்.
  rationale: מִשְׁמַרְתְּךָ என்பதிலுள்ள இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் உடனடியான சூழலும் ஆரோனிடம் நேரடியாகப் பேசப்படுவதை ஆதரிக்கின்றன.
- issue: மரண எச்சரிக்கையின் எல்லை
  choice: எல்லை மீறப்பட்டால் லேவியர்களும் ஆரோன் உட்பட்ட ஆசாரியத் தரப்பினரும் மரணப் பொறுப்புக்கு உட்படுவர்.
  alternative: லேவியர்கள் மட்டுமே சாவார்கள்.
  rationale: גַם הֵם גַּם אַתֶּם என்பது ‘அவர்களும் நீங்களும்’ என்று இரு தரப்பினரையும் வெளிப்படையாக உள்ளடக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனாலும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஆசாரியப் பணிச் சூழலில் מִשְׁמֶרֶת என்பதன் காவல் மற்றும் ஒப்படைக்கப்பட்ட கடமை ஆகிய இரு நுணுக்கங்களையும் ‘ஒப்படைக்கப்பட்ட காவற்பணி’ காக்கிறது. எபிரேய ஒருமை ‘உனக்கு’ என்பதும் பன்மை ‘நீங்களும்’ என்பதும் திட்டமிட்டு வேறுபடுத்தப்பட்டுள்ளன.
