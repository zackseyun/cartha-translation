source:
  edition: WLC
  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: ta
  text: உங்கள் எல்லாக் கொடைகளிலிருந்தும் யாவேக்குரிய முழுக் காணிக்கையையும் உயர்த்திப் படைக்க வேண்டும்; அவற்றின் மிகச் சிறந்த பகுதியிலிருந்து[a], அதிலிருந்து பிரிக்கப்படும் பரிசுத்தப் பகுதியை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அவற்றின் கொழுப்பிலிருந்து”; அதாவது, அவற்றின் மிகத் தேர்ந்த பகுதியிலிருந்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் அர்ப்பணிக்கப்பட்ட பகுதியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: உங்களுடைய எல்லாக் கொடைகளிலிருந்தும்
  rationale: מִן + כֹּל என்பது மொத்தக் கொடைகளிலிருந்து பிரித்தெடுப்பதைக் குறிக்கிறது; מַתָּנוֹת என்பதற்கு சூழலை மிகைப்படுத்தாமல் ‘கொடைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תָּרִימוּ
  choice: உயர்த்திப் படைக்க வேண்டும்
  rationale: רוּם என்பதன் Hiphil வடிவம் காணிக்கையை உயர்த்திப் பிரித்துப் படைக்கும் ஆசார மொழிநடையைத் தக்கவைக்கிறது; தமிழில் கட்டளையின் பொருளை இயல்பாக வெளிப்படுத்த ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: யாவேக்குரிய ஒவ்வொரு காணிக்கையையும்
  rationale: תְּרוּמָה என்பது பிரித்தெடுத்து உயர்த்திப் படைக்கப்படும் காணிக்கை; כָּל இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொரு’ எனத் தரப்பட்டுள்ளது. יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִכָּל חֶלְבּוֹ
  choice: ஒவ்வொன்றின் மிகச் சிறந்த பகுதியிலிருந்து
  rationale: חֵלֶב என்பதன் நேர்ப்பொருள் ‘கொழுப்பு’; ஆனால் கொடைகளைப் பற்றிய இச்சூழலில் அது வளமான அல்லது தேர்ந்த பகுதியைக் குறிக்கிறது. ஒருமை உருபு கொடைகள் ஒவ்வொன்றையும் தொகுத்துச் சுட்டுவதால் ‘ஒவ்வொன்றின்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: அதன் பரிசுத்தப் பகுதியை எடுத்துப் படைக்க வேண்டும்
  rationale: מִקְדָּשׁ இங்கு கொடையிலிருந்து பரிசுத்தமாகப் பிரிக்கப்பட்ட பகுதியைக் குறிக்கிறது. இறுதியில் வரும் מִמֶּנּוּ-வின் ‘அதிலிருந்து’ என்ற கருத்து முந்தைய ‘பகுதியிலிருந்து’ என்பதில் வெளிப்படுவதால், தமிழில் வினையை மறுபடியும் கூறி வாக்கியம் நிறைவு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: חֶלֶב என்பதன் காணிக்கைச் சூழலிலான பொருள்
  choice: மிகச் சிறந்த பகுதி
  alternative: கொழுப்பு
  rationale: இங்கு விலங்கின் உடற்கொழுப்பு மட்டும் குறிக்கப்படவில்லை; எல்லா வகைக் கொடைகளிலும் உள்ள தேர்ந்த பகுதி குறிக்கப்படுகிறது. நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: מִקְדְּשׁוֹ என்பதன் தெளிவில்லாத வடிவம்
  choice: அதன் பரிசுத்தப் பகுதி
  alternative: அதன் அர்ப்பணிக்கப்பட்ட பகுதி
  rationale: சொல் பரிசுத்தமாகப் பிரித்துவைக்கப்பட்ட ஒன்றைக் குறிக்கிறது. ‘பரிசுத்தப் பகுதி’ மூலத்தின் பரிசுத்தத் தன்மையை நேரடியாகத் தக்கவைக்கிறது; செயற்பொருளை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயர்த்திப் படைக்க’ என்பது எபிரெய காணிக்கை மரபுச் சொல்லின் உருவகத்தைத் தக்கவைக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
