revisions:
- from: அவர்களுடைய நாட்டிலுள்ள அனைத்தின் முதற்கனிகளிலும் அவர்கள் யெகோவாவிடம் கொண்டுவருவது உனக்குரியதாகும். உன் வீட்டில் சடங்குமுறைப்படி தூய்மையான எவரும் அதை உண்ணலாம்.
  to: அவர்களுடைய நாட்டிலுள்ள எல்லாவற்றின் முதற்கனிகளை அவர்கள் யெகோவாவுக்குக் கொண்டுவரும்போது, அவை உனக்குரியவை. உன் வீட்டிலுள்ள சடங்குமுறைப்படி தூய்மையான ஒவ்வொருவரும் அதை உண்ணலாம்.
  rationale: The revision corrects the first clause’s construct relationship and number agreement while retaining the Hebrew’s broad “everything in their land,” the act of bringing to YHWH, Aaron’s entitlement, and the ritual-purity qualification. No footnote is required because the ritual sense of “clean” is stated transparently in the text.
  reviewer_model: gpt-5.6-terra
