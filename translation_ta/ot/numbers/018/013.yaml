  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: ta
  text: அவர்களுடைய நாட்டிலுள்ள எல்லாவற்றின் முதற்கனிகளை அவர்கள் யெகோவாவுக்குக் கொண்டுவரும்போது, அவை உனக்குரியவை. உன் வீட்டிலுள்ள சடங்குமுறைப்படி தூய்மையான ஒவ்வொருவரும் அதை உண்ணலாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: முதற்கனிகள்
  rationale: அறுவடை அல்லது விளைச்சலில் முதலில் கிடைத்து அர்ப்பணிக்கப்படும் விளைபொருளைக் குறிக்கும்; வழிபாட்டுச் சூழலுக்கு ஏற்ற சுருக்கமான மரபுச் சொல்.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: அவர்களுடைய நாட்டிலுள்ள அனைத்தின்
  rationale: எபிரெயச் சொற்றொடரின் பரந்த குறிப்பைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘விளைபொருள்’ என்பதைச் சேர்க்காமல் முதற்கனிகளுடன் இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: அவர்கள் யெகோவாவிடம் கொண்டுவருவது
  rationale: ‘கொண்டுவருதல்’ என்ற வினையின் நேரடிப் பொருளையும், அர்ப்பணிப்பின் வழிபாட்டுச் சூழலையும் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவிடம்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயர் יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தமிழில் பெயராகக் காட்டுகிறது.
- source_word: לְךָ יִהְיֶה
  choice: உனக்குரியதாகும்
  rationale: ஆரோனுக்கு வழங்கப்படும் உரிமையைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: כָּל טָהוֹר
  choice: சடங்குமுறைப்படி தூய்மையான எவரும்
  rationale: ஆசாரியச் சட்டச் சூழலில் טָהוֹר என்பது பொதுவான ஒழுக்கத் தூய்மையைவிட சடங்குத் தூய்மையைக் குறிப்பதால், தமிழில் தவறான புரிதலைத் தவிர்க்க வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּבֵיתְךָ
  choice: உன் வீட்டில்
  rationale: ஆரோனின் வீட்டார் அல்லது குடும்பத்தாரைக் குறிக்கும் எபிரெய உருவகத்தை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: יֹאכֲלֶנּוּ
  choice: அதை உண்ணலாம்
  rationale: இச்சூழலில் வினை எதிர்கால நிகழ்வை மட்டும் அல்லாமல் அனுமதிக்கப்பட்ட உரிமையைக் காட்டுவதால் ‘உண்ணலாம்’ பொருத்தமானது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் ‘தூய்மையானவர்’ என்பதன் தன்மை
  choice: சடங்குமுறைப்படி தூய்மையான ஆரோனின் வீட்டார் இந்தப் பங்கை உண்ணலாம்
  alternative: பொதுவான பொருளில் ஒழுக்க ரீதியாகத் தூய்மையானவர்
  rationale: எண்ணாகமம் 18-ன் ஆசாரிய உரிமை மற்றும் தூய்மை விதிகளின் சூழல், இங்கு טָהוֹר என்பது சடங்கு அல்லது வழிபாட்டு நிலையைக் குறிப்பதை ஆதரிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முதற்கனிகள்’ என்ற வழிபாட்டு மரபுச் சொல் தக்கவைக்கப்பட்டுள்ளது; ‘சடங்குமுறைப்படி’ என்பதை முதன்மை உரையிலேயே சேர்த்து பொருளைத் தெளிவாக்கியதால் அடிக்குறிப்பு தேவையில்லை.
