revisions:
- from: இஸ்ரவேலில் மாற்ற முடியாதபடி அர்ப்பணிக்கப்பட்ட அனைத்தும் உனக்குரியதாக இருக்கும்.[a]
  to: இஸ்ரவேலில் மீளப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்ட அனைத்தும் உனக்குரியதாக இருக்கும்.[a]
