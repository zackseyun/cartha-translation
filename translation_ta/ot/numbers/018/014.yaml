  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: ta
  text: இஸ்ரவேலில் மீளப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்ட அனைத்தும் உனக்குரியதாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் தடைக்குட்படுத்தப்பட்ட அனைத்தும்.” חֵרֶם என்பது கடவுளுக்கென மீளப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்டதைக் குறிக்கிறது; சில சூழல்களில் அழிப்பதற்கென அர்ப்பணிக்கப்பட்டதையும் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: அனைத்தும்
  rationale: ஒருமைத் தொகுப்புப் பொருளான חֵרֶם குறிக்கும் முழு வகையையும் இயல்பான தமிழில் உள்ளடக்குகிறது.
- source_word: חֵרֶם
  choice: மாற்ற முடியாதபடி அர்ப்பணிக்கப்பட்ட
  rationale: கடவுளுக்கென மீளப்பெற முடியாத வகையில் ஒதுக்கப்பட்ட பொருள் என்ற சட்ட-வழிபாட்டுச் சொல்லின் மையப் பொருளைத் தெரிவிக்கிறது; அழிக்கப்பட வேண்டியது என்ற பொருளை இவ்வசனத்துக்குள் தேவையின்றித் திணிக்கவில்லை.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: ב முன்னிடைச்சொல் குறிக்கும் இடம் அல்லது செயல்படும் வட்டத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְךָ
  choice: உனக்குரியதாக
  rationale: ஆரோனுக்கான உடைமை அல்லது சட்டப்பூர்வ ஒதுக்கீட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יִהְיֶה
  choice: இருக்கும்
  rationale: היה வினையின் நிறைவுறா வடிவம் இங்கு எதிர்கால சட்ட ஒதுக்கீட்டைக் குறிக்கிறது.
theological_decisions:
- issue: חֵרֶם என்ற தொழில்நுட்ப வழிபாட்டு-சட்டச் சொல்லின் பொருள்
  choice: மாற்ற முடியாதபடி அர்ப்பணிக்கப்பட்ட
  alternative: தடைக்குட்படுத்தப்பட்ட அனைத்தும்; அழிவுக்கென அர்ப்பணிக்கப்பட்ட அனைத்தும்
  rationale: இச்சொல் கடவுளுக்கென மீளப்பெற முடியாதபடி ஒதுக்கப்பட்டதைப் பொதுவாகக் குறிக்கலாம்; சில சூழல்களில் அது அழிக்கப்படுவதற்கென ஒதுக்கப்பட்டதையும் குறிக்கும். இந்த வசனம் அழிவைத் தனியாகக் குறிப்பிடாததால், பரந்த பொருள் முதன்மை உரையில் வைக்கப்பட்டு வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சட்டநடையுடனும் பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழியுடனும் மொழிபெயர்க்கப்பட்டது. חֵרֶם என்பதன் தொழில்நுட்பத் தன்மையும் பொருள் விரிவும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
