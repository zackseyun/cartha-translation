  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: ta
  text: நீ அவர்களிடம், “அதிலிருந்து அதன் சிறந்த பகுதியை[a] நீங்கள் எடுத்துச் செலுத்தும்போது, அது லேவியர்களுக்குப் போரடிக்கும் களத்தின் விளைச்சலைப் போலவும் திராட்சைப் பிழியும் ஆலையின் விளைச்சலைப் போலவும் கணக்கிடப்படும்” என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “அதன் கொழுப்பு”; இங்கே அது விளைபொருளின் செழுமையான அல்லது மிகச் சிறந்த பகுதியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: நீ அவர்களிடம் … என்று சொல்
  rationale: மோசேயை நோக்கிய இரண்டாம் நபர் ஒருமை கட்டளையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: בַּהֲרִימְכֶם
  choice: நீங்கள் எடுத்துச் செலுத்தும்போது
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம் ஒரு பங்கை உயர்த்துதல் அல்லது காணிக்கையாகச் செலுத்துதல் என்ற சூழல்சார் பொருளைக் கொண்டது; இந்தத் தமிழாக்கம் அந்த இரு கூறுகளையும் இயல்பாக இணைக்கிறது.
- source_word: חֶלְבּוֹ
  choice: அதன் சிறந்த பகுதி
  rationale: சொல்லர்த்தமாக ‘அதன் கொழுப்பு’ என்றாலும், விளைபொருள் சார்ந்த இச்சூழலில் செழுமையான அல்லது மிகச் சிறந்த பங்கை மரபுத்தொடராகக் குறிக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: சிறந்த பகுதி எந்த முழுத் தொகுதியிலிருந்து பிரித்தெடுக்கப்படுகிறது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְנֶחְשַׁב
  choice: கணக்கிடப்படும்
  rationale: חָשַׁב என்பதன் செயப்பாட்டு வடிவத்திலுள்ள கணக்கியல் மற்றும் சட்டபூர்வமாக மதித்தல் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: அந்தப் பங்கு லேவியர்களைப் பொறுத்தவரை எவ்வாறு கணக்கிடப்பட வேண்டும் என்ற தொடர்பை இயல்பாகக் குறிக்கிறது.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: போரடிக்கும் களத்தின் விளைச்சலைப் போல
  rationale: תְּבוּאָה என்பதன் விளைச்சல் என்ற பொருளையும் גֹּרֶן என்பதன் தானியம் போரடிக்கும் களம் என்ற வேளாண் படிமத்தையும் தக்கவைக்கிறது.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: திராட்சைப் பிழியும் ஆலையின் விளைச்சலைப் போல
  rationale: יֶקֶב குறிக்கும் திராட்சைப் பிழியும் இடம் அல்லது ஆலையைத் தெளிவாகத் தருவதோடு முந்தைய சொற்றொடரின் இணை அமைப்பையும் காக்கிறது.
