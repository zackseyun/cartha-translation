translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேளாண் மற்றும் காணிக்கைச் சூழலின் கண்ணியமான மொழிநடையைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எடுத்துச் செலுத்துதல்’ என்பது மூலத்தின் உயர்த்துதல்/காணிக்கையாக அளித்தல் என்ற இரட்டை நுணுக்கத்தைத் தக்கவைக்கிறது.
