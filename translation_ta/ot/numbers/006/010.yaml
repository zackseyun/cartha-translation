translation_notes:
  register: நவீன பொதுத்தமிழில், திருச்சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் மாற்றுத் தெரிவும் இடத்தைக் குறிக்கும் இரட்டை אֶל அமைப்பும் இயன்றவரை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
