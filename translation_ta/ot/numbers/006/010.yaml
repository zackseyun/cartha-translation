  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: ta
  text: எட்டாம் நாளில் அவன் இரண்டு காட்டுப்புறாக்களையோ அல்லது இரண்டு புறாக்குஞ்சுகளையோ ஆசாரியனிடம், சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: வாவ் இணைப்பின் தொடர்ச்சிப் பொருள் தமிழில் சூழலால் இயல்பாக வெளிப்படுகிறது; காலத்தைக் குறிக்கும் בְּ முன்னொட்டு ‘நாளில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָבִא
  choice: கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் சட்ட அறிவுறுத்தலில் கட்டளைக் கடமையைத் தருவதால், நவீன தமிழில் இயல்பான ‘கொண்டுவர வேண்டும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁתֵּי תֹרִים
  choice: இரண்டு காட்டுப்புறாக்கள்
  rationale: תֹרִים என்பது பொதுவான புறாக்களை அல்ல, turtledoves எனப்படும் ஒரு குறிப்பிட்ட புறா வகையைக் குறிக்கிறது; தமிழில் தெளிவாக ‘காட்டுப்புறாக்கள்’ என வழங்கப்பட்டது.
- source_word: אוֹ
  choice: -யோ அல்லது ... -யோ
  rationale: பலிக்காக அனுமதிக்கப்பட்ட இரு மாற்றுகளில் ஒன்றைத் தேர்ந்தெடுக்கலாம் என்ற எபிரெய disjunction-ஐ இயல்பான தமிழ் இணை அமைப்பு வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: இரண்டு புறாக்குஞ்சுகள்
  rationale: சொல்லெழுத்தாக ‘புறாவின் இரண்டு மகன்கள்’ என்றாலும், இது இளம் புறாக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘புறாக்குஞ்சுகள்’ அதன் இயல்பான தமிழ் வடிவம்.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: பலியை யாரிடம் கொண்டுவர வேண்டும் என்பதைக் குறிக்கும் אֶל என்பதற்கு இங்கு ‘-இடம்’ இயல்பான தமிழ் வடிவம்.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு
  rationale: פֶּתַח என்பது நுழைவாயில்; אֹהֶל מוֹעֵד என்பது கடவுளும் மக்களும் சந்திக்கும் நியமிக்கப்பட்ட கூடாரத்திற்கான நிலையான பெயர் என்பதால் ‘சந்திப்புக் கூடாரம்’ என வழங்கப்பட்டது.
