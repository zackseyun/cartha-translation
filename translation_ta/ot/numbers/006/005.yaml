base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: ta
  text: அவனுடைய நாசீர் விரதத்தின் நாட்களெல்லாம்[a], சவரக்கத்தி அவனுடைய தலையின்மேல் கடந்து செல்லக்கூடாது[b]. அவன் யாவேக்கென்று தன்னைப் பிரித்துக்கொள்ளும் நாட்கள் நிறைவடையும்வரை, அவன் பரிசுத்தமானவனாக இருப்பான்; தன் தலைமுடியை வெட்டாமல் நீளமாக வளர விட வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய பிரித்துக்கொள்ளும் விரதம்.’ ‘நாசீர்’ என்பதற்குப் பின்னுள்ள எபிரெயச் சொல் பிரித்துக்கொள்ளுதல் அல்லது அர்ப்பணித்தல் என்ற கருத்துடன் தொடர்புடையது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘சவரக்கத்தி அவனுடைய தலையின்மேல் கடந்து செல்லக்கூடாது’; அதாவது, அவன் தன் தலைமுடியை மழிக்கக் கூடாது.'
    reason: idiom_explanation
  - marker: c
    text: இங்குள்ள எபிரெயச் சொற்றொடர் தலைமுடியை வெட்டாமல் நீளமாக வளர விடுவதைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: அவனுடைய நாசீர் விரதம்
  rationale: இது ‘விரதம்’ என்பதையும், பிரித்துக்கொள்ளுதல் அல்லது அர்ப்பணித்தல் என்ற கருத்துடைய ‘நாசீர்’ என்ற தொழில்நுட்பப் பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: சவரக்கத்தி அவனுடைய தலையின்மேல் படக் கூடாது
  rationale: ‘சவரக்கத்தி தலையின்மேல் கடந்து செல்லக்கூடாது’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் நெருக்கமாக வெளிப்படுத்துகிறது; இதன் நடைமுறைப் பொருள் தலைமுடியை மழிக்கக் கூடாது என்பதாகும்.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: நாட்கள் நிறைவடையும்வரை
  rationale: מלא என்பதிலுள்ள நிறைவு என்ற கால-சட்டப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: அவன் யாவேக்கென்று தன்னைப் பிரித்துக்கொள்ளும்
  rationale: נזר வேரின் பிரித்துக்கொள்ளுதல்/அர்ப்பணித்தல் என்ற கருத்தையும், யாவேவை நோக்கிய அந்த அர்ப்பணிப்பையும் பாதுகாக்கிறது.
- source_word: קָדֹשׁ יִהְיֶה
  choice: அவன் பரிசுத்தமானவனாக இருப்பான்
  rationale: קדוש என்பதன் நேரடியான இறையியல் நிறையுடைய பொருளை விளக்கச்சொல்லால் மாற்றாமல் பாதுகாக்கிறது.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: தன் தலைமுடியை வெட்டாமல் நீளமாக வளர விட வேண்டும்
  rationale: גַּדֵּל என்பதின் ‘வளர விடுதல்’ என்ற வலிமையையும், פֶּרַע குறிக்கும் வெட்டப்படாத சுதந்திரமான முடிவளர்ச்சியையும் சாதாரண வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான יהוה நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: קָדֹשׁ என்பதற்கு இறையியல் சொல்லை முன்னிறுத்தலா அல்லது விளக்கச் சொல்லைப் பயன்படுத்தலா
  choice: பரிசுத்தமானவனாக இருப்பான்
  alternative: அர்ப்பணிக்கப்பட்டவனாக / பிரித்துவைக்கப்பட்டவனாக இருப்பான்
  rationale: எபிரெயம் வெளிப்படையாக קדוש என்ற சொல்லைப் பயன்படுத்துகிறது. ஆகவே அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்க ‘பரிசுத்தம்’ முன்னிறுத்தப்பட்டது; பிரித்துக்கொள்ளுதல் முந்தைய தொடரிலேயே கூறப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதியின் கண்ணியமான தொனியைப் பேணும் தெளிவான நடை பயன்படுத்தப்பட்டது. ‘நாசீர்’ என்பது ‘நாசரேயன்’ என்பதோடு குழப்பமடையாதவாறு எபிரெயத் தொழில்நுட்பப் பெயருக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது. மூலத்தின் உருவகம் முதன்மை உரையில் ஓரளவு பாதுகாக்கப்பட்டு, அதன் நடைமுறைப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
