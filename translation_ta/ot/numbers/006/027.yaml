  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: ta
  text: இவ்வாறு அவர்கள் என் பெயரை இஸ்ரவேல் மக்கள்மேல்[a][b] வைப்பார்கள்; நானே அவர்களை ஆசீர்வதிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்கள்”; இது இங்கு இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “என் பெயரை ... மேல் வைப்பார்கள்” என்பது ஆண்டவரின் உடன்படிக்கைப் பெயரை அவர்கள்மேல் உரைத்து, அவர்கள் அவருக்குரியவர்கள் என அடையாளப்படுத்துவதை உணர்த்தக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: இவ்வாறு அவர்கள் ... வைப்பார்கள்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருளான ‘வை, இடு’ என்பதைக் காக்கிறது. தொடக்க וְ, இதற்கு முன் கொடுக்கப்பட்ட ஆசீர்வாத முறையின் விளைவைச் சுட்டுவதால், இயல்பான நவீனத் தமிழில் ‘இவ்வாறு’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֶת שְׁמִי
  choice: என் பெயரை
  rationale: ‘என் பெயர்’ என்ற நேரடிப் பொருளை அப்படியே காக்கிறது; ‘அதிகாரம்’ அல்லது ‘ஆசீர்வாதம்’ என விளக்கிப் பெயர்ப்பது மூலத்தின் உடன்படிக்கை சார்ந்த செறிவை ஒரு பொருளுக்குள் சுருக்கிவிடும்.
- source_word: עַל
  choice: மேல்
  rationale: தெய்வீகப் பெயரை மக்கள்மேல் வைப்பது என்ற மூல உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது முழு உடன்படிக்கை மக்களையும் குறிக்கும் வழக்கமான இனக்குழுப் பெயர். நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கத்துக்கு உண்மையாகவும் உள்ளது; நேரடித் தோற்றம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַאֲנִי
  choice: நானே
  rationale: தனியாக இடம்பெறும் אֲנִי தரும் அழுத்தத்தைத் தமிழின் ஏகார வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲבָרֲכֵם
  choice: அவர்களை ஆசீர்வதிப்பேன்
  rationale: ברך என்பதன் ‘ஆசீர்வதி’ என்ற பொருளையும், இங்கு கடவுள் அளிக்கும் உறுதியின் எதிர்கால வலிமையையும் காக்கிறது.
theological_decisions:
- issue: கடவுளின் பெயரை இஸ்ரவேல்மேல் வைப்பதன் பொருள்
  choice: ‘என் பெயரை ... மேல் வைப்பார்கள்’ என்ற உருவகம் அப்படியே காக்கப்பட்டது.
  alternative: ‘என் பெயரை அவர்கள்மேல் சொல்லி அழைப்பார்கள்’ அல்லது ‘அவர்கள் எனக்குச் சொந்தமானவர்கள் எனக் குறியிடுவார்கள்’
  rationale: இந்தச் சொற்றொடர் ஆண்டவரின் உடன்படிக்கைப் பெயரை மக்கள்மேல் உரைத்தல், அவர்களை அவருக்குரியவர்களாக அடையாளப்படுத்துதல், ஆசீர்வாதம் அளித்தல் ஆகியவற்றை உணர்த்தக்கூடும். ஆனால் மூலவசனம் அவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுக்காததால், அதன் செறிவும் இறையியல் இழுப்பும் காக்கப்பட்டுள்ளன.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: ‘இஸ்ரவேல் மக்கள்’
  alternative: ‘இஸ்ரவேலின் மகன்கள்’
  rationale: எபிரெய மொழியில் ஆண்பால் பன்மை வடிவம் இருந்தாலும், இச்சூழலில் சொற்றொடர் முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கிறது. தமிழில் சொல்லுக்குச் சொல் வடிவம் யாக்கோபின் நேரடி ஆண் சந்ததியரை மட்டும் குறிக்கலாம் என்பதால், பொருளைத் துல்லியமாகத் தரும் இயல்பான கூட்டுப்பெயர் பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பெயரை ... மேல் வைப்பார்கள்’ என்ற சற்று அசாதாரணமான உருவகம் திட்டமிட்டு காக்கப்பட்டுள்ளது; ‘நானே’ என்பது எபிரெய வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
