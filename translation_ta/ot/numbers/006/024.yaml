lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: உன்னை ஆசீர்வதித்து ... -ஆராக
  rationale: பியேல் விருப்பநிலை வினையின் ஆசிமொழிச் சாரத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த, இரு வினைகளையும் இணைத்து இறுதியில் ‘காப்பாராக’ என அமைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְיִשְׁמְרֶךָ
  choice: உன்னைக் காப்பாராக
  rationale: שמר என்பதன் பாதுகாத்தல், பேணுதல் என்ற பொருளையும் வினையின் ஆசிமொழிச் சாரத்தையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆசிமொழி நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைச் சுட்டும் ‘உன்னை/உன்னைக்’ மூலத்திற்கேற்ப காக்கப்பட்டுள்ளது; எபிரெயக் கவிதையின் சுருக்கமும் இணைநிலையும் பேணப்பட்டுள்ளன.
