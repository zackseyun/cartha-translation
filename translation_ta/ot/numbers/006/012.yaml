source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: ta
  text: அவன் தன் நாசீர் விரதத்தின் நாட்களை[a] யாவேக்கு மீண்டும் அர்ப்பணித்து, குற்றநிவாரண பலியாக ஒரு வயதுள்ள ஆண் செம்மறியாட்டுக்குட்டியைக் கொண்டுவர வேண்டும். ஆனால், அவனுடைய நாசீர் அர்ப்பணிப்பு தீட்டுப்பட்டதால், முந்தைய நாட்கள் கணக்கில் வராது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் பிரிவினையின் நாட்களை” அல்லது “தன் அர்ப்பணிப்பின் நாட்களை.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “முந்தைய நாட்கள் விழும்”; அதாவது, விரதத்தில் ஏற்கெனவே கழித்த நாட்கள் இனி கணக்கில் சேராது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: மீண்டும் தொடங்கி
  rationale: நாசீர் அர்ப்பணிப்பின் நாட்கள் தீட்டால் இடைமுறிந்தபின் அவற்றை மறுபடியும் கடைப்பிடிக்கத் தொடங்குவதையே இச்சூழலில் ஹிஃபில் வடிவம் குறிக்கிறது. ‘மீண்டும் அர்ப்பணித்து’ என்பதும் சாத்தியம்; ஆனால் தமிழில் நாட்களை ‘மீண்டும் தொடங்குதல்’ இயல்பாகவும் சூழலின் சட்டப்பொருளைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: יְמֵי נִזְרוֹ
  choice: தன் நாசீர் விரத நாட்களை
  rationale: Numbers 6-இல் נזר என்பது அர்ப்பணிக்கப்பட்ட பிரிவினையையும் அதற்குரிய குறிப்பிட்ட நாசீர் முறையையும் குறிக்கிறது. ‘நாசீர் விரதம்’ அதன் சட்டச் சடங்கு சார்ந்த சிறப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான ஆண் செம்மறியாட்டுக்குட்டியை
  rationale: பலிக்குரிய விலங்கின் இனம், ஆண்பால், வயது ஆகிய மூன்று விவரங்களையும் தெளிவாகக் காக்கிறது.
- source_word: לְאָשָׁם
  choice: குற்றநிவாரண பலியாக
  rationale: אָשָׁם என்ற குறிப்பிட்ட பலிவகையைத் தமிழில் புரியத்தக்க பாரம்பரியச் சொல்லால் குறிக்கிறது; இது வெறும் பொதுவான பாவபலியுடன் ஒன்றாக்கப்படவில்லை.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: முந்தைய நாட்கள் கணக்கில் வராது
  rationale: சொல்லுக்குச் சொல் ‘முந்தைய நாட்கள் விழும்’ என்றாலும், இச்சட்டச் சூழலில் ஏற்கெனவே நிறைவேற்றிய நாட்கள் விரதக் காலத்தில் சேராது என்பதே அதன் விளைவு. அடிச்சொல் உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: அவனுடைய நாசீர் விரதம் தீட்டுப்பட்டதால்
  rationale: טמא என்பதன் சடங்கியல் அசுத்தப் பொருளை ‘தீட்டுப்பட்டது’ தெரிவிக்கிறது; נזר-ஐ இவ்வதிகாரத்தின் நாசீர் நிறுவனத்தோடு தொடர்ச்சியாக இணைக்கிறது.
theological_decisions:
- issue: Numbers 6-இல் נזר / נזרו என்பதன் மொழிபெயர்ப்பு
  choice: நாசீர் விரதம்
  alternative: பிரிவினை; அர்ப்பணிப்பு
  rationale: மூலச்சொல் அர்ப்பணிக்கப்பட்ட பிரிவினையை உணர்த்தினாலும், இங்கு அது நாசீர் என்ற குறிப்பிட்ட சட்டச் சடங்கு முறையைக் குறிக்கிறது. முதன்மை உரை அந்தத் தொழில்நுட்பப் பொருளைக் காக்கிறது; பரந்த சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் வெளிப்படையாகக் காட்டுகிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் வழக்கமான ஆய்வுசார் மறுவுருவாக்கத்துக்கு நெருக்கமான தமிழ் வடிவம்.
- issue: יִפְּלוּ என்பதன் சட்டப்பொருள்
  choice: கணக்கில் வராது
  alternative: விழும்; செல்லாததாகும்; இழக்கப்படும்
  rationale: சொல்லுருவம் ‘விழும்’ என்றாலும், முந்தைய விரத நாட்கள் இனி நிறைவேற்றப்பட்ட காலமாக ஏற்கப்படாது என்பதே சூழல்சார் பொருள். உருவகத்தை முதன்மை உரையில் செயற்கையாகத் திணிக்காமல் அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டச் சடங்கு சார்ந்த ‘நாசீர் விரதம்’, ‘தீட்டு’, ‘குற்றநிவாரண பலி’ ஆகிய சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; எபிரெய உருவகத்தின் அசாதாரணத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
