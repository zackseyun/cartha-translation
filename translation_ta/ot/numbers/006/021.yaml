- from: '“நேர்ச்சை செய்கிற நாசீரேயனுக்கான விதிமுறை இதுவே: அவன் தனது நாசீரேய விரதத்துக்காக யாவேவுக்குச் செலுத்தும் காணிக்கையைத் தவிர, அவனுடைய வசதிக்கு எட்டியதையும் செலுத்த வேண்டும்.[a] அவன் என்ன நேர்ச்சை செய்தானோ, அதன்படியே தனது நாசீரேய விரதத்துக்கான விதிமுறைக்கு மேலாகச் செய்ய வேண்டும்.[b]”'
  to: '“தன் நாசீரேய விரதத்திற்காக யாவேவுக்குக் காணிக்கையாக நேர்ச்சை செய்கிற நாசீரேயனுக்கான விதிமுறை இதுவே: அவன் தன் வசதிக்கு ஏற்பக் கூடுதலாகச் செலுத்தக்கூடிய காணிக்கைகளும் இதில் அடங்கும்.[a] அவன் செய்த நேர்ச்சையின்படியே, தன் நாசீரேய விரதத்தின் விதிமுறையின்படி செய்ய வேண்டும்.”'
