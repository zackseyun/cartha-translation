base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: ta
  text: '“தன் நாசீரேய விரதத்திற்காக யாவேவுக்குக் காணிக்கையாக நேர்ச்சை செய்கிற நாசீரேயனுக்கான விதிமுறை இதுவே: அவன் தன் வசதிக்கு ஏற்பக் கூடுதலாகச் செலுத்தக்கூடிய காணிக்கைகளும் இதில் அடங்கும்.[a] அவன் செய்த நேர்ச்சையின்படியே, தன் நாசீரேய விரதத்தின் விதிமுறையின்படி செய்ய வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அவனுடைய கை எட்டியதைத் தவிர.” இது அவனுடைய பொருளாதார வசதி அல்லது அவனால் வழங்க முடிவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: நாசீரேயனுக்கான விதிமுறை
  rationale: இங்கு תּוֹרָה என்பது நாசீரேய விரதத்தைக் கட்டுப்படுத்தும் சட்டமுறை விதியைக் குறிக்கிறது. ‘விதிமுறை’ என்பது நவீன தமிழில் இயல்பாகவும் சட்டப் பின்னணிக்கு ஏற்றதாகவும் உள்ளது; נָזִיר என்ற தொழில்நுட்பப் பெயர் ‘நாசீரேயன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יִדֹּר
  choice: நேர்ச்சை செய்கிற
  rationale: נדר வினையின் நேர்ச்சை செய்யும் செயற்பொருளைத் தெளிவாகக் காட்டுகிறது; வசனத்தின் பிற்பகுதியில் வரும் அதே வேர்ச்சொல்லுடனான தொடர்பும் காக்கப்படுகிறது.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: யாவேவுக்குச் செலுத்தும் காணிக்கை
  rationale: קָרְבָּן என்பது தேவனிடம் கொண்டுவரப்படும் காணிக்கைக்கான பொதுச் சொல். ל முன்னொட்டு காணிக்கை யாருக்குச் செலுத்தப்படுகிறது என்பதைக் காட்டுகிறது.
- source_word: עַל נִזְרוֹ
  choice: தனது நாசீரேய விரதத்துக்காக
  rationale: இந்த அதிகாரத்தில் נֵזֶר என்பது நாசீரேயரின் பிரித்துவைக்கப்பட்ட விரதநிலையைக் குறிக்கிறது. தமிழில் சூழலைத் தெளிவுபடுத்த ‘நாசீரேய விரதம்’ பயன்படுத்தப்பட்டது.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: அவனுடைய வசதிக்கு எட்டியதையும்
  rationale: ‘அவனுடைய கை எட்டுவது’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் பொருளாதாரத் திறனை அல்லது வழங்கும் ஆற்றலைக் குறிக்கிறது. ‘வசதிக்கு எட்டியது’ மூல உருவகத்தின் சுவட்டைத் தக்கவைக்கிறது.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: அவன் என்ன நேர்ச்சை செய்தானோ, அதன்படியே
  rationale: நேர்ச்சையின் உள்ளடக்கத்துக்கு இணங்கச் செயல்பட வேண்டும் என்ற சட்டப்பூர்வக் கடமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயத்தில் மீண்டும் வரும் நேர்ச்சைச் சொல்லும் தக்கவைக்கப்படுகிறது.
- source_word: כֵּן יַעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: இந்தச் சட்டச் சூழலில் imperfect வடிவம் எதிர்காலத்தை மட்டும் அல்லாமல் கட்டாயத்தையும் வெளிப்படுத்துகிறது; ‘வேண்டும்’ அதன் நெறிப்படுத்தும் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: தனது நாசீரேய விரதத்துக்கான விதிமுறைக்கு மேலாக
  rationale: இறுதி עַל, ஏற்கெனவே நிர்ணயிக்கப்பட்ட நாசீரேய காணிக்கைகளுக்கு மேலாக நேர்ச்சையில் சொன்னதைச் செய்வதைக் குறிக்கலாம். உடனுள்ள מִלְּבַד என்பதுடனும் இது பொருந்துகிறது; மாற்றாக ‘விதிமுறையின்படி’ என்றும் புரிந்துகொள்ளலாம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தனிப்பெயராக ‘யாவே’ என வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: இறுதி עַל תּוֹרַת נִזְרוֹ என்பதன் தொடர்பு
  choice: விதிமுறைக்கு மேலாக
  alternative: விதிமுறையின்படி
  rationale: வசனத்தின் முந்தைய ‘தவிர/மேலும்’ கருத்தும், நிர்ணயிக்கப்பட்ட காணிக்கைகளோடு நேர்ச்சையால் கூடுவது என்ற சட்டப் பின்னணியும் ‘மேலாக’ என்ற வாசிப்பை ஆதரிக்கின்றன. எனினும் עַל என்பதற்கு ‘அடிப்படையில்/அதன்படி’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாசீரேயன்’ என்ற தொழில்நுட்பப் பெயர் ‘நாசரேயன்’ என்பதுடன் குழப்பம் ஏற்படாதவாறு வேறுபடுத்தப்பட்டது. எபிரெயத்தின் நீண்ட வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
