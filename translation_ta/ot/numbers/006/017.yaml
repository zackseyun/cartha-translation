source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: ta
  text: அவர் புளிப்பில்லாத அப்பங்களின் கூடையோடு சேர்த்து, அந்த ஆட்டுக்கடாவை யாவேக்கு சமாதானப் பலியாக[a] செலுத்த வேண்டும். ஆசாரியர் அதற்குரிய தானியக் காணிக்கையையும் பானக் காணிக்கையையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறவுப் பலி.” எபிரேயச் சொல் שְׁלָמִים என்பதை “சமாதானப் பலி” அல்லது “உறவுப் பலி” என மொழிபெயர்க்கலாம்.
    reason: שְׁלָמִים என்பதற்கான உண்மையான சொற்பொருள் மாற்றைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הָאַיִל
  choice: அந்த ஆட்டுக்கடா
  rationale: பலியிடும் சூழலில் אַיִל என்பது வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; தமிழில் இயல்பான குறிப்பான சொல் ‘ஆட்டுக்கடா’.
- source_word: יַעֲשֶׂה / וְעָשָׂה
  choice: செலுத்த வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், இங்குள்ள பலிச் சடங்குச் சூழலில் பலியையோ அதனுடன் சேர்ந்த காணிக்கைகளையோ செலுத்துவதைக் குறிக்கிறது.
- source_word: זֶבַח שְׁלָמִים
  choice: சமாதானப் பலி
  rationale: זֶבַח குறிக்கும் பலியிடுதலையும் שְׁלָמִים குறிக்கும் பலிவகையையும் தமிழில் இயல்பாக ஒருங்கிணைக்கும் வழக்கமான சொற்றொடர் இது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, לְ குறிக்கும் அர்ப்பணிப்பின் இலக்கை ‘-க்கு’ வேற்றுமையால் காட்டுகிறது.
- source_word: עַל סַל הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பங்களின் கூடையோடு சேர்த்து
  rationale: இங்கு עַל இடநிலையை மட்டும் அல்லாமல் பலியுடன் வரும் சடங்குச் சேர்க்கையைக் குறிக்கிறது; ‘கூடையோடு சேர்த்து’ அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִנְחָתוֹ
  choice: அதற்குரிய தானியக் காணிக்கை
  rationale: ஆசாரிய நூல்களில் מִנְחָה பொதுவாக தானியக் காணிக்கையைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு இப்பலியுடன் தொடர்புடைய காணிக்கையைச் சுட்டுவதை ‘அதற்குரிய’ தெளிவாக்குகிறது.
- source_word: נִסְכּוֹ
  choice: அதற்குரிய பானக் காணிக்கை
  rationale: נֶסֶךְ சார்ந்த வடிவம் பலியுடன் செலுத்தப்படும் திரவக் காணிக்கையைக் குறிக்கிறது; ‘பானக் காணிக்கை’ தெளிவான நவீனத் தமிழ் வழக்கு.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி
  rationale: ‘சமாதானப் பலி’ மரபான பரந்த பலிவகைப் பெயரைப் பாதுகாக்கிறது; பகிர்ந்துண்ணுதல் அல்லது ஐக்கியம் என்ற அம்சத்தை மட்டும் முன்வைத்து பொருளைச் சுருக்கவில்லை. உண்மையான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் பலிச் சட்டத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் வினையின் ஆண்பால் ஒருமை எழுவாய் மரியாதை ஒருமையான ‘அவர்’ எனவும், ஆசாரியர் தனியாகத் தெளிவுபடுத்தப்பட்டும் உள்ளது.
