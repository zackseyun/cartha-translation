  rationale: 'நாசீர் அர்ப்பணிப்புடனான தலை/முடியின் தொடர்பைச் சொற்சார் முறையில் தெளிவுபடுத்தவும், இறுதிச் சுட்டுப்பெயரின் தெளிவின்மையை நீக்கவும் உரை திருத்தப்பட்டுள்ளது. அடிக்குறிப்பு a தலை-அர்ப்பணிப்பு தொடர்புக்கே இணைக்கப்பட வேண்டும்; அடிக்குறிப்பு b மூலத்தின் திடீர்-மரணம் இரட்டைவலியுறுத்தலுக்கே இணைக்கப்பட வேண்டும். திருத்தப்பட்ட உரையில் அவற்றின் சரியான இடங்கள்: ‘அர்ப்பணிப்புக்குரிய தலை[a]’ மற்றும் ‘திடீரென்று, எதிர்பாராத விதமாக[b]’.'
