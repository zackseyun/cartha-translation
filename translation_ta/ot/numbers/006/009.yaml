  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: ta
  text: ஒருவன் அவனருகில் திடீரென்று, எதிர்பாராத விதமாக இறந்து, அவனுடைய அர்ப்பணிப்புக்குரிய தலை தீட்டுப்பட்டால், அவன் தூய்மையடையும் நாளில் தன் தலையை மழிக்க வேண்டும்; ஏழாம் நாளில் தன் தலையை மழிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: ஒருவன் … இறந்து … தீட்டுப்பட்டால்
  rationale: நாசீர் அர்ப்பணிப்பு குறித்த சட்டத்தில் ஒரு நிபந்தனைச் சூழலை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான ‘-ஆல்’ நிபந்தனை அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יָמוּת מֵת
  choice: ஒருவன் … இறந்து
  rationale: ‘இறந்தவன் இறந்தால்’ என்ற எபிரெய cognate construction தமிழில் இயல்பற்றது; அது ஒரு நபர் இறப்பதைக் குறிக்கும் மரபுத்தொடர் என்பதால் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: עָלָיו
  choice: அவனருகில்
  rationale: இங்கு உடல்மீது விழுதல் அல்லது நேரடித் தொடுதல் அவசியம் எனக் கூறாமல், நாசீரின் உடனடி அருகாமையில் மரணம் நிகழ்வதைக் குறிக்கிறது.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: எதிர்பாராத விதமாகத் திடீரென்று
  rationale: இரட்டைச் சொற்றொடர் மரணத்தின் திடீர்மையையும் எதிர்பாராத தன்மையையும் வலியுறுத்துகிறது.
- source_word: וְטִמֵּא
  choice: தீட்டுப்பட்டால்
  rationale: எபிரெய வடிவம் செயப்படுபொருள் கொண்ட வினையாக இருந்தாலும், தமிழில் மரணம் நிகழ்ந்த சூழலால் நாசீரின் அர்ப்பணிக்கப்பட்ட தலை சடங்குமுறைப்படி தீட்டடைவதை இயல்பாக வெளிப்படுத்துகிறது; மனிதரின் ஒழுக்கக் குற்றம் என்ற பொருளை ஏற்றவில்லை.
- source_word: רֹאשׁ נִזְרוֹ
  choice: அவனுடைய அர்ப்பணிக்கப்பட்ட தலை
  rationale: נזר என்பது இங்கு நாசீர் நிலையின் அர்ப்பணிப்பைக் குறிக்கிறது; வெட்டப்படாத தலைமுடியுடன் தொடர்புடைய தலையின் சடங்குமுறை முக்கியத்துவத்தை வாசிக்கத்தக்க தமிழில் காக்கிறது.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: அவன் தூய்மையடையும் நாளில்
  rationale: சடங்குமுறைத் தீட்டிலிருந்து தூய்மையடைவதைக் குறிக்கிறது; பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: காலக் குறிப்பை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְגַלְּחֶנּוּ
  choice: அதை மழிக்க வேண்டும்
  rationale: பின்னொட்டு முன்பு கூறப்பட்ட தலையைக் குறிக்கிறது; ‘அதை’ என்ற சுட்டுப்பெயர் எபிரெயத் தொடர்ச்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: நாசீர் அர்ப்பணிப்பும் தீட்டும் பற்றிய மொழி
  choice: ‘அர்ப்பணிக்கப்பட்ட தலை’ என்றும் சடங்குமுறைத் ‘தீட்டு/தூய்மை’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘விரதத்தின் தலை’ அல்லது ஒழுக்கரீதியான மாசு என்று மொழிபெயர்த்தல்
  rationale: வசனம் நாசீர் அர்ப்பணிப்பை இடைமறிக்கும் சடங்குமுறைத் தீட்டைப் பற்றியது. பிற்கால இறையியல் வகைப்பாடுகளையோ குறிப்பிட்ட மரபின் விளக்கத்தையோ சேர்க்காமல், தலை/முடிக்கும் அர்ப்பணிப்புக்கும் உள்ள தொடர்பைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மழித்தல்’, ‘தீட்டு’, ‘தூய்மையடைதல்’ ஆகிய சொற்கள் சடங்குமுறைச் சூழலைத் தெளிவாகக் காட்டுகின்றன. மூலத்தின் திடீர் மரணம், அருகாமை, அர்ப்பணிக்கப்பட்ட தலை ஆகிய கருத்துகள் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
