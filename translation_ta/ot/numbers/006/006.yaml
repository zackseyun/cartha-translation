  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: ta
  text: அவர் ஆண்டவருக்கென்று பிரித்துவைக்கப்பட்டிருக்கும் காலமெல்லாம்[a], இறந்த மனிதரின் உடலருகே[b] அவர் செல்லக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய நாசீரேய விரதக் காலமெல்லாம்” அல்லது “அவருடைய அர்ப்பணிப்புக் காலமெல்லாம்.” எபிரெயச் சொல், நாசீரேயராகப் பிரித்துவைக்கப்பட்ட நிலை அல்லது காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “இறந்த நெஃபெஷ்”; இச்சூழலில் அது மனித சடலத்தை, அதாவது இறந்த மனிதரின் உடலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: நாட்களெல்லாம்
  rationale: விரதத்திற்காகப் பிரித்துவைக்கப்பட்ட காலத்தின் முழு நீளத்தையும் குறிக்கும் எபிரெயக் காலத் தொடரின் விரிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַזִּירוֹ
  choice: அவர் பிரித்துவைக்கப்பட்டிருக்கும்
  rationale: נזר என்ற வேருடன் தொடர்புடைய இச்சொல், நாசீரேயராகத் தனியே பிரிக்கப்பட்ட நிலை அல்லது காலத்தைக் குறிக்கிறது. மூலத்தில் இவ்விடத்தில் இல்லாத ‘விரதம்’ என்ற சொல்லை முதன்மை உரையில் சேர்க்காமல் அதன் பொருளைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கென்று
  rationale: לַ என்ற முன்னொட்டு அர்ப்பணிப்பு அல்லது ஒருவருக்காக ஒதுக்கப்பட்டிருத்தலைக் காட்டுகிறது; יהוה என்ற இறைப் பெயர் தமிழில் மரியாதை மரபுக்கு ஏற்றவாறு ‘ஆண்டவர்’ என வழங்கப்படுகிறது.
- source_word: עַל נֶפֶשׁ מֵת
  choice: இறந்த மனிதரின் உடலருகே
  rationale: தூய்மைச் சட்டச் சூழலில் இத்தொடர் மனித சடலத்தைக் குறிக்கிறது; עַל உடன் בוא சேர்ந்திருப்பது அதை அணுகுவதைக் குறிக்கிறது.
- source_word: לֹא יָבֹא
  choice: அவர் செல்லக் கூடாது
  rationale: மறுப்புடன் வரும் imperfect வடிவம் சட்டரீதியான தடையை வெளிப்படுத்துகிறது; தமிழில் இயல்பான கட்டளைத் தடை வடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: நாசீரேயர் தொடர்பான சொல்லை அளவுக்கு மீறிக் குறிப்பாக்காமல் மொழிபெயர்த்தல்
  choice: அவர் பிரித்துவைக்கப்பட்டிருக்கும்
  alternative: அவருடைய நாசீரேய விரதம் / அவருடைய அர்ப்பணிப்பு
  rationale: இச்சொல் நாசீரேயர் முறையுடன் தொடர்புடையதாயினும், நேரடியாக விரதத்தைக் காட்டிலும் பிரித்துவைக்கப்பட்ட நிலை அல்லது காலத்தையே குறிக்கிறது. சூழல் நாசீரேயர் முறையைத் தெளிவுபடுத்துவதால், முதன்மை உரையில் ‘விரதம்’ என்று சேர்க்கப்படவில்லை.
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: ஆண்டவர்
  alternative: யாவே / யெகோவா
  rationale: தமிழில் பொதுவாகப் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க இறைப்பட்டமாக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது; பெயரின் வேறு வழங்கல்கள் இங்கே முதன்மை உரையில் திணிக்கப்படவில்லை.
- issue: נֶפֶשׁ מֵת என்பதன் குறிப்பு
  choice: இறந்த மனிதரின் உடல்
  alternative: இறந்த நெஃபெஷ் / இறந்தவர் / சடலம்
  rationale: இந்தத் தூய்மைச் சட்டச் சூழலில் மனித சடலமே குறிக்கப்படுகிறது. ‘உடல்’ என்பது தெளிவாகவும் மரியாதையாகவும் உள்ளது; ‘மனிதரின்’ என்பது மிருக உடலைக் குறிக்கவில்லை என்பதை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க சட்டவுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘செல்லக் கூடாது’ தடைச்சொல்லை இயல்பாகத் தருகிறது; ‘சடலம்’ என்பதற்குப் பதிலாக முதன்மை உரையில் மென்மையானதும் தெளிவானதுமான ‘இறந்த மனிதரின் உடல்’ பயன்படுத்தப்பட்டுள்ளது.
