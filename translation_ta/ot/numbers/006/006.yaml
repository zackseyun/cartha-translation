    rationale: The Hebrew refers to the total period of the man’s consecrated separation. Recasting it as “அவர் ஆண்டவருக்கென்று பிரித்துவைக்கப்பட்டிருக்கும் காலமெல்லாம்” more naturally expresses that duration in modern standard Tamil and preserves the source’s restraint regarding “vow.”
