  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: ta
  text: ஆசாரியன் அவற்றை யாவேக்கு முன்பாக அசைவுக் காணிக்கையாக அசைக்க வேண்டும். அசைவுக் காணிக்கையின் மார்புப் பகுதியையும் பங்களிப்புக் காணிக்கையின் தொடைப் பகுதியையும் தவிர, இது ஆசாரியனுக்குரிய பரிசுத்தப் பங்காகும். அதன்பின் நசரேயன் திராட்சரசம் குடிக்கலாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன்பின் நசரேயன் திராட்சரசம் குடிப்பான்.” எபிரெய வினையை இவ்வாறு அதிகச் சொற்படியாகவும் மொழிபெயர்க்கலாம்; சூழலில் இது விரதம் முடிந்தபின் மீண்டும் கிடைக்கும் அனுமதியைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: נוּף என்பதன் ஹிஃபில் வடிவமும் அதனுடன் தொடர்புடைய תְּנוּפָה பெயர்ச்சொல்லும் பலியிடும் சடங்கில் கர்த்தர்முன் அசைத்துப் படைக்கும் செயலைக் குறிக்கின்றன; எபிரெய இணைச்சொல் அமைப்பும் தமிழில் முடிந்தவரை காக்கப்படுகிறது.
- source_word: אוֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வேகவைத்த தோள் பகுதி, புளிப்பில்லாத அடை, மெல்லிய அப்பம் ஆகியவற்றைச் சுட்டுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: உடன்படிக்கையின் தனிப்பெயரான יהוה ஒலிபெயர்ப்பாக வழங்கப்பட்டு, לִפְנֵי என்பதன் வழிபாட்டுச் சூழல் ‘முன்பாக’ எனக் காக்கப்படுகிறது.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: அது ஆசாரியனுக்குரிய பரிசுத்தப் பங்காகும்
  rationale: எபிரெய ஒருமை הוּא காக்கப்படுகிறது; ‘பங்கு’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் ஆசாரியனுக்காக ஒதுக்கப்பட்ட பரிசுத்த உரிமை என்ற சட்டப்பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: עַל
  choice: '...ஓடும் ...ஓடும் சேர்த்து'
  rationale: இங்கு עַל இட அமைப்பைக் காட்டாமல், ஏற்கெனவே ஆசாரியனுக்குரிய மார்பும் தொடையும் தவிர/அவற்றுடன் கூடுதலாக இந்தப் பங்கும் வழங்கப்படுவதைக் குறிக்கிறது.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையின் மார்புப் பகுதி
  rationale: பலிச் சடங்கில் ஆசாரியனுக்குரிய குறிப்பிட்ட உடற்பகுதியையும் அதன் அசைவாட்டும் சமர்ப்பிப்பையும் தெளிவாகக் குறிக்கிறது.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: பங்களிப்புக் காணிக்கையின் தொடைப் பகுதி
  rationale: שׁוֹק என்பது இச்சூழலில் மேல் கால்/தொடைப் பகுதியைக் குறிக்கிறது; תְּרוּמָה என்பது பிரித்தெடுத்து வழங்கப்படும் பங்களிப்பாகும்.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: சடங்கு நிறைவுக்குப் பிந்தைய கால வரிசையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: நசரேயன் திராட்சரசம் குடிக்கலாம்
  rationale: יִשְׁתֶּה வடிவம் சொற்படியாக எதிர்கால/முழுமையுறா வினையாக இருந்தாலும், நேர்த்திக்கடன் முடிந்தபின் தடை நீங்குவதைச் சூழல் காட்டுவதால் அனுமதிப் பொருள் முதன்மை உரையில் வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாகத் தோன்றும் உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அதன் தனிப்பெயர் இயல்பைக் காக்கிறது.
- issue: יִשְׁתֶּה என்பதன் வினை வலிமை
  choice: குடிக்கலாம்
  alternative: குடிப்பான்
  rationale: நசரேய விரதத் தடை சடங்குக்குப் பின் நீங்குகிறது என்பதே சூழலின் சட்டப்பொருள்; எனினும் எபிரெய வடிவத்தின் அதிகச் சொற்படியான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலிச் சடங்கின் தொழில்நுட்பச் சொற்களைத் தெளிவாகவும் மரியாதைமிக்க நடையிலும் வழங்குகிறது. ‘நசரேயன்’ என்பது எண்ணாகமம் 6-இன் நேர்த்திக்கடன் ஏற்ற நபருக்கான சுருக்கமான மரபுசார் பெயராகப் பயன்படுத்தப்பட்டுள்ளது; ‘அசைவாட்டும் காணிக்கை’ மற்றும் ‘பங்களிப்புக் காணிக்கை’ ஆகியவை தொடர்புடைய இரு எபிரெயச் சடங்குச் சொற்களின் வேறுபாட்டைக் காக்கின்றன.
