  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: ta
  text: அவன் நாசீரேய விரதத்தைக் கடைப்பிடிக்கும் நாட்களெல்லாம், திராட்சைக்கொடியிலிருந்து செய்யப்படும் எதையும்—திராட்சை விதை முதல் அதன் தோல் வரை[a]—சாப்பிடக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “விதைகளிலிருந்து தோல் வரை.” இது திராட்சையின் எல்லாப் பகுதிகளையும் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְרוֹ
  choice: அவன் நாசீரேய விரதம் இருக்கும்
  rationale: இச்சட்டப் பின்னணியில் இது பொதுவான பிரித்துவைத்தலை அல்ல, நாசீரேயராக இருக்கும் நிலையையும் விரதக் காலத்தையும் குறிக்கிறது. நவீன தமிழில் இயல்பாகப் புரியும்படி இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כֹּל יְמֵי
  choice: நாட்களெல்லாம்
  rationale: விரதத்தின் முழுக் காலத்தையும் குறிக்கும் எபிரெயச் சொற்றொடரின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: செய்யப்படும் எதையும்
  rationale: பின்னர் வரும் எதிர்மறை வினையுடன் சேர்ந்து, தடைசெய்யப்பட்ட அனைத்துப் பொருட்களையும் குறிக்கிறது.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: திராட்சைக்கொடியிலிருந்து
  rationale: சொல்லுக்குச் சொல் 'திராட்சரசத்தின் கொடி' என்ற அமைப்பு தமிழில் இயல்பற்றது; குறிக்கப்படுவது திராட்சைக்கொடியே.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: விதை முதல் தோல் வரை
  rationale: திராட்சையின் எந்தப் பகுதியும் விலக்கல்ல என்பதைச் சுட்டும் எல்லைச்சொற்றொடரைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: לֹא יֹאכֵל
  choice: சாப்பிடக்கூடாது
  rationale: சட்டப் பகுதியில் வரும் எதிர்மறைக் கட்டளையின் தடை வலிமையை நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נִזְרוֹ என்பதன் பொருள்
  choice: நாசீரேய விரதம் இருக்கும் காலநிலை
  alternative: அவனுடைய பிரித்துவைப்பு / அர்ப்பணிப்பு
  rationale: எண்ணாகமம் 6-இன் உடனடிச் சட்டச் சூழல் நாசீரேய விரதத்தைக் குறிப்பதால் தொழில்நுட்பப் பொருள் தேர்ந்தெடுக்கப்பட்டது; அதற்கு அப்பாற்பட்ட சமயக் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் “விதை முதல் தோல் வரை” என்ற சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
