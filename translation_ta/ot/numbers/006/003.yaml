base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: ta
  text: அவன் திராட்சரசத்தையும் மதுபானத்தையும் விட்டு விலகியிருக்க வேண்டும்; திராட்சரசக் காடியையோ மதுபானக் காடியையோ குடிக்கக் கூடாது. திராட்சைப்பழங்களிலிருந்து கிடைக்கும் எந்தத் திரவத்தையும்[a] குடிக்கக் கூடாது; புதிய திராட்சைப்பழங்களையோ உலர்ந்த திராட்சைப்பழங்களையோ[b] சாப்பிடக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சைப்பழங்களை ஊறவைத்த எந்தத் திரவத்தையும்” அல்லது “எந்தத் திராட்சைச்சாற்றையும்.” எபிரெயச் சொல், ஊறவைக்கப்பட்ட அல்லது செயலாக்கப்பட்ட திராட்சைப்பழங்களிலிருந்து கிடைக்கும் திரவத்தை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புதிய திராட்சைப்பழங்களையோ உலர்திராட்சைகளையோ.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “புதிய மற்றும் உலர்ந்த திராட்சைப்பழங்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: திராட்சரசத்தையும் மதுபானத்தையும் விட்டு விலகியிருக்க வேண்டும்
  rationale: נזר என்பதன் ஹிப்ஃபீல் வடிவம் இங்கு குறிப்பிட்ட பானங்களிலிருந்து விலகியிருப்பதைக் குறிக்கிறது. יין என்பதற்கு ‘திராட்சரசம்’ என்றும், שכר என்பதற்கு அதிலிருந்து வேறுபட்ட போதையூட்டும் பானத்தைக் குறிக்கும் ‘மதுபானம்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: திராட்சரசத்திலிருந்து உண்டான காடி; மதுபானத்திலிருந்து உண்டான காடி
  rationale: חֹמֶץ என்பது புளித்துப் புளிப்பான திரவத்தை அல்லது காடியைக் குறிக்கும். எபிரெயக் கட்டமைப்பின் உறவைத் தெளிவுபடுத்த ‘இலிருந்து உண்டான’ என்று வழங்கப்பட்டது.
- source_word: מִשְׁרַת עֲנָבִים
  choice: திராட்சைப்பழங்களிலிருந்து உண்டான எந்தப் பானம்
  rationale: מִשְׁרָה என்பது ஊறவைத்தல் அல்லது பிற செயலாக்கத்தால் கிடைக்கும் திரவத்தைக் குறிக்கலாம்; வெறுமனே புதிதாகப் பிழிந்த சாறு என்று பொருளைச் சுருக்காமல் ‘பானம்’ என வழங்கி, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: பச்சையான அல்லது உலர்ந்த திராட்சைப்பழங்கள்
  rationale: לַחִים என்பது உலர்ந்தவற்றுக்கு எதிராகப் புதிய/ஈரமான பழங்களைக் குறிக்கிறது; இயல்பான தமிழில் ‘பச்சையான’ எனவும், וִיבֵשִׁים என்பதை ‘உலர்ந்த’ எனவும் வழங்கப்பட்டது.
