translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதியின் கண்ணியமான கட்டளை நடையைப் பேணும் வகையில் ‘வேண்டும்/கூடாது’ அமைப்பு பயன்படுத்தப்பட்டது. ‘திராட்சரசம்’ மற்றும் ‘மதுபானம்’ என்ற சொற்கள் יין–שכר வேறுபாட்டைப் பேணுகின்றன; מִשְׁרָה என்பதன் பொருள் தேவையின்றிச் சுருக்கப்படாமல் அடிக்குறிப்பில் அதன் தெளிவின்மை பாதுகாக்கப்பட்டது.
