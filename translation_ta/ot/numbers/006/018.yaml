base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: ta
  text: பின்பு நாசரேயன் சந்திப்புக் கூடாரத்தின் வாசலில் தன் அர்ப்பணிப்புக்குரிய தலையை மழித்து, தன் அர்ப்பணிப்புக்குரிய தலையின் முடியை எடுத்து, சமாதானப் பலியின்[a] கீழுள்ள நெருப்பின்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதை ‘உறவுப் பலி’ அல்லது ‘நலவாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: שְׁלָמִים என்ற சடங்குசார் சொல்லின் பொருள் பரப்புக்குரிய செல்லத்தக்க மொழிபெயர்ப்பு மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: நாசரேயன்
  rationale: இந்த அதிகாரத்தில் விவரிக்கப்படும் குறிப்பிட்ட நாசரேய விரதத்தை மேற்கொண்டவரைக் குறிக்கும் தொழில்நுட்பச் சொல்; பொதுவான ‘அர்ப்பணிக்கப்பட்டவர்’ என்று மொழிபெயர்ப்பதைவிட ஒலிபெயர்ப்பு அதன் சடங்குசார் தன்மையைப் பாதுகாக்கிறது.
- source_word: וְגִלַּח
  choice: மழித்து
  rationale: தலைமுடியைச் சவரம் செய்வதைக் குறிக்கிறது; ‘மழித்தல்’ என்பது தமிழில் இயல்பான, dignified ritual wording.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் வாசலில்
  rationale: פֶּתַח என்பது வாசல் அல்லது நுழைவிடத்தைக் குறிக்கிறது; אֹהֶל מוֹעֵד என்பதற்கு ‘சந்திப்புக் கூடாரம்’ மூலத்தின் கருத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: רֹאשׁ נִזְרוֹ
  choice: தனது அர்ப்பணிப்பின் அடையாளமான தலைமுடி
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘அவனுடைய அர்ப்பணிப்பின் தலை’ என இருந்தாலும், சூழலில் மழிக்கப்படுவது தலைமுடி. முடி நாசரேய அர்ப்பணிப்பின் புலப்படும் அடையாளம் என்பதைத் தெளிவாக்கும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: அந்த முடி
  rationale: முந்தைய கூறில் அர்ப்பணிப்பின் அடையாளமான தலைமுடி தெளிவாகக் குறிப்பிடப்பட்டதால், எபிரெயத்தின் மீளுரையைத் தமிழில் சுமையற்றவாறு குறிக்கிறது; அதே சடங்குசார் முடிதான் எடுக்கப்படுகிறது என்பது தெளிவாக உள்ளது.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: கீழுள்ள நெருப்பில்
  rationale: 'இடவியல் உறவை நேரடியாகப் பாதுகாக்கிறது: பலியுடன் தொடர்புடைய கீழ்ப்புற நெருப்பு.'
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: שְׁלָמִים என்ற சடங்குசார் பலிவகைக்கான நிலைபெற்ற தமிழ் வடிவம்; சமாதானம், நலநிலை, உறவு ஆகிய சொற்பொருள் பரப்பை முழுமையாக ஒரு சொல்லில் அடக்க முடியாததால் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி; நலவாழ்வுப் பலி
  rationale: இது முதன்மையாக சொற்பொருள் மற்றும் சடங்குசார் முடிவு. ‘சமாதானப் பலி’ நிலைபெற்ற பெயரைப் பாதுகாக்கிறது; ‘உறவுப் பலி’ அதன் கூட்டு உணவு/உறவு அம்சத்தை வலியுறுத்துகிறது, ‘நலவாழ்வுப் பலி’ முழுமை மற்றும் நலன் என்ற பொருளை வெளிப்படுத்துகிறது. எந்த ஓர் விளக்கத்தையும் மட்டும் இறுதியானதாகக் கட்டாயப்படுத்தாமல் மாற்றுகள் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட/சடங்கு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை. எபிரெயத்தின் இயல்பற்ற சொற்படி அமைப்பைத் தவிர்த்து, அர்ப்பணிப்புக்கும் தலைமுடிக்கும் உள்ள தொடர்பு வெளிப்படையாக வைக்கப்பட்டுள்ளது. அடிக்குறி [a] உரையின் முடிவில் இணைக்கப்பட்டுள்ளது.
