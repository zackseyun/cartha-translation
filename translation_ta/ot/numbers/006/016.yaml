- from: 'ஆசாரியன் அவற்றை யாவேவின் முன்னிலையில் கொண்டுவந்து[a], அவனுடைய பாவநிவாரணப் பலியையும்[b] தகனபலியையும் செலுத்த வேண்டும்.


    [a] “யாவேவின் முன்னிலையில் அவற்றை அணுகச் செய்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், பலி செலுத்தப்படுவதற்கு முன் கடவுளின் முன்னிலையில் அதைக் கொண்டுவந்து சமர்ப்பிப்பதை வலியுறுத்தக்கூடும்.


