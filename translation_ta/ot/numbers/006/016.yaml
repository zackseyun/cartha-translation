  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: ta
  text: 'ஆசாரியன் அவற்றை யாவேவின் முன்னிலையில் கொண்டுவந்து[a], அந்த நசரேயனுடைய பாவநிவாரணப் பலியையும்[b] தகனபலியையும் செலுத்த வேண்டும்.


    [a] “அவற்றை யாவேவின் முன்னிலையில் அருகே கொண்டுவருதல்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், உண்மையில் பலி செலுத்தும் செயலுக்கு முன், பலிப்பொருட்களைக் கடவுளின் முன்னிலையில் கொண்டுவந்து நிறுத்துவதை வலியுறுத்தக்கூடும்.


    [b] “பாவநிவாரணப் பலி” என்பதை ஆசாரியப் பலிமுறை சார்ந்த மொழிநடையில் “தூய்மைப்படுத்தும் பலி” என்றும் புரிந்துகொள்ளலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றை யாவேவின் முன்னிலையில் அருகே கொண்டுவருதல்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், உண்மையில் பலி செலுத்தும் செயலுக்கு முன், பலிப்பொருட்களைக் கடவுளின் முன்னிலையில் கொண்டுவந்து நிறுத்துவதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பாவநிவாரணப் பலி” என்பதை ஆசாரியப் பலிமுறை சார்ந்த மொழிநடையில் “தூய்மைப்படுத்தும் பலி” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: கொண்டுவந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச் சூழலில் ‘அருகில் கொண்டுவருதல்/முன்னிலையில் சமர்ப்பித்தல்’ எனப் பொருள்படும். அடுத்ததாக வரும் וְעָשָׂה உண்மையான பலி செலுத்தும் செயலைக் குறிக்கும் என்பதால், இரு செயல்களையும் வேறுபடுத்த ‘கொண்டுவந்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் பலிமுறைச் சூழலில் כֹּהֵן என்பதற்கான இயல்பான தமிழ் சொல்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது வழிபாட்டுச் சூழலில் கடவுளின் பிரசன்னத்துக்கு முன்பாக நிகழ்வதைக் குறிக்கிறது; יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעָשָׂה
  choice: செலுத்த வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தல்’ என்றாலும், பெயரிடப்பட்ட பலிகளுடன் வரும் இப்பலிமுறை மரபுத்தொடரில் ‘பலியைச் செலுத்துதல்’ என்பதே இயல்பான பொருள்.
- source_word: אֶת חַטָּאתוֹ
  choice: அவனுடைய பாவநிவாரணப் பலியை
  rationale: חַטָּאת என்பது பாவத்தையும் பாவத்திற்கான பலியையும் குறிக்கலாம். இங்கு பலிமுறைச் சூழல் காரணமாக ‘பாவநிவாரணப் பலி’ என மொழிபெயர்க்கப்பட்டது; ‘தூய்மைப்படுத்தும் பலி’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְאֶת עֹלָתוֹ
  choice: தகனபலியை
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான பலிமுறைச் சொல்; தமிழில் வழக்கமான ‘தகனபலி’ பயன்படுத்தப்பட்டது.
- source_word: implicit object of וְהִקְרִיב
  choice: அவற்றை
  rationale: எபிரெய உரையில் நேரடி செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கூறப்பட்ட பலிப்பொருட்கள் சூழலால் குறிக்கப்படுகின்றன. தமிழில் தெளிவுக்காக ‘அவற்றை’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. ஒரு பொதுப் பட்டத்தைப் பதிலிடாமல், தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து அதன் உடன்படிக்கைப் பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: חַטָּאת பலியின் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்திற்கான பலியை வழக்கமாகக் குறித்தாலும், ஆசாரியப் பலிமுறைச் சூழலில் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்றுப் புரிதலும் சாத்தியம். முதன்மை உரையில் வழக்கமான பெயரும் அடிக்குறிப்பில் மாற்றுப் பொருளும் தரப்பட்டன.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியன்’, ‘பாவநிவாரணப் பலி’, ‘தகனபலி’ ஆகிய பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான தொழில்நுட்ப விளக்கங்கள் அடிக்குறிப்புகளுக்கு மாற்றப்பட்டுள்ளன.
