id: NUM.6.25
reference: Numbers 6:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: ta
  text: யாவே தமது முகத்தை உன்மேல் ஒளிரச் செய்து, உனக்கு அருள் புரிவாராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தமது முகத்தை உன்னை நோக்கி ஒளிரச் செய்து, உனக்குத் தயவு காட்டுவாராக.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָאֵר
  choice: ஒளிரச் செய்து
  rationale: אוֹר என்பதன் ஹிஃபில் வேண்டுதல் வடிவம், யாவே தமது முகத்தை ஒளிரச் செய்ய வேண்டும் என்ற ஆசீர்வாத விருப்பத்தையும் காரணவினை நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, எபிரெயத் திருப்பெயர்; எனவே அதன் தனிப்பெயர் தன்மையைப் பேணும் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: פָּנָיו
  choice: தமது முகத்தை
  rationale: மூலத்தில் உள்ள உறுதியான 'அவருடைய முகம்' என்ற உருவகத்தைச் சுருக்கி 'பிரசன்னம்' அல்லது 'தயவு' என்று விளக்காமல் அப்படியே பேணுகிறது. யாவேக்கு மரியாதைத் தன்னிலைச் சுட்டாக 'தமது' இயல்பானது.
- source_word: אֵלֶיךָ
  choice: உன்மேல்
  rationale: אֶל அடிப்படையில் 'உன்னை நோக்கி' என்ற திசைப்பொருள் கொண்டாலும், முகம் ஒளிர்தல் என்ற தமிழ் சொல்லிணைப்பில் 'உன்மேல்' இயல்பாகவும் அருள்நோக்கின் திசையைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וִיחֻנֶּךָּ
  choice: உனக்கு அருள் புரிவாராக
  rationale: חנן என்பது தயவு அல்லது அருள் காட்டுதலைக் குறிக்கிறது. ஆசீர்வாத நடையில் 'அருள் புரிவாராக' வேண்டுதல் வலிமையையும் கண்ணியமான நவீன நடையையும் பேணுகிறது; 'இரக்கம் காட்டுவாராக' என்பது பரிதாப உணர்வை அளவுக்கு மீறி முன்னிறுத்தலாம்.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலம் திருப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டத்தால் மாற்றாமல் 'யாவே' என ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரைப் பேணுகிறது.
- issue: '''தமது முகத்தை ஒளிரச் செய்து'' என்ற மனித உருவக மொழி'
  choice: உருவகத்தை முதன்மை உரையில் அப்படியே பேணுதல்
  alternative: தமது பிரசன்னத்தை உன்மேல் விளங்கச் செய்து / உன்னைத் தயவுடன் நோக்கி
  rationale: இந்த எபிரெய ஆசீர்வாதம் இறைத்தயவை முகம் ஒளிர்தல் என்ற கவித்துவமான உடல் உருவகத்தால் வெளிப்படுத்துகிறது. அதை அருவமான விளக்கமாகச் சுருக்காமல் வைத்திருப்பது மூலத்தின் கவித்துவத்தையும் இறையியல் நெருக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆசீர்வாத நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைப் பேண 'உன்/உனக்கு' பயன்படுத்தப்பட்டது; வேண்டுதல் வடிவம் இரு வினைகளிலும் '-வாராக' மூலம் தெளிவாக்கப்பட்டுள்ளது.
