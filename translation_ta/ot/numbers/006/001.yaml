  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH (יהוה). இதை ‘யெகோவா’ என்றும் ஒலிப்பெயர்க்கிறார்கள்; பல மொழிபெயர்ப்புகள் மரபுப்படி ‘கர்த்தர்’ என்ற பட்டப்பெயரைப் பயன்படுத்துகின்றன.'
    reason: இறைப் பெயரின் மாற்று ஒலிப்பெயர்ப்பையும் மரபுவழி மாற்றீட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிக்
  rationale: דבר என்பதன் wayyiqtol வடிவம் உரையாடல் நிகழ்வை முன்னெடுக்கிறது. தொடர்ந்து வரும் לֵאמֹר உடன் இயல்பான தமிழில் இணைக்க ‘பேசிக்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பெயர்ப்பைத் தமிழில் தருகிறது; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மூலத்திலுள்ள தனிப்பெயரை மாற்றவில்லை.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்; מֹשֶׁה வழக்கமான தமிழ்ப் பெயர்ப்பில் ‘மோசே’ என வழங்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: தொடர்ந்து வரும் இறைவாக்கின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தைத் தெளிவான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல எபிரெய உரை பட்டப்பெயரை அல்ல, நான்கு எழுத்துகளாலான இறைப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பெயர்ப்பு; மாற்று மரபுகளை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசிக் கூறியதாவது’ என்பது דבר ... לֵאמֹר என்ற முறையான அறிமுகச் சூத்திரத்தை இயல்பாகப் பாதுகாக்கிறது.
