source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: ta
  text: பின்பு ஆசாரியன் செம்மறியாட்டுக் கடாவின் வேகவைத்த முன்கால் பகுதியையும், கூடையிலிருந்து புளிப்பில்லாத ஓர் அப்பத்தையும், புளிப்பில்லாத ஒரு மெல்லிய அப்பத்தையும் எடுத்து, நாசீர் தனது அர்ப்பணிப்புக்குரிய தலைமுடியைச் சிரைத்த பின்பு[a], அவற்றை அவனுடைய உள்ளங்கைகள்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்கு சொல், “தனது அர்ப்பணிப்பைச் சிரைத்த பின்பு.” இச்சூழலில், நாசீரின் அர்ப்பணிப்பைக் குறித்த தலைமுடி பொருளாகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: சடங்கு நடைமுறையில் அடுத்த செயலைக் குறிக்கும் தொடர் அமைப்பாக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: வழிபாட்டுச் சடங்கை நடத்தும் நியமிக்கப்பட்ட பணியாளருக்கான நிலையான தமிழ் சொல்.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: வேகவைத்த முன்கால் பகுதி
  rationale: זְרוֹעַ பலியிடப்பட்ட விலங்கின் முன்கால் அல்லது தோளோடு சேர்ந்த பகுதியைக் குறிக்கிறது; בְּשֵׁלָה அது வேகவைக்கப்பட்டதைத் தெளிவுபடுத்துகிறது.
- source_word: מִן הָאַיִל
  choice: செம்மறியாட்டுக் கடாவின்
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; தமிழில் விலங்கின் வகையும் பாலினமும் தெளிவாகத் தரப்பட்டுள்ளன.
- source_word: חַלַּת מַצָּה אַחַת
  choice: புளிப்பில்லாத ஓர் அப்பம்
  rationale: חַלָּה இங்கு ஒரு முழு அப்ப வகையையும் מַצָּה புளிக்கவைக்கப்படாத தன்மையையும் குறிக்கின்றன.
- source_word: מִן הַסַּל
  choice: கூடையிலிருந்து
  rationale: மூலப்பொருளின் இடம் அல்லது எடுத்துக்கொள்ளப்படும் இடத்தை מן துல்லியமாகக் குறிக்கிறது.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: புளிப்பில்லாத ஒரு மெல்லிய அப்பம்
  rationale: רְקִיק என்பது மெல்லிய அப்ப வகை; முதல் அப்பத்திலிருந்து அதன் வடிவ வேறுபாடு காக்கப்பட்டுள்ளது.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: உள்ளங்கைகளில் ... வைக்க வேண்டும்
  rationale: כַּפֵּי என்பது கைகளையே பொதுவாக அல்லாமல் உள்ளங்கைகளைச் சுட்டுகிறது; சட்டவழிமுறையின் கட்டளைத்தன்மை தமிழில் ‘வேண்டும்’ மூலம் வெளிப்படுகிறது.
- source_word: הַנָּזִיר
  choice: நாசீர் விரதத்துக்குட்பட்டவன்
  rationale: ஒலிபெயர்ப்பை மட்டும் பயன்படுத்துவதற்குப் பதிலாக, குறிப்பிட்ட அர்ப்பணிப்பு விரதத்தில் இருப்பவரை நவீன வாசகர் புரிந்துகொள்ளும் வகையில் அடையாளப்படுத்துகிறது.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: சிரைத்துக்கொண்ட பின்பு
  rationale: முதன்மைச் சடங்குச் செயலுக்கு முன் முடிந்த செயலைக் குறிக்கும் காலத் தொடர்பு இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: נִזְרוֹ என்பதன் சடங்குசார் பொருள்
  choice: தனது அர்ப்பணிப்பின் அடையாளமான தலைமுடி
  alternative: தனது அர்ப்பணிப்பு; தனது அர்ப்பணிப்புக்குரிய முடி
  rationale: சொல்லுக்கு சொல் வடிவம் ‘தனது அர்ப்பணிப்பை’ என இருந்தாலும், இச்சூழலில் சிரைக்கப்படுவது நாசீர் அர்ப்பணிப்பை வெளிப்படுத்திய தலைமுடி. முதன்மை உரை சடங்கின் உடல்சார் குறிப்பைத் தெளிவாக்குகிறது; அடிக்குறிப்பு எபிரெயின் சுருக்கமான, உருவகமான சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் சடங்குசார் துல்லியமும் காக்கப்பட்டுள்ளன. ‘நாசீர் விரதத்துக்குட்பட்டவன்’ என்பது ‘நாசரேயன்’ என்ற வேறு அடையாளத்துடன் குழப்பம் ஏற்படாமல் தவிர்க்கிறது; அப்ப வகைகளுக்கிடையிலான வேறுபாடு ‘அப்பம்’ மற்றும் ‘மெல்லிய அப்பம்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
