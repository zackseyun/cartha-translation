  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: ta
  text: ஆசாரியன் ஒன்றைப் பாவநிவாரணப் பலியாகவும் மற்றொன்றைத் தகனபலியாகவும்[a] செலுத்தி, இறந்தவரைச் சார்ந்து அவன் பாவம் செய்ததற்காக[b] அவனுக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும். அன்றே அவன் தன் தலையைப் பரிசுத்தப்படுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவநிவாரணப் பலி” என்பதை “தூய்மைப்படுத்தும் பலி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חַטָּאת, குறிப்பாகச் சடங்குத் தீட்டு பற்றிய சூழல்களில், பாவத்துக்கான அல்லது தூய்மைப்படுத்தும் பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அந்த நபரைப் பொறுத்துப் பாவம் செய்ததற்காக.” இச்சூழலில் எபிரெயச் சொல் נֶפֶשׁ இறந்த ஒருவரை, அதாவது தீட்டை உண்டாக்கிய சடலத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: ஆசாரியன் ... செலுத்தி
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பலிகளைக் குறிப்பிடும் இச்சடங்குச் சூழலில் ‘செலுத்து’ என்பது இயல்பான பொருள்.
- source_word: אֶחָד לְחַטָּאת
  choice: ஒன்றைப் பாவநிவாரணப் பலியாக
  rationale: חטאת இங்கு ஒரு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது பாவத்துடன் உள்ள தொடர்பையும் சடங்குசார் தூய்மைப்படுத்தும் செயலையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வெளிப்படுத்துகிறது.
- source_word: וְאֶחָד לְעֹלָה
  choice: மற்றொன்றைத் தகனபலியாக
  rationale: עלה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல்.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பதன் ஆசாரியச் சடங்குசார் வலிமையைத் தக்கவைத்து, குறிப்பிட்ட ஒரு பாவநிவிர்த்திக் கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தாமல் இருக்கிறது.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: இறந்தவரைச் சார்ந்து அவன் பாவம் செய்ததற்காக
  rationale: נפשׁ இச்சூழலில் இறந்த மனிதரைக் குறிக்கிறது; על என்பதைக் காரணம் அல்லது தொடர்பு என்ற இரு நுணுக்கங்களையும் முற்றிலும் இழக்காமல் ‘சார்ந்து’ என வழங்குகிறது.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: அவன் தன் தலையை மீண்டும் அர்ப்பணிக்க வேண்டும்
  rationale: קדש என்பது நேரடியாக ‘புனிதப்படுத்து/அர்ப்பணி’ எனப் பொருள்படும். முந்தைய தீட்டு காரணமாக நாசீரேய அர்ப்பணிப்பு புதுப்பிக்கப்படுவதால், தமிழில் இயல்பாகப் புரிய ‘மீண்டும்’ சூழலடிப்படையில் சேர்க்கப்பட்டது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற நேரடிப் பொருளையும் அதே நாளில் நிகழ வேண்டிய உடனடித் தன்மையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חַטָּאת என்ற பலிப்பெயரின் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்துக்கான பலி என்றும் சடங்குத் தீட்டை நீக்கும் பலி என்றும் புரிந்துகொள்ளப்படலாம். இறந்தவரால் ஏற்பட்ட தீட்டு இங்கு முக்கியமானதாயினும், வழக்கமான பலிப்பெயரை முதன்மை உரையில் வைத்து மாற்றுப் பொருளைக் குறிப்பில் பாதுகாக்கிறது.
- issue: הַנָּפֶשׁ என்பதன் இச்சூழலிலான குறிப்பு
  choice: இறந்தவர்
  alternative: சடலம்
  rationale: எண்ணாகமம் 6:6–12 சூழலில் נפשׁ இறந்த மனித உடலைக் குறிக்கிறது. ‘இறந்தவர்’ மனிதக் குறிப்பைத் தக்கவைக்கிறது; ‘சடலம்’ சடங்குத் தீட்டின் பொருளை இன்னும் வெளிப்படையாகச் சொல்லும் மாற்றாகும்.
- issue: וְקִדַּשׁ என்பதில் புதுப்பித்தலின் நுணுக்கம்
  choice: மீண்டும் அர்ப்பணிக்க வேண்டும்
  alternative: அர்ப்பணிக்க வேண்டும்
  rationale: எபிரெய வினை தனியே ‘மீண்டும்’ என்று சொல்லவில்லை; ஆயினும் முறிந்த நாசீரேய காலம் புதிதாகத் தொடங்கும் சூழல் அந்தப் புதுப்பித்தலை உணர்த்துகிறது. இதை இயல்பான தமிழுக்காக முதன்மை உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியன்’, ‘தகனபலி’, ‘பாவநிவிர்த்தி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தேவையான இடங்களில் பயன்படுத்தப்பட்டுள்ளன; தெளிவுக்காக ‘பாவநிவாரணப் பலி’ தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
