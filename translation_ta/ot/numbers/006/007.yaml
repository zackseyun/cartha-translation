base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: ta
  text: அவனுடைய தந்தையோ தாயோ சகோதரனோ சகோதரியோ இறந்தபோது, அவர்களுக்காக அவன் தன்னைத் தீட்டுப்படுத்திக்கொள்ளக் கூடாது[a]. ஏனெனில், அவனுடைய கடவுளுக்கென்று அர்ப்பணிக்கப்பட்டிருப்பதன் அடையாளம்[b] அவன் தலையின்மேல் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் இறக்கும்போது, அவர்களுக்காக அவன் தீட்டுப்படக் கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நெஸெர். நாசீரேயச் சூழலில் இது கடவுளுக்காகப் பிரித்துவைக்கப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட நிலையையும், அதற்குத் தலையிலுள்ள தலைமுடி அடையாளமாக இருப்பதையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: அவனுடைய தந்தையோ தாயோ சகோதரனோ சகோதரியோ
  rationale: முன்னிறுத்தப்பட்ட உறவுமுறைச் சொற்களின் வலியுறுத்தலைத் தமிழில் இயல்பான ‘-ஓ’ இணைப்பால் காக்கிறது; எபிரெய மூலத்திலுள்ள ஒருமை மற்றும் பாலின வேறுபாடுகளையும் தக்கவைக்கிறது.
- source_word: לֹא יִטַּמָּא
  choice: அவன் தன்னைத் தீட்டுப்படுத்திக்கொள்ளக் கூடாது
  rationale: Hitpael வடிவின் தன்மீளும் பொருளை வெளிப்படுத்துகிறது. ‘தீட்டு’ என்பது இங்கு சடங்குசார் அசுத்தத்தைக் குறிக்கிறது; ஒழுக்கக்கேட்டை அல்ல.
- source_word: לָהֶם בְּמֹתָם
  choice: இறந்தபோது, அவர்களுக்காக
  rationale: மரணம் நிகழும் சூழலையும், இறந்த உறவினரின் பொருட்டு ஏற்படும் சடங்குசார் தீட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: נֵזֶר
  choice: அர்ப்பணிக்கப்பட்டிருப்பதன் அடையாளம்
  rationale: நாசீரேயச் சூழலில் இச்சொல் கடவுளுக்காகப் பிரித்துவைக்கப்பட்ட நிலை/அர்ப்பணிப்பையும், தலைமுடியால் காணப்படும் அதன் அடையாளத்தையும் குறிக்கிறது. ‘கிரீடம்’ என்று மட்டும் மொழிபெயர்ப்பது சூழலுக்குரிய பொருளைக் குறுக்கிவிடும்.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுளுக்கென்று
  rationale: எபிரெயச் சொல்லிலுள்ள உடைமைப் பின்னொட்டைத் தக்கவைத்து, அர்ப்பணிப்பு அவனுடைய கடவுளைச் சார்ந்தது என்பதை வெளிப்படுத்துகிறது.
- source_word: עַל רֹאשׁוֹ
  choice: அவன் தலையின்மேல் இருக்கிறது
  rationale: மூலத்தின் கண்முன் நிற்கும் உருவகத்தை நேரடியாகக் காக்கிறது; நாசீரேயரின் தலைமுடியை மறைமுகமாகச் சுட்டும் வாய்ப்பையும் திறந்தே வைக்கிறது.
theological_decisions:
- issue: நாசீரேயச் சட்டத்தில் தீட்டின் இயல்பு
  choice: ஒழுக்கக்கேடாக அல்லாமல் சடங்குசார் தீட்டாக மொழிபெயர்த்தல்
  alternative: ‘தன்னை மாசுபடுத்துதல்’ போன்ற ஒழுக்கப் பழியைக் குறிப்பதுபோல் புரியக்கூடிய மொழியைப் பயன்படுத்துதல்
  rationale: சூழல் பிணத்துடன் தொடர்பு கொள்வதால் ஏற்படும் சடங்குசார் அசுத்தத்தைப் பற்றியது. மூலவசனம் கூறாத தனிப்பட்ட பாவக் கருத்தை மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
- issue: נֵזֶר என்பதன் பொருள்
  choice: அர்ப்பணிக்கப்பட்ட நிலையும் அதன் தலைமுடிசார் அடையாளமும் இணைந்த பொருளைத் தக்கவைத்தல்
  alternative: ‘கிரீடம்’ அல்லது தலைமுடி மட்டும் என்று குறுக்குதல்
  rationale: இச்சொல் நாசீரேயரின் கடவுளுக்கான பிரித்துவைக்கப்பட்ட நிலையையும் தலையிலுள்ள கண்கூடான அடையாளத்தையும் ஒருங்கே சுட்டக்கூடும்; அந்தத் தெய்வவியல் மற்றும் சொற்பொருள் நெருக்கத்தைத் திறந்தே வைக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குசார் சட்டத்தின் கண்ணியமான நடையைப் பேணியுள்ளோம். ‘தீட்டுப்படுத்திக்கொள்ள’ என்பது reflexive பொருளைத் தெளிவாக்குகிறது; அடிக்குறிப்பு மாற்று இலக்கணப் புரிதலைக் காக்கிறது. ‘அர்ப்பணிக்கப்பட்டிருப்பதன் அடையாளம்’ என்பது נֵזֶר சொல்லின் நிலை மற்றும் கண்கூடான குறி ஆகிய இரு நுணுக்கங்களையும் இயல்பாக ஏந்துகிறது.
