source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: ta
  text: 'நாசீரனைப் பற்றிய சட்டம் இதுவே: அவன் நாசீரனாகப் பிரிந்திருக்கும் நாட்கள் நிறைவடையும் நாளில்[b], அவன் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு அழைத்து வரப்பட வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அவன் அவனைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு அழைத்து வர வேண்டும்.” எபிரெயத்தில் வினை செயவினையாக (“அழைத்து வர வேண்டும்”) உள்ளது; ஆனால் அதன் எழுவாய் இந்த வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அவன் நாசீரனாகப் பிரிந்திருக்கும் நாட்கள்” என்பதை “அவனுடைய நாசீரிய விரதத்தின் நாட்கள்” அல்லது “அவன் அர்ப்பணிக்கப்பட்டிருக்கும் காலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: இதுவே
  rationale: சட்ட விதியை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் சுட்டும் வலியுறுத்தலும் தமிழில் இயல்பாகத் தக்கவைக்கப்படுகின்றன; வாக்கியத் தொடக்கத்தில் וְ-ஐ தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: תּוֹרַת
  choice: சட்டம்
  rationale: ஆசார மற்றும் சட்டச் சூழலில் תּוֹרָה என்பது இங்கு தொடர்ந்து வரும் குறிப்பிட்ட ஒழுங்குவிதியைக் குறிக்கிறது.
- source_word: הַנָּזִיר
  choice: நாசீரன்
  rationale: எண்ணாகமம் 6-இல் உள்ள தனிப்பட்ட இஸ்ரயேல் வழக்கைக் குறிக்கும் நָזִיר என்ற கலைச்சொல்லை ஒலிபெயர்த்து அதன் சிறப்புப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: בְּ/י֗וֹם
  choice: நாளில்
  rationale: எபிரெய மூலத்தின் முறையான காலக் குறிப்பைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: מְלֹאת֙
  choice: நிறைவடையும்
  rationale: מלא வேர்ச்சொல் குறிப்பது காலம் முழுமைபெற்று முடிவடைவதை; தமிழில் ‘நிறைவடையும்’ என்பது இயல்பாகவும் முறையாகவும் உள்ளது.
- source_word: יְמֵ֣י נִזְר֔/וֹ
  choice: அவன் நாசீரனாகப் பிரிந்திருக்கும் நாட்கள்
  rationale: נֵזֶר/נִזְרוֹ என்பதிலுள்ள பிரித்துவைக்கப்பட்ட நிலையைத் தக்கவைத்துக்கொண்டே, அது நாசீரிய ஒப்பந்தத்தைச் சார்ந்தது என்பதைத் தெளிவுபடுத்துகிறது; ‘பிரிவின் நாட்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட இது நவீன தமிழில் தெளிவானது.
- source_word: יָבִ֣יא אֹת֔/וֹ
  choice: அவன் ... அழைத்து வரப்பட வேண்டும்
  rationale: எபிரெய வினை இலக்கணப்படி செயப்பாட்டு வடிவமல்ல; ‘அவன் அவனை அழைத்து வர வேண்டும்’ என்பதே முறையான வடிவம். ஆனால் செய்பவர் இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை. தமிழில் செயப்படுவினை நடை அந்தத் தெளிவின்மையைத் தீர்மானிக்காமல் சடங்குமுறைப் பொருளை இயல்பாகத் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֶל פֶּ֖תַח
  choice: நுழைவாயிலுக்கு
  rationale: פֶּתַח என்பது திறப்பு அல்லது வாயிலைக் குறிக்கிறது; கூடாரச் சூழலில் ‘நுழைவாயில்’ இயல்பான, துல்லியமான தேர்வு.
- source_word: אֹ֥הֶל מוֹעֵֽד
  choice: சந்திப்புக் கூடாரம்
  rationale: தோராவில் வரும் இந்தப் பரிசுத்த இடத்தின் பெயரை அதன் கூறுகளுக்கு ஏற்றவாறு தெளிவாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: Numbers 6-இல் נָזִיר / נֵזֶר சொற்களின் பொருள்
  choice: ‘நாசீரன்’ என்ற கலைச்சொல்லையும் ‘பிரிந்திருக்கும்’ என்ற மொழியையும் இணைத்தல்
  alternative: ‘அர்ப்பணிக்கப்பட்டவன்/அர்ப்பணிப்புக் காலம்’ அல்லது எல்லா இடங்களிலும் ‘நாசீரிய விரதம்’ என்று மொழிபெயர்த்தல்
  rationale: குறிப்பிட்ட இஸ்ரயேல் வழக்கை ‘நாசீரன்’ பாதுகாக்கிறது; ‘பிரிந்திருக்கும்’ என்பது தேவனுக்காகப் பிரித்துவைக்கப்பட்ட நிலை என்ற மூலச் சொல்லின் கருத்தை, பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
- issue: יָבִיא אֹתוֹ என்பதன் வினைக்குரல் மற்றும் மறைந்துள்ள எழுவாய்
  choice: 'முதன்மை உரையில் செயப்படுவினை: ‘அழைத்து வரப்பட வேண்டும்’'
  alternative: முறையான செயவினையாக ‘அவன் அவனை அழைத்து வர வேண்டும்’
  rationale: எபிரெயத்தில் வினை செயவினையாக இருந்தாலும், ‘அழைத்து வருகிறவன்’ யார் என்பது வசனத்தில் வெளிப்படையாக இல்லை. செயப்படுவினை அந்தத் தெளிவின்மையைத் தக்கவைத்து நாசீரன் முன்வைக்கப்படுவதை மையப்படுத்துகிறது; இலக்கண மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் முறையான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாசீரன்’ என்ற வேதாகமக் கலைச்சொல் தக்கவைக்கப்பட்டு, உடனுள்ள சொற்றொடரால் அதன் பிரித்துவைக்கப்பட்ட நிலை விளக்கப்படுகிறது. எபிரெயச் செயவினையின் மறைந்த எழுவாயைத் தமிழில் ஊகித்துச் சேர்க்காமல் செயப்படுவினை பயன்படுத்தப்பட்டு, மூலத்தின் இலக்கண வடிவம் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
