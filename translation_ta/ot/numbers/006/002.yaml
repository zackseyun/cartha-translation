base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம் பேசி, அவர்களிடம் சொல்: ‘ஒரு ஆணோ ஒரு பெண்ணோ, யாவேக்கென்று தன்னைப் பிரித்துவைப்பதற்காக நாசீரேய விரதம் என்னும் ஒரு சிறப்பு விரதத்தை நேர்ந்துகொண்டால்[a][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு ஆணோ ஒரு பெண்ணோ நாசீரேய விரதத்தை நேர்ந்துகொண்டு யாவேக்கென்று தன்னைத் தனியாகப் பிரித்துவைத்தால்.”
    reason: lexical_alternative
  - marker: b
    text: “நாசீரேயர்” என்பது ஒரு விரதத்தின் கீழ் யாவேக்கென்று சிறப்பாகப் பிரித்துவைக்கப்பட்ட ஒருவரைக் குறிக்கும்.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேய மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் இங்கு தேவையற்ற வகையில் ஆண்பாலாரை மட்டும் குறிப்பதுபோல் ஒலிக்கலாம்.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ஒரு ஆணோ பெண்ணோ
  rationale: சட்டம் இருபாலாருக்கும் பொருந்துவதை எபிரேயம் வெளிப்படையாகக் கூறுவதால், அதையே தமிழிலும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: כִּי
  choice: நேர்ந்துகொண்டால்
  rationale: சட்டரீதியான ஒரு நிலையை அறிமுகப்படுத்தும் நிபந்தனைப் பொருளை ‘-ஆல்’ இயல்பாக வெளிப்படுத்துகிறது; ‘போது’ என்பதும் சாத்தியம்.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: ஒரு சிறப்பு விரதத்தை நேர்ந்துகொண்டால்
  rationale: פלא என்ற வேரின் ‘சிறப்பான/வழக்கத்திற்கு அப்பாற்பட்ட’ நுண்பொருளையும், வினைச்சொல்–பெயர்ச்சொல் இணைப்பிலுள்ள நேர்ந்துகொள்ளும் செயலும் தெளிவான தமிழில் வெளிப்படுகின்றன.
- source_word: נֶדֶר נָזִיר
  choice: நாசீரேய விரதம்
  rationale: எண்ணாகமம் 6-இல் நிறுவப்படும் குறிப்பிட்ட விரத முறையை அடையாளப்படுத்தும் தொழில்நுட்பச் சொல்லாக ஒலிபெயர்க்கப்பட்டுள்ளது; இது ‘நாசரேத்தூரார்’ என்பதோடு குழப்பமடையாமல் ‘நாசீரேய’ என்று தரப்படுகிறது.
- source_word: לְהַזִּיר
  choice: தன்னை அர்ப்பணிப்பதற்காக
  rationale: வினைச்சொல்லின் பிரித்துவைத்தல் மற்றும் அர்ப்பணித்தல் சார்ந்த நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தன்னைப் பிரித்துவைப்பதற்காக’ என்பது சாத்தியமான நேரடி மாற்று.
- source_word: לַיהוָה
  choice: யாவேக்கென்று
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது; ‘-க்கென்று’ அர்ப்பணிப்பின் இலக்கைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: நாசீரேய அர்ப்பணிப்பின் பொருள்
  choice: தன்னை அர்ப்பணிப்பதற்காக
  alternative: தன்னைப் பிரித்துவைப்பதற்காக; தன்னைத் தூயவராக்குவதற்காக
  rationale: ‘அர்ப்பணித்தல்’ என்பது யாவேக்கெனத் தனியே பிரித்துவைக்கும் நோக்கைத் தெரிவிக்கிறது; ஆனால் இதை பாவமற்ற நிலை அல்லது ஒரு குறிப்பிட்ட சமயச் சடங்காக விரிவுபடுத்துவதில்லை. பிரித்துவைத்தல் என்ற மூல நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: சட்டத்தில் பாலினங்களின் வெளிப்படையான சேர்க்கை
  choice: ஒரு ஆணோ பெண்ணோ என்று இருபாலாரையும் வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: யாராவது; ஒருவர்
  rationale: மூல எபிரேயம் ஆணையும் பெண்ணையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்தச் சேர்க்கை நிலைநிறுத்தப்படுகிறது. தமிழின் ‘தன்னை’ இருபாலாருக்கும் இயல்பாகப் பொருந்துவதால் தேவையற்ற ஆண்பால் பிரதிப்பெயர் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டவழக்குப் பதிவு பயன்படுத்தப்பட்டுள்ளது. ‘விரதத்தை நேர்ந்துகொள்ளுதல்’ என்பது vow என்பதற்கான இயல்பான தமிழ்; ‘நாசீரேய’ என்ற ஒலிபெயர்ப்பு ‘நாசரேத்தூரார்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது. மூலத்தின் ‘சிறப்பு விரதம் / பிரித்துவைத்தல் / அர்ப்பணித்தல்’ என்ற பொருள் அடுக்குகள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
