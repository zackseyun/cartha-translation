  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: ta
  text: 'ஆரோனிடமும் அவன் மகன்களிடமும் பேசிச் சொல்: ‘இவ்வாறே நீங்கள் இஸ்ரவேல் மக்களை[a] ஆசீர்வதிக்க வேண்டும்; அவர்களிடம் சொல்லுங்கள்:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.” இது “இஸ்ரவேல் மக்கள்” அல்லது “இஸ்ரவேலர்” என்பதையும் குறிக்கும் வழக்கமான தேசியப் பெயர்ச்சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: பேசிச் சொல்ல வேண்டியது
  rationale: பியேல் கட்டளை வடிவம் மோசேக்கு நேரடியாக வழங்கப்பட்ட ஆணை. தமிழில் மேற்கோளை அறிமுகப்படுத்தும் இயல்பான கட்டளை அமைப்பாக இது அமைகிறது.
- source_word: אַהֲרֹן וְאֶל בָּנָיו
  choice: ஆரோனிடமும் அவன் மகன்களிடமும்
  rationale: בָּנָיו என்பது இச்சூழலில் ஆரோனின் ஆண் ஆசாரிய வழித்தோன்றல்களைக் குறிக்கிறது; ஆகவே ‘மகன்கள்’ துல்லியமானது.
- source_word: לֵאמֹר
  choice: சொல்ல வேண்டியது
  rationale: உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் மேற்கோள் infinitive; தமிழில் முந்தைய வினையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: כֹּה
  choice: இவ்வாறே
  rationale: பின்வரும் ஆசீர்வாதத்தின் நிர்ணயிக்கப்பட்ட முறையையோ வடிவத்தையோ சுட்டுகிறது; ‘இவ்வாறே’ அதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: תְבָרֲכוּ
  choice: ஆசீர்வதிக்க வேண்டும்
  rationale: இரண்டாம் நபர் பன்மை பியேல் imperfect இங்கு அறிவுறுத்தல் வலிமை கொண்டது; ‘வேண்டும்’ வெறும் எதிர்காலமாக்காமல் கட்டளைத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களை
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்கமான தேசியப் பெயர்; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் தெளிவாகவும் உள்ளடக்கத் துல்லியத்துடனும் உள்ளது.
- source_word: אָמֹר לָהֶם
  choice: அவர்களிடம் சொல்லுங்கள்
  rationale: அடுத்த வசனத்தில் வரும் துல்லியமான ஆசீர்வாதச் சொற்களை அறிமுகப்படுத்தும் கட்டளை. எபிரெய உரையின் கட்டளை வலிமையும் பன்மை முகவரியும் காக்கப்படுகின்றன.
theological_decisions:
- issue: பாலின வடிவமுடைய உடன்படிக்கைச் சொற்றொடர் בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சொற்றொடர் இங்கு ஆண்களை மட்டும் தனியாகக் குறிப்பிடாமல் இஸ்ரவேல் சமூகத்துக்கான வழக்கமான தேசிய அடையாளமாகச் செயல்படுகிறது. ஆகவே இயல்பான தமிழில் ‘மக்கள்’ என வழங்குவது பொருளைத் தெளிவாகக் காக்கிறது; சொற்படியான மாற்றும் உண்மையான மொழியியல் மாற்றாகப் பதிவு செய்யப்படுகிறது.
- issue: ஆசாரிய அறிவுறுத்தலின் கட்டளைத் தன்மை
  choice: இவ்வாறே ... ஆசீர்வதிக்க வேண்டும்
  alternative: இப்படித்தான் ... ஆசீர்வதிப்பீர்கள்
  rationale: எபிரெய வடிவம் வெறும் எதிர்கால நிகழ்வை அல்ல, அதிகாரபூர்வமான வழிமுறையைத் தருகிறது. ‘வேண்டும்’ அதன் கட்டளை வலிமையை நவீன தமிழில் தெளிவாக்குகிறது; அதற்கு மேலான கோட்பாட்டு பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் நடை. ஒருமை மோசேக்கான முதற்கட்டளையும், பன்மை ஆரோனும் அவன் மகன்களும் செய்ய வேண்டிய ஆசீர்வாதக் கட்டளையும் தமிழில் வேறுபடுத்திக் காட்டப்பட்டுள்ளது.
