  naturalness: ‘அவன் நாசிரேயனாகப் பிரிந்திருக்கும் நாட்களெல்லாம்’ புரிந்துகொள்ளத்தக்கது; இருப்பினும் ‘காலமெல்லாம்’ என்பது இவ்வசனத்தில் உள்ள நிலை நீடிக்கும் முழுக்காலத்தையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. தற்போதைய அடிக்குறிப்பின் மாற்று வாசகமான ‘அவனுடைய நாசிரேய விரதம் நீடிக்கும்’ முழு வாக்கியமாக மாறி, மூலச் சொல்லுக்கான மாற்றாகச் சரியாக அமையவில்லை.
