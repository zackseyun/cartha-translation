  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: ta
  text: அவன் நாசிரேயனாகப் பிரிந்திருக்கும் காலமெல்லாம், அவன் யாவேக்கு பரிசுத்தமானவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: நாட்களெல்லாம்
  rationale: முழுக் காலப்பகுதியையும் உள்ளடக்கும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் முழுமையாகக் காட்டுகிறது.
- source_word: נִזְרוֹ
  choice: அவன் நாசிரேயனாகப் பிரிந்திருக்கும்
  rationale: இங்கு நாசிரேய விரதத்தைச் செய்யும் நிகழ்வை மட்டும் அல்லாமல், நாசிரேயனாகத் தனியே பிரிக்கப்பட்டிருக்கும் நிலை மற்றும் காலத்தைக் குறிக்கிறது.
- source_word: קָדֹשׁ הוּא
  choice: அவன் ... பரிசுத்தமானவன்
  rationale: எபிரெய மொழியின் பெயரடை வாக்கியத்தையும் பரிசுத்தம் என்ற இறையியல் நிறையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ முன்னிடைச்சொல் அர்ப்பணிப்பு அல்லது உரியிருத்தல் சார்ந்த உறவைக் குறிக்கிறது; יהוה என்ற தனிப்பட்ட இறைப்பெயரை தமிழில் வழக்கமான ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராக வைத்திருக்கிறது. தமிழில் பரவலாக அறியப்படும் ஒலிவடிவம் ‘யெகோவா’; ‘யாவே’ மூல உச்சரிப்புக்கு நெருக்கமான மாற்றாகும்.
- issue: נִזְרוֹ என்பதன் பொருள்
  choice: அவன் நாசிரேயனாகப் பிரிந்திருக்கும்
  alternative: அவனுடைய நாசிரேய விரதம்; அவனுடைய அர்ப்பணிப்பு
  rationale: விரதத்தின் வாக்குறுதியை மட்டும் குறிப்பதாகச் சுருக்காமல், நாசிரேயனாகப் பிரிக்கப்பட்டிருக்கும் நிலையை வெளிப்படுத்துகிறது; அடுத்து வரும் ‘பரிசுத்தமானவன்’ என்பதோடும் தேவையற்ற பொருள் மறுபடியும் வருவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘நாசிரேயனாகப் பிரிந்திருக்கும்’ என்பது பொதுவாசகருக்கு சூழலைத் தெளிவாக்குவதோடு, மூலத்தின் தனியே பிரிக்கப்பட்ட நிலை என்ற பொருளையும் காக்கிறது.
