source:
  edition: WLC
  text: וְ/סַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וּ/מִנְחָתָ֖/ם וְ/נִסְכֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: ta
  text: 'மேலும், புளிப்பில்லாத அப்பப் பொருள்கள்[a] அடங்கிய ஒரு கூடை: எண்ணெய் கலந்த நன்றாக அரைக்கப்பட்ட மாவால் செய்யப்பட்ட அப்பங்களும், எண்ணெய் பூசப்பட்ட புளிப்பில்லாத மெல்லிய அப்பங்களும்[b]; அவற்றுக்குரிய தானியக் காணிக்கையும் பானக் காணிக்கைகளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புளிப்பில்லாத அப்பங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் புளிப்பில்லாத அப்பப் பொருள்களைப் பொதுவாகக் குறிக்கிறது; பின்னர் அவற்றுள் அப்பங்களும் மெல்லிய அப்பங்களும் குறிப்பிடப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “எண்ணெய் தடவப்பட்ட” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை பொதுவாக “அபிஷேகம் செய்” என்பதற்குப் பயன்படுகிறது; இங்கு மெல்லிய அப்பங்கள்மேல் எண்ணெயைப் பூசும் தயாரிப்பு முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: கூடை
  rationale: அப்ப வகைகளை வைக்கும் கொள்கலனைச் சுட்டும் இயல்பான, தெளிவான தமிழ்ச் சொல்.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்ப வகைகள்
  rationale: இச்சொல் புளிப்பில்லாத அப்பப் பொருள்களைப் பொதுவாகக் குறிக்கிறது; தொடர்ந்து அப்பங்களும் மெல்லிய அப்பங்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், வகைப்பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: பலிக்குரிய சட்டங்களில் வரும் நன்றாக அரைக்கப்பட்ட உயர்தர மாவை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: חַלֹּת
  choice: அப்பங்கள்
  rationale: பலிக்காக வடிவமைத்துச் செய்யப்பட்ட அப்பங்களைக் குறிக்கிறது; நவீன இனிப்புக் கேக்கை நினைவூட்டக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: எண்ணெய் கலந்த
  rationale: மாவில் எண்ணெய் சேர்த்துக் கலக்கப்பட்டதைக் குறிக்கும்; ‘பிசைந்த’ என்று தேவைக்கு அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: רְקִיקֵי מַצּוֹת
  choice: புளிப்பில்லாத மெல்லிய அப்பங்கள்
  rationale: רְקִיקִים என்பதிலுள்ள மெல்லிய, தட்டையான அப்பப் பொருள் என்ற கருத்தை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: எண்ணெய் பூசப்பட்ட
  rationale: משׁח என்பது பொதுவாக அபிஷேகம் செய்வதற்குப் பயன்படும் வினை; இங்கோ உணவு தயாரிப்பில் அப்பங்கள்மேல் எண்ணெயைப் பூசுவதைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான செயல்பாட்டு பொருள் தரப்பட்டு, சொல் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: பலிச்சட்டச் சூழலில் מִנְחָה தானியக் காணிக்கையைக் குறிக்கிறது; பின்னொட்டு பன்மைச் சுட்டைக் கொண்டிருப்பதால் ‘அவற்றுக்குரிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נִסְכֵּיהֶם
  choice: பானக் காணிக்கைகள்
  rationale: பலிகளோடு சேர்த்து ஊற்றப்படும் திரவக் காணிக்கைகளைக் குறிக்கும் வெளிப்படையான, வழக்கமான தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: מִנְחָתָם மற்றும் נִסְכֵּיהֶם ஆகியவற்றின் பன்மைப் பின்னொட்டுகள் எவற்றைக் குறிக்கின்றன என்பது
  choice: அவற்றுக்குரிய
  alternative: மேற்கூறிய பலிகளுக்குரிய
  rationale: பின்னொட்டுகள் முந்தைய வசனத்தில் கூறப்பட்ட பலிப்பொருள்களைக் குறிக்க வாய்ப்புள்ளது. ஆனால் இவ்வசனத்திலேயே அந்தச் சுட்டை விரிவுபடுத்தாமல், எபிரேய உரையின் சூழல்சார்ந்த குறிப்பைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டது. எபிரேயத்தில் பெயர்ச்சொல் தொடர்களாக அமைந்துள்ள பட்டியல், தமிழில் முழுமையான கட்டளைச் சூழலுக்கு ஏற்றவாறு ‘இருக்க வேண்டும் / செலுத்தப்பட வேண்டும்’ என இயல்பாக்கப்பட்டது; புதிய சடங்கு விவரம் சேர்க்கப்படவில்லை.
