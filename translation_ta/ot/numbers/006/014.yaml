base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: ta
  text: அவன் யாவேக்குத் தனது காணிக்கையாக, தகன பலிக்காக ஒரு வயதுள்ள குறைபாடற்ற ஆண் ஆட்டுக்குட்டி ஒன்றையும், பாவப் பலிக்காக[a] ஒரு வயதுள்ள குறைபாடற்ற பெண் ஆட்டுக்குட்டி ஒன்றையும், சமாதானப் பலிகளுக்காக[b] குறைபாடற்ற ஆட்டுக்கடா ஒன்றையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவப் பலி” என்பதற்கு மாற்றாக “தூய்மைப்படுத்தும் பலி” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் חַטָּאת, பாவத்தையும் அசுத்தம் அல்லது குற்றத்திலிருந்து தூய்மைப்படுத்துவதோடு தொடர்புடைய பலியையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “சமாதானப் பலிகள்” என்பதற்கு மாற்றாக “நல்வாழ்வுப் பலிகள்” அல்லது “உறவுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: பலியிடும் சூழலில் ஹிப்ஹில் வடிவம் காணிக்கையை இறைவனிடம் கொண்டுவந்து அளிப்பதைக் குறிக்கிறது; தமிழில் சட்டவிதி நடைக்கு இயல்பாக ‘செலுத்த வேண்டும்’ என வழங்கப்பட்டது.
- source_word: קָרְבָּנוֹ
  choice: தனது காணிக்கை
  rationale: இறைவனிடம் கொண்டுவரப்படும் பலிப்பொருளைக் குறிக்கும் பொதுப்பெயர்; ‘காணிக்கை’ தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரேய உடன்படிக்கைப் பெயரான יהוה, பொதுப்பட்டப் பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான ... ஆண் ஆட்டுக்குட்டி ஒன்று
  rationale: விலங்கின் வயது, பாலினம், எண்ணிக்கை ஆகிய மூன்றையும் வெளிப்படையாகக் காக்கிறது.
- source_word: תָמִים / תְּמִימָה
  choice: குறைபாடற்ற
  rationale: பலிக்குரிய விலங்கு உடற்குறை அல்லது பழுதில்லாததாக இருக்க வேண்டும் என்ற சடங்குச் சார்ந்த பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: לְעֹלָה
  choice: தகன பலிக்காக
  rationale: முழுவதுமாக எரிக்கப்படும் பலிவகையைக் குறிக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: וְכַבְשָׂה ... בַּת שְׁנָתָהּ
  choice: ஒரு வயதான ... பெண் ஆட்டுக்குட்டி ஒன்று
  rationale: பெண்பால் வடிவத்தையும் ஒரு வயது என்ற குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவப் பலிக்காக
  rationale: חטאת என்பதன் மரபான பலிவகைப் பொருளைச் சுருக்கமாகத் தருகிறது; தூய்மைப்படுத்தும் பலி என்ற செயல்பாட்டு விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאַיִל אֶחָד
  choice: ஆட்டுக்கடா ஒன்று
  rationale: முதிர்ந்த ஆண் செம்மறியாட்டையும் அதன் எண்ணிக்கையையும் குறிக்கிறது; முன் வரும் ஆட்டுக்குட்டிகளிலிருந்து வேறுபாடு காக்கப்படுகிறது.
- source_word: לִשְׁלָמִים
  choice: சமாதானப் பலிகளுக்காக
  rationale: שְׁלָמִים என்ற பலிவகையின் பன்மையையும் மரபான ‘சமாதானம்’ சார்ந்த சொல்லாட்சியையும் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- issue: חַטָּאת என்ற பலிவகையின் பொருள்
  choice: பாவப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: சொல் பாவத்தையும் தூய்மைப்படுத்துதலையும் சார்ந்த பலியைச் சுட்டக்கூடும். அறிமுகமான முதன்மைச் சொல்லை உரையில் வைத்து, உண்மையான பொருள் அகலத்தை அடிக்குறிப்பில் காக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: நல்வாழ்வுப் பலிகள்; உறவுப் பலிகள்
  rationale: எபிரேயச் சொல்லின் பொருள் சமாதானம், நல்வாழ்வு, உறவு ஆகிய கருத்துகளை உள்ளடக்கக்கூடும்; எந்த ஓர் விளக்கத்தையும் முழுமையாகத் திணிக்காமல் மாற்றுகளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான விதிமுறை நடை பயன்படுத்தப்பட்டுள்ளது. எண்ணிக்கை, வயது, பாலினம், குறைபாடின்மை, பலிவகை ஆகிய மூல விவரங்கள் அனைத்தும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
