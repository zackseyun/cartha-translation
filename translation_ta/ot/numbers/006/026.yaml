source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: ta
  text: யாவே தமது முகத்தை உன்னை நோக்கி உயர்த்தி, உனக்குச் சமாதானத்தை அளிப்பாராக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான ‘ஷாலோம்’ என்பது அமைதியோடு முழுமை, நல்வாழ்வு ஆகிய பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: உயர்த்தி
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘உயர்த்து’ என்பதாகும். ‘முகத்தை உயர்த்துதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, இங்கு அது கனிவான கவனத்தைக் குறிக்கும் சூழலையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது יהוה என்ற இறைப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் அதை மாற்றவில்லை.
- source_word: פָּנָיו
  choice: தமது முகத்தை
  rationale: פנים என்பதன் நேரடிப் பொருள் ‘முகம்.’ இறை ஆதரவைக் குறிக்கும் தெளிவான உடல்சார் உருவகத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது; தமிழில் இறைவனை மரியாதையுடன் சுட்ட ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵלֶיךָ
  choice: உன்னை நோக்கி
  rationale: אל என்பது திசையைச் சுட்டும் ‘நோக்கி’ என்ற பொருளைத் தருகிறது. முகத்தை உயர்த்தும் உருவகத்துடன் இது இயல்பான தமிழாக அமைகிறது.
- source_word: וְיָשֵׂם
  choice: அளிப்பாராக
  rationale: שׂים என்பதன் அடிப்படை உணர்வு ‘வை/அமை’ என்பதாக இருந்தாலும், ‘உனக்குச் சமாதானத்தை வைப்பாராக’ என்பது தமிழில் இயல்பல்ல. ஆசீர்வாதச் சூழலில் அதன் விளைவைக் காட்ட ‘அளிப்பாராக’ என வழங்கப்பட்டுள்ளது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: לְ பயனாளியைச் சுட்டுகிறது; ‘உனக்குச் சமாதானத்தை அளி’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם அமைதி மட்டுமல்லாமல் முழுமை, நலம், செழுமையான வாழ்நிலை ஆகியவற்றையும் உள்ளடக்கலாம். ஆசீர்வாதச் சூழலில் ‘சமாதானம்’ முதன்மைப் பொருளைத் தருகிறது; அதன் விரிந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பாக வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘தமது முகத்தை உயர்த்தி’ என்ற மனித உருவிலான இறைமொழியைப் பாதுகாத்தல்
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: உனக்குத் தயவு காட்டி / உன்னை ஆதரவுடன் நோக்கி
  rationale: இச்சொற்றொடர் இறைவனின் கனிவான கவனத்தையும் ஆதரவையும் குறிக்கும் எபிரெய மரபுச் சொல். அதன் பொருளை மட்டும் சுருக்கிக் கூறாமல், உரையின் இலக்கிய மற்றும் இறையியல் உருவகத்தைத் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை முன்னிலையைத் தக்கவைத்து, ஆசீர்வாதத்திற்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அளிப்பாராக’ என்பது எபிரெய வினையின் வேண்டுதல்/ஆசீர்வாதத் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
