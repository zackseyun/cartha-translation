  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம்[a] கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; பெயரொலிப்பாக ‘யாவே’. மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: தெய்வீகப் பெயரின் எபிரெய மூலவடிவத்தையும் மரபுவழி மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்ற வினைச்சொல்லையும் தொடர்கதை நகர்வைக் குறிக்கும் waw-consecutive வடிவத்தையும் இயல்பான தமிழில் தருகிறது; பின்னரும் வரும் לֵאמֹר காரணமாக வெறும் ‘சொன்னார்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயரொலிப்பு வடிவில் தருகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிலைக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் வழக்கமான தமிழ் வேதாகமப் பெயரொலிப்பு.
- source_word: לֵאמֹר
  choice: 'சொன்னார்:'
  rationale: எபிரெய மொழியின் வழக்கமான நேரடிக் கூற்று அறிமுகத்தை இயல்பான தமிழில் வெளிப்படுத்தி, அடுத்த வசனத்தில் வரும் உரைக்கு முக்காற்புள்ளியால் வழி செய்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ‘கர்த்தர்’ என்ற பட்டப்பெயரால் அதை மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கப்படுகிறது; ‘யாவே’ என்பது சாத்தியமான மற்றொரு பெயரொலிப்பு என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘பேசிச் சொன்னார்’ என்பது דבר ... לֵאמֹר என்ற எபிரெயச் சூத்திரத்தின் இரு கூறுகளையும் இயல்பாகப் பாதுகாக்கிறது.
