source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது. “யெகோவா” என்பது மற்றொரு ஒலிபெயர்ப்பு.'
    reason: தெய்வீகப் பெயரின் மூலவடிவத்தையும் மாற்று மரபுவழி வடிவங்களையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: וַיְדַבֵּר ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது. தெய்வீக உரை அறிமுகச் சூழலில் “பேசினார்” என்பது இயல்பாகவும் மூலத்தின் வினைச்சொல்லுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளான YHWH. ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பான “யாவே” என்று தரப்பட்டுள்ளது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் אֶל, நவீன தமிழில் பெயருடன் இணைந்த “-இடம்” வேற்றுமை வடிவில் இயல்பாக வெளிப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்றுள்ள பொதுவான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்துவரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் לֵאמֹר என்பதன் செயல்பாடு, “இவ்வாறு பேசினார்:” என்ற இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது; “சொல்லும்படி” என இயந்திரத்தனமாக மொழிபெயர்ப்பது தவிர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரையில் ஒரு பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது. எனவே இறையியல் மரபொன்றைத் தனிப்படுத்தாமல், அந்தப் பெயரை வெளிப்படையாகக் காக்கும் “யாவே” என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; மற்ற மரபுவழி வடிவங்கள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. “இவ்வாறு பேசினார்:” என்பது எபிரெய உரை அறிமுகச் சூத்திரத்தின் பொருளையும் அடுத்த வசனத்துடனான தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
