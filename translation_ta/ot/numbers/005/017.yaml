base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: ta
  text: பின்பு ஆசாரியன் ஒரு மண்பாண்டத்தில் பரிசுத்த நீரை எடுத்துக்கொள்ள வேண்டும். மேலும், ஆசரிப்புக் கூடாரத்தின் தரையில் இருக்கும் புழுதியில் சிறிதை ஆசாரியன் எடுத்து அந்த நீரில் போட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தரையில்” என்பதற்கு “நிலப்பரப்பில்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் நிலத்தையோ தரையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: பரிசுத்த நீர்
  rationale: קְדֹשִׁים என்பதன் நேர்ப்பொருள் ‘பரிசுத்தமான’ அல்லது ‘புனிதமான’ என்பதாகும். இங்கு சடங்கு பயன்பாட்டுக்காகப் பிரித்துவைக்கப்பட்ட நீரைக் குறிக்கிறது; ‘பரிசுத்த நீர்’ நேரடியும் மரியாதைமிக்கதுமான தமிழ் மொழிபெயர்ப்பு.
- source_word: בִּכְלִי חָרֶשׂ
  choice: ஒரு மண்பாண்டத்தில்
  rationale: כְּלִי என்பது பாத்திரத்தையும் חָרֶשׂ என்பது களிமண் அல்லது மட்பாண்டப் பொருளையும் குறிக்கிறது. ‘மண்பாண்டம்’ இயல்பான நவீனத் தமிழில் இரு கூறுகளின் பொருளையும் தெளிவாக வழங்குகிறது.
- source_word: הֶעָפָר
  choice: புழுதி
  rationale: עָפָר என்பது புழுதி, உலர்ந்த மண் அல்லது தளர்ந்த மண் ஆகியவற்றைக் குறிக்கலாம். சடங்கின் காட்சியமைப்பை ‘புழுதி’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: ஆசரிப்புக் கூடாரத்தின் தரையில்
  rationale: קַרְקַע என்பது நிலப்பரப்பு அல்லது தரையைக் குறிக்கும். கூடாரத்தின் உட்புற மேற்பரப்பை இச்சூழலில் ‘தரை’ தெளிவாகக் காட்டுகிறது; מִשְׁכָּן என்பதற்கு வழக்கமான ‘ஆசரிப்புக் கூடாரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִן הֶעָפָר
  choice: புழுதியில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; ஆசாரியன் புழுதி முழுவதையும் அல்ல, அதிலிருந்து சிறிதளவை எடுப்பதாகத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: எடுத்துக்கொள்ள வேண்டும் ... எடுத்து ... போட வேண்டும்
  rationale: வினை வடிவங்கள் சடங்கு நடைமுறைக்கான கட்டளையை விவரிக்கின்றன. தமிழில் ‘வேண்டும்’ என்பது விதிக்கப்பட்ட செயலை இயல்பாக வெளிப்படுத்துகிறது; எபிரெய உரையிலுள்ள ‘ஆசாரியன்’ என்ற இரண்டாம் குறிப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַמָּיִם
  choice: அந்த நீரில்
  rationale: இறுதியில் வரும் குறிப்பு முன்பு சொல்லப்பட்ட பரிசுத்த நீரையே மீண்டும் சுட்டுகிறது. தமிழில் ‘அந்த நீர்’ இந்தப் பின்னோக்கியச் சுட்டுதலைத் தெளிவாக வழங்குகிறது.
