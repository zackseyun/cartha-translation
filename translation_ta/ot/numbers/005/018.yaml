  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: ta
  text: பின்பு ஆசாரியன் அந்தப் பெண்ணை யாவேக்கு முன்பாக நிறுத்தி, அவளுடைய தலைமுடியை அவிழ்த்து[a], நினைவூட்டும் தானியக் காணிக்கையை அவளுடைய உள்ளங்கைகளில் வைப்பான்; அது பொறாமைக்கான தானியக் காணிக்கை. ஆசாரியனின் கையில் சாபத்தை வரவழைக்கும் கசப்பான நீர் இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய தலையை மூடாமல் செய்து,” அல்லது “அவளுடைய தலைமுடியைத் தளர்வாகத் தொங்கவிட்டு.” எபிரெய மரபுத்தொடர் நேரடியாகப் பெண்ணின் ‘தலையை’ அவிழ்த்தல் அல்லது விடுதல் எனக் கூறுகிறது; சடங்கின் ஒரு பகுதியாக அவளுடைய கட்டப்பட்ட தலைமுடியை அவிழ்ப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாபத்தை ஏற்படுத்தும் கசப்பான நீர்.” எபிரெய செயப்பெயரெச்சம், சாபத்தை விளைவிக்கும் அல்லது சாபத்தோடு தொடர்புடைய நீர் என்று புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: நிறுத்தி
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவரை அதிகாரப்பூர்வமாக முன்னிலையில் நிற்கச் செய்வதைக் குறிக்கிறது; சடங்கு நடவடிக்கையை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: இது யாவேயின் சந்நிதியில் நிற்பதைக் குறிக்கும் வழிபாட்டுச் சொற்றொடர்; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: அவளுடைய தலைமுடியை அவிழ்த்துவிட்டு
  rationale: פרע + ראש என்ற மரபுத்தொடர் இச்சூழலில் கட்டப்பட்ட தலைமுடியை அவிழ்த்து தொங்கவிடும் சடங்குச் செயலைக் குறிக்கலாம்; 'தலையைத் திறத்தல்' என்ற தெளிவற்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: அவளுடைய உள்ளங்கைகளில் வைக்க வேண்டும்
  rationale: כף என்பது உள்ளங்கையைக் குறிப்பதால் சடங்கின் துல்லியமான உடல் அசைவு காக்கப்படுகிறது; על இங்கு தமிழில் இயல்பாக 'உள்ளங்கைகளில்' என வருகிறது.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: நினைவூட்டும் தானியக் காணிக்கை
  rationale: מנחה இவ்வாசாரியச் சூழலில் தானியக் காணிக்கை; זכרון நினைவுகூரச் செய்வதையோ நினைவுக்கு முன்வைப்பதையோ குறிக்கிறது.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: அது பொறாமைக்கான தானியக் காணிக்கை
  rationale: קנאות பன்மை வடிவில் இருந்தாலும் இங்கு பண்புசார் கருத்தாக அமைகிறது; எபிரெய apposition-ஐக் காக்க 'தானியக் காணிக்கை' மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: ஆசாரியனுடைய கையில் இருக்க வேண்டும்
  rationale: சடங்கின்போது நீர் ஆசாரியனிடம் இருப்பதைச் சொல்லும் சூழ்நிலைக் கூறு; எபிரெய ஒருமையான 'கை' காக்கப்படுகிறது.
- source_word: מֵי הַמָּרִים
  choice: கசப்பான நீர்
  rationale: எபிரெய மொழியில் 'நீர்' பன்மை வடிவில் இருப்பது வழக்கம்; நவீனத் தமிழில் எண்ணப்படாத ஒருமையான 'நீர்' இயல்பானது.
- source_word: הַמְאָרֲרִים
  choice: சாபத்தைக் கொண்டுவரும்
  rationale: ארר வினையின் செயப்பெயரெச்சம் நீர் சாபத்தை விளைவிப்பதாக அல்லது தாங்கிவருவதாகக் காட்டுகிறது; காரணவிளைவு நுணுக்கம் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது; பொதுப்பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: קְנָאֹת என்பதன் பொருள்
  choice: பொறாமைக்கான
  alternative: வைராக்கியத்துக்கான
  rationale: இப்பகுதியின் மணவுறவு மற்றும் சந்தேகச் சூழலில் 'பொறாமை' இயல்பான பொருள்; அது பெண்ணுடையதா கணவனுடையதா அல்லது சடங்கு நிலையைச் சார்ந்ததா என்பதை உரை தெளிவாக வரையறுக்காததால் அதைக் குறிப்பிடவில்லை.
- issue: சாபமளிக்கும் நீரின் செயற்பாடு
  choice: சாபத்தைக் கொண்டுவரும்
  alternative: சாபத்துக்குரிய
  rationale: הַמְאָרֲרִים என்பது நீரை வெறும் சாபத்தோடு தொடர்புபடுத்துவதைக் காட்டிலும் அது சாபத்தை விளைவிப்பதாகக் காட்டலாம்; அதன் துல்லிய இயங்குமுறையை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. 'ஆசாரியன்', 'தானியக் காணிக்கை', 'யாவே' ஆகியவை வாசகத் தெளிவையும் மூலத்தின் சடங்கு மொழியையும் சமநிலைப்படுத்துகின்றன. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு சமநிலை வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
