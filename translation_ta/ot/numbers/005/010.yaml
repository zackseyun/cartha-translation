  text: וְ/אִ֥ישׁ אֶת קֳדָשָׁ֖י/ו ל֣/וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר יִתֵּ֥ן לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: ta
  text: ஒவ்வொருவனுடைய பரிசுத்தக் காணிக்கைகளும்[a] அவனுக்கு உரியவையாக இருக்கும்; ஒருவன் ஆசாரியனுக்குக் கொடுப்பது எதுவாயினும், அது அவனுக்கு உரியதாக இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘அவனுடைய பரிசுத்தப் பொருட்கள்.’ இச்சொற்றொடர் பரிசுத்தமான காணிக்கைகளாக அர்ப்பணிக்கப்பட்ட பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'இறுதியில் வரும் ‘அவனுக்கு’ என்பது ஆசாரியனைக் குறிக்கிறது: ஒருவன் ஆசாரியனுக்குக் கொடுப்பது அந்த ஆசாரியனுக்கு உரியது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ஒவ்வொருவன் / ஒருவன்
  rationale: சட்டச் சூழலில் ஆண்பால் ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் வருகிறது. முதல் இடத்தில் ‘ஒவ்வொருவன்’ என்றும், தொடர்புச் சொல்லாக்கத்தில் இரண்டாம் இடத்தில் ‘ஒருவன்’ என்றும் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: קֳדָשָׁיו
  choice: அவனுடைய பரிசுத்தக் காணிக்கைகள்
  rationale: קדשׁ என்பதன் பன்மை இங்கு பரிசுத்தமாக ஒதுக்கப்பட்ட பொருட்களை அல்லது படையல்களைக் குறிக்கிறது. ‘பரிசுத்தக் காணிக்கைகள்’ வழிபாட்டுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; நேரடியான ‘பரிசுத்தப் பொருட்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לוֹ יִהְיוּ
  choice: அவனுக்கே உரியவையாக இருக்கும்
  rationale: இந்த எபிரெய உருபமைப்பு உடைமையைக் குறிக்கிறது. ‘உரியவையாக இருக்கும்’ என்பது பொருளை இயல்பான தமிழில் தருகிறது; ‘அவனுக்கு’ என்பதன் சுட்டு மூலத்தில் உள்ள சுருக்கத்தையும் சாத்தியமான தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: ஒருவன் ஆசாரியனுக்குக் கொடுப்பது எதுவோ
  rationale: பொதுப்படையான தொடர்புச் சொல்லாக்கத்தின் திறந்த சட்டப் பொருளை ‘எதுவோ’ வெளிப்படுத்துகிறது. לַכֹּהֵן என்பதற்கு ‘ஆசாரியனுக்கு’ என்று ஒருமையில் மொழிபெயர்க்கப்பட்டது.
- source_word: לוֹ יִהְיֶה
  choice: அது அவனுக்கே உரியதாக இருக்கும்
  rationale: மூலத்தின் மீளும் உடைமைச் சொல்லாக்கம் காக்கப்பட்டுள்ளது. இறுதி ‘அவன்’ சூழலில் ஆசாரியனைச் சுட்டுகிறது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: இரு לוֹ வடிவங்களின் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘அவனுக்கு’ என்ற சுருக்கமான சுட்டுப்பெயரைப் பேணி, இறுதி சுட்டு ஆசாரியனை குறிப்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: இரு இடங்களிலும் ‘ஆசாரியனுக்கே’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரை சுட்டுப்பெயர்களைச் சுருக்கமாகவே வைக்கிறது. சூழல் இறுதி சுட்டை ஆசாரியனோடு இணைத்தாலும், மூலத்தில் இல்லாத தெளிவாக்கத்தை பிரதான உரையில் மிகுதியாகச் சேர்க்காமல் அதன் இயல்பான பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘ஆசாரியன்,’ ‘பரிசுத்தக் காணிக்கைகள்’ ஆகியவை வழிபாட்டுச் சூழலை இயல்பாகத் தெரிவிக்கின்றன; எபிரெயத்தின் மீளும் உடைமை அமைப்பும் சுட்டுப்பெயரின் சுருக்கமும் இயன்றவரை காக்கப்பட்டன.
