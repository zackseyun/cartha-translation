  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: ta
  text: ஆண் முதல் பெண் வரை அவர்களைப் பாளயத்திற்கு வெளியே அனுப்புங்கள்[a]. அவர்கள் தங்கள் பாளயங்களைத் தீட்டுப்படுத்தாதபடி அவர்களை வெளியே அனுப்புங்கள்; அவற்றின் நடுவில் நான் குடியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘அவர்களுடைய பாளயங்கள்’ என்று பன்மையில் உள்ளது; இது ஒரே பாளயத்தின் பிரிவுகளையோ தனித்தனி முகாமிடங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களின் நடுவில் நான் குடியிருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சுட்டு பாளயங்களையோ அவற்றோடு தொடர்புடைய மக்களையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: ஆண் முதல் பெண் வரை அனைவரையும்
  rationale: எபிரெயச் சொற்றொடர் ஆண், பெண் ஆகிய இருபாலரையும் உள்ளடக்கும் முழு வரம்பைக் குறிக்கிறது; தமிழில் இயல்பாக அமைய ‘அனைவரையும்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: அனுப்பிவிடுங்கள் ... வெளியே அனுப்பிவிடுங்கள்
  rationale: שלח என்பதன் வலியுறுத்தப்பட்ட இருமுறை பயன்பாட்டைத் தமிழிலும் மீளுரைப்பதன் மூலம் காக்கிறது; தண்டனைப் பொருளை மிகைப்படுத்தாமல் பாளயத்திலிருந்து அகற்றுதலைத் தெரிவிக்கிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: பாளயத்திற்கு வெளியே
  rationale: பாளய எல்லைக்கு அப்பால் அனுப்பப்படுவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְטַמְּאוּ
  choice: தீட்டுப்படுத்துவார்கள்
  rationale: ஆசாரத் தூய்மைச் சூழலில் טמא குறிக்கும் சடங்குசார் தீட்டைத் துல்லியமாகக் காக்கிறது.
- source_word: מַחֲנֵיהֶם
  choice: தங்கள் பாளயங்களை
  rationale: எபிரெயில் பெயர்ச்சொல் பன்மையில் இருப்பதால் அதைப் பன்மையாகவே காக்கிறது; இது பாளயத்தின் பிரிவுகளையோ பல முகாமிடங்களையோ குறிக்கக்கூடும்.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: அவற்றின் நடுவில் நான் குடியிருக்கிறேன்
  rationale: தெய்வீகப் பிரசன்னம் பாளயங்களின் நடுவில் இருப்பதை நேரடியாகத் தருகிறது; அதே சமயம் எபிரெயச் சுட்டின் சாத்தியமான மனிதக் குறிப்பை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: 'בְּתוֹכָם என்பதன் சுட்டுப்பொருள்: பாளயங்களா அல்லது அவற்றோடு தொடர்புடைய மக்களா'
  choice: முதன்மை உரையில் ‘அவற்றின் நடுவில்’ என்று பாளயங்களைக் குறித்தல்
  alternative: ‘அவர்களின் நடுவில் நான் குடியிருக்கிறேன்’ என்று மக்களைக் குறித்தல்
  rationale: முந்திய பன்மைப் பெயர்ச்சொல்லோடு இலக்கணத் தொடர்பை முதன்மை உரை காக்கிறது; ஆனால் ஆண்பால் பன்மைச் சுட்டு பாளயங்களோடு தொடர்புடைய மக்களையும் குறிக்கக்கூடியதால் அந்த இறையியல் நெருக்கடியை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டது. ‘பாளயம்’, ‘தீட்டுப்படுத்து’, ‘குடியிரு’ ஆகியவை முறையே முகாம், ஆசாரத் தூய்மை, தேவப் பிரசன்னம் ஆகிய கருத்துகளைத் தெளிவாகக் காக்கின்றன.
