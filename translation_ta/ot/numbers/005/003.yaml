revisions:
- from: ஆண் முதல் பெண் வரை அனைவரையும் பாளயத்திற்கு வெளியே அனுப்பிவிடுங்கள். அவர்களை வெளியே அனுப்பிவிடுங்கள்; இல்லையெனில், அவர்கள் தங்கள் பாளயங்களை[a] தீட்டுப்படுத்துவார்கள். அவற்றின் நடுவில் நான் குடியிருக்கிறேன்[b].
