id: NUM.5.25
reference: Numbers 5:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: ta
  text: பின்பு ஆசாரியன் அந்தப் பெண்ணின் கையிலிருந்து பொறாமையின் தானியக் காணிக்கையை எடுத்து, அந்தத் தானியக் காணிக்கையை யாவேயின் முன்னிலையில் அசைத்து, அதை பலிபீடத்தினருகே கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... வாங்கி
  rationale: சடங்கு நடைமுறையின் அடுத்த கட்டத்தை waw + qatal குறிக்கிறது. பெண்ணின் கையிலிருந்து நேரடியாகப் பெறுவதால், தமிழில் இயல்பான ‘வாங்கி’ பயன்படுத்தப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டுச் சடங்கை நிறைவேற்றும் הכהן என்பதற்கான நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: מִיַּד הָאִשָּׁה
  choice: அந்தப் பெண்ணின் கையிலிருந்து
  rationale: ‘பெண்ணின் கையிலிருந்து’ என்ற எபிரெயச் சொற்றொடரின் நேரடிப் பெறுதலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட பெண் என்பதால் ‘அந்தப் பெண்’ எனப்பட்டது.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: பொறாமையின் தானியக் காணிக்கை
  rationale: מִנְחָה என்பதன் தானியக் காணிக்கை சார்ந்த பலியியல் பொருளையும், קְנָאֹת என்பதன் ‘பொறாமை’ தொடர்பையும் தக்கவைக்கிறது. இது வெறும் பொதுவான ‘காணிக்கை’ என்று மங்கச் செய்யப்படவில்லை.
- source_word: וְהֵנִיף
  choice: அசைவாட்டி
  rationale: נוף என்பதன் ஹிஃபீல் வடிவம் பலியியல் சூழலில் காணிக்கையைச் சடங்குமுறையில் அசைவாட்டுவதைக் குறிக்கிறது. ‘அசைவாட்டி’ அந்தச் செயலைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: வழிபாட்டுச் சூழலிலுள்ள ‘யாவேயின் முன்னிலையில்/முன்பாக’ என்ற சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தருகே கொண்டுவர வேண்டும்
  rationale: קרב என்பதன் ஹிஃபீல் வடிவத்திலுள்ள ‘அருகே கொண்டுவருதல்’ என்ற பலியியல் நுட்பத்தைத் தக்கவைக்கிறது; காணிக்கையை இக்கட்டத்திலேயே பலியிடுவதாக அதிகமாகப் பொருள் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: מִנְחַת הַקְּנָאֹת என்பதிலுள்ள ‘பொறாமை’ தொடர்பு
  choice: பொறாமையின் தானியக் காணிக்கை
  alternative: பொறாமைக்கான தானியக் காணிக்கை
  rationale: எபிரெயச் சேர்க்கை இக்காணிக்கைக்கும் பொறாமைக்கும் உள்ள உறவைச் சொல்கிறது; ஆனால் அதன் உறவை ஒரே விதமாக விளக்கி முடிவுசெய்யவில்லை. ‘பொறாமையின்’ என்பது அந்தத் திறந்த தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வழிபாட்டுச் சொல்லாட்சியுடன் மொழிபெயர்க்கப்பட்டது. நீண்ட ஒரே நடைமுறை வாக்கியமாக உள்ள மூலத்தின் தொடர்ச்சி தமிழிலும் வினையெச்சங்களால் காக்கப்பட்டது; இறுதி கட்டளைத் தன்மை ‘வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டது.
