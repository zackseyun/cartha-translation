source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: ta
  text: ஆனால், அந்தப் பெண் தீட்டுப்படாமல் தூய்மையாக இருந்தால், அவள் குற்றமற்றவள் என விடுவிக்கப்படுவாள்; கருவுறுவாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “விதையால் விதைக்கப்படுவாள்”; இது கருவுறுவதைக் குறிக்கும் ஒரு மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய வசனத்தின் குற்றமுள்ள நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא נִטְמְאָה
  choice: தன்னைத் தீட்டுப்படுத்திக்கொள்ளாமல்
  rationale: இந்த விபசாரச் சோதனையின் சூழலில், Niphal வடிவம் குறிக்கும் தீட்டடைதலை ஒழுக்க மற்றும் பாலியல் தீட்டுடன் தொடர்புபடுத்தி, தமிழில் இயல்பாகத் தருகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட பெண்ணைக் குறிக்கும் எபிரெய definite பெயர்ச்சொல்லைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּטְהֹרָה הִוא
  choice: தூய்மையாக
  rationale: טָהוֹר குறிக்கும் தூய்மை அல்லது தீட்டின்மை இங்கு ஒழுக்க-சடங்கு சூழலுக்கு ஏற்றவாறு வழங்கப்படுகிறது.
- source_word: וְנִקְּתָה
  choice: குற்றமற்றவள் எனத் தெளிவாவாள்
  rationale: נקה என்பதன் விடுவிக்கப்படுதல், குற்றச்சாட்டிலிருந்து தெளிவாக்கப்படுதல் என்ற பொருளை, மிகக் குறுகிய நீதிமன்றச் சொல்லாட்சியைத் திணிக்காமல் வெளிப்படுத்துகிறது.
- source_word: וְנִזְרְעָה זָרַע
  choice: கருவுறுவாள்
  rationale: சொல்லுக்குச் சொல் ‘விதையால் விதைக்கப்படுவாள்’ என்ற எபிரெய மொழிமரபு கருத்தரித்தலைக் குறிக்கிறது; அதன் விளைவை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: குற்றமற்றவளாகத் தெளிவான பின் கிடைக்கும் விளைவின் தன்மை
  choice: அவள் குற்றச்சாட்டிலிருந்து தெளிவாக்கப்பட்டு கருவுறுவாள் என்று வசனம் கூறுகிறது.
  alternative: இது பொதுவாக அவளுடைய இனப்பெருக்கத் திறன் தொடரும் அல்லது மீளும் என்பதைக் குறிக்கலாம்.
  rationale: וְנִזְרְעָה זָרַע என்பது கருத்தரித்தலைக் குறிக்கும் மொழிமரபு. மூலத்தில் வெளிப்படையாக இல்லாத ‘கருவுறும் திறன் பெறுவாள்’ என்ற விரிவாக்கத்தைச் சேர்க்காமல் நேரடித் தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘தீட்டு,’ ‘தூய்மை’ ஆகியவை சூழலின் ஒழுக்க-சடங்கு நுணுக்கத்தைப் பேணுகின்றன; இறுதி எபிரெய மொழிமரபு முதன்மை உரையில் பொருள்பட மொழிபெயர்க்கப்பட்டு அடிக்குறிப்பில் சொல்லுக்குச் சொல் வடிவம் தரப்பட்டுள்ளது.
