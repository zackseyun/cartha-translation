    text: எபிரெய மொழியில், “விதையால் விதைக்கப்படுவாள்”; இது கருவுறுவதைக் குறிக்கும் ஒரு மொழிமரபு.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew conditional structure and its deliberate pairing of defilement and cleanness, while rendering the vindication verb as release/clearing rather than mere public recognition. The final fertility expression remains direct in the text and retains the literal Hebrew idiom in the footnote.
