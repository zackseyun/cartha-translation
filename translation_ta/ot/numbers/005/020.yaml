base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: ta
  text: ஆனால், நீ உன் கணவனுடன் திருமண உறவில் இருக்கும்போது வழிதவறி, தீட்டடைந்திருந்தால், உன் கணவனைத் தவிர வேறொரு ஆண் உன்னுடன் உடலுறவு கொண்டிருந்தால்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂטִית
  choice: வழிதவறி
  rationale: திருமண உறவில் பிறழ்வதைக் குறிக்கும் எபிரெய உருவகத்தை, நேரடியாக ‘துரோகம் செய்தாய்’ என்று விளக்கிவிடாமல் பாதுகாக்கிறது.
- source_word: תַּחַת אִישֵׁךְ
  choice: உன் கணவனுக்குக் கட்டுப்பட்டிருக்கையில்
  rationale: சொல்லுக்குச் சொல் ‘உன் கணவனின் கீழ்’ என்றாலும், இங்கு திருமணப் பிணைப்பு அல்லது உறவுநிலையைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: נִטְמֵאת
  choice: தீட்டுப்பட்டிருந்தால்
  rationale: பாலியல் செயலுடன் தொடர்புடைய சடங்கு-சட்டத் தீட்டின் கருத்தைத் தக்கவைக்கிறது.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: வேறொரு ஆண் உன்னுடன் உடலுறவு கொண்டிருந்தால்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு ஆண் தனது படுக்கையை உன்னில் கொடுத்தான்’ என்ற எபிரெய நாசூக்குப் பேச்சின் பொருளை இன்றைய வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: உன் கணவனைத் தவிர
  rationale: கணவனை விலக்கி இன்னொரு ஆணைக் குறிப்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: திருமணப் பிறழ்வைக் குறிக்கும் உருவகத்தையும் பாலியல் செயலைக் குறிக்கும் நாசூக்குப் பேச்சையும் எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘வழிதவறி’ என்ற உருவகத்தைப் பாதுகாத்து, பின்னுள்ள செயலை ‘உடலுறவு கொண்டிருந்தால்’ என்று தெளிவாக மொழிபெயர்த்தல்
  alternative: முழுவதையும் ‘உன் கணவனுக்குத் துரோகம் செய்து’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் உருவகத் தன்மையை அழிக்காமல், வசனத்தின் பாலியல் பொருளையும் மறைக்காமல் தருகிறது; உரையில் இல்லாத கூடுதல் ஒழுக்கவியல் அல்லது கோட்பாட்டுச் சொற்களைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்ட-சடங்கு நடையைப் பயன்படுத்தியுள்ளது. ‘கணவனின் கீழ்’ என்ற செயற்கையான நேரடி வடிவுக்குப் பதிலாக ‘கணவனுக்குக் கட்டுப்பட்டிருக்கையில்’ என இயல்பாக்கப்பட்டு, அடிக்குறிப்பில் மூல மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனில் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
