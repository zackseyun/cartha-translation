  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: ta
  text: 'பின்பு அந்த மனிதன் தன் மனைவியை ஆசாரியரிடம் அழைத்து வந்து, அவளுக்காக அவளுடைய காணிக்கையையும் கொண்டுவர வேண்டும்: ஒரு ஏப்பாவில் பத்தில் ஒரு பங்கு வாற்கோதுமை மாவைக் கொண்டுவர வேண்டும். அதன்மேல் எண்ணெய் ஊற்றவோ, குங்கிலியம் வைக்கவோ கூடாது. ஏனெனில், அது பொறாமையின் தானியக் காணிக்கை; அக்கிரமத்தை[b] நினைவுக்குக் கொண்டுவரும் நினைவூட்டும் காணிக்கை[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நினைவுக் காணிக்கை”; எபிரேயச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக, “நினைவின் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குற்றத்தை” அல்லது “குற்றப்பொறுப்பை”; எபிரேயச் சொல் அக்கிரமம், குற்றம், அல்லது தவறினால் ஏற்படும் பொறுப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: அந்த ஆண் தன் மனைவியை ... அழைத்து வந்து
  rationale: הָאִישׁ என்பதன் நேர்ப்பொருளான ‘அந்த ஆண்’ என்பதைக் காத்து, אִשְׁתּוֹ மூலம் கணவன்-மனைவி உறவைத் தெளிவாக்குகிறது; தமிழில் ‘அழைத்து வந்து’ என்பது ஒருவரை ஆசாரியரிடம் கொண்டு வருவதை இயல்பாகச் சொல்கிறது.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: அவளுக்காக அவளுடைய காணிக்கை
  rationale: பெண்பால் பின்னொட்டையும், עַל இங்கு தரும் ‘அவள் சார்பாக/அவளுக்காக’ என்ற உறவையும் வெளிப்படுத்துகிறது.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: ஒரு ஏப்பாவில் பத்தில் ஒரு பங்கு
  rationale: பண்டைய அளவான אֵיפָה என்பதை கணிப்பான நவீன அளவாக மாற்றாமல் ஒலிபெயர்த்து, அதன் பத்தில் ஒரு பங்கு என்ற அளவைத் தெளிவாகக் கூறுகிறது.
- source_word: קֶמַח שְׂעֹרִים
  choice: வாற்கோதுமை மாவு
  rationale: கோதுமையிலிருந்து வேறுபட்ட barley-ஐ நவீனத் தமிழில் துல்லியமாகக் குறிக்கிறது; קֶמַח என்பதற்கு இயல்பான ‘மாவு’ பயன்படுத்தப்படுகிறது.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: அதன்மேல் எண்ணெய் ஊற்றவோ சாம்பிராணி வைக்கவோ கூடாது
  rationale: இரண்டு தடைகளையும் இணையான தமிழ் அமைப்பில் தருகிறது; לְבֹנָה என்பது வழிபாட்டில் பயன்படுத்தப்படும் நறுமணப் பிசினான சாம்பிராணியைக் குறிக்கிறது.
- source_word: מִנְחַת קְנָאֹת
  choice: பொறாமைக்கான தானியக் காணிக்கை
  rationale: ஆசாரியச் சூழலில் מִנְחָה என்பதன் தானியக் காணிக்கைப் பொருளையும், קְנָאֹת என்பதன் பொறாமை/சந்தேக உந்துதலையும் தீர்ப்பாக மாற்றாமல் காக்கிறது.
- source_word: מִנְחַת זִכָּרוֹן
  choice: நினைவூட்டும் காணிக்கை
  rationale: זִכָּרוֹן என்பதன் நினைவுறுத்தும் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: அக்கிரமத்தை நினைவுக்குக் கொண்டுவரும்
  rationale: מַזְכֶּרֶת என்ற காரணவினைச் சார்ந்த நினைவூட்டும் பொருளையும், עָוֹן என்பதன் ஒழுக்கத் தவறு சார்ந்த பரப்பையும் காக்கிறது; குற்றம் ஏற்கெனவே நிரூபிக்கப்பட்டதாகச் சொல்லவில்லை.
theological_decisions:
- issue: பொறாமைக் காணிக்கை பெண்ணின் குற்றத்தை முன்கூட்டியே உறுதிப்படுத்துகிறதா?
  choice: சடங்கின் காணிக்கையையும் அதன் நினைவூட்டும் செயலையும் மட்டும் விவரித்து, பெண் குற்றவாளி என்று முன்தீர்ப்பு வழங்காமல் மொழிபெயர்த்தல்
  alternative: ‘அவளுடைய குற்றத்தை வெளிப்படுத்தும் காணிக்கை’ என்று தீர்ப்பை மொழிபெயர்ப்பிலேயே சேர்த்தல்
  rationale: இந்த வசனம் காணிக்கையின் அமைப்பையும் செயலையும் கூறுகிறது; பெண்ணின் குற்றமோ குற்றமின்மையோ இங்கே இன்னும் தீர்மானிக்கப்படவில்லை. மூலத்தின் நீதியியல் மற்றும் இறையியல் பதற்றம் அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட/வழிபாட்டு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வேண்டும்/கூடாது’ அமைப்பு எபிரேய சட்டவழக்கின் கட்டளை வலிமையை இயல்பாகத் தருகிறது. பண்டைய அளவுப்பெயர் ‘ஏப்பா’ மாற்றமின்றி வைக்கப்பட்டுள்ளது; அரிதான சொற்களுக்கு தேவையான மாற்றுகள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
