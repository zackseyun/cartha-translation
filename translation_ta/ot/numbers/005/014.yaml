revisions:
- from: 'பொறாமையின் ஆவி அவனை ஆட்கொண்டு[a], அவன் தன் மனைவிமேல் பொறாமைகொள்கிறான்; அவள் தீட்டுப்பட்டிருக்கிறாள்[b]. அல்லது பொறாமையின் ஆவி அவனை ஆட்கொண்டு, அவன் தன் மனைவிமேல் பொறாமைகொள்கிறான்; ஆனால் அவள் தீட்டுப்படவில்லை[c].


    [a] “பொறாமை உணர்வு அவனை ஆட்கொண்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆவி, காற்று அல்லது ஒருவரைத் தூண்டும் மனநிலையைக் குறிக்கலாம்.


    [b] “அவள் தன்னைத் தீட்டுப்படுத்திக்கொண்டிருக்கிறாள்” என்றும் மொழிபெயர்க்கலாம். இங்கு தீட்டு என்பது சந்தேகிக்கப்படும் பாலியல் முறைகேட்டைக் குறிக்கிறது; ஆயினும் எபிரெயம் தீட்டு அல்லது அசுத்தம் சார்ந்த சொல்லையே பயன்படுத்துகிறது.


    [c] எபிரெயத்தில் “அவள் தீட்டுப்படவில்லை” என்பதற்கு முன் “ஆனால்” என்பதற்குப் பதிலாக பொதுவாக “மற்றும்” என்று பொருள்படும் இணைப்புச்சொல் உள்ளது. இங்கே கூறப்படும் மாற்றுச் சூழலின் முரண்பாட்டைத் தெளிவாக்க “ஆனால்” பயன்படுத்தப்பட்டுள்ளது.'
  to: பொறாமையின் ஆவி அவன்மேல் வந்து[a], அவன் தன் மனைவிமேல் பொறாமை கொள்கிறான்; அவள் தீட்டுப்பட்டிருக்கிறாள்[b]. அல்லது பொறாமையின் ஆவி அவன்மேல் வந்து, அவன் தன் மனைவிமேல் பொறாமை கொள்கிறான்; ஆனால் அவள் தீட்டுப்படவில்லை[c].
  rationale: The only substantive revision replaces “ஆட்கொண்டு” with “அவன்மேல் வந்து,” avoiding an unwarranted suggestion of possession while closely representing the Hebrew idiom. The footnote alternative for נִטְמָאָה is made aspectually consistent with the Hebrew perfect. No doctrinal conclusion is added, and the source’s impurity language and ambiguity are retained.
