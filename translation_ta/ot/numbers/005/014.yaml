  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: ta
  text: பொறாமையின் ஆவி அவன்மேல் வந்து[a], அவன் தன் மனைவிமேல் பொறாமை கொள்கிறான்; அவள் தீட்டுப்பட்டிருக்கிறாள்[b]. அல்லது பொறாமையின் ஆவி அவன்மேல் வந்து, அவன் தன் மனைவிமேல் பொறாமை கொள்கிறான்; ஆனால் அவள் தீட்டுப்படவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொறாமை உணர்வு அவன்மேல் வந்து” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆவி, காற்று அல்லது ஒருவரைத் தூண்டும் மனநிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவள் தன்னைத் தீட்டுப்படுத்திக்கொண்டாள்” என்றும் மொழிபெயர்க்கலாம். இங்கு தீட்டு என்பது சந்தேகிக்கப்படும் பாலியல் முறைகேட்டைக் குறிக்கிறது; ஆயினும் எபிரெயம் தீட்டு அல்லது அசுத்தம் சார்ந்த சொல்லையே பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “அவள் தீட்டுப்படவில்லை” என்பதற்கு முன் “ஆனால்” என்பதற்குப் பதிலாக பொதுவாக “மற்றும்” என்று பொருள்படும் இணைப்புச்சொல் உள்ளது. இங்கே கூறப்படும் மாற்றுச் சூழலின் முரண்பாட்டைத் தெளிவாக்க “ஆனால்” பயன்படுத்தப்பட்டுள்ளது.
    reason: translation_clarity
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: அவனை ஆட்கொண்டு
  rationale: ரூவாக் ஒருவன்மேல் வந்து அவனைத் தூண்டும் நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ‘அவன்மேல் கடந்து’ என்பது இங்கு மரப்பொருள் மொழியாகிவிடும்.
- source_word: רוּחַ קִנְאָה
  choice: பொறாமையின் ஆவி
  rationale: רוּחַ என்பதன் ‘ஆவி’ என்ற அடிப்படைச் சொல்லையும், இச்சூழலில் קִנְאָה குறிக்கும் கணவனின் பொறாமையையும் பாதுகாக்கிறது. அது தனிப்பட்ட ஆவியைக் குறிக்கிறதா அல்லது மனத்தூண்டுதலைக் குறிக்கிறதா என்ற சாத்தியத்தை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: அவன் தன் மனைவிமேல் பொறாமைகொள்கிறான்
  rationale: கணவனின் பொறாமையான எதிர்வினையைத் தமிழில் நேரடியாகவும் இயல்பாகவும் கூறுகிறது; வினையின் செயற்பாட்டுத் தன்மையும் தொடர்ச்சியும் காக்கப்படுகின்றன.
- source_word: נִטְמָאָה
  choice: தீட்டுப்பட்டிருக்கிறாள்
  rationale: எபிரெயத்தின் தீட்டு/அசுத்த மொழியைப் பாதுகாக்கிறது. சூழல் பாலியல் முறைகேட்டைப் பற்றியது என்றாலும், ‘விபசாரம் செய்தாள்’ என்று வெளிப்படையாகத் தீர்மானித்து மூலத்தின் உருவகத்தையும் பரப்பையும் குறுக்கவில்லை.
- source_word: אוֹ
  choice: அல்லது
  rationale: சட்டத்தில் முன்வைக்கப்படும் இரண்டாவது மாற்றுச் சூழலை எளிமையாகக் குறிக்கிறது.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: ஆனால் அவள் தீட்டுப்படவில்லை
  rationale: எபிரெய இணைப்புச்சொல் பொதுவாக ‘மற்றும்’ என்றாலும், இரண்டாவது சூழலில் கணவனின் பொறாமைக்கும் மனைவியின் உண்மை நிலைக்கும் இடையிலான முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: சந்தேகிக்கப்படும் மணமுறைகேட்டில் தீட்டு மொழியின் இயல்பு
  choice: נִטְמָאָה என்பதை ‘தீட்டுப்பட்டிருக்கிறாள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தன்னைத் தீட்டுப்படுத்திக்கொண்டிருக்கிறாள்’ அல்லது ‘அசுத்தமானவளாகியிருக்கிறாள்’
  rationale: இந்தச் சூழல் வெறும் சடங்கு அசுத்தத்தை அல்ல, பாலியல் முறைகேட்டுடன் தொடர்புடைய தீட்டைச் சுட்டுகிறது. அதேவேளை, ‘தீட்டு’ என்ற தேர்வு எபிரெயத்தின் சடங்கு-ஒழுக்க overlap-ஐப் பாதுகாத்து, உரை வெளிப்படையாகச் சொல்லாத பிற்காலக் கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
- issue: רוּחַ קִנְאָה என்பது தனிப்பட்ட ஆவியா அல்லது உள்ளார்ந்த மனத்தூண்டுதலா
  choice: முதன்மை உரையில் ‘பொறாமையின் ஆவி’; அடிக்குறிப்பில் ‘பொறாமை உணர்வு’
  alternative: ‘பொறாமை உணர்வு’ என்பதை மட்டும் முதன்மை உரையில் பயன்படுத்துதல்
  rationale: ‘ஆவி’ மூலச்சொல்லின் உருவத்தையும் உண்மையான பொருள் நெகிழ்வையும் காக்கிறது; அடிக்குறிப்பு இச்சூழலில் அது மனநிலை அல்லது உந்துதலையும் குறிக்கக்கூடும் என்பதைத் தெளிவாக்குகிறது.
