  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: யாவே மோசேயிடம் பேசினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் דבר புதிய இறையுரை அலகை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடைச் சூத்திரம்; ‘பேசினார்’ என்பது அதன் இயல்பான நவீனத் தமிழ் இணை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தனிப்பட்ட இறைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל
  choice: -ிடம்
  rationale: பேச்சின் நோக்குநரைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழில் வேற்றுமை உருபாக வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: (பின்வரும் நேரடி உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளி)
  rationale: ‘சொல்லும்படி/கூறி’ என சொற்சொல்லாக மீளுரைப்பதைவிட, அடுத்த வசனத்தில் தொடங்கும் உரையின் உள்ளடக்கத்தை நவீனத் தமிழில் முக்காற்புள்ளி இயல்பாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை பட்டமல்ல, நான்கெழுத்துத் தனிப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ அதைத் தனிப்பட்ட இறைப் பெயராகப் பாதுகாக்கிறது; அதன் உச்சரிப்பு மீளமைக்கப்பட்டது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ். எபிரெய உரை அறிமுகச் சூத்திரத்தின் செயல்பாட்டை இயல்பான தமிழில் காக்க, לֵאמֹר என்பதற்கு தனிச்சொல் சேர்க்காமல் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறி இறைப் பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
