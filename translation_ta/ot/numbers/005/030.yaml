  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: ta
  text: அல்லது, பொறாமையின் ஆவி ஒரு மனிதன்மேல் வந்து, அவன் தன் மனைவியின்மேல் பொறாமைகொண்டு, அந்தப் பெண்ணை யாவேக்கு முன்பாக நிறுத்தினால், ஆசாரியன் அவள்மீது இந்தச் சட்டமுறை அனைத்தையும்[b] நிறைவேற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘சட்டமுறை’ என்பதற்கு ‘சட்டம்,’ ‘அறிவுறுத்தல்,’ அல்லது ‘சடங்குமுறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: அல்லது
  rationale: முந்தைய வசனத்தில் தொடங்கிய சட்ட வாக்கியத்தின் இரண்டாவது மாற்றுநிலையை அறிமுகப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: எபிரெயச் சொல்லின் பொதுவான பொருளைத் தக்கவைக்கிறது; தொடர்ந்து வரும் ‘தன் மனைவி’ என்பது திருமண உறவைத் தெளிவாக்குகிறது.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: பொறாமையின் ஆவி ஒரு மனிதன்மேல் வந்ததால்
  rationale: ‘பொறாமையின் ஆவி’ என்பதை அப்படியே தக்கவைத்து, அது உள்ளார்ந்த மனநிலையா அல்லது வேறு வகையான ஆற்றலா என்பதைத் தீர்மானிக்காமல் விடுகிறது. עָבַר עַל என்பதன் சூழல்சார் பொருள் இயல்பான தமிழில் ‘மேல் வருதல்’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: அவன் தன் மனைவிமேல் பொறாமைகொண்டு
  rationale: பெயர்ச்சொல்லான ‘பொறாமை’யுடன் தொடர்புடைய வினையின் மீளுரையைத் தக்கவைத்து, திருமணச் சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: அந்தப் பெண்ணை யாவேக்கு முன்பாக நிறுத்தினால்
  rationale: העמיד என்ற காரணவினையின் ‘நிற்கச் செய்தல்/நிறுத்துதல்’ என்ற பொருளையும் சடங்குரீதியான முன்னிறுத்தலையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: ஆசாரியன் அவளுக்குச் செயல்படுத்த வேண்டும்
  rationale: சட்ட-சடங்கு சூழலில், ஆசாரியன் குறிப்பிடப்பட்ட செயல்வழியை அந்தப் பெண்ணிடம் நிறைவேற்ற வேண்டும் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: இந்த விதிமுறை முழுவதையும்
  rationale: תּוֹרָה என்பதற்கு இச்சூழலில் முன் விவரிக்கப்பட்ட சட்ட-சடங்கு நடைமுறை என்ற பொருள் உள்ளது. ‘விதிமுறை’ என்பது ‘சட்டம்’, ‘அறிவுறுத்தல்’, ‘சடங்குமுறை’ ஆகிய சாத்தியங்களை ஒருங்கிணைக்கும் இயல்பான தேர்வு.
theological_decisions:
- issue: ‘பொறாமையின் ஆவி’ என்பதன் இயல்பு
  choice: ‘பொறாமையின் ஆவி’ என்று நேரடியாக மொழிபெயர்த்து, அது மனிதனின் உள்ளார்ந்த உந்துதலா அல்லது ஆன்மீக ஆற்றலா என்பதைத் திறந்தவண்ணம் வைத்தல்
  alternative: ‘பொறாமை உணர்ச்சி’ அல்லது ‘பொறாமை வெறி’
  rationale: רוּחַ קִנְאָה என்ற சொற்றொடர் மிகுந்த பொறாமை மனநிலையைக் குறிக்கலாம்; எனினும் அதன் சொல்லாக்கம் ஆன்மீக அல்லது உளவியல் இயல்பைத் திட்டவட்டமாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட-சடங்கு உரைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பொறாமையின் ஆவி’ என்ற மூலப்படிமம் தக்கவைக்கப்பட்டுள்ளது; கடினமான எபிரெய வாக்கிய அமைப்பு தமிழில் நிபந்தனை வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது.
