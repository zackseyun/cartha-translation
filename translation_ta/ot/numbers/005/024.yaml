  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: ta
  text: பின்பு அவன் சாபத்தை விளைவிக்கும் கசப்புத் தண்ணீரை[a][b] அந்தப் பெண்ணுக்குக் குடிக்கக் கொடுக்க வேண்டும்; சாபத்தை விளைவிக்கும் அந்தத் தண்ணீர் அவளுக்குள் சென்று கசப்பை உண்டாக்கும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘கசப்பின் நீர்கள்.’ எபிரெய மொழியில் ‘தண்ணீர்’ என்பதற்குப் பன்மை வடிவம் பயன்படுத்தப்படுவது வழக்கமானது.
    reason: lexical_alternative
  - marker: b
    text: 'வேறொரு மொழிபெயர்ப்பு: ‘சாபத்தை உண்டாக்கும் கசப்பின் நீர்.’ எபிரெய பங்கெச்சம், இந்தத் தண்ணீர் சாபத்தை விளைவிக்கும் அல்லது சாபத்தைச் செயல்படுத்தும் பங்கைக் குறிக்கிறது.'
    reason: alternative_reading
  - marker: c
    text: இதை இன்னும் சொல்லுக்குச் சொல் முறையில், ‘அவளுக்குள் கசப்பாகச் செல்லும்’ அல்லது ‘அவளுக்குள் சென்று கசப்பாகும்’ என்றும் மொழிபெயர்க்கலாம். இறுதிச் சொற்றொடர் விளைவைக் குறிக்கிறது; அதன் துல்லியமான தன்மையை விவரிக்கவில்லை.
    reason: ambiguity
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: குடிக்கக் கொடுக்க வேண்டும்
  rationale: שׁקה என்பதன் ஹிப்ஈல் வடிவம் ‘குடிக்கச் செய்தல்’ அல்லது ‘குடிக்கக் கொடுத்தல்’ என்னும் காரணவினைப் பொருளைத் தருகிறது. சடங்குச் சூழலில் ‘குடிக்கக் கொடுக்க வேண்டும்’ என்பது இயல்பான தமிழாகவும் காரணவினைப் பொருளைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய definite noun-ஐ இயல்பான தமிழில் சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட பெண்ணைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: מֵי הַמָּרִים
  choice: கசப்புத் தண்ணீர்
  rationale: சொல்லுக்குச் சொல் ‘கசப்பின் நீர்கள்.’ திரவப்பொருளைக் குறிக்கத் தமிழில் ஒருமைப் பொருளுடைய ‘தண்ணீர்’ இயல்பானது; ‘கசப்பு’ என்ற பண்பும் காக்கப்படுகிறது.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: சாபத்தை விளைவிக்கும்
  rationale: ארר வேரிலிருந்து வந்த பங்கெச்சம் இந்தத் தண்ணீர் சாபத்தின் விளைவைச் சுமந்து செயல்படுத்துவதைச் சுட்டலாம். ‘சபிக்கப்பட்ட’ என்று மட்டும் கூறி தண்ணீரே சாபத்திற்குள்ளானது என்ற எண்ணத்தைத் திணிப்பதை இது தவிர்க்கிறது.
- source_word: וּבָאוּ בָהּ
  choice: அவளுக்குள் சென்று
  rationale: בוא உடன் ב பயன்படுத்தப்பட்டிருப்பது அவளுடைய உடலுக்குள் நுழைவதைச் சுட்டுகிறது. ‘அவளுக்குள் சென்று’ என்பது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְמָרִים
  choice: கசப்பை உண்டாக்கும்
  rationale: לְ முன்னொட்டு இங்கு விளைவு அல்லது நோக்கத்தைச் சுட்டலாம். உடலில் நிகழும் குறிப்பிட்ட பாதிப்பை ஊகிக்காமல், தீங்கான கசப்பு விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சோதனைச் சடங்கில் தண்ணீருக்கும் சாபத்திற்கும் உள்ள உறவு
  choice: தண்ணீரை ‘சாபத்தை விளைவிக்கும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘சபிக்கப்பட்ட தண்ணீர்’ என்று மொழிபெயர்த்தல்
  rationale: ארר வேரிலிருந்து வந்த பங்கெச்சம், குற்றம் இருந்தால் உடன்படிக்கைச் சாபத்தைச் செயல்படுத்தும் தண்ணீரின் பங்கைக் குறிக்கக்கூடும். இவ்வாறு மொழிபெயர்ப்பது மந்திரத் தன்மை பற்றிய கருத்தைச் சேர்க்காமல், நீதிசார் சடங்கின் வலிமையையும் மூலத்தின் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘கசப்புத் தண்ணீர்’ மற்றும் ‘சாபத்தை விளைவிக்கும்’ என்ற மீளுரைகள் எபிரெய வசனத்தின் வலியுறுத்தலைக் காக்கின்றன; உடலியல் விளைவோ மந்திரச் செயல்முறையோ உரையில் சேர்க்கப்படவில்லை.
