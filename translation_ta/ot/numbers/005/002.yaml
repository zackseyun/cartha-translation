source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களுக்குக் கட்டளையிடு: அவர்கள் தோல் பாதிப்புள்ள ஒவ்வொருவரையும்[a], உடலிலிருந்து கசிவு உள்ள ஒவ்வொருவரையும், இறந்த மனிதரின் உடலால் தீட்டுப்பட்ட ஒவ்வொருவரையும் முகாமிலிருந்து வெளியே அனுப்ப வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடுமையான தோல் பாதிப்புள்ள ஒவ்வொருவரையும்.’ எபிரெயச் சொல் சடங்குத் தூய்மைச் சட்டங்களில் பலவகையான தோல் பாதிப்புகளைக் குறிக்கிறது; அது நவீன தொழுநோயை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிடு
  rationale: மோசேயை நோக்கிக் கூறப்படும் ஒருமை ஏவல் வினையின் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது பாலினத்தைத் தவறாக வரையறுக்காமல் இயல்பான தமிழை அளிக்கிறது.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே அனுப்ப வேண்டும்
  rationale: வினையின் ‘வெளியே அனுப்புதல்’ என்ற இயக்கத்தையும் கட்டளையின் நோக்கத்தையும் தெளிவாக வெளிப்படுத்துகிறது; தண்டனை என்ற கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: כָּל צָרוּעַ
  choice: தோல் நோயுள்ள ஒவ்வொருவரையும்
  rationale: צָרוּעַ என்பது சடங்குச் சட்டச் சூழலில் பலவகையான கடுமையான தோல் பாதிப்புகளைக் குறிக்கலாம்; அதை நவீன தொழுநோயுடன் மட்டும் ஒப்பிடுவதைத் தவிர்க்கிறது.
- source_word: וְכָל זָב
  choice: உடலில் கசிவு உள்ள ஒவ்வொருவரையும்
  rationale: தூய்மைச் சட்டங்களில் அசாதாரண உடற்கசிவு உடையவரைக் குறிக்கிறது. ‘உடலில்’ என்பது தமிழில் பொருளை இயல்பாகவும் போதுமான தெளிவுடனும் தருகிறது.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: இறந்த மனித உடலால் தீட்டுப்பட்ட ஒவ்வொருவரையும்
  rationale: நֶפֶשׁ இங்கு இறந்த மனிதரை அல்லது பிணத்தைச் சுட்டும் தோரா வழக்குச் சொற்றொடர். ‘இறந்த மனித உடல்’ என்பது பிணத்தால் ஏற்படும் சடங்குத் தீட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: சடங்குத் தூய்மையின்மையைக் குறிக்கும் טָמֵא என்பதன் மொழிபெயர்ப்பு
  choice: தீட்டுப்பட்ட
  alternative: அசுத்தமான
  rationale: இந்தச் சட்டச் சூழலில் குறிப்பிடப்படுவது ஒழுக்கக் குற்றம் அல்ல, சடங்குசார் நிலை. ‘தீட்டுப்பட்ட’ என்பது தமிழில் அந்த வேறுபாட்டைச் சுருக்கமாகக் காட்டுகிறது; இங்கு பிணத்தால் அந்த நிலை ஏற்பட்டுள்ளது என்பதையும் செயப்பாட்டு வடிவம் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. பட்டியலின் மூன்று உறுப்புகளும் இணையான அமைப்பில் தரப்பட்டுள்ளன. சடங்குத் தீட்டை ஒழுக்கப் பாவமாக மாற்றிப் புரியவைக்கும் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
