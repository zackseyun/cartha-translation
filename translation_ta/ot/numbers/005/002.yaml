  rationale: The revision makes the Israelites explicitly responsible for carrying out the command, renders the directional phrase more directly as ‘out from the camp,’ and uses broader, non-anachronistic terminology for the ritual skin-affliction category. It retains ‘தீட்டுப்பட்ட’ for corpse-related ritual impurity and does not add punitive or moral implications.
