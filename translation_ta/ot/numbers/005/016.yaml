reference: Numbers 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְרִ֥יב אֹתָ֖/הּ הַ/כֹּהֵ֑ן וְ/הֶֽעֱמִדָ֖/הּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: ta
  text: பின்பு ஆசாரியன் அவளை அருகே கொண்டுவந்து, யாவே[a] முன்னிலையில் நிற்கச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH.” மரபுவழியாக “கர்த்தர்” என்று வழங்கப்படுகிறது; “யாவே” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் மூல வடிவத்தையும் மரபுவழி வழங்கலையும் விளக்குதல்.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: அருகே கொண்டுவந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்’ அல்லது ‘முன்னிலைப்படுத்துதல்’ என்று பொருள்படும். இங்கு அவளே நேரடிச் செயப்படுபொருளாக இருப்பதாலும், அடுத்து யாவே முன்னிலையில் நிற்கச் செய்வது வருவதாலும், இடம்சார்ந்த பொருளைத் தெளிவாக வைத்திருக்க ‘அருகே கொண்டுவந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֹתָהּ
  choice: அவளை
  rationale: மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டுடன் கூடிய நேரடிச் செயப்படுபொருள் குறியீடு; சூழலில் குறிப்பிடப்படும் பெண்ணைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וְהֶעֱמִדָהּ
  choice: நிற்கச் செய்ய வேண்டும்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கும்படி செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘நிற்கச் செய்ய’ என்பது அந்தக் காரணவினைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ஒருவருக்கு முன்பாக அல்லது அவருடைய சந்நிதியில் இருப்பதைக் குறிக்கிறது. இங்கு ‘முன்னிலையில்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தின் நான்கு எழுத்துத் தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, YHWH என்ற தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. ஆகவே அதனை ‘யாவே’ என்று ஒலிபெயர்த்து, மரபுவழி மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வேண்டும்’ என்பது எபிரெய தொடர்வினைகளின் கட்டளை/சட்டப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; காரணவினைத் தன்மை ‘நிற்கச் செய்ய’ என்பதில் காக்கப்பட்டுள்ளது.
