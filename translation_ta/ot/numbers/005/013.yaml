  source_fidelity: 'முதன்மைக் கருத்து எபிரெய மூலத்துடன் ஒத்துள்ளது: பாலுறவு, கணவனுக்குத் தெரியாமை, பெண்ணின் மறைவு, தீட்டு நிலை, சாட்சி இன்மை, பிடிபடாமை ஆகிய தொடர் நிபந்தனைகள் பாதுகாக்கப்பட்டுள்ளன. எனினும், “அவளும் மறைந்திருந்து” என்பதிலுள்ள “உம்” மூலத்தில் இல்லாத கூடுதலான வலியுறுத்தலைத் தருகிறது; “மறைவில் இருந்தும்” நிஃபால் வடிவின் தெளிவின்மையையும் இயல்பான தமிழையும் சிறப்பாகக் காக்கிறது. “உடலுறவுகொண்டு விந்து வெளியேற்றியிருந்தும்” என்பதற்குப் பதிலாக “விந்து வெளியேற்றத்துடன் ... உடலுறவு கொண்டிருந்தும்” என்பது שִׁכְבַת זֶרַע-இன் இணைந்த சொற்றொடர் அமைப்பைத் தெளிவாகக் காட்டுகிறது.'
