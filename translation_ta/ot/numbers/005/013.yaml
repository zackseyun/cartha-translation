source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: ta
  text: ஒரு ஆண் அவளுடன் விந்து வெளியேற்றத்துடன் உடலுறவு கொண்டிருந்தும்[a], அது அவளுடைய கணவனின் கண்களுக்கு மறைவாக இருந்தும், அவள் மறைவில் இருந்தும், அவள் தீட்டுப்பட்டிருந்தும், அவளுக்கு எதிராகச் சாட்சி எதுவும் இல்லாமலும்[b], அவள் பிடிபடாமலும் இருந்தால்—[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, “விதையின் படுத்தல்”; விந்து வெளியேற்றத்துடன் கூடிய உடலுறவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளைக் குறித்து எந்தச் சாட்சியும் இல்லாமலும்.”
    reason: alternative_reading
  - marker: c
    text: அல்லது, “அவள் பற்றிப்பிடிக்கப்படாமலும்.” இதைச் சிலர், “அவள் வற்புறுத்தப்படவில்லை” என்பதைக் குறிக்கலாம் எனப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ שִׁכְבַת זֶרַע
  choice: ஒரு ஆண் அவளுடன் உடலுறவுகொண்டு விந்து வெளியேற்றியிருந்தும்
  rationale: பாலுறவைக் குறிக்கும் שׁכב ... אֹתָהּ என்பதையும், சொற்படியாக ‘விதையின் படுக்கை’ எனும் שִׁכְבַת זֶרַע இங்கு விந்து வெளியேற்றத்துடன் கூடிய உடலுறவைக் குறிப்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: அது அவளுடைய கணவனின் கண்களுக்கு மறைவாக இருந்து
  rationale: ‘கண்களிலிருந்து மறைக்கப்பட்டது’ என்ற எபிரெய மரபுத்தொடரையும், நிகழ்வு கணவனுக்குத் தெரியாமல் இருந்ததையும் தக்கவைக்கிறது.
- source_word: וְנִסְתְּרָה
  choice: அவளும் மறைந்திருந்து
  rationale: நிஃபால் வடிவிலுள்ள செயல்பாட்டு/தற்செயல்பாட்டு தெளிவின்மையை முற்றிலும் தீர்க்காமல் தக்கவைக்கிறது; ‘அவள் தன்னை மறைத்துக்கொண்டாள்’ என்று நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: וְהִיא נִטְמָאָה
  choice: தீட்டுப்பட்டிருந்தும்
  rationale: טמא என்பதன் தூய்மைச் சட்டப் பொருளைத் தமிழின் வேதாகமச் சட்ட நடையில் ‘தீட்டு’ எனத் தக்கவைக்கிறது; வெறும் ஒழுக்கக் கண்டனமாக மாற்றவில்லை.
- source_word: וְעֵד אֵין בָּהּ
  choice: அவளுக்கு எதிராகச் சாட்சி சொல்ல யாரும் இல்லாமலும்
  rationale: בָּהּ என்பதன் ‘அவளைப் பற்றி/அவளுக்கு எதிராக’ என்ற சட்டத் தொடர்பை இயல்பான தமிழில் தருகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் உள்ளது.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: அவள் பிடிபடாமலும் இருந்தால்
  rationale: இந்தச் சட்டச் சூழலில் ‘செயலில் பிடிபடுதல்’ என்ற முதன்மைப் பொருளைத் தருகிறது; ‘பற்றிப் பிடிக்கப்படுதல்/வற்புறுத்தப்படுதல்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: נִטְמָאָה என்பதிலுள்ள தூய்மைச் சட்ட மொழி
  choice: தீட்டுப்பட்டிருந்தும்
  alternative: அசுத்தமானவளாகியிருந்தும்; கறைப்பட்டிருந்தும்
  rationale: ‘தீட்டு’ என்பது இப்பகுதியின் சடங்கு மற்றும் ஒழுக்கத் தூய்மைச் சட்டப் பரப்பை ஒருங்கே தக்கவைக்கிறது; ‘கறைப்பட்டாள்’ என்பது அதிகமான உணர்ச்சி அல்லது ஒழுக்கத் தீர்ப்பைச் சேர்க்கக்கூடும்.
- issue: לֹא נִתְפָּשָׂה என்பதன் பொருள்
  choice: அவள் பிடிபடாமலும்
  alternative: அவள் பற்றிப் பிடிக்கப்படாமலும்; அவள் வற்புறுத்தப்படாமலும்
  rationale: சாட்சி இல்லாத நிலையைத் தொடர்ந்து வருவதால், இங்கு ‘பிடிபடவில்லை’ என்பதே சூழலுக்கு மிக இயல்பானது. இருந்தாலும் வினைச்சொல்லின் ‘பற்றிப் பிடித்தல்’ என்ற பொருளிலிருந்து வற்புறுத்தல் குறித்த புரிதலும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப் பகுதியின் நீண்ட நிபந்தனை வாக்கிய ஓட்டம் பாதுகாக்கப்பட்டுள்ளது. ‘உடலுறவு’, ‘விந்து வெளியேற்றுதல்’ ஆகியவை தெளிவான ஆனால் மரியாதையான சொற்கள். வசனம் அடுத்த பகுதிக்குத் தொடர்வதை இறுதி நீண்ட கோடு காட்டுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
