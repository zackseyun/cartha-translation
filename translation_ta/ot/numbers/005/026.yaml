  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: ta
  text: பின்பு ஆசாரியன் தானியக் காணிக்கையிலிருந்து அதன் நினைவுப்பகுதியான ஒரு கைப்பிடி அளவை எடுத்து, அதைப் பலிபீடத்தின்மேல் எரிக்க வேண்டும். அதன்பின் அவன் அந்தப் பெண்ணை அந்தத் தண்ணீரைக் குடிக்கச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விரிவான சூழலைக் கருத்தில் கொண்டு, ‘அந்தக் கசப்பான தண்ணீர்’ என்றும் குறிப்பிடலாம். ஆனால் இந்த வசனம் வெறுமனே ‘அந்தத் தண்ணீர்’ என்றே கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: ஒரு கைப்பிடி அளவு எடுத்து
  rationale: பலிச் சடங்குச் சூழலில் קמץ என்பது காணிக்கையிலிருந்து ஒரு கைப்பிடி அளவு எடுப்பதைக் குறிக்கிறது. தமிழில் சடங்கு நடவடிக்கையை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் இணைச்சொல்.
- source_word: מִן הַמִּנְחָה
  choice: தானியக் காணிக்கையிலிருந்து
  rationale: ஆசாரிய பலிச் சூழலில் מִנְחָה பொதுவான பரிசை அல்ல, தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: அதன் நினைவுப்பகுதியாக
  rationale: אַזְכָּרָה என்பது பலிபீடத்தில் எரிக்கப்படும் தானியக் காணிக்கையின் நினைவுப்பகுதியைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: அதைப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்
  rationale: הקטיר என்பது பலியாக எரிப்பதைக் குறிக்கிறது; מִזְבֵּחָה-வில் உள்ள திசைச்சுட்டும் வடிவம் தமிழில் இயல்பாக ‘பலிபீடத்தின்மேல்’ என வழங்கப்பட்டுள்ளது. ‘அதை’ என்பது முன் கூறப்பட்ட நினைவுப்பகுதியைக் குறிக்கிறது.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: சடங்கின் அடுத்த நடவடிக்கையைச் சுட்டும் காலவரிசையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יַשְׁקֶה
  choice: குடிக்கச் செய்ய வேண்டும்
  rationale: 'שׁקה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைக்கிறது: ஆசாரியன் பெண் குடிக்கும்படி செய்கிறான்.'
- source_word: אֶת הָאִשָּׁה
  choice: அந்தப் பெண்ணை
  rationale: காரணவினையின் நேரடிச் செயப்படுபொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֶת הַמָּיִם
  choice: அந்தத் தண்ணீரை
  rationale: இவ்வசனத்தின் எபிரெய உரை வெறுமனே ‘தண்ணீர்’ என்றே கூறுகிறது. முந்தைய சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட தண்ணீரைச் சுட்டுவதால் ‘அந்தத்’ பயன்படுத்தப்பட்டுள்ளது; ‘கசப்பான’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: சுற்றியுள்ள சடங்குச் சூழலை அடிப்படையாகக் கொண்டு தண்ணீரை ‘கசப்பான தண்ணீர்’ என்று முதன்மை உரையிலேயே குறிப்பிட வேண்டுமா?
  choice: ‘அந்தத் தண்ணீர்’ என்ற எளிய சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘அந்தக் கசப்பான தண்ணீர்’
  rationale: இந்த வசனத்தில் הַמָּיִם (‘அந்தத் தண்ணீர்’) மட்டுமே உள்ளது. ‘கசப்பான’ என்று சேர்ப்பது அருகிலுள்ள வசனங்களின் விளக்கத்தை இவ்வசனத்திற்குள் கொண்டுவரும்; ஆகவே அது அடிக்குறிப்பில் மட்டும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்ட அறிவுறுத்தலின் தொடர்ச்சியை ‘வேண்டும்’ வடிவமும் ‘பின்பு/அதன்பின்’ என்ற வரிசைச் சொற்களும் வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறி அதற்குரிய ‘தண்ணீர்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
