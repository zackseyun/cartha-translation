base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: ta
  text: '“இஸ்ரவேலின் மகன்களிடம் பேசி, அவர்களிடம் சொல்: ஒருவனுடைய மனைவி வழிதவறி, அவனுக்கு எதிராக நம்பிக்கையை மீறினால்,[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இயல்பான தமிழில், “இஸ்ரவேல் மக்களிடம்.” எபிரெயில் சொற்சொல்லாக “இஸ்ரவேலின் மகன்களிடம்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நம்பிக்கையை மீறினால்” என்பது நம்பிக்கையற்ற அல்லது துரோகமான செயலைக் குறிக்கும் ஒரே எபிரெய வேர்ச்சொல்லிலிருந்து அமைந்த வினை–பெயர் சேர்க்கையை மொழிபெயர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: இது மோசேக்கு அளிக்கப்படும் கட்டளை. தொடர்ந்து வரும் ‘சொல்’ என்பதிலிருந்து வேறுபாட்டைப் பேணுவதற்கும் எபிரெய தொடக்கச் சூத்திரத்தை இயல்பான தமிழில் வழங்குவதற்கும் ‘பேசி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப உறவைக் குறிக்கும் ஆண்பால் வடிவத்தை முதன்மை உரை நேரடியாகப் பேணுகிறது; பொதுமக்களைக் குறிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: சட்ட அறிவுறுத்தலுக்குரிய நேரடியான பேச்சுச் சூத்திரத்தைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אִישׁ אִישׁ
  choice: ஒருவனுடைய
  rationale: மீண்டும் வரும் ‘மனிதன், மனிதன்’ என்ற பகிர்வுப்பொருள் தமிழில் ‘ஒருவனுடைய மனைவி’ என்ற நிபந்தனை அமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: כִּי
  choice: செய்தால்
  rationale: சட்டவழக்கை அறிமுகப்படுத்தும் நிபந்தனைப் பொருள் தமிழின் ‘-ஆல்’ விகுதியால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: תִשְׂטֶה
  choice: வழிதவறி
  rationale: அடுத்த சொற்றொடர் குற்றத்தின் உறவுசார் தன்மையை விளக்குவதற்கு முன், மூலத்தின் உருவகமான ‘விலகிச் செல்லுதல்’ என்ற பொருளை இது பேணுகிறது.
- source_word: אִשְׁתּוֹ
  choice: ஒருவனுடைய மனைவி
  rationale: எபிரெயிலுள்ள உடைமைப் பொருள் தமிழ் வாக்கிய அமைப்பில் தெளிவாகப் பேணப்பட்டுள்ளது.
- source_word: וּמָעֲלָה ... מָעַל
  choice: நம்பிக்கைத் துரோகம் செய்தால்
  rationale: ஒரே வேர்ச்சொல்லிலிருந்து அமைந்த வினை–பெயர் சேர்க்கையின் வலியுறுத்தலைச் சொற்சொல்லாகச் செயற்கையாக மீளுருவாக்காமல், விசுவாசமின்மை மற்றும் உறவுத் துரோகம் ஆகிய இரண்டையும் dignified modern Tamil-இல் எடுத்துரைக்கிறது.
- source_word: בּוֹ
  choice: அவனிடம்
  rationale: கணவனே அந்தத் துரோகத்தால் பாதிக்கப்படும் உறவுநபர் என்பதை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களுக்கான ஆண்பால் குடும்ப அழைப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: முதன்மை உரை எபிரெயின் ஆண்பால் குடும்பச் சொல்லை மறைக்காமல் பேணுகிறது; அந்தச் சொற்றொடர் இஸ்ரவேல் மக்களைப் பொதுவாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: מעל என்ற சொல்லின் உறவுசார் மற்றும் உடன்படிக்கைசார் பரப்பு
  choice: நம்பிக்கைத் துரோகம்
  alternative: உண்மையற்றவளாக நடந்துகொள்ளுதல்
  rationale: மூலத்தின் வினை–பெயர் சேர்க்கையில் உள்ள தீவிரத்தையும் நம்பிக்கையை மீறும் துரோகப் பொருளையும் பேணுகிறது; அதேவேளை அடுத்த வசனம் விவரிக்கும் குறிப்பிட்ட செயலை இவ்வசனத்திலேயே முன்கூட்டியே வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சற்றே முறையான சொற்றொடர் மூலத்தின் பாலின மற்றும் குடும்ப வடிவத்தைப் பேணுவதற்காக நோக்கத்துடன் வைக்கப்பட்டுள்ளது.
