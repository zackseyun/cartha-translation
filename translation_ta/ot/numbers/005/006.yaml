  source_fidelity: The draft accurately represents the addressees, the explicit man-or-woman pair, the generic-human sense of הָאָדָם, covenantal unfaithfulness directed against YHWH, and consequent guilt. The Hebrew verse, however, continues syntactically into the following verse and ends with a disjunctive continuation rather than a completed quotation.
