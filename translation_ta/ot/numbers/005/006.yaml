source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம் சொல்: ஓர் ஆணோ பெண்ணோ மனிதர்கள் செய்யும் பாவங்களில் ஏதேனும் ஒன்றைச் செய்து, ஆண்டவருக்கு எதிராக நம்பிக்கைத் துரோகம் இழைத்தால், அந்த நபர் குற்றவாளி ஆவார்,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: சொல்
  rationale: பீயேல் கட்டளை வடிவத்தைத் தமிழில் இயல்பான நேரடிக் கட்டளையாக வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தார் அனைவரையும் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ஓர் ஆணோ பெண்ணோ
  rationale: எபிரெய மூலத்தில் வெளிப்படையாக உள்ள ஆண்–பெண் இணையைப் பாதுகாத்து, சட்டம் இருபாலருக்கும் பொருந்துவதைத் தெளிவாக்குகிறது.
- source_word: כִּי יַעֲשׂוּ
  choice: … செய்து … செய்தால்
  rationale: பன்மை வினைச்சொல் பகிர்வுப் பொருளுடைய ‘ஓர் ஆணோ பெண்ணோ’ என்பதுடன் வருகிறது; தமிழில் ஒருமை நிபந்தனை வாக்கியமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: மனிதர்கள் செய்யும் பாவங்களில் ஏதேனும் ஒன்று
  rationale: הָאָדָם இங்கு ஓர் ஆணை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள் செய்யும் பாவங்கள்’ அந்தப் பொதுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִמְעֹל מַעַל
  choice: நம்பிக்கைத் துரோகம் செய்தல்
  rationale: ஒரே வேரிலிருந்து வரும் வினைச்சொல்–பெயர்ச்சொல் இணை, சாதாரண தவறைவிட உறவு அல்லது உடன்படிக்கையை மீறும் உண்மையின்மையை வலியுறுத்துகிறது.
- source_word: בַּיהוָה
  choice: ஆண்டவருக்கு எதிராக
  rationale: מעל உடன் வரும் בְּ, துரோகம் ஆண்டவருக்கு எதிராகச் செய்யப்படுவதைச் சுட்டுகிறது. יהוה என்பதற்கு தமிழில் மரியாதைமிக்க, பொதுவாகப் புரியும் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் குற்றவாளி ஆவார்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து பிரிந்த ‘ஆன்மா’ என்ற தொழில்நுட்பப் பொருளில் அல்ல, சம்பந்தப்பட்ட நபரைக் குறிக்கிறது; אָשֵׁם குற்றப்பொறுப்புடைய நிலையைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழில் இயல்பான மரியாதைத் தலைப்பைப் பயன்படுத்தி, ஆங்கில ஆலோசனை உரையின் ‘the LORD’ மரபையும் பின்பற்றுகிறது; மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பது சொற்களஞ்சியத் தீர்மானத்தில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
- issue: הָאָדָם என்பதன் பொதுமைப் பொருள்
  choice: மனிதர்கள்
  alternative: மனிதன்
  rationale: இந்தச் சட்டச் சூழலில் இச்சொல் ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. மொழிபெயர்ப்பு அந்த உள்ளடக்கிய பொருளை வெளிப்படுத்துகிறது; அடிச்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מעל என்பதன் குற்றவியல் மற்றும் உடன்படிக்கை சார்ந்த நுணுக்கம்
  choice: நம்பிக்கைத் துரோகம்
  alternative: குற்றம் செய்தல்
  rationale: இங்கு பாவம் ஆண்டவருக்கு எதிரான உறவு சார்ந்த உண்மையின்மையாகச் சித்தரிக்கப்படுகிறது. ‘குற்றம்’ மட்டும் அந்தத் துரோக நுணுக்கத்தை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ போன்ற செயற்கையான சொல்லுக்குச் சொல் வடிவமும், ‘ஆத்துமா’ போன்ற இச்சூழலுக்குப் பொருந்தாத சமயத் தொழில்நுட்பச் சொல்லும் தவிர்க்கப்பட்டுள்ளன.
