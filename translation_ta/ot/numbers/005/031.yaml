source:
  edition: WLC
  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: ta
  text: அப்போது அந்த மனிதன் குற்றத்திலிருந்து விடுபடுவான்[a]; ஆனால் அந்தப் பெண் தன் குற்றத்தைச் சுமப்பாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கணவன் குற்றத்திலிருந்து விடுபடுவான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் அக்கிரமத்தைச் சுமப்பாள்”; இந்த எபிரெய மரபுத்தொடர் குற்றத்தின் விளைவுகளைச் சுமப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: விடுபடுவான்
  rationale: נקה என்பதன் நிபால் வடிவம் குற்றம் அல்லது பொறுப்பிலிருந்து விடுவிக்கப்படுதல், குற்றமற்றவர் எனத் தீர்க்கப்படுதல் ஆகிய பொருள்களைத் தருகிறது. இங்கு מִן உடன் வருவதால் ‘விடுபடுவான்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָאִישׁ
  choice: அந்த ஆண்
  rationale: אִישׁ என்பதன் நேரடிப் பொருள் ‘ஆண்/மனிதன்’; இச்சூழலில் அது கணவனைக் குறிக்கிறது. மூலத்தின் சொல் அமைப்பை முதன்மை உரை காக்கிறது; சூழல்சார் மாற்றாக ‘கணவன்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵעָוֺן
  choice: குற்றப்பொறுப்பிலிருந்து
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம், குற்றத்தால் வரும் பொறுப்பு அல்லது தண்டனை ஆகிய பொருள் பரப்பைக் கொண்டது. נקה உடன் இங்கு வருவதால் குற்றத்திற்கான பொறுப்பிலிருந்து விடுபடுதல் என்ற சட்ட-ஒழுக்கப் பொருள் தெளிவாகிறது.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: ஆனால் அந்தப் பெண்
  rationale: וְ என்பது பொதுவாக ‘மேலும்/அப்போது’ எனினும், இங்கு ஆணின் விடுதலையையும் பெண்ணின் குற்றச் சுமையையும் முரண்படுத்துகிறது. ஆகவே இயல்பான தமிழில் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; הַהִוא-வின் சுட்டுவலிமை ‘அந்த’ என்பதால் காக்கப்படுகிறது.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: தன் குற்றத்தைச் சுமப்பாள்
  rationale: נשׂא עָוֹן என்ற எபிரெய மரபுத்தொடர் குற்றத்தைச் சுமத்தல் மட்டுமல்ல, அதன் விளைவுகளையும் ஏற்றல் என்ற பொருளைக் கொண்டிருக்கலாம். ‘தன் குற்றத்தைச் சுமப்பாள்’ என்பது அந்த உருவகத்தையும் பொருள் அகலத்தையும் காக்கிறது.
theological_decisions:
- issue: இரு கூறுகளிலும் עָוֹן என்பதன் பொருள்
  choice: முதல் கூறில் ‘குற்றப்பொறுப்பு’ என்றும் இரண்டாவது கூறில் ‘குற்றம்’ என்றும் மொழிபெயர்த்து, விடுதலைக்கும் சுமத்தலுக்கும் இடையிலான சட்ட-ஒழுக்க முரண்பாட்டைக் காத்தல்
  alternative: இரு இடங்களிலும் ‘அக்கிரமம்’ அல்லது ‘அக்கிரமத்திற்கான தண்டனை’ என்று மொழிபெயர்த்தல்
  rationale: ஒரே எபிரெயச் சொல் இரு கூறுகளிலும் இருப்பதை கருத்தில் கொண்டாலும், அதனுடன் இணையும் வினைச்சொற்களுக்கு ஏற்ப இயல்பான தமிழில் சிறிய சொல் வேறுபாடு தேவைப்படுகிறது. இந்த வடிவம் பெண் குற்றவாளி என நிரூபிக்கப்பட்டால் அவள் தன் குற்றத்திற்கான பொறுப்பையும் விளைவையும் ஏற்கிறாள் என்ற பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்ட-ஒழுக்கத் தொனியை இழக்காத வகையிலும் அமைக்கப்பட்டது. ‘குற்றப்பொறுப்பு’ என்பது முதல் கூறின் விடுதலைப் பொருளைத் தெளிவாக்குகிறது; ‘குற்றத்தைச் சுமப்பாள்’ என்பது மூலத்தின் உருவகத்தையும் உள்ளார்ந்த இருபொருள் வாய்ப்பையும் காக்கிறது.
