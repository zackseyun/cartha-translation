base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: ta
  text: அவர்கள் தாங்கள் செய்த பாவத்தை அறிக்கையிட வேண்டும்; குற்றம் செய்த ஒவ்வொருவரும் தமது குற்றத்திற்கான இழப்பீட்டை[a] முழுவதுமாகத் திருப்பிச் செலுத்தி, அதனுடன் ஐந்தில் ஒரு பங்கைச் சேர்த்து, தாம் யாரிடம் குற்றப்பொறுப்பு உடையவரானாரோ அவருக்குக்[b] கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குற்றத்திற்கான இழப்பீடு” என்பதற்கான எபிரெயச் சொற்றொடரை “செலுத்த வேண்டியதைத் திருப்பிச் செலுத்துதல்” அல்லது “இழப்பீட்டுத் தொகையைச் செலுத்துதல்” என்றும் மொழிபெயர்க்கலாம். இங்கு குற்றநிவாரணப் பலி அல்ல, முதன்மை இழப்பீட்டுத் தொகையே குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் இயல்பாக, “தாம் யாருக்குத் தீங்கிழைத்தாரோ அவருக்குக்” என்றும் கூறலாம். எபிரெயம், குற்றம் செய்தவர் யாரிடத்தில் குற்றப்பொறுப்பு உடையவரானாரோ அவரையே பெறுநராகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: அறிக்கையிட வேண்டும்
  rationale: ஹித்பயேல் வடிவம் தவறை வெளிப்படையாக ஒப்புக்கொள்வதைக் குறிக்கிறது. சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: தாங்கள் செய்த பாவத்தை
  rationale: חַטָּאת இங்கு செய்த பாவம் அல்லது குற்றத்தைக் குறிக்கிறது; עָשׂוּ உடன் வரும் அமைப்பை இயல்பான தமிழில் ‘செய்த பாவம்’ என வழங்குகிறது.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: தமது குற்றத்திற்கான இழப்பீட்டை முழுவதுமாகச் செலுத்தி
  rationale: שׁוב என்பதன் ஹிஃபீல் வடிவம் இங்கு திருப்பிச் செலுத்துதலைக் குறிக்கிறது; אָשָׁם என்பது பலி அல்ல, குற்றத்தால் ஏற்பட்ட செலுத்த வேண்டிய பொறுப்பு அல்லது இழப்பீடு. בְּרֹאשׁוֹ முதன்மைத் தொகையை முழுமையாகச் செலுத்துவதைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: அதனுடன் ஐந்தில் ஒரு பங்கைச் சேர்த்து
  rationale: முதன்மைத் தொகைக்கு மேலாக இருபது விழுக்காடு சேர்க்கப்பட வேண்டும் என்பதை மூலத்தின் உருவகத்துக்கு நெருக்கமாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: தாம் யாருக்கு எதிராகக் குற்றம் செய்தாரோ அவரிடம்
  rationale: குற்றத்தால் பாதிக்கப்பட்டு இழப்பீட்டைப் பெற வேண்டிய நபரை அடையாளப்படுத்துகிறது; எபிரெய மொழியின் குற்றப்பொறுப்பு நுணுக்கத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
- source_word: וְהִתְוַדּוּ … וְהֵשִׁיב
  choice: அவர்கள் … குற்றம் செய்த ஒவ்வொருவரும்
  rationale: எபிரெயத்தில் முதலில் பன்மையும் பின்னர் ஒருமையும் வருவதால், ஒவ்வொரு குற்றவாளிக்கும் தனித்தனியாகப் பொருந்தும் கட்டளை என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இழப்பீட்டுச் சூழலில் אָשָׁם என்பதன் பொருள்
  choice: குற்றத்தால் ஏற்பட்ட பணப்பொறுப்பு அல்லது இழப்பீடு
  alternative: குற்றநிவாரணப் பலி
  rationale: உடனடி சூழல் முதன்மைத் தொகையைத் திருப்பிச் செலுத்துதல், ஐந்தில் ஒரு பங்கைச் சேர்த்தல், பாதிக்கப்பட்டவரிடம் கொடுத்தல் ஆகியவற்றைப் பற்றியது. ஆகவே இவ்வசனத்தில் பலியைக் குறிக்கும் சொல்லைச் சேர்க்காமல், குற்றத்தால் ஏற்பட்ட இழப்பீட்டுப் பொறுப்பாக மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளைக்குரிய கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அவர்கள்’ என்பதிலிருந்து எபிரெயம் ஒருமைக்கு மாறுவதைத் தவறாக ஒற்றுமைப்படுத்தாமல், ‘குற்றம் செய்த ஒவ்வொருவரும்’ என்று வெளிப்படுத்தப்பட்டுள்ளது. ‘ஐந்தில் ஒரு பங்கு’ என்பது மூலத்தின் விகித மொழியைப் பாதுகாக்கிறது.
