  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: ta
  text: பின்பு ஆசாரியன் சாபத்துடன் கூடிய ஆணையின் மூலம் அந்தப் பெண்ணை உறுதிமொழி எடுக்கச் செய்ய வேண்டும்[a]. ஆசாரியன் அவளிடம், “யாவே உன் தொடையை வற்றிப்போகச் செய்து[b], உன் வயிற்றை வீங்கச் செய்யும்போது[c], உன் மக்களிடையே உன்னை ஒரு சாபமாகவும் ஓர் ஆணையாகவும் ஆக்குவாராக,” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாப ஆணையின்கீழ் அவளை ஆணையிடச் செய்ய வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: “தொடை விழுந்துபோக” என்பது எபிரெயச் சொற்றொடரின் நேரடியான வடிவம். இது தொடை வற்றி அல்லது சுருங்கிப்போவதைக் குறிக்கலாம்; இனப்பெருக்க உறுப்புகளை மறைமுகமாகக் குறிப்பிடுவதற்கும் வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “வயிறு” என்பதற்கான எபிரெயச் சொல் சில சூழல்களில் “கருப்பை” என்றும் பொருள்படும். இங்கு கூறப்படும் மருத்துவ அல்லது இனப்பெருக்க விளைவு என்ன என்பது உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: உறுதிசெய்யச் செய்ய வேண்டும்
  rationale: 'שׁבע என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது: ஆசாரியன் அந்தப் பெண்ணை ஆணையிட்டு உறுதிசெய்யச் செய்கிறான். தமிழில் சட்டச் சடங்கின் வலிமையை இயல்பாகத் தெரிவிக்கிறது.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: சாப ஆணையிட்டு
  rationale: ‘ஆணை’ மற்றும் ‘சாபம்’ என்ற இரு கூறுகளையும் சுருக்கமான, இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: ஒரு சாபமாகவும் ஓர் ஆணையாகவும்
  rationale: எபிரெயச் சொற்றொடரின் இரு இணையான பெயர்ச்சொற்களையும் தக்கவைத்து, பிறர் சாபமிடும்போதும் ஆணையிடும்போதும் அவளை எடுத்துக்காட்டாகக் குறிப்பிடும் பின்னணியை மறைக்காமல் விடுகிறது.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: உன் மக்களிடையே
  rationale: சமூகத்தின் நடுவில் நிகழும் பொது விளைவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּתֵת
  choice: செய்யும்போது
  rationale: בְּ உடனான வினையெச்சத்தின் சூழ்நிலை அல்லது காலப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְרֵךְ נֹפֶלֶת
  choice: தொடையை வற்றிப்போகச் செய்து
  rationale: יָרֵךְ என்பதன் அடிப்படை உடலுறுப்பு அர்த்தமான ‘தொடை’ என்பதைத் தக்கவைக்கிறது; נפל இங்கு குறிக்கும் வீழ்ச்சி, சிதைவு அல்லது வற்றுதல் ஆகியவற்றில், தமிழில் புரியக்கூடிய ‘வற்றிப்போதல்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. துல்லியமான உடலியல் விளைவு அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
- source_word: בִּטְנֵךְ צָבָה
  choice: உன் வயிற்றை வீங்கச் செய்யும்போது
  rationale: בֶּטֶן என்பதன் பரந்த உடற்பகுதி அர்த்தத்தை ‘வயிறு’ இயல்பாகக் காட்டுகிறது; צָבָה என்பதன் வீக்கம் அல்லது புடைப்பு பொருளை ‘வீங்க’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: சாபத்தில் கூறப்படும் உடலியல் விளைவை எவ்வளவு குறிப்பாக மொழிபெயர்ப்பது
  choice: ‘தொடை வற்றிப்போக’ என்றும் ‘வயிறு வீங்க’ என்றும் உடல் சார்ந்த உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘கருச்சிதைவு ஏற்பட’ அல்லது ‘கருப்பை செயலிழக்க’ என்று குறிப்பாக்குதல்
  rationale: எபிரெயச் சொற்கள் கடினமானவையும் பலவாறு புரிந்துகொள்ளப்படுபவையும் ஆகும். கருச்சிதைவு, மலட்டுத்தன்மை அல்லது ஒரு குறிப்பிட்ட மருத்துவ நிலை என்று மூலவசனம் வெளிப்படையாகக் கூறாததால், அவற்றில் ஒன்றை முதன்மை உரையில் திணிக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு மற்றும் சட்டத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான ‘சாப ஆணை’ என்ற சேர்க்கை மூலத்தின் இரு கருத்துகளையும் பாதுகாக்கிறது; கடினமான உடலியல் மொழி மிகையாக மருத்துவப்படுத்தப்படாமல் அடிக்குறிப்புகள் மூலம் விளக்கப்பட்டுள்ளது.
