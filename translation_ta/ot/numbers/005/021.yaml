  to: பின்பு ஆசாரியன் சாபத்துடன் கூடிய ஆணையின் மூலம் அந்தப் பெண்ணை உறுதிமொழி எடுக்கச் செய்ய வேண்டும்[a]. ஆசாரியன் அவளிடம், “யாவே உன் தொடையை வற்றிப்போகச் செய்து[b], உன் வயிற்றை வீங்கச் செய்யும்போது[c], உன் மக்களிடையே உன்னை ஒரு சாபமாகவும் ஓர் ஆணையாகவும் ஆக்குவாராக,” என்று சொல்ல வேண்டும்.
  rationale: The revision clarifies the priest’s causative role in administering the oath while preserving the formal relationship between oath and curse. It retains the source order and ambiguity of the bodily curse, uses the established transliteration யாவே, and corrects the explanatory notes so that they are idiomatic and accurately distinguish literal wording from contextual interpretation.
