    issue: Footnote wording and marker placement
    rationale: The wording ‘இன்னும் சொல்லுக்குச் சொல்லாக’ is not idiomatic Tamil for introducing a more literal alternative. The marker should directly follow the phrase it annotates, rather than appear at the end of the preceding clause.
