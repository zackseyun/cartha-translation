base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: ta
  text: சாபத்தைக் கொண்டுவரும் இந்தத் தண்ணீர் உன் உள்ளுறுப்புகளுக்குள்[a] சென்று, உன் வயிறு வீங்கவும் உன் தொடை வற்றிப்போகவும் செய்யட்டும். அப்போது அந்தப் பெண், ‘ஆமென், ஆமென்’ என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, ‘வயிறு வீங்கவும் தொடை விழவும்.’ இந்த எபிரெயச் சொற்றொடரின் பொருள் உறுதியாகத் தெரியவில்லை; இது இனப்பெருக்க உறுப்புகளுக்கு ஏற்படும் துன்பத்தை மறைமுகமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: சென்று ... செய்யட்டும்
  rationale: சாபப் பிரமாணச் சூழலில் வரும் வினைமுற்றின் விருப்பார்த்த/சாப உச்சரிப்பு வலிமையைத் தமிழில் ‘செய்யட்டும்’ வெளிப்படுத்துகிறது; வெறும் எதிர்கால நிகழ்வாக மாற்றவில்லை.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: சாபத்தைக் கொண்டுவரும் இந்தத் தண்ணீர்
  rationale: מְאָרְרִים என்பது தண்ணீர் சாபத்தைச் சுமந்து விளைவிப்பதைக் குறிக்கிறது. எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், தமிழில் ‘தண்ணீர்’ இயல்பாகத் தொகைப்பொருள் ஒருமையாக வழங்கப்படுகிறது.
- source_word: בְּמֵעַיִךְ
  choice: உன் உள்ளுறுப்புகளுக்குள்
  rationale: מֵעֶה குறிக்கும் உடலின் உட்பகுதிகள்/உள் உறுப்புகள் என்ற பொருளை, மிகப் பழமையான அல்லது மருத்துவச் சொல்லாக்கமின்றி உடல்சார்ந்த தெளிவுடன் தருகிறது.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: உன் வயிறு வீங்கவும்
  rationale: בֶּטֶן என்பதன் நேரடியான ‘வயிறு’ என்ற பொருளையும் צבה குறிக்கும் வீக்கத்தையும் காக்கிறது; ‘கருப்பை’ என்று குறிப்பாக்கவில்லை.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: உன் தொடை வற்றிப்போகவும்
  rationale: נפל என்பதன் அடிப்படைப் பொருள் ‘விழுதல்’; ஆனால் இந்தக் கடினமான மரபுத்தொடரில் உடல் சிதைவை இயல்பான தமிழில் ‘வற்றிப்போதல்’ எனத் தருகிறது. יָרֵךְ என்பதற்கான ‘தொடை’ என்ற மறைமுகச் சொல்லைத் தக்கவைக்கிறது.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: அப்போது அந்தப் பெண் ... என்று சொல்ல வேண்டும்
  rationale: சடங்கில் விதிக்கப்பட்ட பதிலை இயல்பான நவீனத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: אָמֵן אָמֵן
  choice: ஆமென், ஆமென்
  rationale: இருமுறை கூறப்படும் உடன்பாட்டு உறுதிமொழியின் வழிபாட்டு வலிமையை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: சாபத்தால் ஏற்படும் உடல் விளைவுகளின் துல்லியமான தன்மை
  choice: ‘வயிறு வீங்கவும் உன் தொடை வற்றிப்போகவும்’ என்று ஒப்பீட்டளவில் நேரடியாகவும் வாசிக்கத்தக்கவாறும் மொழிபெயர்த்தல்
  alternative: ‘கருப்பை சிதையவும் வயிறு வீங்கவும்’ அல்லது இனப்பெருக்க உறுப்புகளை வெளிப்படையாகக் குறிப்பது
  rationale: எபிரெயச் சொற்றொடர் கடினமானதும் மறைமுகமானதும் ஆகும்; அது இனப்பெருக்கத்துடன் தொடர்புடைய துன்பத்தைக் குறிக்கக்கூடும். ஆயினும் கருச்சிதைவு, மலட்டுத்தன்மை அல்லது குறிப்பிட்ட மருத்துவ நிலை எதையும் இவ்வசனம் ஐயமின்றி கூறாததால் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சடங்கு மற்றும் சாபப் பிரமாணத்திற்கேற்ற கண்ணியமான நடை. கடினமான எபிரெய மறைமுகச் சொல்லை விளக்கமாகத் தீர்மானிக்காமல், முதன்மை உரையில் உடல்சார்ந்த உருவகத்தையும் அடிக்குறிப்பில் அதன் தெளிவின்மையையும் காக்கிறது.
