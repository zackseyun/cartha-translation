  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: ta
  text: பின்பு ஆசாரியன் இந்தச் சாபங்களைச் சுருளில் எழுதி, அவற்றைக் கசப்பான தண்ணீருக்குள் கழுவிவிட வேண்டும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சத்தியச் சாபங்களை.’ எபிரெயச் சொல் சத்தியத்துடன் தொடர்புடைய சாபத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவற்றைத் துடைத்து அழிக்க வேண்டும்’ / ‘அவற்றை அழித்துவிட வேண்டும்.’ எபிரெய வினைச்சொல் எழுதப்பட்ட சொற்களைத் துடைத்து அகற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: பின்பு ... எழுதி ... வேண்டும்
  rationale: சடங்குமுறை அறிவுறுத்தலின் தொடர்ச்சியைத் தெரிவிக்கும் இணைப்புடன் வந்த வினை; தமிழில் ‘பின்பு’ மற்றும் ‘வேண்டும்’ என்பவை அதன் தொடர்நிலை அறிவுறுத்தல் வலிமையை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: இந்தச் சாபங்களை
  rationale: אָלָה என்பது சத்தியத்தோடு தொடர்புடைய சாபத்தைக் குறிக்கக்கூடும்; இச்சூழலில் பெண்ணின்மேல் உரைக்கப்பட்ட தண்டனைச் சாபங்களே எழுதப்படுவதால், தெளிவான முதன்மை மொழிபெயர்ப்பாக ‘சாபங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டுச் சடங்கில் பணியாற்றும் நபரைக் குறிக்கும் வழக்கமான, வாசகர்களுக்கு நன்கு புரியும் தமிழ் சொல்.
- source_word: בַּסֵּפֶר
  choice: சுருளில்
  rationale: סֵפֶר இங்கு நவீன கட்டுப் புத்தகத்தை அல்ல, எழுதப் பயன்பட்ட ஆவணம் அல்லது சுருளைக் குறிக்கிறது; பழங்காலப் பொருட்சூழலுக்கு ‘சுருள்’ பொருத்தமானது.
- source_word: וּמָחָה
  choice: கழுவிவிட வேண்டும்
  rationale: מחה என்பதன் அடிப்படை உணர்வு துடைத்து அகற்றுதல் அல்லது அழித்தல். எழுதிய சொற்கள் தண்ணீருக்குள் அகற்றப்படும் இச்சடங்கில், ‘கழுவிவிடுதல்’ செயலை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: אֶל
  choice: தண்ணீருக்குள்
  rationale: எழுத்துகள் திரவத்திற்குள் மாற்றப்படுகின்ற திசையை אֶל குறிக்கிறது; தமிழில் ‘-க்குள்’ இந்த நகர்வைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מֵי הַמָּרִים
  choice: கசப்பான தண்ணீர்
  rationale: சொற்றொடர் நேரடியாக ‘கசப்பின் தண்ணீர்/கசப்பான தண்ணீர்’ எனப் பொருள்படும்; சடங்கில் பயன்படுத்தப்படும் திரவத்தை நவீன தமிழில் இயல்பாகக் குறிக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
