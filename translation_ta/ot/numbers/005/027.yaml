base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: ta
  text: அவன் அவளுக்கு அந்தத் தண்ணீரைக் குடிக்கக் கொடுக்கும்போது, அவள் தன்னைத் தீட்டுப்படுத்தி தன் கணவனுக்கு நம்பிக்கைத் துரோகம் செய்திருந்தால், சாபத்தைக் கொண்டுவரும் அந்தத் தண்ணீர் அவளுக்குள் சென்று கசப்பை விளைவிக்கும்[a]; அவளுடைய வயிறு வீங்கும், அவளுடைய தொடை சிதைந்துபோகும்[b]. அந்தப் பெண் தன் மக்களிடையே சாபமாக மாறுவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்தைக் கொண்டுவரும் தண்ணீர் கசப்பான தண்ணீராக அவளுக்குள் செல்லும்.” “கசப்புக்காக” என நேரடியாகப் பொருள்படும் எபிரெயத் தொடர் சிரமமானது; அது தண்ணீரின் தன்மையையோ அதன் கசப்பான விளைவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவளுடைய தொடை விழும்.” இது இனப்பெருக்க உறுப்புகளைப் பாதிக்கும் கடுமையான உடல் பாதிப்பைக் குறிக்கும் இடக்கரடக்கலாக இருக்கலாம்; ஆனால் அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: அவன் அவளுக்கு அந்தத் தண்ணீரைக் குடிக்கக் கொடுக்கும்போது
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கச் செய்தல்/குடிக்கக் கொடுத்தல்’ எனும் காரணவினைப் பொருளைக் கொண்டது. தமிழில் இயல்பான காலவாக்கியமாக அமைக்கப்பட்டது.
- source_word: נִטְמְאָה
  choice: அவள் தன்னைத் தீட்டுப்படுத்திக்கொண்டு
  rationale: இச்சூழலில் ஒழுக்க மற்றும் சடங்குத் தீட்டு ஆகிய இரு நிழற்பொருள்களையும் ‘தீட்டுப்படுத்திக்கொண்டு’ தக்கவைக்கிறது.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: தன் கணவனுக்கு நம்பிக்கைத் துரோகம் செய்திருந்தால்
  rationale: מעל என்னும் வேர்ச்சொல்லின் மீளுரைப் பயன்பாடு கடுமையான நம்பிக்கை மீறலைக் குறிக்கிறது; בְּאִישָׁהּ இங்கு கணவனுக்கு எதிரான துரோகத்தைக் குறிக்கிறது.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: சாபத்தைக் கொண்டுவரும் அந்தத் தண்ணீர்
  rationale: ארר பங்கேற்புவடிவத்தின் சாபத்தைச் செயல்படுத்தும் அல்லது சுமந்துவரும் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְמָרִים
  choice: கசப்பான துன்பத்தை உண்டாக்கும்
  rationale: சிரமமான இத்தொடரை விளைவைக் குறிக்கும் பயன்பாடாக வாசிக்கிறது; அதன் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: அவளுடைய வயிறு வீங்கும்
  rationale: בטן என்பதன் நேரடியான பொருள் வயிறு/அடிவயிறு; ‘கருப்பை’ என்று மிகையாகக் குறிப்பாக்காமல் உள்ளது.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: அவளுடைய தொடை சிதைந்துபோகும்
  rationale: יָרֵךְ என்பதன் நேரடிப் பொருளான ‘தொடை’ தக்கவைக்கப்படுகிறது; ‘விழும்’ என்ற தெளிவில்லாத நேரடி மொழிபெயர்ப்புக்குப் பதிலாக உடல் அழிவைக் குறிக்கும் இயல்பான வினை பயன்படுத்தப்படுகிறது.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: அந்தப் பெண் தன் மக்களிடையே சாபத்தின் எடுத்துக்காட்டாக இருப்பாள்
  rationale: அவள் சமூகத்திற்குள் சாபத்துக்குரிய மாதிரியாக அல்லது சாப மொழியின் பொருளாக மாறுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சோதனைச் சடங்கில் ஏற்படும் உடல் பாதிப்பை ஒரு குறிப்பிட்ட மருத்துவ அல்லது இனப்பெருக்க விளக்கமாகத் தீர்மானித்துவிடாமல் மொழிபெயர்த்தல்
  choice: ‘வயிறு வீங்கும், தொடை சிதைந்துபோகும்’ என்று எபிரெயச் சொற்களுக்கு அருகில் நிற்றல்
  alternative: ‘கருப்பை கருச்சிதைவடையும்’, ‘பிறப்புறுப்பு சுருங்கும்’ அல்லது ‘இடுப்பு விழும்’
  rationale: எபிரெய மொழி உடல் சார்ந்த தெளிவான படிமங்களைப் பயன்படுத்தினாலும், ‘தொடை விழுதல்’ என்பதன் துல்லியமான உடலியல் குறிப்பு விவாதத்திற்குரியது. ஆகவே ஒரு குறிப்பிட்ட இனப்பெருக்க விளைவை முதன்மை உரையில் உறுதிப்படுத்தாமல், தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. சடங்கு மற்றும் ஒழுக்கத் தீட்டின் இணைந்த நிழற்பொருள் பாதுகாக்கப்பட்டுள்ளது; தெளிவில்லாத உடலியல் விளைவு குறிப்பாக்கப்படவில்லை.
