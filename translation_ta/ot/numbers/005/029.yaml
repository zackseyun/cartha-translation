- from: 'பொறாமைகள் குறித்த சட்டம் இதுவே: ஒரு மனைவி தன் கணவனுக்குக் கீழ்ப்பட்ட மணவுறவிலிருந்து விலகி[a], தீட்டுப்பட்டால்,'
  to: 'பொறாமைகள் குறித்த சட்டம் இதுவே: ஒரு மனைவி தன் கணவனுக்கு உட்பட்டிருக்கையில் வழிவிலகி[a] தீட்டுப்படும்போது,'
  rationale: 'The revision restores the Hebrew clause structure: the wife goes astray while under her husband and becomes defiled. It avoids turning the idiom into an explicit statement that she leaves the marital relationship, while retaining the source’s metaphor of straying and its deliberately non-specific impurity terminology.'
