  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: ta
  text: 'பொறாமைகள் குறித்த சட்டம் இதுவே: ஒரு மனைவி தன் கணவனுக்கு உட்பட்டிருக்கையில் வழிவிலகி[a] தீட்டுப்படும்போது,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல், வழியிலிருந்து ‘விலகுதல்’ அல்லது ‘தவறிச் செல்லுதல்’ என்ற உருவகத்தைக் கொண்டது; இங்கு அது மணவுறவில் விசுவாசம் தவறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תּוֹרַת הַקְּנָאֹת
  choice: பொறாமைகள் குறித்த சட்டம் இதுவே
  rationale: தோரா என்ற சட்ட/அறிவுறுத்தல் சொல்லை இச்சட்டத் தொகுப்பின் சூழலில் ‘சட்டம்’ எனவும், எபிரெயப் பன்மையான கெனாஓத் என்பதை தொழில்நுட்பத் தலைப்பாகப் பன்மையிலேயே வைத்தும் மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: ஒரு மனைவி ... விலகி
  rationale: אִשָּׁה இங்கு அடுத்துவரும் ‘அவளுடைய கணவன்’ என்பதால் ‘மனைவி’ எனப் பொருள்படும். שׂטה என்பதன் வழிவிலகும் உருவகத்தை ‘விலகி’ காக்கிறது; ‘விபசாரம் செய்தால்’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: תַּחַת אִישָׁהּ
  choice: தன் கணவனுக்குக் கீழ்ப்பட்ட மணவுறவிலிருந்து
  rationale: சொல்லளவில் ‘தன் கணவனுக்குக் கீழ்’ என்றாலும், இங்கு கணவனுடன் உள்ள திருமணப் பிணைப்பைக் குறிக்கும் மரபுத்தொடர். இயல்பான தமிழில் பொருளைத் தெரிவிக்க ‘மணவுறவு’ சேர்க்கப்பட்டுள்ளது; ‘கீழ்ப்பட்ட’ என்பது மூல உருவகத்தையும் காக்கிறது.
- source_word: וְנִטְמָאָה
  choice: தீட்டுப்பட்டால்
  rationale: טמא என்பதன் தீட்டு மொழியைப் பேணுகிறது; இதை வெறும் சடங்குத் தீட்டாகவோ, நேரடியாக ‘விபசாரம்’ என்றோ சுருக்கவில்லை.
theological_decisions:
- issue: திருமண முறைகேட்டின் சூழலில் טמא குறிக்கும் தீட்டின் தன்மை
  choice: தீட்டுப்பட்டால்
  alternative: அசுத்தமானால்; விபசாரம் செய்தால்
  rationale: சூழல் பாலியல் விசுவாசமின்மையைச் சுட்டினாலும், எபிரெயம் வெளிப்படையான ‘விபசாரம்’ என்ற சொல்லுக்குப் பதில் தீட்டு மொழியைப் பயன்படுத்துகிறது. அந்தத் தெய்வவியல் நெருக்கடியைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: הַקְּנָאֹת என்பதன் பன்மை
  choice: பொறாமைகள்
  alternative: பொறாமை; சந்தேகப் பொறாமை
  rationale: மூலத்தில் பன்மை வெளிப்படையாக உள்ளது; இது இந்நடைமுறைக்கான தொழில்நுட்பத் தலைப்பாக இருக்கலாம். தமிழ் இயல்பில் சற்றுக் கடினமாக இருந்தாலும் மூல வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயப் பன்மையும் தீட்டு மொழியும் பாதுகாக்கப்பட்டுள்ளன; தெளிவுக்காக மரபுத்தொடரில் ‘மணவுறவு’ வெளிப்படுத்தப்பட்டுள்ளது.
