revisions:
- from: இஸ்ரவேலின் மகன்களுடைய[a] பரிசுத்தக் காணிக்கைகள்[b] அனைத்திலிருந்தும் அவர்கள் ஆசாரியரிடம் கொண்டுவரும்[c] ஒவ்வொரு பங்கும் அவருக்கே உரியதாகும்.
  to: இஸ்ரவேலின் மகன்கள்[a] பரிசுத்தப் பொருள்கள்[b] அனைத்திலிருந்தும் ஆசாரியரிடம் கொண்டுவரும்[c] ஒவ்வொரு காணிக்கையும் அவருக்குரியது.
  rationale: The revision translates תְּרוּמָה as “காணிக்கை,” rather than “பங்கு,” and translates קָדְשֵׁי separately as “பரிசுத்தப் பொருள்கள்.” This preserves the Hebrew’s distinction without adding an interpretive claim that the contribution is merely a priestly share. The relative clause retains the sacrificial-presenting nuance of יַקְרִיבוּ, and “அவருக்குரியது” faithfully expresses the legal force of לוֹ יִהְיֶה without unwarranted emphasis.
