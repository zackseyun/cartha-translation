  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] பரிசுத்தப் பொருள்கள்[b] அனைத்திலிருந்தும் ஆசாரியரிடம் கொண்டுவரும்[c] ஒவ்வொரு காணிக்கையும் அவருக்குரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்.” எபிரெய மூலத்தில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பரிசுத்தக் காணிக்கைகள்” அல்லது “புனித அர்ப்பணிப்புகள்.”
    reason: lexical_alternative
  - marker: c
    text: பலியிடுதல் சார்ந்த சூழலில் இந்த வினைச்சொல்லை “சமர்ப்பிக்கும்” என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், “அருகில் கொண்டுவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: பங்கு
  rationale: அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பொருளிலிருந்து ஆசாரியருக்குரியதாக ஒதுக்கப்படும் காணிக்கை அல்லது பங்கை இச்சொல் குறிக்கிறது. சூழலில் ‘பங்கு’ என்பது இயல்பாகவும் சட்டரீதியான உரிமையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: קָדְשֵׁי
  choice: பரிசுத்தக் காணிக்கைகள்
  rationale: கடவுளுக்கென்று அர்ப்பணிக்கப்பட்ட பொருள்கள் அல்லது காணிக்கைகளை இங்குள்ள பன்மை வடிவம் குறிக்கிறது. ‘பரிசுத்தக் காணிக்கைகள்’ என்பது சூழலுக்கேற்ற தெளிவான தமிழ்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் குடும்ப உறவைக் குறிக்கும் ஆண்பால் சொல்லமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது; வாசகருக்கான இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַקְרִיבוּ
  choice: கொண்டுவரும்
  rationale: קרב என்பதன் Hiphil வடிவம் பலியிடும் சூழலில் ‘அருகில் கொண்டுவருதல்’ அல்லது ‘சமர்ப்பித்தல்’ எனப் பொருள்படும். தமிழில் ‘ஆசாரியரிடம் கொண்டுவரும்’ என்பது இலக்கைத் தெளிவுபடுத்தி இயல்பாக ஒலிக்கிறது.
- source_word: לַכֹּהֵן
  choice: ஆசாரியரிடம்
  rationale: காணிக்கை யாரிடம் கொண்டுவரப்படுகிறது என்பதை முன்னிலைச் சொல் குறிக்கிறது; அடுத்த கூறு அது அவருக்குரியது என்பதைத் தனியாக உறுதிப்படுத்துகிறது.
- source_word: לוֹ יִהְיֶה
  choice: அவருக்கே உரியதாகும்
  rationale: இந்த எபிரெய மரபுத்தொடர் சட்டரீதியான உடைமையை வெளிப்படுத்துகிறது. ‘அவருக்கே உரியதாகும்’ என்பது வலியுறுத்தலையும் உரிமையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் בְנֵי יִשְׂרָאֵל என்ற பெயரடை
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தில் உள்ள ஆண்பால் குடும்பச் சொல்லை பிரதான உரையில் பாதுகாக்கிறது; அது முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது. இதனால் மூலத்தின் வடிவம் மறைக்கப்படுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, தெளிவான நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்,’ ‘பரிசுத்தக் காணிக்கைகள்’ ஆகியவை வேதாகமச் சூழலைத் தக்கவைத்தாலும் சாதாரண வாசகருக்குப் புரியும் சொற்கள். எபிரெய வாக்கியத்தின் சட்டரீதியான முடிவு ‘அவருக்கே உரியதாகும்’ எனச் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளது.
