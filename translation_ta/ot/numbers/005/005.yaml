  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் வழக்கமான தெய்வீக உரை அறிமுகப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; தொடக்க וַ புதிய உரைப் பகுதியைத் தொடர்ச்சியாக அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சின் பெறுநரைக் குறிக்கும் אֶל என்பதற்கு இயல்பான தமிழ் வேற்றுமை வடிவம்; மֹשֶׁה என்பதன் நிலையான தமிழ் வடிவம் ‘மோசே’.
- source_word: לֵאמֹר
  choice: 'சொன்னார்:'
  rationale: பின்வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை தமிழில் இயல்பாகக் காட்டுகிறது; முக்காற்புள்ளி அடுத்த வசனத்தில் உரை தொடர்வதை உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பட்ட திருப்பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான வேதாகம உரைநடை. ‘பேசிச் சொன்னார்’ என்பது וַיְדַבֵּר ... לֵאמֹר என்ற எபிரெய உரை அறிமுகச் சூத்திரத்தின் இரு கூறுகளையும் இயல்பாகத் தக்கவைக்கிறது.
