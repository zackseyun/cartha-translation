base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: ta
  text: ஆனால், அந்த மனிதனிடமிருந்து குற்ற இழப்பீட்டைத் திரும்பப் பெறுவதற்கு உறவினரான மீட்பர் யாரும் இல்லையென்றால்[a], ஆண்டவருக்குத் திருப்பிக் கொடுக்கப்படும் அந்தக் குற்ற இழப்பீடு ஆசாரியருக்குரியது[b]; அவனுக்காக அதனால் பாவநிவிர்த்தி செய்யப்படும் பாவநிவிர்த்திக்கான ஆட்டுக்கடாவும் அதோடு சேரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பர்’ அல்லது ‘நெருங்கிய உறவினர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான גֹּאֵל, மீட்பு அல்லது இழப்பீடு தொடர்பான காரியங்களில் சட்டப்பூர்வப் பொறுப்புள்ள குடும்ப உறுப்பினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல்லான אָשָׁם, குற்றத்திற்காகச் செலுத்தப்படும் இழப்பீட்டை அல்லது ஈட்டுத்தொகையைக் குறிக்கிறது; ஆட்டுக்கடாவைக் குறிக்கவில்லை. ஆட்டுக்கடா இதற்குப் பிறகு தனியாகக் குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: உறவுமுறை மீட்பர்
  rationale: குடும்ப உறவினராக இருந்து மீட்பு அல்லது இழப்பீடு தொடர்பான சட்டப்பூர்வப் பொறுப்பை ஏற்கும் நபரை இச்சொல் குறிக்கிறது. ‘உறவுமுறை மீட்பர்’ என்பது குடும்பத் தொடர்பையும் சட்டப் பணியையும் இணைத்துக் காட்டுகிறது.
- source_word: הָאָשָׁם
  choice: குற்றத்திற்கான இழப்பீடு
  rationale: இங்கு இது பலியையே குறிக்காமல், தவறுக்காகச் செலுத்த வேண்டிய ஈட்டுத்தொகையைக் குறிக்கிறது; ஆட்டுக்கடா பின்னர் தனியாகக் குறிப்பிடப்படுகிறது.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: திருப்பிச் செலுத்தப்படும் அந்தக் குற்ற இழப்பீடு
  rationale: שוב என்பதன் செயப்பாட்டு வடிவம் இழப்பீடு மீளச் செலுத்தப்படுவதை வலியுறுத்துகிறது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
  rationale: יהוה என்ற இறைப்பெயருக்கான மரியாதைமிக்க, நவீனத் தமிழில் இயல்பான பிரதிநிதியாக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַכֹּהֵן
  choice: ஆசாரியருக்குச் சொந்தமாகும்
  rationale: எபிரெய இணைப்பில் மறைந்துள்ள உடைமைப் பயனிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִלְּבַד
  choice: மேலாக
  rationale: இழப்பீடும் ஆட்டுக்கடாவும் தனித்தனியானவை என்றும், ஆட்டுக்கடா இழப்பீட்டுக்கு கூடுதலாக வழங்கப்படுவது என்றும் காட்டுகிறது.
- source_word: אֵיל הַכִּפֻּרִים
  choice: பாவநிவிர்த்திக்கான ஆட்டுக்கடா
  rationale: ஆட்டுக்கடாவின் பலிசார் நோக்கத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்யப் பயன்படுத்தப்படும்
  rationale: ஆட்டுக்கடா பாவநிவிர்த்தியின் கருவி என்பதைப் பாதுகாக்கிறது; எபிரெயத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத செய்பவரை தமிழிலும் சேர்க்கவில்லை.
- source_word: לָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெயத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இழப்பீட்டுக்கும் பலிக்கும் உள்ள உறவு
  choice: பணமாகவோ பொருளாகவோ செலுத்தப்படும் குற்ற இழப்பீட்டையும் பாவநிவிர்த்திக்கான ஆட்டுக்கடாவையும் தனித்தனியாகக் காட்டுதல்
  alternative: குற்ற இழப்பீட்டையே ஒரு பலியாகப் புரிந்துகொள்ளுதல்
  rationale: מִלְּבַד (‘மேலாக’) என்ற சொல் இழப்பீட்டிலிருந்து ஆட்டுக்கடாவைத் தனியாகக் காட்டுகிறது; சட்டரீதியான ஈடுசெய்தலையும் பலிசார் பாவநிவிர்த்தியையும் ஒன்றாகக் கலக்காமல் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: இறைப்பெயரின் பாரம்பரிய மரியாதைமிக்க பிரதிநிதித்துவத்தை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் சட்டரீதியான துல்லியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறவுமுறை மீட்பர்’ தொழில்நுட்பத் தன்மை கொண்டதால் அடிக்குறிப்பில் மாற்றுச் சொற்கள் தரப்பட்டுள்ளன; ‘ஆசாரியர்’ மற்றும் ‘பாவநிவிர்த்தி’ பழைய ஏற்பாட்டுச் சூழலுக்கு பரவலாகப் புரியக்கூடிய சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
