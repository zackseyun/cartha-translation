base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: ta
  text: 'அப்பொழுது ஆசாரியன் அவளைச் சத்தியம் செய்யவைத்து, அந்தப் பெண்ணிடம் இவ்வாறு சொல்ல வேண்டும்: “எந்த ஆணும் உன்னுடன் உடலுறவு கொள்ளாதிருந்தால், நீ உன் கணவனோடு திருமண உறவில் இருக்கையில் தீட்டில் வழிதவறிச் செல்லாதிருந்தால், சாபத்தை வரவழைக்கும் இந்தக் கசப்பான நீரிலிருந்து விடுபட்டவளாய் இரு.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்தை வரவழைக்கும் இந்தக் கசப்பான நீரிலிருந்து குற்றமற்றவளாய் இரு.”
    reason: הִנָּקִי என்பது இச்சூழலில் சாபவிளைவிலிருந்து விடுதலை அல்லது குற்றமின்மையைக் குறிக்கலாம்.
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: ஆணையிடச் செய்து
  rationale: ஹிஃபில் வடிவத்தின் பிறவினைப் பொருளைத் தக்கவைத்து, ஒருவரை ஆணையிடச் செய்வதைக் குறிக்கும் இயல்பான சட்டநடைத் தமிழ்.
- source_word: וְאָמַר
  choice: சொல்ல வேண்டும்
  rationale: சடங்கு சார்ந்த சட்ட நடைமுறையின் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: எந்த ஆணும் உன்னோடு உடலுறவு கொள்ளாமலும்
  rationale: שׁכב இங்கு பாலுறவைக் குறிக்கும் மரியாதையான மறைமுகச் சொல்; நவீன தமிழில் தெளிவுக்காக அதன் பொருள் கண்ணியமாக வெளிப்படுத்தப்படுகிறது.
- source_word: שָׂטִית
  choice: வழிவிலகிப் போகாமலும்
  rationale: விலகுதல் அல்லது தவறிச் செல்லுதல் என்ற உருவகத்தைத் தக்கவைத்து, விபசாரம் என்று தேவைக்கு மீறி குறிப்பாக்குவதைத் தவிர்க்கிறது.
- source_word: טֻמְאָה
  choice: தீட்டுக்குள்
  rationale: சடங்கு மற்றும் ஒழுக்கம் ஆகிய இரு பரிமாணங்களையும் உடைய தூய்மையின்மைச் சொல்லைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: תַּחַת אִישֵׁךְ
  choice: உன் கணவனுக்குக் கீழ்ப்பட்டிருக்கையில்
  rationale: எபிரெயச் சொற்றொடரின் ‘கணவனின் கீழ்’ என்ற வடிவத்தையும், அது குறிக்கும் திருமண உறவுநிலையையும் தக்கவைக்கிறது.
- source_word: הִנָּקִי
  choice: உனக்குத் தீங்கு நேராதிருக்கட்டும்
  rationale: நீரின் சாப விளைவிலிருந்து விடுபட்டிருத்தல் என்ற நடைமுறைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִמֵּי הַמָּרִים
  choice: இந்தக் கசப்பான நீரினால்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும் நீரைக் கூட்டுப்பொருளாக ஒருமையில் வழங்குவது தமிழில் இயல்பு.
- source_word: הַמְאָרֲרִים
  choice: சாபத்தை வரவழைக்கும்
  rationale: நீர் சாப விளைவை ஏற்படுத்துவதாகக் காட்டும் வினையெச்சத்தின் செயற்பொருளைத் தக்கவைக்கிறது.
- source_word: הָאֵלֶּה
  choice: இந்த
  rationale: தமிழில் கூட்டுப்பொருளான ‘நீர்’ என்பதோடு இயல்பாக ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: பெண்ணின் குற்றத்தைக் குறிக்கும் மொழியின் தன்மை
  choice: பாலியல் தொடர்பையும், வழிவிலகுதலையும், தீட்டையும் எபிரெயச் சொல்லாட்சிக்கேற்ப தனித்தனியாகக் காட்டுதல்
  alternative: ‘விபசாரம் செய்திருந்தால்’ என்று நேரடியாகக் குறிப்பாக்குதல்
  rationale: சூழல் திருமணத் துரோகத்தைப் பற்றியதாக இருந்தாலும், மூலவசனம் அதை ‘உடலுறவு கொள்ளுதல்’, ‘வழிவிலகுதல்’, ‘தீட்டு’ என்ற சொற்களால் கூறுகிறது; அந்த சட்ட-சடங்கு இறுக்கத்தை மொழிபெயர்ப்பு காக்கிறது.
- issue: நீரின் விளைவு
  choice: ‘சாபத்தை வரவழைக்கும்’ என்று வழங்குதல்
  alternative: ‘சாபமுண்டாக்குகிற கசப்பான நீர்’
  rationale: מְאָרֲרִים என்ற வினையெச்சம் நீர் சாபத்தைச் செயல்படுத்துவதுடன் தொடர்புடையதைக் காட்டுகிறது; அதன் துல்லியமான செயல்முறையை வசனம் கூறாததால் அதற்கு மேல் விளக்கப்படவில்லை.
- issue: הִנָּקִי என்பதன் பொருள்
  choice: சாபநீரால் தீங்கு நேராமல் விடுபடுதல்
  alternative: ‘இந்தக் கசப்பான நீரிலிருந்து குற்றமற்றவளாய் இரு’
  rationale: இச்சொல் குற்றமின்மை அல்லது விடுதலை என இருவகை நிழற்பொருள் தரலாம். சூழலில் சாப விளைவிலிருந்து விடுபடுதல் முதன்மையாகத் தரப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவு குறித்த மொழி தெளிவாகவும் மரியாதையாகவும் உள்ளது. ‘தீட்டு’, ‘சாபம்’, ‘ஆணையிடுதல்’ போன்ற வேதாகமச் சூழலுக்குரிய சொற்கள் சாதாரண வாசகரும் புரிந்துகொள்ளும் வகையில் வைக்கப்பட்டுள்ளன.
