source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் அவ்வாறே செய்தார்கள்; அவர்களை முகாமுக்கு வெளியே அனுப்பினார்கள். யாவே மோசேயிடம் சொன்னபடியே இஸ்ரவேல் மக்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அப்படியே செய்து
  rationale: முந்தைய கட்டளைக்குக் கீழ்ப்படிந்து அதன்படியே செயல்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தருகிறது.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: அவர்களை ... அனுப்பினார்கள்
  rationale: שׁלח இச்சூழலில் குறிப்பிட்டவர்களை முகாமிலிருந்து அகற்றி வெளியே அனுப்புவதைக் குறிக்கிறது; இலக்கிடச் சொற்றொடர் அந்த நீக்கத்தின் பொருளைத் தெளிவாக்குகிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இடவியல் விலக்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: யாவே முன்பு கூறிய கட்டளைக்கு முற்றிலும் ஏற்பச் செய்தார்கள் என்ற ஒப்புமை மற்றும் இணக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כֵּן עָשׂוּ
  choice: செய்தார்கள்
  rationale: வசன முடிவிலுள்ள கீழ்ப்படிதலை வலியுறுத்தும் எபிரெய மறுபதிப்பை, ‘சொன்னபடியே ... செய்தார்கள்’ என்ற தமிழ்க் கட்டமைப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் தொடக்கமும் முடிவும் வலியுறுத்தும் கீழ்ப்படிதலைத் தேவையற்ற கடினத்தன்மையின்றிப் பாதுகாக்கிறது.
