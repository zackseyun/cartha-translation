source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: ta
  text: அப்பொழுது மோசே, யாவேயின் வாக்கின்படி[a] இஸ்ரவேல் மக்களுக்குக் கட்டளையிட்டு, “யோசேப்பின் சந்ததியரின் கோத்திரத்தார் கூறுவது சரியே[b]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், சொல்லடியாக, “யாவேயின் வாயின்படி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யோசேப்பின் சந்ததியரின் கோத்திரத்தார் சரியாகப் பேசுகிறார்கள்”; “சரி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பதன் அதிகாரப்பூர்வமான கட்டளையிடும் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மரபுத்தொடரின் பொருளை பாலினத்தால் தேவையின்றிக் கட்டுப்படுத்தாமல், நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யெகோவாவின் வாக்கின்படி
  rationale: சொல்லடியாக ‘யெகோவாவின் வாயின்படி’ என்றாலும், தெய்வீக ஆணை அல்லது உரையை இயல்பாகவும் நெருக்கமாகவும் எடுத்துரைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்புப் பெயரால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள தெய்வீகத் திருப்பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாகக் கொண்டுவருகிறது.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: யோசேப்பின் சந்ததியாருடைய கோத்திரத்தினர்
  rationale: מַטֵּה என்பதைக் கோத்திரம் என்றும், בְנֵי יוֹסֵף என்பதைக் குடும்ப வழிவந்த சந்ததியார் என்றும் சூழலுக்கேற்ற தெளிவான தமிழில் வழங்குகிறது.
- source_word: כֵּן ... דֹּבְרִים
  choice: சொல்வது சரியே
  rationale: דֹּבְרִים என்பதிலுள்ள பேசுதல் என்ற வினைக் கருத்தையும் כֵּן என்பதிலுள்ள சரியென அங்கீகரிக்கும் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
- issue: யோசேப்பின் கோத்திரத்தாரின் கூற்றை அங்கீகரிக்கும் விதம்
  choice: சொல்வது சரியே
  alternative: அவர்கள் சரியானவர்கள் / அவர்கள் சரியாகப் பேசுகிறார்கள்
  rationale: அங்கீகாரம் நபர்களைப் பொதுவாகப் பற்றியது அல்ல, அவர்கள் முன்வைத்த கூற்றைப் பற்றியது என்பதைத் தெளிவாக்கி, பேசுதல் என்ற மூல வினையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். ‘இஸ்ரவேல் மக்கள்’ என்பது பொதுவாசகருக்கு இயல்பானது; ‘கோத்திரத்தினர்’ சூழலின் சமூக அமைப்பைத் தெளிவாக்குகிறது. நேர்கூற்றில் ‘சொல்வது சரியே’ என்பது மூலத்தின் சொற்பொருளையும் தமிழின் இயல்பையும் சமநிலைப்படுத்துகிறது.
