revisions:
- from: யோசேப்பின் மகனான மனாசேயின் சந்ததியாருடைய குலங்களைச் சேர்ந்தவர்களுக்கு அவர்கள் மனைவிகளானார்கள்[a]. அவர்களுடைய உரிமைச்சொத்து, அவர்களுடைய தந்தையின் குலம் சேர்ந்த கோத்திரத்திலேயே இருந்தது.
  to: யோசேப்பின் மகனான மனாசேயின் மகன்களின் குலங்களைச் சேர்ந்த ஆண்களுக்கு அவர்கள் மனைவிகளானார்கள்[a]. அவர்களுடைய நிலப்பங்கு, அவர்களுடைய தந்தைவழிக் குலத்தைச் சேர்ந்த கோத்திரத்தோடு தொடர்ந்து இருந்தது.
  rationale: The revision retains the source’s clan/tribe distinction, restores the formal “sons of Manasseh” wording, and supplies an explicit Tamil referent for those to whom the women became wives. “நிலப்பங்கு” makes the legal-land sense of נַחֲלָה clear, while “தொடர்ந்து இருந்தது” naturally communicates the contextual force of the verb without overstating it.
