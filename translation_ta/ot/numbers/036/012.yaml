  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: ta
  text: யோசேப்பின் மகனான மனாசேயின் மகன்களின் குலங்களைச் சேர்ந்த ஆண்களுக்கு அவர்கள் மனைவிகளானார்கள்[a]. அவர்களுடைய நிலப்பங்கு, அவர்களுடைய தந்தைவழிக் குலத்தைச் சேர்ந்த கோத்திரத்தோடு தொடர்ந்து இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசேப்பின் மகனான மனாசேயின் மகன்களின் குடும்பங்களைச் சேர்ந்த ஆண்களுக்கு அவர்கள் மனைவிகளானார்கள்.” இங்குள்ள எபிரேய உறவுமுறைச் சொல் “குலங்கள்” என்றும் “குடும்பங்கள்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: குலங்களைச் சேர்ந்தவர்களுக்கு
  rationale: מִן மூலத்தையோ ஒரு குழுவிலிருந்து தேர்ந்தெடுக்கப்படுதலையோ குறிக்கிறது; இங்கு பெண்கள் மனாசேயின் குலங்களுக்குள்ளேயே கணவர்களைத் தேர்ந்தெடுத்தனர். ‘குலங்கள்’ என்பது இஸ்ரவேலின் உட்கோத்திர உறவமைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: யோசேப்பின் மகனான மனாசேயின் சந்ததியார்
  rationale: בְּנֵי இங்கு மனாசேயின் நேரடி மகன்களை மட்டும் அல்லாமல் அவருடைய வழிவந்தோரையும் குறிக்கிறது; ஆகவே நவீன தமிழில் ‘சந்ததியார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது. மனாசே யோசேப்பின் மகன் என்ற வம்சத் தொடர்பும் பாதுகாக்கப்படுகிறது.
- source_word: הָיוּ לְנָשִׁים
  choice: அவர்கள் மனைவிகளானார்கள்
  rationale: ‘மனைவிகளாக ஆனார்கள்’ என்ற எபிரேய முன்னிலை அமைப்பையும் பெண்களே இலக்கண எழுவாய் என்பதையும் இது காக்கிறது.
- source_word: נַחֲלָתָן
  choice: அவர்களுடைய உரிமைச்சொத்து
  rationale: எண்ணாகமத்தின் இச்சட்டச் சூழலில் נַחֲלָה என்பது தலைமுறை வழியாகக் கிடைத்த நிலப் பங்கைக் குறிக்கிறது; ‘உரிமைச்சொத்து’ அந்த நிலவுரிமைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַתְּהִי
  choice: இருந்தது
  rationale: எபிரேய வினையின் அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது; ‘கோத்திரத்திலேயே’ என்பது அந்தச் சொத்து அங்கே தொடர்ந்து நிலைத்திருந்ததைக் சூழலிலேயே வெளிப்படுத்துகிறது.
- source_word: עַל מַטֵּה מִשְׁפַּחַת אֲבִיהֶן
  choice: அவர்களுடைய தந்தையின் குலம் சேர்ந்த கோத்திரத்திலேயே
  rationale: מַטֶּה இங்கு கோலை அல்ல, கோத்திரத்தைக் குறிக்கிறது. עַל என்பது உரிமை அல்லது இணைப்பைக் குறிக்கிறது; தமிழில் ‘கோத்திரத்திலேயே’ என்பது சொத்து அந்தக் கோத்திர வரம்புக்குள் இருந்ததை இயல்பாகச் சொல்கிறது.
