  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்ட-வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘குலம்’ மற்றும் ‘கோத்திரம்’ ஆகியவை מִשְׁפָּחָה, מַטֶּה என்ற இரு வேறுபட்ட சமூக அலகுகளைத் தனித்தனியாகக் காட்டுகின்றன; இயல்புக்காக ‘மகன்கள்’ என்பதற்குப் பதிலாக வம்சவழிப் பொருளுடைய ‘சந்ததியார்’ பயன்படுத்தப்பட்டுள்ளது.
