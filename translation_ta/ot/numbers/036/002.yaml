  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: ta
  text: அவர்கள், “என் தலைவரே, இஸ்ரவேலின் மகன்களுக்கு[a] நிலத்தைச் சீட்டினால் மரபுரிமையாகக் கொடுக்கும்படி யாவே கட்டளையிட்டார்; மேலும், எங்கள் சகோதரன் செலொப்பெகாத்தின் மரபுரிமையை அவனுடைய மகள்களுக்குக் கொடுக்கும்படி என் தலைவராகிய உமக்கு யாவேயால் கட்டளையிடப்பட்டது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் பிள்ளைகளுக்கு” அல்லது “இஸ்ரவேலருக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “இஸ்ரவேலின் மகன்களுக்கு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: என் தலைவரே / உமக்கு
  rationale: மோசேயை நேரடியாகவும் மரியாதையுடனும் அழைக்கும் மனிதப் பட்டமாக இருப்பதால், தெய்வீகப் பட்டமாகவோ அடிமைத்தனத் தொனியுள்ள சொல்லாகவோ இல்லாமல் இவ்வாறு மொழிபெயர்க்கப்பட்டது. தொடர்ந்த வாக்கியத்தில் இயல்பான தமிழுக்காக ‘உமக்கு’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தெய்வீகப் பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לָתֵת אֶת הָאָרֶץ
  choice: அந்த நாட்டை ... கொடுக்கும்படி
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ பாதுகாக்கப்பட்டது; சூழலில் ஏற்கெனவே அறியப்பட்ட கானான் நாட்டைக் குறிப்பதால் ‘அந்த நாடு’ இயல்பாக உள்ளது.
- source_word: בְּנַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: நחלה என்பது தலைமுறை வழியாகக் கிடைக்கும் நில உரிமையையும் பங்கையும் குறிக்கிறது; சட்டபூர்வ நிலவுடைமைப் பொருளை ‘உரிமைச்சொத்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּגוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: நிலம் பகிர்ந்தளிக்கப்பட்ட முறையைச் சுட்டும் ‘சீட்டு’ என்ற பொருள் செயன்முறை வடிவில் இயல்பான தமிழில் தரப்பட்டது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையான ‘மகன்கள்’ என்ற வடிவம் பாதுகாக்கப்பட்டது; இது ஒட்டுமொத்த இஸ்ரவேல் மக்களையும் குறிக்கும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: צֻוָּה בַיהוָה
  choice: யாவே உமக்குக் கட்டளையிட்டார்
  rationale: எபிரெயத்தில் செயப்பாட்டு அமைப்பு இருந்தாலும், தமிழில் இயல்பாகவும் முகவரியைக் குழப்பமின்றியும் காட்ட செயப்படுவினையாகத் தரப்பட்டது; கட்டளையின் மூலமும் செய்பவரும் யாவே என்பதும் பாதுகாக்கப்பட்டது.
- source_word: נַחֲלַת צְלָפְחָד
  choice: செலொப்பெகாத்தின் உரிமைச்சொத்தை
  rationale: பெயருடன் அமைந்த உடைமைத் தொடர்பும், பரம்பரை நிலப்பங்கின் சட்டப் பொருளும் நேரடியாகத் தரப்பட்டன.
- source_word: אָחִינוּ
  choice: எங்கள் சகோதரன்
  rationale: குல உறவைக் குறிக்கும் மூலத்தின் குடும்ப மொழி விளக்கமின்றி நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: לִבְנֹתָיו
  choice: அவனுடைய மகள்களுக்கு
  rationale: உரிமைச்சொத்தைப் பெறுகிறவர்கள் செலொப்பெகாத்தின் மகள்கள் என்பதை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. ஆகவே பட்டமான ‘கர்த்தர்’ என்பதைக் கொண்டு மாற்றாமல், பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: לִבְנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினமுள்ள கூட்டுச் சொல்
  choice: இஸ்ரவேலின் மகன்களுக்கு
  alternative: இஸ்ரவேலின் பிள்ளைகளுக்கு / இஸ்ரவேலருக்கு
  rationale: மூலத்தின் ஆண்பால் வடிவம் பிரதான உரையில் பாதுகாக்கப்பட்டது; அதே நேரத்தில் அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கக்கூடும் என்பதால் இயல்பான மாற்றுகள் காலடிக்குறிப்பில் தரப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டது. மோசேயை நோக்கிய ஒருமை மரியாதையை ‘என் தலைவரே’, ‘உமக்கு’ என்பவை வெளிப்படுத்துகின்றன. சட்ட மற்றும் பரம்பரை நிலப்பங்கு சார்ந்த சூழலுக்காக ‘உரிமைச்சொத்து’ பயன்படுத்தப்பட்டது.
