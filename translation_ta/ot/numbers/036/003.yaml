source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேல் மக்களின் கோத்திரங்களைச் சேர்ந்த ஆண்களில் ஒருவருக்கு மனைவிகளானால், அவர்களுடைய உரிமைச்சொத்து எங்கள் தந்தையரின் உரிமைச்சொத்திலிருந்து குறைக்கப்பட்டு, அவர்கள் திருமணம் செய்யும் ஆண்கள் சேர்ந்திருக்கும் கோத்திரத்தின் உரிமைச்சொத்தோடு கூட்டப்படும்; இவ்வாறு எங்கள் உரிமைச்சொத்தின் சீட்டால் ஒதுக்கப்பட்ட பங்கிலிருந்து[a] அது குறைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் உரிமைச்சொத்தின் சீட்டிலிருந்து.” எபிரெயில் சொற்சொல்லாக “சீட்டிலிருந்து” என்று உள்ளது; இது சீட்டுப்போட்டு ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: மனைவிகளானால்
  rationale: எபிரெயில் சொற்சொல்லாக ‘மனைவிகளாவார்கள்’ என்றாலும், சூழலில் முன்வைக்கப்படும் நிபந்தனைச் சாத்தியத்தை இயல்பான தமிழில் ‘ஆனால்’ என வெளிப்படுத்துகிறது.
- source_word: מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் கோத்திரங்களைச் சேர்ந்த ஆண்களில்
  rationale: அடுக்கான எபிரெய உறவுமுறைச் சொல்லாக்கத்தின் கருத்தைத் தக்கவைத்து, நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנִגְרְעָה
  choice: குறைக்கப்பட்டு
  rationale: גרע என்பதன் நிபால் வடிவம் இங்கு ஒரு கோத்திர உரிமைச்சொத்திலிருந்து பங்கு இழக்கப்படுவதைச் சுட்டுகிறது; பின்னர் வரும் அதே வேர்ச்சொல்லுடனான தொடர்பையும் இது காக்கிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்து
  rationale: இங்கு பொதுவான வாரிசுரிமையைவிட, தலைமுறை வழியாகக் கோத்திரத்துக்குரிய நிலச் சொத்தையே குறிக்கிறது; ‘உரிமைச்சொத்து’ அந்தச் சட்ட மற்றும் நிலப் பகிர்வு சார்ந்த பொருளைத் தெளிவாக்குகிறது.
- source_word: אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரின்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் குடும்ப-கோத்திரத் தொடர்ச்சியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְנוֹסַף עַל
  choice: உரிமைச்சொத்தோடு கூட்டப்படும்
  rationale: ஒரு கோத்திரத்திலிருந்து மற்றொன்றுக்கு நிலப்பங்கு சேர்க்கப்படும் விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: அவர்கள் சேரும்
  rationale: திருமணத்தால் பெண்கள் கணவர்களின் கோத்திரத்துடன் இணையும் கருத்தை இயல்பான தமிழில் தருகிறது; சொத்துரிமையின் தனித்த சட்ட விவரங்களை இதற்கு மேல் சேர்க்கவில்லை.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: எங்கள் உரிமைச்சொத்தின் சீட்டால் ஒதுக்கப்பட்ட பங்கிலிருந்து
  rationale: גּוֹרָל என்பதன் நேரடிப் பொருளான ‘சீட்டு’ என்பதையும், இங்கு அது குறிக்கும் சீட்டுப்போட்டு ஒதுக்கப்பட்ட நிலப்பங்கையும் இணைத்துத் தெளிவாக்குகிறது.
