translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பூர்வமான நிலப் பகிர்வு சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சுதந்தரம்’ என்ற இருபொருள் தரக்கூடிய சொல்லுக்குப் பதிலாக நிலம் மற்றும் மரபுவழி உரிமையைத் தெளிவாக்க ‘உரிமைச்சொத்து’ பயன்படுத்தப்பட்டது; மூலத்தில் גרע இருமுறை வருவதால் ‘குறைக்கப்படும்’ என்ற மீளுருவாக்கம் தக்கவைக்கப்பட்டது.
