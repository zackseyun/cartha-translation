base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: ta
  text: இஸ்ரவேல் மகன்களின் கோத்திரங்களில் பரம்பரைச் சொத்துக்கு வாரிசாக இருக்கும்[a] ஒவ்வொரு மகளும், தன் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்த ஒருவனை மணந்துகொள்ள வேண்டும். இவ்வாறு, இஸ்ரவேல் மகன்களில் ஒவ்வொருவரும் தன் தந்தையரின் பரம்பரைச் சொத்தை உரிமையாக வைத்திருப்பார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரம்பரைச் சொத்தை உடைய.” எபிரெயப் பங்கேற்புவினை, அவள் வாரிசாக இருக்கும் நிலையையோ சொத்தைப் பெறுவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஒவ்வொருவரும் தன் தந்தையரின் பரம்பரைச் சொத்தை வாரிசாகப் பெறுவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: பரம்பரைச் சொத்தை உடைய
  rationale: இங்குள்ள நிகழ்காலப் பங்கேற்புவினை, சொத்தைப் பெறும் நிகழ்வை மட்டும் அல்லாமல் பரம்பரைச் சொத்துக்குரிய வாரிசாக இருக்கும் மகளின் சட்ட நிலையையும் குறிக்கலாம். இயல்பான தமிழில் அதனைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַחֲלָה
  choice: பரம்பரைச் சொத்து
  rationale: இந்த நிலவுடைமைச் சட்டச் சூழலில், தலைமுறையாகக் கிடைக்கும் கோத்திர நிலப்பங்கைக் குறிக்கிறது; ‘பரம்பரைச் சொத்து’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்களின் கோத்திரங்களில்
  rationale: מַטֶּה என்பது இங்கு கோத்திரப் பிரிவைக் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதன் ஆண்பால் வடிவத்தை, இந்தத் தந்தைவழி வாரிசுரிமைச் சூழலில் மறைக்காமல் ‘இஸ்ரவேல் மகன்கள்’ என்று வைத்துள்ளது.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: தன் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்த
  rationale: מִשְׁפָּחָה என்பது பெரிய கோத்திரத்துக்குள் உள்ள குலநிலை உறவுக் குழுவைக் குறிக்கிறது; ‘குலம்’ இந்த அமைப்பு வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: ஒருவனை மணந்துகொள்ள வேண்டும்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘மனைவியாக இருக்க வேண்டும்’ என்பதாக இருந்தாலும், சட்டப்பூர்வ கட்டளையின் பொருளை இயல்பான நவீன தமிழில் ‘மணந்துகொள்ள வேண்டும்’ தெளிவாக வழங்குகிறது.
- source_word: יִירְשׁוּ אִישׁ
  choice: ஒவ்வொருவரும் ... உரிமையாக வைத்திருப்பார்கள்
  rationale: ירשׁ இங்கு நிலத்தை வாரிசாகப் பெறுதல் மட்டுமல்ல, தந்தைவழிப் பங்கைத் தொடர்ந்து உடைமையாக வைத்திருத்தலையும் குறிக்கிறது. אִישׁ என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொருவரும்’ வெளிப்படுத்துகிறது.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: தன் தந்தையரின் பரம்பரைச் சொத்து
  rationale: ‘அவனுடைய தந்தையரின் பரம்பரைச் சொத்து’ என்ற மூலத்தின் தந்தைவழிச் சட்ட அமைப்பைப் பாதுகாக்கிறது; தமிழில் ஒருமை சார்புப்பெயர் தேவையின்றி ‘தன்’ இயல்பாக அதையே தெரிவிக்கிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட உடன்படிக்கை மற்றும் வாரிசுரிமை மொழி
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மகன்கள்’ மற்றும் ‘தந்தையர்’ என்ற ஆண்பால்/தந்தைவழி மொழியைத் தக்கவைத்தல்
  alternative: ‘இஸ்ரவேல் மக்கள்’ மற்றும் ‘மூதாதையர்’
  rationale: இந்த வசனம் தந்தைவழி நில வாரிசுரிமையை ஒழுங்குபடுத்துகிறது. ஆகவே ஆண்பால் வடிவங்கள் வெறும் பொதுப்பெயர்கள் அல்ல; விவரிக்கப்படும் சட்ட அமைப்பின் பகுதியாக உள்ளன.
- issue: ירשׁ என்பதன் பொருள்
  choice: தற்போதைய சட்டப்பூர்வ உடைமை நிலையை முன்னிறுத்தும் ‘உடைய / உரிமையாக வைத்திருப்பார்கள்’
  alternative: ‘வாரிசாகப் பெறுகிற / வாரிசாகப் பெறுவார்கள்’
  rationale: வினை வாரிசாகப் பெறுதல் அல்லது உரிமையுடன் உடைமையாக்குதல் என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். இந்தச் சூழலில் நிலப்பங்கு வேறு கோத்திரத்துக்குச் செல்லாமல் நிலைத்திருப்பதே நோக்கம் என்பதால் உடைமை நிலை முதன்மைப்படுத்தப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பூர்வமும் கண்ணியமுமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரம்,’ ‘குலம்,’ ‘பரம்பரைச் சொத்து’ ஆகியவை பெரிய இனப்பிரிவு, அதன் உட்பிரிவு, தலைமுறை நிலவுடைமை என்ற வேறுபாடுகளைத் தெளிவாகப் பாதுகாக்கின்றன. மூலத்தின் தந்தைவழி அமைப்பு இயல்பான தமிழுக்காக பாலினநடுநிலையாக்கப்படவில்லை.
