language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே செலொப்பெகாத்தின் மகள்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: கட்டளைக்கும் அதைத் தொடர்ந்து நடந்த செயலுக்கும் இடையிலான துல்லியமான ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னதாக வழங்கப்பட்ட கட்டளையைக் குறிக்கும்; தமிழில் தொடர்பெயரெச்ச வடிவம் நிகழ்வுகளின் வரிசையை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: எபிரெயத்தில் மோசே கட்டளையைப் பெற்ற நபராகக் குறிக்கப்படுகிறார்; தமிழ் வினைமரபில் ‘மோசேக்குக் கட்டளையிட்டார்’ என்பது இயல்பான அமைப்பு.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முன்னர் கூறப்பட்ட கட்டளைக்கு ஏற்ப அவர்கள் நடந்துகொண்டதைச் சுருக்கமாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: எளிய பன்மை வினையைப் பாதுகாத்து, அவர்கள் கட்டளைக்கு ஏற்ப செயல்பட்டார்கள் என்ற பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: בְּנוֹת צְלָפְחָד
  choice: செலொப்பெகாதின் மகள்கள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது; அதை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான உரை. ‘கட்டளையிட்டபடியே’ என்ற அமைப்பு כַּאֲשֶׁר ... כֵּן எனும் ஒத்திசைவு வடிவத்தை இயல்பாக ஒருங்கிணைக்கிறது.
