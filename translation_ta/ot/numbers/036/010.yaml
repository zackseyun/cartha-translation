  terminology: '‘யாவே’ faithfully represents יהוה without replacing the name with a title. ‘மோசே’ is standard. The personal name צלפחד should retain its final /t/ in Tamil before the genitive suffix: ‘செலொப்பெகாத்தின்.’'
