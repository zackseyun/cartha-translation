source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் பரம்பரைச் சொத்து ஒரு கோத்திரத்திலிருந்து மற்றொரு கோத்திரத்துக்கு மாறாது[a]; ஏனெனில், இஸ்ரவேல் மக்கள் ஒவ்வொருவரும் தங்கள் தந்தையரின் கோத்திரத்துக்குரிய பரம்பரைச் சொத்தை உறுதியாகப் பற்றிக்கொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாறாது’ என்பதற்கான எபிரெய வினைச்சொல்லை ‘திரும்பாது’ அல்லது ‘மாற்றப்படாது’ என்றும் மொழிபெயர்க்கலாம்; இங்கு பரம்பரைச் சொத்து ஒரு கோத்திரத்திலிருந்து வேறொரு கோத்திரத்துக்குச் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  choice: மாறக்கூடாது
  rationale: சבב என்ற வினைச்சொல்லின் அடிப்படைப் பொருள் ‘திரும்புதல்’ என்றாலும், இச்சட்டச் சூழலில் உரிமைச்சொத்து ஒரு கோத்திரத்திலிருந்து மற்றொன்றின் கட்டுப்பாட்டுக்கு மாறுவதைக் குறிக்கிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்து
  rationale: இங்கு தலைமுறை வழியாகக் கிடைக்கும் கோத்திர நிலப்பங்கைக் குறிக்கும் சட்டச் சொல். ‘உரிமைச்சொத்து’ என்பது நிலத்தையும் பரம்பரை உரிமையையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: ஒரு கோத்திரத்திலிருந்து மற்றொரு கோத்திரத்துக்கு
  rationale: இந்தச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’; முழு வடிவம் தமிழில் மாற்றத்தின் திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי
  choice: ஆகையால் ... [அடுத்த வாக்கியத்தால் காரணம் விளக்கப்படுகிறது]
  rationale: முதல் தடையை முந்தைய கட்டளையுடன் இணைக்க ‘ஆகையால்’ பயன்படுத்தப்பட்டுள்ளது; பின்னர் வரும் வாக்கியம் அந்தத் தடையின் அடிப்படையான கடமையை விளக்குகிறது. எபிரெய இணைப்பின் தர்க்கத் தொடர்பு தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு தனித்தனி உறுப்பினருக்குப் பொருந்தும் பகிர்ந்தளிக்கும் பொருள் உள்ளது; ‘ஒவ்வொருவரும்’ அதை இயல்பான தமிழில் தருகிறது.
- source_word: יִדְבְּקוּ
  choice: உறுதியாகப் பற்றிக்கொள்ள வேண்டும்
  rationale: דבק உறுதியான பற்றுதலைக் குறிக்கிறது. சட்டச் சூழலுக்கேற்ற தொடர்ச்சியான கடமையை ‘வேண்டும்’ தெளிவுபடுத்துகிறது.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: தங்கள் தந்தையரின் கோத்திரத்துக்குரிய உரிமைச்சொத்தை
  rationale: தந்தைவழிக் கோத்திர மரபை உரை வெளிப்படையாகக் குறிப்பிடுவதால் ‘தந்தையர்’ பாதுகாக்கப்பட்டுள்ளது; தமிழில் பன்மை எழுவாய்க்கேற்ப ‘தங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: கோத்திர உரிமை தந்தைவழி மரபுடன் இணைக்கப்படுதல்
  choice: தங்கள் தந்தையரின் கோத்திரத்துக்குரிய உரிமைச்சொத்து
  alternative: தங்கள் மூதாதையரின் கோத்திர உரிமைச்சொத்து
  rationale: אֲבֹתָיו என்பது பொதுவான ‘மூதாதையர்’ என்று வரக்கூடியதாயினும், இச்சூழலில் கோத்திர அடையாளத்தின் தந்தைவழி அமைப்பை உரை வலியுறுத்துகிறது. எனவே அந்தக் குறிப்பை நடுநிலைப்படுத்தாமல் ‘தந்தையர்’ என்று வழங்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவத்தின் சமூகப் பரப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: சட்டம் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது. தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது இயல்பற்றதாகவும் உயிரியல் மகன்களாகத் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், சமூகப் பொருளைத் தெளிவாகக் காட்டும் ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; அதேவேளையில் தந்தைவழி மரபு இரண்டாம் வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சட்டத் தன்மையைத் தக்கவைத்தபடியே பொதுவாசகர்களுக்குத் தெளிவான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ‘உரிமைச்சொத்து’, ‘கோத்திரம்’, ‘உறுதியாகப் பற்றிக்கொள்ள’ ஆகியவை மூலத்தின் நில உரிமை மற்றும் கோத்திரப் பற்றுதல் ஆகிய இரு கூறுகளையும் காக்கின்றன.
