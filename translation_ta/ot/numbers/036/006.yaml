revisions:
- from: 'செலொப்பெகாதின் மகள்களைக் குறித்து யாவே கட்டளையிட்ட வார்த்தை இதுதான்: “தங்கள் பார்வைக்கு நல்லவர் என்று தோன்றுகிற யாரை வேண்டுமானாலும் அவர்கள் திருமணம் செய்துகொள்ளலாம்[a]. ஆனால், தங்கள் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்தவர்களையே அவர்கள் திருமணம் செய்துகொள்ள வேண்டும்[b].”'
  to: 'செலொப்பெகாதின் மகள்களைக் குறித்து யாவே கட்டளையிட்டது இதுவே: “தங்கள் பார்வையில் நல்லவர் எனத் தோன்றுகிறவரை அவர்கள் திருமணம் செய்துகொள்ளலாம்[a]. ஆயினும், தங்கள் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்தவர்களை மட்டுமே அவர்கள் திருமணம் செய்துகொள்ள வேண்டும்[b].”'
  rationale: திருத்தங்கள் பொருளை மாற்றவில்லை. அவை கட்டளையின் வரம்பைத் தெளிவாக்கி, தமிழ்ச் சொல்வரிசையையும் முதல் அடிக்குறிப்பின் இலக்கணத் தெளிவையும் மேம்படுத்துகின்றன. மூலத்தில் உள்ள விருப்பத்திற்கான இடமும் தந்தைவழிக் கோத்திரக் கட்டுப்பாடும் அப்படியே பாதுகாக்கப்பட்டுள்ளன.
