  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: ta
  text: 'செலொப்பெகாதின் மகள்களைக் குறித்து யாவே கட்டளையிட்டது இதுவே: “தங்கள் பார்வையில் நல்லவர் எனத் தோன்றுகிறவரை அவர்கள் திருமணம் செய்துகொள்ளலாம்[a]. ஆயினும், தங்கள் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்தவர்களை மட்டுமே அவர்கள் திருமணம் செய்துகொள்ள வேண்டும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்குச் சிறந்தவர் எனக் கருதுகிறவரை.” எபிரேய மரபுத்தொடர் சொல்லுக்கு சொல், “தங்கள் கண்களில் நல்லவரை” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் தந்தையின் கோத்திரத்தைச் சேர்ந்த குலத்திற்குள்ளேயே.” எபிரேயம் ‘குலம்’ மற்றும் ‘கோத்திரம்’ ஆகிய இரு சொற்களையும் இணைத்து, சொத்துரிமை பிதாவழிக் கோத்திரத்திற்குள் நிலைத்திருக்க வேண்டியதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: கட்டளையிட்ட வார்த்தை இதுதான்
  rationale: דָּבָר என்பது ‘வார்த்தை,’ ‘காரியம்,’ அல்லது ‘விவகாரம்’ எனப் பொருள்படலாம். இங்கு அது அதிகாரமுள்ள இறைக் கட்டளையை அறிமுகப்படுத்துவதால் ‘வார்த்தை’ பொருத்தமானது.
- source_word: צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்ட
  rationale: צוה கட்டளையிடுதலைக் குறிக்கிறது; இறைப்பெயரான יהוה ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: செலொப்பெகாதின் மகள்களைக் குறித்து
  rationale: ל இங்கு கட்டளை யாரைக் குறித்தது என்பதைக் காட்டுகிறது. ‘குறித்து’ என்பது கட்டளையின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: தங்கள் பார்வைக்கு நல்லவர் என்று தோன்றுகிற யாரை வேண்டுமானாலும்
  rationale: ‘அவர்களுடைய கண்களில் நல்லவர்’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தை ஓரளவு காத்து, தேர்வு அவர்களுடையது என்பதையும் தெளிவாக்குகிறது.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: திருமணம் செய்துகொள்ளலாம் / திருமணம் செய்துகொள்ள வேண்டும்
  rationale: சொல்லுக்கு சொல் ‘மனைவிகளாக இருக்கட்டும்’ என்பதாகும். முதல் இடத்தில் அனுமதியும், אַךְ என்பதற்குப் பின் மீண்டும் வரும் இடத்தில் கட்டுப்பாட்டுடன் கூடிய கடமையும் உள்ளதால், தமிழில் முறையே ‘செய்துகொள்ளலாம்’ மற்றும் ‘செய்துகொள்ள வேண்டும்’ எனத் தரப்பட்டுள்ளது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: இங்கு אַךְ முன் வழங்கப்பட்ட சுதந்திரத்திற்கு ஒரு வரம்பை விதிக்கிறது; ‘ஆனால்’ அந்த மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: தங்கள் தந்தையின் கோத்திரத்திலுள்ள குலத்தைச் சேர்ந்தவர்களையே
  rationale: מִשְׁפָּחָה மற்றும் מַטֶּה ஆகியவை முறையே குலம் மற்றும் கோத்திரத்தைச் சுட்டுகின்றன. இரண்டையும் தனித்தனியாக வைத்துப் பிதாவழிக் கோத்திர எல்லையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் எளிதில் வாசிக்கக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ எனத் தரப்பட்டுள்ளது.
- issue: திருமணத் தேர்வின் சுதந்திரமும் கோத்திரக் கட்டுப்பாடும்
  choice: முதல் கூறில் அனுமதி; இரண்டாம் கூறில் கட்டாய வரம்பு
  alternative: இரு கூறுகளையும் ஒரே அளவிலான கட்டளைகளாக மொழிபெயர்த்தல்
  rationale: வசனம் பெண்களின் தேர்வை முதலில் அங்கீகரித்து, אַךְ மூலம் அதற்குக் கோத்திர எல்லையை விதிக்கிறது. இந்த உரைத் த tension-ஐ தமிழிலும் பாதுகாக்க ‘திருமணம் செய்துகொள்ளலாம்’ மற்றும் ‘திருமணம் செய்துகொள்ள வேண்டும்’ என வேறுபடுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’ மற்றும் ‘குலம்’ என்ற வேறுபாடு மூலத்தின் சமூக அமைப்பைக் காக்கப் பயன்படுத்தப்பட்டது; எபிரேய மரபுத்தொடரின் சுவடு முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
