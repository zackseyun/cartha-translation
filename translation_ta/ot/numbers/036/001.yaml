translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. எபிரெயத்தின் நீண்ட வம்சவழி மற்றும் இணைப்புச் சொற்றொடர் தமிழில் புரிதலுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; ஆனால் எல்லா உறவுகளும் தலைமைப் பதவிகளும் காக்கப்பட்டுள்ளன. ‘கோத்திரம்’ என்பதற்குப் பதிலாக இவ்வசனத்தின் מִשְׁפָּחָה என்பதற்கு ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது; אָבוֹת குறிக்கும் சிறிய தந்தைவழி சமூக அலகு ‘தந்தைவழிக் குடும்பம்’ என வேறுபடுத்தப்பட்டுள்ளது.
