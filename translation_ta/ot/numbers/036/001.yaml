source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: ta
  text: யோசேப்பின் மகன்களின் குலங்களைச் சேர்ந்த, மனாசேயின் மகன் மாகீரின் மகனான கிலேயாத்தின் மகன்களின் குலத்தைச் சேர்ந்த தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[a] வந்து, மோசேயின் முன்னிலும் இஸ்ரவேல் மக்களின்[b] தந்தைவழிக் குடும்பத் தலைவர்களான தலைவர்களின் முன்னிலும் பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூதாதையர் இல்லங்களின் தலைவர்கள்’ / ‘குடும்பத் தலைவர்கள்.’ எபிரெய மரபுத்தொடர், இஸ்ரவேலின் கோத்திர அமைப்பில் அங்கீகரிக்கப்பட்ட வம்சக் குடும்பத் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லடியாக, ‘இஸ்ரவேலின் மகன்கள்’; இயல்பான தமிழில், ‘இஸ்ரவேல் மக்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: வந்து
  rationale: இங்கு קרב என்பது ஒரு வழக்கை முன்வைப்பதற்காக அதிகாரிகளிடம் முறையாக அணுகிவருவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் ‘வந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: சொல்லடியாக ‘தந்தையரின் தலைவர்கள்’ என்றாலும், இஸ்ரவேலின் வம்ச-குடும்ப அமைப்பில் அங்கீகரிக்கப்பட்ட மூதாதையர் வீட்டுத் தலைவர்களைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ அந்தச் சமூக அலகை நவீனத் தமிழில் தெளிவாக்குகிறது.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: கிலேயாத்தின் வழிவந்தோர் குலத்திலுள்ள
  rationale: לְ இங்கு திசையைக் காட்டாமல் உறவு அல்லது சேர்ந்திருத்தலைக் காட்டுகிறது; בְּנֵי என்பது உயிரியல் மகன்களை மட்டும் அல்லாமல் வழிவந்தோரையும் குறிக்கும் மரபுவழிச் சொற்றொடர்.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகன் மாகீரின் மகனான
  rationale: மூலத்தின் தொடர்ச்சியான வம்சத் தொடர்பையும் இருமுறை வரும் ‘மகன்’ அமைப்பையும் பாதுகாக்கிறது.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: யோசேப்பின் வழிவந்த குலங்களைச் சேர்ந்தவர்களும்
  rationale: מִן பெரிய குலத் தொகுதிக்குள் இவர்களுடைய தோற்றம் அல்லது சேர்ந்திருத்தலைக் குறிக்கிறது; ‘வழிவந்த’ என்பது בְּנֵי என்பதன் வம்சவழிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: மோசேயின் முன்னிலையிலும் தலைவர்களின் முன்னிலையிலும்
  rationale: לִפְנֵי அதிகாரமுள்ளவர்களின் முன்னிலையில் முறையாக ஆஜராவதைக் குறிக்கிறது. הַנְּשִׂיאִם என்பதற்கு பொதுவாகப் புரியும் ‘தலைவர்கள்’ பொருத்தமானது.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: இது முன் குறிப்பிடப்பட்ட தலைவர்களை மேலும் துல்லியமாக அடையாளப்படுத்தும் விளக்கத் தொடர். நீண்ட எபிரெய வாக்கியத்தைத் தெளிவான தமிழுக்காக இரண்டாவது வாக்கியமாக வழங்கியுள்ளோம்.
