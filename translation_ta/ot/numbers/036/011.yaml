  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: ta
  text: செலொப்பெகாதின் மகள்களான மக்லா, திர்சா, ஒக்லா, மில்கா, நோவா ஆகியோர் தங்கள் தந்தையின் சகோதரர்களுடைய மகன்களைத் திருமணம் செய்துகொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּהְיֶינָה ... לְנָשִׁים
  choice: திருமணம் செய்துகொண்டார்கள்
  rationale: எபிரெயத் திருமண மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; அவர்கள் அந்த ஆண்களுக்கு மனைவிகளானார்கள் என்ற விளைவு நிலையும் இதில் அடங்குகிறது.
- source_word: בְּנוֹת
  choice: மகள்களான
  rationale: வம்ச உறவைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வடிவம்.
- source_word: צְלָפְחָד
  choice: செலொப்பெகாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: தங்கள் தந்தையின் சகோதரர்களுடைய மகன்களை
  rationale: דֹדֵיהֶן என்பதை இச்சூழலில் தந்தையின் சகோதரர்கள் என்று வெளிப்படையாகக் காட்டி, திருமண உறவை இயல்பான தமிழ் வினை அமைப்பில் நேரடி செயப்படுபொருளாகத் தருகிறது.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: மக்லா, திர்சா, ஒக்லா, மில்கா, நோவா
  rationale: பெயர்களின் வரிசையை எபிரெய மூலத்தின்படி காத்து, தமிழுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. எபிரெய மொழியின் ‘மனைவிகளானார்கள்’ என்ற சொற்சொல் அமைப்புக்குப் பதிலாக, தமிழில் இயல்பான ‘திருமணம் செய்துகொண்டார்கள்’ பயன்படுத்தப்பட்டது. தந்தைவழி உறவு மூலத்தில் சூழலால் உணரப்படுவதால், தெளிவுக்காக உரையிலேயே வெளிப்படுத்தப்பட்டது.
