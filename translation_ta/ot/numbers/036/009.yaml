- source_word: נַחֲלָה
  choice: உரிமைச்சொத்து
  rationale: இந்தச் சூழலில் இச்சொல் இஸ்ரவேல் கோத்திரங்களுக்கு ஒதுக்கப்பட்டு தலைமுறைதோறும் வரும் நிலவுடைமையைக் குறிக்கிறது; ‘உரிமைச்சொத்து’ அதன் நிலம் மற்றும் பரம்பரை உரிமை ஆகிய இரு கூறுகளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: ஒரு கோத்திரத்திலிருந்து வேறொரு கோத்திரத்துக்கு
  rationale: מַטֶּה என்பதற்கு சொல்லடிப்படையில் ‘கோல்’ என்ற பொருளும் இருந்தாலும், இச்சட்டச் சூழலில் அது கோத்திர அமைப்பைக் குறிக்கிறது. எபிரெய உரையின் ஒரு கோத்திரத்திலிருந்து மற்றொன்றுக்கு என்ற பகிர்வுணர்வு தெளிவாக வைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப் பொருள் நேரடியாகக் காக்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொன்றும்
  rationale: ஆண்பால் ஒருமை வடிவமான אִישׁ இங்கு தொடர்ந்து வரும் கோத்திரங்களைப் பகிர்வாகச் சுட்டுகிறது. தமிழில் கோத்திரங்களை மனிதர்களாகச் செயற்கையாகக் குறிப்பிடாமல் அந்தப் பகிர்வுப் பொருள் காக்கப்பட்டுள்ளது.
- source_word: בְּנַחֲלָתוֹ
  choice: தனக்குரிய உரிமைச்சொத்தை
  rationale: דבק உடன் சேர்ந்த இத்தொடர் ஒவ்வொரு கோத்திரமும் தனக்கு ஒதுக்கப்பட்ட உரிமைச்சொத்துடன் இணைந்திருக்க வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: יִדְבְּקוּ
  choice: உறுதியாகப் பற்றிக்கொண்டிருக்க வேண்டும்
  rationale: דבק என்பதன் ‘ஒட்டிக்கொள், பற்றிக்கொள்’ என்ற உருவகத்தைப் பேணியபடி, நிலவுரிமையைத் தொடர்ந்து தக்கவைத்திருக்கும் சட்டப்பொருள் தெளிவாக்கப்பட்டுள்ளது.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் கோத்திரங்கள்
  rationale: இது நவீன தமிழில் இயல்பாகவும் கூட்டாகிய இஸ்ரவேல் மக்களைக் குறிக்கும் வகையிலும் உள்ளது. בְּנֵי என்பதன் சொல்லடிப்படையான ‘மகன்கள்’ வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியுடைய உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்த எபிரெய மரபுத்தொடர் இலக்கணப்படி ஆண்பால் வடிவில் இருந்தாலும், சூழலில் உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. நவீன தமிழில் தவறாக ஆண்களை மட்டும் குறிக்கும் எண்ணத்தைத் தவிர்க்க கூட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொல்லடிப்படையான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பாங்கிற்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றிக்கொண்டிருக்க வேண்டும்’ என்பது மூலத்தின் உருவகத்தைப் பேணுகிறது; ‘உரிமைச்சொத்து’ என்பது இச்சூழலின் பரம்பரை நிலவுரிமையைத் தெளிவாகக் குறிக்கிறது.
