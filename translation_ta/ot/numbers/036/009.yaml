base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: ta
  text: ஓர் உரிமைச்சொத்து ஒரு கோத்திரத்திலிருந்து வேறொரு கோத்திரத்துக்கு மாறக் கூடாது. ஏனெனில், இஸ்ரவேல் மக்களின் கோத்திரங்கள்[a] ஒவ்வொன்றும் தனக்குரிய உரிமைச்சொத்தை உறுதியாகப் பற்றிக்கொண்டிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்களுடைய கோத்திரங்கள்.”
    reason: மூலமொழியின் பாலினக் குறியுடைய சொல்லடிப்படையான வடிவத்தைப் பதிவு செய்வதற்கான மொழியியல் மாற்றுவடிவம்.
