base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ta
  text: மோவாபின் சமவெளிகளில், எரிகோவுக்கு அருகிலுள்ள யோர்தான் ஆற்றங்கரையில், இஸ்ரவேல் மக்களுக்கு[a] மோசே வழியாக யாவே கட்டளையிட்ட கட்டளைகளும் சட்டவிதிகளும் இவையே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்”; இந்த உடன்படிக்கைச் சொற்றொடர் இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எரிகோவுக்கு எதிரே யோர்தான் ஆற்றங்கரையில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: முடிவுச் சுருக்கத்தை அறிமுகப்படுத்தும் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּצְוֺת
  choice: கட்டளைகள்
  rationale: சட்டரீதியான அதிகாரத்தையும் צִוָּה என்ற வினையுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: וְהַמִּשְׁפָּטִים
  choice: நீதிநியமங்கள்
  rationale: מִשְׁפָּטִים என்பதன் நீதித்தீர்ப்புகள், சட்டவிதிகள் என்ற பொருள் பரப்பைச் சுருக்காமல், இச்சட்டச் சூழலில் தெளிவாகத் தருகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: வினையின் அதிகாரமிக்க சட்டப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசே வழியாக
  rationale: சொல்லர்த்தமாக ‘மோசேயின் கையால்’ என்ற எபிரெய மரபுத்தொடர் இங்கு முகமை அல்லது இடைமையைக் குறிக்கிறது; நவீன தமிழில் அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: சொல்லர்த்தமான ‘இஸ்ரவேலின் மகன்கள்’ என்பது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும்; தமிழில் பாலினக் குழப்பமின்றி அதன் கூட்டுப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עַרְבֹת குறிக்கும் சமவெளி அல்லது புல்வெளிப் பகுதியை நிறுவப்பட்ட புவியியல் நடையில் தருகிறது.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே யோர்தான் ஆற்றின் அருகில்
  rationale: עַל என்பதன் அருகாமைப் பொருளையும், எரிகோவின் மறுபுறத்தில் இருந்த இடத்தைக் குறிக்கும் இத்தொடரின் புவியியல் பொருளையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பெயரான יהוה என்பதைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப் பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொல்லர்த்தமாக ‘மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கைச் சமூகமான இஸ்ரவேலை முழுவதுமாகக் குறிக்கிறது. முதன்மை உரையில் இயல்பான கூட்டுப்பெயர் பயன்படுத்தப்பட்டு, சொல்லர்த்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் சட்டரீதியான நிறையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டளைகள்—நீதிநியமங்கள்’ என்ற இணைச் சொற்கள் எபிரெய சட்டச் சூத்திரத்தின் வேறுபாட்டைக் காக்கின்றன. இடப்பெயர்கள் வாசகருக்குத் தெளிவாக இருக்க ‘யோர்தான் ஆறு’ என வெளிப்படையாக வழங்கப்பட்டுள்ளது.
