  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: ta
  text: இஸ்ரவேல் மகன்களுக்கு[a] யூபிலி ஆண்டு வந்தால், அவர்களுடைய பரம்பரை நிலப்பங்கு அவர்கள் சேரும் கோத்திரத்தின் பரம்பரை நிலப்பங்கோடு சேர்க்கப்படும்; அவர்களுடைய பரம்பரை நிலப்பங்கு எங்கள் தந்தையரின் கோத்திரத்துக்குரிய பரம்பரை நிலப்பங்கிலிருந்து கழிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் மக்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: வந்தால்
  rationale: אִם என்பதன் நிபந்தனைப் பொருளை நேரடியாகப் பாதுகாக்கிறது. சட்ட வாதத்தில் இது எதிர்பார்க்கப்படும் நிகழ்வைக் குறித்தாலும், ‘வரும்போது’ என்று மாற்றி அந்த நிபந்தனை நுணுக்கத்தை நீக்கவில்லை.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: யூபிலி ஆண்டு வந்தால்
  rationale: ஒரு குறிப்பிட்ட கால நிகழ்வு ஏற்படுவதைத் தமிழில் இயல்பாகக் கூறுகிறது; ‘ஆண்டு’ என்பது יוֹבֵל குறிக்கும் காலச் சூழலைத் தெளிவாக்குகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெயத்தின் குடும்ப உறவுச் சொல்லாக்கத்தை முதன்மை உரையில் பாதுகாக்கிறது; இது தேசத்தாரைக் குறிக்கும் மரபுச் சொல்லாக்கம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: נַחֲלָתָן
  choice: இவர்களுடைய பரம்பரை நிலப்பங்கு
  rationale: இங்கு נחלה என்பது பொதுவான வாரிசுச் சொத்தைவிட, கோத்திரத்துக்குள் தலைமுறையாகக் கிடைத்த நில ஒதுக்கீட்டைக் குறிக்கிறது. ‘இவர்கள்’ என்பது விவாதிக்கப்படும் பெண்களைக் குறிக்கிறது.
- source_word: וְנוֹסְפָה ... עַל
  choice: '... நிலப்பங்கோடு சேர்க்கப்படும்'
  rationale: Niphal வடிவத்தின் செயப்பாட்டு/விளைவு பொருளையும், மற்றொரு கோத்திரத்தின் பங்குடன் இணைக்கப்படுவதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמַּטֶּה
  choice: கோத்திரம்
  rationale: நில ஒதுக்கீட்டுச் சூழலில் מטה இஸ்ரவேலின் ஒரு கோத்திரத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: இவர்கள் உரியவர்களாகும் கோத்திரம்
  rationale: எபிரெயக் கூறின் உறவுப்பொருளைப் பாதுகாத்து, திருமணம் என்ற சொல்லை மூலத்தில் இல்லாத இடத்தில் வெளிப்படையாகச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரின் கோத்திரத்துக்குரிய பரம்பரை நிலப்பங்கிலிருந்து
  rationale: பேசுகிறவர்களின் மூதாதையர் சார்ந்த கோத்திரப் பங்குடன் உள்ள மாறுபாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: יִגָּרַע
  choice: கழிக்கப்படும்
  rationale: ஒரு கோத்திரத்தின் நில ஒதுக்கீட்டிலிருந்து அந்தப் பங்கு குறைக்கப்பட்டு நீங்கும் சட்ட விளைவைச் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: யூபிலி ஆண்டின் வருகை நிபந்தனையா அல்லது உறுதியான எதிர்பார்ப்பா
  choice: ‘வந்தால்’ என்று நிபந்தனை வடிவில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘வரும்போது’
  rationale: וְאִם என்பதில் உள்ள உண்மையான நிபந்தனை நுணுக்கத்தைப் பாதுகாக்கிறது; சூழல் அதை எதிர்பார்க்கப்படும் நிகழ்வாகக் காட்டினாலும், மொழிபெயர்ப்பு அதை உறுதியான காலவாக்கியமாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரம்பரை நிலப்பங்கு’ என்ற தொடர், கோத்திரத்துக்குரிய வாரிசு நில ஒதுக்கீட்டைத் தெளிவுபடுத்துகிறது. மூலத்தில் இல்லாத ‘திருமணம்’ என்ற விளக்கச் சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
