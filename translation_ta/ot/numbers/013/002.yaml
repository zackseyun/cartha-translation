source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: ta
  text: “உனக்காக ஆண்களை அனுப்பு; நான் இஸ்ரவேலின் மக்களுக்குக்[b] கொடுக்கிற கானான் நாட்டை அவர்கள் ஆராய்ந்து பார்க்கட்டும்.[a] ஒவ்வொரு மூதாதையர் கோத்திரத்திலிருந்தும் ஒருவனை அனுப்புங்கள்; அவர்களுள் ஒவ்வொருவனும் ஒரு தலைவன்.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேவு பார்க்கட்டும்” அல்லது “சுற்றிப்பார்க்கட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் மக்கள்” என்பதற்கான எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கை மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: “அவர்களுள் ஒவ்வொருவனும் ஒரு முதன்மையானவர்” அல்லது “அதிபதி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் கோத்திரத் தலைவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: உனக்காக ஆட்களை அனுப்பு
  rationale: கட்டளை வினையான שְׁלַח என்பதையும், பொருள் குறித்து ஓரளவு தெளிவின்மை கொண்ட לְךָ என்பதையும் ‘உனக்காக’ என்று வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אֲנָשִׁים
  choice: ஆட்கள்
  rationale: இங்கு கோத்திரங்களிலிருந்து தேர்ந்தெடுக்கப்படும் ஆண் பிரதிநிதிகளைக் குறிக்கிறது; தமிழில் ‘ஆட்கள்’ சூழலுக்கு இயல்பாக இருந்து, பின்னர் வரும் ‘ஒருவன்’ பாலினத்தையும் தெளிவாக்குகிறது.
- source_word: וְיָתֻרוּ
  choice: ஆராய்ந்து பார்க்கட்டும்
  rationale: תור என்பது நிலத்தைச் சுற்றிப்பார்த்து ஆராய்தல் அல்லது வேவு பார்த்தல் எனப் பொருள்படலாம். ‘ஆராய்ந்து பார்க்க’ என்பது உளவுசார் பொருளை மட்டும் திணிக்காமல் முதன்மைச் செயலை இயல்பாகக் காட்டுகிறது.
- source_word: אֶרֶץ כְּנַעַן
  choice: கானான் நாடு
  rationale: אֶרֶץ என்பதை ‘நாடு’ என்று வெளிப்படுத்தி, இயல்பான தமிழ் பெயர்த்தொடராக வழங்குகிறது.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: நான் ... கொடுக்கிற
  rationale: நֹתֵן என்ற நிகழ்காலப் பங்கேற்புவினையின் நடைபெறும் அல்லது உறுதியாக முன்னெடுக்கப்படும் கொடையைத் தமிழின் இயல்பான நிகழ்கால வடிவில் தக்கவைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் தேவையற்ற வகையில் உயிரியல் ஆண் சந்ததியைக் குறுகலாக உணர்த்தக்கூடும். ‘மக்கள்’ என்பது முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பாக வழங்குகிறது.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ஒவ்வொன்றிலிருந்தும் ஒருவன் ... ஒவ்வொருவரும்
  rationale: மீளுரையின் பகிர்ந்தளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் ‘ஒவ்வொன்றிலிருந்தும் ஒருவன்’ மற்றும் ‘ஒவ்வொருவரும்’ என வெளிப்படுத்துகிறது.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: அவர்களுடைய மூதாதையர் கோத்திரம் ஒவ்வொன்றிலிருந்தும்
  rationale: מַטֶּה என்பதற்கு ‘கோத்திரம்’ என்றும் אֲבֹתָיו என்பதற்கு பிதாமரபை உள்ளடக்கும் ‘மூதாதையர்’ என்றும் மொழிபெயர்த்து வம்ச அமைப்பைத் தக்கவைக்கிறது.
- source_word: תִּשְׁלָחוּ
  choice: அனுப்புங்கள்
  rationale: தொடக்க ஒருமைக் கட்டளையைத் தொடர்ந்து வரும் பன்மை அறிவுறுத்தலை மரியாதைப் பன்மையுடனும் தெளிவான கட்டளை வலிமையுடனும் வழங்குகிறது; எபிரெய எண்ண்மாற்றம் மொழிபெயர்ப்பில் இயல்பாகத் தங்குகிறது.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: அவர்கள் ஒவ்வொருவரும் தங்களிடையே ஒரு தலைவராக
  rationale: נָשִׂיא என்பதன் தலைவன் அல்லது முதன்மையானவர் என்ற பரப்பில், நவீன வாசகருக்கு தெளிவான ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தெய்வீகக் கட்டளையில் לְךָ என்பதன் நுணுக்கம்
  choice: முதன்மை உரையில் ‘உனக்காக’ என்று தக்கவைத்தல்
  alternative: தமிழில் தனியாக மொழிபெயர்க்காமல் விடுதல்; அல்லது ‘உன் சார்பாக’ என்று வழங்குதல்
  rationale: இந்தச் சொல்லைத் தக்கவைப்பது, அது மோசேயின் தனிப்பட்ட ஈடுபாட்டையா, அனுமதியையா, அல்லது வெறும் வலியுறுத்தலையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: בני ישראל என்ற உடன்படிக்கை/குடும்ப மரபுத்தொடர்
  choice: ‘இஸ்ரவேலின் மக்கள்’
  alternative: ‘இஸ்ரவேலின் மகன்கள்’ அல்லது ‘இஸ்ரவேலர்’
  rationale: சொல்லுக்கு சொல் வடிவமான ‘மகன்கள்’ தமிழில் பெண்களை விலக்கும் உயிரியல் பொருளை வலுப்படுத்தலாம். இங்கு முழு இஸ்ரவேல் சமூகமே குறிக்கப்படுவதால் ‘மக்கள்’ பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; அடிப்படை குடும்ப மரபுத்தொடர் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கோத்திரம்’, ‘மூதாதையர்’ போன்ற வேதாகமச் சூழலுக்குரிய சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூலத்தில் தொடக்கக் கட்டளை ஒருமையிலும் பின்னைய அறிவுறுத்தல் பன்மையிலும் இருப்பதால், தமிழில் ‘அனுப்பு’ / ‘அனுப்புங்கள்’ என்ற எண்ண்மாற்றம் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
