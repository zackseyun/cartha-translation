revisions:
- from: “உனக்காக ஆட்களை அனுப்பு; நான் இஸ்ரவேலின் மக்களுக்குக் கொடுக்கிற கானான் நாட்டை அவர்கள் ஆராய்ந்து பார்க்கட்டும்.[a] அவர்களுடைய மூதாதையர் கோத்திரம் ஒவ்வொன்றிலிருந்தும் ஒருவனை அனுப்புங்கள்; அவர்கள் ஒவ்வொருவரும் தங்களிடையே ஒரு தலைவராக இருக்க வேண்டும்.”[b]
  to: “உனக்காக ஆண்களை அனுப்பு; நான் இஸ்ரவேலின் மக்களுக்குக்[b] கொடுக்கிற கானான் நாட்டை அவர்கள் ஆராய்ந்து பார்க்கட்டும்.[a] ஒவ்வொரு மூதாதையர் கோத்திரத்திலிருந்தும் ஒருவனை அனுப்புங்கள்; அவர்களுள் ஒவ்வொருவனும் ஒரு தலைவன்.[c]”
  rationale: The revision corrects the footnote placement and supplies the missing lexical note for נָשִׂיא. It also improves the Tamil expression of the ancestral-tribe phrase and renders the final Hebrew nominal clause as a description of the selected men, without changing the passage's meaning or resolving interpretive ambiguity in לְךָ.
