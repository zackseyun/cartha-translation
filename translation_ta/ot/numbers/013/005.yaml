  text: from the tribe of Simeon, Shaphat son of Hori;
translation:
  language: ta
  text: சிமியோன் கோத்திரத்திலிருந்து, ஓரியின் மகன் சாப்பாத்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: מַטֶּה இங்கு இஸ்ரவேலின் ‘கோத்திரம்’ என்பதைக் குறிக்கிறது. பட்டியலின் சூழலில் לְ முன்னொட்டு அந்தக் கோத்திரத்தைச் சேர்ந்த பிரதிநிதியை அறிமுகப்படுத்துகிறது; இயல்பான தமிழில் ‘கோத்திரத்திலிருந்து’ என்று வழங்கப்பட்டுள்ளது.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: கோத்திரத் தலைவரின் பெயரான எபிரெயப் பெயர், தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு முறைக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: שָׁפָט
  choice: சாப்பாத்
  rationale: தனிப்பட்ட பெயர் பொருளாக்கப்படாமல், எபிரெய ஒலிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்ச அடையாள அமைப்பான ‘X-ன் மகன்’ என்பதை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: חוֹרִי
  choice: ஓரி
  rationale: தனிப்பட்ட பெயர் பொருளாக்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க எபிரெய ח ஒலி தமிழில் இயல்பாக ‘ஓரி’ என வழங்கப்படுகிறது.
