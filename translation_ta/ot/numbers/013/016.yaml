  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: ta
  text: நாட்டை ஆராய மோசே அனுப்பிய ஆண்களின் பெயர்கள் இவை.[a] நூனின் மகன் ஓசேயாவுக்கு[b] மோசே “யோசுவா” என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டை வேவு பார்க்க.” எபிரெய வினைச்சொல் ஒரு பகுதியை ஆராய்வதையும் உளவறிவுக்காகச் சுற்றிப் பார்ப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஓசேயா என்பது யோசுவாவின் முந்தைய பெயர்; இங்கே மோசே அவருக்கு “யோசுவா” என்று பெயரிடுகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: לָתוּר
  choice: ஆராய்ந்து அறிந்துவர
  rationale: இச்சொல் நிலத்தைச் சுற்றிப் பார்த்து தகவல் அறியும் பணியைக் குறிக்கிறது. தமிழில் இயல்பாகவும், ‘உளவு பார்க்க’ என்ற ஒரே பொருளுக்குள் சுருக்காமலும் இதைத் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு கானான் நாடே சூழலில் குறிக்கப்படுகிறது; நவீனத் தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்களின்
  rationale: சூழலில் பெயரிடப்பட்டவர்கள் ஆண் பிரதிநிதிகள் என்பதால் பாலினக் குறிப்பைத் துல்லியமாகப் பேணுகிறது.
- source_word: וַיִּקְרָא
  choice: பெயரிட்டார்
  rationale: ஒருவரை ஒரு பெயரால் அழைத்தல் அல்லது பெயரிடுதல் என்ற எபிரெயக் கட்டமைப்பின் பொருளை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הוֹשֵׁעַ
  choice: ஓசேயா
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; யோசுவாவின் முந்தைய பெயராக இங்கு வருகிறது.
- source_word: בִּן נוּן
  choice: நூனின் மகன்
  rationale: எபிரெயத் தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: இப்பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவம்.
