translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. பெயர்களுக்கு வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டன; எபிரெயச் சொல்லின் ஆராய்தல்/வேவுபார்த்தல் என்ற பொருள் பரப்பை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பேணுகின்றன.
