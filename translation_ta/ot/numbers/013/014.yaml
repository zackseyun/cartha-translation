lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பிரதிநிதிகளின் பட்டியலில் לְ முன்னொட்டுடன் வரும் מַטֶּה, பெயரிடப்பட்டவர் எந்தக் கோத்திரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: கோத்திரம் மற்றும் முன்னோரின் இயற்பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: נַחְבִּי
  choice: நக்பி
  rationale: எபிரெய இயற்பெயர்; חְ மெய்யொலியைத் தமிழில் அண்மையாகக் காட்ட ‘க்’ பயன்படுத்தப்பட்டு, பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுவழிப் பெயரமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தரும் தமிழ் சொல்.
- source_word: וָפְסִי
  choice: வாப்சி
  rationale: மசோரா உயிர்க்குறிப்புகளுடன் உள்ள எபிரெய வடிவத்துக்கு அண்மையாக ‘வாப்சி’ எனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
