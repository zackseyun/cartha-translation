translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வடிவம். இவ்வசனத்தின் பெயர்க்குறிப்பு சார்ந்த ஆங்கில அடிக்குறிப்பு நப்தலியுடன் தவறாக இணைக்கப்பட்டதாகத் தோன்றுவதாலும், தமிழ் ஒலிபெயர்ப்பில் தேவையான உண்மையான மாற்றுவடிவத்தை வழங்காததாலும் சேர்க்கப்படவில்லை.
