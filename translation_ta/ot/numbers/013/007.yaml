  text: from the tribe of Issachar, Igal son of Joseph;
translation:
  language: ta
  text: இசக்கார் கோத்திரத்திலிருந்து, யோசேப்பின் மகன் இகால்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பிரதிநிதிகள் பட்டியலில், לְ முன்னொட்டுடன் வரும் מַטֶּה ஒருவர் எந்தக் கோத்திரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகமப் பெயரெழுத்தாக்கம்.
- source_word: יִגְאָל
  choice: இகால்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை அண்மையாகப் பிரதிபலிக்கும் தமிழ்ப் பெயரெழுத்தாக்கம்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச அடையாளமாக வரும் இக்கட்டமைப்பில் בֶּן என்பதன் நேரடியான பொருள் ‘மகன்’; ‘வழித்தோன்றல்’ என்று விரிவுபடுத்துவதற்கு சூழலில் காரணமில்லை.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகமப் பெயரெழுத்தாக்கம்; வேற்றுமைத் தொடர்பில் உரையில் ‘யோசேப்பின்’ என வருகிறது.
