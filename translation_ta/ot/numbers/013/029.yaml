  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: ta
  text: அமலேக்கியர் நெகேப் நிலப்பகுதியில்[a] குடியிருக்கிறார்கள்[b]. ஏத்தியரும் எபூசியரும் எமோரியரும் மலைநாட்டில் குடியிருக்கிறார்கள். கானானியர் கடலருகிலும் யோர்தானை ஒட்டியும்[c] குடியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நெகேப்’ என்பதை ‘தென்பகுதி’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது கானானின் தெற்கிலுள்ள குறிப்பிட்ட வறண்ட நிலப்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘குடியிருக்கிறார்கள்’ என்பதற்கு ‘வசிக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயப் பெயரெச்ச வடிவம் நிலையான குடியிருப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘யோர்தானின் பக்கத்தில்’; அதாவது, யோர்தானுக்கு அருகில் அல்லது அதை ஒட்டிய பகுதியில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: அமலேக்கியர்
  rationale: இங்கு ‘அமாலேக்’ என்பது அந்த இனத்தாரைக் குறிக்கும் கூட்டுப்பெயர்; தமிழில் மக்களினப் பெயராக இயல்பாக வழங்கப்பட்டது.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: குடியிருக்கிறார்கள்
  rationale: ישב என்பதன் நிகழ்காலப் பெயரெச்ச வடிவம் தற்காலிகமாக இருப்பதைவிட ஒரு பகுதியில் நிலையாக வசிப்பதைச் சுட்டுகிறது; ‘குடியிருக்கிறார்கள்’ இந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: நெகேப் நிலப்பகுதியில்
  rationale: אֶרֶץ என்பதன் நிலப்பகுதி என்ற கருத்தையும், נֶגֶב என்பதன் புவியியல் பெயரையும் இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַחִתִּי
  choice: ஏத்தியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள கூட்டினப் பெயர்; தமிழில் மக்களினத்தைக் குறிக்கும் இயல்பான பன்மை மரியாதை வடிவில் வழங்கப்பட்டது.
- source_word: הַיְבוּסִי
  choice: எபூசியர்
  rationale: கூட்டினத்தைக் குறிக்கும் பெயராகத் தமிழில் வழங்கப்பட்டது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: கூட்டினத்தைக் குறிக்கும் பெயராகத் தமிழில் வழங்கப்பட்டது.
- source_word: בָּהָר
  choice: மலைநாட்டில்
  rationale: הַר இங்கு தனி மலையைக் காட்டிலும் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது; ‘மலைநாடு’ புவியியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: கூட்டினத்தைக் குறிக்கும் பெயராகத் தமிழில் வழங்கப்பட்டது.
- source_word: עַל הַיָּם
  choice: கடலருகிலும்
  rationale: எபிரெயச் சொற்றொடர் கடலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; எந்தக் கடல் என்று மூலத்தில் சொல்லப்படாததால் அதைச் சேர்க்கவில்லை.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: யோர்தானை ஒட்டியும்
  rationale: சொல்லுக்கு சொல் ‘யோர்தானின் பக்கத்தில்’ என்றாலும், இச்சொல்லடை நதியை ஒட்டிய பகுதியைக் குறிக்கிறது; தமிழில் ‘ஒட்டியும்’ இயல்பான புவியியல் வெளிப்பாடு.
