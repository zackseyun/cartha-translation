source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: ta
  text: அந்த நாடு எப்படிப்பட்டது என்பதையும், அதில் குடியிருக்கும் மக்கள் வலிமையானவர்களா பலவீனமானவர்களா, எண்ணிக்கையில் குறைவானவர்களா அதிகமானவர்களா என்பதையும் பார்த்தறியுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: பார்த்தறியுங்கள்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதையும், உளவுப் பணியின் சூழலில் ஆராய்ந்து அறியும் கட்டளையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: הָאָרֶץ מַה הִוא
  choice: அந்த நாடு எப்படிப்பட்டது
  rationale: சொல்லுக்குச் சொல் ‘அது என்ன’ என்றாலும், இங்கு நாட்டின் தன்மை அல்லது நிலைமையை மதிப்பிடுவதே பொருள்; ‘எப்படிப்பட்டது’ அந்த திறந்த மதிப்பீட்டு அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: அதில் குடியிருக்கும் மக்கள்
  rationale: எபிரெயில் சொல்லுக்குச் சொல் ‘அதன்மேல் குடியிருக்கும் மக்கள்’; ஒரு நாட்டில் வாழ்வதைக் குறிக்க நவீனத் தமிழில் ‘அதில் குடியிருக்கும்’ என்பது இயல்பானது.
- source_word: הֶחָזָק
  choice: வலிமையானவர்களா
  rationale: חזק இங்கு மக்களின் வலிமையை மதிப்பிடுகிறது; ‘வலிமையான’ என்பது தெளிவான, பொதுவான தமிழ் இணைச்சொல்.
- source_word: הֲרָפֶה
  choice: பலவீனமானவர்களா
  rationale: רפה இங்கு חזק என்பதற்கு எதிராக வலிமையின்மையைக் குறிக்கிறது; ‘பலவீனமான’ அந்த எதிரிணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמְעַט
  choice: எண்ணிக்கையில் குறைவானவர்களா
  rationale: מעט இங்கு மக்களின் எண்ணிக்கையைக் குறிக்கிறது; ‘எண்ணிக்கையில்’ என்பது தரம் அல்லது ஆற்றல் அல்ல, எண்ணளவே கேட்கப்படுகிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: רָב
  choice: அதிகமானவர்களா
  rationale: רב என்பது מעט என்பதற்கு எதிராக எண்ணிக்கையில் மிகுதியைக் குறிக்கிறது; முன்வரும் ‘எண்ணிக்கையில்’ இதற்கும் பொருந்துகிறது.
- source_word: אִם
  choice: …ஆ …ஆ
  rationale: மாற்றுத் தேர்வுகளைக் கொண்ட மறைமுக வினாவைத் தமிழில் இயல்பாகக் காட்ட இணை வினா வடிவம் பயன்படுத்தப்பட்டுள்ளது.
