translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified கட்டளைநடை. ‘பார்த்தறியுங்கள்’ என்பது வெறும் பார்வையைவிட ஆய்ந்து அறியும் பணியை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் இரண்டு எதிரிணைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
