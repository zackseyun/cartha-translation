  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: ta
  text: அவர்கள் வாழும் அந்த நாடு எப்படிப்பட்டது? அது நல்லதா, கெட்டதா? அவர்கள் வாழும் நகரங்கள் எப்படிப்பட்டவை? அவை முகாம்களைப் போன்ற குடியிருப்புகளா அல்லது அரணமைந்த இடங்களா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முகாம்களிலா ... கோட்டைகளிலா?” எபிரெய மொழி முகாம்போன்ற குடியிருப்புகளையும் அரணமைந்த இடங்களையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: அந்த நாடு எப்படிப்பட்டது?
  rationale: וּמָה இங்கு நாட்டின் தன்மை அல்லது நிலை குறித்த கேள்வியை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘எப்படிப்பட்டது?’ என்பது இதன் விசாரணைத் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: அவர்கள் வாழும்
  rationale: எபிரெய உரையில் ஒருமை வடிவம் இருந்தாலும், அது அந்நாட்டில் வாழும் மக்களைத் தொகுப்பாகச் சுட்டுகிறது. தமிழில் குழுவைக் குறிக்கும் ‘அவர்கள்’ இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் உள்ளது.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: அது நல்லதா, கெட்டதா?
  rationale: ‘நல்லது/கெட்டது’ என்ற எபிரெய மொழியின் பரந்த மதிப்பீட்டைத் தக்கவைத்து, அதை வளம் அல்லது விவசாயத் தரம் என்று மட்டும் குறுக்கவில்லை.
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עָרִים என்பதற்கான வழக்கமான பொருள்; அடுத்துவரும் பாதுகாப்பு அமைப்பு குறித்த வேறுபாட்டுக்கும் ஏற்றது.
- source_word: הַבְּמַחֲנִים
  choice: முகாம்களைப் போன்ற குடியிருப்புகள்
  rationale: מַחֲנִים என்பது முகாம்கள் அல்லது முகாம்போன்ற, அரணற்ற குடியிருப்புகளைக் குறிக்கலாம். வெறும் ‘முகாம்கள்’ என மொழிபெயர்த்தால் நகரங்களைப் பற்றிய கேள்வியில் தற்காலிக இராணுவ முகாம்கள் என்ற தவறான எண்ணம் தோன்றலாம் என்பதால் ஒப்புமை வெளிப்படுத்தப்பட்டது.
- source_word: בְּמִבְצָרִים
  choice: அரணமைக்கப்பட்ட இடங்கள்
  rationale: מִבְצָרִים பாதுகாப்பு அரண்களைக் கொண்ட இடங்கள் அல்லது கோட்டைகளைக் குறிக்கிறது. முகாம்போன்ற குடியிருப்புகளுடனான எதிர்மறை ஒப்பீட்டை இது தெளிவாகப் பாதுகாக்கிறது.
