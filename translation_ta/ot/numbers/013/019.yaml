translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஒருமைக் கூட்டுப்பொருள் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளது; முகாம்கள்–அரணிடங்கள் என்ற மூலமொழி வேறுபாடு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
