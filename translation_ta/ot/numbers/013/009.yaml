  text: from the tribe of Benjamin[a], Palti son of Raphu.
translation:
  language: ta
  text: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ராபூவின் மகன் பல்தி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பட்டியலில் לְ முன்னொட்டுடன் வரும் מַטֶּה, பெயரிடப்பட்டவர் எந்தக் கோத்திரத்தைச் சேர்ந்த பிரதிநிதி என்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִנְיָמִן
  choice: பென்யமீன்
  rationale: எபிரெயப் பெயரின் தமிழ் வேதாகம வழக்குக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: פַּלְטִי
  choice: பல்த்தி
  rationale: தனிநபர் பெயரை அதன் எபிரெய ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுவழிப் பெயரமைப்பில் தந்தை–மகன் உறவைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: רָפוּא
  choice: ராப்பூ
  rationale: எபிரெய தனிநபர் பெயரின் உயிர் மற்றும் மெய்யொலிகளைத் தமிழில் இயன்றவரை நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
