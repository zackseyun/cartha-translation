revisions:
- from: பென்யமீன் கோத்திரத்திலிருந்து[a], ராப்பூவின் மகன் பல்த்தி.
  to: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ராபூவின் மகன் பல்தி.
  rationale: The revision corrects the transliteration of both personal names according to the Hebrew consonants and uses an idiomatic Tamil expression for the tribal affiliation signaled by לְמַטֵּה. The footnote retains the viable prepositional alternatives and remains anchored to the affiliation phrase.
