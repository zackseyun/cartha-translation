translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வடிவின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; கோத்திரச் சார்பைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
