  source_fidelity: மூல எபிரெயத்தின் எதிர்மறை இணைப்பு, காலேபுடன் சென்ற உளவாளிகள், இயலாமைக் கூற்று, மக்களுக்கு எதிரான முன்னேற்றம், மற்றும் கூட்டுப்பெயரின் ஒப்பீட்டுப் பொருள் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. “சென்றிருந்த” என்பது עָלוּ-வின் ‘மேலே சென்றனர்’ என்ற இடவியல் நுணுக்கத்தை வெளிப்படையாகக் கூறாதபோதிலும், இச்சூழலில் பொருளைச் சிதைக்காமல் இயல்பான தமிழில் உள்ளது.
  naturalness: நடை நவீன பொதுத்தமிழில் தெளிவாகவும் வாசிப்பிற்கு இயல்பாகவும் உள்ளது. “நம்மால் முடியாது,” “மக்களுக்கு எதிராகச் செல்ல,” “நம்மைவிட வலிமையானவர்கள்” ஆகியவை நேரடியும் பொருத்தமானவையும் ஆகும்.
