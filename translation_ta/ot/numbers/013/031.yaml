translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் ஒப்பீட்டுப் பொருளும் இராணுவச் சூழலும் காக்கப்பட்டுள்ளன; சொல்லுக்குச் சொல் வடிவால் தமிழில் ஏற்படும் இயல்பின்மைகள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
