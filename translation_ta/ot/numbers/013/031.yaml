  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: ta
  text: ஆனால் அவனோடு சென்றிருந்த ஆண்கள், “அந்த மக்களுக்கு எதிராகச் செல்ல[a] நம்மால் முடியாது; ஏனெனில் அவர்கள் நம்மைவிட வலிமையானவர்கள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அந்த மக்களிடம் மேலே செல்ல.” இச்சூழலில் அது போரிடுவதற்காக அந்த மக்களுக்கு எதிராகச் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் “மக்கள்” என்பதும் அதைச் சுட்டும் சொற்களும் ஒருமையில் உள்ளன. அது ஒரு மக்கள் கூட்டத்தைக் குறிப்பதால் தமிழில் பன்மையாக வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ஆனால் ... ஆண்கள்
  rationale: וְ இங்கு முந்தைய வசனத்தில் காலேப் கூறியதற்கு மாறான கருத்தை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘ஆனால்’ என வழங்கப்பட்டது; אֲנָשִׁים என்பதற்கு ‘ஆண்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: அவனோடு சென்றிருந்த
  rationale: இவர்கள் காலேபுடன் முன்பே சென்றவர்கள் என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது. עָלוּ என்பதன் அடிப்படைப் பொருள் ‘மேலே சென்றார்கள்’ என்றாலும், இச்சூழலில் தமிழில் வெறும் ‘சென்றிருந்த’ என்பதே இயல்பானது.
- source_word: אָמְרוּ
  choice: என்றார்கள்
  rationale: நேரடிக் கூற்றைத் தொடர்ந்து வரும் இயல்பான தமிழ் இறந்தகாலச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא נוּכַל
  choice: நம்மால் முடியாது
  rationale: יכל குறிக்கும் திறன் அல்லது இயலாமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: அந்த மக்களுக்கு எதிராகச் செல்ல
  rationale: עלה என்பதன் நகர்வுப் பொருளை ‘செல்ல’ தக்கவைக்கிறது; இராணுவ மோதல் சூழலில் אֶל adversative பொருள் கொள்வதால் ‘எதிராக’ பயன்படுத்தப்பட்டது. குறிக்கப்பட்ட மக்கள் முன்பே குறிப்பிடப்பட்டவர்கள் என்பதால் ‘அந்த மக்கள்’ என வழங்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் செல்ல இயலாது என்று கூறியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: அவர்கள் நம்மைவிட வலிமையானவர்கள்
  rationale: הָעָם ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; பலரைக் குறிக்கும் அதன் கூட்டுப் பொருளை இயல்பான தமிழில் பன்மையாக வழங்குகிறது. מִן என்பதன் ஒப்பீட்டுப் பொருள் ‘நம்மைவிட’ எனப் பாதுகாக்கப்பட்டது.
