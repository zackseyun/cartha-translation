base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: ta
  text: அங்கே நெபிலீம்களைக் கண்டோம்—அவர்கள் நெபிலீம்களிலிருந்து வந்த ஏனாக்கின் மகன்கள்[a]. எங்கள் பார்வையில் நாங்கள் வெட்டுக்கிளிகளைப்போல் இருந்தோம்; அவர்கள் பார்வையிலும் அப்படியே இருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெபிலீம்கள்” என்பதற்கு மரபுவழியாக “இராட்சதர்கள்” என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரேயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றதால், முதன்மை உரையில் அது ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: நெபிலீம்கள்
  rationale: எபிரேயச் சொல்லின் குறிப்பு உறுதியற்றதும் பண்பாட்டு-இறையியல் பொருள் நிறைந்ததுமாக இருப்பதால், ‘இராட்சதர்கள்’ அல்லது ‘விழுந்தவர்கள்’ என்று விளக்கிப் பொருள் கட்டாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּנֵי עֲנָק
  choice: ஏனாக்கின் மகன்கள்
  rationale: எபிரேய மரபுவழி உறவுச் சொல்லை நெருக்கமாகப் பேணுகிறது; சூழலில் இது சந்ததியினரையோ குலத்தினரையோ குறிக்கலாம்.
- source_word: מִן הַנְּפִלִים
  choice: நெபிலீம்களிலிருந்து வந்த
  rationale: மூலம் அல்லது வம்சத் தொடர்பைக் குறிக்கும் מן என்பதன் பொருளைப் பேணுகிறது; அந்த உறவின் துல்லிய இயல்பை மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: எங்கள் பார்வைக்கு நாங்கள் ... இருந்தோம்
  rationale: இது அவர்களது சுயமதிப்பீட்டைக் குறிக்கும் எபிரேய மரபுத்தொடர்; இயல்பான தமிழில் உணர்வுசார் ஒப்பீடாக வழங்கப்படுகிறது.
- source_word: כַּחֲגָבִים
  choice: வெட்டுக்கிளிகளைப்போல்
  rationale: חגב என்பது வெட்டுக்கிளி வகை பூச்சியைக் குறிக்கிறது; இங்கு மிகச் சிறியவர்களாகத் தோன்றியதை உணர்த்தும் உவமை.
- source_word: וְכֵן
  choice: அப்படியே
  rationale: முந்தைய ஒப்பீட்டைத் தொடர்ந்து, அதே நிலை அவர்களுடைய பார்வையிலும் இருந்ததாகச் சுருக்கமாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: בְעֵינֵיהֶם
  choice: அவர்கள் பார்வைக்கும்
  rationale: ‘எங்கள் பார்வைக்கு’ என்பதுடன் உள்ள சொல்லாட்சிச் சமச்சீரைப் பேணுகிறது.
theological_decisions:
- issue: נְפִילִים என்பதன் பொருள்
  choice: நெபிலீம்கள்
  alternative: இராட்சதர்கள்; விழுந்தவர்கள்
  rationale: ஆதியாகமம் 6:4-லும் வரும் இச்சொல்லின் பொருள் விவாதத்திற்குரியது. எபிரேயத்தால் கட்டாயப்படுத்தப்படாத ஓர் இறையியல் அல்லது புராணவியல் விளக்கத்தைப் புகுத்தாமல், மூலத்தின் தெளிவின்மையை ஒலிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேயத்தின் மீளுரைப்பும் ‘எங்கள் பார்வை / அவர்கள் பார்வை’ என்ற சொல்லாட்சிச் சமச்சீரும் இயன்றவரை பேணப்பட்டுள்ளன.
