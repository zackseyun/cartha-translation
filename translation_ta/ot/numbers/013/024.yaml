  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: ta
  text: அந்த இடம், இஸ்ரவேலின் மகன்கள் அங்கிருந்து வெட்டியெடுத்த குலையின் காரணமாக, எஷ்கோல் பள்ளத்தாக்கு என்று அழைக்கப்பட்டது[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘எஷ்கோல் ஓடைப்படுகை’ அல்லது ‘எஷ்கோல் கணவாய்’; எபிரெய நாஹல் என்ற சொல் பருவகால நீரோடைப் படுகையையோ அதனுடன் தொடர்புடைய பள்ளத்தாக்கையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எஷ்கோல் என்ற பெயர், ‘குலை’ என்பதற்கான எபிரெயச் சொல்லைப்போலவே ஒலிக்கிறது. இஸ்ரவேலின் மகன்கள் அங்கு வெட்டியெடுத்த குலையின் காரணமாக அந்த இடம் இவ்வாறு பெயரிடப்பட்டது.
    reason: cultural_note
  - marker: c
    text: அல்லது ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: அந்த இடம்
  rationale: முன்பு குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் எபிரெய வரையறுத்த சுட்டுத் தொடரை இயல்பான நவீனத் தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: קָרָא
  choice: அழைக்கப்பட்டது
  rationale: எபிரெயில் மூன்றாம் நபர் ஆண்பால் ஒருமை வினை இருந்தாலும், பெயரிடுபவர் குறிப்பிடப்படாத இந்த வழக்கில் தமிழில் செயப்பாட்டு வடிவம் இயல்பானது.
- source_word: נַחַל
  choice: பள்ளத்தாக்கு
  rationale: இந்தச் சொல் பருவகால நீரோடைப் படுகை, கணவாய் அல்லது அதனுடன் தொடர்புடைய பள்ளத்தாக்கைக் குறிக்கலாம்; இடப்பெயரில் ‘பள்ளத்தாக்கு’ தெளிவான, இயல்பான தெரிவாகும்.
- source_word: אֶשְׁכּוֹל
  choice: எஷ்கோல்
  rationale: இங்கு சொல் இடப்பெயராக வருவதால் அதன் எபிரெய ஒலியைத் தமிழில் பெயர்ப்பெழுதுகிறது.
- source_word: עַל אֹדוֹת
  choice: காரணமாக
  rationale: அந்தப் பெயர் சூட்டப்பட்டதற்கான காரணத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאֶשְׁכּוֹל
  choice: குலை
  rationale: மூலத்தில் ‘குலை’ என்றே உள்ளது; முந்தைய வசனச் சூழல் அது திராட்சைக்குலை என்பதைத் தெரிவிப்பதால் இவ்வசனத்தில் ‘திராட்சை’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: வெட்டியெடுத்த
  rationale: குலையைச் செடியிலிருந்து வெட்டிப் பெற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: குறிப்பிட்ட அதே இடத்திலிருந்து எடுத்ததைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய குடும்ப அடையாளத் தொடரின் வடிவத்தையும் ஆண்பால் குறிப்பையும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: பெரிய கோட்பாட்டுச் சிக்கல் எதுவும் இல்லை. எனினும், மூலத்தின் குடும்ப அடையாள மொழியையும் ‘மகன்கள்’ என்ற ஆண்பால் வடிவத்தையும் பிரதான உரை பாதுகாக்கிறது; இயல்பான இனப்பெயர் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘குலை’ என்பதில் சூழல் தரும் ‘திராட்சை’ பிரதான உரையில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
