  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: சுட்டிடமான ‘அந்த இடம்,’ பெயரிடப்பட்டதைக் குறிக்கும் செயப்பாட்டு வடிவம், נחל என்பதற்கான பொருத்தமான ‘பள்ளத்தாக்கு,’ காரணப் பொருள், அங்கிருந்து வெட்டியெடுத்த குலை, மற்றும் בְּנֵי יִשְׂרָאֵל என்பதன் ‘இஸ்ரவேலின் மகன்கள்’ ஆகியவை சரியாக உள்ளன. ‘குலை’ என்பது உடனடி சூழலில் திராட்சைக் குலையைக் குறித்தாலும், வசனத்தில் வெளிப்படையாக இல்லாத ‘திராட்சை’ சேர்க்கப்படாதது நல்லது.'
  naturalness: நடை நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. காரணத் தொடரை இடைநிறுத்திக் கொண்டு வரும் சொல்வரிசை வாசிக்கத் தெளிவாக உள்ளது. ‘எஷ்கோல் பள்ளத்தாக்கு என்று அழைக்கப்பட்டது’ என்பது நிலையான இடப்பெயர் நடையாக அமைந்துள்ளது.
