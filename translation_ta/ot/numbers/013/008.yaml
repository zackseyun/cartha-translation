  text: לְ/מַטֵּ֥ה אֶפְרָ֖יִם הוֹשֵׁ֥עַ בִּן נֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/008.yaml
  text: from the tribe of Ephraim[a], Hoshea son of Nun[b];
translation:
  language: ta
  text: எப்பிராயீம் கோத்திரத்திலிருந்து, நூனின் மகன் ஓசேயா[a][b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓசேயா என்பது பின்னர் யோசுவா என்று அழைக்கப்பட்டவரின் முந்தைய பெயர் (எண்ணாகமம் 13:16-ஐப் பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: இந்தப் பெயரைத் தமிழில் ‘ஓசியா’ என்றும் ஒலிபெயர்க்கலாம். ஓசியா தீர்க்கதரிசியிடமிருந்து இவரை வேறுபடுத்திக் காட்ட இங்கு ‘ஓசேயா’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பிரதிநிதிகளின் பட்டியலில் לְ உடன் வரும் מַטֶּה, அவர் எந்தக் கோத்திரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது. பட்டியல் நடைக்கு இயல்பாகவும் சுருக்கமாகவும் இருப்பதால் ‘கோத்திரத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶפְרָיִם
  choice: எப்பிராயீம்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הוֹשֵׁעַ
  choice: ஓசேயா
  rationale: இது பின்னர் யோசுவா எனப் பெயரிடப்பட்ட மனிதரின் முந்தைய பெயர். எபிரெய மூலத்தின் ஒலியை நெருக்கமாகக் காட்டவும், தீர்க்கதரிசி ஓசியாவுடன் ஏற்படக்கூடிய குழப்பத்தைக் குறைக்கவும் ‘ஓசேயா’ பயன்படுத்தப்பட்டது.
- source_word: בִּן
  choice: மகன்
  rationale: எபிரெய மரபுப்பெயர்க் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது; ‘நூனின் மகன்’ என்பது பட்டியல் நடைக்குப் பொருத்தமானது.
- source_word: נוּן
  choice: நூன்
  rationale: எபிரெயச் சொந்தப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
