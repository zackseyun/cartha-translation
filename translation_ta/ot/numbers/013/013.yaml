  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள வடிவம். மூலத்தின் தொடரமைப்பைத் தக்கவைக்க இறுதியில் அரைப்புள்ளி இடப்பட்டுள்ளது.
