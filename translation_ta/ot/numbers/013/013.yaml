  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தக் கோத்திரப் பிரதிநிதிகளின் பட்டியலில், לְ முன்னொட்டுடன் வரும் מַטֶּה, பெயரிடப்பட்டவர் எந்தக் கோத்திரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது. நவீன தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது அந்த உறவை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: סְתוּר
  choice: சேத்தூர்
  rationale: மசோரா உயிர்க்குறிப்புகளுடன் கூடிய எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: בֶּן + தனிப்பெயர் என்ற தந்தைவழி அடையாள அமைப்பைத் தமிழில் இயல்பாக ‘…இன் மகன்’ என்று வழங்குகிறது.
- source_word: מִיכָאֵל
  choice: மிகாயேல்
  rationale: எபிரெய מִיכָאֵל என்ற பெயரை அதன் மூல ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
