  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: ta
  text: மோசே அவர்களைக் கானான் நாட்டை ஆராய அனுப்பினார்[a]. அவர் அவர்களிடம், “இந்த வழியாக நெகேபுக்குள் ஏறிச் செல்லுங்கள்[b]; மலைநாட்டுக்கும் ஏறிச் செல்லுங்கள்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கானான் நாட்டை உளவு பார்க்க.”
    reason: lexical_alternative
  - marker: b
    text: “நெகேபு” என்பது தெற்கிலுள்ள வறண்ட நிலப்பகுதி.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மலைகளுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் வழக்கமான இறந்தகாலக் கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לָתוּר
  choice: ஆராய
  rationale: நிலத்தைப் பற்றித் தகவல் திரட்டிப் பார்வையிடுவதைக் குறிக்கிறது; இரகசிய உளவுச் செயலாக மட்டும் பொருளைக் குறுக்காமல் உள்ளது.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாடு
  rationale: கானான் எனப்பட்ட நிலப்பரப்பைக் குறிக்கும் எபிரெயக் கூட்டுத்தொடரை இயல்பான தமிழில் முழுமையாகத் தருகிறது.
- source_word: עֲלוּ זֶה בַּנֶּגֶב
  choice: இந்த வழியாக நெகேபுக்குள் ஏறிச் செல்லுங்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய பயண உணர்வையும், זֶה என்பதன் வழிகாட்டும் வினையடைப் பயன்பாட்டையும், בַּנֶּגֶב என்பதன் இலக்கிட/பகுதி உணர்வையும் காக்கிறது.
- source_word: וַעֲלִיתֶם
  choice: ஏறிச் செல்லுங்கள்
  rationale: முந்தைய கட்டளையைத் தொடரும் கட்டளைப் பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: இங்கு ஒரு தனி மலையைவிட உயர்நில மலைப்பகுதியைக் குறிப்பதால் சூழலுக்கேற்ற தேர்வு; ‘மலைகள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
