base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: ta
  text: அவர்கள் ஆராய்ந்து பார்த்த அந்த நாட்டைப் பற்றி இஸ்ரவேல் மக்களிடம் ஒரு மோசமான அறிக்கையைப் பரப்பி[a], “ஆராய்வதற்காக நாங்கள் கடந்து சென்ற அந்த நாடு தன் குடியிருப்பவர்களை விழுங்கும் நாடு[b]; அதில் நாங்கள் கண்ட மக்கள் அனைவரும் மிகப் பெரிய உடலமைப்புள்ள ஆண்கள்[c]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒரு தீய அறிக்கையை வெளிக்கொணர்ந்தார்கள்”; “அந்த நாட்டைப் பற்றி அவதூறு பரப்பினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தன் குடியிருப்பவர்களை உட்கொள்ளும் நாடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “அளவுடைய ஆண்கள்”; இங்கு மிகப் பெரிய அல்லது உயரமான உடலமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: மோசமான செய்தியைப் பரப்பி
  rationale: ‘ஒரு தீய செய்தியை வெளியே கொண்டுவருதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது. இங்கு ‘அவதூறு செய்தார்கள்’ என்பது சாத்தியமானாலும், பிரதான உரையில் குற்றச்சாட்டின் வலிமையை அதிகரிக்காமல் இருக்க இத்தேர்வு செய்யப்பட்டது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இச்சூழலில் வாக்குத்தத்தம் செய்யப்பட்ட புவியியல் நிலப்பகுதியைக் குறிக்கிறது; ‘தேசம்’ என்பதைக் காட்டிலும் ‘நாடு’ சாதாரண வாசகருக்கு இயல்பாக உள்ளது.
- source_word: תָּרוּ / לָתוּר
  choice: உளவறிந்த / உளவறியும்படி
  rationale: வினைச்சொல் ஆராய்தல் அல்லது வேவுபார்த்தலைக் குறிக்கிறது. பயணத்தின் உளவு நோக்கத்தையும் ஆய்வு செய்த கருத்தையும் ‘உளவறிதல்’ சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடம்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்களிடம்.’ ஆனால் இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்கமான கூட்டுப் பெயராக இருப்பதால், இயல்பான தமிழில் ‘மக்களிடம்’ என வழங்கப்படுகிறது.
- source_word: עָבַרְנוּ בָהּ
  choice: கடந்து சென்ற
  rationale: நாட்டின் வழியாகச் சென்ற இயக்கத்தை இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: தன் குடியிருப்பாளர்களை விழுங்கும் நாடு
  rationale: אֹכֶלֶת என்பதன் வலிமையான உருவகத்தை ‘விழுங்கும்’ தக்கவைக்கிறது; அதன் துல்லியமான நோக்கம் விளக்கப்படாமல் மூலத்தின் பதற்றமும் மிகைப்படுத்தப்பட்ட பேச்சுத் தன்மையும் நிலைக்கிறது.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: மிகப் பெரிய உடலமைப்புள்ள ஆண்கள்
  rationale: உடல் அளவில் அசாதாரணமான பெரியவர்களைக் குறிக்கிறது. ‘உயர்ந்த அந்தஸ்துள்ளவர்கள்’ என்ற தவறான சமூகப் பொருள் ஏற்படாதவாறு உடலமைப்பு வெளிப்படையாகச் சொல்லப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்களிடம்
  alternative: இஸ்ரவேலின் மகன்களிடம்
  rationale: எபிரெய வடிவம் இலக்கணரீதியாக ‘மகன்கள்’ என்றாலும், இவ்விடத்தில் அது இஸ்ரவேல் சமூகத்துக்கான நிலையான கூட்டுப் பெயர். நவீன தமிழில் அதன் குறிப்பைத் தெளிவாகத் தர ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; அடிச்சொல் வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- issue: ‘தன் குடியிருப்பாளர்களை விழுங்கும் நாடு’ என்ற கூற்றின் விளக்கம்
  choice: உருவகத்தை விளக்காமல் அப்படியே வைத்தல்
  alternative: போர், பஞ்சம் அல்லது நோய் மக்களை அழிக்கும் நாடு என்று விளக்குதல்
  rationale: மூலம் அழிவுக்கான குறிப்பிட்ட காரணத்தைச் சொல்லவில்லை. எந்த ஓர் விளக்கத்தையும் பிரதான உரையில் சேர்ப்பது மூலத்தின் உண்மையான தெளிவின்மையைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. விவரணப் பகுதியில் ‘உளவறிதல்’ என்றும், அச்சுறுத்தலைச் சொல்லும் நேரடி உரையில் வலிமையான ‘விழுங்கும்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
