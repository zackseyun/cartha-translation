  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: ta
  text: மோசே அவர்களைப் பாரான் வனாந்தரத்திலிருந்து யாவேயின் கட்டளையின்படி அனுப்பினார்.[a] அவர்கள் அனைவரும் இஸ்ரவேல் மக்களின் தலைவர்களான ஆண்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “யாவேயின் வார்த்தையின்படி.” எபிரெய மொழிமரபின் சொற்பொருள்: “யாவேயின் வாயின்படி.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழிமரபை இன்னும் சொற்படியாக, “இஸ்ரவேலின் புதல்வர்களுடைய தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்ற வினை இங்கு தொடர்ச்சியான இறந்தகாலக் கதைநடையைத் தருகிறது; ‘அனுப்பினார்’ என்பது இயல்பான, துல்லியமான தமிழ் வடிவம்.
- source_word: מִמִּדְבַּר פָּארָן
  choice: பாரான் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது பயிரிடப்படாத வனாந்தரப் பகுதியைக் குறிக்கலாம்; ‘வனாந்தரம்’ வேதாகமப் புவியியல் நடைக்கு ஏற்றதுடன், அவசியமின்றி முற்றிலும் வறண்ட பாலைவனமாகக் குறுக்குவதையும் தவிர்க்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளையின்படி
  rationale: ‘யாவேயின் வாயின்மேல்’ என்பது சொற்பொருள்; சூழலில் அது அவருடைய சொல் அல்லது கட்டளைக்கு இணங்கச் செய்ததைக் குறிக்கும் எபிரெய மொழிமரபு. இயல்பான தமிழில் ‘கட்டளையின்படி’ அதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தெய்வீகத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: அவர்கள் அனைவரும் ஆண்கள்
  rationale: כֻּלָּם குழுவின் முழுமையை வலியுறுத்துகிறது; אֲנָשִׁים இங்கு கோத்திரங்களின் ஆண் பிரதிநிதிகளைக் குறிப்பதால் பாலினத் தகவல் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் தலைவர்கள்
  rationale: רָאשֵׁי என்பதன் சூழல்சார் பொருள் ‘தலைவர்கள்’; בְנֵי יִשְׂרָאֵל என்ற குடும்பவழி எபிரெயச் சொல்லாட்சியை நவீன தமிழில் இயல்பாக ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது. அதன் சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הֵמָּה
  choice: அவர்கள் ... ஆண்கள்
  rationale: தனித்த சுட்டுப்பெயர் தரும் வலியுறுத்தல், முந்திய ‘அவர்கள் அனைவரும்’ என்பதிலேயே இயல்பாக வெளிப்படுகிறது; தேவையற்ற மறுபதிப்பு தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரையே பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: אֲנָשִׁים என்பதிலுள்ள பாலினத் தகவல்
  choice: ஆண்கள்
  alternative: மனிதர்கள்; நபர்கள்
  rationale: இங்கு அனுப்பப்பட்ட கோத்திரப் பிரதிநிதிகள் ஆண்கள் என்று எபிரெய உரை குறிப்பதால், பாலின வேறுபாட்டை நீக்கும் பொதுச் சொல்லைப் பயன்படுத்தவில்லை.
- issue: בְנֵי יִשְׂרָאֵל என்ற குடும்பவழிச் சொல்லாட்சி
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் புதல்வர்கள்
  rationale: மூலத்தின் சமூக-உடன்படிக்கை சார்ந்த அடையாளத்தைப் பாதுகாத்தபடியே சாதாரண நவீன தமிழில் இயல்பாக வாசிக்க ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமப் புவியியல் நடையைத் தக்கவைக்கிறது; மற்ற சொற்றொடர்கள் தேவையற்ற பழமைநடையின்றி பொதுவாசகர்களுக்குப் புரியுமாறு வழங்கப்பட்டுள்ளன. இரு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
