  text: 'யோசேப்பின் கோத்திரத்திலிருந்து, மனாசேயின் கோத்திரத்திலிருந்து: சூசியின் மகன் காதி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பட்டியலில் לְ என்பது அந்தப் பிரதிநிதியின் கோத்திரச் சார்பைச் சுட்டுகிறது; ‘கோத்திரத்திலிருந்து’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் கோத்திரத்திலிருந்து
  rationale: யோசேப்பின் வழியில் இங்கு குறிப்பாக மனாசே கோத்திரமே கருதப்படுவதைத் தெளிவுபடுத்தும் எபிரேய மறுபதிப்பை அப்படியே காக்கிறது.
- source_word: גַּדִּי
  choice: கத்தி
  rationale: எபிரேயப் பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச உறவைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: סוּסִי
  choice: சூசி
  rationale: எபிரேயப் பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
