base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: ta
  text: அவர்கள் நெகேபில் ஏறிச் சென்றார்கள்; அவன் எபிரோன் வரை வந்தான்.[a] அங்கே ஏனாக்கின் வழித்தோன்றல்களான அகிமான், சேஷாய், தல்மாய் ஆகியோர் இருந்தார்கள். எபிரோன் எகிப்தின் சோவானுக்கு ஏழு ஆண்டுகளுக்கு முன்பே கட்டப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலப்பாடம் முதலில் “அவர்கள்” என்றும், பின்னர் “அவன்” என்றும் கூறுகிறது; “அவன்” யாரைக் குறிக்கிறது என்பது தெளிவாகச் சொல்லப்படவில்லை.
    reason: மூலத்தில் உள்ள பன்மையிலிருந்து ஒருமைக்கு மாறும் இலக்கணத் தெளிவின்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: நெகேபில்
  rationale: இது தெற்குப் பகுதியைக் குறிக்கும் இடப்பெயர்; பொதுவான திசைச்சொல்லாக மாற்றாமல் ‘நெகேப்’ என ஒலிபெயர்க்கப்பட்டது. ב முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ என இயல்பாகத் தரப்பட்டது.
- source_word: יְלִידֵי הָעֲנָק
  choice: ஏனாக்கின் வழித்தோன்றல்கள்
  rationale: இங்கு அந்தக் குலத்தைச் சேர்ந்தவர்கள் அல்லது சந்ததியினர் என்ற பொருள் இயல்பான தமிழில் தரப்படுகிறது; நேரடியான ‘பிறந்தவர்கள்’ என்பது தமிழில் தவறான நுண்பொருளை ஏற்படுத்தலாம்.
- source_word: נִבְנְתָה לִפְנֵי
  choice: கட்டப்படுவதற்கு ஏழு ஆண்டுகளுக்கு முன்பே ... கட்டப்பட்டிருந்தது
  rationale: இரு நகரங்களின் கட்டுமானக் காலத்தை ஒப்பிடும் எபிரெய அமைப்பைத் தெளிவான தமிழில் வழங்குகிறது; ‘முன்பே’ கால முன்னுரிமையை வலியுறுத்துகிறது.
theological_decisions:
- issue: 'வினைச்சொல்லின் எண்ணிக்கை மாறுதல்: וַיַּעֲלוּ (பன்மை) என்பதற்குப் பின் וַיָּבֹא (ஒருமை)'
  choice: ‘அவர்கள் ... சென்றார்கள்; அவன் ... வந்தான்’ என்று எபிரெய எண்ணிக்கை மாற்றத்தைப் பாதுகாத்தல்
  alternative: ‘அவர்கள் ... வந்து சேர்ந்தார்கள்’ என்று இரண்டையும் பன்மையாக்குதல்
  rationale: மசோரா மூலப்பாடத்தில் உள்ள உண்மையான இலக்கணத் திடீர்மாற்றத்தையும் அதன் தெளிவில்லாத ஒருமை எழுவாயையும் மொழிபெயர்ப்பு அமைதியாகச் சரிசெய்யாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இடப்பெயர்களும் ஆட்பெயர்களும் எபிரெய உச்சரிப்பை நெருங்கிய வகையில் ஒலிபெயர்க்கப்பட்டன; மூலத்தின் ஒருமை–பன்மை பதற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
