  text: from the tribe of Zebulun, Gaddiel son of Sodi;
translation:
  language: ta
  text: செபுலோன் கோத்திரத்திலிருந்து, சோதியின் மகன் கத்தியேல்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பட்டியல் சூழலில் לְ முன்னொட்டுடன் வரும் מַטֶּה, அந்த நபர் எந்தக் கோத்திரத்தின் பிரதிநிதி என்பதைச் சுட்டுகிறது. தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: கோத்திரப் பெயர் அதன் எபிரெய ஒலிப்பை நெருக்கமாகப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גַּדִּיאֵל
  choice: கத்தியேல்
  rationale: தனிப்பெயர் எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; நடுவிலுள்ள இரட்டித்த மெய்யொலி ‘த்தி’ எனக் காட்டப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெயப் பெயர்ப்பட்டியல்களில் தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான கட்டமைப்பு தமிழில் இயல்பாக ‘மகன்’ என வழங்கப்படுகிறது.
- source_word: סוֹדִי
  choice: சோதி
  rationale: தனிப்பெயர் எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
