  register: நவீன நிலையான தமிழில், பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. தொடரின் அமைப்பைத் தக்கவைக்க அரைப்புள்ளி இடப்பட்டுள்ளது.
