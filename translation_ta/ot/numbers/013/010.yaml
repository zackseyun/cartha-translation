  naturalness: “செபுலோன் கோத்திரத்திலிருந்து, சோதியின் மகன் கத்தியேல்” என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. பெயர்ப்பட்டியல் நடைக்கு ஏற்ற சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
