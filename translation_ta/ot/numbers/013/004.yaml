  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: ta
  text: 'அவர்களுடைய பெயர்கள் இவை: ரூபன் கோத்திரத்திலிருந்து சக்கூரின் மகன் சம்மூவா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: וְ இங்கு பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் இயல்பான பட்டியல் அறிமுகத்திற்காக தனியே ‘மேலும்’ சேர்க்காமல், אֵלֶּה என்பதைக் ‘இவை’ என்று மொழிபெயர்த்துள்ளது.
- source_word: שְׁמוֹתָם
  choice: அவர்களுடைய பெயர்கள்
  rationale: ‘அவர்களின் பெயர்கள்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; எபிரெயத்தில் நிகழ்கால இணைப்புவினை வெளிப்படையாக இல்லாததால் தமிழிலும் ‘ஆகும்’ சேர்க்கப்படவில்லை.
- source_word: לְמַטֵּה רְאוּבֵן
  choice: ரூபன் கோத்திரத்திலிருந்து
  rationale: לְ முன்னிடைச்சொல் இப்பட்டியலில் அந்தக் கோத்திரத்தைச் சேர்ந்த பிரதிநிதியை அடையாளப்படுத்துகிறது; ‘கோத்திரத்திலிருந்து’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: שַׁמּוּעַ
  choice: சம்மூவா
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்ச உறவுச் சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: זַכּוּר
  choice: சக்கூர்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: கோத்திரப் பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டது.
