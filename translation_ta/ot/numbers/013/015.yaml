lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தப் பட்டியலில் לְ முன்னொட்டுடன் வரும் מַטֶּה, ஒவ்வொருவரின் கோத்திரச் சார்பையும் பிரதிநிதித்துவத்தையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גָד
  choice: காத்
  rationale: இது கோத்திரத்தின் பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: גְּאוּאֵל
  choice: கேவுவேல்
  rationale: இது தனிப்பெயர்; எபிரெய வடிவிலுள்ள ஒலிகளை இயன்றவரை தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்சவழிக் கட்டமைப்பின் இயல்பான தமிழ் இணை; பெயர்களுக்கு இடையில் ‘மகன்’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: מָכִי
  choice: மாகி
  rationale: இது தனிப்பெயர்; எபிரெய நீண்ட ā உயிரொலியைப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
