base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: ta
  text: அவர்கள் எஸ்கோல் பள்ளத்தாக்குக்கு[a] வந்து, அங்கிருந்து ஒரே திராட்சைக் குலை தொங்கிய ஒரு கொடிக்கிளையை[b] வெட்டினார்கள். அதை ஒரு தண்டில் வைத்து, அவர்களில் இருவர் சுமந்தார்கள்; சில மாதுளம்பழங்களையும் சில அத்திப்பழங்களையும் எடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எஸ்கோல் கணவாய்,’ ‘எஸ்கோல் நீரோடை’ அல்லது ‘எஸ்கோல் ஓடை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான נַחַל, பள்ளத்தாக்கை மட்டுமல்லாமல் கணவாயையோ பருவகால நீரோடையையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரே ஒரு திராட்சைக் குலையுள்ள ஒரு திராட்சைக் கொடிக்கிளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: எஸ்கோல் பள்ளத்தாக்கு
  rationale: נַחַל என்பது பள்ளத்தாக்கு, கணவாய், பருவகால நீரோடை அல்லது ஓடை ஆகிய பொருள்களைக் குறிக்கலாம். பெயரிடப்பட்ட நிலப்பகுதியைக் குறிக்கும் இச்சூழலில், பொதுவாகப் புரிந்துகொள்ளக்கூடிய ‘பள்ளத்தாக்கு’ இயல்பான தேர்வு; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: זְמוֹרָה
  choice: கொடிக்கிளை
  rationale: இந்தச் சொல் குறிப்பாக திராட்சைக்கொடியின் கிளையைக் குறிக்கிறது. ‘கொடிக்கிளை’ என்பது சுருக்கமாகவும் அடுத்துவரும் திராட்சைக் குலையுடன் இயல்பாகவும் அமைகிறது.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: ஒரே திராட்சைக் குலை
  rationale: எபிரெயச் சொற்றொடரில் குலை ஒன்றே என்பதற்கு வலியுறுத்தல் உள்ளது; ‘ஒரே’ அதைப் பேச்சுவழக்கல்லாத, இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וַיִּשָּׂאֻהוּ
  choice: அதை ... சுமந்தார்கள்
  rationale: ஒருமை பின்னொட்டு வெட்டப்பட்ட கிளை–குலை முழுவதையும் ஒரு பொருளாகச் சுட்டுகிறது. ‘அதை’ இந்த ஒருமையைப் பாதுகாக்கிறது.
- source_word: בַמּוֹט
  choice: ஒரு தண்டில் வைத்து
  rationale: מוֹט என்பது சுமப்பதற்குப் பயன்படும் நீண்ட தண்டு அல்லது கழியைக் குறிக்கிறது. தமிழில் பொருளைத் தண்டில் வைத்து இருவர் சுமக்கும் காட்சி தெளிவாக அமைகிறது.
- source_word: בִּשְׁנָיִם
  choice: அவர்களில் இருவர்
  rationale: சொல்லுக்கு நேரான பொருள் ‘இருவரால்/இருவராக’ என்பதாகும். முந்தைய சூழலிலுள்ள உளவாளிகள் கூட்டத்திலிருந்து இருவர் என்பதைத் தமிழில் வெளிப்படையாகவும் மிகையின்றியும் கூறுகிறது.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: மாதுளம்பழங்களிலும் அத்திப்பழங்களிலும் சிலவற்றையும் எடுத்துக்கொண்டார்கள்
  rationale: எபிரெயத்தில் முந்தைய வினை கருத்தளவில் தொடர்கிறது. தமிழ் வாக்கியம் தெளிவாக அமைய ‘எடுத்துக்கொண்டார்கள்’ மீட்டுரைக்கப்படுகிறது; இரு பழவகைகளிலிருந்தும் சில எடுத்தனர் என்ற இணை அமைப்பும் காக்கப்படுகிறது.
