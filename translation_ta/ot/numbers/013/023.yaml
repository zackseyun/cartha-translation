translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. அரிதான புவியியல் சொல்லை முதன்மை உரையில் தவிர்த்து, அதன் பொருள் பரப்பை அடிக்குறிப்பில் காத்துள்ளோம். ‘கொடிக்கிளை,’ ‘தண்டு,’ ‘சுமந்தார்கள்’ ஆகியவை காட்சியை எளிதில் புரியவைக்கின்றன; மூலத்தின் ஒருமை மற்றும் இணை அமைப்புகள் பாதுகாக்கப்பட்டுள்ளன.
