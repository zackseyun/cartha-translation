  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் மாறுபாட்டு வலிமையும், நகரங்களின் அரண் மற்றும் பெருமை இணையாகச் சொல்லப்படுவதும் பேணப்பட்டுள்ளன.
