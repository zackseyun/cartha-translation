source:
  edition: WLC
  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: ta
  text: ஆனால், அந்த நாட்டில் குடியிருக்கும் மக்கள் வலிமையானவர்கள்; நகரங்கள் அரண் செய்யப்பட்டவையாகவும் மிகப் பெரியவையாகவும் இருக்கின்றன. மேலும், ஆனாக்கின் வழிவந்தவர்களையும்[a] அங்கே கண்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனாக்கின் பிள்ளைகளையும்.” எபிரெயச் சொற்றொடர் ஆனாக்கின் வம்சத்தில் வந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் நல்ல அறிக்கைக்கு வலுவான மாறுபாட்டைக் கொண்டுவரும் எபிரெயச் சொற்றொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַז
  choice: வலிமையானவர்கள்
  rationale: மக்களின் பலத்தையும் அவர்களை எதிர்கொள்வதில் உள்ள கடினத்தன்மையையும் தெரிவிக்கிறது; ‘கொடூரமானவர்கள்’ என பகைமையை மிகைப்படுத்துவதில்லை.
- source_word: הַיֹּשֵׁב בָּאָרֶץ
  choice: அந்த நாட்டில் குடியிருக்கும்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தை இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக அளிக்கிறது.
- source_word: בְּצֻרוֹת
  choice: அரண் செய்யப்பட்டவையாக
  rationale: நகரங்கள் இராணுவப் பாதுகாப்பிற்காக உறுதிப்படுத்தப்பட்டிருந்ததைத் தெரிவிக்கிறது; ‘மதில்சூழ்ந்த’ என்பதைவிட மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: גְּדֹלֹת מְאֹד
  choice: மிகப் பெரியவையாக
  rationale: நகரங்களின் அளவைக் குறிக்கும் தீவிரப்படுத்தலைத் தெளிவாகப் பேணுகிறது.
- source_word: יְלִדֵי הָעֲנָק
  choice: ஆனாக்கின் வழிவந்தவர்களை
  rationale: இச்சொற்றொடரின் வம்சவழிப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்படியான ‘ஆனாக்கின் பிள்ளைகள்’ என்பதும் சாத்தியம்.
- source_word: רָאִינוּ שָׁם
  choice: அங்கே கண்டோம்
  rationale: அறிக்கையின் இறந்தகாலச் செயலும் இடத்திற்கான வலியுறுத்தலும் நேரடியாகப் பேணப்படுகின்றன.
