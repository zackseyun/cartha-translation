  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); ‘யாஹ்வே’ என்றும் ஒலிப்பெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயரின் எபிரெய வடிவத்தையும் மாற்று ஒலிப்பெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசியதாவது
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொருளையும், அடுத்துவரும் இறைவாக்கை அறிமுகப்படுத்தும் எபிரெயக் கதைநடைச் சூத்திரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயரால் மாற்றப்படாமல், יהוה என்ற இறைப் பெயரின் தமிழில் நிலைபெற்ற ஒலிப்பெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்க ‘-இடம்’ பயன்படுத்தப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: '-யதாவது:'
  rationale: לאמר நேரடிப் பேச்சை அறிமுகப்படுத்தும் சூத்திரமாகச் செயல்படுவதால், தமிழில் அடுத்துவரும் உரையை இயல்பாகத் திறக்கும் ‘பேசியதாவது:’ என்ற அமைப்பில் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யாஹ்வே; யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிப்பெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது தெளிவான, இயல்பான தமிழ் வடிவம்.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான இறைவாக்கு அறிமுக நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்துவரும் நேரடிப் பேச்சுடன் தொடர்வதைக் காட்ட முற்றுப்புள்ளிக்குப் பதிலாக முக்காற்புள்ளி இடப்பட்டுள்ளது.
