  terminology: יהוה தனிப்பட்ட இறைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என வழங்கப்பட்டுள்ளது. ‘மோசே’ என்பது நிலையான தமிழ் வேதாகமப் பெயர்வடிவம். அடிக்குறிப்பு எபிரெய வடிவத்தையும் மாற்று ஒலிப்பெயர்ப்பையும் பொருத்தமாகக் குறிக்கிறது.
