  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: ta
  text: அந்த நிலம் வளமானதா வளமற்றதா, அதில் மரங்கள்[a] உண்டா இல்லையா என்பதையும் பாருங்கள். துணிவுடன் இருங்கள்; அந்த நிலத்தின் கனிகளில் சிலவற்றை எடுத்துக்கொள்ளுங்கள்.” அந்த நாட்கள் திராட்சைகள் முதன்முதலாகப் பழுக்கும் காலமாக இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் மரப்பொருள் உண்டா இல்லையா.” எபிரெயச் சொல் ‘மரம்’ அல்லது ‘மரப்பொருள்’ என இருவிதமாகவும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அந்த நாட்கள் முதலில் பழுத்த திராட்சைகளின் நாட்களாக இருந்தன”; அதாவது, அது திராட்சை அறுவடைக் காலத்தின் தொடக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: வளமானதா வளமற்றதா
  rationale: இச்சொற்களின் நேரடிப் பொருள் ‘கொழுத்தது ... மெலிந்தது’ என்பதாக இருந்தாலும், நிலத்தைப் பற்றிய இச்சூழலில் அவை அதன் வளத்தையும் வளமின்மையையும் குறிக்கின்றன. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: அதில் மரங்கள் உண்டா இல்லையா
  rationale: עֵץ என்பதற்கு ‘மரம்’ அல்லது ‘மரக்கட்டை’ எனப் பொருள் கொள்ளலாம். நிலத்தின் தன்மையை ஆராயும் சூழலில் ‘மரங்கள்’ என்பது மிக நேரடியான வாசிப்பு; மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: துணிவுடன் இருந்து
  rationale: வினைச்சொல் தங்களைத் திடப்படுத்திக்கொண்டு பணியை மேற்கொள்ளுமாறு ஊக்குவிக்கிறது. ‘துணிவுடன் இருந்து’ என்பது அதன் கட்டளை வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: அந்த நிலத்தின் கனிகளில் சிலவற்றை எடுத்துக்கொள்ளுங்கள்
  rationale: מִן இங்கு ஒரு பகுதியை, அதாவது ‘சிலவற்றை’, குறிக்கிறது. திரும்பக் கொண்டுவருவது சூழலால் புரிந்தாலும், எபிரெய உரையில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: திராட்சைகள் முதன்முதலாகப் பழுக்கும் காலம்
  rationale: இத்தொடர் முதலில் பழுக்கும் திராட்சைகளையும் திராட்சை அறுவடையின் தொடக்கப் பருவத்தையும் குறிக்கிறது. வழிபாட்டுச் சார்ந்த ‘முதற்பலன்’ என்ற எண்ணத்தைத் தேவையின்றி சேர்க்காமல் காலக் குறிப்பைத் தெளிவாக வழங்குகிறது.
- source_word: וְהַיָּמִים יְמֵי
  choice: அந்த நாட்கள் ... காலமாக இருந்தன
  rationale: எபிரெயக் கதையாடலின் காலக் குறிப்பையும் அதன் மீளுருவாக்க அமைப்பையும் தமிழில் வாசிக்கத்தக்க விதத்தில் நெருக்கமாகப் பாதுகாக்கிறது.
