translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியக்கூடிய கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆய்வு செய்துவிட்டு’ என்பது உளவுப்பணிச் சூழலை உணர்த்தினாலும், மூலத்தில் கட்டாயமில்லாத எதிர்மறைச் சாயலை முதன்மை உரையில் சேர்ப்பதில்லை.
