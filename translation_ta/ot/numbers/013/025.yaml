  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: ta
  text: நாற்பது நாட்களின் முடிவில், அவர்கள் அந்த நாட்டை ஆய்வு செய்துவிட்டுத் திரும்பி வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த நாட்டைச் சுற்றிப் பார்த்துவிட்டு’ அல்லது ‘அந்த நாட்டை உளவு பார்த்துவிட்டு’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், தகவல் அறியும் நோக்கில் நாட்டை ஆராய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: அவர்கள் ... திரும்பி வந்தார்கள்
  rationale: שוב என்பதன் Qal wayyiqtol மூன்றாம் நபர் ஆண்பால் பன்மை வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. தமிழின் இயல்பான கதைநடைக்காக வாவ் இணைப்பு தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: מִתּוּר
  choice: ஆய்வு செய்துவிட்டு
  rationale: תור என்பதன் infinitive construct வடிவத்துடன் வரும் מִן, அவர்கள் மேற்கொண்ட நில ஆய்விலிருந்து திரும்பியதைச் சுட்டுகிறது. உளவு பார்த்தல் என்ற எதிர்மறைச் சாயலைத் தேவையின்றி சேர்க்காமல், தேடிப் பார்ப்பதும் ஆராய்வதும் அடங்கிய பணியை ‘ஆய்வு செய்தல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: இங்கு אָרֶץ என்பது உலகத்தையோ பொதுவான நிலப்பரப்பையோ அல்லாமல், அவர்கள் ஆய்வு செய்ய அனுப்பப்பட்ட குறிப்பிட்ட நாட்டைக் குறிக்கிறது. தமிழில் இந்தச் சூழலில் ‘அந்த நாடு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִקֵּץ
  choice: முடிவில்
  rationale: מִן + קֵץ காலப்பகுதி நிறைவடைந்த புள்ளியைக் குறிக்கும் மரபுத்தொடர். ‘முடிவில்’ அதன் காலச் சார்ந்த பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: אַרְבָּעִים יוֹם
  choice: நாற்பது நாட்கள்
  rationale: எபிரெய மொழியில் எண் தொடர்ந்து ஒருமை பெயர்ச்சொல் வந்தாலும், தமிழில் கால அளவைக் குறிக்க இயல்பாகப் பன்மை வடிவமான ‘நாட்கள்’ பயன்படுத்தப்படுகிறது.
