base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: ta
  text: அவர்கள் மேலே சென்று, சீன் வனாந்தரத்திலிருந்து லெபோ-ஆமாத்தில் உள்ள ரெகோபுவரை[a] அந்த நாட்டை உளவு பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆமாத்தின் நுழைவிடத்தை நோக்கி, ரெகோபுவரை.” எபிரெயத் தொடரை ‘லெபோ-ஆமாத்’ என்ற இடப்பெயராக அல்லாமல், ஓர் இடத்தை விவரிக்கும் தொடராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: அவர்கள் புறப்பட்டுச் சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’; இப்பயணச் சூழலில் தமிழில் இயல்பாக அமைய ‘புறப்பட்டுச் சென்று’ என மொழிபெயர்க்கப்பட்டது. திசை சார்ந்த ‘மேலே’ என்ற கூறை வெளிப்படையாகச் சேர்ப்பது தமிழில் தவறான நிலஅமைப்புச் சித்திரத்தை உருவாக்கக்கூடும்.
- source_word: וַיָּתֻרוּ
  choice: உளவு பார்த்தார்கள்
  rationale: תור இங்கு நியமிக்கப்பட்டவர்களின் நில ஆய்வையும் மறைவேவுப் பணியையும் குறிக்கிறது; ‘உளவு பார்த்தார்கள்’ உடனடிக் கதைச்சூழலுக்கு தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: எண்ணாகமம் 13-இன் சூழலில் இது அவர்கள் ஆய்வு செய்ய வேண்டிய கானான் நாட்டைக் குறிக்கிறது; தமிழ் உரையோட்டத்தில் ‘அந்த நாடு’ தெளிவாக உள்ளது.
- source_word: מִמִּדְבַּר צִן
  choice: சீன் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட வனப்பகுதியைக் குறிக்கலாம்; வேதாகமப் புவியியலில் பரிச்சயமான, கண்ணியமான ‘வனாந்தரம்’ தேர்ந்தெடுக்கப்பட்டது. צִן ‘சீன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: עַד רְחֹב
  choice: ரெகோபுவரை
  rationale: עַד ஆய்வின் எல்லையைச் சுட்டுகிறது; ‘-வரை’ இதனைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது. רְחֹב ‘ரெகோப்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לְבֹא חֲמָת
  choice: லெபோ-ஆமாத்திலுள்ள
  rationale: இத்தொடரை இடப்பெயராகப் புரிந்துகொள்ளும் வாசிப்பை முதன்மை உரை பாதுகாக்கிறது. அதேவேளை விளக்கவுரைப் பொருளான ‘ஆமாத்தின் நுழைவிடம்’ அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
