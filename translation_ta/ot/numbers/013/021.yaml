translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. இடப்பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் புவியியல் வாசிப்பிலுள்ள உண்மையான இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
