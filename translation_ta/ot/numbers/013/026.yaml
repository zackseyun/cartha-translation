base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: ta
  text: அவர்கள் சென்று, மோசேயிடமும் ஆரோனிடமும் இஸ்ரவேல் மக்களின் முழுச் சபையிடமும், பாரான் வனாந்தரத்திலுள்ள காதேசுக்கு வந்தார்கள்.[a] அவர்கள் அவர்களுக்கும் முழுச் சபைக்கும் செய்தி தெரிவித்தார்கள்; நாட்டின் கனியை அவர்களுக்குக் காட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேல் புத்திரரின் சபை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: அவர்கள் புறப்பட்டு... வந்தார்கள்
  rationale: இரண்டு தொடர்ச்சியான எபிரெய வினைகளையும் இயல்பான தமிழில் காத்து, பயணத்தையும் வருகையையும் வெளிப்படுத்துகிறது.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபையார் அனைவரும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதைத் தமிழில் இயல்பான கூட்டுப்பெயரான ‘இஸ்ரவேல் மக்கள்’ என்றும், עֵדָה என்பதை மனிதர்களைக் குறிக்கும் மரியாதைமிக்க ‘சபையார்’ என்றும் தருகிறது.
- source_word: מִדְבַּר פָּארָן
  choice: பாரான் வனாந்தரம்
  rationale: பயணக் கதைகளில் மִדְבָּר குறிக்கும் மக்கள் குடியேற்றம் குறைந்த வறண்ட நிலப்பகுதியை மரபும் தெளிவும் கொண்ட தமிழில் கூறுகிறது.
- source_word: קָדֵשָׁה
  choice: காதேசுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைநோக்கி -ָה முடிவை வெளிப்படையாகக் காத்து, காதேசை நோக்கிய வருகையைச் சுட்டுகிறது.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: அவர்களிடம் செய்தி அறிவித்தார்கள்
  rationale: ‘வார்த்தையைத் திருப்பிக் கொண்டுவந்தார்கள்’ என்ற எபிரெய மொழிவழக்கின் பொருளை இயல்பான நவீன தமிழில் அறிக்கையிடுதலாகத் தருகிறது.
- source_word: וַיַּרְאוּם
  choice: அவர்களுக்குக் காட்டினார்கள்
  rationale: ראה என்பதன் ஹிப்ஈல் வடிவிலுள்ள ‘காணச் செய்தல்/காட்டுதல்’ என்ற காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: פְּרִי הָאָרֶץ
  choice: அந்த நாட்டின் கனி
  rationale: פְּרִי என்பதன் காட்சியளிக்கக்கூடிய கனிப் பொருளை நேரடியாகக் காத்து, הָאָרֶץ என்பதைச் சூழலுக்கேற்ற ‘அந்த நாடு’ என வழங்குகிறது.
