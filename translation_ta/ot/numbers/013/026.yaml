revisions:
- from: அவர்கள் புறப்பட்டு, மோசேயிடமும் ஆரோனிடமும் இஸ்ரவேல் மக்களின் சபையார் அனைவரிடமும் வந்தார்கள். அவர்கள் பாரான் வனாந்தரத்திலுள்ள காதேசுக்கு வந்து, அவர்களிடமும் சபையார் அனைவரிடமும் செய்தி அறிவித்து, அந்த நாட்டின் கனியை அவர்களுக்குக் காட்டினார்கள்.
