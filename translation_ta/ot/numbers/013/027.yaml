  text: וַ/יְסַפְּרוּ ל/וֹ֙ וַ/יֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑/נוּ וְ֠/גַם זָבַ֨ת חָלָ֥ב וּ/דְבַ֛שׁ הִ֖וא וְ/זֶה פִּרְיָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: ta
  text: 'அவர்கள் அவரிடம் விவரித்துச் சொன்னார்கள்: “நீர் எங்களை அனுப்பிய நாட்டிற்குள் நாங்கள் சென்றோம். அது உண்மையிலேயே பாலும் தேனும் வழிந்தோடும் நாடு; இதோ, அதன் பழம்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதுவும் பாலும் தேனும் வழிந்தோடுகிறது.” எபிரெய மொழியிலுள்ள וְגַם, அந்த நாட்டின் வளத்தைப் பற்றிய கூற்றை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: அவர்கள் அவரிடம் விவரித்துச் சொன்னார்கள்
  rationale: פיעל வடிவிலுள்ள ספר என்பதற்கு ‘விவரித்தல், அறிக்கை அளித்தல்’ என்ற பொருள் உண்டு. உளவாளிகள் தாங்கள் கண்டதை முறையாக எடுத்துரைக்கும் சூழலை இந்த இயல்பான தமிழ் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவரிடம்
  rationale: எபிரெய மூலத்தில் மோசேயின் பெயருக்குப் பதிலாக ஆண்பால் ஒருமை சுட்டுப்பெயர் உள்ளது; தமிழிலும் அதையே காக்கிறது.
- source_word: בָּאנוּ אֶל־הָאָרֶץ
  choice: நாட்டிற்குள் நாங்கள் சென்றோம்
  rationale: בוא என்பது ‘வருதல்/செல்லுதல்’ என்பதோடு ஒரு இடத்திற்குள் நுழைவதையும் குறிக்கலாம். அவர்கள் நாட்டை ஆராய்ந்து திரும்பிய சூழலில் ‘நாட்டிற்குள் சென்றோம்’ என்பது இலக்கையும் நுழைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְגַם
  choice: உண்மையிலேயே
  rationale: இந்த இணைப்புச் சொல் அந்நாட்டின் வளத்தை உறுதிப்படுத்தி வலியுறுத்துகிறது. ‘உண்மையிலேயே’ அந்த வலியுறுத்தலை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: זָבַת חָלָב וּדְבַשׁ הִוא
  choice: அது உண்மையிலேயே பாலும் தேனும் வழிந்தோடும் நாடு
  rationale: ‘பாலும் தேனும் வழிந்தோடும்’ என்பது மிகுந்த வேளாண் வளத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது. தமிழில் வாக்கியம் முழுமையாக அமைய ‘நாடு’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
- source_word: וְזֶה פִּרְיָהּ
  choice: இதோ, அதன் பழம்
  rationale: זֶה அருகிலுள்ள சான்றைக் காட்டும் சுட்டுச் சொல்லாக உள்ளது. அவர்கள் கொண்டு வந்த பழத்தைச் சுட்டிக் காட்டும் செயல்பாட்டை ‘இதோ’ இயல்பாக வெளிப்படுத்துகிறது.
