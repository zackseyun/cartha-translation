translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமையான ‘நீர்/எங்களை’ மோசேயை நோக்கிய நேரடி உரையில் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுட்டுப்பெயரும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
