  text: யூதா கோத்திரத்திலிருந்து, எப்புன்னேயின் மகன் காலேப்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: பட்டியலின் சூழலில், לְ முன்னொட்டுடன் வரும் מַטֶּה, பெயரிடப்பட்டவர் பிரதிநிதித்துவப்படுத்தும் கோத்திரத்தைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் பிரதிநிதித்துவத் தொடர்பைத் தக்கவைத்தும் ‘கோத்திரத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இங்கு யூதாவிடமிருந்து வந்த கோத்திரத்தைக் குறிக்கும் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் வம்ச உறவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יְפֻנֶּה
  choice: எப்புன்னே
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் நிலைபெற்ற வடிவம்.
