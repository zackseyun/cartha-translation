  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: ta
  text: அப்போது காலேப், மோசேயின் முன்னிலையில் மக்களை அமைதிப்படுத்தி[a], “நாம் நிச்சயமாக ஏறிச் சென்று[b] அந்த நாட்டை உரிமையாக்கிக்கொள்வோம்; ஏனெனில் அதைச் செய்ய நம்மால் நிச்சயமாக முடியும்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைச் சத்தமின்றி இருக்கச் செய்து.” எபிரெய வினைச்சொல் அமைதியாக்குதல், அடக்குதல், அல்லது சத்தமின்றி இருக்கச் செய்தல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஏறுவோம், நிச்சயமாக ஏறுவோம்” என்ற வலியுறுத்தும் கட்டமைப்பு உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஏனெனில் அதைச் செய்ய நமக்கு முழுத் திறன் உண்டு.” எபிரெயத்தில் திறன் இருப்பது வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: அமைதிப்படுத்தி
  rationale: இந்த வினைச்சொல் ஒரு கூட்டத்தை அமைதியாக அல்லது சத்தமின்றி இருக்கச் செய்வதைக் குறிக்கிறது. ‘அமைதிப்படுத்தி’ என்பது காலேப் மக்களின் பேச்சை அடக்கிய சூழலை இயல்பாகக் காட்டுகிறது; கடுமையான வற்புறுத்தலைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: אֶת־הָעָם
  choice: மக்களை
  rationale: இங்கு עָם என்பது கூடியிருந்த இஸ்ரயேல் சமூகத்தைக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயின் முன்னிலையில்
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி’ என்றாலும், இச்சூழலில் மோசே இருந்த இடத்தில் அல்லது அவர் முன்னிலையில் காலேப் மக்களை அமைதிப்படுத்தினான் என்பதே பொருத்தமான கருத்து. ‘மோசேயிடம்’ என்பது காலேப் மோசேயை அமைதிப்படுத்தியதாகத் தவறாகப் புரியக்கூடும்.
- source_word: עָלֹה נַעֲלֶה
  choice: நாம் நிச்சயமாக ஏறிச் சென்று
  rationale: வினையெச்ச முழுவடிவமும் தொடரும் வினையும் சேர்ந்த எபிரெயக் கட்டமைப்பு செயலை வலியுறுத்துகிறது. ‘நிச்சயமாக’ அந்த வலியுறுத்தலைக் காக்கிறது; ‘ஏறிச் சென்று’ நிலத்தை நோக்கிய மேல்செலவைப் பாதுகாக்கிறது.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: அந்த நாட்டை உரிமையாக்கிக்கொள்வோம்
  rationale: יָרַשׁ இங்கு நாட்டுக்குள் சென்று அதைத் தங்கள் உடைமையாக்கிக் கொள்வதைக் குறிக்கிறது. ‘உரிமையாக்கிக்கொள்வோம்’ என்பது வெறும் மரபுரிமையைவிடச் செயற்பாட்டுடன் கைப்பற்றிப் பெற்றுக்கொள்ளும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כִּי יָכוֹל נוּכַל
  choice: ஏனெனில் ... நம்மால் நிச்சயமாக முடியும்
  rationale: மீண்டும் பயன்படுத்தப்பட்ட வலியுறுத்தும் எபிரெயக் கட்டமைப்பை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது. இது காலேபின் உறுதியான நம்பிக்கையைக் காட்டுகிறது.
- source_word: לָהּ
  choice: அதைச் செய்ய
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டைச் சுட்டுகிறது. தமிழில் ‘அதைச் செய்ய’ என்பது அந்த நாட்டை உரிமையாக்கும் முன்மொழியப்பட்ட செயலை இயல்பாகத் திரும்பச் சுட்டுகிறது; ‘வெல்ல’ போன்ற கூடுதல் விளக்கத்தைத் திணிப்பதில்லை.
