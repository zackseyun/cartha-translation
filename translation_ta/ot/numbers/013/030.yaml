translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அதேவேளை கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் இருமுறை வரும் வலியுறுத்தும் வினைக் கட்டமைப்புகள் ‘நிச்சயமாக’ என்பதன் மூலம் காக்கப்பட்டுள்ளன. ‘அந்த நாடு’ என்பது பெண்பால் ஒருமை பின்னொட்டின் சூழல் சார்ந்த குறியீட்டைத் தமிழில் தெளிவாக்குகிறது.
