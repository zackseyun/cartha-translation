base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: ta
  text: தூய்மையானவர் மூன்றாம் நாளிலும் ஏழாம் நாளிலும் தீட்டுப்பட்டவர்மேல் அதைத் தெளிக்க வேண்டும்; இவ்வாறு ஏழாம் நாளில் அவரைத் தூய்மைப்படுத்த வேண்டும்.[a] பின்பு அவர் தம் உடைகளைத் துவைத்து, தண்ணீரில் குளிக்க வேண்டும்; மாலையில் அவர் தூய்மையாவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய்மைப்படுத்த வேண்டும்’ என்பதற்கான எபிரெய வினைச்சொல் பாவம் மற்றும் தூய்மைப்படுத்தல் தொடர்பான மொழியிலும் பயன்படுகிறது; ஆனால் இங்கு அது சடங்குமுறைத் தீட்டை நீக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: נזה என்பதன் ஹிஃபில் வடிவம் இச்சடங்குச் சூழலில் தூய்மைப்படுத்தும் நீரை ஒருவர்மேல் தெளிப்பதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: தூய்மையானவர் / தீட்டுப்பட்டவர்
  rationale: இவை பெயர்ச்சொல்லாகச் செயல்படும் பெயரடைகள்; சடங்குமுறைத் தூய்மையையும் தீட்டையும் குறிக்கின்றன. ஆணை மட்டும் குறிப்பதாக மாற்றாமல், பொதுவாக ஒருவரைக் குறிக்கும் மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: மூன்றாம் நாளிலும் ஏழாம் நாளிலும்
  rationale: இரு நாட்களிலும் செயல் நடைபெற வேண்டும் என்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணை அமைப்பு.
- source_word: וְחִטְּאוֹ
  choice: அவரைத் தூய்மைப்படுத்த வேண்டும்
  rationale: חטא என்பதன் பியேல் வடிவம் இங்கு பாவமன்னிப்பை அல்ல, மரணத்தால் ஏற்பட்ட சடங்குமுறைத் தீட்டை நீக்குவதைச் சுட்டுகிறது. அந்தச் சூழல்சார் பொருளை ‘தூய்மைப்படுத்த’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: தம் உடைகளைத் துவைத்து
  rationale: சடங்குச் சட்டத்தின் பொருளைத் தக்கவைத்தபடி நவீனத் தமிழில் இயல்பாக உள்ளது. ‘தம்’ என்பது செய்பவருடைய உடைகள் என்பதைக் காட்டுகிறது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இச்சூழலில் உடலை நீரால் கழுவுவதைக் குறிக்கிறது; ‘குளிக்க’ என்பது அதன் இயல்பான தமிழ் வடிவம்.
- source_word: וְטָהֵר בָּעָרֶב
  choice: மாலையில் அவர் தூய்மையாவார்
  rationale: கழுவிய உடனே அல்லாமல் மாலையில் சடங்குமுறைத் தூய்மை நிலை ஏற்படுவதைக் காலக் குறிப்புடன் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: חטא / טהר என்பவற்றின் தூய்மைப்படுத்தல் மொழி
  choice: சடங்குமுறைத் தீட்டிலிருந்து தூய்மைப்படுத்துதல் என்று மொழிபெயர்த்தல்
  alternative: பாவத்திலிருந்து சுத்திகரித்தல் அல்லது பாவநிவிர்த்தி செய்தல்
  rationale: இந்தப் பகுதியின் சூழல் பிணத்தைத் தொட்டதால் ஏற்படும் தீட்டையும் அதற்குரிய தூய்மைப்படுத்தும் நீரையும் பற்றியது. ஆகவே அறநெறிப் பாவம் அல்லது பாவநிவிர்த்தி என்ற கருத்தைச் சேர்ப்பது மூலவசனம் கூறாத இறையியல் கருத்தை இறக்குமதி செய்துவிடும்.
- issue: הַטָּהֹר / הַטָּמֵא ஆகிய ஆண்பால் ஒருமை வடிவங்களின் பிரதிநிதித்துவப் பயன்பாடு
  choice: பாலினத்தை வரையறுக்காத ‘தூய்மையானவர் / தீட்டுப்பட்டவர்’
  alternative: தூய்மையான ஆண் / தீட்டுப்பட்ட ஆண்
  rationale: எபிரெய வடிவங்கள் இலக்கண ரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், சட்டப் பகுதியில் சடங்கில் பங்கேற்கும் நபரைப் பொதுவாகக் குறிக்கின்றன; வசனத்தின் நோக்கம் ஆண்களை மட்டும் வரையறுப்பதல்ல.
- issue: וְכִבֶּס தொடங்கி வரும் செயல்களின் எழுவாய்
  choice: சூழலின் அடிப்படையில் தூய்மைப்படுத்தப்படும் தீட்டுப்பட்டவரை எழுவாயாக வெளிப்படுத்துதல்
  alternative: முந்தைய செயலைச் செய்த தூய்மையானவரே தம் உடைகளைக் கழுவுகிறார் என்று வாசித்தல்
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாக மீண்டும் கூறப்படாததால் இலக்கணத் தொடரில் ஓரளவு தெளிவின்மை உள்ளது. எனினும் இந்த அதிகாரத்தின் தூய்மைப்படுத்தல் நடைமுறையும் 19:12-ன் இணை அமைப்பும், ஆடை துவைத்துக் குளிப்பவர் தீட்டிலிருந்து தூய்மைப்படுத்தப்படுபவரே என்பதை வலுவாகக் காட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-சடங்கு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சுத்தமானவர்’ என்பதற்குப் பதில் சடங்குமுறை நிலையைத் தெளிவாகக் காட்ட ‘தூய்மையானவர்’ என்றும், טמא என்பதற்கு இச்சூழலில் வழக்கமான ‘தீட்டுப்பட்டவர்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் தெளித்த பொருள் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும் முந்தைய சூழலிலுள்ள தூய்மைப்படுத்தும் நீரைக் குறிக்கும் வகையில் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
