source:
  edition: WLC
  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: ta
  text: 'இதுவே சட்டம்: ஒரு மனிதன் ஒரு கூடாரத்தில் இறந்தால், அந்தக் கூடாரத்திற்குள் வருகிற ஒவ்வொருவரும், அந்தக் கூடாரத்தில் இருக்கிற ஒவ்வொருவரும்[a] ஏழு நாட்கள் தீட்டுப்பட்டவர்களாய் இருப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கூடாரத்தில் இருக்கிற ஒவ்வொருவரும்/ஒவ்வொன்றும்.” எபிரெயச் சொற்றொடர் மனிதர்களை மட்டும் அல்லாமல், கூடாரத்தில் உள்ள அனைத்தையும் குறிக்கக்கூடும். ஆனால் அடுத்த வசனம் திறந்த பாத்திரங்களைத் தனியாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: இதுவே சட்டம்
  rationale: சடலத்தால் ஏற்படும் தீட்டைக் குறித்த கட்டுப்படுத்தும் விதியை תּוֹרָה இங்கு அறிமுகப்படுத்துகிறது; நவீன தமிழில் ‘சட்டம்’ என்பது சுருக்கமாகவும் சட்டவிதியின் தன்மையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אָדָם כִּי יָמוּת
  choice: ஒரு மனிதன் ... இறந்தால்
  rationale: אָדָם ஒருமையில் பொதுப்பொருளில் வருகிறது; ‘ஒரு மனிதன்’ மூலத்தின் வடிவைப் பேணுகிறது. כִּי இங்கு ஒரு சட்ட வழக்கின் சூழ்நிலையை அறிமுகப்படுத்துவதால் தமிழில் இயல்பான ‘இறந்தால்’ பயன்படுத்தப்பட்டது.
- source_word: בְּאֹהֶל
  choice: ஒரு கூடாரத்தில்
  rationale: முதல் குறிப்பில் எபிரெயத்தில் சுட்டுருபு இல்லாததால், புதிதாக அறிமுகமாகும் குறிப்பற்ற கூடாரத்தை ‘ஒரு கூடாரம்’ என மொழிபெயர்ப்பது பொருத்தம்.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: அந்தக் கூடாரத்திற்குள் வருகிற ஒவ்வொருவரும்
  rationale: பங்கேற்புவினை பொதுவான அல்லது தொடர்ச்சியான சூழலைக் குறிக்கிறது; ‘வருகிற ஒவ்வொருவரும்’ இயல்பான தமிழில் அந்த வலிமையைப் பேணுகிறது. பின்னர் வரும் கூடாரம் முன்பு குறிப்பிடப்பட்டதையே குறிக்கிறது என்பதால் ‘அந்தக்’ சேர்க்கப்பட்டது.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: கூடாரத்தில் இருக்கிற ஒவ்வொருவரும்
  rationale: אֲשֶׁר விரிவாக ‘இருப்பவை அனைத்தும்’ எனவும் பொருள்படலாம். ஆனால் முன்னுள்ள ‘வருகிற ஒவ்வொருவரும்’ என்பதுடனான இணை அமைப்பும் ஒருமை வினையும் இங்கு மனிதர்களைக் குறிப்பதை ஆதரிக்கின்றன; உண்மையான மாற்றுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவர்களாய் இருப்பார்கள்
  rationale: சடங்குசார் தூய்மைச் சட்டத்தின் சூழலில் ‘தீட்டு’ என்பது நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் சொல். ஒருமை எபிரெய வினை כָּל உடன் பகிர்வுப் பொருளில் வருவதால், தமிழில் எழுவாய்களுக்கு ஏற்ப பன்மை வடிவம் இயல்பானது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: தீட்டு நீடிக்கும் கால அளவைத் தமிழில் இயல்பாகத் தெரிவிக்க நான்காம் வேற்றுமை உருபுடன் வழங்கப்பட்டது.
