translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘அசுத்தம்’ என்பதற்குப் பதிலாக சடங்குசார் தூய்மைச் சூழலைத் தெளிவாகக் காட்ட ‘தீட்டு’ தேர்ந்தெடுக்கப்பட்டது; இது ஒழுக்கக் குற்றத்தைக் குறிக்காது. அடிக்குறிப்பு குறியீடு உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
