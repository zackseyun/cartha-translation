base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: ta
  text: பின்பு ஆசாரியனாகிய எலெயாசார் அதன் இரத்தத்தில் சிறிதைத் தன் விரலால் எடுத்து, சந்திப்புக் கூடாரத்தின் முன்புறத்தை நோக்கி அதன் இரத்தத்தில் சிறிதை ஏழு முறை தெளிக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திப்புக் கூடாரத்திற்கு முன்பாக.” எபிரெயச் சொற்றொடர் கூடாரத்தின் முன்புறத்தை நோக்கிய திசையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: சடங்கு நடைமுறையின் அடுத்த படியைக் குறிக்கும் waw + qatal தொடரை இயல்பான நவீனத் தமிழில் வரிசைச் செயலாக வெளிப்படுத்துகிறது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, அவருடைய அலுவலை இயல்பான அடைமொழித் தொடராகக் கொடுக்கிறது.
- source_word: מִדָּמָהּ
  choice: அதன் இரத்தத்தில் சிறிதை
  rationale: מִן முன்னொட்டின் பகுதிப்பொருளை வெளிப்படுத்துகிறது; முந்தைய சூழலில் உள்ள பெண் பசுவையே ‘அது’ குறிக்கிறது. எபிரெய உரையில் இருமுறை வரும் இரத்தக் குறிப்பு தமிழிலும் இருமுறை தக்கவைக்கப்பட்டது.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: இந்தச் சடங்குச் சூழலில் בְּ கருவிப்பொருளைக் குறிப்பதால், இரத்தத்தை விரலைப் பயன்படுத்தி எடுக்கும் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: נזה ஆசாரியச் சடங்கில் இரத்தம் அல்லது நீரைத் தெளிப்பதைக் குறிக்கிறது; சட்டவழிமுறையின் கட்டளைத் தன்மையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אֶל נֹכַח פְּנֵי
  choice: முன்புறத்தை நோக்கி
  rationale: கூடாரத்திற்குள் செய்யப்படுவதாகக் காட்டாமல், அதன் முகப்பு அல்லது முன்புறம் நோக்கிய திசையைப் பாதுகாக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தமது மக்களைச் சந்திக்கும் பரிசுத்த இடத்திற்கான பெயரை, விளக்கவுரைச் சுமை இல்லாமல் மூலச்சொற்களுக்கு நெருக்கமாக வழங்குகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
