id: NUM.19.17
reference: Numbers 19:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: ta
  text: தீட்டுப்பட்டவனுக்காக, தூய்மைப்படுத்தும் பலி எரிக்கப்பட்டதில் உண்டான தூளிலிருந்து சிறிதை அவர்கள் எடுக்க வேண்டும்[a]. பின்பு, ஒருவன் ஒரு பாத்திரத்தில் அதன்மேல் ஊற்றுநீரை ஊற்ற வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “பாவநிவாரண பலி எரிக்கப்பட்ட சாம்பலில் சிறிதை” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இங்கு “தூள்” என்ற சொல்லும், ஆசாரச் சூழலில் “பாவநிவாரண பலி” அல்லது அதன் செயல்பாட்டின்படி “தூய்மைப்படுத்தும் பலி” எனப் பொருள்படக்கூடிய חטאת என்ற சொல்லும் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உயிருள்ள நீர்”; அதாவது, புதிதாக ஊறும் அல்லது ஓடும் நீர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: அவர்கள் எடுக்க வேண்டும்
  rationale: சட்டவிதியின் எதிர்கால/கட்டளை வலிமையையும் எபிரெய வினையின் பன்மை எழுவாயையும் காக்கிறது.
- source_word: לַטָּמֵא
  choice: தீட்டுப்பட்டவனுக்காக
  rationale: சடங்குமுறைத் தூய்மையின்மையில் உள்ள நபரைக் குறிக்கிறது; இச்சூழலில் ‘தீட்டு’ என்பது இயல்பான தமிழ் வேதாகமச் சொல்லாட்சி.
- source_word: מֵעֲפַר
  choice: தூளில் சிறிதை
  rationale: עפר என்பதன் அடிப்படைப் பொருளான ‘தூள்’ என்பதைக் காக்கிறது; מן என்பதன் பகுதிப்பொருளை ‘சிறிதை’ வெளிப்படுத்துகிறது.
- source_word: שְׂרֵפַת
  choice: எரிக்கப்பட்டதில் உண்டான
  rationale: எரித்தல் என்ற செயலையும் அதன் விளைவாகக் கிடைத்த தூளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: הַחַטָּאת
  choice: தூய்மைப்படுத்தும் பலி
  rationale: ஆசாரச் சடங்கு சூழலில் இப்பலி தீட்டை நீக்கித் தூய்மைப்படுத்தும் செயல்பாட்டை வெளிப்படுத்துகிறது; ‘பாவநிவாரண பலி’ என்ற மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנָתַן
  choice: ஒருவன் … ஊற்ற வேண்டும்
  rationale: முந்தைய பன்மை வினைக்குப் பின் வரும் எபிரெய ஒருமை வினையின் பொதுவான, குறிப்பற்ற செய்பவரைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முன்னர் குறிப்பிடப்பட்ட தூளைக் குறிக்கும் இயல்பான தொடர்பாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: מַיִם חַיִּים
  choice: ஊற்றுநீர்
  rationale: சொல்லுக்குச் சொல் ‘உயிருள்ள நீர்’ என்றாலும், புதிய அல்லது ஓடிக்கொண்டிருக்கும் இயற்கை நீரூற்றின் தண்ணீரைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל כֶּלִי
  choice: ஒரு பாத்திரத்தில் வைத்து
  rationale: நீர் சேர்க்கப்படும்போது தூள் பாத்திரத்திற்குள் இருக்கிறது என்ற விளைவு நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குமுறைத் தூய்மைச் சூழலில் חטאת என்பதன் பொருள்
  choice: தூய்மைப்படுத்தும் பலி
  alternative: பாவநிவாரண பலி
  rationale: இவ்வசனம் சிவப்புப் பசுவின் எரிப்பிலிருந்து கிடைத்த தூளால் சடங்குமுறைத் தீட்டை நீக்குவதைப் பற்றியது. தேர்ந்த மொழிபெயர்ப்பு பலியின் தூய்மைப்படுத்தும் செயல்பாட்டை வெளிப்படுத்துகிறது; பாவக்குற்றம் என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- issue: מַיִם חַיִּים என்ற மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: ஊற்றுநீர்
  alternative: உயிருள்ள நீர்; ஓடும் நீர்
  rationale: இது புதியதாக ஊறும் அல்லது ஓடும் மூலத்திலிருந்து வரும் நீரைக் குறிக்கிறது. இயல்பான தமிழ் முதன்மை உரையில் பயன்படுத்தப்பட்டு, சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சடங்குமுறைச் சட்டத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையிலுள்ள பன்மையிலிருந்து ஒருமைக்கான செய்பவர் மாற்றம் ‘அவர்கள்’ மற்றும் ‘ஒருவன்’ என்பவற்றால் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
