  source_fidelity: முதல் வாக்கியத்தில் מֵעֲפַר שְׂרֵפַת הַחַטָּאת என்பதன் பகுதிப்பொருளும் சடங்குமுறைப் பொருளும் பெரும்பாலும் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் இரண்டாம் வாக்கியத்தில் ‘அதை ஒரு பாத்திரத்தில் வைத்து’ என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாத தூளைப் பாத்திரத்தில் வைக்கும் தனிச் செயலாக மாற்றுகிறது. எபிரெயம் உயிருள்ள நீரை அந்தத் தூளின்மேல், ஒரு பாத்திரத்தில் வைக்க/ஊற்றச் சொல்கிறது.
  naturalness: ‘ஒரு பாத்திரத்தில் அதன்மேல் ஊற்றுநீரை ஊற்ற வேண்டும்’ என்பது சட்டநடைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. ‘தூளில் சிறிதை’ என்பதற்குப் பதில் ‘தூளிலிருந்து சிறிதை’ என்பது பகுதிப்பொருளை இன்னும் தெளிவாகத் தருகிறது.
  terminology: ‘தீட்டுப்பட்டவன்,’ ‘தூய்மைப்படுத்தும் பலி,’ மற்றும் ‘ஊற்றுநீர்’ ஆகியவை நவீனத் தரத்தமிழிலும் சடங்குமுறைச் சூழலிலும் ஏற்றவை. חטאת-க்கான மரபான மாற்றும், מַיִם חַיִּים-க்கான சொல்லுக்குச்சொல் விளக்கமும் அடிக்குறிப்புகளில் பொருத்தமாக உள்ளன.
