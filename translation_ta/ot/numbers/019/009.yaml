  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: ta
  text: சடங்குமுறைப்படி தூய்மையான ஒருவன் அந்தக் கிடாரியின் சாம்பலைச் சேகரித்து, முகாமுக்கு வெளியே தூய்மையான ஓர் இடத்தில் வைக்க வேண்டும். அது இஸ்ரவேல் மக்களின் சபைக்காக, தீட்டுநீக்கும் தண்ணீருக்காகப் பாதுகாத்து வைக்கப்பட வேண்டும்[a]. அது பாவநிவாரண பலியாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தீட்டின் தண்ணீர்”; “தூய்மைப்படுத்தும் தண்ணீர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது தூய்மைப்படுத்தும் பலியாகும்.” எபிரெயச் சொல் חַטָּאת பாவநிவாரண பலியையும், ஆசாரியச் சடங்குச் சூழலில் தூய்மைப்படுத்தும் பலியையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: சடங்குமுறைப்படி தூய்மையான ஒருவன்
  rationale: אִישׁ என்பது ஒருமையில் ‘ஒரு ஆண்/ஒருவன்’ என்பதையும், טָהוֹר இச்சூழலில் சடங்குசார் தூய்மையையும் குறிக்கிறது. ‘ஒருவன்’ இயல்பான தமிழாகவும், ‘சடங்குமுறைப்படி’ என்பது பொருளைத் தெளிவாக்குவதாகவும் உள்ளது.
- source_word: וְאָסַף
  choice: சேகரித்து
  rationale: முன்னைய சடங்கு வழிமுறையைத் தொடரும் செயலைக் குறிக்கிறது; தமிழில் அடுத்த கட்டளையுடன் இணைக்கும் வினையெச்ச வடிவம் இயல்பானது.
- source_word: אֵפֶר הַפָּרָה
  choice: அந்தக் கிடாரியின் சாம்பல்
  rationale: אֵפֶר கூட்டுப்பொருளில் சாம்பலைக் குறிக்கிறது; פָּרָה பெண்பாலான மாட்டைக் குறிக்கிறது. இச்சடங்கின் குறிப்பிட்ட விலங்கை ‘கிடாரி’ துல்லியமாகத் தருகிறது.
- source_word: וְהִנִּיחַ
  choice: வைக்க வேண்டும்
  rationale: வைத்தல் அல்லது இடுதல் என்ற நேரடியான பொருளையும், சட்டச் சடங்கு வழிமுறையின் கட்டளைத் தன்மையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இங்கு இச்சொற்றொடர் இடத்தைக் குறிக்கிறது; ‘முகாமுக்கு வெளியே’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: בְּמָקוֹם טָהוֹר
  choice: தூய்மையான ஓர் இடத்தில்
  rationale: טָהוֹר சடங்குசார் தூய்மையைச் சுட்டினாலும், முன்பகுதியின் விளக்கத்தால் சூழல் தெளிவாக இருப்பதால் இங்கு சுருக்கமான ‘தூய்மையான’ போதுமானது.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: அது ... பாதுகாத்து வைக்கப்பட்டு
  rationale: பெண்பால் ஒருமை வினை சாம்பலைக் கூட்டுப்பொருளாகச் சுட்டுகிறது; לְמִשְׁמֶרֶת காவலில் வைத்திருத்தல் அல்லது சேமித்துவைத்தல் என்ற பொருளைக் கொண்டது.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபைக்காக
  rationale: עֵדָה இச்சட்டச் சூழலில் ‘சபை’ எனவும், בְּנֵי יִשְׂרָאֵל இயல்பான உள்ளடக்க மொழியில் ‘இஸ்ரவேல் மக்கள்’ எனவும் வழங்கப்பட்டுள்ளது.
- source_word: לְמֵי נִדָּה
  choice: தீட்டுநீக்கும் தண்ணீருக்குப் பயன்பட
  rationale: מֵי என்பது ‘தண்ணீர்’ என்றும், נִדָּה இங்கு சடங்குசார் தீட்டு அல்லது அதை அகற்றும் செயலைச் சார்ந்ததாகவும் உள்ளது. பயன்பாட்டைத் தெளிவாக்கும் இயல்பான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டு, மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: חַטָּאת הִוא
  choice: அது பாவநிவாரண பலியாகும்
  rationale: חַטָּאת என்பது ‘பாவம்’, ‘பாவநிவாரண பலி’, அல்லது ஆசாரியச் சடங்குச் சூழலில் ‘தூய்மைப்படுத்தும் பலி’ என அமையலாம். வழக்கமான பலிப்பெயர் முதன்மை உரையில் தரப்பட்டு, சடங்குசார் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தூய்மைப்படுத்தும் சடங்கில் חַטָּאת என்பதன் பொருள்
  choice: அது பாவநிவாரண பலியாகும்
  alternative: அது தூய்மைப்படுத்தும் பலியாகும்
  rationale: எபிரெயச் சொல் பாவத்தையும் பாவத்துடன் தொடர்புடைய பலியையும் குறிக்கக்கூடும்; ஆசாரியச் சடங்கு நூற்பகுதிகளில் தூய்மைப்படுத்தும் செயலையும் வலியுறுத்தலாம். பாரம்பரியமான சொல்லாக்கம் முதன்மை உரையில் வைக்கப்பட்டாலும், இவ்வசனத்தின் தூய்மைப்படுத்தும் சூழலை மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்டச் சடங்கு நடையைப் பயன்படுத்துகிறது. ‘சடங்குமுறைப்படி தூய்மையான’ என்பது முதல் இடத்தில் சூழலை வெளிப்படுத்துகிறது; பின்னர் தேவையற்ற மீளுரையைத் தவிர்க்க ‘தூய்மையான இடம்’ எனச் சுருக்கப்படுகிறது. மூலத்தின் பாலினக் குறிப்பும், נִדָּה மற்றும் חַטָּאת ஆகியவற்றின் உண்மையான பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
