  to: சடங்குமுறைப்படி தூய்மையான ஒருவன் அந்தக் கிடாரியின் சாம்பலைச் சேகரித்து, முகாமுக்கு வெளியே தூய்மையான ஓர் இடத்தில் வைக்க வேண்டும். அது இஸ்ரவேல் மக்களின் சபைக்காக, தீட்டுநீக்கும் தண்ணீருக்காகப் பாதுகாத்து வைக்கப்பட வேண்டும்[a]. அது பாவநிவாரண பலியாகும்[b].
