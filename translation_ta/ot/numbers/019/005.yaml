  source_fidelity: 'The Tamil accurately reflects the procedural force of וְשָׂרַף and יִשְׂרֹף with “எரிக்க வேண்டும்,” preserves the sight/presence sense of לְעֵינָיו in “அவன் கண்ணெதிரே,” and includes each listed item: hide, flesh, blood, and dung. “அதன் சாணத்தோடு சேர்த்து” appropriately conveys the inclusive/additive force of עַל פִּרְשָׁהּ. The repetition of the burning verb is retained.'
