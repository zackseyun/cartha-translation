translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் தொடக்க மற்றும் இறுதி ‘எரித்தல்’ வினை மீளுரையும் உடற்பகுதிகளின் பட்டியலும் தக்கவைக்கப்பட்டுள்ளன.
