source:
  edition: WLC
  text: וְ/שָׂרַ֥ף אֶת הַ/פָּרָ֖ה לְ/עֵינָ֑י/ו אֶת עֹרָ֤/הּ וְ/אֶת בְּשָׂרָ/הּ֙ וְ/אֶת דָּמָ֔/הּ עַל פִּרְשָׁ֖/הּ יִשְׂרֹֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: ta
  text: அவன் கண்ணெதிரே அந்தப் பசுவை எரிக்க வேண்டும்; அதன் தோலையும் சதையையும் இரத்தத்தையும், அதன் சாணத்தோடு சேர்த்து எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: எரிக்க வேண்டும்
  rationale: சடங்குமுறைச் சட்டத்தின் தொடரில் வரும் waw + qatal வடிவம் கட்டளையையும் கடமையையும் குறிக்கிறது; நவீனத் தமிழில் ‘எரிக்க வேண்டும்’ இயல்பாக அதைக் காட்டுகிறது.
- source_word: הַפָּרָה
  choice: அந்தப் பசுவை
  rationale: פָּרָה என்பது பெண் மாட்டைக் குறிக்கிறது. முந்தைய சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட விலங்கு என்பதால், தமிழில் ‘அந்தப் பசு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְעֵינָיו
  choice: அவன் கண்ணெதிரே
  rationale: சொல்லர்த்தமாக ‘அவனுடைய கண்களுக்கு முன்’; நேரடிப் பார்வையிலும் முன்னிலையிலும் நடப்பதைத் தமிழில் உயிரோட்டமாகக் காட்டுகிறது.
- source_word: עֹרָהּ
  choice: அதன் தோல்
  rationale: עוֹר என்பது விலங்கின் தோல்; ‘தோல்’ நவீனத் தமிழில் நேரடியான, இயல்பான சொல்.
- source_word: בְּשָׂרָהּ
  choice: அதன் சதை
  rationale: בָּשָׂר என்பதன் அடிப்படைப் பொருள் ‘சதை’; பலியியல் சூழலிலும் இது துல்லியமானது.
- source_word: דָּמָהּ
  choice: அதன் இரத்தம்
  rationale: דָּם என்பதற்கான நேரடியான மொழிபெயர்ப்பு.
- source_word: עַל פִּרְשָׁהּ
  choice: அதன் சாணத்தோடு சேர்த்து
  rationale: פֶּרֶשׁ குறிப்பாகச் சாணம் அல்லது கழிவைக் குறிக்கிறது; இங்கு עַל பட்டியலில் அதையும் சேர்த்துக் கொள்வதைக் காட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׂרֹף
  choice: எரிக்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தலில் வரும் imperfect வடிவம் செய்ய வேண்டிய செயலைக் குறிக்கிறது; இறுதியில் வினையை மீண்டும் கூறுவது எபிரெய உரையின் வலியுறுத்தலைத் தக்கவைக்கிறது.
