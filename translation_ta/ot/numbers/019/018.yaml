  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: ta
  text: பின்னர், சடங்குசார் தூய்மையுள்ள ஒரு ஆண்[a] ஈசோப்புச் செடியை எடுத்து அந்தத் தண்ணீரில் தோய்த்து, கூடாரத்தின்மேலும், எல்லாப் பொருள்களின்மேலும், அங்கே இருந்தவர்களின்மேலும், எலும்பையோ, கொல்லப்பட்ட ஒருவரின் உடலையோ[b], இறந்த ஒருவரையோ, கல்லறையையோ தொட்டவரின்மேலும் தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயம் ஒருமை ஆண்பாலில் உள்ளது; இங்குள்ள ‘சடங்குசார் தூய்மையுள்ள’ என்பது ஒழுக்கநிலையை அல்ல, சடங்குசார் தூய்மைநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கொல்லப்பட்டவர்’ அல்லது ‘கொல்லப்பட்ட ஒருவரின் சடலம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாக வன்முறையால் கொல்லப்பட்டவரைக் குறிக்கிறது; அடுத்து வரும் பொதுவான ‘இறந்த ஒருவர்’ என்பதிலிருந்து இது வேறுபடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: ஈசோப்புச் செடி
  rationale: சுத்திகரிப்புச் சடங்கில் பயன்படுத்தப்பட்ட தாவரத்திற்கான மரபான பெயரைத் தக்கவைக்கிறது; தாவரவியல் அடையாளத்தை ஊகித்து குறிப்பிட்ட உள்ளூர் தாவரப் பெயரைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בַּמַּיִם
  choice: அந்தத் தண்ணீரில்
  rationale: எபிரெயத்தில் உள்ள சுட்டுத்தன்மையைப் பாதுகாத்து, முந்தைய சூழலில் ஆயத்தப்படுத்தப்பட்ட தீட்டுநீக்கத் தண்ணீரையே குறிக்கிறது.
- source_word: אִישׁ טָהוֹר
  choice: சடங்குமுறைப்படி தூய்மையான ஒரு ஆண்
  rationale: אִישׁ என்பதன் ஒருமை ஆண்பாலைக் காக்கிறது; טָהוֹר இங்கு ஒழுக்கநிலையை அல்ல, சடங்குசார் தூய்மைநிலையைக் குறிக்கிறது என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: சுத்திகரிப்புத் தண்ணீரைத் துளிகளாகப் பயன்படுத்தும் சடங்குச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: இங்கு திருக்கூடாரத்தை அல்ல, மரணம் நிகழ்ந்த கூடார வாழிடத்தைக் குறிக்கிறது.
- source_word: הַכֵּלִים
  choice: எல்லாப் பொருள்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், உடைமைகள் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல்; ‘பொருள்கள்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: הַנְּפָשׁוֹת
  choice: அங்கே இருந்தவர்கள்
  rationale: נֶפֶשׁ இச்சூழலில் ‘ஆத்துமாக்கள்’ என்ற தனி மானிடவியல் கருத்தை அல்ல, அங்கிருந்த நபர்களைக் குறிக்கிறது.
- source_word: הַנֹּגֵעַ
  choice: தொட்டவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினையின் தனிநபர் குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בָּעֶצֶם
  choice: எலும்பு
  rationale: மனித எலும்புடன் ஏற்பட்ட தொடர்பே சூழலில் கருத்தாக உள்ளது; எபிரெய ஒருமை காக்கப்படுகிறது.
- source_word: בֶחָלָל
  choice: கொல்லப்பட்ட ஒருவரின் உடல்
  rationale: חָלָל என்பது வன்முறையால் கொல்லப்பட்டவரைச் சிறப்பாகக் குறிக்கிறது; அடுத்துள்ள பொதுவான ‘இறந்தவர்’ என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: בַמֵּת
  choice: இறந்த ஒருவர்
  rationale: מֵת என்பது வன்முறைக் கொலையை மட்டும் குறிக்காத பொதுவான சொல்; חָלָל உடனான வேறுபாடு காக்கப்படுகிறது.
- source_word: בַקָּבֶר
  choice: கல்லறை
  rationale: அடக்க இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
theological_decisions:
- issue: சடங்குசார் தூய்மைச் சொற்பயன்பாடு
  choice: சடங்குமுறைப்படி தூய்மையான
  alternative: பரிசுத்தமான / மாசற்ற
  rationale: இந்த வசனம் மரணத் தொடர்பால் ஏற்படும் சடங்குசார் தீட்டைப் பற்றியது; ஒழுக்கத் தூய்மை அல்லது உள்ளார்ந்த பரிசுத்தம் என்ற கருத்தை தேவையின்றி புகுத்தாமல் இருக்கிறது.
- issue: אִישׁ என்பதிலுள்ள ஆண்பால் குறிப்பு
  choice: ஒரு ஆண்
  alternative: ஒருவர்
  rationale: மூல எபிரெயத்தின் வெளிப்படையான ஒருமை ஆண்பாலைக் காக்கிறது; அதேவேளை அந்த நபருக்கான முக்கிய நிபந்தனை சடங்குசார் தூய்மைநிலை என்பதையும் உரை தெரிவிக்கிறது.
- issue: חָלָל மற்றும் מֵת இடையிலான வேறுபாடு
  choice: கொல்லப்பட்ட ஒருவரின் உடல் / இறந்த ஒருவர்
  alternative: சடலம் / இறந்தவர்
  rationale: முதற்சொல்லின் வன்முறையால் கொல்லப்பட்டவர் என்ற குறிப்பையும், அடுத்த சொல்லின் பொதுவான மரணக் குறிப்பையும் ஒன்றாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் தமிழில் தெளிவாக இருக்க ‘-ன்மேலும்’ மற்றும் ‘-யோ’ தொடர்கள் ஒழுங்காகப் பயன்படுத்தப்பட்டுள்ளன. ‘அதிலிருந்த’ என்பது பொருள்கள் கூடாரத்தில் இருந்தன என்ற சூழல்சார் தொடர்பை இயல்பாக்குகிறது.
