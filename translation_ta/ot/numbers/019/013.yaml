base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: ta
  text: இறந்த ஒருவரை—அதாவது, இறந்துபோன ஒரு மனிதனின் உடலை—தொடுகிற எவரும் தன்னைத் தூய்மைப்படுத்திக்கொள்ளாவிட்டால், அவர் யெகோவாவின் திருக்கூடாரத்தைத் தீட்டுப்படுத்தியிருக்கிறார். அந்த நபர் இஸ்ரவேலிலிருந்து அறுப்புண்டுபோவார். ஏனெனில், தீட்டுநீக்கும் தண்ணீர்[a] அவர்மேல் தெளிக்கப்படவில்லை. அவர் தீட்டுள்ளவராக இருப்பார்; அவருடைய தீட்டு இன்னும் அவர்மேல் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தீட்டின் தண்ணீர்.” பிணத்தால் ஏற்பட்ட தீட்டை நீக்கப் பயன்படுத்தப்பட்ட தண்ணீரை இது குறிக்கிறது. “சுத்திகரிப்புத் தண்ணீர்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: தொடுகிற
  rationale: נגע இங்கு உடல்ரீதியான தொடுதலைக் குறிக்கிறது; நேரடியும் இயல்பானதுமான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּמֵת בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: இறந்த ஒருவரை—அதாவது, இறந்துபோன ஒரு மனிதனின் உடலை—
  rationale: முதல் சொற்றொடருக்கும் அதை விளக்கும் பின்வரும் appositional சொற்றொடருக்கும் இடையிலான எபிரெய இணைப்பைப் பாதுகாக்கிறது; נֶפֶשׁ இச்சடங்கு சார்ந்த சூழலில் இறந்த உடலைக் குறிக்கிறது.
- source_word: יִתְחַטָּא
  choice: தன்னைத் தூய்மைப்படுத்திக்கொள்ளாவிட்டால்
  rationale: Hitpael வடிவம் இங்கு ஒழுக்க மனந்திரும்புதலை அல்ல, சடங்குமுறைத் தூய்மைப்படுத்தலைக் குறிக்கிறது.
- source_word: מִשְׁכַּן יְהוָה
  choice: யெகோவாவின் திருக்கூடாரம்
  rationale: מִשְׁכָּן என்பது தேவனுடைய வாசஸ்தலக் கூடாரத்தைக் குறிக்கிறது; திருக்கூடாரம் தெளிவான வழிபாட்டுச் சூழல் சொல்லாகும். יהוה தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: טִמֵּא
  choice: தீட்டுப்படுத்தியிருக்கிறார்
  rationale: Piel வடிவம் திருக்கூடாரத்தைச் சடங்குரீதியாகத் தீட்டாக்கிய செயலைக் குறிக்கிறது; எபிரெய நிறைவுற்ற வினையின் விளைவு தொடர்வதையும் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் ... அறுப்புண்டுபோவார்
  rationale: נֶפֶשׁ இங்கு நபரைக் குறிக்கிறது. 'அறுப்புண்டுபோவார்' என்பது தண்டனையின் துல்லிய முறையைத் தீர்மானிக்காமல் உடன்படிக்கை சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵי נִדָּה
  choice: தீட்டுநீக்கும் தண்ணீர்
  rationale: பிணத் தீட்டை நீக்கப் பயன்படுத்தப்பட்ட சிறப்புத் தண்ணீரின் செயல்பாட்டை இயல்பான தமிழில் கூறுகிறது; எபிரெய மொழியின் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זֹרַק עָלָיו
  choice: அவர்மேல் தெளிக்கப்படவில்லை
  rationale: சடங்குச் சூழலில் זרה என்பது தெளித்தலைக் குறிக்கிறது; செயப்பாட்டு வடிவம் கருத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: טָמֵא יִהְיֶה
  choice: அவர் தீட்டுள்ளவராகவே இருப்பார்
  rationale: தொடரும் சடங்குநிலை வலியுறுத்தப்படுகிறது; 'வே' அந்த நிலையின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: அவருடைய தீட்டு இன்னும் அவர்மேல் இருக்கிறது
  rationale: עוֹד குறிக்கும் தொடர்ச்சியையும், தீட்டு நபர்மேல் இருப்பதாகக் கூறும் எபிரெய உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: '''அறுப்புண்டுபோதல்'' என்னும் தண்டனையின் பொருள்'
  choice: தண்டனையின் முறையை விளக்காமல் உடன்படிக்கைச் சூத்திரத்தை 'இஸ்ரவேலிலிருந்து அறுப்புண்டுபோவார்' என்று தக்கவைத்தல்
  alternative: கொல்லப்படுவார் / சமூகத்திலிருந்து விலக்கப்படுவார்
  rationale: இந்த வசனத்தில் כּרת என்பதன் நடைமுறை மரணமா, தெய்வீகத் தண்டனையா, சமூக விலக்கலா என்பது வெளிப்படையாக வரையறுக்கப்படவில்லை; அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: אָדָם என்பதன் பொதுமை ஒருமை
  choice: வசனத்தின் தொடக்கத்தில் 'எவரும்' என்றும், உட்பொதிந்த சொற்றொடரில் 'ஒரு மனிதனின் உடல்' என்றும் மொழிபெயர்த்தல்
  alternative: ஒரு நபரின் உடல் / ஒரு மனித உயிரின் சடலம்
  rationale: אָדָם என்பதன் மனிதன் சார்ந்த நேரடிப் பொருளையும், கட்டளையின் அனைவரையும் உள்ளடக்கும் பயன்பாட்டையும் ஒருங்கே பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. சடங்குமுறைத் தூய்மை/தீட்டு என்ற வேறுபாடு தெளிவாக வைக்கப்பட்டுள்ளது; மரியாதை ஒருமையான அவர் வடிவம் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள விளக்க மறுஉரையை em dash மூலம் வெளிப்படுத்தியுள்ளது.
