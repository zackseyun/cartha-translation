- from: ஆனால் தீட்டுப்பட்டும் தன்னைத் தூய்மைப்படுத்திக்கொள்ளாத மனிதன்—அந்த நபர் சபையின் நடுவிலிருந்து அறுத்துப்போடப்படுவான்[a]. ஏனெனில், அவன் யெகோவாவின் பரிசுத்த இடத்தைத் தீட்டுப்படுத்தியிருக்கிறான். தீட்டுக்கான நீர் அவன்மேல் தெளிக்கப்படவில்லை[b]; அவன் தீட்டுள்ளவன்.
  to: ஆனால், தீட்டுப்பட்டு, தன்னைத் தூய்மைப்படுத்திக்கொள்ளாத மனிதன்—அந்த நபர் சபையின் நடுவிலிருந்து துண்டிக்கப்படுவான்[a]. ஏனெனில், அவன் யெகோவாவின் திருத்தலத்தைத் தீட்டுப்படுத்தியிருக்கிறான். தீட்டைப் போக்கும் நீர் அவன்மேல் தெளிக்கப்படவில்லை[b]; அவன் தீட்டுப்பட்டவனே.
