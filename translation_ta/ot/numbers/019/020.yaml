  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: ta
  text: ஆனால், தீட்டுப்பட்டு, தன்னைத் தூய்மைப்படுத்திக்கொள்ளாத மனிதன்—அந்த நபர் சபையின் நடுவிலிருந்து துண்டிக்கப்படுவான்[a]. ஏனெனில், அவன் யெகோவாவின் திருத்தலத்தைத் தீட்டுப்படுத்தியிருக்கிறான். தீட்டைப் போக்கும் நீர் அவன்மேல் தெளிக்கப்படவில்லை[b]; அவன் தீட்டுப்பட்டவனே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த உயிர் துண்டிக்கப்படும்.” எபிரெயச் சட்டச் சொல்லாட்சியில் “உயிர்” என்பது உடலற்ற ஆன்மாவை மட்டும் அல்லாமல் முழு நபரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீட்டின் நீர்”; மரபாக, “பிரிவினையின் நீர்.” இச்சொற்றொடர் இந்த அதிகாரத்தில் தயாரிக்கப்படும் தூய்மைப்படுத்தும் நீரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: மனிதன்
  rationale: இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், இச்சட்டச் சூழலில் ஓர் இஸ்ரவேலரைப் பொதுவாகக் குறிக்கிறது; மூல வடிவையும் பொதுப் பயன்பாட்டையும் ‘மனிதன்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்பட்டும்
  rationale: இங்கு טמא அறநெறிக் குற்றத்தை அல்ல, சடங்குசார் தீட்டு நிலைக்கு ஆளாவதைக் குறிக்கிறது.
- source_word: יִתְחַטָּא
  choice: தன்னைத் தூய்மைப்படுத்திக்கொள்ளாத
  rationale: இந்தத் தூய்மைப்படுத்தல் சூழலில் התפעל வடிவம் பாவம் செய்வதை அல்ல, தீட்டிலிருந்து தூய்மையடைவதற்கான செயலைக் குறிக்கிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் ... அறுத்துப்போடப்படுவான்
  rationale: נפש என்ற சொல் சட்டச் சூத்திரத்தில் முழு நபரைக் குறிக்கலாம். ‘அறுத்துப்போடப்படுவான்’ என்ற உருவகம் தண்டனையின் துல்லியமான செயல்முறையை நிர்ணயிக்காமல் எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: சபையின் நடுவிலிருந்து
  rationale: קהל உடன்படிக்கைச் சமூகத்தின் கூடுகையைக் குறிக்கிறது; ‘நடுவிலிருந்து’ என்பது எபிரெய முன்னிடைத் தொடரை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: מִקְדַּשׁ יְהוָה
  choice: யெகோவாவின் பரிசுத்த இடம்
  rationale: מקדש என்பது புனித வளாகம் அல்லது பரிசுத்த இருப்பிடத்தைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் தமிழில் ‘யெகோவா’ என்று வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: טִמֵּא
  choice: தீட்டுப்படுத்தியிருக்கிறான்
  rationale: பியெல் வடிவம் பரிசுத்த இடத்தைத் தீட்டாக்கிய causative பொருளைக் கொண்டுள்ளது; தமிழ் தேர்வு அதன் சடங்குசார் தீவிரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵי נִדָּה
  choice: தீட்டுக்கான நீர்
  rationale: இவ்வதிகாரத்தில் சடலத் தீட்டை அகற்றுவதற்காகத் தயாரிக்கப்பட்ட நீரைக் குறிக்கிறது. ‘தீட்டுக்கான’ என்பது நோக்கம்/தொடர்பைத் தக்கவைத்து, தவறாகப் புரியக்கூடிய ‘பிரிவினையின் நீர்’ என்பதைத் தவிர்க்கிறது.
- source_word: זֹרַק עָלָיו
  choice: அவன்மேல் தெளிக்கப்படவில்லை
  rationale: சடங்குச் சூழலில் זרק திரவத்தைத் தெளித்தல் அல்லது வீசுதலைக் குறிக்கிறது; ‘தெளிக்கப்படவில்லை’ இயல்பான தமிழ் வழக்கு.
- source_word: טָמֵא הוּא
  choice: அவன் தீட்டுள்ளவன்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியம் அவனது தற்போதைய சட்ட/சடங்கு நிலையை நேரடியாக அறிவிக்கிறது.
theological_decisions:
- issue: ‘அறுத்துப்போடப்படுதல்’ என்ற தண்டனையின் தன்மை
  choice: மரணம், சமூக விலக்கம், அல்லது தேவதண்டனை என்று குறிப்பாக நிர்ணயிக்காமல் எபிரெய உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘சமூகத்திலிருந்து நீக்கப்படுவான்’ அல்லது ‘கொல்லப்படுவான்’
  rationale: இந்த உடன்படிக்கைச் சட்டச் சூத்திரம் தண்டனை எவ்வாறு நிறைவேறும் என்பதை இவ்விடத்தில் வரையறுக்கவில்லை. உருவகத்தைத் தக்கவைப்பது உரையின் சட்ட மற்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. சடங்குசார் טמא என்பதற்கு அறக்குற்றத்தை உணர்த்தும் சொற்களைத் தவிர்த்து ‘தீட்டு’ பயன்படுத்தப்பட்டது. ‘அறுத்துப்போடப்படுவான்’ சற்றே உருவகத் தன்மை கொண்டிருந்தாலும், விவாதத்திற்குரிய தண்டனை முறையை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்காமல் இருக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளது.
