translation:
  language: ta
  text: 'யாவே மோசேயிடமும் ஆரோனிடமும் பேசினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்ற வினைச்சொல் புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தெய்வீக உரையை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்க ‘பேசினார்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: எபிரேயத்தில் இருவருக்கும் முன் אֶל மீண்டும் வருவதால், இருவரும் தனித்தனியாக உரையின் பெறுநர்கள் என்பது தமிழ் இணை அமைப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரேயச் சூத்திரத்தை இயல்பான தமிழ் வேதாகம நடையில் வெளிப்படுத்துகிறது; முற்றுப்புள்ளிக்குப் பதிலாக முக்காற்புள்ளி தொடரும் மேற்கோளைச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரியல் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும் கண்ணியமான நடை. எபிரேய உரையின் இரட்டை மறைமுகப் பெறுநர் அமைப்பு தமிழில் ‘-யிடமும் ... -யிடமும்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
