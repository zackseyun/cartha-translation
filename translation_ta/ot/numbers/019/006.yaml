id: NUM.19.6
reference: Numbers 19:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: ta
  text: பின்பு ஆசாரியன் கேதுரு மரத்துண்டையும், ஈசோப்பையும், செந்நிற நூலையும் எடுத்து, பெண் மாட்டின் எரிப்பின் நடுவில் அவற்றை எறிய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் + காத்தல் வடிவம் சடங்கின் அடுத்த கட்டத்தை வரிசையாக அறிவுறுத்துகிறது; தமிழில் ‘பின்பு ... எடுத்து’ என்பது அந்த நடைமுறைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: வழிபாட்டுச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: עֵץ אֶרֶז
  choice: தேவதாரு மரக்கட்டை
  rationale: ‘தேவதாரு மரம்’ என்ற பொருளைத் தக்கவைத்து, இங்கு எடுக்கப்படும் தனிப்பட்ட எரிபொருள்/மரப்பொருளை ‘மரக்கட்டை’ தெளிவாக்குகிறது.
- source_word: וְאֵזוֹב
  choice: ஈசோப்பு
  rationale: தாவரத்தின் துல்லியமான இன அடையாளம் விவாதத்திற்குரியது; எனவே மரபாக அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, உறுதியற்ற தாவரவியல் அடையாளம் திணிக்கப்படவில்லை.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: செந்நிற நூல்
  rationale: இந்தச் சொற்றொடர் சிவப்பு/செந்நிறச் சாயம் ஏற்றப்பட்ட நூல் அல்லது நார்ப்பொருளைக் குறிக்கிறது; ‘செந்நிற நூல்’ சடங்குப் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְהִשְׁלִיךְ
  choice: அவற்றை எறிய வேண்டும்
  rationale: ஹிஃபில் வினையின் ‘எறிதல்’ பொருளும், கட்டளையிடும் சடங்கு நடையின் விதிப்பொருளும் காக்கப்படுகின்றன; தமிழில் தேவையான செயப்படுபொருள் முன் பட்டியலிடப்பட்ட பொருட்களைக் குறிக்க வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: אֶל תּוֹךְ
  choice: நடுவே
  rationale: வெறுமனே ‘உள்ளே’ என்பதைக் காட்டிலும் உள்பகுதி அல்லது நடுப்பகுதி என்ற மூலத்தின் வலியுறுத்தலைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: எரிந்துகொண்டிருக்கும் பெண் மாடு
  rationale: שְׂרֵפָה இங்கு நடைபெறும் எரித்தல் நிகழ்வைக் குறிக்கிறது; தமிழ் இயல்புக்காக தொடர்ச்சியான நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது. פָּרָה என்பது பெண் மாட்டைக் குறிக்கும் என்பதால் பாலினம் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: சிவப்புப் பெண் மாட்டுத் தூய்மைப்படுத்தும் சடங்கில் פָּרָה என்பதன் மொழிபெயர்ப்பு
  choice: பெண் மாடு
  alternative: கிடாரி
  rationale: எபிரெயச் சொல் பெண் இன மாட்டைக் குறிக்கிறது; அதன் வயது அல்லது இதுவரை கன்று ஈன்றதா என்பதை இந்தச் சொல் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே பொதுவாகவும் துல்லியமாகவும் ‘பெண் மாடு’ தேர்ந்தெடுக்கப்பட்டு, மரபான ‘கிடாரி’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு விதிமுறைக்கேற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான தாவரப் பெயருக்கு மரபான ‘ஈசோப்பு’ தக்கவைக்கப்பட்டுள்ளது; வாக்கியம் சாதாரண வாசகருக்கும் இயல்பாகப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
