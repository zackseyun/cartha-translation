base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: ta
  text: நீங்கள் அதை[b] ஆசாரியனாகிய எலெயாசாரிடம் கொடுக்க வேண்டும். அவன் அதை முகாமுக்கு வெளியே கொண்டுபோக வேண்டும்; அது அவன் முன்னிலையில் அறுக்கப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வாக்கியம் முழுவதிலும் மறைந்திருக்கும் எழுவாய் எலெயாசாரே என்று எடுத்துக்கொண்டால், “அவன் அதைத் தன் முன்னிலையில் அறுக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் இங்குள்ள சுட்டுப்பெயர் பெண்பால் ஒருமையில் இருந்து சிவப்புப் பசுவைக் குறிக்கிறது; தமிழில் இயல்பாக “அதை” என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: நீங்கள் கொடுக்க வேண்டும்
  rationale: சட்டவிதி சார்ந்த சூழலில் இணைப்புடன் வரும் Qal perfect கட்டளை அல்லது கடமையைச் சுட்டுகிறது. பன்மை இரண்டாம் நபரைத் தெளிவாகக் காக்கிறது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் சிவப்புப் பசுவைக் குறிக்கிறது. தமிழில் விலங்கைக் குறிக்க இயல்பான அஃறிணை வடிவம் ‘அதை’.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசாரிடம்
  rationale: பெயரையும் பதவியையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது; אֶל என்பதன் பெறுநர் பொருளை ‘-ிடம்’ வெளிப்படுத்துகிறது.
- source_word: וְהוֹצִיא
  choice: அவன் அதை … வெளியே கொண்டுபோக வேண்டும்
  rationale: יצא என்பதன் Hiphil வடிவத்திலுள்ள ‘வெளியே போகச் செய்தல்/கொண்டுபோதல்’ என்ற காரணவினைப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: ‘முகாமின் வெளிப்புறத்துக்கு’ என்ற திசைநோக்கிய பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְשָׁחַט
  choice: அறுக்கப்பட வேண்டும்
  rationale: எபிரெயத்தில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழில் செயப்பாட்டு வடிவம் அறுப்பவர் யார் என்பதைத் தீர்மானிக்காமல் செயலைச் சொல்கிறது.
- source_word: לְפָנָיו
  choice: அவன் முன்னிலையில்
  rationale: ‘அவனுக்கு முன்பாக/அவன் பார்வையில்’ என்பதன் சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்தில் பசுவை அறுப்பவர் யார்?
  choice: அறுப்பு எலெயாசாரின் முன்னிலையில் நடக்கிறது என்று கூறி, அறுப்பவரை வெளிப்படையாக அடையாளப்படுத்தாமல் விடுதல்.
  alternative: எலெயாசாரே அதைக் கொண்டுபோய், தன் முன்னிலையில் அதை அறுக்கிறார் என்று தொடர்ச்சியான ஒரே எழுவாயாகப் புரிந்துகொள்ளுதல்.
  rationale: וְהוֹצִיא மற்றும் וְשָׁחַט ஆகிய இரு வினைகளுக்கும் வெளிப்படாத மூன்றாம் நபர் ஒருமை எழுவாய் உள்ளது; ஆகவே எலெயாசாரே தொடர்ந்து எழுவாயாக இருக்கலாம். ஆனால் ‘அவன் முன்னிலையில்’ என்ற இறுதித் தொடர், அறுப்பவர் வேறொருவராக இருக்கலாம் என்பதற்கும் இடமளிக்கிறது. செயப்பாட்டு மொழிபெயர்ப்பு இந்த உண்மையான தெளிவின்மையைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டவிதி நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியன்’ என்ற பரவலாக அறியப்பட்ட வேதாகமப் பதவிச்சொல் காக்கப்பட்டுள்ளது; ‘முகாம்’ நவீன வாசகர்களுக்கு இயல்பான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் எழுவாய் தெளிவின்மை செயப்பாட்டு வடிவத்தாலும் அடிக்குறிப்பாலும் பாதுகாக்கப்பட்டுள்ளது.
