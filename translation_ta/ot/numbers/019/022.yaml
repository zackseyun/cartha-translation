  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: ta
  text: தீட்டுப்பட்டவர் தொடும் எதுவும் தீட்டுப்படும்; அதைத் தொடுகிற நபரும்[a] மாலைவரை தீட்டுப்பட்டிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைத் தொடுகிற ஒவ்வொரு நபரும் மாலைவரை தீட்டுப்பட்டிருப்பார்.” எபிரெயத்தில் நெஃபெஷ் என்பதன் நேர்ப்பொருள் “உயிர்” அல்லது “ஆத்துமா”; ஆனால் அது பெரும்பாலும் ஒரு நபரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: எதுவும்
  rationale: כֹל אֲשֶׁר என்பதன் அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יִגַּע בּוֹ
  choice: தொடும்
  rationale: נגע என்பது இங்கு சடங்குமுறைத் தீட்டு பரவும் உடல்தொடர்பைக் குறிக்கிறது; ‘தொடும்’ இதை நேராகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַטָּמֵא
  choice: தீட்டுப்பட்டவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்த அடைமொழி, சடங்குமுறைத் தீட்டுள்ள நபரைக் குறிக்கிறது. ‘தீட்டுப்பட்டவர்’ என்பது ஒழுக்கக் குற்றத்தைச் சுமத்தாமல் அந்த நிலையைக் காட்டுகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்படும்
  rationale: தொடுதலின் விளைவாகத் தீட்டான நிலைக்கு வருவதை வினை வடிவில் தெளிவாகக் காட்டுகிறது.
- source_word: וְהַנֶּפֶשׁ
  choice: நபரும்
  rationale: נֶפֶשׁ என்பதற்கு ‘உயிர்’ அல்லது ‘ஆத்துமா’ என்ற சொற்பொருள்கள் இருந்தாலும், இந்தச் சட்டச் சூழலில் அது முழு நபரைக் குறிக்கிறது.
- source_word: הַנֹּגַעַת
  choice: அதைத் தொடுகிற
  rationale: பெண்பால் ஒருமை வினையெச்சம் נֶפֶשׁ உடன் இயைந்து, தொடும் நபரை விவரிக்கிறது; முந்தைய பொருளைச் சுட்ட ‘அதை’ தமிழில் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: תִּטְמָא
  choice: தீட்டுப்பட்டிருப்பார்
  rationale: தொடுகிற நபர் அடையும் தொடரும் சடங்குமுறைத் தீட்டு நிலையை இது இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நீடிக்கும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குமுறைத் தீட்டைக் குறிக்கும் טמא மொழியின் தன்மை
  choice: ‘தீட்டு / தீட்டுப்பட்ட’ என மொழிபெயர்த்தல்
  alternative: ‘அசுத்தம்’, ‘களங்கம்’, அல்லது ‘பாவம்’
  rationale: இந்த வசனம் தொடுதலால் பரவும் சடங்குமுறைத் தீட்டைப் பற்றியது; அது அவசியமாக ஒழுக்கக் குற்றத்தையோ பாவத்தையோ குறிக்கவில்லை. ‘தீட்டு’ அந்தச் சட்டச் சூழலைப் பாதுகாக்கிறது.
- issue: נֶפֶשׁ என்பதன் குறிப்பு
  choice: ‘நபர்’
  alternative: ‘உயிர்’ அல்லது ‘ஆத்துமா’
  rationale: இங்கு உடலும் உள்ளமும் பிரிக்கப்பட்ட ஓர் அங்கத்தை அல்ல, தொடுகிற முழு மனிதரையே சொல் குறிக்கிறது; ஆகவே இறையியல் மனிதவியல் கருத்தொன்றை உரைக்குள் இறக்குமதி செய்யாமல் ‘நபர்’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குமுறைச் சட்டத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீட்டு’ என்பது இங்கு ஒழுக்கத் தீர்ப்பாக அல்லாமல் சடங்குமுறை நிலையாகப் பயன்படுத்தப்பட்டுள்ளது; மரியாதை ஒருமை வினைமுற்றுகள் இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டுள்ளன.
