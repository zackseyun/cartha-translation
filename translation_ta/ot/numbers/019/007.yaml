revisions:
- from: பின்பு ஆசாரியன் தன் உடைகளைக் கழுவி, தன் உடலைத் தண்ணீரில் குளிப்பாட்ட வேண்டும். அதற்குப் பிறகு அவன் முகாமுக்குள் வரலாம்; ஆனாலும் ஆசாரியன் மாலைவரை சடங்குப்படி தீட்டுள்ளவனாக இருப்பான்.[a]
  to: ஆசாரியன் தன் ஆடைகளைத் துவைக்கவும், தன் உடலைத் தண்ணீரில் கழுவிக்கொள்ளவும் வேண்டும். அதன்பின் அவன் முகாமுக்குள் வரலாம்; ஆயினும், ஆசாரியன் மாலைவரை சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக இருப்பான்.[a]
  rationale: The revision corrects the causative sense of “குளிப்பாட்ட” and improves the idiomatic expression of ritual impurity. It preserves the Hebrew legal-procedural force, the permitted re-entry into the camp, and the temporal limit of impurity until evening.
