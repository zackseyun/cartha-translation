review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the procedural sequence, permitted return to the camp, and the priest's ritual impurity until evening. However, “குளிப்பாட்ட வேண்டும்” is causative (‘make/bathe someone’) and does not naturally express that the priest washes his own body.
  naturalness: “தன் உடலைத் தண்ணீரில் கழுவிக்கொள்ளவும் வேண்டும்” is idiomatic modern standard Tamil. “சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக” is clearer and more natural than “சடங்குப்படி தீட்டுள்ளவனாக.”
  terminology: “ஆசாரியன்,” “முகாம்,” and “தீட்டு” appropriately convey the cultic/legal register. The note correctly distinguishes ritual impurity from moral fault.
  issues:
  - severity: medium
    issue: Causative verb in bodily washing clause
    rationale: “குளிப்பாட்ட” normally means to bathe another person, whereas Hebrew וְרָחַץ בְּשָׂרוֹ requires the priest himself to wash his body.
  - severity: low
    issue: Awkward expression for ritual impurity
    rationale: “சடங்குப்படி தீட்டுள்ளவனாக” is understandable but less idiomatic than “சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக,” while retaining the non-moral ritual sense.
  revised_text: ஆசாரியன் தன் ஆடைகளைத் துவைக்கவும், தன் உடலைத் தண்ணீரில் கழுவிக்கொள்ளவும் வேண்டும். அதன்பின் அவன் முகாமுக்குள் வரலாம்; ஆயினும், ஆசாரியன் மாலைவரை சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக இருப்பான்.[a]
