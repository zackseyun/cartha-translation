    reason: cultural_note
  revision_rationale: The revision corrects the causative sense of “குளிப்பாட்ட” and improves the idiomatic expression of ritual impurity. It preserves the Hebrew legal-procedural force, the permitted re-entry into the camp, and the temporal limit of impurity until evening.
