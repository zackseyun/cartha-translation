  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: ta
  text: ஆசாரியன் தன் ஆடைகளைத் துவைக்கவும், தன் உடலைத் தண்ணீரில் கழுவிக்கொள்ளவும் வேண்டும். அதன்பின் அவன் முகாமுக்குள் வரலாம்; ஆயினும், ஆசாரியன் மாலைவரை சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக இருப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தீட்டு’ என்பது சடங்கு சார்ந்த தூய்மையின்மையைக் குறிக்கிறது; அது தனிப்பட்ட பாவத்தையோ அறநெறிக் குற்றத்தையோ அவசியமாகக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: כִּבֶּס என்பதன் தீவிர வினை வடிவம் உடைகளைக் கழுவுவதைக் குறிக்கிறது; ‘உடைகள்’ என்பது இன்றைய தமிழில் இயல்பான சொல்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான தமிழ் இணைச்சொல்.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: தன் உடலைத் தண்ணீரில் குளிப்பாட்ட வேண்டும்
  rationale: בָּשָׂר இங்கு ‘சதை’ என்பதைக் காட்டிலும் முழு உடலைக் குறிக்கிறது; רָחַץ மற்றும் בַּמַּיִם சேர்ந்து தண்ணீரில் உடலைக் குளிப்பாட்டுவதைக் கூறுகின்றன.
- source_word: וְאַחַר
  choice: அதற்குப் பிறகு
  rationale: சடங்கு நடவடிக்கைகளின் கால வரிசையை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: அவன் முகாமுக்குள் வரலாம்
  rationale: கழுவிய பிறகு மீண்டும் நுழைய அனுமதி உண்டு என்ற சூழல்சார் பொருளை ‘வரலாம்’ வெளிப்படுத்துகிறது; எபிரெய வடிவத்தை கட்டாயக் கட்டளையாக மட்டும் குறுக்கவில்லை.
- source_word: וְטָמֵא
  choice: சடங்குப்படி தீட்டுள்ளவனாக இருப்பான்
  rationale: טָמֵא இச்சூழலில் அறநெறிக் குற்றத்தைக் காட்டாமல் வழிபாட்டுச் சடங்கு சார்ந்த தூய்மையின்மையைக் குறிக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: குறிக்கப்பட்ட சடங்கு நிலை முடியும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தீட்டின் தன்மை
  choice: சடங்கு சார்ந்த தீட்டு
  alternative: தனிப்பட்ட பாவம் அல்லது அறநெறிக் குற்றம்
  rationale: எண்ணாகமம் 19-ன் சூழலில் இது தற்காலிகமான வழிபாட்டுச் சடங்கு நிலை; தனிப்பட்ட பாவத்தையோ அறநெறிக் குற்றத்தையோ அவசியமாகக் குறிக்காது.
- issue: முகாமுக்குள் நுழைவதன் இலக்கண வலிமை
  choice: கழுவிய பின் நுழைய அனுமதி
  alternative: முகாமுக்குள் வரவேண்டும் என்ற கட்டளை
  rationale: יָבֹא என்ற வடிவம் இச்சட்ட நடைமுறையில் அடுத்ததாக அனுமதிக்கப்படும் செயலைக் குறிக்கலாம்; அந்தச் சாத்தியத்தை ‘வரலாம்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட மற்றும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘முகாம்’, ‘சடங்குப்படி தீட்டு’ ஆகிய சொற்கள் சாதாரண வாசகருக்குப் புரியும் வகையில் மூலத்தின் கருத்துவேறுபாடுகளைப் பாதுகாக்கின்றன.
