  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: ta
  text: அவன் மூன்றாம் நாளிலும் ஏழாம் நாளிலும் அதனால் தன்னைத் தூய்மைப்படுத்திக்கொள்ள வேண்டும்[a]; அப்போது அவன் தூய்மையாவான். ஆனால் அவன் மூன்றாம் நாளிலும் ஏழாம் நாளிலும் தன்னைத் தூய்மைப்படுத்திக்கொள்ளாவிட்டால்[b], அவன் தூய்மையாக மாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இந்த அதிகாரத்தில் முன்பு ஆயத்தப்படுத்தப்பட்ட தீட்டுநீக்கும் நீரால்.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘தன்னைச் சுத்திகரித்துக்கொள்ளாவிட்டால்.’ இங்குள்ள எபிரெய வினைச்சொல் தீட்டிலிருந்து சடங்குமுறைப்படி தூய்மைப்படுத்தப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: தன்னைத் தூய்மைப்படுத்திக்கொள்ள வேண்டும்
  rationale: חטא என்பதன் ஹித்பயேல் வடிவம் இச்சடங்குச் சூழலில் பாவம் செய்வதைக் குறிக்காமல், தீட்டிலிருந்து சடங்குமுறைப்படி தன்னைத் தூய்மைப்படுத்திக்கொள்வதைக் குறிக்கிறது. தன்னிலைப் பொருளையும் இயல்பான நவீன தமிழையும் இத்தேர்வு காக்கிறது.
- source_word: בּוֹ
  choice: அதனால்
  rationale: இந்தப் பிரதிப்பெயர் அதிகாரத்தில் முன்பு ஆயத்தப்படுத்தப்பட்ட தீட்டுநீக்கும் நீரைக் குறிக்கிறது. 'அதனால்' என்பது கருவிப் பொருளைச் சுருக்கமாகக் காட்டி, மூலத்தின் பிரதிப்பெயர்ச் சுட்டை மிகையாக விளக்காமல் காக்கிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பானதும் மூலத்துக்கு நெருக்கமானதுமான தமிழ் வடிவம்.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளிலும்
  rationale: சடங்கின் இரு கட்டங்களையும் இணைக்கும் எபிரெய அமைப்பையும் வரிசையையும் காக்கிறது.
- source_word: יִטְהָר
  choice: அவன் தூய்மையாவான்
  rationale: טהר இங்கு சடங்குக்குப் பின் அடையும் தூய நிலையைச் சுட்டுகிறது. இதனை விளைவுநிலையாக மொழிபெயர்ப்பது יתחטא என்ற செயற்பாட்டிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: וְאִם לֹא
  choice: ஆனால் ... கொள்ளாவிட்டால்
  rationale: எபிரெய இணைப்புச் சொல் முரண்பாட்டுடன் கூடிய நிபந்தனையை அறிமுகப்படுத்துகிறது; இந்தத் தமிழ் அமைப்பு அதன் எச்சரிக்கைத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: மூலத்தில் உள்ள வெளிப்படையான ஆண்பால் ஒருமைப் பிரதிப்பெயரைப் பாதுகாக்கிறது; சூழலில் இது தீட்டுப்பட்ட நபரைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: எண்ணாகமம் 19-இல் தூய்மைப்படுத்துதல் மொழியின் தன்மை
  choice: ஒழுக்க மன்னிப்பு அல்லது உள்ளார்ந்த பரிசுத்தமாக்குதல் என்று அல்லாமல், சடங்குமுறைத் தீட்டுநீக்கம் மற்றும் தூய நிலை என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: சடங்குச் சிறப்பைத் தெளிவுபடுத்தாமல் பொதுவான ஆன்மிகத் தூய்மையாக்க மொழியைப் பயன்படுத்துதல்.
  rationale: சூழல் பிணத்தைத் தொட்டதால் உண்டான தீட்டையும் அதற்குரிய தீட்டுநீக்கும் நீரையும் பற்றியது. ஆகவே பிற்கால இறையியல் கருத்துகளை உரைக்குள் சேர்க்காமல், எபிரெய வினைச்சொற்கள் குறிக்கும் சடங்குசார் நிலையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. 'தூய்மைப்படுத்திக்கொள்ளுதல்' செயலைவும் 'தூய்மையாதல்/தூய்மையாக இருத்தல்' அதன் விளைவுநிலையையும் வேறுபடுத்துகிறது. இரண்டு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
