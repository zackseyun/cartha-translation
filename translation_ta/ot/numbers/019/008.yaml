base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: ta
  text: அதை எரிக்கிறவன் தன் உடைகளைத் தண்ணீரில் துவைத்து, தன் உடலைத் தண்ணீரில் கழுவ வேண்டும்[a]. மாலைவரை அவன் தீட்டுள்ளவனாக இருப்பான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தண்ணீரால்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் சொற்பட ‘தண்ணீரில்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘தீட்டு’ என்பது சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; அது அவசியம் ஒழுக்கக் குற்றத்தைக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף
  choice: எரிக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினை, எரிக்கும் செயலைச் செய்கிற நபரைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட சிவப்புப் பசுவைக் குறிக்கிறது; நடைமுறைச் சட்டச் சூழலில் தமிழில் ‘அதை’ இயல்பானது.
- source_word: יְכַבֵּס
  choice: துவைத்து ... வேண்டும்
  rationale: சடங்குச் சட்டத்தில் இந்த வினை கட்டளையைக் குறிக்கிறது; ‘வேண்டும்’ அதன் விதிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּגָדָיו
  choice: தன் உடைகளை
  rationale: நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; வாக்கிய எழுவாயையே உடைமையாளராகச் சுட்ட ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: בַּמַּיִם
  choice: தண்ணீரில்
  rationale: ב முன்னிடைச்சொல்லும் குறிப்புச் சுட்டும் சேர்ந்து சொற்பட ‘தண்ணீரில்’ என அமைகின்றன; இரு இடங்களிலும் மூலத்தின் மீளுரைத்தல் காக்கப்பட்டது.
- source_word: וְרָחַץ
  choice: குளிப்பாட்ட வேண்டும்
  rationale: உடைகளைத் துவைப்பதைக் குறிக்கும் כבס என்பதிலிருந்து உடலைக் கழுவுவதைக் குறிக்கும் רחץ வேறுபடுத்தப்படுகிறது; தமிழில் உடலுக்குரிய குளித்தல் பொருள் தெளிவாகிறது.
- source_word: בְּשָׂרוֹ
  choice: தன் உடலை
  rationale: בשר என்பதன் அடிப்படைப் பொருள் ‘சதை’ என்றாலும், இக்கழுவுதல் சூழலில் முழு உடலையே குறிக்கிறது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: ஆசாரச் சட்டச் சூழலில் טמא சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ‘தீட்டு’ என்பது தமிழில் இப்பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நிலை நீடிக்கும் கால எல்லையை நெருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; ‘சூரியன் மறையும்வரை’ என்பது தேவையற்ற விளக்கவுரை ஆகும்.
theological_decisions:
- issue: சடங்குசார் அசுத்தத்தைக் குறிக்கும் சொல்லாக்கம்
  choice: தீட்டுள்ளவனாக
  alternative: சடங்கின்படி அசுத்தமானவனாக
  rationale: மூலத்தின் சுருக்கத்தைக் காத்தபடி ஆசாரத் தீட்டு நிலையைக் குறிக்கிறது. இது ஒழுக்கக் குற்றத்தை அவசியம் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: விளைவான நிலையை வெளிப்படுத்துதல்
  choice: இருப்பான்
  alternative: ஆவான்
  rationale: மூலம் நிலைமையைச் சொல்கிறது; ‘ஆவான்’ நிலைமாற்றத்தை அதிகமாக வலியுறுத்தக்கூடும். ஆகவே நிலையைத் திறந்தவாறே வைத்திருக்க ‘இருப்பான்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. உடைகளைத் ‘துவைத்தல்’ மற்றும் உடலைக் ‘குளிப்பாட்டுதல்’ என்ற மூலச் சொல் வேறுபாடு காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தத்தம் கூற்றுக்கு உடனே இணைக்கப்பட்டுள்ளன.
