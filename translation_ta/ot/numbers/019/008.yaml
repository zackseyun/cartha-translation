  - severity: medium
    issue: Causative verb used for washing one’s own body
    rationale: “குளிப்பாட்டுதல்” is ordinarily transitive/causative (‘to bathe [another]’). Hebrew וְרָחַץ בְּשָׂרוֹ requires that the person wash his own body. “தன் உடலைத் தண்ணீரில் கழுவ வேண்டும்” is accurate and natural.
