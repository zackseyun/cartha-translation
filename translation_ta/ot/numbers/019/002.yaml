id: NUM.19.2
reference: Numbers 19:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: ta
  text: '“யெகோவா கட்டளையிட்ட திருச்சட்டத்தின் நியமம் இதுவே: இஸ்ரவேல் மக்களிடம் சொல்லுங்கள்: அவர்கள் உங்களிடம் முழுமையானதும், உடற்குறை எதுவும் இல்லாததும், இதுவரை நுகம் சுமக்காததுமான ஒரு செந்நிறப் பசுவைக் கொண்டுவர வேண்டும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: திருச்சட்டத்தின் நியமம்
  rationale: חֻקָּה என்பதன் நிலையான கட்டளை அல்லது நியமம் என்ற பொருளையும், תּוֹרָה என்பதன் சட்டம்/போதனை என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: פָרָה אֲדֻמָּה
  choice: செந்நிறப் பசு
  rationale: פָרָה பெண்பால் மாட்டைக் குறிக்கிறது; אֲדֻמָּה அதன் செந்நிறத்தைத் தெளிவாகக் குறிக்கிறது. வயதை மூலவசனம் குறிப்பிடாததால் ‘இளம்பசு’ என்று சேர்க்கப்படவில்லை.
- source_word: תְמִימָה
  choice: முழுநிறைவானதும்
  rationale: அடுத்துவரும் ‘உடற்குறை எதுவும் இல்லாததும்’ என்பதோடு பொருளை ஒன்றாக்காமல், תמים என்பதன் முழுமை/குற்றமின்மை சார்ந்த தனித்த நுண்ணர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: מוּם
  choice: உடற்குறை
  rationale: பலியிடப்படும் விலங்கின் உடல் குறை அல்லது பழுதைக் குறிக்கும் இச்சூழலில் தெளிவான இயல்புத் தமிழ்.
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: இதுவரை நுகம் சுமக்காத
  rationale: எபிரெய மொழியின் சொற்படிமம் ‘அதன்மேல் நுகம் ஏறவில்லை’; தமிழில் அதே நடைமுறைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர் / கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் வெளிப்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பைச் சுற்றியுள்ள வரலாற்று நிச்சயமின்மையை வைத்து வசனத்தின் கருத்தை விரிவாக்கவில்லை.
- issue: תְמִימָה மற்றும் אֵין בָּהּ מוּם ஆகிய இரு தகுதிகளின் உறவு
  choice: ‘முழுநிறைவானதும், உடற்குறை எதுவும் இல்லாததும்’ என்று இரண்டையும் தனித்தனியாக வைத்தல்
  alternative: ‘குறைபாடற்ற’ என்று ஒன்றிணைத்தல்
  rationale: மூலவசனத்தின் வலியுறுத்தலையும் சாத்தியமான நுண்ணர்த்த வேறுபாட்டையும் அழிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, பொதுவாசகருக்கு எளிதில் புரியும் நடை. எபிரெய கட்டளை அமைப்பு தமிழில் இயல்பாக அமைய ‘நீங்கள் சொல்ல வேண்டியது’ மற்றும் ‘கொண்டுவர வேண்டும்’ என வடிவமைக்கப்பட்டது; மோசேயை நோக்கிய ஒருமைச் சுட்டு தமிழில் மரியாதைப் பன்மையாக வெளிப்படுகிறது.
