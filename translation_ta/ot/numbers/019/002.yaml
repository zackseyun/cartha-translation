- from: '“யெகோவா கட்டளையிட்ட திருச்சட்டத்தின் நியமம் இதுவே: இஸ்ரவேல் மக்களிடம் நீங்கள் சொல்ல வேண்டியது: முழுநிறைவானதும், உடற்குறை எதுவும் இல்லாததும், இதுவரை நுகம் சுமக்காததுமான ஒரு செந்நிறப் பசுவை அவர்கள் உங்களிடம் கொண்டுவர வேண்டும்.”'
