  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: ta
  text: திறந்த வயல்வெளியில் வாளால் கொல்லப்பட்ட ஒருவரையோ, இறந்த உடலையோ, மனித எலும்பையோ, கல்லறையையோ தொடுகிற எவரும் ஏழு நாட்களுக்குத் தீட்டுப்படுவார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘வயலின் முகப்பின்மேல்’; அதாவது திறந்த வயல்வெளியில்.
    reason: lexical_alternative
  - marker: b
    text: ‘இறந்த உடல்’ என்பதை ‘சடலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: தொடுகிற எவரும்
  rationale: כֹל உடன் வரும் தொடர்புத் தொடர் பொதுவான நிபந்தனையையும் அனைவருக்கும் பொருந்தும் சட்ட விதியையும் குறிக்கிறது; ‘எவரும்’ என்பது இதை இயல்பான தமிழில் தருகிறது.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: திறந்தவெளியில்
  rationale: சொல்லுக்குச் சொல் ‘வயலின் முகப்பின்மேல்’; இங்கு கட்டடத்திற்கு வெளியேயுள்ள திறந்த நிலப்பரப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: בַּחֲלַל חֶרֶב
  choice: வாளால் கொல்லப்பட்ட ஒருவர்
  rationale: חָלָל என்பது கொல்லப்பட்ட அல்லது குத்துண்டு இறந்த ஒருவரையும், חֶרֶב அதற்கான ஆயுதத்தையும் குறிக்கிறது; தமிழ் சொற்றொடர் இறந்த நபரையே சுட்டுகிறது.
- source_word: אוֹ בְמֵת
  choice: இறந்த உடல்
  rationale: מֵת இங்கு இறந்த நபரையோ சடலத்தையோ குறிக்கலாம்; ‘இறந்த உடல்’ தெளிவான, பொதுவாகப் புரியும் சொல்லாக்கம்.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: மனித எலும்பு
  rationale: אָדָם இங்கு ஆணை மட்டும் அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்கிறது; ‘மனித எலும்பு’ அந்தப் பொதுப்பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אוֹ בְקָבֶר
  choice: கல்லறை
  rationale: קֶבֶר என்பது புதைகுழி அல்லது அடக்க இடத்தைக் குறிக்கிறது; இச்சூழலில் ‘கல்லறை’ நேரடியான இயல்பான இணைச்சொல்.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள் தீட்டுப்பட்டிருப்பார்
  rationale: טמא ஆசாரத் தூய்மையின்மையைக் குறிக்கிறது. ‘தீட்டுப்பட்டிருப்பார்’ சட்ட விளைவையும் ஏழு நாள் நீடிப்பையும் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுவான மனிதப் பொருள்
  choice: மனித
  alternative: ஆணின்
  rationale: தூய்மைச் சட்டத்தின் இச்சூழலில் எலும்பு ஆணுடையதாக மட்டும் வரையறுக்கப்படவில்லை; ஆகவே பாலினம் குறிப்பிடாத மூலப்பொருளை ‘மனித’ என்பதே காக்கிறது.
- issue: טמא என்பதன் ஆசாரத் தூய்மையின்மை
  choice: தீட்டுப்பட்டிருப்பார்
  alternative: அசுத்தமாயிருப்பார்
  rationale: இங்கு உடல் அழுக்கு அல்லது ஒழுக்கக்கேடு அல்ல, ஆசார ரீதியான தூய்மையின்மை குறிக்கப்படுகிறது; தமிழ் வேதாகமச் சட்ட நடையில் ‘தீட்டு’ இதைத் தெளிவாக வேறுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சட்டத் தொனியும் பட்டியல் அமைப்பும் காக்கப்பட்டுள்ளன. ‘தீட்டு’ என்பது ஆசாரத் தூய்மையின்மையைக் குறிக்கும் சூழல்சார் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறிகள் பிரதான உரையில் இடம்பெற்றுள்ளன.
