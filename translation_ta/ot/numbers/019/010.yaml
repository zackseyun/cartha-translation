base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: ta
  text: இளம்பெண் பசுவின் சாம்பலைச் சேகரிப்பவன் தன் உடைகளைக் கழுவ வேண்டும்; அவன் மாலைவரை சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக இருப்பான். இது இஸ்ரவேல் மக்களுக்கும்[a], அவர்களிடையே குடியிருக்கும் அந்நியருக்கும், நிரந்தரமான நியமமாக இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “இஸ்ரவேலின் மகன்களுக்கும்”; இது இங்கு இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் உடன்படிக்கைச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்றென்றைக்கும் உரிய நியமமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: சேகரிப்பவன்
  rationale: உறுப்புடன் வரும் Qal நிகழ்காலப் பெயரெச்சம் ஒரு நபரைக் குறிக்கும் பெயர்ச்சொல்லாகச் செயல்படுகிறது; ‘சேகரிப்பவன்’ அதன் செயற்பாட்டு வடிவத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֵפֶר הַפָּרָה
  choice: கிடாரியின் சாம்பல்
  rationale: אֵפֶר கூட்டுப் பொருளில் சாம்பலைக் குறிக்கிறது; פָּרָה பெண் மாட்டைக் குறிப்பதால், சடங்கின் சூழலில் துல்லியமான ‘கிடாரி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: தன் உடைகளைக் கழுவ வேண்டும்
  rationale: ஆசாரத் தூய்மைச் சட்டங்களில் இந்த வினை உடைகளை நீரால் கழுவுவதைக் குறிக்கிறது; சட்டக் கட்டளையை நவீன தமிழில் தெளிவாக வெளிப்படுத்த ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְטָמֵא
  choice: சடங்குப்படி தீட்டுள்ளவனாக இருப்பான்
  rationale: טָמֵא இங்கு ஒழுக்கக் குற்றத்தை அல்ல, ஆசார அல்லது சடங்கு சார்ந்த தீட்டு நிலையைக் குறிக்கிறது; ‘சடங்குப்படி’ என்பது அந்த வரம்பைத் தெளிவுபடுத்துகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: எபிரெயச் சொற்றொடரின் கால எல்லையை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: וְהָיְתָה
  choice: இது ... இருக்க வேண்டும்
  rationale: பெண்பால் ஒருமை வினை, முன்னுள்ள சட்ட ஏற்பாட்டைச் சுட்டுகிறது; தமிழில் அதன் சுட்டுப்பொருளைத் தெளிவாக்க ‘இது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் நிலையான கூட்டுச் சொற்றொடர்; நவீன தமிழில் பாலினத் தவறான வரம்பை ஏற்படுத்தாமல் அதன் கூட்டுப் பொருளை ‘மக்கள்’ தருகிறது.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: அவர்கள் நடுவில் குடியிருக்கும் அந்நியக் குடியிருப்பாளர்
  rationale: גֵּר பூர்வீக இஸ்ரவேலர் அல்லாதபோதும் சமூகத்தினுள் தங்கியிருக்கும் குடியிருப்பாளரைக் குறிக்கிறது; பெயர்ச்சொல்–வினைச்சொல் தொடர்பை ‘குடியிருக்கும் ... குடியிருப்பாளர்’ பிரதிபலிக்கிறது.
- source_word: לְחֻקַּת עוֹלָם
  choice: நிரந்தரமான நியமமாக
  rationale: חֻקָּה நிறுவப்பட்ட சட்ட நியமத்தையும் עוֹלָם தொடர்ந்து நிலைக்கும் காலத்தையும் குறிக்கின்றன; ‘நிரந்தரமான நியமம்’ இயல்பான, கண்ணியமான சட்ட நடையை வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப் பயன்பாடு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ‘மகன்கள்’ என்றாலும், இச்சட்டம் உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது. ‘மக்கள்’ என்பது அந்த உண்மையான கூட்டுப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: טָמֵא என்ற சடங்கு தீட்டு மொழி
  choice: சடங்குப்படி தீட்டுள்ளவன்
  alternative: அசுத்தமானவன்
  rationale: இது ஒழுக்கரீதியான மாசையோ தனிநபர் பாவத்தையோ குறிக்காமல், ஆசாரச் சட்டத்தின் கீழான தற்காலிக நிலையைச் சுட்டுகிறது. ‘சடங்குப்படி’ எனச் சேர்ப்பது அந்த வேறுபாட்டை வெளிப்படையாகக் காக்கிறது.
- issue: עולם என்பதன் காலநீட்சி
  choice: நிரந்தரமான
  alternative: என்றென்றைக்கும் உரிய
  rationale: சட்டச் சூத்திரத்தில் עולם நீடித்த அல்லது தொடர்ச்சியான செல்லுபடித்தன்மையைக் குறிக்கிறது; அதன் தத்துவார்த்த கால எல்லையை மிகையாகத் தீர்மானிக்காமல் ‘நிரந்தரமான’ என்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆசாரச் சட்டத்திற்கேற்ற கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பதன் சடங்கு சார்ந்த பொருள் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது. எபிரெயத்தின் கூட்டுச் சொற்றொடரும் காலநீட்சியின் மாற்று வாசிப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
