review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the gathering of the heifer's ashes, the washing of garments, temporary ritual impurity until evening, and the statute's applicability to Israel and the resident outsider. A few expressions can more accurately and naturally convey the Hebrew legal formulation without implying moral impurity.
  naturalness: “சடங்குப்படி தீட்டுள்ளவனாக” is not idiomatic modern Tamil. “சடங்கு ரீதியாகத் தீட்டுப்பட்டவனாக” is clearer. “அந்நியக் குடியிருப்பாளர்” is understandable but cumbersome; “அவர்களிடையே குடியிருக்கும் அந்நியர்” is natural and retains the resident sense.
  terminology: “சாம்பல்,” “உடைகள்,” “மாலைவரை,” and “நியமம்” are suitable. “கிடாரி” is less broadly transparent in modern standard Tamil; “இளம்பெண் பசு” is a clear rendering of the female bovine term in this ritual context. “சடங்கு ரீதியாகத் தீட்டுப்பட்ட” appropriately marks טָמֵא as ritual status.
  issues:
  - severity: medium
    issue: Idiomatic rendering of ritual impurity
    rationale: “சடங்குப்படி தீட்டுள்ளவனாக” is awkward Tamil. The revision retains the non-moral, ritual sense of טָמֵא in idiomatic language.
  - severity: low
    issue: Rendering of פָּרָה
    rationale: “கிடாரி” may be unfamiliar or regionally marked for modern readers. “இளம்பெண் பசு” clearly identifies the female bovine while preserving the source distinction.
  - severity: low
    issue: Resident outsider expression
    rationale: “அந்நியக் குடியிருப்பாளர்” is overly bureaucratic. “அவர்களிடையே குடியிருக்கும் அந்நியர்” is natural Tamil and preserves the participial resident sense.
