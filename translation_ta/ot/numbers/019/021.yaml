base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: ta
  text: 'இது அவர்களுக்கு நிலையான நியமமாக இருக்கும்: தீட்டு நீரை[a]த் தெளிப்பவன் தன் உடைகளைத் துவைக்க வேண்டும்; தீட்டு நீரைத் தொடுகிறவன் மாலைவரை தீட்டுப்பட்டிருப்பான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீட்டிலிருந்து தூய்மைப்படுத்தும் நீர்”; மரபுவழியாக, “விலக்கின் நீர்.” எபிரெயில், “தீட்டின் நீர்கள்.”
    reason: מֵי הַנִּדָּה என்பதன் சொல்லமைப்பு சுருக்கமானதும் பலவாறு புரிந்துகொள்ளக்கூடியதும் ஆகும்; சூழலில் இது பிணத்தால் ஏற்படும் தீட்டிலிருந்து தூய்மைப்படுத்தப் பயன்படுத்தப்படும் நீரைக் குறிக்கிறது.
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: இது அவர்களுக்கு என்றென்றும் நிலையான நியமமாக இருக்கும்
  rationale: தொடர்ந்து பொருந்தும் சட்ட விதியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; עוֹלָם என்பதன் நீடித்த காலப்பொருளையும் காக்கிறது.
- source_word: וּמַזֵּה
  choice: தெளிப்பவன்
  rationale: சடங்குச் செயலைச் செய்கிற நபரைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள எபிரெயப் பங்கேற்புவினையை நேரடியாகக் காட்டுகிறது.
- source_word: מֵי הַנִּדָּה
  choice: தீட்டு நீர்
  rationale: சடங்குசார் தீட்டுடன் தொடர்புடைய நீர் என்ற எபிரெயக் கட்டமைப்பின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது; அது ஒழுக்கக் குற்றத்தைக் குறிக்கிறது என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைத் துவைக்க வேண்டும்
  rationale: கட்டாய விதியைத் தெளிவாகவும், בְּגָדָיו என்பதைக் தற்போதைய இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: וְהַנֹּגֵעַ
  choice: தொடுகிறவன்
  rationale: முந்தைய பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினைக்கு இணையான அமைப்பைப் பேணுகிறது.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: மாலைவரை தீட்டுப்பட்டிருப்பான்
  rationale: சடங்குசார் தூய்மை-தீட்டு சொற்பயன்பாட்டைப் பேணி, நிலை நீடிக்கும் கால எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: எண்ணாகமம் 19-இல் சடங்குசார் தீட்டைக் குறிக்கும் சொற்கள்
  choice: “தீட்டு”, “தீட்டுப்பட்டிருப்பான்” என்று சடங்குசார் பொருளில் வழங்குதல்
  alternative: “அசுத்தம்”, “சுத்திகரிப்பு நீர்” என்று வழங்குதல்
  rationale: இவ்வசனம் ஒழுக்கக் குற்றத்தை அல்ல, சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது. “தீட்டு நீர்” என்பது மூலத்தின் தொடர்பை மிகையாக விளக்காமல் காக்கிறது; விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்ட/சடங்கு நடையைப் பயன்படுத்துகிறது. “என்றென்றும் நிலையான நியமம்” நீடித்த உடன்படிக்கைச் சட்டத்தின் வலிமையைத் தக்கவைக்கிறது; “தீட்டு” என்பது இங்கு ஒழுக்க மதிப்பீடல்ல, சடங்குசார் நிலை என்பதைச் சொல் தேர்வுகள் காக்கின்றன.
