  naturalness: The legal/ritual register is generally clear and modern. Removing the redundant paired duration terms makes the opening more idiomatic and precise. ‘தீட்டு நீர்’ remains a concise ritual-context rendering, supported by the footnote.
  terminology: ‘தீட்டு’ and ‘தீட்டுப்பட்டிருப்பான்’ appropriately preserve a ritual, rather than moral, category. The footnote retains the lexical alternatives and identifies the Hebrew plural expression.
