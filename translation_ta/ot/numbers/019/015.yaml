source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: ta
  text: மேலும், திறந்திருக்கிற ஒவ்வொரு பாத்திரத்தின்மேலும் கட்டிப் பொருத்தப்பட்ட மூடி இல்லாவிட்டால், அது தீட்டானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறுக்கமாகப் பொருத்தப்பட்ட மூடி’ அல்லது ‘முத்திரையிடப்பட்ட மூடி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் பாத்திரத்தின்மேல் உறுதியாகக் கட்டப்பட்ட ஒரு மூடுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: மேலும், ... ஒவ்வொரு
  rationale: וְ முந்தைய விதியுடன் இவ்விதியை இணைக்கிறது; ஒருமை பெயர்ச்சொல்லுடன் வரும் כֹל பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: כְּלִי
  choice: பாத்திரம்
  rationale: இச்சொல் கருவி அல்லது கொள்கலன் என்ற பரந்த பொருளைக் கொண்டது; இத்தூய்மைச் சட்டச் சூழலில் திறந்து வைக்கக்கூடிய கொள்கலனை ‘பாத்திரம்’ என்பது இயல்பாகக் குறிக்கிறது.
- source_word: פָתוּחַ
  choice: திறந்திருக்கும்
  rationale: ‘திறந்த’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; அடுத்த சொற்றொடர் மூடி கட்டிப் பொருத்தப்படாத நிலையை விளக்குகிறது.
- source_word: אֲשֶׁר אֵין
  choice: இல்லாமல்
  rationale: தகுதிப்படுத்தும் உறவுநிலைத் தொடரின் ‘அதன்மேல் இல்லை’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צָמִיד פָּתִיל
  choice: கட்டிப் பொருத்தப்பட்ட மூடி
  rationale: இந்த இணைச்சொல் பாத்திரத்தின்மேல் கட்டுதல் அல்லது பிணைத்தல் மூலம் உறுதியாக வைக்கப்பட்ட ஒரு மூடுதலைக் குறிக்கிறது. ‘கட்டிப் பொருத்தப்பட்ட மூடி’ பழங்கால முறையை அளவுக்கு மீறி குறிப்பாக்காமல் அதன் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עָלָיו
  choice: பாத்திரத்தின்மேல் (தமிழ் தொடரில் உட்பொருளாக)
  rationale: ‘மூடி’ மற்றும் ‘பாத்திரம்’ ஆகியவற்றின் இயல்பான தொடர்பில் ‘அதன்மேல்’ என்ற நிலை தமிழில் உட்பொருளாகத் தெளிவாக உள்ளது; தனியே சேர்த்தால் நடை கனமாகும்.
- source_word: טָמֵא הוּא
  choice: தீட்டானது
  rationale: தூய்மையின்மை நிலையைக் குறிக்கும் எபிரெயச் சொல்லை விளக்கச் சொற்கள் சேர்க்காமல் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: தீட்டின் தன்மை
  choice: טָמֵא என்பதை முதன்மை உரையில் ‘தீட்டானது’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: சடங்குமுறையில் தீட்டானது
  rationale: சூழல் சடங்குசார் தூய்மையைப் பற்றியதாக இருந்தாலும், எபிரெய உரை ‘தீட்டானது’ என்று மட்டுமே கூறுகிறது. ஆகவே விளக்கமான ‘சடங்குமுறையில்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டிப் பொருத்தப்பட்ட’ என்பது மூடி வெறுமனே மேலே வைக்கப்பட்டதல்ல, உறுதியாக இணைக்கப்பட்டிருந்ததை உணர்த்துகிறது; ‘தீட்டானது’ என்பது விளக்கத்தைச் சேர்க்காமல் மூலத்தின் தூய்மைச் சொற்பயன்பாட்டைப் பாதுகாக்கிறது.
