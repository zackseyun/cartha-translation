revisions:
- from: மேலும், கட்டிப் பொருத்தப்பட்ட மூடி இல்லாமல் திறந்திருக்கும் ஒவ்வொரு பாத்திரமும் தீட்டானது.[a]
  to: மேலும், திறந்திருக்கிற ஒவ்வொரு பாத்திரத்தின்மேலும் கட்டிப் பொருத்தப்பட்ட மூடி இல்லாவிட்டால், அது தீட்டானது.[a]
  rationale: The revision explicitly renders the covering’s position “on the vessel” and gives the rule a natural Tamil conditional form. It retains the draft’s careful rendering of the uncertain expression for a secured cover and preserves “தீட்டானது” without adding theological explanation.
