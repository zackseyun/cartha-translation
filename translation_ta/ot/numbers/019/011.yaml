source:
  edition: WLC
  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: ta
  text: எந்த மனிதரின் சடலத்தைத் தொடுகிறவரும் ஏழு நாட்கள் தீட்டுப்பட்டிருப்பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: தொடுகிறவர்
  rationale: உறுப்புச் சொல்லுடன் வரும் எபிரெயப் பங்கேற்புவினை பொதுவாக இந்நிலையில் உள்ள எவரையும் குறிக்கிறது; தமிழில் ‘தொடுகிறவர்’ என்பது இயல்பாகவும் சட்டப்பொதுமையைத் தக்கவைத்தும் உள்ளது.
- source_word: בְּמֵת
  choice: இறந்த உடல்
  rationale: מֵת என்பது சொற்படியாக இறந்தவர் அல்லது இறந்ததைச் சுட்டுகிறது; இச்சடங்குசார் சூழலில் தொடக்கூடிய மனிதச் சடலத்தை ‘இறந்த உடல்’ தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: மனிதரில் யாருடைய … ஆவது
  rationale: נֶפֶשׁ אָדָם இங்கு ஆண் ஒருவரை மட்டும் அல்ல, எந்த மனிதரையும் குறிக்கிறது. ‘மனிதரில் யாருடைய … ஆவது’ என்பது כָּל என்பதன் முழுமையான பொதுவியல்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְטָמֵא
  choice: தீட்டுப்பட்டிருப்பார்
  rationale: விளைவாக ஏற்படும் சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ‘தீட்டு’ இச்சூழலில் நெறிசார் குற்றத்தைவிட சடங்குசார் நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் சட்டப்பொதுமையான பொருள்
  choice: மனிதரில் யாருடைய
  alternative: எந்த ஆணுடைய
  rationale: இங்கு אָדָם பாலின அடிப்படையில் ஆணை மட்டும் குறிக்காமல் எந்த மனிதரையும் குறிக்கிறது; ஆகவே சட்டத்தின் பரப்பைத் துல்லியமாகக் காட்டும் பொதுமையான மனிதக் குறிப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: טָמֵא என்பதன் சடங்குசார் பொருள்
  choice: தீட்டுப்பட்டிருப்பார்
  alternative: அசுத்தமாயிருப்பார்
  rationale: எண்ணாகமம் 19-ன் சுத்திகரிப்புச் சூழலில் இது ஒழுக்கக் கேட்டைக் குறிக்காமல் சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது; ‘தீட்டு’ அந்த வேறுபாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள ‘இறந்தவர்/இறந்த உடல்’ என்ற கருத்து சூழலுக்கேற்ற வகையில் தெளிவாக்கப்பட்டுள்ளது; ஆண் பாலினச் சுட்டு தேவையின்றி சேர்க்கப்படவில்லை.
