revisions:
- from: மனிதரில் யாருடைய இறந்த உடலையாவது தொடுகிறவர் ஏழு நாட்கள் தீட்டுப்பட்டிருப்பார்.
  to: எந்த மனிதரின் சடலத்தைத் தொடுகிறவரும் ஏழு நாட்கள் தீட்டுப்பட்டிருப்பார்.
  rationale: The revision preserves the Hebrew’s generic legal force (‘whoever’), its specification that the dead person is human, and the stipulated duration. It replaces only the awkward possessive construction with idiomatic Tamil. No footnote is required because the translation does not make a disputed or materially expanded claim.
