review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the generic legal subject, contact with a human corpse, and the seven-day state of ritual impurity. However, the phrase used for ‘of any human person’ is grammatically and idiomatically weak in Tamil.
  naturalness: ‘மனிதரில் யாருடைய இறந்த உடலையாவது’ is awkward and can momentarily sound like it asks whose body it is. ‘எந்த மனிதரின் சடலத்தைத்’ is clear, natural modern standard Tamil, and retains the unrestricted scope.
  terminology: ‘தீட்டுப்பட்டிருப்பார்’ appropriately represents ritual impurity in this purification context without suggesting moral wrongdoing. ‘சடலம்’ is a natural and suitably respectful rendering of the concrete referent מֵת here.
  issues:
  - severity: medium
    issue: Awkward and imprecise Tamil construction for לְכָל נֶפֶשׁ אָדָם
    rationale: ‘மனிதரில் யாருடைய இறந்த உடலையாவது’ is not idiomatic modern Tamil and introduces an unnecessary possessive/interrogative-like formulation. ‘எந்த மனிதரின் சடலத்தைத்’ directly and naturally expresses contact with the corpse of any human person.
  revised_text: எந்த மனிதரின் சடலத்தைத் தொடுகிறவரும் ஏழு நாட்கள் தீட்டுப்பட்டிருப்பார்.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew’s generic legal force (‘whoever’), its specification that the dead person is human, and the stipulated duration. It replaces only the awkward possessive construction with idiomatic Tamil. No footnote is required because the translation does not make a disputed or materially expanded claim.
