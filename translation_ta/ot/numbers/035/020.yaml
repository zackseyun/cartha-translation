  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: ta
  text: ஆனால், ஒருவன் பகையினால் மற்றவனைத் தள்ளியோ, அல்லது வேண்டுமென்றே[a] அவன்மேல் எதையாவது எறிந்தோ, அவன் இறந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பகைநோக்குடன்’ அல்லது ‘பதுங்கியிருந்து’. இதற்கான எபிரேயச் சொல் திட்டமிட்ட பகைநோக்கைக் குறிக்கிறது; பதுங்கித் தாக்குதலையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ...-ஆலோ
  rationale: முந்தைய நிகழ்வுக்கு மாறான நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஆனால்’ மற்றும் நிபந்தனை விகுதி இயல்பாக இதை வெளிப்படுத்துகின்றன.
- source_word: בְּשִׂנְאָה
  choice: பகையினால்
  rationale: செயலின் உந்துதலாகிய வெறுப்பு அல்லது பகைமையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יֶהְדָּפֶנּוּ
  choice: மற்றவனைத் தள்ளினாலோ
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான தள்ளுதல் அல்லது உந்தித் தள்ளுதலைத் தக்கவைக்கிறது; அடித்தல் என்று மிகைப்படுத்தவில்லை.
- source_word: אוֹ
  choice: அல்லது
  rationale: மாற்றுச் செயலை அறிமுகப்படுத்தும் எளிய பிரிநிலைக் கூட்டுச்சொல்.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: அவன்மேல் எதையாவது எறிந்ததனால்
  rationale: எபிரேயத்தில் விடுபட்டுள்ள செயப்படுபொருளைத் தமிழின் இயல்புக்காக ‘எதையாவது’ என வெளிப்படையாகச் சேர்க்கிறது; עָלָיו என்பதின் திசைநிலையை ‘அவன்மேல்’ காக்கிறது.
- source_word: בִּצְדִיָּה
  choice: வேண்டுமென்றே[a]
  rationale: திட்டமிட்ட பகைநோக்குச் செயலின் மையமான சட்டப் பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; பதுங்கியிருந்து தாக்குதல் என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனாலோ
  rationale: செயலின் விளைவாக மரணம் நிகழ்ந்ததை நிபந்தனைச் சட்ட வாக்கியத்தின் தமிழ்நடைக்கு ஏற்ப கூறுகிறது; அடுத்த வசனத்தில் தொடரும் தீர்ப்போடு வாக்கியம் இணைந்திருப்பதையும் காக்கிறது.
