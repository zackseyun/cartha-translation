source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ta
  text: அல்லது, ஒருவரைக் கொல்லக்கூடிய கையில் பிடிக்கத்தக்க மரப்பொருளால் ஒருவனை அடித்து, அடிபட்டவர் இறந்தால், அவன் கொலைகாரன்; அந்தக் கொலைகாரன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: கையில் பிடித்த மரப்பொருளால்
  rationale: כְּלִי என்பது பொருள், கருவி, ஆயுதம் போன்ற பரந்த பொருளுடைய சொல். இச்சட்டச் சூழலில் ‘மரப்பொருள்’ அதன் பரப்பைத் தக்கவைக்கிறது; יָד அந்தப் பொருள் கையில் பிடித்துப் பயன்படுத்தத்தக்கது என்பதைக் காட்டுகிறது.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: ஒருவரைக் கொல்லக்கூடிய
  rationale: இத்தொடர் இந்தச் சம்பவத்தின் விளைவை மட்டும் அல்லாமல், அந்தப் பொருளின் உயிர்க்கொல்லும் திறனை விவரிக்கிறது.
- source_word: הִכָּהוּ
  choice: அவன் அவரை அடித்து
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடி/தாக்கு’ என்பதை இயல்பான தமிழில் தருகிறது; அடுத்த தொடருக்கு முன்பே மரண விளைவைச் சேர்த்துவிடவில்லை.
- source_word: וַיָּמֹת
  choice: அவர் இறந்துபோனால்
  rationale: எபிரெய தொடரில் கூறப்படும் விளைவைத் தமிழ்ச் சட்டநடை நிபந்தனை அமைப்பில் இயல்பாக இணைக்கிறது.
- source_word: רֹצֵחַ
  choice: கொலைகாரன்
  rationale: தற்செயலான கொலையிலிருந்து குற்றத்துக்குரிய கொலையை வேறுபடுத்தும் உடனடிச் சட்டச் சூழலில், ‘கொலைகாரன்’ என்பது நீதித்தீர்ப்பின் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מוֹת יוּמַת
  choice: கண்டிப்பாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயருடன் வரும் வினை வடிவத்தின் வலியுறுத்தலையும், தண்டனையின் கட்டாயத்தையும் வாசிக்க எளிய நவீன தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: கொலைச் சட்டத்தில் רֹצֵחַ என்பதன் சட்ட-அற வகைப்பாடு
  choice: ‘கொலைகாரன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கொன்றவன்’ அல்லது ‘ஆளைக் கொன்றவன்’
  rationale: சுற்றியுள்ள வசனங்கள் குற்றத்துக்குரிய கொலையையும் தற்செயலான கொலையையும் வேறுபடுத்துகின்றன. ஆகவே பொதுவான ‘கொன்றவன்’ என்பதைவிட ‘கொலைகாரன்’ இவ்வசனத்தின் சட்ட-அறத் தீர்ப்பை நன்றாக வெளிப்படுத்துகிறது; கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை. குற்றஞ்சாட்டப்பட்ட நபருக்கு ‘அவன்’ என்றும், தாக்கப்பட்ட நபருக்கு மரியாதை ஒருமையான ‘அவர்’ என்றும் பயன்படுத்தி தமிழில் குறிப்புத் தெளிவு பேணப்பட்டுள்ளது.
