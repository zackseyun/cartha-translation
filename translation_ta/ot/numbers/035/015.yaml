base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களுக்கும்[a], அவர்களிடையே வாழும் அந்நியக் குடியேறிக்கும், குடியிருப்பாளருக்கும்[b], ஒருவரைத் தவறுதலாகக் கொன்ற எவரும் அங்கே தப்பிச் செல்லும்படியாக இந்த ஆறு நகரங்கள் அடைக்கலமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, ‘இஸ்ரவேலின் மகன்கள்’; ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்நியக் குடியேறி’, ‘குடியிருப்பாளர்’ என்பவை இஸ்ரவேல் சமூகத்தில் வாழ்ந்த தாயகத்தவர் அல்லாதவர்களைக் குறிக்கும் இரு வேறு எபிரெயச் சொற்களை (גֵּר, תּוֹשָׁב) மொழிபெயர்க்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் வழக்கமான இன-உடன்படிக்கைப் பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גֵּר
  choice: அந்நியக் குடியேறி
  rationale: தாயகத்தவர் அல்லாமல் இஸ்ரவேல் சமூகத்தின் நடுவில் வந்து குடியேறியவரைக் குறிக்கிறது. ‘அந்நியக் குடியேறி’ என்பது அந்நியத் தன்மையையும் அங்கே வசிப்பதையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: תּוֹשָׁב
  choice: குடியிருப்பாளர்
  rationale: முழு தாயகக் குடிமகன் நிலை இல்லாவிட்டாலும் அங்கே வசிப்பவரைக் குறிக்கிறது. גֵּר என்பதிலிருந்து வேறுபட்ட எபிரெயச் சொல்லாக இருப்பதைத் தமிழிலும் தனிச் சொல்லால் காட்டுகிறது.
- source_word: בְּתוֹכָם
  choice: அவர்களிடையே வாழும்
  rationale: இஸ்ரவேல் சமூகத்தின் நடுவில் வசிப்பதை நவீனத் தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: இந்த ஆறு நகரங்களும் அடைக்கலமாக இருக்கும்
  rationale: சட்ட ஏற்பாட்டின் தன்மையைத் தக்கவைத்தபடி, நகரங்கள் பாதுகாப்பிடம் ஆகும் என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לָנוּס שָׁמָּה
  choice: அங்கே தப்பியோடலாம்
  rationale: அந்த நகரங்கள் நியமிக்கப்பட்டதன் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ஒருவரைக் கொன்ற எவரும்
  rationale: சொற்பட ‘ஒரு நபரை அடிப்பவர்’ என்ற அமைப்பு இருந்தாலும், இந்தச் சட்டச் சூழலில் அது மனித மரணத்தை ஏற்படுத்தியவரைக் குறிக்கிறது. ‘எவரும்’ என்பது כָּל என்பதன் பொதுப்படையான பரப்பைத் தக்கவைக்கிறது.
- source_word: בִּשְׁגָגָה
  choice: தவறுதலாக
  rationale: வேண்டுமென்ற நோக்கமின்றி, அறியாமலோ தவறினாலோ நிகழ்ந்த செயலைக் குறிக்கும் சட்ட வேறுபாட்டைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள உடன்படிக்கைப் பெயர்
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’ என்று மொழிபெயர்த்து, சொற்படியான ‘இஸ்ரவேலின் மகன்கள்’ என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையில் ‘இஸ்ரவேலின் மகன்கள்’ அல்லது ‘இஸ்ரவேல் புத்திரர்’ என்று வழங்குதல்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவம் மறைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ஆனால் இச்சூழலில் அந்த நிலையான பெயர் ஆண்களை மட்டும் அல்லாது இஸ்ரவேல் சமூகத்தையே குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ நவீன வாசகருக்குத் தவறான பாலின வரம்பை ஏற்படுத்தாமல் அதன் செயல்பாட்டு பொருளை வழங்குகிறது.
- issue: גֵּר மற்றும் תּוֹשָׁב ஆகிய இரு சமூக-சட்டப் பிரிவுகளின் வேறுபாடு
  choice: ‘அந்நியக் குடியேறி’ மற்றும் ‘குடியிருப்பாளர்’ என இரு தனிச் சொற்களால் வேறுபாட்டைப் பாதுகாத்தல்
  alternative: இரண்டையும் பொதுவாக ‘அந்நியர்’ அல்லது ‘குடியிருப்பவர்’ என்று ஒன்றாக்குதல்
  rationale: மூல உரை இரு வேறு சொற்களை இணைத்துக் குறிப்பிடுவதால் அவற்றை ஒரே பிரிவாகக் கரைத்துவிடாமல் பாதுகாக்கிறது; அவற்றின் துல்லியமான சட்ட எல்லைகள் குறித்து உரை கூறாததை மொழிபெயர்ப்பு மிகையாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘புத்திரர்’, ‘அடைக்கலப் பட்டணம்’ போன்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன; அதேவேளை மூலத்தின் சட்டத் துல்லியமும் இரு குடியிருப்பு நிலைகளின் வேறுபாடும் காக்கப்பட்டுள்ளன.
