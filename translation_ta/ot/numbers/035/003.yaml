translation_notes:
  register: நவீன நிலையான தமிழில், சட்டரீதியான கட்டளையின் கண்ணியமான தொனி பேணப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இணை அமைப்பு தமிழில் இயல்பாக அமைய அரைப்புள்ளியும் தொடர்ச்சியான “-க்காகவும்” வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன.
