base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: ta
  text: அந்த நகரங்கள் அவர்கள் குடியிருப்பதற்கானவையாக இருக்க வேண்டும்; அவற்றைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்[a] அவர்களுடைய கால்நடைகளுக்காகவும், உடைமைகளுக்காகவும்[b], அவர்களுடைய எல்லா விலங்குகளுக்காகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேய்ச்சல் நிலங்கள்” என்பதற்குப் பதிலாக, “பொதுநிலங்கள்” அல்லது “திறந்த வெளிநிலங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நகரங்களைச் சுற்றியுள்ள திறந்த நிலப்பரப்பைக் குறிக்கிறது; இங்கு அது குறிப்பாக விலங்குகளை மேய்ப்பதற்குப் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உடைமைகளுக்காகவும்” என்பதற்குப் பதிலாக, “சொத்துகளுக்காகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் என்ற பொருளைக் கொண்டது. இந்தச் சட்டரீதியான நில ஒதுக்கீட்டுச் சூழலில் “நகரங்கள்” என்பது இயல்பான, தொடர்ச்சியான சொல்.
- source_word: לָשָׁבֶת
  choice: குடியிருப்பதற்கானவையாக
  rationale: ישׁב என்பதன் இங்கு பொருத்தமான பொருள் ‘வசித்தல்/குடியிருத்தல்.’ எபிரெய நோக்க infinitive-ஐத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִגְרְשֵׁיהֶם
  choice: அவற்றைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்தைச் சுற்றியிருந்த திறந்த பொதுநிலத்தைக் குறிக்கிறது; இவ்வசனத்தில் அது குறிப்பாக விலங்குகளுக்குப் பயன்படுவதால் “மேய்ச்சல் நிலங்கள்” அதன் செயல்பாட்டைத் தெளிவாக்குகிறது. “அவற்றைச் சுற்றியுள்ள” என்பது நிலத்தின் நகரச் சார்பை வெளிப்படுத்துகிறது.
- source_word: לִבְהֶמְתָּם
  choice: அவர்களுடைய கால்நடைகளுக்காகவும்
  rationale: בְּהֵמָה இங்கு வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; “கால்நடைகள்” என்பது நவீனத் தமிழில் தெளிவான பொதுப்பெயர்.
- source_word: לִרְכֻשָׁם
  choice: உடைமைகளுக்காகவும்
  rationale: רְכוּשׁ என்பது ஒருவருக்குச் சொந்தமான உடைமைகள் அல்லது சொத்துகளைக் குறிக்கிறது. “உடைமைகள்” மூலச்சொல்லின் பரப்பைத் தக்கவைத்து, சட்டரீதியான தொனிக்கும் பொருந்துகிறது.
- source_word: וּלְכֹל חַיָּתָם
  choice: அவர்களுடைய எல்லா விலங்குகளுக்காகவும்
  rationale: חַיָּה ‘உயிரினம்’ அல்லது ‘விலங்கு’ எனப் பொருள்படலாம். கால்நடைகள் ஏற்கெனவே குறிப்பிடப்பட்டுள்ளதால், இங்கு அவர்களுக்குரிய மற்ற எல்லா விலங்குகளையும் உள்ளடக்கும் விரிவான சொல்லாக “எல்லா விலங்குகள்” பயன்படுத்தப்பட்டுள்ளது.
