translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவாக்கியத்தின் தொடர்ச்சியைக் காக்கும் கண்ணியமான நடை. வசனம் அடுத்த தீர்ப்புக் கூற்றுடன் தொடர்வதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘பார்க்காமல்’ என்பதே மூலத்தின் நேரடியான சொல்லாட்சி; இதன் சூழற்பொருள் அறியாமல் அல்லது கவனிக்காமல் என்பதாக இருக்கலாம், ஆனால் தனி அடிக்குறிப்பு இன்றியும் தமிழில் போதிய அளவு புரிகிறது.
