base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: ta
  text: அல்லது, ஒருவரைக் கொல்லக்கூடிய ஏதாவது ஒரு கல்லை, பார்க்காமல்[a], அதை அவன்மேல் விழச் செய்து அவன் இறந்து, அவ்வாறு செய்தவன் அவனுக்குப் பகைவனாகவும் இல்லை, அவனுக்குத் தீங்கு செய்ய நாடியவனாகவும் இல்லை என்றால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “பார்க்காமல்.” இந்தச் சொற்றொடர் உடலால் பார்ப்பதை முற்றிலும் மறுப்பதைவிட, அறியாமை அல்லது கவனிக்காமையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: அல்லது
  rationale: முந்தைய சட்டவழக்கின் மாற்றுச் சூழல்களைத் தொடரும் எளிய பிரிநிலை இணைப்புச் சொல்.
- source_word: בְּכָל אֶבֶן
  choice: ஏதாவது ஒரு கல்லை
  rationale: ב கருவியைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் causative வினையுடன் கல் நேரடி செயப்படுபொருளாக இயல்பாக வருகிறது. כָל என்பதன் பரந்த பொருளை ‘ஏதாவது ஒரு’ வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: ஒருவரைக் கொல்லக்கூடிய
  rationale: அக்கல் மரணத்தை ஏற்படுத்தும் திறனுடையது என்பதைக் குறிப்பிடுகிறது; எபிரெய 3ஆம் ஆண் ஒருமையின் பொதுவான சட்டப் பயன்பாட்டை ‘ஒருவர்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: בְּלֹא רְאוֹת
  choice: பார்க்காமல்
  rationale: எபிரெய மொழியின் konkretaன ‘பார்க்காமல்’ என்ற சொல்லாட்சியைப் பாதுகாத்து, அறியாமை அல்லது கவனிக்காமை என்ற சூழற்பொருளை வாசகர் உணர இடமளிக்கிறது.
- source_word: וַיַּפֵּל עָלָיו
  choice: அவன்மேல் விழச்செய்ததால்
  rationale: נפל என்பதன் Hiphil வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாக்கிறது; கல் தானாக விழுந்தது என்று மாற்றாமல் செய்பவரின் பங்கைத் தெரிவிக்கிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனாலும்
  rationale: செயலின் மரண விளைவைக் காட்டுகிறது; தொடரும் நிபந்தனைச் சட்டவாக்கியத்துடன் இயல்பாக இணைக்க ‘-ஆலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: அவன் அவனுக்குப் பகைவனாகவும் இல்லை
  rationale: முன்பகை இல்லாததைத் தெளிவாகவும், இரு ஆண் சுட்டுப்பெயர்களின் மூலத் தெளிவின்மையை அதிகமாகத் தீர்க்காமலும் தருகிறது.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: அவனுக்குத் தீங்கு செய்ய நாடியவனாகவும் இல்லை
  rationale: רָעָה என்பதன் இச்சட்டச் சூழலிலான ‘தீங்கு’ என்ற பொருளையும், מְבַקֵּשׁ குறிக்கும் நோக்கமுள்ள முயற்சியையும் இயல்பான தமிழில் தருகிறது.
