translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘பேசு ... சொல்’ என்ற மறுமொழி அமைப்பு பாதுகாக்கப்பட்டுள்ளது; பாலின வடிவின் நேரடி பொருள் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
