  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: ta
  text: '“இஸ்ரவேலின் மகன்களிடம் பேசு; அவர்களிடம் இவ்வாறு சொல்: ‘நீங்கள் யோர்தானைக் கடந்து கானான் நாட்டிற்குள் செல்லும்போது,’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசு
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான கட்டளைத் தன்மையைப் பாதுகாக்கிறது; אֶל என்பதுடன் சேர்ந்து ‘...ிடம் பேசு’ என இயல்பாக அமைகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் வழக்குச் சொற்றொடர். நவீனத் தமிழில் ‘இஸ்ரவேலின் மக்கள்’ இயல்பாகவும் உள்ளடக்கமான பொருளைத் தெளிவாகவும் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் இவ்வாறு சொல்
  rationale: ‘பேசு ... சொல்’ என்ற எபிரெயக் கட்டளைத் தொடரின் இரு வினைகளையும் பாதுகாக்கிறது; மேற்கோள் தொடர்வதை ‘இவ்வாறு’ இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: כִּי
  choice: செல்லும்போது
  rationale: எதிர்காலச் சூழ்நிலையை அறிமுகப்படுத்தும் காலப் பொருளில் ‘போது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַתֶּם עֹבְרִים
  choice: நீங்கள் ... கடந்து ... செல்லும்போது
  rationale: சுட்டுப்பெயருடன் கூடிய பங்கேற்பு வடிவம் அண்மையிலுள்ள எதிர்காலச் செயலைக் குறிக்கிறது. தமிழில் ‘கடந்து ... செல்லும்போது’ என்பது ஆற்றைக் கடந்து நாட்டிற்குள் நுழையும் இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக்
  rationale: புவியியல் பெயரை வழக்கமான தமிழ் வேதாகம வடிவில் தருகிறது; ‘ஆறு’ என்பது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: אַרְצָה כְּנָעַן
  choice: கானான் நாட்டிற்குள்
  rationale: אֶרֶץ என்பதன் திசைச் சுட்டு இறுதி, அந்த நிலப்பகுதியை நோக்கி மட்டுமல்லாமல் அதற்குள் செல்லும் இயக்கத்தையும் இச்சூழலில் குறிக்கிறது.
