revisions:
- from: இரத்தப்பழி வாங்குகிறவரே கொலைகாரனைக் கொல்ல வேண்டும்; அவனை எதிர்கொள்ளும்போது, அவரே அவனைக் கொல்ல வேண்டும்.
  to: இரத்தப் பழிவாங்குபவரே கொலைகாரனைக் கொல்ல வேண்டும்; அவர் கொலைகாரனைச் சந்திக்கும்போது, அவரே அவனைக் கொல்ல வேண்டும்.[a]
  rationale: The revision retains the Hebrew legal register, the twofold emphasis on the authorized agent, and the directness of the killing verb. It uses a more idiomatic Tamil rendering of the fixed legal title and a neutral verb for the encounter, while the footnote supplies necessary historical-legal clarification without expanding the verse itself.
