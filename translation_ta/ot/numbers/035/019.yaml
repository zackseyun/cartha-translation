source:
  edition: WLC
  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: ta
  text: இரத்தப் பழிவாங்குபவரே கொலைகாரனைக் கொல்ல வேண்டும்; அவர் கொலைகாரனைச் சந்திக்கும்போது, அவரே அவனைக் கொல்ல வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘இரத்தப் பழிவாங்குபவர்’ என்பது சட்டத்தில் பயன்படுத்தப்படும் நிலையான சொற்றொடர்; சட்டவிரோதக் கொலைக்காகப் பழிவாங்கும் பொறுப்புடைய குடும்ப உறுப்பினரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவர்
  rationale: இது இஸ்ரவேலின் கொலைச்சட்டச் சூழலில், அநியாயமாகச் சிந்தப்பட்ட இரத்தத்திற்காகப் பழிவாங்கும் பொறுப்புடைய குடும்ப உறவினரைக் குறிக்கும் நிலையான சட்டச் சொற்றொடர். ‘மீட்பவர்’ என்ற பொதுப் பொருள் இங்கே பொருந்தாது.
- source_word: הוּא
  choice: அவரே
  rationale: தனிப்பட்ட சுட்டுப்பெயர் செயலை நிறைவேற்ற வேண்டியவர் இவர்தாமே என்பதை வலியுறுத்துகிறது.
- source_word: יָמִית
  choice: கொல்ல வேண்டும்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தல்’ என்பதைக் குறிக்கிறது. தமிழில் ‘கொல்ல வேண்டும்’ என்பது மூலத்தின் நேரடியான வலிமையையும் சட்டக் கட்டளையையும் இயல்பாக வெளிப்படுத்துகிறது; ‘மரண தண்டனை நிறைவேற்ற வேண்டும்’ என்பது மூலத்தில் இல்லாத நீதிமன்ற நடைமுறையை மிகத் தெளிவாகச் சேர்த்துவிடக்கூடும்.
- source_word: הָרֹצֵחַ
  choice: கொலைகாரன்
  rationale: רצח சட்டவிரோதமான மனிதக்கொலையைக் குறிக்கிறது. சுற்றியுள்ள சட்ட வேறுபாடுகளின் அடிப்படையில் இங்கே மரணத்திற்குப் பொறுப்பான கொலையாளியே குறிக்கப்படுகிறார்.
- source_word: בְּפִגְעוֹ בוֹ
  choice: அவனை எதிர்கொள்ளும்போது
  rationale: פגע இங்கே ஒருவரைச் சந்தித்தல் அல்லது எதிர்ப்படுதல் என்ற பொருளைக் கொண்டது. ‘எதிர்கொள்ளும்போது’ என்பது அந்தச் சந்திப்பின் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוּא יְמִיתֶנּוּ
  choice: அவரே அவனைக் கொல்ல வேண்டும்
  rationale: மீண்டும் வரும் சுட்டுப்பெயரும் வினையும், செயலை நிறைவேற்றும் நபரையும் செயலையும் வலியுறுத்துகின்றன; அந்த மறுபடியும் கூறுதலைத் தமிழிலும் தக்கவைத்துள்ளது.
theological_decisions:
- issue: גֹּאֵל הַדָּם என்பவரின் சட்டப் பங்கு
  choice: இஸ்ரவேலின் நீதிச்சட்ட அமைப்பில், கொல்லப்பட்டவரின் குடும்பத்தைச் சேர்ந்த இரத்தப்பழி வாங்கும் மனித முகவராக மொழிபெயர்த்தல்
  alternative: ‘இரத்தத்தின் மீட்பர்’ அல்லது இறையியல் மீட்பைக் குறிக்கும் நபராக மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தின் சூழல் மனிதக்கொலை குறித்த இஸ்ரவேலின் சட்டமாகும்; பிற்கால மீட்புக் கோட்பாடுகளை இச்சட்டச் சொல்லுக்குள் புகுத்தக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் சட்டத் தொனியும் எபிரேயத்தின் இருமுறை வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. மரியாதை ஒருமையான ‘அவர்’ என்பது சட்டப் பொறுப்புடைய நபரைச் சுட்ட இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
