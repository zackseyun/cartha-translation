  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: ta
  text: அப்போது சபை, அடித்தவனுக்கும் இரத்தப் பழிவாங்குபவனுக்கும்[a] இடையே இந்தச் சட்டவிதிகளின்படி[b] தீர்ப்பளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரத்தப்பழி வாங்குபவன்.’ கொல்லப்பட்ட ஒருவரின் உறவினருக்காகப் பழிவாங்கும் பொறுப்புடைய நபரை எபிரெய மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இந்தத் தீர்ப்புகளின்படி.’ எபிரெயச் சொல் சட்டத் தீர்ப்புகளையோ சட்டவிதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: அப்போது ... தீர்ப்பளிக்க வேண்டும்
  rationale: இணைப்புடன் வந்த வினைச்சொல் இச்சட்ட நடைமுறையின் அடுத்த கட்டத்தைக் குறிக்கிறது. ‘தீர்ப்பளிக்க வேண்டும்’ என்பது அதன் நீதித்துறை வலிமையையும் எதிர்நோக்கிய கட்டளையையும் இயல்பான தமிழில் தருகிறது.
- source_word: הָעֵדָה
  choice: சபை
  rationale: இஸ்ரவேலின் ஒன்றுகூடிய மக்களைக் குறிக்கும் கூட்டு அமைப்பையும் இங்கு அவர்களுக்கு அளிக்கப்பட்ட நீதித்துறைப் பொறுப்பையும் ‘சபை’ சுருக்கமாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: בֵּין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: எபிரெய மொழியில் மீண்டும் வரும் முன்னிடைச்சொல்லின் உறவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַמַּכֶּה
  choice: அடித்தவன்
  rationale: இது נכה என்ற வேரிலிருந்து வந்த செய்பவர் பெயர். அந்த நபரை ஏற்கெனவே ‘கொலைகாரன்’ என்று தீர்மானிக்காமல், மூலத்தின் நடைமுறை சார்ந்த நடுநிலையைப் பாதுகாக்கிறது.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: கொல்லப்பட்ட உறவினரின் இரத்தத்துக்காகப் பழிவாங்கும் சட்டபூர்வப் பொறுப்புடைய நபரைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தமிழில் புரியத்தக்கவாறு காக்கிறது.
- source_word: עַל
  choice: '...இன்படி'
  rationale: கூறப்பட்ட சட்ட அளவுகோல்களுக்கு ஏற்ப தீர்ப்பு வழங்கப்பட வேண்டும் என்ற நெறிப்படுத்தும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: இந்தச் சட்டவிதிகள்
  rationale: תורה சட்டச் சூழலில் இச்சொல் தீர்ப்புகள் அல்லது ஒழுங்குவிதிகளைக் குறிக்கலாம். ‘சட்டவிதிகள்’ என்பது இங்கு தீர்ப்பை வழிநடத்தும் விதிமுறைகள் என்ற பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: கொலைச்சாவு தொடர்பான விசாரணையில் சபையின் நீதித்துறைப் பங்கு
  choice: அடித்தவனுக்கும் இரத்தப்பழி வாங்குகிறவனுக்கும் இடையே சபை தீர்ப்பளிக்க வேண்டும் என்று மொழிபெயர்க்கப்பட்டது; அடித்தவன் ஏற்கெனவே கொலைகாரன் எனக் குறிப்பிடப்படவில்லை.
  alternative: ‘சபை’ என்பதை ஒரு குறுகிய நீதிமன்றக் குழுவாக மட்டும் விளக்குவது, அல்லது அடித்தவனை ‘கொலைகாரன்’ என மொழிபெயர்ப்பது.
  rationale: எபிரெய உரை சமூகச் சபைக்கு நீதித்துறைப் பொறுப்பை அளிக்கிறது; ஆனால் இவ்வசனத்திலேயே குற்றஞ்சாட்டப்பட்ட நபர் திட்டமிட்ட கொலை செய்தவர் என்று முடிவு செய்யவில்லை. ஆகவே நடைமுறை சார்ந்த நடுநிலை பாதுகாக்கப்படுகிறது.
