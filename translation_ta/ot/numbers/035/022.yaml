  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: ta
  text: ஆனால், அவன் பகைமை ஏதுமின்றி[a] திடீரென அவனைத் தள்ளினாலோ, அல்லது பதுங்கிக் காத்திராமல்[b] ஏதாவது ஒரு பொருளை அவன்மேல் எறிந்தாலோ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பகையுணர்வின்றி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தனிப்பட்ட பகைமை அல்லது விரோதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பதுங்கித் தாக்கத் திட்டமிடாமல்” என்றும் மொழிபெயர்க்கலாம். சொல்லுக்குச் சொல், “பதுங்கிக் காத்திராமல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... விட்டாலோ
  rationale: முந்தைய நிகழ்வுகளுக்கு மாறான நிபந்தனைச் சூழலை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: בְּפֶתַע
  choice: திடீரென
  rationale: எதிர்பாராத, சட்டென்ற நிகழ்வைக் குறிக்கும் எபிரெயச் சொல்லின் நேரடியானவும் இயல்பானவும் உள்ள தமிழ் இணை.
- source_word: בְּלֹא אֵיבָה
  choice: பகைமை ஏதுமின்றி
  rationale: தனிப்பட்ட விரோதம் அல்லது பகையுணர்வு இல்லாததைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: הֲדָפוֹ
  choice: அவனைத் தள்ளிவிட்டால்
  rationale: ஒருவரைத் தள்ளுதல் அல்லது உந்துதல் என்ற வினையின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אוֹ
  choice: அல்லது ... எறிந்தாலோ
  rationale: மாற்று நிகழ்வை அறிமுகப்படுத்தும் பிரிநிலை இணைப்பைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: அவன்மேல் எறிந்தால்
  rationale: ஒரு பொருளை அந்த நபரின் மீது அல்லது அவரை நோக்கி எறிதல் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: כָּל כְּלִי
  choice: ஏதாவது ஒரு பொருள்
  rationale: כְּלִי என்பதன் பரந்த பொருள் வரம்பைக் காக்கிறது; குறிப்பிட்ட பாத்திரம் அல்லது கருவி என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: בְּלֹא צְדִיָּה
  choice: பதுங்கிக் காத்திராமல்
  rationale: தாக்குவதற்காக மறைந்து அல்லது பதுங்கிக் காத்திருத்தல் என்ற மூலமொழியின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
