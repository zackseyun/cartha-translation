  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: ta
  text: மரண தண்டனைக்குரிய கொலைகாரனின் உயிருக்காக நீங்கள் மீட்புத் தொகையை[a][b] ஏற்றுக்கொள்ளக் கூடாது; அவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்புத் தொகை’ என்பதை ‘இழப்பீடு’ அல்லது ‘விடுதலைத் தொகை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தண்டனையைத் தவிர்க்க அல்லது விடுதலை பெறச் செலுத்தப்படும் தொகையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘கொலைகாரனின் உயிருக்காக.’ அவனுடைய உயிரைக் காப்பாற்ற எந்தத் தொகையையும் ஏற்றுக்கொள்ளக் கூடாது என்பதே பொருள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு நெருக்கமாக, ‘அவன் கொல்லப்படவே கொல்லப்பட வேண்டும்.’ எபிரெய மொழியின் இந்த அமைப்பு கட்டளையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: ஏற்றுக்கொள்ள
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’ என்றாலும், כֹּפֶר என்னும் பணத்தொகையுடன் வரும் சட்டச் சூழலில் ‘பணம் ஏற்றுக்கொள்ளுதல்’ என்பதே இயல்பான பொருள்.
- source_word: כֹּפֶר
  choice: ஈட்டுத்தொகை
  rationale: தண்டனையைத் தவிர்க்க அல்லது விடுதலை பெற செலுத்தப்படும் தொகையை இது குறிக்கிறது. தமிழில் ‘ஈட்டுத்தொகை’ சட்டரீதியான பரிமாற்றப் பொருளைத் தெளிவாகத் தருகிறது; இது வெறும் கையூட்டு அல்ல.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: கொலைகாரனின் உயிரைக் காப்பாற்றுவதற்காக
  rationale: சொல்லுக்கு நெருக்கமாக ‘கொலைகாரனின் உயிருக்கு’ என்று இருந்தாலும், சூழலில் பணம் அவனது உயிரை மரண தண்டனையிலிருந்து காப்பாற்றுவதற்காக வழங்கப்படுவதைக் குறிக்கிறது. அந்தச் சட்டப் பொருள் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: רֹצֵחַ
  choice: கொலைகாரன்
  rationale: எண்ணாகமம் 35 தற்செயலான உயிர்க்கொலையையும் குற்றப்பொறுப்புள்ள கொலையையும் வேறுபடுத்துகிறது. இங்கு மரண தண்டனைக்குரியவன் என்பதால் ‘கொலைகாரன்’ துல்லியமானது.
- source_word: רָשָׁע לָמוּת
  choice: மரண தண்டனைக்குரிய
  rationale: எபிரெயச் சொற்றொடர் சட்டரீதியாக மரணத்திற்குக் குற்றவாளி அல்லது மரண தண்டனை பெறத் தகுந்தவன் என்பதைக் குறிக்கிறது. ‘மரண தண்டனைக்குரிய’ என்பது நவீனத் தமிழில் தெளிவான நீதித்துறைச் சொற்பயன்பாடு.
- source_word: כִּי מוֹת יוּמָת
  choice: அவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுவினைக்கு முன் அதே வேரின் வினையெச்சம் வருவது உறுதியையும் கட்டாயத்தையும் வலியுறுத்துகிறது. ‘நிச்சயமாக’ வலியுறுத்தலையும் ‘வேண்டும்’ சட்டக் கட்டாயத்தையும் காக்கின்றன.
theological_decisions:
- issue: மரண தண்டனை விதியின் சட்டக் கட்டாயம்
  choice: மரண தண்டனைக்குரிய கொலைகாரனின் தண்டனையைப் பணம் பெற்றுக் குறைக்கக் கூடாது என்ற கட்டாயமான நீதித்துறை ஆணையாக மொழிபெயர்க்கப்பட்டது.
  alternative: வலுவான கட்டளை அல்லாமல் அக்கால வழக்கத்தை விவரிப்பதாக மொழிபெயர்த்தல்.
  rationale: לֹא תִקְחוּ என்ற தடை வடிவமும் מוֹת יוּמָת என்ற வலியுறுத்தப்பட்ட வினை அமைப்பும் இதை வெறும் வழக்கவிளக்கமாக அல்ல, உறுதியான சட்டக் கட்டளையாகக் காட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மரண தண்டனைக்குரிய’ என்பது நீதித்துறைப் பொருளைத் தெளிவாக்குகிறது; மூலத்தின் வலியுறுத்தல் ‘நிச்சயமாக... வேண்டும்’ எனக் காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
