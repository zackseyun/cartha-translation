  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: ta
  text: அப்போது சபையினர் கொலை செய்தவனை இரத்தப் பழிவாங்குபவனின் கையிலிருந்து மீட்டு, அவன் தப்பியோடிய அடைக்கல நகரத்திற்குத் திரும்ப அழைத்துச் செல்ல வேண்டும். பரிசுத்த எண்ணெயால் அபிஷேகம் செய்யப்பட்ட தலைமைக் குரு இறக்கும்வரை[c], அவன் அந்த நகரத்தில் குடியிருக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘அதில் தங்கியிருக்க வேண்டும்’ அல்லது ‘அதில் வாழ வேண்டும்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத் தொடரமைப்பு, சொல்லுக்கு சொல், ‘அவர் அவனைப் பரிசுத்த எண்ணெயால் அபிஷேகம் செய்த தலைமைக் குரு’ என்பதாகும். ‘அபிஷேகம் செய்தார்’ என்பதன் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; ஆகவே பல மொழிபெயர்ப்புகள் இதை ‘அபிஷேகம் செய்யப்பட்ட தலைமைக் குரு’ எனச் சீராக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: மீட்டு
  rationale: நצל என்பதன் ஹிஃபில் வடிவம் ஒருவரை மற்றொருவரின் அதிகாரத்திலிருந்து விடுவிப்பதைக் குறிக்கிறது; சட்டப் பாதுகாப்புச் சூழலில் ‘மீட்டு’ இயல்பாக உள்ளது.
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: எண்ணாகமத்தில் நீதித் தீர்ப்பில் செயல்படும் கூடிய சமூகத்தைக் குறிக்கிறது; நவீன தமிழில் கூட்டுச் செயற்பாட்டைத் தெளிவாக உணர்த்துகிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவனை
  rationale: இச்சொல் இவ்வதிகாரத்தில் வேண்டுமென்றும் தற்செயலாகவும் உயிரைக் கொன்றவர்களைக் குறிக்கக்கூடும். ‘கொலைகாரன்’ என்று மொழிபெயர்த்தால் நிரூபிக்கப்படாத குற்றநோக்கைச் சேர்த்துவிடும்.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: எபிரெய மொழியின் உருவகத்தைப் பாதுகாக்கும் இயல்பான தமிழ் வழக்கு.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப் பழிவாங்குபவன்
  rationale: சிந்தப்பட்ட இரத்தத்திற்குப் பழிவாங்கும் சட்டப்பூர்வப் பொறுப்புடைய நபரைக் குறிக்கிறது; அருகிய உறவினர் என்பது பெரும்பாலும் உட்கருத்தாக இருந்தாலும் இத்தொடரில் வெளிப்படையாக இல்லை.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: அவனைத் திருப்பி அனுப்ப வேண்டும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவமான ‘திரும்பச் செய்தல்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִיר מִקְלָטוֹ
  choice: அடைக்கல நகரம்
  rationale: இவ்வதிகாரத்தின் நிறுவப்பட்ட சட்ட அமைப்பைக் குறிக்கும் தெளிவான, இயல்பான தமிழ் பெயர்.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: அவன் தப்பியோடியிருந்த
  rationale: அவன் தப்பியோடிய இலக்கு அந்த அடைக்கல நகரமே என்பதைத் தமிழ் தொடர்பெயரெச்ச வடிவில் தெளிவாக்குகிறது.
- source_word: וְיָשַׁב בָּהּ
  choice: அந்த நகரத்திலேயே குடியிருக்க வேண்டும்
  rationale: ישב இங்கு தங்கி வாழ்வதைச் சுட்டுகிறது; ‘குடியிருக்க’ என்பது தொடர்ந்த வசிப்பையும் சட்டரீதியான தங்குதலையும் உணர்த்துகிறது.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: தலைமைக் குரு இறக்கும்வரை
  rationale: எபிரெய பெயர்ச்சொல் அமைப்பை இயல்பான நவீனத் தமிழ் வினை அமைப்பில் தருகிறது.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: அவனுக்கு அபிஷேகம் செய்த
  rationale: எபிரெய உரை 3ஆம் நபர் ஆண்பால் ஒருமைச் செயப்பாட்டு வினையைப் பயன்படுத்தி, செய்பவரை வெளிப்படையாகக் குறிப்பிடாமல் விடுகிறது. தமிழ் மொழிபெயர்ப்பும் அந்தச் செய்பவரைச் சேர்க்காமல் செயல்வடிவத்தைப் பாதுகாக்கிறது.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: பரிசுத்த எண்ணெயால்
  rationale: குறிப்பிட்ட அர்ப்பணிப்பு அபிஷேக எண்ணெயைக் குறிக்கும் எபிரெய சொற்றொடருக்கு நெருக்கமான மரியாதைமிக்க தமிழ்.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் சட்ட நிலை
  choice: ‘கொலை செய்தவன்’ எனச் செயலை மட்டும் குறிப்பிட்டது.
  alternative: ‘கொலைகாரன்’ அல்லது ‘கொலையாளி’
  rationale: இவ்வதிகாரம் வேண்டுமென்ற கொலையையும் தற்செயலான உயிரிழப்பையும் வேறுபடுத்துகிறது. குற்றநோக்கம் தீர்மானிக்கப்பட்டதாக மொழிபெயர்ப்பு முன்கூட்டியே சொல்லக்கூடாது.
- issue: מָשַׁח אֹתוֹ என்பதன் மறைந்துள்ள எழுவாய்
  choice: ‘அவனுக்கு அபிஷேகம் செய்த’ என்ற செயல்வடிவத்தை வைத்து, செய்தவர் யார் என்பதைச் சேர்க்கவில்லை.
  alternative: ‘அபிஷேகம் செய்யப்பட்ட’ என்ற செயப்பாட்டு வடிவம்
  rationale: மசோரெட்டிக் உரையில் வினை செயல்வடிவில் உள்ளது; அதன் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. அதைச் செயப்பாட்டு வடிவமாக மாற்றுவது தொடரமைப்பின் உண்மையான தெளிவின்மையை மறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டரீதியான கண்ணியத்தையும் மூல உரையின் தொடரமைப்பையும் இணைக்கும் நடை. ‘சபையார்’, ‘அடைக்கல நகரம்’, ‘தலைமைக் குரு’ ஆகியவை பொதுவாசகர்களுக்குப் புரியக்கூடிய முறையான சொற்கள். முக்கிய உரையில் [c], [b] குறிகள் அவற்றின் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன; இரத்தப் பழிவாங்குபவர் குறித்த பொருள் முதன்மை உரையிலேயே தெளிவாக இருப்பதால் தனி [a] குறிப்பு சேர்க்கப்படவில்லை.
