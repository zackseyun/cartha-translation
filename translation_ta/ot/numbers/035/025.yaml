  terminology: ‘இரத்தப் பழிவாங்குபவன்,’ ‘அடைக்கல நகரம்,’ ‘தலைமைக் குரு,’ மற்றும் ‘அபிஷேகம்’ ஆகியவை சட்ட மற்றும் சமயச் சூழலுக்கு ஏற்றவை. ‘கொலை செய்தவன்’ என்பது இங்கு குற்றநோக்கை முன்கூட்டியே சுமத்தாமல், கொன்ற நபரைக் குறிக்கிறது.
