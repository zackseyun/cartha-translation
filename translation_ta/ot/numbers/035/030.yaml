source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: ta
  text: ஒருவர் மற்றொருவரைக் கொன்றால், சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில்தான்[a] கொலைகாரனுக்கு மரண தண்டனை நிறைவேற்றப்பட வேண்டும்[b]. ஆனால் ஒருவருக்கு மரண தண்டனை விதிக்கப்படுவதற்காக, ஒரே சாட்சி அவருக்கு எதிராகச் சாட்சி சொல்லக்கூடாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “சாட்சிகளின் வாயின்படி.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “கொலைகாரன்” என்பதற்கும் அவனுக்கு மரண தண்டனை நிறைவேற்றப்படுவதைக் குறிக்கும் வினைச்சொல்லுக்கும் ஒரே சொல்வேர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்கு சொல்: “ஒரு நபருக்கு எதிராக, மரணத்திற்காக.” இது ஒருவருக்கு மரணத் தீர்ப்பு வருவதற்காக அளிக்கப்படும் சாட்சியத்தைக் குறிக்கிறது.'
    reason: ambiguity
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: ஒருவரைக் கொன்றவன்
  rationale: சொல்லுக்கு சொல் எனில் ‘ஒருவரை அடிப்பவன்’ என்ற பொருள் இருந்தாலும், இந்த மரணத் தண்டனைச் சட்டச் சூழலில் உயிரைப் பறித்தவனையே குறிக்கிறது. ‘ஒருவரைக் கொன்றவன்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: இங்கு נֶפֶשׁ என்பது உடலிலிருந்து தனிப்பட்ட ‘ஆத்துமா’ அல்ல; ஒரு மனிதரையோ மனித உயிரையோ குறிக்கிறது. ஆகவே ‘ஒருவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְפִי עֵדִים
  choice: சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில்தான்
  rationale: ‘சாட்சிகளின் வாயின்படி’ என்ற எபிரெய மொழிநடை, அவர்களுடைய சாட்சியத்தை ஆதாரமாகக் கொண்டே தீர்ப்பு வழங்கப்பட வேண்டும் என்பதைக் குறிக்கிறது. ‘தான்’ என்பது பல சாட்சிகளின் வாக்குமூலம் அவசியம் என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: கொலைகாரன் கொல்லப்பட வேண்டும்
  rationale: எபிரெயத்தில் கொலைகாரனுக்கும் அவனைக் கொல்வதற்கும் רצח என்ற ஒரே சொல்வேர் பயன்படுத்தப்பட்டுள்ளது. சட்டப்படி நிறைவேற்றப்படும் மரணத் தண்டனையை ‘கொலை’ என்று தவறாக உணர்த்தாமல், மூலத்தின் சொல் தொடர்பை முடிந்தவரை காக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעֵד אֶחָד לֹא יַעֲנֶה
  choice: ஆனால் ஒரே ஒரு சாட்சி மட்டும் … சாட்சி சொல்லக்கூடாது
  rationale: וְ இங்கு முந்தைய பல சாட்சிகளுக்கு மாறாக ஒரே சாட்சியின் போதாமையை காட்டுவதால் ‘ஆனால்’ என வழங்கப்பட்டது. சட்டச் சூழலில் ענה என்பது ‘பதில் சொல்’ என்பதைக் காட்டிலும் ‘சாட்சி சொல்’ எனப் பொருள்படுகிறது.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: ஒருவருக்கு மரண தண்டனை விதிக்கும்படி … அவருக்கு எதிராக
  rationale: இது ஒருவருக்கு எதிரான சாட்சியம் அவருடைய மரணத் தீர்ப்புக்கு அடிப்படையாக அமையும் சட்டச் சூழலைக் குறிக்கும் சுருக்கமான எபிரெய சொற்றொடர். தமிழில் விளங்கும்படி கூறப்பட்டாலும், ஒரே சாட்சியால் மரணத் தீர்ப்பு வழங்கக்கூடாது என்ற சட்ட வரம்பு காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: மரணத்தை ஏற்படுத்தும் சாட்சியமா அல்லது மரணத் தண்டனைக்கான நீதிமன்றச் சாட்சியமா
  choice: மரண தண்டனை விதிக்கும்படி
  alternative: மரணம் நேரும்படி
  rationale: முழு அதிகாரமும் அடைக்கல நகரங்கள், கொலைக்குற்ற விசாரணை, சாட்சிகள் ஆகிய நீதிச் சூழலைக் கொண்டுள்ளது. எனவே இங்கு தனிப்பட்ட முறையில் மரணத்தை ஏற்படுத்துவது அல்ல, நீதித் தீர்ப்பாக மரண தண்டனை விதிப்பதே குறிப்பு. இருந்தாலும் மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் பொதுமக்கள் புரிந்துகொள்ளக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாக்குமூலம்,’ ‘மரண தண்டனை விதிக்க’ போன்ற சொற்கள் நீதிச் சூழலைத் தெளிவாக்குகின்றன; தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
