  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: ta
  text: லேவியர்களுக்கு நீங்கள் கொடுக்க வேண்டிய நகரங்களின் மொத்தம் நாற்பத்தெட்டு நகரங்கள்; அந்த நகரங்களையும் அவற்றின் மேய்ச்சல் நிலங்களையும் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொது நிலங்கள்’ அல்லது ‘திறந்தவெளி நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்; இது நகரங்களைச் சுற்றியுள்ள நிலப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: நகரங்கள் அனைத்தும்
  rationale: முழு எண்ணிக்கையையும் குறிக்கும் כָּל என்பதையும், עִיר என்பதன் இச்சூழலுக்குரிய ‘நகரங்கள்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: நீங்கள் ... கொடுக்கும்
  rationale: இரண்டாம் நபர் பன்மை வினையையும் தொடர்புச் சொல்லையும் சட்ட அறிவுறுத்தலுக்கு ஏற்ற இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த பெறுநர்களை நேரடியாகக் குறிக்கிறது.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: நாற்பத்தெட்டு நகரங்களாக
  rationale: எபிரெய எண்ணிக்கைக் கூற்றை நவீன தமிழின் இயல்பான வடிவில் தருகிறது.
- source_word: אֶתְהֶן
  choice: அவற்றை ... சேர்த்து
  rationale: முன்னர் கூறப்பட்ட நகரங்களை மீண்டும் சுட்டும் வலியுறுத்தலைத் தமிழில் இயல்பாக உள்ளடக்குகிறது; நகரங்களும் அவற்றின் நிலங்களும் மொத்த ஒதுக்கீட்டில் அடங்குவதைத் தெளிவாக்குகிறது.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: அவற்றைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களுடன்
  rationale: מִגְרָשׁ என்பது நகரைச் சுற்றியுள்ள திறந்த அல்லது பொதுப் பயன்பாட்டு நிலத்தைக் குறிக்கிறது; இச்சூழலில் அதன் மேய்ச்சல் பயன்பாட்டை ‘மேய்ச்சல் நிலங்கள்’ தெளிவாக எடுத்துரைக்கிறது.
