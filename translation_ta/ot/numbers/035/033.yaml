  source_fidelity: திருத்தம் தேவை. வரைவு இரத்தச்சிந்துதலால் தேசம் தீட்டுப்படுவதைச் சரியாகக் காட்டுகிறது; ஆனால் וְלָאָרֶץ לֹא יְכֻפַּר என்ற மறுப்பையும், כִּי אִם என்பதன் ‘அன்றியே/தவிர’ என்ற கட்டுப்பாட்டையும் தெளிவாக வெளிப்படுத்தவில்லை. ‘தேசத்திற்கு ஏற்பட்ட தீட்டு ... நிவிர்த்தி செய்யப்படும்’ என்பது மூலத்தின் ‘தேசத்திற்காகப் பரிகாரம் செய்ய முடியாது’ என்ற அமைப்பை மாற்றுகிறது.
  naturalness: ‘தீட்டுப்படுத்துதல்’ நவீனத் தரத் தமிழில் இச்சட்ட-பரிசுத்தச் சூழலுக்கு இயல்பாகவும் பொருத்தமாகவும் உள்ளது. திருத்தப்பட்ட வாக்கியம் நீளமானதாயினும், மூலத்தின் காரணம் மற்றும் விதிவிலக்கு அமைப்பைத் தெளிவாகப் பேணுகிறது.
  terminology: ‘தேசம்,’ ‘தீட்டுப்படுத்துதல்,’ ‘இரத்தம் சிந்தப்படுதல்,’ ‘பரிகாரம்’ ஆகியவை சூழலுக்கேற்றவை. ‘பரிகாரம் செய்ய முடியாது’ என்பது יְכֻפַּר-இன் பரிகார/நிவிர்த்திப் பொருளையும் வெளிப்படையான மறுப்பையும் காக்கிறது; அடிக்குறிப்பு ‘நிவிர்த்தி’ என்ற மாற்றை வழங்குகிறது.
