source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: ta
  text: நீங்கள் இருக்கும் தேசத்தைத் தீட்டுப்படுத்தாதீர்கள்; ஏனெனில் இரத்தமே தேசத்தைத் தீட்டுப்படுத்துகிறது. அதில் சிந்தப்பட்ட இரத்தத்தை முன்னிட்டு, அதைச் சிந்தியவனின் இரத்தத்தினாலேயன்றி தேசத்திற்காகப் பரிகாரம் செய்ய முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேசத்திற்காகப் பரிகாரம் செய்ய முடியாது” என்பதற்கு, “அதில் சிந்தப்பட்ட இரத்தத்தினால் தேசத்திற்கு ஏற்பட்ட தீட்டு நிவிர்த்தி செய்யப்பட முடியாது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: தீட்டுப்படுத்தாதீர்கள் / தீட்டுப்படுத்துகிறது
  rationale: இங்கு கொலை இரத்தம் தேசத்தை அறநெறி மற்றும் பரிசுத்தம் சார்ந்த வகையில் கறைப்படுத்துவதைக் குறிக்கிறது. ஒரே எபிரெய வேர்ச்சொல்லின் மறுபயன்பாட்டையும் தமிழில் ஒரே சொல்லால் காக்கிறது.
- source_word: הָאָרֶץ
  choice: தேசம்
  rationale: இது பொதுவாக முழு பூமியைக் காட்டிலும் இஸ்ரவேலர் குடியிருக்கும் குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘தேசம்’ அதன் நிலப்பரப்பு மற்றும் சமூகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי הַדָּם הוּא
  choice: ஏனெனில் இரத்தம்
  rationale: הוּא வலியுறுத்தல் தரலாம்; எனினும் தமிழில் இயல்பற்ற மிகை வலியுறுத்தலைச் சேர்க்காமல், வாக்கிய அமைப்பின் மையத்தில் ‘இரத்தம்’ என்பதைக் கொண்டு அந்தக் கவனத்தைப் பேணுகிறது.
- source_word: יְכֻפַּר
  choice: நிவிர்த்தி செய்யப்படும்
  rationale: כפר இங்கு தேசத்தின் மீது வந்த இரத்தப்பழி அல்லது தீட்டு அகற்றப்படுவதைக் குறிக்கிறது. ‘நிவிர்த்தி’ பலியியல் ஒலியை முற்றிலும் இழக்காமல் சாதாரண வாசகருக்கும் புரியும் வகையில் உள்ளது.
- source_word: שֻׁפַּךְ
  choice: சிந்தப்பட்ட
  rationale: சட்ட மற்றும் கொலைச் சூழலில் இரத்தத்தைக் குறிக்க இயல்பான தமிழ் சொல்லாக்கம்.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: ஒரே வழி அல்லது விதிவிலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: அதைச் சிந்தியவனின் இரத்தத்தினால்
  rationale: இரத்தத்தைச் சிந்திய கொலையாளியின் சொந்த இரத்தத்தையே குறிக்கும் எபிரெய உறவை நேரடியாகவும் தெளிவாகவும் காக்கிறது.
theological_decisions:
- issue: இரத்தச்சிந்துதலால் தேசம் தீட்டுப்படுதல்
  choice: அநியாயமான இரத்தச்சிந்துதல் தேசத்தின் மீது உண்மையான அற-பரிசுத்தத் தீட்டை ஏற்படுத்துகிறது; அதைச் சிந்தியவனின் இரத்தமே அந்தத் தீட்டை நிவிர்த்தி செய்கிறது.
  alternative: இது சமூகச் சீர்குலைவை மட்டும் குறிக்கும் உருவகம், அல்லது பரிசுத்தப் பொருள் இல்லாத குடிமை நீதிக் கூற்று.
  rationale: חנף என்ற வினையின் இருமுறைப் பயன்பாடும் כפר என்ற நிவிர்த்தி/பரிகாரச் சொல்லும் வெறும் சமூகக் குழப்பத்தைவிட ஆழமான இரத்தப்பழி சார்ந்த தீட்டைச் சுட்டுகின்றன. மொழிபெயர்ப்பு பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் இந்தப் பதற்றத்தைப் பேணுகிறது.
- issue: כפר என்பதன் பொருள்
  choice: தேசத்திற்கு ஏற்பட்ட தீட்டு நிவிர்த்தி செய்யப்படுதல்
  alternative: தேசத்திற்காகப் பாவநிவிர்த்தி செய்யப்படுதல்
  rationale: எபிரெயச் சொல் பலியியல்-அறநெறி சார்ந்த பரிகாரப் பொருளைக் கொண்டது. தமிழில் ‘நிவிர்த்தி’ என்பது இரத்தப்பழி அகற்றப்படுவதைத் தெளிவாக்குகிறது; ‘பாவநிவிர்த்தி’ என்ற சொல்லை முதன்மை உரையில் பயன்படுத்தினால் இங்கு இல்லாத விரிவான கோட்பாட்டு நுணுக்கம் இறக்குமதி செய்யப்படலாம். அடிப்படைச் சொல்லின் பரிகாரப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட-பரிசுத்தச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மாசுபடுத்துதல்’ சுற்றுச்சூழல் மாசை முதன்மையாக நினைவூட்டக்கூடும் என்பதால், அறநெறி மற்றும் பரிசுத்தத் தீட்டை வெளிப்படுத்த ‘தீட்டுப்படுத்துதல்’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
