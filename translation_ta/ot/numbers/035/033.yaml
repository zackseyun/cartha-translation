    rationale: ‘தேசத்திற்கு ஏற்பட்ட தீட்டு ... மட்டுமே நிவிர்த்தி செய்யப்படும்’ என்பது விளைவைக் கூறினாலும், ‘தேசத்திற்காகப் பரிகாரம் செய்ய முடியாது; ... அன்றியே’ என்ற וְלָאָרֶץ לֹא יְכֻפַּר ... כִּי אִם அமைப்பை நேரடியாகக் காட்டுவதில்லை.
