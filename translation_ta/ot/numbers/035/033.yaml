revisions:
- from: நீங்கள் குடியிருக்கும் தேசத்தைத் தீட்டுப்படுத்தாதீர்கள்; ஏனெனில் இரத்தம் தேசத்தைத் தீட்டுப்படுத்துகிறது. அதில் சிந்தப்பட்ட இரத்தத்தினால் தேசத்திற்கு ஏற்பட்ட தீட்டு, அதைச் சிந்தியவனின் இரத்தத்தினால் மட்டுமே நிவிர்த்தி செய்யப்படும்.[a]
  to: நீங்கள் இருக்கும் தேசத்தைத் தீட்டுப்படுத்தாதீர்கள்; ஏனெனில் இரத்தமே தேசத்தைத் தீட்டுப்படுத்துகிறது. அதில் சிந்தப்பட்ட இரத்தத்தை முன்னிட்டு, அதைச் சிந்தியவனின் இரத்தத்தினாலேயன்றி தேசத்திற்காகப் பரிகாரம் செய்ய முடியாது.[a]
  rationale: திருத்தம் மூலத்தின் இரட்டை வினைத் தொடர்பை (‘தீட்டுப்படுத்துதல்’), இரத்தத்தின் வலியுறுத்தலை (‘இரத்தமே’), தேசத்திற்காகப் பரிகாரம் செய்யப்பட முடியாதென்ற மறுப்பை, மற்றும் கொலையாளியின் இரத்தம் மட்டுமே விதிவிலக்கு/வழி என்பதைக் காக்கிறது. இது தண்டனையின் வரலாற்று-சட்டச் சூழலை மொழிபெயர்க்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
