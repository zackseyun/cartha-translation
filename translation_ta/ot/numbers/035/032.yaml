base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: ta
  text: தன் அடைக்கல நகரத்திற்குத் தப்பியோடியவனிடம், ஆசாரியன் இறப்பதற்கு முன் நாட்டிற்குத் திரும்பி அங்கே குடியிருப்பதற்காக மீட்புத்தொகை[a] வாங்காதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஈட்டுத்தொகை’ அல்லது ‘பணம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சட்ட விளைவுக்குப் பதிலாக அளிக்கப்படும் மீட்பு விலையையோ ஈட்டுத்தொகையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய தொடரமைப்பு சுருக்கமானது. அடைக்கல நகரத்திற்குத் தப்பிச் செல்வதோடு தொடர்புடையதாகவோ, அல்லது ஆசாரியன் இறப்பதற்கு முன் அங்கிருந்து திரும்புவதோடு தொடர்புடையதாகவோ மீட்புத்தொகை வாங்குவதை இது தடைசெய்வதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: மீட்புத்தொகை
  rationale: ஒருவருக்குப் பதிலாக அல்லது சட்டப்படி வரவேண்டிய விளைவுக்குப் பதிலாக ஏற்கப்படும் விலையையோ ஈட்டுத்தொகையையோ குறிக்கிறது. இச்சட்டச் சூழலில் ‘மீட்புத்தொகை’ அதன் பதிலீட்டுத் தன்மையைத் தெளிவாகக் காட்டுகிறது; ‘லஞ்சம்’ என்பது தேவையற்ற எதிர்மறை நோக்கத்தைச் சேர்க்கும்.
- source_word: לָנוּס
  choice: தப்பியோடியவன்
  rationale: נוּס என்பதன் அடிப்படைப் பொருள் ‘தப்பியோடு/ஓடிப்போ’. எபிரெயச் சொற்றொடர் இறந்தகால வினைச்சொல் அல்லாமல் வினையெச்சப் பொருளுடைய infinitive வடிவில் சுருக்கமாக இருந்தாலும், அடைக்கல நகரச் சூழலில் ஏற்கெனவே அங்கு தப்பியோடிய நபரைக் குறிக்கும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִיר מִקְלָטוֹ
  choice: தன் அடைக்கல நகரம்
  rationale: குறிப்பிட்ட புகலிட நகரத்தைக் குறிக்கும் சட்டவழக்குச் சொற்றொடர். உடைமைப் பின்னொட்டைத் தமிழில் ‘தன்’ என வெளிப்படுத்துவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: நாட்டிற்குத் திரும்பி அங்கே குடியிருப்பதற்காக
  rationale: இரண்டு infinitive வடிவங்களும் திரும்பிச் செல்வதையும் மீண்டும் அங்கு குடியிருப்பதையும் குறிக்கின்றன. ‘குடியிரு’ சட்டச் சூழலுக்கேற்ற நிலையான வசிப்பை வெளிப்படுத்துகிறது.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: ஆசாரியன் இறப்பதற்கு முன்
  rationale: עַד என்பதன் நேரடிப் பொருள் ‘வரை’ என்றாலும், இத்தடைக் கட்டளையில் ஆசாரியன் இறக்கும் முன்னரே திரும்புவதை அனுமதிக்கக் கூடாது என்பதே கால வரம்பு. ‘இறப்பதற்கு முன்’ என்பது தமிழில் அந்தத் தடையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: அடைக்கல நகரத்திற்குத் தப்பியோடியவனுக்கான மீட்புத்தொகைத் தடையின் சட்ட வரம்பு
  choice: ஆசாரியன் இறப்பதற்கு முன் நாட்டிற்குத் திரும்பிக் குடியிருக்க அனுமதிக்கும் மீட்புத்தொகையை ஏற்கக் கூடாது என்ற வாசிப்பு
  alternative: அடைக்கல நகரத்திற்குத் தப்பிச் செல்வதோடு தொடர்புடைய எந்த மீட்புத்தொகையையும் ஏற்கக் கூடாது என்ற வாசிப்பு
  rationale: எபிரெய தொடரமைப்பு சுருக்கமாக இருப்பதால், மீட்புத்தொகை அடைக்கல நகரத்திற்குத் தப்பிச் செல்வதோடு தொடர்புடையதா அல்லது அங்கிருந்து காலத்துக்கு முன் திரும்புவதோடு தொடர்புடையதா என்பதில் ஓரளவு ambiguity உள்ளது. முதன்மை உரை சட்டச் சூழலின் இயல்பான தொடர்ச்சிப்படி முன்கூட்டிய திரும்புதலை முன்னிறுத்துகிறது; அடிக்குறிப்பு மாற்று புரிதலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான பன்மை ஏவல் வடிவமான ‘வாங்காதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது. ‘அடைக்கல நகரம்’, ‘மீட்புத்தொகை’, ‘குடியிரு’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சட்டச் சூழலைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன.
