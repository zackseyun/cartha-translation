  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: ta
  text: அப்போது உங்களுக்காக நகரங்களை நியமிக்க வேண்டும்[a]; அவை உங்களுக்கு அடைக்கல நகரங்களாக இருக்கும். தவறுதலாக ஒருவரைக் கொன்றவன்[b] அங்கே ஓடிச் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுக்காக நகரங்களைத் தேர்ந்தெடுத்து ஒதுக்க வேண்டும்’ அல்லது ‘ஏற்படுத்த வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘தவறுதலாக ஓர் உயிரை அடித்துக் கொன்றவன்’; அதாவது திட்டமிட்டு கொலை செய்தவன் அல்ல, நோக்கமின்றி ஒருவரின் மரணத்திற்குக் காரணமானவன்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: தேர்ந்தெடுத்து ஒதுக்க வேண்டும்
  rationale: இங்குள்ள ஹிஃபில் வடிவம் குறிப்பிட்ட நகரங்களைத் தேர்ந்தெடுத்து ஒரு நோக்கத்திற்காக நியமிப்பதைக் குறிக்கிறது. ‘தேர்ந்தெடுத்து ஒதுக்க’ என்பது சட்டச் சூழலையும் செயற்பாட்டின் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: நகரங்களை ... அடைக்கல நகரங்களாக
  rationale: எபிரெய மூலத்தில் உள்ள ‘நகரங்கள் ... அடைக்கல நகரங்கள்’ என்ற மீளுருவாக்கம் சட்டத் தெளிவுக்காகத் தமிழிலும் பாதுகாக்கப்படுகிறது.
- source_word: מִקְלָט
  choice: அடைக்கலம்
  rationale: இச்சட்டச் சூழலில் தப்பிச் செல்பவருக்குப் பாதுகாப்பளிக்கும் இடத்தைக் குறிக்கிறது; ‘அடைக்கலம்’ என்பது துல்லியமும் இயல்பும் கொண்ட நவீனத் தமிழ் சொல்.
- source_word: וְנָס שָׁמָּה
  choice: அங்கே தப்பியோட வேண்டும்
  rationale: சட்ட வழிமுறையின் தொடர்ச்சியில் இவ்வினை எதிர்கால அல்லது விதிப்பொருள் கொண்டது. ‘வேண்டும்’ என்பது அந்த வழிமுறைத் தன்மையைத் தெளிவாகக் காட்டுகிறது; வெறும் அனுமதி என்று மட்டும் குறுக்கிவிடவில்லை.
- source_word: רֹצֵחַ
  choice: கொன்றவன்
  rationale: רצח சில இடங்களில் கொலை அல்லது கொலையாளியைக் குறித்தாலும், இங்கு ‘தவறுதலாக’ என்ற தகுதி திட்டமிட்ட கொலையை விலக்குகிறது. ‘கொன்றவன்’ செயலைக் கூறுகிறது; திட்டமிட்ட கொலைக்குரிய குற்றநோக்கைச் சேர்ப்பதில்லை.
- source_word: מַכֵּה נֶפֶשׁ
  choice: ஒருவரைக் கொன்றவன்
  rationale: சொல்லுக்கு சொல் ‘ஓர் உயிரை/ஒருவரை அடிப்பவன்’ என்றாலும், இச்சூழலில் தாக்குதலின் விளைவு மரணம் என்பது தெளிவு. ‘ஒருவரைக் கொன்றவன்’ நவீனத் தமிழில் நேரடியாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: இங்கு נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ அல்ல, கொல்லப்பட்ட மனித நபரைக் குறிக்கிறது.
- source_word: בִּשְׁגָגָה
  choice: தவறுதலாக
  rationale: இந்தச் சொல் நோக்கமின்மை அல்லது அறியாமையில் நடந்த செயலைக் குறிக்கிறது. ‘தவறுதலாக’ என்பது திட்டமிட்ட கொலையிலிருந்து இதை வேறுபடுத்தும் சட்டப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கொன்றவரின் சட்ட வகைப்பாடு
  choice: ‘கொலைகாரன்’ என்பதற்குப் பதிலாக ‘தவறுதலாக ஒருவரைக் கொன்றவன்’
  alternative: ‘கொலைகாரன்’ அல்லது ‘கொலையாளி’
  rationale: ‘தவறுதலாக’ என்ற மூலமொழித் தகுதியை முன்னிறுத்தி, வசனம் கூறாத திட்டமிட்ட குற்றநோக்கையோ கூடுதல் ஒழுக்கத் தீர்ப்பையோ மொழிபெயர்ப்பு சேர்க்காமல் இருக்கிறது. அதேவேளையில் ஒருவர் இறந்திருக்கிறார் என்ற கடுமையான உண்மையையும் மென்மையாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘நகரங்கள் ... அடைக்கல நகரங்கள்’ என்ற மூலத்தின் மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது; ‘கொலைகாரன்’ என்ற சொல் நோக்கமுள்ள கொலையை உணர்த்தக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
