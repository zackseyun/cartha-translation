translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ கட்டளை மற்றும் சட்டக் கடமையை இயல்பாகத் தெரிவிக்கிறது; ‘அடைக்கல நகரங்கள்’ என்பது தொழில்நுட்பப் பொருளைத் தெளிவாக வைத்திருக்கிறது.
