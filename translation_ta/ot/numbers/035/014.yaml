language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பாலுள்ள[b] அந்த நகரங்களில் மூன்றை நீங்கள் ஒதுக்க வேண்டும்[a]; கானான் நாட்டிலுள்ள அந்த நகரங்களில் மூன்றை ஒதுக்க வேண்டும். அவை அடைக்கல நகரங்களாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொடுக்க வேண்டும்.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கொடு’; இங்கு இந்த நோக்கத்திற்காக நகரங்களை நியமிப்பது அல்லது ஒதுக்குவது என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யோர்தானின் மறுபக்கத்தில்’ அல்லது ‘யோர்தானுக்கு அக்கரையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: ஒதுக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்பதாகும். ஆனால் இச்சட்டச் சூழலில், குறிப்பிட்ட நோக்கத்திற்காக நகரங்களை நியமித்து ஒதுக்குவதை இது குறிக்கிறது; ‘ஒதுக்க வேண்டும்’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: இந்தத் தொடர் யோர்தானின் மறுபக்கத்தைக் குறிக்கிறது. ‘யோர்தானுக்கு அப்பால்’ என்பது எளிமையாகவும் சுருக்கமாகவும் இருந்து, எதிலிருந்து பார்க்கப்படுகிறது என்பதை மூலத்தைவிடத் திட்டவட்டமாக்காமல் விடுகிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: ‘நாடு’ என்பதையும் உள்ளடக்கிய எபிரெயத் தொடரின் நிலப்பரப்பு சார்ந்த வலியுறுத்தலை இது காக்கிறது.
- source_word: עָרֵי מִקְלָט
  choice: அடைக்கல நகரங்கள்
  rationale: தற்செயலாக ஒருவரைக் கொன்றவருக்குப் பாதுகாப்பளிக்க ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கும் சட்டச் சொல்லை இது தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: அந்த நகரங்களில் மூன்று ... அந்த நகரங்களில் மூன்று
  rationale: எபிரெயத்தில் ‘நகரங்கள்’ என்பது வரையறுத்துச் சொல்லப்பட்டுள்ளது. ஆகவே, ஏற்கெனவே உரையாடலில் உள்ள நகரங்களின் தொகுதியிலிருந்து மூன்றைத் தேர்ந்தெடுப்பது என்பதை ‘அந்த நகரங்களில் மூன்று’ தெளிவாக்குகிறது.
- source_word: תִּהְיֶינָה
  choice: அவை ... ஆக இருக்கும்
  rationale: ஒதுக்கப்படும் ஆறு நகரங்களின் விளைவான நிலை அல்லது பணியை எபிரெய எதிர்கால வினை தெரிவிக்கிறது; ‘ஆக இருக்கும்’ அதை நேரடியாகக் காக்கிறது.
