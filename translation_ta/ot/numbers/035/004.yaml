base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: ta
  text: நீங்கள் லேவியர்களுக்குக் கொடுக்கும் நகரங்களின் மேய்ச்சல் நிலங்கள்[a], நகரத்தின் மதிலிலிருந்து[b] வெளிநோக்கி எல்லாப் பக்கங்களிலும் ஆயிரம் முழம் வரை இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொதுப் பயன்பாட்டு நிலங்கள்’ அல்லது ‘திறந்த வெளி நிலங்கள்’; இவை நகரங்களைச் சுற்றியுள்ள நிலங்களைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘நகரத்தின் மதிலிலிருந்து’; சிலர் இதைப் பொதுவாக ‘நகரத்தின் எல்லையிலிருந்து’ என்று புரிந்துகொள்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: மேய்ச்சல் நிலங்கள்
  rationale: நகரங்களைச் சுற்றிப் பிரித்து வைக்கப்பட்ட திறந்த நிலத்தைக் குறிக்கிறது; எண்ணாகமம் 35-இன் சூழலில் கால்நடை மேய்க்கும் பயன்பாடு முன்னிலைப்படுவதால் இச்சொல் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பதன் வழக்கமான பொருளைத் தருவதுடன், சுற்றியுள்ள வசனங்களில் வரும் லேவிய நகரங்களோடும் சொல்லாட்சியை ஒருமைப்படுத்துகிறது.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: நீங்கள் ... கொடுக்கும்
  rationale: உறவுத்தொடரின் பொருளையும் சூழலிலுள்ள கட்டளை சார்ந்த எதிர்கால நோக்கையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: நகரங்களையும் அவற்றைச் சுற்றிய நிலங்களையும் பெறுபவர்களை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: מִקִּיר הָעִיר
  choice: நகரத்தின் மதிலிலிருந்து
  rationale: קִיר என்பதன் நேரடியான பொருள் ‘மதில்’; எங்கிருந்து அளக்க வேண்டும் என்பதைக் கூறும் எபிரெய அமைப்பையும் காக்கிறது.
- source_word: וָחוּצָה
  choice: வெளிப்புறமாக
  rationale: நகருக்கு வெளியே நோக்கிய திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶלֶף אַמָּה
  choice: ஆயிரம் முழம்
  rationale: பழங்கால அளவான אַמָּה-வை தமிழ் வேதாகம வழக்கில் புரிந்துகொள்ளத்தக்க ‘முழம்’ எனப் பாதுகாக்கிறது; நவீன அலகாக மாற்றவில்லை.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அளவு நகரத்தின் எல்லாப் பக்கங்களிலும் பொருந்துவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
