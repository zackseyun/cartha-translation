translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொற்றொடருக்கு நெருக்கமாக ‘இருக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது; ‘நீள வேண்டும்’ போன்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது. மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
