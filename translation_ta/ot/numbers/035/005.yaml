translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சட்ட அறிவுறுத்தலின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே மாதிரியான நான்கு திசை அமைப்பும் ‘இரண்டாயிரம் முழம்’ என்ற மீளுரையும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் கருத்துடன் பொருந்தாத இடங்களில் இருந்ததால், ‘கடல்/மேற்கு’ குறிப்பு மேற்குப் பக்கத்திற்கும் ‘மேய்ச்சல்/பொது/திறந்த நிலம்’ குறிப்பு அதற்குரிய பெயர்ச்சொல்லிற்கும் இணைக்கப்பட்டுள்ளன.
