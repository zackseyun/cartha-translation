base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: ta
  text: 'நகருக்கு வெளியே நீங்கள் அளவிட வேண்டும்: கிழக்குப் பக்கம் இரண்டாயிரம் முழம்; தெற்குப் பக்கம் இரண்டாயிரம் முழம்; மேற்குப் பக்கம்[a] இரண்டாயிரம் முழம்; வடக்குப் பக்கம் இரண்டாயிரம் முழம்; நகரம் நடுவில் இருக்க, இது அவர்களுக்கு நகரங்களின் மேய்ச்சல் நிலங்களாக[b] இருக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக ‘கடல்’; மத்தியதரைக் கடல் இருக்கும் திசையை அடிப்படையாகக் கொண்ட வழக்கில் இது மேற்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நகரங்களின் பொது நிலங்களாக’ அல்லது ‘நகரங்களைச் சுற்றியுள்ள திறந்த நிலங்களாக’; எபிரெயச் சொல் நகரைச் சுற்றிய நிலத்தைக் குறிக்கிறது, அது பெரும்பாலும் மேய்ச்சலுக்குப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: நீங்கள் அளவிட வேண்டும்
  rationale: சட்ட அறிவுறுத்தலுக்குரிய கட்டளைத் தன்மையையும், நிலத்தை அளக்கும் நேரடியான செயலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִחוּץ לָעִיר
  choice: நகருக்கு வெளியே
  rationale: அளவீடு நகர எல்லைக்கு வெளியிலுள்ள பகுதியில் செய்யப்படுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: פְּאַת
  choice: பக்கம்
  rationale: நான்கு திசைகளிலும் உள்ள அளவிடப்பட்ட பரப்பின் ஒவ்வொரு பக்கத்தையும் இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: கிழக்கு / தெற்கு / மேற்கு / வடக்கு
  rationale: திசைப் பெயர்களைத் தெளிவான நவீன தமிழில் தருகிறது; יָם என்பதன் சொற்பொருள் ‘கடல்’ என்றாலும் இங்கு அது மேற்குத் திசையைக் குறிக்கும் எபிரெய வழக்கு.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: இரண்டாயிரம் முழம்
  rationale: மூலத்தின் எண்ணிக்கையையும் பண்டைய அளவலகையும் மாற்றாமல் பாதுகாக்கிறது; ‘முழம்’ என்பது cubit-க்கு வழக்கமான தமிழ் இணைச்சொல்.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: நகரம் நடுவில் இருக்க வேண்டும்
  rationale: அளவிடப்பட்ட நான்கு பக்கங்களின் நடுவில் நகரம் அமையும் இடவமைப்பை நேரடியாகத் தெரிவிக்கிறது.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: இது அவர்களுக்கு ... இருக்கும்
  rationale: உரிமையா பயன்பாடா என்பதை அளவுக்கு மீறித் தீர்மானிக்காமல், சட்டரீதியான ஒதுக்கீட்டின் பொதுவான தன்மையைப் பாதுகாக்கிறது.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: நகரங்களின் மேய்ச்சல் நிலங்கள்
  rationale: நகரங்களை ஒட்டிய திறந்த நிலத்தையும் அதன் வழக்கமான மேய்ச்சல் பயன்பாட்டையும் வாசகர்களுக்குப் புரியும் வகையில் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
