    issue: “பேசியதாவது” compresses the distinct Hebrew elements “spoke … saying.”
    rationale: While not materially wrong, “பேசி, இவ்வாறு கூறினார்:” more transparently represents the speech-introduction formula while remaining idiomatic Tamil.
