  terminology: Use “யாவே” for יהוה, in accordance with the supplied English POB rendering “Yahweh” and its stated naming policy. “மோசே” is the established Tamil form. The footnote should identify the Hebrew form and note the traditional title rendering without presenting “யெகோவா” as the text’s preferred form.
