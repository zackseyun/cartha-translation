base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசி, இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); ‘யாவே’ என வழங்கப்படுகிறது; மரபாக ‘கர்த்தர்’ என மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரெய வடிவத்தையும் மரபான பட்டப்பெயர் வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்வினை வடிவம் புதிய கதைநிகழ்வை அறிமுகப்படுத்துகிறது. அதைத் தொடரும் לֵאמֹר என்பதிலிருந்து வேறுபாட்டைக் காத்து, வழக்கமான தெய்வீக உரை அறிமுகச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: אֶל
  choice: -ிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழ் வேற்றுமை வடிவில் தருகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: பேசியதாவது
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்தும் எபிரெய சொற்றொடரின் செயல்பாட்டை இயல்பான தமிழில் காட்டுகிறது; தனியாக ‘சொல்லி’ என மொழிபெயர்ப்பதால் ஏற்படும் செயற்கையான மறுபடியுரைத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் நேரடியாக உள்ளது. எனவே அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்கப்பட்டுள்ளது. எபிரெய உயிரெழுத்தாக்கம் உறுதியாக இல்லாததால் மாற்று வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ். எபிரெய உரை அறிமுகச் சூத்திரத்தை சொற்சொல்லாகக் கடினப்படுத்தாமல், ‘பேசியதாவது:’ எனத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
