  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: ta
  text: இவை உங்களுக்கு, தலைமுறைதோறும் உங்கள் எல்லாக் குடியிருப்புகளிலும், நீதிநியாயச் சட்டமாக இருக்க வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிநியாய நியமமாக” அல்லது “சட்ட நியமமாக.” எபிரேயச் சொற்றொடர் இயற்றப்பட்ட நியமத்தையும் நீதித்தீர்ப்பு அல்லது நீதித்துறை நடைமுறையையும் குறிக்கும் சொற்களை இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் குடியேற்றங்கள் அனைத்திலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: இருக்க வேண்டும்
  rationale: சட்டப் பின்னணியில் வருங்காலத்திற்குரிய கட்டுப்பாட்டை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֵלֶּה
  choice: இவை
  rationale: முந்தைய சட்ட விதிகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயரை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்கான
  rationale: இஸ்ரவேலருக்குப் பொருந்தும் சட்ட ஏற்பாடு என்ற தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: நீதி விசாரணைச் சட்டமாக
  rationale: חֻקָּה என்பதன் இயற்றப்பட்ட சட்டம் என்ற பொருளையும், מִשְׁפָּט என்பதன் நீதித்துறைத் தீர்ப்பு அல்லது விசாரணை நடைமுறை என்ற பொருளையும் இணைத்துக் காக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதற்கும் தொடர்ந்து பொருந்துவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: உங்கள் குடியிருப்புகள் அனைத்திலும்
  rationale: வசிக்கும் இடங்கள் அல்லது குடியேற்றங்கள் அனைத்தையும் குறிக்கும் எபிரேய இடவியல் சொல்லாட்சியை நெருக்கமாகப் பிரதிபலிக்கிறது.
