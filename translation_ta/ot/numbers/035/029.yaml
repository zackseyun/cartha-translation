translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத்தின் கண்ணியமான தொனியைத் தக்கவைத்துள்ள மொழிபெயர்ப்பு. ‘நீதி விசாரணைச் சட்டம்’ என்ற சொற்றொடர் மூலத்தின் இரு சட்டக் கூறுகளையும் மிகையாக விளக்கித் தீர்க்காமல் வெளிப்படுத்துகிறது.
