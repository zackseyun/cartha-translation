review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the demonstrative plural, enduring application across generations, and universal locative scope. However, “நீதி விசாரணை” specifically denotes an investigation/inquiry, a sense not required by מִשְׁפָּט here; the Hebrew legal collocation refers more broadly to judgment/judicial law or procedure.
  naturalness: The sentence is generally clear and suitably formal. Replacing “நீதி விசாரணைச் சட்டம்” with “நீதிநியாயச் சட்டம்” is more idiomatic for a general judicial statute and avoids suggesting a procedural investigation.
  terminology: “நீதிநியாயச் சட்டம்” preserves the paired legal force of חֻקַּת מִשְׁפָּט without narrowing מִשְׁפָּט to an inquiry or a single verdict. “குடியிருப்புகள்” appropriately renders the residential locations denoted by מוֹשְׁבֹת.
  issues:
  - severity: medium
    issue: “நீதி விசாரணைச் சட்டமாக” narrows מִשְׁפָּט.
    rationale: “விசாரணை” commonly means investigation or inquiry. In this formula, מִשְׁפָּט has the broader juridical sense of judgment, legal decision, or judicial procedure; the source does not specify an investigation.
  revised_text: இவை உங்களுக்கு, தலைமுறைதோறும் உங்கள் எல்லாக் குடியிருப்புகளிலும், நீதிநியாயச் சட்டமாக இருக்க வேண்டும்.[a][b]
