revisions:
- from: இவை தலைமுறைதோறும் உங்கள் குடியிருப்புகள் அனைத்திலும் உங்களுக்கான நீதி விசாரணைச் சட்டமாக இருக்க வேண்டும்.[a][b]
  to: இவை உங்களுக்கு, தலைமுறைதோறும் உங்கள் எல்லாக் குடியிருப்புகளிலும், நீதிநியாயச் சட்டமாக இருக்க வேண்டும்.[a][b]
  rationale: The revision retains the legal and enduring scope of the verse while replacing an overly specific reference to an inquiry with a broader modern Tamil expression for a judicial statute. Footnote a is correspondingly adjusted to describe the Hebrew ambiguity without privileging investigation as its meaning.
