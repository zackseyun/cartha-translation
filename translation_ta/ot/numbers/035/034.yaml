  rationale: இலக்கண வடிவம் சொல்லளவில் ‘மகன்கள்’ என்றாலும், இங்கு அந்த மரபுச் சொற்றொடர் இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. ‘மக்கள்’ என்பது நவீன தமிழில் இயல்பானதும் சூழற்பொருளுக்கு துல்லியமானதும் ஆகும்.
