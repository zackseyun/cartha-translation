base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: ta
  text: நீங்கள் குடியிருக்கும் நாட்டைத் தீட்டுப்படுத்தாதீர்கள்; அதன் நடுவில் நான் குடியிருக்கிறேன். ஏனெனில், யாவேவாகிய நான் இஸ்ரவேல் மக்களின் நடுவில் குடியிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘இஸ்ரவேலின் மகன்களின் நடுவில்.’ அல்லது, இயல்பான நடையில், ‘இஸ்ரவேலரிடையே.’
    reason: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל என்ற மரபுச் சொற்றொடரின் சொற்சொல் வடிவத்தையும் இயல்பான மாற்று வடிவத்தையும் காட்டுகிறது.
lexical_decisions:
