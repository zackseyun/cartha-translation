translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘குடியிருக்கும்/குடியிருக்கிறேன்’ என்ற மீளுரைத்தல் மூலத்தின் ישב/שכן வேறுபாட்டை முழுமையாக ஒன்றாக்காமல், தமிழில் இயல்பான ஒத்திசைவைக் கொடுக்கிறது. மூலத்தின் இரண்டு காரணத் துணைவாக்கியங்களும் தெளிவுக்காக தனித்த வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன.
