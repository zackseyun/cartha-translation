- source_word: שֹׁכֵן
  choice: குடியிருக்கிறேன்
  rationale: שכן தேவனுடைய உடனிருப்பைக் குறிக்கும் இறையியல் எதிரொலியுடன் குடியிருத்தலைக் குறிக்கிறது; தொழில்நுட்பமான கூடாரச் சொல்லைச் சேர்க்காமல் அதைப் பாதுகாக்கிறது.
