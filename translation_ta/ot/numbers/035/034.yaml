  choice: தீட்டுப்படுத்தாதீர்கள்
  rationale: பீயேல் வடிவிலுள்ள טמא சடங்கு மற்றும் ஒழுக்க அசுத்தம் ஆகிய இரண்டையும் குறிக்கக்கூடும். சூழலிலுள்ள இரத்தப்பழியையும் தூய்மை சார்ந்த வலிமையையும் ‘தீட்டுப்படுத்து’ காக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு אֶרֶץ முழு பூமியைக் குறிக்காமல், இஸ்ரவேலர் குடியிருக்கும் குறிப்பிட்ட நாட்டைக் குறிக்கிறது.
- source_word: יֹשְׁבִים בָּהּ
  choice: நீங்கள் குடியிருக்கும்
