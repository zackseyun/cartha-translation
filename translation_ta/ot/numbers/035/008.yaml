  to: இஸ்ரவேல் மக்களின் நிலவுடைமையிலிருந்து நீங்கள் கொடுக்கும் நகரங்களில், அதிகப் பங்கு பெற்றவர்களிடமிருந்து அதிகமாகக் கொடுங்கள்[a]; குறைந்த பங்கு பெற்றவர்களிடமிருந்து குறைவாகக் கொடுங்கள். ஒவ்வொருவரும் தாங்கள் பெற்றுக்கொள்ளும் நிலப்பங்கின் அளவுக்கு ஏற்ப, தங்கள் நகரங்களில் சிலவற்றை லேவியர்களுக்குக் கொடுக்க வேண்டும்.
  rationale: The revision preserves the Hebrew's concise contrast between larger and smaller allotments while making the legal instruction to give a greater or lesser number of cities explicit in idiomatic Tamil. It also distinguishes landed possession from inherited allotment and retains the source's distributive formulation without imposing a denominational interpretation.
