base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் நிலவுடைமையிலிருந்து நீங்கள் கொடுக்கும் நகரங்களில், அதிகப் பங்கு பெற்றவர்களிடமிருந்து அதிகமாகக் கொடுங்கள்[a]; குறைந்த பங்கு பெற்றவர்களிடமிருந்து குறைவாகக் கொடுங்கள். ஒவ்வொருவரும் தாங்கள் பெற்றுக்கொள்ளும் நிலப்பங்கின் அளவுக்கு ஏற்ப, தங்கள் நகரங்களில் சிலவற்றை லேவியர்களுக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதிகமானவர்களிடமிருந்து அதிகப்படுத்துங்கள்; குறைவானவர்களிடமிருந்து குறையுங்கள்” என்று உள்ளது. பெரிய மற்றும் சிறிய நிலப்பங்குகளுக்கு ஏற்ப நகரங்களின் எண்ணிக்கையை விகிதாசாரமாக நிர்ணயிக்க வேண்டும் என்பதே சூழலின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: பட்டணங்கள்
  rationale: עִיר என்பது நகரம் அல்லது பட்டணம் எனப் பொருள்படும்; லேவியர்களுக்கான குடியிருப்புகளைக் குறிக்கும் இந்தச் சட்டச் சூழலில் “பட்டணங்கள்” இயல்பானதும் மரபாகப் புரிந்துகொள்ளப்படுவதுமாகும்.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் உடைமை
  rationale: אֲחֻזָּה மரபுரிமையாகக் கிடைத்த நிலவுடைமையைக் குறிக்கிறது. “உடைமை” என்பது அச்சொல்லின் நிலம் சார்ந்த உடைமை உணர்வைச் சூழலுடன் வெளிப்படுத்துகிறது; בְּנֵי יִשְׂרָאֵל என்பதைக் கூட்டுமக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழில் “இஸ்ரவேல் மக்கள்” என வழங்குகிறது.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: அதிகப் பங்கு பெற்றவர்களிடமிருந்து அதிகமாகவும், குறைந்த பங்கு பெற்றவர்களிடமிருந்து குறைவாகவும்
  rationale: எபிரெயத்தில் உள்ள ‘அதிகம்/குறைவு’ என்ற எதிரிணையைப் பாதுகாத்து, முன் கூறப்பட்ட கோத்திர நிலப்பங்குகளே அதன் மறைமுகக் குறிப்பு என்பதைத் தமிழில் தெளிவாக்குகிறது. “கோத்திரங்கள்” என்று நேரடியாகச் சேர்க்காமல் மூலத்தின் சுருக்கத்தன்மையும் காக்கப்படுகிறது.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ
  choice: ஒவ்வொருவரும் தாங்கள் பெற்றுக்கொள்ளும் உரிமைப்பங்கின் அளவுக்கு ஏற்ப
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் ஒவ்வொரு தரப்பையும் தனித்தனியாகக் குறிக்கிறது; כְּפִי என்பது விகிதம் அல்லது அளவுக்கு ஏற்ப என்பதைக் குறிக்கும் மரபுத்தொடர். மரியாதைப் பன்மையான “தாங்கள்” அடுத்துள்ள எபிரெயப் பன்மை வினையுடனும் இயல்பாக இணைகிறது.
- source_word: אֲשֶׁר יִנְחָלוּ
  choice: தாங்கள் பெற்றுக்கொள்ளும்
  rationale: יִנְחָלוּ பன்மை வடிவம் என்பதால் அதை ஒருமையாக மாற்றாமல், பகிர்ந்தளிப்பவர்களைத் தொகுப்பாகக் குறிக்கும் பன்மை உணர்வு தமிழில் காக்கப்படுகிறது.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: தங்கள் பட்டணங்களில் சிலவற்றை லேவியர்களுக்குக் கொடுக்க வேண்டும்
  rationale: מִן என்பதன் பகுதி சார்ந்த பொருளை “சிலவற்றை” வெளிப்படுத்துகிறது; சட்டக் கட்டளையின் வலிமை “கொடுக்க வேண்டும்” என்பதில் இயல்பாகத் தெரிவிக்கப்படுகிறது.
