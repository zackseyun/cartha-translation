- from: 'இஸ்ரவேல் மக்களின் உடைமையிலிருந்து நீங்கள் கொடுக்கும் பட்டணங்களில், அதிகப் பங்கு பெற்றவர்களிடமிருந்து அதிகமாகவும்[a], குறைந்த பங்கு பெற்றவர்களிடமிருந்து குறைவாகவும் கொடுக்க வேண்டும். ஒவ்வொருவரும் தாங்கள் பெற்றுக்கொள்ளும் உரிமைப்பங்கின் அளவுக்கு ஏற்ப, தங்கள் பட்டணங்களில் சிலவற்றை லேவியர்களுக்குக் கொடுக்க வேண்டும்.


