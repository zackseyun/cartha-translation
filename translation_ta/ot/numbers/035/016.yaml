source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: ta
  text: ஆனால், அவன் இரும்புக் கருவியால் ஒருவனை அடித்து, அவன் அடித்த நபர் இறந்தால்,[a] அவன் கொலைகாரன்; கொலைகாரன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரும்புச் சாதனத்தால்’ அல்லது ‘இரும்புப் பொருளால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரந்த பொருளுடையது; அது குறிப்பிட்ட ஓர் ஆயுதத்தின் பெயரைச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ...னால்
  rationale: முந்தைய வழக்கிலிருந்து மாறுபடும் நிபந்தனைச் சட்டத்தை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: בִּכְלִי בַרְזֶל
  choice: இரும்புக் கருவியால்
  rationale: כְּלִי என்பது பாத்திரம், பொருள், கருவி அல்லது ஆயுதம் எனப் பரந்த பொருளுடையது; குறிப்பிட்ட ஆயுதம் என்று மிகைப்படுத்தாமல், இச்சூழலில் பயன்படுத்தப்படும் இரும்புச் சாதனத்தை ‘கருவி’ தெரிவிக்கிறது.
- source_word: הִכָּהוּ
  choice: ஒருவனை அடித்து
  rationale: נכה என்பதன் வன்முறைச் செயலை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது; ஆண்பால் மூன்றாம் நபர் சுட்டுப்பெயரின் குறிப்பையும் ‘ஒருவனை’ தக்கவைக்கிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனால்
  rationale: அடிக்குப் பின் நிகழும் மரணத்தை நிபந்தனைச் சட்டத்தின் தமிழ் அமைப்புக்குள் இயல்பாகத் தருகிறது; எபிரெய உரைக்கு அப்பாற்பட்ட நோக்கத்தையோ காரணவிளக்கத்தையோ சேர்க்கவில்லை.
- source_word: רֹצֵחַ הוּא
  choice: அடித்தவன் கொலைகாரன்
  rationale: சுட்டுப்பெயர் குழப்பத்தைத் தவிர்த்து, தாக்கியவனையே சட்டரீதியாகக் கொலைகாரன் என்று வகைப்படுத்துகிறது.
- source_word: מוֹת יוּמַת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுப்பெயர் வினையெச்சமும் செயல்பாட்டு வினையும் சேர்ந்துள்ள எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதும் சட்டக் கட்டாயத்தை ‘வேண்டும்’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: הָרֹצֵחַ
  choice: அந்தக் கொலைகாரன்
  rationale: ஏற்கெனவே சட்டரீதியாக அடையாளப்படுத்தப்பட்ட அதே நபரைத் தெளிவாக மீண்டும் சுட்டுகிறது.
theological_decisions:
- issue: இவ்வசனத்தில் רֹצֵחַ என்பதன் சட்ட வகைப்பாடு
  choice: கொலைகாரன்
  alternative: ஆளைக் கொன்றவன்
  rationale: இந்தச் சட்டச் சூழல் குற்றமற்ற தற்செயல் மரணத்திலிருந்து குற்றத்துக்குரிய கொலையை வேறுபடுத்தி மரணதண்டனை விதிக்கிறது. ஆகவே ‘கொலைகாரன்’ என்பது உரையின் சட்ட மற்றும் அறநெறி வலிமையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘அவன்’ என்ற சுட்டுப்பெயர் தாக்கியவனையும் இறந்தவனையும் குறிக்கக்கூடிய குழப்பத்தைத் தவிர்க்க ‘ஒருவனை’ மற்றும் ‘அடித்தவன்’ எனத் தெளிவுபடுத்தப்பட்டது.
