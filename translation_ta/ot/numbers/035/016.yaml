    issue: Ambiguous antecedent of the second “அவன்”
    rationale: In Tamil, the second “அவன்” after “ஒருவனை அடித்து” may refer back to the grammatical subject, the striker. The source requires that the struck person is the one who died. An explicit noun phrase resolves this without altering the legal meaning.
