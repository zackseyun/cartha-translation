base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: ta
  text: இரத்தத்திற்குப் பழிவாங்குபவன் அவனை அவனுடைய அடைக்கல நகரத்தின் எல்லைக்கு வெளியே கண்டுபிடித்து, இரத்தத்திற்குப் பழிவாங்குபவன் ஒருவரைக் கொன்றவனைக் கொன்றால், அவனுக்கு இரத்தக்குற்றம் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுக்கு இரத்தம் இல்லை”; அதாவது, இந்தக் கொலைக்காக இரத்தத்திற்குப் பழிவாங்குபவனுக்கு இரத்தக்குற்றம் இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: இச்சட்டச் சூழலில் இரத்தக் கொலைக்குப் பழிவாங்க அதிகாரம் பெற்ற நபரைக் குறிக்கிறது. உறவுமுறையை மூலவசனம் இங்கே வெளிப்படையாகக் கூறாததால், ‘உறவினன்’ என்பதைச் சேர்க்காமல் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: מִחוּץ לִגְבוּל
  choice: எல்லைக்கு வெளியே
  rationale: அடைக்கல நகரம் அளிக்கும் பாதுகாப்பின் நிலவியல் மற்றும் சட்ட வரம்பு இரண்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִיר מִקְלָטוֹ
  choice: அவனுடைய அடைக்கல நகரம்
  rationale: எண்ணாகமச் சட்டத்தில் உள்ள நிறுவப்பட்ட பாதுகாப்பிடத்தைக் குறிக்கும் சொல்லுக்கு தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וְרָצַח
  choice: கொன்றால்
  rationale: அடுத்து வரும் கூற்று இச்செயலுக்காக இரத்தப்பழி இல்லை என்கிறது; எனவே குற்றத்தைக் கட்டாயமாக உணர்த்தும் ‘கொலைசெய்தால்’ போன்ற சொல்லுக்கு மாறாக நடுநிலையான வினை தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָרֹצֵחַ
  choice: கொலையாளி
  rationale: அடைக்கல நகரச் சட்டத்தின் சூழலில், ஒருவரைக் கொன்றுவிட்டு அடைக்கலம் புகுந்த நபரைக் குறிக்கிறது; திட்டமிட்ட கொலை என்ற கூடுதல் கருத்தைத் திணிக்காமல், நவீன வாசகருக்குப் புரியும் பெயராக உள்ளது.
- source_word: אֵין לוֹ דָּם
  choice: அவன்மேல் இரத்தப்பழி இல்லை
  rationale: எபிரெயச் சட்ட மரபுத்தொடரான ‘அவனுக்கு இரத்தம் இல்லை’ என்பதன் பொருளைத் தக்கவைத்து, பழிவாங்குகிறவன் இந்தக் கொலையால் இரத்தக்குற்றம் சுமப்பதில்லை என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: அனுமதிக்கப்பட்ட கொலைச் சூழலில் רצח என்பதன் அறநெறி/சட்ட வலிமை
  choice: குற்றவியல் தீர்ப்பை முன்கூட்டியே திணிக்காத ‘கொன்றால்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கொலைசெய்தால்’ அல்லது ‘படுகொலை செய்தால்’ என்று மொழிபெயர்த்தல்
  rationale: பழிவாங்குகிறவன்மேல் இரத்தப்பழி இல்லை என்று வசனமே கூறுவதால், குற்றத்தன்மையை இயல்பாகக் குறிக்கும் சொல்லைப் பயன்படுத்துவது எபிரெயச் சட்டக் கூற்றில் இல்லாத முரண்பாட்டை உருவாக்கும்.
- issue: אֵין לוֹ דָּם என்பதில் ‘அவன்’ யாரைக் குறிக்கிறது
  choice: அருகிலுள்ள செயப்பொருளான இரத்தப்பழி வாங்குகிறவனையே குறிக்கும்படி ‘அவன்மேல் இரத்தப்பழி இல்லை’ என்று வழங்குதல்
  alternative: கொலையாளியைக் குறிக்கும் தெளிவற்ற பொதுக் கூற்றாக வைத்தல்
  rationale: சட்டச் சூழலும் வாக்கிய அமைப்பும், கொன்ற இரத்தப்பழி வாங்குகிறவன் இந்தச் செயலுக்காக இரத்தக்குற்றம் சுமப்பதில்லை என்பதையே ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டத் தன்மையையும் கண்ணியமான வேதாகம நடையையும் காக்கும் வகையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய நிபந்தனை அமைப்பு தமிழில் இயல்பாக ‘கண்டுபிடித்து ... கொன்றால்’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அதன் விளக்கத்துக்குரிய இறுதிக் கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
