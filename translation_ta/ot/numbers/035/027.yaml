revisions:
- from: இரத்தப்பழி வாங்குகிறவன் அவனை அவனுடைய அடைக்கல நகரத்தின் எல்லைக்கு வெளியே கண்டுபிடித்து, அந்தக் கொலையாளியைக் கொன்றால், அவன்மேல் இரத்தப்பழி இல்லை.[a]
  to: இரத்தத்திற்குப் பழிவாங்குபவன் அவனை அவனுடைய அடைக்கல நகரத்தின் எல்லைக்கு வெளியே கண்டுபிடித்து, இரத்தத்திற்குப் பழிவாங்குபவன் ஒருவரைக் கொன்றவனைக் கொன்றால், அவனுக்கு இரத்தக்குற்றம் இல்லை.[a]
  rationale: The revision retains the source’s legal sequence and neutral rendering of the killing, while distinguishing the blood avenger’s role from the legal conclusion that he bears no bloodguilt. It also avoids implying that the protected killer was necessarily guilty of intentional murder.
