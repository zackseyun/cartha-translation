source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: ta
  text: 'எரிகோவுக்கு அருகே யோர்தான் நதியோரத்திலிருந்த மோவாபின் சமவெளிகளில் யாவே மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר குறிக்கும் புதிய உரைநிகழ்வை இயல்பான நவீனத் தமிழில் தருகிறது; தொடர்ந்து வரும் לֵאמֹר அறிமுகப்படுத்தும் உரைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரை நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עֲרָבוֹת என்பது திறந்த சமவெளி அல்லது புல்வெளிப் பிரதேசத்தைக் குறிக்கிறது; புவியியல் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே யோர்தான் நதியோரத்திலிருந்த
  rationale: עַל இங்கு அருகாமையைக் குறிக்கிறது. யோர்தான் ஒரு நதி என்பதைத் தமிழ் வாசகருக்குத் தெளிவாக்கி, எரிகோவுடன் உள்ள புவியியல் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: எபிரேயத்தில் அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் இச்சொல்லின் செயல்பாட்டைத் தமிழில் முக்காற்புள்ளி இயல்பாக நிறைவேற்றுகிறது; தேவையற்ற ‘இவ்வாறு சொல்லி’ என்ற மீளுரையைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல், Yahweh என்பதற்கான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதை வினைமுற்றுடன் இயல்பான, கண்ணியமான உரைநடை. மூலத்தின் தகவல் வரிசை பெரும்பாலும் காக்கப்பட்டாலும், புவியியல் தொடர் தமிழில் தெளிவாக அமையச் சீரமைக்கப்பட்டுள்ளது.
