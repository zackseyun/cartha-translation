revisions:
- from: அல்லது, ஒருவரைக் கொல்லக்கூடிய கல்லைக் கையில் பிடித்து[a] அவனை அடித்ததால் அவன் இறந்துபோனால், அடித்தவன் கொலைகாரன்; அந்தக் கொலைகாரன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  to: அல்லது, ஒருவரைக் கொல்லக்கூடிய கையில் பிடித்திருக்கும் கல்லால் அவனை அடித்து, அவன் இறந்தால், அவன் கொலைகாரன்; அந்தக் கொலைகாரன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  rationale: The revision changes only the connection between the striking and the death, preserving the Hebrew’s sequential conditional structure. It also places the hand-held-stone sense directly with the instrumental phrase, while the footnote retains the literal Hebrew wording and avoids fixing the phrase to a single technical interpretation.
