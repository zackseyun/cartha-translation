    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘கையின் கல்லால்’; அதாவது, கையில் பிடித்திருக்கும் அல்லது கையால் ஆயுதமாகப் பயன்படுத்த ஏற்ற கல்லால்.
