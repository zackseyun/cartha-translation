id: NUM.35.17
reference: Numbers 35:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ta
  text: அல்லது, ஒருவரைக் கொல்லக்கூடிய கையில் பிடித்திருக்கும் கல்லால் அவனை அடித்து, அவன் இறந்தால், அவன் கொலைகாரன்; அந்தக் கொலைகாரன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: அல்லது ...னால்
  rationale: சட்ட வழக்குகளின் தொடரில் மேலும் ஓர் மாற்று நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் ‘அல்லது’ அதன் பிரிநிலைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶבֶן יָד
  choice: கல்லைக் கையில் பிடித்து
  rationale: ‘கையின் கல்’ என்ற எபிரெயச் சொற்றொடர் கையில் பிடித்த அல்லது கையால் ஆயுதமாகப் பயன்படுத்த ஏற்ற கல்லைக் குறிக்கிறது; தெளிவுக்காக இயல்பான தமிழில் செயல்வடிவில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: ஒருவரைக் கொல்லக்கூடிய
  rationale: அந்தக் கல்லின் உயிரைப் பறிக்கும் திறனைச் சுட்டுகிறது; குறிப்பிட்ட பலியானவரை மட்டும் குறிக்காமல் பொதுவான சாத்தியத்தைப் பாதுகாக்கிறது.
- source_word: הִכָּהוּ
  choice: அவனை அடித்ததால்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடி’ என்பதைக் காக்கிறது; மரணம் தனியே கூறப்படுவதால் ‘அடித்துக் கொன்றான்’ என விளைவை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனால்
  rationale: அடித்ததைத் தொடர்ந்து ஏற்பட்ட மரணத்தை இயல்பான தமிழ் சட்ட நிபந்தனை வாக்கிய அமைப்பில் தருகிறது.
- source_word: רֹצֵחַ הוּא
  choice: அடித்தவன் கொலைகாரன்
  rationale: சூழலில் רצח குற்றத்திற்குரிய கொலையை வகைப்படுத்துகிறது; சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க ‘அடித்தவன்’ என்று எழுவாய் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: מוֹת יוּמַת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுப்பெயருடன் வரும் வினை வடிவத்தின் வலியுறுத்தலையும் சட்டக் கட்டாயத்தையும் காக்கிறது.
- source_word: הָרֹצֵחַ
  choice: அந்தக் கொலைகாரன்
  rationale: எபிரெயத்தில் மீண்டும் கூறப்படும் சட்டப்பொருளை தமிழிலும் மீட்டுரைத்து வலியுறுத்துகிறது.
theological_decisions:
- issue: அடைக்கலப் பட்டணங்கள் குறித்த சட்டத்தில் கொன்றவனின் சட்ட வகைப்பாடு
  choice: רצח என்பதை ‘கொலைகாரன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கொன்றவன்’ அல்லது ‘ஆள்கொல்லி’
  rationale: சுற்றியுள்ள வசனங்கள் திட்டமிட்ட, குற்றத்திற்குரிய கொலையைத் தற்செயல் மரணத்திலிருந்து வேறுபடுத்துகின்றன. ‘கொலைகாரன்’ இங்குள்ள சட்ட மற்றும் அறத் தீர்ப்பைத் தெளிவாகக் காக்கிறது; பிற்காலக் கோட்பாடுகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்டப்பாங்கின் கண்ணியமும் எபிரெய வலியுறுத்தலும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய நிபந்தனைத் தொடர் தமிழில் இயல்பாக ‘...னால்’ அமைப்பில் தரப்பட்டுள்ளது.
