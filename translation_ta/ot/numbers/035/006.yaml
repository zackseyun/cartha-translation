base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: ta
  text: நீங்கள் லேவியர்களுக்குக் கொடுக்கும் நகரங்களில், ஒருவரைக் கொன்றவன் அங்கே ஓடித் தப்புவதற்காகக் கொடுக்க வேண்டிய அடைக்கல நகரங்கள் ஆறாக இருக்க வேண்டும்.[a] அவற்றோடு மேலும் நாற்பத்திரண்டு நகரங்களையும் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொலையாளி” என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரேயச் சொல், ஒருவரின் உயிரைப் பறித்தது வேண்டுமென்றே செய்யப்பட்டதா அல்லது தவறுதலாக நிகழ்ந்ததா என்பதைத் தனியாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; இச்சட்ட மற்றும் நிலப்பங்கீட்டுச் சூழலில் தொடர்ச்சியாகப் பயன்படுத்த ஏற்ற பொதுவான சொல் ‘நகரங்கள்’.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: நகரங்களைப் பெறுபவர்களைக் குறிக்கும் நேரடியான வேற்றுமைத் தொடர்.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: அடைக்கல நகரங்கள் ஆறு
  rationale: מִקְלָט என்பது தஞ்சம் அல்லது பாதுகாப்புக்குரிய இடத்தைக் குறிக்கிறது; ‘அடைக்கல நகரங்கள்’ இயல்பானதும் இச்சட்ட அமைப்பைத் துல்லியமாகக் குறிப்பதும் ஆகும்.
- source_word: לָנוּס שָׁמָּה
  choice: அங்கே தப்பியோடுவதற்காக
  rationale: נוּס என்பதன் ஓடித் தப்புதல் என்ற வினை வலிமையையும் שָׁמָּה என்பதன் திசைச் சுட்டையும் இத்தொடர் காக்கிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவன்
  rationale: இச்சொல் ஒருவரைக் கொன்ற நபரைக் குறிக்கிறது; இங்கே கொலை வேண்டுமென்றே செய்யப்பட்டதா அல்லது தவறுதலாக நிகழ்ந்ததா என்பதைச் சொல் தனித்து நிர்ணயிப்பதில்லை. ‘கொலைகாரன்’ முன்திட்ட நோக்கத்தை மிகுதியாக உணர்த்தக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וַעֲלֵיהֶם
  choice: அவற்றோடு மேலும்
  rationale: இங்கு עַל இடத்தைக் குறிக்காமல், முன்சொன்ன ஆறு நகரங்களுடன் கூடுதலாக வழங்கப்பட வேண்டிய எண்ணிக்கையைக் குறிக்கிறது.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: நாற்பத்திரண்டு நகரங்கள்
  rationale: எபிரேய எண்ணிக்கை அமைப்பில் ஒருமை வடிவம் வந்தாலும், தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: הָרֹצֵחַ என்ற சொல்லில் கொலையின் நோக்கம் தெளிவுபடுத்தப்படாதிருத்தல்
  choice: கொலை செய்தவன்
  alternative: கொலைகாரன்; தவறுதலாகக் கொன்றவன்
  rationale: மூலச்சொல் இவ்வசனத்தில் நோக்கமுள்ள கொலைக்கும் தவறுதலான உயிரிழப்புக்கும் இடையே தனித்து முடிவு கூறவில்லை. எனவே சட்டச் சூழலின் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரேய வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், ஆறு அடைக்கல நகரங்களும் கூடுதலான நாற்பத்திரண்டு நகரங்களும் என்ற கணக்குத் தொடர்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
