base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] கட்டளையிடு: அவர்கள் தங்களுடைய உரிமைச் சொத்தாகிய பரம்பரைப் பங்கிலிருந்து, லேவியர்கள் குடியிருப்பதற்காக நகரங்களைக் கொடுக்க வேண்டும். அந்த நகரங்களைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும்[b] நீங்கள் லேவியர்களுக்குக் கொடுக்க வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.” இது இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மேய்ச்சல் நிலங்கள்” என்பது நகரங்களைச் சுற்றியிருந்த திறந்த நிலங்களைக் குறிக்கிறது; அவை குறிப்பாகக் கால்நடைகளை மேய்ப்பதற்கும் பிற பொதுப் பயன்பாடுகளுக்கும் பயன்படுத்தப்பட்டன.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிடு
  rationale: மோசேயை நோக்கிய எபிரெய கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ள நிலையில், உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְנָתְנוּ
  choice: அவர்கள் ... கொடுக்க வேண்டும்
  rationale: முந்தைய கட்டளையின் விளைவாக வரும் மூன்றாம் நபர் பன்மை கட்டளைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: பெறுநரைக் குறிக்கும் நேரான மொழிபெயர்ப்பு.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: தங்களுடைய உரிமைச் சொத்தான பரம்பரைப் பங்கிலிருந்து
  rationale: נַחֲלָה என்பதன் பரம்பரைப் பங்கு என்ற கருத்தையும் אֲחֻזָּה என்பதன் உரிமைச் சொத்து என்ற சட்டக் கருத்தையும் இயன்றவரை வேறுபடுத்திக் காக்கிறது.
- source_word: עָרִים לָשָׁבֶת
  choice: குடியிருப்பதற்காக நகரங்கள்
  rationale: இறுதியெச்சத்தின் நோக்குப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִגְרָשׁ
  choice: பொதுவெளி நிலங்கள்
  rationale: நகரத்தைச் சுற்றிய திறந்த பொதுப் பயன்பாட்டு நிலம் என்ற பரந்த பொருளைக் காக்கிறது; மேய்ச்சல் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: அந்த நகரங்களைச் சுற்றியுள்ள
  rationale: சுற்றியுள்ள நிலங்கள் முன் குறிப்பிடப்பட்ட நகரங்களுக்குரியவை என்பதைத் தெளிவாக்குகிறது.
- source_word: תִּתְּנוּ
  choice: நீங்கள் ... கொடுக்க வேண்டும்
  rationale: முந்தைய மூன்றாம் நபர் பன்மையிலிருந்து வரும் இரண்டாம் நபர் பன்மை மாற்றத்தை மறைக்காமல் காக்கிறது.
