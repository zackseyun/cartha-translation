- from: '“இஸ்ரவேல் மக்களிடம்[a] கட்டளையிடு: அவர்கள் தங்களுடைய உரிமைச் சொத்தான பரம்பரைப் பங்கிலிருந்து, லேவியர்கள் குடியிருப்பதற்காக நகரங்களைக் கொடுக்க வேண்டும். அந்த நகரங்களைச் சுற்றியுள்ள பொதுவெளி நிலங்களையும்[b] நீங்கள் லேவியர்களுக்குக் கொடுக்க வேண்டும்.


    [a] எபிரெய மொழியில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.” இது இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.

    [b] “பொதுவெளி நிலங்கள்” என்பது நகரங்களைச் சுற்றியிருந்த திறந்த நிலங்களைக் குறிக்கிறது; அவை குறிப்பாகக் கால்நடைகளை மேய்ப்பதற்கும் பிற பொதுப் பயன்பாடுகளுக்கும் பயன்படுத்தப்பட்டன.'
  to: '“இஸ்ரவேல் மக்களிடம்[a] கட்டளையிடு: அவர்கள் தங்களுடைய உரிமைச் சொத்தாகிய பரம்பரைப் பங்கிலிருந்து, லேவியர்கள் குடியிருப்பதற்காக நகரங்களைக் கொடுக்க வேண்டும். அந்த நகரங்களைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும்[b] நீங்கள் லேவியர்களுக்குக் கொடுக்க வேண்டும்.”'
