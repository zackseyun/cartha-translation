translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்றாம் நபர் பன்மையிலிருந்து இரண்டாம் நபர் பன்மைக்கு எபிரெயத்தில் ஏற்படும் மாற்றம் திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
