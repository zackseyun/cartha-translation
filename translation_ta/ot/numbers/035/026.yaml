  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: ta
  text: ஆனால், கொலை செய்தவன் தான் தப்பி ஓடிய அடைக்கல நகரத்தின் எல்லையைத் தாண்டி உண்மையாகவே வெளியே போனால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘வெளியே போ’ என்ற வினைச்சொல் வலியுறுத்தலுக்காக இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய சட்டப் பகுதிக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יָצֹא יֵצֵא
  choice: வெளியே போய்விட்டால்
  rationale: முற்றுவினையெச்சத்துடன் வரும் வினைச்சொல்லின் வலியுறுத்தலைத் தமிழ் நிபந்தனை வாக்கியத்தில் இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலத்தின் வலியுறுத்தலைத் தெளிவுபடுத்துகிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவன்
  rationale: இங்கு அடைக்கல நகரத்துக்குத் தப்பியோடிய ஒருவரைக் குறிக்கிறது; குற்ற நோக்கத்துடன் கொன்றவன் என்று முன்கூட்டியே தீர்மானிக்கும் ‘கொலைகாரன்’ என்பதைத் தவிர்க்கிறது.
- source_word: אֶת גְּבוּל
  choice: எல்லையைத் தாண்டி
  rationale: יצא என்பதுடன் சேர்ந்து நகரத்தின் சட்டப்பூர்வ எல்லைக்கு வெளியே செல்வதைக் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עִיר מִקְלָטוֹ
  choice: அடைக்கல நகரம்
  rationale: அடைக்கலம் அளிக்க நியமிக்கப்பட்ட நகரத்தைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சட்டச் சொற்றொடர்; உடைமைத் தொடர்பு சார்புத்தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: தான் தப்பி ஓடிய
  rationale: שָׁמָּה என்பதிலுள்ள திசை/இடப் பொருளை நகரத்துடன் இணைக்கும் இயல்பான தமிழ்ச் சார்புத்தொடராக வழங்குகிறது.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் குற்றப் பொறுப்பு
  choice: கொலை செய்தவன்
  alternative: கொலைகாரன்
  rationale: அடைக்கல நகரச் சட்டத்தின் சூழலில் இவர் திட்டமிட்ட கொலைக்குக் குற்றவாளி என்பது இன்னும் நிர்ணயிக்கப்படவில்லை; ஆகவே அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘கொலைகாரன்’ என்ற குற்றத் தீர்ப்பை முன்வைக்கும் சொல்லைத் தவிர்த்து, சூழலின் சட்ட மற்றும் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டது.
