  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: ta
  text: ஏனெனில், தலைமை ஆசாரியர் இறக்கும் வரை அவன் தன் அடைக்கல நகரத்தில் தங்கியிருக்க வேண்டும்; தலைமை ஆசாரியர் இறந்த பின், ஒருவரைக் கொன்றவன்[a] தன் நிலவுடைமைக்குத்[b] திரும்பலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உயிரைப் பறித்தவன்.’ இங்குள்ள எபிரெயச் சொல் அடைக்கல நகரச் சட்டங்களில் ஒரு சட்ட வகையைக் குறிக்கிறது; அது அவசியமாகத் திட்டமிட்ட கொலை செய்தவனைக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தனக்குச் சொந்தமான நிலப்பகுதிக்கு’ அல்லது ‘தன் சொத்துநிலத்திற்கு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சட்ட விதிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְעִיר מִקְלָטוֹ
  choice: தனது அடைக்கல நகரத்திலேயே
  rationale: ‘அடைக்கல நகரம்’ என்பது இச்சட்டச் சூழலுக்குரிய தெளிவான சொற்றொடர்; ‘-இலேயே’ என்பது அங்கே தங்க வேண்டிய கட்டுப்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֵשֵׁב
  choice: தங்கியிருக்க வேண்டும்
  rationale: வினைச்சொல்லின் ‘வசித்தல்/தங்குதல்’ பொருளையும் சட்டரீதியான கடமையையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: தலைமைக் குரு இறக்கும்வரை
  rationale: எபிரெய மூலத்தின் கால எல்லையை இயல்பான நவீன தமிழில் வழங்குகிறது; அதிகாரப் பதவிக்கு ‘தலைமைக் குரு’ தெளிவான இணையாகும்.
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: தலைமைக் குரு இறந்தபின்
  rationale: மூலத்தில் மீண்டும் வரும் பதவிப் பெயரையும், மரணத்திற்குப் பிந்தைய சட்ட மாற்றத்தையும் காக்கிறது.
- source_word: הָרֹצֵחַ
  choice: உயிரைக் கொன்றவன்
  rationale: ஒருவரைக் கொன்ற நபரைக் குறிக்கும் சட்ட வகையைத் தெரிவிக்கிறது; ‘கொலைகாரன்’ என்று மொழிபெயர்த்து திட்டமிட்ட கொலை என்ற தீர்ப்பை முன்கூட்டியே புகுத்துவதைத் தவிர்க்கிறது.
- source_word: יָשׁוּב
  choice: திரும்பிச் செல்லலாம்
  rationale: முன்னிருந்த தடைக்குப் பின் மீண்டும் கிடைக்கும் சட்ட அனுமதியை ‘-லாம்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: தன் உடைமை நிலத்திற்கு
  rationale: אֲחֻזָּה என்பதன் நிலவுடைமை அல்லது சொத்துரிமை சார்ந்த பொருளைத் தக்கவைத்து, தேவையற்ற விதத்தில் ‘சுதந்தரம்’ என்ற இறையியல் நிழற்பொருளைச் சேர்க்காமல் உள்ளது.
theological_decisions:
- issue: הָרֹצֵחַ என்பதை திட்டமிட்ட கொலை செய்தவன் எனத் தீர்மானிக்கும் சொல்லால் மொழிபெயர்ப்பதா, அல்லது குறைவாகத் தீர்மானிக்கும் சட்ட வகையாக மொழிபெயர்ப்பதா
  choice: உயிரைக் கொன்றவன்
  alternative: கொலைகாரன்
  rationale: அடைக்கல நகரங்களைப் பற்றிய சட்டங்கள் திட்டமிட்ட கொலையையும் பிற சூழல்களில் நிகழ்ந்த உயிர்க்கொலையையும் வேறுபடுத்துகின்றன. ஆகவே இந்த வசனத்தில் இல்லாத குற்றத் தீர்ப்பை ‘கொலைகாரன்’ என்ற சொல் மூலம் புகுத்தாமல், மூலத்தின் சட்டரீதியான நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொலைகாரன்’ தவிர்க்கப்பட்டு, மூலத்தில் உள்ள சட்ட மற்றும் அறநெறி சார்ந்த தீர்மானமின்மை பாதுகாக்கப்பட்டுள்ளது.
