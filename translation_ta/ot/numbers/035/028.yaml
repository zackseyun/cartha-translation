revisions:
- from: ஏனெனில், தலைமைக் குரு இறக்கும்வரை அவன் தனது அடைக்கல நகரத்திலேயே தங்கியிருக்க வேண்டும்; தலைமைக் குரு இறந்தபின், உயிரைக் கொன்றவன்[a] தன் உடைமை நிலத்திற்குத்[b] திரும்பிச் செல்லலாம்.
  to: ஏனெனில், தலைமை ஆசாரியர் இறக்கும் வரை அவன் தன் அடைக்கல நகரத்தில் தங்கியிருக்க வேண்டும்; தலைமை ஆசாரியர் இறந்த பின், ஒருவரைக் கொன்றவன்[a] தன் நிலவுடைமைக்குத்[b] திரும்பலாம்.
  rationale: The revision corrects the office-title terminology from the broader ‘குரு’ to the priest-specific ‘ஆசாரியர்’ and smooths the neutral legal designation for the killer/manslayer. It preserves the Hebrew legal sequence, the conditional residence requirement, and the property-land sense of אֲחֻזָּתוֹ. Footnote markers remain attached to the relevant terms.
