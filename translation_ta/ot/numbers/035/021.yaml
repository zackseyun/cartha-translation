  source_fidelity: பகைமையுடன் கையால் அடித்ததால் மரணம் நேர்ந்தது, அடித்தவன் கொலைகாரன், மேலும் இரத்தப்பழி வாங்குபவன் அவனை எதிர்கொள்ளும்போது கொல்ல வேண்டும் என்ற சட்டத் தொடரை வரைவு உண்மையுடன் தருகிறது. ஆனால் בְּאֵיבָה என்பது முதன்மையாக ‘பகைமையுடன்/பகை எண்ணத்துடன்’ என்ற மனநிலை அல்லது நோக்கத்தைக் குறிக்கிறது; ‘பகைமையால்’ காரணப் பொருளைச் சற்றே அதிகப்படுத்துகிறது. மேலும் ‘அவனைச் சந்திக்கும்போது’ என்பதில் இறுதி பிரதிப்பெயரின் குறிப்பு இலக்கணப்படி தெளிவாக இருந்தாலும், தமிழில் ‘அவனை எதிர்கொள்ளும்போது’ சட்டச் சூழலுக்கும் மூலத்தின் encounter பொருளுக்கும் நெருக்கமானது.
