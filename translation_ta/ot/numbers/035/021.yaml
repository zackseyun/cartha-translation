  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: ta
  text: அல்லது, பகைமையுடன் தன் கையால் அவனை அடித்து, அவன் இறந்துபோனால்,[a] அடித்தவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அவன் ஒரு கொலைகாரன். இரத்தப்பழி தீர்ப்பவன்[b] அந்தக் கொலைகாரனை எதிர்கொள்ளும்போது அவனைக் கொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பகைமையுடன்” என்பதற்கு “வெறுப்புடன்” அல்லது “விரோதத்துடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “இரத்தப்பழி தீர்க்கும் உறவினர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: பகைமையால்
  rationale: אֵיבָה என்பது பகை அல்லது விரோத மனநிலையைக் குறிக்கிறது. காரணத்தையும் நோக்கத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: தன் கையால் அவனை அடித்து
  rationale: தாக்குதலின் உடல் சார்ந்த வழிமுறையை எபிரெய மூலத்தைப் போலவே வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனால்
  rationale: சட்ட நிபந்தனைத் தொடரில் மரணம் நிகழ்ந்ததை இயல்பான தமிழில் காட்டுகிறது; காரணத் தொடர்பை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: מוֹת יוּמַת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயரும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதன் மூலம் காத்து, சட்டக் கட்டாயத்தையும் தெரிவிக்கிறது.
- source_word: הַמַּכֶּה
  choice: அடித்தவன்
  rationale: முன்னர் கூறப்பட்ட தாக்குதலாளியைச் சுருக்கமாகவும் இயல்பாகவும் சுட்டுகிறது.
- source_word: רֹצֵחַ הוּא
  choice: அவன் ஒரு கொலைகாரன்
  rationale: பகைமையோடு செய்யப்பட்ட நோக்கமுள்ள கொலையை, விபத்தான உயிரிழப்பிலிருந்து வேறுபடுத்துகிறது.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: இஸ்ரவேலின் சட்ட அமைப்பிலுள்ள பதவியை விளக்க உரையாக மாற்றாமல், அதன் இரத்தப்பழி தீர்க்கும் செயல்பாட்டைத் தெளிவாகத் தருகிறது. உறவினர் என்ற உட்குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָמִית
  choice: கொல்ல வேண்டும்
  rationale: சட்டக் கட்டாயத்தையும் மரணத் தண்டனையின் செயற்படுத்தலையும் நேரடியாகக் காட்டுகிறது.
- source_word: בְּפִגְעוֹ בוֹ
  choice: அவனைச் சந்திக்கும்போது
  rationale: கொலைகாரனை எதிர்கொள்ளும் அல்லது கண்டடையும் நிகழ்வை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: நோக்கமுள்ள உயிர்க்கொலையின் சட்ட வகைப்பாடு
  choice: கொலைகாரன்
  alternative: உயிரைக் கொன்றவன்
  rationale: பகைமை என்ற நோக்கம் வெளிப்படையாகக் கூறப்படுவதால், பொதுவாக உயிரிழப்பை ஏற்படுத்தியவன் என்பதைவிட குற்றமுள்ள நோக்கமுடைய கொலைகாரன் என்பதே சூழலுக்குப் பொருந்துகிறது.
- issue: גֹּאֵל הַדָּם என்ற சட்டப் பதவி
  choice: இரத்தப்பழி வாங்குகிறவன்
  alternative: இரத்தப்பழி வாங்கும் உறவினர்
  rationale: முதன்மை உரை மூலத்தின் சட்டச் சொல்லாட்சியைப் பாதுகாக்கிறது; גֹּאֵל என்பதில் உள்ள குடும்ப உறவின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான சட்ட நடையைப் பயன்படுத்துகிறது. எபிரெய வலியுறுத்தலும் நோக்கமுள்ள கொலைக்கும் விபத்தான உயிரிழப்புக்கும் இடையிலான வேறுபாடும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
