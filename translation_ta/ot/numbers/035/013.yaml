  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: ta
  text: நீங்கள் கொடுக்கும் பட்டணங்கள் உங்களுக்கு ஆறு அடைக்கலப் பட்டணங்களாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: பட்டணங்கள்
  rationale: வாவ் இணைப்புச் சொல் இங்கு முந்தைய வசனத்துடன் தொடர்ச்சியைத் தருகிறது; தனித்த வசனமாக இயல்பான தமிழில் தேவையற்ற தொடக்க ‘மேலும்’ சேர்க்கப்படவில்லை. குறிப்பிட்ட பன்மை பெயர் ‘பட்டணங்கள்’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר תִּתֵּנוּ
  choice: நீங்கள் கொடுக்கும்
  rationale: உறவுத்தொடரையும் נתן வினையின் எதிர்நோக்கிய சட்டச் சூழலையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது; ‘ஒதுக்கும்’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும், மூலத்தில் இல்லாத விளக்கத்தைச் சற்றே அதிகமாகச் சேர்க்கும்.
- source_word: שֵׁשׁ
  choice: ஆறு
  rationale: எண்ணிக்கையை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: עָרֵי מִקְלָט
  choice: அடைக்கலப் பட்டணங்கள்
  rationale: ‘அடைக்கலத்தின் பட்டணங்கள்’ என்ற எபிரெயக் கட்டமைப்பை, இந்தச் சட்ட நிறுவனத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சேர்க்கையாக வழங்குகிறது.
- source_word: תִּהְיֶינָה
  choice: இருக்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தல் சூழலில் வினையின் கட்டளை/நியமன வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘இருக்கும்’ என்பது எதிர்காலக் கூற்றாக மட்டும் புரியக்கூடும்.
- source_word: לָ/כֶם
  choice: உங்களுக்கு
  rationale: லாமேத் முன்னொட்டின் பயனாளி அல்லது தொடர்புச் சார்பை இயல்பாகப் பிரதிபலிக்கிறது.
