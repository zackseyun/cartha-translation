id: NUM.35.12
reference: Numbers 35:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: ta
  text: அந்த நகரங்கள் உங்களுக்குப் பழிவாங்குபவரிடமிருந்து அடைக்கலமாக இருக்க வேண்டும்; ஒருவரைக் கொன்றவர் நியாயத்தீர்ப்புக்காகச் சபையின் முன் நிற்கும்வரை அவர் சாகக்கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: அந்த நகரங்கள் ... உங்களுக்கு அடைக்கலமாக இருக்க வேண்டும்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட நகரங்களைச் சுட்டும் சட்டவழிகாட்டலின் எதிர்கால/கட்டளை வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מִגֹּאֵל
  choice: பழிவாங்குகிறவரிடமிருந்து
  rationale: கொலைக்குப் பழிவாங்கும் உறவினரைக் குறிக்கும் גֹאֵל என்பதன் இச்சூழலுக்குரிய செயற்பாட்டைத் தெளிவாகத் தருகிறது; உறவுமுறை சார்ந்த விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְלֹא יָמוּת
  choice: அவர் சாகாதபடி
  rationale: அடைக்கல நகரங்களின் நோக்கம் அல்லது விளைவை இயல்பாக வெளிப்படுத்துகிறது; யாரால் மரணம் ஏற்படும் என்பதை மூலத்தைவிட அதிகமாகக் குறிப்பதில்லை.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவர்
  rationale: தீர்ப்பு வழங்கப்படுவதற்கு முன் குற்ற நோக்கத்தையோ குற்றத்தன்மையையோ முன்கூட்டியே நிர்ணயிக்காமல், ஒருவரைக் கொன்ற நபர் என்ற சட்டப் பிரிவைத் தெரிவிக்கிறது.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: சபையின் முன் நிற்கும்வரை
  rationale: எபிரெய காலவாக்கியத்தை இயல்பான தமிழில் தருகிறது; עֵדָה என்பதன் கூட்டு, அதிகாரப்பூர்வத் தன்மையை ‘சபை’ காக்கிறது.
- source_word: לַמִּשְׁפָּט
  choice: நியாயத்தீர்ப்புக்காக
  rationale: நீதிசார் விசாரணை மற்றும் முடிவை உள்ளடக்கும் מִשְׁפָּט என்பதன் சட்டப் பொருளைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: தீர்ப்புக்கு முன் הָרֹצֵחַ என்பவரின் சட்ட நிலை
  choice: கொலை செய்தவர்
  alternative: கொலைகாரன்; கொலையாளி
  rationale: சபையின் தீர்ப்புக்கு முன்பே திட்டமிட்ட கொலைக்கான குற்றத்தைச் சுமத்தாமல், ஒருவர் உயிரிழக்கக் காரணமானவர் என்ற திறந்த சட்டப் பொருளைக் காக்கிறது.
- issue: கொலைச் சட்டத்தில் גֹאֵל என்பதன் குறிப்பான பொருள்
  choice: முதன்மை உரையில் ‘பழிவாங்குகிறவர்’; அடிக்குறிப்பில் இரத்தப்பழி வாங்கும் உறவினர் என்ற விளக்கம்
  alternative: இரத்தப்பழி வாங்குகிறவர்; உறவினர்-பழிவாங்குபவர்
  rationale: வாசிப்பின் இயல்பைத் தக்கவைத்தபடி, எபிரெயச் சொல்லின் உறவுமுறை மற்றும் இரத்தப்பழி சார்ந்த சட்ட நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பூர்வமான கண்ணியமுள்ள நடையைப் பயன்படுத்துகிறது. ‘கொலை செய்தவர்’ என்பது தீர்ப்புக்கு முன் குற்றத்தை முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது; இரு வாக்கியங்களாக அமைத்தது தமிழில் தெளிவையும் இயல்பையும் மேம்படுத்துகிறது.
