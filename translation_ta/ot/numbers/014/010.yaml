revisions:
- from: ஆனால், மக்கள் கூட்டம் முழுவதும் அவர்கள்மேல் கல்லெறிய வேண்டும் என்று சொன்னது. அப்போது யாவேயின் மகிமை சந்திப்புக் கூடாரத்தில் இஸ்ரவேல் மக்கள் அனைவருக்கும்[a] தோன்றியது.
  to: ஆனால், சபையினர் அனைவரும் அவர்களைக் கற்களால் கல்லெறிய வேண்டும் என்று கூறினார்கள். அப்போது யாவேயின் மகிமை சந்திப்புக் கூடாரத்தில் இஸ்ரவேல் மக்கள் அனைவருக்கும்[a] தோன்றியது.
  rationale: 'The revision preserves the Hebrew syntax and ambiguity while improving modern Tamil idiom: the community is expressed as plural participants, and the phrase for stoning explicitly retains both the target pronoun and the means. No doctrinal interpretation or unstated consequence is introduced. The footnote remains anchored to the national designation it explains.'
