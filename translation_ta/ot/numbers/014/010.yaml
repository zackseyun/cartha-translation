base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: ta
  text: ஆனால், சபையினர் அனைவரும் அவர்களைக் கற்களால் கல்லெறிய வேண்டும் என்று கூறினார்கள். அப்போது யாவேயின் மகிமை சந்திப்புக் கூடாரத்தில் இஸ்ரவேல் மக்கள் அனைவருக்கும்[a] தோன்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லில், “இஸ்ரவேலின் மகன்கள்.”
    reason: எபிரெய בְּנֵי יִשְׂרָאֵל என்பதன் சொற்சொல் வடிவத்தையும், அதன் இயல்பான தேசியப் பொருளையும் வாசகர் அறியச் செய்கிறது.
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: עֵדָה என்பது இங்கு இஸ்ரவேலின் ஒன்றுகூடிய முழுச் சமூகத்தைக் குறிக்கிறது. ‘மக்கள் கூட்டம் முழுவதும்’ என்பது அதன் கூட்டுப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: அவர்கள்மேல் கல்லெறிய வேண்டும்
  rationale: רגם என்பதன் நேரடிப் பொருள் கல்லெறிதல். மரணம் சூழலில் நோக்கமாக இருந்தாலும், எபிரெய உரையில் ‘கொல்ல’ என்பது வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை; אֹתָם என்ற பதிலிப்பெயரும் யோசுவா, காலேபின் பெயர்களால் மாற்றப்படாமல் வைக்கப்பட்டது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד இங்கு வெளிப்படையாகத் தோன்றும் இறை மகிமையைக் குறிக்கிறது; יהוה என்பது பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: נִרְאָה
  choice: தோன்றியது
  rationale: ראה வினையின் நிஃபால் வடிவம் கண்ணுக்குப் புலப்படும் வெளிப்பாட்டைக் குறிக்கிறது. ‘தோன்றியது’ என்பது செயப்படுபொருள் வடிவத்தின் இயல்பையும் இறை வெளிப்பாட்டின் சூழலையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதற்கான தெளிவான, நிலையான பொருள் ‘சந்திப்புக் கூடாரம்’; בְּ முன்னிடைச்சொல் ‘-த்தில்’ என்று நேரடியாக வழங்கப்படுகிறது.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவருக்கும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பது நாட்டினரைக் குறிக்கும் மரபான கூட்டுப்பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைத் தேவையின்றிக் குறுக்காமல் அதன் தேசியப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசிய அடையாளச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சொற்றொடர் இங்கு ஆண் பிள்ளைகளை மட்டும் தனித்துக் குறிக்காமல் இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் மரபான தேசியப் பெயராக உள்ளது. ஆகவே பொருளில் இயல்பான வடிவம் முதன்மை உரையில் தரப்பட்டு, சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு பகுதிகளுக்கிடையிலான திடீர் திருப்பை ‘அப்போது’ தெளிவாக்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொல்ல’ சேர்க்கப்படவில்லை.
