  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: ta
  text: யாவே, நீர் இந்த மக்களின் நடுவில் இருக்கிறீர் என்றும், யாவே, நீர் கண்ணோடு கண் காணப்படுகிறீர்[a] என்றும், உமது மேகம் அவர்கள்மேல் நிற்கிறது என்றும், பகலில் மேகத்தூணிலும் இரவில் நெருப்புத்தூணிலும் நீர் அவர்களுக்கு முன்பாகச் செல்கிறீர் என்றும் ஏற்கெனவே கேள்விப்பட்டிருக்கும் இந்த நாட்டின் குடியிருப்பவர்களிடம் அவர்கள் இதைச் சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முகமுகமாகத் தோன்றுகிறீர்” அல்லது “தெளிவாகக் காணப்படுகிறீர்” என்றும் பொருள்படலாம்; எபிரெயத்தில் சொல்லுக்கு சொல், “கண்ணோடு கண் காணப்படுகிறீர்.”
    reason: עַיִן בְּעַיִן נִרְאָה என்ற சொற்றொடரின் படிமத்தையும் அதன் ஒன்றுக்கு மேற்பட்ட இயல்பான விளக்கங்களையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டில் குடியிருப்பவர்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெயப் பங்கேற்புச் சொல் இங்கு கூட்டுப் பொருளில் வருவதால், இயல்பான தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמְעוּ
  choice: கேள்விப்பட்டிருக்கிறார்கள்
  rationale: முன்னரே கேட்டதால் தற்போது அவர்களிடம் உள்ள அறிவை எபிரெய நிறைவுவினை குறிக்கிறது; தமிழ் நிகழ்கால நிறைவு வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; ஆகவே ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בְּקֶרֶב
  choice: நடுவில்
  rationale: மக்களிடையே தேவனுடைய நேரடியான இருப்பைக் குறிக்கும் இடவியல் உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: கண்ணோடு கண் காணப்படுகிறீர்
  rationale: ‘கண்’ என்ற மூலப்படிமத்தையும் נִרְאָה என்பதன் செயல்பாட்டு அல்லாத, காணப்படுதல் சார்ந்த பொருளையும் காக்கிறது; இது தமிழில் வழக்கத்திற்கு மாறாக இருப்பதால் அடிக்குறிப்பில் பொருள் மாற்றுகள் தரப்பட்டுள்ளன.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: உமது மேகம் அவர்கள்மேல் நிற்கிறது
  rationale: மேகம் அவர்களுக்கு மேலாக நிலைகொண்டிருக்கும் மூலத்தின் தெளிவான காட்சியைப் பாதுகாக்கிறது.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகச் செல்கிறீர்
  rationale: ‘வழிநடத்துகிறீர்’ என்று விளக்கமாக மாற்றாமல், הלך மற்றும் לפני ஆகியவற்றின் இயக்கம் மற்றும் இடவியல் பொருளை காக்கிறது.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: மேகத்தூணிலும் ... நெருப்புத்தூணிலும்
  rationale: בְּ முன்னிடைச்சொல்லின் இடவியல்/வழிமுறை சார்ந்த திறந்த பொருளை ‘-இல்’ வடிவம் காக்கிறது.
- source_word: יוֹמָם ... לָיְלָה
  choice: பகலில் ... இரவில்
  rationale: நேரத்தைக் குறிக்கும் எபிரெய வினையடை வடிவங்களுக்கு இயல்பான நவீனத் தமிழ் இணைகள்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயர் நேரடியாக வருகிறது; அதைத் தலைப்பாக மாற்றாமல் ஒலிபெயர்ப்பாக வைத்திருக்கிறது.
- issue: עַיִן בְּעַיִן נִרְאָה என்பதன் பொருள்
  choice: கண்ணோடு கண் காணப்படுகிறீர்
  alternative: முகமுகமாகத் தோன்றுகிறீர் / தெளிவாகக் காணப்படுகிறீர்
  rationale: இந்தச் சொற்றொடர் நேரடியான சந்திப்பையோ வெளிப்படையான காணப்படுதலையோ குறிக்கக்கூடும். எந்த ஒரு விளக்கத்தையும் மட்டும் முதன்மை உரையில் உறுதிசெய்யாமல், மூலத்தின் கண்-படிமத்தையும் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை ஒருமை இறைமுகப்பு பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘என்றும்’ தொடர் மூலத்தின் செய்தியடக்க அமைப்பைத் தக்கவைக்கிறது. ‘கண்ணோடு கண்’ என்பது திட்டமிட்டுச் சற்றே மூலநெருக்கமான வடிவம்; தவறான ‘கண்ணுக்குக் கண்’ பழிவாங்கல் நிழற்பொருளைத் தவிர்க்கிறது.
