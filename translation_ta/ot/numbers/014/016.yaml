  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: ta
  text: யாவே இந்த மக்களைத் தாம் அவர்களுக்கு ஆணையிட்டு வாக்களித்த நாட்டிற்குள் கொண்டுவர முடியாததால், அவர்களைப் பாலைநிலத்தில் படுகொலை செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבִּלְתִּי
  choice: முடியாததால்
  rationale: இச்சொற்றொடர் அடுத்துவரும் இயலாமைக் கூற்றை காரணமாக முன்வைக்கிறது; தமிழில் ‘முடியாததால்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְכֹלֶת יְהוָה
  choice: யெகோவாவால் ... முடியாததால்
  rationale: יכל திறன் அல்லது இயலுமையைக் குறிக்கிறது. பிற இனத்தார் கூறக்கூடிய குற்றச்சாட்டாகிய தெய்வீக இயலாமையை மென்மைப்படுத்தாமல் இவ்வமைப்பு காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கிலுள்ள தனிப்பெயர் வடிவில் தருகிறது.
- source_word: לְהָבִיא
  choice: கொண்டுவர
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே வரச் செய்தல்/கொண்டுவருதல்’ என்று பொருள்படும்; நாட்டிற்குள் நுழைவதைத் தொடர்ந்து வரும் சொற்றொடர் தெளிவாக்குகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עָם ஒருமைத் தொகுப்புப் பெயராக இருப்பினும், நவீனத் தமிழில் ‘இந்த மக்களை’ என்பது இயல்பாக அதன் கூட்டுப்பொருளை வெளிப்படுத்துகிறது.
- source_word: אֶל הָאָרֶץ
  choice: நாட்டிற்குள்
  rationale: הביא உடன் வரும் אֶל இலக்கை மட்டுமல்லாமல் நாட்டுக்குள் நுழைவதையும் குறிக்கிறது.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: தாம் அவர்களுக்கு ஆணையிட்டுக் கொடுத்த
  rationale: எபிரெயில் ‘அவர்களுக்கு ஆணையிட்ட’ என்று மட்டுமே வெளிப்படையாக உள்ளது; கொடுப்பது சூழலில் உணரப்படுகிறது. தமிழ் வாக்கியத்தின் இயல்புக்காக ‘கொடுத்த’ சேர்க்கப்பட்டாலும், சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁחָטֵם
  choice: அவர்களைப் ... படுகொலை செய்தார்
  rationale: שׁחט என்பது கொல்லுதல் என்பதைக் காட்டிலும் தீவிரமான அறுத்துக் கொல்லும்/படுகொலை செய்யும் நிழற்பொருளைக் கொண்டது; குற்றச்சாட்டின் கடுமையை இது காக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வனாந்தரப் பகுதியைக் குறிக்கிறது; ‘பாலைநிலம்’ நவீனத் தமிழில் புரியத்தக்க, இலக்கிய மரியாதையுள்ள சொல்.
theological_decisions:
- issue: யெகோவாவின் திறனைப் பற்றிப் பிற இனத்தார் கூறக்கூடிய குற்றச்சாட்டு
  choice: யெகோவாவால் ... முடியாததால்
  alternative: யெகோவாவுக்குத் திறன் இல்லாத காரணத்தால்
  rationale: சூழலில் இது மோசே உண்மையாக உறுதிப்படுத்தும் கோட்பாடு அல்ல; பிற இனத்தார் கூறுவார்கள் என அவர் முன்வைக்கும் குற்றச்சாட்டு. இருப்பினும் மூலத்தின் தெய்வீக இயலாமை குறித்த பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தவில்லை.
- issue: வசனம் 15-இலிருந்து தொடரும் மேற்கோள் சூழல்
  choice: மேற்கோள் குறிகளுடன் ‘என்று சொல்வார்கள்’ சேர்த்தல்
  alternative: சூழலைச் சேர்க்காமல் ‘... படுகொலை செய்தார்’ என மட்டும் முடித்தல்
  rationale: எபிரெய வசனம் 16 தனியாக முந்தைய வசனத்தின் ‘தேசங்கள் சொல்லும்’ என்பதன் உள்ளடக்கமாகத் தொடர்கிறது. கொடுக்கப்பட்ட வசனம் தனித்து வாசிக்கப்படும்போது அந்தக் குற்றச்சாட்டு யாருடையது என்பது தவறாகப் புரியாதவாறு தமிழில் தொடர்ச்சியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் பிற இனத்தாரின் கூற்றை மேற்கோள் வடிவம் தெளிவாக்குகிறது. ‘படுகொலை செய்தார்’ மூலத்தின் கடுமையைத் தக்கவைக்கிறது.
