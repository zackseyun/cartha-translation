lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: அவர்களைத் தாக்கி
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் ‘தாக்குதல்’ என்று பொருள்படும். எபிரெயத்தில் ஒருமை விகுதி இருந்தாலும், அது இஸ்ரவேல் மக்களை ஒரே கூட்டு அமைப்பாகக் குறிக்கிறது; இயல்பான நவீன தமிழில் மரியாதைப் பன்மை வடிவம் பொருத்தமானது.
- source_word: בַדֶּבֶר
  choice: கொள்ளைநோயால்
  rationale: דֶּבֶר என்பது தண்டனைச் சூழல்களில் பரவலாக உயிரிழப்பை உண்டாக்கும் தொற்றுநோயைக் குறிக்கிறது. ‘கொள்ளைநோய்’ நவீன வேதாகமத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: அவர்களுடைய உரிமையைப் பறிப்பேன்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் உடைமையிலிருந்து அகற்றுதல் அல்லது சுதந்தர உரிமையை நீக்குதல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம். ‘உரிமையைப் பறிப்பேன்’ அவற்றை ஓரளவு ஒன்றிணைத்து, இடத்திலிருந்து விரட்டுதல் என்ற பொருளுக்கு மட்டும் சுருக்காமல் காக்கிறது.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: உன்னை ... ஒரு தேசமாக ஆக்குவேன்
  rationale: עשה + நேர் செயப்படுபொருள் + לְ அமைப்பு ஒருவரை ஒன்றாக ஆக்குவதைச் சுட்டுகிறது. தமிழ் வாக்கிய அமைப்பில் இது இயல்பாக வெளிப்படுகிறது.
- source_word: גָּדוֹל וְעָצוּם
  choice: பெரியதும் வலிமைமிக்கதுமான
  rationale: גָּדוֹל பெருமையையும் அளவையும், עָצוּם வலிமை அல்லது எண்ணிக்கையில் பெருக்கத்தையும் குறிக்கலாம். ஒப்பீட்டுச் சொற்றொடருடன் ‘பெரியதும் வலிமைமிக்கதுமான’ என்பது இரு கூறுகளையும் காக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அவர்களைவிட
  rationale: எபிரெயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி, இஸ்ரவேலை ஒரு கூட்டு ஒருமையாகக் குறிக்கிறது. தமிழில் ‘அவர்களைவிட’ என்பது மக்களைக் குறிக்கும் இயல்பான வடிவம்; கூட்டு ஒருமை இலக்கணத்தைப் பின்பற்றுவதற்காகச் செயற்கையான உயிரற்ற ஒருமையைப் பயன்படுத்தவில்லை.
theological_decisions:
- issue: நியாயத்தீர்ப்புக்குரிய ஒருமை விகுதிகளின் குறிப்பு
  choice: இஸ்ரவேல் மக்களைக் குறிக்கும் இயல்பான தமிழ் பன்மை வடிவமாக மொழிபெயர்த்தல்
  alternative: கூட்டு ஒருமையை வெளிப்படுத்த ‘அதை’ போன்ற ஒருமை வடிவத்தைப் பயன்படுத்துதல்
  rationale: மூல எபிரெயம் இஸ்ரவேலை ஒரே கூட்டு அமைப்பாக ஆண்பால் ஒருமையில் குறிக்கிறது. ஆனால் தமிழில் மக்களைக் ‘அதை’ என்று குறிப்பிடுவது இயல்பற்றதுடன் மனிதர்களை உயிரற்றதாகக் காட்டும். பன்மை வடிவம் குறிப்பைத் தெளிவாக வைத்திருக்கிறது; இறையியல் பொருளை மாற்றுவதில்லை.
- issue: ירשׁ என்பதன் பொருள் வலிமை
  choice: ‘உரிமையைப் பறிப்பேன்’ என்பதை முதன்மை உரையில் கொண்டு, சுதந்தரத்தை நீக்குதல் என்ற மாற்றைப் அடிக்குறிப்பில் காத்தல்
  alternative: ‘அவர்களை வெளியேற்றுவேன்’ அல்லது ‘அவர்களுடைய சுதந்தர உரிமையை நீக்குவேன்’
  rationale: இங்கு உடைமை இழப்பும் சுதந்தர உரிமை நீக்கமும் இரண்டும் சாத்தியம். முதன்மை மொழிபெயர்ப்பு இந்த இரு நிழற்பொருள்களையும் திறந்துவைக்கிறது; அடிக்குறிப்பு உடன்படிக்கைச் சுதந்தரத்தின் சாத்தியமான வலியுறுத்தலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உன்னையோ’ என்பது முந்தைய நியாயத்தீர்ப்புக்கும் மோசேயை ஒரு புதிய தேசமாக ஆக்கும் வாக்குறுதிக்கும் இடையிலான முரணை இயல்பாக வலியுறுத்துகிறது. எபிரெயக் கூட்டு ஒருமை தமிழில் இயல்பான மனிதப் பன்மையாக வெளிப்படுத்தப்பட்டுள்ளது.
