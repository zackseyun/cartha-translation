revisions:
- from: அவர்களை கொள்ளைநோயால் தாக்கி, அவர்களுடைய உரிமையைப் பறிப்பேன்[a]. உன்னையோ அவர்களைவிடப் பெரியதும் வலிமைமிக்கதுமான ஒரு தேசமாக ஆக்குவேன்.
  to: அவர்களைக் கொள்ளைநோயால் தாக்கி, அவர்களை உரிமையிழக்கச் செய்வேன்[a]; உன்னையோ அவர்களைவிடப் பெரியதும் வலிமைமிக்கதுமான ஒரு தேசமாக ஆக்குவேன்.
  rationale: The revision corrects the object relationship of the Hebrew Hiphil of ירשׁ while preserving its ambiguity between dispossession and disinheritance. Natural Tamil plural pronouns continue to represent the Hebrew collective singular Israel, avoiding an unnatural inanimate singular reference to people.
