  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: ta
  text: அவர்களைக் கொள்ளைநோயால் தாக்கி, அவர்களை உரிமையிழக்கச் செய்வேன்[a]; உன்னையோ அவர்களைவிடப் பெரியதும் வலிமைமிக்கதுமான ஒரு தேசமாக ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்களைச் சுதந்தர உரிமையிலிருந்து விலக்குவேன்.” எபிரெயச் சொல், ஒருவரை உடைமையிலிருந்து அகற்றுதல் அல்லது சுதந்தர உரிமையை இழக்கச் செய்தல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.'
