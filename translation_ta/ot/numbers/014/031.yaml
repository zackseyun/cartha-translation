  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: ta
  text: ஆனால், கொள்ளைப்பொருளாகிவிடுவார்கள்[a] என்று நீங்கள் சொன்ன உங்கள் சிறு பிள்ளைகளை நான் அங்கே கொண்டுவருவேன். நீங்கள் நிராகரித்த[c] அந்த நாட்டை அவர்கள் அறிந்துகொள்வார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரையாவார்கள்” அல்லது “சூறைப்பொருளாவார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த நாட்டை அனுபவித்து அறிவார்கள்.” இங்குள்ள எபிரெய ‘அறிதல்’ என்ற சொல் நேரடியான அனுபவத்தின் மூலம் அறிதலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இகழ்ந்து ஒதுக்கிய.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகள்
  rationale: טַף என்பது பொதுவாகச் சந்ததியினர் அனைவரையும் அல்ல, சிறு பிள்ளைகளைக் குறிக்கிறது; சூழலில் அவர்களுடைய பாதுகாப்பற்ற நிலையையும் இச்சொல் உணர்த்துகிறது.
- source_word: לָבַז
  choice: கொள்ளைப்பொருளாகிவிடுவார்கள்
  rationale: בַּז என்பது போரில் பகைவர் கைப்பற்றும் கொள்ளை அல்லது சூறைப்பொருளைக் குறிக்கிறது. தமிழில் இத்தொடர் இராணுவச் சூழலுக்கும் பெற்றோரின் அச்சத்துக்கும் பொருந்துகிறது.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: அவர்களை நான் அங்கே கொண்டுவருவேன்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு ‘உள்ளே வரச் செய்தல்/கொண்டுவருதல்’ எனப் பொருள்படுகிறது. செல்லுமிடம் அடுத்துள்ள ‘அந்த நாடு’ என்பதிலிருந்து தெளிவாக இருப்பதால் இயல்பான தமிழுக்காக ‘அங்கே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְיָדְעוּ
  choice: அவர்கள் அறிந்துகொள்வார்கள்
  rationale: יָדַע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ பாதுகாக்கப்படுகிறது; இச்சூழலில் அந்த நாட்டை நேரில் அனுபவித்து அறிதல் என்ற நுட்பமும் திறந்தே உள்ளது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: הָאָרֶץ இச்சூழலில் குறிப்பிட்ட நாட்டைக் குறிக்கிறது. தமிழில் முன்சுட்டுச் சொல்லாக ‘அந்த’ என்பது இயல்பாக இருந்து, எபிரெயத்தில் இல்லாத ‘வாக்குத்தத்த நாடு’ அல்லது ‘கானான்’ என்பதைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: מְאַסְתֶּם בָּהּ
  choice: நீங்கள் நிராகரித்த
  rationale: מָאַס என்பது நிராகரித்தல், வேண்டாமென ஒதுக்குதல், அல்லது இகழ்தல் ஆகிய பொருட்களை ஏற்கலாம். ‘நிராகரித்த’ என்பது உணர்ச்சி வலிமையை மிகைப்படுத்தாமல் அவர்களின் மறுப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘அந்த நாடு’ என்பது வாக்குத்தத்த நாடாகிய கானான் என்பதை வசனத்திலேயே வெளிப்படையாகச் சொல்ல வேண்டுமா?
  choice: ‘அந்த நாடு’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘வாக்குத்தத்த நாடு’ அல்லது ‘கானான் நாடு’ என்று விரிவாக்குதல்
  rationale: எபிரெய மூலத்தில் ‘அந்த நாடு’ என்றே உள்ளது. அதன் குறிப்பு சூழலிலிருந்து தெளிவாகிறது; ‘வாக்குத்தத்த’ அல்லது ‘கானான்’ என்று சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை வசனத்துக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சிறு பிள்ளைகள்’ என்பது எளிதில் புரியும் சொல்; ‘நிராகரித்த’ என்பது உடன்படிக்கைச் சூழலிலுள்ள மறுப்பைத் தெளிவாகக் காட்டுகிறது. எபிரெய வாக்கியத்தின் எதிர்மறைத் திருப்பை வெளிப்படுத்த தொடக்கத்தில் ‘ஆனால்’ வைக்கப்பட்டுள்ளது.
