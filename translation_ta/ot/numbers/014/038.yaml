  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: ta
  text: ஆனால், நூனின் மகன் யோசுவாவும் எப்புன்னேயின் மகன் காலேபும், நாட்டை உளவுபார்க்கச் சென்ற அந்த மனிதர்களில் உயிரோடு இருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாட்டை ஆராய’; அல்லது, ‘நாட்டை வேவு பார்க்க’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: ஆனால், ... யோசுவாவும்
  rationale: முன் வசனத்தில் மற்ற உளவாளிகள் இறந்ததற்கு மாறாக யோசுவா உயிரோடிருந்ததை இணைப்புச்சொல் சூழலில் குறிக்கிறது; எனவே இயல்பான தமிழில் ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: בִּן נוּן
  choice: நூனின் மகன்
  rationale: எபிரெயப் பிதாவழி உறவுக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபும்
  rationale: இரண்டாவது உயிர்தப்பியவரை யோசுவாவுடன் ஒருங்கிணைக்க ‘-உம்’ அமைப்பு பயன்படுத்தப்பட்டது; பெயர்களும் மகன் உறவும் தக்கவைக்கப்பட்டன.
- source_word: חָיוּ
  choice: உயிரோடிருந்தார்கள்
  rationale: חיה என்பதன் ‘உயிரோடிருத்தல்/உயிருடன் எஞ்சியிருத்தல்’ என்ற பொருளை, மற்றவர்கள் இறந்த சூழலில் மிகையின்றி வெளிப்படுத்துகிறது.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: அந்த மனிதர்களில்
  rationale: குறிப்பிட்ட ஆண்கள் அடங்கிய குழுவிலிருந்து இவ்விருவர் மட்டும் விதிவிலக்காக உயிரோடிருந்தனர் என்ற מִן சொல்லின் பிரித்தெடுக்கும் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הַהֹלְכִים
  choice: சென்றிருந்த
  rationale: பெயரெச்சமாக வந்துள்ள எபிரெயப் பங்கேற்புவினையை, பின்னோக்கிக் குறிப்பிடும் உரைச்சூழலுக்கு ஏற்ற தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: அந்த நாட்டை உளவுபார்க்க
  rationale: கானான் நாட்டை ஆய்ந்து தகவல் பெறச் சென்ற பணியைச் சூழலுக்கேற்ற துல்லியத்துடன் குறிக்கிறது; ‘ஆராய’ மற்றும் ‘வேவுபார்க்க’ என்பவையும் சாத்தியமான மாற்றுகள்.
