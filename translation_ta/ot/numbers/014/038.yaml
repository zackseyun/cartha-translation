translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அந்த மனிதர்களில்’ என்பது குழுவிலிருந்து உயிருடன் எஞ்சிய இருவரைச் சுட்டுகிறது; ‘உளவுபார்க்க’ என்ற சொல்லின் மாற்றுப் பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
