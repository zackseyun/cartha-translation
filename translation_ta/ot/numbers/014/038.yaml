  to: ஆனால், நூனின் மகன் யோசுவாவும் எப்புன்னேயின் மகன் காலேபும், நாட்டை உளவுபார்க்கச் சென்ற அந்த மனிதர்களில் உயிரோடு இருந்தார்கள்[a].
