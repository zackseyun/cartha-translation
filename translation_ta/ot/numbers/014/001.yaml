translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘சபையார்’ என்பது வழிபாட்டு இடத்தைக் குறுகலாகக் குறிக்காமல், இங்கு கூடியிருந்த முழுச் சமூகத்தைக் குறிக்கிறது. ஒரே அழுகையை இருமுறை ஒலிக்கச் செய்யாமல், וַיִּתְּנוּ אֶת־קוֹלָם மற்றும் וַיִּבְכּוּ ஆகியவற்றை முறையே ‘கதறினார்கள்’, ‘அழுதார்கள்’ என வேறுபடுத்தியுள்ளது.
