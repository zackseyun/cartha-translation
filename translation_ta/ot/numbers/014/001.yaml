source:
  edition: WLC
  text: וַ/תִּשָּׂא֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יִּתְּנ֖וּ אֶת קוֹלָ֑/ם וַ/יִּבְכּ֥וּ הָ/עָ֖ם בַּ/לַּ֥יְלָה הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: ta
  text: அப்போது சபையார் அனைவரும் குரலெழுப்பிக் கதறினார்கள்[a]; மக்கள் அந்த இரவில் அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “சபையார் அனைவரும் [குரலை] உயர்த்தி, தங்கள் குரலைக் கொடுத்தார்கள்”; இது ஒரு கூட்டத்தின் உரத்த கதறலைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא כָּל־הָעֵדָה
  choice: சபையார் அனைவரும் குரலெழுப்பி
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்கு/உயர்த்து’. ‘குரலெழுப்பி’ என்பது அந்த உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது; כָּל־הָעֵדָה என்பதை ‘சபையார் அனைவரும்’ என வழங்குவது கூடியிருந்த இஸ்ரவேல் சமூகத்தையும் כָּל என்பதையும் பிரதிபலிக்கிறது.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: கதறினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘தங்கள் குரலைக் கொடுத்தார்கள்’; இங்கு இது கூட்டு உரத்த புலம்பலைக் குறிக்கும் மரபுத்தொடர். ‘கதறினார்கள்’ அதன் தீவிரத்தையும் அழுகை சார்ந்த சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם என்பதற்கான நேரடியான, இயல்பான தமிழ். முன் வரும் ‘சபையார்’ என்பதுடன் குறிக்கப்படும் கூட்டம் ஒன்றாக இருந்தாலும், எபிரெய உரையின் சொல் வேறுபாடு தக்கவைக்கப்படுகிறது.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: בכה என்பதன் அடிப்படைப் பொருளைத் தெளிவாகத் தருகிறது; முந்தைய உரத்த கதறலிலிருந்து தொடர்ந்து நடந்த அழுகையை வேறுபடுத்துகிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவு முழுவதும்
  rationale: ‘அந்த இரவில்’ என்பது மிக நேரடியான வடிவம். இச்சூழலில் இரவெங்கும் நீடித்த அழுகையை இயல்பாக உணர்த்த ‘அந்த இரவு முழுவதும்’ தேர்ந்தெடுக்கப்பட்டது; இது காலவெளிப்பாட்டின் பொதுவான தமிழாக்கம்.
