  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: ta
  text: ஏனெனில், என் மகிமையையும் எகிப்திலும் வனாந்தரத்திலும் நான் செய்த என் அடையாளங்களையும் கண்டு, இந்தப் பத்து முறையும் என்னைச் சோதித்து, என் குரலுக்குச் செவிகொடுக்காத[a] ஆண்கள் அனைவரும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கீழ்ப்படியாத.” “என் குரலுக்குச் செவிகொடுப்பது” என்ற எபிரெய மொழிவழக்கு, கூறியதைக் கவனித்து ஏற்றுக்கொள்வதையோ கீழ்ப்படிவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தெய்வீக ஆணைக்கும் தீர்ப்புக்கும் காரணத்தை அறிமுகப்படுத்துகிறது; தொடரும் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: כָל הָאֲנָשִׁים
  choice: ஆண்கள் அனைவரும்
  rationale: இங்கு אֲנָשִׁים என்பது பொதுவாக மக்களைக் குறிக்கும் நடுநிலைச் சொல்லாக அல்லாமல், தீர்ப்புக்குட்படும் தலைமுறையின் ஆண்களைக் குறிக்கிறது.
- source_word: הָרֹאִים
  choice: கண்டு
  rationale: பெயரெச்சப் பங்கேற்பின் பொருளைத் தமிழில் இயல்பான தொடர்வினையெச்சமாக அளித்து, அவர்கள் நேரடியாகக் கண்ட அனுபவத்தைச் சுட்டுகிறது.
- source_word: כְּבֹדִי
  choice: என் மகிமை
  rationale: தெய்வீக வெளிப்பாட்டைக் குறிக்கும் כָּבוֹד என்பதன் வழக்கமான, கருத்துச் செறிவுள்ள தமிழ் மொழிபெயர்ப்பு.
- source_word: אֹתֹתַי
  choice: என் அடையாளங்கள்
  rationale: אוֹת என்பதிலுள்ள சான்றளிக்கும் ‘அடையாளம்’ என்ற பொருளைக் காக்கிறது; ‘அற்புதங்கள்’ என்று பொருளை விரிவுபடுத்தவில்லை.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: நான் செய்த
  rationale: עשה என்பதற்கான நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: எகிப்திலும் வனாந்தரத்திலும்
  rationale: யாத்திராகமச் சூழலில் மִדְבָּר என்பதற்கு நிலைபெற்ற வேதாகமத் தமிழான ‘வனாந்தரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְנַסּוּ אֹתִי
  choice: என்னைச் சோதித்து
  rationale: נסה என்பதன் ‘சோதித்தல்/சோதனைக்கு உட்படுத்துதல்’ என்ற குற்றச்சாட்டு இயல்பாக வெளிப்படுகிறது.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: இப்படி பத்து முறை
  rationale: זֶה தரும் சுட்டும் வலிமையை ‘இப்படி’ காக்கிறது; பத்து முறை நிகழ்ந்த தொடர்ச்சியான நடத்தையையும் தெளிவாக்குகிறது.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: என் குரலுக்குச் செவிகொடுக்காத
  rationale: எபிரெய மொழிவழக்கை நெருக்கமாகக் காக்கிறது; அதே சமயம் கவனித்து ஏற்றுக்கொள்ளாமை அல்லது கீழ்ப்படியாமை என்ற கருத்தையும் உணர்த்துகிறது.
theological_decisions:
- issue: தெய்வீகத் தன்மொழியும் உடன்படிக்கைச் சார்ந்த உரையும்
  choice: ‘என் மகிமை,’ ‘என் அடையாளங்கள்,’ ‘என் குரல்’ என்ற முதலாம் நபர் உரையை அப்படியே வைத்தல்
  alternative: தெய்வீகச் செயல்களின் பொருளை விளக்கமாக விரிவுபடுத்துதல்
  rationale: எபிரெய உரை தேவனுடைய நேரடி உரையாக இருப்பதால், அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் அதன் வலிமை பாதுகாக்கப்படுகிறது.
- issue: הָאֲנָשִׁים என்பதன் பாலினக் குறிப்பு
  choice: ஆண்கள் அனைவரும்
  alternative: மக்கள் அனைவரும்
  rationale: சொல்லும் கதைக் சூழலும் தீர்ப்புக்குட்பட்ட தலைமுறையின் ஆண்களைச் சுட்டுவதால், பாலினக் குறிப்பை நடுநிலைப்படுத்தவில்லை.
- issue: שׁמע בקול என்ற மொழிவழக்கின் பொருள்
  choice: என் குரலுக்குச் செவிகொடுக்காத
  alternative: எனக்குக் கீழ்ப்படியாத
  rationale: ‘கேட்டல்’ மற்றும் ‘கீழ்ப்படிதல்’ ஆகிய இரு கருத்துகளையும் உள்ளடக்கக்கூடிய எபிரெய மொழிவழக்கின் திறந்த பொருளை முதன்மை உரையில் காக்கிறது; தெளிவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் நிறைவுபெறும் எபிரெய வாக்கியத் தொடரை உணர்த்த இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘வனாந்தரம்’ என்பது பொதுவாகப் புரிந்துகொள்ளக்கூடிய, இச்சூழலுக்கேற்ற நிலைபெற்ற வேதாகமச் சொல்.
