  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மந்தை மேய்ப்பவர்கள்,’ ‘வேசித்தனங்கள்,’ ‘பிணங்கள்’ ஆகியவை மூல எபிரெயத்தின் உருவகத்தையும் கடுமையையும் தக்கவைக்கின்றன; சாத்தியமான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
