  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: ta
  text: உங்கள் மகன்கள் நாற்பது ஆண்டுகள் பாலைநிலத்தில் மந்தை மேய்ப்பவர்களாக[a] இருப்பார்கள். உங்கள் பிணங்கள் பாலைநிலத்தில் ஒழிந்துதீரும்வரை[c], அவர்கள் உங்கள் வேசித்தனங்களை[b] சுமப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அலைந்து திரிபவர்களாக.” எபிரெயச் சொல் நேரடியாக மந்தை மேய்த்தலுடன் தொடர்புடையது; பாலைநிலத்தில் நாடோடிகளாக அலைவதை இது வலியுறுத்துகிறது என்றும் சிலர் கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: “வேசித்தனங்கள்” என்பது உடன்படிக்கைக்கு உண்மையற்ற துரோகத்தைப் பாலியல் உருவகத்தில் குறிப்பிடும் சொல்லாக இங்கு இருக்கலாம்; “விசுவாசமின்மை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பாலைநிலத்தில் உங்கள் பிணங்கள் முடிவுறும்வரை.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: உங்கள் மகன்கள்
  rationale: בנים என்பதன் இயல்பான ஆண்பால் பன்மைப் பொருளான ‘மகன்கள்’ என்பதைக் காக்கிறது; சூழல் இதைத் தெளிவாகப் பொதுவான ‘பிள்ளைகள்’ என விரிவுபடுத்தவில்லை.
- source_word: רֹעִים
  choice: மந்தை மேய்ப்பவர்களாக
  rationale: רעה என்ற வேருடன் தொடர்புடைய மேய்த்தல் சார்ந்த நேரடிப் பொருளைக் காக்கிறது. நாடோடிகளாக அலைதல் என்பது சூழலால் உணரப்படும் மாற்றுப் புரிதல் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மக்கள் குடியிருப்புக்கு வெளியான வறண்ட, மேய்ச்சலுக்குரிய வனாந்தரப் பகுதியைக் குறிக்கும் מִדְבָּר என்பதற்கு நவீனத் தமிழில் இயல்பான தேர்வு.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנָשְׂאוּ
  choice: சுமப்பார்கள்
  rationale: נשא என்பதிலுள்ள சுமத்தப்பட்ட பாரத்தையும் விளைவுகளை ஏற்றுக்கொள்ளும் கருத்தையும், ‘விளைவுகள்’ என்று வெளிப்படையாகச் சேர்த்து மூலத்தின் உருவகத்தைத் தீர்மானிக்காமல், காக்கிறது.
- source_word: אֶת זְנוּתֵיכֶם
  choice: உங்கள் வேசித்தனங்களை
  rationale: זְנוּת என்பதிலுள்ள வலுவான பாலியல் உருவகத்தை மறைக்காமல் காக்கிறது; இச்சூழலில் அது உடன்படிக்கைத் துரோகத்தைக் குறிக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: உங்கள் பிணங்கள் ... ஒழிந்துதீரும்வரை
  rationale: תמם என்பதன் முழுமையாக முடிவுறுதல் என்ற கருத்தையும் פגר என்பதன் கடுமையான ‘பிணம்’ என்ற பொருளையும் காக்கிறது; தலைமுறை இறந்து முடிவதை மட்டும் விளக்கவுரையாக மாற்றவில்லை.
theological_decisions:
- issue: זְנוּתֵיכֶם என்பது நேரடியான பாலியல் ஒழுக்கக்கேடா அல்லது உடன்படிக்கைத் துரோகத்திற்கான பாலியல் உருவகமா
  choice: முதன்மை உரையில் ‘வேசித்தனங்கள்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘துரோகம்’ அல்லது ‘விசுவாசமின்மை’
  rationale: எண்ணாகமம் 14-ன் சூழல் ஆண்டவருக்கு எதிரான இஸ்ரவேலின் கலகத்தைச் சுட்டுகிறது; ‘துரோகம்’ மட்டும் என மொழிபெயர்த்தால் பாலியல் உருவகம் மறையும், நேரடி பாலியல் குற்றம் மட்டும் என எடுத்தால் சூழல் அளவுக்கு மீறித் தீர்மானிக்கப்படும்.
- issue: רֹעִים என்பதை ‘மேய்ப்பவர்கள்’ என்றா ‘அலைந்து திரிபவர்கள்’ என்றா மொழிபெயர்ப்பது
  choice: மூல வேரின் நேரடிப் பொருளைத் தொடர்ந்து ‘மந்தை மேய்ப்பவர்கள்’
  alternative: ‘அலைந்து திரிபவர்கள்’
  rationale: எபிரெயச் சொல் மேய்த்தலுடன் நேரடியாகத் தொடர்புடையது. பாலைநிலத்தில் அலைதல் நியாயத்தீர்ப்பின் நடைமுறை விளைவாக இருந்தாலும், அதை முதன்மை உரையில் சொற்பொருளுக்குப் பதிலாக வைக்காமல் அடிக்குறிப்பில் தருவது ambiguity-ஐ காக்கிறது.
- issue: עַד תֹּם פִּגְרֵיכֶם என்பதிலுள்ள மரணத் தீர்ப்பின் கடுமையை எவ்வாறு வெளிப்படுத்துவது
  choice: ‘உங்கள் பிணங்கள் ... ஒழிந்துதீரும்வரை’
  alternative: ‘நீங்கள் அனைவரும் பாலைநிலத்தில் இறந்துபோகும்வரை’
  rationale: மாற்று வாசகம் பொருளை எளிதாக்கினாலும் ‘பிணங்கள்’ என்ற மூலத்தின் கடுமையான சொல்லாட்சியை நீக்கிவிடும்; தேர்ந்தெடுத்த வடிவம் நீதித்தீர்ப்பின் வலிமையையும் மூல உருவாக்கத்தையும் காக்கிறது.
