  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: ta
  text: யாவே மோசேயிடம், “எவ்வளவு காலம் இந்த மக்கள் என்னை அவமதிப்பார்கள்?[a] நான் அவர்களிடையே செய்த எல்லா அடையாளங்களையும் பொருட்படுத்தாமல், எவ்வளவு காலம் அவர்கள் என்னை நம்பாமல் இருப்பார்கள்?[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவ்வளவு காலம் இந்த மக்கள் என்னை இகழ்வார்கள்?”
    reason: נאץ என்பது அவமதித்தல், இகழ்தல், அல்லது அலட்சியமாகத் தள்ளுதல் ஆகிய நுணுக்கங்களைக் குறிக்கலாம்.
  - marker: b
    text: அல்லது, “எவ்வளவு காலம் அவர்கள் என்மீது நம்பிக்கை வைக்காமல் இருப்பார்கள்?”
    reason: אמן உடன் בְּ என்பது ஒருவரை நம்புதல் அல்லது அவர்மீது நம்பிக்கை வைத்தல் ஆகிய இரு நுணுக்கங்களையும் தரலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரேய இறைப்பெயராகிய יהוה-ஐ நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַד אָנָה
  choice: எவ்வளவு காலம்
  rationale: காலத்தைப் பற்றிய எபிரேய வினாவை இயல்பான தமிழில் தருகிறது; இருமுறை வரும் வினா அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְנַאֲצֻנִי
  choice: என்னை அவமதிப்பார்கள்
  rationale: נאץ குறிக்கும் இகழ்ச்சியோடு கூடிய நிராகரிப்பைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: கூட்டொருமையான எபிரேயச் சொல்லையும் அதன் விலக்கமான சுட்டுத்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: என்னை நம்பாமல் இருப்பார்கள்
  rationale: אמן உடன் בְּ கொண்டுள்ள நம்புதல்/நம்பிக்கை வைத்தல் என்ற உறவுசார் பொருளைத் தருகிறது; ‘என்மீது நம்பிக்கை வைக்காமல்’ என்பதும் சாத்தியம்.
- source_word: בְּכֹל הָאֹתוֹת
  choice: எல்லா அடையாளங்களையும் கண்ட பின்னும்
  rationale: בְּ-இன் சூழல்சார் விட்டுக்கொடுப்பு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடையாளங்கள் இருந்தும் நம்பாத முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: הָאֹתוֹת
  choice: அடையாளங்கள்
  rationale: אוֹת என்பதன் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அற்புத’ என்பதைச் சேர்க்கவில்லை.
- source_word: עָשִׂיתִי בְּקִרְבּוֹ
  choice: நான் அவர்கள் நடுவில் செய்த
  rationale: கூட்டொருமையான ‘இந்த மக்கள்’ என்பதைச் சுட்டும் ஒருமை பின்னொட்டைத் தமிழில் இயல்பான பன்மையாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לֹא יַאֲמִינוּ בִי என்பதிலுள்ள நம்பிக்கை மொழி
  choice: என்னை நம்பாமல் இருப்பார்கள்
  alternative: என்மீது நம்பிக்கை வைக்காமல் இருப்பார்கள்
  rationale: எபிரேய வினை அறிவுசார் நம்புதலையும் உறவுசார் நம்பிக்கை வைத்தலையும் உள்ளடக்கலாம். முதன்மை உரை இரண்டுக்கும் இடமளிக்கும் இயல்பான தமிழைப் பயன்படுத்துகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இருமுறை வரும் ‘எவ்வளவு காலம்’ என்ற கண்டன வினா பாதுகாக்கப்பட்டுள்ளது. ‘கண்ட பின்னும்’ என்பது எபிரேய முன்னிடைச்சொல்லின் சூழல்சார் விட்டுக்கொடுப்பு உறவை இயல்பாக வெளிப்படுத்துகிறது.
