  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
