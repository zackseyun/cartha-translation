    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: வாவ்-தொடர்ச்சியுடன் வரும் דבר ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது; தெய்வீக உரை அறிமுகச் சூத்திரத்தில் ‘பேசினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரும் உரையின் சமமான பெறுநர்கள் என்பதை இயல்பான நவீன தமிழில் காட்டுகிறது; மீள வரும் אֶל என்பதன் இணை அமைப்பும் ‘-இடமும் … -இடமும்’ என்பதால் பாதுகாக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை, தமிழில் தேவையற்ற ‘சொல்லி’ மீளுருவைத் தவிர்த்து ‘பேசிச் சொன்னார்’ என இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட இறைப் பெயரான திருநான்கெழுத்து உள்ளது. ஆகவே அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, பாரம்பரிய மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். எபிரெய உரை அறிமுகச் சூத்திரத்தின் முறையான தொனியைப் பேணியபடியே, சாதாரண வாசகருக்கு இயல்பாக இருக்க ‘பேசிச் சொன்னார்’ பயன்படுத்தப்பட்டது.
