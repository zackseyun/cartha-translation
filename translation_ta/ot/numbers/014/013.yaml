id: NUM.14.13
reference: Numbers 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: ta
  text: ஆனால் மோசே யாவேவிடம்[a], “அப்படியானால் எகிப்தியர்கள் கேள்விப்படுவார்கள்; ஏனெனில் உமது வல்லமையால் இந்த மக்களை அவர்கள் நடுவிலிருந்து மேலே கொண்டுவந்தீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மோசே யாவேவிடம், ‘எகிப்தியர்கள் கேள்விப்பட்டிருக்கிறார்கள்; ஏனெனில் உமது வல்லமையால் இந்த மக்களை அவர்கள் நடுவிலிருந்து மேலே கொண்டுவந்தீர்’ என்றார்.” எபிரெய வினைவடிவத்தை இறந்தகாலமாகவும், மோசேயின் வேண்டுதலில் வரும் எதிர்கால விளைவாகவும் எடுத்துக்கொள்ளலாம். சுற்றியுள்ள வாதத்துக்கு ஏற்ற எதிர்நோக்கிய பொருள் முதன்மை உரையில் தரப்பட்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் மோசே ... என்றார்
  rationale: வாவ் தொடரமைப்பு நிகழ்வை முன்னெடுத்துச் செல்கிறது; முந்தைய வசனத்தில் அறிவிக்கப்பட்ட தண்டனைக்கு மோசே எதிர்வினையாற்றுவதால், சூழலிலுள்ள முரண்பாட்டை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்பது பட்டமல்ல, இறைநாமம்; அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பு தமிழில் ‘யாவே’ என வழங்கப்பட்டது.
- source_word: וְשָׁמְעוּ
  choice: அப்படியானால் எகிப்தியர்கள் இதைக் கேள்விப்படுவார்கள்
  rationale: இந்த வினைவடிவம் இறந்தகாலமாகவும், மோசேயின் வேண்டுதலில் எதிர்கால விளைவாகவும் புரிந்துகொள்ளப்படலாம். அடுத்த வசனத்தில் தொடரும் விளைவுச் சங்கிலிக்கு ஏற்ற எதிர்நோக்கிய பொருள் முதன்மை உரையில் எடுக்கப்பட்டது; ‘இதைக்’ என்பது தமிழில் கேட்பதற்குரிய மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இந்தச் சொல் நாட்டையோ மக்களையோ குறிக்கலாம்; ‘கேள்விப்படுவார்கள்’ என்ற பன்மை வினையின் எழுவாயாக இங்கு மக்களைக் குறிப்பது இயல்பானது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எகிப்தியர்கள் கேள்விப்படுவதற்கான பின்னணி அல்லது காரணத்தை அறிமுகப்படுத்தும் விளக்கச் செயல்பாடு பாதுகாக்கப்பட்டது.
- source_word: הֶעֱלִיתָ
  choice: மேலே கொண்டுவந்தீர்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற அடிப்படை உருவகம் பாதுகாக்கப்பட்டது; யாத்திராகமச் சூழலில் எகிப்திலிருந்து விடுவித்து அழைத்துவருதலை இது குறிக்கிறது.
- source_word: בְכֹחֲךָ
  choice: உமது வல்லமையால்
  rationale: בְּ இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; இறைவனுடைய வல்லமைக்கு உள்ள அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עַם என்பது ஒருமை கூட்டுப்பெயர்; தமிழில் பொருத்தமான கூட்டுப்பொருளுடன் ‘இந்த மக்களை’ என இயல்பாக வழங்கப்பட்டது.
- source_word: מִקִּרְבּוֹ
  choice: அவர்கள் நடுவிலிருந்து
  rationale: ஒருமை பின்னொட்டு எகிப்தை ஒரு கூட்டு தேசிய அலகாகக் குறிக்கிறது; தமிழில் எகிப்திய மக்களை நோக்கி ‘அவர்கள் நடுவிலிருந்து’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா அல்லது ‘கர்த்தர்’
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைநாமத்தை ஒரு பட்டமாக மாற்றாமல், தனிப்பட்ட உடன்படிக்கைப் பெயராக ஒலிபெயர்த்து வழங்குகிறது.
- issue: וְשָׁמְעוּ வினையின் காலம்
  choice: 'எதிர்கால விளைவு: ‘கேள்விப்படுவார்கள்’'
  alternative: 'இறந்த/நிறைவுற்ற செயல்: ‘கேள்விப்பட்டிருக்கிறார்கள்’'
  rationale: எபிரெய வடிவம் இருவிதமாகப் புரிந்துகொள்ள இடமளித்தாலும், இஸ்ரவேல் அழிக்கப்பட்டால் பிற நாடுகள் என்ன சொல்லும் என மோசே முன்வைக்கும் தொடர்வாதம் எதிர்கால விளைவுப் பொருளை ஆதரிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. இறைவனை நோக்கும் உரையில் ‘உமது/கொண்டுவந்தீர்’ என்ற மரியாதை ஒருமை பேணப்பட்டது. மூலத்தின் காரணத் தொடர்பும், ‘மேலே கொண்டுவருதல்’ என்ற உருவகமும், வினைக்காலத்தின் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டன.
