- from: யாவே நம்மேல் பிரியமாயிருந்தால்[a], அவர் நம்மை இந்த நாட்டிற்குள் கொண்டுபோய், அதை நமக்குத் தருவார்—இது பாலும் தேனும் வழிந்தோடும் நாடு.
  to: யாவே நம்மேல் பிரியம்கொண்டால்[a], அவர் நம்மை இந்த நாட்டிற்குள் கொண்டுபோய், அதை நமக்குத் தருவார்—அது பாலும் தேனும் வழிந்தோடும் ஒரு நாடு.
