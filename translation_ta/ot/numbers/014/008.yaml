  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: ta
  text: யாவே நம்மேல் பிரியம்கொண்டால்[a], அவர் நம்மை இந்த நாட்டிற்குள் கொண்டுபோய், அதை நமக்குத் தருவார்—அது பாலும் தேனும் வழிந்தோடும் ஒரு நாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மில் மகிழ்ந்தால்” அல்லது “நமக்குத் தயவு காட்டினால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …ஆயிருந்தால்
  rationale: நிபந்தனையை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் இயல்பான தமிழாக்கம்; அதை உறுதியைக் குறிக்கும் ‘போது’ என்று மாற்றவில்லை.
- source_word: חָפֵץ בָּנוּ
  choice: நம்மேல் பிரியமாயிருந்தால்
  rationale: மகிழ்ச்சி, விருப்பம், சாதகமான மனநிலை ஆகியவற்றை உள்ளடக்கும் חפץ என்பதன் தனிப்பட்ட, உணர்வுபூர்வமான பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய மூலத்திலுள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: அவர் நம்மை இந்த நாட்டிற்குள் கொண்டுபோய்
  rationale: இங்கு நிபந்தனையின் விளைவைத் தெரிவிக்கும் தொடராக உள்ளது; வெறுமனே நாட்டின் அருகே கொண்டுவருவதல்ல, அதற்குள் நுழையச் செய்வது என்ற சூழல்சார் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וּנְתָנָהּ לָנוּ
  choice: அதை நமக்குத் தருவார்
  rationale: பின்னொட்டு முன்பு குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது; נתן என்பதன் நேரடியான பொருளான ‘தருதல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: இது பாலும் தேனும் வழிந்தோடும் நாடு
  rationale: செழிப்பையும் வளத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரை, தமிழில் நன்கு புரியும் உருவகமாகத் தக்கவைக்கிறது; ‘வழிந்தோடும்’ என்பது மிகுதியை உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் தமிழாக்கம்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரை தேவனுடைய நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: யாவேயின் சாதகமான மனநிலையை வெளிப்படுத்துதல்
  choice: நம்மேல் பிரியமாயிருந்தால்
  alternative: நம்மில் மகிழ்ந்தால்; நமக்குத் தயவு காட்டினால்
  rationale: חפץ என்பதில் மகிழ்ச்சி அல்லது பிரியம் என்ற உணர்வும் சாதகமான மனநிலையும் ஒன்றாக உள்ளன. முதன்மை உரை உணர்வுபூர்வமான அம்சத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பாலும் தேனும் வழிந்தோடும் நாடு’ என்ற பரிச்சயமான வேதாகம உருவகம் காக்கப்பட்டுள்ளது; நிபந்தனையின் உண்மையான திறந்தநிலை தீர்த்துவைக்கப்படவில்லை.
