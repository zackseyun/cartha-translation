  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: ta
  text: 'அவர்களிடம் சொல்: “என் வாழ்வின்மேல் ஆணை; நீங்கள் நான் கேட்கும்படி பேசியபடியே, நிச்சயமாக நான் உங்களுக்குச் செய்வேன் என்று கர்த்தர் அறிவிக்கிறார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָ֨נִי֙
  choice: என் உயிரின்மேல் ஆணை
  rationale: சொல்லுக்கு சொல் ‘நான் உயிரோடிருப்பது போல’ என்ற தெய்வீக ஆணைமொழியை, தமிழில் இயல்பாகவும் அதன் உறுதிப்பாட்டைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: נְאֻם יְהוָה
  choice: என்று கர்த்தர் அறிவிக்கிறார்
  rationale: נְאֻם என்பதன் தீர்க்கதரிசன அறிவிப்பு நயத்தை ‘அறிவிக்கிறார்’ தக்கவைக்கிறது; יהוה என்பதற்கு தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் ‘கர்த்தர்’ பயன்படுத்தப்பட்டது.
- source_word: אִם לֹא
  choice: நிச்சயமாக
  rationale: ஆணைமொழிச் சூழலில் சொற்பொருளான ‘இல்லையென்றால்’ என்பதற்குப் பதிலாக, எபிரேய உறுதிமொழியின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: நீங்கள் நான் கேட்கும்படி பேசியபடியே
  rationale: ‘என் காதுகளில் பேசினீர்கள்’ என்ற எபிரேய மொழிவழக்கின் பொருளைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தருகிறது.
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: நான் உங்களுக்குச் செய்வேன்
  rationale: மூலத்தின் நேரடியான தண்டனை அறிவிப்பையும் ‘உங்களுக்கு’ என்ற இரண்டாம் நபர் பன்மையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: யெகோவா / யாவே
  rationale: கொடுக்கப்பட்ட ஆலோசனை உரையின் LORD மரபுடன் ஒத்துப்போகவும், நவீன தமிழ் வாசகர்களுக்கு நன்கு அறியப்பட்ட வேதாகமப் பயன்பாட்டைப் பின்பற்றவும் ‘கர்த்தர்’ தேர்ந்தெடுக்கப்பட்டது; குறிப்பிட்ட உச்சரிப்பைத் திணிக்கவில்லை.
- issue: தெய்வீக ஆணைமொழியின் உறுதிப்பாடு
  choice: ‘என் உயிரின்மேல் ஆணை’ ... ‘நிச்சயமாக’
  alternative: ‘நான் உயிரோடிருப்பது எவ்வளவு நிச்சயமோ’
  rationale: தேவன் தம்மையே சாட்சியாகக் கொண்டு உரைக்கும் ஆணைமொழியின் தீவிரத்தையும் אִם לֹא என்பதன் உறுதியையும் காக்கிறது; வாக்கியத்தை வெறும் ஒப்புமையாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் தீர்ப்பறிவிப்பின் கடுமையும் கொண்ட நடை. எபிரேய சொற்றொடர்களை இயந்திரமாய் பின்பற்றாமல், ஆணைமொழியின் வடிவமும் ‘பேசியபடியே செய்வேன்’ என்ற அளவொத்த பதிலின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
