  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: ta
  text: 'இந்த மக்களை ஒரே மனிதனைப்போல்[a] நீர் கொன்றுவிட்டால், உம்மைப் பற்றிய செய்தியைக் கேட்டிருக்கிற நாடுகள்[b] இப்படிச் சொல்லும்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரே மனிதனைப்போல்”; முழு மக்களையும் ஒன்றாக அல்லது ஒரே நேரத்தில் கொல்வது என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உமது புகழைக் கேட்டிருக்கிற நாடுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: நீர் கொன்றுவிட்டால்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்/கொல்’ என்று பொருள்படும். எபிரெய இணைப்புச் சொல் நேரடியாக ‘மற்றும்’ என்றாலும், முந்தைய வசனத்திலிருந்து தொடரும் மோசேயின் நிபந்தனை வாதத்தை இயல்பான தமிழில் வெளிப்படுத்த ‘-விட்டால்’ பயன்படுத்தப்பட்டது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עָם இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; சுட்டுப் பொருளையும் கூட்டுக் குறிப்பையும் ‘இந்த மக்கள்’ காக்கிறது.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: சொல்லுக்குச் சொல் வடிவத்தையும், மக்கள் அனைவரும் ஒன்றாக அல்லது ஒரே நேரத்தில் அழிக்கப்படுதல் என்ற மரபுத்தொடரின் வலிமையையும் காக்கிறது.
- source_word: הַגּוֹיִם
  choice: நாடுகள்
  rationale: இஸ்ரவேலுக்கு அப்பாற்பட்ட மக்களினங்களைக் குறிக்கும் இயல்பான பழைய ஏற்பாட்டு பயன்பாடு; பிற்கால மதச்சார்பு நிழல்களைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: உம்மைப் பற்றிய செய்தியைக் கேட்டிருக்கிற
  rationale: שֵׁמַע என்பது ‘செய்தி, அறிக்கை, புகழ்’ எனப் பொருள்படலாம். ‘உம்மைப் பற்றிய செய்தி’ என்பது இலக்கண உறவையும் பொருள் தெளிவையும் காக்கிறது; ‘உமது புகழ்’ என்ற சாத்தியமான பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: לֵאמֹר
  choice: 'இப்படிச் சொல்லும்:'
  rationale: அடுத்த வசனத்தில் வரும் நாடுகளின் கூற்றை அறிமுகப்படுத்தும் infinitive-ஐ இயல்பான தமிழில் எதிர்கால வினையாக வழங்குகிறது.
theological_decisions:
- issue: ஆண்பால் ஒருமைச் சொல்லைக் கொண்ட எபிரெய மரபுத்தொடர்
  choice: ஒரே மனிதனைப்போல்
  alternative: அனைவரையும் ஒரே நேரத்தில்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் குறிக்கவில்லை; முழு மக்களும் ஒரே அலகாக ஒரே முடிவைச் சந்திப்பதைச் சொல்லும் மரபுத்தொடர். மூலத்தின் உருவக வடிவம் பிரதான உரையில் காக்கப்பட்டு, அதன் கூட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: שִׁמְעֲךָ என்பதன் பொருள் வரம்பு
  choice: உம்மைப் பற்றிய செய்தி
  alternative: உமது புகழ்
  rationale: இச்சொல் கர்த்தரின் செயல்களைப் பற்றிய செய்தியையும் அதனால் உண்டான புகழையும் குறிக்கக்கூடும். பிரதான உரை ‘செய்தி’ என்ற நேரடியான பொருளைத் தேர்ந்து, உண்மையான சொற்பொருள் மாற்றை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தேவனை நோக்கிய உரையாதலால் ‘நீர்/உம்மை’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. அடுத்த வசனத்தில் தொடரும் நேரடி கூற்றை எதிர்நோக்கி இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
