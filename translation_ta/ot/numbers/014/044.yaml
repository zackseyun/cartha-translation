source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: ta
  text: ஆனால் அவர்கள் துணிகரமாக மலையின் உச்சிக்கு ஏறிச் சென்றார்கள்.[a] யாவேயின் உடன்படிக்கைப் பெட்டியும்[b] மோசேயும் முகாமின் நடுவிலிருந்து புறப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துணிகரமாக’ என்பதற்கு ‘அத்துமீறித் துணிந்தார்கள்’ அல்லது ‘அடங்காமல் ஏறிச் சென்றார்கள்’ என்றும் பொருள் கொள்ளலாம். எபிரெய வினை தன்னிச்சையான, வரம்புமீறிய செயலை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘யாவேயின் உடன்படிக்கைப் பெட்டி’; இதை ‘யாவேயுடைய உடன்படிக்கையின் பெட்டி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: துணிகரமாக ... ஏறிச் சென்றார்கள்
  rationale: இந்த வினை வெறும் துணிவை அல்ல, எச்சரிக்கையை மீறிய தன்னிச்சையானதும் குற்றத்துக்குரியதுமான முயற்சியைக் குறிக்கிறது. ‘துணிகரமாக’ என்பது அந்த எதிர்மறை நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַעֲלוֹת
  choice: ஏறிச் சென்றார்கள்
  rationale: மேல்நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய வினையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶל רֹאשׁ הָהָר
  choice: மலையின் உச்சிக்கு
  rationale: רֹאשׁ என்பதன் சொற்பொருள் ‘தலை’; இங்கு இடவழக்கில் ‘உச்சி’ என்று பொருள். הָהָר ஒருமையில் இருப்பதால் ‘மலை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமை அமைப்பில் தருகிறது; இதை ‘யாவேயுடைய உடன்படிக்கையின் பெட்டி’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּמֹשֶׁה
  choice: மோசேவும்
  rationale: பெயர் தமிழில் வழக்கமான வடிவில் தரப்பட்டுள்ளது; ‘பெட்டியும் மோசேயும்’ என்ற இணை எழுவாய்க்கு ஏற்றவாறு வேற்றுமை அமைக்கப்பட்டுள்ளது.
- source_word: לֹא מָשׁוּ
  choice: புறப்படவில்லை
  rationale: מוש இங்கு இருந்த இடத்தைவிட்டு நகருதல் அல்லது அகலுதல் என்று பொருள். முகாமிலிருந்து உடன்படிக்கைப் பெட்டியும் மோசேயும் செல்லவில்லை என்ற கருத்தை ‘புறப்படவில்லை’ தெளிவாகத் தருகிறது.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: முகாமின் நடுவிலிருந்து
  rationale: קֶרֶב என்பதன் ‘நடுவில்/உள்ளே’ என்ற இடப்பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיַּעְפִּלוּ என்பதில் இஸ்ரவேலரின் செயலுக்குள்ள அறநெறி நுணுக்கம்
  choice: துணிகரமாக ... ஏறிச் சென்றார்கள்
  alternative: துணிந்து ஏறிச் சென்றார்கள்; இறுமாப்புடன் ஏறிச் சென்றார்கள்; அடங்காமல் ஏறிச் சென்றார்கள்
  rationale: சூழலில் இது தேவனுடைய கட்டளைக்கு மாறான தன்னிச்சையான முயற்சி. ‘துணிகரமாக’ குற்றத்துக்குரிய அத்துமீறலை உணர்த்துகிறது; ஆனால் ‘இறுமாப்பு’ அல்லது ‘கலகம்’ போன்ற குறிப்பிட்ட உள்நோக்கத்தை அளவுக்கு மீறி விதிப்பதில்லை.
- issue: வாக்கிய இணைப்பின் எதிர்மறைத் தொடர்பு
  choice: ஆனால் ... புறப்படவில்லை
  alternative: அவர்கள் ... சென்றார்கள்; எனினும் ... புறப்படவில்லை
  rationale: וַ என்ற தொடரிணைப்பு இச்சூழலில் மக்களின் ஏற்றத்துக்கும் பெட்டியும் மோசேயும் செல்லாததற்கும் உள்ள முரண்பாட்டை உணர்த்துகிறது. தமிழில் ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘துணிகரமாக’ மூல வினையின் எதிர்மறை நுணுக்கத்தைத் தக்கவைக்கிறது. முதன்மை உரையில் அடி குறிப்புகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வரிசையாக [a], [b] என இடப்பட்டுள்ளன.
