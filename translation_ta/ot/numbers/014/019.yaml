revisions:
- from: உமது மாறாத அன்பின் பெருமைக்கேற்ப இந்த மக்களின் அக்கிரமத்தை மன்னித்தருளும்; எகிப்திலிருந்து இன்றுவரை இந்த மக்களை நீர் சுமந்து வந்ததுபோலவே[a] இப்போதும் செய்யும்.
  to: உமது மாறாத அன்பின் பெருமைக்கேற்ப, இந்த மக்களின் அக்கிரமத்தை மன்னித்தருளும்; எகிப்திலிருந்து இன்றுவரை இந்த மக்களை நீர் தாங்கி வந்ததுபோலவே[a].
