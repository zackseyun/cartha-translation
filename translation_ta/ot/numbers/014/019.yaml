source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: ta
  text: உமது மாறாத அன்பின் பெருமைக்கேற்ப, இந்த மக்களின் அக்கிரமத்தை மன்னித்தருளும்; எகிப்திலிருந்து இன்றுவரை இந்த மக்களை நீர் தாங்கி வந்ததுபோலவே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்திலிருந்து இன்றுவரை இந்த மக்களை நீர் மன்னித்து வந்ததுபோலவே.” எபிரெய வினைச்சொல் ‘தூக்குதல்/தாங்குதல்’ என்றும், சில சூழல்களில் ‘மன்னித்தல்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: மன்னித்தருளும்
  rationale: סלח என்பதன் கட்டளை வடிவத்துடன் வரும் נָא ஓர் உருக்கமான வேண்டுதலைக் குறிக்கிறது. மரியாதையும் மன்றாட்டின் தீவிரமும் இயல்பான தமிழில் வெளிப்படுவதற்கு ‘மன்னித்தருளும்’ பொருத்தமானது.
- source_word: לַעֲוֺן
  choice: அக்கிரமத்தை
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி, அல்லது குற்றத்தின் விளைவு ஆகியவற்றைக் குறிக்கலாம். இங்கு மன்னிப்புக்குரிய மக்களின் குற்றச்செயல் முன்னிலையில் இருப்பதால், அதன் அறநெறிசார் கனத்தை ‘அக்கிரமம்’ காக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை / இந்த மக்களின்
  rationale: עַם ஒருமைத் தொகுப்புப் பெயர். தமிழ் இலக்கணத்திற்கேற்ப வேற்றுமை உருபுகள் மாறினாலும், ‘இந்த மக்கள்’ என்பது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் தொகுப்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: உமது மாறாத அன்பின் பெருமைக்கேற்ப
  rationale: גֹּדֶל என்பது ‘பெருமை’; חֶסֶד என்பது உறுதியான, விசுவாசமுள்ள அன்பையும் இரக்கத்தையும் சுட்டுகிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த உறவுசார் நுண்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְכַאֲשֶׁר
  choice: போலவே
  rationale: இணைப்புச்சொல் தேவனுடைய முந்தைய செயலுடன் ஒப்பிட்டு வேண்டுவதை அறிமுகப்படுத்துகிறது; ‘போலவே’ அந்த முன்னுதாரணத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: נָשָׂאתָה
  choice: நீர் சுமந்து வந்தது
  rationale: נשא என்பதன் அடிப்படைப் பொருள் தூக்குதல் அல்லது சுமத்தல்; பாவம் தொடர்பான சூழல்களில் மன்னித்தல் என்றும் பொருள்படலாம். இங்கு நேரடிப் பொருள் மக்களே என்பதால், தேவன் அவர்களைப் பொறுமையுடன் தாங்கி நடத்திவந்தார் என்ற உருவகத்தை ‘சுமந்து வந்தது’ பாதுகாக்கிறது.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: எகிப்திலிருந்து இன்றுவரை
  rationale: எகிப்திலிருந்து நிகழ்காலம் அல்லது தற்போதைய இடம் வரையிலான தொடர்ச்சியை இச்சொற்றொடர் குறிக்கிறது. சூழலில் காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்த ‘இன்றுவரை’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: மோசேயின் வேண்டுதலில் נָשָׂאתָה என்பதன் பொருள்
  choice: தேவன் மக்களைச் சுமந்து வந்தார்—அதாவது பொறுமையுடன் தாங்கி நடத்தினார்; இதில் மன்னிப்பும் உட்படலாம், ஆனால் பொருள் அதற்கு மட்டும் சுருக்கப்படவில்லை.
  alternative: எகிப்திலிருந்து இன்றுவரை இந்த மக்களை நீர் மன்னித்து வந்ததுபோலவே
  rationale: வினையின் நேரடிப் பொருள் மக்களின் ‘அக்கிரமம்’ அல்ல, ‘இந்த மக்கள்’ என்பதால் சுமத்தல்/தாங்குதல் என்ற விரிவான பொருள் முன்னுரிமை பெறுகிறது. அதேவேளையில், பாவச் சூழலில் ‘மன்னித்தல்’ என்ற பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் மன்றாட்டின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அக்கிரமம்’ வேதப்பண்புள்ளதாயினும் பொதுவாகப் புரிந்துகொள்ளக்கூடிய அறநெறிசார் கனமுடைய சொல். ‘சுமந்து வந்தது’ மூல உருவகத்தையும் மன்னிப்பு/பொறுமை இடையிலான உண்மையான பொருள் நெருக்கடியையும் காக்கிறது.
