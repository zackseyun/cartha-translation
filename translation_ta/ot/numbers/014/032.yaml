source:
  edition: WLC
  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: ta
  text: ஆனால் நீங்களோ, உங்கள் பிணங்கள்[a] இந்தப் பாலைநிலத்தில் விழும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் சடலங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: ஆனால் … உங்கள் பிணங்கள்
  rationale: פֶּגֶר என்பது இறந்த உடலை, அதாவது பிணத்தை, குறிக்கிறது. ‘பிணங்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தீர்ப்பின் கடுமையை மறைக்காமலும் உள்ளது. முன்னொட்டு וּ சூழலில் உள்ள முரண்பாட்டை வெளிப்படுத்த ‘ஆனால்’ என்று தரப்பட்டுள்ளது.
- source_word: אַתֶּם
  choice: நீங்களோ
  rationale: தனித்து வரும் வலியுறுத்தப்பட்ட பன்மைச் சுட்டுப்பெயரின் முரண்பாட்டு வலிமையை ‘-ஓ’ வெளிப்படுத்துகிறது.
- source_word: יִפְּלוּ
  choice: விழும்
  rationale: נפל என்பதன் நேரடியான படிமத்தைப் பேணுகிறது; மரணப் பொருள் ‘பிணங்கள்’ என்பதிலேயே தெளிவாகிறது.
- source_word: בַּ/מִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பில்லாத வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது. ‘பாலைநிலம்’ சாதாரண நவீனத் தமிழில் இயல்பாகவும் இச்சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הַ/זֶּה
  choice: இந்த
  rationale: இஸ்ரவேலர் அப்போது இருந்த குறிப்பிட்ட பாலைநிலத்தைச் சுட்டுகிறது; கூடுதல் வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: פִגְרֵיכֶם என்பதில் தீர்ப்பின் உடல்சார்ந்த கடுமை
  choice: உங்கள் பிணங்கள்
  alternative: உங்கள் சடலங்கள்
  rationale: தெய்வீகத் தீர்ப்பின் தெளிவான, அதிர்ச்சியூட்டும் உடல்சார்ந்த படிமத்தை இது பாதுகாக்கிறது; அதேவேளை மூலத்தில் இல்லாத கூடுதல் கடுமையைச் சேர்ப்பதில்லை.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களோ’ என்பது எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலையும் முந்தைய சூழலுடனான முரண்பாட்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
