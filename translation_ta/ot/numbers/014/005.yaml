base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: ta
  text: அப்போது மோசேயும் ஆரோனும் இஸ்ரவேல் மக்களின்[a] சமூகத்தின் முழுச் சபையின்[b] முன்னிலையில் முகங்குப்புற விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, ‘இஸ்ரவேலின் மகன்கள்’; ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சமூகத்தின் முழுச் சபை’ என்பதற்கான எபிரேயச் சொற்றொடர், வலியுறுத்தலுக்காக ஒன்றோடொன்று தொடர்புடைய இரண்டு சமூகச் சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: விழுந்தார்கள்
  rationale: נפל என்பதன் அடிப்படைப் பொருளான ‘விழுதல்’ தக்கவைக்கப்படுகிறது. மோசேயும் ஆரோனும் என்ற இரட்டை எழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது; அடுத்து வரும் ‘முகங்குப்புற’ என்பது பணிவுடன் தரையில் விழுந்த நிலையைக் காட்டுகிறது.
- source_word: עַל־פְּנֵיהֶם
  choice: முகங்குப்புற
  rationale: முகம் தரையை நோக்கி விழுந்த அல்லது பணிந்த நிலையைக் குறிக்கும் எபிரேய மரபுத்தொடருக்கு இயல்பான, தெளிவான நவீனத் தமிழ் இணை.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: முழுக் கூட்டத்தின் முன்னிலையிலும் பார்வையிலும் நடந்த செயல் என்பதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: כָּל
  choice: முழுவதற்கும்
  rationale: கூட்டத்தின் எந்தப் பகுதியையும் விலக்காமல் அதன் முழுமையையும் குறிக்கிறது.
- source_word: קְהַל
  choice: கூட்டம்
  rationale: கூடி நிற்கும் மக்களின் ஒன்றுகூடலைக் குறிக்கிறது.
- source_word: עֲדַת
  choice: சபை
  rationale: ஒழுங்குபெற்ற சமூக அமைப்பாகிய மக்களைக் குறிக்கிறது; קהל என்பதுடன் வரும் தொடர்புடைய இரண்டாவது சமூகச் சொல்லையும் மொழிபெயர்ப்பில் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேயத்தில் சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் மக்களினத்தைக் குறிக்கும் நிலையான பெயரிடல். ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கிய சமூகப் பொருளைத் தெளிவாகவும் வழங்குகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: קְהַל עֲדַת என்ற இரட்டை சமூகச் சொல்லை ஒரே சொல்லாகச் சுருக்குவதா
  choice: ‘சபைக் கூட்டம்’ என்று இரு கூறுகளையும் தக்கவைத்தல்
  alternative: ‘முழுச் சபை’ அல்லது ‘மக்கள் கூட்டம்’
  rationale: மூலத்தில் ஒன்றோடொன்று தொடர்புடைய இரு சமூகப் பெயர்ச்சொற்கள் உள்ளன. அவற்றை ‘சபைக் கூட்டம்’ என்று வழங்குவது பொதுமக்களின் ஒழுங்குபெற்ற சமூகத்தையும் அச்சமயத்தில் கூடியிருந்த கூட்டத்தையும் வெளிப்படுத்தி, மூலத்தின் வலியுறுத்தலைச் சீராக்காமல் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதை சொற்சொல்லாக ஆண்பால் வடிவில் வழங்குவதா
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’; சொற்சொல் வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘இஸ்ரவேலின் மகன்கள்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்’
  rationale: இந்த நிலையான எபிரேய இனப்பெயர் சூழலில் சமூகமெங்கும் குறிக்கிறது; ஆண்களை மட்டும் குறுக்குவது அல்ல. இயல்பான தமிழ் பொருளை முதன்மை உரையில் வழங்கி, மூலத்தின் வடிவத்தை அடிக்குறிப்பில் வெளிப்படையாகக் காப்பது தேவையற்ற பாலினக் கட்டுப்பாட்டையோ கோட்பாட்டு முடிவையோ புகுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘முகங்குப்புற விழுந்தார்கள்’ மூலத்தின் உடல்நிலைச் சித்திரத்தை விளக்கவுரை சேர்க்காமல் தக்கவைக்கிறது; ‘சபைக் கூட்டம்’ மூலத்தின் இரட்டை சமூக வெளிப்பாட்டைப் பாதுகாக்கிறது.
