source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: ta
  text: அந்த நாட்டைப் பற்றிய தீய அறிக்கையைக் கொண்டுவந்த அந்த மனிதர்கள் யாவேயின் முன்னிலையில் கொள்ளைநோயால் இறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: இறந்தார்கள்
  rationale: מות என்ற வேர்ச்சொல்லின் Qal wayyiqtol வடிவம்; கடந்தகாலத் தொடர்நிகழ்வை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட உளவாளிகளைச் சுட்டும் definite, anaphoric பயன்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: அந்த நாட்டைப் பற்றிய தீய செய்தியைக் கொண்டுவந்த
  rationale: பங்கேற்புவினை அமைப்பு அவர்களை அவர்களது முந்தைய செயலால் அடையாளப்படுத்துகிறது. הוציא என்பதன் ‘கொண்டுவருதல்/வெளியே கொண்டுவருதல்’ உருவகத்தையும் דִבָּה என்பதன் தீங்கான அறிக்கை என்ற பொருளையும் காக்கிறது.
- source_word: רָעָה
  choice: தீய
  rationale: இங்கு அறிக்கையின் தீங்கானதும் பழிசுமத்தும் தன்மையையும் ‘தீய செய்தி’ இயல்பாகவும் செறிவாகவும் தெரிவிக்கிறது.
- source_word: בַּמַּגֵּפָה
  choice: கொள்ளைநோயால்
  rationale: מַגֵּפָה என்பது பேரழிவை உண்டாக்கும் நோய் அல்லது தெய்வீகத் தாக்குதலைக் குறிக்கலாம்; கருவிப்பொருளிலான בְ தமிழில் ‘-ஆல்’ என இயல்பாக வருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை/சந்நிதி உணர்வைத் தக்கவைத்து, יְהוָה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப் பெயரைப் பொதுவாகத் தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது; ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றவில்லை.
- issue: בַּמַּגֵּפָה குறிக்கும் மரணத்தின் தன்மை
  choice: கொள்ளைநோயால்
  alternative: வாதையால்; பேரிடித் தாக்குதலால்
  rationale: இது சாதாரண மரணம் அல்லாமல் யெகோவாவின் முன்னிலையில் நிகழ்ந்த தண்டனை என்பதைச் சூழல் காட்டுகிறது; அதேவேளையில் மூலச்சொல் அனுமதிப்பதைவிட தண்டனையின் துல்லிய வடிவத்தை அதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெய வாக்கியத்தின் காரண/கருவி மற்றும் தெய்வீக முன்னிலைச் சாயல்கள் பாதுகாக்கப்பட்டுள்ளன.
