source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: ta
  text: அப்பொழுது யாவே, “உன் வார்த்தையின்படியே நான் மன்னித்தேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ சொன்னபடியே நான் மன்னித்தேன்.”
    reason: כִּדְבָרֶךָ என்பதற்கான செல்லத்தக்க மாற்று வெளிப்பாடு; சலַחְתִּי என்பதன் நேரடியான ‘மன்னித்தேன்’ என்ற பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்கதை அமைப்பில் நிகழ்வை முன்னெடுத்துச் செல்கிறது. நவீன தமிழில் ‘அப்போது ... என்றார்’ என்பது இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: סָלַחְתִּי
  choice: நான் மன்னித்தேன்
  rationale: סלח என்பது மன்னித்தல் அல்லது குற்றத்தைப் பொறுத்தல் என்பதைக் குறிக்கிறது. எபிரெய நிறைவுவினையைத் தமிழில் இயல்பான இறந்தகால நிறைவாக ‘மன்னித்தேன்’ வெளிப்படுத்துகிறது.
- source_word: כִּדְבָרֶךָ
  choice: உன் வார்த்தையின்படியே
  rationale: כְּ முன்னொட்டையும் דָּבָר என்ற பெயர்ச்சொல்லையும் நெருக்கமாகப் பாதுகாத்து, மோசேயின் வேண்டுதலுக்கு இணங்க வழங்கப்பட்ட மன்னிப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: மன்னிப்பு முழுமையான தண்டனை நீக்கத்தைக் குறிக்கிறதா?
  choice: மூலத்தின் ‘நான் மன்னித்தேன்’ என்ற கூற்றை மட்டும் பாதுகாத்தல்
  alternative: எல்லாத் தண்டனையையும் நீக்கிவிட்டேன்
  rationale: தொடரும் சூழலில் விளைவுகள் நீடிப்பதால், ‘மன்னித்தேன்’ என்பதற்கு மூலத்தில் இல்லாத முழுமையான தண்டனை நீக்கம் என்ற விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டது. நேரடி உரையில் ‘உன்’ என்பது எபிரெய ஒருமை இரண்டாம் நபரைத் துல்லியமாகக் காட்டுகிறது; ‘-படியே’ மூலத்தில் உள்ள ‘உன் வார்த்தையின்படி’ என்ற தொடர்பை வலியுறுத்துகிறது.
