  source_fidelity: மூல எபிரெய வாக்கியத்தின் படைநகர்வு, கூட்டு இனக்குழு எழுவாய், ‘அந்த மலைநாட்டில் குடியிருந்த’ என்ற வரையறை, தொடர்ந்து வரும் தாக்குதல் மற்றும் நசுக்கித் தோற்கடித்தல் ஆகிய இரு வினைச்செயல்கள், மேலும் ஓர்மா வரை என்ற எல்லைக் குறிப்பு அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘முறியடித்தார்கள்’ என்பது וַיַּכְּתוּם என்பதன் வலுவான போர்ச் சூழல் விளைவுக்கு ஏற்றது; முழு அழிவைத் தேவையற்ற வகையில் சுட்டவில்லை.
  naturalness: உரை நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘இறங்கி வந்து’ மற்றும் ‘மலைநாட்டில் குடியிருந்த’ என்பன சூழலுக்கு ஏற்றவை. தொடர்ச்சியான வினைகளில் கமா பயன்பாடு வாசிப்பைச் சிறிது இடைநிறுத்தினாலும் மொழிபெயர்ப்பின் இயல்பையோ பொருளையோ பாதிக்கவில்லை.
  terminology: ‘அமலேக்கியர்,’ ‘கானானியர்,’ ‘ஓர்மா’ ஆகிய பெயர்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்திசைகின்றன. இடப்பெயரை முதன்மை உரையில் ஒலிபெயர்ப்பாக வைத்திருப்பதும், அதன் எபிரெய சொற்பொருள் தொடர்பை அடிக்குறிப்பில் விளக்குவதும் சரியான நடை.
