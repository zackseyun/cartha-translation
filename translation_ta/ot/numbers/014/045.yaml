  edition: WLC
  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: ta
  text: அப்போது, அந்த மலைநாட்டில் குடியிருந்த அமலேக்கியரும் கானானியரும் இறங்கி வந்து, அவர்களைத் தாக்கி, ஓர்மா[a] வரைக்கும் அவர்களை முறியடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓர்மா என்பது ஓர் இடப்பெயர். இந்த எபிரெயப் பெயர், ‘அழிவு’ அல்லது ‘அழிவுக்கென்று ஒதுக்கிவைத்தல்’ என்று பொருள்படும் சொல்லுடன் தொடர்புடையது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்து
  rationale: மலைநாட்டிலிருந்து கீழ்நோக்கிய படைநகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கூட்டு எழுவாய்க்கு முன் ஒருமை வினை வருவது எபிரெய மொழியின் வழக்கமான அமைப்பு.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: அமலேக்கியரும் கானானியரும்
  rationale: வடிவத்தில் ஒருமையாக இருந்தாலும், இரு இனப்பெயர்களும் இங்கு மக்கள்குழுக்களைக் குறிக்கும் தொகுப்பொருளில் வருகின்றன; ஆகவே தமிழில் பன்மைப் பொருள் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: அந்த மலைநாட்டில் குடியிருந்த
  rationale: יֹשֵׁב என்பது குடியிருத்தலைக் குறிக்கிறது; הָר இச்சூழலில் தனி மலையைவிட ஒரு மலைப்பாங்கான பகுதியைக் குறிப்பதால் ‘மலைநாடு’ பொருத்தமானது.
- source_word: וַיַּכּוּם
  choice: அவர்களைத் தாக்கி
  rationale: נכה என்பதன் அடித்தல் அல்லது தாக்குதல் என்ற நேரடியான படைச்செயல் பொருளைப் பாதுகாக்கிறது; தோல்வியின் அளவை அடுத்த வினைக்கு முன்பே மிகைப்படுத்தவில்லை.
- source_word: וַיַּכְּתוּם
  choice: அவர்களை முறியடித்தார்கள்
  rationale: முந்தைய தாக்குதலைவிட வலுவான நசுக்குதல் அல்லது போரில் தோற்கடித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; முழுமையாக அழித்தார்கள் என்று அளவுக்கு மீறிப் பொருள் கொள்ளவில்லை.
- source_word: עַד הַחָרְמָה
  choice: ஓர்மா வரைக்கும்
  rationale: עַד எல்லையையோ சென்றடைந்த தொலைவையையோ குறிக்கிறது; இடப்பெயருடன் ‘வரைக்கும்’ என்பது அந்த முறியடிப்பின் புவியியல் எல்லையைத் தெளிவாக்குகிறது.
- source_word: הַחָרְמָה
  choice: ஓர்மா
  rationale: இது இடப்பெயர் என்பதால் முதன்மை உரையில் மொழிபெயர்க்காமல் தமிழ் ஒலிபெயர்ப்பாகத் தரப்பட்டுள்ளது; பெயரின் பொருள் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
