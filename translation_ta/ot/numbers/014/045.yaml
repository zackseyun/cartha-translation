translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் தொடர்ச்சியான இரண்டு படை வினைகளின் வேறுபாடு ‘தாக்கி, ... முறியடித்தார்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது; இடப்பெயரின் சொற்பொருள் முதன்மை உரையில் திணிக்காமல் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
