id: NUM.14.41
reference: Numbers 14:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: ta
  text: ஆனால் மோசே, “நீங்கள் ஏன் இப்படி யாவேயின் கட்டளையை[a][b] மீறுகிறீர்கள்? இது வெற்றிபெறாது[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘யாவேயின் வாய்’; இது யாவே கூறியதையோ கட்டளையிட்டதையோ குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘யாவேயின் வார்த்தையை.’'
    reason: alternative_reading
  - marker: c
    text: 'அல்லது: ‘இது செழிக்காது.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் மோசே … என்றார்
  rationale: தொடர்கதை இணைப்பான וַ־ இச்சூழலில் மக்களின் திட்டத்திற்கு எதிரான மோசேயின் எச்சரிக்கையை அறிமுகப்படுத்துவதால், ‘ஆனால்’ என்பது இயல்பான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: לָמָה זֶּה
  choice: ஏன் இப்படி
  rationale: வெறும் ‘ஏன்’ என்பதைவிடச் சற்று வலியுறுத்தும் எபிரெய மரபுத்தொடரின் பொருளை, இயல்பான நவீனத் தமிழில் இது தக்கவைக்கிறது.
- source_word: אַתֶּם עֹבְרִים
  choice: நீங்கள் … மீறுகிறீர்கள்
  rationale: עבר இங்கு உடலளவில் கடந்து செல்வதைக் குறிக்காமல், இறைக் கட்டளையை வரம்புமீறி மீறுவதைக் குறிக்கிறது.
- source_word: אֶת פִּי יְהוָה
  choice: யாவேயின் கட்டளையை
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வாயை’ என்றாலும், இது யாவே கூறியதையோ கட்டளையிட்டதையோ குறிக்கும் எபிரெய மரபுத்தொடர். சூழலில் ‘கட்டளை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְהִוא
  choice: இது
  rationale: பெண்பால் ஒருமைப் பெயர்ப்பதிலி, சூழலில் மறைமுகமாக உள்ள அவர்களின் முயற்சி அல்லது நடவடிக்கையைக் குறிக்கலாம். ‘இது’ அந்தக் குறிப்பின் பரந்த தன்மையைத் தக்கவைக்கிறது.
- source_word: לֹא תִצְלָח
  choice: வெற்றிபெறாது
  rationale: צלח இங்கு மேற்கொள்ளப்படும் முயற்சி வெற்றியடைவதையோ செழிப்பதையோ குறிக்கிறது; ‘வெற்றிபெறாது’ என்பது தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- issue: וְהִוא குறிக்கும் பொருள்
  choice: இது
  alternative: இந்த முயற்சி
  rationale: எபிரெயப் பெண்பால் பெயர்ப்பதிலி எந்தப் பெயர்ச்சொல்லைக் குறிக்கிறது என்பது வசனத்திலேயே வெளிப்படையாகச் சொல்லப்படவில்லை. ‘இது’ என்று மொழிபெயர்ப்பது, மக்களின் திட்டமிட்ட நடவடிக்கையைக் குறிக்கும் சாத்தியத்தைத் தக்கவைத்தபடியே தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஏன் இப்படி’ என்பது לָמָה זֶּה என்பதன் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; ‘இது’ என்பதால் முயற்சியின் துல்லியமான குறிப்பு குறித்து மூலத்தில் உள்ள மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
