  to: எப்புன்னேயின் மகன் காலேபும் நூனின் மகன் யோசுவாவும் தவிர, உங்களைக் குடியமர்த்துவதாக நான் என் கையை உயர்த்திச் சத்தியம் செய்த அந்த நாட்டிற்குள் நீங்கள் நிச்சயமாக நுழையமாட்டீர்கள்.[a]
