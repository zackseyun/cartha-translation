base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ta
  text: எப்புன்னேயின் மகன் காலேபும் நூனின் மகன் யோசுவாவும் தவிர, உங்களைக் குடியமர்த்துவதாக நான் என் கையை உயர்த்திச் சத்தியம் செய்த அந்த நாட்டிற்குள் நீங்கள் நிச்சயமாக நுழையமாட்டீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “உங்களை அதில் குடியமர்த்துவதற்காக நான் என் கையை உயர்த்திய நாடு.” கையை உயர்த்துதல் சத்தியம் செய்வதற்கான ஒரு சைகை; அவர்களை அந்த நாட்டில் குடியமர்த்துவதாக அவர் சத்தியம் செய்ததை இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: நீங்கள் நிச்சயமாக நுழையமாட்டீர்கள்
  rationale: தெய்வீக ஆணைச் சூழலில் வாக்கியத் தொடக்கத்தில் வரும் אִם வலுவான மறுப்பைக் குறிக்கிறது; ஆகவே எளிய நிபந்தனையாக அல்லாமல் உறுதியான எதிர்மறையாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל הָאָרֶץ
  choice: அந்த நாட்டிற்குள்
  rationale: בוא என்ற இயக்க வினையுடன், ஒரு நிலப்பகுதிக்குள் நுழைவதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: நான் என் கையை உயர்த்தி ஆணையிட்ட
  rationale: கையை உயர்த்துதல் என்ற எபிரெயப் படிமத்தையும் அதன் ஆணையிடும் பொருளையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: உங்களைக் குடியமர்த்துவதற்காக
  rationale: שׁכן என்பதன் காரணவினைப் பொருளான ‘வசிக்கச் செய்தல்/குடியமர்த்துதல்’ என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: முந்தைய மறுப்பிலிருந்து காலேபையும் யோசுவாவையும் மட்டும் விதிவிலக்குகளாகக் காட்டுகிறது.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபு
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்புடன் தந்தை-மகன் உறவு தெளிவாக வைக்கப்பட்டது.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: இணைப்பையும் எபிரெயத் தந்தைவழி அடையாளத்தையும் இயல்பான தமிழ்ச் சொற்றொடரில் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆணை மொழியின் வலிமையையும் தெய்வீகத் தீர்ப்பையும் வெளிப்படுத்துதல்
  choice: நீங்கள் நிச்சயமாக நுழையமாட்டீர்கள்
  alternative: நீங்கள் அந்த நாட்டிற்குள் நுழைந்தால்
  rationale: இங்கு אִם உண்மையான நிபந்தனையைத் தொடங்கவில்லை; ஆணையின் சூழலில் வலுவான மறுப்பைத் தெரிவிக்கிறது. எனவே தீர்ப்பின் உறுதியை மறைக்காத வாசிப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய ஆணைச் சைகையின் படிமம் முதன்மை உரையிலும் அதன் பண்பாட்டு விளக்கம் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
