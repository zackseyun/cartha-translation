base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: ta
  text: யாவே கோபங்கொள்ளத் தாமதிப்பவரும், மாறாத அன்பு மிகுந்தவரும்[a], அக்கிரமத்தையும் மீறுதலையும் மன்னிப்பவரும்[b] ஆவார். ஆனாலும், குற்றவாளியை அவர் ஒருபோதும் குற்றமற்றவர் என்று அறிவிக்கமாட்டார்[c]; தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மீதும், மூன்றாம் மற்றும் நான்காம் தலைமுறையினர்மீதும் வரச் செய்வார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கைப் பற்றுறுதியில் பெருகியவர்,” “இரக்கத்தில் நிறைந்தவர்,” அல்லது “நிலையான அன்பு மிகுந்தவர்.”
    reason: lexical_alternative
  - marker: b
    text: “மன்னிப்பவர்” என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் “அக்கிரமத்தையும் மீறுதலையும் சுமப்பவர்” அல்லது “சுமந்துகொள்பவர்” எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் நிச்சயமாகத் தண்டிக்காமல் விடமாட்டார்” அல்லது “அவர் குற்றமற்றவர் என்று தீர்ப்பளிக்கமாட்டார்.”
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் “மூன்றாமவர்கள்மேலும் நான்காமவர்கள்மேலும்”; இது தலைமுறைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: אֶרֶךְ אַפַּיִם
  choice: கோபங்கொள்ளத் தாமதிப்பவர்
  rationale: ‘நீண்ட நாசி’ என்ற எபிரெய மொழிமரபின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: רַב חֶסֶד
  choice: மாறாத அன்பில் நிறைந்தவர்
  rationale: חֶסֶד என்பதிலுள்ள நிலையான அன்பு, இரக்கம், உறவுக்கு உண்மையாயிருத்தல் ஆகிய நிழற்பொருள்களைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: அக்கிரமத்தையும் மீறுதலையும் மன்னிப்பவர்
  rationale: נשא என்பதன் அடிப்படை ‘சுமத்தல்/சுமந்துகொள்ளுதல்’ என்ற படிமத்தையும், பாவச் சொற்களுடன் வரும் இவ்விடத்தின் ‘மன்னித்தல்’ என்ற செயல்பாட்டுப் பொருளையும் குறிப்பில் பாதுகாக்கிறது.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: தவறான செயலும் அதனால் உண்டாகும் குற்றப்பொறுப்பும் அடங்கிய சொல்லின் ஒழுக்கச் செறிவைப் பாதுகாக்கிறது.
- source_word: פָשַׁע
  choice: மீறுதல்
  rationale: எதிர்ப்பு அல்லது வரம்புமீறல் என்ற பொருளைத் தருவதோடு, עָוֺן என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: குற்றவாளியை அவர் ஒருபோதும் குற்றமற்றவனாக விடமாட்டார்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘ஒருபோதும்’ எனத் தெரிவித்து, குற்றத்திலிருந்து விடுவிக்கும் நீதித்துறைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘குற்றவாளி’ என்பது சூழலிலிருந்து பெறப்படும் மறைபொருள்.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் விசாரிப்பார்
  rationale: פקד என்பதன் கவனத்தில் கொண்டு கணக்குக் கேட்கும் நீதித்துறைப் பொருளைத் தருகிறது; விளைவுகளா நேரடித் தண்டனையா என்பதை மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: மூன்றாம் தலைமுறைவரையிலும் நான்காம் தலைமுறைவரையிலும்
  rationale: எபிரெயத்தில் விடுபட்டுள்ள ‘தலைமுறை’ என்பதைத் தெளிவுக்காக நிரப்பி, இருமுறை வரும் עַל என்பதற்கான இணை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீக மன்னிப்பும் நீதித்தீர்ப்பும் இடையிலான பதற்றம்
  choice: கடவுள் அக்கிரமத்தையும் மீறுதலையும் மன்னிக்கிறார்; ஆனாலும் குற்றவாளியை குற்றமற்றவனாக விடுவதில்லை என்ற இரு கூறுகளையும் அப்படியே வைத்தல்.
  alternative: மன்னிப்பை நிபந்தனையாக்கியோ நீதித்தீர்ப்பை மென்மைப்படுத்தியோ பதற்றத்தைத் தீர்த்தல்.
  rationale: மூல எபிரெய உரையே இரக்கத்தையும் நீதியையும் அருகருகே வைக்கிறது; மொழிபெயர்ப்பு அந்தப் பதற்றத்தைத் தீர்க்கக்கூடாது.
- issue: தலைமுறைகள்மீதான தந்தையரின் அக்கிரம விசாரணை
  choice: ‘பிள்ளைகள்மேல் ... விசாரிப்பார்’ என்று மூலத்தின் நீதித்துறை மொழியையும் தலைமுறைத் தொடரையும் தக்கவைத்தல்.
  alternative: இதை இயற்கையான சமூக விளைவுகள் மட்டுமே என்று விளக்குதல் அல்லது தனிப்பட்ட பொறுப்பு பற்றிய பிற வசனங்களுடன் இசைவாக்கி மென்மைப்படுத்துதல்.
  rationale: פקד என்பதன் துல்லியமான செயல்முறையை உரை விளக்கவில்லை; ஆகவே தண்டனை அல்லது இயற்கை விளைவு என ஒரே விளக்கத்துக்குள் அடைக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் dignified வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘ஆவார்’ அமைப்பு முதல் இரக்கக் கூறுகளை ஒன்றிணைக்கிறது; ‘ஆனாலும்’ மூலத்தில் உள்ள மன்னிப்பு–நீதி பதற்றத்தைத் தெளிவாகக் காட்டுகிறது. தொழில்நுட்பமோ சமயப்பிரிவுச் சார்போ கொண்ட சொற்கள் தவிர்க்கப்பட்டுள்ளன.
