revisions:
- from: யெகோவா கோபங்கொள்ளத் தாமதிப்பவரும், மாறாத அன்பில் நிறைந்தவரும்[a], அக்கிரமத்தையும் மீறுதலையும் மன்னிப்பவரும்[b] ஆவார். ஆனாலும், குற்றவாளியை அவர் ஒருபோதும் குற்றமற்றவனாக விடமாட்டார்[c]; தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் மூன்றாம் தலைமுறைவரையிலும் நான்காம் தலைமுறைவரையிலும் விசாரிப்பார்[d].
  to: யாவே கோபங்கொள்ளத் தாமதிப்பவரும், மாறாத அன்பு மிகுந்தவரும்[a], அக்கிரமத்தையும் மீறுதலையும் மன்னிப்பவரும்[b] ஆவார். ஆனாலும், குற்றவாளியை அவர் ஒருபோதும் குற்றமற்றவர் என்று அறிவிக்கமாட்டார்[c]; தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மீதும், மூன்றாம் மற்றும் நான்காம் தலைமுறையினர்மீதும் வரச் செய்வார்[d].
  rationale: The revision changes the divine-name form to ‘யாவே’ in accordance with the source and English POB audit trail. It also replaces an ambiguous Tamil judicial verb with ‘வரச் செய்வார்,’ which naturally renders the Hebrew visitation formula as the bringing of the fathers’ iniquity upon their children. This does not explain away or soften the text’s intergenerational judgment formulation. Footnote anchors and all four footnotes are retained and aligned with their respective phrases.
