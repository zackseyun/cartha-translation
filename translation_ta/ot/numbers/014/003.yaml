base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: ta
  text: நாம் வாளால் வீழ்வதற்காக யாவே நம்மை ஏன் இந்த நாட்டுக்குக் கொண்டுவருகிறார்? நம் மனைவிகளும் சிறு பிள்ளைகளும் கொள்ளைப்பொருளாகிவிடுவார்கள்[a]. எகிப்துக்குத் திரும்புவது நமக்கு நல்லதல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிரிகளுக்கு இரையாவார்கள்”; எபிரெயச் சொல் எதிரிகளால் போர்க் கொள்ளையாகப் பிடித்துச் செல்லப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: ஏன்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் முறையீட்டைத் தமிழில் இயல்பான கேள்வி அமைப்பில் தருகிறது; וְ என்பதன் தொடர்ச்சி தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாவிட்டாலும் உரையோட்டத்தில் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֵבִיא
  choice: கொண்டுவருகிறார்
  rationale: எபிரெயப் பங்கேற்புவினை உணர்த்தும் நடைபெறும் அல்லது நெருங்கிவரும் செயலை நிகழ்கால வடிவில் காக்கிறது.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: வாளால் வீழ்வதற்காக
  rationale: போரில் வாளால் கொல்லப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் மக்களின் குற்றச்சாட்டிலுள்ள நோக்கத் தொனியையும் காக்கிறது.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: நம் மனைவிகளும் சிறு பிள்ளைகளும்
  rationale: குடும்பச் சூழலில் נָשִׁים என்பதற்கு ‘மனைவிகள்’ பொருத்தமானது; טַף குறிப்பாக பாதுகாப்பற்ற சிறு குழந்தைகளைக் குறிக்கும்.
- source_word: יִהְיוּ לָבַז
  choice: கொள்ளைப்பொருளாகிவிடுவார்கள்
  rationale: போரில் எதிரிகளால் கைப்பற்றப்படும் கொள்ளை அல்லது சூறைப்பொருள் என்ற בַּז சொல்லின் முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הֲלוֹא טוֹב לָנוּ
  choice: நமக்கு நல்லதல்லவா?
  rationale: எதிர்பார்க்கப்படும் ஒப்புதலைக் கோரும் எதிர்மறை வினாவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: שׁוּב מִצְרָיְמָה
  choice: எகிப்துக்குத் திரும்புவது
  rationale: முன்பு விட்டுவந்த இடத்திற்குத் திரும்பிச் செல்வது என்ற שׁוּב வினையின் கருத்தை நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பட்ட தெய்வீகப் பெயரைப் பயன்படுத்துகிறது. ஆகவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, வேறொரு உச்சரிப்பை உறுதிப்படுத்தாமலும் வழங்கப்படுகிறது.
- issue: לִנְפֹּל என்பதில் வெளிப்படும் நோக்கத் தொனி
  choice: வீழ்வதற்காக
  alternative: வீழும்படி
  rationale: மக்கள் யாவேயின் செயலுக்குத் தீய நோக்கத்தைக் கற்பித்து முறையிடும் பதற்றத்தை மொழிபெயர்ப்பு மென்மையாக்காமல் காக்கிறது; இது உரையாடுவோரின் குற்றச்சாட்டு, உரையாசிரியரின் இறையியல் உறுதிப்படுத்தல் அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாளால் வீழ்தல்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘கொள்ளைப்பொருள்’ என்பதற்கு மாற்றான ‘இரை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
