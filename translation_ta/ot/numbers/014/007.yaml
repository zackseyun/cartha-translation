base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேல் மக்களின் சபையினர் அனைவரிடமும்[a], “நாங்கள் ஆராய்ந்து பார்ப்பதற்காக[b] கடந்துசென்ற அந்த நாடு மிக மிக நல்ல நாடு” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலரின் முழுச் சமூகத்தாரிடமும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உளவு பார்ப்பதற்காக” அல்லது “வேவு பார்ப்பதற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்று சொன்னார்கள்
  rationale: אמר என்பதன் வழக்கமான கதைநடைப் பொருள் ‘சொன்னார்கள்’; எபிரெய நேரடி உரை அமைப்பை இயல்பான தமிழ் வாக்கிய முடிவாக வழங்குகிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபை முழுவதையும்
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தையோ சபையையோ குறிக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதை நவீன தமிழில் இயல்பாக ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது. כָּל என்பதன் முழுமையும் ‘முழுவதையும்’ என்பதில் காக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: எபிரெயத்தில் நேரடி உரையை அறிமுகப்படுத்தும் மரபுத்தொடர்; தமிழில் மேற்கோளுடன் ‘என்று சொன்னார்கள்’ என்பதே இதன் செயல்பாட்டை இயல்பாக நிறைவேற்றுகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: சூழலில் ஏற்கெனவே குறிப்பிட்ட கானான் தேசத்தைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்; தமிழில் ‘அந்த நாடு’ தெளிவான இயல்பான வடிவம்.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: நாங்கள் ... கடந்துசென்ற
  rationale: עבר + בְּ ஒரு இடத்தினூடாகச் செல்வதைக் குறிக்கிறது; ‘கடந்துசென்ற’ இயக்கப் பொருளைக் காக்கிறது.
- source_word: לָתוּר אֹתָהּ
  choice: ஆராய்ந்து பார்ப்பதற்காக
  rationale: תור இச்சூழலில் ஒரு நிலத்தைச் சுற்றிப் பார்த்து அறியும் கண்காணிப்பு அல்லது ஆய்வுப் பயணத்தைக் குறிக்கிறது. ‘ஆராய்ந்து பார்க்க’ என்பது உளவுச் செயலாக மட்டுமே பொருளைக் குறுக்காமல் இயல்பாக உள்ளது.
- source_word: טוֹבָה
  choice: நல்ல
  rationale: அடிப்படைப் பொருளான ‘நல்ல’ என்பதைக் காக்கிறது; வலியுறுத்தலைத் தொடர்ந்து வரும் இரட்டை מְאֹד வழங்குகிறது.
- source_word: מְאֹד מְאֹד
  choice: மிக மிக
  rationale: இருமுறை வரும் வலியுறுத்தலைத் தமிழிலும் மீளுருவாக்கி அதன் பேச்சுவலிமையைக் காக்கிறது.
