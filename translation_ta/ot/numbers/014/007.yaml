  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் מְאֹד מְאֹד என்ற இரட்டை வலியுறுத்தல் ‘மிக மிக’ என வெளிப்படையாகக் காக்கப்பட்டுள்ளது; תור என்பதின் பரந்த ஆய்வு/கண்காணிப்புப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, உளவு சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
