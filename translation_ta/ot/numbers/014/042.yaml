id: NUM.14.42
reference: Numbers 14:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: ta
  text: மேலே போகாதீர்கள்; ஏனெனில் யாவே உங்கள் நடுவில் இல்லை. அப்படிச் சென்றால், உங்கள் எதிரிகளின் முன்பாக நீங்கள் தாக்கப்பட்டு வீழ்வீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: மேலே போகாதீர்கள்
  rationale: தடைச்சொல்லுடன் வரும் עלה என்பதன் ‘மேலே போதல்/ஏறிச் செல்லுதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் அது படையெடுத்துச் செல்வதையும் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: בְּקִרְבְּכֶם
  choice: உங்கள் நடுவில்
  rationale: ‘உங்கள் மத்தியில்/உள்ளே’ என்ற இடஞ்சார்ந்த சமூகப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: அப்படிச் சென்றால் ... முறியடிக்கப்படுவீர்கள்
  rationale: சொல்லளவில் ‘மேலும் நீங்கள் தாக்கப்படாதிருப்பீர்கள்’ என அமைந்தாலும், எச்சரிக்கைச் சூழலில் தவிர்க்க வேண்டிய விளைவை இது குறிக்கிறது. தமிழில் நிபந்தனை-விளைவு வடிவம் அந்தத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: உங்கள் எதிரிகளுக்கு முன்பாக
  rationale: போர்ச் சூழலில் எதிரிகளின் முன்னிலையில் அல்லது அவர்களால் தோற்கடிக்கப்படுதல் என்ற எபிரெய வழக்கை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயரே நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְּקִרְבְּכֶם என்பதில் இறைப் பிரசன்னம்
  choice: உங்கள் நடுவில் இல்லை
  alternative: உங்களோடு இல்லை
  rationale: ‘உங்கள் நடுவில்’ என்பது சமூகத்தின் மத்தியில் இருப்பது என்ற இடஞ்சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது; ‘உங்களோடு’ என்பதில் உள்ள பரந்த இறையியல் விளக்கத்தைத் திணிப்பதில்லை.
- issue: תִּנָּגְפוּ என்பதன் போர்சார் விளைவு
  choice: முறியடிக்கப்படுவீர்கள்
  alternative: வீழ்த்தப்படுவீர்கள்
  rationale: இவ்வினை தாக்கப்படுதல் அல்லது தோற்கடிக்கப்படுதல் இரண்டையும் குறிக்கலாம். இப்போர்ச் சூழலில் ‘முறியடிக்கப்படுவீர்கள்’ இயல்பானது; அது மரணம் அவசியம் என மிகைப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளை கண்ணியமான எச்சரிக்கை நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘மேலே போதல்’ என்ற நிலவியல்/போர்சார் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
