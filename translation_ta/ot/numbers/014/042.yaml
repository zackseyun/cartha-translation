review_pass:
  verdict: revise
  source_fidelity: The prohibition, reason, divine name, and communal-presence expression are conveyed accurately. However, முறியடிக்கப்படுவீர்கள் narrows the Niphal of נגף to military defeat; the Hebrew more directly depicts being struck down/overthrown before the enemies. தாக்கப்பட்டு வீழ்வீர்கள் preserves this force without requiring death as the only implication.
  naturalness: The Tamil is modern and clear. Retaining the conditional warning formulation, அப்படிச் சென்றால், is idiomatic and suitably expresses the adverse consequence in this context.
  terminology: யாவே appropriately represents יהוה, and உங்கள் நடுவில் naturally conveys בקרבכם. எதிரிகளின் முன்பாக is slightly more idiomatic than எதிரிகளுக்கு முன்பாக for לפני אויביכם in this battle setting.
  issues:
  - severity: medium
    issue: முறியடிக்கப்படுவீர்கள் is less precise for תִּנָּגְפוּ.
    rationale: The Hebrew passive verb denotes being struck, smitten, or overthrown. Although defeat is possible in a military context, the draft's wording loses the more concrete ‘struck down/fall’ sense. தாக்கப்பட்டு வீழ்வீர்கள் retains the ambiguity and force.
  revised_text: மேலே போகாதீர்கள்; ஏனெனில் யாவே உங்கள் நடுவில் இல்லை. அப்படிச் சென்றால், உங்கள் எதிரிகளின் முன்பாக நீங்கள் தாக்கப்பட்டு வீழ்வீர்கள்.
