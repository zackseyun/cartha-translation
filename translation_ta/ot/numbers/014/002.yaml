base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் அனைவரும்[a] மோசேக்கும் ஆரோனுக்கும் எதிராகக் குறைகூறினார்கள்[b]. முழுச் சபையும் அவர்களிடம், “எகிப்து நாட்டிலேயே நாங்கள் இறந்திருந்தால் எவ்வளவு நன்றாயிருந்திருக்கும்! அல்லது இந்தப் பாலைநிலத்திலேயே நாங்கள் இறந்திருந்தால் எவ்வளவு நன்றாயிருந்திருக்கும்!” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “இஸ்ரவேலர் அனைவரும்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள் அனைவரும்.”
    reason: lexical_alternative
  - marker: b
    text: “முறுமுறுத்தினார்கள்” அல்லது “புகார் கூறினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: முறுமுறுத்தார்கள்
  rationale: வனாந்தரப் பயணச் சூழலில் இந்த வினை தலைவர்களுக்கு எதிரான கூட்டு அதிருப்தியையும் குறைகூறுதலையும் குறிக்கிறது; ‘முறுமுறுத்தார்கள்’ என்பது அதன் தொடர்ச்சியான, கலகத் தொனியுள்ள குறைகூறலை இயல்பான தமிழில் தருகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: முறுமுறுத்தலின் இலக்காக மோசேயும் ஆரோனும் இருப்பதை எதிர்நிலைத் தொனியுடன் தெளிவாகக் காட்டுகிறது.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: எபிரெயச் சொல்லமைப்பிலுள்ள ‘இஸ்ரவேலின் மகன்கள்’ என்ற பாலினக் குறியீட்டைக் காக்கிறது; இங்கு அது இஸ்ரவேல் மக்களனைவரையும் குறிக்கும் மரபுவழித் தேசியப் பெயர்.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: எண்ணாகமத்தில் עֵדָה என்பது ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது; ‘சபையார்’ அந்தக் கூட்டுத் தன்மையைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: לוּ
  choice: …இறந்திருந்தால் எவ்வளவு நன்றாயிருந்திருக்கும்
  rationale: நிகழாத கடந்தகாலத்தை ஏங்கும் எதிர்நிகழ்வு விருப்பத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַתְנוּ / מָתְנוּ
  choice: நாங்கள் இறந்திருந்தால்
  rationale: לוּ உடன் வரும் கடந்தகால எதிர்நிகழ்வு ஏக்கத்தைத் தமிழின் நிபந்தனை நிறைவுவினை வடிவில் துல்லியமாகத் தருகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலேயே
  rationale: ‘எகிப்து நாடு’ என்ற முழு புவியியல் சொல்லைத் தக்கவைத்து, ஏக்கத்தின் வலியுறுத்தலை ‘-ஏ’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: இந்தப் பாலைநிலத்திலேயே
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட வனப்பகுதியைக் குறிக்கலாம்; ‘பாலைநிலம்’ தமிழில் புரியக்கூடியதாகவும் பயணச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினம் குறித்த தேசியப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  alternative: இஸ்ரவேலர் அனைவரும்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவை மறைக்காமல் காக்கிறது; அதே நேரத்தில் இச்சூழலில் இந்த மரபுவழிப் பெயர் முழு மக்களையும் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடை. எபிரெய வாக்கியத்தின் இரண்டு கூறுகளும் காக்கப்பட்டுள்ளன; எதிர்நிகழ்வு ஏக்கம் தமிழில் இயல்பாக விரிவாக்கப்பட்டுள்ளது.
