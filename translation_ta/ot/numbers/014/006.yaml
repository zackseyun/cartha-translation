base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: ta
  text: அந்த நாட்டை வேவுபார்த்தவர்களில் நூனின் மகன் யோசுவாவும் எப்புன்னேயின் மகன் காலேபும் தங்கள் உடைகளைக் கிழித்துக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: உடைகளைக் கிழிப்பது துயரம், திகைப்பு அல்லது கடும் மனவேதனையை வெளிப்படுத்தும் அக்கால வழக்கமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவும்
  rationale: இணைப்புச் சொல் அடுத்த கூட்டு எழுவாயுடன் இயல்பாக இணையுமாறு ‘-வும்’ என வழங்கப்பட்டது; தந்தை வழி அடையாளம் முறையாகப் பாதுகாக்கப்பட்டது.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபும்
  rationale: யோசுவாவுடன் காலேபை கூட்டு எழுவாயாக இணைக்கிறது; பெயர்களின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: அந்த நாட்டை வேவுபார்த்தவர்களில்
  rationale: מִן இங்கு முழுக் குழுவிற்குள் இவர்களின் உறுப்பியலைக் குறிக்கும் பகுதிப்பொருளில் உள்ளது. הָאָרֶץ சூழலில் ஏற்கெனவே பேசப்பட்ட நாட்டைக் குறிப்பதால் ‘அந்த நாடு’ என இயல்பாக வழங்கப்பட்டது.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: தங்கள் உடைகளைக் கிழித்துக்கொண்டார்கள்
  rationale: துயரம் அல்லது அதிர்ச்சியின் அடையாளமாக ஒருவர் தமது உடைகளைத் தாமே கிழிக்கும் செயலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல்லமைப்பிலுள்ள உறுப்பியல் பொருள் ‘வேவுபார்த்தவர்களில்’ என்பதால் நேரடியாகப் பாதுகாக்கப்பட்டது.
