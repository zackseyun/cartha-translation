revisions:
- from: ஏனெனில், அமலேக்கியர்களும் கானானியர்களும் அங்கே உங்களுக்கு முன்னால் இருக்கிறார்கள்; நீங்கள் வாளால் வீழ்வீர்கள். ஏனெனில், நீங்கள் யாவேயைப் பின்பற்றுவதிலிருந்து விலகித் திரும்பிவிட்டீர்கள்; யாவே உங்களோடு இருக்கமாட்டார்.
  to: ஏனெனில், அமலேக்கியர்களும் கானானியர்களும் அங்கே உங்களுக்கு முன்னால் இருக்கிறார்கள்; நீங்கள் வாளால் வீழ்வீர்கள். இதனால்தான், நீங்கள் யாவேயைப் பின்பற்றுவதை விட்டு விலகிவிட்டீர்கள்; யாவே உங்களோடு இருக்கமாட்டார்.
