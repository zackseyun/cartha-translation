id: NUM.14.43
reference: Numbers 14:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: ta
  text: ஏனெனில், அமலேக்கியர்களும் கானானியர்களும் அங்கே உங்களுக்கு முன்னால் இருக்கிறார்கள்; நீங்கள் வாளால் வீழ்வீர்கள். இதனால்தான், நீங்கள் யாவேயைப் பின்பற்றுவதை விட்டு விலகிவிட்டீர்கள்; யாவே உங்களோடு இருக்கமாட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழ் உரைநடையில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: அமலேக்கியர்களும் கானானியர்களும்
  rationale: எபிரெயத்தில் ஒருமை வடிவங்கள் கூட்டுப் பொருளில் மக்களினங்களைக் குறிக்கின்றன; தமிழில் பன்மை இயல்பானது.
- source_word: שָׁם לִפְנֵיכֶם
  choice: அங்கே உங்களுக்கு முன்னால்
  rationale: שָׁם என்பதன் இடப்பொருளையும் לִפְנֵיכֶם என்பதன் நேரடி இடவியல் உறவையும் தக்கவைக்கிறது.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: நீங்கள் வாளால் வீழ்வீர்கள்
  rationale: נפל என்பதன் ‘வீழ்தல்’ என்ற படிமத்தையும், போரில் வாளால் கொல்லப்படுதல் என்ற சூழற்பொருளையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: כִּי עַל כֵּן
  choice: ஏனெனில்
  rationale: வரவிருக்கும் தோல்விக்கான காரணத்தை அறிமுகப்படுத்தும் கூட்டு சொற்றொடரின் இயல்பான தமிழாக்கம்.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: நீங்கள் யாவேயைப் பின்பற்றுவதிலிருந்து விலகித் திரும்பிவிட்டீர்கள்
  rationale: שׁוב என்பதிலுள்ள திரும்புதல் கருத்தையும் מֵאַחֲרֵי என்பதிலுள்ள ‘பின்பற்றுவதிலிருந்து’ என்ற உடன்படிக்கை சார்ந்த படிமத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: யாவே உங்களோடு இருக்கமாட்டார்
  rationale: எதிர்கால மறுப்பையும் இறை உடனிருப்பின் கருத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பட்டத்தை அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துகிறது; ஆகவே அந்தப் பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: מֵאַחֲרֵי יְהוָה என்பதிலுள்ள பின்பற்றுதல் படிமம்
  choice: யாவேயைப் பின்பற்றுவதிலிருந்து விலகித் திரும்பிவிட்டீர்கள்
  alternative: யாவேயைவிட்டு விலகிவிட்டீர்கள்
  rationale: ‘அவருக்குப் பின்னால் செல்வது’ என்ற மூலப்படிமத்தையும் உடன்படிக்கை விசுவாசத்தின் பதற்றத்தையும் தட்டையாக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், எச்சரிப்பின் கண்ணியமான தீவிரத்தைத் தக்கவைத்தும் அமைக்கப்பட்டது. ‘வாளால் வீழ்வீர்கள்’ என்ற சொற்றொடர் மூலத்தின் போர் உருவகத்தை நேரடியாகக் காக்கிறது.
