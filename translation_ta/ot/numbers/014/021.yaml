  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: ta
  text: ஆனாலும், என் வாழ்வின்மேல் ஆணையாக, யெகோவாவின் மகிமை பூமி முழுவதையும் நிரப்பும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, எபிரெய אֶרֶץ என்பதை இங்கு உள்ளூர் பொருளில் எடுத்தால், ‘நாடு முழுவதையும் நிரப்பும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனாலும்
  rationale: முந்திய உரையுடன் வலுவான எதிர்மறைத் திருப்பத்தையும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַי אָנִי
  choice: என் உயிரைக் கொண்டு ஆணையிட்டுச் சொல்கிறேன்
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘நான் உயிரோடிருப்பது போல’ என்பதற்குப் பதிலாக, தெய்வீக ஆணைமொழியின் பொருளையும் பெருமிதமான தொனியையும் தெளிவாகக் காக்கும் தமிழ் மரபுத்தொடர்.
- source_word: וְיִמָּלֵא
  choice: நிரப்பும்
  rationale: நிபால் வடிவம் இங்கு விளைவு அல்லது பரவல் உணர்வைத் தருகிறது; ‘மகிமை’ எழுவாயாக இருப்பதைப் பேணி, இயல்பான தமிழில் செயப்படுவினையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: כְבוֹד
  choice: மகிமை
  rationale: யெகோவாவைக் குறிக்கும் போது அவரது மேன்மை, பிரசன்னம், புகழ் ஆகிய பொருள் பரப்பைப் பேணும் நிலையான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: אֶת כָּל הָאָרֶץ
  choice: பூமி முழுவதையும்
  rationale: இந்த ஆணைமொழியின் விரிவான சூழலில் உலகளாவிய பொருள் முதன்மையாகத் தோன்றுகிறது; அதேவேளை ‘நாடு முழுவதையும்’ என்ற உள்ளூர் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் எல்லை
  choice: 'உலகளாவிய பொருள்: ‘பூமி முழுவதையும்’'
  alternative: 'உள்ளூர் அல்லது பிரதேசப் பொருள்: ‘நாடு முழுவதையும்’'
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நாடு’ என இருவகையில் பொருள்படலாம். ஆணைமொழியும் யெகோவாவின் மகிமையைப் பற்றிய விரிவான அறிவிப்பும் உலகளாவிய வாசிப்பை ஆதரிக்கின்றன; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. தெய்வீக ஆணைமொழியின் வலிமை தெளிவாக்கப்பட்டுள்ளது; அளவுக்கு மீறிய சமயமரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
