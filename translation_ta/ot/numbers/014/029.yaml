source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: ta
  text: இந்தப் பாலைநிலத்தில் உங்கள் பிணங்கள் விழும்[a]—கணக்கெடுப்பில் பதிவான உங்கள் முழு எண்ணிக்கையினராகிய[b], இருபது வயது முதல் அதற்கு மேற்பட்ட, எனக்கு எதிராக முறுமுறுத்த நீங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் சடலங்கள் விழும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் உடல்சார்ந்த மரணத்தைத் தெளிவான, கடுமையான படிமமாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கணக்கெடுப்பில் பதிவானவர்கள்’ என்பது மக்கள்தொகைக் கணக்கெடுப்பில் அல்லது படைத்திரட்டலுக்காக எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘முறுமுறுத்த’ என்பதற்கு ‘அதிருப்தியுடன் குறைகூற’ என்றும் பொருள் கொள்ளலாம்; இங்கு அது கடவுளுக்கு எதிரான எதிர்ப்புத் தொனியைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: இந்தப் பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட வெளி அல்லது வனாந்தரத்தைக் குறிக்கும். ‘பாலைநிலம்’ நவீன தமிழில் இயல்பாகவும் இச்சூழலின் புவியியல் தன்மையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: உங்கள் பிணங்கள் விழும்
  rationale: נפל என்பதன் ‘விழுதல்’ என்ற நேரடியான படிமத்தையும் פגר என்பதன் உடல்சார்ந்த ‘பிணம்’ என்ற கடுமையையும் பாதுகாக்கிறது; ‘நீங்கள் இறப்பீர்கள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: கணக்கெடுப்பில் பதிவு செய்யப்பட்ட உங்களில் ... அனைவரும்
  rationale: פקד மற்றும் מספר ஆகியவை மக்கள்தொகைக் கணக்கெடுப்பு/படைத்திரட்டல் பின்னணியைச் சுட்டுகின்றன. சொல்லுக்குச் சொல் மீளுரைப்பதை விட தமிழில் இயல்பாக முழுமையைக் காட்டுகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: கணக்கெடுப்புக்கான வயது வரம்பைத் துல்லியமாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: எனக்கு எதிராக முறுமுறுத்த நீங்கள் அனைவரும்
  rationale: לון என்பதன் இச்சூழலிலான கிளர்ச்சித் தொனியுள்ள அதிருப்திப் பேச்சை ‘முறுமுறுத்தல்’ பாதுகாக்கிறது. தொடர்புச் சொல்லின் பொருளைத் தமிழில் தெளிவாக்க வாக்கிய அமைப்பு மாற்றப்பட்டுள்ளது.
theological_decisions:
- issue: தீர்ப்பின் உடல்சார்ந்த படிமம்
  choice: ‘உங்கள் பிணங்கள் விழும்’ என்ற நேரடியான, கடுமையான மொழியைப் பாதுகாத்தல்
  alternative: ‘நீங்கள் இந்தப் பாலைநிலத்தில் இறப்பீர்கள்’
  rationale: எபிரெய உரை வெறுமனே மரணத்தை அறிவிக்காமல், பிணங்கள் விழுவதைக் காட்சிப்படுத்துகிறது. உடன்படிக்கைத் தீர்ப்பின் தீவிரத்தை மென்மையாக்காமல் வைத்திருக்கிறது.
- issue: தீர்ப்புக்குட்படுவோரின் வரம்பு
  choice: கணக்கெடுக்கப்பட்ட இருபது வயதும் அதற்கு மேற்பட்டவர்களுடன் தொடர்புபடுத்துதல்
  alternative: முழு இஸ்ரவேல் சமூகமும் விதிவிலக்கின்றி அழியும் எனப் பொதுமைப்படுத்துதல்
  rationale: வசனத்தின் வயது மற்றும் கணக்கெடுப்பு வரையறைகளை அப்படியே காக்கிறது; உரை கூறாத விதிவிலக்குகளையோ கோட்பாட்டு முடிவுகளையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிணங்கள் விழும்’ என்ற கடுமையான மூலப்படிமம் பாதுகாக்கப்பட்டது. எபிரெய நீண்ட தொடர்புத் தொடரைத் தமிழில் தெளிவாக்க இறுதியில் ‘இவ்வாறு விழுவீர்கள்’ எனத் திரும்பச் சொல்லப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்ப்பதல்ல, வாக்கியத் தொடர்பை வெளிப்படுத்துவதாகும்.
