  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: ta
  text: மோசே நாட்டை ஆராய்ந்து பார்க்க[a] அனுப்பிய அந்த மனிதர்கள் திரும்பிவந்து, நாட்டைப் பற்றிய தீய அறிக்கையை வெளியிட்டு[b], மக்கள் கூட்டம் முழுவதையும் மோசேக்கு எதிராக முறுமுறுக்கச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாட்டை வேவுபார்க்க.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாட்டைப் பற்றிய தீய அறிக்கையைப் பரப்பி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: முந்தைய நிகழ்வில் குறிப்பிடப்பட்ட மனிதர்களை மீண்டும் சுட்டும் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது; எபிரெய இணைப்புச் சொல்லுக்காகத் தேவையற்ற காலக் குறிப்பு சேர்க்கப்படவில்லை.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: மோசே ... அனுப்பிய
  rationale: பெயரெச்சத் தொடராக அமைப்பது தமிழில் இயல்பானது; மோசே அனுப்பியவர்களே இவர்கள் என்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: நாட்டை ஆராய்ந்து பார்க்க
  rationale: תור என்பதன் ஆய்வு அல்லது முன்னறிதல் நோக்கை இயல்பான நவீன தமிழில் தருகிறது; ‘வேவுபார்க்க’ என்பதிலுள்ள எதிர்மறையான உளவு நிழலை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பிவந்து
  rationale: கதைத் தொடரில் செயல்களின் வரிசையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וילונו עָלָיו
  choice: அவருக்கு எதிராக முறுமுறுக்கச் செய்தார்கள்
  rationale: இவ்வடிவமும் அதன் நேரடி செயப்படுபொருளும், அந்த மனிதர்கள் தாங்களே முறுமுறுத்தார்கள் என்பதற்குப் பதிலாக மக்கள் கூட்டத்தை முறுமுறுக்கத் தூண்டினர் என்ற காரணவினைப் பொருளைக் காட்டுகின்றன. ‘முறுமுறுக்க’ என்பது வனாந்தரப் புகார் நிகழ்வுகளின் சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: אֶת כָּל־הָעֵדָה
  choice: மக்கள் கூட்டம் முழுவதையும்
  rationale: עֵדָה என்பது இஸ்ரவேல் சமூகமெங்கும் சேர்ந்த கூட்டத்தைக் குறிக்கிறது; இச்சொற்றொடர் சாதாரண வாசகருக்குத் தெளிவாக அதன் ஒருங்கிணைந்த சமூகப் பொருளைத் தருகிறது.
- source_word: לְהוֹצִיא דִבָּה
  choice: தீய செய்தியைக் கொண்டுவந்து
  rationale: הוציא என்பதன் ‘வெளியே கொண்டுவருதல்’ என்ற உருவகத்தை நெருக்கமாகக் காத்து, דִבָּה என்பதன் கேடு விளைவிக்கும் அறிக்கை என்ற பொருளையும் தருகிறது. இது முறுமுறுப்பைத் தூண்டிய வழிமுறையாக அமைக்கப்பட்டுள்ளது.
- source_word: עַל־הָאָרֶץ
  choice: நாட்டைப் பற்றிய
  rationale: இங்கு עַל என்பது அந்தத் தீய செய்தியின் பொருள் அல்லது தலைப்பைச் சுட்டுகிறது; ‘பற்றிய’ என்பது இயல்பான தமிழ் வடிவம்.
