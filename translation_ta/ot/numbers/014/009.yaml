  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: ta
  text: மட்டும், யாவேக்கு எதிராகக் கலகம் செய்யாதீர்கள். அந்த நாட்டின் மக்களுக்கு அஞ்சாதீர்கள்; ஏனெனில் அவர்கள் நம் அப்பம்[a]. அவர்கள்மேலிருந்து அவர்களுடைய நிழல் விலகிவிட்டது[b]; யாவே நம்மோடு இருக்கிறார். அவர்களுக்கு அஞ்சாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் நமக்கு உணவு.” எபிரெயத்தில் நேரடியாக, “அவர்கள் நம் அப்பம்”; அவர்கள் எளிதில் வெல்லப்படுவார்கள் அல்லது விழுங்கப்படுவார்கள் என்பதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “அவர்கள்மேலிருந்து அவர்களுடைய நிழல் விலகிவிட்டது.” இங்கே “நிழல்” பாதுகாப்பையோ அடைக்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால் ... மட்டும்
  rationale: வலியுறுத்தும் வரையறையையும் முந்தைய சூழலுடனான எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: யெகோவாவுக்கு எதிராக மட்டும் கலகம் செய்யாதீர்கள்
  rationale: மָרַד உடன் வரும் בְּ, கலகம் யாருக்கு எதிரானது என்பதைக் குறிக்கிறது; יהוה உடன்படிக்கையின் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: עַם הָאָרֶץ
  choice: அந்த நாட்டின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: ஏனெனில் அவர்கள் நமக்கு உணவு
  rationale: לֶחֶם என்பதன் நேரடி பொருள் ‘அப்பம்’; இங்கு எளிதில் வெல்லப்பட்டு விழுங்கப்படுவார்கள் என்ற உருவகப் பொருளை ‘உணவு’ இயல்பாகத் தெரிவிக்கிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: அவர்கள்மேல் இருந்த நிழல் நீங்கிவிட்டது
  rationale: צֵל என்பதன் ‘நிழல்’ உருவகத்தை முதன்மை உரையிலேயே பாதுகாக்கிறது; அது பாதுகாப்பைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַיהוָה אִתָּנוּ
  choice: யெகோவா நம்மோடு இருக்கிறார்
  rationale: எளிய waw இணைப்பின் ஓட்டத்தையும் தெய்வீக உடனிருப்பைப் பற்றிய நேரடியான கூற்றையும் காக்கிறது.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: அஞ்சாதீர்கள் / அவர்களுக்கு அஞ்சாதீர்கள்
  rationale: எதிரிகளைப் பற்றிய பயத்தைக் குறிக்கும் ירא வினையைச் சுருக்கமாகவும் கண்ணியமாகவும் மொழிபெயர்த்து, இறுதி மறுபடியும் கூறுதலையும் காக்கிறது.
theological_decisions:
- issue: כִּי לַחְמֵנוּ הֵם என்ற வெற்றி உருவகம்
  choice: முதன்மை உரையில் ‘அவர்கள் நமக்கு உணவு’ என்று தருதல்
  alternative: ‘அவர்கள் நமது அப்பம்’ என்று நேரடியாகத் தருதல்
  rationale: தமிழில் ‘நமது அப்பம்’ உருவகத்தின் நோக்கம் உடனடியாகப் புரியாமல் போகலாம். ‘உணவு’ மூல உருவகத்தின் உட்கொள்ளுதல்/எளிய வெற்றி என்ற வலிமையைத் தக்கவைக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: צִלָּם என்ற உருவகத்தின் பொருள்
  choice: ‘நிழல்’ என்ற உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘பாதுகாப்பு’ அல்லது ‘அடைக்கலம்’ என்று பொருளுரைத்தல்
  rationale: நிழல் பாதுகாப்பைக் குறிக்கும் என்பது சாத்தியமானாலும், உருவகம் தெய்வீக அல்லது இராணுவப் பாதுகாப்பை எவ்வாறு சுட்டுகிறது என்பது முழுமையாகத் தீர்மானிக்கப்படவில்லை. எனவே மூலத்தின் நெகிழ்வை உரையில் காத்து விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வெளிப்படுத்துகிறது; குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பன்மை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் மீளுரையும் ‘நிழல்’ உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தெளிவு தேவைப்படும் இடத்தில் மட்டும் அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
