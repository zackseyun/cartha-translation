  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: ta
  text: மோசே இந்த வார்த்தைகளை இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] கூறினார். மக்கள் மிகுந்த துக்கத்தில் ஆழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘இஸ்ரவேலின் மகன்கள் அனைவரிடமும்’; அல்லது, ‘இஸ்ரவேலர் அனைவரிடமும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: சொன்னார்
  rationale: பியெல் வடிவம் மோசே இறைத்தீர்ப்பை மக்களிடம் வாய்மொழியாகத் தெரிவித்ததைக் குறிக்கிறது. கூடுதல் விளக்கப் பொருளைச் சேர்க்காமல், நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דְּבָרִים என்பதற்கு ‘வார்த்தைகள்,’ ‘காரியங்கள்’ போன்ற பொருள்கள் உண்டு. இங்கு முந்தைய இறை அறிவிப்பை மோசே எடுத்துச் சொல்வதால், ‘இந்த வார்த்தைகளை’ என்பது அதன் வாய்மொழித் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரிடமும்
  rationale: בְּנֵי יִשְׂרָאֵל என்ற எபிரெயச் சொற்றொடரின் வடிவத்தை நெருக்கமாகப் பாதுகாக்கிறது; அது ஒட்டுமொத்த இஸ்ரவேல் மக்களையும் குறிக்கும் மாற்றுப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וַיִּתְאַבְּלוּ
  choice: துக்கப்பட்டார்கள்
  rationale: אבל என்பதன் ஹித்பயேல் வடிவம் துக்கத்தில் ஆழ்ந்த நிலையைச் சுட்டுகிறது. ‘துக்கப்பட்டார்கள்’ என்பது சமூகமெங்கும் ஏற்பட்ட ஆழ்ந்த வருத்தத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם இங்கு சமூகத்தை ஒரு கூட்டு மக்களாகக் குறிக்கிறது; ‘மக்கள்’ என்பது நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: מְאֹד துக்கத்தின் தீவிரத்தை வலுப்படுத்துகிறது; ‘மிகவும்’ நவீன தமிழில் அதனைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
