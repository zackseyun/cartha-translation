- from: மோசே இந்த வார்த்தைகளை இஸ்ரவேலின் மகன்கள் அனைவரிடமும்[a] சொன்னார். மக்கள் மிகவும் துக்கப்பட்டார்கள்.
  to: மோசே இந்த வார்த்தைகளை இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] கூறினார். மக்கள் மிகுந்த துக்கத்தில் ஆழ்ந்தார்கள்.
  rationale: The revision retains the verbal sense of ‘spoke’ and the intensification ‘greatly,’ while rendering the conventional Hebrew collective ethnonym idiomatically in Tamil. The footnote preserves the literal form. The revised mourning expression is natural Tamil and reflects the Hebrew verb’s sense of entering profound mourning.
