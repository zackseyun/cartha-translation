    text: நேரடியாக, ‘இஸ்ரவேலின் மகன்கள் அனைவரிடமும்’; அல்லது, ‘இஸ்ரவேலர் அனைவரிடமும்.’
    reason: lexical_alternative
  revision_rationale: The revision retains the verbal sense of ‘spoke’ and the intensification ‘greatly,’ while rendering the conventional Hebrew collective ethnonym idiomatically in Tamil. The footnote preserves the literal form. The revised mourning expression is natural Tamil and reflects the Hebrew verb’s sense of entering profound mourning.
