  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: ta
  text: அவர்கள் ஒருவருக்கொருவர்[a], “நாம் ஒரு தலைவரை[b] நியமித்து, எகிப்துக்குத் திரும்புவோம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘ஒவ்வொருவனும் தன் சகோதரனிடம்.’ இந்த எபிரெய மரபுத்தொடர் அவர்கள் தங்களுக்குள் பரஸ்பரம் பேசிக்கொண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஒரு தலையை.’ இங்கு ‘தலை’ என்பது குழுவின் மேல் வைக்கப்படும் ஒருவரை, அதாவது ஒரு தலைவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: אמר என்பதன் wayyiqtol வடிவம் கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. தமிழில் மேற்கோளின் முடிவில் வரும் ‘என்றார்கள்’ இயல்பான தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אִישׁ אֶל אָחִיו
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லுக்குச் சொல் ‘ஒருவன் தன் சகோதரனிடம்’ என்றிருந்தாலும், இங்கு இது கூட்டத்தினர் தங்களுக்குள் பரஸ்பரம் பேசிக்கொண்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: נִתְּנָה
  choice: நியமித்துக்கொண்டு
  rationale: נתן என்பதன் முதலாம் நபர் பன்மை cohortative வடிவம். רֹאשׁ உடன் சேர்ந்து, ஒருவரைத் தலைவராக ஏற்படுத்துதல் அல்லது நியமித்தல் என்ற பொருளைத் தருகிறது; அடுத்து அவர்கள் திரும்பிச் செல்ல எண்ணியதையும் ‘-த்துக்கொண்டு’ இயல்பாக இணைக்கிறது.
- source_word: רֹאשׁ
  choice: ஒரு தலைவரை
  rationale: இதன் நேரடிப் பொருள் ‘தலை’; இச்சூழலில் குழுவின்மேல் அதிகாரம் செலுத்த நியமிக்கப்படும் நபரைக் குறிக்கிறது. நவீன தமிழில் ‘தலைவர்’ அந்தச் செயல்பாட்டுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְנָשׁוּבָה
  choice: திரும்புவோம்
  rationale: שוב என்பதன் இணைக்கப்பட்ட முதலாம் நபர் பன்மை cohortative வடிவம்; ‘நாம்’ என்பதுடன் தமிழில் முன்மொழிவு அல்லது கூட்டு முடிவின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்கு
  rationale: இறுதியில் உள்ள திசைகாட்டும் -ה, எகிப்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘திரும்புவோம்’ என்பதே மீண்டும் செல்வதை உணர்த்துவதால் கூடுதலாக ‘மீண்டும்’ எனச் சேர்க்கத் தேவையில்லை.
