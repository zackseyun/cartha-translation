translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய cohortative வடிவங்களின் கூட்டு முன்மொழிவு ‘நாம் ... திரும்புவோம்’ எனப் பாதுகாக்கப்பட்டுள்ளது; மரபுத்தொடர்களின் நேரடிப் பொருள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
