base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: ta
  text: “நான், யாவே, சொல்லிவிட்டேன். எனக்கு எதிராக ஒன்றுகூடிய இந்தத் தீய கூட்டம் முழுவதற்கும்[a] நான் இதையே நிச்சயமாகச் செய்வேன்:[b] இந்தப் பாழ்நிலத்தில் அவர்கள் முடிவுக்கு வருவார்கள்; அங்கே அவர்கள் சாவார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூட்டம்’ என்பதற்கு ‘சபை’ அல்லது ‘சமூகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிச்சயமாக’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் ‘இல்லாவிட்டால்’ என்பதாகும்; உறுதிமொழியில் அது மிகுந்த உறுதியை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: דִּבַּרְתִּי
  choice: சொல்லிவிட்டேன்
  rationale: முடிவுற்ற இறை அறிவிப்பையும் அதன் தற்போதைய உறுதியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִם לֹא
  choice: நிச்சயமாக
  rationale: சொல்லுக்குச் சொல் ‘இல்லாவிட்டால்’ என்று மொழிபெயர்க்காமல், உறுதிமொழிச் சூழலில் உள்ள வலியுறுத்தலைத் தெரிவிக்கிறது.
- source_word: הָעֵדָה
  choice: கூட்டத்தார்
  rationale: இஸ்ரவேலரின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கும் குழுமப் பொருளை, பிற்கால சமய அமைப்பைக் கட்டாயமாகச் சுட்டாமல் வழங்குகிறது.
- source_word: הָרָעָה
  choice: தீய
  rationale: இது சாதாரணமாக விரும்பத்தகாத நிலையை அல்ல, அவர்களுடைய கலகத்தின் மீதான அறநெறித் தீர்ப்பைக் குறிக்கிறது.
- source_word: הַנּוֹעָדִים עָלַי
  choice: எனக்கு எதிராக ஒன்றுகூடியுள்ள
  rationale: குழுவாகக் கூடுவதையும் அந்தக் கூடுகையின் எதிர்ப்புத் தன்மையையும் இரண்டையும் காக்கிறது.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: இந்தப் பாழ்நிலத்தில்
  rationale: மக்கள் குடியேறாத வறண்ட வெளிப்பகுதியைக் குறிக்கும் மִדְבָּר என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: יִתַּמּוּ
  choice: ஒழிந்துபோவார்கள்
  rationale: ‘முடிவுக்கு வருதல்/முற்றுப்பெறுதல்’ என்ற பொருளைத் தெரிவித்து, தொடர்ந்து வரும் வெளிப்படையான ‘சாவார்கள்’ என்பதிலிருந்து தனிக் கூறாக வைத்திருக்கிறது.
- source_word: וְשָׁם יָמֻתוּ
  choice: அங்கேயே சாவார்கள்
  rationale: தீர்ப்பு நிகழும் இடத்தை வலியுறுத்தும் ‘அங்கே’ என்பதையும் மரணத்தைக் குறிக்கும் தனிக் கூற்றையும் காக்கிறது.
theological_decisions:
- issue: אִם לֹא என்ற இறை உறுதிமொழி மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: ‘நிச்சயமாகச் செய்வேன்’ என்ற வலியுறுத்தப்பட்ட உறுதி
  alternative: சொல்லுக்குச் சொல் ‘இல்லாவிட்டால் இதைச் செய்வேன்’
  rationale: இங்கு இது நிறைவுறாத நிபந்தனை அல்ல; உறுதியான இறை அறிவிப்பாகச் செயல்படுகிறது. ஆகவே அதன் செயல்பாட்டுப் பொருள் தமிழில் வெளிப்படுத்தப்படுகிறது.
- issue: עֵדָה என்ற குழுமப் பெயர்
  choice: கூட்டத்தார்
  alternative: சபையார் / சமூகத்தார்
  rationale: தீர்ப்புக்குள்ளாகும் ஒன்றுகூடிய மக்களைச் சுட்டுகிறது; குறிப்பிட்ட பிற்கால திருச்சபை அமைப்பை உரைக்குள் கொண்டுவருவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இறைத் தீர்ப்பின் கண்ணியமான, கடுமையான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒழிந்துபோவார்கள்’ மற்றும் ‘சாவார்கள்’ தனித்தனியாக வைக்கப்பட்டதால் எபிரெய இணைக் கூறுகளின் பதற்றம் காக்கப்படுகிறது.
