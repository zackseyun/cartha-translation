  source_fidelity: மூலத்தின் காரணத் தொடர்பு, காலேபின் வேறுபட்ட ‘ஆவி’ குறித்த திறந்தநிலை, முழுமையான பின்பற்றுதல், நாட்டிற்குள் கொண்டுவரும் வாக்குறுதி, சந்ததியினரின் உடைமை ஆகியவை வரைவில் அடிப்படையில் சரியாக உள்ளன. ஆனால் அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களுடன் இணைக்கப்படாமல் வசன முடிவில் ஒருசேர வைக்கப்பட்டுள்ளன; அவற்றைத் தொடர்புடைய இடங்களுக்கு நகர்த்துதல் அவசியம்.
  naturalness: ‘வேறுபட்ட ஆவி அவனோடு இருந்ததால்’ என்பது மூலத்தின் עִמּוֹ (‘அவனோடு’) கூறைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது. ‘அவன் சென்ற அந்த நாட்டிற்குள் அவனை நான் அழைத்துவருவேன்’ என்பது இயக்கத்தையும் இலக்கையும் தெளிவாகக் காட்டுகிறது.
