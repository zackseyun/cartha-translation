  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: ta
  text: ஆனால் என் ஊழியன் காலேபோடு வேறுபட்ட ஆவி இருந்ததால்[a], அவன் என்னை முழுமையாகப் பின்பற்றினான்[b]; அவன் சென்ற அந்த நாட்டிற்குள் அவனை நான் அழைத்துவருவேன், அவன் சந்ததியினர் அதை உரிமையாக்கிக்கொள்வார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலேபிடம் வேறொரு ஆவி இருந்தது.” இது மற்ற இஸ்ரவேலரிடமிருந்து வேறுபட்ட அவனுடைய மனப்பாங்கையையோ உள்ளார்ந்த நிலையையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என்னை முழுமையாகப் பின்பற்றினான்” என்பதற்கான எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் “எனக்குப் பின்னால் நிரப்பினான்” என்பதாகும்; அதாவது, முழு மனதோடு அல்லது முற்றிலும் பின்பற்றினான்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதைச் சுதந்தரித்துக்கொள்வார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  choice: ஆனால் என் ஊழியன்
  rationale: முந்தைய சூழலில் நம்பிக்கையற்ற தலைமுறையுடன் காலேபை வேறுபடுத்துவதால் וְ எதிர்மறைத் தொடர்பாக ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. עֶבֶד இங்கு கடவுளுக்கு உண்மையுள்ள பணியாளரைக் குறிப்பதால் இயல்பான ‘ஊழியன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָלֵב
  choice: காலேப்
  rationale: எபிரெய தனிப்பெயர் தமிழின் வழக்கமான ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: עֵקֶב
  choice: …இருந்ததாலும்
  rationale: காலேபுக்குக் கிடைக்கும் வாக்குறுதியின் காரணத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பு தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: அவனிடம் வேறுபட்ட ஆவி இருந்தது
  rationale: רוּחַ என்பதன் ‘ஆவி/மனப்பாங்கு’ என்ற திறந்த பொருளை உடனே ‘மனப்பான்மை’ என்று குறுக்காமல், עִמּוֹ என்பதையும் ‘அவனிடம்’ எனப் பேணி மொழிபெயர்க்கிறது.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: அவன் என்னை முழுமையாகப் பின்பற்றினான்
  rationale: சொல்லுக்குச் சொல் ‘எனக்குப் பின்னால் நிரப்பினான்’ என்பது தமிழில் புரியாது. இந்த எபிரெய மரபுத்தொடரின் முழுமையான, உள்ளார்ந்த பின்பற்றுதலைத் தெளிவாகக் கூறுகிறது.
- source_word: וַהֲבִיאֹתִיו
  choice: அவனை நான் கொண்டுவருவேன்
  rationale: இறைவனின் உறுதியான வருங்காலச் செயலைக் குறிக்கும் சூழலுக்கு ஏற்ப எதிர்கால வாக்குறுதியாக வழங்கப்பட்டது.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: அவன் சென்றிருந்த நாட்டிற்குள்
  rationale: காலேப் உளவாளியாக முன்பு அந்த நாட்டிற்குச் சென்றதைக் குறிக்கும் בוא ... שמה என்பதன் இயக்கத்தையும், முன்நிகழ்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְזַרְעוֹ
  choice: அவன் சந்ததியினர்
  rationale: זֶרַע கூட்டுப்பொருளில் வரும் ‘வித்து/வழித்தோன்றல்கள்’ என்பதைக் குறிக்க, நவீனத் தமிழில் தெளிவான ‘சந்ததியினர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יוֹרִשֶׁנָּה
  choice: அதை உரிமையாக்கிக்கொள்வார்கள்
  rationale: ירשׁ இங்கு நாட்டைச் சுதந்தரித்து உடைமையாக்கும் பொருளைக் கொண்டுள்ளது; ‘உரிமையாக்கிக்கொள்வார்கள்’ செயற்பாட்டுடனான கைப்பற்றல்/உடைமைப் பொருளைப் பேணுகிறது.
theological_decisions:
- issue: காலேபிடம் இருந்த ‘வேறுபட்ட ஆவி’ என்பதன் பொருள்
  choice: குறிப்பாகத் தூய ஆவி என்று அடையாளப்படுத்தாமல், ‘வேறுபட்ட ஆவி’ என்ற பரந்த சொல்லாட்சி பேணப்பட்டது.
  alternative: வேறுபட்ட மனப்பாங்கு; கடவுளுடைய ஆவி தனிப்பட்ட முறையில் அவனுடன் இருந்தார்
  rationale: רוּחַ என்பது ஆவி, உள்ளார்ந்த மனநிலை, மனப்பாங்கு ஆகியவற்றைக் குறிக்கலாம். இவ்வசனம் தூய ஆவியை வெளிப்படையாக அடையாளப்படுத்தாததால், அதன் உண்மையான இறையியல் திறந்தநிலை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. காரணத் தொடர்கள் தமிழின் இயல்பான ‘…தாலும்’ அமைப்பில் இணைக்கப்பட்டுள்ளன. மூலத்தின் ‘ஆவி’ என்ற பொருள் திறந்த நிலையில் வைக்கப்பட்டுள்ளது; எபிரெய மரபுத்தொடர் வாசிப்புத் தெளிவுக்காகப் பொருள்வழியாக வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய முதன்மை உரையின் முடிவில் இடம்பெற்றுள்ளன.
