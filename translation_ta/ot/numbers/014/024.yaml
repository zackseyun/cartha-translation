  to: ஆனால் என் ஊழியன் காலேபோடு வேறுபட்ட ஆவி இருந்ததால்[a], அவன் என்னை முழுமையாகப் பின்பற்றினான்[b]; அவன் சென்ற அந்த நாட்டிற்குள் அவனை நான் அழைத்துவருவேன், அவன் சந்ததியினர் அதை உரிமையாக்கிக்கொள்வார்கள்.[c]
