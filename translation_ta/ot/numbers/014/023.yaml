  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: ta
  text: நான் அவர்களுடைய தந்தையருக்கு[b] சத்தியம் செய்து வாக்களித்த நாட்டை அவர்கள் நிச்சயமாகக் காணமாட்டார்கள்[a]; என்னை இகழ்ந்த எவரும் அதைக் காணமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவர்கள் நாட்டைக் கண்டால்.” இது ஒரு சத்தியவாக்கு அமைப்பு என்பதால், “அவர்கள் நிச்சயமாக நாட்டைக் காணமாட்டார்கள்” என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மூதாதையருக்கு.” எபிரெயத்தில், “தந்தையருக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: நிச்சயமாகக் காணமாட்டார்கள்
  rationale: இங்கு אִם ஒரு நிபந்தனையைத் தொடங்காமல், முந்தைய வசனத்தில் தொடங்கியுள்ள ஆணைச்சொல் அமைப்பில் உறுதியான மறுப்பை வெளிப்படுத்துகிறது. ஆகவே அதன் பொருளை இயல்பான தமிழில் வெளிப்படையாகக் கூறுகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இச்சூழலில் இது இஸ்ரவேலருக்கு வாக்களிக்கப்பட்ட குறிப்பிட்ட நாட்டைக் குறிக்கிறது; நவீன தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִשְׁבַּעְתִּי
  choice: ஆணையிட்டுக் கொடுத்த
  rationale: வினைச்சொல் ஓர் உறுதிமொழியுடன் ஆணையிடுவதைக் குறிக்கிறது. ‘ஆணையிட்டுக் கொடுத்த’ என்பது நாட்டைக் கொடுப்பதாக முன்னோர்களிடம் கடவுள் செய்த சத்தியத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: לַאֲבֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவர்களுடைய தந்தையர்’ எனப் பொருள்படும்; மூதாதையரைக் குறிக்கும் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מְנַאֲצַי
  choice: என்னை இகழ்ந்தவர்கள்
  rationale: נאץ என்பது கடவுளை அவமதித்து அலட்சியப்படுத்தும் மனப்பான்மையைச் சுட்டுகிறது. ‘இகழ்ந்த’ என்பது நேரடியானதும் கனமுள்ளதும் பொதுவாசகருக்குப் புரியக்கூடியதும் ஆகும்.
- source_word: לֹא יִרְאוּהָ
  choice: அதைக் காணமாட்டார்
  rationale: பெயரெச்சப் பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டைச் சுட்டுகிறது. ஒருமை வடிவம் ‘ஒருவரும்’ என்பதோடு இயல்பாக இணைந்து, எபிரெயத்தின் மறுப்பையும் மீளுரையையும் காக்கிறது.
theological_decisions:
- issue: தொடக்க ஆணைச்சொல் அமைப்பின் வலிமை
  choice: ‘நிச்சயமாகக் காணமாட்டார்கள்’ என்ற உறுதியான மறுப்பு
  alternative: ‘அவர்கள் நாட்டைக் கண்டால்’ என்ற சொல்லுக்குச் சொல் வடிவம்
  rationale: אִם யைக் கொண்ட எபிரெய ஆணைச்சொல் இச்சூழலில் மறைமுகமான சாபவாக்காகச் செயல்பட்டு, ‘அவர்கள் காணவே மாட்டார்கள்’ என்று பொருள்படுகிறது. நிபந்தனை வடிவை மட்டும் தமிழில் வைத்தால் தீர்ப்பின் பொருள் மறைந்துவிடும்.
- issue: אָבוֹת என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘தந்தையர்’
  alternative: ‘மூதாதையர்’
  rationale: மூலச்சொல்லின் ஆண்பால் குடும்பச் சொல்லை முதன்மை உரை காக்கிறது; அது இஸ்ரவேலின் முற்பிதாக்கள் அல்லது மூதாதையரைக் குறிக்கலாம் என்பதைக் அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதே நேரத்தில் தெய்வீகத் தீர்ப்பின் கண்ணியமும் கடுமையும் நிலைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிச்சயமாக’ ஆணைச்சொல்லின் வலிமையை வெளிப்படுத்துகிறது; ‘ஒருவரும்’ என்பது וְכָל ... לֹא என்பதன் பகிர்ந்தளிக்கும் முழுமையான மறுப்பை இயல்பான தமிழில் தருகிறது.
