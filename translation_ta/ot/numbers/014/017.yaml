translation:
  language: ta
  text: 'இப்போது, ஆண்டவரே, நீர் கூறியபடியே உமது வல்லமை பெரிதாகட்டும் என்று வேண்டுகிறேன். நீர் கூறியது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதும்
  rationale: வாவ் இணைப்பையும் கால/உரையாடல் மாற்றத்தைக் குறிக்கும் עַתָּה என்பதையும் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: יִגְדַּל
  choice: பெரிதாய் விளங்கட்டும்
  rationale: גדל என்பதன் ‘பெரிதாக இரு/பெருமையுறு’ என்ற வேண்டுகோள் நுணுக்கத்தைத் தக்கவைத்து, தமிழில் இறை வல்லமை ‘அதிகரிக்கட்டும்’ என்ற தவறான பொருள் தோன்றாமல் செய்கிறது.
- source_word: נָא
  choice: வேண்டுகோள் வினைமுற்றான ‘விளங்கட்டும்’ வழியாக வெளிப்படுத்தப்பட்டது
  rationale: மன்றாட்டை மென்மையாக்கும் துகளின் பணியை தமிழின் வேண்டுகோள் அமைப்பு இயல்பாக ஏந்துகிறது; தனியே ‘தயவுசெய்து’ என்பது இச்சூழலில் சற்றே அன்றாட நடையாக இருக்கும்.
- source_word: כֹּחַ
  choice: வல்லமை
  rationale: தெய்வீக ஆற்றல் மற்றும் செயலாற்றும் திறன் ஆகிய இரண்டையும் dignified modern Tamil-இல் இயல்பாகக் குறிக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது יהוה அல்ல, אֲדֹנָי என்ற இறைப்பட்டம். நேரடி மன்றாட்டில் அழைப்புவேற்றுமை தமிழில் இயல்பானது.
- source_word: כַּאֲשֶׁר
  choice: கூறியபடியே
  rationale: இறைவன் முன்பு கூறியதற்கேற்ப வேண்டுகோள் நிறைவேற வேண்டும் என்ற ஒப்புமை/ஒத்திசைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: דִּבַּרְתָּ
  choice: நீர் கூறிய
  rationale: இறைவனை மரியாதையுடன் ஒருமையில் நேரடியாகச் சுட்டுகிறது; முன் கூறப்பட்ட சொல் இப்போதைய வேண்டுகோளுக்கு அடிப்படையாக இருப்பதையும் சூழல் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'நீர் கூறியது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடி மேற்கோளை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; ‘என்று சொல்லி’ என்பதைக் காட்டிலும் வசன முடிவில் தெளிவாக உள்ளது.
theological_decisions:
- issue: אֲדֹנָי என்ற இறைப்பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: கர்த்தாவே
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה அல்ல, אֲדֹנָי என்ற பட்டமே உள்ளது. ‘ஆண்டவர்’ நவீன பொதுத்தமிழில் இயல்பானதும் குறிப்பிட்ட சபைமரபைச் சாராததும் ஆகும்.
- issue: ‘ஆண்டவரின் வல்லமை பெரிதாகட்டும்’ என்பதன் பொருள்
  choice: உமது வல்லமை பெரிதாய் விளங்கட்டும்
  alternative: ஆண்டவரின் வல்லமை பெருகட்டும்
  rationale: இறைவனின் உள்ளார்ந்த வல்லமை குறைவாக இருந்து அதிகரிக்க வேண்டும் என்று தீர்மானிக்காமல், அது செயலிலும் புகழிலும் பெரிதாய் வெளிப்பட வேண்டும் என்ற சாத்தியத்தைப் பாதுகாக்கிறது; அடிப்படை ‘பெரிதாகட்டும்’ பொருளும் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ். மோசே இறைவனிடம் நேரடியாக மன்றாடுவதால் ‘நீர்/உமது’ மற்றும் ‘ஆண்டவரே’ பயன்படுத்தப்பட்டுள்ளன. அடுத்த வசனத்தின் மேற்கோள் தொடர்வதை இரட்டைப்புள்ளி தெளிவாக்குகிறது.
