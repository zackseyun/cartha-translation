source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்து மலையின் உச்சிக்கு ஏறிச் சென்று, “இதோ, நாங்கள் இங்கே இருக்கிறோம். யாவே கூறிய இடத்துக்கு நாங்கள் ஏறிச் செல்வோம்; ஏனெனில் நாங்கள் பாவம் செய்துவிட்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: அவர்கள் அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுதல் அல்லது புறப்படுதல் என்பதைக் குறிக்கிறது; בַבֹּקֶר உடன் சேர்ந்திருப்பதால் ‘அதிகாலையில் எழுந்து’ என்பது கால வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: மலையின் உச்சிக்கு ஏறிச் சென்று
  rationale: עלה என்பது ‘ஏறிச் செல்’; רֹאשׁ הָהָר என்பது சொல்லர்த்தமாக ‘மலையின் தலை’, அதாவது அதன் உச்சி. இலக்கான உச்சியை நோக்கிய ஏற்றத்தைத் தமிழ் இயல்பில் இவ்வாறு தருகிறது.
- source_word: הִנֶּנּוּ
  choice: இதோ, நாங்கள் இங்கே இருக்கிறோம்
  rationale: இது தங்களை முன்வைக்கும் ஒரு சொற்றொடர். ‘நாங்கள் தயாராக இருக்கிறோம்’ என்று விரிவாகப் பொருள்கொள்ளாமல், அதன் நேரடியான தன்மையைப் பாதுகாக்கிறது.
- source_word: וְעָלִינוּ
  choice: நாங்கள் ஏறிச் செல்வோம்
  rationale: வடிவில் நிறைவுவினையாக இருந்தாலும், இச்சூழலில் அடுத்து செய்யவிருக்கும் உறுதியான செயல்நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: யாவே குறிப்பிட்ட இடத்துக்கு
  rationale: מָקוֹם என்பதற்கு இயல்பான இணை ‘இடம்’. אָמַר என்பது பொதுவாக ‘சொல்’; ஆனால் இங்கு அந்த இடத்தை யாவே முன்பு பேசியதைக் குறிக்கிறது. ‘குறிப்பிட்ட’ என்பது ‘வாக்குறுதி அளித்த’ என்ற கூடுதல் கருத்தைச் சேர்க்காமல் தமிழில் இயல்பாக உள்ளது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தனிப்பட்ட இறைப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: כִּי חָטָאנוּ
  choice: ஏனெனில் நாங்கள் பாவம் செய்துவிட்டோம்
  rationale: כִּי இங்கு அவர்கள் ஏறிச் செல்லும் முடிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. חטא-வின் ஒழுக்க மற்றும் இறையியல் கனத்தை ‘பாவம் செய்தோம்’ பாதுகாக்கிறது; ‘செய்துவிட்டோம்’ நிகழ்ந்த செயலை தற்போதைய ஒப்புக்கொள்ளுதலோடு இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: חָטָאנוּ என்பதன் ஒழுக்கப் பொருள்
  choice: நாங்கள் பாவம் செய்துவிட்டோம்
  alternative: நாங்கள் தவறு செய்துவிட்டோம்
  rationale: இங்கு மக்கள் தங்களுடைய கீழ்ப்படியாமையை ஒப்புக்கொள்கிறார்கள். ‘தவறு’ என்பதைவிட ‘பாவம்’ என்பது எபிரெயச் சொல்லின் கடவுளுக்கு எதிரான குற்றப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதாய் இருந்தாலும் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை. நேரடி உரையின் உறுதியான தொனி பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
