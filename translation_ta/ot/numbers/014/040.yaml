  to: அவர்கள் அதிகாலையில் எழுந்து மலையின் உச்சிக்கு ஏறிச் சென்று, “இதோ, நாங்கள் இங்கே இருக்கிறோம். யாவே கூறிய இடத்துக்கு நாங்கள் ஏறிச் செல்வோம்; ஏனெனில் நாங்கள் பாவம் செய்துவிட்டோம்” என்றார்கள்.
