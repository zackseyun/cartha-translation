base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: ta
  text: அமலேக்கியரும் கானானியரும் பள்ளத்தாக்கில் குடியிருக்கிறார்கள். நாளைத் திசை திரும்பி, செங்கடல்[a] வழியாகப் பாலைநிலத்திற்குப் புறப்பட்டுச் செல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “நாணற்கடல்.” மரபாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: அமலேக்கியரும் கானானியரும்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர்கள் குறிப்பிட்ட உருபுடன் வந்து இரு மக்கள் குழுக்களையும் கூட்டாகக் குறிக்கின்றன; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது. தொடக்க இணைப்புச்சொல் தனியே மிகைப்படுத்தப்படவில்லை.
- source_word: יוֹשֵׁב בָּעֵמֶק
  choice: பள்ளத்தாக்கில் குடியிருக்கிறார்கள்
  rationale: பங்கேற்புவினை தொடர்ந்திருக்கும் குடியிருப்பைக் குறிக்கிறது; עֵמֶק என்பதற்கு இச்சூழலில் ‘பள்ளத்தாக்கு’ நேரான பொருள்.
- source_word: מָחָר
  choice: நாளை
  rationale: அடுத்த நாளைக் குறிக்கும் கால வினையடை இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: פְּנוּ
  choice: திசைதிரும்பி
  rationale: פנה என்ற கட்டளை திசையை மாற்றுவதைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘திரும்பிப் பின்னே செல்லுங்கள்’ என்ற பொருளைச் சேர்க்காமல், மாற்றுத் திசை நோக்கித் திரும்பும் கருத்தைத் தெளிவாக்குகிறது.
- source_word: וּסְעוּ לָכֶם
  choice: நீங்கள் … புறப்பட்டுச் செல்லுங்கள்
  rationale: נסע முகாமை விட்டுப் பயணம் தொடங்குவதைக் குறிக்கிறது. לָכֶם தரும் முகமுகமான வலியுறுத்தல் தமிழில் வெளிப்படையான ‘நீங்கள்’ என்பதால் இயல்பாக வெளிப்படுகிறது; சொற்சொல்லான ‘உங்களுக்காக’ தவறான நோக்கப்பொருளைத் தரக்கூடும்.
- source_word: הַמִּדְבָּר
  choice: பாலைநிலம்
  rationale: மனிதக் குடியிருப்பு குறைந்த வறண்ட வனப்பகுதியைக் குறிக்கிறது; மணல் பாலைவனம் என்ற அளவுக்கு பொருளைச் சுருக்காமல் நவீனத் தமிழில் ‘பாலைநிலம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: דֶּרֶךְ יַם סוּף
  choice: செங்கடலுக்குப் போகும் வழியாக
  rationale: דֶּרֶךְ வழி அல்லது திசையைக் குறிக்கிறது. יַם סוּף என்பதற்கு மரபாக அறியப்படும் ‘செங்கடல்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் சொல்லடியான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
