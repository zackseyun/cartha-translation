  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: ta
  text: நீங்கள் அந்த நாட்டை உளவு பார்த்த நாட்களின் எண்ணிக்கையின்படி—நாற்பது நாட்கள்—ஒரு நாளுக்கு ஓர் ஆண்டாக, ஒரு நாளுக்கு ஓர் ஆண்டாக, நாற்பது ஆண்டுகள் உங்கள் அக்கிரமங்களைச் சுமப்பீர்கள்; என் எதிர்ப்பை அறிந்துகொள்வீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் விலகலை,’ ‘என் பகைமையை,’ அல்லது ‘என் அதிருப்தியை.’ சில மரபுவழி மொழிபெயர்ப்புகள் ‘என் வாக்குமீறலை’ என மொழிபெயர்க்கின்றன. இங்குள்ள அரிதான எபிரெயச் சொல், கலகம் செய்த இந்தத் தலைமுறையிடம் ஆண்டவர் கொண்ட எதிர்ப்பு அல்லது விலகலைக் குறிக்கலாம்; அது கடவுள் தமது வாக்கை நிறைவேற்றத் தவறினார் என்பதைக் கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: நாட்களின் எண்ணிக்கையின்படி
  rationale: ב + מִסְפָּר காட்டும் எண்ணிக்கை சார்ந்த ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תַּרְתֶּם אֶת־הָאָרֶץ
  choice: அந்த நாட்டை உளவு பார்த்த
  rationale: இச்சூழலில் תור என்பது கானான் நாட்டை ஆராய அனுப்பப்பட்ட உளவுப் பணியைக் குறிக்கிறது. ‘உளவு பார்த்த’ என்பது நவீனத் தமிழில் துல்லியமும் இயல்பும் உடையது; ‘அந்த நாடு’ சூழலில் ஏற்கெனவே குறிப்பிட்ட நாட்டைச் சுட்டுகிறது.
- source_word: אַרְבָּעִים יוֹם
  choice: நாற்பது நாட்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: ஒரு நாளுக்கு ஓர் ஆண்டாக, ஒரு நாளுக்கு ஓர் ஆண்டாக
  rationale: நாற்பது நாட்களுக்கும் நாற்பது ஆண்டுகளுக்கும் உள்ள தண்டனை சார்ந்த ஒப்புமையை வெளிப்படுத்துவதோடு, எபிரெய மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: תִּשְׂאוּ אֶת־עֲוֺנֹתֵיכֶם
  choice: உங்கள் அக்கிரமங்களைச் சுமப்பீர்கள்
  rationale: נשא עון என்ற செறிவான உருவகத் தொடரை நேரடியாகக் காக்கிறது; குற்றத்தையும் அதன் விளைவுகளையும் சுமத்தல் என்ற இரு பரிமாணங்களையும் முன்கூட்டியே ஒன்றாக மட்டும் விளக்கிவிடவில்லை.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: நியாயத்தீர்ப்பின் கால அளவை நேரடியாக வழங்குகிறது.
- source_word: וִידַעְתֶּם
  choice: அப்போது ... அறிந்துகொள்வீர்கள்
  rationale: ידע என்பதிலுள்ள அறிவதும் அனுபவித்து உணர்வதும் ஆகிய பரப்பை ‘அறிந்துகொள்வீர்கள்’ காக்கிறது. வாக்கியத்தின் விளைவு உறவைத் தமிழில் இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְּנוּאָתִי
  choice: என் எதிர்ப்பை
  rationale: அரிதான இச்சொல் எதிர்ப்பு, விலகல் அல்லது உறவு முறிவு சார்ந்த பொருளைக் கொண்டிருக்கலாம். உடனடித் தண்டனைச் சூழலில் ‘என் எதிர்ப்பு’ பொருத்தமானது; கடவுள் வாக்குத் தவறினார் என்ற தவறான கருத்தையும் உருவாக்காது.
theological_decisions:
- issue: תְּנוּאָתִי என்ற அரிதான சொல்லின் இறையியல் உணர்வுள்ள மொழிபெயர்ப்பு
  choice: என் எதிர்ப்பை
  alternative: என் விலகலை / என் பகைமையை / என் அதிருப்தியை / நான் வாக்குத் தவறியதை
  rationale: கலகம் செய்த தலைமுறைக்கு எதிரான ஆண்டவரின் நீதிசார் நிலைப்பாட்டை ‘என் எதிர்ப்பு’ வெளிப்படுத்துகிறது. அதேவேளையில், அரிதான எபிரெயச் சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பில் காக்கிறது. ‘நான் வாக்குத் தவறியதை’ என்பது கடவுளின் உண்மைத்தன்மை குறைந்தது போலத் தவறாக உணர்த்தக்கூடியதால் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தல் காக்கப்பட்டுள்ளது; அரிதான இறுதிச் சொல்லின் உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
