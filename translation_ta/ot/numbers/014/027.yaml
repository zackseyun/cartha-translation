- source_word: לָעֵדָה הָרָעָה הַזֹּאת
  choice: இந்தப் பொல்லாத கூட்டத்தாரை
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; மனிதர்களைக் கூட்டாகச் சுட்டுவதால் ‘கூட்டத்தார்’ இயல்பாக உள்ளது. רָעָה என்பதன் ஒழுக்கக் கண்டனத்தை ‘பொல்லாத’ காக்கிறது.
- source_word: מַלִּינִים / תְּלֻנּוֹת
  choice: முறுமுறுக்கும் / முறுமுறுப்புகளை
  rationale: வனாந்தரக் கதையில் வரும் தொடர்ச்சியான, எதிர்ப்புணர்வுள்ள குறைகூறலைச் சொல் மீளுருவாக்கத்துடன் காக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: கடவுளை நோக்கிய எதிர்ப்பின் வலிமையைத் தெளிவாகக் காட்டுகிறது; வெறுமனே ‘என்னைப் பற்றி’ என்ற பொருளாகத் தளர்த்தவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மரபுத்தொடரின் இங்கு குறிக்கப்படும் இனக்குழுவை நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் தெரிவிக்கிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמָעְתִּי
  choice: நான் கேட்டிருக்கிறேன்
  rationale: முன்னரே கேட்டதன் தற்போதைய விளைவை வலியுறுத்தும் எபிரெய நிறைவுவினையைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: முதல் வாக்கியத்தில் விடுபட்டுள்ள வினை
  choice: ‘நான் … பொறுத்துக்கொள்வேன்’ என்று உரையில் நிரப்பப்பட்டது
  alternative: வினையை நிரப்பாமல் ‘எதுவரை இந்தப் பொல்லாத கூட்டத்தார்…?’ என விடுதல்
  rationale: மசோரா எபிரெய உரையில் முதன்மை வினை வெளிப்படையாக இல்லை. தமிழில் முழுமையான கேள்வியாக அமையச் சூழலிலிருந்து ‘பொறுத்துக்கொள்வேன்’ சேர்க்கப்பட்டது; அது உரையில் உள்ள சொல் அல்ல என்பது அடிக்குறிப்பில் வெளிப்படையாகக் கூறப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: இச்சூழலில் முழு இஸ்ரவேல் சமூகமே குறிக்கப்படுகிறது. பாலினத்தை தேவையின்றி ஆண்களுக்கு மட்டும் கட்டுப்படுத்தாமல் இயல்பான இனப்பெயர் பயன்படுத்தப்பட்டது; எபிரெயத்தின் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
