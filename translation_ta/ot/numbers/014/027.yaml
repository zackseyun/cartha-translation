base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: ta
  text: “எதுவரை இந்தப் பொல்லாத சமூகத்தார் எனக்கு எதிராக முறுமுறுக்கிறார்கள்? இஸ்ரவேல் மக்கள்[b] எனக்கு எதிராக முறுமுறுக்கும் முறுமுறுப்புகளை நான் கேட்டிருக்கிறேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்”; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: எதுவரை
