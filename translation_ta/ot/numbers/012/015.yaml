translation:
  language: ta
  text: ஆகவே, மிரியாம் ஏழு நாட்கள் முகாமுக்கு வெளியே அடைத்து வைக்கப்பட்டாள். மிரியாம் முகாமுக்குள் சேர்த்துக்கொள்ளப்படும் வரை[a] மக்கள் புறப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படியாக, “மிரியாம் சேர்த்துக்கொள்ளப்படும் வரை.” எபிரெயத்தில் உள்ள வினை வடிவம் ‘ஒன்றாகக் கூட்டிச் சேர்த்துக்கொள்ளப்படுதல்’ என்பதைக் குறிக்கிறது; விலக்கப்பட்ட காலம் முடிந்தபின் அவள் முகாமுக்குள் சேர்க்கப்படுதலை இது இங்கே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: அடைத்து வைக்கப்பட்டாள்
  rationale: סגר என்பதன் நிஃபால் வடிவம் அவள் பிறரால் விலக்கி வைக்கப்பட்ட நிலையைக் குறிக்கிறது. சூழலில், முகாமுக்கு வெளியே தனிமைப்படுத்தப்பட்டதை இயல்பான நவீன தமிழில் இது தெளிவாகச் சொல்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இஸ்ரவேலரின் வனாந்தரத் தங்குமிடத்துக்கு வெளியே என்ற இடப்பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவைக் குறிக்கும் எபிரெயச் சொற்றொடரை தமிழில் இயல்பாகத் தருகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: பயணம் செய்துகொண்டிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான பொதுப்பெயர்.
- source_word: לֹא נָסַע
  choice: புறப்படவில்லை
  rationale: נסע இங்கு முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்படவில்லை’ அந்தப் பயணப் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: மிரியாம் மீண்டும் முகாமுக்குள் சேர்த்துக்கொள்ளப்படும் வரை
  rationale: אסף என்பதன் நிஃபால் வடிவம் சொற்படியாக ‘சேர்க்கப்படுதல்’ எனப் பொருள்படும். விலக்கப்பட்ட காலத்துக்குப் பின் அவள் முகாமுக்குள் மீண்டும் ஏற்றுக்கொள்ளப்பட்டதைச் சூழலுக்கேற்ப தெளிவுபடுத்துகிறது; சொற்படியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
