revisions:
- from: என் பணியாளனாகிய மோசேயோ அப்படிப்பட்டவன் அல்ல; என் வீடு முழுவதிலும் அவன் உண்மையுள்ளவன்.[a]
  to: என் ஊழியனாகிய மோசே அவ்வாறு அல்ல; என் வீடு முழுவதிலும் அவன் நம்பத்தகுந்தவன்.[a]
  rationale: The revision preserves the Hebrew contrast (לֹא כֵן), the metaphorical wording ‘in all my house’ (בְּכָל בֵּיתִי), and Moses’ status as God’s servant. It replaces an employment-leaning term with the more contextually appropriate biblical Tamil term and clarifies Moses’ reliability without over-interpreting the scope of ‘house.’
