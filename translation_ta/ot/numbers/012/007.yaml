  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: ta
  text: என் ஊழியனாகிய மோசே அவ்வாறு அல்ல; என் வீடு முழுவதிலும் அவன் நம்பத்தகுந்தவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வீட்டார் அனைவரிடையிலும்.” எபிரெயத்தில் “வீடு” என்பது கட்டடத்தை மட்டுமல்லாமல் வீட்டார் அல்லது ஒருவருடைய ஆளுகைப் பரப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: அப்படிப்பட்டவன் அல்ல
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தீர்க்கதரிசிகளுடன் மோசேயை வலுவாக வேறுபடுத்தும் எபிரெயச் சொல்லாட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַבְדִּי
  choice: என் பணியாளனாகிய
  rationale: இங்கு עֶבֶד அடிமைநிலையை வலியுறுத்தாமல், கடவுளுக்குச் சேவை செய்யும் மோசேயின் மதிப்புமிக்க உறவைச் சுட்டுகிறது; ஆகவே ‘பணியாளன்’ பொருத்தமானது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: בְּכָל בֵּיתִי
  choice: என் வீடு முழுவதிலும்
  rationale: ב முன்னிடைச்சொல்லையும் ‘வீடு’ என்ற மூல உருவகத்தையும் காக்கிறது; ‘குடும்பத்தார்’ அல்லது ‘ஆளுகைக்குட்பட்ட அனைத்தும்’ என்று பொருளை முன்கூட்டியே குறுக்கவில்லை.
- source_word: נֶאֱמָן
  choice: உண்மையுள்ளவன்
  rationale: நம்பத்தகுந்த தன்மை, விசுவாசம், பொறுப்பில் உறுதியாக இருத்தல் ஆகிய நுண்ணுணர்வுகளைச் சூழலுக்கேற்ற வகையில் தாங்குகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: தனி இடப்பெயரின் வலியுறுத்தலைத் தமிழில் தெளிவான எழுவாயாகக் காட்டுகிறது.
theological_decisions:
- issue: மோசேயின் பங்கைக் குறிக்கும் ‘என் வீடு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் வீடு’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் வீட்டார் அனைவரிடையிலும்’ அல்லது ‘என் மக்கள் அனைவரிடையிலும்’
  rationale: இது கடவுளின் வீட்டார், மக்கள் அல்லது ஆளுகைப் பரப்பைக் குறிக்கக்கூடும்; ஆயினும் எபிரெய உரை ‘வீடு’ என்ற உருவகத்தையே பயன்படுத்துவதால், அதன் பிற்கால வேதாகமத் தொடர்புகளையும் இயல்பான பொருள் விரிவையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘மோசேயோ’ என்ற எதிர்மறை ஒப்பீட்டு வலியுறுத்தல் לֹא כֵן என்பதன் சூழல்சார் வேறுபாட்டைத் தெளிவாக்குகிறது; ‘வீடு’ என்ற மூல உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
