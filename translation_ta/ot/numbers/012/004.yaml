  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: ta
  text: யாவே திடீரென்று மோசேயிடமும் ஆரோனிடமும் மிரியாமிடமும், “நீங்கள் மூவரும் வெளியேறிச் சந்திப்புக் கூடாரத்திற்குச் செல்லுங்கள்[a]” என்றார். அவர்கள் மூவரும் வெளியேறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியே வந்து சந்திப்புக் கூடாரத்திற்குச் செல்லுங்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை ஓர் இடத்திலிருந்து வெளியே நகர்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: פִּתְאֹם
  choice: திடீரென்று
  rationale: பேச்சின் எதிர்பாராத தன்மையையும் உடனடித் தன்மையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: צְאוּ
  choice: வெளியே வாருங்கள்
  rationale: יצא என்ற வினை ஓர் இடத்திலிருந்து வெளியே நகர்வதைக் குறிக்கிறது; இங்கு அழைப்பின் நேரடி உரையில் ‘வெளியே வாருங்கள்’ இயல்பாக உள்ளது. ‘வெளியே செல்லுங்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: שְׁלָשְׁתְּכֶם
  choice: நீங்கள் மூவரும்
  rationale: அழைக்கப்பட்ட மூன்று பேரையும் வெளிப்படையாகவும் வலியுறுத்தியும் குறிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவனும் இஸ்ரவேலரும் சந்திக்கும் கூடாரத்தைக் குறிக்கும் நிலையான, புரிந்துகொள்ள எளிய தமிழ் சொற்றொடர்.
- source_word: וַיֵּצְאוּ
  choice: வெளியே சென்றார்கள்
  rationale: எபிரெயக் கதைநடை வினையை நேரடியான இறந்தகாலத் தமிழில் வழங்குகிறது.
- source_word: שְׁלָשְׁתָּם
  choice: அவர்கள் மூவரும்
  rationale: மூவருமே கட்டளைக்குக் கீழ்ப்படிந்ததை எபிரெய உரையைப் போல மீண்டும் வலியுறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் திணிக்காமல் பாதுகாக்கப்படுகிறது.
- issue: צְאוּ என்பதன் திசைநிலை
  choice: வெளியே வாருங்கள்
  alternative: வெளியே செல்லுங்கள்
  rationale: மூல வினை அடிப்படையில் ஓர் இடத்திலிருந்து வெளியே நகர்வதை மட்டுமே குறிக்கிறது; பேச்சாளரின் நோக்கில் ‘வா’ அல்லது ‘போ’ என்ற நுணுக்கத்தைத் தெளிவாக நிர்ணயிக்காது. முதன்மை உரையில் இயல்பான தமிழைத் தேர்ந்தெடுத்து, மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள் மூவரும்’ மற்றும் ‘அவர்கள் மூவரும்’ என்பவை மூலத்தின் மீளுரைத்த வலியுறுத்தலை இயல்பாகப் பாதுகாக்கின்றன.
