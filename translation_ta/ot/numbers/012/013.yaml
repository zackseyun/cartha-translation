  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: ta
  text: 'மோசே யாவேயை நோக்கி உரக்கக் கூவி மன்றாடினார்: “இறைவனே, தயவுசெய்து அவளைக் குணமாக்கும்; தயவுசெய்து!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் வேண்டுதலைக் குறிக்கும் נָא என்ற சொல் இருமுறை வருகிறது: “இறைவனே, தயவுசெய்து அவளைக் குணமாக்கும்; தயவுசெய்து!” இந்த மறுபதிப்பு மோசேயின் மன்றாட்டின் அவசரத்தை வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: உரக்க மன்றாடி
  rationale: צעק என்பது தீவிரமான கூக்குரல் அல்லது அவசர வேண்டுதலைக் குறிக்கிறது. இங்கு மோசேயின் பரிந்துரையின் தீவிரத்தையும் வேண்டுதல் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל יְהוָה
  choice: யாவேயை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளையும் יהוה என்ற தனிப்பட்ட இறைப்பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: மோசே எழுப்பிய வேண்டுதலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லாடலை இயல்பான தமிழ் நேர்க் கூற்றாக வழங்குகிறது.
- source_word: אֵל
  choice: இறைவனே
  rationale: אֵל இங்கு விளிவேற்றுமையில் நேரடியாக அழைக்கும் சொல்லாக உள்ளது; கண்ணியமான நவீன தமிழில் ‘இறைவனே’ அந்த அழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נָא ... נָא
  choice: தயவுசெய்து ... தயவுசெய்து
  rationale: இருமுறை வரும் வேண்டுதல் இடைச்சொல்லை இருமுறையும் தக்கவைத்து, மோசேயின் அவசரமான மன்றாட்டை வெளிப்படுத்துகிறது.
- source_word: רְפָא
  choice: குணமாக்கும்
  rationale: רפא என்ற கட்டளை வினை மிரியாமின் உடல் துன்பத்திலிருந்து குணப்படுத்துவதைக் குறிக்கிறது; மரியாதைமிக்க வேண்டுகோள் வடிவம் தமிழில் ஜெபத்தின் தொனியைப் பேணுகிறது.
- source_word: לָהּ
  choice: அவளை
  rationale: மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு மிரியாமைக் குறிக்கிறது; தமிழில் செயப்படுபொருளாக வெளிப்படையாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் பொதுப் பட்டம் அல்லாமல் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் ஜெபத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெயத்தின் தீவிரத்தைக் காட்ட ‘உரக்க மன்றாடி’ என்றும், இருமுறை வரும் נָא-வை உரையிலும் குறிப்பிலும் பாதுகாத்தும் வழங்கப்பட்டுள்ளது.
