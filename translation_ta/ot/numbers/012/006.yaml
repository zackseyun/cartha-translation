source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: ta
  text: 'அவர் சொன்னார்: “இப்போது என் வார்த்தைகளைக் கேளுங்கள். உங்களிடையே ஒரு தீர்க்கதரிசி இருந்தால்[a], நான், யாவே, தரிசனத்தில் அவனுக்கு என்னை வெளிப்படுத்துவேன்[b]; கனவில் அவனோடு பேசுவேன்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களில் ஒருவர் தீர்க்கதரிசியாக இருந்தால்.” எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் “உங்கள் தீர்க்கதரிசி இருந்தால்” என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுக்கு என்னை அறியச் செய்வேன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனிடம் பேசுவேன்.” எபிரெயில் சொல்லுக்குச் சொல் “அவனில்/அவனுடன் பேசுவேன்” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடரை இயல்பான தமிழில் தருகிறது. சூழலில் பேசுபவர் யாவே என்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁמְעוּ נָא
  choice: இப்போது ... கேளுங்கள்
  rationale: பன்மை கட்டளையையும் נָא தரும் வலியுறுத்தலையும் இயல்பான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: דְבָרָי
  choice: என் வார்த்தைகளை
  rationale: மூலத்திலுள்ள பன்மை வடிவத்தை நேரடியாகப் பேணுகிறது.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: உங்களிடையே ஒரு தீர்க்கதரிசி இருந்தால்
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘உங்கள் தீர்க்கதரிசி இருந்தால்’ என்பதற்குப் பதிலாக, அதன் இயல்பான சமூகக் குறிப்பைத் தெளிவாகக் காட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּמַּרְאָה
  choice: தரிசனத்தில்
  rationale: מַרְאָה இங்கு தீர்க்கதரிசன வெளிப்பாட்டின் காட்சிவழி வடிவத்தைக் குறிக்கிறது; ‘தரிசனத்தில்’ என்பது சுருக்கமான இயல்பான தமிழ்.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: அவனுக்கு என்னை வெளிப்படுத்துவேன்
  rationale: ידע என்பதன் ஹித்பாயேல் வடிவத்திலுள்ள தன்னை அறியச்செய்யும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּחֲלוֹם
  choice: கனவில்
  rationale: வெளிப்பாட்டின் ஊடகமாகிய கனவை நேரடியாகக் குறிக்கிறது.
- source_word: אֲדַבֵּר בּוֹ
  choice: அவனோடு பேசுவேன்
  rationale: בּוֹ என்பதிலுள்ள ‘அவனுடன்/அவனில்’ என்ற வடிவத்தை மிகையாகச் சீராக்காமல் ‘அவனோடு’ என்று பேணுகிறது; தமிழில் இது இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது; ஆகவே பட்டத்தால் மாற்றாமலும் வேறு மரபுவழி உச்சரிப்பைத் திணிக்காமலும் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: தீர்க்கதரிசன வெளிப்பாட்டின் முறை
  choice: தரிசனத்தில் தம்மை வெளிப்படுத்துதல்; கனவில் அவனோடு பேசுதல்
  alternative: தரிசனத்தில் தோன்றுதல்; கனவில் அவனிடம் பேசுதல்
  rationale: மூலத்தின் இரண்டு வேறுபட்ட வினைச்சொற்களையும் ஊடகங்களையும் பேணி, தீர்க்கதரிசனத்தைப் பற்றிய பிற்கால இறையியல் விளக்கங்களைச் சேர்க்கவில்லை.
- issue: אֲדַבֵּר בּוֹ என்பதன் உறவுப்பொருள்
  choice: அவனோடு பேசுவேன்
  alternative: அவனிடம் பேசுவேன்
  rationale: எபிரெய முன்னிடைச்சொல் ‘உடன்/இல்’ என்ற நுணுக்கத்தை உடையது; ‘அவனோடு’ அதை நெருக்கமாகப் பேணுகிறது, ஆனால் ‘அவனிடம்’ என்பதும் சூழலுக்கேற்ற மொழிபெயர்ப்பாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான இறைஉரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’, ‘தரிசனம்’ ஆகியவை பொதுவாக அறியப்படும் வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன. இறைவனைச் சுட்டும் இடங்களில் தமிழ் மரியாதை ஒருமைக்கு ஏற்ப ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; தீர்க்கதரிசிக்கான எபிரெய ஆண்பால் ஒருமை ‘அவன்’ எனப் பேணப்பட்டுள்ளது.
