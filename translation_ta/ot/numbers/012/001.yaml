- from: மோசே மணந்திருந்த[a] கூஷியப் பெண்ணை முன்னிட்டு மிரியாமும் ஆரோனும் அவனுக்கு எதிராகப் பேசினார்கள்; ஏனெனில் அவன் ஒரு கூஷியப் பெண்ணை மணந்திருந்தான்[b].
  to: மோசே மணந்திருந்த[a] கூஷியப் பெண்ணின்[b] காரணமாக மிரியாமும் ஆரோனும் மோசேக்கு எதிராகப் பேசினார்கள்; ஏனெனில் அவன் ஒரு கூஷியப் பெண்ணை மணந்திருந்தான்.
  rationale: The revision corrects the mismatched Cushite footnote anchor and uses a more direct Tamil causal expression. It retains the Hebrew repetition, does not resolve the woman’s identity, and preserves the contextual marital sense of לקח with a footnote noting the literal idiom.
