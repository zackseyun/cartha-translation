source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: ta
  text: மோசே மணந்திருந்த[a] கூஷியப் பெண்ணின்[b] காரணமாக மிரியாமும் ஆரோனும் மோசேக்கு எதிராகப் பேசினார்கள்; ஏனெனில் அவன் ஒரு கூஷியப் பெண்ணை மணந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மணந்திருந்த’ என்பதற்கான எபிரெயச் சொற்றொடர் நேரடியாக ‘எடுத்திருந்த’ என்று பொருள்படும்; திருமணச் சூழலில் அது ‘மனைவியாக ஏற்றிருந்த’ அல்லது ‘மணந்திருந்த’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கூஷியப் பெண்’ என்பது கூஷ் நாட்டைச் சேர்ந்த பெண். மரபுவழியாக இது ‘எத்தியோப்பியப் பெண்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: மோசேக்கு எதிராகப் பேசினார்கள்
  rationale: דבר உடன் வரும் בְּ இச்சூழலில் எதிர்மறையாக ஒருவருக்கு எதிராகப் பேசுவதைக் குறிக்கிறது. எபிரெய வினை ஒருமை பெண்பாலில் இருந்தாலும், மிரியாமும் ஆரோனும் இணைந்த எழுவாயாக இருப்பதால் இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது; மிரியாமின் முன்னிலை வரிசையில் காக்கப்பட்டது.
- source_word: עַל אֹדוֹת
  choice: முன்னிட்டு
  rationale: அவர்களின் பேச்சிற்கான காரணம் அல்லது சந்தர்ப்பத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאִשָּׁה הַכֻּשִׁית
  choice: கூஷியப் பெண்
  rationale: כֻשִׁית என்பது கூஷைச் சேர்ந்த பெண்ணைக் குறிக்கிறது. நவீன எத்தியோப்பியாவுடன் நேரடியாக ஒப்பிடும் காலமுரண்பாட்டைத் தவிர்த்து மூலத்தின் இன/நில அடையாளம் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר לָקָח / לָקָח
  choice: மணந்திருந்த
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; திருமணச் சூழலில் ‘மனைவியாக எடுத்துக்கொள்/மணம் செய்’ என்ற மரபுத்தொடர்ப் பொருள் கொண்டது. ‘மணந்திருந்த’ என்பது நவீன தமிழில் தெளிவான இயல்பான இணை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னர் கூறப்பட்ட காரணத்தை மீண்டும் விளக்கி வலியுறுத்தும் இணைப்புச் சொல்லாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: மோசேயின் மனைவியின் அடையாளமும் இன/நிலச் சுட்டும்
  choice: ‘கூஷியப் பெண்’ என்று மொழிபெயர்த்து, அவளை சிப்போராளுடன் அடையாளப்படுத்தாமல் விடுதல்
  alternative: ‘எத்தியோப்பியப் பெண்’ என்று கூறுதல் அல்லது அவள் சிப்போராளே என்று விளக்குதல்
  rationale: வசனம் அவளை கூஷியப் பெண் என்றே குறிப்பிடுகிறது. வரலாற்று அல்லது ஒத்திசைவு விவாதங்களை மொழிபெயர்ப்பு தீர்மானிக்காமல் மூலத்தின் தெளிவையும் மீதமுள்ள கேள்வியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் காரணவிளக்க மீளுரைத்தல் காக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனேயே இடப்பட்டுள்ளன.
