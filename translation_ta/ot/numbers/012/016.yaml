  text: וְ/אַחַ֛ר נָסְע֥וּ הָ/עָ֖ם מֵ/חֲצֵר֑וֹת וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר פָּארָֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: ta
  text: அதன்பின் மக்கள் அசேரோத்திலிருந்து புறப்பட்டு, பாரான் வனாந்தரத்தில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: முந்தைய நிகழ்வுகளைத் தொடர்ந்து அடுத்து நடந்ததைச் சுட்டும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: נָסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணச் சூழலில் முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேல் சமூகத்தை ஒரு கூட்டாகக் குறிக்கும் பொதுவான, இயல்பான மொழிபெயர்ப்பு.
- source_word: מֵחֲצֵרוֹת
  choice: அசேரோத்திலிருந்து
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, מִן முன்னிடைச்சொல்லின் நீங்கல் பொருளை ‘இலிருந்து’ எனத் தருகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: ஒரு இடத்தில் தங்கி முகாம் அமைத்ததைக் குறிக்கும் தெளிவான நவீனத் தமிழ் வினை.
- source_word: בְּמִדְבַּר
  choice: வனாந்தரத்தில்
  rationale: மக்கள் குடியிருப்பு குறைந்த வறண்ட நிலப்பரப்பைக் குறிக்கும் מִדְבָּר என்பதற்கான வேதாகமச் சூழலுக்கு ஏற்ற, புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: פָּארָן
  choice: பாரான்
  rationale: எபிரேய இடப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பேணும் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன; இறுதியில் உள்ள மசோரா பத்திப் பிரிவுக் குறி மொழிபெயர்க்கப்படவில்லை.
