base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “அவளுடைய தந்தை அவள் முகத்தில் துப்பியிருந்தால், அவள் ஏழு நாட்களுக்கு அவமானமடைய மாட்டாளா?[a] அவள் ஏழு நாட்கள் முகாமுக்கு வெளியே அடைத்து வைக்கப்படட்டும்; அதன்பின் அவள் மீண்டும் உள்ளே சேர்த்துக்கொள்ளப்படுவாள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் ஏழு நாட்களுக்கு வெட்கப்பட மாட்டாளா?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன்பின் அவள் மீண்டும் கூட்டிச் சேர்க்கப்படுவாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: יָרֹק יָרַק
  choice: காறித் துப்பியிருந்தால்
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த எபிரெய தீவிரத்தைக் காட்டுவதோடு, நிபந்தனைச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּפָנֶיהָ
  choice: அவள் முகத்தில்
  rationale: துப்புதல் சார்ந்த இச்சொற்றொடரில் நேரடியான அவமதிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: תִכָּלֵם
  choice: அவமானமடைந்திருக்க மாட்டாளா?
  rationale: כלם என்பதன் நிஃபால் வடிவத்திலுள்ள அவமானப்படுத்தப்படுதல் அல்லது இழிவுக்குள்ளாகுதல் என்ற பொருளையும் எபிரெய சொல்லாட்சியின் வினாவையும் காக்கிறது.
- source_word: תִּסָּגֵר
  choice: அடைத்து வைக்கப்படட்டும்
  rationale: வெளியேற்றப்பட்டுத் தனியே வைக்கப்படுதல் என்னும் செயலின் செயப்பாட்டு வடிவத்தைத் தக்கவைக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இடத்தைக் குறிக்கும் எபிரெய சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: תֵּאָסֵף
  choice: மீண்டும் உள்ளே சேர்த்துக்கொள்ளப்படலாம்
  rationale: விலக்கப்பட்டிருந்த அவள் சமூகத்திற்குள் திரும்பச் சேர்க்கப்படுவதைச் செயப்பாட்டு வடிவில் வெளிப்படுத்துகிறது; 'சேர்க்கப்படுதல்' என்ற மூல உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: தந்தை முகத்தில் துப்புவது குறித்த கூற்றின் தன்மை
  choice: அவமானத்தையும் விலக்கிவைப்பையும் விளக்கும் கருதுகோள் சார்ந்த ஒப்புமை
  alternative: உண்மையில் நிகழ்ந்த சம்பவத்தை நினைவுகூரும் கூற்று
  rationale: எபிரெய அமைப்பு வினாவடிவ நிபந்தனை ஒப்புமையாக உள்ளது. மிரியாம் ஏழு நாட்கள் விலக்கப்படுவதற்கான காரணத்தை இது விளக்குகிறது; கூடுதல் குறியீட்டு அல்லது கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; வினாவடிவமும் செயப்பாட்டு அமைப்புகளும் மூலத்தின் வலிமை மற்றும் தெளிவின்மையை இயன்றவரை காக்கின்றன.
