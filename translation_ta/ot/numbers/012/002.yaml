source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: ta
  text: அவர்கள், “யாவே உண்மையிலேயே மோசே மூலமாக மட்டும்தான் பேசியிருக்கிறாரா? எங்கள் மூலமாகவும் அவர் பேசியிருக்கவில்லையா?” என்று சொன்னார்கள்[a]. யாவே அதைக் கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உண்மையிலேயே மோசேயிடம் மட்டும்தான் பேசியிருக்கிறாரா? எங்களிடமும் அவர் பேசியிருக்கவில்லையா?” இங்கு ‘பேசு’ என்ற வினைச்சொல்லுடன் வரும் எபிரெய முன்னிடைச்சொல், பேச்சைப் பெறுபவரையோ, யார்மூலம் பேச்சு நிகழ்கிறது என்பதையோ குறிக்கலாம். இந்தச் சூழல் தீர்க்கதரிசன அதிகாரத்தைப் பற்றியது என்பதால் முதன்மை உரையில் “மூலமாக” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் ... என்று சொன்னார்கள்
  rationale: אמר என்பதன் wayyiqtol வடிவம் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழ் உரைநடையில் இயல்பான நேரடிப் பேச்சு அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֲרַק אַךְ
  choice: உண்மையிலேயே ... மட்டும்தானா
  rationale: வினாப்பொருளோடு வரும் இரு கட்டுப்படுத்தும் வலியுறுத்தல் துகள்களும், மோசே ஒருவரை மட்டும் குறித்த சவாலான கேள்வியின் தீவிரத்தையும் தனிப்படுத்தலையும் வெளிப்படுத்துகின்றன.
- source_word: בְּמֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: தீர்க்கதரிசன வெளிப்பாட்டுச் சூழலில் דבר உடன் வரும் ב, பேச்சைப் பெறுபவரைக் குறிக்கவும் இடைநிலைக் கருவியைக் குறிக்கவும் இயலும். இங்கு தீர்க்கதரிசன அதிகாரமே விவாதிக்கப்படுவதால் ‘மூலமாக’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: דִּבֶּר יְהוָה
  choice: யாவே ... பேசியிருக்கிறார்
  rationale: דבר தெய்வீக உரையைச் சுட்டும் பொதுவான வினைச்சொல்; எபிரெய நிறைவு வடிவத்தையும் கேள்வியின் தற்போதைய பொருத்தத்தையும் தமிழில் இயல்பாகத் தெரிவிக்க ‘பேசியிருக்கிறார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பு; ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கப்படுகிறது.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: எங்கள் மூலமாகவும் அவர் பேசியிருக்கவில்லையா?
  rationale: முதல் கேள்வியிலுள்ள அதே ב + דבר அமைப்பு தொடர்வதால் ‘மூலமாக’ என்பதே ஒத்திசைவாக வைக்கப்பட்டுள்ளது; மிரியாமும் ஆரோனும் தாங்களும் தெய்வீக உரையின் வழிமூலங்கள் எனக் கோருவதே சூழலுக்குப் பொருந்துகிறது.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: யாவே அதைக் கேட்டார்
  rationale: எபிரெயில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள், அவர்களுடைய கூற்றைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் பட்டம் அல்ல, தெய்வீகத் தனிப்பெயரே உள்ளது. எனவே அதன் ஒலிவடிவத்தைத் தமிழில் பிரதிபலிக்கும் ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: דבר உடன் வரும் ב பெறுபவரைக் குறிக்கிறதா, இடைநிலைக் கருவியைக் குறிக்கிறதா?
  choice: மோசேயின் மூலமாக / எங்கள் மூலமாக
  alternative: மோசேயிடம் / எங்களிடம்
  rationale: இரு பொருள்களும் இலக்கண ரீதியாகச் சாத்தியம். ஆனால் உடனடிச் சூழலில் தீர்க்கதரிசன நிலையும் வெளிப்பாட்டை எடுத்துரைக்கும் அதிகாரமும் சவாலுக்குள்ளாக்கப்படுவதால், முதன்மை உரையில் இடைநிலைப் பொருள் தேர்ந்தெடுக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரட்டை வலியுறுத்தல் ‘உண்மையிலேயே ... மட்டும்தானா’ எனப் பாதுகாக்கப்பட்டு, எபிரெய முன்னிடைச்சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
