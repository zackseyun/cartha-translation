review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the urgent prohibition, Miriam as the feminine referent, the comparison with one dead, and the birth imagery. However, “சதையில் பாதி அரிக்கப்பட்டிருக்கும்” does not clearly mean “half of his flesh is consumed”; it can suggest that something is consumed within the flesh. The possessive whole-part relation must be made explicit.
  naturalness: The proposed revision is clear, modern standard Tamil, and retains the grave, pleading register. “அவள் ... போல இருக்க வேண்டாம்” is more idiomatic than “ஆகிவிட வேண்டாம்” in this simile.
  terminology: “கருப்பை,” “சதை,” and “அரிக்கப்பட்டிருக்கும்” appropriately preserve the concrete physical imagery. The footnote retains the legitimate, more explicit stillbirth interpretation without forcing it into the main text.
  issues:
  - severity: medium
    issue: The phrase “சதையில் பாதி” is structurally unclear.
    rationale: The Hebrew חֲצִי בְשָׂרוֹ means “half of his flesh.” Tamil should explicitly mark the possessive/partitive relationship as “தன் சதையின் பாதி.”
  - severity: low
    issue: “அவள் ஆகிவிட வேண்டாம்” is less natural for the requested comparison.
    rationale: “அவள் ... போல இருக்க வேண்டாம்” expresses the Hebrew negative plea naturally without adding the nuance of becoming.
  revised_text: தயவுசெய்து, தன் தாயின் கருப்பையிலிருந்து வெளிவரும்போதே தன் சதையின் பாதி அரிக்கப்பட்டிருக்கும் இறந்த ஒருவரைப் போல[a] அவள் இருக்க வேண்டாம்.
