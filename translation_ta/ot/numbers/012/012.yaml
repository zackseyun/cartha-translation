  rationale: எபிரெயச் சொற்றொடரின் அடிப்படை ஒப்புமையைப் பாதுகாக்கிறது; அதை முதன்மை உரையிலேயே ‘இறந்து பிறந்த குழந்தை’ என்று முழுமையாக விளக்கிவிடாமல், தொடர்ந்து வரும் பிறப்புக் காட்சியே பொருளைத் தெளிவாக்க அனுமதிக்கிறது.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: தன் தாயின் கருப்பையிலிருந்து வெளிவரும்போதே
  rationale: בְּ உடனான infinitive construct காலப் பொருளைத் தருகிறது. ‘வெளிவரும்போதே’ என்பது பிறப்பின் தருணத்தையும் மூலத்தின் உயிர்ப்பான காட்சியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: சதையில் பாதி அரிக்கப்பட்டிருக்கும்
  rationale: בשר என்பதன் உடல்சார்ந்த ‘சதை’ என்ற பொருள் காக்கப்படுகிறது. ‘அரிக்கப்பட்டிருக்கும்’ என்பது சொற்சொல்லான ‘தின்னப்பட்டிருக்கும்’ என்பதைவிட நோய் அல்லது சிதைவால் ஏற்பட்ட பயங்கரமான உடல்நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பெண்பால் ஒருமையின் குறிப்பு
  choice: ‘அவள்’ மிரியாமைக் குறிக்கிறது
  alternative: பெண்பால் குறிப்பை வெளிப்படையாகச் சொல்லாமல் விடுதல்
  rationale: உடனடியான சூழலில் ஆரோனின் மன்றாட்டு மிரியாமைப் பற்றியது; ‘அவள்’ என்று கூறுவது எந்தக் கோட்பாட்டையும் சேர்க்காமல் எபிரெயப் பெண்பால் வடிவத்தின் குறிப்பைத் தெளிவாக்குகிறது.
- issue: இறந்தவரைப் பற்றிய ஒப்புமை
  choice: முதன்மை உரையில் ‘இறந்த ஒருவர்’ என்ற பொதுவான வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘இறந்து பிறந்த குழந்தை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: பிறப்பின்போதே இறந்த குழந்தையின் காட்சி தொடர்ச்சியான கூற்றில் வலுவாகத் தெரிந்தாலும், כַּמֵּת தனியாக அதை முழுமையாகக் குறிப்பாக்கவில்லை. ஆகவே அந்த விளக்கம் அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் அளவிலான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் உருக்கமான வேண்டுகோளும் மூலத்தின் கடுமையான உடற்காட்சியும் காக்கப்பட்டுள்ளன. ‘கருப்பை’, ‘சதை’, ‘அரிக்கப்பட்டிருக்கும்’ ஆகிய சொற்கள் கண்ணியமானவையாகவும் அதே நேரத்தில் காட்சியின் தீவிரத்தை மங்கச் செய்யாதவையாகவும் தேர்ந்தெடுக்கப்பட்டன.
