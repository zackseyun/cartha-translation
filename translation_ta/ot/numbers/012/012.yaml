lexical_decisions:
- source_word: אַל נָא
  choice: தயவுசெய்து, ... வேண்டாம்
  rationale: אַל தடையையும் נָא மன்றாட்டின் அவசரத்தையும் மரியாதையையும் குறிக்கின்றன; ஆகவே வெறும் எதிர்மறைக் கட்டளையாக அல்லாமல் உருக்கமான வேண்டுகோளாக மொழிபெயர்க்கப்பட்டது.
- source_word: תְהִי
  choice: அவள் ஆகிவிட வேண்டாம்
  rationale: பெண்பால் ஒருமை வடிவம் சூழலில் மிரியாமைக் குறிக்கிறது. எதிர்மறை விருப்பம் அல்லது வேண்டுகோளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּמֵּת
