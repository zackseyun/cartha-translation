revisions:
- from: தயவுசெய்து, தன் தாயின் கருப்பையிலிருந்து வெளிவரும்போதே சதையில் பாதி அரிக்கப்பட்டிருக்கும் இறந்த ஒருவரைப் போல[a] அவள் ஆகிவிட வேண்டாம்.
