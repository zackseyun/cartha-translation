  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: ta
  text: தயவுசெய்து, தன் தாயின் கருப்பையிலிருந்து வெளிவரும்போதே தன் சதையின் பாதி அரிக்கப்பட்டிருக்கும் இறந்த ஒருவரைப் போல[a] அவள் இருக்க வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தாயின் கருப்பையிலிருந்து வெளிவரும்போதே தன் சதையின் பாதி அரிக்கப்பட்டிருக்கும், இறந்து பிறந்த குழந்தையைப் போல.” எபிரெயம் பிறக்கும்போதே இறந்த ஒருவரோடு அவளை ஒப்பிடுகிறது; சில மொழிபெயர்ப்புகள் இறந்து பிறக்கும் குழந்தையின் காட்சியை முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுகின்றன.
