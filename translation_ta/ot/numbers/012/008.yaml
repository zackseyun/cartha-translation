base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: ta
  text: “வாயோடு வாய் நான் அவனோடு பேசுகிறேன்[a]; தெளிவாகவே பேசுகிறேன், விடுகதைகள் வழியாக அல்ல. அவன் யெகோவாவின் சாயலைக் காண்கிறான்[b]. அப்படியிருக்க, என் ஊழியனாகிய மோசேக்கு எதிராகப் பேச நீங்கள் ஏன் அஞ்சவில்லை?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “வாயோடு வாய்.” இது நேரடியான, இடையீடற்ற உரையாடலை வலியுறுத்துகிறது; “முகமுகமாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யெகோவாவின் உருவம்” அல்லது “யெகோவாவின் தோற்றம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: வாயோடு வாய் பேசுவதுபோல்
  rationale: எபிரெயச் சொற்றொடரின் ‘வாயோடு வாய்’ என்ற நேரடிப் படிமத்தைத் தக்கவைத்து, தமிழில் இது நேரடியான உரையாடலைக் குறிப்பதை ‘பேசுவதுபோல்’ மூலம் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: אֲדַבֶּר בּוֹ
  choice: நான் அவனோடு பேசுகிறேன்
  rationale: דבר உடன் வரும் בְּ இங்கு ஒருவரோடு உரையாடுவதைக் குறிக்கிறது; ‘அவனோடு’ என்பது அந்தப் பரஸ்பர உரையாடல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וּמַרְאֶה
  choice: தெளிவாக
  rationale: ‘விடுகதைகளில் அல்ல’ என்பதற்கு எதிராக, வெளிப்படையான மற்றும் தெளிவான தொடர்பைக் குறிக்கும் வினையடைப் பொருள் சூழலுக்கு ஏற்றது.
- source_word: וְלֹא בְחִידֹת
  choice: விடுகதைகளில் அல்ல
  rationale: חִידֹת என்பது விடுகதைகள் அல்லது புதிரான கூற்றுகளைக் குறிக்கிறது; ‘விடுகதைகள்’ சாதாரண நவீனத் தமிழில் புரியக்கூடியதும் மூலத்தின் படிமத்தைப் பேணுவதுமாகும்.
- source_word: וּתְמֻנַת יְהוָה
  choice: யெகோவாவின் உருவம்
  rationale: תְּמוּנָה என்பதன் உருவம்/சாயல்/தோற்றம் என்ற பொருள் வரம்பில் ‘உருவம்’ உறுதியான மூலச்சொல் நெருக்கத்தைத் தருகிறது; தெய்வீக வெளிப்பாட்டின் தன்மையை மேலதிகமாக வரையறுக்கவில்லை.
- source_word: יַבִּיט
  choice: காண்கிறான்
  rationale: இச்சொல் நோக்கிப் பார்ப்பதை அல்லது உற்றுக் காண்பதைச் சுட்டுகிறது; ‘காண்கிறான்’ நவீனத் தமிழில் இயல்பாகவும் உரையின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: அப்படியிருக்க, ... நீங்கள் ஏன் அஞ்சவில்லை?
  rationale: முந்தைய கூற்றிலிருந்து வரும் கண்டனத் தீர்மானத்தை ‘அப்படியிருக்க’ வெளிப்படுத்துகிறது; ‘அஞ்சவில்லை’ குற்றத்திற்குரிய பயமின்மையைப் பாதுகாக்கிறது.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: என் ஊழியனாகிய மோசேக்கு எதிராகப் பேச
  rationale: சூழலில் בְּ பகைமையான பேச்சின் இலக்கைக் குறிக்கிறது; இருமுறை வரும் முன்னிடைச்சொல்லின் வலியுறுத்தலைத் தமிழில் இயல்பான பெயரடைத் தொடருடன் ‘எதிராக’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- issue: மோசே கண்ட தெய்வீக வெளிப்பாட்டின் விளக்கம்
  choice: யெகோவாவின் உருவம்
  alternative: யெகோவாவின் சாயல்; யெகோவாவின் தோற்றம்
  rationale: வசனம் மோசேயின் தனித்துவமான, நேரடியான வெளிப்பாட்டை உறுதிப்படுத்துகிறது; ஆனால் கடவுளைக் காண்பதன் மெய்யியல் தன்மையை விளக்கவில்லை. ‘உருவம்’ அந்த இறையியல் பதற்றத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான இறைவேத நடையைப் பயன்படுத்துகிறது. மூலத்தின் நேரடிப் பேச்சுப் படிமம், கண்டனத் தொனி, மற்றும் தெய்வீக வெளிப்பாட்டைப் பற்றிய உண்மையான பொருள் விரிவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
