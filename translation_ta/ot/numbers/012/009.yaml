source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: ta
  text: யாவேயின் கோபம் அவர்களுக்கு எதிராகப் பற்றி எரிந்தது[a]; அவர் புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “யாவேயின் மூக்கு அவர்களுக்கு எதிராக எரிந்தது”; இது கோபம் பற்றி எரிவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: பற்றியெரிந்தது
  rationale: חרה என்பது கோபம் சூடாகுதல் அல்லது எரிதல் என்ற உருவகத்தைத் தருகிறது. ‘பற்றியெரிந்தது’ அந்த எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַף
  choice: கோபம்
  rationale: இதன் நேரடிப் பொருள் ‘மூக்கு’; ஆனால் חרה என்பதுடன் சேர்ந்த இச்சொற்றொடரில் அது கோபத்தைக் குறிக்கிறது. தமிழில் ‘கோபம்’ என்பதே இயல்பான இடியோமாட்டிக் பொருள்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான இறைபெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: בָּם
  choice: அவர்களுக்கு எதிராக
  rationale: கோபத்தின் இலக்காக அவர்கள் இருந்ததை בְּ முன்னொட்டு இச்சூழலில் காட்டுகிறது; ‘அவர்களுக்கு எதிராக’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וַיֵּלַךְ
  choice: அவர் அங்கிருந்து புறப்பட்டுச் சென்றார்
  rationale: הלך இங்கு பேசி முடித்தபின் யெகோவா விலகிச் சென்றதைக் குறிக்கிறது. ‘அங்கிருந்து’ என்பது தமிழில் சூழல்சார் இயக்கத்தை இயல்பாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் இறைபெயர் நேரடியாக உள்ளது; ஆகவே ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராக வழங்கப்பட்டது. ‘யெகோவா’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் வாசகர்களுக்கு பரவலாகத் தெரிந்த வடிவம்; ‘யாவே’ மூல உச்சரிப்புக்கான மற்றொரு சாத்தியமான மறுவடிவாக்கம்.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய மொழியின் கோபம்-எரிதல் உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது; நேரடியாகத் தோன்றும் ‘மூக்கு’ என்ற கூறு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
