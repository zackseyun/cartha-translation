id: NUM.12.3
reference: Numbers 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: ta
  text: மோசே என்ற மனிதர், பூமியின்மேல் இருந்த எந்த மனிதரையும்விட மிகவும் தாழ்மையுள்ளவராக[a] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் சாந்தமானவராக.”
    reason: ענו என்பதற்கான ‘சாந்தம்/மென்மை’ சார்ந்த சாத்தியமான பொருளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: மோசே என்னும் மனிதரோ
  rationale: הָאִישׁ என்பதன் ‘மனிதர்’ என்ற சொல்லை விடாமல் வைத்துள்ளோம். வாவ் இணைப்பையும் இவ்வாக்கியத்தின் தலைப்புமாற்றத் தன்மையையும் இயல்பான தமிழ் ‘-ஓ’ அமைப்பு உணர்த்துகிறது; மூலத்தில் தனியான காலச்சுட்டுச் சொல் இல்லாததால் ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: ענו
  choice: தாழ்மையுள்ளவராக
  rationale: இச்சூழலில் மோசேயின் மனப்பாங்கை விவரிக்கும் ‘தாழ்மையான’ என்பதே இயல்பான பொருள். ‘சாந்தகுணமுள்ள’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: எபிரெய தீவிரப்படுத்தும் வினையடையின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: מִ/כֹּל הָאָדָם
  choice: எந்த மனிதரையும்விட
  rationale: מן + כל அமைப்பின் ஒப்பீட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. இங்கு ‘மனிதர்’ என்பது ஆண் ஒருவரை மட்டும் அல்லாமல் மனிதர் எவரையும் குறிக்கும் பொதுப்பொருளில் உள்ளது.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் மேற்பரப்பில் இருந்த
  rationale: எபிரெய மொழியின் ‘நிலத்தின் முகத்தின்மேல்’ என்ற உருவகத்தைப் புரியக்கூடிய நவீனத் தமிழில் ‘பூமியின் மேற்பரப்பில்’ என்று பாதுகாக்கிறது.
theological_decisions:
- issue: ענו என்பதன் குணவிளக்கப் பொருள்
  choice: தாழ்மையுள்ளவராக
  alternative: சாந்தகுணமுள்ளவராக
  rationale: சூழலில் தாழ்மையே முதன்மைப் பொருள்; எனினும் பலவீனம் அல்லது செயலற்ற தன்மை எனத் தவறாகக் குறுக்காமல், சாந்தம்/மென்மை சார்ந்த சொற்பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: הָאָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: எந்த மனிதரையும்விட
  alternative: எந்த நபரையும்விட
  rationale: ஒருமை ஒப்பீட்டு அமைப்பையும் மூலத்தின் אדם சொல்லையும் பாதுகாக்கிறது; தமிழில் ‘மனிதர்’ இங்கு மனிதர் எவரையும் உள்ளடக்கும் பொதுப்பெயராக இயல்பாகப் புரிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘மோசே என்னும் மனிதரோ’ என்பது மூலத்தின் பெயர்ச்சொல் அமைப்பையும் உரையாடல் தொடர்ச்சியையும் காக்கிறது; ‘பூமியின் மேற்பரப்பு’ மூல உருவகத்தைத் தக்கவைக்கிறது.
