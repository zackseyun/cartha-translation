  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: ta
  text: அப்போது யாவே ஒரு மேகத்தூணில் இறங்கி வந்து, கூடாரத்தின்[a] நுழைவாயிலில் நின்றார். அவர் ஆரோனையும் மிரியாமையும் அழைத்தார்; அவர்கள் இருவரும் முன்னே வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெயில் ‘கூடாரம்’ என்றே உள்ளது; சூழலில் இது சந்திப்புக் கூடாரத்தைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘அவர்கள் இருவரும் வெளியே வந்தார்கள்.’ எபிரெய வினைச்சொல் நேரடியாக ‘வெளியே சென்றார்கள்/வந்தார்கள்’ என்று பொருள்படும்; இங்கு அழைப்புக்குப் பதிலளித்து அவர்கள் முன்னே வந்ததை அது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்து
  rationale: ירד என்பதன் நேரடிப் பொருள் ‘இறங்கு.’ தமிழில் இயல்பான கதையோட்டத்துடன், மூலத்திலுள்ள கடவுளின் இறங்கிவருதலைக் குறிக்கும் உருவகத்தைத் தக்கவைக்க ‘இறங்கி வந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெயத் தெய்வீகப் பெயரின் தமிழ்ச் சீரெழுத்தாக்கம்; ‘ஆண்டவர்’ போன்ற பட்டப்பெயரைப் பதிலீடு செய்யாமல், மூலத்திலுள்ள தனிப்பெயரைத் தக்கவைக்கிறது.
- source_word: בְּעַמּוּד עָנָן
  choice: ஒரு மேகத்தூணில்
  rationale: בְּ என்பது இங்கு யாவே இறங்கிவந்த வெளிப்பாட்டு வடிவத்தைச் சுட்டுகிறது. எபிரெயில் பெயர்ச்சொல் குறிப்புச் சுட்டியின்றி இருப்பதால், இயல்பான தமிழில் ‘ஒரு மேகத்தூணில்’ என வழங்கப்பட்டது.
- source_word: וַיַּעֲמֹד
  choice: நின்றார்
  rationale: עמד என்பதன் எளிய, நேரடியான பொருளையும் தொடர்ச்சியான கதைநடையையும் தக்கவைக்கிறது.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவாயிலில்
  rationale: פתח என்பது ‘திறப்பு, வாசல், நுழைவாயில்’ எனப் பொருள்படும். இங்கு אֹהֶל என்ற சுருக்கமான வடிவமே இருப்பதால் முதன்மை உரையில் ‘சந்திப்புக் கூடாரம்’ என்று விரிவாக்கப்படவில்லை.
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: קרא என்பதன் பொதுவான பொருளான ‘அழை’ என்பதை இயல்பான நவீன தமிழில் வழங்குகிறது; ‘வரவழைத்தார்’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: ஆரோனையும் மிரியாமையும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவங்கள்; செயப்படுபொருள் வேற்றுமை இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் முன்னே வந்தார்கள்
  rationale: יצא என்பதன் நேரடிப் பொருள் ‘வெளியே செல்/வா.’ இங்கு அழைப்புக்குப் பதிலளித்து யாவேக்கு முன்பாக வருவதைச் சூழல் குறிப்பதால் ‘முன்னே வந்தார்கள்’ என்பது இயல்பான பொருளைத் தருகிறது; שְׁנֵיהֶם என்பது ‘இருவரும்’ என்று வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது. நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் அல்லது யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தக்கவைக்கிறது; குறிப்பிட்ட சமயப்பிரிவின் தனிச்சிறப்பையும் புகுத்தவில்லை.
- issue: யாவே இறங்கிவருவதாகக் கூறும் மனித உருவக மொழி
  choice: ‘இறங்கி வந்து’ என்ற நேரடியான இயக்க மொழியைத் தக்கவைத்தல்
  alternative: ‘தோன்றி’ என்று விளக்கமாக மாற்றுதல்
  rationale: எபிரெய மூலத்தில் இறங்குதல் வெளிப்படையாகக் கூறப்படுகிறது. அதைத் தக்கவைப்பது இறைத்தோற்றக் காட்சியைப் பாதுகாக்கிறது; கடவுளின் இயல்பைப் பற்றிய இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்துவதில்லை.
- issue: וַיֵּצְאוּ என்பதன் இடவியல் நோக்கம்
  choice: முன்னே வந்தார்கள்
  alternative: வெளியே வந்தார்கள் / இருவரும் புறப்பட்டு வந்தார்கள்
  rationale: சொல்லின் நேரடிப் பொருளுக்கும், அழைக்கப்பட்ட இருவரும் யாவேக்கு முன்பாக வருகிற சூழல்சார் பொருளுக்கும் இடையிலான வேறுபாட்டை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கி வந்து,’ ‘நின்றார்,’ ‘அழைத்தார்’ ஆகிய எளிய வினை வடிவங்கள் மூலத்தின் தொடர்ச்சியான இயக்கத்தைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் அவற்றுக்குரிய சொற்றொடர்களோடு இணைக்கப்பட்டுள்ளன.
