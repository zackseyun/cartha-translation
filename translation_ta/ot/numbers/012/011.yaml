source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: ta
  text: அப்போது ஆரோன் மோசேயிடம், “ஐயா, தயவுசெய்து நாங்கள் அறிவீனமாக நடந்துகொண்டு பாவம் செய்ததற்காகப் பாவத்தை எங்கள்மேல் சுமத்தாதீர்.[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றப்பொறுப்பை எங்கள்மேல் சுமத்தாதீர்.”
    reason: חַטָּאת என்பது இச்சூழலில் ‘பாவம்’ என்பதோடு அதன் குற்றப்பொறுப்பையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: ஐயா, தயவுசெய்து
  rationale: בִּי என்பது பணிவான மன்றாட்டையும் אֲדֹנִי மோசேயை நோக்கிய மரியாதை விளிப்பையும் குறிக்கின்றன. இயல்பான நவீன தமிழில் இரண்டையும் இணைத்து இவ்வாறு தருவது, மோசேயைத் தெய்வமாகக் குறிப்பிடும் தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: אַל נָא
  choice: சுமத்தாதீர்
  rationale: எதிர்மறை வேண்டுகோள் மரியாதை வினைமுற்றில் தரப்பட்டுள்ளது; נָא-வின் மன்றாட்டு நயம் முன்வரும் ‘தயவுசெய்து’ என்பதில் வெளிப்படுகிறது.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: அந்தப் பாவத்தை எங்கள்மேல் சுமத்தாதீர்
  rationale: שׁית + על என்பதன் ‘மேல் வைத்தல்/சுமத்துதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. חַטָּאת இங்கு செய்த பாவத்தையும் அதனால் வரும் குற்றப்பொறுப்பையும் குறிக்கக்கூடும்; முதன்மை உரையில் ‘பாவம்’ வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: நாங்கள் முட்டாள்தனமாக நடந்துகொண்டு
  rationale: Niphal வடிவிலுள்ள יאל இங்கு அறிவீனமாக அல்லது மூடத்தனமாக நடந்துகொண்டதைச் சுட்டுகிறது. ‘முட்டாள்தனமாக நடந்துகொண்டு’ என்பது அதன் ஒழுக்கப் பரிமாணத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: பாவம் செய்ததற்காக
  rationale: இரு אֲשֶׁר கூறுகளும் ஆரோனின் ஒப்புதலையும் வேண்டுகோளுக்கான காரணத்தையும் இணைக்கின்றன. தமிழ் வாக்கியத்தில் இரு செயல்களையும் ஒரே காரணத் தொடராக அமைப்பது இயல்பாகவும் மூலத்தின் வேண்டுகோள் வலிமையைத் தக்கவைத்தும் உள்ளது.
theological_decisions:
- issue: மோசேயை நோக்கி வரும் אֲדֹנִי என்பதன் மொழிபெயர்ப்பு
  choice: ஐயா
  alternative: என் ஆண்டவரே
  rationale: இங்கு இது மனிதருக்குரிய மரியாதை விளிப்பு; இறைப்பட்டம் அல்ல. ‘ஐயா’ பணிவையும் மரியாதையையும் இயல்பான தமிழில் தெரிவித்து, தெய்வீகப் பொருள் தோன்றுவதைத் தவிர்க்கிறது.
- issue: חַטָּאת என்பது பாவமா அல்லது குற்றப்பொறுப்பா
  choice: பாவம்
  alternative: குற்றப்பொறுப்பு
  rationale: சொல்லின் நேரடியான ஒழுக்கப் பொருளை முதன்மை உரை காக்கிறது; இச்சூழலில் தண்டனைக்குரிய குற்றப்பொறுப்பு என்ற நயமும் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ஆரோனின் பணிவான மன்றாட்டை ‘ஐயா, தயவுசெய்து’ என்றும், மூலத்தின் ‘மேல் வைத்தல்’ உருவகத்தை ‘சுமத்துதல்’ என்றும் இயல்பாகப் பாதுகாக்கிறது.
