base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: ta
  text: மேகம் கூடாரத்தின் மேலிருந்து விலகியது. இதோ, மிரியாம் பனியைப் போன்ற கடுமையான தோல் பாதிப்புக்கு உள்ளாகியிருந்தாள்[a]. ஆரோன் மிரியாமை நோக்கித் திரும்பினார்; இதோ, அவள் கடுமையான தோல் பாதிப்புக்கு உள்ளாகியிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல், நவீன மருத்துவத்தில் ‘தொழுநோய்’ அல்லது ‘ஹான்சன் நோய்’ என்று அடையாளப்படுத்தப்படும் நோயை மட்டுமே குறிக்க வேண்டியதில்லை; அது தீவிரமான பலவகைத் தோல் பாதிப்புகளையோ, சடங்குமுறைத் தூய்மைக்கேட்டை உண்டாக்கும் தோல் நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: குறிப்பிட்ட மேகத்தைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான தமிழில் அளிக்கிறது; சூழலில் இது ஆண்டவருடைய பிரசன்னத்தோடு தொடர்புடைய மேகம்.
- source_word: סָר
  choice: விலகியது
  rationale: ஓர் இடத்திலிருந்து அகலுதல் அல்லது நகர்தல் என்ற பொருளைத் தருகிறது; கூடாரத்தின் மேலிருந்த மேகம் அகன்றதை இயல்பாகச் சொல்கிறது.
- source_word: מֵעַל הָאֹהֶל
  choice: கூடாரத்தின் மேலிருந்து
  rationale: மேலுள்ள நிலையிலிருந்து அகலும் இயக்கத்தை מֵעַל துல்லியமாகக் காட்டுகிறது; אֹהֶל என்பதற்கு இங்கு சுருக்கமாக ‘கூடாரம்’ என்று தரப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் கவனத்தையும் காட்சியின் வியப்பூட்டும் தன்மையையும் காக்கிறது; இரு இடங்களிலும் உள்ள எபிரெய மறுபதிப்பும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: מְצֹרַעַת
  choice: கடுமையான தோல் நோயால் பாதிக்கப்பட்டு
  rationale: இச்சொல் நவீன மருத்துவம் வரையறுக்கும் ஹான்சன் நோயை மட்டும் குறிக்காது; வேதாகமச் சூழலில் பலவகைத் தீவிர தோல் பாதிப்புகளைக் குறிக்கக்கூடும். ஆகவே தவறான மருத்துவ அடையாளத்தைத் தவிர்த்து, பொருளின் பரப்பைக் காக்கும் நடை தேர்ந்தெடுக்கப்பட்டது.
- source_word: כַּשָּׁלֶג
  choice: பனியைப் போல் காணப்பட்டாள்
  rationale: எபிரெயத்தில் உள்ள சுருக்கமான ‘பனியைப் போல்’ என்ற ஒப்புமையைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வெண்மையான’ என்பதை உரைக்குள் சேர்க்காமல், தமிழில் இயல்பாக அமைக்கிறது.
- source_word: וַיִּפֶן ... אֶל־מִרְיָם
  choice: ஆரோன் மிரியாமை நோக்கித் திரும்பியபோது
  rationale: פנה என்பதிலுள்ள உடலைத் திருப்பும் செயலும் אֶל குறிக்கும் திசையும் தெளிவாகின்றன; தொடர்ந்த காட்சியை இயல்பான தமிழ் வாக்கியமாக இணைக்கிறது.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: இதோ, அவள் அந்தத் தோல் நோயால் பாதிக்கப்பட்டிருந்தாள்
  rationale: மூலத்தின் வலியுறுத்தும் மறுபதிப்பைத் தக்கவைக்கிறது. தமிழில் ஏற்கெனவே குறிப்பிடப்பட்ட பாதிப்பைக் குறிக்க ‘அந்தத்’ சேர்க்கப்பட்டுள்ளது.
