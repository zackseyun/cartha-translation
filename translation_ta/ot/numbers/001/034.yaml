source:
  edition: WLC
  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: ta
  text: 'மனாசேயின் மக்களில், அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும், பெயர் எண்ணிக்கையின்படி, இருபது வயதும் அதற்கு மேற்பட்டவர்களுமான, படைக்குச் செல்லும் ஆண்கள் அனைவரும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்குச் செல்லும் அனைவரும்.” எபிரெயச் சொற்றொடர் இராணுவப் பணிக்குத் தகுதியானவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: மனாசேயின் மக்களில்
  rationale: לְ இங்கு மக்கள் கணக்கெடுப்பின் கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. சுற்றியுள்ள வசனங்களிலிருந்து தொடரும் விடுபட்ட வாக்கிய அமைப்புக்கு “மக்களில்” இயல்பாகப் பொருந்துவதோடு, בנים என்பதன் மரபுவழி உறவையும் காக்கிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படி
  rationale: இந்தக் கணக்கெடுப்பு வாய்பாட்டில் இச்சொல் தலைமுறை வரிசை அல்லது மரபுவழிப் பிரிவுகளைக் குறிக்கிறது; “வம்சவரிசைகள்” அந்தப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது; நவீனத் தமிழில் “குலம்” என்பது “குடும்பம்” என்பதைக் காட்டிலும் இச்சூழலுக்கு துல்லியமானது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: இது இஸ்ரவேலின் தந்தைவழி மூதாதையர் குடும்ப அலகுகளைக் குறிக்கும் நிலையான உறவுமுறைச் சொற்றொடர். “தந்தைவழிக் குடும்பங்கள்” அதன் சமூக அமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர் எண்ணிக்கையின்படி
  rationale: தனிநபர்கள் பெயர்பெயராக எண்ணப்பட்டதைக் குறிக்கும் அதிகாரபூர்வக் கணக்கெடுப்பு மொழியை இந்தத் தேர்வு சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: இராணுவப் பணிக்கான வயது வரம்பைச் சுட்டும் எபிரெய மொழிவழக்கைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைப்பணிக்குச் செல்லும் ஆண்கள் அனைவரும்
  rationale: צָבָא இங்கு ஒழுங்கமைந்த இராணுவப் பணியைக் குறிக்கிறது. சூழல் இருபது வயதுக்கு மேற்பட்ட ஆண்களின் இராணுவக் கணக்கெடுப்பு என்பதால், பாலினக் குறிப்பை மறைக்காமல் “ஆண்கள்” என்று வெளிப்படையாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: கணக்கெடுப்பின் பாலினக் குறிப்பு
  choice: படைப்பணிக்குச் செல்லும் ஆண்கள் அனைவரும்
  alternative: படைப்பணிக்குச் செல்லும் அனைவரும்
  rationale: சூழல் இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய இஸ்ரவேல் ஆண்களின் இராணுவக் கணக்கெடுப்பாகும். ஆகவே ஆண்பால் குறிப்பை பொதுப்பாலாக மாற்றாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள் கணக்கெடுப்புக்குரிய முறையான தொனியும் எபிரெய மூலத்தின் தொடர்ச்சியான பட்டியல் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. இந்த வசனம் அடுத்த வசனத்தில் நிறைவடையும் வாக்கியத்தின் தலைப்புப் பகுதியாக இருப்பதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு குறியீடும் அதன் உரையும் ஒன்றுக்கொன்று பொருந்தாததால், மூல எபிரெயத்தில் தேவையான உரைமாற்று சந்தேகம் இல்லாத இவ்வசனத்தில் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
