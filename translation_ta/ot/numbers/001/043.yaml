lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்பில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கும் செயல்பாட்டு பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: இந்தக் கணக்கெடுப்பு வாய்பாட்டில் לְמַטֵּה என்பது கோத்திரச் சார்பை அடையாளப்படுத்துகிறது; தமிழில் ‘கோத்திரத்தில்’ என்பது இயல்பாக அந்தச் சார்பை வெளிப்படுத்துகிறது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ஐம்பத்து மூவாயிரத்து நானூறு
  rationale: எபிரெய எண்ணின் கூறுகளை நவீனத் தமிழின் இயல்பான எண் வரிசையில் துல்லியமாக வழங்குகிறது.
