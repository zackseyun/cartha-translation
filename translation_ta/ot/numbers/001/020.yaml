  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: ta
  text: 'இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள்: அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி, தலைதலையாக[a], இருபது வயதுமுதல் அதற்கு மேற்பட்ட ஒவ்வோர் ஆணும், படைக்குப் புறப்படுகிற அனைவரும்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “அவரவர் தலைகளின்படி”; அதாவது ஒவ்வொருவரும் தனித்தனியாகக் கணக்கிடப்படுதல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: ரூபனின் மகன்கள் ... எண்ணப்பட்டார்கள்
  rationale: எபிரெய வினைச்சொல் census formula-வைத் தொடங்குகிறது. தமிழில் வெறும் ‘இருந்தார்கள்’ என்று கொடுப்பது இயல்பற்றதால், தொடரின் பொருளுக்கேற்ற ‘எண்ணப்பட்டார்கள்’ என்பதில் வாக்கிய அமைப்பு நிறைவு செய்யப்பட்டது.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முதற்பேறான
  rationale: ரூபன் இஸ்ரவேலின் முதற்பேறு என்பதை நேரடியான அடைமொழியாகப் பாதுகாக்கிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: வம்சத் தலைமுறைப் பிரிவுகளைக் குறிக்கும் மூலச்சொல்லை அதிக விளக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திரத்துக்குள் உள்ள உறவுக்குழுக்களைக் குறிக்க ‘குலங்கள்’ இயல்பானதும் அடுத்துவரும் தந்தைவழிக் குடும்பங்களிலிருந்து வேறுபடுத்தக்கூடியதுமாகும்.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: ‘தந்தையரின் வீடுகள்’ என்ற நேரடி வடிவத்தைவிட, அந்தப் பண்டைய உறவமைப்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கையின்படி
  rationale: பெயர்வாரியாக ஆட்கள் கணக்கிடப்பட்டனர் என்ற மூலவாக்கியத்தின் முறையான மொழியைப் பாதுகாக்கிறது.
- source_word: לְגֻלְגְּלֹתָם
  choice: தலைதலையாக
  rationale: சொல்லின் நேரடிப் படிமமான ‘தலை/மண்டையோடு’ என்பதையும் தனித்தனியாக எண்ணுதல் என்ற வழக்குப் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: பாலினத்தைக் குறிப்பாகச் சுட்டும் எபிரெயச் சொல்லை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: இருபது வயதிலிருந்து மேலானவர்களைக் குறிக்கும் வயது வரம்பைத் தெளிவாகக் கூறுகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைக்குச் செல்கிற ஒவ்வொருவரும்
  rationale: மூலத்தில் திறமை அல்லது தகுதி என்பதற்கான வெளிப்படையான சொல் இல்லாததால் ‘தகுதியுள்ள’ எனச் சேர்க்காமல், ‘படைக்குப் புறப்படுகிற’ என்ற நிகழ்காலப் பங்கேற்பு வடிவத்துக்கு நெருக்கமாக மொழிபெயர்க்கிறது.
