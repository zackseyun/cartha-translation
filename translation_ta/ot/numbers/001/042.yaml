source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ta
  text: 'நப்தலியின் புதல்வர்கள்: அவர்களுடைய தலைமுறைகளின்படி, குலங்களின்படி, தந்தையர் வீட்டின்படி, பெயர்களின் எண்ணிக்கையின்படி, இருபது வயது முதல் அதற்கு மேற்பட்டவர்களில் படைக்குப் புறப்படுகிற ஒவ்வொருவரும்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: நப்தலி புதல்வர்கள்
  rationale: בְּנֵי என்பதன் ஆண்பால் மற்றும் வம்சவழிப் பொருளைப் பேணுகிறது; இங்கு நப்தலி கோத்திரத்தைச் சேர்ந்த ஆண்கள் குறிக்கப்படுகின்றனர்.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: வம்சப் பதிவின் அடிப்படையிலான பிரிவுகளைக் குறிக்கும் எபிரெயக் கணக்கெடுப்பு நடையைப் பேணுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இச்சூழலில் தனிக்குடும்பத்தைவிடப் பெரிய கோத்திர உட்பிரிவைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: இஸ்ரவேலின் தந்தைவழி வம்சக் குடும்ப அமைப்பை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர் எண்ணிக்கையின்படி
  rationale: பெயர்பெயராக நபர்களை எண்ணியதைக் குறிக்கும் மூலமொழியின் முறையான கணக்கெடுப்பு சொற்றொடருக்கு நெருக்கமானது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: கணக்கெடுப்புக்கான வயது வரம்பை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைக்குச் செல்லக்கூடிய அனைவரும்
  rationale: சொல்லர்த்தமான ‘படைக்குப் புறப்படும் அனைவரும்’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் இராணுவச் சேவைக்குத் தகுதியானவர்களைக் குறிக்கிறது; ‘செல்லக்கூடிய’ என்பது அந்தத் தகுதியைத் தெரிவிக்கிறது.
