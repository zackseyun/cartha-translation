translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கணக்கெடுப்பு பட்டியல் நடை பேணப்பட்டாலும், தமிழில் முழுமையான வாக்கியமாகப் புரிய ‘கணக்கிடப்பட்டார்கள்’ இருமுறை வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது சுற்றியுள்ள வசனங்களின் வினைச்சொல்லால் உணர்த்தப்படும் பொருளை அளிக்கிறது. ‘புதல்வர்கள்’ ஆண்பால் வம்ச உறவைப் பேணுகிறது; ‘அனைவரும்’ என்பதன் குறிப்பு சூழலால் அதே ஆண் கணக்கெடுப்புக் குழுவையே சார்கிறது.
