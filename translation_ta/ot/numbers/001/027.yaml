  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: ta
  text: யூதா கோத்திரத்தைச் சேர்ந்த எண்ணப்பட்டவர்கள் எழுபத்து நான்காயிரத்து அறுநூறு பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதிவுசெய்யப்பட்டவர்கள்.” இந்தக் கணக்கெடுப்பு வழக்கில் வரும் எபிரெயப் பெயரெச்சம் இரு விதமாகவும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்ற வினையின் செயப்பாட்டு வடிவம் இங்குள்ள மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் எண்ணப்பட்ட அல்லது பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது. “எண்ணப்பட்டவர்கள்” என்பது இயல்பான தமிழில் கணக்கெடுப்பின் பொருளைத் தெளிவாகத் தருகிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத “ஆண்கள்” என்பதைச் சேர்க்கவில்லை.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְ உடன் வரும் מַטֶּה இங்கு கோத்திரச் சார்பைக் குறிக்கிறது. “கோத்திரத்தில்” என்பது அந்தச் சார்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திரப் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: எழுபத்துநான்காயிரத்து அறுநூறு
  rationale: எபிரெய எண்ணிக்கை வரிசையின் மதிப்பை நவீனத் தமிழின் இயல்பான எண் அமைப்பில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தில் வெளிப்படையாக இல்லாத பாலினக் குறிப்பைச் சேர்க்காமல், கணக்கெடுப்பு சார்ந்த சொல்லாட்சியின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
