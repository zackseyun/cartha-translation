base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ta
  text: 'ஆசேரின் மகன்களுக்கு: அவர்களுடைய தலைமுறைகளின்படியும், குலங்களின்படியும், தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கைப்படி, இருபது வயதுமுதல் அதற்கு மேற்பட்ட, படைக்குப் புறப்படுகிற அனைவரும்:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “படைக்குப் புறப்படுகிற ஒவ்வொருவரும்”; இது இராணுவச் சேவைக்குத் தகுதியுடையவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: ஆசேரின் மகன்களில்
  rationale: לְ இங்கு மக்கள் கணக்கெடுப்பில் கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. ‘மகன்கள்’ என்பது எபிரெய உரையின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; தமிழ் சூழலில் இது சந்ததியாரையும் குறிக்கிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: வம்சவழிப் பிரிவுகளைக் குறிக்கும் சொல்லை மிகையாக ‘எழுத்துப் பதிவுகள்’ என்று விளக்காமல், அத்தியாயத்தின் திரும்பத் திரும்ப வரும் முறையான அமைப்பைத் தக்கவைக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இச்சூழலில் கோத்திரத்திற்குக் கீழுள்ள உறவுவழிக் குழுவைக் குறிக்கிறது; ‘குலங்கள்’ அதைப் பொதுவான ‘குடும்பங்கள்’ என்பதைக் காட்டிலும் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய தந்தையரின் வீடுகள்’ என்பது நவீன தமிழில் தவறாகப் புரியக்கூடும். தந்தைவழி மூதாதையர் குடும்ப அலகுகள் என்ற இஸ்ரவேலிய சமூகப் பொருளை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கைப்படி
  rationale: தனிநபர்கள் பெயர்பெயராக எண்ணப்பட்டதை உணர்த்தும் மூலமொழி வடிவத்துக்கு நெருக்கமான, இயல்பான தமிழ்.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: கணக்கெடுப்புக்குரிய குறைந்தபட்ச வயதையும் அதற்கு மேலுள்ள முழு வரம்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைப்பணிக்குச் செல்லும் அனைவரும்
  rationale: எபிரெயச் சொற்றொடரின் ‘படைக்குப் புறப்படுதல்’ என்ற இராணுவப் பொருளைத் தக்கவைத்து, தமிழில் இயல்பாகக் கூறுகிறது. ஆண் சார்ந்த சூழலை வயது மற்றும் கோத்திரக் கணக்கெடுப்பு ஏற்கெனவே உணர்த்துவதால், மூலத்தில் இல்லாத ‘ஆண்கள்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
