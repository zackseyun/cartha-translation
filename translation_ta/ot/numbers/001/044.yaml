  source_fidelity: 'முதற் சொற்றொடரில் הַפְּקֻדִים என்பது செயப்பாட்டு வடிவம்: கணக்கெடுக்கப்பட்ட/பதிவு செய்யப்பட்ட நபர்கள். வரைவு உரையின் “கணக்கிட்டவர்கள்” இயல்பாகக் கணக்கெடுத்த செய்பவர்களைக் குறிக்கிறது; ஆகவே முதன்மைப் பொருள் தலைகீழாகும். மோசே, ஆரோன், இஸ்ரவேல் தலைவர்கள் ஆகியோர் கணக்கெடுத்தவர்கள் என்ற தொடர்பும், பன்னிரண்டு தலைவர்கள் தத்தம் தந்தைவழிக் குடும்பத்தைப் பிரதிநிதித்துவப்படுத்தினர் என்ற பகிர்வுப் பொருளும் திருத்தத்தில் வெளிப்படுகின்றன.'
  naturalness: திருத்தப்பட்ட உரை நவீன பொதுத்தமிழில் தெளிவாக உள்ளது. “கணக்கெடுத்துப் பதிவு செய்தவர்களே” என்ற தொடர்புத் தொடர் செயப்பாட்டு நபர்களைத் தெளிவாகச் சுட்டுகிறது; “பிரதிநிதித்துவப்படுத்தினார்கள்” என்பது இச்சூழலில் இயல்பானதும் துல்லியமானதுமாகும்.
  terminology: “இஸ்ரவேலின் தலைவர்கள்,” “பன்னிரண்டு ஆண்கள்,” “தந்தைவழிக் குடும்பம்” ஆகியவை பொருத்தமானவை. “தந்தைவழிக் குடும்பத்தைப் பிரதிநிதித்துவப்படுத்தினார்கள்” என்பது לְבֵית אֲבֹתָיו-வின் குல/வம்ச அடிப்படையிலான பிரதிநிதித்துவ உறவைத் தேவையற்ற கோட்பாட்டு விளக்கமின்றி அளிக்கிறது.
