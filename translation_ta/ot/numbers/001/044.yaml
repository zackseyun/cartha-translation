translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ சமூக அமைப்பின் பொருளைப் பாதுகாக்கிறது; ‘பிரதிநிதியாக’ என்பது לְבֵית אֲבֹתָיו என்பதிலுள்ள பிரதிநிதித்துவ உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
