  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் இஸ்ரவேலின் தலைவர்களும் கணக்கெடுத்துப் பதிவு செய்தவர்களே இவர்கள்[a]. அந்தத் தலைவர்கள் பன்னிரண்டு ஆண்கள்; ஒவ்வொருவரும் தம் தந்தைவழிக் குடும்பத்தைப் பிரதிநிதித்துவப்படுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணிப் பதிவு செய்யப்பட்டவர்கள்.” எபிரெயச் சொல் கணக்கிடப்பட்ட நபர்களையோ கணக்கெடுப்பில் செய்யப்பட்ட பதிவையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பம்” என்பது இஸ்ரவேலின் கோத்திர அமைப்பிலிருந்த மூதாதையர் வழிக் குடும்பம் அல்லது குலப் பிரிவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: கணக்கிட்டவர்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்ட நபர்களைக் குறிக்கும் செயப்பாட்டு வடிவம். தமிழில் இயல்பாக இருக்க ‘கணக்கிடப்பட்டவர்கள்’ என்பதற்குப் பதிலாகச் சூழலுக்கேற்ற ‘கணக்கிட்டவர்கள்’ பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פָּקַד
  choice: கணக்கிட்ட
  rationale: எண்ணாகமம் 1-இன் சூழலில் மக்கள்தொகைக் கணக்கெடுப்பில் எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள்
  rationale: இவர்கள் கோத்திரத் தலைவர்கள்; ‘இளவரசர்கள்’ என்பது இன்றைய தமிழில் அரச மரபைத் தவறாக உணர்த்தக்கூடும்.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: பன்னிரண்டு ஆண்கள்
  rationale: எபிரெயச் சொற்றொடர் ஆண்பாலாரை வெளிப்படையாகக் குறிப்பிடுவதால் பாலின வேறுபாடு மறைக்கப்படவில்லை.
- source_word: אִישׁ אֶחָד
  choice: ஒவ்வொருவரும்
  rationale: ‘ஒருவர் வீதம்’ என்ற பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבֵית אֲבֹתָיו
  choice: தம் தந்தைவழிக் குடும்பத்திற்கான பிரதிநிதியாக
  rationale: לְ என்ற முன்னிடைச்சொல்லின் பிரதிநிதித்துவ உறவையும், בֵּית אָבוֹת என்ற தந்தைவழி மூதாதையர் குடும்ப/குலப் பிரிவையும் வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: பன்னிரண்டு தலைவர்களின் நிலை அல்லது பங்கைக் குறிப்பிடும் வினையைத் தமிழில் வெளிப்படையாகப் பாதுகாக்கிறது.
