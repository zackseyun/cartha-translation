translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் நடையும் கண்ணியமான வேதாகம மொழிநடையும் பேணப்பட்டுள்ளன. வசனத்தின் பெயர்ப்பட்டியல் அமைப்பைத் தெளிவாக்க முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
