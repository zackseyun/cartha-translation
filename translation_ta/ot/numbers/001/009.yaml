  text: 'For Zebulun: Eliab son of Helon.'
translation:
  language: ta
  text: 'செபுலோனுக்கு: ஏலோனின் மகன் எலியாப்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  choice: செபுலோனுக்காக
  rationale: முன்னொட்டு ל இக்கணக்கெடுப்புப் பட்டியலில் அந்தக் கோத்திரத்திற்கான பிரதிநிதியை அறிமுகப்படுத்துகிறது. கோத்திரம் என்ற சொல்லை விளக்கமாகச் சேர்க்காமல், பட்டியல் அமைப்பைப் பேணும் இயல்பான தமிழாக இது உள்ளது.
- source_word: אֱלִיאָב
  choice: ஏலியாப்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிவடிவத்தை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெய இணைப்பு வடிவத்திற்கான இயல்பான தமிழ் சொல்; தமிழில் உடைமை வேற்றுமையுடன் சேர்ந்து தெளிவாக அமைகிறது.
- source_word: חֵלֹן
  choice: ஏலோன்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது; சொல்லின் தொடக்க ח உயிர் முன் வரும் மெல்லிய தொண்டையொலி என்பதால் தமிழில் ஏ என வழங்கப்பட்டுள்ளது.
