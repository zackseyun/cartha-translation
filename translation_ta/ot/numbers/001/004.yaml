  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: ta
  text: உங்களோடு ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆண் ஒருவர் இருக்க வேண்டும்; அவர் தமது தந்தைவழிக் குடும்பத்தின் தலைவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִתְּכֶם יִהְיוּ
  choice: உங்களோடு ... இருக்க வேண்டும்
  rationale: உடனிருந்து மோசேக்கும் ஆரோனுக்கும் துணைசெய்ய வேண்டியவர்களை இத்தொடர் குறிக்கிறது. சூழலில் உள்ள எபிரெய இறந்தகாலமல்லாத வினைவடிவின் கட்டளைசார் எதிர்காலப் பொருளை ‘இருக்க வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ אִישׁ לַמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஓர் ஆண்
  rationale: 'אִישׁ என்பதன் இரட்டிப்பு பகிர்ந்தளிக்கும் பொருளுடையது: ஒவ்வொரு கோத்திரத்திற்கும் ஒரு பிரதிநிதி. ‘ஒவ்வொரு ... ஓர்’ என்ற தமிழ் அமைப்பு இதை இயல்பாகத் தெரிவிக்கிறது; ‘ஆண்’ என்பது மூலத்தின் பாலினக் குறிப்பையும் காக்கிறது.'
- source_word: מַטֶּה
  choice: கோத்திரம்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் இஸ்ரவேலின் அமைப்பு சார்ந்த இச்சூழலில் இச்சொல் கைத்தடியை அல்ல, கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: אִישׁ רֹאשׁ
  choice: அவர் ... தலைவராக
  rationale: தேர்ந்தெடுக்கப்படும் ஆண் தம் குழுவின் தலைவராக இருக்க வேண்டும் என்பதே இவ்விணைப்புச் சொல்லாக்கத்தின் பொருள். ‘தலைவர்’ எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְבֵית אֲבֹתָיו
  choice: தமது தந்தைவழிக் குடும்பத்தின்
  rationale: இது ஒரு தனி வீட்டைக் காட்டிலும் தந்தைவழி மரபில் அமைந்த விரிவான குடும்ப அல்லது குல அலகைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பம்’ நவீன வாசகருக்கு அந்தச் சமூக அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: தனி சுட்டுப்பெயர் தரும் வலியுறுத்தல் தமிழில் இரண்டாம் வாக்கியத்தின் வெளிப்படையான எழுவாயான ‘அவர்’ மூலம் இயல்பாகப் பாதுகாக்கப்படுகிறது.
