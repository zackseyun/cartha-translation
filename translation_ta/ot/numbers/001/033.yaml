  text: Those registered from the tribe of Ephraim were forty thousand five hundred.
translation:
  language: ta
  text: எப்பிராயீம் கோத்திரத்தில் பதிவுசெய்யப்பட்டவர்கள் நாற்பதாயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: பதிவுசெய்யப்பட்டவர்கள்
  rationale: פקד என்பதிலிருந்து வந்த இச்சொல், மக்கள்தொகைக் கணக்கெடுப்பில் எண்ணப்பட்டு பட்டியலில் சேர்க்கப்பட்டவர்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும், மூலத்தில் வெளிப்படையாக இல்லாத இராணுவ நுணுக்கத்தைச் சேர்க்காமலும் இதைத் தெரிவிக்கிறது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְ உடன் வரும் מַטֶּה இங்குக் கோத்திரச் சார்பைக் குறிக்கிறது. ‘கோத்திரத்தில்’ என்பது அந்தக் கோத்திரத்தைச் சேர்ந்தவர்களை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֶפְרָיִם
  choice: எப்பிராயீம்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் பிரதிபலிக்கும் வழக்கமான வேதாகமப் பெயர்ப்பு.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பதாயிரத்து ஐந்நூறு
  rationale: 40,500 என்ற எண்ணைத் தொடரோட்டமான தமிழ் உரைநடையில் இயல்பாக எழுத்தால் வழங்குகிறது.
