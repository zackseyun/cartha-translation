source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ta
  text: 'இசக்காரின் மகன்களைப் பொறுத்தவரை, அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தையர் வீடுகளின்படியும், பெயர்களின் எண்ணிக்கையின்படி, இருபது வயதுமுதல் அதற்கு மேற்பட்ட வயதுடைய, போருக்குச் செல்லத் தகுதியுள்ள ஆண்கள் அனைவரும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்குப் புறப்படும் ஒவ்வொருவரும்.” எபிரெயச் சொற்றொடர் நேரடியாக “படைக்குப் புறப்படும் ஒவ்வொருவரும்” என்று பொருள்பட்டு, இங்கு படைச்சேவைக்குத் தகுதியுள்ள ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: இசக்காரின் மகன்களில்
  rationale: לְ இங்கு மக்கள்தொகைக் கணக்கெடுப்பில் கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. בְּנֵי என்பதன் ஆண்பால், மரபுவழிப் பொருளை ‘மகன்கள்’ காக்கிறது; ‘-இல்’ தொடரும் பட்டியலின் இயல்பான தமிழ் அமைப்பை வழங்குகிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படி
  rationale: இச்சொல் இங்கு தலைமுறை சார்ந்த மரபுவழிப் பிரிவுகளைக் குறிக்கிறது. ‘வம்சவரிசை’ என்பது எழுத்துப்பூர்வமான வம்சாவளிப் பதிவைத் தேவையின்றி ஊகிக்காமல் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இஸ்ரவேலின் கோத்திர அமைப்பிலுள்ள உறவுமுறை உட்பிரிவைக் குறிக்கிறது; நவீனத் தமிழில் ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ இங்கு துல்லியமானது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: ‘தந்தையரின் வீடுகள்’ என்ற சொற்சொல் மொழிபெயர்ப்பின் தெளிவின்மையைத் தவிர்த்து, எபிரெயச் சொற்றொடரில் உள்ள தந்தைவழி மூதாதை இல்ல அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கையின்படி
  rationale: பெயரிடப்பட்ட தனிநபர்களாக எண்ணப்பட்டனர் என்ற கணக்கெடுப்பு வழக்கை மூலத்திற்கு நெருக்கமாகக் காக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: இருபது வயதை உள்ளடக்கிய கீழ் வரம்பையும் அதற்கு மேலான வயதினரையும் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: כֹּל יֹצֵא צָבָא
  choice: போருக்குச் செல்லத் தகுதியுள்ள ஆண்கள் அனைவரும்
  rationale: சொற்சொல்லாக இது ‘படைக்குப் புறப்படும் ஒவ்வொருவரும்’ என்பதாக இருந்தாலும், இக்கணக்கெடுப்புச் சூழலில் படைச்சேவைக்குத் தகுதியான ஆண்களைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தச் சூழல்பொருளைத் தெளிவாக்குகிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கணக்கெடுப்பின் ஆண்பால் வரம்பு
  choice: போருக்குச் செல்லத் தகுதியுள்ள ஆண்கள் அனைவரும்
  alternative: போருக்குச் செல்லத் தகுதியுள்ள அனைவரும்
  rationale: எபிரெயத் தொடர் இலக்கணத்தில் ஆண்பாலாக இருப்பதுடன், இச்சூழல் கோத்திரங்களிலுள்ள படை வயது ஆண்களைக் கணக்கிடுகிறது. ஆகவே பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பிட்ட வரம்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் வரும் எண்ணிக்கையை அறிமுகப்படுத்தும் பட்டியல் கூறாக இருப்பதால், மூலத்தின் வினையற்ற அமைப்பும் இறுதி முக்காற்புள்ளியும் காக்கப்பட்டுள்ளன.
