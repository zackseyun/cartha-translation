translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கணக்கெடுப்பின் பட்டியல் நடையும், வசனம் அடுத்த வசனத்தில் தொடரும் நிறைவுறாத இலக்கண அமைப்பும் இறுதிக் குறியீட்டின் மூலம் காக்கப்பட்டுள்ளன.
