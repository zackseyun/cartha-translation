source:
  edition: WLC
  text: לִ/בְנֵ֣י בִנְיָמִ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ta
  text: 'பென்யமீனின் மக்களில், அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி, இருபது வயதுமுதல் அதற்கு மேற்பட்ட வயதுடைய, படைக்குச் செல்லத் தகுதியுள்ள ஒவ்வொரு ஆணும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “படைக்குச் செல்லும் ஒவ்வொருவனும்”; இது படைச் சேவைக்குத் தகுதியுள்ளவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்களில்
  rationale: לִ־ இங்கு கணக்கெடுப்புப் பட்டியலில் கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. ‘மக்களில்’ என்பது அடுத்துவரும் வகைப்படுத்தல்களோடு இயல்பாக இணைவதுடன், எபிரெய உரையின் உறவுமுறை மொழியையும் காக்கிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படியும்
  rationale: கணக்கெடுப்புச் சூழலில் இச்சொல் தலைமுறை வழியான மரபுவழிப் பிரிவுகளைக் குறிக்கிறது. ‘வம்சவரிசைகள்’ என்பது இதை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படியும்
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவைக் குறிக்கிறது; ‘குலம்’ அதை அடுத்துள்ள தந்தைவழிக் குடும்பத்திலிருந்து வேறுபடுத்துகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படியும்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய தந்தையரின் வீடுகளின்படி’ என்றாலும், இது இஸ்ரவேலரின் தந்தைவழி மூதாதைக் குடும்ப அலகைக் குறிக்கும் மரபுத்தொடர். தமிழில் ‘தந்தைவழிக் குடும்பங்கள்’ அதன் அமைப்பைத் தெளிவாகத் தருகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர் எண்ணிக்கையின்படி
  rationale: பெயர்ப் பதிவின் அடிப்படையில் தனிநபர்கள் எண்ணப்பட்டதை இத்தொடர் குறிக்கிறது; மூலத்தின் கணக்கெடுப்பு நடையைச் சுருக்கமாகக் காக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: இருபது வயதை உள்ளடக்கிய கீழ் வயது வரம்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைப் பணிக்குச் செல்லத் தகுதியுள்ள ஒவ்வொரு ஆணும்
  rationale: சொல்லர்த்தத்தில் ‘படைக்குச் செல்லும் ஒவ்வொருவனும்’ என்ற இம்மரபுத்தொடர், இச்சூழலில் படைச் சேவைக்குத் தகுதியுள்ள ஆண்களைக் குறிக்கிறது. ‘தகுதியுள்ள’ என்பது செயல்பாட்டு பொருளைத் தெளிவாக்குகிறது; ஆண்பால் ஒருமைக் கூட்டுப்பயன்பாட்டை ‘ஒவ்வொரு ஆணும்’ பிரதிபலிக்கிறது.
