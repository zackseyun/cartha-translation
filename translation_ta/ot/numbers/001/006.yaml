translation:
  language: ta
  text: சிமியோன் கோத்திரத்திற்குச் சூரிசத்தாயின் மகன் செலுமியேல்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: சிமியோன் கோத்திரத்திற்கு
  rationale: לְ முன்னொட்டு இந்த மக்கள்தொகைக் கணக்கெடுப்புத் தலைவர்களின் பட்டியலில் கோத்திரச் சார்பைக் குறிக்கிறது. தனிநபரான சிமியோனை அல்ல, அவருடைய பெயரால் அழைக்கப்படும் கோத்திரத்தைத் தெளிவாகக் குறிக்கத் தமிழில் ‘கோத்திரத்திற்கு’ என்று இயல்பாக விரிவாக்கப்பட்டுள்ளது.
- source_word: שְׁלֻמִיאֵל
  choice: செலுமியேல்
  rationale: தனிப்பெயர் பொருள் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்பை நவீனத் தமிழுக்கு ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: பெயருடன் தந்தையை அடையாளப்படுத்தும் இச்சூத்திரத்தில் בֶּן என்பதன் நேரடியான, இயல்பான பொருள் ‘மகன்’ ஆகும்.
- source_word: צוּרִישַׁדָּי
  choice: சூரிசதாய்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க צ ஒலிக்குத் ‘ச’, שַׁדַּי பகுதிக்குத் தமிழில் வாசிக்க ஏற்ற ‘சதாய்’ பயன்படுத்தப்பட்டுள்ளது.
