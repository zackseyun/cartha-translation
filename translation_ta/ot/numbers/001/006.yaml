  register: சுருக்கமான பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. நடை நவீனமும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது; வசனம் முந்தைய அறிமுக வாக்கியத்தைத் தொடர்வதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
