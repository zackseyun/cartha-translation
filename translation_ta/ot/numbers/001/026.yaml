source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: ta
  text: 'யூதாவின் சந்ததியாருக்காக: அவர்களுடைய வம்சவரிசைகளின்படியும், குலங்களின்படியும், தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படியும், இருபது வயதும் அதற்கு மேற்பட்ட வயதுமுள்ள, போருக்குப் புறப்படும் ஒவ்வோர் ஆணும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்குச் செல்லும் ஒவ்வோர் ஆணும்.” இந்த எபிரெய வழக்குச் சொற்றொடர் படைச்சேவைக்குத் தகுதியுள்ளவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: யூதாவின் மகன்களில்
  rationale: בני என்பதன் அடிப்படைப் பொருளான ‘மகன்கள்’ என்பதையும், இங்கு யூதா கோத்திரத்தைச் சேர்ந்த ஆண் சந்ததியாரைக் குறிக்கும் கணக்கெடுப்புச் சூழலையும் காக்கிறது. לִ־ இங்கு பட்டியலின் தொடர்ச்சியில் ‘...மகன்களில்/சார்பாக’ என்ற உறவைத் தருகிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: இச்சொல் தலைமுறைகள், வம்சத் தொடர், மரபுப் பதிவுகள் ஆகிய பொருள் நிழல்களைக் கொண்டது. எழுத்துப் பதிவுகள் என்று மிகையாகத் தீர்மானிக்காமல் எபிரெயச் சூத்திரத்தை நெருக்கமாகக் காக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திரத்திற்குள் உள்ள சமூக உட்பிரிவுகளை משפחה குறிக்கிறது; இங்கு ‘குலங்கள்’ என்பது நவீனத் தமிழில் தெளிவாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய தந்தையரின் வீடுகள்’ என்றாலும், இங்கு தந்தைவழி அமைந்த மூதாதைக் குடும்ப அலகுகளைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ மூலத்தின் ஆண்வழிக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: பெயர்களின் எண்ணிக்கையின்படி
  rationale: தனிநபர்கள் பெயர்பெயராக எண்ணப்பட்டதைச் சுட்டும் மூலமொழிச் சொற்றொடரின் வடிவத்தையும் பொருளையும் காக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயது தொடங்கி அதற்கு மேற்பட்டவர்களில்
  rationale: கணக்கெடுப்பிற்கான வயது வரம்பைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: போருக்குச் செல்லும் ஒவ்வோர் ஆணும்
  rationale: சொற்றொடர் சொல்லர்த்தமாக ‘படைக்கு/போருக்கு புறப்படும் ஒவ்வொருவனும்’ எனும் பொருளைக் கொண்டது. ‘தகுதியுள்ள’ என்பதை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் நேரடி வடிவத்தைக் காத்து, அதன் படைச்சேவைச் சூழலை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: கணக்கெடுப்பின் பாலினக் குறிப்பு
  choice: போருக்குச் செல்லும் ஒவ்வோர் ஆணும்
  alternative: போருக்குச் செல்லும் அனைவரும்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ஆண்பாலில் உள்ளது; இருபது வயதுக்கு மேற்பட்ட போர்ச் சேவைக்குரிய ஆண்களை எண்ணும் சூழலும் இதை உறுதிப்படுத்துகிறது. ஆகவே பாலினத்தைப் பொதுமைப்படுத்தாமல் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
- issue: יֹצֵא צָבָא என்பதிலுள்ள செயல் மற்றும் தகுதி நிழல்கள்
  choice: போருக்குச் செல்லும்
  alternative: போருக்குச் செல்லத் தகுதியுள்ள
  rationale: மூலத்தில் ‘தகுதியுள்ள’ என்பதற்கான தனிச் சொல் இல்லை; ஆயினும் இந்த வழக்குச் சொற்றொடர் படைச்சேவைக்குரியவர்களைக் குறிக்கலாம். முதன்மை உரை நேரடி செயல் வடிவத்தைப் பாதுகாக்கிறது; சூழல்சார் தகுதி நிழல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புச் சூத்திரத்தின் ஒத்த அமைப்பையும் மரியாதையான வேதாகம நடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைமுறைகள்—குலங்கள்—தந்தைவழிக் குடும்பங்கள்’ என்ற சமூக அமைப்பின் படிநிலை தெளிவாக வைக்கப்பட்டுள்ளது.
