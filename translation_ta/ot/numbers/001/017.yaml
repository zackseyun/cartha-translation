source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் பெயரிட்டு அடையாளம் காட்டப்பட்டிருந்த இந்த ஆண்களை[a] தங்களுடன் கூட்டிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெயர்களால் குறிப்பிடப்பட்டிருந்த இந்த ஆண்களை”; அதாவது, பெயர் சொல்லிக் குறிப்பாக அடையாளம் காட்டப்பட்டவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்பதாக இருந்தாலும், இச்சூழலில் முன்பே பெயரிட்டு அடையாளப்படுத்தப்பட்ட பிரதிநிதிகளை மோசேயும் ஆரோனும் தங்களுடன் சேர்த்துக்கொண்ட செயலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும்
  rationale: எபிரெய தனிப்பெயர்கள் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; ‘-உம்’ இணைப்புகள் இருவரையும் இயல்பாக இணைக்கின்றன.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: இந்த ஆண்களை
  rationale: אֲנָשִׁים இங்கு முந்தைய வசனங்களில் பெயரிடப்பட்ட ஆண் பிரதிநிதிகளைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது சூழலிலிருந்து பெறப்படும் விளக்கத்தை நேரடியாக உரைக்குள் சேர்த்துவிடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: பெயரால் குறிப்பிடப்பட்டிருந்த
  rationale: נקב என்பதன் நிபால் வடிவமும் בְּשֵׁמוֹת என்பதும் குறிப்பிட்ட நபர்களைப் பெயரிட்டு அடையாளப்படுத்தியதைச் சுட்டுகின்றன. ‘குறிப்பிடப்பட்டிருந்த’ என்பது முன்பே நடந்த அடையாளப்படுத்தலை இயல்பான தமிழில் காக்கிறது.
