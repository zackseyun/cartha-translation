revisions:
- from: எனவே மோசேயும் ஆரோனும் பெயரால் குறிப்பிடப்பட்டிருந்த இந்த ஆண்களை[a] அழைத்துக்கொண்டார்கள்.
  to: மோசேயும் ஆரோனும் பெயரிட்டு அடையாளம் காட்டப்பட்டிருந்த இந்த ஆண்களை[a] தங்களுடன் கூட்டிக்கொண்டார்கள்.
  rationale: The revision renders לקח with an idiomatic Tamil expression for taking persons along, rather than implying a summons. It retains the male referent of הָאֲנָשִׁים and clarifies the idiom נִקְּבוּ בְּשֵׁמוֹת as explicit identification by name. The footnote remains anchored to the identified men and supplies the closer lexical alternative.
  reviewer_model: gpt-5.6-terra
