translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வினையின் நேரடியான ‘எடுத்துக்கொண்டார்கள்’ என்ற வடிவம் தமிழில் மனிதர்களைப் பொருள்போல் எடுத்தல் என ஒலிக்கக்கூடும்; ஆகவே சூழலுக்கேற்ற ‘அழைத்துக்கொண்டார்கள்’ தேர்ந்தெடுக்கப்பட்டது. அடையாளப்படுத்துதல் என்ற நுணுக்கம் முதன்மை உரையிலும் மாற்று வடிவம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
