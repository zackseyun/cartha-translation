translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. நிர்வாகக் கணக்கெடுப்பு மற்றும் வம்சவழிப் பதிவு ஆகிய இரு அம்சங்களும் காக்கப்பட்டுள்ளன. மூலத்தில் நேரடியாக இல்லாத ‘ஆண்கள்’ என்ற சொல்லைச் சூழலிலிருந்து இவ்வசனத்துக்குள் இறக்குமதி செய்யவில்லை. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
