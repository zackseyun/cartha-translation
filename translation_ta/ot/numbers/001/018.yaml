  rationale: The revision replaces awkward collective and age phrasing, keeps the genealogical registration distinct from the enumeration, and follows the Hebrew census sequence more closely. Footnote a remains anchored to the rare genealogical verb; footnote b is anchored to “தலைக்குத் தலை,” its Tamil rendering of the head/skull counting idiom.
