base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: ta
  text: அவர்கள் இரண்டாம் மாதத்தின் முதல் நாளில் முழு சமூகத்தையும் ஒன்றுகூட்டினார்கள். இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்கள் தங்கள் குலங்களின்படியும் தங்கள் தந்தையர் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி, தலைக்குத் தலை தங்கள் வம்சாவளியை அறிவித்துப் பதிவுசெய்துகொண்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் வம்சவழியை அறிவித்து’ / ‘வம்சாவளியின் அடிப்படையில் தங்களைப் பதிவுசெய்து.’ இதற்கான எபிரேய வினைச்சொல் அரிதானது; பிறப்புவழி மரபின் அடிப்படையில் பதிவுசெய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அவரவர் தலையின்படி’ அல்லது ‘அவரவர் மண்டையோட்டின்படி’; ஒவ்வொரு நபரும் தனித்தனியாக எண்ணப்பட்டார் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: ஒன்றுகூட்டினார்கள்
  rationale: கהל என்பதன் ஹிஃபில் வடிவம் மற்றவர்களைக் கூடிவரச் செய்வதைக் குறிக்கிறது; செயப்படுபொருள் சார்ந்த இந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הָעֵדָה
  choice: மக்கள் சபையார் அனைவரையும்
  rationale: עֵדָה இங்கு இஸ்ரவேலின் ஒழுங்கமைந்த சமூகத்தைக் குறிக்கிறது. ‘மக்கள் சபையார்’ என்பது திருச்சபை என்ற பிற்காலச் சிறப்புப் பொருளைத் திணிக்காமல், சமூக மற்றும் கூடுகை அம்சங்களைத் தக்கவைக்கிறது.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தின் முதல் நாளில்
  rationale: எபிரேய நாட்காட்டி மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: וַיִּתְיַלְדוּ
  choice: தங்கள் வம்சாவளியைத் தெரிவித்து ... பதிவுசெய்துகொண்டார்கள்
  rationale: ילד என்பதன் அரிதான ஹித்பயேல் வடிவம் பிறப்புவழி அல்லது மரபுவழி அடையாளத்தை அறிவித்து கணக்கில் சேர்வதைக் குறிக்கிறது. நிர்வாகப் பதிவையும் வம்ச அடிப்படையையும் இணைத்துக் காட்ட இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: தங்கள் குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு சூழலில் מִשְׁפָּחָה ஒரு பரந்த உறவுக் குழுவான குலத்தைக் குறிக்கிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: ‘தந்தையரின் வீடு’ என்ற எபிரேய உறவுமுறைச் சொல்லின் தந்தைவழி அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர் பெயராக
  rationale: பெயரிடப்பட்ட ஒவ்வொரு நபரும் தனித்தனியாகப் பட்டியலிடப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உள்ளவர்கள்
  rationale: வயது வரம்பைக் குறிக்கும் எபிரேய மரபுத்தொடரின் தெளிவான நவீனத் தமிழாக்கம்; இவ்வசனம் வெளிப்படையாகச் சொல்லாத பாலினத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: לְגֻלְגְּלֹתָם
  choice: ஆள் ஆளாக
  rationale: சொல்லர்த்தத்தில் ‘அவரவர் மண்டையோட்டின்படி/தலையின்படி’ என்பது ஒவ்வொரு நபரையும் தனித்தனியாக எண்ணும் மரபுத்தொடர்; தமிழில் அதன் நோக்கத்தை இயல்பாகக் காட்டுகிறது.
