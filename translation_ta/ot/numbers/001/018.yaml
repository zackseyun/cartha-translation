revisions:
- from: அவர்கள் இரண்டாம் மாதத்தின் முதல் நாளில் மக்கள் சபையார் அனைவரையும் ஒன்றுகூட்டினார்கள். இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உள்ளவர்கள் தங்கள் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும் தங்கள் வம்சாவளியைத் தெரிவித்து[a], பெயர் பெயராக, ஆள் ஆளாக[b] பதிவுசெய்துகொண்டார்கள்.
