- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுவழிப் பெயரமைப்பில் உள்ள ‘மகன்’ என்ற உறவைக் குறிக்கும் சொல்லை, சுருக்கமான பெயர்ப்பட்டியல் நடைக்கு ஏற்றவாறு மொழிபெயர்க்கிறது.
- source_word: דְּעוּאֵל
  choice: தெகுவேல்
  rationale: இவ்வசனத்தின் WLC/மசோரா உரையிலுள்ள דְּעוּאֵל என்ற பெயரின் ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது; வேறுபட்ட பெயர்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
