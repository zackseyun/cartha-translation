- source_word: לְ/גָד
  choice: காத் கோத்திரத்திலிருந்து
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புத் தலைவர்களின் பட்டியலில் לְ என்பது கோத்திரச் சார்பைக் குறிக்கிறது. தமிழில் பெயரை மட்டும் கூறும் ‘காத்திலிருந்து’ என்பதைக் காட்டிலும் ‘காத் கோத்திரத்திலிருந்து’ என்பது பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶלְיָסָף
  choice: எலியாசாப்
