base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: ta
  text: 'சிமியோனின் மக்களைப் பொறுத்தவரை, அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தையர் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி ஒவ்வொருவராகவும்[b] கணக்கிடப்பட்டவர்கள்[a]: இருபது வயதும் அதற்கு மேலும் உள்ள, போருக்குப் புறப்படுகிற எல்லா ஆண்களும்[c]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களில் படைக்காக அணிதிரட்டப்பட்டவர்கள்.” פקד என்ற எபிரெயச் சொல் இங்குக் கணக்கெடுப்பையும் படைக்கான அணிதிரட்டலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “அவர்களுடைய தலைகளின்படி”; இது ஒவ்வொருவரையும் தனித்தனியாகக் கணக்கிடுதலைக் குறிக்கும் இடியம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “படைச் சேவைக்குத் தகுதியுள்ள அனைவரும்.” எபிரெயத்தில் சொல்லுக்கு சொல், “போருக்குப் புறப்படுகிற அனைவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மக்களைப் பொறுத்தவரை
  rationale: בני என்பது இங்குத் தனிப்பட்ட உடனடிப் புதல்வர்களை அல்ல, சிமியோன் கோத்திரத்தைச் சேர்ந்த ஆண் வழித்தோன்றல்களைக் குறிக்கிறது; ‘மக்கள்’ இயல்பான தமிழில் அந்த உறவைத் தக்கவைக்கிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் வழிவந்த தலைமுறைப் பதிவுகளைக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה என்பது கோத்திரத்திற்குள் உள்ள உறவினக் குழுவைக் குறிக்கிறது; ‘குலம்’ இங்கு ‘குடும்பம்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: மூலத்தின் தந்தைவழி சமூக அமைப்பைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: פְּקֻדָיו
  choice: கணக்கிடப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்பு சார்ந்த பொருளை முதன்மைப்படுத்துகிறது; இச்சூழலில் படை அணிவகுப்பிற்காகப் பதிவுசெய்யப்பட்டவர்கள் என்ற நிழற்பொருளும் உள்ளது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர் எண்ணிக்கையின்படி
  rationale: தனிநபர்களைப் பெயர்வாரியாக எண்ணிய நிர்வாகச் சொற்றொடரின் அமைப்பைத் தக்கவைக்கிறது.
- source_word: לְגֻלְגְּלֹתָם
  choice: ஒவ்வொருவராக
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய தலைகளின்படி’; தமிழில் அதன் தனிநபர் கணக்கீட்டு இடியத்தை இயல்பாக வழங்குகிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரிலும்
  rationale: זכר பாலினத்தைச் சுட்டுகிறது; ‘ஆண்கள்’ இங்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: வயது வரம்பைத் தெளிவாகவும் தற்போதைய செந்தமிழ் நடையில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: போருக்குப் புறப்படுகிறவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் செயற்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; அது படைச் சேவைக்குத் தகுதியுடையவர்களைக் குறிக்கும் என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: כֹּל יֹצֵא צָבָא என்பதன் இராணுவத் தகுதி சார்ந்த பொருள்
  choice: போருக்குப் புறப்படுகிறவர்கள்
  alternative: படைச் சேவைக்குத் தகுதியுள்ளவர்கள்
  rationale: மூலத்தின் நேரடியான ‘படைக்கு/போருக்குப் புறப்படுகிற ஒவ்வொருவரும்’ என்ற மொழியைத் தக்கவைத்து, தகுதி என்ற விளக்கத்தை முதன்மை உரைக்குள் கட்டாயமாகச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் கண்ணியமான நிர்வாக-வம்சாவளி நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் வரும் எண்ணிக்கையை அறிமுகப்படுத்துவதால் முடிவில் நீள்கோடு வைக்கப்பட்டுள்ளது. மூலத்தின் ‘தலை/மண்டையோடு’ இடியம் தமிழில் செயற்கையாக இருப்பதால் ‘ஒவ்வொருவராக’ என இயல்பாக்கப்பட்டது.
