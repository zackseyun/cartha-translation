  to: 'சிமியோனின் மக்களைப் பொறுத்தவரை, அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தையர் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி ஒவ்வொருவராகவும்[b] கணக்கிடப்பட்டவர்கள்[a]: இருபது வயதும் அதற்கு மேலும் உள்ள, போருக்குப் புறப்படுகிற எல்லா ஆண்களும்[c]—'
