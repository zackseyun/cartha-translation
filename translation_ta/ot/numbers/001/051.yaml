source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: ta
  text: திருவாசஸ்தலம் புறப்படும்போது, லேவியர்கள் அதைப் பிரித்தெடுக்க வேண்டும்; திருவாசஸ்தலம் முகாமிடும்போது, லேவியர்கள் அதை அமைத்து நிறுத்த வேண்டும். அணுகுகிற அங்கீகாரமற்றவர்[a] கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியாள்’ அல்லது ‘அதிகாரமில்லாதவர்’; எபிரெயச் சொல் திருவாசஸ்தலத்தை அணுக அனுமதி இல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: புறப்பட வேண்டியபோது
  rationale: בְּ முன்னொட்டுடன் வரும் נסע வினையெச்சம் காலத்தைக் குறிக்கிறது. முகாமும் திருவாசஸ்தலமும் பயணத்திற்குப் புறப்படுவதை இந்தச் சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது கடவுள் தங்கியிருப்பதைக் குறிக்கும் எடுத்துச் செல்லக்கூடிய பரிசுத்த உறைவிடம். ‘திருவாசஸ்தலம்’ அதன் அடிப்படைப் பொருளையும் பரிசுத்தச் சூழலையும் காக்கிறது; சந்திப்புக் கூடாரத்தைக் குறிக்கும் வேறு எபிரெயச் சொல்லுடன் இதைக் கலக்கவில்லை.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: அதை பிரித்து இறக்க வேண்டும்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் பயணத்திற்காகத் திருவாசஸ்தலத்தைப் பிரித்து இறக்குவதைக் குறிக்கிறது. ‘பிரித்து இறக்க’ என்பது வெறுமனே கீழே இறக்குதல் அல்ல, கட்டமைப்பைக் கலைத்தல் என்பதையும் தெளிவாக்குகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இது லேவி கோத்திரத்தாருக்கான நிலையான தமிழ்ப் பெயர்; திருவாசஸ்தலப் பணிக்கு அதிகாரம் பெற்றவர்களை இங்கு குறிக்கிறது.
- source_word: וּבַחֲנֹת
  choice: முகாமிட வேண்டியபோது
  rationale: חנה என்பதற்கு ‘முகாமிடுதல்’ என்று பொருள். எபிரெய மூலத்தில் திருவாசஸ்தலமே இலக்கண எழுவாயாக இருப்பதால் அந்த உவமையாக்கம் தமிழிலும் தக்கவைக்கப்படுகிறது.
- source_word: יָקִימוּ אֹתוֹ
  choice: அதை எழுப்பி அமைக்க வேண்டும்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு திருவாசஸ்தலத்தை மீண்டும் எழுப்பி நிலைநிறுத்துவதைக் குறிக்கிறது.
- source_word: וְהַזָּר
  choice: அதிகாரம் இல்லாத ஒருவர்
  rationale: זָר என்பது இங்கே இன அடிப்படையிலான அந்நியரை அவசியம் குறிக்காமல், பரிசுத்தப் பணியை அணுக அதிகாரம் அளிக்கப்படாதவரைக் குறிக்கிறது.
- source_word: הַקָּרֵב
  choice: அருகில் வந்தால்
  rationale: קרב என்பதன் பங்கேற்பு வடிவம் பரிசுத்த இடத்தையோ பணியையோ அணுகுவதைக் குறிக்கிறது. மூலத்தில் அணுகப்படும் பொருள் வெளிப்படையாகச் சொல்லப்படாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: מות என்பதன் ஹொஃபால் வடிவம் வெறுமனே இறப்பதை அல்ல, மரணம் ஏற்படுத்தப்படுவதைச் சுட்டுகிறது. செய்பவர் யார் என்று மூலவாசகம் குறிப்பிடாததால் தமிழிலும் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יוּמָת குறிக்கும் தண்டனையின் இயல்பு
  choice: 'விதிக்கப்பட்ட மரணம்: ‘கொல்லப்பட வேண்டும்’'
  alternative: 'விளைவாக ஏற்படும் மரணம்: ‘இறந்துபோவார்’'
  rationale: ஹொஃபால் வடிவம் மரணம் அவர்மீது நிறைவேற்றப்படுவதைச் சுட்டுகிறது. இருப்பினும் அதை நிறைவேற்றும் முகவர் மனிதரா அல்லது இறைவனா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: זָר என்பதன் குறிப்பு
  choice: திருவாசஸ்தலப் பணியை அணுக அதிகாரம் இல்லாத ஒருவர்
  alternative: இன அடிப்படையில் அந்நியர்; அல்லது எந்த லேவியரல்லாதவரும்
  rationale: ஆசாரச் சூழலில் இச்சொல் அனுமதிக்கப்பட்ட பரிசுத்தப் பொறுப்புக்கு வெளியே இருப்பவரைக் குறிக்கிறது. மொழிபெயர்ப்பு இனத்தைக் குறிப்பதையும் தேவையற்ற அளவில் ஒரு குறிப்பிட்ட குழுவாகச் சுருக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புறப்படுதல்/முகாமிடுதல்’ என்ற இணை அமைப்பும், ‘பிரித்து இறக்குதல்/எழுப்பி அமைத்தல்’ என்ற எதிரிணையும் மூலவாசகத்தின் சமச்சீரை காக்கின்றன. ‘திருவாசஸ்தலம்’ என்பது מִשְׁכָּן என்பதற்குப் பயன்படுத்தப்பட்டு, சந்திப்புக் கூடாரம் என்ற தனிப்பெயரிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
