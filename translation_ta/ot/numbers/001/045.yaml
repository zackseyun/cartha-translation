- source_word: כָּל פְּקוּדֵי
  choice: கணக்கிடப்பட்ட ... அனைவரும்
  rationale: מפקד/פקד என்பதன் மக்கள் கணக்கெடுப்பு சார்ந்த செயப்பாட்டு-விளைவு பொருளைப் பாதுகாக்கிறது; தமிழ்ச் சொற்றொடரமைப்பில் כָּל என்பதன் முழுமை வசனத்தின் பின்னுள்ள ‘ஒவ்வொருவரும்’ என்பதோடும் வெளிப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரை நெருக்கமாகத் தருவதோடு, ஆண்களையும் இராணுவத் தகுதியையும் மையமாகக் கொண்ட இந்தக் கணக்கெடுப்பின் சூழலைப் பாதுகாக்கிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: பிதாமரபு அடிப்படையிலான சமூக/குல அமைப்பைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவர்கள்
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெய வழக்கைத் துல்லியமான நவீனத் தமிழில் தருகிறது.
- source_word: כָּל יֹצֵא צָבָא
  choice: போருக்குச் செல்லக்கூடிய ஒவ்வொருவரும்
  rationale: சொல்லர்த்தமான ‘படைக்குப்/போருக்குப் புறப்படுகிற ஒவ்வொருவரும்’ என்ற இராணுவச் சொல்லாடலை, தகுதி/திறன் சார்ந்த சூழற்பொருளுடன் இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இடம்/சமூகக் குழுவைக் குறிக்கும் நேரடியான பொருளை இயல்பாகப் பாதுகாக்கிறது.
