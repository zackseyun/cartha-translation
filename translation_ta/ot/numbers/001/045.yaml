  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: ta
  text: இவ்வாறு, இஸ்ரவேலின் மகன்களில்[a] தங்கள் தந்தைவழிக் குடும்பங்களின்படி கணக்கிடப்பட்ட அனைவரும், இருபது வயது முதல் அதற்கு மேற்பட்ட, இஸ்ரவேலில் போருக்குச் செல்லக்கூடிய ஒவ்வொருவருமாயிருந்தனர்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெய மூலத்தில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது. இந்தக் கணக்கெடுப்பு ஆண்களையும் இராணுவப் பணியையும் வெளிப்படையாக மையமாகக் கொண்டிருப்பதால், அந்தச் சொற்றொடர் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இராணுவச் சேவைக்குத் தகுதியான ஒவ்வொருவரும்.” சொல்லர்த்தமாக, “போருக்கு/படைக்குப் புறப்படுகிற ஒவ்வொருவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
