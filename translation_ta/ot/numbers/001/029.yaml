  text: those counted from the tribe of Issachar were fifty-four thousand four hundred[a].
translation:
  language: ta
  text: இசக்கார் கோத்திரத்தைச் சேர்ந்த எண்ணப்பட்டவர்கள் ஐம்பத்து நான்காயிரத்து நானூறு பேர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணிக்கை” அல்லது “பதிவு செய்யப்பட்டவர்கள்.” இங்கு வரும் எபிரேயக் கணக்கெடுப்புச் சொல், பட்டியலில் பதிவு செய்யப்பட்டு எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்ற வேரிலிருந்து வந்த இச்சொல், மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்டு எண்ணப்பட்டவர்களைக் குறிக்கிறது. ‘எண்ணப்பட்டவர்கள்’ என்பது அந்தக் கணக்கெடுப்புச் சூழலை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: இக்கணக்கெடுப்பு வாய்பாட்டில் לְ உடன் வரும் מַטֶּה, குறிப்பிட்ட கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. தமிழில் ‘கோத்திரத்தில்’ என்பது அந்தச் சார்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: எபிரெயப் பெயர் நவீனத் தமிழில் புரியத்தக்க, வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ஐம்பத்து நான்காயிரத்து நானூறு
  rationale: எபிரெய எண்ணின் சரியான மொத்த அளவைப் பேணிக்கொண்டு, இயல்பான நவீனத் தமிழ் எண் வரிசையில் மொழிபெயர்க்கப்பட்டுள்ளது.
