base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: ta
  text: இஸ்ரவேலில் போருக்குப் புறப்படும் இருபது வயது முதல் அதற்கு மேற்பட்ட ஒவ்வொரு ஆணையும்[a], நீயும் ஆரோனும் அவர்களுடைய படையணிகளின்படி[b] கணக்கெடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படையில் பணியாற்றத் தகுதியான ஒவ்வொரு ஆணையும்.’ ‘போருக்குப் புறப்படுதல்’ என்பது இராணுவப் பணிக்குத் தகுதியானவர்களைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய படைப்பிரிவுகளின்படி’ அல்லது ‘அவர்களுடைய இராணுவ அலகுகளின்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயது முதல் அதற்கு மேற்பட்டவர்களில்
  rationale: இராணுவப் பணிக்கான குறைந்தபட்ச வயது இருபது என்பதை எபிரேய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָּל יֹצֵא צָבָא
  choice: போருக்குப் புறப்படும் ஒவ்வொரு ஆணையும்
  rationale: இராணுவப் பணிக்குத் தகுதியானவரைக் குறிக்கும் எபிரேய இராணுவ மரபுத்தொடரின் காட்சிப்படிமத்தைப் பாதுகாக்கிறது. இந்த அதிகாரத்தின் சூழல் ஆண்களை வெளிப்படையாகக் குறிப்பிடுவதால் ‘ஆண்’ என்பது பொருத்தமானது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: தேசிய சமூகத்துக்குள் இருப்பதைக் குறிக்கும் மூலமொழியின் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: תִּפְקְדוּ אֹתָם
  choice: கணக்கெடுக்க வேண்டும்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது சேவைக்காகப் பதிவு செய்து கணக்கிடுவதைக் குறிக்கிறது; ‘கணக்கெடுக்க’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לְצִבְאֹתָם
  choice: அவரவர் படையணிகளின்படி
  rationale: இராணுவ அமைப்புகளின் அடிப்படையில் கணக்கெடுப்பதைத் தெளிவுபடுத்துகிறது; பன்மையையும் பகிர்ந்தளிக்கும் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַתָּה וְאַהֲרֹן
  choice: நீயும் ஆரோனும்
  rationale: கணக்கெடுக்கும் பொறுப்பு மோசேக்கும் ஆரோனுக்கும் அளிக்கப்படுவதை மூலத்தின் வலியுறுத்தலுடன் நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: இராணுவத் தகுதியைக் குறிக்கும் பாலின மொழி
  choice: போருக்குப் புறப்படும் ஒவ்வொரு ஆணையும்
  alternative: போருக்குப் புறப்படும் ஒவ்வொருவரையும்
  rationale: இந்த அதிகாரத்தின் கணக்கெடுப்பு இராணுவப் பணிக்குத் தகுதியான ஆண்களைப் பற்றியது. ஆகவே பாலினத்தைக் குறிப்பிடுவது விளக்கச் சேர்க்கை அல்ல; சூழலுக்கும் எபிரேய ஆண்பால் வடிவத்திற்கும் உண்மையானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘போருக்குப் புறப்படும்’ என்ற மூலமொழிப் படிமம் தக்கவைக்கப்பட்டு, அதன் இராணுவ மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
