  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a], யாவே மோசேக்குக் கட்டளையிட்ட அனைத்தின்படியும் செய்தார்கள்; அவ்வாறே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்”; “இஸ்ரவேலர்” அல்லது “இஸ்ரவேல் மக்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பது ‘செய்’ என்னும் பரந்த பொருளுடைய வினை; கீழ்ப்படிதலைச் சுருக்கமாகக் கூறும் இவ்விடத்தில் ‘செய்தார்கள்’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர். நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: கட்டளையிடப்பட்ட முழுவதற்கும் அவர்களுடைய செயல் ஒத்திருந்ததை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: மக்களின் செயலுக்கு முன்னதாக வழங்கப்பட்ட கட்டளையைக் குறிக்கிறது; தமிழில் பெயரெச்ச வடிவம் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர் வடிவில் தருகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: צוה என்பதுடன் மோசே கட்டளையைப் பெற்ற நபராக உள்ளார்; தமிழில் இதை நான்காம் வேற்றுமை உருபுடன் இயல்பாகக் கூற வேண்டும்.
- source_word: כֵּן עָשׂוּ
  choice: அவ்வாறே செய்தார்கள்
  rationale: முந்திய கட்டளைக்கும் மக்களின் செயலுக்கும் இருந்த துல்லிய ஒற்றுமையையும், எபிரெய மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தலையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இடம்பெறுவதால் அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை. ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு; ‘யாவே’ என்பதும் சாத்தியமான மறுகட்டமைக்கப்பட்ட உச்சரிப்பு.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் சொற்றொடர் உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேலின் மகன்கள்’ தமிழில் உயிரியல் ஆண் சந்ததியினரை மட்டும் குறிக்கக்கூடும் என்பதால், ‘இஸ்ரவேல் மக்கள்’ பொருளைத் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, வாசிக்க எளிய மரியாதைமிக்க நடை. மூலத்தின் ‘செய்தார்கள் … செய்தார்கள்’ என்ற வலியுறுத்தும் மறுபடியுரைத்தல் பாதுகாக்கப்பட்டுள்ளது.
