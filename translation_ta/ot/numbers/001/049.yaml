id: NUM.1.49
reference: Numbers 1:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: ta
  text: லேவி கோத்திரத்தை மட்டும் நீ கணக்கிடாதே; இஸ்ரவேலின் மகன்களோடு[a] சேர்த்து அவர்களுடைய எண்ணிக்கையை எடுக்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்களோடு” அல்லது “இஸ்ரவேலின் பிள்ளைகளோடு.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்களோடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: மட்டும்
  rationale: முந்தைய மக்கள்தொகைக் கணக்கெடுப்பு கட்டளையிலிருந்து லேவி கோத்திரத்தை விலக்கும் கட்டுப்படுத்தும் பொருளை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַטֵּה לֵוִי
  choice: லேவி கோத்திரம்
  rationale: மַטֶּה என்பதன் அடிப்படைப் பொருள் ‘கோல்’ என்றாலும், இத்தகைய மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் அது ‘கோத்திரம்’ என்பதைக் குறிக்கிறது.
- source_word: תִפְקֹד
  choice: கணக்கிடாதே
  rationale: פקד இங்கு மக்கள்தொகைக் கணக்கெடுப்பில் ஒருவரை எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது; நவீன தமிழில் ‘கணக்கிடு’ தெளிவான இணைச்சொல்.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: அவர்களுடைய எண்ணிக்கையை எடுக்காதே
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய தலையை உயர்த்தாதே’ என்ற அமைப்பு இங்கு மொத்த எண்ணிக்கையை எடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் அதன் சூழற்பொருள் தரப்பட்டுள்ளது.
- source_word: בְּתוֹךְ
  choice: உடன் சேர்த்து
  rationale: லேவியரை இஸ்ரவேலின் மற்ற மக்களோடு ஒரே கணக்கில் சேர்க்கக் கூடாது என்ற உட்சேர்க்கைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவத்தை வெளிப்படையாகக் காக்கிறது; அதேவேளை மாற்று வழக்கமான மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயரின் பாலின வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூல எபிரெயம் இலக்கண ரீதியாக ஆண்பால் பன்மையில் இருந்து முழு தேசத்திற்கான வழக்கமான பெயராகச் செயல்படுகிறது. அதன் வடிவத்தை முதன்மை உரையில் காத்து, அதன் விரிவான சமூகக் குறிப்பை மாற்று மொழிபெயர்ப்புகள் மூலம் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபர் தடை கட்டளையை நேரடியாகவும் கண்ணியமாகவும் வழங்குகிறது. மக்கள்தொகைக் கணக்கெடுப்பு சூழலைத் தெளிவுபடுத்த இயல்பான நிர்வாகச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; பழமையான ‘புத்திரர்’ தவிர்க்கப்பட்டுள்ளது.
