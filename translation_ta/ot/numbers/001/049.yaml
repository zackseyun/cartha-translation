  source_fidelity: 'மூல எபிரெயத்தின் விலக்குக் கட்டளை நன்றாகத் தரப்பட்டுள்ளது: லேவி கோத்திரம் கணக்கெடுப்பிலிருந்து விலக்கப்படுகிறது; அவர்களது எண்ணிக்கை இஸ்ரவேலின் மகன்களோடு சேர்த்து எடுக்கப்படக் கூடாது. רֹאשָׁם ... תִשָּׂא என்ற கணக்கெடுப்பு மரபுத்தொடரின் பொருளும் சரியாக வெளிப்படுத்தப்பட்டுள்ளது.'
  naturalness: உரை நவீன தரத் தமிழில் தெளிவாகவும் கட்டளை நடையில் இயல்பாகவும் உள்ளது. “இஸ்ரவேலின் மகன்களோடு சேர்த்து” என்பது בְּתוֹךְ என்பதன் இச்சூழலிலான உட்சேர்க்கைத் தடைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
