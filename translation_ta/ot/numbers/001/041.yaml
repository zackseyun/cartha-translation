  language: ta
  text: ஆசேர் கோத்திரத்தில் எண்ணப்பட்டவர்கள் நாற்பத்தோராயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்புச் சூழலிலான பொருளை இயல்பான தமிழில் தருகிறது; எபிரெய மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְמַטֵּה என்ற கணக்கெடுப்பு வாய்பாடு கோத்திரச் சார்பைக் குறிக்கிறது; ‘கோத்திரத்தில்’ என்பது நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: கோத்திரப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பத்தோராயிரத்து ஐந்நூறு
  rationale: எபிரெய எண்ணின் மதிப்பைத் துல்லியமாகக் காத்து, இயல்பான தமிழ் எண் அமைப்பில் வழங்குகிறது.
