  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ta
  text: 'யோசேப்பின் மக்களில் எப்பிராயீமின் மக்களுக்கு: அவர்களுடைய வம்சவரிசைகளின்படியும், குலங்களின்படியும், தந்தையர் வீடுகளின்படியும், பெயர்களின் எண்ணிக்கையின்படியும், இருபது வயதும் அதற்கு மேற்பட்டவர்களுமான, போருக்குப் புறப்படும் ஆண்கள் அனைவரும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைப்பணிக்குச் செல்லும் ஆண்கள் அனைவரும்.” எபிரெய மரபுத்தொடர் சொல்லுக்கு சொல் “போருக்குப் புறப்படுதல்” என்று கூறுகிறது.
    reason: כֹּל יֹצֵא צָבָא என்ற மரபுத்தொடரின் நேரடியான போர்-மொழியையும் சூழல்சார் இராணுவப் பணி பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף לִבְנֵי אֶפְרַיִם
  choice: யோசேப்பின் மக்களில், எப்பிராயீமின் வழிவந்தவர்கள்
  rationale: בנים என்பது இங்கு உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் கோத்திர வழிவந்தவர்களையும் குறிக்கிறது. ‘மக்களில்’ என்ற உறவுமுறையையும் ‘வழிவந்தவர்கள்’ என்ற இயல்பான census பொருளையும் இணைத்து, யோசேப்பின் கீழ் எப்பிராயீம் கோத்திரம் குறிப்பிடப்படுவதைத் தெளிவாக்குகிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசையின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் மரபுவழி அல்லது தலைமுறை வம்ச அமைப்பைக் குறிக்கிறது; எழுதப்பட்ட ஆவணங்கள் என்று தேவையின்றி பொருள் விரிக்கப்படவில்லை.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: மִשְׁפָּחָה இங்கு நவீன அணுக்குடும்பத்தைவிடப் பெரிய கோத்திர உட்பிரிவைக் குறிக்கிறது; ‘குலம்’ அதற்கு ஏற்ற இயல்பான தமிழ் சொல்.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தை மரபை அடிப்படையாகக் கொண்ட சமூகக் கணக்கீட்டு அலகைத் துல்லியமாகக் காட்டுகிறது; ‘தந்தையரின் வீடுகள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட நவீன தமிழில் தெளிவானது.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: பெயர்பெயராக
  rationale: ஒவ்வொருவரையும் பெயரடிப்படையில் தனித்தனியாக எண்ணியதைக் குறிக்கும் எபிரெய census மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவர்கள்
  rationale: இராணுவக் கணக்கெடுப்புக்கான வயது வரம்பை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: போருக்குப் புறப்படும் ஆண்கள் அனைவரும்
  rationale: எபிரெய இராணுவ மரபுத்தொடரின் ‘போருக்குப் புறப்படுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. சூழலில் கணக்கிடப்படுவோர் இராணுவ வயதுடைய ஆண்கள் என்பதால் பாலினக் குறிப்பு வெளிப்படையாகத் தரப்படுகிறது.
theological_decisions:
- issue: இராணுவக் கணக்கெடுப்பில் பாலினக் குறிப்பு
  choice: போருக்குப் புறப்படும் ஆண்கள் அனைவரும்
  alternative: போருக்குப் புறப்படும் அனைவரும்
  rationale: இந்த census சூத்திரம் இராணுவ வயதுடைய ஆண்களைக் குறிப்பதால், மூலத்தில் உள்ள பாலின வரம்பை பாலினநடுநிலையாக்காமல் பாதுகாக்கிறது.
- issue: כֹּל יֹצֵא צָבָא என்பதின் பொருள் வரம்பு
  choice: போருக்குப் புறப்படும்
  alternative: படைப்பணிக்குச் செல்லும்
  rationale: மூலத்தின் நேரடியான போர் மொழியை முதன்மை உரையில் பாதுகாத்து, நிர்வாகரீதியான ‘படைப்பணி’ பொருளை அடிக்குறிப்பில் வழங்குகிறது; இதனால் உண்மையான சொற்பொருள் அழுத்தமும் சூழல்சார் பொருளும் இரண்டும் நிலைக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் பொதுவாசகத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் வரும் எண்ணிக்கையை நோக்கிச் செல்லும் பட்டியல் அமைப்புடையதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. எபிரெயில் வெளிப்படையான வினை இல்லாவிட்டாலும், தமிழில் பட்டியலைப் புரிந்துகொள்ள ‘கணக்கிட்டார்கள்’ என்பது சூழலிலிருந்து அளவாக நிரப்பப்பட்டுள்ளது.
