  to: 'யோசேப்பின் மக்களில் எப்பிராயீமின் மக்களுக்கு: அவர்களுடைய வம்சவரிசைகளின்படியும், குலங்களின்படியும், தந்தையர் வீடுகளின்படியும், பெயர்களின் எண்ணிக்கையின்படியும், இருபது வயதும் அதற்கு மேற்பட்டவர்களுமான, போருக்குப் புறப்படும் ஆண்கள் அனைவரும்[a]:'
