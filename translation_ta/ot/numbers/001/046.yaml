base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/046.yaml
  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: ta
  text: ஆகவே, எண்ணப்பட்டவர்கள் அனைவரும் ஆறு இலட்சத்து மூவாயிரத்து ஐந்நூற்று ஐம்பது பேர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பதிவு செய்யப்பட்டவர்கள்’ அல்லது ‘படைக்காகக் கணக்கிடப்பட்டவர்கள்.’ எபிரெயச் சொல், கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ஆகவே, ... பேர்
  rationale: தொடர்ச்சியையும் கணக்கெடுப்பின் முடிவைச் சுருக்கிக் கூறும் விளைவுப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: எபிரெயச் சொல்லின் முழுமையைக் குறிக்கும் பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: הַפְּקֻדִים
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் இங்குள்ள செயல்பாட்டை, கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கும் வகையில் எளிய நவீன தமிழில் தருகிறது; இந்த வசனத்தில் இல்லாத ‘ஆண்கள்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ஆறு இலட்சத்து மூவாயிரத்து ஐந்நூற்று ஐம்பது
  rationale: 603,550 என்ற எண் மதிப்பைத் துல்லியமாகக் காத்து, தமிழில் இயல்பான எண்ணுருவாக வழங்குகிறது.
