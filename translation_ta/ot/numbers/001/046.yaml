translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. சூழல் படைத்தகுதியுள்ள ஆண்களின் கணக்கெடுப்பைக் குறித்தாலும், இந்த வசனத்தின் எபிரெய மூலத்தில் ‘ஆண்கள்’ என்று மீண்டும் வெளிப்படையாகச் சொல்லப்படாததால் அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் சூழற்பொருள் சுட்டப்பட்டுள்ளது.
