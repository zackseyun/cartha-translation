source:
  edition: WLC
  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ta
  text: 'செபுலோனின் மகன்களுக்காக: அவர்களுடைய வம்சவரிசைகளின்படியும், அவர்களுடைய குலங்களின்படியும், அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படி, இருபது வயதுமுதல் அதற்கு மேற்பட்ட, படைக்குச் செல்லத்தக்க ஆண்கள் அனைவரும்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: செபுலோனின் மகன்களில்
  rationale: לִבְנֵי என்பது கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. ‘மகன்களில்’ என்பது மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைத்து, இங்கு கோத்திரத்தைச் சேர்ந்த ஆண் வழித்தோன்றல்களைக் குறிக்கும் கணக்கெடுப்புச் சூழலுக்கும் பொருந்துகிறது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சங்களின்படி
  rationale: இந்தக் கணக்கெடுப்புச் சூழலில் இச்சொல் தலைமுறை வரிசை அல்லது மரபுவழிப் பிரிவைக் குறிக்கிறது; ‘வம்சங்கள்’ இயல்பான தமிழில் அந்தக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திரத்துக்குள் உள்ள விரிவான உறவுமுறைப் பிரிவுகளை ‘குலங்கள்’ தெளிவாகக் குறிக்கிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: மூலத்தின் ‘தந்தையரின் வீடு’ என்ற தொழில்நுட்ப உறவுமுறைச் சொல்லைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அதன் தந்தைவழி வம்சக் குடும்பப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: பெயர் பெயராக எண்ணப்பட்ட
  rationale: ஒவ்வொருவரும் பெயரால் பதிவு செய்யப்பட்ட தனிநபர் கணக்கெடுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்திலுள்ள ‘பெயர்களின் எண்ணிக்கை’ என்ற உருவகத்தையும் நெருக்கமாகப் பேணுகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவர்களில்
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைக்குச் செல்லத்தக்க ஆண்கள் அனைவரும்
  rationale: இது போருக்காகப் படையில் சேரத் தகுதியுள்ளவர்களைக் குறிக்கும் இராணுவக் கணக்கெடுப்பு மரபுத்தொடர். ‘செல்லத்தக்க’ என்பது தகுதியை உணர்த்துகிறது; சூழலில் கணக்கெடுக்கப்படுவோர் ஆண்கள் என்பதையும் வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: இராணுவக் கணக்கெடுப்பின் பாலின வரம்பு
  choice: படைக்குச் செல்லத்தக்க ஆண்கள் அனைவரும்
  alternative: படைக்குச் செல்லத்தக்க அனைவரும்
  rationale: כֹּל என்பதிலேயே தனியாக ‘ஆண்கள்’ என்று இல்லை என்றாலும், ‘இருபது வயதான மகன் முதல்’ என்ற எபிரெய ஆண்பால் வயது மரபுத்தொடரும், இப்பகுதியின் இராணுவக் கணக்கெடுப்புச் சூழலும் ஆண்களையே குறிப்பதாகக் காட்டுகின்றன. எனவே பாலினத்தை நடுநிலையாக்காமல் சூழலின் வரம்பு பாதுகாக்கப்படுகிறது.
- issue: יֹצֵא צָבָא என்ற இராணுவ மரபுத்தொடர்
  choice: படைக்குச் செல்லத்தக்க
  alternative: போருக்குப் புறப்படுகிற
  rationale: மரபுத்தொடர் சொற்சொல்லாக ‘படைக்குப் புறப்படுகிற’ என்று பொருள்படலாம்; இங்கு அது உண்மையில் அப்போது புறப்படுகிறவர்களைவிட இராணுவப் பணிக்குத் தகுதியுள்ளவர்களின் வகையைச் சுட்டுகிறது. முதன்மை உரை அந்தச் செயல்பாட்டுப் பொருளைத் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலின் நிர்வாகத் தன்மையும் மூலத்தின் தொடர் அமைப்பும் பேணப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் வரும் எண்ணிக்கைக்கான முன்னுரையாக இருப்பதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
