base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: ta
  text: ஆனால் லேவியர்கள், தங்கள் மூதாதையரின் கோத்திரத்தின்படி, அவர்களிடையே கணக்கிடப்படவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: ஆனால் லேவியர்கள்
  rationale: முந்தைய வசனங்களில் கணக்கிடப்பட்ட மற்ற கோத்திரங்களிலிருந்து லேவியர்களை வேறுபடுத்தும் சூழலால் וְ எதிர்மறைத் தொடர்பைக் காட்டும் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: தங்கள் மூதாதையரின் கோத்திரத்தின்படி
  rationale: מַטֶּה இங்கு ‘கோத்திரம்’ என்றும், אֲבֹתָם தந்தைவழி மூதாதையர் மரபைக் குறிக்கும் சொற்றொடராகவும் உள்ளது; தமிழில் பொருளும் வம்சத் தொடர்பும் தெளிவாக இருக்க இவ்வாறு தரப்பட்டது.
- source_word: לֹא הָתְפָּקְדוּ
  choice: கணக்கிடப்படவில்லை
  rationale: פקד என்பதன் ஹித்பயேல் வடிவம் இக்குடிக்கணக்குச் சூழலில் அதிகாரப்பூர்வ எண்ணிக்கையில் சேர்த்து எண்ணப்படுதலைக் குறிக்கிறது.
- source_word: בְּתוֹכָם
  choice: அவர்களோடு
  rationale: בְּתוֹךְ இங்கு முன்பு கணக்கிடப்பட்டவர்களின் தொகுதிக்குள் சேர்க்கப்படுவதைச் சுட்டுகிறது; ‘அவர்களோடு’ இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது.
