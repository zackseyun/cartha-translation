  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ta
  text: 'தாணின் மகன்கள்: அவர்களுடைய வம்சவரிசைகளின்படியும் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கைப்படி, இருபது வயதுமுதல் அதற்கு மேற்பட்ட, போருக்குப் புறப்படத்தக்க ஆண்கள் அனைவரும்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர்ப்பணி செய்யத் தகுதியுள்ள ஆண்கள் அனைவரும்.” எபிரெய வழக்குச் சொற்றொடர் சொல்லுக்குச் சொல், “போருக்குப் புறப்படுகிற அனைவரும்” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: தாணின் மகன்களில்
  rationale: לִבְנֵי என்பது இந்த மக்கள்தொகைக் கணக்கெடுப்பின் கோத்திரத் தலைப்பை அறிமுகப்படுத்துகிறது. சூழல் போர்ப்படைக்குத் தகுதியான ஆண்களைப் பற்றியது என்பதால், மூலத்தின் ஆண்பால் குறிப்பைத் தக்கவைத்து ‘மகன்களில்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படி
  rationale: இச்சூழலில் இச்சொல் வெறும் சந்ததியினரை அல்ல, மரபுவழிப் பிரிவுகளையும் வம்சப் பதிவையும் குறிக்கிறது; ‘வம்சவரிசைகள்’ அந்தக் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திர அமைப்பிலுள்ள உட்பிரிவைக் குறிக்க ‘குலம்’ பொருத்தமானது; அடுத்து வரும் தந்தைவழிக் குடும்பம் என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: இது இஸ்ரவேலரின் உறவுமுறை அமைப்பிலுள்ள தொழில்நுட்பச் சொற்றொடர். சொல்லுக்குச் சொல் மரபைச் சுமக்கும் ‘தந்தையரின் வீடுகள்’ என்பதைவிட, நவீனத் தமிழில் ‘தந்தைவழிக் குடும்பங்கள்’ தெளிவாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கைப்படி
  rationale: தனிநபர்கள் பெயர்வாரியாக எண்ணப்பட்டதைச் சுட்டும் எபிரெய வழக்கை, மிகையாக விளக்காமல் மூலத்துக்கு நெருக்கமாகத் தருகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: கணக்கெடுப்பிற்கான வயது வரம்பைத் தெரிவிக்கும் நிலையான சூத்திரத்தின் பொருளையும் முறையான நடையையும் காக்கிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைக்குச் செல்லத்தக்க ஆண்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘படைக்குப் புறப்படுகிற ஒவ்வொருவரும்’ எனும் பொருளுடையது; இக்கணக்கெடுப்பு சூழலில் போர்ப்பணி செய்யத் தகுதியுள்ள ஆண்களைக் குறிக்கிறது. ‘செல்லத்தக்க’ என்பது தகுதியைக் காட்டுகிறது; ‘ஆண்கள்’ சூழலில் தெளிவான ஆண்பால் குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: போர்ப்படைக் கணக்கெடுப்பிலுள்ள ஆண்பால் குறிப்பு
  choice: படைக்குச் செல்லத்தக்க ஆண்கள் அனைவரும்
  alternative: படைக்குச் செல்லத்தக்க அனைவரும்
  rationale: எபிரெயத்தில் தனியாக ‘ஆண்’ என்ற பெயர்ச்சொல் இல்லாவிட்டாலும், ‘தாணின் மகன்கள்’ என்ற தலைப்பும் ஆண்பால் வடிவங்களும் போர்ப்பணிக்குரிய ஆண்களையே சூழலில் குறிக்கின்றன. ஆகவே பாலினக் குறிப்பை நடுநிலையாக்காமல் வெளிப்படையாகத் தரப்பட்டது; எனினும் மூலத்தின் சொற்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, முறையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டது. கணக்கெடுப்பின் சூத்திரத் தொடர் மற்றும் இறுதியிலுள்ள தொடர்ச்சியைக் காட்டும் முக்காற்புள்ளி தக்கவைக்கப்பட்டன. அடிக்குறிப்பு குறி அது விளக்கும் போர்ப்படைச் சொற்றொடருக்குப் பின் வைக்கப்பட்டது.
