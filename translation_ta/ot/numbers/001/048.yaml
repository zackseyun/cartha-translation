  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர்நிலை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘பின்பு’ இயல்பான தமிழ் நிகழ்வோட்டத்தைத் தருகிறது, ‘பேசினார்’ דבר என்பதன் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்த வசனத்தில் வரும் உரையை எதிர்நோக்கி இரட்டைப்புள்ளி இடப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டமாகிய ‘கர்த்தர்’ என்பதற்குப் பதிலாக அந்தப் பெயரின் ஒலிபெயர்ப்பு வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட வேதாகம உரைநடை. எபிரெய உரையில் மோசேக்கு அடுத்ததாக எந்த அடிக்குறிப்பும் இல்லை; ஆங்கில அடிக்குறிப்பு உண்மையில் இறைப் பெயரை விளக்குவதால், அதன் தவறான இடத்தைப் பின்பற்றவில்லை. இறைப் பெயர் நேரடியாக வழங்கப்பட்டதால் இக்குறும் வசனத்தில் தனி அடிக்குறிப்பு சேர்க்கப்படவில்லை.
