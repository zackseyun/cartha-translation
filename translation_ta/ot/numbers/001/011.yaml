id: NUM.1.11
reference: Numbers 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ/בִ֨נְיָמִ֔ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/011.yaml
  text: 'For Benjamin: Abidan son of Gideoni.'
translation:
  language: ta
  text: 'பென்யமீனுக்காக: கிதெயோனியின் மகன் அபீதான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/בִנְיָמִן
  choice: பென்யமீனுக்காக
  rationale: முன்னொட்டு לְ இப்பட்டியலில் கோத்திரத்தின் சார்பான பிரதிநிதியை அறிமுகப்படுத்துகிறது. ‘பென்யமீனுக்காக’ என்பது எபிரெய உரையின் சுருக்கமான பட்டியல் அமைப்பைப் பேணும் இயல்பான தமிழ் வடிவம்; ‘பென்யமீன் கோத்திரத்துக்காக’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத ‘கோத்திரம்’ என்பதைச் சேர்க்கும் விரிவாக்கமாகும்.
- source_word: אֲבִידָן
  choice: அபீதான்
  rationale: எபிரெய தனிப்பெயர் தமிழில் அதன் ஒலிக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: בֶּן என்பது இங்கு தந்தை–மகன் உறவைக் குறிக்கிறது. பெயர்ப் பட்டியல் சூழலில் ‘மகன்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: גִּדְעֹנִי
  choice: கிதெயோனி
  rationale: இது தனிப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்பை அடிப்படையாகக் கொண்டு தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மூலத்தின் சுருக்கமான பட்டியல் நடையைப் பேணும் கண்ணியமான நடை. தனிப்பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
