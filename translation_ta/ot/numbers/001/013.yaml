translation:
  language: ta
  text: ஆசேர் கோத்திரத்திலிருந்து ஒக்ரானின் மகன் பகியேல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָשֵׁר
  choice: ஆசேர் கோத்திரத்திலிருந்து
  rationale: לְ முன்னொட்டு இங்கு மக்கள்தொகைக் கணக்கெடுப்புக்கான தலைவர்களின் பட்டியலில் கோத்திரச் சார்பைக் குறிக்கிறது. தமிழில் வெறும் ‘ஆசேரிலிருந்து’ என்பதைவிட ‘ஆசேர் கோத்திரத்திலிருந்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פַּגְעִיאֵל
  choice: பகியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச அடையாளத்தில் தந்தை-மகன் உறவைக் குறிக்கும் எபிரெயச் சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: עָכְרָן
  choice: ஒக்ரான்
  rationale: எபிரெய தனிப்பெயரை அதன் மரபான வேதாகம உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்; தொடக்க ע தமிழில் தனியே துல்லியமாகக் குறிக்க இயலாததால் ‘ஒ’ பயன்படுத்தப்படுகிறது.
