translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான பட்டியல் நடையைப் பயன்படுத்துகிறது. ஒருமை நபரான மோசேயை மட்டும் அல்லாமல் சூழலில் மோசே மற்றும் ஆரோன் இருவரையும் குறிக்கும் எபிரெய இரண்டாம் நபர் பன்மையை ‘உங்களோடு’ எனத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
