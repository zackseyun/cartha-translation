  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: ta
  text: 'உங்களோடு நிற்கவிருக்கும் ஆண்களின் பெயர்கள் இவையே: ரூபேன் கோத்திரத்தின் சார்பாக[a], செதேயூரின் மகன் எலிசூர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபேன் கோத்திரத்திலிருந்து.” எபிரெய முன்னொட்டு கோத்திரச் சார்பையோ கோத்திரத்தின் பிரதிநிதித்துவத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: பெயர்கள் இவையே
  rationale: எபிரெயப் பட்டியலை அறிமுகப்படுத்தும் சொற்றொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது. וְ இங்குப் பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனியாக ‘மேலும்’ சேர்க்காமல் வாக்கிய ஓட்டத்தால் அது வெளிப்படுகிறது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்களின்
  rationale: இங்கு எண்ணிக்கையிடும் பணியில் மோசேக்கும் ஆரோனுக்கும் துணையாக நியமிக்கப்படும் குறிப்பிட்ட ஆண் பிரதிநிதிகளைக் குறிக்கிறது; மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: உங்களோடு நிற்க வேண்டிய
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நிற்றல்’ என்பதையும், இச்சூழலில் உடன் நின்று பணியாற்றும் நியமன நுட்பத்தையும் தக்கவைக்கிறது. ‘வேண்டிய’ என்பது கட்டளையால் வரவிருக்கும் கடமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִרְאוּבֵן
  choice: ரூபேன் கோத்திரத்தின் சார்பாக
  rationale: לְ என்பது இங்கு ரூபேன் கோத்திரத்துடனான இணைப்பையோ அதன் பிரதிநிதித்துவத்தையோ குறிக்கலாம். முதன்மை உரையில் நிர்வாகச் சூழலுக்குப் பொருத்தமான பிரதிநிதித்துவப் பொருள் வழங்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלִיצוּר
  choice: எலிசூர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சத் தொடர்பைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்லை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שְׁדֵיאוּר
  choice: செதேயூர்
  rationale: எபிரெயத் தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
