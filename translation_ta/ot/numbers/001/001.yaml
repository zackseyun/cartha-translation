base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: ta
  text: 'இஸ்ரவேலர் எகிப்து நாட்டிலிருந்து வெளியேறியபின் இரண்டாம் ஆண்டின் இரண்டாம் மாதம் முதல் நாளில், சீனாய் வனாந்தரத்திலுள்ள சந்திப்புக் கூடாரத்தில்[a] யாவே மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சந்திப்பின் கூடாரம்”; மரபாக, “திருக்கூடாரம்.”
    reason: மூலச்சொல் அமைப்பையும் மரபு மொழிபெயர்ப்பையும் தெரிவிக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்ற வினை தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான கதைநடைச் சொல். அடுத்த வசனத்தில் உரையின் உள்ளடக்கம் தொடருவதால், தமிழில் இயல்பாகவும் மரியாதையாகவும் அமையும் ‘பேசினார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்தது.
- source_word: בְּמִדְבַּר סִינַי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனப்பகுதியைக் குறிக்கலாம்; எல்லா சூழலிலும் மணற்பாலை என்று பொருள்படாததால் ‘வனாந்தரம்’ பொருத்தமானது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதன் கூறுகளைத் தெளிவாக வெளிப்படுத்தும் வகையில், தேவன் தம் மக்களைச் சந்திக்கும் கூடாரத்தைக் குறிக்க ‘சந்திப்புக் கூடாரம்’ பயன்படுத்தப்பட்டது.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதம் முதல் நாளில்
  rationale: எபிரெய நாள்காட்டி வழக்கை நவீனத் தமிழில் தெளிவாகத் தரும் இயல்பான தேதி வடிவம்.
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם
  choice: இஸ்ரவேலர் புறப்பட்டு வந்த இரண்டாம் ஆண்டின்
  rationale: வெளியேறிய நிகழ்விலிருந்து கணக்கிடப்பட்ட இரண்டாம் ஆண்டைத் தமிழில் இயல்பாகக் காட்டுகிறது. எபிரெயத்தில் மறைமுகமாக உள்ள பன்மை எழுவாயைச் சூழலின் அடிப்படையில் ‘இஸ்ரவேலர்’ என்று வெளிப்படுத்தியது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்ற ‘நாடு/நிலம்’ கூறைத் தக்கவைத்து, தமிழில் இயல்பான இடப்பெயர் அமைப்பைப் பயன்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'பேசினார்:'
  rationale: எபிரெய உரை அறிமுகச் சூத்திரமான ‘சொல்லும்படியாக’ என்பதைக் சொற்சொல்லாக மீண்டும் கூறாமல், தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளியால் அதன் செயல்பாடு தமிழில் வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் காலக் குறிப்புகள் தமிழில் எளிதாகப் புரியும் வரிசையில் அமைக்கப்பட்டன. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘சீனாய்’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு אֹהֶל מוֹעֵד பற்றியது என்பதால் தமிழில் ‘சந்திப்புக் கூடாரம்’ என்பதற்குப் பின் சரியாக இடப்பட்டது.
