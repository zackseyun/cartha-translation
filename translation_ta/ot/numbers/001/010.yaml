  register: நவீனத் தரத் தமிழில், கணக்கெடுப்புப் பட்டியலின் சுருக்கமான இணை அமைப்பு பேணப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘கோத்திரம்’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
