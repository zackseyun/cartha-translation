source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: ta
  text: 'யோசேப்பின் மகன்களுக்கு: எப்பிராயீமுக்கு அம்மியூதின் மகன் எலிசாமா; மனாசேக்கு பெதாசூரின் மகன் கமாலியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: யோசேப்பின் மகன்களில்
  rationale: לְ இங்கு பட்டியலில் உரிய குழுவை அறிமுகப்படுத்துகிறது; בְנֵי என்பதன் நேர்ப்பொருள் ‘மகன்கள்’. தொடர்ந்து எப்பிராயீமும் மனாசேயும் தனித்தனியாகக் குறிப்பிடப்படுவதால், தமிழில் இயல்பான பட்டியல் அமைப்புக்காக ‘மகன்களில்’ என வழங்கப்பட்டது.
- source_word: לְאֶפְרַיִם
  choice: எப்பிராயீமுக்காக
  rationale: மீண்டும் வரும் לְ, யோசேப்பின் மகன்களுக்குள் குறிப்பிட்ட பிரிவுக்குரிய பிரதிநிதியைச் சுட்டுகிறது. ‘கோத்திரம்’ என்ற விளக்கச் சொல்லை மூலத்தில் இல்லாததால் சேர்க்கவில்லை.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பு; தமிழ்ப் பெயர்ப்பட்டியல் நடையில் ‘அம்மியூதின் மகன்’ என இயல்பாக வழங்கப்பட்டது.
- source_word: עַמִּיהוּד
  choice: அம்மியூது
  rationale: எபிரெயத் தனிப்பெயரின் எழுத்துப்பெயர்ப்பு; வேற்றுமை உருபுடன் ‘அம்மியூதின்’ என வருகிறது.
- source_word: לִמְנַשֶּׁה
  choice: மனாசேக்காக
  rationale: ‘எப்பிராயீமுக்காக’ என்பதற்கு இணையான பட்டியல் அமைப்பைப் பேணுகிறது; ‘மனாசே கோத்திரத்துக்காக’ என்பது சூழலை வெளிப்படையாக்கினாலும் மூலத்தைவிட விளக்கமானது.
- source_word: גַּמְלִיאֵל
  choice: கமாலியேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: פְּדָהצוּר
  choice: பெதாசூர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
