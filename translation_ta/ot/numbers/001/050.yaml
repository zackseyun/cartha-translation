  - severity: low
    issue: Footnote a lexical framing
    rationale: The existing note presents “திருக்கூடாரம்” as an alternative while the main text uses the less idiomatic term. Reversing these better aligns the main text with the contextual technical sense and preserves “உறைவிடம்” as the lexical alternative.
