source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: ta
  text: ஆனால் நீ லேவியர்களைச் சாட்சியின் திருக்கூடாரத்துக்கும்[a], அதன் எல்லாப் பொருட்களுக்கும், அதற்குரிய அனைத்துக்கும் பொறுப்பாளர்களாக நியமி. அவர்களே திருக்கூடாரத்தையும் அதன் எல்லாப் பொருட்களையும் சுமக்க வேண்டும்; அவர்கள் அதற்குப் பணிவிடை செய்ய வேண்டும்[b]; திருக்கூடாரத்தைச் சுற்றிலும் முகாமிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சியின் உறைவிடத்துக்கும்.” எபிரெயச் சொல் உறைவிடத்தையோ கூடாரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்குச் சேவை செய்ய வேண்டும்” அல்லது “அதைக் கவனித்துக்கொள்ள வேண்டும்.” இங்கு வரும் வினைச்சொல் பரிசுத்த இடம் சார்ந்த பணிவிடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: ஆனால் நீ
  rationale: முந்தைய வசனத்தில் லேவியர்கள் மற்ற கோத்திரத்தாரிடமிருந்து வேறுபடுத்தப்பட்டதுடன் இக்கட்டளை முரண்பாட்டுத் தொடர்பில் வருவதால், וְ என்பதன் சூழல்சார் எதிர்மறைத் தொடர்பை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: הַפְקֵד ... עַל
  choice: …பொறுப்பாளர்களாக நியமி
  rationale: פקד என்பதன் ஹிஃபில் கட்டளை வடிவமும் தொடர்ந்து வரும் עַל என்பதும், எண்ணுவதைக் குறிக்காமல் பொறுப்பை ஒப்படைத்து மேற்பார்வைக்கு நியமிப்பதைக் குறிக்கின்றன.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: சாட்சியின் திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பது தேவனுடைய பரிசுத்த உறைவிடமான எடுத்துச் செல்லக்கூடிய ஆலயத்தைக் குறிக்கிறது; הָעֵדֻת என்பதன் ‘சாட்சி’ என்ற கட்டமைப்பும் முறையாகப் பாதுகாக்கப்படுகிறது.
- source_word: כֵּלָיו
  choice: அதன் எல்லாப் பொருட்கள்
  rationale: கூடாரத்துடன் தொடர்புடைய பாத்திரங்கள், கருவிகள், பிற பயன்பாட்டுப் பொருட்கள் அனைத்தையும் உள்ளடக்கும் இயல்பான பரந்த சொற்றொடர்.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: அதற்குரிய அனைத்தும்
  rationale: திருவுறைவிடத்தைச் சார்ந்த அனைத்தையும் சுருக்கமாகவும் பரந்த பொருளுடனும் தெரிவிக்கிறது.
- source_word: יִשְׂאוּ
  choice: சுமக்க வேண்டும்
  rationale: பயணத்தின்போது திருவுறைவிடத்தையும் அதன் பொருட்களையும் உடலால் எடுத்துச் செல்வதையே נשא இங்கு குறிக்கிறது; அறிவுறுத்தல் சார்ந்த imperfect வடிவத்தின் கட்டளைத் தன்மையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: יְשָׁרְתֻהוּ
  choice: அதற்குப் பணிவிடை செய்ய வேண்டும்
  rationale: שרת என்பதன் பியேல் வடிவம் பரிசுத்த இடம் சார்ந்த சேவையை உணர்த்துகிறது; பொருள் சுட்டும் பின்னொட்டு ‘அதற்கு’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: திருவுறைவிடத்தைச் சுற்றிலும் முகாமிட வேண்டும்
  rationale: சரணாலயத்தைச் சூழ்ந்த நிலையில் முகாமிடும் கடமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הֵמָּה
  choice: அவர்களே
  rationale: தனித்து நிற்கும் வலியுறுத்தல் சுட்டுப்பெயரின் அழுத்தத்தை ‘-ஏ’ விகுதி பாதுகாக்கிறது.
theological_decisions:
- issue: מִשְׁכָּן என்ற வழிபாட்டுத் தலச் சொல்லின் மொழிபெயர்ப்பு
  choice: திருவுறைவிடம்
  alternative: திருக்கூடாரம்
  rationale: இச்சொல் எடுத்துச் செல்லக்கூடிய பரிசுத்த உறைவிடத்தைக் குறிக்கிறது. ‘திருவுறைவிடம்’ அதன் அடிப்படை உறைவிடப் பொருளையும் வழிபாட்டுச் சூழலையும் பாதுகாக்கிறது; ‘திருக்கூடாரம்’ வாசகருக்கு அறிமுகமான நியாயமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: שרת என்பதிலுள்ள பரிசுத்த சேவை நுணுக்கம்
  choice: பணிவிடை செய்ய வேண்டும்
  alternative: சேவை செய்ய வேண்டும் / கவனித்துக்கொள்ள வேண்டும்
  rationale: வழிபாட்டுத் தலம் சார்ந்த சேவையின் நுணுக்கத்தைத் தக்கவைத்தாலும், பின்னாளைய ஆசாரியக் கோட்பாடுகளை இவ்வசனத்துக்குள் சேர்க்காமல் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளையின் ஒருமை ‘நியமி’ என்றும், லேவியர்களுக்கான தொடர்கடமைகள் ‘வேண்டும்’ என்றும் தெளிவுபடுத்தப்பட்டுள்ளன. ‘திருவுறைவிடம்’ மூலச் சொல்லின் உறைவிட நுணுக்கத்தைப் பாதுகாக்கிறது; அறிமுகமான ‘திருக்கூடாரம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
