  text: לְ/דָ֕ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/012.yaml
  text: 'For Dan: Ahiezer son of Ammishaddai.'
translation:
  language: ta
  text: 'தாணுக்காக: அம்மிசதாயின் மகன் அகியேசேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/דָן
  choice: தாணுக்காக
  rationale: முன்னொட்டு לְ இங்கு ஒவ்வொரு கோத்திரத்திற்குரிய பிரதிநிதியை அறிமுகப்படுத்துகிறது. “தாணுக்காக” என்பது எபிரெய உரையின் சுருக்கமான பட்டியல் அமைப்பையும் பிரதிநிதித்துவப் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: אֲחִיעֶזֶר
  choice: அகியேசர்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; “அகியேசர்” என்பது மூல ஒலியமைப்பைத் தெளிவாக அணுகும் வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: בֶּן என்பது இவ்வடையாளச் சொற்றொடரில் நேரடியாக மகனுறவைக் குறிக்கிறது; தமிழில் உடைமை வேற்றுமையுடன் “அம்மிசதாயின் மகன்” என இயல்பாக அமைகிறது.
- source_word: עַמִּישַׁדָּי
  choice: அம்மிசதாய்
  rationale: இது மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்க வேண்டிய தனிப்பெயர்; “அம்மிசதாய்” எபிரெய உச்சரிப்பை அணுகுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் மூலத்தின் சுருக்கமான பட்டியல் நடையைப் பேணுகிறது. கோத்திரத்தின் பெயரை விளக்கி விரிவாக்காமல், எபிரெயிலுள்ள தொடர்புக் குறியை “தாணுக்காக” என வெளிப்படுத்துகிறது.
