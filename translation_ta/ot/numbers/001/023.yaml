lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்ற வேரின் இவ்விடத்திலுள்ள வடிவம் மக்கள்தொகைக் கணக்கில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்புக்கு மாறான உரிமைச்சுட்டைச் சேர்க்காமல், சூழலில் உள்ள பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: לְמַטֵּה שִׁמְעוֹן
  choice: சிமியோன் கோத்திரத்தில்
  rationale: לְמַטֵּה என்ற கணக்கெடுப்பு வாய்பாடு கோத்திரச் சார்பைக் காட்டுகிறது; நவீன தமிழில் “கோத்திரத்தில்” என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: எபிரெயப் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 59,300 பேர்
  rationale: எபிரெய எண்ணின் சரியான மொத்தத்தை நவீன தமிழில் வாசிக்க எளிதான எண் வடிவில் தருகிறது; “பேர்” மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் குறிக்கிறது.
