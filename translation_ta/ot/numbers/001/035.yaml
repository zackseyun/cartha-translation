  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: ta
  text: மனாசே கோத்திரத்தில் எண்ணப்பட்டவர்கள் முப்பத்திரண்டாயிரத்து இருநூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் இச்சூழலிலுள்ள செயல்பாட்டு வடிவம் மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது. முந்தைய வசனங்களின் சூழலில் தகுதியுள்ள ஆண்கள் என்பது தெளிவாக இருப்பதால், எபிரேயத்தில் இல்லாத ‘ஆண்கள்’ என்பதை இவ்வசனத்தில் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְמַטֵּה என்ற தொடரமைப்பு எண்ணப்பட்டவர்களின் கோத்திரச் சார்பைச் சுட்டுகிறது; நவீனத் தமிழில் ‘கோத்திரத்தில்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: வேதாகமத் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: முப்பத்திரண்டாயிரத்து இருநூறு பேர்
  rationale: எபிரேய எண்ணின் மதிப்பைத் துல்லியமாகப் பேணிக்கொண்டு, தமிழின் இயல்பான எண்ணமைப்பில் வழங்குகிறது; ‘பேர்’ மனிதர்களைக் கணக்கிடும் இயல்பான சொல்லாகச் சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள்தொகைக் கணக்கெடுப்பின் மீளும் சூத்திரத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் வழங்கும் நடை. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
