  text: לְ/יִ֨שָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/008.yaml
  text: 'For Issachar: Nethanel son of Zuar.'
translation:
  language: ta
  text: 'இசக்கார் கோத்திரத்துக்காக: சூவாரின் மகன் நெதனெயேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: இசக்கார் கோத்திரத்துக்காக
  rationale: முன்னொட்டான לְ இந்தப் பட்டியலில் கோத்திரத்தின் சார்பான பிரதிநிதியை அறிமுகப்படுத்துகிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘கோத்திரத்துக்காக’ என்று வழங்கப்பட்டுள்ளது; ‘இசக்கார்’ ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: இது ஆட்பெயர்; அதன் சொற்பொருளை மொழிபெயர்க்காமல், தமிழில் வழக்கமான வேதாகம ஒலிவடிவில் தரப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: இங்குள்ள வம்ச அடையாளத்தில் நேரடியான தந்தை–மகன் உறவையே குறிக்கிறது; விரிவான ‘வழிவந்தவர்’ என்ற பொருள் சூழலால் தேவைப்படவில்லை.
- source_word: צוּעָר
  choice: சூவார்
  rationale: இது ஆட்பெயர்; எபிரெய உச்சரிப்பை அணுகும் இயல்பான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
