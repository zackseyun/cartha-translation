  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: ta
  text: ஆனால் லேவியர்கள் சாட்சித் திருக்கூடாரத்தைச் சுற்றிலும் பாளையமிறங்க வேண்டும். அப்போது இஸ்ரவேல் மக்களின் சபையின்மேல் கடுங்கோபம் உண்டாகாது[a]. லேவியர்கள் சாட்சித் திருக்கூடாரத்தைக் காவல் காக்கும் பொறுப்பை நிறைவேற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களின் சபைக்கு எதிராகக் கடுங்கோபம் உண்டாகாது.”
    reason: עַל என்ற முன்னிடைச்சொல் இங்கு ‘மேல்’ என்றும் ‘எதிராக’ என்றும் பொருள்படக்கூடியதால் மாற்று மொழிபெயர்ப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: ஆனால் லேவியர்கள்
  rationale: וְ என்ற இணைப்புச் சொல் முந்தைய கோத்திரங்களின் பாளைய ஏற்பாட்டிலிருந்து லேவியர்களுக்கான வேறுபட்ட கட்டளைக்கு மாறுவதைக் காட்டுவதால், சூழலின் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: יַחֲנוּ סָבִיב
  choice: சுற்றிலும் பாளையமிறங்க வேண்டும்
  rationale: இங்கு imperfect வடிவம் ஏற்பாட்டுக்குரிய கட்டளையைக் குறிக்கிறது. ‘வேண்டும்’ அதன் கடமைத் தன்மையையும், ‘சுற்றிலும்’ அதன் இடவியல் பொருளையும் தெளிவாகக் காக்கின்றன.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: சாட்சித் திருக்கூடாரம்
  rationale: מִשְׁכָּן என்பது வழிபாட்டுச் சூழலில் திருக்கூடாரத்தைக் குறிக்கிறது; הָעֵדֻת என்பதன் ‘சாட்சி’ என்ற சொல்லை விளக்கமாக விரிவுபடுத்தாமல் சேர்த்து, எபிரெயச் சொற்றொடரின் இறையியல் அடர்த்தி பாதுகாக்கப்பட்டது.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: அப்போது ... கடுங்கோபம் உண்டாகாது
  rationale: קֶצֶף என்பது சாதாரண எரிச்சலைவிடத் தீர்ப்புசார் கடுங்கோபத்தைக் குறிக்கிறது. எபிரெயத்தில் கோபத்தின் உரியவர் வெளிப்படையாகச் சொல்லப்படாததால், தமிழிலும் அவரைச் சேர்க்காமல் விடப்பட்டது.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபையின்மேல்
  rationale: עֵדָה என்பதற்கு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் ‘சபை’ பயன்படுத்தப்பட்டது. בְּנֵי יִשְׂרָאֵל என்ற நிலையான இனக்குழுப் பெயர் நவீன தமிழில் இயல்பாக ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டது; עַל என்பதன் அடிப்படைத் தொடர்பு ‘மேல்’ மூலம் காக்கப்பட்டது.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: காவல் காக்கும் பொறுப்பை நிறைவேற்ற வேண்டும்
  rationale: שׁמר மற்றும் מִשְׁמֶרֶת இணைந்து வெறும் கடமையைக் காட்டாமல், ஒப்படைக்கப்பட்ட காவல் பொறுப்பையும் குறிக்கின்றன. தமிழில் அந்த இரு கூறுகளையும் இயல்பாக வெளிப்படுத்த இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: קֶצֶף என்பதன் தன்மை மற்றும் அதன் உரியவர்
  choice: ‘கடுங்கோபம்’ என மொழிபெயர்த்து, அது யாருடையது என்பதை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை
  alternative: ‘இறைவனின் கோபம்’ அல்லது ‘தண்டனை’
  rationale: எண்ணாகமத்தின் பரிசுத்த இடச் சூழல் இதை இறைத் தீர்ப்பின் கோபமாகப் புரிந்துகொள்ள வலுவாக வழிகாட்டுகிறது. எனினும் இவ்வசனம் உரியவரை நேரடியாகக் குறிப்பிடாததால், மொழிபெயர்ப்பு அந்த உட்குறிப்பை விளக்கமாகச் சேர்க்காமல் உண்மையான மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் புதல்வர்கள்
  rationale: இது எபிரெயத்தில் இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனக்குழுச் சொற்றொடர். சொல் வடிவத்தை இயந்திரமாகப் பின்பற்றும் ‘புதல்வர்கள்’ என்பதைக் காட்டிலும் ‘மக்கள்’ நவீனத் தமிழில் சமூகமுழுவதையும் இயல்பாகவும் பொருள்துல்லியமாகவும் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘சாட்சித் திருக்கூடாரம்’ இருமுறையும் ஒரேபடி வழங்கப்பட்டு, வழிபாட்டுச் சொற்பயன்பாட்டின் ஒற்றுமை காக்கப்பட்டுள்ளது.
