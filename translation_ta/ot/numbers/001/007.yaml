  text: for Judah, Nahshon son of Amminadab;
translation:
  language: ta
  text: யூதா கோத்திரத்திற்காக, அம்மினதாபின் மகன் நகசோன்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִיהוּדָה
  choice: யூதா கோத்திரத்திற்காக
  rationale: முன்னொட்டு לְ இப்பட்டியலில் கோத்திரத்துடனான தொடர்பையும் அதன் சார்பாக நிற்பதையும் குறிக்கிறது. தமிழில் பெயரை மட்டும் வைத்து ‘யூதாவுக்காக’ என்பது ஒருவரைக் குறிக்கிறதா கோத்திரத்தைக் குறிக்கிறதா என்ற குழப்பத்தை ஏற்படுத்தலாம்; ஆகவே சூழலில் உள்ள மறைபொருளைத் தெளிவாக்க ‘கோத்திரத்திற்காக’ என வழங்கப்பட்டது.
- source_word: נַחְשׁוֹן
  choice: நகசோன்
  rationale: எபிரேயப் பெயரின் மெய்யொலிகளை (נ־ח־ש־ן) நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தனிப்பெயரைத் தொடரும் இக்கட்டமைப்பு இங்கு நேரடியான தந்தை–மகன் உறவைக் குறிக்கிறது; இயல்பான தமிழில் உடைமை வேற்றுமையுடன் ‘அம்மினதாபின் மகன்’ என வழங்கப்பட்டது.
- source_word: עַמִּינָדָב
  choice: அம்மினதாப்
  rationale: எபிரேயப் பெயரான עַמִּינָדָב என்பதன் ஒலியமைப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபு சேரும்போது ‘அம்மினதாபின்’ என வருகிறது.
