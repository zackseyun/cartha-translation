translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. இது தொடரும் பட்டியலின் ஒரு கூறு என்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கோத்திரம்’ என்பது לִיהוּדָה என்பதன் பட்டியல்-சூழல் பொருளைத் தமிழில் தெளிவாக்குகிறது.
