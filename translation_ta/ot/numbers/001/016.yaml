  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: ta
  text: சபையின் அழைக்கப்பட்டவர்கள்[a] இவர்களே. இவர்கள் தங்கள் தந்தைவழிக் கோத்திரங்களின் தலைவர்களும், இஸ்ரவேலின் ஆயிரங்களின் தலைவர்களும்[b] ஆவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சபையால் அழைக்கப்பட்டவர்கள்,” “சபைக்கென அழைக்கப்பட்டவர்கள்,” அல்லது “சபையின் நியமிக்கப்பட்டவர்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெயப் பங்கேற்புச் சொல் அழைக்கப்பட்ட, கூட்டப்பட்ட, அல்லது நியமிக்கப்பட்டவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் ஆயிரங்கள்” என்பது சொற்சொல்லான மொழிபெயர்ப்பு. இது ஆயிரம் பேர் கொண்ட குழுக்களையோ, இன்னும் விரிவாகக் குல அல்லது படைப் பிரிவுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה ... הֵם
  choice: இவர்களே ... ஆவர்
  rationale: தொடக்கச் சுட்டுப்பெயரையும் இறுதியில் வலியுறுத்தும் தனிப்பெயரையும் தமிழில் அடையாளப்படுத்தும் இயல்பான வாக்கிய அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: קריאי הָעֵדָה
  choice: சபையிலிருந்து அழைக்கப்பட்டவர்கள்
  rationale: קרא என்பதன் செயல்பாட்டுவினை வடிவிலுள்ள ‘அழைக்கப்பட்டவர்கள்’ என்ற பொருளைப் பேணுகிறது; அவர்கள் சபையிலிருந்து அழைக்கப்பட்டவர்கள் என்ற சூழல்சார் தொடர்பையும் இயல்பான தமிழில் தருகிறது. ‘கூட்டப்பட்டவர்கள்’ அல்லது ‘நியமிக்கப்பட்டவர்கள்’ என்ற சாத்தியங்களை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: נְשִׂיאֵי
  choice: தலைவர்கள்
  rationale: கோத்திர நிர்வாகச் சூழலில் உயர்நிலைப் பொறுப்பாளர்களைக் குறிக்கும் சொல்லை, அரசகுலப் பொருளைத் தேவையின்றி புகுத்தாமல் நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் கோத்திரங்கள்
  rationale: מַטּוֹת என்பதன் கோத்திரப் பொருளையும் אֲבוֹתָם என்பதிலுள்ள தந்தைவழி அல்லது மூதாதையர் தொடர்பையும் சுருக்கமாகப் பேணுகிறது.
- source_word: רָאשֵׁי
  choice: தலைவர்கள்
  rationale: ‘தலைகள்’ என்ற எபிரெய உருவகத்தின் பதவி சார்ந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆயிரக்குழுக்கள்
  rationale: אֶלֶף என்பதிலுள்ள ‘ஆயிரம்’ என்ற வடிவத்தைப் பேணிக்கொண்டே, இங்கு மக்கள் அல்லது படைப் பிரிவுகள் குறிக்கப்படலாம் என்பதை ‘குழுக்கள்’ மூலம் வாசிக்கத்தக்கவாறு காட்டுகிறது; அதன் துல்லியமான அமைப்பை அடிக்குறிப்பு திறந்தே வைக்கிறது.
