base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/015.yaml
  text: 'For Naphtali: Ahira son of Enan.'
translation:
  language: ta
  text: 'நப்தலி கோத்திரத்துக்கு: ஏனானின் மகன் அகீரா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְנַפְתָּלִי
  choice: நப்தலி கோத்திரத்துக்கு
  rationale: முன்னொட்டு לְ இப்பட்டியலில் ஒரு கோத்திரத்துக்கான பிரதிநிதியைச் சுட்டுகிறது. தமிழில் பெயரை மட்டும் வைத்து ‘நப்தலிக்கு’ என்பதைக் காட்டிலும் ‘நப்தலி கோத்திரத்துக்கு’ என்பது பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֲחִירַע
  choice: அகீரா
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: பெயர்ப்பட்டியலில் வரும் வழக்கமான வம்ச உறவுச் சொல்லாகச் சுருக்கமாக மொழிபெயர்க்கப்பட்டது; தமிழ் சொல்லமைப்பின்படி தந்தையின் பெயர் உரிமை வேற்றுமையில் முன்வைக்கப்படுகிறது.
- source_word: עֵינָן
  choice: ஏனான்
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது; கட்டமைப்பில் ‘ஏனானின்’ என உருமாறுகிறது.
