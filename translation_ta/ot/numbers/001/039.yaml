  yaml_path: translation/ot/numbers/001/039.yaml
  text: Those counted from the tribe of Dan were sixty-two thousand seven hundred.
translation:
  language: ta
  text: தாண் கோத்திரத்தில் எண்ணப்பட்டவர்கள் அறுபத்திரண்டாயிரத்து எழுநூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்புச் சூழலிலான பொருளை இயல்பாகத் தருகிறது; ‘ஆண்கள்’ என்பதை இவ்வசனத்தில் வெளிப்படையாகச் சேர்க்காமல், முந்தைய சூழல் வரையறுக்கும் மக்களைக் குறிக்கிறது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְמַטֵּה דָן என்ற கணக்கெடுப்பு வாய்பாட்டில் கோத்திரச் சார்பைக் குறிக்கிறது; தமிழில் ‘தாண் கோத்திரத்தில்’ என்பது இயல்பான வடிவம்.
- source_word: דָן
  choice: தாண்
  rationale: எபிரெயப் பெயரின் நீள உயிரொலியை நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: அறுபத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணின் வரிசையைச் சொற்சொல்லாகப் பின்பற்றாமல், நவீனத் தமிழின் இயல்பான எண் அமைப்பில் தருகிறது.
- source_word: וּשְׁבַע מֵאוֹת
  choice: எழுநூறு
  rationale: எண்ணின் மீதிப் பகுதியை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
