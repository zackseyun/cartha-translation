revisions:
- from: இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவனும் தன் முகாமிலும், ஒவ்வொருவனும் தன் கொடியருகிலும், தங்கள் படைப்பிரிவுகளின்படி முகாமிட வேண்டும்.
  to: இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவனும் தன் முகாமுக்கு அருகேவும், ஒவ்வொருவனும் தன் கொடிக்கு அருகேவும், தங்கள் படைப்பிரிவுகளின்படி முகாமிட வேண்டும்.
  rationale: மூலத்தின் ஆணைத் தன்மை, பகிர்ந்தளிக்கும் இரட்டிப்பு, மற்றும் படைப்பிரிவு ஒழுங்கு ஆகியவை பேணப்பட்டுள்ளன. עַל மַחֲנֵהוּ மற்றும் עַל דִּגְלוֹ ஆகிய இணையான சொற்றொடர்களுக்கு ஒரே மாதிரியான தமிழ்ச் சொல்லமைப்பு பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘அருகில்’ என்ற இடவியல் நுணுக்கம் முற்றிலும் தவிர்க்க இயலாதபோதும், ‘அருகே’ இரு இடங்களிலும் ஒரேபோல் பயன்படுத்தப்பட்டு ஒத்திசைவு காக்கப்பட்டுள்ளது.
