source:
  edition: WLC
  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவனும் தன் முகாமுக்கு அருகேவும், ஒவ்வொருவனும் தன் கொடிக்கு அருகேவும், தங்கள் படைப்பிரிவுகளின்படி முகாமிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.”
    reason: בְּנֵי יִשְׂרָאֵל என்பதற்கான இயல்பான தமிழாக்க மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: וְחָנוּ
  choice: முகாமிட வேண்டும்
  rationale: சட்ட/அறிவுறுத்தல் சூழலில் இந்த வினை எதிர்காலத்தைக் குறிப்பதோடு கட்டளையையும் உணர்த்துகிறது. ‘முகாமிட வேண்டும்’ என்பது அந்த விதிப்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தை நேரடியாகப் பேணுகிறது; ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ ... וְאִישׁ
  choice: ஒவ்வொருவனும் ... ஒவ்வொருவனும்
  rationale: மூலத்தில் இருமுறை வரும் ஆண்பால் ஒருமைச் சொல்லையும், ஒவ்வொருவருக்குமான தனித்தனி இடஒதுக்கீட்டு வலியுறுத்தலையும் பேணுகிறது.
- source_word: עַל מַחֲנֵהוּ
  choice: தன் முகாமிலும்
  rationale: இங்கு עַל துல்லியமான மேற்பரப்பு நிலையைக் காட்டாமல், ஒருவன் தனக்கு உரிய முகாமுடன் கொண்ட இட/ஒழுங்கு உறவைக் குறிக்கிறது. தமிழில் ‘தன் முகாமிலும்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: דִּגְלוֹ
  choice: தன் கொடியருகிலும்
  rationale: דֶּגֶל என்பது குலம் அல்லது படைப்பிரிவை அடையாளப்படுத்தும் கொடி/தரக்குறியைக் குறிக்கிறது. ‘கொடி’ எளிதில் புரியும் நவீன சொல்; ‘அருகிலும்’ என்பது அதன் பக்கத்தில் அணிவகுத்திருக்கும் இடப்பொருளைத் தெளிவாக்குகிறது.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படைப்பிரிவுகளின்படி
  rationale: צָבָא இங்கு போர்செயலைவிட ஒழுங்குபடுத்தப்பட்ட குழுக்கள் அல்லது அணிகளைக் குறிக்கிறது. ‘படைப்பிரிவுகள்’ இராணுவ ஒழுங்கின் நுணுக்கத்தைப் பேணுகிறது; உடனடி போரைக் குறிப்பிடுவதில்லை.
