base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின்[a] முழுச் சமூகத்தையும் கணக்கெடுங்கள்[b]—அவர்களுடைய குலங்களின்படியும், தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படியும், ஒவ்வோர் ஆணையும் தலைவாரியாக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘இஸ்ரவேலின் மகன்கள்’; அதாவது, இஸ்ரவேல் மக்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘தலையை உயர்த்துங்கள்’; இச்சூழலில், கணக்கெடுக்க அல்லது பதிவுசெய்ய வேண்டும் என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘அவர்களுடைய மண்டையோடுகளின்படி’ அல்லது ‘தலைகளின்படி’; ஒவ்வொரு நபரையும் தனித்தனியாக எண்ணுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: கணக்கெடுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘தலையை உயர்த்துங்கள்’ என்றாலும், இந்நிர்வாகச் சூழலில் மக்களைப் பதிவுசெய்து எண்ணும் அதிகாரப்பூர்வக் கணக்கெடுப்பைக் குறிக்கிறது. நவீன தமிழில் ‘கணக்கெடுங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל עֲדַת
  choice: முழுச் சமூகம்
  rationale: עֵדָה என்பது இங்கு இஸ்ரவேலின் ஒட்டுமொத்தக் கூட்டுச் சமூகத்தைக் குறிக்கிறது. ‘முழுச் சமூகம்’ என்பது வெறும் நிகழ்ச்சிக் கூட்டம் என்ற எண்ணத்தைத் தவிர்த்து, மக்களின் ஒருங்கிணைந்த சமூகத்தைக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ எனினும், அது இங்கு இஸ்ரவேல் இனத்தாரைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பானது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரங்களுக்குள் உள்ள உறவுவழிப் பிரிவுகளைக் குறிக்கிறது. நவீன ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ அந்தப் பெரிய உறவுக் குழுவைத் துல்லியமாகக் காட்டுகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: இந்தச் சொற்றொடர் தந்தை வழி வம்சத்தை அடிப்படையாகக் கொண்ட குடும்ப அல்லது மூதாதையர் இல்லப் பிரிவுகளைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கையின்படி
  rationale: பெயர்ப் பதிவின் அடிப்படையில் எண்ணுதல் என்ற நிர்வாக மொழிநடையை எபிரெயம் தக்கவைக்கிறது. அதை எளிய ‘பெயர்ப் பட்டியலின்படி’ என்று முழுமையாகப் பொருளாக்காமல், மூலத்தின் வடிவத்தை இத்தேர்வு பாதுகாக்கிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் ஒவ்வொருவரையும்
  rationale: זָכָר இங்கு பாலினத்தைக் குறிப்பாகச் சுட்டுகிறது. ‘ஆண்கள் ஒவ்வொருவரையும்’ என்பது அனைத்துத் தனிநபர்களையும் உள்ளடக்கும் வலிமையையும் இயல்பான தமிழ் நடையையும் தருகிறது.
- source_word: לְגֻלְגְּלֹתָם
  choice: தலைவாரியாக
  rationale: சொல்லர்த்தமாக ‘அவர்களுடைய மண்டையோடுகளின்படி/தலைகளின்படி’ என்பது ஒவ்வொரு நபரையும் தனித்தனியாக எண்ணும் மரபுத்தொடர். ‘தலைவாரியாக’ அந்த உடற்கூறு படிமத்தையும் தனிநபர் கணக்கையும் சுருக்கமாகப் பாதுகாக்கிறது.
