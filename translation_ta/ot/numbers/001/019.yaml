  source_fidelity: மூல எபிரெயத்தின் ஒப்புமை அமைப்பு (כַּאֲשֶׁר), யாவே மோசேக்கு அளித்த கட்டளை, மற்றும் וַיִּפְקְדֵם என்பதன் கணக்கெடுப்பு/பதிவுசெய்தல் சார்ந்த பொருள் அனைத்தும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. வெளிப்படையாகச் சொல்லப்படாத எழுவாயான மோசேவைத் தமிழில் மீண்டும் குறிப்பிடுவது சூழலுக்கேற்பத் தெளிவானது.
  naturalness: ‘யாவே மோசேக்குக் கட்டளையிட்டபடியே, மோசே அவர்களைச் சீனாய் வனாந்தரத்தில் கணக்கெடுத்தார்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. ‘வனாந்தரம்’ சற்றே வேதாகமப் பதிவுடைய சொல் என்றாலும் இச்சூழலில் தெளிவாகவும் பொருத்தமாகவும் உள்ளது.
  terminology: ‘யாவே,’ ‘மோசே,’ ‘சீனாய்,’ மற்றும் ‘கணக்கெடுத்தார்’ ஆகியவை நிறுவப்பட்ட மற்றும் பொருத்தமான தெரிவுகள். அடிக்குறிப்பு פקד வினைச்சொல்லின் பதிவு/எண்ணிக்கை சார்ந்த மாற்றுப் பொருள்களைத் தகுந்தவாறு பாதுகாக்கிறது; [a] அடையாளம் சரியாக இணைக்கப்பட்டுள்ளது.
