  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַֽ/יִּפְקְדֵ֖/ם בְּ/מִדְבַּ֥ר סִינָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, மோசே அவர்களைச் சீனாய் வனாந்தரத்தில் கணக்கெடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைப் பதிவுசெய்தார்” அல்லது “அவர்களை எண்ணினார்.” எபிரெய வினைச்சொல் ஆட்களைப் பதிவுசெய்வதையோ மக்கள் தொகைக் கணக்கெடுப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: இச்சொல் முந்தைய தெய்வீகக் கட்டளைக்கு இணங்கவே செயல் நடந்ததைச் சுட்டுகிறது; ‘படியே’ என்பது அந்த ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: ‘கட்டளையிடுதல்’ என்ற நேரடிப் பொருளை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருளைக் குறித்தாலும், ‘கட்டளையிடு’ என்ற தமிழ் வினை இயல்பாக ‘மோசேக்கு’ என்ற நான்காம் வேற்றுமை வடிவத்தைக் கோருகிறது.
- source_word: וַיִּפְקְדֵם
  choice: அவர்களைக் கணக்கெடுத்தார்
  rationale: இந்த மக்கள் தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது ஆட்களை எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது; ‘கணக்கெடுத்தார்’ என்பது இரு கூறுகளையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: בְּמִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: மக்கள் குடியேறாத வறண்ட நிலப்பரப்பைக் குறிக்கும் מִדְבָּר என்பதையும், சீனாயுடனான எபிரெயச் சேர்க்கை உறவையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, நான்கெழுத்து இறைப் பெயரையே பயன்படுத்துவதால், தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיִּפְקְדֵם என்பதன் சூழல்சார் பொருள்
  choice: அவர்களைக் கணக்கெடுத்தார்
  alternative: அவர்களை அணிவகுத்துப் பதிவுசெய்தார்; அவர்களை எண்ணினார்
  rationale: எண்ணாகமம் 1-ன் சூழல் வெறும் எண்ணுதலைவிடப் பெயர்ப் பதிவு மற்றும் படை அணிக்கான கணக்கெடுப்பையும் உள்ளடக்கலாம்; ‘கணக்கெடுத்தார்’ அந்தப் பொருள் பரப்பை மிகையாகக் குறுக்காமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மோசே’ மீண்டும் குறிப்பிடப்படுவது தமிழ் வாக்கியத்தில் செய்பவர் யார் என்பதைத் தெளிவாக்குகிறது; எபிரெய வினை வடிவில் எழுவாய் மறைமுகமாக உள்ளது.
