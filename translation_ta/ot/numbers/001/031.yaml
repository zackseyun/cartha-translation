  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கணக்கெடுப்பு நடையைப் பயன்படுத்தியது. ‘பேர்’ சேர்க்கப்பட்டதால் எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பது தமிழில் இயல்பாகத் தெளிவாகிறது.
