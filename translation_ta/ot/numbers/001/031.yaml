  yaml_path: translation/ot/numbers/001/031.yaml
  text: Those registered from the tribe of Zebulun were 57,400.
translation:
  language: ta
  text: செபுலோன் கோத்திரத்தில் பதிவுசெய்யப்பட்டவர்கள் 57,400 பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: பதிவுசெய்யப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்புச் சூழலிலுள்ள பொருள், எண்ணப்பட்ட அல்லது பட்டியலில் சேர்க்கப்பட்டவர்களைக் குறிக்கிறது. இராணுவப் பொருளைத் தேவையின்றி மிகைப்படுத்தாமல், நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: இந்தத் தொடர்ச்சியான கணக்கெடுப்பு வாய்பாட்டில் לְ உடன் வரும் מַטֶּה, குறிப்பிட்ட கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. தமிழில் ‘கோத்திரத்தில்’ என்பது அந்தச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: எபிரெய tribal பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவம்.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400
  rationale: எபிரெய எண்ணின் துல்லியமான மொத்தத்தை நவீன வாசிப்புக்கு ஏற்ற எண் வடிவில் தெளிவாகத் தருகிறது.
