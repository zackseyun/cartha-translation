  text: Their counted men from the tribe of Reuben were forty-six thousand five hundred.
translation:
  language: ta
  text: ரூபேன் கோத்திரத்தைச் சேர்ந்த எண்ணப்பட்டவர்கள் நாற்பத்தாறாயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதிலிருந்து வந்த இச்சொல், மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது. சூழலில் தகுதியுள்ள ஆண்கள் ஏற்கெனவே வரையறுக்கப்பட்டிருப்பதால், இயல்பான தமிழில் ‘எண்ணப்பட்டவர்கள்’ என வழங்கப்பட்டது.
- source_word: לְמַטֵּה
  choice: கோத்திரத்தில்
  rationale: לְ உடன் வரும் מַטֶּה இங்கு கோத்திரச் சேர்ந்தியைக் குறிக்கிறது. மீண்டும் வரும் கணக்கெடுப்புச் சூத்திரத்திற்கு ‘கோத்திரத்தில்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: רְאוּבֵן
  choice: ரூபேன்
  rationale: எபிரெயப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பத்தாறாயிரத்து ஐந்நூறு
  rationale: எபிரெய எண்ணின் சரியான மொத்தமான 46,500-ஐ நவீன தமிழின் இயல்பான எண்ணமைப்பில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமச் சூழலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை. ‘பேர்’ என்பது எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
