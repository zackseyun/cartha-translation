translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலின் முறையான தொடர் அமைப்பு காக்கப்பட்டுள்ளது. ‘குலம்’, ‘தந்தைவழிக் குடும்பம்’, ‘படைப்பணி’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையிலும் பண்டைய இஸ்ரவேலின் உறவுமுறை மற்றும் இராணுவச் சூழலைச் சுருக்கிவிடாத வகையிலும் தேர்ந்தெடுக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் வரும் எண்ணிக்கையை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
