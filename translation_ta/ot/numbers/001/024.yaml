language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: ta
  text: 'காதின் மகன்களுக்கு[a], அவர்களுடைய வம்சவரிசைகளின்படியும், குலங்களின்படியும்[b], தந்தைவழிக் குடும்பங்களின்படியும், பெயர்களின் எண்ணிக்கையின்படியும், இருபது வயதும் அதற்கு மேற்பட்டவர்களில், படைப்பணிக்குச் செல்லும் ஒவ்வொருவரும்[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “காதின் மகன்கள்.” இந்தச் சொற்றொடர் கணக்கெடுப்பில் எண்ணப்பட்ட காத் கோத்திரத்தின் ஆண் உறுப்பினர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது “அவர்களுடைய குடும்பங்களின்படி.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “போருக்குப் புறப்படும் ஒவ்வொருவரும்”; அல்லது “படைப்பணிக்குச் செல்லும் ஒவ்வொருவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: காதின் மகன்களில்
  rationale: லְ முன்னொட்டு இங்கு கணக்கெடுக்கப்படும் கோத்திரத்தாரை அறிமுகப்படுத்துகிறது. ‘மகன்கள்’ என்ற எபிரேய மரபுத்தொடரைத் தக்கவைத்தபடி, தமிழில் பட்டியல் தொடருக்கு இயல்பாக ‘மகன்களில்’ என வழங்கப்பட்டுள்ளது.
- source_word: תּוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: இச்சூழலில் இது பிறப்புவழி அல்லது வம்சவரிசைப் பிரிவைக் குறிக்கிறது; எழுதப்பட்ட வம்சாவளிப் பதிவுகள் என்று அளவுக்கு மீறி விளக்காமல் மூலத்தின் கணக்கெடுப்பு வாய்பாட்டைத் தக்கவைக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு ஒரு கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவைக் குறிக்கிறது. நவீன அணுக்குடும்பம் என்ற எண்ணத்தைத் தவிர்க்க ‘குலங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய தந்தையரின் வீடுகள்’ எனினும், இது தந்தைவழி மூதாதையரால் அடையாளப்படுத்தப்படும் குடும்ப அலகைக் குறிக்கும் தொழில்நுட்ப உறவுமுறைச் சொற்றொடர். தமிழில் தெளிவுக்காக ‘தந்தைவழிக் குடும்பங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்களின் எண்ணிக்கையின்படி கணக்கிடப்பட்ட
  rationale: ஒவ்வொருவரும் பெயரால் பட்டியலிடப்பட்டு எண்ணப்பட்டதை இச்சொற்றொடர் குறிக்கிறது. தமிழ் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘கணக்கிடப்பட்ட’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவர்களில்
  rationale: எபிரேய ஒருமை மரபுத்தொடரான ‘இருபது ஆண்டின் மகன்’ என்பதை இயல்பான நவீன தமிழில் வயது வரம்பாகத் தெளிவாக வழங்குகிறது.
- source_word: כֹּל יֹצֵא צָבָא
  choice: படைப்பணிக்குச் செல்லும் ஒவ்வொருவரும்
  rationale: יֹצֵא צָבָא என்பதில் போருக்குப் புறப்படுதல் அல்லது இராணுவப் பணிக்குச் செல்லுதல் என்ற இரு நுணுக்கங்களும் உள்ளன. தகுதியை மட்டும் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் செயப்பாட்டு வடிவையும் பரந்த இராணுவப் பொருளையும் தக்கவைக்கிறது.
