source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: ta
  text: ஆகவே அவர்கள் அவனையும் அவனுடைய மகன்களையும் அவனுடைய மக்கள் அனைவரையும் தாக்கி வீழ்த்தினார்கள்[a]. அவனுக்கு உயிர்தப்பியவர் ஒருவரும் எஞ்சாதபடி செய்தார்கள்; அவனுடைய நாட்டையும் கைப்பற்றிக்கொண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோற்கடித்தார்கள்.” இப்போர்ச் சூழலில் இச்சொல் கொல்லப்பட்டதையும் உட்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய நாட்டைத் தங்கள் உடைமையாக்கிக்கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்குதல் அல்லது தோற்கடித்தலைக் குறிக்கிறது; தொடர்ந்து வரும் முற்றழிவுக் கூற்று உயிரிழப்பையும் உணர்த்துகிறது. ‘தாக்கி வீழ்த்தினார்கள்’ என்பது அந்த வலிமையைத் தேவையின்றி மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பாசானின் அரசன் ஓகைக் குறிக்கும் நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: ஆண்பால் பன்மையான בנים இங்கு ‘மகன்கள்’ என்று நேரடியாகப் பொருள்படுகிறது.
- source_word: כָּל עַמּוֹ
  choice: அவனுடைய மக்கள் அனைவரும்
  rationale: עַם பொதுவாக ‘மக்கள்’ என்று பொருள்படும்; இங்கு படைவீரர்களுக்கு மட்டும் வரையறுக்காமல் அவனுடைய ஆட்சிக்குட்பட்ட மக்களைக் குறிக்கும் விரிவைத் தக்கவைக்கிறது.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: அவனுக்கு உயிர்தப்பியவர் ஒருவரும் எஞ்சாதபடி செய்தார்கள்
  rationale: ‘அவனுக்கு எஞ்சியவர் ஒருவரையும் விட்டுவைக்காதவரை’ என்ற எபிரெயக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செய்பவர் இலக்கணத்தில் வெளிப்படையாகக் கூறப்படாத நிலையையும் சூழலிலுள்ள பன்மை எழுவாயோடு இயல்பாக இணைக்கிறது.
- source_word: שָׂרִיד
  choice: உயிர்தப்பியவர்
  rationale: போர்ச் சூழலில் ‘மீதியானவர்’ என்பதைவிட உயிருடன் தப்பியவரைத் தெளிவாகக் குறிக்கிறது; தேவையற்ற இறையியல் தொழில்நுட்பப் பொருளையும் தவிர்க்கிறது.
- source_word: וַיִּירְשׁוּ
  choice: கைப்பற்றிக்கொண்டார்கள்
  rationale: ירשׁ என்பது உரிமையாக்குதல், உடைமையாக்குதல் அல்லது கைப்பற்றுதல் எனப் பொருள்படலாம். வெற்றிக்குப் பின் நிலப்பகுதியைப் பெற்றுக்கொண்ட இந்தச் சூழலில் ‘கைப்பற்றிக்கொண்டார்கள்’ இயல்பும் துல்லியமும் உடையது.
- source_word: אַרְצוֹ
  choice: அவனுடைய நாடு
  rationale: אֶרֶץ இங்கு ஓகின் ஆட்சிக்குட்பட்ட நிலப்பகுதியைக் குறிக்கிறது; ‘நாடு’ சாதாரண வாசகருக்கு இயல்பான பரந்த சொல்.
