translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. போரின் கடுமையும் முற்றழிவுக் கூற்றும் மென்மைப்படுத்தப்படாமல், அதேவேளை மூலத்தைவிட வெளிப்படையாக மிகைப்படுத்தப்படாமலும் வைக்கப்பட்டுள்ளன.
