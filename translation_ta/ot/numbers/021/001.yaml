translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நெகேப்’, ‘ஆராத்’, ‘அத்தாரீம்’, ‘இஸ்ரவேல்’ ஆகியவை வேதாகமப் புவியியல் மற்றும் பெயரியல் தன்மையைப் பாதுகாக்கும் ஒலிபெயர்ப்புகள். மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
