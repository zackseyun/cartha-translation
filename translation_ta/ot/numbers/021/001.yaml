source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: ta
  text: நெகேபில் குடியிருந்த ஆராதின் கானானிய அரசன், இஸ்ரவேல் அத்தாரீம் வழியாக வருவதாகக் கேள்விப்பட்டபோது, அவன் இஸ்ரவேலுக்கு எதிராகப் போரிட்டு, அவர்களில் சிலரைச் சிறைப்பிடித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அத்தாரீம்” என்பது எபிரெயத்தில் உள்ள சொல்லின் ஒலிபெயர்ப்பு. இதன் பொருள் உறுதியில்லை; சிலர் இதை ஓர் இடப்பெயராகவும், வேறு சிலர் பழங்கால மொழிபெயர்ப்புகளின் அடிப்படையில் “வேவுகாரர்கள்” அல்லது “உளவாளிகள்” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: கதைச் சூழலில் செய்தியை அறிந்துகொள்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்; அடுத்த நிகழ்வுக்கான காரணத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: ஆராதின் கானானிய அரசன்
  rationale: இன அடையாளத்தையும் ஆராதுடன் உள்ள அரசியல்-புவியியல் தொடர்பையும் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: நெகேபில் குடியிருந்த
  rationale: பங்கேற்பு வினைச்சொல்லின் தொடர்ச்சியான வசிப்பிடப் பொருளை அளிக்கிறது; נגב என்பதை பொதுவான ‘தெற்கு’ என மாற்றாமல் பிரதேசப் பெயராக வைத்துள்ளது.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: இஸ்ரவேல் ... வருவதாக
  rationale: அரசன் கேட்ட செய்தியை மறைமுகக் கூற்றாக இயல்பான தமிழில் தருகிறது; இஸ்ரவேலின் அணுகிவருதலைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: அத்தாரீம் வழியாக
  rationale: தெளிவற்ற אֲתָרִים என்பதை ஊகித்து விளக்காமல் பெயர்போல ஒலிபெயர்த்து, דֶּרֶךְ என்பதற்கு இயல்பான ‘வழியாக’ என்பதைப் பயன்படுத்துகிறது.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டு
  rationale: பகைமையான போர் ஈடுபாட்டை நேரடியாகக் கூறுகிறது; மோதலின் அளவை ‘தாக்கினான்’ போன்ற சொல்லால் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: அவர்களில் சிலரைச் சிறைப்பிடித்தான்
  rationale: கூட்டுப் பெயரான இஸ்ரவேலிலிருந்து சிலரைப் போர்க் கைதிகளாகப் பிடித்த பகுதியளவுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
