source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: ta
  text: “உங்கள் நாட்டின் வழியாக நான் கடந்து செல்ல அனுமதியுங்கள். வயலுக்குள்ளோ திராட்சைத்தோட்டத்துக்குள்ளோ நாங்கள் விலகிச் செல்லமாட்டோம்; கிணற்று நீரையும் குடிக்கமாட்டோம். உங்கள் எல்லையைக் கடந்து செல்லும்வரை அரசரின் சாலையிலேயே[a] செல்வோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “அரசரின் பெருவழியிலேயே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: நான் கடந்து செல்ல அனுமதியுங்கள்
  rationale: முதல் நபர் ஒருமை cohortative வடிவம் இங்குள்ள அரசரிடம் முன்வைக்கப்படும் பணிவான வேண்டுகோளை வெளிப்படுத்துகிறது.
- source_word: בְאַרְצְךָ
  choice: உங்கள் நாட்டின் வழியாக
  rationale: אֶרֶץ என்பது இங்கு அரசியல்-புவியியல் பொருளில் அந்த அரசரின் நாடு அல்லது நிலப்பரப்பைக் குறிக்கிறது; தமிழில் பயணச் சூழலுக்கு இவ்வடிவம் இயல்பானது.
- source_word: לֹא נִטֶּה
  choice: நாங்கள் விலகிச் செல்லமாட்டோம்
  rationale: נטה பயணப் பாதையிலிருந்து வேறு பக்கம் திரும்புவதைக் குறிக்கிறது; ‘விலகிச் செல்லமாட்டோம்’ இயக்கக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: வயலுக்குள்ளோ திராட்சைத்தோட்டத்துக்குள்ளோ
  rationale: இரு பெயர்களும் பொதுவகையில் பயிரிடப்பட்ட நிலங்களைக் குறிக்கின்றன; ‘-உள்ளோ’ அமைப்பு எதனுள்ளும் நுழையமாட்டோம் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: கிணற்று நீரையும் குடிக்கமாட்டோம்
  rationale: ‘கிணற்றின் நீர்’ என்ற சொற்பொருளைச் சுருக்கமான, இயல்பான நவீனத் தமிழில் தருகிறது; உள்ளூர் நீர்வளத்தைப் பயன்படுத்தமாட்டோம் என்பதும் தெளிவாகிறது.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: அரசரின் சாலையிலேயே
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அரசரின் வழி/சாலை’; ‘-இலேயே’ என்பது அந்தப் பிரதான பாதையை மட்டும் பயன்படுத்துவோம் என்ற வலியுறுத்தலைத் தருகிறது.
- source_word: נֵלֵךְ
  choice: செல்வோம்
  rationale: הלך என்பதன் பொதுவான பயணப் பொருளை எளிமையாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: கடந்து செல்லும்வரை
  rationale: பயணத்தின் எல்லை நிறைவடையும் வரையிலான காலத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: גְּבֻלֶךָ
  choice: உங்கள் எல்லை
  rationale: גְּבוּל அடிப்படையில் எல்லை அல்லது வரம்பைக் குறிக்கிறது. இங்கு ‘எல்லையைக் கடந்து செல்லுதல்’ என்பது நாட்டின் மறுபுற எல்லையைத் தாண்டுவதைக் குறிக்கும் இயல்பான தமிழ்; ‘நிலப்பரப்பு’ என்ற விரிவான பொருளையும் சூழல் உணர்த்துகிறது.
