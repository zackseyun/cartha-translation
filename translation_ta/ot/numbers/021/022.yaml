translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் வைக்கப்படும் கண்ணியமான பயண வேண்டுகோளாக மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமையில் வரும் தொடக்க வேண்டுகோளும் பின்னர் வரும் பன்மை உறுதிமொழிகளும் மூலத்தின் நபர் மாற்றத்துக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
