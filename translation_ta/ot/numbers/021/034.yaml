  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “அவனைப் பார்த்துப் பயப்படாதே; ஏனெனில், அவனையும் அவனுடைய மக்கள் அனைவரையும் அவனுடைய நாட்டையும் உன் கையில் ஒப்புக்கொடுத்திருக்கிறேன்.[a] எஸ்போனில் வாழ்ந்த எமோரியரின் அரசன் சீகோனுக்கு நீ செய்ததுபோலவே அவனுக்கும் செய்வாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் கையில் ஒப்புக்கொடுத்திருக்கிறேன்” என்பது “உன் அதிகாரத்திற்குள் ஒப்புக்கொடுத்திருக்கிறேன்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள இறைபெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் தருகிறது.
- source_word: אַל תִּירָא אֹתוֹ
  choice: அவனுக்குப் பயப்படாதே
  rationale: ירא என்பதன் நேரடியான தடைப்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְיָדְךָ נָתַתִּי
  choice: உன் கையில் ஒப்புக்கொடுத்துவிட்டேன்
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, נָתַתִּי என்னும் நிறைவேறிய/உறுதிப்படுத்தப்பட்ட செயற்பாட்டை ‘ஒப்புக்கொடுத்துவிட்டேன்’ எனத் தெரிவிக்கிறது.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: அவனையும் அவனுடைய மக்கள் அனைவரையும் அவனுடைய நாட்டையும்
  rationale: ஓகு, அவன் மக்கள், அவன் நாடு ஆகிய மூன்று நேர்செயப்படுபொருள்களையும் மூல வரிசையில் பாதுகாக்கிறது.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: அவனுக்கும் செய்வாய்
  rationale: முன்னிருந்த தெய்வீக உறுதியின் தொடர்ச்சியாக வரும் செயலை எதிர்கால உறுதியாக இயல்பாகத் தருகிறது; அடுத்த ஒப்பீட்டுடன் நேரடியாக இணைகிறது.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியர்களின் அரசன் சீகோனுக்கு
  rationale: பெயரையும் அரசப் பட்டத்தையும் தெளிவான தமிழ் தொடரமைப்பில் தருகிறது.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: எஸ்போனில் வாழ்ந்த
  rationale: ישב என்ற குடியிருத்தல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; விவரிக்கப்படும் சீகோன் ஏற்கெனவே தோற்கடிக்கப்பட்டவன் என்பதால் இறந்தகாலம் பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டத்தைப் பயன்படுத்தாமல் பெயராகவே தரப்பட்டது. ‘யெகோவா’ தமிழில் பரவலாக அறியப்படும் வடிவம்; ‘யாவே’ மூல உச்சரிப்பை அணுகும் மாற்று வடிவம்.
- issue: נָתַתִּי என்னும் நிறைவேற்றப்பட்ட வினையின் வலிமை
  choice: ஒப்புக்கொடுத்துவிட்டேன்
  alternative: ஒப்புக்கொடுப்பேன்
  rationale: போர் இன்னும் நடைபெறாத நிலையிலும் எபிரெய நிறைவுவினை முடிவின் உறுதியை நிறைவேறியதாக முன்வைக்கிறது; அதை எதிர்கால வாக்காக மட்டும் மெலிதாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய ‘கை’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இடப்பெயர் மற்றும் நபர்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘எஸ்போன்’, ‘சீகோன்’ வடிவங்களில் தரப்பட்டுள்ளன.
