translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தின் கதைத் தொடர்ச்சியும் அடுத்த வசனத்துக்கு வழிவகுக்கும் நேர்கூற்று அறிமுகமும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கிலத்தில் குறிப்பிடப்பட்ட construct மாற்று தமிழில் தனி அடிக்குறிப்பு தேவைப்படவில்லை; ‘எமோரியர்களின் ராஜா’ என்பது இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
