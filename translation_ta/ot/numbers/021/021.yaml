  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: ta
  text: 'பின்பு இஸ்ரவேல், எமோரியரின் அரசனான சீகோனிடம் தூதர்களை அனுப்பி, இவ்வாறு கூறியது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி
  rationale: வாவ் தொடர்வினை கதை நகர்வை முன்னெடுக்கிறது. தமிழில் இயல்பான தொடர்ச்சியைப் பின்பு என்பதும், அடுத்த வசனத்தின் நேர்கூற்றுடன் இணைப்பதை அனுப்பி என்பதும் வெளிப்படுத்துகின்றன.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: இங்கு மக்களினத்தைக் குறிக்கும் மரபான தமிழ் வடிவம்.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இந்த அரசியல் தொடர்புச் சூழலில் மனிதச் செய்தியாளர்கள் அல்லது பிரதிநிதிகளைக் குறிக்கிறது; விண்ணுலகத் தூதர்களை அல்ல.
- source_word: אֶל
  choice: '...ிடம்'
  rationale: ஒருவரை நோக்கி அனுப்புதலைத் தமிழில் இயல்பாகக் குறிக்கும் வேற்றுமை வடிவம்.
- source_word: סִיחֹן
  choice: சீகோன்
  rationale: எபிரெய தனிப்பெயரின் மரபான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியர்களின் ராஜாவான
  rationale: எபிரெய இணைப்புத் தொடரை, சீகோன் எமோரிய மக்களின் ராஜா என்ற பொருளில் இயல்பான தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொன்னது
  rationale: அடுத்த வசனத்தில் வரும் நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது; இஸ்ரவேல் இங்கு ஒருமை மக்களினப் பெயராக இருப்பதால் ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
