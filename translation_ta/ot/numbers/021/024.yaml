base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: ta
  text: இஸ்ரவேல் அவனை வாளின் முனையால் தாக்கி, அவனுடைய நிலத்தை அர்னோன் முதல் யாப்போக்கு வரை, அம்மோனியர் வரை[a] கைப்பற்றியது; ஏனெனில் அம்மோனியரின் எல்லை வலுவாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அம்மோனின் மகன்கள்”; அதாவது அம்மோனியர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: அவனை ... தாக்கி
  rationale: נכה என்பதன் நேரடியான ‘தாக்கு’ என்ற பொருளைப் பாதுகாக்கிறது; அவன் கொல்லப்பட்டான் என்று மூலத்தில் இருப்பதைவிட அதிகமாகக் குறிப்பிடுவதில்லை.
- source_word: לְפִי חָרֶב
  choice: வாளின் முனையால்
  rationale: ‘வாளின் வாய்/முனை’ என்ற எபிரேய உருவகத்தைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַיִּירַשׁ
  choice: கைப்பற்றியது
  rationale: போர்ச் சூழலில் நிலத்தைத் தன்வசப்படுத்தியதைக் குறிக்கிறது; ‘சுதந்தரித்தது’ என்ற தவறான மரபுரிமை நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: אַרְצוֹ
  choice: அவனுடைய நாடு
  rationale: אֶרֶץ இங்குத் அரசனின் ஆட்சிக்குட்பட்ட நிலப்பரப்பைக் குறிக்கிறது; நவீன அரசியல் பொருளை வலியுறுத்தாமல் தமிழில் இயல்பாக அமைகிறது.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: அர்னோன் தொடங்கி யாப்போக்கு வரையிலும்
  rationale: நிலப்பரப்பின் எல்லை விரிவைக் குறிக்கும் מן...עד அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் எல்லை வரையிலும்
  rationale: ‘அம்மோனின் மகன்கள் வரை’ என்ற சொற்சொல் வடிவம் தமிழில் மக்கள் வாழும் பகுதியையா எல்லையையா குறிக்கிறது என்பது தெளிவில்லாமல் அமையும். அடுத்த பகுதியிலுள்ள גְּבוּל இதை எல்லை வரம்பாக விளக்குவதால், இனப்பெயருடன் ‘எல்லை’ இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இஸ்ரவேலின் கைப்பற்றுதல் அங்கே நின்றதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: עַז
  choice: வலுவாக
  rationale: ‘வலிமையான’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘அரணிடப்பட்ட’ என்று குறிப்பிட்ட கட்டுமானப் பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் எல்லை
  rationale: בני עמון என்பது இங்கு இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் ‘அம்மோனியர்’ என்பது இயல்பான, பொருள் துல்லியமான வடிவம்.
theological_decisions:
- issue: בְּנֵי עַמּוֹן என்பதன் இனக்குழுக் குறிப்பு
  choice: அம்மோனியர்
  alternative: அம்மோனின் மகன்கள்
  rationale: எபிரேய ஆண்பால் உறவுமுறைச் சொற்றொடர் இங்கு தனிப்பட்ட ஆண் சந்ததியினரை மட்டும் அல்லாமல் முழு இன மக்களையும் குறிக்கிறது. ‘அம்மோனியர்’ அந்த பிரதிநிதித்துவப் பொருளை இயல்பான தமிழில் தருகிறது; எந்தக் கோட்பாட்டு தனிச்சார்பையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுப் போர்விவரத்துக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகருக்குப் புரியும் நடை. ஆற்றுப் பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்புகளான ‘அர்னோன்’, ‘யாப்போக்கு’ என வழங்கப்பட்டன. மூலத்தின் காரணத் தொடர்பும் வன்முறையை மிகைப்படுத்தாத வினைத் தேர்வும் காக்கப்பட்டுள்ளன.
