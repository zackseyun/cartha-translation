revisions:
- from: இஸ்ரவேல் அவனை வாளின் முனையால் தாக்கி, அர்னோன் தொடங்கி யாப்போக்கு வரையிலும், அம்மோனியரின் எல்லை வரையிலும் அவனுடைய நாட்டைக் கைப்பற்றியது; ஏனெனில் அம்மோனியரின் எல்லை வலுவாக இருந்தது.
  to: இஸ்ரவேல் அவனை வாளின் முனையால் தாக்கி, அவனுடைய நிலத்தை அர்னோன் முதல் யாப்போக்கு வரை, அம்மோனியர் வரை[a] கைப்பற்றியது; ஏனெனில் அம்மோனியரின் எல்லை வலுவாக இருந்தது.
