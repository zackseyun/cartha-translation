source:
  edition: WLC
  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: ta
  text: பாமோத்திலிருந்து, மோவாபின் வெளிநிலத்தில் உள்ள பள்ளத்தாக்கிற்கும், பாழ்நிலத்தை[a] நோக்கியிருக்கும் பிஸ்காவின் உச்சிக்கும்[b] சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யெஷிமோன்.’ எபிரெயச் சொல் பொதுவான ‘பாழ்நிலம்’ என்ற பொருளிலோ, ஒரு பிரதேசப்பெயராகவோ கொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘பாழ்நிலத்தின் முகத்தை நோக்கியிருக்கும்’; இது பாழ்நிலத்தை நோக்கி அல்லது அதன்மேல் கண்ணோக்கும் நிலவியல் உறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: பாமோத்திலிருந்து
  rationale: இப்பயணப் பட்டியலில் בָּמוֹת ஓர் இடப்பெயராகச் செயல்படுவதால், ‘மேடான இடங்கள்’ என்று மொழிபெயர்க்காமல் ‘பாமோத்’ என ஒலிபெயர்க்கப்பட்டது; מִן முன்னொட்டு ‘இலிருந்து’ எனக் காட்டப்பட்டது.
- source_word: הַגַּיְא
  choice: பள்ளத்தாக்கு
  rationale: גַּיְא என்பது பள்ளத்தாக்கையோ குறுகிய ஆழ்பள்ளத்தையோ குறிக்கலாம்; இப்புவியியல் சூழலில் பொதுவாகவும் இயல்பாகவும் புரியும் ‘பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: மோவாபின் வெளிநிலத்தில் உள்ள
  rationale: שָׂדֶה என்பதன் அடிப்படைப் பொருள் ‘வயல்/வெளி’; இங்கு அது திறந்த நிலப்பகுதி அல்லது நாட்டுப்புறத்தைக் குறிப்பதால், எளிய விளைநிலம் என்ற குறுகிய பொருளைத் தவிர்த்து ‘வெளிநிலம்’ என வழங்கப்பட்டது.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: பிஸ்காவின் உச்சி
  rationale: רֹאשׁ என்பதன் நேரடிப் பொருள் ‘தலை’; நிலவியல் சூழலில் இயல்பான ‘உச்சி’ பயன்படுத்தப்பட்டது. הַפִּסְגָּה இங்கு ‘பிஸ்கா’ என்ற இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְנִשְׁקָפָה עַל־פְּנֵי
  choice: பரப்பை நோக்கியிருக்கும்
  rationale: இந்தத் தொடர் ஓர் உயர்ந்த இடம் கீழுள்ள பகுதியை நோக்கியிருப்பதை அல்லது அதற்கு எதிரே அமைந்திருப்பதைச் சொல்கிறது. எபிரெய உருவகத்தைப் பொருளிழக்காமல் இயல்பான தமிழில் கூற இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַיְשִׁימֹן
  choice: பாழ்நிலம்
  rationale: יְשִׁימוֹן வெறுமையும் வறட்சியும் நிறைந்த நிலப்பகுதியைக் குறிக்கிறது. அது பிரதேசப் பெயராகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அந்த மாற்று அடிக்குறிப்பில் வைக்கப்பட்டது.
