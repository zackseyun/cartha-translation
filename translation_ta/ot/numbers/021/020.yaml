translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலின் சுருக்கமான நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தில் முன் சூழலிலிருந்து தொடரும் பயண வினை வெளிப்படையாக இல்லை; தனித்த வசனமாகத் தமிழில் தெளிவுற ‘சென்றார்கள்’ சேர்க்கப்பட்டது. இடப்பெயர்கள் பொதுவாகப் பயன்படும் தமிழ் ஒலிவடிவங்களில் தரப்பட்டன.
