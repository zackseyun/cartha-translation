  terminology: யְהוָה என்பதற்கு ‘யாவே’ எனப் பெயரொலிபெயர்ப்பு செய்திருப்பது மூலத்திற்கும் திட்டத்தின் வழிமுறைக்கும் ஏற்றது. בְּאֵרָה இடப்பெயரை ‘பேர்’ என வழங்கி, அடிக்குறிப்பில் எபிரெயச் சொல்லின் ‘கிணறு’ தொடர்பை விளக்குவது பொருத்தமானது.
