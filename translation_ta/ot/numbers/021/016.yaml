  source_fidelity: பயண வினைச்சொல் எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பயணப் பட்டியலின் சூழலால் ‘சென்றார்கள்’ என நிரப்புவது பொருத்தமானது. யாவே மோசேயிடம் மக்களைத் திரட்டும்படி சொல்லி அவர்களுக்குத் தண்ணீர் அளிப்பதாகக் கூறுகிறார் என்ற பொருள் பாதுகாக்கப்பட்டுள்ளது. ஆனால் ‘பெயேர்’ என்ற வடிவம் எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பாகத் தெளிவாக இல்லை; ‘பேர்’ பொருத்தமானது.
