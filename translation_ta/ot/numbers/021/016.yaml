  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் பேர்[a] என்ற இடத்திற்குச் சென்றார்கள். யாவே மோசேயிடம், “மக்களைக் கூட்டிவா; நான் அவர்களுக்குத் தண்ணீர் தருவேன்” என்று சொன்ன கிணறு அதுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேர்” என்பது இடத்தின் பெயர்; எபிரெயத்தில் இப்பெயர் “கிணறு” என்பதற்கான சொல்லுடன் ஒலித்தொடர்பு உடையது.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: அங்கிருந்து
  rationale: இணைப்புச் சொல்லும் இடத்தைக் குறிக்கும் சொல்லும் பயண விவரத்தின் தொடர்ச்சியைச் சுட்டுகின்றன; தமிழில் இயல்பாக ‘அங்கிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאֵרָה
  choice: பெயேர் என்ற இடத்திற்குச் சென்றார்கள்
  rationale: ‘பெயேர்’ என்பது இடப்பெயர்; இறுதியில் உள்ள திசைச்சுட்டு அசைவு அந்த இடத்தை நோக்கியது என்பதைக் காட்டுகிறது. எபிரெய வாக்கியத்தில் மறைந்துள்ள பயண வினை தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டது.
- source_word: הִוא הַבְּאֵר
  choice: அதுதான் ... கிணறு
  rationale: இடப்பெயரின் முக்கியத்துவத்தை விளக்கும் அடையாளப்படுத்தும் கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: யாவே மோசேயிடம் ... என்று சொன்ன
  rationale: தொடர்புப்பெயர் அமைப்பை தமிழுக்கேற்ற மேற்கோள் அமைப்பாக மாற்றி, அந்தக் கிணற்றுடன் இறைச்சொல்லை இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, எபிரெய வேதாகமத்தில் வரும் தனிப்பட்ட இறைப்பெயர்; அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֱסֹף אֶת־הָעָם
  choice: மக்களைக் கூட்டிச் சேர்
  rationale: மக்களை ஒரே இடத்தில் ஒன்றுகூட்டும்படி மோசேக்குக் கொடுக்கப்பட்ட நேரடியான கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: நான் அவர்களுக்குத் தண்ணீர் கொடுப்பேன்
  rationale: கட்டளையைத் தொடர்ந்து வரும் முதலாம் நபர் cohortative வடிவம் இங்கு இறைவனின் நோக்கத்தையும் உறுதியையும் தெரிவிக்கிறது; தமிழில் எதிர்கால உறுதிமொழியாக இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமாகிய ‘ஆண்டவர்’ என்பதல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே உள்ளது; எனவே பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெயத்தில் மறைந்துள்ள பயண வினை தமிழின் இயல்புக்காக வெளிப்படுத்தப்பட்டுள்ளது; இறைச்சொல்லின் கட்டளையும் வாக்குறுதியும் நேரடியாக வைக்கப்பட்டுள்ளன.
