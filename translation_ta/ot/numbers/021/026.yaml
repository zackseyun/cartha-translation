base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: ta
  text: ஏனெனில், எஸ்போன் எமோரியரின் அரசனான சீகோனின் நகரமாக இருந்தது. அவன் மோவாபின் முந்தைய அரசனோடு போரிட்டு, அவனுக்குச் சொந்தமான நிலம் முழுவதையும் அவனுடைய கையிலிருந்து[a] அர்னோன் வரை கைப்பற்றியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய கையிலிருந்து” என்பது ‘அவனுடைய அதிகாரத்திலிருந்து’ அல்லது ‘கட்டுப்பாட்டிலிருந்து’ என்ற பொருளைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் காரணவியல் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִיר סִיחֹן
  choice: சீகோனின் நகரம்
  rationale: எஸ்போன் சீகோனுடைய அரச மையமாக இருந்ததைக் காட்டும் உடைமைத் தொடர்பை நேரடியாகப் பேணுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியரின்
  rationale: இனப்பெயரை நவீனத் தமிழில் மரியாதையான, இயல்பான வடிவில் தருகிறது.
- source_word: נִלְחַם
  choice: போரிட்டு
  rationale: இவ்விடத்தில் வினை எதிர்த்துப் போரிடுவதைக் குறிக்கிறது; அடுத்த கைப்பற்றல் செயலுடன் இயல்பாக இணைக்கப்படுகிறது.
- source_word: מֶלֶךְ מוֹאָב הָרִאשׁוֹן
  choice: முன்பு மோவாபின் அரசன்
  rationale: רִאשׁוֹן என்பதைக் ‘முதல் அரசன்’ என்று காலவரிசையின் முற்றான முதலாமவராகக் குறுக்காமல், இச்சூழலில் முன்னிருந்த மோவாபிய அரசனைக் குறிக்கும் வகையில் தருகிறது.
- source_word: וַיִּקַּח
  choice: கைப்பற்றியிருந்தான்
  rationale: விளக்கமாகச் சொல்லப்படும் இந்நிகழ்வு பிரதான கதைக் காலத்திற்கு முன்னதாக நடந்ததைக் தமிழில் இறந்தகால நிறைவுவடிவால் தெளிவாக்குகிறது.
- source_word: כָּל אַרְצוֹ
  choice: அவனுடைய நிலம் முழுவதையும்
  rationale: மோவாபின் அரசனுக்குச் சொந்தமான முழு நிலப்பரப்பைக் குறிக்கிறது.
- source_word: מִיָּדוֹ
  choice: அவன் கையிலிருந்து
  rationale: எபிரேய மொழியின் ‘கையிலிருந்து’ என்ற உருவகத்தைப் பேணுகிறது; இங்கு அது அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து பறித்தெடுத்ததைக் குறிக்கிறது.
- source_word: עַד אַרְנֹן
  choice: அர்னோன் வரையிலிருந்த
  rationale: கைப்பற்றப்பட்ட நிலத்தின் எல்லையைத் தமிழில் தெளிவாகக் குறிக்கிறது.
