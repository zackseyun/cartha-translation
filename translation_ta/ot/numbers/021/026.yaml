translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதல் அரசன்’ என்ற சாத்தியமான ஆனால் மிகக் குறிப்பான பொருளைத் தவிர்த்து, הָרִאשׁוֹן என்பதின் சூழல்சார் காலப் பொருளை ‘முன்பு ... அரசன்’ எனப் பேணியுள்ளோம். அடிக்குறிப்புக் குறியீடு தொடர்புடைய ‘கையிலிருந்து’ என்ற மரபுத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
