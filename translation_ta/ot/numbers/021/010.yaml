  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: ta
  text: பின்னர் இஸ்ரவேல் மக்கள் புறப்பட்டு, ஓபோத்தில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலின் சூழலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் பயணப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ் நடையில் அந்தப் பயணத் தொடர்ச்சியைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இந்தச் சொற்றொடர் ஓர் இனக்குழுவை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைத் தேவையின்றி வரையறுக்காமல், நவீனத் தமிழில் அந்தக் கூட்டு அர்த்தத்தை இயல்பாக வழங்குகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது வனாந்தரப் பயணச் சூழலில் ஓரிடத்தில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கும் வழக்கமான வினை. ‘முகாமிட்டார்கள்’ தெளிவான, தற்போதைய தமிழ்ப் பயன்பாடு.
- source_word: בְּאֹבֹת
  choice: ஓபோத்தில்
  rationale: אֹבֹת ஓர் இடப்பெயர் என்பதால் அதன் ஒலிப்பைத் தமிழில் ‘ஓபோத்’ எனப் பெயர்த்து, இடப்பொருள் தரும் ‘-இல்’ உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: וַ
  choice: பின்னர்
  rationale: முதல் வினையோடு இணைந்த வாவ் உரையாடலில் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்னர்’ நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பயணப் பட்டியலுக்கேற்ற கண்ணியமான சுருக்கமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் கூட்டு இனப்பெயர் அர்த்தத்துக்காக ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
