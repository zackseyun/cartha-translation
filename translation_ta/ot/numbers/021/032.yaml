  edition: WLC
  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: ta
  text: பின்பு மோசே யாசேரை வேவு பார்க்க ஆட்களை அனுப்பினார். அவர்கள் அதைச் சார்ந்த சிற்றூர்களைக்[a] கைப்பற்றி, அங்கே இருந்த எமோரியர்களை உரிமையிழக்கச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அதன் மகள்கள்”; ஒரு நகரத்தைச் சார்ந்த குடியிருப்புகள் அல்லது சிற்றூர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: கதைநடையில் שׁלח என்பதன் இயல்பான தமிழ் மொழிபெயர்ப்பு; மோசே எழுவாயாக இருப்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: לְרַגֵּל
  choice: வேவுபார்க்க
  rationale: ஒரு இடத்தை இராணுவ நோக்கில் இரகசியமாக ஆராய்வதைக் குறிக்கும் פיעל வினை; இயல்பான தமிழில் உளவறிதல் மற்றும் நிலப்பரப்பை ஆராய்தல் ஆகிய இரு நிழற்பொருள்களையும் தருகிறது.
- source_word: יַעְזֵר
  choice: யாசேர்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: וַיִּלְכְּדוּ
  choice: கைப்பற்றி
  rationale: இராணுவச் சூழலில் לכד என்பது பிடித்தல் அல்லது கைப்பற்றுதல்; இங்கு ஊர்களைக் கைப்பற்றியதைக் குறிக்கிறது.
- source_word: בְּנֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொல்லுக்கு சொல் ‘அதன் மகள்கள்’; எபிரெய புவியியல் வழக்கில் முதன்மை நகரத்தைச் சார்ந்த குடியிருப்புகள் அல்லது சிற்றூர்களைக் குறிக்கிறது. தமிழில் பொருளைத் தெளிவாகத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַיִּירַשׁ
  choice: துரத்திவிட்டார்கள்
  rationale: வெற்றிகொள்ளும் சூழலில் ירש முன் குடியிருந்தோரை அகற்றி அவர்களின் இடத்தை உடைமையாக்குவதைக் குறிக்கலாம். தமிழில் ‘துரத்திவிட்டார்கள்’ அகற்றுதலைத் தெளிவாகக் காட்டுகிறது; உடைமையாக்குதல் முந்தைய ‘கைப்பற்றி’ என்பதாலும் சூழலாலும் வெளிப்படுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்கள்
  rationale: எபிரெய மொழியில் ஒருமை வடிவிலுள்ள கூட்டினப் பெயர்; தமிழில் இயல்பாகப் பன்மையில் வழங்கப்பட்டது.
- source_word: אֲשֶׁר שָׁם
  choice: அங்கே இருந்த
  rationale: அந்த இடத்தில் இருந்த எமோரிய மக்களைக் குறிக்கும் எளிய, இயல்பான தமிழ் தொடர்.
