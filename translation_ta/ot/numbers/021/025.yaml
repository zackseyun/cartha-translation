translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியும் இருமுறை வரும் ‘இஸ்ரவேல்’ என்ற எழுவாயின் வலியுறுத்தலும் கருத்தளவில் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக இரண்டாவது எழுவாய் மறைமுகமாக அமைக்கப்பட்டுள்ளது. சார்பு ஊர்களைக் குறிக்கும் உருவகம் முதன்மை உரையில் தெளிவாக்கப்பட்டு அடிக்குறிப்பில் நேரடி வடிவில் தரப்பட்டுள்ளது.
