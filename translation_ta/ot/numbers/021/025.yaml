  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: ta
  text: இஸ்ரவேல் இந்த நகரங்கள் அனைத்தையும் கைப்பற்றி, எமோரியர்களின் எல்லா நகரங்களிலும்—எஸ்போனிலும் அதைச் சேர்ந்த சிற்றூர்கள் அனைத்திலும்[a]—குடியேறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அதன் மகள்கள் அனைத்திலும்.” இது ஒரு பெரிய நகரத்தைச் சேர்ந்த சிறிய சார்புக் குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கைப்பற்றி
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இங்கு போர்ச் சூழலில் நகரங்களைக் கைப்பற்றியதைக் குறிக்கிறது. ‘கைப்பற்றி’ என்பது சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள் அனைத்தையும்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; வெற்றிகொள்ளப்பட்ட குடியிருப்புகளைக் குறிக்கும் இச்சூழலில் ‘நகரங்கள்’ பொருத்தமானது. הָאֵלֶּה என்ற சுட்டுப்பெயரும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיֵּשֶׁב
  choice: குடியேறியது
  rationale: ישב என்பது அமர்தல், வசித்தல், குடியேறுதல் ஆகிய பொருள்களைக் கொண்டது. கைப்பற்றிய இடங்களில் வசிக்கத் தொடங்கியதைக் குறிக்கும் இச்சூழலில் ‘குடியேறியது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: எமோரியர்களின் எல்லா நகரங்களிலும்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது. הָאֱמֹרִי ஒருமை வடிவில் ஒரு இனக்குழுவைக் குறித்தாலும், தமிழில் இயல்பாக ‘எமோரியர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּחֶשְׁבּוֹן
  choice: எஸ்போனிலும்
  rationale: חֶשְׁבּוֹן என்ற இடப்பெயர் தமிழ் ஒலிப்பெயர்ப்பில் ‘எஸ்போன்’ என வழங்கப்படுகிறது; בְּ முன்னிடைச்சொல் ‘-இல்’ ஆகத் தரப்பட்டுள்ளது.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: அதைச் சேர்ந்த சிற்றூர்கள் அனைத்திலும்
  rationale: ஒரு முதன்மை நகரத்தைச் சார்ந்த சிறிய குடியிருப்புகளை ‘அதன் மகள்கள்’ என்று குறிப்பிடும் எபிரெய மரபுத்தொடர் இது. தமிழில் பொருள் தெளிவாக இருக்க ‘அதைச் சேர்ந்த சிற்றூர்கள்’ என மொழிபெயர்க்கப்பட்டு, நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
