  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: ta
  text: அப்போது இஸ்ரயேல் ஆண்டவருக்கு ஒரு நேர்த்திக்கடன் செய்து, “நீர் இந்த மக்களை நிச்சயமாக என் கையில் ஒப்புக்கொடுத்தால்[a], அவர்களுடைய நகரங்களை அழிவுக்கென்று அர்ப்பணிப்பேன்[b]” என்று கூறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் வினைச்சொல் வலியுறுத்தப்பட்டுள்ளது; சொற்சொல்லாக, “கொடுத்துக் கொடுப்பீரானால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய நகரங்களை முற்றிலும் அழிப்பேன்”; அல்லது, “அவர்களுடைய நகரங்களை அழிவுக்காக மீளமுடியாதபடி ஒதுக்குவேன்.” எபிரேயச் சொல், ஒன்றை மீட்க முடியாதபடி அழிவுக்கென்று அர்ப்பணிக்கும் ஹேரெம் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: ஒரு நேர்த்திக்கடன் செய்து
  rationale: எபிரேயச் சொற்பிறப்பொத்த தொடரான ‘ஒரு நேர்த்திக்கடனை நேர்ந்தான்’ என்பதன் முறைசார் வாக்குறுதி உணர்வை, இயல்பான நவீனத் தமிழில் ‘ஒரு நேர்த்திக்கடன் செய்து’ என வழங்குகிறது.
- source_word: לַיהוָה
  choice: ஆண்டவரிடம்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைத் தமிழின் நிலைபெற்ற வேதாகம மரபுப்படி ‘ஆண்டவர்’ என வழங்கி, நேர்த்திக்கடன் செலுத்தப்படும் நபரை ‘-இடம்’ வேற்றுமையால் இயல்பாகக் குறிக்கிறது.
- source_word: אִם נָתֹן תִּתֵּן
  choice: நீர் ... உறுதியாக ... ஒப்புக்கொடுத்தால்
  rationale: முற்றுவினையுடன் வரும் வினையெச்சப் பெயருரு ஏற்படுத்தும் வலியுறுத்தலை ‘உறுதியாக’ என்பதால் காட்டுகிறது; நிபந்தனை அமைப்பையும் காக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: ஒருமைத் தொகுப்புப் பெயரான עָם என்பதைக் தமிழில் இயல்பான தொகுப்புப் பன்மை வடிவில் வழங்குகிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுத்தல் என்ற எபிரேய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் அப்படியே காக்கிறது.
- source_word: וְהַחֲרַמְתִּי
  choice: அழிவுக்கென்று அர்ப்பணிப்பேன்
  rationale: חרם என்பதிலுள்ள வெறும் அழித்தலைவிட விரிவான, மீட்க முடியாதபடி அழிவுக்காக ஒதுக்கும் சடங்கு-போரியல் பொருளைத் தக்கவைக்கிறது.
- source_word: עָרֵיהֶם
  choice: அவர்களுடைய நகரங்களை
  rationale: עִיר என்பதன் நேரடியான பொருளையும் பன்மை வடிவையும் காக்கிறது.
theological_decisions:
- issue: போரியல் நேர்த்திக்கடனில் חרם மொழியின் பொருள்
  choice: அவர்களுடைய நகரங்களை அழிவுக்கென்று அர்ப்பணிப்பேன்
  alternative: அவர்களுடைய நகரங்களை முற்றிலும் அழிப்பேன்; அவர்களுடைய நகரங்களைத் தடையாணைக்குள் வைப்பேன்
  rationale: இது சாதாரணப் போரழிப்பு மட்டுமல்லாமல், கைப்பற்றப்பட்டவற்றை மீட்க முடியாதபடி அழிவுக்காக ஒதுக்கும் முறைசார் செயல் என்பதைக் காட்டுகிறது. அதேவேளை பிற்காலக் கோட்பாட்டு அல்லது அறவியல் விளக்கத்தை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இஸ்ரயேல் ஒரு தொகுப்பாகக் கருதப்படுவதால் ‘என்றான்’ என்ற ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது. ‘என் கையில்’ என்ற மூல உருவகமும் חרם என்பதின் சடங்கு-போரியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
