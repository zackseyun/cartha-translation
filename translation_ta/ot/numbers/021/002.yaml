- from: அப்போது இஸ்ரயேல் ஆண்டவரிடம் ஒரு நேர்த்திக்கடன் செய்து, “நீர் இந்த மக்களை உறுதியாக என் கையில் ஒப்புக்கொடுத்தால்[a], அவர்களுடைய நகரங்களை அழிவுக்கென்று அர்ப்பணிப்பேன்[b]” என்றான்.
