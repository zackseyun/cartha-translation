  source_fidelity: 'முக்கிய பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: மக்கள் கடவுளுக்கும் மோசேக்கும் எதிராகப் பேசியதும், பாலைநிலத்தில் இறப்பதைப் பற்றிய குற்றச்சாட்டும், உணவு மற்றும் தண்ணீர் இல்லை என்ற புகாரும், வழங்கப்பட்ட உணவை வெறுத்ததும் தெளிவாக உள்ளன. ஆனால் הֶעֱלִיתֻנוּ מִמִּצְרַיִם என்பதிலுள்ள ‘எகிப்திலிருந்து வெளியே/மேலே கொண்டுவந்தீர்கள்’ என்ற புறப்பாட்டு இயக்கம், ‘அழைத்துக்கொண்டு வந்தீர்கள்’ என்பதில் சற்றுத் தளர்கிறது. அதைத் திருத்துவது பாதுகாப்பானதும் மூலத்திற்கு நெருக்கமானதும் ஆகும்.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘பாலைநிலம்,’ ‘தண்ணீர்,’ ‘நாங்கள் வெறுக்கிறோம்’ ஆகியவை தெளிவானவை. ‘வெளியே கொண்டுவந்தீர்கள்’ என்பது இச்சூழலில் இயல்பாக இருந்து எபிரெய மூலத்தின் திசையியக்கத்தையும் காக்கிறது.
  terminology: ‘கடவுள்,’ ‘மோசே,’ ‘பாலைநிலம்’ ஆகியவை பொருத்தமானவை. לֶחֶם என்ற சொல்லின் இரு இடங்களிலும் ‘உணவு’ என்பதைப் பயன்படுத்துவது தமிழில் இயல்பாகவும், மக்கள் கூறும் உள்ளார்ந்த பதற்றத்தைப் பாதுகாப்பதாகவும் உள்ளது. קְלֹקֵל என்பதற்கான ‘இழிவான’ ஏற்றுக்கொள்ளத்தக்கது; அடிக்குறிப்பில் உள்ள ‘மதிப்பற்ற’ மற்றும் ‘கேவலமான’ மாற்றுகளும் அரிய சொல்லின் இகழ்ச்சித் தொனியைத் தகுந்தவாறு காட்டுகின்றன.
