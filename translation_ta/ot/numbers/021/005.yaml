  rationale: எகிப்திலிருந்து புறப்பட்டுக் கொண்டுவரப்பட்ட செயலை மூலத்தின் திசையியக்கத்துடன் வெளிப்படுத்த ‘அழைத்துக்கொண்டு வந்தீர்கள்’ என்பதற்குப் பதிலாக ‘வெளியே கொண்டுவந்தீர்கள்’ என மாற்றப்பட்டது. வேறு எந்தப் பொருளியல் அல்லது இறையியல் விளக்கமும் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு கְלֹקֵל என்ற இறுதி சொல்லின் தமிழாக்கத்தோடு சரியாகத் தொடர்புபடுத்தப்பட்டுள்ளது.
