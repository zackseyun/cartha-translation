  text: וַ/יְדַבֵּ֣ר הָ/עָ֗ם בֵּֽ/אלֹהִים֮ וּ/בְ/מֹשֶׁה֒ לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לָ/מ֖וּת בַּ/מִּדְבָּ֑ר כִּ֣י אֵ֥ין לֶ֨חֶם֙ וְ/אֵ֣ין מַ֔יִם וְ/נַפְשֵׁ֣/נוּ קָ֔צָה בַּ/לֶּ֖חֶם הַ/קְּלֹקֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: ta
  text: 'மக்கள் கடவுளுக்கும் மோசேக்கும் எதிராகப் பேசினார்கள்: “நாங்கள் இந்தப் பாலைநிலத்தில் சாகும்படி எங்களை ஏன் எகிப்திலிருந்து வெளியே கொண்டுவந்தீர்கள்? இங்கே உணவும் இல்லை, தண்ணீரும் இல்லை; இந்த இழிவான உணவை நாங்கள் வெறுக்கிறோம்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இழிவான உணவு” என்பதற்கு “மதிப்பற்ற உணவு” அல்லது “கேவலமான உணவு” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயப் பெயரடை அரிதானது; கடவுள் கொடுத்த உணவை மக்கள் இகழ்ந்ததை அது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: மக்கள் கடவுளுக்கும் மோசேக்கும் எதிராகப் பேசினார்கள்
  rationale: דבר + ב இங்கு தொடர்ந்து வரும் குற்றச்சாட்டால் எதிர்ப்பான பேச்சைக் குறிக்கிறது. ‘எதிராகப் பேசினார்கள்’ என்பது பகைமைத் தொனியைப் பாதுகாக்கிறது; தேவையின்றி ‘நிந்தித்தார்கள்’ என வலுப்படுத்துவதில்லை.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: எங்களை ஏன் எகிப்திலிருந்து அழைத்துக்கொண்டு வந்தீர்கள்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘மேலே கொண்டுவந்தீர்கள்’ என்றாலும், தமிழில் புறப்பாட்டுச் செயலை இயல்பாகக் கூற ‘அழைத்துக்கொண்டு வந்தீர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: இந்தப் பாலைநிலத்தில் சாகும்படி
  rationale: מִדְבָּר என்பது அவசியம் மணற்பாலைவனம் அல்ல; குடியிருப்பற்ற வறண்ட நிலத்தைக் குறிக்கலாம். ‘பாலைநிலம்’ அந்தப் பரப்பைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: இங்கே உணவும் இல்லை, தண்ணீரும் இல்லை
  rationale: לֶחֶם என்பதற்கு ‘அப்பம்’ என்பது நேர்பொருள்; ஆனால் இங்கு பொதுவான உணவைக் குறிக்கிறது. அடுத்துள்ள ‘உணவு’ குறித்த முரண்பாடான குற்றச்சாட்டையும் தமிழில் தெளிவாக வைத்திருக்க ‘உணவு’ தேர்ந்தெடுக்கப்பட்டது. ‘இங்கே’ சூழலிலிருந்து இயல்பாக நிரப்பப்பட்டது.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: நாங்கள் வெறுக்கிறோம்
  rationale: சொற்பட ‘எங்கள் உயிர் அருவருப்படைந்தது/சலித்தது’ எனும் எபிரெயச் சொற்றொடரை, அதன் தீவிர வெறுப்புணர்வைப் பாதுகாக்கும் இயல்பான தமிழாக வழங்குகிறது.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: இந்த இழிவான உணவை
  rationale: அரிதான קְלֹקֵל உணவை இகழ்ந்து மதிப்பற்றதாகக் கூறும் சொல்லாகும். ‘இழிவான’ மக்களின் அவமதிப்பை வெளிப்படுத்துகிறது; ‘இந்த’ என்பது எபிரெயில் தனியான சுட்டுப்பெயராக இல்லாவிட்டாலும் குறிப்பிட்ட தற்போதைய உணவைச் சுட்டும் தமிழ்ச் சொல்லாக்கம்.
theological_decisions:
- issue: கடவுளையும் மோசேயையும் நோக்கிய மக்களின் பேச்சின் தன்மை
  choice: ‘எதிராகப் பேசினார்கள்’ என்று எதிர்ப்பான குற்றச்சாட்டாக மொழிபெயர்த்தல்
  alternative: ‘கடவுளிடமும் மோசேயிடமும் பேசினார்கள்’ அல்லது ‘கடவுளையும் மோசேயையும் பற்றிப் பேசினார்கள்’
  rationale: அடுத்து வரும் கேள்வியும் உணவை இகழும் கூற்றும் வெளிப்படையான குற்றச்சாட்டாக இருப்பதால், நடுநிலையான மொழிபெயர்ப்பு கிளர்ச்சித் தொனியைத் தணித்துவிடும்.
- issue: உணவு இல்லை என்ற கூற்றுக்கும் தற்போதைய உணவை வெறுப்பதாகச் சொல்வதற்கும் இடையிலான பதற்றம்
  choice: இரு கூற்றுகளையும் எந்த விளக்கச் சேர்க்கையும் இன்றி அப்படியே வைத்தல்
  alternative: ‘சாதாரண உணவு இல்லை’ போன்ற விளக்கத்தைச் சேர்த்து முரண்பாட்டைத் தீர்த்தல்
  rationale: மூல உரையின் குற்றச்சாட்டு நோக்கமுள்ள மிகைப்படுத்தலையும் உள்ளார்ந்த பதற்றத்தையும் மொழிபெயர்ப்பு அமைதியாகச் சரிசெய்யக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை (‘வந்தீர்கள்’) பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய இறுதி கூற்றுக்குப் பின் இடப்பட்டுள்ளது.
