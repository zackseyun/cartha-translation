  text: וַ/יֵּ֨שֶׁב֙ יִשְׂרָאֵ֔ל בְּ/אֶ֖רֶץ הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: ta
  text: இஸ்ரவேல் அமோரியரின் நாட்டில் குடியிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் முறையாக: “இஸ்ரவேல் அமோரியரின் நாட்டில் வசித்தது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தது
  rationale: ישׁב என்பதற்கு ‘அமர்தல், வாழ்தல், குடியிருத்தல்’ என்ற பொருள்கள் உண்டு. இங்கு இஸ்ரவேல் அந்த நாட்டில் வசிக்கத் தொடங்கியதைச் சுருக்கமாகக் கூறுவதால், ‘குடியிருந்தது’ இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: உடன்படிக்கை மக்களைக் குறிக்கும் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு. ஒருங்கிணைந்த மக்களினத்தை ஒருமை வடிவில் குறிப்பிடுவதால் ‘குடியிருந்தது’ என இணைக்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு ஒரு குறிப்பிட்ட மக்களின் நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது; ‘நாட்டில்’ என்பது நவீன தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்களின்
  rationale: எபிரெயத்தில் இனம் குறிக்கும் ஒருமை வடிவம் இருந்தாலும், அது இங்கு ஒரு தனிநபரை அல்ல, எமோரிய மக்களையும் அவர்களுடைய நாட்டையும் கூட்டாகக் குறிக்கிறது. ஆகவே தமிழில் இயல்பான பன்மை ‘எமோரியர்களின்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. וַ என்ற தொடர்ச்சிச் சொல்லுக்கு சூழலின் விளைவை உணர்த்தும் ‘எனவே’ பயன்படுத்தப்பட்டுள்ளது; இனப்பெயர் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
