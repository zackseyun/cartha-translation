source:
  edition: WLC
  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: ta
  text: நாங்கள் அவர்களை நோக்கி அம்பு எய்தோம்[a]; எஸ்போன் தீபோன் வரை அழிந்துபோனது. மேதேபா வரையிலும் இருக்கும் நோப்பா வரை நாங்கள் பாழாக்கினோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தத் தொடக்கச் சொற்றொடரின் எபிரேய வாசகம் கடினமானது. “நாங்கள் அவர்களை முறியடித்தோம்,” “அவர்களுடைய ஆட்சி அழிந்தது” என்றும் இதைப் புரிந்துகொண்டுள்ளனர்.
    reason: textual_variant
  - marker: b
    text: “நாங்கள் பாழாக்கினோம்” என்று மொழிபெயர்க்கப்பட்டுள்ள வடிவமும் உறுதியற்றது. சிலர் அதை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்; ஆனால் இந்த வெற்றிப்பாடலின் சூழல் அழிவைச் சுட்டும் வினைச்சொல்லை ஆதரிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: நாங்கள் அவர்களை நோக்கி அம்பெய்தோம்
  rationale: இச்சொல்வடிவம் மிகவும் கடினமானது. வழங்கப்பட்ட மெய்யெழுத்துகளையும் முதல் நபர் பன்மைச் செயல் மற்றும் மூன்றாம் நபர் பன்மை பின்னொட்டு என்ற புரிதலையும் கருத்தில் கொண்டால், போர்ப்பாடலுக்கேற்ற ‘அவர்களை நோக்கி அம்பெய்தோம்’ என்ற விறுவிறுப்பான படிமம் சாத்தியமானது; வேறு முக்கியப் புரிதல்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אָבַד
  choice: அழிந்துபோனது
  rationale: ‘அழிதல்/ஒழிந்துபோதல்’ என்ற நிறைவுற்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: חֶשְׁבּוֹן
  choice: எஸ்போன்
  rationale: இடப்பெயர்; எபிரேய ஒலிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டது.
- source_word: עַד דִּיבוֹן
  choice: தீபோன் வரை
  rationale: עַד குறிக்கும் எல்லை அல்லது பரப்பின் முடிவை ‘வரை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַנַּשִּׁים
  choice: நாங்கள் பாழாக்கினோம்
  rationale: வடிவம் உறுதியற்றதாயினும், வெற்றிப்பாடலின் சூழலில் முதல் நபர் பன்மை அழிவுச் செயலைக் குறிப்பதாகப் புரிவது தொடர் இடப்பெயர்களுக்கும் படையெடுப்பு மொழிக்கும் நன்கு பொருந்துகிறது.
- source_word: עַד נֹפַח
  choice: நோப்பா வரையிலும்
  rationale: עַד குறிக்கும் பரப்பெல்லையைத் தெளிவாகக் காட்டுகிறது; நோப்பா இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: மேதேபா வரையிலும் சென்றடையும் பகுதியை
  rationale: אֲשֶׁר தொடர்புச் சொல்லின் துல்லிய இணைப்பு தெளிவற்றது. இடவிரிவைக் குறிக்கும் பொருளைத் தக்கவைத்து, தமிழில் புரியும்படி இடைச்செருகல் அமைப்பில் தரப்பட்டுள்ளது.
- source_word: מֵידְבָא
  choice: மேதேபா
  rationale: இடப்பெயர்; எபிரேய ஒலிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டது.
