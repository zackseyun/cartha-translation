  register: நவீனத் தரத் தமிழில், போர்வெற்றிப் பாடலின் சுருக்கமான கவித்துவத் தன்மையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடினமான இரு எபிரேய வடிவங்களின் நிச்சயமின்மை முதன்மை உரையில் இயல்பை குலைக்காமல் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
