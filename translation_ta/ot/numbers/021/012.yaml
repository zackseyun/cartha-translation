  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் புறப்பட்டுச் செரேத் பள்ளத்தாக்கில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செரேத் ஓடைப் பள்ளத்தில்” அல்லது “செரேத் பருவகால நீரோடையில்.” எபிரேயச் சொல் நஹல் (naḥal), ஒரு பள்ளத்தாக்கு, ஓடைப் பள்ளம், அல்லது பருவகால நீரோடையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து பயணம் தொடர்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: נָסָעוּ
  choice: புறப்பட்டு
  rationale: பயணக் குறிப்புகளில் נסע என்பது முகாமை விட்டுப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ அந்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் முகாமிடுதல் என்ற பொருளைத் தெளிவாகவும் தற்காலத் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: בְּנַחַל
  choice: பள்ளத்தாக்கில்
  rationale: נַחַל என்பது வறண்ட காலத்தில் நீரில்லாமல் இருக்கக்கூடிய ஓடைப் பள்ளம், பள்ளத்தாக்கு அல்லது பருவகால நீரோடையைக் குறிக்கலாம். பொதுவாசகர்களுக்குப் புரியும் ‘பள்ளத்தாக்கு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; அதன் பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: זָרֶד
  choice: செரேத்
  rationale: எபிரெய இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
