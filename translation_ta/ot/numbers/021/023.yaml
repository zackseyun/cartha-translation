  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியும், ‘மக்கள்’ என்ற மூலச்சொல்லின் திறந்த பொருளும் பேணப்பட்டுள்ளன. எல்லா அடிக்குறிப்புக் குறிகளும் உரையில் இடம்பெற்றுள்ளன.
