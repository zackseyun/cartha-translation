  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: ta
  text: ஆனால் சீகோன் இஸ்ரவேலைத் தனது நாட்டின் வழியாகக் கடந்து செல்ல அனுமதிக்கவில்லை.[a] எனவே சீகோன் தன் மக்கள் அனைவரையும் ஒன்றுதிரட்டி, பாலைநிலத்தில் இஸ்ரவேலை எதிர்கொள்ளப் புறப்பட்டான்.[b] அவன் யாகாசுக்கு வந்து, இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனது எல்லை வழியாகக் கடந்து செல்ல அனுமதிக்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “தன் மக்கள் அனைவரையும்.” போர்ச் சூழல் ஆயுதமேந்திய படையினரைக் குறிப்பதாக இருந்தாலும், மூலவாசகம் “படை” என்று வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: கடந்து செல்ல அனுமதிக்கவில்லை
  rationale: எபிரெய மொழியில் சொற்பட ‘கடந்து செல்லக் கொடுக்கவில்லை’ என்றிருந்தாலும், இக்கட்டமைப்பு அனுமதி மறுப்பதைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בִּגְבֻלוֹ
  choice: தனது நாட்டின் வழியாக
  rationale: גְּבוּל என்பது எல்லை, எல்லைக்குட்பட்ட பகுதி அல்லது ஆட்சிப்பரப்பு எனப் பொருள்படலாம். இங்கு சீகோனின் நிலப்பகுதி வழியாகச் செல்வதே சூழல்; ‘நாட்டின் வழியாக’ என்பது அதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: தன் மக்கள் அனைவரையும் ஒன்றுதிரட்டி
  rationale: மூலத்தில் ‘தன் மக்கள் அனைவரையும்’ என்றே உள்ளது; போர்ச் சூழல் படையைக் குறிப்பதாக இருந்தாலும், ‘படை’ என்று வெளிப்படையாக இல்லாததால் மூலத்தின் சொல்லாட்சியே பேணப்படுகிறது.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: இஸ்ரவேலை எதிர்கொள்ள
  rationale: இது சந்திக்க அல்லது எதிர்கொள்ளப் புறப்படுவதைக் குறிக்கிறது. பின்னர் போர் வெளிப்படையாகக் கூறப்படுவதால், ‘தாக்க’ என்று மிகைப்படுத்தாமல் பகைமைச் சூழலுக்கு ஏற்ற ‘எதிர்கொள்ள’ பயன்படுத்தப்பட்டது.
- source_word: הַמִּדְבָּרָה
  choice: பாலைநிலத்திற்குப்
  rationale: திசையைக் குறிக்கும் ־ָה இறுதி, பாலைநிலத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது. ‘பாலைநிலத்திற்குப் புறப்பட்டான்’ இதை இயல்பான தமிழில் தருகிறது.
- source_word: יָהְצָה
  choice: யாகாசுக்கு
  rationale: இது இடப்பெயர். எபிரெய ஒலிப்புக்கு அண்மையாக ‘யாகாஸ்’ என்பதன் வேற்றுமை வடிவமான ‘யாகாசுக்கு’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்
  rationale: לחם வினையுடன் வரும் ב இங்கு பகைமை நிறைந்த போரிடுதலைக் குறிக்கிறது; ‘எதிராகப் போரிட்டான்’ அதனைத் தெளிவாகத் தருகிறது.
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய வசனத்தில் கேட்ட பயண அனுமதிக்கு மாறான பதிலை இணைப்புச் சொல் அறிமுகப்படுத்துவதால், ‘ஆனால்’ என்ற முரண்பாட்டு இணைப்பு பொருத்தமானது.
