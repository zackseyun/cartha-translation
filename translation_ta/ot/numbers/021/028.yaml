  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: ta
  text: 'ஏனெனில், ஹெஷ்போனிலிருந்து நெருப்பு புறப்பட்டது;

    சீகோனின் நகரத்திலிருந்து தீச்சுடர் எழுந்தது.

    அது மோவாபின் ஆரையும்[a],

    அர்னோனின் மேடான இடங்களின் அதிபதிகளையும்[b] விழுங்கியது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மோவாபின் ஆர்’ என்பது ஓர் இடப்பெயர். எபிரேயச் சொல்லை பொதுப்பெயராக எடுத்தால், ‘மோவாபின் நகரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அர்னோனின் உயரங்களின் அதிபதிகள்’ அல்லது ‘அர்னோனின் மேடான இடங்களை உடையவர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய ‘மேடான இடங்கள்’ என்னும் சொல் உயர்ந்த நிலப்பகுதிகளையோ உயரமான வழிபாட்டிடங்களையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய பாடல் வரிக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: அடுத்த அரையடியில் வரும் ‘தீச்சுடர்’ என்பதுடன் உள்ள கவிதை இணைநிலையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יָצְאָה
  choice: புறப்பட்டது
  rationale: ஒரு இடத்திலிருந்து நெருப்பு வெளிப்பட்டு வருகிற உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது.
- source_word: מֵחֶשְׁבּוֹן
  choice: எஸ்போனிலிருந்து
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, ‘இலிருந்து’ என்ற நீங்கல் வேற்றுமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֶהָבָה
  choice: தீச்சுடர்
  rationale: நெருப்பின் கொழுந்து அல்லது சுடர் என்ற தெளிவான உருவகத்தைத் தருகிறது; ‘நெருப்பு’ என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்க்கிறது.
- source_word: מִקִּרְיַת סִיחֹן
  choice: சீகோனின் நகரத்திலிருந்து
  rationale: קִרְיָה என்பதை இங்கு தனிப்பெயராக அல்ல, ‘நகரம்’ என்னும் பொதுப்பெயராக எடுத்துக் கொண்டு எபிரேய ஆக்கத்தொடரை இயல்பாக வழங்குகிறது.
- source_word: אָכְלָה
  choice: விழுங்கியது
  rationale: நெருப்பு ‘உண்பது’ என்ற எபிரேய உருவகத்தின் தீவிரத்தையும் கவிதைத் தன்மையையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: עָר מוֹאָב
  choice: மோவாபின் ஆர் நகரம்
  rationale: עָר என்பதை அறியப்பட்ட இடப்பெயரான ‘ஆர்’ என்று முதன்மையாக எடுத்து, வாசகருக்குத் தெளிவாக ‘நகரம்’ என்பதையும் சேர்க்கிறது.
- source_word: בַּעֲלֵי
  choice: அதிபதிகள்
  rationale: ‘உரிமையாளர்கள்/எஜமானர்கள்/அதிபதிகள்’ என்ற அடிப்படைப் பொருளை மரியாதையான கவிதை நடையில் தருகிறது; ‘குடியிருப்போர்’ என்று விளக்கவுரை செய்வதைத் தவிர்க்கிறது.
- source_word: בָּמוֹת
  choice: மேடான இடங்கள்
  rationale: ‘உயரங்கள்’ அல்லது வழிபாட்டுடன் தொடர்புடைய ‘மேடான இடங்கள்’ ஆகிய இரு சாத்தியங்களையும் முற்றிலும் முடிவுசெய்யாமல் வைக்கும் பரந்த சொற்றொடர்.
- source_word: אַרְנֹן
  choice: அர்னோன்
  rationale: ஆறு அல்லது பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் நிலப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: בָּמוֹת என்பது சாதாரண உயரங்களையா அல்லது வழிபாட்டுக்குரிய மேடான இடங்களையா குறிக்கிறது
  choice: மேடான இடங்கள்
  alternative: உயரங்கள்; மேடான வழிபாட்டிடங்கள்
  rationale: மூலச்சொல்லில் உள்ள புவியியல் மற்றும் வழிபாட்டு சார்ந்த பொருள் வாய்ப்புகளை ஒரே குறிப்பிட்ட விளக்கத்துக்குள் அடைக்காமல் காக்கிறது.
- issue: בַּעֲלֵי בָּמוֹת אַרְנֹן என்பதன் குறிப்பு
  choice: அர்னோனின் மேடான இடங்களின் அதிபதிகள்
  alternative: அர்னோனின் உயரங்களை உடையவர்கள்; அர்னோனின் மேடான இடங்களில் வாழ்வோர்
  rationale: எபிரேய בַּעֲלֵי என்பதன் நேரடியான ‘அதிபதிகள்/உடைமையாளர்கள்’ என்ற வலிமையைப் பாதுகாக்கிறது; ‘குடியிருப்போர்’ என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் பாடலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. இரண்டு இணையான அரையடிகளும் அழிவு விளக்கும் இறுதி வரிகளும் வரிப் பிரிப்பால் வெளிப்படுத்தப்பட்டுள்ளன. ‘அதிபதிகள்’ என்ற சொல் கவிதைச் செறிவைக் காக்கிறது; அடிக்குறிப்பு அதன் பொருள் மாற்றுகளைத் தெளிவுபடுத்துகிறது.
