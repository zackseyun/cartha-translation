  source_fidelity: மூலத்தின் கவிதை இணைநிலையும், நெருப்பு அழித்தது என்னும் உருவகமும், ஆர் மற்றும் அர்னோனின் மேடான இடங்களின் அதிபதிகள் என்னும் இரண்டு நேரடிப் பொருள்களும் பெரும்பாலும் சரியாக உள்ளன. ஆனால் எபிரேய חֶשְׁבּוֹן-இன் தொடக்க மெய்யொலியைத் தவிர்க்காமல் ‘ஹெஷ்போன்’ என ஒலிபெயர்ப்பது மூலநெருக்கத்திற்கு ஏற்றது. மேலும் עָר מוֹאָב-இல் இடப்பெயருடன் சேர்க்கப்பட்டுள்ள ‘நகரம்’ மூலத்தில் தனியாக இல்லை; அது பெயரின் பொருளை மொழிபெயர்ப்பில் சேர்த்துவிடுகிறது.
  naturalness: வரி அமைப்பும் கவிதை நடையும் இயல்பாக உள்ளன. ‘அது’ என்பது உடனடியாக முன்வரும் ‘தீச்சுடர்’ என்பதைக் குறித்தாலும், இரு இணை அரையடிகளின் கூட்டு உருவகமாகப் புரியக்கூடியது. ‘மேடான இடங்கள்’ நவீனத் தமிழில் புரியக்கூடியது; அடிக்குறிப்பு அதன் மாற்றுப்பொருள் வாய்ப்பைத் தகுந்தபடி விளக்குகிறது.
