  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: ta
  text: யாவே இஸ்ரவேலின் குரலைக் கேட்டு, கானானியரை அவர்களிடம் ஒப்படைத்தார். அவர்கள் கானானியரையும் அவர்களுடைய நகரங்களையும் அழிவுக்கென்று அர்ப்பணித்தார்கள். ஆகவே, அந்த இடத்திற்கு ஹோர்மா[a] என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஹோர்மா” என்ற பெயர், “அழிவுக்கென்று அர்ப்பணித்தல்” அல்லது “அழிவுத் தடையின் கீழ் வைத்தல்” என்று பொருள்படும் எபிரெயச் சொல்லுடன் தொடர்புடையது.
    reason: இடப்பெயருக்கும் חָרַם வினைச்சொல்லுக்கும் உள்ள எபிரெயச் சொல்விளையாட்டைத் துல்லியமாகக் காக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனின் தனிப்பட்ட பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள நேரடி பெயர்ப்பெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: வேண்டுதலுக்குச் செவிகொடுத்து
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘குரலைக் கேட்டார்’ என்றாலும், இச்சூழலில் இஸ்ரவேலின் வேண்டுதலைக் கேட்டு அதற்கு இணங்கினார் என்பதே பொருள்; நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: கானானியரை அவர்களிடம் ஒப்படைத்தார்
  rationale: נתן இங்கு எதிரியை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கிறது. எபிரெய ஒருமை இனப்பெயரின் கூட்டுப் பொருளை இயல்பான தமிழ் மரியாதைப் பன்மை வடிவம் வெளிப்படுத்துகிறது.
- source_word: וַיַּחֲרֵם
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  rationale: חרם என்பதன் சிறப்புப் பொருளான, மாற்ற முடியாதவாறு அழிவுக்கென்று ஒதுக்குதல் அல்லது அர்ப்பணித்தல் என்பதை வெறும் ‘அழித்தார்கள்’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: கானானியரையும் அவர்களுடைய நகரங்களையும்
  rationale: தமிழில் பிரதிப்பெயரின் குறிப்பு தெளிவாக இருக்க ‘அவர்களை’ என்பதற்குப் பதிலாக இனப்பெயர் மீண்டும் கூறப்படுகிறது; நகரங்கள் என்ற வழக்கமான பொருளும் காக்கப்படுகிறது.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: அந்த இடத்திற்கு ... என்று பெயரிடப்பட்டது
  rationale: எபிரெய வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. செயப்பாட்டு வடிவம் கடவுளா, இஸ்ரவேலா, வேறு யாரா என்று தேவையின்றித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: חָרְמָה
  choice: ஓர்மா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது; חרם உடனான சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: חרם சார்ந்த போரியல் சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள்; அழிவுத் தடையின் கீழ் வைத்தார்கள்
  rationale: இச்சொற்றொடர் வன்முறையை மென்மைப்படுத்தாமல், அதேவேளையில் חרם என்பதன் வழிபாட்டு-அர்ப்பணிப்பு சார்ந்த தனிச்சிறப்பையும் காக்கிறது. தொழில்நுட்பமான ஆனால் தமிழில் தெளிவில்லாத சொல்லை மட்டும் பயன்படுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டுதலுக்குச் செவிகொடுத்து’ என்பது எபிரெய மொழிமரபின் சூழற்பொருளைத் தருகிறது; ‘அழிவுக்கென்று அர்ப்பணித்தார்கள்’ என்பது חרם என்ற சொல்லின் கடுமையையும் தொழில்நுட்ப நுணுக்கத்தையும் ஒருங்கே காக்கிறது. இடப்பெயரின் சொற்பிறப்பியல் தொடர்பு [a] அடிக்குறிப்பில் தரப்பட்டுள்ளது.
