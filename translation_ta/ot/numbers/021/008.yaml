  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “நீ ஒரு நெருப்புப் பாம்பை[a] செய்து, அதை ஒரு கம்பத்தின்மேல்[b] வை. கடிபட்ட எவனும் அதைப் பார்க்கும்போது உயிர்வாழ்வான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “செராப்.” எபிரேயச் சொல் “எரிகிற ஒன்று” என்று பொருள்படலாம்; இச்சூழலில் அது கொடிய பாம்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கொடிக்கம்பம்” அல்லது “அடையாளக் கம்பம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரை பொதுவான நவீனத் தமிழ் ஒலிபெயர்ப்பில் தருகிறது; அதற்குப் பதிலாக ஒரு பட்டப்பெயரை இடாமல் மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: עֲשֵׂה לְךָ
  choice: நீ ... செய்து
  rationale: மோசே தனக்காகச் செய்ய வேண்டும் என்ற எபிரேய தாதிவுப் பயன்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘உனக்காக’ என்பதைச் சேர்ப்பது தவறாகத் தனிப்பட்ட பயன் என்ற எண்ணத்தைத் தரக்கூடும்.
- source_word: שָׂרָף
  choice: நெருப்புப் பாம்பு
  rationale: ‘எரிகிற ஒன்று’ என்ற சொல்லுருவகத்தைப் பாதுகாத்து, இச்சூழலில் அது பாம்பைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது; ‘விஷப்பாம்பு’ என்பது விளைவைக் கூறும் அதிக விளக்கமான மொழிபெயர்ப்பு.
- source_word: נֵס
  choice: கம்பம்
  rationale: இச்சூழலில் பாம்பின் உருவம் உயர்த்தி வைக்கப்படும் பொருளை இயல்பான தமிழில் குறிக்கிறது; ‘கொடிக்கம்பம்’ அல்லது ‘அடையாளக் கம்பம்’ என்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: הַנָּשׁוּךְ
  choice: கடிபட்ட எவனும்
  rationale: உறுப்புச் சொல்லுடன் வரும் செயப்பாட்டு வினையெச்சத்தின் பொதுப்படையான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְרָאָה אֹתוֹ
  choice: அதைப் பார்க்கும்போது
  rationale: பார்ப்பதே உயிர்வாழ்வதற்கான நிபந்தனையாக அமைவதைத் தமிழில் தெளிவாகக் காட்டுகிறது; வெறுமனே தற்செயலாகக் ‘காணுதல்’ என்ற பொருளைத் தவிர்க்கிறது.
- source_word: וָחָי
  choice: உயிர்வாழ்வான்
  rationale: பார்ப்பதன் விளைவாக அவன் வாழ்வான் என்ற எபிரேய வாக்கியத்தின் நேரடியான, உறுதியான பொருளை வழங்குகிறது.
theological_decisions:
- issue: שָׂרָף என்பதன் குறிப்பு மற்றும் உருவகம்
  choice: முதன்மைப் பாடத்தில் ‘நெருப்புப் பாம்பு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘செராப்’ அல்லது ‘விஷப்பாம்பு’
  rationale: இந்த நிகழ்வில் பாம்புகளால் ஏற்பட்ட தண்டனைக்குப் பதிலாக ஒரு பாம்பின் உருவம் செய்யப்படுகிறது. ‘நெருப்புப் பாம்பு’ என்பது எபிரேயச் சொல்லின் ‘எரிதல்’ உருவகத்தையும் பாம்பு என்ற சூழலையும் பாதுகாக்கிறது; ‘செராப்’ நவீன வாசகருக்குத் தெளிவற்றதுடன் வானுலக உயிரினம் என்ற பிற்காலத் தொடர்பையும் தேவையின்றி முன்வைக்கலாம்; ‘விஷப்பாம்பு’ பொருளை விளக்கினாலும் மூலத்தைவிட அதிகமாகப் பொருளுரைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி கட்டளையின் வலிமை காக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களின் உடனடியான பின்புறம் வைக்கப்பட்டுள்ளன.
