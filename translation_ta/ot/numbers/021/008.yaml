  source_fidelity: மூல எபிரேயத்தின் கட்டளை, ‘சராப்’ என்பதன் நெருப்பு/எரிதல் உருவகம், அதை நֵஸ் மீது வைப்பது, கடிபட்ட ஒவ்வொருவரும் அதைப் பார்ப்பதன் விளைவாக வாழ்வது ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. לְךָ-வின் மென்மையான தாதிவுப் பாங்கு தமிழில் வெளிப்படையாக இல்லாவிட்டாலும், இச்சூழலில் அது தனிப்பட்ட பயனை அவசியமாகக் குறிக்காததால் பொருளிழப்பு இல்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “கடிபட்ட எவனும் அதைப் பார்க்கும்போது உயிர்வாழ்வான்” என்பது பொதுப்பொருளை இயல்பாகத் தருகிறது. “கம்பத்தின்மேல்” என்பதும் புரியக்கூடிய இயல்பான பயன்பாடாகும்.
  terminology: யְהוָה-க்கு “யாவே” என்ற ஒலிபெயர்ப்பு திட்டத் தேர்வோடு ஒத்துள்ளது. שָׂרָף-க்கு “நெருப்புப் பாம்பு” என்பது சூழலுக்கு ஏற்றும் மூலத்தின் உருவகத்தைப் பாதுகாப்பதுமான தேர்வு. נֵס-க்கு “கம்பம்” பொருத்தமானது; மாற்றுச் சொற்பொருள்கள் அடிக்குறிப்பில் முறையாக உள்ளன.
