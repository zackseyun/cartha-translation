base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: ta
  text: மோசே ஒரு வெண்கலப் பாம்பை[a] செய்து, அதைக் கம்பத்தின்மேல்[b] வைத்தார். பாம்பு ஒருவனைக்[c] கடித்தபோது, அவன் அந்த வெண்கலப் பாம்பை[d] நோக்கிப் பார்த்து உயிர்வாழ்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செம்புப் பாம்பு’ என்றும் மொழிபெயர்க்கலாம். உலோகத்தைக் குறிக்கும் எபிரெயச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கம்பம்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘அடையாளக் கொடி’ அல்லது ‘கொடிக்கம்பம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘ஒரு மனிதன்’; இங்கு கடிக்கப்பட்ட எந்த நபரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: இந்த நிகழ்வு யோவான் 3:14–15 இல் உருவக முன்னடையாளமாக எடுத்துரைக்கப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: பாம்பு
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும் பொதுச் சொல்; உருவாக்கப்பட்ட பாம்பின் வடிவத்தையும் கடித்த உயிருள்ள பாம்பையும் சூழல் வேறுபடுத்துகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சூழலில் உலோகப் பொருளைக் குறிக்கும் எபிரெயச் சொல்லுக்கான வழக்கமான தமிழ் வேதாகமச் சொல்; அது செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַנֵּס
  choice: கம்பம்
  rationale: பாம்பின் உருவம் உயர்த்தி வைக்கப்பட்ட செங்குத்தான பொருளை இச்சூழலில் இயல்பாகக் குறிக்கிறது; ‘கொடி/கொடிக்கம்பம்’ என்ற சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וְהָיָה
  choice: கடித்தபோது
  rationale: அடுத்து விவரிக்கப்படும் தொடர்ச்சியான சூழ்நிலையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தனியான சொற்சொல் மொழிபெயர்ப்பு தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: பாம்பு ஒருவனைக் கடித்தபோது
  rationale: எபிரெயின் ஒருமை அமைப்பையும் பிரதிநிதித்துவ ஆண்பால் சொல்லையும் காக்கிறது; இது கடிக்கப்பட்ட எந்த நபரையும் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְהִבִּיט אֶל
  choice: நோக்கிப் பார்த்தால்
  rationale: אֶל என்பதன் திசைநோக்குப் பொருளையும் הִבִּיט என்பதன் பார்வைச் செயலையும் இயல்பான தமிழில் காக்கிறது; பின்னைய இறையியல் பொருளை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: וָחָי
  choice: உயிர்வாழ்ந்தான்
  rationale: பார்த்ததன் விளைவாகக் கடிக்கப்பட்டவர் உயிரோடு இருந்தார் என்ற நேரடியான பொருளைக் காக்கிறது; ‘குணமடைந்தான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
