base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: ta
  text: மோவாபே, உனக்கு ஐயோ! கேமோசின் மக்களான நீ அழிந்துபோனாய்! அவன் தன் மகன்களைத் தப்பியோடியவர்களாகவும், தன் மகள்களைச் சிறைப்பட்டவர்களாகவும் எமோரியரின் அரசனான சீகோனிடம் ஒப்படைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் தன் மகன்களை… தன் மகள்களை…’ என்பதற்குப் பதிலாக, பின்னொட்டுகள் கேமோசை அல்லாமல் மோவாபைக் குறிப்பதாகக் கொண்டு, ‘அதன் மகன்களைத் தப்பியோடியவர்களாகவும், அதன் மகள்களைச் சிறைப்பட்டவர்களாகவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: உனக்கு ஐயோ
  rationale: பேரழிவை அறிவிக்கும் புலம்பல் இடைச்சொல்லின் கவிதை வலிமையையும், மோவாபை நேரடியாக விளிக்கும் அமைப்பையும் காக்கிறது.
- source_word: אָבַדְתָּ
  choice: நீங்கள் அழிந்தீர்கள்
  rationale: אבד என்பதன் நிறைவுற்ற பேரழிவை நெருக்கமாக வெளிப்படுத்துகிறது; ஒருமை வடிவில் மோவாபிடம் தொடங்கிய உரை, அதன் மக்களை நோக்கிய இயல்பான தமிழ்ப் பன்மைக்கு மாறுகிறது.
- source_word: עַם כְּמוֹשׁ
  choice: கேமோசின் மக்களே
  rationale: கேமோசுக்குரிய அல்லது அவனோடு அடையாளப்படுத்தப்படும் மக்களைக் குறிக்கும் எபிரெயக் கட்டிணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: נָתַן
  choice: ஒப்படைத்தான்
  rationale: அடிப்படையான ‘கொடுத்தான்’ என்ற பொருளையும், தோல்வியால் எதிரி அரசனிடம் அகதிகளாகவும் சிறைப்பட்டவர்களாகவும் கையளிக்கப்பட்ட விளைவையும் இணைக்கிறது.
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: உடனடியான ஆண்பால் ஒருமை முன்னோடியான கேமோசைக் குறிக்கும் வாசிப்பைத் தக்கவைக்கிறது; தமிழில் எழுவாயைத் தெளிவுபடுத்த ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְּלֵיטִם
  choice: தப்பியோடுகிறவர்களாக
  rationale: தோல்வியிலிருந்து தப்பி ஓடுதல் என்ற சொல்லின் இயக்கத்தையும் நிலைமையையும் வெளிப்படுத்துகிறது.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: தன் மகள்களைச் சிறைப்பட்டவர்களாக
  rationale: ‘மகன்கள்—தப்பியோடுகிறவர்கள் / மகள்கள்—சிறைப்பட்டவர்கள்’ என்ற கவிதை இணைப்பைத் தமிழில் காக்கிறது.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: எமோரியரின் அரசனான சீகோனிடம்
  rationale: לְ என்பதன் இலக்கு அல்லது பெறுநர் பொருளையும், சீகோனை எமோரியரின் அரசன் என அடையாளப்படுத்தும் பின்னிணைப்பையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘அவன்/தன் மகன்கள், மகள்கள்’ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுகளின் குறிப்பு
  choice: 'அவை கேமோசைக் குறிக்கின்றன: ‘அவன் தன் மகன்களை… தன் மகள்களை…’'
  alternative: 'அவை மோவாபை ஒட்டுமொத்தமாகக் குறிக்கலாம்: ‘அதன் மகன்களை… அதன் மகள்களை…’'
  rationale: உடனடி முன்னோடி கேமோசு என்பதால் ஆண்பால் ஒருமைக் குறிப்பை முதன்மை உரையில் காப்பது இயல்பானது. இருப்பினும், மோவாபின் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது; இதனால் கவிதையின் உண்மையான தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பல்-ஏளனப் பாடலின் கண்ணியமான கவிதை வலிமை காக்கப்பட்டுள்ளது. ‘கேமோசு,’ ‘சீகோன்,’ ‘எமோரியர்’ ஆகிய பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளன; உண்மையான குறிப்பு ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
