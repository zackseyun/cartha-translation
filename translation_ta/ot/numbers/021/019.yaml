translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலின் சுருக்கத்தைப் பேணியபடியே இயல்பான வாக்கியமாக அமைக்க ‘சென்றார்கள்’ சேர்க்கப்பட்டது. இடப்பெயர்கள் தமிழில் எளிதாக வாசிக்கக்கூடிய வடிவில் ஒலிபெயர்க்கப்பட்டன. அடிக்குறிப்பு குறி அது விளக்கும் ‘பாமோத்’ என்பதற்குப் பின் வைக்கப்பட்டது.
