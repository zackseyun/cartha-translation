revisions:
- from: மத்தானாவிலிருந்து நகலியேலுக்கும், நகலியேலிலிருந்து பாமோத்துக்கும்[a] சென்றார்கள்.
  to: மத்தானாவிலிருந்து நஹலியேலுக்கு, நஹலியேலிலிருந்து பாமோத்துக்கு[a].
  rationale: The revision removes the unsupported finite verb and preserves the Hebrew’s compact itinerary style, while retaining the naturally supplied Tamil destination marking. It also adjusts the transliteration of Nahaliel to reflect the Hebrew h consonant. The footnote anchor remains immediately after “பாமோத்,” and the lexical-alternative footnote is retained.
