  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: ta
  text: மத்தானாவிலிருந்து நஹலியேலுக்கு, நஹலியேலிலிருந்து பாமோத்துக்கு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “பாமோத்” என்பது “மேடுகள்” அல்லது “உயர்ந்த இடங்கள்” என்றும் பொருள்படலாம்; ஆனால் இங்கு இஸ்ரவேலரின் பயணப் பட்டியலில் வரும் ஓர் இடத்தின் பெயராகப் புரிந்துகொள்வதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: மத்தானாவிலிருந்து
  rationale: וּ என்பது பயண இடங்களின் தொடர்ச்சியை இணைக்கிறது; מִן என்பது ‘இருந்து’ என மொழிபெயர்க்கப்படுகிறது. மַתָּנָה இங்கு இடப்பெயர் என்பதால் ‘மத்தானா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: נַחֲלִיאֵל
  choice: நகலியேலுக்கும்
  rationale: எபிரெய மூலத்தில் இதற்கு முன் திசையைக் குறிக்கும் முன்னிடைச்சொல் இல்லாவிட்டாலும், பயணப் பட்டியலின் சுருக்கமான நடையில் அடுத்த இடத்துக்குச் செல்வது உள்ளடங்கியுள்ளது. இயல்பான தமிழுக்காக ‘-க்கும்’ சேர்க்கப்பட்டது; பெயர் இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: நகலியேலிலிருந்து
  rationale: וּ தொடர்ச்சியை இணைக்கிறது; מִן ‘இருந்து’ என்ற பொருளைத் தருகிறது. இடப்பெயர் முந்தைய இடத்தில் இருந்ததுபோலவே ஒரே முறையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּמוֹת
  choice: பாமோத்துக்கும்
  rationale: இந்தப் பயணப் பட்டியலில் בָּמוֹת ஓர் இடப்பெயராகச் செயல்படுவதால் ‘பாமோத்’ என ஒலிபெயர்க்கப்பட்டது. தமிழில் பயணத்தின் இலக்கைத் தெளிவாக்க ‘-க்கும்’ சேர்க்கப்பட்டது; ‘மேடுகள்’ அல்லது ‘உயர்ந்த இடங்கள்’ என்ற சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
