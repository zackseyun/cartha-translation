language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: ta
  text: ஆகையால் யாவே மக்களிடையே எரியும் பாம்புகளை[a] அனுப்பினார். அவை மக்களைக் கடித்தன; இஸ்ரவேலரில் பலர் இறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விஷப்பாம்புகளை” அல்லது “எரிச்சலூட்டும் பாம்புகளை.” எபிரெயத்தில் சொற்சொல்லாக, “பாம்புகளை—எரிபவற்றை” என்று உள்ளது.
    reason: הַשְּׂרָפִים என்பதன் உருவகப் பொருள் பாம்புகளின் ‘எரியும்’ தன்மையையோ அவற்றின் கடியால் ஏற்படும் எரிச்சலையோ குறிக்கக்கூடும் என்பதால் மாற்று மொழிபெயர்ப்புகள் தரப்பட்டுள்ளன.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் நேரடியான கதைநடைப் பொருள் ‘அனுப்பினார்’; எழுவாயான யாவேக்கு ஏற்ற மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בָּעָם
  choice: மக்களிடையே
  rationale: ב இங்கு பாம்புகள் அனுப்பப்பட்ட இடத்தைச் சுட்டும் வகையில் ‘மக்களிடையே’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘மக்களுக்கு எதிராக’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: எரியும் பாம்புகள்
  rationale: நேரடியாக ‘பாம்புகள், எரிபவை’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; இது பாம்புகளின் தோற்றத்தையோ கடியின் எரிச்சலையோ குறிக்கலாம் என்பதால் ‘விஷப்பாம்புகள்’ என்று மட்டும் தீர்மானிக்கவில்லை.
- source_word: וַיְנַשְּׁכוּ
  choice: கடித்தன
  rationale: נשׁך என்பதன் அடிப்படைப் பொருள் ‘கடி’; பாம்புகளைச் சுட்டுவதால் அஃறிணைப் பன்மை இயல்பாக உள்ளது.
- source_word: וַיָּמָת
  choice: இறந்தார்கள்
  rationale: מות என்பதன் நேரடியான பொருளான ‘இறத்தல்’ தெளிவாக வழங்கப்பட்டுள்ளது; மனிதர்களைக் குறிக்கும் மரியாதை/உயர்திணை பன்மை நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலரில் பலர்
  rationale: מן என்பதன் ‘அவர்களுள் இருந்து/அவர்களில்’ என்ற பகுதியுணர்வையும், עַם רָב என்பதன் ‘பலர்’ என்ற எண்ணத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பதைக் காட்டிலும் எபிரெய உச்சரிப்புக்கான பரவலான ஆய்வறிஞர் மறுகட்டமைப்பை நெருங்குகிறது.
- issue: הַשְּׂרָפִים என்பதன் பொருள்
  choice: எரியும் பாம்புகள்
  alternative: விஷப்பாம்புகள் / எரிச்சலூட்டும் பாம்புகள்
  rationale: கடித்ததால் ஏற்பட்ட எரிச்சல் அல்லது பாம்புகளின் தன்மை ஆகியவற்றில் ஒன்றை மட்டும் உறுதிப்படுத்தாமல், மூலத்தின் உருவகத்தையும் பொருள் நெகிழ்வையும் பிரதான உரையில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் நடை. ‘ஆகையால்’ முந்தைய நிகழ்வின் விளைவைக் காட்டுகிறது. குறுகிய எபிரெய கதைத் தொடரை தமிழில் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைத்தாலும் நிகழ்வுகளின் வரிசை மாற்றப்படவில்லை.
