base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் புறப்பட்டு, எமோரியரின் எல்லையிலிருந்து நீண்டுசெல்லும்[b] வனாந்தரத்தில், அர்னோனின் மறுபுறத்தில்[a] முகாமிட்டார்கள். ஏனெனில் அர்னோன் மோவாபுக்கும் எமோரியருக்கும் இடையிலுள்ள மோவாபின் எல்லையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்னோனுக்கு அப்பால்.” எபிரெயச் சொற்றொடர் பார்வைக் கோணத்தைப் பொறுத்து மறுபுறத்தையோ அல்லது ஒரு எல்லைக்கு அப்பாலுள்ள பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “எமோரியரின் எல்லையிலிருந்து வெளியேசெல்லும்.” இங்கு வனாந்தரம் எமோரியரின் எல்லையிலிருந்து விரிந்துசெல்கிறது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து புறப்பட்டதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: נָסָעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: பயணக் கதைகளில் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: தங்குவதற்காக முகாம் அமைத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: அர்னோனின் மறுபுறத்தில்
  rationale: עֵבֶר என்பதன் பார்வைநிலையைச் சார்ந்த ‘அப்பால்/மறுபுறம்’ என்ற இடப்பொருளைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: வனாந்தரத்தில் உள்ள
  rationale: முகாமிட்ட இடத்தைச் சுட்டும் தொடர்புத் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: எமோரியரின் எல்லையிலிருந்து நீண்டுசெல்லும்
  rationale: יצא என்ற சொல்லின் நேரடியான ‘வெளியே செல்கிறது’ என்ற உருவகத்தை, புவியியல் பரப்பைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: இரு இடங்களிலும் நிலப்பரப்புகளைப் பிரிக்கும் எல்லையைக் குறிக்கும் தெளிவான தமிழ் சொல்.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இங்கு மக்கள் குழுவைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறிய புவியியல் குறிப்பை விளக்கும் காரணத் தொடரை வெளிப்படுத்துகிறது.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: அர்னோன் ... மோவாபின் எல்லையாக இருந்தது
  rationale: வினையற்ற எபிரெய வாக்கியத்தைச் சூழலுக்கேற்ற இறந்தகாலத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: மோவாபுக்கும் எமோரியருக்கும் இடையிலுள்ள
  rationale: மீண்டும் வரும் בֵּין அமைப்பு சுட்டும் இரு தரப்புகளுக்கிடையேயான பிரிவைத் தெளிவாகக் காட்டுகிறது.
