base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: ta
  text: 'ஆகையால், யாவேயின் போர்களின் நூலில் இவ்வாறு சொல்லப்படுகிறது: “சூபாவில் உள்ள வாஹேப்[a][b], அர்னோனின் வறண்ட ஓடைகள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மேற்கோளாகக் கொடுக்கப்பட்டுள்ள இந்த எபிரெய வரி தெளிவற்றது. “வாஹேப்” என்பதை ஊர்ப்பெயராக அல்லாமல், ஒரு வினைத் தொடரின் பகுதியாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: “சூபாவில்” என்பதற்குப் பதிலாக, சூபா என்பதைப் பொதுப்பெயராக எடுத்தால் “புயலில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: மேற்கூறியவற்றிலிருந்து முடிவை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் தொடர்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֵאָמַר
  choice: இவ்வாறு சொல்லப்படுகிறது
  rationale: אמר என்பதன் நிபால் வடிவம் இங்கு ஒரு மேற்கோளை அறிமுகப்படுத்தும் ஆளற்ற வினையாக வருகிறது; தமிழிலும் செயப்பாட்டு வடிவம் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: யாவேயின் போர்களைப் பற்றிய நூலில்
  rationale: அறியப்பட்ட எழுத்து மூலத்தைக் குறிக்கும் தலைப்பை இயல்பான தமிழில் தருகிறது; מִלְחֲמֹת என்ற பன்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת וָהֵב
  choice: வாகேப்
  rationale: மிகவும் தெளிவற்ற இந்தக் கவிதை வரியில் וָהֵב என்பதை ஊர்ப்பெயராகக் கொள்வது தேவையற்ற ஊக விளக்கத்தைத் தவிர்க்கிறது; வேறு இலக்கணப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּסוּפָה
  choice: சூபாவில் உள்ள
  rationale: סוּפָה என்பதை ஊர்ப்பெயராக ஒலிபெயர்த்து, בְּ முன்னிடைச்சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘புயலில்’ என்ற பொதுப்பெயர்ப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶת הַנְּחָלִים אַרְנוֹן
  choice: அர்னோனின் ஓடைப் பள்ளத்தாக்குகள்
  rationale: נחל என்பது இப்புவியியல் சூழலில் நீரோடும் பள்ளத்தாக்கு அல்லது பருவகால நீர்வழியைக் குறிக்கலாம். ‘ஓடைப் பள்ளத்தாக்குகள்’ என்பது தமிழில் புரியக்கூடியதாகவும், வெறும் ‘பள்ளத்தாக்குகள்’ என்பதைவிட துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர் நூலின் தலைப்பில் இடம்பெறுகிறது. பட்டப்பெயரைப் பதிலிடாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. பழங்கால நூலின் துண்டான, பொருள் தெளிவற்ற கவிதை மேற்கோள் செயற்கையாக முழுமைப்படுத்தப்படாமல் காக்கப்பட்டுள்ளது; வாசிப்பிற்கு உதவ ‘உள்ள’ மட்டும் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையில் தொடர்புடைய ‘வாகேப்’ அருகில் வைக்கப்பட்டுள்ளன.
