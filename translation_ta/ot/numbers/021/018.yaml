source:
  edition: WLC
  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: ta
  text: 'தலைவர்கள் தோண்டிய,

    மக்களின் பிரமுகர்கள் ஆட்சிக்கோலாலும்[a]

    தங்கள் கோல்களாலும் அகழ்ந்த கிணறு.

    பின்பு அவர்கள் வனாந்தரத்திலிருந்து மத்தானாவுக்குப் போனார்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆட்சிக்கோலால்’ என்பதற்குப் பதிலாக, இச்சொல்லை ஒரு நபரைக் குறிப்பதாக எடுத்தால், ‘சட்டமியற்றுபவரால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘வனாந்தரத்திலிருந்து மத்தானா’ என்று மட்டுமே உள்ளது; பயணத் தொடரைக் கருத்தில் கொண்டு ‘மத்தானாவுக்குப் போனார்கள்’ என்று பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: கிணறு
  rationale: முந்தைய வசனத்தில் பாடப்பட்ட குறிப்பிட்ட கிணற்றையே இச்சொல் குறிக்கிறது; தமிழில் கவிதைத் தொடரில் தனியாக ‘கிணறு’ என்பது இயல்பாக உள்ளது.
- source_word: חֲפָרוּהָ
  choice: தோண்டிய
  rationale: חפר என்பதன் அடிப்படைப் பொருள் ‘தோண்டு’; பெண்பால் ஒருமை பின்னொட்டு கிணற்றைக் குறிக்கிறது.
- source_word: שָׂרִים
  choice: தலைவர்கள்
  rationale: உயர்நிலை சமூக-அரசியல் தலைவர்களைக் குறிக்கும் சொல்; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כָּרוּהָ
  choice: அகழ்ந்தெடுத்த
  rationale: இணைவரியில் வரும் இரண்டாவது தோண்டுதல் வினைச்சொல்லின் வேறுபாட்டைக் காத்து, கிணற்றை உருவாக்க அகழ்ந்த செயலை வெளிப்படுத்துகிறது.
- source_word: נְדִיבֵי הָעָם
  choice: மக்களின் பிரமுகர்கள்
  rationale: שָׂרִים என்பதுடன் இணையாக இங்கு உயர்நிலையினரையோ மதிப்புக்குரியோரையோ குறிக்கிறது; ‘பிரமுகர்கள்’ அந்த சமூக நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּמְחֹקֵק
  choice: ஆட்சிக்கோலால்
  rationale: ‘தங்கள் கோல்களால்’ என்ற இணைச்சொற்றொடர், ஆட்சியைக் குறிக்கும் கோல் அல்லது செங்கோல் போன்ற கருவியைச் சுட்டும் பொருளை ஆதரிக்கிறது.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: தங்கள் கோல்களால்
  rationale: மூலச்சொல் தாங்குகோல் அல்லது கைத்தடியைக் குறிக்கும்; இங்கு பன்மையில் பொதுவான ‘கோல்கள்’ இயல்பானது.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: பின்பு அவர்கள் வனாந்தரத்திலிருந்து மத்தானாவுக்குப் போனார்கள்
  rationale: அடுத்தடுத்த பயண இடங்களின் பட்டியலைத் தொடங்கும் சுருக்கமான எபிரெய சொற்றொடரைத் தமிழில் முழுமையான, இயல்பான பயண வாக்கியமாக வழங்குகிறது; ‘மத்தானா’ இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: בִּמְחֹקֵק என்பதன் பொருள்
  choice: கருவியைக் குறிக்கும் ‘ஆட்சிக்கோலால்’
  alternative: ஒரு நபரைக் குறிக்கும் ‘சட்டமளிப்பவரால்’
  rationale: அடுத்துள்ள ‘தங்கள் கோல்களால்’ என்ற இணை அமைப்பு கருவிப் பொருளை வலுவாக ஆதரிக்கிறது; இருப்பினும் நபரைக் குறிக்கும் பொருளும் மூலச்சொல்லில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: וּמִמִּדְבָּר מַתָּנָה என்பதன் சுருக்கமான அமைப்பு
  choice: பயண மாற்றமாக ‘வனாந்தரத்திலிருந்து மத்தானாவுக்குப் போனார்கள்’
  alternative: சொல்லுக்குச் சொல் ‘வனாந்தரத்திலிருந்து மத்தானா’
  rationale: எண்ணாகமம் 21:18–20 தொடர்ச்சியான பயண நிலைகளைப் பட்டியலிடுகிறது. தமிழில் தேவையான வினையையும் திசை வேற்றுமையையும் சேர்ப்பது சூழலின் பொருளைத் தெளிவாக்குகிறது; மூலத்தின் சுருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடல் வரிகளின் இணை அமைப்பையும் உயர்ந்த ஆனால் எளிதில் புரியும் நடையையும் காக்கிறது. அடுத்த பயணப் பகுதி உரைநடை வாக்கியமாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
