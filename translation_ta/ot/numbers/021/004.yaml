  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதும் கண்ணியமானதுமான நடை. எபிரெயப் பயணவிவரத்தின் வரிசையும் நோக்க அமைப்பும் காக்கப்பட்டுள்ளன; קצר נפש என்ற மரபுத்தொடரின் உண்மையான பொருள் பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
