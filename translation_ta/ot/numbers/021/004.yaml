  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: ta
  text: பின்பு அவர்கள் ஹோர் மலையிலிருந்து, ஏதோம் நாட்டைச் சுற்றிச் செல்வதற்காகச் செங்கடல் வழியாகப் புறப்பட்டார்கள்.[a] வழியில் மக்கள் பொறுமையிழந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நாணல் கடலை நோக்கிய வழியாக.” எபிரெயம்: யாம் சூஃப்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழியில் மக்கள் மனந்தளர்ந்தார்கள்” அல்லது “மனச்சோர்வடைந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: வனாந்தரப் பயணப் பட்டியல்களில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டார்கள்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: מֵהֹר הָהָר
  choice: ஓர் மலையிலிருந்து
  rationale: הֹר הָהָר என்ற இடப்பெயரின் வழக்கமான தமிழ் வடிவமாக ‘ஓர் மலை’ பயன்படுத்தப்படுகிறது.
- source_word: דֶּרֶךְ יַם סוּף
  choice: செங்கடல் வழியாக
  rationale: דֶּרֶךְ என்பது இங்கு பயணப் பாதையைக் குறிக்கிறது. יַם־סוּף என்பதற்கு மரபுவழி மொழிபெயர்ப்பான ‘செங்கடல்’ முதன்மை உரையில் வைக்கப்பட்டு, ‘நாணற்கடல்’ என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִסְבֹב
  choice: சுற்றிச் செல்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்ச வடிவம்; ஏதோம் நாட்டை விலக்கிச் சுற்றிச் செல்லும் பயண நோக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டை
  rationale: אֶרֶץ என்பது இங்கு ஏதோமின் நாடு அல்லது நிலப்பரப்பைக் குறிக்கிறது; ‘ஏதோம் நாடு’ தெளிவான நவீனத் தமிழ்.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: மக்களுக்குப் பொறுமை குன்றியது
  rationale: ‘உயிர்/மனம் குறுகியது’ என்ற எபிரெய மரபுத்தொடர் பொறுமையின்மை, மனச்சோர்வு அல்லது மனந்தளர்வைக் குறிக்கலாம். முதன்மைச் சூழலில் ‘பொறுமை குன்றியது’ இயல்பானது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: בְּ முன்னிடைச்சொல்லின் நேரடியான இடப்பொருளைத் தக்கவைக்கிறது; பயணப்பாதையினால் என்ற காரண நிழற்பொருளும் இருக்கக்கூடும்.
