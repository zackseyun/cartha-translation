source:
  edition: WLC
  text: אָ֚ז יָשִׁ֣יר יִשְׂרָאֵ֔ל אֶת הַ/שִּׁירָ֖ה הַ/זֹּ֑את עֲלִ֥י בְאֵ֖ר עֱנוּ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: ta
  text: 'அப்போது இஸ்ரவேல் இந்தப் பாடலைப் பாடியது:


    “கிணறே, பொங்கி எழு![a]


    அதற்குப் பதிலளியுங்கள்!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லுக்குச் சொல்லாக, “கிணறே, மேலே எழு!” எபிரெயத்தில் “பதிலளியுங்கள்” என்பதற்கு மறுமொழியாக அல்லது மாறிமாறிப் பாடும் அழைப்பாகிய நுட்பமும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த செயலை அறிமுகப்படுத்தும் இயல்பான கால இணைப்புச் சொல்.
- source_word: יָשִׁיר
  choice: பாடியது
  rationale: வடிவத்தில் முற்றுப்பெறாத வினையாக இருந்தாலும், אָז உடன் இங்கு கடந்தகாலக் கதைச் செயலாகப் பயன்படுகிறது; ‘இஸ்ரவேல்’ என்ற மக்கள் பெயருக்கேற்ற ஒருமை வினை வடிவம் வைக்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மக்களைக் குறிக்கும் மரபான தமிழ் வேதாகமப் பெயர்ப்பு.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடலை
  rationale: சுட்டுப்பெயருடன் வரும் வரையறுக்கப்பட்ட பெயர்ச்சொல்லை இயல்பாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: עֲלִי
  choice: பொங்கி எழு
  rationale: கிணற்றை நோக்கிய பெண்பால் ஒருமை ஏவல்; நீர் மேலெழும் சூழலைத் தமிழில் உயிரோட்டமாக வெளிப்படுத்துகிறது. அடிப்படைப் பொருளான ‘மேலே எழு’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְאֵר
  choice: கிணறே
  rationale: நேரடி விளியைத் தமிழ் விளிவேற்றுமை இயல்பாகக் குறிக்கிறது.
- source_word: עֱנוּ לָהּ
  choice: அதற்குப் பதிலளித்துப் பாடுங்கள்
  rationale: ענה என்பதன் ‘பதிலளி’ என்ற மையப் பொருளையும், பாடல் சூழலில் இருக்கக்கூடிய மறுமொழிப் பாடல் நுட்பத்தையும் இணைத்துப் பாதுகாக்கிறது; வெறுமனே ‘பாடுங்கள்’ என்று மொழிபெயர்த்து வினையின் உண்மையான தெளிவின்மையை நீக்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. ‘கிணறே’ மற்றும் ‘பொங்கி எழு’ நேரடி அழைப்பின் கவித்துவத்தைத் தக்கவைக்கின்றன; ‘பதிலளித்துப் பாடுங்கள்’ எபிரெயச் சொல்லின் பதில்/மறுமொழி நுட்பத்தை வெளிப்படையாகக் காக்கிறது.
