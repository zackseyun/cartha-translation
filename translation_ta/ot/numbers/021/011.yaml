  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: ta
  text: அவர்கள் ஓபோத்திலிருந்து புறப்பட்டு, மோவாபுக்கு எதிரே, சூரியன் உதிக்கும் திசையில் உள்ள பாலைநிலத்திலுள்ள ஈயே-அபாரீமில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஈயே-அபாரீம்” என்பதைச் சொல்லார்ந்த பொருளில் “அபாரீமின் பாழிடங்கள்” அல்லது “அபாரீமின் இடிபாடுக் குவியல்கள்” என்றும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு அது ஓர் இடப்பெயராக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியல்களில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இதை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מֵאֹבֹת
  choice: ஓபோத்திலிருந்து
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழ் ஒலிப்பெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் நேரடியான பொருள் முகாமிடுதல்; நவீனத் தமிழில் தெளிவான இயல்பான வடிவம்.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: ஈயே-அபாரீமில்
  rationale: பயணப் பட்டியலில் இது இடப்பெயராகச் செயல்படுவதால் ஒலிப்பெயர்ப்பு செய்யப்பட்டுள்ளது; அதன் சொல்லார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட பாலை அல்லது மேய்ச்சல் நிலத்தைக் குறிக்கலாம்; இச்சூழலில் ‘பாலைநிலம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: மோவாபுக்கு எதிரே உள்ள
  rationale: புவியியல் விளக்கத்தில் עַל־פְּנֵי என்பது ‘எதிரே’ அல்லது ‘முகமாக’ என்ற இடவுறவைக் குறிக்கிறது.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையில்
  rationale: எபிரெயச் சொற்றொடரின் ‘சூரிய உதயம்’ என்ற உருவகத்தைப் பாதுகாத்தபடி, மோவாபின் கிழக்குப் பக்கத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்.
