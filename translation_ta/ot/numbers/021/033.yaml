  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: ta
  text: பின்பு அவர்கள் திரும்பி, பாசானுக்குச் செல்லும் வழியாக ஏறிச் சென்றார்கள். அப்போது பாசானின் அரசன் ஓகு, தன் மக்கள் அனைவரோடும் எத்ரேயியில் போரிடுவதற்காக அவர்களை எதிர்கொள்ள[a]ப் புறப்பட்டு வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களைச் சந்திக்க” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் தனியாகப் பார்க்கும்போது நடுநிலையான சந்திப்பையும் குறிக்கலாம்; ஆனால் இங்கு தொடர்ந்து வரும் “போரிடுவதற்காக” என்பது பகைமையான எதிர்கொள்ளுதலைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: அவர்கள் திரும்பி
  rationale: פנה இங்கு பயணத் திசை மாறியதைச் சுட்டுகிறது; நவீனத் தமிழில் “திரும்பி” இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய அல்லது நிலவியல் சார்ந்த இயக்கத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: பாசானுக்குச் செல்லும் வழியாக
  rationale: דרך உடன் வரும் இடப்பெயர் அந்தப் பகுதிக்குச் செல்லும் பாதையையோ வழித்தடத்தையையோ குறிக்கலாம்; இத்தேர்வு தமிழில் இயல்பாக உள்ளது.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசன் ஓகு
  rationale: பெயரையும் ஆட்சிப் பட்டத்தையும் இயல்பான தமிழ் சொல் வரிசையில் வழங்குகிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு வந்தான்
  rationale: יצא என்பதன் ‘வெளியே புறப்படுதல்’ என்ற கூறையும், எதிரே வருதல் என்ற கதைநிலைக் கண்ணோட்டத்தையும் இணைத்துப் பாதுகாக்கிறது; ‘படையெடுத்து வந்தான்’ என்று மிகையாக விளக்கவில்லை.
- source_word: לִקְרָאתָם
  choice: அவர்களை எதிர்கொள்ள
  rationale: இந்தச் சொற்றொடர் அடிப்படையில் சந்திக்க அல்லது எதிர்கொள்ளச் செல்வதைக் குறிக்கிறது; தொடர்ந்து வரும் போர்ச் சூழலில் “எதிர்கொள்ள” பொருத்தமானது, ஆனாலும் மூலத்தின் சாத்தியமான நடுநிலைத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: தன் மக்கள் அனைவரோடும்
  rationale: עַם என்பதை ‘படை’ என்று குறுக்காமல், மூலத்தின் பொதுவான ‘மக்கள்’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிடுவதற்காக
  rationale: לַמִּלְחָמָה குறிக்கும் நோக்கத்தை இயல்பான வினைமுறைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶדְרֶעִי
  choice: எத்ரேயியில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, போரின் நிகழ்விடத்தைக் குறிக்கும் வகையில் இடவேற்றுமை உருபுடன் வழங்குகிறது.
