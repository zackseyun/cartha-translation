  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: ta
  text: 'ஆகையால், பாடலியற்றுவோர்[a] கூறுகிறார்கள்:

    “எஸ்போனுக்கு வாருங்கள்;

    சீகோனின் நகரம் கட்டப்பட்டு நிலைநிறுத்தப்படட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழமொழி கூறுவோர்,” “பாணர்கள்”; மரபுவழியாக, “ஆட்சியாளர்கள்.” இங்குள்ள எபிரெயச் சொல் அரசியல் ஆட்சியாளர்களை அல்லாமல், பழமொழி அல்லது பாடல் வடிவிலான கூற்றை இயற்றுவோரையோ உரைப்போரையோ குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்விலிருந்து வரும் விளக்கம் அல்லது முடிவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: יֹאמְרוּ
  choice: கூறுகிறார்கள்
  rationale: இங்கு மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான அல்லது பொதுநிகழ்காலப் பயன்பாட்டை வெளிப்படுத்துகிறது.
- source_word: הַמֹּשְׁלִים
  choice: பாடலியற்றுவோர்
  rationale: இந்தச் சூழலில் அரசாளுவோரைக் காட்டிலும் பழமொழி அல்லது ஏளனப்பாடல் போன்ற செய்யுள்களை இயற்றி உரைப்போரையே குறிக்கும். ‘பாடலியற்றுவோர்’ என்பது அந்தச் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது; சொல்லின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בֹּאוּ
  choice: வாருங்கள்
  rationale: பன்மை முன்னிலை ஏவலை மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழில் தருகிறது.
- source_word: חֶשְׁבּוֹן
  choice: எஸ்போன்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּבָּנֶה
  choice: கட்டப்படட்டும்
  rationale: கவிதை மேற்கோளிலுள்ள விருப்பம் அல்லது அழைப்புத் தன்மையைத் தமிழ் ஏவல் வடிவில் காக்கிறது.
- source_word: וְתִכּוֹנֵן
  choice: நிலைநிறுத்தப்படட்டும்
  rationale: கட்டப்படுதல் என்பதற்கு இணையான கவிதைச் சமநிலையைப் பேணியபடி உறுதியாக நிறுவப்படுதல் என்ற பொருளைத் தருகிறது.
- source_word: עִיר סִיחוֹן
  choice: சீகோனின் நகரம்
  rationale: எபிரெய உரிமைத் தொடர்பைத் தெளிவான, இயல்பான தமிழில் காட்டுகிறது.
