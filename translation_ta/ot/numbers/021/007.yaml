source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: ta
  text: அப்போது மக்கள் மோசேயிடம் வந்து, “நாங்கள் பாவம் செய்தோம்; ஏனெனில் யாவேக்கு எதிராகவும் உமக்கு எதிராகவும் பேசினோம். எங்களிடமிருந்து பாம்பை அகற்றும்படி யாவேயிடம் மன்றாடும்” என்றார்கள். ஆகவே மோசே மக்களுக்காக மன்றாடினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: அப்போது மக்கள் ... வந்து
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: חָטָאנוּ
  choice: நாங்கள் பாவம் செய்தோம்
  rationale: முடிந்த செயலையும் தற்போதைய குற்றஒப்புதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: யாவேக்கு எதிராகவும் உமக்கு எதிராகவும் பேசினோம்
  rationale: דבר + ב இங்கு பகைமையான அல்லது எதிரான பேச்சைக் குறிக்கிறது; இரு பொருட்களுடனும் ‘எதிராக’ என்பதைத் திரும்பச் சொல்வது இணைப்பைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைப் பெயரைப் பெயராகவே காக்கிறது.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: யாவேயிடம் மன்றாடும்
  rationale: வேண்டுதல் மற்றும் பரிந்துபேசுதல் ஆகிய சூழல்சார் நுணுக்கத்தை ‘மன்றாடு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: எங்களிடமிருந்து ... அகற்றும்படி
  rationale: கட்டளைக்குப் பின் வரும் வேண்டுகோளின் நோக்கம் அல்லது உள்ளடக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֶת הַנָּחָשׁ
  choice: இந்தப் பாம்பை
  rationale: எபிரெயச் சொல் ஒருமையில் உள்ளது; ‘இந்த’ என்பது சூழலில் அவர்களைத் தாக்கும் அறியப்பட்ட பாம்பு ஆபத்தைச் சுட்டுகிறது. ஒருமையின் கூட்டுப்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: ஆகவே மோசே மக்களுக்காக மன்றாடினார்
  rationale: בְּעַד குறிக்கும் பிறருக்கான பரிந்துவேண்டுதலை ‘மக்களுக்காக மன்றாடினார்’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: ஒருமை הַנָּחָשׁ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ஒருமை; அடிக்குறிப்பில் கூட்டுப்பொருள் சாத்தியம்
  alternative: பாம்புகளை
  rationale: எபிரெய வடிவத்தைப் பாதுகாத்தபடியே, அது பாம்புகளின் தொல்லையை மொத்தமாகக் குறிக்கக்கூடும் என்ற உண்மையான தெளிவின்மையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. மோசேயை நோக்கிய மரியாதை ஒருமையாக ‘உமக்கு’, ‘மன்றாடும்’ பயன்படுத்தப்பட்டுள்ளது.
