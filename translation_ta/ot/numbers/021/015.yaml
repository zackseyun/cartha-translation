  to: மேலும், ஆர் அமைந்துள்ள இடம்வரை[b] நீண்டு, மோவாபின் எல்லையை ஒட்டி சாய்ந்திருக்கும் பள்ளத்தாக்குகளின்[a] சரிவு.
