source:
  edition: WLC
  text: וְ/אֶ֨שֶׁד֙ הַ/נְּחָלִ֔ים אֲשֶׁ֥ר נָטָ֖ה לְ/שֶׁ֣בֶת עָ֑ר וְ/נִשְׁעַ֖ן לִ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: ta
  text: மேலும், ஆர் அமைந்துள்ள இடம்வரை[b] நீண்டு, மோவாபின் எல்லையை ஒட்டி சாய்ந்திருக்கும் பள்ளத்தாக்குகளின்[a] சரிவு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பருவகால நீரோடைப் படுகைகளின்” அல்லது “பள்ளங்களின்.” எபிரெயச் சொல் பெரும்பாலும் மழைக்காலத்தில் மட்டும் நீர் ஓடும் ஓடைப் படுகைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆர் அமைந்துள்ள இடம்வரை” என்பதற்குப் பதிலாக, “ஆரின் குடியிருப்புவரை” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் கடினமானது; அது ஆரின் இருப்பிடத்தையோ குடியிருப்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: சரிவு
  rationale: இது பள்ளத்தாக்கு அல்லது நீரோடையின் ஓரத்திலுள்ள இறக்கமான நிலப்பரப்பைக் குறிக்கிறது; புவியியல் சூழலில் ‘சரிவு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַנְּחָלִים
  choice: பள்ளத்தாக்குகள்
  rationale: נחל என்பது பருவகாலத்தில் நீர் ஓடும் ஓடைப் படுகை அல்லது அதனுடன் சேர்ந்த பள்ளத்தாக்கைக் குறிக்கலாம். ‘பள்ளத்தாக்குகள்’ பொதுவான வாசகருக்குப் புரியும் இயல்பான சொல்; குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר נָטָה
  choice: நீண்டு
  rationale: נטה என்பதன் ‘நீளுதல், விரிதல், சாய்தல்’ என்ற இடவியல் பொருளை இங்கு ‘நீண்டு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְשֶׁבֶת עָר
  choice: ஆர் அமைந்துள்ள இடம்வரை
  rationale: கடினமான இத்தொடர் ஆரின் இருப்பிடம் அல்லது குடியிருப்பைக் குறிக்கலாம். புவியியல் விளக்கத்தில் இடத்தைக் குறிக்கும் வாசிப்பை முதன்மை உரையில் இயல்பாகத் தருகிறது; ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָר
  choice: ஆர்
  rationale: இது ஓர் இடப்பெயர்; தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְנִשְׁעַן
  choice: சார்ந்திருக்கும்
  rationale: שען என்பதன் அடிப்படைப் பொருள் ‘சாய்ந்திருத்தல், தாங்கியிருத்தல்.’ நில எல்லையை விவரிக்கும் இச்சூழலில் ‘சார்ந்திருக்கும்’ மூல உருவகத்தை ஓரளவு காத்து இயல்பாக உள்ளது.
- source_word: לִגְבוּל מוֹאָב
  choice: மோவாபின் எல்லை
  rationale: גבול என்பதன் நேரடியான பொருள் எல்லை அல்லது வரம்பு; இங்கு ‘மோவாபின் எல்லை’ தெளிவான மொழிபெயர்ப்பு.
