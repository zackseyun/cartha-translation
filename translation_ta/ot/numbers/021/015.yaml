translation_notes:
  register: நவீன தரத் தமிழில், புவியியல் தொடரின் துண்டுவாக்கிய அமைப்பை முந்தைய வசனத்தோடு இணையும் வகையில் காத்துள்ளோம். ‘வாடி’ என்ற அயற்சொல்லுக்குப் பதிலாக வாசகர்களுக்குப் பரிச்சயமான ‘பள்ளத்தாக்குகள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, பருவகால ஓடைப் படுகை என்ற குறிப்பான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
