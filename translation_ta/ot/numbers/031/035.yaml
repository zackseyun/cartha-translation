translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் சொற்பொருள் தமிழில் இயல்பற்றதாலும் தவறாகப் புரிந்துகொள்ளப்படக்கூடியதாலும், அதன் மரபுப்பொருள் முதன்மை உரையில் தரப்பட்டு சொற்படிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
