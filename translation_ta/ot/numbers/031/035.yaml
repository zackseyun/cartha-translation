  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: ta
  text: ஆணுடன் உடலுறவு கொள்ளாத[a] பெண்கள், மொத்தம் முப்பத்திரண்டாயிரம் பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “ஆணின் படுக்கையை அறியாதவர்கள்”; இது ஓர் ஆணுடன் உடலுறவு கொள்ளாதவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: பெண்களின் எண்ணிக்கை
  rationale: சுற்றியுள்ள கணக்கெடுப்புச் சூழலில் இது கால்நடைகளுக்கு மாறாக மனிதர்களைக் குறிக்கிறது. தமிழில் ‘மனித உயிர்கள்’ என்று சொல்வதைவிட, எண்ணிக்கையைத் தெரிவிக்கும் இயல்பான வாக்கிய அமைப்பு பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: מִן הַנָּשִׁים
  choice: பெண்களின்
  rationale: போரில் பிடிக்கப்பட்ட பெண்களிலிருந்து இந்தப் பிரிவு கணக்கிடப்படுவதைச் சூழல் காட்டுகிறது; தமிழில் உரிய தொகுதியை இயல்பாகச் சுட்டுகிறது.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: ஆணுடன் உடலுறவு கொள்ளாத
  rationale: சொல்லுக்கு சொல் ‘ஆணின் படுக்கையை அறியாத’ என்பது எபிரெய மரபுத்தொடர். அதன் நோக்கமான பாலுறவு கொள்ளாமையை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; மூல மரபுத்தொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל נֶפֶשׁ
  choice: மொத்தம்
  rationale: முன் குறிப்பிடப்பட்ட குழுவின் முழு எண்ணிக்கையைத் தொகுத்துச் சொல்லும் செயல்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: முப்பத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணின் வழக்கமான தமிழாக்கம்.
