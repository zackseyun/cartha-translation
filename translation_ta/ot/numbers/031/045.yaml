  text: கழுதைகள் முப்பதாயிரத்து ஐந்நூறு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: கழுதைகள்
  rationale: חֲמֹרִים என்பது ‘கழுதைகள்’ என்பதற்கான பொதுவான பன்மைப் பெயர்ச்சொல். தொடக்க וַ பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் முந்தைய வசனத்துடன் இணையும் பட்டியல் அமைப்பே அதை இயல்பாக வெளிப்படுத்துவதால் தனியே ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: முப்பதாயிரம்
  rationale: எபிரெய எண்ணமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: ஐந்நூறு
  rationale: முப்பதாயிரத்துடன் சேர்க்கப்படும் ஐந்நூறைக் குறிக்கிறது. தமிழின் இயல்பான கூட்டு எண் வடிவில் ‘முப்பதாயிரத்து ஐந்நூறு’ என வழங்கப்பட்டுள்ளது; இணைப்புச் சொல் தனியே தேவையில்லை.
