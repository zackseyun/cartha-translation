revisions:
- from: மந்தையிலிருந்து யாவேவுக்குரிய காணிக்கை அறுநூற்று எழுபத்தைந்து.
  to: யாவேவுக்கென மந்தையிலிருந்து விதிக்கப்பட்ட பங்கு அறுநூற்று எழுபத்தைந்தாக இருந்தது.
  rationale: The revision replaces the potentially voluntary-sounding காணிக்கை with விதிக்கப்பட்ட பங்கு to reflect the levy on the spoil, retains the collective sense of flock and the name யாவே, and supplies a natural Tamil copular ending for the stated total.
  reviewer_model: gpt-5.6-terra
