id: NUM.31.37
reference: Numbers 31:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/מֶּ֥כֶס לַֽ/יהוָ֖ה מִן הַ/צֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְ/שִׁבְעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: ta
  text: யாவேவுக்கென மந்தையிலிருந்து விதிக்கப்பட்ட பங்கு அறுநூற்று எழுபத்தைந்தாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: … அறுநூற்று எழுபத்தைந்து
  rationale: இங்கு היה என்ற வினைச்சொல் தொகையை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது. தமிழில் இயல்பான பெயர்வாக்கியத்தில் தனியே ‘இருந்தது’ என்று சேர்க்காமல் பொருள் தெளிவாக வெளிப்படுகிறது.
- source_word: הַמֶּכֶס
  choice: காணிக்கை
  rationale: இச்சூழலில் போர் கொள்ளையிலிருந்து விதித்து ஒதுக்கப்பட்ட பங்கை இது குறிக்கிறது. ‘வரி’ என்ற நவீன நிர்வாகப் பொருளைத் தவிர்த்து, கடவுளுக்கென ஒதுக்கப்பட்ட பங்கை ‘காணிக்கை’ இயல்பாக உணர்த்துகிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்குரிய
  rationale: ל என்ற முன்னொட்டு யாவேவுக்கென ஒதுக்கப்பட்ட அல்லது அவருக்குச் சேரவேண்டிய பங்கைக் குறிக்கிறது; ‘யாவேவுக்குரிய’ என்பது இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைக் குறிக்கும் கூட்டுப்பெயர். ‘மந்தை’ இதை ஓர் இனமாகக் குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: அறுநூற்று எழுபத்தைந்து
  rationale: எண்ணிக்கையான 675-ஐ நவீனத் தமிழின் இயல்பான சொல்வடிவில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. அதன் தனிப்பெயர் இயல்பைத் தக்கவைக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: מֶכֶס என்பதன் பலியியல் நுணுக்கம்
  choice: காணிக்கை
  alternative: வரி / விதிக்கப்பட்ட பங்கு
  rationale: இது போர்க்கொள்ளையிலிருந்து கட்டாயமாகக் கணக்கிட்டு ஒதுக்கப்பட்ட பங்கு; விருப்பக் காணிக்கை மட்டும் அல்ல. எனினும் இவ்வசனத்தில் அந்தப் பங்கு யாவேவுக்குரியது என்பதால் ‘காணிக்கை’ வாசிப்பில் இயல்பாக உள்ளது; விதிப்பு என்ற நுணுக்கம் சூழலால் வெளிப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான பெயர்வாக்கியம். முந்தைய வசனங்களின் கணக்கீட்டுச் சூழலுடன் பொருந்தும் வகையில் ‘மந்தை’, ‘காணிக்கை’ ஆகிய பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
