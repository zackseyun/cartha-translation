translation:
  language: ta
  text: அவர்கள் எல்லாக் கொள்ளைப் பொருட்களையும், மனிதர்களையும் விலங்குகளையும் உள்ளடக்கிய கைப்பற்றப்பட்ட அனைத்தையும் எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: கொள்ளையிட்ட பொருள்கள்
  rationale: போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கும் சொல்லின் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַלְקוֹחַ
  choice: பிடித்துக்கொண்ட மனிதர்கள் மற்றும் விலங்குகள்
  rationale: இந்தச் சொல் பிடித்துச் செல்லப்பட்ட உயிர்களைக் குறிக்கிறது; தொடரும் בָּאָדָם וּבַבְּהֵמָה அதை மனிதர்களும் விலங்குகளும் என்று வெளிப்படையாக வரையறுக்கிறது.
- source_word: אָדָם
  choice: மனிதர்கள்
  rationale: இங்கு தனி ஆணை அல்ல, கூட்டாகப் பிடிக்கப்பட்ட மனிதர்களைக் குறிக்கிறது.
- source_word: בְּהֵמָה
  choice: விலங்குகள்
  rationale: பொதுவாக மிருகங்கள் அல்லது கால்நடைகளைக் குறிக்கலாம்; மூலத்தின் பரந்த சொல்லாட்சியைப் பாதுகாக்க ‘விலங்குகள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், போர்க் கொள்ளைப் பொருட்களுக்கும் பிடித்துச் செல்லப்பட்ட உயிர்களுக்கும் இடையிலான எபிரெயச் சொல் வேறுபாட்டைப் பாதுகாத்து, இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது.
