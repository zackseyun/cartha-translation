revisions:
- from: அவர்கள் கொள்ளையிட்ட பொருள்கள் அனைத்தையும், பிடித்துக்கொண்ட மனிதர்கள் மற்றும் விலங்குகள் அனைத்தையும் எடுத்துக்கொண்டார்கள்.
  to: அவர்கள் எல்லாக் கொள்ளைப் பொருட்களையும், மனிதர்களையும் விலங்குகளையும் உள்ளடக்கிய கைப்பற்றப்பட்ட அனைத்தையும் எடுத்துக்கொண்டார்கள்.
  rationale: The revision retains the source's two coordinated categories—spoil and captured booty—while removing the Tamil ambiguity concerning who performed the capture. It preserves the stark source reference to humans and animals without adding interpretive detail.
