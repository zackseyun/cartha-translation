source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: ta
  text: ஆகவே, இப்போது சிறு பிள்ளைகளில் உள்ள ஒவ்வொரு ஆண்பிள்ளையையும் கொல்லுங்கள்; ஒரு ஆணுடன் பாலுறவு கொண்டுள்ள ஒவ்வொரு பெண்ணையும் கொல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “ஆணுடன் படுத்தலின் வழியாக ஒரு ஆணை அறிந்தவள்”; இது பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְ இணைப்பையும் עַתָּה குறிக்கும் உடனடி கட்டளை மாற்றத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: கொல்லுங்கள்
  rationale: הרג என்பதன் பன்மை ஏவல் வடிவம் நேரடியானதும் வலுவானதும் ஆகும்; அதை மென்மைப்படுத்தாமல் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: כָל זָכָר בַּטָּף
  choice: சிறு பிள்ளைகளில் ஆண்பாலார் அனைவரையும்
  rationale: זָכָר என்பதன் ‘ஆண்பால்’ என்ற பொருளையும் טַף என்பதன் சிறு பிள்ளைகள் அல்லது சார்ந்திருப்போர் என்ற வயது/நிலைச் சுட்டையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: כָל אִשָּׁה
  choice: பெண்கள் அனைவரையும்
  rationale: இங்கு אִשָּׁה மனைவிகளை மட்டும் அல்லாமல் பெண்களை ஒரு வகுப்பாகக் குறிப்பிடுகிறது.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: ஆணுடன் படுத்து அவனை அறிந்திருக்கிற
  rationale: ידע என்பதன் ‘அறிதல்’ உருவகத்தையும் משכב என்பதன் ‘படுத்தல்’ என்ற பாலுறவுச் சுட்டையும் பாதுகாக்கிறது; அடிக்குறிப்பு எபிரேய மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஒழுக்கரீதியாகக் கடினமான போர்க்காலக் கட்டளையின் கடுமையை மொழிபெயர்த்தல்
  choice: கட்டளையை நேரடியாகவும் அதன் கடுமையைத் தணிக்காமலும் மொழிபெயர்த்தல்
  alternative: ‘மரணத்திற்கு உட்படுத்துங்கள்’ போன்ற மென்மையான சொற்றொடரைப் பயன்படுத்துதல் அல்லது வரலாற்றுச் சூழலை முதன்மை உரைக்குள் விளக்கிச் சேர்த்தல்
  rationale: எபிரேய உரை நேரடியான கொலைக் கட்டளையைக் கொடுக்கிறது. மொழிபெயர்ப்பு அதனை மென்மைப்படுத்தவோ, உரையில் இல்லாத அறநெறி விளக்கத்தைச் சேர்க்கவோ கூடாது.
- issue: பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகமும் தெளிவும்
  choice: ‘ஆணுடன் படுத்து அவனை அறிந்திருக்கிற’ என்று உருவகத்தைப் பாதுகாத்து, அடிக்குறிப்பில் பொருளை விளக்குதல்
  alternative: முதன்மை உரையிலேயே ‘ஆணுடன் பாலுறவு கொண்டிருக்கிற’ என்று முழுமையாக விளக்குதல்
  rationale: மூலத்தின் ‘அறிதல்’ மற்றும் ‘படுத்தல்’ ஆகிய இரு கூறுகளையும் பாதுகாக்கிறது; அதே நேரத்தில் அடிக்குறிப்பு வாசகருக்கு பாலுறவுப் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வன்முறையை மென்மைப்படுத்தாமல், பாலுறவைக் குறிக்கும் மூலமொழி உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
