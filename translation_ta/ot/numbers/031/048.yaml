translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயிரத்தலைவர்கள்’, ‘நூற்றுத்தலைவர்கள்’ என்பவை மூலத்தின் இராணுவப் படிநிலையைச் சுருக்கமாகக் காக்கின்றன; இடைச்செருகலான விளக்கத்தை நீள்கோடுகள் தெளிவுபடுத்துகின்றன.
