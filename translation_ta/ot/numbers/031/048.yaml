source:
  edition: WLC
  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: ta
  text: அப்போது படையின் ஆயிரப்பிரிவுகளுக்குப் பொறுப்பாக நியமிக்கப்பட்ட அதிகாரிகள்[a]—ஆயிரத்தலைவர்களும் நூற்றுத்தலைவர்களும்—மோசேயிடம் நெருங்கி வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரிகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், படைப்பிரிவுகளுக்குப் பொறுப்பாக நியமிக்கப்பட்டவர்களைக் குறிக்கிறது; அடுத்த தொடர் அவர்களை ஆயிரத்தலைவர்களும் நூற்றுத்தலைவர்களும் என்று குறிப்பிடுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘மோசேயை அணுகினார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: நெருங்கி வந்தார்கள்
  rationale: קרב என்பது ஒருவரை நோக்கி அருகில் வருவதைக் குறிக்கிறது. ‘நெருங்கி வந்தார்கள்’ என்பது அதன் நேரடியான இயக்க உணர்வையும் எபிரெயக் கதைநடையின் தொடர்ச்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַפְּקֻדִים
  choice: நியமிக்கப்பட்ட அதிகாரிகள்
  rationale: פקד என்பதிலிருந்து வந்த இந்தச் சொல், இங்கு படைப்பிரிவுகளுக்குப் பொறுப்பாக நியமிக்கப்பட்டவர்களைக் குறிக்கிறது; சாதாரண வீரர்களை அல்ல. ‘அதிகாரிகள்’ அவர்களுடைய செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘நியமிக்கப்பட்ட’ என்பது எபிரெயச் சொல்லின் வடிவத்தையும் காக்கிறது.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: படையின் ஆயிரப்பிரிவுகளுக்குப் பொறுப்பாக
  rationale: இந்தத் தொடர் அந்த அதிகாரிகளின் பொறுப்புக்குட்பட்ட படைப்பிரிவுகளை அடையாளப்படுத்துகிறது. பின்னர் வரும் ‘ஆயிரத்தலைவர்கள்’ மற்றும் ‘நூற்றுத்தலைவர்கள்’ என்ற விளக்கம் இந்தப் பொருளை ஆதரிக்கிறது.
- source_word: אַלְפֵי
  choice: ஆயிரப்பிரிவுகள்
  rationale: אֶלֶף என்பது சில இடங்களில் குலத்தையோ ஒரு படைப்பிரிவையோ குறிக்கலாம். இங்கு இராணுவச் சூழலும் ‘நூறுகள்’ என்பதுடனான இணைப்பும் இருப்பதால், எண்ணிக்கையை அடிப்படையாகக் கொண்ட படைப்பிரிவு என்ற பொருளை ‘ஆயிரப்பிரிவுகள்’ வெளிப்படுத்துகிறது.
- source_word: הַצָּבָא
  choice: படை
  rationale: צבא இங்கு ஒழுங்கமைக்கப்பட்ட போர்ப்படையைக் குறிக்கிறது. ‘படை’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ஆயிரத்தலைவர்கள்
  rationale: שׂר என்பது தலைவரையோ அதிகாரியையோ குறிக்கிறது. இராணுவப் படிநிலையில் ஆயிரம் பேர் கொண்ட அலகுகளுக்குத் தலைமை வகித்தவர்களை ‘ஆயிரத்தலைவர்கள்’ சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: நூற்றுத்தலைவர்களும்
  rationale: முந்தைய பதவிப்பெயருக்கு இணையான அமைப்பைக் காத்து, நூறு பேர் கொண்ட அலகுகளின் தலைவர்களைத் தெளிவாகக் குறிக்கிறது.
