revisions:
- from: மோசே அவர்களிடம், “பெண்பாலார் அனைவரையும் உயிரோடு விட்டுவிட்டீர்களா?”[a] என்று கேட்டார்.
  to: மோசே அவர்களிடம், “பெண்பாலினத்தவர் அனைவரையும் உயிரோடு விட்டுவிட்டீர்களா?”[a] என்றார்.
  rationale: The revision restores the neutral narrative force of וַיֹּאמֶר with “என்றார்,” while retaining the question in the quotation itself. It replaces the less idiomatic “பெண்பாலார்” with “பெண்பாலினத்தவர்,” preserving the Hebrew term’s broad, age-unspecified reference. The footnote remains anchored to the verbal expression and supplies the valid alternative ‘keep alive.’
