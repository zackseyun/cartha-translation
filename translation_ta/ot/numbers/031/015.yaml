source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: ta
  text: மோசே அவர்களிடம், “பெண்பாலினத்தவர் அனைவரையும் உயிரோடு விட்டுவிட்டீர்களா?”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண்பாலினத்தவர் அனைவரையும் உயிருடன் வைத்திருக்கிறீர்களா?”
    reason: חיה என்பதன் causative வடிவம் ‘உயிரோடு விடுதல்’ அல்லது ‘உயிருடன் வைத்திருத்தல்’ என நெருங்கிய முறைகளில் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: אָמַר என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், நேரடி உரை கேள்வியாக இருப்பதால் நவீன தமிழில் ‘என்று கேட்டார்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲלֵיהֶם
  choice: அவர்களிடம்
  rationale: אֶל + 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு, பேச்சு அந்தக் குழுவை நோக்கிச் செலுத்தப்பட்டதைத் தெரிவிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: הַחִיִּיתֶם
  choice: உயிரோடு விட்டுவிட்டீர்களா
  rationale: חיה என்பதன் causative வடிவம் ‘வாழ விடுதல்/உயிரோடு வைத்திருத்தல்’ எனப் பொருள்படும். உடனடியாக மதிப்பாய்வு செய்யப்படும் முடிந்த செயலை ‘விட்டுவிட்டீர்களா’ இயல்பாகக் காட்டுகிறது; கேள்வித்தன்மையும் சூழலாலும் வடிவாலும் தெளிவாகிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: ஒருமைத் தொகுப்புப் பெயருடன் வரும் כָּל முழுமையான அளவைச் சுட்டுகிறது; மனிதர்களைக் குறிக்கும் தமிழ் நடையில் ‘அனைவரையும்’ இயல்பானது.
- source_word: נְקֵבָה
  choice: பெண்பாலார்
  rationale: இந்த எபிரெயச் சொல் வயதைக் கட்டுப்படுத்தாமல் பெண்பாலினரைப் பொதுவாகக் குறிக்கிறது. ‘பெண்பாலார்’ என்பது ‘பெண்கள்’ என்பதைவிட மூலத்தின் பாலின அடிப்படையிலான பரந்த குறிப்பைத் துல்லியமாகப் பேணுகிறது.
theological_decisions:
- issue: போர்ச் சூழலில் נְקֵבָה என்பதன் பரப்பு
  choice: பெண்பாலார்
  alternative: பெண்கள்; பெண்களையும் சிறுமிகளையும்
  rationale: மூலச்சொல் வயதை வரையறுப்பதில்லை. ஆகவே வயது வந்த பெண்களாக மட்டும் குறுக்காமலும், மூலத்தில் வெளிப்படாத இரட்டைப் பட்டியலைச் சேர்க்காமலும் அதன் கடுமையான பரப்பை மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் நடை. ‘பெண்பாலார்’ என்பது மூலத்தின் வயது வரையறையற்ற பாலினச் சொல்லைத் தக்கவைக்கிறது. முதன்மை உரையின் ‘விட்டுவிட்டீர்களா’ மோசேயின் கண்டனத் தொனியை இயல்பாக உணர்த்தினாலும், அடிப்படை causative பொருளை அடிக்குறிப்பு மாற்று வெளிப்படுத்துகிறது.
