  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: ta
  text: ஏழாம் நாளில் உங்கள் ஆடைகளைத் துவைக்க வேண்டும்; அப்போது நீங்கள் தூய்மையாவீர்கள்[a]. அதன் பிறகு நீங்கள் முகாமுக்குள் வரலாம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய்மை அடைவீர்கள்’ என்றும் மொழிபெயர்க்கலாம். குறிப்பிட்ட துவைத்தலுக்குப் பின் சடங்குமுறைப்படி தூய்மை நிலையை அடைவதை எபிரெயச் சொல் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘முகாமுக்குள் நுழைவீர்கள்’ என்றும் மொழிபெயர்க்கலாம். தூய்மையடைதல் நிறைவுற்ற பின் மீண்டும் உள்ளே வர அனுமதிக்கப்படுவதே இங்குள்ள கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: துவைக்க வேண்டும்
  rationale: כּבס என்பதன் பியேல் வடிவம் ஆடைகள் அல்லது துணிகளைத் துவைப்பதைக் குறிப்பாகக் குறிக்கிறது. இச்சூழலில் இது எதிர்கால நிகழ்வை மட்டும் அல்ல, கடைப்பிடிக்க வேண்டிய கட்டளையைத் தெரிவிக்கிறது.
- source_word: בִּגְדֵיכֶם
  choice: உங்கள் ஆடைகளை
  rationale: בגד என்பது உடை அல்லது ஆடை. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘ஆடைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וּטְהַרְתֶּם
  choice: தூய்மையானவர்களாவீர்கள்
  rationale: טהר என்பதன் கால் வடிவம் இங்கு சடங்குசார் தூய்மை நிலையை அடைவதைக் குறிக்கும் விளைவுநிலைப் பொருளில் உள்ளது. இத்தேர்வு செயற்பாட்டை மிகைப்படுத்தாமல், விளைவாக ஏற்படும் தூய்மை நிலையைப் பாதுகாக்கிறது.
- source_word: וְאַחַר
  choice: அதன் பிறகு
  rationale: தூய்மையடைதல் முடிந்த பின் நிகழ்வதைச் சுட்டும் இயல்பான தொடர்ச்சிச் சொற்றொடர்.
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: நீங்கள் முகாமுக்குள் வரலாம்
  rationale: בוא אל என்பது ‘உள்ளே வருதல்/நுழைதல்’ என்று பொருள்படும். இச்சடங்குச் சூழலில் தூய்மையடைந்த பின் முகாமுக்குள் மீண்டும் வர அனுமதி கிடைப்பதை ‘வரலாம்’ தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மை மொழி
  choice: ‘தூய்மையானவர்களாவீர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தூய்மைப்படுத்தப்படுவீர்கள்’ அல்லது ‘உங்களைத் தூய்மைப்படுத்திக்கொள்வீர்கள்.’
  rationale: இவ்வசனம் போருக்குப் பிந்தைய சடங்குசார் தீட்டு நீங்கி மீண்டும் தூய்மை நிலையை அடைவதைப் பற்றியது. தேர்ந்தெடுத்த வாசகம் அறநெறி அல்லது ஆவிக்குரிய தூய்மையைத் தேவையின்றி புகுத்தாமல், எபிரெயச் சொல்லின் விளைவுநிலைப் பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூய்மை’ என்பது இங்கு சடங்குசார் நிலை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது; மூலத்தின் இறையியல் இழுபறி தீர்த்துவைக்கப்படவில்லை.
