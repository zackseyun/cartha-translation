base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: ta
  text: 'போருக்குச் சென்ற போர்வீரர்களிடமிருந்து யாவேக்காக ஒரு கட்டாயப் பங்கை ஒதுக்கிவை: மனிதர்களிலிருந்தும் மாடுகளிலிருந்தும் கழுதைகளிலிருந்தும் மந்தையிலிருந்தும் ஐந்நூறுக்கு ஓர் உயிரை[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஐந்நூறில் ஓர் நெபெஷ்.” நெபெஷ் என்பது இங்கு மனிதராக இருந்தாலும் விலங்காக இருந்தாலும், உயிருள்ள தனி ஒன்றைக் கணக்கிடும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: பங்கைப் பிரித்தெடு
  rationale: רום என்பதன் ஹிஃபில் வடிவமும் מֶכֶס என்பதும் சேர்ந்து, கொள்ளைப் பொருளிலிருந்து நிர்ணயிக்கப்பட்ட பங்கைத் தனியே எடுப்பதைக் குறிக்கின்றன. இயல்பான தமிழில் இரண்டின் கருத்தையும் இச்சொற்றொடர் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கான
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பெயராகவே வெளிப்படுத்தி, அந்தப் பங்கு அவருக்குரியது என்பதைக் காட்டுகிறது.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: போருக்குச் சென்ற போர்வீரர்களிடமிருந்து
  rationale: படையெடுப்பில் நேரடியாகப் பங்கேற்ற போர் ஆட்களே இங்கு குறிப்பிடப்படுகின்றனர்; நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: ஒவ்வொரு ஐந்நூற்றுக்கும் ஓர் உயிரை
  rationale: נֶפֶשׁ இங்கு மனிதருக்கும் விலங்குகளுக்கும் பொருந்தும் உயிருள்ள தனிநபர் அல்லது ஓர் உயிரினம் என்ற எண்ணிக்கைச் சொல்லாக வருகிறது. ‘உயிர்’ அதன் விரிவைத் தக்கவைக்கிறது.
- source_word: מִן הָאָדָם
  choice: மனிதர்களிலும்
  rationale: விலங்குகளுக்கு மாறாகக் கொள்ளையில் இருந்த மனிதப் பகுதியைக் கூட்டாகக் குறிக்கிறது.
- source_word: וּמִן הַבָּקָר
  choice: மாடுகளிலும்
  rationale: בָּקָר என்பது மாட்டு இனத்தைக் குறிக்கும் கூட்டுப்பெயர்.
- source_word: וּמִן הַחֲמֹרִים
  choice: கழுதைகளிலும்
  rationale: நவீன தமிழில் நேரடியான, பொதுவான பெயர்.
- source_word: וּמִן הַצֹּאן
  choice: ஆட்டு மந்தையிலும்
  rationale: צֹאן என்பது பொதுவாக செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடை மந்தை; ‘ஆட்டு மந்தை’ இயல்பான கூட்டுப்பெயராக உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆள்; ஒன்று; ஆன்மா
  rationale: இச்சொல் அடுத்துவரும் மனிதர்களுக்கும் பல்வேறு விலங்குகளுக்கும் ஒரேபோல் பொருந்துகிறது. ‘ஆன்மா’ தேவையற்ற மெய்யியல் கருத்தைத் தூண்டும்; ‘ஆள்’ விலங்குகளுக்குப் பொருந்தாது; ‘ஒன்று’ மூலச் சொல்லின் உயிருள்ள தன்மைச் சுட்டை மறைக்கும்.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். கட்டளையின் ஒருமை வடிவம் காக்கப்பட்டுள்ளது. பட்டியல் தமிழின் இயல்பான இடவெற்றுமை அமைப்பில் தரப்பட்டுள்ளது; ‘உயிர்’ என்ற மூல உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
