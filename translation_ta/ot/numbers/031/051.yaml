  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֶת הַ/זָּהָ֖ב מֵֽ/אִתָּ֑/ם כֹּ֖ל כְּלִ֥י מַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: ta
  text: மோசேயும் ஆசாரியனான எலெயாசாரும் அவர்களிடமிருந்து அந்தத் தங்கத்தை, அதாவது வேலைப்பாடு செய்யப்பட்ட ஒவ்வொரு பொருளையும், எடுத்துக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேலைப்பாடு செய்யப்பட்ட எல்லாப் பொருட்களையும்”; அதாவது, வேலைப்பாடு செய்யப்பட்ட தங்கப் பொருட்கள் அனைத்தையும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பெற்றுக்கொண்டார்கள்
  rationale: לקח என்பது ‘எடுத்துக்கொள்’ அல்லது ‘பெற்றுக்கொள்’ எனப் பொருள்படலாம். முந்தைய சூழலில் தங்கம் இவர்களிடம் கொண்டுவரப்படுவதால், தமிழில் ‘பெற்றுக்கொண்டார்கள்’ என்பது நிகழ்வை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: பெயருடன் இணைந்த பதவிப் பெயரை நவீன, இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת הַזָּהָב
  choice: அந்தத் தங்கத்தை
  rationale: எபிரெய definite article சூழலில் முன்பே குறிப்பிடப்பட்ட குறிப்பிட்ட தங்கத்தைச் சுட்டுகிறது; ‘அந்தத்’ அதைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאִתָּם
  choice: அவர்களிடமிருந்து
  rationale: மூலத்திலுள்ள ஆதாரம் அல்லது கொடுப்பவர்களைக் குறிக்கும் முன்னிடைச்சொல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כֹּל כְּלִי מַעֲשֶׂה
  choice: வேலைப்பாடு செய்யப்பட்ட ஒவ்வொரு பொருளையும்
  rationale: כְּלִי என்பது இங்கு பாத்திரங்களை மட்டும் குறிக்காமல் பலவகை உருவாக்கப்பட்ட பொருட்களைக் குறிக்கும். מַעֲשֶׂה அவை மூலத் தங்கமல்ல, வேலைப்பாடு செய்யப்பட்ட பொருட்கள் என்பதைத் தெரிவிக்கிறது; ஒருமைத் தொகுப்புணர்வை ‘ஒவ்வொரு’ காக்கிறது.
