source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: ta
  text: இதோ, இந்தப் பெண்கள்தான் பிலேயாமின் சொல்லின்படி[a] இஸ்ரவேலின் மகன்களை[b] பேயோர் காரியத்தில் யாவேக்கு எதிராகத் துரோகம் செய்யத் தூண்டியவர்கள்; அதன் விளைவாக யாவேயின் சபையில் கொள்ளைநோய் ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிலேயாமின் ஆலோசனையின்படி.’ எபிரெயத்தில் எழுத்துப்படி, ‘பிலேயாமின் சொல்லின்படி.’
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது எபிரெயச் சொற்றொடர்; இங்கு அது இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: இதோ, இந்தப் பெண்கள்தான்
  rationale: இரட்டிப்பாக வரும் வலியுறுத்தலையும் பெண்பால் பன்மைச் சுட்டையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּדְבַר בִּלְעָם
  choice: பிலேயாமின் சொல்லின்படி
  rationale: דבר என்பதன் ‘சொல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; சூழலில் அது பிலேயாமின் அறிவுரை அல்லது தூண்டுதலைக் குறிக்கலாம்.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது; இங்கு அது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: לִמְסָר מַעַל
  choice: நம்பிக்கைத் துரோகம் செய்யக் காரணமானவர்கள்
  rationale: מסר காட்டும் காரணமாக அல்லது கருவியாகச் செயல்படும் நுணுக்கத்தையும், מעל காட்டும் உறவுசார் அல்லது உடன்படிக்கைசார் விசுவாசமின்மையையும் இணைத்து வெளிப்படுத்துகிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு எதிராக
  rationale: மீறுதல் யாருக்கு எதிராகச் செய்யப்பட்டது என்பதை முன்னிடைச்சொல் காட்டுகிறது; திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל דְּבַר פְּעוֹר
  choice: பேயோர் காரியத்தில்
  rationale: பேயோரைச் சார்ந்த நிகழ்வு அல்லது விவகாரத்தைக் குறிக்கும் மூலத்தின் பொதுவான சொல்லாட்சியை மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: அதனால் ... கொள்ளைநோய் ஏற்பட்டது
  rationale: அடுத்த கூற்றின் விளைவுத் தொடர்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: בַּעֲדַת יְהוָה
  choice: யாவேயின் சபையில்
  rationale: עֵדָה என்பதன் ஒன்றுகூடிய சமூகப் பொருளை ‘சபை’ தெரிவிக்கிறது; ב இங்கு அந்தச் சமூகத்தின் மத்தியில் நோய் ஏற்பட்டதைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: מַעַל என்பதன் உடன்படிக்கைசார் நுணுக்கம்
  choice: நம்பிக்கைத் துரோகம்
  alternative: மீறுதல்
  rationale: இச்சொல் வெறும் கட்டளைமீறலை மட்டுமல்லாமல் உறவிலும் உடன்படிக்கையிலும் காட்டப்படும் விசுவாசமின்மையையும் குறிக்கிறது; இருப்பினும் எந்தக் குறிப்பிட்ட சமயக் கோட்பாட்டையும் சேர்க்கவில்லை.
- issue: הֵנָּה என்பதன் பெண்பால் குறிப்பை வெளிப்படுத்துதல்
  choice: இந்தப் பெண்கள்
  alternative: இவர்களே
  rationale: உடனடிச் சூழலில் மீதியானியப் பெண்கள் குறிக்கப்படுவதால், பெண்பால் பன்மையை வெளிப்படையாகக் கூறுவது மூலத்துக்கும் உரையோட்டத்துக்கும் உண்மையாக உள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற வேதாகம உரைநடைச் சொல் வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; மற்ற சொற்றொடர்கள் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைந்துள்ளன.
