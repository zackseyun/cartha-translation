source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் மீதியானின் பெண்களையும் அவர்களுடைய சிறு பிள்ளைகளையும்[a] சிறைப்பிடித்தார்கள்; அவர்களுடைய கால்நடைகள் அனைத்தையும், மந்தைகள் அனைத்தையும், செல்வம் அனைத்தையும் கொள்ளையிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பிள்ளைகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: சிறைப்பிடித்தார்கள்
  rationale: שׁבה என்பதன் கால் வடிவம் பொதுவாகப் பொருட்களைக் கைப்பற்றுவதை அல்ல, மனிதர்களைச் சிறைபிடிப்பதைக் குறிக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரேய மூலத்தின் בן + பெயர் என்ற வடிவத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; ‘இஸ்ரவேலர்கள்’ என்பதும் பொருளளவில் சாத்தியம்.
- source_word: נְשֵׁי מִדְיָן
  choice: மீதியானின் பெண்கள்
  rationale: נָשִׁים இங்கு மனைவிகளை மட்டும் அல்லாமல் பெண்களைப் பொதுவாகக் குறிக்கிறது; இணைப்புச் சொல்லமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: טַפָּם
  choice: அவர்களுடைய சிறு பிள்ளைகள்
  rationale: טַף சிறுவயதுப் பிள்ளைகள் அல்லது சிறியவர்களைக் குறிக்கிறது; ‘சிறு பிள்ளைகள்’ அந்த வயது நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: בְּהֶמְתָּם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: בְּהֵמָה கூட்டுப் பொருளில் வளர்ப்பு விலங்குகளைக் குறிக்கிறது; ‘கால்நடைகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: מִקְנֵהֶם
  choice: அவர்களுடைய மந்தைகள்
  rationale: מִקְנֶה மேய்ப்புத் தொழில் சார்ந்த ஆடு, மாடு போன்ற கால்நடை உடைமைகளை குறிக்கக்கூடும்; முந்தைய பொதுச் சொல்லிலிருந்து வேறுபடுத்த ‘மந்தைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֵילָם
  choice: அவர்களுடைய செல்வம்
  rationale: חַיִל இச்சூழலில் படைவலிமையைவிட பொருள் வளம், உடைமை அல்லது செல்வத்தைக் குறிக்கிறது.
- source_word: בָּזָזוּ
  choice: கொள்ளையிட்டார்கள்
  rationale: בזז போரில் வென்ற பின் கொள்ளைப் பொருளை எடுத்தலைக் குறிக்கிறது; ‘கொள்ளையிட்டார்கள்’ போர்ச்சூழலையும் செயற்பாட்டையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இன/உடன்படிக்கை அடையாளத் தொடரான בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: கோட்பாட்டு முடிவைச் சேர்க்காமல் மூலத்தின் ஆண்பால் பன்மை வடிவத்தை வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது; இயல்பை முன்னிறுத்தினால் ‘இஸ்ரவேலர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified, நேரடியான போர்வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே நீண்ட வாக்கியத்தின் இரு செயல்களும் அரைப்புள்ளியால் தெளிவுபடுத்தப்பட்டுள்ளன; மூலத்திலுள்ள பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
