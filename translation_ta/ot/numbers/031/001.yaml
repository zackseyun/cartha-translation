source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH). மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘யெகோவா’ என்பதும் ஒரு மாற்று ஒலிபெயர்ப்பு.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்வினையுடன் வரும் דּבר கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் இயல்பான தொடர்ச்சியைப் பேண ‘பின்பு’ என்றும், உரையாற்றுதலைக் குறிக்க ‘கூறினார்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது; அதன் உச்சரிப்பு உறுதியற்றது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: மֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'கூறினார்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை, தமிழில் இயல்பாக இரட்டிப்பின்றி பெருங்குறியுடன் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையில் பட்டமல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளோம். பழங்காலச் சரியான உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: 'நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. எபிரெய ‘பேசினார் ... சொல்லும்படி’ என்ற வாய்பாட்டை அப்படியே நகலெடுக்காமல், அடுத்த வசனத்தின் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்த ‘கூறினார்:’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி மோசேயின் பெயருக்குப் பின் அல்லாமல் இறைப்பெயருக்குப் பின் பொருளடக்க ரீதியாக அமைய வேண்டும்; வெளியீட்டு உரை: ‘பின்பு யெகோவா[a] மோசேயிடம் கூறினார்:’ என்பதே சரியான குறியிடல்.'
