  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: ta
  text: அவர்களுடைய குடியிருப்புகளில் உள்ள நகரங்கள் அனைத்தையும்[a], அவர்களுடைய முகாம்கள் அனைத்தையும்[b] தீயால் எரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் வசித்த இடங்களிலுள்ள நகரங்கள் அனைத்தையும்”; எபிரெயத்தில், “அவர்களுடைய குடியிருப்புகள்/குடியேற்றங்களில் உள்ள நகரங்கள்” என்றும் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முகாம்கள்” என்பதற்கான எபிரெயச் சொல் வேலியிடப்பட்ட இடங்களையோ குடியிருப்புகளையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: அவர்களுடைய நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம். போரியல் மற்றும் புவியியல் சூழலில் ‘நகரங்கள்’ என்பது பரந்தும் வழக்கமானதுமான மொழிபெயர்ப்பு.
- source_word: בְּמוֹשְׁבֹתָם
  choice: அவர்கள் வாழ்ந்த இடங்களிலிருந்த
  rationale: מוֹשָׁב என்பது வாழிடம், குடியிருப்பு அல்லது குடியேற்றத்தைக் குறிக்கிறது. இங்கு நகரங்களை விளக்கும் இடத்தொடராக வருவதால், இயல்பான நவீனத் தமிழில் ‘அவர்கள் வாழ்ந்த இடங்களிலிருந்த’ என்று தரப்பட்டுள்ளது.
- source_word: טִירֹתָם
  choice: அவர்களுடைய முகாம்கள்
  rationale: טִירָה என்பது முகாம், வேலியிடப்பட்ட இடம் அல்லது குடியிருப்பைக் குறிக்கலாம். ‘நகரங்கள்’ என்பதிலிருந்து வேறுபட்ட வாழிட வகையை இச்சூழலில் ‘முகாம்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: தீயால் எரித்தார்கள்
  rationale: בָּאֵשׁ இங்கு கருவிப்பொருளைக் காட்டுவதால், எபிரெய வலியுறுத்தலைத் தக்கவைக்கும் இயல்பான தமிழாக ‘தீயால் எரித்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאֵת ... וְאֵת
  choice: அனைத்தையும் ... அனைத்தையும்
  rationale: இருமுறை வரும் כָּל உடனான நேரடிச் செயப்படுபொருள் அமைப்பு இரண்டு முழுத் தொகுதிகளையும் வலியுறுத்துகிறது; தமிழில் ‘அனைத்தையும் ... அனைத்தையும்’ என அது தக்கவைக்கப்பட்டுள்ளது.
