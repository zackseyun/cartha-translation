- from: அவர்கள் வாழ்ந்த இடங்களிலிருந்த அவர்களுடைய நகரங்கள் அனைத்தையும்[a], அவர்களுடைய முகாம்கள் அனைத்தையும்[b] தீயால் எரித்தார்கள்.
  to: அவர்களுடைய குடியிருப்புகளில் உள்ள நகரங்கள் அனைத்தையும்[a], அவர்களுடைய முகாம்கள் அனைத்தையும்[b] தீயால் எரித்தார்கள்.
