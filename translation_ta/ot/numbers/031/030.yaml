revisions:
- from: இஸ்ரவேல் மக்களுக்குரிய பாதியிலிருந்து, மனிதர்களிலும் மாடுகளிலும் கழுதைகளிலும் மந்தையிலும்—எல்லாக் கால்நடைகளிலும்—ஒவ்வோர் ஐம்பதுக்கும் ஒன்றை எடுத்துக்கொள்[a]. அவற்றை யெகோவாவின் திருவுறைவிடத்தைக் காவல்காக்கும் பொறுப்புடைய லேவியர்களுக்குக் கொடு.
  to: இஸ்ரவேல் மக்களுக்குரிய பாதியிலிருந்து, மனிதர், மாடுகள், கழுதைகள், மந்தை[b] என எல்லாக் கால்நடைகளிலிருந்தும் ஒவ்வோர் ஐம்பதிலும் ஒன்றை எடுத்துக்கொள்[a]. அவற்றை யாவேயின் திருக்கூடாரத்தின் காவல் பொறுப்பை வகிக்கும் லேவியர்களுக்குக் கொடு.
  rationale: The revision retains the levy ratio, the collective reference to humans, and all livestock categories. It improves idiomatic Tamil enumeration, renders the tabernacle specifically, aligns the divine name with the POB audit trail, and restores the flock-range footnote anchor.
