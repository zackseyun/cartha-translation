base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களுக்குரிய பாதியிலிருந்து, மனிதர், மாடுகள், கழுதைகள், மந்தை[b] என எல்லாக் கால்நடைகளிலிருந்தும் ஒவ்வோர் ஐம்பதிலும் ஒன்றை எடுத்துக்கொள்[a]. அவற்றை யாவேயின் திருக்கூடாரத்தின் காவல் பொறுப்பை வகிக்கும் லேவியர்களுக்குக் கொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஐம்பதில் ஒன்று; இன்னும் நேரடியாக, “ஒவ்வோர் ஐம்பதிலிருந்தும் எடுக்கப்பட்ட ஒன்று.”
    reason: lexical_alternative
  - marker: b
    text: “மந்தை” என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய கூட்டுப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்குரிய பாதியிலிருந்து
  rationale: מַחֲצִית என்பது பங்கிடப்பட்ட ‘பாதி’யைக் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்ற எபிரெய மரபுத்தொடரை இன்றைய தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் தெளிவாகவும் வெளிப்படுத்த ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תִּקַּח
  choice: எடுத்துக்கொள்
  rationale: மோசேயை ஒருமையில் நேரடியாக நோக்கிக் கூறப்படும் கட்டளையைத் தமிழில் இயல்பான கட்டளை வடிவில் தருகிறது.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: ஒவ்வோர் ஐம்பதுக்கும் ஒன்றை எடுத்துக்கொள்
  rationale: இது 1:50 என்ற வரிவிகிதத்தைக் குறிக்கிறது. אָחֻז என்பதிலுள்ள ‘எடுக்கப்பட்ட ஒன்று’ என்ற நுணுக்கத்தைத் தமிழில் கனமாக்காமல், விகிதத்தைத் தெளிவாகத் தெரிவிக்கிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִן הָאָדָם
  choice: மனிதர்களிலும்
  rationale: אָדָם இங்கு போர்க்கொள்ளைப் பட்டியலில் மனிதர்களைக் குறிக்கும் ஒருமைத் தொகுப்புப்பெயர். தமிழில் ‘மனிதர்களில்’ என்பது அதன் தொகுப்புப் பொருளை இயல்பாகத் தருகிறது.
- source_word: מִן הַבָּקָר
  choice: மாடுகளிலும்
  rationale: בָּקָר என்பது மாட்டினம் அல்லது மாட்டு மந்தையைக் குறிக்கிறது; பட்டியல் சூழலில் ‘மாடுகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: מִן הַחֲמֹרִים
  choice: கழுதைகளிலும்
  rationale: மூலத்தின் பன்மை வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמִן הַצֹּאן
  choice: மந்தையிலும்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைத் தொகுப்புப்பெயர். ‘மந்தை’ அந்தக் கூட்டுப்பொருளைத் தக்கவைக்கிறது.
- source_word: מִכָּל הַבְּהֵמָה
  choice: எல்லாக் கால்நடைகளிலும்
  rationale: בְּהֵמָה இச்சூழலில் பொதுவாக கால்நடைகளைச் சுட்டுகிறது. முன்வரும் பட்டியலைச் சுருக்கிக் கூறும் மூலத்தின் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: அவற்றை ... லேவியர்களுக்குக் கொடு
  rationale: தொடர்ச்சியான இரண்டாம் ஒருமைக் கட்டளையை இயல்பான தமிழில் தருகிறது; ‘அவற்றை’ மனிதர்களையும் கால்நடைகளையும் உள்ளடக்கும் நடுநிலைச் சுட்டாகப் பயன்படுத்தப்படுகிறது.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: காவல்காக்கும் பொறுப்புடைய
  rationale: ஒரே வேர் சார்ந்த எபிரெயச் சொற்களின் இணைப்பு, ஒப்படைக்கப்பட்ட காவல் அல்லது பராமரிப்புப் பொறுப்பை வலியுறுத்துகிறது. தமிழ் வடிவம் காவலையும் கடமையையும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: מִשְׁכַּן
  choice: திருவுறைவிடம்
  rationale: ‘வசித்தல்’ என்ற சொல்லடிப்படையையும், யெகோவாவின் பரிசுத்த உறைவிடமாகிய கூடாரத்தையும் சுருக்கமாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; எனவே ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றப்படவில்லை. நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மறுவடிவமைக்கும் மாற்றாகும்.
- issue: הָאָדָם என்பதன் ஒருமைத் தொகுப்புப் பொருள்
  choice: மனிதர்களிலும்
  alternative: மனிதனிலும்
  rationale: இங்கு கொள்ளையாக எண்ணப்பட்ட மனிதர்களின் வகையைச் சுட்டும் தொகுப்புப் பயன்பாடு உள்ளது. தமிழ் ஒருமை ‘மனிதன்’ தனிநபரைச் சுட்டுவது போலத் தோன்றக்கூடும் என்பதால் பன்மை இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதியின் நேரடியான கட்டளைத் தொனி தக்கவைக்கப்பட்டுள்ளது. நீண்ட பட்டியல் வாசிக்கத் தெளிவாக இருக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன. ‘மந்தை’ என்ற மூலத் தொகுப்புச்சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடும்.
