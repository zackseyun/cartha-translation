revisions:
- from: அப்போது மோசே மக்களிடம், “உங்களில் சில ஆண்களைப் போருக்காக ஆயத்தப்படுத்துங்கள். அவர்கள் மீதியானுக்கு எதிராகச் சென்று, மீதியான்மேல் யெகோவாவின் பழிவாங்குதலை[a] நிறைவேற்றட்டும்” என்றார்.
  to: மோசே மக்களிடம், “உங்களிடமிருந்து ஆண்களைப் போருக்காக ஆயுதம் ஏந்தத் தயார்படுத்துங்கள். அவர்கள் மீதியானுக்கு எதிராகச் சென்று, மீதியான்மேல் யாவேயின் பழிவாங்குதலை[a] நிறைவேற்றட்டும்” என்றார்.
  rationale: The revision removes the unsupported quantitative addition «சில», makes the military preparation explicit through «ஆயுதம் ஏந்தத் தயார்படுத்துங்கள்», and changes the divine name consistently to «யாவே». The alternative construal of נִקְמַת יהוה is retained in a footnote anchored to «பழிவாங்குதலை».
