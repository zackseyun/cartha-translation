base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: ta
  text: மோசே மக்களிடம், “உங்களிடமிருந்து ஆண்களைப் போருக்காக ஆயுதம் ஏந்தத் தயார்படுத்துங்கள். அவர்கள் மீதியானுக்கு எதிராகச் சென்று, மீதியான்மேல் யாவேயின் பழிவாங்குதலை[a] நிறைவேற்றட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவுக்காகச் செய்யும் பழிவாங்குதலை.” எபிரெயச் சொற்றொடர் யாவேவுக்குரிய பழிவாங்குதலையோ, அவர் சார்பாக நிறைவேற்றப்படும் பழிவாங்குதலையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார் / என்றார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடை வடிவம்; தமிழில் இயல்பான மேற்கோள் அமைப்புக்காக இறுதியில் ‘என்றார்’ என வழங்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மோசே உரையாற்றிய இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது.
- source_word: הֵחָלְצוּ
  choice: ஆயத்தப்படுத்துங்கள்
  rationale: போர்ச் சூழலில் ஆயுதம் ஏந்தச் செய்து படை நடவடிக்கைக்குத் தயார்படுத்துதல் என்ற பொருளைத் தருகிறது; ‘ஆயுதம் கொடுங்கள்’ என்பதைக் காட்டிலும் வினையின் விரிந்த இராணுவப் பொருளைப் பாதுகாக்கிறது.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: உங்களில் சில ஆண்களை
  rationale: மக்களிடமிருந்து ஆண் போராளிகள் தேர்ந்தெடுக்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சில’ என்பது தேர்ந்தெடுக்கும் பொருளைத் தெளிவாக்குகிறது.
- source_word: לַצָּבָא
  choice: போருக்காக
  rationale: இங்கு צבא என்பது படை நடவடிக்கை அல்லது போரைச் சுட்டுகிறது; தமிழில் ‘போருக்காக ஆயத்தப்படுத்துங்கள்’ என்பது இயல்பான இராணுவச் சொற்றொடர்.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: அவர்கள் மீதியானுக்கு எதிராகச் சென்று
  rationale: היה על என்ற பகைமைச் சூழல் சொற்றொடர் மீதியானுக்கு எதிரான படை நடவடிக்கையை உணர்த்துகிறது. ‘சென்று’ என்பது தமிழில் இயல்பான இயக்கத்தை வெளிப்படுத்தினாலும், தாக்குதல் என மிகைப்படுத்தவில்லை.
- source_word: לָתֵת נִקְמַת
  choice: பழிவாங்குதலை நிறைவேற்ற
  rationale: சொல்லளவில் ‘பழிவாங்குதலைக் கொடுக்க’ என்றிருந்தாலும், இக்கூட்டுச்சொல்லின் பொருள் அதைச் செயல்படுத்துவது; ‘நிறைவேற்ற’ என்பது இயல்பான தமிழ்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயராகிய நான்கு எழுத்துப் பெயரைத் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: בְּמִדְיָן
  choice: மீதியான்மேல்
  rationale: பழிவாங்குதலின் இலக்காக மீதியான் இருப்பதைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: נִקְמַת יְהוָה என்ற தொடரில் தெய்வீகப் பழிவாங்குதலின் தொடர்பு
  choice: யெகோவாவின் பழிவாங்குதல்
  alternative: யெகோவாவுக்காகச் செய்யும் பழிவாங்குதல்
  rationale: எபிரெயக் கட்டமைப்பு யெகோவாவுக்குரிய பழிவாங்குதல் அல்லது அவர் சார்பாக நிறைவேற்றப்படும் பழிவாங்குதல் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது. முதன்மை உரை இயல்பான உடைமைத் தொடரைப் பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. போர்ச் சூழலின் கடுமையும் மூலத்தில் உள்ள இறையியல் பதற்றமும் மென்மைப்படுத்தப்படவில்லை.
