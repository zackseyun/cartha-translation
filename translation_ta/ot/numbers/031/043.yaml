  register: நவீன தரத் தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. ‘சபை’ என்பது இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது; மதப்பிரிவுசார் தனிப்பொருள் ஏற்றப்படவில்லை.
