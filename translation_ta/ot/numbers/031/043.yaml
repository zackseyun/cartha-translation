base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: ta
  text: மந்தையிலிருந்த சபைக்குரிய பாதி 337,500 ஆக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: இருந்தன
  rationale: எண்ணிக்கைப் பட்டியலில் விளைவான மொத்தத்தை இயல்பாகக் குறிக்கிறது; எண்ணப்படுவது மந்தை விலங்குகள் என்பதால் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: מֶחֱצַת הָעֵדָה
  choice: சபைக்குரிய பாதிப்பங்கில்
  rationale: மூலத்தின் தொடர்நிலை அமைப்பு, சபைக்கு ஒதுக்கப்பட்ட இரண்டு சம பங்குகளில் ஒன்றைக் குறிக்கிறது. ‘பாதிப்பங்கு’ என்பது இயல்பான தமிழில் அந்தப் பகிர்வைத் தெளிவாகச் சொல்கிறது.
- source_word: הָעֵדָה
  choice: சபை
  rationale: இங்கு இஸ்ரவேலின் கூடிய சமூகத்தைக் குறிக்கிறது; பிற்காலத் திருச்சபை என்ற தனிப்பட்ட பொருளைச் சேர்க்காமல், ஐந்தாகமச் சூழலுக்கு ஏற்ற மரியாதையான சொல்லாக உள்ளது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைக் கூட்டாகக் குறிக்கும். ‘மந்தை’ மூலத்தின் கூட்டுப்பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: எபிரெய எண்ணிக்கை 300,000 + 30,000 + 7,000 + 500 ஆகும். பட்டியல் சூழலில் எண்களால் எழுதுவது துல்லியத்தையும் வாசிப்பின் எளிமையையும் தருகிறது.
