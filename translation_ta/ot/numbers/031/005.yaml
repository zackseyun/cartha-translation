revisions:
- from: எனவே, இஸ்ரவேலின் ஆயிரக் குழுக்களிலிருந்து[a] ஒவ்வொரு கோத்திரத்திற்கும் ஆயிரம் பேர் போருக்காக அணிவகுக்கச் செய்யப்பட்டார்கள்[b]; மொத்தம் பன்னிரண்டாயிரம் பேர்.
  to: அவ்வாறு, இஸ்ரவேலின் ஆயிரங்களிலிருந்து[a], ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர் வீதம், போருக்காக ஆயுதம் ஏந்திய பன்னிரண்டாயிரம் பேர் ஒதுக்கப்பட்டார்கள்[b].
  rationale: The correction makes the tribal phrase explicitly ablative (“ஒவ்வொரு கோத்திரத்திலிருந்தும்”), separately renders the passive assignment verb with “ஒதுக்கப்பட்டார்கள்,” and represents the military descriptor with “போருக்காக ஆயுதம் ஏந்திய.” It also retains the source’s lexical ambiguity concerning “thousands” and the assignment verb in appropriately anchored notes.
