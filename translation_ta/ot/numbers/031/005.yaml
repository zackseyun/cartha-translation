  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: ta
  text: அவ்வாறு, இஸ்ரவேலின் ஆயிரங்களிலிருந்து[a], ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர் வீதம், போருக்காக ஆயுதம் ஏந்திய பன்னிரண்டாயிரம் பேர் ஒதுக்கப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் ஆயிரங்கள்” என்பது எண்ணிக்கையான ஆயிரங்களையே அல்லாமல், இஸ்ரவேலின் பெரிய குலப் பிரிவுகளையோ படைப் பிரிவுகளையோ குறிக்கவும்லாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஒப்படைக்கப்பட்டார்கள்,” “வழங்கப்பட்டார்கள்,” அல்லது “திரட்டப்பட்டார்கள்”; எபிரெய வினைச்சொல் பணிக்காக அளிக்கப்படுதல் அல்லது நியமிக்கப்படுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: அணிவகுக்கச் செய்யப்பட்டார்கள்
  rationale: நிபால் வினைவடிவம் ஆட்கள் படைப்பணிக்காக ஒப்படைக்கப்பட்ட அல்லது திரட்டப்பட்ட செயப்பாட்டு நுணுக்கத்தைக் கொண்டுள்ளது. இராணுவச் சூழலில் இயல்பாக இருக்கவும், வெறும் ‘ஒப்படைக்கப்பட்டார்கள்’ என்பதைக் காட்டிலும் நோக்கத்தைத் தெளிவாக உணர்த்தவும் இத்தேர்வு செய்யப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆயிரக் குழுக்களிலிருந்து
  rationale: אַלְפֵי என்பது எண்ணிக்கையான ‘ஆயிரங்கள்’ என்பதோடு குல அல்லது படைப் பிரிவுகளையும் குறிக்கலாம். ‘ஆயிரக் குழுக்கள்’ என்ற மொழிபெயர்ப்பு எண்ணிக்கையையும் அமைப்புசார் நுணுக்கத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திற்கும் ஆயிரம் பேர்
  rationale: 'לַמַּטֶּה இச்சூழலில் பகிர்ந்தளிக்கும் பொருளுடையது: ஒவ்வொரு கோத்திரத்திற்கும் ஆயிரம் பேர். தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டுள்ளது.'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: மொத்தம் பன்னிரண்டாயிரம் பேர்
  rationale: பன்னிரண்டு கோத்திரங்களிலிருந்து வந்த படையின் மொத்த எண்ணிக்கையைச் சுருக்கமாகக் குறிக்கிறது; தமிழில் தொடர்பைத் தெளிவாக்க ‘மொத்தம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: חֲלוּצֵי צָבָא
  choice: போருக்காக அணிவகுக்கச் செய்யப்பட்டார்கள்
  rationale: חֲלוּצֵי என்பது போருக்கு ஆயத்தப்படுத்தப்பட்ட, ஆயுதம் தரித்த அல்லது அணிவகுத்த படையினரைச் சுட்டுகிறது. ‘போருக்காக அணிவகுக்கச் செய்யப்பட்டார்கள்’ என்பது இராணுவ ஆயத்தத்தையும் படையாகத் திரட்டப்பட்ட நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
