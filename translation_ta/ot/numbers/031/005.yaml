translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியிலுள்ள ‘ஆயிரங்கள்/குழுப் பிரிவுகள்’ மற்றும் ‘ஒப்படைத்தல்/திரட்டுதல்’ ஆகிய இரு சொற்பொருள் தெளிவின்மைகளும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
