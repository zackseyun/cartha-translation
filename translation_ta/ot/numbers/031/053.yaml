base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/053.yaml
  text: The men of the army had each taken plunder for himself[a].
translation:
  language: ta
  text: படை வீரர்கள் ஒவ்வொருவரும் தமக்கெனக் கொள்ளைப் பொருளை எடுத்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் நெருக்கமான வடிவில்: “படை வீரர்கள் கொள்ளையிட்டிருந்தார்கள்—ஒவ்வொருவரும் தமக்காக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: படை வீரர்கள்
  rationale: கட்டுநிலைத் தொடரான இச்சொற்றொடர் படையில் இருந்த ஆண்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘படை வீரர்கள்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: בָּזְזוּ
  choice: கொள்ளைப் பொருளை எடுத்திருந்தார்கள்
  rationale: בזז என்பது கொள்ளையிடுதல் அல்லது கொள்ளைப் பொருளை எடுத்தல் என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘கொள்ளைப் பொருளை எடுத்திருந்தார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: אִישׁ לוֹ
  choice: ஒவ்வொருவரும் தமக்கென
  rationale: இது செயலைத் தனித்தனியாகப் பகிர்ந்துரைக்கும் தொடர்; ஒவ்வொரு வீரரும் தனக்காக எடுத்துக்கொண்டார் என்ற கருத்தை ‘ஒவ்வொருவரும் தமக்கென’ இயல்பாகப் பாதுகாக்கிறது.
