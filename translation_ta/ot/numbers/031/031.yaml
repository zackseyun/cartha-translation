base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: ta
  text: மோசேயும் ஆசாரியனாகிய எலெயாசாரும், யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; இது பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் மூல வடிவத்தையும் பாரம்பரிய மாற்று மொழியாக்கத்தையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்கள்
  rationale: עשה என்ற வினை இங்கு முந்தைய கட்டளைக்குக் கீழ்ப்படிந்து அதை நிறைவேற்றியதைச் சுருக்கமாகக் குறிக்கிறது; தமிழில் ‘செய்தார்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: מֹשֶׁה וְאֶלְעָזָר
  choice: மோசேயும் எலெயாசாரும்
  rationale: இரு நபர்களும் இணைந்த எழுவாயாக இருப்பதைத் தமிழின் ‘உம்…உம்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: எலெயாசாரின் அதிகாரப்பூர்வப் பணிநிலையை விளக்கும் இணைப்புப் பெயராக இருப்பதால், ‘ஆசாரியனாகிய’ என்பது தமிழில் தெளிவான அமைப்பு.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: கட்டளைக்கு முழுமையாக ஒத்துச் செயல்பட்டனர் என்ற conformity கருத்தை ‘படியே’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் நேரடிப் பொருள் ‘கட்டளையிடுதல்’; செயல் நிகழ்வதற்கு முன்னரே கட்டளை கொடுக்கப்பட்டிருந்தது என்பது தமிழ் வினையெச்ச அமைப்பில் இயல்பாக விளங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: את என்பது மொழிபெயர்க்கப்படாத நேரடி வேற்றுமைச் சுட்டி; צוה வினையின் பெறுநரைத் தமிழில் இயல்பாக நான்காம் வேற்றுமையான ‘மோசேக்கு’ எனக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; ‘யெகோவா’ தமிழில் பரவலாக அறியப்பட்ட வடிவம். ‘யாவே’ என்பது மற்றொரு சாத்தியமான ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. எபிரேய வாக்கியத்தின் கீழ்ப்படிதல் சார்ந்த ‘கட்டளையிட்டபடியே செய்தார்கள்’ என்ற அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
