  source_fidelity: மூலத்தின் שָׂא אֶת־רֹאשׁ என்ற கணக்கெடுக்கும் மரபுத்தொடர் ‘மொத்த எண்ணிக்கையை ... கணக்கிடுங்கள்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது. מַלְקוֹחַ הַשְּׁבִי என்பது போரில் பிடிக்கப்பட்ட கொள்ளையைக் குறிக்கும் என்பதும், அதில் மனிதர்களும் கால்நடைகளும் அடங்குவது என்பதும் பாதுகாக்கப்பட்டுள்ளது. மோசே, ஆசாரியன் எலெயாசார், சபையின் தந்தைவழிக் குடும்பத் தலைவர்கள் ஆகியோரின் பங்கும் மூலத்துக்கு ஏற்ப உள்ளது.
  naturalness: நவீனத் தரத் தமிழில் வாசகம் இயல்பாகவும் தெளிவாகவும் உள்ளது. பன்மை ஏவல் ‘கணக்கிடுங்கள்’ இணைந்து செயற்பட வேண்டிய பட்டியலிடப்பட்ட குழுவுக்கு ஏற்றது. நிறுத்தக்குறிகளும் இடைச்செருகல் அமைப்பும் வாசிப்பைத் தெளிவாக்குகின்றன.
  terminology: ‘கொள்ளை,’ ‘கால்நடைகள்,’ ‘ஆசாரியன்,’ ‘சபை,’ ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ ஆகியவை சூழலுக்கும் பதிவுக்கும் ஏற்றவை. ‘மனிதர்கள்’ என்பதற்கான அடிக்குறிப்பு, אָדָם மனிதர்களைக் கால்நடைகளிலிருந்து வேறுபடுத்துவதைச் சரியாக விளக்குகிறது. இரண்டாம் அடிக்குறிப்பு ரָאשֵׁי אֲבוֹת என்பதற்கான ஏற்ற மாற்று வாசிப்புகளை அளிக்கிறது.
