base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: ta
  text: “பிடிக்கப்பட்ட கொள்ளையின் மொத்த எண்ணிக்கையை—மனிதர்களையும்[a] கால்நடைகளையும்—நீயும் ஆசாரியனாகிய எலெயாசாரும் சபையின் தந்தைவழிக் குடும்பத் தலைவர்களும்[b] கணக்கிடுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதர்கள்’ என்பது இங்கு கால்நடைகளுக்கு மாறாக மனித உயிர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சபையின் மூதாதையர் குடும்பங்களின் தலைவர்கள்’; இன்னும் இயல்பாக, ‘குலத் தலைவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: மொத்த எண்ணிக்கையை ... கணக்கிடுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘தலையை உயர்த்து’ என்பதல்ல; இங்கு முழுத் தொகையைக் கணக்கெடுக்கும்படி கூறும் எபிரேய மரபுத்தொடர்.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: பிடிக்கப்பட்ட கொள்ளை
  rationale: போரில் கைப்பற்றப்பட்ட மனிதர்களையும் விலங்குகளையும் உள்ளடக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘சிறைப்பட்டவர்கள்’ என்று மனிதர்களுக்கு மட்டும் வரையறுக்கவில்லை.
- source_word: בָּאָדָם
  choice: மனிதர்கள்
  rationale: இங்கு אָדָם என்பது கால்நடைகளுக்கு எதிராக மனித உயிர்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: சூழலில் போரில் பிடிக்கப்பட்ட வளர்ப்பு விலங்குகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אַתָּה
  choice: நீயும்
  rationale: மோசேயின் பங்கை வலியுறுத்தும் வெளிப்படையான ஒருமை முன்னிலைப் பெயரைப் பாதுகாக்கிறது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: பெயரை ஒலிபெயர்த்து, பதவியை தமிழில் தெளிவாக வழங்குகிறது.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: சபையின் தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: சபைக்குள் உள்ள மூதாதையர்/தந்தைவழி குடும்ப அலகுகளின் தலைவர்களைச் சுட்டும் சமூக அமைப்பை முடிந்தவரைத் துல்லியமாகப் பாதுகாக்கிறது.
