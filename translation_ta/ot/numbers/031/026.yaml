  register: நவீனத் தரத் தமிழில், கட்டளையின் மரியாதையும் நிர்வாகத் துல்லியமும் காக்கப்பட்டுள்ளன. மனிதர்களும் கால்நடைகளும் ஒரே போர்க் கைப்பற்றலின் பகுதிகளாக வருவதால், மூலத்தின் கடினமான நெறியியல் பதற்றம் மென்மையாக்கப்படவில்லை.
