source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: ta
  text: மனிதர்கள் பதினாறாயிரம் பேர்; அவர்களிலிருந்து யாவேக்காக ஒதுக்கப்பட்ட பங்கு[a] முப்பத்திரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒதுக்கப்பட்ட பங்கு’ என்பதற்கு ‘விதிக்கப்பட்ட பங்கு’ அல்லது ‘தீர்வை’ என்றும் மொழிபெயர்க்கலாம். போரில் கைப்பற்றப்பட்டவற்றிலிருந்து கணக்கிட்டு யாவேக்கெனத் தனியாகப் பிரிக்கப்பட்ட பகுதியை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: மனிதர்கள் ... பேர்
  rationale: இங்கு இந்தச் சொற்றொடர் விலங்குகளிலிருந்து மனிதர்களை வேறுபடுத்தி, அவர்களை எண்ணும் வழக்கில் பயன்படுத்தப்படுகிறது. தமிழில் ‘மனிதர்கள்’ என்றும் எண்ணிக்கையுடன் ‘பேர்’ என்றும் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: பதினாறாயிரம்
  rationale: எபிரெய எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
- source_word: מִכְסָם
  choice: அவர்களிலிருந்து ... ஒதுக்கப்பட்ட பங்கு
  rationale: போரில் கைப்பற்றப்பட்டவற்றிலிருந்து கணக்கிட்டு யாவேக்கெனப் பிரித்தளிக்கப்பட்ட பகுதியை இச்சூழலில் குறிக்கிறது. ‘வரி’ என்ற சொல்லைவிட ‘ஒதுக்கப்பட்ட பங்கு’ சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: לְ முன்னொட்டு இங்கு யாவேக்கு உரியதாக அர்ப்பணித்தல் அல்லது ஒதுக்குதல் என்ற பொருளைக் குறிக்கிறது; திருப்பெயர் יהוה ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: முப்பத்திரண்டு பேர்
  rationale: נֶפֶשׁ இங்கும் தனித்தனி மனிதர்களை எண்ணும் சொல்லாக இருப்பதால், தமிழின் இயல்பான மனிதர் எண்ணுப்பெயரான ‘பேர்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக இடம்பெறுவதால், பட்டப்பெயராக மாற்றாமல் உடன்படிக்கையின் பெயரை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: נֶפֶשׁ אָדָם என்பதன் மனிதர் குறிப்பு
  choice: மனிதர்கள் ... பேர்
  alternative: மனித உயிர்கள்
  rationale: இது மனித ஆன்மாவின் இயல்பைப் பற்றிய கருத்துரையல்ல; விலங்குகளுக்கு மாறாக மனிதர்களைக் கணக்கிடும் நிர்வாகப் பட்டியல் மொழி. ஆகவே தேவையற்ற மெய்யியல் பொருளைச் சேர்க்காமல் மனிதர்களையே குறிக்கும் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘மனிதர்கள் ... பேர்’ என்பது மூலத்தின் மனிதர்/விலங்கு வேறுபாட்டை இயல்பாகத் தெரிவிக்கிறது; ‘அவர்களிலிருந்து’ என்பது மனிதர்களின் எண்ணிக்கையிலிருந்து அந்தப் பங்கு எடுக்கப்பட்டது என்பதைத் தெளிவாக்குகிறது.
