  source_fidelity: 'மூல எபிரெயத்தின் இரண்டு எண்ணிக்கைகளும் துல்லியமாக உள்ளன: மனிதர்கள் பதினாறாயிரம்; யாவேக்கான மிக்கெஸ்/ஒதுக்கீடு முப்பத்திரண்டு மனிதர்கள். נֶפֶשׁ אָדָם என்பதன் மனிதர்-எண்ணிக்கைப் பொருளை ‘மனிதர்கள் ... பேர்’ இயல்பாக வெளிப்படுத்துகிறது; இறுதி נָפֶשׁ-க்கும் ‘பேர்’ சரியாகப் பொருந்துகிறது. ‘அவர்களிலிருந்து’ என்பது இந்த ஒதுக்கீடு மனிதர்களின் தொகையிலிருந்து எடுக்கப்பட்டது என்பதைச் சரியாகக் காட்டுகிறது.'
  naturalness: ‘மனிதர்கள் பதினாறாயிரம் பேர்; அவர்களிலிருந்து யாவேக்காக ஒதுக்கப்பட்ட பங்கு முப்பத்திரண்டு பேர்’ என்பது நவீன நிலையான தமிழில் சுருக்கமான கணக்குப்பட்டியல் நடையாக இயல்பாக உள்ளது. அரைப்புள்ளி இரு இணை எண்ணிக்கைக் குறிப்புகளைத் தெளிவாகப் பிரிக்கிறது.
  terminology: யாவே என்பது יהוה-வின் பெயர்த் தன்மையைப் பாதுகாக்கும் தேர்வு. מִכְסָם என்பதற்கு ‘ஒதுக்கப்பட்ட பங்கு’ சூழலுக்கு ஏற்றது; அடிக்குறிப்பில் உள்ள ‘விதிக்கப்பட்ட பங்கு’ மற்றும் ‘தீர்வை’ மாற்றுவழிகள் சொல்லின் வரி/விதிப்பு சார்ந்த நுணுக்கத்தையும் போர்க் கொள்ளையிலிருந்து பிரித்துப் படைக்கும் சூழலையும் உரியவாறு விளக்குகின்றன.
