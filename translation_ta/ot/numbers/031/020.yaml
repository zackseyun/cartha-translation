source:
  edition: WLC
  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: ta
  text: ஒவ்வோர் ஆடையையும், தோலால் செய்யப்பட்ட ஒவ்வொரு பொருளையும், வெள்ளாட்டு முடியால் செய்யப்பட்ட ஒவ்வொரு பொருளையும், மரத்தால் செய்யப்பட்ட ஒவ்வொரு பொருளையும் தூய்மைப்படுத்துங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்.” எபிரெய வினை பிரதிபெயர்ச்சி வடிவில் உள்ளது; இங்கு அது சடங்குத் தூய்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: இச்சொல் பொதுவாக ஆடை அல்லது உடையாகப் பயன்படுத்தப்படும் துணிப் பொருளைக் குறிக்கிறது; பட்டியல் நடைக்கு இயல்பாக ‘ஆடை’ பொருந்துகிறது.
- source_word: כְּלִי עוֹר
  choice: தோலால் செய்யப்பட்ட பொருள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டும் அல்லாமல் பலவகைப் பொருட்களையும் கருவிகளையும் குறிக்கலாம். இங்கு பொருளின் மூலப்பொருள் அடிப்படையில் பட்டியலிடப்படுவதால் இவ்விரிவான மொழிபெயர்ப்பு பொருத்தமானது.
- source_word: מַעֲשֵׂה עִזִּים
  choice: வெள்ளாட்டு முடியால் செய்யப்பட்ட பொருள்
  rationale: מַעֲשֵׂה என்பது செய்யப்பட்ட வேலை அல்லது செய்யப்பட்ட பொருளைக் குறிக்கிறது. עִזִּים நேரடியாக ‘வெள்ளாடுகள்’ என்றாலும், இத்தகைய பொருட் பட்டியலில் வெள்ளாட்டு முடியால் செய்யப்பட்ட துணி அல்லது பொருள் எனப் புரிவது இயல்பானது.
- source_word: כְּלִי עֵץ
  choice: மரத்தால் செய்யப்பட்ட பொருள்
  rationale: כְּלִי என்பதன் பரந்த பொருளைத் தக்கவைத்து, பட்டியலில் குறிப்பிடப்படும் மூலப்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: תִּתְחַטָּאוּ
  choice: தூய்மைப்படுத்துங்கள்
  rationale: חטא வேரின் ஹித்பயேல் வடிவம் சடங்குத் தூய்மையைச் சுட்டுகிறது. முன்னிலையில் நிற்கும் பொருட்கள் நேரடி செயப்படுபொருள்களாகப் புரிந்துகொள்ளப்படுவதால், தமிழில் அவற்றைத் ‘தூய்மைப்படுத்துங்கள்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது; வடிவத்தின் பிரதிபெயர்ச்சித் தன்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: போருக்குப் பிந்தைய சடங்குத் தூய்மையும் வினையின் பிரதிபெயர்ச்சி வடிவமும்
  choice: பட்டியலிடப்பட்ட பொருட்களைச் சடங்குப்படி தூய்மைப்படுத்த வேண்டும் என மொழிபெயர்த்தல்
  alternative: ‘உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்’
  rationale: வினை வடிவம் பிரதிபெயர்ச்சிப் பொருளை அனுமதித்தாலும், இவ்வசனத்தில் அதற்கு முன் வரும் குறியிடப்பட்ட பொருட்களின் பட்டியல் அவற்றையே தூய்மைப்படுத்தும் கட்டளையாகப் புரிந்துகொள்ள வலுவான தொடரியல் ஆதாரமளிக்கிறது. இருப்பினும் வடிவிலுள்ள உண்மையான இருபொருள்தன்மை அடிக்குறிப்பில் தரப்படுகிறது; பாவமன்னிப்பு அல்லது பிற்கால இறையியல் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலின் மீளுருவாக்கத்தைப் பேண ‘ஒவ்வொரு’ என்றும், பொருட்களின் மூலப்பொருள் வகைப்பாட்டைத் தெளிவாக்க ‘செய்யப்பட்ட பொருள்’ என்றும் வழங்கப்பட்டுள்ளது.
