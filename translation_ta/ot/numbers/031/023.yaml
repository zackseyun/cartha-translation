base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: ta
  text: நெருப்பில் செலுத்தக்கூடிய ஒவ்வொரு பொருளையும் நெருப்பில் செலுத்துங்கள்; அப்போது அது சுத்தமாகும். ஆனால், தீட்டுநீக்கும் நீரால்[a] அது தூய்மைப்படுத்தப்பட வேண்டும். நெருப்பில் செலுத்த முடியாத ஒவ்வொரு பொருளையும் தண்ணீரில் செலுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “தீட்டின் நீரால்”; மரபுவழியாக, “பிரித்தலின் நீரால்” (எண்ணாகமம் 19-ஐ ஒப்பிடுக).'
    reason: lexical_alternative
lexical_decisions:
