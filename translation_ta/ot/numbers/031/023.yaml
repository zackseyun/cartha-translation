  choice: ஒவ்வொரு பொருளையும்
  rationale: சூறையாடப்பட்ட தனித்தனி பொருட்கள் அனைத்தையும் பகிர்ந்தளிக்கும் பொருளில் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: நெருப்பில் செலுத்தக்கூடிய
  rationale: உண்மையில் நெருப்புக்குள் செல்வதை மட்டும் அல்லாமல், நெருப்பால் சுத்திகரிக்கத் தகுந்த பொருட்களைக் குறிக்கும் நடைமுறைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: நெருப்பில் செலுத்துங்கள்
  rationale: עבר என்பதன் ஹிஃபில் வடிவிலுள்ள ‘கடக்கச் செய்தல்/செலுத்துதல்’ என்ற காரணவினைப் பொருளைப் பேணுகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அது சுத்தமாகும்
  rationale: நெருப்பில் செலுத்தப்பட்ட பின் ஏற்படும் சுத்தநிலையை விளக்குகிறது; அடுத்த சொற்றொடரில் கூறப்படும் கூடுதல் சடங்குமுறைத் தூய்மைப்படுத்துதலிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முந்தைய கூற்றுக்கு முக்கியமான தகுதிப்பாட்டைச் சேர்க்கும் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּמֵי נִדָּה
  choice: தீட்டுநீக்கும் நீரால்
  rationale: எண்ணாகமம் 19-இன் பின்னணியில் சடங்குமுறைத் தீட்டை நீக்கப் பயன்படுத்தப்படும் சிறப்பு நீரைத் தெளிவாகக் குறிக்கிறது; எபிரெயக் கட்டமைப்பின் வேறு நேரடி மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יִתְחַטָּא
  choice: அது தூய்மைப்படுத்தப்பட வேண்டும்
