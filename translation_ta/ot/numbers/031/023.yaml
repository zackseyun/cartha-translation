- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: நெருப்பில் செலுத்த முடியாத ஒவ்வொரு பொருளையும்
  rationale: நெருப்பைத் தாங்கக்கூடிய பொருட்களுக்கும் தாங்க முடியாத பொருட்களுக்கும் இடையிலான நடைமுறை வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: தண்ணீரில் செலுத்துங்கள்
  rationale: நெருப்பைப் பற்றிய முந்தைய கட்டளையுடன் உள்ள ஒரே காரணவினை மற்றும் இணை அமைப்பைப் பேணுகிறது; ‘கழுவுங்கள்’ என்று பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் தூய்மைப்படுத்துதல் குறித்த மொழியின் இயல்பு
  choice: ஒழுக்கப்பாவை நீக்குதல் என்று அல்லாமல், சடங்குமுறைத் தீட்டு மற்றும் தூய்மைப்படுத்துதல் என்ற பொருளில் மொழிபெயர்த்தல்
  alternative: ‘கழுவுதல்’ போன்ற பொதுவான சொல்லைப் பயன்படுத்துதல் அல்லது חטא என்ற வேரை பாவநீக்கத்துடன் தொடர்புபடுத்துதல்
  rationale: எண்ணாகமம் 31 மற்றும் அதனுடன் தொடர்புடைய எண்ணாகமம் 19 ஆகியவற்றில் பொருட்கள் தீட்டிலிருந்து சடங்குமுறையாகத் தூய்மைப்படுத்தப்படுவதே கருத்து; ஒழுக்கக் குற்றத்திற்கான மன்னிப்பு இங்கு பேசப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘சுத்தமாகும்’ என்பது விளைவுநிலையையும், ‘தூய்மைப்படுத்தப்பட வேண்டும்’ என்பது கூடுதல் சடங்குமுறைத் தேவையையும் வேறுபடுத்துகிறது.
