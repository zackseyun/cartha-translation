  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: ta
  text: பொன், வெள்ளி, வெண்கலம்[a], இரும்பு, வெள்ளீயம், ஈயம் ஆகியவற்றை மட்டும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்பு.’ எபிரெயச் சொல் செம்பையும் செம்பை அடிப்படையாகக் கொண்ட கலவை உலோகத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால் … மட்டும்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து ஒரு வரம்பிடப்பட்ட விதிவிலக்கை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஆனால்’ மற்றும் பட்டியலின் இறுதியில் வரும் ‘மட்டும்’ இணைந்து இந்த வரம்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: הַזָּהָב
  choice: பொன்
  rationale: இங்கு உலோகத்தைக் குறிக்கும் זָהָב என்பதன் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: הַכָּסֶף
  choice: வெள்ளி
  rationale: இது உலோகங்களின் பட்டியல் என்பதால் כֶּסֶף இங்கு ‘பணம்’ அல்ல, ‘வெள்ளி’ எனப் பொருள்படுகிறது.
- source_word: הַנְּחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ செம்புக் கலவை உலோகமான வெண்கலத்தையோ குறிக்கலாம்; வேதாகம உலோகப் பட்டியல்களில் இயல்பான மரபுச் சொல்லாக ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது; ‘செம்பு’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: הַבַּרְזֶל
  choice: இரும்பு
  rationale: בַּרְזֶל என்பதற்கான நேரடியான, வழக்கமான தமிழ் சொல்.
- source_word: הַבְּדִיל
  choice: வெள்ளீயம்
  rationale: בְּדִיל உலோகப் பட்டியல்களில் பொதுவாக tin என்பதைக் குறிக்கிறது; அதற்கான துல்லியமான நவீனத் தமிழ் சொல் ‘வெள்ளீயம்’.
- source_word: הָעֹפָרֶת
  choice: ஈயம்
  rationale: עֹפָרֶת என்பதற்கான வழக்கமான தமிழ் உலோகப் பெயர்.
- source_word: אֵת (மீண்டும் மீண்டும்)
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் குறியீடு ஒவ்வொரு பெயருக்கும் முன் வந்து பட்டியலை வலியுறுத்துகிறது; தமிழில் பட்டியல் அமைப்பும் ‘ஆகியவற்றை’ என்ற செயப்படுபொருள் வடிவமும் அதன் இலக்கணப் பணியை இயல்பாகச் செய்கின்றன.
