base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: ta
  text: போர்ப்படையினர் கொள்ளையிட்ட சூறைப்பொருளில் மீதியாக இருந்த கைப்பற்றிய பொருள்[a] 675,000 செம்மறியாடுகளாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளைப்பொருள்.” இங்கு எபிரேயம் போரில் கைப்பற்றப்பட்டவற்றைக் குறிக்கும் நெருங்கிய பொருளுடைய இரண்டு சொற்களை (מַלְקוֹחַ, בָּז) பயன்படுத்துகிறது; அவை இங்கு முறையே “கைப்பற்றிய பொருள்,” “சூறைப்பொருள்” என்று மொழிபெயர்க்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்த ... (தமிழ் வாக்கியத்தில் ‘மீதியிருந்த’ மற்றும் பெயர்ப் பயனிலை அமைப்பால் வெளிப்படுத்தப்பட்டது)
  rationale: இது பட்டியல் விவரத்தைத் தொடரும் இருப்பு/இணைப்புச் சொல். மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: הַמַּלְקוֹחַ
  choice: கொள்ளைப்பொருள்
  rationale: போரில் கைப்பற்றப்பட்டவற்றைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יֶתֶר הַבָּז
  choice: சூறைப்பொருளில் மீதியிருந்த
  rationale: יֶתֶר என்பதன் ‘மீதி’ என்ற பொருளையும், அதைத் தொடர்ந்து வரும் הַבָּז உடனான தொடர்பையும் தெளிவான தமிழ் சொற்றொடராகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: கொள்ளையிட்ட
  rationale: בזז என்ற வினையின் போர்க்கொள்ளை எடுக்கும் செயலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עַם הַצָּבָא
  choice: படையைச் சேர்ந்தவர்கள்
  rationale: சொல்லுக்கு சொல் ‘படையின் மக்கள்’ என்பது தமிழில் இயல்பற்றது; இத்தேர்வு படையுடன் தொடர்புடைய மனிதர்களைக் குறிக்கும் மூலப்பொருளைப் பாதுகாக்கிறது.
- source_word: צֹאן
  choice: செம்மறியாடுகள்
  rationale: இந்தக் கால்நடை எண்ணிக்கைப் பட்டியலில் பொருத்தமான, வாசகருக்குத் தெளிவான தேர்வு; எபிரேயச் சொல் சில சூழல்களில் சிறிய மந்தை விலங்குகளை விரிவாகக் குறிக்கலாம்.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675,000
  rationale: 600,000 + 70,000 + 5,000 என்ற துல்லியமான மொத்தத்தை எண் வடிவில் வாசிக்க எளிதாகத் தருகிறது.
