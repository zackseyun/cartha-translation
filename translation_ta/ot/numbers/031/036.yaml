lexical_decisions:
- source_word: וַתְּהִי
  choice: இருந்தது
  rationale: இங்கு היה என்ற வினை பிரிக்கப்பட்ட பங்கின் மொத்தத்தை அறிமுகப்படுத்துகிறது; எளிய இணைப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַמֶּחֱצָה
  choice: அந்தப் பாதி
  rationale: முந்தைய சூழலில் இரண்டாகப் பிரிக்கப்பட்ட கொள்ளைப்பொருளின் ஒரு பாதியைக் குறிக்கிறது; சுட்டுப்பொருளைத் தமிழில் தெளிவாக்க ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: ‘அந்தப் பாதி’ என்பதுடன் விளக்கநிலையில் வந்து, அது யாருக்குரிய பங்கு என்பதைச் சொல்கிறது.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: போருக்குச் சென்றவர்கள்
  rationale: சொல்லுக்கு சொல் ‘படையில் புறப்பட்டவர்கள்’; இச்சூழலில் போரில் பங்கேற்றவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: מִסְפַּר הַצֹּאן
  choice: 337,500 செம்மறியாடுகளாக
  rationale: எண்ணிக்கையை அறிமுகப்படுத்தும் எபிரெய அமைப்பைத் தமிழில் இயல்பான எண்ணிக்கைப் பயனிலையாக மாற்றுகிறது; צֹאן இங்கு எண்ணப்பட்ட செம்மறியாடுகளைக் குறிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
