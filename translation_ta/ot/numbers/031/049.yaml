  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க நேரடி உரையாக அமைக்கப்பட்டுள்ளது. மோசேயை நோக்கிய பணிவான சுயக்குறிப்பை இயல்பாக வெளிப்படுத்த ‘உமது பணியாளர்களாகிய நாங்கள்’ பயன்படுத்தப்பட்டது; படைச் சூழலும் ஆண் போராளிகள் என்ற மூலத்தின் குறிப்பும் காக்கப்பட்டுள்ளன.
