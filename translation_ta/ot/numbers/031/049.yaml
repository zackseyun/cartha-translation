source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: ta
  text: அவர்கள் மோசேயிடம், “உமது பணியாளர்களாகிய நாங்கள், எங்கள் கட்டுப்பாட்டில்[b] இருந்த போரிடும் ஆண்களைக் கணக்கெடுத்தோம்[a]; எங்களில் ஓர் ஆண்கூடக் காணாமற்போகவில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நேர் மொழிபெயர்ப்பு: ‘போரிடும் ஆண்களின் தலையை உயர்த்தினோம்.’ இது கணக்கெடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘எங்கள் பொறுப்பில்.’ சொல்லுக்கு நேர் மொழிபெயர்ப்பு: ‘எங்கள் கையில்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களாகிய நாங்கள்
  rationale: பேசுகிற படைத்தலைவர்கள் மோசேயிடம் பணிவுடன் தங்களைக் குறிப்பிடுகிறார்கள். இங்கு அடிமைநிலை அல்ல, மரியாதையும் கீழ்ப்படிதலும் முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ இயல்பானது; தமிழில் நேரடியான உரைக்காக ‘நாங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: கணக்கெடுத்தோம்
  rationale: சொல்லுக்கு நேர் வடிவம் ‘தலையை உயர்த்தினோம்’ என்றாலும், நிர்வாக மற்றும் படைச் சூழலில் இது ஆட்களை எண்ணிக் கணக்கெடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போரிடும் ஆண்கள்
  rationale: இந்தத் தொடர் போரில் ஈடுபட்ட ஆண் வீரர்களைக் குறிப்பதால், பாலினத்தையும் படைச் செயலையும் வெளிப்படையாகக் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: எங்கள் கட்டுப்பாட்டில் இருந்த
  rationale: சொல்லுக்கு நேர் பொருள் ‘எங்கள் கையில் இருந்த’ என்பது. இந்தப் படைச் சூழலில் அது அவர்களுடைய அதிகாரம் அல்லது பொறுப்பின்கீழ் இருந்ததைக் குறிக்கிறது; ‘கட்டுப்பாட்டில்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: எங்களில் ஓர் ஆண்கூடக் காணாமற்போகவில்லை
  rationale: இந்தச் சூழலில் נפעל வடிவிலுள்ள פקד, கணக்கில் இல்லாமற்போதல் அல்லது காணாமற்போதலைக் குறிக்கிறது. போருக்குப் பின் அவர்களில் ஒருவரும் இழக்கப்படவில்லை என்ற கருத்தை இவ்வாக்கியம் தெளிவாகத் தருகிறது.
