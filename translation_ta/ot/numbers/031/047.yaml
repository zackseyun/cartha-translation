base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: இஸ்ரவேல் மகன்களுக்குரிய பாதியிலிருந்து[a], மோசே மனிதர்களிலிருந்தும் கால்நடைகளிலிருந்தும் ஐம்பதில் ஒன்றை[b] எடுத்து, யாவேயின் திருக்கூடாரப் பணியைக் காத்துவந்த லேவியர்களுக்குக் கொடுத்தார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “இஸ்ரவேலின் மகன்கள்”; இங்கு இஸ்ரவேலரைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'வேறுவகையில்: “ஒவ்வொரு ஐம்பதிலிருந்தும் எடுக்கப்பட்ட ஒரு பங்கை.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்குரிய பாதியிலிருந்து
  rationale: מַחֲצִית என்பது பங்கிடப்பட்ட பாதியைக் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள ‘மகன்கள்’ என்ற வடிவம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் இனக்குழுச் சுட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: ஐம்பதுக்கு ஒன்றை
  rationale: இது ஒவ்வொரு ஐம்பதிலிருந்தும் எடுக்கப்பட்ட ஒரு நபர் அல்லது விலங்கு என்ற வரிவிகிதத்தைக் குறிக்கிறது. தமிழில் சுருக்கமாகவும் இயல்பாகவும் அந்த விகிதம் தரப்படுகிறது; ‘எடுக்கப்பட்ட பங்கு’ என்ற பெயர்ச்சொல் நுட்பம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: மனிதர்களிலும் கால்நடைகளிலும்
  rationale: אָדָם இங்கு தனி ஆணை அல்ல, மனிதர்களைத் தொகுப்பாகக் குறிக்கிறது; בְּהֵמָה இச்சூழலில் வீட்டுவிலங்குகள் அல்லது கால்நடைகளைக் குறிக்கிறது.
- source_word: וַיִּתֵּן אֹתָם
  choice: அவற்றைக் கொடுத்தார்
  rationale: எபிரேயப் பன்மைச் சுட்டுப்பெயர் மனிதர்களையும் கால்நடைகளையும் சேர்ந்த முந்தைய தொகுப்பைச் சுட்டுகிறது. தமிழில் கலப்புத் தொகுப்பைக் குறிக்கும் பொதுப் பன்மை இயல்பாகப் பயன்படுத்தப்படுகிறது.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: யாவேயின் திருக்கூடாரத்தைக் கவனிக்கும் பொறுப்பை வகித்த
  rationale: שׁמר என்ற வேரும் அதனுடன் தொடர்புடைய מִשְׁמֶרֶת என்பதும் காவல், கவனிப்பு, ஒப்படைக்கப்பட்ட கடமை ஆகிய நுணுக்கங்களைக் கொண்டவை. ‘கவனிக்கும் பொறுப்பை வகித்த’ என்பது அவற்றை இயல்பான தமிழில் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר இங்கு முந்தைய கட்டளைக்கு ஏற்ப நடந்ததைத் தெரிவிக்கிறது; தமிழ் வாக்கியம் இயல்பாக இருக்க இறுதியில் ‘அவர் செய்தார்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவமும் பொருளும்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: முதன்மை உரை மூலத்தின் ‘மகன்கள்’ என்ற வெளிப்பாட்டைத் தக்கவைக்கிறது; இச்சூழலில் அது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: மனிதர்களும் கால்நடைகளும் லேவியர்களுக்குக் கொடுக்கப்படுதல்
  choice: மூலத்தின் ஒருங்கிணைந்த பன்மைச் சுட்டைத் தக்கவைத்தல்
  alternative: மனிதர்களை வேறு வகையில் விளக்கிப் பராப்ரேஸ் செய்தல்
  rationale: வசனம் மனிதர்களையும் கால்நடைகளையும் ஒரே வரிவிகிதத்தின்கீழ் குறிப்பிடும் கடினமான வரலாற்றுச் சொல்லாட்சியை அளிக்கிறது. அதன் நெறிசார் பதற்றத்தை விளக்கமிட்டு மென்மைப்படுத்தாமல் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திருக்கூடாரம்’ என்பது מִשְׁכָּן என்பதற்கான புரிந்துகொள்ளத்தக்க வழிபாட்டுச் சூழல் சொல். வரலாற்று உரையின் கடினத்தன்மையும் மனிதர்கள் மற்றும் கால்நடைகள் இணைத்துக் குறிப்பிடப்படும் மூலத்தின் பதற்றமும் மென்மைப்படுத்தப்படவில்லை.
