base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: ta
  text: மோசே ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேரைப் போருக்கு அனுப்பினார்; அவர்களோடு ஆசாரியனான எலெயாசாரின் மகன் பினெகாசையும் போருக்கு அனுப்பினார். பரிசுத்தப் பாத்திரங்களும்[a] போர்ச் சைகைக்கான எக்காளங்களும்[b] அவன் கையில் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்தின் பாத்திரங்கள்”; அல்லது, “பரிசுத்தப் பொருட்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அறிகுறி ஒலிக்கான எக்காளங்கள்”; அல்லது, “எச்சரிக்கை ஒலிக்கான எக்காளங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: கதைநடையில் שׁלח என்பதன் இயல்பான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேரை
  rationale: ஒவ்வொரு கோத்திரமும் அளித்த எண்ணிக்கையைக் குறிக்கும் பகிர்வுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַצָּבָא
  choice: போருக்கு
  rationale: இங்கு צבא என்பது ஒரு நிறுவனமாகிய படையைக் காட்டிலும் போர்ச் சேவை அல்லது போரைச் சுட்டுகிறது; எபிரெயச் சொல்லின் திசைநோக்குப் பொருளையும் இது காக்கிறது.
- source_word: אֹתָם ... אֹתָם
  choice: அவர்களை ... அவர்களையும்
  rationale: போர்வீரர்களை மீண்டும் சுட்டும் எபிரெய வலியுறுத்தலையும் இணைப்பையும் இயன்றவரை தக்கவைக்கிறது.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸ்
  rationale: பெயர்களை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் வழங்கி, உறவையும் ஆசாரிய அடையாளத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: பரிசுத்தப் பாத்திரங்கள்
  rationale: כְּלֵי என்பதன் பாத்திரங்கள் அல்லது கருவிகள் என்ற பரப்பையும் הַקֹּדֶשׁ என்பதன் வழிபாட்டுக்குரிய புனிதத் தன்மையையும் சுருக்கமாகக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: போர்முழக்கத்திற்கான எக்காளங்கள்
  rationale: חצוצרות என்பது எக்காளங்களையும் תרועה என்பது உரத்த முழக்கம் அல்லது அறிகுறி ஒலியையும் குறிக்கிறது; போர்ச் சூழலில் அதன் செயல்பாட்டை இத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: எபிரெய மொழியின் ஒருமை வடிவத்தையும் ‘கையில்’ என்ற நேரடி உருவகத்தையும் காக்கிறது; அருகிலுள்ள ஒருமை முன்னோடியான பினெகாசையே இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: போர்ப்பயணத்தில் பினெகாசும் பரிசுத்தப் பொருட்களும் வகிக்கும் பங்கு
  choice: பினெகாஸ் ஆசாரியப் பிரதிநிதியாகப் படையுடன் செல்வதையும், பரிசுத்தப் பாத்திரங்களும் அறிகுறி ஒலிக்கான எக்காளங்களும் அவன் கையில் இருப்பதையும் மட்டும் உரை கூறும் அளவில் வழங்குதல்.
  alternative: பினெகாஸ் வெறும் பார்வையாளராகச் சென்றார் என்று கூறுதல், அல்லது பரிசுத்தப் பாத்திரங்களின் ஆசாரியத் தொடர்பை மறுத்தல்.
  rationale: மூலவசனம் பினெகாசையும் பரிசுத்தப் பாத்திரங்களையும் எக்காளங்களையும் போர்ப்பயணத்தோடு நேரடியாக இணைக்கிறது; ஆனால் இதை விரிவான ‘புனிதப் போர்’ கோட்பாடாக மொழிபெயர்ப்பில் வளர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் உள்ள ‘அவர்களை’ மற்றும் ‘போருக்கு’ என்ற மீளுரைப்பை செயற்கையாகத் தோன்றாத அளவில் காக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது. ‘அவன்’ என்ற ஒருமைச் சுட்டுப்பெயர் மூலத்தின் வடிவத்தையும் பினெகாசை நோக்கிய இயல்பான சுட்டுதலையும் பாதுகாக்கிறது.
