revisions:
- from: மோசே அவர்களை—ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேரை—போருக்கு அனுப்பினார். அவர்களையும் ஆசாரியனான எலெயாசாரின் மகன் பினெகாசையும் போருக்கு அனுப்பினார்; பரிசுத்தப் பாத்திரங்களும்[a] போர்முழக்கத்திற்கான எக்காளங்களும்[b] அவன் கையில் இருந்தன.
