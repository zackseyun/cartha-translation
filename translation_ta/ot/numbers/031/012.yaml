  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: ta
  text: அவர்கள் சிறைபிடிக்கப்பட்டவர்களையும், கைப்பற்றப்பட்ட பொருட்களையும், கொள்ளைப்பொருள்களையும் மோசேயிடமும், ஆசாரியனாகிய எலெயாசாரிடமும், இஸ்ரவேல் மக்களின் சபையிடமும், எரிகோவுக்கு அருகே யோர்தான் ஆற்றங்கரையில் அமைந்திருந்த மோவாபின் சமவெளிகளிலுள்ள முகாமுக்கும் கொண்டுவந்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் புல்வெளிகளிலுள்ள முகாமுக்கு.” எபிரெயச் சொல் திறந்த பரந்த வெளி அல்லது வறண்ட சமவெளியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எரிகோவுக்கு அருகே” என்பதற்கு, “எரிகோவுக்கு எதிரே” என்றும் மொழிபெயர்க்கலாம்.
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு தொடர்ந்து வரும் நேரடிச் செயப்படுபொருள்களால் ‘கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது.
- source_word: הַשְּׁבִי
  choice: சிறைபிடிக்கப்பட்டவர்கள்
  rationale: போரில் பிடிக்கப்பட்ட மனிதர்களைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמַּלְקוֹחַ
  choice: கைப்பற்றப்பட்டவை
  rationale: போரில் கைப்பற்றப்பட்ட மனிதரல்லாத பொருட்கள் அல்லது கால்நடைகள் உள்ளிட்டவற்றைக் குறிக்கக்கூடிய விரிவான சொல்லாக வைத்து, அடுத்துள்ள שׁלל என்பதிலிருந்து ஓரளவு வேறுபடுத்துகிறது.
- source_word: הַשָּׁלָל
  choice: கொள்ளைப்பொருள்கள்
  rationale: போரில் கொள்ளையாக எடுத்த பொருட்களுக்கான வழக்கமான பொருளைத் தருகிறது; முந்தைய மַלְקוֹחַ உடன் உள்ள தொடர்பையும் சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபை
  rationale: עֵדָה என்பதன் கூடிய சமூகத்தைக் குறிக்கும் பொருளையும், בני ישראל என்பதன் மக்கள்சார் அடையாளத்தையும் இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: அந்த முகாம் ... அமைந்திருந்தது
  rationale: தமிழில் நீண்ட இலக்குப் பட்டியலைத் தவிர்த்து வாசிப்பை இயல்பாக்க இரண்டாவது வாக்கியமாக அமைக்கப்பட்டுள்ளது; பொருட்கள் முகாமுக்குக் கொண்டுவரப்பட்டன என்ற இடத்தொடர்பு சூழலால் தெளிவாக உள்ளது.
- source_word: עַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகள்
  rationale: புவியியல் பெயருக்கான தெளிவான, வழக்கமான தமிழ் மொழிபெயர்ப்பு; ‘புல்வெளிகள்’ அல்லது ‘வறண்ட வெளிகள்’ என்ற சாத்தியமான நிலவியல் நுட்பத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே யோர்தான் ஆற்றங்கரையில்
  rationale: சுருக்கமான எபிரெயப் புவியியல் தொடரை இயல்பான தமிழில் தருகிறது; ‘எரிகோவுக்கு எதிரே’ என்ற சாத்தியமான உறவைக் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
