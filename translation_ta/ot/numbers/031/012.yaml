- from: அவர்கள் சிறைபிடிக்கப்பட்டவர்களையும், கைப்பற்றப்பட்டவற்றையும், கொள்ளைப்பொருள்களையும் மோசேயிடமும், ஆசாரியனான எலெயாசாரிடமும், இஸ்ரவேல் மக்களின் சபையிடமும் கொண்டுவந்தார்கள். அந்த முகாம், எரிகோவுக்கு அருகே யோர்தான் ஆற்றங்கரையில் இருந்த மோவாபின் சமவெளிகளில்[a] அமைந்திருந்தது.[b]
