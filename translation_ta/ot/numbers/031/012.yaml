  source_fidelity: திருத்தம் தேவை. மூல எபிரெயத்தில் சிறைபிடிக்கப்பட்டோர், கைப்பற்றப்பட்டவை, கொள்ளைப்பொருள் ஆகிய மூன்றும் மோசே, ஆசாரியனாகிய எலெயாசார், இஸ்ரவேல் மக்களின் சபை, மற்றும் மோவாபின் சமவெளிகளிலுள்ள முகாம் ஆகியவற்றிடம்/இடத்திற்குக் கொண்டுவரப்பட்டன. வரைவில் ‘முகாமுக்கு’ என்பது பெறுநர் வரிசையிலிருந்து விடுபட்டுள்ளது; அடுத்த வாக்கியம் முகாமின் இருப்பிடத்தை மட்டும் கூறுவதால் அந்த இயக்கப் பொருளை மீட்டெடுக்கவில்லை.
  naturalness: முன்மொழியப்பட்ட ஒரே வாக்கியம் நீண்டதாக இருந்தாலும், இணையான பெறுநர் வரிசையையும் முகாமின் புவியியல் விளக்கத்தையும் இயல்பான நவீன தமிழில் தெளிவாகக் காக்கிறது. ‘கைப்பற்றப்பட்ட பொருட்கள்’ என்பது தனிநபர்களான சிறைபிடிக்கப்பட்டோரிலிருந்து வேறுபாட்டை வெளிப்படுத்துகிறது.
  terminology: ‘சிறைபிடிக்கப்பட்டவர்கள்’ (הַשְּׁבִי), ‘கைப்பற்றப்பட்ட பொருட்கள்’ (הַמַּלְקוֹחַ), ‘கொள்ளைப்பொருள்கள்’ (הַשָּׁלָל) ஆகியவை மூன்று வேறுபட்ட போர்சார் சொற்களையும் முடிந்தவரை தனித்தனியாகத் தருகின்றன. ‘இஸ்ரவேல் மக்களின் சபை’ עֲדַת בְּנֵי יִשְׂרָאֵל என்பதற்குப் பொருத்தமான நவீன நடையாகும்.
