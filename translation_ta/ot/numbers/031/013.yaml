  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: ta
  text: அப்போது மோசேயும், ஆசாரியனான எலெயாசாரும், சபையின் தலைவர்கள்[a] அனைவரும் அவர்களைச் சந்திக்க முகாமுக்கு வெளியே சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சபையின் தலைவர்கள்” என்பதை “சபையின் முதன்மையானவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: வெளியே சென்றார்கள்
  rationale: יצא என்பதன் தொடர்கதை வடிவம் வெளியே செல்லும் இயக்கத்தைக் குறிக்கிறது; தமிழில் இயல்பான இறந்தகாலக் கதைநடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசார்
  rationale: எலெயாசாரின் பணிப்பொறுப்பை அடையாளப்படுத்தும் இணைப்புப் பெயரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள் அனைவரும்
  rationale: נְשִׂיאִים என்பது இச்சூழலில் அரசர்களை அல்ல, சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; הָעֵדָה என்பதற்கு எண்ணாகமச் சூழலில் ‘சபை’ சுருக்கமாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க
  rationale: לִקְרַאת் உடன் வரும் பன்மை பின்னொட்டு, அவர்களை எதிர்கொண்டு சந்திப்பதற்கான நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: முகாமின் எல்லைக்கு அப்பாலுள்ள இடத்தைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் கூறுகளின் வரிசை பெரும்பாலும் காக்கப்பட்டாலும், தமிழின் இயல்பான இணைப்பு மற்றும் வினைமுற்று அமைப்பு பின்பற்றப்பட்டுள்ளது.
