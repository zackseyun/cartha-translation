source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: ta
  text: போரில் கைப்பற்றியவற்றை[a], போருக்குச் சென்ற போர்வீரர்களுக்கும் சபையார் அனைவருக்கும்[b] இடையில் சரிபாதியாகப் பிரி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர்க்கொள்ளையை.” இங்கு எபிரெயச் சொல் போரில் கைப்பற்றப்பட்ட மனிதர்கள், விலங்குகள், உடைமைகள் ஆகியவற்றை உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சமூகத்தார் அனைவருக்கும்” அல்லது “கூட்டத்தார் அனைவருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: சரிபாதியாகப் பிரி
  rationale: חצה என்பது பிரித்தல், குறிப்பாக இரு பங்குகளாகப் பிரித்தல் என்பதைக் குறிக்கிறது. சூழலில் இது மோசேக்குக் கொடுக்கப்படும் நேரடியான கட்டளை; ஆகவே இயல்பான தமிழ் ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַמַּלְקוֹחַ
  choice: போரில் கைப்பற்றியவற்றை
  rationale: מַלְקוֹחַ என்பது போரில் கைப்பற்றப்பட்ட மனிதர்கள், விலங்குகள், உடைமைகள் ஆகிய அனைத்தையும் உள்ளடக்கக்கூடிய விரிவான சொல். ‘கொள்ளைப் பொருள்’ என்று மட்டும் கூறுவது மனிதக் கைதிகளை மறைத்துவிடக்கூடும் என்பதால் இவ்விரிவான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையில்
  rationale: இரு தரப்புகளுக்கு இடையிலான பங்கீட்டைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: போர்வீரர்கள்
  rationale: சொல்லுக்குச் சொல் ‘போரைப் பற்றிக்கொண்டவர்கள்/கையாளுகிறவர்கள்’ என்ற எபிரெயச் சொற்றொடர், போரில் ஈடுபடும் வீரர்களைக் குறிக்கும் மரபுத்தொடர்.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: படையெடுப்புக்குச் சென்ற
  rationale: இந்தப் பங்கேற்புச் சொற்றொடர் படைப் பணிக்காக வெளியே சென்றவர்களை மேலும் அடையாளப்படுத்துகிறது. இச்சூழலில் ‘படையெடுப்பு’ என்பது צָבָא என்பதன் இராணுவப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה என்பது இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைச் சுட்டுகிறது. ‘சபையார்’ அதன் கூட்டு அடையாளத்தைத் தக்கவைத்து, நவீனத் தமிழிலும் புரிந்துகொள்ளக்கூடியதாக உள்ளது.
