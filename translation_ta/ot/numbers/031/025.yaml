source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/025.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம் இவ்வாறு கூறினார்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே மோசேயிடம் சொல்லியதாவது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இது ஒரு கூற்றை அறிமுகப்படுத்தும் வழக்கமான கதைநடைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... கூறினார்
  rationale: வாவ்-தொடர்வினையுடன் வரும் ‘אמר’ கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் ‘பின்பு’ அதன் தொடர்ச்சியையும் ‘கூறினார்’ பேச்சுச் செயலையும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை, தமிழில் இயல்பான உரை அறிமுகமாக ‘இவ்வாறு’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் இறைவனுடைய தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்த்து, உரையின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இவ்வாறு ... கூறினார்:’ என்பது அடுத்த வசனத்தில் தொடரும் இறைவாக்கைத் தெளிவாக அறிமுகப்படுத்துகிறது; அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
