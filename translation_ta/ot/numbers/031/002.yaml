  alternative: ‘நீ இறப்பாய்’ அல்லது ‘நீ உன் முன்னோர்களோடு சேர்க்கப்படுவாய்’
  rationale: இந்தச் சொற்றொடர் இறப்பைக் குறித்தாலும், அதன் உருவக மொழியைப் பாதுகாப்பது வசனத்தின் இறையியல் நிறையைத் தட்டையாக்காமல் வைத்திருக்கிறது; மறுமை வாழ்வைப் பற்றிய குறிப்பிட்ட கோட்பாட்டையும் வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
- issue: பழிவாங்குதலின் பயனாளர் அல்லது சார்பு
  choice: ‘இஸ்ரவேல் மக்களுக்காக மீதியானியர்களைப் பழிவாங்கு’
  alternative: ‘மீதியானியர்களிடம் இஸ்ரவேல் மக்களின் பழியைத் தீர்த்து வை’
  rationale: எபிரேய சொற்றொடர் இஸ்ரவேலுக்குரிய பழிவாங்குதலை மீதியானியர்கள்மீது நிறைவேற்றுமாறு கட்டளையிடுகிறது. முதன்மை மொழிபெயர்ப்பு இயல்பான தமிழை அளிக்கிறது; மாற்று அமைப்பு அடிக்குறிப்பில் மூல வடிவை மேலும் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பழிவாங்கு’ என்பது மூலத்தின் வலிமையைத் தக்கவைக்கிறது. மரணத்தைக் குறிக்கும் எபிரேய உருவகம் விளக்கவுரையாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது; இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
