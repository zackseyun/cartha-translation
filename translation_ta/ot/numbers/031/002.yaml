  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: ta
  text: “இஸ்ரவேல் மக்களுக்காக மீதியானியர்களைப் பழிவாங்கு.[a] அதன்பின் நீ உன் மக்களோடு சேர்க்கப்படுவாய்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதியானியர்கள்மீது இஸ்ரவேல் மக்களுக்குரிய பழிவாங்குதலை நிறைவேற்று.” எபிரேயத்தில் வினையும் பெயர்ச்சொல்லும் ஒரே வேரைச் சேர்ந்தவை; சொல்லுக்குச் சொல், “மீதியானியர்களிடமிருந்து இஸ்ரவேல் மக்களின் பழிவாங்குதலைப் பழிவாங்கு.” இச்சூழலில் “மீதியானியர்களிடமிருந்து” என்பது அவர்கள்மீது பழிவாங்குதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உன் மக்களோடு சேர்க்கப்படுவாய்” என்பது இறப்பைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
