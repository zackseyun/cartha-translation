  choice: பழிவாங்கு
  rationale: נקם என்ற வினையின் கட்டளையையும் அதனுடன் வரும் ஒரே வேருடைய நִקְמַת என்ற பெயர்ச்சொல்லின் வலியுறுத்தலையும் தமிழில் இயல்பான ஒரே வினையாகத் தருகிறது; கட்டளையின் கடுமையை மென்மைப்படுத்தவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குச் சொல் என்பதால், நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: மீதியானியர்களைப்
  rationale: נקם உடன் இந்த முன்னிடைச்சொல் பழிவாங்குதல் யார்மீது நிகழ வேண்டும் என்பதைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருள் வடிவம் இயல்பானது.
- source_word: אַחַר
  choice: அதன்பின்
  rationale: முதல் கட்டளை நிறைவேறிய பின் அடுத்த நிகழ்வு நடைபெறும் கால வரிசையைத் தெளிவாகக் குறிக்கிறது.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: நீ உன் மக்களோடு சேர்க்கப்படுவாய்
  rationale: இறப்பைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது; ‘நீ இறப்பாய்’ என்று விளக்கமாக மாற்றுவதையும், ‘முன்னோர்கள்’ என்று பொருளைக் குறுக்குவதையும் தவிர்க்கிறது.
theological_decisions:
- issue: மோசேயின் வரவிருக்கும் மரணத்தைக் குறிக்கும் மரபுத்தொடர்
