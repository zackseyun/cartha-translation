revisions:
- from: மோசே படையின் அதிகாரிகள்மேல்—ஆயிரம்பேருக்குத் தலைவர்களாகவும் நூறுபேருக்குத் தலைவர்களாகவும் இருந்து, போர்ப்பணியிலிருந்து வந்துகொண்டிருந்தவர்கள்மேல்—கோபமடைந்தார்.[a]
  to: போர்ப்பணியிலிருந்து[a] வந்துகொண்டிருந்த படை அதிகாரிகளான ஆயிரம் பேர் கொண்ட பிரிவுகளின் தலைவர்கள்மேலும் நூறு பேர் கொண்ட பிரிவுகளின் தலைவர்கள்மேலும் மோசே கோபமடைந்தார்.
  rationale: The revision retains all source elements while making the hierarchical ranks explicitly appositional to the military officers. It also places the lexical-alternative marker immediately after the translated Hebrew phrase it explains. “வந்துகொண்டிருந்த” preserves the descriptive participial force without inserting “returning.”
