  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: ta
  text: போர்ப்பணியிலிருந்து[a] வந்துகொண்டிருந்த படை அதிகாரிகளான ஆயிரம் பேர் கொண்ட பிரிவுகளின் தலைவர்கள்மேலும் நூறு பேர் கொண்ட பிரிவுகளின் தலைவர்கள்மேலும் மோசே கோபமடைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்கான படைப்பணியிலிருந்து.” எபிரெயத் தொடர் படை அல்லது இராணுவப் பணி மற்றும் போர் ஆகிய கருத்துகளை இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: கோபமடைந்தார்
  rationale: קצף என்பது கடும் கோபத்தைக் குறிக்கிறது; ‘கோபமடைந்தார்’ என்பது பொருளை மிகைப்படுத்தாமல் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: படையின் அதிகாரிகள்
  rationale: פקד வேரிலிருந்து வந்த இச்சொல் இங்கு படையில் நியமிக்கப்பட்ட பொறுப்பாளர்களைக் குறிக்கிறது; ‘படையின் அதிகாரிகள்’ நிர்வாக மற்றும் இராணுவ அதிகாரப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ஆயிரம்பேருக்குத் தலைவர்கள்
  rationale: இராணுவ அமைப்பிலுள்ள ஆயிரம் பேரைக் கொண்ட பிரிவுகளின் தலைவர்களைக் குறிக்கும் எபிரெய வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: நூறுபேருக்குத் தலைவர்கள்
  rationale: முந்தைய தொடருக்கு இணையாக, நூறு பேரைக் கொண்ட பிரிவுகளின் தலைவர்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הַבָּאִים
  choice: வந்துகொண்டிருந்தவர்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலை அல்லது விளக்க இயல்பைப் பாதுகாக்கிறது; ‘திரும்பிவந்தவர்கள்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: போர்ப்பணியிலிருந்து
  rationale: צָבָא என்பதிலுள்ள படை/இராணுவப் பணி சார்ந்த பொருளையும் מִן முன்னொட்டின் ‘இலிருந்து’ பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
