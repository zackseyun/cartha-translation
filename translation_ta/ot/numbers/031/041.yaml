  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: மோசே, விதிக்கப்பட்ட பங்கை[a]—யாவேக்கான காணிக்கையை[b]—ஆசாரியனாகிய எலெயாசாரிடம் கொடுத்தார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே மோசே செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீர்வை,’ ‘வரி’ அல்லது ‘கட்டாயமாக ஒதுக்கப்பட்ட பங்கு’ என்றும் மொழிபெயர்க்கலாம்; போரில் கைப்பற்றப்பட்டவற்றிலிருந்து கணக்கிட்டு எடுக்கப்பட்ட பங்கை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்; மரபுவழியாக, ‘யாவேயின் தூக்குக் காணிக்கை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் தொடர்கதை இறந்தகால வடிவம் இங்கு நேரடியாக ‘கொடுத்தார்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: מֶכֶס
  choice: விதிக்கப்பட்ட பங்கு
  rationale: போரில் கைப்பற்றப்பட்டவற்றிலிருந்து கணக்கிட்டு ஒதுக்கப்பட்ட கட்டாயப் பங்கை இச்சொல் குறிக்கிறது. ‘வரி’ என்பது நவீன அரசுவரியை நினைவூட்டக்கூடும்; எனவே பொருளைத் தெளிவாகக் கூறும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேக்கான காணிக்கை
  rationale: תְּרוּמָה என்பது புனிதப் பயன்பாட்டிற்காகப் பிரித்தளிக்கப்படும் காணிக்கை அல்லது பங்களிப்பைக் குறிக்கிறது. ‘யாவேக்கான’ என்பது அது அவருக்காக ஒதுக்கப்பட்டதைத் தெரிவிக்கிறது; குறிப்பிட்ட தூக்கிக் காணிக்கைச் சடங்கைத் தேவையின்றி உள்ளே கொண்டுவருவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரான יהוה, ஒரு பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசாரிடம்
  rationale: எபிரெய முன்னிடைச்சொல்லையும் பெயரடைவு அமைப்பையும் இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட இறைக் கட்டளைக்கு மோசே துல்லியமாக இணங்கியதை இவ்வமைப்பு தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: תְּרוּמַת יְהוָה என்பதன் உறவு
  choice: யாவேக்கான காணிக்கை
  alternative: யாவேயின் காணிக்கை
  rationale: இச்சூழலில் அந்தப் பங்கு யாவேக்காக ஒதுக்கப்பட்டது என்பதே முன்னிலையாகிறது. எனினும் எபிரெய இணைப்புத் தொடர் உடைமை அல்லது தொடர்பு என்ற நிழற்பொருளையும் தாங்குவதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பெயரடைவு அமைப்பைப் பாதுகாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; தொழில்நுட்பமான அல்லது நவீன அரசியல் பொருளைத் தூண்டும் சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
