  language: ta
  text: மாடுகள் முப்பத்தாறாயிரம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது கூட்டாகக் கருதப்படும் பசுவினக் கால்நடைகளைக் குறிக்கிறது. இந்தக் கால்நடை எண்ணிக்கைப் பட்டியலில் ‘மாடுகள்’ என்பது இயல்பான நவீனத் தமிழ்ச் சொல். எபிரெய இணைப்பிடைச்சொல் וּ முந்தைய வசனங்களோடு பட்டியலைத் தொடர்கிறது; ஆனால் தனியாக வாசிக்கப்படும் தமிழ்வசனத்தில் தொடக்க ‘மேலும்/மற்றும்’ இயல்பற்றதாக இருப்பதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: முப்பத்தாறாயிரம்
  rationale: எபிரெயில் சொற்பட ‘ஆறும் முப்பதும் ஆயிரம்’ என்ற எண்ணமைப்பு உள்ளது. நவீனத் தமிழின் வழக்கமான எண்ணமைப்பில் அதே எண்ணிக்கை ‘முப்பத்தாறாயிரம்’ எனத் துல்லியமாகவும் இயல்பாகவும் வழங்கப்படுகிறது.
