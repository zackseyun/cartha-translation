  text: וְ/הַ֨/בָּקָ֔ר שִׁשָּׁ֥ה וּ/שְׁלֹשִׁ֖ים אָ֑לֶף וּ/מִכְסָ֥/ם לַ/יהוָ֖ה שְׁנַ֥יִם וְ/שִׁבְעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: ta
  text: மாடுகள் முப்பத்தாறாயிரம்; அவற்றிலிருந்து யெகோவாவுக்குச் செலுத்தப்பட்ட பங்கு எழுபத்திரண்டு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது கூட்டுப் பொருளில் பசுவின மாடுகளைக் குறிக்கிறது; எண்ணிக்கைப் பட்டியலான இச்சூழலில் ‘மாடுகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: முப்பத்தாறாயிரம்
  rationale: எபிரெய வரிசை சொல்லுக்கு சொல் ‘ஆறும் முப்பதும் ஆயிரம்’; நவீனத் தமிழின் இயல்பான எண் வடிவம் ‘முப்பத்தாறாயிரம்’.
- source_word: מִכְסָם
  choice: அவற்றிலிருந்து ... செலுத்தப்பட்ட பங்கு
  rationale: מֶכֶס இங்கு போர்க்கொள்ளையிலிருந்து கணக்கிட்டு ஒதுக்கப்பட்ட கட்டாயப் பங்கைக் குறிக்கிறது. தமிழில் ‘செலுத்தப்பட்ட பங்கு’ என்பது வரி என்ற பொதுவான பொருளைவிட இச்சூழலைத் தெளிவாக வெளிப்படுத்துகிறது; -ם என்ற பின்னொட்டின் தொடர்பை ‘அவற்றிலிருந்து’ காட்டுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ என்பது ஒதுக்கீட்டின் பெறுநரை அல்லது உரிமையாளரைச் சுட்டுகிறது; ‘-க்கு’ அதனை இயல்பாகக் காட்டுகிறது. יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: எழுபத்திரண்டு
  rationale: எபிரெயில் சொல்லுக்கு சொல் ‘இரண்டும் எழுபதும்’; நவீனத் தமிழில் இயல்பான வடிவம் ‘எழுபத்திரண்டு’.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர் / யாவே
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், கணக்குப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. எபிரெய இணைப்புச் சொற்களை அப்படியே மீண்டும் மீண்டும் மொழிபெயர்க்காமல் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
