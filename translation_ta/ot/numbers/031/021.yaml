base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: ta
  text: அப்போது ஆசாரியனாகிய எலெயாசார் போருக்குச் சென்ற படைவீரர்களிடம், “இது யாவே மோசேக்குக் கட்டளையிட்ட சட்டத்தின் விதிமுறை[a]:” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சட்டத்தின் நியமம்”; “போதனையின் விதிமுறை.”
    reason: חֻקַּת הַתּוֹרָה என்பதில் חֻקָּהக்கு ‘விதிமுறை/நியமம்’ என்றும், תּוֹרָהக்கு ‘சட்டம்/போதனை’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வின் அடுத்த கட்டத்தைச் சுட்டுகிறது; இயல்பான தமிழ் கதைநடைக்காக ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: பெயர் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பில் தரப்பட்டு, அவரது பணிநிலை தெளிவாகக் காக்கப்பட்டது.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: படைவீரர்கள்
  rationale: சொல்லுக்கு சொல் ‘படையின் ஆட்கள்’ என்பதற்குப் பதிலாக, ஆண்பால் இராணுவக் குழுவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: போருக்குச் சென்ற
  rationale: எபிரெய உரை இயக்கத்தைப் போருடன் தொடர்புபடுத்துகிறது; சூழலில் அவர்கள் திரும்பிவந்தவர்கள் என்றாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘போரிலிருந்து திரும்பிய’ என்பதை உரைக்குள் சேர்க்காமல் ‘போருக்குச் சென்ற’ என வழங்கப்பட்டது.
- source_word: חֻקַּת הַתּוֹרָה
  choice: திருச்சட்டத்தின் நியமம்
  rationale: חֻקָּה என்பதன் நிலையான சட்டவிதி உணர்வை ‘நியமம்’ காக்கிறது; תּוֹרָה என்பதன் அதிகாரமுள்ள சட்டப் போதனையை இச்சூழலில் ‘திருச்சட்டம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்ட
  rationale: אֶת மோசேயை கட்டளையைப் பெற்றவராகக் குறிக்கிறது; ஆகவே ‘மோசே மூலமாக’ என்று மாற்றப்படவில்லை. இறைப் பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தனிப்பெயராகக் காக்கிறது.
- issue: תּוֹרָה என்பதன் சட்டம்/போதனைப் பொருள்
  choice: திருச்சட்டம்
  alternative: சட்டம்; போதனை
  rationale: இந்த இராணுவத் தூய்மைப்படுத்தல் விதிமுறைகள் சார்ந்த சூழலில் அதன் சட்ட அதிகாரத்தை ‘திருச்சட்டம்’ தெளிவாகக் காட்டுகிறது; இருப்பினும் ‘போதனை’ என்ற பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சட்டத் தன்மையும், போர் நோக்கிய இயக்கத்தைச் சொல்லும் சொற்றொடரின் தெளிவின்மையும் மிகைப்படுத்தாமல் காக்கப்பட்டுள்ளன.
