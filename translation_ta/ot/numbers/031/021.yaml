revisions:
- from: அப்போது ஆசாரியனாகிய எலெயாசார் போருக்குச் சென்ற படைவீரர்களிடம், “யாவே மோசேக்குக் கட்டளையிட்ட திருச்சட்டத்தின் நியமம்[a] இதுதான்:” என்றார்.
  to: அப்போது ஆசாரியனாகிய எலெயாசார் போருக்குச் சென்ற படைவீரர்களிடம், “இது யாவே மோசேக்குக் கட்டளையிட்ட சட்டத்தின் விதிமுறை[a]:” என்றார்.
  rationale: The revision removes the unsupported ‘திரு-’ qualifier from the rendering of תּוֹרָה, while retaining the source’s legal force, the divine name, Moses as the person commanded, and the deliberately noncommittal movement-to-battle wording. The footnote is adjusted to match the corrected main-text terminology and preserve the principal lexical alternatives.
