base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: ta
  text: நீங்கள் பாளயத்திற்கு வெளியே ஏழு நாட்கள் முகாமிடுங்கள். ஒருவரைக் கொன்ற ஒவ்வொருவரும், கொல்லப்பட்ட ஒருவரைத் தொட்ட ஒவ்வொருவரும்[a]—நீங்களும் நீங்கள் சிறைப்பிடித்தவர்களும்—மூன்றாம் நாளிலும் ஏழாம் நாளிலும் உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லப்பட்ட ஒருவரின் உடலைத் தொட்ட ஒவ்வொருவரும்.” எபிரெயில் நேரடியாக “கொல்லப்பட்ட ஒருவர்” என்று உள்ளது; இச்சூழலில் அது இறந்த உடலைத் தொடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: முகாமிடுங்கள்
  rationale: חנה என்பதன் பன்மை ஏவல் வடிவம்; பாளயத்திற்கு வெளியே தங்கி முகாமிடுமாறு கட்டளையிடுகிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: பாளயத்திற்கு வெளியே
  rationale: பாலைவனத்திலுள்ள இஸ்ரவேலரின் குடியிருப்பு மற்றும் படைச் சூழலுக்கு ஏற்ற தெளிவான இடவியல் சொற்றொடர்.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: குறிப்பிட்ட கால அளவை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: ஒருவரைக் கொன்ற ஒவ்வொருவரும்
  rationale: נֶפֶשׁ இங்கு தனி மனிதரைக் குறிக்கிறது; போர் முடிந்த பின்புலத்தால் הֹרֵג என்பதற்குக் கடந்த செயலைக் குறிக்கும் வடிவம் பொருத்தமானது.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: கொல்லப்பட்ட ஒருவரைத் தொட்ட ஒவ்வொருவரும்
  rationale: חָלָל வன்முறையில் கொல்லப்பட்ட ஒருவரைக் குறிக்கிறது; மூலத்தின் தனிநபர் குறிப்பைத் தக்கவைத்தபடி உடல் தொடுதலையும் சூழல் உணர்த்துகிறது.
- source_word: תִּתְחַטְּאוּ
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ள வேண்டும்
  rationale: சடங்குசார் சூழலில் חטא என்பதன் Hitpael வடிவம் தீட்டிலிருந்து தம்மைத் தூய்மைப்படுத்துவதைக் குறிக்கிறது; பாவமன்னிப்பு என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: மூன்றாம் நாளிலும் ஏழாம் நாளிலும்
  rationale: சுத்திகரிப்புச் சடங்கின் இரு குறிப்பிட்ட நாட்களையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: நீங்களும் நீங்கள் சிறைப்பிடித்தவர்களும்
  rationale: שְׁבִי போரில் பிடிக்கப்பட்டவர்களைக் குறிக்கிறது; ‘நீங்கள் சிறைப்பிடித்தவர்கள்’ என்பது தமிழ் வாசகருக்குத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கொலை செய்ததற்குப் பின்பும் இறந்த உடலைத் தொட்டதற்குப் பின்பும் தேவைப்படும் தூய்மைப்படுத்துதலின் தன்மை
  choice: இறந்த உடலால் ஏற்படும் சடங்குசார் தீட்டிலிருந்து தூய்மைப்படுத்துதல்
  alternative: இரத்தப்பழியிலிருந்து ஒழுக்க அல்லது ஆன்மீகச் சுத்திகரிப்பு
  rationale: மூன்றாம் நாளும் ஏழாம் நாளும் என்ற காலக் குறிப்புகளும் תִּתְחַטְּאוּ என்ற வினையும் இறந்த உடலால் ஏற்படும் தீட்டுக்கான சடங்குசார் தூய்மைப்படுத்துதலைச் சுட்டுகின்றன. எனவே மன்னிப்பு அல்லது இரத்தப்பழி பற்றிய கூடுதல் இறையியல் முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாளயம்’, ‘தூய்மைப்படுத்திக்கொள்ளுதல்’ ஆகியவை சூழலின் படை மற்றும் சடங்குசார் நுணுக்கங்களைத் தக்கவைக்கின்றன.
