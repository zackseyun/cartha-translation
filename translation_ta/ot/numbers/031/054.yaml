base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: ta
  text: மோசேயும் ஆசாரியனான எலெயாசாரும் ஆயிரவர் படைப்பிரிவுகளின் தலைவர்களிடமிருந்தும் நூறுவர் படைப்பிரிவுகளின் தலைவர்களிடமிருந்தும் அந்தத் தங்கத்தை எடுத்துக்கொண்டு, அதைச் சந்திப்புக் கூடாரத்திற்குள் கொண்டுவந்தார்கள்; அது யாவேவின் சந்நிதியில் இஸ்ரவேலின் மகன்களுக்காக ஒரு நினைவுக்குறியாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலருக்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘இஸ்ரவேலின் மகன்களுக்காக’ என்று உள்ளது; இது உடன்படிக்கை மக்களைக் குறிக்கும் மரபான பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பெற்றுக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டார்’; இங்கு அதிகாரிகளிடமிருந்து ஒப்படைக்கப்பட்ட தங்கத்தை ஏற்றுக்கொண்ட சூழலில் ‘பெற்றுக்கொண்டு’ என்பது இயல்பாகவும் மூலத்தின் செயல்பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: הַזָּהָב
  choice: அந்தத் தங்கத்தை
  rationale: எபிரெய definite article-ஐயும் முன்னரே குறிப்பிடப்பட்ட குறிப்பிட்ட தங்கத்தையும் ‘அந்தத் தங்கத்தை’ தெளிவாகக் காட்டுகிறது.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரத்துக்குத் தலைவர்களிடமிருந்தும் நூற்றுக்குத் தலைவர்களிடமிருந்தும்
  rationale: இவை படைசார் நிர்வாகப் பிரிவுகளின் தலைவர்கள். ‘தலைவர்கள்’ நவீன தமிழில் இயல்பாகவும் பதவிப் பொருளைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் நியமிக்கப்பட்ட கூடாரத்தைக் குறிக்கும் வழக்கமான ஆலயச் சொற்றொடரின் தெளிவான தமிழ் வடிவம்.
- source_word: זִכָּרוֹן
  choice: ஒரு நினைவுச்சின்னம்
  rationale: זִכָּרוֹן நினைவூட்டும் பொருள் அல்லது நினைவுக்குறியைக் குறிக்கிறது; இங்கு கொண்டுவரப்பட்ட தங்கத்தின் வழிபாட்டுச் சார்ந்த நினைவுப்பணியை ‘நினைவுச்சின்னம்’ வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற உடன்படிக்கை சார்ந்த மரபுப் பெயரைப் பாலின விவரத்தை அழிக்காமல் முறையாகப் பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: வழிபாட்டுச் சூழலில் யாவேயின் சந்நிதியில் அல்லது முன்னிலையில் இருப்பதைக் குறிக்கும் மூலச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; எனவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தெய்வீகப் பெயரை ஒலிபெயர்ப்பது மூல வடிவத்தைப் பாதுகாக்கிறது.
- issue: בני ישראל என்ற உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இது மக்களைக் குறிக்கும் மரபான கூட்டுப்பெயராக இருந்தாலும், மூலத்தின் இலக்கண வடிவத்தையும் தந்தைவழி உடன்படிக்கைச் சொல்லாட்சியையும் மறைக்காமல் பாதுகாக்க ‘இஸ்ரவேலின் மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டது. படைத் தலைமைப் பதவிகளின் எபிரெய இணை அமைப்பு காக்கப்பட்டுள்ளது; மிகப் பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
