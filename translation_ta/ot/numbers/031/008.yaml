base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: ta
  text: மீதியானியரில் கொல்லப்பட்ட மற்றவர்களோடு சேர்த்து, அவர்களுடைய அரசர்களையும் அவர்கள் கொன்றார்கள்:[a] எவி, ரெகேம், சூர், ஹூர், ரெபா ஆகிய மீதியானின் ஐந்து அரசர்கள். பெயோரின் மகன் பிலேயாமையும் வாளால் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதியானியரில் கொல்லப்பட்ட மற்றவர்களிடையே அவர்களுடைய அரசர்களையும் கொன்றார்கள்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; அரசர்கள் மற்ற கொல்லப்பட்டவர்களோடு சேர்த்து கொல்லப்பட்டார்கள் என்றோ, கொல்லப்பட்டவர்களின் நடுவே அவர்கள் கொல்லப்பட்டார்கள் என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: கொன்றார்கள்
  rationale: הרג என்பதன் எளிய, நேரடியான பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: עַל חַלְלֵיהֶם
  choice: மீதியானியரில் கொல்லப்பட்ட மற்றவர்களோடு சேர்த்து
  rationale: எபிரெயச் சொற்றொடர் மிகச் சுருக்கமாக ‘அவர்களுடைய கொல்லப்பட்டவர்களின்மேல்/அவர்களிடையே’ என உள்ளது. சூழலில், மற்ற இறந்தவர்களோடு அரசர்களும் கொல்லப்பட்டார்கள் என்ற தொடர்பை இந்தத் தமிழ் வாசகம் இயல்பாகக் காட்டுகிறது; இடம்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: מַלְכֵי מִדְיָן
  choice: மீதியானின் அரசர்கள்
  rationale: இணைப்புநிலைத் தொடரின் நேரடியான பொருள்; பெயர்ப்பட்டியலுக்குப் பின் மீண்டும் வரும் சொல்லோடும் ஒற்றுமை பேணப்படுகிறது.
- source_word: אֱוִי
  choice: ஏவி
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: רֶקֶם
  choice: ரேக்கேம்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צוּר
  choice: சூர்
  rationale: தனிப்பெயர் எபிரெய மெய்யொலியை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חוּר
  choice: கூர்
  rationale: தனிப்பெயரின் தொடக்க எபிரெய ח ஒலியைத் தமிழில் அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: רֶבַע
  choice: ரேபா
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: மீதியானின் ஐந்து அரசர்கள்
  rationale: முன்னர் பட்டியலிடப்பட்ட ஐவரையும் விளக்கும் உடனிலைத் தொடராகத் தெளிவாக வழங்குகிறது.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: பேயோரின் மகன் பிலேயாம்
  rationale: தந்தை–மகன் உறவைத் தமிழின் இயல்பான உரிமைத் தொடரில் தருகிறது.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: בְּ கருவிப் பொருளைக் குறிக்கிறது; கொல்லப் பயன்படுத்தப்பட்ட கருவியைத் தமிழில் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
