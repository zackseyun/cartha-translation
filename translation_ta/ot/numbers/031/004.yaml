  to: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர், ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர், இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் போர்ச்சேவைக்காக நீங்கள் அனுப்ப வேண்டும்.
  rationale: The revision maintains the Hebrew doublet and its distributive scope, while expressing the military-service force of לַצָּבָא more directly in modern standard Tamil. The footnote preserves the concise alternative ‘படைக்கு.’
