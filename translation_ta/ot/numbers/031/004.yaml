  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: ta
  text: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர், ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர், இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் போர்ச்சேவைக்காக நீங்கள் அனுப்ப வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלֶף
  choice: ஆயிரம் பேர்
  rationale: இது எண்ணிக்கையைக் குறிக்கும் எண்; ஆட்கள் அனுப்பப்படுகிற சூழல் என்பதால் தமிழில் இயல்பாகப் புரிய ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לַמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும்
  rationale: מַטֶּה இங்கு ‘கோத்திரம்’ எனப் பொருள்படும். לְ முன்னொட்டு, எண்ணிக்கையுடன் மீண்டும் வருவதால், ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆட்கள் தேர்ந்தெடுக்கப்பட வேண்டும் என்ற பகிர்ந்தளிக்கும் பொருள் வருகிறது.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர், ஒவ்வொரு கோத்திரத்திலிருந்தும் ஆயிரம் பேர்
  rationale: எபிரெய உரையின் நோக்கமுள்ள மறுபடியும் கூறுதலைச் சுருக்காமல், அதன் வலியுறுத்தலையும் வடிவத்தையும் காக்கிறது.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: கட்டளை இஸ்ரவேலின் எல்லாக் கோத்திரங்களுக்கும் பகிர்ந்தளிக்கப்பட்டுள்ளது என்பதைத் தெளிவுபடுத்துகிறது; படைக்கு ஆட்களை அனுப்பும் சூழலில் ‘கோத்திரங்களிலிருந்தும்’ என்பது இயல்பானது.
- source_word: תִּשְׁלְחוּ
  choice: நீங்கள் அனுப்ப வேண்டும்
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை வினைமுற்று; இச்சூழலில் கட்டளை வலிமையைக் கொண்டிருப்பதால், நவீனத் தமிழில் தெளிவான ‘அனுப்ப வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַצָּבָא
  choice: படைக்கு
  rationale: צָבָא இங்கு போர்ப்படை அல்லது படைச் சேவையைக் குறிக்கலாம். ‘படைக்கு’ என்பது சுருக்கமான நேரடி மொழிபெயர்ப்பு; சேவை சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
