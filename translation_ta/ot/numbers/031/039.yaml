source:
  edition: WLC
  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: ta
  text: கழுதைகள் 30,500; அவற்றில் யாவேக்குச் செலுத்த வேண்டிய பங்கு[a] 61.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் தீர்வை.” இங்கு வரும் எபிரெயச் சொல், கொள்ளைப் பொருளிலிருந்து கணக்கிட்டு யாவேக்கென ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: கழுதைகள்
  rationale: חֲמֹרִים என்பது ‘கழுதைகள்’ எனப் பொருள்படும் பொதுவான பன்மைப் பெயர். பட்டியல் நடையில் தொடக்க இணைப்புச்சொல்லைத் தமிழில் விடுவது இயல்பானது.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: எபிரெய எண்ணிக்கை முப்பதாயிரத்து ஐந்நூறு என்பதைக் குறிக்கிறது; கணக்குப் பட்டியலாதலால் எண்களாகத் தரப்பட்டுள்ளது.
- source_word: וּ/מִכְסָ/ם
  choice: அவற்றில் ... செலுத்த வேண்டிய பங்கு
  rationale: מִכְסָם என்பது கொள்ளைப் பொருளிலிருந்து கணக்கிட்டு ஒதுக்கப்பட்ட கட்டாயப் பங்கைக் குறிக்கிறது. ‘காணிக்கை’ என்பது தன்னார்வத் தன்மையை உணர்த்தக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: לַ/יהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; ל முன்னொட்டு அந்தப் பங்கு யாவேக்கு உரியது அல்லது அவருக்குச் செலுத்தப்படுவது என்பதைக் காட்டுகிறது.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: எபிரெய உரையில் அறுபத்தொன்று எனத் துல்லியமாக உள்ளது; பட்டியல் நடைக்கேற்ப எண்களால் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்ப்பது அதன் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: מֶכֶס குறிக்கும் பங்கின் தன்மை
  choice: செலுத்த வேண்டிய பங்கு
  alternative: காணிக்கை
  rationale: இது தன்னார்வக் காணிக்கையல்ல; கொள்ளைப் பொருளிலிருந்து கணக்கிட்டு விதிக்கப்பட்ட பங்கு. ஆகவே கட்டாயமாக ஒதுக்கப்பட்ட தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்குப் பட்டியலுக்கேற்ற சுருக்கமான நடையும் இலக்கங்களும் பயன்படுத்தப்பட்டுள்ளன. ‘தீர்வை’ சரியான மாற்றாக இருந்தாலும் இன்றைய பொதுவழக்கில் குறைவாகப் புரியக்கூடும் என்பதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
