source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: ta
  text: 'ஆகையால், நாங்கள் யாவேக்கு அளிக்கும் காணிக்கையைச் சமர்ப்பித்துள்ளோம்: ஒவ்வொரு ஆணும் தான் கண்டெடுத்த தங்கப் பொருட்களாகிய மேற்கை வளையல்கள்[a], கைவளையல்கள், மோதிரங்கள், காதணிகள், தொங்கணிகள்[b] ஆகியவற்றை, யாவே முன்னிலையில் எங்களுக்காக[c]ப் பாவநிவிர்த்தி செய்யும்படி சமர்ப்பித்துள்ளோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேற்கை வளையல்கள்” என்பதற்கான எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; “கால்வளையல்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தொங்கணிகள்” என்பதற்கான எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; “கழுத்தணிகள்,” “அணிகலன்கள்,” அல்லது “மூக்குத்திகள்” என்பவையும் சாத்தியம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “எங்கள் உயிர்களுக்காக/எங்கள் நபர்களுக்காகப் பாவநிவிர்த்தி செய்யும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: ஆகவே, ... கொண்டுவந்திருக்கிறோம்
  rationale: ஹிப்ஹில் வடிவம் ‘அருகில் கொண்டுவருதல்/சமர்ப்பித்தல்’ என்பதைக் குறிக்கிறது. தமிழில் காணிக்கையை ‘கொண்டுவருதல்’ இயல்பானது; நிறைவு பெற்ற செயலை ‘கொண்டுவந்திருக்கிறோம்’ வெளிப்படுத்துகிறது.
- source_word: קָרְבַּן יְהוָה
  choice: யாவேக்கு உரிய காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கை. எபிரெயக் கட்டமைப்பின் உறவைப் பாதுகாத்து, தமிழில் இயல்பாக இலக்கை உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: ஒவ்வொரு ஆணும் தான் கண்டெடுத்த
  rationale: இது ஆண் போர்வீரர்களைத் தனித்தனியாகச் சுட்டும் பகிர்வுப் பயன்பாடு; மூலத்தின் பாலினக் குறிப்பையும் காக்கிறது.
- source_word: כְלִי זָהָב
  choice: தங்க அணிகலன்கள்
  rationale: כְלִי என்பது பொதுவாகப் பொருள் அல்லது உபகரணம் என்றாலும், தொடர்ந்து பட்டியலிடப்படுபவை அணிகலன்கள் என்பதால் சூழலுக்கேற்ற இயல்பான தேர்வு.
- source_word: אֶצְעָדָה
  choice: காலணிகள்
  rationale: உறுப்பில் அணியும் ஓர் அணிகலன்; குறிப்பான அடையாளம் உறுதியில்லை. இங்கு காலில் அணியும் அணிகலன் என்ற வாசிப்பு தேர்ந்தெடுக்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צָמִיד
  choice: வளையல்கள்
  rationale: கை அல்லது மணிக்கட்டில் அணியும் வளைய வடிவ அணிகலனை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: טַבַּעַת
  choice: மோதிரங்கள்
  rationale: மூலம் பொதுவாக மோதிரத்தைக் குறிக்கிறது; ‘முத்திரை மோதிரம்’ என்று தேவையின்றி குறுக்கவில்லை.
- source_word: עָגִיל
  choice: காதணிகள்
  rationale: இத்தகைய அணிகலன் பட்டியலில் காதில் அணியும் வளையம் அல்லது அணிகலன் என்பது வழக்கமான பொருள்.
- source_word: כוּמָז
  choice: தொங்கட்டான்கள்
  rationale: சரியான அணிகலன் எது என்பது உறுதியில்லை. வாசிக்க இயல்பான ஒரு பொதுவான அணிகலன் பெயர் தேர்ந்தெடுக்கப்பட்டு ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்வதற்காக
  rationale: காணிக்கை மற்றும் ‘யாவே முன்னிலையில்’ என்ற பலிசார் சூழலில் כפר என்பதன் இறையியல் கனத்தைப் பாதுகாக்கிறது.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: எங்களுக்காக
  rationale: சொல்லுக்கு சொல் ‘எங்கள் உயிர்கள்/நபர்கள் சார்பாக’; இங்கு தங்களுக்காகச் செய்யப்படும் பாவநிவிர்த்தியைக் குறிக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: படைவீரர்களின் காணிக்கைக்கும் כפר என்பதற்கும் உள்ள தொடர்பு
  choice: அந்தக் காணிக்கை யாவே முன்னிலையில் அவர்களுக்காகப் பாவநிவிர்த்தி செய்வதுடன் தொடர்புடையதாக மொழிபெயர்க்கப்படுகிறது.
  alternative: இது பாவநிவிர்த்தி சாராத வெறும் நன்றிக் காணிக்கை; அல்லது சமயச்சடங்கு சாராத விதத்தில் ஆபத்தைத் தவிர்ப்பது மட்டும்.
  rationale: வசனம் காணிக்கையைக் குறிக்கும் קָרְבַּן, பாவநிவிர்த்தியைக் குறிக்கும் כפר, மேலும் ‘யாவே முன்னிலையில்’ ஆகியவற்றை வெளிப்படையாக இணைக்கிறது. ஆனால் பாவநிவிர்த்தி எவ்வாறு நிகழ்கிறது என்பதை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
- issue: אִישׁ என்பதன் பாலினக் குறிப்பு
  choice: ஒவ்வொரு ஆணும்
  alternative: ஒவ்வொருவரும்
  rationale: சூழலில் ஆண் படைவீரர்களைக் குறிக்கும் மூலத்தின் ஆண்பால் ஒருமை பகிர்வுப் பொருளைத் தக்கவைக்கிறது.
- issue: נֶפֶשׁ என்பதன் மனிதநபர் சார்ந்த பொருள்
  choice: எங்களுக்காக; சொல்லாட்சிப் பொருள் அடிக்குறிப்பில்
  alternative: எங்கள் ஆத்துமாக்களுக்காக
  rationale: உடல்–ஆத்துமா என்ற பிற்கால இருபிரிவை மூலத்தில் திணிக்காமல், ‘உயிர்கள்/நபர்கள்’ என்ற உண்மையான பொருள் வரம்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. அணிகலன் பெயர்களில் உள்ள உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன; இறையியல் விளக்கம் மூலத்தின் அளவைத் தாண்டவில்லை.
