  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: ta
  text: யாவேக்கு அவர்கள் செலுத்திய காணிக்கையின்[a] தங்கம் அனைத்தும் பதினாறாயிரத்து எழுநூற்று ஐம்பது சேக்கல்கள்[b] இருந்தது; அது ஆயிரவர் படைப்பிரிவுகளின் தலைவர்களிடமிருந்தும் நூறுவர் படைப்பிரிவுகளின் தலைவர்களிடமிருந்தும் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காணிக்கை” என்பதை “அர்ப்பணம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் யாவேக்கெனப் பிரித்துவைக்கப்பட்ட பங்களிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சேக்கல் என்பது ஓர் எடையளவு.
    reason: unit_clarification
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: தங்கம் முழுவதும் ... எடையிருந்தது
  rationale: வசனம் காணிக்கையாக வந்த தங்கத்தின் மொத்த எடையைத் தெரிவிக்கிறது. தமிழ் இயல்புக்கேற்ப வாக்கிய அமைப்பு மாற்றப்பட்டாலும், ‘முழுவதும்’ என்பது כָּל என்பதன் மொத்தத்தன்மையைப் பாதுகாக்கிறது.
- source_word: הַתְּרוּמָה
  choice: காணிக்கை
  rationale: யெகோவாவுக்கெனப் பிரித்துச் செலுத்தப்பட்ட பங்களிப்பை இச்சொல் குறிக்கிறது. ‘காணிக்கை’ என்பது நவீன தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது; மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: அவர்கள் ... செலுத்திய
  rationale: Hiphil வடிவிலுள்ள רום இங்கு பொருளைச் சொல்லர்த்தமாக மேலே தூக்குவதை அல்ல, காணிக்கையாக ஒதுக்கி அளிப்பதைக் குறிக்கிறது. ‘செலுத்திய’ என்பது அந்தச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரான יהוה தனிப்பெயராகத் தக்கவைக்கப்படுகிறது; ל குறிக்கும் நோக்குநிலை ‘-க்கு’ என்ற வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 16,750 சேக்கல் எடை
  rationale: எண்ணிக்கை துல்லியமாகத் தக்கவைக்கப்படுகிறது. שֶׁקֶל இங்கு எடையளவு என்பதால், தமிழில் தவறாக நாணயத் தொகையாகப் புரிந்துகொள்ளப்படாமல் இருக்க ‘எடை’ சேர்க்கப்பட்டுள்ளது.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: ஆயிரம் பேருக்குத் தலைவர்களிடமிருந்தும் நூறு பேருக்குத் தலைவர்களிடமிருந்தும்
  rationale: מֵאֵת காட்டும் மூலத்தை ‘-இடமிருந்தும்’ தெளிவாக வெளிப்படுத்துகிறது. שָׂרֵי என்பது இராணுவத் தலைவர்களைக் குறிக்கும்; ‘ஆயிரம்’, ‘நூறு’ என்பவை அவர்கள் பொறுப்பிலிருந்த படைப்பிரிவுகளின் அளவைக் காட்டுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தரப்பட்டுள்ளது.
- issue: தְּרוּמָה என்பதன் வழிபாட்டுச் சார்ந்த நுட்பம்
  choice: காணிக்கை
  alternative: அர்ப்பணம் / பிரித்துவைக்கப்பட்ட பங்களிப்பு
  rationale: சொல் யெகோவாவுக்கென ஒதுக்கி அளிக்கப்பட்ட பொருளைக் குறிக்கிறது. ‘காணிக்கை’ இயல்பான முதன்மைச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டு, அதன் ‘பிரித்துவைக்கப்பட்ட’ நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. இராணுவ நிர்வாக அமைப்பைக் காட்டும் ‘ஆயிரம் பேருக்குத் தலைவர்கள்’, ‘நூறு பேருக்குத் தலைவர்கள்’ என்ற இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளது.
