revisions:
- from: அவர்கள் யெகோவாவுக்குச் செலுத்திய காணிக்கையின்[a] தங்கம் முழுவதும் 16,750 சேக்கல்[b] எடையிருந்தது. அது ஆயிரம் பேருக்குத் தலைவர்களிடமிருந்தும் நூறு பேருக்குத் தலைவர்களிடமிருந்தும் வந்தது.
