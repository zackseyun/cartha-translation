  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: ta
  text: அவர்களுக்குரிய பாதியிலிருந்து எடுத்து, யாவேவுக்கென ஒதுக்கப்பட்ட பங்காக ஆசாரியராகிய எலெயாசாருக்குக் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் காணிக்கையாக” அல்லது “யாவேவுக்குரிய பங்காக.” எபிரெயச் சொல் תְּרוּמָה, பரிசுத்தப் பயன்பாட்டிற்காக ஒதுக்கிவைக்கப்படும் ஒரு பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: அவர்களுக்குரிய பாதியிலிருந்து
  rationale: מִן + מַחֲצִיתָם என்பதன் ‘அவர்களுடைய பாதியிலிருந்து’ என்ற பொருளையும், சூழலில் போர்வீரர்களுக்கு உரிய பாதியைக் குறிப்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: תִּקָּחוּ
  choice: அதை எடுத்து
  rationale: இது இரண்டாம் நபர் பன்மை வடிவிலுள்ள அறிவுறுத்தல். தொடரும் வினையோடு இணைந்து தமிழில் இயல்பான கட்டளைப் பொருளைத் தருகிறது.
- source_word: וְנָתַתָּה
  choice: கொடுக்க வேண்டும்
  rationale: எபிரெயத்தில் இங்கு இரண்டாம் நபர் ஒருமைக்கு மாறினாலும், கட்டளைத் தொடரைத் தமிழில் தெளிவாக வழங்குகிறது; மூலத்தின் எண்ணிக்கை மாற்றத்தைச் செயற்கையாகத் தீர்மானிக்கவில்லை.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசாரிடம்
  rationale: பெயரையும் பதவியையும் தெளிவான, வழக்கமான தமிழ் வடிவில் வழங்குகிறது.
- source_word: תְּרוּמַת יְהוָה
  choice: யெகோவாவுக்காக ஒதுக்கப்படும் பங்காக
  rationale: תְּרוּמָה என்பது பரிசுத்தப் பயன்பாட்டுக்காகப் பிரித்துவைக்கப்படும் பங்கு அல்லது காணிக்கையைக் குறிக்கிறது. யְהוָה உடனான தொடர்பை நோக்குப் பொருளாக மொழிபெயர்த்து, உடைமைப் பொருளின் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப்பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பால் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைநாமம் நேரடியாக இருப்பதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: תְּרוּמָה என்ற வழிபாட்டுச் சொல்லின் பொருள்
  choice: ஒதுக்கப்படும் பங்கு
  alternative: காணிக்கை; உயர்த்திப் படைக்கும் காணிக்கை
  rationale: இங்கு போர்க்கொள்ளையிலிருந்து பரிசுத்த நோக்கத்திற்காக நிர்ணயிக்கப்படும் பங்கைக் குறிக்கிறது. ‘ஒதுக்கப்படும் பங்கு’ என்பது சூழலுக்கு துல்லியமாகவும் சாதாரண வாசகருக்கு புரியக்கூடியதாகவும் உள்ளது; வழிபாட்டு நுட்பச் சொல்லை தேவையின்றி இறக்குமதி செய்யாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட/அறிவுறுத்தல் தன்மையை ‘வேண்டும்’ வடிவில் தெளிவாகக் காட்டுகிறது. ‘பாதி,’ ‘ஒதுக்கப்படும் பங்கு’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான வழிபாட்டுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
