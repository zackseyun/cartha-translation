  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, அவர்கள் மீதியானுக்கு எதிராகப் போரிட்டார்கள்[a]; ஆண்பாலினர் அனைவரையும் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மீதியானுக்கு எதிராகப் படையெடுத்தார்கள்.’ எபிரெய வினை படைச்சேவையில் அல்லது போரில் ஈடுபடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: போரிட்டார்கள்
  rationale: צבא என்பதன் வினை வடிவம் இங்கு படை நடவடிக்கையில் ஈடுபடுவதைக் குறிக்கிறது. ‘போரிட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழில் அதன் இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: போர் நடவடிக்கையைக் குறிக்கும் வினையுடன் עַל பகைமை நோக்கிய திசையைக் குறிக்கிறது; எனவே ‘எதிராக’ பொருத்தமானது.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் நிலையான பெயரெழுத்தாக்கம்.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: தெய்வீகக் கட்டளையுடன் செயல் முழுமையாக ஒத்திருந்ததை ‘-படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முதன்மைச் செயலுக்கு முன்பே கொடுக்கப்பட்ட கட்டளையைத் தமிழின் பெயரெச்சத் தொடர் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: எபிரெயத்தில் மோசே கட்டளையின் நேரடிப் பொருளாக இருந்தாலும், ‘ஒருவருக்குக் கட்டளையிடுதல்’ என்பதே இயல்பான தமிழ் வாக்கிய அமைப்பு.
- source_word: וַיַּהַרְגוּ
  choice: கொன்றார்கள்
  rationale: הרג என்பதன் நேரடியான பொருளான ‘கொல்’ என்பதைத் தெளிவாகவும் மறைமுகப்படுத்தாமலும் தருகிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரையும்
  rationale: זָכָר வயதுவந்த ஆண்களை மட்டும் அல்லாமல் ஆண்பாலினரைக் குறிக்கக்கூடும். ‘ஆண்கள் அனைவரையும்’ என்பது தமிழில் இயல்பாக இருந்தாலும் வயதைச் சுருக்கிக் குறிப்பிடாது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: זָכָר என்பதன் பாலினத் துல்லியம்
  choice: ஆண்கள் அனைவரையும்
  alternative: எல்லா மனிதர்களையும்
  rationale: மூலச்சொல் மனிதர்களை பொதுவாக அல்ல, ஆண்பாலினரைத் தெளிவாகக் குறிக்கிறது. அதேவேளை வயதுவந்தவர்களுக்கு மட்டும் பொருளைச் சுருக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. வன்முறையின் கடுமையையோ זָכָר என்பதன் பரந்த பாலினச் சுட்டையையோ மென்மைப்படுத்தவில்லை.
