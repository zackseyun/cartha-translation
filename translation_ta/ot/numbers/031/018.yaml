  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: ta
  text: ஆனால், பெண்களுள் ஆணுடன் படுக்கை உறவு கொண்டிராத எல்லாச் சிறுமிகளையும் உங்களுக்காக உயிரோடு வைத்திருங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆணுடன் பாலியல் உறவு கொண்டிராத.’
    reason: மூலத்திலுள்ள ‘ஆணின் படுக்கை’ என்ற பாலியல் மறைமுகச் சொல்லாட்சியின் வெளிப்படையான பொருளைத் தெளிவுபடுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְ/כֹל
  choice: ஆனால் ... அனைவரையும்
  rationale: וְ இங்கு முந்தைய கட்டளைக்கு மாறான அடுத்த கட்டளையை அறிமுகப்படுத்துவதால், சூழலில் உள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ வெளிப்படுத்துகிறது. כֹל என்பதன் முழுமை ‘அனைவரையும்’ என்பதால் இயல்பாகக் காட்டப்படுகிறது.
- source_word: הַ/טַּף בַּ/נָּשִׁים
  choice: பெண்களுள் ... சிறுமிகள்
  rationale: טַף என்பது சிறு பிள்ளைகளைக் குறிக்கும்; בַּנָּשִׁים என்பதும் தொடர்ந்து வரும் பாலியல் அனுபவம் குறித்த வரையறையும் இங்கு பெண் பிள்ளைகளையே சுட்டுகின்றன. ஆகவே நவீனத் தமிழில் ‘சிறுமிகள்’ என்பது தெளிவாகவும் சூழலுக்கு உண்மையாகவும் உள்ளது; ‘பெண்களுள்’ பகுதி சார்ந்த எபிரெயக் கட்டமைப்பைப் பேணுகிறது.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: அறியாத
  rationale: יָדַע இச்சூழலில் பாலியல் உறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சி. ‘அறியாத’ என்பது அந்த மறைமுகத்தன்மையைப் பேணுகிறது.
- source_word: מִשְׁכַּב זָכָר
  choice: ஆணின் படுக்கையை
  rationale: இந்தச் சொற்றொடர் ஓர் ஆணுடன் பாலியல் உறவு கொள்வதைக் குறிக்கும் உருவகச் சொல்லாட்சி. ‘ஆணின் படுக்கை’ மூலத்தின் உருவகத்தைப் பேணுகிறது; அதன் வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַחֲיוּ לָ/כֶם
  choice: உங்களுக்காக உயிரோடு வைத்திருங்கள்
  rationale: חיה என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘உயிரோடு வைத்திருங்கள்’ என்ற பொருளுடையது. לָכֶם என்பதையும் ‘உங்களுக்காக’ என நேரடியாகப் பேணி, அதற்கு அப்பாற்பட்ட நோக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
theological_decisions:
- issue: பாலியல் உறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியை எவ்வளவு வெளிப்படையாக்குவது
  choice: முதன்மை உரையில் ‘ஆணின் படுக்கையை அறியாத’ என்று உருவகத்தைப் பேணுதல்
  alternative: ‘ஆணுடன் பாலியல் உறவு கொள்ளாத’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூல உரை ‘கன்னி’ போன்ற சாராம்சப் பெயரைப் பயன்படுத்தாமல், ‘அறிதல்/படுக்கை’ என்ற மறைமுகச் சொல்லாட்சியைப் பயன்படுத்துகிறது. அதையே முதன்மை உரையில் பேணுவது மூலத்தின் மொழியியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது; தெளிவான பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: טַף என்பதன் பெண்பால் குறிப்பு
  choice: ‘சிறுமிகள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘சிறு பிள்ளைகள்’ அல்லது ‘இளம் பிள்ளைகள்’
  rationale: טַף தனியாகப் பாலினம் சுட்டாததாக இருக்கலாம்; ஆனால் ‘பெண்களுள்’ என்பதும் ஓர் ஆணுடன் பாலியல் அனுபவம் இல்லாதவர்கள் என்ற தொடர்ந்த வரையறையும் இங்கு பெண் பிள்ளைகளைக் குறுக்கிக் காட்டுகின்றன. எனவே ‘சிறுமிகள்’ சூழலின் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உயிரோடு வைத்திருங்கள்’ கட்டளையின் நேரடித் தன்மையையும், ‘ஆணின் படுக்கையை அறியாத’ மூலத்தின் மறைமுக உருவகத்தையும் பேணுகின்றன. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
