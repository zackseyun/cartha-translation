lexical_decisions:
- source_word: וּמִמַּחֲצִית
  choice: பாதியிலிருந்து
  rationale: இணைப்பிடைச்சொல்லும் ‘இருந்து’ என்ற முன்னொட்டும் சூழலில் இயல்பாக வெளிப்படுகின்றன; மַחֲצִית இங்கு கொள்ளைப் பொருளின் பாதிப் பங்கைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் வழக்கமான சமூகப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; இது இங்கு ஆண்களை மட்டும் குறிக்காமல் இஸ்ரவேல் சமூகத்துக்குரிய பங்கைக் குறிக்கிறது.
- source_word: אֲשֶׁר חָצָה מֹשֶׁה
  choice: மோசே பிரித்து வைத்திருந்த
  rationale: חצה என்பது இரண்டு பாதிகளாகப் பிரித்தல் அல்லது ஒரு பங்கைப் பிரித்துவைத்தல்; முன் நிகழ்ந்த செயலைத் தமிழ் வினை வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הָאֲנָשִׁים
  choice: ஆண்களிடமிருந்து
  rationale: אֲנָשִׁים இச்சூழலில் போருக்குச் சென்ற ஆண் வீரர்களைக் குறிப்பதால் பாலினக் குறிப்பைத் துல்லியமாகப் பேணுகிறது.
- source_word: הַצֹּבְאִים
  choice: படையெடுப்புக்குச் சென்ற
  rationale: צבא என்ற பங்கேற்பு வடிவம் படைச் சேவையில் அல்லது போர்ப்பயணத்தில் ஈடுபட்டவர்களைக் குறிக்கிறது; இங்கு ‘படையெடுப்புக்குச் சென்ற’ என்பது சூழலுக்கும் தொடர்ச்சிக்கும் இயல்பானது.
