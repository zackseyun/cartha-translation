id: NUM.20.9
reference: Numbers 20:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: ta
  text: யாவே அவருக்குக் கட்டளையிட்டபடியே, மோசே யாவேக்கு முன்பாக இருந்த கோலை[a] எடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தடியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்தார்
  rationale: לקח என்பதன் Qal தொடர்கதை வடிவம் இங்கு எளிய கடந்தகாலச் செயலைக் குறிக்கிறது; தேவையற்ற கூடுதல் நுட்பமின்றி ‘எடுத்தார்’ என்பது இயல்பான தமிழ்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: הַמַּטֶּה
  choice: கோலை
  rationale: מַטֶּה இச்சூழலில் கையில் ஏந்தும் கோல் அல்லது தடியைக் குறிக்கிறது. ‘கோல்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: מִלִּפְנֵי
  choice: முன்பிருந்த
  rationale: מִלִּפְנֵי என்பதன் இடஞ்சார்ந்த ‘முன்பிருந்து’ என்ற பொருளைப் பாதுகாத்து, தமிழில் ‘யாவேக்கு முன்பிருந்த’ என இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר குறிக்கும் துல்லிய ஒத்திசைவை ‘படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּהוּ
  choice: அவனுக்குக் கட்டளையிட்ட
  rationale: வினை ‘அவனுக்குக் கட்டளையிட்டார்’ என்று பொருள்படும். தமிழ் சார்புவாக்கிய அமைப்பில் கட்டளை முன்பே கொடுக்கப்பட்டதை இயல்பாகத் தெரிவிக்கிறது; எபிரேய மூன்றாம் நபர் சுட்டின் குறிப்பை மாற்றவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: צִוָּהוּ-வில் கட்டளையிட்டவர் யார்?
  choice: யாவே என்று வாக்கிய அமைப்பால் தெளிவாகக் காட்டப்பட்டது
  alternative: ‘அவர்’ என்று மட்டும் வைத்து இலக்கணச் சுட்டின் வெளிப்படையான தெளிவின்மையைப் பாதுகாத்தல்
  rationale: உடனடி சூழலும் முன்வரும் יהוה என்பதும் கட்டளையிட்டவர் யாவே என்பதைத் தெளிவாக்குகின்றன. தமிழில் ‘அவர்’ என்பது மோசேயையும் குறிக்கக்கூடியதால், இயல்பான புரிதலுக்காகப் பெயர் மீண்டும் இடப்பட்டுள்ளது; புதிய இறையியல் தகவல் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யாவேக்கு முன்பிருந்த’ என்ற சொற்றொடர் எபிரேயத்தின் உறுதியான இடஞ்சார்ந்த படிமத்தைப் பாதுகாக்கிறது. மோசேக்கு மரியாதைப் பன்மை வினைமுற்றும், இறைப்பெயராக ‘யாவே’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
