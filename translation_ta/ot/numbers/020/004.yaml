id: NUM.20.4
reference: Numbers 20:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: ta
  text: நாங்களும் எங்கள் கால்நடைகளும் அங்கே சாகும்படி, யாவேயின் சபையை இந்தப் பாலைநிலத்திற்குள் ஏன் கொண்டுவந்தீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் கூட்டம்.”
    reason: கָהָל என்பதற்கு ‘சபை’ என்பதுடன் ‘கூட்டம்’ என்பதும் பொருத்தமான சூழலியல் மாற்றாகும்.
lexical_decisions:
- source_word: וְלָמָה
  choice: ஏன்
  rationale: வாவ் இணைப்புச்சொல் முந்தைய குற்றச்சாட்டின் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் கேள்வியின் இயல்பான ஓட்டத்திலேயே அந்தத் தொடர்பு வெளிப்படுவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הֲבֵאתֶם
  choice: கொண்டுவந்தீர்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்தல்/கொண்டுவருதல்’ எனப் பொருள்படும்; பன்மை முன்னிலையை மரியாதையற்றதாக ஆக்காமல் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: קְהַל יְהוָה
  choice: யெகோவாவின் சபை
  rationale: קהל என்பது கூடியிருக்கும் சமூகத்தைக் குறிக்கிறது; ‘சபை’ நவீன தமிழில் தெளிவான கூட்டுப்பொருளைக் கொண்டுள்ளது. יְהוָה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: இந்தப் பாலைநிலத்திற்குள்
  rationale: מִדְבָּר மக்கள் வாழ்வதற்கு அரிதான வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது; ‘பாலைநிலம்’ தமிழில் இயல்பாகவும் தேவையற்ற மணற்பாலைவனக் குறுக்கீடின்றியும் உள்ளது. אֶל இயக்கத்தை ‘-க்குள்’ வெளிப்படுத்துகிறது.
- source_word: לָמוּת שָׁם
  choice: இங்கே சாகும்படி
  rationale: இறப்பை நோக்கமாகவோ விளைவாகவோ காட்டும் infinitive கட்டமைப்பை ‘சாகும்படி’ பாதுகாக்கிறது. பேசுவோர் தற்போது அந்த இடத்திலிருப்பதால் שָׁם என்பதை இயல்பான தமிழ் நேர்பேச்சில் ‘இங்கே’ என வழங்குகிறது.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: நாங்களும் எங்கள் கால்நடைகளும்
  rationale: வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும் கூட்டுப் பெயரான בְּעִיר என்பதையும் நேரடியாகப் பிரதிபலிக்கிறது; ‘கால்நடைகள்’ மாடுகளை மட்டும் குறுக்காமல் வளர்ப்பு விலங்குகளை உள்ளடக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: எபிரெய உரை நான்கு எழுத்து இறைப் பெயரை நேரடியாகக் கொண்டுள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்குவது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: לָמוּת என்பதின் நோக்கம்/விளைவு நுணுக்கம்
  choice: சாகும்படி
  alternative: சாவதற்காக
  rationale: எபிரெய infinitive நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவு ஆகிய இரண்டையும் சுமக்க முடியும்; ‘சாகும்படி’ அந்தத் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது, திட்டமிட்ட கொலை என்ற பொருளை தேவையின்றி வலுப்படுத்தாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் மக்கள் எழுப்பும் கடுமையான குற்றச்சாட்டின் நேரடியான கேள்விநடை பாதுகாக்கப்பட்டுள்ளது. ‘சபை’ இங்கு வழிபாட்டுக் கட்டிடத்தை அல்ல, கூடிய சமூகத்தைச் சுட்டுகிறது.
