base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: ta
  text: ஆரோன் இறந்துவிட்டதைச் சபையினர் அனைவரும் கண்டபோது[a], இஸ்ரவேல் குடும்பம் முழுவதும்[b] ஆரோனுக்காக முப்பது நாட்கள் அழுதனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆரோன் இறந்துவிட்டதை உணர்ந்தபோது.’ எபிரெய மொழியில் நேரடியாக ‘கண்டபோது’ என்று உள்ளது; இங்கு அது அந்த உண்மையை அறிந்துகொண்டதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேல் குடும்பம் முழுவதும்’ என்பது இஸ்ரவேல் மக்கள் முழுவதையும் ஒரே கூட்டு மக்களாகக் குறிக்கும் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்.’ இச்சூழலில் ஒரு உண்மையை அறிந்துகொள்ளுதல் அல்லது உணர்ந்துகொள்ளுதல் என்ற நிழற்பொருளும் இருக்கலாம்; ‘கண்டபோது’ என்பது எபிரெயச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: כָּל הָעֵדָה
  choice: சபையினர் அனைவரும்
  rationale: עֵדָה என்பது இஸ்ரவேல் மக்களின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையினர்’ என்பது நவீனத் தமிழில் புரியக்கூடியதும், மூலத்தின் சமூகப் பொருளைத் தக்கவைப்பதும் ஆகும்.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு כִּי, சபையினர் கண்ட அல்லது உணர்ந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: גָוַע
  choice: இறந்துவிட்டதை
  rationale: גוע என்பது உயிர் நீத்தலைக் குறிக்கும் மரியாதைமிக்க வினை. ‘இறந்துவிட்டார்’ என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் தமிழில் தருகிறது.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: בכה என்பதன் நேரடிப் பொருள் ‘அழுதல்.’ துக்கம் அனுசரித்தார்கள் என்பதைக் காட்டிலும், மூலத்தில் உள்ள உணர்ச்சிசார் செயலை இது நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֶת אַהֲרֹן
  choice: ஆரோனுக்காக
  rationale: בכה உடன் வரும் אֶת, யாருக்காக அழுதார்கள் என்பதைக் குறிக்கிறது; தமிழில் ‘ஆரோனுக்காக அழுதார்கள்’ என்பது இயல்பான சொல்லாட்சி.
- source_word: שְׁלֹשִׁים יוֹם
  choice: முப்பது நாட்கள்
  rationale: இது காலநீட்டத்தைக் குறிக்கும் சொற்றொடர்; தமிழில் கூடுதல் முன்னொட்டு இன்றியே கால அளவை இயல்பாகக் கூறலாம்.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டார் அனைவரும்
  rationale: ‘இஸ்ரவேல் வீடு’ என்பது இஸ்ரவேல் மக்களை ஒரே கூட்டு மக்களாகக் குறிக்கும் நிலையான நிறுவனச் சொல்லாட்சி. ‘வீட்டார்’ அதன் குடும்பம்சார், கூட்டுப்பொருளைத் தக்கவைக்கிறது.
