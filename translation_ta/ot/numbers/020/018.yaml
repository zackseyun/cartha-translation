base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: ta
  text: ஆனால் ஏதோம் அவனிடம், “நீ என் வழியாகக் கடந்து செல்லக் கூடாது[a]; இல்லையெனில் வாளுடன் உன்னை எதிர்கொள்ளப் புறப்பட்டு வருவேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “என்னுள்.” ஏதோம் ஒரு நாடு/நிலப்பரப்பாகப் பேசுவதால், ஏதோமின் நிலத்தின் வழியாகச் செல்வதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னைச் சந்திக்கப் புறப்பட்டு வருவேன்.” இச்சூழலில் இச்சொற்றொடர் ஆயுதமேந்திய பகைமையான எதிர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் வழக்கமான கதைநடை வடிவம்; நேரடிக் கூற்றுக்குப் பின் இயல்பான நவீனத் தமிழ் சொற்பயன்பாடு.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל முன்னிடைச்சொல்லுடன் வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் முந்தைய வசனத்தில் பேசிய இஸ்ரவேலைச் சுட்டுகிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: நாடு/மக்களைக் குறிக்கும் இயற்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לֹא תַעֲבֹר
  choice: நீ ... கடந்து செல்லக் கூடாது
  rationale: עבר என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை imperfect இங்கு உறுதியான மறுப்பாகவும் தடையாகவும் உள்ளது; நவீனத் தமிழில் இயல்பாகவும் வலுவாகவும் தரப்படுகிறது.
- source_word: בִּי
  choice: என் வழியாக
  rationale: சொல்லுக்கு நெருக்கமாக ‘என்னுள்’; ஆனால் ஏதோம் ஒரு நாடு/நிலப்பரப்பாகப் பேசுவதால், அதன் நிலப்பகுதி வழியாகச் செல்வதைக் குறிக்கிறது. ஆளுருவகத்தைத் தக்கவைக்க ‘என் வழியாக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எச்சரிக்கையுடன் கூடிய அச்சுறுத்தலின் விளைவை அறிமுகப்படுத்துகிறது; இச்சூழலில் இயல்பான நவீனத் தமிழ் இணைப்பு.
- source_word: בַּחֶרֶב
  choice: வாளுடன்
  rationale: ஆயுதமேந்திய பகைமையான நடவடிக்கையைக் குறிக்கும் எபிரேயச் சொல்லாட்சியைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֵצֵא
  choice: புறப்பட்டு வருவேன்
  rationale: יצא என்பதன் முதலாம் நபர் ஒருமை வடிவம் அச்சுறுத்தல் சூழலில் எதிர்கால நோக்குடையது; எதிரியை நோக்கி வெளியே வருவதைக் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: לִקְרָאתֶךָ
  choice: உன்னை எதிர்கொள்ள
  rationale: அடிப்படையில் ‘உன்னைச் சந்திக்க’; வாள் குறித்த இராணுவ அச்சுறுத்தல் சூழலில் பகைமையாக எதிர்கொள்வதே பொருள். ‘எதிர்கொள்ள’ என்பது சூழலின் வலிமையைத் தக்கவைக்கிறது.
