base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: ta
  text: ஆரோனையும் அவன் மகன் எலெயாசரையும் அழைத்துக்கொண்டு, அவர்களை ஓர் என்னும் மலைக்கு[a] ஏற்றிக்கொண்டு போ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஓர் மலை”; இது வழக்கமாக “ஓர் என்னும் மலை” என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் கட்டளை வடிவம் அடிப்படையில் ‘எடு/கொள்’ எனப் பொருள்படும்; மனிதர்களை உடன் கூட்டிச் செல்வதைக் குறிக்கும் இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயரொலிபெயர்ப்பு.
- source_word: אֶלְעָזָר
  choice: எலெயாசர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரொலிபெயர்ப்பு.
- source_word: בְּנוֹ
  choice: அவன் மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி இச்சூழலில் ஆரோனைக் குறிக்கிறது.
- source_word: וְהַעַל
  choice: ஏற்றிக்கொண்டு போ
  rationale: עלה என்பதன் ஹிஃபில் கட்டளை வடிவத்தின் காரணவினைப் பொருளான ‘மேலே செல்லச் செய்/மேலே கொண்டு செல்’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: ஆரோனையும் எலெயாசரையும் சேர்த்துக் குறிக்கும் மனிதப் பன்மை நேர்ச்செயப்படுபொருள்.
- source_word: הֹר הָהָר
  choice: ஓர் மலை
  rationale: இது המקוםப்பெயர் הֹר உடன் ‘மலை’ என்ற பெயர்ச்சொல் சேர்ந்த எபிரெய வடிவம்; தமிழில் மரபான இடப்பெயராக்கம் ‘ஓர் மலை’.
