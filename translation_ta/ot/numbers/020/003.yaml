source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: ta
  text: மக்கள் மோசேயுடன் வாக்குவாதம் செய்து, “யாவேயின் முன்னிலையில் எங்கள் சகோதரர்கள் மடிந்தபோது நாங்களும் மடிந்திருந்தால் நன்றாயிருந்திருக்குமே![a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் முன்னிலையில் எங்கள் சகோதரர்கள் மடிந்ததுபோல நாங்களும் மடிந்திருந்தால் நன்றாயிருந்திருக்குமே!”
    reason: בִּגְוַע என்ற அமைப்பு முதன்மையாகக் காலச்சூழலைக் குறிக்கிறது; சூழலில் ‘மடிந்ததுபோல’ என்ற ஒப்புமை நுணுக்கமும் சாத்தியமாகிறது.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: வாக்குவாதம் செய்து
  rationale: ריב என்பது எதிர்த்து வாதிடுதல் அல்லது சச்சரவிடுதலைக் குறிக்கிறது. ‘வாக்குவாதம் செய்து’ என்பது மோசேயுடன் நடந்த பகைமையான மோதலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு עם என்பது இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது; ‘மக்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: עִם מֹשֶׁה
  choice: மோசேயுடன்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்’ பாதுகாக்கப்படுகிறது; ‘வாக்குவாதம்’ என்ற வினையே எதிர்ப்பின் தன்மையைத் தெளிவாக்குகிறது.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: என்றார்கள்
  rationale: எபிரெய மொழியின் வழக்கமான இரட்டைப் பேச்சு அறிமுகத்தைத் தமிழில் இயல்பாக ஒரே வினையால் தருகிறது.
- source_word: וְלוּ
  choice: …மடிந்திருந்தால் நன்றாயிருந்திருக்குமே
  rationale: לוּ வெளிப்படுத்தும் நிறைவேறாத ஏக்கத்தையும் புலம்பலையும் தமிழின் இயல்பான எதிர்நிலை விருப்பக் கட்டமைப்பு வெளிப்படுத்துகிறது.
- source_word: גָוַעְנוּ / בִּגְוַע
  choice: மடிந்திருந்தால் / மடிந்தபோதே
  rationale: ஒரே גוע வேரின் மீளுருவாக்கத்தை ‘மடி’ என்ற ஒரே தமிழ் வேரால் பாதுகாக்கிறது. ‘மடிந்தபோதே’ என்பது בְּ + infinitive construct தரும் காலச்சூழலை வெளிப்படுத்துகிறது.
- source_word: אַחֵינוּ
  choice: எங்கள் சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது; சூழலில் முன்பு இறந்த சக இஸ்ரவேலர்களைக் குறிக்கலாம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற பொருளையும் יהוה என்ற தனிப்பட்ட இறைப்பெயரையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே தமிழில் அதன் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: אַחֵינוּ என்பதிலுள்ள பாலின வடிவம்
  choice: எங்கள் சகோதரர்கள்
  alternative: எங்கள் உறவினர்கள்
  rationale: மூலச்சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை. சூழல் அதை விரிவாக்குமாறு தெளிவாகக் கோராததால் அந்த வடிவம் பாதுகாக்கப்படுகிறது.
- issue: בִּגְוַע காட்டும் தொடர்பு
  choice: எங்கள் சகோதரர்கள் மடிந்தபோதே
  alternative: எங்கள் சகோதரர்கள் மடிந்ததுபோல
  rationale: בְּ + infinitive construct காலத்தையும் சூழ்நிலையையும் அல்லது ஒப்புமை நிழலையும் தரக்கூடும். முதன்மை உரை காலப்பொருளைத் தருகிறது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வாக்குவாதம்’, ‘மடிந்திருந்தால்’, ‘முன்னிலையில்’ ஆகியவை இயல்பையும் மூலத்தின் தீவிரத்தையும் சமநிலைப்படுத்துகின்றன; மீண்டும் வரும் גוע வேர் தமிழிலும் மீளுருவாக்கப்பட்டுள்ளது.
