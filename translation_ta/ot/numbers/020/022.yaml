  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: ta
  text: அவர்கள் காதேசிலிருந்து புறப்பட்டார்கள். இஸ்ரவேல் மக்கள் அனைவரும் ஹோர் மலைக்கு[a] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஹோர் மலை’; சொல்லுக்குச் சொல், ‘ஹோர் என்னும் மலை.’ இது ஓர் இடப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பதன் பயணச் சூழலிலான பொருள் முகாமை விட்டுப் பயணத்தைத் தொடர்வதாகும்; ‘புறப்பட்டார்கள்’ என்பது இதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִקָּדֵשׁ
  choice: காதேசிலிருந்து
  rationale: எபிரெய மூலத்தில் ‘காதேஸ்’ என்ற பெயர் மட்டுமே உள்ளது; ‘காதேஸ்-பர்னேயா’ என்று விரிவாக்குவது வசனத்தின் சொற்களை மீறும்.
- source_word: וַיָּבֹאוּ
  choice: வந்தடைந்தார்கள்
  rationale: בוא என்பதற்கு ‘வருதல்/சென்றடைதல்’ என்ற பரந்த பொருள் உண்டு; இலக்காக ஒரு மலைப்பெயர் வருவதால் ‘வந்தடைந்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாக அதே கூட்டுப் பொருளை வழங்குகிறது.
- source_word: כָּל הָעֵדָה
  choice: அனைவரும்
  rationale: ‘முழுச் சபை/சமூகம்’ எனும் கருத்தை, முன்வரும் ‘இஸ்ரவேல் மக்கள்’ என்பதோடு இயல்பாக இணைத்து ‘அனைவரும்’ என வழங்குவது தேவையற்ற மீளுரையைத் தவிர்த்து כָּל הָעֵדָה என்பதன் முழுமையையும் காக்கிறது.
- source_word: הֹר הָהָר
  choice: ஓர் மலை
  rationale: இது ‘ஹோர் மலை’ என்ற இடப்பெயர்; தமிழில் வழக்கமான வேதாகம இடப்பெயர் வடிவமாக ‘ஓர் மலை’ பயன்படுத்தப்படுகிறது, பொதுப்பெயரான ‘ஒரு மலை’ என்று தவறாகப் புரியாத வகையில் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
