base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: ta
  text: 'பின்பு மோசே காதேசிலிருந்து ஏதோம் அரசனிடம் தூதுவர்களை அனுப்பினார்: “உன் சகோதரனாகிய இஸ்ரவேல் கூறுவது இதுதான்: எங்களுக்கு நேரிட்ட எல்லாத் துன்பங்களையும்[a] நீ அறிந்திருக்கிறாய்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லாத் துன்பத்தையும்” அல்லது “எல்லா இன்னலையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒருமையில் ஒரு தொகுப்பான துன்ப அனுபவத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “எங்களைக் கண்டடைந்த”; அதாவது, “எங்களுக்கு நேரிட்ட” அல்லது “எங்களை வந்தடைந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. ‘பின்பு’ இயல்பான தமிழ் கதைநடையில் நிகழ்வின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இராஜதந்திரச் சூழலில் இது விண்ணுலகத் தூதர்களை அல்ல, செய்தியைக் கொண்டு செல்லும் மனிதப் பிரதிநிதிகளைக் குறிக்கிறது.
- source_word: מִקָּדֵשׁ
  choice: காதேசிலிருந்து
  rationale: எபிரெய உரையில் ‘காதேஸ்’ என்ற இடப்பெயர் மட்டுமே உள்ளது; இவ்வசனத்தில் இல்லாத நீண்ட பெயர் சேர்க்கப்படவில்லை.
- source_word: מֶלֶךְ אֱדוֹם
  choice: ஏதோம் அரசனிடம்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுதான்
  rationale: இது தூதுச் செய்திகளுக்குரிய வழக்கமான அறிவிப்பு வாய்பாடு. தமிழில் மேற்கோளை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: உன் சகோதரனாகிய இஸ்ரவேல்
  rationale: ஏதோமுக்கும் இஸ்ரவேலுக்கும் இடையிலான மூதாதையர் உறவைச் சுட்டும் குடும்ப உருவகத்தை அப்படியே காக்கிறது.
- source_word: אַתָּה יָדַעְתָּ
  choice: நீ அறிவாய்
  rationale: எபிரெய நிறைவுவினை இங்கு தற்போதைய அறிவுநிலையைச் சுட்டுகிறது; வெளிப்படையான ‘நீ’ வலியுறுத்தலையும் காக்கிறது.
- source_word: כָּל הַתְּלָאָה
  choice: எல்லாத் துன்பங்களையும்
  rationale: இந்தச் சொல் அனுபவிக்கப்பட்ட வருத்தம், இன்னல், துயரம் ஆகிய பொருள்களை உடையது. சூழலில் இயல்பான தமிழுக்காக எண்ணிக்கையில் பன்மையாக வழங்கப்பட்டுள்ளது; மூலத்தின் தொகுப்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: எங்களுக்கு நேரிட்ட
  rationale: சொல்லுக்கு சொல் ‘எங்களைக் கண்டடைந்த’ என்ற எபிரெய மரபுத்தொடர், தமிழில் ‘எங்களுக்கு நேரிட்ட’ என இயல்பாகவும் பொருள் மாறாமலும் அமைகிறது.
theological_decisions:
- issue: இஸ்ரவேலுக்கும் ஏதோமுக்கும் இடையிலான உறவுமொழி
  choice: உன் சகோதரனாகிய இஸ்ரவேல்
  alternative: உன் உறவினனாகிய இஸ்ரவேல்
  rationale: இவ்விண்ணப்பம் ஏசா–யாக்கோபு வழியான நாடுகளின் மூதாதையர் உறவை நேரடியான குடும்பமொழியில் முன்வைக்கிறது. பொதுவான ‘உறவினன்’ என்று மென்மைப்படுத்தாமல் ‘சகோதரன்’ என்ற உருவகம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘காதேஸ்,’ ‘ஏதோம்,’ ‘இஸ்ரவேல்’ என்ற பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. குடும்ப உறவைக் குறிக்கும் மூல உருவகம் முதன்மை உரையில் காக்கப்பட்டுள்ளது.
