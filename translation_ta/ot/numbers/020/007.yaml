  yaml_path: translation/ot/numbers/020/007.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: YHWH (יהוה); “யாவே” அல்லது “யெகோவா” என்றும் வழங்கப்படுகிறது.'
    reason: இறைபெயரின் எபிரெய எழுத்துவடிவத்தையும் மாற்று வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் பியேல் வடிவம் இங்கு வழக்கமான எபிரெயக் கதைநடைப் பேச்சு அறிமுகமாக வருகிறது. ‘பேசி’ என்பது தொடரும் לֵאמֹר என்பதோடு அதன் அமைப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைபெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது; அதன் பண்டைய துல்லிய உச்சரிப்பு உறுதியாகத் தெரியாததால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל குறிக்கும் பேச்சின் நோக்குநரையும் מֹשֶׁה என்ற பெயரையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கைத் தமிழில் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எழுத்துகளாலான தனிப்பெயரே உள்ளது. ஆகவே பெயரைத் தக்கவைக்கும் ஒலிபெயர்ப்பு முதன்மை உரையில் பயன்படுத்தப்படுகிறது; உறுதியற்ற பண்டைய உச்சரிப்பையும் மாற்று மரபையும் அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க கதைநடை. ‘பேசி, கூறியதாவது’ என்பது மூலத்தின் இரு கூறுகளையும் தக்கவைத்து, அடுத்த வசனத்தில் பேச்சு தொடர்வதை இயல்பாக அறிமுகப்படுத்துகிறது.
