  to: ஆரோனிடமிருந்து அவருடைய ஆடைகளைக் கழற்றி[a], அவற்றை அவருடைய மகன் எலெயாசாருக்கு அணிவி. பின்னர் ஆரோன் சேர்க்கப்படுவார்[b]; அங்கே இறப்பார்.
