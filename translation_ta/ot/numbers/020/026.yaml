base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: ta
  text: ஆரோனிடமிருந்து அவருடைய ஆடைகளைக் கழற்றி[a], அவற்றை அவருடைய மகன் எலெயாசாருக்கு அணிவி. பின்னர் ஆரோன் சேர்க்கப்படுவார்[b]; அங்கே இறப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலின்படி இவை அவருடைய ஆசாரிய ஆடைகள். எபிரெயத்தில் ‘அவருடைய ஆடைகள்’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘சேர்க்கப்படுதல்’ என்பது இறப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். மற்ற இடங்களில் இது ‘தம் மக்களோடு சேர்க்கப்படுதல்’ என்று முழுமையாக வருகிறது; அந்தக் கூடுதல் சொற்கள் இவ்வசனத்தில் இல்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: ஆரோனின் ஆடைகளை அவரிடமிருந்து கழற்றி
  rationale: פשט என்பதன் ஹிபீல் கட்டளை வடிவம், ஒருவரிடமிருந்து ஆடைகளைக் கழற்றுவதைக் குறிக்கிறது. ‘அவரிடமிருந்து கழற்றி’ என்பது செயப்படுபவரையும் ஆடைகளையும் இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: בְּגָדָיו
  choice: அவரின் ஆடைகள்
  rationale: בגד என்பது பொதுவாக ஆடை என்று பொருள். சூழலில் இவை ஆசாரிய ஆடைகள் என்றாலும், மூல வசனம் அந்த விளக்கச் சொல்லை நேரடியாகக் கொண்டிருக்கவில்லை.
- source_word: וְהִלְבַּשְׁתָּם
  choice: அவற்றை … அணிவி
  rationale: ஹிபீல் வடிவம், அந்த ஆடைகளை மற்றொருவர் அணியும்படி செய்வதைக் குறிக்கிறது. பொருளாகிய ஆடைகளைக் குறிக்கும் பன்மை பின்னொட்டு ‘அவற்றை’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֶת־אֶלְעָזָר בְּנוֹ
  choice: அவருடைய மகன் எலெயாசாருக்கு
  rationale: மகன் என்ற உறவையும் எலெயாசார் என்ற பெயரையும் இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: יֵאָסֵף
  choice: சேர்க்கப்பட்டு
  rationale: אסף என்பதன் நிஃபால் வடிவம் இறப்புச் சூழலில் ‘சேர்க்கப்படுதல்’ என்ற மரபுத்தொடராக வருகிறது. இவ்வசனத்தில் ‘தம் மக்களோடு’ என்ற சொற்கள் இல்லாததால் அவை முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: וּמֵת שָׁם
  choice: அங்கே இறப்பார்
  rationale: இணைப்புடன் வரும் வினை, முந்திய எதிர்கால நிகழ்வைத் தொடர்ந்து அங்கே மரணம் நிகழும் என்பதைச் சொல்கிறது.
theological_decisions:
- issue: יֵאָסֵף என்ற இறப்பு மரபுத்தொடர்
  choice: ‘சேர்க்கப்பட்டு’ என்று மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘தம் மக்களோடு சேர்க்கப்பட்டு’ அல்லது ‘எடுத்துக்கொள்ளப்பட்டு’
  rationale: வேறு இடங்களில் காணப்படும் முழுமையான ‘தம் மக்களோடு சேர்க்கப்படுதல்’ என்ற சொற்றொடரின் பொருள் இங்கு பின்னணியில் இருந்தாலும், לְעַמָּיו (‘தம் மக்களோடு’) இவ்வசனத்தில் இல்லை. ஆகவே அந்தச் சொற்களைச் சேர்க்காமலும், மரபுத்தொடரை வெறும் ‘இறத்தல்’ என்று சமப்படுத்தாமலும் மூலத்தின் சுருக்கத்தையும் இறையியல் நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான கட்டளையின் வலிமையும் மரியாதையான பெயர்ச் சுட்டுமுறையும் காக்கப்பட்டுள்ளன. சூழலால் தெரியும் ‘ஆசாரிய’ மற்றும் ‘தம் மக்களோடு’ ஆகிய விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
