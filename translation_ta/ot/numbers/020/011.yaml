  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: ta
  text: அப்போது மோசே தன் கையை உயர்த்தி, தன் கோலால் பாறையை இருமுறை அடித்தார். ஏராளமான தண்ணீர் வெளியே வந்தது; சபையினரும் அவர்களுடைய கால்நடைகளும் குடித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: உயர்த்தி
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம் இங்கு ‘உயர்த்துதல்’ என்ற உடல்சார்ந்த செயலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியைத் தமிழின் தற்சுட்டுப் பயன்பாட்டின்படி ‘தன்’ என இயல்பாகக் காட்டுகிறது.
- source_word: וַיַּךְ
  choice: அடித்தார்
  rationale: נכה இங்கு ‘அடித்தல்’ அல்லது ‘தாக்குதல்’ என்று பொருள்படும்; கருவியால் பாறையை அடிக்கும் செயலை ‘அடித்தார்’ தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: הַסֶּלַע
  choice: பாறையை
  rationale: סֶלַע என்பதற்கான சூழலுக்கேற்ற பொதுவான நவீனத் தமிழ் இணை ‘பாறை’ ஆகும்.
- source_word: בְּמַטֵּהוּ
  choice: தன் கோலால்
  rationale: מַטֶּה என்பது கோல் அல்லது தடி எனப் பொருள்படும்; மோசேயுடன் தொடர்புடைய இக்கருவிக்கு ‘கோல்’ தெளிவானதும் வேதாகமக் கதையோட்டத்துக்கு ஏற்றதுமான சொல்லாகும்.
- source_word: פַּעֲמָיִם
  choice: இருமுறை
  rationale: எபிரெய இருமை வடிவத்தின் வினையடைப் பொருளை இயல்பான தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: ஏராளமான தண்ணீர் வெளியே வந்தது
  rationale: רַבִּים இங்கு நீரின் மிகுந்த அளவைக் குறிக்கிறது; தமிழ் ஒருமை இயைபோடு இச்சொற்றொடர் அளவையும் நிகழ்வையும் இயல்பாகத் தருகிறது.
- source_word: וַתֵּשְׁתְּ
  choice: குடித்தார்கள்
  rationale: எபிரெயத்தில் கூட்டு ஒருமையான עֵדָה-வுடன் வினை பெண்பால் ஒருமையில் வந்தாலும், தமிழில் மக்கள் கூட்டத்தையும் அதனுடன் கால்நடைகளையும் இணைத்த எழுவாய்க்குப் பன்மை வினை இயல்பானது.
- source_word: הָעֵדָה
  choice: சபையினர்
  rationale: עֵדָה என்பது கூடியிருக்கும் இஸ்ரவேல் மக்களைக் குறிக்கும் கூட்டுப்பெயர்; ‘சபையினர்’ குடிக்கும் மனிதர்களைத் தெளிவாகக் குறைத்து விடாமல், கூட்டுச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְעִירָם
  choice: அவர்களுடைய கால்நடைகளும்
  rationale: בְּעִיר என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பரந்த வகையில் குறிக்கிறது; ‘கால்நடைகள்’ நவீனத் தமிழில் துல்லியமான பொதுச்சொல்.
theological_decisions:
- issue: மோசே பாறையை அடித்த செயலை விவரிக்கும் முறை
  choice: ‘தன் கோலால் பாறையை இருமுறை அடித்தார்’ என்று நிகழ்வை நேரடியாக விவரித்தல்
  alternative: இந்த மொழிபெயர்ப்பு வரியிலேயே கீழ்ப்படியாமை அல்லது தீர்ப்பைக் குறிக்கும் விளக்கச் சொற்களைச் சேர்த்தல்
  rationale: சுற்றியுள்ள உரை மோசேயின் செயலைப் பிரச்சினைக்குரியதாகக் காட்டினாலும், இவ்வசனம் செயலும் அதன் விளைவும் என்ன என்பதை மட்டும் கூறுகிறது. ஆகவே மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் மதிப்பீட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், கண்ணியமான கதையாடல் நடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இரண்டு வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; தகவல் அல்லது இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
