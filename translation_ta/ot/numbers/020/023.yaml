  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: ta
  text: 'எதோம் நாட்டின் எல்லையில் உள்ள ஹோர் மலையில் யாவே[a] மோசேயிடமும் ஆரோனிடமும் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: YHWH; மாற்று ஒலிபெயர்ப்பு: “யெகோவா.”'
    reason: தெய்வீகப் பெயரின் எபிரெய மெய்யெழுத்துகளையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறியது
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்/கூறு’. அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் தமிழ் வாக்கிய அமைப்புக்கு ‘கூறியது:’ இயல்பாக அமைகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமாக வழங்குகிறது; மூல எழுத்துகளும் மாற்று ஒலிபெயர்ப்பும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இரு பெயர்களுக்கும் முன் எபிரெயத்தில் மீண்டும் வரும் אֶל என்பதைக் ‘-இடமும் ... -இடமும்’ என்ற இணையான தமிழ் அமைப்பு பிரதிபலிக்கிறது.
- source_word: בְּהֹר הָהָר
  choice: ஓர் மலையில்
  rationale: הֹר הָהָר என்பது மரபாக ‘ஓர் மலை’ என்ற இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் பெயரையும் நிலவியல் வகையையும் இயல்பாகச் சேர்க்க ‘ஓர் மலை’ பயன்படுத்தப்படுகிறது.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: எதோம் நாட்டின் எல்லையில்
  rationale: עַל גְּבוּל என்பது எல்லையிலுள்ள இடத்தைச் சுட்டுகிறது; אֶרֶץ אֱדוֹם என்பதை இயல்பான நவீன தமிழில் ‘எதோம் நாடு’ என வழங்குகிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய மொழிநடையை தமிழில் முக்காற்புள்ளி மூலம் இயல்பாக வெளிப்படுத்துகிறது; தனியாக ‘சொல்லி’ என மீளுரைப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் பெயராகவே வைத்திருக்கிறது; ஒலிப்பின் உறுதியின்மையை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதும் மரியாதைமிக்கதுமான விவிலிய உரைநடை. எபிரெய வாக்கியத்தின் இடச்சூழல் முதலில் அமைக்கப்பட்டு, அடுத்த வசனத்தின் நேரடி உரைக்கு முக்காற்புள்ளியுடன் வழிவகுக்கப்பட்டுள்ளது.
