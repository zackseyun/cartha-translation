translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை வேதாகமக் கண்ணியமுள்ள நடை. ‘வலிமையான கரம்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டது; ‘பெரும் படை’ மூலம் எபிரெய மரபுத்தொடரின் சூழல்சார் பொருள் தெளிவாக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்கு அருகில் முதன்மை உரையில் இடப்பட்டுள்ளன.
