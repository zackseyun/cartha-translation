base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: ta
  text: ஆனால் அவன், “நீ கடந்து செல்லக் கூடாது” என்றான். ஏதோம் அவனைச் சந்திக்க[a] ஒரு பெரும் படையுடனும்[b] வலிமையான கரத்துடனும்[c] வெளியே வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனை எதிர்கொள்ள” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இயல்பில் நடுநிலையானது; ஆனால் இங்குள்ள சூழல் பகைமையானது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “கனமான மக்களுடன்”; இது பெரிய அல்லது வலிமைமிக்க ஆட்கள் கூட்டத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “மிகுந்த வல்லமையுடன்” என்றும் பொருள் கொள்ளலாம்; சொல்லுக்கு சொல், “வலிமையான கரத்துடன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் அவன் … என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; முந்தைய வேண்டுகோளுக்கு எதிரான மறுப்பைச் சூழல் காட்டுவதால், ‘ஆனால்’ எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது. எழுவாய் எபிரெயத்தில் மறைமுகமாக இருப்பதை ‘அவன்’ தக்கவைக்கிறது.
- source_word: לֹא תַעֲבֹר
  choice: நீ கடந்து செல்லக் கூடாது
  rationale: இங்குள்ள imperfect உறுதியான தடை அல்லது அனுமதி மறுப்பைக் குறிக்கிறது; ஏதோமின் நிலப்பரப்பைக் கடப்பதே கருத்து.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: ஏதோம் … புறப்பட்டு வந்தது
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே புறப்படுதல்.’ இராணுவ நடவடிக்கை என்பதை வினையிலேயே மிகைப்படுத்தாமல், எதிரே வந்த இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க
  rationale: לקראת என்பதன் அடிப்படைப் பொருள் நடுநிலையாக ‘சந்திக்க/எதிர்கொள்ளச் செல்லுதல்.’ சூழல் பகைமையானது என்றாலும், அந்தப் பகைமையை முதன்மை உரையின் வினையிலேயே சேர்க்காமல் ambiguity தக்கவைக்கப்படுகிறது.
- source_word: בְּעַם כָּבֵד
  choice: ஒரு பெரும் படையுடன்
  rationale: சொல்லுக்கு சொல் ‘கனமான மக்களுடன்’; இச்சொற்றொடர் பெரிதான அல்லது வலிமைமிக்க மனிதக் கூட்டத்தைக் குறிக்கும். பகைமைச் சூழலில் ‘பெரும் படை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּבְיָד חֲזָקָה
  choice: வலிமையான கரத்துடன்
  rationale: ‘வலிமையான கை/கரம்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, வலிமை அல்லது ஆற்றலால் வந்ததைத் தெரிவிக்கிறது.
