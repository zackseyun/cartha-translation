translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுச் சூழலைக் காக்க ‘தந்தையர்’ என்றும், எகிப்தை நோக்கிய இயக்கத்தில் உள்ள ‘இறங்குதல்’ உருவகத்தைக் காக்க ‘இறங்கிச் சென்றார்கள்’ என்றும் தரப்பட்டுள்ளது. மூலத்தின் மூன்று இணைப்புப் பகுதிகள் தமிழில் வாசிக்கத் தெளிவாக மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளன.
