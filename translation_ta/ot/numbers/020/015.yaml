base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: ta
  text: எங்கள் தந்தையர்[a] எகிப்துக்கு இறங்கிச் சென்றார்கள். நாங்கள் எகிப்தில் பல நாட்கள்[b] வாழ்ந்தோம். எகிப்தியர்கள் எங்களையும் எங்கள் தந்தையரையும் மோசமாக நடத்தினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் முன்னோர்கள்.” இரண்டு இடங்களிலும் எபிரெய மொழியில் நேரடியாக “எங்கள் தந்தையர்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பல நாட்கள்” என்பது நீண்ட காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்களுக்கும் எங்கள் தந்தையருக்கும் தீங்கு செய்தார்கள்” அல்லது “எங்களுக்கும் எங்கள் தந்தையருக்கும் தீமை செய்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: יָרַד என்பதன் அடிப்படைப் பொருளான ‘இறங்குதல்’ என்பதையும், எகிப்தை நோக்கிய பயணத்தைக் குறிக்கும் எபிரெய மரபுவழக்கையும் பாதுகாக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
- source_word: אֲבֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘எங்கள் தந்தையர்.’ இச்சூழலில் அது முன்னோர்களைக் குறித்தாலும், மூலத்தின் குடும்ப-வரலாற்றுச் சொல்லாட்சியை முதன்மை உரை பாதுகாக்கிறது.
- source_word: מִצְרַיְמָה
  choice: எகிப்துக்கு
  rationale: இடத்தை நோக்கிய இயக்கத்தைக் காட்டும் திசைவேற்றுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַנֵּשֶׁב
  choice: வாழ்ந்தோம்
  rationale: יָשַׁב இங்கு ஓர் இடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது; ‘வாழ்ந்தோம்’ தெளிவான நவீனத் தமிழ்.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: ‘பல நாட்கள்’ என்ற மூலத்தின் நேரடிச் சொல்லாட்சியைப் பாதுகாக்கிறது; அது நீண்ட காலத்தைக் குறிக்கும் மரபுத்தொடர் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיָּרֵעוּ
  choice: மோசமாக நடத்தினார்கள்
  rationale: Hiphil வடிவம் ஒருவருக்குத் தீமை அல்லது கேடு செய்வதைக் குறிக்கிறது. ‘மோசமாக நடத்தினார்கள்’ என்பது அதன் பரந்த எதிர்மறை நெறிப்பொருளை இயல்பான தமிழில் தருகிறது; தீங்கின் குறிப்பிட்ட வடிவத்தை தேவையின்றி வரையறுக்கவில்லை.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: சொல் வடிவில் ‘எகிப்து’ என்றாலும், பன்மை வினைச்சொல் இங்கு எகிப்து மக்களையே எழுவாயாகக் காட்டுகிறது; தமிழில் ‘எகிப்தியர்கள்’ என்று தெளிவுபடுத்துவது இயல்பு.
- source_word: לָנוּ ... וְלַאֲבֹתֵינוּ
  choice: எங்களையும் எங்கள் தந்தையரையும்
  rationale: לְ குறிக்கும் பாதிக்கப்பட்ட தரப்புகளைத் தமிழ் செயப்படுபொருள் வடிவில் இயல்பாகத் தருகிறது; மூலத்தில் மீண்டும் வரும் ‘எங்கள் தந்தையர்’ என்பதும் விடப்படவில்லை.
