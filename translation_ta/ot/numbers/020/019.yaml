  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் பன்மையான மக்கள் பேச்சிலிருந்து ஒருமை முதலாம் நபருக்கு ஏற்படும் மாற்றம் பாதுகாக்கப்பட்டுள்ளது; எபிரெய மரபுத்தொடர்களின் சொல்லர்த்தத் தகவல் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளது.
