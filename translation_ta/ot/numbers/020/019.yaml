base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: ta
  text: இஸ்ரவேலர்[a] அவனிடம், “நாங்கள் நெடுஞ்சாலையில்[b] செல்வோம். நானும் என் கால்நடைகளும் உன் தண்ணீரைக் குடித்தால், அதற்கான விலையைத் தருவேன். நான் காலால் மட்டும் கடந்து செல்ல அனுமதியுங்கள்; அதற்கு மேல் வேறொன்றுமில்லை[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயச் சொல் உயர்த்தி அமைக்கப்பட்ட சாலை அல்லது பிரதான சாலையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “என் கால்களால் நான் கடந்துசெல்லட்டும்”; இது நாட்டினூடே வெறுமனே வழிப்பயணம் செய்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: எபிரெய மொழியில் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றிருந்தாலும், மக்களினத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல் ‘இஸ்ரவேலர்’ ஆகும்; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּמְסִלָּה
  choice: நெடுஞ்சாலையில்
  rationale: מְסִלָּה என்பது அமைக்கப்பட்ட அல்லது உயர்த்தப்பட்ட பிரதான சாலையைக் குறிக்கலாம். இச்சூழலில் நாட்டினூடே செல்லும் நிர்ணயிக்கப்பட்ட பெரிய வழியை ‘நெடுஞ்சாலை’ தெளிவாகக் காட்டுகிறது.
- source_word: נַעֲלֶה
  choice: செல்வோம்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘மேலே செல்வோம்’ என்றாலும், இங்கு ஒரு நிலப்பகுதி வழியே பயணிப்பதே கருத்து. தமிழில் தேவையற்ற நிலவியல் பொருளைத் திணிக்காமல் இயக்கத்தை இயல்பாகத் தெரிவிக்க ‘செல்வோம்’ பயன்படுத்தப்படுகிறது.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: நானும் என் கால்நடைகளும் ... குடித்தால்
  rationale: ஒருமை முதலாம் நபரும் ‘என் கால்நடைகள்’ என்பதும் மூலத்தில் உள்ளபடியே பாதுகாக்கப்படுகின்றன. மக்கள் கூட்டத்தின் சார்பாகப் பேசுபவர் தம்மை ஒருமையில் குறிப்பிடும் மாற்றத்தைச் சீராக்கவில்லை.
- source_word: וְנָתַתִּי מִכְרָם
  choice: அதற்கான விலையைத் தருவேன்
  rationale: מֶכֶר விலை அல்லது செலுத்த வேண்டிய தொகையைக் குறிக்கிறது; பின்னொட்டு குடிக்கப்பட்ட தண்ணீரைக் குறிப்பிடுவதாக இயல்பாகப் புரிகிறது.
- source_word: רַק אֵין דָּבָר
  choice: வேறொன்றும் வேண்டாம்
  rationale: கோரிக்கையை மிகக் குறைந்த ஒன்றாகக் காட்டும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: நான் கால்நடையாக மட்டும் கடந்துசெல்ல அனுமதி தா
  rationale: சொல்லர்த்தமாக ‘என் கால்களால் நான் கடந்துசெல்வேன்/கடந்துசெல்லட்டும்’ என்ற வாக்கியம், இச்சூழலில் எளிய வழிப்பயணத்திற்கான வேண்டுகோள். வேண்டுகோள் வலிமையையும் காலால் செல்வதையும் தமிழ் தெளிவாக வெளிப்படுத்துகிறது.
