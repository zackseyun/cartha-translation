lexical_decisions:
- source_word: וְ/לֹא הָיָה מַיִם
  choice: தண்ணீர் இல்லை
  rationale: היה என்பதன் இருப்பைக் குறிக்கும் பயன்பாட்டையும் מַיִם என்பதன் பொருட்பெயர் அர்த்தத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது. தொடக்க וְ தனியாகக் காலச்சுட்டாக விரிவாக்கப்படவில்லை.
- source_word: לָ/עֵדָה
  choice: சபையாருக்கு
  rationale: עֵדָה இங்கு ஒன்றாகத் திரண்ட இஸ்ரவேல் மக்களைக் குறிக்கிறது; ‘சபையார்’ அதன் கூட்டு மக்கள் அர்த்தத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וַ/יִּקָּהֲלוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: קהל வேர்ச்சொல்லின் குழுவாகக் கூடுதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: மோசேக்கும் ஆரோனுக்கும் எதிராக
  rationale: புகார் மற்றும் மோதல் சூழலில் עַל பகைமையான எதிர்ப்பைக் குறிக்கிறது. எபிரெயத்தில் இருவருக்கும் முன் முன்னிடைச்சொல் திரும்ப வருவதன் பகிர்ந்த வலியுறுத்தலைத் தமிழின் இணைவேற்றுமை அமைப்பு இயல்பாகக் காட்டுகிறது.
