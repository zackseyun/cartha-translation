source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் யாவேவுடன் வாதாடிய மெரிபாவின் தண்ணீர்கள்[a] இவையே; அவர் அவர்களிடையே தம்மைப் பரிசுத்தராக வெளிப்படுத்தினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெரிபா” என்பதற்கு “வாக்குவாதம்” அல்லது “சச்சரவு” என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் அவர்களில் பரிசுத்தராகக் காணப்பட்டார்”; அல்லது, “அவர்கள்மூலம் தம்மைப் பரிசுத்தராக நிரூபித்தார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: இவையே
  rationale: இந்தச் சுட்டுப்பெயர், அந்தத் தண்ணீர்களை அடையாளப்படுத்தும் பெயரிடும் கூற்றாக வருகிறது; தமிழில் ‘இவையே’ என்பது வலியுறுத்தலையும் இயல்பான நிகழ்கால அடையாளப்படுத்தலையும் காக்கிறது.
- source_word: מֵי מְרִיבָה
  choice: மெரிபாவின் தண்ணீர்கள்
  rationale: מְרִיבָה இங்கு கதையால் நிறுவப்பட்ட இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டது; அதன் ‘வாக்குவாதம்/சச்சரவு’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רָבוּ
  choice: வாக்குவாதம் செய்தார்கள்
  rationale: ריב என்பதன் சச்சரவிடுதல், எதிர்த்து வாதிடுதல் என்ற பொருளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் பன்மை வடிவத்தையும் உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் மரபான அமைப்பையும் நெருக்கமாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: וַיִּקָּדֵשׁ
  choice: தம்மைப் பரிசுத்தராக வெளிப்படுத்தினார்
  rationale: קדש என்பதன் நிஃபால் வடிவிலுள்ள மத்திய/செயப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் தருகிறது; மனிதர்கள் கடவுளைப் பரிசுத்தமாக்கினார்கள் என்ற தவறான கருத்தைத் தவிர்த்து, அவருடைய பரிசுத்தம் வெளிப்பட்டது என்பதைக் கூறுகிறது.
- source_word: בָּם
  choice: அவர்களிடையே
  rationale: ב־ என்பதன் ‘அவர்களில்/அவர்களிடையே/அவர்கள்மூலம்’ என்ற சாத்தியங்களுள், இஸ்ரவேலருடன் தொடர்புடைய இந்நிகழ்வில் பரிசுத்தம் வெளிப்பட்டது என்பதை இயல்பாகக் கூறுகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறில் யெகோவாவின் பரிசுத்தப்படுத்தலை எவ்வாறு மொழிபெயர்ப்பது
  choice: அவர் அவர்களிடையே தம்மைப் பரிசுத்தராக வெளிப்படுத்தினார்
  alternative: அவர் அவர்களில் பரிசுத்தராகக் காணப்பட்டார் / அவர்கள்மூலம் தம்மைப் பரிசுத்தராக நிரூபித்தார்
  rationale: நிஃபால் வடிவம் செயப்பாட்டு அல்லது தற்சுட்டு நுணுக்கத்தைக் கொண்டிருக்கலாம். முதன்மை வாசகம் கடவுள் வேறொருவரால் பரிசுத்தமாக்கப்பட்டார் என்று உணர்த்தாமல், இந்நிகழ்வில் அவருடைய பரிசுத்தம் வெளிப்பட்டது என்பதைக் காக்கிறது; இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் நீடிக்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்பதைக் கூட்டுப்பெயராக மாற்றலாமா
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் பன்மை அமைப்பை முதன்மை வாசகத்தில் காக்கிறது; அதேவேளை சூழலில் இது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை வேதாகம உரைக்கேற்ற கண்ணியமான நடை. மூலத்தின் பெயரிடும் அமைப்பும், ஆண்பால் இனப்பெயர் வடிவமும், இறுதிக் கூறின் செயப்பாட்டு/தற்சுட்டு தெளிவின்மையும் இயன்றவரை காக்கப்பட்டுள்ளன.
