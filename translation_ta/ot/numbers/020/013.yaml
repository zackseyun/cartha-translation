revisions:
- from: இவையே மெரிபாவின் தண்ணீர்கள்.[a] இங்கே இஸ்ரவேலின் மகன்கள் யெகோவாவுடன் வாக்குவாதம் செய்தார்கள்; அவர் அவர்களிடையே தம்மைப் பரிசுத்தராக வெளிப்படுத்தினார்.[b]
  to: இஸ்ரவேலின் மகன்கள் யாவேவுடன் வாதாடிய மெரிபாவின் தண்ணீர்கள்[a] இவையே; அவர் அவர்களிடையே தம்மைப் பரிசுத்தராக வெளிப்படுத்தினார்.[b]
