source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: ta
  text: ஆரோன் தன் மக்களோடு சேர்க்கப்படுவான்[a]. ஏனெனில், இஸ்ரவேலின் மகன்களுக்கு நான் கொடுத்த நிலத்திற்குள் அவன் செல்லமாட்டான். மெரிபா நீர்நிலைகளில் நீங்கள் என் கட்டளைக்கு[b] எதிராகக் கலகம் செய்தீர்கள் என்பதே இதற்குக் காரணம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது மரணத்தைக் குறிக்கும் எபிரேய மரபுத்தொடர்; சொல்லுக்குச் சொல், ‘தன் மக்களோடு சேர்க்கப்படுவான்.’
    reason: மரபுத்தொடரின் பொருள்
  - marker: b
    text: சொல்லுக்குச் சொல், ‘என் வாய்க்கு’; அதாவது, நான் வாயால் கூறிய கட்டளைக்கு.
    reason: சொற்பொருள் மாற்று
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: தன் மக்களிடம் சேர்த்துக்கொள்ளப்படுவான்
  rationale: மரணத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரை வெறுமனே ‘இறந்துபோவான்’ என்று சுருக்காமல், அதன் இலக்கியச் செறிவையும் மூதாதையர் சமூகத்துடன் இணையும் கருத்தையும் பாதுகாக்கிறது.
- source_word: יָבֹא אֶל־הָאָרֶץ
  choice: நாட்டிற்குள் ... செல்லமாட்டான்
  rationale: இலக்கு நாட்டிற்குள் நுழைவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘வாக்குத்தத்த நாடு’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר נָתַתִּי
  choice: நான் கொடுத்த
  rationale: இறைவன் அளித்த கொடை உறுதியானதாகக் கூறப்படும் எபிரேய இறந்தகால வினையின் பொருளை நேரடியாகத் தருகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: சொல்லமைப்பில் உள்ள ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: מְרִיתֶם
  choice: நீங்கள் ... கலகம் செய்தீர்கள்
  rationale: מרה வினையின் அதிகாரத்தை எதிர்த்தல், கீழ்ப்படியாமை ஆகிய தீவிரமான நெறிப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת־פִּי
  choice: என் கட்டளைக்கு
  rationale: சொல்லுக்குச் சொல் ‘என் வாய்க்கு’ என்றாலும், இங்கு இறைவன் வாயால் கூறிய கட்டளையையே குறிக்கும் மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מֵי מְרִיבָה
  choice: மெரிபாவின் நீரருகே
  rationale: நிகழ்விடத்தைக் குறிக்கும் பெயரை மொழிபெயர்க்காமல் ‘மெரிபா’ எனப் பாதுகாத்து, מֵי என்பதன் நீர் சார்ந்த குறிப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தன் மக்களிடம் சேர்த்துக்கொள்ளப்படுதல்’ என்ற மரண மரபுத்தொடர்
  choice: எபிரேய மரபுத்தொடரை முதன்மை உரையில் பாதுகாத்தல்
  alternative: ‘ஆரோன் இறந்துபோவான்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: இச்சொற்றொடர் உடல் மரணத்தை மட்டும் அறிவிப்பதைக் காட்டிலும் உறவின/மூதாதையர் சமூகத்துடன் சேர்வதையும் உணர்த்துகிறது. இருப்பினும், மறுமை குறித்த விரிவான ஒரு கோட்பாட்டை மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலின மற்றும் இனக்குழு வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால், மரபுவழிப் பெயரமைப்பைத் தக்கவைக்கிறது; இச்சொற்றொடர் தேசம் முழுவதையும் குறிக்கும் என்பது சூழலால் தெளிவாகிறது.
- issue: குற்றத்தின் தன்மை
  choice: ‘என் கட்டளைக்கு எதிராகக் கலகம் செய்தீர்கள்’
  alternative: ‘என் சொல்லுக்குக் கீழ்ப்படியவில்லை’
  rationale: மூல வினை சாதாரண கீழ்ப்படியாமையைவிட வலுவான எதிர்ப்பைக் குறிக்கிறது; ‘கலகம்’ அதன் தீவிரத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நாடு’, ‘கலகம்’, ‘கட்டளை’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரேய மரண மரபுத்தொடரும் ‘இஸ்ரவேலின் மகன்கள்’ என்ற மூல வடிவமும் திட்டமிட்டுப் பாதுகாக்கப்பட்டுள்ளன.
