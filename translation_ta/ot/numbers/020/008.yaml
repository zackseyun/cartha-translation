source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: ta
  text: “கோலை[a] எடுத்துக்கொள். நீ உன் சகோதரன் ஆரோனுடன் சமூகத்தைக் கூட்டிச் சேர். அவர்கள் கண்களுக்கு முன்பாகக் கன்மலையிடம் பேசுங்கள்; அது தன் தண்ணீரைக் கொடுக்கும். நீ அவர்களுக்காகக் கன்மலையிலிருந்து தண்ணீரை வெளிவரச் செய்து, சமூகத்திற்கும் அவர்களுடைய கால்நடைகளுக்கும் குடிக்கக் கொடு.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தடியை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: கோலை
  rationale: מַטֶּה என்பது கையில் ஏந்தும் கோல் அல்லது தடி. மோசேயின் அறியப்பட்ட கோலைக் குறிக்கும் இச்சூழலில் ‘கோல்’ இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: עֵדָה இங்கு ஒன்றுகூடிய இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ என்பது மக்களைக் குறிக்கும் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: கன்மலையிடம் பேசுங்கள்
  rationale: דבר אל என்பதன் நேரடியான பொருள் ‘...இடம் பேசு.’ வினைச்சொல்லின் பன்மை மோசே, ஆரோன் இருவரையும் உள்ளடக்குவதால் பன்மை ஏவல் வடிவம் காக்கப்பட்டுள்ளது.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்களுக்கு முன்பாக
  rationale: எபிரெயச் சொல்லாட்சியின் கண் சார்ந்த உருவகத்தையும் அற்புதம் பொதுமக்களின் பார்வையில் நிகழ வேண்டும் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: וְנָתַן מֵימָיו
  choice: அது தன் தண்ணீரைக் கொடுக்கும்
  rationale: ஒருமை வினையின் எழுவாய் கன்மலை; ‘தன் தண்ணீர்’ என்பது மூலத்தின் உடைமைப் பின்னொட்டைத் தெளிவாகக் காக்கிறது.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: நீ அவர்களுக்காகக் கன்மலையிலிருந்து தண்ணீரை வெளிவரச் செய்து
  rationale: יצא என்பதன் ஹிஃபீல் வடிவம் ‘வெளிவரச் செய்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ஒருமை வடிவம் மோசேயை நோக்கி மாறுவதைத் தமிழிலும் ‘நீ’ மூலம் வெளிப்படுத்துகிறது.
- source_word: וְהִשְׁקִיתָ
  choice: குடிக்கக் கொடு
  rationale: שקה என்பதன் காரணவினைப் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּעִירָם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: בְּעִיר வீட்டு விலங்குகள் அல்லது சுமை விலங்குகளைப் பரவலாகக் குறிக்கும்; ‘கால்நடைகள்’ தெளிவான, பொதுவான நவீனத் தமிழ்ச் சொல்.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: நீயும் உன் சகோதரன் ஆரோனும்
  rationale: இரு தலைவர்களையும் வெளிப்படையாக அடையாளப்படுத்தும் மூல அமைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் காக்கிறது.
theological_decisions:
- issue: அற்புதக் கட்டளையின் பொதுவெளித் தன்மை
  choice: ‘அவர்கள் கண்களுக்கு முன்பாக’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்கள் முன்னிலையில்’ அல்லது ‘அவர்கள் முன்பாக.’
  rationale: לְעֵינֵיהֶם என்பது மக்கள் நேரில் காணும் வகையில் செயல் நடைபெற வேண்டும் என்பதை வலியுறுத்துகிறது; பின்னர் நிகழும் மோசேயின் தவறை விளக்கும் கதையோட்டத்திற்கும் இந்த விவரம் முக்கியம்.
- issue: கட்டளையில் மோசே மற்றும் ஆரோனின் கூட்டு பங்கு
  choice: ‘கன்மலையிடம் பேசுங்கள்’ எனப் பன்மை பயன்படுத்தப்பட்டது.
  alternative: மோசே ஒருவனிடம் மட்டுமே கூறப்படுவது போல ‘பேசு.’
  rationale: וְדִבַּרְתֶּם என்பது வெளிப்படையான ஆண்பால் பன்மை வடிவம்; ஆகவே மோசே, ஆரோன் இருவரையும் உள்ளடக்கும் இலக்கணத் தகவல் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘கன்மலை’ வேதாகமக் கதையாடலுக்கேற்ற உயர்ந்தாலும் தெளிவான சொல்லாகவும், ‘கால்நடைகள்’ இயல்பான பரந்த சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டன. எபிரெயத்தில் பன்மையிலிருந்து ஒருமைக்கு மாறும் கட்டளை வடிவம் தமிழிலும் காக்கப்பட்டது.
