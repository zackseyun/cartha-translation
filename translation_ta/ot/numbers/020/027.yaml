base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: ta
  text: யாவே கட்டளையிட்டபடியே மோசே செய்தார்; சபையினர் அனைவரின் கண்களுக்கு முன்பாக[a] அவர்கள் ஹோர் மலைக்கு ஏறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சபையினர் அனைவரின் கண்களுக்கு முன்பாக”; அதாவது, கூடியிருந்த மக்கள் அனைவரும் காணும்படி வெளிப்படையாக.
    reason: எபிரெய மொழிவழக்கின் பொருளைத் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: முந்தைய கட்டளைக்குக் மோசே கீழ்ப்படிந்து செயல்பட்டதை எளிய கதைநடையில் தெரிவிக்கிறது. தமிழ் மரியாதை ஒருமை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: தெய்வீகக் கட்டளைக்கும் மோசேயின் செயலுக்கும் உள்ள நேரடியான ஒத்திசைவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருமுறையெழுத்துக்களான יהוה என்பவற்றைக் ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல், இறைப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעֲלוּ
  choice: அவர்கள் … ஏறினார்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל הֹר הָהָר
  choice: ஓர் மலையில்
  rationale: הֹר என்ற இடப்பெயரை ‘ஓர்’ என ஒலிபெயர்த்து, הָהָר என்பதைக் ‘மலை’ எனத் தெளிவுபடுத்துகிறது; தமிழில் இலக்கைச் சுட்டும் ஏழாம் வேற்றுமை ஏறுதல் வினையுடன் இயல்பாக அமைகிறது.
- source_word: לְעֵינֵי כָּל הָעֵדָה
  choice: சபையார் அனைவரின் கண்களுக்கு முன்பாக
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, நிகழ்வு இஸ்ரவேல் சமூகத்தினர் அனைவரும் காணும்படி நடந்ததைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயரே உள்ளது. ஆகவே அதை மாற்றீட்டுப் பட்டமாக வழங்காமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ‘Yahweh’ உச்சரிப்புக்கு நெருக்கமான தமிழ்ச் சொல்லாக ‘யாவே’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்களுக்கு முன்பாக’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; அதன் பொதுவெளிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
