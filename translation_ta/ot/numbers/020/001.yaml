- from: முதல் மாதத்தில் இஸ்ரவேல் மக்கள்[a]—சபையார் அனைவரும்[b]—சீன் பாலைநிலத்திற்கு வந்தார்கள். மக்கள் காதேசில் தங்கினார்கள். அங்கே மிரியாம் இறந்தாள்; அங்கேயே அடக்கம் செய்யப்பட்டாள்.
  to: முதல் மாதத்தில் இஸ்ரவேல் மக்களின்[a] முழுச் சபை[b] சீன் வனாந்தரத்திற்கு வந்தது. மக்கள் காதேசில் தங்கினார்கள். அங்கே மிரியாம் இறந்தாள்; அங்கேயே அடக்கம் செய்யப்பட்டாள்.
