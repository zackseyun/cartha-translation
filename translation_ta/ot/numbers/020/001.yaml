  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: ta
  text: முதல் மாதத்தில் இஸ்ரவேல் மக்களின்[a] முழுச் சபை[b] சீன் வனாந்தரத்திற்கு வந்தது. மக்கள் காதேசில் தங்கினார்கள். அங்கே மிரியாம் இறந்தாள்; அங்கேயே அடக்கம் செய்யப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘இஸ்ரவேலின் மகன்கள்’; ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘முழுச் சமூகமும்’ அல்லது ‘முழுக் கூட்டமும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்றிருந்தாலும், இங்கு முழு இனத்தையும் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் இருக்க ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה என்பது ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ அதன் கூட்டு அடையாளத்தைத் தக்கவைக்கிறது; ‘அனைவரும்’ என்பது כָּל என்பதைக் காட்டுகிறது.
- source_word: מִדְבַּר צִן
  choice: சீன் பாலைநிலம்
  rationale: מִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கலாம். ‘பாலைநிலம்’ நவீனத் தமிழில் இயல்பாக இருந்து, இங்கு வரும் புவியியல் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது. எந்த ஆண்டு என்பது மூலத்தில் குறிப்பிடப்படாததால் சேர்க்கப்படவில்லை.
- source_word: וַיֵּשֶׁב
  choice: தங்கினார்கள்
  rationale: மக்கள் காதேசில் ஒரு காலம் தங்கியிருப்பதை இயல்பாகக் காட்டுகிறது; நிரந்தரக் குடியேற்றம் என்ற பொருளைத் தேவையின்றி உருவாக்காது.
- source_word: בְּקָדֵשׁ
  choice: காதேசில்
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டு, இருப்பிடத்தைக் குறிக்கும் ‘இல்’ வேற்றுமை சேர்க்கப்பட்டுள்ளது.
- source_word: מִרְיָם
  choice: மிரியாம்
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַתָּמָת
  choice: இறந்தாள்
  rationale: מות என்பதன் நேரடியான பொருளை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: וַתִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டாள்
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவம் தக்கவைக்கப்படுகிறது; அடக்கம் செய்தவர் யார் என்று மூலத்தில் இல்லாத தகவல் சேர்க்கப்படவில்லை.
- source_word: שָׁם ... שָׁם
  choice: அங்கே ... அங்கேயே
  rationale: மூலத்தின் மறுபடியும் கூறுதலைத் தக்கவைக்கிறது; இரண்டாவது ‘அங்கேயே’ மரணமும் அடக்கமும் ஒரே இடத்தில் நிகழ்ந்ததை இயல்பான தமிழில் வலியுறுத்துகிறது.
