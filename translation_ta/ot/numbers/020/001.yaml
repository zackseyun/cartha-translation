translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகமக் கண்ணியத்தைத் தக்கவைக்கும் வகையிலும் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் விளக்க apposition-ஐ தெளிவுபடுத்த இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; மரணம் மற்றும் அடக்கம் குறித்த ‘அங்கே ... அங்கே’ என்ற மீளுரையும் பாதுகாக்கப்பட்டுள்ளது.
