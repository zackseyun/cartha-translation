base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும் கூடியிருந்த மக்களின்[b] முன்னிலையிலிருந்து[a] சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குச் சென்று, முகங்குப்புற விழுந்தார்கள். அப்போது யாவேயின் மகிமை அவர்களுக்குத் தோன்றியது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயில் சொற்சொல்லாக, ‘சபையின் முன்பிலிருந்து’; அதாவது, கூடியிருந்த மக்களின் முன்னிலையிலிருந்து.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘சபை.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யாவேயின் மகிமை அவர்கள்முன் வெளிப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வருதல்,’ ‘செல்லுதல்,’ அல்லது ‘நுழைதல்’ எனப் பொருள்படும். சபையாரிடமிருந்து கூடாரத்தின் நுழைவாயிலை நோக்கி நகர்வதைத் தமிழில் இயல்பாகச் சொல்ல ‘சென்று’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִפְּנֵי
  choice: முன்னிலையிலிருந்து
  rationale: எபிரேயச் சொற்றொடரின் ‘முன்பிலிருந்து/சமுகத்திலிருந்து’ என்ற இடவியல் பொருளைப் பாதுகாத்து, கூடியிருந்த மக்களிடமிருந்து அவர்கள் விலகிச் சென்றதைக் காட்டுகிறது.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: கூடியிருக்கும் சமூகத்தைக் குறிக்கும் קהל என்பதற்கு, மக்களைக் கூட்டாகச் சுட்டும் இயல்பான, மரியாதையான தமிழ் சொல்.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: ஒரு கட்டமைப்புக்குள் செல்லும் வாயிலைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் கூடாரம் என்ற பெயரின் பொருளை நெருக்கமாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: முகங்குப்புற விழுந்தார்கள்
  rationale: ‘தங்கள் முகங்களின்மேல் விழுந்தார்கள்’ என்ற எபிரேய உருவகத்தை இயல்பான தமிழில் தாழ்மையும் வேண்டுதலும் வெளிப்படும் உடல்நிலையாகக் காட்டுகிறது.
- source_word: וַיֵּרָא
  choice: தோன்றியது
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு கண்கூடான வெளிப்பாட்டைக் குறிக்கிறது; ‘தோன்றியது’ அதனைத் தெளிவாக வழங்குகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כבוד குறிக்கும் தெய்வீக மகிமையின் வெளிப்பாட்டையும், יהוה என்ற தனிப்பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய வேதத்தில் வரும் יהוה என்ற உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲלֵיהֶם
  choice: அவர்களுக்குத்
  rationale: אל என்பதன் திசை அல்லது தொடர்புப் பொருளை, ‘அவர்களுக்குத் தோன்றியது’ என்ற இயல்பான தமிழ் தொடரால் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் יהוה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: யாவேயின் மகிமை தோன்றிய விதம்
  choice: யாவேயின் மகிமை அவர்களுக்குத் தோன்றியது
  alternative: யாவேயின் மகிமை அவர்கள்முன் வெளிப்பட்டது
  rationale: மூலத்தின் וַיֵּרָא אֲלֵיהֶם என்பதை நெருக்கமாகப் பின்பற்றி, வெளிப்பாட்டின் தன்மை குறித்து தேவையற்ற விளக்கத்தைச் சேர்க்காமல் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘சந்திப்புக் கூடாரம்,’ ‘முகங்குப்புற,’ ‘யாவே’ ஆகியவை மூலத்தின் குறிப்பான கருத்துகளைக் காக்கின்றன; எபிரேய இடவியல் மரபுத்தொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
