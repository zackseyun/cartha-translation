  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: ta
  text: “தயவுசெய்து, உமது நாட்டின் வழியாக நாங்கள் கடந்துசெல்ல அனுமதியுங்கள். வயலிலோ திராட்சைத்தோட்டத்திலோ நாங்கள் செல்லமாட்டோம்; கிணற்று நீரையும் குடிக்கமாட்டோம். அரசரின் சாலையில்[a] செல்வோம். உமது எல்லையைக் கடந்துசெல்லும்வரை[b] வலது அல்லது இடது பக்கம் விலகமாட்டோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அரசரின் வழி”; இது “அரசரின் பெருவழி” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “உமது எல்லை”; இங்கு உமது ஆட்சிப்பகுதியின் மறுபுறம் சென்றடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: நாங்கள் கடந்துசெல்லத் தயவுசெய்து அனுமதியும்
  rationale: The cohortative plus נָא conveys a courteous request; this wording preserves both the requested permission and polite tone in dignified modern Tamil.
- source_word: בְאַרְצֶךָ
  choice: உமது நாட்டின் வழியாக
  rationale: With עבר, ב marks movement through a territory. “நாட்டின் வழியாக” naturally conveys passage through the addressee’s land.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: வயலிலோ திராட்சைத்தோட்டத்திலோ நாங்கள் செல்லமாட்டோம்
  rationale: The Hebrew singular nouns function generically, and the Tamil alternative pair with -ஓ clearly promises not to enter either kind of cultivated land.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: கிணற்று நீரையும் குடிக்கமாட்டோம்
  rationale: This concise Tamil expression directly represents “water of/from a well” and retains the negative promise.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: அரசரின் சாலை
  rationale: This closely reflects the Hebrew “way/road of the king” while sounding natural in modern Tamil; the possible sense of a major royal route is retained in a footnote.
- source_word: נֵלֵךְ
  choice: செல்வோம்
  rationale: הלך here denotes travel along the named route; “செல்வோம்” is direct and idiomatic.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: வலப்பக்கமோ இடப்பக்கமோ விலகமாட்டோம்
  rationale: “விலகமாட்டோம்” preserves the idiomatic sense of not deviating from the route, while retaining both directional terms.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: உமது எல்லையைக் கடந்துசெல்லும்வரை
  rationale: The rendering keeps גְּבוּל as “எல்லை” and preserves the repeated עבר motif with “கடந்துசெல்ல,” while the footnote explains the contextual territorial sense.
