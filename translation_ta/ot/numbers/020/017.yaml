  register: மரியாதைக்குரிய ஒருமை முன்னிலையைச் சுட்ட “உமது” பயன்படுத்தப்பட்டுள்ளது. மொழிநடை நவீனமாகவும் எளிதில் புரியத்தக்கதாகவும் இருக்கிறது; அதேவேளையில் அரசரிடம் விடுக்கப்படும் வேண்டுகோளுக்கேற்ற கண்ணியமான தொனி காக்கப்பட்டுள்ளது.
