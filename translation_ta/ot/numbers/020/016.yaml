source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: ta
  text: நாங்கள் யாவேவை நோக்கிக் கூக்குரலிட்டோம்; அவர் எங்கள் குரலைக் கேட்டு, ஒரு தூதரை[a] அனுப்பி, எங்களை எகிப்திலிருந்து வெளியே கொண்டுவந்தார். இதோ, நாங்கள் உமது எல்லையின் ஓரத்தில் உள்ள காதேசு நகரத்தில் இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்’ என்பதற்கான எபிரெயச் சொல் மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்கலாம்; இச்சூழலில் பலர் இதை தேவனால் அனுப்பப்பட்ட விண்ணுலகத் தூதர் என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: கூக்குரலிட்டோம்
  rationale: צעק என்பது உதவியை நாடும் அவசரமான உரத்த அழுகுரலைக் குறிக்கிறது; ‘கூக்குரலிட்டோம்’ அதன் தீவிரத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: அவர் எங்கள் குரலைக் கேட்டு
  rationale: எபிரெய உரையின் ‘எங்கள் குரலைக் கேட்டார்’ என்ற உருவகத்தையும் வேண்டுகோளுக்குச் செவிசாய்த்த பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מַלְאָךְ
  choice: ஒரு தூதரை
  rationale: מַלְאָךְ என்பது மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்கலாம். தமிழ் ‘தூதர்’ அந்தச் சொல் கொண்டுள்ள உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: எங்களை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் காரணவினை வடிவம் இங்கு ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படுகிறது; வெளியேற்ற நிகழ்வைத் தெளிவாகச் சொல்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ, இப்போது
  rationale: הִנֵּה தற்போதைய நிலையைச் சுட்டிக் கவனத்தை ஈர்க்கிறது; ‘இதோ, இப்போது’ அந்த உரையாடல் செயல்பாட்டை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: உமது எல்லையின் ஓரத்தில் உள்ள ... நகரம்
  rationale: காதேசு ஏதோமின் எல்லை முனையில் அமைந்த நகரம் என்ற இடவியல் பொருளைத் தெளிவாகத் தருகிறது; எபிரெய ஒருமை இரண்டாம் நபர் வடிவத்தையும் ‘உமது’ பாதுகாக்கிறது.
theological_decisions:
- issue: யாத்திராகமச் சம்பவத்தில் מַלְאָךְ என்பவரின் அடையாளம்
  choice: ‘ஒரு தூதர்’ என்று மொழிபெயர்த்து, அவர் மனிதத் தூதரா விண்ணுலகத் தூதரா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘ஒரு தேவதூதர்’ என்று குறிப்பாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் அந்தத் தூதரின் இயல்பையோ துல்லியமான அடையாளத்தையோ விளக்கவில்லை. ‘தூதர்’ என்பது மூலச்சொல்லின் பரந்த பொருளையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சிலுள்ள ஒருமை மரியாதையை ‘உமது’ காக்கிறது; ‘இதோ, இப்போது’ என்பது கவன ஈர்ப்புச் சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
