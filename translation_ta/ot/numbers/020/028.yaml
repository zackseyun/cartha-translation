revisions:
- from: மோசே ஆரோனின் ஆடைகளைக் கழற்றி, அவற்றை அவனுடைய மகன் எலெயாசருக்கு அணிவித்தார்[a]. மலையின் உச்சியில் ஆரோன் அங்கே இறந்தார்[b]. பின்பு மோசேயும் எலெயாசரும் மலையிலிருந்து இறங்கி வந்தார்கள்.
  to: மோசே ஆரோனின் ஆடைகளைக் கழற்றி, அவற்றை ஆரோனின் மகன் எலெயாசருக்கு அணிவித்தார்[a]. ஆரோன் அங்கே, மலையின் உச்சியில், இறந்தார்[b]. பின்னர் மோசேயும் எலெயாசரும் மலையிலிருந்து இறங்கி வந்தார்கள்.
