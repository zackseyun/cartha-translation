base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: ta
  text: மோசே ஆரோனின் ஆடைகளைக் கழற்றி, அவற்றை ஆரோனின் மகன் எலெயாசருக்கு அணிவித்தார்[a]. ஆரோன் அங்கே, மலையின் உச்சியில், இறந்தார்[b]. பின்னர் மோசேயும் எலெயாசரும் மலையிலிருந்து இறங்கி வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சுற்றியுள்ள நிகழ்வின்படி ஆரோனின் அதிகாரப்பூர்வ ஆசாரிய ஆடைகள், அவருக்குப் பின்வந்த எலெயாசருக்கு மாற்றிக் கொடுக்கப்பட்டன.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘மலையின் சிகரத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: ஆடைகளைக் கழற்றி
  rationale: פשט என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரிடமிருந்து ஆடைகளை அகற்றுவதைக் குறிக்கிறது. ‘கழற்றி’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּגָדָיו
  choice: ஆரோனின் ஆடைகள்
  rationale: בגד என்பது பொதுவாக ஆடை அல்லது உடையைக் குறிக்கும். சூழலில் இவை ஆசாரியப் பணிக்குரிய ஆடைகள் என்றாலும், மூலச் சொல் அதை வெளிப்படையாகக் குறிப்பிடாததால் ‘ஆடைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: அவற்றை அவனுடைய மகன் எலெயாசருக்கு அணிவித்தார்
  rationale: לבש என்பதன் ஹிஃபில் வடிவம் ஒருவருக்கு ஆடை அணிவிப்பதைக் குறிக்கிறது. அகற்றப்பட்ட அதே ஆடைகள் எலெயாசருக்கு அணிவிக்கப்பட்டன என்பது இவ்வடிவில் தெளிவாகிறது.
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பது ‘இறத்தல்’ என்னும் நேரடியான பொருளுடைய சாதாரண வினைச்சொல்; மறைமுகமான மங்கல வழக்கு தவிர்க்கப்பட்டது.
- source_word: שָׁם
  choice: அங்கே
  rationale: ஆரோன் இறந்த இடத்தைச் சுட்டும் இடவினையடை மூலத்தில் வெளிப்படையாக இருப்பதால் தமிழிலும் தக்கவைக்கப்பட்டது.
- source_word: בְּרֹאשׁ הָהָר
  choice: மலையின் உச்சியில்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு இடவியல் வழக்கில் மலையின் மேற்பகுதி அல்லது உச்சியைக் குறிக்கிறது.
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்தார்கள்
  rationale: ירד என்பது கீழே செல்வதையோ வருவதையோ குறிக்கிறது. மலைமேலிருந்து திரும்பும் நிகழ்வை நவீனத் தமிழில் இயல்பாகச் சொல்ல ‘இறங்கி வந்தார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: מִן הָהָר
  choice: மலையிலிருந்து
  rationale: מן என்னும் முன்னிடைச்சொல் புறப்படும் இடத்தைக் குறிக்கிறது; ‘மலையிலிருந்து’ என்பது நேரடியான தமிழ் இணை.
theological_decisions:
- issue: ஆரோனிடமிருந்து எலெயாசருக்கு மாற்றப்பட்ட ஆடைகளின் தன்மை
  choice: முதன்மை உரையில் ‘ஆடைகள்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆசாரிய ஆடைகள்’ அல்லது ‘தலைமை ஆசாரிய ஆடைகள்’
  rationale: சுற்றியுள்ள சூழல் அவை ஆரோனின் அதிகாரப்பூர்வ ஆசாரிய ஆடைகள் என்பதைத் தெளிவுபடுத்துகிறது. எனினும் இந்த வசனத்தின் எபிரெயச் சொல் பொதுவான ‘ஆடைகள்’ என்பதே; ஆகவே விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் சொல் எல்லையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. மரியாதைப் பன்மை வினைமுற்றுகள் மனிதப் பெயர்களுடன் இயல்பான தமிழ் வேதாகம நடையைப் பேணுகின்றன. மூலத்தில் உள்ள வினைத் தொடர் குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் நிகழ்வுகளின் வரிசையும் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
