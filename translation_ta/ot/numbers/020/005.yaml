id: NUM.20.5
reference: Numbers 20:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: ta
  text: எங்களை இந்த மோசமான இடத்திற்குக்[b] கொண்டுவருவதற்காக எகிப்திலிருந்து ஏன் மேலே கொண்டுவந்தீர்கள்? இது பயிர் விளையும் இடம்[a] அல்ல; இங்கே அத்திப்பழங்களோ, திராட்சைக்கொடிகளோ[c], மாதுளம்பழங்களோ இல்லை; குடிப்பதற்குத் தண்ணீரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லடியாக, “விதையின் இடம்.” இது விதைப்பதற்கு ஏற்ற இடத்தையோ பயிர் விளையும் இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இந்தக் கேடான இடம்” என்றும் மொழிபெயர்க்கலாம். இங்கு “மோசமான” என்பது அறநெறிப்படி தீயது என்பதை அவசியம் குறிக்காமல், தீங்கான அல்லது விரும்பத்தகாத இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “அத்தி மரங்களோ, திராட்சைக்கொடிகளோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: ஏன்
  rationale: தொடர்ந்து எழும் முறையீட்டைத் தமிழில் இயல்பான வினாவாகக் கொடுக்கிறது; வாக்கிய ஓட்டமே எபிரெய இணைப்பின் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: எகிப்திலிருந்து ... மேலே கொண்டுவந்தீர்கள்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற வெளியேற்றப் பயணச் சொல்லாட்சியைப் பாதுகாக்கிறது; இரண்டாம் நபர் பன்மையும் வினையுருவில் வெளிப்படுகிறது.
- source_word: לְהָבִיא אֹתָנוּ
  choice: எங்களைக் ... கொண்டுவருவதற்காக
  rationale: நோக்கத்தைச் சுட்டும் எபிரெய முடிவிலி வினையின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: இந்த மோசமான இடத்திற்கு
  rationale: רַע இங்கு அறநெறித் தீமையைக் காட்டுவதைவிட தீங்கான, விரும்பத்தகாத இடத்தைக் குறிக்கிறது; ‘மோசமான’ என்பது அந்தச் சூழல் சார்ந்த குற்றச்சாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא מְקוֹם זֶרַע
  choice: இது பயிர் விளையும் இடம் அல்ல
  rationale: சொல்லடியாக ‘விதையின் இடம்’ என்றாலும், பட்டியலின் வேளாண்மைச் சூழலில் விதைக்க அல்லது பயிர் விளைவிக்க ஏற்ற நிலம் என்பதே கருத்து; தமிழில் பொருள் தெளிவாகும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: அத்திப்பழங்களோ, திராட்சைக்கொடிகளோ, மாதுளம்பழங்களோ
  rationale: அங்கு இல்லாத விரும்பத்தக்க விளைபொருட்களையும் தாவரங்களையும் பட்டியலிடும் மூலத்தைப் பின்பற்றுகிறது; גפן என்பதற்கு துல்லியமாக ‘திராட்சைக்கொடி’ பயன்படுத்தப்பட்டது.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: குடிப்பதற்குத் தண்ணீரும் இல்லை
  rationale: குடிக்கத் தண்ணீர் இல்லாமையை இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; ‘-உம்’ முந்தைய இல்லாமைப் பட்டியலோடு இதை இணைக்கிறது.
theological_decisions:
- issue: רַע என்ற சொல்லின் தன்மை
  choice: மோசமான
  alternative: தீய / கேடான
  rationale: இந்த இடத்தின் அறநெறித் தீமையைத் தீர்மானிக்காமல், மக்களுக்குத் தீங்கான அல்லது விரும்பத்தகாத தன்மையைச் சுட்டுகிறது; மூலத்தின் கடுமையான குற்றச்சாட்டும் தொடர்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான முறையீட்டு நடையில் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் நோக்கக் கட்டமைப்பும், எகிப்திலிருந்து ‘மேலே கொண்டுவருதல்’ என்ற சொல்லாட்சியும், வேளாண் விளைபொருட்களின் பட்டியலும் பாதுகாக்கப்பட்டுள்ளன.
