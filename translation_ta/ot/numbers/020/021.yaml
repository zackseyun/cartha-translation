  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: ta
  text: ஆனால் ஏதோம், இஸ்ரவேல் ஏதோமின் நாட்டுப்பகுதி வழியாகக் கடந்து செல்ல அனுமதிக்க மறுத்தான்; ஆகவே இஸ்ரவேல் அவனை விட்டு விலகிச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: மறுத்தான்
  rationale: מָאֵן என்பது மறுப்பு அல்லது விருப்பமின்மையைக் குறிக்கிறது; இக்கதைச் சூழலில் ‘மறுத்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: நாட்டின் பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்பட்டுள்ளது.
- source_word: נְתֹן
  choice: அனுமதிக்க
  rationale: מָאֵן உடன் வரும் נתן இங்கு அனுமதி வழங்குதல் என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டுள்ளது.
- source_word: עֲבֹר
  choice: கடந்து செல்ல
  rationale: எல்லை அல்லது நாட்டுப் பகுதி வழியாகப் பயணிப்பதை עבר இங்கு குறிக்கிறது.
- source_word: בִּגְבֻלוֹ
  choice: தன் எல்லைக்குள்
  rationale: גְּבוּל என்பது எல்லை அல்லது எல்லைக்குட்பட்ட நிலப்பரப்பைக் குறிக்கலாம். ‘எல்லைக்குள்’ என்பது எபிரெய வடிவத்தை நெருக்கமாகப் பேணுவதுடன் ஏதோமின் ஆட்சிப்பகுதியையும் இயல்பாக உணர்த்துகிறது.
- source_word: וַיֵּט
  choice: விலகிச் சென்றான்
  rationale: נטה இங்கு பாதையை மாற்றி ஒருவரிடமிருந்து விலகிச் செல்வதைக் குறிக்கிறது.
- source_word: מֵעָלָיו
  choice: அவனைவிட்டு
  rationale: இந்தச் சூழலில் இத்தொடர் ஏதோமிடமிருந்து விலகிச் சென்ற இயக்கத்தைச் சுட்டுகிறது.
theological_decisions: []
