  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெயத்தில் நாடுகளைக் குறிக்கும் ஒருமை ஆண்பால் வடிவம் இருப்பதால் ‘ஏதோம்… மறுத்தான்’ என்றும் ‘இஸ்ரவேல்… சென்றான்’ என்றும் ஒருமை வடிவங்கள் பேணப்பட்டுள்ளன.
