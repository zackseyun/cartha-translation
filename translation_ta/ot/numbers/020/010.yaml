base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும் மக்கள் கூட்டத்தைப் பாறைக்கு முன்பாகக் கூட்டினார்கள். அவர் அவர்களிடம், “கலகக்காரர்களே, இப்போது கேளுங்கள்! இந்தப் பாறையிலிருந்து நாங்கள் உங்களுக்குத் தண்ணீரை வெளியே கொண்டுவருவோமா?”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பாறையிலிருந்து நாங்கள் உங்களுக்குத் தண்ணீரை வெளியே வரச் செய்வோமா?”
    reason: נוֹצִיא என்ற காரணவினையை ‘வெளியே கொண்டுவருதல்’ என்றும் ‘வெளியே வரச் செய்தல்’ என்றும் பொருளுக்கு நெருக்கமாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: கூட்டினார்கள்
  rationale: קהל என்பதன் ஹிஃபில் வடிவம் ‘கூடிவரச் செய்தல்/கூட்டுதல்’ என்று பொருள்படும். ‘கூட்டினார்கள்’ என்பது அதன் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: கூடியிருந்த சமூகத்தைக் குறிக்கும் קָהָל என்பதற்கு ‘சபையார்’ என்பது சூழலுக்கு ஏற்ற, கண்ணியமான கூட்டுப்பெயர்; இது வெறும் ஒழுங்கற்ற ‘கூட்டம்’ என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: பாறைக்கு முன்பாக
  rationale: இடத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘பாறையின் முன்/எதிரில்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר
  choice: அவர் ... என்றார்
  rationale: எபிரெய வினை ஒருமையில் உள்ளது. கூட்டெழுவாய்க்குப் பின் வரும் இந்த ஒருமையைத் தமிழிலும் பாதுகாத்து, பெயரை உரையில் இல்லாதவாறு மீண்டும் சேர்க்காமல் விடுகிறது.
- source_word: שִׁמְעוּ נָא
  choice: இப்போது கேளுங்கள்
  rationale: கட்டளை வடிவத்தின் வலியுறுத்தலையும் נָא தரும் உடனடித் தீவிரத்தையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: הַמֹּרִים
  choice: கலகக்காரர்களே
  rationale: מרה வேர்ச்சொல் கீழ்ப்படியாமையோடு கூடிய எதிர்ப்பையும் கலகத்தையும் குறிக்கிறது. நேரடியான கண்டனத் தொனியை இந்தச் சொல் காக்கிறது.
- source_word: הֲמִן־הַסֶּלַע הַזֶּה
  choice: இந்தப் பாறையிலிருந்து
  rationale: கேள்வித்துகளோடு வரும் מִן மூலத்தைச் சுட்டுவதால், ‘இந்தப் பாறையிலிருந்து’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נוֹצִיא
  choice: நாங்கள் ... வெளியே கொண்டுவருவோமா
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும். முதல் நபர் பன்மையையும் கேள்வித் தொனியையும் இது பாதுகாக்கிறது.
- source_word: מָיִם
  choice: தண்ணீர்
  rationale: מַיִם என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: மோசேயின் கேள்வியிலுள்ள முதல் நபர் பன்மை
  choice: நாங்கள் உங்களுக்குத் தண்ணீரை வெளியே கொண்டுவருவோமா?
  alternative: உங்களுக்காகத் தண்ணீர் வெளியே வரும்படி செய்வோமா?
  rationale: נוֹצִיא என்பது வெளிப்படையாக முதல் நபர் பன்மையில் உள்ளது. தண்ணீரை அளிப்பதில் மோசே, ஆரோன் ஆகியோரின் பங்குக்கும் கடவுளின் செயலுக்கும் இடையே உரையில் இருக்கும் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் ‘நாங்கள்’ என அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமும் மோசேயின் கடுமையான கண்டனத் தொனியும் காக்கப்பட்டுள்ளன. ‘அவர்’ என்ற மரியாதை ஒருமை, எபிரெய உரையின் ஒருமை வினையைப் பாதுகாக்கிறது; ‘நாங்கள்’ என்பது மூலத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் அப்படியே நிறுத்துகிறது.
