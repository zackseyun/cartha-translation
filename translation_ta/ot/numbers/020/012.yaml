revisions:
- from: 'யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்: “நீங்கள் என்னை நம்பி[a], இஸ்ரவேலின் மகன்களின்[c] கண்முன் என்னைப் பரிசுத்தராக நிலைநிறுத்தவில்லை[b]. ஆகவே, நான் அவர்களுக்குக் கொடுத்திருக்கும் தேசத்திற்குள் இந்தக் கூட்டத்தினரை நீங்கள் கொண்டுபோக மாட்டீர்கள்.”'
  to: 'யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்: “நீங்கள் என்னை நம்பாமலும், இஸ்ரவேலின் மகன்களின் கண்முன் என்னைப் பரிசுத்தராக நிலைநிறுத்தாமலும் இருந்ததால்[a][b][c], நான் அவர்களுக்குக் கொடுத்திருக்கும் நிலத்திற்குள் இந்தக் கூட்டத்தை நீங்கள் கொண்டுபோக மாட்டீர்கள்.”'
  rationale: வசனத்தின் இரு எதிர்மறை காரணக் கூறுகளையும் தமிழில் தெளிவாக இணைக்க “நம்பாமலும் … நிலைநிறுத்தாமலும் இருந்ததால்” எனத் திருத்தப்பட்டது. வாக்குத்தத்தமாக அளிக்கப்பட்ட הָאָרֶץ என்பதன் பொருளுக்காக “தேசம்” “நிலம்” என மாற்றப்பட்டது; கָהָלக்கு இயல்பான கூட்டுப்பெயரான “இந்தக் கூட்டம்” பயன்படுத்தப்பட்டது. அடிக்குறிப்பு அடையாளங்கள் உரை வரிசையில் மறுசீரமைக்கப்பட்டன.
