source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: ta
  text: 'யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்: “நீங்கள் என்னை நம்பாமலும், இஸ்ரவேலின் மகன்களின் கண்முன் என்னைப் பரிசுத்தராக நிலைநிறுத்தாமலும் இருந்ததால்[a][b][c], நான் அவர்களுக்குக் கொடுத்திருக்கும் நிலத்திற்குள் இந்தக் கூட்டத்தை நீங்கள் கொண்டுபோக மாட்டீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்மீது நம்பிக்கை வைக்காமலும்.” எபிரெய வினை நம்புதல் அல்லது நம்பிக்கை வைத்தல் என்ற நெருங்கிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைப் பரிசுத்தராகக் காட்டாமலும்” அல்லது “என் பரிசுத்தத்தை வெளிப்படுத்தாமலும்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இயல்பான தமிழில், “இஸ்ரவேலர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: என்னை நம்பி … இல்லை
  rationale: אמן வினையின் நம்புதல்/நம்பிக்கை வைத்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; நோக்கத்தைக் குறிக்கும் தொடருடன் எபிரெய வாக்கியத்தின் தொடர்பையும் காக்கிறது.
- source_word: לְהַקְדִּישֵׁנִי
  choice: என்னைப் பரிசுத்தராக நிலைநிறுத்த
  rationale: தேவனைப் பரிசுத்தராக மக்கள் முன் அங்கீகரித்து வெளிப்படுத்தும் causative பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְעֵינֵי
  choice: கண்முன்
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் பொதுவான, இயல்பான தமிழ் வடிவம்; செயல் பகிரங்கமானது என்பதையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொல்லமைப்பின் ஆண்பால் வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַקָּהָל
  choice: இந்தக் கூட்டத்தினர்
  rationale: வனாந்தரத்தில் ஒன்றுகூடிய மக்களைக் குறிக்கிறது; திருச்சபை சார்ந்த குறிப்பிட்ட பொருளைத் தேவையின்றி ஏற்றும் ‘சபை’ என்பதைத் தவிர்க்கிறது.
- source_word: הָאָרֶץ
  choice: தேசம்
  rationale: வாக்குத்தத்தம் செய்யப்பட்ட நிலப்பரப்பைக் குறிக்கும் மரியாதையான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: நான் அவர்களுக்குக் கொடுத்திருக்கும்
  rationale: எபிரெய நிறைவுவினையின் ஏற்கெனவே உறுதிசெய்யப்பட்ட கொடை என்ற வலிமையைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: மோசே மற்றும் ஆரோனின் தவறின் இயல்பு
  choice: தேவனை நம்பாததையும், இஸ்ரவேலர் முன் அவரைப் பரிசுத்தராக நிலைநிறுத்தாததையும் உரை கூறும் தொடர்பிலேயே வைத்தல்
  alternative: அவர்கள் தேவனை அவமதித்தார்கள் அல்லது குறிப்பிட்ட கட்டளைக்குக் கீழ்ப்படியவில்லை என்று விளக்கிச் சொல்லுதல்
  rationale: அவர்களின் செயல் எவ்வாறு நம்பிக்கையின்மையாகவும் தேவனின் பரிசுத்தத்தை நிலைநிறுத்தாததாகவும் அமைந்தது என்பதை வசனம் விரிவாக விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் நெருக்கடியைத் தீர்மானித்து விடவில்லை.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் இலக்கண ஆண்பால் இனப்பெயர் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; இயல்பான தமிழ் இனப்பெயர் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘கண்முன்’, ‘தேசம்’, ‘கூட்டத்தினர்’ ஆகியவை பொதுவாசகருக்குப் புரியும் சொற்களாகவும், மூலத்தின் பகிரங்க, உடன்படிக்கை மற்றும் ஒன்றுகூடிய மக்கள் சார்ந்த நுணுக்கங்களைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன.
