  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: ta
  text: ஓர் என்னும் மலையிலிருந்து லெபோ-ஆமாத் வரை எல்லையை வரையுங்கள்; எல்லையின் இறுதிப் புள்ளிகள் செதாதில் அமையும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: ஓர் மலையிலிருந்து
  rationale: இது இயல்பான எபிரெய இடப்பெயர் அமைப்பு; מִן முன்னொட்டு தொடக்க இடத்தைக் குறிக்கிறது. தமிழில் நிலவியல் பெயராக ‘ஓர் மலை’ என வழங்கப்பட்டுள்ளது.
- source_word: תְּתָאוּ
  choice: எல்லையைக் குறித்துச் செல்லுங்கள்
  rationale: எல்லை விவரிப்பில் இந்த வினை எல்லைக்கோட்டை வரையறுத்து நீட்டிப்பதைக் குறிக்கிறது; நவீன தமிழில் செயற்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֹא חֲמָת
  choice: லெபோ-ஆமாத்துக்கு
  rationale: சொல்லுக்கு சொல் ‘ஆமாத்தின் நுழைவிடம்’ என்றாலும், இத்தொடர் நிலையான நிலவியல் பெயராகச் செயல்பட வாய்ப்புள்ளது; அந்த ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהָיוּ
  choice: இருக்கும்
  rationale: சட்டரீதியான எல்லை விவரிப்பின் தொடரில் எதிர்கால/விதிப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: תּוֹצְאֹת
  choice: முடிவிடம்
  rationale: நில எல்லைச் சூழலில் எல்லை சென்று முடியும் முனை அல்லது எல்லைப்புள்ளியை இச்சொல் குறிக்கிறது.
- source_word: הַגְּבֻל
  choice: எல்லை
  rationale: பிரதேச வரம்பைக் குறிக்கும் பொதுவான, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: צְדָדָה
  choice: செதாதில்
  rationale: திசை/இலக்கு குறிக்கும் -ה வடிவம் இங்கு எல்லை முடியும் இடத்தைக் காட்டுகிறது; தமிழில் இடவெற்றுமை இயல்பாக உள்ளது.
