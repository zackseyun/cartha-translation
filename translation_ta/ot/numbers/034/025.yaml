  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: ta
  text: மேலும், செபுலோன் மக்களின் கோத்திரத்துக்குத் தலைவன் பர்னாகின் மகன் எலிசாப்பான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: இந்த நிலப்பங்கீட்டு நிர்வாகச் சூழலில் מַטֶּה என்பது ‘கோல்’ அல்ல, ‘கோத்திரம்’ என்பதைக் குறிக்கிறது. வாவ் இங்கு பட்டியலின் தொடர்ச்சியைக் காட்டினாலும், தனி வசனமாக இயல்பான தமிழில் வெளிப்படையான ‘மேலும்’ இன்றியும் தொடர்ச்சி புரிகிறது.
- source_word: בְנֵי זְבוּלֻן
  choice: செபுலோனின் மக்கள்
  rationale: בְנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’ என்றாலும், இங்கு முழுக் கோத்திர மக்களையும் குறிக்கும் மரபுவழிக் கூட்டுப்பெயர். நவீன தமிழில் ‘மக்கள்’ என்பது பொருளை இயல்பாகவும் உள்ளடக்கமாகவும் தெரிவிக்கிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: נָשִׂיא இங்கு அங்கீகரிக்கப்பட்ட கோத்திரத் தலைவரைக் குறிக்கிறது; ‘இளவரசன்’ எனும் அரச மரபுப் பொருளைத் தவிர்த்து நிர்வாகச் சூழலுக்கேற்ற ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֱלִיצָפָן
  choice: எலிசாப்பான்
  rationale: எபிரெய ஒலிவடிவத்தைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் தனிப்பெயர் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן פַּרְנָךְ
  choice: பர்னாக்கின் மகன்
  rationale: בֶּן என்பது வழக்கமான வம்சவழிக் குறியீடான ‘மகன்’; பெயருடன் இயல்பான தமிழ் உடைமைத் தொடராக வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வடிவத்தின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. எபிரெய வசனத்தின் பெயர்ச்சொல் மையமான அமைப்பு ‘தலைவன்:’ என்ற வடிவில் பாதுகாக்கப்பட்டது.
