translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான புவியியல் எல்லை விவரணையாக வடிவமைக்கப்பட்டது. ‘ஆறு’ என்பதற்குப் பதில் ‘ஓடை’ பயன்படுத்தி נחל என்பதன் நிலவியல் தன்மை பாதுகாக்கப்பட்டது; ‘மத்தியதரைக் கடல்’ என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் ‘கடல்’ என்பதே வைக்கப்பட்டது.
