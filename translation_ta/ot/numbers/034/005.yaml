- from: பின்பு எல்லை அஸ்மோனிலிருந்து எகிப்தின் ஓடை[a] நோக்கித் திரும்பி, அதன் முடிவு[b] கடலில் இருக்கும்.
  to: பின்பு, எல்லை அஸ்மோனிலிருந்து எகிப்தின் ஓடையை நோக்கித் திரும்பும்; அதன் முடிவு கடலில் இருக்கும்.
