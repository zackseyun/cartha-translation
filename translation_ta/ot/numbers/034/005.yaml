source:
  edition: WLC
  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: ta
  text: பின்பு, எல்லை அஸ்மோனிலிருந்து எகிப்தின் ஓடையை நோக்கித் திரும்பும்; அதன் முடிவு கடலில் இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַב
  choice: பின்பு ... திரும்பி
  rationale: எல்லைக் கோடு திசைமாறுவதை נסב குறிக்கிறது. தொடர்ச்சியை இயல்பான தமிழில் காட்ட ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: நிலப்பரப்பை வரையறுக்கும் எல்லைக் கோட்டை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: מֵעַצְמוֹן
  choice: அஸ்மோனிலிருந்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; מִן முன்னொட்டின் பொருள் ‘இலிருந்து’ எனக் காட்டப்பட்டுள்ளது.
- source_word: נַחְלָה מִצְרָיִם
  choice: எகிப்தின் ஓடை நோக்கி
  rationale: נחל என்பது பெரும்பாலும் பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கும்; பெரிய நிரந்தர ஆறு என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘ஓடை’ தேர்ந்தெடுக்கப்பட்டுள்ளது. திசை/இலக்கைக் குறிக்கும் ה உள்ளதால் ‘நோக்கி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָיוּ
  choice: இருக்கும்
  rationale: எல்லையின் இறுதிப்புள்ளியை அறிவிக்கும் எதிர்நோக்கிய உரைநடையை இயல்பான தமிழில் தருகிறது.
- source_word: תּוֹצְאֹתָיו
  choice: அதன் முடிவு
  rationale: எபிரெயச் சொல் இலக்கண வடிவில் பன்மையாக இருந்தாலும், இச்சூழலில் எல்லையின் இறுதிப்புள்ளியைக் குறிக்கிறது; தமிழில் ஒருமை இயல்பானது. மூலத்தின் பன்மை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיָּמָּה
  choice: கடலில்
  rationale: சொல்லுருவில் ‘கடலை நோக்கி/கடல்புறமாக’ என்ற திசை உணர்வு இருந்தாலும், இங்கு எல்லையின் முடிவிடம் கடல் என்பதால் ‘கடலில்’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தில் குறிப்பிட்ட கடலின் பெயர் தரப்படவில்லை.
