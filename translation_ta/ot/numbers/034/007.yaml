id: NUM.34.7
reference: Numbers 34:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: ta
  text: 'உங்கள் வடக்கு எல்லை இதுவே: பெரிய கடலிலிருந்து[a] ஹோர் மலைவரை உங்களுக்காக எல்லைக் கோட்டை வரையுங்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெரிய கடல்” என்பது மத்தியதரைக் கடலைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “ஹோர் மலைவரை எல்லையை வரையுங்கள்.” இங்குள்ள எபிரெய வினை, இந்தப் புவியியல் சூழலில் எல்லைக்கோட்டை வரைவதையோ குறித்தமைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: உங்கள் ... இதுவே
  rationale: சட்டரீதியான எல்லை விவரிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; לָכֶם என்பதன் உடைமைப் பொருள் ‘உங்கள்’ என்பதில் வெளிப்படுகிறது.
- source_word: גְּבוּל צָפוֹן
  choice: வடக்கு எல்லை
  rationale: எபிரெயச் சேர்க்கையின் புவியியல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: பெரிய கடலிலிருந்து
  rationale: மூலத்தின் ‘பெரிய கடல்’ என்ற புவியியல் பெயரை முதன்மை உரையில் பாதுகாக்கிறது; அதன் நவீன அடையாளம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: תְּתָאוּ לָ/כֶם
  choice: உங்களுக்காக எல்லைக்கோட்டை வரைய வேண்டும்
  rationale: இவ்வெல்லைச் சூழலில் வினை எல்லைக்கோட்டை வரைவது அல்லது குறித்தமைப்பதைக் குறிக்கிறது; לָכֶם என்பதும் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: הֹר הָ/הָר
  choice: ஓர் மலை
  rationale: இது இடப்பெயர் என்பதால், வழக்கிலுள்ள தமிழ் ஒலிபெயர்ப்பாக ‘ஓர் மலை’ என்று தரப்படுகிறது; ‘மலை’ என்பது பெயரின் ஓர் பகுதி.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டரீதியான புவியியல் விளக்கத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் உள்ள எல்லை வரையும் வினையின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘பெரிய கடல்’ என்ற மூலப் பெயர் மாற்றப்படவில்லை.
