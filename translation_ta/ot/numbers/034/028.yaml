lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்காக
  rationale: இந்த நிலப் பங்கீட்டுப் பட்டியலின் சூழலில் מַטֶּה என்பது ‘கோல்’ என்பதல்ல, ‘கோத்திரம்’ என்பதே பொருள். לְ முன்னொட்டு ‘-க்காக’ என இயல்பாக மொழிபெயர்க்கப்பட்டது; וּ பட்டியல் தொடர்ச்சியைச் சுட்டுவதால் தமிழில் தனியே ‘மேலும்’ எனச் சேர்க்காமல் விடப்பட்டது.
- source_word: בְנֵי
  choice: மகன்களின்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான ஆண்பால் வடிவம் காக்கப்பட்டுள்ளது; இங்கு அது நப்தலியின் கோத்திர வழிவந்தோரைக் குறிக்கும் மரபான அடையாளச் சொற்றொடர்.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: נָשִׂיא
  choice: ஒரு தலைவர்
  rationale: இந்த நிர்வாகப் பட்டியலில் நியமிக்கப்பட்ட கோத்திரத் தலைவரைக் குறிக்கிறது; ‘இளவரசன்’ போன்ற முடியாட்சி சார்ந்த பொருளைத் தவிர்க்க ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּדַהְאֵל
  choice: பெதகேல்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் அண்மையாகக் காக்கும் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான எபிரெயப் பெயரமைப்பு தமிழில் நேரடியாக வழங்கப்பட்டது.
- source_word: עַמִּיהוּד
  choice: அம்மியூது
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் அண்மையாகக் காக்கும் ஒலிபெயர்ப்பு.
