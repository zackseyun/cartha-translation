  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן אֵפֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: ta
  text: 'யோசேப்பின் மகன்களுக்காக[a], மனாசேயின் மகன்களின் கோத்திரத்துக்காக: தலைவன், ஏப்போத்தின் மகன் ஹன்னியேல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோசேப்பின் வழிவந்தவர்களுக்காக ... மனாசேயின் வழிவந்தவர்களின் கோத்திரத்துக்காக.’ கோத்திர மரபுவழி மொழிநடையில் எபிரெயம் ‘மகன்கள்’ என்பதைத் திரும்பத் திரும்பப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  choice: யோசேப்பின் மகன்களுக்காக
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்.’ இங்கு கோத்திர மரபுவழிச் சூழலில் ‘வழிவந்தவர்கள்’ என்ற விரிவான பொருள் இருந்தாலும், எபிரெய வடிவத்தையும் கோத்திரப் பிரதிநிதித்துவத்தையும் காக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: לְ/מַטֵּה
  choice: கோத்திரத்துக்காக
  rationale: מַטֶּה என்பதற்கு ‘கோல்’ என்றும் பொருள் உண்டு; ஆனால் நிலப்பங்கீடு சார்ந்த இந்த நிர்வாகப் பட்டியலில் அது மரபாக ‘கோத்திரம்’ என்பதைக் குறிக்கிறது. לְ முன்னொட்டு ‘-க்காக’ என வெளிப்படுத்தப்பட்டது.
- source_word: בְנֵי מְנַשֶּׁה
  choice: மனாசேயின் மகன்களுடைய
  rationale: யோசேப்பைப் பற்றிய இணையான சொற்றொடரைப் போலவே, கோத்திர மரபுமொழியின் எபிரெய வடிவத்தைப் பாதுகாக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இந்த நிர்வாகப் பட்டியலில் நியமிக்கப்பட்ட கோத்திரத் தலைவரை இச்சொல் குறிக்கிறது. அரச மரபைத் தவறாக உணர்த்தக்கூடிய ‘இளவரசன்’ என்பதற்குப் பதிலாக, இயல்பான நவீனத் தமிழில் ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַנִּיאֵל
  choice: அன்னியேல்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן אֵפֹד
  choice: எப்போதின் மகன்
  rationale: இது வழக்கமான எபிரெய தந்தைவழிப் பெயர்ச்சொற்றொடர். இங்கு אֵפֹד ஆசாரிய உடையைக் குறிக்காமல் ஒருவரின் பெயராக இருப்பதால் ‘எப்போது’ என ஒலிபெயர்க்கப்பட்டது.
