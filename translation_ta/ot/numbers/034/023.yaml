translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டது. மூலத்தின் இருமுறை வரும் לְ அமைப்பைப் பாதுகாக்க ‘-க்காக’ இருமுறையும் தரப்பட்டுள்ளது; வம்ச/கோத்திரப் பயன்பாட்டிலுள்ள ‘மகன்கள்’ என்ற நேரடி வடிவம் அடிக்குறிப்புடன் காக்கப்பட்டது.
