  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: ta
  text: 'மேலும், தாணின் மகன்களின்[a] கோத்திரத்திற்குத் தலைவன்: யாக்லியின் மகன் புக்கி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘தாணின் மகன்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கீடு மற்றும் நிலப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படுகிறது. இவ்வசனம் பட்டியலின் தொடர்ச்சியில் இருப்பதால் וּ (‘மேலும்/மற்றும்’) தமிழில் வெளிப்படையாக மொழிபெயர்க்கப்படாமல் இயல்பான பட்டியல் நடையில் உணர்த்தப்படுகிறது.
- source_word: בְנֵי דָן
  choice: தாணின் மக்களுடைய
  rationale: எபிரெய மொழியின் ‘தாணின் மகன்கள்’ என்ற உறவுமுறைச் சொல்லாட்சியைப் பெருமளவு காக்கிறது; இங்கே அது தாணின் கோத்திர வழிவந்தோரைச் சுட்டுகிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: நிலப் பங்கீட்டிற்காக நியமிக்கப்பட்ட கோத்திரப் பிரதிநிதியைக் குறிக்கும் தெளிவான, நவீன தமிழ்ச் சொல்.
- source_word: בֻּקִּי
  choice: புக்கி
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நேரடியாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான நேரடி மொழிபெயர்ப்பு.
- source_word: יָגְלִי
  choice: யொக்லி
  rationale: எபிரெய יָגְלִי என்ற தனிப்பெயரின் ஒலிப்பை மூலமொழியிலிருந்து தமிழில் எழுத்துப்பெயர்த்தல்; ஆங்கில மரபுவழி ‘Jogli’ என்பதிலிருந்து அல்ல.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப் பங்கீட்டு நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பெயர்ச்சொல் சார்ந்த பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது.
