translation:
  language: ta
  text: 'மோசே இஸ்ரவேல் மக்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “நீங்கள் சீட்டினால் சுதந்தரித்துக்கொள்ளவிருக்கும் நாடு இதுதான்; இதை ஒன்பது கோத்திரங்களுக்கும் அரைக் கோத்திரத்துக்கும் கொடுக்கும்படி யெகோவா கட்டளையிட்டார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: எபிரெய வினையின் கட்டளையிடுதல் என்ற வலிமையையும், தொடர்ந்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: בְּגוֹרָל
  choice: சீட்டுப்போட்டுப்
  rationale: நிலப் பங்கீட்டிற்காகச் சீட்டு பயன்படுத்தப்பட்ட முறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: பங்கிட்டுக்கொள்ள வேண்டிய
  rationale: ஹித்பஏல் வடிவம் சுதந்தர உரிமையாகப் பெற்று தங்களுக்குள் பங்கிட்டுக்கொள்ளும் கருத்தைக் கொண்டுள்ளது; சூழலுக்கு ஏற்ற தமிழாக்கம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: ஒன்பது கோத்திரங்களுக்கும் அரைக் கோத்திரத்துக்கும்
  rationale: எண்ணிக்கையையும் கோத்திர அமைப்பையும் மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வாக்குத்தத்த நாட்டைச் சுதந்தரித்தல் மற்றும் பங்கிடுதல்
  choice: சீட்டுப்போட்டுப் பங்கிட்டுக்கொள்ள வேண்டிய நாடு
  alternative: சீட்டின்படி சுதந்தரிக்க வேண்டிய நாடு
  rationale: נחל என்பதன் சுதந்தர உரிமைத் தொனியைச் சூழலில் நிகழும் நிலப் பங்கீட்டுடன் இணைக்கிறது; குறிப்பிட்ட ஓர் இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
- issue: אֲשֶׁר צִוָּה יְהוָה לָתֵת என்பதன் தொடர்பு
  choice: இதை ... கொடுக்குமாறு யெகோவா கட்டளையிட்டார்
  alternative: யெகோவா ... கொடுக்கும்படி கட்டளையிட்ட நாடு
  rationale: לָתֵת என்ற செயப்பாட்டை ‘கொடுக்க’ என்ற செய்பொருள் வடிவிலேயே வைத்திருக்கிறது; மறைமுகமாக செயப்பாட்டு வினையாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கோத்திரம்’, ‘சீட்டுப்போடுதல்’ போன்ற சூழலுக்குரிய சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
