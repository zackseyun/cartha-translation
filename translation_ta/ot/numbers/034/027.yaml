  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: ta
  text: 'மேலும், ஆசேர் மக்களின் கோத்திரத்திற்கு ஒரு தலைவர்: செலோமியின் மகன் அகியூத்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: இந்த நிலப்பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோல்’ அல்ல, ‘கோத்திரம்’ என்று பொருள்படுகிறது. தமிழில் பட்டியல் தொடர்ச்சியில் ‘-க்கு’ இயல்பாக அமைகிறது; எபிரெய முன்னொட்டு וְ தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்பட வேண்டிய அவசியமில்லை.
- source_word: בְנֵי אָשֵׁר
  choice: ஆசேரின் மகன்களுடைய
  rationale: בְנֵי என்பதன் நேரடியான ‘மகன்கள்’ என்ற வடிவத்தையும், கோத்திரக் குழுவைக் குறிக்கும் எபிரெய வழக்கையும் பாதுகாக்கிறது.
- source_word: נָשִׂיא
  choice: ஒரு தலைவர்
  rationale: நிலப்பங்கீட்டிற்காக நியமிக்கப்பட்ட கோத்திரப் பிரதிநிதியை இங்கு குறிக்கிறது. ‘தலைவர்’ என்பது அரச மரபைக் குறிக்கும் தவறான நிழற்பொருளைத் தவிர்த்து அதிகாரப்பூர்வப் பங்கைத் தெளிவாகச் சொல்கிறது.
- source_word: אֲחִיהוּד
  choice: அகியூத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן שְׁלֹמִי
  choice: செலோமியின் மகன்
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளக் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான பட்டியல் நடையைப் பயன்படுத்துகிறது. மூலத்தின் சுருக்கமான பெயர்ச்சொல் அமைப்பைப் பாதுகாக்க ‘ஒரு தலைவர்:’ என்ற வடிவம் வைக்கப்பட்டுள்ளது.
