translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டரீதியான நில எல்லை விவரிப்புக்கு ஏற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘தோள்’ என்ற எபிரெய உருவகத்தை முதன்மை உரையில் விளங்காத நேரடி மொழிபெயர்ப்பாக வைக்காமல், அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
