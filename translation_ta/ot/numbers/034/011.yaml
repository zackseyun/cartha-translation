revisions:
- from: பின்பு எல்லை செப்பாமிலிருந்து ஆயினுக்குக் கிழக்கே உள்ள ரிப்லாவுக்கு இறங்கும். அங்கிருந்து அந்த எல்லை கீழ்நோக்கிச் சென்று, கின்னரேத் கடலின் கிழக்குப் பக்கத்திலுள்ள சரிவைத் தொடும்.[a]
  to: பின்பு எல்லை செப்பாமிலிருந்து ஆயினுக்குக் கிழக்கே உள்ள ரிப்லாவுக்கு இறங்கும். அந்த எல்லை இறங்கிச் சென்று, கின்னரேத் கடலின் கிழக்குப் பக்கத்திலுள்ள சரிவைத் தொடும்.[a]
  rationale: The revision removes an unstated connective and renders the repeated boundary verb more closely, without changing the geography or interpretive scope. The contextual Tamil “சரிவு” remains supported by a footnote preserving the Hebrew’s literal “shoulder” image.
