id: NUM.34.11
reference: Numbers 34:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: ta
  text: பின்பு எல்லை செப்பாமிலிருந்து ஆயினுக்குக் கிழக்கே உள்ள ரிப்லாவுக்கு இறங்கும். அந்த எல்லை இறங்கிச் சென்று, கின்னரேத் கடலின் கிழக்குப் பக்கத்திலுள்ள சரிவைத் தொடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘கின்னரேத் கடலின் கிழக்குத் தோளைத் தொடும்.’ இங்கு ‘தோள்’ என்பது கடலோரத்தின் பக்கம் அல்லது சரிவைக் குறிக்கும் நிலவியல் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: இறங்கும் / கீழ்நோக்கிச் சென்று
  rationale: יָרַד என்பதன் இறங்குதல் என்ற நிலவியல் திசைப்பொருளைத் தக்கவைக்கிறது; ஒரே வசனத்தில் இயல்பான தமிழ் நடைக்காக இரண்டாவது இடத்தில் ‘கீழ்நோக்கிச் சென்று’ என வழங்கப்பட்டுள்ளது.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: எல்லை
  rationale: நிலப்பகுதியின் வரம்பைக் குறிக்கும் גְּבוּל என்பதற்கு நவீன தமிழில் தெளிவான, இயல்பான சொல்.
- source_word: מִשְּׁפָם הָרִבְלָה
  choice: செப்பாமிலிருந்து ... ரிப்லாவுக்கு
  rationale: இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டு, தொடக்கமும் சென்றடையும் இடமும் தமிழ் வேற்றுமை உருபுகளால் தெளிவாக்கப்பட்டுள்ளன.
- source_word: מִקֶּדֶם לָעָיִן
  choice: ஆயினுக்குக் கிழக்கே உள்ள
  rationale: ரிப்லா, ஆயினுக்கு கிழக்கே அமைந்துள்ளது என்ற தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொற்றொடரின் இடவியல் பொருளை மீறவில்லை.
- source_word: וּמָחָה
  choice: தொடும்
  rationale: இந்த எல்லை விவரிப்பில் வினை எல்லைக்கோடு ஒரு நிலவியல் அம்சத்தை வந்து தொடுவதைக் குறிக்கிறது; ‘தாக்கும்’ என்ற மிக நேரடியான வடிவத்தைவிட ‘தொடும்’ தெளிவானது.
- source_word: עַל כֶּתֶף
  choice: சரிவை
  rationale: כֶּתֶף என்பதன் நேர்ப்பொருள் ‘தோள்’; நிலவியல் பயன்பாட்டில் அது பக்கம் அல்லது சரிவைக் குறிக்கிறது. முதன்மை உரையில் ‘சரிவு’ இயல்பானது; உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָם כִּנֶּרֶת קֵדְמָה
  choice: கின்னரேத் கடலின் கிழக்குப் பக்கத்திலுள்ள
  rationale: நீர்நிலையின் எபிரெயப் பெயரைப் பாதுகாத்து, קֵדְמָה குறிக்கும் கிழக்குத் திசை/பக்கத்தைத் தெளிவாக அளிக்கிறது.
