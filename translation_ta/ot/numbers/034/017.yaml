base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: ta
  text: 'உங்களுக்கு நாட்டைச் சுதந்தரப் பங்காகப் பிரித்துக் கொடுப்பவர்களின்[a] பெயர்கள் இவை: ஆசாரியனாகிய எலெயாசார், நூனின் மகன் யோசுவா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு நாட்டைச் சுதந்தரமாகக் கொடுப்பவர்கள்” அல்லது “நீங்கள் நாட்டைச் சுதந்தரித்துக்கொள்ளச் செய்பவர்கள்.” எபிரேய வினைச்சொல், ஒருவருக்குச் சுதந்தரம் கிடைக்கச் செய்வது அல்லது அதை அவருக்குப் பங்கிட்டுக் கொடுப்பது என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: அந்த ஆட்களின் பெயர்கள் இவை
  rationale: எபிரேய மொழியின் சுட்டுப் பன்மையையும் ‘ஆட்களின் பெயர்கள்’ என்ற இணைப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது; இங்கு குறிப்பிடப்படுவோர் குறிப்பிட்ட ஆண் தலைவர்கள்.
- source_word: אֲשֶׁר
  choice: —பின்வரும் வினைத் தொடரால் உறவுப்பொருள் வெளிப்படுத்தப்பட்டது
  rationale: தமிழில் தனியான ‘யார்’ உறவுப்பெயரைச் சேர்ப்பதைவிட, பெயர்களைத் தொடர்ந்து வரும் வினைமுற்று உறவுத் தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: உங்களுக்காக நாட்டைச் சுதந்தரப் பங்காகப் பிரித்துக் கொடுப்பார்கள்
  rationale: נחל என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், இவர்கள் நாட்டைத் தாங்களே சுதந்தரிப்பவர்கள் அல்லாமல் இஸ்ரவேலருக்குப் பங்கிட்டுக் கொடுக்கும் நிர்வாகப் பணியையும் காக்கிறது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: தனிப்பெயரை வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தந்து, அதிகாரப் பதவியான ‘ஆசாரியன்’ என்பதையும் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவும்
  rationale: இணைப்பையும் தந்தை வழி அடையாளத்தையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
