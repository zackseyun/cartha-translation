revisions:
- from: அந்த எல்லை உங்களுக்காக அக்ரப்பீம் ஏற்றத்தின்[a] தெற்கிலிருந்து வளைந்து, சீன் வரை கடந்து செல்லும். அதன் முனை காதேஸ்-பர்னேயாவுக்குத் தெற்கே இருக்கும். பின்பு அது காசார்-அத்தார் வரை சென்று, அஸ்மோன் வரை கடந்து செல்லும்.
  to: உங்களுக்கான எல்லை அக்ரப்பீம் ஏற்றத்தின் தெற்கிலிருந்து வளைந்து, சீன் நோக்கிக் கடந்து செல்லும். அதன் முடிவிடங்கள் காதேஸ்-பர்னேயாவுக்குத் தெற்கே இருக்கும். பின்பு அது காசார்-அத்தார் வரை சென்று, அஸ்மோன் நோக்கிக் கடந்து செல்லும்.
