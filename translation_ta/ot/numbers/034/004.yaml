  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: ta
  text: உங்களுக்கான எல்லை அக்ரப்பீம் ஏற்றத்தின் தெற்கிலிருந்து வளைந்து, சீன் நோக்கிக் கடந்து செல்லும். அதன் முடிவிடங்கள் காதேஸ்-பர்னேயாவுக்குத் தெற்கே இருக்கும். பின்பு அது காசார்-அத்தார் வரை சென்று, அஸ்மோன் நோக்கிக் கடந்து செல்லும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַב
  choice: வளைந்து
  rationale: எல்லையை விவரிக்கும் சூழலில், எல்லைக்கோடு திசைமாறி வளைவதை נָסַב குறிக்கிறது.
- source_word: הַגְּבוּל
  choice: அந்த எல்லை
  rationale: גְּבוּל என்பது நிலப்பரப்பின் எல்லையைக் குறிக்கிறது; முந்தைய வசனத்தில் அறிமுகமான எல்லையைத் தொடர்வதால் சுட்டுப்பெயரடை இயல்பானது.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: அக்ரப்பீம் ஏற்றத்தின் தெற்கிலிருந்து
  rationale: מִנֶּגֶב இங்கு குறிப்பிடப்பட்ட இடத்தின் தெற்குப் பக்கத்தைக் குறிக்கிறது; מַעֲלֵה மொழிபெயர்க்கப்பட்டு, עַקְרַבִּים இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְעָבַר צִנָה
  choice: சீன் வரை கடந்து செல்லும்
  rationale: திசையைக் குறிக்கும் இறுதி ה, சீனை நோக்கிய நகர்வைக் காட்டுகிறது; எல்லைக்கோடு ஒரு பகுதியைக் கடப்பதை עָבַר குறிக்கிறது.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: அதன் முனை ... இருக்கும்
  rationale: எபிரெயச் சொல் வடிவில் பன்மையாக இருந்தாலும், எல்லை விவரிப்புகளில் அதன் இறுதி அல்லது வெளிப்படும் முனையைக் குறிக்கும் வழக்குச் சொல்லாக வருகிறது; தமிழில் ஒருமை இயல்பானது.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவுக்குத் தெற்கே
  rationale: எல்லையின் முனை காதேஸ்-பர்னேயாவின் தெற்குப் பக்கத்தில் இருப்பதைச் சொற்றொடர் குறிக்கிறது.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: அது காசார்-அத்தார் வரை சென்று
  rationale: எல்லை விவரிப்பில் יָצָא அடுத்த இடம் வரை எல்லைக்கோடு நீள்வதைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְעָבַר עַצְמֹנָה
  choice: அஸ்மோன் வரை கடந்து செல்லும்
  rationale: திசையைக் குறிக்கும் இறுதி ה காரணமாக இலக்கிடம் ‘வரை’ எனத் தரப்படுகிறது; עָבַר எல்லைக்கோட்டின் தொடர்ச்சியான கடப்பைக் குறிக்கிறது.
