base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: ta
  text: பின்பு எல்லை யோர்தானுக்கு இறங்கிச் செல்லும்; அதன் முடிவிடங்கள்[a] உப்புக் கடலில்[b] இருக்கும். சுற்றிலும் உள்ள அதன் எல்லைகளின்படி, இதுவே உங்களுக்குரிய நாடாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் கடைமுனைகள்.’ எபிரெயச் சொல் எல்லைக்கோட்டின் முடிவிடங்களையோ கடைமுனைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘உப்புக் கடல்’; இது பொதுவாகச் சவக்கடல் என்று அழைக்கப்படும் நீர்நிலையாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: பின்பு ... இறங்கிச் செல்லும்
  rationale: יָרַד என்பதன் அடிப்படைப் பொருள் ‘இறங்கு’. எல்லைப் பாதையை வரிசையாக விவரிக்கும் சூழலில், ‘பின்பு’ தொடர்ச்சியையும் ‘இறங்கிச் செல்லும்’ எல்லைக்கோட்டின் நகர்வையும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: גְּבוּל என்பது நிலப்பரப்பின் எல்லை அல்லது எல்லைக்கோட்டைக் குறிக்கிறது. நவீனத் தமிழில் ‘எல்லை’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַיַּרְדֵּנָה
  choice: யோர்தானுக்கு
  rationale: திசைநோக்கிய -ָה முடிவு யோர்தானை நோக்கிய இயக்கத்தைக் காட்டுகிறது. எபிரெயச் சொற்றொடரில் ‘ஆறு’ இல்லாததால் பெயர் மட்டும் வைக்கப்படுகிறது.
- source_word: תוֹצְאֹתָיו
  choice: அதன் முடிவிடம்
  rationale: எல்லை விவரிப்புகளில் இச்சொல் எல்லைக்கோடு முடியும் இடம் அல்லது கடைமுனையைக் குறிக்கிறது. வடிவம் பன்மையாக இருந்தாலும், இங்கு ஒரே எல்லையின் முடிவை இயல்பான தமிழில் ‘முடிவிடம்’ எனக் கூறுவது பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: எபிரெயப் பெயரின் நேரடியான பொருள் ‘உப்புக் கடல்’. நவீனப் பெயரான ‘சாக்கடல்’ என்பதை முதன்மை உரையில் பதிலீடு செய்யாமல், மூலத்தின் பெயர் பாதுகாக்கப்படுகிறது.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: இதுவே உங்களுக்குரிய நாடாக இருக்கும்
  rationale: இது வரையறுக்கப்பட்ட நிலப்பரப்பைச் சுருக்கிக் கூறுகிறது. לָכֶם என்பதன் உரிமை/ஒதுக்கீட்டுப் பொருளை ‘உங்களுக்குரிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: சுற்றிலும் அதன் எல்லைகளின்படி
  rationale: நாடு எல்லாப் பக்கங்களிலும் அதன் எல்லைகளால் வரையறுக்கப்படுவதை மூல வரிசைக்கு நெருக்கமாகவும் புரியத்தக்கவாறும் தெரிவிக்கிறது.
