translation_notes:
  register: நவீன நிலையான தமிழில், சட்டரீதியான நில எல்லை விவரிப்புக்கு ஏற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயப் புவியியல் பெயரான ‘உப்புக் கடல்’ முதன்மை உரையில் பாதுகாக்கப்பட்டு, இன்றைய வழக்குப் பெயர் அடிக்குறிப்பில் விளக்கப்படுகிறது.
