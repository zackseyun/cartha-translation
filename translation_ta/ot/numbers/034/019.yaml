translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ். எபிரெய மொழியின் பெயர்ச்சொல் வாக்கியம் தமிழில் இயல்பாக ‘இவையே’ கொண்டு வழங்கப்பட்டுள்ளது; குறிப்பிட்ட ஆண் பிரதிநிதிகள் என்பதால் ‘ஆண்கள்’ பயன்படுத்தப்பட்டுள்ளது.
