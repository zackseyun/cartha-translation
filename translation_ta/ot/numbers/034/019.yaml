source:
  edition: WLC
  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הָ/אֲנָשִׁ֑ים לְ/מַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן יְפֻנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: ta
  text: 'மேலும், இந்த ஆண்களின் பெயர்கள் இவையே: யூதா கோத்திரத்திற்காக எப்புன்னேயின் மகன் காலேப்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: וְ முந்தைய வசனத்தின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் பட்டியல் தொடரும் சூழலில் தனியாக ‘மேலும்’ சேர்க்காமல் ‘இவையே’ என்பது இயல்பாக அந்தத் தொடர்ச்சியையும் அடையாளப்படுத்தும் வலியுறுத்தலையும் தருகிறது.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: அந்த ஆண்களின் பெயர்கள்
  rationale: שְׁמוֹת என்பது அடுத்த பெயர்ச்சொல்லுடன் இணைந்த சார்பு வடிவம்; הָאֲנָשִׁים குறிப்பிட்ட ஆண் பிரதிநிதிகளைக் குறிக்கிறது. ஆகவே ‘அந்த ஆண்களின் பெயர்கள்’ என்பது பாலினத்தையும் குறிப்புத்தன்மையையும் காக்கிறது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்திற்காக
  rationale: இந்த நிலப்பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’; לְ அந்தக் கோத்திரத்தின் சார்பில் நியமிக்கப்பட்ட பிரதிநிதியைச் சுட்டுவதால் ‘கோத்திரத்திற்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּלֵב
  choice: காலேபு
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய தந்தைவழிப் பெயரிணைப்பை இயல்பான தமிழில் ‘மகன்’ எனத் தருகிறது.
- source_word: יְפֻנֶּה
  choice: எப்புன்னே
  rationale: எபிரெய தனிப்பெயருக்கு மூல உச்சரிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
