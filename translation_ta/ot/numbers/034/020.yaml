revisions:
- from: சிமியோன் மக்களின் கோத்திரத்துக்கு, அம்மிகூதின் மகன் செமுவேல்.
  to: 'மேலும், சிமியோன் மகன்களின் கோத்திரத்துக்கு: அம்மிஹூத்தின் மகன் ஷெமுவேல்[a].'
  rationale: The revision retains the concise administrative-list register, restores the connective force of the Hebrew conjunction, gives a closer rendering of the tribal construct phrase, and corrects the transliteration of Ammihud. The footnote preserves the audit trail’s distinction between the closer Hebrew-form name and the familiar traditional form.
