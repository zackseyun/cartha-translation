  text: וּ/לְ/מַטֵּה֙ בְּנֵ֣י שִׁמְע֔וֹן שְׁמוּאֵ֖ל בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: ta
  text: 'மேலும், சிமியோன் மகன்களின் கோத்திரத்துக்கு: அம்மிஹூத்தின் மகன் ஷெமுவேல்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஷெமுவேல்”; பாரம்பரியமாக “சாமுவேல்” என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்துக்கு
  rationale: இந்த நிர்வாகப் பட்டியல் சூழலில் מַטֶּה என்பது நேரடியாக ‘கோல்’ என்று அல்லாமல் கோத்திர அலகைக் குறிக்கிறது. வாவ் இணைப்பைத் தமிழில் தனியாக ‘மற்றும்’ எனச் சேர்க்காமல் பட்டியல் நடையில் இயல்பாக வெளிப்படுத்தலாம்.
- source_word: בְּנֵי
  choice: மக்களின்
  rationale: இது சொற்படியாக ‘மகன்களின்’ என்றாலும், கோத்திரப் பெயருடன் வரும் இச்சூழலில் அந்த வம்சத்தைச் சேர்ந்த மக்களைக் குறிக்கிறது; ‘மக்களின்’ என்பது எபிரெய வடிவின் உறவையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁמוּאֵל
  choice: செமுவேல்
  rationale: எபிரெய שְׁמוּאֵל என்ற பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்தத் தலைவர்களின் பட்டியலில் நேரடியான தந்தை–மகன் மரபுறவைக் குறிக்கும் எளிய, தெளிவான மொழிபெயர்ப்பு.
- source_word: עַמִּיהוּד
  choice: அம்மிகூத்
  rationale: எபிரெய עַמִּיהוּד என்ற தனிப்பெயரின் ஒலியையும் இறுதி மெய்யையும் நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனத் தொடக்க வாவ் தமிழில் கட்டாயமாக இணைப்புச் சொல்லாகத் தரப்படவில்லை; முந்தைய பட்டியலின் தொடர்ச்சி வாக்கிய அமைப்பால் தெளிவாகிறது.
