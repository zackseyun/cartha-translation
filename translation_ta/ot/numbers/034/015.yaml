  source_fidelity: 'மூல எபிரேயத்தின் பொருள் பெரும்பாலும் காக்கப்பட்டுள்ளது: இரண்டு கோத்திரங்களும் ஒரு அரைக் கோத்திரமும், எரிகோ அருகிலுள்ள யோர்தானின் அப்பாலுள்ள கிழக்குப் பகுதியில் தங்கள் பங்கினைப் பெற்றனர். ஆனால் לָקְחוּ என்பதற்கு ‘பெற்றுக்கொண்டார்கள்’ என்பது சற்றே விளக்கமளிக்கும் தேர்வு; எளிய இறந்தகால ‘பெற்றார்கள்’ மூலத்தின் நிறைவு செயலை இயல்பாகவும் தேவையற்ற நுண்பொருள் இன்றியும் தெரிவிக்கிறது. மேலும், இடக்குறிப்பை ‘யோர்தானின் அப்பால், எரிகோவுக்கு அருகே’ என அமைப்பது மூலச் சொல் வரிசையையும் இடவியல் தொடர்பையும் தெளிவாகக் காக்கும்.'
