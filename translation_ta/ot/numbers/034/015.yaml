translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கோத்திரம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாட்சி காக்கப்பட்டாலும், ‘உரிமை நிலம்’ போன்ற தெளிவான நடப்பு மொழி பயன்படுத்தப்பட்டது. எபிரேய மூலத்தின் கிழக்குத் திசை குறித்த இரட்டிப்பு பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
