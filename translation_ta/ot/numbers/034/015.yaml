base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: ta
  text: அந்த இரண்டு கோத்திரங்களும் அரைக் கோத்திரமும் தங்கள் மரபுரிமை நிலத்தை யோர்தானின் அப்பால், எரிகோவுக்கு அருகே[a], கிழக்கே—சூரியன் உதிக்கும் திசையில்[b]—பெற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானின் மறுபுறத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “கிழக்கே, சூரியன் உதிக்கும் திசையில்”; கிழக்குப் பக்கத்தை வலியுறுத்தும் இரட்டைக் கூற்று.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: அந்த இரண்டு கோத்திரங்கள்
  rationale: מַטֶּה என்பதன் நேரடிப் பொருள் ‘கோல்’ என்றாலும், நிலப்பங்கீட்டுச் சூழலில் அது ‘கோத்திரம்’ என்னும் மரபுவழிப் பொருளைக் கொண்டுள்ளது. முந்தைய வசனங்களைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: அரைக் கோத்திரம்
  rationale: இது ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட பாதிப் பிரிவை, இங்கு மனாசேயின் அரைக் கோத்திரத்தை, குறிக்கிறது.
- source_word: לָקְחוּ
  choice: பெற்றுக்கொண்டார்கள்
  rationale: Qal perfect முடிவுற்ற செயலைக் குறிக்கிறது. தமிழில் நில உரிமைப் பங்கைச் சூழலுக்கேற்றவாறு இயல்பாகச் சொல்வதற்கு ‘பெற்றுக்கொண்டார்கள்’ பயன்படுத்தப்பட்டது; நேரடியான ‘எடுத்துக்கொண்டார்கள்’ இங்கு தன்னிச்சையாகக் கைப்பற்றியதாகத் தவறாக ஒலிக்கலாம்.
- source_word: נַחֲלָתָם
  choice: தங்கள் உரிமை நிலத்தை
  rationale: நிலப்பங்கீட்டுச் சூழலில் נַחֲלָה மரபுரிமையாக வழங்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது. நவீன தமிழில் தெளிவாக இருக்க ‘உரிமை நிலம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: பேசுபவரின் பார்வைநிலையிலிருந்து யோர்தானின் மறுபுறப் பகுதியைக் குறிக்கும் எபிரேய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே
  rationale: இடப்பெயர் இங்கு யோர்தானைக் கடக்கும் பகுதியை இடவியல் முறையில் அடையாளப்படுத்துகிறது. ‘அருகே’ என்பது தேவையற்ற துல்லியத்தைத் திணிக்காமல் இதைத் தெரிவிக்கிறது.
- source_word: קֵדְמָה מִזְרָחָה
  choice: கிழக்கே—சூரியன் உதிக்கும் திசையில்
  rationale: இரு திசைச்சொற்களையும் ஒன்றாக்காமல், கிழக்குப் பக்கத்தை வலியுறுத்தும் எபிரேய இரட்டைக் கூற்றைத் தமிழில் காக்கிறது.
