translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட-புவியியல் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குறித்து வரையறுக்க’ என்பது மூல வினைச்சொல்லின் அரிதான, எல்லைக்கோடு வகுக்கும் பொருளைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் மாற்று மொழிபெயர்ப்பை வெளிப்படுத்துகிறது.
