  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: ta
  text: உங்களுக்கென கிழக்கு எல்லையை ஹசார்-ஏனானிலிருந்து செப்பாம் வரை வரையறுத்துக்கொள்ள வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கென கிழக்கு எல்லைக்கோட்டை வரைந்துகொள்ள வேண்டும்.” இங்குள்ள எபிரெய வினைச்சொல் அரிதானது; இந்தச் சூழலில் அது எல்லைக்கோட்டை வரையறுத்தல் அல்லது வரைதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: குறித்து வரையறுக்க வேண்டும்
  rationale: எல்லை நிர்ணயிக்கும் இந்தச் சூழலில், அரிதான இவ்வினைச்சொல் எல்லைக்கோட்டைக் குறித்தல் அல்லது வரைதல் என்ற பொருளைத் தருகிறது; அதன் பொதுவான வேறு பொருளான ‘விரும்புதல்’ இங்கு பொருந்தாது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: இஸ்ரவேலரின் பயன் அல்லது உடைமைக்காக இந்த எல்லை வகுக்கப்படுவதைத் தத்த வேற்றுமைச் சுட்டுப்பெயர் காட்டுகிறது.
- source_word: לִגְבוּל קֵדְמָה
  choice: கிழக்கு எல்லையை
  rationale: גְּבוּל நிலப்பரப்பின் எல்லையையும் קֵדְמָה இங்கு அதன் கிழக்குப் பக்கத்தையும் குறிக்கின்றன; இயல்பான தமிழில் இரண்டையும் சேர்த்து வழங்குகிறது.
- source_word: מֵחֲצַר עֵינָן
  choice: ஆசார்-ஏனானிலிருந்து
  rationale: எல்லைக்கோட்டின் தொடக்க இடமான ஊர்ப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழ் ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: שְׁפָמָה
  choice: செப்பாம்வரை
  rationale: இந்த எல்லைப் பகுதியின் மறுமுனையைக் குறிக்கும் ஊர்ப்பெயர் தமிழ் ஒலிபெயர்ப்பில் தரப்படுகிறது; தொடக்கத்திலிருந்து இறுதிவரையிலான நீட்சியை ‘வரை’ தெளிவாக்குகிறது.
