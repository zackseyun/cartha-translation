base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (יהוה); இதன் துல்லியமான பழங்கால உச்சரிப்பு உறுதியாகத் தெரியவில்லை. இங்கே ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; மரபாக ‘கர்த்தர்’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வழக்கமான wayyiqtol வடிவம் நிகழ்ச்சித் தொடரை முன்னெடுக்கிறது. நவீன தமிழில் அதன் தொடர்ச்சிப் பொருளை ‘பின்பு’ இயல்பாக வெளிப்படுத்துகிறது; ‘பேசினார்’ என்பது דבר வினையின் அடிப்படை கருத்தைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இத்தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'சொன்னார்:'
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் infinitive construct. ‘பேசிச் சொன்னார்:’ என்பது எபிரெய உரையின் முறையான பேச்சுத் தொடக்க அமைப்பை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: இந்த வசனம் יְהוָה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல உரையின் தன்மையைப் பாதுகாக்கிறது. உச்சரிப்பு முற்றிலும் உறுதியானதல்ல என்பதால் அடிக்குறிப்பு அந்த விவரத்தைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பேசிச் சொன்னார்’ என்பது எபிரெய பேச்சுத் தொடக்கச் சூத்திரத்தின் இரு கூறுகளையும் காக்கிறது; இறுதியில் வரும் முக்காற்புள்ளி அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையைச் சுட்டுகிறது.
