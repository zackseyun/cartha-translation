  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: ta
  text: 'மேலும், எப்பிராயீமின் மகன்களின்[a] கோத்திரத்திற்கான தலைவன்: ஷிப்தானின் மகன் கெமுவேல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘எப்பிராயீமின் மகன்கள்’; அதாவது, எப்பிராயீம் கோத்திரத்தின் வழிவந்தவர்கள் அல்லது உறுப்பினர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: מַטֶּה என்பதன் நேரடிப் பொருள் ‘கோல்’ என்றாலும், இந்தக் கோத்திர நிர்வாகப் பட்டியலில் அது ‘கோத்திரம்’ என்பதையே குறிக்கிறது. தமிழ் பட்டியல் நடையில் இணைப்புச் சொல் வெளிப்படையாகத் தேவையில்லை.
- source_word: בְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மகன்களாகிய
  rationale: எபிரெய ‘எப்பிராயீமின் மகன்கள்’ என்ற அமைப்பைத் தக்கவைத்து, இங்கு அது கோத்திரத்தின் வழிவந்தோரையும் உறுப்பினர்களையும் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இந்தச் சூழலில் கோத்திரத்திற்காக நியமிக்கப்பட்ட பிரதிநிதி அல்லது தலைவரைக் குறிக்கிறது; அரச மரபைச் சுட்டும் பொருளைத் தவிர்க்கிறது.
- source_word: קְמוּאֵל
  choice: கெமுவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறையில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை-மகன் உறவைக் குறிக்கும் வழக்கமான வம்ச அடையாள அமைப்பு.
- source_word: שִׁפְטָן
  choice: சிப்தான்
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்யொலிகளுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
