  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/016.yaml
  text: Then Yahweh spoke to Moses, saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் தேவனுடைய தனிப்பெயரான יהוה (YHWH).
    reason: ‘யாவே’ என்பது பட்டப்பெயருக்குப் பதிலாக மூலத்திலுள்ள தனிப்பெயரின் ஒலிபெயர்ப்பு என்பதைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசிக்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது. דִּבֵּר என்பதன் ‘பேசினார்’ என்ற பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் நேரடியாக வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது; מֹשֶׁה என்ற பெயர் வழக்கமான தமிழ் வடிவில் தரப்படுகிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்த வசனத்தில் நேரடி உரை தொடங்குவதைச் சுட்டும் எபிரெய அறிமுகச் சூத்திரத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளாலான தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தொடர்கதைச் சூழலைக் காட்ட ‘பின்பு’ என்றும், அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்த ‘பேசிக் கூறியதாவது’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
