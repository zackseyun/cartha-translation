source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களுக்குக் கட்டளையிடு; அவர்களிடம் சொல்: “நீங்கள் கானான் நாட்டிற்குள் நுழையும்போது, சுதந்தரமாக உங்களுக்குக் கிடைக்கவிருக்கும் நாடு இதுதான்: அதன் எல்லைகளின்படியான கானான் நாடு.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களுக்குக் கிடைக்கவிருக்கும்” என்பதற்கான எபிரெயச் சொற்றொடர், சொல்லுக்கு சொல் மொழிபெயர்த்தால் “உங்களுக்கு விழும்” என்பதாகும்; நிலம் ஒருவருக்குப் பங்காக ஒதுக்கப்படுவதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிட்டு
  rationale: צוה வினையின் கட்டளை வடிவம் அதிகாரமுள்ள நேரடியான ஆணையைக் குறிக்கிறது; ‘கட்டளையிட்டு’ அதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவமாக ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: தொடர்ச்சியான இரண்டாவது கட்டளையை எளிமையாகவும் மூலத்திற்கு நெருக்கமாகவும் வழங்குகிறது.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: நீங்கள் ... நுழையும்போது
  rationale: இங்கு כִּי, நாட்டிற்குள் வருவதைச் சூழ்நிலையாக அறிமுகப்படுத்துகிறது; நிகழவிருக்கும் நுழைவைத் தமிழில் இயல்பாக ‘நுழையும்போது’ தெரிவிக்கிறது.
- source_word: הָאָרֶץ כְּנָעַן
  choice: கானான் நாட்டிற்குள்
  rationale: ‘நாடு, கானான்’ என்ற எபிரெய apposition-ஐ தெளிவான தமிழில் இடப்பொருளுடன் வழங்குகிறது.
- source_word: זֹאת הָאָרֶץ
  choice: நாடு இதுதான்
  rationale: அடுத்து வரவுள்ள நில எல்லை விவரிப்பைச் சுட்டிக்காட்டும் demonstrative வலிமையைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: உங்களுக்குப் பங்கிடப்படும்
  rationale: נפל என்பதன் நேரடிப் பொருள் ‘விழும்’ என்றாலும், நிலப்பங்கீட்டுச் சூழலில் சீட்டின்படி ஒதுக்கப்படுவதைச் சுட்டும் மரபுத்தொடர்; தமிழில் நேரடி ‘விழும்’ என்பது பொருளை மறைப்பதால் செயல்பொருள் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנַחֲלָה
  choice: சொத்துரிமையாக
  rationale: נחלה என்பது பரம்பரைச் சொத்து மட்டுமல்லாமல் ஒதுக்கப்பட்ட நிலவுடைமையையும் குறிக்கிறது; ‘சொத்துரிமையாக’ இச்சட்ட-நிலப்பங்கீட்டு நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: கானான் நாடு, அதன் எல்லைகளின்படி
  rationale: விரைவில் விவரிக்கப்படவுள்ள நில எல்லைகளுக்கு ஏற்ப வரையறுக்கப்பட்ட கானான் பிரதேசம் என்பதைக் கட்டுப்பாடான முறையில் தெரிவிக்கிறது.
