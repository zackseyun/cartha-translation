translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப்பூர்வ நிலப்பங்கீட்டு தொனியும் அதிகாரமுள்ள கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன. ‘இஸ்ரவேலின் மக்கள்’ என்பது சூழலில் முழுச் சமூகத்தையும் இயல்பாகக் குறிக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய மொழிபெயர்ப்புக்குப் பின் வைக்கப்பட்டுள்ளது.
