  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: ta
  text: உங்களுக்கான தென்புறம் ஏதோமின் அருகிலுள்ள சீன் வனாந்தரத்திலிருந்து அமையும்; உங்கள் தெற்கு எல்லை உப்புக்கடலின்[b] கடைமுனையிலிருந்து[a] கிழக்கு நோக்கி அமையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைமுனையிலிருந்து” என்பதற்கு “ஓரத்திலிருந்து” அல்லது “கோடியிலிருந்து” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரபாக “சவக்கடல்” என்று அழைக்கப்படுகிறது; எபிரெயத்தில் “உப்புக்கடல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: தென்புறம்
  rationale: எல்லை விவரிப்பில் פְּאַת என்பது நிலப்பரப்பின் ‘புறம்/ஓரம்’ என்பதையும், נֶגֶב இங்கு திசையாக ‘தெற்கு’ என்பதையும் குறிக்கிறது. ‘தென்புறம்’ இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: מִמִּדְבַּר צִן
  choice: சீன் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனப்பகுதியைக் குறிக்கிறது; வேதாகமப் புவியியல் வழக்கில் ‘வனாந்தரம்’ பொருத்தமானது. צִן என்ற இடப்பெயர் ‘சீன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: עַל יְדֵי אֱדוֹם
  choice: ஏதோமை ஒட்டியுள்ள
  rationale: இந்தப் புவியியல் சொற்றொடர் ‘ஏதோமின் அருகில்/பக்கத்தில்’ என்ற பொருளைத் தருகிறது. ‘ஒட்டியுள்ள’ என்பது அருகமைவையும் எல்லையோர நீட்சியையும் இயல்பாக வெளிப்படுத்துகிறது; முறையான அரசியல் எல்லை என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: גְּבוּל נֶגֶב
  choice: தெற்கு எல்லை
  rationale: גְּבוּל என்பது நிலப்பகுதியின் எல்லையைக் குறிக்கிறது; נֶגֶב இங்கு திசைச் சொல்லாக உள்ளது.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: உப்புக்கடலின் கடைமுனையிலிருந்து
  rationale: קָצֶה என்பது ஓர் இடத்தின் முடிவு, கோடி அல்லது கடைமுனையைக் குறிக்கலாம். எல்லையின் தொடக்கப் புள்ளியைச் சுட்டுவதற்கு ‘கடைமுனை’ தெளிவானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக்கடல்
  rationale: எபிரெயப் பெயரின் நேரடிப் பொருள் ‘உப்புக்கடல்.’ மரபான ‘சவக்கடல்’ என்ற பெயரை முதன்மை உரையில் மாற்றாக இடாமல் அடிக்குறிப்பில் தருவது மூலமொழிக்கு முன்னுரிமை அளிக்கிறது.
- source_word: קֵדְמָה
  choice: கிழக்கு நோக்கி
  rationale: திசையைக் குறிக்கும் இந்த வினையடை எல்லை கிழக்குத் திசையில் அமைவதைச் சொல்கிறது; ‘கிழக்கு நோக்கி’ நவீன தமிழில் இயல்பானது.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: அமையும் ... அமையும்
  rationale: மீண்டும் வரும் எபிரெய வினை எல்லை வரையறையை அறிமுகப்படுத்துகிறது. ‘அமையும்’ என்பது அதன் சட்டரீதியான, விவரிப்பு வலிமையைத் தக்கவைத்து தமிழில் இயல்பாக உள்ளது.
