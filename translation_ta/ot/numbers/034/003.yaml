translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லை விவரிப்புக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஏதோமை ஒட்டியுள்ள’ என்பது மூலத்தின் புவியியல் அருகமைவை இயல்பாகத் தெரிவிக்கிறது; ‘அமையும்’ என்ற மீட்சி எபிரெய உரையின் இணை அமைப்பைத் தக்கவைக்கிறது.
