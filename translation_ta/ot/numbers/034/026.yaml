  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי יִשָׂשכָ֖ר נָשִׂ֑יא פַּלְטִיאֵ֖ל בֶּן עַזָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: ta
  text: 'மேலும், இசக்கார் மகன்களின் கோத்திரத்துக்கான தலைவர்: அசானின் மகன் பல்தியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: மַטֶּה என்பதன் அடிப்படைப் பொருள் ‘கோல்/கிளை’ என்றாலும், இங்கு நிலப்பங்கீட்டுப் பட்டியலின் சூழலில் அது ‘கோத்திரம்’ என்பதைக் குறிக்கிறது. வாக்கியப் பட்டியல் தொடரில் உள்ள וּ தமிழ் நடையில் தனியாக ‘மேலும்’ என்று வெளிப்படுத்தப்படாமல் இயல்பாக இணைக்கப்பட்டுள்ளது; לְ வேற்றுமை ‘-க்கு’ மூலம் தரப்பட்டுள்ளது.
- source_word: בְנֵי
  choice: மகன்களுடைய
  rationale: எபிரேய ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைப் பாதுகாத்து, கோத்திரப் பெயரமைப்பை இயல்பான தமிழில் உடைமைத் தொடராக வழங்குகிறது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: எபிரேயப் பெயரின் ஒலிப்பை நெருக்கமாகப் பின்பற்றிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் கோத்திரத்தின் நியமிக்கப்பட்ட பிரதிநிதி அல்லது தலைவரைக் குறிக்கிறது; ‘இளவரசன்’ என்ற அரசகுலப் பொருளைத் தவிர்த்து, தெளிவான நவீனச் சொல்லாக ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פַּלְטִיאֵל
  choice: பல்தியேல்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை-மகன் உறவைக் குறிக்கும் வழக்கமான எபிரேயச் சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: עַזָּן
  choice: அசான்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பை நெருக்கமாகப் பின்பற்றிய தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் வடிவம் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் வினைச்சொல் இல்லாத பெயர்த் தொடர் அமைப்பு தமிழிலும் பெரும்பாலும் தக்கவைக்கப்பட்டுள்ளது; மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதும் ஆகும்.
