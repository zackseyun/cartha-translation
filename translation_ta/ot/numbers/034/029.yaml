- from: இவர்களே கானான் நாட்டில் இஸ்ரவேல் மக்களுக்குரிய உரிமைப் பங்கைப் பகிர்ந்தளிக்கும்படி யாவே கட்டளையிட்டவர்கள்.[a]
  to: கானான் நாட்டில் இஸ்ரவேல் மக்களுக்கு உரிமைப் பங்காகப் பிரித்தளிக்கும்படி யாவே கட்டளையிட்டவர்கள் இவர்களே.[a]
