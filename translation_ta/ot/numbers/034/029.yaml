base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: ta
  text: கானான் நாட்டில் இஸ்ரவேல் மக்களுக்கு உரிமைப் பங்காகப் பிரித்தளிக்கும்படி யாவே கட்டளையிட்டவர்கள் இவர்களே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இவர்களே கானான் நாட்டில் இஸ்ரவேல் மக்களுக்கு உரிமையாகக் கொடுக்கும்படி யாவே கட்டளையிட்டவர்கள்.”'
    reason: לְנַחֵל என்பதற்கு இச்சூழலில் ‘உரிமைப் பங்காகப் பிரித்தளித்தல்’ அல்லது ‘உரிமையாகக் கொடுத்தல்’ என்ற நெருங்கிய சொற்பொருள் மாற்றுகள் உள்ளன.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: இவர்களே ... கட்டளையிட்டவர்கள்
  rationale: முன்னர் பெயரிடப்பட்ட தலைவர்களைச் சுட்டும் எபிரெய அடையாள மற்றும் தொடர்புச் சொற்களின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் முதன்மைப் பொருளான ‘கட்டளையிடுதல்’ என்பதைக் காக்கிறது; சூழலிலிருந்து மட்டும் ‘நியமித்தார்’ என்று மாற்றவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְנַחֵל
  choice: உரிமைப் பங்கைப் பகிர்ந்தளிக்கும்படி
  rationale: Hiphil வடிவம் இங்கு தேசத்தைச் சுதந்தர உரிமையாகப் பங்கிட்டு வழங்கும் செயலைக் குறிக்கிறது; ‘உரிமைப் பங்கு’ மரபுரிமைக் கருத்தையும் ‘பகிர்ந்தளித்தல்’ ஒதுக்கீட்டுச் செயலையும் வெளிப்படுத்துகின்றன.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்குரிய
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இங்கு மொத்த மக்களையும் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் வழங்கப்படுகிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: ‘கானான் தேசத்தில்’ என்ற இடப்பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் பரவலாக ஏற்றுக்கொள்ளப்படும் தமிழொலிப்பில் வழங்குகிறது.
- issue: לְנַחֵל என்பதில் பெறச்செய்தல் அல்லது பங்கிட்டளித்தல்
  choice: உரிமைப் பங்கைப் பகிர்ந்தளிக்கும்படி
  alternative: உரிமையாகக் கொடுக்கும்படி
  rationale: இச்சூழலில் பெயரிடப்பட்ட தலைவர்கள் நிலத்தை இஸ்ரவேலுக்குப் பங்கிட்டு ஒதுக்குவதே முன்வைக்கப்படுகிறது; அதேவேளையில் மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் முடிவுரைத் தன்மையும், கட்டளையின் வலிமையும், மரபுரிமை/நிலப்பங்கீட்டு கருத்தும் காக்கப்பட்டுள்ளன.
