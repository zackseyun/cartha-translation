source:
  edition: WLC
  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: ta
  text: ஏனெனில், ரூபன் சந்ததியினரின் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படியும்[a], காத் சந்ததியினரின் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படியும், மனாசேயின் அரைக் கோத்திரமும் தங்கள் சுதந்தரத்தை எடுத்துக்கொண்டனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தையர் குடும்பங்கள்” என்பது ஒவ்வொரு கோத்திரத்திற்குள்ளும் இருந்த தந்தைவழி வம்சக் குடும்ப அல்லது குலப் பிரிவுகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “மனாசேயின் அரைக் கோத்திரம்” என்பதை “மனாசே கோத்திரத்தின் பாதி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: לָקְחוּ
  choice: கைப்பற்றியிருந்தன / கைப்பற்றியிருந்தது
  rationale: לקח என்பதன் நிறைவுற்ற செயற்பொருளை நெருக்கமாகக் காட்டுகிறது; நிலப்பங்கு ஏற்கெனவே பெற்றுக்கொள்ளப்பட்டிருந்ததைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַטֶּה
  choice: கோத்திரம்
  rationale: நிலப் பங்கீட்டுச் சூழலில் இச்சொல் கைத்தடியைக் குறிக்காமல் இஸ்ரவேலின் கோத்திர அலகைக் குறிக்கிறது.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: ரூபன் சந்ததியார் / காத் சந்ததியார்
  rationale: வம்சவழி உணர்வைப் பாதுகாத்தபடியே, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் மூதாதையர் குடும்பங்களின்படி
  rationale: ஒவ்வொரு கோத்திரத்திற்குள்ளும் உள்ள வம்சக் குடும்பப் பிரிவுகளின்படி பங்கு வழங்கப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரம்
  rationale: மனாசே கோத்திரத்தின் ஒரு பாதி மட்டும் இங்கு குறிக்கப்படுவதைச் சுருக்கமாகவும் மரபான முறையிலும் தெரிவிக்கிறது.
- source_word: נַחֲלָתָם
  choice: தங்களுக்குரிய பங்கு
  rationale: இங்கு குறிக்கப்படும் பரம்பரை நில ஒதுக்கீட்டை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் பொதுவான உடைமை என்ற எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: נַחֲלָה என்பதிலுள்ள பரம்பரை மற்றும் உடன்படிக்கைச் சார்ந்த நிலப்பங்கு உணர்வு
  choice: தங்களுக்குரிய பங்கு
  alternative: தங்கள் சுதந்தரம்
  rationale: இது நில ஒதுக்கீட்டைக் குறிப்பது என்பதை வாசகருக்கு உடனடியாகத் தெளிவாக்குகிறது; அதேவேளை உரையில் இல்லாத கூடுதல் இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் காரணவிளக்கத் தொடர்பும், கோத்திர–வம்ச அமைப்பும், ஏற்கெனவே நிறைவேறிய நிலப்பங்கு பெற்றுக்கொள்ளுதலும் பாதுகாக்கப்பட்டுள்ளன.
