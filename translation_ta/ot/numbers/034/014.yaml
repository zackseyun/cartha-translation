revisions:
- from: ஏனெனில், ரூபன் சந்ததியாரின் கோத்திரமும் காத் சந்ததியாரின் கோத்திரமும் தங்கள் மூதாதையர் குடும்பங்களின்படி[a] தங்களுக்குரிய பங்கைக் கைப்பற்றியிருந்தன; மனாசேயின் அரைக் கோத்திரமும் தங்களுக்குரிய பங்கைக் கைப்பற்றியிருந்தது.[b]
  to: ஏனெனில், ரூபன் சந்ததியினரின் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படியும்[a], காத் சந்ததியினரின் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படியும், மனாசேயின் அரைக் கோத்திரமும் தங்கள் சுதந்தரத்தை எடுத்துக்கொண்டனர்.[b]
  rationale: 'திருத்தம் எபிரெய வாக்கியத்தின் மூன்று இணைப்பட்ட கூறுகளையும் காக்கிறது: ரூபன் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படி, காத் கோத்திரம் தங்கள் தந்தையர் குடும்பங்களின்படி, மற்றும் மனாசேயின் அரைக் கோத்திரம். இறுதி பன்மை வினை மூன்று குழுக்களையும் இணைத்து நிற்கிறது. ‘சுதந்தரத்தை எடுத்துக்கொண்டனர்’ என்பது לָקְחוּ மற்றும் נַחֲלָתָם ஆகியவற்றின் நிறைவுற்ற, பரம்பரை நில ஒதுக்கீட்டுச் சொல்லாட்சியைத் தேவையற்ற வலுப்படுத்தலின்றி வெளிப்படுத்துகிறது.'
