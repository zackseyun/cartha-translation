  register: நவீன நிலையான தமிழில், நில எல்லை விவரிப்புக்கு ஏற்ற எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மூல எபிரெய ஒலிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
