source:
  edition: WLC
  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: ta
  text: பின்பு எல்லை சிப்ரோன் வரை நீளும்; அதன் முடிவிடம் ஆத்சார்-ஏனானாக இருக்கும்.[a] இதுவே உங்களுக்கு வடக்கு எல்லையாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “அதன் முடிவுகள் ஆத்சார்-ஏனானாக இருக்கும்.” எல்லை முடிவுறுவதைக் குறிப்பிட எபிரெயம் பன்மை வடிவத்தைப் பயன்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: நீண்டு
  rationale: எல்லையை விவரிக்கும் சூழலில், יָצָא என்பது நேரடியான இயக்கத்தைக் காட்டாமல் எல்லைக்கோடு செல்லும் திசையையும் நீட்சியையும் குறிக்கிறது.
- source_word: הַגְּבֻל
  choice: எல்லை
  rationale: גְּבוּל என்பது ஒரு நிலப்பரப்பின் எல்லையைக் குறிக்கிறது; இச்சூழலில் இயல்பான, தெளிவான தமிழ்ச் சொல் ‘எல்லை’.
- source_word: זִפְרֹנָה
  choice: சிப்ரோன் வரை
  rationale: இது ஓர் இடப்பெயர். சொல்லின் திசைசுட்டும் இறுதி, அந்த இடத்தை நோக்கிய எல்லையின் நீட்சியைக் காட்டுவதால் ‘வரை’ என வழங்கப்பட்டுள்ளது.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: அதன் முடிவிடம் ... இருக்கும்
  rationale: எல்லை விவரிப்புகளில் תוֹצְאוֹת என்பது எல்லைக்கோடு முடியும் இடத்தைக் குறிக்கிறது. எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், இயல்பான தமிழில் ஒருமைக் கூட்டுப்பொருளாக வழங்கப்பட்டுள்ளது; மூல வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: חֲצַר עֵינָן
  choice: ஆத்சார்-ஏனான்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: இதுவே உங்களுக்கு ... ஆக இருக்கும்
  rationale: விவரிக்கப்பட்ட கோடுதான் இஸ்ரவேலருக்குரிய எல்லை என்பதைச் சுருக்கமாக அடையாளப்படுத்தும் வாக்கிய அமைப்பு இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: גְּבֻל צָפוֹן
  choice: வடக்கு எல்லை
  rationale: இந்த இணைச்சொல் வடக்குப் பக்கத்திலுள்ள எல்லையைக் குறிக்கிறது; ‘வடக்கு எல்லை’ தெளிவான நவீனத் தமிழ் வழக்கு.
