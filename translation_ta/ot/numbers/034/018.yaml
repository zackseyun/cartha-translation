base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: ta
  text: நிலத்தை உரிமைப் பங்காகப் பிரித்துக் கொடுப்பதற்காக ஒவ்வொரு கோத்திரத்திலிருந்தும் ஒரு தலைவரைத் தேர்ந்தெடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தை உரிமைச்சொத்தாகப் பெறுவதற்காக.” எபிரெய வினைச்சொல் உரிமைச்சொத்து தொடர்பான பொருளைக் கொண்டது; ஆனால் இங்குள்ள நிலப் பங்கீட்டுச் சூழலில், நிலப் பகுதிகளை உரிமைப் பங்காக ஒதுக்குதல் அல்லது பங்கிட்டுக் கொடுத்தல் என்பதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: தலைவர்
  rationale: இச்சொல் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது. நிலப் பங்கீட்டின் நிர்வாகச் சூழலில், அரச மரபை உணர்த்தக்கூடிய ‘இளவரசர்’ என்பதைக் காட்டிலும் ‘தலைவர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶחָד ... אֶחָד
  choice: ஒவ்வொரு ... ஒரு
  rationale: திரும்பத் திரும்ப வரும் ‘ஒருவர்’ என்பது ஒவ்வொரு கோத்திரத்திலிருந்தும் தலா ஒரு பிரதிநிதி என்ற பகிர்வுப் பொருளை வலியுறுத்துகிறது; தமிழில் ‘ஒவ்வொரு கோத்திரத்திலிருந்தும் ஒரு தலைவர்’ என்பது இயல்பான வடிவம்.
- source_word: מִמַּטֶּה
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும்
  rationale: מַטֶּה என்பதற்கு நேரடியாக ‘கோல்’ என்றும் பொருள் உண்டு; ஆனால் இங்கு கோத்திர நிர்வாகச் சூழலில் அது ‘கோத்திரம்’ என்பதையே குறிக்கிறது.
- source_word: תִּקְחוּ
  choice: தேர்ந்தெடுங்கள்
  rationale: இரண்டாம் நபர் பன்மைக்கான இவ்வினைச்சொல் இங்கு கட்டளையாக வருகிறது. சொற்பொருளான ‘எடுத்துக்கொள்ளுங்கள்’ தமிழில் இச்சூழலில் செயற்கையாக இருப்பதால், பிரதிநிதிகளை எடுத்துக்கொள்ளும் நிர்வாகச் செயலை ‘தேர்ந்தெடுங்கள்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לִנְחֹל
  choice: உரிமைச்சொத்தாகப் பெறுவதற்காக
  rationale: இவ்வினை வடிவத்தின் நேரடிப் பொருள் நிலத்தைச் சுதந்தரமாக அல்லது உரிமைச்சொத்தாகப் பெறுவது. சூழலில் தலைவர்கள் நிலப் பங்கீட்டில் பங்கேற்பதால், பங்கிட்டுக் கொடுக்கும் பொருளும் தொடர்புடையதாக இருக்கலாம்; அந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הָאָרֶץ
  choice: நிலத்தை
  rationale: இஸ்ரவேலருக்கு உரிமைச்சொத்தாக வழங்கப்படும் குறிப்பிட்ட நாட்டுப் பகுதியை இங்கு குறிக்கிறது; ‘நிலம்’ என்பது தெளிவான, வழக்கமான தமிழ் சொல்.
theological_decisions:
- issue: தலைவர்கள் நிலத்தைத் தாங்களே உரிமைச்சொத்தாகப் பெறுகிறார்களா, அல்லது மக்களுக்கு அதைப் பங்கிட்டுக் கொடுக்கிறார்களா?
  choice: முதன்மை உரையில் ‘உரிமைச்சொத்தாகப் பெறுவதற்காக’
  alternative: ‘நிலத்தை உரிமைப் பங்காகப் பிரித்துக் கொடுப்பதற்காக’
  rationale: לִנְחֹל என்ற மசோரா வடிவம் நேரடியாக ‘உரிமைச்சொத்தாகப் பெற’ என்ற பொருளை ஆதரிக்கிறது. ஆயினும் அருகிலுள்ள சூழல் தலைவர்கள் நிலப் பங்கீட்டில் செயல்படுவதைச் சுட்டுவதால், நிர்வாகப் பங்கீட்டு அர்த்தத்தை அடிக்குறிப்பில் விடப்பட்டுள்ளது; இறையியல் அல்லது நிர்வாகப் பொருளை உரை மீது கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கோத்திரம்’, ‘உரிமைச்சொத்து’ ஆகியவை சாதாரண வாசகருக்குப் புரியக்கூடியவையாகவும் இச்சூழலின் தனித்துவத்தைத் தக்கவைத்தவையாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
