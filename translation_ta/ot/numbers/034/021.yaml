lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தக் கோத்திரப் பிரதிநிதிகளின் பட்டியலில் לְ என்னும் முன்னிடைச்சொல், அந்தந்தக் கோத்திரத்துடன் பிரதிநிதிக்கு உள்ள தொடர்பைக் குறிக்கிறது. தமிழில் ‘கோத்திரத்திலிருந்து’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது; ‘கோத்திரத்துக்காக’ என்பதும் சாத்தியம்.
- source_word: בִנְיָמִן
  choice: பென்யமீன்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֱלִידָד
  choice: எலிதாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: இரு பெயர்களுக்கிடையிலான தந்தை–மகன் உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: כִּסְלֹון
  choice: கிஸ்லோன்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது; தொடக்க மெய்யை ‘கி’ என வழங்குவது மூல ஒலிக்கு நெருக்கமானது.
