  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: ta
  text: “மேற்குப் பக்க எல்லையாகப் பெரிய கடலும் அதன் கரையும் உங்களுக்கு இருக்கும்; இதுவே உங்கள் மேற்கு எல்லை.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நிலப்பகுதியின் வரம்பைக் குறிக்கும் எபிரெயச் சொல்லுக்கு, நவீன தமிழில் இயல்பாகவும் இச்சூழலுக்குப் பொருத்தமாகவும் ‘எல்லை’ அமைகிறது.
- source_word: יָם
  choice: மேற்குப் பக்க
  rationale: גְּבוּל יָם என்பது சொற்படியாக ‘கடல் எல்லை’ என்றாலும், இங்கு கடல் இருக்கும் திசையான மேற்கைக் குறிக்கிறது. ‘மேற்குப் பக்க எல்லை’ என்பது திசை சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַיָּם הַגָּדוֹל
  choice: பெரிய கடல்
  rationale: இது மத்தியதரைக் கடலுக்கான வேதாகமப் புவியியல் பெயர்; எபிரெய வடிவத்தை இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: וְהָיָה לָכֶם
  choice: உங்களுக்கு ... இருக்கும்
  rationale: இஸ்ரவேலருக்குரிய எல்லையாக எது அமையும் என்பதைக் கூறும் ஒதுக்கீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּגְבוּל
  choice: எல்லையாக
  rationale: பெரிய கடல் எல்லையாகச் செயல்படும் என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: இதுவே உங்கள் மேற்கு எல்லையாக இருக்கும்
  rationale: முடிவில் மீண்டும் கூறப்படும் எல்லைச் சூத்திரத்தைத் தெளிவாகவும் மூலத்தின் வலியுறுத்தலைப் பேணியும் தருகிறது.
