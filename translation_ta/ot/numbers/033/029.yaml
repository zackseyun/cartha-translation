  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
