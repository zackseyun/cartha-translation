  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: ta
  text: அவர்கள் மித்காவிலிருந்து புறப்பட்டு, ஹஷ்மோனாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: பயண முகாம்களின் பட்டியலில் נסע என்பது ஒரு முகாமிலிருந்து அடுத்த இடத்துக்குப் புறப்படுவதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்க ‘புறப்பட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִמִּתְקָה
  choice: மித்காவிலிருந்து
  rationale: מִן முன்னொட்டு ‘இலிருந்து’ என வழங்கப்பட்டது; מִתְקָה இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியல் சூழலில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּחַשְׁמֹנָה
  choice: அஷ்மோனாவில்
  rationale: முகாம் அமைந்த இடத்தைக் குறிக்கும் בְּ தமிழில் இடவேற்றுமை உருபான ‘இல்’ மூலம் வழங்கப்பட்டது; חַשְׁמֹנָה இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
