  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: ta
  text: அவர்கள் ஹோர்-ஹக்கித்காத்திலிருந்து புறப்பட்டு, யோத்வாத்தாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது ஒரு முகாம் இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ் நடையில் பயணத் தொடரையும் தெளிவாகக் காட்டுகிறது.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: ஓர்-அக்கித்காத்திலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது. இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இரு கூறுகளின் இணைவு இடைக்கோட்டால் காட்டப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה இத்தகைய பயணப் பட்டியல் சூழலில் தங்கி முகாமிடுவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּיָטְבָתָה
  choice: யொத்பாத்தாவில்
  rationale: בְּ இடத்தைச் சுட்டுகிறது; தமிழின் ‘-இல்’ வேற்றுமைப் பொருள் பெயருடன் இயல்பாக இணைக்கப்பட்டுள்ளது. இடப்பெயர் எபிரெயத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் மொழிபெயர்ப்பு. இடப்பெயர்களில் எபிரெய மூலத்தின் மெய்யொலிகளை இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
