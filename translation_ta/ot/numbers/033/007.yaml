  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மூல எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தில் உள்ள இடவியல் மற்றும் வினைச்சொல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
