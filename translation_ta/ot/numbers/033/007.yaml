  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: ta
  text: அவர்கள் ஏத்தாமிலிருந்து புறப்பட்டு, பாகால்-செபோனுக்கு எதிரே இருந்த பீ-ஹகிரோத்துக்குத் திரும்பி[a], மிக்தோலுக்கு முன்பாக முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திரும்பி’ என்பதற்குப் பதிலாக ‘திரும்பி வந்து’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் முந்தைய இடத்துக்குத் திரும்புவதையோ பயணத் திசையை மாற்றுவதையோ குறிக்கலாம். இங்கு பயணப் பாதையில் ஏற்பட்ட திசைமாற்றமே பெரும்பாலும் கருதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: அவர்கள் ஏத்தாமிலிருந்து புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துப் புறப்படுவதைக் குறிக்கிறது; நவீன தமிழில் ‘புறப்பட்டு’ இயல்பாகவும் தெளிவாகவும் உள்ளது. ஏத்தாம் என்பது இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוב என்பதற்கு ‘திரும்புதல்’ அல்லது ‘திசைமாறிச் செல்லுதல்’ என்ற பொருள் இருக்கலாம். இங்கு முன்பு இருந்த இடத்துக்கே மீண்டும் சென்றார்கள் என்று கட்டாயப்படுத்தாமல், பயணத் திசையை மாற்றியதை ‘திரும்பிச் சென்று’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל פִּי הַחִירֹת
  choice: பீ-அகிரோத்துக்கு
  rationale: இது பயணத்தின் அடுத்த இடத்தைச் சுட்டும் இடப்பெயர்; עַל என்பதைக் சொற்சொல்லாக மொழிபெயர்க்காமல், இலக்கைத் தெரிவிக்கும் தமிழின் நான்காம் வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹן
  choice: பாகால்-செபோனுக்கு எதிரே இருந்த
  rationale: עַל־פְּנֵי இங்கு இடவியல் உறவை, குறிப்பாக எதிர்ப்புறத்தை, குறிக்கிறது. பாகால்-செபோன் பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் concrete travel sense-ஐ நவீன, பொதுவாகப் புரியும் தமிழில் ‘முகாமிட்டார்கள்’ நேரடியாகத் தருகிறது.
- source_word: לִפְנֵי מִגְדֹּל
  choice: மிக்தோலுக்கு முன்பாக
  rationale: לִפְנֵי என்பது ஓர் இடத்துக்கு முன்னால் அல்லது எதிரில் உள்ள நிலையைச் சுட்டுகிறது. ‘முன்பாக’ மூலத்தின் இடவியல் பொதுமையைப் பாதுகாக்கிறது; மிக்தோல் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
