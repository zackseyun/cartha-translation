  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: ta
  text: அவர்கள் ரிம்மோன்-பேரேசிலிருந்து புறப்பட்டு, லிப்னாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயண நிலையங்களின் பட்டியலில் נסע என்பது ஓர் இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தொடர்ச்சியான பயணச் சூத்திரத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: ரிம்மோன்-பேரேசிலிருந்து
  rationale: מִן முன்னிடைச்சொல் ‘இலிருந்து’ என்று தரப்பட்டுள்ளது. இடப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டு, கூட்டுப் பெயரின் இரு கூறுகளும் இணைப்புக்கோட்டுடன் காட்டப்பட்டுள்ளன.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה தங்குவதற்காக முகாம் அமைத்ததைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּלִבְנָה
  choice: லிப்னாவில்
  rationale: இங்கு ב என்பது பயணிகள் தங்கிய இடத்தைக் குறிக்கிறது; தமிழில் ‘-இல்’ வேற்றுமை உருபு இயல்பாக அதைக் காட்டுகிறது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடையில் தரப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் புறப்படுதல்–முகாமிடுதல் வரிசை பாதுகாக்கப்பட்டுள்ளது.
