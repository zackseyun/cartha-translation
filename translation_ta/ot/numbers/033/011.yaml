  text: וַ/יִּסְע֖וּ מִ/יַּם ס֑וּף וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּר סִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: ta
  text: அவர்கள் செங்கடலிலிருந்து[a] புறப்பட்டு, சீன் வனாந்தரத்தில்[b] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாணல் கடலிலிருந்து.” எபிரெயப் பெயரான யாம் சூஃப் மரபாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது; அதன் நேரடியான பொருள் “நாணல் கடல்” என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “சீன்” என்பது ஒரு வனாந்தரப் பகுதியின் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: எண்ணாகமம் 33-இன் பயணப் பட்டியல் சூத்திரத்தில் נסע என்பது ஓர் இடத்திலிருந்து பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; “புறப்பட்டு” என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִיַּם סוּף
  choice: செங்கடலிலிருந்து
  rationale: יָם־סוּף என்பது இங்கு புவியியல் பெயராக வருகிறது. மரபாகவும் பரவலாகவும் அறியப்படும் “செங்கடல்” முதன்மை உரையில் வைக்கப்பட்டுள்ளது; சொல்லுக்குச் சொல் சாத்தியமான “நாணல் கடல்” அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயண இடைவெளியில் தங்கி முகாம் அமைப்பதைக் குறிக்கும் வழக்கமான வினை; “முகாமிட்டார்கள்” தெளிவான நவீனத் தமிழ்.
- source_word: בְּמִדְבַּר סִין
  choice: சீன் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கலாம். סִין இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் “சீன்” என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமப் பயணப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. “வனாந்தரம்” என்ற சொல் புவியியல் பரப்பையும் பெந்தத்தூக்கு வழக்கையும் காக்கிறது; “சீன்” நீண்ட உயிருடன் எழுதப்பட்டதால் அது இடப்பெயர் என்பது வாசகருக்குத் தெளிவாகிறது.
