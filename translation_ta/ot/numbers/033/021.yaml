  text: They set out from Libnah and camped at Rissah.
translation:
  language: ta
  text: அவர்கள் லிப்னாவிலிருந்து புறப்பட்டு, ரிஸ்ஸாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: נסע என்ற வினை வனாந்தரப் பயணப் பட்டியலில் ஓர் முகாமிடத்திலிருந்து அடுத்த பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இதை இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מִלִּבְנָה
  choice: லிப்னாவிலிருந்து
  rationale: מִן முன்னிடைச்சொல் புறப்படும் இடத்தைக் குறிக்கிறது; לִבְנָה என்பது இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியலில் தங்கி முகாம் அமைப்பதைக் குறிக்கும் வழக்கமான வினை. ‘முகாமிட்டார்கள்’ என்பது தற்போதைய தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּרִסָּה
  choice: ரிஸ்ஸாவில்
  rationale: בְּ இங்கு முகாமிட்ட இடத்தைக் குறிக்கிறது; רִסָּה என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, தமிழின் இடவேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
