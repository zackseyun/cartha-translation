  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: ta
  text: ஆசாரியனான ஆரோன், யாவே கட்டளையிட்டபடி ஹோர் மலைக்கு ஏறி, அங்கே இறந்தான். இஸ்ரயேலர் எகிப்து நாட்டிலிருந்து புறப்பட்டதன் நாற்பதாம் ஆண்டில், ஐந்தாம் மாதத்தின் முதல் நாளில் இது நிகழ்ந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறி
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனான
  rationale: ஆரோனின் அலுவலை அடைமொழியாகத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: אֶל הֹר הָהָר
  choice: ஓர் மலையின்மேல்
  rationale: ஹோர் என்னும் இடப்பெயரைத் தமிழில் வழக்கமான வடிவில் தருகிறது; אֶל உடன் வரும் ஏறுதலின் இலக்கையும் வெளிப்படுத்துகிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவே கட்டளையிட்டபடி
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வாயின்படி’ என்ற எபிரேய மரபுத்தொடரின் கட்டளைக்கு இணங்குதல் என்னும் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיָּמָת שָׁם
  choice: அங்கே இறந்தான்
  rationale: வினையையும் இடத்தைக் குறிக்கும் வினையடையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: நாற்பதாம் ஆண்டின்
  rationale: எபிரேய காலக்குறிப்பு முறையை இயல்பான தமிழ் வரிசை எண்ணாக வழங்குகிறது.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலர் ... புறப்பட்ட
  rationale: இங்கு לְצֵאת யாத்திரையை அடிப்படையாகக் கொண்ட காலக்கணக்கைக் குறிக்கிறது; בְּנֵי יִשְׂרָאֵל நாட்டினரைக் குறிப்பதால் ‘இஸ்ரயேலர்’ இயல்பானது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: மூலத்திலுள்ள ‘நாடு’ என்பதையும் வெளியேறும் தொடக்க இடத்தையும் பாதுகாக்கிறது.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: ஐந்தாம் மாதம்
  rationale: நாட்காட்டிக் குறிப்பின் நேரடியான, தெளிவான தமிழ் வடிவம்.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: மாதத்தின் முதல் நாளில்
  rationale: எபிரேய தேதிக் குறிப்பைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: עַל פִּי יְהוָה என்ற மரபுத்தொடர்
  choice: யாவே கட்டளையிட்டபடி
  alternative: 'யாவேயின் வார்த்தையின்படி; சொல்லுக்குச் சொல்: யாவேயின் வாயின்படி'
  rationale: கட்டளைக்குக் கீழ்ப்படிந்து செயல் நடந்தது என்ற சூழல்சார் பொருளைத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. நீண்ட எபிரேய வாக்கியத்தின் காலக்குறிப்பு தனி வாக்கியமாக அமைக்கப்பட்டு வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; தகவல் வரிசையும் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
