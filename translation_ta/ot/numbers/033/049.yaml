  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: ta
  text: அவர்கள் மோவாபின் சமவெளிகளில்[a], யோர்தான் ஆற்றருகே பெத்-யெஷிமோத்திலிருந்து ஆபேல்-ஷித்தீம் வரை முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘மோவாபின் ஸ்டெப்பி நிலப்பகுதிகளில்.’ எபிரெயச் சொல் மோவாபிலுள்ள தட்டையான ஸ்டெப்பி அல்லது சமவெளிப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் தொடர்கதை வடிவம் இஸ்ரவேலரின் பயணத்தில் அடுத்த முகாமிடுதலைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: עַל הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றருகே
  rationale: ஆற்றுடன் வரும் עַל, அதன் மேல் என்று அல்லாமல் அதன் அருகில் அல்லது கரையோரத்தில் என்ற இடப்பொருளைத் தருகிறது. ‘ஆற்றருகே’ முகாமிடும் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: பெத்-யெஷிமோத்திலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு מִן பரப்பின் தொடக்க எல்லையைக் குறிக்கிறது.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: ஆபேல்-ஷித்தீம் வரை
  rationale: עַד புவியியல் பரப்பின் முடிவு எல்லையைக் குறிக்கிறது; ‘வரை’ இதனைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עֲרָבוֹת என்பது மோவாபிலுள்ள தட்டையான, வறண்ட புல்வெளிப் பகுதியைக் குறிக்கிறது. முதன்மை உரையில் ‘சமவெளிகள்’ தெளிவாக உள்ளது; துல்லியமான நிலவியல் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. எபிரெய இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘யோர்தான்’ என்பதுடன் தெளிவுக்காக ‘ஆறு’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சமவெளிகளில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
