  source_fidelity: முதல் பகுதி எபிரெய வினைநிகழ்வையும், யாவேயின் கட்டளையின்படியான பதிவையும், מוֹצָאֵיהֶם—מַסְעֵיהֶם என்ற தொடர்பையும் நன்றாக வெளிப்படுத்துகிறது. ஆனால் இரண்டாம் பகுதியில் உள்ள “அமைந்த” என்பது மூலத்தில் இல்லாத ‘உருவாக்கப்பட்ட/ஒழுங்குபடுத்தப்பட்ட’ என்ற கருத்தைச் சேர்க்கிறது. எபிரெயத்தின் திட்டமிட்ட தலைகீழ் அமைப்பைச் சேர்க்கையின்றிப் பாதுகாக்க வேண்டும்.
  naturalness: திருத்தப்பட்ட வாசகம் நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “புறப்பட்ட இடங்களுக்கு ஏற்ப பயணங்கள்” என்ற சற்றே முறையான இணைப்பு, மூலத்தின் இணை மற்றும் தலைகீழ் அமைப்பைத் தக்கவைக்க ஏற்றது.
  terminology: “யாவே,” “கட்டளையின்படி,” “பயணங்கள்,” மற்றும் “புறப்பட்ட இடங்கள்” ஆகியவை பொருத்தமானவை. מוֹצָאֵיהֶם என்பதற்கான மாற்றுப்பொருளான “புறப்பாடுகள்” அடிக்குறிப்பில் தரப்படுவது நல்லது. யாவேயின் பெயரின் எழுத்துமாற்றம் முழுவதும் ஒரேபோல் உள்ளது.
