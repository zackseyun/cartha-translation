  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: ta
  text: மோசே, யாவேயின் கட்டளையின்படி[a], அவர்களுடைய பயணங்களுக்கு ஏற்ப அவர்களுடைய புறப்பட்ட இடங்களைப் பதிவு செய்தார். அவர்களுடைய புறப்பட்ட இடங்களுக்கு ஏற்ப அவர்களுடைய பயணங்கள் இவையே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “யாவேயின் வாயின்படி”; இது “யாவேயின் கட்டளையின்படி” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'இந்த வசனம் சொற்களின் வரிசையை நோக்கத்துடன் மாற்றுகிறது: “பயணங்களுக்கு ஏற்ப புறப்பட்ட இடங்கள்” … “புறப்பட்ட இடங்களுக்கு ஏற்ப பயணங்கள்.” “புறப்பட்ட இடங்கள்” என்பதை “புறப்பாடுகள்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: பதிவு செய்தார்
  rationale: இறந்தகாலத் தொடர்நிகழ்வைக் குறிக்கும் வினை வடிவத்தையும், பயண விவரங்களை எழுத்தில் பதித்த செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹצָאֵיהֶם
  choice: அவர்களுடைய புறப்பட்ட இடங்கள்
  rationale: מוֹצָא என்பது புறப்படுதல் அல்லது புறப்படும் இடம் எனப் பொருள்படலாம்; பயணப் பட்டியல் சூழலில் இடத்தைக் குறிக்கும் மொழிபெயர்ப்பு தெளிவாக உள்ளது, அதேவேளையில் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַסְעֵיהֶם
  choice: அவர்களுடைய பயணங்களுக்கு ஏற்ப
  rationale: לְ என்ற முன்னொட்டின் தொடர்புறுத்தும் பொருளைப் பாதுகாத்து, புறப்பட்ட இடங்களுக்கும் அடுத்தடுத்த பயணங்களுக்கும் உள்ள உறவைச் சொல்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளையின்படி
  rationale: எழுத்துப்படி ‘யாவேயின் வாயின்படி’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் கட்டளை அல்லது உத்தரவு என்ற பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וְאֵלֶּה מַסְעֵיהֶם לְמוֹצָאֵיהֶם
  choice: அவர்களுடைய புறப்பட்ட இடங்களுக்கு ஏற்ப அமைந்த பயணங்கள் இவையே
  rationale: இரண்டாம் பாதியை இயல்பான தமிழில் அமைத்தாலும், முதல் பாதியிலுள்ள ‘பயணங்கள்—புறப்பட்ட இடங்கள்’ என்ற வரிசையைத் தலைகீழாக மாற்றும் எபிரெய இணை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய வசனத்தின் தலைகீழ் இணை அமைப்பு இயன்றவரை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
