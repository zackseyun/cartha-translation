  text: They set out from Zalmonah and camped at Punon.
translation:
  language: ta
  text: அவர்கள் சல்மோனாவிலிருந்து புறப்பட்டு, பூனோனில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: பயணப் பட்டியல் சூழலில் נסע என்பது முகாமைக் கலைத்துவிட்டுப் பயணத்தைத் தொடரப் புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ் நடையில் அந்தச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִצַּלְמֹנָה
  choice: சல்மோனாவிலிருந்து
  rationale: מִן முன்னொட்டு தொடக்க இடத்தைக் குறிக்கும் ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது; צַלְמֹנָה என்ற இடப்பெயர் பொருள் மொழிபெயர்ப்பு செய்யப்படாமல் ‘சல்மோனா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது இப்பயணப் பட்டியல் சூழலில் ஓர் இடத்தில் முகாமிடுவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது தற்போதைய பொதுத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּפוּנֹן
  choice: பூனோனில்
  rationale: בְּ முன்னொட்டு முகாமிட்ட இடத்தைக் குறிப்பதால் தமிழ் இடவேற்றுமை உருபான ‘இல்’ பயன்படுத்தப்பட்டுள்ளது; פּוּנֹן என்ற இடப்பெயர் ‘பூனோன்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
