  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: ta
  text: அவர்கள் பூனோனிலிருந்து புறப்பட்டு, ஓபோத்தில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியல் சூழலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; நவீன தமிழில் ‘புறப்பட்டு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִפּוּנֹן
  choice: பூனோனிலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה பயணப் பட்டியல் சூழலில் தங்கி முகாம் அமைப்பதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּאֹבֹת
  choice: ஓபோத்தில்
  rationale: בְּ இங்கு முகாமிட்ட இடத்தைக் குறிக்கிறது; இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு இடவேற்றுமை உருபுடன் வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பயணப் பட்டியல் நடையைப் பேணும், நவீனமும் கண்ணியமுமான பொதுத் தமிழ். எபிரெய வினைத் தொடரின் வரிசை இயல்பான தமிழில் வினையெச்சம் மற்றும் முடிவுற்ற வினையாக வழங்கப்பட்டுள்ளது.
