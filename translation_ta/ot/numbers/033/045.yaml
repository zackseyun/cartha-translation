  text: וַ/יִּסְע֖וּ מֵ/עִיִּ֑ים וַֽ/יַּחֲנ֖וּ בְּ/דִיבֹ֥ן גָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: ta
  text: அவர்கள் இய்யீமிலிருந்து புறப்பட்டு, தீபோன்-காதில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: எண்ணாகமத்தின் பயணப் பட்டியல் சூத்திரத்தில் נסע என்பது ஓர் முகாம் இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵעִיִּים
  choice: ஈயீமிலிருந்து
  rationale: מֵ என்ற முன்னொட்டு ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டது. עִיִּים என்பது மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘ஈயீம்’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணக் குறிப்புகளில் חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: בְּדִיבֹן גָּד
  choice: தீபோன்-காத்தில்
  rationale: இடப்பெயருடன் வரும் בְּ தமிழில் ‘இல்’ என இயல்பாக வழங்கப்படுகிறது. דִיבֹן גָּד ஒரு கூட்டு இடப்பெயராகக் கருதப்பட்டு ‘தீபோன்-காத்’ என்று பிரித்துரைக்காமல், இணைப்புக்குறியுடன் எழுத்துப்பெயர்க்கப்பட்டது; ‘காத்’ என்பதுடன் இடவுருபு சேரும்போது இயல்பான ஒலிப்புணர்ச்சியால் ‘காத்தில்’ ஆகிறது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பயணப் பட்டியல் நடையைப் பேணும் வகையில், நவீன நிலையான தமிழில் நேராகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. பொருளை மாற்றாத ஆங்கில எழுத்துப்பெயர்ப்பு வேறுபாடுகள் தனி அடிக்குறிப்பாகச் சேர்க்கப்படவில்லை.
