base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: ta
  text: அவர்கள் எசியோன்-கேபேரிலிருந்து புறப்பட்டு, சீன் வனாந்தரத்தில்—அதாவது காதேசில்[a]—முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதுவே காதேஸ்.” எபிரெய மொழியிலுள்ள சுட்டுப்பெயர் அந்த இடத்தைக் காதேஸ் என்று அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: נסע என்பது பயணப் பட்டியல்களில் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; நவீன தமிழில் ‘புறப்பட்டு’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: எசியோன்-கேபேரிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; מִן முன்னொட்டின் நீங்கல் பொருள் ‘-இலிருந்து’ என்று தரப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணச் சூழலில் தங்கி முகாம் அமைப்பதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בְמִדְבַּר צִן
  choice: சீன் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வனப்பகுதியைக் குறிக்கலாம்; நில அமைப்பை ‘பாலைவனம்’ என்று மிகையாகக் குறிப்பதைத் தவிர்த்து, நிலைபெற்ற வேதாகமப் புவியியல் சொல்லான ‘வனாந்தரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הִוא
  choice: அதாவது
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் இங்கு முன்சொன்ன இடத்தை காதேஸ் என அடையாளப்படுத்தும் விளக்க இணைப்பாகச் செயல்படுகிறது; ‘அதாவது’ அந்தச் செயல்பாட்டை இயல்பாகத் தருகிறது.
- source_word: קָדֵשׁ
  choice: காதேஸ்
  rationale: இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
