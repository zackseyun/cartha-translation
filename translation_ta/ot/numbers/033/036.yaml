translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான பயணப் பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய மூலத்தின் அடையாளப்படுத்தும் அமைப்பிலுள்ள சிறிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
