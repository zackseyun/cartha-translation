base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/018.yaml
  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: ta
  text: அவர்கள் அசேரோத்திலிருந்து புறப்பட்டு, ரித்மாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: பாலைவனப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. நவீனத் தமிழில் “புறப்பட்டு” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵחֲצֵרֹת
  choice: அசேரோத்திலிருந்து
  rationale: מִן முன்னொட்டு “இலிருந்து” என்ற புறப்படும் இடத்தைக் குறிக்கிறது. חֲצֵרֹת என்ற இடப்பெயர் தமிழில் உச்சரிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியலில் தங்கி முகாம் அமைப்பதற்கான வழக்கமான வினை. “முகாமிட்டார்கள்” என்பது தற்போதைய தமிழில் நேரடியாகப் புரியும் இயல்பான வடிவம்.
- source_word: בְּרִתְמָה
  choice: ரித்மாவில்
  rationale: בְּ முன்னொட்டு முகாமிட்ட இடத்தைக் குறிக்கிறது; தமிழில் அதற்கு இடவேற்றுமை உருபான “இல்” பொருத்தமானது. רִתְמָה என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலின் சுருக்கமான நடையைப் பாதுகாக்கும் தெளிவான, கண்ணியமான மொழிநடை. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
