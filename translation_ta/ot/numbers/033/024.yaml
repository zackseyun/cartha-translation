lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது ஓர் முகாமிடத்திலிருந்து அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵהַר
  choice: மலையிலிருந்து
  rationale: מן முன்னொட்டும் הַר என்பதும் சேர்ந்து ‘மலையிலிருந்து’ எனப் பொருள்படும்; அடுத்து இடப்பெயர் வருவதால் தமிழில் இந்த அமைப்பு இயல்பாக உள்ளது.
- source_word: שָׁפֶר
  choice: சேப்பேர்
  rationale: இது இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது ஓர் இடத்தில் முகாமிடுவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ தெளிவான தற்காலத் தமிழ்.
- source_word: בַּחֲרָדָה
  choice: ஆராதாவில்
  rationale: ב முன்னொட்டு இங்கு பயணிகள் தங்கிய இடத்தைக் குறிக்கிறது; חֲרָדָה ஓர் இடப்பெயராக எழுத்துப்பெயர்க்கப்பட்டது.
