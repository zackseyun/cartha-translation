  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: ta
  text: அவர்கள் ரெபிதீமிலிருந்து புறப்பட்டு, சீனாய் வனாந்தரத்தில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: பயணப் பட்டியல்களில் נסע என்பது ஓர் இடத்திலிருந்து அடுத்த பயணக் கட்டத்திற்குப் புறப்படுவதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் இயக்கத்தைத் தெளிவாகவும் தெரிவிக்க ‘புறப்பட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵרְפִידִם
  choice: ரெபிதீமிலிருந்து
  rationale: முன்னொட்டு מ־ புறப்படும் இடத்தைக் குறிக்கிறது; רְפִידִם என்ற இடப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது இத்தகைய வனாந்தரப் பயணச் சூழலில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது நவீனத் தமிழில் இயல்பான, தெளிவான சொல்லாக்கம்.
- source_word: בְּמִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மனிதக் குடியிருப்பு குறைந்த வனாந்தரப் பகுதியைக் குறிக்கிறது; வெறும் மணற்பாலைவனம் என்று மிகையாகக் குறிப்பதைத் தவிர்க்க ‘வனாந்தரம்’ பயன்படுத்தப்பட்டது. எபிரேய இணைப்புத் தொடர் தமிழில் இயல்பாக ‘சீனாய் வனாந்தரம்’ என வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான நடை பயன்படுத்தப்பட்டது. இடப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களான ‘ரெபிதீம்’, ‘சீனாய்’ என வழங்கப்பட்டன.
