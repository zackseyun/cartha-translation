  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: ta
  text: அவர்கள் மகேலோத்திலிருந்து புறப்பட்டு, தகாத்தில் முகாமிட்டனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: נסע என்ற வினை வனாந்தரப் பயணப் பட்டியலில் ஓர் முகாம் இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. நவீன தமிழில் “புறப்பட்டு” இயல்பாகவும் இயக்கத்தின் நுணுக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: מִמַּקְהֵלֹת
  choice: மகேலோத்திலிருந்து
  rationale: מִן முன்னொட்டு “இலிருந்து” என்று மொழிபெயர்க்கப்பட்டுள்ளது; מַקְהֵלֹת இடப்பெயராக இருப்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה இப்பயணப் பட்டியல் சூழலில் அடுத்த இடத்தில் தங்கி முகாம் அமைப்பதைக் குறிக்கிறது. “முகாமிட்டார்கள்” என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּתָחַת
  choice: தாகாத்தில்
  rationale: בְּ முன்னொட்டு முகாம் அமைந்த இடத்தைக் குறிக்கும் தமிழ் இடவேற்றுமை உருபாக “இல்” எனத் தரப்பட்டுள்ளது; תָחַת இங்கு இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பயணப் பட்டியல் நடையைப் பேணியுள்ள நவீன, தெளிவான, கண்ணியமான தமிழ். எபிரேய வாக்கியத்தின் தொடர்ச்சியான இயக்கத்தை “புறப்பட்டு ... முகாமிட்டார்கள்” என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
