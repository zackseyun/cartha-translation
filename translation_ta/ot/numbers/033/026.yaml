    issue: The draft spells Tahath as “தாகாத்.”
    rationale: This gives the first syllable a long ā sound, whereas the Hebrew תָּחַת (Taḥath) has short a. “தகாத்” more closely reflects the name in ordinary Tamil transliteration.
