  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: ta
  text: அவர்கள் ஏலிமிலிருந்து புறப்பட்டுச் செங்கடலருகே[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாணற்கடல்.’ எபிரெயப் பெயரான யாம் சூஃப் மரபாக ‘செங்கடல்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: பாலைவனப் பயண இடப்பட்டியலில் נסע என்பது ஓர் இடத்திலிருந்து அடுத்த இடத்துக்குப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵאֵילִם
  choice: ஏலிமிலிருந்து
  rationale: מִן பிறப்பிடத்தையோ புறப்படும் இடத்தையோ குறிக்கிறது; אֵילִם என்ற இடப்பெயர் ‘ஏலிம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயண இடப்பட்டியலில் தங்குவதற்காக முகாம் அமைத்ததைக் குறிக்கும் வழக்கமான வினை; ‘முகாமிட்டார்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: עַל
  choice: அருகே
  rationale: நீர்நிலையுடன் வரும் இச்சூழலில் עַל அதன் பக்கத்தில் அல்லது கரையருகில் இருப்பதைக் குறிக்கிறது; ‘அருகே’ தேவையற்ற துல்லியத்தைச் சேர்க்காமல் அந்த இடத்தொடர்பை இயல்பாகத் தருகிறது.
- source_word: יַם סוּף
  choice: செங்கடல்
  rationale: יַם סוּף என்பது மரபாக ‘செங்கடல்’ என வழங்கப்படும் புவியியல் பெயர்; סוּף என்பதன் அடிப்படையில் ‘நாணற்கடல்’ என்ற சொல்லாக்கமும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயண இடப்பட்டியலின் சுருக்கமான நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. இடப்பெயரும் கடலின் மரபுப் பெயரும் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வடிவில் வழங்கப்பட்டுள்ளன.
