  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: ta
  text: அவர்கள் தேராகுவிலிருந்து புறப்பட்டு, மித்காவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது ஒரு முகாம் அல்லது தங்குமிடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ் நடையில் பயணத் தொடரையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִתָּרַח
  choice: தேராகிலிருந்து
  rationale: முன்னொட்டு מִן புறப்படும் இடத்தைக் குறிக்கிறது. תָּרַח இங்கு ஓர் இடப்பெயர் என்பதால் ‘தேராகு’ என ஒலிபெயர்க்கப்பட்டு, வேற்றுமை உருபுடன் ‘தேராகிலிருந்து’ என்று தரப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது தங்கி முகாம் அமைப்பதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּמִתְקָה
  choice: மித்காவில்
  rationale: בְּ என்ற முன்னொட்டு இங்கு தங்கிய இடத்தைக் குறிக்கிறது. מִתְקָה என்ற இடப்பெயர் ‘மித்கா’ என ஒலிபெயர்க்கப்பட்டு, இடவேற்றுமையுடன் ‘மித்காவில்’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரேய வடிவத்தை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன.
