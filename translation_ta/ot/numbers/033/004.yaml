  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: ta
  text: எகிப்தியர்கள், யாவே தங்கள் நடுவில் வீழ்த்தியவர்களை—முதற்பேறான எல்லாரையும்—அடக்கம் செய்துகொண்டிருந்தனர்; அவர்களுடைய தெய்வங்கள்மீதும் யாவே தீர்ப்புகளை நிறைவேற்றியிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: எகிப்தியர்கள் ... அடக்கம் செய்துகொண்டிருந்தார்கள்
  rationale: பெயர்ச்சொல்லுடன் வரும் இணைப்புச்சொல்லும் நிகழ்கால வினையெச்சமும், இஸ்ரவேலர் புறப்பட்டபோது பின்னணியில் நடந்துகொண்டிருந்த செயலைக் குறிக்கின்றன; தமிழில் தொடர்நிலை இறந்தகாலம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: யாவே தங்கள் நடுவில் வீழ்த்தியவர்களை
  rationale: נכה என்பதன் ‘அடி/வீழ்த்து’ என்ற படிமத்தை ‘வீழ்த்திய’ என்பது காக்கிறது; சூழலில் அது மரணத்தை விளைவித்த தாக்குதலைக் குறிக்கிறது. בָּהֶם என்பது எகிப்தியர்களின் நடுவில் என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறான அனைவரையும்
  rationale: முந்தைய ‘வீழ்த்தியவர்களை’ என்பதற்கு விளக்கமாக வரும் எபிரெய ஒட்டுச்சொற்றொடரின் அமைப்பை கோடுகளுக்குள் வைத்து தெளிவாகக் காக்கிறது; தேவையில்லாத உடைமைப் பொருள் சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் காணப்படும் இறைத் தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וּבֵאלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள்மீதும்
  rationale: בְּ முன்னிடைச்சொல் இங்கு தீர்ப்பு செலுத்தப்பட்ட இலக்கைச் சுட்டுகிறது. ‘மீதும்’ என்பது மூலத்தின் வடிவத்திற்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: עָשָׂה ... שְׁפָטִים
  choice: தண்டனைத் தீர்ப்புகளை நிறைவேற்றியிருந்தார்
  rationale: ‘தீர்ப்புகளைச் செய்தார்’ என்ற எபிரெய மரபுத்தொடர் நடைமுறையில் தண்டனைத் தீர்ப்புகளைச் செயல்படுத்துவதைக் குறிக்கிறது. முந்தைய நிகழ்வைச் சுட்ட ‘நிறைவேற்றியிருந்தார்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ‘அவர்களுடைய தெய்வங்கள்’ என்பதன் குறிப்பு
  choice: எகிப்தியர்களுடைய தெய்வங்கள் என்றே வைத்தல்
  alternative: சிலைகள் / ஆட்சியாளர்கள்
  rationale: אֱלֹהִים இங்கு எகிப்தின் தெய்வங்களை நேரடியாகக் குறிக்கிறது; அதை மனித ஆட்சியாளர்கள் என்றோ வெறும் சிலைகள் என்றோ விளக்கி மாற்றவில்லை.
- issue: כָּל בְּכוֹר என்பதன் இலக்கணத் தொடர்பு
  choice: ‘வீழ்த்தியவர்கள்’ யார் என்பதை விளக்கும் ஒட்டுச்சொற்றொடராக வைத்தல்
  alternative: ‘அவர்களுடைய முதற்பேறான அனைவரையும்’ என்று உடைமையை வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயில் உடைமைச் சுட்டு இல்லை. ‘முதற்பேறான அனைவரையும்’ என்ற விளக்கம் மூலத்தின் உண்மையான அமைப்பையும் பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம நடையின் கனமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், பின்னணி நிகழ்வுக்கும் யாவேயின் தீர்ப்புக்கும் உள்ள தொடர்பு காக்கப்பட்டுள்ளது.
