  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֛וּ בְּ/עִיֵּ֥י הָעֲבָרִ֖ים בִּ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: ta
  text: அவர்கள் ஓபோத்திலிருந்து புறப்பட்டு, மோவாபின் எல்லையில் உள்ள இயே-அபாரீமில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இய்யே-அபாரீம்”; எபிரெய இடப்பெயரின் கூறுகள் “இடிபாடுகள்” மற்றும் “அபாரீம்/அப்பாலுள்ள பகுதிகள்” என்பவற்றுடன் தொடர்புடையவையாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது; நவீன தமிழில் “புறப்பட்டு” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵאֹבֹת
  choice: ஓபோத்திலிருந்து
  rationale: מֵ முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; אֹבֹת இடப்பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணத்தின்போது தங்கி முகாம் அமைப்பதற்கான வழக்கமான வினை; “முகாமிட்டார்கள்” நவீனத் தமிழில் இயல்பான நேரடி இணை.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: இயே-அபாரீமில்
  rationale: இச்சொற்றொடர் பயணப் பட்டியலில் இடப்பெயராகச் செயல்படுகிறது. அதன் கூறுகள் “இடிபாடுகள்” மற்றும் “அபாரீம்/அப்பாலுள்ள பகுதிகள்” என்பவற்றோடு தொடர்புடையவையாக இருக்கலாம்; ஆனால் அந்தச் சொற்பிறப்பை உரைக்குள் தீர்மானமாக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בִּגְבוּל
  choice: எல்லையில் இருந்த
  rationale: גְּבוּל என்பதற்கு எல்லை, எல்லைப்பகுதி, ஆட்சிப்பரப்பு ஆகிய பொருள்கள் உண்டு. இங்கு “எல்லையில்” என்பது முகாம் மோவாபின் உட்பகுதியில் இருந்ததாக மிகைப்படுத்தாமல் இடத்தொடர்பை நேரடியாகக் காட்டுகிறது; தமிழ் வாக்கியத்தின் இயல்புக்காக “இருந்த” சேர்க்கப்பட்டது.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: மக்கள்/நாட்டுப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
