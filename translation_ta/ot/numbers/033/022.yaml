  register: நவீன நிலையான தமிழில், பயணப் பட்டியலின் சுருக்கமான வாய்பாட்டைத் தக்கவைத்து, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது.
