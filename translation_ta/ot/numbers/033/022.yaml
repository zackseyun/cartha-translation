  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: ta
  text: அவர்கள் ரிஸ்ஸாவிலிருந்து புறப்பட்டு, கெகேலாத்தாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது ஓர் இடத்திலிருந்து அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது. “புறப்பட்டு” என்பது இயல்பான நவீனத் தமிழ்; தொடர்ச்சியான பயண அமைப்பையும் காக்கிறது.
- source_word: מֵרִסָּה
  choice: ரிஸ்ஸாவிலிருந்து
  rationale: מֵ என்ற முன்னொட்டு “இலிருந்து” என்ற பொருளைத் தருகிறது. இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியல் சூழலில் தங்கி முகாம் அமைப்பதைக் குறிக்கிறது. “முகாமிட்டார்கள்” என்பது இன்றைய வாசகர்களுக்கு தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: בִּקְהֵלָתָה
  choice: கெகேலாத்தாவில்
  rationale: בְּ என்ற முன்னொட்டு இங்கு தங்கிய இடத்தைக் குறிக்கிறது; தமிழில் “-இல்” வேற்றுமை உருபு இயல்பாகப் பொருந்துகிறது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
