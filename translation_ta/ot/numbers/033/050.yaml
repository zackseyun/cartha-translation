base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: ta
  text: 'எரிகோவுக்கு அருகே, யோர்தான் நதியோரத்திலுள்ள மோவாபின் சமவெளிகளில்[a] யாவே மோசேயிடம் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் வறண்ட புல்வெளிகளில்.”
    reason: עֲרָבוֹת என்பது சமவெளிகளை மட்டுமல்லாமல் வறண்ட புல்வெளி அல்லது பாலைநிலச் சமவெளி என்ற நுண்பொருளையும் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொருளைப் பேணுகிறது; வாக்கியத்தின் இறுதியிலுள்ள אמר என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: இறைச்சொல் யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עֲרָבוֹת குறிக்கும் திறந்த, தட்டையான பாலைநிலப் பகுதியை வாசிக்க எளிய புவியியல் சொல்லால் தருகிறது; ‘வறண்ட புல்வெளிகள்’ என்ற நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַל יַרְדֵּן
  choice: யோர்தான் நதியோரத்தில்
  rationale: இங்கு עַל என்பது நதியின் மீது என்று அல்லாமல், அதன் அருகில் அல்லது கரையோரத்தில் உள்ள இடத்தைக் குறிக்கிறது.
- source_word: יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே
  rationale: ‘எரிகோவின் யோர்தான்’ என்ற எபிரெய புவியியல் தொடர்பை, எரிகோவுக்கு அருகிலுள்ள யோர்தான் பகுதி எனத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'கூறியதாவது:'
  rationale: அடுத்த வசனத்தில் தொடங்கும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தையும் வசன எல்லையைக் கடந்த அதன் தொடர்ச்சியையும் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பட்ட இறைத் திருப்பெயரே உள்ளது. ஆகவே அதை மாற்றுப் பட்டப்பெயரால் பதிலிடாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசி, கூறியதாவது’ என்பது דבר மற்றும் אמר ஆகிய இரு வேறுபட்ட எபிரெய வினைகளையும் பிரதிபலித்து, அடுத்த வசனத்தின் நேரடிக் கூற்றுக்கான முன்னுரையாகச் செயல்படுகிறது.
