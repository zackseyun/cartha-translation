  text: וַ/יִּסְע֖וּ מִ/מֹּסֵר֑וֹת וַֽ/יַּחֲנ֖וּ בִּ/בְנֵ֥י יַעֲקָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: ta
  text: அவர்கள் மோசேரோத்திலிருந்து புறப்பட்டு, பெனே-யாக்கானில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் பெனே-யாக்கான் என்பதன் நேர்ப்பொருள் ‘யாக்கானின் மகன்கள்’; ஆனால் இங்கு அது ஓர் இடப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ் நடை.
- source_word: מִמֹּסֵרֹות
  choice: மோசேரோத்திலிருந்து
  rationale: מִן என்ற முன்னொட்டு ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டது; மோசேரோத் என்ற இடப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது ஓர் இடத்தில் முகாமிடுவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בִּבְנֵי יַעֲקָן
  choice: பெனே-யாக்கானில்
  rationale: இந்தச் சொற்றொடரின் நேர்ப்பொருள் ‘யாக்கானின் மகன்கள்’ என்றாலும், இங்கு அது முகாமிட்ட இடத்தின் பெயராகச் செயல்படுகிறது. ஆகவே இடப்பெயராக ஒலிபெயர்க்கப்பட்டு, ב முன்னொட்டு ‘இல்’ என வழங்கப்பட்டது.
