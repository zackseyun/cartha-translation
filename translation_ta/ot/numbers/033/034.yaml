  source_fidelity: 'மூல எபிரெய வனாந்தரப் பயணநிலைச் சூத்திரத்தின் இரு தொடர்ச்சிச் செயல்களும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன: யோத்பாத்தாவிலிருந்து புறப்படுதல், அப்ரோனாவில் முகாமிடுதல். முன்னொட்டுகளான מִן (‘இலிருந்து’) மற்றும் בְּ (இடவியல், ‘-இல்’) பொருத்தமாக வெளிப்படுத்தப்பட்டுள்ளன.'
