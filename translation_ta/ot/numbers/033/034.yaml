  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: ta
  text: அவர்கள் யோத்பாத்தாவிலிருந்து புறப்பட்டு, அப்ரோனாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: נסע என்ற வினை வனாந்தரப் பயணநிலையங்களின் பட்டியலில் ஒரு முகாமிலிருந்து புறப்படுவதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் இருப்பதால் ‘புறப்பட்டு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מִיָּטְבָתָה
  choice: யோத்பாத்தாவிலிருந்து
  rationale: מִן முன்னொட்டு ‘இலிருந்து’ என்ற புறப்பாட்டிடப் பொருளைத் தருகிறது. இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘யோத்பாத்தா’ என்று எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது இப்பயணப் பட்டியல் சூழலில் அடுத்த இடத்தில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது தெளிவான நவீனத் தமிழ் வழக்கு.
- source_word: בְּעַבְרֹנָה
  choice: அப்ரோனாவில்
  rationale: בְּ முன்னொட்டு இங்கு இருப்பிடத்தைக் குறிக்கிறது; தமிழில் அது ‘-இல்’ வேற்றுமையால் இயல்பாகத் தரப்படுகிறது. இடப்பெயர் ‘அப்ரோனா’ என்று எழுத்துப்பெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பயணநிலைப் பட்டியல் நடையைப் பேணும், நவீனமும் கண்ணியமுமான பொதுத்தமிழ். மூலத்தில் உள்ள தொடர்ச்சியான இரண்டு செயல்களும் ‘புறப்பட்டு … முகாமிட்டார்கள்’ என்ற இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்கப்பட்டுள்ளன.
