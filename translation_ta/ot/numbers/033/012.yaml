  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: ta
  text: அவர்கள் சீன் வனாந்தரத்திலிருந்து புறப்பட்டு, தோப்காவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் … புறப்பட்டு
  rationale: נסע என்ற வினை பயணப் பட்டியலில் முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது; நவீனத் தமிழில் ‘புறப்பட்டு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִמִּדְבַּר
  choice: வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது குடியிருப்பில்லாத வறண்ட வனப்பகுதியைக் குறிக்கிறது. ஐந்தாகமப் பயணச் சூழலில் ‘வனாந்தரம்’ மரியாதையான, பரவலாகப் புரியும் சொல்; מִן என்ற முன்னொட்டின் பிரிவுப் பொருளை ‘இலிருந்து’ வெளிப்படுத்துகிறது.
- source_word: סִין
  choice: சீன்
  rationale: இது ஒரு பொதுப்பெயர் அல்ல, வனாந்தரப் பகுதியின் இடப்பெயர்; எபிரெய ஒலிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழில் இதை வேறு பொருளுடன் குழப்பும் இயல்பான அபாயம் இல்லை.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கும் பயணப் பட்டியல் வினை. ‘முகாமிட்டார்கள்’ நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּדָפְקָה
  choice: தோப்காவில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; தமிழில் இடப்பெயருடன் ‘-இல்’ வேற்றுமை உருபு இயல்பானது. דָּפְקָה ‘தோப்கா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. ஆங்கிலத்தில் தேவையான ‘Sin’ குறித்த விளக்கக்குறிப்பு தமிழில் குழப்பம் ஏற்படுத்தாததால் சேர்க்கப்படவில்லை.
