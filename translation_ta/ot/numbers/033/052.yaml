base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: ta
  text: அந்த நாட்டில் குடியிருக்கும் அனைவரையும் உங்கள் முன்னிலையிலிருந்து துரத்திவிடுங்கள்; அவர்களுடைய உருவம் பொறிக்கப்பட்ட கற்கள் அனைத்தையும் அழித்துவிடுங்கள்[a]; அவர்களுடைய வார்ப்பிக்கப்பட்ட உலோகச் சிலைகள் அனைத்தையும் அழித்துவிடுங்கள்[b]; அவர்களுடைய உயர்ந்த வழிபாட்டு இடங்கள் அனைத்தையும் இடித்துப்போடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய செதுக்கப்பட்ட உருவங்கள்.’ מַשְׂכִּיּוֹת என்ற எபிரெயச் சொல் உருவம் கொண்ட பிரதிநிதித்துவங்களைக் குறிக்கிறது; அவற்றின் துல்லியமான வடிவமும் மூலப்பொருளும் விவாதத்திற்குரியவை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய உருக்கிய உலோகச் சிலைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: துரத்திவிடுங்கள்
  rationale: ஹிஃபில் வடிவிலுள்ள ירשׁ, இங்கு அந்நாட்டின் குடியிருப்போரை அங்கிருந்து அகற்றுவதைக் குறிக்கிறது. ‘துரத்திவிடுங்கள்’ என்பது கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்த நாட்டில் குடியிருக்கும் அனைவரையும்
  rationale: எபிரெயப் பங்கேற்புவினை அந்நாட்டில் வாழும் மக்களைக் குறிக்கிறது; ‘அனைவரையும்’ என்பது כָּל என்பதையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்களுக்கு முன்பாக
  rationale: எபிரெய மொழியின் ‘உங்கள் முகத்திற்கு முன்பாக இருந்து’ என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; அகற்றப்படுதல் சூழலால் தெளிவாகிறது.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: அழித்துவிடுங்கள்
  rationale: பியேல் வடிவிலுள்ள אבד வழிபாட்டுப் பொருட்களை முற்றிலும் அழிக்கும் கட்டளையைக் குறிக்கிறது. மூலத்தில் வரும் வினைச்சொல் மீளுரைப்பை தமிழிலும் காக்கிறது.
- source_word: מַשְׂכִּיֹּתָם
  choice: அவர்களுடைய உருவம் பொறிக்கப்பட்ட கற்கள்
  rationale: இந்தச் சொல் உருவ அலங்காரம் அல்லது செதுக்கப்பட்ட பிரதிநிதித்துவத்தைக் குறிக்கலாம். பொருள் அல்லது வடிவம் உறுதியல்ல என்றாலும், இங்கு கல் சார்ந்த வழிபாட்டுப் பொருட்கள் என்பது சாத்தியமான குறிப்பான பொருள்.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: அவர்களுடைய வார்ப்பிக்கப்பட்ட உலோகச் சிலைகள்
  rationale: צֶלֶם என்பது உருவம் அல்லது சிலை; מַסֵּכָה என்பது உருக்கிய உலோகத்தை வார்த்து செய்த பொருள். இத்தமிழாக்கம் பொருளையும் தயாரிப்பு முறையையும் தெளிவாக்குகிறது.
- source_word: בָּמֹתָם
  choice: அவர்களுடைய மேடைகள்
  rationale: בָּמוֹת என்பது வழிபாட்டுக்கான உயர்ந்த இடங்கள் அல்லது மேடைகளைக் குறிக்கும் நிலையான சமயச் சொல். ‘மேடைகள்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: תַּשְׁמִידוּ
  choice: இடித்துப்போடுங்கள்
  rationale: ஹிஃபில் வடிவிலுள்ள שׁמד இங்கு இடங்கள் அல்லது கட்டமைப்புகளை முற்றிலும் ஒழிப்பதைக் குறிக்கிறது; ‘இடித்துப்போடுங்கள்’ என்பது மேடைகளுக்குப் பொருத்தமான இயல்பான தமிழ்.
theological_decisions:
- issue: கானானியக் குடியிருப்போரும் அவர்களது வழிபாட்டுப் பொருட்களும் குறித்த கட்டளைகள்
  choice: குடியிருப்போரை அகற்றவும் குறிப்பிட்ட வழிபாட்டுப் பொருட்களையும் இடங்களையும் அழிக்கவும் கூறும் கட்டளைகளை நேரடியாக மொழிபெயர்த்தல்
  alternative: முதல் கட்டளையை நிலவுரிமையை இழக்கச் செய்வதாக மட்டும் மென்மைப்படுத்துதல் அல்லது வழிபாட்டுச் சொற்களைப் பொதுமைப்படுத்துதல்
  rationale: எபிரெய உரை மக்களை அகற்றுவதையும் உருவங்கள், உலோகச் சிலைகள், மேடைகள் ஆகியவற்றை அழிப்பதையும் வெளிப்படையாகக் கட்டளையிடுகிறது. வசனம் தராத நியாயப்படுத்தலைச் சேர்க்காமலும் அதன் கடுமையைத் தணிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினைச்சொல் மீளுரை காக்கப்பட்டுள்ளது; தெளிவில்லாத מַשְׂכִּיּוֹת என்பதற்கு அடிக்குறிப்பில் மாற்று வழங்கப்பட்டுள்ளது.
