  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான உரை. வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர் இயல்பான தமிழாக்கமாக வழங்கப்பட்டுள்ளது; இடப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ‘ஓர் மலை’ வடிவில் உள்ளது.
