  yaml_path: translation/ot/numbers/033/039.yaml
  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: ta
  text: ஆரோன் ஹோர் மலையில் இறந்தபோது, அவருக்கு நூற்று இருபத்து மூன்று வயது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: ஆரோன்
  rationale: வாவ் இணைப்புச்சொல் தொடர்ச்சியான விவரத்தை அறிமுகப்படுத்துகிறது; தனி வசனமாக இயல்பான தமிழில் தேவையற்ற ‘மேலும்’ சேர்க்கப்படவில்லை. אַהֲרֹן என்ற பெயர் வழக்கமான தமிழ் வடிவில் ‘ஆரோன்’ என வழங்கப்படுகிறது.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: அவருக்கு நூற்று இருபத்து மூன்று வயது
  rationale: בן + எண் + שנה என்பது வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் இயல்பாக ‘அவருக்கு ... வயது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּ/מֹת/וֹ
  choice: இறந்தபோது
  rationale: בְּ முன்னொட்டுடன் ‘அவருடைய மரணம்’ என்ற வடிவம் இங்கு காலப்பொருளில் வந்து, ‘அவர் இறந்தபோது’ என்று இயல்பாகப் பொருள்படுகிறது.
- source_word: בְּ/הֹר הָ/הָר
  choice: ஓர் மலையில்
  rationale: הֹר הָהָר என்பது ‘ஓர் மலை’ என்ற இடப்பெயர்; அதை பொதுப்பெயராகப் புரிந்துகொள்ளாமல், தமிழில் பெயரடையாளத்துடன் ‘ஓர் மலை’ என வழங்கப்பட்டுள்ளது. בְּ இங்கு மலையின்மேல் நிகழ்ந்ததைச் சுட்டுகிறது.
