  text: וַ/יִּסְע֖וּ מִ/קְּהֵלָ֑תָה וַֽ/יַּחֲנ֖וּ בְּ/הַר שָֽׁפֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/023.yaml
  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: ta
  text: அவர்கள் கெஹேலாத்தாவிலிருந்து புறப்பட்டு, சாப்பேர் மலையில் முகாமிட்டனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: எண்ணாகமம் 33-இன் பயணப் பட்டியல் சூழலில் נסע என்பது முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான, சுருக்கமான தமிழ் வழக்கு.
- source_word: מִקְּהֵלָתָה
  choice: கெகேலாத்தாவிலிருந்து
  rationale: מִן முன்னொட்டு ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டது; קְהֵלָתָה இடப்பெயராக மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டனர்
  rationale: பாலைநிலப் பயணப் பட்டியலில் חנה என்பது தங்கி முகாம் அமைப்பதைக் குறிக்கிறது; ‘முகாமிட்டனர்’ நவீனத் தமிழில் தெளிவும் இயல்பும் உடையது.
- source_word: בְּהַר
  choice: மலையில்
  rationale: இடப்பெயருக்கு முன் வரும் הַר இங்கு ‘மலை’ எனவும், בְּ இருப்பிடத்தைக் குறிக்கும் ‘இல்’ வேற்றுமையாகவும் வழங்கப்பட்டது.
- source_word: שָׁפֶר
  choice: சாப்பேர்
  rationale: எபிரேய இடப்பெயர் அதன் மெய்-உயிர் அமைப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது; ஆங்கில மரபுவடிவம் தமிழில் கட்டாயப்படுத்தப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘புறப்பட்டு—முகாமிட்டனர்’ அமைப்பு இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
