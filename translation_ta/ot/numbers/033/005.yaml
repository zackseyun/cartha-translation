  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் ராம்சேஸிலிருந்து புறப்பட்டு, சுக்கோத்தில் முகாமிட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்’; மரபுவழியாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரெய மொழியில் நேரடியாக, ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ராம்சேஸ் என்ற இடப்பெயர் சில மொழிபெயர்ப்புகளில் ‘ராமேசேஸ்’ என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: נסע என்ற வினை பயணப் பட்டியலில் முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்’; ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் வடிவம் இங்கு தக்கவைக்கப்படுகிறது.
- source_word: מֵרַעְמְסֵס
  choice: ராம்சேசிலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது. இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாமிடுதலைக் குறிக்கிறது; இந்தச் சொல் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּסֻכֹּת
  choice: சுக்கோத்தில்
  rationale: ב முன்னொட்டு இருப்பிடத்தைக் குறிக்கிறது; பயண நிறுத்தமாகிய இடப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
