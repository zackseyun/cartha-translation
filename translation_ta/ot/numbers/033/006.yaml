  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: ta
  text: அவர்கள் சுக்கோத்திலிருந்து புறப்பட்டு, வனாந்தரத்தின் விளிம்பில் இருந்த ஏத்தாமில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வனாந்தரத்தின் எல்லையில் இருந்த ஏத்தாமில்.”
    reason: בִּקְצֵה என்பதற்கு ‘விளிம்பில்’ என்றும் ‘எல்லையில்’ என்றும் பொருள் கொள்ள முடியும் என்பதைக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: נסע என்பதன் பயணப் பட்டியல் சார்ந்த பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִסֻּכֹּת
  choice: சுக்கோத்திலிருந்து
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது; מִן முன்னொட்டு ‘இலிருந்து’ எனக் காட்டப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் ‘முகாமிடுதல்’ என்ற பொருளை வாசிக்க எளிய நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְאֵתָם
  choice: ஏத்தாமில்
  rationale: இடப்பெயர் எழுத்துப்பெயர்க்கப்பட்டு, בְ முன்னொட்டு தமிழின் இடவேற்றுமை உருபால் தெரிவிக்கப்பட்டது.
- source_word: אֲשֶׁר
  choice: இருந்த
  rationale: ஏத்தாமின் இருப்பிடத்தை விளக்கும் தொடர்புச் சொல்லை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: בִּקְצֵה
  choice: விளிம்பில்
  rationale: קָצֶה குறிக்கும் ஓரம் அல்லது எல்லை என்ற நிலவியல் பொருளை மிகையாகக் குறிப்பாக்காமல் பாதுகாக்கிறது.
- source_word: הַמִּדְבָּר
  choice: வனாந்தரத்தின்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் குடியிருப்பற்ற அல்லது பயிரிடப்படாத நிலத்தையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
