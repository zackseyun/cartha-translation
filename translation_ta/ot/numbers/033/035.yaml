  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான ‘புறப்பட்டு—முகாமிட்டார்கள்’ அமைப்பு இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
