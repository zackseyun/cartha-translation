translation:
  language: ta
  text: அவர்கள் அப்ரோனாவிலிருந்து புறப்பட்டு, எசியோன்-கேபேரில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியல்களில் נסע என்பது ஓர் முகாமிடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் இயக்கத்தின் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: מֵעַבְרֹנָה
  choice: அப்ரோனாவிலிருந்து
  rationale: מֵ என்ற முன்னொட்டு ‘இலிருந்து’ என வழங்கப்பட்டுள்ளது; עַבְרֹנָה இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது தங்கி முகாமிடுவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: எசியோன்-கேபேரில்
  rationale: בְּ என்ற முன்னொட்டு இடத்தைக் குறிப்பதால் தமிழில் ‘இல்’ விகுதியால் தரப்பட்டுள்ளது; עֶצְיוֹן גָּבֶר இடப்பெயராக ஒலிபெயர்க்கப்பட்டு, அதன் கூட்டு அமைப்பைக் காட்ட இணைப்புக்குறி வைக்கப்பட்டுள்ளது.
