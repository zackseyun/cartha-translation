  source_fidelity: 'The itinerary verbs and locations are accurately represented: they departed from the wilderness of Sinai and camped at the named location. The place name should retain the initial /h/ of Hebrew הַתַּאֲוָה (hat-ta''avah), which the draft''s «அத்தாவா» does not represent.'
