  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּ֣ר סִינָ֑י וַֽ/יַּחֲנ֖וּ בְּ/קִבְרֹ֥ת הַֽתַּאֲוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/016.yaml
  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: ta
  text: அவர்கள் சீனாய் வனாந்தரத்திலிருந்து புறப்பட்டு, கிப்ரோத்-ஹத்தாவாவில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிப்ரோத்-ஹத்தாவா” என்பதற்கு “ஆசையின் கல்லறைகள்” என்று பொருள்.
    reason: இடப்பெயரின் எபிரெயச் சொற்பொருளைப் பாதுகாக்கும் விளக்கம்.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: எண்ணாகமம் 33-இன் பயணப் பட்டியல் சூழலில் נסע என்பது ஓர் இடத்திலிருந்து பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִמִּדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளிப்பகுதியைக் குறிக்கிறது. ‘வனாந்தரம்’ இங்கு நிலவியல் பொருளையும் வேதாகமப் பயன்பாட்டின் கண்ணியமான நடையையும் காக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியலில் தங்கி முகாம் அமைப்பதற்கான வழக்கமான வினை; ‘முகாமிட்டார்கள்’ என்பது தெளிவான தற்போதைய தமிழ்.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: கிப்ரோத்-அத்தாவாவில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்படுகிறது. அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட பயணப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கிய ஓட்டத்திற்காக தொடர்வினை அமைப்பு எடுத்துக்கொள்ளப்பட்டது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
