translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மரபுத்தொடரான 'மோசே, ஆரோனின் கையால்' என்பது சொற்சொல்லாக அல்லாமல் அதன் சூழல் பொருளான 'தலைமையில்' என வழங்கப்பட்டது; பயணப் பட்டியலின் தன்மையை 'பயணக் கட்டங்கள்' தெளிவுபடுத்துகிறது.
