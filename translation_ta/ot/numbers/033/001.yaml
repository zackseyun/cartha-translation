revisions:
- from: இஸ்ரவேல் மக்கள் மோசே, ஆரோன் ஆகியோரின் தலைமையில், தங்கள் படைப்பிரிவுகளின்படி எகிப்து நாட்டிலிருந்து புறப்பட்டுச் சென்ற பயணக் கட்டங்கள் இவையே.[a][b]
  to: மோசே, ஆரோன் ஆகியோரின் தலைமையில், தங்கள் அணிகளின்படி எகிப்து நாட்டிலிருந்து புறப்பட்ட இஸ்ரவேல் மக்களின் பயணக் கட்டங்கள் இவையே.[a][b][c][d]
  rationale: The revision preserves every source element while improving Tamil clause attachment and avoiding the overly narrow modern-military implication of “படைப்பிரிவுகள்.” It also supplies footnote anchors for the itinerary term, the literal familial expression, the organized/divisional term, and the Hebrew “by the hand of” idiom.
