  choice: பயணக் கட்டங்கள்
  rationale: பயணத்தின் தொடர்ச்சியான புறப்பாடுகளையும் தங்குமிடக் கட்டங்களையும் குறிக்கும் பட்டியல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு முழுச் சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר יָצְאוּ מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து புறப்பட்டுச் சென்ற
  rationale: יצא என்பதன் வெளியே செல்லுதல்/புறப்படுதல் என்ற இயக்கத்தையும், אֶרֶץ என்ற 'நாடு' என்பதையும் தக்கவைக்கிறது.
- source_word: לְצִבְאֹתָם
  choice: தங்கள் படைப்பிரிவுகளின்படி
  rationale: ஒழுங்குபடுத்தப்பட்ட குழுக்கள் அல்லது படைகள் என்ற இராணுவச் சாயலுள்ள பொருளை மறைக்காமல் தமிழில் தருகிறது.
- source_word: בְּיַד מֹשֶׁה וְאַהֲרֹן
  choice: மோசே, ஆரோன் ஆகியோரின் தலைமையில்
  rationale: '''கையால்'' என்ற எபிரெய மரபுத்தொடர் இங்கு அவர்களின் வழிநடத்தல் அல்லது செயலாண்மையைக் குறிக்கிறது; நவீன தமிழில் பொருளை இயல்பாக வெளிப்படுத்துகிறது.'
