  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: ta
  text: மோசே, ஆரோன் ஆகியோரின் தலைமையில், தங்கள் அணிகளின்படி எகிப்து நாட்டிலிருந்து புறப்பட்ட இஸ்ரவேல் மக்களின் பயணக் கட்டங்கள் இவையே.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயணங்கள்” அல்லது “புறப்பாடுகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரின் பயணப் பட்டியலில் ஒன்றன்பின் ஒன்றாக வரும் கட்டங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்.” “இஸ்ரவேல் பிள்ளைகள்” அல்லது “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “தங்கள் படைகளின்படி” அல்லது “தங்கள் பிரிவுகளின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட, இராணுவச் சாயலுள்ள குழுக்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: d
    text: 'எபிரெய மரபுத்தொடர்: “மோசே மற்றும் ஆரோனின் கையால்”; அதாவது அவர்களுடைய செயலாண்மை அல்லது வழிநடத்தலின்கீழ்.'
    reason: cultural_note
