  yaml_path: translation/ot/numbers/033/032.yaml
  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: ta
  text: அவர்கள் பெனே-யாக்கானிலிருந்து[a] புறப்பட்டு, ஹோர்-ஹக்கித்காதில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெனே-யாக்கான்” என்பது ஓர் இடப்பெயராக இருக்கலாம்; எபிரெயத்தில் இந்த வடிவம் நேரடியாக “யாக்கானின் மகன்கள்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயண இடப்பட்டியலில் נסע என்பது ஓர் இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பயணத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִבְּנֵי יַעֲקָן
  choice: பெனே-யாக்கானிலிருந்து
  rationale: இது இங்கே ஓர் இடப்பெயராகச் செயல்படுகிறது; מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிப்பதால் ‘-இலிருந்து’ என மொழிபெயர்க்கப்பட்டது. எபிரெய வடிவம் எழுத்துப்பெயர்ப்பாக வைக்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயண இடப்பட்டியலில் முகாமிடுவதைக் குறிக்கும் வழக்கமான வினை. ‘முகாமிட்டார்கள்’ தெளிவான, தற்போதைய தமிழ்நடை.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: ஓர்-அக்கித்காதில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் எழுத்துப்பெயர்ப்பு செய்யப்பட்டது. בְּ குறிக்கும் இடப்பொருள் தமிழின் ‘-இல்’ வேற்றுமையால் வெளிப்படுத்தப்பட்டது; הַ கூறு இணைந்த உச்சரிப்பான ‘அ’ வடிவில் பெயருக்குள் தக்கவைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயண இடப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. இடப்பெயர்கள் எபிரெய மூலத்துக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன; அடிக்குறிப்பு குறி தொடர்புடைய இடப்பெயரான ‘பெனே-யாக்கான்’ அருகில் வைக்கப்பட வேண்டும் என்பதால் பிரதான உரையில் அதன் பின் அமைக்கப்பட்டது.
