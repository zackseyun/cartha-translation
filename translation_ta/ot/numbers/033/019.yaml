lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது. நவீன தமிழில் ‘புறப்பட்டு’ என்பது இயல்பாகவும் சுருக்கமாகவும் இந்தப் பொருளைத் தருகிறது.
- source_word: מֵרִתְמָה
  choice: ரித்மாவிலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; ஆகவே ‘-விலிருந்து’ என மொழிபெயர்க்கப்பட்டது. இடப்பெயர் பொருள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியல்களில் தங்கி முகாம் அமைப்பதற்கான வழக்கமான வினை. ‘முகாமிட்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: ரிம்மோன்-பேரேசில்
  rationale: בְּ இங்கு தங்கிய இடத்தைக் குறிக்கிறது; தமிழில் ‘-இல்’ அதனை இயல்பாக வெளிப்படுத்துகிறது. இரு கூறுகளைக் கொண்ட இடப்பெயர் ஒலிபெயர்க்கப்பட்டு இடைக்கோட்டுடன் தரப்பட்டுள்ளது.
