translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சுதந்தரம்’ என்ற சொல்லின் குடும்பச் சொத்துப் பொருளால் ஏற்படக்கூடிய குறுகலைத் தவிர்த்து, உடன்படிக்கை நிலத்தின் பரம்பரை உரிமையும் பங்கீடும் வெளிப்பட ‘உரிமைப் பங்கு’ பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் வடிவங்கள் தமிழில் இயல்பாக ‘ஒருவன்/அவன்’ எனக் காக்கப்பட்டுள்ளன; சூழலில் அவை குல அல்லது கோத்திரப் பங்கீட்டின் பிரதிநிதித்துவ மொழியாகச் செயல்படுகின்றன.
