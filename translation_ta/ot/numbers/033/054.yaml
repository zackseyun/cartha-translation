source:
  edition: WLC
  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: ta
  text: நீங்கள் அந்த நாட்டை உங்கள் குலங்களின்படி சீட்டுப்போட்டு உரிமைப் பங்காகப் பகிர்ந்துகொள்ள வேண்டும். எண்ணிக்கையில் பெரிய குழுவுக்கு அதன் உரிமைப் பங்கைப் பெரிதாக்க வேண்டும்; எண்ணிக்கையில் சிறிய குழுவுக்கு அதன் உரிமைப் பங்கைக் குறைக்க வேண்டும். எவருக்கு எந்த இடத்திற்கான சீட்டு விழுகிறதோ, அந்த இடமே அவருக்கு உரியதாகும்.[a] உங்கள் தந்தைவழிக் கோத்திரங்களின்படி நீங்கள் உரிமைப் பங்கைப் பெற்றுக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: “எந்த இடத்துக்கு ஒருவருக்குச் சீட்டு விழுகிறதோ, அங்கேயே அது அவருக்கு உரியதாகும்.”'
    reason: எபிரெயத்தின் இடநோக்குச் சொல்லாட்சியையும் ‘சீட்டு வெளிவருதல்’ என்ற உருவகத்தையும், தெளிவான இயல்பான தமிழில் காட்டும் மாற்று.
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: உரிமைப் பங்காகப் பகிர்ந்துகொள்ள வேண்டும்
  rationale: התנחל என்பதன் தன்னிலை/பங்கீட்டுப் பொருளையும், நிலத்தைச் சுதந்தர உரிமையாகப் பெறும் சூழலையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு இஸ்ரவேலருக்கு வழங்கப்படவுள்ள குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது; நவீன தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּגוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: גורל என்பது பங்கீட்டைத் தீர்மானிக்கும் சீட்டைக் குறிக்கிறது; ‘சீட்டுப்போட்டு’ என்பது பொதுவாகப் புரியும் துல்லியமான நடை.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: உங்கள் குலங்களின்படி
  rationale: משפחה இச்சூழலில் தனிக்குடும்பத்தைவிடப் பெரிய கோத்திர உட்பிரிவைக் குறிக்கும்; ‘குலம்’ அதற்கேற்றது.
- source_word: לָרַב ... וְלַמְעַט
  choice: எண்ணிக்கையில் பெரிய குழுவுக்கு ... எண்ணிக்கையில் சிறிய குழுவுக்கு
  rationale: இவை மக்கள் எண்ணிக்கையை ஒப்பிடும் சொற்கள் என்பதைத் தெளிவாக்குகிறது; நிலப்பரப்பின் அளவைத் தவறாகக் குறிப்பதாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: נַחֲלָתוֹ
  choice: அதன் உரிமைப் பங்கு
  rationale: נחלה என்பதில் சுதந்தரமாகக் கிடைக்கும் உரிமையும் ஒதுக்கப்பட்ட நிலப்பங்கும் இணைந்துள்ளன; ‘உரிமைப் பங்கு’ இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: ஒருவனுக்கு எந்த இடத்திற்கான சீட்டு விழுகிறதோ
  rationale: எபிரெயச் சொல்லாட்சியிலுள்ள இடநோக்கையும் சீட்டு முடிவையும் தெளிவான தமிழில் காக்கிறது.
- source_word: לוֹ יִהְיֶה
  choice: அந்த இடமே அவனுக்கு உரியதாகும்
  rationale: சீட்டால் குறிக்கப்பட்ட இடம் அந்த நபர் அல்லது குழுவின் உரிமையாகும் என்ற விளைவைத் தெளிவாகக் கூறுகிறது.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: உங்கள் தந்தைவழிக் கோத்திரங்களின்படி
  rationale: מטות என்பதற்கு ‘கோத்திரங்கள்’ என்றும் אבתיכם குறிக்கும் வம்ச ஒழுங்கிற்கு ‘தந்தைவழி’ என்றும் மொழிபெயர்த்து மூலத்தின் சமூக அமைப்பைக் காக்கிறது.
- source_word: תִּתְנֶחָלוּ
  choice: உரிமைப் பங்கைப் பெற்றுக்கொள்ள வேண்டும்
  rationale: நிலத்தைச் சுதந்தர உரிமையாகப் பெறுதல் என்ற பொருளைக் காக்கிறது; தொடக்க வினையுடன் உள்ள தொடர்பையும் காட்டுகிறது.
