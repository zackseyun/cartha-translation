source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/דִּיבֹ֣ן גָּ֑ד וַֽ/יַּחֲנ֖וּ בְּ/עַלְמֹ֥ן דִּבְלָתָֽיְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: ta
  text: அவர்கள் தீபோன்-காதிலிருந்து புறப்பட்டு, அல்மோன்-திப்லாத்தாயீமில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: எண்ணாகமம் 33-இன் பயணப்பட்டியல் சூழலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִדִּיבֹן גָּד
  choice: தீபோன்-காத்திலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழ் ஒலிப்பெயர்ப்பில் தரப்பட்டுள்ளது; מִן முன்னொட்டு ‘-இலிருந்து’ என வழங்கப்பட்டுள்ளது. கூட்டு இடப்பெயர் இணைப்புக்கோட்டுடன் காட்டப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்ற வினை இப்பயணச் சூத்திரத்தில் ஒரு இடத்தில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: அல்மோன்-திப்லாத்தாயிமில்
  rationale: இடப்பெயர் தமிழ் ஒலிப்பெயர்ப்பில் தரப்பட்டுள்ளது; בְּ முன்னொட்டு இருப்பிடத்தைக் குறிக்கும் ‘-இல்’ வேற்றுமை உருபால் மொழிபெயர்க்கப்பட்டுள்ளது. இறுதியிலுள்ள திசைநோக்கி -ה, חנה வினையுடன் வரும் இடத்தைக் குறிப்பதால் தமிழில் இயல்பாக இருப்பிட வேற்றுமையால் வழங்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பயணப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிப்பெயர்க்கப்பட்டுள்ளன.
