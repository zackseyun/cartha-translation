  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ta
  text: அவர்கள் அபாரீம் மலைகளிலிருந்து புறப்பட்டு, எரிகோவுக்கு அருகே யோர்தான் ஆற்றங்கரையிலுள்ள மோவாபின் சமவெளிகளில்[a][b] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மோவாபின் பாலைநிலச் சமவெளிகளில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சமவெளி அல்லது ஸ்டெப்பி போன்ற திறந்த, வறண்ட நிலப்பரப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடரை, ‘எரிகோவுக்கு எதிரே யோர்தான் ஆற்றங்கரையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: பயணத் தங்குமிடப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: அபாரீம் மலைகளிலிருந்து
  rationale: הָרֵי என்ற பன்மை வடிவை ‘மலைகள்’ என்றும், עֲבָרִים என்ற இடப்பெயரை ‘அபாரீம்’ என்றும் நேரடியாகக் கொடுக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது இப்பயணச் சூழலில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ துல்லியமும் நடப்புத் தமிழ் இயல்பும் கொண்டது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עַרְבֹת என்பது திறந்த சமநிலம் அல்லது புல்வெளி போன்ற நிலப்பரப்பைக் குறிக்கலாம்; ‘சமவெளிகள்’ பொதுவாசகருக்கு தெளிவான முதன்மைத் தேர்வு.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே யோர்தான் ஆற்றங்கரையிலுள்ள
  rationale: עַל என்பது ஆற்றின் அருகாமையைச் சுட்டுகிறது; יְרֵחוֹ அந்தப் பகுதியை எரிகோவுடன் தொடர்புபடுத்துகிறது. எபிரெயத்தில் ‘எதிரே’ என்பதற்கான தனிச்சொல் இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
