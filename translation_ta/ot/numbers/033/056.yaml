  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: ta
  text: அப்போது, அவர்களுக்குச் செய்ய நான் எண்ணியதை[a] உங்களுக்குச் செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குச் செய்ய நான் திட்டமிட்டதை”
    reason: דִּמִּיתִי என்ற வினை இச்சூழலில் ‘எண்ணினேன்’ அல்லது ‘திட்டமிட்டேன்’ என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וְהָיָה
  choice: அப்போது
  rationale: முந்தைய எச்சரிக்கையின் விளைவாக அடுத்து நிகழப்போவதை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: …எண்ணியதை
  rationale: இங்கு அடுத்துள்ள செயலை ஒப்புமையாகவோ உள்ளடக்கத் தொடர்பாகவோ இணைக்கிறது; தமிழ் வாக்கிய அமைப்பில் ‘எண்ணியதை’ என்பது அந்தத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: דִּמִּיתִי
  choice: நான் எண்ணியதை
  rationale: பீயேல் வடிவம் இச்சூழலில் வெறும் சிந்தனையை அல்ல, செய்ய உத்தேசித்ததைச் சுட்டுகிறது. ‘எண்ணியதை’ நோக்கத்தைத் தெரிவிக்கிறது; அதேவேளை மூலத்தில் இல்லாத கூடுதல் உறுதியைச் சேர்க்காது.
- source_word: לַעֲשׂוֹת
  choice: செய்ய
  rationale: עשה என்ற பொதுவான வினையின் அகன்ற பொருளையும் எளிமையையும் காக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெய முன்னிடைச்சொல்லின் மறைமுகச் செயப்படுபொருள் உறவைப் பாதுகாக்கிறது; தண்டனை சார்ந்த வலிமையைச் சூழலே அளிக்கிறது.
- source_word: אֶעֱשֶׂה
  choice: செய்வேன்
  rationale: முந்தைய ‘செய்ய’ என்பதுடன் சொல் ஒற்றுமையையும் எச்சரிக்கையின் நேரடியான எதிர்கால வலிமையையும் காக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: ‘அவர்களுக்கு—உங்களுக்கு’ என்ற மூலத்தின் கூர்மையான இணை அமைப்பைப் பாதுகாக்கிறது; ‘உங்களுக்கு எதிராக’ என்று வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: எச்சரிக்கையின் வலிமை
  choice: அவர்களுக்குச் செய்ய இறைவன் எண்ணியதையே இஸ்ரவேலருக்குச் செய்வார் என்ற நேரடியான தெய்வீக எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: தெய்வீக நோக்கத்தை வலியுறுத்தாமல், இது ஒரு பொதுவான விளைவு மட்டுமே என மென்மைப்படுத்துதல்.
  rationale: வசனம் முந்தைய எச்சரிப்பைத் தண்டனை குறித்த ஆணித்தரமான முடிவுடன் நிறைவு செய்கிறது; ஆனால் அந்தத் தண்டனையின் விவரங்களை இந்த வசனத்தில் இல்லாதபடி சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேரடியான எச்சரிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களுக்கு—உங்களுக்கு’ மற்றும் ‘செய்ய—செய்வேன்’ என்ற மூலமொழியின் இணை அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
