translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பயணப் பட்டியலின் தொடர்ச்சி தெளிவாக இருக்கச் செயற்பாடுகள் இயல்பாக இணைக்கப்பட்டுள்ளன. ‘வனாந்தரம்’ வேதாகமப் பயன்பாட்டில் பரிச்சயமானதாயிருந்தும் பொதுவாகப் புரியக்கூடியதாயிருந்தும் இருப்பதால் தக்கவைக்கப்பட்டது. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
