base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: ta
  text: அவர்கள் ஹகீரோத்தின் முன்னிலையிலிருந்து[a] புறப்பட்டு, கடலின் நடுவே கடந்து வனாந்தரத்திற்குள் சென்றார்கள்; பின்பு ஏத்தாம் வனாந்தரத்தில் மூன்று நாள் பயணத் தூரம் சென்று, மாராவில் முகாமிட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: ‘ஹகீரோத்தின் முன்னிலையிலிருந்து.’ யாத்திராகமத்தில் இவ்விடம் பொதுவாக ‘பீ-ஹகீரோத்’ என்று அழைக்கப்படுகிறது. ஆனால் எண்ணாகமம் 33:8-இல் ‘பீ-’ என்னும் பகுதி இல்லாததால், மற்ற வசனங்களுடன் ஒத்திசைக்காமல் இங்குள்ள குறுகிய பெயரே வைக்கப்பட்டுள்ளது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஏத்தாம் வனாந்தரத்தில் மூன்று நாட்கள் பயணம் செய்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: பயண முகாம் பட்டியல்களில் נסע என்பது முகாமைக் கலைத்துப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִפְּנֵי הַחִירֹת
  choice: ஹகீரோத்தின் முன்னிலையிலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் ‘முன்னிலையிலிருந்து’ என்ற இடவியல் பொருளையும், இவ்வசனத்தில் உள்ள குறுகிய இடப்பெயரான ஹகீரோத் என்பதையும் ஒத்திசைக்காமல் பாதுகாக்கிறது.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: கடலின் நடுவே கடந்து
  rationale: עבר என்பது கடப்பதையும், בתוך என்பது நடுவே/மத்தியில் என்பதையும் வெளிப்படையாகக் குறிக்கின்றன.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்திற்குள் சென்றார்கள்
  rationale: சொல்லின் இறுதியில் உள்ள திசைகாட்டும் -ה, வனாந்தரத்தை நோக்கிய அல்லது அதற்குள் செல்லும் இயக்கத்தைக் காட்டுகிறது; சூழலில் ‘உள்ளே’ என்பது இயல்பாகப் பொருந்துகிறது.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணத் தொலைவு சென்று
  rationale: இச்சொற்றொடர் மூன்று நாட்கள் எடுக்கும் பயணத்தையோ அதன் தொலைவையோ குறிக்கலாம்; தமிழ் வடிவம் பயணத் தொலைவு என்ற எபிரெய மரபுத்தொடரின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: בְּמִדְבַּר אֵתָם
  choice: ஏத்தாம் வனாந்தரத்தில்
  rationale: இணைப்புக் கட்டமைப்பை இயல்பான தமிழில் இடப்பெயர் முன்வரும் வடிவில் தருகிறது.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: மாராவில் முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியல் சூழலில் முகாமிடுவதைக் குறிக்கிறது; பெயரிடப்பட்ட தங்குமிடத்துக்கு ‘மாராவில்’ இயல்பானது.
