  register: நவீன நிலையான தமிழில், பயணப் பட்டியலின் சுருக்கத்தையும் கண்ணியமான வேதாகம நடையையும் காத்த மொழிபெயர்ப்பு. இடப்பெயர்கள் மூல எபிரெய வடிவிலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
