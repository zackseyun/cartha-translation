translation:
  language: ta
  text: அவர்கள் தோப்காவிலிருந்து புறப்பட்டு, ஆலூஷில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது ஓர் முகாமிடத்திலிருந்து அடுத்த கட்டப் பயணத்திற்குப் புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִדָּפְקָה
  choice: தாப்காவிலிருந்து
  rationale: முன்னொட்டு מִן புறப்படும் இடத்தை (‘இலிருந்து’) குறிக்கிறது. דָּפְקָה என்ற இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது இப்பயணப் பட்டியல் சூழலில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ தெளிவான, தற்போதைய தமிழ்ச் சொல்வழக்கு.
- source_word: בְּאָלוּשׁ
  choice: ஆலூசில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; தமிழில் இடப்பெயருடன் ‘-இல்’ இணைப்பது இயல்பானது. אָלוּשׁ என்ற பெயர் எபிரெய வடிவை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளது.
