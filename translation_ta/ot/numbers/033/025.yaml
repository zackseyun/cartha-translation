lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியல் சூழலில் נסע என்பது ஒரு முகாமிடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்த நகர்வு நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: מֵחֲרָדָה
  choice: ஆராதாவிலிருந்து
  rationale: முன்னொட்டு מֵ மூல இடத்திலிருந்து பிரிந்து செல்வதைக் குறிக்கிறது; ஆகவே ‘-விலிருந்து’ என மொழிபெயர்க்கப்பட்டது. חֲרָדָה என்பது இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது முகாமிடுதல் அல்லது தங்குவதற்காக முகாம் அமைத்தல் என்று பொருள். ‘முகாமிட்டார்கள்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּמַקְהֵלֹת
  choice: மகேலோத்தில்
  rationale: பயணக் குறிப்பில் בְ முகாமிட்ட இடத்தைக் குறிக்கிறது; தமிழில் இடவேற்றுமை ‘-இல்’ இயல்பானது. מַקְהֵלֹת இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
