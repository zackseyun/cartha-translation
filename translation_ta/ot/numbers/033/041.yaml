  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: ta
  text: அவர்கள் ஓர் என்னும் மலையிலிருந்து புறப்பட்டு, சல்மோனாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: பயணத் தங்குமிடங்களின் பட்டியலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்திற்குப் புறப்படுவதைக் குறிக்கிறது. நவீன தமிழில் “புறப்பட்டு” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵהֹר הָהָר
  choice: ஓர் மலையிலிருந்து
  rationale: הֹר הָהָר என்பது நிறுவப்பட்ட இடப்பெயரான “Mount Hor.” தமிழில் மலையின் பெயரை முன்வைத்து “ஓர் மலை” என்று வழங்குவது இயல்பான இடப்பெயர் வடிவமாகும்.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה இங்கு பயணத்தின் அடுத்த தங்குமிடத்தில் முகாம் அமைத்துத் தங்கியதைக் குறிக்கிறது. “முகாமிட்டார்கள்” என்பது தற்போதைய பொதுத் தமிழில் நேரடியும் இயல்புமான சொல்லாக்கம்.
- source_word: בְּצַלְמֹנָה
  choice: சல்மோனாவில்
  rationale: இடப்பெயருடன் வரும் בְּ இங்கு இருப்பிடப் பொருளுடையது. தமிழின் இடவேற்றுமை உருபான “-இல்” இணைந்த “சல்மோனாவில்” அந்தப் பொருளை இயல்பாகத் தருகிறது.
