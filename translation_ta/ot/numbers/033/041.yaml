translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான எளிமையையும் காக்கும் மொழிநடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான ‘புறப்பட்டு—முகாமிட்டார்கள்’ அமைப்பு இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
