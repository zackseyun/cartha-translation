    text: அல்லது, “அதை மரபுரிமையாகப் பெறுவதற்காக.” எபிரெய வினைச்சொல் ירשׁ, குறிப்பாக உடன்படிக்கை நில வாக்குத்தத்தங்களின் சூழல்களில், உடைமையாக்கிக்கொள்வதையும் மரபுரிமையாகப் பெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
