  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: ta
  text: நீங்கள் அந்த நிலத்தைக் கைப்பற்றி, அதில் குடியிருங்கள். ஏனெனில், அதை உடைமையாக்கிக்கொள்ளும்படி அந்த நிலத்தை உங்களுக்குக் கொடுத்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை மரபுரிமையாகப் பெறுவதற்காக.” எபிரெய வினைச்சொல் ירשׁ, குறிப்பாக உடன்படிக்கை நில வாக்குத்தத்தங்களின் சூழல்களில், உடைமையாக்கிக்கொள்வதையும் மரபுரிமையாகப் பெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: நீங்கள் அந்த நாட்டைக் கைப்பற்றி
  rationale: ירשׁ என்பதன் ஹிஃபீல் வடிவம் பிறரை அகற்றி உடைமையாக்கும் கருத்தையும், அதன் விளைவாக நாட்டைக் கைப்பற்றும் கருத்தையும் தரலாம். இங்கு நேரடிச் செயப்படுபொருள் குடிகள் அல்ல, ‘நாடு’ என்பதால், நாட்டையே வெளியேற்றுவது போன்ற பொருத்தமற்ற அர்த்தத்தைத் தவிர்த்து, உடைமையாக்கும் விளைவை ‘கைப்பற்றி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு אֶרֶץ வாக்குத்தத்தம் செய்யப்பட்ட குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது. நவீனத் தமிழில் ‘அந்த நாடு’ சூழலுக்கும் உரையின் மரியாதையான நடைக்கும் ஏற்றது.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: அதில் குடியிருங்கள்
  rationale: ישׁב இங்கு நிலையாக வாழ்வதையும் குடியேறி இருப்பதையும் குறிக்கிறது. ‘குடியிருங்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவானதும் கட்டளையின் வலிமையைப் பாதுகாப்பதும் ஆகும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: לָכֶם נָתַתִּי
  choice: உங்களுக்குக் கொடுத்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்டும் இப்போதும் பொருந்தும் இறைச்செயலை எபிரெய நிறைவு வினை காட்டுகிறது; தமிழ் நிகழ்கால நிறைவு வடிவம் அந்த வலிமையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: அதை நீங்கள் உரிமையாக்கிக்கொள்வதற்காக
  rationale: இறைவன் நாட்டைக் கொடுத்ததன் நோக்கத்தை இந்த இறுவாய் அமைப்பு தெரிவிக்கிறது. ‘உரிமையாக்கிக்கொள்வது’ உடைமையாக்கும் பொருளைத் தெளிவாகக் காட்டுகிறது; மரபுரிமைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வாக்குத்தத்த நாட்டின் சூழலில் ירשׁ என்பதன் பொருள்
  choice: கைப்பற்றி / உரிமையாக்கிக்கொள்ள
  alternative: மரபுரிமையாகப் பெற
  rationale: உடனடிச் சூழல் நாட்டின் குடிகளை அகற்றி, நாட்டை உண்மையில் பிடித்து அதில் குடியிருப்பதை வலியுறுத்துகிறது. அதனால் உடைமையாக்கும் கருத்து முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; உடன்படிக்கை வாக்குத்தத்தச் சூழலில் உள்ள மரபுரிமைப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வசிக்க’ என்பதற்குப் பதிலாக நிலையான குடியிருப்பை உணர்த்தும் ‘குடியிருங்கள்’ தேர்ந்தெடுக்கப்பட்டது; தேவையற்ற பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
