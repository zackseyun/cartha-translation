translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] பேசி, அவர்களிடம் சொல்: ‘நீங்கள் யோர்தானைக் கடந்து கானான் நாட்டிற்குள் செல்லும்போது[b],’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்களிடம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் யோர்தானைக் கடந்து கானான் நாட்டிற்குள் சென்றுகொண்டிருக்கிறீர்கள்” / “செல்லவிருக்கிறீர்கள்.” எபிரேயப் பங்கேற்புவினை விரைவில் நிகழவிருக்கும் கடந்துசெல்லுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: பியேல் கட்டளை வடிவின் நேரடியான தொடர்புக் கட்டளையைத் தருகிறது; தொடர்ந்து வரும் ‘சொல்’ என்பதுடன் எபிரேயத்தின் இரு வினைகளையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: אמר வினையையும் அதன் மறைமுகச் செயப்படுபொருளையும் தெளிவாகக் காட்டி, முந்தைய ‘பேசி’ என்பதுடன் ஒன்றாக்காமல் வைத்திருக்கிறது.
- source_word: כִּי
  choice: செல்லும்போது
  rationale: இங்கு அடுத்து வரும் அறிவுறுத்தலுக்கான காலச் சூழலை அறிமுகப்படுத்துகிறது; எபிரேயப் பங்கேற்புவினையின் அண்மையான எதிர்காலப் பொருளுடன் இயல்பாகப் பொருந்துகிறது.
- source_word: אַתֶּם עֹבְרִים
  choice: நீங்கள் ... கடந்து ... செல்லும்போது
  rationale: தனிப்பெயர் மற்றும் பங்கேற்புவினை குறிக்கும் நெருங்கிய அல்லது எதிர்நோக்கிய கடத்தலைத் தமிழில் இயல்பான காலத் தொடராக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக்
  rationale: ஆற்றைக் குறிக்கும் வழக்கமான வேதாகமப் பெயர்; சூழலில் ‘ஆறு’ என்பதைச் சேர்க்கத் தேவையில்லை.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிற்குள்
  rationale: אֶל என்பதின் நுழைவு நோக்கையும் אֶרֶץ என்பதையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
