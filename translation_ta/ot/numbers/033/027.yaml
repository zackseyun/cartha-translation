  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: ta
  text: அவர்கள் தாகாத்திலிருந்து புறப்பட்டு, தேராகில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலின் சூழலில் נסע என்பது முகாமைக் கலைத்துவிட்டு அடுத்த இடத்துக்குப் புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִתָּחַת
  choice: தாகாத்திலிருந்து
  rationale: מִן முன்னிடைச்சொல் ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டது; תָּחַת என்ற இடப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘தாகாத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது தெளிவான, தற்போதைய தமிழ் வழக்கு.
- source_word: בְּתָרַח
  choice: தேராகில்
  rationale: முகாம் அமைந்த இடத்தைக் குறிக்கும் בְּ தமிழில் ‘இல்’ என இயல்பாகக் கொடுக்கப்பட்டது; תָּרַח என்ற இடப்பெயர் ‘தேராக்’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
