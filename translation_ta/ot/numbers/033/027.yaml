  register: சுருக்கமான பயணப் பட்டியல் நடையைப் பேணி, சாதாரண வாசகர்களுக்குப் புரியும் நவீன, கண்ணியமான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
