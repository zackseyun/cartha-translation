  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: ta
  text: அவர்கள் மாராவிலிருந்து புறப்பட்டு ஏலிமுக்கு வந்தார்கள். ஏலிமில் பன்னிரண்டு நீரூற்றுகளும் எழுபது பேரீச்ச மரங்களும் இருந்தன; அவர்கள் அங்கே முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ מִמָּרָה
  choice: அவர்கள் மாராவிலிருந்து புறப்பட்டு
  rationale: נסע பயணப் பட்டியல் சூழலில் முகாமைக் கலைத்துப் புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்; மாரா என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּבֹאוּ אֵילִמָה
  choice: ஏலிமுக்கு வந்தார்கள்
  rationale: בוא என்பதன் பொதுவான ‘வருதல்/சென்றடைதல்’ பொருளை ‘வந்தார்கள்’ நேரடியாகவும் இயல்பாகவும் தருகிறது; திசையைக் குறிக்கும் வடிவம் ‘-க்கு’ எனக் காட்டப்பட்டுள்ளது.
- source_word: וּבְאֵילִם
  choice: ஏலிமில்
  rationale: בְּ இடத்தைக் குறிப்பதால் தமிழில் இடவேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁתֵּים עֶשְׂרֵה עֵינֹת מַיִם
  choice: பன்னிரண்டு நீரூற்றுகள்
  rationale: עֵינֹת מַיִם என்பது தோண்டப்பட்ட கிணறுகளைவிட இயற்கையான நீரூற்றுகளைக் குறிக்கிறது. தமிழ் வழக்கில் ‘நீரூற்றுகள்’ என்பதே தெளிவானதும் சுருக்கமானதும்.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: எழுபது பேரீச்ச மரங்கள்
  rationale: תְּמָרִים என்பது பேரீச்ச வகைப் பனைமரங்களைக் குறிக்கக்கூடும். தமிழில் பொதுவான ‘பனைமரங்கள்’ என்பதைவிட ‘பேரீச்ச மரங்கள்’ மூலச்சொல்லின் தாவரவியல் குறிப்பைத் துல்லியமாகக் காக்கிறது.
- source_word: וַיַּחֲנוּ שָׁם
  choice: அவர்கள் அங்கே முகாமிட்டார்கள்
  rationale: חנה வனாந்தரப் பயணச் சூழலில் தங்கி முகாமிடுதலைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ நவீனத் தமிழில் இயல்பாக அந்தப் பொருளை வழங்குகிறது.
