translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலின் சுருக்கமான கதைநடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்கள் மாரா, ஏலிம் என ஒலிபெயர்க்கப்பட்டன; வசனத்தில் உண்மையான பொருள் ஐயம் அல்லது விளக்கம் தேவைப்படும் பகுதி இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
