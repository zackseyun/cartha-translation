base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: ta
  text: ஆனால், நீங்கள் அந்த நாட்டின் குடியிருப்பாளர்களை உங்கள் முன்னிலையிலிருந்து துரத்திவிடாவிட்டால், அவர்களில் நீங்கள் மீதியாக இருக்கவிடுகிறவர்கள் உங்கள் கண்களில் குத்தும் முட்களாகவும்[a], உங்கள் விலாப்புறங்களில் முட்களாகவும்[b] இருப்பார்கள்; நீங்கள் குடியிருக்கும் அந்த நாட்டில் அவர்கள் உங்களைத் துன்புறுத்துவார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் கண்களில் குத்தும் கூரிய பொருட்களாக’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயப் பெயர்ச்சொல் அரிதானது; குத்தித் துளைக்கும் கூரிய ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் விலாப்புறங்களில் கூரிய குத்துப்பொருட்களாக’ அல்லது ‘கொக்கிகளாக’ என்றும் மொழிபெயர்க்கலாம். இணையாக வரும் இரு உருவகங்களும் மீதியாக விடப்பட்ட குடியிருப்பாளர்களால் தொடர்ந்து ஏற்படும் வலிமிகுந்த துன்பத்தைக் காட்டுகின்றன.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்கள் உங்களுக்குத் தொல்லை கொடுப்பார்கள்’ அல்லது ‘உங்களை நெருக்குவார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பகைமையுடன் பலவகையில் துன்புறுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: துரத்திவிடாவிட்டால்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு நாட்டின் தற்போதைய குடியிருப்பாளர்களை அகற்றி, அவர்கள் வசம் இருந்த நிலத்தை இழக்கச் செய்வதைக் குறிக்கிறது. ‘துரத்திவிடு’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்கேற்ற வலிமையுடனும் உள்ளது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்த நாட்டின் குடியிருப்பாளர்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அமைப்பை இயல்பான, மரியாதைமிக்க நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்கள் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய இடவியல் மரபுத்தொடரின் பொருளைத் தக்கவைத்து, தமிழில் புரியும்படி வழங்குகிறது.
- source_word: תּוֹתִירוּ
  choice: நீங்கள் மீதியாக விட்டுவைப்பவர்கள்
  rationale: יתר என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘மீதியாக இருக்கும்படி விடுதல்’ என்ற காரணவினை நுணுக்கத்தைப் பாதுகாக்கிறது; ‘தப்பவிடுதல்’ அல்லது ‘இரக்கம் காட்டுதல்’ போன்ற கூடுதல் கருத்துகளைச் சேர்க்கவில்லை.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: உங்கள் கண்களில் குத்தும் முட்களாக
  rationale: அரிதான שׂכים என்பது குத்தித் துளைக்கும் கூரிய பொருளைக் குறிக்கிறது. அடுத்த உருவகத்திலுள்ள பொதுவான ‘முட்கள்’ என்பதிலிருந்து ஓரளவு வேறுபடுத்த ‘குத்தும் முட்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: உங்கள் விலாப்புறங்களில் முட்களாக
  rationale: கூர்மையான, துளைக்கும் பொருளின் உருவகத்தையும் உடலின் பக்கப்பகுதியைக் குறிக்கும் צִדֵּיכֶם என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: அவர்கள் உங்களைத் துன்புறுத்துவார்கள்
  rationale: צרר இங்கு பகைமையுடன் தொல்லை கொடுத்தல், நெருக்குதல், வேதனைப்படுத்துதல் ஆகிய பொருள் வரம்பைக் கொண்டது. ‘துன்புறுத்துவார்கள்’ என்பது அதைப் பொதுவாகவும் அளவுக்கு மீறாமலும் வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: நீங்கள் குடியிருக்கும் அந்த நாட்டில்
  rationale: עַל என்பதன் இடப்பொருளைத் தமிழின் இயல்பான பயன்பாட்டின்படி ‘நாட்டில்’ எனவும், நிகழ்காலப் பங்கேற்புவினையை ‘குடியிருக்கும்’ எனவும் வழங்குகிறது.
