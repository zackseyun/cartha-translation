  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: ta
  text: அவர்கள் ஆலூசிலிருந்து புறப்பட்டு, ரெபிதீமில் முகாமிட்டார்கள். ஆனால் அங்கே மக்கள் குடிப்பதற்குத் தண்ணீர் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது; நவீனத் தமிழில் ‘புறப்பட்டு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵאָלוּשׁ
  choice: ஆலூசிலிருந்து
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரேய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது; מִן முன்னொட்டு ‘-இலிருந்து’ என வழங்கப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணத்தின் இடையே முகாம் அமைத்துத் தங்குவதைக் குறிக்கும் வழக்கமான வினை; ‘முகாமிட்டார்கள்’ தற்போதைய தமிழில் இயல்பானது.
- source_word: בִּרְפִידִם
  choice: ரெபிதீமில்
  rationale: இடப்பெயர் எபிரேய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது; בְּ இடவுருபு தமிழில் ‘-இல்’ என வழங்கப்பட்டது.
- source_word: וְלֹא הָיָה שָׁם
  choice: ஆனால் அங்கே ... இல்லை
  rationale: வாவ் இங்கு முன் கூறிய முகாமிடுதலுடன் முரண்படும் பாதகமான சூழலை அறிமுகப்படுத்துகிறது; ‘ஆனால்’ அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: மக்கள் குடிப்பதற்கான நீரைப் பற்றிய அன்றாடச் சூழலில் ‘தண்ணீர்’ என்பது நவீனத் தமிழின் இயல்பான சொல்.
- source_word: לָעָם
  choice: மக்கள்
  rationale: עַם இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; சூழலில் ‘மக்கள்’ தெளிவான பொதுவழக்கு.
- source_word: לִשְׁתּוֹת
  choice: குடிப்பதற்கு
  rationale: לְ முன்னொட்டுடன் வந்த வினையெச்சம் நோக்கம் அல்லது பயன்பாட்டைக் குறிக்கிறது; ‘மக்கள் குடிப்பதற்கு’ மூலத்தின் உறவைப் பாதுகாக்கிறது.
