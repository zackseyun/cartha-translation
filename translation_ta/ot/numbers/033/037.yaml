base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: ta
  text: அவர்கள் காதேஷிலிருந்து[a] புறப்பட்டு, ஏதோம் நாட்டின் விளிம்பிலிருந்த ஹோர் மலையில்[b] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “காதேஷ்” என்றே உள்ளது. விரிந்த சூழலை அடிப்படையாகக் கொண்டு சில மொழிபெயர்ப்புகள் இதை “காதேஷ்-பர்னேயா” என்று விரிவாக்குகின்றன; ஆனால் அந்த நீண்ட பெயர் இந்த வசனத்தில் இல்லை.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஹோர் என்னும் மலையில்”; வழக்கமாக இது “ஹோர் மலை” என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயணப் பட்டியலில் נסע என்பது முகாமிடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; நவீனத் தமிழில் “புறப்பட்டு” என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִקָּדֵשׁ
  choice: காதேஷிலிருந்து
  rationale: எபிரெய உரையில் இங்கு “காதேஷ்” என்ற குறுகிய இடப்பெயரே உள்ளது; சூழலை அடிப்படையாகக் கொண்டு “காதேஷ்-பர்னேயா” என்று விரிவாக்கப்படவில்லை.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணத்தின்போது ஓரிடத்தில் தங்கி முகாமிடும் செயலைக் குறிக்கும்; “முகாமிட்டார்கள்” தெளிவான நவீனத் தமிழ்.
- source_word: בְּהֹר הָהָר
  choice: ஹோர் மலையில்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் “ஹோர் என்னும் மலையில்” என அமையும்; நிறுவப்பட்ட இடப்பெயரின் பொருளை இயல்பான தமிழில் “ஹோர் மலையில்” என்று வழங்குகிறது.
- source_word: בִּקְצֵה
  choice: விளிம்பிலிருந்த
  rationale: קצה என்பது முடிவு, ஓரம் அல்லது விளிம்பு என்பதைக் குறிக்கலாம். “விளிம்பு” என்பது இதை அரசியல் எல்லை என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் இடஞ்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֶרֶץ אֱדוֹם
  choice: ஏதோம் நாடு
  rationale: אֶרֶץ என்பது நிலம் அல்லது நாடு/பிரதேசம் எனப் பொருள்படும்; இங்கு “ஏதோம் நாடு” இயல்பாகவும் நேரடியாகவும் உள்ளது.
