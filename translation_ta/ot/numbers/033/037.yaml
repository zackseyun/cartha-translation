  register: நவீனத் தரத்தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய வடிவுக்கு அணுக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; தேவையற்ற பாரம்பரிய விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
