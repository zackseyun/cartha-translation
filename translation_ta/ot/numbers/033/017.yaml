base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: ta
  text: அவர்கள் கிப்ரோத்-அத்தாவாவிலிருந்து புறப்பட்டு, ஹாசேரோத்தில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிப்ரோத்-அத்தாவா என்பதற்கு ‘வேட்கையின் கல்லறைகள்’ அல்லது ‘இச்சையின் கல்லறைகள்’ என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: வனாந்தரப் பயண நிலையங்களின் பட்டியலில் נסע என்பது ஒரு இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘புறப்பட்டு’ பயணத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: கிப்ரோத்-அத்தாவாவிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; מִן முன்னொட்டின் பொருள் ‘-இலிருந்து’ என வழங்கப்பட்டுள்ளது. பெயரின் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் חנה என்பது தங்கி முகாமிடுவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בַּחֲצֵרֹת
  choice: ஆசேரோத்தில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; இங்கு בְּ என்பது முகாமிட்ட இடத்தைக் குறிப்பதால் தமிழின் இடவேற்றுமை உருபான ‘-இல்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; கிப்ரோத்-அத்தாவாவின் சாத்தியமான சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
