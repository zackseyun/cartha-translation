source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: ta
  text: அவர்கள் அல்மோன்-திப்லாத்தாயிமிலிருந்து புறப்பட்டு, நேபோவுக்கு எதிரே இருந்த அபாரீம் மலைகளில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேபோவுக்கு முன்பாக இருந்த அபாரீம் மலைகளில்.” எபிரெயச் சொல் இடஞ்சார்ந்த உறவைக் குறிக்கிறது; அதன் துல்லியமான நுட்பப் பொருளை அது குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் ... புறப்பட்டு
  rationale: נסע என்பதன் பயணப் பட்டியல் சூழலுக்குரிய பொருள் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: அல்மோன்-திப்லாத்தாயிமிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது; ஒரே இடப்பெயர் என்பதைத் தெளிவாக்க இணைப்புக்கோடு பயன்படுத்தப்பட்டது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணப் பட்டியலில் தங்கி முகாம் அமைப்பதைக் குறிக்கும்; ‘முகாமிட்டார்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּהָרֵי
  choice: மலைகளில்
  rationale: הַר என்பதன் பன்மை இணைநிலை வடிவம்; இங்கு மலைப்பகுதிக்குள் முகாமிட்டதைக் காட்ட ‘மலைகளில்’ என வழங்கப்பட்டது.
- source_word: הָעֲבָרִים
  choice: அபாரீம்
  rationale: இச்சூழலில் இது புவியியல் இடப்பெயராகச் செயல்படுவதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי
  choice: எதிரே
  rationale: לִפְנֵי இங்கு இடஞ்சார்ந்த உறவை, ‘முன்பாக/எதிரே’ என்ற பொருள் வரம்பில் குறிக்கிறது; துல்லியமான திசையைச் சேர்க்காமல் இயல்பான தமிழில் ‘எதிரே’ என வழங்கப்பட்டது.
- source_word: נְבוֹ
  choice: நேபோ
  rationale: இது ஓர் இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
