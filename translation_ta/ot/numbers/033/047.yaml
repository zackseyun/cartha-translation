  source_fidelity: 'மூல எபிரெயத்தின் பயணப் பட்டியல் அமைப்பு துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: அல்மோன்-திப்லாத்தாயிமிலிருந்து புறப்படுதல், அபாரீம் மலைகளில் முகாமிடுதல், நேபோவோடு தொடர்புடைய இடஞ்சார் குறிப்பு ஆகியவை அனைத்தும் உள்ளன. לִפְנֵי என்பதன் இடஞ்சார் நுணுக்கத்தை முதன்மை உரையில் ‘எதிரே’ என்றும் அடிக்குறிப்பில் மாற்றுவழியாகவும் வழங்குவது பொருத்தமானது.'
