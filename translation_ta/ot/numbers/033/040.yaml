translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் பின்னணித் தகவல் ஒரே இயல்பான தொடர்பெயரெச்சத் தொடரில் அமைக்கப்பட்டது; மூலத்தில் மறைந்திருக்கும் கேட்ட செய்தியை ‘அதை’ என மட்டும் சுட்டி, கூடுதல் விவரம் சேர்க்கப்படவில்லை.
