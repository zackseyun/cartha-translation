source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: ta
  text: கானான் நாட்டின் நெகேபில் வாழ்ந்துவந்த ஆராதின் அரசனாகிய கானானியன், இஸ்ரவேலின் மக்கள் வந்தபோது கேட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெகேப்” என்பதை “தெற்கு” அல்லது “தென்பகுதி” என்றும் மொழிபெயர்க்கலாம். “இஸ்ரவேலின் மக்கள்” என்பதற்கு எபிரெயத்தில் சொல்லுக்கு சொல் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டான்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேட்டான்’; ஆனால் இங்கு கேட்கப்பட்ட செய்தி வெளிப்படையாகச் சொல்லப்படாமல், இஸ்ரவேல் மக்கள் வந்த நிகழ்வு மட்டும் காலத்தைக் குறிக்கும் வகையில் தொடர்வதால், இயல்பான தமிழில் ‘அதைக் கேள்விப்பட்டான்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: ஆராதின் கானானிய அரசன்
  rationale: குறிப்பிட்ட கானானியனே ஆராதின் அரசன் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; எபிரெயப் பெயர்ச்சொல் தொடர்பும் இன அடையாளமும் காக்கப்படுகின்றன.
- source_word: וְהוּא יֹשֵׁב
  choice: வாழ்ந்துவந்த
  rationale: சுட்டுப்பெயருடன் வரும் நிகழ்காலப் பங்கேற்பு பின்னணியான தொடர்நிலையைச் சுட்டுகிறது; ‘வாழ்ந்துவந்த’ என்பது அதை இயல்பான தமிழில் தருகிறது.
- source_word: בַּנֶּגֶב
  choice: நெகேபில்
  rationale: נֶגֶב இங்கு அங்கீகரிக்கப்பட்ட தென்பகுதி நிலப்பெயராகப் புரிந்துகொள்ளப்படுவதால் ஒலிபெயர்க்கப்பட்டது; ‘தெற்கில்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டின்
  rationale: ‘கானான் தேசத்தில்’ என்ற வெளிப்படையான நிலப்பரப்பு குறிப்பை, தமிழில் நெகேபின் இருப்பிடத்தை இயல்பாக வரையறுக்கும் உடைமைத் தொடராகத் தருகிறது.
- source_word: בְּבֹא
  choice: வந்தபோது
  rationale: ב முன்னொட்டுடன் வரும் בוא வினையெச்சப் பெயர் இங்கு காலப் பொருளுடையது; வந்த இடம் குறிப்பிடப்படாததால் ‘நுழைந்தபோது’ என்று விரிவாக்கப்படவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு சமூகமெங்கையும் குறிக்கும் நிலையான இனக்குழுப் பெயராக இருப்பதால், நவீன தமிழில் உள்ளடக்கமான ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
