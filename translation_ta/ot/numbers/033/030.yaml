  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: ta
  text: அவர்கள் ஹஷ்மோனாவிலிருந்து புறப்பட்டு, மோசேரோத்தில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: வனாந்தரப் பயணத் தங்குமிடப் பட்டியலில் נסע என்பது ஒரு தங்குமிடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பயணத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵחַשְׁמֹנָה
  choice: அஸ்மோனாவிலிருந்து
  rationale: מֵ முன்னொட்டு ‘இலிருந்து’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. חַשְׁמֹנָה ஓர் இடப்பெயர் என்பதால், அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘அஸ்மோனா’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: இந்தப் பயணப் பட்டியல் சூழலில் חנה என்பது முகாமிட்டுத் தங்குவதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּמֹסֵרֹת
  choice: மோசேரோத்தில்
  rationale: பயணத் தங்குமிடத்தைக் குறிக்கும் בְ தமிழில் இடவேற்றுமை உருபால் இயல்பாக வெளிப்படுகிறது. מֹסֵרֹת இடப்பெயர் என்பதால் ‘மோசேரோத்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பயணப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான ‘புறப்பட்டு—முகாமிட்டார்கள்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
