revisions:
- from: அவர்கள் ராமேசேசிலிருந்து முதலாம் மாதத்தில்—அந்த மாதத்தின் பதினைந்தாம் நாளில்—புறப்பட்டார்கள். பஸ்காவுக்கு மறுநாளில் இஸ்ரவேலின் மகன்கள்[a], ஓங்கிய கையுடன்[b], எகிப்தியர் அனைவரின் கண்முன்னே வெளியேறினார்கள்.
