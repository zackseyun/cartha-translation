  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] முதல் மாதத்தின் பதினைந்தாம் நாளில் ராமேசேசிலிருந்து புறப்பட்டார்கள். பஸ்கா பண்டிகைக்கு மறுநாளில் அவர்கள் உயர்த்தப்பட்ட கையுடன்[b] எகிப்தியர் அனைவரின் கண்முன்னே வெளியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “உயர்த்தப்பட்ட கையுடன்” என்பது அனைவரும் காணும்படி வெளிப்படையாகவும் துணிவாகவும் செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: பயணப் பட்டியல் சூழலில் נסע என்பது முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵרַעְמְסֵס
  choice: ராமேசேசிலிருந்து
  rationale: இடப்பெயரை நவீனத் தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן ... בַּחֲמִשָּׁה עָשָׂר יוֹם
  choice: முதலாம் மாதத்தில்—அந்த மாதத்தின் பதினைந்தாம் நாளில்—
  rationale: எபிரெய உரையில் வரும் மாதக் குறிப்பின் மீளுரைப்பைத் தமிழில் இயல்பாகத் தக்கவைத்து, தேதியைத் தெளிவுபடுத்துகிறது.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: பஸ்காவுக்கு மறுநாளில்
  rationale: מָחֳרַת என்பதன் ‘அடுத்த நாள்’ என்ற பொருளையும் பண்டிகைக் குறிப்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் பன்மை வடிவத்தை வெளிப்படையாகத் தக்கவைக்கிறது; இது மொத்த இஸ்ரவேல் மக்களையும் குறிக்கும் பிரதிநிதித்துவப் பயன்பாடு.
- source_word: בְּיָד רָמָה
  choice: ஓங்கிய கையுடன்
  rationale: ‘உயர்த்தப்பட்ட கை’ என்ற மூல உருவகத்தைத் தக்கவைத்து, தமிழில் செறிவாகவும் இயல்பாகவும் ஒலிக்கிறது; அதன் மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: எகிப்தியர் அனைவரின் கண்முன்னே
  rationale: புறப்பாடு அனைவரும் காணும்படி வெளிப்படையாக நடந்தது என்ற எபிரெயக் கருத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் பிரதிநிதித்துவ ஆண்பால் வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் வெளிப்படையான வடிவத்தைத் தக்கவைக்கிறது; அதேவேளை அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: בְיָד רָמָה என்ற மரபுத்தொடரின் பொருள்
  choice: ஓங்கிய கையுடன்
  alternative: துணிவுடன் / வெற்றிகரமாக / எதிர்ப்புணர்வுடன்
  rationale: மூலத்தின் concrete உருவகத்தைப் பாதுகாத்து, துணிவு, வெற்றி அல்லது எதிர்ப்பு ஆகியவற்றில் ஒன்றை மட்டும் தேவையின்றித் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. காலக் குறிப்பின் எபிரெய மீளுரைப்பை நீண்ட கோடுகளால் இயல்பாக்கி, ‘ஓங்கிய கை’ என்ற மூல உருவகத்தையும் அதன் பொருள் விரிவையும் பிரித்துக் காட்டுகிறது.
