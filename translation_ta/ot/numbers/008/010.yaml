  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: ta
  text: நீ லேவியர்களை யாவேக்கு முன்பாகக் கொண்டுவர வேண்டும்; இஸ்ரவேலின் மகன்கள்[a] தங்கள் கைகளை லேவியர்கள்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெய மொழியில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: நீ ... கொண்டுவர வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது ‘முன்னிலையில் நிறுத்துதல்’ எனப் பொருள்படும். சடங்குச் சூழலில் ‘யாவேக்கு முன்பாகக் கொண்டுவர வேண்டும்’ என்பது திசைசார்ந்த நுணுக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: לוי என்ற குலப் பெயரின் பன்மை வடிவத்திற்கான தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக’ அல்லது ‘முன்னிலையில்’ எனப் பொருள்படும்; இங்கு சடங்குச் சூழலுக்கு ‘முன்பாக’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְסָמְכוּ
  choice: வைக்க வேண்டும்
  rationale: סמך உடன் ‘கைகள்’ மற்றும் עַל வரும்போது, ஒருவர்மேல் கைகளை வைக்கும் சடங்குச் செயலைக் குறிக்கிறது. ‘வைக்க வேண்டும்’ என்பது செயலைத் தெளிவாகவும் மிகை விளக்கமின்றியும் தெரிவிக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான வடிவத்தை முதன்மை உரையில் காக்கிறது; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் மரபுச் சொற்றொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יְדֵיהֶם עַל הַלְוִיִּם
  choice: தங்கள் கைகளை லேவியர்கள்மேல்
  rationale: பன்மை உடைமை வடிவத்தையும் עַל என்பதன் ‘மேல்’ என்ற இடத்தொடர்பையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா / ஆண்டவர்
  rationale: மூல உரையில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: בְנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தை உரையில் காக்கிறது; அதேவேளையில், அது மக்களைக் கூட்டாகக் குறிக்கும் நிலையான வழக்கு என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கட்டளையின் வலிமையை ‘வேண்டும்’ அமைப்பு வெளிப்படுத்துகிறது; மூலத்தின் இரண்டு இணையான செயல்களும் அரைப்புள்ளியால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
