  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: ta
  text: 'அவர்களைத் தூய்மைப்படுத்த நீ அவர்களுக்குச் செய்யவேண்டியது இதுவே: பாவநீக்கத் தண்ணீரை[a] அவர்கள்மேல் தெளி. அவர்கள் தங்கள் உடல் முழுவதிலும் சவரக்கத்தியை ஓட்டிக்கொள்ளட்டும்[b]; தங்கள் ஆடைகளைத் துவைத்துத் தங்களைத் தூய்மைப்படுத்திக்கொள்ளட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் தண்ணீர்”; சொல்லுக்குச் சொல், “பாவத்தின் தண்ணீர்.”
    reason: lexical_alternative
  - marker: b
    text: “உடல் முழுவதிலும் சவரக்கத்தியை ஓட்டிக்கொள்ளட்டும்” என்பது உடல் முழுவதையும் சவரம் செய்துகொள்ளட்டும் என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם לְטַהֲרָם
  choice: அவர்களைத் தூய்மைப்படுத்த நீ அவர்களுக்குச் செய்யவேண்டியது இதுவே
  rationale: வழிபாட்டுச் சடங்கிற்கான செய்முறையை அறிமுகப்படுத்தும் எபிரெய கட்டளையின் தொடர்பையும் நோக்கத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: அவர்கள்மேல் தெளி
  rationale: சடங்கில் நீரைத் தெளிக்கும் செயலைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵי חַטָּאת
  choice: பாவநீக்கத் தண்ணீர்
  rationale: சொல்லுக்குச் சொல் வடிவான ‘பாவத்தின் தண்ணீர்’ தமிழில் பொருள் தெளிவற்றது. சடங்கு சார்ந்த தூய்மைப்படுத்தும் பயன்பாட்டை ‘பாவநீக்கத் தண்ணீர்’ எடுத்துரைக்கிறது; ஆனால் இதை வெளிப்படையாகப் ‘பாவநிவாரணப் பலியின் தண்ணீர்’ என்று மாற்றி மூலத்தில் இல்லாத பலியியல் பொருளைச் சேர்க்கவில்லை.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: அவர்கள் தங்கள் உடல் முழுவதிலும் சவரக்கத்தியை ஓட்டிக்கொள்ளட்டும்
  rationale: ‘சவரக்கத்தியை ஓட்டுதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, ‘மாம்சம் முழுவதிலும்’ என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் ‘உடல் முழுவதிலும்’ எனத் தருகிறது.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: தங்கள் ஆடைகளைத் துவைத்து
  rationale: ஆடைகளைக் கழுவுவதைக் குறிக்கும் வினையை நவீனத் தமிழின் வழக்கமான சொல்லால் தருகிறது.
- source_word: וְהִטֶּהָרוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொள்ளட்டும்
  rationale: வினையின் தற்சுட்டு/தன்மேல் நிகழும் நுணுக்கத்தையும் சடங்கின் நிறைவு நடவடிக்கையையும் காக்கிறது.
theological_decisions:
- issue: லேவியரின் அர்ப்பணிப்புச் சடங்கில் வரும் தூய்மைப்படுத்துதல்
  choice: טהר என்பதைக் சடங்கு சார்ந்த ‘தூய்மைப்படுத்துதல்’ என மொழிபெயர்த்து, மֵי חַטָּאת என்பதைக் ‘பாவநீக்கத் தண்ணீர்’ என வழங்குதல்
  alternative: முழுவதும் தொழில்நுட்ப வழிபாட்டுச் சொல்லாட்சியைப் பயன்படுத்துதல்; அல்லது இதை வெளிப்படையாக ‘பாவநிவாரணப் பலிக்கான தண்ணீர்’ எனக் கூறுதல்
  rationale: வசனம் ஒரு தெளிவான சடங்கு நடைமுறையை விவரிக்கிறது. மொழிபெயர்ப்பு அதன் வழிபாட்டுச் சூழலைக் காக்கிறது; அதேவேளையில் அதை உள்ளார்ந்த ஒழுக்கத் தூய்மையாக மட்டும் சுருக்கவோ, மூலத்தில் வெளிப்படையாக இல்லாத பலியியல் விளக்கத்தைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை கட்டளையிலிருந்து பன்மைச் செயல்களுக்கு மாறும் எபிரெய இலக்கண அமைப்பும் தமிழில் காக்கப்பட்டுள்ளது.
