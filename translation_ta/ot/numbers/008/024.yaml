  text: זֹ֖את אֲשֶׁ֣ר לַ/לְוִיִּ֑ם מִ/בֶּן֩ חָמֵ֨שׁ וְ/עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה יָבוֹא֙ לִ/צְבֹ֣א צָבָ֔א בַּ/עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: ta
  text: 'லேவியர்களுக்குப் பொருந்துவது இதுவே: இருபத்தைந்து வயது முதல் அதற்கும் மேற்பட்ட வயதுடையவன், சந்திப்புக் கூடாரத்தின் பணியில் கடமையாற்ற வரவேண்டும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடமையாற்ற’ என்பதற்கு ‘சேவை செய்ய’ அல்லது ‘பணி புரிய’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத் தொடரில் ஒழுங்கமைந்த சேவையைக் குறிக்கும் படைசார் நிழற்பொருளும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: லேவியர்களுக்குரிய விதி இதுவே
  rationale: இந்தத் தொடர் லேவியர்களுக்குப் பொருந்தும் ஒழுங்குமுறையை அறிமுகப்படுத்துகிறது. ‘விதி’ என்பது எபிரெயத் தொடரின் சட்டவழிகாட்டல் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபத்தைந்து வயதும் அதற்கு மேலும் உள்ளவன்
  rationale: இது பணியைத் தொடங்குவதற்கான குறைந்தபட்ச வயது இருபத்தைந்து என்பதைத் தெளிவாகக் குறிக்கிறது; எபிரெயத்தின் ஒருமை வடிவமும் தக்கவைக்கப்படுகிறது.
- source_word: יָבוֹא
  choice: வரவேண்டும்
  rationale: எபிரெய வினைச்சொல்லின் ‘வருதல்/நுழைதல்’ பொருளையும், விதிமுறை சார்ந்த கட்டாயத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: לִצְבֹא צָבָא
  choice: கடமையாற்ற
  rationale: இத்தொடர் ஒழுங்குபடுத்தப்பட்ட சேவை அல்லது கடமையில் ஈடுபடுவதைக் குறிக்கிறது; பின்னணியில் உள்ள படைசார் நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲבֹדַת
  choice: பணியில்
  rationale: ஆசரிப்புக் கூடாரத்தில் ஒப்படைக்கப்பட்ட உழைப்பு அல்லது சேவையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தமது மக்களைச் சந்திக்கும் கூடாரத்துக்கான எபிரெயப் பெயரை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: கூட்டுப் பெயருக்குப் பின் வரும் ஆண்பால் ஒருமை வினை அமைப்பு
  choice: உள்ளவன் ... வரவேண்டும்
  alternative: உள்ளவர்கள் ... வரவேண்டும்
  rationale: லேவியர்கள் அனைவரையும் குறித்து விதி கூறப்பட்டாலும், எபிரெய மூலத்தில் ஒருமை வடிவம் உள்ளது. அதைத் தமிழில் பொதுவான ஆண்பால் ஒருமையாக வைத்திருப்பது மூலத்தின் இலக்கண வடிவத்தையும் தனிநபருக்குப் பொருந்தும் விதிமுறைத் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணி’ மற்றும் ‘கடமை’ ஆகிய சொற்கள் மூலத்திலுள்ள தொடர்புடைய இரு சேவைச் சொற்களின் வேறுபாட்டை ஓரளவு தக்கவைக்கின்றன.
