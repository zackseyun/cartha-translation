revisions:
- from: 'லேவியர்களுக்குரிய விதி இதுவே: இருபத்தைந்து வயதும் அதற்கு மேலும் உள்ளவன், சந்திப்புக் கூடாரத்தின் பணியில் கடமையாற்ற வரவேண்டும்[a].'
  to: 'லேவியர்களுக்குப் பொருந்துவது இதுவே: இருபத்தைந்து வயது முதல் அதற்கும் மேற்பட்ட வயதுடையவன், சந்திப்புக் கூடாரத்தின் பணியில் கடமையாற்ற வரவேண்டும்[a].'
  rationale: The revision more closely follows the Hebrew introductory and age-threshold constructions, while retaining the draft’s clear rendering of the Levites’ assigned sanctuary duty. The footnote preserves the idiom’s military overtone without introducing an unwarranted literal picture of military enlistment.
