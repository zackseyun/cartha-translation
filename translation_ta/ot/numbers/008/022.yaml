base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: ta
  text: அதற்குப் பிறகு, லேவியர்கள் ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் முன்பாகச் சந்திப்புக் கூடாரத்தில் தங்கள் சேவையை நிறைவேற்ற வந்தார்கள். லேவியர்களைக் குறித்து யாவே மோசேக்குக் கட்டளையிட்டபடியே, அவ்வாறே அவர்களுக்குச் செய்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களிடம் அவ்வாறே செய்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வாசகம் சுருக்கமாக உள்ளது; கட்டளையிடப்பட்ட சடங்குகள் லேவியர்கள் தொடர்பாக நிறைவேற்றப்பட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய தூய்மைப்படுத்தல் மற்றும் அர்ப்பணிப்பு நிகழ்வுகளைத் தொடர்ந்து அடுத்த கட்டம் தொடங்குவதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: בָּאוּ
  choice: வந்தார்கள்
  rationale: இயக்கத்தைக் குறிக்கும் பொதுவான வினைச்சொல்லை நேரடியாக வழங்குகிறது; கூடாரத்திற்குள் நுழைந்தார்கள் என்று மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இஸ்ரவேலின் லேவி கோத்திரத்தாருக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: தங்கள் பணியைச் செய்ய
  rationale: வழிபாட்டிடம் சார்ந்த கடமையைச் செய்வதைக் குறிக்கிறது; எபிரெய வேர்ச்சொல் மீளுரையைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: מוֹעֵד என்பதன் சந்திப்பு/நியமிக்கப்பட்ட சந்திப்பு சார்ந்த பொருளையும், בְּ முன்னிடைச்சொல்லின் இடப்பொருளையும் காக்கிறது.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் முன்பாக
  rationale: ஆசாரிய மேற்பார்வை உட்கருத்தாக இருக்கக்கூடும்; ஆனால் அதை விளக்கமாகச் சேர்க்காமல் לִפְנֵי என்பதன் நேரடியான ‘முன்பாக’ என்ற வடிவத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַל הַלְוִיִּם
  choice: லேவியர்களைக் குறித்து
  rationale: இங்கு עַל கட்டளையின் பொருளைக் குறிக்கிறது; ‘குறித்து’ என்பது துல்லியமான இயல்பான தமிழ்.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: அவர்கள் அவர்களுக்குச் செய்தார்கள்
  rationale: எழுவாய் வெளிப்படையாக மீண்டும் சொல்லப்படாததையும், לָהֶם என்பதன் சுருக்கமான ‘அவர்களுக்கு’ வடிவத்தையும் விளக்கி விரிவாக்காமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பெயரைப் பயன்படுத்துகிறது; ‘யாவே’ அதைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: כֵּן עָשׂוּ לָהֶם என்பதில் செய்பவர்களும் செயல் பெறுபவர்களும்
  choice: அவர்கள் அவர்களுக்குச் செய்தார்கள்
  alternative: அவர்கள் அவர்களிடம் செய்தார்கள்; அவர்களுக்காக அவ்வாறே செய்தார்கள்
  rationale: எபிரெய உரை எழுவாயை மீண்டும் குறிப்பிடாமல் சுருக்கமாக உள்ளது. சூழல் prescribed rites லேவியர்கள் தொடர்பாக நிறைவேற்றப்பட்டதைக் காட்டினாலும், யார் செய்தார்கள் என்பதை இவ்வசனம் தனியாகத் தெளிவுபடுத்தவில்லை; எனவே அந்தத் தெளிவின்மை பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணி’, ‘சந்திப்புக் கூடாரம்’, ‘முன்பாக’ ஆகிய சொற்கள் வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்டுகின்றன; கடைசி வாக்கியத்தின் மூலமொழிச் சுருக்கமும் தெளிவின்மையும் அடிக்குறிப்புடன் பேணப்பட்டுள்ளன.
