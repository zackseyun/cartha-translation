base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: ta
  text: பின்பு, லேவியர்களைச் சந்திப்புக் கூடாரத்தின் முன் கொண்டுவர வேண்டும்; இஸ்ரவேல் மகன்களின் முழுச் சபையையும் ஒன்றுகூட்ட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: பின்பு ... கொண்டுவந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்/முன்னிறுத்துதல்’ என்று பொருள்படும். சடங்கு நடைபெறும் இடத்தை நோக்கிய இயக்கத்தை ‘கொண்டுவந்து’ இயல்பாக வெளிப்படுத்துகிறது; தொடர்ச்சியான waw-ஐ ‘பின்பு’ காட்டுகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த, பரிசுத்த இடப் பணிக்காகப் பிரிக்கப்பட்டவர்களைக் குறிக்கும் வழக்கமான பெயர்.
- source_word: לִפְנֵי
  choice: முன்
  rationale: நேரடியாக ‘முன்பாக/எதிரில்’ என்பதைக் குறிக்கிறது; இங்கு சடங்கு சார்ந்த இடநிலையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் பரிசுத்த கூடாரத்தைக் குறிக்கும் நிலையான, இயல்பான தமிழ் சொற்றொடர்.
- source_word: וְהִקְהַלְתָּ
  choice: ஒன்றுகூட்ட வேண்டும்
  rationale: קהל என்பதன் ஹிஃபில் வடிவம் ஒரு குழுவை ஒன்றாகக் கூட்டுவதைக் குறிக்கிறது; அதிகாரபூர்வமான பொதுக் கூடுகையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל עֲדַת
  choice: முழுச் சபையையும்
  rationale: עֵדָה இங்கு இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; כָּל என்பதன் முழுமை ‘முழுச்’ என்பதால் வெளிப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களாகிய
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான மகன்/வம்ச உறவையும் ஆண்பால் பன்மை வடிவத்தையும் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்களாகிய
  alternative: இஸ்ரவேலராகிய
  rationale: இச்சொற்றொடர் இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும் உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. மூலத்தின் குடும்ப/வம்சச் சொல்லாக்கத்தை முதன்மை உரையில் பாதுகாத்து, சமூகத்தைக் குறிக்கும் இயல்பான தமிழ் மாற்றை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயக் கட்டளையின் இரண்டாம் நபர் ஒருமை வடிவம் தமிழில் இயல்பாக ‘வேண்டும்’ என வழங்கப்பட்டுள்ளது; இரண்டு செயல்களும் ஒரே கட்டளைக் கட்டமைப்பில் வைக்கப்பட்டுள்ளன.
