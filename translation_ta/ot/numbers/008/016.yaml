  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேலின் மகன்களிடையிலிருந்து[c] அவர்கள் எனக்கு முழுமையாகக் கொடுக்கப்பட்டவர்கள்[a]. கருப்பையை முதலில் திறப்பவரான—அதாவது இஸ்ரவேலின் மகன்களிலுள்ள ஒவ்வொரு முதற்பேறானவரான—ஒவ்வொருவருக்கும்[b] பதிலாக, அவர்களை எனக்கென எடுத்துக்கொண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிச்சயமாக எனக்குக் கொடுக்கப்பட்டவர்கள்’ அல்லது ‘முற்றிலும் எனக்குக் கொடுக்கப்பட்டவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயத்தில் ‘கொடுக்கப்பட்டவர்கள்’ என்ற சொல் வலியுறுத்தலுக்காக இருமுறை வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கருப்பையை முதலில் திறப்பவர்’ என்பது முதற்பேறானவரைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: ‘இஸ்ரவேல் மக்கள்’ அல்லது ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயம் சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: முழுமையாகக் கொடுக்கப்பட்டவர்கள்
  rationale: נתן என்ற வினையின் செயப்பாட்டு வினையெச்சம் இருமுறை வருவது வலியுறுத்தலைக் குறிக்கிறது. தமிழில் இயல்பற்ற சொல் மறுபடியைத் தவிர்த்து, முழுமையான அர்ப்பணிப்பை ‘முழுமையாக’ வெளிப்படுத்துகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: உரிமையையும் அர்ப்பணிப்பையும் குறிக்கும் לִי, ‘எனக்குக் கொடுக்கப்பட்டவர்கள்’ என்ற தமிழ் அமைப்பில் தெளிவாகவும் இயல்பாகவும் அமைகிறது.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிடையிலிருந்து
  rationale: מִתּוֹךְ ஒரு குழுவின் நடுவிலிருந்து செய்யப்படும் தேர்வைக் குறிக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதன் குடும்பவழி ஆண்பால் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: 'இங்கு தַּחַת மாற்றீட்டைக் குறிக்கிறது: முதற்பேறானவர்களுக்குப் பதிலாக லேவியர்கள் எடுத்துக்கொள்ளப்படுகிறார்கள்.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: கருப்பையைத் திறக்கும் ஒவ்வொருவரும்
  rationale: முதலில் கருப்பையிலிருந்து வெளிவருபவரைக் குறிக்கும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது; அடுத்து வரும் ‘முதற்பேறான’ என்ற விளக்கம் அதன் பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிலுள்ள முதற்பேறான ஒவ்வொருவரும்
  rationale: முந்திய எபிரேய மரபுத்தொடரை விளக்கும் இணைப்புச் சொற்றொடராக இதை வாசித்து, தனிநபர் ஒவ்வொருவரையும் உள்ளடக்கும் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: அவர்களை எனக்கென எடுத்துக்கொண்டேன்
  rationale: முடிவுற்ற தெய்வீக உரிமைகோரலை ‘எடுத்துக்கொண்டேன்’ என்பதும், இறுதி לִי-யின் தனிப்பட்ட உரிமை நுட்பத்தை ‘எனக்கென’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்
  rationale: மூல எபிரேயம் வெளிப்படையாக ஆண்பால் குடும்பவழிச் சொல்லைப் பயன்படுத்துவதால் அதை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் அது இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: லேவியர்களின் மாற்றீட்டுப் பங்கு
  choice: முதற்பேறான ஒவ்வொருவருக்கும் பதிலாக
  alternative: முதற்பேறானவர்களுக்காக
  rationale: תַּחַת இங்கு பொதுவான நன்மை அல்லது சார்பை மட்டும் அல்லாமல், ஒருவர் இடத்தில் மற்றவர் எடுக்கப்படும் மாற்றீட்டைச் சுட்டுகிறது; அதற்கு மேலான கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் வலியுறுத்தல் இயல்பான தமிழில் ‘முழுமையாக’ என வழங்கப்பட்டு, அதன் சொல் மறுபடி அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் கருப்பை உருவகமும் அதனை விளக்கும் ‘முதற்பேறு’ என்ற இணைப்பும் இரண்டும் தக்கவைக்கப்பட்டுள்ளன.
