base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் இஸ்ரவேல் மகன்களின் முழுச் சபையும், லேவியர்களைக் குறித்து யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் லேவியர்களுக்குச் செய்தார்கள்; இஸ்ரவேல் மகன்கள்[a] அவர்களுக்கு அப்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெயத்தில் “இஸ்ரவேல் மகன்கள்” என்று உள்ளது; இது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: செய்தார்கள்
  rationale: עָשָׂה என்பது ‘செய்/உருவாக்கு’ என்னும் பரந்த பொருளுடைய வினை. இங்கு முன்பு கட்டளையிடப்பட்ட செயல்களை லேவியர்களுக்குச் செய்வதைக் குறிக்கும்; சடங்கின் தன்மையை மொழிபெயர்ப்பே தேவையின்றிக் குறிப்பாக்காமல் ‘செய்தார்கள்’ அதன் பொதுத்தன்மையைப் பேணுகிறது.
- source_word: עֲדַת
  choice: சபையார்
  rationale: עֵדָה என்பது உடன்படிக்கைச் சமூகமாகக் கூடிய மக்களைக் குறிக்கிறது. ‘சபையார்’ என்பது இங்கு ஒரு கட்டடத்தையோ நிறுவனத்தையோ அல்லாமல், கூடியிருக்கும் முழுச் சமூகத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்பவழி வடிவத்தையும் ஆண்பால் பன்மையையும் நேரடியாகப் பேணுகிறது. தமிழில் மென்மையாகப் புரியக்கூடிய ‘இஸ்ரவேலர்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு செய்யப்பட்ட செயல்கள் எவரை நோக்கி அல்லது எவருக்குச் செய்யப்பட்டன என்பதைக் குறிக்கிறது. ‘லேவியர்களுக்கு’ என்பது அதன் பொருளைத் தேவையின்றிக் குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: இறைக் கட்டளையின் முழுமைக்கும் அதனோடு துல்லியமாக ஒத்துச் செயல்பட்டதற்கும் இந்தச் சொல் இடமளிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: இந்தச் செயல் நிகழ்வதற்கு முன்பே கட்டளை கொடுக்கப்பட்டது என்பதைத் தமிழ் பெயரெச்சத் தொடர் சூழலுக்கேற்றவாறு தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர். ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: லேவியர்களைக் குறித்து ... மோசேக்குக்
  rationale: கட்டளை மோசேக்கு வழங்கப்பட்டது; அதன் பொருள் லேவியர்களைப் பற்றியது. தமிழ் சொல்வரிசையில் இந்த இரண்டு உறவுகளும் தெளிவாகத் தனித்தனியாக வெளிப்படுகின்றன.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முன் கூறப்பட்ட கட்டளையோடு இஸ்ரவேலரின் செயல் முழுமையாக ஒத்திருந்ததை ‘அப்படியே’ இயல்பாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயரே நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல், பொதுவாக மறுவடிவமைக்கப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் பெயர்த்தன்மையைப் பேணுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட சமூகச் சொற்றொடர்
  choice: இஸ்ரவேல் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மைக் குடும்ப உருவகத்தை முதன்மை உரை பேணுகிறது; அதே நேரத்தில் இது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் மீளுரையும் கட்டளைக்கு முழுமையாக இணங்கியதை வலியுறுத்தும் இறுதி ‘அப்படியே’ என்பதும் பேணப்பட்டுள்ளன.
