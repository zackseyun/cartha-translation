    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: דבר என்பதன் wayyiqtol வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. ‘பின்பு’ கதைத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; ‘பேசினார்’ என்பது மூல வினையின் பொருளைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: אמר என்பதன் infinitive construct இங்கு நேரடிப் பேச்சை அறிமுகப்படுத்தும் வழக்குச் சூத்திரம். ‘பேசிச் சொன்னார்’ என்பது எபிரெயச் சொல்லமைப்பைப் பேணியபடி தமிழில் புரியத்தக்கதாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, பாரம்பரிய மாற்றை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
