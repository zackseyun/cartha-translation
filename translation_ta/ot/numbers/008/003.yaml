base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: ta
  text: 'ஆரோன் அவ்வாறே செய்தான்: விளக்குத்தண்டின் முன்புறத்தை நோக்கி[a] அதன் விளக்குகளை ஏற்றினான்[b]. யாவே மோசேயிடம் கட்டளையிட்டபடியே அவன் செய்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விளக்குத்தண்டின் முன்புறத்திற்கு எதிராக’ அல்லது ‘அதன் முன்புறத்தை எதிர்நோக்கி’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் விளக்குகளை அமைத்தான்.’ எபிரெய வினைச்சொல் விளக்குகளை மேலே கொண்டுவருதல் அல்லது அவற்றை எரியச் செய்தல் எனப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן אַהֲרֹן
  choice: ஆரோன் அவ்வாறே செய்தான்
  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட அறிவுறுத்தலின்படியே ஆரோன் செயல்பட்டதை இந்த எபிரெய மரபுத்தொடர் குறிக்கிறது; ‘அவ்வாறே செய்தான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶל מוּל פְּנֵי
  choice: முன்புறத்தை நோக்கி
  rationale: விளக்குத்தண்டின் முகம் அல்லது முன்புறத்தை நோக்கிய திசையமைப்பைத் தெரிவிக்கிறது; துல்லியமான இடவியலை தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: הַמְּנוֹרָה
  choice: விளக்குத்தண்டு
  rationale: கூடாரச் சூழலில் பல விளக்குகளைத் தாங்கும் பொருளைக் குறிக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு; ஒலிபெயர்ப்பைக் காட்டிலும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הֶעֱלָה
  choice: ஏற்றினான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் விளக்குகளை மேலே கொண்டுவருதல் அல்லது எரியச் செய்தல் என்ற கருத்துகளைத் தரக்கூடும். விளக்குகளோடு வரும் இச்சூழலில் ‘ஏற்றினான்’ இயல்பானது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נֵרֹתֶיהָ
  choice: அதன் விளக்குகளை
  rationale: பெண்பால் ஒருமை பின்னொட்டு விளக்குத்தண்டைக் குறிக்கிறது; נֵר என்பதற்கு இச்சூழலில் ‘விளக்கு’ என்பது தெளிவான பொருத்தம்.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேயிடம் கட்டளையிட்டபடியே
  rationale: தெய்வீகக் கட்டளைக்கு ஆரோன் துல்லியமாகக் கீழ்ப்படிந்ததை வெளிப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்பில் ‘மோசேயிடம் கட்டளையிட்டபடியே’ இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதனைப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் உள்ள திசையமைப்பு மற்றும் הֶעֱלָה வினையின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
