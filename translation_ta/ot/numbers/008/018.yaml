  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்களிடையே இருக்கும் ஒவ்வொரு முதற்பேறானவனுக்குப் பதிலாக லேவியர்களை நான் எடுத்துக்கொண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்களிடையே.” எபிரெய மொழியில், “இஸ்ரவேலின் மகன்களிடையே” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: நான் எடுத்துக்கொண்டேன்
  rationale: לקח என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம். சூழலில் நியமித்தல் என்ற கருத்து இருந்தாலும், மூல வினையின் நேரடியான பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: குறிப்பிட்ட பன்மைப் பெயர்; லேவி கோத்திரத்தைச் சேர்ந்த பணியாளர்களைக் குறிக்கிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: இங்கு இடத்தைக் குறிக்காமல், ஒருவரின் இடத்தில் மற்றொருவர் அமர்த்தப்படும் மாற்றீட்டைக் குறிக்கிறது.
- source_word: כָּל בְּכוֹר
  choice: ஒவ்வொரு முதற்பேறானவனுக்கும்
  rationale: ஒருமை בְּכוֹר உடன் כָּל பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு’ என வருகிறது. பெயர்ச்சொல் ஆண்பால் ஒருமையாக இருப்பதால் ‘முதற்பேறானவன்’ எனத் தரப்பட்டுள்ளது; மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிடையே
  rationale: எபிரெயச் சொற்றொடரின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தையும், בְּ என்பதன் இச்சூழலுக்குரிய ‘இடையே’ என்ற உறவையும் காக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தில் ஆண்பால் பன்மை அமைப்பாக ‘இஸ்ரவேலின் மகன்கள்’ என்றே உள்ளது. அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கக்கூடியதாக இருந்தாலும், மூலத்தின் பாலின வடிவத்தை முதன்மை உரை காக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடை. மாற்றீட்டைக் குறிக்கும் தַּחַת ‘பதிலாக’ எனத் தெளிவாகவும், மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவம் அடிக்குறிப்புடன் முதன்மை உரையிலும் பாதுகாக்கப்பட்டும் உள்ளது.
