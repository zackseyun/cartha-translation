source:
  edition: WLC
  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: ta
  text: இஸ்ரவேல் மக்களிடையிலிருந்து[a] லேவியர்களை எடுத்துக்கொண்டு, அவர்களைத் தூய்மைப்படுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; இதை ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். மோசே லேவியர்களை இஸ்ரவேல் மக்களிடமிருந்து எடுத்துக்கொள்ள வேண்டும் என்ற நேரடியான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தேர்ந்தெடு’ என்று மொழிபெயர்த்து மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த, திருக்கூடாரப் பணிக்காக நியமிக்கப்பட்ட குழுவைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: מִתּוֹךְ
  choice: மக்களிடையிலிருந்து
  rationale: ஒரு பெரிய குழுவின் நடுவிலிருந்து அல்லது அவர்களுள் இருந்து எடுத்தலைக் குறிக்கும். ‘இடையிலிருந்து’ என்பது பிரித்தெடுக்கும் கருத்தைப் பாதுகாக்கும் இயல்பான தமிழ் நடை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களாகிய இஸ்ரவேலரை மொத்தமாகக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டு, நேரடிச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: அவர்களைத் தூய்மைப்படுத்து
  rationale: טהר இச்சடங்குச் சூழலில் சடங்குமுறைத் தூய்மையாக்குதலைக் குறிக்கிறது. ‘தூய்மைப்படுத்து’ என்பது அந்தச் செயலைத் தெளிவாகவும் மரியாதையான நவீன நடையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: எபிரெயச் சொற்றொடர் இலக்கணப்படி ஆண்பால் பன்மையாகவும் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றும் உள்ளது. ஆனால் இச்சூழலில் அது இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் மரபுப்பெயர். தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தவிர்த்து கூட்டுப் பொருளைத் தெளிவாகக் கொடுக்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; குடும்ப/உடன்படிக்கைச் சாயல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளை நடையும் வழிபாட்டு/சடங்கு சூழலுக்கேற்ற மரியாதையான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘எடுத்துக்கொண்டு’ என்பது மூல வினையின் பொதுவான பொருளைப் பாதுகாக்கிறது; ‘தூய்மைப்படுத்து’ சடங்குமுறைத் தூய்மையைக் குறிக்கிறது.
