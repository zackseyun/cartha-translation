base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேல் மக்களிடையே மனிதரிலும் மிருகங்களிலும் உள்ள ஒவ்வொரு முதற்பேறும் எனக்குச் சொந்தம். எகிப்து நாட்டில் முதற்பேறான அனைத்தையும் நான் அடித்த நாளில், அவற்றை எனக்கென்று பரிசுத்தமாகப் பிரித்துவைத்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்தமாகப் பிரித்துவைத்தேன்” என்பதை “எனக்கென்று அர்ப்பணித்தேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்துவதால், விளக்கக் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִי
  choice: எனக்குச் சொந்தம்
  rationale: எபிரெய முன்விகுதி இங்கு உடைமை அல்லது உரிமையைத் தெரிவிக்கிறது; தமிழில் இவ்வாறு கூறுவது இயல்பானது.
- source_word: כָל בְּכוֹר
  choice: ஒவ்வொரு முதற்பேறும்
  rationale: கூட்டொருமையான எபிரெய வடிவைத் தக்கவைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆண்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடையே
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்களிடையே’ எனலாம்; ஆனால் நவீனத் தமிழில் இச்சூழலின் உடன்படிக்கைச் சமூகத்தைக் கண்ணியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: மனிதரிலும் மிருகங்களிலும்
  rationale: மனித இனத்தையும் விலங்கு வகையையும் எதிரெதிராகக் காட்டும் கூட்டொருமைச் சொற்களையும் இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: בְּיוֹם הַכֹּתִי
  choice: நான் அடித்த நாளில்
  rationale: வரலாற்று நிகழ்வின் காலத்தைக் குறிக்கும் அமைப்பையும் נכה வினையின் நேரடியான பொருளையும் தக்கவைக்கிறது; ‘கொன்ற’ என்று சூழலிலிருந்து விளக்கிச் சேர்க்கவில்லை.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘நாடு’ என்னும் மூலத்தின் முழுக் கூறை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: அவர்களை எனக்கென்று பரிசுத்தமாகப் பிரித்துவைத்தேன்
  rationale: קדשׁ என்பதன் புனிதப் பயன்பாட்டையும் ‘தமக்கென ஒதுக்குதல்’ என்ற பொருளையும் ஒருங்கே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָדָם என்பதன் மனிதர்–மிருகம் எதிரிணைப் பொருள்
  choice: மனிதர்
  alternative: மனுக்குலம்
  rationale: இங்கு தனிப்பட்ட ஆணைக் குறிக்காமல் மனித வகையை மிருக வகைக்கு எதிராகக் குறிக்கிறது; ‘மனிதர்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- issue: הִקְדַּשְׁתִּי என்பதன் புனிதப் பிரித்துவைத்தல்
  choice: பரிசுத்தமாகப் பிரித்துவைத்தேன்
  alternative: எனக்கென்று அர்ப்பணித்தேன்
  rationale: முதற்பேறுகள் தேவனுக்குரிய புனித உடைமையாக ஒதுக்கப்பட்டன என்ற பொருளை வெளிப்படுத்துகிறது; வெறும் பொது அர்ப்பணிப்பாகக் குறைக்கவில்லை.
- issue: முதற்பேறுகளைக் குறிக்கும் אֹתָם என்ற ஆண்பால் பன்மைப் பிரதிப்பெயர்
  choice: அவர்களை
  alternative: அவற்றை
  rationale: எபிரெய இலக்கணத்தின் ஆண்பால் பன்மையை பிரதிபலிக்கிறது; அதே நேரத்தில் முன் கூறப்பட்ட மனிதரும் மிருகங்களும் சேர்ந்த குறிப்பின் பதற்றத்தைத் தீர்த்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு கண்ணியத்துடன் பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தின் மனிதர்–மிருகம் இணை அமைப்பும் தேவனுடைய உரிமைக் கூற்றும் புனிதமாகப் பிரித்துவைக்கும் கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
