  rationale: மனிதர் மற்றும் மிருகங்களாகிய இரு வகைகளின் முதற்பேறுகளையும் சுட்டும் தமிழ்ப் பிரதிப்பெயரைச் சரிசெய்துள்ளேன். முதல் வாக்கியத்தின் சொல் அமைப்பு மனிதர்–மிருகம் என்ற மூல இணை அமைப்பைத் தெளிவாக்கும் வகையில் மட்டுமே மாற்றப்பட்டுள்ளது; பொருளோ இறையியல் வலியுறுத்தலோ மாற்றப்படவில்லை.
