  source_fidelity: மூலத்தின் உடைமைக் கூற்று, மனிதர்–மிருகம் இணை அமைப்பு, எகிப்தின் முதற்பேறுகள் மீது நிகழ்ந்த அடித்தல், மற்றும் முதற்பேறுகளை தேவனுக்கெனப் புனிதமாக ஒதுக்குதல் ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் אֹתָם என்பது மனிதரும் மிருகங்களும் அடங்கிய ‘முதற்பேறுகள்’ என்னும் கூட்டுக் குறிப்பைச் சுட்டுகிறது; தமிழில் ‘அவர்களை’ மனிதர்களுக்கு மட்டும் இயல்பாகச் சுட்டுவதால் பொருளைத் தேவையின்றி குறுக்குகிறது.
  naturalness: ‘பிறக்கும் ஒவ்வொரு முதற்பேறும்’ புரியக்கூடியதாயினும், ‘மனிதரிலும் மிருகங்களிலும் உள்ள ஒவ்வொரு முதற்பேறும்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் மூலத்தின் வகைப்பாட்டு இணை அமைப்புக்கு நெருக்கமாகவும் உள்ளது. கலப்பு மனிதர்–மிருகம் குறிப்புக்குப் பின்வரும் பிரதிப்பெயராக ‘அவற்றை’ இயல்பானது.
  terminology: ‘எனக்குச் சொந்தம்’ உடைமை/உரிமைப் பொருளைத் துல்லியமாகத் தருகிறது. ‘பரிசுத்தமாகப் பிரித்துவைத்தேன்’ הִקְדַּשְׁתִּי என்பதன் புனிதமாக ஒதுக்குதல் என்ற கருத்தைத் தக்கவைக்கிறது. ‘முதற்பேறு’ இங்கு மனிதர் மற்றும் மிருகம் ஆகிய இரண்டுக்கும் பொதுவான சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
