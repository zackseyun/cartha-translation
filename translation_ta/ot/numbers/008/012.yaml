base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: ta
  text: பின்பு லேவியர்கள் தங்கள் கைகளை அந்தக் காளைகளின் தலைகள்மேல் வைக்க வேண்டும். லேவியர்களுக்காகப் பாவநிவிர்த்தி செய்ய, நீ ஒரு காளையைப் பாவநிவாரணப் பலியாகவும் மற்றொன்றைத் தகனபலியாகவும் யாவேக்குச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை ... வைக்க வேண்டும்
  rationale: பலியிடும் சடங்கில் விலங்கின்மேல் கைகளை வைக்கும் செயலை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: அந்தக் காளைகளின் தலைகள்மேல்
  rationale: எபிரெயத்தில் ‘தலை’ ஒருமையாக இருந்தாலும், இரண்டு காளைகளுக்கும் தனித்தனியாகச் செய்யப்படும் செயலைத் தமிழில் பகிர்நிலைப் பன்மையால் தெளிவாகக் காட்டுகிறது.
- source_word: וַעֲשֵׂה
  choice: நீ ... செலுத்த வேண்டும்
  rationale: பலிகளைப் பொருளாகக் கொண்ட עשה என்பதன் சடங்குசார் பொருள் ‘பலியாகச் செலுத்து’; வினைச்சொல்லின் ஒருமை முன்னிலையையும் வெளிப்படுத்துகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: ஆசாரியச் சூழலில் பாவத்துடனும் தூய்மைப்படுத்துதலுடனும் தொடர்புடைய இப்பலிக்கான பரவலாகப் புரியக்கூடிய தமிழ் சொற்றொடர்; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலைபெற்ற, சுருக்கமான தமிழ் வழக்கு.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: லேவியர்களுக்காகப் பாவநிவிர்த்தி செய்ய
  rationale: כפר என்பதன் ஆசாரிய-சடங்குசார் வலிமையைத் தக்கவைத்து, அதன் பயனாளிகளை இயல்பான தமிழில் ‘லேவியர்களுக்காக’ எனக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் நவீன தமிழில் ஒலிபெயர்க்கிறது.
- issue: כפר என்பதன் பலியியல் பொருள்
  choice: பாவநிவிர்த்தி செய்ய
  alternative: கழுவித் தூய்மைப்படுத்த / பரிகாரம் செய்ய
  rationale: குறிப்பிட்ட நிவிர்த்திக் கோட்பாட்டைத் திணிக்காமல், ஆசாரியச் சடங்கின் பரந்த இறையியல் வலிமையையும் தமிழில் நிலைபெற்ற வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதாயும் சடங்குசார் கண்ணியத்தைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. இரண்டு காளைகளைக் குறிக்கும் பகிர்நிலைப் பொருள் இயல்பான தமிழ் பன்மையால் வெளிப்படுத்தப்பட்டுள்ளது.
