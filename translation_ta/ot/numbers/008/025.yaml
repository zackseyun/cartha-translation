  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: ta
  text: ஐம்பது வயது முதல் அவன் வேலைப் பணியிலிருந்து விலக வேண்டும்; இனி அவன் அந்தப் பணியைச் செய்யக்கூடாது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேலைப் பணியிலிருந்து திரும்ப வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘திரும்புதல்’ அல்லது ‘பின்வாங்குதல்’; இங்கே அது செயற்பாட்டுப் பணியிலிருந்து விலகுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: ஐம்பது வயது முதல்
  rationale: எபிரெய வயது வரம்பைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தொடக்க வயதாகத் தெளிவாகக் காட்டுகிறது.
- source_word: יָשׁוּב
  choice: விலக வேண்டும்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்/பின்வாங்குதல்’; מן உடன் வரும் இப்பணிச் சூழலில் செயற்பாட்டுப் பணியிலிருந்து விலகுவதைக் குறிக்கிறது.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: வேலைக்குரிய பணியிலிருந்து
  rationale: צָבָא இங்கு படையைக் குறிக்காமல் நியமிக்கப்பட்ட பணியைக் குறிக்கிறது; עֲבֹדָה என்பதன் ‘வேலை’ என்ற கூறையும் தனியே தக்கவைக்க இந்த இணைப்பு பயன்படுத்தப்பட்டது.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: இனி அவன் பணியாற்றக் கூடாது
  rationale: லேவியரின் செயற்பாட்டுப் பணி தொடரக்கூடாது என்ற ஒழுங்குவிதியின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
