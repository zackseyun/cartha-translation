source:
  edition: WLC
  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: ta
  text: இவ்வாறு, இஸ்ரவேல் மக்களிடையிலிருந்து[b] லேவியர்களைப் பிரித்துவை[a]; லேவியர்கள் என்னுடையவர்களாக இருப்பார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரித்துவை’ என்பதற்கு ‘தனியாக ஒதுக்கிவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் மகன்களிடையிலிருந்து.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘லேவியர்கள் எனக்குரியவர்களாக இருப்பார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: இவ்வாறு ... பிரித்துவை
  rationale: בדל என்பதன் ஹிஃபில் வடிவம் ‘பிரித்தல்’ அல்லது ‘தனியாக ஒதுக்கிவைத்தல்’ என்று பொருள்படும். சூழலில் இது மோசேக்கு வழங்கப்படும் நடைமுறை அறிவுறுத்தல் என்பதால், வாக்கியத் தொடக்க இணைப்பை ‘இவ்வாறு’ என்றும் வினையை நேரடி கட்டளையாகவும் மொழிபெயர்த்துள்ளோம்.
- source_word: אֶת הַלְוִיִּם
  choice: லேவியர்களை
  rationale: திட்டவட்டமான பன்மை நேரடிப் பொருளை இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: מִתּוֹךְ
  choice: மக்களிடையிலிருந்து
  rationale: ஒரு பெரிய குழுவின் நடுவிலிருந்து ஒரு பகுதியைப் பிரிப்பதை இந்தச் சொல் குறிக்கிறது; ‘இடையிலிருந்து’ என்பது அந்த உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடி வடிவம் ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதால், நவீன தமிழில் தெளிவாக ‘இஸ்ரவேல் மக்கள்’ என்று தரப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְהָיוּ לִי
  choice: என்னுடையவர்களாக இருப்பார்கள்
  rationale: היה + לִי அமைப்பு உடைமை அல்லது சிறப்பான உரிமையுறவை வெளிப்படுத்துகிறது. ‘என்னுடையவர்களாக இருப்பார்கள்’ என்பது ‘எனக்குச் சொந்தமானவர்கள்’ என்ற பொருளை இயல்பாகத் தருவதுடன், வசனத்தில் இல்லாத அர்ப்பணிப்பு சார்ந்த கூடுதல் சொல்லையும் புகுத்தவில்லை.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: மூலத்தில் பெயர்ச்சொல் மீண்டும் வருவதால் உருவாகும் வலியுறுத்தலைக் காக்க, தமிழிலும் சுட்டுப்பெயரைப் பயன்படுத்தாமல் ‘லேவியர்கள்’ என்று மீண்டும் கூறப்பட்டுள்ளது.
theological_decisions:
- issue: லேவியர்களின் நிலையை உடைமையுறவாக மொழிபெயர்ப்பதா அல்லது வழிபாட்டுப் பணிக்கான அர்ப்பணிப்பாக விரித்துரைப்பதா
  choice: லேவியர்கள் என்னுடையவர்களாக இருப்பார்கள்
  alternative: லேவியர்கள் எனக்கு அர்ப்பணிக்கப்பட்டவர்களாக இருப்பார்கள்
  rationale: לִי உடன் வரும் היה இங்கு நேரடியாக தேவனுக்குரியவர்களாக இருப்பதைக் குறிக்கிறது. சுற்றுப்பகுதி வழிபாட்டுப் பணிக்கான பிரித்துவைப்பைப் பற்றியதாக இருந்தாலும், இந்தக் கூறு ‘அர்ப்பணித்தல்’ என்ற தனிச் சொல்லைப் பயன்படுத்தவில்லை; ஆகவே அந்தக் கருத்தை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் பெயர்ச்சொல் மறுபடியும் வருவது காக்கப்பட்டுள்ளது; மொழியில் வெளிப்படையாக இல்லாத சடங்கு அர்ப்பணிப்பு கருத்து சேர்க்கப்படவில்லை.
