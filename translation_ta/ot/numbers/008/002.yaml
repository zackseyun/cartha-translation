  text: דַּבֵּר֙ אֶֽל אַהֲרֹ֔ן וְ/אָמַרְתָּ֖ אֵלָ֑י/ו בְּ/הַעֲלֹֽתְ/ךָ֙ אֶת הַ/נֵּרֹ֔ת אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה יָאִ֖ירוּ שִׁבְעַ֥ת הַ/נֵּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: ta
  text: 'ஆரோனிடம் பேசி, அவனிடம் சொல்: ‘நீ விளக்குகளை அமைக்கும்போது[a], ஏழு விளக்குகளும் விளக்குத்தண்டின் முன்புறத்தை நோக்கி ஒளிவீச வேண்டும்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ விளக்குகளை ஏற்றும்போது.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “மேலே செல்லச் செய்” என்பதாகும். இச்சூழலில் அது விளக்குகளைப் பற்றவைப்பதையோ, அவை முன்னோக்கி ஒளிவீசுமாறு அவற்றை உரிய இடத்தில் அமைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: ஆரோனிடம் பேசி, அவனிடம் சொல்
  rationale: எபிரெய மூலத்தில் உள்ள ‘பேசு ... சொல்’ என்ற இரு தனித்த பேச்சு வினைகளையும் இயல்பான தமிழ் கட்டளை நடையில் தனித்தனியாகப் பேணுகிறது.
- source_word: בְּהַעֲלֹתְךָ
  choice: நீ விளக்குகளை ஏற்றிவைக்கும்போது
  rationale: עלה என்பதன் Hiphil வடிவம் சொற்பொருளில் ‘மேலே செல்லச் செய்’ எனப் பொருள்படும்; விளக்குச் சூழலில் அது விளக்குகளை ஏற்றுவதையோ அவற்றை உரிய நிலையில் அமைப்பதையோ குறிக்கலாம். ‘ஏற்றிவைக்கும்போது’ என்பது தமிழில் இவ்விரு நுணுக்கங்களையும் இயன்றவரை இணைத்துப் பேணுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַנֵּרֹת / שִׁבְעַת הַנֵּרוֹת
  choice: விளக்குகள் / ஏழு விளக்குகளும்
  rationale: נֵר என்பது இங்கு அருவமான ஒளியை அல்ல, திருவாசஸ்தலப் பயன்பாட்டிலுள்ள விளக்குகளைக் குறிக்கிறது. எண்ணப்பட்ட ஏழும் செயலில் அடங்குவதை இயல்பான தமிழில் ‘ஏழு விளக்குகளும்’ தெளிவுபடுத்துகிறது.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: விளக்குத்தண்டின் முன்புறத்தை நோக்கி
  rationale: אֶל מוּל פְּנֵי என்ற தொடரின் திசைநோக்கிய பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘முன்புறத்தில்’ என்று வெறும் இடத்தைக் குறிப்பதைவிட விளக்குகள் எந்தத் திசையில் ஒளிவீச வேண்டும் என்பதைத் தெளிவாக்குகிறது.
- source_word: יָאִירוּ
  choice: ஒளிவீச வேண்டும்
  rationale: אור என்பதன் causative வடிவத்திலுள்ள ‘ஒளி கொடு’ என்ற கருத்தை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: הַמְּנוֹרָה
  choice: விளக்குத்தண்டு
  rationale: வழிபாட்டுப் பொருளின் பெயரை ஒலிபெயர்க்காமல் அதன் பொருளைத் தெளிவாக வழங்கும் பொதுவான தமிழ் சொல்.
