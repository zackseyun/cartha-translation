  register: நவீன நிலையான தமிழில், மரியாதையும் கட்டளைத் தொனியும் கொண்ட இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல் மீளுருவான ‘பேசி ... சொல்’ பேணப்பட்டுள்ளது; விளக்குகளை ஏற்றுதல் அல்லது அமைத்தல் குறித்த மூலமொழியின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
