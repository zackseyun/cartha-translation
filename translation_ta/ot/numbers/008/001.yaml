  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’ (יהוה); மரபாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைத் திருப்பெயரின் மூல வடிவத்தையும் மரபுவழி மாற்றீட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பது பொதுவாகப் ‘பேசுதல்’ என்று பொருள்படும். வாவ் தொடர்ச்சியால் முன்னேறும் எபிரெயக் கதைநடையைத் தமிழில் இயல்பாக வெளிப்படுத்த, தனியாக ‘மேலும்’ என்று சேர்க்காமல் வாக்கியத் தொடர்ச்சி வழியே காட்டப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; מֹשֶׁה என்ற பெயருக்கு வழக்கிலுள்ள தமிழ் வடிவமான ‘மோசே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்து நேரடிப் பேச்சு வருவதை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரை, தமிழில் இயல்பான ‘இவ்வாறு பேசினார்:’ என்ற அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரே உள்ளது. ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தருகிறது; ‘ஆண்டவர்’ என்பது மரபுவழி மாற்றீடு, ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பு.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத் தமிழ். அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை எதிர்நோக்கி இரட்டைப்புள்ளியுடன் முடிக்கப்படுகிறது.
