base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: ta
  text: 'விளக்குத்தண்டின் வேலைப்பாடு இதுவே: பொன்னால் அடித்துத் தட்டிய வேலை[a]. அதன் அடிப்பகுதியிலிருந்து அதன் பூ அலங்காரங்கள் வரை அது அடித்துத் தட்டிய வேலையாக இருந்தது. யாவே மோசேக்குக் காண்பித்த வடிவத்தின்படி[b], அப்படியே அவன் விளக்குத்தண்டைச் செய்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுத்தியலால் அடித்து வடிவமைக்கப்பட்ட வேலை.’ எபிரேயச் சொல் உலோகத்தை அடித்து உருவாக்கியதை வலியுறுத்துகிறது; ‘ஒரே துண்டால் செய்யப்பட்ட வேலை’ என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: ‘வடிவத்தின்படி’ என்பதை ‘தோற்றத்தின்படி’ அல்லது ‘யாவே மோசேக்குக் காண்பித்த தரிசனத்தின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
