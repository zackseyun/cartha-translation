  choice: வேலைப்பாடு
  rationale: விளக்குத்தண்டு எவ்வாறு கைவினையாக உருவாக்கப்பட்டது என்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: வழிபாட்டுக்குரிய பொருளின் பெயரை ஒலிபெயர்க்காமல், அதன் செயலையும் அமைப்பையும் தெளிவாகச் சொல்லும் பொதுத் தமிழ் சொல்.
- source_word: מִקְשָׁה
  choice: அடித்துச் செய்யப்பட்ட வேலை
  rationale: உலோகத்தைச் சுத்தியலால் அடித்து வடிவமைத்ததைக் குறிக்கும் முதன்மைப் பொருளைப் பாதுகாக்கிறது; ‘ஒரே துண்டு’ என்பது சாத்தியமான உட்கருத்தாக இருந்தாலும் முதன்மை மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- source_word: זָהָב
  choice: பொன்
  rationale: பொருளைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: அதன் அடிப்பகுதிமுதல் அதன் பூவரை
  rationale: இரு எல்லைகளையும் தமிழில் இயல்பான ‘முதல்...வரை’ அமைப்பில் தருகிறது; יָרֵךְ இச்சூழலில் அடிப்பகுதியையும் פֶּרַח பூ வடிவ அலங்காரத்தையும் குறிக்கிறது.
- source_word: כַּמַּרְאֶה
  choice: வடிவத்தின்படியே
  rationale: மோசேக்குக் காண்பிக்கப்பட்ட தோற்றம், மாதிரி அல்லது தரிசனம் என்ற பொருள் வரம்பில், கட்டுமானச் சூழலுக்கேற்ற ‘வடிவம்’ என்பதைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: הֶרְאָה
  choice: காண்பித்த
  rationale: ראה வினையின் காரணவினை வடிவமான ‘காண்பித்தல்’ என்பதை நேரடியாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் தெய்வீகப் பெயரின் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவத்தைப் பயன்படுத்தி, பொதுப்பெயரான ‘கர்த்தர்’ என்பதுடன் கலக்காமல் மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: כֵּן עָשָׂה
  choice: அப்படியே அவன் செய்தான்
  rationale: ‘எப்படிக் காண்பிக்கப்பட்டதோ, அப்படியே செய்தான்’ என்ற தொடர்பைத் தமிழில் வலியுறுத்துகிறது; எபிரேயத்தில் மறைந்துள்ள ஆண்பால் ஒருமை செய்பவரை ‘அவன்’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது. உயிரொலிப்பின் வரலாற்றுச் சர்ச்சையை வசனம் தீர்மானிக்காததால், தமிழில் பரவலாக அறியப்பட்ட வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: עָשָׂה என்பதன் மறைந்த எழுவாய்
  choice: அவன் விளக்குத்தண்டைச் செய்தான்
  alternative: விளக்குத்தண்டு செய்யப்பட்டது
  rationale: மூல வினை செயப்பாட்டு வடிவில் இல்லை; ஆண்பால் ஒருமை எழுவாய் சூழலில் கைவினைஞரைச் சுட்டுவதாக இயல்பாகப் புரிகிறது. குறிப்பிட்ட நபரின் பெயரைச் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: כַּמַּרְאֶה என்பதன் பொருள்
  choice: வடிவத்தின்படி
  alternative: தோற்றத்தின்படி / தரிசனத்தின்படி
  rationale: கூடாரப் பொருள் உருவாக்கும் சூழலில் காட்டப்பட்ட மாதிரி அல்லது வடிவம் முதன்மையாகத் தெரிகிறது; எனினும் ‘தோற்றம்’ அல்லது ‘தரிசனம்’ என்ற உண்மையான சொற்பொருள் சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. מִקְשָׁה இருமுறை வருவதால் ‘அடித்துச் செய்யப்பட்ட’ என்ற கருத்து இரு இடங்களிலும் மீளத் தரப்பட்டுள்ளது. வாக்கிய அமைப்பு எபிரேயத்தின் வலியுறுத்தலைப் பாதுகாத்தபடியே தமிழில் இயல்பாகப் பிரிக்கப்பட்டுள்ளது.
