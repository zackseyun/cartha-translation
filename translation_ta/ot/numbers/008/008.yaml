base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: ta
  text: பின்பு அவர்கள் ஓர் இளங்காளையையும், அதற்குரிய எண்ணெய் கலந்த மெல்லிய மாவினாலான தானியக் காணிக்கையையும் எடுத்துக்கொள்ள வேண்டும். நீ இரண்டாவது இளங்காளையைப் பாவநிவாரணப் பலியாக[a] எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.” எபிரெயச் சொல் חַטָּאת ஆசாரியச் சடங்குச் சூழல்களில் பாவநிவாரணப் பலியையோ தூய்மைப்படுத்தும் பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: பின்பு அவர்கள் ... எடுத்துக்கொள்ள வேண்டும்
  rationale: சடங்குமுறை அறிவுறுத்தலின் தொடர்ச்சியைக் காட்டும் வாவ் இணைப்பையும், மூன்றாம் நபர் பன்மை வினையின் கட்டளைசார் எதிர்கால வலிமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: פַּר בֶּן בָּקָר
  choice: ஓர் இளங்காளை
  rationale: சொல்லுக்கு சொல் ‘மாட்டினத்தின் மகனான காளை’ என்ற எபிரெய மரபுத்தொடர் ஓர் இளம் ஆண் மாட்டைக் குறிக்கிறது; பின்னர் வரும் ‘இரண்டாவது’ என்பதோடு தெளிவாகப் பொருந்த ‘ஓர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּמִנְחָתוֹ
  choice: அதனுடன் செலுத்த வேண்டிய ... தானியக் காணிக்கை
  rationale: பலியிடும் சூழலில் מִנְחָה என்பது பொதுவான காணிக்கையல்ல, தானியக் காணிக்கையைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு முதல் காளையோடு இணைந்த காணிக்கையைச் சுட்டுகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிகளுக்குப் பயன்படுத்தப்பட்ட நன்கு அரைக்கப்பட்ட மாவைக் குறிக்கும் வழிபாட்டுச் சொல்.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெய் கலந்து பிசைந்த
  rationale: மாவும் எண்ணெயும் கலந்து தயாரிக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிசைந்த’ என்பது மாவின் தயாரிப்பு முறையைத் தெளிவாக்குகிறது.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: நீ இரண்டாவது இளங்காளையை ... எடுத்துக்கொள்ள வேண்டும்
  rationale: எபிரெயத்தில் மூன்றாம் நபர் பன்மையிலிருந்து இரண்டாம் நபர் ஆண்பால் ஒருமைக்கு ஏற்படும் தெளிவான மாற்றத்தை ‘நீ’ என்று பாதுகாக்கிறது; שֵׁנִי என்பதற்கு ‘இரண்டாவது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: ஆசாரியச் சடங்குச் சூழலில் חַטָּאת என்பது பாவத்துடன் தொடர்புடைய பலியையும் தூய்மைப்படுத்தும் செயல்பாட்டையும் குறிக்கக்கூடும். தமிழில் வழக்கமான சடங்குசார் பொருளை ‘பாவநிவாரணப் பலி’ தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பலிச் சட்டத்தில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாரம்பரியமாகப் பாவத்திற்கான பலியைக் குறித்தாலும், ஆசாரியச் சடங்குகளில் அதன் தூய்மைப்படுத்தும் செயல்பாடும் முக்கியமானது. முதன்மை உரை பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லைப் பயன்படுத்துகிறது; சொல்லின் உண்மையான பொருள் விரிவைச் சுருக்காமல் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான சடங்குசார் நடையில் அமைக்கப்பட்டது. எபிரெய வினையின் நபர் மாற்றம் ‘அவர்கள்’ என்பதிலிருந்து ‘நீ’ என்பதற்கு மாறுவது பாதுகாக்கப்பட்டுள்ளது.
