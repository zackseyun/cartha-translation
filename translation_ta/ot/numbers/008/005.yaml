lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்னும் வினைச்சொல்லுடன் வரும் வழக்கமான எபிரெயக் கதைநடைப் பேச்சு அறிமுகத்தை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்ததாக நேரடிப் பேச்சு வருவதை எபிரெயச் சொல் குறிக்கிறது; தமிழில் முக்காற்புள்ளி இதை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; உச்சரிப்பு உறுதியற்றிருப்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். எபிரெயப் பேச்சு அறிமுகத்தின் பொருள் காக்கப்பட்டு, தமிழில் இயல்பில்லாத ‘சொல்லும்படியாக’ போன்ற கட்டமைப்பு தவிர்க்கப்பட்டுள்ளது.
