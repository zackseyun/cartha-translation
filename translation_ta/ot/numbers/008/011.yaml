  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: ta
  text: ஆரோன் லேவியர்களை இஸ்ரவேல் மக்களிடமிருந்து[b] யெகோவாவின் முன்னிலையில் அசைவாட்டுக் காணிக்கையாகச் சமர்ப்பிக்க வேண்டும்[a]. அவர்கள் யெகோவாவுக்குரிய சேவையைச் செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோன் லேவியர்களை யெகோவாவின் முன்னிலையில் அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்.” ‘அசைவாட்ட வேண்டும்’ என்ற வினைச்சொல்லும் ‘அசைவாட்டுக் காணிக்கை’ என்ற பெயர்ச்சொல்லும் எபிரெயத்தில் ஒரே வேர்ச்சொல்லிலிருந்து வருகின்றன; இது ஒரு சடங்குமுறை சமர்ப்பித்தலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் மக்களிடமிருந்து” என்பதை “இஸ்ரவேல் மக்களின் சார்பாக” என்றும் புரிந்துகொள்ளலாம். அதாவது, யெகோவாவுக்குரிய சேவையில் இஸ்ரவேலரின் பிரதிநிதிகளாக லேவியர்கள் சமர்ப்பிக்கப்படுகிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாகச் சமர்ப்பிக்க வேண்டும்
  rationale: வினைச்சொல்லும் பெயர்ச்சொல்லும் ஒரே נוף வேரைச் சேர்ந்தவை; இது ஒரு சடங்குமுறை சமர்ப்பித்தலைக் குறிக்கிறது. மனிதர்களான லேவியர்களை நேரடியாக ‘அசைவாட்டுதல்’ என்று மட்டும் கூறுவதால் ஏற்படும் தவறான புரிதலைத் தவிர்த்து, தொழில்நுட்பச் சொல்லான ‘அசைவாட்டுக் காணிக்கை’ என்பதைக் காக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களுக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: தெய்வீக முன்னிலையைக் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் தருகிறது; יהוה என்பது ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடமிருந்து
  rationale: מֵאֵת என்பதன் முதன்மையான மூல/தோற்றப் பொருளைத் தக்கவைக்கிறது. בְּנֵי יִשְׂרָאֵל என்பது முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான கூட்டுப்பெயர் என்பதால், இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்று தரப்படுகிறது.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: அப்போது அவர்கள் யெகோவாவின் பணியைச் செய்வதற்குரியவர்கள் ஆவார்கள்
  rationale: சமர்ப்பித்தலின் விளைவாக அவர்கள் யெகோவாவுக்கான வழிபாட்டுப் பணியைச் செய்யத் தகுந்த நிலைக்கு வருவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; עבד/עֲבֹדָה என்ற சொல் ஒலியைச் செயற்கையாகத் திரும்பக் கூறாமல் அதன் நோக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவியர்கள் ‘அசைவாட்டுக் காணிக்கை’ என வழங்கப்படுதல்
  choice: அசைவாட்டுக் காணிக்கையாகச் சமர்ப்பிக்க வேண்டும்
  alternative: லேவியர்களை அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: லேவியர்கள் பலியிட்டுக் கொல்லப்படுகிறார்கள் என்று உணர்த்தாமல், அவர்களுடைய அர்ப்பணிப்பை காணிக்கைச் சடங்கின் மொழியில் எபிரெய உரை விவரிப்பதைத் தக்கவைக்கிறது.
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל என்பதன் தொடர்புப் பொருள்
  choice: இஸ்ரவேல் மக்களிடமிருந்து
  alternative: இஸ்ரவேல் மக்களின் சார்பாக
  rationale: இலக்கணப்படி ‘மக்களிடமிருந்து’ என்பது நேரடியான வாசிப்பு. எனினும், லேவியர்கள் இஸ்ரவேலரின் பிரதிநிதிகளாகச் சமர்ப்பிக்கப்படுகிறார்கள் என்ற சூழல்சார் பொருளையும் அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. சடங்குசார் தொழில்நுட்பச் சொல்லான ‘அசைவாட்டுக் காணிக்கை’ தக்கவைக்கப்பட்டு, அதன் பொருள் வினைச்சொல் மற்றும் அடிக்குறிப்பின் மூலம் தெளிவாக்கப்பட்டுள்ளது.
