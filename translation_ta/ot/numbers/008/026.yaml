review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between permitted continued ministry (ושרת) and prohibited work/service (ועבדה לא יעבד), as well as the setting at the tent of meeting. However, “வழக்கமான” adds a qualification not stated in this verse, and the final instruction should retain the singular addressee, “you,” of תעשה.
  naturalness: “ஒப்படைக்கப்பட்ட பொறுப்பைக் காப்பதில் பணிபுரியலாம்” is understandable but somewhat cumbersome. Recasting the purpose clause as “பொறுப்பைக் காக்கச் சேவை செய்யலாம்” is more natural modern Tamil while retaining the Hebrew cognate-duty expression.
  terminology: “சந்திப்புக் கூடாரம்” and “லேவியர்கள்” are appropriate established terms. “சேவை செய்யலாம்” for the permitted ministerial activity and “பணியைச் செய்யக்கூடாது” for the prohibited עבודה preserve the intended distinction without importing an unsupported description such as “regular.”
  issues:
  - severity: medium
    issue: The qualifier “வழக்கமான” is added to the prohibited work.
    rationale: עֲבֹדָה does not itself say “regular” in this verse. The contextual distinction may suggest differing kinds of activity, but the translation should not state that qualification as part of the text.
  - severity: medium
    issue: The closing imperative is rendered impersonally.
    rationale: ככה תעשה is addressed to a singular “you.” “லேவியர்களின் பொறுப்புகள் தொடர்பாக நீ செய்ய வேண்டும்” retains the addressee and instructional force.
  - severity: low
    issue: The phrase for keeping the charge is syntactically heavy.
    rationale: “பொறுப்பைக் காக்கச் சேவை செய்யலாம்” expresses the purpose relationship more idiomatically and keeps the sense of an entrusted duty.
  revised_text: ஆனால் அவன் சந்திப்புக் கூடாரத்தில் தன் சகோதரர்களுடன் சேர்ந்து, பொறுப்பைக் காக்கச் சேவை செய்யலாம்; ஆனால் பணியைச் செய்யக்கூடாது.[a] லேவியர்களின் பொறுப்புகள் தொடர்பாக நீ செய்ய வேண்டியது இவ்வாறே.
