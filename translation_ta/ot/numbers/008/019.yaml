    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה ... הַלְוִיִּם נְתֻנִים
  choice: லேவியர்களை ஒரு கொடையாக ... கொடுத்திருக்கிறேன்
  rationale: נתן என்ற வேர்ச்சொல்லின் மீளுரைப்பைத் தமிழில் ‘கொடையாக ... கொடுத்திருக்கிறேன்’ என்று இயல்பாகப் பிரதிபலிக்கிறது; செயல் முடிந்து அதன் விளைவு தொடர்வதையும் நிகழ்கால நிறைவுவினை உணர்த்துகிறது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவனுடைய மகன்களுக்கும்
  rationale: לְ குறிக்கும் பெறுநர்களை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் புத்திரரிடமிருந்து
  rationale: பெரிய சமூகத்தின் நடுவிலிருந்து லேவியர்கள் தேர்ந்தெடுக்கப்பட்டதைக் காட்டுகிறது; בְּנֵי יִשְׂרָאֵל என்பதன் உருவக அமைப்பையும் தக்கவைக்கிறது.
- source_word: לַעֲבֹד אֶת עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் புத்திரர்களுக்குரிய பணியைச் செய்வதற்காக
  rationale: עבד என்ற வேரின் வினை–பெயர் இணைப்பை வாசிக்க இயல்பான தமிழில் தருகிறது; இந்தப் பணி இஸ்ரவேலரின் சார்பானது என்ற சூழலையும் வெளிப்படுத்துகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: மோசேயின் கூடாரத்திற்கான எபிரெயப் பெயரைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: וּלְכַפֵּר עַל
  choice: அவர்களுக்காகப் பாவநிவிர்த்தி செய்வதற்காக
  rationale: ஆசரிப்புக் கூடாரச் சூழலில் כפר குறிக்கும் நிவிர்த்தி/பரிகாரச் செயலுக்கான புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ்; அதன் செயல்முறையை மேலதிகமாக விளக்கவில்லை.
- source_word: נֶגֶף
  choice: கொள்ளைநோய்
  rationale: பரிசுத்த எல்லையை மீறுவதால் வரும் தெய்வீகத் தாக்குதல் அல்லது பேரழிவை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: בְּגֶשֶׁת
  choice: நெருங்கும்போது
  rationale: בְּ உடன் வரும் வினையெச்சத்தின் காலச்சூழலை இயல்பான தமிழ் காலவாக்கியமாக்குகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு அருவமான பரிசுத்தத்தைக் காட்டாமல், அணுகக்கூடிய புனிதப் பகுதியைக் குறிக்கிறது; ‘பரிசுத்த ஸ்தலம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: லேவியர்களின் பணியும் நிவிர்த்திப் பங்கும்
  choice: லேவியர்கள் இஸ்ரவேலருக்குரிய பணியைச் செய்து, அவர்களுக்காகப் பாவநிவிர்த்தி செய்கிறார்கள் என்று வசனம் சொல்வதை நேரடியாகத் தக்கவைத்தல்
  alternative: லேவியர்கள் நடைமுறை உதவியை மட்டுமே செய்கிறார்கள்; நிவிர்த்தியில் அவர்களுக்கு எந்தப் பங்கும் இல்லை என்று விளக்குதல்
  rationale: மூலவசனம் சேவையையும் כפר செயலையும் லேவியர்களோடு வெளிப்படையாக இணைக்கிறது. பின்னைய ஆசாரியப் பிரிவுகளைக் கொண்டு இந்த இறையியல் அழுத்தத்தை நீக்கக் கூடாது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் புத்திரர்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: எபிரெய உடன்படிக்கைச் சமூகப் பெயரின் ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; வாசகருக்கான இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: הַקֹּדֶשׁ என்பதன் எல்லை
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்த ஸ்தலம்
  rationale: குறிப்பிட்ட உள் அறையா அல்லது விரிவான பரிசுத்த வளாகமா என்பதைத் தேவையின்றி முடிவுசெய்யாமல், மூலத்தின் சாத்தியமான பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீளமான எபிரெய வாக்கியம் மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் நோக்கவாக்கியங்களும் காரண–விளைவு தொடர்பும் காக்கப்பட்டுள்ளன. ‘பாவநிவிர்த்தி’, ‘சந்திப்புக் கூடாரம்’, ‘பரிசுத்த இடம்’ ஆகியவை வழிபாட்டுச் சூழலின் தனித்தன்மையைத் தெளிவாக வைத்திருக்கின்றன.
