  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: ta
  text: 'நான் இஸ்ரவேல் புத்திரர்களின் நடுவிலிருந்து[b] லேவியர்களை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் கொடையாகக் கொடுத்திருக்கிறேன்[a]; அவர்கள் சந்திப்புக் கூடாரத்தில் இஸ்ரவேல் புத்திரர்களின் சேவையைச் செய்வதற்காகவும், இஸ்ரவேல் புத்திரர்களுக்காகப் பாவநிவிர்த்தி செய்வதற்காகவும், இஸ்ரவேல் புத்திரர்கள் பரிசுத்த இடத்தை[c] நெருங்கும்போது அவர்களிடையே கொள்ளைநோய் ஏற்படாதபடிக்கும் கொடுத்திருக்கிறேன்.


    [a] எபிரெய மொழியில் ‘கொடு’ என்ற வேர்ச்சொல் திரும்பவும் பயன்படுத்தப்பட்டு வலியுறுத்தப்படுகிறது. இதை இன்னும் சொல்லுக்குச் சொல்லாக, ‘லேவியர்களை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் கொடுக்கப்பட்டவர்களாகக் கொடுத்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்.


    [b] அல்லது ‘இஸ்ரவேலர்கள்.’


    [c] அல்லது ‘பரிசுத்த ஸ்தலம்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘கொடு’ என்ற வேர்ச்சொல் திரும்பவும் பயன்படுத்தப்பட்டு வலியுறுத்தப்படுகிறது. இதை இன்னும் சொல்லுக்குச் சொல்லாக, ‘லேவியர்களை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் கொடுக்கப்பட்டவர்களாகக் கொடுத்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
