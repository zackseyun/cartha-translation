source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: ta
  text: லேவியர்களை ஆரோனுக்கு முன்பாகவும் அவனுடைய மகன்களுக்கு முன்பாகவும் நிறுத்த வேண்டும்; அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாகச் சமர்ப்பிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்.” எபிரெயத்தில் சடங்கு முறையிலான அசைவாட்டுதலை அல்லது சமர்ப்பித்தலைக் குறிக்கும் வினைச்சொல்லும், ‘அசைவாட்டுக் காணிக்கை’ என்ற பெயர்ச்சொல்லும் ஒன்றாகப் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: நிறுத்தி
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்’ அல்லது ‘ஒரு நிலையில் நிறுத்து’ எனப் பொருள்படும். சடங்கிற்காக லேவியர்களை ஆரோனுக்கும் அவன் மகன்களுக்கும் முன்பாக நிறுத்துவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான தமிழ்ப் பெயர்; எபிரெய நேரடிச் செயப்படுபொருள் அமைப்பும் தமிழில் ‘-ஐ’ உருபால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு ஒருவரின் முன்னிலையில் சடங்கு முறையில் நிறுத்தப்படுவதைக் குறிக்கிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இச்சூழலில் ஆரோனின் ஆண் பிள்ளைகளாகிய ஆசாரியர்களைக் குறிப்பதால் ‘மகன்கள்’ என்று பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהֵנַפְתָּ
  choice: செலுத்த வேண்டும்
  rationale: נוף என்பதன் ஹிஃபில் வடிவம் சடங்கு சார்ந்த அசைவாட்டுதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது. மனிதர்களைப் பொருளாகக் கொண்டிருப்பதால், இயல்பான தமிழில் சடங்கு சமர்ப்பிப்பை ‘செலுத்த வேண்டும்’ எனக் கூறி, குறிப்பான அசைவாட்டுச் செயலை அடுத்த பெயர்ச்சொல்லிலும் அடிக்குறிப்பிலும் பாதுகாக்கிறது.
- source_word: תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கை
  rationale: ஆசாரியச் சடங்கில் பயன்படுத்தப்படும் குறிப்பான தொழில்நுட்பச் சொல்லைத் தக்கவைக்கும் தமிழாக்கம்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל என்ற முன்னொட்டு காணிக்கை யாருக்கு செலுத்தப்படுகிறது என்பதைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: லேவியர்கள் தொடர்பான சடங்குச் செயலை வெளிப்படுத்துதல்
  choice: அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாகச் செலுத்த வேண்டும்
  alternative: அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: எபிரெயத்தில் נוף என்ற வினையும் תְּנוּפָה என்ற அதே வேரைச் சேர்ந்த பெயரும் இணைந்து வருகின்றன. முதன்மை உரை சடங்கின் பொருளை இயல்பான தமிழில் வழங்குகிறது; மூலத்தின் சொல்விளையாட்டையும் சாத்தியமான உடல் அசைவையும் அடிக்குறிப்பு வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கட்டளை நடையைப் பயன்படுத்துகிறது. முந்தைய வசனங்களிலிருந்து தொடரும் கட்டளைத் தொடரை உணர்த்த ‘நிறுத்தி … செலுத்த வேண்டும்’ என்ற அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘அசைவாட்டுக் காணிக்கை’ என்ற சடங்கியல் சொல் அதன் குறிப்பான பொருளைத் தக்கவைக்கிறது.
