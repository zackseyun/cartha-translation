revisions:
- from: லேவியர்களை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் முன்பாக நிறுத்தி, அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாகச் செலுத்த வேண்டும்.[a]
  to: லேவியர்களை ஆரோனுக்கு முன்பாகவும் அவனுடைய மகன்களுக்கு முன்பாகவும் நிறுத்த வேண்டும்; அவர்களை யாவேக்கு அசைவாட்டுக் காணிக்கையாகச் சமர்ப்பிக்க வேண்டும்.[a]
