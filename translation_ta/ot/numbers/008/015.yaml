  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: ta
  text: அதற்குப் பிறகு லேவியர்கள் சந்திப்புக் கூடாரத்தில் பணிசெய்ய வருவார்கள். நீ அவர்களைத் தூய்மைப்படுத்தி,[a] அவர்களை அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுத்திகரித்து.’ எபிரெய வினைச்சொல் வழிபாட்டுச் சடங்குக்குரிய தூய்மையாக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கர்த்தரின் முன்னிலையில் அவர்களை அசைவாட்டுக் காணிக்கையாகச் சடங்குமுறையில் முன்நிறுத்த வேண்டும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய அர்ப்பணிப்புச் சடங்குகளுக்குப் பின் வரும் அடுத்த கட்டத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָבֹאוּ הַ/לְוִיִּם
  choice: லேவியர்கள் ... வருவார்கள்
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ என்பதையும், சூழலில் உள்ள எதிர்கால அறிவுறுத்தல் உணர்வையும் காக்கிறது.
- source_word: לַ/עֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில் பணிசெய்ய
  rationale: עבד என்பதன் வழிபாட்டுச் சூழலிலான சேவையை ‘பணிசெய்ய’ எனத் தெளிவாகக் காட்டுகிறது; எபிரெய கட்டமைப்பை இயல்பான தமிழ் இடவியல் தொடராக வழங்குகிறது.
- source_word: וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם
  choice: நீ அவர்களைத் தூய்மைப்படுத்தி
  rationale: טהר குறிக்கும் சடங்குசார் தூய்மையாக்கத்தைப் பாதுகாக்கிறது; இது பொதுவான உடல் சுத்தம் மட்டுமல்ல என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה
  choice: அவர்களை அசைவாட்டும் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: லேவியர்களே சடங்குமுறையில் ‘அசைவாட்டப்படுகிறார்கள்’ என்ற மூலத்தின் வியப்பூட்டும் நேரடிப் படிமத்தை மழுங்கடிக்காமல் காக்கிறது.
theological_decisions:
- issue: லேவியர்களின் அர்ப்பணிப்புக்குரிய சடங்கு மொழி
  choice: ‘தூய்மைப்படுத்தி’ மற்றும் ‘அசைவாட்டும் காணிக்கையாக அசைவாட்ட’ என்ற வெளிப்படையான சடங்குச் சொற்களைத் தக்கவைத்தல்
  alternative: ‘அர்ப்பணித்து முன்நிறுத்த வேண்டும்’ என்று பொதுப்படையாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் வெறும் பதவியளிப்பை அல்ல, குறிப்பிட்ட வழிபாட்டுச் சடங்குகளை விவரிக்கிறது. ஆகவே சடங்குசார் தன்மையும் மூலத்தின் உருவகத் திணிவும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘அசைவாட்டும் காணிக்கை’ ஆகியவை வழிபாட்டுச் சூழலைத் தெளிவாகக் காக்கின்றன; மூலத்தில் லேவியர்களே அசைவாட்டப்படுவது என்ற பதற்றம் விளக்கவுரையாக மாற்றப்படவில்லை.
