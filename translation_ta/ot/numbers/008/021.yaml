base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: ta
  text: லேவியர்கள் தങ്ങളെத் தூய்மைப்படுத்தினார்கள்; தங்கள் ஆடைகளைத் துவைத்தார்கள். ஆரோன் அவர்களை யாவே முன்னிலையில் அசைவாட்டுக் காணிக்கையாக[a] அர்ப்பணித்தார். அவர்களைத் தூய்மைப்படுத்துவதற்காக ஆரோன் அவர்களுக்காகப் பாவநிவிர்த்தி செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசைவாட்டுக் காணிக்கையாக அவர்களை அசைத்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரேய மொழியில், ஒன்றை யாவே முன்னிலையில் சடங்குமுறைப்படி அர்ப்பணிப்பதற்குப் பயன்படுத்தப்படும் வழக்கமான சொற்றொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டு
  rationale: חטא என்பதன் ஹித்பயேல் வடிவம் இங்கே பாவம் செய்தல் என்பதைக் குறிக்காமல், சடங்குசார் தூய்மைப்படுத்தலைத் தாமே மேற்கொண்டதைக் குறிக்கிறது. ‘பாவத்திலிருந்து’ என்பதை மூலவசனம் வெளிப்படையாகச் சொல்லாததால் சேர்க்கப்படவில்லை.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: குறிப்பிட்ட கோத்திரத்தாரைக் குறிக்கும் பெயருக்கு இயல்பான, வழக்கிலுள்ள தமிழ் வடிவம்.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: தங்கள் ஆடைகளைத் துவைத்தார்கள்
  rationale: בגד என்பதன் பொருளையும், தூய்மைப்படுத்தும் சூழலில் நிகழ்ந்த செயலைவும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாக அர்ப்பணித்தார்
  rationale: இது யாவே முன்னிலையில் செய்யப்படும் சடங்குமுறை அர்ப்பணிப்பைக் குறிக்கும் நிலையான எபிரேயச் சொற்றொடர். லேவியர்களை முரட்டுத்தனமாக உடலளவில் அசைத்தார் என்ற தேவையற்ற எண்ணத்தைத் தவிர்த்து, சடங்கின் தன்மையைத் தெரிவிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற உறவுப்பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: அவர்களுக்காகப் பாவநிவிர்த்தி செய்தார்
  rationale: ஆசாரிய மற்றும் பலிசார் சூழலில் כפר என்பதற்குரிய கருத்தை, தமிழில் அறியப்பட்ட இறையியல் சொல்லால் வழங்குகிறது.
- source_word: לְטַהֲרָם
  choice: அவர்களைத் தூய்மைப்படுத்துவதற்காக
  rationale: ஆரோனின் பாவநிவிர்த்திச் செயலின் நோக்கத்தைத் தெரிவிக்கும் எபிரேய முன்னொட்டு לְ உடன் வந்த வினையெச்சத்தின் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: חטא, כפר, טהר ஆகிய ஆசாரியச் சொற்களின் வேறுபாட்டைப் பாதுகாத்தல்
  choice: ‘தங்களைத் தூய்மைப்படுத்திக்கொண்டு,’ ‘பாவநிவிர்த்தி செய்தார்,’ ‘தூய்மைப்படுத்துவதற்காக’
  alternative: ‘தங்களைப் பாவத்திலிருந்து சுத்திகரித்துக்கொண்டு,’ ‘பரிகாரம் செய்தார்,’ ‘சுத்தமாக்குவதற்காக’
  rationale: வசனம் லேவியர்களின் சடங்குசார் தூய்மைப்படுத்தலையும், ஆரோன் செய்த பாவநிவிர்த்தியையும், அதன் நோக்கமான தூய்மையையும் தொடர்புடைய ஆனால் தனித்த கருத்துகளாகக் கூறுகிறது. முதல் வினையில் மூலவசனம் வெளிப்படையாகச் சொல்லாத ‘பாவத்திலிருந்து’ என்பது சேர்க்கப்படவில்லை.
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: லேவியர்களை תְּנוּפָה ஆக முன்வைத்த சடங்கை விவரித்தல்
  choice: அசைவாட்டுக் காணிக்கையாக அர்ப்பணித்தார்
  alternative: அசைவாட்டுக் காணிக்கையாக அவர்களை அசைத்தார்
  rationale: எபிரேயச் சடங்குமொழியின் உண்மையான படிமத்தை மறைக்காமல், மனிதர்களான லேவியர்கள் குறித்து இயல்பான தமிழில் அர்ப்பணிப்பின் பொருளை முதன்மைப்படுத்துகிறது. அதிக நேரடியான சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சடங்குசார் கண்ணியத்தைப் பேணும் வகையிலும் மொழியாக்கம் செய்யப்பட்டுள்ளது. நீளமான எபிரேய இணைப்புத் தொடரை தமிழில் மூன்று இயல்பான வாக்கியங்களாகப் பிரித்தாலும், செயல்களின் வரிசையும் நோக்கமும் பாதுகாக்கப்பட்டுள்ளன.
