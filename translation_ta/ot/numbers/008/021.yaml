  source_fidelity: 'The draft accurately represents the Hebrew sequence: the Levites underwent ritual purification, washed their garments, Aaron presented them as a תְּנוּפָה before Yahweh, and Aaron made atonement for the purpose of cleansing them. “யாவே,” “பாவநிவிர்த்தி செய்தார்,” and the purpose clause are suitable. A small adjustment is needed because “தூய்மைப்படுத்திக்கொண்டு” can make the purification sound merely preparatory to washing, whereas the Hebrew coordinates two distinct actions.'
  naturalness: The Tamil is clear and appropriately dignified. Recasting the first two actions as coordinated finite clauses is more natural and more exact in modern standard Tamil.
  terminology: “லேவியர்கள்,” “யாவே,” “அசைவாட்டுக் காணிக்கையாக,” and “பாவநிவிர்த்தி” are consistent, intelligible renderings for this ritual context. The footnote preserves the more literal ritual-action alternative without forcing an overly physical interpretation into the main text.
