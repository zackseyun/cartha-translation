  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: ta
  text: நீங்கள் எச்சரிக்கை ஒலியை[a] ஊதும்போது, கிழக்குப் பக்கத்தில் முகாமிட்டிருக்கும் முகாம்கள் புறப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமிக்ஞை ஒலியை.’ இங்கு எபிரெயச் சொல், முகாம் புறப்படுவதற்கான அடையாளமாக ஊதப்பட்ட தனித்துவமான எக்காள ஒலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: நீங்கள் ... ஊதும்போது
  rationale: תקע என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது. இணைப்புடன் வந்துள்ள இவ்வினைச்சொல் அடுத்த செயலுக்கான காலச் சூழலை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘ஊதும்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תְּרוּעָה
  choice: எச்சரிக்கை ஒலி
  rationale: இந்த எக்காளச் சமிக்ஞைச் சூழலில் תְּרוּעָה பொதுவான ஓசையையோ கூச்சலையையோ அல்ல, முகாம் புறப்படுவதற்கான தனித்துவமான எச்சரிக்கைச் சமிக்ஞை ஒலியைக் குறிக்கிறது.
- source_word: וְנָסְעוּ
  choice: புறப்பட வேண்டும்
  rationale: נסע என்பது முகாமின் நகர்வைக் குறிக்கும் இச்சூழலில் ‘புறப்படுதல்’ என்று பொருள்படும்; கட்டளையொத்த அறிவுறுத்தல் தொனியை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: הַמַּחֲנוֹת
  choice: முகாம்கள்
  rationale: பன்மை வடிவம் திருக்கூடாரத்தைச் சுற்றி அமைந்திருந்த கோத்திர முகாம் அணிகளைக் குறிக்கிறது; நேரடியான ‘முகாம்கள்’ போதுமானது.
- source_word: הַחֹנִים
  choice: முகாமிட்டிருக்கும்
  rationale: இந்த வினையெச்சம் முகாம்களின் அப்போதைய நிலையை விவரிக்கிறது; ‘முகாமிட்டிருக்கும்’ அந்த நிலைப்பொருளை இயல்பாகக் காக்கிறது.
- source_word: קֵדְמָה
  choice: கிழக்குப் பக்கத்தில்
  rationale: இங்கு இச்சொல் நகரும் திசையை அல்ல, முகாம்கள் அமைந்திருந்த கிழக்குப் பகுதியைக் குறிக்கிறது; ஆகவே இடப்பொருள் தெளிவாக மொழிபெயர்க்கப்பட்டது.
