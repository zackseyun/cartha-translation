source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: ta
  text: பென்யமீன் மக்களின் கோத்திரப் படைப்பிரிவுக்குத் தலைவனாக கிதெயோனியின் மகன் அபிதான் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவு” என்பதற்கு “படை” அல்லது “ஒழுங்கமைக்கப்பட்ட அணி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இராணுவப் பாணியில் ஒழுங்குபடுத்தப்பட்ட குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: தலைவனாக
  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் பட்டியலில், עַל இங்கு அந்த அணிக்கு மேலாக நியமிக்கப்பட்ட தலைமைப் பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பான முழு வாக்கியத்திற்காக இணைப்புச் சொல் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: இந்தப் பகுதியில் போர் புரியும் இராணுவத்தை மட்டும் அல்லாமல், ஒழுங்குபடுத்தப்பட்ட கோத்திரப் பயண அணியைக் குறிக்கிறது; ‘படைப்பிரிவு’ அதன் இராணுவப் பாணியிலான அமைப்பைத் தக்கவைக்கிறது.
- source_word: מַטֶּה
  choice: கோத்திரம்
  rationale: இங்கு சொல்லின் பொருள் கைத்தடி அல்ல; மக்கள்தொகை மற்றும் பயண ஒழுங்கில் அமைந்த கோத்திர அலகு.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: எபிரெய மொழியின் வம்சாவளிச் சாயலுள்ள அமைப்பைத் தக்கவைக்கும் நேரடியான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு.
- source_word: אֲבִידָן
  choice: அபீதான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் அண்மையாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶּן גִּדְעוֹנִי
  choice: கிதெயோனியின் மகன்
  rationale: வம்ச அடையாளத்தைக் குறிக்கும் בן என்பதற்கான இயல்பான தமிழ் வடிவம்; கிதெயோனி என்பது எபிரெயப் பெயரின் எழுத்துப்பெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் பாணியின் கண்ணியத்தையும் எபிரெய வம்சாவளி அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. தமிழில் இயல்பான வாக்கியமாக அமைய ‘இருந்தான்’ சேர்க்கப்பட்டுள்ளது; அது எபிரெய பெயர்ச்சொல் வாக்கியத்தில் உள்ள மறைமுக வினையை வெளிப்படுத்துகிறது.
