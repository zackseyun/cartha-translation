base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: ta
  text: மோசே, மீதியானியனான ரெகுவேலின் மகனாகிய ஓபாபிடம்—அவன் மோசேயின் மாமனார்[a]—, “யாவே, ‘அதை உங்களுக்குக் கொடுப்பேன்’ என்று சொன்ன இடத்துக்கு நாங்கள் புறப்பட்டுச் செல்கிறோம். எங்களோடு வாரும்; உமக்கு நன்மை செய்வோம். ஏனெனில், யாவே இஸ்ரவேலைக் குறித்து நன்மையாகப் பேசியிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் חֹתֵן பொதுவாக ‘மாமனார்’ என்று பொருள்படும்; ஆனால் அது திருமணத்தின் வழியான உறவினரையும் விரிவாகக் குறிக்கலாம். எனவே சிலர் இதை ‘மோசேயின் மைத்துனர்’ அல்லது ‘மோசேயின் திருமண உறவினர்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: ஓபாப்
  rationale: தனிப்பெயரை அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பைப் பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַמִּדְיָנִי
  choice: மீதியானியனான
  rationale: குறிப்பிட்ட இனச் சார்பைச் சுட்டும் சொல்லையும் அதன் உருபையும் இயல்பான தமிழில் தருகிறது.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: חֹתֵן என்பதன் பொதுவான சூழல்சார் பொருளை முதன்மை வாசகத்தில் தருகிறது; அது திருமண உறவினரை விரிவாகவும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: நாங்கள் புறப்பட்டுச் செல்கிறோம்
  rationale: வினையெச்சமும் வெளிப்படையான பதிலிடுபெயரும் காட்டும் தொடங்கியுள்ள அல்லது உடனடியாகத் தொடங்கவுள்ள பயணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: யாவே, ‘அதை உங்களுக்குக் கொடுப்பேன்’ என்று சொன்ன
  rationale: இடத்தைக் குறிக்கும் ஒருமைச் சுட்டையும், இஸ்ரவேலரை நோக்கிய பன்மை ‘உங்களுக்கு’ என்பதையும், நேரடிக் கூற்றையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: לְכָה אִתָּנוּ
  choice: எங்களோடு வாருங்கள்
  rationale: மோசேயின் அழைப்பை மரியாதையும் இயல்பும் கொண்ட நவீன தமிழில் தருகிறது.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: நாங்கள் உங்களுக்கு நன்மை செய்வோம்
  rationale: ஒருவருடைய நலனுக்காகச் செயல்படுதல் என்ற causative பொருளை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலைக் குறித்து நன்மையானவற்றைப் பேசியிருக்கிறார்
  rationale: ‘பேசினார்’ என்ற மூல வினையைத் தக்கவைத்து, அதை விளக்கமாக ‘வாக்குறுதி அளித்தார்’ என்று மட்டும் குறுக்காமல், עַל என்பதையும் ‘குறித்து’ எனப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டம் அல்லாமல் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது; ஆகவே அதன் பெயர்த் தன்மையைத் தக்கவைக்கும் தமிழ் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: חֹתֵן מֹשֶׁה குறிக்கும் சரியான திருமண உறவு
  choice: மோசேயின் மாமனார்
  alternative: மோசேயின் திருமண உறவினர்; மோசேயின் மைத்துனர்
  rationale: ‘மாமனார்’ என்பது இச்சொல்லின் பொதுவான பொருள். ஆயினும் சொல் விரிவாகத் திருமண உறவினரையும் குறிக்கக்கூடியதால், வம்ச உறவை உரை கூறுவதைவிடத் துல்லியமாகத் தீர்மானிக்காமல் மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: இஸ்ரவேலைக் குறித்து யாவே ‘நன்மை பேசியது’
  choice: நன்மையானவற்றைப் பேசியிருக்கிறார்
  alternative: இஸ்ரவேலுக்கு நன்மை செய்வதாக வாக்குறுதி அளித்திருக்கிறார்
  rationale: இங்கு கூற்று வாக்குறுதிப் பொருளைக் கொண்டிருக்கலாம்; இருப்பினும் மூலத்தின் ‘பேசுதல்’ மற்றும் ‘நன்மை’ ஆகிய சொற்களைத் தக்கவைத்து அந்தப் பொருள் பரப்பைச் சுருக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. நேரடிக் கூற்று, பன்மைச் சுட்டு, பயணத்தின் தொடக்கநிலை, மற்றும் மூலத்தின் ‘நன்மை பேசுதல்’ ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
