revisions:
- from: மோசே, மீதியானியனான ரெகுவேலின் மகனும் மோசேயின் மாமனாருமான[a] ஓபாபிடம், “யாவே, ‘அதை உங்களுக்குக் கொடுப்பேன்’ என்று சொன்ன இடத்துக்கு நாங்கள் புறப்பட்டுச் செல்கிறோம். எங்களோடு வாருங்கள்; நாங்கள் உங்களுக்கு நன்மை செய்வோம். ஏனெனில், யாவே இஸ்ரவேலைக் குறித்து நன்மையானவற்றைப் பேசியிருக்கிறார்” என்றார்.
  to: மோசே, மீதியானியனான ரெகுவேலின் மகனாகிய ஓபாபிடம்—அவன் மோசேயின் மாமனார்[a]—, “யாவே, ‘அதை உங்களுக்குக் கொடுப்பேன்’ என்று சொன்ன இடத்துக்கு நாங்கள் புறப்பட்டுச் செல்கிறோம். எங்களோடு வாரும்; உமக்கு நன்மை செய்வோம். ஏனெனில், யாவே இஸ்ரவேலைக் குறித்து நன்மையாகப் பேசியிருக்கிறார்” என்றார்.
  rationale: The opening kinship apposition has been clarified without attempting to settle the debated genealogy. The footnote preserves the semantic ambiguity of חֹתֵן. The final clause now reflects singular טוֹב without adding a plural object, while retaining the Hebrew verbal image of Yahweh having spoken good concerning Israel.
