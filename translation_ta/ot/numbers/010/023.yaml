  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சிச் சூத்திரமான ‘...மேல்/பொறுப்பாக’ என்ற பொருளை ‘தலைவனாக ... இருந்தான்’ துல்லியமாக வெளிப்படுத்துகிறது. צְבָא என்பது கோத்திரத்தின் ஒழுங்கமைக்கப்பட்ட அணிவகுப்பு/பிரிவைக் குறிக்கும் சூழலுக்கேற்ப ‘படைப்பிரிவு’ என மொழிபெயர்க்கப்பட்டுள்ளது. மனாசேயின் மகன்கள், கோத்திரம், கமாலியேல், பெதாசூரின் மகன் ஆகிய கூறுகள் அனைத்தும் மூல வரிசை மற்றும் பொருளுடன் ஒத்திருக்கின்றன.
  naturalness: வாக்கியம் நவீன தரமான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. ‘கோத்திரப் படைப்பிரிவுக்குத் தலைவனாக’ என்பது இச்சூழலின் நிர்வாக/அணிவகுப்பு உறவை இயல்பாகக் காட்டுகிறது.
  terminology: ‘கோத்திரம்,’ ‘படைப்பிரிவு,’ ‘தலைவன்,’ மற்றும் வம்சக் குறியீடான ‘மகன்’ ஆகியவை நிலையான, பொருத்தமான சொற்கள். தனிப்பெயர்களான மனாசே, கமாலியேல், பெதாசூர் ஆகிய ஒலிபெயர்ப்புகள் ஏற்றவை. அடிக்குறிப்பு צְבָא-வின் பொருள் எல்லையை உரியவாறு விளக்குகிறது.
