  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: ta
  text: மனாசேயின் மகன்களுடைய கோத்திரப் படைப்பிரிவுக்குத் தலைவனாகப் பெதாசூரின் மகன் கமாலியேல் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவு” என்பதற்கான எபிரெயச் சொல்லை “சேனை,” “படை,” அல்லது “அணி” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது ஒழுங்கமைக்கப்பட்ட கோத்திரப் பிரிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: தலைவனாக ... இருந்தான்
  rationale: இந்த அணிவகுப்பு அமைப்பில் עַל என்பது ஒரு கோத்திரப் பிரிவுக்குப் பொறுப்பாக நியமிக்கப்பட்ட தலைவரைக் குறிக்கிறது. தமிழில் இயல்பான முழு வாக்கியமாக இதை வெளிப்படுத்துகிறது.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: இங்கு ஒழுங்கமைக்கப்பட்ட கோத்திர அணியைக் குறிக்கிறது; குறுகிய பொருளில் போரிடும் படையை மட்டும் குறிக்கவில்லை. ‘படைப்பிரிவு’ அதன் அமைப்புசார் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: எண்ணாகமத்தின் இந்தச் சூழலில் ஒரு இஸ்ரவேல் கோத்திர அலகைக் குறிக்கும் வழக்கமான பொருள்.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: மனாசேயின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘மனாசேயின் மகன்கள்’ என்ற வம்சவழிப் பெயரிடலைப் பேணுகிறது.
- source_word: גַּמְלִיאֵל
  choice: கமாலியேல்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: வழக்கமான தந்தை–மகன் வம்சத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: פְּדָה צוּר
  choice: பெதாசூர்
  rationale: மூல உரையில் இடைவெளியுடன் காணப்பட்டாலும் இது ஒரே தனிப்பெயர்; அதனால் தமிழில் ஒரே பெயராக ஒலிபெயர்க்கப்படுகிறது.
