  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: ta
  text: பின்பு, எப்பிராயீமின் மகன்களின் பாளயக் கொடி அவர்களுடைய படைப்பிரிவுகளின்படி[a] புறப்பட்டது; அதன் படைப்பிரிவின் தலைவனாக அம்மிஹூதின் மகன் எலிஷாமா இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய அணிகளின்படி.’ எபிரேயச் சொல் பாளயத்திலிருந்த இராணுவப் பாணியில் ஒழுங்கமைக்கப்பட்ட குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: பின்பு ... புறப்பட்டது
  rationale: வாவ் இணைப்புடன் வரும் வினைச்சொல் பயண நிகழ்வின் தொடர்ச்சியைச் சுட்டுகிறது; அணிவகுத்துப் புறப்படும் சூழலில் ‘புறப்பட்டது’ இயல்பான நவீனத் தமிழ்.
- source_word: דֶּגֶל
  choice: கொடி
  rationale: பாளயத்தின் பழங்குடி அணியை அடையாளப்படுத்தி, அதன் கீழ் அவர்கள் அணிவகுத்துச் சென்ற கொடியைக் குறிக்கிறது; ‘கொடி’ தெளிவான, இயல்பான தமிழ்.
- source_word: מַחֲנֵה
  choice: பாளயம்
  rationale: இது கொடியுடன் தொடர்புடைய முகாம் அல்லது அணியமைப்பைக் குறிக்கிறது; வனாந்தரப் பயணச் சூழலுக்கு ‘பாளயம்’ பொருத்தமானது.
- source_word: בְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘எப்பிராயீமின் மகன்கள்’ என்றாலும், இங்கு முழுக் கோத்திரத்தையும் குறிக்கும் மரபுவழிப் பெயராதலால், இயல்பான தமிழில் ‘மக்கள்’ என்று வழங்கப்படுகிறது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படைப்பிரிவுகளின்படி
  rationale: צָבָא என்பது இச்சூழலில் போர் நடவடிக்கையை மட்டும் அல்லாமல், ஒழுங்கமைக்கப்பட்ட கோத்திர அணிகளையும் குறிக்கிறது; ‘படைப்பிரிவுகள்’ அந்த இராணுவப் பாணியிலான அமைப்பைத் தக்கவைக்கிறது.
- source_word: וְעַל צְבָאוֹ
  choice: அதன் படைப்பிரிவுக்குத் தலைவராக ... இருந்தார்
  rationale: עַל வெளிப்படுத்தும் தலைமை உறவை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது; ஒருமை பின்னொட்டு பாளயக் கொடியின் அணியைக் குறிக்கிறது.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: அம்மியூதின் மகன் எலிசாமா
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்படுகின்றன; ‘X-இன் மகன் Y’ என்பது இயல்பான தமிழ் மரபுவழி அமைப்பு.
