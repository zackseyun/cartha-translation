base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: ta
  text: அது வந்து தங்கியபோது, அவர், “யாவே[a], இஸ்ரவேலின் பதினாயிரம் ஆயிரங்களிடம் திரும்பி வாரும்”[b] என்று சொல்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் கடவுளின் தனிப்பெயரான יהוה (YHWH) உள்ளது.
    reason: divine_name
  - marker: b
    text: 'சொல்லுக்கு சொல்: “இஸ்ரவேலின் ஆயிரங்களின் பதினாயிரங்கள்.” இது இஸ்ரவேலரின் மிகப் பெரும் எண்ணிக்கையை வலியுறுத்தும் சொற்றொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: அது வந்து தங்கியபோது
  rationale: בְּ உடன் வரும் נוח வினையெச்ச வடிவம் காலத்தைக் குறிக்கும் துணைவாக்கியமாக உள்ளது; பெட்டி பயணத்தை நிறுத்தி நிலைகொள்வதை ‘வந்து தங்கியபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֹאמַר
  choice: அவர் ... என்று சொல்வார்
  rationale: நிறைவுறாத வினைவடிவம் ஒவ்வொரு முறை பெட்டி தங்கும்போதும் மோசே வழக்கமாகச் சொன்னதைச் சுட்டுகிறது; தமிழின் ‘சொல்வார்’ அந்தத் தொடர்வழக்குப் பொருளைக் காக்கிறது.
- source_word: שׁוּבָה
  choice: திரும்பி வாரும்
  rationale: שוב என்பதன் வலியுறுத்தப்பட்ட ஏவல் வடிவம் நேரடியான வேண்டுகோள். ‘திரும்பி வாரும்’ அதன் இயக்கத்தையும் மரியாதைமிக்க அழைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, எபிரெயத் தெய்வீகத் தனிப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: רִבְבוֹת אַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எண்ணற்ற ஆயிரங்களிடம்
  rationale: இரண்டு பெரும் எண்ணுப் பெயர்களை அடுக்கி இஸ்ரவேலின் மிகப் பெரும் மக்கள்தொகையை வலியுறுத்தும் எபிரெயச் சொற்றொடரை, செயற்கையான சொற்சொல் அமைப்பைத் தவிர்த்து அதன் உயர்ந்த வலிமையுடன் தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: ‘திரும்பி வாரும்’ என்பதன் தொடர்பு
  choice: இஸ்ரவேலின் எண்ணற்ற ஆயிரங்களிடம் திரும்பி வாரும்
  alternative: இஸ்ரவேலின் எண்ணற்ற ஆயிரங்களோடு தங்கியிரும்
  rationale: שוב என்பதன் அடிப்படை ‘திரும்புதல்’ பொருளை உரையில் வைத்துள்ளோம்; ‘தங்கியிரும்’ என்பது சூழலிலிருந்து பெறக்கூடிய விளக்கமாக இருந்தாலும் அதை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு நயமுள்ள ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. மோசேயைக் குறிக்கும் மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தின் பெரும் எண் அடுக்கின் வலிமை இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
