    text: எபிரெயத்தில், “மோசேயின் கையால்”; யாவே தமது கட்டளையை மோசே வழியாகக் கொடுத்தார் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
