revisions:
- from: அவர்கள் முதன்முறையாக மோசேயின் மூலம் யாவே கொடுத்த கட்டளையின்படி புறப்பட்டார்கள்.[a]
  to: யாவே மோசே மூலம் கொடுத்த கட்டளையின்படி அவர்கள் முதன்முறையாகப் புறப்பட்டார்கள்.[a]
  rationale: 'The revision retains every source element while clarifying the syntactic relationship: Yahweh is the source of the command, Moses is its mediator, and Israel sets out for the first time. The footnote preserves the literal Hebrew idiom and explains its contextual force in natural Tamil.'
  reviewer_model: gpt-5.6-terra
