reference: Numbers 10:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: ta
  text: யாவே மோசே மூலம் கொடுத்த கட்டளையின்படி அவர்கள் முதன்முறையாகப் புறப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மோசேயின் கையால்”; யாவே தமது கட்டளையை மோசே வழியாகக் கொடுத்தார் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பதன் இச்சூழலிலான பொருள் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவது; ‘புறப்பட்டார்கள்’ என்பது இதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בָּרִאשֹׁנָה
  choice: முதன்முறையாக
  rationale: இந்த வினையடை வடிவம் ‘முதலில்’ அல்லது ‘முதன்முறையாக’ எனப் பொருள்படும்; சீனாயிலிருந்து தொடங்கும் முதல் ஒழுங்கமைந்த புறப்பாட்டை இங்கு குறிக்கிறது.
- source_word: עַל פִּי
  choice: கட்டளையின்படி
  rationale: சொல்லுக்குச் சொல் ‘வாயின்படி’ என்ற எபிரெய மரபுத்தொடர், இங்கு அதிகாரமுள்ள கட்டளைக்குக் கீழ்ப்படிவதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் தனிப்பெயரான יהוה நேரடியாக வருகிறது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்குச் சொல் ‘மோசேயின் கையால்’ என்றாலும், இந்த மரபுத்தொடர் முகமை அல்லது இடைமுகத்தைச் சுட்டுகிறது; ‘மோசேயின் மூலம்’ என்பது அதைக் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: கட்டளையில் மோசேயின் பங்கு
  choice: மோசேயின் மூலம் யாவே கொடுத்த கட்டளை
  alternative: மோசேயின் கட்டளை
  rationale: בְּיַד מֹשֶׁה என்பது மோசே மூலமாகச் செயல்படும் முகமை அல்லது இடைமுகத்தைச் சுட்டுகிறது; கட்டளையின் மூலாதாரம் யாவே, அதன் வழிமூலம் மோசே என்பதைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் கட்டளை–முகமை உறவு தெளிவாகக் காக்கப்பட்டுள்ளது.
