translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கொடி புறப்பட்டது’ என்ற மூலத்தின் உருவகச் சொல்லாட்சி காக்கப்பட்டுள்ளது; அதேவேளை இரண்டாம் கூறில் தலைமை உறவு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
