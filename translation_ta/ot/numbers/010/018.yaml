id: NUM.10.18
reference: Numbers 10:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: ta
  text: பின்பு ரூபன் முகாமின் கொடி[a], அவர்களுடைய படையணிகளின்படி[b] புறப்பட்டது; அதன் படையணிக்குத் தலைமை வகித்தவர் செதேயூரின் மகன் எலிசூர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘பதாகை’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவர்களுடைய அணிகளின்படி’; எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட, இராணுவப் பாணியிலான குழுக்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: பின்பு ... புறப்பட்டது
  rationale: வாவ் தொடர்ச்சியின் கதைநகர்த்தும் வரிசையை ‘பின்பு’ வெளிப்படுத்துகிறது; נסע என்பதன் முகாம் நகரும் சூழலுக்குரிய இயல்பான பொருளை ‘புறப்பட்டது’ தருகிறது.
- source_word: דֶּגֶל
  choice: கொடி
  rationale: ஒரு கோத்திர முகாம் அணிவகுத்துச் சென்ற அடையாளக் கொடியை நேரடியாகவும் நவீன வாசகருக்கு எளிதாகவும் குறிக்கிறது; இங்கு கொடி அதன்கீழ் நகரும் முகாமையும் பிரதிநிதித்துவப்படுத்துகிறது.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: ரூபன் முகாம்
  rationale: எபிரெயக் கூட்டுச்சொல்லின் உடைமை உறவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படையணிகளின்படி
  rationale: צבא என்பதன் பன்மையையும் ஒழுங்கமைக்கப்பட்ட, இராணுவப் பாணியிலான அணிவகுப்பையும் காக்கிறது; நேரடி போர்ச்செயலைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: וְעַל צְבָאוֹ
  choice: அதன் படையணிக்குத் தலைமை வகித்தவர்
  rationale: עַל இங்கு அதிகாரம் அல்லது மேற்பார்வையைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘தலைமை வகித்தவர்’ என வெளிப்படுத்தப்பட்டுள்ளது; ஒருமை உருபு முகாமின் படையணியைச் சுட்டுகிறது.
- source_word: אֱלִיצוּר
  choice: எலிசூர்
  rationale: தனிப்பெயர் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: בֶּן שְׁדֵיאוּר
  choice: செதேயூரின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாள அமைப்பை இயல்பான தமிழ் உடைமைத் தொடரால் வழங்குகிறது.
