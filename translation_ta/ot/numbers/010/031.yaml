  to: 'அவன் சொன்னான்: “தயவுசெய்து எங்களைவிட்டுப் போய்விடாதீர். ஏனெனில், பாலைநிலத்தில் நாங்கள் எங்கு முகாமிட வேண்டும் என்பதை நீர் அறிந்திருக்கிறீர்; நீர் எங்களுக்குக் கண்களாக இருப்பீர்[a].”'
