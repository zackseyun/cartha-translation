id: NUM.10.31
reference: Numbers 10:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “தயவுசெய்து எங்களைவிட்டுப் போய்விடாதீர். ஏனெனில், பாலைநிலத்தில் நாங்கள் எங்கு முகாமிட வேண்டும் என்பதை நீர் அறிந்திருக்கிறீர்; நீர் எங்களுக்குக் கண்களாக இருப்பீர்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பாலைநிலத்தைப் பற்றிய உமது அறிவால் எங்களுக்கு வழிகாட்டியாக இருப்பீர்.
    reason: ‘கண்களாக இருப்பீர்’ என்ற எபிரெய உருவகத்தின் சூழல்சார் பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் சொன்னான்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; சூழலில் பேசுபவர் மோசே.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: தயவுசெய்து எங்களைவிட்டுப் போய்விடாதீர்
  rationale: אַל என்பதன் தடையையும் נָא என்பதன் மன்றாட்டுத் தொனியையும் காக்கிறது; עזב என்பதைப் பயணச் சூழலுக்கு ஏற்ற ‘போய்விடாதீர்’ என வழங்குகிறது.
- source_word: כִּי עַל כֵּן
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: பாலைநிலத்தில் நாங்கள் முகாமிடுவதை நீர் அறிந்திருக்கிறீர்
  rationale: חֲנֹתֵנוּ என்பதன் ‘எங்கள் முகாமிடுதல்/முகாம்கள்’ என்ற வடிவை, ‘எங்கே முகாமிட வேண்டும்’ என்று அளவுக்கு மீறி விளக்காமல் காக்கிறது. מִדְבָּר என்பது மணற்பாலைவனம் மட்டுமல்லாத வறண்ட வனாந்தரப் பகுதியைக் குறிக்கலாம்; ‘பாலைநிலம்’ அதற்கு இயல்பான தமிழ்.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: நீர் எங்களுக்குக் கண்களாக இருப்பீர்
  rationale: ‘எங்களுக்குக் கண்களாக இருப்பீர்’ என்ற மூல உருவகத்தை அப்படியே காக்கிறது; வழிகாட்டுதல் என்ற உட்பொருளை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: தெய்வீக வழிநடத்துதலுக்கும் ஓபாபின் நிலஅறிவுக்கும் இடையிலான சாத்தியமான பதற்றம்
  choice: வசனத்தின் மனித வழிகாட்டுதல் சார்ந்த உருவகத்தை மாற்றாமல் வைத்தல்
  alternative: ‘உதவியாக இருப்பீர்’ அல்லது ‘வழிகாட்டுவீர்’ என்று பொதுமைப்படுத்துதல்
  rationale: மூல உரை ஓபாபை ‘கண்களாக’ இருக்கும்படி கேட்கிறது; இது தேவனுடைய வழிநடத்துதலைப் பற்றிய பரந்த சூழலுடன் எவ்வாறு பொருந்துகிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நேரடி உரை. ஒருமை மரியாதைக்காக ‘நீர்/அறிந்திருக்கிறீர்/இருப்பீர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘கண்கள்’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளது.
