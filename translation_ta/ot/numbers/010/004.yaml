source:
  edition: WLC
  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: ta
  text: ஆனால், ஒரு எக்காளத்தை மட்டும் ஊதினால், இஸ்ரவேலின் ஆயிரங்களுக்குத் தலைமை தாங்கும் தலைவர்கள் உன்னிடம் கூடிவருவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் ஆயிரங்கள்” என்பது ஆயிரம் பேர் கொண்ட இஸ்ரவேலின் பிரிவுகளைக் குறிக்கலாம்; சில மொழிபெயர்ப்புகள் இதை விளக்கமாக “இஸ்ரவேலின் குலங்கள்” என்று தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: ஆனால், ... ஊதினால்
  rationale: முந்தைய வசனத்தில் இரண்டு எக்காளங்களும் ஊதப்படுவதற்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், சூழலிலுள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/אַחַת
  choice: ஓர் எக்காளத்தை மட்டும்
  rationale: எபிரெயத்தில் ‘ஒன்றினால்’ என்று சுருக்கமாக உள்ளது; முந்தைய வசனத்தின் இரு எக்காளங்களோடு உள்ள வேறுபாட்டைத் தெளிவுபடுத்த, மறைந்திருக்கும் ‘எக்காளம்’ என்பதும் ‘மட்டும்’ என்பதும் வெளிப்படையாகக் கூறப்பட்டுள்ளன.
- source_word: יִתְקָעוּ
  choice: ஊதினால்
  rationale: எக்காள சமிக்ஞைச் சூழலில் תקע என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது; தமிழில் நேரடியான, இயல்பான வினைச்சொல் இதுவே.
- source_word: וְ/נוֹעֲדוּ
  choice: கூடிவர வேண்டும்
  rationale: יעד என்பதன் நிஃபால் வடிவம் இங்கு அழைப்புக்கிணங்க ஓரிடத்தில் ஒன்றுகூடுவதைக் குறிக்கிறது. ‘கூடிவர’ என்பது மோசேயை நோக்கிய வருகையையும் ஒன்றுகூடுதலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵלֶי/ךָ
  choice: உன்னிடம்
  rationale: மோசேயை நோக்கிய இயக்கத்தை எளிய நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: הַ/נְּשִׂיאִים
  choice: தலைமக்கள்
  rationale: נשיאים என்பது கோத்திர அல்லது சமூகத் தலைவர்களைக் குறிக்கிறது. ‘தலைமக்கள்’ என்பது அரச குமாரர்கள் என்ற தவறான பொருளைத் தவிர்த்து, அவர்களுடைய அதிகாரப் பொறுப்பை dignified தமிழில் காட்டுகிறது.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆயிரங்களின் தலைவர்கள்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘ஆயிரங்கள்’ என்ற நிர்வாக/படைப் பிரிவு சொல்லை விளக்கமாக ‘குலங்கள்’ என்று மாற்றாமல் முதன்மை உரையில் பாதுகாக்கிறது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
