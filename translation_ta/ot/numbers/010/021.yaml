  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: ta
  text: பரிசுத்தப் பொருட்களைச் சுமந்துகொண்டு கோகாத்தியர்கள் புறப்பட்டார்கள்[a]; அவர்கள் வந்து சேருவதற்கு முன்பே திருக்கூடாரம் அமைக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்கு நெருக்கமாக, “பரிசுத்த இடத்தைச் சுமப்பவர்கள்” என மொழிபெயர்க்கலாம். இங்கு அந்தச் சொற்றொடர், அடுத்ததாகக் குறிப்பிடப்படும் திருக்கூடாரக் கட்டமைப்பிலிருந்து வேறுபட்ட, கோகாத்தியர்கள் சுமந்த பரிசுத்தப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: பின்னர் ... புறப்பட்டார்கள்
  rationale: வாவ் தொடர்ச்சியான பயண நிகழ்வைக் குறிக்கிறது; முகாமிலிருந்து பயணம் தொடங்கும் சூழலில் ‘புறப்பட்டார்கள்’ இயல்பான தமிழாக்கம்.
- source_word: הַקְּהָתִים
  choice: கோகாத்தியர்கள்
  rationale: கோகாத்தின் குலத்தாரைக் குறிக்கும் பன்மை இனப்பெயருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: பரிசுத்தப் பொருட்களைச் சுமந்துகொண்டு சென்றார்கள்
  rationale: சொல்லுக்கு சொல் ‘பரிசுத்த இடத்தைச் சுமப்பவர்கள்’ என்றாலும், அடுத்த கூற்று திருக்கூடாரக் கட்டமைப்பைத் தனியாகக் குறிப்பிடுவதால், இங்கு பரிசுத்த இடத்துக்குரிய புனிதப் பொருட்கள் உவமையாக்கமாகக் குறிக்கப்படுகின்றன.
- source_word: הַמִּקְדָּשׁ
  choice: பரிசுத்தப் பொருட்கள்
  rationale: מִקְדָּשׁ என்பதன் அடிப்படைப் பொருள் ‘பரிசுத்த இடம்’; இச்சூழலில் கோகாத்தியர்கள் எடுத்துச் சென்ற அந்த இடத்துக்குரிய புனிதப் பொருட்களைக் குறிக்கும் ஆகுபெயராக உள்ளது.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: திருக்கூடாரம் அமைக்கப்பட்டது
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் பன்மையில் இருந்தாலும் எழுவாய் வெளிப்படையாக இல்லை. கோகாத்தியர்களே அதை அமைத்ததாகத் தவறாக உணர்த்தாமல், சூழலில் முன்னே சென்ற மற்ற லேவியர்கள் செய்த செயலைத் தமிழில் செயப்பாட்டு வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரத்தில் தேவனுடைய வாசஸ்தலக் கூடாரத்தைக் குறிக்கும் מִשְׁכָּן என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் வேதாகமச் சொல்.
- source_word: עַד בֹּאָם
  choice: அவர்கள் வந்து சேருவதற்குள்
  rationale: கோகாத்தியர்கள் பரிசுத்தப் பொருட்களுடன் வந்துசேரும் நேரத்திற்குள் திருக்கூடாரம் அமைக்கப்பட்டிருந்த காலத் தொடர்பை இயல்பாகக் காட்டுகிறது.
