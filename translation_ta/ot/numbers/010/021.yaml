translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருக்கூடாரம்’ என்ற நிலைபெற்ற சொல் பயன்படுத்தப்பட்டது; எபிரெய உரையின் எழுவாய் தெளிவின்மையைத் தவறாகத் தீர்மானிக்காமல் செயப்பாட்டு வடிவம் காக்கிறது.
