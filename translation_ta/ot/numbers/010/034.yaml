language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: ta
  text: அவர்கள் முகாமிலிருந்து புறப்பட்டபோது, பகலில் யாவேவின் மேகம் அவர்களுக்குமேல் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேகம் பகலில் அவர்கள்மேல் இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲנַן
  choice: மேகம்
  rationale: עָנָן என்பதற்கு ‘மேகம்’ என்று பொருள். வாவ் இணைப்பின் தொடர்ச்சிப் பொருள் தமிழில் வாக்கிய ஓட்டத்தால் இயல்பாக வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் மெய்யெழுத்து வடிவமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பொதுவாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்கு மேலாக இருந்தது
  rationale: עַל என்பது இங்கு அவர்கள்மேல் அல்லது அவர்களுக்கு மேலாக இருந்த இடநிலையைக் குறிக்கிறது; ‘மேலாக’ என்பது மேகத்தின் இருப்பிடத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: יוֹמָם என்பது ‘பகலில்’ அல்லது ‘பகற்பொழுதில்’ என்னும் வினையடைப் பொருளைக் கொண்டது; ‘பகலில்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּ/נָסְעָם
  choice: அவர்கள் ... புறப்பட்டபோது
  rationale: נסע என்ற வினையின் infinitive construct இங்கு காலப்பொருளில் வந்து, முகாமைக் கலைத்துப் பயணம் தொடங்கிய தருணத்தைக் குறிக்கிறது.
- source_word: מִן הַמַּחֲנֶה
  choice: முகாமிலிருந்து
  rationale: מַחֲנֶה என்பது ‘முகாம்’; முன்னொட்டு מִן நீங்கல் பொருளைத் தருவதால் ‘முகாமிலிருந்து’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பட்ட திருநாமத்தையே பயன்படுத்துகிறது. அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: மேகம் ‘அவர்கள்மேல்’ இருந்ததா அல்லது ‘அவர்களுக்கு மேலாக’ இருந்ததா
  choice: அவர்களுக்கு மேலாக இருந்தது
  alternative: அவர்கள்மேல் இருந்தது
  rationale: עַל இரு வகையிலும் இயல்பாகப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை இடநிலையைத் தெளிவாகக் காட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரேயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், காலத் துணைவாக்கியம் தமிழுக்கு இயல்பாக முன்னிலைப்படுத்தப்பட்டுள்ளது; வசனத்தின் பொருளும் இடநிலைத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
