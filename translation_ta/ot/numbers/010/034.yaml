- from: அவர்கள் முகாமிலிருந்து புறப்பட்டபோது, பகலில் யாவேவின் மேகம் அவர்களுக்கு மேலாக இருந்தது.[a]
  to: அவர்கள் முகாமிலிருந்து புறப்பட்டபோது, பகலில் யாவேவின் மேகம் அவர்களுக்குமேல் இருந்தது.[a]
