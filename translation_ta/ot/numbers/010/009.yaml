  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: ta
  text: உங்கள் நாட்டில் உங்களை நெருக்குகிற பகைவனுக்கு எதிராக நீங்கள் போருக்குச் செல்லும்போது[a], எக்காளங்களால் எச்சரிக்கை முழக்கம் எழுப்புங்கள். அப்போது உங்கள் கடவுளாகிய யாவேக்கு முன்பாக நீங்கள் நினைவுகூரப்படுவீர்கள்[b][c]; உங்கள் பகைவர்களிடமிருந்து மீட்கப்படுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நாட்டில் நீங்கள் போருக்குச் சென்றால்.” எபிரேய இணைப்புச்சொல் ஒரு சூழ்நிலையையோ நிபந்தனையையோ அறிமுகப்படுத்தலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உங்கள் கடவுளாகிய யாவேக்கு முன்பாக நீங்கள் நினைவுக்குக் கொண்டுவரப்படுவீர்கள்”; பொருள் விளக்கமாக, “உங்கள் கடவுளாகிய யாவே உங்களை நினைவுகூருவார்.”
    reason: lexical_alternative
  - marker: c
    text: “யாவே” என்பது எபிரேய மொழியிலுள்ள YHWH என்ற தெய்வீகப் பெயரைக் குறிக்கிறது.
    reason: lexical_alternative
