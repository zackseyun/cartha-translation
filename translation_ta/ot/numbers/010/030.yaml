  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: ta
  text: ஆனால் அவன் அவரிடம், “நான் போகமாட்டேன். மாறாக, என் சொந்த நாட்டிற்கும் என் சொந்த உறவினரிடமும் போவேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  choice: நான் வரமாட்டேன்
  rationale: பேசுபவர் மோசேயுடன் பயணம் செய்வதை மறுப்பதால், தமிழில் உரையாடல் நோக்கில் இயல்பான ‘வரமாட்டேன்’ பயன்படுத்தப்பட்டது; எபிரெயச் சொற்றொடரின் அடிப்படைப் பொருள் ‘நான் போகமாட்டேன்.’
- source_word: כִּי אִם
  choice: மாறாக
  rationale: முன்னைய மறுப்புக்கு எதிராக அடுத்து செய்யப்போவதை வலியுறுத்தும் கட்டமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: מוֹלַדְתִּי
  choice: என் உறவினர்
  rationale: பிறப்பு, பூர்வீகம், உறவுக்கூட்டம் ஆகியவற்றைக் குறிக்கக்கூடிய சொல்லை, ‘நாடு’ என்பதுடன் இணையும் இச்சூழலில் இயல்பாக ‘உறவினர்’ என்று மொழிபெயர்க்கிறது.
