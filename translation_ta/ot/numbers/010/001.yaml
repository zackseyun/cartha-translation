  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: YHWH (יהוה); ‘யாவே’ என்பது இப்பெயரின் வழக்கமான ஒலிபெயர்ப்பு.'
    reason: இறைப் பெயரின் எபிரெய வடிவத்தையும் தமிழில் பயன்படுத்தப்பட்ட ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொருளையும், தொடரும் לֵאמֹר உடன் இணைந்த எபிரெய உரை அறிமுகச் சூத்திரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிபெயர்ப்பைத் தமிழில் தருகிறது; அதை ஒரு பட்டப்பெயராக மாற்றவில்லை.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் உரையாடல் செயல்பாட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரே உள்ளது. ‘யாவே’ என்பது அதன் சாத்தியமான உச்சரிப்பை நெருக்கமாக ஒலிபெயர்க்கிறது; துல்லியமான பழங்கால உச்சரிப்பு முழு உறுதியுடன் அறியப்படாதது என்பதை அடிக்குறிப்பு உணர்த்துகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, வாசிக்க எளிய தமிழ். எபிரெய உரையின் ‘பேசி, கூறியதாவது’ என்ற உரை அறிமுக அமைப்பு, தமிழில் அளவுக்கு மீறிய கடினத்தன்மை இல்லாமல் பாதுகாக்கப்பட்டுள்ளது.
