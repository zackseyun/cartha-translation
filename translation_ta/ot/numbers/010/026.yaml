  source_fidelity: எபிரெய மூலத்தின் பட்டியல்-தொடர் அமைப்பும் ‘மேல்/பொறுப்பில்’ என்னும் עַל-இன் நிர்வாகப் பொருளும் தமிழில் ‘தலைவனாக ... இருந்தான்’ என்று துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. צְבָא, மַטֵּה, בְּנֵי אָשֵׁר, மற்றும் தந்தைவழிப் பெயரடைப்பு அனைத்தும் பொருளுக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
  naturalness: ‘ஆசேரின் மகன்களுடைய கோத்திரப் படைப்பிரிவுக்குத் தலைவனாக ஒக்ரானின் மகன் பகியேல் இருந்தான்’ என்பது நவீனத் தரமான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகமப் பதிவுக்கு ஏற்றவாறும் உள்ளது. பட்டியல் வசனத்தின் சுருக்கமும் காக்கப்பட்டுள்ளது.
  terminology: ‘கோத்திரம்’ மַטֵּהக்கு சூழலுக்கு ஏற்ற நிலையான சொல். ‘படைப்பிரிவு’ צְבָאவின் ஒழுங்குபடுத்தப்பட்ட பாளையக் குழு என்ற பொருளைச் சரிவரக் காட்டுகிறது; அடிக்குறிப்பு சாத்தியமான மாற்றுச் சொற்களையும் பொருளின் சூழலையும் நன்றாக விளக்குகிறது. ‘பகியேல்,’ ‘ஒக்ரான்’ ஆகிய பெயரொலிபெயர்ப்புகள் ஏற்றவை.
