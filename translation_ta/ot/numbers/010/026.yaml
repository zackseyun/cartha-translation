  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியல் வடிவத்தின் சுருக்கம் காக்கப்பட்டதோடு, தமிழில் இயல்பாக அமைய மறைமுகமான தலைமைத் தொடர்பு ‘தலைவனாக’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
