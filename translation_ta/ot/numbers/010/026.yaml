source:
  edition: WLC
  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: ta
  text: ஆசேரின் மகன்களுடைய கோத்திரப் படைப்பிரிவுக்குத் தலைவனாக ஒக்ரானின் மகன் பகியேல் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைப்பிரிவு’ என்பதற்குப் பதிலாக ‘பாளைய அணி,’ ‘அணி,’ அல்லது ‘படை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இஸ்ரவேலின் பாளைய ஒழுங்கில் அமைக்கப்பட்ட ஒரு குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: தலைவனாக
  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் பட்டியல் அமைப்பில், עַל என்பது அந்தப் பிரிவின்மேல் பொறுப்புடைய தலைவரைக் குறிக்கிறது. இயல்பான தமிழில் இதை ‘தலைவனாக’ என்று கூறுவது நிர்வாகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; וְ-இன் தொடர்ச்சி வசன அமைப்பிலேயே உணரப்படுகிறது.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: இங்கு இச்சொல் இஸ்ரவேலின் பாளைய அணிவகுப்பில் ஒழுங்கமைக்கப்பட்ட கோத்திரக் குழுவைக் குறிக்கிறது. ‘படைப்பிரிவு’ என்பது ஒழுங்கமைந்த அணியின் பொருளைப் பாதுகாக்கிறது; முழுப் ‘படை’ என்று மிகைப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இச்சூழலில் இச்சொல் ஒரு நேரடியான கோலையோ கிளையையோ அல்ல, கோத்திர அலகையே குறிக்கிறது.
- source_word: בְּנֵי אָשֵׁר
  choice: ஆசேரின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘ஆசேரின் மகன்கள்’ பாதுகாக்கப்பட்டு, தமிழில் உடைமைத் தொடர்புக்காக ‘ஆசேரின் மகன்களுடைய’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: פַּגְעִיאֵל
  choice: பகியேல்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן עָכְרָן
  choice: ஒக்ரானின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாள அமைப்பு இயல்பான தமிழில் ‘ஒக்ரானின் மகன்’ என்று வழங்கப்பட்டுள்ளது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
