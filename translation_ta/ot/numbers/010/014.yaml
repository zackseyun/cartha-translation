base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: ta
  text: யூதாவின் மகன்களின் பாளயக் கொடி[a] முதலில் அவர்களுடைய படைப்பிரிவுகளின்படி[b] புறப்பட்டது; அதன் படைப்பிரிவின் தலைவன் அம்மினதாபின் மகன் நகசோன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொடி’ என்பதற்கு ‘பதாகை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், ஒரு கோத்திரப் பாளயக்குழு எந்த அடையாளத்தின்கீழ் அணிவகுத்துச் சென்றதோ அந்தக் கொடியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய அணிகளின்படி’ அல்லது ‘அவர்களுடைய சேனைகளின்படி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், ஒழுங்குபடுத்தப்பட்ட கோத்திர அலகுகளைக் குறிக்கும் இராணுவ அமைப்புச் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: புறப்பட்டது
  rationale: வனாந்தரப் பயணச் சூழலில் נסע என்பது பாளயத்தைக் கலைத்துவிட்டு அடுத்த இடத்தை நோக்கிப் புறப்படுவதைக் குறிக்கிறது; தமிழில் ‘புறப்பட்டது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: דֶּגֶל
  choice: கொடி
  rationale: இந்தச் சொல் ஒரு கோத்திரப் பாளயக்குழு அணிவகுத்துச் சென்ற அடையாளக் கொடியைக் குறிக்கிறது. ‘கொடி’ சாதாரண வாசகருக்குப் புரியும் இயல்பான சொல்; அதனுடன் தொடர்புடைய குழுவையும் இங்கு ஆகுபெயராகக் குறிக்கிறது.
- source_word: מַחֲנֵה
  choice: பாளயம்
  rationale: דֶּגֶל מַחֲנֵה என்ற இணைப்பில், ஒரு கொடியின்கீழ் ஒழுங்குபடுத்தப்பட்ட பாளயத்தைக் குறிக்கிறது; ‘பாளயம்’ வனாந்தர முகாம் மற்றும் அணிவகுப்பு ஆகிய இரு சூழல்களுக்கும் பொருந்துகிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: எபிரெய மொழியின் கோத்திர மற்றும் வம்சவழிப் பெயரிடலை முறையாகப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: בָּרִאשֹׁנָה
  choice: முதலில்
  rationale: பயண அணிவகுப்பின் வரிசையைக் குறிக்கும் வினையடைப் பயன்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְצִבְאֹתָם
  choice: அவர்களுடைய படைப்பிரிவுகளின்படி
  rationale: צבא இங்கு போரையே வலியுறுத்தாமல், கணக்கிடப்பட்டு ஒழுங்குபடுத்தப்பட்ட இராணுவப் பாணியிலான கோத்திர அலகுகளைக் குறிக்கிறது. ‘படைப்பிரிவுகள்’ அந்த அமைப்புச் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְעַל צְבָאוֹ
  choice: அதன் படைப்பிரிவுக்குத் தலைவனாக ... இருந்தான்
  rationale: על என்பது அந்தப் பிரிவின்மேல் அதிகாரம் அல்லது பொறுப்பு வகித்தவரை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான தொடருக்காகத் தலைமைப் பொருள் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: அம்மினதாபின் மகன் நகசோன்
  rationale: பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கேற்ப வழங்கப்பட்டு, எபிரெய வம்சத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளது.
