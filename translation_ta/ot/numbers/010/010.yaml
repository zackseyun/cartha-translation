base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: ta
  text: உங்கள் மகிழ்ச்சியின் நாளிலும், உங்களுக்குக் குறிக்கப்பட்ட காலங்களிலும், உங்கள் மாதங்களின் தொடக்க நாட்களிலும்[a], உங்கள் தகனபலிகளின்மேலும் உங்கள் சமாதானப் பலிகளின்மேலும்[b] எக்காளங்களை ஊத வேண்டும். அவை உங்கள் கடவுளின் முன்னிலையில் உங்களுக்கு நினைவாக இருக்கும். நானே உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் புதிய நிலவுநாட்களிலும்.’ எபிரெயத்தில் சொல்லர்த்தமாக, ‘உங்கள் மாதங்களின் தொடக்கங்களிலும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் ஐக்கியப் பலிகளின்மேலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: உங்கள் மகிழ்ச்சி
  rationale: இந்தப் பெயர்ச்சொல் மகிழ்ச்சி அல்லது களிப்பைக் குறிக்கிறது; பட்டியல் அமைப்பில் இயல்பாகவும் நேரடியாகவும் அமைகிறது.
- source_word: מוֹעֲדֵיכֶם
  choice: உங்களுக்குக் குறிக்கப்பட்ட காலங்கள்
  rationale: வழிபாட்டுக்காக நியமிக்கப்பட்ட காலங்களைக் குறிக்கிறது; ‘விழாக்கள்’ என்று மட்டும் சுருக்காமல் எபிரெயச் சொல்லின் பரந்த பொருளைப் பேணுகிறது.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: உங்கள் மாதங்களின் தொடக்க நாட்கள்
  rationale: சொல்லர்த்தமான ‘உங்கள் மாதங்களின் தொடக்கங்கள்’ என்பதைக் காலக்கணக்கு சார்ந்த இயல்பான தமிழில் தருகிறது; சூழலில் புதிய நிலவுநாட்கள் என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּתְקַעְתֶּם
  choice: ஊத வேண்டும்
  rationale: எக்காளங்களோடு வரும் போது இந்த வினை அவற்றை ஊதி முழக்குவதைக் குறிக்கிறது; கட்டளையின் வலிமையையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: חֲצֹצְרֹת
  choice: எக்காளங்கள்
  rationale: இவ்வதிகாரத்தில் அறிமுகமான வழிபாட்டுக்குரிய உலோக ஊதுகருவிகளைக் குறிக்கிறது; இவ்வசனத்தில் இல்லாத ‘வெள்ளி’ என்ற விவரம் சேர்க்கப்படவில்லை.
- source_word: עַל עֹלֹתֵיכֶם
  choice: உங்கள் தகனபலிகளின்மேல்
  rationale: עַל என்பதன் இட/தொடர்பு சார்ந்த ‘மேல்’ என்ற படிமத்தைத் தக்கவைத்து, பலிகள் செலுத்தப்படும்போது எக்காளம் முழக்கப்படும் வழிபாட்டுச் சூழலை வெளிப்படுத்துகிறது.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: உங்கள் சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்பதன் முழுமை, நலன், சமாதானம் சார்ந்த பொருள்வட்டத்தைப் பேணும் வழிபாட்டுச் சொல்; நீளமான எபிரெயக் கட்டமைப்பு தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: அவை உங்களுக்கு ஒரு நினைவுச் சின்னமாக இருக்கும்
  rationale: வழிபாட்டுச் சூழலிலுள்ள நினைவூட்டல்/நினைவுகூரப்படுதல் என்ற பொருளைத் தீர்மானமாக ஒருபக்கம் சாய்க்காமல் ‘நினைவுச் சின்னம்’ வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளின் முன்னிலையில்
  rationale: ‘முன்பாக/சந்நிதியில்’ என்ற எபிரெயத் தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: שְׁלָמִים என்ற பலிவகை
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்
  rationale: இந்தச் சொல் சமாதானம்/நலன் மற்றும் பகிர்ந்துண்ணும் ஐக்கியம் ஆகிய இரு தொடர்புகளையும் கொண்டிருக்கலாம். முதன்மை உரையில் பாரம்பரியமாகவும் பொருள்வட்டத்துக்கு நெருக்கமாகவும் உள்ள ‘சமாதானப் பலிகள்’ வைக்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לְזִכָּרוֹן என்பதில் நினைவுகூருபவர் யார் என்பது
  choice: உங்களுக்கு ஒரு நினைவுச் சின்னம்
  alternative: உங்களை நினைவுகூரச் செய்யும் அடையாளம்
  rationale: எபிரெய உரை இது மனிதருக்கு நினைவூட்டுகிறதா அல்லது கடவுளின் முன்னிலையில் அவர்களை நினைவுகூரச் செய்கிறதா என்பதைத் தெளிவாக வரையறுக்கவில்லை; ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பேணப்படுகிறது.
