  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: ta
  text: ஆனால் சபையைக் கூட்டும்போது, ஊதுங்கள்; எச்சரிக்கை ஒலியை எழுப்பாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எச்சரிக்கைச் சைகையை ஒலிக்காதீர்கள்.’ சுற்றியுள்ள வசனங்களில் புறப்படுவதற்குப் பயன்படுத்தப்படும் தனித்துவமான எச்சரிக்கை ஒலியையும், இங்கு கூட்டுவதற்குப் பயன்படுத்தப்படும் சாதாரண ஊதலையும் எபிரெயம் வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: ஆனால் … கூட்டும்போது
  rationale: וּ முன்னைய வசனத்தில் புறப்படுவதற்கான எச்சரிக்கை ஒலியுடன் இவ்வசனத்தின் கூட்டுவதற்கான சாதாரண ஊதலை வேறுபடுத்துகிறது; בְ + הפעיל வினையெச்சம் காலப்பொருளில் ‘கூட்டும்போது’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: הַקָּהָל
  choice: சபையை
  rationale: קָהָל இங்கு ஒன்றுகூட்டப்படும் இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘சபை’ என்பது நவீனத் தமிழில் புரியக்கூடிய, கண்ணியமான கூட்டுப்பெயர்.
- source_word: תִּתְקְעוּ
  choice: ஊதுங்கள்
  rationale: תקע இச்சூழலில் எக்காளங்களை ஊதுவதைக் குறிக்கிறது. எக்காளங்கள் முன்னைய சூழலில் தெளிவாக இருப்பதால், எபிரெய மூலத்தைப் போல இவ்வசனத்தில் அவற்றை மீண்டும் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וְ/לֹא
  choice: … எழுப்பாதீர்கள்
  rationale: இணைப்பும் மறுப்பும் முதல் கட்டளைக்கு எதிரான இரண்டாம் அறிவுறுத்தலை உருவாக்குகின்றன. தமிழில் மறுப்பு வினை தெளிவாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: תָרִיעוּ
  choice: எச்சரிக்கை ஒலியை எழுப்பாதீர்கள்
  rationale: הֵרִיעַ என்பது இங்கு பொதுவாக ஒலி செய்வதை அல்ல, புறப்படுவதற்குப் பயன்படுத்தப்பட்ட தனித்துவமான எச்சரிக்கை சமிக்ஞையை ஒலிப்பதைக் குறிக்கிறது.
