  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: ta
  text: மேலும், இசக்காரின் மகன்களின் கோத்திரப் படைப்பிரிவுக்குத் தலைவராக சூவாரின் மகன் நெதனெயேல் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“படைப்பிரிவு” என்பதற்கு “அணி” அல்லது “படை” என்றும் மொழிபெயர்க்கலாம் (எபிரேய மொழி: צְבָא); இது அணிவகுத்துச் செல்ல ஒழுங்கமைக்கப்பட்ட கோத்திரக் குழுவைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: தலைவராக
  rationale: முந்தைய பட்டியலுடன் தொடர்ச்சியைத் தமிழ்ச் சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது; עַל இங்கு அந்த அணிக்கு மேலாக நியமிக்கப்பட்ட தலைமைப் பொறுப்பைக் குறிக்கிறது.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: எண்ணாகமம் 10-இன் அணிவகுப்புச் சூழலில், ஒழுங்கமைக்கப்பட்டு நகரும் கோத்திரக் குழுவைக் குறிக்கிறது. ‘படைப்பிரிவு’ அதன் ஒழுங்கும் படைத் தன்மையும் இரண்டையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இங்கு சொல்லின் பொருள் நேரடியான ‘கோல்’ அல்ல; இஸ்ரவேலின் கோத்திர அலகே தெளிவாகக் குறிக்கப்படுகிறது.
- source_word: בְּנֵי יִשָׂשכָר
  choice: இசக்காரின் மகன்கள்
  rationale: எபிரெய மொழியின் ‘இசக்காரின் மகன்கள்’ என்ற உறவுமுறைச் சொல்லைத் தக்கவைத்து, கோத்திர வழிவந்தோரைக் குறிக்கிறது.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן צוּעָר
  choice: சூவாரின் மகன்
  rationale: தந்தை–மகன் உறவை எபிரெய மூலத்துக்கு நேர்மையாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
