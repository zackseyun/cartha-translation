translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் பட்டியல் வடிவம் இயல்பான தமிழ் வாக்கிய அமைப்பாக வழங்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
