  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: ta
  text: நப்தலியின் மகன்களின் கோத்திரப் படைப்பிரிவுக்கு[a] தலைவனாக ஏனானின் மகன் அகிரா இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படை’, ‘சேனை’ அல்லது ‘அணி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் צְבָא, பாளயத்திலும் பயண அணிவகுப்பிலும் ஒழுங்கமைக்கப்பட்ட கோத்திரப் படையணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: தலைவனாக இருந்தான்
  rationale: எபிரெயத் தொடரில் உள்ள ‘மேல்/பொறுப்பில்’ என்ற தலைமை உறவை, முந்தைய பட்டியலோடு தொடரும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: பாளயமிடுதல் மற்றும் பயண அணிவகுப்பின் சூழலில், ஒழுங்கமைக்கப்பட்ட கோத்திரப் படையணியைக் குறிக்கிறது; முழுத் தேசிய இராணுவம் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இங்கு சொல்லின் பொருள் ‘கோல்’ அல்ல; இஸ்ரவேலின் கோத்திர அலகையே குறிக்கிறது.
- source_word: בְּנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்கள்
  rationale: எபிரெய மொழியின் வெளிப்படையான ‘நப்தலியின் மகன்கள்’ என்ற குடும்பச் சொல்லாட்சியைப் பேணுகிறது; இச்சூழலில் அது நப்தலியின் கோத்திர வழிவந்தோரைக் குறிக்கிறது.
- source_word: אֲחִירַע
  choice: அகீரா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן עֵינָן
  choice: ஏனானின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாள அமைப்பை இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத் தலைமைச் சொற்றொடர் தமிழில் இயல்பாக அமைய வாக்கிய முடிவில் ‘தலைவனாக இருந்தான்’ என வழங்கப்பட்டுள்ளது; கோத்திர மற்றும் தந்தைவழி அடையாளங்கள் தெளிவாகப் பேணப்பட்டுள்ளன.
