  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: ta
  text: பேழை புறப்படும்போதெல்லாம்[a], மோசே, “யாவே, எழுந்தருளுங்கள்[b]; உமது பகைவர்கள் சிதறிப்போகட்டும்; உம்மை வெறுப்பவர்கள் உமது முன்னிலையிலிருந்து தப்பியோடட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேழை புறப்பட்டபோது நிகழ்ந்தது என்னவென்றால்’. எபிரெய மொழிநடையை இவ்வாறு அதிகச் சொல்லர்த்தமாக மொழிபெயர்க்கலாம்; ஆனால் இங்கே ‘பேழை புறப்படும்போதெல்லாம்’ என்ற தொடர் நிகழ்வுப் பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘எழுந்தருளுங்கள்’ என்பது யாவே வல்லமையுடன் செயல்பட வேண்டுமென்ற வேண்டுதல்; கடவுள் சொல்லர்த்தமாகச் செயலற்றிருந்தார் என்று இது குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: புறப்படும்போதெல்லாம்
  rationale: இச்சூழலில் இந்த எபிரெய மொழிநடை ஒருமுறை நடந்த நிகழ்வை மட்டும் அல்லாமல், பேழை புறப்படும் ஒவ்வொரு சந்தர்ப்பத்தையும் குறிக்கிறது. ‘புறப்படும்போதெல்லாம்’ அந்தத் தொடர் நிகழ்வையும் காலப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: הָאָרֹן
  choice: பேழை
  rationale: எபிரெய மூலத்தில் ‘பேழை’ என்றே உள்ளது. ‘உடன்படிக்கைப் பேழை’ என்று விரிவாக்குவது இவ்வசனத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்த்துவிடும்.
- source_word: קוּמָה
  choice: எழுந்தருளுங்கள்
  rationale: யாவேயை நோக்கிய கட்டளை வடிவிலான வேண்டுதல் இது. கடவுள் வல்லமையுடன் செயல்பட வேண்டுமென்ற உயிரோட்டமான உருவகத்தை மரியாதையான, இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர். ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְיָפֻצוּ
  choice: சிதறிப்போகட்டும்
  rationale: கட்டளைக்குப் பின் வரும் இவ்வினை வேண்டுதல் பொருளுடையது. ‘-ட்டும்’ வடிவம் அந்த விருப்ப/மன்றாட்டு வலிமையையும், செயலின் உட்பாட்டு நுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹיְבֶיךָ
  choice: உமது பகைவர்கள்
  rationale: யாவேயை நேரடியாக நோக்கிய இரண்டாம் நபர் ஒருமைச் சுட்டுடன் கூடிய பன்மைப் பெயரின் நேரான, மரியாதையான தமிழ் வடிவம்.
- source_word: וְיָנֻסוּ
  choice: தப்பியோடட்டும்
  rationale: முந்தைய வினையைப் போலவே இது வேண்டுதல் பொருளுடைய வடிவம். ‘தப்பியோடட்டும்’ என்பது எதிரிகள் யாவேயின் முன்னிலையிலிருந்து ஓடுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מְשַׂנְאֶיךָ
  choice: உம்மை வெறுப்பவர்கள்
  rationale: தொடர்ந்து நிலவும் பகைமைப் பண்பைக் குறிக்கும் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מִפָּנֶיךָ
  choice: உமது முன்னிலையிலிருந்து
  rationale: யாவேயின் எதிரில் அல்லது அவரது பிரசன்னத்திலிருந்து பின்வாங்கி ஓடுதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, கடவுளின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ‘எழுந்தருளுங்கள்’ என்பதன் இறையியல் நுணுக்கம்
  choice: கடவுள் வல்லமையுடன் செயல்பட வேண்டுமென்ற உருவக வேண்டுதலாக வைத்தல்
  alternative: கடவுள் முன்பு செயலற்றிருந்தார் அல்லது படுத்திருந்தார் என்று சொல்லர்த்தமாகப் புரிதல்
  rationale: எபிரெயக் கட்டளை வடிவத்தின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்க வேண்டும்; அதேவேளை கடவுள் சொல்லர்த்தமாகச் செயலற்றிருந்தார் என்ற முடிவை உரையில் திணிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு மரியாதை குன்றாத வகையிலும் வடிவமைக்கப்பட்டது. யாவேயை நோக்கிய உரையில் ‘உமது/உம்மை’ மற்றும் ‘எழுந்தருளுங்கள்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இணை அமைப்பைப் பாதுகாக்க இரு வேண்டுதல்களிலும் ‘-ட்டும்’ வடிவம் வைக்கப்பட்டுள்ளது.
