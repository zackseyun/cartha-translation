revisions:
- from: 'நீ எங்களோடு சென்றால், யாவே எங்களுக்கு எந்த நன்மையைச் செய்கிறாரோ[a], அதை நாங்களும் உனக்குச் செய்வோம்.


    [a] இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “யாவே எங்களோடு செய்யும் அந்த நன்மையை நாங்கள் உனக்குச் செய்வோம்.”'
  to: நீ எங்களோடு சென்றால், யாவே எங்களுக்கு என்ன நன்மை செய்கிறாரோ, அந்த நன்மையை நாங்கள் உனக்குச் செய்வோம்.[a]
  rationale: திருத்தம் வாக்கியத்தை நவீன தரத் தமிழில் இயல்பாக்குகிறது; அதேவேளையில், யாவே இஸ்ரவேலருக்குச் செய்யும் ‘அந்த நன்மை’ மற்றும் அவர்கள் அந்த நபருக்குச் செய்யும் நன்மை என்ற எபிரெய வாக்கியத்தின் தொடர்பைத் தக்கவைக்கிறது. ‘அதே’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத வலியுறுத்தல் சேர்க்கப்படவில்லை. அடிக்குறிப்பும் எபிரெய இடியத்தின் பொருளுக்கு ஏற்ப திருத்தப்பட்டுள்ளது.
