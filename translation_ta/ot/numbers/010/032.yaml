source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: ta
  text: நீ எங்களோடு சென்றால், யாவே எங்களுக்கு என்ன நன்மை செய்கிறாரோ, அந்த நன்மையை நாங்கள் உனக்குச் செய்வோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “யாவே எங்களுக்குச் செய்யும் அந்த நன்மையை நாங்கள் உனக்குச் செய்வோம்.”'
    reason: הַטּוֹב הַהוּא (‘அந்த நன்மை’) என்ற அமைப்பையும், עִמָּנוּ உடைய இச்சூழலின் பயனாளி அர்த்தத்தையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: நீ ... சென்றால்
  rationale: இந்த எபிரெய தொடர் ஒரு நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘சென்றால்’ என்பது ‘அப்போது/நிகழும்போது’ என்று நிச்சயத்தை மிகைப்படுத்தாமல், இயல்பான தமிழில் நிபந்தனையைத் தெளிவாகக் காட்டுகிறது.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: நீ எங்களோடு சென்றால்
  rationale: הלך என்பதும் עִם என்பதும் இங்கு இஸ்ரவேலரின் பயணத்தில் உடன் செல்வதைக் குறிக்கின்றன. ‘எங்களோடு சென்றால்’ என்பது நேரடியும் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב
  choice: எந்த நன்மையைச் செய்கிறாரோ
  rationale: ‘நன்மை’ என்ற பெயர்ச்சொல்லையும் יטב என்ற வினையின் பொருளையும் தமிழில் இயல்பாக இணைத்து, யாவே அளிக்கும் நன்மை எதுவாயினும் அதை உள்ளடக்கும் திறந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: அதை நாங்களும் உனக்குச் செய்வோம்
  rationale: முன் வரும் ‘நன்மை செய்வது’ என்ற கருத்துடன் உள்ள சொல்லிணைப்பை ‘அதை’ என்பது தெளிவாகத் தொடர்கிறது; எபிரெயில் இல்லாத ‘அதே அளவு’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக அதைப் தமிழ் ஒலிபெயர்ப்பில் தருகிறது. ‘யெகோவா’ என்பது Jehovah மரபை பிரதிபலிப்பதால், Yahweh-க்கு நெருக்கமான ‘யாவே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: யாவே செய்யும் நன்மைக்கும் இஸ்ரவேல் செய்யும் நன்மைக்கும் இடையிலான தொடர்பு
  choice: ‘அதை நாங்களும் உனக்குச் செய்வோம்’ என்று தொடர்பைப் பாதுகாத்தல்
  alternative: ‘அதே நன்மையை நாங்கள் உனக்குச் செய்வோம்’
  rationale: இரு இடங்களிலும் יטב வேர் வருவதால் பரஸ்பரத் தொடர்பு உள்ளது. ஆனால் ‘அதே’ என்று வலியுறுத்துவது மூலத்தில் வெளிப்படையாக இல்லாத முழுச் சமத்துவத்தை உணர்த்தக்கூடும்; ‘அதை’ தொடர்பைப் பாதுகாத்தும் மிகைவிளக்கத்தைத் தவிர்த்தும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘நீ/உனக்கு’ வடிவங்கள் சூழலுக்கு ஏற்ப வைக்கப்பட்டுள்ளன; எபிரெய வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கச் சுருக்கப்பட்டுள்ளது.
