translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் சபை’ என்பது இஸ்ரவேல் சமூகக் கூட்டத்தைக் குறிக்கிறது; நவீன திருச்சபை என்ற குறுகிய பொருளைத் தவிர்க்க உதவுகிறது. கட்டளையின் ஒருமை மோசேயை நோக்கியதாகக் காக்கப்பட்டுள்ளது.
