- from: “உனக்காக வெள்ளியால் இரண்டு எக்காளங்களைச் செய். அவற்றைச் சுத்தியலால் அடித்துச் செய்ய வேண்டும். மக்கள் சபையை அழைத்துக் கூட்டுவதற்கும் முகாம்களைப் புறப்படச் செய்வதற்கும்[a] அவை உனக்குப் பயன்படும்.”
