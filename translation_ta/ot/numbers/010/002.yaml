  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: ta
  text: “உனக்காக வெள்ளியால் இரண்டு எக்காளங்களைச் செய். அவற்றை அடித்து உருவாக்கு. சபையைக் கூட்டுவதற்கும் முகாம்களைப் புறப்படச் செய்வதற்கும்[a] அவை உனக்குப் பயன்படும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முகாம்கள் புறப்படுவதற்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: உனக்காக ... செய்
  rationale: לְךָ தரும் மோசேயின் பயன்பாடு அல்லது பொறுப்புக்கான நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது; அவனே தனிப்பட்ட முறையில் உலோக வேலை செய்ய வேண்டும் என்று தேவையில்லாமல் உணர்த்துவதில்லை.
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: வெள்ளியால் இரண்டு எக்காளங்கள்
  rationale: חֲצֹצְרָה வளைந்த கொம்பை அல்ல, நேரான உலோக ஊதுகருவியைக் குறிக்கிறது; தமிழில் ‘எக்காளம்’ இதற்கான தெளிவான வழக்குச் சொல். כֶּסֶף பொருளை, அதாவது வெள்ளியை, குறிக்கிறது.
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: அவற்றைச் சுத்தியலால் அடித்துச் செய்ய வேண்டும்
  rationale: מִקְשָׁה உலோகத்தை அடித்து உருவாக்கும் செய்முறையைக் குறிக்கிறது. ‘ஒரே துண்டாக’ என்பது சாத்தியமான விளைவைச் சேர்த்து விளக்கும் மொழிபெயர்ப்பு என்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டது. எபிரெயத்தின் மீண்டும் வரும் ‘செய்’ என்ற கட்டளையும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: לְמִקְרָא הָעֵדָה
  choice: மக்கள் சபையை அழைத்துக் கூட்டுவதற்கு
  rationale: מִקְרָא என்பது இங்கு அழைப்பு அல்லது கூடுவதற்கான அறிவிப்பு; הָעֵדָה இஸ்ரவேல் சமூகச் சபையைக் குறிக்கிறது. ‘அழைத்துக் கூட்டுதல்’ இரண்டின் செயல்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: முகாம்களைப் புறப்படச் செய்வதற்கு
  rationale: מַסַּע முகாமிலிருந்து பயணத்தைத் தொடங்குதல் அல்லது புறப்படுதலைக் குறிக்கிறது. அடுத்தடுத்த முகாம் பிரிவுகளுக்குப் புறப்பாட்டு அறிகுறி கொடுப்பதே சூழலின் பொருள்; ஆகவே செயற்பாட்டு நுணுக்கம் காக்கப்படுகிறது.
