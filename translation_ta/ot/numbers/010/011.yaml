  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: ta
  text: இரண்டாம் ஆண்டின் இரண்டாம் மாதத்தின் இருபதாம் நாளில், சாட்சியின் திருக்கூடாரத்தின்[b] மேலிருந்து மேகம் மேலெழுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலே சென்றது’ அல்லது ‘எழுந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘சாட்சியின் திருக்கூடாரம்’; ‘சாட்சியின் கூடாரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: — (தமிழ் காலவாக்கிய அமைப்பில் இயல்பாக உட்பொதிக்கப்பட்டது)
  rationale: எபிரெயக் கதைத் தொடரை அறிமுகப்படுத்தும் வழக்கமான வடிவம். ‘அது நிகழ்ந்தது’ என்று தனியே மொழிபெயர்ப்பது இன்றைய தமிழில் செயற்கையாக இருப்பதால், காலக் குறிப்புடன் தொடங்கும் வாக்கிய அமைப்பிலேயே அதன் தொடர்ச்சி உணர்வு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: இரண்டாம் ஆண்டின்
  rationale: ஆண்டுக் கணக்கைக் குறிக்கும் நேரடியான காலச்சொற்றொடர்; அடுத்துவரும் மாதக் குறிப்புடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதம்
  rationale: ஆண்டிற்குள் வரும் மாதத்தை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: இருபதாம் நாளில்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘மாதத்தில் இருபதில்’ என்றாலும், தமிழில் தேதியைத் தெளிவாகக் கூற ‘நாள்’ சேர்க்கப்பட வேண்டும்.
- source_word: נַעֲלָה
  choice: மேலெழுந்தது
  rationale: עלה என்பது மேல்நோக்கிய நகர்வைக் குறிக்கிறது. மேகம் திருக்கூடாரத்தின் மேலிருந்த இடத்திலிருந்து அகன்று மேலே சென்றதைக் ‘மேலெழுந்தது’ இயல்பாகத் தெரிவிக்கிறது; செயப்பாட்டு ‘உயர்த்தப்பட்டது’ என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: வனாந்தரப் பயணத்தில் முன்பே அறியப்பட்ட குறிப்பிட்ட மேகத்தைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் தனி சுட்டுச்சொல் இன்றியும் குறிப்புத் தன்மை தெளிவாக உள்ளது.
- source_word: מֵעַל
  choice: மேலிருந்து
  rationale: திருக்கூடாரத்துக்கு மேலான நிலையிலிருந்து விலகிச் செல்லும் இடவியல் இயக்கத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: מִשְׁכַּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரத்தில் இருந்த எடுத்துச் செல்லக்கூடிய புனித உறைவிடத்திற்கான தெளிவான, வழக்கிலுள்ள வேதாகமத் தமிழ் சொல்.
- source_word: הָעֵדֻת
  choice: சாட்சியின்
  rationale: ஆலயச் சூழலில் עֵדוּת குறிக்கும் ‘சாட்சி’ என்ற அடிப்படைச் சொல்லையும் தொடர்புடைய வேதாகம இடங்களுடனான இணைப்பையும் பாதுகாக்கிறது; ‘உடன்படிக்கை’ என்பது இங்கு விளக்கமான விரிவாக்கமாகிவிடும்.
theological_decisions:
- issue: מִשְׁכַּן הָעֵדֻת என்ற பரிசுத்த இடத்தின் பெயர்
  choice: சாட்சியின் திருக்கூடாரம்
  alternative: சாட்சியின் உறைவிடம்; உடன்படிக்கையின் திருக்கூடாரம்
  rationale: முக்கிய சொற்களின் நேரடி பொருளையும் ஐந்தாகமத்திலுள்ள தொடர்புகளையும் காக்கிறது. ‘உடன்படிக்கை’ என்பது சூழலுக்குப் பொருந்தக்கூடிய விளக்கமாயினும், עֵדוּת என்பதன் நேரடி பொருள் அல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுத் தொடக்கத்தை தமிழில் செயற்கையான ‘அது நிகழ்ந்தது’ எனச் சேர்க்காமல் காலக் குறிப்புடன் இயல்பாகத் தொடங்கியுள்ளோம். ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றுக்குரிய சொற்களிலிருந்து இடம்பெயர்ந்திருந்ததால், தமிழ் முதன்மை உரையில் [a] மேகத்தின் மேலெழுதலுக்கும் [b] திருக்கூடாரப் பெயருக்கும் தொடர்பாக வைக்கப்பட்டுள்ளன.
