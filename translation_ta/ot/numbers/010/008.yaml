  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: ta
  text: ஆரோனின் மகன்களான ஆசாரியர்கள் எக்காளங்களை ஊத வேண்டும்; அவை உங்களுக்கு தலைமுறைதோறும் நிலையான நியமமாக[a] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்றென்றைக்கும் உரிய நியமமாக” அல்லது “நித்திய நியமமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களாகிய
  rationale: ‘ஆரோனின் மகன்கள்’ என்ற குடும்ப உறவைத் தக்கவைத்து, அடுத்து வரும் ‘ஆசாரியர்கள்’ என்பதுடன் இயல்பான தமிழ் இணைப்பை உருவாக்குகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ‘ஆரோனின் மகன்கள்’ யார் என்பதை விளக்கும் இணைப்புப் பெயராக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִתְקְעוּ
  choice: ஊத வேண்டும்
  rationale: எக்காளங்களைப் பற்றிய சூழலில் תקע என்பது ‘ஊது’ எனப் பொருள்படும்; சட்டப்பூர்வ அறிவுறுத்தலின் வலிமையை நவீன தமிழில் இயல்பாகக் காட்ட ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּחֲצֹצְרֹת
  choice: எக்காளங்களை
  rationale: חצצרות என்பதற்கான வழக்கமான தமிழ் வேதாகமச் சொல். இந்த வசனத்தில் ‘வெள்ளி’ என்று இல்லை என்பதால் அது சேர்க்கப்படவில்லை.
- source_word: וְהָיוּ לָכֶם
  choice: இது ... உங்களுக்கு ... இருக்க வேண்டும்
  rationale: எபிரெயத்தில் பன்மை வினை இருந்தாலும், முந்தைய முழு ஏற்பாட்டையும் தொகுத்துச் சுட்டும் சட்டவாக்கியமாக தமிழில் ஒருமை ‘இது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְחֻקַּת עוֹלָם
  choice: நிலையான நியமமாக
  rationale: சட்டவழக்குச் சொற்றொடரின் தொடர்ந்து நிலைக்கும் தன்மையை வெளிப்படுத்துகிறது; עוֹלָם என்பதன் காலவியல் நுணுக்கத்தை ‘என்றென்றைக்கும்’ என்று மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகளிலும் பொருந்துவதைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: חֻקַּת עוֹלָם என்பதன் காலவியல் வலிமை
  choice: நிலையான நியமம்
  alternative: என்றென்றைக்கும் உரிய நியமம் / நித்திய நியமம்
  rationale: இந்த எபிரெயச் சட்டவழக்குச் சொற்றொடர் உடன்படிக்கை வாழ்வில் தொடர்ந்து கடைப்பிடிக்கப்பட வேண்டிய ஏற்பாட்டைக் குறிக்கிறது. ‘நிலையான’ என்பது அதன் நீடித்த சட்ட வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் עוֹלָם ஒவ்வொரு சூழலிலும் தத்துவ ரீதியான முடிவற்ற காலத்தையே கட்டாயமாகக் குறிக்கிறது என்று தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்,’ ‘எக்காளங்கள்,’ ‘நியமம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன.
