- from: ஆரோனின் மகன்களாகிய ஆசாரியர்கள் எக்காளங்களை ஊத வேண்டும்; இது தலைமுறைதோறும் உங்களுக்கு நிலையான நியமமாக இருக்க வேண்டும்.[a]
  to: ஆரோனின் மகன்களான ஆசாரியர்கள் எக்காளங்களை ஊத வேண்டும்; அவை உங்களுக்கு தலைமுறைதோறும் நிலையான நியமமாக[a] இருக்கும்.
