id: NUM.10.20
reference: Numbers 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: ta
  text: மேலும், காதின் மகன்களின் கோத்திரப் படைப்பிரிவின் தலைவனாகத் தெவுவேலின் மகன் எலியாசாப் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவு” என்பதற்கு “படை” அல்லது “அணி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் צְבָא பெரும்பாலும் இராணுவப் பொருட்சாயல் கொண்டது; இங்கு அது ஒழுங்காக அணிவகுத்துப் பயணித்த கோத்திரக் குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: தலைவராக
  rationale: இப்பட்டியல் சூழலில் עַל ஒரு கோத்திரப் பிரிவின்மேல் அதிகாரம் வகிக்கும் தலைவரை அறிமுகப்படுத்துகிறது. முந்தைய வசனங்களுடன் உள்ள இணைப்பைத் தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: இச்சொல்லில் உள்ள இராணுவ ஒழுங்கமைப்பின் சாயலைக் காக்கிறது; இங்கு அது அணிவகுத்துப் பயணிக்கும் கோத்திரக் குழுவைக் குறிக்கிறது, தனியே போரிடும் படையை மட்டும் அல்ல.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இச்சூழலில் இது கைக்கோலை அல்ல, இஸ்ரவேலின் கோத்திர அலகைக் குறிக்கும் வழக்கமான சொல்.
- source_word: בְנֵי גָד
  choice: காதின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘காதின் மகன்கள்’ என்ற வடிவத்தைப் பாதுகாத்து, கோத்திரத்தாரைக் குறிக்கும் பெயராக இயல்பாக வழங்குகிறது.
- source_word: אֶלְיָסָף
  choice: எலியாசாப்
  rationale: தனிநபர் பெயர் எபிரெய உச்சரிப்பை அணுகும் தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בֶּן דְּעוּאֵל
  choice: தெகுவேலின் மகன்
  rationale: எபிரெயத் தந்தைவழிப் பெயரிடும் அமைப்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை. வசனம் பட்டியல் அமைப்பின் சுருக்கத்தைப் பேணுகிறது; இராணுவச் சாயலையும் பயண ஒழுங்கையும் ஒருங்கே தெரிவிக்க ‘படைப்பிரிவு’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
