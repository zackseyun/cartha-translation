id: NUM.10.17
reference: Numbers 10:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הוּרַ֖ד הַ/מִּשְׁכָּ֑ן וְ/נָסְע֤וּ בְנֵֽי גֵרְשׁוֹן֙ וּ/בְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַ/מִּשְׁכָּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: ta
  text: பின்பு திருவாசஸ்தலம் இறக்கப்பட்டது; திருவாசஸ்தலத்தைச் சுமப்பவர்களாகிய கெர்சோனின் மகன்களும் மெராரியின் மகன்களும் புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: இறக்கப்பட்டது
  rationale: ירד என்பதன் ஹொஃபால் வடிவம் செயப்பாட்டு-காரணப் பொருளைத் தருகிறது. இங்கு அமைக்கப்பட்டிருந்த திருவாசஸ்தலம் கீழிறக்கப்பட்டதைக் குறிக்கிறது; ‘பிரிக்கப்பட்டது’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தில் இல்லாத செயல்முறை விவரத்தைச் சேர்க்கும்.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது இஸ்ரவேலரின் பரிசுத்தக் கூடாரத்துக்கான நிலையான சொல். ‘திருவாசஸ்தலம்’ அதன் இறை வாசஸ்தலப் பொருளையும் வழிபாட்டுச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנָסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: பயணச் சூழலில் נסע என்பது முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மகன்கள்
  rationale: எபிரெய மூலத்தின் ‘கெர்சோனின் மகன்கள்’ என்ற குலவழி வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; ‘கெர்சோனியர்’ என்பதும் சூழல்சார் மாற்றாக இருக்கலாம்.
- source_word: וּבְנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: மூலத்தின் மகன்/குல வெளிப்பாட்டையும் இணை அமைப்பையும் பாதுகாக்கிறது; ‘மெராரியர்’ என்ற குலப்பெயரைத் தேவையின்றி மாற்றாக இடவில்லை.
- source_word: נֹשְׂאֵי
  choice: சுமந்துகொண்டு
  rationale: இப்பெயரெச்சம் அவர்கள் பயணிக்கையில் செய்த செயலைக் குறிக்கிறது. ‘சுமந்துகொண்டு’ என்பது தமிழில் தெளிவான, இயல்பான தொடர்வினை வடிவம்.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தை
  rationale: மூலம் இரண்டாம் முறையும் அதே பெயர்ச்சொல்லையே பயன்படுத்துகிறது. சூழலில் அதன் பிரிக்கப்பட்ட கூறுகள் சுமக்கப்பட்டன என்பது புரிந்தாலும், ‘பாகங்கள்’ என்று மூலத்தில் இல்லாத விவரம் சேர்க்கப்படவில்லை.
