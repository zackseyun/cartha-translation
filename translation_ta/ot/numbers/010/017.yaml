translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் எளிமை, கண்ணியம், மூலத்தின் இணை அமைப்பு ஆகியவை பேணப்பட்டுள்ளன. பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக ‘கெர்சோன்’, ‘மெராரி’ என்று வழங்கப்பட்டுள்ளன. வாசிப்பைத் தடுக்கும் தேவையற்ற அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
