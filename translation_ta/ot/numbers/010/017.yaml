- from: பின்பு திருவாசஸ்தலம் இறக்கப்பட்டது; கெர்சோனின் மகன்களும் மெராரியின் மகன்களும் திருவாசஸ்தலத்தைச் சுமந்துகொண்டு புறப்பட்டார்கள்.
  to: பின்பு திருவாசஸ்தலம் இறக்கப்பட்டது; திருவாசஸ்தலத்தைச் சுமப்பவர்களாகிய கெர்சோனின் மகன்களும் மெராரியின் மகன்களும் புறப்பட்டார்கள்.
