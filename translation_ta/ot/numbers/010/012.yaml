language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] தங்கள் பயணக் கட்டங்களின்படி சீனாய் வனாந்தரத்திலிருந்து புறப்பட்டார்கள்; மேகம் பாரான் வனாந்தரத்தில் தங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்.’ எபிரெயத்தில், ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பது இப்பயண விவரிப்பில் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழில் அந்த இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப உறவையும் வெளிப்படையான ஆண்பால் வடிவத்தையும் நேரடியாகப் பாதுகாக்கிறது; இயல்பான கூட்டுப்பெயரான ‘இஸ்ரவேலர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַסְעֵיהֶם
  choice: தங்கள் பயணக் கட்டங்களின்படி
  rationale: מַסָּע என்பதன் பன்மை வடிவம் தொடர்ச்சியான பயணக் கட்டங்கள் அல்லது அணிவகுப்புப் பயண நிலைகளைக் குறிக்கிறது; இத்தமிழாக்கம் அதன் பகிர்ந்தளிக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: מִמִּדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது குடியிருப்பும் பயிரிடுதலும் குறைந்த காட்டுப்புறப் பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ வேதாகமப் புவியியல் சூழலைப் பாதுகாக்கிறது, வெறும் மணற்பாலையைக் மட்டும் சுட்டுவதில்லை.
- source_word: וַיִּשְׁכֹּן
  choice: தங்கியது
  rationale: שכן என்பது தங்குதல் அல்லது நிலைகொள்ளுதல் என்று பொருள்படும்; வழிகாட்டிய மேகம் ஓர் இடத்தில் நின்றதை ‘தங்கியது’ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: வனாந்தரப் பயணத்தில் ஏற்கெனவே அறியப்பட்ட வழிகாட்டும் மேகத்தைக் குறிக்கும் திட்டவட்டமான சொல்லாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּמִדְבַּר פָּארָן
  choice: பாரான் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பதற்கு ஒரேமாதிரியாக ‘வனாந்தரம்’ பயன்படுத்தப்பட்டு, பாரான் என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இங்கு கோட்பாட்டுச் சர்ச்சை இல்லை; எனினும் மூலத்தின் ஆண்பால் குடும்பச் சொல்லாக்கத்தை முதன்மை உரை பாதுகாக்கிறது. வாசிப்பின் இயல்புக்காகக் கூட்டுப்பெயர் மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, தெளிவான நடையைக் கடைப்பிடிக்கிறது. மூலத்தின் பயணக் கட்டங்கள் என்ற கருத்தையும் ஆண்பால் குடும்பச் சொல்லாக்கத்தையும் வெளிப்படையாக வைத்துள்ளது; அரிதான அல்லது மிகப் பழமையான வினைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
