  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: இஸ்ரவேல் மக்களின் புறப்படுதல், அவர்களுடைய தொடர்ச்சியான பயணக் கட்டங்கள், சீனாய் வனாந்தரத்தின் தொடக்க இடம், பாரான் வனாந்தரத்தில் மேகம் தங்குதல் ஆகியவை காக்கப்பட்டுள்ளன. ‘தங்கள் பயணக் கட்டங்களின்படி’ என்பது לְמַסְעֵיהֶם என்பதன் ‘பயண நிலைகள்/கட்டங்கள்’ என்னும் பன்மை நுணுக்கத்தை ஏற்றவாறு வெளிப்படுத்துகிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘புறப்பட்டார்கள்’ மற்றும் ‘தங்கியது’ பயணவிவரிப்பு சூழலுக்கு இயல்பான சொற்கள். ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் சற்றே முறையான சொற்றொடராக இருந்தாலும், மூலத்தின் வெளிப்படையான குடும்ப-ஆண்பால் வடிவத்தைப் பாதுகாக்கும் நோக்கில் ஏற்றுக்கொள்ளத்தக்கது.
