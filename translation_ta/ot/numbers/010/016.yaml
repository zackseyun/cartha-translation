  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: ta
  text: செபுலோன் மகன்களின் கோத்திரத்தின் படைப்பிரிவுக்குத் தலைவனாக ஏலோனின் மகன் எலியாப் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவு” என்பதற்கு “அணி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அணிவகுத்துப் பயணம் செய்ய ஒழுங்குபடுத்தப்பட்ட கோத்திரக் குழுவைக் குறிக்கிறது.
