translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. எபிரெய வழிமுறைத் தொடரின் காலநிலைப் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, அதன் முறையான தொடர்வாக்கிய அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
