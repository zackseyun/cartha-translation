language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/תָקְע֖וּ בָּ/הֵ֑ן וְ/נֽוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: ta
  text: அவற்றை அவர்கள் ஊதும்போது[a], சபை முழுவதும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் உன்னிடம் ஒன்றுகூடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்கு நெருக்கமாக: “அவர்கள் அவற்றை ஊதுவார்கள்; சபை முழுவதும் உன்னிடம் ஒன்றுகூடும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: அவர்கள் ஊதும்போது
  rationale: எக்காளங்களை ஊதுவதைக் குறிக்கும் תקע என்ற வினை, இங்குள்ள வழிமுறைச் சூழலில் அடுத்த செயலைத் தூண்டும் காலநிலைப் பொருளைத் தருகிறது. எனவே இயல்பான தமிழில் ‘ஊதும்போது’ என்று மொழிபெயர்க்கப்பட்டது; அதன் முறையான தொடர்வாக்கியப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בָּהֵן
  choice: அவற்றை
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள இரண்டு வெள்ளி எக்காளங்களைக் குறிக்கிறது. தமிழில் ‘எக்காளங்களை ஊதுதல்’ என்பதால் நேர்ச்செயப்படுபொருளாக மொழிபெயர்ப்பது இயல்பு.
- source_word: וְנוֹעֲדוּ
  choice: ஒன்றுகூடும்
  rationale: Niphal வடிவிலுள்ள יעד, இங்கு அழைப்பின் பேரில் சமூகமெங்கும் குறிக்கப்பட்ட இடத்தில் கூடுவதைக் குறிக்கிறது. ‘ஒன்றுகூடும்’ என்பது அந்தக் கூட்டுச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உன்னிடம்/உன்னிடத்திற்கு’ என்று பொருள்படுகிறது. மோசேயிடம் சபை கூடிவருவதைத் தமிழில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் இது தெரிவிக்கிறது.
- source_word: כָּל הָעֵדָה
  choice: சபை முழுவதும்
  rationale: עֵדָה இஸ்ரவேலின் ஒட்டுமொத்த உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபை முழுவதும்’ என்பது அதன் கூட்டான, அனைவரையும் உள்ளடக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: פֶּתַח என்பது உள்ளே செல்லும் திறப்பு அல்லது வாயிலைக் குறிக்கிறது. கூடாரச் சூழலில் ‘நுழைவாயில்’ தெளிவான நவீனத் தமிழ்.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இந்தச் சொற்றொடர் நியமிக்கப்பட்ட சந்திப்பிற்கான கூடாரத்தைக் குறிக்கிறது. ‘சந்திப்புக் கூடாரம்’ என்பது பொருளை வெளிப்படையாகவும் எளிதில் புரியுமாறும் தருகிறது.
