base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: ta
  text: நீங்கள் இரண்டாவது எச்சரிக்கை ஒலியை[a] ஊதும்போது, தென்புறத்தில் தங்கியிருக்கும் முகாம்கள் புறப்பட வேண்டும்; அவர்கள் அவர்களுடைய புறப்பாடுகளுக்காக எச்சரிக்கை ஒலியை ஊத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எச்சரிக்கை ஒலி” என்பதற்கு “சமிக்ஞை ஒலி” அல்லது “தனித்துவமான எக்காள முழக்கம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் תְּרוּעָה; இங்கு முகாம்களை வழிநடத்தப் பயன்படுத்தப்பட்ட குறிப்பிட்ட எக்காளச் சமிக்ஞையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: நீங்கள் ... ஊதும்போது
  rationale: תקע என்பது இச்சூழலில் எக்காளத்தை ஊதுவதைக் குறிக்கிறது. இரண்டாம் நபர் பன்மையையும், முந்தைய கட்டளையைத் தொடர்ந்து நிகழும் காலச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּרוּעָה
  choice: எச்சரிக்கை ஒலி
  rationale: முகாம்களின் புறப்பாட்டை வழிநடத்தும் தனித்துவமான எக்காளச் சமிக்ஞையை இங்கு குறிக்கிறது; பொதுவான ஓசை அல்லது மனித முழக்கம் என்று தவறாகப் புரிந்துகொள்ளாத வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁנִית
  choice: இரண்டாவது
  rationale: תְּרוּעָה என்பதைக் குறிப்பாக்கும் வரிசை எண்ணாக இருப்பதால் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְנָסְעוּ
  choice: புறப்பட வேண்டும்
  rationale: נסע என்பது முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; கட்டளையின் எதிர்கால/விதிப்பொருளை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: முகாமிட்டிருக்கும் முகாம்கள்
  rationale: பன்மையான பழங்குடி முகாம் அணிகளையும் அவை தங்கியிருக்கும் நிலையையும் மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: תֵּימָנָה
  choice: தென்புறத்தில்
  rationale: இங்கு பயணத்தின் திசையைக் காட்டுவதற்குப் பதிலாக முகாம்கள் அமைந்துள்ள இடத்தைக் குறிக்கிறது.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: அவர்கள் ... எச்சரிக்கை ஒலியை ஊத வேண்டும்
  rationale: எபிரெய வினை மூன்றாம் நபர் பன்மை செயப்பாட்டில் இருப்பதைப் பாதுகாக்கிறது; அதை ஆதாரமில்லாமல் செயப்பாட்டு வினையாக மாற்றவில்லை.
- source_word: לְמַסְעֵיהֶם
  choice: அவர்கள் புறப்படுவதற்காக
  rationale: முகாம்கள் தங்கள் பயணக் கட்டத்தைத் தொடங்கும் நிகழ்வைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
