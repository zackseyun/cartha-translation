  source_fidelity: கருத்து பெரும்பாலும் மூல எபிரெயத்துக்கு உண்மையாக உள்ளது. ஆயினும் לְצִבְאֹתָם என்பது எல்லா முகாம்களின் ஒழுங்கமைக்கப்பட்ட அணிவகுப்புப் பிரிவுகளைச் சுட்டுவதால், அந்தத் தொடர்பைத் தமிழில் இன்னும் தெளிவாகக் காட்டுவது நல்லது. பெயர்களின் எழுத்துப்பெயர்ப்பும் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் திருத்தப்பட்டுள்ளது.
