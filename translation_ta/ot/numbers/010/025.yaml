source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: ta
  text: பின்னர் தாண் மக்களின் முகாமுக்குரிய கொடி[a], எல்லா முகாம்களின் அணிவகுப்புப் பிரிவுகளின்படி[c] அவற்றுக்குப் பின்காவலாக[b] புறப்பட்டது; அதன் பிரிவுக்குத் தலைவனாக அம்மீசத்தாயின் மகன் அகியேசேர் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொடி’ என்பதை ‘அடையாளக்கொடி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பின்காவலாக’ என்பதற்கு ‘பின்னால் இருப்பவர்களைத் திரட்டிக்கொண்டு செல்லும் அணியாக’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள எபிரெயச் சொல் ‘படைகள்’ அல்லது ‘அணிகள்’ என்றும் மொழிபெயர்க்கப்படலாம்; இச்சூழலில் அது பயண அணிவகுப்பில் ஒழுங்கமைக்கப்பட்ட கோத்திரப் பிரிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: பின்னர் ... புறப்பட்டது
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. பயணச் சூழலில் ‘புறப்பட்டது’ இயல்பான நவீனத் தமிழ்; ‘பின்னர்’ நிகழ்வின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: דֶּגֶל
  choice: கொடி
  rationale: இது ஒவ்வொரு கோத்திர முகாமையும் அடையாளப்படுத்திய கொடி அல்லது அணிவகுப்புச் சின்னத்தைக் குறிக்கிறது. ‘கொடி’ எளிமையாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מַחֲנֵה
  choice: முகாம்
  rationale: இஸ்ரவேலரின் கோத்திர அடிப்படையிலான பாளையத்தை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: בְנֵי דָן
  choice: தாணின் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘தாணின் மகன்கள்’ என்றாலும், இங்கு அது தாண் கோத்திரத்தாரை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘மக்கள்’ குடும்ப வழித்தோன்றல் சார்ந்த கூட்டுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְאַסֵּף
  choice: பின்காவலாக
  rationale: இந்த அணிவகுப்புச் சூழலில் கடைசியில் சென்று பின்புறத்தைப் பாதுகாக்கும் பிரிவை இச்சொல் குறிக்கிறது. ‘பின்காவல்’ அந்தச் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது; ‘பின்னால் திரட்டிச் செல்பவர்’ என்ற சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְכָל הַמַּחֲנֹת
  choice: எல்லா முகாம்களுக்கும்
  rationale: தாணின் முகாம் முழு அணிவகுப்புக்கும் தொடர்பாகப் பின்காவலாகச் செயல்பட்டதை לְ என்னும் முன்னொட்டின் இயல்பான உறவுப்பொருளோடு தெரிவிக்கிறது.
- source_word: לְצִבְאֹתָם
  choice: அவற்றின் படைப்பிரிவுகளின்படி
  rationale: צְבָאוֹת என்பது இங்கு வெறும் போர்ப்படைகளைக் காட்டிலும் பயணத்திற்காக ஒழுங்கமைக்கப்பட்ட கோத்திரப் பிரிவுகளைக் குறிக்கிறது. ‘படைப்பிரிவுகள்’ இராணுவத் தன்மையையும் அணிவகுப்பு ஒழுங்கையும் தக்கவைக்கிறது.
- source_word: וְעַל צְבָאוֹ
  choice: அதன் படைப்பிரிவுக்குத் தலைவனாக ... இருந்தான்
  rationale: עַל இங்கு அந்தப் பிரிவின்மேல் நியமிக்கப்பட்ட தலைமைப் பொறுப்பைக் குறிக்கிறது. எபிரெய அமைப்பின் பொருளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: அம்மிசத்தாயின் மகன் அகியேசர்
  rationale: பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; בֶּן என்னும் வழக்கமான தந்தைவழி உறவு ‘மகன்’ என்று தக்கவைக்கப்பட்டுள்ளது.
