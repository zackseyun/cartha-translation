  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் தங்கள் படைப்பிரிவுகளின்படி மேற்கொண்ட பயணக் கட்டங்கள்[a] இவையே; அவர்கள் புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயணங்கள்” அல்லது “புறப்பாடுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பின்னோக்கிச் சுருக்கிக் கூறும் பன்மைச் சுட்டுப்பெயர்; எபிரெயத்தில் வெளிப்படையான இணைப்பு வினை இல்லாததால் தமிழில் இயல்பாக வாக்கிய முடிவில் அமைக்கப்பட்டது.
- source_word: מַסְעֵי
  choice: பயணக் கட்டங்கள்
  rationale: מַסָּע என்பதன் இணைப்புநிலைப் பன்மை; தொடர்ச்சியான புறப்பாடுகள் அல்லது அணிவகுப்புப் பயணத்தின் கட்டங்களைக் குறிக்கிறது. சூழலில் உள்ள தொடர் நகர்வுகளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனக்குழுப் பெயர். நவீன தமிழில் இயல்பும் உள்ளடக்கத் துல்லியமும் கருதி 'மக்கள்' பயன்படுத்தப்பட்டது.
- source_word: לְצִבְאֹתָם
  choice: படைப்பிரிவுகளின்படி அமைந்த
  rationale: צָבָא என்பது இங்கு போரில் ஈடுபடும் படையை மட்டும் அல்லாமல், பயணத்திற்காக ஒழுங்குபடுத்தப்பட்ட பெரிய குழுக்களையும் குறிக்கலாம். 'படைப்பிரிவுகள்' அதன் இராணுவப் பாங்கைத் தக்கவைக்கிறது; 'அமைந்த' என்பது பயணக் கட்டங்களோடு அதன் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וַיִּסָּעוּ
  choice: அவர்கள் புறப்பட்டுச் சென்றார்கள்
  rationale: נסע என்பதன் தொடர்கதை வடிவம்; ஓர் இடத்திலிருந்து பயணத்தைத் தொடங்கிய நகர்வைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
