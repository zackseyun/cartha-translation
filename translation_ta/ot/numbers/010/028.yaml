  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் சுருக்கத் தன்மை காக்கப்பட்டுள்ளது; צבאות என்பதிலுள்ள ஒழுங்கமைந்த, இராணுவப் பாங்கு மிகைப்படுத்தப்படாமல் வெளிப்படுத்தப்பட்டுள்ளது.
