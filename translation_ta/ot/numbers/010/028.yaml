revisions:
- from: இஸ்ரவேல் மக்களின் படைப்பிரிவுகளின்படி அமைந்த பயணக் கட்டங்கள்[a] இவையே; அவர்கள் புறப்பட்டுச் சென்றார்கள்.
  to: இஸ்ரவேல் மக்கள் தங்கள் படைப்பிரிவுகளின்படி மேற்கொண்ட பயணக் கட்டங்கள்[a] இவையே; அவர்கள் புறப்பட்டார்கள்.
  rationale: The revision places “தங்கள் படைப்பிரிவுகளின்படி” with “இஸ்ரவேல் மக்கள் ... மேற்கொண்ட,” correctly identifying the people as travelling according to their divisions. It preserves the retrospective demonstrative (“இவையே”), the travel-stage sense of מַסְעֵי, and the separate concluding action, “அவர்கள் புறப்பட்டார்கள்.”
