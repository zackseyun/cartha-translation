revisions:
- from: அவர்கள் யாவேயின் மலையிலிருந்து மூன்று நாள் பயணமாகப் புறப்பட்டுச் சென்றார்கள்[a]. யாவேயின் உடன்படிக்கைப் பெட்டி, அவர்களுக்கு ஓய்விடம் ஒன்றைத் தேடிக் கண்டுபிடிப்பதற்காக[b], மூன்று நாள் பயணமாக அவர்களுக்கு முன்னால் சென்றது.
  to: அவர்கள் யாவேயின் மலையிலிருந்து மூன்று நாள் பயணத் தூரம் பயணித்தார்கள்[a]. யாவேயின் உடன்படிக்கைப் பெட்டி அவர்களுக்கு முன்னால் மூன்று நாள் பயணத் தூரம் சென்று, அவர்களுக்கு ஓய்விடம் ஒன்றைத் தேடி ஆராய்வதற்காக இருந்தது[b].
  rationale: The revision makes the repeated travel-measure idiom idiomatic and parallel in Tamil, and it removes the added implication that the ark necessarily ‘found’ the resting place. ‘சென்று ... இருந்தது’ seeks to reflect the attendant/ongoing nuance of the Hebrew participle while remaining readable in Tamil.
