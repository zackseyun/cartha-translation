  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: ta
  text: அவர்கள் யாவேயின் மலையிலிருந்து மூன்று நாள் பயணத் தூரம் பயணித்தார்கள்[a]. யாவேயின் உடன்படிக்கைப் பெட்டி அவர்களுக்கு முன்னால் மூன்று நாள் பயணத் தூரம் சென்று, அவர்களுக்கு ஓய்விடம் ஒன்றைத் தேடி ஆராய்வதற்காக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மூன்று நாள் வழி”; “மூன்று நாள் பயணத் தொலைவு” என்றும் மொழிபெயர்க்கலாம். இதே சொற்றொடர் வசனத்தில் இருமுறை வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேடுவதற்காக” அல்லது “உளவு ஆராய்வதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டுச் சென்றார்கள்’ என்பது அந்த இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵהַר יְהוָה
  choice: யாவேயின் மலையிலிருந்து
  rationale: הַר என்பதற்கு ‘மலை’ என்பது நேரான பொருள்; יהוה என்ற இறைப் பெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணமாக
  rationale: கால அளவுடன் வரும் דֶּרֶךְ பயணத்தின் அளவையோ தொலைவையோ குறிக்கிறது. இரு இடங்களிலும் ஒரே சொற்றொடர் வைக்கப்பட்டு மூலத்தின் மீள்வருகை பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பின் உறவைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தருகிறது. אָרוֹן இச்சூழலில் புனித உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது.
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் சென்றது
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான உடனிகழ்வை தமிழின் சூழலுக்கேற்ற இறந்தகால வினையால் இயல்பாக வெளிப்படுத்துகிறது; לִפְנֵיהֶם என்பதன் இடவியல் பொருளான ‘முன்னால்’ பாதுகாக்கப்படுகிறது.
- source_word: לָתוּר
  choice: தேடிக் கண்டுபிடிப்பதற்காக
  rationale: תור என்பது தேடுதல், ஆராய்தல், ஏற்ற ஒன்றைக் கண்டறிதல் ஆகிய பொருள்களைக் கொண்டது. இங்கு ஓய்விடத்தைக் கண்டறிதலே நோக்கம்; இராணுவ நிழலுள்ள ‘உளவு பார்க்க’ தவிர்க்கப்படுகிறது.
- source_word: מְנוּחָה
  choice: ஓய்விடம் ஒன்று
  rationale: பயணச் சூழலில் இது கருத்தளவிலான ஓய்வை மட்டும் அல்லாமல் தங்கிப் ஓய்வெடுக்க ஏற்ற இடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: உடன்படிக்கைப் பெட்டி மக்களுக்கு முன்னால் சென்றதன் வெளிப்பாடு
  choice: அவர்களுக்கு முன்னால் சென்றது
  alternative: அவர்களுக்கு வழிகாட்டியது
  rationale: மூலம் அதன் இடத்தை மட்டும் வெளிப்படையாகக் கூறுகிறது; ‘வழிகாட்டியது’ என்பது சாத்தியமான உட்கருத்தாக இருந்தாலும், அதை உரைக்குள் சேர்க்காமல் விடுவது இறையியல் விளக்கத்தைத் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் ‘மூன்று நாள் பயணம்’ என்ற கருத்து இரு இடங்களிலும் பாதுகாக்கப்பட்டுள்ளது; நீண்ட வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
