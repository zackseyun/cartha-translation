source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: ta
  text: சிமியோன் மக்களின் கோத்திரப் படைப்பிரிவுக்குத் தலைவனாகச் சூரிஷத்தாயின் மகன் செலுமியேல் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைப்பிரிவு’ என்பதற்கான எபிரேயச் சொல் (צְבָא) ‘படை’ அல்லது ‘அணி’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது ஒழுங்குபடுத்தப்பட்ட கோத்திர அணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: தலைவனாக
  rationale: அணிவகுப்புச் சூழலில் עַל என்பது ஒரு கோத்திரப் படைப்பிரிவின்மேல் நியமிக்கப்பட்ட தலைமைப் பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பாக முழு வாக்கியமாக்க ‘தலைவனாக ... இருந்தான்’ என மொழிபெயர்க்கப்பட்டது; தொடக்க וְ தொடர்ச்சியால் வெளிப்படும் இணைப்பு வசனச் சூழலில் தெளிவாக இருப்பதால் தனியே ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: צְבָא
  choice: படைப்பிரிவு
  rationale: இங்கு ஒழுங்குபடுத்தப்பட்ட கோத்திர அணியைக் குறிக்கிறது; செயலில் போரிடும் படையை மட்டும் குறிக்காது. ‘படைப்பிரிவு’ அதன் ஒழுங்கமைந்த, அணிவகுக்கும் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் பாளைய அணிவகுப்புச் சூழல்களில் இது இஸ்ரவேலின் கோத்திர அலகைக் குறிக்கும் வழக்கமான சொல்.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: சிமியோனின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘சிமியோனின் மகன்கள்’ என்றாலும், இது ஆண் பிள்ளைகளை மட்டும் அல்லாமல் முழுக் கோத்திரத்தையும் குறிக்கும் மரபுச் சொற்றொடர். நவீன தமிழில் ‘மக்கள்’ அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: שְׁלֻמִיאֵל
  choice: செலுமியேல்
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: இது நேரடியான தந்தைவழி அடையாளம்; ஆகவே ‘மகன்’ என்பது தெளிவான சமமான சொல்.
- source_word: צוּרִי שַׁדָּי
  choice: சூரிஷத்தாய்
  rationale: எபிரேயத் தனிப்பெயர் ஒரே பெயராகத் தமிழ் ஒலியமைப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
