translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேயப் பெயர்கள் மூல ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; பட்டியல் வடிவிலுள்ள எபிரேயத் தொடரை இயல்பான தமிழ் முழு வாக்கியமாக வழங்கியுள்ளோம்.
