source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: ta
  text: மேலும், கோகாத்தியரின் குடும்பங்களுக்கான மூதாதையர் வீட்டின்[b] தலைவர்[a] ஊசியேலின் மகன் எலிசாப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘தலைவர்’ அல்லது ‘பிரபு’ என்றும் மொழிபெயர்க்கலாம் (எபிரேயம்: נָשִׂיא).'
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘தந்தையின் வீடு’; இது தந்தைவழி மூதாதையரால் இணைக்கப்பட்ட குலக் குடும்ப அலகைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: தலைவன்
  rationale: נָשִׂיא என்பது தலைவர், தலைவன், அல்லது பிரபு எனப் பொருள்படலாம். இங்குள்ள கோத்திர நிர்வாகச் சூழலில் அரசாட்சிப் பொருளைச் சுமத்தாமல் அங்கீகரிக்கப்பட்ட அதிகாரத்தைக் காட்டுவதற்கு ‘தலைவன்’ இயல்பானது. தொடக்க ו தமிழ் வாக்கியத்தில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல், பட்டியலின் தொடர்ச்சி வாக்கிய அமைப்பால் உணர்த்தப்படுகிறது.
- source_word: בֵית אָב
  choice: மூதாதையர் வீடு
  rationale: சொல்லுக்கு சொல் ‘தந்தையின் வீடு’ என்றாலும், இது தந்தைவழி மரபில் அமைந்த குலக் குடும்ப அலகைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘மூதாதையர் வீடு’ அதன் சமூக மற்றும் உறவுமுறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְמִשְׁפְּחֹת
  choice: குடும்பங்களுக்குரிய
  rationale: מִשְׁפָּחוֹת என்பது குடும்பக் குழுக்கள் அல்லது குலங்களைக் குறிக்கிறது. לְ முன்னொட்டின் தொடர்பை வெளிப்படுத்தவும், ‘மூதாதையர் வீடு’ என்பதுடனான அடுக்குமுறை உறவைத் தெளிவாக்கவும் ‘குடும்பங்களுக்குரிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַקְּהָתִי
  choice: கோகாத்தியரின்
  rationale: ஒருமை வடிவிலுள்ள இனக்குழுப் பெயர் இங்கு கோகாத்தின் வழிவந்தவர்களைத் தொகுப்பாகக் குறிக்கிறது; ஆகவே தமிழில் பன்மைக் குழுவைக் காட்டும் ‘கோகாத்தியர்’ பயன்படுத்தப்பட்டது.
- source_word: אֶלִיצָפָן
  choice: எலிசாப்பான்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן עֻזִּיאֵל
  choice: ஊசியேலின் மகன்
  rationale: வம்ச அடையாளத்தைக் கூறும் வழக்கமான எபிரேய சொற்றொடர் தமிழில் இயல்பாக ‘ஊசியேலின் மகன்’ என வழங்கப்பட்டது.
