translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் பாணியின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. உறவுமுறை அடுக்குகளை மறைக்காமல், இன்றைய வாசகருக்கு புரியும் சொற்கள் பயன்படுத்தப்பட்டன.
