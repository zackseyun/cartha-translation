base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, மோசே இஸ்ரவேலின் மகன்களிடையே[a] முதற்பேறான ஒவ்வொருவரையும் எண்ணினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இஸ்ரவேலின் மகன்களிடையே”; இதை “இஸ்ரவேலரிடையே” அல்லது “இஸ்ரவேலின் பிள்ளைகளிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: எண்ணினார்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது ஆட்களை எண்ணுவதைக் குறிக்கிறது. “எண்ணினார்” என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: மோசேயின் செயல் தெய்வீகக் கட்டளைக்கு அப்படியே ஒத்திருந்ததை “படியே” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் நேரடியான பொருளை இது தருகிறது; தமிழில் தொடர்பெயரெச்ச அமைப்பு நிகழ்வுகளின் காலவரிசையையும் இயல்பாக உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֹתוֹ
  choice: மோசேக்கு
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயர் மோசேயைக் குறிக்கிறது. தமிழில் குழப்பத்தைத் தவிர்க்க அவரது பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת כָּל בְּכֹר
  choice: முதற்பேறான ஒவ்வொருவரையும்
  rationale: כָּל என்பதன் பகிர்ந்தளிக்கும் முழுமையை “ஒவ்வொருவரையும்” வெளிப்படுத்துகிறது. இவ்வசனத்தில் வெளிப்படையாக இல்லாத “ஆண்” என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிடையே
  rationale: בני என்ற ஆண்பால் உறவுமுறைச் சொல்லைத் தக்கவைத்து, முன்னொட்டு ב இந்த எண்ணும் சூழலில் தரும் “இடையே” என்ற பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கெழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துவதால், அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாகத் தக்கவைத்துள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்களிடையே
  alternative: இஸ்ரவேலரிடையே / இஸ்ரவேலின் பிள்ளைகளிடையே
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரையில் காக்கிறது; இயல்பான பொதுப்பொருள் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. “மோசே” என்ற பெயர் மீண்டும் வருவது தமிழில் சற்றே மீளுரைப்பாக இருந்தாலும், யாருக்கு யாவே கட்டளையிட்டார் என்ற சுட்டுப்பெயர்க் குழப்பத்தைத் தவிர்க்கிறது. “முதற்பேறானவர்” என்பதில் மூலவசனம் வெளிப்படையாகக் குறிப்பிடாத ஆண்பாலைச் சேர்க்கவில்லை.
