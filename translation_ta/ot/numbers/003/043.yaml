translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கணக்கெடுப்பு மரபுத்தொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு, அதன் சொற்பொருள் நுட்பம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
