- from: பெயர்ப் பட்டியலின்படி எண்ணப்பட்ட, ஒரு மாதமும் அதற்கு மேற்பட்ட வயதுள்ள முதற்பேறான ஆண்கள்[a] அனைவரின் மொத்த எண்ணிக்கை இருபத்திரண்டாயிரத்து முந்நூற்று எழுபத்துமூன்று[b].
  to: பெயரால் பட்டியலிடப்பட்ட, ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட முதற்பேறான ஆண்கள்[a] அனைவரின் கணக்கெடுப்பு எண்ணிக்கை இருபத்திரண்டாயிரத்து முந்நூற்று எழுபத்து மூன்று[b] ஆக இருந்தது.
