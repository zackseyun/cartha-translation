base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: ta
  text: பெயரால் பட்டியலிடப்பட்ட, ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட முதற்பேறான ஆண்கள்[a] அனைவரின் கணக்கெடுப்பு எண்ணிக்கை இருபத்திரண்டாயிரத்து முந்நூற்று எழுபத்து மூன்று[b] ஆக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயரால் பட்டியலிடப்பட்ட” என்பது ஒவ்வொருவரும் பெயரால் தனித்தனியாகப் பதிவு செய்யப்பட்டு எண்ணப்பட்டதைக் குறிக்கும் கணக்கெடுப்பு மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “கணக்கெடுப்பு எண்ணிக்கை” என்பதற்கு “அவர்களுடைய அதிகாரப்பூர்வப் பதிவின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அந்தக் குழுவின் முறையான கணக்கெடுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: மொத்த எண்ணிக்கை ...
  rationale: எபிரெய வினைச்சொல் இங்கு கணக்கெடுப்பின் முடிவை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக எண்ணிக்கைத் தொகையை மையப்படுத்தி மொழிபெயர்க்கப்பட்டது.
- source_word: כָל בְּכוֹר זָכָר
  choice: முதற்பேறான ஆண்கள் அனைவரின்
  rationale: பிறப்பு வரிசையையும் ஆண்பாலுக்கான வரம்பையும் காத்து, כָל என்பதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்ப் பட்டியலின்படி எண்ணப்பட்ட
  rationale: ஒவ்வொருவரும் பெயரால் பதிவு செய்யப்பட்ட கணக்கெடுப்பு மரபுத்தொடரின் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ஒரு மாதமும் அதற்கு மேற்பட்ட வயதுள்ள
  rationale: கணக்கெடுப்புக்கான குறைந்தபட்ச வயது ஒரு மாதம் என்பதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: לִפְקֻדֵיהֶם
  choice: மொத்த எண்ணிக்கை
  rationale: குழுவின் அதிகாரப்பூர்வக் கணக்கெடுப்பு எண்ணிக்கையைச் சுட்டும் சொற்றொடராக இங்கு புரிந்துகொள்ளப்படுகிறது; தமிழில் தேவையற்ற மறுமொழியைத் தவிர்த்து முடிவுத் தொகையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: இருபத்திரண்டாயிரத்து முந்நூற்று எழுபத்துமூன்று
  rationale: 'எபிரெய எண்ணின் கூறுகளை நவீனத் தமிழின் வழக்கமான வரிசையில் துல்லியமாக வழங்குகிறது: 22,373.'
