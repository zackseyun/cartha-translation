  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் முன்னால், கிழக்கே[a]—சூரியன் உதிக்கும் திசையில் சந்திப்புக் கூடாரத்தின் முன்னால்—முகாமிட்டிருந்தவர்கள் மோசேயும் ஆரோனும் அவனுடைய மகன்களும் ஆவர்; அவர்கள் இஸ்ரயேல் மக்களுக்காகப் பரிசுத்த இடத்தின் காவற்பொறுப்பைக் காத்தவர்கள். ஆனால் அணுகுகிற அனுமதியற்ற நபர்[b] கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிழக்கு நோக்கி … கிழக்கில்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் வலியுறுத்தலுக்காகத் தொடர்புடைய இரண்டு திசைச் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “அனுமதியற்ற நபர்” என்பது இனத்தால் அந்நியனைக் குறிப்பாகக் குறிக்கவில்லை; பரிசுத்த இடத்தின் பணியை அணுக அனுமதிக்கப்படாத நபரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: முகாமிட்டவர்கள்
  rationale: பெயர்ச்சொல் போன்று செயல்படும் எபிரெயப் பங்கேற்பு வடிவத்தை, இந்த முகாம் அமைப்பு விவரிப்புக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின் முன்புறத்தில்
  rationale: לִפְנֵי என்பதன் இடப்பொருளையும், מִשְׁכָּן என்பதைக் கூடாரச் சந்திப்பு அமைப்பிலிருந்து வேறுபடுத்தியும் வெளிப்படுத்துகிறது.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: கிழக்கே ... சூரியன் உதிக்கும் திசையில்
  rationale: ஒரே கிழக்குத் திசையை வலியுறுத்தும் தொடர்புடைய இரு எபிரெயச் சொற்றொடர்களையும் ஒரே சொல்லாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவனுடனான நியமிக்கப்பட்ட சந்திப்புக்குரிய கூடாரம் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: மோசேயும் ஆரோனும் அவனுடைய மகன்களும்
  rationale: ‘மகன்கள்’ என்பதிலுள்ள ஒருமை உடைமைப் பின்னொட்டைத் தக்கவைக்கிறது; அதன் இயல்பான அண்மைச் சுட்டு ஆரோன்.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: காவற்பொறுப்பை நிறைவேற்றினார்கள்
  rationale: ஒரே வேரிலிருந்து வந்த வினை-பெயர்ச்சொல் அமைப்பின் காவல் மற்றும் ஒப்படைக்கப்பட்ட கடமை ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: הַמִּקְדָּשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு ஒரு தனி அறையை மட்டும் அல்லாமல் புனித சரணாலயப் பகுதியையும் அதன் பணியையும் குறிக்கும் பரந்த சொல்லாக உள்ளது.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்களின் சார்பாக
  rationale: இஸ்ரயேல் சமூகத்துக்குரிய பரிசுத்த இடப் பொறுப்பை நியமிக்கப்பட்டவர்கள் பிரதிநிதிகளாக நிறைவேற்றியதை அளவுக்கு மீறிய விளக்கமின்றி உணர்த்துகிறது.
- source_word: וְהַזָּר
  choice: அனுமதியற்றவன்
  rationale: இன அடிப்படையிலான அந்நியனை அல்ல, பரிசுத்த பணியை அணுக அதிகாரம் அளிக்கப்படாத நபரைச் சூழலுக்கேற்ப குறிக்கிறது.
- source_word: הַקָּרֵב
  choice: அருகில் வந்தால்
  rationale: பரிசுத்த இடத்தை முறையின்றி அணுகுவதை எளிய, நேரடியான தமிழில் தருகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: எபிரெய மொழியின் காரணப்பாட்டு-செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, வெறுமனே ‘இறப்பான்’ என்பதற்குப் பதிலாக விதிக்கப்பட்ட மரணதண்டனையைக் காட்டுகிறது.
theological_decisions:
- issue: ‘அவனுடைய மகன்கள்’ என்பதன் சுட்டுப்பொருள்
  choice: ஆரோனுடைய மகன்கள்
  alternative: மோசே, ஆரோன் ஆகிய இருவருடனும் தொடர்புடைய குடும்பத்தினர்
  rationale: ‘மகன்கள்’ என்பதோடு சேர்ந்துள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, அதற்கு உடனடியாக முன்வரும் ஆரோனை இயல்பாகச் சுட்டுகிறது; அத்தியாயச் சூழலிலும் ஆசாரியக் காவற்பணி ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் உரியது.
- issue: சரணாலயச் சட்டத்தில் זָר என்பதன் பொருள்
  choice: பரிசுத்த பணியை அணுக அனுமதி அல்லது நியமனம் பெறாத நபர்
  alternative: இனத்தால் அந்நியன் அல்லது பொதுவான சமூக அயலான்
  rationale: உடனடிச் சூழல் ஆசாரியப் பொறுப்பையும் திருவாசஸ்தல அணுகலையும் பற்றியது; ஆகவே இங்கு வேறுபாடு இனத்தை அல்ல, பரிசுத்த பணிக்கான அதிகாரத்தை அடிப்படையாகக் கொண்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருவாசஸ்தலம்’, ‘சந்திப்புக் கூடாரம்’, ‘பரிசுத்த இடம்’ ஆகிய சொற்கள் மூலத்தின் தனித்தனி பெயர்களை வேறுபடுத்துகின்றன. திசையை வலியுறுத்தும் எபிரெய இரட்டிப்பு கோடுகளுக்குள் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
