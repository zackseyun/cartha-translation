revisions:
- from: திருவாசஸ்தலத்தின் முன்புறத்தில், கிழக்கே[a]—சூரியன் உதிக்கும் திசையில் சந்திப்புக் கூடாரத்தின் முன்புறத்தில்—முகாமிட்டவர்கள் மோசேயும் ஆரோனும் அவனுடைய மகன்களும் ஆவர். அவர்கள் இஸ்ரயேல் மக்களின் சார்பாகப் பரிசுத்த இடத்தின் காவற்பொறுப்பை நிறைவேற்றினார்கள். ஆனால் அனுமதியற்றவன்[b] அருகில் வந்தால், அவன் கொல்லப்பட வேண்டும்.
  to: திருவாசஸ்தலத்தின் முன்னால், கிழக்கே[a]—சூரியன் உதிக்கும் திசையில் சந்திப்புக் கூடாரத்தின் முன்னால்—முகாமிட்டிருந்தவர்கள் மோசேயும் ஆரோனும் அவனுடைய மகன்களும் ஆவர்; அவர்கள் இஸ்ரயேல் மக்களுக்காகப் பரிசுத்த இடத்தின் காவற்பொறுப்பைக் காத்தவர்கள். ஆனால் அணுகுகிற அனுமதியற்ற நபர்[b] கொல்லப்பட வேண்டும்.
  rationale: 'The revision preserves all established lexical distinctions and footnote content while aligning the Tamil more closely with the Hebrew participial description: those encamped there are characterized as keeping the sanctuary charge for Israel. It also renders the final participial legal expression directly and retains the passive/causative force of יוּמָת.'
