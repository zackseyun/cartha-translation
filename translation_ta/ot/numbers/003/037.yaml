  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: ta
  text: முற்றத்தைச் சுற்றியுள்ள தூண்களும், அவற்றின் அடிப்பீடங்களும்[a], அவற்றின் முளைகளும், அவற்றின் கயிறுகளும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடித்தளங்கள்’ அல்லது ‘பொருத்துக் குழிகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், குறிப்பாகத் திருக்கூடார விவரிப்புகளில், தூண்கள் பொருத்தப்படும் கட்டமைப்பு அடிப்பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வடங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: தூண்கள்
  rationale: முற்றத்தின் திரைச்சுவரைத் தாங்கிய செங்குத்தான அமைப்புகளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கட்டடச் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: הֶחָצֵר
  choice: முற்றம்
  rationale: திருக்கூடாரத்தைச் சூழ்ந்த திறந்த பகுதியைக் குறிக்கிறது; ‘பிராகாரம்’ என்பதைவிட பொதுவான வாசகர்களுக்கு எளிதில் புரியும் சொல்.
- source_word: סָבִיב
  choice: சுற்றியிருந்த
  rationale: தூண்கள் முற்றத்தின் சுற்றுப்புறம் முழுவதும் அமைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் அடித்தளங்கள்
  rationale: தூண்களைத் தாங்கும் அடிப்பகுதிகள் அல்லது பொருத்துக் குழிகள் என்ற கட்டமைப்புச் சொல்லை அணுகத்தக்க தமிழில் தருகிறது; தொழில்நுட்பமான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: יְתֵדֹתָם
  choice: அவற்றின் முளைகள்
  rationale: கயிறுகளால் அமைப்பை நிலைநிறுத்தத் தரையில் அடிக்கப்படும் முளைகளைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘கூடார’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: מֵיתְרֵיהֶם
  choice: அவற்றின் கயிறுகள்
  rationale: அமைப்பை முளைகளோடு பிணைத்து உறுதிப்படுத்தும் கயிறுகளைக் குறிக்கும் தெளிவான, பொதுவழக்குச் சொல்.
- source_word: וְ
  choice: -உம்
  rationale: எபிரெய உரையின் தொடர்ச்சியான பட்டியல் அமைப்பைத் தமிழின் இணைப்புப் பின்னொட்டால் இயல்பாகப் பாதுகாக்கிறது.
