translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் தொடரின் சுருக்கத்தையும் கண்ணியமான நடையையும் காத்துள்ளது. ‘பிராகாரம்’ போன்ற மரபுசார் சொல்லுக்குப் பதில் எளிதில் புரியும் ‘முற்றம்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
