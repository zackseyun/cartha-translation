source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: ta
  text: மோசே, லேவியர்களால் மீட்கப்பட்டவர்களின் எண்ணிக்கையைவிட அதிகமாக இருந்தவர்களிடமிருந்து மீட்புப் பணத்தை[a][b] பெற்றுக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீட்பு விலை.” எபிரெயச் சொற்றொடர், ஒருவரை மீட்பதற்காகச் செலுத்தப்படும் தொகையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மீட்புக் கணக்கில் லேவியர்கள் பிரதிநிதித்துவப்படுத்திய எண்ணிக்கையைவிட அதிகமாக இருந்த இஸ்ரவேலின் முதற்பேறானவர்களிடமிருந்து.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பெற்றுக்கொண்டார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தார்’ என்றாலும், மக்களிடமிருந்து பணம் வசூலித்த சூழலில் ‘பெற்றுக்கொண்டார்’ என்பது இயல்பான தமிழாகவும் மூலத்தின் செயற்பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: மீட்புப் பணம்
  rationale: பதிலீட்டு எண்ணிக்கையில் மீட்பிற்காகச் செலுத்தப்பட்ட தொகையைச் சுட்டுகிறது; ‘மீட்புப் பணம்’ என்பது சட்டச்சடங்கு சார்ந்த பொருளை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: מֵאֵת
  choice: …இடமிருந்து
  rationale: பணம் வந்த மூலத்தைச் சுட்டும் முன்னிடைச்சொல்லின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הָעֹדְפִים
  choice: அதிகமாக இருந்தவர்கள்
  rationale: עודף என்பதன் எண்ணிக்கை மீதியைக் குறிக்கும் பங்கேற்புவினைப் பொருளைக் காக்கிறது; இவ்வாக்கியத்தில் மூலத்தில் வெளிப்படையாக இல்லாத ‘முதற்பேறானவர்கள்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: עַל
  choice: எண்ணிக்கையைவிட
  rationale: இங்கு ஒப்பீட்டு மிகுதியைச் சுட்டுவதால், தமிழில் எண்ணிக்கை சார்ந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: லேவியர்களால் மீட்கப்பட்டவர்கள்
  rationale: எபிரெய கட்டமைப்பின் உறவு சற்றே விரிவானதாக இருந்தாலும், முந்தைய சூழலில் லேவியர்களின் பதிலீட்டினால் கணக்கில் மீட்கப்பட்டவர்களை இது குறிக்கிறது; இத்தமிழாக்கம் வாசிக்க இயல்பானது.
theological_decisions:
- issue: லேவியர்களுக்கும் மீட்கப்பட்டவர்களுக்கும் இடையிலான உறவு
  choice: லேவியர்களால் மீட்கப்பட்டவர்கள்
  alternative: லேவியர்களுக்குரிய மீட்கப்பட்டவர்கள்
  rationale: முந்தைய வசனங்களின் பதிலீட்டு எண்ணிக்கைச் சூழலைத் தெளிவுபடுத்துகிறது; லேவியர்கள் தாமே மீட்புத் தொகை செலுத்தினர் என்ற பொருளை இங்கு நோக்கமாகக் கொள்ளவில்லை. அந்த எண்ணிக்கை சார்ந்த விளக்கம் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘மீட்பு’ என்ற வேதாகமச் சட்டச்சடங்கு சார்ந்த சொல் காக்கப்பட்டுள்ளது; எண்ணிக்கை மிகுதியைத் தெளிவுபடுத்த ‘எண்ணிக்கையைவிட’ சேர்க்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
