translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்பு/வம்சப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிவடிவத்தை அணுகும் வகையில் ‘மெராரி’, ‘மக்லி’, ‘மூசி’ சார்ந்த குழுப்பெயர்களாக எழுதப்பட்டுள்ளன.
