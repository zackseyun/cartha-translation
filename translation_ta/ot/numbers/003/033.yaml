id: NUM.3.33
reference: Numbers 3:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: ta
  text: 'மெராரியைச் சேர்ந்தவர்கள்: மக்லியரின் குலமும் மூசியரின் குலமும். இவையே மெராரியின் குலங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: மெராரியைச் சேர்ந்தவர்கள்
  rationale: לְ முன்னொட்டு இங்கு கணக்கெடுப்புப் பட்டியலில் மெராரியோடு தொடர்புடைய சந்ததிக் குழுவை அறிமுகப்படுத்துகிறது. தமிழில் தலைப்புத் தன்மையையும் உறவையும் இயல்பாகக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: வம்சவழி மற்றும் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה ஒரு கோத்திரத்திற்குள் உள்ள வம்சக் குழுவைக் குறிக்கிறது; ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ இங்கு பொருத்தமானது.
- source_word: הַמַּחְלִי
  choice: மக்லியர்
  rationale: மக்லியுடன் தொடர்புடைய சந்ததிக் குழுவைக் குறிக்கும் இனக்குழுப் பெயராக இருப்பதால், தமிழில் பன்மை/குழும மரியாதை வடிவான ‘மக்லியர்’ பயன்படுத்தப்பட்டது.
- source_word: וּמִשְׁפַּחַת
  choice: மூசியரின் குலமும்
  rationale: וּ இணைப்புச்சொல் இரண்டாவது குலத்தை முதலாவதுடன் இணைக்கிறது; தமிழ் பட்டியல் அமைப்பில் ‘-உம்’ இரு குலங்களையும் தெளிவாக ஒருங்கிணைக்கிறது.
- source_word: הַמּוּשִׁי
  choice: மூசியர்
  rationale: மூசியுடன் தொடர்புடைய சந்ததிக் குழுவைக் குறிக்கும் பெயர்; ‘மக்லியர்’ என்பதுடன் ஒத்த வடிவில் வழங்கப்பட்டது.
- source_word: אֵלֶּה הֵם
  choice: இவையே
  rationale: சுட்டுப்பெயரும் வலியுறுத்தும் பதிற்பெயரும் சேர்ந்த எபிரெய அமைப்பின் அடையாளப்படுத்தும் வலிமையை ‘இவையே’ சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: மெராரியின் குலங்கள்
  rationale: முன்னர் பட்டியலிட்ட இரு உட்பிரிவுகளையும் சுருக்கிக் குறிப்பிடும் பன்மை; ‘குலம்’ என்ற சொல்லின் தொடர்ச்சியும் வம்ச உறவும் காக்கப்படுகின்றன.
