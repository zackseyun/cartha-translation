source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: ta
  text: அவர்கள் சந்திப்புக் கூடாரத்தின் எல்லாப் பொருள்களையும், இஸ்ரவேல் மக்களுக்குரிய பொறுப்பையும்[a] காத்துக்கொள்ள வேண்டும்; திருக்கூடாரச் சேவையைச் செய்வதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களுடைய கடமை” அல்லது “காவல் பொறுப்பு.”
    reason: מִשְׁמֶרֶת என்பது ஒப்படைக்கப்பட்ட பொறுப்பு, கடமை, அல்லது காவல் பொறுப்பு எனப் பொருள்படலாம்; எபிரெய இணைப்புச் சொற்றொடரின் துல்லியமான தொடர்பு நுணுக்கத்தை மாற்றுகள் காக்கின்றன.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: பொறுப்புடன் கவனித்துக்கொள்ள வேண்டும்
  rationale: שׁמר என்பது இங்கு வெறுமனே காப்பதைக் காட்டிலும், ஒப்படைக்கப்பட்ட பராமரிப்பு மற்றும் காவல் பொறுப்பை ஏற்றுச் செய்வதைக் குறிக்கிறது.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திலுள்ள எல்லாப் பொருள்கள்
  rationale: כְּלִים என்பது பாத்திரங்கள் மட்டுமல்லாமல், கூடாரப் பணிக்கான பலவகைப் பொருள்களையும் உபகரணங்களையும் உள்ளடக்குகிறது; ‘பொருள்கள்’ அந்தப் பரந்த பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: கூடார உருவகத்தையும், சந்திப்புக்காக நியமிக்கப்பட்ட இடம் என்ற கருத்தையும் தெளிவாகத் தருகிறது.
- source_word: מִשְׁמֶרֶת
  choice: கடமை
  rationale: ஒப்படைக்கப்பட்ட காவல், பொறுப்பு அல்லது கடமையைக் குறிக்கும் சொல்லாகும். தமிழில் ‘கடமை’ வாக்கியத்தை இயல்பாக வைத்தபடியே அதன் பொறுப்புணர்வைத் தருகிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், எபிரெயத்தில் இது தேசத்தாரைக் குறிக்கும் வழக்கமான கூட்டுப்பெயர். நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்பதே அந்தக் கூட்டுப் பொருளைத் தவறான ஆண்பால் வரையறையின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: திருக்கூடாரப் பணியைச் செய்ய
  rationale: עבד/עֲבֹדָה இங்கு வழிபாட்டிடம் தொடர்பான ஒதுக்கப்பட்ட சேவை அல்லது உழைப்பைக் குறிக்கிறது. ‘பணியைச் செய்ய’ என்பது தமிழில் இயல்பானதும் நோக்கத்தைக் காட்டும் לַ வடிவத்தையும் காப்பதும் ஆகும்.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்தைக் குறிக்கும் மִשְׁכָּן என்பதற்கான மரபான, தெளிவான தமிழ் பெயர்; אֹהֶל מוֹעֵד என்பதிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவமுள்ள கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கண வடிவில் ‘மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் தேசத்தாரை மொத்தமாகக் குறிக்கும் நிலையான பெயர். ‘இஸ்ரவேலின் மகன்கள்’ என்பது நவீனத் தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்; ஆகவே கூட்டுப் பொருள் முன்னிறுத்தப்பட்டுள்ளது.
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל என்பதன் தொடர்பு
  choice: இஸ்ரவேல் மக்களின் கடமை
  alternative: இஸ்ரவேல் மக்களுக்குரிய காவல் பொறுப்பு
  rationale: இக்கட்டமைப்பு அவர்களுக்கு ஒதுக்கப்பட்ட கடமை, காவல் பொறுப்பு, அல்லது அவர்கள் சார்பில் நிறைவேற்றப்படும் பொறுப்பு என்ற நுணுக்கங்களை அனுமதிக்கிறது. முதன்மை உரை பொதுவான ‘கடமை’ என்பதை வைத்தும், அடிக்குறிப்பு மாற்று நுணுக்கத்தை வெளிப்படுத்தியும் ambiguity-ஐ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு இடத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘திருக்கூடாரம்’ ஆகியவை வேறுபட்ட இரு எபிரெயப் பெயர்களைத் தனித்தனியாகக் காட்டுகின்றன. அடிக்குறிப்பு குறியீடு சார்ந்த சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
