revisions:
- from: அவர்கள் சந்திப்புக் கூடாரத்திலுள்ள எல்லாப் பொருள்களையும் பொறுப்புடன் கவனித்துக்கொள்ள வேண்டும்; இஸ்ரவேல் மக்களின் கடமையையும்[a] ஏற்று, திருக்கூடாரப் பணியைச் செய்ய வேண்டும்.
  to: அவர்கள் சந்திப்புக் கூடாரத்தின் எல்லாப் பொருள்களையும், இஸ்ரவேல் மக்களுக்குரிய பொறுப்பையும்[a] காத்துக்கொள்ள வேண்டும்; திருக்கூடாரச் சேவையைச் செய்வதற்காக.
  rationale: The revision removes the unsupported addition “ஏற்று,” keeps the coordinated objects under one custodial verb corresponding to וְשָׁמְרוּ, and makes the purpose relation of לַעֲבֹד explicit. It retains the draft’s helpful distinction between the Tent of Meeting and the Tabernacle and supplies a footnote anchored to the genuinely ambiguous expression.
