  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/011.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'அப்பொழுது[a] யாவே மோசேயிடம் பேசிச் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் தொடக்க இணைப்புச் சொல் “மேலும்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துவதால், நவீன தமிழில் இயல்பான “பின்பு” பயன்படுத்தப்பட்டுள்ளது. דבר என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்க “பேசினார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர்; ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக “யாவே” பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל குறிக்கும் பேச்சின் திசையையும் மோசே அதன் பெறுநர் என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: அவர் சொன்னதாவது
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு ஏற்ற தமிழாக்கம் பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. דבר மற்றும் לאמר ஆகிய இரு பேச்சுச் சொற்களின் வேறுபாடு செயற்கையாகத் தோன்றாதவாறு இரண்டு இணைந்த வாக்கியக் கூறுகளால் தக்கவைக்கப்பட்டுள்ளது.
