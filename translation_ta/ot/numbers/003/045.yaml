  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களிடையே உள்ள ஒவ்வொரு முதற்பிறந்தவனுக்குப் பதிலாக[a][b] லேவியர்களை எடுத்துக்கொள்; இஸ்ரவேல் மக்களின் கால்நடைகளுக்குப் பதிலாக லேவியர்களின் கால்நடைகளையும் எடுத்துக்கொள். லேவியர்கள் எனக்குச் சொந்தமாயிருப்பார்கள். நானே யாவே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்களிடையே உள்ள ஒவ்வொரு முதற்பிறந்தவன்.”
    reason: lexical_alternative
  - marker: b
    text: “பதிலாக” என்பதற்கான எபிரெயச் சொல் இங்கு மாற்றீட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் יהוה (YHWH); மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: எடுத்துக்கொள்
  rationale: לקח என்பதன் கட்டளை வடிவம். இங்கு லேவியர்களை மாற்றாக ஏற்று நியமிக்கும்படி மோசேக்குக் கொடுக்கப்படும் நேரடியான கட்டளையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: கோத்திரப் பெயருக்கான தமிழில் நிலைபெற்ற, எளிதில் புரியும் வடிவம்.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: இச்சூழலில் இடத்தைக் குறிக்காமல் மாற்றீட்டை அல்லது பிரதிநிதித்துவப் பரிமாற்றத்தைக் குறிக்கிறது.
- source_word: כָּל בְּכוֹר
  choice: ஒவ்வொரு முதற்பேறானவன்
  rationale: כָּל உடன் வரும் ஒருமைச் சொல் தரும் பகிர்வுப் பொருளையும், இச்சூழலில் குறிக்கப்படும் ஆண் முதற்பேறானவர்களையும் வெளிப்படுத்துகிறது.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடையே
  rationale: எபிரெய மொழிமரபின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: லேவியர்களின் கால்நடைகள்
  rationale: בְּהֵמָה இங்கு வீட்டில் வளர்க்கப்படும் விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; ‘கால்நடைகள்’ இயல்பான தமிழ்ச் சொல்.
- source_word: בְּהֶמְתָּם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தெளிவாகக் காட்டுகிறது; அதன் சுட்டுதலிலுள்ள மூலமொழியின் இயல்பான தொடர்பை மாற்றாமல் வைக்கிறது.
- source_word: וְהָיוּ לִי
  choice: எனக்குச் சொந்தமாயிருப்பார்கள்
  rationale: தெய்வீக உரிமையையும் உடைமையையும் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யாவே
  rationale: தெய்வீகத் தன்னை அடையாளப்படுத்தும் முடிவுரையின் வலியுறுத்தலை ‘நானே’ பாதுகாக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பெயராகவே ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: லேவியர்களின் மாற்றீட்டுப் பங்கு
  choice: ‘பதிலாக’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘கீழ்’ என்ற இடப்பொருள்
  rationale: இரு இணையான கூறுகளிலும் תַּחַת மாற்றீட்டைக் குறிக்கிறது. உரை கூறுவதைத் தாண்டி மாற்றீட்டின் இறையியல் இயல்பை விளக்காமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணை அமைப்பைப் பாதுகாக்க ‘எடுத்துக்கொள்’ இரண்டாவது கூறிலும் வெளிப்படையாக மீண்டும் இடப்பட்டுள்ளது; இது தமிழில் தெளிவை அளிக்கிறது. இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, மரபான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
