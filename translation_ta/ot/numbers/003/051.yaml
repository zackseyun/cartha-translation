base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, மோசே மீட்புக் கட்டணத்தை[a] ஆரோனிடமும் அவன் மகன்களிடமும் யாவேயின் கட்டளைப்படி கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மீட்கப்பட்டவர்களின் வெள்ளி”; அதாவது, அவர்களை மீட்பதற்காக வசூலிக்கப்பட்ட கட்டணம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் தொடர்கதை இறந்தகால வடிவம்; தமிழில் இயல்பான இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: மீட்கப்பட்டவர்களுக்கான வெள்ளிப் பணம்
  rationale: கட்டமைப்பு சொற்றொடர் சொற்படியாக ‘மீட்கப்பட்டவர்களின் வெள்ளி’ எனப் பொருள்படும். சூழலில் அது அவர்களுடைய மீட்புக்காக வசூலிக்கப்பட்ட வெள்ளிப் பணத்தைக் குறிக்கிறது; ‘வெள்ளிப் பணம்’ என்பது כֶּסֶף என்பதன் பொருளையும் கட்டணச் சூழலையும் காக்கிறது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனிடமும் அவன் மகன்களிடமும்
  rationale: திரும்ப வரும் לְ முன்னிடைச்சொல்லை ‘-இடமும் ... -இடமும்’ என்ற இயல்பான தமிழ் இணைப்பால் வெளிப்படுத்துகிறது; ‘அவன் மகன்கள்’ என்பது ஆரோனின் மகன்களைக் குறிக்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யெகோவாவின் கட்டளைப்படி
  rationale: சொற்படியாக ‘யெகோவாவின் வாயின்படி’ என்ற எபிரெய மொழிமரபு, இங்கு அவரது கட்டளைக்கிணங்கச் செய்ததைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமமான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר செயல் முந்தைய கட்டளைக்கு முற்றிலும் ஒத்திருந்ததைச் சுட்டுகிறது; தமிழ் வாக்கிய ஓட்டத்திற்காக இந்த உட்பிரிவு முன்னால் வைக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் திருநாமம் நேரடியாக வருகிறது. பட்டப்பெயரைப் பயன்படுத்தாமல் தனிப்பெயரைப் பேணுகிறோம்; நவீன தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் ஒலிவடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் இரு கட்டளைச் சொற்றொடர்களும் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன; சட்ட/வழிபாட்டு சூழலைத் தெளிவாக்கும் வகையில் ‘வெள்ளிப் பணம்’ பயன்படுத்தப்பட்டுள்ளது.
