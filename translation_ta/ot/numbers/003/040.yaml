  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “இஸ்ரவேல் மக்களில் ஒரு மாத வயதுமுதல் அதற்கும் மேற்பட்ட வயதுள்ள முதற்பிறந்த ஆண்கள் அனைவரையும் கணக்கிட்டு, அவர்களைப் பெயர்வாரியாக எண்ணிக்கை எடு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய பெயர்களின் எண்ணிக்கையை எடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ, அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் நடையில் ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְּקֹד
  choice: கணக்கிட்டு
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில், ஒருவரையும் விடாமல் எண்ணிக் கணக்கிடும் கட்டளையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָּל בְּכֹר זָכָר
  choice: முதற்பேறான ஆண் ஒவ்வொருவரையும்
  rationale: בכור என்பதன் ‘முதற்பேறு’ பொருளையும் זכר குறிப்பிடும் ஆண்பாலையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களில்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்று கூறுவது தமிழில் இங்கு இயல்பற்றது; கணக்கெடுக்கப்படும் சமூகத்தைக் குறிக்க ‘இஸ்ரவேல் மக்களில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ஒரு மாத வயது முதல் அதற்கு மேற்பட்ட வயதுள்ள
  rationale: கணக்கெடுப்புக்கான குறைந்தபட்ச வயது ஒரு மாதம் என்பதையும் அதற்கு மேற்பட்ட அனைவரும் சேர்க்கப்படுவதையும் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: அவர்களுடைய பெயர்களின் எண்ணிக்கையைப் பதிவு செய்
  rationale: ‘அவர்களுடைய பெயர்களின் எண்ணிக்கையை எடுத்துக்கொள்’ என்ற எபிரெய மரபுத்தொடரின் முறையான சாயலைப் பேணிக்கொண்டே, தமிழில் புரியும்படி ‘பதிவு செய்’ என வழங்குகிறது; பெயர்வாரியான கணக்கெடுப்பு என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
