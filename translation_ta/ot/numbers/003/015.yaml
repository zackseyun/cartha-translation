translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மரபுவழி அமைப்பைக் காட்ட ‘தந்தைவழிக் குடும்பங்கள்’ மற்றும் ‘குலங்கள்’ தனித்தனியாக வைக்கப்பட்டுள்ளன; மூலத்தில் இருமுறை வரும் கணக்கெடுக்கும் கட்டளையும் காக்கப்பட்டுள்ளது.
