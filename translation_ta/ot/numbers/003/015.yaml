source:
  edition: WLC
  text: פְּקֹד֙ אֶת בְּנֵ֣י לֵוִ֔י לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָ֛ר מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה תִּפְקְדֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: ta
  text: லேவியின் மகன்களை[a] அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படியும் குலங்களின்படியும் கணக்கெடு; ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட ஆண் பாலினத்தவர் ஒவ்வொருவரையும் கணக்கெடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியர்.” எபிரெயத்தில் சொல்லுக்குச் சொல் “லேவியின் மகன்கள்”; இது வம்சாவளியையும் குல அமைப்பையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: கணக்கெடு / கணக்கெடு
  rationale: இந்த நிர்வாகச் சூழலில் פקד என்பது ஆட்களை எண்ணிப் பதிவுசெய்வதைக் குறிக்கிறது. ‘கணக்கெடு’ என்பது இராணுவ அணிவகுப்பு என்ற தேவையற்ற பொருளைச் சேர்க்காமல், கட்டளை வலிமையையும் இருமுறை வரும் எபிரெய வினையையும் காக்கிறது.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மகன்கள்
  rationale: சொல்லுக்குச் சொல் ‘லேவியின் மகன்கள்.’ அடுத்துவரும் தந்தைவழிக் குடும்பங்கள், குலங்கள் ஆகிய மரபுவழி அமைப்புடன் இது இயல்பாகப் பொருந்துகிறது; ‘லேவியர்’ எனப் பொதுமைப்படுத்தவில்லை.
- source_word: לְבֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: எபிரெயச் சொற்றொடர் தந்தை மரபை அடிப்படையாகக் கொண்ட குடும்ப அலகைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பம்’ நவீனத் தமிழில் தெளிவாக இருந்து, அந்த வம்ச அமைப்பையும் பாதுகாக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה என்பதைக் ‘குலம்’ என மொழிபெயர்ப்பது, முந்தைய ‘தந்தைவழிக் குடும்பம்’ என்பதிலிருந்து வேறுபாட்டைக் காத்து உறவுமுறைப் பிரிவைக் காட்டுகிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: זָכָר வயதுவந்த ஆண்களை மட்டும் அல்ல, ஆண்பாலினரைக் குறிக்கிறது; ஒரு மாதக் குழந்தைகளும் இதில் அடங்குவதால் ‘ஆண்கள் அனைவரும்’ என்பது சூழலில் தெளிவாக உள்ளது.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: கணக்கெடுப்புக்கான குறைந்தபட்ச வயதை இந்த மரபுத்தொடர் குறிப்பிடுகிறது. தேர்ந்த தமிழ் வடிவம் அந்த வரம்பைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
