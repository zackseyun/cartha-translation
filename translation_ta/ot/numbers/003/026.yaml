base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: ta
  text: முற்றத்தின் திரைத் துணிகளும்[a], திருக்கூடாரத்தையும் பலிபீடத்தையும் சுற்றியுள்ள முற்றத்தின் நுழைவாயில் திரையும், அதன் கயிறுகளும்[b], அதற்குரிய எல்லாப் பணிகளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முற்றத்தின் திரைகள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் வடங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: திரைத் துணிகள்
  rationale: முற்றத்தின் சுற்றுவேலியாக அமைந்த துணித் திரைகளைக் குறிக்கிறது; சாதாரண வீட்டுத் திரைகள் என்ற எண்ணத்தைத் தவிர்த்து, அமைப்பின் தன்மையைத் தெளிவுபடுத்துகிறது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருவுறைவிடத்தைச் சுற்றியுள்ள அடைக்கப்பட்ட வெளிப்பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מָסַךְ
  choice: திரை
  rationale: நுழைவாயிலில் அமைந்த துணியாலான மறைப்பைக் குறிக்கிறது; கடினமான கதவு எனப் பொருள்படாமல் காக்கிறது.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: உள்ளே செல்லும் திறப்பை இயல்பாகக் குறிக்கிறது.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: திருவுறைவிடத்தையும் பலிபீடத்தையும் சுற்றியுள்ள
  rationale: סָבִיב தரும் சுற்றியிருக்கும் இடவுறவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ஒரே முற்றம் இரண்டையும் சூழ்ந்திருப்பதைக் காட்டுகிறது.
- source_word: מִשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: தேவன் தங்கும் புனிதக் கூடாரம் என்ற சொல்லின் அடிப்படைப் பொருளையும் வழிபாட்டுச் சூழலையும் தமிழில் எடுத்துரைக்கிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் பீடத்திற்கான நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: מֵיתָרָיו
  choice: அதன் கயிறுகள்
  rationale: அமைப்பை நிலைநிறுத்தப் பயன்படும் கயிறுகள் அல்லது வடங்களைக் குறிக்கும் தெளிவான பொதுத் தமிழ்.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: அதற்குரிய எல்லாப் பணிகள்
  rationale: இப்பொருட்களுடன் தொடர்புடைய முழுப் பராமரிப்பு மற்றும் ஒதுக்கப்பட்ட சேவைப் பணிகளையும் உள்ளடக்குகிறது.
