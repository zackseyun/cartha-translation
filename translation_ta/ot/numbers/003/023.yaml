  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: ta
  text: கெர்சோனியரின் குலங்கள் திருக்கூடாரத்தின் பின்புறத்தில், மேற்கு நோக்கி[a] முகாமிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘கடலை நோக்கி’; வேதாகம எபிரெயத்தில் இது மேற்குத் திசையைக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: எண்ணாகமத்தின் கோத்திர மற்றும் கணக்கெடுப்புச் சூழலில், பெரிய குழுவுக்குள் உள்ள வம்சவழி உட்பிரிவுகளை இது குறிக்கிறது; ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ அந்தக் கூட்டான உறவுமுறைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியரின்
  rationale: எபிரெய ஒருமை இனப்பெயர் இங்கு கெர்சோனின் வழிவந்தவர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; அடுத்து வரும் ‘குலங்கள்’ என்பதோடு இயல்பாக இணைவதற்காக உடைமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי
  choice: பின்புறத்தில்
  rationale: இங்கு இது காலத்தைக் குறிக்காமல் முகாமின் இடஅமைப்பைக் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: எண்ணாகமத்தில் இச்சொல் இறைவன் வாசம்செய்யும் பரிசுத்தக் கூடாரத்தைச் சுட்டுகிறது; ‘திருவாசஸ்தலம்’ அதன் வாசஸ்தலப் பொருளையும் புனிதச் சூழலையும் தமிழில் தருகிறது.
- source_word: יַחֲנוּ
  choice: முகாமிட வேண்டும்
  rationale: இங்கு எபிரெய நிறைவுறா வினை, இஸ்ரவேலின் முகாம் அமைப்புக்கான விதிக்கப்பட்ட ஏற்பாட்டைக் குறிக்கிறது; தமிழில் ‘வேண்டும்’ அந்தக் கட்டளை/நியமன வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָמָּה
  choice: மேற்குத் திசையில்
  rationale: ‘கடலை நோக்கி’ என்ற சொல்லடி வடிவம் வேதாகம எபிரெயத்தில் மேற்குத் திசையைக் குறிக்கும் வழக்குச் சொற்றொடர்; பொருளைத் தெளிவாகச் சொல்லும் அதேவேளையில் அடிச்சொல் உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
