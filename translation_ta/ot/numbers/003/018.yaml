  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: ta
  text: 'கெர்சோனின் மகன்களின் குலங்களின்படியான பெயர்கள் இவை: லிப்னி மற்றும் சிமெயி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: பெயர்கள்
  rationale: எபிரேய இணைப்புச்சொல் வாவ் பட்டியலைத் தொடர்கிறது. தமிழில் வசனத்தை இயல்பாக அமைக்க அதன் தொடர்ச்சிப் பொருள் வாக்கிய அமைப்பில் வெளிப்படுகிறது; தனியே ‘மேலும் இவையே’ என்று மொழிபெயர்ப்பது தேவையற்ற கடினத்தன்மையை ஏற்படுத்தும்.
- source_word: שְׁמוֹת
  choice: பெயர்கள்
  rationale: கட்டுநிலை வடிவம் அடுத்து வரும் ‘கெர்சோனின் மகன்கள்’ என்பதுடன் இணைந்து ‘மகன்களுடைய பெயர்கள்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; இங்கு உடனடியாக இரண்டு ஆண் மக்களின் பெயர்கள் வருவதால் விரிவான ‘சந்ததியினர்’ என்பதைக் காட்டிலும் இதுவே துல்லியம்.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: எண்ணிக்கை மற்றும் வம்சவரிசைச் சூழலில் מִשְׁפָּחָה என்பது குடும்பத்தைவிட விரிந்த ‘குலம்’ என்ற சமூகப் பிரிவைக் குறிக்கிறது; לְ அமைப்பு வகைப்படுத்துதலைக் காட்டுவதால் ‘குலங்களின்படி’ என வழங்கப்படுகிறது.
- source_word: לִבְנִי
  choice: லிப்னி
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: וְ/שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பெயர்ப்பு. இறுதிப் பெயர்களைத் தமிழில் இயல்பான பட்டியல் முறையில் காற்புள்ளியால் இணைத்துள்ளோம்.
