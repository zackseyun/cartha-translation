  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: ta
  text: 'கெர்சோனுக்குரிய குலங்கள்: லிப்னியரின் குலமும் சிமெயியரின் குலமும்; இவையே கெர்சோனியரின் குலங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: கெர்சோனுக்குரியவை
  rationale: முன்னொட்டு לְ இங்கு கணக்கெடுப்புப் பட்டியலில் உறவு அல்லது உடைமையைக் குறிக்கிறது. அடுத்து இரண்டு குலங்கள் வருவதால், பன்மை வடிவிலான ‘கெர்சோனுக்குரியவை’ இயல்பான தமிழில் அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: குலம் / குலங்கள்
  rationale: מִשְׁפָּחָה என்பது இச்சூழலில் கோத்திரத்தைவிடச் சிறிய, ஆனால் தனிக்குடும்பத்தைவிடப் பரந்த உறவினக் குழுவைக் குறிக்கிறது; ஆகவே ‘குலம்’ பொருத்தமானது.
- source_word: הַלִּבְנִי
  choice: லிப்னியர்
  rationale: இது லிப்னியிடமிருந்து வந்த வம்சக் குழுவைக் குறிக்கும் இனப்பெயர் வடிவம். தமிழில் மரியாதைப் பன்மையோடு ‘லிப்னியர்’ என்று வழங்குவது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַשִּׁמְעִי
  choice: சிமெயியர்
  rationale: சிமெயியிடமிருந்து வந்த வம்சக் குழுவைக் குறிக்கும் இனப்பெயர்; ‘சிமெயியர்’ அதன் வம்சத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: אֵלֶּה הֵם
  choice: இவையே
  rationale: எபிரெய அடையாளப்படுத்தும் சொற்றொடரின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியர்
  rationale: கெர்சோனிடமிருந்து வந்த பெரிய லேவிய வம்சக் கிளையைச் சுட்டும் இனப்பெயர்; தமிழில் ‘கெர்சோனியர்’ தெளிவானதும் சுருக்கமானதும் ஆகும்.
