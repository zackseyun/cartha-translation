translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்பு மற்றும் வம்சப் பட்டியல் பாணியின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. ‘குடும்பம்’ மிகக் குறுகிய அலகாகவும் ‘கோத்திரம்’ மிகப் பெரிய அலகாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது.
