  terminology: “லேவியர்கள்,” “ஆரோன்,” மற்றும் “இஸ்ரவேலின் மக்கள்” ஆகியவை நிலைபெற்ற, சூழலுக்கேற்ற தமிழ்ச் சொற்கள். “முழுமையாகக் கொடுக்கப்பட்டவர்கள்” இரட்டிக்கப்பட்ட எபிரெயப் பங்கேற்பின் வலியுறுத்தலை நன்றாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு சொல்லின் மறுபதிப்பையும் பாதுகாக்கிறது.
