source:
  edition: WLC
  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: ta
  text: லேவியர்களை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் கொடு; இஸ்ரவேலின் மக்களிடமிருந்து அவர்கள் அவனுக்கு முழுமையாகக் கொடுக்கப்பட்டவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் வலியுறுத்துவதற்காக “கொடுக்கப்பட்டவர்கள்” என்பது இருமுறை வருகிறது: “கொடுக்கப்பட்டவர்கள், கொடுக்கப்பட்டவர்கள்” அல்லது “நிச்சயமாகக் கொடுக்கப்பட்டவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: கொடு
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் Qal perfect கட்டளை வலிமை பெறுகிறது; நவீனத் தமிழில் நேரடியான கட்டளையாக இயல்பாக வழங்கப்பட்டது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களுக்கான நிலைபெற்ற, இயல்பான தமிழ் வேதாகமப் பெயர்.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவனுடைய மகன்களுக்கும்
  rationale: לְ இங்கு கொடுக்கப்படுபவர்களைக் குறிக்கிறது; மூலத்தின் உறவுமுறைச் சொல்லும் பன்மையும் காக்கப்பட்டன.
- source_word: נְתוּנִם נְתוּנִם
  choice: முழுமையாகக் கொடுக்கப்பட்டவர்கள்
  rationale: ‘கொடுக்கப்பட்டவர்கள்’ என்ற சொல்லின் எபிரெய இரட்டிப்பு வலியுறுத்தலைக் குறிக்கிறது; சொல் மறுபதிப்பை விட இயல்பான தமிழில் அதன் தீவிரம் ‘முழுமையாக’ என்பதால் வெளிப்படுத்தப்பட்டது.
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: தனி சுட்டுப்பெயர் கருப்பொருளை வலியுறுத்துகிறது; தமிழ் வாக்கியத்தில் வெளிப்படையான ‘அவர்கள்’ அதை இயல்பாகத் தக்கவைக்கிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: உடனடி சூழலில் ஆரோனையே சுட்டுகிறது; அர்ப்பணித்து ஒப்படைக்கும் பொருளுடன் பொருந்துகிறது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடமிருந்து
  rationale: מֵאֵת மூலத்தையும் பிரித்தெடுக்கப்பட்ட குழுவையும் குறிக்கிறது. בְּנֵי என்ற குடும்பவழி வடிவை ‘மக்கள்’ தக்கவைக்கிறது; இங்கு அது இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இச்சூழலில் முழு உடன்படிக்கைச் சமூகத்திலிருந்து லேவியர்கள் ஒதுக்கப்படுவதை அது குறிக்கிறது. ‘இஸ்ரவேலின் மக்கள்’ குடும்பவழிச் சாயலையும் இயல்பான நவீனத் தமிழையும் இணைக்கிறது; பாலினத்தைத் தேவையின்றி ஆண்களுக்கு மட்டும் வரையறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான கட்டளை நடையும் கண்ணியமான வேதாகமப் பதிவும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய வலியுறுத்தல் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டு, அதன் சொல் மறுபதிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
