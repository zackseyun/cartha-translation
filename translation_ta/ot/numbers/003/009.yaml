  source_fidelity: மூல எபிரெயத்தின் கட்டளைத் தொனி, லேவியர்களை ஆரோனுக்கும் அவன் மகன்களுக்கும் அளிக்கும் செயல், נְתוּנִם நְתוּנִם என்ற வலியுறுத்தல், மற்றும் இஸ்ரவேல் மக்களிடமிருந்தான அவர்களின் பிரித்தெடுப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “அவனுக்கு” என்பது உடனடி முன்னோடியான ஆரோனையே இயல்பாகச் சுட்டுகிறது.
