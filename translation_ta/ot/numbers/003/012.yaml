base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: ta
  text: “நானோ, இதோ, இஸ்ரவேலின் மகன்களிடமிருந்து[a] லேவியர்களை, இஸ்ரவேலின் மகன்களில் கருப்பையைத் திறக்கும் ஒவ்வொரு முதற்பேறானவனுக்குப் பதிலாக எடுத்துக்கொண்டேன்; லேவியர்கள் எனக்குரியவர்களாய் இருப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலரிடமிருந்து.” எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது; இது மரபுவழியாக இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: இணைப்பையும் வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: எபிரெயச் சொல்லின் கவன ஈர்ப்பு மற்றும் வலியுறுத்தும் தன்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לָקַחְתִּי
  choice: எடுத்துக்கொண்டேன்
  rationale: நிறைவேற்றப்பட்ட தெய்வீகச் செயலையும் அதன் தொடரும் விளைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: கோத்திரப் பெயருக்கான நிலையான தமிழ் வடிவம்.
- source_word: מִתּוֹךְ
  choice: நடுவிலிருந்து
  rationale: ஒரு பெரிய குழுவுக்குள்ளிருந்து தேர்ந்தெடுத்தலை மூலத்தின் உருவகத்துக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் சொல்லர்த்த ரீதியான ஆண்பால் உடன்படிக்கைச் சொற்றொடரைப் பாதுகாக்கிறது; இயல்பான கூட்டுப்பெயர் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: சட்ட மற்றும் வழிபாட்டுச் சூழலில் உள்ள பிரதியீட்டுப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָּל בְּכוֹר
  choice: ஒவ்வொரு முதற்பேறானவன்
  rationale: பகிர்ந்தளிக்கும் ‘ஒவ்வொரு’ என்ற பொருளையும் ஆண் முதற்பேறைக் குறிக்கும் வடிவையும் பாதுகாக்கிறது.
- source_word: פֶּטֶר רֶחֶם
  choice: கருப்பையைத் திறக்கும்
  rationale: கருப்பையிலிருந்து முதலில் பிறப்பவனைக் குறிக்கும் எபிரெயச் சட்ட வழக்கை அதன் உடல் சார்ந்த உருவகத்துடன் பாதுகாக்கிறது.
- source_word: וְהָיוּ לִי
  choice: எனக்குரியவர்களாய் இருப்பார்கள்
  rationale: தெய்வீக உரிமையையும் அர்ப்பணிக்கப்பட்ட உடைமையையும் பிற்கால இறையியல் கருத்துகளைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் மக்கள்
  rationale: மூல எபிரெயச் சொற்றொடர் இலக்கண ரீதியில் ஆண்பாலும் மரபுவழிச் சூத்திரத் தன்மையும் கொண்டது. அதை முதன்மை உரையில் பாதுகாத்து, கூட்டாக மக்களைக் குறிக்கும் இயல்பான மாற்றை அடிக்குறிப்பில் தருவது உண்மையான மொழியியல் வேறுபாட்டை மறைக்காது.
- issue: וְהָיוּ לִי என்பதில் லேவியர்களுக்கும் கடவுளுக்கும் உள்ள உறவு
  choice: லேவியர்கள் எனக்குரியவர்களாய் இருப்பார்கள்
  alternative: லேவியர்கள் எனக்குச் சொந்தமாயிருப்பார்கள்
  rationale: அர்ப்பணிப்புச் சூழலில் கடவுளின் உரிமைக் கோரலை நேரடியாகக் காட்டுகிறது; அதேவேளை தேவையற்ற பிற்கால இறையியல் பிரிவுகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானோ, இதோ’ என்பது தெய்வீக அறிவிப்பின் வலியுறுத்தலைக் காக்கிறது; ‘கருப்பையைத் திறக்கும்’ என்பது மூலத்தின் சட்ட/வழிபாட்டு வழக்கை மென்மையாக்காமல் பாதுகாக்கிறது.
