  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: ta
  text: ஒரு மாத வயதும் அதற்கு மேலும் உள்ள எல்லா ஆண்களின் எண்ணிக்கை எண்ணாயிரத்து அறுநூறு; அவர்கள் பரிசுத்த இடத்தின் காவல் பொறுப்பை வகித்தவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தமானவற்றின் காவல் பொறுப்பை வகித்தவர்கள்.’
    reason: הַקֹּדֶשׁ என்பது சூழலுக்கு ஏற்ப ‘பரிசுத்த இடம்’ அல்லது ‘பரிசுத்தமானவை’ என்று பொருள்படலாம்; மூலத்தின் பொருள் வரம்பை அடிக்குறிப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: ஆண்கள் அனைவரையும் கணக்கிட்டபோது
  rationale: בְּמִסְפַּר என்பது கணக்கெடுப்பு சார்ந்த எண்ணிக்கையைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; כָּל זָכָר என்பதன் ஆண்பாலுக்குரிய குறிப்பையும் தக்கவைக்கிறது.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: கணக்கெடுப்புக்கான வயது வரம்பைத் தெளிவாகவும் மூலத்தின் ‘முதல்...மேற்பட்ட’ அமைப்புக்கு நெருக்கமாகவும் தருகிறது.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: எண்ணாயிரத்து அறுநூறு பேர்
  rationale: எண்ணைச் சொற்களால் வழங்கி, எண்ணப்படுபவர்கள் மனிதர்கள் என்பதை இயல்பான தமிழுக்காக ‘பேர்’ மூலம் தெளிவாக்குகிறது.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: காவல்காக்கும் பொறுப்பில் இருந்தார்கள்
  rationale: ஒரே வேர் சார்ந்த எபிரெயச் சொற்கள் தொடர்ந்து செய்ய வேண்டிய ஒப்படைக்கப்பட்ட காவல் கடமையைக் குறிக்கின்றன. தமிழ் நடைமுறையில் இயல்பாக அந்தப் பொறுப்பையும் தொடர்ச்சியான பணியையும் வெளிப்படுத்துகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு அருவமான பரிசுத்தத்தைக் காட்டிலும் லேவியர்கள் பொறுப்பேற்றிருந்த புனிதத் தலத்தைக் குறிக்கும் வாய்ப்பு மிகுந்தது. இருப்பினும் ‘பரிசுத்தமானவை’ என்ற பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הַקֹּדֶשׁ என்பது புனித இடத்தையா அல்லது புனிதப் பொருட்களையா குறிக்கிறது
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்தமானவை
  rationale: உடனடியான கூடாரப் பணிச் சூழலில் புனிதத் தலம் முதன்மையான பொருளாகப் பொருந்துகிறது; ஆனால் எபிரெயச் சொல்லின் பரந்த பொருள் வரம்பை அடிக்குறிப்பு மூலம் மறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் வேதாகமக் கணக்கெடுப்பு நடைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் துண்டுவாக்கிய அமைப்பு இயல்பான முழு வாக்கியமாக்கப்பட்டுள்ளது.
