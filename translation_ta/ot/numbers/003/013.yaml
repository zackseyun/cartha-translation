  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: ta
  text: ஏனெனில், ஒவ்வொரு முதற்பேறும் எனக்குரியது[a]. எகிப்து நாட்டில் ஒவ்வொரு முதற்பேறையும் நான் அடித்துக்கொன்ற நாளில், இஸ்ரவேலில் மனிதர் முதல் விலங்கு வரை உள்ள ஒவ்வொரு முதற்பேறையும் எனக்கெனப் பரிசுத்தப்படுத்தினேன். அவை எனக்குரியவை. நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எனக்கு’ என்ற வடிவம் இவ்வசனத்தில் மூன்று முறை வந்து, கடவுளுடைய உரிமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் லேவியரைத் தமக்கென எடுத்துக்கொள்வதாகக் கூறியதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இது இயல்பாகக் காக்கிறது.
- source_word: לִי
  choice: எனக்குரியது / எனக்கென்று / எனக்குரியவையாக
  rationale: மூன்று இடங்களிலும் வரும் தெய்வீக உரிமைக் கோரிக்கையை, தமிழில் சூழலுக்கேற்ற இலக்கண வடிவங்களுடன் மீட்டுரைக்கிறது.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறான ஒவ்வொன்றும்
  rationale: மனிதர், விலங்கு ஆகிய இரு வகையையும் உள்ளடக்கும் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘ஆண்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: בְּיוֹם הַכֹּתִי
  choice: நான் வீழ்த்திய நாளில்
  rationale: காலத் தொடர்பையும், எகிப்தின் முதற்பேறுகள் கொல்லப்பட்ட தீர்ப்பின் உயிரிழப்புச் சார்ந்த வலிமையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து தேசத்தில்’ என்ற மூலத்தின் முழு இடக்குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הִקְדַּשְׁתִּי
  choice: புனிதமாக ஒதுக்கிவைத்தேன்
  rationale: ஹிஃபில் வடிவத்தின் ‘கடவுளுக்காகப் புனிதமாகப் பிரித்துவைத்தல்’ என்ற வழிபாட்டுச் சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இஸ்ரவேல் சமூகத்தின் நடுவே அல்லது அதன் எல்லைக்குள் என்பதைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: மனிதர்கள் முதல் விலங்குகள் வரை
  rationale: மனித இனத்திலிருந்து விலங்கினம் வரையிலான முழுப் பரப்பைக் குறிக்கும் மரபுத்தொடரை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יִהְיוּ
  choice: அவை எனக்குரியவையாக இருக்கும்
  rationale: மனிதர் மற்றும் விலங்கு இரண்டையும் குறிக்கும் எழுவாய்க்கு ஏற்ற நடுநிலைப் பன்மையுடன், தொடரும் தெய்வீக உரிமையை எதிர்கால வாக்கியமாகக் காக்கிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யெகோவா
  rationale: ‘நான்’ என்பதன் வலியுறுத்தலையும், உடன்படிக்கையின் தனிப்பெயரான יהוה என்பதையும் மறைக்காமல் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ அதை ஒரு பட்டமாக மாற்றாமல் காக்கிறது.
- issue: முதற்பேறின்மீது கடவுளுடைய உரிமை
  choice: எனக்குரியது / எனக்கென்று / எனக்குரியவையாக என்ற மீட்சி
  alternative: ஒரே இடத்தில் மட்டும் உரிமையை வெளிப்படுத்துதல்
  rationale: לִי மூன்று முறை வருவது உரிமை, புனித அர்ப்பணம், நீடித்த சொந்தம் ஆகியவற்றின் தொடர்பை வலியுறுத்துகிறது; அந்த இறையியல் அழுத்தத்தைத் தமிழிலும் காக்கிறது.
- issue: אָדָם என்பதன் கூட்டு மனிதப் பொருள்
  choice: மனிதர்கள்
  alternative: மனிதன் / ஆண்கள்
  rationale: இங்கு பாலினத்தைக் குறிப்பதல்ல; மனித முதற்பேறுகள் அனைத்தையும் விலங்கு முதற்பேறுகளோடு வேறுபடுத்தும் மரபுத்தொடர். ஆகவே உள்ளடக்கமான மனிதப் பொருள் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘புனிதமாக ஒதுக்கிவைத்தேன்’ என்பது தொழில்நுட்பச் சொல்லை மட்டும் பயன்படுத்தாமல் consecration கருத்தை விளக்குகிறது; மூலத்தின் மீட்சி இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
