- from: ஆரோனையும் அவன் மகன்களையும் நீ நியமிக்க வேண்டும்; அவர்கள் தங்கள் ஆசாரியப் பணியைப் பாதுகாக்க வேண்டும். ஆனால், அதிகாரம் பெறாத எவனாவது[a] நெருங்கி வந்தால், அவன் கொல்லப்பட வேண்டும்.
