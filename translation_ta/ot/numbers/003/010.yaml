review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands פקד as appointment, שׁמר as guarding/maintaining the priestly office, זָר as a person unauthorized for priestly access rather than an ethnic foreigner, and יוּמָת as a legal passive requiring death. A small revision better represents כְּהֻנָּתָם as their priestly office/responsibility rather than merely their work, and makes the legal force of יוּמָת more explicit.
  naturalness: The draft is generally clear modern Tamil. “அதிகாரம் பெறாத எவனாவது” is somewhat cumbersome and unnecessarily masculine in a generic legal statement. “அதிகாரமற்றவர்” is concise, inclusive, and idiomatic. “அணுகினால்” is also more direct for the sacred-access sense than “நெருங்கி வந்தால்.”
  terminology: “ஆசாரியப் பொறுப்பு” suitably conveys the office and entrusted function denoted by כְּהֻנָּתָם. The footnote retains the literal lexical sense of זָר while correctly clarifying its non-ethnic contextual meaning. “மரணதண்டனைக்கு உட்படுத்தப்பட வேண்டும்” preserves the penal passive force of יוּמָת.
  issues:
  - severity: low
    issue: ‘ஆசாரியப் பணி’ can be read chiefly as priestly activity rather than the priestly office/charge.
    rationale: כְּהֻנָּתָם denotes their priesthood, including its office and responsibility. ‘ஆசாரியப் பொறுப்பு’ more fully preserves that sense.
  - severity: low
    issue: ‘அதிகாரம் பெறாத எவனாவது’ is awkwardly gendered and less concise.
    rationale: The Hebrew uses a generic singular for an unauthorized person. ‘அதிகாரமற்றவர்’ gives this naturally without adding a gender limitation.
  - severity: low
    issue: ‘கொல்லப்பட வேண்டும்’ can sound broadly descriptive rather than specifically legal-penal.
    rationale: The Hophal יוּמָת expresses the prescribed death penalty. ‘மரணதண்டனைக்கு உட்படுத்தப்பட வேண்டும்’ conveys this force in modern formal Tamil.
  revised_text: ஆரோனையும் அவன் மகன்களையும் நீ நியமிக்க வேண்டும்; அவர்கள் தங்கள் ஆசாரியப் பொறுப்பைக் காத்துக்கொள்ள வேண்டும். அதிகாரமற்றவர்[a] அணுகினால், அவர் மரணதண்டனைக்கு உட்படுத்தப்பட வேண்டும்.
