  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: ta
  text: ஆரோனையும் அவன் மகன்களையும் நீ நியமிக்க வேண்டும்; அவர்கள் தங்கள் ஆசாரியப் பொறுப்பைக் காத்துக்கொள்ள வேண்டும். அதிகாரமற்றவர்[a] அணுகினால், அவர் மரணதண்டனைக்கு உட்படுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “வெளியாளர்.” இங்கு இது வேறு இனத்தைச் சேர்ந்த ஒருவரைக் குறிப்பாகக் குறிக்கவில்லை; ஆசாரியப் பொறுப்பு அல்லது அதற்குரிய அணுகலுக்கு அதிகாரம் இல்லாத எவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: நியமிக்க வேண்டும்
  rationale: פקד என்பதற்கு கணக்கிடுதல், பொறுப்பளித்தல், நியமித்தல் போன்ற பொருள்கள் உண்டு. இங்கு ஆரோனும் அவன் மகன்களும் ஆசாரியப் பொறுப்பைக் காக்க வேண்டும் என்பதால், பதவிக்கும் பணிக்கும் நியமித்தல் என்ற பொருள் பொருத்தமானது.
- source_word: וְשָׁמְרוּ
  choice: பாதுகாக்க வேண்டும்
  rationale: שׁמר என்பது காத்தல், பாதுகாத்தல், கடைப்பிடித்தல் எனப் பொருள்படும். இங்கு ஆசாரியப் பணியின் கடமைகளையும் அதன் எல்லைகளையும் காக்கும் கருத்து இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְּהֻנָּתָם
  choice: தங்கள் ஆசாரியப் பணி
  rationale: இந்தப் பெயர்ச்சொல் வெறும் நிலையை மட்டுமல்லாமல் ஆசாரியப் பதவியையும் செயல்பாட்டையும் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘ஆசாரியப் பணி’ பயன்படுத்தப்பட்டது.
- source_word: הַזָּר
  choice: அதிகாரம் பெறாத எவனாவது
  rationale: இங்கு זָר என்பது இன அடிப்படையில் அந்நியனை அல்ல, ஆசாரியச் சேவைக்குள் நுழைய அதிகாரம் அளிக்கப்படாத நபரைக் குறிக்கிறது. சூழல்சார்ந்த பொருளைத் தெளிவாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַקָּרֵב
  choice: நெருங்கி வந்தால்
  rationale: קרב இங்கு தடைசெய்யப்பட்ட பரிசுத்த இடம் அல்லது ஆசாரியச் செயல்பாட்டை அணுகுவதைக் குறிக்கிறது. ‘நெருங்கி வந்தால்’ அதன் இயக்கத்தையும் நிபந்தனைச் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: מות என்பதன் ஹோபால் வடிவம் காரணவினைச் செயலப்பாட்டு மற்றும் சட்டரீதியான தண்டனை வலிமையைக் கொண்டது; ஆகவே வெறுமனே ‘சாவான்’ என்பதற்குப் பதிலாக ‘கொல்லப்பட வேண்டும்’ எனத் தரப்பட்டது.
theological_decisions:
- issue: ஆசாரியப் பணியை அணுகுவதற்கான கட்டுப்பாடு
  choice: ஆரோனும் அவன் மகன்களுமே ஆசாரியப் பணிக்காக நியமிக்கப்பட்டு அதைப் பாதுகாக்க வேண்டும்; அதிகாரம் பெறாதவர் நெருங்கினால் மரணதண்டனை விதிக்கப்படுகிறது.
  alternative: இவ்வசனம் குறிப்பிட்ட சடங்கு எல்லைகளை இங்கே வரையறுக்காமல், ஆசாரியர் அல்லாத எவரும் பரிசுத்தப் பணியை அணுகக் கூடாது என்று பொதுவாகக் கூறுவதாகவும் வாசிக்கலாம்.
  rationale: எபிரெய உரை அங்கீகரிக்கப்பட்ட ஆசாரியப் பொறுப்பையும் அதிகாரமற்ற அணுகுதலின் மரண விளைவையும் வலியுறுத்துகிறது. பிற்காலச் சடங்கு அல்லது பிரிவுசார் விளக்கங்களைச் சேர்க்காமல் அந்த இறுக்கம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆசாரியப் பணி’ என்பது பதவியையும் செயல்பாட்டையும் இயல்பாகக் காட்டுகிறது; ‘அதிகாரம் பெறாத’ என்பது இனரீதியான ‘அந்நியன்’ என்ற தவறான புரிதலைத் தவிர்க்கிறது.
