revisions:
- from: மெராரியின் குலங்களுக்குரிய மூதாதையர் குடும்பத்தின் தலைவன் அபிகாயிலின் மகன் சூரியேல்.[a][b] அவர்கள் திருவாசஸ்தலத்தின் வடக்குப் பக்கத்தில் முகாமிட வேண்டும்.
  to: மேலும், மெராரியின் குலங்களின் தந்தைவழிக் குடும்பத் தலைவர் அபிகாயிலின் மகன் சூரியேல்.[a][b] அவர்கள் திருவாசஸ்தலத்தின் வடக்குப் பக்கத்தில் முகாமிட வேண்டும்.
  rationale: The revision improves Tamil syntactic clarity, explicitly retains the Hebrew connective in an idiomatic way, and uses “தந்தைவழிக் குடும்பம்” to convey the patrilineal force of בֵּית אָב. It retains the prescribed sense of יַחֲנוּ (“முகாமிட வேண்டும்”), the northern location, established names, and the conventional term “திருவாசஸ்தலம்.” Footnote anchors remain correctly placed after the designation of Zuriel.
