translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் குல அமைப்பு பாதுகாக்கப்பட்டாலும், தமிழில் இயல்பான உடைமைத் தொடர் பயன்படுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்புக் குறிகளும் தொடர்புடைய முதன்மை உரையில் இடம்பெற்றுள்ளன.
