  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: ta
  text: மேலும், மெராரியின் குலங்களின் தந்தைவழிக் குடும்பத் தலைவர் அபிகாயிலின் மகன் சூரியேல்.[a][b] அவர்கள் திருவாசஸ்தலத்தின் வடக்குப் பக்கத்தில் முகாமிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்’ என்பதற்குப் பதிலாக ‘முதல்வன்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் נָשִׂיא அங்கீகரிக்கப்பட்ட தலைவர் அல்லது பிரபுவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘தந்தையின் வீடு’; இது தந்தைவழி மரபில் அமைந்த விரிவான குடும்பம் அல்லது குல அலகைக் குறிக்கும் உறவுமுறைச் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: தலைவன்
  rationale: இந்த நிர்வாக மற்றும் குல அமைப்புச் சூழலில் נָשִׂיא என்பது அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அரசகுமாரன் என்ற முடியாட்சி சார்ந்த பொருளைத் தவிர்த்து இயல்பாக மொழிபெயர்க்கப்படுகிறது. தொடக்க ו தமிழில் தனியே மொழிபெயர்க்கப்படாமல் பட்டியலின் தொடர்ச்சி வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: בֵית אָב
  choice: மூதாதையர் குடும்பம்
  rationale: சொல்லுக்குச் சொல் 'தந்தையின் வீடு' என்றாலும், இங்கு தந்தைவழி மரபில் அமைந்த விரிவான குடும்ப அல்லது குல அலகைக் குறிக்கிறது; நவீன தமிழில் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: மெராரியின் குலங்களுக்குரிய
  rationale: מִשְׁפָּחוֹת இங்கு கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது. לְ தொடர்பை 'குரிய' என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: அபிகாயிலின் மகன் சூரியேல்
  rationale: பெயர்கள் தமிழின் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளன; בֶּן மரபுவழிப் பயன்பாட்டின்படி 'மகன்' என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: திருவாசஸ்தலத்தின் வடக்குப் பக்கத்தில்
  rationale: יֶרֶךְ என்பதன் 'பக்கம்/பக்கவாட்டு' என்ற இடப்பொருளையும் צָפֹנָה என்பதன் வடதிசையையும் இயல்பான தமிழில் இணைக்கிறது. מִשְׁכָּן இச்சூழலில் தேவன் வாசம்செய்யும் புனிதக் கூடாரத்தைக் குறிக்கும் மரபான 'திருவாசஸ்தலம்' என வழங்கப்படுகிறது.
- source_word: יַחֲנוּ
  choice: முகாமிட வேண்டும்
  rationale: இம்பர்ஃபெக்ட் வடிவம் இங்கு நியமிக்கப்பட்ட முகாம் அமைப்பைக் குறிக்கிறது; 'வேண்டும்' அதன் வழிகாட்டல் அல்லது கடமைத் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
