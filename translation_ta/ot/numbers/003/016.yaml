source:
  edition: WLC
  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: ta
  text: மோசே யாவேயின் கட்டளைப்படி[a], அவருக்குக் கட்டளையிடப்பட்டபடியே அவர்களை எண்ணினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘யாவேயின் வாயின்படி.’
    reason: எபிரெய மரபுத்தொடரின் சொல்லர்த்த வடிவத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: எண்ணினார்
  rationale: லேவியர்களைக் கணக்கெடுக்கும் இந்தச் சூழலில் פקד என்பது ஆட்களை எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது; ‘எண்ணினார்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட லேவியர்களைக் குறிக்கும் நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: இந்த எபிரெய மரபுத்தொடர் சொல்லர்த்தமாக ‘யாவேயின் வாயின்படி’ என இருந்தாலும், இங்கு அவரது கட்டளைக்கு இணங்கச் செயல்படுவதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר
  choice: படியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளையுடன் செயல் துல்லியமாக ஒத்திருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צֻוָּה
  choice: தமக்குக் கட்டளையிடப்பட்ட
  rationale: இது செயப்பாட்டு வினை; சூழலின்படி அதன் எழுவாய் மோசே. ‘தமக்கு’ என்பது கட்டளை மோசேக்குக் கொடுக்கப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கட்டளைப்படி’ என்பது எபிரெய மரபுத்தொடரின் கருத்தை இயல்பாகத் தெரிவிக்கிறது; அதன் சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
