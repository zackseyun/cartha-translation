  text: פְּקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה פְּקֻ֣דֵי/הֶ֔ם שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: ta
  text: அவர்களில் எண்ணப்பட்டவர்கள்[a]—ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட ஆண்கள் அனைவரும்—மொத்தம் ஏழாயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடையே கணக்கிடப்பட்டவர்கள்.” இவ்வசனத்தில் எபிரேய மூலம் கணக்கெடுப்பைக் குறிக்கும் ஒரே சொல்லை இருமுறை பயன்படுத்துகிறது; தமிழில் இயல்பாக இருக்க அது ஒருமுறை மட்டுமே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதிலிருந்து வந்த இச்சொல் மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது. இயல்பான தமிழில் கணக்கெடுப்பின் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: ஆண்கள் அனைவரும்—மொத்தம்
  rationale: מִסְפָּר எண்ணிக்கை அல்லது மொத்தத்தைக் குறிக்கிறது; כָּל זָכָר ஆண் பாலினத்தவரைத் தெளிவாகக் குறிக்கிறது. தமிழில் இயல்பான கணக்கெடுப்பு வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: கணக்கெடுப்புக்கான வயது வரம்பைக் குறிக்கும் எபிரேய மரபுத்தொடர். 'ஒரு மாத வயதுமுதல்' குறைந்தபட்ச வயதைத் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: ஏழாயிரத்து ஐந்நூறு பேர்
  rationale: எபிரேய எண்ணைத் துல்லியமாகவும் ஓடும் தமிழ் உரைநடைக்கு ஏற்றவாறும் வழங்குகிறது; 'பேர்' மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கணக்கெடுப்பு நடையைப் பயன்படுத்துகிறது. எபிரேயத்தின் மறுபடியான கட்டமைப்பை அடிக்குறிப்பில் பதிவு செய்து, முதன்மை உரையில் இயல்பான தமிழ் வாக்கிய அமைப்பு முன்னிலைப்படுத்தப்பட்டுள்ளது.
