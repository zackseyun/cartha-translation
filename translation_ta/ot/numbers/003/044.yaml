lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: וַיְדַבֵּר என்பது கதையை முன்னெடுக்கும் தொடர்வினை வடிவம்; דבר என்பதன் ‘பேசு’ என்ற பொருளையும், பின்னரும் வரும் אמר என்பதிலிருந்து அதன் வேறுபாட்டையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பைப் பயன்படுத்தி, எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகக் காக்கிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் வழக்கமான தமிழாக்கம்.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: தொடர்ந்து வரும் இறைவாக்கின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயப் பேச்சுச் சூத்திரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகக் காட்டுகிறோம்; அதன் பண்டைய சரியான உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பையும் அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவாக்கை அறிமுகப்படுத்தும் மரியாதைமிக்க வேதாகம நடையைப் பேணுகிறது. ‘பேசிச் சொன்னது’ என்பது דבר மற்றும் אמר ஆகிய இரு வேறுபட்ட மூலச் சொற்களையும் வெளிப்படுத்துகிறது.
