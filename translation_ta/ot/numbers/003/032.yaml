  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: ta
  text: லேவியர்களின் தலைவர்களுக்குத் தலைவராக ஆசாரியனாகிய ஆரோனின் மகன் எலெயாசார் இருந்தார். பரிசுத்த இடத்தின்[a] காவல் பொறுப்பை வகித்தவர்களின் மேற்பார்வைப் பொறுப்பு அவருக்கு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தப் பொருட்கள்.” எபிரெயச் சொல் பரிசுத்த இடத்தையோ அதனுடன் தொடர்புடைய பரிசுத்தப் பொருட்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/נְשִׂיא נְשִׂיאֵי הַ/לֵּוִי
  choice: லேவியர்களின் தலைவர்களுக்குத் தலைவராக
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘தலைவர்களின் தலைவர்’ என்ற படிநிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அரச பதவியைக் குறிக்கும் தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַ/כֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனின் மகன் எலெயாசார்
  rationale: மகன் என்ற உறவையும் ‘ஆசாரியன்’ என்பது ஆரோனைக் குறிப்பதையும் தெளிவாகப் பாதுகாக்கிறது; பெயர்கள் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: פְּקֻדַּת
  choice: மேற்பார்வையிடும் பொறுப்பு அவருக்கு இருந்தது
  rationale: இச்சூழலில் இந்தச் சொல் நியமனம் என்பதைக் காட்டிலும் நிர்வாக மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; தமிழில் இயல்பான வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: காவற்பொறுப்பை ஏற்றிருந்தவர்கள்
  rationale: ஒரே வேர் சார்ந்த வினைச்சொல்-பெயர்ச்சொல் இணைப்பு வலியுறுத்தும் ஒப்படைக்கப்பட்ட காவல் கடமையை இந்தத் தொடர் எடுத்துரைக்கிறது.
- source_word: הַ/קֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: திருக்கூடாரச் சூழலில் பரிசுத்த வளாகம் அல்லது பரிசுத்த இடத்தைக் குறிக்கும் முதன்மைப் பொருளைத் தருகிறது; பரிசுத்தப் பொருட்கள் என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
