translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவத்தைத் தெளிவாக வைத்துக் கொண்டு கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் பெயர்ச்சொல் மையமான வாக்கியம் தமிழில் இயல்பாக அமைய ‘அடங்கின’ சேர்க்கப்பட்டுள்ளது. கட்டுமானச் சொற்களில் பொதுவாசகர்களுக்குப் புரியும் சொற்கள் முதன்மைப்படுத்தப்பட்டு, முக்கியமான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
