  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: ta
  text: 'மெராரியின் மகன்களுக்கு ஒப்படைக்கப்பட்ட பொறுப்பு: திருக்கூடாரத்தின் பலகைகள்[a], அதன் குறுக்குத்தண்டுகள், தூண்கள், அடிப்பீடங்கள்[b], அதன் எல்லா உபகரணங்களும், அதனுடன் தொடர்புடைய எல்லாப் பணிகளும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருக்கூடாரத்தின் சட்டப்பலகைகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் பொருத்துக்குழி உள்ள அடிப்பீடங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதனுடன் தொடர்புடைய எல்லாச் சேவையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: ஒப்படைக்கப்பட்ட காவல் பொறுப்பு
  rationale: இரு பெயர்ச்சொற்களும் சேர்ந்து நியமித்து ஒப்படைக்கப்பட்ட பொறுப்பைக் குறிக்கின்றன. தமிழில் இயல்பாகவும், அதிகாரபூர்வ நியமனம் மற்றும் நடைமுறைப் பராமரிப்பு ஆகிய இரு கூறுகளையும் வெளிப்படுத்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: எபிரெய மூலத்தின் உறவுமுறை வடிவத்தை நேரடியாகப் பேணுகிறது; ‘மெராரியர்’ என்பதைக் காட்டிலும் மூலத்துக்கு வெளிப்படையாக நெருக்கமானது.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: திருவுறைவிடத்தின் சட்டங்கள்
  rationale: קֶרֶשׁ என்பது கட்டமைப்பைத் தாங்கும் நிமிர்ந்த மரப்பகுதிகளைக் குறிக்கிறது. ‘சட்டங்கள்’ அவற்றின் கட்டமைப்புச் செயல்பாட்டைத் தெளிவுபடுத்துகிறது; ‘பலகைகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: இச்சொல்லின் அடிப்படையான ‘உறைவிடம்’ என்ற கருத்தையும், இங்கு குறிக்கப்படும் பரிசுத்தக் கூடார அமைப்பையும் தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: בְרִיחָיו
  choice: அதன் குறுக்குத் தண்டுகள்
  rationale: சட்டங்களை இணைத்துத் தாங்கிய தண்டுகள் இங்கு குறிக்கப்படுவதால், பொதுவான ‘தண்டுகள்’ என்பதைவிட ‘குறுக்குத் தண்டுகள்’ கட்டமைப்புச் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: עַמֻּדָיו
  choice: அதன் தூண்கள்
  rationale: நிமிர்ந்த ஆதரவுப் பகுதிகளுக்கான இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: אֲדָנָיו
  choice: அதன் அடிப்பீடங்கள்
  rationale: தூண்கள் அல்லது சட்டங்கள் பொருத்தப்பட்ட அடித்தளப் பகுதிகளைக் குறிக்கிறது. ‘துளைப்பீடங்கள்’ என்ற தொழில்நுட்பமான மாற்றும் சாத்தியம்.
- source_word: כָל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כֵּלִים என்பது கருவிகள், பொருட்கள், சாதனங்கள் ஆகியவற்றை உள்ளடக்கும் பரந்த சொல். ‘உபகரணங்கள்’ இங்கு சிறு பாத்திரங்களுக்கு மட்டும் பொருளைக் குறுக்காமல் அந்தப் பரப்பைப் பேணுகிறது.
- source_word: כֹל עֲבֹדָתוֹ
  choice: அதற்குரிய எல்லாப் பணிகள்
  rationale: இந்த அமைப்புப் பகுதிகளோடு தொடர்புடைய உழைப்பு அல்லது சேவை அனைத்தையும் சுருக்கமாகக் குறிக்கிறது; עֲבֹדָה என்பதிலுள்ள நடைமுறைப் பணி மற்றும் வழிபாட்டுச் சேவை ஆகிய இரு நிழற்பொருள்களையும் முற்றிலும் ஒற்றைப் பொருளாகக் கட்டுப்படுத்தவில்லை.
