translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ். வம்ச/குலப் பட்டியலின் சுருக்கமான அமைப்பும், எபிரெய மூலத்தின் பெயர்ச்சொல் வாக்கிய வடிவமும் தக்கவைக்கப்பட்டுள்ளன.
