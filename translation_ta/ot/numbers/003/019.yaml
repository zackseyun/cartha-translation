id: NUM.3.19
reference: Numbers 3:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ta
  text: 'கோகாத்தின் மகன்கள், அவர்களுடைய குலங்களின்படி: அம்ராம், இஸ்ஹார், எப்ரோன், ஊசியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’. இங்கு தொடர்ந்து வரும் பெயர்கள் கோகாத்தின் மகன்களையும் அவர்களால் உருவான குலங்களின் மூதாதையர்களையும் குறிக்கின்றன; எனவே எபிரெய வடிவைத் தக்கவைக்கும் ‘மகன்கள்’ இயல்பானது. தொடக்க וְ பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தனி வசனத் தமிழில் வெளிப்படையாக ‘மற்றும்’ சேர்ப்பது இயல்பற்றதால் வாக்கியத் தொடர்ச்சியால் உணர்த்தப்பட்டுள்ளது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இஸ்ரவேலின் சமூக அமைப்பிலுள்ள விரிவான குடும்பக் குழுவை அல்லது குலத்தைச் சுட்டுகிறது. ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ இச்சூழலின் சமூக அலகைத் தெளிவாகக் காட்டுகிறது; לְ முன்னொட்டின் பகிர்வு/வகைப்பாட்டு பொருளை ‘-இன்படி’ வெளிப்படுத்துகிறது.
- source_word: עַמְרָם
  choice: அம்ராம்
  rationale: தனிப்பெயர்; எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְיִצְהָר
  choice: இத்சேகார்
  rationale: தனிப்பெயர்; יִצְהָר என்பதிலுள்ள צ மற்றும் ה ஒலிகளைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு. இணைப்புச் சொல் பட்டியல் நிறுத்தக்குறிகளில் இயல்பாக உட்படுத்தப்பட்டுள்ளது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இங்கு இடப்பெயர் அல்ல, ஒருவரின் பெயர். தொடக்க ח ஒலியைத் தமிழ் வாசிப்புக்கு ஏற்ற ‘எ’ தொடக்கத்துடனும், בְ இன் உரசொலியை ‘ப்/ப்ர’ அண்மையுடனும் ஒலிபெயர்க்கிறது.
- source_word: וְעֻזִּיאֵל
  choice: ஊசியேல்
  rationale: தனிப்பெயர்; עֻזִּיאֵל இன் நீள உயிர் மற்றும் இரட்டித்த மெய்யொலியை இயல்பான தமிழ் பெயர்வடிவில் ஒலிபெயர்க்கிறது. இறுதி וְ-ஐ தமிழ்ப் பட்டியலில் காற்புள்ளியால் இயல்பாக வெளிப்படுத்தலாம்.
