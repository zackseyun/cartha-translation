translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயப் பட்டியலின் தனித்த கூறுகள் பாதுகாக்கப்பட்டுள்ளன; தமிழில் முழுமையான வாக்கியமாக அமைய ‘ஆகியவற்றைக் கவனித்துக்கொள்வதாகும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
