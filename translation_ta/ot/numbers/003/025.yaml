  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: ta
  text: 'சந்திப்புக் கூடாரத்தில் கெர்சோனின் மகன்களுக்குக் கொடுக்கப்பட்ட பொறுப்பு[a]: திருவாசஸ்தலம், கூடாரம், அதன் மூடுறை, சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கான மறைதிரை[b] ஆகியவற்றைக் கவனித்துக்கொள்வதாகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொறுப்பு’ என்பதை ‘கடமை’ அல்லது ‘ஒப்படைக்கப்பட்ட பராமரிப்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மறைதிரை’ என்பதை ‘தொங்குதிரை’ என்றும் மொழிபெயர்க்கலாம்; இது நுழைவாயிலில் தொங்கவிடப்பட்ட திரையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: பொறுப்பு
  rationale: லேவியர்களுக்கு ஒப்படைக்கப்பட்ட பொருட்களைக் கவனித்துப் பராமரிக்கும் கடமையை இச்சூழலில் குறிக்கிறது; நவீன தமிழில் ‘பொறுப்பு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்ப உறவைக் குறிக்கும் வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: בְּ என்பதன் இடம் அல்லது பணித்தளத்தைக் குறிக்கும் பொருளையும், אֹהֶל מוֹעֵד என்பதன் வழக்கமான வெளிப்பாட்டையும் தெளிவாக அளிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: மக்களிடையே தேவன் வாசம்பண்ணும் புனித அமைப்பைக் குறிக்கும் மִשְׁכָּן என்ற தொழில்நுட்பச் சொல்லை, ‘கூடாரம்’ என்பதிலிருந்து வேறுபடுத்தி இயல்பான தமிழில் தருகிறது.
- source_word: וְהָאֹהֶל
  choice: கூடாரம்
  rationale: திருவாசஸ்தலத்துடன் பட்டியலிடப்படும் கூடார அமைப்பைத் தனித்த கூறாகப் பாதுகாக்கிறது.
- source_word: מִכְסֵהוּ
  choice: அதன் மூடுறை
  rationale: கூடாரத்தின் பாதுகாப்பான வெளிப்புற மூடுதலைக் குறிக்கிறது; உடைமைப் பின்னொட்டும் பாதுகாக்கப்படுகிறது.
- source_word: מָסַךְ
  choice: மறைதிரை
  rationale: நுழைவாயிலில் தொங்கவிடப்படும் மறைக்கும் திரையைக் குறிக்கிறது; பொதுவான ‘திரை’யைக் காட்டிலும் அதன் பணியைத் தெளிவாக உணர்த்துகிறது.
- source_word: פֶּתַח
  choice: நுழைவாயிலுக்கான
  rationale: மறைதிரைக்கும் நுழைவாயிலுக்கும் உள்ள பயன்பாட்டு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
