  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தின் முன்பாக அவர்கள் அவருடைய பொறுப்பையும் முழுச் சபையின் பொறுப்பையும் காத்து[a], திருவாசஸ்தலத்தின் சேவையைச் செய்ய வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அவருடைய பொறுப்பைக் கடைப்பிடித்து” அல்லது “அவருடைய கடமையைக் காத்து.” எபிரெய வினை–பெயர்ச்சொல் இணை காவலையும் ஒப்படைக்கப்பட்ட கடமையை உண்மையுடன் கடைப்பிடிப்பதையும் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பரிசுத்த இடம் தொடர்பாக ஆரோனுக்கும் முழுச் சபைக்கும் உரிய பொறுப்புகளை லேவியர்கள் மேற்கொள்கிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ ... מִשְׁמַרְתּוֹ
  choice: அவருக்குரிய பொறுப்பை ... நிறைவேற்றி
  rationale: שׁמר–מִשְׁמֶרֶת என்ற வினை–பெயர்ச்சொல் இணை ஒப்படைக்கப்பட்ட காவல் அல்லது கடமையை உண்மையுடன் மேற்கொள்வதைக் குறிக்கிறது. தமிழில் ‘பொறுப்பை நிறைவேற்று’ என்பது உடல் காவல் என்ற பொருளுக்கு மட்டும் சுருக்காமல் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: சபை முழுவதற்குரிய பொறுப்பு
  rationale: முந்தைய מִשְׁמֶרֶת உடனான இணை அமைப்பைப் பேணுகிறது; இங்கு லேவியர்கள் முழுச் சமூகத்திற்குரிய அல்லது அதன் சார்பான பரிசுத்த இடப் பொறுப்பை மேற்கொள்கிறார்கள்.
- source_word: הָעֵדָה
  choice: சபை
  rationale: எண்ணாகமத்தில் இச்சொல் இஸ்ரவேல் சமூகமெங்கையும் குறிக்கிறது. ‘சபை’ சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் முன்பாக
  rationale: לִפְנֵי என்பதன் இடஞ்சார்ந்த பொருளையும் אֹהֶל מוֹעֵד என்பதன் சந்திப்புக்குரிய கூடாரம் என்ற பொருளையும் நேரடியாகப் பேணுகிறது.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: பணியைச் செய்ய
  rationale: எபிரெய வேர்ச்சொல் மீளுருவை தமிழில் செயற்கையான ‘பணியைப் பணியாற்ற’ என்று தராமல், நோக்கத்தையும் செயற்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பது ‘வசிப்பிடம்/உறைவிடம்’ என்ற கருத்தை உடையது; இச்சூழலில் இறைவனின் பரிசுத்த உறைவிடத்தைக் குறிக்க ‘திருவுறைவிடம்’ தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
theological_decisions:
- issue: מִשְׁמַרְתּוֹ என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள்
  choice: ‘அவருக்குரிய’ என்று மொழிபெயர்த்து, உடனடிச் சூழலில் ஆரோனைச் சுட்டுவதாகக் கொள்ளப்பட்டது.
  alternative: இது பரிசுத்த இடத்திற்குரிய பொறுப்பையோ ஆசாரியப் பொறுப்பைத் தொகுப்பாகவோ சுட்டுகிறது எனக் கொள்ளலாம்.
  rationale: எண்ணாகமம் 3-ன் உடனடிச் சூழலில் லேவியர்கள் ஆரோனுக்கும் அவன் மகன்களுக்கும் ஒப்படைக்கப்படுவதால் ஆரோனே இயல்பான முன்னிலைச் சுட்டுப்பொருள். எனினும் பெயரை வசனத்துக்குள் சேர்க்காமல் மூலத்தின் பிரதிப்பெயர் வடிவம் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைக் கடைப்பிடித்துள்ளது. ‘பொறுப்பு’ என்ற சொல் இருமுறை வருவது மூல எபிரெயத்தின் இணை அமைப்பைப் பேணுகிறது; ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘திருவுறைவிடம்’ ஆகியவை வேறுபட்ட இரண்டு எபிரெயப் பெயர்களையும் தமிழில் வேறுபடுத்துகின்றன.
