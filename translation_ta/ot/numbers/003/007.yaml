- from: அவர்கள் அவருக்குரிய பொறுப்பையும் சபை முழுவதற்குரிய பொறுப்பையும் சந்திப்புக் கூடாரத்தின் முன்பாக நிறைவேற்றி,[a][b] திருவுறைவிடத்தின் பணியைச் செய்ய வேண்டும்.
