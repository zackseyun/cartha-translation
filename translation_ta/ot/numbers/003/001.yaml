base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: ta
  text: யாவே சீனாய் மலையில் மோசேயிடம் பேசியபோது[b][c], ஆரோன், மோசே ஆகியோரின் தலைமுறைகள்[a] இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சந்ததியினர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தலைப்பில் “தலைமுறைகள்” என்ற சொல் உள்ளது; அது ஒரு குடும்ப வரிசையையோ, ஒருவரிடமிருந்து தொடர்வதையோ அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லுக்கு சொல், “பேசிய நாளில்”; இது “பேசிய காலத்தில்” அல்லது வெறுமனே “பேசியபோது” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “மோசேயுடன் பேசிய” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
