theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- issue: ஆரோன், மோசே இருவரையும் குறிப்பிடும் תּוֹלְדֹת தலைப்பின் பரப்பு
  choice: ஆரோன், மோசே ஆகியோரின் தலைமுறைகள்
  alternative: ஆரோன், மோசே ஆகியோரின் சந்ததியினர்; குடும்ப வரிசை
  rationale: தொடரும் வசனங்கள் ஆரோனின் மக்களை மையப்படுத்தினாலும் தலைப்பு இருவரையும் பெயரிடுகிறது. மொழிபெயர்ப்பு அந்த உரைத் திணறலையும் பரந்த பொருள் வாய்ப்பையும் குறுக்காமல் தக்கவைக்கிறது.
- issue: דִּבֶּר ... אֶת מֹשֶׁה என்பதன் உறவுநிலை
  choice: மோசேயுடன் பேசிய
  alternative: மோசேயிடம் பேசிய
  rationale: எபிரெயக் கட்டமைப்பு இரு வழியிலும் இயல்பாகப் புரியக்கூடும்; முதன்மை உரையில் ‘உடன்’ என்பதையும் அடிக்குறிப்பில் ‘இடம்’ என்ற மாற்றையும் அளிப்பதால் உண்மையான நுணுக்க வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘தலைமுறைகள்’ என்ற சற்றே முறையான தலைப்புச் சொல் மூலத்தின் சூத்திர வடிவத்தையும் பொருள் விரிவையும் பாதுகாக்கிறது. தமிழ் வாக்கிய ஓட்டத்திற்காக காலத் துணைவாக்கியம் முதலில் வைக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
