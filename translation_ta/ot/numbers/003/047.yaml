  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: ta
  text: நீ ஒவ்வொரு நபரிடமிருந்தும் ஐந்து சேக்கல் எடுத்துக்கொள்ள வேண்டும்[a], பரிசுத்த இடத்தின் சேக்கல் அளவின்படி[b]; ஒரு சேக்கல் இருபது கேரா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ஒவ்வொரு தலைக்கும் ஐந்து சேக்கல்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பரிசுத்த இடத்தில் பயன்படுத்தப்பட்ட நிர்ணய எடை அளவின்படி; ஒரு சேக்கல் இருபது கேராவுக்குச் சமம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: நீ பெற்றுக்கொள்ள வேண்டும்
  rationale: இணைப்புச் சொல்லுடன் வரும் Qal perfect இங்கு கட்டளையைக் குறிக்கிறது; தமிழில் ‘வேண்டும்’ என்பது சட்டபூர்வ அறிவுறுத்தலின் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: ஐந்து சேக்கல் வீதம்
  rationale: ‘ஐந்து’ என்பதன் மறுபதிப்பு பகிர்ந்தளிக்கும் பொருளைக் கொண்டது; ‘வீதம்’ அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לַגֻּלְגֹּלֶת
  choice: ஒவ்வொருவருக்காகவும்
  rationale: சொல்லர்த்தமாக ‘தலைக்கு’ என்றாலும், இங்கு ஒவ்வொரு நபரையும் குறிக்கும் எபிரெய மரபுத்தொடர்; மனிதர்களைக் கணக்கிடும் சூழலில் ‘ஒவ்வொருவருக்காகவும்’ தெளிவாக உள்ளது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் அளவின்படி
  rationale: இது பயன்படுத்த வேண்டிய எடைத் தரத்தைச் சுட்டுகிறது. ‘பரிசுத்த இடம்’ வழிபாட்டிடத்துடனான தொடர்பைப் பாதுகாக்கிறது; ‘அளவின்படி’ இது தனிப்பட்ட நாணயம் அல்ல, நிர்ணயிக்கப்பட்ட தரம் என்பதைத் தெளிவாக்குகிறது.
- source_word: תִּקָּח
  choice: நீ பெற்றுக்கொள்ள வேண்டும்
  rationale: வாக்கிய அமைப்பில் வசூலிக்க வேண்டிய தொகையையும் அதன் அளவுத் தரத்தையும் ஒரே கட்டளையாகத் தமிழில் இணைப்பது இயல்பானது; அடுத்த பகுதி சேக்கலின் மதிப்பை விளக்குகிறது.
- source_word: עֶשְׂרִים גֵּרָה
  choice: இருபது கேரா
  rationale: பண்டைய எடை அலகான ‘கேரா’ ஒலிபெயர்க்கப்பட்டுள்ளது; எண்ணுக்குப் பின் அலகுச் சொல் தமிழில் ஒருமை வடிவிலேயே இயல்பாக வருகிறது.
- source_word: הַשָּׁקֶל
  choice: ஒரு சேக்கல்
  rationale: முன்னர் குறிப்பிடப்பட்ட தர அலகின் மதிப்பை வரையறுக்கும் தமிழ்ச் சொல்லாக்கமாக ‘ஒரு சேக்கல்’ தெளிவாக உள்ளது.
