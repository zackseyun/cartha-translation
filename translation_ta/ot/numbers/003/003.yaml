  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: ta
  text: ஆரோனின் மகன்களாகிய அபிஷேகம் செய்யப்பட்ட ஆசாரியர்களின் பெயர்கள் இவை; அவர்கள் ஆசாரியப் பணியாற்ற நியமிக்கப்பட்டவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அவர்களுடைய கைகளை அவர் நிரப்பினார்.” இது ஒருவரை ஆசாரியப் பணியில் நியமிப்பதை அல்லது நிறுவுவதைச் சுட்டும் மரபுத்தொடர்; இங்கு “அவர்” யார் என்பது இந்த வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: பெயர்கள் இவை
  rationale: அடையாளம் காட்டும் எபிரெய அறிமுகச் சூத்திரத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: ஆண்பால் சந்ததியினரைக் குறிப்பாகச் சுட்டும் בְּנֵי என்பதையும் உடைமைத் தொடர்பையும் தெளிவாகப் பேணுகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இது ஆரோனின் மகன்களின் பணிநிலையை விளக்கும் பெயர்ச்சொல்; தமிழில் நிலைபெற்ற வேதாகமச் சொல்லான ‘ஆசாரியர்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: הַמְּשֻׁחִים
  choice: அபிஷேகம் செய்யப்பட்ட
  rationale: משׁח வேரின் சடங்குசார் பூசுதல்/அபிஷேகம் செய்தல் என்ற பொருளையும் அதன் செயப்பாட்டு வடிவத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: מִלֵּא יָדָם
  choice: நியமிக்கப்பட்டவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய கைகளை அவர் நிரப்பினார்’ என வரும் இச்சொற்றொடர் ஆசாரியப் பணியில் நிறுவுதல் அல்லது நியமித்தலைக் குறிக்கும் மரபுத்தொடர். இயல்பான தமிழுக்காக பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியப் பணியாற்றுவதற்காக
  rationale: நியமிப்பின் நோக்கத்தைத் தெரிவிக்கும் infinitive வடிவத்தை, தொழிற்பணி மற்றும் சேவை உணர்வுடன் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מִלֵּא יָדָם என்ற ஆசாரிய நியமன மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘நியமிக்கப்பட்டவர்கள்’ என்று பொருளைத் தெளிவுபடுத்தி, நேரடி எபிரெய உருவகத்தை அடிக்குறிப்பில் வழங்குதல்
  alternative: ‘அவர்களுடைய கைகளை அவர் நிரப்பினார்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்
  rationale: இது ஆசாரியப் பணியில் அதிகாரப்பூர்வமாக நிறுவுவதைக் குறிக்கும் தொழில்நுட்ப மரபுத்தொடர். நேரடி வடிவம் இன்றைய தமிழ் வாசகருக்குத் தவறான அல்லது தெளிவற்ற பொருளைத் தரலாம்; அடிக்குறிப்பு மூலமொழியின் உருவகத்தையும், செய்பவர் மூலத்தில் வெளிப்படையாகப் பெயரிடப்படாததையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அபிஷேகம்’, ‘ஆசாரியர்’ ஆகிய நிலைபெற்ற சொற்கள் பாதுகாக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடரின் இயல்பற்ற நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
