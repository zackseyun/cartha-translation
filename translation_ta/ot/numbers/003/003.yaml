revisions:
- from: அபிஷேகம் செய்யப்பட்ட ஆசாரியர்களும், ஆசாரியப் பணியாற்றுவதற்காக நியமிக்கப்பட்டவர்களுமான[a] ஆரோனின் மகன்களுடைய பெயர்கள் இவை.
  to: ஆரோனின் மகன்களாகிய அபிஷேகம் செய்யப்பட்ட ஆசாரியர்களின் பெயர்கள் இவை; அவர்கள் ஆசாரியப் பணியாற்ற நியமிக்கப்பட்டவர்கள்.[a]
  rationale: The revision makes Aaron’s sons, the anointed priests, and those installed for priestly service unambiguously the same people. It retains the interpretive-but-accurate rendering of the Hebrew installation idiom in the text and keeps its literal form and the unexpressed subject in the footnote.
