  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய கணக்கெடுப்பு வாய்ப்பாட்டின் பொருள் காக்கப்பட்டாலும், தமிழில் கடினமாகத் தோன்றும் சொல் வரிசை தவிர்க்கப்பட்டுள்ளது.
