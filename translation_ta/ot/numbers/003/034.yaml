base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: ta
  text: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட ஒவ்வோர் ஆணையும் கணக்கிட்டபோது, அவர்களுள் பதிவானவர்கள்[a] ஆறாயிரத்து இருநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணப்பட்டோர்” / “அவர்களுள் எண்ணப்பட்டவர்கள்.” எபிரெயச் சொல் இந்தக் குலத்துக்குரிய கணக்கெடுப்பில் பதிவானவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களுள் எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதிலிருந்து உருவான இச்சொல், இக்குழுவைச் சேர்ந்த கணக்கெடுப்பில் எண்ணப்பட்டவர்களைக் குறிக்கிறது. தமிழ் நடையில் இயல்பாகவும், எண்ணப்பட்ட நபர்களைக் குறிக்கும் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: கணக்கெடுப்பில் சேர்க்கப்பட்ட ஒவ்வொரு ஆண்பாலரையும் குறிக்கிறது. தமிழில் எண்ணிக்கையின் மொத்தத்தை இயல்பாகக் கூறுவதற்கு ‘ஆண்கள் அனைவரும்’ என மொழிபெயர்க்கப்பட்டது; எண்ணப்படுதல் ஏற்கெனவே முதன்மை வாக்கியத்தில் வெளிப்படுகிறது.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: ஒரு மாத வயதை கீழ் எல்லையாகக் கொண்டு அதற்கு மேலான வயதினரை உள்ளடக்கும் எபிரெய வயது வரம்பைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: ஆறாயிரத்து இருநூறு பேர்
  rationale: 6,200 என்ற மொத்த எண்ணிக்கையை ஓடும் உரைநடையில் சொல்லாகத் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
