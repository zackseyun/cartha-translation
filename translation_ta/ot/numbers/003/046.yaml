  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: ta
  text: லேவியர்களைவிட எண்ணிக்கையில் அதிகமாக இருக்கும் இஸ்ரவேல் மக்களின் முதற்பேறான 273 பேருக்கான மீட்புத் தொகையை,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீட்கப்பட்ட 273 பேரையும்”; எபிரெய வடிவத்தை இவ்வாறு இன்னும் சொற்படியாகப் புரிந்துகொள்ளலாம். ஆனால் உடனடி சூழல், எண்ணிக்கையில் கூடுதலாக இருந்த முதற்பேறானவர்களுக்காகச் செலுத்த வேண்டிய தொகையைப் பற்றிப் பேசுகிறது (வச. 47–48). ஆகவே இங்கு “மீட்புத் தொகை” என்பது பொருளைச் சிறப்பாகத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: மீட்புத் தொகையாக
  rationale: פדה என்ற வேரிலிருந்து வந்த இவ்வடிவம் சொற்படி ‘மீட்கப்பட்டவர்கள்’ என்று புரிந்துகொள்ளப்படலாம். ஆனால் அடுத்த வசனங்கள் இந்தக் கூடுதலான முதற்பேறானவர்கள் ஒவ்வொருவருக்காகவும் செலுத்த வேண்டிய தொகையைப் பற்றிப் பேசுவதால், சூழலுக்கேற்ற பொருளை ‘மீட்புத் தொகை’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: எபிரெயத்தில் கூட்டல் முறையில் அமைந்துள்ள எண்ணை, அதே துல்லியமான அளவை இயல்பாகத் தெரிவிக்கும் அரபுக் கணக்கிலக்கத்தில் கொடுக்கிறது.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: லேவியர்களின் எண்ணிக்கையைவிட அதிகமாக இருக்கும்
  rationale: இந்த வினையெச்சமும் עַל என்பதும் சேர்ந்து, பதிலீடாக இருந்த லேவியர்களின் எண்ணிக்கைக்கு மேலாக எஞ்சியவர்களைக் குறிக்கின்றன. ‘எண்ணிக்கையைவிட அதிகமாக’ என்பது ஒப்பீட்டுப் பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் புத்திரரின் முதற்பேறானவர்களில்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘-வர்களில்’ எடுத்துரைக்கிறது; בני ישראל என்ற உடன்படிக்கைச் சொல்லமைப்பை ‘இஸ்ரவேல் புத்திரர்’ எனப் பாதுகாக்கிறது.
