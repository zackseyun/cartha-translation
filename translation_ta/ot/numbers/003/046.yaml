  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கியத்தின் தொடக்கப் பகுதி என்பதால், இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
