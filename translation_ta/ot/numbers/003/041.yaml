base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்களுள்[a] உள்ள ஒவ்வொரு முதற்பேறானவனுக்கும் பதிலாக லேவியர்களை எனக்கென எடுத்துக்கொள்—நானே யாவே; இஸ்ரவேலின் மகன்களுடைய கால்நடைகளில் உள்ள ஒவ்வொரு முதற்பேறானதற்கும் பதிலாக லேவியர்களின் கால்நடைகளை எடுத்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்களிடையே.” எபிரெய மூலத்தில், “இஸ்ரவேலின் மகன்களுள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: எடுத்துக்கொள்
  rationale: இணைப்புடன் வந்த Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், மோசேக்கு வழங்கப்படும் கட்டளையாகச் செயல்படுகிறது; தமிழில் இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவியின் கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: לִי
  choice: எனக்கென
  rationale: உடைமைக்கும் அர்ப்பணிப்புக்கும் உரிய பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யாவே
  rationale: אֲנִי என்பதன் வலியுறுத்தலை ‘நானே’ காக்கிறது; יהוה தனிப்பட்ட இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: இச்சூழலில் ஒருவரையோ ஒன்றையோ மற்றொன்றின் இடத்தில் ஏற்றுக்கொள்ளும் மாற்றீட்டுப் பொருளைக் குறிக்கிறது.
- source_word: כָּל בְּכֹר
  choice: ஒவ்வொரு முதற்பேறானவனும் / முதற்பேறான ஒவ்வொன்றும்
  rationale: כָּל உடன் வரும் ஒருமைச் சொல் பகிர்வுப் பொருளில் ‘ஒவ்வொரு’ என மொழிபெயர்க்கப்பட்டது; மனிதரைக் குறிக்கும் இடத்தில் ஆண்பால் வடிவமும் கால்நடைகளைக் குறிக்கும் இடத்தில் பொருளுக்கேற்ற வடிவமும் பயன்படுத்தப்பட்டன.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுள்
  rationale: எபிரெயச் சொல்லாட்சியின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவம் காக்கப்பட்டுள்ளது; தேசியக் குழுவைக் குறிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: லேவியர்களின் கால்நடைகள்
  rationale: בְּהֵמָה இங்கு வளர்ப்பு விலங்குகளை மொத்தமாகக் குறிக்கிறது; ‘கால்நடைகள்’ நவீன தமிழில் இயல்பான கூட்டுப்பெயர்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே உள்ளது; எனவே அது தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழியாக்கம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மைச் சொல்லாட்சி பிரதான உரையில் காக்கப்பட்டது; அது மொத்த இஸ்ரவேல் மக்களையும் குறிக்கக்கூடிய இயல்பான தேசியப் பயன்பாடு என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டளைத் தொனியும் அர்ப்பணிப்பு/மாற்றீட்டுச் சூழலும் காக்கப்பட்டுள்ளன. மனித முதற்பேற்றுக்கும் கால்நடை முதற்பேற்றுக்கும் தமிழில் பொருத்தமான இலக்கண வடிவங்கள் வேறுபடுத்தப்பட்டுள்ளன.
