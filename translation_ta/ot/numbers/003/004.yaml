  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: ta
  text: சீனாய் வனாந்தரத்தில் யாவேக்கு முன்பாக அனுமதிக்கப்படாத நெருப்பைச் செலுத்தியபோது, நாதாபும் அபியூவும் யாவேக்கு முன்பாக இறந்தார்கள்.[a] அவர்களுக்கு மகன்கள் இல்லை. எலெயாசாரும் இத்தாமாரும் தங்கள் தகப்பனாகிய ஆரோனின் முன்னிலையில்[b] ஆசாரியர்களாகப் பணியாற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை ‘அந்நிய நெருப்பு’ அல்லது ‘வேற்று நெருப்பு’ என்றும் மொழிபெயர்க்கலாம். பலி செலுத்துவதற்காக அனுமதிக்கப்படாத நெருப்பையே இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்கள் தகப்பனாகிய ஆரோனுக்கு முன்பாக’ என்றும் மொழிபெயர்க்கலாம்; எலெயாசாரும் இத்தாமாரும் ஆரோன் உயிரோடிருந்த காலத்தில் ஆசாரியப் பணி செய்தார்கள் என்ற பொருளும் எபிரெயத் தொடரில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்கள்
  rationale: מות என்பதன் நேரடியான நிகழ்வுரைப் பொருள் ‘இறந்தார்கள்’; நாதாப், அபியூ என்ற கூட்டெழுவாய்க்கேற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: ‘யாவேயின் முன்னிலையில்/அவருக்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும் நியாயத்தீர்ப்புச் சூழலையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּהַקְרִבָם
  choice: அவருக்குச் செலுத்தியபோது
  rationale: בְּ உடன் வரும் infinitive construct இங்கு நிகழ்வு நடந்த காலச்சூழலைக் குறிக்கிறது; பலிசார் சூழலில் ‘செலுத்துதல்’ இயல்பான தமிழ்.
- source_word: אֵשׁ זָרָה
  choice: அனுமதிக்கப்படாத நெருப்பு
  rationale: זָרָה என்பதன் ‘வேறானது/அந்நியமானது’ என்ற அடிப்படை நிழலை வழிபாட்டுச் சூழலில் புரியத்தக்க வகையில், நிர்ணயிக்கப்பட்ட முறைக்கு ஒவ்வாத நெருப்பு என மொழிபெயர்க்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּמִדְבַּר סִינַי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: இடப்பெயரையும் வனாந்தரச் சூழலையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: அவர்களுக்கு மகன்கள் இல்லை
  rationale: בָנִים என்பதை பொதுவான ‘பிள்ளைகள்’ என்று விரிவாக்காமல் ‘மகன்கள்’ எனத் துல்லியமாக வழங்குகிறது; ஆசாரிய வாரிசுரிமைச் சூழலில் இது பொருத்தமானது.
- source_word: וַיְכַהֵן
  choice: ஆசாரியர்களாகப் பணியாற்றினார்கள்
  rationale: כהן என்பது ஆசாரியப் பணியைச் செய்தலைக் குறிக்கிறது; கூட்டெழுவாய்க்கேற்ப பன்மை வடிவம் தரப்பட்டுள்ளது.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: தங்கள் தகப்பனாகிய ஆரோனின் முன்னிலையில்
  rationale: ‘முன்னிலையில்’ என்பது இட/உடனிருப்பு உருவகத்தைப் பாதுகாக்கிறது; ஆரோன் உயிரோடிருந்த காலத்தில் என்ற காலப்பொருளையும் முற்றாக நீக்குவதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து வழங்கப்பட்டுள்ளது.
- issue: אֵשׁ זָרָה என்பதன் வழிபாட்டுச் சார்ந்த பொருள்
  choice: அனுமதிக்கப்படாத நெருப்பு
  alternative: அந்நிய நெருப்பு / வேற்று நெருப்பு
  rationale: உரை அந்த நெருப்பின் துல்லியமான குறையை விளக்கவில்லை. வழிபாட்டு முறைக்கு ஒவ்வாத தன்மையைத் தெளிவாகச் சொன்னாலும், சாத்தியமான நேரடி மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: עַל־פְּנֵי என்பதன் கால அல்லது முன்னிலைப் பொருள்
  choice: ஆரோனின் முன்னிலையில்
  alternative: ஆரோன் உயிரோடிருந்த காலத்தில்
  rationale: மூல மரபுத்தொடரின் இட/உடனிருப்பு உருவகத்தை முதன்மை உரை காக்கிறது; அது ஆரோனுடைய வாழ்நாளில் நடந்தது என்ற சாத்தியமான காலநிழல் அடிக்குறிப்பில் தரப்படுகிறது.
