  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகப்பன்’, ‘ஆசாரியர்’, ‘வனாந்தரம்’ போன்ற வேதாகமச் சூழலில் பரவலாக அறியப்பட்ட சொற்கள் அளவோடு பயன்படுத்தப்பட்டுள்ளன; நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
