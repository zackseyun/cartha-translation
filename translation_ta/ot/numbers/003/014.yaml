  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: ta
  text: 'யாவே[a] சீனாய் வனாந்தரத்தில் மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’; பாரம்பரியமாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் தொடர்கதை வடிவம் தெய்வீக உரையை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தில் உரையின் உள்ளடக்கம் தொடர்வதால், தமிழில் ‘பேசி’ என்பது இயல்பாக இணைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சின் பெறுநரைக் குறிக்கும் אֶל என்பதற்கு நவீன தமிழில் ‘மோசேயிடம்’ இயல்பான இணை.
- source_word: בְּמִדְבַּר סִינַי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பில்லாத வறண்ட மேய்ச்சல் நிலத்தையும் வனாந்தரத்தையும் குறிக்கும்; இடப்பெயருடன் சேர்ந்த தொடரை தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לֵאמֹר
  choice: 'பேசி:'
  rationale: ‘சொல்லும்படியாக/சொல்லி’ என்ற எபிரேய உரை அறிமுகச் சூத்திரத்தைத் தமிழில் இரட்டிப்பின்றி, அடுத்து வரும் நேரடி உரையைச் சுட்டும் முக்காற்புள்ளியால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் நன்கு நிலைபெற்ற ‘யெகோவா’ வடிவம் தனிப்பெயரைப் பாதுகாக்கிறது; [a] அடிக்குறிப்பு எபிரேய மெய்யெழுத்துகளையும் பாரம்பரிய பட்டப்பெயர் மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. அடுத்த வசனத்திலுள்ள உரையோடு இயல்பாகத் தொடர முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
