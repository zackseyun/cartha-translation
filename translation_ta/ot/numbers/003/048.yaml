  text: וְ/נָתַתָּ֣ה הַ/כֶּ֔סֶף לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו פְּדוּיֵ֕י הָ/עֹדְפִ֖ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: ta
  text: அவர்களில் மிகுதியாக இருப்பவர்களின் மீட்புக்கான வெள்ளியை ஆரோனுக்கும் அவனுடைய மகன்களுக்கும் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல் வடிவத்துக்கு நெருக்கமாக, “அவர்களில் மிகுதியாக இருப்பவர்களின் மீட்புக்காக” எனலாம். எபிரெயத்தில் உள்ள சுருக்கமான இணைப்புத் தொடர், மிகுதியாயிருப்பவர்களோடு தொடர்புடைய மீட்பைக் குறிக்கிறது; முதன்மைப் பாடம், வெள்ளி அவர்களுக்கான மீட்புத் தொகை என்பதைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: கொடுக்க வேண்டும்
  rationale: இணைப்புடன் வந்துள்ள இரண்டாம் நபர் ஆண்பால் ஒருமை Qal வினைமுற்று, இந்தக் கட்டளைச் சூழலில் செய்ய வேண்டிய செயலைக் குறிக்கிறது. தமிழில் இயல்பான கட்டளைநடையாக ‘கொடுக்க வேண்டும்’ என வழங்கப்பட்டுள்ளது.
- source_word: הַכֶּסֶף
  choice: வெள்ளியை
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’; பணத்தையும் குறிக்கலாம். இங்கு மீட்புத் தொகையாகச் செலுத்தப்படும் வெள்ளி குறிக்கப்படுவதால், மூலச்சொல்லுக்கு நெருக்கமான ‘வெள்ளி’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும்
  rationale: இரு பெயர்ச்சொற்களுக்கும் முன் வரும் לְ என்ற முன்னிடைச்சொல்லின் பகிர்வைத் தமிழின் இணைவேற்றுமை உருபுகள் இயல்பாக வெளிப்படுத்துகின்றன. ‘மகன்கள்’ என்பது இங்குள்ள ஆண் ஆசாரிய வழித்தோன்றல்களைத் துல்லியமாகக் குறிக்கிறது.
- source_word: פְּדוּיֵי
  choice: மீட்பதற்கான
  rationale: פדה என்ற வேரிலிருந்து வந்த இக்கட்டமைப்பு வடிவம், மீட்கப்பட்டவர்களையோ அவர்களுடன் தொடர்புடைய மீட்புத் தொகையையோ குறிக்கலாம். வாக்கியத்தின் நேரடிச் செயப்படுபொருள் ‘வெள்ளி’ என்பதால், அது மீட்புக்காக வழங்கப்படும் தொகை என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעֹדְפִים
  choice: எண்ணிக்கைக்கு அதிகமாக இருப்பவர்களை
  rationale: עודף என்ற வினையின் பங்கேற்பு வடிவம், ஒப்பிடப்படும் எண்ணிக்கையைத் தாண்டி மிகுதியாக இருப்பவர்களைக் குறிக்கிறது. சூழலில் லேவியர்களின் எண்ணிக்கையைவிட அதிகமாக இருந்த இஸ்ரவேலின் முதற்பேறானவர்கள் குறிக்கப்படுகின்றனர்; ‘எண்ணிக்கைக்கு’ என்பது அந்தக் கணக்கீட்டு உறவைத் தெளிவாக்குகிறது.
- source_word: בָּהֶם
  choice: அவர்களில்
  rationale: בְּ முன்னிடைச்சொல்லுடன் வந்த பன்மைச் சுட்டுப்பெயர், எண்ணப்பட்ட குழுவினருக்குள் இருந்த மிகுதியானவர்களைக் குறிக்கிறது. ‘அவர்களில்’ என்பது இந்த உறவை இயல்பாகத் தெரிவிக்கிறது.
