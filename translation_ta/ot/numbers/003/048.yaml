  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் சுருக்கம் முதன்மைப் பாடத்தில் இயல்பாக விரிக்கப்பட்டு, சொல் வடிவுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
