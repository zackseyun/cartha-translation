  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: ta
  text: கெர்சோனியரின் தந்தைவழிக் குடும்பத்தின் தலைவன் லாயேலின் மகன் எலியாசாப் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘தந்தையின் வீடு’; இது இஸ்ரவேலரிடையே ஒரு மூதாதையிடமிருந்து தந்தைவழியாக வந்த விரிவான குடும்பத்தை அல்லது குல உட்பிரிவைக் குறிக்கும் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: தலைவன்
  rationale: נָשִׂיא என்பது இங்கு அரச பதவியைக் குறிக்காமல், குல நிர்வாகத்தில் அதிகாரமுள்ள தலைவரைக் குறிக்கிறது. வசனம் எபிரெய வாக்கியத்தில் இணைப்புச்சொல்லுடன் தொடர்ந்தாலும், தனிவசனமாக இயல்பான நவீன தமிழில் தேவையற்ற தொடக்க ‘மேலும்’ விடப்பட்டுள்ளது.
- source_word: בֵּית אָב
  choice: தந்தைவழிக் குடும்பம்
  rationale: சொல்லுக்குச் சொல் ‘தந்தையின் வீடு’; இஸ்ரவேலரின் தந்தைவழி மரபில் அமைந்த விரிவான குடும்ப அல்லது குல உட்பிரிவைக் குறிக்கும் பண்பாட்டுச் சொல். ‘தந்தைவழிக் குடும்பம்’ அதன் சமூகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: கெர்சோனியரின்
  rationale: கெர்சோனின் வழிவந்த மக்களைக் கூட்டாகக் குறிக்கும் வடிவம்; தமிழில் இயல்பான இனக்குழுப் பன்மை மற்றும் உடைமைத் தொடர்புடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶלְיָסָף
  choice: எலியாசாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சத் தொடர்பைக் காட்டும் வழக்கமான, நேரடியான தமிழ் சொல்.
- source_word: לָאֵל
  choice: லாயேல்
  rationale: எபிரெய தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. நிர்வாக மற்றும் வம்சாவளிச் சூழலைத் தெளிவாக வைத்திருக்கிறது.
