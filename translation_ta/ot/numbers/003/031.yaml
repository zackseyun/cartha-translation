source:
  edition: WLC
  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: ta
  text: அவர்களுடைய பொறுப்பில்[a] பேழை, மேசை, விளக்குத்தண்டு, பலிபீடங்கள், அவர்கள் பணிவிடைக்குப் பயன்படுத்தும் பரிசுத்த இடத்தின் பணிப்பொருள்கள்[b], நுழைவுத் திரை[c], அதற்குரிய எல்லாப் பணியும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களிடம் ஒப்படைக்கப்பட்டவை’ அல்லது ‘அவர்கள் காவலில் இருந்தவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்தப் பணிப்பொருள்கள்’ அல்லது ‘பரிசுத்த இடத்தின் பாத்திரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இது நுழைவில் தொங்கவிடப்பட்ட மறைப்புத் திரை; உட்புறத் திரை அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: அவர்களுடைய பொறுப்பில்
  rationale: மִשְׁמֶרֶת என்பது இங்கு கோகாத்தியரிடம் ஒப்படைக்கப்பட்ட காவல், கடமை, பொறுப்பு ஆகிய கருத்துகளைத் தருகிறது. நவீன தமிழில் ‘பொறுப்பு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאָרֹן
  choice: பேழை
  rationale: ஆசரிப்புக்கூடச் சூழலில் אָרוֹן என்பது பரிசுத்தப் பேழையைக் குறிக்கிறது. எபிரெயத்தில் இவ்வசனத்தில் ‘சாட்சிப் பேழை’ அல்லது ‘உடன்படிக்கைப் பேழை’ என்று விரிவாக்கப்படாததால் அவை சேர்க்கப்படவில்லை.
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: மூலத்தில் குறிப்பிட்ட ஆசரிப்புக்கூடப் பொருளான ‘மேசை’ மட்டுமே உள்ளது; அதன் பயன்பாட்டை மொழிபெயர்ப்பில் கூடுதலாக விளக்கவில்லை.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: מְנוֹרָה என்பது விளக்குகளைத் தாங்கும் ஆசரிப்புக்கூடப் பொருள். ‘விளக்கு’ என்பதைக் காட்டிலும் ‘விளக்குத்தண்டு’ அதன் வடிவத்தையும் செயலையும் துல்லியமாகக் காட்டுகிறது.
- source_word: הַמִּזְבְּחֹת
  choice: பலிபீடங்கள்
  rationale: எபிரெயச் சொல் பன்மையில் இருப்பதால் பன்மை தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் பணிப்பொருள்கள்
  rationale: כְּלִים என்பது பணிக்குப் பயன்படும் பாத்திரங்கள், கருவிகள், பொருள்கள் ஆகியவற்றைக் குறிக்கலாம்; הַקֹּדֶשׁ இங்கு பரிசுத்த இடச் சூழலைக் குறிக்கிறது. ‘பணிப்பொருள்கள்’ என்பது பலவகைப் பயன்பாட்டுப் பொருள்களையும் உள்ளடக்குகிறது.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: அவர்கள் பணிவிடைக்குப் பயன்படுத்தும்
  rationale: שׁרת இங்கு வழிபாட்டுச் சேவையைக் குறிக்கிறது. கருவிகளை வைத்தே அவர்கள் அந்தப் பணிவிடையைச் செய்வதால், தமிழில் இயல்பான கருவிப்பொருளை வெளிப்படுத்த ‘பயன்படுத்தும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמָּסָךְ
  choice: நுழைவுத் திரை
  rationale: מָסָךְ என்பது ஆசரிப்புக்கூடத்தின் நுழைவில் தொங்கவிடப்பட்ட மறைப்புத் திரை; உட்புறத் திரையைக் குறிக்கும் פָּרֹכֶת என்பதிலிருந்து இதை வேறுபடுத்த ‘நுழைவுத் திரை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: அதற்குரிய எல்லாப் பணியும்
  rationale: עֲבֹדָה என்பது இங்கு தொடர்புடைய வேலை அல்லது சேவையைக் குறிக்கிறது. ஒருமை ஆண்பால் பின்னொட்டை ‘அதற்குரிய’ எனக் காத்து, அதன் முன்னிலை எதுவென்பதைத் தேவையின்றி நிர்ணயிக்காமல் விடுகிறது.
theological_decisions:
- issue: ஆசரிப்புக்கூட வழிபாட்டுச் சேவைக்கான சொற்கள்
  choice: ‘பணிவிடை’ மற்றும் ‘பணி’
  alternative: ‘சேவை’ மற்றும் ‘வேலை’
  rationale: שׁרת மற்றும் עֲבֹדָה இங்கு பொதுவான வேலைகளை மட்டுமல்ல, ஆசரிப்புக்கூடத்துடன் தொடர்புடைய ஒழுங்கமைந்த பரிசுத்தப் பணியையும் குறிக்கின்றன. ‘பணிவிடை’ அந்த வழிபாட்டுச் சூழலைக் காக்கிறது; ஆனால் பிற்காலச் சபை அலுவலுக்குரிய தனிப்பட்ட கோட்பாட்டு அர்த்தத்தைச் சேர்ப்பதில்லை.
- issue: עֲבֹדָתוֹ என்ற சொல்லிலுள்ள ஒருமை பின்னொட்டின் தொடர்பு
  choice: ‘அதற்குரிய’ என்று தொடர்பைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘அந்தப் பொருள்கள் அனைத்திற்கும் உரிய’ என்று கூட்டாக விளக்குதல்
  rationale: எபிரெயம் ஒருமை பின்னொட்டைப் பயன்படுத்துகிறது; அது உடனடியாக முன்வரும் திரையையோ, விரிவான ஆசரிப்புக்கூடப் பொறுப்பையோ தொடர்புபடுத்திப் புரிந்துகொள்ள இடமளிக்கிறது. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலின் நிர்வாகத் தன்மையையும் ஆசரிப்புக்கூடச் சூழலின் கண்ணியமான வழிபாட்டு நடையையும் இணைக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெயத்தின் பெயர்ச்சொல் வாக்கியம் தமிழில் இயல்பாக அமைய ‘இருந்தன’ சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரிய சொற்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
