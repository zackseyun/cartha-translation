  source_fidelity: 'மூல எபிரெயத்தின் கணக்கெடுப்பு அமைப்பும் எல்லைகளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: லேவியர்கள், குலங்களின்படியான கணக்கெடுப்பு, மோசே மற்றும் ஆரோன், யாவேயின் கட்டளை, ஒரு மாதம் முதலான ஆண்கள், இருபத்திரண்டாயிரம் என்ற மொத்தம் ஆகியவை அனைத்தும் இடம்பெறுகின்றன. עַל־פִּי יְהוָה என்ற மரபுத்தொடருக்கான ‘யாவேயின் கட்டளைப்படி’ பொருத்தமானது. ஆரோன் பெயர்மீதுள்ள மசோரா புள்ளிகளை உரையிலிருந்து ஊகித்து பெயரை நீக்காமல் அடிக்குறிப்பில் மட்டும் குறிப்பிட்டிருப்பதும் உரைப் பன்மை/ஐயத்தைச் சரியாகக் காக்கிறது.'
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட ஆண்கள் அனைவரின் மொத்த எண்ணிக்கை’ என்பது கணக்கெடுப்பு மொழிநடைக்கு ஏற்றது. தொடக்கத்தில் வந்துள்ள ‘யாவேயின் கட்டளைப்படி’ வலியுறுத்தலுக்காக ஏற்றுக்கொள்ளத்தக்க சொல்வரிசையாகும்.
