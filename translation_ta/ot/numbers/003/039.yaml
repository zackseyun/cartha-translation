base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: ta
  text: யாவேயின் கட்டளைப்படி[b], மோசேயும் ஆரோனும்[a] அவர்களுடைய குலங்களின்படி கணக்கெடுத்த லேவியர்களில், ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட ஆண்கள் அனைவரின் மொத்த எண்ணிக்கை இருபத்திரண்டாயிரம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் “ஆரோன்” என்ற பெயரின் எழுத்துகள்மேல் சிறப்புப் புள்ளிகள் உள்ளன. இது பழங்கால எழுத்தர் குறியீடு; அதன் துல்லியமான நோக்கம் உறுதியாகத் தெரியவில்லை.
    reason: textual_note
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “யாவேயின் வாயின்படி”; இது “யாவேயின் கட்டளைப்படி” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: கணக்கெடுத்த / மொத்த எண்ணிக்கை
  rationale: இங்கு இந்தச் சொற்கள் மக்கள்தொகைக் கணக்கெடுப்பையும் அதன் மொத்தத்தையும் குறிக்கின்றன. இராணுவ அணிவகுப்பு என்ற கூடுதல் நுண்பொருளைச் சேர்க்காமல், நவீனத் தமிழில் இயல்பாகத் தருகின்றன.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த மக்களுக்கான தமிழில் வழக்கமான பெயர்.
- source_word: עַל־פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: சொல்லுக்குச் சொல் பொருள் ‘யாவேயின் வாயின்படி’; இச்சூழலில் அது யாவே பிறப்பித்த கட்டளையின்படி செயல்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה என்பது குறுகிய தனிக்குடும்பத்தைவிட விரிந்த உறவுமுறைக் குலப்பிரிவைக் குறிக்கிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: எபிரெய உரையில் ஆண்பாலினர் வெளிப்படையாகக் குறிப்பிடப்பட்டிருப்பதைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: ஒரு மாத வயதுமுதல் அதற்கு மேற்பட்ட
  rationale: கணக்கில் சேர்க்கப்படும் குறைந்தபட்ச வயதை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: இருபத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணின் நேரான தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை உடன்படிக்கையின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பால் வழங்கப்பட்டுள்ளது.
- issue: ‘ஆரோன்’ என்ற பெயர்மேலுள்ள மசோரா சிறப்புப் புள்ளிகள்
  choice: ஆரோன் என்பதை முதன்மை உரையில் வைத்திருந்து அடிக்குறிப்பில் குறியீட்டைக் குறிப்பிடுதல்
  alternative: ஆரோன் என்பதை நீக்குதல் அல்லது அதன் பங்கை விளக்கமாகக் குறைத்தல்
  rationale: மெய்யெழுத்து உரையில் ஆரோனின் பெயர் உள்ளது; அதன் மேலுள்ள சிறப்புப் புள்ளிகளின் நோக்கம் உறுதியாகத் தெரியாததால் பெயரை நீக்காமல், உரை மரபின் ஐயத்தை அடிக்குறிப்பில் வெளிப்படுத்துவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் கணக்கெடுப்பு மையம் இயல்பான தமிழ் சொற்றொடராக அமைக்கப்பட்டாலும், குலப்பிரிவு, வயது வரம்பு, ஆண்பால் வரம்பு, மொத்த எண்ணிக்கை ஆகிய தகவல்கள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
