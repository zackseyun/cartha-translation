  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: ta
  text: 'ஆரோனின் மகன்களின் பெயர்கள் இவை: முதற்பேறான நாதாப், அபிஹூ, எலெயாசார், இத்தாமார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: பட்டியலைச் சுட்டிக்காட்டி அறிமுகப்படுத்துகிறது. தொடக்க இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்காமல் இருப்பது இயல்பான நவீனத் தமிழுக்கு ஏற்றது.
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களுடைய பெயர்கள்
  rationale: எபிரேய இணைநிலைத் தொடரின் பொருளை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: הַבְּכֹר
  choice: முதற்பேறான
  rationale: வயதில் மூத்தவர் என்பதை மட்டும் அல்லாமல், பிறப்பு வரிசையில் முதலில் பிறந்தவர் என்ற பொருளைத் துல்லியமாகக் காட்டுகிறது; எபிரேயச் சொல் வரிசைப்படி நாதாப்புக்கு முன் வைக்கப்பட்டுள்ளது.
- source_word: נָדָב
  choice: நாதாப்
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: וַאֲבִיהוּא
  choice: அபிகூ
  rationale: தனிப்பெயரை எபிரேய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கிறது; தமிழ் பட்டியலில் காற்புள்ளிகள் இணைப்புச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரேயத் தனிப்பெயரைத் தமிழில் ஒலிநெருக்கத்துடன் எழுத்துப்பெயர்க்கிறது.
- source_word: וְאִיתָמָר
  choice: இத்தாமார்
  rationale: எபிரேயத் தனிப்பெயரைத் தமிழில் ஒலிநெருக்கத்துடன் எழுத்துப்பெயர்க்கிறது; இறுதி பட்டியல் உறுப்பைத் தமிழ் நிறுத்தக்குறியீடு இயல்பாகக் காட்டுகிறது.
