  source_fidelity: மூல எபிரேயத்தின் பட்டியல் அமைப்பும், நாதாப் முதற்பேறானவன் என்பதும், மற்ற பெயர்களின் வரிசையும் சரியாகக் கொடுக்கப்பட்டுள்ளன. ஆனால் אֲבִיהוּא என்பதிலுள்ள /h/ ஒலிக்கு மாறாக, வரைவில் «அபிகூ» என /k/ ஒலியுடன் உள்ளது; இது பெயரின் எழுத்துப்பெயர்ப்பைத் தவறாக்குகிறது.
