  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: ta
  text: 'இஸ்ரவேல் மகன்களின் முதற்பேறானவர்களிடமிருந்து அவர் வெள்ளியைப் பெற்றுக்கொண்டார்: பரிசுத்த இடத்தின் சேக்கல் அளவின்படி ஆயிரத்து முந்நூற்று அறுபத்தைந்து சேக்கல்கள்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணம்.” எபிரெயச் சொல் நேரடியாக “வெள்ளி” என்றும், நீட்சியாக “பணம்” என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பரிசுத்த இடத்தில் பயன்படுத்தப்பட்ட சேக்கல் எடைத் தரத்தின்படி.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: இஸ்ரவேலின் மகன்களில் முதற்பேறானவர்களிடமிருந்து
  rationale: பணம் யாரிடமிருந்து பெறப்பட்டது என்பதைச் சுட்டுகிறது. பின்னணியில் உள்ள மீட்புப் பணம் முதற்பேறானவர்களுக்காகச் செலுத்தப்பட்டாலும், எபிரெய வடிவத்தின் மூலத்தைக் குறிக்கும் இயல்பை இந்தத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களில் முதற்பேறானவர்கள்
  rationale: ஒருமை வடிவிலுள்ள בְּכוֹר இங்கு கூட்டுப்பொருளில் வருகிறது. கணக்கெடுப்பு மற்றும் மீட்பு சூழலில் உள்ள ஆண் குறிப்பு காக்கப்படுவதற்காக ‘இஸ்ரவேலர்’ என்று பொதுமைப்படுத்தாமல் ‘இஸ்ரவேலின் மகன்கள்’ என வழங்கப்பட்டது.
- source_word: לָקַח
  choice: பெற்றுக்கொண்டான்
  rationale: அடிப்படைப் பொருள் ‘எடுத்தான்’ என்றாலும், செலுத்தப்பட்ட மீட்புப் பணத்தை மோசே வசூலித்த சூழலில் ‘பெற்றுக்கொண்டான்’ என்பது இயல்பான தமிழாகவும் வினையின் பொருளை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: הַכָּסֶף
  choice: வெள்ளி
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; அது பணத்தையும் குறிக்கலாம். அடுத்ததாக சேக்கல் எடை குறிப்பிடப்படுவதால் உலோகப் பொருளை முதன்மை உரையில் காக்கிறது.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
