- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் அளவுப்படி
  rationale: இது எடை அல்லது மதிப்பின் பரிசுத்த இடத் தரத்தைச் சுட்டுகிறது. தனிப்பட்ட ஒரு ‘புனித நாணயம்’ எனத் தவறாகப் புரியாதபடி ‘அளவுப்படி’ சேர்க்கப்பட்டது.
