translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயப் பெயர்களின் ஒலியமைப்பு முடிந்தவரை பாதுகாக்கப்பட்டு, ‘குலம்’ என்ற சொல் முழு வசனத்திலும் ஒரே பொருளில் தொடர்ச்சியாக வழங்கப்பட்டுள்ளது.
