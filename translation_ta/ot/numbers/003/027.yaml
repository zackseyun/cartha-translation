id: NUM.3.27
reference: Numbers 3:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: ta
  text: 'மேலும், கோகாத்துக்கு: அம்ராமியரின் குலம், யிஸ்ஹாரியரின் குலம், எப்ரோனியரின் குலம், உசியேலியரின் குலம்—இவையே கோகாத்தியரின் குலங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: கோகாத்துக்குரியவர்கள்
  rationale: இணைப்பிடைச்சொல்லும் முன்னொட்டும் அடுத்த வம்சக் குழுவை அறிமுகப்படுத்துகின்றன. தமிழில் ‘கோகாத்துக்குரியவர்கள்’ என்பது பட்டியலில் வருவோர் கோகாத்தைச் சேர்ந்தவர்கள் என்பதை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: மக்கள்தொகைக் கணக்கீடு மற்றும் வம்சப்பட்டியல் சூழலில் இச்சொல் ஒரு பெரிய இனக்குழுவுக்குள் உள்ள உறவுவழிக் குழுவைக் குறிக்கிறது; நவீனத் தமிழில் ‘குலம்’ இதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַֽ/עַמְרָמִי
  choice: அம்ராமியர்
  rationale: இது அம்ராமின் வழிவந்தோரைக் குறிக்கும் இனப்பெயர்; ‘அம்ராமியர்’ தனிப்பெயருடனான தொடர்பைப் பாதுகாக்கிறது.
- source_word: הַ/יִּצְהָרִי
  choice: யிஸ்ஹாரியர்
  rationale: இது யிஸ்ஹாரின் வழிவந்தோரைக் குறிக்கும் வடிவம்; எபிரேயப் பெயரின் ஒலியமைப்புக்கு நெருக்கமாக ‘யிஸ்ஹாரியர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַֽ/חֶבְרֹנִי
  choice: எப்ரோனியர்
  rationale: இது எப்ரோனின் வழிவந்தோரைக் குறிக்கிறது; தமிழில் இயல்பான இனக்குழுப் பெயராக ‘எப்ரோனியர்’ அமைக்கப்பட்டுள்ளது.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: உசியேலியர்
  rationale: இது உசியேலின் வழிவந்தோரைக் குறிக்கிறது; தனிப்பெயரின் வடிவத்தைத் தெளிவாகப் பாதுகாக்கும் தமிழாக்கம் இது.
- source_word: אֵלֶּה הֵם
  choice: இவையே
  rationale: சுட்டுப்பெயரும் பிரதிப்பெயரும் சேர்ந்து வலியுறுத்திய அடையாளப்படுத்தலைத் தருகின்றன; ‘இவையே’ அந்தச் சுருக்கக் கூற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: கோகாத்தியரின் குலங்கள்
  rationale: பன்மைச் சார்புத்தொடர், முன் பட்டியலிடப்பட்ட குழுக்களை கோகாத்தின் வழிவந்தோருக்குரிய குலங்களாகச் சுருக்குகிறது.
