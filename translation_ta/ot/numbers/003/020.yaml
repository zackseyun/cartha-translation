source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள், அவர்களுடைய குலங்களின்படி: மக்லி, மூஷி. இவையே தங்கள் தந்தைவழிக் குடும்பங்களின்படியான லேவியர்களின்[a] குலங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியின் குலங்கள்.” எபிரெயத்தில் இங்கு ஒருமை இனப்பெயர் வடிவம் உள்ளது; அது லேவியர்களைக் கூட்டாகக் குறிக்கலாம் அல்லது கோத்திரத்தின் மூதாதையான லேவியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் நேர்பொருள் ‘மகன்கள்.’ வம்சப் பட்டியல் சூழலில் மரபுவழி உறவைத் தெளிவாகக் காக்கிறது; தொடக்க ו இணைப்பைத் தமிழில் தனியாக மொழிபெயர்க்காமல் இருப்பது பட்டியல் நடைக்கு இயல்பானது.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: தனிப்பெயர்; எபிரெய ஒலிப்பை நெருங்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: לְ + מִשְׁפְּחֹתָם என்பது குடும்ப/குலப் பிரிவுகளின்படி வகைப்படுத்துவதைச் சுட்டுகிறது. ‘குலங்களின்படி’ என்பது அந்த நிர்வாக-உறவுமுறைப் பொருளைக் காக்கிறது.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: தனிப்பெயர்; எபிரெய வடிவிலிருந்து எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּמוּשִׁי
  choice: மூசி
  rationale: தனிப்பெயர்; முன் வரும் ו இணைப்பு, தமிழ்ப் பட்டியலில் காற்புள்ளியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֵלֶּה הֵם
  choice: இவையே
  rationale: சுட்டுப்பெயரும் அடையாளப்படுத்தும் பதிற்பெயரும் சேர்ந்த வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவுகளைச் சுட்டும் எண்ணிக்கை/வம்சப் பட்டியல் சூழலில் ‘குலங்கள்’ பொருத்தமானது.
- source_word: הַלֵּוִי
  choice: லேவியர்கள்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் வடிவம் இருந்தாலும், அது இங்கு கூட்டாக லேவி கோத்திரத்தாரைக் குறிக்கலாம். தமிழில் பன்மை ‘குலங்கள்’ என்பதோடு இயல்பாக அமைய ‘லேவியர்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; ஒருமை/மூதாதை சார்ந்த வாய்ப்பு அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵּית אָבוֹת என்ற உறவுமுறை-நிர்வாகச் சொற்றொடரை, சொல்லுக்குச் சொல் ‘தந்தையரின் வீடுகள்’ என்று இயல்பற்ற முறையில் தராமல், அதன் வம்சவழிக் குடும்பப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַלֵּוִי என்ற ஒருமை இனப்பெயர் கூட்டுப் பொருளிலா, மூதாதையான லேவியைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் கூட்டுப் பொருளாக ‘லேவியர்கள்’
  alternative: ‘லேவியின் குலங்கள்’
  rationale: பன்மையான ‘குலங்கள்’ மற்றும் முழுப் பட்டியல் சூழல் கூட்டுப் பொருளை ஆதரிக்கின்றன. ஆனால் எபிரெய ஒருமை வடிவம் மூதாதையான லேவியை நோக்கிச் செல்லும் வாய்ப்பையும் கொண்டிருப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் வேதாகம வம்சவழிச் சொல்லாட்சியின் கண்ணியத்தையும் காக்கும் வகையில் மொழியாக்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது בית אבות என்பதன் சமூக-வம்சவழிப் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
