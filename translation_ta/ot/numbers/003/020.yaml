revisions:
- from: 'மெராரியின் மகன்கள், அவர்களுடைய குலங்களின்படி: மக்லி, மூசி. இவையே தங்கள் தந்தைவழிக் குடும்பங்களின்படி அமைந்த லேவியர்களின்[a] குலங்கள்.'
  to: 'மெராரியின் மகன்கள், அவர்களுடைய குலங்களின்படி: மக்லி, மூஷி. இவையே தங்கள் தந்தைவழிக் குடும்பங்களின்படியான லேவியர்களின்[a] குலங்கள்.'
  rationale: «மூசி» என்பதற்குப் பதிலாக எபிரெயப் பெயரின் ஷின் மெய்யைச் காக்கும் «மூஷி» பயன்படுத்தப்பட்டது. மேலும், இறுதிப் பகுதி ‘தந்தைவழிக் குடும்பங்களின்படி’ என்ற வகைப்பாட்டை நேரடியாகக் குலங்களுடன் இணைக்கும் வகையில் மறுசீரமைக்கப்பட்டது. ஒருமை இனப்பெயரின் பொருள்-தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
