  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: ta
  text: 'லேவியின் மகன்களின் பெயர்கள் இவை: கெர்சோன், கோகாத், மெராரி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: மகன்கள் ...
  rationale: இந்த எபிரெய அறிமுகச் சூத்திரம் பட்டியலை முன்வைக்கிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் இருக்க, தனியான ‘இவர்கள் இருந்தார்கள்’ என்ற சொற்றொடர் இன்றி பெயர்ப்பட்டியல் வாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי לֵוִי
  choice: லேவியின் மகன்கள்
  rationale: இங்கு குறிப்பிடப்படுபவர்கள் லேவியின் நேரடி ஆண் பிள்ளைகள் என்பதால், ‘வம்சத்தார்’ என்பதற்குப் பதில் ‘மகன்கள்’ துல்லியமானது.
- source_word: בִּשְׁמֹתָם
  choice: அவர்களுடைய பெயர்களின்படி
  rationale: בְּ முன்னிடைச்சொல்லின் ‘படி/அடிப்படையில்’ என்ற நுணுக்கத்தையும், தொடர்ந்து வரும் பெயரிடும் சூத்திரத்தையும் காக்கிறது.
- source_word: גֵּרְשׁוֹן
  choice: கெர்சோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்க்கிறது; நடுவிலுள்ள ח ஒலிக்கு வழக்கமான தமிழ் வேதாகமப் பெயர் வடிவத்தைப் பின்பற்றுகிறது.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
