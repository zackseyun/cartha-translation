translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான வம்சப்பட்டியல் நடையில் அமைக்கப்பட்டது. மூலத்தின் பெயரிடும் சூத்திரம் ‘அவர்களுடைய பெயர்களின்படி’ என்று பாதுகாக்கப்பட்டுள்ளது.
