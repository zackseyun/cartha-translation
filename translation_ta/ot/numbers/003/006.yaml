source:
  edition: WLC
  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: ta
  text: லேவி கோத்திரத்தினரை அருகே அழைத்து வந்து, ஆசாரியனாகிய ஆரோனுக்கு முன்பாக அவர்களை நிறுத்து. அவர்கள் அவருக்குப் பணிபுரிவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவருக்குப் பணிவிடை செய்வார்கள்.” எபிரேய வினைச்சொல் ஒருவருக்குத் துணையாகச் செய்யும் பணியையோ வழிபாட்டுச் சார்ந்த திருப்பணியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: அருகே அழைத்து வந்து
  rationale: קרב என்பதன் ஹிஃபீல் ஏவல் வடிவம் ‘அருகே வரச்செய்’ அல்லது ‘அருகே கொண்டுவா’ என்று பொருள்படும். தமிழில் இயல்பாகவும், முறைப்படி முன்னிலைப்படுத்தும் சூழலை உணர்த்தவும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַטֵּה לֵוִי
  choice: லேவி கோத்திரத்தினரை
  rationale: מַטֶּה என்பதற்கு நேரடியாக ‘கோல்’ என்றும், இத்தகைய சமூகச் சூழலில் ‘கோத்திரம்’ என்றும் பொருள் உண்டு. இங்கு லேவியர் என்னும் மக்கள் குழுவே குறிக்கப்படுவதால், மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: அவர்களை நிறுத்து
  rationale: עמד என்பதன் ஹிஃபீல் வடிவம் ‘நிற்கச்செய்/நிறுத்து’ எனும் காரணவினைப் பொருளைக் கொண்டது. எபிரேயத்தில் ஒருமைத் தொகுப்புப்பெயர் வந்தாலும், தமிழில் ‘கோத்திரத்தினர்’ என்பதற்கு ஏற்ப பன்மைச் சுட்டுப்பெயர் இயல்பாக அமைகிறது.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடம் மற்றும் முன்னிலைப் பொருளை ‘முன்பாக’ நேரடியாகத் தருகிறது; ஆரோனின் ஆசாரியப் பதவியும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: அவர்கள் அவருக்குப் பணிபுரிவார்கள்
  rationale: שרת என்பது ஒருவருக்குத் துணையாகப் பணியாற்றுவதையும் வழிபாட்டுச் சார்ந்த திருப்பணியையும் குறிக்கலாம். நேரடி பொருளாகிய ஆரோனைக் காத்து, நவீன தமிழில் பரந்தும் இயல்பாகவும் புரியும் ‘பணிபுரிவார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ஆரோனுக்கான லேவியரின் பணியின் தன்மை
  choice: லேவியர் ஆரோனுடைய ஆசாரியப் பொறுப்பில் அவருக்குப் பணிபுரிவார்கள்.
  alternative: லேவியர் ஆரோனோடு சேர்ந்து பணிபுரிவார்கள்.
  rationale: וְשֵׁרְתוּ אֹתוֹ என்பதில் אֹתוֹ நேரடிப் பொருளாக ஆரோனைக் குறிக்கிறது. ஆகவே, ‘அவரோடு’ என்று மாற்றாமல், அவருக்குச் செய்யப்படும் பணி என்ற உறவு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் ஒருமைத் தொகுப்புப்பெயரிலிருந்து பன்மை வினைக்கு மாறும் அமைப்பு, தமிழில் ‘கோத்திரத்தினர்/அவர்கள்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
