source:
  edition: WLC
  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: ta
  text: இவ்வாறு இஸ்ரவேல் பேயோரின் பாகாலுடன் தன்னை இணைத்துக்கொண்டது[a]. யாவேக்குக் கோபம் இஸ்ரவேலுக்கு எதிராகப் பற்றியெரிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகால்-பேயோருடன் தன்னை இணைத்துக்கொண்டது” அல்லது “பேயோரின் பாகாலுடன் தன்னை நுகத்தால் பிணைத்துக்கொண்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: தன்னை இணைத்துக்கொண்டது
  rationale: நிஃபால் வடிவம் நெருக்கமாக இணைக்கப்படுதல் அல்லது தன்னை இணைத்துக்கொள்ளுதல் என்ற பொருளைக் கொண்டுள்ளது. இத்தேர்வு அதன் தற்சார்புப் பொருளையும் விக்கிரக வழிபாட்டுச் சார்பையும் மிகைவிளக்கம் இன்றிக் காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தேசியப் பெயர் வடிவம்.
- source_word: לְבַעַל פְּעוֹר
  choice: பேயோரின் பாகாலுடன்
  rationale: பாகால் என்ற தெய்வப் பெயருக்கும் பேயோர் என்ற இடத்திற்கும் உள்ள தொடர்பை இயல்பான தமிழில் காட்டுகிறது. 'உடன்' என்பது צמד வினையுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: எபிரெயச் சொல்லாடலில் உள்ள கோபத்தின் வெம்மை அல்லது எரிதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: கோபம் செலுத்தப்படும் இலக்கை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: צמד குறிப்பிடும் இஸ்ரவேலின் தொடர்பின் தன்மை
  choice: தன்னை இணைத்துக்கொண்டது
  alternative: தன்னை நுகத்துக்குட்படுத்திக்கொண்டது
  rationale: மூலவினை நெருக்கமான இணைப்பைக் குறிக்கிறது; 'நுகம்' என்ற உருவகம் சாத்தியமானதாயினும் அதிக விளக்கப் பொருளைச் சேர்க்கக்கூடும். எனவே மூலத்தின் பரந்த பொருளும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய மொழியின் ‘கோபம் எரிதல்’ உருவகம் தமிழில் ‘பற்றியெரிந்தது’ எனப் பாதுகாக்கப்பட்டுள்ளது; வாக்கியத் தொடர்பை இயல்பாக்க ‘அதனால்’ சேர்க்கப்பட்டுள்ளது.
