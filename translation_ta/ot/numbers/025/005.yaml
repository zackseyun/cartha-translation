base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: ta
  text: மோசே இஸ்ரவேலின் நீதிபதிகளிடம்[a], “நீங்கள் ஒவ்வொருவரும், பேயோரின் பாகாலுடன் தங்களை இணைத்துக்கொண்ட தத்தம் ஆட்களைக்[b] கொல்லுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நீதிபதிகள்’ என்பது நீதி வழங்கும் அதிகாரத்தோடு ஆளுகைப் பொறுப்பும் கொண்ட தலைவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “கொல்லுங்கள்; ஒவ்வொருவனும் தன் ஆட்களை” என்று உள்ளது; அதாவது ஒவ்வொரு நீதிபதியும் தன் அதிகாரத்தின்கீழ் இருந்த, பேயோரின் பாகாலுடன் தங்களை இணைத்துக்கொண்ட ஆட்களைக் கொல்ல வேண்டும். ‘பேயோரின் பாகால்’ என்பதற்கு ‘பாகால்-பேயோர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: நீதிபதிகள்
  rationale: இச்சொல் இஸ்ரவேலில் நீதி வழங்கும் மற்றும் ஆளுகை அதிகாரம் செலுத்தும் நபர்களைக் குறிக்கிறது; ‘நீதிபதிகள்’ என்பது நேரடியான, சூழலுக்கு ஏற்ற மொழிபெயர்ப்பு.
- source_word: הִרְגוּ
  choice: கொன்றுபோடுங்கள்
  rationale: பன்மை ஏவல் வடிவின் கட்டளை வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது. ‘மரணதண்டனை நிறைவேற்றுங்கள்’ என்பது நீதித்துறை நுட்பத்தைச் சேர்க்கக்கூடும்; எபிரெய வினை நேரடியாகக் கொல்வதையே கூறுகிறது.
- source_word: אִישׁ אֲנָשָׁיו
  choice: உங்களில் ஒவ்வொருவரும் ... தத்தம் ஆட்களை
  rationale: ‘ஒவ்வொருவனும் அவனுடைய ஆட்களை’ என்ற பகிர்ந்தளிக்கும் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்தி, ஒவ்வொரு நீதிபதியின் அதிகாரத்தின்கீழிருந்த ஆண்களைக் குறிக்கிறது.
- source_word: הַנִּצְמָדִים
  choice: தங்களை இணைத்துக்கொண்ட
  rationale: צמד என்பதன் நிபால் பங்கேற்புவடிவம் நெருக்கமாகச் சேர்ந்திருத்தல் அல்லது இணைந்திருத்தலைக் குறிக்கிறது; விக்கிரக வழிபாட்டுச் சூழலில் தன்னார்வமான பற்றுதலை மிகைவிளக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: לְבַעַל פְּעוֹר
  choice: பேயோர் பாகாலுடன்
  rationale: இது பேயோருடன் தொடர்புடைய பாகால் தெய்வத்தைக் குறிக்கிறது. தமிழில் ‘பேயோர் பாகால்’ என்பது கூட்டுப் பெயரை நேரடியாக வைத்திருக்கிறது; -לְ குறிக்கும் பற்றுதல் இங்கு இயல்பாக ‘உடன்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: கட்டளையிடப்பட்ட கொலையின் தன்மை
  choice: மோசே, குற்றஞ்செய்த ஆட்களை அவரவர் பொறுப்பிலிருந்த நீதிபதிகள் கொல்லுமாறு நேரடியாகக் கட்டளையிட்டதாக மொழிபெயர்த்தல்
  alternative: ‘மரணதண்டனை நிறைவேற்றுங்கள்’ என்று நீதித்துறைத் தண்டனையை முன்னிறுத்துதல்
  rationale: வசனம் கடுமையான கட்டளையை நேரடியாகக் கூறுகிறது; ஆனால் சட்ட நடைமுறையையோ உடன்படிக்கைத் தீர்ப்பையோ இவ்வசனத்திலேயே விளக்கவில்லை. எனவே அவற்றை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: אִישׁ אֲנָשָׁיו என்பதிலுள்ள ஆண்பால் குறிப்பு
  choice: ‘தத்தம் ஆட்கள்’ என்று ஆண் குற்றவாளிகளைக் குறிப்பது
  alternative: ‘தங்கள் கீழுள்ளவர்கள்’ என்று பாலினப் பொதுமைப்படுத்துதல்
  rationale: எபிரெய உரை வெளிப்படையாக ஆண்பால் வடிவங்களைப் பயன்படுத்துகிறது; சூழலிலும் ஆண் குற்றவாளிகளையே குறிக்கிறது. ஆகவே அதைப் பொதுப்பாலாக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தத்தம்’ என்ற சொல் பகிர்ந்தளிக்கும் எபிரெய அமைப்பைச் சுருக்கமாகவும் துல்லியமாகவும் காட்டுகிறது. தெய்வப் பெயர் ‘பேயோர் பாகால்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; வசனத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை.
