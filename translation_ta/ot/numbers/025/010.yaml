source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'அப்பொழுது யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் YHWH; பாரம்பரியமாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: இறைத்தனிப்பெயரின் எபிரேய வடிவம், பாரம்பரிய மாற்று மொழிபெயர்ப்பு, மற்றும் மாற்று ஒலிபெயர்ப்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசி
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது, ‘பேசி’ என்பது דבר என்பதற்கான இயல்பான தமிழ் இணை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தனிப்பெயராக வழங்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைத் தமிழில் இயல்பாகக் காட்ட ‘-இடம்’ வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரேயத் தனிப்பெயரின் நிலைபெற்ற நவீனத் தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: பேசி,
  rationale: இந்த எபிரேய வாய்பாடு அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் ‘பேசி,’ என வாக்கியத்தைத் திறந்துவைப்பது அதன் செயல்பாட்டை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ என்பதை முதன்மை உரையில் பயன்படுத்தி, மூல எழுத்துகளையும் மாற்று ஒலிபெயர்ப்பையும் அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான உரை. அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சுடன் இலக்கணத் தொடர்ச்சி அமைய இறுதியில் ‘பேசி,’ பயன்படுத்தப்பட்டுள்ளது.
