  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: ta
  text: 'ஆகையால் நீ சொல்: ‘இதோ, நான் அவனுக்கு என் சமாதான உடன்படிக்கையை அளிக்கிறேன்.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்வின் விளைவாக வரும் அறிவிப்பை இயல்பாகக் குறிக்கிறது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: தெய்வீக அறிவிப்பின் வலியுறுத்தலையும் உடனிருப்பையும் காக்கிறது; வெறும் ‘பார்’ என்பதைவிட தமிழில் இயல்பும் கண்ணியமும் உடையது.
- source_word: נֹתֵן לוֹ
  choice: அவனுக்கு ... அளிக்கிறேன்
  rationale: எபிரெய நிகழ்காலப் பங்கேற்பு வடிவத்தின் உறுதியான தற்போதைய அறிவிப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: என் சமாதான உடன்படிக்கை
  rationale: ‘என் உடன்படிக்கை’ மற்றும் அதனைத் தொடர்ந்து வரும் ‘சமாதானம்’ என்பவற்றின் நெருங்கிய தொடர்பைக் காக்கிறது; இது சமாதானத்தை வழங்கும் அல்லது சமாதானத்தால் வகைப்படுத்தப்படும் உடன்படிக்கையாகப் புரிந்துகொள்ளப்படலாம்.
theological_decisions:
- issue: בְּרִיתִי שָׁלוֹם என்ற கட்டமைப்பின் பொருள்
  choice: என் சமாதான உடன்படிக்கை
  alternative: சமாதானத்திற்கான என் உடன்படிக்கை / என் உடன்படிக்கையாகிய சமாதானம்
  rationale: மூலத்தின் சுருக்கமான, ஓரளவு பலவகைப் பொருள் தரக்கூடிய இணைப்பைத் தீர்மானமாக விரிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், தெய்வீக உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது.
