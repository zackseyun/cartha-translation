base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: ta
  text: அவன் அந்த இஸ்ரவேலனுக்குப் பின்னால் அறைக்குள் சென்று, அவர்கள் இருவரையும்—அந்த இஸ்ரவேலனையும் அந்தப் பெண்ணையும்—அவளுடைய வயிற்றின் வழியாகக் குத்தித் துளைத்தான்.[a][b] அப்போது இஸ்ரவேலின் மக்கள்மேல் இருந்த கொள்ளைநோய் நிறுத்தப்பட்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறை’ என்பதற்கு ‘கூடாரத்தின் உட்பிரிவு,’ ‘ஒதுக்கறை,’ அல்லது ‘மண்டபம்’ என்றும் பொருள் கொள்ளலாம்; இதற்கான எபிரெயச் சொல் அரிதானது, ஓர் உட்புறப் பகுதியையோ அறையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவளுடைய வயிற்றுப்பகுதி வழியாக.’ எபிரெயச் சொல் குறிப்பாக வயிற்றையோ வயிற்றுக் குழியையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: அறை
  rationale: அரிதான எபிரெயச் சொல் ஓர் உட்புற அறை அல்லது தனிப்பிரிவைக் குறிக்கிறது. கட்டட அமைப்பைத் தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் ‘அறை’ என வழங்கப்படுகிறது.
- source_word: וַיִּדְקֹר
  choice: குத்தித் துளைத்தான்
  rationale: דקר என்பதிலுள்ள வன்மையான ஊடுருவிக் குத்தும் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரையும்
  rationale: இருவரும் ஒன்றாகக் குத்தப்பட்டனர் என்ற மூலத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: אֶל קֳבָתָהּ
  choice: அவளுடைய வயிற்றின் வழியாக
  rationale: קֳבָה வயிறு அல்லது வயிற்றுப்பகுதியைக் குறிப்பதால், மூலத்திலுள்ள உடற்கூறு விவரத்தை மென்மைப்படுத்தாமல் வழங்குகிறது.
- source_word: וַתֵּעָצַר
  choice: நிறுத்தப்பட்டது
  rationale: கொள்ளைநோய் தடுத்து நிறுத்தப்பட்டதைக் குறிக்கும் நிபால் வினையின் செயப்பாட்டு, விளைவு சார்ந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: הַמַּגֵּפָה
  choice: கொள்ளைநோய்
  rationale: நியாயத்தீர்ப்பின் சூழலில் מַגֵּפָה என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்மேல் இருந்த
  rationale: מֵעַל என்பதன் ‘மேலிருந்து’ என்ற இடவியல் உருவகத்தை இயல்பான தமிழில் பாதுகாத்து, בְּנֵי יִשְׂרָאֵל என்ற சமூகமுழுதையும் குறிக்கும் மரபுத்தொடரை ‘இஸ்ரவேலின் மக்கள்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: அந்த இஸ்ரவேலன்
  rationale: அந்த நபர் ஆண் என்பதையும் அவரது இஸ்ரவேலிய அடையாளத்தையும் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர். ‘மகன்கள்’ என்பது தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்; ‘மக்கள்’ அதன் சூழல்சார் கூட்டுப்பொருளைப் பாதுகாக்கிறது. அடிச்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: நியாயத்தீர்ப்புக் காட்சியின் வெளிப்படையான உடற்கூறு விவரம்
  choice: அவளுடைய வயிற்றின் வழியாக
  alternative: அவளுடைய வயிற்றுப்பகுதி வழியாக
  rationale: மூல எபிரெயம் தரும் குறிப்பான உடல் விவரத்தை மென்மைப்படுத்தாமலும் கூடுதல் கொடூரத்தைச் சேர்க்காமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வன்முறை விவரம் மென்மைப்படுத்தப்படவில்லை; அதேவேளை மூலத்தைவிடக் கொடூரமாகவும் விரிவாக்கப்படவில்லை. ‘இஸ்ரவேலன்’ தனிநபர் ஆண் அடையாளத்தைக் காட்டுகிறது; கூட்டுப்பெயரில் இயல்பான ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டு, சொல்லர்த்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
