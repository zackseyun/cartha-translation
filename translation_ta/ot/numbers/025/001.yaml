  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: ta
  text: இஸ்ரவேல் சித்தீமில் தங்கியிருந்தபோது, மக்கள் மோவாபின் மகள்களோடு விபசாரம் செய்யத் தொடங்கினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபியப் பெண்களோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடத் தொடங்கினர்.” எபிரெயத்தில், “மோவாபின் மகள்களோடு விபசாரம் செய்யத் தொடங்கினர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தபோது
  rationale: ישׁב என்பதற்கு உட்காருதல், குடியிருத்தல், தங்குதல் என்ற பொருள்கள் உண்டு. இங்கு நிரந்தரக் குடியேற்றத்தைச் சுட்டாமல், இஸ்ரவேல் அங்கே முகாமிட்டுத் தங்கியிருந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּשִּׁטִּים
  choice: சித்தீமில்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்து, இடவேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: וַיָּחֶל
  choice: தொடங்கினர்
  rationale: இச்சூழலில் வினைச்சொல் ஒரு செயலைத் தொடங்குவதைக் குறிக்கிறது. 'தொடங்கினர்' என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேலைக் கூட்டாகக் குறிப்பிடும் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: לִזְנוֹת
  choice: விபசாரம் செய்ய
  rationale: זנה முறைகேடான பாலுறவையும் விபசார உருவகத்தின் கடுமையையும் வெளிப்படுத்துகிறது. பொதுவான 'பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட' என்பதைக் காட்டிலும் இந்தத் தேர்வு மூலத்தின் கூர்மையைப் பேணுகிறது.
- source_word: אֶל
  choice: -ஓடு
  rationale: זנה என்ற வினையோடும் மனிதப் பொருளோடும் வரும் אֶל இங்கு யாருடன் அத்தகைய உறவில் ஈடுபட்டனர் என்பதைக் குறிக்கிறது; தமிழில் உடனிகழ்ச்சி வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנוֹת מוֹאָב
  choice: மோவாபின் மகள்கள்
  rationale: எபிரெய மொழியின் 'மோவாபின் மகள்கள்' என்ற வெளிப்பாட்டை நெருக்கமாகப் பேணுகிறது; சூழலில் இது மோவாபியப் பெண்களைக் குறிக்கிறது.
theological_decisions:
- issue: மக்களின் பாவத்தின் தன்மை
  choice: பாலியல் விபசாரத்தைக் குறிப்பிடும் வலுவான சொல்லாட்சியைப் பேணுதல்
  alternative: மோவாபியப் பெண்களோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடத் தொடங்கினர்
  rationale: זנה என்பது பொதுவான ஒழுக்கக்கேட்டைக் காட்டிலும் வலுவானதும் உருவகச் செறிவுடையதும் ஆகும். வசனத்தில் உள்ள பாலியல் பொருளையும் உடன்படிக்கைத் துரோகத்தை நினைவூட்டும் சொல்லின் கூர்மையையும், பிந்தைய விளக்கத்தைத் திணிக்காமல், 'விபசாரம்' பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. 'மோவாபின் மகள்கள்' என்ற மூலமொழி வடிவம் பிரதான உரையில் பேணப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
