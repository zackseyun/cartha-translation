  text: And it happened after the plague[a].
translation:
  language: ta
  text: அந்தக் கொள்ளைநோய்க்குப் பிறகு, அது நடந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “கொள்ளைநோய்க்குப் பிறகு அது நடந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இவ்வாறு நிகழ்ந்தது
  rationale: இங்கு இந்தச் சொல் கதைநடையை அடுத்த நிகழ்வுக்கு நகர்த்தும் இடைமாற்றுச் சூத்திரமாக உள்ளது. ‘இவ்வாறு நிகழ்ந்தது’ என்பது அதன் கதைத் தொடர்ச்சி செயல்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: இது கால வரிசையை நேரடியாகக் குறிக்கிறது; ‘பிறகு’ என்பது தெளிவான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: הַמַּגֵּפָה
  choice: அந்தக் கொள்ளைநோய்
  rationale: מַגֵּפָה இச்சூழலில் உயிரிழப்பை ஏற்படுத்திய தெய்வீகத் தண்டனையான கொள்ளைநோயைக் குறிக்கிறது. முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட நிகழ்வை எபிரெயச் சுட்டுச் சொல்லுடன் இயல்பாகக் காட்ட ‘அந்தக் கொள்ளைநோய்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: குறுகிய கதை இடைமாற்றுச் சொற்றொடரைத் தனி வசனமாக அமைத்தல்
  choice: இந்த உட்பிரிவைத் தனித்து நிற்கும் இடைமாற்று வாக்கியமாக மொழிபெயர்த்தல்
  alternative: அடுத்த வசனத்தின் தொடக்கமாக அமைத்தல்
  rationale: எபிரெய மூல மரபில் இந்த வசனம் ஒரு குறுகிய கதை இடைமாற்றை மட்டுமே கொண்டுள்ளது. இதை முழு வாக்கியமாக வழங்குவது மூல வசனப் பிரிவையும் அதன் இடைமாற்றுச் செயல்பாட்டையும் காக்கிறது; இதில் தனிப்பட்ட கோட்பாட்டுத் தீர்மானம் எதுவும் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த பகுதிக்கான இடைமாற்றாக இருப்பதால் ‘இவ்வாறு நிகழ்ந்தது’ என இயல்பாக வழங்கப்பட்டுள்ளது.
