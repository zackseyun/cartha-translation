reference: Numbers 25:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: ta
  text: ஆசாரியனான ஆரோனின் மகன் எலெயாசாரின் மகனான பினெகாஸ் இதைக் கண்டபோது[a], சபையின் நடுவிலிருந்து[b] எழுந்து, தன் கையில் ஓர் ஈட்டியை எடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்டபோது.” எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படாமல், முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சபையினரிடையிலிருந்து”; “கூட்டத்தின் நடுவிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: இதைக் கண்டபோது
  rationale: எபிரெய வினைச்சொல் நேரடியாக ‘கண்டான்’ என்று மட்டுமே கூறுகிறது; அதன் செயப்படுபொருள் முந்தைய வசனச் சூழலில் மறைமுகமாக உள்ளது. இயல்பான தமிழுக்காக ‘இதை’ சேர்க்கப்பட்டாலும், அது எதைக் குறிக்கிறது என்பதை விளக்கமாக நிர்ணயிக்கவில்லை.
- source_word: פִּינְחָס
  choice: பினெகாஸ்
  rationale: தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனான ஆரோனின் மகன் எலெயாசாரின் மகனான
  rationale: மூலத்தின் தலைமுறைத் தொடர்பு முழுமையாகப் பாதுகாக்கப்படுகிறது. הַכֹּהֵן என்பதற்கு ‘ஆசாரியன்’ என்றே மொழிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத ‘தலைமை ஆசாரியன்’ சேர்க்கப்படவில்லை.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: எழுதல் அல்லது எழுந்து நிற்றல் என்ற அடிப்படைப் பொருளையும் அடுத்த செயலை நோக்கிய கதையோட்டத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: சபையின் நடுவிலிருந்து
  rationale: תּוֹךְ என்பதன் ‘நடுவில்’ என்ற இடப்பொருளையும், עֵדָה என்பதன் கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் கூட்டுப் பொருளையும் பாதுகாக்கிறது.
- source_word: וַיִּקַּח
  choice: எடுத்தான்
  rationale: பொதுவான ‘எடு’ என்ற பொருளே இங்கு போதுமானது; ‘பற்றிக்கொண்டான்’ போன்ற சொல் மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கக்கூடும்.
- source_word: רֹמַח
  choice: ஓர் ஈட்டி
  rationale: ஈட்டி அல்லது நீண்ட குத்தாயுதத்தைக் குறிக்கும் சொல்லுக்கு தெளிவான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: בְּיָדוֹ
  choice: தன் கையில்
  rationale: ஆயுதத்தைத் தன் கையில் எடுத்துக்கொண்டதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: הָעֵדָה என்பதன் மொழிபெயர்ப்பு
  choice: சபை
  alternative: கூட்டம்; மக்கள் சமூகம்
  rationale: ஐந்தாகமத்தில் கூடியிருக்கும் உடன்படிக்கை மக்களைக் குறிக்கும் கூட்டுச் சார்பை ‘சபை’ சுருக்கமாகப் பாதுகாக்கிறது. இங்கு அது பிற்காலத் திருச்சபை அமைப்பைத் தனிப்படக் குறிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மரபில் அறிமுகமான ‘ஆசாரியன்,’ ‘சபை,’ ‘ஈட்டி’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வாக்கிய அமைப்பு இயல்பான தமிழுக்கேற்ப மாற்றப்பட்டுள்ளது.
