source:
  edition: WLC
  text: צָר֖וֹר אֶת הַ/מִּדְיָנִ֑ים וְ/הִכִּיתֶ֖ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: ta
  text: மிதியானியரிடம் பகைமை காட்டுங்கள்; அவர்களைத் தாக்குங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிதியானியரைப் பகைவர்களாக நடத்தி, அவர்களைத் தாக்குங்கள்.” צָרוֹר என்ற எபிரெய வினை, ஒருவரைப் பகைவராக நடத்துதல் அல்லது அவரிடம் பகைமை காட்டுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: பகைத்து
  rationale: Qal கட்டளை வடிவம் ஒருவரைப் பகைவராக நடத்துவதையோ அவரிடம் பகைமை காட்டுவதையோ குறிக்கலாம். ‘பகைத்து’ என்பது குறிப்பிட்ட இராணுவ உத்தியைச் சேர்க்காமல் அந்தப் பகைமை உணர்வைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמִּדְיָנִים
  choice: மிதியானியரை
  rationale: மிதியான் மக்களைக் குறிக்கும் இனப்பெயர்; நேரடி செயப்படுபொருளாகத் தமிழில் ‘-ஐ’ உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: וְהִכִּיתֶם
  choice: தாக்குங்கள்
  rationale: נכה என்பதன் Hiphil வடிவம் அடித்தல், தாக்குதல் அல்லது வீழ்த்துதல் ஆகிய பொருள்களை ஏற்கலாம். இங்கு ‘தாக்குங்கள்’ வன்முறையான நடவடிக்கையைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் ‘கொல்லுங்கள்’ என்று மூலத்தைவிடக் குறிப்பாக்குவதையும் ‘தோற்கடியுங்கள்’ என்று உடல் வன்முறையை மென்மைப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: אוֹתָם
  choice: '[தமிழ் வினை அமைப்பில் தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: இந்தப் பன்மை நேரடி செயப்படுபொருள் சுட்டுப்பெயர் மிதியானியரையே மீண்டும் குறிக்கிறது. தமிழில் பகிரப்பட்ட செயப்படுபொருளான ‘மிதியானியரை’ இரு வினைகளுக்கும் பொருந்தச் செய்வது இயல்பானது.
- source_word: אֶת
  choice: '[தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய நேரடி செயப்படுபொருள் குறியீடு; தமிழில் அதன் இலக்கணச் செயல்பாடு ‘மிதியானியரை’ என்பதிலுள்ள வேற்றுமை உருபால் வெளிப்படுகிறது.
theological_decisions:
- issue: தெய்வீகமாகக் கட்டளையிடப்பட்ட பகைமையையும் வன்முறையையும் மென்மைப்படுத்தாமலும் விரிவாக்காமலும் வழங்குதல்
  choice: மிதியானியரைப் பகைத்துத் தாக்குங்கள்
  alternative: மிதியானியரைப் பகைவர்களாக நடத்தி அவர்களை வீழ்த்துங்கள்
  rationale: எபிரெய உரை பகைமையையும் வன்முறையான செயலையும் நேரடியாகக் கட்டளையிடுகிறது. தமிழாக்கம் அந்தக் கடுமையைப் பேணுகிறது; ஆனால் இவ்வசனத்தில் இல்லாத ‘கொல்லுதல்’, முழுமையான அழிவு அல்லது இறையியல் நியாயப்படுத்துதல் போன்ற கருத்துகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான தமிழில் சுருக்கமான, நேரடியான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பகைத்துத் தாக்குங்கள்’ என்பது மூலத்திலுள்ள இரண்டு கட்டளைகளையும் இயல்பான தொடராகக் காக்கிறது; ‘தாக்குங்கள்’ வன்முறையை மறைக்காமல், வினையின் பொருளை ‘கொல்லுங்கள்’ என அளவுக்கு மீறிக் குறிப்பாக்காமல் விடுகிறது.
