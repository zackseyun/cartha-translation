base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: ta
  text: ஆசாரியனான ஆரோனின் மகன் எலெயாசரின் மகன் பினெகாஸ், இஸ்ரவேல் மக்கள்மேல் இருந்த என் கடுங்கோபத்தைத் திருப்பிவிட்டான். அவர்களிடையே என் பொறாமைக்காகப் பொறாமை கொண்டதால்[a], என் பொறாமையில் நான் இஸ்ரவேல் மக்களை முற்றிலும் அழித்துவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் வைராக்கியத்தோடு அவர்களிடையே வைராக்கியம் காட்டியதால் … என் வைராக்கியத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் பினெகாஸின் செயலுக்கும் கடவுளின் பொறாமை அல்லது வைராக்கியத்திற்கும் ஒரே வேரிலிருந்து வந்த சொற்கள் பயன்படுத்தப்பட்டுள்ளன; இங்கு அது தனியுரிமை கோரும் உடன்படிக்கை அக்கறையைக் குறிக்கிறது.
    reason: கנא/קנאה வேர்ச்சொல்லின் மீளுரையையும், ‘பொறாமை’ மற்றும் ‘வைராக்கியம்’ ஆகிய சாத்தியமான பொருள்களையும் குறிக்கிறது.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: திருப்பிவிட்டான்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு கோபத்தை விலக்குதல் அல்லது திருப்புதல் எனப் பொருள்படுகிறது. ‘திருப்பிவிட்டான்’ அதன் காரணவினைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: חֲמָתִי
  choice: என் கடுங்கோபம்
  rationale: חֵמָה தீவிரமான, எரியும் கோபத்தைக் குறிக்கிறது. நவீன தமிழில் அதன் வலிமையை ‘கடுங்கோபம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעַל
  choice: மக்கள்மேல் இருந்த
  rationale: מֵעַל என்பதில் உள்ள ‘மேலிருந்து’ என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, கோபம் இஸ்ரவேலர்மேல் இருந்ததாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியின் வழக்கமான இனக்குழுப் பெயரான ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்கு, தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கும் நிலையான வடிவம் ‘இஸ்ரவேல் மக்கள்’ ஆகும்.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: என் வைராக்கியத்தையே தன் வைராக்கியமாகக் காட்டியதால்
  rationale: קנא என்ற வேரின் வினை-பெயர்ச்சொல் தொடர்பை ‘வைராக்கியம்’ என்ற சொல்லை மீண்டும் பயன்படுத்தித் தக்கவைக்கிறது. அதே நேரத்தில், எபிரெய மொழியில் உள்ள கடவுளின் தனியுரிமைக் கோரிக்கையையும் தீவிர அக்கறையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתוֹכָם
  choice: அவர்களிடையே
  rationale: பினெகாஸ் சமூகத்தின் நடுவில் செயல்பட்டதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כִלִּיתִי
  choice: முற்றிலும் அழித்துவிடவில்லை
  rationale: பியேல் வடிவிலுள்ள כלה இங்கு முழுமையாக முடிவுக்குக் கொண்டுவருதல் அல்லது அழித்தல் என்ற வலிமையான பொருளைக் கொண்டுள்ளது; ‘முற்றிலும்’ அந்த முழுமை நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בְּקִנְאָתִי
  choice: என் வைராக்கியத்தில்
  rationale: முந்தைய קנאה சொல்லுடன் உள்ள திட்டமிட்ட மறுபயன்பாட்டைத் தக்கவைத்து, கடவுளின் தீவிரமான உடன்படிக்கைச் சார்ந்த கோரிக்கையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: קנא / קִנְאָה என்பவற்றை பினெகாஸுக்கும் கடவுளுக்கும் ஒரே சொல்லால் மொழிபெயர்த்தல்
  choice: வைராக்கியம்
  alternative: பொறாமை / தனியுரிமை கோரும் எரிச்சல்
  rationale: இவ்வேர்ச்சொல் தீவிர ஆர்வத்தையும் தனியுரிமை கோரும் பொறாமையையும் குறிக்கக்கூடும். தமிழில் ‘பொறாமை’ பொதுவாகத் தீய மனப்பான்மையைக் குறிப்பதால், இச்சூழலில் ‘வைராக்கியம்’ இயல்பான முதன்மைத் தேர்வாகும்; ஒரே சொல்லை மீண்டும் பயன்படுத்துவது பினெகாஸின் செயலுக்கும் கடவுளின் பதிலுக்கும் இடையிலான எபிரெயச் சொல் தொடர்பைத் தக்கவைக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு எபிரெயப் பதம் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் வழக்கமான இனக்குழுப் பெயராக உள்ளது. சொல்லுக்குச் சொல் வடிவமான ‘மகன்கள்’ தமிழில் ஆண்களை மட்டும் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; ‘மக்கள்’ மூலத்தின் குறிக்கப்படும் பொருளைத் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘கடுங்கோபம்’, ‘வைராக்கியம்’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற உயர்நடையைக் கொண்டிருந்தாலும் இன்றைய தமிழில் புரிந்துகொள்ளத்தக்கவை. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
