base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: ta
  text: கொல்லப்பட்ட இஸ்ரவேலிய மனிதனின் பெயர் சாலூவின் மகன் சிம்ரி[a]; அவன் மீதியானியப் பெண்ணுடன் கொல்லப்பட்டவன்; சிமியோனியரிடையே ஒரு தந்தைவழிக் குடும்பத்தின் தலைவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கொல்லப்பட்ட’ என்ற வினை இருமுறை பயன்படுத்தப்பட்டு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: '[அந்த மனிதன்] ... சிம்ரி'
  rationale: எபிரெயத்தில் பெயரை அறிமுகப்படுத்தும் பெயர்ச்சொல் வாக்கியம். தமிழில் இயல்பாகப் பெயரை நேரடியாகக் கூறி அடையாளப்படுத்தப்பட்டுள்ளது; וְ-ன் தொடரிணைப்பு சூழலிலேயே தெளிவாகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் மனிதன்
  rationale: தேசிய அடையாளத்தையும் ஆண்பால் ஒருமையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: கொல்லப்பட்ட ... கொல்லப்பட்டவன்
  rationale: נכה வினையின் இருமுறை பயன்பாட்டைத் தக்கவைத்து எபிரெயத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; இச்சூழலில் நிகழ்ந்த மரணத்தை ‘கொல்லப்பட்ட’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶת הַמִּדְיָנִית
  choice: மீதியானியப் பெண்ணுடன்
  rationale: இங்கு אֶת உடனிகழ்வைக் குறிக்கிறது; பெண்பால் பெயரடை காரணமாக ‘பெண்’ வெளிப்படையாக வழங்கப்பட்டுள்ளது.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: சாலூவின் மகன் சிம்ரி
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, எபிரெய மரபுவழி உறவு இயல்பான தமிழ்ச் சொல்லமைப்பில் தரப்பட்டுள்ளது.
- source_word: נְשִׂיא
  choice: தலைவன்
  rationale: அரச மரபைத் தவறாக உணர்த்தக்கூடிய ‘இளவரசன்’ என்பதற்குப் பதிலாக சமூகத் தலைமைப் பொறுப்பைக் குறிக்கிறது.
- source_word: בֵית אָב
  choice: தந்தைவழிக் குடும்பம்
  rationale: தந்தை மரபை அடிப்படையாகக் கொண்ட குடும்ப அல்லது குல அலகைக் குறிக்கும் தொழில்நுட்பச் சமூகச் சொல்லின் பொருளை நவீன தமிழில் தெளிவுபடுத்துகிறது.
- source_word: לַשִּׁמְעֹנִי
  choice: சிமியோனியரிடையே
  rationale: சிமியோன் கோத்திரத்திற்குள் அந்தத் தந்தைவழிக் குடும்பம் அமைந்திருந்ததை இயல்பாகத் தெரிவிக்கிறது.
