  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: ta
  text: 'யாவே மோசேயிடம் சொன்னார்: “மக்களின் தலைவர்கள் அனைவரையும் பிடித்து, யாவேக்காக அவர்களைப் பட்டப்பகலில்[a] கழுவேற்று[b]. அப்போது யாவேயின் எரியும் கோபம் இஸ்ரவேலைவிட்டு விலகும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “சூரியனுக்கு முன்பாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மக்களின் தலைவர்கள் அனைவரையும் அழைத்து, குற்றவாளிகளை யாவேக்காகப் பட்டப்பகலில் அவர்கள் கொல்லும்படி செய்.” எபிரெயச் சுட்டுப்பெயரான “அவர்களை” என்பது நேரடியாகப் பார்த்தால் தலைவர்களையே குறிக்கிறது; ஆனால் தலைவர்கள்தாம் குற்றவாளிகளுக்குத் தண்டனை நிறைவேற்ற வேண்டும் என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: קַח
  choice: பிடித்து
  rationale: தண்டனைக்காகத் தலைவர்களைக் கைப்பற்றும் கட்டளையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: மக்களின் தலைவர்கள் அனைவரையும்
  rationale: ‘தலைகள்’ என்ற எபிரெய உருவகத்தைச் சொற்சொல்லாக மொழிபெயர்த்தால் தமிழில் உடல் உறுப்புகளாகத் தவறாகப் புரியலாம்; சூழலில் குறிக்கப்படும் ஆட்சித் தலைவர்களைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהוֹקַע אֹתָם
  choice: அவர்களைப் கழுவேற்று
  rationale: יקע என்பதன் கடுமையான, பொதுமக்கள் முன்னிலையிலான கொலை/வெளிப்படுத்தல் பொருளை ‘கழுவேற்று’ துல்லியமாகவும் சுருக்கமாகவும் தருகிறது; சுட்டுப்பெயரின் இயல்பான முன்னிலையைத் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: ל முன்னிடைச்சொல்லின் அர்ப்பணிப்பு அல்லது நோக்க உறவை ‘யாவேக்காக’ நேரடியாகக் காட்டுகிறது; எபிரெயத்தில் ‘முன்பாக’ என்பதற்குரிய தனி வடிவம் இங்கு இல்லை.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: பட்டப்பகலில்
  rationale: சொற்சொல்லாக ‘சூரியனுக்கு முன்பாக’; வெளிப்படையாகப் பகலில் நிகழ்வதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֲרוֹן אַף יְהוָה
  choice: யாவேயின் எரியும் கோபம்
  rationale: கடுங்கோபத்தை வெப்பமாக உருவகிக்கும் எபிரெய மொழிநடையைத் தக்கவைக்கிறது.
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலைவிட்டு விலகும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் நோக்கம்/விளைவை இயல்பான தமிழில் காட்டி, מן குறிக்கும் பிரிவையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவர்களை’ என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் அது ‘மக்களின் தலைவர்கள் அனைவரையும்’ குறிக்கிறது.
  alternative: தலைவர்கள் தாங்களே கொல்லப்படாமல், குற்றவாளிகளைத் தண்டிக்கும்படி அவர்களுக்கு ஆணையிடப்படுகிறது.
  rationale: உடனடி இலக்கணத்தில் אֹתָם என்பதற்கு மிக இயல்பான முன்னிலை ‘மக்களின் தலைவர்கள்’; ஆனால் அடுத்த வசனத்தில் நியாயாதிபதிகள் பாகால்-பேயோருடன் இணைந்தவர்களைக் கொல்லுமாறு கட்டளையிடப்படுவதால் மாற்றுப் புரிதலுக்கு உண்மையான இடமுண்டு. அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘கழுவேற்று’ கடுமையான வரலாற்றுத் தண்டனையைத் தெளிவாகக் காட்டுகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இணைக்கப்பட்டுள்ளன.
