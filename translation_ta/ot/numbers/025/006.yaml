base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: ta
  text: இதோ, இஸ்ரவேல் மகன்களில் ஒருவன் வந்து, ஒரு மீதியானியப் பெண்ணை[b] தன் சகோதரர்களிடம்[a] அழைத்து வந்தான்; மோசேயின் கண்களுக்கு முன்பாகவும் இஸ்ரவேல் மகன்களின் முழுச் சபையினரின் கண்களுக்கு முன்பாகவும், அவர்கள் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் அழுதுகொண்டிருக்கையில்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உறவினர்களிடம்” அல்லது “தன் சக இஸ்ரவேலர்களிடம்.” எபிரெயத்தில் நேரடியாக “தன் சகோதரர்களிடம்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அந்த மீதியானியப் பெண்” என்று உள்ளது; ஆனால் இக்கதையில் அவள் முதன்முறையாக அறிமுகப்படுத்தப்படுவதால், தமிழில் “ஒரு மீதியானியப் பெண்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
