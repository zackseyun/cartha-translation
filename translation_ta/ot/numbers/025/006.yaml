- source_word: אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களில் ஒருவன்
  rationale: ஒரு ஆண் இஸ்ரவேலனைச் சுட்டும் மூலமொழியின் ஒருமையையும் ஆண்பால் குடும்பவழக்கையும் காக்கிறது.
- source_word: וַיַּקְרֵב
  choice: அழைத்து வந்தான்
  rationale: ஹிபில் வடிவின் ‘அருகில் கொண்டுவருதல்’ என்ற இயக்கத்தையும், ஒரு பெண்ணை உடன் கூட்டிவந்த சூழலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘சமர்ப்பித்தான்’ என்ற தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
- source_word: אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: ‘அவனுடைய சகோதரர்களிடம்’ என்ற மூலமொழியின் குடும்பவழக்கை நேரடியாகக் காக்கிறது; சூழலில் சக இஸ்ரவேலரைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: הַמִּדְיָנִית
  choice: ஒரு மீதியானியப் பெண்ணை
  rationale: பெண்பால் பெயரடை பெயர்ச்சொல்லாகப் பயன்படுவதால் ‘பெண்’ வெளிப்படையாகச் சேர்க்கப்படுகிறது. தமிழில் ஒருவரை முதன்முறையாக அறிமுகப்படுத்தும் இயல்புக்கேற்ப ‘ஒரு’ பயன்படுத்தப்படுகிறது.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: கண்களுக்கு முன்பாகவும் ... கண்களுக்கு முன்பாகவும்
  rationale: செயல் வெளிப்படையாகவும் துணிச்சலான அவமதிப்பாகவும் நடந்ததை வலியுறுத்தும் எபிரெய மறுபடிச் சொல்லலைக் காக்கிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களாகிய சபையார் அனைவரும்
  rationale: עֵדָה என்பதன் கூடியிருக்கும் உடன்படிக்கைச் சமூகப் பொருளை ‘சபையார்’ தெரிவிக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதன் குடும்பவழக்கும் காக்கப்படுகிறது.
- source_word: וְהֵמָּה בֹכִים
  choice: அப்போது அவர்கள் ... அழுதுகொண்டிருந்தார்கள்
  rationale: அந்த மனிதனின் செயல் நடந்துகொண்டிருந்த வேளையில் நீடித்த பின்னணிச் செயலாக அழுகை இருந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: வழிபாட்டிடத்தின் குறிப்பிட்ட பெயரையும் அதன் நுழைவிடத்தையும் தெளிவாகக் காக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל / אֶחָיו ஆகியவற்றிலுள்ள ஆண்பால் குடும்ப மொழி
  choice: ‘இஸ்ரவேலின் மகன்கள்’ மற்றும் ‘சகோதரர்கள்’ என முதன்மை உரையில் காக்கப்பட்டது
  alternative: ‘இஸ்ரவேலர்’ மற்றும் ‘சக இஸ்ரவேலர்’
  rationale: மூலமொழியின் ஆண்பால் குடும்பச் சொற்களை நடுநிலைப்படுத்தாமல் மொழிபெயர்க்கிறது; அதேவேளையில் ‘சகோதரர்கள்’ என்பது சூழலில் உறவினரையோ சக இஸ்ரவேலரையோ குறிக்கக்கூடும் என்ற உண்மையான பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தும் ‘கண்களுக்கு முன்பாக’ என்ற மறுபடிச் சொல்லல் காக்கப்பட்டுள்ளது. மிக நீண்ட ஒரே வாக்கியத்தை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், நிகழ்வுகளின் ஒரேகாலத் தொடர்பு ‘அப்போது’ மற்றும் ‘அழுதுகொண்டிருந்தார்கள்’ மூலம் பாதுகாக்கப்பட்டுள்ளது.
