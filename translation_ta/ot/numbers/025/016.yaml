  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: YHWH; பாரம்பரியமாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது. மாற்று ஒலிபெயர்ப்புகளில் ‘யாவே’ மற்றும் ‘யெகோவா’ அடங்கும்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்நிலை வடிவம் ஒரு புதிய கதைநிகழ்வை அறிமுகப்படுத்துகிறது; தெய்வீக உரையைத் தொடங்கும் வழக்குச் சூத்திரத்திற்கு ‘பேசினார்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது எபிரேய இறைப்பெயரான יהוה-ஐத் தமிழில் வழக்கமாக ஒலிபெயர்க்கும் வடிவம்; ஒரு பட்டத்தை மாற்றாக இடாமல் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: אֶל
  choice: -ிடம்
  rationale: பேச்சின் நோக்குநரைக் குறிக்கும் אֶל என்பதற்கு நவீன தமிழில் பெயருடன் இணையும் ‘-ிடம்’ இயல்பான இணை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரேய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரேயச் சூத்திரமான לֵאמֹר-ஐத் தமிழில் தனியே ‘சொல்லி’ என மீண்டும் கூறுவதைவிட முக்காற்புள்ளி இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக, தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டுள்ளது; ‘யாவே’ என்பது மற்றொரு சாத்தியமான ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் தமிழ். எபிரேய வாக்கியத்தின் உரையறிமுகச் சூத்திரம் தமிழில் இயல்பாக அமைய முக்காற்புள்ளியால் சுருக்கப்பட்டுள்ளது.
