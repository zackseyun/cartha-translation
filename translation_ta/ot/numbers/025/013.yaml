base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: ta
  text: அவன் தன் தேவனுக்காகப் பேரார்வம் கொண்டதாலும், இஸ்ரவேலின் மகன்களுக்காகப் பாவநிவிர்த்தி செய்ததாலும், அவனுக்கும் அவனுக்குப் பின்வரும் அவனுடைய சந்ததிக்கும் நிலையான ஆசாரியத்துவத்தின் உடன்படிக்கை இருக்கும்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தேவனுக்காகப் பொறாமை கொண்டான்.” எபிரெய வினைச்சொல் உடன்படிக்கை சார்ந்த பொறாமையையோ தீவிர ஆர்வத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்றென்றும் நிலைக்கும் ஆசாரியத்துவம்.”
    reason: alternative_reading
  - marker: c
    text: “இஸ்ரவேலின் மகன்கள்” என்பது எபிரெயத்தில் வழங்கும் மரபான தேசியப் பெயர்; இது இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: உண்டாயிருக்கும்
  rationale: பெண்பால் ஒருமை வினைச்சொல் பின்னர் வரும் ‘உடன்படிக்கை’ என்பதைக் குறிக்கிறது; வாக்குறுதியின் எதிர்கால நிலைத்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: அவனுக்கும் அவனுக்குப் பின் வரும் அவனுடைய சந்ததிக்கும்
  rationale: זֶרַע என்பதன் கூட்டொருமைப் பொருளை ‘சந்ததி’ காக்கிறது; ‘அவனுக்குப் பின்’ என்பது தலைமுறைத் தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: தெய்வீக வாக்குறுதி மற்றும் உறவுப் பிணைப்பைக் குறிக்கும் வழக்கமான, பொருத்தமான தமிழ் சொல்.
- source_word: כְּהֻנַּת עוֹלָם
  choice: நிலையான ஆசாரியத்துவம்
  rationale: עוֹלָם இங்கு ஆசாரியப் பணியின் தலைமுறைதோறும் நீடிக்கும் தன்மையைச் சுட்டுகிறது; ‘நிலையான’ என்பது கட்டாயமாகத் தத்துவார்த்தமான முடிவின்மையைச் சேர்க்காமல் அந்த நிறுவனத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: תַּחַת אֲשֶׁר
  choice: …தாலும்
  rationale: உடன்படிக்கை வழங்கப்பட்டதற்கான காரணத்தை இயல்பான தமிழ் காரணவினையெச்ச அமைப்பில் காட்டுகிறது.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: தன் தேவனுக்காக வைராக்கியம் கொண்டான்
  rationale: קנא என்பதிலுள்ள தீவிர அக்கறை மற்றும் கடவுளின் தனியுரிமைக்காகச் செயல்படும் உணர்வை ‘வைராக்கியம்’ இயல்பாக வெளிப்படுத்துகிறது; ‘பொறாமை’ என்ற தமிழ்ச்சொல் இங்கு தவறாக எதிர்மறையாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: וַיְכַפֵּר
  choice: பாவநிவிர்த்தி செய்தான்
  rationale: כפר என்பதன் ஆசாரிய/வழிபாட்டு சார்ந்த பரிகாரப் பொருளை, நவீன வேதாகமத் தமிழில் புரியக்கூடிய வகையில் வழங்குகிறது.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்காக
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் தேசியப் பெயரிடலை நேரடியாகக் காக்கிறது; அது முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்குச் சொற்றொடர் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: קנא என்ற வினையின் உடன்படிக்கைச் சார்ந்த உணர்வு
  choice: தன் தேவனுக்காக வைராக்கியம் கொண்டான்
  alternative: தன் தேவனுக்காகப் பொறாமை கொண்டான்
  rationale: எபிரெயச் சொல் வைராக்கியம் அல்லது உடன்படிக்கைப் பொறாமை ஆகிய இரண்டையும் உணர்த்தலாம். தமிழில் ‘பொறாமை’ பெரும்பாலும் தீய மனநிலையாகப் புரியப்படுவதால், முதன்மை உரையில் ‘வைராக்கியம்’ தேர்ந்தெடுக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: עוֹלָם என்பதன் கால வலிமை
  choice: நிலையான ஆசாரியத்துவம்
  alternative: என்றென்றும் நிலைக்கும் ஆசாரியத்துவம்
  rationale: இச்சூழலில் நீடித்த தலைமுறை நிறுவனத்தைச் சுட்டும் பொருளை ‘நிலையான’ காக்கிறது; எபிரெய உரை கட்டாயப்படுத்தாத தத்துவார்த்த முடிவின்மையை முதன்மை உரை மிகைப்படுத்தவில்லை.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலினம் மற்றும் தேசியப் பயன்பாடு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; இது நாட்டினரை ஒட்டுமொத்தமாகக் குறிக்கும் மரபான பெயர் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியத்துவம்,’ ‘உடன்படிக்கை,’ ‘பாவநிவிர்த்தி’ ஆகியவை கருத்துத் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டன. காரணத்தை முதலில் வைத்து, வாக்குறுதியை இறுதியில் வலியுறுத்தும் இயல்பான தமிழ் வாக்கிய ஒழுங்கு பயன்படுத்தப்பட்டது.
