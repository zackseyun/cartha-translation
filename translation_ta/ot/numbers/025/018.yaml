base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: ta
  text: ஏனெனில், பேயோர் விவகாரத்திலும்[a], மீதியான் தலைவன் ஒருவனின் மகளான, அவர்களுடைய சகோதரியான[c] கோஸ்பியின் விவகாரத்திலும் உங்களை வஞ்சிக்க அவர்கள் செய்த சூழ்ச்சிகளால்[b] அவர்கள் உங்களுக்குப் பகைவர்களாய் இருக்கிறார்கள். பேயோர் விவகாரத்தினால் ஏற்பட்ட கொள்ளைநோயின் நாளில் அவள் தாக்கி வீழ்த்தப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பேயோர் என்பது இவ்வதிகாரத்தில் முன்பு விவரிக்கப்பட்ட பாகால்-பேயோர் சம்பவத்தைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘தங்கள் வஞ்சகத் தந்திரங்களால்’ / ‘தங்கள் துரோகச் செயல்களால்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘அவர்களுடைய சகோதரி’; இது அவர்களுடைய மக்களினத்தையோ உறவுக்குழுவையோ சேர்ந்த ஒரு பெண்ணைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: பகைமை காட்டுகிறார்கள்
