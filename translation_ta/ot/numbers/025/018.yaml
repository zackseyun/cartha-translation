- source_word: נִכְּלוּ
  choice: வஞ்சித்தார்கள்
  rationale: முந்தைய ‘சூழ்ச்சிகள்’ என்பதுடன் தொடர்புடைய வஞ்சகச் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: עַל דְּבַר פְּעוֹר
  choice: பேயோர் விவகாரத்தில் / பேயோர் விவகாரத்தினால்
  rationale: முதல் இடத்தில் சூழ்நிலை சார்ந்த பொருளையும் இறுதி இடத்தில் கொள்ளைநோயுடன் உள்ள காரணத் தொடர்பையும் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: כָּזְבִּי
  choice: கோஸ்பி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: בַת נְשִׂיא מִדְיָן
