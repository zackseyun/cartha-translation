- source_word: הַמֻּכָּה
  choice: வீழ்த்தப்பட்டாள்
  rationale: נכה என்ற வினையின் தாக்கி வீழ்த்துதல் சார்ந்த உருவகத்தைப் பாதுகாத்து, சூழலில் மரணத்தையும் உணர்த்துகிறது.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: கொள்ளைநோய் ஏற்பட்ட நாளில்
  rationale: குறிப்பிட்ட காலத் தொடர்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பேயோர்’ என்பதன் சுட்டுப்பொருள்
  choice: மூலத்தில் உள்ளபடி ‘பேயோர்’ என்ற தனிப்பெயர் பயன்படுத்தப்பட்டது.
  alternative: முதன்மை உரையிலேயே ‘பாகால்-பேயோர்’ என்று விரிவாக்குதல்.
  rationale: எபிரெய உரையில் ‘பேயோர்’ என்றே உள்ளது; நிகழ்வுடனான தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: இருமுறை வரும் עַל דְּבַר פְּעוֹר என்பதன் நுட்பம்
  choice: முதல் இடத்தில் ‘பேயோர் விவகாரத்தில்’ என்றும் இறுதியில் ‘பேயோர் விவகாரத்தினால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: இரு இடங்களிலும் ஒரே சொற்றொடரைப் பயன்படுத்துதல்.
  rationale: ஒரே எபிரெய மரபுத்தொடர் முதல் இடத்தில் நிகழ்வு சார்ந்த சூழலையும் இறுதி இடத்தில் கொள்ளைநோய்க்கான காரணத் தொடர்பையும் கொண்டுள்ளது; அந்த வேறுபாடு தமிழில் இயல்பாகப் பிரதிபலிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் குடும்ப உறவுச் சொல்லும், பேயோர் குறித்த இரு பயன்பாடுகளின் சூழ்நிலை/காரண நுட்பமும் பாதுகாக்கப்பட்டுள்ளன.
