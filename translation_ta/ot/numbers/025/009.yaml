  text: וַ/יִּהְי֕וּ הַ/מֵּתִ֖ים בַּ/מַּגֵּפָ֑ה אַרְבָּעָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: ta
  text: கொள்ளைநோயில் இறந்தவர்கள் இருபத்து நான்காயிரம் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: — (தமிழ் வாக்கியத்தில் எண்ணிக்கைப் பயனிலை)
  rationale: இங்கு היה எண்ணிக்கையின் மொத்தத்தைக் குறிப்பிடும் இணைப்புவினையாக உள்ளது. இயல்பான தமிழில் தனியாக ‘இருந்தார்கள்’ என்று மொழிபெயர்க்காமல், ‘இருபத்து நான்காயிரம் பேர்’ என்ற எண்ணிக்கைப் பயனிலையால் அதன் பொருள் வெளிப்படுகிறது.
- source_word: הַמֵּתִים
  choice: இறந்தவர்கள்
  rationale: מות என்பதன் பங்கேற்புவினை வடிவம் இறந்த நபர்களைக் குறிக்கிறது. ‘இறந்தவர்கள்’ என்பது பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּמַּגֵּפָה
  choice: கொள்ளைநோயில்
  rationale: מַגֵּפָה என்பது உயிரிழப்பை ஏற்படுத்தும் கொள்ளைநோய் அல்லது பேரழிவான நோய்த்தாக்கத்தைக் குறிக்கிறது. ב முன்னொட்டை ‘-இல்’ என வழங்குவது எபிரெயக் கட்டமைப்பையும், அந்த நிகழ்வில் ஏற்பட்ட இறப்பையும் இயல்பாகப் பாதுகாக்கிறது; காரணப் பொருளாக ‘கொள்ளைநோயால்’ என்பதும் சாத்தியம்.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: இருபத்து நான்காயிரம் பேர்
  rationale: எபிரெய எண்ணிக்கைச் சொற்றொடரின் மொத்தம் 24,000. நபர்களை எண்ணுவதால் தமிழில் இயல்பாக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைந்த மொழிபெயர்ப்பு. மூலத்தில் உள்ள எண்ணிக்கை அறிக்கை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; விளக்கவுரை சேர்க்கப்படவில்லை.
