  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: ta
  text: அவர்கள் மக்களைத் தங்கள் தெய்வங்களின் பலிகளுக்கு அழைத்தார்கள். மக்கள் உண்டார்கள்; அவர்களுடைய தெய்வங்களுக்குப் பணிந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய தெய்வங்களை வழிபட்டார்கள்.’ எபிரெய வினைச்சொல் நேரடியாக உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது; இது பெரும்பாலும் வழிபாட்டுச் செயலாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: அவர்கள் ... அழைத்தார்கள்
  rationale: קרא என்பதன் பெண்பால் பன்மை வடிவம் முந்தைய வசனத்திலுள்ள மோவாபியப் பெண்களைக் குறிக்கிறது. தமிழில் பால்வேறுபாடு வெளிப்படாவிட்டாலும், ‘அழைத்தார்கள்’ என்பது לְ உடனான இச்சூழலின் இயல்பான பொருளைத் தருகிறது.
- source_word: לָעָם
  choice: மக்களை
  rationale: எபிரெயத்தில் உள்ள ‘அந்த மக்கள்’ என்ற பொதுக் குறிப்பைத் தக்கவைக்கிறது; சூழலில் அவர்கள் இஸ்ரவேலர் என்பது தெளிவாக இருந்தாலும், மூலத்தில் இங்கே ‘இஸ்ரவேல்’ மீண்டும் சொல்லப்படவில்லை.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: தங்கள் தெய்வங்களுக்குச் செலுத்திய பலிகளுக்கு
  rationale: பலிகள் அந்தப் பெண்களின் தெய்வங்களோடு தொடர்புடையவை என்பதையும், அழைப்பு அந்தப் பலிகளில் பங்கேற்பதற்கானது என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பலிவிருந்துகள்’ என்று மொழிபெயர்த்து மூலத்தைவிடச் சிறப்பித்துக் கூறவில்லை.
- source_word: וַיֹּאכַל
  choice: மக்கள் அவற்றை உண்டு
  rationale: கூட்டுப் பெயருடன் வரும் எளிய ‘உண்டார்கள்/உண்டனர்’ என்ற நிகழ்வைத் தருகிறது. ‘அவற்றை’ என்பது முன்சொல்லப்பட்ட பலிகளை இயல்பாகச் சுட்டுகிறது.
- source_word: וַיִּשְׁתַּחֲוּוּ
  choice: பணிந்தார்கள்
  rationale: השתחוה குறிக்கும் உடலைத் தாழ்த்திப் பணியும் செயலைத் தக்கவைக்கிறது; நேரடியாக ‘வழிபட்டார்கள்’ என்று பொருள் விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: לֵאלֹהֵיהֶן
  choice: அவர்களுடைய தெய்வங்களுக்கு முன்பாக
  rationale: பணிவு செலுத்தப்பட்ட இலக்கைத் தெளிவாகக் காட்டுகிறது. ‘முன்பாக’ என்பது தமிழில் உடலால் பணியும் காட்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיִּשְׁתַּחֲוּוּ விவரிக்கும் விக்கிரக ஆராதனைச் செயல்
  choice: அவர்களுடைய தெய்வங்களுக்கு முன்பாகப் பணிந்தார்கள்
  alternative: அவர்களுடைய தெய்வங்களை வழிபட்டார்கள்
  rationale: மூல வினைச்சொல்லின் உடல்சார்ந்த பணிவுச் செயலை மொழிபெயர்ப்பு பாதுகாக்கிறது. அது வழிபாட்டுச் செயல் என்பதைப் பலிகளில் பங்கேற்ற சூழல் உணர்த்துகிறது; ஆகவே பொருளை மறைக்காமலும் ஒரே விளக்கத்துக்குள் சுருக்காமலும் உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் அமைக்கப்பட்டது. ‘அவர்கள்’ மற்றும் ‘அவர்களுடைய’ என்பவை சூழலிலுள்ள மோவாபியப் பெண்களைக் குறிக்கின்றன; தமிழில் பெண்பால் பன்மை தனியே குறிக்கப்படுவதில்லை. அடிக்குறிப்பு குறி, அது விளக்கும் ‘பணிந்தார்கள்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
