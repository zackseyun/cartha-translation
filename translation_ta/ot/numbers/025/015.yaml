base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: ta
  text: அடித்துக் கொல்லப்பட்ட அந்த மிதியானியப் பெண்ணின் பெயர் கொஸ்பி; அவள் சூரின் மகள். சூர் மிதியானில் ஒரு தந்தைவழிக் குடும்பத்தின்[a] குலக்குழுக்களின்[b] தலைவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தந்தையின் வீடு”; இது விரிந்த குடும்பம் அல்லது மூதாதை வழிவந்த குடும்பக் குழுவைக் குறிக்கும் உறவுமுறைச் சொல்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “மக்கள் குழுக்கள்.” இங்குள்ள எபிரெயச் சொல் “மக்கள் இனங்கள்” என்றும் பொருள்படலாம்; இந்த உறவுமுறைச் சூழலில் அது குலக்குழுக்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: பெண்ணின் பெயர்
  rationale: எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; וְ குறிக்கும் முந்தைய வசனத் தொடர்பு தொடர்ச்சியான உரையால் உணரப்படுகிறது.
- source_word: הַמֻּכָּה
  choice: அடித்துக் கொல்லப்பட்ட
  rationale: נכה என்பதன் தாக்குதல்/அடித்தல் படிமத்தையும், முந்தைய வசனத்தால் தெளிவாகும் மரணத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: הַמִּדְיָנִית
  choice: மிதியானியப் பெண்
  rationale: பெண்ணின் இனக்குழு அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָּזְבִּי
  choice: கோஸ்பி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் வாசிக்க ஏற்ற முறையில் எழுத்துப்பெயர்க்கிறது.
- source_word: בַת צוּר
  choice: சூரின் மகள்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பை நேரடியாகத் தருகிறது.
- source_word: רֹאשׁ
  choice: தலைவன்
  rationale: சொல்லின் தலைமை/முதன்மை என்ற உருவகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֻמּוֹת
  choice: குலக்குழுக்கள்
  rationale: இச்சொல் பொதுவாக மக்கள் குழுக்களைக் குறிக்கலாம்; இங்கு தந்தைவழிக் குடும்பச் சூழலில் உட்பிரிவான உறவுக் குழுக்கள் என்ற பொருள் பொருத்தமானது.
- source_word: בֵּית אָב
  choice: தந்தைவழிக் குடும்பம்
  rationale: சொல்லுக்கு சொல் 'தந்தையின் வீடு' என்றாலும், எபிரெயச் சமூக அமைப்பில் இது விரிந்த மூதாதை/தந்தைவழி உறவுக் குடும்பத்தைக் குறிக்கும் தொழில்நுட்பச் சொற்றொடர்.
- source_word: בְּמִדְיָן
  choice: மிதியானில்
  rationale: בְּ முன்னிடைச்சொல்லின் இயல்பான இடப்பொருளைப் பாதுகாக்கிறது.
- source_word: הוּא
  choice: சூர் ... இருந்தான்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் சூரையே மீண்டும் சுட்டுவதால், தமிழில் குழப்பமின்றி பெயரை மீண்டும் கூறி தலைமைப் பொறுப்பை அவனோடு இணைக்கிறது.
