translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; ஆண்பால் הוּא சூரைக் குறிக்கிறது என்பது வெளிப்படையாக வைக்கப்பட்டுள்ளது. அடிக்குறிகள் உரையில் [a], [b] என இரண்டும் இடம்பெற்றுள்ளன.
