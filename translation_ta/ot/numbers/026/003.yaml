  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: ta
  text: 'மோசேயும் ஆசாரியனாகிய எலெயாசாரும் மோவாபின் சமவெளிகளில், எரிகோவுக்கு எதிரே யோர்தான் நதியருகில்[a], அவர்களிடம் இவ்வாறு பேசினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எரிகோவுக்கு அருகே யோர்தான் நதிக்கரையில்.”
    reason: עַל יַרְדֵּן יְרֵחוֹ என்ற நிலவியல் சொற்றொடர் யோர்தானுடனான இடத்தை எரிகோவுடன் தொடர்புபடுத்துகிறது. ‘எரிகோவுக்கு எதிரே’ என்பது சாத்தியமான பொருள்; அருகாமை அல்லது தொடர்பைக் குறிக்கும் மாற்றுப் பொருளும் சாத்தியம்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னதாவது
  rationale: דבר என்பதன் ‘பேசினார்’ என்ற பொருளையும், தொடர்ந்து வரும் לֵאמֹר நேரடி உரையை அறிமுகப்படுத்துவதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம்.
- source_word: וְאֶלְעָזָר
  choice: எலெயாசாரும்
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் வடிவம்; மோசேயுடன் இணைந்த எழுவாயாக ‘உம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: எலெயாசாரின் பதவியைக் குறிக்கும் வரையறுக்கப்பட்ட பெயரடைப்பைத் தருகிறது; மூலத்தில் இல்லாத ‘பிரதான ஆசாரியன்’ என்ற விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: אֹתָם
  choice: அவர்களிடம்
  rationale: பேச்சின் பெறுநர்களைக் குறிக்கும் சுட்டுப்பெயரை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עַרְבֹת குறிக்கும் தட்டையான புல்வெளிப் பிரதேசத்தை பொதுவாகப் புரியும் தமிழில் வழங்குகிறது; பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே யோர்தான் அருகில்
  rationale: இந்த நிலவியல் சூத்திரத்தில் எரிகோவுடனான தொடர்பையும் யோர்தானுக்கு அருகிலான இடத்தையும் தெளிவாகக் காட்டுகிறது; עַל என்பதன் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னதாவது:'
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் குறிக்கிறது.
