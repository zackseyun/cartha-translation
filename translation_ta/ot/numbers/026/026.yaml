base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: ta
  text: செபுலோனின் மகன்கள்[b], அவர்களுடைய குலங்களின்படி:[a] சேரேதிலிருந்து சேரேதியர் குலம்; ஏலோனிலிருந்து ஏலோனியர் குலம்; யக்லியேலிலிருந்து யக்லியேலியர் குலம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அவர்களுடைய குலங்களுக்கு ஏற்ப.”'
    reason: lexical_alternative
  - marker: b
    text: “செபுலோனின் மகன்கள்” என்பது எபிரெய மூலத்தின் நேரடி சொற்றொடர்; இந்தக் கணக்கெடுப்புச் சூழலில் செபுலோனின் கோத்திர வழித்தோன்றல்களை அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: செபுலோனின் மகன்கள்
  rationale: எபிரெய மொழியின் நேரடியான ‘செபுலோனின் மகன்கள்’ என்ற மரபுத்தொடரைப் பேணுகிறது; கணக்கெடுப்புச் சூழலில் இது அவருடைய கோத்திர வழித்தோன்றல்களைக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு தனிக்குடும்பத்தைவிடப் பெரிய கோத்திர உட்பிரிவைக் குறிக்கிறது; לְ முன்னொட்டின் பகிர்வுப் பொருளையும் ‘குலங்களின்படி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְסֶרֶד ... מִשְׁפַּחַת הַסַּרְדִּי
  choice: சேரேதின் வழிவந்தது சேரேதியர் குலம்
  rationale: לְ இங்கு குலத்தின் மூதாதை அல்லது தோற்றத்தை அறிமுகப்படுத்துகிறது. ‘வழிவந்தது’ என்பது தமிழில் அந்த வம்சத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; எபிரெய இனப்பெயர் வடிவம் ‘சேரேதியர்’ என வழங்கப்படுகிறது.
- source_word: לְאֵלֹון ... מִשְׁפַּחַת הָאֵלֹנִי
  choice: ஏலோனின் வழிவந்தது ஏலோனியர் குலம்
  rationale: முந்தைய பட்டியல் அமைப்பைத் தொடர்ந்து, ஏலோனிலிருந்து வந்த குலத்தைக் குறிக்கும் எபிரெய இனப்பெயர் வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לְיַחְלְאֵל ... מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: யக்லெயேலின் வழிவந்தது யக்லெயேலியர் குலம்
  rationale: יַחְלְאֵל என்ற பெயரில் உள்ள חְ ஒலியை ‘க்ல்’ சேர்க்கையால் தோராயமாகப் பிரதிபலித்து, அதிலிருந்து உருவான குலப்பெயரை ‘யக்லெயேலியர்’ என ஒற்றுமையாக வழங்குகிறது.
