translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலுக்குரிய சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. ‘குடும்பம்’ என்பதற்குப் பதிலாக கோத்திரத்தின் உட்பிரிவைத் துல்லியமாகக் குறிக்க ‘குலம்’ தேர்ந்தெடுக்கப்பட்டது. மூல எபிரெயப் பெயர்களுக்கு அணுக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
