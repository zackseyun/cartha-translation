    text: எபிரேயத்தில் இவ்வசனத்தில் பெயர் ஷூப்பாம் என்று உள்ளது; சில ஆங்கில மரபுகளில், பிற உரைமரபுகள் அல்லது இணைப் பட்டியல்களின் தாக்கத்தால் தொடர்புடைய வேறு எழுத்துவடிவங்கள் காணப்படுகின்றன.
