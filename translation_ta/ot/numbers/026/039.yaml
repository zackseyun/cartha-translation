  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: ta
  text: ஷூப்பாமிலிருந்து ஷூப்பாமியரின் குலம்; ஹூப்பாமிலிருந்து ஹூப்பாமியரின் குலம்.[a]
  philosophy: optimal-equivalence
  footnotes:
