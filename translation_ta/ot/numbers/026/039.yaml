lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: சுப்பாமிலிருந்து
  rationale: இந்த மக்கள்தொகைக் கணக்குப் பட்டியலில் לְ முன்னொட்டு ஒரு மூதாதையிடமிருந்து உருவான குல உறவைக் குறிக்கிறது; தமிழில் ‘-இலிருந்து’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது. שְׁפוּפָם என்பது ‘சுப்பாம்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: கோத்திரத்துக்குள் உள்ள உறவுவழிக் குழுவை מִשְׁפָּחָה இங்கு குறிக்கிறது; நவீனத் தமிழில் ‘குலம்’ பொருத்தமான, சுருக்கமான இணைச்சொல்.
- source_word: הַשּׁוּפָמִי
  choice: சுப்பாமியர்
  rationale: உறுப்பினர்/வழித்தோன்றல் பெயரான எபிரேய வடிவத்தின் கூட்டுப்பொருளை தமிழின் மரியாதைப் பன்மை வடிவமான ‘சுப்பாமியர்’ இயல்பாகத் தருகிறது.
- source_word: לְחוּפָם
  choice: ஊப்பாமிலிருந்து
  rationale: முதல் பெயரைப் போலவே לְ குலத் தோற்ற உறவைக் குறிக்கிறது. חוּפָם என்பதில் தொடக்க ח ஒலிக்குத் தமிழில் துல்லிய இணை இல்லாததால் வழக்கமான வேதாகமப் பெயர் ஒலிப்புக்கு ஏற்றவாறு ‘ஊப்பாம்’ என வழங்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: ஒரே வசனத்தில் மீண்டும் வரும் கணக்கெடுப்புச் சூத்திரம் ஒரேவிதமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַחוּפָמִי
  choice: ஊப்பாமியர்
  rationale: ஊப்பாமின் வழித்தோன்றல்களைக் குறிக்கும் கூட்டுப் பெயர் தமிழில் ‘ஊப்பாமியர்’ என இயல்பாக வழங்கப்பட்டது.
