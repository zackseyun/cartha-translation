base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: ta
  text: எப்பிராயீமின் மகன்களுடைய குலங்கள் இவையே. அவர்களில் கணக்கிடப்பட்டவர்கள் முப்பத்திரண்டாயிரத்து ஐந்நூறு பேர். இவர்களே, தங்கள் குலங்களின்படி, யோசேப்பின் மகன்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் கோத்திரப் பட்டியல் சூழலில், இச்சொல் ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவுகளைக் குறிக்கிறது; நவீனத் தமிழில் ‘குலங்கள்’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְּנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மகன்கள்
  rationale: எபிரேய மரபுவழிப் பட்டியல் சொல்லாட்சியை நேரடியாகப் பேணுகிறது; இச்சூழலில் ‘மகன்கள்’ என்பது வழிவந்தோரையும் உள்ளடக்கும் மரபியல் பயன்பாடு.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்பு சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் மொத்த எண்ணிக்கையை மட்டுமல்லாமல், அதிகாரப்பூர்வமாக எண்ணப்பட்ட நபர்களைக் குறிக்கிறது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: முப்பத்திரண்டாயிரத்து ஐந்நூறு
  rationale: எபிரேய மூலத்தின் துல்லியமான மொத்த எண்ணிக்கையை நவீனத் தமிழின் இயல்பான எண் அமைப்பில் தருகிறது.
- source_word: בְנֵי יוֹסֵף
  choice: யோசேப்பின் மகன்கள்
  rationale: மூலத்தின் மரபுவழிச் சொல்லமைப்பையும், எப்பிராயீம் மற்றும் மனாசே ஆகியோருடன் உள்ள தொடர்பையும் பேணுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: தங்கள் குலங்களின்படி
  rationale: முந்தைய ‘குலங்கள்’ என்ற மொழிபெயர்ப்புடன் ஒருமைப்பாட்டைப் பேணி, யோசேப்பின் சந்ததியினர் குலப்பிரிவுகளின்படி பட்டியலிடப்பட்டதைக் காட்டுகிறது.
