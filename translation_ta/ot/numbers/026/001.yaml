  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடமும், ஆசாரியனான ஆரோனின் மகன் எலெயாசாரிடமும் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: ‘கூறினார்’ என்பது וַיֹּאמֶר என்பதன் இயல்பான தமிழ் இணை. தொடர்ந்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் לֵאמֹר என்பதன் பணியை ‘இவ்வாறு’ மற்றும் முக்காற்புள்ளி இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெய வேதாகமத்தில் வரும் இறைநாமம்; அதன் பரவலாக ஏற்கப்படும் ஒலிப்பை நவீன தமிழில் ‘யாவே’ என எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: மோசேயிடமும் ... எலெயாசாரிடமும்
  rationale: இறைவாக்கின் இரு பெறுநர்களையும் குறிக்கும் אֶל ... וְאֶל அமைப்பைத் தமிழில் இணையான ‘-இடமும் ... -இடமும்’ வடிவம் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனான ஆரோனின் மகன்
  rationale: எபிரெயச் சேர்க்கை அமைப்பையும் הַכֹּהֵן என்பதன் குறிப்பிட்ட அடையாளத்தையும் காத்து, ‘ஆசாரியனான’ என்பதை அருகிலுள்ள ஆரோனுடன் இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டப்பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமத்தையே பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- issue: הַכֹּהֵן (‘ஆசாரியன்’) யாரைக் குறிக்கிறது?
  choice: 'ஆரோனை விவரிப்பதாக: ‘ஆசாரியனான ஆரோன்’'
  alternative: 'எலெயாசாரை விவரிப்பதாக: ‘ஆரோனின் மகனும் ஆசாரியனுமான எலெயாசார்’'
  rationale: הַכֹּהֵן என்பது உரையில் אַהֲרֹן என்பதற்கு உடனடியாகப் பின்வருவதால், ‘ஆசாரியனான ஆரோன்’ என்ற தொடர்பே மிக இயல்பானது. எலெயாசாரும் ஆசாரியர் என்பது வேறு இடங்களில் உண்மையானாலும், அதை இங்கே வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
