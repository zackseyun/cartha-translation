  register: நவீன நிலையான தமிழில், மக்கள்தொகைக் கணக்கெடுப்புக்குரிய சுருக்கமான வம்சப் பட்டியல் நடை காக்கப்பட்டுள்ளது. ‘குடும்பம்’ என்பதைக் காட்டிலும் நிர்வாக-வம்சவழிப் பிரிவைத் தெளிவாகக் குறிக்கும் ‘குலம்’ தேர்ந்தெடுக்கப்பட்டது.
