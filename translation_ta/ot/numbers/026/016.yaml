  text: לְ/אָזְנִ֕י מִשְׁפַּ֖חַת הָ/אָזְנִ֑י לְ/עֵרִ֕י מִשְׁפַּ֖חַת הָ/עֵרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/016.yaml
  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: ta
  text: ஒஸ்னியைச் சேர்ந்த ஒஸ்னியர் குலம்; ஏரியைச் சேர்ந்த ஏரியர் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: ஒஸ்னியைச் சேர்ந்த
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் வம்சப் பட்டியல் சூழலில் לְ முன்னொட்டு ஒஸ்னியிலிருந்து வந்த குல உறவைக் குறிக்கிறது; இயல்பான தமிழில் ‘ஒஸ்னியைச் சேர்ந்த’ என்று வழங்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இங்கு இந்தச் சொல் இஸ்ரவேலின் ஒரு கோத்திரத்துக்குள் உள்ள பரந்த உறவினர் பிரிவைக் குறிக்கிறது; நவீன தமிழில் ‘குலம்’ பொருத்தமானது.
- source_word: הָ/אָזְנִי
  choice: ஒஸ்னியர்
  rationale: குறிப்பிட்ட முன்னோரான ஒஸ்னியிடமிருந்து வந்த குழுவைக் குறிக்கும் குடிப்பெயர்; தமிழில் இயல்பான மக்கள்-குழுப் பெயராக ‘ஒஸ்னியர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְ/עֵרִי
  choice: ஏரியைச் சேர்ந்த
  rationale: לְ முன்னொட்டு ஏரியிலிருந்து வந்த குல உறவை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏரியைச் சேர்ந்த’ என்பது தெளிவான இயல்பான வடிவம்.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: ஒரே பட்டியல் வாய்ப்பாட்டில் மீண்டும் வரும் சொல்லுக்கு ஒரே மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: הָ/עֵרִי
  choice: ஏரியர்
  rationale: ஏரியிடமிருந்து வந்த சந்ததிக் குழுவைக் குறிக்கும் குடிப்பெயர்; தமிழில் ‘ஏரியர்’ என இயல்பாக வழங்கப்பட்டது.
theological_decisions: []
