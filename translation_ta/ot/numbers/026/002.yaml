  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களின்[b] முழுச் சபையையும் கணக்கெடுங்கள்[a]: இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்களையும், அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி[c], இஸ்ரவேலில் படைக்குப் புறப்படுகிற ஒவ்வொருவரையும்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘முழுச் சபையின் தலையை உயர்த்துங்கள்.’ இது ‘கணக்கெடுங்கள்’ என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர்களுடைய மூதாதையர் குடும்பங்களின்படி.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘இஸ்ரவேலில் படைப்பணிக்குத் தகுதியுள்ள ஒவ்வொருவரையும்.’ எபிரெயம் சொல்லர்த்தமாக, படைக்குப் புறப்படுவோரைக் குறிக்கிறது.
    reason: ambiguity
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: கணக்கெடுங்கள்
  rationale: சொல்லுக்குச் சொல், ‘தலையை உயர்த்துங்கள்’ என்று பொருள்படும் இந்த எபிரெய மரபுத்தொடர், இச்சூழலில் மக்கள்தொகைக் கணக்கெடுப்பதைக் குறிக்கிறது. நவீனத் தமிழில் அதன் பொருளை இயல்பாகத் தருவதற்காக ‘கணக்கெடுங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל עֲדַת
  choice: சபை முழுவதிலும்
  rationale: עֵדָה என்பது இங்கு இஸ்ரவேலின் ஒழுங்கமைந்த சமூகத்தைக் குறிக்கிறது. ‘சபை’ அதன் முறையான சமூகத் தன்மையைப் பேணுகிறது; ‘முழுவதிலும்’ என்பது கணக்கெடுப்பு அந்தச் சமூகமெங்கும் நடைபெறுவதைத் தெளிவாக்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லர்த்தம் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்பது அந்த வம்சச் சமூகத்தைக் குறிக்கும் இயல்பான, நிறுவப்பட்ட வடிவம். மூலத்தின் குடும்பவழிச் சொல்லாட்சி அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடையவர்கள்
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵּית אָב என்பது தந்தைவழி அமைந்த குடும்ப அல்லது குல அலகைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ அந்தச் சமூக அமைப்பைத் தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: כָּל יֹצֵא צָבָא
  choice: போருக்குச் செல்லும் ஒவ்வொருவரும்
  rationale: சொல்லர்த்தத்திற்கு நெருக்கமாக, படையுடன் போருக்குப் புறப்படுவோரைக் குறிக்கிறது. படைப்பணிக்குத் தகுதியுடையோர் என்ற சூழல்சார் பொருளை உரைக்குள் கட்டாயமாகச் சேர்க்காமல், மாற்று விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இஸ்ரவேல் சமூகத்திற்குள் போருக்குச் செல்வோரைச் சுட்டும் எளிய, நேரடியான வடிவம்.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினம் குறித்த குடும்பவழிச் சொல்லாட்சி
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’; சொல்லர்த்தமான ‘இஸ்ரவேலின் மகன்கள்’ அடிக்குறிப்பில்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இராணுவக் கணக்கெடுப்பு ஆண்களை நோக்கியிருந்தாலும், இத்தொடர் இஸ்ரவேல் சமூகத்துக்கான வழக்கமான இனக்குழுப் பெயராகவும் செயல்படுகிறது. தமிழில் இயல்பில்லாத சொல்லாட்சியைத் திணிக்காமல், மூலத்தின் ஆண்பால் குடும்ப வடிவத்தை அடிக்குறிப்பில் வெளிப்படையாகப் பேணுகிறது.
- issue: כָּל יֹצֵא צָבָא என்பது நிகழும் செயலைக் குறிக்கிறதா அல்லது இராணுவத் தகுதியைக் குறிக்கிறதா
  choice: போருக்குச் செல்லும் ஒவ்வொருவரும்
  alternative: படைப்பணிக்குத் தகுதியுள்ள ஒவ்வொருவரும்
  rationale: எபிரெயப் பங்கேற்புவினை சொல்லர்த்தமாக ‘படைக்குப் புறப்படுகிறவர்’ என்கிறது; சூழலில் அது இராணுவப் பணிக்குத் தகுதியுடையோரைக் குறிக்கலாம். முதன்மை உரை வெளிப்படையான சொல்லாட்சியைப் பேணுகிறது; செயல்தகுதி சார்ந்த வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
