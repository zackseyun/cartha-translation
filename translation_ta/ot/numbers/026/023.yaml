  terminology: ‘மகன்கள்’ என்பது בְּנֵי என்ற மரபுவழிப் பட்டியல் சொல்லுக்குப் பொருத்தமானது; ‘குலம்’ מִשְׁפָּחָה என்பதற்கான சரியான நிர்வாக/வம்சப் பிரிவு சொல். இசக்கார், தோலா, புவா, தோலாயர், பூனியர் ஆகிய பெயர்வடிவங்கள் மூல எபிரெய ஒலியமைப்பையும் வழக்கமான குலப்பெயர் வேறுபாட்டையும் போதுமான அளவு காக்கின்றன. அடிக்குறிப்பு புவா/பூவா என்ற தொடர்புடைய மாற்றெழுத்தைச் சரியாகக் குறிக்கிறது.
