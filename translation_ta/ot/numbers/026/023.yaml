source:
  edition: WLC
  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: ta
  text: 'இசக்காரின் மகன்கள், அவர்களுடைய குலங்களின்படி: தோலாவிடமிருந்து வந்த தோலாயர் குலம்; புவாவிடமிருந்து[a] வந்த பூனியர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடர்புடைய வேறு சில பகுதிகளிலும் மொழிபெயர்ப்புகளிலும் புவாவின் பெயர் “பூவா” என்று எழுதப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: இசக்காரின் மகன்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு சார்ந்த இந்த வம்சப்பட்டியலில் בְּנֵי என்பது நேரடி மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையும் கூட்டாகக் குறிக்கிறது. எனினும் எபிரெய வடிவத்தையும் பட்டியலின் நடையையும் காக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: இங்கு מִשְׁפָּחָה என்பது தனிக் குடும்பத்தைவிட, கோத்திரத்துக்குள் உள்ள வழித்தோன்றல் பிரிவான குலத்தைக் குறிக்கிறது.
- source_word: תּוֹלָע
  choice: தோலா
  rationale: இது தனிப்பட்ட பெயர்; அதன் பொதுப்பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: தோலாயர் குலம்
  rationale: הַתּוֹלָעִי என்பது தோலாவிலிருந்து வந்த வழித்தோன்றல் குலத்தைக் குறிக்கும் இனப்பெயர் வடிவம்; தமிழில் இயல்பாக ‘தோலாயர் குலம்’ என வழங்கப்பட்டது.
- source_word: לְפֻוָה
  choice: புவாவிடமிருந்து
  rationale: முன்னொட்டு לְ இங்கு ஒவ்வொரு குலத்தின் மூதாதையரை அறிமுகப்படுத்துகிறது. இவ்வசனத்தின் פֻוָה என்ற வடிவத்தை வேறுபடுத்திக் காட்ட ‘புவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: பூனியர் குலம்
  rationale: הַפּוּנִי என்பது புவாவின் வழித்தோன்றல் குலத்தைக் குறிக்கும் இனப்பெயர்; ‘பூனியர் குலம்’ அந்த உறவைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
