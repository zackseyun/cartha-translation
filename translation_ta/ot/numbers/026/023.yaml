translation_notes:
  register: நவீனத் தரத் தமிழில், மக்கள்தொகைக் கணக்கெடுப்புப் பட்டியலின் சுருக்கமான மற்றும் முறையான நடையைப் பேணுகிறது. ‘வந்த’ என்பது மூதாதையரிடமிருந்து உருவான குல உறவை இயல்பாக வெளிப்படுத்தச் சேர்க்கப்பட்டது; பெயர்களின் ஒலியெழுத்து வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
