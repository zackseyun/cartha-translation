    issue: Proper-name transliteration for Bela and Ashbel
    rationale: “பேலா” does not closely reflect בֶּלַע, and “அஸ்பேல்” both omits the Hebrew שׁ /sh/ consonant and changes the name's final vowel. “பெலா” and “அஷ்பேல்” better preserve the source names in Tamil.
