translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்பு மற்றும் வம்சப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணைப்பட்டியல் அமைப்பு அரைப்புள்ளிகளால் தெளிவாக்கப்பட்டுள்ளது; ‘குலம்’ என்பது கோத்திரத்துக்குள் உள்ள வம்சப் பிரிவைக் குறிக்கிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘Bela’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் ‘Ahiram’ என்ற உரை வேறுபாட்டைப் பற்றியது என்பதால் தமிழில் குறியீடு ‘அகிராம்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
