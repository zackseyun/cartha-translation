- from: 'பென்யமீனின் மகன்கள், அவர்களுடைய குலங்களின்படி: பேலாவிலிருந்து பேலாவியர் குலம்; அஸ்பேலிலிருந்து அஸ்பேலியர் குலம்; அகிராமிலிருந்து[a] அகிராமியர் குலம்.'
