base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: ta
  text: 'பென்யமீனின் மகன்கள் அவர்களுடைய குலங்களின்படி: பெலாவிலிருந்து பெலாவியர் குலம்; அஷ்பேலிலிருந்து அஷ்பேலியர் குலம்; அகிராமிலிருந்து[a] அகிராமியர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரெட்டிக் உரையில் இப்பெயர் ‘அகிராம்’ என்று உள்ளது; சில உரை மரபுகளிலும் மொழிபெயர்ப்புகளிலும் ‘அகியாம்’ என்று காணப்படுகிறது. முதன்மை உரை இங்குள்ள எபிரெய வாசகத்தைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ என்பதைக் காத்து, வம்சக் கணக்கெடுப்பின் பட்டியல் நடையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்துக்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது; ‘குலங்களின்படி’ என்பது கணக்கெடுப்புச் சூழலுக்கு இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: לְבֶלַע
  choice: பேலாவிலிருந்து
  rationale: முன்னொட்டு לְ இங்கு அந்தக் குலத்தின் மூதாதையையும் வம்சத் தோற்றத்தையும் அறிமுகப்படுத்துகிறது; தமிழில் ‘-விலிருந்து’ என்பது இந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: பேலாவியர் குலம்
  rationale: הַבַּלְעִי என்பது பேலாவிலிருந்து வந்த குலத்தாரைக் குறிக்கும் இன/வம்சப் பெயர்; ‘பேலாவியர்’ அதனை இயல்பான தமிழ்ப் பெயராக்கமாக வழங்குகிறது.
- source_word: לְאַשְׁבֵּל
  choice: அஸ்பேலிலிருந்து
  rationale: பட்டியலில் மூதாதை வழியிலான குலத் தோற்றத்தைக் குறிக்கும் לְ என்பதற்கு இணையாக ‘-இலிருந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: அஸ்பேலியர் குலம்
  rationale: அஸ்பேலிலிருந்து வந்த குலத்தாரைக் குறிக்கும் எபிரெய வம்சப்பெயரின் பொருளையும் பட்டியலின் இணை அமைப்பையும் காக்கிறது.
- source_word: לַאֲחִירָם
  choice: அகிராமிலிருந்து
  rationale: மசோரெட்டிக் உரையின் אֲחִירָם என்ற பெயரைப் பின்பற்றி ‘அகிராம்’ எனப் பெயர்த்து, לַ முன்னொட்டின் வம்சத் தோற்றப் பொருளை ‘-இலிருந்து’ என வழங்குகிறது.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: அகிராமியர் குலம்
  rationale: அகிராமின் வழிவந்த குலத்தாரைக் குறிக்கும் வம்சப்பெயரைத் தெளிவாகவும் சுற்றியுள்ள பட்டியல் அமைப்புக்கு இணையாகவும் வழங்குகிறது.
