translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘குலங்கள்’ என்பது கோத்திரத்தின் உறவுவழி உட்பிரிவுகளைத் தெளிவாகக் குறிக்கிறது; கணக்கெடுப்பு சார்ந்த எபிரெயச் சொற்றொடரின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
