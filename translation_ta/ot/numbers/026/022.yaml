base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/022.yaml
  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: ta
  text: யூதாவின் குலங்கள் இவையே; அவற்றில் கணக்கெடுக்கப்பட்டவர்கள் எழுபத்தாறாயிரத்து ஐந்நூறு பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணிக்கையின்படி.” இதற்கான எபிரேயச் சொற்றொடர், கணக்கெடுப்பில் பதிவு செய்யப்பட்ட அல்லது எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பல குலங்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயரை இயல்பான நவீனத் தமிழில் தருகிறது; ‘ஏ’ அழுத்தம் இது ஒரு சுருக்கக் கூற்று என்பதை உணர்த்துகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இங்கு தனிக் குடும்பங்களைக் காட்டிலும் ஒரு கோத்திரத்தின் உட்பிரிவுகளான உறவுவழிக் குழுக்களைக் குறிக்கிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்; இங்கு யூதா கோத்திரத்தைக் குறிக்கிறது.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் கணக்கெடுக்கப்பட்டவர்களின் எண்ணிக்கை
  rationale: פקד என்பதன் மக்கள்தொகைக் கணக்கெடுப்பு சார்ந்த பொருளையும், குலங்களைச் சேர்ந்தவர்களில் பதிவு செய்து எண்ணப்பட்டவர்களையே மொத்தம் குறிக்கிறது என்பதையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: எழுபத்தாறாயிரத்து ஐந்நூறு
  rationale: எபிரெய எண்ணின் மதிப்பான 76,500-ஐ நவீனத் தமிழின் வழக்கமான எண்ணமைப்பில் துல்லியமாகத் தருகிறது.
