  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: ta
  text: அரோதிலிருந்து[a] அரோதியரின் குலம்; அரேலியிலிருந்து அரேலியரின் குலம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: “அரோதுக்கு அரோதியரின் குலம்; அரேலிக்கு அரேலியரின் குலம்.” எபிரெய மொழியில் ஒவ்வொரு மூதாதையின் பெயருக்கும் முன் வரும் ל என்ற முன்னொட்டு, மக்கள்தொகைக் கணக்கெடுப்புக்குரிய சூத்திர நடையில் பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: அரோதிலிருந்து
  rationale: மக்கள்தொகைக் கணக்கெடுப்புக்குரிய இச்சூத்திரத்தில் ל முன்னொட்டு ஒவ்வொரு மூதாதையையும் அறிமுகப்படுத்துகிறது; அவரிடமிருந்து வந்த குலம் என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் ‘அரோதிலிருந்து’.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: கோத்திரத்துக்குள் உள்ள உறவுவழிக் குழுவை இச்சொல் குறிக்கிறது; இச்சூழலில் ‘குலம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאֲרוֹדִי
  choice: அரோதியரின்
  rationale: உறுப்புச்சொல்லுடன் வந்த இவ்வம்சப்பெயர் அரோதின் வழிவந்த கூட்டத்தைக் குறிக்கிறது; ‘அரோதியர்’ அதனைத் தமிழில் கூட்டுப் பெயராகக் காட்டுகிறது.
- source_word: לְאַרְאֵלִי
  choice: அரேலியிலிருந்து
  rationale: முதல் கூறைப் போலவே ל முன்னொட்டு குலத்தின் மூதாதையான அரேலியை அறிமுகப்படுத்துகிறது; இணையான வாக்கிய அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: הָאַרְאֵלִי
  choice: அரேலியரின்
  rationale: அரேலியின் வழிவந்த குலத்தாரைக் குறிக்கும் வம்சப்பெயர்; ‘அரேலியர்’ இயல்பான தமிழ்க் கூட்டுப் பெயராக அமைகிறது.
