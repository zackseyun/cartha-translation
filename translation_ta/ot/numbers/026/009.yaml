  naturalness: வரைவின் ‘...போராடியவர்கள் இவர்களே; அப்போது அவர்கள்...’ என்ற அமைப்பு மீளுரைப்பாகவும் காலத் தொடர்பு சற்றே தெளிவற்றதாகவும் உள்ளது. திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாகவும், மூலத்தின் அடையாளப்படுத்தும் வலியுறுத்தலையும் காக்கிறது.
