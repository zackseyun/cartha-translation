revisions:
- from: எலியாபின் மகன்கள் நெமுவேல், தாத்தான், அபிராம். சபையின் அழைப்பைப் பெற்றவர்களான[a] அந்தத் தாத்தானும் அபிராமும் இவர்கள்தான். கோராகின் கூட்டத்தாரோடு சேர்ந்து மோசேக்கும் ஆரோனுக்கும் எதிராகப் போராடியவர்கள் இவர்களே; அப்போது அவர்கள் யாவேக்கு எதிராகப் போராடினார்கள்.
  to: 'எலியாபின் மகன்கள்: நெமுவேல், தாத்தான், அபிராம். சபையால் அழைக்கப்பட்டவர்களான[a] அந்தத் தாத்தானும் அபிராமும் இவர்களே; அவர்கள் யாவேக்கு எதிராக மோதியபோது, கோரகின் கூட்டத்தில் மோசேக்கும் ஆரோனுக்கும் எதிராக மோதினார்கள்.'
  rationale: மூலத்தின் இரண்டு நபர்களை அடையாளப்படுத்தும் הוּא-வின் வலியுறுத்தல் ‘இவர்களே’ என்பதில் காக்கப்பட்டுள்ளது. נצה இருமுறையும் ‘மோதுதல்’ என மொழிபெயர்க்கப்பட்டு சொல்லியல் ஒற்றுமை தக்கவைக்கப்பட்டுள்ளது. யாவேக்கு எதிரான மோதலைக் குறிக்கும் காலப்பிரிவு, மோசேக்கும் ஆரோனுக்கும் எதிரான மோதலின் சூழலாகத் தெளிவுபடுத்தப்பட்டுள்ளது. அடிக்குறிப்பு மாற்று விளக்கத்தைத் தக்கவைக்கிறது.
