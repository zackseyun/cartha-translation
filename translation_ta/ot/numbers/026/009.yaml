source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: ta
  text: 'எலியாபின் மகன்கள்: நெமுவேல், தாத்தான், அபிராம். சபையால் அழைக்கப்பட்டவர்களான[a] அந்தத் தாத்தானும் அபிராமும் இவர்களே; அவர்கள் யாவேக்கு எதிராக மோதியபோது, கோரகின் கூட்டத்தில் மோசேக்கும் ஆரோனுக்கும் எதிராக மோதினார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சபையால் தேர்ந்தெடுக்கப்பட்டவர்கள்.”
    reason: கְרוּאֵי הָעֵדָה என்பது சொல்லுக்குச் சொல் ‘சபையின் அழைக்கப்பட்டவர்கள்’ எனப் பொருள்படும்; சூழலின்படி சபையால் தேர்ந்தெடுக்கப்பட்ட அல்லது அங்கீகரிக்கப்பட்ட பிரதிநிதிகள் என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וּבְנֵי
  choice: எலியாபின் மகன்கள்
  rationale: வம்சப்பட்டியலில் בנים ஆண் சந்ததியினரைச் சுட்டுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הוּא
  choice: இவர்கள்தான்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், இங்கு தாத்தான், அபிராம் என்ற இருவரையும் அடையாளப்படுத்தும் மீள்சுட்டாக வருகிறது; ‘தான்’ அதன் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: קרואי העדה
  choice: சபையின் அழைப்பைப் பெற்றவர்கள்
  rationale: קרא என்பதன் ‘அழைக்கப்பட்ட’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; அவர்கள் சபையால் அழைக்கப்பட்டவர்களா அல்லது தேர்ந்தெடுக்கப்பட்ட பிரதிநிதிகளா என்ற நுட்பத்தை முழுமையாகத் தீர்மானிக்கவில்லை.
- source_word: העדה
  choice: சபை
  rationale: இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கும் עֵדָה என்பதற்கு இச்சூழலில் இயல்பான, சுருக்கமான இணைச்சொல்.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: எதிராகப் போராடியவர்கள் / எதிராகப் போராடினார்கள்
  rationale: נצה குறிக்கும் மோதல், எதிர்ப்பு ஆகிய வலிமையை ‘போராடுதல்’ வெளிப்படுத்துகிறது; ஒரே எபிரெய வேர் இருமுறை வருவதால் தமிழிலும் அதே வினை மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: בַּעֲדַת קֹרַח
  choice: கோராகின் கூட்டத்தாரோடு சேர்ந்து
  rationale: கோராகுடன் தொடர்புடைய குழுவில் அல்லது கூட்டத்தில் அவர்கள் செயல்பட்டதைக் காட்டுகிறது; தனியான முறையான ‘சபை’ என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழாக்கமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: קרואי העדה என்பதன் பொருள்
  choice: சபையின் அழைப்பைப் பெற்றவர்கள்
  alternative: சபையில் தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: முதன்மை உரை ‘அழைக்கப்பட்ட’ என்ற சொற்பொருளைத் தக்கவைக்கிறது; அதிகாரப்பூர்வமாகத் தேர்ந்தெடுக்கப்பட்ட பிரதிநிதிகள் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: נצה என்பதன் எதிர்ப்புத் தன்மை
  choice: எதிராகப் போராடினர்
  alternative: எதிர்த்தனர்
  rationale: இந்தச் சொல் சாதாரண கருத்து வேறுபாட்டை விட வலுவான மோதலைக் குறிக்கிறது; அதேவேளை ‘கலகம் செய்தனர்’ எனக் குறிப்பிட்ட வகை அரசியல் அல்லது சமயப் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘அந்தத் தாத்தானும் அபிராமும் இவர்கள்தான்’ என்பது மூலத்தின் அடையாளப்படுத்தும் வலியுறுத்தலைப் பாதுகாக்கிறது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்புக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன.
