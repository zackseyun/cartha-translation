  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: ta
  text: 'மனாசேயின் மகன்கள்: மாகீரின் வழிவந்த மாகீரியரின் குலம்; மாகீர் கீலேயாத்துக்குத் தந்தையானான்; கீலேயாத்தின் வழிவந்த கீலேயாத்தியரின் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: மனாசேயின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடியான வம்சாவளிச் சொல்லாட்சியைப் பேணுகிறது; இக்கணக்கெடுப்புச் சூழலில் இது பரந்த சந்ததிவழியையும் குறிக்கக்கூடும்.
- source_word: לְמָכִיר ... מִשְׁפַּחַת הַמָּכִירִי
  choice: மாகீரிடமிருந்து மாகீரியரின் குலம் தோன்றியது
  rationale: לְ முன்னொட்டு இங்கு மாகீரின் வம்சக்கிளையை அறிமுகப்படுத்துகிறது. מִשְׁפָּחָה என்பதற்கு பழங்குடிக் கணக்கெடுப்புச் சூழலில் ‘குலம்’ பொருத்தமானது; இனப்பெயர் பன்மையாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: மாகீர் கீலேயாத்தைப் பெற்றான்
  rationale: הוֹלִיד என்பது ஆண் வம்சவழியில் ‘பெறச்செய்தான்/தந்தையானான்’ என்னும் பொருளுடைய வம்சாவளி வினை; ‘பெற்றான்’ நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் அதைப் பதிவு செய்கிறது.
- source_word: לְגִלְעָד ... מִשְׁפַּחַת הַגִּלְעָדִי
  choice: கீலேயாத்திடமிருந்து கீலேயாத்தியரின் குலம் தோன்றியது
  rationale: முந்தைய மாகீர் வம்சக்கிளையோடு உள்ள எபிரெய இணை அமைப்பைப் பேணி, கீலேயாத்திலிருந்து வந்த குலத்தைத் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்பு மற்றும் வம்சாவளிக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இணை வாக்கிய அமைப்பு அரைப்புள்ளிகளால் பேணப்பட்டுள்ளது; ‘குடும்பம்’ என்பதற்குப் பதிலாக பழங்குடியின் உட்பிரிவைக் குறிக்கும் ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது.
