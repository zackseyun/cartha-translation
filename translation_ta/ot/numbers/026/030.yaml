source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: ta
  text: 'கிலேயாத்தின் மகன்கள்[a] இவர்களே: ஈயேசேரிடமிருந்து ஈயேசேரியர் குலம்; ஏலேக்கிடமிருந்து ஏலேக்கியர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிலேயாத்தின் மகன்கள்” என்பது உடனடிப் புதல்வர்களை மட்டுமல்லாமல், ஆண் வழிவந்த சந்ததியினரையோ கிலேயாத்தின் வழிவந்த குலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: எபிரெயச் சுட்டுப்பெயர் காலத்தைக் குறிக்காததால், பட்டியலை இயல்பாக அறிமுகப்படுத்தும் தமிழ்ச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי גִלְעָד
  choice: கிலேயாத்தின் மகன்கள்
  rationale: மூலத்தின் மரபுவழிச் சொல்லமைப்பு தக்கவைக்கப்பட்டது; இச்சூழலில் இது உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஆண் வழிவந்தோரையும் குலத் தலைவர்களையும் குறிக்கலாம்.
- source_word: אִיעֶזֶר
  choice: ஈயேசேர்
  rationale: தனிப்பெயர் அதன் எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: எண்ணாகமம் 26-இன் மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில், கோத்திரத்தின் உட்பிரிவைக் குறிக்க நவீனத் தமிழில் ‘குலம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאִיעֶזְרִי
  choice: ஈயேசேரியர்
  rationale: ஈயேசேரிடமிருந்து வந்த குலத்தாரைக் குறிக்கும் இன/குல அடைமொழி தமிழில் இயல்பான மக்கள் பெயராக வழங்கப்பட்டது.
- source_word: לְחֵלֶק
  choice: ஏலேக்கிடமிருந்து
  rationale: மீளும் கணக்கெடுப்புச் சூத்திரத்தில் לְ அந்தப் பெயருடைய மூதாதையுடன் குலத்தின் தொடர்பை அறிமுகப்படுத்துகிறது; தமிழில் வம்சத் தோற்றத்தைத் தெளிவாக்க ‘-இடமிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: הַחֶלְקִי
  choice: ஏலேக்கியர்
  rationale: ஏலேக்கின் வழிவந்த குலத்தாரைக் குறிக்கும் பெயர் தமிழில் இயல்பான வடிவில் கொடுக்கப்பட்டது.
