  source_fidelity: 'எபிரெயக் கணக்கெடுப்பு வாய்பாட்டின் வம்ச உட்பிரிவு அமைப்பு துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: பெரீயாவின் மகன்கள் என்ற தலைப்பின்கீழ் ஏபேர் மற்றும் மல்கியேல் வழிவந்த இரு குலங்கள் இணையான முறையில் தரப்பட்டுள்ளன. ‘-இடமிருந்து’ என்பது இச்சூழலில் לְ முன்னொட்டின் வம்சத் தோற்றப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.'
