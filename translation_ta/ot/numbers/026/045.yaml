source:
  edition: WLC
  text: לִ/בְנֵ֣י בְרִיעָ֔ה לְ/חֶ֕בֶר מִשְׁפַּ֖חַת הַֽ/חֶבְרִ֑י לְ/מַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַ/מַּלְכִּיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: ta
  text: 'பெரீயாவின் மகன்களில்: ஏபேரிடமிருந்து ஏபேரியர் குலம்; மல்கியேலிடமிருந்து மல்கியேலியர் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: மகன்களில்
  rationale: கணக்கெடுப்புப் பட்டியலின் உட்பிரிவைக் குறிக்கும் ל முன்னொட்டையும், בְּנֵי என்பதன் வம்சவரிசை வடிவத்தையும் இயல்பான தமிழில் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: בְרִיעָה
  choice: பெரீயா
  rationale: எபிரெயத் தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְ/חֶבֶר
  choice: ஏபேரிடமிருந்து
  rationale: இந்தக் கணக்கெடுப்பு வாய்பாட்டில் ל என்பது பெயரிடப்பட்ட மூதாதையிடமிருந்து வந்த வம்சக் கிளையைக் குறிக்கிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இங்கு இச்சொல் கோத்திரத்தின் கீழுள்ள உறவுமுறை சார்ந்த வம்ச உட்பிரிவைக் குறிக்கிறது; தமிழில் ‘குலம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַֽ/חֶבְרִי
  choice: ஏபேரியர்
  rationale: ஏபேரிடமிருந்து வந்தவர்களைக் குறிக்கும் எபிரெய வம்சப்பெயரைத் தமிழின் ‘-இயர்’ வடிவில் வழங்குகிறது.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: மல்கியேலிடமிருந்து
  rationale: பெயரிடப்பட்ட மூதாதையிடமிருந்து தோன்றிய வம்சக் கிளை என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: மல்கியேலியர்
  rationale: மல்கியேலிடமிருந்து வந்த குலத்தாரைக் குறிக்கும் வம்சப்பெயரைத் தமிழில் தெளிவாகக் காட்டுகிறது.
