  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: ta
  text: செபுலோனியரின் குலங்கள் இவையே. அவர்களில் எண்ணப்பட்டவர்கள் 60,500 பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பட்டியலின் முடிவில் குலங்களைச் சுட்டிக்காட்டும் பன்மைச் சுட்டுப்பெயர்; ‘இவையே’ என்பது எபிரெயச் சுருக்கக் கூற்றின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இங்கு தனிக் குடும்பங்களையல்ல, கோத்திரத்திற்குள் உள்ள விரிவான உறவுமுறைக் குழுக்களைக் குறிக்கிறது.
- source_word: הַזְּבוּלֹנִי
  choice: செபுலோனியரின்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு செபுலோனிடமிருந்து வந்த மக்களைத் தொகையாகக் குறிக்கிறது; உடைமை வேற்றுமை ‘குலங்கள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் மக்கள்தொகைக் கணக்கெடுப்புப் பொருளையும், அந்தக் குழுவிலிருந்து கணக்கிடப்பட்ட உறுப்பினர்களைக் குறிக்கும் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 60,500 பேர்
  rationale: எண்ணிக்கையை நவீனத் தமிழில் உடனடியாகப் புரியும் இலக்க வடிவில் தருகிறது; ‘பேர்’ மனிதர்களின் கணக்கெடுப்பு என்பதைத் தெளிவாக்குகிறது.
