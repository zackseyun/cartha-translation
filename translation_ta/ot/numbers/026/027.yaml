translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குலங்கள்’ மற்றும் ‘எண்ணப்பட்டவர்கள்’ ஆகியவை மூலத்தின் சமூக அமைப்பையும் கணக்கெடுப்பு மொழியையும் காக்கின்றன.
