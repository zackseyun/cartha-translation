source:
  edition: WLC
  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: ta
  text: சீட்டினால் மட்டுமே நாடு பங்கிடப்பட வேண்டும்; அவர்கள் தங்கள் தந்தையரின் கோத்திரங்களின் பெயர்களின்படி சுதந்தரமாகப் பெறுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால் ... -ஏ
  rationale: இங்கு אַךְ பங்கீட்டின் முறையை வரையறுத்து வலியுறுத்துகிறது. தமிழில் முன்சூழலுடனான மாறுபாட்டை ‘ஆனால்’ காட்ட, தனிப்படுத்தும் ‘-ஏ’ சீட்டுப்போடுதல் மட்டுமே முறை என்பதைக் காட்டுகிறது.
- source_word: בְּגוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: גוֹרָל என்பது பங்கீட்டுத் தீர்மானத்திற்குப் பயன்படுத்தப்பட்ட சீட்டைக் குறிக்கிறது; கருவிப் பொருளுடைய בְּ-ஐ இயல்பான தமிழில் வினையெச்சமாக மொழிபெயர்க்கிறது.
- source_word: יֵחָלֵק
  choice: பங்கிடப்பட வேண்டும்
  rationale: חלק என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தக்கவைத்து, இங்கு கட்டளையுணர்வுடைய எதிர்காலத்தை ‘வேண்டும்’ எனத் தெளிவாக்குகிறது.
- source_word: אֶת הָאָרֶץ
  choice: நாடு
  rationale: இது இஸ்ரவேலர் உரிமைபெறவிருந்த குறிப்பிட்ட நாட்டைக் குறிக்கிறது; சூழலில் ‘நாடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לִשְׁמוֹת
  choice: பெயர்களின்படி
  rationale: לִ இங்கு அளவுகோல் அல்லது குறிப்புச் சார்பை உணர்த்துகிறது; ‘பெயர்களின்படி’ அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַטּוֹת
  choice: கோத்திரங்கள்
  rationale: இச்சூழலில் מַטּוֹת என்பது கோல்கள் அல்ல, இஸ்ரவேலின் குலப்பிரிவுகளைக் குறிக்கிறது; வேதாகமத் தமிழில் புரியக்கூடிய ‘கோத்திரங்கள்’ பொருத்தமானது.
- source_word: אֲבֹתָם
  choice: தங்கள் தந்தையரின்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவர்களுடைய தந்தையர்’ என்று கூறி, தந்தைவழி மரபைச் சுட்டுகிறது; பாலினம் குறித்த மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: יִנְחָלוּ
  choice: உரிமைபெற வேண்டும்
  rationale: נחל என்பது பரம்பரை உரிமையாகப் பெறுதல் அல்லது உடைமையாக்குதல்; ‘உரிமைபெற’ சுருக்கமாகவும் இச்சூழலுக்கு இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: אֲבֹתָם என்பதில் தந்தைவழி மரபைக் குறிக்கும் பாலினச் சொல்
  choice: தங்கள் தந்தையரின்
  alternative: தங்கள் மூதாதையரின்
  rationale: மூலம் பொதுவான முன்னோர்களை மட்டும் சொல்லாமல் ஆண்பால் வடிவத்தில் தந்தைவழிக் கோத்திர மரபைக் குறிப்பிடுகிறது. ஆகவே அந்த வரலாற்று மற்றும் சட்டப் பின்னணியை முதன்மை உரையில் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘சீட்டுப்போட்டே’ என்பது אַךְ-ன் தனிப்படுத்தும் வலிமையை இயல்பாகக் காட்டுகிறது; ‘கோத்திரம்’ மட்டும் வேதாகம-வரலாற்றுச் சூழலுக்குத் தேவையான மரபுசார் சொல்லாக வைக்கப்பட்டுள்ளது.
