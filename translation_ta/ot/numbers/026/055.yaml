revisions:
- from: ஆனால், சீட்டுப்போட்டே நாடு பங்கிடப்பட வேண்டும்; அவர்கள் தங்கள் தந்தையரின் கோத்திரங்களுடைய பெயர்களின்படி உரிமைபெற வேண்டும்.
  to: சீட்டினால் மட்டுமே நாடு பங்கிடப்பட வேண்டும்; அவர்கள் தங்கள் தந்தையரின் கோத்திரங்களின் பெயர்களின்படி சுதந்தரமாகப் பெறுவார்கள்.
  rationale: The revision removes the unwarranted adversative “ஆனால்,” expresses the exclusive instrumental force of אַךְ בְּגוֹרָל as “சீட்டினால் மட்டுமே,” retains the passive allocation of the land, preserves the paternal reference in אֲבֹתָם, and renders יִנְחָלוּ as a future reception of inheritance rather than an obligation. No footnote is necessary in Tamil because “தந்தையர்” already preserves the source’s paternal wording; an optional lexical note could be added editorially if the project requires one, but it is not required for fidelity.
  reviewer_model: gpt-5.6-terra
