base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: ta
  text: 'குலங்களின்படி கணக்கில் பதிவுசெய்யப்பட்ட லேவியர் இவர்கள்: கெர்சோனின் வழிவந்த கெர்சோனியர் குலம்; கோகாத்தின் வழிவந்த கோகாத்தியர் குலம்; மெராரியின் வழிவந்த மெராரியர் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקוּדֵי
  choice: எண்ணிப் பதிவுசெய்யப்பட்டவர்கள்
  rationale: פקד என்பதன் இவ்வடிவம் வெறும் எண்ணிக்கை நடவடிக்கையை அல்ல, மக்கள்தொகைக் கணக்கெடுப்பில் எண்ணப்பட்டு பதிவுசெய்யப்பட்ட நபர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் konkreete பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: הַלֵּוִי
  choice: லேவி
  rationale: இங்கு ஒருமை வடிவம் குலமுதல்வரான லேவியையும் அவரிடமிருந்து வந்த கோத்திர அடையாளத்தையும் குறிக்கிறது; ஆகவே தலைப்புச் சொற்றொடரில் ‘லேவி’ எனவே வைக்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களின் குலங்களின்படி
  rationale: מִשְׁפָּחָה இத்தகைய கணக்கெடுப்பு மற்றும் கோத்திரச் சூழலில் நவீன அணுக்குடும்பத்தைவிட விரிவான குலப் பிரிவைக் குறிக்கிறது.
- source_word: לְגֵרְשׁוֹן
  choice: கெர்சோனிலிருந்து
  rationale: לְ இங்கு கெர்சோனுடனான வம்சத் தொடர்பை அறிமுகப்படுத்துகிறது. ‘இலிருந்து’ என்பது அவரிடமிருந்து தோன்றிய குலம் என்ற பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியர் குலம்
  rationale: இனப்பெயர் வடிவம் கெர்சோனின் வழிவந்த குழுவைக் குறிக்கிறது; ‘கெர்சோனியர் குலம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִקְהָת
  choice: கோகாத்திலிருந்து
  rationale: முந்தைய பெயரைப் போலவே இங்கும் வம்சத் தொடர்பைக் குறிக்கும் לְ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: கோகாத்தியர் குலம்
  rationale: கோகாத்தின் வழிவந்த குலக்குழுவைக் குறிக்கும் இனப்பெயர் வடிவத்துக்கு இயல்பான தமிழ் இணை.
- source_word: לִמְרָרִי
  choice: மெராரியிலிருந்து
  rationale: மற்ற இரு பெயர்களைப் போல வம்சத் தோற்றத்தைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: மெராரியர் குலம்
  rationale: மெராரியின் வழிவந்த குலக்குழுவைக் குறிக்கும் இனப்பெயர் வடிவத்தைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: וְ சுற்றியுள்ள கணக்கெடுப்பு உரையுடன் தொடர்ச்சியை ஏற்படுத்துகிறது; தமிழில் வாக்கிய ஓட்டத்திற்கேற்ப இணைப்புப் பொருள் இயல்பாக உட்பொதிக்கப்பட்டு, אֵלֶּה என்பதன் சுட்டுப்பொருள் ‘இவர்களே’ என வழங்கப்பட்டது.
