translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்பு மற்றும் வம்சப் பட்டியல் சூழலுக்கேற்ற மரியாதையான எளிய நடை பயன்படுத்தப்பட்டது. ‘குடும்பம்’ என்பதற்குப் பதிலாக சமூகத்தின் விரிவான உட்பிரிவைக் குறிக்கும் ‘குலம்’ தேர்ந்தெடுக்கப்பட்டது; பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டன.
