translation_notes:
  register: சுருக்கமான கணக்கெடுப்புப் பட்டியல் நடையைப் பேணியுள்ளோம். ‘குடும்பம்’ என்பதைவிட உறவுவழியான உட்பிரிவைத் துல்லியமாகக் காட்ட ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் אַשְׂרִיאֵל என்பதன் மெய்யெழுத்து שׂ (/s/) என்பதால் ‘அஸ்ரியேல்’ என வழங்கப்பட்டுள்ளது; ஆங்கில ஆலோசனை உரையின் ‘Ashriel’ வடிவம் அப்படியே பின்பற்றப்படவில்லை.
