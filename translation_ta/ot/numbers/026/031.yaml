  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: ta
  text: அஸ்ரியேலிடமிருந்து அஸ்ரியேலியரின் குலம்; சேகேமிடமிருந்து சேகேமியரின் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: அஸ்ரியேல்
  rationale: எபிரெயப் பெயரில் உள்ள שׂ என்பது /s/ ஒலியைக் குறிக்கிறது; எனவே தமிழில் ‘அஸ்ரியேல்’ என்று ஒலிபெயர்ப்பது மூல வடிவுக்கு நெருக்கமானது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: மக்கள்தொகைக் கணக்கீட்டு மற்றும் வம்சப் பட்டியல் சூழலில், ஒரு கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவை இச்சொல் குறிக்கிறது; நவீனத் தமிழில் ‘குலம்’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: הָאַשְׂרִיאֵלִי
  choice: அஸ்ரியேலியர்
  rationale: அஸ்ரியேலின் வழிவந்தவர்களைக் கூட்டாகக் குறிக்கும் இனவழிப் பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: இணையான இரண்டு பட்டியல் கூறுகளைத் தமிழ் நடையில் அரைப்புள்ளி இயல்பாக இணைக்கிறது; எபிரெய இணைப்புச் சொல்லின் பட்டியல் செயல்பாடு இதனால் வெளிப்படுகிறது.
- source_word: שֶׁכֶם
  choice: சேகேம்
  rationale: இங்கு இடப்பெயராக அல்லாமல் மூதாதையின் தனிப்பெயராக வரும் எபிரெய வடிவின் நேரடி ஒலிபெயர்ப்பு.
- source_word: הַשִּׁכְמִי
  choice: சேகேமியர்
  rationale: சேகேமின் வழிவந்தவர்களைக் கூட்டாகக் குறிக்கும் இனவழிப் பெயராக மொழிபெயர்க்கப்பட்டது.
