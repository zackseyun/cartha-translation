  register: நவீனத் தரத் தமிழில், மக்கள்தொகைக் கணக்கெடுப்புச் சூழலைத் தெளிவாக வெளிப்படுத்தும் கண்ணியமான நடை. எபிரெய மொழியின் வினையற்ற சுருக்கக் கூற்றை இயல்பான இரு தமிழ் வாக்கியங்களாக வழங்குகிறது.
