  language: en
  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: ta
  text: இவை இசக்காரின் குலங்கள்; அவர்களிலிருந்து கணக்கிடப்பட்டவர்களின் எண்ணிக்கை[a] அறுபத்து நான்காயிரத்து முந்நூறு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கணக்கின்படி” அல்லது “அவர்களுடைய பதிவின்படி.” எபிரெயச் சொற்றொடர், இந்தக் குலங்களிலிருந்து கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: பலர்பால் சுட்டுப்பெயர்; இங்கு அடுத்துவரும் இசக்கார் குலத்தினரைக் குறிக்கிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலத்தினர்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் கோத்திரச் சூழலில், ஒரு கோத்திரத்திற்குள் உள்ள விரிவான உறவுக் குழுக்களைக் குறிக்கிறது; நவீன தமிழில் ‘குலத்தினர்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்களின் எண்ணிக்கை
  rationale: פקד வேரிலிருந்து வந்த இச்சொல், இக்குலங்களிலிருந்து மக்கள்தொகைக் கணக்கில் பதிவு செய்யப்பட்டவர்களின் மொத்த எண்ணிக்கையைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: அறுபத்து நான்காயிரத்து முந்நூறு
  rationale: எபிரெய எண்ணின் மதிப்பான 64,300-ஐ இயல்பான நவீன தமிழ் எண்ணமைப்பில் தருகிறது.
