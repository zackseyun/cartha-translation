translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்று நடைக்கு ஏற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மரிக்கவில்லை’ என்பதற்குப் பதிலாக பொதுவாக எளிதில் புரியும் ‘சாகவில்லை’ பயன்படுத்தப்பட்டது; மூலத்தின் இணைப்புச்சொல்லிலுள்ள சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
