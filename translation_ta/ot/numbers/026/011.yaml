  text: But the sons of Korah did not die[a].
translation:
  language: ta
  text: ஆனால் கோராவின் மகன்கள் இறக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோராவின் மகன்களோ இறக்கவில்லை.” எபிரெய இணைப்புச்சொல்லை எளிய தொடர்பாகவும் புரிந்துகொள்ளலாம்; முதன்மை உரையிலுள்ள “ஆனால்” என்பது முந்தைய சூழலில் கூறப்பட்ட மரணங்களோடு உள்ள வேறுபாட்டை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ஆனால் ... மகன்கள்
  rationale: ו பொதுவாக ‘மற்றும்’ என்று பொருள்படும்; எனினும் முந்தைய வசனத்தில் கூறப்பட்ட மரணங்களுடன் உள்ள எதிர்மறை வேறுபாட்டைச் சூழல் காட்டுவதால், முதன்மை உரையில் ‘ஆனால்’ இயல்பாக உள்ளது. בְנֵי என்பதற்கு வம்சவரலாற்றுச் சூழலில் வழக்கமான ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: קֹרַח
  choice: கோராக்
  rationale: தனிப்பட்ட பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; உடைமைத் தொடர்பைக் காட்ட ‘கோராகின்’ என உருபேற்றப்பட்டது.
- source_word: לֹא
  choice: இல்லை
  rationale: எபிரெய மறுப்பு, வினையுடன் சேர்ந்து இயல்பான தமிழ் இறந்தகால மறுப்பு வடிவமான ‘சாகவில்லை’யில் வெளிப்படுத்தப்பட்டது.
- source_word: מֵתוּ
  choice: சாகவில்லை
  rationale: מות என்பதன் அடிப்படைப் பொருள் ‘சாகுதல்/இறத்தல்.’ சுருக்கமான வரலாற்றுக் குறிப்பில் ‘சாகவில்லை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
