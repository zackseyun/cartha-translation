base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ta
  text: ஏனெனில், யெகோவா அவர்களைக் குறித்து “அவர்கள் வனாந்தரத்தில் நிச்சயமாகச் சாவார்கள்”[a] என்று சொல்லியிருந்தார்; எப்புன்னேயின் மகன் காலேபையும் நூனின் மகன் யோசுவாவையும் தவிர, அவர்களில் ஒருவரும் மீந்திருக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சாகவே சாவார்கள்”; இது மரணம் நிச்சயம் என்பதை வலியுறுத்தும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அவர்களிலிருந்து ஒரு மனிதனும் மீந்திருக்கவில்லை.” இங்கு “ஒரு மனிதன்” என்பது ஒருவர்கூட இல்லை என்ற பகிர்நிலைப் பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்க/காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயர்வடிவத்தில் வழங்குகிறது.
- source_word: אָמַר ... לָהֶם
  choice: அவர்களைக் குறித்து ... சொல்லியிருந்தார்
  rationale: இங்கு לָהֶם என்பது அந்த மக்களைக் குறித்த இறைத்தீர்ப்பைக் காட்டுகிறது; சொல்லியிருந்தார் என்பது கணக்கெடுப்பின் முடிவுக்கு முன்பே உரைக்கப்பட்டதைக் காலவரிசையில் தெளிவாக்குகிறது.
- source_word: מוֹת יָמֻתוּ
  choice: நிச்சயமாகச் சாவார்கள்
  rationale: வினையெச்ச முழுவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலரின் பயணச் சூழலில் מִדְבָּר என்பதற்குரிய மரபான, புரிந்துகொள்ளத்தக்க தமிழ் வேதாகமச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: அவர்களில் ஒருவரும் மீந்திருக்கவில்லை
  rationale: אִישׁ என்பதன் பகிர்நிலை ஒருமைப் பொருளான ‘ஒருவர்கூட இல்லை’ என்பதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: முந்தைய எதிர்மறைக் கூற்றிலிருந்து இரண்டு விதிவிலக்குகளை அறிமுகப்படுத்தும் சொற்றொடரின் பொருளைத் தருகிறது.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபு
  rationale: தனிப்பெயர்களை வழக்கமான தமிழ் வடிவில் வழங்கி, בֶּן உறவை ‘மகன்’ என இயல்பாக மொழிபெயர்க்கிறது.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தனிப்பெயர்களை வழக்கமான தமிழ் வடிவில் வழங்கி, தந்தை-மகன் உறவைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே வழங்க வேண்டும்; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு, ஆனால் ‘யெகோவா’ பொதுத் தமிழ் வாசகர்களுக்கு நன்கு அறிமுகமான வடிவம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வனாந்தரம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் காக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப மறுசீரமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
