  yaml_path: translation/ot/numbers/026/014.yaml
  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: ta
  text: 'சிமியோனியரின் குலங்கள் இவையே: இருபத்திரண்டாயிரத்து இருநூறு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: கணக்கெடுப்புச் சுருக்கத்தை அறிமுகப்படுத்தும் சுட்டுப்பெயர்; எபிரெய பெயர்ச்சொல் வாக்கியத்தின் நிகழ்கால முன்வைப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இங்கு ஒரு கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவுகளைக் குறிக்கிறது; பொதுவான ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ துல்லியமானது.
- source_word: הַשִּׁמְעֹנִי
  choice: சிமியோனியரின்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் கூட்டாகச் சிமியோனின் கோத்திரத்தாரைக் குறிக்கிறது; தமிழ் உடைமைத் தொடர் அடுத்துள்ள ‘குலங்கள்’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: இருபத்திரண்டாயிரத்து இருநூறு பேர்
  rationale: 22,200 என்ற கணக்கை நவீனத் தமிழின் இயல்பான எண்ணமைப்பில் தருகிறது; மனிதர்களின் கணக்கெடுப்பு என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
