translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குலங்கள்’ என்பது கோத்திரத்தின் உட்பிரிவுகளைத் தெளிவுபடுத்துகிறது; வசனச் சூழலில் எண்ணிக்கை மனிதர்களைக் குறிக்கும் என்பதை ‘பேர்’ இயல்பாக வெளிப்படுத்துகிறது.
