revisions:
- from: 'நப்தலியின் மகன்கள், அவர்களுடைய குலங்களின்படி: யக்செயேலிடமிருந்து யக்செயேலியர் குலம்; கூனியிடமிருந்து கூனியர் குலம்.'
  to: 'நப்தலியின் மகன்கள், அவர்களுடைய குலங்களின்படி: யக்செயேலிடமிருந்து யக்செயேலியரின் குலம்; கூனியிடமிருந்து கூனியரின் குலம்.'
  rationale: A minimal grammatical revision adds the Tamil genitive marker to both gentilic clan expressions. This preserves the Hebrew genealogy-list formula, the source meaning, and the draft’s concise register.
  reviewer_model: gpt-5.6-terra
