translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்பு பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணுகிறது. எபிரெய வாக்கியத்தின் இணை அமைப்பும் அரைப்புள்ளியால் பாதுகாக்கப்பட்டுள்ளது; தனிப்பெயர்கள் மூல எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
