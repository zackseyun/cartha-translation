  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: ta
  text: 'நப்தலியின் மகன்கள், அவர்களுடைய குலங்களின்படி: யக்செயேலிடமிருந்து யக்செயேலியரின் குலம்; கூனியிடமிருந்து கூனியரின் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்கள்
  rationale: எபிரெயக் கட்டிணை வடிவமான ‘நப்தலியின் மகன்கள்’ என்பதை நேரடியாகப் பாதுகாக்கிறது; இங்கு வம்சவழியினரை அறிமுகப்படுத்தும் இயல்பான தமிழ் தொடர்.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு சூழலில் מִשְׁפָּחָה என்பது தனிக் குடும்பத்தைவிடப் பெரிய வம்சக் குழுவைக் குறிப்பதால் ‘குலம்’ பொருத்தமானது; לְ இன் வகைப்படுத்தும் பொருளை ‘இன்படி’ வெளிப்படுத்துகிறது.
- source_word: לְיַחְצְאֵל
  choice: யக்செயேலிடமிருந்து
  rationale: முன்னோர் ஒருவரிலிருந்து குலம் தோன்றிய வம்சத் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: யக்செயேலியர் குலம்
  rationale: எபிரெய இனப்பெயர் வடிவம் தனிநபரை அல்ல, யக்செயேலின் வழிவந்த கூட்டத்தைக் குறிப்பதால் ‘யக்செயேலியர்’ என்ற கூட்டுப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: לְגוּנִי
  choice: கூனியிடமிருந்து
  rationale: முந்தைய தொடரைப் போலவே, குலத்தின் மூதாதையிடமிருந்து வந்த வம்ச உறவைக் குறிக்கிறது.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: கூனியர் குலம்
  rationale: இனப்பெயர் வடிவத்தைத் தமிழில் இயல்பான கூட்டுப் பெயராக வழங்கி, கூனியின் வழிவந்த குலத்தைக் குறிக்கிறது.
