  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: ta
  text: 'சூத்தேலாவின் மகன்கள் இவர்களே[a]: ஏரானின் வழியில் ஏரானியர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல், “சூத்தேலாவின் மகன்கள் இவர்கள்: ஏரானுக்கு, ஏரானியர் குலம்.” இங்கு “மகன்கள்” என்பது வம்சவரலாற்று வழக்கில் வழித்தோன்றல்களையோ குலவழிகளையோ குறிக்கிறது; உடனடிப் பிறப்பில் மகன்களை மட்டும் குறிக்க வேண்டியதில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவர்களே
  rationale: இந்தச் சொற்றொடர் கணக்கெடுப்புப் பட்டியலின் அடுத்த உட்பிரிவை அறிமுகப்படுத்துகிறது. தமிழில் பட்டியல் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; தொடக்க וְ தனியே ‘மற்றும்’ என்று மொழிபெயர்க்கப்படாமல் சூழலில் உணர்த்தப்படுகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய வம்சவரலாற்று மரபுத்தொடரை முறையாகப் பாதுகாக்கிறது. இங்கு உடனடிப் பிறப்பில் மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையோ குலவழிகளையோ குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: שׁוּתָלַח
  choice: சூத்தெலா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகவும் இயல்பாகவும் எழுத்துப்பெயர்க்கிறது.
- source_word: לְ/עֵרָן
  choice: ஏரானிலிருந்து வந்த
  rationale: இங்குள்ள לְ குல உட்பிரிவின் மூதாதை அல்லது தோற்றுவாயை அறிமுகப்படுத்துகிறது. ‘ஏரானுக்கு’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட இந்தத் தமிழ் நடை உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: எண்ணாகமக் கணக்கெடுப்புச் சூழலில் ஒரு கோத்திரத்திற்குள் உள்ள உறவுவழி உட்பிரிவைத் துல்லியமாகக் குறிக்கிறது.
- source_word: הָ/עֵרָנִי
  choice: ஏரானியர்
  rationale: ஏரானிடமிருந்து தோன்றியதாகப் பெயர்பெற்ற கூட்டத்தைக் குறிக்கும் எபிரெய வம்சப்பெயரைத் தமிழில் இயல்பான மக்கள் பெயராக வழங்குகிறது.
