  source_fidelity: மூல எபிரெயத்தின் பட்டியல் அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. מִשְׁפָּחָה என்பதற்கு ‘குலம்’ பொருத்தமானது; ஐந்து வழித்தோன்றல்-குலப் பெயர்களும் சரியாக வழங்கப்பட்டுள்ளன. הוֹלִיד என்ற ஆண் மரபுப்பட்டியல் வினை ‘பெற்றான்’ எனத் தெளிவாக உள்ளது. இறுதி வாவ் இணைப்பைத் தனிச் சொல்லாகச் சேர்க்காமல் இரு வாக்கியங்களின் தொடர்ச்சியால் வெளிப்படுத்துவது தமிழில் இயல்பானது; பொருள் இழப்பு இல்லை.
  naturalness: நவீனத் தரத் தமிழில் வாசிப்பு இயல்பாக உள்ளது. ‘இவை லேவியின் குலங்கள்’ என்ற அறிமுகமும், இரட்டிக்கப்படும் ‘…யரின் குலம்’ பட்டியல் வடிவமும் தெளிவான மரபுப்பட்டியல் நடையைத் தருகின்றன. பெயர்களின் ‘-யர்’ வடிவம் வழித்தோன்றல் குழுக்களைக் குறிப்பதற்கு ஒத்திசைவாக உள்ளது.
  terminology: ‘குலம்’ என்பது கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவைச் சுட்டுவதற்கு ஏற்ற சொல்; அடிக்குறிப்பு அதன் மாற்றுப் பொருள்களையும் சமூகச் சூழலையும் தெளிவுபடுத்துகிறது. லேவி, கேகாத், அம்ராம் மற்றும் குலப்பெயர்கள் ஒலிபெயர்ப்பாக ஒரே முறையில் உள்ளன.
