source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: ta
  text: 'இவை லேவியின் குலங்கள்[a]: லிப்னியரின் குலம், எப்ரோனியரின் குலம், மக்லியரின் குலம், மூசியரின் குலம், கோராகியரின் குலம். கேகாத் அம்ராமைப் பெற்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடும்பங்கள்’ அல்லது ‘குடும்பக் குழுக்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் מִשְׁפָּחָה ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: குலங்கள் / குலம்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் கோத்திர மரபியல் சூழலில், இது ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது. நவீன அணுக்குடும்பத்தைவிட விரிவான இவ்வமைப்பைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘குலம்’ தெரிவிக்கிறது.
- source_word: לֵוִי
  choice: லேவி
  rationale: கோத்திர மூதாதையின் இயற்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַלִּבְנִי
  choice: லிப்னியர்
  rationale: லிப்னியுடன் தொடர்புடைய வழித்தோன்றல் குழுவைக் குறிக்கும் இன/குல அடைமொழி; தமிழில் ‘-யர்’ வடிவம் அந்தக் குழுவை இயல்பாகக் குறிக்கிறது.
- source_word: הַחֶבְרֹנִי
  choice: எப்ரோனியர்
  rationale: எப்ரோனுடன் தொடர்புடைய வழித்தோன்றல் குலத்தைக் குறிக்கும் பெயராக இணையான வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: הַמַּחְלִי
  choice: மக்லியர்
  rationale: மக்லியின் வழித்தோன்றல் குழுவைக் குறிக்கும் குலப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמּוּשִׁי
  choice: மூசியர்
  rationale: மூசியின் வழித்தோன்றல் குழுவைக் குறிக்கும் குலப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: הַקָּרְחִי
  choice: கோராகியர்
  rationale: கோராகின் வழித்தோன்றல் குழுவைக் குறிக்கும் குலப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וּקְהָת
  choice: கேகாத்
  rationale: இணைப்பிடைச்சொல் தொடர்ச்சியான வாக்கிய அமைப்பால் இயல்பாக வெளிப்படுவதால் தனியாக ‘மேலும்’ என்று சேர்க்கப்படவில்லை; இயற்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִד
  choice: பெற்றான்
  rationale: மரபுப்பட்டியல் சூழலில் ஆண் வழியாகப் பிறப்பித்தல் அல்லது தந்தையானதைக் குறிக்கும் ஹிஃபில் வடிவம். ‘பெற்றான்’ இயல்பான நவீனத் தமிழில் தந்தை-மகன் மரபுறவைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: אֶת עַמְרָם
  choice: அம்ராமை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு தமிழில் ‘-ஐ’ வேற்றுமையால் வெளிப்படுத்தப்பட்டது; இயற்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֵלֶּה
  choice: இவை
  rationale: எபிரெயத்தில் வினையில்லாத சுட்டுத் தொடர்; தமிழிலும் ‘இவை’ என்ற இயல்பான அடையாளப்படுத்தும் அமைப்பு தேவையற்ற காலவினையைச் சேர்க்காமல் பொருளைத் தருகிறது.
