translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய எண்ணிக்கைப் பதிவின் மீள்வாக்கிய அமைப்பு திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; ஒரே மூலத்தொடரான לְמִשְׁפְּחֹתָם இரு இடங்களிலும் ‘அவர்களுடைய குலங்களின்படி’ என ஒரேவிதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
