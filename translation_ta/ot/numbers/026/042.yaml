  text: אֵ֤לֶּה בְנֵי דָן֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/שׁוּחָ֕ם מִשְׁפַּ֖חַת הַ/שּׁוּחָמִ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת דָּ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: ta
  text: 'தாணின் மகன்கள், அவர்களுடைய குலங்களின்படி, இவர்கள்: சூகாமின் வழிவந்த சூகாமியர் குலம். தாணின் குலங்களின்படி இவையே.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי דָן
  choice: தாணின் மகன்கள் இவர்களே
  rationale: בְנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ பாதுகாக்கப்படுகிறது; אֵלֶּה என்பதன் சுட்டுப் பொருள் இயல்பான தமிழ் வாக்கிய அமைப்பில் ‘இவர்களே’ என வழங்கப்படுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: எண்ணிக்கைப் பதிவின் சூழலில் מִשְׁפָּחָה என்பது தனிக் குடும்பத்தைவிடப் பெரிய கோத்திர உட்பிரிவான குலத்தைக் குறிக்கிறது. எபிரெய உரையில் இருமுறை வரும் இத்தொடர் தமிழிலும் இருமுறை ஒரேவிதமாகப் பாதுகாக்கப்படுகிறது.
- source_word: לְשׁוּחָם
  choice: சூகாமிலிருந்து
  rationale: இந்த வம்சப்பட்டியல் சூத்திரத்தில் לְ என்பது சூகாமை முன்னோராகக் கொண்ட வழிமுறையைச் சுட்டுகிறது; ‘சூகாமிலிருந்து’ என்பது அந்த உறவைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: சூகாமியர் குலம்
  rationale: ஒருமை நிலைச்சொல்லும் இன/வம்சப் பெயரும் சேர்ந்து சூகாமிடமிருந்து வந்த கூட்டுக் குலத்தைக் குறிக்கின்றன; ‘சூகாமியர் குலம்’ இயல்பான தமிழில் அந்தக் கூட்டுப் பொருளை வழங்குகிறது.
- source_word: מִשְׁפְּחֹת דָּן
  choice: தாணின் குலங்கள்
  rationale: சுருக்கக் கூற்றின் அமைப்பையும், வசனம் முழுவதும் מִשְׁפָּחָה என்பதற்குப் பயன்படுத்திய ‘குலம்’ என்ற சொல்லின் ஒருமைப்பாட்டையும் பாதுகாக்கிறது.
