base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: ta
  text: மோசேயும் ஆசாரியரான எலெயாசாரும் மோவாபின் சமவெளிகளில், எரிகோவுக்கு அருகே யோர்தான் ஆற்றருகில் இஸ்ரவேலின் மகன்களைக்[a] கணக்கிட்டவர்கள் இவர்களே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்” அல்லது “இஸ்ரவேல் மக்கள்.” எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எரிகோவுக்கு எதிரே யோர்தான் ஆற்றருகில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: கணக்கிடப்பட்டவர்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்ட நபர்களைக் குறிக்கும் பெயரெச்ச வடிவம். அருவமான ‘கணக்கெடுப்பு’ என்பதற்குப் பதிலாக நபர்களையே நேரடியாகக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியரான
  rationale: எபிரெய உரையில் இருப்பது ‘ஆசாரியர்’ என்பதே; சூழலின் அடிப்படையில் ‘தலைமை ஆசாரியர்’ என்ற கூடுதல் பட்டம் சேர்க்கப்படவில்லை.
- source_word: פָּקְדוּ
  choice: கணக்கிட்ட
  rationale: פְּקוּדֵי என்பதோடு ஒரே வேர்ச்சொல்லைச் சேர்ந்ததால், கணக்கெடுப்புச் சூழலில் சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் இயன்றவரை காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால், வம்சவழி அமைப்பைத் தக்கவைக்கிறது; இந்த எபிரெய மரபுத்தொடரின் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: இப்புவியியல் தொடரில் עֲרָבוֹת என்பது சமவெளிகள் அல்லது திறந்த புல்வெளிகளைக் குறிக்கிறது; ‘சமவெளிகள்’ தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே யோர்தான் ஆற்றருகே
  rationale: யோர்தானுக்கு அருகிலும் எரிகோவுக்கு எதிர்ப்புறத்திலும் இருந்த இடத்தைக் குறிக்கும் புவியியல் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது; தொடரின் சுருக்கத்தால் மற்றொரு வாசிப்பும் சாத்தியம்.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் மற்றும் உடன்படிக்கை வம்சத்தைக் குறிக்கும் தொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் இலக்கண ஆண்பாலையும் வம்சவழிச் சாயலையும் பொதுமைப்படுத்தாமல் காக்கிறது; இந்த மரபுத்தொடர் முழு இஸ்ரவேல் மக்களையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: எலெயாசாரின் அதிகாரப்பூர்வ பட்டம்
  choice: ஆசாரியர்
  alternative: தலைமை ஆசாரியர்
  rationale: எபிரெய உரை ‘ஆசாரியர்’ என்று மட்டுமே கூறுவதால், சூழலிலிருந்து பெறப்படும் விரிவான பட்டம் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள ‘கணக்கிடப்பட்டவர்கள்/கணக்கிட்ட’ என்ற சொல் மறுபயன்பாடு காக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தை ஒரே தமிழ்வாக்கியமாக வைத்திருந்தாலும், இடவியல் கூறுகள் முதலில் அமைக்கப்பட்டதால் வாசிப்பு தெளிவாகிறது.
