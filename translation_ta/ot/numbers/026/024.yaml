  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: ta
  text: யாசூபிலிருந்து யாசூபியர் குலம்; சிம்ரோனிலிருந்து சிம்ரோனியர் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: யாசூபிலிருந்து
  rationale: இந்த மக்கள்தொகைக் கணக்குப் பட்டியலில் לְ என்பது குலம் பெயர்பெற்ற மூதாதையைக் குறிக்கிறது. தமிழில் ‘-இலிருந்து’ என்பது அவரிடமிருந்து தோன்றிய குலம் என்ற உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவை இச்சொல் குறிக்கிறது; இந்த நிர்வாக-வம்சாவளிச் சூழலில் ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ துல்லியமானது.
- source_word: הַ/יָּשׁוּבִי
  choice: யாசூபியர்
  rationale: யாசூபின் வழிவந்த குழுவைக் குறிக்கும் இனக்குழுப் பெயரைத் தமிழில் ‘-இயர்’ வடிவம் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְ/שִׁמְרֹן
  choice: சிம்ரோனிலிருந்து
  rationale: முதல் தொடரைப் போலவே, לְ என்பது குலம் பெயர்பெற்ற மூதாதையைக் குறிக்கிறது; இணை அமைப்பைக் காக்க ‘-இலிருந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இரண்டாவது குலத்திற்கும் அதே வம்ச-நிர்வாகப் பொருள் உள்ளதால் ஒரே சொல்லாக்கம் தொடர்கிறது.
- source_word: הַ/שִּׁמְרֹנִי
  choice: சிம்ரோனியர்
  rationale: சிம்ரோனின் வழிவந்த குலத்தைக் குறிக்கும் இனக்குழுப் பெயரைத் தமிழில் இயல்பான ‘-இயர்’ வடிவில் வழங்குகிறது.
