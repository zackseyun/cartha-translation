base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: ta
  text: எண்ணிக்கையில் அதிகமானவர்களுக்கு அவர்களுடைய சுதந்தரப் பங்கை அதிகப்படுத்த வேண்டும்; எண்ணிக்கையில் குறைவானவர்களுக்கு அவர்களுடைய சுதந்தரப் பங்கைக் குறைக்க வேண்டும். ஒவ்வொருவருக்கும், அவரவருடைய கணக்கெடுப்பு எண்ணிக்கைக்கு ஏற்ப, சுதந்தரப் பங்கு கொடுக்கப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒவ்வொருவருக்கும், அவரிடம் கணக்கெடுக்கப்பட்டவர்களுக்கு ஏற்ப” என்று ஆண்பால் ஒருமை வடிவம் உள்ளது. இச்சூழலில் இது ஒவ்வொரு கோத்திரம் அல்லது குலக் குழுவின் கணக்கெடுப்பு எண்ணிக்கைக்கு ஏற்ப அதன் சுதந்தரப் பங்கு வழங்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: எண்ணிக்கையில் அதிகமான குழுவுக்கு
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் சூழலில் רַב என்பது அதிக எண்ணிக்கையுள்ள கோத்திர அல்லது குலக் குழுவைக் குறிக்கிறது. தமிழில் ஒப்பீட்டுப் பொருளைத் தெளிவாகக் காட்ட இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: அதன் சுதந்தரப் பங்கை அதிகமாகக் கொடுக்க வேண்டும்
  rationale: רבה என்பதன் causative பொருள் ‘அதிகமாக்குதல்.’ நிலப் பங்கீட்டுச் சூழலில் இயல்பான தமிழுக்காக ‘பங்கை அதிகமாகக் கொடுக்க வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְלַמְעַט
  choice: எண்ணிக்கையில் குறைவான குழுவுக்கு
  rationale: מְעַט இங்கு குறைந்த எண்ணிக்கையுள்ள குழுவைக் குறிக்கிறது; கணக்கெடுப்புடன் உள்ள தொடர்பை ‘எண்ணிக்கையில்’ என்பது வெளிப்படுத்துகிறது.
- source_word: תַּמְעִיט נַחֲלָתוֹ
  choice: அதன் சுதந்தரப் பங்கைக் குறைவாகக் கொடுக்க வேண்டும்
  rationale: מעט என்பதன் causative வடிவம் பங்கைச் சிறிதாக்குவதைக் குறிக்கிறது. விகிதாசார நிலப்பங்கீட்டை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נַחֲלָה
  choice: சுதந்தரப் பங்கு
  rationale: இச்சொல் உரிமையாகப் பெறப்படும் நிலத்தையும் ஒதுக்கப்பட்ட உடைமைப் பங்கையும் குறிக்கிறது. ‘சுதந்தரப் பங்கு’ உரிமையையும் பங்கீட்டையும் ஒருங்கே காட்டுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொரு குழுவுக்கும்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமையான אִישׁ பகிர்ந்தளிக்கும் பொருளில் வருகிறது. உடனுள்ள சூழலும் ஒருமைச் சுட்டுப்பெயர்களும் கணக்கிடப்பட்ட ஒவ்வொரு சமூக அலகையும் பிரதிநிதித்துவப்படுத்துவதால், தமிழில் பொருளைத் தெளிவாக்க ‘ஒவ்வொரு குழுவுக்கும்’ என வழங்கப்பட்டது.
- source_word: לְפִי פְקֻדָיו
  choice: அதில் கணக்கெடுக்கப்பட்டவர்களின் எண்ணிக்கைக்கு ஏற்ப
  rationale: לְפִי என்பது ‘அளவுக்கு ஏற்ப/விகிதப்படி’ என்றும் פְקֻדָיו கணக்கெடுக்கப்பட்டவர்களையும் குறிக்கிறது. சுருக்கமான எபிரெயச் சொற்றொடரின் விகிதாசாரப் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: יֻתַּן
  choice: கொடுக்கப்பட வேண்டும்
  rationale: נתן என்பதன் passive வடிவமான இதன் அடிப்படைப் பொருள் ‘கொடுக்கப்படுதல்.’ கட்டளையின் தேவையைத் தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ மற்றும் ஒருமைச் சுட்டுப்பெயர்கள் யாரைக் குறிக்கின்றன என்பது
  choice: மக்கள்தொகைக் கணக்கெடுப்பில் இடம்பெற்ற ஒவ்வொரு கோத்திர அல்லது குலக் குழுவையும் பிரதிநிதித்துவமாகக் குறிக்கின்றன என முதன்மை உரையில் வெளிப்படுத்தப்பட்டது.
  alternative: ‘ஒவ்வொருவனுக்கும், அவனிடத்தில் கணக்கிடப்பட்டவர்களுக்கு ஏற்ப’ என்று இலக்கண ஒருமையை நேரடியாகப் பேணுதல்.
  rationale: தனிநபர்களுக்கு நிலம் வழங்கப்படுவதாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க எண்ணாகமம் 26:53–56 இன் குழு அடிப்படையிலான பங்கீட்டுச் சூழல் தெளிவாக்கப்பட்டது; அதேவேளை மூலத்தின் இலக்கண வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘குழு’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் கணக்கெடுப்பு மற்றும் நிலப்பங்கீட்டுச் சூழலை இயல்பாகத் தெரிவிக்கிறது. ‘சுதந்தரப் பங்கு’ என்பது வெறும் உடைமையை விட உரிமையுடன் ஒதுக்கப்படும் நிலப்பங்கைக் காட்டுகிறது.
