- from: எண்ணிக்கையில் அதிகமான குழுவுக்கு அதன் சுதந்தரப் பங்கை அதிகமாகவும், எண்ணிக்கையில் குறைவான குழுவுக்கு அதன் சுதந்தரப் பங்கைக் குறைவாகவும் கொடுக்க வேண்டும். ஒவ்வொரு குழுவுக்கும், அதில் கணக்கெடுக்கப்பட்டவர்களின் எண்ணிக்கைக்கு ஏற்ப அதன் சுதந்தரப் பங்கு கொடுக்கப்பட வேண்டும்.[a]
  to: எண்ணிக்கையில் அதிகமானவர்களுக்கு அவர்களுடைய சுதந்தரப் பங்கை அதிகப்படுத்த வேண்டும்; எண்ணிக்கையில் குறைவானவர்களுக்கு அவர்களுடைய சுதந்தரப் பங்கைக் குறைக்க வேண்டும். ஒவ்வொருவருக்கும், அவரவருடைய கணக்கெடுப்பு எண்ணிக்கைக்கு ஏற்ப, சுதந்தரப் பங்கு கொடுக்கப்பட வேண்டும்.[a]
