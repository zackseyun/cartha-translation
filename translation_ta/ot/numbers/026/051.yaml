  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: ta
  text: 'இஸ்ரவேலின் மகன்களாகிய[a] கணக்கெடுக்கப்பட்டவர்கள்[b] இவர்கள்: ஆறு இலட்சத்து ஆயிரத்து எழுநூற்று முப்பது பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்.” சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பதிவு செய்யப்பட்டவர்கள்”; எபிரெயச் சொல் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: பன்மையில் சுட்டிக்காட்டி, கணக்கெடுக்கப்பட்ட நபர்களின் மொத்தத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக இணைப்பு வினை தேவையில்லை.
- source_word: פְּקוּדֵי
  choice: மக்கள்தொகைக் கணக்கில் பதிவு செய்யப்பட்டவர்கள்
  rationale: פקד என்பதன் இச்சூழலிலான பொருள், வெறும் எண்ணிக்கையை அல்லாமல் கணக்கெடுப்பில் பதிவுசெய்யப்பட்ட நபர்களைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களில்
  rationale: எபிரெய மொழியின் குடும்ப உறவைக் குறிக்கும் சொல்லாட்சியைப் பேணுகிறது; இங்கு அது தேசத்தைச் சேர்ந்த கணக்கெடுக்கப்பட்ட ஆண்களைச் சுட்டுகிறது.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: ஆறு இலட்சத்து ஆயிரத்து எழுநூற்று முப்பது
  rationale: எபிரெய எண்ணின் கூட்டல் அமைப்பைப் பின்பற்றி மொத்தமான 601,730-ஐ இயல்பான தமிழ் எண் வடிவில் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்களில்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற குடும்பச் சொல்லாட்சியையும் இக்கணக்கெடுப்பின் ஆண் சார்ந்த சூழலையும் மறைக்காமல் பேணுகிறது.
- issue: மக்கள்தொகைக் கணக்குச் சூழலில் פְּקוּדֵי என்பதன் பொருள்
  choice: மக்கள்தொகைக் கணக்கில் பதிவு செய்யப்பட்டவர்கள்
  alternative: எண்ணப்பட்டவர்கள் / கணக்கெடுப்பின் மொத்தம்
  rationale: இது வெறும் சுருக்க எண்ணிக்கையைவிட, கணக்கெடுப்பில் பதிவான நபர்களைக் குறிக்கும் எபிரெய பயன்பாட்டை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்தொகைக் கணக்கு’ என்பது census என்ற சூழலைத் தெளிவாக்குகிறது; மூலத்தின் நபர் சார்ந்த பொருளைப் பேண ‘பதிவு செய்யப்பட்டவர்கள்’ என வழங்கப்பட்டுள்ளது.
