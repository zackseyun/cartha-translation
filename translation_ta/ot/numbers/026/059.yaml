base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: ta
  text: அம்ராமின் மனைவியின் பெயர் யோகெபெத்; அவள் லேவியின் மகள்[a], எகிப்தில் லேவிக்குப் பிறந்தவள்[b]. அவள் அம்ராமுக்கு ஆரோனையும் மோசேயையும், அவர்களுடைய சகோதரியான மிரியாமையும் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “லேவியின் மகள்.” மரபுப்பட்டியல் சூழல்களில் “மகள்” என்பது சில வேளைகளில் பெண் சந்ததியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் நேரடியாக, “எகிப்தில் அவளை லேவிக்குப் பெற்றெடுத்தவள்.” பெற்றெடுத்த பெண் யார் என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: அம்ராமின் மனைவியின் பெயர்
  rationale: எபிரேய இணைப்புச்சொல்லைத் தமிழில் தனியாக மொழிபெயர்க்காமல், பெயரை அறிமுகப்படுத்தும் மரபுத்தொடரை இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: יוֹכֶבֶד
  choice: யோகெபெத்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת לֵוִי
  choice: லேவியின் மகள்
  rationale: ‘மகள்’ என்ற நேரடியான உறவுமுறையைப் பிரதான உரையில் தக்கவைத்து, மரபுப்பட்டியல் சூழலில் இருக்கக்கூடிய விரிவான பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: எகிப்தில் லேவிக்குப் பிறந்தவள்
  rationale: மூலத்தில் பெற்றெடுத்த பெண் வெளிப்படையாகக் குறிப்பிடப்படாததால், தமிழில் இயல்பான செயலப்பாட்டு வடிவத்தைப் பயன்படுத்தி கூடுதல் நபரைச் சேர்க்காமல் பொருளைக் காக்கிறது.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: அவள் அம்ராமுக்கு … பெற்றெடுத்தாள்
  rationale: יָלַד வினைச்சொல்லின் பெற்றெடுத்தல் பொருளையும், לְ மூலம் குறிக்கப்படும் தந்தை/கணவர் உறவையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: ஆரோனையும் மோசேயையும், அவர்களுடைய சகோதரியான மிரியாமையும்
  rationale: மூன்று பெயர்களையும் நேரடிப் பொருள்களாக வழங்கி, மிரியாமை ஆரோன் மற்றும் மோசேயின் சகோதரி எனக் குறிப்பிடும் எபிரேயப் பின்னிணைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘லேவியின் மகள்’ என்பதன் மரபுப்பட்டியல் பொருள்
  choice: பிரதான உரையில் ‘லேவியின் மகள்’ என்ற நேரடி வாசகத்தைத் தக்கவைத்தல்
  alternative: ‘லேவியின் பெண் வழித்தோன்றல்’
  rationale: காலவரிசை அல்லது வம்சவரிசைச் சிக்கலை மொழிபெயர்ப்பிலேயே தீர்க்காமல், மூலத்தின் நேரடியான உறவுமுறைச் சொல்லை வாசகருக்கு முன்வைக்கிறது; விரிவான பயன்பாடு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- issue: יָלְדָה வினையின் மறைந்த எழுவாய்
  choice: ‘எகிப்தில் லேவிக்குப் பிறந்தவள்’ என்ற செயலப்பாட்டு வடிவம்
  alternative: ‘அவளை எகிப்தில் லேவிக்கு அவள் பெற்றெடுத்தாள்’
  rationale: எபிரேயத்தில் பெற்றெடுத்த பெண் யார் என்பது சொல்லப்படவில்லை. செயலப்பாட்டு வடிவம் பெயரிடப்படாத தாயை ஊகித்து சேர்க்காமல் கருத்தை இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மரபுப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகள்’ என்ற மூலத்தின் பதற்றமுள்ள நேரடி சொல்லாட்சி பிரதான உரையில் பாதுகாக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளது.
