- from: 'பேரேசின் மகன்கள்: எஸ்ரோனிடமிருந்து எஸ்ரோனியர் குலம்; ஆமூலிடமிருந்து ஆமூலியர் குலம்.'
  to: 'பேரேஸின் மகன்கள்: எஸ்ரோனிடமிருந்து எஸ்ரோனியர் குலம்; ஆமூலிடமிருந்து ஆமூலியர் குலம்.'
  rationale: A minimal orthographic correction changes ‘பேரேசின்’ to ‘பேரேஸின்.’ The translation otherwise faithfully and naturally conveys the Hebrew census formula, its named descendants, and their clans.
