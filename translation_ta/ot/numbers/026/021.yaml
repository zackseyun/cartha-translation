id: NUM.26.21
reference: Numbers 26:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: ta
  text: 'பேரேஸின் மகன்கள்: எஸ்ரோனிடமிருந்து எஸ்ரோனியர் குலம்; ஆமூலிடமிருந்து ஆமூலியர் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: பேரேசின் மகன்கள்
  rationale: இது வம்சக் கணக்குப் பட்டியலை அறிமுகப்படுத்தும் எளிய இணைப்புச் சொற்றொடர். தமிழில் பட்டியல் அமைப்பே ‘இவர்கள்’ அல்லது ‘இருந்தார்கள்’ என்பதன் பொருளை இயல்பாக வெளிப்படுத்துவதால், சுருக்கமாக ‘பேரேசின் மகன்கள்:’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: פֶרֶץ
  choice: பேரேஸ்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: לְחֶצְרֹן
  choice: எஸ்ரோனிடமிருந்து
  rationale: இங்குள்ள לְ குலத்தின் தோற்றம் அல்லது வம்சவழித் தொடர்பைக் குறிக்கிறது; ‘எஸ்ரோனிடமிருந்து’ என்பது அந்தக் குலம் அவரிடமிருந்து வந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கில் இந்தச் சொல் ஒரு கோத்திரத்திற்குள் உள்ள வம்சவழிக் குழுவைக் குறிக்கிறது; அதற்கு இயல்பான தமிழ் இணை ‘குலம்’.
- source_word: הַחֶצְרֹנִי
  choice: எஸ்ரோனியர்
  rationale: எஸ்ரோனிடமிருந்து வந்தவர்களைக் குறிக்கும் வம்சப்பெயர்; தமிழில் குழுவைக் குறிக்கும் ‘-இயர்’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְחָמוּל
  choice: ஆமூலிடமிருந்து
  rationale: முன்னைய பெயரைப் போலவே, לְ இங்கு வம்சத் தோற்றத்தைக் குறிக்கிறது; ‘ஆமூலிடமிருந்து’ என்பது பட்டியலின் உறவைத் தெளிவுபடுத்துகிறது.
- source_word: הֶחָמוּלִי
  choice: ஆமூலியர்
  rationale: ஆமூலிடமிருந்து வந்த குலத்தாரைக் குறிக்கும் வம்சப்பெயராக இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள்தொகைக் கணக்கின் சுருக்கமான பட்டியல் நடையைப் பேணும் கண்ணியமான உரை. பெயர்கள் எபிரெய மூலத்தின் ஒலியமைப்பை முன்னிறுத்தி ஒலிபெயர்க்கப்பட்டுள்ளன; ‘குலம்’ என்பது கோத்திரத்தின் உட்பிரிவான உறவுக் குழுவைக் குறிக்கிறது.
