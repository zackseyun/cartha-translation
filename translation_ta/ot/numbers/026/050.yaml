source:
  edition: WLC
  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם וּ/פְקֻ֣דֵי/הֶ֔ם חֲמִשָּׁ֧ה וְ/אַרְבָּעִ֛ים אֶ֖לֶף וְ/אַרְבַּ֥ע מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: ta
  text: இவையே நப்தலியின் குலங்கள், அவரவர் குலங்களின்படி; அவர்களில் எண்ணப்பட்டவர்கள் நாற்பத்தைந்தாயிரத்து நானூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: சுருக்கக் கூற்றை அறிமுகப்படுத்தும் எபிரெயப் பன்மைச் சுட்டுப்பெயரை இயல்பான தமிழில் வலியுறுத்தலுடன் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: முழுக் கோத்திரத்துக்குள் உள்ள விரிவான உறவுமுறைப் பிரிவுகளை இது குறிக்கிறது; வீட்டுக் குடும்பங்கள் என்ற குறுகிய பொருளைத் தவிர்க்க ‘குலங்கள்’ பொருத்தமானது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: எபிரெயப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: לְ முன்னொட்டு இங்கு கணக்கெடுப்பில் குலவாரியான வகைப்பாட்டைக் குறிக்கிறது; ‘குலங்களின்படி’ அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்புச் சூழலிலான பொருளைத் தனிநபர்களைக் குறிக்கும் வகையில் தருகிறது; இந்தச் சொற்றொடரில் நேரடியாக இல்லாத ‘ஆண்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: நாற்பத்தைந்தாயிரத்து நானூறு பேர்
  rationale: எண்ணிக்கையை இயல்பான தமிழ் வரிசையில் தருகிறது; எண்ணப்பட்ட மனிதர்களைக் குறிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள ‘குலங்கள்—குலங்களின்படி’ என்ற மீளுரைத்தல் தகவல் அமைப்பின் ஒரு பகுதியாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது.
