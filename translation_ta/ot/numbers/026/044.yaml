translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பட்டியல் நடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. தனிப்பெயர்கள் மசோரா எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; குலப்பெயர்களுக்கு இயல்பான தமிழ் மக்கள்குழு விகுதி பயன்படுத்தப்பட்டுள்ளது.
