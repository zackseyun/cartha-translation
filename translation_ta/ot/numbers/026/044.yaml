  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: ta
  text: 'ஆசேரின் மகன்கள், அவர்களுடைய குலங்களின்படி[a]: இம்னாவின் வழியாக இம்னியர் குலம்; இஸ்வியின் வழியாக இஸ்வியர் குலம்; பெரீயாவின் வழியாக பெரீயர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் நேரடியாக ‘குடும்பங்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்குள்ள மக்கள் கணக்கெடுப்புச் சூழலில் அது கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: ஆசேரின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேர்ப்பொருள் ‘மகன்கள்’. இங்கு அது குலங்களைத் தொடங்கிய ஆண் வழிச் சந்ததியினரை அறிமுகப்படுத்தும் மரபுவழிப் பட்டியல் சொல்லாட்சியாக இருப்பதால், அந்த வடிவம் பாதுகாக்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: எண்ணிக்கைக் கணக்கெடுப்பின் சூழலில் מִשְׁפָּחָה என்பது ஒரு கோத்திரத்துக்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது; நவீனத் தமிழில் ‘குடும்பங்கள்’ என்பது மிகக் குறுகிய பொருளைத் தரக்கூடும்.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: இம்னாவிலிருந்து / இஸ்வியிலிருந்து / பெரீயாவிலிருந்து
  rationale: இந்தத் திரும்பத் திரும்ப வரும் மரபுவழிப் பட்டியல் அமைப்பில் לְ முன்னொட்டு, பெயரிடப்பட்ட முன்னோரிடமிருந்து உருவான குலத்தை அறிமுகப்படுத்துகிறது. ‘—விலிருந்து’ என்பது அந்த உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִשְׁפַּחַת הַיִּמְנָה / מִשְׁפַּחַת הַיִּשְׁוִי / מִשְׁפַּחַת הַבְּרִיעִי
  choice: இம்னியர் குலம் / இஸ்வியர் குலம் / பெரீயர் குலம்
  rationale: எபிரெயச் சொற்கள் முன்னோரின் பெயரிலிருந்து உருவான குலப்பெயர்கள். தமிழில் ‘-யர்’ வடிவம் மக்கள்குழுவைக் குறிக்கும் இயல்பான வடிவமாகவும், ‘குலம்’ census சூழலுக்குப் பொருத்தமான சொல்லாகவும் உள்ளது.
