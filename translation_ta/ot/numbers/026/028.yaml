translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள்தொகைக் கணக்குப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. ‘குலங்களின்படி’ என்பது மூலத்தின் முறையான வகைப்படுத்தல் மொழியை இயல்பாகக் காக்கிறது; ஆகவே தனி அடிக்குறிப்பு தேவையில்லை.
