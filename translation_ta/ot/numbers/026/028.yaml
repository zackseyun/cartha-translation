  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: ta
  text: 'யோசேப்பின் மகன்கள், அவர்களுடைய குலங்களின்படி: மனாசே மற்றும் எப்பிராயீம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் இணைநிலைப் பன்மை வடிவம். வம்ச மற்றும் மக்கள்தொகைக் கணக்குச் சூழலில், முறையான உறவுமொழியைத் தெளிவாகக் காக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெய தனிப்பெயருக்கு நவீனத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கிலும் கோத்திர அமைப்பிலும் מִשְׁפָּחָה என்பது குறுகிய ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ என்பதைக் குறிக்கிறது; לְ முன்னொட்டு வகைப்படுத்தலைக் குறிக்கும் ‘-இன்படி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: וְאֶפְרָיִם
  choice: மற்றும் எப்பிராயீம்
  rationale: இணைப்பிடைச்சொல்லையும் தனிப்பெயரையும் நேரடியாகப் பிரதிபலித்து, யோசேப்பின் இரு மகன்கள் அல்லது கோத்திரக் கிளைகளின் இணைப்பைக் காட்டுகிறது.
