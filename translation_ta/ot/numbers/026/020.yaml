translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலின் ஒத்திசைவு மற்றும் சுருக்கமான அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘குடும்பம்’ என்பதற்குப் பதிலாக சமூக-வம்சப் பிரிவைக் குறிக்கும் ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற ஆங்கில மரபு எழுத்துப்பெயர் மாற்றங்கள் அடிக்குறிப்பாகச் சேர்க்கப்படவில்லை.
