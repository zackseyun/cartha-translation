  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: ta
  text: 'யூதாவின் மகன்வழிச் சந்ததியினர், அவர்களுடைய குலங்களின்படி, இவ்வாறு இருந்தனர்: சேலாவிலிருந்து வந்த சேலானியர் குலம்; பேரேசிலிருந்து வந்த பேரேசியர் குலம்; சேராவிலிருந்து வந்த சேராகியர் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי יְהוּדָה
  choice: யூதாவின் வழிவந்தவர்கள்
  rationale: בְנֵי என்பதன் அடிப்படைப் பொருள் ‘மகன்கள்’ என்றாலும், இந்த மக்கள்தொகைக் கணக்கெடுப்பில் ஆண் வழித்தோன்றல்களாக அமைந்த குலத்தாரைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் சூழற்பொருளைத் தெளிவாகக் காட்ட ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு தனிக் குடும்பத்தை அல்ல, கோத்திரத்திற்குட்பட்ட குலப் பிரிவைக் குறிக்கிறது; לְ-இன் வகைப்படுத்தும் பொருளை ‘-இன்படி’ வெளிப்படுத்துகிறது.
- source_word: לְשֵׁלָה
  choice: சேலாவிடமிருந்து
  rationale: முன்னோரிடமிருந்து தோன்றிய வம்சத் தொடர்பை இங்குள்ள לְ குறிக்கிறது; தமிழில் ‘-விடமிருந்து’ அந்தத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: சேலானியர் குலம்
  rationale: பெயரிலிருந்து உருவான குலப்பெயரையும் מִשְׁפַּחַת என்ற குலக் குறிப்பையும் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: לְפֶרֶץ / מִשְׁפַּחַת הַפַּרְצִי
  choice: பேரேசிடமிருந்து பேரேசியர் குலம்
  rationale: פֶרֶץ என்பதன் எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘பேரேஸ்’ என்றும், அதிலிருந்து உருவான குலப்பெயரை ‘பேரேசியர்’ என்றும் ஒலிபெயர்க்கிறது.
- source_word: לְזֶרַח / מִשְׁפַּחַת הַזַּרְחִי
  choice: சேராவிடமிருந்து சேராகியர் குலம்
  rationale: זֶרַח என்பதையும் அதன் இனக்குழுப் பெயரையும் வேறுபடுத்திக் காட்டி, எபிரெய வடிவத்துக்கு நெருக்கமான தமிழாக்கத்தை வழங்குகிறது.
