base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/043.yaml
  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: ta
  text: சூகாமியரின் குடும்பப் பிரிவுகள்[a] அனைத்திலும் கணக்கெடுக்கப்பட்டவர்களின் மொத்த எண்ணிக்கை அறுபத்து நான்காயிரத்து நானூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குலப்பிரிவுகள்.”
    reason: மִשְׁפְּחֹת என்பதற்கான குலவரிசைச் சூழலிலான சொல் மாற்று.
lexical_decisions:
- source_word: כָּל
  choice: அனைத்திலும்
  rationale: சூகாமியரின் குடும்பங்களின் முழுத் தொகுதியையும் குறிக்கிறது; தமிழில் எண்ணப்பட்டவர்களுடன் இயல்பாக இணைவதற்காக இடவேற்றுமையுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפְּחֹת
  choice: குடும்பங்கள்
  rationale: கணக்கெடுப்பு மற்றும் குலவரிசைச் சூழலில் ‘குடும்பங்கள்’ அல்லது ‘குலப்பிரிவுகள்’ எனப் பொருள்படலாம்; பொதுவாசகருக்குத் தெளிவான ‘குடும்பங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַשּׁוּחָמִי
  choice: சூகாமியரின்
  rationale: சூகாமுடன் தொடர்புடைய சந்ததியினர் அல்லது குலக்குழுவைக் குறிக்கும் இனப்பெயர்; எபிரெயப் பெயரின் ஒலிவடிவத்தையும் குழு அடையாளத்தையும் காக்கிறது.
- source_word: לִפְקֻדֵיהֶם
  choice: எண்ணப்பட்டவர்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்டு எண்ணப்பட்ட நபர்களைக் குறிக்கிறது; வெறும் எண்ணிக்கைச் செயலைவிட கணக்கெடுப்பில் சேர்க்கப்பட்டவர்களைத் தெளிவாகச் சொல்கிறது.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: அறுபத்து நான்காயிரத்து நானூறு
  rationale: மூலத்தின் துல்லியமான மொத்த எண்ணிக்கையை நவீனத் தமிழின் இயல்பான எண் வடிவில் தருகிறது.
