  register: நவீன நிலையான தமிழில், கணக்கெடுப்புச் சூழலைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்தும் கண்ணியமான உரை. ‘குடும்பங்கள்’ என்ற சொல் குலவழிக் குடும்பப் பிரிவுகளைக் குறிக்கிறது.
