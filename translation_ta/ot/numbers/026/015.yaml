  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: ta
  text: 'காத்தின் மகன்கள், அவர்களுடைய குலங்களின்படி: செப்போனைச் சேர்ந்த செப்போனியர் குலம்[a]; ஹக்கியைச் சேர்ந்த ஹக்கியர் குலம்; சூனியைச் சேர்ந்த சூனியர் குலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில ஆங்கில மொழிபெயர்ப்பு மரபுகளில் இங்கே ‘சிப்போன்’ என்றும் அதன் குலத்தாரை ‘சிப்பியோனியர்’ என்றும் வழங்குகின்றன (ஆதியாகமம் 46:16-ஐ ஒப்பிடுக; அங்கே ‘சிப்பியோன்’ [צִפְיוֹן] உள்ளது). ஆனால் இவ்வசனத்தின் மசோரெட்டிக் எபிரெய உரையில் ‘செப்போன்’ (צפון) என்றே உள்ளது; ஆகவே அதுவே முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: காத்தின் மகன்கள்
  rationale: வம்சப்பட்டியல் சொல்லாட்சியான בְּנֵי என்பதன் ‘மகன்கள்’ என்ற வடிவைத் தக்கவைத்து, குலமுதல்வரான காத்திடமிருந்து வந்த வம்சத்தாரைக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה என்பது கோத்திரத்திற்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது; ‘அவரவர் குலங்களின்படி’ என்பது பகிர்ந்தளிக்கும் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִצְפוֹן
  choice: செப்போனைச் சேர்ந்த
  rationale: இந்த வம்சப்பட்டியல் சூத்திரத்தில் לְ என்பது செப்போனின் வழியையோ அவருக்குரியவர்களையோ குறிக்கிறது; தமிழில் ‘சேர்ந்த’ என்பது அதனை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: செப்போனியர் குலம்
  rationale: மூதாதையான செப்போனிலிருந்து பெயர்பெற்ற குலத்தைக் குறிக்கும் இன/குலப் பெயரை ‘செப்போனியர்’ என வழங்குகிறது.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: அக்கியைச் சேர்ந்த அக்கியர் குலம்
  rationale: எபிரெய வம்சப்பட்டியல் அமைப்பின் இணைநிலையைத் தக்கவைத்து, மூதாதைப் பெயரையும் அதிலிருந்து உருவான குலப் பெயரையும் வேறுபடுத்துகிறது.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: சூனியைச் சேர்ந்த சூனியர் குலம்
  rationale: முந்தைய உறுப்புகளுக்கு இணையான வம்சப்பட்டியல் அமைப்பைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
