translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்பு சார்ந்த வம்சப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடும்பம்’ என்பதற்குப் பதிலாக கோத்திரத்தின் உட்பிரிவைக் குறிக்கும் ‘குலம்’ தேர்ந்தெடுக்கப்பட்டது. எபிரெயப் பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
