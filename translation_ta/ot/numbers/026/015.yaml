revisions:
- from: 'காத்தின் மகன்கள், அவரவர் குலங்களின்படி: செப்போனைச் சேர்ந்த செப்போனியர் குலம்[a]; அக்கியைச் சேர்ந்த அக்கியர் குலம்; சூனியைச் சேர்ந்த சூனியர் குலம்.'
  to: 'காத்தின் மகன்கள், அவர்களுடைய குலங்களின்படி: செப்போனைச் சேர்ந்த செப்போனியர் குலம்[a]; ஹக்கியைச் சேர்ந்த ஹக்கியர் குலம்; சூனியைச் சேர்ந்த சூனியர் குலம்.'
  rationale: The revision retains the source’s parallel genealogy formula and clan terminology, while correcting Haggi’s transliteration and making the note’s comparison with Genesis 46:16 textually precise. No interpretive or doctrinal change is made.
