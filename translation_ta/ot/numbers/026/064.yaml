source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: ta
  text: 'ஆனால்[a] இவர்களில் ஒரு ஆண்கூட, சீனாய் வனாந்தரத்தில் இஸ்ரவேல் மக்களைக்[b] கணக்கெடுத்த மோசேயும் ஆசாரியனாகிய ஆரோனும் கணக்கெடுத்தவர்களில் இருந்ததில்லை.


    [a] “இவர்களில்” என்பதற்கு முன் வரும் எபிரெய இணைப்புச்சொல்லை “மேலும்” என்றும் மொழிபெயர்க்கலாம்; முந்தைய வசனத்துடன் உள்ள வேறுபாட்டை இங்கே “ஆனால்” வெளிப்படுத்துகிறது.


    [b] எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுவழிக் குடும்பப் பெயர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவர்களில்” என்பதற்கு முன் வரும் எபிரெய இணைப்புச்சொல்லை “மேலும்” என்றும் மொழிபெயர்க்கலாம்; முந்தைய வசனத்துடன் உள்ள வேறுபாட்டை இங்கே “ஆனால்” வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுவழிக் குடும்பப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: ஆனால் இவர்களில்
  rationale: இணைப்புச்சொல்லும் முன்னிடைச்சொல்லும் சேர்ந்து அடிப்படையில் ‘மேலும்/இவர்களில்’ எனப் பொருள்படும். முந்தைய வசனத்துடன் உள்ள கருத்து வேறுபாட்டை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֹא הָיָה אִישׁ
  choice: ஓர் ஆண்கூட ... ஒருவனாக இருக்கவில்லை
  rationale: முந்தைய கணக்கெடுப்பில் சேர்க்கப்பட்ட ஆண்களில் எந்த ஒரு தனிநபரும் இக்குழுவில் இல்லை என்ற வலியுறுத்தலை இந்தத் தமிழ் அமைப்பு காக்கிறது.
- source_word: מִפְּקוּדֵי
  choice: கணக்கிடப்பட்டவர்களில்
  rationale: פקד என்ற வேர்ச்சொல் இங்கு மக்கள் கணக்கெடுப்பில் எண்ணப்பட்டவர்களைக் குறிக்கிறது; வெறும் கணக்கெடுப்புப் பதிவை அல்ல, அதில் இடம்பெற்ற நபர்களையே மொழிபெயர்ப்பு சுட்டுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: மூலத்தில் ‘ஆசாரியன்’ என்றே உள்ளது; ‘தலைமை ஆசாரியன்’ என்ற கூடுதல் பட்டம் சேர்க்கப்படவில்லை.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: கணக்கெடுத்த
  rationale: இந்த உறவுத்தொடர் மோசேயும் ஆரோனும் சீனாய் வனாந்தரத்தில் இஸ்ரவேல் மக்களைக் கணக்கெடுத்ததை நேரடியாகக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்சொல் வடிவம் தமிழில் யாக்கோபின் நேரடி மகன்களை மட்டும் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம். சமூகத்தைக் குறிக்கும் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּמִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பதன் வறண்ட, குடியிருப்பில்லாத நிலப்பரப்பு என்ற பொருளை வேதாகமத் தமிழில் புரிந்துகொள்ளக்கூடிய ‘வனாந்தரம்’ தக்கவைக்கிறது.
theological_decisions:
- issue: אִישׁ என்பதன் பாலினத் துல்லியம்
  choice: ஓர் ஆண்கூட
  alternative: ஒருவர்கூட
  rationale: இவ்வசனம் முந்தைய கணக்கெடுப்பில் இடம்பெற்ற ஆண் தலைமுறையைச் சுட்டுகிறது; எனவே மூலத்தின் ஆண்பால் குறிப்பை பாலினப் பொதுமையாக்காமல் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற குடும்பவழிப் பெயர்
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’; அடிக்குறிப்பில் ‘இஸ்ரவேலின் மகன்கள்’
  alternative: முதன்மை உரையிலேயே ‘இஸ்ரவேலின் மகன்கள்’
  rationale: கூட்டுமக்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குவதோடு, அதன் குடும்பவழிச் சொல் வடிவத்தையும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ மற்றும் ‘ஆசாரியன்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத்தின் இருமுறை ‘கணக்கெடுத்தல்’ குறிப்பு மூலத்தின் פקד சொல்வேர் மீளுருவாக்கத்தைப் பிரதிபலிக்கிறது.
