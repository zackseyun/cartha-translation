  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: ta
  text: ஆசேரின் மகன்களின் குலங்கள் இவையே; அவர்களுடைய கணக்கெடுப்புப் பதிவின்படி, ஐம்பத்து மூவாயிரத்து நானூறு பேர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “அவர்களுடைய கணக்கிடப்பட்டவர்கள்.” எபிரெயச் சொற்றொடர் פקד என்ற வினையிலிருந்து வந்த கணக்கெடுப்பு மொழிநடையைப் பயன்படுத்தி, பதிவுசெய்யப்பட்ட அல்லது எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பன்மைச் சுட்டுப்பெயரான இதைத் தமிழில் இயல்பான தொகுப்புரை வடிவில் வழங்குகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இங்கு அணுக்கக் குடும்பங்களையல்ல, கோத்திரத்திற்குள் உள்ள விரிவான வம்சக் குழுக்களைக் குறிக்கிறது.
- source_word: בְּנֵי אָשֵׁר
  choice: ஆசேரின் மகன்களுடைய
  rationale: எபிரெய மரபுவழி சொல்லமைப்பைப் பேணுகிறது; சூழலில் ஆசேரின் வழிவந்த சந்ததியினரைக் குறிக்கிறது.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்களின் எண்ணிக்கை
  rationale: פקד என்ற சொல்லின் அதிகாரப்பூர்வ மக்கள்தொகைக் கணக்கெடுப்புச் சார்ந்த பொருளையும், அவர்களுடன் தொடர்புடைய கணக்கிடப்பட்ட நபர்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ஐம்பத்து மூவாயிரத்து நானூறு
  rationale: மூலத்தின் துல்லியமான மொத்த எண்ணிக்கையைத் தற்காலத் தமிழ் எண் நடையில் வழங்குகிறது.
