  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: ta
  text: சேராகுவின் வழிவந்த சேராகியரின் குலம்; சவுலின் வழிவந்த சவுலியரின் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: சேராகுவிடமிருந்து
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் இந்த மரபுவழிப் பட்டியல் சூத்திரத்தில் לְ முன்னொட்டு, பெயரிடப்பட்ட மூதாதையிடமிருந்து வந்த வம்சத் தொடர்பைக் குறிக்கிறது. தமிழில் ‘-விடமிருந்து’ என்பது அந்தத் தோற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: מִשְׁפָּחָה என்பது இங்கு ஒரு கோத்திரத்திற்குள் உள்ள மரபுவழிக் குழுவைக் குறிக்கிறது; நவீனத் தமிழில் ‘குலம்’ இதைச் சுருக்கமாகவும் பொருத்தமாகவும் தருகிறது.
- source_word: הַ/זַּרְחִי
  choice: சேராகியர்
  rationale: இந்த வம்சப்பெயர் சேராகுவின் வழிவந்த மக்களைக் குறிக்கிறது. ‘சேராகியர்’ தமிழில் குழுப் பெயராக இயல்பாக அமைந்து, எபிரெய வடிவத்தின் உறவையும் காக்கிறது.
- source_word: לְ/שָׁאוּל
  choice: சவுலிடமிருந்து
  rationale: முதல் பெயரைப் போலவே இங்குள்ள לְ முன்னொட்டும் மூதாதையுடனான வம்சத் தொடர்பைக் காட்டுகிறது; ‘-விடமிருந்து’ அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: எபிரெய மூலத்தில் மீண்டும் வரும் ஒரே பட்டியல் அமைப்பையும் சமூகப் பிரிவையும் தமிழிலும் ஒரே சொல்லால் நிலையாகக் காட்டுகிறது.
- source_word: הַ/שָּׁאוּלִי
  choice: சவுலியர்
  rationale: சவுலின் வழிவந்த மக்களைக் குறிக்கும் வம்சப்பெயரை ‘சவுலியர்’ எனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
