  source_fidelity: மூல எபிரெயத்தின் பட்டியல் அமைப்பும் ‘சிமியோனின் மகன்கள்’ மற்றும் குலப் பெயர்களும் பெரும்பாலும் சரியாகத் தரப்பட்டுள்ளன. ஆனால் לְமִשְׁפְּחֹתָם என்பது ‘அவர்களுடைய குலங்களின்படி’ என்பதைக் குறிக்கும் நிலையில், பின்னர் வரும் לְ-யை ‘-இடமிருந்து’ எனக் கொள்வது தேவையற்ற அளவு தோற்ற/மூல உறவை வெளிப்படுத்துகிறது. இப்பட்டியல் சூத்திரத்தில் ‘நெமுவேலுக்கு/நெமுவேலினின்று’ அல்ல, தமிழில் இயல்பாக ‘நெமுவேலின் வழியாக’ அல்லது சுருக்கமாக ‘நெமுவேலுக்கு’ எனக் குலப் பிரிவை அறிமுகப்படுத்துகிறது. ‘நெமுவேலின் வழியாக’ மூலத்தின் வம்சவழிப் பட்டியல் செயல்பாட்டைத் தெளிவாகவும் பாதுகாப்பாகவும் காட்டுகிறது.
  naturalness: ‘நெமுவேலிடமிருந்து … குலம்’ என்ற மூன்று முறை மீளும் அமைப்பு தமிழில் ஓரளவு கனமாகவும், ஒரு தனிநபரிடமிருந்து நேரடியாகக் குலம் தோன்றியது என்ற வலுவான நுணுக்கத்தையும் தருகிறது. ‘நெமுவேலின் வழியாக, நெமுவேலியரின் குலம்’ என்பது நவீன தரநிலைத் தமிழில் இயல்பாகவும் கணக்கெடுப்புப் பட்டியலுக்கு ஏற்றதாகவும் உள்ளது.
  terminology: ‘குலம்’ மִשְׁפָּחָה என்பதற்கு இச்சூழலில் ஏற்றது. பெயர்களை நெமுவேல், யாமீன், யாகீன் என நீள உயிருடன் எழுதுவது எபிரெய வடிவங்களுக்கு நெருக்கமானது. இன/வம்சக் குழுப் பெயர்களில் ‘நெமுவேலியரின் குலம்’ என்பது ‘நெமுவேலியர் குலம்’ என்பதைக் காட்டிலும் தமிழ் உரிமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
