base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: ta
  text: சிமியோனின் மகன்கள், அவர்களுடைய குலங்களின்படி:[a] நெமுவேலின் வழியாக, நெமுவேலியரின் குலம்; யாமீனின் வழியாக, யாமீனியரின் குலம்; யாகீனின் வழியாக,[b] யாகீனியரின் குலம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிமியோனின் மகன்கள்” என்பதைப் பரந்த பொருளில் “சிமியோனின் வழித்தோன்றல்கள்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரெய உரை ஆண் வழி வம்சாவளிச் சொல்லாட்சியைப் பயன்படுத்துகிறது. “குலங்களின்படி” என்பதற்கு “குடும்பங்களின்படி” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல், மக்கள்தொகைக் கணக்கெடுப்பில் ஒரு கோத்திரத்திற்குள் அமைந்த வம்சக் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யாகீன்” என்பதை “யாகின்” என்றும் எழுத்துப்பெயர்க்கலாம்.
    reason: transliteration_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: சிமியோனின் மகன்கள்
  rationale: எபிரெய உரையின் ஆண் வழி வம்சாவளிச் சொல்லாட்சியான ‘மகன்கள்’ என்பதை நேரடியாகப் பாதுகாக்கிறது; விரிந்த பொருளில் ‘வழித்தோன்றல்கள்’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה என்பது பழங்குடிக்குள் உள்ள வம்சக் குழுவைக் குறிக்கிறது; ‘குலம்’ இயல்பான, தெளிவான தமிழ் இணை.
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: நெமுவேலிடமிருந்து / யாமினிடமிருந்து / யாகினிடமிருந்து
  rationale: முன்னொட்டு לְ இங்கு ஒவ்வொரு குலத்தின் மூதாதையையும் தோற்றத்தையும் அறிமுகப்படுத்துகிறது; ‘-இடமிருந்து’ வம்சத் தோற்றத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  choice: நெமுவேலியர் குலம் / யாமினியர் குலம் / யாகினியர் குலம்
  rationale: எபிரெய இனவழிப் பெயர்கள் ஒவ்வொரு மூதாதையிடமிருந்து வந்த சந்ததிக் குழுக்களைக் குறிக்கின்றன; தமிழில் ‘-இயர் குலம்’ அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், கணக்கெடுப்புப் பட்டியலின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலியமைப்பை அடிப்படையாகக் கொண்டு தமிழாக்கப்பட்டுள்ளன; ‘குலம்’ என்பது இச்சூழலின் சமூக-வம்சப் பிரிவைத் தெளிவாகக் காட்டுகிறது.
