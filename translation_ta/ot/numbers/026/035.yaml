  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: ta
  text: 'எப்பிராயீமின் மகன்கள், அவர்களுடைய குலங்களின்படி, இவர்கள்: சூத்தெலாவின் வழிவந்த சூத்தெலாகியரின் குலம்; பெக்கேரின் வழிவந்த பெக்கேரியரின் குலம்; தகானின் வழிவந்த தகானியரின் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மகன்கள் ... இவர்களே
  rationale: எபிரெயப் பட்டியல் அறிமுகத்தின் சுட்டும் அமைப்பையும் மரபுவழி சார்ந்த ‘மகன்கள்’ என்ற சொல்லையும் இயல்பான தமிழ் வாக்கிய வரிசையில் காக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: எண்ணாகமத்தின் மக்கள் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה என்பது கோத்திரத்தின் உட்பிரிவான குலத்தைக் குறிக்கிறது; לְ முன்னொட்டின் வகைப்படுத்தும் பொருளை ‘-இன்படி’ தெரிவிக்கிறது.
- source_word: לְשׁוּתֶלַח / לְבֶכֶר / לְתַחַן
  choice: சூத்தெலாவிலிருந்து / பெக்கேரிலிருந்து / தகானிலிருந்து
  rationale: மரபுவழியாக அந்தப் பெயருடைய மூதாதையரிடமிருந்து தோன்றிய குலம் என்ற தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי / הַבַּכְרִי / הַתַּחֲנִי
  choice: சூத்தெலாகியரின் குலம் / பெக்கேரியரின் குலம் / தகானியரின் குலம்
  rationale: எபிரெய இனக்குழுப் பெயரெச்சங்களை அந்தந்த மூதாதையரின் பெயரால் அழைக்கப்படும் மக்கள் குழுக்களாகத் தமிழில் வெளிப்படுத்தி, மூலத்தின் மீளும் அமைப்பைக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; மக்கள் கணக்கெடுப்பு மற்றும் மரபுப்பட்டியல் சூழலுக்கேற்ற கண்ணியமான நடை. ‘குடும்பம்’ என்பதற்குப் பதில் கோத்திர உட்பிரிவைக் குறிக்கும் ‘குலம்’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய மசோரா உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
