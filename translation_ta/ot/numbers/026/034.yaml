  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: ta
  text: இவையே மனாசேயின் குலங்கள்; அவர்களில் கணக்கிடப்பட்டவர்கள்[a] ஐம்பத்திரண்டாயிரத்து எழுநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கணக்கிடப்பட்டோர்” அல்லது “அவர்களுடைய பதிவுசெய்யப்பட்டோர்.” எபிரேயக் கணக்கெடுப்பு மரபுத்தொடரில் פקד என்ற சொல்லின் வடிவம் பயன்படுத்தப்பட்டு, எண்ணப்பட்ட அல்லது பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: முன்னர் பட்டியலிடப்பட்ட குலங்களைச் சுட்டிக்காட்டி தொகுத்துரைக்கும் எபிரெயப் பன்மைச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில், வீட்டுக் குடும்பங்களைவிடப் பெரிய பழங்குடி உட்பிரிவுகளைக் குறிக்கிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּפְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்கள்
  rationale: פקד என்பதன் கணக்கெடுப்புச் சூழலிலான பொருளைத் தருகிறது; எபிரெயத்தில் இங்கு வெளிப்படையாக இல்லாத ‘ஆண்கள்’ என்பதைச் சேர்க்காமல், அந்தக் குலங்களைச் சேர்ந்த கணக்கிடப்பட்டோரைக் குறிக்கிறது.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: ஐம்பத்திரண்டாயிரத்து எழுநூறு பேர்
  rationale: எபிரெய எண்ணின் முழுத் தொகையைத் துல்லியமாகவும் இயல்பான தமிழ் வடிவிலும் தருகிறது; மனிதர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
