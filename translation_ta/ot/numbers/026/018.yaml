  yaml_path: translation/ot/numbers/026/018.yaml
  text: 'These are the clans of the sons of Gad according to those numbered from them: forty thousand and five hundred.'
translation:
  language: ta
  text: காதின் மகன்களுடைய குலங்கள் இவையே. அவர்களில் எண்ணப்பட்டவர்கள் மொத்தம் நாற்பதாயிரத்து ஐந்நூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: இங்கு வம்சவழிக் குடும்பக் குழுக்களைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: לִפְקֻדֵיהֶם
  choice: அவர்களில் எண்ணப்பட்டவர்கள் மொத்தம்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைச் சுட்டும் எபிரெயச் சொல்லின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அவர்களில்’ என்பது அந்தக் குலங்களிலிருந்து எண்ணப்பட்டவர்கள் என்ற உறவைப் பாதுகாக்கிறது.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: நாற்பதாயிரத்து ஐந்நூறு பேர்
  rationale: எண்ணிக்கையை நவீனத் தமிழின் இயல்பான கூட்டெண் வடிவில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
