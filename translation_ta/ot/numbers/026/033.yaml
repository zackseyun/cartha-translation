base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: ta
  text: எப்பேரின் மகன் செலொப்பெகாதுக்கு மகன்கள் இல்லை[a]; மகள்கள் மட்டுமே இருந்தனர். செலொப்பெகாதின் மகள்களின் பெயர்கள் மக்லா, நோவா,[b] ஹொக்லா, மில்கா, திர்சா என்பன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “அவனுக்கு மகன்கள் இருக்கவில்லை; மகள்களைத் தவிர.”'
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள “நோவா” என்பது செலொப்பெகாதின் மகள்களில் ஒருவரின் பெயர்; பெருவெள்ள நிகழ்வில் வரும் நோவாவைக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: எப்பேரின் மகன் செலொப்பெகாத்
  rationale: வம்ச உறவை இயல்பான தமிழில் நேரடியாகத் தருகிறது; தொடக்க ו தனியாக மொழிபெயர்க்கப்படாமல், தொடர்ச்சியான பட்டியல் சூழலில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: לֹא הָיוּ לֹו בָּנִים כִּי אִם בָּנוֹת
  choice: அவனுக்கு மகன்கள் இல்லை; மகள்கள் மட்டுமே இருந்தார்கள்
  rationale: எபிரெயத்தின் உடைமைக்கான இருப்புக் கட்டமைப்பை இயல்பான தமிழில் வழங்கி, மகன்களுக்கும் மகள்களுக்கும் இடையிலான வெளிப்படையான முரணைத் தக்கவைக்கிறது.
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: செலொப்பெகாதின் மகள்களின் பெயர்கள் ... என்பன
  rationale: எபிரெயத்தில் ‘பெயர்’ ஒருமையாக இருந்தாலும் அது கூட்டுப்பொருளில் வருகிறது; பல பெயர்களை அறிமுகப்படுத்த தமிழில் பன்மை இயல்பானது.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: மக்லா, நோவா, ஒக்லா, மில்கா, திர்சா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்புகளாக வழங்கப்பட்டுள்ளன; חָגְלָה என்பதன் தொடக்க மெய் தமிழில் இயல்பாக ‘ஒ’ தொடக்கத்துடன் தரப்பட்டுள்ளது.
