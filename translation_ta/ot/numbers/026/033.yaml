  source_fidelity: 'முக்கிய வாக்கிய அமைப்பும் பொருளும் எபிரெய மூலத்துடன் ஒத்துள்ளன: செலொப்பெகாதுக்கு மகன்கள் இல்லை; மகள்கள் மட்டுமே இருந்தனர்; பின்னர் ஐந்து மகள்களின் பெயர்கள் தரப்படுகின்றன. ஆனால் חָגְלָה (Ḥoglah) என்ற பெயரில் உள்ள தொடக்கத் தொண்டை ‘ḥ’ ஒலி வரைவில் விடுபட்டுள்ளது; “ஒக்லா” மூல ஒலியிலிருந்து தேவையற்ற அளவு விலகுகிறது.'
