  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: ta
  text: 'இஸ்ரவேலின் முதற்பேறான ரூபன்: ரூபனின் மகன்கள்: அனோக்கிலிருந்து அனோக்கியர் குலம்; பல்லூவிலிருந்து பல்லூவியர் குலம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முதற்பேறானவன்
  rationale: בְּכֹר என்பது பிறப்பு வரிசையையும் அதனுடன் தொடர்புடைய குடும்ப நிலையையும் குறிக்கிறது. ‘முதற்பேறானவன்’ என்பது ‘மகன்’ என்ற மறைபொருளைத் தேவையின்றிச் சேர்க்காமல் எபிரெயச் சொல்லுக்கு நெருக்கமாக உள்ளது; வாக்கியத்தில் ரூபனுடன் இணைத்து இயல்பாக ‘இஸ்ரவேலின் முதற்பேறான ரூபன்’ என அமைக்கப்பட்டது.
- source_word: בְּנֵי רְאוּבֵן
  choice: ரூபனின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’. இங்கு அவர்கள் வழியாக உருவான குலங்கள் பட்டியலிடப்பட்டாலும், மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: חֲנוֹךְ
  choice: ஆனோக்கு
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் பெயர்ப்பு.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் இச்சொல் ஒரு கோத்திரத்துக்குள் உள்ள உறவுவழிக் குழுவைக் குறிக்கிறது. ‘குடும்பம்’ என்பதைக் காட்டிலும் ‘குலம்’ அந்த சமூக அலகைத் துல்லியமாகக் காட்டுகிறது.
- source_word: הַחֲנֹכִי
  choice: ஆனோக்கியர்
  rationale: ஆனோக்கிலிருந்து வந்த உறவுவழிக் குழுவினரைக் குறிக்கும் இனவழிப் பெயராகத் தமிழில் இயல்பாக அமைக்கப்பட்டது.
- source_word: לְפַלּוּא
  choice: பல்லூவிலிருந்து
  rationale: பட்டியலில் உள்ள לְ முன்னொட்டு குலத்தின் மூதாதையை அறிமுகப்படுத்துகிறது. தமிழில் வம்சத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘-விலிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: הַפַּלֻּאִי
  choice: பல்லூவியர்
  rationale: பல்லூவிலிருந்து வந்த குலத்தினரைக் குறிக்கும் இனவழிப் பெயராகத் தமிழில் இயல்பாக அமைக்கப்பட்டது.
