  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: ta
  text: செமீதாவிலிருந்து வந்த செமீதாவியரின் குலம்; மேலும், ஏப்பேரிலிருந்து வந்த ஏப்பேரியரின் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: செமிதாவிடமிருந்து
  rationale: மக்கள்தொகைக் கணக்கெடுப்புப் பட்டியலின் தொடர்ச்சியான சூத்திரத்தில், எபிரெய முன்னொட்டு வெறும் ‘மற்றும்’ என்பதைக் காட்டிலும், இந்தக் குலம் செமிதாவிலிருந்து வந்தது என்ற மறைந்துள்ள உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இங்கு இந்தச் சொல் ஒரு கோத்திரத்துக்குள் உள்ள வம்சவழிக் குழுவைக் குறிக்கிறது; நவீன தமிழில் ‘குலம்’ சுருக்கமாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: הַ/שְּׁמִידָעִי
  choice: செமிதாவியரின்
  rationale: இந்த வம்சப்பெயர் செமிதாவுடன் தொடர்புடைய சந்ததியினரைக் குறிக்கிறது; ‘செமிதாவியர்’ என்ற வடிவம் அந்த உறவைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וְ/חֵפֶר
  choice: எப்பேரிடமிருந்து
  rationale: முந்தைய பகுதியின் வம்சவழிச் சூத்திரம் இங்கும் தொடர்கிறது. தமிழ் வாக்கியத்தில் இணைப்புச்சொல்லை மீண்டும் இடாமல் அரைப்புள்ளியால் இணைத்தது பட்டியல் நடையை இயல்பாக்குகிறது.
- source_word: הַֽ/חֶפְרִי
  choice: எப்பேரியரின்
  rationale: இந்த வம்சப்பெயர் எப்பேரின் சந்ததியினரைக் குறிக்கிறது; ‘எப்பேரியர்’ என்பது பெயருடனான தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
