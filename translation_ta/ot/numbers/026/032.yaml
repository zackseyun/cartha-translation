translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான பட்டியல் நடை பயன்படுத்தப்பட்டது. எபிரெயப் பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டன; மூலத்தின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டது.
