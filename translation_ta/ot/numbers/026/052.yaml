lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு … பேசினார்
  rationale: வழக்கமான தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தை, நவீனத் தமிழில் இயல்பாக ‘பின்பு’ என்பதாலும் ‘பேசினார்’ என்பதாலும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், இறைநாமமாக ஒலிபெயர்க்கிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை, ‘பேசினார்’ என்பதுடன் சேர்த்து இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, YHWH என்ற தனிப்பட்ட இறைநாமமே உள்ளது. ஆகவே பெயரைப் பாதுகாக்கும் வகையில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வேதாகம உரைநடை. ‘பேசினார்’ மற்றும் ‘இவ்வாறு’ ஆகியவை சேர்ந்து மூலத்தின் דבר…לאמר என்ற உரை அறிமுகச் சூத்திரத்தை இயல்பாக எடுத்துரைக்கின்றன.
