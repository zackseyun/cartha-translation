source:
  edition: WLC
  text: בְּנֵ֥י יְהוּדָ֖ה עֵ֣ר וְ/אוֹנָ֑ן וַ/יָּ֥מָת עֵ֛ר וְ/אוֹנָ֖ן בְּ/אֶ֥רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: ta
  text: 'யூதாவின் மகன்கள்: ஏர், ஓனான்.[a] ஆனால் ஏரும் ஓனானும் கானான் நாட்டில் இறந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும் ஏரும் ஓனானும் கானான் நாட்டில் இறந்தார்கள்.’ எபிரெய இணைப்பிடைச்சொல்லை எளிமையாக ‘மேலும்’ என்றும் மொழிபெயர்க்கலாம்; சூழலில் உள்ள முரண்பாட்டு உணர்வை வெளிப்படுத்த முதன்மை உரையில் ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் இணைப்புநிலைப் பன்மை; வம்சப்பட்டியலில் ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என்பது நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தனிப்பட்ட நபரின் பெயர்; தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவம்.
- source_word: עֵר
  choice: ஏர்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ/אוֹנָן
  choice: ஓனான்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் தனிப்பெயர். பட்டியலில் தமிழின் இயல்பான நிறுத்தக்குறிப்பு முறையால் இணைப்பு வெளிப்படுவதால் பெயர் நேரடியாக வழங்கப்பட்டுள்ளது.
- source_word: וַ/יָּמָת
  choice: ஆனால் ... இறந்தார்கள்
  rationale: מוּת வினையின் இறந்தகால நிகழ்வை ‘இறந்தார்கள்’ என மொழிபெயர்த்துள்ளது. முன் குறிப்பிடப்பட்ட மகன்களில் இவர்கள் வம்சப்பட்டியலில் தொடராததற்கான முரண்பாட்டு/விலக்கு குறிப்பைச் சூழல் உணர்த்துவதால் וַ־க்கு முதன்மை உரையில் ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּ/אֶרֶץ
  choice: நாட்டில்
  rationale: புவியியல் பெயருடன் வரும் בְּ + אֶרֶץ என்பதற்கு நவீன தமிழில் இயல்பான இடவியல் வடிவம்.
- source_word: כְּנָעַן
  choice: கானான்
  rationale: இடப்பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
