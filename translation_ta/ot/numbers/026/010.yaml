base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: ta
  text: அந்தக் கூட்டம் இறந்து, நெருப்பு இருநூற்று ஐம்பது ஆண்களை எரித்து அழித்தபோது, பூமி[a] தன் வாயைத் திறந்து அவர்களையும் கோராகையும்[c] விழுங்கியது; அவர்கள் ஓர் அடையாளமானார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் ஓர் எச்சரிக்கை அடையாளமானார்கள்.’ எபிரெயச் சொல் נֵס அடையாளம், சைகை, அல்லது கொடி என்பவற்றைக் குறிக்கலாம்; இச்சூழலில் அது எச்சரிக்கும் செயல்பாட்டையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘அவர்களையும் கோராகையும்’ என்று உள்ளது. இந்த வசனம் நியாயத்தீர்ப்பை இவ்வாறே கூறுகிறது; நிகழ்வின் விரிவான பின்னணிக்கு எண்ணாகமம் 16-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: பூமி தன் வாயைத் திறந்து
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள் கொள்ளலாம். இங்கு தரை பிளந்து விழுங்கும் உருவகம் இருப்பதால் ‘பூமி’ இயல்பாக உள்ளது; ‘வாய்’ என்பதையும் வைத்திருப்பது எபிரெயத்தின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַתִּבְלַע
  choice: விழுங்கியது
  rationale: בלע என்பதன் நேரடியான விழுங்குதல் உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: அவர்களையும் கோராகையும்
  rationale: எபிரெயம் ‘அவர்களையும் கோராகையும்’ என்று வெளிப்படையாக இணைக்கிறது. சுற்றியுள்ள நிகழ்வுகளோடு ஒத்திசைக்க முயலாமல் உடனடி வாக்கிய அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: בְּמוֹת הָעֵדָה
  choice: அந்தக் கூட்டத்தினர் இறந்தபோது
  rationale: בְּ + வினையெச்சப் பெயர்ச்சொல் காலப்பொருளில் ‘...போது’ என மொழிபெயர்க்கப்பட்டது. עֵדָה இங்கு ஒன்றுகூடிய குழுவைக் குறிப்பதால் ‘கூட்டத்தினர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: நெருப்பு ... எரித்து அழித்தது
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘உண்ணுதல்’; நெருப்பை எழுவாயாகக் கொண்ட சூழலில் ‘எரித்து அழித்தது’ என்பது தமிழில் இயல்பான சமமான வெளிப்பாடு.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: இருநூற்று ஐம்பது பேர்
  rationale: எண்ணிக்கையையும் மனிதர்களைக் குறிக்கும் אִישׁ என்பதையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּהְיוּ לְנֵס
  choice: அவர்கள் ஓர் எச்சரிக்கை அடையாளமானார்கள்
  rationale: נֵס என்பது அடையாளம், சைகை அல்லது கொடி போன்றவற்றைக் குறிக்கலாம். நியாயத்தீர்ப்புச் சூழலில் அதன் எச்சரிக்கும் செயல்பாட்டை ‘எச்சரிக்கை அடையாளம்’ வெளிப்படுத்துகிறது; இறுதிப் பன்மையின் குறிப்பு யார் என்பது ‘அவர்கள்’ என்பதால் திட்டமிட்டு திறந்தே வைக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவர்கள் ஓர் அடையாளமானார்கள்’ என்ற இறுதிப் பன்மையின் குறிப்பு
  choice: ‘அவர்கள்’ என்ற பன்மையை அப்படியே வைத்து, அது யாரைக் குறிக்கிறது என்பதை மிகக் குறுகலாகத் தீர்மானிக்காமல் விடுதல்
  alternative: அது இருநூற்று ஐம்பது பேரை மட்டுமே குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது முழு நிகழ்வையும் குறிக்கிறது என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெயப் பன்மை முன்னிலைச் சொல்லின் குறிப்பு ஓரளவு தெளிவற்றதாக இருக்க அனுமதிக்கிறது. மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: விழுங்கப்பட்டவர்களோடு கோராகின் தொடர்பு
  choice: ‘அவர்களையும் கோராகையும்’ என்ற இவ்வசனத்தின் நேரடி அமைப்பைப் பாதுகாத்தல்
  alternative: எண்ணாகமம் 16-இன் பிற விவரங்களோடு ஒத்திசைக்கும்படி கோராகை விழுங்கப்பட்டவர்களிடமிருந்து பிரித்து மொழிபெயர்த்தல்
  rationale: உடனடி எபிரெய வாக்கிய அமைப்பு கோராகை ஒருங்கிணைக்கிறது. வேறு பகுதிகளின் அடிப்படையில் அதை அமைதியாக மாற்றுவது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தன் வாயைத் திறந்து’, ‘விழுங்கியது’ ஆகிய உருவகங்கள் மூலத்தின் தீவிரத்தைப் பாதுகாக்கின்றன. ‘சபை’ என்ற சமயச் சிறப்புப் பொருள் வரக்கூடிய சொல்லுக்குப் பதிலாக, இச்சூழலிலுள்ள குழுவைக் குறிக்க ‘கூட்டத்தினர்’ தேர்ந்தெடுக்கப்பட்டது.
