base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: ta
  text: இவையே ரூபேனியரின் வம்சக் குழுக்கள். அவர்களில் கணக்கிடப்பட்டவர்கள்[a] மொத்தம் நாற்பத்து மூவாயிரத்து எழுநூற்று முப்பது பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பதிவு செய்யப்பட்டவர்கள்,” “அவர்களில் கணக்கெடுப்புக்காகப் பதிவு செய்யப்பட்டவர்கள்.” எபிரெயச் சொல் கணக்கெடுப்பில் எண்ணப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: வம்சக் குழுக்கள்
  rationale: எண்ணிக்கை நூலின் கோத்திரக் கணக்கெடுப்புச் சூழலில், இந்தச் சொல் தனிக் குடும்பங்களைக் காட்டிலும் ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறை சார்ந்த உட்பிரிவுகளைக் குறிக்கிறது.
- source_word: הָרֻאוּבֵנִי
  choice: ரூபேனியர்
  rationale: இது ரூபேனின் வழிவந்தவர்களையும் அவரது கோத்திரத்தைச் சேர்ந்தவர்களையும் குறிக்கும் இனப்பெயர்; தமிழில் இயல்பான குழுப்பெயராக இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: פְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்கள்
  rationale: פקד என்ற வேர்ச்சொல் இங்கு மக்கள்தொகைக் கணக்கெடுப்பில் எண்ணப்பட்ட அல்லது பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. எபிரெயத்தில் இவ்வசனத்தில் ‘ஆண்கள்’ மீண்டும் வெளிப்படையாக இல்லாததால், அதைச் சேர்க்காமல் செயப்பாட்டு உணர்வு பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּהְיוּ
  choice: மொத்தம்
  rationale: எண்ணிக்கையை அறிமுகப்படுத்தும் எபிரெய வினையின் பொருளை இயல்பான தமிழ் எண்ணிக்கை வாக்கியமாகத் தருகிறது.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: நாற்பத்து மூவாயிரத்து எழுநூற்று முப்பது
  rationale: எபிரெய மூலத்தில் எண்ணிக்கை சொற்களால் கொடுக்கப்பட்டுள்ளதால், அதன் இலக்கிய வடிவைத் தமிழிலும் சொற்களால் வழங்குகிறது.
