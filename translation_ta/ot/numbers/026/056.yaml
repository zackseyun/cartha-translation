translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உரிமைப்பங்கு’ என்பது பரம்பரைச் சொத்து என்ற பொதுப் பொருளைவிட இச்சூழலிலுள்ள நில ஒதுக்கீட்டைப் பொருத்தமாகக் காட்டுகிறது; எபிரேயத்தின் ஒருமை வடிவம் ‘அதன்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
