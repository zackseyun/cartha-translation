- from: சீட்டின் தீர்ப்பின்படி[a], பெரிய குழுவுக்கும் சிறிய குழுவுக்கும் இடையே அதன் உரிமைப்பங்கு பிரித்தளிக்கப்பட வேண்டும்.
  to: சீட்டின்படி[a], அவரவர் சுதந்தரப் பங்கு அதிகமானோருக்கும் குறைவானோருக்கும் இடையே பகிர்ந்தளிக்கப்பட வேண்டும்.
