  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: ta
  text: சீட்டின்படி[a], அவரவர் சுதந்தரப் பங்கு அதிகமானோருக்கும் குறைவானோருக்கும் இடையே பகிர்ந்தளிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீட்டின்படி, அவரவர் சுதந்தரப் பங்கு பலருக்கும் சிலருக்கும் இடையே பங்கிடப்பட வேண்டும்.” எபிரேயத்தில் உள்ள சொற்கள் பங்கீட்டின் சூழலில் எண்ணிக்கையில் அதிகமானவர்களையும் குறைவானவர்களையும் எதிரெதிராகக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: தீர்ப்பின்படி
  rationale: இந்த எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல் முறையில் ‘வாயின்மேல்’ என்றாலும், இங்கு சீட்டு தீர்மானிப்பதற்கு இணங்க அல்லது அதன் அடிப்படையில் என்பதைக் குறிக்கிறது. ‘தீர்ப்பின்படி’ என்பது அந்தச் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: நிலப்பங்கை ஒதுக்கத் தீர்மானிக்கும் சீட்டைக் குறிக்கிறது. ‘சீட்டு’ என்பது சுருக்கமான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: תֵּחָלֵק
  choice: பிரித்தளிக்கப்பட வேண்டும்
  rationale: חלק என்பதன் நிஃபால் வடிவம் பங்கீடு செய்யப்படுவதைக் குறிக்கும் செயப்பாட்டு பொருளைக் கொண்டது. ‘பிரித்தளிக்கப்பட வேண்டும்’ என்பது பிரித்தல் மட்டுமின்றி உரியவர்களுக்கு ஒதுக்கப்படுதலையும் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: נַחֲלָתוֹ
  choice: அதன் உரிமைப்பங்கு
  rationale: எபிரேயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது. சூழலில் அது ஒவ்வொரு குழுவுக்கும் உரிய நிலப்பங்கை பகிர்முறையாகச் சுட்டுவதால், தமிழில் இயல்பாகவும் பாலினத்தைத் தேவையின்றி சேர்க்காமலும் ‘அதன் உரிமைப்பங்கு’ என வழங்கப்படுகிறது.
- source_word: בֵּין
  choice: இடையே
  rationale: அடுத்து வரும் இரண்டு ஒப்பீட்டுக் குழுக்களுக்கு இடையிலான உறவைக் குறிக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: רַב
  choice: பெரிய குழு
  rationale: மக்கள்தொகை அல்லது எண்ணிக்கையில் ஒப்பீட்டளவில் அதிகமான குழுவைக் குறிக்கிறது. ‘பெரிய குழு’ என்பது ‘பலர்’ என தனிநபர்களுக்கு மட்டும் சுருக்காமல் குழுவளவின் ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: לִמְעָט
  choice: சிறிய குழு
  rationale: רַב என்பதற்கு எதிராக எண்ணிக்கையில் குறைந்த குழுவைக் குறிக்கிறது. ‘சிறிய குழு’ இயல்பாக ‘பெரிய குழு’ என்பதுடன் இணைந்து ஒப்பீட்டை வெளிப்படுத்துகிறது.
