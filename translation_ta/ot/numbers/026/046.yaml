lexical_decisions:
- source_word: וְשֵׁם
  choice: பெயர்
  rationale: வாவ் இணைப்புச்சொல் இங்கு வம்சப்பட்டியலில் கூடுதல் தகவலைத் தொடர்கிறது; தனி வசனமாக இயல்பான தமிழில் கட்டாயமாக ‘மற்றும்’ என்று தொடங்காமல் பெயரைக் குறிக்கும் பெயர்ச்சொல் அமைப்பு காக்கப்படுகிறது.
- source_word: בַּת
  choice: மகள்
  rationale: இந்த வம்சப்பட்டியல் சூழலில் ஒருமைச் சார்புநிலை வடிவம் நேரடியான மகளையே இயல்பாகக் குறிக்கிறது; ‘பெண் வழித்தோன்றல்’ என விரிவுபடுத்தத் தேவையில்லை.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரேய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது; ‘ஆசேரின்’ என்பது בַּת־אָשֵׁר என்ற சார்புநிலை உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שָׂרַח
  choice: சேராகு
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரேய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்படுகிறது; இறுதி ח ஒலியைத் தமிழில் ‘கு’ மூலம் அண்மைப்படுத்துகிறது.
