  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: ta
  text: யேசேருக்கு யேசேரியரின் குலம்; சில்லேமுக்கு சில்லேமியரின் குலம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: யெசேரிடமிருந்து
  rationale: மக்கள்தொகைக் கணக்கெடுப்புப் பட்டியலில் לְ என்பது குலத்தின் மூதாதையை அறிமுகப்படுத்துகிறது. தமிழில் வம்சத் தோற்றத்தை இயல்பாகக் காட்ட “-இடமிருந்து” பயன்படுத்தப்பட்டது; பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இங்கு מִשְׁפָּחָה என்பது தனிக்குடும்பத்தை அல்ல, கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவைக் குறிக்கிறது. ஆகவே “குலம்” பொருத்தமானது.
- source_word: הַ/יִּצְרִי
  choice: யெசேரியர்
  rationale: யெசேரின் வழிவந்தவர்களைக் குறிக்கும் இன/குலப் பெயர். மூலப் பெயருடனான தொடர்பைத் தெளிவாக வைத்திருக்க “யெசேரியர்” என அமைக்கப்பட்டது.
- source_word: לְ/שִׁלֵּם
  choice: சில்லேமிடமிருந்து
  rationale: முந்தைய கூறைப் போலவே, לְ குலத்தின் மூதாதையை அறிமுகப்படுத்துவதால் தமிழில் “-இடமிருந்து” என வழங்கப்பட்டது; பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַ/שִּׁלֵּמִי
  choice: சில்லேமியர்
  rationale: சில்லேமின் வழிவந்தவர்களைக் குறிக்கும் குலப்பெயர். தமிழில் இயல்பான மக்கள்/வம்சப் பெயராக “சில்லேமியர்” பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் நடையில், கணக்கெடுப்புப் பட்டியலின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டது. “குடும்பம்” என்பதற்குப் பதிலாக சமூக-கோத்திரப் பிரிவைத் தெளிவாக்க “குலம்” தேர்ந்தெடுக்கப்பட்டது.
