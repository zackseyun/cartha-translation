  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: ta
  text: இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்கள்—எகிப்து நாட்டிலிருந்து வெளியே வந்த இஸ்ரயேலருக்கும் மோசேக்கும் யாவே கட்டளையிட்டபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உள்ளவர்களை
  rationale: எபிரேய வயது-வரம்புச் சொற்றொடரின் பொருள் இருபது வயது நிறைந்தவர்களையும் அதற்கு மேற்பட்டவர்களையும் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட இறைக் கட்டளையுடன் நிகழ்ந்த செயலை ஒப்பிடும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: வினைச்சொல்லின் அதிகாரமுள்ள கட்டளைப் பொருளை மெலிதாக்காமல் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலருக்கும்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரயேலின் மகன்கள்' என்றாலும், இங்கு மக்களினத்தைக் கூட்டாகக் குறிக்கும் வழக்கமான பெயராக இருப்பதால் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து வெளியே வந்த
  rationale: எகிப்திலிருந்து புறப்பட்ட வரலாற்றுத் தலைமுறையை அடையாளப்படுத்தும் பெயரெச்சத் தொடரை நேராகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, தனிப்பட்ட தெய்வீகப் பெயரைப் பயன்படுத்துகிறது; ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: வசனத்தின் முற்றுப்பெறாத எபிரேயத் தொடரைத் தமிழில் அமைத்தல்
  choice: முந்தைய வசனங்களிலிருந்து ‘கணக்கெடுங்கள்’ என்பதையும், செயல் நிறைவேற்றப்பட்டதைத் தெரிவிக்கும் ‘அவர்கள் கணக்கெடுத்தார்கள்’ என்பதையும் வெளிப்படையாக வழங்குதல்
  alternative: ‘இருபது வயது முதல் அதற்கு மேற்பட்டவர்கள்—யாவே கட்டளையிட்டபடியே...’ என்று முற்றுப்பெறாத தொடராக விடுதல்
  rationale: எபிரேயத்தில் இந்த வசனம் முந்தைய கட்டளையையும் தொடர்ந்து வரும் பட்டியலையும் சார்ந்த சுருக்கமான தொடராக உள்ளது. வாசிக்கத்தக்க தமிழுக்காகச் சூழலில் தெளிவாக உள்ள செயல் நிரப்பப்பட்டுள்ளது; அது அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘யாவே’ என்பது தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு; ‘இஸ்ரயேலர்’ என்பது மக்களைக் கூட்டாகக் குறிக்கும் இயல்பான வடிவம்.
