lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்
  rationale: וְ தொடர்ச்சியைச் சுட்டுகிறது; ஆனால் எபிரேய உரையில் בְנֵי என்ற பன்மை வடிவம் இருந்தாலும் ஒரே பெயரான எலியாப் மட்டுமே வருவதால், தமிழில் இயல்பாகவும் எண்ணிக்கைக்கு இசைவாகவும் ஒருமை வடிவம் பயன்படுத்தப்பட்டது. வசனப் பிரிப்பு முன் வசனத்துடன் உள்ள தொடர்ச்சியை ஏற்கெனவே காட்டுவதால் தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: פַלּוּא
  choice: பல்லூ
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֱלִיאָב
  choice: எலியாப்
  rationale: எபிரேய தனிப்பெயர் வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவத்தில் எழுத்துப்பெயர்க்கப்பட்டது.
