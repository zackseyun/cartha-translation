revisions:
- from: பேலாவின் மகன்கள் அர்தும் நாமானும். அர்திலிருந்து அர்தியர் குலம்; நாமானிலிருந்து நாமியர் குலம்[a].
  to: 'பேலாவின் மகன்கள்: அர்தும் நாமானும்; அர்திலிருந்து அர்தியரின் குலம்; நாமானிலிருந்து நாமியரின் குலம்[a].'
  rationale: The revision preserves all names, the two descent/clan relationships, and the Hebrew-derived gentilic distinction. It improves Tamil list punctuation and makes the repeated clan construction explicit and parallel. The lexical-alternative footnote remains anchored to “நாமியரின்.”
  reviewer_model: gpt-5.6-terra
