source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: ta
  text: 'பேலாவின் மகன்கள்: அர்தும் நாமானும்; அர்திலிருந்து அர்தியரின் குலம்; நாமானிலிருந்து நாமியரின் குலம்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாமியர்’ என்பது நாமான் என்ற பெயரிலிருந்து உருவான எபிரேய வம்சப்பெயர்; இதைத் தெளிவாக ‘நாமானியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי בֶלַע
  choice: பேலாவின் மகன்கள் ...
  rationale: வம்சப்பட்டியல் சூழலில் בְנֵי என்பது நேரடியாக ‘மகன்கள்’ எனப் பொருள்படும். வַיִּהְיוּ குறிக்கும் பட்டியல் தொடர்ச்சி தமிழில் இயல்பான பெயர்ச்சொல் வாக்கியமாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אַרְדְּ וְנַעֲמָן
  choice: அர்தும் நாமானும்
  rationale: இரு ஆள்பெயர்களும் எபிரெய ஒலிவடிவத்தை நெருக்கமாகப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டுள்ளன; இணைப்பும் தமிழின் ‘உம் ... உம்’ அமைப்பால் தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: எண்ணாகமத்தின் மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் இது ஒரு கோத்திரத்துக்குள் உள்ள வம்சவழிக் குழுவைக் குறிக்கிறது; நவீன தமிழில் ‘குலம்’ அதனைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: הָאַרְדִּי
  choice: அர்தியர்
  rationale: அர்திலிருந்து வந்தவர்களைக் குறிக்கும் எபிரெய வம்சப்பெயர் வடிவம் தமிழில் இயல்பாக ‘அர்தியர்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְנַעֲמָן
  choice: நாமானிலிருந்து
  rationale: இங்குள்ள לְ வம்சத் தொடர்பையோ தோற்றத்தையோ குறிக்கிறது; ‘நாமானிலிருந்து’ என்பது அந்த மரபுவழித் தோற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַנַּעֲמִי
  choice: நாமியர்
  rationale: நாமானிலிருந்து உருவான எபிரெய வம்சப்பெயரின் சுருக்கப்பட்ட வடிவத்தை ‘நாமியர்’ பிரதிபலிக்கிறது; தெளிவான மாற்றுவடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
