  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வசனத்தின் கணக்கெடுப்பு சார்ந்த நிர்வாக நடையும், ‘மகன்கள்’ என்ற வம்சவழிப் பயன்பாடும் பாதுகாக்கப்பட்டுள்ளன.
