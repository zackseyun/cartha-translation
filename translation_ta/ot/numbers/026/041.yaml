  source_fidelity: 'மூல எபிரேயத்தின் கூறுகள் அனைத்தும் துல்லியமாக உள்ளன: “இவர்கள்” (אֵלֶּה), பென்யமீனின் மகன்கள், அவர்களுடைய குலங்களின்படியான வகைப்படுத்தல், அவர்களிலிருந்து கணக்கிடப்பட்டோர், மற்றும் 45,600 என்ற எண்ணிக்கை. “அவர்களில் கணக்கிடப்பட்டவர்கள்” என்பது וּפְקֻדֵיהֶם என்பதன் கணக்கெடுப்பு/பதிவுசெய்யப்பட்டோர் என்ற பொருளைச் சரியாகத் தெரிவிக்கிறது.'
