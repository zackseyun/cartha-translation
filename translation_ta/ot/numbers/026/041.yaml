  terminology: “பென்யமீன்,” “மகன்கள்,” “குலங்கள்,” மற்றும் “கணக்கிடப்பட்டவர்கள்” ஆகியவை சூழலுக்கும் மூலத்திற்கும் ஏற்றவையாக உள்ளன. “மகன்கள்” இங்கு வம்ச/சந்ததி குறிக்கும் வேதாகமப் பயன்பாட்டைத் தக்கவைக்கிறது; தேவையற்ற விளக்கவுரையோ கோட்பாட்டுச் சாயலோ இல்லை.
