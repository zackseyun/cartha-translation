  text: எஸ்ரோனிடமிருந்து[a] எஸ்ரோனியரின் குலம்; கர்மியிடமிருந்து கர்மியரின் குலம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஸ்ரோனுக்காக … கர்மிக்காக”; எபிரெய முன்னிடைச்சொல்லை இவ்வாறு சொற்பொருளுக்கு நெருக்கமாக மொழிபெயர்க்கலாம். ஆனால் இங்கு அது வம்சாவளி மற்றும் மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில், ஒருவரிடமிருந்து வந்த சந்ததியையோ அவருக்குரிய குல வகைப்பாட்டையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: எஸ்ரோனிடமிருந்து
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு சார்ந்த இந்த வம்சப்பட்டியல் சூழலில் לְ என்பது எஸ்ரோனிலிருந்து வந்த வம்சத் தொடர்பையோ வகைப்பாட்டையோ குறிக்கிறது. ‘எஸ்ரோனிடமிருந்து’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இங்கு מִשְׁפָּחָה என்பது ஒரு கோத்திரத்துக்குள் உள்ள வம்சவழிக் குழுவைக் குறிக்கிறது; ‘குலம்’ நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַֽ/חֶצְרוֹנִי
  choice: எஸ்ரோனியரின்
  rationale: இந்த இனப்பெயர் வடிவம் எஸ்ரோனுடன் தொடர்புடைய சந்ததிக் குழுவைக் குறிக்கிறது. ‘எஸ்ரோனியர்’ அதன் கூட்டு மக்களைக் குறிக்க, உருபுடன் ‘எஸ்ரோனியரின் குலம்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְ/כַרְמִי
  choice: கர்மியிடமிருந்து
  rationale: முதல் தொடரைப் போலவே, இங்குள்ள לְ கர்மியிலிருந்து வந்த வம்சத் தொடர்பை அல்லது கணக்கெடுப்பு வகைப்பாட்டைக் குறிக்கிறது; இணை அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: மீண்டும் வரும் கணக்கெடுப்புச் சொல்லுக்கு ஒரே மொழிபெயர்ப்பு பயன்படுத்தப்பட்டு, மூலத்தின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַ/כַּרְמִי
  choice: கர்மியரின்
  rationale: இந்த இனப்பெயர் கர்மியின் சந்ததிக் குழுவைக் குறிக்கிறது. ‘கர்மியர்’ என்ற கூட்டு வடிவம் எஸ்ரோனியருடன் உள்ள இணை அமைப்பைத் தக்கவைக்கிறது.
