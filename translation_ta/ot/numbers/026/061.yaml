source:
  edition: WLC
  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: ta
  text: ஆனால் நாதாபும் அபியூவும் யாவேயின் திருமுன் வேற்று நெருப்பைச் செலுத்தியபோது இறந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேற்று நெருப்பு’ என்பதை ‘அந்நிய நெருப்பு’ என்றும் மொழிபெயர்க்கலாம். யாவேயின் திருமுன் செலுத்துவதற்கு அனுமதிக்கப்படாத அல்லது நியமிக்கப்படாத நெருப்பை எபிரெயச் சொற்றொடர் இங்கு குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்கள்
  rationale: எபிரெயத்தில் வினை ஒருமையில் வந்தாலும், அதைத் தொடர்ந்து நாதாப், அபியூ என்ற கூட்டெழுவாய் வருவதால் தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: נָדָב וַאֲבִיהוּא
  choice: நாதாபும் அபியூவும்
  rationale: எபிரெய தனிப்பெயர்களின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது; ‘உம்…உம்’ கூட்டிணைப்பைத் தெளிவாக்குகிறது.
- source_word: בְּהַקְרִיבָם
  choice: படைத்தபோது
  rationale: בְּ + தொழிற்பெயர் அமைப்பு இங்கு காலத்தைக் குறிக்கிறது. பலியாராதனைச் சூழலில் ‘படைத்தல்’ என்பது செலுத்துதல்/காணிக்கையாக்குதல் என்ற பொருளை இயல்பாக வழங்குகிறது.
- source_word: אֵשׁ זָרָה
  choice: வேற்று நெருப்பு
  rationale: זָרָה என்பதிலுள்ள ‘அந்நியமான/உரியதல்லாத’ என்ற அடிப்படைத் தன்மையைப் பாதுகாக்கிறது; ‘அங்கீகரிக்கப்படாத’ என்று மட்டும் மொழிபெயர்த்து பொருளை முன்கூட்டியே முழுமையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது. விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் திருமுன்
  rationale: לִפְנֵי என்பதன் இடவியல் மற்றும் வழிபாட்டுச் சூழலை ‘திருமுன்’ இயல்பாகக் காட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய வம்சவரிசைச் செய்தியிலிருந்து இந்த விதிவிலக்கான மரணக் குறிப்பை வேறுபடுத்திக் காட்டும் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட ஒலிப்பான ‘யாவே’ என்று எழுத்துப்பெயர்க்கிறது.
- issue: אֵשׁ זָרָה என்பதன் வழிபாட்டுப் பொருள்
  choice: வேற்று நெருப்பு
  alternative: அங்கீகரிக்கப்படாத நெருப்பு; அந்நிய நெருப்பு
  rationale: இந்தச் சொற்றொடர் முறையற்ற அல்லது அனுமதிக்கப்படாத நெருப்பைக் குறிக்கலாம்; முதன்மை உரையில் அதன் உருவகத்தைப் பாதுகாத்து, சாத்தியமான வழிபாட்டுப் பொருளை அடிக்குறிப்பில் விளக்குவது மூலத்தின் சுருக்கத்தையும் பொருள் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘திருமுன்’, ‘படைத்தல்’ ஆகியவை வழிபாட்டுச் சூழலைக் காட்டுகின்றன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
