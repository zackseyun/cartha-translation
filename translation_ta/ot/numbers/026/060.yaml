  yaml_path: translation/ot/numbers/026/060.yaml
  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: ta
  text: ஆரோனுக்கு நாதாப், அபிகூ [a], எலெயாசார், இத்தாமார் ஆகியோர் பிறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்கு சொல்: “ஆரோனுக்கு நாதாபும் அபிகூவும், எலெயாசாரும் இத்தாமாரும் பிறந்தான்”; வம்சவரலாற்றுக்குரிய இச்சொல்லமைப்பில் பல பெயர்கள் பட்டியலிடப்பட்டிருந்தாலும் ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: பிறந்தார்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவம் இங்கு பிறத்தலைக் குறிக்கும் செயப்பாட்டு/விளைவு பொருளில் வருகிறது. எபிரெயில் வினை ஒருமையில் இருந்தாலும், பல மகன்களின் பட்டியலை அறிமுகப்படுத்துவதால் இயல்பான தமிழில் பன்மை மரியாதையுடன் ‘பிறந்தார்கள்’ என வழங்கப்படுகிறது.
- source_word: לְאַהֲרֹן
  choice: ஆரோனுக்கு
  rationale: לְ முன்னொட்டு, இந்த வம்சவரலாற்றுச் சொல்லமைப்பில் மகன்கள் யாருக்குப் பிறந்தார்கள் என்பதைக் குறிக்கிறது; ‘ஆரோனுக்கு’ என்பது மூல அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: மீண்டும் வரும் אֶת நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் அதற்குத் தனிச் சொல் தேவையில்லை. பெயர்கள் ஒருங்கிணைந்த பட்டியலாக வழங்கப்படுகின்றன.
- source_word: נָדָב
  choice: நாதாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֲבִיהוּא
  choice: அபிகூ
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אִיתָמָר
  choice: இத்தாமார்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
