translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான வம்சவரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘ஆரோனுக்கு ... பிறந்தார்கள்’ என்ற அமைப்பு காக்கப்பட்டு, தமிழின் இயல்புக்கேற்ப வினை பன்மையில் வழங்கப்பட்டுள்ளது.
