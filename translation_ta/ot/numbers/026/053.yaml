  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: ta
  text: இவர்களுக்கு நிலம், பெயர்களின் எண்ணிக்கைக்கு ஏற்ப, மரபுரிமையாகப் பங்கிடப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நபர்களின் எண்ணிக்கைக்கு ஏற்ப”; சொல்லுக்கு சொல், “பெயர்களின் எண்ணிக்கைக்கு ஏற்ப.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: இவர்களுக்கு
  rationale: לְ முன்னொட்டின் பெறுநர் பொருளையும், அருகில் குறிப்பிடப்பட்ட மக்களைக் குறிக்கும் பன்மைச் சுட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵּחָלֵק
  choice: பங்கிடப்பட வேண்டும்
  rationale: חלק என்பதன் நிஃபால் வடிவிலுள்ள செயப்படுபொருள் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் எதிர்காலக் கட்டளையைக் குறிக்கும் கடமைப் பொருளையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இஸ்ரவேல் கோத்திரங்களுக்கு வழங்கப்படவிருக்கும் முழு நிலப்பரப்பைக் குறிக்கும் הָאָרֶץ என்பதற்கு இச்சூழலில் இயல்பான தமிழ் இணை.
- source_word: בְּנַחֲלָה
  choice: உரிமைச் சொத்தாக
  rationale: נַחֲלָה குறிக்கும் பரம்பரை வழி உரிமையையும் பங்காகப் பெறும் உடைமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּמִסְפַּר
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: பங்கீட்டின் அளவுகோலைக் குறிக்கும் בְּ முன்னொட்டின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: שֵׁמוֹת
  choice: பெயர்களின்
  rationale: எபிரெய மூலத்தின் நேரடியான ‘பெயர்கள்’ என்ற சொல்லைத் தக்கவைத்து, கணக்கெடுக்கப்பட்ட நபர்கள் என்பதான சூழல் பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
