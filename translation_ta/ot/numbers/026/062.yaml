base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: ta
  text: அவர்களில் கணக்கிடப்பட்டவர்கள் இருபத்து மூவாயிரம் பேர்; ஒரு மாத வயது தொடங்கி அதற்கு மேற்பட்ட ஆண்கள் அனைவரும் இதில் அடங்குவர். அவர்கள் இஸ்ரவேல் மக்களிடையே[a] கணக்கிடப்படவில்லை; ஏனெனில் இஸ்ரவேல் மக்களிடையே அவர்களுக்கு மரபுரிமைப் பங்கு கொடுக்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் வரும் இரண்டு இடங்களிலும், “இஸ்ரவேலின் மகன்களிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: அவர்களில் கணக்கிடப்பட்டவர்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது கணக்கில் சேர்க்கப்பட்டவர்களைக் குறிக்கிறது; எபிரெயச் சொல்லின் பெயர்ச்சொல் சார்ந்த பொருளையும் இயல்பான தமிழையும் இத்தேர்வு காக்கிறது.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: இருபத்து மூவாயிரம் பேர்
  rationale: எண்ணிக்கையைத் தெளிவாகத் தருகிறது; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுமுறைக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: அடுத்த சொற்றொடரில் ஒரு மாதக் குழந்தைகளும் அடங்குவதால், வயதுவந்த மனிதரை மட்டும் குறிக்கக்கூடிய சொல்லுக்குப் பதிலாக உயிரியல் பாலைக் குறிக்கும் துல்லியமான சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ஒரு மாத வயது தொடங்கி அதற்கு மேற்பட்ட
  rationale: குறைந்தபட்ச வயது வரம்பைத் தெரிவிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָתְפָּקְדוּ
  choice: கணக்கிடப்படவில்லை
  rationale: வசனத்தின் தொடக்கத்தில் வரும் அதே மக்கள்தொகைக் கணக்கெடுப்பு வேர்ச்சொல்லுடனான தொடர்பைத் தமிழிலும் காக்கிறது.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடையே
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற குடும்பவழி வடிவத்தின் கூட்டுமக்கள் பொருளை இயல்பான தமிழில் தருகிறது; சொற்சொல்லான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: அவர்களுக்கு உரிமைப்பங்கு கொடுக்கப்படவில்லை
  rationale: நிலப் பங்கீட்டுச் சூழலில் נַחֲלָה குறிக்கும் பரம்பரை உரிமையுள்ள பங்கைத் தெரிவிக்கிறது; மூலத்தின் செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தில் குடும்பவழிச் சொற்றொடர் இருந்தாலும், இங்கு அது உடன்படிக்கைச் சமூகமான இஸ்ரவேலரை மொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் இயல்பாக அந்தக் கூட்டுப் பொருளைத் தருகிறது; மூலத்தின் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காகப் பிரிக்கப்பட்டுள்ளது; இரு காரணவாக்கியங்களின் தொடர்பும், கணக்கெடுப்பு மற்றும் உரிமைப்பங்கு ஆகிய சூழல்சார் கருத்துகளும் பாதுகாக்கப்பட்டுள்ளன.
