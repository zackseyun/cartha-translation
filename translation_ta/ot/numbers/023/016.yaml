source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: ta
  text: யாவே பிலேயாமைச் சந்தித்தார்[a]; அவன் வாயில் ஒரு வார்த்தையை வைத்தார். பின்னர் யாவே, “பாலாக்கிடம் திரும்பிச் செல்; இவ்வாறு பேசு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிலேயாமிடம் வந்தார்’ அல்லது ‘பிலேயாமை எதிர்கொண்டார்.’
    reason: וַיִּקָּר என்ற வினை சந்தித்தல், ஒருவரிடம் வருதல், அல்லது எதிர்கொள்ளுதல் ஆகிய நெருங்கிய பொருள்நிழல்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: சந்தித்து
  rationale: קָרָה என்ற வினை இங்கு நேரடியான சந்திப்பு அல்லது எதிர்ப்படுதலைக் குறிக்கிறது. ‘சந்தித்து’ என்பது நிகழ்வை இயல்பாகத் தெரிவிப்பதோடு, தரிசனம் போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: அவன் வாயில் ஒரு வார்த்தையை வைத்தார்
  rationale: தெய்வத்தால் அளிக்கப்படும் உரையைக் குறிக்கும் எபிரெய மரபுத்தொடரையும், דָּבָר என்பதன் ஒருமையையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: דָּבָר
  choice: ஒரு வார்த்தை
  rationale: இங்கு பிலேயாம் உரைக்க வேண்டிய குறிப்பிட்ட சொல்லை அல்லது செய்தியைச் சுட்டுகிறது; ‘வார்த்தை’ மூலத்தின் வடிவத்தையும் தீர்க்கதரிசன உரைநடையையும் காக்கிறது.
- source_word: שׁוּב
  choice: திரும்பிப்போ
  rationale: பிலேயாம் பாலாக்கிடம் மீண்டும் செல்ல வேண்டும் என்ற கட்டளையை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְכֹה תְדַבֵּר
  choice: இப்படிப் பேசு
  rationale: כֹה என்பதன் ‘இவ்வாறு/இப்படி’ என்ற பொருளையும், தொடரவிருக்கும் உரைக்கான அறிமுகத்தையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, ‘யெகோவா’ என்ற பிற்கால வடிவத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன் வாயில் ஒரு வார்த்தையை வைத்தார்’ என்ற எபிரெய மரபுத்தொடர் அதன் தீர்க்கதரிசனத் தன்மையைக் காக்க நோக்கத்துடன் அப்படியே நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
