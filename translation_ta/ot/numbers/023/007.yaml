base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: ta
  text: 'பின்பு அவன் தன் கவியுரையை[a] எடுத்துரைத்துச் சொன்னான்:


    “ஆராமிலிருந்தும் கிழக்கின் மலைகளிலிருந்தும்[b] மோவாபின் அரசனான பாலாக் என்னை வழிநடத்தி வந்தான்:


    ‘வா, எனக்காக யாக்கோபைச் சபி;


    வா, இஸ்ரவேலைக் கண்டி[c]’ என்றான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவியுரை” என்பதற்கு “முறைப்படியான அறிவிப்பு” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் “அவன் தன் மாஷாலை எடுத்துக்கொண்டான்” என்று உள்ளது; இது உயர்நடையிலான ஒரு செய்யுள் உரையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கிழக்கத்திய மலைகளிலிருந்து” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொற்றொடர் மோவாபுக்கு கிழக்கே இருந்த பகுதியைப் புவியியல் ரீதியாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கே வரும் எபிரெய வினை, இதற்கு முன் “சபி” என்று மொழிபெயர்க்கப்பட்ட வினையிலிருந்து வேறுபட்டது. இதை “சீற்றத்துடன் சபி” என்றும் மொழிபெயர்க்கலாம்; “கண்டி” என்பது அதன் பகைமையான கண்டனத் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: தன் கவியுரையை எடுத்துரைத்தான்
  rationale: இந்த எபிரெய மரபுத்தொடர் ஓர் உயர்நடையிலான, முறைப்படியான செய்யுள் அறிவிப்பை அறிமுகப்படுத்துகிறது. “கவியுரை” என்பது இங்கு מָשָׁל என்பதன் செய்யுள் தன்மையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; “பழமொழி” என்பது பொருளை அளவுக்கு மீறிக் குறுக்கும், “இறைவாக்கு” என்பது தீர்க்கதரிசனத் தன்மையை மூலத்தைவிட அதிகமாகத் தெளிவுபடுத்தக்கூடும்.
- source_word: מִן אֲרָם
  choice: ஆராமிலிருந்து
  rationale: ஆராம் என்பது இடப்பெயர்; பிற்கால அரசியல் பெயரான “சிரியா” என்று மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַנְחֵנִי
  choice: என்னை வழிநடத்தி வந்தான்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் வழிநடத்துதல் அல்லது அழைத்துச் செல்லுதல் என்ற காரணவினைப் பொருளைக் கொண்டது. பாலாக் பிலேயாமை வரவழைத்த நிகழ்வுக்கு “வழிநடத்தி வந்தான்” பொருத்தமாக உள்ளது.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: கிழக்கின் மலைகளிலிருந்து
  rationale: קֶדֶם இங்கு ஆராமுடன் இணைந்த புவியியல் குறிப்பாக, “கிழக்கு” என்ற இடப்பொருளில் புரிந்துகொள்ளப்படுகிறது. “பண்டைய மலைகள்” என்பது வேறு சூழல்களில் சாத்தியமானாலும் இங்கு குறைவாகப் பொருந்துகிறது.
- source_word: לְכָה
  choice: வா
  rationale: நேரடிக் கூற்றில் அழைப்பு அல்லது ஏவலைக் குறிக்கும் கட்டளை வடிவம்; தமிழில் “வா” இயல்பானது.
- source_word: אָרָה
  choice: சபி
  rationale: இந்த வினை தெளிவாகச் சாபமிடுவதைக் குறிக்கிறது; எளிய தமிழ் வினையான “சபி” துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִּי
  choice: எனக்காக
  rationale: இந்த வேற்றுமை உருபு பாலாக்கின் நலனுக்காகச் செயலைச் செய்ய வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தனிநபர் மற்றும் மக்களினப் பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் வைக்கப்பட்டுள்ளது.
- source_word: זֹעֲמָה
  choice: சபித்துரை
  rationale: இது முன் வந்த אָרָה என்பதிலிருந்து வேறுபட்ட வினை. “சபித்துரை” பகைமையுடன் தீங்கு கூறும் பொருளைக் காத்துக்கொண்டு, முதல் வினையுடன் உள்ள சொல் வேறுபாட்டையும் தமிழில் ஓரளவு வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தனிநபர் மற்றும் மக்களினப் பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாலாக்கின் மேற்கோள் வேண்டுகோளில் யாக்கோபு–இஸ்ரவேல் பெயர்களின் தொடர்பு
  choice: உடன்படிக்கை மக்களைக் குறிக்கும் இணைநிலைப் பெயர்களாக “யாக்கோபு” மற்றும் “இஸ்ரவேல்” இரண்டையும் தனித்தனியே காத்தல்
  alternative: இரண்டையும் ஒன்றாக்கி “இஸ்ரவேலர்” போன்ற ஒரே கூட்டுப்பெயராக மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதை திட்டமிட்டு “யாக்கோபு,” “இஸ்ரவேல்” என்ற இரு பெயர்களையும் இணைநிலையில் பயன்படுத்துகிறது. அவற்றைத் தனித்தனியே காப்பது இலக்கிய மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பை நிலைநிறுத்துகிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைத் தன்மையும் கண்ணியமான நேரடிக் கூற்றும் காக்கப்பட்டுள்ளன. மிக அரிதான சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; அதேவேளை எபிரெய இணைநிலையும் இரண்டு வேறுபட்ட சாப வினைகளும் ஒன்றாக்கப்படவில்லை.
