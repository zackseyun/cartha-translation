source:
  edition: WLC
  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: ta
  text: பின்பு பாலாக், பிலேயாமைப் பாழ்நிலத்தை மேலிருந்து நோக்கியிருக்கும் பேயோரின் உச்சிக்குக் கூட்டிக்கொண்டு போனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஷிமோனை மேலிருந்து நோக்கியிருக்கும்.” எபிரேயச் சொல் பாழ்நிலத்தைக் குறிக்கும் பொதுப்பெயராகவோ, “யெஷிமோன்” என்ற இடப்பெயராகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு ... கூட்டிக்கொண்டு போனான்
  rationale: வாவ்-தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. இச்சூழலில் לקח என்பது ஒருவரை ஓர் இடத்துக்குக் கொண்டுசெல்வதைக் குறிக்கிறது; இயல்பான தமிழில் ‘கூட்டிக்கொண்டு போனான்’ என்று வழங்கப்பட்டது.
- source_word: בָּלָק
  choice: பாலாக்
  rationale: தனிநபர் பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டது.
- source_word: אֶת בִּלְעָם
  choice: பிலேயாமை
  rationale: אֶת நேரடிச் செயப்படுபொருள் குறியீடு தமிழ் வேற்றுமை உருபான ‘ஐ’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டது; பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: רֹאשׁ
  choice: உச்சி
  rationale: நிலவியல் சூழலில் רֹאשׁ ஓர் உயரமான இடத்தின் மேற்பகுதி அல்லது சிகரத்தைக் குறிக்கிறது; ‘உச்சி’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַפְּעוֹר
  choice: பேயோர்
  rationale: இடப்பெயர் தமிழ் ஒலியமைப்புக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது; எபிரெயக் குறிப்புச் சுட்டு தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הַנִּשְׁקָף
  choice: நோக்கியிருக்கும்
  rationale: שׁקף என்பதன் நிஃபால் எச்சவடிவம் உயர்ந்த இடத்திலிருந்து ஒரு பகுதியை நோக்கி நிற்பதை அல்லது அதன்மேல் பார்வை கொண்டிருப்பதைச் சுட்டுகிறது. ‘நோக்கியிருக்கும்’ இயல்பான நிலவியல் விளக்கமாகும்.
- source_word: עַל פְּנֵי
  choice: நோக்கி
  rationale: சொல்லுக்குச் சொல் ‘முகத்தின்மேல்’ என்ற உருவகம் தமிழில் இங்கு இயல்பற்றது. இடத்தின் திசை/பார்வை உறவை ‘நோக்கி’ தெளிவாகக் காட்டுகிறது.
- source_word: הַיְשִׁימֹן
  choice: பாழ்நிலம்
  rationale: יְשִׁימֹן என்பது வெறுமையான, பாழான வனாந்தரப் பகுதியைக் குறிக்கலாம். ‘பாழ்நிலம்’ அதன் விளக்கப் பொருளைத் தெளிவாகத் தருகிறது; இது இடப்பெயராகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டது.
