  text: וַ/יַּ֖עַן וַ/יֹּאמַ֑ר הֲ/לֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהוָה֙ בְּ/פִ֔/י אֹת֥/וֹ אֶשְׁמֹ֖ר לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: ta
  text: அவன் பதிலளித்துச் சொன்னான், “யாவே என் வாயில் வைப்பதையே கவனமாகப் பேச வேண்டாமா?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவே என் வாயில் வைப்பதைக் கடைப்பிடித்துப் பேச வேண்டாமா?” என்று மேலும் நேரடியாகக் கூறப்பட்டுள்ளது. இங்குள்ள வினைச்சொல், பேசும்போது கொடுக்கப்பட்டவற்றை கவனமாகப் பின்பற்றுவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: அதற்கு அவன் ... என்று பதிலளித்தான்
  rationale: எபிரெயக் கதையாடலில் வரும் ‘பதிலளித்து சொன்னான்’ என்ற இணைப்பை, இயல்பான நவீனத் தமிழில் ஒரே ‘பதிலளித்தான்’ என்னும் வினையால் தருகிறது.
- source_word: הֲלֹא
  choice: வேண்டாமா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவையும், பேச வேண்டிய கடப்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: வைப்பதையே
  rationale: முன்னரே வந்த பொருளை மீண்டும் சுட்டும் எபிரெய அமைப்பைத் தமிழில் வலியுறுத்தும் ‘ஏ’ விகுதியால் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יָשִׂים ... בְּפִי
  choice: என் வாயில் வைப்பதை
  rationale: கடவுள் பேசவேண்டிய சொற்களை அளிப்பதைக் குறிக்கும் மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற நேரடி பெயர் வடிவில் வழங்குகிறது.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: கவனமாகப் பேச
  rationale: שׁמר உடன் வரும் வினையெச்ச அமைப்பிலுள்ள கவனமான கடைப்பிடிப்பு என்ற நுண்ணுணர்வைப் பாதுகாக்கிறது; வெறுமனே ‘பேச’ என்று குறைக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துத் திருநாமமே உள்ளது. ஆகவே பெயரைப் பெயராகவே தருகிறது; தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: பிலேயாமின் பேச்சிலுள்ள கடப்பாடு மற்றும் கவனமான கடைப்பிடிப்பு
  choice: கவனமாகப் பேச வேண்டாமா?
  alternative: பேச வேண்டாமா?
  rationale: הֲלֹא கடப்பாட்டை உணர்த்துகிறது; אֶשְׁמֹר לְדַבֵּר கொடுக்கப்பட்டதைத் துல்லியமாகக் கடைப்பிடித்துப் பேசும் கருத்தையும் கொண்டிருக்கலாம். ‘கவனமாக’ என்பது அந்த நுண்ணுணர்வைத் தக்கவைக்கிறது; இயந்திரக் கட்டுப்பாட்டை மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல்லடுக்கை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது; அதேவேளை ‘என் வாயில் வைப்பது’ என்ற மூல உருவகமும் שׁמר என்பதின் கவனமான கடைப்பிடிப்பு நுண்ணுணர்வும் பாதுகாக்கப்பட்டுள்ளன.
