  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: ta
  text: பின்பு அவன் அவனிடம் திரும்பி வந்தான். இதோ, அவனும் மோவாபின் தலைவர்கள் அனைவரும் அவனுடைய தகனபலியின் அருகில் நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: பின்பு அவன் அவனிடம் திரும்பி வந்தான்
  rationale: எபிரேய உரையில் இருவரின் பெயர்களும் குறிப்பிடப்படாமல் பிரதிப்பெயர்கள் இருப்பதால், அந்த இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியின் உடனடித்தன்மையையும் கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் உத்தியையும் தக்கவைக்கிறது.
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: தன் தகனபலியின் அருகில் நின்றுகொண்டிருந்தான்
  rationale: עַל இங்கு பலியின்மேல் உடலளவில் நிற்பதைக் குறிக்காமல் அதன் பக்கத்தில் அல்லது அருகில் நிற்பதைக் குறிக்கிறது; עֹלָה என்பதற்கான வழக்கமான பலியியல் சொல் ‘தகனபலி’.
- source_word: שָׂרֵי מוֹאָב
  choice: மோவாபின் தலைவர்கள்
  rationale: שָׂרִים என்பது அரசியல் அல்லது சமூக முதன்மை வகிப்போரைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் பரந்த பொருளுடனும் ‘தலைவர்கள்’ அமைகிறது.
theological_decisions: []
