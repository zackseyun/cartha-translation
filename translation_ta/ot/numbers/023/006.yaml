  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. மூலத்தில் உள்ள பிரதிப்பெயர் சார்ந்த தெளிவின்மை விளக்கப் பெயர்களைச் சேர்க்காமல் பாதுகாக்கப்பட்டது; கடைசி உறுப்பின் இணைநிலையைத் தமிழில் தெளிவாக்க வினை மீளுரைக்கப்பட்டது.
