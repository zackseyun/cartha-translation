  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: ta
  text: இதோ, ஒரு மக்கள் கூட்டம் பெண் சிங்கத்தைப்போல் எழுகிறது[a]; சிங்கத்தைப்போல் நிமிர்ந்து நிற்கிறது. இரையைத் தின்று, கொல்லப்பட்டோரின் இரத்தத்தைக் குடிக்கும்வரை அது படுத்துக்கொள்ளாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிங்கத்தைப்போல்.’ எபிரெய லாவீ (לָבִיא) என்ற சொல்லை பொதுவாக ‘சிங்கம்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அடுத்ததாக வரும் அரீ (אֲרִי, ‘சிங்கம்’) என்ற சொல்லிலிருந்து உள்ள சொல் வேறுபாட்டைக் காக்க ‘பெண் சிங்கம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: இதோ
  rationale: வலியுறுத்தி கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் ஆற்றலை, இயல்பானதும் கண்ணியமானதுமான தமிழில் தருகிறது.
- source_word: עָם
  choice: ஒரு மக்கள்
  rationale: இஸ்ரவேலை ஒரு கூட்டுமக்களாகக் குறிப்பிடும் பொருளைப் பாதுகாக்கிறது; ‘ஒரு நாடு’ என்பதைக் காட்டிலும் மூலத்தின் கூட்டுப்பொருளுக்கு நெருக்கமானது.
- source_word: כְּלָבִיא
  choice: பெண் சிங்கத்தைப்போல்
  rationale: לָבִיא என்பது பொதுவாக ‘சிங்கம்’ என்றும் பொருள்படலாம்; இங்கு அடுத்துள்ள אֲרִי என்பதிலிருந்து சொல் வேறுபாட்டைக் காக்க ‘பெண் சிங்கம்’ என வழங்கப்பட்டுள்ளது.
- source_word: יָקוּם
  choice: எழும்புகிறார்கள்
  rationale: வேட்டைவிலங்கு எழுந்து நிற்கும் கவித்துவப் படிமத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכַאֲרִי
  choice: சிங்கத்தைப்போல்
  rationale: אֲרִי என்பதன் பொதுவான பொருளைத் துல்லியமாகத் தருவதோடு, முந்தைய לָבִיא உடனான இணை அமைப்பையும் காக்கிறது.
- source_word: יִתְנַשָּׂא
  choice: தங்களை உயர்த்துகிறார்கள்
  rationale: விலங்கு கம்பீரமாக நிமிர்ந்து எழும் காட்சியைப் பிரதிபலிக்கிறது; அருவமான ஆன்மிக ‘மேன்மைப்படுத்துதல்’ என்ற பொருளைத் திணிக்கவில்லை.
- source_word: לֹא יִשְׁכַּב
  choice: படுத்துக்கொள்ள மாட்டார்கள்
  rationale: உருவகத்தில் தொடரும் விலங்கின் உடல்சார் படிமத்தையும், முடிவு எட்டும்வரை ஓயாத தன்மையையும் காக்கிறது.
- source_word: עַד יֹאכַל טֶרֶף
  choice: இரையைத் தின்று ... வரை
  rationale: יֹאכַל என்பதன் அடிப்படைப் பொருளான ‘தின்னுதல்’ என்பதை மிகைப்படுத்தாமல் தருகிறது; טֶרֶף என்பதைக் ‘இரை’ என இயல்பாக மொழிபெயர்க்கிறது.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: கொல்லப்பட்டவர்களின் இரத்தத்தைக் குடிக்கும்வரை
  rationale: போர்ச் சூழலில் חֲלָלִים என்பது கொல்லப்பட்டவர்களைக் குறிக்கிறது; மூலத்தின் கடுமையான வெற்றி உருவகத்தை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: பிலேயாமின் உரையில் உள்ள வன்முறைப் படிமம்
  choice: இரையைத் தின்னுதல், கொல்லப்பட்டவர்களின் இரத்தத்தைக் குடித்தல் ஆகிய கடுமையான உருவகங்களை அப்படியே வைத்தல்
  alternative: பொதுவான வெற்றி அல்லது வல்லமை பற்றிய மென்மையான மொழியாக மாற்றுதல்
  rationale: எபிரெய உரை திட்டமிட்டே தீவிரமான வேட்டையாடும் சிங்கத்தின் படிமத்தைப் பயன்படுத்துகிறது. இது தடுக்க முடியாத போர்வெற்றியை உருவகமாகச் சித்தரிக்கிறது; இரத்தம் குடிப்பதை நேரடியாகக் கட்டளையிடுவதில்லை. ஆகவே அதன் இறையியல் பதற்றத்தைத் தணிக்காமல் வைத்திருக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான தீர்க்கவுரைத் தொனியையும் சிங்க உருவகத்தின் இயக்கத்தையும் காக்கும் கண்ணியமான நடை. ‘மக்கள்’ என்பது இலக்கண வடிவில் ஒருமையாக இருந்தாலும், தமிழில் மனிதக் கூட்டத்தை இயல்பாகச் சுட்ட பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
