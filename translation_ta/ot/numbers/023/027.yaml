source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: ta
  text: அப்போது பாலாக் பிலேயாமிடம், “தயவுசெய்து வாருங்கள்; உங்களை வேறொரு இடத்திற்கு அழைத்துச் செல்கிறேன். ஒருவேளை அது கடவுளின் பார்வையில் சரியானதாக இருக்கும்[a]; அங்கிருந்து அவனை எனக்காகச் சபியுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது கடவுளின் பார்வையில் விருப்பமானதாக இருக்கும்.” எபிரேய மரபுத்தொடர் ஒருவரின் பார்வையில் ஒன்று ‘சரியாக’ அல்லது ‘விருப்பமாக’ இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: தயவுசெய்து வாரும்
  rationale: הלך என்பதன் கட்டளை வடிவம் இங்கு அழைப்பாக வருகிறது; נָּא வேண்டுகோளின் தொனியை மென்மையாக்குகிறது. மரியாதையுடனான ஒருமை உரையாடலுக்கு ‘வாரும்’ இயல்பானது.
- source_word: אֶקָּחֲךָ
  choice: உம்மை ... அழைத்துச் செல்கிறேன்
  rationale: முறையாக இது முதல் நபர் நிறைவுறாத வினை; இச்சூழலில் அழைப்பைத் தொடரும் விருப்பத் தொனியைக் கொண்டது. தமிழில் ‘அழைத்துச் செல்கிறேன்’ இயல்பாகவும் திசை உணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: מָקוֹם אַחֵר
  choice: வேறொரு இடம்
  rationale: பார்வைநிலையை மாற்றும் மற்றொரு குறிப்பிட்ட இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: பாலாக்கின் நம்பிக்கையைத் தெரிவிக்கிறது; உறுதியைக் குறிக்காது.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: அது கடவுளின் பார்வையில் சரியானதாக இருக்கும்
  rationale: ישר בעיני என்ற எபிரேய மரபுத்தொடரின் ‘ஒருவரின் பார்வையில் சரியாக/விருப்பமாக இருத்தல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. வெளிப்படையாகச் சொல்லப்படாத எழுவாயை முன்மொழியப்பட்ட செயல் அல்லது சூழல் எனக் குறிக்க ‘அது’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: உடனடிக் கதையோட்டத்தில் பிலேயாம் விசாரிக்கும் இஸ்ரவேலின் கடவுளே குறிக்கப்படுகிறார்; பொதுவான ஒரு தெய்வம் என்று மொழிபெயர்ப்பதற்கான அவசியம் இல்லை.
- source_word: וְקַבֹּתוֹ לִי
  choice: நீர் அவனை எனக்காகச் சபிக்கலாம்
  rationale: קבב என்பது ‘சபித்தல்.’ இவ்வடிவம் பாலாக்கின் நோக்கத்தையும் வேண்டுகோளையும் தொடர்கிறது. ‘அவனை’ என்பது இஸ்ரவேல் மக்களை ஒரே கூட்டாகச் சுட்டும் எபிரேய ஒருமை பின்னொட்டைப் பிரதிபலிக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: புதிய இடத்திலிருந்து சபிக்க வேண்டும் என்ற இடஞ்சார்ந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பாலாக்கின் பேச்சில் הָאֱלֹהִים யாரைக் குறிக்கிறது
  choice: பிலேயாம் விசாரிக்கும் உண்மைக் கடவுளைக் குறிக்கும் ‘கடவுள்’
  alternative: ‘அந்தத் தெய்வம்’ அல்லது ‘ஒரு தெய்வம்’
  rationale: உடனடிக் கதையோட்டத்தில் பிலேயாம் இஸ்ரவேலின் கடவுளால் கட்டுப்படுத்தப்படுகிறார். இடத்தை மாற்றினால் கடவுள் அனுமதிப்பது மாறக்கூடும் என்று பாலாக் நம்புகிறான்; ஆகவே ‘கடவுள்’ என்பது கதையின் குறிப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- issue: יִישַׁר בְּעֵינֵי என்பதன் மதிப்பீட்டு நுணுக்கம்
  choice: ‘கடவுளின் பார்வையில் சரியானதாக இருக்கும்’ என்பதை முதன்மை உரையில் வைத்து, ‘விருப்பமானதாக இருக்கும்’ என்பதை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையில் ‘கடவுளுக்கு விருப்பமானதாக இருக்கும்’
  rationale: மூல மரபுத்தொடர் ‘சரி’ மற்றும் ‘விருப்பம்’ ஆகிய இரு நுணுக்கங்களையும் அனுமதிக்கிறது. ஒன்றை இறையியல் ரீதியாகத் தீர்மானிக்காமல் மாற்றுப் பொருளை வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. பாலாக் பிலேயாமிடம் பேசுவதால் ‘உம்மை/நீர்/வாரும்’ என்ற மரியாதை ஒருமை தொடர்ச்சியாகக் கையாளப்பட்டுள்ளது. எபிரேய ‘கண்களில்’ என்ற சொற்சொல் வடிவத்துக்குப் பதிலாக இயல்பான தமிழ் மரபுத்தொடரான ‘பார்வையில்’ பயன்படுத்தப்பட்டது; மூலத்தின் பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
