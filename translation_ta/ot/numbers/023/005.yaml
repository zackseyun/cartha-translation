  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: ta
  text: அப்போது யாவே பிலேயாமின் வாயில் ஒரு வார்த்தையை வைத்து, “பாலாக்கிடம் திரும்பிப் போ; இவ்வாறே பேசு” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்து
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வை/இடு’. ‘வாயில் ஒரு வார்த்தையை வைத்து’ என்பது எபிரேய உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: דָּבָר
  choice: ஒரு வார்த்தையை
  rationale: ஒருமை எண்ணையும், கடவுள் பேச வேண்டிய சொல்லை வழங்கும் உருவகத்தையும் காக்கிறது; ‘செய்தி’ என்பது சாத்தியமானதாயினும் சற்று விளக்கமான மொழிபெயர்ப்பு.
- source_word: בְּפִי בִלְעָם
  choice: பிலேயாமின் வாயில்
  rationale: மூலத்தின் ‘பிலேயாமின் வாயில்’ என்ற தெளிவான உருவகத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: שׁוּב אֶל בָּלָק
  choice: பாலாக்கிடம் திரும்பிப் போ
  rationale: שׁוּב என்பதன் திரும்பிச் செல்லும் கட்டளையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכֹה תְדַבֵּר
  choice: இவ்வாறே பேசு
  rationale: כֹה என்பதன் ‘இவ்வாறு’ என்ற பொருளையும், תְדַבֵּר என்பதன் நேரடிக் கட்டளை வலிமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது நவீன ஆய்வறிவுக்கு ஏற்ற தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய ‘வாயில் வார்த்தையை வைத்தல்’ என்ற உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; வசனத்தின் நேரடிக் கட்டளைத் தொனியும் நிலைநிறுத்தப்பட்டுள்ளது.
