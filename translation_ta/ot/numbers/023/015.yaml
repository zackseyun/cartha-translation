source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: ta
  text: அவர் பாலாக்கிடம், “நீ உன் தகனபலியின் அருகே இங்கே நில்; நானோ அங்கே போய்ச் சந்திப்பேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அங்கே சந்திப்பேன்,” அல்லது “அங்கே எனக்கு ஒரு சந்திப்பு நிகழும்.” எபிரெய வினைச்சொல் சுருக்கமானது; யாரைச் சந்திப்பார் என்பது இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: அவர் பாலாக்கிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் நேரடி உரை அமைப்பில் வெளிப்படுத்துகிறது; பேசுபவர் சூழலிலிருந்து அறியப்படுவதால் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הִתְיַצֵּב
  choice: நில்
  rationale: Hitpael கட்டளை வடிவம் ஒரு குறிப்பிட்ட இடத்தில் நிலைகொண்டு நிற்பதைக் குறிக்கிறது. இச்சூழலில் ‘நில்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: כֹּה
  choice: இங்கே
  rationale: முதல் כֹּה, பாலாக் நிற்க வேண்டிய இடத்தைச் சுட்டும் இடவுணர்வில் வருகிறது.
- source_word: עַל עֹלָתֶךָ
  choice: உன் தகனபலியின் அருகே
  rationale: עַל இங்கு பலியோடு தொடர்புடைய இடத்தைக் குறிக்கிறது; עֹלָה முழுவதும் எரிக்கப்படும் தகனபலியாகும்.
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: வெளிப்படையாக வரும் முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலையும், ‘நீ இங்கே நில்—நானோ அங்கே…’ என்ற மெல்லிய எதிரிணையையும் காக்கிறது.
- source_word: אִקָּרֶה
  choice: போய்ச் சந்திப்பேன்
  rationale: קרה என்பதன் Niphal வடிவம் இங்கு ஒரு சந்திப்பு நிகழ்வதைச் சுருக்கமாகக் குறிக்கிறது. சூழலில் பாலாம் வேறோர் இடத்தில் தெய்வீகச் சந்திப்பை எதிர்பார்ப்பதால், இயல்பான தமிழில் ‘போய்ச் சந்திப்பேன்’ என வழங்கப்பட்டுள்ளது; குறிப்பிடப்படாத சந்திப்பின் பொருள் சேர்க்கப்படவில்லை.
- source_word: כֹּה
  choice: அங்கே
  rationale: இரண்டாம் כֹּה, பாலாக் நிற்கும் ‘இங்கே’ என்பதற்கு மாறான இடத்தைச் சுட்டுகிறது; ‘அங்கே’ அந்த இட வேறுபாட்டை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: பாலாம் சந்திக்கவிருப்பவரின் மறைமுகப் பொருள்
  choice: யாரைச் சந்திப்பார் என்பதை முதன்மை உரையில் குறிப்பிடாமல், ‘போய்ச் சந்திப்பேன்’ என்று மொழிபெயர்த்தல்
  alternative: சூழலின் அடிப்படையில் ‘அவரைச் சந்திக்கச் செல்வேன்’ என்று மறைமுகப் பொருளைச் சேர்த்தல்
  rationale: இந்த வசனத்தின் எபிரெய உரை சந்திப்பின் பொருளை வெளிப்படையாகக் குறிப்பிடவில்லை. பரந்த சூழல் ஆண்டவருடனான சந்திப்பைக் குறித்தாலும், தமிழில் பொருளைச் சேர்க்காமல் விடுவது மூலத்தின் சுருக்கத்தையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தகனபலி’ என்பது வேதாகமப் பலியியல் சொல்லாட்சியின் துல்லியத்தைப் பேணுகிறது. ‘நானோ’ மற்றும் ‘இங்கே/அங்கே’ ஆகியவை மூலத்தில் உள்ள எதிரிணையையும் இடச்சுட்டு வேறுபாட்டையும் தெளிவாக்குகின்றன.
