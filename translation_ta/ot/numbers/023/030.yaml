reference: Numbers 23:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: ta
  text: ஆகவே, பிலேயாம் சொன்னபடியே பாலாக் செய்து, பலிபீடத்தின்மேல் ஒரு காளையையும் ஒரு செம்மறியாட்டுக் கடாவையும் பலியிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: כַּאֲשֶׁר אָמַר என்பதுடன் இணைந்து, பிலேயாம் கூறியபடி பாலாக் செயல்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: சொன்னபடியே
  rationale: பிலேயாம் குறிப்பிட்ட முறைக்கு பாலாக் இணங்கி நடந்தான் என்ற ஒப்புமை மற்றும் இணக்கப் பொருளைப் பேச்சுவழக்காகாமல் இயல்பாகத் தருகிறது.
- source_word: אָמַר
  choice: சொன்ன
  rationale: பாலாக்கின் செயலுக்கு முன் பிலேயாம் கூறியதைத் தமிழ் வினையெச்சத் தொடர்பு இயல்பாகக் காட்டுகிறது; தனியே இறந்தகால முற்றுவினை தேவையில்லை.
- source_word: וַיַּעַל
  choice: பலியிட்டான்
  rationale: עלה என்பது இங்கு பலியிடுதல் சார்ந்த தொழில்நுட்பப் பொருளில் வருகிறது. தமிழில் ‘பலியிட்டான்’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: פָּר
  choice: ஒரு காளை
  rationale: பலிக்குரிய ஆண் மாட்டைக் குறிக்கும் தெளிவான, நவீனத் தமிழ் சொல்.
- source_word: אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל குறிக்கும் முதிர்ந்த ஆண் செம்மறியாட்டைத் துல்லியமாக வேறுபடுத்துகிறது; ‘கடா’ மட்டும் சில சூழல்களில் தெளிவற்றதாக இருக்கலாம்.
- source_word: בַּמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: பலியிடும் சூழலில் בְּ முன்னொட்டு குறிக்கும் இடத்தைத் துல்லியமாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: וַ
  choice: ஆகவே
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து நிகழும் விளைவுசார் கதை ஓட்டத்தை இயல்பான தமிழில் காட்டுகிறது.
