translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் வரிசையை இயன்றவரை காத்தபடியே தமிழ் இயல்பிற்காக வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
