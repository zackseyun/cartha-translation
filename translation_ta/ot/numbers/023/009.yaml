base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: ta
  text: ஏனெனில், பாறை உச்சிகளிலிருந்து அவனைப் பார்க்கிறேன்; குன்றுகளிலிருந்து அவனை உற்றுநோக்குகிறேன். இதோ, தனியே குடியிருக்கும், பிற தேசங்களோடு தன்னை எண்ணிக்கொள்ளாத ஒரு மக்கள் இனம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற தேசங்களோடு எண்ணப்படாத ஒரு மக்கள் இனம்.” எபிரெய வினைச்சொல்லைத் தற்சுட்டு/நடுநிலைப் பொருளிலும் செயப்பாட்டுப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பிலேயாமின் உரையில் தொடர்ந்து வரும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מֵרֹאשׁ צֻרִים
  choice: பாறை உச்சிகளிலிருந்து
  rationale: மலைப்பாங்கான பாறை உயரங்களிலிருந்து காணும் காட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶרְאֶנּוּ
  choice: அவனைப் பார்க்கிறேன்
  rationale: இஸ்ரவேல் மக்களை ஒருமை ஆண்பால் சுட்டுப்பெயரால் குறிக்கும் எபிரெய வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: குன்றுகளிலிருந்து அவனை உற்றுநோக்குகிறேன்
  rationale: முந்தைய ‘பார்க்கிறேன்’ என்பதிலிருந்து கவனமாய்ப் பார்ப்பதைக் குறிக்கும் கவித்துவ வேறுபாட்டைக் காக்கிறது.
- source_word: הֶן
  choice: இதோ
  rationale: அடுத்து வரும் காட்சியின்மீது கவனத்தை ஈர்க்கும், நவீனத் தமிழிலும் கண்ணியமாக ஒலிக்கும் சுட்டுச் சொல்.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: தனியே குடியிருக்கும் ஒரு மக்கள்
  rationale: மக்களின் தனித்த நிலையைச் சொல்கிறது; imperfect வடிவத்தை கட்டாயமாக எதிர்காலமாக மட்டும் வரையறுக்காமல் பண்புக் கூற்றாக வழங்குகிறது.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: பிற தேசங்களோடு தன்னை எண்ணிக்கொள்ளாத மக்கள்
  rationale: Hitpael வடிவத்தின் தற்சுட்டு/நடுநிலைப் பொருளை முதன்மை உரையில் காக்கிறது; ஒப்பீட்டில் ‘பிற’ என்பது சூழலில் உள்ள மற்ற தேசங்களைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יִתְחַשָּׁב என்பதைக் தற்சுட்டாகவா அல்லது செயப்பாட்டாகவா மொழிபெயர்ப்பது
  choice: பிற தேசங்களோடு தன்னை எண்ணிக்கொள்ளாத மக்கள்
  alternative: பிற தேசங்களோடு எண்ணப்படாத மக்கள்
  rationale: Hitpael வடிவம் தற்சுட்டு/நடுநிலைப் பொருளையும் செயப்பாட்டுப் பொருளையும் அனுமதிக்கிறது. முதன்மை உரை தற்சுட்டு நுணுக்கத்தை வைத்துக்கொள்கிறது; சாத்தியமான செயப்பாட்டு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது. இதனால் இஸ்ரவேலின் தனித்தன்மை கூறப்படுகிறது; இன மேலாதிக்கம் போன்ற பிற்காலக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவ இணைநிலையைப் பாதுகாக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. ஒருமைச் சுட்டுப்பெயர் மூலமொழியின் கூட்டொருமையைப் பாதுகாக்கிறது.
