source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: ta
  text: அப்போது பாலாக் பிலேயாமிடம், “எனக்கு என்ன செய்துவிட்டாய்? என் பகைவர்களைச் சபிப்பதற்காக உன்னை அழைத்து வந்தேன்; ஆனால் இதோ, நீ அவர்களை நிச்சயமாகவே ஆசீர்வதித்துவிட்டாயே[a]!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘நீ ஆசீர்வதித்தாய்—உண்மையாகவே ஆசீர்வதித்தாய்’ என்ற பொருளளிக்கும் வலியுறுத்தும் வினை அமைப்பு உள்ளது; இதை ‘நீ அவர்களை நிச்சயமாக ஆசீர்வதித்துவிட்டாய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: மூல எபிரெய வினை அமைப்பின் வலியுறுத்தலையும் சாத்தியமான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையையும் நிகழ்வின் தொடர்ச்சியையும் தருகிறது.
- source_word: מֶה עָשִׂיתָ לִי
  choice: எனக்கு என்ன செய்துவிட்டாய்?
  rationale: கேள்வியின் நேரடித் தன்மையையும், இப்போதுதான் நிகழ்ந்த செயலின் தற்போதைய விளைவையும் ‘செய்துவிட்டாய்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָקֹב
  choice: சபிப்பதற்காக
  rationale: קבב இச்சூழலில் ஒருவர்மீது சாபம் உரைப்பதைக் குறிக்கிறது; ‘சபி’ என்பது தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: אֹיְבַי
  choice: என் பகைவர்களை
  rationale: மூலத்தின் பன்மை உடைமை வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְקַחְתִּיךָ
  choice: உன்னை அழைத்து வந்தேன்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்/கொண்டுவருதல்’; இச்சூழலில் பாலாக் பிலேயாமை ஒரு நோக்கத்திற்காகத் தன்னிடம் வரவழைத்ததை ‘அழைத்து வந்தேன்’ இயல்பாகக் காட்டுகிறது; ‘கூலிக்கு அமர்த்தினேன்’ என்ற கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: וְהִנֵּה
  choice: ஆனால் இதோ
  rationale: וְהִנֵּה குறிக்கும் ஆச்சரியத்தையும் கவன ஈர்ப்பையும் ‘இதோ’ காக்கிறது; சூழலிலுள்ள எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: நீ அவர்களை நன்றாகவே ஆசீர்வதித்துவிட்டாயே
  rationale: முற்றுவினையுடன் வரும் வினையெச்ச முழுவடிவம் செயலை வலியுறுத்துகிறது. தமிழில் ‘நன்றாகவே’ மற்றும் இறுதி ‘-ஏ’ அந்த வலியுறுத்தலையும் பாலாக்கின் திகைப்பையும் இயல்பாக வெளிப்படுத்துகின்றன. மூலத்தில் வெளிப்படாத செயப்படுபொருளான ‘அவர்களை’ முந்தைய ‘பகைவர்கள்’ என்பதிலிருந்து நிரப்புகிறது.
