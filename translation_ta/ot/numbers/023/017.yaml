  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: ta
  text: அவன் அவனிடம் வந்தான். இதோ, அவன் தன் தகனபலியின் அருகில் நின்றுகொண்டிருந்தான்; மோவாபின் தலைவர்களும்[a] அவனோடு இருந்தார்கள். அப்போது பாலாக் அவனிடம், “யாவே என்ன பேசினார்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் அதிகாரிகளும்.”
    reason: שָׂרֵי என்பது ‘தலைவர்கள்’ என்றும் ‘அதிகாரிகள்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: அவன் அவனிடம் வந்தான்
  rationale: בוא என்பதன் நேரடிப் பொருள் ‘வருதல்.’ சூழலில் பிலேயாம் திரும்பி வருகிறான் என்றாலும், எபிரெய உரை ‘அவனிடம் வந்தான்’ என்றே கூறுவதால் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: וְהִנּוֹ
  choice: இதோ
  rationale: הִנֵּה வடிவம் அடுத்த காட்சியின்மேல் கவனத்தை ஈர்க்கிறது; ‘இதோ’ அதன் உயிரோட்டத்தையும் திடீர் காட்சிமாற்றத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נִצָּב
  choice: நின்றுகொண்டிருந்தான்
  rationale: வினையெச்ச வடிவம் அச்சமயத்தில் தொடர்ந்திருந்த நிலையைக் குறிக்கிறது.
- source_word: עַל עֹלָתוֹ
  choice: தன் தகனபலியின் அருகில்
  rationale: עַל இச்சூழலில் ‘அருகில்/பக்கத்தில்’ என்ற இடத்தொடர்பைக் குறிக்கிறது; பலியின் மேலே நின்றான் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: עֹלָתוֹ
  choice: தன் தகனபலி
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல்; ‘தகனபலி’ சுருக்கமான, நிலைபெற்ற தமிழ் இணைச்சொல்.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: மோவாபின் தலைவர்களும் அவனோடு இருந்தார்கள்
  rationale: שָׂרִים என்பது தலைவர்கள், ஆட்சியாளர்கள் அல்லது அதிகாரிகள் எனப் பொருள்படலாம். அரசவைக் சூழலுக்கு இயல்பாக ‘தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘அதிகாரிகள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֹּאמֶר לוֹ בָּלָק
  choice: அப்போது பாலாக் அவனிடம் ... என்று கேட்டான்
  rationale: தமிழ் கதைநடையில் இயல்பான தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது; நேரடி வினாவை அறிமுகப்படுத்துவதால் אמר என்பதற்கு ‘கேட்டான்’ சூழல்சார் இயல்பான மொழிபெயர்ப்பு.
- source_word: מַה דִּבֶּר
  choice: என்ன பேசினார்?
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற அடிப்படைத் தொடர்பைத் தக்கவைத்து, தமிழில் இயல்பான நேரடி வினாவாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיָּבֹא אֵלָיו என்பதில் வருபவரும் பெறுபவரும் யார் என்பது
  choice: அவன் அவனிடம் வந்தான்
  alternative: பிலேயாம் பாலாக்கிடம் திரும்பி வந்தான்
  rationale: சூழல் நபர்களை அடையாளம் காண உதவினாலும், இவ்வசனத்தின் எபிரெய உரை பெயர்களையோ ‘திரும்பி’ என்பதையோ சேர்க்கவில்லை. ஆகவே மூலத்தின் சுட்டுப்பெயர் அமைப்பும் அதன் இயல்பான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை இயல்பும் இணைந்த பதிவுமுறை பயன்படுத்தப்பட்டுள்ளது. சுட்டுப்பெயர்களின் மூலத் தெளிவின்மை விளக்கப் பெயர்களைச் சேர்க்காமல் காக்கப்பட்டுள்ளது; ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் எபிரெய உரையின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
