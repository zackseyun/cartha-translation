  source_fidelity: 'எபிரெய மூலத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: வருதல் (וַיָּבֹא), கவன ஈர்ப்புச் சொல் (וְהִנּוֹ), தொடர்நிலை நின்றுகொண்டிருத்தல் (נִצָּב), தகனபலிக்கு அருகிலிருத்தல் (עַל עֹלָתוֹ), மோவாபின் தலைவர்கள், மற்றும் யாவே பேசினதைக் குறித்த பாலாக்கின் வினா. ‘அவன் அவனிடம்’ என்ற சுட்டுப்பெயர் அமைப்பு மூலத்தில் உள்ள வெளிப்படையான பெயரிடாமையையும் காக்கிறது.'
  naturalness: நவீன நிலையான தமிழில் கதைநடையாக இயல்பாக உள்ளது. ‘இதோ’ எபிரெய வினோத/கவன-ஈர்ப்பு நடையைச் சுருக்கமாகத் தருகிறது; ‘என்று கேட்டான்’ நேரடி வினாவுக்கு இயல்பான தமிழ் வடிவம்.
