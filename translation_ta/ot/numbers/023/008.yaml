source:
  edition: WLC
  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: ta
  text: 'தேவன் சபிக்காதவனை நான் எப்படிச் சபிப்பேன்?

    யாவே சினங்கொள்ளாதவன்மேல் நான் எப்படிச் சினங்கொள்வேன்?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “யாவே கண்டனம் செய்யாதவனை நான் எப்படிக் கண்டனம் செய்வேன்?” இரண்டாம் அடியிலுள்ள எபிரெய வினைச்சொல் சினங்கொள்வதையோ சினத்துடன் கண்டனம் செய்வதையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: எப்படி
  rationale: இது தகவல் கேட்கும் வினா அல்ல; தன்னால் அதைச் செய்ய இயலாது என்பதை வலியுறுத்தும் சொல்லாட்சியாக இருப்பதால், இயல்பான தமிழில் ‘எப்படி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֶקֹּב / קַבֹּה
  choice: சபிப்பேன் / சபிக்காதவனை
  rationale: இரண்டு வடிவங்களும் சாபமிடும் செயலைக் குறிக்கின்றன. ஒரே தமிழ் வேர்ச்சொல்லைப் பயன்படுத்துவது எபிரெயக் கவிதையின் சொற்பொருள் தொடர்பைப் பேணுகிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு אֵל என்பது தெய்வீகப் பட்டப்பெயராகப் பயன்படுவதால், பொதுவாகப் புரியும் ‘தேவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶזְעֹם / זָעַם
  choice: சினங்கொள்வேன் / சினங்கொள்ளாதவன்மேல்
  rationale: זעם என்பது சினம் அல்லது கடுங்கோபம் கொள்வதையும், அந்தச் சினத்தை வெளிப்படுத்திக் கண்டிப்பதையும் குறிக்கலாம். முதன்மை உரை சினத்தின் பொருளைத் தேர்ந்தெடுத்து, இரு வினை வடிவங்களின் ஒற்றுமையையும் காக்கிறது; கண்டனம் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பெயர்; பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: אֵל மற்றும் יְהוָה ஆகிய இரு தெய்வீகப் பெயர்களையும் வேறுபடுத்திக் காட்டுதல்
  choice: אֵל என்பதை ‘தேவன்’ என்றும் יְהוָה என்பதை ‘யாவே’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘தேவன்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: மூல உரையின் கவிதை இணைநிலையில் ஒரு பட்டப்பெயரும் ஒரு தனிப்பெயரும் பயன்படுத்தப்பட்டுள்ளன. அந்த வேறுபாட்டைத் தமிழிலும் பேணுவது உரையைத் துல்லியமாக வழங்குகிறது.
- issue: זעם என்பதன் சினம் மற்றும் கண்டனம் சார்ந்த பொருள் விரிவு
  choice: முதன்மை உரையில் ‘சினங்கொள்’
  alternative: ‘கண்டனம் செய்’
  rationale: எபிரெயச் சொல் உள்ளார்ந்த சினத்தையும் அதை வெளிப்படுத்தும் கண்டனத்தையும் குறிக்கக்கூடும். ஒரு பொருளை மட்டும் இறுதியானதாக நிர்ணயிக்காமல், மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைநிலையை வெளிப்படுத்தும் இரு வினா அடிகளாக அமைக்கப்பட்டுள்ளது. ‘சபி’ மற்றும் ‘சினங்கொள்’ என்ற எளிதில் புரியும், ஆனால் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தெய்வீகத் தனிப்பெயர் ‘யாவே’ எனத் தெளிவாக வேறுபடுத்தப்பட்டுள்ளது.
