language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ta
  text: பின்பு பிலேயாம் பாலாக்கிடம், “இங்கே எனக்காக ஏழு பலிபீடங்களைக் கட்டி, இங்கே எனக்காக ஏழு காளைகளையும் ஏழு செம்மறியாட்டுக் கடாக்களையும் ஆயத்தப்படுத்து” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ அதன் தொடர்ச்சிப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּלְעָם אֶל בָּלָק
  choice: பிலேயாம் பாலாக்கிடம்
  rationale: தனிப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; אֶל உடன் வரும் பேச்சுத் திசையை ‘-இடம்’ இயல்பாகக் குறிக்கிறது.
- source_word: בְּנֵה
  choice: கட்டி
  rationale: בנה என்பதன் கட்டளைப் பொருளான ‘கட்டு’ பலிபீடங்களை அமைக்கும் சூழலுக்கு நேர்த்தியானது; அடுத்த கட்டளையுடன் இணைவதால் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִי
  choice: எனக்காக
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் வரும் ל பயன் அல்லது நலன் சார்ந்த பொருளைக் குறிக்கிறது; இரு இடங்களிலும் அதன் மறுபதிப்பு காக்கப்பட்டுள்ளது.
- source_word: בָּזֶה
  choice: இங்கே
  rationale: சொற்பொருளில் ‘இந்த [இடத்தில்]’; சூழலில் இடத்தைச் சுட்டுவதால் ‘இங்கே’ இயல்பானதும் துல்லியமானதும் ஆகும். எபிரெய மூலத்தின் இருமுறைப் பயன்பாடும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ஏழு பலிபீடங்கள்
  rationale: எண்ணிக்கையையும் பலியிடும் மேடைகளையும் நேரடியாகக் குறிக்கும் சொற்றொடர்.
- source_word: וְהָכֵן
  choice: ஆயத்தப்படுத்து
  rationale: כון என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘தயார் செய்’ அல்லது ‘ஆயத்தப்படுத்து’ என்று பொருள் தருகிறது; பலிக்குரிய விலங்குகளின் சூழலில் இச்சொல் பொருத்தமானது.
- source_word: פָרִים
  choice: காளைகள்
  rationale: פַּר என்பதன் பன்மை; பலிச் சூழலில் ஆண் மாடுகளைக் குறிக்கிறது. மூலத்தில் வயது தனியாகத் தெளிவுபடுத்தப்படாததால் ‘இளங்காளைகள்’ என்று விரிவாக்கப்படவில்லை.
- source_word: אֵילִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵיל என்பது ஆண் செம்மறியாட்டைக் குறிப்பாகக் குறிக்கிறது; பொதுவான ‘ஆட்டுக்கடா’ என்பதைவிட இத்தேர்வு விலங்கு வகையைத் தெளிவாகப் பாதுகாக்கிறது.
