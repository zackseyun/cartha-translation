id: NUM.23.20
reference: Numbers 23:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: ta
  text: இதோ[a], ஆசீர்வதிக்கும்படி நான் பெற்றேன்; அவர் ஆசீர்வதித்திருக்கிறார்[b], அதை நான் மாற்ற முடியாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதோ’ என்பது கவனத்தை ஈர்க்கும் சொல்; ‘பார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் செய்பவரின் பெயர் தனியாகக் குறிப்பிடப்படவில்லை; வினை மூன்றாம் ஆண்பால் ஒருமையில் உள்ளது. சூழல் கடவுளைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: ‘அதைத் திருப்ப முடியாது’ அல்லது ‘அதை ரத்து செய்ய முடியாது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: בָרֵךְ
  choice: ஆசீர்வதிக்க வேண்டும் என்பதையே
  rationale: לָקָחְתִּי என்பதுடன் இணைந்து, பெற்றுக்கொண்ட உரையின் அல்லது பணிப்பின் உள்ளடக்கம் ஆசீர்வதிப்பதே என்பதைத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படாத பெயர்ச்சொல்லைச் சேர்க்காமல் தமிழில் இயல்பாக்குகிறது.
- source_word: לָקָחְתִּי
  choice: நான் பெற்றுக்கொண்டேன்
  rationale: לקח என்பதன் ‘எடுத்துக்கொள்/பெற்றுக்கொள்’ என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; பெறப்பட்ட பொருள் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால் ‘கட்டளை’ அல்லது ‘இறைவாக்கு’ என்று முதன்மை உரையில் நிரப்பவில்லை.
- source_word: וּבֵרֵךְ
  choice: அவர் ஆசீர்வதித்திருக்கிறார்
  rationale: மூன்றாம் ஆண்பால் ஒருமை வினை வடிவைத் தக்கவைத்து, அதன் விளைவுநிலை தொடர்வதையும் காட்டுகிறது; சூழலில் செய்பவர் கடவுள் என்றாலும், மூலத்தில் பெயர் இல்லாததால் பெயரைச் சேர்க்கவில்லை.
- source_word: אֲשִׁיבֶנָּה
  choice: அதை என்னால் மாற்ற முடியாது
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு ஏற்கெனவே அளிக்கப்பட்ட ஆசீர்வாதத்தைத் திருப்புதல், ரத்துசெய்தல் அல்லது மாற்றுதல் என்ற பொருளைக் கொண்டது; ‘மாற்ற முடியாது’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: ‘அவர் ஆசீர்வதித்திருக்கிறார்’ என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் ‘அவர்’ என்று வைத்து, கடவுளின் பெயரைச் சேர்க்கவில்லை.
  alternative: ‘கடவுள் ஆசீர்வதித்திருக்கிறார்’ என்று சூழலின் அடிப்படையில் வெளிப்படுத்துதல்.
  rationale: எபிரெய வினை மூன்றாம் ஆண்பால் ஒருமையைக் காட்டுகிறது; அருகிலுள்ள சூழல் கடவுளையே சுட்டுகிறது. ஆயினும் மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால் அதன் சுருக்கத்தையும் சிறிய அளவிலான மறைமுகத்தன்மையையும் காத்திருக்கிறது.
- issue: பெற்றுக்கொண்டதன் வெளிப்படாத பொருள்
  choice: ‘ஆசீர்வதிக்க வேண்டும் என்பதையே’ என்று உள்ளடக்கத்தை மட்டும் வெளிப்படுத்தி, ‘கட்டளை’ அல்லது ‘இறைவாக்கு’ என்ற பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
  alternative: ‘ஆசீர்வதிக்கும்படி ஒரு கட்டளையைப் பெற்றேன்’ அல்லது ‘ஆசீர்வதிக்கும் இறைவாக்கைப் பெற்றேன்.’
  rationale: சூழல் ஒரு தெய்வீகப் பணிப்பு அல்லது உரையை உணர்த்தினாலும், எபிரெயத்தில் לָקָחְתִּי என்பதன் பொருள் வெளிப்படையாகத் தரப்படவில்லை. எனவே கருத்தைத் தெளிவாக்கியபோதும் குறிப்பிட்ட இறையியல் வகைப்பாட்டைச் சேர்ப்பது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் மறைமுக எழுவாயும் இயன்றவரை காக்கப்பட்டுள்ளன; தமிழில் பொருள் தெளிவதற்குத் தேவையான அளவிலேயே வாக்கிய அமைப்பு இயல்பாக்கப்பட்டுள்ளது.
