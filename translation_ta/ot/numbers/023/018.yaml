base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: ta
  text: 'பின்பு அவன் தன் உரையை[a] எடுத்துரைத்துச் சொன்னான்:

    “பாலாக்கே, எழுந்து கேள்;

    சிப்போரின் மகனே, எனக்குச் செவிகொடு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உரை” என்பதற்குப் பதிலாக “அறிவிப்பு” அல்லது “பழமொழிக் கூற்று” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மָשָׁל (மாஷால்) பழமொழி போன்ற கூற்றையோ, முறையான கவிதைமிகு உரையையோ குறிக்கலாம்; இங்கு அது பிலேயாமின் உயர்ந்த அறிவிப்பை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: தன் உரையை எடுத்துரைத்தான்
  rationale: נשׂא + מָשָׁל என்பது ஓர் உயர்ந்த, முறையான கவிதைமிகு உரையைத் தொடங்குவதற்கான எபிரெய மரபுத்தொடர். ‘எடுத்துரைத்தான்’ அந்தத் தொடக்கச் செயலையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מְשָׁלוֹ
  choice: தன் உரை
  rationale: מָשָׁל என்பதற்கு பழமொழி, உவமைமிகு கூற்று, அல்லது முறையான கவிதை உரை என்ற பொருள்கள் இருக்கலாம். இங்கு பிலேயாமின் உயர்ந்த அறிவிப்பைக் குறிக்கும் வகையில் ‘உரை’ தெளிவாக உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதை வினை; நவீன தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: קוּם
  choice: எழுந்து
  rationale: பாலாக்கை நோக்கிய கட்டளை. உயர்ந்த பேச்சுநடையைத் தக்கவைத்தபடியே தமிழில் இயல்பாக உள்ளது.
- source_word: וּשֲׁמָע
  choice: கேள்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருளைத் தருகிறது; அடுத்துள்ள தீவிரமான ‘செவிகொடு’ என்பதுடன் கவிதை இணைநிலையைப் பாதுகாக்கிறது.
- source_word: הַאֲזִינָה עָדַי
  choice: எனக்குச் செவிகொடு
  rationale: אזן என்பதன் கவனமாகக் கேட்பது என்ற தீவிரத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנוֹ צִפֹּר
  choice: சிப்போரின் மகனே
  rationale: மூலத்தின் தந்தைவழி அடையாளத்தையும் நேரடி அழைப்பையும் பாதுகாக்கும் விளிவேற்றுமை வடிவம்.
