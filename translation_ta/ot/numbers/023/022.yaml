source:
  edition: WLC
  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: ta
  text: கடவுள் அவர்களை எகிப்திலிருந்து வெளியே கொண்டுவருகிறார்; அவனுக்குக் காட்டெருதின் உயர்ந்த கொம்புகள் உண்டு.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுக்குக் காட்டெருதின் வலிமை உண்டு.’ எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; இங்கு அருவமான ‘வலிமை’ என்று மட்டும் சொல்லாமல் விலங்கு உருவகம் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரிய மொழிபெயர்ப்புகளில் ‘ஒற்றைக்கொம்பு விலங்கு’; ஆனால் இது காட்டெருதையோ இப்போது அழிந்துபோன ஆரோக்ஸ் மாட்டினத்தையோ குறிப்பதாக இருக்க அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל வாக்கியத்தின் எழுவாயாக வருகிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘கடவுள்’ என மொழிபெயர்க்கப்பட்டது; ‘வல்லமையுள்ள கடவுள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத ஒரு நுண்பொருளைச் சேர்க்கும்.
- source_word: מוֹצִיאָם
  choice: அவர்களை ... வெளியே கொண்டுவருகிறார்
  rationale: ஹிஃபில் வினையெச்ச வடிவமும் மூன்றாம் நபர் பன்மை பின்னொட்டும், அவர்களை வெளியே கொண்டுவருகிறவர் கடவுள் என்பதைக் காட்டுகின்றன. நிகழ்கால வடிவம் கவிதையின் உயிரோட்டத்தையும் யாத்திராகம நிகழ்வின் தொடர்ந்த முக்கியத்துவத்தையும் காக்கிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: வெளியே கொண்டுவருதல் என்ற இயக்க வினையுடன் ‘எகிப்திலிருந்து’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: כְּתוֹעֲפֹת
  choice: உயர்ந்த கொம்புகள் உண்டு
  rationale: תּוֹעֲפֹת என்பது கொம்புகள், உயர்வு அல்லது வலிமையான நீட்சிகள் எனப் புரிந்துகொள்ளக்கூடிய கடினமான பன்மைப் பெயர்ச்சொல். காட்டெருதுடன் வரும் சூழலில் விலங்கு உருவகத்தைத் தக்கவைக்க ‘உயர்ந்த கொம்புகள்’ என மொழிபெயர்க்கப்பட்டது; ‘வலிமை’ என்பது சாத்தியமான மாற்றுப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רְאֵם
  choice: காட்டெருது
  rationale: இச்சொல் புராணக் ‘ஒற்றைக்கொம்புக் குதிரை’ அல்ல, வலிமையான காட்டு மாட்டினத்தைக் குறிக்கும் எனப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. ‘காட்டெருது’ நவீனத் தமிழில் தெளிவானதும் விலங்கு உருவகத்தைப் பாதுகாப்பதும் ஆகும்.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: மசோரா உரையில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமையைத் தக்கவைக்க ‘அவனுக்கு’ என மொழிபெயர்க்கப்பட்டது. முந்தைய ‘அவர்களை’ என்ற பன்மைக்கும் இதற்கும் இடையிலுள்ள இலக்கணப் பதற்றம் சீராக்கப்படாமல் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: רְאֵם குறிக்கும் விலங்கு உருவகம்
  choice: காட்டெருது
  alternative: ஆரோக்ஸ்; பாரம்பரியமாக ‘ஒற்றைக்கொம்பு விலங்கு’
  rationale: இவ்வசனம் புராண உயிரினத்தைப் பற்றிய கூற்றை முன்வைக்காமல், வலிமையான காட்டு மாட்டின் உருவகத்தைப் பயன்படுத்துகிறது. தற்போதைய எபிரெயச் சொற்பொருள் ஆதாரத்திற்கும் சாதாரண வாசகரின் புரிதலுக்கும் ‘காட்டெருது’ சிறப்பாகப் பொருந்துகிறது.
- issue: לוֹ என்ற ஒருமைப் பின்னொட்டின் குறிப்பு
  choice: ‘அவனுக்கு’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்களுக்கு’ என்று இஸ்ரவேலோடு இலக்கணமாக ஒத்திசைத்தல்
  rationale: மூல எபிரெய உரையின் ஒருமையைப் பாதுகாப்பது, அது இஸ்ரவேலை ஒருமையான கூட்டு ஆளுமையாகக் குறிக்கிறதா அல்லது வேறு தொடர்பைச் சுட்டுகிறதா என்ற உண்மையான தெளிவின்மையைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கவிதை உருவகமும் ‘அவர்களை/அவனுக்கு’ என்ற மூலத்தின் எண்ணிக்கை வேறுபாடும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
