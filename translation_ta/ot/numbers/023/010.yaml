base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: ta
  text: யாக்கோபின் புழுதியை எண்ணக்கூடியவன் யார்? இஸ்ரவேலின் நான்கில் ஒரு பங்கை[a] எண்ணக்கூடியவன் யார்? நேர்மையானவர்களின்[b] மரணத்தை என் உயிர் அடையட்டும்; என் முடிவு அவனுடைய முடிவைப்போல்[c] இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் அணிகளை”; இன்னும் விளக்கமாக, “இஸ்ரவேலில் நான்கில் ஒரு பங்கைக்கூட.” “இஸ்ரவேலின் பெருந்திரளை” என்றும் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதிமான்களின்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “அவனைப்போல்” என்ற ஆண்பால் ஒருமை வடிவம் உள்ளது. “நேர்மையானவர்கள்” என்பது ஒரு கூட்டத்தைக் குறித்தாலும், அந்த ஒருமை அவர்களில் பிரதிநிதியான ஒருவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: எண்ணக்கூடியவன் யார்?
  rationale: இது இயலாமையை உணர்த்தும் வினாவாக இருப்பதால், எபிரெயச் சொல்லமைப்பின் வினாவையும் சூழலில் உள்ள ‘முடியும்’ என்ற உட்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲפַר יַעֲקֹב
  choice: யாக்கோபின் புழுதி
  rationale: எண்ணமுடியாத சந்ததியைக் குறிக்கும் புழுதி உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது; கவிதை இணைப்பிலுள்ள ‘யாக்கோபு’ என்ற பெயரும் பாதுகாக்கப்படுகிறது.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நான்கில் ஒரு பங்கை எண்ணக்கூடியவன் யார்?
  rationale: רֹבַע என்பதன் இயல்பான ‘நான்கில் ஒரு பங்கு’ என்ற பொருளைத் தக்கவைத்து, முதல் அடியின் இணையான வினாவாகத் தமிழில் அமைக்கிறது. துல்லியமான குறிப்பு விவாதத்திற்குரியது என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: תָּמֹת נַפְשִׁי
  choice: என் உயிரும் ... மரணத்தை அடையட்டும்
  rationale: נֶפֶשׁ என்பதைக் ‘உயிர்’ என்று வெளிப்படுத்தி, விருப்பத்தைக் குறிக்கும் வினை வடிவத்தையும் காக்கிறது; சொற்சொல்லான ‘மரணத்தைச் சாகட்டும்’ என்பதைக் காட்டிலும் இது இயல்பான, கண்ணியமான தமிழ்.
- source_word: מוֹת יְשָׁרִים
  choice: நேர்மையானவர்களின் மரணம்
  rationale: יְשָׁרִים என்பதிலுள்ள நேர்மை அல்லது செம்மை சார்ந்த அடிப்படைப் பொருளைத் தக்கவைத்து, தேவையின்றி ஒரு முறைப்படுத்தப்பட்ட இறையியல் வகைப்பாட்டைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: என் முடிவு ... இருக்கட்டும்
  rationale: אַחֲרִית என்பதன் ‘முடிவு, இறுதி நிலை’ என்ற பொருளை மரணத்துடன் உள்ள கவிதை இணைப்பில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָּמֹהוּ
  choice: அவனுடையதைப்போல்
  rationale: எபிரெயத்தில் உள்ள ஆண்பால் ஒருமை பின்னொட்டைத் தக்கவைக்கிறது; ‘அவனுடையது’ என்பது முன்னுள்ள ‘முடிவு’ என்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יְשָׁרִים என்பதன் பொருள்
  choice: நேர்மையானவர்கள்
  alternative: நீதிமான்கள்
  rationale: ‘நேர்மையானவர்கள்’ என்பது ישר வேரின் நேரான அல்லது செம்மையான வாழ்வு சார்ந்த நுண்பொருளை நெருக்கமாகக் காக்கிறது. ‘நீதிமான்கள்’ என்பதும் சாத்தியம்; அது அடிக்குறிப்பில் தரப்படுகிறது.
- issue: רֹבַע יִשְׂרָאֵל என்பதன் பொருள்
  choice: இஸ்ரவேலின் நான்கில் ஒரு பங்கு
  alternative: இஸ்ரவேலின் அணிகள்; இஸ்ரவேலின் பெருந்திரள்
  rationale: முதன்மை உரை רֹבַע என்பதன் வடிவரீதியான ‘நான்கில் ஒரு பங்கு’ என்ற பொருளைத் தக்கவைத்து, குறிப்பிட்ட விளக்கத்தைத் திணிக்கவில்லை. அணிகள் அல்லது பெருந்திரள் என்ற சூழல்சார் புரிதல்கள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
- issue: כָּמֹהוּ என்ற ஒருமைச் சுட்டு
  choice: அவனுடையதைப்போல்
  alternative: அவர்களுடையதைப்போல்
  rationale: முன்னுள்ள ‘நேர்மையானவர்கள்’ பன்மையாக இருந்தாலும், எபிரெயப் பின்னொட்டு ஆண்பால் ஒருமையில் உள்ளது. பிரதிநிதியான ஒரு நேர்மையான மனிதனைச் சுட்டலாம் என்ற தெளிவின்மையை ஒருமை வடிவம் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புழுதி’ என்ற வேதாகம உருவகம், ‘என் உயிர்’ என்ற கவிதைச் சொல், மேலும் இறுதி வரியின் ஒருமைச் சுட்டு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. முதல் எபிரெய வரியின் இணை அமைப்பைத் தமிழில் தெளிவாக்க இரு வினாக்களாகப் பிரிக்கப்பட்டுள்ளது.
