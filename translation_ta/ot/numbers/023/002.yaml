  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: ta
  text: பிலேயாம் சொன்னபடியே பாலாக் செய்தான். பாலாக்கும் பிலேயாமும் பலிபீடத்தின் மேல் ஒரு காளையையும் ஒரு செம்மறியாட்டுக் கடாவையும் பலியாகச் செலுத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘மேலே ஏறச்செய்தல்’; பலி செலுத்தும் சூழலில் இது ‘பலியாகச் செலுத்துதல்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה כאשר דבר என்ற எபிரெயச் சொற்றொடரில், சொல்லப்பட்டதைச் செய்தல் அல்லது நிறைவேற்றுதல் என்பதே பொருள்; நவீன தமிழில் ‘செய்தான்’ இயல்பாக உள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: பிலேயாம் கூறிய அறிவுறுத்தலுக்கு இணங்க பாலாக் செயல்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּעַל
  choice: பலியாகச் செலுத்தினார்கள்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம், பலிவிலங்குகளும் பலிபீடமும் இடம்பெறும் இச்சூழலில், பலியை மேலே ஏறச்செய்தல் என்ற சொற்பொருளிலிருந்து ‘பலியாகச் செலுத்துதல்’ என்னும் வழிபாட்டுப் பொருளைக் குறிக்கிறது.
- source_word: בָּלָק וּבִלְעָם
  choice: பாலாக்கும் பிலேயாமும்
  rationale: இருவரும் இணைந்த எழுவாய்கள் என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: פָּר
  choice: ஒரு காளை
  rationale: பலிச் சூழலில் פָּר பொதுவாக ஆண் மாட்டைக் குறிக்கிறது; வயதை உரை தெளிவாகக் குறிப்பிடாததால் ‘இளங்காளை’ என்று மிகைப்படுத்தப்படவில்லை.
- source_word: וָאַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் பிற விலங்குகளையும் குறிக்கக்கூடும் என்பதால் தெளிவுக்காக முழு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בַּמִּזְבֵּחַ
  choice: பலிபீடத்தின் மேல்
  rationale: பலிச் சூழலில் בְּ முன்னிடைச்சொல் குறிக்கும் இடத்தைக் ‘மேல்’ என இயல்பாக வெளிப்படுத்துகிறது.
