source:
  edition: WLC
  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: ta
  text: அவன் அவனைச் சோப்பீம் வயலுக்கு[a], பிஸ்காவின் உச்சிக்குக் கூட்டிக்கொண்டு போனான். அங்கே ஏழு பலிபீடங்களைக் கட்டி, ஒவ்வொரு பலிபீடத்திலும் ஒரு காளையையும் ஓர் ஆட்டுக்கடாவையும் பலியாகச் செலுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காவலர்களின் வயல்.” எபிரெயச் சொற்றொடரை ஒரு இடப்பெயராகவோ, “காவலர்கள்/கண்காணிப்பவர்களின் வயல்” என்ற விளக்கமாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: அவன் அவனைக் கூட்டிக்கொண்டு போனான்
  rationale: לקח என்பதன் தொடர்கதை வடிவமும் 3ஆம் ஆண்பால் ஒருமை பொருள் பின்னொட்டும் இயல்பான தமிழில் இவ்வாறு வழங்கப்படுகின்றன. சூழலில் பாலாக் பிலேயாமைக் கூட்டிச் செல்கிறான்; ஆனால் வசனம் பெயர்களைக் கூறாததால் மூலத்தின் சுட்டுப்பெயர் அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: שְׂדֵה צֹפִים
  choice: சோப்பீம் வயல்
  rationale: צֹפִים என்பது இங்கு இடப்பெயராக இருக்கக்கூடும் என்பதால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்படுகிறது. அதன் பொதுப்பொருளான ‘காவலர்கள்/கண்காணிப்பவர்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: பிஸ்காவின் உச்சிக்கு
  rationale: நிலவியல் சூழலில் רֹאשׁ என்பது ‘உச்சி’ எனவும், הַפִּסְגָּה என்பது பிஸ்கா என்ற இடப்பெயராகவும் இயல்பாகப் பொருந்துகின்றன.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: ஏழு பலிபீடங்களைக் கட்டி
  rationale: בנה மற்றும் அதன் நேரடிப் பொருளைத் தெளிவாகவும் இயல்பான தமிழ் தொடர் வினையெச்ச வடிவிலும் வழங்குகிறது.
- source_word: וַיַּעַל
  choice: பலியாகச் செலுத்தினான்
  rationale: பலியிடும் சூழலில் עלה என்பது பலியை ஏறப்பண்ணுதல் அல்லது செலுத்துதல் என்ற வழிபாட்டுச் செயலைக் குறிக்கிறது. ‘பலியாகச் செலுத்தினான்’ என்பது பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: פָּר וָאַיִל
  choice: ஒரு காளையையும் ஓர் ஆட்டுக்கடாவையும்
  rationale: இரு ஒருமைப் பெயர்ச்சொற்களும் தலா ஒரு பலிவிலங்கைக் குறிக்கின்றன; ஆட்டுக்கடா என்பது אַיִל என்பதைக் குறிப்பாக வேறுபடுத்துகிறது.
- source_word: בַּמִּזְבֵּחַ
  choice: ஒவ்வொரு பலிபீடத்திலும்
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும், முன் கூறப்பட்ட ஏழு பலிபீடங்களுடனும் இணைந்த சூழலும் இணையான வசனங்களும் பகிர்ந்தளிக்கும் பொருளை உணர்த்துகின்றன.
