  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இடப்பெயரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; பலியிடும் சொல்லாட்சி சமயப் பிரிவுக்குரிய தனிப்பட்ட விளக்கமின்றி வழங்கப்பட்டுள்ளது.
