  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: ta
  text: பின்பு பாலாக் அவனிடம், “தயவுசெய்து என்னுடன் வேறொரு இடத்துக்கு வாரும்; அங்கிருந்து நீர் அவர்களைப் பார்ப்பீர். அவர்களில் ஒரு ஓரப்பகுதியை மட்டுமே பார்ப்பீர்[a]; அவர்கள் அனைவரையும் பார்க்கமாட்டீர்[b]. அங்கிருந்து எனக்காக அவர்களைச் சபிப்பீராக” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவனுடைய ஓரத்தை மட்டும்” அல்லது “அவனுடைய கடைப்பகுதியை மட்டும்.” அதாவது, இஸ்ரவேல் மக்களில் ஒரு பகுதி மட்டுமே பார்வைக்குத் தெரியும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இஸ்ரவேல் மக்கள் ஒரே கூட்டு மக்களாகக் கருதப்பட்டு, “அவன்,” “அவன் முழுவதும்” என்னும் ஒருமை வடிவங்களில் குறிப்பிடப்படுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: தயவுசெய்து என்னுடன் வாரும்
  rationale: נָא என்பதன் பணிவான வேண்டுகோள் தொனியையும், பாலாக் தன்னுடன் இன்னோர் இடத்துக்கு வருமாறு அழைப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָקוֹם אַחֵר
  choice: வேறோர் இடம்
  rationale: இடமாற்றத்தைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ்.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: அங்கிருந்து நீர் அவர்களைப் பார்க்கலாம்
  rationale: புதிய இடம் ஒரு பார்வை நிலையாக இருப்பதைத் தெளிவாக்குகிறது. இஸ்ரவேலைக் குறிக்கும் எபிரெய ஒருமைச் சுட்டுப்பெயர் தமிழில் இயல்பாகக் கூட்டு மக்களைக் குறிக்கும் பன்மையாக வழங்கப்படுகிறது.
- source_word: אֶפֶס קָצֵהוּ
  choice: அவர்களின் ஓரப்பகுதியை மட்டுமே
  rationale: אֶפֶס இங்கு வரம்பைக் குறிக்கிறது; קָצֶה என்பது ஓரம், கடைப்பகுதி அல்லது எல்லைப்பகுதி எனப் பொருள்பட்டு, இஸ்ரவேல் மக்களில் ஒரு பகுதி மட்டுமே பார்வைக்குத் தெரிவதைச் சுட்டுகிறது.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: அவர்கள் அனைவரையும் பார்க்கமாட்டீர்
  rationale: பகுதியளவான பார்வைக்கும் முழுமையான பார்வைக்கும் உள்ள எதிர்மறையை இயல்பான தமிழில் காக்கிறது.
- source_word: וְקָבְנוֹ לִי
  choice: எனக்காக அவர்களைச் சபியும்
  rationale: קבב என்பதன் சூழலுக்குரிய ‘சபித்தல்’ பொருளையும், பாலாக்கின் சார்பாக அதைச் செய்யுமாறு விடுக்கும் கட்டளையையும் காக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: புதிய பார்வை நிலையிலிருந்தே சாபத்தைச் சொல்ல வேண்டும் என்ற பாலாக்கின் திட்டத்தின் இடவியல் தொடர்பைக் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயர்கள்
  choice: முதன்மை உரையில் ‘அவர்கள்’ என்று கூட்டு மக்களைக் குறிக்கும் பன்மையில் மொழிபெயர்த்தல்
  alternative: எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றி ‘அவன்/அவனை’ அல்லது ‘அது/அதை’ என்று வழங்குதல்
  rationale: எபிரெயில் இஸ்ரவேல் ஒரே கூட்டு மக்களாக ஒருமையில் சுட்டப்படுகிறது. தமிழில் மனித மக்களைக் ‘அவன்’ அல்லது ‘அது’ என்று குறிப்பிடுவது தவறான தனிநபர் அல்லது உயிரற்ற பொருள் உணர்வை உண்டாக்கலாம்; ஆகவே இயல்பான பன்மை பயன்படுத்தப்பட்டு, மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הלך என்ற கட்டளையின் சூழல்சார் திசை
  choice: ‘என்னுடன் வாரும்’
  alternative: ‘என்னுடன் போகும்’
  rationale: பேசுகிறவர் தன்னுடன் சேர்ந்து செல்லுமாறு அழைப்பதால், தமிழில் ‘வாரும்’ என்பது வேண்டுகோளின் இயல்பான திசைநிலையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாலாக் பிலேயாமிடம் பேசுவதற்கு மரியாதை ஒருமையான ‘நீர்/வாரும்/பார்ப்பீர்/சபியும்’ வடிவங்கள் கையாளப்பட்டுள்ளன; இஸ்ரவேல் மக்களைக் குறிக்க இயல்பான பன்மை தேர்ந்தெடுக்கப்பட்டுள்ளது.
