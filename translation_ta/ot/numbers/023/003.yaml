  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: ta
  text: பிலேயாம் பாலாக்கிடம், “நீ உன் தகனபலிக்கு அருகே நின்றுகொள்; நான் போவேன். ஒருவேளை யாவே என்னைச் சந்திக்க வரலாம். அவர் எனக்கு எதைக் காட்டுகிறாரோ, அதை உனக்குத் தெரிவிப்பேன்” என்றான். பிறகு அவன் வெட்டவெளியான ஓர் உயரமான இடத்திற்குச் சென்றான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெட்டவெளியான ஓர் உயரமான இடம்” என்பதற்கான எபிரேயச் சொல் அரிதானது; “வெறுமையான உயரம்” அல்லது “மரங்களற்ற குன்று” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: உன் தகனபலிக்கு அருகே நின்றுகொள்
  rationale: התיצב என்பது ஒருவரை ஒரு நிலையில் நிறுத்திக்கொள்வதைக் குறிக்கிறது. இங்கு על என்பது பலியின் மேல் நிற்பதை அல்ல, அதன் அருகே நிற்பதைக் குறிக்கும் இடவுறவாக இயல்பாகப் புரிகிறது. עֹלָה குறிப்பாக முழுவதும் எரிக்கப்படும் தகனபலியைக் குறிக்கிறது.
- source_word: וְאֵלְכָה
  choice: நான் போகிறேன்
  rationale: முதல் நபர் cohortative வடிவம் பிலேயாமின் நோக்கத்தையும் உடனடி செயலையும் தெரிவிக்கிறது; திரும்பிவருவதை மூலவசனம் வெளிப்படையாகச் சொல்லாததால் ‘போய்வருகிறேன்’ என்று விரிவாக்கப்படவில்லை.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: சாத்தியத்தையும் உறுதியின்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: யாவே என்னைச் சந்திக்க வரலாம்
  rationale: קרה என்பதன் நிபால் வடிவம் நேரிடுதல் அல்லது சந்தித்தல் என்ற நுணுக்கம் கொண்டது. ‘ஒருவேளை’ உறுதியின்மையைக் காப்பதால், தமிழில் இயல்பற்ற தற்செயல் தொனியைச் சேர்க்காமல் எதிர்பார்க்கப்படும் தெய்வீகச் சந்திப்பை இவ்வாறு தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரேய மூலத்தில் வரும் இறைவனின் தனிப்பெயர்; ஆகவே தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: அவர் எனக்கு எதைக் காட்டுகிறாரோ
  rationale: சுருக்கமான எபிரேயச் சொற்றொடர் வெளிப்பாட்டின் உள்ளடக்கத்தைச் சுட்டுகிறது. ראה என்பதன் ஹிபில் வடிவம் ‘காட்டுதல்’ என்று நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: அதை உனக்குத் தெரிவிப்பேன்
  rationale: נגד என்பதன் ஹிபில் வடிவமான சொல்லுதல், அறிவித்தல் அல்லது தெரிவிப்பது என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: שֶׁפִי
  choice: வெட்டவெளியான ஓர் உயரமான இடம்
  rationale: அரிதான இச்சொல் மரங்களற்ற, திறந்த அல்லது வெளிப்பட்ட உயரமான இடத்தைக் குறிக்கலாம். நில அமைப்பைத் தேவைக்கு அதிகமாகக் குறிப்பாக்காமல் அதன் சாத்தியமான பொருளைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் பெயர்ச் சிறப்பைத் தக்கவைக்கிறது.
- issue: பிலேயாம் எதிர்பார்த்த சந்திப்பின் உறுதியின்மை
  choice: ஒருவேளை யாவே என்னைச் சந்திக்க வரலாம்
  alternative: யாவே நிச்சயமாக என்னைச் சந்திப்பார்
  rationale: אוּלַי வெளிப்படையாகச் சாத்தியத்தையும் உறுதியின்மையையும் குறிக்கிறது; ஆகவே சந்திப்பு உறுதி செய்யப்பட்டதாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. உரையாடலில் இயல்பான ஒருமை முன்னிலையும், பலி தொடர்பான நிலையான வேதாகமச் சொல்லான ‘தகனபலி’யும் பயன்படுத்தப்பட்டுள்ளன. அரிதான שֶׁפִי என்பதன் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
