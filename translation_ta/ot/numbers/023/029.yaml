  source_fidelity: மூல எபிரேயத்தின் கதைத் தொடர்ச்சியை ‘அப்போது’ நன்றாகக் காட்டுகிறது. பேச்சாளர், கேட்பவர், இடக்குறிப்பு, ‘எனக்காக’ என்ற பயனுறவு, ஏழு பலிபீடங்கள், ஏழு காளைகள், ஏழு கடாக்கள் ஆகிய அனைத்தும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் ‘இங்கே’ மற்றும் ‘எனக்காக’ ஆகியனவும் சரியாக மீளுரைக்கப்பட்டுள்ளன.
