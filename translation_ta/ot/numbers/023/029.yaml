  terminology: ‘பலிபீடங்கள்,’ ‘காளைகள்,’ ‘செம்மறியாட்டுக் கடாக்கள்’ ஆகியவை முறையே מִזְבְּחֹת, פָרִים, אֵילִים என்பவற்றுக்கு துல்லியமான, சூழலுக்கேற்ற சொற்கள். ‘பிலேயாம்,’ ‘பாலாக்’ என்ற பெயர்வடிவங்களும் தமிழில் நிலைபெற்ற வேதாகமப் பயன்பாட்டுடன் ஒத்திருக்கின்றன.
