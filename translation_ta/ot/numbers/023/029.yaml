source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ta
  text: அப்போது பிலேயாம் பாலாக்கிடம், “இங்கே எனக்காக ஏழு பலிபீடங்களைக் கட்டி, இங்கே எனக்காக ஏழு காளைகளையும் ஏழு செம்மறியாட்டுக் கடாக்களையும் ஆயத்தப்படுத்து” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ அதன் தொடர்ச்சிப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֶל בָּלָק
  choice: பாலாக்கிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதை இயல்பான தமிழில் காட்டுகிறது; பாலாக் என்பது எபிரேயத் தனிப்பெயரின் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בְּנֵה
  choice: கட்டி
  rationale: בנה என்ற கட்டளை வினை பலிபீடங்களை அமைப்பதைக் குறிக்கிறது; நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: לִי
  choice: எனக்காக
  rationale: இங்கு ל பயன் அல்லது நலன் சார்ந்த உறவைக் குறிக்கிறது; பிலேயாமின் பயன்பாட்டுக்காக ஏற்பாடு செய்வதை ‘எனக்காக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָּזֶה
  choice: இங்கே
  rationale: சொல்லுக்கு சொல் ‘இந்த இடத்தில்’; நவீனத் தமிழில் ‘இங்கே’ இயல்பான இடக்குறிப்பு.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ஏழு பலிபீடங்கள்
  rationale: எண்ணிக்கையையும் வழிபாட்டுக்குரிய பலிபீடங்களையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהָכֵן
  choice: ஆயத்தப்படுத்து
  rationale: כון என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘தயார் செய்/ஆயத்தப்படுத்து’ என்று பொருள்படுகிறது; பலிக்குரிய விலங்குகளை ஏற்பாடு செய்வதற்கு ஏற்ற சொல்.
- source_word: פָרִים
  choice: காளைகள்
  rationale: பலியிடும் சூழலில் פַּר ஆண் மாட்டைக் குறிக்கிறது. வயதை மூலவசனம் இங்கு குறிப்பாக வலியுறுத்தாததால் ‘இளங்காளைகள்’ என்று விரிவாக்கப்படவில்லை.
- source_word: אֵילִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ மட்டும் வேறு இன ஆண் விலங்கையும் குறிக்கக்கூடும் என்பதால் தெளிவுக்காக முழு வடிவம் பயன்படுத்தப்பட்டது.
