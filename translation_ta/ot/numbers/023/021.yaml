  terminology: ‘யெகோவா,’ ‘யாக்கோபு,’ ‘இஸ்ரவேல்,’ ‘துன்பம்,’ ‘துயரம்’ ஆகியவை ஏற்றவை. ‘அரசனின் ஆரவாரம்’ என்பது அரசனோடு தொடர்புடைய முழக்கம்/ஆரவாரம் என்ற மூலத்தின் திறந்த தொடர்பை ‘அரசனுக்கான’ என்பதைக் காட்டிலும் சிறப்பாகக் காக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் ‘தீமை’க்கு பதில் ‘கேடு’ பயன்படுத்தப்படுவது עָמָל-இன் trouble/perversity வரம்பைத் தக்கவைக்கிறது.
