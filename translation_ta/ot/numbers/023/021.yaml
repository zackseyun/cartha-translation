  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: ta
  text: அவர் யாக்கோபில் துன்பத்தைக் கவனிக்கவில்லை; இஸ்ரவேலில் துயரத்தைக் காணவில்லை.[a] அவனுடைய கடவுளாகிய யெகோவா அவனோடு இருக்கிறார்; அரசனின் ஆரவாரம் அவர்களிடையே இருக்கிறது.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபில் அக்கிரமத்தை அவர் காணவில்லை; இஸ்ரவேலில் கேட்டை அவர் பார்க்கவில்லை.” இங்குள்ள எபிரெயச் சொற்கள் அறநெறிப் பொருளில் “அக்கிரமம்/கேடு” என்றும், துன்பம் அல்லது வேதனை என்ற பொருளிலும் வாசிக்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “அவனில்.” இவ்வசனத்தின் முன்பகுதியில் இஸ்ரவேல் ஒருமைக் கூட்டுப்பெயராகப் பேசப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “அரசனின் ஆரவாரம்” என்பது இஸ்ரவேலின் நடுவிலுள்ள அரச வாழ்த்தொலியைக் குறிக்கலாம்; யெகோவாவின் அரச உடனிருப்பையும் இது சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: கவனிக்கவில்லை
  rationale: נבט என்பது உற்றுநோக்குதல் அல்லது கவனித்தல் என்ற பொருளைத் தருகிறது. இணைவரியில் வரும் பொதுவான ‘காணவில்லை’ என்பதிலிருந்து இதன் நுண்ணிய வேறுபாட்டைக் காக்கிறது.
- source_word: אָוֶן
  choice: துன்பம்
  rationale: இச்சொல் அக்கிரமம், கேடு, துன்பம் ஆகிய பொருள்களை உடையது. பிலேயாமின் ஆசீர்வாதச் சூழலிலும் עָמָל உடனான இணைப்பிலும் ‘துன்பம்’ இயல்பாகப் பொருந்துகிறது; அறநெறிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: רָאָה
  choice: காணவில்லை
  rationale: ראה என்பதன் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு; எபிரெய இணை அமைப்பையும் காக்கிறது.
- source_word: עָמָל
  choice: துயரம்
  rationale: இச்சொல் கடின உழைப்பு, துன்பம், துயரம் ஆகியவற்றைக் குறிக்கலாம். ‘துயரம்’ என்பது אָוֶן என்பதற்கான ‘துன்பம்’ என்பதிலிருந்து சொல்வேறுபாட்டைக் காத்தபடி இணையான கருத்தைத் தருகிறது.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: யாக்கோபில் / இஸ்ரவேலில்
  rationale: ב முன்னிடைச்சொல்லின் இடப்பொருளை நேரடியாகக் காத்து, கவிதை இணை அமைப்பைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுள்
  rationale: ஆண்பால் ஒருமை பின்னொட்டை காக்கிறது; யாக்கோபு/இஸ்ரவேல் மக்களை ஒருமைக் கூட்டுப்பெயராகப் பேசுகிறது.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: மூலத்தின் ஆண்பால் ஒருமை பின்னொட்டையும் இஸ்ரவேலைக் கூட்டொருமையாகச் சித்தரிப்பதையும் காக்கிறது.
- source_word: תְרוּעַת מֶלֶךְ
  choice: அரசனுக்கான ஆரவாரம்
  rationale: תְרוּעָה என்பது மகிழ்ச்சி முழக்கம், போர் முழக்கம் அல்லது அரச வாழ்த்தொலி எனப் பொருள்படலாம். ‘ஆரவாரம்’ அதன் பரந்த ஒலிப்பொருளைக் காக்கிறது; உருபில்லாத מֶלֶךְ ‘அரசன்’ எனத் தரப்படுகிறது.
- source_word: בּוֹ
  choice: அவர்கள் நடுவில்
  rationale: சொல்லுருவில் ‘அவனில்’ என்ற ஒருமை இருந்தாலும், இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இதற்கான இலக்கண விவரம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேல் அறவே பாவமற்றது என்று வசனம் கூறுகிறதா, அல்லது அதன்மேல் துன்பம்/கேடு நிலவவில்லை என்று கூறுகிறதா
  choice: முதன்மை உரையில் ‘துன்பம்’ மற்றும் ‘துயரம்’ எனத் தரப்பட்டுள்ளது.
  alternative: ‘யாக்கோபில் அக்கிரமத்தை அவர் காணவில்லை; இஸ்ரவேலில் தீமையை அவர் பார்க்கவில்லை.’
  rationale: אָוֶן, עָמָל ஆகியவற்றின் பொருள் வரம்பும் ஆசீர்வாதச் சூழலும் துன்பம்/கேடு என்ற வாசிப்பை ஆதரிக்கின்றன. எனினும் அறநெறிப் பொருள் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது; இஸ்ரவேலின் முழுமையான பாவமின்மை என்ற முடிவு உரைக்குள் புகுத்தப்படவில்லை.
- issue: ‘அரசன்’ என்பது யெகோவாவையே நேரடியாகக் குறிக்கிறதா
  choice: ‘அரசனுக்கான ஆரவாரம்’ என்று அடையாளத்தைத் தீர்மானிக்காமல் விடப்பட்டுள்ளது.
  alternative: ‘தெய்வீக அரசருக்கான வாழ்த்தொலி’ அல்லது ‘அரசனின் முழக்கம்’
  rationale: யெகோவாவின் உடனிருப்புடன் தொடர்புடைய அரச வாழ்த்தொலியை இச்சொற்றொடர் சுட்டக்கூடும்; ஆனால் அரசன் யார் என்பதை எபிரெய உரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்த இறையியல் நெருக்கடியும் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு விளங்கும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனிக்கவில்லை / காணவில்லை’ என்ற இணை அமைப்பு வேறுபட்ட எபிரெய வினைகளை வெளிப்படுத்துகிறது. யாக்கோபு/இஸ்ரவேல் கூட்டொருமையாக வருவதால் ‘அவன்’ வடிவங்கள் காக்கப்பட்டு, கடைசியில் இயல்பான தமிழுக்காக ‘அவர்கள் நடுவில்’ பயன்படுத்தப்பட்டுள்ளது.
