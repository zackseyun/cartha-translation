source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: ta
  text: கடவுள் பிலேயாமைச் சந்தித்தார்[a]. பிலேயாம் அவரிடம், “நான் அந்த ஏழு பலிபீடங்களையும் ஒழுங்குபடுத்தி, பலிபீடத்தின்மேல் ஒரு காளையையும் ஒரு செம்மறியாட்டுக் கடாவையும் பலியிட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் பிலேயாமை எதிர்கொண்டார்’; எபிரெய வினை ஒரு சந்திப்பையோ எதிர்கொள்ளுதலையோ குறிக்கலாம்; சில சூழல்களில் அது எதிர்பாராமல் நேர்வது என்ற நிழற்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: சந்தித்தார்
  rationale: קרה என்ற வினை இங்கு நேர்ந்த சந்திப்பையோ எதிர்கொள்ளுதலையோ குறிக்கிறது. கடவுள் எழுவாயாக இருப்பதால், தற்செயல் என்ற கருத்தைத் தேவையின்றி புகுத்தாமல் தெய்வீகச் சந்திப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினை ஒருமையில் இருப்பதாலும் சூழலில் ஒரே இறைவனைக் குறிப்பதாலும், தமிழில் ஒருமைத் தெய்வப் பட்டமாக மொழிபெயர்க்கப்பட்டது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் மரபாகவும் தெளிவாகவும் எழுத்துப்பெயர்க்கிறது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: பிலேயாம் அவரிடம் ... என்றான்
  rationale: தொடரும் முதலாம் நபர் கூற்று பேசுபவர் பிலேயாம் என்பதைத் தெளிவாக்குகிறது. எபிரெயத்தில் உள்ள பிரதிப்பெயரால் ஏற்படக்கூடிய தமிழ் குழப்பத்தைத் தவிர்க்கப் பெயர் மீண்டும் குறிப்பிடப்பட்டது.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: அந்த ஏழு பலிபீடங்களையும்
  rationale: முன்னரே அறிமுகமான குறிப்பிட்ட ஏழு பலிபீடங்களை definite noun phrase குறிக்கிறது; ‘அந்த’ என்பது இச்சூழல் சார்ந்த குறிப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עָרַכְתִּי
  choice: ஒழுங்குபடுத்தி
  rationale: ערך என்பதன் அடிப்படைப் பொருளான ஒழுங்காக அமைத்தல் அல்லது வரிசைப்படுத்தலைப் பாதுகாக்கிறது; வெறுமனே ‘தயாரித்தேன்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: וָאַעַל
  choice: பலியிட்டேன்
  rationale: பலிச் சூழலில் עלה என்பது பலிபீடத்தின்மேல் பலியாக ஏற்றுவதைக் குறிக்கிறது. ‘பலியிட்டேன்’ என்பது நவீன தமிழில் தெளிவான இயல்பான இணைச்சொல்.
- source_word: פָּר
  choice: ஒரு காளை
  rationale: பலிச் சூழலில் פר என்பதற்கான நேரடியான தமிழ் இணைச்சொல்.
- source_word: וָאַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் வேறு விலங்காகப் புரிய வாய்ப்புள்ளதால் விலங்கு வகை வெளிப்படையாகக் கூறப்பட்டது.
- source_word: בַּמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: மூலத்தில் ஒருமை definite வடிவம் இருப்பதால் அதையே பாதுகாக்கிறது; சூழலில் பகிர்மானப் பொருள் சாத்தியமாயினும், ‘ஒவ்வொரு பலிபீடத்தின்மேலும்’ என்று உரையை விரிவாக்கவில்லை.
theological_decisions:
- issue: וַיִּקָּר என்பதில் தெய்வீகச் சந்திப்பின் தன்மை
  choice: உண்மையான தெய்வீகச் சந்திப்பாக ‘சந்தித்தார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘எதிர்ப்பட்டார்’ அல்லது தற்செயலாக நேர்ந்ததுபோல் மொழிபெயர்த்தல்
  rationale: இந்த வேர் சில இடங்களில் நேர்தல் அல்லது தற்செயல் போன்ற நிழற்பொருளைக் கொள்ளலாம். ஆனால் இக்கதைச் சூழலில் கடவுள் பிலேயாமோடு தொடர்புகொள்கிறார்; ஆகவே தற்செயல் குறித்த கோட்பாட்டுத் தீர்மானத்தைத் திணிக்காமல் சந்திப்பு என்ற பொருள் முதன்மைப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தரமான தமிழ் பயன்படுத்தப்பட்டது. ‘பலிபீடம்’, ‘செம்மறியாட்டுக் கடா’ ஆகியவை துல்லியத்திற்காகத் தேர்ந்தெடுக்கப்பட்டன. பேச்சாளர் குழப்பத்தைத் தவிர்க்க ‘பிலேயாம்’ மீண்டும் வெளிப்படையாகக் குறிப்பிடப்பட்டது; இறுதி ‘பலிபீடம்’ மூலத்தின் ஒருமையிலேயே வைக்கப்பட்டது.
