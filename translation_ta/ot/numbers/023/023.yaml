  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: ta
  text: ஏனெனில், யாக்கோபுக்கு எதிராகச் சகுனம் பார்ப்பது இல்லை; இஸ்ரவேலுக்கு எதிராகக் குறிசொல்லுதலும் இல்லை. இந்நேரத்தில் யாக்கோபையும் இஸ்ரவேலையும் குறித்து, ‘கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!’ என்று சொல்லப்படும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחַשׁ
  choice: சகுனம் பார்ப்பது
  rationale: இச்சூழலில் இந்தப் பெயர்ச்சொல், அறிகுறிகள் அல்லது சகுனங்களைக் கொண்டு மறைவானதை அறிய முயலும் செயலைக் குறிக்கிறது. நவீனத் தமிழில் ‘சகுனம் பார்ப்பது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: קֶסֶם
  choice: குறிசொல்லுதல்
  rationale: மறைவான அறிவை மாந்திரீக முறையில் நாடும் செயலைக் குறிக்கிறது. נַחַשׁ என்பதிலிருந்து ஓரளவு வேறுபாட்டைப் பேணுவதற்காக ‘குறிசொல்லுதல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: யாக்கோபுக்கு எதிராக / இஸ்ரவேலுக்கு எதிராக
  rationale: ב என்ற முன்னிடைச்சொல் சொற்படியாக ‘இல்’ எனப் புரிந்துகொள்ளப்படலாம். எனினும், பிலேயாமின் உரையில் இஸ்ரவேலுக்கு எதிரான சாபமும் மறைவித்தை முயற்சியும் பலிக்காது என்பதே முன்னிலை பெறுவதால் ‘எதிராக’ என்ற சூழல்சார் பொருள் முதன்மை உரையில் தரப்பட்டது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: כָּעֵת
  choice: தக்க நேரத்தில்
  rationale: இச்சொற்றொடர் ‘இப்போது/இந்நேரத்தில்’ என்றும் பொருள்படலாம்; இங்கு கடவுளின் செயல் வெளிப்பட்டு அறிவிக்கப்படும் பொருத்தமான நேரம் என்ற நுண்ணுணர்வை ‘தக்க நேரத்தில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֵאָמֵר
  choice: சொல்லப்படும்
  rationale: எபிரெய மொழியின் செயப்பாட்டு, தனிநபரைச் சுட்டாத எதிர்கால வடிவத்தைத் தமிழில் ‘சொல்லப்படும்’ என்பதன் மூலம் பேணுகிறது.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: யாக்கோபிடமும் இஸ்ரவேலிடமும்
  rationale: ל என்பதன் அடிப்படைத் திசை அல்லது பெறுநர் பொருளைப் பேணி, அறிவிப்பு அவர்களிடம் சொல்லப்படுவதாக மொழிபெயர்க்கப்பட்டது. ‘அவர்களைப்பற்றி’ என்பதும் சூழலில் சாத்தியம்.
- source_word: מַה פָּעַל אֵל
  choice: கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!
  rationale: מַה இங்கு வியப்பை வெளிப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டது; வினைமுற்று நிறைவேற்றப்பட்ட செயலைக் குறிக்கிறது. கேள்வியாகத் தீர்மானிக்காமல், தீர்க்கதரிசன உரையின் உச்சத்துக்கேற்ற வியப்புரையாகத் தமிழ் வடிவமைக்கப்பட்டது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל பொதுவான இறைப்பட்டமாக வருகிறது; உடனடிச் சூழல் ‘வல்லமையுள்ள கடவுள்’ போன்ற விரிவாக்கத்தைக் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: இந்த வசனம் இஸ்ரவேலுக்குள் மறைவித்தை இல்லை என்று கூறுகிறதா, அல்லது இஸ்ரவேலுக்கு எதிராக அது பலிக்காது என்று கூறுகிறதா?
  choice: இஸ்ரவேலுக்கு எதிரான சகுனம் பார்த்தலும் குறிசொல்லுதலும் பலிக்காது என்ற சூழல்சார் வாசிப்பு முதன்மை உரையில் தரப்பட்டது.
  alternative: யாக்கோபில் சகுனம் பார்த்தல் இல்லை; இஸ்ரவேலில் குறிசொல்லுதல் இல்லை.
  rationale: பிலேயாமின் அருளுரையில், இஸ்ரவேலைச் சபிக்க இயலாததும் கடவுளின் ஆசீர்வாதத்தை மறைவித்தை முறைகள் மாற்ற இயலாததும் மையமாக உள்ளது. இருப்பினும் எபிரெய முன்னிடைச்சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: מַה פָּעַל אֵל என்பது கேள்வியா அல்லது வியப்புரையா?
  choice: ‘கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!’ என்ற வியப்புரை.
  alternative: ‘கடவுள் என்ன செய்திருக்கிறார்?’ என்ற கேள்வி.
  rationale: கடவுள் இஸ்ரவேலுக்காகச் செய்த வல்ல செயலைப் பொதுவாக அறிவிக்கும் அருளுரையின் உச்சமாக இருப்பதால் வியப்புரை சூழலுக்கு ஏற்றது; இலக்கண ரீதியாகச் சாத்தியமான கேள்வி வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அருளுரைக்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. ‘சகுனம் பார்ப்பது’ மற்றும் ‘குறிசொல்லுதல்’ ஆகியவை தொடர்புடைய இரு மறைவித்தைச் சொற்களுக்கிடையேயான வேறுபாட்டை ஓரளவு பேணுகின்றன. ‘பலிக்காது’ என்பது எபிரெயத்தில் வெளிப்படையாக உள்ள வினை அல்ல; ב என்ற முன்னிடைச்சொல்லின் சூழல்சார் ‘எதிராக’ என்ற வாசிப்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
