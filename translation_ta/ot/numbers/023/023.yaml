revisions:
- from: ஏனெனில், யாக்கோபுக்கு எதிராகச் சகுனம் பார்ப்பது பலிக்காது[a]; இஸ்ரவேலுக்கு எதிராகக் குறிசொல்லுதலும் பலிக்காது. தக்க நேரத்தில் யாக்கோபிடமும் இஸ்ரவேலிடமும், ‘கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!’[b] என்று சொல்லப்படும்.
  to: ஏனெனில், யாக்கோபுக்கு எதிராகச் சகுனம் பார்ப்பது இல்லை; இஸ்ரவேலுக்கு எதிராகக் குறிசொல்லுதலும் இல்லை. இந்நேரத்தில் யாக்கோபையும் இஸ்ரவேலையும் குறித்து, ‘கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!’ என்று சொல்லப்படும்.
  rationale: 'The revision removes the unexpressed predicate ‘பலிக்காது,’ retains the contextually strong ‘against’ reading while preserving the literal ‘in’ alternative in a footnote, renders כָּעֵת as ‘இந்நேரத்தில்,’ and corrects the final lamed phrases to a proclamation concerning Jacob and Israel. Footnote anchors a and b remain attached respectively after ‘பலிக்காது’ was removed? To preserve structural anchoring, place [a] after ‘இல்லை’ in the first clause and [b] after the final exclamation in the published text: “ஏனெனில், யாக்கோபுக்கு எதிராகச் சகுனம் பார்ப்பது இல்லை[a]; இஸ்ரவேலுக்கு எதிராகக் குறிசொல்லுதலும் இல்லை. இந்நேரத்தில் யாக்கோபையும் இஸ்ரவேலையும் குறித்து, ‘கடவுள் எத்தகைய செயலைச் செய்திருக்கிறார்!’[b] என்று சொல்லப்படும்.”'
