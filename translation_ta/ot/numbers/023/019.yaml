  to: பொய் சொல்ல கடவுள் மனிதர் அல்ல; மனம் மாற மனிதப் பிள்ளையும் அல்ல.[a] அவர் சொல்லி அதைச் செய்யாமல் இருப்பாரா? அவர் உரைத்து அதை நிலைநிறுத்தாமல் இருப்பாரா?[b]
  rationale: திருத்தம் மொழிபெயர்ப்பின் பொருளை மாற்றாது. மூலத்தின் மனிதர்/மனிதப் பிள்ளை என்ற கவிதை இணைநிலையையும், கடவுளின் நம்பகத்தன்மையை வலியுறுத்தும் சொல்லாட்சிக் கேள்விகளையும் பாதுகாத்தபடி, இயல்பற்ற சொல்லையும் தேவையற்ற காலத் தொடர்ச்சியையும் சீர்செய்கிறது.
