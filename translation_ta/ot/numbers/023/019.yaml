id: NUM.23.19
reference: Numbers 23:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: ta
  text: பொய் சொல்ல கடவுள் மனிதர் அல்ல; மனம் மாற மனிதப் பிள்ளையும் அல்ல.[a] அவர் சொல்லி அதைச் செய்யாமல் இருப்பாரா? அவர் உரைத்து அதை நிலைநிறுத்தாமல் இருப்பாரா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதப் பிள்ளை” என்பது இங்கு ஒரு மனிதரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; மேசியாவுக்குரிய பட்டம் அல்ல. “மனம் மாற” என்பதற்கு “தன் முடிவிலிருந்து பின்வாங்க” என்றும் மொழிபெயர்க்கலாம்; இங்கு ஒழுக்கத் தவறுக்காக மனந்திரும்புதல் குறிக்கப்படவில்லை.
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: “நிலைநிறுத்துதல்” என்பதன் எபிரெயச் சொல்லாட்சி நேரடியாக “நிற்கச் செய்தல்” என்று பொருள்படும்; “நிறைவேற்றுதல்” அல்லது “உறுதிப்படுத்துதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; மனிதருடன் செய்யப்படும் எதிர்மறை ஒப்பீட்டில் இயல்பான தமிழ்ச் சொல்.
- source_word: אִישׁ
  choice: மனிதர்
  rationale: ஆண் என்ற குறுகிய பொருளைவிட இங்கு மனித இயல்பே கடவுளுடன் ஒப்பிடப்படுகிறது; அடுத்துள்ள ‘மனிதப் புதல்வர்’ என்ற இணைவரியையும் இது தாங்குகிறது.
- source_word: וִיכַזֵּב
  choice: பொய் சொல்லுவதற்கு
  rationale: כזב என்பதன் பொய் கூறுதல் அல்லது பொய்த்துப்போதல் என்ற கருத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֶן אָדָם
  choice: மனிதப் புதல்வர்
  rationale: எபிரெயக் கவிதை இணைநிலையைப் பாதுகாக்கும் சொற்சார்ந்த மொழிபெயர்ப்பு; இங்கு இது மேசியாவுக்குரிய பட்டம் அல்ல, மனிதரைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וְיִתְנֶחָם
  choice: மனம் மாறுவதற்கு
  rationale: נחם என்ற வினையின் இச்சூழலிலான எண்ணம் அல்லது நோக்கத்தை மாற்றுதல் என்ற பொருளைத் தருகிறது; ஒழுக்கத் தவறுக்காக மனந்திரும்புதல் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: הַהוּא אָמַר
  choice: அவர் சொல்லிவிட்டு
  rationale: எபிரெயில் கூற்றாகத் தொடங்கி தொடர்ச்சியில் வினாவாக அமையும் சொல்லாட்சியை இயல்பான தமிழ் வினாவாக வெளிப்படுத்துகிறது.
- source_word: יַעֲשֶׂה
  choice: அதைச் செய்யாமல் இருப்பாரா
  rationale: அவர் சொன்னதைச் செயல்படுத்துதல் என்ற மறைபொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְדִבֶּר
  choice: அவர் உரைத்துவிட்டு
  rationale: முந்தைய ‘சொல்லிவிட்டு’ என்பதுடன் கவிதை இணைநிலையைப் பேணுவதோடு சற்று உயர்ந்த, கண்ணியமான நடையையும் தருகிறது.
- source_word: יְקִימֶנָּה
  choice: அதை நிலைநிறுத்தாமல் இருப்பாரா
  rationale: קום என்பதன் ‘நிற்கச் செய்தல்’ என்ற உருவகத்தைப் பாதுகாத்து, சொன்ன வார்த்தையை உறுதியாக நிறைவேற்றுதல் என்ற பொருளையும் அளிக்கிறது.
theological_decisions:
- issue: וְיִתְנֶחָם என்பதில் கடவுளின் மாறாத தன்மை குறித்த மொழியாக்கம்
  choice: மனம் மாறுவதற்கு
  alternative: இரங்கித் தன் முடிவை மாற்றுவதற்கு; மனந்திரும்புவதற்கு
  rationale: இவ்வசனத்தின் மையம் மனிதரைப்போல் நம்பகமற்றவராகக் கடவுள் இல்லை என்பதே. ‘மனம் மாறுதல்’ அந்தக் கருத்தை வெளிப்படுத்துகிறது; ஆனால் வேதத்தின் பிற இடங்களில் உள்ள இறை இரங்கல் மொழியுடன் தோன்றும் பதற்றத்தைத் தேவையின்றி தத்துவ ரீதியாகத் தீர்த்துவிடவில்லை.
- issue: בֶן אָדָם என்பதை மேசியாப் பட்டமாகப் புரிந்துகொள்ளலாமா
  choice: மனிதரைக் குறிக்கும் ‘மனிதப் புதல்வர்’ என்ற எபிரெய மரபுத்தொடர்
  alternative: மனிதர்
  rationale: இங்கு அது אִישׁ என்பதற்கு இணையாக சாதாரண மனிதரைக் குறிக்கிறது; மேசியாவைப் பற்றிய பட்டத்தை உரைக்குள் இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கவிதை இணைநிலையும் இரு சொல்லாட்சிக் கேள்விகளும் பாதுகாக்கப்பட்டுள்ளன. ‘மனிதப் புதல்வர்’ வாசகருக்குத் தவறான மேசியாப் பொருள் தரக்கூடும் என்பதால் பிரதான உரையிலேயே [a] குறிப்பு இணைக்கப்பட்டுள்ளது; ‘நிலைநிறுத்துதல்’ என்ற எபிரெய உருவகத்திற்கு [b] விளக்கம் தரப்பட்டுள்ளது.
