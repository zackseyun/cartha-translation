revisions:
- from: பிலேயாம் பாலாக்குக்கு மறுமொழியாக, “நான் உன்னிடம், ‘யாவே சொல்வதையெல்லாம் நான் செய்வேன்’ என்று சொல்லவில்லையா?” என்றான்.
  to: 'பிலேயாம் பாலாக்கிடம் பதிலளித்துப் பேசினான்: “நான் உன்னிடம், ‘யாவே சொல்வதையெல்லாம் நான் செய்வேன்’ என்று சொல்லவில்லையா?”'
