id: NUM.23.26
reference: Numbers 23:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: ta
  text: 'பிலேயாம் பாலாக்கிடம் பதிலளித்துப் பேசினான்: “நான் உன்னிடம், ‘யாவே சொல்வதையெல்லாம் நான் செய்வேன்’ என்று சொல்லவில்லையா?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெய உரையின் ‘பதிலளித்து, சொன்னான்’ என்ற இரட்டை வினைமுறைத் தொடரை, பொருளை இழக்காமல் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: நான் உன்னிடம் ... என்று சொல்லவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவைத் தமிழில் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: யாவே சொல்வதையெல்லாம்
  rationale: כֹּל אֲשֶׁר என்பதன் முழுமையான பரப்பையும், יְדַבֵּר என்பதன் இச்சூழலுக்குரிய பொதுவான/தொடர்ச்சியான கருத்தையும் இயல்பாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், வழக்கமான அறிவியல் ஒலிப்புமுறையில் எழுத்துப்பெயர்க்கிறது.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: நான் செய்வேன்
  rationale: אֹתוֹ முந்தைய முழு கருத்தையே சுட்டுகிறது; தமிழில் ‘சொல்வதையெல்லாம் நான் செய்வேன்’ என்ற அமைப்பு அந்தச் சுட்டுதலை இயல்பாக உள்ளடக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புமுறை; இதனால் உரையின் தனிப்பெயர்த் தன்மை பாதுகாக்கப்படுகிறது.
- issue: பிலேயாமின் கூற்றில் கட்டாயமா அல்லது உறுதிப்பாடா
  choice: நான் செய்வேன்
  alternative: நான் செய்தே ஆகவேண்டும்
  rationale: אֶעֱשֶׂה நேரடியாக எதிர்காலச் செயலை/உறுதியைச் சொல்கிறது; ‘செய்தே ஆகவேண்டும்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத கட்டாய உணர்வைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத் தமிழில், உரையாடலுக்கேற்ற இயல்புடனும் வேதாகமக் கதையுரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
