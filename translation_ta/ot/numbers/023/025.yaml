  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. மூலத்தின் இணையான தடையுரைகள் பேணப்பட்டுள்ளன; எபிரெய இலக்கண வலியுறுத்தல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
