base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: ta
  text: பாலாக் பிலேயாமிடம், “அவனை ஒருபோதும் சபிக்காதே; அவனை ஒருபோதும் ஆசீர்வதிக்காதே![a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சபி—அவனைச் சபிக்காதே … ஆசீர்வதி—அவனை ஆசீர்வதிக்காதே” என்று ஒவ்வொரு கூறிலும் வலியுறுத்தும் வினை வடிவத்திற்குப் பின் வினைச்சொல் வருகிறது; இது மிகுந்த வலியுறுத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர்கதை வடிவத்தைத் தமிழின் இயல்பான உரையாடல் முடிப்பு முறையில் வெளிப்படுத்துகிறது.
- source_word: בָּלָק ... אֶל־בִּלְעָם
  choice: பாலாக் பிலேயாமிடம்
  rationale: பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, אֶל என்பது உரையாடலுக்கேற்ற ‘இடம்’ வேற்றுமையால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: גַּם ... גַּם
  choice: …வும் வேண்டாம்; …வும் வேண்டாம்
  rationale: இணையான இரு மறுப்புகளையும் தமிழில் இயல்பாகவும் சமச்சீராகவும் காட்டுகிறது.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: அவனைச் சபிக்கவும் வேண்டாம்
  rationale: קבב என்பதற்கு ‘சபி’ தெளிவான சூழல்சார் இணை. வினையெச்ச முழுப்பொருள் + வினை வடிவத்தின் வலியுறுத்தலை ‘வும் வேண்டாம்’ என்ற தடையுரையாலும் அடிக்குறிப்பாலும் தெரிவிக்கிறது.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: அவனை ஆசீர்வதிக்கவும் வேண்டாம்
  rationale: ברך என்பதற்கான வழக்கமான தமிழ் இணையைப் பயன்படுத்தி, முதல் கூறின் தடையுரை மற்றும் இணை அமைப்பைச் சமமாகப் பேணுகிறது.
