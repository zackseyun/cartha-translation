base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: ta
  text: பாலாக் தன் வீட்டுநிறைய வெள்ளியையும் தங்கத்தையும் எனக்குக் கொடுத்தாலும், யாவேயின் வார்த்தையை மீறி[a], என் சொந்த உள்ளத்தின் படி நன்மையோ தீமையோ செய்ய என்னால் முடியாது. யாவே எதைப் பேசுகிறாரோ, அதையே நான் பேசுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “யாவேயின் வாயைத் தாண்டி.”'
    reason: மூல எபிரெய மொழியின் உருவகத்தைச் சுட்டுகிறது.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: கொடுத்தாலும்
  rationale: אִם உடன் வரும் முற்றாத வினை இங்கு அனுமான நிபந்தனையைத் தருகிறது; தமிழில் ‘கொடுத்தாலும்’ என்பது ‘அப்படிச் செய்தால்கூட’ என்ற வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: தனது வீடு நிறைய வெள்ளியையும் தங்கத்தையும்
  rationale: வீடு முழுவதும் வெள்ளியும் தங்கமும் நிறைந்திருக்கும் செல்வப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא אוּכַל
  choice: என்னால் முடியாது
  rationale: நிபந்தனைச் சூழலிலுள்ள இயலாமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: யெகோவாவின் வாயிலிருந்து வந்ததை மீறி
  rationale: எபிரெய மொழியின் ‘யெகோவாவின் வாயைத் தாண்டுதல்’ என்ற படிமத்தில் ‘வாய்’ என்பதைக் காத்தபடி, அதன் பொருளான அவர் உரைத்ததை மீறுதலைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: நன்மையோ தீமையோ செய்ய
  rationale: மூலத்தின் எதிரிணையான ‘நன்மை அல்லது தீமை’ என்பதைச் சுருக்கமின்றி காக்கிறது.
- source_word: מִלִּבִּי
  choice: என் சொந்த உள்ளத்திலிருந்து
  rationale: பிலேயாமின் சொந்த உள்நோக்கம் அல்லது முனைப்பிலிருந்து செயல் எழுவதில்லை என்ற மூலத்தின் ‘இதயத்திலிருந்து’ என்னும் மொழியை காக்கிறது.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: யெகோவா எதைப் பேசுகிறாரோ, அதையே
  rationale: எதை அவர் உரைக்கிறாரோ அதையே பிலேயாம் உரைப்பான் என்ற தொடர்புறு மற்றும் மீள்சுட்டு அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: אֲדַבֵּר
  choice: நான் பேசுவேன்
  rationale: நேரடி உரையிலுள்ள எதிர்கால/உறுதிப்பாட்டு வலிமையைக் காத்து, முந்தைய ‘பேசுகிறாரோ’ என்பதுடன் சொல் ஒற்றுமையையும் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; அதைத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் காக்கிறது.
- issue: பிலேயாமின் இயலாமையின் வரம்பு
  choice: யெகோவா உரைத்ததை மீறித் தன் உள்ளத்திலிருந்து நன்மையோ தீமையோ செய்ய இயலாது
  alternative: ஆசீர்வாதம் அல்லது சாபம் குறித்த கட்டளையை மட்டும் மாற்ற இயலாது
  rationale: வசனம் கூறும் பரந்த சொற்களை அப்படியே காக்கிறது; அதேவேளை தீர்க்கதரிசனம் குறித்த கூடுதல் கோட்பாட்டு முடிவை உள்ளே கொண்டுவரவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’, ‘நன்மை’, ‘தீமை’, ‘மீறி’ ஆகிய சொற்கள் மூலத்தின் தீவிரத்தையும் இயல்பான தமிழ் வாசிப்பையும் சமநிலைப்படுத்துகின்றன.
