  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகத் தரப்பட்டுள்ளன: பாலாக்கின் பிலேயாமுக்கு எதிரான எரியும் கோபம், கைகளை அடித்த கோபச் சைகை, எதிரிகளைச் சபிக்கப் பிலேயாமை அழைத்த நோக்கம், எதிர்மறைத் திருப்பத்தைச் சுட்டும் «ஆனால் பார்», மற்றும் மூன்று சந்தர்ப்பங்களிலும் நிகழ்ந்த வலியுறுத்தப்பட்ட ஆசீர்வாதம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. «மிகுதியாக ஆசீர்வதித்துவிட்டாய்» என்பது בֵּרַכְתָּ בָרֵךְ என்ற வினை + infinitive absolute வலியுறுத்தலைப் பொருத்தமாக வெளிப்படுத்துகிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. «கொழுந்துவிட்டு எரிந்தது» கோபத்தின் எபிரெய உருவகத்தைத் தமிழில் உயிர்ப்புடன் தருகிறது; «தன் கைகளை ஒன்றோடொன்று அடித்துக்கொண்டான்» பாராட்டுக் கைதட்டல் என்று தவறாகப் புரியாமல் கோபச் சைகையைத் தெளிவாக்குகிறது.
