  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: ta
  text: அப்போது பிலேயாம்மீது பாலாக்கின் கோபம் கொழுந்துவிட்டு எரிந்தது; அவன் தன் கைகளை ஒன்றோடொன்று அடித்துக்கொண்டான். பாலாக் பிலேயாமிடம், “என் எதிரிகளைச் சபிப்பதற்காக உன்னை அழைத்தேன்; ஆனால் பார், நீ அவர்களை இந்த மூன்று முறையும் மிகுதியாக ஆசீர்வதித்துவிட்டாய்![a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆசீர்வதித்து ஆசீர்வதித்தாய்” எனச் சொற்பொருளாக உள்ளது; இது ஆசீர்வதித்த செயலை வலியுறுத்தும் அமைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: பிலேயாம்மீது பாலாக்கின் கோபம் கொழுந்துவிட்டு எரிந்தது
  rationale: கோபம் ‘எரிவது’ என்ற எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் வலிமையுடன் தக்கவைக்கிறது; אֶל என்பதன் பகைமை நோக்கை ‘மீது’ வெளிப்படுத்துகிறது.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: தன் கைகளை ஒன்றோடொன்று அடித்துக்கொண்டான்
  rationale: கோபத்தில் உள்ளங்கைகளை ஒன்றாக அடிக்கும் சைகையைத் தெளிவாக்குகிறது; ‘கைதட்டினான்’ என்பதில் தோன்றக்கூடிய பாராட்டு என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: לָקֹב אֹיְבַי קְרָאתִיךָ
  choice: என் எதிரிகளைச் சபிப்பதற்காக உன்னை அழைத்தேன்
  rationale: இறைவினையின் நோக்குப் பொருளையும், அழைத்ததன் காரணத்தையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וְהִנֵּה
  choice: ஆனால் பார்
  rationale: எதிர்பாராத விளைவைச் சுட்டும் முரண்பாட்டையும், கவனத்தை ஈர்க்கும் வலியுறுத்தலையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: மிகுதியாக ஆசீர்வதித்துவிட்டாய்
  rationale: முற்றுவினை மற்றும் infinitive absolute இணைப்பின் வலியுறுத்தலைத் தமிழில் தெரிவிக்கிறது; ‘இதைத்தவிர வேறொன்றும் செய்யவில்லை’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் இருக்கிறது.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: இந்த மூன்று முறையும்
  rationale: இதுவரை நிகழ்ந்த மூன்று சம்பவங்களையும் சுட்டும் demonstrative force-ஐ இயல்பான தமிழில் தக்கவைக்கிறது.
