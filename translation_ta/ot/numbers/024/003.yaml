  terminology: “பிலேயாம்,” “பெயோர்,” “மனிதன்,” “பிரகடனம்” ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க பயன்பாடுகள். நְאֻם என்பதற்கான “பிரகடனம்” இரு இடங்களிலும் ஒரேபோல் தரப்பட்டிருப்பது நல்லது.
