  source_fidelity: மூல எபிரேயத்தின் அமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. וַיִּשָּׂא מְשָׁלוֹ என்பதற்கு “தன் உரையைத் தொடங்கி,” נְאֻם என்பதற்கு இருமுறையும் “பிரகடனம்,” மற்றும் בְּנוֹ בְעֹר என்பதற்கு “பெயோரின் மகன்” என்பன பொருத்தமானவை. שְׁתֻם הָעָיִן என்பதன் சிக்கலான, நேரடியாக ‘மூடப்பட்ட/அடைக்கப்பட்ட கண்’ எனத் தோன்றும் வாசிப்பை முதன்மைப் பாடம் தக்கவைக்கிறது.
