source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: ta
  text: 'பின்பு அவன் தன் உரையைத் தொடங்கி இவ்வாறு சொன்னான்:

    “பெயோரின் மகன் பிலேயாமின் பிரகடனம்;

    கண் மூடப்பட்ட மனிதனின் பிரகடனம்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண் திறக்கப்பட்ட மனிதன்.” தீர்க்கதரிசனக் காட்சியின் சூழலும் பண்டைய விளக்க மரபும் இவ்வாறு புரிந்துகொள்ள வழிவகுக்கின்றன; ஆனால் எபிரேய வடிவம் இன்னும் நேரடியாக “மூடப்பட்ட” அல்லது “அடைக்கப்பட்ட” என்பதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: அவன் தன் உரையைத் தொடங்கி
  rationale: נשׂא משל என்பது முறையான கவிதை உரையை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடர். ‘உரையைத் தொடங்கி’ என்பது அதன் செயல்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இதைத் தனியாக ‘இறைவாக்கு’ என்று மொழிபெயர்த்து נְאֻם என்பதுடனான வேறுபாட்டை அழிக்கவில்லை.
- source_word: וַיֹּאמַר
  choice: இவ்வாறு சொன்னான்
  rationale: אמר என்பதன் வழக்கமான கதையுரைச் சொல்லாட்சியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְאֻם
  choice: பிரகடனம்
  rationale: முறையான தீர்க்கதரிசன அறிவிப்பின் தன்மையை ‘பிரகடனம்’ தக்கவைக்கிறது. ‘வாக்கு’ என்பதைவிட இது பேசுபவரின் உரை என்ற அமைப்பைத் தெளிவாக்குகிறது.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: பெயோரின் மகன் பிலேயாம்
  rationale: பெற்றோர் உறவைக் குறிக்கும் எபிரேய இணைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது; பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הַגֶּבֶר
  choice: மனிதன்
  rationale: இச்சுயவிளக்கச் சூத்திரத்தில் גבר என்பதற்கான இயல்பான பொருளை வழங்குகிறது; தேவையின்றி ‘வலிமைமிக்கவன்’ என்று விரிவுபடுத்தவில்லை.
- source_word: שְׁתֻם הָעָיִן
  choice: கண் மூடப்பட்ட
  rationale: மசோரா எபிரேய வடிவின் நேரடியான சொற்பொருள் ‘மூடப்பட்ட/அடைக்கப்பட்ட’ என்பதையே ஆதரிக்கிறது. தீர்க்கதரிசனக் காட்சிச் சூழலின் அடிப்படையில் ‘கண் திறக்கப்பட்ட’ என்ற புரிதல் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: שְׁתֻם הָעָיִן என்ற பிலேயாமின் காட்சிசார் விளக்கத்தின் பொருள்
  choice: கண் மூடப்பட்ட
  alternative: கண் திறக்கப்பட்ட
  rationale: மூலமொழிக்கு முன்னுரிமை கொடுத்து மசோரா வடிவின் நேரடியான பொருள் முதன்மைப் பாடத்தில் வைக்கப்படுகிறது. காட்சிசார் சூழலும் பண்டைய விளக்க மரபும் ஆதரிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டு, உரையின் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், கவிதைத் தன்மையும் முறையான பிரகடனத்தின் கண்ணியமும் நிலைக்குமாறும் அமைக்கப்பட்டது. இருமுறை வரும் נְאֻם என்பதற்கு இருமுறையும் ‘பிரகடனம்’ என்று வழங்கி எபிரேய இணை அமைப்பு பாதுகாக்கப்பட்டது.
