  source_fidelity: திருத்தம் தேவை. எபிரேயத்தில் சேயீர் ‘அவனுடைய பகைவர்களின்’ உடைமையாகும்; வரைவில் இடைக்கோடுகள் மூலம் ‘சேயீர்’ மற்றும் ‘அவனுடைய பகைவர்கள்’ ஒரே நிலைச்சொற்களாகக் காட்டப்பட்டுள்ளன. மேலும் பன்மை வினைச்சொல் (‘உடைமையாவார்கள்’) பகைவர்களைப் பொருளாக மாற்றுகிறது; ஆனால் எபிரேய வினைச்சொல் ஒருமையில் சேயீரையே குறிக்கிறது.
  naturalness: ‘சேயீரும் அவனுடைய பகைவர்களின் உடைமையாகும்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘இஸ்ரவேலோ வல்லமையுடன் செயல்படும்’ ஏற்றது; கவிதைநடையில் ‘இஸ்ரவேல் வல்லமையுடன் செயல்படும்’ என்றும் சொல்லலாம், ஆனால் தற்போதைய இணைப்புமுறை இயல்பானதே.
  terminology: ஏதோம், சேயீர், இஸ்ரவேல் ஆகிய பெயர்கள் ஏற்ற ஒலிபெயர்ப்புகள். יְרֵשָׁה-க்கு ‘உடைமை’ பொருத்தமானது. עֹשֶׂה חָיִל-க்கு ‘வல்லமையுடன் செயல்படும்’ மூலத்தின் வலிமை/வீரக் கருத்தைத் தக்கவைக்கிறது. ஆண்பால் ஒருமைச் சுட்டான ‘அவனுடைய’ பாதுகாக்கப்பட வேண்டும்; அதன் முன்னிலைத் தொடர்பை உரையில் தீர்மானிக்கக் கூடாது.
