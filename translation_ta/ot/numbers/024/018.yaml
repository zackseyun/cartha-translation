source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: ta
  text: ஏதோம் உடைமையாகும்; சேயீரும் அவனுடைய பகைவர்களின் உடைமையாகும்[a]; இஸ்ரவேலோ வல்லமையுடன் செயல்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘அவனுடைய பகைவர்கள்’ என்பதில் ஆண்பால் ஒருமை உடைமைச் சுட்டு உள்ளது. அது சுற்றியுள்ள தீர்க்கவாக்கில் கூறப்படும் ஆட்சியாளரையோ, சேயீர்/ஏதோமையோ சுட்டுகிறதா என்பது குறித்து கருத்து வேறுபாடு உண்டு. எனவே இதை ‘சேயீர் அதன் பகைவர்களின் உடைமையாகும்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் நேரடியாக, ‘வல்லமை செய்கிறது’; இது வலிமையைக் காட்டுதல் அல்லது வீரத்துடன் செயல்படுதல் என்ற பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: உடைமையாகும்
  rationale: தீர்க்கதரிசன உரையில் எதிர்காலத்தில் ஏற்படும் நிலையை இயல்பான தமிழில் காட்டுகிறது; எபிரேய வாக்கியத்தின் ‘ஆகும்’ என்ற மாற்றநிலையும் தக்கவைக்கப்படுகிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: நாடு/நிலப்பகுதியைக் குறிக்கும் இயற்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְרֵשָׁה
  choice: உடைமை
  rationale: கைப்பற்றப்பட்டு ஒருவரின் வசமாகும் பொருள் அல்லது நிலப்பகுதி என்ற இராணுவச் சூழலுக்குரிய பொருளைத் தருகிறது; ‘சுதந்தரம்’ என்று மொழிபெயர்த்து குடும்ப மரபுரிமை நுணுக்கத்தைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: שֵׂעִיר
  choice: சேயீர்
  rationale: ஏதோமுக்கு இணையாக வரும் இடப்பெயர்; மூலத்தில் ‘மலை’ என்ற சொல் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: אֹיְבָיו
  choice: அவனுடைய பகைவர்கள்
  rationale: எபிரேயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி இருப்பதால் ‘அவனுடைய’ என்பது தக்கவைக்கப்படுகிறது; பெயர்ச்சொல் பன்மையில் உள்ளதால் ‘பகைவர்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேலோ
  rationale: இறுதி உட்பிரிவின் மாறுபட்ட மையத்தை இயல்பான தமிழில் காட்ட ‘-ஓ’ பயன்படுத்தப்பட்டுள்ளது; இது எபிரேய இணைப்புச் சொல்லின் தொடர்பை மிகையாக விளக்குவதில்லை.
- source_word: עֹשֶׂה חָיִל
  choice: வல்லமையுடன் செயல்படும்
  rationale: சொற்றொடர் வலிமையை வெளிப்படுத்துதல் அல்லது வீரச்செயல் புரிதல் என்ற பொருளைக் கொண்டது. ‘வல்லமையுடன் செயல்படும்’ என்பது அதன் பரந்த வலிமை/வீர நுணுக்கத்தை நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ‘அவனுடைய பகைவர்கள்’ என்பதிலுள்ள ஒருமைச் சுட்டின் தொடர்பு
  choice: ஆண்பால் ஒருமைச் சுட்டை ‘அவனுடைய’ என்று வெளிப்படையாகத் தக்கவைத்து, சேயீரை அந்தப் பகைவர்களோடு விளக்கநிலையில் இணைத்தல்
  alternative: சேயீர் அல்லது ஏதோமையே சுட்டுவதாகக் கொண்டு ‘அதன் பகைவர்கள்’ என்று மொழிபெயர்த்தல்; அல்லது பகைவர்கள் சேயீரை உடைமையாக்குவார்கள் எனப் பொருள்படுத்தல்
  rationale: எபிரேய வடிவம் ஆண்பால் ஒருமைச் சுட்டைக் கொண்டுள்ளது; சுற்றியுள்ள தீர்க்கவாக்கில் வரும் ஒருமை ஆட்சியாளரை அது சுட்டக்கூடும். அதேவேளை இலக்கணத் தொடர்பு முழுமையாகத் தெளிவில்லை. எனவே சுட்டை மாற்றாமல் வைத்து, அதன் தொடர்பிலுள்ள உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கவிதைத் தீர்க்கவாக்கின் இணை அமைப்பு அரைப்புள்ளி மற்றும் இடைக்கோடுகளால் தக்கவைக்கப்பட்டுள்ளது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
