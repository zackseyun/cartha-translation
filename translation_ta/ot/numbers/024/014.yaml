  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: ta
  text: இப்போதோ, இதோ, நான் என் மக்களிடம் போகிறேன். வா, இந்த மக்கள் உன் மக்களுக்கு என்ன செய்வார்கள் என்பதை கடைசி நாட்களில்[a] உனக்கு அறிவுறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வருங்காலத்தில்.” எபிரெயச் சொற்றொடர் பொதுவாக வரவிருக்கும் காலத்தைக் குறிக்கலாம்; ஆனால் “கடைசி நாட்களில்” என்பது அதன் தீர்க்கதரிசனத் தொனியையும் காக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த கூற்றை அறிமுகப்படுத்தும் காலச் சுட்டு; தமிழில் இணைப்பை தனியே வெளிப்படுத்தாமல் இயல்பாக அமைந்துள்ளது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: பேசுபவரின் உடனடியான நிலைப்பாட்டையும் கூற்றின் வலியுறுத்தலையும் காக்கிறது.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: என் மக்களிடம் போகிறேன்
  rationale: நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் புறப்பாட்டை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לְכָה
  choice: வா
  rationale: கவனத்தையும் அணுகுதலையும் கோரும் எபிரெய கட்டளை வடிவின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: אִיעָצְךָ
  choice: உனக்கு அறிவுறுத்துகிறேன்
  rationale: יעץ என்பதன் ஆலோசனை/அறிவுரை என்ற மையப் பொருளைக் காக்கிறது; தொடர்ந்து வரும் முன்னறிவிப்புச் செய்தியையும் தமிழில் ஏற்கத்தக்கவாறு இணைக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: ஒருமைக் கூட்டுப்பெயரின் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעַמְּךָ
  choice: உன் மக்களுக்கு
  rationale: לְ என்ற முன்னிடைச்சொல்லின் நேரடியான உறவைப் பாதுகாக்கிறது; சூழலில் பகைமையான செயல் குறிக்கப்படலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: வருங்காலத்தில்
  rationale: இந்த எபிரெய மரபுத்தொடர் பரந்த எதிர்காலத்தைக் குறிக்கக்கூடும்; தமிழில் புரியத்தக்க வடிவம், அதேவேளை அதன் தீர்க்கதரிசன நுணுக்கம் குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים என்ற தீர்க்கதரிசன காலச் சொற்றொடர்
  choice: வருங்காலத்தில்
  alternative: கடைசி நாட்களில்
  rationale: சூழல் எதிர்கால நிகழ்வைக் குறிக்கிறது; கட்டாயமாக ஒரு முழுமையான இறுதிக்காலக் கோட்பாட்டை விதிக்காமல், சொற்றொடரின் சாத்தியமான இறுதிக்காலத் தொனியைக் குறிப்பில் காக்கிறது.
- issue: לְעַמְּךָ என்பதில் செயலின் திசை
  choice: உன் மக்களுக்கு
  alternative: உன் மக்களுக்கு எதிராக
  rationale: மூலத்தின் לְ வடிவை நேரடியாகக் காக்கிறது; பகைமைச் சார்பை உரையிலேயே கட்டாயமாகச் சேர்க்காமல் சூழல்சார் மாற்று வாசிப்பாகக் குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் தீர்க்கதரிசன உரைக்கு ஏற்ற கண்ணியமான நடை. ‘இதோ’ என்ற குறியிடப்பட்ட வலியுறுத்தல் விடப்படவில்லை. எல்லா குறிப்புக் குறிகளும் உரையில் இடம்பெற்றுள்ளன.
