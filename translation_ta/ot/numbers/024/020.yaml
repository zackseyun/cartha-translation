source:
  edition: WLC
  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: ta
  text: 'பின்பு அவன் அமாலேக்கைப் பார்த்து, தன் உரையை[a] எடுத்துரைத்து:


    “அமாலேக்கு நாடுகளுக்குள் முதலானவன்[b];

    ஆனால் அவனுடைய முடிவு முற்றழிவே.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் தீர்க்கவுரையை உரைத்தான்,” “தன் பழமொழிக் கூற்றை எடுத்துரைத்தான்,” அல்லது “தன் உவமைக் கூற்றை உரைத்தான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கவிதைக் கூற்று, பழமொழி, ஏளனக் கூற்று, அல்லது தீர்க்கவுரை ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “நாடுகளுக்குள் முதன்மையானவன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் காலத்தில் முதல் என்பதையோ, நிலை அல்லது சிறப்பில் முதன்மை என்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “அவனுடைய முடிவு அழிவாகும்” அல்லது “அவனுடைய இறுதிநிலை அழிவே” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானது; அது முழுமையான அழிவை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: பின்பு அவன் அமாலேக்கைப் பார்த்து
  rationale: וַיַּרְא கதைத் தொடர்ச்சியை முன்னெடுக்கிறது; ראה என்பதன் நேரடியான பொருள் ‘பார்’. ‘பின்பு’ இயல்பான தமிழ் தொடர்ச்சியைத் தருகிறது.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: தன் கவிதை உரையை எடுத்துரைத்துச் சொன்னான்
  rationale: מָשָׁל என்பது பழமொழி, உவமைக்கூற்று, ஏளனப்பாடல் அல்லது தீர்க்கதரிசனக் கவிதை உரை ஆகியவற்றைக் குறிக்கலாம். இங்குள்ள பிலேயாமின் உயர்நடைக் கூற்றுகளுக்கு ‘கவிதை உரை’ பொருந்துகிறது; எந்த ஓர் குறிப்பிட்ட இலக்கிய வகையையும் கட்டாயப்படுத்தாமல் அதன் செய்யுள் தன்மையை வெளிப்படுத்துகிறது.
- source_word: רֵאשִׁית גּוֹיִם
  choice: நாடுகளில் முதலானவன்
  rationale: רֵאשִׁית என்பது கால வரிசையில் ‘முதல்’ என்றும் நிலைமையில் ‘முதன்மையான’ என்றும் பொருள்படலாம். ‘முதலானவன்’ அந்த இருபொருள் வாய்ப்பையும் ஓரளவு காக்கிறது; அடிக்குறிப்பு அதைத் தெளிவுபடுத்துகிறது.
- source_word: עֲמָלֵק
  choice: அமாலேக்கு
  rationale: இது இனக்குழு அல்லது தேசத்தைக் குறிக்கும் பெயர்; தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאַחֲרִיתוֹ
  choice: ஆனால் அவனுடைய முடிவு
  rationale: אַחֲרִית என்பது முடிவு, இறுதி விளைவு அல்லது பிற்கால நிலை என்பவற்றைக் குறிக்கும். தொடக்கத்துக்கும் முடிவுக்கும் உள்ள முரண்பாட்டைத் தமிழில் இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֲדֵי אֹבֵד
  choice: முற்றழிவே
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாக இருந்து அழிவின் இறுதித் தன்மையை வலியுறுத்துகிறது. ‘முற்றழிவே’ அந்த தீவிரத்தை வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்றென்றும்’ போன்ற காலக் கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ‘நாடுகளில் முதல்’ என்பதில் அமாலேக்கின் நிலை
  choice: காலத்தால் முதலானவன் அல்லது சிறப்புநிலையில் முதன்மையானவன் என்ற இரு வாய்ப்புகளையும் திறந்துவைத்தல்
  alternative: ‘நாடுகளில் மிகப் பழமையானவன்’ அல்லது ‘நாடுகளில் முதன்மையானவன்’ என்று ஒரே பொருளைத் தீர்மானித்தல்
  rationale: רֵאשִׁית גּוֹיִם என்ற எபிரெயத் தொடர் கால முன்னுரிமையையோ மேன்மை நிலையையோ குறிக்கலாம். வசனம் எதை நோக்குகிறது என்று விளக்காததால், மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடையில் வடிவமைக்கப்பட்டது. ‘அவன்’ என்பது அமாலேக்கு என்ற மக்களினத்தை ஒருமை உருவகமாகக் குறிப்பிடுகிறது. மூலத்தின் இணை அமைப்பும் தொடக்கம்–முடிவு முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
