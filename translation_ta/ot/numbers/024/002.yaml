base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: ta
  text: பிலேயாம் தன் கண்களை ஏறெடுத்துப் பார்த்தபோது, இஸ்ரவேல் தன் கோத்திரங்களின்படி முகாமிட்டிருப்பதைக் கண்டான்.[a] அப்போது கடவுளின் ஆவி அவன்மேல் வந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கோத்திரங்களின்படி குடியிருப்பதை” அல்லது “கோத்திரம் கோத்திரமாக முகாமிட்டிருப்பதை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளுடைய ஆவி அவன்மேல் இருந்தது.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: தன் கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: ‘கண்களை உயர்த்துதல்’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்து, அடுத்துள்ள ‘கண்டான்’ என்பதுடன் இயல்பான தமிழ் தொடரை உருவாக்குகிறது.
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: பிலேயாம் பார்வையை உயர்த்திய பின் இஸ்ரவேலின் முகாம் அமைப்பைக் கண்ணுற்றதை நேரடியாகக் குறிக்கிறது.
- source_word: שֹׁכֵן
  choice: முகாமிட்டிருப்பதை
  rationale: இந்தச் சூழலில் இஸ்ரவேல் கோத்திர ஒழுங்கில் தங்கியிருந்த முகாம் அமைப்பைக் குறிக்கிறது; பொதுவான ‘குடியிருத்தல்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: לִשְׁבָטָיו
  choice: தன் கோத்திரங்களின்படி
  rationale: לְ முன்னொட்டு இங்கு கோத்திர வாரியான ஒழுங்கு அல்லது பகிர்வைக் காட்டுகிறது. ‘இஸ்ரவேல்’ ஒருமைத் தொகுப்புப் பெயராக இருப்பதால் ‘தன்’ இயல்பாக உள்ளது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: தீர்க்கதரிசன உரையின் சூழலில் கடவுளிடமிருந்து வரும் ஆவிக்குரிய வல்லமையைச் சுட்டுகிறது; மூலத்தில் தனி சுட்டுப்பெயர் இல்லாததால் தமிழில் தேவையற்ற வரையறையைச் சேர்க்கவில்லை.
- source_word: וַתְּהִי עָלָיו
  choice: அவன்மேல் வந்தது
  rationale: வெறுமனே நிலைத்திருப்பதைவிட, அந்த நேரத்தில் ஆவி அவன்மேல் வந்து செயல்படுத்திய தொடக்க நுணுக்கத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்க்கதரிசன வல்லமை அளிக்கும் சூழலில் רוּחַ אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் ஆவி
  alternative: கடவுளுடைய ஆவி அவன்மேல் இருந்தது / கடவுளிடமிருந்து ஓர் ஆவி
  rationale: உடனடி சூழல் பிலேயாமின் தீர்க்கதரிசன உரையாக இருப்பதால் ‘கடவுளின் ஆவி’ என்பது முதன்மையான வாசிப்பு. எனினும் எபிரேயத்தில் சுட்டுப்பெயர் இல்லாததாலும், וַתְּהִי என்பதற்கு நிலைமையைக் குறிக்கும் வாசிப்பும் சாத்தியமாதலாலும் அந்த வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘கண்களை ஏறெடுத்தல்’ என்ற வேதாகமச் சூழலில் புரியக்கூடிய மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது; ‘முகாமிட்டிருத்தல்’ வனாந்தர முகாம் சூழலை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய முதன்மை உரைப்பகுதிகளுக்குப் பின்னர் இடப்பட்டுள்ளன.
