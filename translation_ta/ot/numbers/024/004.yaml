source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: ta
  text: இறைவனின் சொற்களைக் கேட்கிறவனும், எல்லாம் வல்லவரின் தரிசனத்தைக் காண்கிறவனும், கீழே விழுந்து, கண்கள் திறக்கப்பட்டவனுமான ஒருவனின் அறிவிப்பு[a]:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவிப்பு’ என்பதற்கு ‘தீர்க்கதரிசன அறிவிப்பு’ அல்லது ‘முறைமையான உரை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נְאֻם ஒரு கம்பீரமான தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் சிறப்புச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: ‘கண்கள் திறக்கப்பட்ட’ என்பதன் சொல்லாட்சியான பொருள் ‘கண்கள் மறைப்பு நீக்கப்பட்ட’ என்பதாகும். ‘கண்கள் திறந்தவனாய்’ என்றும் மொழிபெயர்க்கலாம். இந்த உருவகம் வெளிப்பாட்டைப் பெறும் பார்வையைக் குறிக்கிறது. ‘கீழே விழுந்து’ என்பதற்கு ‘கீழே விழுகிறவனாய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: அறிவிப்பு
  rationale: தீர்க்கதரிசனப் பாங்கிலான ஆழ்ந்த, முறைமையான உரையைச் சுட்டும் சொல்லாக இருப்பதால், நவீனத் தமிழில் புரியக்கூடிய அதேவேளையில் அதன் கம்பீரத்தையும் காக்கும் வகையில் ‘அறிவிப்பு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: இறைவனின் சொற்களைக் கேட்கிறவன்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்புவினையின் தொடர்ந்த பண்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; אֵל இங்கே பொதுவான இறைப்பட்டமாக இருப்பதால் ‘இறைவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מַחֲזֵה שַׁדַּי
  choice: எல்லாம் வல்லவரின் தரிசனம்
  rationale: מַחֲזֵה என்பது வெளிப்பாட்டின்போது காணப்படும் காட்சியை அல்லது தரிசனத்தைக் குறிக்கிறது; שַׁדַּי ஒரு இறைப்பட்டம் என்பதால் ஒலிபெயர்க்காமல் பொருள்பெயர்க்கப்பட்டது.
- source_word: יֶחֱזֶה
  choice: காண்கிறவன்
  rationale: கவிதைநடையிலான இந்தத் தற்குறிப்பில் பொதுவான, பண்புசார் நிகழ்காலப் பொருளைத் தருவதோடு தரிசனக் காட்சியைக் காணும் கருத்தையும் காக்கிறது.
- source_word: נֹפֵל
  choice: கீழே விழுந்தாலும்
  rationale: பங்கேற்புவினையின் இயக்கத் தன்மையைத் தக்கவைத்து, அவர் முழுமையாக முகங்குப்புறக் கிடந்தார் என்று தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது. தொடரும் சொற்றொடருடனான எதிர்மறை மாறுபாட்டை ‘ஆலும்’ இயல்பாகக் காட்டுகிறது.
- source_word: וּגְלוּי עֵינָיִם
  choice: கண்கள் திறந்திருக்கிறவன்
  rationale: சொல்லாட்சியில் ‘கண்கள் மறைப்பு நீக்கப்பட்டவை’ என்ற உருவகம் இருந்தாலும், அதன் வெளிப்பாட்டுப் பார்வை சார்ந்த கருத்தை இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: שַׁדַּי என்ற இறைப்பட்டத்தின் மொழிபெயர்ப்பு
  choice: எல்லாம் வல்லவர்
  alternative: ஷத்தாய்
  rationale: இது இச்சூழலில் பெயராக அல்ல, இறைப்பட்டமாகச் செயல்படுகிறது. ஆகவே ஒலிபெயர்ப்பு செய்வதற்குப் பதிலாக வழக்கமான பொருளை மொழிபெயர்ப்பது வாசகருக்குத் தெளிவளிக்கிறது; அதற்கு அப்பாற்பட்ட தனிப்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: விழுதல் மற்றும் திறந்த கண்கள் ஆகியவற்றின் தொடர்பு
  choice: கீழே விழுந்தாலும் கண்கள் திறந்திருக்கிறவன்
  alternative: கீழே விழுகிறவன், கண்கள் மறைப்பு நீக்கப்பட்டவன்
  rationale: இறுதி சொற்றொடரில் உள்ள எதிர்மாறான வலியுறுத்தலை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதேசமயம் விழுதல் மயக்கமா, பணிவான உடல்நிலையா, வெளிப்பாட்டின்போதான நிலையா என்பதை உரை தீர்மானிக்காதபடி விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் கம்பீரத்தையும் இணை அமைப்பையும் காக்கும் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறிவிப்பு’ என்ற சொல் பொதுவாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டாலும் அதன் தீர்க்கதரிசனத் தன்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வசனம் முந்தைய வசனத்திலிருந்து தொடரும் கவிதைத் துணுக்காக இருப்பதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
