  source_fidelity: வரைவில் נְאֻם (‘அறிவிப்பு’) இருமுறை இடம்பெற்றிருப்பதால் எபிரெய மூலத்தின் ஒரே தீர்க்கதரிசன அறிமுகத் தொடரமைப்பு சிதைகிறது. மேலும் נֹפֵל மற்றும் וּגְלוּי עֵינָיִם ஆகிய இணை பங்கேற்புத் தொடர்களைத் தமிழில் ஒரே நபரை விளக்கும் வகையில் அமைத்தல் வேண்டும். ‘கீழே விழுந்து’ என்பது உடல்நிலையைத் தேவையற்ற வகையில் விளக்காமல் காக்கிறது; ‘கண்கள் திறக்கப்பட்ட’ என்பது ‘uncovered/unveiled’ என்ற மூல உருவகத்துக்கு ‘கண்கள் திறந்த’ என்பதைக் காட்டிலும் நெருக்கமானது.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பானதாகவும், வசனத்தின் முறையான கவிதை/தீர்க்கதரிசனப் பாங்குக்கு ஏற்றதாகவும் உள்ளது. ஒரே ‘அறிவிப்பு’ தொடக்கத்திலும், அதற்கு முன் வரும் எல்லா விளக்கத் தொடர்களும் ஒரே நபரைக் குறிப்பதுமாக அமைந்துள்ளன.
  terminology: אֵל-க்கு ‘இறைவன்’, שַׁדַּי-க்கு ‘எல்லாம் வல்லவர்’, מַחֲזֵה-க்கு ‘தரிசனம்’ ஆகிய தேர்வுகள் பொருத்தமானவை. נְאֻם-க்கு ‘அறிவிப்பு’ ஏற்றது; அடிக்குறிப்பில் ‘தீர்க்கதரிசன அறிவிப்பு’ என்ற மாற்று அதன் முறையான தன்மையைத் தெளிவுபடுத்துகிறது.
