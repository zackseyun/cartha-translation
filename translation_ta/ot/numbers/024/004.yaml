- from: 'இறைவனின் சொற்களைக் கேட்கிறவனின் அறிவிப்பு[a]; எல்லாம் வல்லவரின் தரிசனத்தைக் காண்கிறவன், கீழே விழுந்தாலும் கண்கள் திறந்திருக்கிறவனின் அறிவிப்பு[b]:'
  to: இறைவனின் சொற்களைக் கேட்கிறவனும், எல்லாம் வல்லவரின் தரிசனத்தைக் காண்கிறவனும், கீழே விழுந்து, கண்கள் திறக்கப்பட்டவனுமான ஒருவனின் அறிவிப்பு[a]:[b]
