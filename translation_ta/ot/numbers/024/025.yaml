  naturalness: நவீன நிலையான தமிழில் வாசிப்பு இயல்பாகவும் சுருக்கமாகவும் உள்ளது. “பாலாக்கும்” என்பதில் உள்ள -உம், וְגַם-ன் சேர்க்கை வலிமையைச் சரியாகக் காட்டுகிறது. “தன் வழியே போனான்” தமிழில் தெளிவான கதைநடைச் சொற்றொடர்.
