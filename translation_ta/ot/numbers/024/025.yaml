base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: ta
  text: பின்பு பிலேயாம் எழுந்து புறப்பட்டுத் தன் இடத்திற்குத் திரும்பிப் போனான்; பாலாக்கும் தன் வழியே போனான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் எழுவதையோ புறப்படத் தொடங்குவதையோ குறிக்கலாம். தொடர் வினைநிகழ்வில் எபிரெயச் சொல்லின் இயக்கத்தைச் சுருக்கமாகப் பேணுகிறது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டு
  rationale: הלך என்பதற்கு பொதுவாக ‘போனான்’ என்று பொருள்; இங்கு எழுந்ததைத் தொடர்ந்து இடத்தைவிட்டு நகர்வதை இயல்பான தமிழில் ‘புறப்பட்டு’ எனக் கொள்வது, அடுத்துள்ள ‘திரும்பிப் போனான்’ என்பதோடு தேவையற்ற மீளுரையைத் தவிர்க்கிறது.
- source_word: וַיָּשָׁב
  choice: திரும்பிப் போனான்
  rationale: שׁוב மற்றும் இலக்கு குறிக்கும் לִמְקֹמוֹ இணைந்து முன்பிருந்த இடத்திற்குத் திரும்புவதைத் தெளிவாகக் குறிக்கின்றன.
- source_word: לִמְקֹמוֹ
  choice: தன் இடத்திற்கு
  rationale: מקום என்பதன் நேர்ப்பொருள் ‘இடம்’. மூலத்தில் வீடு என்று வெளிப்படையாக இல்லாததால் ‘தன் வீட்டிற்கு’ என விரிவுபடுத்தப்படவில்லை.
- source_word: וְגַם
  choice: பாலாக்கும்
  rationale: וְגַם என்பதன் இணைப்பு மற்றும் சேர்க்கைப் பொருள் தமிழில் பெயருடன் சேரும் ‘-உம்’ மூலமாக இயல்பாக வெளிப்படுகிறது.
- source_word: בָּלָק
  choice: பாலாக்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: הָלַךְ
  choice: போனான்
  rationale: இங்கு הלך பாலாக்கின் புறப்பாட்டை எளிய கதைநடையில் சுருக்கிக் கூறுகிறது.
- source_word: לְדַרְכּוֹ
  choice: தன் வழியே
  rationale: דרך என்பதன் ‘வழி’ என்ற அடிப்படைப் பொருளையும், ஒருவர் தமது வழியில் சென்றார் என்ற சொற்றொடரின் இயல்பையும் பேணுகிறது.
