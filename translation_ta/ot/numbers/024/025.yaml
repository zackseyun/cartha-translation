translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் இயக்கம் பேணப்பட்டாலும், தமிழில் இயல்பில்லாத அளவுக்கு இணைப்புச் சொற்கள் குவிக்கப்படவில்லை. எந்த அடிக்குறிப்பும் தேவையில்லை.
