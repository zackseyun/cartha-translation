  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: ta
  text: 'பின்பு அவன் தன் உரையைத் தொடங்கி இவ்வாறு கூறினான்: “பெயோரின் மகன் பிலேயாமின் பிரகடனம்; கண் திறக்கப்பட்ட மனிதனின் பிரகடனம்:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண் மூடப்பட்டவன்.” இந்த எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; இது ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: பின்பு அவன் தன் உரையைத் தொடங்கி
  rationale: נשׂא + מָשָׁל என்பது முறையான கவிதைமிகு உரையைத் தொடங்குவதைக் குறிக்கும் மரபுத்தொடர். சொல்லுக்குச் சொல் ‘உயர்த்தினான்’ என்பதற்குப் பதில், இயல்பான நவீனத் தமிழில் அதன் செயல்பாட்டைத் தருகிறது.
- source_word: וַיֹּאמַר
  choice: கூறியது
  rationale: மேற்கோள் உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடை வினை; தமிழில் உரையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: נְאֻם
  choice: பிரகடனம்
  rationale: அதிகாரபூர்வமான, தீர்க்கதரிசனத் தன்மையுள்ள சொற்றொடரைச் சுட்டுகிறது. வசனத்தில் இருமுறை வருவதால் ஒரே விதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: பெயோரின் மகன் பிலேயாம்
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, தந்தை–மகன் உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַגֶּבֶר
  choice: மனிதன்
  rationale: இங்கு ஆண் நபரைக் குறிக்கும் பொதுவான சொல்; ‘வலிமைமிக்கவன்’ என்ற சாத்தியமான நிழற்பொருள் சூழலில் முதன்மையானதல்ல.
- source_word: שְׁתֻם הָעָיִן
  choice: கண் திறக்கப்பட்ட
  rationale: சூழலில் தெய்வீகத் தரிசனத்தைப் பெறும் உணர்வை வெளிப்படுத்துகிறது. எனினும் எபிரெயச் சொற்றொடர் கடினமும் விவாதத்திற்குரியதுமாக இருப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பிலேயாமின் சுயவிளக்கமான שְׁתֻם הָעָיִן என்பதன் பொருள்
  choice: வெளிப்பாட்டைப் பெறும் பார்வையைக் குறிக்கும் வகையில் ‘கண் திறக்கப்பட்ட’
  alternative: ‘கண் மூடப்பட்ட’ அல்லது ‘மூடிய கண்ணையுடைய’
  rationale: அடுத்த வசனத்தின் தெய்வீகத் தரிசனம் மற்றும் திறக்கப்பட்ட கண்கள் பற்றிய மொழி ‘திறக்கப்பட்ட’ என்ற சூழல்சார் புரிதலை ஆதரிக்கிறது. இருப்பினும் மூலமொழியின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. נְאֻם என்பதன் முறையான தொனிக்காக ‘பிரகடனம்’ பயன்படுத்தப்பட்டுள்ளது; விவாதத்திற்குரிய வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
