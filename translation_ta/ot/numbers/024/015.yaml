revisions:
- from: 'பின்பு அவன் தன் உரையைத் தொடங்கி கூறியது: “பெயோரின் மகன் பிலேயாமின் பிரகடனம்; கண் திறக்கப்பட்ட மனிதனின் பிரகடனம்:[a]”'
  to: 'பின்பு அவன் தன் உரையைத் தொடங்கி இவ்வாறு கூறினான்: “பெயோரின் மகன் பிலேயாமின் பிரகடனம்; கண் திறக்கப்பட்ட மனிதனின் பிரகடனம்:[a]”'
  rationale: The revision corrects the Tamil grammatical mismatch without altering the meaning. It keeps the formal repetition of נְאֻם, preserves the contextually likely “opened eye” reading, and retains the genuinely disputed closed-eye reading in a clearly anchored footnote.
