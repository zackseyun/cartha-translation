source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: ta
  text: 'பள்ளத்தாக்குகளைப்போல் அவை நீண்டு விரிகின்றன—

    ஆற்றோரத் தோட்டங்களைப்போல்,

    யாவே நட்ட அகில் மரங்களைப்போல்[a],

    நீரோரக் கேதுரு மரங்களைப்போல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நறுமண அகில் மரங்கள்.’ இங்குள்ள எபிரெயச் சொல் கூடாரங்களைக் குறிக்காமல், நறுமணமுள்ள மரங்களையோ மரப்பொருளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: பள்ளத்தாக்குகள்
  rationale: இந்தச் சொல் நீரோட்டத்துடன் தொடர்புடைய பள்ளத்தாக்குகளையோ வறண்ட கால ஓடைப் படுகைகளையோ குறிக்கலாம். கவிதை உருவகத்தில் இயல்பாகவும் பரந்த நிலப்பரப்பின் காட்சியைத் தரவும் ‘பள்ளத்தாக்குகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נִטָּיוּ
  choice: நீண்டு விரிகின்றன
  rationale: נטה என்பதன் ‘நீட்டப்படுதல், விரிதல்’ என்ற பொருளை, இங்கு பாளயத்தின் பரந்த அமைப்பைக் காட்டும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גַנֹּת
  choice: தோட்டங்கள்
  rationale: செழிப்பாகப் பயிரிடப்பட்ட இடங்களைக் குறிக்கும் பன்மை வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֲלֵי נָהָר
  choice: ஆற்றோர
  rationale: ஆற்றுக்கு அருகில் அல்லது அதன் நெடுகிலும் அமைந்திருப்பதைக் குறிக்கும் எபிரெயச் சொற்றொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: אֲהָלִים
  choice: அகில் மரங்கள்
  rationale: இங்கு கூடாரங்கள் அல்ல, நறுமணம் தரும் மரங்கள் அல்லது அவற்றின் மரப்பொருள் குறிக்கப்படுகிறது. ‘அகில் மரங்கள்’ என்பது தாவர உருவகத்தையும் அடுத்துள்ள நடுதல் வினையையும் தெளிவாகப் பொருத்துகிறது.
- source_word: נָטַע
  choice: நட்ட
  rationale: யாவே செய்த நடுதல் செயலும் அதன் நிலையான விளைவும் சுருக்கமான தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: வலிமை, உயரம், நிலைத்தன்மை ஆகியவற்றை நினைவூட்டும் மரத்தைக் குறிக்கும் மரபான தமிழ் வேதாகமச் சொல்லைத் தக்கவைக்கிறது.
- source_word: עֲלֵי מָיִם
  choice: நீரோர
  rationale: நீருக்கு அருகில் இருப்பதை இயல்பான தமிழில் காட்டுகிறது; எபிரெயத்தின் கூட்டுப் பன்மையான ‘நீர்கள்’ என்பதை செயற்கையாக மொழிபெயர்க்காமல் அதன் நீர்வள உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ஆகவே ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் அந்தப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் இணையான நான்கு உருவகங்களும் தெளிவாகத் தெரியுமாறு வரிகள் அமைக்கப்பட்டுள்ளன. ‘நீண்டு விரிகின்றன’ என்பது மூல வினையின் காட்சித் தன்மையைப் பாதுகாக்கிறது; ‘ஆற்றோர’ மற்றும் ‘நீரோர’ என்பவை சுருக்கமான, பொதுவாகப் புரியும் இலக்கியச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
