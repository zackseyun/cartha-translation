  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: ta
  text: பின்பு அவன் தன் உரையை[a] எடுத்துரைத்து, “ஐயோ! கடவுள் இதை நிகழ்த்தும்போது யார் உயிர்வாழ முடியும்?[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உரை” என்பதற்கு “இறைவாக்கு” அல்லது “உவமைக்கூற்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதியாக வரும் எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. இதை, “கடவுள் இதை நிலைநிறுத்தும்போது யார் உயிர்வாழ முடியும்?” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: தன் உரையை எடுத்துரைத்தான்
  rationale: נשׂא உடன் מָשָׁל வருவது ஒரு கூற்றை அல்லது கவிதைமிகு இறைவாக்கை எடுத்துரைப்பதைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீனத் தமிழில் இதன் செயற்பொருளையும் சொல்லாட்சியின் உயர்நிலையையும் இவ்வாறு காக்கலாம்.
- source_word: מְשָׁלוֹ
  choice: தன் உரை
  rationale: מָשָׁל என்பது பழமொழி, உவமை, கேலிப்பாட்டு அல்லது கவிதைமிகு இறைவாக்கு எனப் பலவாறு பொருள்படலாம். பிலேயாமின் தொடர் அறிவிப்புகளில் பொதுவாகப் பொருந்தும் ‘உரை’ என்பதைத் தேர்ந்தெடுத்து, மாற்றுப் பொருள்களை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אוֹי
  choice: ஐயோ!
  rationale: அச்சத்தையும் புலம்பலையும் வெளிப்படுத்தும் இடைச்சொல். இச்சூழலில் இயல்பான தமிழ் உணர்ச்சிவெளிப்பாடு ‘ஐயோ!’ ஆகும்.
- source_word: מִי יִחְיֶה
  choice: யார் உயிர்வாழ முடியும்?
  rationale: சொல்லுக்குச் சொல் ‘யார் வாழ்வார்?’ என்றாலும், வரவிருக்கும் பேரிடரிலிருந்து தப்பிப் பிழைப்பதே சூழல்சார் கருத்து. ‘முடியும்’ என்பது கேள்வியின் சாத்தியநிலை உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשֻּׂמוֹ אֵל
  choice: கடவுள் இதை நிகழ்த்தும்போது
  rationale: இறுதித் தொடர் மிகவும் சுருக்கமானதும் பொருளில் கடினமானதும் ஆகும். אֵל என்பதை எழுவாயான ‘கடவுள்’ என்றும், שׂום சார்ந்த வடிவத்தை அவர் இதை ஏற்படுத்தும் அல்லது நிகழ்த்தும் காலத்தைக் குறிப்பதாகவும் எடுத்துக்கொள்ளப்படுகிறது; நிச்சயமற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: מִשֻּׂמוֹ אֵל என்ற கடினமான இறுதித் தொடரின் விளக்கம்
  choice: கடவுள் இதை நிகழ்த்தும்போது
  alternative: கடவுள் இதை நிலைநிறுத்தும்போது; அல்லது எபிரெயச் சொற்றொடரின் வேறு தொடரியல் பிரிப்புகள்
  rationale: אֵל என்பதை எழுவாயாகக் கொள்வது சூழலில் ஒத்திசைவானது. ஆனால் எபிரெயச் சொற்றொடர் தெளிவற்றிருப்பதால், மொழிபெயர்ப்பு தேவையற்ற விவரத்தைச் சேர்க்காமல் தெய்வீகச் செயற்பாட்டை மட்டும் தெரிவிக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எடுத்துரைத்தான்’ என்பது எபிரெய மரபுத்தொடரைத் தமிழில் இயல்பாக்குகிறது; ‘ஐயோ!’ மூலத்தின் அச்சம் கலந்த புலம்பலைப் பாதுகாக்கிறது. கடினமான இறுதித் தொடரின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
