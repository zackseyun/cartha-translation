id: NUM.24.1
reference: Numbers 24:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: ta
  text: இஸ்ரவேலை ஆசீர்வதிப்பது யாவேவின் பார்வையில் நல்லது என்று பிலேயாம் கண்டபோது, முந்தைய சந்தர்ப்பங்களைப்போல் சகுனங்களை நாடிச் செல்லாமல், வனாந்தரத்தை நோக்கித் தன் முகத்தைத் திருப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்துக்கொண்டு, இங்கு பிலேயாம் நிலைமையை உணர்ந்ததையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில் நல்லது என்று
  rationale: ‘ஒருவரின் கண்களில் நல்லது’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை, தமிழில் புரியத்தக்க ‘பார்வையில் நல்லது’ என்ற வடிவில் காக்கிறது; வெறுமனே ‘யாவேவுக்குப் பிடித்தது’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְבָרֵךְ
  choice: ஆசீர்வதிப்பது
  rationale: ברך வினையின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כְּפַעַם בְּפַעַם
  choice: முன்பு ஒவ்வொரு முறையும் செய்ததுபோல்
  rationale: காலந்தோறும் மீண்டும் செய்யப்பட்ட முந்தைய வழக்கத்தைச் சுட்டும் எபிரெயத் தொடரின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִקְרַאת נְחָשִׁים
  choice: சகுனங்களை நாடிச் செல்ல
  rationale: נְחָשִׁים இங்கு பாம்புகளைக் குறிக்காமல் குறிகூறும் சகுனங்கள் அல்லது நிமித்தங்களைக் குறிக்கிறது. לִקְרַאת என்பதன் எதிர்கொள்ளச் செல்லும் இயக்கத்தை ‘நாடிச் செல்ல’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: தன் முகத்தைத் திருப்பினான்
  rationale: திட்டமிட்டு ஒரு திசையை நோக்கித் தன்னை அமைத்துக்கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל הַמִּדְבָּר
  choice: வனாந்தரத்தை நோக்கி
  rationale: מִדְבָּר குறிக்கும் குடியிருப்பற்ற வறண்ட நிலப்பரப்பை வேதாகமச் சூழலுக்கேற்ற, புரியத்தக்க தமிழில் தருகிறது; אֶל என்பதன் திசைநோக்குப் பொருளும் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: பிலேயாமின் முந்தைய செயலை விவரிக்கும் נְחָשִׁים என்பதன் பொருள்
  choice: சகுனங்கள்
  alternative: குறிகூறல்கள்; நிமித்தங்கள்
  rationale: இந்தச் சொல் இங்கு பிலேயாம் நாடிய குறிசொல்லும் அல்லது சகுனம் பார்க்கும் நடைமுறையைக் குறிக்கிறது. வசனம் அந்த நடைமுறையைப் பதிவு செய்கிறது; அதை ஏற்றுக்கொள்வதாகவோ அதன் இயல்பைச் சீராக்குவதாகவோ மொழிபெயர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘யாவேவின் பார்வையில் நல்லது’ மற்றும் ‘தன் முகத்தைத் திருப்பினான்’ ஆகிய சொற்றொடர்கள் மூலத்தின் உருவகங்களை அளவான முறையில் தக்கவைக்கின்றன; ‘சகுனங்களை நாடிச் செல்ல’ என்பது சாதாரண வாசகருக்குத் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டது.
