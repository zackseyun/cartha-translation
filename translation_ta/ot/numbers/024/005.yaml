id: NUM.24.5
reference: Numbers 24:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: ta
  text: யாக்கோபே, உன் கூடாரங்கள் எவ்வளவு அருமையாக உள்ளன! இஸ்ரவேலே, உன் உறைவிடங்கள் எவ்வளவு அருமையாக உள்ளன!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: எவ்வளவு
  rationale: இங்கு கேள்வியைக் குறிக்காமல் வியப்பையும் பாராட்டையும் வெளிப்படுத்தும் எபிரெய வியப்பிடை அமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: טֹּבוּ
  choice: நன்றாயிருக்கின்றன
  rationale: ‘நல்ல, இனிய, அழகிய’ எனப் பரந்த பொருளுடைய எபிரெயச் சொல்லின் பொதுவான மதிப்பீட்டையும் வியப்பின் தொனியையும் காக்கிறது; தோற்ற அழகை மட்டும் வலியுறுத்தவில்லை.
- source_word: אֹהָלֶיךָ
  choice: உன் கூடாரங்கள்
  rationale: இஸ்ரவேலரின் முகாமைக் குறிக்கும் சொல்லின் நேரடியான பொருள் ‘கூடாரங்கள்’; வழிபாட்டிடம் என்ற தேவையற்ற சிறப்புப் பொருளைத் தவிர்க்கிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபே
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு, நேரடி அழைப்பைக் காட்ட ‘ஏ’ வேற்றுமை வடிவில் தரப்படுகிறது; இங்கு அது இஸ்ரவேல் மக்களைக் கவிதைநயமாகக் குறிக்கிறது.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: உன் உறைவிடங்கள்
  rationale: ‘கூடாரங்கள்’ என்பதோடு இணையானதாயினும் வேறுபட்ட சொல்லாக இருந்து, வாழும் இடங்கள் என்ற பொதுப்பொருளைக் காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலே
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு நேரடி அழைப்பு வடிவில் தரப்படுகிறது; ‘யாக்கோபு’ என்பதற்கு இணையாக மக்களைச் சுட்டுகிறது.
theological_decisions:
- issue: பாரம்பரியமாக வழிபாட்டுக் கூடாரத்தைக் குறிக்கும் சொல்லைப் பயன்படுத்த வேண்டுமா
  choice: ‘கூடாரங்கள்’, ‘உறைவிடங்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘திருக்கூடாரங்கள்’ அல்லது வழிபாட்டிடம் சார்ந்த சொற்களைப் பயன்படுத்துதல்
  rationale: சூழலில் பிலேயாம் இஸ்ரவேலரின் முகாமையும் அவர்கள் வசிக்கும் இடங்களையும் காண்கிறான்; குறிப்பாக பரிசுத்த ஸ்தலத்தை உரை சுட்டவில்லை. ஆகவே வழிபாட்டுச் சார்ந்த பொருளைச் சேர்க்காமல் மூலமொழியின் பொதுப் பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் கவிதைநயமும் கண்ணியமும் கொண்ட நடை. ‘யாக்கோபே … இஸ்ரவேலே’ என்ற இணையான நேரடி அழைப்புகளும், இரு பெயர்ச்சொற்களையும் இணைக்கும் ‘உம்’ அமைப்பும் எபிரெயக் கவிதையின் இணைநிலையை இயல்பான தமிழில் காக்கின்றன.
