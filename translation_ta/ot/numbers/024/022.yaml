translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க இறைவாக்கு நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எரித்தல் என்ற மூல உருவகமும், காயின் மற்றும் அசூர் என்ற பெயர்களின் குறிப்புப் பொருளிலுள்ள தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
