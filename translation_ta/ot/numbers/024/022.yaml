  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: ta
  text: ஏனெனில், காயின்[a] எரிக்கப்பட வேண்டியவனாக இருப்பான் என்றால், அசூர்[b] உன்னைச் சிறைபிடித்துக் கொண்டுபோக இன்னும் எவ்வளவு காலம் ஆகும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “காயின்” என்பது தனிநபரான காயினைவிட கேனிய இனத்தாரைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சூழலின்படி “அசூர்” என்பது “அசீரியா” அல்லது “அசீரியன்” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில் ... என்றால்
  rationale: முந்தைய இறைவாக்குடன் உள்ள விளக்கத் தொடர்பையும் நிபந்தனைத் தன்மையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. இச்சொற்றொடருக்கு ‘ஆயினும்’ என்ற சலுகைப் பொருளும் இருக்கக்கூடும்; இங்கு வாக்கிய அமைப்புடன் பொருந்தும் நிபந்தனைப் பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது.
- source_word: יִהְיֶה לְבָעֵר
  choice: எரிக்கப்படுவதற்கு நியமிக்கப்பட்டிருந்தால்
  rationale: ‘இருத்தல்’ என்ற வினையுடன் வரும் לְבָעֵר கட்டமைப்பு வரவிருக்கும் முடிவைச் சுட்டுகிறது. ‘எரிக்கப்படுதல்’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, அது நேரடி நெருப்பா அல்லது உருவகமான அழிவா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: קָיִן
  choice: காயின்
  rationale: எபிரேயப் பெயரின் ஒலிவடிவம் தக்கவைக்கப்பட்டுள்ளது. சூழலில் இது தனிநபரான காயீனைவிட கேனிய இனத்தாரைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: עַד מָה
  choice: இன்னும் எவ்வளவு காலம் ஆகும்
  rationale: அடுத்த நிகழ்வு நடைபெறுவதற்கு முன் எவ்வளவு காலம் உள்ளது என்று கேட்கும் காலப் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַשּׁוּר
  choice: அசூர்
  rationale: எபிரேயப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. சூழலில் அது அசீரிய நாட்டையோ அசீரிய வல்லரசையோ குறிக்கலாம் என்பதால் அந்த விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִּשְׁבֶּךָּ
  choice: உன்னைச் சிறைபிடித்துக் கொண்டுபோக
  rationale: שבה என்ற வேர்ச்சொல்லின் சிறைப்பிடித்தல் மற்றும் பிடித்துச் செல்லுதல் ஆகிய இரு கூறுகளையும் வெளிப்படுத்துகிறது.
