  source_fidelity: 'முக்கியமாக மூலத்துக்கு உண்மையுள்ளது: ஆண்பால் ஒருமைச் சுட்டுதல், யாக்கோபு/இஸ்ரவேல் இணைநிலை, அரச உருவகங்களான ‘நட்சத்திரம்’, ‘செங்கோல்’, மோவாபின் ஓரங்கள், மற்றும் சேத் பற்றிய உரைத் தெளிவின்மை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘புறப்பட்டிருக்கிறது’ தமிழில் பொதுவாக ஒரு இடத்திலிருந்து கிளம்பிச் செல்லுதலைக் குறிக்கும்; דָּרַךְ כּוֹכָב இங்குக் குறிக்கும் தோன்றுதல்/முன்னேறி வருதல் என்ற படிமத்துக்கு அது தகுந்ததல்ல.'
