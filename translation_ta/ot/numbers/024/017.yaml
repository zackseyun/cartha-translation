  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: ta
  text: அவரை நான் காண்கிறேன்[a]; ஆனால் இப்போது அல்ல. அவரை நான் உற்றுநோக்குகிறேன்; ஆனால் அவர் அருகில் இல்லை. யாக்கோபிலிருந்து ஒரு நட்சத்திரம் தோன்றியிருக்கிறது; இஸ்ரவேலிலிருந்து ஒரு செங்கோல் எழுந்திருக்கிறது. அது மோவாபின் இரு ஓரங்களையும்[b] நொறுக்கி, சேத்தின் மகன்கள் அனைவரையும்[c] இடித்துத் தள்ளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரை நான் காண்பேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை தீர்க்கதரிசனக் காட்சியில் நிகழ்கால அல்லது எதிர்கால நுணுக்கம் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘மோவாபின் இரு ஓரங்கள்.’ இது மோவாபின் எல்லைப் பகுதிகளையோ அதன் வலிமையையோ உருவகமாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘சேத்’ என்பது ஆதியாகமத்தில் வரும் இயற்பெயராக வாசிக்கப்படலாம். சிலர் இத்தொடரை மனிதகுலம் முழுவதற்கோ ஒரு பகை மக்களுக்கோ உரிய கவிதைக் குறிப்பாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: அவரை நான் காண்கிறேன்
  rationale: முதலாம் நபர் ஒருமை வினையுடன் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது. தீர்க்கதரிசனக் காட்சியின் உயிரோட்டத்தை நிகழ்காலம் காக்கிறது; எதிர்காலப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשׁוּרֶנּוּ
  choice: அவரை நான் உற்றுநோக்குகிறேன்
  rationale: שׁור என்பதன் ‘நோக்குதல்/கண்ணுறுதல்’ என்ற உயர்ந்த பொருளையும், முந்தைய ‘காண்கிறேன்’ என்பதுடனான கவிதை இணைநிலையையும் வேறுபாட்டுடன் காக்கிறது.
- source_word: וְלֹא קָרוֹב
  choice: ஆனால் அவர் அருகில் இல்லை
  rationale: கால அல்லது இட அண்மை ஆகிய இரு நுணுக்கங்களையும் ‘அருகில்’ காக்கிறது; ‘விரைவில் அல்ல’ என்று காலப் பொருளை மட்டும் தீர்மானிக்கவில்லை.
- source_word: דָּרַךְ כּוֹכָב
  choice: ஒரு நட்சத்திரம் புறப்பட்டிருக்கிறது
  rationale: דָּרַךְ என்பதன் அடிப்படை ‘அடியெடுத்து வைத்தல்/முன்னேறுதல்’; நட்சத்திரத்துடன் அது தோன்றி வருதல் அல்லது புறப்படுதலைக் குறிக்கிறது. எபிரெய தீர்க்கதரிசன நிறைவேற்ற வடிவின் உறுதியை நிறைநிகழ்காலத்தில் வெளிப்படுத்துகிறது.
- source_word: וְקָם שֵׁבֶט
  choice: ஒரு செங்கோல் எழுந்திருக்கிறது
  rationale: שֵׁבֶט கோல், தண்டு, செங்கோல், குலம் எனப் பொருள்படலாம். நட்சத்திர உருவகத்திற்கும் வெற்றிகொள்ளும் சூழலுக்கும் இணையாக அரசாட்சியைக் குறிக்கும் ‘செங்கோல்’ இயல்பானது.
- source_word: פַּאֲתֵי מוֹאָב
  choice: மோவாபின் இரு ஓரங்கள்
  rationale: פֵּאָה என்பதன் ஓரம்/மூலை/பக்கம் என்ற படிமத்தைப் பாதுகாக்கிறது. இருமை வடிவை ‘இரு’ என வெளிப்படுத்துகிறது; அதன் உருவகப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּמָחַץ
  choice: நொறுக்கி
  rationale: מחץ என்பதன் பலமான ‘நசுக்குதல்/நொறுக்குதல்’ பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְקַרְקַר
  choice: இடித்துத் தள்ளும்
  rationale: அரிதான இவ்வினையின் சரியான பொருள் உறுதியற்றது; ‘இடித்தல், தகர்த்தல், பாழாக்குதல்’ என்ற பரிந்துரைகளில், வெற்றிகொள்ளும் சூழலுக்கு ஏற்றும் மிகைத் துல்லியம் கோராததுமான மொழிபெயர்ப்பு.
- source_word: כָּל בְּנֵי שֵׁת
  choice: சேத்தின் மகன்கள் அனைவரும்
  rationale: மெய்யெழுத்து வடிவை இயற்பெயரான சேத் என வாசிக்கலாம். மனிதகுலம் அல்லது பகைமக்களைக் குறிக்கும் கவிதைப் பெயராகவும் சிலர் புரிந்துகொள்வதால் அந்தத் திறப்பை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: பிலேயாமின் உரையில் மேசியாவைக் குறிக்கும் வலிமை
  choice: ‘நட்சத்திரம்’, ‘செங்கோல்’ என்ற அரச உருவகங்களை வைத்துக் கொண்டு, குறிக்கப்படுபவரை முதன்மை உரையில் மேசியா என்று நேரடியாக அடையாளப்படுத்தவில்லை.
  alternative: இதை மேசியாவைப் பற்றிய நேரடித் தீர்க்கதரிசனம் என மொழிபெயர்த்தல், அல்லது தாவீது போன்ற உடனடி வரலாற்று அரசருக்கு மட்டும் வரையறுத்தல்.
  rationale: எபிரெய உரை அரச உருவகங்களையும் வெற்றிமொழியையும் அளிக்கிறது; ஆனால் மேசியாவையோ வேறு குறிப்பிட்ட அரசரையோ பெயரிடவில்லை. இவ்வாறு மொழிபெயர்ப்பது வரலாற்று மற்றும் மேசியானிய வாசிப்புகளுக்கிடையிலான உண்மையான இறையியல் இறுக்கத்தைப் பாதுகாக்கிறது.
- issue: ஆண்பால் ஒருமை பின்னொட்டுகளுக்கும் பின்னருள்ள உருவகங்களுக்கும் உரிய குறிப்பு
  choice: தொடக்கத்தில் ‘அவரை’ என்ற தனிநபர் மொழியைப் பயன்படுத்தி, பின்னர் நட்சத்திரம் மற்றும் செங்கோல் என்ற உருவகப் பெயர்களைத் தனியே நிறுத்தியது.
  alternative: முழு வசனத்தையும் ‘அவர்’ எனத் தனிநபராக்குதல், அல்லது முழுவதையும் உயிரற்ற அரசியல்/வானியல் குறியீடாக மாற்றுதல்.
  rationale: தொடக்க வினைகளின் பொருட்பின்னொட்டு ஆண்பால் ஒருமை; பின்னர் உருவகப் பெயர்கள் இலக்கண எழுவாய்களாக வருகின்றன. இரு நிலைகளையும் ஒன்றாகச் சுருக்காமல் உரையின் இயக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘செங்கோல்’ போன்ற பரவலாக அறியப்படும் அரச உருவகம் காக்கப்பட்டது. கவிதை இணைநிலையும் தீர்க்கதரிசன உறுதியும் இயல்பான தமிழ் வாக்கிய ஓட்டத்துடன் தக்கவைக்கப்பட்டுள்ளன.
