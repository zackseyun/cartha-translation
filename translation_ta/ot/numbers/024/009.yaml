  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: ta
  text: அவன் சிங்கத்தைப் போலவும் பெண் சிங்கத்தைப் போலவும்[a] குனிந்து படுத்தான்—அவனை எழுப்புவான் யார்? உன்னை ஆசீர்வதிப்பவர்கள் ஆசீர்வதிக்கப்பட்டவர்கள்; உன்னைச் சபிப்பவர்கள் சபிக்கப்பட்டவர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமைமிக்க சிங்கத்தைப் போலவும்.” எபிரெயச் சொல் வலிமையான அல்லது முதிர்ந்த சிங்கத்தைக் குறிக்கக்கூடும்; “பெண் சிங்கம்” என்பது இதற்கு முந்தைய “சிங்கம்” என்ற சொல்லிலிருந்து உள்ள சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த ஆசீர்வாத–சாபச் சொற்றொடர் ஆதியாகமம் 12:3 மற்றும் 27:29 ஆகியவற்றை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: பதுங்கி
  rationale: இந்த வினை குனிவதையோ மடங்குவதையோ குறிக்கிறது. படுத்திருக்கும் சிங்கத்தின் உருவகத்தில், மனிதனின் வழிபாடு அல்லது பணிவைக் குறிப்பதற்குப் பதிலாக, தாக்கத் தயாராகவோ ஓய்வெடுக்கவோ தாழ்ந்து அமரும் விலங்கின் நிலையைக் ‘பதுங்கி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁכַב
  choice: படுத்துக்கொண்டான்
  rationale: படுத்தல் அல்லது படுத்திருத்தலைக் குறிக்கும் பொதுவான வினை. முந்தைய வினையைத் தொடர்ந்து சிங்கம் ஓய்வாகப் படுக்கும் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: כַּאֲרִי
  choice: சிங்கத்தைப் போலவும்
  rationale: אֲרִי என்பதற்கான நேரடியான பொருளான ‘சிங்கம்’ என்பதையும் כ என்ற வெளிப்படையான உவமை உருபையும் தக்கவைக்கிறது.
- source_word: וּכְלָבִיא
  choice: பெண் சிங்கத்தைப் போலவும்
  rationale: לָבִיא என்பது சிங்கத்தையோ பெண் சிங்கத்தையோ, சில இடங்களில் வலிமையான அல்லது முதிர்ந்த சிங்கத்தையோ குறிக்கலாம். ‘பெண் சிங்கம்’ என்பது முந்தைய אֲרִי என்பதிலிருந்து சொல் வேறுபாட்டைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִי יְקִימֶנּוּ
  choice: அவனை எழுப்புகிறவன் யார்?
  rationale: படுத்திருக்கும் சிங்கத்தை எழச் செய்வதை இச்சொற்றொடர் குறிக்கிறது. ‘எழுப்புகிறவன் யார்?’ என்பது எபிரெயக் கேள்வியின் சவாலான தொனியையும் சூழலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: உன்னை ஆசீர்வதிப்பவர்கள் ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டுடன் வரும் பெயரெச்ச வடிவை இயல்பான தமிழில் மனிதர்களைக் குறிக்கும் பன்மைத் தொடராகத் தருகிறது; ஆசீர்வாத அறிவிப்பின் நேரடியான வடிவத்தையும் காக்கிறது.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: உன்னைச் சபிப்பவர்கள் சபிக்கப்பட்டவர்கள்
  rationale: முந்தைய ஆசீர்வாதத் தொடருக்கு இணையான அமைப்பையும், ஆசீர்வாதம்–சாபம் என்ற நேரடியான எதிர்மறையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘உன்னை ஆசீர்வதிப்பவர்கள்… உன்னைச் சபிப்பவர்கள்’ என்பதில் இரண்டாம் நபரின் குறிப்பு
  choice: எபிரெயத்தில் உள்ள ஒருமை ‘உன்னை’ என்பதைக் காத்து, அது இஸ்ரவேல்/யாக்கோபை பிரதிநிதித்துவ ஒருமையில் குறிப்பதைத் திறந்தவாறே வைத்தல்
  alternative: அதை இஸ்ரவேலின் அரசனுக்கு மட்டும் உரியதாகவோ, ‘உங்களை’ என்று மக்களை வெளிப்படையாகப் பன்மையாக்கியோ மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் இஸ்ரவேல்/யாக்கோபை உயர்ந்த கவிதை நடையில் ஒருமையாகப் பேசுகிறது. மொழிபெயர்ப்பு அந்த வடிவத்தைக் காக்கிறது; குறிப்பு யாருக்கு என்பதைத் தேவையின்றி குறுக்கவோ விரிவாக்கவோ இல்லை.
- issue: முற்பிதாக்களின் ஆசீர்வாத–சாபச் சூத்திரத்தின் எதிரொலி
  choice: அந்த எதிரொலியை முதன்மை உரையில் விளக்கிச் சேர்க்காமல், நேரடியான அறிவிப்பாக மொழிபெயர்த்து அடிக்குறிப்பில் இணை வசனங்களைக் குறிப்பிடுதல்
  alternative: ஆபிரகாமிய உடன்படிக்கையை முதன்மை உரையிலேயே வெளிப்படையாகச் சேர்த்து விரிவாக்குதல்
  rationale: ஆதியாகமம் 12:3 மற்றும் 27:29 உடன் வலுவான சொற்றொடர் ஒற்றுமை உள்ளது; எனினும் மொழிபெயர்ப்பு மூல உரை கூறுவதை மட்டுமே முதன்மை உரையில் தர வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. சிங்கத்தின் உடல் நிலையை ‘பதுங்கி… படுத்துக்கொண்டான்’ என்று காட்சிப்படுத்தி, வசனத்தின் சவாலான கேள்வித் தொனியும் ஆசீர்வாத–சாப இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
