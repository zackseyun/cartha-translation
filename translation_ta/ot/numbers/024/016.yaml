source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: ta
  text: 'இறைவனின் வார்த்தைகளைக் கேட்கிறவனும்[a], உன்னதமானவரின் அறிவை அறிந்தவனும், எல்லாம் வல்லவரின் தரிசனத்தைக் காண்கிறவனும், விழுகிறவனும்[b], கண்கள் திறந்தவனுமான ஒருவனின் அறிவிப்பு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனின் உரைகளைக் கேட்கிறவனின் திருவாக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விழுந்து, கண்கள் திறந்தவனின்”; சிலர் இதைத் தரிசன மயக்கநிலையாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: ஒருவனின் அறிவிப்பு
  rationale: முறையான தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் சொல்லின் கனத்த தன்மையைத் தக்கவைத்து, இன்றைய தமிழில் இயல்பாகப் புரியும் வடிவம்.
- source_word: שֹׁמֵעַ
  choice: கேட்கிறவன்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான பண்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אִמְרֵי אֵל
  choice: இறைவனின் வார்த்தைகள்
  rationale: இறைவனிடமிருந்து வரும் பேச்சுகள் அல்லது உரைகளைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு தனிப்பெயராக அல்லாமல் தெய்வீகப் பட்டமாகப் பயன்படுவதால் பொருளை மொழிபெயர்க்கிறது.
- source_word: וְיֹדֵעַ
  choice: அறிந்தவன்
  rationale: முந்தைய பங்கேற்புவினையுடன் இணையான சுயவிவர அமைப்பைத் தமிழில் தொடர்கிறது.
- source_word: דַּעַת עֶלְיוֹן
  choice: உன்னதமானவரின் அறிவு
  rationale: அவர் உடைய அறிவா அல்லது அவரிடமிருந்து வரும் அறிவா என்ற மூலமொழியின் சுருக்கமான உறவுத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: தெய்வீகப் பட்டத்தின் உயர்நிலைப் பொருளை இயல்பான தமிழ் மரியாதை வடிவில் தருகிறது.
- source_word: מַחֲזֵה
  choice: தரிசனம்
  rationale: வெளிப்படுத்தப்பட்ட தீர்க்கதரிசனக் காட்சியைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் குறிக்கிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் அதன் பொருளோடு மொழிபெயர்க்கிறது.
- source_word: יֶחֱזֶה
  choice: காண்கிறவன்
  rationale: கவிதைநடை சுயவிவரத்தில் மற்ற பங்கேற்புவினைகளுடன் இணையாக உள்ள செயலை இயல்பாக வழங்குகிறது.
- source_word: נֹפֵל
  choice: விழுந்த நிலையில் இருந்தும்
  rationale: மூலத்தின் ‘விழுதல்’ என்ற நேரடிப் படிமத்தைத் தக்கவைக்கிறது; ‘மயக்கநிலை’ போன்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וּגְלוּי עֵינָיִם
  choice: கண்கள் திறக்கப்பட்டவன்
  rationale: சொல்லுக்கு சொல் ‘கண்கள் வெளிப்படுத்தப்பட்டவை/மூடப்படாதவை’ என்ற படிமத்தை வாசிக்க இயல்பான தமிழில் தருகிறது; ‘இருந்தும்’ என்பது விழுந்த நிலையுடனான முரண்பாட்டை வெளிக்கொணர்கிறது.
theological_decisions:
- issue: אֵל, עֶלְיוֹן, שַׁדַּי ஆகிய தெய்வீகப் பட்டங்களின் மொழிபெயர்ப்பு
  choice: இறைவன் / உன்னதமானவர் / எல்லாம் வல்லவர்
  alternative: ஏல் / எலியோன் / ஷத்தாய்
  rationale: இவை இங்கு ஒலிபெயர்க்க வேண்டிய தனிப்பெயர்களைவிட, பொருளோடு மொழிபெயர்க்கத்தக்க தெய்வீகப் பட்டங்களாகச் செயல்படுகின்றன.
- issue: נֹפֵל என்பதன் தரிசன அனுபவப் பொருள்
  choice: விழுந்த நிலையில்
  alternative: மயக்கநிலையில் / பரவசநிலையில்
  rationale: எபிரெய உரை நேரடியாக ‘விழுகிறவன்/விழுந்தவன்’ எனக் கூறுகிறது. குறிப்பிட்ட தரிசன மயக்கநிலை என்ற விளக்கத்தை முதன்மை உரையில் உறுதிப்படுத்தாமல் அடிக்குறிப்பில் மட்டும் குறிப்பிடுவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். எபிரெயக் கவிதையின் இணை அமைப்பையும் தெய்வீகப் பட்டங்களின் வேறுபாட்டையும் பாதுகாக்கிறது. ‘உன்னதமானவரின் அறிவு’ என்ற சொற்றொடரில் உள்ள உறவுத் தெளிவின்மையும், ‘விழுந்த’ என்பதன் தரிசனச் சூழல் தெளிவின்மையும் திட்டமிட்டு தீர்க்கப்படவில்லை.
