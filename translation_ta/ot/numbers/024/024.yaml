source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: ta
  text: ஆனால் கித்தீமின் கரையிலிருந்து கப்பல்கள் வரும்[a]; அவை அசூரைத் துன்புறுத்தும்[b], ஏபேரையும் துன்புறுத்தும்[c]; அவனும்கூட அழிவை அடைவான்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கித்தீம் என்பது குறிப்பாக சைப்பிரஸையோ, விரிவாக மேற்கத்திய கடல்சார் மக்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அசூர் என்பதை ‘அசீரியா’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ஏபேர் என்பது ஒரு மக்களினப் பெயராகிய ஏபேரையோ, எபிரெயரையோ, அல்லது யூபிராத்து போன்ற ஓர் எல்லைக்கு ‘அப்பால்’ வாழும் மக்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: d
    text: எபிரெயத்தில் ‘அவனும்கூட’ என்று உள்ளது. ‘அவன்’ யாரைக் குறிக்கிறது என்பது உறுதியில்லை; சிலர் இதைக் கூட்டுப்பொருளில் ‘அதுவும்கூட’ என்றோ, கித்தீமிலிருந்து வரும் வல்லரசைப் பிரதிநிதித்துவப்படுத்தும் ஓர் ஆட்சியாளனைக் குறிக்கும் என்றோ புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: கப்பல்கள்
  rationale: கடலில் செல்லும் கலங்களைக் குறிக்கும் பொதுவான சொல்; போர்க்கப்பல்கள் அல்லது கப்பற்படை என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: מִיַּד
  choice: கரையிலிருந்து
  rationale: சொல்லாட்சிப்படி ‘கையிலிருந்து’ என்றாலும், இங்கு இடத்தைக் குறிக்கும் மரபுத்தொடராக ‘பக்கம்/கரை/பகுதியிலிருந்து’ என்று பொருள்படும். கப்பல்கள் பற்றிய சூழலில் ‘கரையிலிருந்து’ இயல்பானது.
- source_word: כִּתִּים
  choice: கித்தீம்
  rationale: இது பெயர் அல்லது மக்களினப் பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது; சைப்பிரஸ் அல்லது மேற்கத்திய கடல்சார் மக்கள் என்று தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְעִנּוּ
  choice: துன்புறுத்தும்
  rationale: பியேல் வடிவிலுள்ள ענה துன்புறுத்துதல், சிறுமைப்படுத்துதல், ஒடுக்குதல் ஆகிய பொருள்களை ஏற்கலாம். ‘துன்புறுத்தும்’ என்பது முறையை மிகையாகக் குறிப்பாக்காமல் அதன் பரந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: אַשּׁוּר
  choice: அசூர்
  rationale: எபிரெயப் பெயரைப் பாதுகாக்கிறது; ‘அசீரியா’ என்று அரசியல் நிலப்பரப்பாக மட்டும் தீர்மானிக்கவில்லை.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: சொல் பெயர்வடிவில் உள்ளது. ஏபேர் மக்கள், எபிரெயர், அல்லது ஓர் எல்லைக்கு அப்பாலுள்ள மக்கள் என்ற விவாதத்துக்குரிய அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல் வைக்கிறது.
- source_word: וְגַם הוּא
  choice: அவனும்கூட
  rationale: மூலத்தின் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை நேரடியாகப் பிரதிபலிக்கிறது; அது யாரைக் குறிக்கிறது என்பதைத் தீர்மானிக்கவில்லை.
- source_word: עֲדֵי אֹבֵד
  choice: அழிவை அடைவான்
  rationale: ‘அழிவுவரை/அழிவுக்குச் செல்லுதல்’ என்ற முடிவுநோக்கிய கருத்தை இயல்பான தமிழில் தருகிறது; ‘நித்திய அழிவு’ அல்லது ‘முற்றிலும் அழிக்கப்படுதல்’ என்ற கூடுதல் வலிமையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கித்தீம், அசூர், ஏபேர் மற்றும் இறுதி ஒருமைச் சுட்டுப்பெயரின் அடையாளம்
  choice: மூலப் பெயர்களை ஒலிபெயர்த்து, இறுதிச் சுட்டுப்பெயரை ‘அவன்’ என்ற ஆண்பால் ஒருமையாக வைத்திருக்கிறது.
  alternative: கித்தீமை சைப்பிரஸ் அல்லது மேற்கத்திய கடல்சார் வல்லரசுகள் என்றும், அசூரை அசீரியா என்றும், ஏபேரை எபிரெயர் அல்லது யூபிராத்துக்கு அப்பாலுள்ள மக்கள் என்றும், ‘அவன்’ என்பதை கித்தீம்/அதன் ஆட்சியாளர் அல்லது வேறொரு பேரரசு என்றும் விளக்கலாம்.
  rationale: தீர்க்கதரிசனத்தின் வரலாற்றுச் சுட்டுகள் விவாதத்திற்குரியவை. எபிரெய உரை வெளிப்படையாகத் தீர்மானிக்காத அடையாளங்களை மொழிபெயர்ப்பு தீர்க்காமல், அதன் உண்மையான பொருள் மயக்கத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடையில் அமைக்கப்பட்டது. பெயர்கள் விளக்கமாக மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் இணை அமைப்பும் இறுதி ஒருமைச் சுட்டுப்பெயரின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
