source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: ta
  text: 'கடவுள் அவனை எகிப்திலிருந்து வெளியே கொண்டுவருகிறார்;


    காட்டெருதின் கொம்புகளைப் போல் வலிமை அவனுக்கு உண்டு[a].


    தனக்கு எதிரிகளான நாடுகளை அவன் விழுங்குவான்;


    அவர்களுடைய எலும்புகளைக் கடிப்பான்[b],


    தன் அம்புகளால் அவர்களை நொறுக்குவான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காட்டெருதின் வலிமை அவனுக்கு உண்டு.” כְּתוֹעֲפֹת רְאֵם என்ற எபிரெயச் சொற்றொடர் கடினமானது; அது காட்டெருதின் உயர்ந்த கொம்புகளையோ, இன்னும் பொதுவாக அதன் வலிமையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய எலும்புகளை முறிப்பான்” அல்லது “அவர்களுடைய எலும்புகள் வெளிப்படுமாறு செய்வான்.” יְגָרֵם என்ற எபிரெய வினைச்சொல் அரிதானது; அதன் துல்லியமான நுணுக்கம் உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலை எகிப்திலிருந்து விடுவிக்கும் செயலின் எழுவாயாக இருப்பவர் கடவுள். நவீன பொதுத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள சொல்.
- source_word: מוֹצִיאוֹ
  choice: அவனை வெளியே கொண்டுவருகிறார்
  rationale: வினையெச்ச வடிவத்தின் கவிதைநடைக்குரிய நிகழ்கால உயிரோட்டத்தைப் பாதுகாக்கிறது; ஆண்பால் ஒருமைச் சுட்டுப்பெயரையும் தீர்மானிக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: புறப்பாட்டைக் குறிக்கும் இயல்பான இடவியல் மொழிபெயர்ப்பு.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: காட்டெருதின் கொம்புகளைப் போன்ற ஆற்றல்
  rationale: கடினமான எபிரெயச் சொற்றொடரில் விலங்கின் உயர்ந்த கொம்புகள் அல்லது அதன் வலிமை என்ற இரு நுணுக்கங்களும் இருக்கலாம். தமிழில் உருவகத்தைப் புரிந்துகொள்ளும்படி ‘கொம்புகள்’ என்பதையும் அதன் பொருளான ‘ஆற்றல்’ என்பதையும் இணைக்கிறது.
- source_word: לוֹ
  choice: அவனுக்கு உண்டு
  rationale: உடைமை அல்லது அவனுக்குச் சாதகமாக இருப்பதைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: יֹאכַל
  choice: விழுங்குவான்
  rationale: சொல்லின் அடிப்படை ‘உண்ணுதல்’ உருவகத்தையும் போரில் எதிரிகளை அழித்தல் என்ற பொருளையும் உயிரோட்டத்துடன் பாதுகாக்கிறது.
- source_word: גּוֹיִם צָרָיו
  choice: தனக்கு எதிரிகளான நாடுகள்
  rationale: ‘நாடுகள், அவனுடைய எதிரிகள்’ என்ற தொடர்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְעַצְמֹתֵיהֶם
  choice: அவர்களுடைய எலும்புகள்
  rationale: பெயர்ச்சொல்லையும் அதன் பன்மைச் சுட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְגָרֵם
  choice: கடித்துத் தகர்ப்பான்
  rationale: அரிதான இவ்வினைச்சொல்லின் துல்லிய நுணுக்கம் உறுதியல்ல. ‘கடித்தல்’ விழுங்கும் உருவகத்தைத் தொடர்கிறது; ‘தகர்த்தல்’ எலும்புகள்மீது நிகழும் அழிவைத் தெளிவாக்குகிறது.
- source_word: וְחִצָּיו
  choice: தன் அம்புகளால்
  rationale: அடுத்து வரும் வினைக்கான கருவிப் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִמְחָץ
  choice: நொறுக்குவான்
  rationale: நசுக்குதல் அல்லது சிதைத்தல் என்ற வன்மையான கவிதைப் படிமத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பிலேயாமின் அருள்வாக்கில் வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: ‘அவன்/அவனை/தன்’ என்ற ஒருமை வடிவங்கள் உரையில் அப்படியே பாதுகாக்கப்பட்டுள்ளன; அவை யாரைக் குறிக்கின்றன என்பது மொழிபெயர்ப்பில் மேலும் குறுக்கப்படவில்லை.
  alternative: இஸ்ரவேல் மக்களை மொத்தமாகக் குறிப்பது; இஸ்ரவேலின் அரசன் அல்லது வருங்கால ஆட்சியாளரைக் குறிப்பது; பிற்கால விளக்கத்தில் மேசியாவாகிய தனிநபரைக் குறிப்பது.
  rationale: எபிரெய உரை ஒருமை வடிவங்களைப் பயன்படுத்தினாலும், உடனடிச் சூழல் ஒரு மக்களை ஒருமையாகவோ அவர்களுடைய பிரதிநிதியையோ குறிக்க இடமளிக்கிறது. ஆகவே இறையியல் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் தீர்த்துவிடாமல் ஒருமைச் சுட்டுகள் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் இணைவரிகளையும் போர்ச் சித்திரத்தின் வலிமையையும் காக்கும் கண்ணியமான பொதுநடை. பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன; ஒருமைச் சுட்டுப்பெயர்கள் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கின்றன.
