  text: וַ/יַּרְא֙ אֶת הַ/קֵּינִ֔י וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר אֵיתָן֙ מֽוֹשָׁבֶ֔/ךָ וְ/שִׂ֥ים בַּ/סֶּ֖לַע קִנֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: ta
  text: 'பின்பு அவன் கேனியனைக் கண்டு, தன் தீர்க்கவாக்கை[a] உரைத்து, சொன்னான்:

    “உன் குடியிருப்பு உறுதியானது;

    உன் கூடு பாறையில் அமைந்துள்ளது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கவிதை உரையை.” எபிரெயச் சொல் மָשָׁל பழமொழி, ஏளனப்பாட்டு அல்லது தீர்க்க உரை ஆகியவற்றைக் குறிக்கலாம்; இங்கே அது பிலேயாமின் கவிதை வடிவத் தீர்க்கவாக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: கேனியன்
  rationale: எபிரெய வடிவம் குறிப்புச் சுட்டியுடன் ஒருமையில் இருந்து, கேனிய மக்களைப் பிரதிநிதித்துவப்படுத்தும் கூட்டு ஒருமையாக அமைகிறது; தமிழிலும் ‘கேனியன்’ என்று ஒருமையைப் பாதுகாக்கிறது.
- source_word: מְשָׁלוֹ
  choice: தன் தீர்க்கவாக்கை
  rationale: பிலேயாமின் சூழலில் மָשָׁל என்பது பழமொழியை மட்டும் அல்லாமல், கவிதை வடிவிலான கனமான தீர்க்க உரையைக் குறிக்கிறது. ‘தீர்க்கவாக்கு’ இச்சூழலை இயல்பாகத் தெரிவிக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: אֵיתָן
  choice: உறுதியானது
  rationale: இந்தச் சொல் வலிமை, நிலைத்தன்மை, பாதுகாப்பு ஆகிய நுணுக்கங்களைத் தருகிறது. குடியிருப்பைப் பற்றிய இவ்வரியில் ‘உறுதியானது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מוֹשָׁבֶךָ
  choice: உன் குடியிருப்பு
  rationale: வசிக்கும் இடம் அல்லது குடியேற்றத்தைக் குறிக்கும் சொல்லுக்கு, நவீனத் தமிழில் தெளிவான ‘குடியிருப்பு’ பொருத்தமானது.
- source_word: וְשִׂים
  choice: அமைந்துள்ளது
  rationale: வடிவம் கட்டளைப் பொருளாக வாசிக்கப்படக்கூடியதாயினும், இக்கவிதைச் சூழலில் கூட்டின் நிலையை விவரிக்கும் பயனிலைப் பொருளே இயல்பானது; அந்தச் செயப்படுபொருள் நுணுக்கத்தை ‘அமைந்துள்ளது’ தருகிறது.
- source_word: בַּסֶּלַע
  choice: பாறையில்
  rationale: סֶלַע பாறை, குன்றுப்பாறை அல்லது செங்குத்தான பாறையைக் குறிக்கலாம். பாதுகாப்பான உயரிடக் கூடு என்ற உருவகத்தை ‘பாறையில்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: קִנֶּךָ
  choice: உன் கூடு
  rationale: மூலத்தின் பறவைக்கூடு உருவகத்தைச் சுருக்காமலும் விளக்கமாக மாற்றாமலும் நேரடியாகப் பாதுகாக்கிறது.
