revisions:
- from: ஆகவே இப்போது[a], உன் இடத்துக்குத் தப்பியோடு. ‘நான் உன்னை நிச்சயமாகக் கனப்படுத்துவேன்’ என்று சொன்னேன்; ஆனால் இதோ[b], யாவே உனக்குக் கிடைக்கவிருந்த கனத்தைத் தடுத்துவிட்டார்.
  to: இப்போது, உன் இடத்துக்கு ஓடிப்போ. ‘நான் உன்னை மிகவும் கௌரவிப்பேன்’ என்று சொன்னேன்[a]; ஆனால் இதோ, யாவே உனக்குக் கௌரவம் கிடைக்காமல் தடுத்துவிட்டார்[b].
