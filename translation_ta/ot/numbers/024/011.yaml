base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: ta
  text: இப்போது, உன் இடத்துக்கு ஓடிப்போ. ‘நான் உன்னை மிகவும் கௌரவிப்பேன்’ என்று சொன்னேன்[a]; ஆனால் இதோ, யாவே உனக்குக் கௌரவம் கிடைக்காமல் தடுத்துவிட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் உன்னை மிகவும் கௌரவிப்பேன் என்று சொல்லியிருந்தேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வாக்கிய அமைப்பு வாக்குறுதியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே உனக்குக் கௌரவத்தை மறுத்துவிட்டார்’ அல்லது ‘யாவே உன்னைக் கௌரவத்திலிருந்து விலக்கிவிட்டார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: இணைப்புச் சொல்லையும் காலக் குறிப்பையும் காத்து, பாலாக்கின் முடிவான பதிலின் இயல்பான தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: בְּרַח
  choice: தப்பியோடு
  rationale: இந்தக் கட்டளை விரைவாகவும் வலுக்கட்டாயமாகவும் அகன்று செல்லும் பொருளைக் கொண்டது; பாலாக்கின் கடுமையான விரட்டும் தொனியைக் காக்கிறது.
- source_word: מְקוֹמֶךָ
  choice: உன் இடத்துக்கு
  rationale: எபிரெயச் சொல் பொதுவாக ‘இடம்’ என்பதே; சூழல் பிலேயாம் திரும்பிச் செல்ல வேண்டிய இடத்தைக் குறிக்கிறது. ‘வீடு’ என்று மிகத் துல்லியப்படுத்தவில்லை.
- source_word: אָמַרְתִּי
  choice: என்று சொன்னேன்
  rationale: முன்பு கூறிய வாக்குறுதியை எளிய இறந்தகாலத்தில் இயல்பாகத் தருகிறது.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: நான் உன்னை நிச்சயமாகக் கனப்படுத்துவேன்
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: ஆனால் இதோ
  rationale: வாக்குறுதிக்கும் நிகழ்ந்த முடிவுக்கும் இடையிலான கூர்மையான முரண்பாட்டையும் உடனடித் தன்மையையும் காக்கிறது.
- source_word: מְנָעֲךָ
  choice: உனக்குக் கிடைக்கவிருந்த ... தடுத்துவிட்டார்
  rationale: מנע என்பதன் ‘தடு/கிடைக்காமல் செய்’ என்ற பொருளை, அடுத்துவரும் מִן அமைப்புடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: מִכָּבוֹד
  choice: கனம்
  rationale: இச்சூழலில் அரசன் அளிப்பதாக இருந்த மதிப்பு, உயர்வு, வெகுமதி சார்ந்த கனத்தைக் குறிக்கிறது; ‘மகிமை’ என்ற இறையியல் பொருளைத் தேவையின்றி புகுத்தவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: யாவே பிலேயாமை ‘கனத்திலிருந்து’ தடுத்தார் என்பதன் பொருள்
  choice: உனக்குக் கிடைக்கவிருந்த கனத்தைத் தடுத்துவிட்டார்
  alternative: உன்னைக் கனத்திலிருந்து விலக்கிவிட்டார்
  rationale: மூலத்தின் מִן அமைப்பு இருவிதமாகச் சொல்லப்படலாம். தேர்ந்த வடிவம், பாலாக் வாக்களித்த கனம் பிலேயாமுக்குக் கிடைக்காமல் போனது என்ற சூழல்பொருளை இயல்பாகத் தருகிறது; செயற்பாட்டின் இறையியல் காரணத்தை கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பாலாக்கின் கடுமையான விரட்டும் தொனியும் வாக்குறுதி–முடிவு முரண்பாடும் காக்கப்பட்டுள்ளன. ‘கனப்படுத்து/கனம்’ என்ற சொல் இங்கு அரச மரியாதை மற்றும் உயர்வைக் குறிக்கிறது.
