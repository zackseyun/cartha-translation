  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: ta
  text: யாக்கோபிலிருந்து ஒருவர் ஆட்சி செய்வார்[a]; அவர் நகரத்திலிருந்து எஞ்சியிருப்பவனை[b] அழிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபிலிருந்து ஒருவர் ஆதிக்கம் செலுத்துவார்.” எபிரெய வினைச்சொல்லை “ஆட்சி செய்வார்” அல்லது “ஆதிக்கம் செலுத்துவார்” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எஞ்சியோர்.” இங்குள்ள எபிரெய ஒருமைச்சொல் கூட்டாக எஞ்சிய அனைவரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: ஒருவர் ஆட்சி செய்வார்
  rationale: רדה என்ற வினைச்சொல் ‘ஆட்சி செய்’ அல்லது ‘ஆதிக்கம் செலுத்து’ என்று பொருள்படும். எபிரெயச் சொற்றொடரில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால், முந்தைய வசனங்களில் கூறப்படும் அரசரைக் குறிக்கும் வகையில் ‘ஒருவர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִיַּעֲקֹב
  choice: யாக்கோபிலிருந்து
  rationale: מן முன்னிடைச்சொல் இங்கு தோற்றத்தையோ மூலத்தையோ குறிக்கிறது; வரவிருக்கும் ஆட்சியாளர் யாக்கோபின் சந்ததியிலிருந்து எழுவார் என்ற பொருளை இது இயல்பாகத் தருகிறது.
- source_word: וְהֶאֱבִיד
  choice: அழித்துப்போடுவார்
  rationale: אבד என்பதன் ஹிஃபில் வடிவம் ஒருவரை அழியச் செய்தல் என்ற வலுவான காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘அழித்துப்போடுவார்’ அந்த வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׂרִיד
  choice: எஞ்சியிருப்பவனை
  rationale: இந்த ஒருமை ஆண்பால் பெயர்ச்சொல் எஞ்சியிருக்கும் அல்லது உயிர்தப்பிய ஒருவரைக் குறிக்கிறது; கூட்டுப்பொருளும் கொள்ளக்கூடும். தமிழில் ‘எஞ்சியிருப்பவனை’ என்பது அதன் ஒருமை வடிவத்தையும் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: מֵעִיר
  choice: நகரத்தில்
  rationale: எபிரெயத்தில் இது சொற்பட ‘நகரத்திலிருந்து’ என இருந்தாலும், அழிவுக்குப் பின் நகரில் எஞ்சியிருப்பவரைக் குறிக்கும் இயல்பான தமிழ் அமைப்பாக ‘நகரத்தில்’ பயன்படுத்தப்பட்டுள்ளது; ‘கோட்டை நகரம்’ போன்ற கூடுதல் பொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பிலேயாமின் இறைவாக்கில் அரச அல்லது மேசியா சார்ந்த குறிப்பு
  choice: வருபவரை ‘ஒருவர்’ என்றும் அவர் ‘ஆட்சி செய்வார்’ என்றும் பொதுவான அரச மொழியில் மொழிபெயர்த்தல்
  alternative: அவரை உடனடியான வரலாற்று அரசராக மட்டும் அடையாளப்படுத்துதல் அல்லது மேசியா என்று நேரடியாகக் குறிப்பிடுதல்
  rationale: சுற்றியுள்ள இறைவாக்கு ஓர் அரச உருவத்தைக் காட்டினாலும், இந்த வசனம் அவரை வெளிப்படையாக மேசியா என்று அடையாளப்படுத்தவில்லை. ஆகவே உரை அரசப் பொருளைத் தக்கவைத்துக்கொண்டு, வரலாற்று அல்லது மேசியா சார்ந்த விளக்கத்தை வாசகருக்குத் திறந்தவாறே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட இறைவாக்கு நடையைப் பயன்படுத்துகிறது. எழுவாய் இல்லாத எபிரெய வினைக்கு ‘ஒருவர்’ சேர்க்கப்பட்டாலும், அந்த நபரின் அடையாளம் விளக்கவுரையால் நிர்ணயிக்கப்படவில்லை. அடிக்குறி குறிகள் உரையில் வரிசையாக இடம்பெற்றுள்ளன.
