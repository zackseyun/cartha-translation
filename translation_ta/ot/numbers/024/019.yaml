    issue: ‘நகரத்தில்’ renders מֵעִיר imprecisely.
    rationale: The Hebrew preposition מן means ‘from/out of,’ not ‘in.’ Rendering it as ‘நகரத்திலிருந்து’ preserves the source wording and the English audit trail.
