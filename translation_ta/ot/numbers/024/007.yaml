source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: ta
  text: 'அவனுடைய வாளிகளிலிருந்து[a] தண்ணீர் வழிந்தோடும்;

    அவனுடைய விதை[b] மிகுந்த நீரில் இருக்கும்.

    அவனுடைய அரசன் அகாகைவிட உயர்ந்திருப்பான்;

    அவனுடைய அரசாட்சி மேன்மையடையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தப் பெயர்ச்சொல்லை அதன் வழக்கமான ‘வாளிகள்’ என்ற பொருளில் அல்லாமல் உருவகமாக எடுத்தால், ‘அவனுடைய கிளைகளிலிருந்து’ என்றும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விதை’ என்பது ‘சந்ததி’ அல்லது ‘வழித்தோன்றல்கள்’ என்றும் பொருள்படலாம்; எபிரெயச் சொல் சந்ததியையும் செழிப்பின் உருவகத்தையும் ஒருசேர நினைவூட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: வழிந்தோடும்
  rationale: திரவம் சொட்டுதல் அல்லது ஓடுதல் என்ற வினையின் பொருளை, இங்குள்ள செழிப்பின் சூழலில் மிகக் குறுகலாகவோ மிகைப்படுத்தியோ காட்டாமல் இயல்பாகத் தருகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: எபிரெய மொழியில் வடிவரீதியாகப் பன்மையாக இருந்தாலும், தமிழில் இயல்பான திரள்பொருள் பெயராக ‘தண்ணீர்’ பொருத்தமானது.
- source_word: מִדָּלְיוֹ
  choice: அவனுடைய வாளிகளிலிருந்து
  rationale: דְּלִי என்பதன் வழக்கமான பொருள் தண்ணீர் எடுக்கும் வாளி. உடனடியான நீர் உருவகத்துக்கும் இது பொருந்துகிறது; ‘கிளைகள்’ என்ற அரிதான உருவக வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְזַרְעוֹ
  choice: அவனுடைய விதை
  rationale: זֶרַע என்பது நேரடியான விதையையும் சந்ததி அல்லது வழித்தோன்றலையும் குறிக்கலாம். ‘விதை’ என்ற சொல் கவிதையின் வளமை மற்றும் சந்ததி ஆகிய இரு சாத்தியங்களையும் திறந்தவாறு வைக்கிறது.
- source_word: בְּמַיִם רַבִּים
  choice: மிகுந்த நீரில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் அடிப்படை இடப்பொருளையும் רַבִּים குறிக்கும் மிகுதியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְיָרֹם
  choice: உயர்ந்திருப்பான்
  rationale: רוּם என்பதன் உயர்வு அல்லது மேன்மை என்ற பொருளையும், அகாகுடன் செய்யப்படும் ஒப்பீட்டையும் தெளிவாகத் தருகிறது.
- source_word: מֵאֲגַג
  choice: அகாகைவிட
  rationale: உயர்வைக் குறிக்கும் வினையுடன் வரும் מִן ஒப்பீட்டுப் பொருளில் இருப்பதால் ‘விட’ என மொழிபெயர்க்கப்பட்டுள்ளது; அகாக் என்பது உரையில் உள்ள பெயராகவே வைக்கப்பட்டுள்ளது.
- source_word: מַלְכּוֹ
  choice: அவனுடைய அரசன்
  rationale: מֶלֶךְ என்பதன் நேரடியான பொருள் ‘அரசன்’. அந்த அரசன் யார் என்று மொழிபெயர்ப்பில் குறிப்பிட்டு விளக்கப்படவில்லை.
- source_word: וְתִנַּשֵּׂא
  choice: மேன்மையடையும்
  rationale: உயர்த்தப்படுதல் அல்லது மேன்மை பெறுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய அடியிலுள்ள ‘உயர்ந்திருப்பான்’ என்பதிலிருந்து கவிதை வேறுபாட்டையும் காக்கிறது.
- source_word: מַלְכֻתוֹ
  choice: அவனுடைய அரசாட்சி
  rationale: מַלְכוּת என்பது ராஜ்யம், அரசாட்சி, அரசுரிமை ஆகிய பொருட்களைக் கொள்ளலாம். ‘அரசாட்சி’ இங்கு ஆட்சியையும் அதன் மேன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவனுடைய விதை’ என்பதன் குறிப்பு
  choice: ‘விதை’ என்றே வைத்து, பயிர் வளம், சந்ததி, அல்லது இரண்டும் என்பதைக் குறிப்பாகத் தீர்மானிக்கவில்லை.
  alternative: ‘அவனுடைய சந்ததி’ அல்லது ‘அவனுடைய வழித்தோன்றல்கள்’
  rationale: எபிரெய זֶרַע இரு பொருட்களையும் தாங்கக்கூடியது; கவிதை அவற்றின் இணைந்த ஒலிப்பை நோக்கத்துடன் கொண்டிருக்கலாம்.
- issue: ‘அவனுடைய அரசன்’ என்பவரின் அடையாளமும் அகாகுடனான தொடர்பும்
  choice: அரசனை சவுல், தாவீது, மேசியா அல்லது வேறு ஒருவராக அடையாளப்படுத்தாமல், உரையின் பொதுவான அரச மொழியைப் பாதுகாத்தது.
  alternative: இஸ்ரவேலின் எதிர்கால மன்னராட்சியை அல்லது மேசியாவை நேரடியாகக் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: இந்த இறைவாக்கு அரச உயர்வைப் பேசினாலும், இந்த வசனமே அரசனின் தனிப்பட்ட அடையாளத்தை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயத்தையும் நான்கு இணை அடிகளின் அமைப்பையும் காக்கும் கண்ணியமான, எளிதில் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாளி’, ‘விதை’, ‘அரசன்’, ‘அரசாட்சி’ ஆகிய சொற்கள் தேவையற்ற சமயக் குழு சார்ந்த விளக்கங்களைச் சேர்க்காமல் மூலத்தின் உருவகங்களையும் தெளிவின்மையையும் பாதுகாக்கின்றன.
