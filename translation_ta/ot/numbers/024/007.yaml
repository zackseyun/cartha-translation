  source_fidelity: மூல எபிரெயத்தின் நான்கு கவிதை அடிகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. יִזַּל என்பதற்கு ‘வழிந்தோடும்’, מִדָּלְיוֹ என்பதற்கு ‘வாளிகளிலிருந்து’, זַרְעוֹ என்பதற்கு இருபொருள் வாய்ந்த ‘விதை’, மற்றும் מֵאֲגַג என்பதற்கு ஒப்பீட்டான ‘அகாகைவிட’ ஆகியவை பொருத்தமானவை. அரசனின் அடையாளத்தையோ ‘விதை’யின் குறிப்பையோ தேவையின்றித் தீர்மானிக்கவில்லை.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கவிதைநயத்துடனும் உள்ளது. ‘அவனுடைய விதை மிகுந்த நீரில் இருக்கும்’ என்பது மூலத்தின் உருவகத் தெளிவின்மையைப் பாதுகாக்கும் சற்றே செறிவான கவிதை மொழியாக இயங்குகிறது; இயல்பற்றதாகும் அளவுக்கு இல்லை.
  terminology: ‘வாளி’, ‘விதை’, ‘அரசன்’, ‘அரசாட்சி’ ஆகிய சொற்கள் மூலச் சொற்களின் பொருள்வீச்சையும் உரிய உயர்நடையையும் காக்கின்றன. ‘அகாக்’ பெயர் தக்கவாறு ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு a-வில் கிளைகள் என்ற மாற்றுவாய்ப்பும், அடிக்குறிப்பு b-வில் விதை/சந்ததி என்ற பொருள்வீச்சும் சரியான இடங்களில் தரப்பட்டுள்ளன.
