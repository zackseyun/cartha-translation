source:
  edition: WLC
  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: ta
  text: எனவே மோசே அவர்களுடைய வழக்கை யாவேக்கு முன்பாகக் கொண்டுவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சட்ட உரிமைக்கோரிக்கையை யாவேக்கு முன்பாக முன்வைத்தார்.”
    reason: מִשְׁפָּט மற்றும் וַיַּקְרֵב ஆகியவற்றின் சட்டச் சூழலுக்குரிய மாற்று மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: கொண்டுவந்தார்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது ‘முன்வைத்தல்’ என்று பொருள்படும். சட்டச் சூழலில், மோசே அந்த வழக்கைத் தீர்ப்புக்காக யாவேக்கு முன்பாகக் கொண்டுவந்தார் என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשְׁפָּטָן
  choice: அவர்களுடைய வழக்கை
  rationale: மִשְׁפָּט என்பது தீர்ப்பு, நீதி, சட்ட உரிமைக்கோரிக்கை அல்லது வழக்கு ஆகியவற்றைக் குறிக்கலாம். இங்கு பெண்பால் பன்மை பின்னொட்டு செலொப்பெகாதின் மகள்களுடைய சட்ட விவகாரத்தைக் குறிக்கிறது; ஆகவே ‘அவர்களுடைய வழக்கு’ சூழலுக்கு ஏற்றது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இச்சொல் ‘முன்பாக’ அல்லது ‘சந்நிதியில்’ என்று பொருள்படும். ஒரு விவகாரத்தைத் தீர்ப்புக்காக ஒருவரிடம் கொண்டுவரும் சட்டச் சூழலுக்கு ‘முன்பாக’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இறைபெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பெயராக ‘யாவே’ என்று எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַ
  choice: எனவே
  rationale: முன் வசனங்களில் மகள்கள் முன்வைத்த கோரிக்கையைத் தொடர்ந்து நிகழ்ந்த விளைவை இந்த இணைப்புச் சொல் காட்டுகிறது; தமிழில் ‘எனவே’ அந்தக் கருத்தோட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனத்தில் יְהוָה என்ற தனிப்பட்ட இறைபெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிப்பெயர்ப்பாகத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. சட்டச் சூழலைத் தெளிவாக்க ‘வழக்கு’ பயன்படுத்தப்பட்டாலும், மூலச்சொல்லின் ‘சட்ட உரிமைக்கோரிக்கை’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
