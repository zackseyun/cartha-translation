  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே மோசே செய்தார். அவர் யோசுவாவை அழைத்து, ஆசாரியனாகிய எலெயாசாரின் முன்னிலும் சபையார் அனைவரின் முன்னிலும் அவரை நிறுத்தினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரை நிற்கச் செய்தார்’ அல்லது ‘அவரை முன்னிறுத்தினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: וַיַּעֲמִדֵהוּ என்ற எபிரேய வினை, ஒருவரை நிற்கச் செய்வதையும் அதிகாரபூர்வமாக முன்னிலையில் நிறுத்துவதையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்ற பொதுவான வினைச்சொல், முந்தைய கட்டளைக்கு மோசே கீழ்ப்படிந்ததைக் குறிக்கிறது; தமிழில் ‘கட்டளையிட்டபடியே ... செய்தார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: ஒப்புமையையும், யாவேயின் கட்டளைக்கு மோசேயின் செயல் நேரடியாக இணங்கியதையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: அவர் யோசுவாவை அழைத்துவந்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இங்கு ஒருவரை பொதுமக்கள் முன் நிறுத்த அழைத்துவரும் சூழலில், ‘அழைத்துவந்து’ என்பது இயல்பான தமிழில் அந்தச் செயலைத் தெளிவாகத் தருகிறது.
- source_word: וַיַּעֲמִדֵהוּ
  choice: அவரை நிறுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல்/நிறுத்துதல்’ என்று பொருள்படும். ‘நிறுத்தினார்’ என்பது உடல்சார்ந்த செயலையும் நியமனச் சடங்கின் பொதுவான முன்னிறுத்தலையும் தக்கவைக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: எலெயாசாரும் சபையாரும் இருக்கும் முன்னிலையில் யோசுவா நிறுத்தப்பட்டதை நேரடியாகக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: எலெயாசாரின் அலுவலைத் தெளிவாக அடையாளப்படுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: כָּל־הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה என்பது கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘சபையார் அனைவரும்’ என்பது மக்களின் முழுக் கூட்டத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: யோசுவாவை மோசே ‘நிறுத்தியதன்’ சடங்குசார் நுணுக்கம்
  choice: அவரை நிறுத்தினார்
  alternative: அவரை முன்னிறுத்தினார்
  rationale: மூல வினை உடல்சார்ந்து நிற்கச் செய்தல் என்றும், ஒருவரை அதிகாரபூர்வமாக முன்னிலைப்படுத்துதல் என்றும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மைப் பாடம் நேரடியான பொருளை வைத்திருக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன; எபிரேய வாக்கியத்தின் செயல்வரிசையும் பொது நியமனச் சூழலும் பாதுகாக்கப்பட்டுள்ளன.
