  rationale: ‘அழைத்துவந்து’ என்பதிலுள்ள கூடுதல் இயக்கநுணுக்கம் நீக்கப்பட்டு, மூலத்தின் ‘எடுத்தார்/அழைத்தார்’ என்ற செயல் இயல்பான தமிழில் தரப்பட்டுள்ளது. இரு ‘முன்’ குறிப்புகளும் எபிரேய வாக்கியத்தின் அமைப்பைப் பின்பற்றி, இலக்கணமாகச் சரியான உடைமை வடிவில் திருத்தப்பட்டுள்ளன. அடிக்குறிப்பு மூல வினையின் உடல்சார் மற்றும் சடங்குசார் சாத்தியங்களை மாற்றமின்றிப் பாதுகாக்கிறது.
