  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: ta
  text: அவருக்கு மகன் இல்லாததால், எங்கள் தந்தையின் பெயர் அவருடைய குலத்திலிருந்து ஏன் நீக்கப்பட வேண்டும்? எங்கள் தந்தையின் சகோதரர்களிடையே எங்களுக்கு ஒரு நிலப்பங்கைத் தாருங்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீக்கப்பட” என்பதற்கு “குறைந்துபோக” அல்லது “அகற்றப்பட” என்றும் மொழிபெயர்க்கலாம். மகன் இல்லாததால் தங்கள் தந்தையின் “பெயர்” குலத்திலிருந்து நீக்கப்பட வேண்டுமா என்பதே எபிரெய வினா.
    reason: lexical_alternative
  - marker: b
    text: “நிலப்பங்கு” என்பது குலத்துக்குள் பரம்பரை உரிமையாக ஒதுக்கப்படும் நில உடைமையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன் ... வேண்டும்?
  rationale: சூழலில் இது வெறும் காரண வினா அல்ல; அநீதி ஏற்படக் கூடாது என்ற எதிர்ப்பை உள்ளடக்கிய வினா.
- source_word: יִגָּרַע
  choice: நீக்கப்பட வேண்டும்
  rationale: גרע என்ற வினையின் நிஃபால் வடிவம் இங்கு குலத்தின் நடுவிலிருந்து தந்தையின் பெயர் இழக்கப்படுதல் அல்லது அகற்றப்படுதல் என்ற நடைமுறை விளைவைக் குறிக்கிறது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: எபிரெயச் சொல்லை நேரடியாகத் தக்கவைத்து, குலத்தில் தந்தையின் வழியும் நினைவும் தொடர்வதைக் குறிக்கும் மொழிவழக்கையும் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: அவருடைய குலத்திலிருந்து
  rationale: நிலப் பங்கீட்டுச் சூழலில் מִשְׁפָּחָה என்பது அணுக்கக் குடும்பத்தைவிட விரிவான குலக் குழுவைக் குறிக்கிறது.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: அவருக்கு மகன் இல்லாததால்
  rationale: எபிரெயில் காலத்தை வெளிப்படையாகக் குறிக்காத பெயரெச்ச வாக்கியம் உள்ளது; இயல்பான தமிழில் இதே நிலையைச் சுருக்கமாகத் தெரிவிக்கிறது, மேலும் சட்டச் சூழலில் உள்ள ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
- source_word: תְּנָה לָּנוּ
  choice: எங்களுக்கும் ... தாருங்கள்
  rationale: நேரடியான வேண்டுகோள். 'எங்களுக்கும்' என்பது தந்தையின் சகோதரர்களிடையே அவர்களுக்கும் பங்கு வழங்கப்பட வேண்டும் என்ற சூழல்சார் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחֻזָּה
  choice: ஒரு நிலப்பங்கு
  rationale: இச்சொல் குலத்துக்குள் ஒதுக்கப்படும் நில உடைமை அல்லது பரம்பரைப் பங்கைக் குறிக்கிறது; பொதுவான 'உடைமை' என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: எங்கள் தந்தையின் சகோதரர்களின் நடுவில்
  rationale: தந்தைவழிச் சகோதரர்களை எபிரெயம் குறிப்பாகச் சொல்வதால், அதை உறவினர்கள் எனப் பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிப்பாகக் கூறும் வாரிசுரிமை மொழி
  choice: மகன் / தந்தையின் சகோதரர்கள்
  alternative: பிள்ளை / உறவினர்கள்
  rationale: சட்டப் பிரச்சினை மகன் இல்லாமையையும் தந்தைவழிச் சகோதரர்களிடையே நிலம் ஒதுக்கப்படுவதையும் சார்ந்ததால், மூலத்தின் ஆண்பால் குறிப்புகள் பொதுமைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் நேரடியான மனுத்தொனியும் காக்கப்பட்டுள்ளன. 'குலம்', 'நிலப்பங்கு' ஆகிய சொற்கள் பழங்கால இஸ்ரவேலின் உறவுமுறை மற்றும் நில வாரிசுரிமைச் சூழலை சாதாரண வாசகருக்குத் தெளிவாக எடுத்துரைக்கின்றன.
