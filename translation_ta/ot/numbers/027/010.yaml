  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: ta
  text: ஆனால், அவனுக்குச் சகோதரர்கள் இல்லையென்றால், அவனுடைய மரபுரிமைச் சொத்தை அவனுடைய தந்தையின் சகோதரர்களுக்குக்[a] கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அவனுடைய தந்தையின் உடன்பிறந்த ஆண் சகோதரர்களுக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இல்லையென்றால்
  rationale: சட்ட விதிகளின் தொடரில் அடுத்த மாற்று நிலையை அறிமுகப்படுத்தும் இணைப்பையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵין לוֹ אַחִים
  choice: அவனுக்குச் சகோதரர்கள் இல்லையென்றால்
  rationale: எபிரெயச் சொற்றொடரின் உடைமை சார்ந்த மறுப்பை இயல்பான தமிழில் தருகிறது; ஆண்பால் பன்மையான אַחִים என்பதற்குச் ‘சகோதரர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּנְתַתֶּם
  choice: கொடுக்க வேண்டும்
  rationale: பன்மை முன்னிலையோருக்குக் கூறப்படும் சட்டக் கட்டளையின் வலிமையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: נַחֲלָתוֹ
  choice: அவனுடைய உரிமைச்சொத்தை
  rationale: இந்த வாரிசுரிமைச் சட்டச் சூழலில் பரம்பரையாகக் கிடைக்கும் சொத்து அல்லது பங்கைக் குறிக்கிறது.
- source_word: לַאֲחֵי אָבִיו
  choice: அவனுடைய தந்தையின் சகோதரர்களுக்கு
  rationale: ‘அவனுடைய தந்தையின் சகோதரர்கள்’ என்ற மூலத்தின் உறவுமுறை அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
