translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமும் தெளிவும் காக்கப்பட்டுள்ளன. ‘தந்தையின் சகோதரர்கள்’ என்பது மூலத்தின் சொற்றொடரை வெளிப்படையாக வைத்திருக்கிறது; அதன் இயல்பான உறவுப்பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
