  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: ta
  text: நீ அவனை ஆசாரியனான எலெயாசாரின் முன்னிலும் முழு சபையின் முன்னிலும் நிறுத்தி, அவர்கள் கண்முன்னே அவனுக்குப் பொறுப்பை ஒப்படைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுக்குக் கட்டளையிட வேண்டும்’ அல்லது ‘அவனுக்குப் பொறுப்புக் கட்டளை கொடுக்க வேண்டும்.’ எபிரெய வினை பொதுவாகக் கட்டளையிடுவதைக் குறிக்கலாம்; இங்கு யோசுவாவுக்கு அவனுடைய பொறுப்பை வெளிப்படையாக ஒப்படைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: நீ அவனை ... முன்பாக நிறுத்தி
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவரை நிற்கச் செய்வதை அல்லது முறையாக முன்னிறுத்துவதைச் சுட்டுகிறது. ‘நிறுத்தி’ என்பது பொதுமக்கள் முன்னிலையில் நடைபெறும் இச்செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இச்சொல் இடம் சார்ந்த அர்த்தத்தையும் முறையான முன்னிலையையும் குறிக்கிறது; சடங்குபூர்வமான சூழலில் ‘முன்பாக’ இரண்டையும் தக்கவைக்கிறது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெய தனிப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: எலெயாசாரின் பணிநிலையைத் தெளிவாக அடையாளப்படுத்தும் definite title; தமிழில் பெயருடன் இயல்பாக இணைகிறது.
- source_word: כָּל הָעֵדָה
  choice: சபை முழுவதற்கும்
  rationale: עֵדָה இங்கு ஒன்றுகூடிய இஸ்ரயேல் சமூகத்தைக் குறிக்கிறது. ‘சபை முழுவதும்’ அதன் கூட்டு மற்றும் பிரதிநிதித்துவத் தன்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: அவனுக்குப் பொறுப்பளிக்க வேண்டும்
  rationale: צוה பொதுவாகக் ‘கட்டளையிடு’ என்று பொருள்படும்; இங்கு யோசுவாவைப் பொதுவாகப் பதவியில் நிறுவி அதிகாரப்பூர்வப் பொறுப்பை ஒப்படைக்கும் சூழல் உள்ளது. ‘பொறுப்பளி’ அந்தச் சூழலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்முன்னே
  rationale: சொல்லளவில் ‘அவர்களுடைய கண்களுக்கு முன்’ என்ற பொருளுடைய இச்சொற்றொடர், செயல் அனைவரும் காணும்படி வெளிப்படையாக நடந்ததைச் சுட்டுகிறது. ‘கண்முன்னே’ அந்தக் காட்சிப்பூர்வ வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோசுவாவுக்கு அதிகாரப்பூர்வமாகப் பொறுப்பு வழங்குதல்
  choice: צוה என்பதைச் சூழலுக்கேற்ப ‘பொறுப்பளிக்க வேண்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவனுக்குக் கட்டளையிட வேண்டும்’ அல்லது ‘அவனுக்குப் பொறுப்புக் கட்டளை கொடுக்க வேண்டும்’
  rationale: சுற்றியுள்ள வசனங்கள் யோசுவாவின் பொது நிறுவலை விவரிக்கின்றன. எனவே வெறும் தனிப்பட்ட கட்டளையைவிட அதிகாரமும் கடமையும் ஒப்படைக்கப்படுவதை ‘பொறுப்பளி’ தெளிவாக்குகிறது. அதேவேளையில் எபிரெய வினையின் பரந்த பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நிகழ்வின் முறையான, பொது நிறுவல் தன்மையைத் தக்கவைக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கண்முன்னே’ என்பது மூலத்தின் காட்சிப்பூர்வமான சொற்றொடரை இயல்பாகப் பாதுகாக்கிறது.
