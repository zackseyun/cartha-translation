  source_fidelity: 'முதற் வாக்கியத்தின் கருத்து எபிரெய மூலத்திற்கு பெரும்பாலும் உண்மையாக உள்ளது: கட்டளைக்கு எதிரான கிளர்ச்சியும், மக்கள் காணும்படி இறைவனின் பரிசுத்தத்தை வெளிப்படுத்தத் தவறியதும் தெளிவாகக் கூறப்படுகின்றன. ஆனால் מֵי (‘நீர்கள்/நீர்நிலைகள்’) என்பதன் பன்மை, இறுதி அடையாளக் குறிப்பில் ஒருமை ‘தண்ணீர்’ எனக் குறைந்துள்ளது. மேலும் מֵי מְרִיבַת קָדֵשׁ என்பது இடப்பெயர்த் தொடராக இருப்பதால் அதை ‘மெரிபாத்-காதேஸ்’ என நேரடியாகக் காப்பது பாதுகாப்பானது.'
