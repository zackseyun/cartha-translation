- from: ஏனெனில், சீன் வனாந்தரத்தில் சபையாரின் வாக்குவாதத்தின்போது, அவர்கள் கண்முன்னே தண்ணீரிடத்தில் என்னைப் பரிசுத்தமானவராக வெளிப்படுத்தாமல், நீங்கள் என் கட்டளைக்கு எதிராகக் கலகம் செய்தீர்கள்.[a] அந்தத் தண்ணீரே சீன் வனாந்தரத்திலுள்ள காதேசின் மெரிபா தண்ணீர்.[b]
