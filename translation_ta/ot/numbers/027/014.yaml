base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: ta
  text: ஏனெனில், சீன் வனாந்தரத்தில் சபையாரின் வாக்குவாதத்தின்போது, அவர்கள் கண்முன்னே நீர்களில் என்னைப் பரிசுத்தமானவராகக் காட்டாமல், நீங்கள் என் கட்டளைக்கு எதிராகக் கிளர்ச்சி செய்தீர்கள்.[a] அவை சீன் வனாந்தரத்திலுள்ள மெரிபாத்-காதேசின் நீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னைப் பரிசுத்தமானவராகக் காட்டுவதற்கு’ என்றும் நேரடியாக மொழிபெயர்க்கலாம். எபிரெய வினையெச்சம் நேர்மறை வடிவில் இருந்தாலும், மோசேயும் ஆரோனும் இதைச் செய்யத் தவறினர் என்பது சூழலால் தெளிவாகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மெரிபாத்-காதேஸ்’ என்பதை ‘காதேசின் மெரிபா’ அல்லது இன்னும் சொல்லர்த்தமாக ‘காதேசின் வாக்குவாதம்’ என்றும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தண்டனைக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துவதால், சூழலுக்கேற்ற காரணப் பொருள் பயன்படுத்தப்பட்டது.
- source_word: מְרִיתֶם
  choice: நீங்கள் ... கலகம் செய்தீர்கள்
  rationale: מרה என்பது அதிகாரத்துக்கு எதிராகக் கிளர்வதையோ மறுப்பதையோ குறிக்கிறது; தமிழில் நேரடியாகவும் இயல்பாகவும் ‘கலகம் செய்தீர்கள்’ என வழங்கப்பட்டது.
- source_word: פִּי
  choice: என் கட்டளை
  rationale: சொல்லர்த்தம் ‘என் வாய்’ என்றாலும், இங்கு தேவனுடைய வாயிலிருந்து வந்த கட்டளையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: בְּמִדְבַּר צִן
  choice: சீன் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பதன் வறண்ட, குடியிருப்பற்ற நிலப்பகுதி என்ற புவியியல் பொருளை ‘வனாந்தரம்’ வெளிப்படுத்துகிறது; צִן இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: சபையாரின் வாக்குவாதத்தின்போது
  rationale: מְרִיבָה என்பது சச்சரவு அல்லது வாக்குவாதத்தைக் குறிக்கிறது; עֵדָה இங்கு இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் என்பதால் இயல்பான தமிழில் ‘சபையார்’ என வழங்கப்பட்டது.
- source_word: לְהַקְדִּישֵׁנִי
  choice: என்னைப் பரிசுத்தமானவராக வெளிப்படுத்தாமல்
  rationale: எபிரெய வினையெச்சம் நேர்மறை வடிவில் ‘என்னைப் பரிசுத்தப்படுத்த’ என்று இருந்தாலும், மோசேயும் ஆரோனும் அதைச் செய்யத் தவறியதே சூழலில் குற்றமாகக் கூறப்படுகிறது. கடவுளின் பரிசுத்தத்தை மக்கள் முன் வெளிப்படுத்துதல் என்ற causative பொருள் காக்கப்பட்டது.
- source_word: בַּמַּיִם
  choice: தண்ணீரிடத்தில்
  rationale: அந்த நிகழ்வு நடந்த இடத்தையும் சூழலையும் இச்சொல் சுட்டுகிறது; ‘தண்ணீரிடத்தில்’ என்பது அந்த இடத்தைக் குறிப்பிடும் இயல்பான தமிழ்.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்முன்னே
  rationale: நிகழ்வு பொதுமக்கள் காணும்படி நடந்ததை வலியுறுத்தும் எபிரெய மரபுத்தொடரின் காட்சித்தன்மை காக்கப்பட்டது.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: காதேசின் மெரிபா தண்ணீர்
  rationale: மெரிபாவையும் காதேசையும் இணைக்கும் இடப்பெயர் தொடராக வாசிக்கப்பட்டது; தமிழில் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பும் இயல்பான சொற்றொடரும் பயன்படுத்தப்பட்டன.
theological_decisions:
- issue: לְהַקְדִּישֵׁנִי என்பதில் உள்ள செயலைச் செய்யத் தவறியதைக் காட்டுதல்
  choice: என்னைப் பரிசுத்தமானவராக வெளிப்படுத்தாமல்
  alternative: என்னைப் பரிசுத்தப்படுத்த
  rationale: மூலச்சொல் நேர்மறை வடிவில் இருந்தாலும், வசனத்தின் இலக்கணத் தொடர்பும் எண்ணாகமம் 20 நிகழ்ச்சியின் சூழலும் அவர்கள் அவ்வாறு செய்யவில்லை என்பதைக் காட்டுகின்றன. தமிழில் தவறான எதிர்ப்பொருள் தோன்றாமல் இருக்க, சூழலில் உட்கிடக்கும் மறுப்பு வெளிப்படையாகச் சொல்லப்பட்டது; இது புதிய கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘நீங்கள்’ என்பது மூலத்தில் உள்ள பன்மையைச் சூழல் வழியாகத் தக்கவைக்கிறது. ‘பரிசுத்தமானவராக வெளிப்படுத்துதல்’ என்ற சொற்றொடர் கடவுளின் பரிசுத்தத்தை மக்கள் முன் காட்டுதல் என்ற பொருளைத் தருகிறது; கடவுள் பரிசுத்தமடைவதாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
