  terminology: சீன், காதேஸ் ஆகிய இடப்பெயர்கள் நிலையாக ஒலிபெயர்க்கப்பட வேண்டும். מְרִיבַת קָדֵשׁ-ஐ உரைநடையில் ‘காதேசின் மெரிபா’ என்று மாற்றுவதற்குப் பதிலாக ‘மெரிபாத்-காதேஸ்’ என இடப்பெயராகக் கொடுக்கப்பட்டுள்ளது; அடிக்குறிப்பில் சொல்லர்த்த மாற்று வழங்கப்படுகிறது. ‘சபையார்’ மற்றும் ‘பரிசுத்தமானவராகக் காட்டாமல்’ ஆகியவை பொருத்தமானவை.
