translation_notes:
  register: நவீனத் தரத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. நீண்ட எபிரெய வம்சவரிசை இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் உறவுகள் அனைத்தும் காக்கப்பட்டுள்ளன. ‘முன்வந்தார்கள்’ என்பது சட்டரீதியான விண்ணப்பச் சூழலை மெதுவாக உணர்த்துகிறது; அடுத்த வசனங்களின் தகவலை இங்கே இறக்குமதி செய்யவில்லை.
