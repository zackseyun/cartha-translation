  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ta
  text: 'அப்போது, எப்பேரின் மகனும் கிலேயாத்தின் மகனும் மாகீரின் மகனும் மனாசேயின் மகனுமான செலொப்பெகாத்தின் மகள்கள் முன்வந்தார்கள்[a]. இவர்கள் யோசேப்பின் மகனான மனாசேயின் குலங்களைச் சேர்ந்தவர்கள். செலொப்பெகாத்தின் மகள்களின் பெயர்கள் இவை: மக்லா, நோவா[b], ஹோக்லா, மில்கா, திர்சா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அருகே வந்தார்கள்’; ‘அணுகினார்கள்’ என்றும் மொழிபெயர்க்கலாம். இச்சொல் முறையான விண்ணப்பத்திற்காக முன்வருதலைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நோவா’ என்பது செலொப்பெகாத்தின் மகள்களில் ஒருவரின் பெயர்; ஆதியாகமத்தில் வரும் ஆண் நோவாவைக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: முன்வந்தார்கள்
  rationale: קרב என்பதன் ‘அருகே வந்தார்கள்/அணுகினார்கள்’ என்ற அடிப்படைப் பொருளையும், அடுத்த வசனங்களில் வரும் முறையான விண்ணப்பத்திற்காக அதிகாரிகளின் முன்னிலையில் வந்ததையும் இயல்பான தமிழில் உணர்த்துகிறது; யாரை அணுகினர் என்பதை இவ்வசனத்திலேயே கூடுதலாகச் சேர்க்கவில்லை.
- source_word: בְּנוֹת
  choice: மகள்கள்
  rationale: பெயரிடப்பட்ட தந்தையுடன் வரும் இக்கட்டமைப்பு நேரடியான மகள்களைக் குறிக்கிறது; தொடர்ந்து அவர்களின் பெயர்களும் தரப்படுகின்றன.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: மகனும் ... மகனும் ... மகனும் ... மகனுமான
  rationale: சொத்துரிமைக் கோரிக்கைக்கு அடித்தளமாக அமையும் முழு வம்சவரிசையை ‘வழித்தோன்றல்’ என்று சுருக்காமல் காக்கிறது; தமிழில் தொடர்பைத் தெளிவாக்கும் பின்னோக்கிய மரபுத்தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: לְמִשְׁפְּחֹת
  choice: குலங்களைச் சேர்ந்தவர்கள்
  rationale: இஸ்ரவேலின் கோத்திர உட்பிரிவுகளைக் குறிக்கும் מִשְׁפָּחָה என்பதற்கு ‘குலம்’ பொருத்தமானது; לְ இங்கு சார்பை அல்லது இணைப்பைக் குறிக்கிறது.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: யோசேப்பின் மகனான மனாசே
  rationale: யோசேப்பின் வழியுடனான தொடர்பையும் முழுக் கோத்திர வம்சவரிசையையும் வெளிப்படையாகக் காக்கிறது.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: அவனுடைய மகள்களின் பெயர்கள்
  rationale: பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் எபிரெய வழக்கை சுருக்கமான, இயல்பான தமிழில் தருகிறது; ‘அவன்’ செலொப்பெகாத்தைக் குறிக்கிறது.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: மக்லா, நோவா, ஒக்லா, மில்கா, திர்சா
  rationale: எபிரெய தனிப்பெயர்களின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க இயலும் ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
