  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: ta
  text: யாவே மோசேயின் மூலம்[b] கூறியபடியே, மோசே தம் கைகளை யோசுவாவின்மேல் வைத்து, அவனுக்குக் கட்டளையிட்டார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்குப் பொறுப்பளித்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பொதுவாகக் கட்டளையிடுவதைக் குறிக்கும்; இச்சூழலில் மோசே யோசுவாவை அதிகாரப்பூர்வமாகப் பொறுப்பில் அமர்த்துவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “மோசேயின் கையால்.” இது யாவே தமது முகவராகிய மோசேயின் மூலம் பேசியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: அவன் தன் கைகளை அவன்மேல் வைத்து
  rationale: סמך என்பதன் கைவைப்பு சார்ந்த சடங்கு வழக்கை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; יָדָיו பன்மை என்பதால் ‘கைகளை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַיְצַוֵּהוּ
  choice: அவனுக்குக் கட்டளையிட்டான்
  rationale: צוה வினையின் முதன்மைப் பொருளான ‘கட்டளையிடுதல்’ என்பதைக் காக்கிறது. சூழலில் இது யோசுவாவுக்கான அதிகாரப்பூர்வப் பொறுப்பளிப்பையும் குறிக்கலாம்; அந்தச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: கூறியபடியே
  rationale: மோசேயின் செயல் யெகோவாவின் முந்தைய சொல்லுக்கு அப்படியே ஒத்திருந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்கு சொல் ‘மோசேயின் கையால்’ என்றாலும், இங்கு בְּיַד என்பது முகமை அல்லது இடைமுகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘மூலம்’ என்பது அதன் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யோசுவாவின் நிறுவல் சூழலில் צוה என்பதன் பொருள்
  choice: கட்டளையிட்டான்
  alternative: பொறுப்பளித்தான் / நியமித்தான்
  rationale: முதன்மைச் சொற்பொருளை உரையில் காத்து, அதிகாரப்பூர்வப் பொறுப்பளிப்பு என்ற சூழல்சார் நுண்பொருளை அடிக்குறிப்பில் பதிவு செய்வது உரையின் இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல் பாதுகாக்கிறது.
- issue: בְּיַד מֹשֶׁה என்ற முகமை மரபுத்தொடர்
  choice: மோசேயின் மூலம்
  alternative: மோசேயின் கையால்
  rationale: யெகோவா பேசினார்; மோசே அவரது இடைமுகமாகச் செயல்பட்டார் என்ற முகமை உறவைத் தெளிவாக வெளிப்படுத்துகிறது. சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ஆண்பால் சுட்டுப்பெயர்களால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க இறுதி வாக்கியத்தில் ‘அவன் செய்தான்’ சேர்க்கப்பட்டுள்ளது; இது எபிரெய வாக்கியத்தின் செய்பவராகிய மோசேயைத் தொடர்கிறது. அடிக்குறிப்பு குறிகள் உரையில் [a], [b] என இணைக்கப்பட்டுள்ளன.
