  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: ta
  text: 'அவர்கள் மோசேயின் முன்னிலையிலும், ஆசாரியராகிய எலெயாசாரின் முன்னிலையிலும், தலைவர்களின் முன்னிலையிலும், சபையார் அனைவரின் முன்னிலையிலும், சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் நின்று, இவ்வாறு கூறினார்கள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: அவர்கள் ... நின்று
  rationale: עמד என்பதன் மூன்றாம் நபர் பெண்பால் பன்மை வடிவம், அந்தப் பெண்கள் அதிகாரிகளின் முன் முறையாக வந்து நின்றதைச் சுட்டுகிறது. சூழலில் குறிக்கப்படுபவர்கள் தெளிவாக இருப்பதால், இயல்பான தமிழில் “அவர்கள் ... நின்று” என வழங்கப்படுகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: அதிகாரிகளும் சமூகமும் கூடியிருந்த பொது, சட்டரீதியான சூழலைத் தக்கவைக்கும் இயல்பான தமிழ் சொல். எபிரெய உரையில் வரும் மீளுரைப்பும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியராகிய எலெயாசார்
  rationale: הַכֹּהֵן என்பதை எபிரெய உரை கூறும் அளவிலேயே “ஆசாரியர்” என்று வழங்குகிறது; “பிரதான ஆசாரியர்” என்ற கூடுதல் பதவி இங்கு சேர்க்கப்படவில்லை.
- source_word: הַנְּשִׂיאִם
  choice: தலைவர்கள்
  rationale: נְשִׂיאִים என்பது சமூக அல்லது கோத்திரத் தலைவர்களைக் குறிக்கிறது. “தலைவர்கள்” என்பது இன்றைய தமிழில் தெளிவாகவும், “இளவரசர்கள்” என்ற தவறான அரசகுலப் பொருளைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: כָל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה என்பது எண்ணாகமத்தில் ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. “சபையார் அனைவரும்” என்பது அந்தக் கூட்டு சமூகப் பொருளையும் כָּל என்பதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: פֶּתַח என்பதற்கு “நுழைவாயில்” என்றும் אֹהֶל מוֹעֵד என்பதற்கு “சந்திப்புக் கூடாரம்” என்றும் வழங்கி, இடக்குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினார்கள்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய சொல்லமைப்பை, தமிழில் இயல்பான உரையாடல் அறிமுகமாக வழங்குகிறது.
theological_decisions:
- issue: பெண்களின் விண்ணப்பம் முன்வைக்கப்பட்ட பொது-சட்டரீதியான சூழல்
  choice: “முன்னிலையில்” என்ற சொல்லை மீண்டும் மீண்டும் பயன்படுத்தி, மோசே, எலெயாசார், தலைவர்கள், சபையார் அனைவரும் என்ற முழுப் பட்டியலைத் தக்கவைத்தல்
  alternative: பட்டியலைச் சுருக்கி, அவர்கள் சமூகத் தலைவர்களின் முன் நின்றார்கள் என்று மட்டும் கூறுதல்
  rationale: எபிரெய உரையின் மீளுரைப்பும் முழுப் பட்டியலும் இந்த விண்ணப்பம் தனிப்பட்ட முறையில் அல்லாமல், அதிகாரிகளும் சமூகமும் முன்னிலையில் வெளிப்படையாக முன்வைக்கப்பட்டது என்பதை வலியுறுத்துகின்றன.
- issue: עֵדָה என்பதன் சமூகப் பொருள்
  choice: சபையார்
  alternative: கூட்டத்தார்
  rationale: “சபையார்” என்பது இங்கு ஒன்றுகூடிய இஸ்ரவேல் சமூகத்தின் அடையாளத்தைத் தக்கவைக்கிறது; அதேவேளையில் எந்தப் பிற்கால சபை அமைப்பையும் உரைக்குள் திணிக்காது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் பொது-நீதித்துறை வலியுறுத்தலைப் பாதுகாக்க “முன்னிலையில்” என்ற மீளுரை வைக்கப்பட்டுள்ளது. ஆதார உரையில் இல்லாத ஆங்கிலக் குறிப்புக்குறிகள் சேர்க்கப்படவில்லை.
