  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: ta
  text: நீ அதைப் பார்த்த பிறகு, உன் சகோதரன் ஆரோன் தன் மக்களோடு சேர்க்கப்பட்டாரோ, அதுபோல நீயும் உன் மக்களோடு சேர்க்கப்படுவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கிக் கூறினால், “நீ இறப்பாய்” அல்லது “உன் மூதாதையரிடம் சேர்க்கப்படுவாய்.” எபிரெய மரபுத்தொடரின் நேரடிப் பொருள் “உன் மக்களோடு சேர்க்கப்படுவாய்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: நீ அதைப் பார்த்தபின்
  rationale: ראה என்பதன் Qal இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், முன்னுள்ள நாட்டைப் பார்க்கும் கட்டளையைத் தொடர்ந்து வருகிறது. ஆகவே நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்ட “பார்த்தபின்” என மொழிபெயர்க்கப்பட்டது; אֹתָהּ குறிக்கும் பெண்பால் ஒருமை பொருள் சூழலில் நாட்டைக் குறிப்பதால் “அதை” என வழங்கப்பட்டது.
- source_word: וְנֶאֱסַפְתָּ אֶל־עַמֶּיךָ
  choice: நீயும் உன் மக்களிடம் சேர்க்கப்படுவாய்
  rationale: אסף என்பதன் Niphal வடிவம் இங்கு மரணத்தையும் ஒருவருடைய மக்களுடன் சேர்வதையும் குறிக்கும் எபிரெய மரபுத்தொடராக உள்ளது. வெறுமனே “இறப்பாய்” என்று பொருளைத் தட்டையாக்காமல், மூல உருவகத்தைத் தக்கவைக்க “சேர்க்கப்படுவாய்” எனப்பட்டது.
- source_word: גַּם אָתָּה
  choice: நீயும்
  rationale: மோசேயும் ஆரோனைப் போல அதே முடிவை அடைவான் என்ற வலியுறுத்தலை இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר נֶאֱסַף
  choice: சேர்க்கப்பட்டது போல
  rationale: ஆரோனுக்கு நிகழ்ந்ததற்கும் மோசேக்கு நிகழவிருப்பதற்கும் உள்ள நேரடியான ஒப்புமையையும், இரு இடங்களிலும் வரும் אסף வினையின் ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: אַהֲרֹן אָחִיךָ
  choice: உன் சகோதரன் ஆரோன்
  rationale: நவீனத் தமிழில் இயல்பான சொல் வரிசையில் உறவுமுறையையும் பெயரையும் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: אסף אל־עמיו என்ற மரண மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: “உன் மக்களிடம் சேர்க்கப்படுவாய்” என்று மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: “இறப்பாய்” அல்லது “உன் மூதாதையரிடம் சேர்க்கப்படுவாய்”
  rationale: எபிரெய உரை வெறும் மரணத்தை மட்டும் கூறாமல், ஒருவருடைய மக்களுடன் சேர்க்கப்படுதல் என்ற குடும்ப மற்றும் உடன்படிக்கை சார்ந்த எதிரொலியுள்ள உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மறுமையைப் பற்றிய குறிப்பிட்ட கோட்பாட்டை உரைக்குள் திணிக்காமல் மூலத்தின் பொருள் நெருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. “சேர்க்கப்படுவாய்” என்ற இயல்பான இறப்புமரபுத்தொடர், எபிரெய உருவகத்தையும் ஆரோனுடன் செய்யப்படும் ஒப்புமையையும் காக்கிறது.
