base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: ta
  text: 'நீ இஸ்ரவேல் மக்களிடம்[a] இவ்வாறு சொல்ல வேண்டும்: ‘ஒருவன் இறந்து, அவனுக்கு மகன் இல்லாவிட்டால், அவனுடைய மரபுரிமைச் சொத்தை அவன் மகளுக்கு மாற்றிக் கொடுக்க வேண்டும்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “இஸ்ரவேலின் மகன்களிடம்”; இதை “இஸ்ரவேலர்கள்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடம்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் நிலையான இனக்குழுப் பெயராக வருவதால், இயல்பான நவீன தமிழில் ‘இஸ்ரவேலின் மக்கள்’ என வழங்கப்பட்டுள்ளது. சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: பேசிச் சொல்லவேண்டியது
  rationale: דבר + לאמר என்ற உரை அறிமுக மரபுத்தொடரின் இரு கூறுகளையும் காத்து, தமிழில் இயல்பான கட்டளை வடிவமாக வழங்குகிறது.
- source_word: אִישׁ כִּי יָמוּת
  choice: ஒருவன் இறந்துபோய்
  rationale: சட்ட வழக்கை அறிமுகப்படுத்தும் ஆண்பால் ஒருமை אִישׁ என்பதையும், நிபந்தனைச் சூழலைக் குறிக்கும் כִּי என்பதையும் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וּבֵן אֵין לוֹ
  choice: அவனுக்கு மகன் இல்லாவிட்டால்
  rationale: ‘அவனுக்கு மகன் இல்லை’ என்ற எபிரெய அமைப்பை இயல்பான தமிழ் நிபந்தனை வாக்கியமாக்கி, ஆண் வாரிசு இல்லாமையைத் துல்லியமாகக் காக்கிறது.
- source_word: וְהַעֲבַרְתֶּם
  choice: மாற்றிக் கொடுக்கவேண்டும்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் இங்கு சொத்துரிமையை மற்றொருவரிடம் சட்டரீதியாகச் செலுத்துவதைக் குறிக்கிறது; ‘மாற்றிக் கொடுக்க’ என்பது பெறுநரையும் சட்ட நடவடிக்கையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַחֲלָתוֹ
  choice: அவனுடைய உரிமைச்சொத்தை
  rationale: נַחֲלָה இங்கு பரம்பரையாகக் கிடைக்கும் நிலம் அல்லது சொத்துரிமையைக் குறிக்கிறது. ‘உரிமைச்சொத்து’ என்பது வெறும் தனிப்பட்ட உடைமையைக் காட்டிலும் வாரிசுரிமை சார்ந்த பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: לְבִתּוֹ
  choice: அவனுடைய மகளுக்கு
  rationale: לְ பெறுநரைக் குறிக்கிறது; தமிழில் ‘மகளுக்கு’ என்பது நேரடியான, இயல்பான இணை.
