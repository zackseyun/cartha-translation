source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “நூனின் மகன் யோசுவாவை எடுத்துக்கொள்; அவன் ஆவி உள்ள மனிதன்[a]. உன் கையை அவன்மேல் வை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “அவனுக்குள் ஆவி உள்ள மனிதன்.” இங்குள்ள “ஆவி” கடவுளின் ஆவியையோ, மனிதனின் உள்ளார்ந்த பண்பு அல்லது திறனையோ குறிக்கலாம்; எபிரெயில் அதைத் திட்டவட்டமாகக் குறிக்கும் உருபு இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவப்பெயரின் எபிரெய உச்சரிப்பை நவீனத் தமிழில் ஒலிபெயர்த்து, தனிப்பட்ட உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- source_word: קַח לְךָ
  choice: உன்னிடம் அழைத்துக்கொள்
  rationale: சொல்லுக்குச் சொல் ‘உனக்காக எடுத்துக்கொள்’ என்பது தமிழில் இச்சூழலில் இயல்பாக இல்லை; ஒருவரைத் தன் முன்னிலையில் கொண்டு வந்து நியமிப்பதற்கான கட்டளையை இச்சொற்றொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, எபிரெய உறவுநிலைத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ
  choice: மனிதன்
  rationale: மூலத்தில் ஆண்பால் ஒருமை என்றாலும், யோசுவா என்ற ஆண் நபர் ஏற்கெனவே தெளிவாக இருப்பதால், தமிழில் இயல்பான ‘மனிதன்’ மூலப்பொருளையும் பாலினக் குறிப்பையும் காக்கிறது.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: ஆவி உள்ள மனிதனாகிய
  rationale: எபிரெயில் ‘ஆவி’ என்பதற்கு சுட்டுரை இல்லை. ஆகவே அது கடவுளின் ஆவியைக் குறிக்கிறதா அல்லது மனிதனுக்குள்ள ஆவி/உள்ளார்ந்த திறனைக் குறிக்கிறதா என்பதை முதன்மை உரை தீர்மானிக்காமல் பாதுகாக்கிறது.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: உன் கையை அவன்மேல் வை
  rationale: கை ஒருமையில் இருப்பதைப் பாதுகாத்து, ஒருவர்மேல் கை வைக்கும் நியமனச் செயலைத் தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: רוּחַ என்பது கடவுளின் ஆவியைக் குறிக்கிறதா அல்லது பொதுவாக ஆவி/உள்ளார்ந்த பண்பைக் குறிக்கிறதா?
  choice: ஆவி
  alternative: கடவுளின் ஆவி / ஆவியானவர்
  rationale: எபிரெய மூலத்தில் சுட்டுரை இல்லாததால், ‘ஆவியானவர்’ என்று வெளிப்படையாகத் தீர்மானிப்பதைத் தவிர்த்து, மூலத்தின் உண்மையான தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உன்னிடம் அழைத்துக்கொள்’ என்பது எபிரெய கட்டளைத் தொடரின் நோக்கத்தை இயல்பாகத் தருகிறது; ‘ஆவி’ என்ற சொல் திட்டமிட்டு விளக்கத் தீர்மானமின்றி வைக்கப்பட்டுள்ளது.
