base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: ta
  text: அவன் ஆசாரியனாகிய எலெயாசாரின் முன்னிலையில் நிற்க வேண்டும். எலெயாசார் அவனுக்காக யாவேக்கு முன்பாக ஊரீமின் தீர்ப்பின்படி விசாரிக்க வேண்டும்.[a] அவருடைய கட்டளைப்படி அவனும், அவனோடு இஸ்ரவேல் மக்கள் அனைவரும்,[b] முழுச் சபையும் புறப்படுவார்கள்; அவருடைய கட்டளைப்படி வருவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊரீமின் முடிவைக் கொண்டு.” இது யாவேக்கு முன்பாக ஊரீமின் மூலம் ஆசாரியர் விசாரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; அதாவது, இஸ்ரவேலர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ஒருவருக்கு முன்பாக நின்று ஆணை அல்லது வழிகாட்டுதல் பெறும் உறவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יַעֲמֹד
  choice: நிற்க வேண்டும்
  rationale: இங்கு imperfect வடிவம் நியமனச் சூழலில் கட்டளை அல்லது கடமையைக் குறிக்கிறது.
- source_word: וְשָׁאַל לוֹ
  choice: அவனுக்காக ... விசாரிக்க வேண்டும்
  rationale: சூழலின்படி எலெயாசாரே வினைச்சொல்லின் எழுவாய்; அவர் யோசுவாவின் சார்பில் தேவனிடம் விசாரிப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: ஊரீமின் தீர்ப்பின்படி
  rationale: מִשְׁפָּט என்பதன் தீர்ப்பு அல்லது அதிகாரபூர்வ முடிவு என்ற நுணுக்கத்தைப் பேணுகிறது; ஊரீம் என்பது ஆசாரிய விசாரணைக்குரிய தொழில்நுட்பச் சொல் என்பதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַל פִּיו
  choice: அவருடைய கட்டளைப்படி
  rationale: ‘அவருடைய வாயின்படி’ என்ற எபிரெய மரபுத்தொடரின் அதிகாரபூர்வ வழிநடத்தல் என்னும் பொருளை இயல்பான தமிழில் தருகிறது; சுட்டுப்பெயரின் தொடர்பை விளக்கிச் சேர்க்காமல் விடுகிறது.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: புறப்படுவார்கள் ... திரும்பி வருவார்கள்
  rationale: சமூக அல்லது படை இயக்கத்தைக் குறிக்கும் எபிரெய இணைச்சொல்லைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக முழு இஸ்ரவேல் மக்களையும் குறிக்கும் அதன் வழக்குப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: உடன்படிக்கைச் சமூகமாகக் கூடியிருந்த மக்களைக் குறிக்கும் கூட்டுப் பொருளைத் தக்கவைத்து, ‘இஸ்ரவேலின் மக்கள் அனைவரும்’ என்பதுடன் தேவையற்ற சொற்பிரதியைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அவருடைய கட்டளைப்படி’ என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: ஒருமை மரியாதைச் சுட்டுப்பெயரான ‘அவருடைய’ என்று மொழிபெயர்த்து, யாரைக் குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் வைத்தல்
  alternative: அது எலெயாசாரை நேரடியாகக் குறிக்கிறது என்று வெளிப்படையாகச் சொல்லுதல்; அல்லது யோசுவாவின் கட்டளை என்று மொழிபெயர்த்தல்
  rationale: எபிரெய வாக்கியம் உடனடியான முன்னிலையைச் சுருக்கமாகவும் ஓரளவு தெளிவின்றியும் வைக்கிறது. ஆகவே ஊரீம் விசாரணையால் கிடைக்கும் அதிகாரபூர்வ வழிநடத்தல் என்ற தொடரைத் தக்கவைத்து, தெளிவின்மையைச் செயற்கையாக நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆசாரியச் சிறப்புச் சொல்லான ‘ஊரீம்’ ஒலிபெயர்க்கப்பட்டுள்ளது. கட்டளைத் தொனிக்காக ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது; சுட்டுப்பெயரின் மூலத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
