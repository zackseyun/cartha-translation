id: NUM.27.9
reference: Numbers 27:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם אֵ֥ין ל֖/וֹ בַּ֑ת וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/אֶחָי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: ta
  text: மேலும், அவனுக்கு மகள் இல்லையென்றால், அவனுடைய பரம்பரைச் சொத்தை அவனுடைய சகோதரர்களுக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: இல்லையென்றால்
  rationale: சட்ட விதிகளின் தொடரில் அடுத்த நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் முந்தைய வசனத்துடன் இயல்பாக இணையும் நிபந்தனைத் தொடர்.
- source_word: אֵין ל/וֹ
  choice: அவனுக்கு ... இல்லை
  rationale: எபிரெய இருப்பியல் அமைப்பின் இயல்பான தமிழ் வடிவம்; உடைமையின்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּת
  choice: மகள்
  rationale: எபிரெய ஒருமை பெயர்ச்சொல்லைத் துல்லியமாகப் பேணுகிறது.
- source_word: וּ/נְתַתֶּם
  choice: கொடுக்க வேண்டும்
  rationale: இரண்டாம் நபர் பன்மைக்குக் கொடுக்கப்பட்ட சட்டக் கட்டளையின் கட்டாயத் தன்மையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நிபந்தனையின் விளைவு வாக்கிய அமைப்பால் தெளிவாகிறது.
- source_word: נַחֲלָת/וֹ
  choice: அவனுடைய உரிமைச் சொத்து
  rationale: இச்சூழலில் பரம்பரை வழியாகக் கிடைக்கும் நிலம் அல்லது சொத்துரிமையைக் குறிக்கிறது; வெறும் பொதுவான சொத்து என்ற பொருளைவிட வாரிசுரிமை சார்ந்த கருத்தை வெளிப்படுத்துகிறது.
- source_word: לְ/אֶחָי/ו
  choice: அவனுடைய சகோதரர்களுக்கு
  rationale: எபிரெய ஆண்பால் பன்மையைப் பேணி, அடுத்த நிலை ஆண் வாரிசுகளாகிய சகோதரர்களைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட சட்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை அமைப்பும் கட்டாயமான வாரிசுரிமை விதியும் தெளிவாகப் பேணப்பட்டுள்ளன.
