  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: ta
  text: மனிதர்கள் அனைவரின் ஆவிகளின் தேவனாகிய யாவே[a], சபையின்மேல்[c] ஒரு மனிதனை நியமிப்பாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்கள் அனைவரின் ஆவிகளின் தேவனாகிய யாவே, சபையின்மேல் ஒரு மனிதனை நியமிப்பாராக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கூட்டத்தின்மேல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: நியமிப்பாராக
  rationale: פקד என்ற வினைச்சொல்லுக்குப் பல பொருள்கள் இருந்தாலும், ஒருவரை நேரடிப் பொருளாகக் கொண்டு ‘சபையின்மேல்’ என்ற தொடருடன் வருவதால், இங்கு தலைமைப் பொறுப்புக்கு ஒருவரை நியமித்தல் என்பதே பொருத்தமான பொருள். வேண்டுதல் தொனியை ‘நியமிப்பாராக’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: ஆவிகளுக்கும் தேவனாகிய
  rationale: רוּחוֹת என்பதன் இயல்பான பொருளான ‘ஆவிகள்’ தக்கவைக்கப்பட்டுள்ளது. மனிதர்களின் உள்உயிரும் தனித்தன்மையும் தேவனுடைய அறிவுக்கும் அதிகாரத்துக்கும் உட்பட்டவை என்பதைச் சுட்டும் தனிச்சிறப்பான தெய்வீகப் பட்டப்பெயரின் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְכָל בָּשָׂר
  choice: மாம்சமுள்ள அனைவரின்
  rationale: ‘எல்லா மாம்சமும்’ என்ற எபிரெய மரபுத்தொடர் இங்கு மரணத்திற்குட்பட்ட மனிதகுலத்தைக் குறிக்கிறது. தமிழில் புரியும்படி ‘மாம்சமுள்ள அனைவரின்’ என்று வழங்கி, மூல உருவகம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் உள்ளது; சூழலும் மோசேக்குப் பின் பொறுப்பேற்கும் ஓர் ஆண் தலைவரைக் குறிக்கிறது. எனவே பாலினக் குறிப்பை நடுநிலைப்படுத்தாமல் ‘ஒரு மனிதனை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הָעֵדָה
  choice: சபையின்மேல்
  rationale: עֵדָה என்பது இஸ்ரவேலின் ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபை’ அதன் ஒழுங்குபட்ட கூட்டு அடையாளத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கூட்டம்’ என்பது மாற்று மொழிபெயர்ப்பு.
theological_decisions:
- issue: வேண்டுதலில் வரும் தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே ... நியமிப்பாராக
  alternative: ஆண்டவர் ... நியமிப்பாராக
  rationale: மூலத்தில் יְהוָה என்ற தனிப்பெயர் உள்ளது. ஆகவே மரபான ‘ஆண்டவர்’ என்ற பட்டப்பெயரால் மாற்றாமல், தனிப்பெயரை ‘யாவே’ என்று தக்கவைத்துள்ளோம்; மாற்று மரபும் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- issue: אִישׁ என்பதிலுள்ள பாலினக் குறிப்பை வெளிப்படுத்தல்
  choice: ஒரு மனிதனை
  alternative: ஒருவரை
  rationale: சொல் ஆண்பால் ஒருமையிலும், சூழல் மோசேயின் ஆண் வாரிசான தலைவரைப் பற்றியதாகவும் இருப்பதால், மூலத்தின் பாலினக் குறிப்பு தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்குரிய கண்ணியமான தொனியுடன் வடிவமைக்கப்பட்டது. ‘ஆவிகள்’, ‘மாம்சமுள்ள அனைவரும்’ போன்ற மூலத்தின் தனித்துவமான வேதாகமச் சொற்கள் இயன்றவரை தக்கவைக்கப்பட்டு, புரிதலுக்குத் தேவையான விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
