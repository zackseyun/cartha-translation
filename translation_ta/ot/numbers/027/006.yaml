  text: 'அப்போது யாவே மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கூறியது
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் “அப்போது” அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: எபிரெய மொழியில் அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வடிவம். தமிழில் “என்று சொல்லி” என மீண்டும் கூறுவதைவிட, இரட்டைப்புள்ளி அதன் செயல்பாட்டை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுவான பட்டம் அல்ல, இறைவனுடைய தனிப்பெயரே உள்ளது; எனவே பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்த இறுதியில் இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
