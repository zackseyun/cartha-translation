translation:
  language: ta
  text: அவர்களுக்கு முன்பாகப் புறப்பட்டுச் செல்பவரும், அவர்களுக்கு முன்பாக உள்ளே வருபவரும், அவர்களை வெளியே நடத்திச் சென்று உள்ளே அழைத்து வருபவருமாக அவர் இருக்கட்டும். அப்பொழுது யாவேயின் மக்கள் கூட்டம்[c] மேய்ப்பன் இல்லாத ஆடுகளைப்போல் இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ‘யாவேயின் சபை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: …செல்பவரும் / …வருபவரும்
  rationale: முந்தைய வசனத்தில் வேண்டப்பட்ட தலைவரை விவரிக்கும் தொடர்புச் சொல். தமிழில் தொடர்ச்சியான பெயரெச்ச அமைப்புகள் இயல்பாக இருப்பதால், எபிரெயச் சொல்லின் ஒவ்வொரு நிகழ்வையும் தனியே மொழிபெயர்க்காமல் இந்த அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יֵצֵא לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகப் புறப்பட்டுச் செல்பவர்
  rationale: தலைவர் மக்களுக்கு முன்னால் செல்வதைச் சித்தரிக்கும் நேரடியான இயக்க மொழியைப் பாதுகாக்கிறது. לִפְנֵיהֶם என்பதன் இட மற்றும் தலைமை நுணுக்கங்கள் இரண்டும் ‘முன்பாக’ என்பதில் நிலைக்கின்றன.
- source_word: יָבֹא לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகத் திரும்பி வருபவர்
  rationale: בוא என்பது அடிப்படையில் ‘வருதல்/உள்ளே வருதல்.’ יצא உடன் அமைந்த எதிரிணையைத் தமிழில் தெளிவாக்க ‘திரும்பி வருதல்’ தேர்ந்தெடுக்கப்பட்டது; இது இயக்கத்தின் நிறைவை இயல்பாகக் காட்டுகிறது.
- source_word: יוֹצִיאֵם
  choice: அவர்களை வெளியே நடத்திச் சென்று
  rationale: יצא வினையின் காரணவினை வடிவம். வெறுமனே வெளியே கொண்டுபோவதைவிட, தலைவராக வழிநடத்தும் சூழலை ‘நடத்திச் சென்று’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְבִיאֵם
  choice: உள்ளே அழைத்து வருபவர்
  rationale: בוא வினையின் காரணவினை வடிவத்தைப் பாதுகாக்கிறது. ‘அழைத்து வருதல்’ தனிப்பட்ட வழிநடத்தலையும் இயல்பான தமிழ் நடையையும் தருகிறது.
- source_word: עֲדַת יְהוָה
  choice: யாவேயின் சபை
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ சுருக்கமாகவும் கண்ணியமாகவும் கூட்டுச் சமூகப் பொருளைத் தருகிறது; மாற்றாக ‘மக்கள் கூட்டம்’ என்பதும் சாத்தியம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כַּצֹּאן
  choice: ஆடுகளைப் போல
  rationale: எபிரெய ஒருமை கூட்டுப்பெயரைத் தமிழில் இயல்பான பன்மைக் கூட்டுப் பொருளாகக் கொடுத்து உவமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: רֹעֶה
  choice: மேய்ப்பன்
  rationale: மந்தையை மேய்த்து வழிநடத்துபவரைக் குறிக்கும் நேரடியான சொல்லைத் தேர்ந்தெடுத்து, பிற்காலச் சமயப் பதவிப் பொருளை இறக்குமதி செய்யாமல் தலைமை உவமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைத் தனிப்பெயரே உள்ளது. ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘புறப்பட்டுச் செல்… திரும்பி வா… வெளியே நடத்து… உள்ளே அழைத்து வா’ என்ற தலைமை மொழி
  choice: இயக்கத்தைச் சித்தரிக்கும் நான்கு கூறுகளையும் வைத்திருத்தல்
  alternative: ‘அவர்களை எல்லாவற்றிலும் வழிநடத்துபவர்’ என்று கருத்துரைத்துச் சுருக்குதல்
  rationale: எபிரெயம் முழுமையான பொது வழிநடத்தலைக் குறிக்கக் கூடிய இணை இயக்கச் சொற்களைப் பயன்படுத்தி, பின்னர் மேய்ப்பன் உவமைக்கு செல்கிறது. அவற்றைச் சுருக்காமல் வைத்திருப்பது இலக்கிய மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: וְלֹא תִהְיֶה என்பதன் தொடர்பு
  choice: ‘அப்போது … இருக்காது’ என்ற விளைவு/நோக்கத் தொடர்பு
  alternative: ‘மேலும் … இருக்காதிருப்பதாக’ என்ற வேண்டுதல்
  rationale: மோசேயின் வேண்டுதலின் சூழலில் இது தலைவர் நியமிக்கப்படுவதன் நோக்கம் அல்லது விளைவைக் காட்டுகிறது. எபிரெய இணைப்பின் பரப்பை மிகையாகக் குறுக்காமல், தமிழில் இயல்பாக ‘அப்போது’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இயக்கச் சித்திரமும் மேய்ப்பன் உவமையும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் வேண்டுதலைத் தொடர்வதால், தமிழில் இலக்கண முழுமைக்காக ‘அவர் இருக்கட்டும்’ சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் முன் வசனத்தில் உள்ள தலைவரை மீளச்சுட்டுகிறது.
