  register: நவீன நிலையான தமிழில், வேதாகமத்திற்குரிய கண்ணியத்தையும் சாதாரண வாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. ‘வைப்பாயாக’ மூலத்தின் அருளிப்பு உருவகத்தைப் பாதுகாக்கிறது; ‘மாட்சி’ என்ற தேர்வு அதிகாரம் என்று பொருளை முன்கூட்டியே குறுக்காமல் உண்மையான சொற்பொருள் விரிவை வைத்திருக்கிறது.
