    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: வைப்பாயாக
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், עַל (‘மேல்’) என்பதுடன் இங்கு பதவிப்பொறுப்பு அளிக்கப்படுவதைக் குறிப்பதால், ‘அவன்மேல் வைப்பாயாக’ என்பது மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: מֵהוֹדְךָ
  choice: உன் மாட்சியில் சிறிதை
  rationale: הוֹד என்பது மாட்சி, மகிமை, மேன்மை, கண்ணியம் ஆகிய பொருள்களைக் குறிக்கலாம். מִן முன்னொட்டு முழுவதையும் அல்ல, அதிலிருந்து ஒரு பங்கைச் சுட்டுவதால் ‘சிறிதை’ என மொழிபெயர்க்கப்பட்டது; ‘மாட்சி’ மூலச்சொல்லின் உருவகத் திறனை அதிகாரம் என்று மட்டும் சுருக்காமல் பாதுகாக்கிறது.
- source_word: עָלָיו
  choice: அவன்மேல்
  rationale: עַל மற்றும் ஆண்பால் ஒருமை பின்னொட்டின் நேரான மொழிபெயர்ப்பு; அருளப்பட்ட மாட்சி ஒருவர்மேல் வைக்கப்படும் உருவகத்தையும் காக்கிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: எபிரெயச் சொல் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் முந்தைய கட்டளையின் நோக்கமுடைய விளைவை இயல்பாகத் தொடர ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִשְׁמְעוּ
  choice: அவனுக்குக் கீழ்ப்படிவார்கள்
  rationale: שׁמע என்பது கேட்பது, செவிகொடுப்பது, கீழ்ப்படிவது ஆகிய அர்த்தங்களைக் கொண்டது. யோசுவாவுக்கு தலைமைப் பொறுப்பு அளிக்கப்படும் சூழலில், செவிகொடுத்துச் செயல்படுவதே நோக்கமாக இருப்பதால் ‘கீழ்ப்படிவார்கள்’ பொருத்தமானது.
- source_word: כָּל עֲדַת
  choice: சபையார் அனைவரும்
  rationale: עֵדָה இஸ்ரவேலின் கூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார் அனைவரும்’ என்பது மொத்த சமூகத்தையும் குறிக்கும் இயல்பான, மரியாதையான தமிழ் நடை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இந்தக் கூட்டுச் சொல் இங்கு இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது; மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மோசேயிடமிருந்து யோசுவாவுக்கு அளிக்கப்படும் הוֹד என்பதன் இயல்பு
  choice: ‘மாட்சி’ என்ற விரிந்த மூல உருவகம் பாதுகாக்கப்பட்டது; அதில் ஒரு பகுதியே யோசுவாவின்மேல் வைக்கப்படுகிறது.
  alternative: ‘அதிகாரம்’, ‘மேன்மை’ அல்லது ‘கண்ணியம்’ என்று மொழிபெயர்த்தல்.
  rationale: சூழல் பதவிசார் அதிகாரத்தைக் குறிப்பிட்டாலும், הוֹד அந்த ஒரே கருத்துக்கு மட்டுப்படாமல் மாட்சி, கண்ணியம், மேன்மை ஆகியவற்றையும் தாங்குகிறது. ஆகவே மூலத்தின் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் சுருக்காமல் ‘மாட்சி’ தேர்ந்தெடுக்கப்பட்டது.
- issue: יִשְׁמְעוּ என்பதன் வலிமை
  choice: ‘கீழ்ப்படிவார்கள்’
  alternative: ‘கேட்பார்கள்’ அல்லது ‘செவிகொடுப்பார்கள்’
  rationale: தலைமைப் பொறுப்பு அளிக்கும் இச்சூழலில் வெறும் ஒலி கேட்டலைவிட, சொல்வதைக் கேட்டு அதன்படி நடப்பதே கருத்து. எனினும் மூலச்சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
