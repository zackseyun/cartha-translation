lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... கூறியது
  rationale: வழக்கமான wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் ‘அப்போது’ தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. அடுத்துவரும் לֵאמֹר நேரடி உரையை அறிமுகப்படுத்துவதால், ‘கூறியது’ என்ற ஒருங்கிணைந்த சொற்றொடர் இயல்பான தமிழைத் தருகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள எபிரெயப் பெயரின் வடிவம்.
- source_word: אֶל
  choice: -விடம்
  rationale: இங்கு பேச்சு யாரை நோக்கிச் செல்கிறது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை இயல்பான தமிழ் வசனத் தொடக்கமாக வெளிப்படுத்துகிறது; அடுத்த வசனத்தில் உரை தொடர்வதை இரட்டைப்புள்ளி தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பொதுவாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது; ‘கர்த்தர்’ என்ற பட்டத்தால் பெயரை மாற்றவில்லை. எபிரெய உயிரெழுத்துப் பாரம்பரியத்தால் ஒலிப்பு முழுமையாக உறுதியாகாததால் அடிக்குறிப்பு தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இது அடுத்த வசனத்தில் தொடங்கும் மோசேயின் நேரடி உரைக்கான அறிமுகம் என்பதால் ‘கூறியது:’ பயன்படுத்தப்பட்டது.
