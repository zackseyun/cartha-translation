base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: ta
  text: “எங்கள் தந்தை வனாந்தரத்தில் இறந்தார். யாவேக்கு எதிராக ஒன்றுகூடியவர்களின் சபையில், அதாவது கோராவின் கூட்டத்தில், அவர் இருக்கவில்லை; மாறாக, அவர் தன்னுடைய பாவத்தினால் இறந்தார்[a]. அவருக்கு மகன்கள் இல்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன்னுடைய பாவத்தில் இறந்தார்” அல்லது “தன்னுடைய பாவத்தினிமித்தம் இறந்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அந்தப் பாவம் என்னவென்று குறிப்பிடவில்லை; அவர் கோராவின் கலகத்தில் பங்குபெற்று இறக்கவில்லை என்பதையே வேறுபடுத்திக் காட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: எங்கள் தந்தை
  rationale: மகள்கள் தங்கள் நேரடி தந்தையைப் பற்றிப் பேசுவதால், உறவுமுறையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலரின் வனாந்தரப் பயணப் பின்னணியைத் தக்கவைக்கும், வேதாகமச் சூழலில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים
  choice: ஒன்றுகூடிய ... கூட்டத்தாரில்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்/அவர்களுள்’ என்ற பொருளையும், עֵדָה மற்றும் נועד ஆகியவற்றின் குழு–ஒன்றுகூடல் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַל יְהוָה
  choice: யெகோவாவுக்கு எதிராக
  rationale: עַל இங்கு பகைமையான எதிர்ப்பைக் குறிக்கிறது; தெய்வீகப் பெயர் தமிழில் நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בַּעֲדַת קֹרַח
  choice: கோராகின் கூட்டத்தாரில்
  rationale: கோராகோடு தொடர்புடைய குறிப்பிட்ட கலகக் குழுவைச் சுட்டுகிறது.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: மாறாக, அவர் தமது சொந்தப் பாவத்தினால் இறந்தார்
  rationale: முந்தைய மறுப்புடன் உள்ள திருத்தும் முரண்பாட்டையும், בְ-இன் சாத்தியமான காரணப் பொருளையும் வெளிப்படுத்துகிறது; ‘சொந்த’ என்பது கோராகின் கூட்டுக் கலகத்திலிருந்து வேறுபடுத்துகிறது.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: அவருக்கு மகன்கள் இல்லை
  rationale: היה + לְ அமைப்பின் இயல்பான தமிழ்; வாரிசுரிமைச் சூழலுக்குத் தேவையான ‘மகன்கள்’ என்பதைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: எபிரெய மூலத்தில் பட்டமல்ல, நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பொதுவாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பெயர் பட்டமாக மாற்றப்படவில்லை.
- issue: தனிப்பட்ட பாவத்திற்கும் கோராகின் கூட்டுக் கலகத்திற்கும் இடையிலான வேறுபாடு
  choice: அவர் கோராகின் கூட்டத்தாரில் இல்லை; தமது சொந்தப் பாவத்தினால் இறந்தார்
  alternative: தமது பாவத்தில் இறந்தார்
  rationale: தந்தை கோராகின் கலகத்தில் பங்குபெறவில்லை என்ற மகள்களின் வாதத்தைத் தக்கவைக்கிறது; அதே நேரத்தில் அவரது குறிப்பிட்ட பாவம் என்னவென்று வசனம் கூறாததால் அதை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘வனாந்தரம்’ மற்றும் ‘யெகோவா’ ஆகியவை வேதாகமத் தமிழில் அறிமுகமானவையாக இருந்தாலும், வாக்கிய அமைப்பு இயல்பாகவும் நேரடியாகவும் வைக்கப்பட்டுள்ளது.
