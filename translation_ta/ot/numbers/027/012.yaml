base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “இந்த அபாரீம் மலைக்கு[a] ஏறிச் சென்று, நான் இஸ்ரவேலின் மகன்களுக்குக்[b] கொடுத்திருக்கிற நாட்டைப் பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அபாரீமின் இந்த மலை.” “அபாரீம் மலை” அல்லது “அபாரீம் மலைத்தொடரிலுள்ள இந்த மலை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலருக்கு” அல்லது “இஸ்ரவேல் மக்களுக்கு.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்களுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய வடிவத்தின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲלֵה
  choice: சென்று
  rationale: மலையை நோக்கிய மேலேறும் இயக்கம் தமிழில் ‘மலைக்குச் செல்’ என்ற தொடரில் இயல்பாகப் புரிகிறது; ‘ஏறு’ என்பதும் நேரடியான மாற்று.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: இந்த அபாரீம் மலைக்கு
  rationale: הַזֶּה என்பதன் சுட்டுப்பொருளையும், עֲבָרִים என்ற இடப்பெயரின் ஒலிபெயர்ப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּרְאֵה
  choice: பார்
  rationale: கட்டளை வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: வாக்குத்தத்தச் சூழலில் אֶרֶץ குறிக்கும் நிலப்பரப்பை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிற
  rationale: எபிரெய நிறைவுவினையின் முடிவுற்றதாயினும் தற்போதும் பொருந்தும் கொடையை வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: இது ஒரு மக்களினப் பெயராகச் செயல்படுவதால், தமிழில் உள்ளடங்கிய கூட்டுப்பொருளை இயல்பாகத் தருகிறது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட சமய மரபின் தனிச்சிறப்பைத் திணிப்பதைத் தவிர்க்கிறது.
- issue: לִבְנֵי יִשְׂרָאֵל என்ற மக்களினச் சொல்லாக்கம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: சூழலில் முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மூலத்தின் சொற்சார்ந்த வடிவத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. மூலத்தின் தொடர் கட்டளைகளும் தெய்வீகக் கொடை நிறைவேறியதுபோன்ற உறுதியும் பாதுகாக்கப்பட்டுள்ளன.
