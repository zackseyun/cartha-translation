revisions:
- from: அவனுடைய தந்தைக்குச் சகோதரர்கள் இல்லையென்றால், அவனுடைய பரம்பரைச் சொத்தை அவன் குலத்தில் அவனுக்கு மிக நெருங்கிய இரத்த உறவினருக்குக்[a] கொடுக்க வேண்டும்; அவர் அதை உரிமையாக்கிக்கொள்ள வேண்டும்.[b] யாவே மோசேக்குக் கட்டளையிட்டபடியே, இது இஸ்ரவேல் மக்களுக்கு[c] நீதித்தீர்ப்புக்குரிய சட்டமாக[d] இருக்க வேண்டும்.
  to: அவனுடைய தந்தைக்குச் சகோதரர்கள் இல்லையென்றால், அவனுடைய பரம்பரைச் சொத்தை அவனுடைய குலத்தைச் சேர்ந்த, அவனுக்கு மிக நெருங்கிய இரத்த உறவினருக்குக்[a] கொடுக்க வேண்டும்; அவன் அதை வாரிசுரிமையாகப் பெற வேண்டும்.[b] யாவே மோசேக்குக் கட்டளையிட்டபடியே, இது இஸ்ரவேல் மக்களுக்கு[c] நீதித்தீர்ப்பின் சட்டநியமமாக[d] இருக்க வேண்டும்.
  rationale: The revision retains the draft’s faithful inheritance terminology and its rendering of the divine name, while making the succession verb explicitly inheritancial, regularizing the pronoun, and improving the legal-register wording. All footnote anchors remain attached to the terms they explain.
