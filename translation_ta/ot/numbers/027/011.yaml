base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: ta
  text: அவனுடைய தந்தைக்குச் சகோதரர்கள் இல்லையென்றால், அவனுடைய பரம்பரைச் சொத்தை அவனுடைய குலத்தைச் சேர்ந்த, அவனுக்கு மிக நெருங்கிய இரத்த உறவினருக்குக்[a] கொடுக்க வேண்டும்; அவன் அதை வாரிசுரிமையாகப் பெற வேண்டும்.[b] யாவே மோசேக்குக் கட்டளையிட்டபடியே, இது இஸ்ரவேல் மக்களுக்கு[c] நீதித்தீர்ப்பின் சட்டநியமமாக[d] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், ‘அவனுடைய இரத்த உறவினர், அவனுக்கு மிக நெருங்கியவர்’ என்று இரண்டு உறவுக் குறிப்புகள் இணைந்து வருகின்றன.
    reason: lexical_clarification
  - marker: b
    text: அல்லது, ‘அவன் அதை உடைமையாகப் பெற வேண்டும்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘இஸ்ரவேலின் மகன்களுக்கு’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைப் பெயர்.
    reason: cultural_note
  - marker: d
    text: அல்லது, ‘நீதித்தீர்ப்புக்குரிய சட்டமாக’ அல்லது ‘சட்ட நியமமாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: சகோதரர்கள்
  rationale: தந்தையின் உடன்பிறந்த ஆண்களைச் சுட்டும் பரம்பரை உரிமை வரிசை இங்கு கூறப்படுவதால், எபிரெயச் சொல்லின் இயல்பான குடும்பப் பொருள் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: לְאָבִיו
  choice: அவனுடைய தந்தைக்கு
  rationale: தந்தையின் சகோதரர்கள் இருக்கிறார்களா என்பதே சட்டரீதியான கருத்து; தமிழில் இயல்பாக ‘அவனுடைய தந்தைக்குச் சகோதரர்கள்’ என்று அமைக்கப்பட்டுள்ளது.
- source_word: נַחֲלָתוֹ
  choice: அவனுடைய பரம்பரைச் சொத்து
  rationale: இப்பகுதி சொத்தின் வாரிசுரிமையைப் பற்றியது. ‘பரம்பரைச் சொத்து’ என்பது நவீன தமிழில் சட்டப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: அவனுக்கு மிக நெருங்கிய இரத்த உறவினர்
  rationale: שְׁאֵר என்பது இரத்த உறவைக் குறிக்கிறது; הַקָּרֹב אֵלָיו அந்த உறவினர்களுள் உறவுமுறையில் மிக நெருங்கியவரை வரையறுக்கிறது. இரண்டு கூறுகளும் மொழிபெயர்ப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: அவன் குலத்தில்
  rationale: מִשְׁפָּחָה இங்கு தனிக்குடும்பத்தைவிட விரிவான இஸ்ரவேலிய உறவுக் குழுவைக் குறிக்கிறது; ஆகவே ‘குலம்’ பொருத்தமானது.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: அவர் அதை உரிமையாக்கிக்கொள்ள வேண்டும்
  rationale: ירשׁ என்பதன் ‘வாரிசாகப் பெறுதல்/உடைமையாக்குதல்’ என்ற சட்ட விளைவை இது தெரிவிக்கிறது; முந்தைய ‘பரம்பரைச் சொத்து’ என்பதைக் காரணமின்றி மீண்டும் கூறுவதையும் தவிர்க்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: בְנֵי יִשְׂרָאֵל என்பது உடன்படிக்கை மக்களைக் குறிக்கும் நிலையான தேசியப் பெயர். தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்பது பாலின வரம்பைத் தவறாக உருவாக்காமல் அதன் சமூகப் பொருளை இயல்பாகத் தருகிறது; சொல்லடிப் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: நீதித்தீர்ப்புக்குரிய சட்டம்
  rationale: חֻקָּה என்பதன் கட்டுப்படுத்தும் சட்டத்தன்மையையும் מִשְׁפָּט என்பதன் நீதித்தீர்ப்பு/சட்டத் தீர்மானப் பொருளையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தெய்வீகத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לִבְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை-தேசியச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்தச் சூழலில் இந்தச் சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமுதாயத்திற்கான சட்டத்தைச் சுட்டுகிறது. இயல்பான தமிழில் அதன் தேசியப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொல்லடிப் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְיָרַשׁ אֹתָהּ என்பதிலுள்ள வாரிசுரிமை மற்றும் உடைமைப் பொருள்
  choice: அதை உரிமையாக்கிக்கொள்ள வேண்டும்
  alternative: அதைச் சுதந்தரித்துக்கொள்ள வேண்டும்
  rationale: வினைச்சொல் வாரிசாகப் பெறுதல் அல்லது உடைமையாக்குதல் ஆகிய இரு நெருங்கிய பொருள்களையும் ஏற்கிறது. முன் வாக்கியத்தில் சொத்து மாற்றம் ஏற்கெனவே கூறப்பட்டுள்ளதால், அதன் சட்ட விளைவை முதன்மை மொழிபெயர்ப்பு காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவியல் தன்மையைத் தக்கவைத்த dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரம்பரைச் சொத்து’, ‘இரத்த உறவினர்’, ‘உரிமையாக்கிக்கொள்ளுதல்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரெயச் சட்டச் சொற்றொடரின் கூறுகள் அடிக்குறிப்புகளால் தெளிவுபடுத்தப்பட்டுள்ளன.
