  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: ta
  text: செலொப்பெகாதின் மகள்கள் கூறுவது சரியே[a]. அவர்களுடைய தந்தையின் சகோதரர்களின் நடுவே, மரபுரிமையாக ஒரு நில உடைமையை நீ அவர்களுக்குக் கண்டிப்பாகக் கொடுக்க வேண்டும்[b]; அவர்களுடைய தந்தையின் மரபுரிமையை அவர்களுக்கு மாற்றிக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “செலொப்பெகாதின் மகள்கள் சரியாகப் பேசுகிறார்கள்.” நீதித் தீர்ப்பின் பொருளை இயல்பான தமிழில் “கூறுவது சரியே” என்று மொழிபெயர்த்துள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இவ்விடத்தில் “அவர்களுக்கு” என்பதற்கான எபிரெயப் பின்னொட்டு ஆண்பால் பன்மை வடிவில் உள்ளது; ஆனால் சூழலில் அது செலொப்பெகாதின் மகள்களையே குறிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: சொல்வது சரியே
  rationale: நீதித் தீர்ப்பின் சூழலில் மகள்களின் கோரிக்கை சரியானது என்பதை உறுதிப்படுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָתֹן תִּתֵּן
  choice: கண்டிப்பாகக் கொடுக்க வேண்டும்
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்ச வடிவம் கட்டளையை வலியுறுத்துகிறது; இத்தமிழாக்கம் அதன் கட்டாயத்தையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: பரம்பரைச் சொத்தாக ஒரு உடைமை
  rationale: நிலையான உடைமை மற்றும் வழிவழியாகக் கிடைக்கும் உரிமை ஆகிய இரு கருத்துகளையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: அவர்களுடைய தந்தையின் சகோதரர்கள் நடுவே
  rationale: தந்தைவழிக் குலத்தாருக்குள் மகள்களின் பங்கு அமைய வேண்டும் என்ற இடத்தையும் உறவையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: וְהַעֲבַרְתָּ
  choice: மாற்றிக் கொடுக்க வேண்டும்
  rationale: உரிமைப்பங்கை ஒருவரிடமிருந்து மற்றொருவருக்குச் சட்டரீதியாக மாற்றும் Hiphil வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: அவர்களுடைய தந்தையின் உரிமைப்பங்கு
  rationale: இறந்த தந்தைக்குரிய குலநிலப் பங்கைச் சுட்டுவதால், பொதுவான ‘சுதந்தரம்’ என்பதைக் காட்டிலும் ‘உரிமைப்பங்கு’ இச்சூழலில் தெளிவானது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெய வடிவம் ஆண்பால் பன்மை பின்னொட்டைக் கொண்டிருந்தாலும், சூழலில் சுட்டப்படுவோர் செலொப்பெகாதின் மகள்களே; தமிழ் பால்வேறுபாடு காட்டாததால் இயல்பாக அவர்களையே குறிக்கிறது.
