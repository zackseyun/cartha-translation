translation_notes:
  register: நவீனத் தரத் தமிழில் dignified சட்ட மற்றும் குடும்பச் சொத்துரிமைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘சொல்வது சரியே’ என்பது நீதித் தீர்ப்பின் தொனியை இயல்பாகக் காக்கிறது; ‘உரிமைப்பங்கு’ என்பது נַחֲלָה என்பதன் குலநிலப் பங்கு சார்ந்த பொருளைத் தெளிவுபடுத்துகிறது.
