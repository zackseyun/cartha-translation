    issue: ‘அதைக் கேட்டும்’ uses a concessive connective.
    rationale: 'The Hebrew waw-qatal participates in the condition inherited from the context: if her husband hears, remains silent, and does not annul, the obligations stand. Tamil ‘-உம்’ normally introduces concession, potentially suggesting ‘even though he hears.’ ‘கேட்டு’ accurately expresses the sequential elements within the conditional clause.'
