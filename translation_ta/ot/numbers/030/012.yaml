id: NUM.30.12
reference: Numbers 30:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: ta
  text: அவளுடைய கணவன் அதைக் கேட்டு, அவளிடம் எதுவும் சொல்லாமல், அவளுடைய நேர்த்திக்கடனை ரத்துசெய்யாமல் இருந்தால், அவளுடைய எல்லா நேர்த்திக்கடன்களும் நிலைத்திருக்கும்; அவள் தன்மீது ஏற்றுக்கொண்ட ஒவ்வொரு கட்டுப்பாடும் நிலைத்திருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַע
  choice: அதைக் கேட்டும்
  rationale: சுற்றியுள்ள நிபந்தனைச் சட்டநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இது வெறும் கடந்தகால நிகழ்வாக அல்ல, ஒரு சட்டச் சூழலாகப் புரியப்படுகிறது.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: இச்சட்டச் சூழலில் אִישָׁהּ என்பது பொதுவாக ‘அவளுடைய ஆண்’ அல்ல, திருமணமான பெண்ணின் கணவனைக் குறிக்கிறது.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: அவளிடம் எதுவும் சொல்லாமல்
  rationale: பதிலளிக்காமல் மௌனமாக இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: அவளுடைய நேர்த்திக்கடனை ரத்துசெய்யாமல்
  rationale: எபிரெயத்தில் நேரடி பொருள் ‘அவளை’ என்றாலும், இவ்வதிகாரத்தில் வினை அவளுடைய நேர்த்திக்கடன் அல்லது கட்டுப்பாட்டின் செல்லுபடியை நீக்குவதைக் குறிக்கிறது; தமிழில் தவறாகப் புரியாதபடி மறைபொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְקָמוּ
  choice: நிலைத்திருக்கும்
  rationale: சட்டரீதியாகத் தொடர்ந்து செல்லுபடியாக இருப்பதைக் குறிக்கும் קום என்பதன் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל נְדָרֶיהָ
  choice: அவளுடைய எல்லா நேர்த்திக்கடன்களும்
  rationale: נדר என்பதற்கு வழக்கமான வேதாகமத் தமிழ் சொல்லான ‘நேர்த்திக்கடன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל אִסָּר
  choice: ஒவ்வொரு கட்டுப்பாடும்
  rationale: אִסָּר என்பது ஒருவர் தன்மீது விதித்துக்கொள்ளும் கட்டுப்படுத்தும் பிணைப்பைக் குறிக்கிறது; ‘கட்டுப்பாடு’ நவீன வாசகருக்கு தெளிவாகவும் மூலத்தின் தடுப்புப் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: அவள் தன்மீது ஏற்றுக்கொண்ட
  rationale: சொல்லாட்சியிலுள்ள ‘தன் உயிரின்மேல் கட்டுதல்’ என்ற உருவகத்தைத் தமிழில் இயல்பாக, தானே பொறுப்பேற்ற கட்டுப்பாடாக வெளிப்படுத்துகிறது.
- source_word: יָקוּם
  choice: நிலைத்திருக்கும்
  rationale: முதல் சட்டத் தீர்ப்புடன் உள்ள இணைநிலையைப் பாதுகாத்து, அந்தக் கட்டுப்பாடு செல்லுபடியாகத் தொடரும் என்பதைத் தெரிவிக்கிறது.
