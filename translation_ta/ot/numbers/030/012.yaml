  register: நவீன நிலையான தமிழ்; சட்டநடையின் கண்ணியமும் தெளிவும் காக்கப்பட்டுள்ளன. ‘ரத்துசெய்’ என்பது பொதுவாகப் புரியும் சட்டச் சொல்; ‘நிலைத்திருக்கும்’ மூலத்தின் இருமுறை வரும் இணைநிலையைப் பாதுகாக்கிறது.
