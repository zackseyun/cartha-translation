source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: ta
  text: 'பின்பு மோசே இஸ்ரவேல் மகன்களின் கோத்திரத் தலைவர்களிடம்[a] கூறினார்: “யாவே கட்டளையிட்ட வார்த்தை இதுதான்:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயல்பான வழக்கில், “இஸ்ரவேலர்களின் கோத்திரத் தலைவர்களிடம்.” எபிரெயத்தில், “இஸ்ரவேல் மகன்களின்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இயல்பான வழக்கில், “யாவே கட்டளையிட்டது இதுதான்.” எபிரெயத்தில், “யாவே கட்டளையிட்ட வார்த்தை இதுதான்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு … கூறினார்
  rationale: வாவ் தொடர்ச்சியின் கதை முன்னேற்றும் தன்மையை ‘பின்பு’ வெளிப்படுத்துகிறது; ‘கூறினார்’ என்பது நவீனத் தமிழில் இயல்பானதும் நேரடி உரையை அறிமுகப்படுத்த ஏற்றதுமாகும்.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: கோத்திரத் தலைவர்கள்
  rationale: רָאשֵׁי என்பதன் தலைமைப் பொருளையும், இச்சூழலில் מַטּוֹת குறிக்கும் இஸ்ரவேலின் கோத்திரப் பிரிவுகளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்களின்
  rationale: எபிரெய மூலத்தின் குடும்ப மற்றும் உடன்படிக்கைச் சொற்றொடரான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைப் பாதுகாக்கிறது; ‘இஸ்ரவேலர்கள்’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֵאמֹר
  choice: கூறினார்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வடிவத்தின் செயல்பாட்டைத் தமிழில் தேவையற்ற மறுபதிப்பு இல்லாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶה הַדָּבָר
  choice: வார்த்தை இதுதான்
  rationale: דָּבָר என்பதன் ‘வார்த்தை/செய்தி/காரியம்’ என்ற பொருள் வீச்சில், இங்கு அதிகாரபூர்வமான இறைக் கூற்றை அறிமுகப்படுத்தும் ‘வார்த்தை’ என்ற வடிவம் மூலத்துக்கு நெருக்கமானது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முடிவுற்ற இறைக் கட்டளையை இப்போது மோசே எடுத்துரைப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே பெயரை ஒலிபெயர்த்து அதன் தனித்தன்மை பாதுகாக்கப்படுகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேல் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்ப உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது; பொதுமக்களைக் குறிக்கும் இயல்பான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: זֶה הַדָּבָר என்பதிலுள்ள דָּבָר சொல்லின் பொருள் வீச்சு
  choice: வார்த்தை இதுதான்
  alternative: கட்டளையிட்டது இதுதான்
  rationale: இறை அதிகாரத்தைத் தெளிவுபடுத்திக்கொண்டே, ‘வார்த்தை’ மற்றும் ‘காரியம்/செய்தி’ ஆகியவற்றுக்கிடையிலான மூலமொழியின் பொருள் வீச்சை அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம்’ வேதாகமச் சமூக அமைப்பைத் துல்லியமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மகன்கள்’ மற்றும் ‘வார்த்தை’ ஆகிய மூலத்துக்கு நெருக்கமான வடிவங்கள் முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான தமிழ்மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
