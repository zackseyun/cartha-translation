base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: ta
  text: ஆனால் அவளுடைய கணவன் அவற்றைக் கேட்ட நாளிலேயே அவற்றை உறுதியாக ரத்துசெய்தால், அவளுடைய உதடுகளிலிருந்து வெளிப்பட்ட எதுவும்—அவளுடைய நேர்த்திக்கடன்களோ, தன்மீது தானே விதித்த கட்டுப்பாட்டுக் கடப்பாடோ[a]—செல்லுபடியாகாது. அவளுடைய கணவன் அவற்றை ரத்துசெய்துவிட்டான்; யெகோவா[b] அவளை மன்னிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்மீது தானே விதித்த பிணைப்புக் கடப்பாடு.” எபிரெயச் சொற்றொடர் ஒருவர் தம்மீது தாமே விதித்த பிணைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH என்ற இறைப்பெயர்.
    reason: divine_name
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்தால்
  rationale: முந்தைய சட்ட நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָפֵר יָפֵר
  choice: உறுதியாக ரத்துசெய்தால்
  rationale: வினையெச்ச முழுமையும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: அதைக் கேட்ட நாளிலேயே
  rationale: சட்டரீதியாக முக்கியமான அதே நாளைக் குறிக்கும் கால வரம்பைப் பாதுகாக்கிறது.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: அவளுடைய உதடுகளிலிருந்து வெளிப்பட்ட எதுவும்
  rationale: ‘அவளுடைய உதடுகளின் எல்லா வெளிப்பாடும்’ என்ற சட்டச் சொற்றொடரின் பரப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לִנְדָרֶיהָ
  choice: அவளுடைய நேர்த்திக்கடன்கள்
  rationale: נדר என்பதற்கான வழக்கமான சமய-சட்டத் தமிழ் சொல்.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: தன்னையே கட்டுப்படுத்திக்கொண்ட கடப்பாடு
  rationale: தன்மீது தானே விதித்த கட்டுப்பாடு அல்லது பிணைப்பை வெளிப்படுத்துகிறது; அதன் துல்லிய நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא יָקוּם
  choice: செல்லுபடியாகாது
  rationale: உறுதிமொழி நடைமுறையில் நிலைத்திருக்காது என்ற சட்டப் பொருளை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: אִישָׁהּ הֲפֵרָם
  choice: அவளுடைய கணவன் அவற்றை ரத்துசெய்துவிட்டான்
  rationale: கணவனின் முடிவான செயலும் அதன் தொடரும் சட்ட விளைவும் பாதுகாக்கப்படுகின்றன.
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: எபிரெய நான்கெழுத்து இறைப்பெயரான YHWH-ஐ தனிப்பட்ட பெயராக ஒலிபெயர்க்கிறது.
- source_word: יִסְלַח לָהּ
  choice: அவளை மன்னிப்பார்
  rationale: סלח என்பதன் நேரடியான உடன்படிக்கை மற்றும் சட்டப் பொருளைத் தருகிறது.
theological_decisions:
- issue: ரத்துசெய்யப்பட்ட நேர்த்திக்கடனைத் தொடர்ந்து வரும் தெய்வீக மன்னிப்பு
  choice: ரத்துசெய்தல், கடப்பாடு செல்லுபடியாகாமை, பின்னர் யெகோவாவின் மன்னிப்பு என்ற வசனத்தின் வரிசை அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: மன்னிப்பு அவள் அவசரமாக நேர்த்திக்கடன் செய்ததற்கானது என்று குறிப்பாக விளக்குதல்; அல்லது இவ்வாக்கியத்தை வெறும் சட்ட வாய்பாடாகக் கருதுதல்.
  rationale: மன்னிப்பு எதற்காகத் தேவைப்படுகிறது என்பதை மூலவசனம் முழுமையாக விளக்கவில்லை. ஆகவே சட்ட-இறையியல் தொடர்பைப் பாதுகாத்து, அதன் காரணத்தை மொழிபெயர்ப்பில் கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ரத்துசெய்தல்’, ‘செல்லுபடியாகாது’, ‘கடப்பாடு’ ஆகிய சொற்கள் சட்டத் தொடர்பைத் தெளிவாக்குகின்றன; மூலத்தின் உருவகமான ‘உதடுகளிலிருந்து வெளிப்பட்ட’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
