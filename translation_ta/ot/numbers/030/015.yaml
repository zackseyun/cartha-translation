base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: ta
  text: ஆனால், அவளுடைய கணவன் நாளுக்கு நாள் அவளிடம் மௌனமாகவே இருந்தால், அவளுடைய எல்லா நேர்த்திக்கடன்களையோ அவள்மேல் உள்ள எல்லாக் கட்டுப்பாடுகளையோ[a] அவன் உறுதிப்படுத்துகிறான்; அவன் அதைக் கேட்ட நாளில் அவளிடம் மௌனமாக இருந்ததால், அவற்றை உறுதிப்படுத்திவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளைக் கட்டுப்படுத்தும் எல்லா உறுதிமொழிகளையும்.’ எபிரெயச் சொல், இவ்வகை உறுதிமொழிகள் அவற்றைச் செய்பவரைக் கட்டுப்படுத்துவதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: மௌனமாகவே இருந்தால்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த அமைப்பு மௌனமாக இருப்பதை வலியுறுத்துகிறது. ‘மௌனமாகவே’ என்பது சட்டரீதியாக எதிர்ப்பு தெரிவிக்காமல் இருந்ததையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: இந்தத் திருமணச் சட்டச் சூழலில் אִישָׁהּ என்பதன் இயல்பான பொருள் ‘அவளுடைய கணவன்’.
- source_word: מִיּוֹם אֶל יוֹם
  choice: நாளுக்கு நாள்
  rationale: தொடர்ச்சியான நாட்களில் மௌனமாக இருந்ததை எபிரெயச் சொற்றொடருக்கு நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהֵקִים
  choice: அவன் உறுதிப்படுத்துகிறான்
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் இங்கு நேர்த்திக்கடனையோ கட்டுப்பாட்டையோ செல்லுபடியாக நிலைநிறுத்தும் சட்டப் பொருளைக் கொண்டுள்ளது.
- source_word: נְדָרֶיהָ
  choice: அவளுடைய எல்லா நேர்த்திக்கடன்கள்
  rationale: நדר என்பதற்குச் சமய மற்றும் சட்டச் சூழல்களில் நிலைபெற்ற தமிழ்ச் சொல் ‘நேர்த்திக்கடன்’.
- source_word: אֱסָרֶיהָ
  choice: அவளுடைய எல்லாக் கட்டுப்பாடுகள்
  rationale: אסר (‘கட்டு’) என்பதிலிருந்து வந்த இச்சொல், ஒருவர்மீது பிணைப்பை ஏற்படுத்தும் உறுதிமொழிகளைச் சுட்டுகிறது. ‘கட்டுப்பாடுகள்’ மூல உருவகத்தையும் சட்ட வலிமையையும் காக்கிறது.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: அவள்மேல் உள்ள
  rationale: கடமைகள் அவள்மேல் இருப்பதாகக் கூறும் எபிரெய உருவகத்தையும் சட்டப் பொருளையும் காக்கிறது.
- source_word: הֵקִים אֹתָם
  choice: அவற்றை உறுதிப்படுத்திவிட்டான்
  rationale: கணவனின் முந்தைய மௌனத்தால் ஏற்பட்டுத் தொடரும் சட்ட விளைவை ‘உறுதிப்படுத்திவிட்டான்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: இருந்ததால்
  rationale: மௌனம் ஏன் உறுதிப்படுத்தலாகக் கருதப்படுகிறது என்பதை விளக்கும் காரண உறவைத் தெரிவிக்கிறது.
- source_word: הֶחֱרִשׁ לָהּ
  choice: அவளிடம் மௌனமாக இருந்ததால்
  rationale: ‘அவளிடம்/அவளை நோக்கி மௌனமாக இருத்தல்’ என்ற கருத்தையும் இவ்வதிகாரத்தில் திரும்ப வரும் சட்டரீதியான மௌனத்தையும் காக்கிறது.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: அவன் அதைக் கேட்ட நாளில்
  rationale: எபிரெய காலக் குறிப்பை நெருக்கமாகப் பின்பற்றி, இந்த அதிகாரத்தில் முக்கியமான அதே நாளின் சட்டக் காலவரம்பைத் தெளிவாக்குகிறது.
