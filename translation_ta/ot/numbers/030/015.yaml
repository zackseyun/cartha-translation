translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘மௌனமாகவே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘உறுதிப்படுத்துகிறான்’ மற்றும் ‘உறுதிப்படுத்திவிட்டான்’ ஆகியவை நிகழும் சட்ட விளைவையும் அதன் நிலைத்த முடிவையும் வேறுபடுத்துகின்றன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘கட்டுப்பாடுகள்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
