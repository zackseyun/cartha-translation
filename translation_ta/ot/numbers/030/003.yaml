base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: ta
  text: ஒருவன் யாவேக்கு ஒரு நேர்த்திக்கடன் செய்வதாக வாக்குக் கொடுத்தாலோ, அல்லது தன் மீது ஒரு கடப்பாட்டை ஏற்றிக்கொள்ளச் சத்தியம் செய்தாலோ[a], அவன் தன் வார்த்தையை மீறக் கூடாது[b]; அவன் வாயிலிருந்து வெளிவந்த அனைத்தின்படியும் அவன் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தன் மீது ஒரு பிணைக்கும் கடப்பாட்டைக் கட்ட.’'
    reason: மூல எபிரெயச் சொற்றொடரின் தன் மீது கடப்பாட்டைப் பிணைத்துக்கொள்வது என்ற உருவகத்தையும் வலியுறுத்தலையும் காட்டுகிறது.
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவன் தன் வார்த்தையைப் புனிதமற்றதாக்கக் கூடாது.’'
    reason: חלל என்ற வினையின் அடிப்படைப் புனிதத்தன்மை சார்ந்த நுண்பொருளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: ஆண்பால் ஒருமையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பான சட்டநடை வடிவமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: …கொடுத்தாலோ
  rationale: சட்டரீதியான நிபந்தனையைத் தமிழின் இயல்பான ‘-ஆல்’ அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: יִדֹּר נֶדֶר
  choice: ஒரு நேர்த்திக்கடன் செய்வதாக வாக்குக் கொடுத்தால்
  rationale: ஒரே வேர்ச்சொல்லைக் கொண்ட எபிரெய வினை–பெயர் இணைப்பின் வலிமையை, தமிழில் இயல்பாகவும் சமயச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருநான்கெழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: சத்தியம் செய்தால்
  rationale: எபிரெய cognate construction-ஐ இயல்பான நவீனத் தமிழில் அதன் solemn force உடன் வழங்குகிறது.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: தன்னையே ஒரு கடப்பாட்டால் கட்டுப்படுத்திக்கொள்ள
  rationale: தனக்குத்தானே விதித்துக்கொள்ளும் கட்டுப்பாடு அல்லது கடப்பாடு என்ற சட்டப் பொருளைக் காக்கிறது; மூலத்தின் ‘கட்டுதல்’ உருவகத்தையும் ‘கட்டுப்படுத்திக்கொள்ள’ என்பதில் தக்கவைக்கிறது.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: அவன் தன் வார்த்தையை மீறக் கூடாது
  rationale: חלל என்பதன் அடிப்படை ‘புனிதத்தைக் கெடுத்தல்’ பொருள் இங்கு ஒருவரின் சொல்லை மீறுதல் என்ற நடைமுறைப் பொருளில் வருகிறது; தெளிவான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו
  choice: அவன் வாயிலிருந்து வெளிவந்த அனைத்தின்படியும்
  rationale: வாயிலிருந்து வார்த்தைகள் வெளிவருகின்றன என்ற மூல எபிரெய உருவகத்தையும் சட்டநடையின் செறிவையும் தக்கவைக்கிறது.
- source_word: יַעֲשֶׂה
  choice: அவன் செய்ய வேண்டும்
  rationale: சட்டரீதியான கட்டாயத்தை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, இறைவனின் தனிப்பெயரான திருநான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: לֹא יַחֵל דְּבָרוֹ என்பதில் புனிதத்தன்மை சார்ந்த நுண்பொருள்
  choice: தன் வார்த்தையை மீறக் கூடாது
  alternative: தன் வார்த்தையைத் தீட்டுப்படுத்தக் கூடாது
  rationale: சூழலில் வாக்குறுதியை நிறைவேற்றாமல் மீறுவது முதன்மைப் பொருள். இருப்பினும் חלל என்பதன் ‘புனிதத்தைக் கெடுத்தல்’ சார்ந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டநடைக்குரிய கண்ணியமும் தெளிவும் காக்கப்பட்டுள்ளன. பழமையான ‘பொருத்தனை பண்ணுதல்’ போன்ற நடைகள் தவிர்க்கப்பட்டு, பொதுவாசகருக்குப் புரியும் ‘நேர்த்திக்கடன் செய்வதாக வாக்குக் கொடுத்தல்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் வாய், கட்டுதல், வார்த்தையைப் புனிதமற்றதாக்குதல் ஆகிய உருவகங்கள் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
