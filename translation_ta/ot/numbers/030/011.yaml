revisions:
- from: அவள் தன் கணவனுடைய வீட்டில் இருக்கும்போது ஒரு நேர்த்திக்கடன் செய்திருந்தாலோ, அல்லது ஆணையிட்டுத் தன்னையே ஒரு கட்டுப்பாட்டுக்கு உட்படுத்தியிருந்தாலோ,[a]
  to: மேலும், அவள் தன் கணவனின் வீட்டில் ஒரு நேர்ச்சை செய்திருந்தால், அல்லது சத்தியம் செய்து தன் மீது ஒரு கட்டுப்பாட்டை ஏற்றியிருந்தால்,[a]
  rationale: “ஆணையிட்டு” என்பதற்குப் பதிலாக “சத்தியம் செய்து” என மாற்றி, சத்தியம்/ஆணை என்ற எபிரெயச் சொல்லின் பொருளைத் துல்லியமாக்கினேன். நிபந்தனைச் சட்ட நடையைத் தெளிவாக்க -ஆலோ வடிவங்கள் -ஆல் வடிவங்களாக மாற்றப்பட்டன. மற்றபடி, கணவனின் வீட்டில் இருப்பது, நேர்ச்சை, மற்றும் சுயமாக ஏற்றுக்கொள்ளும் கட்டுப்பாடு ஆகிய அடிப்படை வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன.
