translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தன்மையைப் பேணும் வகையில் செம்மையாகவும் பொதுவாசகர்களுக்குப் புரியுமாறும் வடிவமைக்கப்பட்டது. ‘நேர்த்திக்கடன்’ வழிபாட்டு உறுதிமொழியையும், ‘கட்டுப்பாடு’ சுயமாக ஏற்றுக்கொண்ட பிணைப்பையும் வேறுபடுத்துகிறது.
