source:
  edition: WLC
  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: ta
  text: மேலும், அவள் தன் கணவனின் வீட்டில் ஒரு நேர்ச்சை செய்திருந்தால், அல்லது சத்தியம் செய்து தன் மீது ஒரு கட்டுப்பாட்டை ஏற்றியிருந்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: “சத்தியத்தினால் தன் மீது ஒரு கட்டுப்பாட்டைக் கட்டியிருந்தால்.”'
    reason: எபிரெயத்தில் ஒரே வேரிலிருந்து அமைந்த வினை-பெயர் தொடர், தன்ன்மீது பிணைப்பான கட்டுப்பாட்டைச் சுமத்திக்கொள்ளும் வலியுறுத்தலைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: וְאִם
  choice: அவள் ... செய்திருந்தாலோ
  rationale: சட்ட வழக்குகளின் தொடரில் வரும் நிபந்தனையைத் தமிழில் இயல்பான ‘-ஆலோ’ அமைப்பால் வெளிப்படுத்துகிறது; இணைப்புத் தொடர்ச்சி ‘அல்லது ... -ஆலோ’ என்பதிலும் நீடிக்கிறது.
- source_word: בֵּית אִישָׁהּ
  choice: தன் கணவனுடைய வீட்டில் இருக்கும்போது
  rationale: ‘அவளுடைய கணவனின் வீடு’ என்ற இடம் மற்றும் திருமணக் குடும்பச் சூழல் இரண்டையும் தெளிவாகக் காட்டுகிறது; ‘இருக்கும்போது’ என்பது எபிரெய முன்னிடைச்சொல்லின் சூழ்நிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: נָדָרָה
  choice: ஒரு நேர்த்திக்கடன் செய்திருந்தாலோ
  rationale: נדר என்பது கடவுளிடம் செய்யப்படும் உறுதிமொழி/நேர்த்திக்கடனைக் குறிக்கிறது. நவீன வேதாகமத் தமிழில் புரியக்கூடிய சட்ட-வழிபாட்டு சொல்லாக ‘நேர்த்திக்கடன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אוֹ
  choice: அல்லது
  rationale: இரண்டு தொடர்புடைய சட்டச் சாத்தியங்களைப் பிரிக்கும் எளிய மாற்று இணைப்புச்சொல்.
- source_word: אָסְרָה אִסָּר
  choice: தன்னையே ஒரு கட்டுப்பாட்டுக்கு உட்படுத்தியிருந்தாலோ
  rationale: ஒரே வேர் கொண்ட வினை-பெயர் அமைப்பு, ஒருவர் தம்மீது கட்டுப்படுத்தும் கடமையைச் சுமத்துவதை வலியுறுத்துகிறது. இந்தத் தமிழ் வடிவம் சொல்லுக்குச் சொல் செயற்கைத்தன்மையைத் தவிர்த்து சட்ட வலிமையைப் பாதுகாக்கிறது.
- source_word: עַל נַפְשָׁהּ
  choice: தன்னையே
  rationale: இந்த மரபுத்தொடரில் נֶפֶשׁ என்பது தனியான ‘ஆத்துமா’ அல்ல, அந்த நபரையே குறிக்கிறது; ஆகவே பிரதிபெயர்ச்சிப் பொருள் தெளிவாகத் தரப்படுகிறது.
- source_word: בִּשְׁבֻעָה
  choice: ஆணையிட்டு
  rationale: சத்தியம்/ஆணை மூலம் தன்னைப் பிணைத்துக்கொள்ளும் முறையைக் குறிக்கிறது. ‘ஆணையிட்டு’ என்பது செயல் முறையை இயல்பான, செம்மையான தமிழில் தெரிவிக்கிறது.
