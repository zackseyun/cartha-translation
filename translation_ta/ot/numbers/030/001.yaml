  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும், மோசே இஸ்ரவேலின் மகன்களிடம் பேசினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது வழக்கமான உடன்படிக்கை அடையாளப் பெயர். “இஸ்ரவேல் பிள்ளைகள்” அல்லது “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.
