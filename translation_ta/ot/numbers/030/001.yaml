lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பேசினார்
  rationale: எபிரெய வினைச்சொல் அடிப்படையில் ‘சொன்னார்’ எனப் பொருள்பட்டாலும், இங்கு நேரடி மேற்கோள் இல்லாமல் அறிவித்ததைக் கூறுவதால் ‘மக்களிடம் பேசினார்’ என்பது இயல்பான தமிழாகவும் பேச்சுச் செயலைத் துல்லியமாகவும் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது இஸ்ரவேல் சமூகமெங்கையும் குறிக்கும் நிலையான தேசிய-உடன்படிக்கைப் பெயர். நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ அதன் பொருளை இயல்பாக வெளிப்படுத்துகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: எல்லாவற்றின்படியும்
  rationale: முன்னொட்டு כְּ வெளிப்படுத்தும் ஒத்திசைவு அல்லது இணக்கப் பொருளை ‘-இன்படியும்’ காக்கிறது; இது வெறுமனே உரையின் உள்ளடக்கத்தைக் குறிப்பிடுவதைக் காட்டிலும் மூலத்துக்கு நெருக்கமானது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: மோசே பேசுவதற்கு முன்பே யெகோவா கட்டளையிட்டார் என்பது தமிழ் வாக்கிய அமைப்பிலேயே தெளிவாகிறது; தனியாக இறந்தகால முற்பெயர்ச்சி வடிவம் தேவையில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடாக இருந்தாலும், ‘கட்டளையிடு’ என்ற தமிழ் வினை இச்சூழலில் கட்டளையைப் பெறுபவரை நான்காம் வேற்றுமையான ‘மோசேக்கு’ என இயல்பாகக் கோருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது. துல்லியமான பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலின வடிவமும் தேசியக் குறிப்பும்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: எபிரெயத்தில் இலக்கண ரீதியாக ஆண்பால் பன்மை இருந்தாலும், இவ்விடத்தில் அது நாட்டினரைக் குறிக்கும் நிலையான கூட்டுப்பெயர். ‘இஸ்ரவேல் மக்கள்’ உள்ளடக்கப்பட்ட சமூகத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘எல்லாவற்றின்படியும்’ மூலத்தின் இணக்கப் பொருளைக் காக்கிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
