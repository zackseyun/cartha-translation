  rationale: The revision updates one relational term to modern standard Tamil and clarifies the distinct legal sense of the self-imposed obligations and their invalidity. It preserves the Hebrew’s direct object (‘her’), the same-day temporal condition, and the stated reason for divine forgiveness, without expanding the theological implication.
