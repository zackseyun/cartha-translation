  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: ta
  text: ஆனால், அவளுடைய தந்தை அதைக் கேள்விப்படும் நாளிலேயே அவளைத் தடுத்தால்[a], அவளுடைய நேர்த்திக்கடன்களும், அவள் தன்மீது ஏற்றுக்கொண்ட கட்டுப்படுத்தும் உறுதிப்பாடுகளும்[b] எதுவும் செல்லுபடியாகாது[c]. அவளுடைய தந்தை அவளைத் தடுத்ததால், யாவே அவளை மன்னிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘அவளைத் தடுத்தால்’ என்பது, அவள் ஏற்றுக்கொண்ட நேர்த்திக்கடனையோ உறுதிப்பாட்டையோ அவளுடைய தந்தை அனுமதிக்காமல் தடுப்பதைக் குறிக்கிறது; ‘அதை ரத்து செய்தால்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கட்டுப்படுத்தும் உறுதிப்பாடுகள்’ என்பது ஒருவர் தாமே தன்மீது ஏற்றுக்கொள்ளும், தம்மைக் கட்டுப்படுத்தும் உறுதிமொழிகளைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: c
    text: ‘செல்லுபடியாகாது’ என்பது அவை கட்டுப்படுத்தும் வலிமை பெறாது அல்லது சட்டப்படி நிலைநிற்காது என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... தடுத்தால்
  rationale: முந்தைய நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: הֵנִיא אָבִיהָ אֹתָהּ
  choice: அவளுடைய தகப்பன் ... அவளைத் தடுத்தால்
  rationale: வினையின் நேரடிச் செயப்படுபொருள் மகளே என்பதைக் காக்கிறது; இந்த நேர்த்திக்கடன் சூழலில், அவளுடைய உறுதிப்பாட்டைத் தகப்பன் அனுமதிக்காமல் தடுப்பதைக் குறிக்கிறது.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: அதைக் கேள்விப்படும் நாளிலேயே
  rationale: சட்ட நிபந்தனையில் முக்கியமான அதே நாளின் கால வரம்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל נְדָרֶיהָ
  choice: அவளுடைய நேர்த்திக்கடன்கள் ... எதுவும்
  rationale: נדר என்பதன் சமய-சட்டப் பொருளை ‘நேர்த்திக்கடன்’ வெளிப்படுத்துகிறது; பின்னுள்ள மறுப்பின் வீச்சை இயல்பான தமிழில் ‘எதுவும் ... நிலைநிற்காது’ என்று அமைக்கிறது.
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: அவள் தன்மீது விதித்துக்கொண்ட கட்டுப்பாடுகள்
  rationale: தானே தன்மீது ஏற்றுக்கொண்ட கட்டுப்படுத்தும் உறுதிப்பாடுகள் என்ற எபிரெயச் சொல்லாட்சியின் பிரதிபலிப்புப் பொருளைக் காக்கிறது.
- source_word: לֹא יָקוּם
  choice: நிலைநிற்காது
  rationale: ‘நிற்காது’ என்ற மூல உருவகத்தைத் தக்கவைத்தபடியே, அவை கட்டுப்படுத்தும் வலிமை பெறாது என்ற சட்டப் பொருளையும் தெரிவிக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயரை ஒலிபெயர்த்து, மூலத்தில் உள்ள பெயர் வடிவத்தை மறைக்காமல் வழங்குகிறது.
- source_word: יִסְלַח לָהּ
  choice: அவளை மன்னிப்பார்
  rationale: סלח என்பதற்கான நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: כִּי
  choice: தடுத்ததால்
  rationale: தகப்பனின் தடைதான் பின்னர் கூறப்படும் மன்னிப்புக்கான காரணம் என்பதைத் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: ரத்து செய்யப்பட்ட நேர்த்திக்கடன் சூழலில் இறை மன்னிப்பின் பொருள்
  choice: தகப்பன் உரிய நாளில் தடுத்ததால் அந்த உறுதிப்பாடுகள் கட்டுப்படுத்தும் வலிமை பெறாது என்றும், யாவே அவளை மன்னிப்பார் என்றும் வசனம் கூறுவதைக் கூடுதல் விளக்கமின்றி அப்படியே வைக்கிறது.
  alternative: நிறைவேற்றப்படாத நேர்த்திக்கடனால் ஏற்பட்ட பாவத்திற்கான விரிவான மன்னிப்பு என்று வெளிப்படையாக விளக்குதல்.
  rationale: உடனடிச் சூழல் நேர்த்திக்கடனின் செல்லுபடியையும் தகப்பனின் தடையையும் பற்றியது. ‘மன்னிப்பார்’ என்பதை மொழிபெயர்ப்பது அவசியம்; ஆனால் வசனம் கூறாத குற்றத்தின் தன்மையையோ விரிவான கோட்பாட்டையோ சேர்க்கக்கூடாது.
- issue: தகப்பன் யாரை அல்லது எதைத் தடுக்கிறார்
  choice: எபிரெய இலக்கணத்தைப் பின்பற்றி ‘அவளைத் தடுத்தால்’ என்று மொழிபெயர்க்கிறது.
  alternative: ‘அவளுடைய நேர்த்திக்கடனை ரத்து செய்தால்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலத்தில் நேரடிச் செயப்படுபொருள் மகள்; சூழலில் விளைவு அவளுடைய நேர்த்திக்கடன்கள்மீது விழுகிறது. முதன்மை உரை இந்தத் தனித்துவமான அமைப்பைக் காக்கிறது; அடிக்குறிப்பு அதன் சூழற்பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டநடை தெளிவுடன் ஆனால் மரியாதையான வேதாகம மொழிநடையில் வடிவமைக்கப்பட்டுள்ளது. ‘தகப்பன்’ என்பது குடும்ப-சட்டச் சூழலின் உறவுப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது; ‘நேர்த்திக்கடன்’, ‘கட்டுப்பாடு’, ‘நிலைநிற்காது’ ஆகியவை மூலத்தின் வேறுபட்ட சட்ட-சமயச் சொற்களை ஒன்றாக்காமல் வைத்திருக்கின்றன.
