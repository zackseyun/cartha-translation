  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: ta
  text: 'யாவே மோசேக்குக் கட்டளையிட்ட விதிமுறைகள் இவையே: ஒரு கணவனுக்கும் அவன் மனைவிக்கும் இடையில், ஒரு தந்தைக்கும் தன் இளமைப் பருவத்தில் தன் தந்தையின் வீட்டில் இருக்கும் அவனுடைய மகளுக்கும் இடையில்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: விதிமுறைகள் இவையே
  rationale: இது முந்தைய சட்டப்பகுதியைச் சுருக்கமாகச் சுட்டுகிறது; חֻקִּים என்பதன் நிர்ணயிக்கப்பட்ட சட்ட ஒழுங்கு என்ற பொருளை ‘விதிமுறைகள்’ இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்ட
  rationale: எபிரெய வாக்கியத்தில் மோசே கட்டளையைப் பெறுபவர். தமிழில் ‘மோசேக்குக் கட்டளையிட்ட’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: கணவனுக்கும் அவன் மனைவிக்கும் இடையிலானவற்றைக் குறித்து
  rationale: אִישׁ என்பது தனியாக ‘ஆண்/மனிதன்’ எனப் பொருள்படலாம்; ‘அவன் மனைவி’ என்ற இணைப்பு இங்கு கணவன் என்ற உறவுப் பொருளைத் தெளிவாக்குகிறது. בֵּין என்பதன் ‘இடையில்’ என்ற உறவுசார் அமைப்பும் காக்கப்படுகிறது.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: மகளுக்கும் அவள் தகப்பனுக்கும் இடையிலானவற்றைக் குறித்து
  rationale: தந்தை–மகள் உறவைப் பாலினத் துல்லியத்துடன் தருவதோடு, இணையான בֵּין அமைப்பையும் காக்கிறது.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: தன் தகப்பனின் வீட்டில் வாழும் இளம்பருவ மகள்
  rationale: சொற்சார்பாக ‘அவளுடைய இளமையில், அவளுடைய தகப்பனின் வீட்டில்’ என்பதாகும். தமிழில் உறவுச் சட்டச் சூழலை இயல்பாகத் தெரிவிக்க ‘வாழும்’ சேர்க்கப்பட்டுள்ளது; அது மூலத்தில் உள்ள குடியிருப்புச் சூழலின் மறைபொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. ‘கர்த்தர்’ போன்ற பட்டத்தைப் பதிலிடாமல் பெயரைப் பெயராகவே வழங்குவது மூல வேறுபாட்டைக் காக்கிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவம் ‘யெகோவா’.
- issue: אִישׁ என்பதன் உறவுசார் பொருள்
  choice: கணவன்
  alternative: ஆண்; மனிதன்
  rationale: לְאִשְׁתּוֹ (‘அவன் மனைவிக்கு’) என்ற தொடரால் இங்கு திருமண உறவு முன்வைக்கப்படுகிறது. ஆகவே ‘கணவன்’ என்பது சூழலுக்கேற்ற துல்லியமான வாசிப்பு; பொதுவான ‘ஆண்’ என்பதையும் முற்றிலும் மறுக்கும் வகையில் தனிக் கோட்பாடு சேர்க்கப்படவில்லை.
- issue: தந்தையின் வீட்டில் உள்ள மகளின் சட்டச் சூழல்
  choice: தன் தகப்பனின் வீட்டில் வாழும் இளம்பருவ மகள்
  alternative: தன் இளமையில் தகப்பனின் வீட்டில் இருக்கும் மகள்
  rationale: வசனம் தந்தை–மகள் உறவை அவள் இளம்பருவத்திலும் தந்தையின் வீட்டிலும் இருப்பதோடு வரையறுக்கிறது. ‘அதிகாரம்’ அல்லது குறிப்பிட்ட வயது போன்ற மூலத்தில் வெளிப்படாத கருத்துகளைச் சேர்க்காமல் அந்தச் சூழல் மட்டும் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘விதிமுறைகள்’ சட்டப் பதிவைத் தக்கவைக்கிறது. ‘தகப்பன்’ வேதாகமக் குடும்பச் சூழலில் தெளிவாக இருந்தாலும் வாக்கிய அமைப்பு தற்போதைய வாசகர்களுக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டுள்ளது. மூலத்தின் בֵּין (‘இடையில்’) உறவு பிரதான உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
