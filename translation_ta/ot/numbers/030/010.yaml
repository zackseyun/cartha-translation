  to: விதவையோ மணவிலக்குப் பெற்ற பெண்ணோ செய்த நேர்த்திக்கடன்—அவள் தன்மேல் ஏற்றுக்கொண்ட அனைத்தும்—அவளுக்குக் கட்டாயமாக இருக்கும்.[a]
