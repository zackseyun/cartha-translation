review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies a widow and a divorced woman and preserves the comprehensive scope of obligations she has imposed upon herself. However, “அவளைக் கட்டுப்படுத்தும்” shifts the legal assertion of continuing validity into an active sense of controlling her. The Hebrew יָקוּם עָלֶיהָ states that the obligation stands/remains binding upon her.
  naturalness: The revised wording is natural modern standard Tamil and retains a formal legal register. “அவளுக்குக் கட்டாயமாக இருக்கும்” clearly expresses that the obligations remain binding.
  terminology: “நேர்த்திக்கடன்,” “விதவை,” and “மணவிலக்குப் பெற்ற பெண்” are appropriate. “தன்மேல் ஏற்றுக்கொண்ட” accurately conveys the self-imposed character of the obligation without over-literal or physically concrete language.
  issues:
  - severity: medium
    issue: The predicate “அவளைக் கட்டுப்படுத்தும்” is not the most faithful legal rendering of יָקוּם עָלֶיהָ.
    rationale: It can mean that the obligation controls her, whereas the Hebrew concerns its standing validity and binding force upon her. A predicate expressing continued obligation is preferable.
  revised_text: விதவையோ மணவிலக்குப் பெற்ற பெண்ணோ செய்த நேர்த்திக்கடன்—அவள் தன்மேல் ஏற்றுக்கொண்ட அனைத்தும்—அவளுக்குக் கட்டாயமாக இருக்கும்.[a]
  revised_footnotes:
  - marker: a
    text: அல்லது, “அவள்மேல் நிலைத்திருக்கும்.”
