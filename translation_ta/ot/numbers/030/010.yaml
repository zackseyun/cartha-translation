  revision_rationale: 'The revision replaces an active ‘control’ expression with wording that communicates the Hebrew legal sense: every vow or self-imposed binding obligation of a widow or divorced woman remains binding on her. The footnote retains the more literal Hebrew metaphor without treating it as the primary Tamil idiom.'
