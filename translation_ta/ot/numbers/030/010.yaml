source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: ta
  text: விதவையோ மணவிலக்குப் பெற்ற பெண்ணோ செய்த நேர்த்திக்கடன்—அவள் தன்மேல் ஏற்றுக்கொண்ட அனைத்தும்—அவளுக்குக் கட்டாயமாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள்மேல் நிலைத்திருக்கும்.”
    reason: יָקוּם עָלֶיהָ என்பதன் சட்ட/உருவகமான நேரடி மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: נֵדֶר
  choice: நேர்த்திக்கடன்
  rationale: தேவனிடம் செய்யப்படும் உறுதிமொழியைச் சுட்டும் இந்தச் சட்ட/வழிபாட்டுச் சூழலில், நவீனத் தமிழில் தெளிவாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: கணவனை இழந்த பெண்ணைக் குறிக்கும் நேரான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: גְרוּשָׁה
  choice: மணவிலக்குப் பெற்ற பெண்
  rationale: வினைச்சொல்லின் செயப்படுபொருள் தன்மையையும் பெண் அனுப்பிவிடப்பட்டு மணவிலக்குப் பெற்ற நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: כֹּל אֲשֶׁר
  choice: அனைத்தும்
  rationale: தொடக்கத்தில் கூறப்பட்ட நேர்த்திக்கடனைத் தாண்டி, அவள் ஏற்றுக்கொண்ட எந்தக் கட்டுப்பாட்டையும் உள்ளடக்கும் விரிவான பொருளைப் பாதுகாக்கிறது.
- source_word: אָסְרָה
  choice: ஏற்றுக்கொண்ட
  rationale: சொற்பொருள் 'கட்டினாள்' என்றாலும், இங்கு தன்மேல் ஒரு கடமையை விதித்துக்கொள்ளும் சட்டப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துள்ள 'கட்டுப்படுத்தும்' என்பதுடன் தேவையற்ற மறுபடிதலைத் தவிர்க்கிறது.
- source_word: עַל נַפְשָׁהּ
  choice: தன்மேல்
  rationale: சொல்லளவில் 'தன் உயிர்/தன்மீது'; சுயமாக ஏற்றுக்கொண்ட கடமை என்ற எதிர்மறையற்ற பிரதிபலிப்பு உணர்வைச் சுருக்கமாகத் தருகிறது.
- source_word: יָקוּם
  choice: கட்டுப்படுத்தும்
  rationale: சட்டச் சூழலில் 'நிலைத்திருக்கும், செல்லுபடியாகும்' என்ற பொருளை, עָלֶיהָ உடன் இணைத்து, அந்தக் கடமை அவளுக்குக் கட்டாயமானதாக இருக்கும் என இயல்பாகத் தெரிவிக்கிறது.
- source_word: עָלֶיהָ
  choice: அவளைக்
  rationale: அந்தக் கடமை அவள்மேல் தங்கி அவளுக்குக் கட்டுப்பாடாக இருப்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாகக் காட்டுகிறது.
