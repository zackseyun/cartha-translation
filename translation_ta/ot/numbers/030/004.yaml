source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: ta
  text: ஒரு பெண் தன் இளமையில் தன் தந்தையின் வீட்டில் இருக்கும்போது, யாவேக்கு ஒரு நேர்த்திக்கடனை நேர்ந்துகொண்டு[a], தன்மீது ஒரு கட்டுப்பாட்டை விதித்துக்கொண்டால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு நேர்த்திக்கடனை நேர்ந்துகொண்டு” என ஒரே வேருடன் தொடர்புடைய வினைச்சொல்லும் பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டு, முறையாக நேர்ந்துகொள்ளும் செயல் வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒரு கட்டுப்பாட்டால் தன்னைக் கட்டிக்கொண்டு” என்ற பொருளைத் தரும் தொடர்புடைய வினைச்சொல்லும் பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: ஒரு பெண் ... கொண்டால்
  rationale: சட்ட வழக்கில் ஒரு நிபந்தனை நிகழ்வை அறிமுகப்படுத்தும் தொடராக இருப்பதால், தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: תִדֹּר נֶדֶר
  choice: ஒரு நேர்த்திக்கடன் செய்வதாக நேர்ந்துகொண்டு
  rationale: வினைச்சொல்லும் அதனோடு தொடர்புடைய பெயர்ச்சொல்லும் சேர்ந்த எபிரெய வலியுறுத்தலை ஓரளவு காத்து, கடவுளிடம் முறையாகச் செய்யும் நேர்ச்சியின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: וְאָסְרָה אִסָּר
  choice: தன்மீது ஒரு கட்டுப்பாட்டை விதித்துக்கொண்டால்
  rationale: ஒருவர் தம்மையே கட்டுப்படுத்தும் உறுதிப்பாட்டுக்கு உட்படுத்திக்கொள்வதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; נֶדֶר என்பதிலிருந்து אִסָּר என்பதன் வேறுபாட்டையும் காக்கிறது.
- source_word: בְּבֵית אָבִיהָ בִּנְעֻרֶיהָ
  choice: தன் இளமையில் தன் தந்தையின் வீட்டில் இருக்கும்போது
  rationale: அவளுடைய இளமைப் பருவத்தையும் தந்தையின் வீட்டில் இருக்கும் குடும்பச் சூழலையும் வெளிப்படையாகக் காக்கிறது; திருமணமாகாத நிலை என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது.
- issue: இளமை மற்றும் தந்தையின் வீட்டில் இருப்பதன் சட்டப் பொருள்
  choice: மூலத்தின் கால மற்றும் குடும்பச் சூழலை மட்டும் நேரடியாகக் கூறுதல்
  alternative: திருமணமாகாத இளம் பெண் என்று விளக்குதல்
  rationale: சூழல் திருமணமாகாத நிலையைக் குறிக்கக்கூடும்; ஆனால் வசனம் அதை நேரடியாகச் சொல்லாததால் அந்த விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, சட்ட நிபந்தனைத் தொனியுள்ள தமிழ் பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
