source:
  edition: WLC
  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: ta
  text: ஆனால், அவள் ஒருவனுக்கு மனைவியானால்[a], அவளுடைய நேர்த்திக்கடன்களோ, அவள் தன்மேல் கட்டிக்கொண்ட அவளுடைய உதடுகளின் சொல்லோ[b] அவள்மேல் இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் ஒருவனுக்குத் திருமணமானால்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “அவள் ஒருவனுக்கு இருந்தால்/ஆனால்” என வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளுடைய உதடுகளின் பேச்சு.” இத்தொடர் முறையான நேர்த்திக்கடனிலிருந்து வேறுபட்ட, வாயால் கூறி அவள் தன்மேல் ஏற்றுக்கொண்ட கடமையைக் குறிக்கலாம்; அது அவசரமாகச் சொல்லப்பட்டதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... இருந்தால்
  rationale: முந்தைய சட்டத்துடன் தொடர்ச்சியையும் புதிய சூழ்நிலைக்கான மென்மையான வேறுபாட்டையும் காட்டுகிறது.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: அவள் ஒருவனுக்கு மனைவியாகியிருந்தால்
  rationale: היה + לְאִישׁ என்ற எபிரெயத் தொடர் திருமண உறவில் இருப்பதையோ அதற்குள் வந்திருப்பதையோ குறிக்கிறது. உடைமை உணர்வை மிகைப்படுத்தாமல் அதன் சட்ட-உறவு பொருளைத் தக்கவைக்கிறது.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: அவளுடைய நேர்த்திக்கடன்கள் ... அவள்மேல் இருந்தால்
  rationale: עָלֶיהָ என்பதிலுள்ள, கடமை ஒருவர்மேல் இருப்பதாகிய எபிரெய உருவகத்தைத் தக்கவைக்கிறது; அவை ஏற்கெனவே சட்டப்படி உறுதிசெய்யப்பட்டவை என்று முன்கூட்டியே தீர்மானிப்பதில்லை.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: அவளுடைய உதடுகளின் அவசரப் பேச்சு
  rationale: முறையான நேர்த்திக்கடனிலிருந்து வேறுபடுத்தப்பட்ட வாய்மொழிக் கூற்றை நேரடியாகக் காட்டுகிறது; இச்சூழலில் மִבְטָא கொண்டிருக்கக்கூடிய அவசரமாகச் சொல்லப்பட்ட தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: அவள் தன்னையே பிணைத்துக்கொண்ட
  rationale: ஆசர் என்ற வினையின் கட்டுதல் அல்லது கடமைக்குட்படுத்துதல் என்ற சட்ட உருவகத்தையும், נֶפֶשׁ இங்கு கொண்டுள்ள தற்சுட்டுப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: சட்டப்பூர்வ நேர்த்திக்கடன் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: தன்னையே
  alternative: தன் ஆத்துமாவை / தன் உயிரை
  rationale: இங்கு ஒருவரின் உடலிலிருந்து வேறுபட்ட ஆத்துமாவைப் பற்றிய மானிடவியல் கூற்று இல்லை; அவள் தன்மேல் ஏற்றுக்கொண்ட கடமையே பொருள். ஆகவே தற்சுட்டுப் பொருளான ‘தன்னையே’ என்பது கோட்பாட்டுச் சார்பை இறக்குமதி செய்யாமல் எபிரெய வழக்கை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நேர்த்திக்கடன்’, ‘அவள்மேல்’, ‘தன்னையே பிணைத்துக்கொண்ட’ ஆகிய சொற்கள் மூலத்தின் சட்டப்பூர்வ கடமை உருவகத்தைத் தக்கவைக்கின்றன; வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
