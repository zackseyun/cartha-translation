  source_fidelity: மூலத்தின் சட்டரீதியான அமைப்பும் பொருளும் பெரும்பாலும் சரியாக உள்ளன. ஆனால் שְׁבֻעַת אִסָּר என்பதிலுள்ள பிணைப்புத் தன்மையை ‘கட்டுப்படுத்தும் சத்தியம்’ என்பதற்குப் பதிலாக ‘பிணைக்கும் சத்தியம்’ என்று கூறுவது துல்லியமாகவும் இயல்பாகவும் இருக்கும்.
