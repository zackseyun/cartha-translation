  edition: WLC
  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: ta
  text: ஒவ்வொரு நேர்த்திக்கடனையும், தன்னை வருத்திக்கொள்வதற்கான[a] ஒவ்வொரு பிணைக்கும் சத்தியத்தையும், அவளுடைய கணவன் உறுதிசெய்யலாம்; அல்லது அவளுடைய கணவன் அதைச் செல்லாததாக்கலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை ஒறுத்துக்கொள்வதற்கான” அல்லது “தன்னைத் தாழ்த்திக்கொள்வதற்கான.” எபிரேய மரபுத்தொடரைச் சொற்சொல்லாக மொழிபெயர்த்தால், “தன் ஆத்துமாவை வருத்துவதற்கான” என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: நேர்த்திக்கடன்
  rationale: கடவுளிடம் செய்யப்படும் புனிதமான உறுதிமொழியைக் குறிக்கும் எபிரேயச் சட்டச் சொல்லுக்கு, நவீனத் தமிழில் தெளிவாகவும் வழக்கமாகவும் உள்ள இணைச்சொல்.
- source_word: שְׁבֻעַת אִסָּר
  choice: கட்டுப்படுத்தும் சத்தியம்
  rationale: שְׁבֻעָה என்பதன் சத்தியப் பொருளையும், אִסָּר என்பதன் கட்டுப்படுத்தும் அல்லது பிணிக்கும் வலிமையையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: தன்னை வருத்திக்கொள்வதற்கான
  rationale: இந்த எபிரேய மரபுத்தொடர் நோன்பு போன்ற சுயமறுப்பு அல்லது தன்னைத் தாழ்த்துதல் சார்ந்த செயலைக் குறிக்கலாம். சொற்சொல்லான உருவகத்தைத் தமிழில் சற்றே இயல்பாக்கி, பொருள் வேறுபாடுகளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: נָפֶשׁ
  choice: தன்னை
  rationale: இந்த மரபுத்தொடரில் נֶפֶשׁ தனிநபரையே அல்லது தன்னையே குறிக்கிறது; தனியாக ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது நவீனத் தமிழில் தேவையற்ற உடல்–ஆத்துமா பிரிவை உணர்த்தக்கூடும்.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: திருமணச் சட்டச் சூழலில் பின்னொட்டுடன் வரும் אִישׁ தெளிவாக அவளுடைய கணவனைக் குறிக்கிறது.
- source_word: יְקִימֶנּוּ
  choice: உறுதிசெய்யலாம்
  rationale: קום வினையின் ஹிஃபில் வடிவம் நேர்த்திக்கடன் அல்லது சத்தியத்தை நடைமுறையில் நிலைநிறுத்துவதைக் குறிக்கிறது; ‘உறுதிசெய்யலாம்’ அதன் சட்டரீதியான வலிமையையும் அனுமதிப் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: יְפֵרֶנּוּ
  choice: செல்லாததாக்கலாம்
  rationale: פרר வினையின் ஹிஃபில் வடிவம் நேர்த்திக்கடன் அல்லது சத்தியத்தின் செல்லுபடியை நீக்குவதைக் குறிக்கிறது; இத்தமிழாக்கம் அதன் சட்டப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל ... וְכָל
  choice: ஒவ்வொரு ... ஒவ்வொரு ...
  rationale: இரு வகைகளையும் முழுமையாக உள்ளடக்கும் எபிரேயத்தின் பகிர்நிலை வலியுறுத்தலைப் பாதுகாக்கிறது.
