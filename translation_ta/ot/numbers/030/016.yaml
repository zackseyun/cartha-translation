  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: ta
  text: ஆனால், அவன் அவற்றைக் கேட்ட பிறகு அவற்றை நிச்சயமாகவே ரத்து செய்தால்[a], அவளுடைய குற்றத்தை அவன் சுமப்பான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறுதியாக ரத்து செய்தால்’ அல்லது ‘முற்றிலும் ரத்து செய்தால்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் வினையை வலியுறுத்த, ஒரே வேரைச் சேர்ந்த இன்ஃபினிட்டிவ் அப்சல்யூட் வடிவமும் முடிவுறு வினை வடிவமும் இணைந்து வருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘அவளுடைய குற்றத்தைச் சுமப்பான்’ என்பதை ‘அவளுடைய அக்கிரமத்திற்கான பொறுப்பை ஏற்றுக்கொள்வான்’ அல்லது ‘அவளுடைய குற்றத்திற்கான தண்டனையைச் சுமப்பான்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... செய்தால்
  rationale: முந்தைய வசனத்துடன் உள்ள நிபந்தனை சார்ந்த முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָפֵר יָפֵר
  choice: நிச்சயமாகவே ரத்துசெய்தால்
  rationale: முற்றுவினையெச்ச வடிவமும் வினை வடிவமும் இணைந்து தரும் வலியுறுத்தலை ‘நிச்சயமாகவே’ தக்கவைக்கிறது; நேர்த்திக்கடன்களைச் செல்லாதவையாக்கும் சட்டச் சூழலுக்கு ‘ரத்துசெய்’ பொருந்துகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய சூழலில் கூறப்பட்ட அவளுடைய நேர்த்திக்கடன்களையும் கட்டுப்படுத்தும் உறுதிமொழிகளையும் குறிக்கும் பன்மைச் சுட்டுப்பெயர் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: அவற்றைக் கேட்ட பிறகு
  rationale: அவன் அவற்றைக் கேட்டதைத் தொடர்ந்து நடவடிக்கை எடுப்பதைக் காலவரிசைப்படி நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְנָשָׂא
  choice: அவன் சுமப்பான்
  rationale: נשׂא עון என்ற சட்ட-அறச் சொல்லிணையின் ‘குற்றத்தைச் சுமத்தல்/சுமத்திக்கொள்ளுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עֲוֺנָהּ
  choice: அவளுடைய குற்றத்தை
  rationale: குற்றம், அதற்கான பொறுப்பு, அல்லது அதன் விளைவு ஆகிய பொருள் வாய்ப்புகளை முற்றிலும் ஒன்றாகச் சுருக்கிவிடாமல் அடிப்படைச் சொல்லைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சட்டச் சூழலில் மற்றொருவருடைய குற்றத்தைச் சுமப்பதன் பொருள்
  choice: ‘அவளுடைய குற்றத்தை அவன் சுமப்பான்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தல்
  alternative: அவளுடைய குற்றத்திற்கான பொறுப்பை அவன் ஏற்றுக்கொள்வான்; அல்லது அவளுடைய குற்றத்திற்கான தண்டனையை அவன் சுமப்பான்
  rationale: נשׂא עון என்பது குற்றம், குற்றப்பொறுப்பு, அல்லது அதற்குரிய விளைவுகளைச் சுமப்பதைக் குறிக்கலாம். தாமதமாக ரத்துசெய்வதால் கணவனுக்கு வரும் பொறுப்பை வசனம் சுட்டினாலும், தண்டனையின் துல்லிய இயல்பை மூலவாக்கியம் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ரத்துசெய்’ பொதுவாகப் புரிந்துகொள்ளக்கூடிய சட்டச் சொல்; ‘குற்றத்தைச் சுமப்பான்’ மூலத்தின் உருவகத்தையும் அதன் திட்டமிட்ட பொருள் நெகிழ்வையும் தக்கவைக்கிறது.
