base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: ta
  text: அவளுடைய கணவன் அதைக் கேட்கும் நாளில்[a] அவளிடம் மௌனமாக இருந்தால், அவளுடைய நேர்த்திக்கடன்கள் நிலைத்திருக்கும்; அவள் தன்மேல் ஏற்றுக்கொண்ட கட்டுப்பாடுகளும்[b] நிலைத்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவன் கேட்கும் நாளில்.” அவன் அறிந்த அதே நாளே இங்கு குறிப்பிடப்படும் சட்டரீதியான காலமாகும்.
    reason: lexical_alternative
  - marker: b
    text: “கட்டுப்பாடுகள்” என்பது அவள் தன்மேல் ஏற்றுக்கொண்ட கட்டுப்படுத்தும் கடப்பாடுகள் அல்லது விலக்குகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: ஆனால் ... கேட்டால்
  rationale: சட்ட நிபந்தனைத் தொடரில் வரும் வினை என்பதால், எளிய இறந்தகாலமாக அல்லாமல் நிபந்தனை வடிவில் மொழிபெயர்க்கப்பட்டது. முந்தைய சூழலுடன் இயல்பாக இணைய ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: திருமணச் சட்டச் சூழலில் இச்சொல் பொதுவான ‘ஆண்’ என்பதை அல்ல, ‘கணவன்’ என்பதைக் குறிக்கிறது.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: அதைக் கேட்ட நாளில்
  rationale: கணவன் அறிந்த அதே நாளே சட்டரீதியாக முக்கியமான காலவரம்பு என்பதை எபிரெய வடிவுக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: அவளிடம் எதுவும் சொல்லாமல் இருந்தால்
  rationale: சொல்லாட்சியில் ‘அவளிடம் மௌனமாக இருத்தல்’; இங்கு எதிர்ப்பு தெரிவிக்காமல் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְקָמוּ / יָקֻמוּ
  choice: நிலைத்திருக்கும்
  rationale: சட்டரீதியாகச் செல்லுபடியாகத் தொடர்ந்து இருப்பது என்ற பொருளைத் தருகிறது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் மறுபடியுரைத்தலைப் பாதுகாக்கிறது.
- source_word: נְדָרֶיהָ
  choice: அவளுடைய நேர்த்திக்கடன்கள்
  rationale: கடவுளிடம் உறுதியாகச் செய்யப்படும் நேர்த்தியைச் சுட்டும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: וֶאֱסָרֶהָ
  choice: அவளுடைய ... கட்டுப்பாடுகள்
  rationale: தன்மேல் கட்டிக்கொண்ட கடப்பாடுகள் அல்லது விலக்குகள் என்ற பரந்த சட்டப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: அவள் தன்மேல் ஏற்றுக்கொண்ட
  rationale: சொல்லாட்சியில் ‘தன்மேல் கட்டிக்கொண்ட’ என்ற உருவகம் உள்ளது; தமிழில் இயல்பாகவும் சட்டரீதியான சுயக் கடப்பாட்டைத் தெளிவாகவும் காட்ட ‘ஏற்றுக்கொண்ட’ என வழங்கப்பட்டது.
- source_word: נַפְשָׁהּ
  choice: தன்மேல்
  rationale: இங்கு ‘ஆத்துமா’ என்று தனியாகக் குறிக்காமல், அந்தப் பெண் தன்னையே குறிக்கும் தற்சுட்டுப் பயன்பாடு.
