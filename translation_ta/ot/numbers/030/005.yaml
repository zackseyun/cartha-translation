base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: ta
  text: அவளுடைய தந்தை அவளுடைய நேர்த்திக்கடனையும்[a], அவள் தன்மேல் விதித்துக்கொண்ட கட்டுப்பாட்டையும் கேட்டால், அவளிடம் எதுவும் சொல்லாமல் இருந்தால்[b], அவளுடைய நேர்த்திக்கடன்கள் அனைத்தும் நிலைத்திருக்கும்; அவள் தன்மேல் விதித்துக்கொண்ட ஒவ்வொரு கட்டுப்பாடும் நிலைத்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நேர்த்திக்கடன்” என்பது தேவனுக்குச் செய்யப்படும் உறுதிமொழியைக் குறிக்கிறது. இதற்குப் பின்வரும் “கட்டுப்பாடு” என்பதற்கு எபிரெயத்தில் வேறொரு சொல் பயன்படுத்தப்பட்டுள்ளது; அது ஒருவர் தன்மேல் விதித்துக்கொள்ளும் பிணைக்கும் தடை அல்லது கடப்பாட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அவளுடைய தந்தை அவளிடம் மௌனமாக இருந்தால்.” இங்கு அவரது மௌனம் எதிர்ப்புத் தெரிவிக்காததைக் குறிக்கிறது; ஆகவே அவள் ஏற்றுக்கொண்டவை செல்லுபடியாகத் தொடரும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר / נִדְרָהּ
  choice: நேர்த்திக்கடன்
  rationale: தேவனுக்குச் செய்யப்படும் உறுதிமொழி என்ற சட்ட மற்றும் வழிபாட்டுச் சூழலைத் தமிழில் தெளிவாகக் குறிக்கும் நிலைபெற்ற சொல்.
- source_word: אִסָּר / וֶאֱסָרָהּ
  choice: கட்டுப்பாடு
  rationale: נֵדֶר என்பதிலிருந்து வேறுபட்ட, ஒருவர் தன்மேல் விதித்துக்கொள்ளும் பிணைக்கும் தடை அல்லது கடப்பாட்டைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘கட்டுப்பாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: அவள் தன்மேல் விதித்துக்கொண்ட
  rationale: எபிரெயச் சொற்றொடரின் தன்னையே பிணைத்துக்கொள்ளும் கருத்தைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: அவளிடம் எதுவும் சொல்லாமல் இருந்தால்
  rationale: சொற்பொருளான மௌனத்தையும், சூழலில் அது தெரிவிக்கும் எதிர்ப்பின்மையையும் விளக்கமாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: וְקָמוּ ... יָקוּם
  choice: நிலைத்திருக்கும்
  rationale: சட்டரீதியாக செல்லுபடியாகத் தொடரும் பொருளைக் காத்து, மூலத்தின் ‘நிற்கும்’ உருவகத்திற்கு நெருக்கமான தமிழை வழங்குகிறது.
- source_word: כָּל
  choice: அனைத்தும் / ஒவ்வொரு
  rationale: பன்மையான நேர்த்திக்கடன்களுடன் ‘அனைத்தும்’ என்றும், ஒருமை வடிவிலுள்ள கட்டுப்பாட்டுடன் பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு’ என்றும் இயல்பாக மொழிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் செறிவும் வேதாகமத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. נֵדֶר மற்றும் אִסָּר ஆகிய தொடர்புடைய ஆனால் வேறுபட்ட சொற்கள் முறையே ‘நேர்த்திக்கடன்’ மற்றும் ‘கட்டுப்பாடு’ எனத் தனித்தனியாக வழங்கப்பட்டுள்ளன.
