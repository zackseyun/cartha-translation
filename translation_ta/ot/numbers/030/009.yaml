base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: ta
  text: ஆனால், அவளுடைய கணவன் அதைக் கேட்கும் நாளில் அவளைத் தடுத்து, அவள்மேல் உள்ள அவளுடைய நேர்த்திக்கடனையும், தன்மேல் கட்டுப்பாட்டை விதித்துக்கொள்ள அவள் வாயால் கூறிய சொல்லையும்[a] செல்லாததாக்கினால், யாவே அவளை மன்னிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய உதடுகளின் சொல்” அல்லது “தன்மேல் கட்டுப்பாட்டை விதித்துக்கொள்ள அவள் கூறிய சொல்.”
    reason: מִבְטָא என்பது பொதுவாக வாயால் கூறப்பட்ட சொல் அல்லது உச்சரிப்பைக் குறிக்கிறது. இச்சூழலில் அது சுயமாக ஏற்றுக்கொண்ட கட்டுப்பாட்டுடன் தொடர்புடையது; ‘அவசரமான’ என்ற நுணுக்கம் சாத்தியமானதேயன்றி உறுதியானதல்ல.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... எனில்
  rationale: முந்தைய நிலைக்கு மாறான நிபந்தனையை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: கேள்விப்படும் நாளில்
  rationale: கணவன் அந்த உறுதிமொழியை அறியும் நேரத்தைக் குறிக்கும் எபிரெய காலவழக்கைத் தக்கவைக்கிறது.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: இந்தச் சட்டச் சூழலில் אִישָׁהּ என்பது பொதுவாக ஓர் ஆணை அல்ல, அவளுடைய கணவனைக் குறிக்கிறது.
- source_word: יָנִיא אֹתָהּ
  choice: அவளைத் தடுத்து
  rationale: நேர்த்திக்கடன் செயல்படுவதை அனுமதிக்காமல் தடுக்கும் ஹிஃபில் வினையின் சட்டப் பொருளைத் தெரிவிக்கிறது.
- source_word: וְהֵפֵר
  choice: செல்லாததாக்கினால்
  rationale: உடைத்தல் என்ற சொல்லடிப் பொருளைவிட, உறுதிமொழியின் கட்டுப்படுத்தும் வலிமையை ரத்துசெய்யும் சட்டப் பொருளை இயல்பாகக் கூறுகிறது.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: அவள்மேல் உள்ள நேர்த்திக்கடன்
  rationale: נדר என்பதற்கான வழக்கமான வேதாகமத் தமிழையும், கடமை அவள்மேல் இருப்பதாகிய எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: அவளுடைய உதடுகளின் அவசரச் சொல்
  rationale: வாயால் கூறப்பட்ட சுயகட்டுப்பாட்டு உறுதியைக் குறிக்கிறது; ‘அவசர’ என்பது சாத்தியமான திடீர் அல்லது யோசனையற்ற உச்சரிப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது, ஆனால் அதன் உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: அவள் தன்னையே கட்டுப்படுத்திக்கொண்ட
  rationale: ஒருவர் தம்மீது ஒரு கடமையையோ தடையையோ விதித்துக்கொள்ளும் எபிரெய மரபுத்தொடரின் பிரதிபலிப்பு மற்றும் சட்ட வலிமையைத் தருகிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் יהוה என்ற உடன்படிக்கைப் பெயரை தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: יִסְלַח לָהּ
  choice: அவளை மன்னிப்பார்
  rationale: סלח என்பதன் உடன்படிக்கை மற்றும் சட்டச் சூழலுக்குரிய பொருளையும், விளைவைக் கூறும் எதிர்கால உணர்வையும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரைப் பயன்படுத்துவதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: מִבְטָא שְׂפָתֶיהָ என்பதிலுள்ள நுணுக்கம்
  choice: அவளுடைய உதடுகளின் அவசரச் சொல்
  alternative: அவளுடைய உதடுகளின் சொல்; அவளைக் கட்டுப்படுத்தும் உதடுகளின் சொல்
  rationale: சூழல் வாயால் ஏற்றுக்கொண்ட சுயக்கடமையைச் சுட்டுகிறது; ‘அவசர’ என்ற நுணுக்கம் சாத்தியமானது, ஆனால் உறுதியானதல்ல. ஆகவே மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கணவன் செல்லாததாக்கியபின் மன்னிப்பின் பொருள்
  choice: யாவே அவளை மன்னிப்பார்
  alternative: யாவே அவளுக்கு விடுதலை அளிப்பார்
  rationale: மூலத்தின் סלח என்பதைக் ‘மன்னிப்பார்’ என நேரடியாக வைத்திருந்து, குற்றம், அறியாமை அல்லது விடுவிப்பு ஆகியவற்றின் தொடர்பை விளக்கமாகச் சேர்த்து தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தொனியையும் dignified வேதாகம நடையையும் இணைக்கிறது. ‘நேர்த்திக்கடன்’, ‘செல்லாததாக்குதல்’ போன்ற சொற்கள் பொதுவாகப் புரியத்தக்கவையாகவும் சட்டப் பொருளைத் தெளிவாகக் காட்டுவதாகவும் தேர்ந்தெடுக்கப்பட்டன. எபிரெய வாக்கியத்தின் நீளமான அமைப்பு தமிழில் வாசிக்கத்தக்கவாறு ஒழுங்குபடுத்தப்பட்டாலும், நேர்த்திக்கடன் மற்றும் வாயால் ஏற்ற சுயக்கட்டுப்பாடு என்ற இரு கூறுகளும் மாற்றமின்றி வைக்கப்பட்டுள்ளன.
