base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: ta
  text: கொள்ளைநோயில் இறந்தவர்கள் பதினான்காயிரத்து எழுநூறு பேர்; கோராகின் விவகாரத்தில்[a] இறந்தவர்களைத் தவிர.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோராகின் காரணமாக” அல்லது “கோராகின் காரியத்தில்.” இந்தச் சொற்றொடர் கோராகின் கலகத்துடன் தொடர்புடைய முந்தைய மரணங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இறந்தவர்கள் ... பேர்
  rationale: தொடர்ச்சியான கதைநடையில் மொத்த எண்ணிக்கையை அறிமுகப்படுத்தும் வடிவம். எபிரெயத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் தமிழில் அதைச் சேர்க்கவில்லை.
- source_word: הַמֵּתִים
  choice: இறந்தவர்கள்
  rationale: ‘இறந்தோர்’ என்பதைக் காட்டிலும் எண்ணிக்கையுடன் இயல்பாக இணையும், நவீன வாசகர்களுக்குத் தெளிவான பெயரெச்சப் பயன்பாடு.
- source_word: בַּמַּגֵּפָה
  choice: கொள்ளைநோயில்
  rationale: מגפה இங்கு உயிரிழப்பை ஏற்படுத்திய தெய்வீகத் தண்டனையான கொள்ளைநோயைக் குறிக்கிறது; ב־ நிகழ்வு நிகழ்ந்த சூழலைக் காட்டுவதால் ‘-இல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: பதினான்காயிரத்து எழுநூறு
  rationale: எபிரெய எண்ணிக்கையைத் துல்லியமாகவும் வழக்கமான தமிழ் எண்ணியல் நடையிலும் தருகிறது.
- source_word: מִלְּבַד
  choice: இந்த எண்ணிக்கையில் சேர்க்கப்படவில்லை
  rationale: முன்னர் இறந்தவர்கள் 14,700 என்ற மொத்தத்தில் அடங்கவில்லை என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘தவிர’ என்ற பொருளை இயல்பான எண்ணிக்கைச் சூழலில் தருகிறது.
- source_word: עַל דְּבַר קֹרַח
  choice: கோராகு தொடர்பான விவகாரத்தில்
  rationale: சொற்றொடரின் ‘காரணமாக/தொடர்பாக/விவகாரத்தில்’ என்ற பொருள் வரம்பை மிகையாகக் குறுக்காமல், கோராகின் கலகத்தோடு தொடர்புடைய முந்தைய மரணங்களைச் சுட்டுகிறது.
theological_decisions:
- issue: கோராகுடன் தொடர்புடைய மரணங்களின் வரம்பு
  choice: 14,700 கொள்ளைநோய் மரணங்களிலிருந்து, கோராகு தொடர்பான முந்தைய மரணங்களை வேறுபடுத்துதல்
  alternative: ‘கோராகு காரணமாக இறந்தவர்கள்’ என்று நேரடியான காரணத் தொடர்பை வலியுறுத்துதல்
  rationale: עַל דְּבַר קֹרַח முந்தைய நியாயத்தீர்ப்பைச் சுட்டினாலும், இறந்தவர்களின் துணைப்பிரிவுகளையோ காரணத் தொடர்பின் துல்லிய இயல்பையோ இவ்வசனம் மேலும் வரையறுக்கவில்லை. ஆகவே முதன்மை உரை அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குத் தெளிவான தமிழ். ‘இந்த எண்ணிக்கையில் சேர்க்கப்படவில்லை’ என்பது מִלְּבַד என்பதன் எண்ணிக்கை சார்ந்த விலக்கை இயல்பாகத் தெரிவிக்கிறது; அடிப்படை உரையில் இல்லாத கூடுதல் பிரிவுகள் அல்லது கோட்பாட்டு விளக்கங்கள் சேர்க்கப்படவில்லை.
