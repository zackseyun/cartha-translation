  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: ta
  text: சமுதாயத்தினர் மோசேக்கும் ஆரோனுக்கும் எதிராகக் கூடியபோது, அவர்கள் சந்திப்புக் கூடாரத்தை நோக்கித் திரும்பினார்கள். இதோ, மேகம் அதை மூடியது[a]; யாவேயின் மகிமை தோன்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை” என்பது சந்திப்புக் கூடாரத்தைக் குறிப்பதாகவே எபிரேய இலக்கணத்தின்படி மிக இயல்பாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …போது
  rationale: எபிரேயக் கதைத் தொடரில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் அமைப்பு. தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று கூறாமல், காலத்தைக் குறிக்கும் துணைவாக்கியத்துடன் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: மக்கள் சமூகம் … ஒன்றுகூடியபோது
  rationale: ב உடனான வினையெச்சப் பெயர் காலச் சூழலைக் குறிக்கிறது; עֵדָה இஸ்ரயேலரின் கூட்டு மக்கள்சமூகத்தைக் குறிக்கிறது.
- source_word: עַל
  choice: எதிராக
  rationale: இச்சூழலில் சாதாரண திசையையல்ல, மோசேக்கும் ஆரோனுக்கும் எதிரான பகைமையான ஒன்றுகூடுதலைக் குறிக்கிறது.
- source_word: וַיִּפְנוּ
  choice: திரும்பினார்கள்
  rationale: פנה இங்கு உடலால் ஒரு திசையை நோக்கித் திரும்புவதைக் குறிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்திற்கான எபிரேயப் பெயரின் இரு கூறுகளையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் காணப்படும் முக்கிய காட்சியின்மீது கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: כִסָּהוּ
  choice: அதை மூடியது
  rationale: வினையுடன் இணைந்துள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயரை ‘அதை’ என்று வெளிப்படையாகக் காட்டுகிறது; அதன் மிக இயல்பான முன்னிலைச் சொல் ‘கூடாரம்’ ஆகும்.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: தெய்வீகப் பிரசன்னத்தோடு தொடர்புடைய காட்சியாக இருந்தாலும், மூல உரை கூறும் எளிய பெயர்ச்சொல்லையே மொழிபெயர்க்கிறது.
- source_word: וַיֵּרָא
  choice: தோன்றியது
  rationale: ראה என்பதன் நிபால் வடிவம் கண்களுக்குப் புலப்படும் வெளிப்பாட்டைக் குறிக்கிறது; ‘தோன்றியது’ தமிழில் இயல்பானது.
- source_word: כְּבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: தெய்வீக மகிமை வெளிப்பட்டதைச் சுருக்கமாகவும் இறையியல் எடையுடனும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பட்டமல்ல, இறைவனின் தனிப்பெயரே உள்ளது. எனவே அதைத் தனிப்பெயராக ஒலிபெயர்ப்பது உரையின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: כִסָּהוּ என்பதிலுள்ள சுட்டுப்பெயர் எதைக் குறிக்கிறது
  choice: மேகம் சந்திப்புக் கூடாரத்தை மூடியது
  alternative: மேகம் மக்கள் சமூகத்தை அல்லது முழுக் காட்சியிடத்தை மூடியது
  rationale: ஆண்பால் ஒருமை விகுதி, அருகிலுள்ள ஆண்பால் ஒருமைப் பெயரான אֹהֶל (‘கூடாரம்’) என்பதையே மிக இயல்பாகச் சுட்டுகிறது. ஆயினும் சுட்டுப்பெயரின் பொருள் உரையில் பெயரிட்டு மீண்டும் சொல்லப்படாததால், அந்த விளக்கம் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் திடீர் காட்சிச் சுட்டலைப் பாதுகாக்கிறது; ‘யாவே’ தனிப்பெயராக வைக்கப்பட்டுள்ளது.
