translation_notes:
  register: இயல்பான, தற்காலத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் துளிர்–அரும்பு–பூ–முதிர்ந்த கனி என்ற அதிசய வளர்ச்சி வரிசையும் ‘இதோ’ என்ற கவன ஈர்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
