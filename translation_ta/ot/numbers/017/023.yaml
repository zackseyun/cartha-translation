  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: ta
  text: மறுநாள் மோசே சாட்சியின் கூடாரத்திற்குள்[a] சென்றார். இதோ, லேவியின் வீட்டைச் சேர்ந்த[b] ஆரோனின் கோல் துளிர்த்து, மொட்டுகளை விட்டுப் பூத்து, வாதுமைப் பழங்களைப் பழுக்கச் செய்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சான்றின் கூடாரம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “லேவியின் வீட்டைச் சேர்ந்த”; அதாவது, லேவியின் கோத்திரத்தை அல்லது குலத்தைப் பிரதிநிதித்துவப்படுத்தியது.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: தொடர்ச்சியில் வரும் அடுத்த நாளைக் குறிக்கும் எபிரெய காலச்சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֹהֶל הָעֵדוּת
  choice: சாட்சியின் கூடாரம்
  rationale: עֵדוּת என்பதிலுள்ள சட்டபூர்வமான சாட்சி/சான்று என்ற உடன்படிக்கை சார்ந்த நுண்பொருளைப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத அதிசயத்தின்மேல் கவனத்தை ஈர்க்கும் எபிரெய கதைநடைச் சுட்டுச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: מַטֵּה
  choice: கோல்
  rationale: இங்கு தலைவருக்குரிய அடையாளக் கோலைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: פָּרַח
  choice: துளிர்த்திருந்தது
  rationale: பின்வரும் அரும்பு, பூ, முதிர்ந்த கனி என்ற வளர்ச்சி வரிசையின் தொடக்கநிலையைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: לְבֵית לֵוִי
  choice: லேவியின் வீட்டாருக்குரிய
  rationale: ‘லேவியின் வீட்டாருக்காக/வீட்டாருக்குரிய’ என்ற எபிரெய அமைப்பைப் பாதுகாத்து, அந்தக் கோல் லேவியரைச் சார்ந்தது என்பதைச் சொல்கிறது.
- source_word: וַיֹּצֵא פֶרַח
  choice: அரும்புகளை விட்டு
  rationale: கோல் பூப்பதற்கான அடுத்த வளர்ச்சி நிலையைக் குறிக்கும் இயல்பான தாவர உருவகத்தை வழங்குகிறது.
- source_word: וַיָּצֵץ צִיץ
  choice: பூக்களை மலரச் செய்து
  rationale: எபிரெயில் தொடர்ச்சியாக வரும் பூத்தல் நிலையைக் குறித்துச் சொல்லி, முந்தைய துளிர்/அரும்பு நிலையிலிருந்து வேறுபடுத்துகிறது.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: வாதுமைக் கொட்டைகளைப் பழுக்கச் செய்திருந்தது
  rationale: גמל இங்கு வெறும் கனி உண்டாக்குதலை அல்ல, அது முதிர்ந்து பழுத்த நிலையை அடைந்ததைக் குறிக்கிறது; ‘வாதுமை’ என்பது almond என்பதற்கான துல்லியமான தமிழ்ச் சொல்.
