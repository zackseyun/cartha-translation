  - severity: medium
    issue: ‘லேவியின் வீட்டாருக்குரிய’ என்ற சொற்றொடரின் இயல்பின்மை
    rationale: לְבֵית לֵוִי என்பதன் ‘house of Levi’ அமைப்பைச் சுட்ட முயல்கிறது; ஆயினும் ‘வீட்டாருக்குரிய’ என்பது யாருடைய கோல் என்பதில் தடுமாற்றத்தை உண்டாக்கலாம். ‘லேவியின் வீட்டைச் சேர்ந்த’ தெளிவானது.
  - severity: low
