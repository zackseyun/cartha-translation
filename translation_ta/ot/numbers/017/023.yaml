- from: மறுநாள் மோசே சாட்சியின் கூடாரத்திற்குள்[a] சென்றார். இதோ, லேவியின் வீட்டாருக்குரிய[b] ஆரோனின் கோல் துளிர்த்திருந்தது; அது அரும்புகளை விட்டு, பூக்களை மலரச் செய்து, வாதுமைக் கொட்டைகளைப் பழுக்கச் செய்திருந்தது.
  to: மறுநாள் மோசே சாட்சியின் கூடாரத்திற்குள்[a] சென்றார். இதோ, லேவியின் வீட்டைச் சேர்ந்த[b] ஆரோனின் கோல் துளிர்த்து, மொட்டுகளை விட்டுப் பூத்து, வாதுமைப் பழங்களைப் பழுக்கச் செய்திருந்தது.
