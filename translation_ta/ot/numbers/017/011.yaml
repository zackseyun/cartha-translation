  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: ta
  text: அப்போது மோசே ஆரோனிடம், “தூபக்கலசத்தை[a] எடுத்து, பலிபீடத்திலிருந்து நெருப்பை அதில் வைத்து, அதன்மேல் தூபப்பொருளை இடு. பிறகு சபையிடம் விரைந்து சென்று, அவர்களுக்காகப் பாவநிவிர்த்தி செய். ஏனெனில் யாவேயின் சந்நிதியிலிருந்து[b] கடுங்கோபம் புறப்பட்டுவிட்டது; கொள்ளைநோய் தொடங்கிவிட்டது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்புச் சட்டியை.”
    reason: lexical_alternative
  - marker: b
    text: நேர்சொல்லாக, “யாவேயின் முன்னிலையிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: தூபக்கலசம்
  rationale: ஆசாரிய வழிபாட்டில் நெருப்புத் தணலையும் தூபப்பொருளையும் ஏந்தப் பயன்படும் பாத்திரத்தை இயல்பாகக் குறிக்கிறது; ‘நெருப்புச் சட்டி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: பலிபீடத்திலிருந்து நெருப்பை அதில் வைத்து
  rationale: நெருப்பு பலிபீடத்திலிருந்து எடுக்கப்படுவதையும் பாத்திரத்திற்குள் வைக்கப்படுவதையும் இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: வழிபாட்டில் எரிக்கப்படும் தூபத்தைத் தெளிவாகக் குறிக்கும் நவீனத் தமிழ் சொல்.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: விரைந்து சென்று
  rationale: செல்லும்படியான கட்டளையையும் அவசரத்தையும் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: הָעֵדָה
  choice: மக்கள் சபை
  rationale: இஸ்ரவேல் மக்களின் முறையான ஒன்றுகூடலைக் குறிக்கிறது; ‘சபை’ என்ற சொல்லின் தனித்த சமயக் குழு சார்ந்த ஒலியை ‘மக்கள்’ தெளிவுபடுத்துகிறது.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: அவர்களுக்காகப் பாவநிவிர்த்தி செய்
  rationale: ஆசாரியச் சடங்கின் பாவநிவிர்த்தி சார்ந்த வலிமையைத் தக்கவைக்கிறது; ஒரு குறிப்பிட்ட பாவநிவிர்த்திக் கோட்பாட்டை வசனத்தில் புகுத்தவில்லை.
- source_word: הַקֶּצֶף
  choice: கடுங்கோபம்
  rationale: தெய்வீக நியாயத்தீர்ப்பாக வெளிப்படும் தீவிரமான கோபத்தை நவீனத் தமிழில் உணர்த்துகிறது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேயின் சந்நிதியிலிருந்து
  rationale: ‘யாவேயின் முன்னிலையிலிருந்து’ என்ற எபிரெய உருவகத்தை இயல்பான, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உடன்படிக்கைப் பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֵחֵל הַנָּגֶף
  choice: கொள்ளைநோய் தொடங்கிவிட்டது
  rationale: மக்களிடையே தொடங்கிய உயிர்க்கொல்லி தெய்வீகத் தாக்குதலைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: ஆசாரியச் சூழலில் כפר என்ற வினை
  choice: பாவநிவிர்த்தி செய்
  alternative: பரிகாரம் செய்
  rationale: வழிபாட்டுச் செயல் மூலம் மக்களுக்காக நிவிர்த்தி செய்யப்படுவதைக் காக்கிறது; ‘பரிகாரம்’ என்பதுடன் வரக்கூடிய பிற சமயப் பயன்பாட்டு நிழல்களைத் தவிர்க்கிறது.
- issue: מִלִּפְנֵי יְהוָה என்ற சொற்றொடரின் தெய்வீக முன்னிலை உருவகம்
  choice: யாவேயின் சந்நிதியிலிருந்து
  alternative: யாவேயிடமிருந்து
  rationale: கோபம் யாவேயிடமிருந்து வந்தது என்பதோடு, ‘அவர் முன்னிலையிலிருந்து’ என்ற மூலத்தின் இடவுருவகத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆசாரிய வழிபாட்டுச் சொற்களின் தனித்துவம் காக்கப்பட்டுள்ளதுடன், கட்டளைகளின் அவசரமும் இறுதிக் கூறின் தீவிரமும் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளன.
