reference: Numbers 17:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶלְעָזָ֣ר הַ/כֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַ/נְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַ/שְּׂרֻפִ֑ים וַֽ/יְרַקְּע֖וּ/ם צִפּ֥וּי לַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: ta
  text: ஆசாரியனாகிய எலெயாசார், எரிக்கப்பட்டவர்கள்[a] செலுத்தியிருந்த வெண்கலத் தூபக்கலசங்களை[b] எடுத்தார்; அவை பலிபீடத்திற்கான மூடுதகடாக[c] அடித்துத் தட்டப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘எரிக்கப்பட்டவர்கள்’ அல்லது ‘எரிந்து போனவர்கள்’; முந்தைய நிகழ்வில் நெருப்பால் அழிக்கப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தூபக்கலசங்கள்’ என்பதற்குப் பதிலாக ‘நெருப்புத்தட்டுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மூடுதகடு’ என்பதற்குப் பதிலாக ‘மேலுறை’ அல்லது ‘முலாம் பூச்சு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: தூபக்கலசங்கள்
  rationale: எரியும் தணலையும் தூபத்தையும் ஏந்திப் படைப்பதற்குப் பயன்படுத்தப்பட்ட வழிபாட்டுக் கலன்களைச் சூழலுக்கேற்றவாறு குறிக்கிறது; ‘நெருப்புத்தட்டுகள்’ என்ற மாற்றும் சாத்தியம்.
- source_word: הַנְּחֹשֶׁת
  choice: வெண்கல
  rationale: נְחֹשֶׁת என்பது செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; திருக்கூடாரப் பொருட்களின் இச்சூழலில் ‘வெண்கலம்’ மரபானதும் பொருத்தமானதும் ஆகும்.
- source_word: הִקְרִיבוּ
  choice: செலுத்தியிருந்த
  rationale: வழிபாட்டு அல்லது பலியிடும் சூழலில் ‘காணிக்கையாகச் செலுத்துதல்’ என்ற பொருளைத் தருகிறது; முன்பு நிகழ்ந்த செயலை ‘இருந்த’ வடிவம் தெளிவாக்குகிறது.
- source_word: הַשְּׂרֻפִים
  choice: எரிக்கப்பட்டவர்கள்
  rationale: שׂרף என்பதன் செயப்பாட்டு எச்ச வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; முந்தைய நிகழ்வில் நெருப்பால் அழிக்கப்பட்டவர்களைக் குறிக்கிறது.
- source_word: וַיְרַקְּעוּם
  choice: அவை ... அடித்துத் தட்டப்பட்டன
  rationale: உலோகத்தை அடித்துத் தகடாக்கும் செயலைக் குறிக்கிறது. எபிரெய வடிவத்தில் பன்மை எழுவாயும் பன்மைச் செயப்படுபொருள் பின்னொட்டும் உள்ளதால் செய்பவர் தெளிவாக அடையாளப்படுத்தப்படவில்லை; தமிழ்ச் செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: צִפּוּי
  choice: மூடுதகடு
  rationale: பலிபீடத்தை மூடும் உலோகப் படலம் அல்லது மேலுறை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לַמִּזְבֵּחַ
  choice: பலிபீடத்திற்கான
  rationale: 'ל என்ற முன்னொட்டு இங்கு நோக்கம் அல்லது பயன்பாட்டைக் குறிக்கிறது: தட்டப்பட்ட உலோகம் பலிபீடத்திற்கான மூடுதகடானது.'
theological_decisions:
- issue: எரிக்கப்பட்டவர்களின் அடையாளம்
  choice: பெயரிட்டு விளக்காமல் ‘எரிக்கப்பட்டவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கோராகுவின் கூட்டத்தார்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: முந்தைய நிகழ்வு யாரைக் குறிக்கிறது என்பதைச் சூழல் காட்டினாலும், இவ்வசனத்தின் எபிரெய உரை பெயரைச் சேர்க்கவில்லை; ஆகவே உரைக்கு அப்பாற்பட்ட விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடித்துத் தட்டப்பட்டன’ என்ற செயப்பாட்டு அமைப்பு, செய்பவரைத் தீர்மானிக்காமல் எபிரெய உரையின் தொடரியல் தெளிவின்மையைப் பாதுகாக்கிறது.
