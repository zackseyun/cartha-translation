    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசிக் கூறினார்
  rationale: வாவ்-தொடர்நிலை கதைநடையை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ அந்த முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது. דִּבֵּר என்பதன் ‘பேசுதல்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பெயரான நான்கு எழுத்துப் பெயர் (YHWH). அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் இயல்பாக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு மோசேயை நோக்கிச் செலுத்தப்படுவதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லாடலை இயல்பான தமிழ் நடைமுறையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது. எனவே அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான வேதாகமக் கதைநடை. ‘பேசிக் கூறியதாவது’ என்பது דִּבֵּר மற்றும் לֵאמֹר ஆகிய இரண்டின் செயல்பாட்டையும் சுருக்கமாகக் காக்கிறது.
