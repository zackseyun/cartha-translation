reference: Numbers 17:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: ta
  text: யாவே தனக்குக் கட்டளையிட்டபடியே மோசே செய்தார்; அப்படியே செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. இங்கு கட்டளைக்குக் கீழ்ப்படிந்து நிறைவேற்றுவதைக் குறிப்பதால் ‘செய்தார்’ இயல்பானதும், இறுதியில் வரும் அதே வினையின் மீளுரைப்பையும் காப்பதும் ஆகும்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: כַּאֲשֶׁר
  choice: படியே
  rationale: கட்டளையுடன் துல்லியமான ஒத்திசைவைச் சுட்டும் ஒப்புமைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதிலுள்ள அதிகாரப்பூர்வ ஆணையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: אֹתוֹ
  choice: தனக்கு
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் மோசேயைக் குறிக்கிறது; ‘கட்டளையிட்டார்’ என்பதோடு இயல்பான தமிழில் மறைமுக வேற்றுமையாக ‘தனக்கு’ என்று வருகிறது.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முந்தைய கூற்றை மீண்டும் எடுத்துக் கூறி, கட்டளையின்படியே நடந்ததை வலியுறுத்துகிறது.
- source_word: עָשָׂה
  choice: அவர் செய்தார்
  rationale: மூலத்தில் עשה மீண்டும் வருவதால் உருவாகும் திட்டமிட்ட வலியுறுத்தலைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராகவே தரப்பட்டது; ‘யெகோவா’ என்பது சாதாரண தமிழ் வாசகர்களிடம் பரவலாக அறியப்பட்ட வடிவம்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். ஒரே வினையை இருமுறை கூறும் எபிரெய வலியுறுத்தல் இயல்பான தமிழில் திட்டமிட்டே தக்கவைக்கப்பட்டுள்ளது.
