id: NUM.17.6
reference: Numbers 17:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: ta
  text: ஆனால் மறுநாளில், இஸ்ரவேல் மக்களின் சபையினர் அனைவரும் மோசேக்கும் ஆரோனுக்கும் எதிராக முறுமுறுத்து, “நீங்கள் யாவேயின் மக்களைக் கொன்றுவிட்டீர்கள்” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: முறுமுறுத்து
  rationale: לון என்ற வினை வனாந்தர நிகழ்வுகளில் தலைவர்களுக்கு எதிரான கூட்டான அதிருப்தியையும் குறைகூறுதலையும் குறிக்கிறது; ‘முறுமுறுத்து’ என்பது அந்தத் தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபையார் அனைவரும்
  rationale: עֵדָה என்பதன் கூட்டுச் சமூகப் பொருளை ‘சபையார்’ காக்கிறது. בְּנֵי יִשְׂרָאֵל என்பது இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதால், தமிழில் தவறாக ஆண் மக்களை மட்டும் குறிப்பதாகத் தோன்றாத ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִמָּחֳרָת
  choice: மறுநாளில்
  rationale: ‘அடுத்த நாளில்’ என்ற காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: மோசேக்கும் ஆரோனுக்கும் எதிராக
  rationale: மூலத்தில் עַל இருமுறை வருவது இரு தலைவர்களும் தனித்தனியே குற்றச்சாட்டின் இலக்குகள் என்பதை வலியுறுத்துகிறது; தமிழில் இணைப்புடன் ‘எதிராக’ இருவரையும் தெளிவாகச் சார்கிறது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான தமிழ் உரையாடல் வடிவில் அளிக்கிறது.
- source_word: אַתֶּם הֲמִתֶּם
  choice: நீங்கள்தான் … கொன்றுவிட்டீர்கள்
  rationale: இரண்டாம் நபர் பன்மையையும், מות வேரின் causative வடிவிலுள்ள நேரடியான ‘கொல்லச் செய்தீர்கள்/கொன்றீர்கள்’ என்ற குற்றச்சாட்டையும் காக்கிறது. ‘தான்’ குற்றஞ்சாட்டும் அழுத்தத்தைக் காட்டுகிறது; ‘விட்டீர்கள்’ முடிந்த செயலின் தற்போதைய விளைவை உணர்த்துகிறது.
- source_word: עַם יְהוָה
  choice: யாவேயின் மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்திற்கும் தெய்வீகப் பெயருக்கும் உள்ள உரிமை/உறவுப் பொருளை இயல்பான தமிழ் உடைமை வேற்றுமையில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக உள்ள יהוה என்ற தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ அதைத் தனிப்பெயராகக் காக்கிறது; ‘கர்த்தர்’ என்பது மரபான பதிலீடாக இருந்தாலும் மூலத்தின் பெயர்/பட்டம் வேறுபாட்டை மறைக்கும்.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகச் சுட்டு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்த நிலையான எபிரெயச் சொற்றொடர் வம்சச் சமூகமான இஸ்ரவேலரை—ஆண்களை மட்டும் அல்ல—குறிக்கிறது. ‘மக்கள்’ என்பது அதன் உண்மையான குறிப்பைத் தமிழில் தெளிவாகத் தருகிறது; சொற்சொற் வடிவான ‘மகன்கள்’ தேவையற்ற பாலினக் கட்டுப்பாட்டை உண்டாக்கும்.
- issue: הֲמִתֶּם என்ற causative குற்றச்சாட்டின் வலிமை
  choice: கொன்றுவிட்டீர்கள்
  alternative: சாகச் செய்தீர்கள்
  rationale: இரண்டும் causative பொருளைத் தரக்கூடும். சூழலில் சபையார் மோசே மற்றும் ஆரோன் மீது நேரடியாகச் சுமத்தும் கடுமையான குற்றச்சாட்டை ‘கொன்றுவிட்டீர்கள்’ இயல்பாகவும் வலுவாகவும் வெளிப்படுத்துகிறது; அவர்களே உடல்ரீதியாகச் செய்தார்கள் என்ற மேலதிக விளக்கத்தை உரை தானாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், குற்றச்சாட்டின் கடுமையும் கூட்டுச் சமூகத் தொனியும் குறையாத வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது.
