revisions:
- from: ஆனால் மறுநாளில், இஸ்ரவேல் மக்களின் சபையார் அனைவரும் மோசேக்கும் ஆரோனுக்கும் எதிராக முறுமுறுத்து, “நீங்கள்தான் யாவேயின் மக்களைக் கொன்றுவிட்டீர்கள்” என்றார்கள்.
  to: ஆனால் மறுநாளில், இஸ்ரவேல் மக்களின் சபையினர் அனைவரும் மோசேக்கும் ஆரோனுக்கும் எதிராக முறுமுறுத்து, “நீங்கள் யாவேயின் மக்களைக் கொன்றுவிட்டீர்கள்” என்று கூறினார்கள்.
  rationale: The revision retains the source’s collective subject, accusation against Moses and Aaron, and direct charge of killing Yahweh’s people. It removes the unsupported exclusive emphasis of ‘தான்’ and improves modern Tamil syntax and idiom without adding interpretation.
