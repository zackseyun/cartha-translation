source:
  edition: WLC
  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: ta
  text: அப்பொழுது மோசே அந்தக் கோல்களை யாவேக்கு முன்பாகச் சாட்சியின் கூடாரத்தில்[a][b] வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கோல்கள்’ என்பதை ‘தடிகள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல், கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்திய உண்மையான கோல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சாட்சியின் திருக்கூடாரம்’ என்றும் மொழிபெயர்க்கலாம். நேரடியாக, ‘சாட்சியின் கூடாரம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: வைத்தார்
  rationale: נוח என்பதன் இப்பிறவினை வடிவம் ஓர் பொருளை ஓரிடத்தில் வைப்பதைக் குறிக்கிறது. ‘வைத்தார்’ என்பது செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: הַמַּטֹּת
  choice: அந்தக் கோல்கள்
  rationale: מַטֶּה என்பது சூழலுக்கேற்ப ‘கோல்,’ ‘தடி,’ அல்லது ‘கோத்திரம்’ எனப் பொருள்படலாம். இங்கு கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்திய உண்மையான கோல்களே குறிக்கப்படுகின்றன; முந்தைய சூழலில் குறிப்பிடப்பட்டவற்றைச் சுட்டுவதால் ‘அந்தக்’ சேர்க்கப்பட்டது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இது நேரடியாக ‘முன்னிலையில்/முன்பாக’ இருப்பதைக் குறிக்கிறது. இங்கு யாவேயின் சந்நிதியில் அவற்றை வைப்பது என்ற பொருளை ‘முன்பாக’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பொன்றால் மாற்றாமல், எபிரெய வேதத்தில் உள்ள இறைபெயர் יהוה தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּאֹהֶל
  choice: கூடாரத்தில்
  rationale: אֹהֶל என்பதன் அடிப்படைப் பொருள் ‘கூடாரம்.’ ஆலயக்கூடாரத்தைக் குறித்தாலும், மூலமொழியின் உருவகத்தை இத்தேர்வு நேரடியாகப் பாதுகாக்கிறது.
- source_word: הָעֵדֻת
  choice: சாட்சியின்
  rationale: עֵדוּת என்பது உடன்படிக்கைச் சாட்சியைக், குறிப்பாக சாட்சிப் பலகைகளோடு தொடர்புடைய சாட்சியைக் குறிக்கிறது. ‘சாட்சியின் கூடாரம்’ என்ற உடைமைத் தொடர் எபிரெய அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பட்ட இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘சாட்சி’ என்பது எதைக் குறிக்கிறது
  choice: சாட்சியின் கூடாரம்
  alternative: சாட்சிப்பெட்டி இருந்த கூடாரம்; உடன்படிக்கை ஆவணத்தின் கூடாரம்
  rationale: הָעֵדֻת என்பதன் குறிப்பிட்ட தொடர்பை விளக்கத்தின் மூலம் குறுக்கிவிடாமல், மூலத்திலுள்ள சுருக்கத்தையும் சாத்தியமான பொருள் பரப்பையும் ‘சாட்சி’ என்ற சொல்லில் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சியின் கூடாரம்’ மூல எபிரெயத் தொடரை நேரடியாக வைத்திருக்கிறது; ‘யாவே’ இறைபெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிக் குறிகள் தொடர்புடைய சொற்றொடருக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
