revisions:
- from: இஸ்ரவேல் மக்களுக்கு நினைவூட்டலாக[a] இருக்கவும், ஆரோனின் சந்ததியைச் சேர்ந்திராத வேறு எவனும்[b] யாவேக்கு முன்பாகத் தூபம் செலுத்த நெருங்காமலும், கோராகைப் போலவும் அவனுடைய கூட்டத்தாரைப் போலவும் ஆகாமலும் இருக்கும்படி இது செய்யப்பட்டது—யாவே மோசேயின் மூலமாக[c] அவனிடம்[d] பேசியபடியே.
  to: இஸ்ரவேல் மக்களுக்கு நினைவூட்டலாக[a] இருக்கும்படி, ஆரோனின் சந்ததியைச் சேர்ந்திராத அதிகாரமற்ற எவரும்[b] யாவேயின் முன்னிலையில் தூபம் செலுத்த நெருங்காமலும், கோரகையும் அவன் கூட்டத்தையும் போல ஆகாதபடியும்—யாவே மோசேயின் மூலமாக அவனிடம்[d] பேசியபடியே[c].
  rationale: The revision removes the added clause ‘இது செய்யப்பட்டது,’ preserving the verse as a purpose-dependent continuation of its context. It clarifies the cultically unauthorized sense of זָר, improves the Tamil comparison with Korah and his assembly, and keeps the final pronoun’s ambiguity. Footnote anchors are retained and placed beside the respective translated elements.
  reviewer_model: gpt-5.6-terra
