  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களுக்கு நினைவூட்டலாக[a] இருக்கும்படி, ஆரோனின் சந்ததியைச் சேர்ந்திராத அதிகாரமற்ற எவரும்[b] யாவேயின் முன்னிலையில் தூபம் செலுத்த நெருங்காமலும், கோரகையும் அவன் கூட்டத்தையும் போல ஆகாதபடியும்—யாவே மோசேயின் மூலமாக அவனிடம்[d] பேசியபடியே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நினைவுச்சின்னம்’ அல்லது ‘நினைவுகூரச் செய்யும் ஒன்று’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘அதிகாரமற்ற எவரும்’ என்பது இனத்தால் அந்நியரைக் குறிக்கவில்லை; ஆரோனின் வம்சத்தாருக்கு உரிய ஆசாரியச் சேவைக்கு அதிகாரம் பெறாத ஒருவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில், ‘மோசேயின் கையால்’; இது ‘மோசேயின் மூலமாக’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: d
    text: ‘அவனிடம்’ என்பது பெரும்பாலும் ஆரோனைக் குறிப்பதாக இருக்கலாம்; ஆனால் எபிரெய உரை சுட்டுப்பொருளை வெளிப்படையாகப் பெயரிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: நினைவூட்டல்
  rationale: நினைவில் நிறுத்த உதவும் அடையாளம் அல்லது நினைவுச்சின்னம் என்ற பொருளைக் கொண்டது; இந்த எச்சரிக்கைச் சூழலில் ‘நினைவூட்டல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: எல்லா இஸ்ரவேலரையும் குறிக்கும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ זָר
  choice: வேறு எவனும்
  rationale: இங்கு இனத்தால் அந்நியனைக் குறிக்காமல், ஆரோனின் ஆசாரிய வம்சத்துக்கு வெளியே இருப்பவரைக் குறிக்கிறது; தொடர்ந்துவரும் உறவுச்சொற்றொடர் அதன் எல்லையைத் தெளிவாக்குகிறது.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: ஆரோனின் சந்ததியைச் சேர்ந்திராத
  rationale: זֶרַע என்பதன் வம்சவழிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: தூபம் செலுத்த
  rationale: ஆசாரிய வழிபாட்டுச் செயலைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ்ச் சொற்றொடர்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: தெய்வீக நாமத்தை ஒலிபெயர்த்து, வழிபாட்டுச் சூழலிலுள்ள ‘முன்னிலையில்’ என்ற இடப்பொருளையும் காக்கிறது.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: கோராகைப் போலவும் அவனுடைய கூட்டத்தாரைப் போலவும் ஆகாமலும்
  rationale: கோராகின் முன்மாதிரியையும் அவன் குழுவின் கதியையும் பகிராதிருக்க வேண்டிய எச்சரிக்கையை வெளிப்படுத்துகிறது; עֵדָה இங்கு ‘கூட்டத்தார்’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה בְּיַד מֹשֶׁה לוֹ
  choice: யாவே மோசேயின் மூலமாக அவனிடம் பேசியபடியே
  rationale: בְּיַד מֹשֶׁה என்ற கருவி/இடைமுக மரபுத்தொடரை இயல்பான தமிழில் ‘மோசேயின் மூலமாக’ என வழங்கி, לוֹ என்பதன் வெளிப்படையாகக் குறிப்பிடப்படாத சுட்டுப்பொருளை ‘அவனிடம்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீக நாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கை நாமத்தை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִישׁ זָר என்பதன் ஆசாரியச் சூழல் பொருள்
  choice: ஆரோனின் சந்ததியைச் சேர்ந்திராத வேறு எவனும்
  alternative: அந்நியன்; வெளிநாட்டவன்
  rationale: இந்தத் தடை இன அடையாளத்தைப் பற்றியது அல்ல; ஆரோனின் வம்சத்துக்கு வழங்கப்பட்ட ஆசாரியச் சேவைக்குப் புறம்பான ஒருவரைப் பற்றியது.
- issue: לוֹ என்பதன் சுட்டுப்பொருள்
  choice: அவனிடம் என்று தெளிவுபடுத்தாமல் வைத்தல்
  alternative: ஆரோனிடம்
  rationale: சூழலில் ஆரோன் சாத்தியமான முன்னிலைச் சுட்டுப்பொருளாக இருந்தாலும், எபிரெய உரை பெயரை மீண்டும் குறிப்பிடவில்லை; ஆகவே உண்மையான இலக்கணத் தெளிவின்மையை முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூல வசனம் முந்தைய செயலின் நோக்கத்தைத் தொடரும் அமைப்பில் இருப்பதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘இது செய்யப்பட்டது’ சேர்க்கப்பட்டது. வழிபாட்டு நுணுக்கத்தைப் பாதுகாக்க ‘தூபம் செலுத்த’, ‘யாவேக்கு முன்பாக’ ஆகிய சொற்றொடர்கள் பயன்படுத்தப்பட்டன.
