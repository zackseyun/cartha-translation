review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central cultic restriction and retains the unresolved antecedent of לוֹ. However, ‘இது செய்யப்பட்டது’ adds an explicit verbal assertion not present in this verse (though the verse continues the preceding context), and ‘வேறு எவனும்’ does not clearly convey the priestly sense of אִישׁ זָר.
  naturalness: The revised wording uses a more idiomatic Tamil purpose construction, avoids the awkward comparison ‘அவனுடைய கூட்டத்தாரைப் போலவும்,’ and renders the cultic spatial phrase as ‘யாவேயின் முன்னிலையில்.’
  terminology: ‘அதிகாரமற்ற எவரும்’ appropriately expresses the context-specific sense of זָר without implying ethnic foreignness. ‘ஆரோனின் சந்ததியைச் சேர்ந்திராத’ retains the explicit lineage qualification. ‘தூபம் செலுத்த’ is retained as established Tamil cultic terminology; ‘கூட்டம்’ naturally renders Korah’s assembly/company.
  issues:
  - severity: medium
    issue: Unsupported addition of ‘இது செய்யப்பட்டது’
    rationale: The Hebrew verse is a continuation whose initial nominal phrase depends on the preceding verse; it does not itself state ‘this was done.’ Tamil can preserve the dependent purpose structure without supplying that assertion.
  - severity: medium
    issue: ‘வேறு எவனும்’ inadequately renders אִישׁ זָר
    rationale: ‘வேறு’ primarily means ‘other,’ whereas the Hebrew priestly-context term denotes someone unauthorized to perform the service. ‘அதிகாரமற்ற எவரும்’ states the contextual restriction while the following lineage clause preserves its basis.
  - severity: low
    issue: Comparison with Korah’s group is unnatural in the draft
    rationale: ‘கோராகைப் போலவும் அவனுடைய கூட்டத்தாரைப் போலவும் ஆகாமல்’ is understandable but stylistically strained. ‘கோரகையும் அவன் கூட்டத்தையும் போல ஆகாதபடி’ is natural and preserves the twofold comparison.
  revised_text: இஸ்ரவேல் மக்களுக்கு நினைவூட்டலாக[a] இருக்கும்படி, ஆரோனின் சந்ததியைச் சேர்ந்திராத அதிகாரமற்ற எவரும்[b] யாவேயின் முன்னிலையில் தூபம் செலுத்த நெருங்காமலும், கோரகையும் அவன் கூட்டத்தையும் போல ஆகாதபடியும்—யாவே மோசேயின் மூலமாக அவனிடம்[d] பேசியபடியே[c].
