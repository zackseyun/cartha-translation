translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தந்தைவழிக் குடும்பம்’ என்பது בֵּית אָבוֹת என்ற உறவுமுறைச் சொல்லின் வரலாற்று-சமூகப் பொருளைத் தெளிவாகக் காக்கிறது; பகிர்ந்தளிக்கும் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
