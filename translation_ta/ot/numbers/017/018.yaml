  source_fidelity: முதன்மை மொழிபெயர்ப்பு எபிரேய உரையின் கட்டளை, ஆரோனின் பெயர், லேவியின் கோல், மற்றும் ஒரு கோல்/தந்தைவழிக் குடும்பத் தலைவர் என்ற கூறுகளைத் துல்லியமாகக் கொண்டுள்ளது. ஆனால் וְ என்ற தொடர்ச்சிச் சொல்லைத் தமிழில் விடுத்திருப்பதால், முந்தைய கட்டளையோடு உள்ள இணைப்பு வெளிப்படவில்லை. அதை “மேலும்” எனச் சேர்ப்பது பாதுகாப்பானதும் மூலத்திற்கு நெருக்கமானதும் ஆகும்.
