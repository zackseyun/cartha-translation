base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: ta
  text: மேலும், லேவியின் கோலில் ஆரோனின் பெயரை எழுதுவாயாக. ஏனெனில், அவர்களுடைய தந்தைவழிக் குடும்பத்தின் தலைவனுக்கு ஒரு கோல் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய ஒவ்வொரு தந்தைவழிக் குடும்பத் தலைவனுக்கும் ஒவ்வொரு கோல் இருக்க வேண்டும்.” எபிரெயச் சொற்றொடரைப் பகிர்ந்தளிக்கும் பொருளில் புரிந்துகொள்ளலாம்; அதன்படி ஒவ்வொரு தந்தைவழிக் குடும்பத் தலைவனுக்கும் ஒரு கோல் பிரதிநிதித்துவம் செய்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: மேலும்
  rationale: וְ முந்தைய வசனத்திலுள்ள கட்டளையின் தொடர்ச்சியைக் குறிக்கிறது; אֵת என்பது நேரடி செயப்படுபொருள் குறியீடாக இருப்பதால் தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: שֵׁם אַהֲרֹן
  choice: ஆரோனின் பெயர்
  rationale: தனிப்பட்ட பெயரை அந்தக் கோலில் பொறிக்க அல்லது எழுத வேண்டியதைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: תִּכְתֹּב
  choice: எழுதுவாயாக
  rationale: Qal imperfect 2ms இங்கு மோசேயிடம் கூறப்படும் நேரடிக் கட்டளையாகச் செயல்படுகிறது; மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் உள்ள கட்டளை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל מַטֵּה לֵוִי
  choice: லேவியின் கோலில்
  rationale: மַטֶּה என்பது இங்கு உண்மையான கோலையும் அது பிரதிநிதித்துவப்படுத்தும் கோத்திரத்தையும் குறிக்கிறது. ‘கோல்’ இந்த இரு தொடர்புகளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆரோனின் பெயரை லேவியின் கோலில் எழுத வேண்டியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מַטֶּה אֶחָד
  choice: ஒரு கோல்
  rationale: ஒவ்வொரு பிரதிநிதித் தலைவருக்கும் ஒரே ஒரு கோல் என்ற எண்ணத்தை எளிமையாக வெளிப்படுத்துகிறது.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பத்தின் தலைவனுக்கு
  rationale: רֹאשׁ சமூக அலகின் தலைவனைக் குறிக்கிறது; בֵּית אֲבוֹתָם என்பது தந்தைவழி மரபை அடிப்படையாகக் கொண்ட குடும்ப அல்லது குல அலகைக் குறிக்கும். சொற்றொடரின் தன்மை ஒருமை அல்லது பகிர்ந்தளிக்கும் பொருள் கொள்ளக்கூடியதால், முதன்மை உரையில் அதன் வடிவம் நெருக்கமாகப் பாதுகாக்கப்பட்டது.
