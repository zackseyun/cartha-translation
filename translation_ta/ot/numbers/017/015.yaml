  terminology: “சந்திப்புக் கூடாரம்” is a transparent and suitable rendering of אֹהֶל מוֹעֵד. “கொள்ளைநோய்” is an intelligible modern rendering of הַמַּגֵּפָה in this context. “நிறுத்தப்பட்டது” appropriately preserves the passive sense of נֶעֱצָרָה.
