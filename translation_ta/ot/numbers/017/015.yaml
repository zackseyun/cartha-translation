id: NUM.17.15
reference: Numbers 17:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: ta
  text: பின்பு ஆரோன் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் இருந்த மோசேயிடம் திரும்பினார்; கொள்ளைநோய் நிறுத்தப்பட்டது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடக்கப்பட்டது” அல்லது “தடுத்து நிறுத்தப்பட்டது.”
    reason: நிறுத்துதல், அடக்குதல், கட்டுப்படுத்துதல் ஆகிய பொருள் நிழல்களை נֶעֱצָרָה தாங்கக்கூடும்.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: பின்பு … திரும்பினார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; שׁוּב இங்கு ஓர் இடத்திற்குத் திரும்புவதைக் குறிக்கிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל என்பது மோசேயை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘மோசேயிடம்’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் இருந்த
  rationale: פֶּתַח என்பது நுழைவாயில் அல்லது திறப்பு. தொடர்ச்சியாக வரும் இரண்டு אֶל சொற்றொடர்களின் பொருளை இயல்பான தமிழில் தெரிவிக்க, மோசே இருந்த இடமாக இது அமைக்கப்பட்டுள்ளது. אֹהֶל מוֹעֵד என்பதற்கு வெளிப்படையான ‘சந்திப்புக் கூடாரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַמַּגֵּפָה
  choice: கொள்ளைநோய்
  rationale: מַגֵּפָה இச்சூழலில் உயிரிழப்பை உண்டாக்கும் தெய்வீகத் தண்டனையான plague-ஐக் குறிக்கிறது; ‘கொள்ளைநோய்’ தெளிவான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: נֶעֱצָרָה
  choice: நிறுத்தப்பட்டது
  rationale: עצר என்பதன் நிஃபால் வடிவம் கொள்ளைநோய் முடிவுக்குக் கொண்டுவரப்பட்டதைத் தெரிவிக்கிறது. தமிழ் செயப்பாட்டு வடிவம் எபிரெய வடிவத்தையும் வெளிப்படையாகக் கூறப்படாத செயற்பாட்டாளரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: கொள்ளைநோயை நிறுத்திய மறைமுகத் தெய்வீகச் செயற்பாடு
  choice: ‘கொள்ளைநோய் நிறுத்தப்பட்டது’ என்ற செயப்பாட்டு வடிவத்தைப் பேணுதல்
  alternative: ‘கர்த்தர் கொள்ளைநோயை நிறுத்தினார்’
  rationale: உடனடிச் சூழலில் இறைவனின் செயற்பாடு புரிந்துகொள்ளப்பட்டாலும், எபிரெய வாக்கியம் செயற்பாட்டாளரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மொழிபெயர்ப்பு இறைவனை எழுவாயாகச் சேர்க்காமல் மூலத்தின் கட்டுப்பாட்டையும் பொருள் நெருக்கடியையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’ மூலச் சொல்லின் பொருளை வெளிப்படையாகக் காட்டுகிறது; ‘வாதை’ போன்ற பழமையான சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும் ‘கொள்ளைநோய்’ பயன்படுத்தப்பட்டுள்ளது.
