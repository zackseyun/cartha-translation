id: NUM.17.20
reference: Numbers 17:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: ta
  text: நான் தேர்ந்தெடுக்கும் மனிதனின் கோல் துளிர்க்கும்; இஸ்ரவேல் மக்கள் உங்களுக்கு எதிராக முறுமுறுத்துச் சொல்லும் முறையீடுகளை என்மேலிருந்து நீக்குவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: நான் தேர்ந்தெடுக்கும்... துளிர்க்கும்
  rationale: எதிர்கால நிகழ்வை இயல்பான நவீனத் தமிழில் கூறுகிறது; தனியாக ஒரு கனமான அறிமுகச் சொற்றொடரைச் சேர்க்காமல் எபிரெய அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: நான் தேர்ந்தெடுக்கும் மனிதன்
  rationale: ஆண்பால் ஒருமையையும் கடவுளின் தேர்வையும் நேரடியாகக் காக்கிறது.
- source_word: מַטֵּהוּ
  choice: அவனுடைய கோல்
  rationale: உடைமைப் பின்னொட்டை வெளிப்படையாகக் காட்டுகிறது; சூழலில் இது கோத்திரத் தலைவரின் அடையாளக் கோல்.
- source_word: יִפְרָח
  choice: துளிர்க்கும்
  rationale: உயிரற்ற கோலில் புதுவளர்ச்சி தோன்றுவதைக் குறிக்கிறது; அடுத்த வசனத்தில் வரும் விரிவான மலர்தல் மற்றும் கனிதல் நிகழ்வுகளை முன்கூட்டியே ஒன்றாக்குவதில்லை.
- source_word: וַהֲשִׁכֹּתִי
  choice: ஓயச்செய்வேன்
  rationale: שׁכך என்பதன் காரணவினை அர்த்தமான அடங்கச் செய்தல் அல்லது நிறுத்துதல் என்பதைச் சுருக்கமாகத் தருகிறது.
- source_word: מֵעָלַי
  choice: என்மேலிருந்து
  rationale: மூலத்தின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது; 'எனக்கு எதிரான' என்று பொருளை மட்டும் தீர்மானித்து விடுவதில்லை.
- source_word: תְּלֻנּוֹת
  choice: முறையீடுகள்
  rationale: மக்களின் எதிர்ப்பான புகார்களை இயல்பான தமிழில் குறிக்கிறது; தொடர்புடைய வினையின் தொடர்ச்சியான முறுமுறுப்பை அடுத்த சொல் தனியே காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு முழு சமூகத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: מַלִּינִם עֲלֵיכֶם
  choice: உங்களுக்கு எதிராக முறுமுறுக்கும்
  rationale: நடந்துகொண்டிருக்கும் பகைமையான முறுமுறுப்பையும் அதன் இலக்கான பன்மை 'உங்களையும்' காக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டு அடையாளம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: சூழலில் ஆண் சந்ததியினரை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகத்தையே குறிக்கிறது; இயல்பான தமிழ் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- issue: מֵעָלַי என்பதன் தொடர்பு
  choice: என்மேலிருந்து
  alternative: எனக்கு எதிரான
  rationale: எபிரெய முன்னிடைச்சொல்லின் உருவகத்தைப் பாதுகாத்து, புகார்கள் கடவுளுக்கு எதிரானவையா அல்லது அவர்மேல் சுமையாக இருப்பவையா என்ற நுண்மையைத் தேவையின்றித் தீர்மானிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. மூலத்தின் ஒருமை/பன்மை வேறுபாடுகளும், கடவுளிடமிருந்து புகார்கள் அகற்றப்படுகின்றன என்ற உருவகமும் காக்கப்பட்டுள்ளன.
