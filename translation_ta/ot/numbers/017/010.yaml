base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: ta
  text: “இந்தச் சபையின் நடுவிலிருந்து விலகி நில்லுங்கள்[a]; நான் அவர்களை ஒரு கணத்தில் அழித்துவிடுவேன்[b].” அவர்கள் முகங்குப்புற விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘இந்தச் சபையின் நடுவிலிருந்து எழுந்திருங்கள்’; அல்லது, ‘இந்தக் கூட்டத்தாரிடமிருந்து உங்களைப் பிரித்துக்கொள்ளுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு நொடியில் அவர்களை முற்றாக ஒழித்துவிடுவேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: விலகி நில்லுங்கள்
  rationale: ரום என்பதன் நிஃபால் பன்மை ஏவல் வடிவம் சொற்படியாக ‘உயர்த்தப்படுங்கள்/எழுந்திருங்கள்’ எனினும், இச்சூழலில் சபையின் நடுவிலிருந்து அகன்று நிற்கும்படி கட்டளையிடும் மரபுத்தொடராகச் செயல்படுகிறது. நவீன தமிழில் ‘விலகி நில்லுங்கள்’ அதன் சூழல்சார் பொருளையும் அவசரத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִתּוֹךְ
  choice: நடுவிலிருந்து
  rationale: ஒரு குழுவின் உள்ளேயிருந்து பிரிந்து வெளியேறுவதைக் குறிக்கும் எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: הָעֵדָה הַזֹּאת
  choice: இந்தச் சபை
  rationale: עֵדָה இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ அதன் கூட்டு அடையாளத்தைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது; குறிப்பிட்ட வழிபாட்டு அமைப்பாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: וַאֲכַלֶּה
  choice: நான் ... அழித்துவிடுவேன்
  rationale: כלה என்பதன் பியேல் வடிவம் முற்றுப்பெறச் செய்தல், முழுவதுமாக ஒழித்தல் அல்லது அழித்தல் என்னும் கடுமையான தீர்ப்பைக் குறிக்கிறது. ‘அழித்துவிடுவேன்’ நவீன தமிழில் தெளிவாக இருந்து அச்சுறுத்தலின் தீவிரத்தைப் பேணுகிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: சபையினரைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: כְּרָגַע
  choice: ஒரு கணத்தில்
  rationale: மிகக் குறுகிய காலத்தையும் திடீர் நிகழ்வையும் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: וַיִּפְּלוּ
  choice: அப்போது ... விழுந்தார்கள்
  rationale: தொடர்ந்து நிகழும் கதையோட்டத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עַל פְּנֵיהֶם
  choice: முகங்குப்புற
  rationale: முகம் தரையில் படும்படி பணிந்து விழுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் இணை; பயம், மன்றாட்டு அல்லது வழிபாடு ஆகியவற்றில் எது நோக்கம் என்பதைத் தீர்மானித்து சேர்க்கவில்லை.
theological_decisions:
- issue: மோசேக்கும் ஆரோனுக்கும் கொடுக்கப்பட்ட இறைக் கட்டளையின் தன்மை
  choice: வரவிருக்கும் உடனடியான இறைத்தீர்ப்புக்கு முன் சபையிலிருந்து விலகி நிற்கும்படியான நேரடிக் கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எழுந்திருங்கள்’ என்று சொற்படியாக மொழிபெயர்த்தல் அல்லது ‘ஒதுங்கி நில்லுங்கள்’ என்று மென்மையாக்குதல்.
  rationale: எபிரெய உரையில் அவசரமான ஏவலும் மக்களை விரைவில் முற்றாக அழிக்கும் நோக்கமும் இணைந்துள்ளன. ஆகவே தீர்ப்பின் கடுமையை மென்மையாக்காமலும், ‘விலகுதல்’ என்ற சூழல்சார் பொருளை மறைக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘விலகி நில்லுங்கள்’ என்பது சொற்படியான ‘எழுந்திருங்கள்’ என்பதைக் காட்டிலும் இச்சூழலின் பிரிவுக் கட்டளையைத் தெளிவாக்குகிறது; அந்தச் சொற்படிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘முகங்குப்புற விழுந்தார்கள்’ என்பது உடல் நிலையை மட்டும் கூறி, செயல்விளக்கமாக ‘மன்றாடினர்’ அல்லது ‘வழிபட்டனர்’ என்று சேர்க்கவில்லை.
