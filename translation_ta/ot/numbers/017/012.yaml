base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: ta
  text: ஆரோன் அதை எடுத்தான்[a]; மோசே சொன்னபடியே அவன் கூட்டத்தின் நடுவே ஓடினான். இதோ, மக்களிடையே வாதை தொடங்கியிருந்தது. அவன் தூபப்பொருளை இட்டு[b], மக்களுக்காகப் பாவநிவிர்த்தி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை’ என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கூறப்பட்ட தூபக்கலசத்தைச் சூழல் சுட்டுகிறது.
    reason: implied_object
  - marker: b
    text: அல்லது, ‘தூபப்பொருளை வைத்தான்.’ எபிரெயில் சொல்லுக்கு நேர் பொருள் ‘கொடுத்தான்/வைத்தான்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அதை எடுத்துக்கொண்டு
  rationale: வினைச்சொல் நேரடியாக ‘எடுத்தான்’ என்று பொருள்படும். எடுக்கப்பட்ட பொருள் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாததால், முந்தைய வசனத்தின் சூழலைச் சுட்டும் ‘அதை’ சேர்க்கப்பட்டது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: மோசே சொன்னபடியே
  rationale: דבר என்பது அடிப்படையில் ‘பேசு/சொல்’; சூழலில் கட்டளையாகச் செயல்பட்டாலும், ‘கட்டளையிட்டபடி’ என்று பொருளை மிகுதியாகத் தீர்மானிக்காமல் மூலத்தின் சொற்பொருள் காக்கப்படுகிறது.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: மக்கள் கூட்டத்தின் நடுவே ஓடினான்
  rationale: רוץ என்பதன் நேரடியான பொருள் ‘ஓடு’; קהל இங்கு கூடியிருந்த இஸ்ரயேல் மக்களைக் குறிக்கிறது. ‘மக்கள் கூட்டம்’ என்பது நவீன தமிழில் இயல்பாகவும் சமய அமைப்பைக் குறிப்பதாகத் தவறாகப் புரியாதவாறும் உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியின் திடீர் தீவிரத்திற்குக் கவனம் ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையை ‘இதோ’ காக்கிறது.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: மக்களிடையே கொள்ளைநோய் தொடங்கியிருந்தது
  rationale: נגף இச்சூழலில் மக்களைத் தாக்கிக் கொல்லும் வாதை அல்லது plague-ஐக் குறிக்கிறது. தொடர்ச்சியான கதையோட்டத்தில் ஆரோன் சென்றடைவதற்கு முன்பே அது தொடங்கிவிட்ட நிலையை ‘தொடங்கியிருந்தது’ காட்டுகிறது.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: தூபப்பொருளை இட்டு
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை/இடு’. சடங்குச் சூழலில் இயல்பான தமிழுக்காக ‘இட்டு’ தேர்ந்தெடுக்கப்பட்டது; ‘செலுத்தினான்’ அல்லது ‘பலியிட்டான்’ போன்ற அதிக விளக்கமான சொற்கள் தவிர்க்கப்பட்டன.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: மக்களுக்காகப் பாவநிவிர்த்தி செய்தான்
  rationale: כהפר ஆசாரியச் சடங்கு மொழியில் பாவநிவிர்த்தி செய்யும் செயலைக் குறிக்கிறது. தமிழில் நிலைபெற்றுள்ள ‘பாவநிவிர்த்தி செய்தான்’ அதன் சடங்கு மற்றும் இறையியல் கனத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: כפר என்ற ஆசாரியச் சடங்கு வினையின் மொழிபெயர்ப்பு
  choice: மக்களுக்காகப் பாவநிவிர்த்தி செய்தான்
  alternative: மக்களுக்காகப் பரிகாரம் செய்தான்
  rationale: ‘பாவநிவிர்த்தி’ ஆசாரியரின் இடையீட்டுச் சடங்கையும் தண்டனை விலக்கப்படுவதையும் வெளிப்படுத்தும் நிலைபெற்ற சொல். அது செயலின் துல்லியமான முறை குறித்து வசனம் கூறாததைத் தாண்டி விளக்குவதில்லை.
- issue: קָהָל என்ற உடன்படிக்கை மக்களைக் குறிக்கும் சொல்லின் மொழிபெயர்ப்பு
  choice: மக்கள் கூட்டம்
  alternative: சபை
  rationale: இங்கு ஒரு குறிப்பிட்ட சமய நிறுவனத்தை விட ஒன்றாகக் கூடியிருந்த இஸ்ரயேல் மக்கள் முன்னிலையில் உள்ளனர். ‘மக்கள் கூட்டம்’ அந்தக் காட்சியை நவீன வாசகருக்கு நேரடியாகக் காட்டுகிறது.
- issue: נֶגֶף என்பதன் இயல்பு
  choice: கொள்ளைநோய்
  alternative: வாதை
  rationale: சூழலில் இது மக்களிடையே ஏற்கெனவே பரவி மரணத்தை உண்டாக்கும் தெய்வீகத் தீர்ப்பைக் குறிக்கிறது. ‘கொள்ளைநோய்’ நிகழ்வின் உயிர்க்கொல்லித் தன்மையைத் தெளிவாகச் சொல்கிறது; காரணம் அல்லது மருத்துவ இயல்பை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம நிகழ்வின் கண்ணியமும் தீவிரமும் காக்கப்படும் வகையிலும் மொழிநடை அமைக்கப்பட்டது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் நாடகத் தன்மையைத் தக்கவைக்கிறது; ‘சபை’ போன்ற திருச்சபை சார்ந்ததாகக் கேட்கக்கூடிய சொல்லுக்கு மாற்றாக ‘மக்கள் கூட்டம்’ பயன்படுத்தப்பட்டது.
