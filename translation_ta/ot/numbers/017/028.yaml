    text: அல்லது, “நாம் அனைவரும் சாக வேண்டியதுதானா?” இங்கே எபிரெயத்தில், “இறந்துபோவார்கள்” என்பதில் உள்ள வினைச்சொல்லிலிருந்து வேறுபட்ட வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது; எனவே, அதே சொல்லை மீண்டும் கூறுவதைவிட முற்றிலும் அழிந்துபோதல் என்ற நிழற்பொருள் இருக்கலாம்.
