  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசினார்; அவர் கூறியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH; இதை ‘யெகோவா’ என்றும் ஒலிபெயர்க்கலாம்.'
    reason: இறைப்பெயரின் பண்டைய துல்லியமான உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்ற வினைச்சொல்லின் ‘பேசுதல்’ என்ற பொருளையும், தொடர்ந்துவரும் אמר என்பதிலிருந்து அதன் சொல்வேறுபாட்டையும் காக்கிறது; וַ தொடர் நிகழ்வை முன்னெடுப்பதைத் தமிழ் வாக்கிய அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சின் பெறுநரைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான நவீனத் தமிழில் ‘மோசேயிடம்’ என வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: அவர் கூறியதாவது
  rationale: அடுத்து நேர்க் கூற்று வருவதை அறிவிக்கும் எபிரெய பேச்சு அறிமுக மரபை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதேவேளையில் דבר என்பதற்குப் பயன்படுத்திய ‘பேசினார்’ என்பதிலிருந்து אמר என்பதன் வேறுபாட்டையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் இறைவனின் நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதன் சாத்தியமான உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கிறது; ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் அதை மாற்றவில்லை. துல்லியமான பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை. ‘பேசினார்; அவர் கூறியதாவது:’ என்ற அமைப்பு மூலத்தின் வழக்கமான பேச்சு அறிமுகத்தை இயல்பாகத் தருவதோடு דבר/אמר வேறுபாட்டையும் காக்கிறது.
