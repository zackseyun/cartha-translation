id: NUM.17.13
reference: Numbers 17:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: ta
  text: அவன் இறந்தவர்களுக்கும் உயிருள்ளவர்களுக்கும் நடுவே நின்றான்; கொள்ளைநோய் நிறுத்தப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: அவன் ... நின்றான்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்’ என்பதாகும். இங்கு நிகழ்வின் நேரடியான உடல்சார் செயலை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: בֵּין ... וּבֵין
  choice: '...க்கும் ...க்கும் நடுவே'
  rationale: இணையாக வரும் முன்னிடைச்சொற்கள் இரண்டு குழுக்களுக்கு இடையிலான இடத்தைச் சுட்டுகின்றன. ‘நடுவே’ என்பது இயல்பான, நேரடியான தமிழ் இணை.
- source_word: הַמֵּתִים
  choice: இறந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இவ்வடிவம் இறந்துபோனவர்களைக் குறிக்கிறது; எதிரிலுள்ள ‘உயிரோடிருந்தவர்கள்’ என்பதுடன் தெளிவான முரணைத் தக்கவைக்கிறது.
- source_word: הַחַיִּים
  choice: உயிரோடிருந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இச்சொல் அப்போது இன்னும் உயிருடன் இருந்தவர்களைக் குறிக்கிறது. இறந்தவர்களுடனான சூழ்நிலைசார் வேறுபாட்டை இயல்பாக வெளிப்படுத்த இறந்தகால வடிவம் ஏற்றது.
- source_word: וַתֵּעָצַר
  choice: நிறுத்தப்பட்டது
  rationale: עצר என்பதன் இங்குள்ள செயப்பாட்டு/விளைவு உணர்வு, கொள்ளைநோயின் பரவல் தடுக்கப்பட்டதைச் சொல்கிறது. ‘நிறுத்தப்பட்டது’ என்பது அந்தச் செயப்பாட்டு வடிவத்தையும் விளைவையும் காக்கிறது.
- source_word: הַמַּגֵּפָה
  choice: கொள்ளைநோய்
  rationale: מגפה இச்சூழலில் உயிரிழப்பை ஏற்படுத்தும் கடுமையான நோய்ப்பரவலைக் குறிக்கிறது. ‘கொள்ளைநோய்’ என்பது நவீனத் தமிழில் தெளிவானதும் வேதாகம நடைக்கு ஏற்றதுமான சொல்.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் מַגֵּפָה என்பதன் தன்மை
  choice: கொள்ளைநோய்
  alternative: துன்பம்; நோய்ப்பரவல்
  rationale: உடனடி நிகழ்ச்சிச் சூழலில் இது உயிரிழப்பை உண்டாக்கிய கடுமையான நோய்ப்பரவலைக் குறிக்கிறது. ‘கொள்ளைநோய்’ அதன் தீவிரத்தைக் காக்கிறது; ஆனால் இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படாத கூடுதல் இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தின் சுருக்கமான கதைநடையும், ‘இறந்தவர்கள்—உயிரோடிருந்தவர்கள்’ என்ற கூர்மையான முரணும், ‘நிறுத்தப்பட்டது’ என்ற செயப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
