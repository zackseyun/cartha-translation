translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ என்பது בֵית אָב குறிக்கும் வம்ச/மூதாதையர் இல்ல அமைப்பை வெறும் ‘குடும்பம்’ என்பதைவிடத் துல்லியமாகக் காக்கிறது. வசனத்தின் நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
