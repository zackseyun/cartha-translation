base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களிடம் பேசு. அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி அவர்களுடைய எல்லாத் தலைவர்களிடமிருந்தும், ஒவ்வொரு தந்தைவழிக் குடும்பத்திற்கும் ஒரு கோலாகப் பன்னிரண்டு கோல்களை வாங்கிக்கொள்.[b] ஒவ்வொருவரின் பெயரையும் அவரவர் கோலில் எழுது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘தடிகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மַטֶּה (மட்டே) என்பது கோல் அல்லது தடி என்று பொருள்படும்; இங்கு கையில் பிடிக்கப்படும் உண்மையான கோலே குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்குச் சொற்றொடர். இயல்பான நவீனத் தமிழுக்காக ‘மக்கள்’ என மொழிபெயர்த்து, சொற்சொல் வடிவை அடிக்குறிப்பில் தருகிறது.
- source_word: מַטֶּה
  choice: கோல்
  rationale: பெயர் எழுதப்பட்டு பின்னர் துளிர்க்கும் உடற்கூறான கைத்தடி/கோலே இங்கு குறிக்கப்படுகிறது. ‘கோல்’ தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: தந்தைவழிக் குடும்பங்கள் ஒவ்வொன்றுக்கும் ஒரு கோல்
  rationale: மீண்டும் வரும் מַטֶּה מַטֶּה என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொன்றுக்கும் ஒரு’ என்று இயல்பாக வெளிப்படுத்துகிறது; בֵית אָב குறிக்கும் தந்தைவழி வம்சக் குடும்ப அமைப்பையும் காக்கிறது.
- source_word: נְשִׂיאֵיהֶם
  choice: அவர்களுடைய ... தலைவர்கள்
  rationale: கோத்திர அல்லது வம்சக் குழுத் தலைவர்களைக் குறிக்கிறது; அரச மரபைத் தவறாக உணர்த்தக்கூடிய ‘இளவரசர்கள்’ என்பதற்குப் பதில் ‘தலைவர்கள்’ தெளிவானது.
- source_word: לְבֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்கள் அனைத்தின்
  rationale: தலைவர்கள் எந்த சமூக அமைப்பின் அடிப்படையில் தேர்ந்தெடுக்கப்படுகிறார்கள் என்பதைத் தெரிவிக்கிறது; தமிழில் உறவைத் தெளிவாக்க உருபுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: பன்னிரண்டு கோல்கள்
  rationale: எண்ணிக்கையையும் முந்தைய מַטֶּה மொழிபெயர்ப்பின் ஒருமைப்பாட்டையும் நேரடியாகக் காக்கிறது.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: ஒவ்வொருவருடைய பெயரையும் ... எழுது
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொருவருடைய’ என்று வெளிப்படுத்துகிறது; கட்டளைத் தொனியும் காக்கப்படுகிறது.
- source_word: עַל מַטֵּהוּ
  choice: அவரவர் கோலில்
  rationale: ஒவ்வொரு தலைவரின் பெயரும் அவருக்குரிய கோலில் எழுதப்பட வேண்டும் என்ற பொருத்தத்தை ‘அவரவர்’ இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது.
