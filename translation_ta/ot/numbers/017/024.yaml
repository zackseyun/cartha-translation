base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: ta
  text: மோசே எல்லாக் கோல்களையும் யாவேயின் முன்னிலையிலிருந்து இஸ்ரவேலர் அனைவரிடமும்[a] வெளியே கொண்டுவந்தார். அவர்கள் அவற்றைக் கண்டார்கள்[b]; பிறகு ஒவ்வொருவரும் தத்தமது கோலை எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இஸ்ரவேலின் மகன்கள் அனைவரிடமும்.” இது இங்கு இஸ்ரவேல் மக்கள் அனைவரையும் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் அவற்றைப் பார்த்தார்கள்.” எபிரெய வினை ‘காணுதல்’ அல்லது சூழலுக்கேற்ப ‘பார்த்தல்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது; தமிழில் இது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמַּטֹּת
  choice: கோல்கள்
  rationale: מַטֶּה என்பது சூழலுக்கேற்ப கோல், தடி, அல்லது கோத்திரம் எனப் பொருள்படும். இங்கு யாவேயின் முன்னிலையில் வைக்கப்பட்ட உடற்கூறான கோல்கள் குறிக்கப்படுகின்றன.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையிலிருந்து
  rationale: ‘யாவேயின் முன்பிலிருந்து’ என்ற எபிரெய இடவியல் சொல்லாட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரிடமும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான தேசியப் பெயர். ‘இஸ்ரவேலர் அனைவரிடமும்’ என்பது நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தெரிவிக்கிறது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּרְאוּ
  choice: அவர்கள் அவற்றைப் பார்த்தார்கள்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்/பார்த்தல்.’ கோல்கள் அவர்கள் முன் கொண்டுவரப்பட்ட சூழலில், தமிழில் தேவைப்படும் செயப்படுபொருளை வெளிப்படையாகச் சேர்த்து ‘அவற்றைப் பார்த்தார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: ஒவ்வொருவரும் தத்தமது கோலை எடுத்துக்கொண்டார்கள்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; מַטֵּהוּ என்பது ‘அவரவருடைய கோல்.’ ‘தத்தமது’ என்பது அந்தப் பகிர்வுப் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வாவ் வினை அமைப்புகள் தமிழில் இயல்பாக அமைய வாக்கியங்களாகப் பிரிக்கப்பட்டு, ‘பிறகு’ மூலம் நிகழ்வுகளின் வரிசை தெளிவாக்கப்பட்டுள்ளது.
