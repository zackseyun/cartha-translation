  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: ta
  text: தங்கள் உயிருக்கு விரோதமாகப் பாவம் செய்த[a][b] இந்த மனிதர்களின் தூபக்கலசங்களை அடித்துத் தகடுகளாக்கி[c], பலிபீடத்துக்கு மேலுறையாகச் செய்யட்டும். ஏனெனில், அவர்கள் அவற்றை யாவேக்கு முன்பாகக் கொண்டுவந்ததால் அவை பரிசுத்தமாயின[d]. அவை இஸ்ரவேல் மக்களுக்கு[e] ஓர் அடையாளமாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பாவிகள்”; அல்லது, “பாவமுள்ள இந்த மனிதர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “தங்கள் உயிர்களுக்கு விரோதமாக” அல்லது “தங்கள் உயிர்களோடு.” இங்கு அவர்களுடைய பாவம் அவர்களது உயிரிழப்பை விளைவித்தது என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அடிக்கப்பட்ட தகடுகளாக”; அதாவது, அடித்து மெல்லியதாக்கப்பட்ட உலோகத் தகடுகளாக.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “அவை பரிசுத்தமாக்கப்பட்டன.” இப்பன்மை வினையின் எழுவாய் பெரும்பாலும் தூபக்கலசங்களே.
    reason: lexical_alternative
  - marker: e
    text: சொல்லுக்கு நெருக்கமாக, “இஸ்ரவேலின் மகன்களுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: தூபக்கலசங்கள்
  rationale: கலகச் சம்பவத்தில் தூபம் செலுத்தப் பயன்படுத்தப்பட்ட பாத்திரங்களை இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் குறிக்கிறது.
- source_word: הַחַטָּאִים הָאֵלֶּה
  choice: பாவம் செய்த இந்த மனிதர்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் நிகழ்வுச் சார்ந்த பொருளை நிலையான ‘பாவிகள்’ என்ற அடையாளமாக மட்டும் மாற்றாமல் காக்கிறது.
- source_word: בְּנַפְשֹׁתָם
  choice: தங்கள் உயிரை இழக்குமாறு
  rationale: சொல்லுக்கு நெருக்கமாக ‘தங்கள் உயிர்களில்/உயிரோடு’ என்றிருந்தாலும், இச்சூழலில் அவர்களுடைய பாவம் அவர்களுக்கே மரணத்தை விளைவித்தது என்பதைக் காட்டுகிறது; அடிக்குறிப்பில் மூலவடிவின் தெளிவின்மை காக்கப்படுகிறது.
- source_word: וְעָשׂוּ אֹתָם
  choice: அவற்றை ... செய்யட்டும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய கட்டளையின் தொடர்ச்சியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רִקֻּעֵי פַחִים
  choice: அடித்துத் தகடுகளாக்கி
  rationale: உலோகத்தைச் சுத்தியலால் அடித்து மெல்லிய தகடுகளாக்கும் செயலும் அதன் விளைவும் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: பலிபீடத்துக்கு மேலுறையாக
  rationale: அடித்த உலோகத் தகடுகள் பலிபீடத்தின் மேற்பரப்பை மூடும் உறையாகப் பயன்படுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: அவர்கள் அவற்றை யாவேக்கு முன்பாகக் கொண்டுவந்ததால்
  rationale: הקריב என்பதன் ‘அருகில் கொண்டுவருதல்/செலுத்துதல்’ என்ற வழிபாட்டுப் பொருளை, பொருள் தூபக்கலசங்கள் என்பதற்கு ஏற்ற தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּקְדָּשׁוּ
  choice: அவை பரிசுத்தமாயின
  rationale: பன்மை வினையின் இயல்பான அண்மைச் சுட்டு தூபக்கலசங்களே; செயற்படுத்தியவரைச் சேர்க்காமல் அவை பரிசுத்த நிலையை அடைந்தன என்ற விளைவைப் பாதுகாக்கிறது.
- source_word: וְיִהְיוּ לְאוֹת
  choice: அவை ... ஓர் அடையாளமாக இருக்கட்டும்
  rationale: நினைவூட்டும் எச்சரிக்கைச் செயல்பாட்டை விளக்கிச் சேர்க்காமல் ‘அடையாளம்’ என்ற மூல உருவகத்தைக் காக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு நெருக்கமான ‘இஸ்ரவேலின் மகன்கள்’ என்பதன் கூட்டுமக்கள் பொருளை உள்ளடக்கிய, இன்றைய தமிழில் இயல்பான வடிவம்.
theological_decisions:
- issue: பரிசுத்தமாயின என்பதன் எழுவாய் மற்றும் கருத்து
  choice: யாவேக்கு முன்பாகக் கொண்டுவரப்பட்டதால் தூபக்கலசங்கள் பரிசுத்தமாயின.
  alternative: பாவம் செய்த மனிதர்களே ஒரு வரையறுக்கப்பட்ட வழிபாட்டுப் பொருளில் பரிசுத்தமானார்கள்; அல்லது தூபக்கலசங்கள் நிலையான பரிசுத்தம் பெறாமல் சடங்குக்காக மட்டும் ஒதுக்கப்பட்டன.
  rationale: பன்மை வினைக்கு மிக அருகிலுள்ள இலக்கணச் சுட்டு தூபக்கலசங்களாகும்; அவற்றை ஏன் பலிபீடத்தின் பரிசுத்தப் பயன்பாட்டுக்கு மாற்ற வேண்டும் என்பதையும் இது விளக்குகிறது. பாவத்துடன் தொடர்புடைய பொருட்களே தெய்வீக முன்னிலையில் கொண்டுவரப்பட்டதால் பரிசுத்தமாயின என்ற உரையின் பதற்றமும் காக்கப்படுகிறது.
- issue: בְּנַפְשֹׁתָם என்பதன் பொருள்
  choice: அவர்களுடைய பாவம் அவர்களது உயிரிழப்புக்கு வழிவகுத்தது.
  alternative: அவர்கள் தங்கள் உயிர்களுக்கு எதிராகப் பாவம் செய்தார்கள்; அல்லது தங்கள் ஆத்துமாக்களைப் பொறுத்தவரை பாவம் செய்தார்கள்.
  rationale: சூழலில் கலகம் அவர்களுடைய மரணத்தில் முடிவதால், இது உடல்–ஆத்துமா வேறுபாட்டை முன்வைப்பதைவிட தம்மையே அழித்துக்கொண்ட விளைவைக் குறிக்கிறது; இருப்பினும் நேரடி சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘தூபக்கலசம்,’ ‘பலிபீடம்,’ ‘பரிசுத்தம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் சூழலின் சடங்கு நுட்பத்தை காக்கின்றன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; காரணத் தொடர்பும் கட்டளையின் தொடர்ச்சியும் காக்கப்பட்டுள்ளன.
