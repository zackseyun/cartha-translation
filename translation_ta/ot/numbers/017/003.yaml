  source_fidelity: தூபக்கலசங்கள், அடித்துத் தகடுகளாக்குதல், பலிபீடத்தின் மேலுறை, யாவேக்கு முன்பாகக் கொண்டுவரப்பட்டதால் அவை பரிசுத்தமாதல், இஸ்ரவேலுக்கான அடையாளம் ஆகிய முக்கிய கூறுகள் மூலத்திற்கு உண்மையாக உள்ளன. ஆனால் “தங்கள் உயிரை இழக்குமாறு பாவம் செய்த” என்பது தமிழில் நோக்கத்தைச் சுட்டுவதுபோல் ஒலிக்கிறது; בְּנַפְשֹׁתָם-இன் ‘தங்கள் உயிர்களுக்கு விரோதமாக/தங்கள் உயிரின் விலையாக’ என்ற தன்னழிவான விளைவைத் துல்லியமாகத் தரவில்லை.
  naturalness: நடை பொதுவாக நவீனத் தரத் தமிழுக்கு ஏற்றது. “தங்கள் உயிருக்கு விரோதமாகப் பாவம் செய்த” என்பது மூலத்தின் சொற்பொருள் நெருக்கத்தையும் தமிழின் இயல்பையும் மேம்படுத்துகிறது. “பலிபீடத்துக்கு மேலுறையாக” இயல்பாகவும் தெளிவாகவும் உள்ளது.
  terminology: “தூபக்கலசங்கள்,” “பலிபீடம்,” “பரிசுத்தமாயின,” “யாவே” ஆகியவை சூழலுக்கும் திட்டத்தின் பெயரியல் கொள்கைக்கும் பொருந்துகின்றன. “இஸ்ரவேல் மக்கள்” என்பது לִבְנֵי יִשְׂרָאֵל என்பதற்கான இயல்பான கூட்டுப்பொருள் மொழிபெயர்ப்பு.
