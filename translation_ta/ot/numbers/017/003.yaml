    rationale: “தங்கள் உயிரை இழக்குமாறு” என்பது அவர்கள் உயிரிழப்பதை நோக்கமாகக் கொண்டு பாவம் செய்தார்கள் என்ற தேவையற்ற நுணுக்கத்தைத் தரக்கூடும். “தங்கள் உயிருக்கு விரோதமாகப் பாவம் செய்த” என்பது எபிரெயத்தின் நேரடி அமைப்பையும், சூழல் காட்டும் உயிரிழப்பு விளைவையும் அடிக்குறிப்பின் மூலம் பாதுகாக்கிறது.
