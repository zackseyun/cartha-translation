base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும் சந்திப்புக் கூடாரத்தின் முன்னே வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘சந்திப்புக் கூடாரத்தின் முகத்திற்கு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: பின்பு ... வந்தார்கள்
  rationale: בוא என்பதன் wayyiqtol வடிவம் நிகழ்வை முன்னெடுத்துச் செல்லும் இறந்தகாலச் செயலைக் குறிக்கிறது. எபிரெயில் வினை ஒருமையில் இருந்தாலும், மோசே மற்றும் ஆரோன் என்ற இணை எழுவாய்க்கேற்ப தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டது. ‘உள்ளே நுழைந்தார்கள்’ என்பது அவர்கள் கூடாரத்திற்குள் சென்றதாகத் தேவையின்றிக் குறிப்பாக்கிவிடும்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் வழக்கமாகப் பயன்படுத்தப்படும் இப்பெயரின் வடிவம்.
- source_word: וְאַהֲרֹן
  choice: ஆரோனும்
  rationale: இணைப்புச் சொல்லின் பொருளை ‘-உம்’ மூலம் இயல்பாகக் காட்டி, பெயரின் வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶל־פְּנֵי
  choice: முன்னே
  rationale: இச்சொற்றொடர் சொல்லுக்குச் சொல் ‘முகத்திற்கு’ என்றாலும், ஓர் இடத்தின் முன்பாக அணுகி வருவதை இங்கு குறிக்கிறது. ‘முன்னே’ என்பது அந்த இடவுறவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: குறிப்பிட்ட பரிசுத்தக் கூடாரத்தைக் குறிக்கும் இணைப்புச் சொல்லமைப்பையும், சந்திப்புக்குரிய இடம் என்ற வழிபாட்டுச் சூழலையும் பாதுகாக்கும் தெளிவான நவீனத் தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன தரமான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கூடாரத்திற்குள் நுழைந்தார்கள் என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்காமல், அதன் முன்னே வந்தார்கள் என்ற இடவுறவு பாதுகாக்கப்பட்டது.
