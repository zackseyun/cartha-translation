  rationale: 'திருத்தம் இரண்டு இடங்களில் மட்டுமே செய்யப்பட்டுள்ளது: எரிதல் நிகழ்வின் நடுவிலிருந்து கலசங்களை எடுக்க வேண்டும் என்ற மூலக் காட்சியைத் துல்லியப்படுத்தவும், நெருப்பை அப்பால் சிதறவிட வேண்டும் என்ற திசை உணர்வை இயல்பான தமிழில் வெளிப்படுத்தவும். கலசங்களையே ‘அவை’ குறிக்கிறது என்ற விளைவுநிலை வாசிப்பும் அடிக்குறிப்பு மாற்றும் பாதுகாக்கப்பட்டுள்ளன.'
