base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: ta
  text: '“ஆசாரியனான ஆரோனின் மகன் எலெயாசாரிடம் சொல்: எரியும் பகுதியின் நடுவிலிருந்து தூபக்கலசங்களை[a] அவன் எடுத்துக்கொள்ளட்டும்; நெருப்பை அப்பால் சிதறவிடட்டும். ஏனெனில், அவை புனிதமாகிவிட்டன[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்புத் தணல் பாத்திரங்களை.” எபிரெயச் சொல் நெருப்புத் தணலையோ தூபத்தையோ ஏந்தப் பயன்படுத்திய பாத்திரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவை புனிதமானவை.” எபிரெய நிறைவு வினை, அவை புனிதமாகியதன் விளைவாக இப்போது புனித நிலையில் இருப்பதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: சொல்
  rationale: אמר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனான ஆரோனின் மகன் எலெயாசார்
  rationale: எபிரெயச் சொற்றொடரில் ‘ஆசாரியன்’ என்பது இயல்பாக ஆரோனைச் சிறப்பிக்கிறது; தமிழில் அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் அமைக்கிறது.
- source_word: וְיָרֵם
  choice: அவன் எடுத்துக்கொள்ளட்டும்
  rationale: முன்னுள்ள கட்டளையைத் தொடர்ந்து வரும் யூசிவ் பொருளைத் தமிழின் அனுமதி/கட்டளை வடிவில் தருகிறது; உயர்த்தி அகற்றும் செயலை இச்சூழலில் ‘எடுத்துக்கொள்ளட்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּחְתֹּת
  choice: தூபக்கலசங்கள்
  rationale: מחתה என்பது நெருப்புத் தணலையும் தூபத்தையும் ஏந்தும் வழிபாட்டுப் பாத்திரம். ‘தூபக்கலசம்’ இச்சூழலின் வழிபாட்டுப் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: எரிந்துகொண்டிருக்கும் இடத்தின் நடுவிலிருந்து
  rationale: שׂרפה குறிக்கும் எரிதல் அல்லது எரிந்த பகுதி என்ற காட்சியை, எரிந்த எச்சங்கள் என்று மிகையாக விளக்காமல், இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: நெருப்பைத் தொலைவில் சிதறிவிடட்டும்
  rationale: זרה என்பதன் ‘சிதறு’ என்ற அடிப்படைப் பொருளையும் הָלְאָה என்பதன் தூரத்திற்கப்பால் என்ற உணர்வையும் தக்கவைக்கிறது. இங்கு நெருப்பு என்பது தணல்களையும் நடைமுறையில் உள்ளடக்கலாம்.
- source_word: כִּי קָדֵשׁוּ
  choice: ஏனெனில், அவை புனிதமாகிவிட்டன
  rationale: பன்மை வினை தூபக்கலசங்களைக் குறிக்கிறது. எபிரெய நிறைவு வடிவத்தின் விளைவுநிலையை ‘புனிதமாகிவிட்டன’ வெளிப்படுத்துகிறது; நிலையை மட்டும் வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: כִּי קָדֵשׁוּ என்பதிலுள்ள பன்மை வினையின் குறிப்பு
  choice: ‘அவை’ என்பது தூபக்கலசங்களைக் குறிக்கிறது
  alternative: தூபக்கலசங்களையும் நெருப்பையும் சேர்த்துக் குறிக்கலாம்; அல்லது படைப்புடன் தொடர்புடைய பொருட்களைப் பொதுவாகக் குறிக்கலாம்
  rationale: அருகிலுள்ள பொருத்தமான பன்மைப் பெயர்ச்சொல் הַמַּחְתֹּת, ‘தூபக்கலசங்கள்’ என்பதே. மேலும், நெருப்பு சிதறடிக்கப்பட வேண்டியதாகவும் கலசங்கள் புனிதமானதால் எடுத்துக்கொள்ளப்பட வேண்டியதாகவும் கூறும் நிகழ்வின் தர்க்கத்தோடு இது பொருந்துகிறது.
- issue: קָדֵשׁוּ என்ற நிறைவு வினையின் கால/நிலை உணர்வு
  choice: புனிதமாகிவிட்டன
  alternative: புனிதமானவை
  rationale: எபிரெய நிறைவு வடிவம் ஏற்பட்ட மாற்றத்தின் விளைவாகத் தொடரும் நிலையைக் குறிக்க முடியும். மொழிபெயர்ப்பு அந்த விளைவுநிலையை முன்னிறுத்துகிறது; வெறும் தற்போதைய நிலை என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் கட்டளைத் தொடரும் காரணவாக்கியமும் பாதுகாக்கப்பட்டுள்ளன. ‘புனிதமாகிவிட்டன’ என்பதில் உள்ள இறையியல் விளைவுநிலை மிகையாக விளக்கப்படாமல் வைக்கப்பட்டுள்ளது.
