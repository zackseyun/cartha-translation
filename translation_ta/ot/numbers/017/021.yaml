base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: ta
  text: மோசே இஸ்ரவேலின் மகன்களிடம்[a] பேசினார். அவர்களுடைய தலைவர்கள் அனைவரும் தங்கள் தந்தைவழிக் குடும்பங்களின்படி, ஒவ்வொரு தலைவரும் ஒவ்வொரு கோலாக, பன்னிரண்டு கோல்களை அவரிடம் கொடுத்தார்கள்; ஆரோனின் கோலும் அவர்களுடைய கோல்களின் நடுவில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேல் மக்கள்.’ எபிரெய மொழியில் சொற்றொடர் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்கமான உடன்படிக்கைப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பது ஒருவரிடம் பேசுவதையோ உரையாற்றுவதையோ குறிக்கிறது; கதைநடையில் இயல்பாகவும் மூலத்தின் முறையான தொனியுடனும் அமைகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான வடிவத்தையும் உடன்படிக்கை மக்களைக் குறிக்கும் மரபான பெயரையும் தக்கவைக்கிறது; அதன் கூட்டு மக்களினப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: נְשִׂיאֵיהֶם
  choice: அவர்களுடைய தலைவர்கள்
  rationale: இங்கு נָשִׂיא என்பது கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்திய அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; ‘தலைவர்கள்’ என்பது நவீன தமிழில் தெளிவானது.
- source_word: מַטֶּה
  choice: கோல்
  rationale: இங்கு ஒவ்வொரு தலைவரையும் பிரதிநிதித்துவப்படுத்திக் கொடுக்கப்பட்ட பொருள் ஒரு கோல்; தமிழில் இயல்பானதும் சூழலுக்கு ஏற்றதுமான சொல் இது.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
  choice: ஒவ்வொரு தலைவருக்கும் ஒவ்வொரு கோலாக
  rationale: மூலத்தின் மறுபடிச் சொல்லல் ஒவ்வொரு தலைவரிடமிருந்தும் தனித்தனியாக ஒரு கோல் பெறப்பட்டதை வலியுறுத்துகிறது; தமிழ் பகிர்வுநிலை அமைப்பு அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தைவழி மூதாதையர் குடும்பங்களின் அடிப்படையிலான பிரதிநிதித்துவத்தைச் சொற்றொடர் குறிக்கிறது; அந்த உறவுமுறை அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: பன்னிரண்டு கோல்கள்
  rationale: எண்ணிக்கையை நேரடியாக மொழிபெயர்த்து, מַטֶּה என்பதற்குத் தேர்ந்தெடுக்கப்பட்ட சொல்லை ஒரே சீராகப் பயன்படுத்துகிறது.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: ஆரோனின் கோலும் அவர்களுடைய கோல்களின் நடுவில் இருந்தது
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தில் தமிழுக்குத் தேவையான ‘இருந்தது’ சேர்க்கப்பட்டுள்ளது; בְּתוֹךְ என்பதன் ‘நடுவில்/மத்தியில்’ என்ற இடப்பொருளும் காக்கப்படுகிறது.
