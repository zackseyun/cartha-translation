  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: பொருட்களை வைக்கும்படியான ஒருமை ஆணை, சந்திப்புக் கூடாரம், சாட்சியத்தின் முன்பாக, தேவன் சந்திக்கும் இடச்சுட்டு. ஆனால் வரைவின் சொல் வரிசை ‘நான் உங்களைச் சந்திக்கும் இடத்தில்’ என்பதை ‘சாட்சியத்தின் முன்பாக’ என்பதிலிருந்து பிரித்து, எபிரெய வாக்கிய அமைப்பைத் தமிழில் சற்றே தடுமாறச் செய்கிறது. ‘அங்கே’ எனத் தெளிவாக்குவது שָׁמָּה-வின் இடச்சுட்டையும் பாதுகாக்கிறது.'
  naturalness: ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘சாட்சியத்தின் முன்பாக’ இயல்பான, கண்ணியமான நவீனத் தமிழ். முக்கிய உரையின் சொல் வரிசையைச் சீரமைத்தால் கட்டளை தெளிவாகவும் வாசிப்பிற்கு இயல்பாகவும் இருக்கும். தற்போதைய அடிக்குறிப்பு b-யில் இரு மாற்றுவாசகங்களும் முழுமையற்ற வாக்கியங்களாக உள்ளன; அவை திருத்தப்பட வேண்டும்.
  terminology: ‘சாட்சியம்’ என்பது הָעֵדוּת-இன் திட்டமிட்ட தெளிவின்மையைத் தக்கவைக்கிறது; அதை பலகைகள் அல்லது பேழை எனக் குறுக்கக் கூடாது. ‘சந்திப்புக் கூடாரம்’ நிலையான பொருத்தமான பெயர். ‘உடன்படிக்கைச் சாட்சி’ என்பது அடிக்குறிப்பில் வழங்கத்தக்க சொற்பொருள் மாற்றாகும்.
