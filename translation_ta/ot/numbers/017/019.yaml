source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: ta
  text: அவற்றைச் சந்திப்புக் கூடாரத்தில், சாட்சியத்தின் முன்பாக வை; அங்கே நான் உங்களைச் சந்திப்பேன்[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடன்படிக்கைச் சாட்சியின் முன்பாக.’ ‘சாட்சியம்’ என்பது பரிசுத்த இடத்திலுள்ள பலகைகளுடன் தொடர்புடைய உடன்படிக்கைச் சாட்சியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் உங்களுக்கு என்னை வெளிப்படுத்தும் இடத்தில்’; அல்லது, ‘நான் உங்களைச் சந்திக்க நியமித்துள்ள இடத்தில்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: அவற்றை … வை
  rationale: இச்சொல், முன்னர் குறிப்பிடப்பட்ட பொருட்களை அங்கே வைக்கும்படி ஒருமையில் உள்ள ஆண்மகனுக்குக் கொடுக்கப்படும் கட்டளையைக் குறிக்கிறது. ‘வை’ என்பது நேரடியான, இயல்பான நவீனத் தமிழ்.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இது பரிசுத்த இடத்திற்கான நிலையான பெயர். אֹהֶל என்பதற்கு ‘கூடாரம்’ என்றும் מוֹעֵד என்பதற்கு இச்சூழலில் ‘சந்திப்பு’ என்றும் மொழிபெயர்ப்பது தெளிவாக உள்ளது.
- source_word: לִפְנֵי הָעֵדוּת
  choice: சாட்சியத்தின் முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக’ என்றும் הָעֵדוּת என்பது சொற்பொருளில் ‘சாட்சியம்’ என்றும் வருகிறது. அது பலகைகளையா, பேழையையா, உடன்படிக்கையின் சாட்சியையா குறிக்கிறது என்பதை முதன்மை உரை வரையறுக்கவில்லை.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: நான் உங்களைச் சந்திக்கும்
  rationale: יעד என்பதன் நிபால் வடிவம் நியமிக்கப்பட்ட சந்திப்பைக் குறிக்கிறது. אֲשֶׁר மற்றும் שָׁמָּה ஆகியவற்றின் இடச்சார்ந்த பொருள் தமிழில் ‘சந்திக்கும் இடத்தில்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: לָכֶם
  choice: உங்களை
  rationale: எபிரெய முன்னிடைச்சொல் சொற்படியாக ‘உங்களுக்கு’ என இருந்தாலும், יעד உடனான இம்மரபுத்தொடரில் ‘உங்களைச் சந்திக்கும்’ என்பதே இயல்பான தமிழ்.
- source_word: שָׁמָּה
  choice: இடத்தில் என்பதில் உள்ளடக்கப்பட்டது
  rationale: ‘அங்கே’ என்ற வினையடை, ‘சந்திக்கும் இடத்தில்’ என்ற தமிழ்ச் சொல்லமைப்பில் ஏற்கெனவே வெளிப்படுவதால் தேவையற்ற இரட்டிப்பைத் தவிர்க்கத் தனியாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘சாட்சியம்’ என்பதன் சுட்டுப்பொருள்
  choice: அது பலகைகள், பேழை, அல்லது உடன்படிக்கைச் சாட்சி ஆகியவற்றில் குறிப்பாக எதைக் குறிக்கிறது என்று முதன்மை உரையில் வரையறுக்காமல், ‘சாட்சியம்’ என்ற சொல்லையே தக்கவைத்தல்.
  alternative: ‘சாட்சிப் பலகைகள்’ அல்லது ‘சாட்சிப் பேழை’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: הָעֵדוּת என்பது இறையியல் செறிவுள்ள சொல்; ஆனால் இவ்வசனத்தில் அதன் துல்லியமான சுட்டுப்பொருள் வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே மூலத்தின் தெளிவின்மையும் பொருள் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
- issue: தேவன் சந்திக்கும் விதம்
  choice: ‘நான் உங்களைச் சந்திக்கும்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘நான் உங்களுக்கு என்னை வெளிப்படுத்தும்’ அல்லது ‘நான் உங்களைச் சந்திக்க நியமித்திருக்கும்’ என்று மொழிபெயர்த்தல்.
  rationale: இவ்விடத்தில் יעד என்பதன் நிபால் வடிவம் நியமிக்கப்பட்ட சந்திப்பை முதன்மையாகக் குறிக்கிறது; தேவன் தம்மை வெளிப்படுத்துதல் என்ற சாத்தியமான நுண்பொருளை முதன்மை உரைக்குள் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் நேரடியானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. தேவன் மோசேயிடம் ஒருமையில் வழங்கும் கட்டளை ‘வை’ என்று தெளிவாக வைக்கப்பட்டுள்ளது; ‘சாட்சியம்’ என்ற மூலத்தின் திட்டமிட்ட தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
