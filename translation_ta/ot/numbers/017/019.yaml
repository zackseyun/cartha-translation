    rationale: ‘சந்திப்புக் கூடாரத்தில், நான் உங்களைச் சந்திக்கும் இடத்தில், சாட்சியத்தின் முன்பாக’ என்ற வரிசை தமிழில் ‘சந்திக்கும் இடம்’ எதனை விளக்குகிறது என்பதைத் தற்காலிகமாகத் தெளிவற்றதாக்குகிறது. ‘அங்கே நான் உங்களைச் சந்திப்பேன்’ எனப் பிரிப்பது மூலத்தின் שָׁמָּה-வை வெளிப்படுத்தி இயல்பான வாக்கியத்தைத் தருகிறது.
