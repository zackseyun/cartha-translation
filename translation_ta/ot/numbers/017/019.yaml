  rationale: 'திருத்தப்பட்ட உரை எபிரெயத்தின் வரிசையையும் இடச்சுட்டையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது: பொருட்கள் சந்திப்புக் கூடாரத்தில் சாட்சியத்தின் முன்பாக வைக்கப்படுகின்றன; அங்கேயே தேவன் அவர்களைச் சந்திக்கிறார். ‘சாட்சியம்’ என்பதன் சுட்டுப்பொருள் முதன்மை உரையில் வரையறுக்கப்படவில்லை. அடிக்குறிப்புகள் முழுமையான இயல்பான தமிழில் மாற்றுவாசகங்களை வழங்குகின்றன.'
