    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறியது
  rationale: வாவ் தொடர்வினையுடன் வரும் דּבר கதை நிகழ்வை முன்னெடுக்கிறது. இயல்பான தமிழ் நடைமுறையில் ‘பின்பு’ நிகழ்வின் தொடர்ச்சியையும் ‘கூறியது’ பேச்சுச் செயலையும் வெளிப்படுத்துகிறது; அடுத்து வரும் לֵאמֹר அதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைபெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய தனிப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வழக்கமான வடிவில் வழங்கப்படுகிறது; ‘-யிடம்’ சேரும்போது ‘மோசேயிடம்’ என அமைகிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: இந்த எபிரெய வழக்குச் சொற்றொடர் தொடர்ந்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் இரண்டாவது ‘சொல்லி’ போன்ற செயப்பெயரைச் சேர்ப்பதைவிட இரட்டைப்புள்ளி இதை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான יהוה என்பதையே பயன்படுத்துகிறது. பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, எளிதில் புரியும், கண்ணியமான தமிழ் நடை. எபிரெய நேரடிப் பேச்சு அறிமுக அமைப்பை இயல்பான தமிழ் இரட்டைப்புள்ளியால் வெளிப்படுத்தியுள்ளது.
