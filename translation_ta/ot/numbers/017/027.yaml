  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. குறுகிய வியப்புவாக்கியங்களும் இறுதி மறுபடியுரைத்தலும் மூலத்தின் பதற்றத்தையும் கூட்டுப் பீதியையும் காக்கின்றன.
