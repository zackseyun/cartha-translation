id: NUM.17.27
reference: Numbers 17:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] மோசேயிடம், “இதோ[b], நாங்கள் சாகிறோம்! அழிந்துபோகிறோம்![c] நாங்கள் எல்லாருமே அழிந்துபோகிறோம்!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “இஸ்ரவேலின் பிள்ளைகள்”; அதாவது, இஸ்ரவேலர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இதோ”; இது இங்கு அச்சமும் அவசரமும் நிறைந்த கவன ஈர்ப்புச் சொல்லாக வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயம் அடுத்தடுத்து இரு வேறு வினைச்சொற்களைப் பயன்படுத்துகிறது: “சாகிறோம்” (גוע), “அழிந்துபோகிறோம்” (אבד). இது மக்களின் பீதியைத் தீவிரப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்/பிள்ளைகள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கியதாகவும் உள்ளது.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: என்றார்கள்
  rationale: நேரடிக் கூற்றின் முடிவில் வரும் ‘என்றார்கள்’ என்ற இயல்பான தமிழ் அமைப்பு, אָמַר மற்றும் மேற்கோளை அறிமுகப்படுத்தும் לֵאמֹר ஆகியவற்றின் செயலையும் தேவையற்ற இரட்டிப்பில்லாமல் வெளிப்படுத்துகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, அச்சம் நிறைந்த திடீர் உணர்வை வெளிப்படுத்தும் இடைச்சொல். ‘இதோ’ மூலத்தின் ‘பார்/இதோ’ என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: גָּוַעְנוּ
  choice: நாங்கள் சாகிறோம்
  rationale: גוע உயிர்விடுதல் அல்லது இறத்தலைக் குறிக்கிறது. மக்களின் உடனடி பீதியைத் தமிழின் நிகழ்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבַדְנוּ
  choice: அழிந்துபோகிறோம்
  rationale: אבד அழிவு, நாசம், ஒழிந்துபோதல் ஆகிய கருத்துகளைத் தருகிறது. இது முந்தைய ‘சாகிறோம்’ என்பதிலிருந்து வேறுபாட்டைக் காத்து, தீவிரமடையும் பீதியை வெளிப்படுத்துகிறது.
- source_word: כֻּלָּנוּ
  choice: நாங்கள் எல்லாருமே
  rationale: முழு சமூகத்தையும் வலியுறுத்தும் எபிரெயச் சொல்லின் அழுத்தத்தை ‘எல்லாருமே’ இயல்பாகக் காட்டுகிறது.
- source_word: אָבָדְנוּ
  choice: அழிந்துபோகிறோம்
  rationale: மூலத்தில் அבד வினை மீண்டும் வருவதால், மக்களின் பதற்றமிக்க மறுபடியுரைத்தலைக் காக்க அதே தமிழ்ச் சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
