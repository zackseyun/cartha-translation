  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: இஸ்ரவேல் சமூகத்தின் குறிப்பு, மோசேயை நோக்கிய உரை, அச்சமூட்டும் הֵן, முதலில் גוע (‘சாகிறோம்’), பின்னர் அבד (‘அழிந்துபோகிறோம்’), இறுதியில் כֻּלָּנוּ உடன் அதே அבד வினையின் மறுபடியுரை அனைத்தும் இடம்பெற்றுள்ளன. நிகழ்காலப் பீதிக்குரல் தமிழ் வடிவத்தில் இயல்பாக வெளிப்படுகிறது.'
  naturalness: ‘இஸ்ரவேல் மக்கள் மோசேயிடம் ... என்றார்கள்’ என்பது நவீன நிலையான தமிழில் தெளிவும் இயல்பும் உடையது. குறுகிய வியப்புவாக்கியங்களும் ‘எல்லாருமே’ என்ற வலியுறுத்தலும் கூட்டுப் பீதியின் ஓசையை நன்றாகத் தருகின்றன.
