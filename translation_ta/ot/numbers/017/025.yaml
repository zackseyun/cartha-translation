base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “ஆரோனின் கோலைச் சாட்சியின்[a] முன்பாகத் திரும்ப வைத்து, கலகக்காரர்களுக்கு[b] ஓர் அடையாளமாக அதைக் காத்துவை. இவ்வாறு, எனக்கு எதிரான அவர்களுடைய முறுமுறுப்புகளை நீ முடிவுக்குக் கொண்டுவருவாய்; அவர்கள் சாகாதபடி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாட்சி” என்பது உடன்படிக்கையின் சாட்சிப் பலகைகளையோ அவற்றுடன் தொடர்புடைய பேழையையோ குறிக்கலாம்; எபிரெய மூலத்தில் “சாட்சி” என்றே சுருக்கமாக உள்ளது.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்குச் சொல், “கலகத்தின் பிள்ளைகள்”; அல்லது “கலகம் செய்கிற பிள்ளைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: הָשֵׁב
  choice: திரும்பவும் வை
  rationale: שוב என்பதன் ஹிஃபில் கட்டளை வடிவம், கோலை அதன் முந்தைய இடத்திற்குத் திருப்பி வைக்கும்படி கூறுகிறது.
- source_word: מַטֵּה
  choice: கோல்
  rationale: இச்சூழலில் கையில் ஏந்தப்படும் staff/rod என்பதற்கான இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: לִפְנֵי הָעֵדוּת
  choice: சாட்சியின் முன்பாக
  rationale: எபிரெயச் சொற்றொடர் ‘சாட்சி’ என்று மட்டுமே கூறுவதால், அதை ‘சாட்சிப்பேழை’ என விரிவாக்காமல் அதன் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: לְמִשְׁמֶרֶת
  choice: பாதுகாத்து வைக்கப்படட்டும்
  rationale: காவலில் வைத்துப் பேணுதல் அல்லது பாதுகாப்பாக வைத்திருத்தல் என்ற நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְאוֹת
  choice: ஓர் அடையாளமாக
  rationale: אוֹת என்பதன் வழக்கமான ‘அடையாளம்/குறி’ என்ற பொருளை இச்சூழலில் இயல்பாக வழங்குகிறது.
- source_word: לִבְנֵי מֶרִי
  choice: கலகத்தின் பிள்ளைகளுக்கு
  rationale: ‘கலகத்தின் மகன்கள்/பிள்ளைகள்’ என்ற குறிக்கப்பட்ட எபிரெய உறவுமுறை மரபுத்தொடரை முற்றிலும் சமப்படுத்தாமல் காக்கிறது; தமிழில் பொதுவான குழுவைக் குறிக்க ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: וּתְכַל
  choice: நீ முடிவுக்குக் கொண்டுவருவாய்
  rationale: כלה என்பதன் ஹிஃபில் வடிவம் முறுமுறுப்பை முடிவுறச் செய்வதைக் குறிக்கிறது. எபிரெய வினையின் இரண்டாம் நபர் ஒருமையையும் வெளிப்படையாகக் காக்கிறது.
- source_word: תְּלוּנֹּתָם
  choice: அவர்களுடைய முறுமுறுப்புகள்
  rationale: வனாந்தர நிகழ்ச்சிகளில் மீண்டும் வரும் குறைகூறுதலையும் அதிருப்தி முணுமுணுப்பையும் ‘முறுமுறுப்பு’ நன்கு வெளிப்படுத்துகிறது.
- source_word: מֵעָלַי
  choice: எனக்கு எதிரான
  rationale: முறுமுறுப்புகள் யாவேக்கு எதிராகச் செலுத்தப்படுகின்றன என்ற சூழல்சார் உறவை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא יָמֻתוּ
  choice: அவர்கள் சாகவும் மாட்டார்கள்
  rationale: முறுமுறுப்பு முடிவதால் மரணம் தவிர்க்கப்படும் விளைவை, எபிரெய இணைப்பைத் தொடர்ந்து நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לִבְנֵי מֶרִי என்ற பாலினம் குறிக்கப்பட்ட மரபுத்தொடர்
  choice: கலகத்தின் பிள்ளைகள்
  alternative: கலகக்காரர்கள்
  rationale: மூலத்தின் உறவுமுறை உருவகத்தை முதன்மை உரையில் காக்கிறது; அதன் இயல்பான பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: וּתְכַל என்பதன் நோக்கம் அல்லது விளைவு
  choice: நீ முடிவுக்குக் கொண்டுவருவாய்
  alternative: நீ முடிவுக்குக் கொண்டுவரும்படி
  rationale: வாவ் இணைப்புடன் வரும் வினை நோக்கம்/விளைவு ஆகிய இரண்டின் நிழலையும் தாங்கலாம். பிரதான உரை விளைவாக வாசிக்க இயலும் வடிவத்தைத் தேர்ந்தெடுத்து, முன் வரும் ‘இவ்வாறு’ மூலம் நோக்கத் தொடர்பையும் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சி’, ‘கலகத்தின் பிள்ளைகள்’ போன்ற மூலத்தின் செறிவான சொற்றொடர்கள் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவு சார்ந்த விரிவாக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
