  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ta
  text: மாதத்தின் தகனபலியையும்[a] அதற்குரிய தானியக் காணிக்கையையும், வழக்கமான தகனபலியையும் அதற்குரிய தானியக் காணிக்கையையும், அவற்றிற்குரிய பானக் காணிக்கைகளையும் தவிர்த்து, அவற்றின் விதிமுறைப்படி செலுத்தப்படும், யாவேக்கு இனிய நறுமணத்திற்கான நெருப்புக் காணிக்கை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாதத்தின் தகனபலி” என்பது அமாவாசைக்குரிய காணிக்கையைக் குறிப்பதாக இருக்கலாம்; ஆனால் எபிரெய மூலத்தில் நேரடியாக “மாதத்தின் தகனபலி” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நெருப்புக் காணிக்கை” என்பதற்குப் பதிலாக, “உணவுக் காணிக்கை” அல்லது “நெருப்பில் செலுத்தப்படும் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: …தவிர, இவற்றையும்
  rationale: இந்த வசனம் முந்தைய வசனங்களில் கட்டளையிடப்பட்ட காணிக்கைகளை, இங்கு பட்டியலிடப்படும் வழக்கமான காணிக்கைகளுக்கு மேலாகச் செலுத்த வேண்டும் என்பதைக் குறிக்கிறது. தமிழில் அந்தத் தொடர்பைத் தெளிவாக்க ‘இவற்றையும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: மாதத்திற்குரிய தகனபலி
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘மாதத்தின் தகனபலி.’ இது அமாவாசைக் காணிக்கையைக் குறிப்பதாக இருந்தாலும், மூலத்தின் ‘மாதம்’ என்ற சொல் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מִנְחָתָהּ
  choice: அதற்குரிய தானியக் காணிக்கை
  rationale: பலியிடல் சூழலில் מִנְחָה பொதுவாக மிருகபலியோடு செலுத்தப்படும் தானியக் காணிக்கையைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு முந்தைய தகனபலியைச் சுட்டுகிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமாகச் செலுத்தப்படும் தகனபலி
  rationale: תָּמִיד தவறாமல் தொடர்ச்சியாக நிகழும் ஒழுங்கைச் சுட்டுகிறது. ‘வழக்கமாகச் செலுத்தப்படும்’ என்பது ‘தினசரி’ என்று மூலத்தைவிட அதிகமாகக் குறிப்பாக்காமல் அதன் ஒழுங்கான தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְנִסְכֵּיהֶם
  choice: அவற்றிற்குரிய பானக் காணிக்கைகள்
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் பானக் காணிக்கை; பன்மை பின்னொட்டு இங்குள்ள பல காணிக்கைகளையும் சுட்டுகிறது.
- source_word: כְּמִשְׁפָּטָם
  choice: அவற்றுக்கான விதிமுறைப்படி
  rationale: வழிபாட்டு நடைமுறையில் מִשְׁפָּט நிர்ணயிக்கப்பட்ட முறை அல்லது ஒழுங்கைக் குறிக்கிறது. ‘விதிமுறைப்படி’ என்பது அந்த முறையான பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமளிக்கும்
  rationale: இது தேவனுக்கு ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலியிடல் மொழிநடை. வாசனை உருவகத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புக் காணிக்கை
  rationale: இது பலியிடல் சார்ந்த தொழில்நுட்பச் சொல்; நெருப்பில் செலுத்தப்படும் காணிக்கையைச் சுட்டும் பாரம்பரிய மற்றும் மூலவடிவத்துக்கு நெருக்கமான பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது. ‘உணவுக் காணிக்கை’ என்ற நவீன அகராதிசார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயரைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: אִשֶּׁה என்ற பலியிடல் சொல்லின் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: உணவுக் காணிக்கை; நெருப்பில் செலுத்தப்படும் காணிக்கை
  rationale: இந்தச் சொல்லின் துல்லியமான உருவாக்கமும் பொருள் நுணுக்கமும் விவாதத்திற்குரியது. நெருப்போடு உள்ள வெளிப்படையான பலியிடல் தொடர்பை முதன்மை உரை பாதுகாக்கிறது; ‘உணவுக் காணிக்கை’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலியிடல் பட்டியலுக்கேற்ற மரியாதையான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. தனியாக வாசிக்கும்போதும் முந்தைய வசனங்களோடு உள்ள இலக்கணத் தொடர்பு புரிய ‘இவற்றையும் … செலுத்த வேண்டும்’ என்று மறைமுக வினை வெளிப்படுத்தப்பட்டுள்ளது; ஆனால் காணிக்கைகளின் உறவுகளும் மூலத்தின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
