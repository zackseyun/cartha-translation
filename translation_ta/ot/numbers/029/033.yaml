  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ta
  text: அவற்றுக்குரிய தானியக் காணிக்கையையும் பானக் காணிக்கைகளையும் காளைகளுக்காகவும், செம்மறியாட்டுக் கடாக்களுக்காகவும், செம்மறியாட்டுக் குட்டிகளுக்காகவும், அவற்றின் எண்ணிக்கைக்கு ஏற்பவும், அவற்றுக்கான விதிமுறைப்படி[a] செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றுக்கு விதிக்கப்பட்ட முறைப்படி” அல்லது “அவற்றுக்கான ஒழுங்கின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: பலிகளுடன் சேர்த்துச் செலுத்தப்படும் தானியக் காணிக்கையை இச்சொல் குறிக்கிறது. எபிரெய ஒருமை வடிவத்தின் கூட்டுப்பொருள் தமிழிலும் ஒருமையாக வைக்கப்பட்டுள்ளது.
- source_word: נִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானக் காணிக்கைகள்
  rationale: பலிகளோடு ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கைகளைத் தெளிவாகக் குறிக்கிறது; எபிரெய பன்மை தக்கவைக்கப்பட்டுள்ளது.
- source_word: לַפָּרִים
  choice: காளைகளுக்காக
  rationale: பலிப்பட்டியலில் פָּרִים என்பது காளைகளைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வயது விவரம் சேர்க்கப்படவில்லை.
- source_word: לָאֵילִם
  choice: செம்மறியாட்டுக் கடாக்களுக்காக
  rationale: பலியிடப்படும் ஆண் செம்மறியாடுகளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் குறிக்கிறது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகளுக்காகவும்
  rationale: כֶּבֶשׂ என்பதன் அடிப்படைப் பொருளான ஆட்டுக்குட்டி மொழிபெயர்க்கப்பட்டுள்ளது; இங்கு தேவையில்லாமல் பாலினம் குறிப்பிடப்படவில்லை.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: குறிப்பிடப்பட்ட விலங்குகளின் எண்ணிக்கைக்கு இணங்கக் காணிக்கைகள் அமைய வேண்டும் என்ற தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּמִשְׁפָּטָם
  choice: அவற்றுக்குரிய நியமத்தின்படி
  rationale: பலிகளைச் செலுத்துவதற்கான நிர்ணயிக்கப்பட்ட வழிமுறை அல்லது சட்ட ஒழுங்கை מִשְׁפָּט குறிக்கிறது; எபிரெயச் சொலின் உடைமைப் பின்னொட்டும் தமிழில் தக்கவைக்கப்பட்டுள்ளது.
