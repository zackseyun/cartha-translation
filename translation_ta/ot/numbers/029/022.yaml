source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ta
  text: 22 பாவப்பலியாக ஒரு ஆண் வெள்ளாட்டைச் செலுத்த வேண்டும். இது வழக்கமான தகனபலியையும் அதன் தானியப்பலியையும் பானப்பலியையும் தவிர, கூடுதலாகச் செலுத்தப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தொடர்ந்து செலுத்தப்படும் தகனபலி.’
    reason: תָּמִיד என்பதற்கு ‘வழக்கமான’ என்றும் ‘தொடர்ந்து செலுத்தப்படும்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: பாவநிவாரணப் பலியாக ஓர் ஆண் வெள்ளாடு
  rationale: שָׂעִיר என்பது ஆண் வெள்ளாட்டைக் குறிக்கிறது; אֶחָד எண்ணிக்கையை வெளிப்படையாகக் குறிப்பிடுகிறது; பலியியல் சூழலில் חַטָּאת என்பது பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது.
- source_word: מִ/לְּ/בַד
  choice: கூடுதலானது
  rationale: இங்கு குறிப்பிடப்படும் பலி, வழக்கமாகச் செலுத்தப்படும் பலிகளுக்கு மேலதிகமானது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֹלַת הַ/תָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: עֹלָה என்பதற்கான நிலைபெற்ற பலியியல் சொல் ‘தகனபலி’; תָּמִיד இங்கு தொடர்ந்து நிர்ணயிக்கப்பட்ட முறையில் செலுத்தப்படும் பலியைக் குறிக்கிறது.
- source_word: וּ/מִנְחָתָ/הּ
  choice: அதனுடன் செலுத்தப்படும் தானியப் பலி
  rationale: பலியியல் சூழலில் מִנְחָה தானியப் பலியைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு தகனபலியையே சுட்டுவதால், தமிழில் அதன் தொடர்பைத் தெளிவுபடுத்த ‘அதனுடன் செலுத்தப்படும்’ என வழங்கப்பட்டுள்ளது.
- source_word: וְ/נִסְכָּ/הּ
  choice: பானப் பலி
  rationale: נֶסֶךְ ஊற்றிச் செலுத்தப்படும் பானப் பலியைக் குறிக்கிறது; பின்னொட்டு அது தகனபலியுடன் தொடர்புடையது என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: חַטָּאת என்பதன் பலியியல் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவப் பலி
  rationale: இங்கு சொல் அருவமான ‘பாவம்’ என்பதைக் காட்டாமல், பாவத்துடன் தொடர்புடைய குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது அதன் சடங்கியல் செயல்பாட்டை வாசகருக்கு தெளிவுபடுத்துகிறது; எனினும் நிவாரணத்தின் செயல்முறையை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலியியல் சொற்களைத் துல்லியமாகவும் சாதாரண வாசகர்களுக்குப் புரியும்படியும் வழங்கப்பட்டுள்ளது. எபிரெய வசனத்தின் இறுதியில் உள்ள ஒருமைப் பெண்பால் பின்னொட்டுகள் வழக்கமான தகனபலியையே சுட்டுவதால், தமிழில் ‘அதனுடன் செலுத்தப்படும்’ என்று தொடர்பு தெளிவாக்கப்பட்டுள்ளது.
