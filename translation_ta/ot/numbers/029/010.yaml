  text: a tenth for each lamb[a], for the seven lambs.
translation:
  language: ta
  text: ஏழு ஆட்டுக்குட்டிகளில் ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, ‘பத்தில் ஒரு பங்கு, பத்தில் ஒரு பங்கு’ என்று உள்ளது; பலி செலுத்தும் சூழலில் இது ஓர் எப்பாவில் பத்தில் ஒரு பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: பத்தில் ஒரு பங்கு
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘பத்தில் ஒரு பங்கு, பத்தில் ஒரு பங்கு’ என மீளுரைக்கிறது; பலியிடும் சூழலில் இது ஒவ்வொரு விலங்குக்கும் உரிய அளவைக் குறிக்கிறது. மூலத்தில் ‘எப்பா’ இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்காமல், அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஒவ்வொன்றுக்கும்
  rationale: எழுத்துப்படி ‘அந்த ஒரு ஆட்டுக்குட்டிக்கு’; இங்குள்ள பலிப்பட்டியலில் பகிர்ந்தளிக்கும் பொருள் இருப்பதால், தமிழில் இயல்பாக ‘ஒவ்வொன்றுக்கும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ஏழு ஆட்டுக்குட்டிகளில்
  rationale: ஒவ்வொரு அளவும் பொருந்தும் முழுத் தொகுதி ஏழு ஆட்டுக்குட்டிகள் என்பதைத் தெளிவுபடுத்துகிறது; எபிரெய மொழியின் குறிப்பிட்ட சுட்டைச் சூழலுக்கு ஏற்றவாறு தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
