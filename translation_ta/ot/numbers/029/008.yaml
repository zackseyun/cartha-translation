base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ta
  text: 'யாவேக்கு இனிய நறுமணமாகத் தகனபலியைச் செலுத்துங்கள்: மாட்டுமந்தையிலிருந்து ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுடைய ஏழு ஆண் செம்மறியாட்டுக் குட்டிகள்; அவை உங்களுக்கு குறைபாடற்றவையாக இருக்க வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறுதலளிக்கும் நறுமணமாக.” எபிரெயச் சொற்றொடர் யாவேக்கு ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலியியல் வெளிப்பாடாகும்.
    reason: ரֵיחַ נִיחֹחַ என்பதற்கான lexical_alternative; மூலத்தின் நிலையான பலியியல் சொற்றொடருக்கான மாற்று வாசிப்பைத் தருகிறது.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: செலுத்துங்கள்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலியிடும் சூழலில் ஒரு பலியை முன்வைத்தல் அல்லது செலுத்துதல் என்று பொருள்படும்; நவீன தமிழில் ‘செலுத்துங்கள்’ இயல்பாகவும் வழிபாட்டுச் செயலைத் தெளிவாகவும் குறிக்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் நெருப்பில் எரிக்கப்பட்டு புகையாக மேலெழும் பலியைக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல் பெயரெழுத்தாக்கமாகத் தருகிறது; ל அர்ப்பணிப்பின் இலக்கைக் குறிக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமான
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதைக் குறிக்கும் நிலையான பலியியல் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: மாட்டுமந்தையிலிருந்து ஒரு காளை
  rationale: ‘ஒரு காளை, மாட்டினத்தின் மகன்’ என்ற எபிரெய மரபுத்தொடரை இயல்பாகத் தமிழாக்கி, மிருக வகையையும் அதன் ஆண் பாலையும் பாதுகாக்கிறது.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל பலியியல் பட்டியலில் வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ அதன் பாலையும் வகையையும் தெளிவாக்குகிறது.
- source_word: כְּבָשִׂים בְּנֵי־שָׁנָה שִׁבְעָה
  choice: ஒரு வயதான ஏழு ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: כְּבָשִׂים என்பதிலுள்ள ஆண்பால் குறிப்பையும் בְּנֵי שָׁנָה என்பதிலுள்ள ஒரு வயது குறிப்பையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: תְּמִימִם
  choice: பழுதற்றவையாக
  rationale: பலியிடப்படும் மிருகங்களில் உடற்குறை அல்லது குறைபாடு இல்லாத நிலையை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
- source_word: יִהְיוּ לָכֶם
  choice: அவை உங்களுக்காக ... இருக்க வேண்டும்
  rationale: לָכֶם என்ற தத்துவேற்றுமை உறவை விடாமல் காக்கிறது; அதேவேளை தமிழில் கட்டளைக்குரிய தேவையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று தரப்பட்டுள்ளது; ‘யாவே’ என்பது சாத்தியமான மாற்றுப் பெயரெழுத்தாக்கம்.
- issue: רֵיחַ נִיחֹחַ என்ற பலியியல் சொற்றொடர்
  choice: இனிய நறுமணம்
  alternative: ஆற்றும் நறுமணம்
  rationale: இது பலி இறைவனுக்கு ஏற்றதாக இருப்பதைக் குறிக்கும் உருவகச் சொற்றொடர். இறைவனுக்குச் சமாதானம் தேவைப்பட்டது என்று கூடுதல் இறையியல் முடிவைத் திணிக்காமல் உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. பலியியல் தொழில்சொல்லாக ‘தகனபலி’ தக்கவைக்கப்பட்டுள்ளது; பட்டியலின் எபிரெய வரிசையும் பாலினம் மற்றும் வயது விவரங்களும் பாதுகாக்கப்பட்டுள்ளன.
