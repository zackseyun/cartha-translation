  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: ta
  text: இந்த ஏழாம் மாதத்தின் பத்தாம் நாளில் உங்களுக்குப் புனிதக் கூடுகை இருக்க வேண்டும். நீங்கள் தங்களையே வருத்திக்கொள்ள வேண்டும்[a]; எந்த வேலையையும் செய்யக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்களைத் தாழ்த்திக்கொள்ள வேண்டும்’ அல்லது ‘தன்னடக்கத்தைக் கடைப்பிடிக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் ‘தங்கள் நபர்களை வருத்துதல்’ எனும் கருத்தை வெளிப்படுத்துகிறது; இது குறிப்பாக நோன்பு உள்ளிட்ட தன்னடக்கத்துடன் தொடர்புடைய சடங்கியல் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: பத்தாம் நாளில்
  rationale: எண்ணுடன் வரும் முன்னிடைச்சொல் நாட்காட்டித் தேதியைக் குறிக்கிறது; தமிழில் காலப்பொருள் தெளிவாக இருக்க ‘நாளில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: இந்த ஏழாம் மாதத்தின்
  rationale: மாதங்களின் வரிசையையும் הַזֶּה என்ற சுட்டுப்பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: புனிதக் கூடுகை
  rationale: அதிகாரபூர்வமாக அழைக்கப்பட்ட வழிபாட்டுக் கூட்டத்தைக் குறிக்கும் எபிரெயச் சடங்கியல் தொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்குப் … இருக்க வேண்டும்
  rationale: அந்த நாளில் மக்களுக்கென இந்தப் புனிதக் கூடுகை இருக்க வேண்டும் என்ற கட்டளைப் பொருளையும் לָכֶם என்பதன் உறவையும் காக்கிறது.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: நீங்கள் உங்களை வருத்திக்கொள்ள வேண்டும்
  rationale: சொல்லுக்கு நெருக்கமான சடங்கியல் பொருளைத் தக்கவைக்கிறது; ‘ஆத்துமாக்கள்’ என மொழிபெயர்த்து மனித இயல்பைப் பற்றிய இருமைப் புரிதலைத் திணிப்பதைத் தவிர்க்கிறது. நோன்பு உள்ளிட்ட தன்னடக்கத்தை இத்தொடர் சுட்டலாம்; ஆனால் அதை நோன்புக்கு மட்டும் சுருக்கவில்லை.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: எந்த வேலையையும் செய்யக்கூடாது
  rationale: כָּל என்பதன் முழுமையான தடையையும் சட்டக் கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழில் அளிக்கிறது.
theological_decisions:
- issue: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם என்ற சடங்கியல் மரபுத்தொடரின் பொருள்
  choice: நீங்கள் உங்களை வருத்திக்கொள்ள வேண்டும்
  alternative: நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும் / நீங்கள் தன்னடக்கத்தைக் கடைப்பிடிக்க வேண்டும்
  rationale: ‘வருத்திக்கொள்ள’ என்பது மனத்தாழ்மை, தன்னடக்கம், நோன்பு ஆகியவற்றோடு தொடர்புடைய சடங்கியல் தீவிரத்தைப் பாதுகாக்கிறது. அதேவேளையில், கட்டளையை வெறும் உள்ளார்ந்த மனநிலையாக மென்மைப்படுத்தவோ நோன்பு ஒன்றாக மட்டும் வரையறுக்கவோ இல்லை; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதையான சட்ட–வழிபாட்டு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புனிதக் கூடுகை’ சடங்கியல் தன்மையைத் தக்கவைக்கிறது; ‘உங்களை வருத்திக்கொள்ள’ என்பதிலுள்ள மூலமொழியின் திட்டமிட்ட பரந்த பொருள் அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளது.
