source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: ta
  text: எட்டாம் நாளில் நீங்கள் ஒரு சிறப்புக் கூடுகை[a] நடத்த வேண்டும்; வழக்கமான எந்த வேலையும் செய்யக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவுக் கூடுகை.” எபிரேயச் சொல் עֲצֶרֶת விழாவின் முடிவில் நடைபெறும் கூடுகையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: கட்டளை பொருந்தும் காலத்தைக் குறிக்கும் definite ordinal தொடரை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: עֲצֶרֶת
  choice: பரிசுத்த நிறைவுக் கூடுகை
  rationale: விழாவின் இறுதியில் நடைபெறும் புனிதக் கூடுகை என்ற சூழல்சார் பொருளைத் தருகிறது; வெறும் பொதுக்கூட்டமாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: תִּהְיֶה לָכֶם
  choice: உங்களுக்குப் ... இருக்க வேண்டும்
  rationale: ‘உங்களுக்காக/உங்களுக்கு இருக்கும்’ என்ற எபிரேய அமைப்பைத் தமிழில் இயல்பான சட்டநடை கட்டளையாகப் பாதுகாக்கிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: வழக்கமான எந்த வேலையையும்
  rationale: புனித நாளில் தடைசெய்யப்பட்ட அன்றாடத் தொழில் அல்லது பணியைக் குறிக்கிறது; எல்லாவிதமான செயல்களும் முற்றிலும் தடை என்ற மிகைப்பைத் தவிர்க்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: செய்யக் கூடாது
  rationale: பன்மை முன்னிலையில் வழங்கப்படும் சட்டத் தடையைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֲצֶרֶת என்பதற்கான விழாசார் சொல்
  choice: பரிசுத்த நிறைவுக் கூடுகை
  alternative: சிறப்புக் கூடுகை / புனிதக் கூடுகை
  rationale: இது புனிதமான விழாக் கூடுகை என்பதையும், எட்டாம் நாளின் நிறைவு சார்ந்த தன்மையையும் காட்டுகிறது; பிற்கால சமய அல்லது வழிபாட்டு அடையாளங்களை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளைக்கேற்ற கண்ணியமான, தெளிவான நடை. ‘நிறைவுக் கூடுகை’ என்ற சொற்றொடரின் சற்றே விளக்கத் தன்மையை ‘பரிசுத்த’ என்பதுடன் இணைத்து விழாசார் சூழல் தெளிவாக்கப்பட்டுள்ளது.
