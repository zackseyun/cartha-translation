review_pass:
  verdict: revise
  source_fidelity: The temporal phrase and the prohibition of ordinary occupational work are conveyed accurately. However, «பரிசுத்த நிறைவுக் கூடுகை» adds both explicit holiness and a definite concluding sense to עֲצֶרֶת. In this verse the term can denote a solemn/sacred assembly, while its possible sense as a closing assembly should remain an alternative rather than be imposed in the main text.
  naturalness: The draft is clear and modern. «ஒரு சிறப்புக் கூடுகை நடத்த வேண்டும்» is more idiomatic Tamil for the mandated assembly than «உங்களுக்குப் ... இருக்க வேண்டும்», while retaining the legal force.
  terminology: «சிறப்புக் கூடுகை» is an appropriately formal, non-denominational rendering. The footnote should identify the Hebrew term and preserve «நிறைவுக் கூடுகை» as the lexical alternative. «வழக்கமான எந்த வேலையும்» naturally expresses the festival prohibition without suggesting that all activity is forbidden.
  issues:
  - severity: medium
    issue: The main rendering «பரிசுத்த நிறைவுக் கூடுகை» over-specifies עֲצֶרֶת.
    rationale: The Hebrew noun may carry a concluding-festival association, but that nuance is lexically debated and is appropriately retained in a footnote. «பரிசுத்த» is also not explicitly present in the word itself. The main text should not combine these interpretive additions.
  - severity: low
    issue: Footnote alternative «சிறப்புக் கூடுகை» is less precise than the stated alternative.
    rationale: The English audit trail identifies ‘closing assembly’ as the relevant alternative. In Tamil, «நிறைவுக் கூடுகை» should be the alternative, with a brief explanation of the Hebrew term.
  revised_text: எட்டாம் நாளில் நீங்கள் ஒரு சிறப்புக் கூடுகை[a] நடத்த வேண்டும்; வழக்கமான எந்த வேலையும் செய்யக் கூடாது.
  revised_footnotes:
