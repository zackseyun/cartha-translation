revisions:
- from: ஏழாம் மாதத்தில், அந்த மாதத்தின் முதல் நாளில், உங்களுக்குப் பரிசுத்த ஒன்றுகூடுதல் இருக்க வேண்டும். கடின உழைப்புக்குரிய எந்த வேலையையும் நீங்கள் செய்யக் கூடாது. அது உங்களுக்கு எக்காள முழக்கத்தின் நாளாக இருக்க வேண்டும்.[a]
  to: ஏழாம் மாதத்தின் முதல் நாளில், உங்களுக்குப் பரிசுத்தக் கூட்டம் இருக்க வேண்டும். உழைப்புச் சார்ந்த எந்த வேலையும் நீங்கள் செய்யக் கூடாது. அது உங்களுக்கு எக்காள முழக்க நாளாக இருக்க வேண்டும்.[a]
  rationale: The revision improves modern Tamil idiom and clarifies the category of prohibited work. It retains the source’s legal formulation and the English audit trail’s contextual ‘trumpet-blast’ interpretation, while strengthening the footnote so that the Hebrew ambiguity of תְּרוּעָה is not obscured.
  reviewer_model: gpt-5.6-terra
