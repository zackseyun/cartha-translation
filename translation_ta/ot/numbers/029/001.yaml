source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: ta
  text: ஏழாம் மாதத்தின் முதல் நாளில், உங்களுக்குப் பரிசுத்தக் கூட்டம் இருக்க வேண்டும். உழைப்புச் சார்ந்த எந்த வேலையும் நீங்கள் செய்யக் கூடாது. அது உங்களுக்கு எக்காள முழக்க நாளாக இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரவார முழக்கத்தின் நாள்” அல்லது “கூக்குரலின் நாள்.” எபிரேயச் சொல் תְּרוּעָה பலத்த முழக்கத்தைக் குறிக்கிறது; சூழலுக்கு ஏற்ப அது எக்காள ஒலி, கூக்குரல் அல்லது ஆரவாரத்தைக் குறிக்கலாம். இச்சொல் கருவியின் பெயரை நேரடியாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தில்
  rationale: ב முன்னிடைச்சொல் இங்கு காலத்தைக் குறிக்கிறது. தொடக்க ו சட்டத் தொடர்ச்சியைச் சுட்டினாலும், முந்தைய வசனத்திலிருந்து தனித்து வாசிக்கப்படும் நவீன தமிழில் கட்டாயமான ‘மேலும்’ இயல்பற்றதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: அந்த மாதத்தின் முதல் நாளில்
  rationale: சொல்லர்த்தமாக ‘மாதத்தின் ஒன்றில்’ என்ற எபிரேய நாட்காட்டி வழக்கு, மாதத்தின் முதல் நாளைக் குறிக்கிறது; தமிழில் தெளிவாக விரித்துரைக்கப்பட்டது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்த ஒன்றுகூடுதல்
  rationale: அதிகாரப்பூர்வமாக அழைக்கப்பட்ட வழிபாட்டுக் கூட்டத்தைக் குறிக்கும் நிலையான சடங்கியல் சொற்றொடர். ‘ஒன்றுகூடுதல்’ அழைக்கப்பட்ட கூட்டம் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: கடின உழைப்புக்குரிய எந்த வேலையையும்
  rationale: பண்டிகை நாளில் தடைசெய்யப்பட்ட உழைப்புச் சார்ந்த வேலையைச் சுட்டுகிறது; எல்லா வகைச் செயலையும் முற்றிலும் தடைசெய்வதாக மிகைப்படுத்தாமல் வேறுபாட்டைக் காக்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் செய்யக் கூடாது
  rationale: இரண்டாம் நபர் பன்மையில் உள்ள சட்டத் தடையை நவீன, கண்ணியமான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: יוֹם תְּרוּעָה
  choice: எக்காள முழக்கத்தின் நாள்
  rationale: תְּרוּעָה என்பது பலத்த முழக்கம், ஆரவாரம் அல்லது ஊதுகருவியின் ஒலி எனப் பொருள்படக்கூடும். இச்சடங்கியல் சூழலில் எக்காள முழக்கம் பொருத்தமான முதன்மை மொழிபெயர்ப்பு; மூலத்தில் கருவி நேரடியாகப் பெயரிடப்படாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: அது உங்களுக்கு ... இருக்க வேண்டும்
  rationale: அந்த நாள் மக்களுக்காக நியமிக்கப்பட்ட தன்மையைத் தரும் எபிரேய அமைப்பை இயல்பான தமிழ் கட்டளையியல் நடையில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יוֹם תְּרוּעָה என்ற பண்டிகைச் சுட்டுப்பெயரின் மொழிபெயர்ப்பு
  choice: எக்காள முழக்கத்தின் நாள்
  alternative: ஆரவார முழக்கத்தின் நாள் / முழக்கத்தின் நாள்
  rationale: பிற்காலத்தில் நிலைபெற்ற பண்டிகைப் பெயரை மூலத்தில் சேர்க்காமல், நாளை அதன் சிறப்பொலியால் விவரிக்கும் எபிரேய வடிவம் காக்கப்பட்டது. תְּרוּעָה என்பதன் பொருள் பரந்தது என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் வழிபாட்டு கண்ணியத்தைப் பேணும் தெளிவான நடை. அரிதான சமயத் தொழில்நுட்பச் சொற்களைத் தவிர்த்து, மூலத்தின் சடங்கியல் தன்மையும் תְּרוּעָה என்பதிலுள்ள உண்மையான பொருள் விரிவும் காக்கப்பட்டுள்ளன.
