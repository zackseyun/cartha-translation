- from: அந்த ஏழு ஆட்டுக்குட்டிகளில் ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு[a].
  to: மேலும், அந்த ஏழு ஆட்டுக்குட்டிகள் ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு[a].
