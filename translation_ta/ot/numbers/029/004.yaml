  text: and one-tenth for each lamb[a], for the seven lambs.
translation:
  language: ta
  text: மேலும், அந்த ஏழு ஆட்டுக்குட்டிகள் ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘பத்தில் ஒரு பங்கு’ என்று மட்டுமே உள்ளது; பலிகளைப் பற்றிய இந்தச் சூழலில், இது வழக்கமாக ஓர் எப்பாவின் பத்தில் ஒரு பங்கைக் குறிக்கும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: பத்தில் ஒரு பங்கு
  rationale: எபிரெயச் சொற்றொடர் ஒரு பத்தில் ஒரு பங்கு என்ற அளவைக் குறிக்கிறது. மூலத்தில் ‘எப்பா’ வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்காமல், பலியிடும் சூழலில் வழக்கமாகக் குறிக்கப்படும் அளவை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஒவ்வொன்றுக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு ஆட்டுக்குட்டிக்கு’ என்றாலும், இங்கு ஏழு ஆட்டுக்குட்டிகள் ஒவ்வொன்றுக்கும் இந்த அளவு பொருந்துகிறது என்ற பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: அந்த ஏழு ஆட்டுக்குட்டிகளில்
  rationale: முன்னரே குறிப்பிடப்பட்ட குறிப்பிட்ட ஏழு ஆட்டுக்குட்டிகளைக் குறிக்கும் எபிரெய வரையறுத்த வடிவத்தை ‘அந்த’ என்பதன் மூலம் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத் தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் பட்டியலைத் தொடர்வதால் தொடக்க இணைப்புச் சொல்லைத் தனியாகச் சேர்க்காமல், தமிழில் இயல்பான தொடர்ச்சியாக வடிவமைக்கப்பட்டுள்ளது.
