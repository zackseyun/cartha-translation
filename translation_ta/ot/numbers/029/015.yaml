    text: எபிரேய மொழியில் ‘பத்தில் ஒரு பங்கு’ என்ற சொல் இருமுறை வருகிறது (‘பத்தில் ஒரு பங்கு, பத்தில் ஒரு பங்கு’); ஒவ்வொரு ஆட்டுக்குட்டிக்கும் தனித்தனியாக ஒதுக்கப்பட்ட அளவை இது குறிக்கிறது.
