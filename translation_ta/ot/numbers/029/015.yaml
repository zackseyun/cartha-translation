lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: பத்தில் ஒரு பங்கு
  rationale: இச்சொல் பலிச்சூழலில், வழக்கமாக ஒரு எப்பாவில் பத்தில் ஒரு பங்கான அளவைக் குறிக்கிறது. எபிரேய மொழியிலுள்ள இரட்டிப்பு பகிர்ந்தளிக்கும் பொருளைத் தருவதால், தமிழில் இயல்பாக ‘ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு’ என்று தரப்பட்டுள்ளது.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஆட்டுக்குட்டிகளில் ஒவ்வொன்றுக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஓர் ஆட்டுக்குட்டிக்கு’ என்றாலும், இப்பட்டியலில் ஒவ்வொரு விலங்குக்கும் உரிய அளவைக் குறிப்பிடும் பகிர்ந்தளிக்கும் பொருள் உள்ளது.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: பதினான்கு ஆட்டுக்குட்டிகளில்
  rationale: குறிப்பிட்ட பதினான்கு ஆட்டுக்குட்டிகள் அனைத்துக்கும் இந்தத் தனித்தனி அளவு பொருந்துகிறது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
