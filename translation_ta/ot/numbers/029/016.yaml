source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ta
  text: பாவநிவாரணப் பலியாக ஒரு ஆண் வெள்ளாட்டைச் செலுத்த வேண்டும்[a]. இது வழக்கமான எரிபலியுடனும் அதற்குரிய தானியக் காணிக்கையுடனும் பானக் காணிக்கையுடனும் கூடுதலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆண் வெள்ளாடு
  rationale: பலிக்குரிய வெள்ளாட்டின் ஆண்பாலை எபிரெயச் சொற்றொடர் தெளிவாகக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: பலியிட வேண்டிய விலங்கின் எண்ணிக்கையை நேரடியாகக் குறிக்கிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலியியல் சூழலில் இது வெறும் ‘பாவம்’ என்பதைக் காட்டிலும் பாவத்துடன் தொடர்புடைய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ தமிழில் பரிச்சயமானது; ‘தூய்மைப்படுத்தும் பலி’ என்ற சூழல்சார் மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִלְּבַד
  choice: கூடுதலானவை
  rationale: இந்தப் பலி வழக்கமாகச் செலுத்தப்படும் காணிக்கைகளுக்கு மேலாகச் செலுத்தப்பட வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான எரிபலி
  rationale: தொடர்ந்து நிர்ணயிக்கப்பட்ட முறையில் செலுத்தப்படும் எரிபலியைக் குறிக்கிறது; ‘வழக்கமான’ என்பது நவீன தமிழில் இயல்பானது.
- source_word: מִנְחָתָהּ
  choice: அதற்குரிய தானியக் காணிக்கை
  rationale: பெண்பால் ஒருமை பின்னொட்டு எரிபலியைக் குறிக்கிறது; பலியியல் சூழலில் מִנְחָה தானியக் காணிக்கையாகும்.
- source_word: וְנִסְכָּהּ
  choice: பானக் காணிக்கை
  rationale: எரிபலியுடன் சேர்த்து ஊற்றப்படும் காணிக்கையைக் குறிக்கிறது; ‘பானக் காணிக்கை’ பொதுவாகப் புரிந்துகொள்ளக்கூடிய தமிழாக்கம்.
theological_decisions:
- issue: חַטָּאת என்பதன் பலியியல் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: முதன்மை மொழிபெயர்ப்பு பாரம்பரியமாகவும் பொதுவாகவும் புரிந்துகொள்ளப்படுகிறது; ஆனால் சடங்குசார் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்றை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைத்து, சாதாரண வாசகருக்குப் புரியுமாறு வடிவமைக்கப்பட்டது. மூலத்தின் நீண்ட தொடரை இயல்பான இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்; எரிபலியைச் சுட்டும் பெண்பால் பின்னொட்டுகள் தமிழில் ‘அதற்குரிய’ என்று தெளிவாக்கப்பட்டுள்ளன.
