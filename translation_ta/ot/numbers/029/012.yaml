source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: ta
  text: மேலும், ஏழாம் மாதத்தின் பதினைந்தாம் நாளில் உங்களுக்குப் பரிசுத்தக் கூடுகை நடைபெற வேண்டும். எந்த வழக்கமான வேலையையும் நீங்கள் செய்யக் கூடாது. ஏழு நாட்கள் யெகோவாவுக்குப் பண்டிகை கொண்டாட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரெய நாட்காட்டுச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது; தொடக்க இணைப்புச் சொல் தமிழ் தொடர்ச்சியில் அவசியமில்லாததால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: அதிகாரப்பூர்வமாக அழைக்கப்பட்ட புனிதச் சபைக்கூட்டத்தைக் குறிக்கும் வழிபாட்டுச் சொற்றொடர்; ‘கூடுகை’ அழைப்பையும் கூடிவருதலையும் இயல்பாகக் குறிக்கிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்குப் ... நடைபெற வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘உங்களுக்காக/உங்களிடையே இருக்க வேண்டும்’; தமிழ் சட்டவழக்கில் ஒரு கூடுகை நிகழ வேண்டும் என்ற கட்டளையை ‘நடைபெற வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: வழக்கமான எந்த வேலையையும் நீங்கள் செய்யக் கூடாது
  rationale: இது எல்லா செயல்களையும் முற்றிலும் தடைசெய்வதைவிட அன்றாடத் தொழில் அல்லது வழக்கமான உழைப்பைத் தடைசெய்கிறது; ‘எந்த ... ஐயும்’ כָּל என்பதன் முழுமையைக் காக்கிறது.
- source_word: וְחַגֹּתֶם חַג
  choice: பண்டிகை கொண்டாட வேண்டும்
  rationale: ஒரே வேரிலிருந்து வந்த வினை–பெயர் அமைப்பைத் தமிழில் இயல்பான ‘பண்டிகை கொண்டாடுதல்’ என்ற இணைப்பால் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ என்ற முன்னொட்டு பண்டிகை யெகோவாவை நோக்கியும் அவரை மகிமைப்படுத்துவதற்குமானதுமாக இருப்பதைக் காட்டுகிறது; தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: பண்டிகையின் கால அளவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் நீண்டகாலமாக அறியப்பட்ட ஒலிவடிவமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மற்றொரு சாத்திய வடிவம்.
- issue: מְלֶאכֶת עֲבֹדָה என்பதன் வேலைத் தடை
  choice: வழக்கமான எந்த வேலையும்
  alternative: கடின உழைப்பான எந்த வேலையும்
  rationale: சொற்றொடர் பரிசுத்த நாளில் வழக்கமான தொழில்/அன்றாட உழைப்பைத் தடைசெய்கிறது. ‘கடின உழைப்பு’ என்று மொழிபெயர்த்தால் சிரமமான வேலைகள் மட்டுமே தடை என்ற அளவுக்கு பொருள் குறுகக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட–வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தக் கூடுகை’, ‘பண்டிகை கொண்டாடுதல்’ ஆகியவை மூலத்தின் வழிபாட்டுச் செறிவைக் காக்கின்றன; தேவையற்ற பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
