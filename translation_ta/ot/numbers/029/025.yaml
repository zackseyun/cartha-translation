revisions:
- from: மேலும், பாவநிவாரணப் பலியாக ஒரு வெள்ளாட்டுக்கடாவையும் செலுத்த வேண்டும். இது வழக்கமாகச் செலுத்தப்படும் தகனபலியையும்[a], அதற்குரிய தானியப் படைப்பையும் பானப் படைப்பையும் தவிரக் கூடுதலாகச் செலுத்தப்பட வேண்டும்.
  to: மேலும், பாவப்பலியாக ஒரு வெள்ளாட்டுக்கடாவைச் செலுத்த வேண்டும்; இது வழக்கமான தகனபலிக்கும் அதற்குரிய தானியப் படைப்புக்கும் பானப் படைப்புக்கும் கூடுதலானது.[a]
