source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ta
  text: மேலும், பாவப்பலியாக ஒரு வெள்ளாட்டுக்கடாவைச் செலுத்த வேண்டும்; இது வழக்கமான தகனபலிக்கும் அதற்குரிய தானியப் படைப்புக்கும் பானப் படைப்புக்கும் கூடுதலானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “தொடர்ச்சியான தகனபலி.”'
    reason: תָּמִיד என்பதற்கான ஆங்கில POB ஆய்வுக்குறிப்பில் தரப்பட்டுள்ள சொற்பொருள் மாற்றை மட்டுமே பிரதிபலிக்கிறது.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: மேலும் ... ஒரு வெள்ளாட்டுக்கடாவையும்
  rationale: שְׂעִיר עִזִּים என்பது பலியிடப்படும் ஆண் வெள்ளாட்டைக் குறிக்கும் வழக்கமான சொற்றொடர்; אֶחָד எண்ணிக்கையைத் தெளிவாகக் குறிக்கிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: பலியியல் சூழலில் இது பாவம் என்ற கருத்தை மட்டுமல்ல, பாவத்திற்காகச் செலுத்தப்படும் குறிப்பிட்ட பலிவகையைக் குறிக்கிறது.
- source_word: מִ/לְּ/בַד
  choice: தவிரக் கூடுதலாக
  rationale: இந்தப் பலி வழக்கமான பலிக்குப் பதிலாக அல்ல, அதனுடன் கூடுதலாகச் செலுத்தப்படுவதைத் தெளிவாக்குகிறது.
- source_word: עֹלַת הַ/תָּמִיד
  choice: வழக்கமாகச் செலுத்தப்படும் தகனபலி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் தகனபலியையும், תָּמִיד ஒழுங்காகத் தொடர்ந்து செலுத்தப்படுவதையும் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக வினைச்சொல் சார்ந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִנְחָתָהּ
  choice: அதற்குரிய தானியப் படைப்பு
  rationale: ஆசாரிய பலிப்பட்டியல்களில் מִנְחָה உடன் செலுத்தப்படும் தானியப் படைப்பைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு தகனபலியுடன் இதை இணைக்கிறது.
- source_word: וְ/נִסְכָּהּ
  choice: பானப் படைப்பு
  rationale: נֶסֶךְ பலியுடன் ஊற்றிச் செலுத்தப்படும் பானப் படைப்பைக் குறிக்கிறது; இது பொதுவாசகருக்குப் புரியக்கூடிய வழிபாட்டுச் சொல்.
theological_decisions:
- issue: חַטָּאת என்பதன் பலியியல் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்திற்கான பலி / பாவபலி
  rationale: இங்கு சொல் ஒரு சடங்குப் பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணம்’ அதன் செயல்பாட்டைத் தெரிவிக்கிறது; ஆனால் குறிப்பிட்ட பரிகாரக் கோட்பாட்டை விரிவாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், dignified but accessible sacrificial terminology பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் இணைப்புச் சொற்றொடர் தமிழில் முழுமையான, இயல்பான வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; அதற்குரிய தானிய மற்றும் பானப் படைப்புகள் வழக்கமான தகனபலியோடு தொடர்புடையவை என்பது தெளிவாக்கப்பட்டுள்ளது.
