  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את לְ/כַפֵּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: ta
  text: மேலும், உங்களுக்காகப் பரிகாரம் செய்வதற்கான பாவநிவாரண பலியாக ஓர் ஆண் வெள்ளாட்டைச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களுக்காகப் பாவப் பரிகாரம் செய்வதற்காக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ஓர் ஆண் வெள்ளாடு
  rationale: שְׂעִיר עִזִּים என்பது பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கிறது; אֶחָד எண்ணிக்கையைத் தெளிவாகக் காட்டுகிறது. தமிழில் ‘ஓர் ஆண் வெள்ளாடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: חַטָּאת
  choice: பாவநிவாரண பலியாக
  rationale: ஆசாரச் சூழலில் இச்சொல் வெறும் ‘பாவம்’ என்பதைக் காட்டிலும் பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘பாவநிவாரண பலி’ அதன் சடங்கியல் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: לְ/כַפֵּר
  choice: பரிகாரம் செய்வதற்காக
  rationale: כהר வேர்ச்சொல் ஆசாரிய பலிச் சூழலில் பாவத்தை மூடும் அல்லது நீக்கும் பரிகாரச் செயலைக் குறிக்கிறது. ‘பரிகாரம் செய்தல்’ அதன் வேதாகமச் சடங்கியல் அகலத்தைப் பேணுகிறது.
- source_word: עֲלֵי/כֶם
  choice: உங்களுக்காக
  rationale: כפר என்பதுடன் வரும் עַל, யாருக்காகப் பரிகாரம் செய்யப்படுகிறது என்பதைக் குறிக்கிறது; ‘உங்களுக்காக’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: பலிசார் כפר சொல்லின் மொழிபெயர்ப்பு
  choice: உங்களுக்காகப் பரிகாரம் செய்வதற்காக
  alternative: உங்கள் பாவத்தைப் போக்குவதற்காக
  rationale: எபிரெயச் சொல் பலிசார் பரிகாரத்தைத் தெரிவிக்கிறது; அதன் செயல்முறையை ஒரு குறிப்பிட்ட பிற்காலக் கோட்பாட்டின்படி வரையறுக்கவில்லை. ஆகவே பிரதான உரையில் ‘பரிகாரம்’ என்ற அகன்ற வேதாகமச் சொல் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலிப் பட்டியலின் சூழலைக் கருத்தில் கொண்டு ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டுள்ளது. மொழிநடை இயல்பாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது; [a] குறியீடு பிரதான உரையில் இடம்பெறுகிறது.
