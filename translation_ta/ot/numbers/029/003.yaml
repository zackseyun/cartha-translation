source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: ta
  text: 'அவற்றுக்கான தானியக் காணிக்கை எண்ணெயில் கலந்த மெல்லிய மாவாக இருக்க வேண்டும்: காளைக்கு ஓர் எப்பாவின் மூன்று பத்தாம் பங்குகளும்[a], செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தாம் பங்குகளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூன்று பத்தாம் பங்குகள்,” “இரண்டு பத்தாம் பங்குகள்” என்பவை முறையே ஓர் எப்பாவின் பத்தாம் பங்குகளைக் குறிக்கின்றன. எப்பா என்பது இஸ்ரவேலரின் பலிமுறையில் பயன்படுத்தப்பட்ட உலர் அளவையாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கையாக
  rationale: பலிகளோடு தொடர்புடைய சூழலில் מִנְחָה என்பது பொதுவான காணிக்கையைக் காட்டிலும் தானியக் காணிக்கையைக் குறிக்கிறது. -ם என்ற பன்மை உடைமைப் பின்னொட்டு முந்தைய வசனத்தில் கூறப்பட்ட பலிகளைக் குறிப்பதால் ‘அவற்றுக்குரிய’ என வழங்கப்பட்டது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிக்காகப் பயன்படுத்தப்பட்ட, நன்றாக அரைக்கப்பட்ட உயர்தர மாவை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெயில் கலந்த
  rationale: மாவு எண்ணெயோடு கலக்கப்பட்ட தயாரிப்பு முறையை எபிரெயப் பெயரெச்சத்தின் செயல்படுபொருள் வடிவுக்கு ஏற்ப தெளிவாகக் காட்டுகிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் மூன்று பங்கு
  rationale: עִשָּׂרוֹן என்பது ஓர் எப்பாவின் பத்தில் ஒரு பங்கு. தமிழில் அளவைக் குறிப்பிடாமல் ‘பத்தில் மூன்று’ என்று மட்டும் கூறுவது தெளிவில்லாததால், மறைமுகமான அலகு உரையிலேயே வெளிப்படுத்தப்பட்டது.
- source_word: לַפָּר
  choice: காளைக்கு
  rationale: פַּר பலிச் சூழலில் ஆண் மாட்டை, அதாவது காளையைக் குறிக்கிறது; மூலத்தின் ஒருமை காக்கப்பட்டது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு
  rationale: மூலத்தில் உள்ள இரண்டு பத்தாம் பங்குகள் என்ற அளவை, அதன் எப்பா அலகுடன் தெளிவாக வழங்குகிறது.
- source_word: לָאָיִל
  choice: செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பது பலிக்குரிய ஆண் செம்மறியாட்டைக் குறிக்கிறது. ‘கடா’ மட்டும் வேறு விலங்கையும் குறிக்கக்கூடும் என்பதால் முழுமையாக வழங்கப்பட்டது.
