translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதைத் தொனியுடனும் பொதுவாசகருக்குத் தெளிவாகவும் அமைக்கப்பட்டது. எபிரெயில் வினைச்சொல் இல்லாத அளவுப் பட்டியல் தமிழில் முழுமையான வாக்கியமாக அமைய ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
