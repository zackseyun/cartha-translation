  to: 'அவற்றுக்கான தானியக் காணிக்கை எண்ணெயில் கலந்த மெல்லிய மாவாக இருக்க வேண்டும்: காளைக்கு ஓர் எப்பாவின் மூன்று பத்தாம் பங்குகளும்[a], செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தாம் பங்குகளும்.'
