source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֗ם לַ/פָּ֨ר לָ/אַ֧יִל וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ta
  text: காளைக்கும், செம்மறியாட்டுக் கடாவுக்கும், ஆட்டுக்குட்டிகளுக்கும் அவற்றின் எண்ணிக்கைக்கு ஏற்ப, நியமத்தின்படி[a] அவற்றுக்குரிய தானியக் காணிக்கையையும் பானக் காணிக்கைகளையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறிப்பிடப்பட்ட முறையின்படி.’ எபிரெயச் சொல் இந்தக் காணிக்கைகளைச் செலுத்துவதற்காக நிலைநாட்டப்பட்ட விதி அல்லது சட்டப்பூர்வமான முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: பலிக்குரிய சூழலில் מִנְחָה பொதுவான காணிக்கையைக் காட்டிலும் மிருகப் பலிகளுடன் செலுத்தப்படும் தானியக் காணிக்கையைக் குறிக்கிறது. ஒருமை வடிவம் கூட்டுப்பொருளுடன் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְנִסְכֵּיהֶם
  choice: பானக் காணிக்கைகள்
  rationale: נֶסֶךְ என்பது பலியுடன் சேர்த்து ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது; ‘பானக் காணிக்கை’ நவீன தமிழில் தெளிவான வழிபாட்டுச் சொல்.
- source_word: לַפָּר
  choice: காளைக்கு
  rationale: פַּר இங்கு மந்தையிலிருந்து கொண்டுவரப்படும் காளையைக் குறிக்கிறது; மூலச்சொல் இவ்வசனத்தில் இளமையை வெளிப்படையாக வலியுறுத்தவில்லை.
- source_word: לָאַיִל
  choice: செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל பலிப் பட்டியலில் ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் தெளிவற்றிருக்கக் கூடுமாதலால் முழு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகளுக்கு
  rationale: כֶּבֶשׂ என்பது ஆட்டுக்குட்டியைக் குறிக்கிறது. பலிச் சூழலில் ஆண் குட்டிகள் கருத்தில் இருந்தாலும், இவ்வடிவில் அதைத் தனியே சேர்க்காமல் மூலத்தின் சொல்லளவு காக்கப்படுகிறது.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: பலியிடப்படும் மிருகங்களின் கணக்கோடு காணிக்கைகள் பொருந்த வேண்டும் என்ற நடைமுறைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּמִּשְׁפָּט
  choice: நியமத்தின்படி
  rationale: מִשְׁפָּט இங்கு நிலைநாட்டப்பட்ட சட்ட அல்லது வழிபாட்டு நடைமுறையைக் குறிக்கிறது. ‘நியமம்’ அதன் அதிகாரப்பூர்வத் தன்மையைச் சுருக்கமாகக் காக்கிறது.
