translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் முந்தைய கட்டளையின் தொடர்ச்சியான பெயர்ச்சொல் தொடராக இருப்பதால், தமிழில் பொருள் நிறைவடைய ‘செலுத்த வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
