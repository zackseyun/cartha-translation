source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: ta
  text: 'ஆறாம் நாளில்: எட்டுக் காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதுடைய, குறைபாடற்ற பதினான்கு ஆண் ஆட்டுக்குட்டிகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: ஆறாம் நாளில்
  rationale: தொடர்ச்சியான நாளாந்தப் பலிகளின் பட்டியலில் வரும் சொற்றொடர். தமிழில் வசனத் தொடக்கத்தில் ‘ஆறாம் நாளில்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; எபிரெய இணைப்புச்சொல்லைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: פָּרִים שְׁמֹנָה
  choice: எட்டுக் காளைகள்
  rationale: பலியிடும் சூழலில் פָּרִים என்பது காளைகளைக் குறிக்கிறது; வயது மூலத்தில் குறிப்பிடப்படாததால் ‘இளங்காளைகள்’ என்று சேர்க்கப்படவில்லை.
- source_word: אֵילִם שְׁנָיִם
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிக்கும் பலியியல் சொல். ‘கடாக்கள்’ மட்டும் ஆட்டினத்தைக் குறித்து தெளிவில்லாமல் இருக்கக்கூடும் என்பதால் முழுமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: பதினான்கு ஆட்டுக்குட்டிகள்
  rationale: כֶּבֶשׂ இளம் செம்மறியாட்டைக் குறிக்கிறது. எபிரெயச் சொல்லின் இலக்கணப் பால் ஆண்பாலாக இருந்தாலும், இயல்பான தமிழில் ‘ஆட்டுக்குட்டிகள்’ போதுமானது; பாலினத்தை வலியுறுத்தும் தனிச்சொல் மூலத்தில் இல்லை.
- source_word: בְּנֵי שָׁנָה
  choice: ஒரு வயதான
  rationale: விலங்குகள் ஒரு வயதுடையவை என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலியியல் சூழலில் உடற்குறை அல்லது குறைபாடு இல்லாத விலங்குகளைக் குறிக்கிறது; ‘நிறைவான’ என்பதைக் காட்டிலும் ‘பழுதற்ற’ துல்லியமானது.
- source_word: ellipsis from preceding sacrificial prescription
  choice: செலுத்த வேண்டும்
  rationale: எபிரெய வசனம் பெயர்ச்சொல் பட்டியலாக அமைந்து, செயலை முந்தைய சூழலிலிருந்து பெற்றுக்கொள்கிறது. தமிழில் தனி வசனமாக இயல்பாகப் புரிய இந்த மறைந்த வினை வெளிப்படுத்தப்பட்டது.
