translation_notes:
  register: நவீன பொதுத்தமிழில், பலியியல் பட்டியலின் சுருக்கமான தன்மையைப் பேணும் கண்ணியமான நடை. ‘செலுத்த வேண்டும்’ என்பது முந்தைய வசனங்களிலிருந்து விளங்கும் செயலைத் தமிழில் வெளிப்படையாக்குகிறது.
