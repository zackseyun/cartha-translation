source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: ta
  text: 'நீங்கள் யாவேக்கு இனிய நறுமணமுள்ள[a] நெருப்புப் பலியாகிய ஒரு தகனபலியைச் செலுத்த வேண்டும்: ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, குறையற்ற ஓராண்டு வயதுடைய ஏழு செம்மறியாட்டுக் குட்டிகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனநிறைவளிக்கும் நறுமணமுள்ள.’ இது பலி கடவுளுக்கு ஏற்றுக்கொள்ளத்தக்கது என்பதைக் குறிக்கும் நிலையான எபிரெய பலிசார் மரபுத்தொடர்.
    reason: ரֵיחַ נִיחֹחַ என்பதற்கான சொற்பொருள் மாற்றையும் அதன் நிலையான சடங்குசார் பயன்பாட்டையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: நீங்கள் ... செலுத்த வேண்டும்
  rationale: ஹிஃபில் வடிவம் பலியிடும் சூழலில் ஒரு பலியை முன்வைத்துச் செலுத்துவதைக் குறிக்கிறது; நவீன தமிழில் ‘செலுத்த வேண்டும்’ என்பது சடங்குசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: עֹלָה
  choice: ஒரு தகனபலி
  rationale: முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான தமிழ்ச் சொல்; எபிரெயச் சடங்குசார் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் பலி என்பதைக் குறிக்கிறது; ‘உணவுப்பலி’ என்று தேவையின்றி விளக்காமல் மூலத்தின் பொதுவான சொல்லாட்சியைப் பேணுகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமுள்ள
  rationale: கடவுளுக்கு ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலிசார் மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் வரும் יהוה என்ற உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகத் தருகிறது.
- source_word: פַּר אֶחָד
  choice: ஒரு காளை
  rationale: פַּר என்பதன் நேரடியான பொருள் காளை; இங்கு ‘இளம்’ என்பதைச் சேர்க்க மூலத்தில் கட்டாய ஆதாரம் இல்லை.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל பலிப்பட்டியல்களில் வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; தமிழில் இனத்தையும் பாலினத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ஓராண்டு வயதுள்ள ஏழு செம்மறியாட்டுக் குட்டிகள்
  rationale: ‘ஒரு ஆண்டின் பிள்ளைகள்’ என்ற எபிரெய வயதுக் குறிப்பை இயல்பான தமிழில் துல்லியமாகத் தருகிறது; மூலம் கட்டாயப்படுத்தாத பாலினத்தைச் சேர்க்கவில்லை.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலிக்குரிய விலங்குகளில் உடற்குறை அல்லது குறைபாடு இல்லாமையைச் சுருக்கமாகவும் சடங்குசார் துல்லியத்துடனும் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்குகிறது; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: רֵיחַ נִיחֹחַ என்ற பலிசார் மரபுத்தொடர்
  choice: இனிய நறுமணமுள்ள
  alternative: சாந்தப்படுத்தும் நறுமணமுள்ள
  rationale: இது பலி கடவுளுக்கு ஏற்றதாக இருப்பதைக் குறிக்கும் நிலையான மரபுத்தொடர். ‘சாந்தப்படுத்தும்’ என்பது கடவுளின் உணர்ச்சிநிலையைத் தேவையின்றி குறிப்பாக்கக்கூடும்; எனவே உருவகத்தைப் பேணும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடை. எபிரெயப் பட்டியலின் அமைப்பும் பலிசார் சொற்களின் வேறுபாடும் பேணப்பட்டுள்ளன. வசனம் நேரடியானதும் தெளிவானதும் என்பதால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
