  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: ta
  text: 'ஐந்தாம் நாளில்: ஒன்பது காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதுடைய பதினான்கு ஆண் செம்மறியாட்டுக் குட்டிகள், குறைபாடற்றவை,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: நாளில்
  rationale: בַּיּוֹם என்பதன் காலக் குறிப்பை இயல்பான தமிழில் தருகிறது. தொடக்கத்தில் உள்ள וּ என்ற இணைப்பின் பொருள் பட்டியலின் தொடர்ச்சியில் மறைமுகமாகத் தெரிகிறது; அதன் வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַ/חֲמִישִׁי
  choice: ஐந்தாம்
  rationale: ‘நாள்’ என்பதைக் குறிக்கும் வரிசை எண்ணின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: פָּרִים
  choice: காளைகள்
  rationale: பலியிடும் சூழலில் פָּרִים என்பது காளைகளைக் குறிக்கிறது; வயதை மூலவசனம் இங்கு வெளிப்படையாகக் குறிப்பிடாததால் ‘இளங்காளைகள்’ என்று சேர்க்கப்படவில்லை.
- source_word: תִּשְׁעָה
  choice: ஒன்பது
  rationale: காளைகளின் எண்ணிக்கையைக் குறிக்கும் அடிப்படை எண்.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אַיִל என்பதன் ஆண் விலங்கு சார்ந்த பொருளைத் தெளிவாகவும், அடுத்துவரும் ஆண் ஆட்டுக்குட்டிகளிலிருந்து வேறுபடுத்தியும் காட்டுகிறது.
- source_word: שְׁנָיִם
  choice: இரண்டு
  rationale: கடாக்களின் எண்ணிக்கையைக் குறிக்கும் அடிப்படை எண்.
- source_word: כְּבָשִׂים
  choice: ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: பலியிடும் சூழலில் כֶּבֶשׂ குறிக்கும் ஆண் ஆட்டுக்குட்டி என்ற குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּנֵי שָׁנָה
  choice: ஒரு வயதான
  rationale: விலங்குகளின் வயதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: אַרְבָּעָה עָשָׂר
  choice: பதினான்கு
  rationale: ஆட்டுக்குட்டிகளின் எண்ணிக்கையைக் குறிக்கும் கூட்டெண்.
- source_word: תְּמִימִם
  choice: பழுதற்றவையாக
  rationale: பலிக்குரிய விலங்குகளில் உடற்குறை அல்லது குறைபாடு இல்லாத நிலையைக் குறிக்கும் வழிபாட்டுச் சூழலுக்கேற்ற சொல்.
theological_decisions:
- issue: תְּמִימִם என்பதன் பொருள் எந்த விலங்குகளுக்குப் பொருந்துகிறது
  choice: ‘இவை பழுதற்றவையாக இருக்க வேண்டும்’ என்று பட்டியலின் முடிவில் வழங்கப்பட்டது
  alternative: ‘பழுதற்ற ஒரு வயதான ஆண் செம்மறியாட்டுக் குட்டிகள்’ என்று கடைசி விலங்குகளுக்கு மட்டும் இலக்கண ரீதியாக இணைத்தல்
  rationale: எபிரெயச் சொல் பட்டியலின் முடிவில் ஆண்பால் பன்மையில் வருகிறது. அதன் அருகாமை ஆட்டுக்குட்டிகளோடு இணைப்பை அனுமதித்தாலும், பலிப்பட்டியலின் வழக்கமான கட்டமைப்பு பட்டியலிடப்பட்ட விலங்குகள் அனைத்தும் குறையற்றவையாக இருக்க வேண்டும் என்பதைக் காட்டுகிறது. பட்டியலுக்குப் பிந்தைய தனிக் கூற்று இந்த விரிந்த இயல்பான தொடர்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘செம்மறியாட்டுக் கடாக்கள்’ மற்றும் ‘ஆண் செம்மறியாட்டுக் குட்டிகள்’ என்ற சொற்கள் விலங்குகளின் இனத்தையும் பாலினத்தையும் தெளிவுபடுத்துகின்றன. மூலவசனம் தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி தக்கவைக்கப்பட்டுள்ளது.
