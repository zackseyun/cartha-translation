  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: ta
  text: 'அவற்றின் தானியக் காணிக்கை எண்ணெய் கலந்த நுண்ணிய மாவாக இருக்க வேண்டும்: பதின்மூன்று காளைகளில் ஒவ்வொன்றுக்கும் மூன்று பத்தில்-ஒரு-பங்கு அளவுகள்[a], இரண்டு செம்மறியாட்டுக் கடாக்களில் ஒவ்வொன்றுக்கும் இரண்டு பத்தில்-ஒரு-பங்கு அளவுகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பத்தில்-ஒரு-பங்கு அளவு” என்பது மரபாக எப்பாவின் பத்தில் ஒரு பங்கு எனப் புரிந்துகொள்ளப்படும் அளவாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்கான தானியக் காணிக்கையாக
  rationale: பலியிடப்படும் விலங்குகளுடன் சேர்த்துச் செலுத்தப்படும் மִנְחָה இங்கு பொதுவான காணிக்கையல்ல, தானியக் காணிக்கையைக் குறிக்கிறது; 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு சூழலிலுள்ள பலிவிலங்குகளைச் சுட்டுகிறது.
- source_word: סֹלֶת
  choice: நைசான மாவை
  rationale: வழிபாட்டுச் சூழலில் காணிக்கைக்குப் பயன்படுத்தப்படும் நன்றாக அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் நிலையான சொல்.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெயில் பிசைந்த
  rationale: எண்ணெயுடன் மாவு கலக்கப்பட்ட தயாரிப்பு முறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: பத்தில் மூன்று பங்கு
  rationale: עִשָּׂרוֹן என்பது ஓர் அளவின் பத்தில் ஒரு பங்கு; மூலத்தில் எப்பா வெளிப்படையாக மீண்டும் சொல்லப்படாததால் அளவைச் சுருக்கமாகத் தக்கவைத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: לַפָּר הָאֶחָד
  choice: ஒவ்வொரு காளைக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு காளைக்கு’ என்றாலும், மொத்த எண்ணிக்கையிலுள்ள விலங்குகள் ஒவ்வொன்றுக்கும் உரிய அளவைப் பகிர்ந்தளிக்கும் பொருள் தமிழில் ‘ஒவ்வொரு’ எனத் தெளிவாகிறது.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: பதின்மூன்று காளைகளில்
  rationale: ஒவ்வொரு காளைக்கும் கூறப்பட்ட அளவு பொருந்தும் மொத்தக் குழு பதின்மூன்று காளைகள் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: பத்தில் இரண்டு பங்கு
  rationale: முந்தைய அளவோடு இணையாக அதே பத்தில்-ஒரு-பங்கு அளவீட்டைத் தொடர்ந்து பயன்படுத்துகிறது.
- source_word: לָאַיִל הָאֶחָד
  choice: ஒவ்வொரு கடாவுக்கும்
  rationale: இங்கும் ஒருமை வடிவம் பகிர்ந்தளிக்கும் பொருளில் வருவதால் ‘ஒவ்வொரு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: இரண்டு செம்மறியாட்டுக் கடாக்களில்
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிப்பதால், தமிழில் ‘கடா’ மட்டும் ஏற்படுத்தக்கூடிய இனத் தெளிவின்மையைத் தவிர்க்க ‘செம்மறியாட்டுக் கடா’ பயன்படுத்தப்பட்டது.
