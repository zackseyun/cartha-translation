revisions:
- from: 'அவற்றுக்கான தானியக் காணிக்கையாக, எண்ணெயில் பிசைந்த நைசான மாவைச் செலுத்த வேண்டும்: பதின்மூன்று காளைகளில் ஒவ்வொரு காளைக்கும் பத்தில் மூன்று பங்கும்[a], இரண்டு செம்மறியாட்டுக் கடாக்களில் ஒவ்வொரு கடாவுக்கும் பத்தில் இரண்டு பங்கும் செலுத்த வேண்டும்.'
  to: 'அவற்றின் தானியக் காணிக்கை எண்ணெய் கலந்த நுண்ணிய மாவாக இருக்க வேண்டும்: பதின்மூன்று காளைகளில் ஒவ்வொன்றுக்கும் மூன்று பத்தில்-ஒரு-பங்கு அளவுகள்[a], இரண்டு செம்மறியாட்டுக் கடாக்களில் ஒவ்வொன்றுக்கும் இரண்டு பத்தில்-ஒரு-பங்கு அளவுகள்.'
  rationale: The revision retains the distributive structure and the stated totals of thirteen bulls and two rams. It replaces non-idiomatic or overly specific phrasing, and it makes the repeated tenth-measure unit explicit, while reserving the conventional identification with an ephah for the footnote.
