translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் அளவு-பகிர்வு அமைப்பு தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘எப்பா’ முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
