  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ta
  text: 'யாவேக்கு இனிய நறுமணமாக ஒரு தகனபலியைச் செலுத்துங்கள்: மாட்டு மந்தையிலிருந்து ஒரு காளை, ஒரு ஆட்டுக்கடா, ஒரு வயதுடைய ஏழு ஆண் ஆட்டுக்குட்டிகள்; இவை குறைபாடற்றவையாக இருக்க வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இனிய நறுமணம்” என்பது பலி யாவேக்கு ஏற்றதாக இருப்பதைக் குறிக்கும் நிலையான எபிரேய பலிச்சடங்கு சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם עֹלָה
  choice: ஒரு தகனபலியைச் செலுத்துங்கள்
  rationale: עשׂה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், עֹלָה என்னும் பலியுடன் வரும்போது ‘பலியிடு/செலுத்து’ என்பது இயல்பான பொருள். עֹלָה முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: இது பலி யாவேக்கு ஏற்றதாக இருப்பதைக் குறிக்கும் நிலையான பலிச்சடங்கு சொற்றொடர். தமிழில் இயல்பாகவும் உருவகத்தைப் பேணியும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரேய மூலத்தில் வரும் தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: மாட்டு மந்தையிலிருந்து ஒரு காளை
  rationale: சொல்லுக்கு சொல் ‘மாடுகளின் மகனான ஒரு காளை’; மந்தையைச் சேர்ந்த காளை என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַיִל אֶחָד
  choice: ஒரு ஆட்டுக்கடா
  rationale: பலிப்பட்டியலில் אַיִל என்பது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘ஆட்டுக்கடா’ தெளிவான நவீனத் தமிழ்.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ஒரு வயதான ஏழு ஆட்டுக்குட்டிகள்
  rationale: כְּבָשִׂים என்பது ஆட்டுக்குட்டிகளையும் בְּנֵי שָׁנָה என்பது ஒரு வயதானவற்றையும் குறிக்கிறது. எண்ணிக்கையும் வயதும் வெளிப்படையாகப் பேணப்பட்டுள்ளன.
- source_word: תְּמִימִם
  choice: பழுதற்றவையாக
  rationale: பலிச்சூழலில் உடற்குறை அல்லது குறைபாடு இல்லாத விலங்குகளைக் குறிக்கும்; ‘பழுதற்ற’ என்பது இதைத் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்னும் இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை உடன்படிக்கையின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பு மூலம் பேணுகிறது.
- issue: רֵיחַ נִיחֹחַ என்பதன் பலிச்சடங்கு பொருள்
  choice: இனிய நறுமணமாக
  alternative: அமைதிப்படுத்தும் மணமாக
  rationale: மூல உருவகத்தைப் பேணுகிறது; அதே நேரத்தில் இது பலி ஏற்றுக்கொள்ளத்தக்கது என்பதைக் குறிக்கும் நிலையான பலிச்சடங்கு மொழி என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான சொற்றொடர் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. பலிச்சடங்கின் கண்ணியமான தொனியும் மூலத்தின் பட்டியல் வடிவமும் பேணப்பட்டுள்ளன.
