base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ta
  text: காளைகள், செம்மறியாட்டுக் கடாக்கள், ஆட்டுக்குட்டிகள் ஆகியவற்றின் எண்ணிக்கைக்கு ஏற்ப, விதிமுறைப்படி[a], அவற்றுக்குரிய தானியக் காணிக்கையையும் பானக் காணிக்கைகளையும் சேர்த்துச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்ணயிக்கப்பட்ட முறைப்படி.” இங்குள்ள எபிரெயச் சொல், இந்தக் காணிக்கைகளுக்காக நிறுவப்பட்ட விதி அல்லது நடைமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: பலிக்குரிய சூழலில் מִנְחָה என்பது எரிபலியுடன் செலுத்தப்படும் தானியக் காணிக்கையைக் குறிக்கிறது. ஒருமை வடிவம் கூட்டுப்பொருளில் இருப்பதால் தமிழிலும் ஒருமையாக வைக்கப்பட்டுள்ளது.
- source_word: נִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானக் காணிக்கைகள்
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கையைக் குறிக்கிறது. தமிழ் வாசகர்களுக்கு தெளிவான வழிபாட்டுச் சொல்லாக ‘பானக் காணிக்கை’ தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெய பன்மையும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַפָּרִים
  choice: காளைகள்
  rationale: פָּרִים பலிக்காகக் குறிப்பிடப்படும் ஆண் மாடுகளைக் குறிக்கிறது. ל முன்னொட்டு காட்டும் தொடர்பை ‘அவற்றுக்குரிய’ என்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לָאֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ மட்டும் தெளிவற்றிருக்கக்கூடும் என்பதால் விலங்கினம் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகள்
  rationale: כְּבָשִׂים என்பதற்கான இயல்பான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: உடன் செலுத்தப்படும் காணிக்கைகளின் அளவு பலிவிலங்குகளின் எண்ணிக்கைக்கு ஒத்திருக்க வேண்டும் என்பதை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: விதிமுறைப்படி
  rationale: இங்கு מִשְׁפָּט என்பது நிறுவப்பட்ட பலிச் சடங்கு விதி அல்லது நடைமுறையைக் குறிக்கிறது. ‘விதிமுறைப்படி’ என்பது சட்டப்பூர்வத் தொனியையும் வாசிப்புத் தெளிவையும் காக்கிறது.
- source_word: וּ
  choice: சேர்த்து
  rationale: வசனம் முந்தைய பலிப் பட்டியலைச் சார்ந்துள்ளது. தொடக்க இணைப்பின் உடன்சேர்க்கைப் பொருளை தமிழில் வாக்கியத்தின் இறுதிப் பகுதியில் ‘சேர்த்து’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
