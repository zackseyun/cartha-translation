translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் முந்தைய கட்டளையைச் சார்ந்த பெயர்த்தொடராக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக இயங்க ‘செலுத்த வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
