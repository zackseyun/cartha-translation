  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: ta
  text: பாவநிவாரண பலியாக ஒரு வெள்ளாட்டுக்கடாவைச்[a], வழக்கமாகச் செலுத்தப்படும் தகனபலியோடும்[b] அதற்குரிய தானியபலியோடும் பானபலியோடும் கூடுதலாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு ஆண் வெள்ளாட்டையும்.”
    reason: lexical_alternative
  - marker: b
    text: “வழக்கமாகச் செலுத்தப்படும்” என்பதற்கான எபிரெயச் சொல் தொடர்ந்து, மீண்டும் மீண்டும் செலுத்தப்படும் பலியைக் குறிக்கிறது; இதை “தினந்தோறும் செலுத்தப்படும்” அல்லது “தொடர்ந்து செலுத்தப்படும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: ஒரு வெள்ளாட்டுக்கடாவையும்
  rationale: שְׂעִיר என்பது பலிச்சூழலில் ஆண் வெள்ளாட்டைக் குறிக்கிறது; אֶחָד எண்ணிக்கையைத் தெளிவாகக் குறிப்பிடுகிறது. தொடரும் பட்டியலைக் காட்ட וּ என்பது ‘-யும்’ எனக் கொண்டுவரப்பட்டுள்ளது.
- source_word: חַטָּאת
  choice: பாவநிவாரண பலியாக
  rationale: பலிச்சூழலில் இச்சொல் வெறும் ‘பாவம்’ என்பதை அல்ல, பாவத்துக்காகச் செலுத்தப்படும் குறிப்பிட்ட பலிவகையைக் குறிக்கிறது.
- source_word: מִ/לְּ/בַד
  choice: தவிர
  rationale: இங்கு கூறப்படும் பலி, வழக்கமான பலியுடன் கூடுதலாகச் செலுத்தப்படுவதை இந்தச் சொல் குறிக்கிறது.
- source_word: עֹלַת הַ/תָּמִיד
  choice: வழக்கமாகச் செலுத்தப்படும் தகனபலி
  rationale: עֹלָה என்பதற்கு நிலைபெற்ற ‘தகனபலி’ பயன்படுத்தப்பட்டுள்ளது. תָּמִיד என்பது தொடர்ந்து, முறையாக மீண்டும் மீண்டும் செலுத்தப்படும் பலியைக் குறிக்கிறது.
- source_word: מִנְחָתָ/הּ
  choice: அதற்குரிய தானியபலி
  rationale: வழிபாட்டுச் சூழலில் מִנְחָה தானியபலியைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு முன் கூறப்பட்ட தகனபலியைச் சுட்டுகிறது; இயல்பான தமிழுக்காக ‘அதற்குரிய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/נִסְכָּ/הּ
  choice: பானபலி
  rationale: נֶסֶךְ பலியுடன் ஊற்றப்படும் பானபலியைக் குறிக்கிறது. பின்னொட்டு இதுவும் அந்தத் தகனபலிக்குரியது என்பதைக் காட்டுகிறது.
