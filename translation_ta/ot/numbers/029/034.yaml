translation_notes:
  register: நவீனத் தரத் தமிழில், பலிச்சொற்களுக்கான தெளிவானதும் வழக்கில் நிலைபெற்றதுமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. முந்தைய வசனங்களின் பலிப்பட்டியலைத் தொடரும் எபிரெய வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்க, சூழலில் உட்கிடக்கும் ‘செலுத்த வேண்டும்’ என்ற வினை சேர்க்கப்பட்டுள்ளது.
