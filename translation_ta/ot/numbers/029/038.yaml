revisions:
- from: பாவநிவாரணப் பலியாக ஓர் ஆட்டுக்கடாவையும் செலுத்த வேண்டும்;[a] இது வழக்கமான தகனபலிக்கும்,[b] அதனுடன் செலுத்தப்படும் தானியக் காணிக்கைக்கும் பானக் காணிக்கைக்கும் கூடுதலானது.
  to: பாவநிவாரணப் பலியாக ஒரு வெள்ளாட்டையும் செலுத்த வேண்டும்;[a] இது வழக்கமான தகனபலிக்கும் அதன் தானியக் காணிக்கைக்கும் அதன் பானக் காணிக்கைக்கும் கூடுதலானது.[b]
  rationale: The animal term has been corrected from ram/sheep to goat, matching the Hebrew. The main text retains the broader, natural sense “வெள்ளாடு,” and footnote a records that the Hebrew may specifically denote a male goat in sacrificial usage. The possessive relationship of both accompanying offerings to the regular burnt offering is stated explicitly.
