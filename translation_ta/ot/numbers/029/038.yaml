source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ta
  text: பாவநிவாரணப் பலியாக ஒரு வெள்ளாட்டையும் செலுத்த வேண்டும்;[a] இது வழக்கமான தகனபலிக்கும் அதன் தானியக் காணிக்கைக்கும் அதன் பானக் காணிக்கைக்கும் கூடுதலானது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பாவநிவாரணப் பலியாக ஓர் ஆண் வெள்ளாட்டையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தொடர்ந்து செலுத்தப்படும் தகனபலிக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ஓர் ஆட்டுக்கடாவையும்
  rationale: שׂעִיר என்பது வெள்ளாட்டைக் குறிக்கும்; பலிச் சூழலில் குறிப்பாக ஆண் வெள்ளாட்டைக் குறிக்கக்கூடும். தமிழில் பலிக்குரிய ஆண் ஆட்டை இயல்பாகவும் தெளிவாகவும் குறிக்க ‘ஆட்டுக்கடா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: ஆசாரியப் பலிமுறைச் சூழலில் חַטָּאת என்பது பொதுவாக பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது; வெறும் ‘பாவம்’ என்று பொருள்படாது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலியிடப்படும் விலங்கின் எண்ணிக்கை ஒன்று என்பதைச் சுட்டுகிறது.
- source_word: מִ/לְּ/בַד
  choice: கூடுதலானது
  rationale: இங்கு கூறப்படும் பலி ஏற்கெனவே கட்டளையிடப்பட்ட தொடர்ச்சியான பலிகளுடன் கூடுதலாகச் செலுத்தப்பட வேண்டும் என்பதைக் குறிக்கிறது.
- source_word: עֹלַת הַ/תָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: עֹלָה என்பது தகனபலியையும், תָּמִיד தொடர்ந்து முறையாகச் செலுத்தப்படும் தன்மையையும் குறிக்கிறது. ‘வழக்கமான’ என்பது வாசிக்க இயல்பாக இருந்து நிறுவப்பட்ட தொடர் பலியை உணர்த்துகிறது.
- source_word: וּ/מִנְחָתָ/הּ
  choice: அதனுடன் செலுத்தப்படும் தானியக் காணிக்கை
  rationale: ஆசாரியப் பலிமுறைச் சூழலில் מִנְחָה என்பது தானியக் காணிக்கையைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு தகனபலியைக் குறிக்கிறது; தமிழில் உறவைத் தெளிவாக்க ‘அதனுடன் செலுத்தப்படும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְ/נִסְכָּ/הּ
  choice: பானக் காணிக்கை
  rationale: נֶסֶךְ என்பது பலியுடன் செலுத்தப்படும் பானக் காணிக்கை. பின்னொட்டு தகனபலியைக் குறிக்கிறது; முந்தைய தொடர்புச் சொற்றொடர் இதற்கும் பொருந்துமாறு தமிழ் வாக்கியம் அமைக்கப்பட்டது.
