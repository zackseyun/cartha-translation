  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பு இயல்பான தமிழில் கட்டளையாகவும், מִלְּבַד குறிக்கும் கூடுதல் உறவு தெளிவாகவும் வழங்கப்பட்டுள்ளது.
