base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ta
  text: காளைகளுக்கும், செம்மறியாட்டுக் கடாக்களுக்கும், செம்மறியாட்டுக் குட்டிகளுக்கும் உரிய தானியக் காணிக்கையையும் பானக் காணிக்கைகளையும், அவற்றின் எண்ணிக்கைக்கு ஏற்ப, விதிமுறைப்படி[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிர்ணயிக்கப்பட்ட முறைப்படி.’ இங்குள்ள எபிரெயச் சொல், இந்தக் காணிக்கைகளுக்கான நிறுவப்பட்ட பலிச் சடங்கு விதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கைகள்
  rationale: பலியிடப்படும் விலங்குகளோடு செலுத்தப்படும் தானியக் காணிக்கைகளைக் குறிக்கும் பலிச் சடங்கு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல்லிலுள்ள தொடர்பையும் பன்மைச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִסְכֵּיהֶם
  choice: பானக் காணிக்கைகள்
  rationale: பலியோடு ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கைகளைக் குறிக்கும் வழக்கமான, எளிதில் புரியும் தமிழ்ச் சொற்றொடர்.
- source_word: לַפָּרִים
  choice: காளைகளுக்கு
  rationale: பலிப்பட்டியலில் פָּרִים என்பதன் நேரடியான பொருள்; மூலத்தில் வெளிப்படையாக இல்லாத வயது விவரத்தைச் சேர்க்கவில்லை.
- source_word: לָאֵילִם
  choice: செம்மறியாட்டுக் கடாக்களுக்கு
  rationale: אַיִל என்பது பலிக்குரிய ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடாக்கள்’ மட்டும் தெளிவற்றதாக இருக்கக்கூடும் என்பதால் விலங்கினம் குறிப்பிடப்பட்டது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகளுக்கு
  rationale: כֶּבֶשׂ என்பதன் இயல்பான தமிழ் இணை; இவ்வசனம் தனியாக ஆண்பாலை வலியுறுத்தாததால் தேவையற்ற மிகைத்துல்லியம் தவிர்க்கப்பட்டது.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: ஒவ்வொரு வகை பலிவிலங்கின் நிர்ணயிக்கப்பட்ட எண்ணிக்கைக்கேற்ப காணிக்கைகள் அமைய வேண்டும் என்ற பொருத்தத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: விதிமுறைப்படி
  rationale: நிறுவப்பட்ட பலிச் சடங்கு ஒழுங்கையோ கட்டளையையோ குறிக்கும் சொல்லைச் சுருக்கமாகவும் முறையான தமிழிலும் தருகிறது.
