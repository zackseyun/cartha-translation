  source_fidelity: திருத்தம் தேவை. எபிரெயத்தில் מִנְחָתָם என்பது ஒருமை வடிவில் (‘அவர்களுடைய/அவற்றுக்குரிய தானியக் காணிக்கை’) உள்ளது; நிஸ்கேיהם மட்டும் பன்மை. மேலும் כְּבָשִׂים என்பது ஆட்டுக்குட்டிகள் என்ற பொதுப்பெயரைக் காட்டிலும் குறிப்பாகச் செம்மறியாட்டுக் குட்டிகளைக் குறிக்கிறது. மூலத்தில் வினைச்சொல் இல்லாத பட்டியல்-தொடரின் தன்மையை ‘செலுத்த வேண்டும்’ சேர்ப்பதால் தேவையின்றி முழுவாக்கியக் கட்டளையாக மாற்றுகிறது.
  naturalness: ‘காளைகளுக்கும், செம்மறியாட்டுக் கடாக்களுக்கும், செம்மறியாட்டுக் குட்டிகளுக்கும் உரிய ... அவற்றின் எண்ணிக்கைக்கு ஏற்ப, விதிமுறைப்படி’ என்பது நவீனத் தரமான தமிழில் இயல்பாகவும் சடங்கு-பட்டியல் நடைக்கு ஏற்றதாகவும் உள்ளது. வினைச்சொல்லற்ற அமைப்பு, இவ்வசனம் தொடரும் பலிநியமப் பட்டியலின் பகுதி என்பதையும் காக்கிறது.
  terminology: ‘தானியக் காணிக்கை,’ ‘பானக் காணிக்கைகள்,’ ‘செம்மறியாட்டுக் கடாக்கள்,’ ‘செம்மறியாட்டுக் குட்டிகள்,’ ‘விதிமுறைப்படி’ ஆகியவை துல்லியமானவை. ‘செம்மறியாட்டுக்’ என்பதை குட்டிகளுடனும் சேர்ப்பது lambs என்பதன் விலங்கினக் குறிப்பைத் தெளிவாக்குகிறது.
