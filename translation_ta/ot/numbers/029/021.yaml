translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. எபிரெய வசனம் தொடர்வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால், தமிழில் கருத்தை நிறைவு செய்ய ‘செலுத்த வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது. பட்டியலின் இணைப்பும் சடங்கு சார்ந்த துல்லியமும் காக்கப்பட்டுள்ளன.
