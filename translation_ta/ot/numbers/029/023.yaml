base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ta
  text: 'நான்காம் நாளில்: காளைகள் பத்து, செம்மறியாட்டுக் கடாக்கள் இரண்டு, குறைபாடற்ற ஒரு வயதுடைய செம்மறியாட்டுக் குட்டிகள் பதினான்கு;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִי
  choice: நான்காம் நாளில்
  rationale: தொடர்ச்சியான பலிப்பட்டியலில் அடுத்த நாளுக்குரியவற்றை அறிமுகப்படுத்தும் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது. பட்டியல் சூழலே எபிரேய இணைப்புச் சொல்லின் தொடர்ச்சிப் பொருளைத் தெளிவாக்குகிறது.
- source_word: פָּרִים עֲשָׂרָה
  choice: காளைகள் பத்து
  rationale: பலிச்சூழலில் פָּרִים என்பது காளைகளைக் குறிக்கிறது; எபிரேயப் பட்டியலின் பெயர்-எண் வரிசையைத் தமிழிலும் காக்கிறது.
- source_word: אֵילִם שְׁנָיִם
  choice: செம்மறியாட்டுக் கடாக்கள் இரண்டு
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிக்கும்; ‘கடாக்கள்’ பாலினத்தையும் பலிக்குரிய விலங்கு வகையையும் தெளிவாகக் காட்டுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ஒரு வயதான செம்மறியாட்டுக் குட்டிகள் பதினான்கு
  rationale: בְּנֵי שָׁנָה என்ற எபிரேய மரபுத்தொடரை இயல்பாக ‘ஒரு வயதான’ என வழங்கி, כְּבָשִׂים என்பதன் விலங்கு வகையைத் தெளிவுபடுத்துகிறது.
- source_word: תְּמִימִם
  choice: பழுதற்றவையாக இருக்க வேண்டும்
  rationale: பலிச்சட்டச் சூழலில் உடல் குறைபாடில்லாத விலங்குகள் என்பதே பொருள். தமிழில் விதிப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
