- from: 'நான்காம் நாளில்: காளைகள் பத்து, செம்மறியாட்டுக் கடாக்கள் இரண்டு, ஒரு வயதான செம்மறியாட்டுக் குட்டிகள் பதினான்கு; இவை பழுதற்றவையாக இருக்க வேண்டும்.'
  to: 'நான்காம் நாளில்: காளைகள் பத்து, செம்மறியாட்டுக் கடாக்கள் இரண்டு, குறைபாடற்ற ஒரு வயதுடைய செம்மறியாட்டுக் குட்டிகள் பதினான்கு;'
