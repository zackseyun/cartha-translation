  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ta
  text: பாவநிவாரணப் பலியாக ஓர் ஆண் வெள்ளாட்டையும் செலுத்த வேண்டும். இது வழக்கமான தகனபலிக்கும், அதற்குரிய தானியக் காணிக்கைக்கும், அதற்குரிய பானக் காணிக்கைக்கும் கூடுதலானது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ஓர் ஆண் வெள்ளாடு
  rationale: שָׂעִיר என்பது ஆண் வெள்ளாட்டைக் குறிக்கிறது; பலிகளின் பட்டியலில் இயல்பான தமிழுக்காக இணைப்புப் பொருள் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச் சடங்கு சூழலில் חַטָּאת என்பது வெறும் ‘பாவம்’ என்பதை அல்ல, பாவத்திற்காகச் செலுத்தப்படும் பலிவகையைக் குறிக்கிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலியிடப்பட வேண்டிய விலங்கின் எண்ணிக்கை ஒன்றென்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִ/לְּ/בַד
  choice: கூடுதலானது
  rationale: இந்தப் பலி வழக்கமான பலித் தொகுப்புடன் சேர்த்து செலுத்தப்பட வேண்டியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֹלַת
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான, சுருக்கமான தமிழ் வழக்குச் சொல்.
- source_word: הַ/תָּמִיד
  choice: வழக்கமான
  rationale: תָּמִיד குறிக்கும் தொடர்ந்து, நிர்ணயிக்கப்பட்ட முறையில் செலுத்தப்படும் தன்மையை வெளிப்படுத்துகிறது; எபிரெயச் சொல்லில் இல்லாத ‘தினசரி’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: וּ/מִנְחָתָ/הּ
  choice: அதற்குரிய தானியக் காணிக்கை
  rationale: ஆசாரிய பலிப்பட்டியல்களில் מִנְחָה உடன் செலுத்தப்படும் தானியக் காணிக்கையைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு தகனபலியைச் சுட்டுவதால் ‘அதற்குரிய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/נִסְכָּ/הּ
  choice: அதற்குரிய பானக் காணிக்கை
  rationale: נֶסֶךְ பலிச் சூழலில் ஊற்றிச் செலுத்தப்படும் பானக் காணிக்கையைக் குறிக்கிறது; பின்னொட்டின் தொடர்பும் பாதுகாக்கப்பட்டுள்ளது.
