translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மற்றும் சட்டச் சூழலுக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத வினையைத் தமிழில் முழுமையான கட்டளையாகப் புரியச் செய்ய ‘செலுத்த வேண்டும்’ எனச் சூழலிலிருந்து நிறைவு செய்துள்ளது.
