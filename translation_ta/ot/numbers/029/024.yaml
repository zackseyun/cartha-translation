source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ta
  text: மேலும், காளைகளுக்கும் செம்மறியாட்டுக் கடாக்களுக்கும் ஆட்டுக்குட்டிகளுக்கும் உரிய தானியப் படையலையும் பானப் படையல்களையும், அவற்றின் எண்ணிக்கைக்கு ஏற்ப, நிர்ணயிக்கப்பட்ட முறைப்படி[a] செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியமத்தின்படி.” எபிரெயச் சொல் இந்தப் படையல்களுக்காக ஏற்படுத்தப்பட்ட சட்டப்பூர்வ நடைமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியப் படையல்களை
  rationale: பலியிடப்படும் விலங்குகளுடன் சேர்த்துச் செலுத்தப்படும் தானியப் படையல்களையே இந்தப் பலிச் சூழலில் מִנְחָה குறிக்கிறது. எபிரெயச் சொல் இலக்கணப்படி ஒருமையாக இருந்தாலும், பல விலங்குகளுக்குரிய கூட்டுப்பொருளைத் தமிழில் இயல்பாகப் பன்மையில் வெளிப்படுத்துகிறது.
- source_word: וְנִסְכֵּיהֶם
  choice: பானப் படையல்களை
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் திரவப் படையலைக் குறிக்கிறது; ‘பானப் படையல்’ என்பது நவீனத் தமிழில் தெளிவாகவும் பலிச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לַפָּרִים
  choice: காளைகளுக்கு உரிய
  rationale: முன்னொட்டு ל இங்கு அந்தந்த விலங்குகளோடு தொடர்புடைய துணைப் படையல்களைப் பகிர்ந்துரைக்கும் உறவைக் குறிக்கிறது.
- source_word: לָאֵילִם
  choice: செம்மறியாட்டுக் கடாக்களுக்கு உரிய
  rationale: אַיִל என்பது இங்கு பலிக்குரிய ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘செம்மறியாட்டுக் கடா’ தமிழில் துல்லியமான வேறுபாட்டைக் காட்டுகிறது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகளுக்கு உரிய
  rationale: כְּבָשִׂים என்பது இந்தப் பலிச் சூழலில் ஆட்டுக்குட்டிகளைக் குறிக்கிறது; பட்டியலின் இணைப்பு தொடர்ச்சியாக வைக்கப்பட்டுள்ளது.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: துணைப் படையல்கள் விலங்குகளின் எண்ணிக்கைக்கு ஒப்பாக நிர்ணயிக்கப்படுவதை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: நிர்ணயிக்கப்பட்ட முறைப்படி
  rationale: מִשְׁפָּט இங்கு பொதுவான வழக்கத்தை அல்ல, பலிகளுக்காக சட்டப்படி வகுக்கப்பட்ட நடைமுறையைச் சுட்டுகிறது; இந்தத் தமிழ் வடிவம் அதன் சட்டப்பூர்வ மற்றும் நடைமுறை சார்ந்த நுணுக்கங்களை இணைக்கிறது.
