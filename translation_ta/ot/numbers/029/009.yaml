source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: ta
  text: 'அவற்றின் தானியக் காணிக்கை: எண்ணெயுடன் கலந்த மெல்லிய மாவு—காளைக்கு மூன்று பத்தளவுகள், அந்த ஒரு கடாவுக்கு இரண்டு பத்தளவுகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்கான தானியக் காணிக்கையாக
  rationale: பலிகளாகச் செலுத்தப்படும் மிருகங்களுடன் இணைந்த மִנְחָה என்பதைக் குறிப்பதால், வழிபாட்டுச் சூழலில் தெளிவான ‘தானியக் காணிக்கை’ பயன்படுத்தப்பட்டது. 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு, முந்தைய வசனத்தில் கூறப்பட்ட பலிமிருகங்களைக் குறிக்கும் வகையில் ‘அவற்றுக்கான’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவை
  rationale: காணிக்கைக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கிறது; நவீன தமிழில் எளிதாகப் புரியும் ‘மெல்லிய மாவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: எண்ணெயோடு மாவு கலக்கப்பட்டிருப்பதைச் சொல்லும் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் துல்லியமாகக் கொடுக்கிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: மூன்று பத்தில் பங்கு
  rationale: עִשָּׂרוֹן என்பது ஓர் அளவின் பத்தில் ஒரு பங்கைக் குறிக்கும். எபா என்பது எபிரெய உரையில் வெளிப்படையாக இல்லாததால், அதை முதன்மை உரையில் சேர்க்காமல் அளவின் தன்மை அடிக்குறிப்பில் விளக்கப்பட்டது.
- source_word: לַפָּר
  choice: காளைக்கு
  rationale: முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட காளையைச் சுட்டும் எபிரெய ஒருமை பெயர்ச்சொல்லைத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: இரண்டு பத்தில் பங்கு
  rationale: இரண்டு பத்தளவுகளைக் குறிக்கிறது; மூலத்தில் ‘எபா’ வெளிப்படையாக இல்லாததால் சுருக்கமான அளவுச் சொல்லாக்கம் காக்கப்பட்டது.
- source_word: לָאַיִל הָאֶחָד
  choice: அந்த ஒரு செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; הָאֶחָד தரும் குறிப்பிட்ட ‘ஒரு’ என்ற வலியுறுத்தலை ‘அந்த ஒரு’ எனத் தக்கவைத்தது.
