translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையும் சட்டவழி அறிவுறுத்தலின் தெளிவும் காக்கப்பட்டுள்ளன. எபிரெய வசனம் பெயர்ச்சொல் தொடர்களாக அமைந்திருந்தாலும், தமிழில் முழுமையான மற்றும் இயல்பான வாக்கியமாக ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது சூழலிலுள்ள கட்டளையின் பொருளை வெளிப்படுத்துகிறது.
