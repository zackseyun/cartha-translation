revisions:
- from: 'அவற்றுக்கான தானியக் காணிக்கையாக, எண்ணெயுடன் கலந்த மெல்லிய மாவைச் செலுத்த வேண்டும்: காளைக்கு மூன்று பத்தில் பங்கும்[a], அந்த ஒரு செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தில் பங்கும் செலுத்த வேண்டும்.'
  to: 'அவற்றின் தானியக் காணிக்கை: எண்ணெயுடன் கலந்த மெல்லிய மாவு—காளைக்கு மூன்று பத்தளவுகள், அந்த ஒரு கடாவுக்கு இரண்டு பத்தளவுகள்.'
  rationale: The revision retains every explicit source element while representing the plural tenth-measures clearly in Tamil. It also follows the Hebrew's nominal, list-like syntax rather than adding repeated imperative wording. The footnote is revised to explain the measure accurately and naturally.
