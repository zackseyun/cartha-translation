translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் கூடுதல் பலி என்ற உறவு, தமிழில் இயல்பாக இருக்க வாக்கிய அமைப்பை மாற்றி வெளிப்படுத்தப்பட்டது.
