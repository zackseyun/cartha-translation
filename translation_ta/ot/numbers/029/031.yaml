  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: ta
  text: 'வழக்கமான தகன பலியையும்[a], அதற்குரிய தானியப் பலியையும் பானப் பலிகளையும்[b] செலுத்துவதோடு, பாவநிவாரணப் பலியாக ஒரு வெள்ளாட்டுக் கடாவையும் செலுத்த வேண்டும்.


    [a] அல்லது, “தொடர்ச்சியான தகன பலி.”

    [b] “பானப் பலிகள்” என்பதை “நீர்மப் படையல்கள்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ச்சியான தகன பலி.”
    reason: lexical_alternative
  - marker: b
    text: “பானப் பலிகள்” என்பதை “நீர்மப் படையல்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: வெள்ளாட்டுக் கடா
  rationale: பலிச் சூழலில் இச்சொல் பொதுவாக ஆண் வெள்ளாட்டைக் குறிக்கிறது; ‘வெள்ளாட்டுக் கடா’ என்பது பாலினத்தையும் இயல்பான தமிழிலும் தெளிவாகக் காட்டுகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: வழிபாட்டுச் சூழலில் இது பாவம் என்ற கருத்தை மட்டும் அல்லாமல், பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: செலுத்தப்பட வேண்டிய வெள்ளாட்டுக் கடாவின் எண்ணிக்கையைக் குறிக்கும் எண்.
- source_word: מִלְּבַד
  choice: செலுத்துவதோடு … மேலும்
  rationale: குறிப்பிடப்பட்ட வெள்ளாட்டுக் கடா வழக்கமான பலிகளுக்கு மாற்றாக அல்ல, அவற்றுடன் கூடுதலாகச் செலுத்தப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான தகன பலி
  rationale: நியமிக்கப்பட்ட முறையில் மீண்டும் மீண்டும் செலுத்தப்படும் தகன பலியைக் குறிக்கிறது. ‘வழக்கமான’ என்பது நவீன தமிழில் இயல்பானது; ‘தொடர்ச்சியான’ என்பது அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
- source_word: מִנְחָתָהּ
  choice: அதற்குரிய தானியப் பலி
  rationale: பலிப் பட்டியல்களில் מִנְחָה உடன் செலுத்தப்படும் தானியப் பலியைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு தகன பலியையே சுட்டுவதால் ‘அதற்குரிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּנְסָכֶיהָ
  choice: பானப் பலிகள்
  rationale: ஊற்றிச் செலுத்தப்படும் நீர்மப் படையல்களைக் குறிக்கும் பன்மை வடிவம். ‘பானப் பலிகள்’ வாசகர்களுக்கு எளிதில் புரியும்; மற்றொரு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
