translation_notes:
  register: நவீன நிலையான தமிழில், பலிச் சட்டத்தின் கண்ணியமான நடை காக்கப்பட்டுள்ளது. எபிரெய வசனம் முன் வசனத்தின் கட்டளையைத் தொடரும் துணைவாக்கியமாக இருப்பதால், தமிழில் முழுமையான கட்டளை வாக்கியமாக இயல்புபடுத்த ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டுள்ளது. எந்த அடிக்குறிப்பும் தேவையில்லை; ஆங்கில அடிக்குறிப்பு குறி ‘bulls’ என்பதோடு தவறாகத் தோன்றினாலும் அதன் உள்ளடக்கம் כַּמִּשְׁפָּט பற்றியது என்பதால், பொருள் நேரடியாக முதன்மை உரையில் வழங்கப்பட்டுள்ளது.
