  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ta
  text: காளைகளுக்கும், செம்மறியாட்டுக் கடாக்களுக்கும், ஆட்டுக்குட்டிகளுக்கும் உரிய தானியக் காணிக்கையும் பானக் காணிக்கைகளும், அவற்றின் எண்ணிக்கைக்கு ஏற்ப, நியமிக்கப்பட்ட முறைப்படி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியமிக்கப்பட்ட விதிப்படி.” எபிரெயச் சொல் நிறுவப்பட்ட விதிமுறை அல்லது நடைமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: பலியிடப்படும் விலங்குகளுடன் சேர்த்துச் செலுத்தப்படும் மִנְחָה இச்சூழலில் குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது. எபிரெயச் சொல்லின் ஒருமை வடிவமும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: נִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானக் காணிக்கைகள்
  rationale: נֶסֶךְ என்பது பலிகளுடன் ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கை. ‘பானக் காணிக்கை’ நவீனத் தமிழில் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது; மூலத்தின் பன்மையும் காக்கப்படுகிறது.
- source_word: לַפָּרִים
  choice: காளைகளுக்கும்
  rationale: முன்னொட்டு ל இங்கு ஒவ்வொரு வகை பலி விலங்குக்கும் தொடர்புடைய துணைக் காணிக்கைகளைப் பகிர்ந்துரைக்கிறது.
- source_word: לָאֵילִם
  choice: செம்மறியாட்டுக் கடாக்களுக்கும்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது. ‘கடாக்கள்’ மட்டும் தெளிவற்றிருக்கக்கூடும் என்பதால் இனத்தை வெளிப்படையாகக் கூறுகிறது.
- source_word: וְלַכְּבָשִׂים
  choice: ஆட்டுக்குட்டிகளுக்கும்
  rationale: כְּבָשִׂים பலிச் சட்டச் சூழலில் ஆட்டுக்குட்டிகளைக் குறிக்கிறது; பட்டியலின் இணைப்பும் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: காணிக்கைகளின் அளவு பட்டியலிடப்பட்ட விலங்குகளின் எண்ணிக்கையோடு ஒத்திருக்க வேண்டும் என்ற பகிர்வு சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: நியமிக்கப்பட்ட முறைப்படி
  rationale: מִשְׁפָּט இங்கு பொதுவான நீதித்தீர்ப்பை அல்ல, காணிக்கைகளுக்காக நிறுவப்பட்ட விதிமுறையையோ நடைமுறையையோ குறிக்கிறது. இந்தத் தேர்வு சட்டமுறைத் தன்மையையும் செய்முறைப் பொருளையும் ஒன்றாகக் காக்கிறது.
