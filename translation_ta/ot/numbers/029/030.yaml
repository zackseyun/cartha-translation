  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ta
  text: காளைகளுக்கும், ஆட்டுக்கடாக்களுக்கும், செம்மறியாட்டுக் குட்டிகளுக்கும் அவற்றின் எண்ணிக்கைக்கு ஏற்ப, நியமிக்கப்பட்ட முறைப்படி[a] செலுத்த வேண்டிய தானியக் காணிக்கையையும் பானக் காணிக்கைகளையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியமத்தின்படி.” எபிரெயச் சொல் காணிக்கைகள் செலுத்தப்பட வேண்டிய நிறுவப்பட்ட விதியையோ முறையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: செலுத்த வேண்டிய தானியக் காணிக்கை
  rationale: பலிகளுடன் சேர்த்துச் செலுத்தப்படும் மִנְחָה இங்கு பொதுவான காணிக்கையை அல்ல, தானியக் காணிக்கையைக் குறிக்கிறது. எபிரெயில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருவதால் தமிழிலும் ஒருமை இயல்பாக உள்ளது.
- source_word: נִסְכֵּיהֶם
  choice: செலுத்த வேண்டிய பானக் காணிக்கைகள்
  rationale: נֶסֶךְ என்பது பலிகளுடன் ஊற்றிச் செலுத்தப்படும் பானக் காணிக்கையைக் குறிக்கிறது; ‘பானக் காணிக்கை’ நவீன தமிழில் தெளிவான பலியியல் சொல்.
- source_word: לַפָּרִים
  choice: காளைகளுக்கு
  rationale: פַּר பலிப் பட்டியல்களில் காளையைக் குறிக்கிறது. இங்கு வயது வெளிப்படையாகக் குறிப்பிடப்படாததால் ‘இளங்காளைகள்’ என்று மிகைப்படுத்தப்படவில்லை.
- source_word: לָאֵילִם
  choice: ஆட்டுக்கடாக்களுக்கு
  rationale: אַיִל பலியியல் சூழலில் ஆட்டுக்கடாவை நேரடியாகக் குறிக்கிறது.
- source_word: וְלַכְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகளுக்கு
  rationale: כֶּבֶשׂ செம்மறியாட்டுக் குட்டியைக் குறிக்கிறது. பலியியல் பயன்பாட்டில் ஆண் குட்டி என இருக்கக்கூடும்; ஆனால் இவ்வசனத்தில் பாலினம் தனியாக வலியுறுத்தப்படாததால் அது சேர்க்கப்படவில்லை.
- source_word: בְּמִסְפָּרָם
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: விலங்குகளின் நிர்ணயிக்கப்பட்ட எண்ணிக்கையுடன் காணிக்கைகள் பொருந்த வேண்டும் என்ற நடைமுறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כַּמִּשְׁפָּט
  choice: நியமிக்கப்பட்ட முறைப்படி
  rationale: מִשְׁפָּט இங்கு பொதுவான ‘தீர்ப்பு’ அல்ல; காணிக்கைகள் செலுத்தப்பட வேண்டிய நிறுவப்பட்ட விதி அல்லது முறை. சூழலில் ‘நியமிக்கப்பட்ட முறைப்படி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
