translation_notes:
  register: நவீன தரத் தமிழில், பலியியல் சொற்களின் தனித்தன்மையைப் பேணும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் வினை இல்லாத துணை வாக்கியம் தமிழில் முழுமையாகவும் இயல்பாகவும் அமைய, முந்தைய வசனங்களில் தொடரும் கட்டளையை வெளிப்படையாக்கி ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
