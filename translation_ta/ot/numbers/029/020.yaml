  source_fidelity: 'எபிரெய மூலத்தின் பட்டியல் அமைப்பும் எண்ணிக்கைகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: பதினொரு காளைகள், இரண்டு கடாக்கள், ஓராண்டு வயதுள்ள பதினான்கு செம்மறியாட்டுக் குட்டிகள். תְּמִימִם என்பது உடற்குறையற்ற/குறைபாடற்ற பலிவிலங்குகளைக் குறிக்கும் பயன்பாட்டில் சரியாகத் தரப்பட்டுள்ளது; இலக்கண ரீதியாக அது அருகிலுள்ள குட்டிகளை விவரிப்பதும் பொருத்தமானது. தொடக்க இணைப்புச்சொல் தமிழின் தொடர்ச்சியான பட்டியல் நடையில் வெளிப்படையாக மொழிபெயர்க்கப்படாமலும் இயல்பாகப் புரிகிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது. “செம்மறியாட்டுக் கடாக்கள்” மற்றும் “ஓராண்டு செம்மறியாட்டுக் குட்டிகள்” ஆகியவை பலிச் சூழலுக்கேற்ற, வாசகனுக்குப் புரியும் சொற்கள். எண்ணிக்கைக்குப் பின் பெயர்ச்சொல்லை வைக்கும் பட்டியல் நடை தமிழில் ஏற்றது.
