lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: எண்ணிக்கையிலுள்ள தொடரைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது. எபிரெயச் சொல்லின் இணைப்புப் பொருள் சூழலிலேயே தெளிவாக இருப்பதால் தனியாக ‘மேலும்’ எனச் சேர்க்கப்படவில்லை.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: காளைகள் பதினொன்று
  rationale: பலிக்குரிய ஆண் மாடுகளைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் மொழிபெயர்ப்பு.
- source_word: אֵילִם שְׁנָיִם
  choice: செம்மறியாட்டுக் கடாக்கள் இரண்டு
  rationale: אֵילִם என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ பாலினத்தையும் விலங்கின் வகையையும் தெளிவாகக் காட்டுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ஓராண்டு செம்மறியாட்டுக் குட்டிகள் பதினான்கு
  rationale: בְּנֵי שָׁנָה என்ற எபிரெய மரபுத்தொடர் ஓராண்டு வயதுடைய விலங்குகளைக் குறிக்கிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் கொடுக்கப்பட்டுள்ளது.
- source_word: תְּמִימִם
  choice: குறைபாடில்லாத
  rationale: பலியிடப்படும் விலங்குகள் உடற்குறை அல்லது பழுதின்றி இருக்க வேண்டும் என்ற வழிபாட்டுச் சூழலிலான பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: תְּמִימִם எவற்றை விவரிக்கிறது?
  choice: அருகில் வரும் ‘ஓராண்டு செம்மறியாட்டுக் குட்டிகள்’ என்பதுடன் இணைக்கப்பட்டது.
  alternative: பட்டியலிலுள்ள எல்லா விலங்குகளுக்கும் பொதுவான தகுதியாகப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெய வாக்கிய அமைப்பில் பெயரடை உடனடியாக முன்வரும் செம்மறியாட்டுக் குட்டிகளோடு மிக இயல்பாக இணைகிறது; அதன் பரந்த பலிச் சட்டப் பயன்பாட்டை உரையில் கட்டாயமாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவையும் பலி சார்ந்த துல்லியத்தையும் காக்கும் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது.
