  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ta
  text: 'மூன்றாம் நாளில்: காளைகள் பதினொன்று, செம்மறியாட்டுக் கடாக்கள் இரண்டு, குறைபாடில்லாத[a] ஓராண்டு செம்மறியாட்டுக் குட்டிகள் பதினான்கு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஊனமில்லாத.’ எபிரெயச் சொல் பலிக்குரிய விலங்கில் குறை அல்லது பழுது இல்லாததைக் குறிக்கிறது.
