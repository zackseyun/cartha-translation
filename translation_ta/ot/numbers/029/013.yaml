  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: ta
  text: 'நீங்கள் யாவேக்கு எரிபலியாகவும் அக்கினிப் பலியாகவும் உகந்த நறுமணமாகவும் செலுத்துங்கள்: மாட்டுமந்தையிலிருந்து பதின்மூன்று காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதான பதினான்கு ஆண் செம்மறியாட்டுக் குட்டிகள்; அவை குறைபாடற்றவையாக இருக்க வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உகந்த நறுமணம்’ என்பதை ‘அமைதியளிக்கும் நறுமணம்’ அல்லது ‘இனிய நறுமணம்’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய மரபுத்தொடர் பலி யாவேக்கு ஏற்றதாக இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: நீங்கள் செலுத்த வேண்டும்
  rationale: பலியிடும் சூழலில் קרב என்பதன் ஹிஃபில் வடிவம் பலியை முன்வைத்தல் அல்லது செலுத்துதல் என்று பொருள்படும்; நவீன தமிழில் ‘செலுத்த வேண்டும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֹלָה
  choice: எரிபலி
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான பலிச்சொல்; ‘எரிபலி’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִשֵּׁה
  choice: அக்கினியில் செலுத்தப்படும் பலி
  rationale: அக்கினியின் மூலம் செலுத்தப்படும் பலி என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது எரிபலியை விளக்கும் இணைச்சொற்றொடராக வைக்கப்பட்டுள்ளது.
- source_word: רֵיחַ נִיחֹחַ
  choice: உகந்த நறுமணம்
  rationale: இந்த எபிரெய மரபுத்தொடர் பலி யாவேக்கு ஏற்றதாகவும் மகிழ்வளிப்பதாகவும் இருப்பதைக் குறிக்கிறது; ‘உகந்த நறுமணம்’ உருவகத்தையும் ஏற்றுக்கொள்ளப்படுதல் என்ற கருத்தையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: மாட்டுமந்தையிலிருந்து காளைகள்
  rationale: சொற்றொடரின் கால்நடை வகைப்பாட்டைக் காக்கிறது; எபிரெயம் வெளிப்படையாகக் கூறாத இளவயதைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: பலிப்பட்டியலில் வரும் வளர்ந்த ஆண் செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: விலங்கின் பாலினத்தையும் வயதையும் எபிரெய மூலத்தின்படி வெளிப்படையாகக் காக்கிறது.
- source_word: תְּמִימִם
  choice: பழுதற்றவை
  rationale: பலிக்குரிய விலங்குகளில் உடற்குறை அல்லது குறைபாடு இல்லாத நிலையைக் குறிக்கும் சூழல்சார் பொருள்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: רֵיחַ נִיחֹחַ என்பதன் உருவகப் பொருள்
  choice: உகந்த நறுமணம்
  alternative: இனிய நறுமணம்
  rationale: இறைவன் வெறுமனே மணத்தை நுகர்கிறார் என்ற கருத்துக்குள் வசனத்தைச் சுருக்காமல், பலி அவருக்கு ஏற்றதாக இருப்பதையும் எபிரெய உருவகத்தையும் ஒருங்கே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பலிச்சடங்கின் மரியாதைமிக்க தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலின் எண்ணிக்கைகள் மற்றும் விலங்குகளின் பாலினம், வயது, குறையின்மை ஆகியவை வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
