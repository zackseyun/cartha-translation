revisions:
- from: யாவேக்கு உகந்த நறுமணமாக ஓர் எரிபலியை—அக்கினியில் செலுத்தப்படும் பலியை—நீங்கள் செலுத்த வேண்டும்:[a] மாட்டுமந்தையிலிருந்து பதின்மூன்று காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஓராண்டான பதினான்கு ஆண் செம்மறியாட்டுக் குட்டிகள். அவை பழுதற்றவையாக இருக்க வேண்டும்.
  to: 'நீங்கள் யாவேக்கு எரிபலியாகவும் அக்கினிப் பலியாகவும் உகந்த நறுமணமாகவும் செலுத்துங்கள்: மாட்டுமந்தையிலிருந்து பதின்மூன்று காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதான பதினான்கு ஆண் செம்மறியாட்டுக் குட்டிகள்; அவை குறைபாடற்றவையாக இருக்க வேண்டும்.[a]'
  rationale: The revision restores the Hebrew syntactic relationship by making Yahweh the recipient of the presenting action, retains both sacrificial descriptors (burnt offering and fire offering), and uses terminology that more precisely reflects the defect-free requirement. The footnote marker is moved to the phrase it explains.
