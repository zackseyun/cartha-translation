translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான பலிசார் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூல வசனம் முந்தைய கட்டளையைத் தொடரும் பட்டியல் வடிவில் இருப்பதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்கச் சூழலிலிருந்து “செலுத்த வேண்டும்” நிரப்பப்பட்டுள்ளது; எபிரெயத்தில் உள்ள பானபலிகளின் பன்மை மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளது.
