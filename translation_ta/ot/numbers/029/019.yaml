  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: ta
  text: பாவநிவாரணப் பலியாக ஒரு வெள்ளாட்டுக் கடாவையும் செலுத்த வேண்டும்; இது வழக்கமாகச் செலுத்தப்படும் தகனபலியையும்[a], அதற்குரிய தானியக் காணிக்கையையும், அவற்றிற்குரிய பானபலிகளையும்[b] தவிர, கூடுதலாகச் செலுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து செலுத்தப்படும் தகனபலி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அவற்றிற்குரிய பானபலிகள்” என்று பன்மையில் உள்ளது; விதிக்கப்பட்ட பலிகளின் தொகுப்புடன் தொடர்புடைய பானபலிகளை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ஒரு வெள்ளாட்டுக் கடா
  rationale: שְׂעִיר עִזִּים என்பது பலியிடப்படும் ஆண் வெள்ளாட்டைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர்; אֶחָד எண்ணிக்கையைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: பலிச் சட்டங்களின் சூழலில் இச்சொல் பொதுவாகப் பாவத்தையே அல்ல, பாவத்திற்காகச் செலுத்தப்படும் குறிப்பிட்ட பலிவகையைக் குறிக்கிறது.
- source_word: מִ/לְּ/בַד
  choice: தவிரக் கூடுதலாக
  rationale: இங்கு சொல்லப்பட்ட பலி, வழக்கமான பலித்தொகுப்புக்குப் பதிலானது அல்ல; அதனுடன் கூடுதலாகச் செலுத்தப்படுவது என்பதைத் தெளிவாக்குகிறது.
- source_word: עֹלַת הַ/תָּמִיד
  choice: வழக்கமாகச் செலுத்தப்படும் தகனபலி
  rationale: תָּמִיד தொடர்ச்சியாக அல்லது முறைப்படி செலுத்தப்படுவதைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகப் புரியுமாறு இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/מִנְחָתָ/הּ
  choice: அதற்குரிய தானியக் காணிக்கை
  rationale: பலிச் சட்டங்களின் சூழலில் מִנְחָה தானியக் காணிக்கையைக் குறிக்கிறது; ஒருமைப் பெண்பால் பின்னொட்டு முன்வரும் தகனபலியைச் சுட்டுகிறது.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: அவற்றிற்குரிய பானபலிகள்
