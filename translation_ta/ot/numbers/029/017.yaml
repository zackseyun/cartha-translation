lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: இணைப்புச் சொல்லும் காலக் குறிப்பும் தொடர்ச்சியான பண்டிகைப் பலிப் பட்டியலில் அடுத்த நாளை அறிமுகப்படுத்துகின்றன; தமிழில் இயல்பான பட்டியல் நடைக்காகத் தனி ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: மந்தையிலிருந்து ... காளைகள்
  rationale: ‘காளைகள், மந்தையின் மகன்கள்’ என்ற எபிரெய வகைப்பாட்டு மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; வயதை உரையில் இல்லாதபடி குறிப்பதில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு
  rationale: காளைகளின் எண்ணிக்கையைக் குறிக்கும் எண்ணுப்பெயர்.
- source_word: אֵילִם שְׁנָיִם
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது பலிக்குரிய ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ என்பதுடன் இனத்தையும் வெளிப்படையாகக் கூறுவது தெளிவளிக்கிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ஓராண்டு வயதுள்ள பதினான்கு ஆட்டுக்குட்டிகள்
  rationale: ‘ஒரு ஆண்டின் மகன்கள்’ என்ற எபிரெய வயது மரபுத்தொடரைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலிச் சட்டச் சூழலில் உடற்குறை அல்லது குறைபாடு இல்லாத விலங்குகளைக் குறிக்கிறது.
