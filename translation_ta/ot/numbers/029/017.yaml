  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: ta
  text: 'மேலும், இரண்டாம் நாளில்: மந்தையிலிருந்து பன்னிரண்டு காளைகள்[a], இரண்டு செம்மறியாட்டுக் கடாக்கள், பழுதற்ற ஓராண்டு வயதுள்ள பதினான்கு ஆட்டுக்குட்டிகள்,'
  philosophy: optimal-equivalence
  footnotes:
