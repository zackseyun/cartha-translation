source:
  edition: WLC
  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: ta
  text: பாவநிவாரணப் பலியாக ஒரு ஆட்டுக்கடாவையும்[a] செலுத்த வேண்டும்; அது பாவப்பரிகாரத்திற்கான பாவநிவாரணப் பலி, வழக்கமான தகனப் பலி[b], அதன் தானியப் படையல், அவற்றிற்குரிய பானப் படையல்கள் ஆகியவற்றைத் தவிரச் செலுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரணப் பலி’ என்று வரும் இரு இடங்களிலும், ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தொடர்ச்சியான தகனப் பலி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இச்சொற்றொடர் பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் அதன் பாலினத்தைத் தெளிவாகவும் தெரிவிக்க ‘ஆட்டுக்கடா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: பலியின் குறிப்பிட்ட எண்ணிக்கையை அப்படியே தெரிவிக்கிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலியியல் சூழலில் இப்பெயர்ச்சொல் பாவம் என்ற கருத்தை மட்டும் அல்லாமல் ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது தமிழில் தெளிவான வழிபாட்டுச் சொல்லாகும்; ‘தூய்மைப்படுத்தும் பலி’ என்ற செயல்பாட்டு நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִלְּבַד
  choice: மேலாக
  rationale: இப்பலி ஏற்கெனவே குறிப்பிடப்பட்ட பலிகளுடன் கூடுதலாகச் செலுத்தப்பட வேண்டும் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: பாவப்பரிகாரத்திற்கான பாவநிவாரணப் பலி
  rationale: இணைப்புத் தொடரானது பலியைப் பாவப்பரிகாரச் சடங்கோடு தொடர்புபடுத்துகிறது; எபிரெயத்தில் உள்ள தொடர்பை அளவுக்கு மீறி விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான தகனப் பலி
  rationale: תָּמִיד என்பதன் ஒழுங்காகத் தொடர்ந்து நிகழும் தன்மையை ‘வழக்கமான’ தெரிவிக்கிறது; ‘தகனப் பலி’ முழுவதுமாக எரிக்கப்படும் பலிவகையைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: מִנְחָתָהּ
  choice: அதனுடன் செலுத்தப்படும் தானியப் படையல்
  rationale: பெண்பால் ஒருமை பின்னொட்டு தகனப் பலியைக் குறிப்பதால் ‘அதனுடன்’ எனத் தெளிவுபடுத்தப்பட்டது. பலியியல் பட்டியலில் מִנְחָה தானியப் படையலைக் குறிக்கிறது.
- source_word: נִסְכֵּיהֶם
  choice: அவற்றிற்குரிய பானப் படையல்கள்
  rationale: எபிரெயப் பன்மைப் பின்னொட்டை ‘அவற்றிற்குரிய’ எனப் பாதுகாத்து, நெருங்கிய பலிகளுடன் இணைக்கிறது. ‘பானப் படையல்கள்’ என்பது சடங்குசார் ஊற்றுப்பலியை நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: חַטָּאת என்ற பலியியல் சொல்லின் பொருள்
  choice: இரு இடங்களிலும் ‘பாவநிவாரணப் பலி’
  alternative: ‘தூய்மைப்படுத்தும் பலி’
  rationale: இது பலிகளின் நடைமுறைப் பட்டியல் என்பதால் நிலைபெற்ற பலிவகைப் பெயர் முதன்மை உரையில் பயன்படுத்தப்பட்டது. பலியின் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்றுப் பொருள் உண்மையான சொற்பொருள் வாய்ப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הַכִּפֻּרִים என்பதன் தொடர்பு
  choice: ‘பாவப்பரிகாரத்திற்கான’
  alternative: ‘பாவப்பரிகாரங்களின்’
  rationale: இச்சூழலில் குறிப்பிட்ட பாவப்பரிகாரச் சடங்குக்குரிய பலி குறிக்கப்படுகிறது. எபிரெயப் பன்மை வடிவத்தைச் சொற்சொல்லாகத் தமிழாக்குவது இயல்பற்றதாக இருப்பதால் அதன் சடங்குசார் பொருள் தெரிவிக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர்ச்சியான பட்டியல் தமிழில் தெளிவாகப் படிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘செலுத்த வேண்டும்’ என்பது முந்தைய வசனங்களிலிருந்து தொடரும் கட்டளை அமைப்பை இயல்பாக நிறைவு செய்கிறது.
