  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: ta
  text: உங்கள் நியமிக்கப்பட்ட காலங்களில் இவற்றை யாவேக்குச் செலுத்த வேண்டும்; உங்கள் நேர்ச்சைக் காணிக்கைகளுக்கும் தன்னார்வக் காணிக்கைகளுக்கும் மேலாக, தகனப் பலிகளாகவோ, தானியக் காணிக்கைகளாகவோ, பானக் காணிக்கைகளாகவோ, சமாதானப் பலிகளாகவோ செலுத்தப்படுபவையும் இதில் அடங்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐக்கியப் பலிகள்.” எபிரெயச் சொல் சமாதானம் அல்லது நலமுழுமையுடன் தொடர்புடைய ஒரு பலிவகையைக் குறிக்கிறது.
    reason: שְׁלָמִים என்பதற்கு “சமாதானப் பலிகள்” என்பது முதன்மை மொழிபெயர்ப்பாகத் தக்கது; “ஐக்கியப் பலிகள்” தொடர்புடைய மாற்று மொழிபெயர்ப்பாகத் தரப்படுகிறது.
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவற்றை
  rationale: முந்தைய பகுதியில் கட்டளையிடப்பட்ட பண்டிகைக்காலப் பலிகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயர்; தமிழில் வினையின் செயப்படுபொருளாக இயல்பாக அமைகிறது.
- source_word: תַּעֲשׂוּ
  choice: செலுத்த வேண்டும்
  rationale: அடிப்படைப் பொருள் ‘செய்தல்/உண்டாக்குதல்’ என்றாலும், யாவேக்கு அர்ப்பணிக்கப்படும் பலிகளைக் குறிக்கும் இச்சூழலில் ‘செலுத்துதல்’ இயல்பாகவும் வழிபாட்டுப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: இறைபெயராகிய יהוה என்பதை பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, לְ முன்னிடைச்சொல்லின் அர்ப்பணிப்பு/நோக்குப் பொருளை ‘-க்கு’ மூலம் காட்டுகிறது.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: உங்கள் குறிக்கப்பட்ட காலங்களில்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட காலத்தையோ பண்டிகை நிகழ்வையோ குறிக்கலாம்; ‘குறிக்கப்பட்ட காலங்கள்’ என்ற மொழிபெயர்ப்பு இரு நுணுக்கங்களையும் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: לְבַד
  choice: தவிர
  rationale: கட்டாயமான பண்டிகைப் பலிகளுடன் நேர்த்திக்கடன் மற்றும் தன்னார்வக் காணிக்கைகளும் தனியே செலுத்தப்படுவதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: מִנִּדְרֵיכֶם
  choice: உங்கள் நேர்த்திக்கடன் காணிக்கைகள்
  rationale: பேசப்பட்ட நேர்த்திக்கடன்களை மட்டும் அல்லாமல், அவற்றின் பேரில் செலுத்தப்படும் காணிக்கைகளைக் குறிப்பதால் ‘காணிக்கைகள்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְנִדְבֹתֵיכֶם
  choice: உங்கள் தன்னார்வக் காணிக்கைகள்
  rationale: கட்டாயத்தினால் அல்லாமல் மனமுவந்து செலுத்தப்படும் காணிக்கைகள் என்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לְעֹלֹתֵיכֶם
  choice: உங்கள் தகனபலிகள்
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் நிலையான பலிவகை; ‘தகனபலி’ அதன் வழக்கமான துல்லியமான தமிழாக்கம்.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: தானியக் காணிக்கைகள்
  rationale: ஆசாரிய பலிச்சூழலில் מִנְחָה பொதுவாக தானியத்தால் செய்யப்பட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: וּלְנִסְכֵּיכֶם
  choice: பானக் காணிக்கைகள்
  rationale: נֶסֶךְ ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது; ‘பானக் காணிக்கை’ பொதுவாசகருக்குத் தெளிவானது.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்ற பலிவகையின் சமாதானம், நலமுழுமை ஆகிய சொற்பொருள் தொடர்பைக் காக்கிறது; ‘ஐக்கியப் பலிகள்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கை இறைபெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைக் காக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்
  rationale: ‘சமாதானப் பலிகள்’ என்பது எபிரெயச் சொல்லின் சமாதானம்/நலமுழுமைத் தொடர்பைக் காக்கிறது; பலியில் பங்குகொள்ளும் ஐக்கிய நுணுக்கத்தை மாற்று மொழிபெயர்ப்பாக அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் தமிழில் வாசிக்க எளிதாகக் காற்புள்ளிகளாலும் ‘ஆகியவற்றுக்காக’ என்பதாலும் இணைக்கப்பட்டுள்ளது. கட்டளையின் வலிமை ‘செலுத்த வேண்டும்’ எனத் தரப்பட்டுள்ளது.
