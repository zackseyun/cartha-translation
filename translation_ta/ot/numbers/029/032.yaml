source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: ta
  text: 'ஏழாம் நாளில்: ஏழு காளைகள், இரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதுடைய பதினான்கு செம்மறியாட்டுக் குட்டிகள், குறைபாடற்றவை[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாசற்றவை.’ எபிரெயச் சொல் பலிக்குரிய விலங்குகள் உடற்குறை அல்லது குறைபாடு இல்லாதவையாக இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: நாளில்
  rationale: முன்னுள்ள பலி அட்டவணையின் தொடர்ச்சியை எபிரெய இணைப்புச்சொல் காட்டுகிறது; தமிழில் வசனத் தொடரே அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הַשְּׁבִיעִי
  choice: ஏழாம்
  rationale: ‘நாள்’ என்பதைக் குறிப்பிடும் வரிசை எண்ணின் நேரான நவீனத் தமிழ் வடிவம்.
- source_word: פָּרִים
  choice: காளைகள்
  rationale: பலியிடும் சூழலில் פַּר என்பது காளைகளைக் குறிக்கிறது; வயது இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாததால் ‘இளம்’ சேர்க்கப்படவில்லை.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אַיִל என்பதன் பலியிடும் சூழலுக்குரிய துல்லியமான பொருள் ஆண் செம்மறியாடுகள்; ‘கடாக்கள்’ என்பதை மட்டும் விட இது தெளிவானது.
- source_word: כְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: כֶּבֶשׂ செம்மறியாட்டுக் குட்டியைக் குறிக்கிறது; தமிழில் விலங்கு வகையைத் தெளிவுபடுத்த இவ்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי שָׁנָה
  choice: ஒரு வயதுடைய
  rationale: ‘ஒரு ஆண்டின் பிள்ளைகள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் பொருள்.
- source_word: תְּמִימִם
  choice: குறைபாடில்லாதவையாக
  rationale: பலிக்குரிய விலங்குகளில் உடற்குறை அல்லது பழுது இல்லாத முழுமை என்பதே இச்சூழலில் சொல்லின் பொருள்.
theological_decisions:
- issue: תְּמִימִם எந்த விலங்குகளைச் சுட்டுகிறது
  choice: ‘இவை அனைத்தும்’ என்று பட்டியலிலுள்ள எல்லா விலங்குகளுக்கும் பொருந்துமாறு மொழிபெயர்க்கப்பட்டது.
  alternative: அருகிலுள்ள செம்மறியாட்டுக் குட்டிகளுக்கு மட்டும் பொருந்துமாறு வாசித்தல்.
  rationale: எபிரெய ஆண்பால் பன்மை உரிச்சொல் முழுப் பலிப் பட்டியலையும் தொகுத்துச் சுட்ட முடியும்; இதே பலியிடும் சூழலும் எல்லா விலங்குகளும் குறைபாடற்றவையாக இருக்க வேண்டும் என்பதை ஆதரிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலி அட்டவணையின் சுருக்கமான பட்டியல் அமைப்பு பாதுகாக்கப்பட்டது. மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், இறுதி உரிச்சொல் தமிழில் இயல்பாக அமைய ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டது; இது சூழலிலுள்ள கட்டளையின் பொருளை வெளிப்படுத்துகிறது.
