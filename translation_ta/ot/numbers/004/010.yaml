- from: அதையும் அதன் எல்லாக் கருவிகளையும் தகசுத் தோலால்[a] ஆன ஓர் உறைக்குள் வைத்து, அதைச் சுமக்கும் தண்டின்மேல் வைக்க வேண்டும்.
  to: அதையும் அதன் எல்லாக் கருவிகளையும் தகசுத் தோலால்[a] ஆன ஓர் உறைக்குள் வைக்க வேண்டும்; பின்னர் அதைச் சுமக்கும் தண்டின்மேல் வைக்க வேண்டும்.
  rationale: 'The revision makes the two sequential Hebrew instructions explicit in natural procedural Tamil: first place the lampstand and all its utensils inside the covering, then place it on the carrying pole. It retains the singular “தண்டு,” preserves the anaphoric “அதை,” and leaves תַּחַשׁ untranslated in the main text because its precise meaning is disputed. The footnote is standardized to the same Tamil form used in the verse.'
