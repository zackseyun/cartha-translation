  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: ta
  text: அதையும் அதன் எல்லாக் கருவிகளையும் தகசுத் தோலால்[a] ஆன ஓர் உறைக்குள் வைக்க வேண்டும்; பின்னர் அதைச் சுமக்கும் தண்டின்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“தகசு” (எபிரெயம்: תַּחַשׁ) என்பது எந்த விலங்கையோ எந்தத் தோல் வகையையோ குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. சில பாரம்பரிய மொழிபெயர்ப்புகள் இதை ஒரு குறிப்பிட்ட கடல்வாழ் விலங்கின் தோலாகக் குறிப்பிடுகின்றன; இது நீடித்த ஒரு வகைத் தோலையும் குறிக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ אֹתָהּ
  choice: அதை ... வைத்து
  rationale: தொடர்ச்சியான வழிமுறையில் வரும் வினைச்சொல் தமிழில் கடமை அல்லது கட்டளையைக் குறிக்கும் ‘வைக்க வேண்டும்’ என்ற அமைப்பில் இயல்பாக வழங்கப்படுகிறது; பெண்பால் ஒருமைப் பிரதிப்பெயர் முந்தைய வசனத்திலுள்ள விளக்குத்தண்டைக் குறிக்கிறது.
- source_word: כָּל כֵּלֶיהָ
  choice: அதன் எல்லாக் கருவிகளையும்
  rationale: כֵּלִים என்பது இச்சூழலில் விளக்குத்தண்டுடன் பயன்படும் துணைப் பொருட்கள் அல்லது கருவிகளைக் குறிக்கிறது; ‘கருவிகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: אֶל מִכְסֵה
  choice: ஓர் உறைக்குள்
  rationale: אֶל என்பது נתן உடன் இங்கே உள்ளே வைப்பதைக் குறிக்கிறது; מִכְסֵה பாதுகாப்பாக மூடும் உறை.
- source_word: עוֹר תַּחַשׁ
  choice: தகசுத் தோல்
  rationale: תַּחַשׁ குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாக அறியப்படாததால், ஊகமான விலங்குப் பெயரையோ ‘நேர்த்தியான தோல்’ போன்ற விளக்கத்தையோ முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்ப்பு செய்யப்படுகிறது.
- source_word: עַל הַמּוֹט
  choice: சுமக்கும் தண்டின்மேல்
  rationale: מוֹט என்பது சுமப்பதற்குப் பயன்படும் தண்டு அல்லது கம்பத்தைக் குறிக்கிறது. எபிரெய ஒருமையைத் தக்கவைத்து அதன் பயன்பாட்டையும் தெளிவுபடுத்துகிறது.
