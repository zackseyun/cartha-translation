translation_notes:
  register: நவீனத் தரத் தமிழில், கூடாரப் பணிக்கான முறையான வழிமுறையின் கண்ணியமான நடையைப் பேணுகிறது. தெளிவுக்காக ஒரே வாக்கியத்தில் இரண்டு தொடர்ச்சிச் செயல்களும் ‘வைக்க வேண்டும்’ என்ற கட்டளைநடையில் அமைக்கப்பட்டுள்ளன; உறுதியற்ற תַּחַשׁ ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
