revisions:
- from: முப்பது வயதுமுதல் அதற்கு மேற்பட்டவர்களாய், ஐம்பது வயதுவரை, சந்திப்புக் கூடாரத்தில் பணி செய்வதற்கான சேவைக்கு[b] வரும்[a] அனைவரும்.
  to: முப்பது வயது முதல் ஐம்பது வயது வரை, சந்திப்புக் கூடாரத்தில் பணியாற்றுவதற்காகச் சேவைக்கு[b] வரும்[a] அனைவரும்.
  rationale: 'The revision supplies an idiomatic Tamil age range and clarifies the syntactic relation: all those aged thirty through fifty who come for service, in order to perform work in the Tent of Meeting. It retains the source’s ellip­tical, census-style clause and preserves both footnote anchors at their relevant words.'
  reviewer_model: gpt-5.6-terra
