  register: நவீனத் தரத் தமிழில், மூலத்தின் பட்டியல் போன்ற வாக்கிய அமைப்பையும் வயது வரம்பையும் காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊழியம்’ போன்ற திருச்சபைச் சார்பு கொண்ட சொல்லைத் தவிர்த்து ‘சேவை’, ‘பணி’ என்பவை தேர்ந்தெடுக்கப்பட்டன.
