base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: ta
  text: முப்பது வயது முதல் ஐம்பது வயது வரை, சந்திப்புக் கூடாரத்தில் பணியாற்றுவதற்காகச் சேவைக்கு[b] வரும்[a] அனைவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேவையில் சேரும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சேவை” என்பதற்கான எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட கடமை அல்லது பணிக்குழு என்ற பொருளையும் கொள்ளலாம்; இங்கு அது லேவியர்களின் ஒழுங்கமைக்கப்பட்ட பணியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: முப்பது வயதுமுதல் அதற்கு மேற்பட்டவர்களாய்
  rationale: மִן + בֶּן + வயது எண் என்ற எபிரெய வயதுக் குறிப்பையும், וָמַעְלָה என்பதன் ‘அதற்கு மேல்’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ஐம்பது வயதுவரை
  rationale: עַד குறிக்கும் வயது வரம்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַבָּא
  choice: வரும் அனைவரும்
  rationale: בוא வினையின் நிகழ்காலப் பெயரெச்சத் தன்மையைத் தக்கவைத்து, குறிப்பிட்ட சேவைக்கு வருவோரைக் குறிக்கிறது; ‘சேரும்’ என்பதும் சூழலில் சாத்தியம்.
- source_word: לַצָּבָא
  choice: சேவைக்கு
  rationale: இங்கு צָבָא போரை அல்ல, ஒழுங்கமைக்கப்பட்ட லேவியப் பணிக் கடமையைச் சுட்டுகிறது. ‘சேவை’ அந்தப் பொருளை சமயப் பிரிவுசார் சொல்லாக்கமின்றி வழங்குகிறது.
- source_word: לַעֲבֹדָה
  choice: பணி செய்வதற்கான
  rationale: עֲבֹדָה என்பதன் வேலை அல்லது பணி என்ற பொருளை வெளிப்படுத்தி, முந்தைய צָבָא என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: மோசேயின் திருக்கூடாரத்துக்கான எபிரெயப் பெயரைத் தெளிவாகவும் மரபுச் சுமையின்றியும் பிரதிபலிக்கிறது.
