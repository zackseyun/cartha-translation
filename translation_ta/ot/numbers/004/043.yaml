revisions:
- from: முப்பது வயது முதல் ஐம்பது வயதுவரை உள்ளவர்களில், சந்திப்புக் கூடாரத்தில் வேலை செய்வதற்கான சேவையில்[b] சேர வருகிற[a] அனைவரும்.
  to: முப்பது வயது முதல் ஐம்பது வயது வரையுள்ளவர்களில், சந்திப்புக் கூடாரத்தில் செய்ய வேண்டிய பணிக்காகச் சேவையில்[b] சேர வருகிற[a] அனைவரும்.
  rationale: The revision retains the inclusive thirty-to-fifty age range, the participial sense of those who come to join the duty, and the distinct terms for organized service (צבא) and work (עבודה). It improves Tamil idiom and clarifies that the work is that to be done at the tent of meeting. Footnote anchors remain attached to the terms they explain, and the footnote wording is aligned with the revised text.
