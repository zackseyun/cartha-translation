translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. வசனம் முந்தைய கணக்கெடுப்பு வாக்கியத்தைத் தொடரும் துணைத் தொடராக இருப்பதால், தமிழிலும் அதன் பட்டியல் இயல்பு காக்கப்பட்டுள்ளது; அதேவேளையில் ‘சேவை’ மற்றும் ‘வேலை’ மூலம் צָבָא, עֲבֹדָה ஆகிய இரு சொற்களின் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
