base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: ta
  text: முப்பது வயது முதல் ஐம்பது வயது வரையுள்ளவர்களில், சந்திப்புக் கூடாரத்தில் செய்ய வேண்டிய பணிக்காகச் சேவையில்[b] சேர வருகிற[a] அனைவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேவையில் நுழைகிற.” எபிரெயப் பெயரெச்ச வினை வடிவம், நியமிக்கப்பட்ட பணிக்கு வந்து தங்களை ஒப்படைப்பவர்களை அல்லது சேவையில் நுழைபவர்களை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சேவை” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஒழுங்கமைக்கப்பட்ட கடமையைக் குறிக்கலாம்; சில சூழல்களில் அதற்கு இராணுவ நிழற்பொருளும் உண்டு. இங்கு அது லேவியர் செய்யும் சேவையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: முப்பது வயது முதல் ஐம்பது வயதுவரை உள்ளவர்களில்
  rationale: எபிரெய வயதைக் குறிக்கும் மரபுத்தொடரையும் உள்ளடங்கிய கீழ் மற்றும் மேல் வயது எல்லைகளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כָּל הַבָּא
  choice: சேர வருகிற அனைவரும்
  rationale: בוא என்ற வினையின் ‘வருதல்/நுழைதல்’ பொருளையும், இங்கு நியமிக்கப்பட்ட பணிக்குத் தங்களை முன்வைப்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַצָּבָא
  choice: சேவையில்
  rationale: இச்சூழலில் இச்சொல் இராணுவப் படையை அல்ல, ஒழுங்கமைக்கப்பட்ட லேவியப் பணியைக் குறிக்கிறது; ‘சேவை’ அந்தப் பொருளைத் தவறாக இராணுவமயமாக்காமல் தருகிறது.
- source_word: לַעֲבֹדָה
  choice: வேலை செய்வதற்கான
  rationale: עֲבֹדָה என்பதன் வேலை/பணி என்ற பொருளைத் தந்து, צָבָא குறிக்கும் ஒழுங்கமைந்த சேவையிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: மோசேயின் ஐந்நூல்களில் வரும் இந்நிலையான பெயரைக் கருத்துத் தெளிவுடனும் בְּ என்ற இடப்பொருளுடனும் மொழிபெயர்க்கிறது.
