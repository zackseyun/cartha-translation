  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: ta
  text: 'இதுவே சந்திப்புக்கூடாரத்தில் அவர்களுடைய எல்லாச் சேவைக்கும் அவர்கள் சுமக்க வேண்டிய சுமையின் பொறுப்பு: திருவாசஸ்தலத்தின் சட்டப் பலகைகள்[a], அதன் குறுக்குத் தண்டுகள், அதன் தூண்கள், அதன் அடித்தளப் பீடங்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருவாசஸ்தலத்தின் பலகைகள்.’ எபிரெயச் சொல் கூடாரத்தின் கட்டமைப்பில் பயன்படுத்தப்பட்ட பலகைகள் அல்லது சட்டக் கூறுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் அடித்தளச் செருகுபீடங்கள்.’ இவை பலகைகளோ தூண்களோ பொருத்தப்பட்டு நிற்கும் அடித்தளப் பகுதிகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: இதுவே
  rationale: முந்தைய சூழலுடன் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுவதோடு, இப்போது குறிப்பிடப்படும் பட்டியலைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: அவர்கள் சுமக்க வேண்டியவற்றைக் குறித்த பொறுப்பு
  rationale: מִשְׁמֶרֶת என்பதன் ஒப்படைக்கப்பட்ட பொறுப்பு என்ற பொருளையும், מַשָּׂא என்பதன் உண்மையில் சுமந்து செல்ல வேண்டிய பொருட்கள் என்ற பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: לְכָל עֲבֹדָתָם
  choice: அவர்கள் செய்யும் எல்லாப் பணிகளுக்காகவும்
  rationale: அவர்களுக்கு ஒப்படைக்கப்பட்ட கூடாரப் பணியின் முழு வரம்பைக் குறிக்கிறது; இங்கு ‘பணி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இறைவன் தமது மக்களைச் சந்திக்கும் பரிசுத்த இடத்திற்கான வழக்கமான, பொருள் தெளிவான பெயர்ப்பு.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின் சட்டங்கள்
  rationale: קֶרֶשׁ என்பது கூடாரத்தை அமைக்கும் உறுதியான பலகை அல்லது சட்டக் கூறுகளைக் குறிக்கிறது. ‘சட்டங்கள்’ அவற்றின் கட்டமைப்புப் பணியைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְרִיחָיו
  choice: அதன் குறுக்குத் தண்டுகள்
  rationale: சட்டங்களை இணைத்து உறுதிப்படுத்தும் தண்டுகள் என்பதைக் ‘குறுக்குத் தண்டுகள்’ தெளிவாகக் காட்டுகிறது.
- source_word: עַמּוּדָיו
  choice: அதன் தூண்கள்
  rationale: நிமிர்ந்த ஆதரவுக் கூறுகளுக்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֲדָנָיו
  choice: அதன் அடித்தளப் பீடங்கள்
  rationale: சட்டங்களையும் தூண்களையும் தாங்கி அவை பொருந்தி நிற்கும் அடிப்பகுதிகளைத் தெளிவாகக் குறிக்கிறது.
