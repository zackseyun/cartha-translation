  to: 'ஆனால், அவர்கள் மகா பரிசுத்தமானவற்றை[b] நெருங்கும்போது சாகாமல் உயிரோடிருக்கும்படி, அவர்களுக்காக இதைச் செய்யுங்கள்: ஆரோனும் அவன் மகன்களும் வந்து, ஒவ்வொருவனையும்[a] அவனவனுடைய பணிக்கும் அவனவனுடைய சுமைக்கும் நியமிக்க வேண்டும்.'
  rationale: ‘உள்ளே’ என்ற மூலத்தில் இல்லாத இடக்குறிப்பை நீக்கி, יָבֹאוּ என்பதன் ‘வந்து’ என்ற பொருளை மட்டும் வைத்துள்ளோம். மாற்று வாசிப்புக்கான அடிக்குறிப்பு அதன் விளக்கப்பெறும் சொல்லான ‘மகா பரிசுத்தமானவற்றை’ என்பதற்கு உடனடியாக நகர்த்தப்பட்டுள்ளது. மற்ற சொற்றொடர்கள் மூலத்தின் பொருள், ஆசாரச் சூழல், மற்றும் நவீனத் தரமான தமிழ் நடையை நன்கு காக்கின்றன.
