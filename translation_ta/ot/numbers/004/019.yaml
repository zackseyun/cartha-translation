base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: ta
  text: 'ஆனால், அவர்கள் மகா பரிசுத்தமானவற்றை[b] நெருங்கும்போது சாகாமல் உயிரோடிருக்கும்படி, அவர்களுக்காக இதைச் செய்யுங்கள்: ஆரோனும் அவன் மகன்களும் வந்து, ஒவ்வொருவனையும்[a] அவனவனுடைய பணிக்கும் அவனவனுடைய சுமைக்கும் நியமிக்க வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆள் ஆளாக”; அதாவது ஒவ்வொருவனுக்கும் தனித்தனியாக அவனுடைய பணியும் சுமையும் நியமிக்கப்பட வேண்டும்.
    reason: lexical_alternative
  - marker: b
    text: “மகா பரிசுத்தமானவை” என்ற எபிரெயச் சொற்றொடரை “மகா பரிசுத்த இடம்” என்றும் மொழிபெயர்க்கலாம். ஆனால் இங்கு எடுத்துச் செல்லும் பணிகள் பேசப்படுவதால், மிகவும் பரிசுத்தமான பொருட்களைக் குறிப்பதே அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: ஆனால், அவர்களுக்காக இதைச் செய்யுங்கள்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து தீர்வுக்கான அறிவுறுத்தலுக்கு மாறுவதை וְ இயல்பாகக் குறிக்கிறது; לָהֶם இங்கு அவர்களுடைய நன்மைக்காகச் செய்யப்படும் செயலைக் குறிக்கிறது.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: சாகாமல் உயிரோடிருக்கும்படி
  rationale: கட்டளையின் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘உயிர்வாழ்வார்கள், சாகமாட்டார்கள்’ என்ற சாத்தியமான நேரடி அமைப்பின் பொருளையும் காக்கிறது.
- source_word: בְּגִשְׁתָּם
  choice: அவர்கள் ... நெருங்கும்போது
  rationale: בְּ + infinitive construct தரும் காலச்சூழலையும், נגשׁ என்பதன் வழிபாட்டுச் சூழலிலான அணுகுதல் நுணுக்கத்தையும் காக்கிறது.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்தமானவற்றை
  rationale: எடுத்துச் செல்லப்பட வேண்டிய பரிசுத்தப் பொருட்கள் குறித்த உடனடிச் சூழலுக்கு இது பொருந்துகிறது; இடத்தை மட்டும் குறிக்கும் வகையில் உரையைச் சுருக்கவில்லை.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: ஆரோனும் அவன் மகன்களும் உள்ளே வந்து
  rationale: יָבֹאוּ என்பதன் வருதல் பொருளை காக்கிறது; கூடாரத்துக்குள் வந்து பணியை ஒழுங்குபடுத்தும் சூழலை ‘உள்ளே வந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשָׂמוּ אוֹתָם
  choice: நியமிக்க வேண்டும்
  rationale: ஒவ்வொருவரையும் குறிப்பிட்ட பணிக்கும் சுமைக்கும் வைக்கும் நிர்வாகச் செயலைத் தெளிவாகத் தெரிவிக்கிறது; imperfect வடிவின் கட்டளை சார்ந்த வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אִישׁ אִישׁ
  choice: ஒவ்வொருவனையும்
  rationale: எபிரெய மொழியின் பகிர்ந்தளிக்கும் மறுபடியும் சொல்லும் அமைப்பை இயல்பான தமிழில் தருகிறது; இச்சூழலில் குறிக்கப்படுவோர் ஆண் லேவியர்கள்.
- source_word: עַל עֲבֹדָתוֹ וְאֶל מַשָּׂאוֹ
  choice: அவனவனுடைய பணிக்கும் அவனவனுடைய சுமைக்கும்
  rationale: ஒவ்வொருவருக்கும் தனித்தனியாக ஒதுக்கப்பட்ட வழிபாட்டுப் பணியையும் எடுத்துச் செல்ல வேண்டிய பொருள் அல்லது சுமையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்பதன் குறிப்பு
  choice: மகா பரிசுத்தமானவற்றை
  alternative: மகா பரிசுத்த இடத்தை / பரிசுத்த இடங்களிலெல்லாம் மகா பரிசுத்தமான இடத்தை
  rationale: முந்தைய வசனங்களில் மூடப்பட்ட பரிசுத்தப் பொருட்களை கோகாத்தியர் சுமப்பது பற்றிய சூழல் இருப்பதால், இங்கு பொருட்களின் தொகுப்பைக் குறிப்பதாக எடுத்துக்கொள்வது சிறந்தது. ஆயினும் எபிரெயச் சொற்றொடர் இடத்தையும் குறிக்கக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְחָיוּ வினைத்தொடரின் வலிமை
  choice: உயிரோடிருக்கும்படி
  alternative: அவர்கள் உயிர்வாழ்வார்கள்
  rationale: முன்னுள்ள கட்டளையின் நோக்கத்தைத் தமிழ் தெளிவாகக் காட்டுகிறது; காரண-விளைவு மற்றும் நோக்க வலிமைகளுக்கிடையேயுள்ள நுண்ணிய ambiguity-யை முடிந்தவரைத் திறந்தவாறு வைக்கிறது.
- issue: אִישׁ אִישׁ பாலினக் குறிப்பு
  choice: ஒவ்வொருவனையும்
  alternative: ஒவ்வொருவரையும்
  rationale: சூழலில் பணிக்கு நியமிக்கப்படுவோர் ஆண் லேவியர்கள் என்பதால் மூலத்தின் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மகா பரிசுத்தமானவை’, ‘நியமிக்க வேண்டும்’, ‘சுமை’ ஆகியவை ஆசாரச் சூழலையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கின்றன. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்கு அருகில் வைக்கப்பட்டுள்ளன.
