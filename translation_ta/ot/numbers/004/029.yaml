  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: ta
  text: மெராரியின் மகன்களை[a] அவரவருடைய குலங்களின்படியும், அவரவருடைய தந்தைவழிக் குடும்பங்களின்படியும்[b] கணக்கிடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மெராரியின் வழித்தோன்றல்களை’ அல்லது ‘மெராரியர்களை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவர்களுடைய தந்தையரின் வீடுகளின்படி’; தந்தைவழி குடும்பக் குழுக்களைக் குறிக்கும் வம்சவழிச் சொற்றொடர்.
    reason: cultural_note
