- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது; நவீன தமிழில் ‘குலங்கள்’ என்பது இந்த நிர்வாக மற்றும் வம்சவழிச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: இது தந்தைவழி வம்ச அடிப்படையிலான குடும்பத் தொகுதிகளைக் குறிக்கும் எபிரெய மரபுச்சொற்றொடர்; சொற்பொருளையும் சமூக அமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּפְקֹד
  choice: கணக்கிடு
  rationale: இக்கணக்கெடுப்புச் சூழலில் פקד என்பது எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது; ‘கணக்கிடு’ தெளிவான, இயல்பான தமிழ்.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: மெராரியின் மகன்களைச் சுட்டும் நேரடிச் செயப்படுபொருள்; தமிழ் வாக்கியத்தில் அது ‘மகன்களை’ என்ற வடிவில் வெளிப்படுகிறது.
