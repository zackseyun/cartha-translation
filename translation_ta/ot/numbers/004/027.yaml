base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: ta
  text: கெர்சோனின் சந்ததியினரின் எல்லாப் பணிகளும், அவர்கள் சுமக்கும் எல்லாச் சுமைகளையும் அவர்கள் செய்யும் எல்லாப் பணிகளையும் குறித்து, ஆரோனும் அவன் மகன்களும் இடும் கட்டளையின்படி நடைபெற வேண்டும்[a]. அவர்களுடைய எல்லாச் சுமைகளையும் பொறுப்பாக அவர்களிடம் நீங்கள் ஒதுக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘ஆரோனும் அவன் மகன்களும் வாயின்படி.’ எபிரெய மொழியில் இது ஒருவரின் கட்டளை அல்லது வழிகாட்டுதலின்படி என்பதைக் குறிக்கும் வழக்குத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காவற்பொறுப்பாக’ அல்லது ‘கடமையாக.’ எபிரெயச் சொல் ஒப்படைக்கப்பட்ட கடமை, பொறுப்பு, அல்லது கவனித்துக்கொள்ள வேண்டிய ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: இடும் கட்டளையின்படி
  rationale: இந்த எபிரெய வழக்குத்தொடர் சொல்லர்த்தமாக ‘வாயின்படி’ என இருந்தாலும், ஒருவரின் கட்டளை அல்லது வழிகாட்டுதலின்படி செயல்படுவதைக் குறிக்கிறது. நவீனத் தமிழில் அதிகாரப் பொருளை இயல்பாகத் தருகிறது.
- source_word: עֲבֹדַת
  choice: பணி
  rationale: திருக்கூடாரச் சூழலில் ஒதுக்கப்பட்ட உழைப்பையும் சேவையையும் குறிக்கும். ‘பணி’ என்பது வழிபாட்டுச் சூழலையும் நடைமுறை வேலையையும் தேவையின்றி பிரிக்காமல் உள்ளடக்குகிறது.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியரின் மகன்கள்
  rationale: மூலத்தின் மகன்/வம்ச மொழியைப் பாதுகாத்து, கெர்சோனின் வழிவந்த குலத்தினரைக் குறிக்கிறது.
- source_word: לְכָל מַשָּׂאָם
  choice: அவர்கள் சுமக்க வேண்டிய எல்லாப் பொருட்கள்
  rationale: இங்கு מַשָּׂא என்பது திருக்கூடாரப் பொருட்களை எடுத்துச் செல்லும்போது சுமக்கப்படும் சரக்குகளைக் குறிக்கிறது. ‘சுமைகள்’ என்பதன் உருவகப் பொருளைத் தவிர்த்து, கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: அவர்கள் செய்ய வேண்டிய எல்லாப் பணிகள்
  rationale: அவர்களிடம் ஒப்படைக்கப்பட்ட பணியின் முழு வரம்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முதல் עֲבֹדָה என்பதோடும் கருத்து ஒற்றுமையைப் பேணுகிறது.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: அவர்களுக்கு ... ஒதுக்க வேண்டும்
  rationale: இந்த அமைப்பில் פקד என்பது எண்ணுவதைக் காட்டிலும் பொறுப்பை நியமித்தல் அல்லது ஒதுக்குதலைக் குறிக்கிறது.
- source_word: בְּמִשְׁמֶרֶת
  choice: உரிய பொறுப்பாக
  rationale: מִשְׁמֶרֶת என்பது காக்க வேண்டிய ஒப்படைப்பு, நியமிக்கப்பட்ட கடமை அல்லது பொறுப்பு ஆகிய நுணுக்கங்களை உடையது. ‘பொறுப்பு’ நவீனத் தமிழில் தெளிவானது.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: அவர்கள் சுமக்க வேண்டிய எல்லாப் பொருட்களையும்
  rationale: ஒதுக்கப்படும் நேரடி பொருளாக அவர்கள் எடுத்துச் செல்ல வேண்டிய அனைத்தையும் குறிக்கிறது; மூலத்தின் மீளுரைப்பையும் கருத்தளவில் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆரோனும் அவன் மகன்களும் வகிக்கும் அதிகாரத்தின் தன்மை
  choice: ‘கட்டளையின்படி’ என்று மொழிபெயர்த்து, பணிகள் அவர்களுடைய வழிகாட்டும் அதிகாரத்தின்கீழ் நடைபெறுவதை வெளிப்படுத்துதல்
  alternative: ‘வார்த்தையின்படி’ அல்லது சொல்லர்த்தமாக ‘வாயின்படி’
  rationale: மூலத்தின் எபிரெய வழக்குத்தொடர் அதிகாரத்தையும் வழிகாட்டுதலையும் குறிக்கிறது; இதற்கு மேலாக எந்தச் சமய நிர்வாகக் கோட்பாட்டையும் வசனத்துக்குள் கொண்டுவரவில்லை.
- issue: בְּמִשְׁמֶרֶת என்பதில் கடமை மற்றும் காவல் பொறுப்பு இடையிலான நுணுக்கம்
  choice: ‘உரிய பொறுப்பாக’
  alternative: ‘காவற்பொறுப்பாக’ அல்லது ‘கடமையாக’
  rationale: பொருட்களைச் சுமக்கும் நியமிக்கப்பட்ட கடமையையும் அவற்றைக் கவனித்துக்கொள்ளும் பொறுப்பையும் ஒரே குறிப்பிட்ட பொருளாகச் சுருக்காமல் பரந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நிர்வாகக் கட்டளையின் தொனியும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகளைத் தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ‘பணி’, ‘பொறுப்பு’, ‘ஒதுக்க வேண்டும்’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
