revisions:
- from: கெர்சோனியரின் மகன்களுடைய பணி அனைத்தும்—அவர்கள் சுமக்க வேண்டிய எல்லாப் பொருட்கள் மற்றும் அவர்கள் செய்ய வேண்டிய எல்லாப் பணிகள் உட்பட—ஆரோனும் அவன் மகன்களும் இடும் கட்டளையின்படி நடைபெற வேண்டும்[a]. அவர்கள் சுமக்க வேண்டிய எல்லாப் பொருட்களையும் அவர்களுக்கு உரிய பொறுப்பாக நீங்கள் ஒதுக்க வேண்டும்[b].
  to: கெர்சோனின் சந்ததியினரின் எல்லாப் பணிகளும், அவர்கள் சுமக்கும் எல்லாச் சுமைகளையும் அவர்கள் செய்யும் எல்லாப் பணிகளையும் குறித்து, ஆரோனும் அவன் மகன்களும் இடும் கட்டளையின்படி நடைபெற வேண்டும்[a]. அவர்களுடைய எல்லாச் சுமைகளையும் பொறுப்பாக அவர்களிடம் நீங்கள் ஒதுக்க வேண்டும்[b].
  rationale: 'திருத்தம் எபிரெய வாக்கியத்தின் இரு பகுதிகளையும் தெளிவாக வைத்திருக்கிறது: கெர்சோன் குலத்தாரின் முழுப் பணி ஆரோனின் அதிகாரத்தின்கீழ் நடைபெறுதல்; பின்னர் அவர்களுடைய எல்லாச் சுமைகளும் அவர்களிடம் பொறுப்பாக ஒதுக்கப்படுதல். மூலத்தில் இல்லாத ‘உரிய’ நீக்கப்பட்டு, குலப்பெயர் மற்றும் வாக்கியத் தொடர்பு நவீன தமிழில் இயல்பாக்கப்பட்டுள்ளன.'
