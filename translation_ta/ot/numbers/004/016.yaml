base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: ta
  text: 'ஆசாரியனான ஆரோனின் மகன் எலெயாசாரின் மேற்பார்வைப் பொறுப்பு[a]: விளக்குக்கான எண்ணெய், நறுமணத் தூபம், தொடர்ந்து செலுத்தப்படும் தானியக் காணிக்கை[b], அபிஷேக எண்ணெய்; திருக்கூடாரம் முழுவதற்கும், அதிலுள்ள அனைத்திற்கும்—பரிசுத்த இடத்திலும்[c] அதன் உபகரணங்களிலும்[d] உள்ளவற்றிற்கும்—அவனுக்குரிய மேற்பார்வைப் பொறுப்பு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேற்பார்வைப் பொறுப்பு’ என்பதற்கான எபிரேயச் சொல் ‘பொறுப்பு’, ‘காவல்’ அல்லது ‘ஒப்படைக்கப்பட்ட கண்காணிப்பு’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தொடர்ந்து செலுத்தப்படும் தானியக் காணிக்கை’ என்பதை ‘வழக்கமாகச் செலுத்தப்படும் தானியக் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘பரிசுத்த இடத்தில்’ என்பதை ‘புனிதப் பகுதியில்’ என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரேய முன்னொட்டு இடப்பொருளைக் குறிக்கிறது; இந்தத் தொடர் திருக்கூடாரத்தின் உள்ளடக்கங்களை விளக்கும் இணைப்பாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_and_syntactic_alternative
  - marker: d
    text: ‘உபகரணங்கள்’ என்பதற்கான எபிரேயச் சொல் ‘பாத்திரங்கள்’, ‘கருவிகள்’ அல்லது ‘சாதனங்கள்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: பொறுப்பு / மேற்பார்வையிடுவது
  rationale: இச்சொல் ஒப்படைக்கப்பட்ட கண்காணிப்புப் பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க முதல் இடத்தில் ‘பொறுப்பு’ என்றும், மறுமுறை அதன் செயற்பொருளைத் தெளிவாக்க ‘மேற்பார்வையிடுவது’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: விளக்குக்கான எண்ணெய்
  rationale: ‘ஒளிக்கான எண்ணெய்’ என்ற எபிரேய அமைப்பின் நோக்கத்தைக் காட்டுவதோடு, குத்துவிளக்கில் பயன்படுத்தப்பட்ட எண்ணெயை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபம்
  rationale: நறுமணப் பொருட்களால் செய்யப்பட்ட தூபம் என்ற வழிபாட்டுச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִנְחַת הַתָּמִיד
  choice: தொடர்ந்து செலுத்தப்படும் தானியக் காணிக்கை
  rationale: תָּמִיד என்பதன் தொடர்ச்சியான அல்லது முறைப்படி நிகழும் தன்மையைப் பாதுகாக்கிறது; எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘தினந்தோறும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: வழிபாட்டுச் சூழலில் நிலைபெற்ற, தெளிவான நவீனத் தமிழ் சொற்றொடர்.
- source_word: כָּל הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம் முழுவதையும்
  rationale: מִשְׁכָּן என்பதன் ‘வாசஸ்தலம்’ என்ற அடிப்படைக் கருத்தையும், இங்கு குறிக்கப்படும் புனிதக் கூடாரத்தையும் வெளிப்படுத்துகிறது; כָּל என்பதன் முழுமையையும் காக்கிறது.
- source_word: בְּקֹדֶשׁ
  choice: பரிசுத்த இடத்தை
  rationale: இச்சூழலில் இது அருவமான ‘பரிசுத்தம்’ என்பதைக் காட்டிலும் வழிபாட்டுக்குரிய புனித இடத்தைக் குறிக்கிறது; குறிப்பாக உள் அறையை மட்டும் கட்டாயமாகக் குறுக்கவில்லை.
- source_word: וּבְכֵלָיו
  choice: அதன் உபகரணங்களை
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், சாதனங்கள் எனப் பரந்த பொருள் கொள்ளலாம்; ‘உபகரணங்கள்’ அந்தப் பரப்பை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: மீண்டும் வரும் פְקֻדַּת என்பதன் தொடர்பும் வினையற்ற எபிரேய வாக்கிய அமைப்பும்
  choice: பட்டியலிடப்பட்ட புனிதப் பொருட்களும், திருவாசஸ்தலம் முழுவதும் அதிலுள்ள அனைத்தும் எலெயாசாரிடம் ஒப்படைக்கப்பட்ட பொறுப்பின் கீழ் இருந்தன என்று வழங்கப்பட்டுள்ளது.
  alternative: இரண்டாவது פְקֻדַּת என்பதை முதல் பட்டியலுக்கான தொகுப்புரையாகக் கொண்டு, வினைச்சொல் எதையும் நிரப்பாமல் மேலும் சுருக்கமான பெயர்த்தொடராக மொழிபெயர்க்கலாம்.
  rationale: எபிரேய உரை வினையற்றதும் ஓரளவு இணைவிளக்கத் தன்மை கொண்டதும் ஆகும். தமிழில் பொருள் தெளிவாக இருக்க ‘இருக்கும்’ மற்றும் ‘மேற்பார்வையிடுவதும்’ சேர்க்கப்பட்டுள்ளன; இவை புதிய இறையியல் கருத்தைச் சேர்க்காமல் ஒப்படைக்கப்பட்ட பொறுப்பின் உறவை மட்டும் வெளிப்படுத்துகின்றன.
- issue: בְּקֹדֶשׁ וּבְכֵלָיו என்ற இறுதித் தொடரின் இலக்கணத் தொடர்பு
  choice: ‘அதிலுள்ள அனைத்தையும்’ என்பதற்கு விளக்கமான இணைப்பாக ‘பரிசுத்த இடத்தையும் அதன் உபகரணங்களையும்’ என்று வழங்கப்பட்டுள்ளது.
  alternative: בְּ முன்னொட்டுகளை இடப்பொருளில் எடுத்துக் கொண்டு, ‘பரிசுத்த இடத்திலும் அதன் உபகரணங்களிலும் உள்ளவற்றை’ என்று வழங்கலாம்.
  rationale: சூழலில் இந்த இறுதித் தொடர் திருவாசஸ்தலமும் அதன் உள்ளடக்கமும் எதை உள்ளடக்குகின்றன என்பதைத் தெளிவுபடுத்துவதாக இயல்பாகப் புரிகிறது. எனினும் எபிரேய முன்னொட்டின் இடப்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரேயப் பெயர்த்தொடரின் அமைப்பு அரைப்புள்ளி மற்றும் இடைக்கோடுகளால் தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் பொருள் தெளிவின்மை தேவையான இடங்களில் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
