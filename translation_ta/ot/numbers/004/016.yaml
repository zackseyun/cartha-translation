revisions:
- from: ஆசாரியனான ஆரோனின் மகன் எலெயாசாரின் பொறுப்பில்[a] விளக்குக்கான எண்ணெய், நறுமணத் தூபம், தொடர்ந்து செலுத்தப்படும் தானியக் காணிக்கை[b], அபிஷேக எண்ணெய் ஆகியவை இருக்கும்; திருவாசஸ்தலம் முழுவதையும் அதிலுள்ள அனைத்தையும்—பரிசுத்த இடத்தையும்[c] அதன் உபகரணங்களையும்[d]—மேற்பார்வையிடுவதும் அவனுடைய பொறுப்பு.
  to: 'ஆசாரியனான ஆரோனின் மகன் எலெயாசாரின் மேற்பார்வைப் பொறுப்பு[a]: விளக்குக்கான எண்ணெய், நறுமணத் தூபம், தொடர்ந்து செலுத்தப்படும் தானியக் காணிக்கை[b], அபிஷேக எண்ணெய்; திருக்கூடாரம் முழுவதற்கும், அதிலுள்ள அனைத்திற்கும்—பரிசுத்த இடத்திலும்[c] அதன் உபகரணங்களிலும்[d] உள்ளவற்றிற்கும்—அவனுக்குரிய மேற்பார்வைப் பொறுப்பு.'
  rationale: The revision preserves the nominal, repeated ‘oversight’ construction of the Hebrew and avoids making the second occurrence a new verbal action. It also retains the locative force of the final prepositions (‘in the sanctuary and in its vessels’) without foreclosing the contextual appositional interpretation, which is recorded in the anchored footnote. The listed substances and established cultic terms are otherwise retained.
