base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; דִּבֵּר என்பது பொதுவாகச் ‘சொன்னார்’ என்பதைக் காட்டிலும் பேசுதல் அல்லது உரையாற்றுதலைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவத்தில் தருகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதை நவீனத் தமிழில் இயல்பான வேற்றுமை வடிவில் தெரிவிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; அடுத்துவரும் நேரடிப் பேச்சை இரட்டைப்புள்ளி அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருகிறது. ஆகவே ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்கப்படுகிறது. எபிரெய உயிரொலிப்பு உறுதியாக இல்லாததால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்கு இயல்பான தமிழ். எபிரெயப் பேச்சு அறிமுகச் சூத்திரத்தின் ‘பேசுதல்—சொல்லுதல்’ அமைப்பு தமிழில் சற்றே இயல்பாக்கப்பட்டும் இரு கூறுகளும் தக்கவைக்கப்பட்டும் உள்ளன.
