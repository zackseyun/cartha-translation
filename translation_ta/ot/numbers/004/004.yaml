source:
  edition: WLC
  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தில் மகா பரிசுத்தமான பொருட்களைச் சார்ந்து கோகாத்தின் மகன்கள் செய்யும் பணி இதுவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தங்களின் பரிசுத்தம்,” அல்லது “மகா பரிசுத்த ஸ்தலம்.” இங்கு இந்தச் சொற்றொடர் உட்புறத் திருவிடத்தை மட்டும் அல்லாமல், சூழலின்படி பெரும்பாலும் மகா பரிசுத்தமான பொருட்களைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: இதுதான்
  rationale: எபிரெய மொழியில் வெளிப்படையாக இல்லாத இணைப்புவினையைத் தமிழில் இயல்பாக வெளிப்படுத்தி, பின்வரும் பணியைச் சுட்டுகிறது.
- source_word: עֲבֹדַת
  choice: செய்யவேண்டிய பணி
  rationale: இங்கு சொல்லப்படுவது பொதுவான வேலை அல்ல; கோகாத்தின் மக்களுக்கு ஒதுக்கப்பட்ட வழிபாட்டுச் சார்ந்த கடமை. ‘செய்யவேண்டிய பணி’ என்பது அந்தப் பொறுப்புணர்வை இயல்பாகக் காட்டுகிறது.
- source_word: בְּנֵי קְהָת
  choice: கோகாத்தின் மகன்கள்
  rationale: எபிரெய உறவுமுறைச் சொல்லாட்சியைப் பாதுகாக்கும் நேரடியான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதற்கான பொருள் சார்ந்த இயல்பான தமிழ்; בְּ என்ற முன்னொட்டு இங்கு பணியின் இடம் அல்லது செயல்பாட்டுத் தளத்தைக் குறிக்கிறது.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்தமான பொருட்கள்
  rationale: எண்ணாகமம் 4-ன் சூழலில் கோகாத்தியர் சுமந்து பராமரிக்க வேண்டிய மிகப் பரிசுத்தமான திருப்பொருட்களையே இது முதன்மையாகக் குறிக்கிறது. இடத்தைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்பதன் குறிப்பு
  choice: கோகாத்தின் மக்களிடம் ஒப்படைக்கப்பட்ட மகா பரிசுத்தமான திருப்பொருட்கள்
  alternative: மகா பரிசுத்த ஸ்தலம், அதாவது கூடாரத்தின் உட்புறத் திருவிடம்
  rationale: தொடர்ந்து வரும் வசனங்கள் கூடாரத்தின் பரிசுத்தப் பொருட்களை மூடுதல், கையாளுதல், சுமத்தல் ஆகிய பணிகளை விவரிக்கின்றன. ஆகவே இங்கு பொருட்களைக் குறிப்பது சூழலுக்கு ஏற்றது; இருப்பினும் எபிரெய சொற்றொடரின் இடவியல் வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கோகாத்தின் மகன்கள்’ என்ற மூலமொழியின் உறவுமுறை வடிவம் காக்கப்பட்டது. எபிரெய வசனத்தின் இறுதி பெயர்ச்சொற்றொடரைத் தமிழில் தெளிவாக இணைக்க ‘குறித்த பணி’ என வழங்கப்பட்டது.
