base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: ta
  text: சுற்றியுள்ள முற்றத்தின் தூண்கள், அவற்றின் அடித்தளங்கள், அவற்றின் குத்துமுளைகள், அவற்றின் கயிறுகள், அவற்றின் எல்லா உபகரணங்கள், அவற்றின் எல்லாப் பணிகள் ஆகியவற்றைச் சுமைப்பொறுப்புக்குரிய உபகரணங்களாகப் பெயர்ப் பெயராக ஒதுக்குங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்களுடைய சுமைப்பொறுப்பின் உபகரணங்களைப் பெயர்ப் பெயராக நியமியுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: சுற்றிலும் உள்ள முற்றத்தின் தூண்கள்
  rationale: עַמּוּדִים என்பது கட்டமைப்புத் தூண்களைக் குறிக்கிறது; חָצֵר என்பது முற்றம். סָבִיב முற்றத்தைச் சுற்றியுள்ள நிலையைச் சுட்டுவதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் அடித்தளங்கள்
  rationale: கூடாரக் கட்டமைப்புச் சூழலில் אֶדֶן தூண் பொருத்தப்படும் அடிப்பகுதி அல்லது தாங்குதளத்தைக் குறிக்கிறது. தொழில்நுட்பமான ‘குழிவடிவத் தாங்கிகள்’ என்பதைக் காட்டிலும் ‘அடித்தளங்கள்’ பொதுவாசகருக்குத் தெளிவானது.
- source_word: יְתֵדֹתָם
  choice: அவற்றின் முளைகள்
  rationale: יָתֵד கூடாரக் கயிறுகளை நிலத்தில் உறுதிப்படுத்தும் முளை அல்லது ஆப்பைக் குறிக்கிறது. ‘முளைகள்’ என்பது இந்தச் சூழலில் சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: מֵיתְרֵיהֶם
  choice: அவற்றின் கயிறுகள்
  rationale: מֵיתָר என்பது குறிப்பாகக் கூடாரத்தை உறுதிப்படுத்தும் கயிறைக் குறிக்கிறது; தமிழில் ‘கயிறுகள்’ இயல்பான சொல்.
- source_word: לְכָל כְּלֵיהֶם
  choice: அவற்றுக்குரிய எல்லா உபகரணங்கள்
  rationale: כְּלִים என்பது பாத்திரங்கள், கருவிகள், பொருட்கள் எனப் பரந்த பொருளுடையது. இங்கு தொடர்புடைய கட்டமைப்புப் பொருட்களைக் குறிப்பதால் ‘உபகரணங்கள்’ பொருத்தமானது.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: அவற்றுக்குரிய எல்லாப் பணிகள்
  rationale: עֲבֹדָה சேவை, வேலை அல்லது ஒதுக்கப்பட்ட பணி என்று பொருள்படும். இங்கு லேவியரின் நடைமுறைப் பொறுப்புகள் முன்னிலையில் இருப்பதால் ‘பணிகள்’ தெளிவாக உள்ளது.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: பெயர்பெயராக ஒதுக்கிக் கொடுங்கள்
  rationale: פקד இங்கு எண்ணுவதைக் காட்டிலும் தனிநபருக்கு ஒரு பொறுப்பை நியமிப்பதைக் குறிக்கிறது; בְשֵׁמֹת தனித்தனிப் பெயரின்படி செய்வதை வலியுறுத்துகிறது.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: அவர்கள் சுமக்கவேண்டிய பொறுப்புக்குரிய பொருட்கள்
  rationale: இச்செறிவான எபிரெயச் சொற்றொடர் ‘பொருட்கள்’, ‘பொறுப்பு/காவல் கடமை’, ‘சுமை’ ஆகிய கருத்துகளை இணைக்கிறது. தமிழ் வாசகருக்குத் தெளிவாக இருக்கும்படி அதன் நடைமுறைப் பொருள் முதன்மை உரையில் தரப்பட்டுள்ளது; சொற்தொடரின் இறுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
