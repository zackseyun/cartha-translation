revisions:
- from: இவர்கள் கோகாத்தியரின் குடும்பங்களில் எண்ணப்பட்டவர்கள்—சந்திப்புக் கூடாரத்தில் பணிசெய்த அனைவரும். மோசேயும் ஆரோனும் யாவேயின் கட்டளையின்படி, மோசேயின் மூலமாக[a] இவர்களை எண்ணினார்கள்.
  to: சந்திப்புக் கூடாரத்தில் பணிசெய்த கோகாத்தியரின் குடும்பங்களைச் சேர்ந்த எண்ணப்பட்டவர்கள் இவர்களே. யாவே மோசேயின் மூலம் கொடுத்த கட்டளையின்படி மோசேயும் ஆரோனும் அவர்களை எண்ணினர்.[a]
