base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தில் பணிசெய்த கோகாத்தியரின் குடும்பங்களைச் சேர்ந்த எண்ணப்பட்டவர்கள் இவர்களே. யாவே மோசேயின் மூலம் கொடுத்த கட்டளையின்படி மோசேயும் ஆரோனும் அவர்களை எண்ணினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லெழுத்தாக, “மோசேயின் கையால்.”
    reason: எபிரெய בְּיַד־מֹשֶׁה என்பது முகமை அல்லது இடைமுகத்தைக் குறிக்கும் மரபுத்தொடர்; இங்கு யாவேயின் கட்டளை மோசே வழியாகக் கொடுக்கப்பட்டதைக் குறிக்கிறது.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் மக்கள்தொகைக் கணக்கெடுப்பு சார்ந்த பொருளை நேரடியாகத் தருகிறது; சூழலில் பணிக்குத் தகுதியுள்ள ஆண்கள் குறிக்கப்பட்டாலும், எபிரெய மூலத்தில் இங்கே 'ஆண்கள்' என்ற சொல் வெளிப்படையாக இல்லை.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: கோகாத்தியரின் குடும்பங்கள்
  rationale: מִשְׁפְּחֹת என்பது குடும்பக் குழுக்கள் அல்லது குலப்பிரிவுகளைக் குறிக்கிறது; 'குடும்பங்கள்' நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל הָעֹבֵד
  choice: பணிசெய்த அனைவரும்
  rationale: עבד என்ற வினையின் பங்கேற்பு வடிவம் சேவையில் ஈடுபட்டவர்களைக் குறிக்கிறது; வசனத்தின் கணக்கெடுப்பு விவரிப்புடன் தமிழில் இறந்தகால வடிவம் இயல்பாக இணைகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதன் நிலையான பொருளைத் தெளிவாகத் தருகிறது; בְּ குறிக்கும் பணியின் இடம் அல்லது செயல்பாட்டுத் தளம் 'கூடாரத்தில்' என வெளிப்படுகிறது.
- source_word: אֲשֶׁר פָּקַד
  choice: இவர்களை எண்ணினார்கள்
  rationale: இங்கு פקד என்பது நியமித்தல் அல்ல, கணக்கெடுத்தல் அல்லது எண்ணுதல்; தொடர்புச் சொற்றொடரை இயல்பான தமிழ் வாக்கியமாக மாற்றுகிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளையின்படி
  rationale: சொற்பொருளில் 'யாவேயின் வாயின்படி' என்ற எபிரெய மரபுத்தொடர், கட்டளை அல்லது உத்தரவின்படி என்ற பொருளுடையது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: சொல்லெழுத்தாக 'மோசேயின் கையால்' என்றாலும், இம்மரபுத்தொடர் முகமை அல்லது இடைமுகத்தைச் சுட்டுகிறது; நவீனத் தமிழில் 'மூலமாக' பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְּיַד מֹשֶׁה குறிக்கும் முகமை
  choice: மோசேயின் மூலமாக
  alternative: மோசேயின் கையால்
  rationale: இரு வாசிப்புகளும் எபிரெய மரபுத்தொடரின் கூறுகளைப் பிரதிபலிக்கின்றன; இங்கு கட்டளை மோசே வழியாக வழங்கப்பட்டதைக் குறிக்கும் முகமைப் பொருள் இயல்பானது. சொல்லெழுத்து வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் கணக்கெடுப்பு மொழியும் தெய்வீகக் கட்டளையின் முகமைத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன; வாக்கிய ஓட்டத்திற்காக நீண்ட எபிரெய வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
