source:
  edition: WLC
  text: נָשֹׂ֗א אֶת רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם הֵ֑ם לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: ta
  text: கெர்சோனின் மக்களையும்[a] அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படியும் குலங்களின்படியும் கணக்கெடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “கெர்சோனின் மக்களுடைய தலையை உயர்த்து.” இது அவர்களைக் கணக்கிடு அல்லது மக்கள்தொகைக் கணக்கெடு என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: கணக்கெடு
  rationale: ‘தலையை உயர்த்து’ என்பது எபிரெய மொழியில் கணக்கிடுதல் அல்லது மக்கள்தொகைக் கணக்கெடுத்தல் என்னும் நிர்வாகப் பொருளுடைய மரபுத்தொடர். தமிழில் அதன் பொருளை இயல்பாகவும் கட்டளை வலிமையுடனும் தெரிவிக்க ‘கணக்கெடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மக்கள்
  rationale: מக்கள் என்பது ‘மகன்கள்’ என்ற நேரடிப் பொருளை மட்டும் அல்லாமல் இங்கு குறிக்கப்படும் வழித்தோன்றல்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கெர்சோனியர்’ என்ற இனப்பெயரை மூலத்தில் இல்லாமல் உருவாக்குவதையும் தவிர்க்கிறது.
- source_word: גַּם הֵם
  choice: அவர்களையும்
  rationale: முன்பு கணக்கிடப்பட்ட மற்றொரு குழுவுடன் இவர்களையும் சேர்க்க வேண்டும் என்ற பொருளை ‘-உம்’ விகுதியுடன் கூடிய ‘அவர்களையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தை வழியாக அமைந்த மூதாதையர் இல்லங்கள் அல்லது வம்சக் குடும்பப் பிரிவுகளை இச்சொற்றொடர் குறிக்கிறது. நவீன வாசகருக்குப் புரியும்படி ‘தந்தைவழிக் குடும்பங்கள்’ என்று வழங்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה தனிக்குடும்பத்தைவிடப் பெரிய சமூக அல்லது வம்சப் பிரிவைக் குறிக்கிறது; ஆகவே ‘குலங்கள்’ பொருத்தமானது.
