translation_notes:
  register: நவீன தரத் தமிழில் தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. நிர்வாகச் சூழலுக்கேற்ற ‘கணக்கெடு’ பயன்படுத்தப்பட்டு, தந்தைவழி வம்ச அமைப்பும் குலப் பிரிவும் தனித்தனியாகக் காட்டப்பட்டுள்ளன.
