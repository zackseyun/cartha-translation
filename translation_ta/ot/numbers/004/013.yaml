  text: וְ/דִשְּׁנ֖וּ אֶת הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֔י/ו בֶּ֖גֶד אַרְגָּמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: ta
  text: பின்பு அவர்கள் பலிபீடத்திலுள்ள சாம்பலை அகற்றி[a], அதன்மேல் ஊதா நிறத் துணியை விரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்தைச் சுத்தப்படுத்தி”; வேறொரு வகையில், “பலிபீடத்திலுள்ள கொழுப்புக் கலந்த சாம்பலை அகற்றி.” பலியிடும் சூழலில் எபிரெய வினைச்சொல், பலிபீடத்தில் எஞ்சிய சாம்பல் படிவை அகற்றுவதைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: சாம்பலை அகற்றி
  rationale: דשׁן என்பதன் பியேல் வடிவம் இப்பலியிடும் சூழலில் பலிபீடத்தில் எஞ்சிய சாம்பல் அல்லது கொழுப்புக் கலந்த சாம்பல் படிவை அகற்றுவதைக் குறிக்கிறது. நவீன தமிழில் ‘சாம்பலை அகற்றி’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: திருக்கூடாரப் பலிச் சூழலில் מִזְבֵּחַ என்பதற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: וּפָרְשׂוּ
  choice: விரிக்க வேண்டும்
  rationale: פרשׂ என்பது விரித்தல் அல்லது பரப்புதல் என்று பொருள்படும். ஒரு துணியால் பொருளை மூடும் இச்சூழலில் ‘விரிக்க வேண்டும்’ இயல்பான தமிழாக்கம்.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: עַל மற்றும் ஒருமை ஆண்பால் பின்னொட்டு இங்கு பலிபீடத்தின்மேல் துணியைப் போடுவதைக் குறிக்கின்றன.
- source_word: בֶּגֶד
  choice: துணி
  rationale: בגד பொதுவாக உடை என்றும் பொருள்படலாம்; இங்கு வழிபாட்டுப் பொருளை மூடும் நெசவுப் பொருளைக் குறிப்பதால் ‘துணி’ பொருத்தமானது.
- source_word: אַרְגָּמָן
  choice: ஊதா நிறத்
  rationale: אַרְגָּמָן என்பது ஊதா நிறமூட்டப்பட்ட பொருளைக் குறிக்கிறது. בֶּגֶד ஏற்கெனவே துணி என்ற கருத்தைத் தருவதால் ‘ஊதா நிறத் துணி’ தெளிவாக உள்ளது.
