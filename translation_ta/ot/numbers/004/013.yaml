translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய கட்டளையின் மூன்றாம் நபர் பன்மை வடிவம் தமிழில் ‘அவர்கள் ... வேண்டும்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
