base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: ta
  text: முப்பது வயது முதல் ஐம்பது வயது வரை உள்ளவர்களில், சந்திப்புக் கூடாரத்தில் பணியைச் செய்வதற்காகச் சேவையாற்ற வருகிற ஒவ்வொருவரையும் நீ கணக்கிட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேவையாற்ற” என்பதற்கு “கடமை ஆற்ற” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் ஒழுங்குபடுத்தப்பட்ட கூடாரப் பணியைக் குறிக்கப் படைச் சேவை மொழியை உருவகமாகப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: முப்பது வயதுமுதல் ஐம்பது வயதுவரை உள்ளவர்களை
  rationale: எபிரெய வயது வரம்புக்கான மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; தொடக்கமும் மேல்வரம்பும் உள்ளடங்கும் பொருளைச் சூழல் சுட்டுகிறது.
- source_word: תִּפְקֹד אֹתָם
  choice: நீ கணக்கிட வேண்டும்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் நிர்வாகச் சூழலில் פקד என்பதன் எண்ணுதல்/பதிவு செய்தல் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הַבָּא
  choice: வரும் ஒவ்வொருவரையும்
  rationale: כל உடன் வரும் பெயரெச்ச வினைவடிவத்தின் பகிர்ந்தளிக்கும் முழுமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: לִצְבֹא צָבָא
  choice: ஒழுங்கமைந்த சேவையில் ஈடுபட
  rationale: צבא என்பதிலுள்ள படைச் சேவை சார்ந்த ஒழுங்கமைந்த கடமை என்ற உருவக நிழலைப் பாதுகாத்து, இங்கு நேரடிப் போரைத் தவறாக உணர்த்தாமல் தருகிறது.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: பணிபுரிவதற்காக
  rationale: ஒரே வேரிலிருந்து அமைந்த வினை–பெயர் கட்டுமானத்தின் வலியுறுத்தலைத் தமிழில் இயல்பான பணிச் சொல்லால் வெளிப்படுத்துகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் புனித இடத்தைக் குறிக்கும் நிலையான பெயரைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் தருகிறது.
theological_decisions:
- issue: צבא மொழியை நேரடியான படைச் சொற்களால் மொழிபெயர்க்க வேண்டுமா
  choice: ஒழுங்கமைந்த சேவை
  alternative: படைப்பணி / போர்ப்பணி
  rationale: எண்ணாகமம் 4-இல் லேவியருக்குக் கூடாரப் பணியே ஒப்படைக்கப்படுகிறது; ஆகவே நேரடிப் போரை உணர்த்தாமல், மூலத்தில் உள்ள ஒழுங்கு மற்றும் கடமை சார்ந்த படை உருவகத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. மூலத்தின் இரண்டு தொடர்புடைய சேவைக் கூறுகளும் வேறுபடுத்தப்பட்டுள்ளன; படை உருவகம் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
