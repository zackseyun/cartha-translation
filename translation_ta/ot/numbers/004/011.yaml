source:
  edition: WLC
  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: ta
  text: பொன் பலிபீடத்தின் மேல் அவர்கள் நீலத் துணியை விரித்து, தகாஷ் தோல் உறையால்[a] அதை மூடி, அதன் தண்டுகளைப் பொருத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தகாஷ்’ என்று ஒலிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் எந்த உயிரினத்தைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. ‘நேர்த்தியான தோல்,’ ‘கடற்பசுத் தோல்’ போன்ற மொழிபெயர்ப்புகள் முன்மொழியப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: பொன் பலிபீடம்
  rationale: எபிரெயக் கட்டமைப்பு ‘பொன்னின் பலிபீடம்’ என நேரடியாக இருந்தாலும், நவீன தமிழில் ‘பொன் பலிபீடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִפְרְשׂוּ
  choice: விரித்து
  rationale: פרשׂ என்பதன் அடிப்படைப் பொருளான ‘விரி’ என்பதைச் சடங்குப் பொருளின்மேல் துணி போடும் செயலுக்கு இயல்பாக வழங்குகிறது.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: நீலநிறத் துணி
  rationale: בגד என்பது இங்கு துணியையும், תכלת என்பது நீலம் அல்லது நீல-ஊதா சாயலுடைய வண்ணத்தையும் குறிக்கிறது. துல்லியமான பழங்காலச் சாயலை மிகையாக நிர்ணயிக்காமல் ‘நீலநிறம்’ தெளிவாக உள்ளது.
- source_word: וְכִסּוּ אֹתוֹ
  choice: அதை ... மூடி
  rationale: முந்தைய பன்மை எழுவாயைத் தொடர்ந்து வரும் கட்டளைகளின் வரிசையைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: தகசுத் தோலால் செய்யப்பட்ட மூடி
  rationale: מכסה என்பது ‘மூடி’; עור என்பது ‘தோல்’. תחש குறிக்கும் உயிரினம் உறுதியாக அடையாளம் காணப்படாததால், ஊகிக்கப்பட்ட ஓர் உயிரினத்தின் பெயரை முதன்மை உரையில் இடாமல் எபிரெயச் சொல்லை ஒலிபெயர்த்து, ஐயத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: அதன் தண்டுகளை அவற்றுக்குரிய இடத்தில் வைக்க வேண்டும்
  rationale: בדים என்பது கூடாரப் பொருட்களைச் சுமப்பதற்கான தண்டுகள். ‘அவற்றுக்குரிய இடத்தில்’ என்பது செயற்பாட்டின் சூழல்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
