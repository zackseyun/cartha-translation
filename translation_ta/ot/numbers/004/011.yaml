revisions:
- from: பொன் பலிபீடத்தின்மேல் அவர்கள் நீலநிறத் துணியை விரித்து, அதைத் தகசுத் தோலால் செய்யப்பட்ட மூடியால்[a] மூடி, அதன் தண்டுகளை அவற்றுக்குரிய இடத்தில் வைக்க வேண்டும்.
