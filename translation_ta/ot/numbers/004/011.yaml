translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வழிபாட்டுச் சூழல் நடையைப் பேணுகிறது. வினைத் தொடரின் பன்மை எழுவாயைத் தெளிவாகக் காட்ட ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது. அறியப்படாத תחש என்ற விலங்குப் பெயரின் ஐயம் மறைக்கப்படாமல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
