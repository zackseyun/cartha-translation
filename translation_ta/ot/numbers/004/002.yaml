revisions:
- from: லேவியின் மக்களில் உள்ள கோகாத்தின் மக்களை, அவர்களுடைய குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும் கணக்கெடுங்கள்.[a]
  to: லேவியின் மக்களிலிருந்து கோகாத்தின் மக்களைக், அவர்களுடைய குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும் கணக்கெடு.[a]
  rationale: The revision preserves the Hebrew singular imperative, renders the explicit ‘from among’ relationship more closely, and aligns the footnote’s literal imperative with the Hebrew grammar. No doctrinal or interpretive expansion has been introduced.
  reviewer_model: gpt-5.6-terra
