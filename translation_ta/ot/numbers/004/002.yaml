id: NUM.4.2
reference: Numbers 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נָשֹׂ֗א אֶת רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִ/תּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: ta
  text: லேவியின் மக்களிலிருந்து கோகாத்தின் மக்களைக், அவர்களுடைய குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும் கணக்கெடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “கோகாத்தின் மக்களின் தலையை உயர்த்து”; இது அவர்களைக் கணக்கிடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: கணக்கெடுங்கள்
  rationale: இந்த எபிரெய மரபுத்தொடரின் சொற்பொருள் ‘தலையை உயர்த்துங்கள்’ என்பதாக இருந்தாலும், இங்குள்ள நிர்வாகச் சூழலில் மக்களைக் கணக்கிடுதல் அல்லது மக்கள்தொகைக் கணக்கெடுத்தல் என்பதே அதன் பொருள். இயல்பான நவீனத் தமிழில் அதனை ‘கணக்கெடுங்கள்’ என்று மொழிபெயர்த்துள்ளது.
- source_word: בְּנֵי קְהָת
  choice: கோகாத்தின் மக்களை
  rationale: எபிரெய மொழியின் வம்சவழி அமைப்பை நேரடியாகப் பேணுகிறது; ‘கோகாத்தியர்’ என்பதைவிட மூலத்தின் ‘மக்கள்’ என்ற வடிவத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: லேவியின் மக்களில் உள்ள
  rationale: ஒரு பெரிய வம்சக் குழுவுக்குள் இருக்கும் துணைக்குழுவைக் குறிக்கும் מִתּוֹךְ என்பதன் தெரிவு/உட்பிரிவு பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படியும்
  rationale: எண்ணாகமத்தின் கணக்கெடுப்புச் சூழலில் מִשְׁפָּחָה என்பது குடும்பத்தைவிடப் பெரிய குலப் பிரிவைக் குறிக்கிறது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படியும்
  rationale: இஸ்ரவேலின் தந்தைவழி வம்ச-நிர்வாக அலகைக் குறிக்கும் மூலமொழித் தொடரைத் தெளிவாகவும் தற்போதைய வாசகருக்குப் புரியுமாறும் வழங்குகிறது.
