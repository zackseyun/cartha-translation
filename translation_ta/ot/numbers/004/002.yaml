translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம வம்சவழிச் சொல்லாட்சியும் பேணப்பட்டுள்ளன. கட்டளையின் பன்மை மரியாதை வடிவமாக ‘கணக்கெடுங்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘குலங்கள்’ மற்றும் ‘தந்தைவழிக் குடும்பங்கள்’ என்ற இரு நிர்வாக-உறவுமுறை நிலைகளும் வேறுபடுத்தப்பட்டுள்ளன.
