  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: ta
  text: 'கெர்சோனியரின் குடும்பங்களின் பணி இதுவே: பணியாற்றுவதும் சுமைகளைச் சுமப்பதும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாற்றுவதும் சுமைகளை எடுத்துச் செல்வதும்.”
    reason: מַשָּׂא என்பது சுமை, சுமத்தல், அல்லது சுமந்து செல்லுதல் எனப் பொருள்படலாம். மாற்று வாசகம் ‘சுமத்தல்/சுமந்து செல்லுதல்’ என்ற செயல்முறை நுணுக்கத்தை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: זֹאת
  choice: இதுதான்
  rationale: எபிரெயப் பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன்வரும் ‘பணி’யைக் குறிக்கிறது; வினையற்ற பெயர்ச் சொற்றொடரைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘இதுதான்’ பொருத்தமானது.
- source_word: עֲבֹדַת
  choice: பணி
  rationale: עֲבֹדָה என்பது பணி, வேலை, சேவை ஆகிய பொருள்களைக் கொண்டது. லேவியரின் நியமிக்கப்பட்ட கூடாரப் பொறுப்பை நவீனத் தமிழில் தெளிவாகக் குறிக்க ‘பணி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִשְׁפְּחֹת
  choice: குடும்பங்கள்
  rationale: கெர்சோனியருக்குள் உள்ள குடும்பக் குழுக்களைக் குறிக்கும் பன்மை இணைப்புநிலை; ‘குடும்பங்கள்’ நேரடியும் பொதுவாகப் புரியக்கூடியதுமாகும்.
- source_word: הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியர்
  rationale: கெர்சோனின் வழிவந்தவர்களை ஒட்டுமொத்தமாகக் குறிக்கும் இன/குலப் பெயர். தமிழில் மரியாதைப் பன்மை வடிவான ‘கெர்சோனியர்’ இயல்பாக அமைகிறது.
- source_word: לַעֲבֹד
  choice: பணிசெய்வதும்
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்சப் பெயருரு பணியின் நோக்கம் அல்லது செயல்பாட்டைக் குறிக்கிறது. அடுத்த தொடருடன் உள்ள இணை அமைப்பை ‘பணிசெய்வதும்’ காக்கிறது.
- source_word: וּלְמַשָּׂא
  choice: சுமைகளைச் சுமப்பதும்
  rationale: מַשָּׂא சுமை அல்லது சுமத்தல்/சுமந்து செல்லுதல் எனப் பொருள்படும். கூடாரப் பொருட்களை எடுத்துச் செல்லும் நடைமுறைப் பணியை ‘சுமைகளைச் சுமப்பதும்’ தெளிவாக வெளிப்படுத்துகிறது.
