- from: 'கெர்சோனியரின் குடும்பங்கள் செய்யவேண்டிய பணி இதுதான்: பணிசெய்வதும் சுமைகளைச் சுமப்பதும்.[a]'
  to: 'கெர்சோனியரின் குடும்பங்களின் பணி இதுவே: பணியாற்றுவதும் சுமைகளைச் சுமப்பதும்.[a]'
