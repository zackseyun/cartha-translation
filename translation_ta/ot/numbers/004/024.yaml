review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Gershonite family groups and the paired functions of serving and carrying. However, “செய்யவேண்டிய” adds an explicit sense of obligation (“must do”) that is not stated in the Hebrew nominal clause. The source simply identifies their service/function.
  naturalness: The sentence is generally clear, but “குடும்பங்கள் செய்யவேண்டிய பணி” is less direct and introduces the added modal nuance. “குடும்பங்களின் பணி இதுவே” is natural modern standard Tamil and more closely follows the construct relationship.
  terminology: “கெர்சோனியர்,” “குடும்பங்கள்,” and “சுமைகளைச் சுமப்பதும்” are suitable. “பணியாற்றுவதும்” naturally renders the first infinitival function without confusing it with the overall noun “பணி.”
  issues:
  - severity: medium
    issue: Added obligation in “செய்யவேண்டிய”
    rationale: The Hebrew says, literally, “This [is] the service of the families of the Gershonite, for serving and for carrying.” It does not use a form meaning “that must be done.” Removing this wording preserves the source statement's non-modal sense.
  revised_text: 'கெர்சோனியரின் குடும்பங்களின் பணி இதுவே: பணியாற்றுவதும் சுமைகளைச் சுமப்பதும்.[a]'
  revised_footnotes:
  - marker: a
    text: அல்லது, “பணியாற்றுவதும் சுமைகளை எடுத்துச் செல்வதும்.”
    reason: מַשָּׂא என்பது சுமை, சுமத்தல், அல்லது சுமந்து செல்லுதல் எனப் பொருள்படலாம். மாற்று வாசகம் ‘சுமத்தல்/சுமந்து செல்லுதல்’ என்ற செயல்முறை நுணுக்கத்தை வெளிப்படுத்துகிறது.
  revision_rationale: 'The revision removes the unsupported modal idea of required duty while retaining the Hebrew structure: the Gershonite families'' service consists of serving and carrying. The footnote is adjusted to give a genuine lexical alternative for the carrying expression in idiomatic Tamil.'
