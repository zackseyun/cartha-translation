base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தில் அவர்கள் ஆற்றும் எல்லாச் சேவைகளுக்குமான மெராரியின் மகன்களின் குலங்களின் சேவை இதுவே. இது ஆசாரியனான ஆரோனின் மகன் இத்தாமாரின் மேற்பார்வையில்[a] நடைபெறும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “இத்தாமாரின் கையால்”; இது மேற்பார்வை அல்லது நிர்வாக வழிநடத்தலைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: இவையே
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் மொத்தப் பணியைச் சுருக்கமாகச் சுட்டுகிறது. தமிழில் அடுத்துள்ள ‘எல்லாப் பணிகளும்’ என்பதோடு இயல்பாக இயைய பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֲבֹדַת
  choice: பணிகள்
  rationale: லேவியருக்கு ஒதுக்கப்பட்ட இறைபணி சார்ந்த கடமைகளை இங்கு குறிக்கிறது; நவீன தமிழில் ‘பணி’ என்பது பொதுவான உழைப்பைவிட நியமிக்கப்பட்ட சேவையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலத்தார்
  rationale: கோத்திரத்துக்குள் உள்ள வம்சக் குழுக்களைக் குறிக்கும் சொல்; நவீன தனிக்குடும்பங்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘குலத்தார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּנֵי מְרָרִי
  choice: மெராரியின் வழிவந்த
  rationale: எபிரெய மரபுவழிச் சொல்லான ‘மெராரியின் மகன்கள்’ இங்கு சந்ததிக் குழுவை ஒட்டுமொத்தமாகக் குறிக்கிறது; தமிழில் அதனைத் தெளிவாகவும் இயல்பாகவும் ‘வழிவந்த’ என வழங்குகிறது.
- source_word: לְכָל עֲבֹדָתָם
  choice: செய்ய வேண்டிய எல்லாப் பணிகளும்
  rationale: அவர்களுக்கு ஒதுக்கப்பட்ட கடமைகளின் முழுமையை வெளிப்படுத்துகிறது; ‘செய்ய வேண்டிய’ என்பது பணிநியமனத்தின் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதற்கான பொருள் சார்ந்த நேரடி பெயர்ப்பு; בְּ குறிக்கும் பணியின் இடம் அல்லது செயல்தளம் ‘-த்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּיַד
  choice: மேற்பார்வையில்
  rationale: சொல்லளவில் ‘கையின்கீழ்’ என்றாலும், இச்சூழலில் நிர்வாக மேற்பார்வை அல்லது வழிநடத்தலைக் குறிக்கும் எபிரெய மரபுத்தொடர். பிரதான உரையில் அதன் சூழல்பொருள் தரப்பட்டுள்ளது.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனான ஆரோனின் மகன் இத்தாமார்
  rationale: பெயர், தந்தைவழி அடையாளம், ஆசாரியத் தொடர்பு ஆகியவற்றைத் தெளிவாகப் பாதுகாக்கிறது. எபிரெயத் தொடரின் சாத்தியமான இணைப்பை தமிழில் இயல்பான முறையில் வழங்குகிறது.
