translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு வழிமுறைக்குரிய கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் பன்மையிலிருந்து ஒருமைக்கு நிகழும் மாற்றமும், ‘தகாஷ்’ என்ற சொல்லின் உண்மையான நிச்சயமின்மையும் பாதுகாக்கப்பட்டுள்ளன.
