source:
  edition: WLC
  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: ta
  text: அவற்றின்மேல் கருஞ்சிவப்புத் துணியை விரித்து, அதைத் தகாஷ் தோலால் செய்யப்பட்ட மூடியால்[a] மூடி, அதன் தண்டுகளைப் பொருத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தகாஷ் தோல்’; இது எந்த விலங்கின் தோல் அல்லது எத்தகைய பொருள் என்பது உறுதியாகத் தெரியவில்லை. மரபான மொழிபெயர்ப்புகளில் ‘வளைக்கரடித் தோல்,’ ‘கடற்பன்றித் தோல்,’ அல்லது பொதுவாக ‘உயர்தரத் தோல்’ என்பன அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: அவற்றின்மேல் ... விரித்து
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொருட்களின்மேல் ஒரு மூடியை விரிக்கும் செயலையும், எபிரெய மொழியிலுள்ள பன்மைச் சுட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: செந்நிறத் துணி
  rationale: בֶּגֶד இச்சூழலில் உடையைக் காட்டிலும் மூடுவதற்கான துணியைக் குறிக்கிறது. תּוֹלַעַת שָׁנִי செந்நிறச் சாயமிட்ட பொருளைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நூல்’ என்பதைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְכִסּוּ אֹתוֹ
  choice: அதை ... மூடி
  rationale: முன்னுள்ள பன்மையான ‘அவற்றின்மேல்’ என்பதிலிருந்து எபிரெய உரை ஒருமைச் சுட்டுக்கு மாறுவதை ‘அதை’ என்பதன் மூலம் பாதுகாக்கிறது; இது மேசையை ஓர் அலகாகச் சுட்டுகிறது.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: தகாஷ் தோலினாலான மூடியால்
  rationale: מִכְסֶה என்பது மேலடுக்கு மூடியைக் குறிக்கிறது. תָּחַשׁ எந்த விலங்கு அல்லது தோல் வகை என்பது உறுதியாகத் தெரியாததால் ஊகமான விலங்குப் பெயரைத் தவிர்த்து ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשָׂמוּ אֶת־בַּדָּיו
  choice: அதன் தண்டுகளைப் பொருத்த வேண்டும்
  rationale: בַּדִּים என்பது பரிசுத்தப் பொருளைச் சுமப்பதற்கான தண்டுகள். שׂים இங்கு அவற்றை உரிய நிலையில் வைப்பதைச் சுட்டுவதால், நவீன தமிழில் ‘பொருத்த’ என்பது செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
