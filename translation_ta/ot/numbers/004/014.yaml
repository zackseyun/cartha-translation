base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: ta
  text: பின்பு, பலிபீடத்தில் பணிசெய்யப் பயன்படுத்தும் அதன் எல்லாக் கருவிகளையும்—நெருப்புத் தட்டுகள், முட்கரண்டிகள், சாம்பல் அள்ளும் கருவிகள், கிண்ணங்கள், அதாவது பலிபீடத்தின் எல்லாக் கருவிகளையும்—அதன்மேல் வைக்க வேண்டும். பின்பு, அதன்மேல் தகாஷ் தோலால் செய்யப்பட்ட ஒரு மூடியை[a] விரித்து, அதன் தூக்குக்கழிகளைப் பொருத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாஷ்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் எந்த விலங்கையோ தோல் வகையையோ குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. இதை வெள்ளாட்டுத் தோல், கடல்வாழ் விலங்கின் தோல் அல்லது பொதுவாக நீடித்த தரமான தோல் என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: பின்பு ... அதன்மேல் வைக்க வேண்டும்
  rationale: தொடர்ச்சியான வழிமுறையை இயல்பான நவீன தமிழில் காட்டுகிறது; עָלָיו என்பதன் பலிபீடத்தைக் குறிக்கும் தொடர்பையும் காக்கிறது.
- source_word: כָּל־כֵּלָיו
  choice: அதன் எல்லாக் கருவிகளையும்
  rationale: כְּלִי என்பது பாத்திரங்கள் மட்டுமல்லாமல் பலவகை உபகரணங்களைக் குறிக்கும்; பட்டியலில் கருவிகளும் பாத்திரங்களும் இருப்பதால் ‘கருவிகள்’ என்ற பொதுச்சொல் பொருத்தமானது.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: பலிபீடத்தில் பணிசெய்யப் பயன்படுத்தும்
  rationale: שרת என்பதன் வழிபாட்டுப் பணி நுணுக்கத்தை ‘பணிசெய்ய’ காக்கிறது; கருவிகள் மூலம் செய்யப்படும் சேவையை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: הַמַּחְתֹּת
  choice: நெருப்புத் தட்டுகள்
  rationale: நெருப்பு அல்லது தணலை எடுத்துச் செல்லும் தட்டுகளைக் குறிக்கிறது; தூபக் கலசங்கள் என்று தேவையின்றி குறுக்கிவிடுவதில்லை.
- source_word: הַמִּזְלָגֹת
  choice: முட்கரண்டிகள்
  rationale: முனைகளுள்ள fork போன்ற பலிபீடக் கருவியை சாதாரண வாசகருக்குப் புரியும் வகையில் குறிக்கிறது.
- source_word: הַיָּעִים
  choice: சாம்பல் அள்ளும் கருவிகள்
  rationale: பலிபீடச் சூழலில் சாம்பலை அகற்றப் பயன்படும் scoop/shovel வகை கருவிகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: הַמִּזְרָקֹת
  choice: கிண்ணங்கள்
  rationale: திரவம் அல்லது இரத்தத்தை ஏந்தவும் தெளிக்கவும் பயன்பட்ட அகன்ற பாத்திரங்களுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் எல்லாக் கருவிகளையும்
  rationale: முந்தைய பட்டியலைச் சுருக்கமாக மீண்டும் கூறும் மூல அமைப்பையும் சொல் ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: அதன்மேல் ... ஒரு மூடியை விரித்து
  rationale: פרשׂ என்பதன் ‘விரித்தல்’ என்ற செயற்பொருளையும் כְּסוּי என்பதன் பெயர்ச்சொல் வடிவையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: עוֹר תַּחַשׁ
  choice: தகாஷ் தோலால் செய்யப்பட்ட
  rationale: תַּחַשׁ குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாகத் தெரியாததால் ஊகமான விலங்குப் பெயரை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: וְשָׂמוּ בַדָּיו
  choice: அதன் தண்டுகளைப் பொருத்த வேண்டும்
  rationale: பயணத்திற்காகத் தூக்கும் தண்டுகளை உரிய இடத்தில் அமைப்பதே சூழல்சார் பொருள்; ‘பொருத்த’ என்பது இயல்பான செயல்வழிமுறை மொழி.
