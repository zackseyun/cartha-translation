  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமானதும் சாதாரண வாசகருக்குத் தெளிவானதும் ஆன நடை பயன்படுத்தப்பட்டது. அறியப்படாத תַּחַשׁ என்பதற்கு ஊகமான விலங்குப் பெயரைத் தேர்ந்தெடுக்காமல், முதன்மை உரையில் ஒலிபெயர்ப்பும் அடிக்குறிப்பில் மாற்று விளக்கங்களும் தரப்பட்டன.
