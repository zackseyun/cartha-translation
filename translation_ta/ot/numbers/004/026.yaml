  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: ta
  text: முற்றத்தின் தொங்குதிரைகளையும், திருவாசஸ்தலத்தையும் பலிபீடத்தையும் சுற்றியுள்ள முற்றத்து வாசலின் நுழைவாயிலுக்கான மறைப்புத்திரையையும், அவற்றின் கயிறுகளையும்[a], அவற்றின் பணிக்குரிய எல்லா உபகரணங்களையும், அவற்றைக் கொண்டு செய்யப்பட வேண்டிய அனைத்தையும்[b] அவர்கள் சுமக்க வேண்டும்; அவர்கள் பணிசெய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வடங்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றிற்காகச் செய்யப்பட வேண்டிய அனைத்தையும்.” எபிரெய வாசகம், இப்பொருட்களைக் கொண்டு செய்யப்படும் பணிகளையோ, பணியின்போது அவற்றிற்காகச் செய்யப்படுபவற்றையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: தொங்குதிரைகள்
  rationale: முற்றத்தின் சுற்றடைப்பை உருவாக்கிய துணித் திரைகளைக் குறிக்கிறது; உள்ளகத் திரைகளிலிருந்து வேறுபடுத்தவும் இயல்பான தமிழில் வடிவத்தையும் செயலையும் உணர்த்தவும் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருவாசஸ்தலத்தைச் சுற்றியிருந்த அடைக்கப்பட்ட வெளிப்பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מָסַךְ
  choice: மறைப்புத்திரை
  rationale: நுழைவிடத்தில் தொங்கவிடப்பட்ட துணித் தடுப்பைக் குறிக்கிறது; அதன் பொருளையும் மறைக்கும் செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: פֶּתַח שַׁעַר
  choice: வாசல் நுழைவு
  rationale: எபிரெயச் சொற்றொடரில் உள்ள வாசல் மற்றும் நுழைவிடம் ஆகிய இரு கூறுகளையும், தமிழில் தேவையற்ற கடினத்தன்மையின்றி காக்கிறது.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: திருவாசஸ்தலத்தையும் பலிபீடத்தையும் சுற்றியுள்ள
  rationale: முற்றத்தின் இடவமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; סָבִיב என்பதன் ‘சுற்றிலும்’ என்ற கருத்தைக் காக்கிறது.
- source_word: מֵיתְרֵיהֶם
  choice: அவற்றின் கயிறுகள்
  rationale: திரைகளோடு தொடர்புடைய கட்டுக் கயிறுகளைச் சாதாரண வாசகருக்குத் தெளிவாகக் குறிக்கிறது; ‘வடங்கள்’ என்பதும் சாத்தியம்.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: அவற்றின் பணிக்குரிய எல்லா உபகரணங்கள்
  rationale: כְּלִים என்பதன் விரிவான கருவி/பொருள் கருத்தையும் עֲבֹדָה என்பதன் பணிசார் கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: அவற்றைக் கொண்டு செய்யப்பட வேண்டிய அனைத்தும்
  rationale: பட்டியலிடப்பட்ட பொருட்களைப் பயன்படுத்திச் செய்யப்படும் பணிகளைக் குறிக்கும் சாத்தியமான பொருளை முதன்மைப்படுத்துகிறது; ‘அவற்றிற்காக’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְעָבָדוּ
  choice: அவர்கள் பணிசெய்ய வேண்டும்
  rationale: கூடாரப் பொறுப்பை நிறைவேற்றும் சேவை/வேலை என்ற இரட்டைப் பொருளையும் சமயப் பணிச்சூழலையும் அளவோடு காக்கிறது.
theological_decisions:
- issue: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם என்பதில் לָהֶם குறிக்கும் உறவு
  choice: அவற்றைக் கொண்டு செய்யப்பட வேண்டிய அனைத்தும்
  alternative: அவற்றிற்காகச் செய்யப்பட வேண்டிய அனைத்தும்
  rationale: எபிரெய முன்னிடைச்சொல் இங்கு கருவிகளைக் கொண்டு செய்யும் பணியையோ அவற்றிற்காகச் செய்யும் பராமரிப்பையோ குறிக்கலாம்; சூழலுக்கு ஏற்ற முதல் பொருள் உரையில் தரப்பட்டு, உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத்தமிழில், வழிபாட்டுக் கூடாரச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் 25-ல் தொடங்கும் சுமக்கும் கடமைகளின் தொடர்ச்சியாக இருப்பதால் தமிழில் “சுமக்க வேண்டும்” சேர்க்கப்பட்டது; இது எபிரெய மூலத்தில் முந்தைய வசனத்திலிருந்து தொடரும் வாக்கிய அமைப்பை வெளிப்படையாக்குகிறது. “திருவாசஸ்தலம்” என்பது מִשְׁכָּן என்பதன் குடியிருப்பு/புனித இருப்பிடக் கருத்தைச் சமயப் பிரிவுசார் தனிச்சொல் இன்றி வழங்குகிறது.
