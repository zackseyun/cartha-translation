base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: 'அப்பொழுது யாவே[a] மோசேயிடமும் ஆரோனிடமும் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயரின் எபிரெய வடிவத்தையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு … பேசிக் கூறினார்
  rationale: வழக்கமான wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ அதன் தொடர்ச்சி உணர்வை வெளிப்படுத்துகிறது; ‘பேசிக் கூறினார்’ என்பது பேச்சுச் செயலையும் தொடர்ந்து வரும் לֵאמֹר அறிமுகத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எபிரெய மெய்யெழுத்துகளாலான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பொதுவாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரும் பேச்சின் நேரடி பெறுநர்கள் என்பதைத் தெளிவாக்க, எபிரெயத்தில் மீண்டும் வரும் אֶל என்பதன் உறவு ‘-இடமும் … -இடமும்’ என்ற இணை அமைப்பில் தக்கவைக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: 'கூறினார்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை, தமிழில் இயல்பான ‘கூறினார்:’ என்பதாலும் நிறுத்தக்குறியாலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, YHWH என்ற தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. ஆகவே பட்டமாகிய ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது. அதன் பழமையான துல்லிய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘மோசேயிடமும் ஆரோனிடமும்’ என்பது மூலத்தின் இணை அமைப்பை இயல்பாகத் தக்கவைக்கிறது; இறுதிக் கோலன் அடுத்த வசனத்தில் பேச்சு தொடர்வதைக் காட்டுகிறது.
