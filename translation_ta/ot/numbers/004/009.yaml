base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: ta
  text: பின்பு அவர்கள் நீலநிறத் துணியை[a] எடுத்து, வெளிச்சத்துக்கான விளக்குத்தண்டையும் அதன் விளக்குகளையும், அதன் இடுக்கிகளையும், அதன் நெருப்புத் தட்டுகளையும், அதற்குப் பணிவிடை செய்யப் பயன்படுத்தப்படும் அதன் எண்ணெய்க்கான எல்லாப் பாத்திரங்களையும் மூட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீலநிறம்” என்பதற்கு “நீல-ஊதா நிறம்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் תְּכֵלֶת திருக்கூடாரப் பொருட்களில் பயன்படுத்தப்பட்ட தனித்துவமான சாயமிட்ட துணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: நீலநிறத் துணி
  rationale: בֶּגֶד என்பது இச்சூழலில் உடையைவிட மூடுவதற்கான ‘துணி’யைக் குறிக்கிறது. תְּכֵלֶת என்பது திருக்கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட தனித்துவமான நீலம் அல்லது நீல-ஊதா நிறச் சாயத்தைக் குறிக்கிறது; இயல்பான தமிழில் ‘நீலநிறம்’ என வழங்கி, நிற நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: வெளிச்சத்துக்கான விளக்குத்தண்டு
  rationale: מְנוֹרָה என்பது பல விளக்குகளைத் தாங்கும் விளக்குத்தண்டு; הַמָּאוֹר என்ற சார்புத்தொடர் அதன் வெளிச்சமளிக்கும் செயல்பாட்டைக் காட்டுகிறது. ‘வெளிச்சத்துக்கான’ என்பது இயல்பான தமிழில் அந்தச் செயல்பாட்டைத் துல்லியமாகத் தருகிறது.
- source_word: נֵרֹתֶיהָ
  choice: அதன் விளக்குகள்
  rationale: இது விளக்குத்தண்டுடன் இணைந்த தனித்தனி விளக்குகளைக் குறிக்கிறது; ‘விளக்குகள்’ தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: מַלְקָחֶיהָ
  choice: அதன் இடுக்கிகள்
  rationale: விளக்குத் திரி அல்லது நெருப்பைக் கையாளும் கருவியைக் குறிக்கும் பொதுவான சொல்லாக ‘இடுக்கிகள்’ பொருந்துகிறது; ‘திரி வெட்டும் கருவிகள்’ என்பது சாத்தியமானாலும் மூலச்சொல்லைவிட குறிப்பானது.
- source_word: מַחְתֹּתֶיהָ
  choice: அதன் நெருப்புத் தட்டுகள்
  rationale: மூலச்சொல் நெருப்புத் தட்டு அல்லது தூபக்கலத்தைக் குறிக்கலாம். விளக்குத்தண்டு சூழலில் திரி, சாம்பல் அல்லது தணலைக் கையாளும் நெருப்புத் தட்டுகள் என்பதே பொருத்தமானது; ‘தூபக்கலங்கள்’ தூபப் பயன்பாட்டைத் தவறாக உணர்த்தலாம்.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: அதன் எண்ணெய்க்கான எல்லாப் பாத்திரங்கள்
  rationale: כְּלִים என்பது பாத்திரங்கள் அல்லது கருவிகள்; שַׁמְנָהּ என்பது விளக்குத்தண்டுடன் தொடர்புடைய எண்ணெயைக் குறிக்கிறது. ‘எண்ணெய்க்கான பாத்திரங்கள்’ என்பது உறவைக் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: அதற்குப் பணிவிடை செய்யப் பயன்படுத்தும்
  rationale: שׁרת என்பது வழிபாட்டுச் சூழலில் பணிவிடை செய்வதைக் குறிக்கிறது. בָּהֶם என்ற பன்மை கருவிப்பொருளை, இந்தப் பாத்திரங்களைப் ‘பயன்படுத்தும்’ எனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; לָהּ என்பதன் ஒருமை விளக்குத்தண்டை நோக்குகிறது.
