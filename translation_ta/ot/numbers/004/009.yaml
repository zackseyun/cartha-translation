translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விளக்குத்தண்டு’ என்பது பல விளக்குகளைத் தாங்கும் மெனோராவைத் தெளிவுபடுத்துகிறது; அரிதான கருவிப் பெயர்களில் தேவையற்ற மிகைக்குறிப்பைத் தவிர்த்து மூலத்தின் பொருள் வரம்பு காக்கப்பட்டுள்ளது.
