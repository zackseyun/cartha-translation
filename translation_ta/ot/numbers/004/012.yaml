base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: ta
  text: பின்பு, பரிசுத்த இடத்தில் பணிவிடை செய்யப் பயன்படும் பொருள்கள் அனைத்தையும் அவர்கள் எடுத்து, நீலநிறத் துணியில் வைத்து, அவற்றை ஒருவகைத் தோலாலான உறையால்[a] மூடி, சுமக்கும் தண்டின்மேல்[b] வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான תָּחַשׁ (தகாஷ்) என்பதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. அது ஒரு குறிப்பிட்ட விலங்கின் தோலையோ, சிறந்த அல்லது நீடித்த ஒருவகைத் தோலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சுமக்கும் அமைப்பின்மேல்.” எபிரெய மொழியில் “தண்டு/கோல்” என்பது ஒருமையில் உள்ளது; அது சுமப்பதற்கான அமைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: பின்பு… அவர்கள் எடுத்து
  rationale: சடங்கு நடவடிக்கைகளின் தொடர்ச்சியை வாவ் இணைப்பு காட்டுவதால், இயல்பான தமிழில் ‘பின்பு’ எனத் தரப்பட்டுள்ளது; לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ காக்கப்பட்டுள்ளது.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: பணிவிடை செய்யப் பயன்படும் பொருள்கள் அனைத்தையும்
  rationale: כְּלִי என்பது இங்கு பரிசுத்த கூடாரப் பணியில் பயன்படுத்தப்படும் பலவகைப் பாத்திரங்கள், கருவிகள், சாதனங்கள் ஆகியவற்றை உள்ளடக்குகிறது; ‘பொருள்கள்’ அந்த விரிவை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில் பணிவிடை செய்யப் பயன்படும்
  rationale: שרת என்பதன் வழிபாட்டுப் பணிசார்ந்த பொருளை ‘பணிவிடை செய்ய’ என்பதும், בַּקֹּדֶשׁ என்பதைக் குறிப்பிட்ட உட்பிரிவாக மிகையாகச் சுருக்காமல் ‘பரிசுத்த இடத்தில்’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: நீலநிறத் துணி
  rationale: இந்தப் பொதி கட்டும் சூழலில் בֶּגֶד என்பதற்கு ‘ஆடை’ என்பதைவிட ‘துணி’ இயல்பானது; תְּכֵלֶת குறிக்கும் நீல அல்லது நீலச்சாய நிறம் எளிய தமிழில் ‘நீலநிறம்’ எனத் தரப்பட்டுள்ளது.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: ஒருவகைத் தோலாலான உறை[a]
  rationale: תָּחַשׁ குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாகத் தெரியாததால் ஊகமான விலங்குப் பெயரையோ தரக் குறிப்பையோ சேர்க்காமல் பொதுவாக மொழிபெயர்த்து, ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: சுமக்கும் தண்டின்மேல்[b] வைக்க வேண்டும்
  rationale: מוֹט என்பது ஒருமையில் தண்டு அல்லது சுமக்கும் கோலைக் குறிக்கலாம். போக்குவரத்துச் செயல்பாடு தெளிவாக இருக்க ‘சுமக்கும் தண்டு’ எனத் தரப்பட்டு, மாற்று புரிதல் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
