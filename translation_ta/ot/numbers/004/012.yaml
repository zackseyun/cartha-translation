translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. வழிபாட்டுச் சூழலைக் குறிக்க ‘பணிவிடை’ மற்றும் ‘பரிசுத்த இடம்’ போன்ற நிலைபெற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன; உறுதியற்ற תָּחַשׁ என்பதற்கு ஊகமான விலங்குப் பெயர் தவிர்க்கப்பட்டுள்ளது.
