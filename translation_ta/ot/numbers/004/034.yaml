translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய உறவுமுறை மற்றும் கணக்கெடுப்பு அமைப்பு இயன்றவரை காக்கப்பட்டுள்ளன; ‘தந்தைவழிக் குடும்பங்கள்’ என்ற வடிவம் தொழில்நுட்பமான உறவுமுறைச் சொல்லைத் தெளிவுபடுத்துகிறது.
