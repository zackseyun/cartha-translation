base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: ta
  text: மோசேயும் ஆரோனும் சபையின் தலைவர்களும் கோகாத்தின் சந்ததியினரை[b], அவர்களுடைய குலங்களின்படியும் தந்தையரின் குடும்பங்களின்படியும்[c] கணக்கெடுத்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எண்ணினார்கள்’ அல்லது ‘மக்கள்தொகைக் கணக்கெடுத்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வேறு சூழல்களில் ‘நியமித்தார்கள்’ என்றும் பொருள்படும்; இங்கு பணிக்காக ஆட்களை எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘கோகாத்தியரின் மகன்கள்.’ இது கோகாத்தின் வழிவந்த குலக்குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘தந்தையரின் வீடுகள்’ என்பது சொற்சொல்லான மொழிபெயர்ப்பு; இது மூதாதையர் வழி அமைந்த குடும்பங்கள் அல்லது வம்சப் பிரிவுகளைக் குறிக்கும் இஸ்ரவேலரின் மரபுச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: கணக்கெடுத்தார்கள்
  rationale: எண்ணிக்கைப் பதிவு செய்யும் இந்தச் சூழலில் פקד என்பது பதவிக்கு நியமிப்பதைக் குறிக்காமல், பணிக்காக ஆட்களை எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது. கூட்டுப் பொருளாக வரும் எழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נְשִׂיאִים என்பது அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களையும், עֵדָה வனாந்தரப் பயணத்தில் ஒன்றுகூடிய இஸ்ரவேல் சபையையும் குறிக்கிறது. இச்சொற்றொடர் நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בְּנֵי הַקְּהָתִי
  choice: கோகாத்தியரின் மக்களை
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறை வடிவமான ‘கோகாத்தியரின் மகன்கள்/மக்கள்’ என்பதைக் காக்கிறது; இங்கு அது கோகாத்தின் வழிவந்த குலக்குழுவை மொத்தமாகக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் வம்சவரிசைச் சூழல்களில் מִשְׁפָּחָה என்பது கோத்திரத்திற்குள் உள்ள உறவுமுறைக் குலப்பிரிவைக் குறிக்கிறது; לְ வகைப்படுத்தும் பொருளில் ‘-இன்படி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּלְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵּית אָבוֹת என்பது இஸ்ரவேலரின் மூதாதையர் வழி அமைந்த குடும்ப அல்லது வம்சப் பிரிவைக் குறிக்கும் மரபுச் சொற்றொடர். சொற்சொல்லான ‘தந்தையரின் வீடுகள்’ என்பதைவிட இத்தேர்வு அதன் சமூகப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
