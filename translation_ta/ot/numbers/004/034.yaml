revisions:
- from: எனவே மோசேயும் ஆரோனும் சபையின் தலைவர்களும் கோகாத்தியரின் மக்களை[b], அவர்களுடைய குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும்[c] கணக்கெடுத்தார்கள்[a].
  to: மோசேயும் ஆரோனும் சபையின் தலைவர்களும் கோகாத்தின் சந்ததியினரை[b], அவர்களுடைய குலங்களின்படியும் தந்தையரின் குடும்பங்களின்படியும்[c] கணக்கெடுத்தார்கள்[a].
  rationale: The revision removes the unsupported inferential «எனவே» and replaces an awkward, potentially misleading genealogical expression with idiomatic Tamil. It preserves the Hebrew census sense, the named Kohathite descent group, and both nested kinship classifications. Footnote markers remain attached to their corresponding referents.
