  text: 'மெராரியின் மகன்களின் வம்சங்களைச் சேர்ந்த எண்ணப்பட்டவர்கள், அவர்களுடைய வம்சங்களின்படியும் அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படியும்:'
