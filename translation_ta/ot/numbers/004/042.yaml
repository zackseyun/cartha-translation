lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: எண்ணப்பட்டவர்கள்
  rationale: פקד என்பதன் இச்சூழலிலுள்ள கணக்கெடுப்பு சார்ந்த பொருளைத் தெளிவாகவும், அடுத்த வசனத்துடன் இலக்கணத் தொடர்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: מִשְׁפְּחֹת
  choice: வம்சங்கள்
  rationale: லேவியரின் உட்பிரிவுகளைக் குறிக்கும் சொல்; தமிழில் இயல்பான வேதாகமச் சமூகப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: בֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்கள்
  rationale: சொற்பொருளான ‘அவர்களுடைய தந்தையரின் வீடு’ என்பதை இயல்பான தமிழில் தந்தைவழிக் குடும்ப அலகாக வெளிப்படுத்துகிறது.
