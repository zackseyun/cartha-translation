  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: ta
  text: முப்பது வயது முதல் ஐம்பது வயது வரையுள்ள, சந்திப்புக் கூடாரப் பணியைச் செய்வதற்காகச் சேவையில்[a] ஈடுபட வரும் ஒவ்வொருவரையும் நீ கணக்கிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேவை” என்பதற்கான எபிரேயச் சொல் ஒழுங்கமைக்கப்பட்ட அணி அல்லது படையையும் குறிக்கக்கூடும்; இங்கு அது லேவியர்களுக்கு ஒதுக்கப்பட்ட கூடாரப் பணியைக் குறிக்கிறது.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: முப்பது வயதுமுதல் ஐம்பது வயதுவரை உள்ளவர்களை
  rationale: எபிரேய வயது வரம்பைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது; முப்பதும் ஐம்பதும் வரம்பில் அடங்கும் பொருளையும் காக்கிறது.
- source_word: תִּפְקְדֵם
  choice: நீ கணக்கிட வேண்டும்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது தகுதியுள்ளவர்களைக் கணக்கிட்டு பதிவு செய்வதைக் குறிக்கிறது. ‘கணக்கிட வேண்டும்’ என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: כָּל הַבָּא
  choice: சேரும் ஒவ்வொருவரையும்
  rationale: כָּל உடன் வரும் ஒருமை வினையெச்சம் ஒவ்வொரு தகுதியுள்ள நபரையும் தனித்தனியாகச் சுட்டுகிறது; ‘ஒவ்வொருவரையும்’ அந்தப் பகிர்ந்தளிக்கும் பொருளைக் காக்கிறது.
- source_word: לַצָּבָא
  choice: ஒழுங்கமைக்கப்பட்ட சேவையில்
  rationale: צָבָא என்பதற்கு படை அல்லது அணிவகுத்த குழு என்ற நிழற்பொருள் இருக்கலாம்; இங்கு அது லேவியர்களுக்கு ஒதுக்கப்பட்ட ஒழுங்குபடுத்தப்பட்ட கூடாரப் பணியைக் குறிக்கிறது. ‘ஒழுங்கமைக்கப்பட்ட சேவை’ போர்ப்பொருளைத் தேவையின்றி புகுத்தாமல் அந்த அமைப்புத்தன்மையைக் காட்டுகிறது.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: பணியைச் செய்வதற்காக
  rationale: ஒரே வேர் மீண்டும் வருவதை தமிழில் செயற்கையாகப் பிரதிபலிக்காமல், செயலைவும் அதற்குரிய பணியையும் தெளிவாகக் கூறுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இது தேவன் தம் மக்களைச் சந்திப்பதற்கென நியமிக்கப்பட்ட பரிசுத்த கூடாரத்தின் நிலையான பெயரைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לַצָּבָא என்பதிலுள்ள படை சார்ந்த நிழற்பொருள்
  choice: ஒழுங்கமைக்கப்பட்ட சேவை
  alternative: படை / அணிவகுத்த குழு / கடமை
  rationale: இந்த வசனம் போரைப் பற்றியதல்ல; சந்திப்புக் கூடாரத்தில் லேவியர்கள் மேற்கொள்ளும் நியமிக்கப்பட்ட பணியைப் பற்றியது. அதேவேளை, இது சாதாரண உதவி அல்லாமல் ஒழுங்குபடுத்தப்பட்ட அதிகாரப்பூர்வ சேவை என்பதையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீளமான எபிரேய வாக்கியத்தின் கணக்கிடும் கட்டளையை தமிழில் தெளிவுபடுத்த இறுதியில் மீண்டும் கூறப்பட்டுள்ளது; மூலத்தின் பொருள் மாற்றப்படவில்லை.
