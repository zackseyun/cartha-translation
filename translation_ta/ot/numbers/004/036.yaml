  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: ta
  text: அவர்களில் அவரவர் குலங்களின்படி எண்ணப்பட்டவர்கள் இரண்டாயிரத்து எழுநூற்று ஐம்பது பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்தார்கள் என்பதைக் இயல்பான தமிழ் எண்ணிக்கை வாக்கியமாக வெளிப்படுத்தல்
  rationale: வாவ்-தொடருடன் வரும் היה இங்கு கணக்கெடுப்பின் முடிவைத் தொடர்ந்து தெரிவிக்கிறது. தமிழில் தனியாக ‘அவர்கள் இருந்தார்கள்’ என்று மொழிபெயர்ப்பதைவிட, எண்ணப்பட்டவர்களின் மொத்தத்தை நேரடியாகக் கூறுவது இயல்பானது.
- source_word: פְקֻדֵיהֶם
  choice: அவர்களில் ... எண்ணப்பட்டவர்கள்
  rationale: פקד என்ற வேரிலிருந்து வந்த இச்சொல் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. ‘அவர்களில்’ என்பது ־הֶם-இன் தொடர்பைப் பேணுகிறது; எபிரெயத்தில் இவ்வசனத்தில் ‘ஆண்கள்’ என்பது வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה இஸ்ரவேலின் கோத்திரத்துக்குள் உள்ள குல அல்லது விரிவான குடும்பப் பிரிவைக் குறிக்கிறது. ‘குலங்களின்படி’ கணக்கெடுப்பின் வகைப்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: இரண்டாயிரத்து எழுநூற்று ஐம்பது
  rationale: எபிரெய எண்ணின் துல்லியமான மொத்தமான 2,750-ஐ நவீனத் தமிழின் இயல்பான சொல் வடிவில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்பு மொழிநடைக்கு ஏற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பேர்’ இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது; அது பாலினத்தைத் தனியாகக் குறிப்பிடுவதில்லை.
