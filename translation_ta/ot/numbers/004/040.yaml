translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கெடுப்புப் பட்டியலுக்குரிய முறையான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது பண்டைய இஸ்ரவேலின் வம்சவழிக் குடும்பப் பிரிவைத் தெளிவுபடுத்துகிறது.
