source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ פְּקֻ֣דֵי/הֶ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם אַלְפַּ֕יִם וְ/שֵׁ֥שׁ מֵא֖וֹת וּ/שְׁלֹשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: ta
  text: அவர்களில் கணக்கிடப்பட்டவர்கள், அவர்களுடைய குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும், இரண்டாயிரத்து அறுநூற்று முப்பது பேர் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணப்பட்டோர்,” “அவர்களுடைய பதிவெண்ணிக்கை,” அல்லது “அவர்களுடைய அணிவகுப்புக் கணக்கு.” எபிரெயச் சொல் மக்கள்தொகைக் கணக்கில் பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: … பேர்
  rationale: மக்கள்தொகைக் கணக்கின் மொத்த எண்ணிக்கையை இயல்பான தமிழில் தெரிவிக்க, எபிரெய வினை தனியே மொழிபெயர்க்கப்படாமல் எண்ணிக்கையுடன் ‘பேர்’ என அமைக்கப்பட்டுள்ளது.
- source_word: פְּקֻדֵיהֶם
  choice: அவர்களில் கணக்கெடுக்கப்பட்டவர்கள்
  rationale: פקד என்பதன் இச்சூழலிலுள்ள பொருள், கணக்கெடுப்பில் பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது; ‘அவர்களில்’ என்பது முந்தையதாகக் குறிப்பிடப்பட்ட குழுவிலிருந்து இவர்கள் கணக்கிடப்பட்டதைப் பேணுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இஸ்ரவேலரின் கணக்கெடுப்புச் சூழலில் உறவுமுறை அடிப்படையிலான உட்பிரிவைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: לְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: எபிரெயச் சொற்றொடரின் தந்தைவழி மரபு மற்றும் குடும்ப அமைப்பை நவீன வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: இரண்டாயிரத்து அறுநூற்று முப்பது
  rationale: எபிரெய மூலத்திலுள்ள எண்ணிக்கையைத் துல்லியமான, வழக்கமான தமிழில் தருகிறது.
