source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: ta
  text: அதன்மேல் தகாஷ் தோலால்[a] செய்யப்பட்ட ஒரு மூடியைப் போட வேண்டும். அதற்கு மேலே முழுவதும் நீலநிறமான ஒரு துணியை விரித்து, அதன் தண்டுகளை அவற்றுக்குரிய இடத்தில் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் תַּחַשׁ (தகாஷ்) எதைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. அது ஒரு குறிப்பிட்ட விலங்கின் தோலையோ, சிறப்பாகப் பதப்படுத்தப்பட்ட தோலையோ குறிக்கலாம்; வெள்ளாட்டுத் தோல், கடற்பசுத் தோல் போன்ற மொழிபெயர்ப்புகளும் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: அதன்மேல் ... போட வேண்டும்
  rationale: சடங்கு நடைமுறையை அறிவுறுத்தும் இந்த வினை வடிவத்தின் கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; עָלָיו என்பது பொருளின் மேல் மூடி இடப்படுவதைக் குறிக்கிறது.
- source_word: כְּסוּי
  choice: ஒரு மூடி
  rationale: ஒரு பொருளை மூடுவதற்கான உறையைச் சுட்டும் பெயர்ச்சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: עוֹר תַּחַשׁ
  choice: தகாஷ் தோல்
  rationale: תַּחַשׁ எந்த விலங்கை அல்லது எந்த வகைத் தோலைக் குறிக்கிறது என்பது உறுதியாகத் தெரியாததால், ஊகமான விலங்கியல் அடையாளத்தை முதன்மை உரையில் திணிக்காமல் எபிரெயச் சொல்லின் ஒலிபெயர்ப்பு பாதுகாக்கப்படுகிறது; குறிப்பு மாற்று விளக்கங்களைத் தருகிறது.
- source_word: וּפָרְשׂוּ
  choice: விரித்து
  rationale: துணியை ஒரு மேற்பரப்பின்மேல் விரிப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֶגֶד
  choice: ஒரு துணி
  rationale: இங்கு உடை அல்லாமல் மூடியின் மேல் விரிக்கப்படும் துணிப்படலமே சூழலுக்குப் பொருத்தமான பொருள்.
- source_word: כְּלִיל תְּכֵלֶת
  choice: முழுவதும் நீலநிறமான
  rationale: כְּלִיל தரும் முழுமையின் வலியுறுத்தலையும், תְּכֵלֶת குறிக்கும் திருக்கூடாரச் சாயநிறத்தையும் தெளிவான தமிழில் வழங்குகிறது.
- source_word: מִלְמָעְלָה
  choice: அதற்கு மேலே
  rationale: நீலத் துணி தோல் மூடியின் மேல்படலமாக விரிக்கப்படுவதை அடுக்குமுறைச் சூழலுக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: அதன் தண்டுகளை அவற்றுக்குரிய இடத்தில் வைக்க வேண்டும்
  rationale: בַּדָּיו என்பது உடன்படிக்கைப் பெட்டியைத் தூக்கும் தண்டுகளைக் குறிக்கிறது. எபிரெய வினையின் பொதுவான ‘வைத்தல்’ என்ற பொருளைப் பாதுகாத்து, அவற்றைச் செருகுதல் அல்லது மறுசீரமைத்தல் என்ற குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் மொழிபெயர்க்கிறது.
