  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: ta
  text: அவர்களுள் கணக்கெடுக்கப்பட்ட ஆண்களின் எண்ணிக்கை எட்டாயிரத்து ஐந்நூற்று எண்பது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களில் கணக்கெடுக்கப்பட்டவர்கள்” அல்லது “அவர்களுடைய கணக்கெடுக்கப்பட்டோர்.” எபிரெயச் சொல் கணக்கெடுப்பில் பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: மொத்தம்
  rationale: இங்கு היה வினைச்சொல் கணக்கெடுப்பின் இறுதி எண்ணிக்கையை அறிமுகப்படுத்துகிறது. தமிழில் ‘மொத்தம்’ என்பது அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פְּקֻדֵיהֶם
  choice: எண்ணப்பட்ட அவர்களுடைய ஆண்கள்
  rationale: פקד வேரிலிருந்து வரும் இச்சொல் கணக்கெடுப்பில் பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது. எண்ணாகமம் 4-ன் சூழலில் கூடாரப் பணிக்குத் தகுதிபெற்ற ஆண்களே கணக்கிடப்படுவதால், ‘ஆண்கள்’ என்பது பாலினத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וּשְׁמֹנִים
  choice: எட்டாயிரத்து ஐந்நூற்று எண்பது
  rationale: எபிரெய எண்ணிக்கைக் கூட்டமைப்பைத் தமிழின் இயல்பான எண்ணுருவில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிக்கும் கணக்கெடுப்பு மொழி
  choice: எண்ணப்பட்ட அவர்களுடைய ஆண்கள்
  alternative: அவர்களில் எண்ணப்பட்டவர்கள்
  rationale: உடனடி சூழல் குறிப்பிட்ட வயதுடைய லேவிய ஆண்களைக் கூடாரப் பணிக்காகக் கணக்கிடுகிறது. ஆகவே பாலினப் பொருளை மறைக்காமல் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கணக்கெடுப்பு நடையில் மொழிபெயர்க்கப்பட்டது. ‘மொத்தம்’ என்பதன் மூலம் எபிரெய வாக்கியத்தின் எண்ணிக்கைத் தொகை இயல்பாக வெளிப்படுத்தப்படுகிறது.
