source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: ta
  text: ஆனால் அவர்கள் உள்ளே சென்று பரிசுத்தப் பொருள்களை ஒரு கணம்கூடப் பார்க்கக் கூடாது[a]; இல்லையெனில் அவர்கள் இறந்துபோவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தப் பொருள்கள் மூடப்படும் வேளையில்.’ எபிரெய மரபுத்தொடர், அவற்றை ஒரு கணம் மட்டுமே பார்ப்பதையோ, அவை மூடப்படும் வேளையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... கூடாது
  rationale: இணைப்புச் சொல்லும் மறுப்பும் முந்தைய அறிவுறுத்தலை எச்சரிக்கையான தடையாகத் தொடர்கின்றன. தமிழில் ‘ஆனால்’ எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: יָבֹאוּ
  choice: உள்ளே சென்று
  rationale: இவ்வினைச்சொல் வருதல், செல்லுதல் அல்லது நுழைதல் எனப் பொருள்படும். சூழலில் கோகாத்தியர் உள்ளே நுழைவதற்கான தடை என்பதால் ‘உள்ளே சென்று’ இயல்பானது.
- source_word: לִרְאוֹת
  choice: பார்க்க
  rationale: ‘காண’ என்பதும் சாத்தியம்; இங்கு பரிசுத்தப் பொருள்கள் கண்களுக்கு வெளிப்படுவதைப் பார்ப்பதே எச்சரிக்கையின் மையம் என்பதால் ‘பார்க்க’ தெளிவாக உள்ளது.
- source_word: כְבַלַּע
  choice: ஒரு கணம்கூட
  rationale: இது கடினமான மரபுத்தொடர். மிகக் குறுகிய நேரத்தைக் குறிக்கலாம்; அல்லது பரிசுத்தப் பொருள்கள் மூடப்படும் வேளையைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான காலப் பொருள் தரப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶת הַקֹּדֶשׁ
  choice: பரிசுத்தப் பொருள்களை
  rationale: ஒருமை வடிவமாக இருந்தாலும், உடனடி சூழலில் கூடாரத்தின் பரிசுத்தமான உடைமைகளைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: וָמֵתוּ
  choice: பார்த்தால் அவர்கள் இறந்துபோவார்கள்
  rationale: தடையை மீறுவதன் விளைவைத் தெளிவான நிபந்தனை வடிவில் தெரிவிக்கிறது. மூலத்தின் மரண எச்சரிக்கை முழுமையாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הַקֹּדֶשׁ என்பதன் குறிப்பு
  choice: கூடாரத்திலுள்ள பரிசுத்தப் பொருள்களைத் தொகுப்பாகக் குறித்தல்
  alternative: பரிசுத்த இடம் அல்லது பொதுவான ‘பரிசுத்தமானது’
  rationale: எண்ணாகமம் 4-இன் உடனடி சூழல் கூடாரப் பொருள்களை மூடுதல் மற்றும் சுமத்தல் பற்றியது. ஆகவே இடத்தைக் காட்டும் பொருளைத் திணிக்காமல், பொருள்களைத் தொகுப்பாகக் குறிப்பிடுவது சூழலுக்கு ஏற்றது.
- issue: כְבַלַּע என்பதன் தெளிவற்ற பொருள்
  choice: ஒரு கணம்கூட
  alternative: பரிசுத்தப் பொருள்கள் மூடப்படும் வேளையில்
  rationale: எபிரெய மரபுத்தொடர் சுருக்கமான பார்வையையோ மூடும் செயலின் நேரத்தையோ குறிக்கக்கூடும். வாசிக்க இயல்பான முதன்மைப் பொருள் உரையில் தரப்பட்டு, உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தப் பொருள்கள்’ என்பது சூழலின் சடங்குசார் தன்மையைத் தக்கவைக்கிறது; கடினமான எபிரெய மரபுத்தொடரின் இரு சாத்தியங்களும் உரை மற்றும் அடிக்குறிப்பு வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
