id: NUM.4.41
reference: Numbers 4:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: ta
  text: கெர்சோனின் மகன்களின் குடும்பங்களைச் சேர்ந்த, சந்திப்புக் கூடாரத்தில் பணியாற்றிய அனைவருமே இவர்களே; யாவேயின் கட்டளைப்படி மோசேயும் ஆரோனும் அவர்களை எண்ணினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: எண்ணப்பட்டவர்கள் இவர்களே
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் முடிவைச் சுட்டும் சுருக்கக் கூற்றாக இயல்பான தமிழில் தருகிறது; אֵלֶּה என்பதன் சுட்டுப் பொருளையும் פְקוּדֵי என்பதன் ‘எண்ணப்பட்டோர்’ பொருளையும் காக்கிறது.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மகன்களுடைய குடும்பங்களில்
  rationale: எபிரெய உறவுமுறை அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது; ‘கெர்சோனியர் குலங்கள்’ என்று சுருக்கவில்லை.
- source_word: כָּל הָעֹבֵד
  choice: பணிசெய்த அனைவரும்
  rationale: சந்திப்புக் கூடாரத்தோடு தொடர்புடைய அதிகாரபூர்வ சேவையைச் சுட்டுகிறது. எபிரெய ஒருமைச் செய்பெயரின் கூட்டுப்பொருளைத் தமிழில் இயல்பாகப் பன்மையாக்குகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: מועד என்பதன் நிர்ணயிக்கப்பட்ட சந்திப்பு என்ற கருத்தையும், கூடாரத்தின் பரிசுத்தத் தலப் பெயரையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும் இவர்களை எண்ணினார்கள்
  rationale: தொடர்புப்பெயர் வாக்கியத்தைத் தமிழில் தெளிவான தனி வாக்கியமாக்கி, פקד என்ற வேரின் கணக்கெடுப்பு சார்ந்த பொருளை மீண்டும் காக்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: ‘யாவேயின் வாயின்படி’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ஆணையின் தெய்வீக மூலத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், எபிரெய உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக இருப்பதால் அதனைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: கூடாரப் பணியின் தன்மை
  choice: பணிசெய்த
  alternative: ஆராதனை செய்த
  rationale: עבד இங்கு லேவியரின் நியமிக்கப்பட்ட சேவையைப் பரந்த பொருளில் குறிக்கிறது; ‘ஆராதனை’ என்று மட்டும் தருவது பணியின் நடைமுறை அம்சங்களைத் தேவையின்றி குறுக்கும்.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை. பட்டியல் சார்ந்த நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; பொருள் உறவுகள் அனைத்தும் பாதுகாக்கப்பட்டன.
