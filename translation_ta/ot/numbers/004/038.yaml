lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: கணக்கிடப்பட்டவர்கள்
  rationale: פקד என்ற சொல்லின் இச்சூழலிலுள்ள கணக்கெடுப்பு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; அடுத்த வசனத்துடன் தொடரும் தலைப்புத் தன்மையையும் காக்கிறது.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மக்களில்
  rationale: வம்சத்தாரைக் குறிக்கும் எபிரெய மரபுச் சொல்லைத் தமிழில் இயல்பாக வழங்குகிறது; 'மக்களில்' என்பது தொடர்ந்து வரும் கணக்கிடப்பட்ட குழுவுடன் இணைகிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பதை இங்கு வம்சக் கிளைகளாகிய 'குலங்கள்' என்று வேறுபடுத்திக் காட்டுகிறது.
- source_word: וּלְבֵית אֲבֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵּית אָבוֹת என்ற தந்தை மரபை அடிப்படையாகக் கொண்ட குடும்ப அலகைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
