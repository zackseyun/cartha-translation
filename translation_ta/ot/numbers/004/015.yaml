  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: ta
  text: ஆரோனும் அவன் மகன்களும் பரிசுத்தப் பொருட்களையும் பரிசுத்தச் சேவையின் எல்லாக் கருவிகளையும் மூடி முடித்த பின்பு, முகாம் புறப்படும்போது, கேகாத்தின் மகன்கள் அவற்றைச் சுமப்பதற்காக வருவார்கள். ஆனால் அவர்கள் பரிசுத்தமானவற்றைத் தொடக்கூடாது[a]; இல்லையெனில் அவர்கள் இறப்பார்கள்[b]. சந்திப்புக்கூடாரத்தில் கேகாத்தின் மகன்கள் சுமக்கவேண்டிய சுமை இவையே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் பரிசுத்த இடத்தைத் தொடக்கூடாது.” எபிரெய மொழியிலுள்ள “பரிசுத்தமானது” என்ற சொல் பரிசுத்தப் பொருட்களை மொத்தமாகவோ, இன்னும் விரிவாகப் பரிசுத்த இடத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயம் விளைவை நேரடியாக, “அவர்கள் இறப்பார்கள்” என்று கூறுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “கேகாத்தின் மகன்கள்” என்பதற்குப் பதிலாக “கேகாத்தியர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: மூடி முடித்த பின்பு
  rationale: כִּלָּה உடன் வரும் பெயரெச்ச வினைச்சொல் செயல் முழுமையடைதலைக் குறிக்கிறது; தமிழில் இயல்பான காலத் தொடராக வழங்கப்பட்டது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: முதல் இடத்தில் பரிசுத்தப் பகுதி அல்லது பரிசுத்த அமைப்பைக் குறிக்கும் விரிவான சொல்லாக உள்ளது; அடுத்ததாக அதன் பொருட்கள் தனியே குறிப்பிடப்படுவதால் ‘பரிசுத்த இடம்’ தெளிவாக உள்ளது.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் எல்லாப் பொருட்களும்
  rationale: כְּלֵי என்பது பாத்திரங்கள், கருவிகள், அலங்காரப் பொருட்கள் ஆகியவற்றை உள்ளடக்கும்; ‘பொருட்கள்’ நவீன தமிழில் இயல்பான விரிவுச் சொல்.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: முகாம் புறப்படும்போது
  rationale: முகாம் பயணத்தைத் தொடங்கும் நேரத்தைக் குறிக்கும் எபிரெய கால அமைப்பு நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי קְהָת
  choice: கேகாத்தின் மகன்கள்
  rationale: மூலத்தின் நேரடியான குலவழிச் சொல்லாக்கம் பாதுகாக்கப்பட்டது; ‘கேகாத்தியர்’ என்பது மாற்று இயல்பான வடிவம்.
- source_word: לָשֵׂאת
  choice: அவற்றைச் சுமப்பதற்காக
  rationale: சுமந்து எடுத்துச் செல்லும் பணியைச் சுட்டுகிறது; ‘அவற்றை’ என்பது முன் குறிப்பிடப்பட்ட மூடப்பட்ட பரிசுத்தப் பொருட்களிலிருந்து பெறப்படுகிறது.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: அவர்கள் பரிசுத்தமானவற்றைத் தொடக்கூடாது
  rationale: உடனடிச் சூழல் எடுத்துச் செல்லப்படும் பரிசுத்தப் பொருட்களைப் பற்றியது; இருப்பினும் הַקֹּדֶשׁ என்பதன் விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וָמֵתוּ
  choice: தொட்டால் அவர்கள் இறந்துபோவார்கள்
  rationale: எபிரெயம் விளைவை நேரடியாக ‘அவர்கள் இறப்பார்கள்’ என்று கூறுகிறது; தமிழில் தடை–விளைவு உறவைத் தெளிவாக்க ‘தொட்டால்’ சேர்க்கப்பட்டது.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: கேகாத்தின் மகன்கள் சுமக்கவேண்டிய சுமை இவையே
  rationale: מַשָּׂא என்பதன் உறுதியான ‘சுமை’ பொருளையும் அவர்களின் சுமக்கும் பொறுப்பையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: בְּ என்பதன் முதன்மையான இடவியல் பொருள் பாதுகாக்கப்பட்டது; אֹהֶל מוֹעֵד என்பதற்கு பொதுவாகப் புரியும் கண்ணியமான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: தடை வாக்கியத்தில் הַקֹּדֶשׁ என்பதன் குறிப்பு
  choice: பரிசுத்தமானவை, அதாவது எடுத்துச் செல்லப்படும் பரிசுத்தப் பொருட்கள்
  alternative: பரிசுத்த இடம் அல்லது பரிசுத்த அமைப்பு
  rationale: உடனடிச் சூழல் மூடப்பட்ட பொருட்களைச் சுமப்பதைப் பற்றியதால் பொருட்களே முதன்மை வாசிப்பு. ஆனால் எபிரெயச் சொல் பரந்த பொருளையும் அனுமதிப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டது.
- issue: וָמֵתוּ கூறும் மரண விளைவின் வலிமை
  choice: தொட்டால் அவர்கள் இறந்துபோவார்கள்
  alternative: அவர்கள் இறந்துவிடாதபடி / அவர்கள் சாகாதபடி
  rationale: மூலம் விளைவை நேரடியாக இணைக்கிறது; எச்சரிக்கை நோக்கம் இருந்தாலும் அதனை வெறும் நோக்கவாக்கியமாக மென்மைப்படுத்தாமல் நேரடி விளைவாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த’, ‘சந்திப்புக் கூடாரம்’, ‘சுமை’ போன்ற வழிபாட்டுச் சூழலுக்கேற்ற சொற்கள் வைக்கப்பட்டுள்ளன; மூல எபிரெயத்தின் தெளிவின்மை தேவையான இடத்தில் அடிக்குறிப்பால் பாதுகாக்கப்பட்டுள்ளது.
