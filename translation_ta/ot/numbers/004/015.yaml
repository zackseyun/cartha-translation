revisions:
- from: ஆரோனும் அவன் மகன்களும் பரிசுத்த இடத்தையும் பரிசுத்த இடத்தின் எல்லாப் பொருட்களையும் மூடி முடித்த பின்பு, முகாம் புறப்படும்போது, கேகாத்தின் மகன்கள் அவற்றைச் சுமப்பதற்காக வரவேண்டும். ஆனால் அவர்கள் பரிசுத்தமானவற்றைத் தொடக்கூடாது[a]; தொட்டால் அவர்கள் இறந்துபோவார்கள்[b]. சந்திப்புக் கூடாரத்தில் கேகாத்தின் மகன்கள் சுமக்கவேண்டிய சுமை இவையே[c].
  to: ஆரோனும் அவன் மகன்களும் பரிசுத்தப் பொருட்களையும் பரிசுத்தச் சேவையின் எல்லாக் கருவிகளையும் மூடி முடித்த பின்பு, முகாம் புறப்படும்போது, கேகாத்தின் மகன்கள் அவற்றைச் சுமப்பதற்காக வருவார்கள். ஆனால் அவர்கள் பரிசுத்தமானவற்றைத் தொடக்கூடாது[a]; இல்லையெனில் அவர்கள் இறப்பார்கள்[b]. சந்திப்புக்கூடாரத்தில் கேகாத்தின் மகன்கள் சுமக்கவேண்டிய சுமை இவையே[c].
  rationale: The revision renders the first הַקֹּדֶשׁ as sacred objects in keeping with the handling and transport context, while preserving the broader sanctuary reading where the Hebrew permits it through the existing anchored footnote. It also makes the procedural future and the direct death consequence more closely reflect the Hebrew without sacrificing natural Tamil.
