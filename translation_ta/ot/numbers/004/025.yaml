revisions:
- from: அவர்கள் திருவாசஸ்தலத்தின் திரைத் துணிகளையும், சந்திப்புக் கூடாரத்தையும் அதன் மூடுதிரையையும், அதன்மேல் மேலாக இருக்கும் தகசுத் தோல் மூடுதிரையையும்[a], சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கான திரையையும் சுமந்து செல்ல வேண்டும்.
  to: அவர்கள் வாசஸ்தலத்தின் திரைத் துணிகளையும், சந்திப்புக் கூடாரத்தையும், அதன் மூடியையும், அதன் மேலாக இருக்கும் தகசுத் தோல் மூடியையும்[a], சந்திப்புக் கூடாரத்தின் நுழைவாயில் திரையையும் சுமந்து செல்ல வேண்டும்.
  rationale: The revision distinguishes the general coverings («மூடி») from the entrance screen («திரை»), removes the added qualifier in the rendering of מִשְׁכָּן, and makes the upper-position phrase idiomatic without losing its meaning. The transliterated «தகசு» and a broadened footnote preserve the lexical uncertainty.
