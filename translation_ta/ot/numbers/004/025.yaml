base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: ta
  text: அவர்கள் வாசஸ்தலத்தின் திரைத் துணிகளையும், சந்திப்புக் கூடாரத்தையும், அதன் மூடியையும், அதன் மேலாக இருக்கும் தகசுத் தோல் மூடியையும்[a], சந்திப்புக் கூடாரத்தின் நுழைவாயில் திரையையும் சுமந்து செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகசு” எனும் எபிரெயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை. இது ஒரு வகை விலங்குத் தோலையோ வேறு பொருளையோ குறிக்கலாம்; சில மொழிபெயர்ப்புகள் இதை ஒலிபெயர்ப்பாகவே வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: சுமந்து செல்ல வேண்டும்
  rationale: பயணத்தின்போது பரிசுத்தக் கூடாரப் பொருட்களைத் தூக்கிச் செல்வதைக் குறிக்கும்; நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின் திரைத் துணிகள்
  rationale: יְרִיעֹת என்பது துணியாலான விரிப்புகள் அல்லது திரைப் பகுதிகள்; מִשְׁכָּן என்பது கடவுள் வாசம்செய்யும் பரிசுத்த அமைப்பைக் குறிப்பதால் ‘திருவாசஸ்தலம்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: கூடாரத்தின் உடல் வடிவத்தையும் சந்திப்பு நிகழும் அதன் செயலையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: מִכְסֵהוּ
  choice: அதன் மூடுதிரை
  rationale: ஒருமை ஆண்பால் பின்னொட்டு சந்திப்புக் கூடாரத்தைக் குறிக்கிறது; அடுத்ததாக வேறொரு மேலடுக்கு கூறப்படுவதால் இதை மிகைப்படுத்தாமல் பொதுவான மூடுதிரையாக மொழிபெயர்க்கிறது.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: தகசுத் தோல் மூடுதிரை
  rationale: תַּחַשׁ குறிக்கும் விலங்கு அல்லது பொருள் உறுதியாக அறியப்படாததால், ஒரு குறிப்பிட்ட விலங்கையோ தோலின் தரத்தையோ ஊகிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: அதன்மேல் மேலாக இருக்கும்
  rationale: இந்த மூடுதிரை மற்ற அடுக்குகளுக்கு மேலிருப்பதை எபிரெய உரையின் வலியுறுத்தலுடன் காக்கிறது.
- source_word: מָסַךְ פֶּתַח
  choice: நுழைவாயிலுக்கான திரை
  rationale: מָסָךְ என்பது நுழைவிடத்தை மறைக்கும் தொங்குதிரை; தமிழில் அதன் பயன்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
