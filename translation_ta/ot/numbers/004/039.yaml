translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. இது முந்தைய வசனத்திலிருந்து தொடரும் கணக்கெடுப்புப் பட்டியலின் ஒரு துணைத்தொடர் என்பதால், மூலத்தில் உள்ள முடிவுறாத தொடரை நீள்கோடு காக்கிறது.
