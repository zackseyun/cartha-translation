  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: ta
  text: முப்பது வயதுமுதல் ஐம்பது வயதுவரை, சேவைப் பணிக்கு வந்து, சந்திப்புக் கூடாரத்தில் வேலை செய்கிற ஒவ்வொருவரும்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திப்புக் கூடாரத்தில் வேலை செய்யும் கடமைக்கு வருகிற ஒவ்வொருவரும்.”
    reason: כָּל הַבָּא לַצָּבָא לַעֲבֹדָה என்பதை ‘கடமைக்கு வருகிற’ என்றும் மொழிபெயர்க்கலாம். இது בוא என்பதன் ‘வருதல்’ பொருளையும் צבא என்பதன் நியமிக்கப்பட்ட சேவை/கடமைப் பொருளையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: முப்பது வயதுமுதல்
  rationale: எபிரேய வயது மரபுத்தொடர் குறைந்தபட்ச வயதைக் குறிக்கிறது. நவீனத் தமிழில் ‘முப்பது வயதுமுதல்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ஐம்பது வயதுவரை
  rationale: வயது வரம்பின் மேல் எல்லையைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כָּל הַבָּא
  choice: சேருகிற ஒவ்வொருவரும்
  rationale: בוא என்ற வினையின் பங்கேற்பு வடிவம் ‘வருகிறவர்/நுழைகிறவர்’ எனப் பொருள்படும். இங்கு கணக்கெடுப்புக்கும் நியமிக்கப்பட்ட பணிக்கும் உரிய சூழலில் ‘சேருகிற’ என்பது அந்தப் பணியில் இணைவதை இயல்பாகக் காட்டுகிறது.
- source_word: לַצָּבָא
  choice: பணியில்
  rationale: צבא பொதுவாகப் படை அல்லது அணியைக் குறிக்கலாம்; ஆனால் எண்ணாகமம் 4-ல் இது லேவியர்களின் ஒழுங்கமைக்கப்பட்ட பணிக்கடமையைக் குறிக்கிறது. ‘பணியில்’ என்பது தேவையற்ற இராணுவப் பொருளைத் தவிர்க்கிறது.
- source_word: לַעֲבֹדָה
  choice: வேலை செய்வதற்கான
  rationale: עֲבֹדָה உழைப்பு அல்லது சேவையைக் குறிக்கிறது. ‘வேலை செய்வதற்கான’ என்பது இதை முந்தைய צבא என்பதிலிருந்து வேறுபடுத்தி, இரு சொற்களையும் ஒரே தமிழ்ச் சொல்லாகத் தட்டையாக்காமல் காக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: מוֹעֵד என்பதிலுள்ள நியமிக்கப்பட்ட சந்திப்பு என்ற கருத்தைப் பாதுகாக்கும் தெளிவான, இயல்பான தமிழாக்கம்; בְּ என்ற முன்னொட்டையும் ‘-த்தில்’ பிரதிபலிக்கிறது.
