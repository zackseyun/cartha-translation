revisions:
- from: முப்பது வயதுமுதல் ஐம்பது வயதுவரை, சந்திப்புக் கூடாரத்தில் வேலை செய்வதற்கான பணியில் சேருகிற ஒவ்வொருவரும்—[a]
  to: முப்பது வயதுமுதல் ஐம்பது வயதுவரை, சேவைப் பணிக்கு வந்து, சந்திப்புக் கூடாரத்தில் வேலை செய்கிற ஒவ்வொருவரும்—[a]
  rationale: The revision replaces the added enrollment nuance of ‘சேருகிற’ with ‘வந்து,’ directly reflecting בוא. It also renders the service-and-work sequence explicitly as ‘சேவைப் பணிக்கு வந்து, ... வேலை செய்கிற,’ preserving the distinction between צבא and עֲבֹדָה in idiomatic modern Tamil. The footnote marker is placed after the clause addressed by the alternative.
