source:
  edition: WLC
  text: אַל תַּכְרִ֕יתוּ אֶת שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י מִ/תּ֖וֹךְ הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: ta
  text: லேவியர்களின் நடுவிலிருந்து கோகாத்தியக் குடும்பங்களின் குலம் அழிந்துபோகச் செய்யாதீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லேவியர்களின் நடுவிலிருந்து கோகாத்தியக் குடும்பங்களின் குலத்தை அழித்துவிடாதீர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் “அழிந்துபோகச் செய்” அல்லது “அழித்துவிடு” என்று பொருள்படலாம்; “குடும்பங்கள்” என்பதை “குலங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: செய்யாதீர்கள்
  rationale: தடை விதிக்கும் எபிரெய எதிர்மறைத் துகளை, நவீனத் தமிழில் தெளிவான பன்மை கட்டளை வடிவில் தருகிறது.
- source_word: תַּכְרִיתוּ
  choice: அற்றுப்போகச் செய்யாதீர்கள்
  rationale: כרת என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைக்கிறது; ஒரு குழுவை முற்றிலும் நீக்குவது அல்லது அழியச் செய்வது என்ற பரந்த பொருளையும், சூழலில் அவர்களது இழப்புக்குக் காரணமாகாதீர்கள் என்ற எச்சரிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: שֵׁבֶט
  choice: கோத்திரம்
  rationale: வம்சவழிக் குழுவைக் குறிக்கும் சொல்லாக இச்சூழலில் பொருந்துகிறது; குடும்பக் குழுக்களால் அமைந்த பெரிய உட்பிரிவைக் காட்டுகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குடும்பங்கள்
  rationale: பன்மை இணைப்புநிலையை நேரடியாகக் காட்டுகிறது; ‘குலங்கள்’ என்பதும் சாத்தியமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַקְּהָתִי
  choice: கோகாத்திய
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் வடிவமாக இருந்தாலும், அடுத்துள்ள ‘குடும்பங்கள்’ என்பதுடன் சேர்ந்து கோகாத்தின் வம்சத்தாரைக் கூட்டாகக் குறிக்கிறது.
- source_word: מִתּוֹךְ
  choice: நடுவிலிருந்து
  rationale: ஒரு பெரிய குழுவின் உள்ளிருந்து பிரிக்கப்படுதல் அல்லது நீக்கப்படுதல் என்ற உறவுப் பொருளைத் தக்கவைக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவியின் வம்சத்தாருக்கான வழக்கமான தமிழ்ப் பெயர்; கோகாத்தியர்கள் அவர்களுக்குள் உள்ள ஒரு பிரிவு என்பதைச் சூழல் காட்டுகிறது.
theological_decisions:
- issue: கோகாத்தியர்களுக்கு நேரக்கூடிய முடிவைப் பற்றிய தடையின் தன்மை
  choice: கோகாத்தியக் குடும்பங்களின் கோத்திரம் லேவியர்களின் நடுவிலிருந்து அற்றுப்போகக் காரணமாகாதீர்கள் என்ற பரந்த எச்சரிக்கை
  alternative: கோகாத்தியக் குலத்தை அழித்துவிடாதீர்கள் என்ற பொதுவான கட்டளை
  rationale: இந்த வசனம் எந்தச் செயல்முறையால் அவர்கள் அற்றுப்போவார்கள் என்பதைத் தனியாகக் கூறவில்லை; பரிசுத்த பொருட்களைத் தவறாக அணுகுவதால் மரணம் ஏற்படலாம் என்பதை விரிவான சூழல் விளக்குகிறது. ஆகவே அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், காரணவினையையும் பொருளின் பரப்பையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம்’ என்பது வம்சவழிப் பெரிய குழுவையும், ‘குடும்பங்கள்’ அதன் உட்பிரிவுகளையும் வேறுபடுத்துகிறது. எபிரெய காரணவினையின் வலிமையையும் வசனத்தின் தீர்க்கப்படாத பரப்பையும் ‘அற்றுப்போகச் செய்யாதீர்கள்’ தக்கவைக்கிறது.
