revisions:
- from: லேவியர்களின் நடுவிலிருந்து கோகாத்தியக் குடும்பங்களின் கோத்திரத்தை அற்றுப்போகச் செய்யாதீர்கள்[a].
  to: லேவியர்களின் நடுவிலிருந்து கோகாத்தியக் குடும்பங்களின் குலம் அழிந்துபோகச் செய்யாதீர்கள்[a].
  rationale: The revision preserves the Hebrew prohibition and Hiphil causative force, including the intentionally broad sense of causing the Kohathite group to be cut off from among the Levites. It improves modern Tamil idiom and uses ‘குலம்’ for the group/clan sense of שֵׁבֶט without importing an explanation from the wider context.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the prohibitive force, the causative sense of תַּכְרִיתוּ, and the separation ‘from among the Levites.’ However, ‘கோத்திரம்’ is less suitable here and may evoke a Tamil social lineage category rather than the Kohathite clan/group denoted by the Hebrew construct.
  naturalness: ‘கோகாத்தியக் குடும்பங்களின் கோத்திரத்தை’ is structurally literal but somewhat stiff in modern standard Tamil. ‘குலத்தை’ is clearer and more natural in this genealogical context. ‘அழிந்துபோகச் செய்யாதீர்கள்’ expresses the causative warning idiomatically without specifying a mechanism.
  terminology: Use ‘குலம்’ for שֵׁבֶט in this context, while retaining ‘குடும்பங்கள்’ for מִשְׁפְּחֹת. The established form ‘கோகாத்திய’ and ‘லேவியர்கள்’ may remain.
  issues:
  - severity: medium
    issue: ‘கோத்திரம்’ for שֵׁבֶט
    rationale: Although it can denote lineage, in modern Tamil ‘கோத்திரம்’ can carry narrower social/gotra associations. ‘குலம்’ better conveys the collective Kohathite clan here and avoids an unnecessary register ambiguity.
  - severity: low
    issue: Main-text wording is overly literal and slightly awkward
    rationale: Replacing ‘அற்றுப்போகச்’ with ‘அழிந்துபோகச்’ yields a more idiomatic causative expression while preserving the broad warning not to cause the group’s removal or destruction.
  revised_text: லேவியர்களின் நடுவிலிருந்து கோகாத்தியக் குடும்பங்களின் குலம் அழிந்துபோகச் செய்யாதீர்கள்[a].
