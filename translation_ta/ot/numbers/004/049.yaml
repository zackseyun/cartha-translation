base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: ta
  text: யாவேயின் கட்டளைப்படி[a], மோசேயின் மூலமாக[b] அவர்கள், ஒவ்வொருவனும் தன் பணிக்கும் தன் சுமைக்கும் ஏற்ப, கணக்கிடப்பட்டார்கள்; அவனவனுடைய பொறுப்பு[c] யாவே மோசேக்குக் கட்டளையிட்டபடியே இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “யாவேயின் வாயின்படி.”
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “மோசேயின் கையால்.”
    reason: lexical_alternative
  - marker: c
    text: இதற்கான எபிரெயச் சொல் “நியமனம்,” “மேற்பார்வை” அல்லது “ஒப்படைக்கப்பட்ட கடமை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: யெகோவாவின் கட்டளைப்படி
  rationale: “யெகோவாவின் வாயின்படி” என்ற சொல்லடியான எபிரெய மரபுத்தொடர், இச்சூழலில் அவருடைய கட்டளைக்கு ஏற்ப என்பதைக் குறிக்கிறது.
- source_word: פָּקַד אֹתָם
  choice: அவர்கள் கணக்கிடப்பட்டார்கள்
  rationale: פקד என்பதற்குப் பல பொருள்கள் இருந்தாலும், லேவியர்களைக் கணக்கெடுத்து அவர்களுக்குரிய பணிகளைப் பதிவு செய்யும் எண்ணாகமம் 4-ன் உடனடிச் சூழலில் “கணக்கிடப்பட்டார்கள்” என்பது பொருத்தமானது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: “மோசேயின் கையால்” என்ற எபிரெய மரபுத்தொடர், மோசே வழியாகச் செயல் நிறைவேற்றப்பட்டதைக் குறிக்கிறது; இயல்பான நவீன தமிழுக்காக “மூலமாக” பயன்படுத்தப்பட்டது.
- source_word: אִישׁ אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: சொல்லின் இரட்டிப்பு ஒவ்வோர் ஆணையும் தனித்தனியாகக் குறிப்பிடும் பகிர்வுப் பொருளை வலியுறுத்துகிறது.
- source_word: עַל עֲבֹדָתוֹ
  choice: அவனுடைய பணிக்கு ஏற்ப
  rationale: עֲבֹדָה இங்கு திருக்கூடாரத்துடன் தொடர்புடைய ஒப்படைக்கப்பட்ட சேவை அல்லது பணியைக் குறிக்கிறது.
- source_word: וְעַל מַשָּׂאוֹ
  choice: அவன் சுமக்க வேண்டிய சுமைக்கு ஏற்ப
  rationale: מַשָּׂא என்பது திருக்கூடாரப் பொருட்களை எடுத்துச் செல்லும்போது சுமக்க வேண்டிய சுமையைக் குறிக்கிறது; தமிழில் அதன் நடைமுறைப் பொருள் தெளிவாக்கப்பட்டது.
- source_word: וּפְקֻדָיו
  choice: அவனவனுடைய பொறுப்பும்
  rationale: פקד என்ற வேரிலிருந்து வரும் இக்கடினமான வடிவம், இச்சூழலில் ஒவ்வொருவருக்கும் நியமிக்கப்பட்ட பொறுப்பு அல்லது ஒப்படைக்கப்பட்ட கடமை எனப் புரிந்துகொள்ளப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே இருந்தது
  rationale: சார்பு வாக்கியம், முந்திய பொறுப்பு அல்லது ஏற்பாடு மோசேக்குக் கொடுக்கப்பட்ட தெய்வீகக் கட்டளைக்கு இணங்க இருந்ததைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் நிலைபெற்ற “யெகோவா” என்ற ஒலிபெயர்ப்பால் வழங்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், ஒரு பட்டப்பெயரான “கர்த்தர்” என்பதற்குப் பதிலாகப் பெயரின் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: וּפְקֻדָיו என்பதன் தெளிவற்ற பொருள்
  choice: அவனவனுடைய பொறுப்பு
  alternative: அவனுடைய நியமனம் / மேற்பார்வை / கணக்கிடப்பட்டவர்கள்
  rationale: ஒவ்வொருவரின் பணியும் சுமையும் பற்றிய உடனடிச் சூழல் “பொறுப்பு” என்பதை ஆதரிக்கிறது; எனினும் எபிரெய வடிவத்தின் உண்மையான சொல்லியல் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “ஒவ்வொருவனும்” என்பது மூலத்தின் ஆண்பால் ஒருமையையும் பகிர்வுப் பொருளையும் காக்கிறது. எபிரெய மரபுத்தொடர்கள் முதன்மை உரையில் இயல்பாக வழங்கப்பட்டு, அவற்றின் சொல்லடியான வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
