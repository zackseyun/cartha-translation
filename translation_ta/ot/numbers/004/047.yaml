translation_notes:
  register: நவீன தரத் தமிழில் இயல்பானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் எபிரெயத்தில் முந்தைய வசனத்துடன் இலக்கணத் தொடர்புடைய பெயர்த்தொடராக அமைவதால், தமிழிலும் தனி முற்றுவினை சேர்க்காமல் ‘ஒவ்வொருவரும்’ என்று முடிக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் பணிச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
