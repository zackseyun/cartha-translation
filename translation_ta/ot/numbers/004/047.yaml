  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּ֗א לַ/עֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַ/עֲבֹדַ֥ת מַשָּׂ֖א בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: ta
  text: முப்பது வயதுமுதல் ஐம்பது வயதுவரை, சந்திப்புக் கூடாரத்தில் சேவைப் பணியையும் சுமைகளைச் சுமக்கும் பணியையும்[a] செய்வதற்கு வருகிற ஒவ்வொருவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிக்கான பணியையும் சுமைகளைச் சுமக்கும் பணியையும்.” வலியுறுத்துவதற்காகவோ பணிவகைகளை வேறுபடுத்திக் காட்டுவதற்காகவோ, எபிரெய மூலத்தில் தொடர்புடைய பெயர்ச்சொல் வடிவங்கள் மீண்டும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: முப்பது வயதுமுதல் ஐம்பது வயதுவரை
  rationale: கீழ் மற்றும் மேல் வயது வரம்புகளைத் தெளிவான, இயல்பான நவீன தமிழில் தருகிறது; וָמַעְלָה என்பதன் கருத்து ‘முதல்’ என்பதிலும் וְעַד என்பதன் கருத்து ‘வரை’ என்பதிலும் வெளிப்படுகிறது.
- source_word: כָּל הַבָּא
  choice: வருகிற ஒவ்வொருவரும்
  rationale: בוא என்பதன் நிகழ்காலப் பங்கேற்பு வடிவத்தையும், கடமைக்காக முன்வருகிற ஒவ்வொருவரையும் குறிக்கும் அதன் பொதுமைப்படுத்தும் தன்மையையும் காக்கிறது.
- source_word: לַעֲבֹד
  choice: செய்வதற்கு
  rationale: வருவதன் நோக்கத்தை நேரடியாகக் காட்டுகிறது; அடுத்து வரும் עֲבֹדָה என்ற பெயர்ச்சொல்லை ‘வேலை’ என்று தனியாக மொழிபெயர்க்க இடமளிக்கிறது.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: பணிவேலை
  rationale: ஒரே வேரைச் சேர்ந்த சொற்கள் மீளும் எபிரெயக் கட்டமைப்பை தமிழில் இயல்பாகச் சுருக்கி, சாதாரண வேலை அல்லாமல் நியமிக்கப்பட்ட சேவையைக் குறிக்கிறது.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: சுமை சுமக்கும் வேலை
  rationale: מַשָּׂא என்பதன் உறுதியான ‘சுமை/தூக்கிச் செல்லப்படுவது’ என்ற பொருளை வெளிப்படையாகக் காக்கிறது; வெறும் பொதுவான போக்குவரத்து என்று விளக்கிவிடவில்லை.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இஸ்ரவேலின் வழிபாட்டுக் கூடாரத்திற்கான நிலையான பெயரைப் பயன்படுத்தி, בְּ என்ற முன்னிடைச்சொல்லின் இடம் அல்லது பணித்தளப் பொருளையும் தருகிறது.
