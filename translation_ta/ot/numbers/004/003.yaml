  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: ta
  text: முப்பது வயதுமுதல் ஐம்பது வயதுவரை உள்ள, சந்திப்புக் கூடாரத்தில் பணியைச் செய்வதற்காகச் சேவைக்கு[b] வரும்[a] ஒவ்வொருவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “கடமைக்காக வரும் ஒவ்வொருவரும்.” “வரும்” என்பதற்கான எபிரெயச் சொல் “நுழையும்” என்றும் மொழிபெயர்க்கப்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: “சேவை” என்பதற்கான எபிரெயச் சொல் “கடமை,” “பணிக்குழு,” அல்லது “படை” என்றும் பொருள்படலாம். இங்கு அது லேவியரின் ஒழுங்கமைக்கப்பட்ட பணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: முப்பது வயதுமுதல்
  rationale: בֶּן + எண் + שָׁנָה என்பது வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். וָמַעְלָה கீழ் வயது வரம்பை உள்ளடக்கி அதற்கு மேற்பட்டோரைக் குறிக்கிறது; தமிழில் ‘முப்பது வயதுமுதல்’ இயல்பாக உள்ளது.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ஐம்பது வயதுவரை
  rationale: மேல் வயது வரம்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: כָּל בָּא
  choice: சேரும் ஒவ்வொருவரையும்
  rationale: בָּא என்ற பங்கேற்புவினை ‘வருகிற/நுழைகிற’ எனப் பொருள்படும்; இச்சூழலில் ஒழுங்கமைக்கப்பட்ட பணியில் பங்கேற்க வருவதைத் தமிழில் ‘சேரும்’ என இயல்பாகத் தருகிறது.
- source_word: לַצָּבָא
  choice: சேவையில்
  rationale: צָבָא படை, அணிவகுப்பு, கடமை அல்லது ஒழுங்கமைக்கப்பட்ட சேவை எனப் பொருள்படலாம். இங்கு லேவியரின் ஒழுங்கமைக்கப்பட்ட திருப்பணியே குறிக்கப்படுவதால் ‘சேவை’ பொருத்தமானது.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: பணிசெய்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் לַעֲשׂוֹת மற்றும் செயற்பாட்டைக் குறிக்கும் מְלָאכָה ஆகியவற்றைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதன் கூறுசார் பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: צָבָא என்பதன் இராணுவ அல்லது வழிபாட்டுப் பணிசார் நுணுக்கம்
  choice: சேவை
  alternative: படை / கடமை / பணிக்குழு
  rationale: எண்ணாகமம் 4-ன் சூழல் போர் அல்ல; லேவியருக்கு ஒதுக்கப்பட்ட ஒழுங்கமைக்கப்பட்ட கூடாரப் பணியாகும். ‘சேவை’ இந்தச் சூழலைக் காட்டுகிறது; எனினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. முந்தைய வசனத்தில் தொடங்கிய கணக்கெடுப்பு கட்டளையை இவ்வசனம் நிறைவு செய்வதால், எபிரெயத்தில் வெளிப்படையாக மீண்டும் வராத கட்டளை வினை தமிழில் ‘கணக்கிடுங்கள்’ எனச் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
