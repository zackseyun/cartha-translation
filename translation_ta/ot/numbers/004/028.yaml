base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: ta
  text: இதுவே சந்திப்புக் கூடாரத்தில் கெர்சோனியரின் மகன்களின் குடும்பங்கள் செய்ய வேண்டிய பணி; அவர்களுடைய பொறுப்பு ஆசாரியனாகிய ஆரோனின் மகன் இத்தாமாரின் மேற்பார்வையில் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “இத்தாமாரின் கையில்”; இது அவருடைய மேற்பார்வை அல்லது அதிகாரத்தின்கீழ் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: இதுவே ... செய்ய வேண்டிய பணி
  rationale: எபிரெய அடையாளப்படுத்தும் வாக்கியத்தின் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது; עֲבֹדָה என்பதைக் கூடாரத்துக்குரிய நியமிக்கப்பட்ட பணியாக எடுத்துரைக்கிறது.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியரின் மகன்களுடைய குடும்பங்கள்
  rationale: வம்சவழியைக் குறிக்கும் ‘மகன்கள்’ என்ற எபிரெய அமைப்பையும், குடும்பக் குழுக்களைக் குறிக்கும் பன்மையையும் காக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: מוֹעֵד என்பது சந்தித்தல் அல்லது நியமிக்கப்பட்ட சந்திப்பைக் குறிக்கிறது; ‘சந்திப்புக் கூடாரம்’ தெளிவான, நேரடியான தமிழாக்கம்.
- source_word: וּמִשְׁמַרְתָּם
  choice: அவர்களுடைய பொறுப்பு
  rationale: நியமிக்கப்பட்ட கடமை, பொறுப்பு, காவல் ஆகிய அர்த்தவட்டத்தைக் கொண்ட சொல்லை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד
  choice: மேற்பார்வையில்
  rationale: சொல்லர்த்தமாக ‘கையில்’ என்றாலும், இங்கு அதிகாரம் அல்லது மேற்பார்வைக்குக் கீழ் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனின் மகன் இத்தாமார்
  rationale: பெயர், தந்தை-மகன் உறவு, ஆசாரிய அடையாளம் ஆகிய அனைத்தையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
