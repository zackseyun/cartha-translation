base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: ta
  text: 'திருமுன்னிலையின் மேசையின்மேல்[a] அவர்கள் நீலநிறத் துணியை விரிக்க வேண்டும். அதன்மேல் தட்டுகளையும், கிண்ணங்களையும், குவளைகளையும், பானபலிக்கான குடங்களையும் வைக்க வேண்டும். தொடர்ச்சியாக வைக்கப்படும் அப்பம்[b] அதன்மேல் இருக்க வேண்டும்.


    [a] மரபாக, “சமுகத்து அப்பங்களின் மேசை” எனப்படுகிறது. எபிரெய மொழியில் சொல்லுக்குச் சொல், “முகத்தின் மேசை” அல்லது “திருமுன்னிலையின் மேசை” என்று உள்ளது.


    [b] இன்னொரு மொழிபெயர்ப்பு: “தொடர்ச்சியான அப்பம்.” ஆண்டவருடைய திருமுன்னிலையில் இந்த மேசையின்மேல் தவறாமல் வைக்கப்பட்டிருந்த அப்பத்தை இது குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “சமுகத்து அப்பங்களின் மேசை” எனப்படுகிறது. எபிரெய மொழியில் சொல்லுக்குச் சொல், “முகத்தின் மேசை” அல்லது “திருமுன்னிலையின் மேசை” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: 'இன்னொரு மொழிபெயர்ப்பு: “தொடர்ச்சியான அப்பம்.” ஆண்டவருடைய திருமுன்னிலையில் இந்த மேசையின்மேல் தவறாமல் வைக்கப்பட்டிருந்த அப்பத்தை இது குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: திருமுன்னிலை மேசை
  rationale: எபிரெயச் சொற்றொடரின் ‘முகம்/முன்னிலை’ என்ற உருவகத்தையும் வழிபாட்டுச் சூழலையும் காக்கிறது; விளக்கமாக அமையும் ‘சமுகத்து அப்பங்களின் மேசை’ என்பதை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: יִפְרְשׂוּ
  choice: விரிக்க வேண்டும்
  rationale: ஒரு துணியை மேசையின்மேல் பரப்பும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; இச்சூழலில் எபிரெய வினையின் கட்டளைமுறை சார்ந்த எதிர்காலப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: நீலநிறத் துணி
  rationale: கூடார வழிபாட்டில் பயன்படுத்தப்பட்ட தனித்துவமான நீலம் அல்லது ஊதாநீலச் சாயலைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் தெளிவாகக் கூறுகிறது.
- source_word: הַקְּעָרֹת
  choice: தட்டுகள்
  rationale: மேசையில் பயன்படுத்தப்படும் தட்டையான பரிமாறும் பாத்திரங்களை இயல்பாகக் குறிக்கிறது.
- source_word: הַכַּפֹּת
  choice: கிண்ணங்கள்
  rationale: இச்சொல் கரண்டி போன்ற பாத்திரங்களையும் குறிக்கக்கூடும்; வடிவத்தை உறுதியாக நிர்ணயிக்காமல் பொதுவாகப் புரியும் மேசைப் பாத்திரப் பெயர் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: הַמְּנַקִּיֹּת
  choice: குவளைகள்
  rationale: அரிதான இப்பாத்திரச் சொல்லின் துல்லிய வடிவம் உறுதியற்றது. பழமையான அல்லது மிகக் குறிப்பான பெயரைத் தவிர்த்து, பாத்திரப் பட்டியலுக்கு ஏற்ற பொதுவான சொல்லைப் பயன்படுத்துகிறது.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: பானபலிக்கான குடங்கள்
  rationale: ஊற்றப்படும் பானபலியுடன் இப்பாத்திரங்களுக்கு உள்ள தொடர்பைக் காக்கிறது; ‘குடங்கள்’ என்பது திரவத்தை வைத்திருந்து ஊற்றும் பாத்திரத்துக்கு இயல்பான தமிழ்.
- source_word: לֶחֶם הַתָּמִיד
  choice: தொடர்ச்சியாக வைக்கப்படும் அப்பம்
  rationale: תָּמִיד என்பதன் தொடர்ச்சியான, தவறாத இருப்பைத் தெளிவாக்குகிறது; வெறும் ‘வழக்கமான அப்பம்’ என்ற பொருள் ஏற்படுவதைத் தவிர்க்கிறது.
- source_word: עָלָיו יִהְיֶה
  choice: அதன்மேல் இருக்க வேண்டும்
  rationale: அப்பம் மேசையின்மேல் இருக்க வேண்டுமென்ற மூலத்தின் எளிய கூற்றைக் காக்கிறது; ‘அங்கேயே நிலைத்திருக்க வேண்டும்’ போன்ற கூடுதல் நுண்பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: שֻׁלְחַן הַפָּנִים என்ற வழிபாட்டுச் சொற்றொடரின் பொருள்
  choice: திருமுன்னிலை மேசை
  alternative: சமுகத்து அப்பங்களின் மேசை
  rationale: மூலத்தின் ‘முகம்/முன்னிலை’ என்ற உண்மையான உருவகத்தையும் அதன் இறைச்சந்நிதி சார்ந்த பதற்றத்தையும் பிரதான உரையில் காக்கிறது; பாரம்பரிய விளக்கமொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தரநிலைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மேஜை’ என்பதற்குப் பதில் இலக்கியமும் வழக்குமாக ஏற்ற ‘மேசை’ பயன்படுத்தப்பட்டது. பாத்திரப் பெயர்களில் மூலத்தின் உறுதியின்மையை மறைக்கும் அளவுக்கு மிகக் குறிப்பான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
