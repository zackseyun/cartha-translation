translation:
  language: ta
  text: அவர்களுள், அவர்களுடைய குலங்களின்படி கணக்கிடப்பட்டவர்கள் மூவாயிரத்து இருநூறு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: … பேர்
  rationale: தொடர்ச்சியையும் கணக்கின் முடிவையும் தமிழில் இயல்பான பெயர்ப்பயனிலை வாக்கியமாக வெளிப்படுத்துகிறது; எபிரெய ‘இருந்தார்கள்’ என்ற வினையைத் தனியே மொழிபெயர்ப்பது இங்கு தேவையில்லை.
- source_word: פְקֻדֵיהֶם
  choice: அவர்களில் … கணக்கிடப்பட்டவர்கள்
  rationale: இந்த மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது. ‘அவர்களில்’ என்பது பின்னொட்டிலுள்ள குழுத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்தின் உட்பிரிவான குலத்தைக் குறிக்கிறது. ‘அவரவர்’ என்பது பன்மைக் குழுக்களுக்குரிய பகிர்வைத் தமிழில் தெளிவாக்குகிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: மூவாயிரத்து இருநூறு
  rationale: எண்ணிக்கையை நவீனத் தமிழின் இயல்பான தொகை வடிவில் துல்லியமாக வழங்குகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், மக்கள்தொகைக் கணக்கெடுப்பின் நிர்வாகச் சூழலுக்கு ஏற்ற தெளிவும் கண்ணியமும் கொண்ட நடை. ‘குடும்பங்கள்’ என்பதற்குப் பதில் சமூக உட்பிரிவைக் குறிக்கும் ‘குலங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
