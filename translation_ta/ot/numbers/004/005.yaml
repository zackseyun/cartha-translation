  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: ta
  text: முகாம் புறப்படும்போது, ஆரோனும் அவன் மகன்களும் வந்து மறைப்புத் திரையை இறக்கி, அதைக் கொண்டு சாட்சிப் பெட்டியை[a] மூட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “உடன்படிக்கைப் பெட்டி” என்றும் மொழிபெயர்க்கப்படுகிறது. ஆனால் இங்குள்ள எபிரெயச் சொல் “சாட்சி” என்றே கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவன் மகன்களும் வந்து
  rationale: וּבָא என்பது வடிவில் ஒருமையாக இருந்தாலும், கூட்டெழுவாயையும் தொடர்ந்து வரும் பன்மை வினைகளையும் கருத்தில் கொண்டு ஆரோனையும் அவன் மகன்களையும் சேர்த்துக் குறிக்கும் அறிவுறுத்தலாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: முகாம் புறப்படும்போது
  rationale: בְּ உடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது; பயணத்தைத் தொடங்குவதை நவீன தமிழில் இயல்பாகப் புறப்படுதல் தெரிவிக்கிறது.
- source_word: וְהוֹרִדוּ
  choice: இறக்கி
  rationale: வாசஸ்தலப் பொருட்களைப் பயணத்திற்காகக் கழற்றி ஒழுங்குபடுத்தும் சூழலில், திரையை அதன் இடத்திலிருந்து கீழிறக்குவதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: மறைப்புத் திரை
  rationale: פָּרֹכֶת என்பதன் பரிசுத்த இடத்தைப் பிரிக்கும் திரை என்ற சிறப்புப் பொருளையும், מָסָךְ என்பதன் மறைக்கும் செயலையும் இயல்பான தமிழ்க் கூட்டுச்சொல்லில் தக்கவைக்கிறது.
- source_word: וְכִסּוּ בָהּ
  choice: அதைக் கொண்டு ... மூட வேண்டும்
  rationale: בָהּ என்பது முன் குறிப்பிடப்பட்ட திரையைக் கருவியாகச் சுட்டுகிறது; தமிழில் அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲרֹן הָעֵדֻת
  choice: சாட்சிப் பெட்டி
  rationale: எபிரெயச் சொல் עֵדוּת என்பது ‘சாட்சி’ என்பதையே குறிக்கிறது; இங்கு இல்லாத בְּרִית (‘உடன்படிக்கை’) என்ற சொல்லை மொழிபெயர்ப்புக்குள் கொண்டுவராமல், எளிதில் புரியும் ‘பெட்டி’ என்பதுடன் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲרֹן הָעֵדֻת என்பதன் மரபுவழி மொழிபெயர்ப்பு
  choice: சாட்சிப் பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: மூல உரையில் ‘உடன்படிக்கை’ என்பதற்கான בְּרִית இல்லை; ‘சாட்சி’ என்பதற்கான עֵדוּת உள்ளது. ஆகவே பரிச்சயமான மரபுச் சொல்லை முதன்மை உரைக்குள் கொண்டுவராமல், மூலத்தின் சொல்வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடன் அமைக்கப்பட்டுள்ளது. ‘மறைப்புத் திரை’ என்பது மூலத்தின் இரண்டு தொடர்புடைய பெயர்ச்சொற்களையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; ‘வேண்டும்’ என்பது எதிர்கால அறிவுறுத்தலின் கட்டளைத் தன்மையை வெளிப்படுத்துகிறது.
