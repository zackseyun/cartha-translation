    issue: Primary rendering of יהוה is “யெகோவா.”
    rationale: 'The source contains the Tetragrammaton, and the provided English POB decision explicitly requires “Yahweh,” not “Jehovah.” The Tamil main text should correspond to that project decision: “யாவே.”'
  - severity: low
