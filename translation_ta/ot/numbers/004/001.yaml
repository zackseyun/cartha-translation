source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடமும் ஆரோனிடமும் பேசிச் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’ (יהוה); ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.'
    reason: மூலத்தில் உள்ள நான்கெழுத்துத் தெய்வீகப் பெயரைச் சுட்டிக்காட்டி, பரவலாக அறியப்படும் மாற்று ஒலிபெயர்ப்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசியதாவது
  rationale: דבר என்ற வினை தெய்வீக உரையை அறிமுகப்படுத்துகிறது. அடுத்துவரும் நேரடி உரையுடன் இயல்பாக இணைக்கத் தமிழில் ‘பேசியதாவது’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது; மூலத்தில் இருப்பது ஒரு தனிப்பெயர் என்பதையும் காக்கிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இரு பெயர்களுக்கும் முன் אֶל மீண்டும் வருவதால், இருவரும் நேரடியாக உரையாடலின் பெறுநர்கள் என்பதை ‘-இடமும் ... -இடமும்’ என்ற இணை அமைப்பு காக்கிறது.
- source_word: לֵאמֹר
  choice: பேசியதாவது
  rationale: לֵאמֹר என்பது தொடர்ந்து வரும் மேற்கோள் உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரேயச் சூத்திரம். தமிழில் தனியே ‘சொல்லி’ என இடாமல், ‘பேசியதாவது’ என்பதில் அதன் பண்பு இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல எபிரேயத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தனிப்பெயர் உள்ளது. ஆகவே ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது. உச்சரிப்பின் மறுகட்டமைப்பு உறுதியற்றிருப்பதால் மாற்று வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கேற்ற கண்ணியமான எளிய நடை. எபிரேய வாக்கியத்தின் உரை-அறிமுக அமைப்பு தமிழில் இயல்பாக அமைய ‘பேசியதாவது’ பயன்படுத்தப்பட்டுள்ளது.
