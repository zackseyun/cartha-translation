base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: ta
  text: மோசேயும் ஆரோனும் இஸ்ரவேலின் தலைவர்களும் லேவியர்களை எண்ணிய, எண்ணப்பட்ட அனைவரும்[a], அவரவர் குலங்களின்படியும் தந்தைவழிக் குடும்பங்களின்படியும்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பதிவுசெய்யப்பட்ட” அல்லது “கணக்கிடப்பட்ட” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் פקד இங்கு மக்கள்தொகைக் கணக்கெடுப்புக்குரிய சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது குலங்களுக்குள் இருந்த வம்சவழிக் குடும்பப் பிரிவுகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: எண்ணப்பட்ட அனைவரும்
  rationale: פקד என்பதன் செயல்பாட்டு எச்சம் மக்கள்தொகைக் கணக்கெடுப்பில் அதிகாரபூர்வமாக எண்ணப்பட்டவர்களைக் குறிக்கிறது; பாலினத்தைத் தேவையின்றி வெளிப்படையாகச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר פָּקַד
  choice: எண்ணியவர்கள்
  rationale: உறவுக்கூற்றில் மோசே, ஆரோன், தலைவர்கள் ஆகியோர் செய்த அதிகாரபூர்வ எண்ணிக்கையிடுதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள்
  rationale: נשיאים என்பது கோத்திரத் தலைவர்களைக் குறிக்கிறது; இன்றைய வாசகர்களுக்குத் தெளிவான, அரச மரபைத் தவறாக உணர்த்தாத சொல்.
- source_word: אֶת הַלְוִיִּם
  choice: லேவியர்களில்
  rationale: நேரடி செயப்படுபொருள் லேவியர்களாக இருந்தாலும், முன்வரும் ‘எண்ணப்பட்ட அனைவரும்’ என்பதுடன் உறவை இயல்பான தமிழில் எடுத்துரைக்க ‘லேவியர்களில்’ பயன்படுத்தப்படுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: משפחה இங்கு கணக்கெடுப்பின் குல அடிப்படையிலான பிரிவைக் குறிக்கிறது.
- source_word: וּלְבֵית אֲבֹתָם
  choice: மூதாதையர் குடும்பங்களின்படி
  rationale: בית אבות என்பது தந்தைவழி மூதாதையரை அடிப்படையாகக் கொண்ட குடும்ப அல்லது வம்சக் குழுவைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘தந்தையர் வீடுகள்’ என்பதைவிட இது நவீன தமிழில் தெளிவு.
