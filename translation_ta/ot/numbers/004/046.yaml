translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். எபிரெய வசனம் அடுத்த வசனத்தோடு தொடரும் சுருக்கக் கட்டமைப்பாக இருப்பதால் முற்றுப்பெறாத ஓட்டத்தை கோடுகள் மூலம் சுட்டினாலும், தமிழில் புரிதலுக்காக இறுதியில் ‘எண்ணப்பட்டார்கள்’ மீண்டும் சேர்க்கப்பட்டது; இது மூலத்தில் உள்ள எண்ணிக்கைச் சூழலை வெளிப்படுத்துகிறது.
