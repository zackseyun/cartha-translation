base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: ta
  text: மெராரியின் மகன்களின் குடும்பங்களைச் சேர்ந்த எண்ணப்பட்டவர்கள் இவர்களே. இவர்களை மோசேயும் ஆரோனும் யாவேயின் கட்டளைப்படி[a], மோசேயின் மூலமாக[b] எண்ணினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “யாவேயின் வாயின்படி”; அதாவது, “யாவேயின் கட்டளைப்படி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “மோசேயின் கையால்”; அதாவது, “மோசேயின் மூலமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: எண்ணப்பட்டவர்கள் இவர்களே
  rationale: மக்கள்தொகைக் கணக்கெடுப்புச் சூழலில் פקד என்பது பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கிறது; தமிழில் இயல்பான அறிமுக வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: மெராரியின் மகன்களுடைய குடும்பங்களில்
  rationale: எபிரேய உறவுமுறைச் சொல்லாட்சியைத் தெளிவாகப் பேணுகிறது; எண்ணப்பட்டவர்கள் அந்தக் குடும்பங்களைச் சேர்ந்தவர்கள் என்பதால் ‘குடும்பங்களில்’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: פָּקַד
  choice: எண்ணினார்கள்
  rationale: இப்பகுதியின் கணக்கெடுப்புச் சூழலுக்கும் פְקוּדֵי என்ற தொடர்புடைய சொல்லுக்கும் பொருந்தும் எளிய நவீனத் தமிழ்.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வாயின்படி’ என்றாலும், இங்கு நிலையான எபிரேய மரபுத்தொடர் ‘யாவேயின் கட்டளைப்படி’ என்று பொருள்படுகிறது; நேரடிப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: சொல்லுக்குச் சொல் ‘மோசேயின் கையால்’; இங்கு கை என்பது செயற்படுத்தும் வழி அல்லது முகவரைக் குறிக்கும் மரபுத்தொடர் என்பதால் இயல்பான தமிழில் பொருள் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயரே உள்ளது; எனவே அந்த வேறுபாட்டைப் பேண ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: ‘யாவேயின் வாயின்படி’ என்ற எபிரேய மரபுத்தொடர்
  choice: யாவேயின் கட்டளைப்படி
  alternative: யாவேயின் வாயின்படி
  rationale: மரபுத்தொடரின் சூழல்சார் பொருளைத் தெளிவாகக் கொடுக்கிறது; உடலுறுப்பு சார்ந்த மூலப் படிமத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ‘மோசேயின் கையால்’ என்ற முகமைச் சொல்லாட்சி
  choice: மோசேயின் மூலமாக
  alternative: மோசேயின் கையால்
  rationale: இங்கு ‘கை’ என்பது முகமை அல்லது வழிமுறையைக் குறிக்கிறது. மோசேயும் ஆரோனும் எண்ணியதாக முன்னரே கூறப்படுவதால், சொல்லுக்குச் சொல் வடிவம் தமிழில் தேவையற்ற குழப்பத்தை உண்டாக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கணக்கெடுப்புச் சூழல் தெளிவாக வைக்கப்பட்டு, எபிரேய மரபுத்தொடர்களின் நேரடி வடிவங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
