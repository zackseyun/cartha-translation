- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயக் கூட்டுச்சொல் வெள்ளாட்டு இனத்தைச் சேர்ந்த ஆண் விலங்கைக் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் ‘ஆட்டுக்கடா’ இயல்பாகவும் பலிக்குரிய விலங்கின் பாலினத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: எண்ணிக்கையைக் குறிப்பிடும் பட்டியல் நடையைத் தக்கவைக்க אֶחָד நேரடியாக ‘ஓர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலியிடுதல் சார்ந்த சூழலில் חַטָּאת என்பது பொதுவாகப் பாவத்தையே அல்ல, பாவத்துக்கான பலியைக் குறிக்கிறது. முன்னொட்டு לְ நோக்கத்தைக் காட்டுவதால் ‘பலிக்காக’ என்பது பொருத்தமானது.
