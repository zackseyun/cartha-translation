  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: ta
  text: மோசே அந்த வண்டிகளையும் மாடுகளையும் எடுத்து, அவற்றை லேவியர்களுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பெற்றுக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்பதாக இருந்தாலும், முந்தைய வசனங்களில் காணிக்கையாகக் கொண்டுவரப்பட்ட பொருட்களை மோசே ஏற்றுக்கொண்ட சூழலில் ‘பெற்றுக்கொண்டு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָעֲגָלֹת
  choice: வண்டிகள்
  rationale: עגלה இங்கு பொருட்களை ஏற்றிச் செல்லும் வாகனங்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘வண்டிகள்’ தெளிவான பொதுச் சொல்.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בקר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர். அதிகாரத்தின் சூழல் அவை எருதுகள் என்பதைத் தெளிவுபடுத்தினாலும், இவ்வசனத்தின் விரிவான சொல்லாட்சியை ‘மாடுகள்’ பாதுகாக்கிறது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடு’; நிர்வாக ரீதியான பகிர்வு என்பதைச் சூழல் உணர்த்துவதால், கூடுதல் விளக்கத்தை வினைக்குள் சேர்க்கவில்லை.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: ஆண்பால் பன்மைச் சுட்டுப்பெயர் வண்டிகளையும் மாடுகளையும் கூட்டாகச் சுட்டுகிறது; உயிரற்றவை மற்றும் விலங்குகள் சேர்ந்த தொகுப்புக்கு ‘அவற்றை’ இயல்பான தமிழ் வடிவம்.
- source_word: אֶל־הַלְוִיִּם
  choice: லேவியர்களுக்குக்
  rationale: אֶל இங்கு பொருட்கள் லேவியர்களிடம் ஒப்படைக்கப்படுவதைக் குறிக்கிறது; தமிழில் பெறுபவரைக் குறிக்கும் நான்காம் வேற்றுமை இயல்பான நேரடி இணை.
