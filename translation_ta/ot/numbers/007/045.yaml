revisions:
- from: எருதுக்கூட்டத்திலிருந்து ஒரு காளை, ஒரு ஆட்டுக்கடா, ஓராண்டான ஒரு ஆட்டுக்குட்டி ஆகியவற்றைத் தகனபலியாகச் செலுத்தினான்;
  to: மாட்டுமந்தையிலிருந்து ஒரு காளை, ஒரு ஆட்டுக்கடா, ஓராண்டு வயதுள்ள ஒரு ஆண் ஆட்டுக்குட்டி, தகனபலிக்காக;
  rationale: The revision removes the unsupported finite verb and object plural, preserving the Hebrew’s compact list structure. It retains each repeated count, renders the bovine herd phrase idiomatically, explicitly represents the male lamb, and keeps the conventional term “தகனபலி” for עֹלָה.
