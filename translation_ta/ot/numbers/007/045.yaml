lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: எருதுக்கூட்டத்திலிருந்து ஒரு காளை
  rationale: פַּר என்பது பலிச்சூழலில் காளையைக் குறிக்கிறது; בֶּן בָּקָר என்ற எபிரெய மரபுத்தொடர் அது எருதுக்கூட்டத்தைச் சேர்ந்தது என்பதைத் தெரிவிக்கிறது. இயல்பான தமிழில் இரண்டையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַיִל אֶחָד
  choice: ஒரு ஆட்டுக்கடா
  rationale: אַיִל என்பது பலிக்காகக் குறிப்பிடப்படும் வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘ஆட்டுக்கடா’ என்பது பொதுவாகப் புரியும் இயல்பான தமிழ்ச் சொல்.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ஓராண்டான ஒரு ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ ஆண் ஆட்டுக்குட்டியைக் குறிக்கிறது; בֶּן שְׁנָתוֹ அதன் வயதைச் சுட்டும் மரபுத்தொடர். தமிழில் பாலினத்தைத் தனியே வலியுறுத்தாமல், சூழலுக்கு ஏற்ற இயல்பான ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: עֹלָה என்பது முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல்; ‘தகனபலி’ தமிழ்வேதாகம நடையில் பரவலாக அறியப்பட்டும் சுருக்கமாகவும் உள்ளது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு விலங்குக்கும் மீண்டும் வரும் எண்ணிக்கைக் குறிப்பைத் தமிழிலும் பாதுகாக்கிறது.
