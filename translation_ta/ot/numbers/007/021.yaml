revisions:
- from: மந்தையிலிருந்து ஒரு காளைமாடு[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதான ஆட்டுக்குட்டி[b]—இவற்றைத் தகனபலியாகச் செலுத்தினான்.
  to: மாட்டு மந்தையிலிருந்து ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுள்ள ஆட்டுக்குட்டி[b] தகனபலிக்காக.
  rationale: The revision specifies bovine stock for בן בקר, uses the more natural and exact Tamil age expression for בן שנתו, and preserves the source verse's list-like continuation without supplying a finite verb. Footnote markers remain attached to the corresponding lexical items.
