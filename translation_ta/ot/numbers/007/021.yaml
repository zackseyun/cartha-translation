  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ta
  text: மாட்டு மந்தையிலிருந்து ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுள்ள ஆட்டுக்குட்டி[b] தகனபலிக்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ஒரு காளை, மாட்டினத்தின் மகன்.” இது மாட்டு மந்தையைச் சேர்ந்த விலங்கைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் முதல் ஆண்டில் உள்ள ஓர் ஆட்டுக்குட்டி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: காளைமாடு
  rationale: பலிப்பட்டியலில் வரும் ஆண் மாட்டைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு பலிப்பொருளுக்கும் மீண்டும் வரும் எண்ணைத் தக்கவைத்து பட்டியல் அமைப்பைப் பாதுகாக்கிறது.
- source_word: בֶּן בָּקָר
  choice: மந்தையிலிருந்து
  rationale: சொல்லர்த்தமாக ‘மாட்டினத்தின் மகன்’; இங்கு மாட்டு மந்தையைச் சேர்ந்த விலங்கு என்னும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலிக்குரிய வளர்ந்த ஆண் செம்மறியாட்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: செம்மறியாட்டுக் குட்டியைக் குறிக்கும் சொல்; சூழலில் பலிக்குரிய விலங்குகளின் பட்டியலோடு இயல்பாக அமைகிறது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான
  rationale: விலங்கின் வயதைக் குறிப்பிடும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘முதல் ஆண்டில் உள்ள’ என்பதும் சாத்தியம்.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான வேதாகமத் தமிழ் சொல்; முன்னொட்டு לְ- இங்குள்ள நோக்கம்/பயன்பாட்டை ‘-ஆக’ எனக் காட்டுகிறது.
