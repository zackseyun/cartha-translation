translation_notes:
  register: நவீன நிலையான தமிழில், பலிப்பொருட்களின் பட்டியல் தன்மையைத் தக்கவைக்கும் கண்ணியமான நடை. மூலத்தில் வெளிப்படையாக இல்லாத வினை, தமிழ் வசனமாக முழுமையடைய உடனடி சூழலிலிருந்து ‘செலுத்தினான்’ என வழங்கப்பட்டுள்ளது.
