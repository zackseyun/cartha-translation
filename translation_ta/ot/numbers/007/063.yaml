  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ta
  text: மாட்டுமந்தையிலிருந்து ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஓராண்டான ஒரு ஆண் செம்மறியாட்டுக்குட்டி—தகனபலிக்காக;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு இளங்காளை, ஒரு செம்மறியாட்டுக் கடா, முதல் ஆண்டிலுள்ள ஒரு ஆண் செம்மறியாட்டுக்குட்டி—தகனபலிக்காக.’ ‘மாட்டினத்தின் மகன்’ என்பது மாட்டுமந்தையைச் சேர்ந்த ஒரு விலங்கையும், ‘தன் ஆண்டின் மகன்’ என்பது அதன் முதல் ஆண்டிலுள்ள ஒரு விலங்கையும் குறிக்கும் எபிரெய மரபுத்தொடர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: மாட்டுமந்தையிலிருந்து ஒரு காளை
  rationale: פַּר என்பது பலிச் சூழலில் காளையைக் குறிக்கிறது; בֶּן־בָּקָר என்பதன் சொற்பொருள் ‘மாட்டினத்தின் மகன்’ என்றாலும், அது மாட்டுமந்தையைச் சேர்ந்த விலங்கைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் இரண்டையும் இணைத்து மொழிபெயர்க்கப்பட்டது.
- source_word: אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: இது வளர்ந்த ஆண் செம்மறியாட்டுக்கான வழக்கமான பலிச்சொல்; ‘கடா’ அதன் பாலினத்தையும் முதிர்ச்சியையும் தெளிவாகக் காட்டுகிறது.
- source_word: כֶּבֶשׂ
  choice: ஒரு ஆண் செம்மறியாட்டுக்குட்டி
  rationale: பலிச் சூழலில் ஆண் ஆட்டுக்குட்டியைக் குறிக்கும் சொல்லாக இருப்பதால், விலங்கின் வகையும் பாலினமும் தெளிவாகத் தரப்பட்டுள்ளன.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: ‘தன் ஆண்டின் மகன்’ என்ற சொற்படியான எபிரெய மரபுத்தொடர், ஒரு வயதான அல்லது முதல் ஆண்டிலுள்ள விலங்கைக் குறிக்கிறது. சுருக்கமான பட்டியல் நடைக்கு ‘ஓராண்டான’ இயல்பாக உள்ளது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான எபிரெயச் சொல்; முன்னொட்டு לְ நோக்கத்தைச் சுட்டுவதால் ‘தகனபலிக்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு பலிவிலங்கின் எண்ணிக்கையையும் குறிக்கும் மீளுரைப்பைத் தமிழிலும் தொடர்ந்து காக்கிறது.
