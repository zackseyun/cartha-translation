  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: ta
  text: நான்காம் நாளில், ரூபேனின் மக்களின் தலைவர் சேதேயூரின் மகன் எலிசூர் இருந்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘முதல்வர்’; மரபாக ‘இளவரசர்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. נָשִׂיא என்பது இங்கு அதிகாரப்பூர்வமான கோத்திரத் தலைவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘ரூபேனின் மக்களுக்கான தலைவர்’. இச்சூழலில் எபிரெய முன்னிடைச்சொல் தொடர்பையோ பிரதிநிதித்துவத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: நாளில்
  rationale: בְּ முன்னொட்டு இங்கு பட்டியலின் காலத்தைக் குறிக்கிறது; தமிழில் ‘நாளில்’ என்பது இயல்பான காலக் குறிப்பு.
- source_word: הָרְבִיעִי
  choice: நான்காம்
  rationale: ‘நாள்’ என்பதைக் குறிப்பிடும் வரிசை எண்ணாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: נָשִׂיא
  choice: தலைவர்
  rationale: எண்ணாகமத்தில் இச்சொல் ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட அதிகாரப்பூர்வத் தலைவரைக் குறிக்கிறது. ‘தலைவர்’ என்பது அரச மரபைத் தேவையின்றி உணர்த்தும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: לִבְנֵי רְאוּבֵן
  choice: ரூபேனின் மக்களின்
  rationale: לְ இங்கு தொடர்பு அல்லது பிரதிநிதித்துவத்தைக் குறிக்கிறது. ‘ரூபேனின் மக்களின்’ என்பது எபிரெய குடும்ப–கோத்திரச் சொல்லாக்கத்தைத் தக்கவைக்கிறது; ‘ரூபேனியர்’ எனச் சுருக்கவில்லை.
- source_word: אֱלִיצוּר
  choice: எலிசூர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச அல்லது தந்தைவழி அடையாளத்தைக் காட்டும் வழக்கமான எபிரெய அமைப்புக்கு இயல்பான தமிழ் இணை.
- source_word: שְׁדֵיאוּר
  choice: சேதேயூர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
