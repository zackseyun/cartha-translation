  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயில் வினைச்சொல் இல்லாத பெயர்ச்சொல் தொடர் இருப்பதால், அடுத்த வசனத்துடன் தொடரும் பட்டியல் அமைப்பைத் தக்கவைக்க தமிழிலும் தேவையற்ற ‘இருந்தார்’ அல்லது ‘காணிக்கை செலுத்தினார்’ சேர்க்கப்படவில்லை.
