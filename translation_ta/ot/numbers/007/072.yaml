translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான பட்டியல்-வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசேரின் மக்களுக்கான தலைவன்’ என்பது לִבְנֵי אָשֵׁר என்ற எபிரெய அமைப்பின் உறவையும் பிரதிநிதித்துவப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
