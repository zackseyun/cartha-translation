  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: ta
  text: பதினொன்றாம் நாளில், ஆசேர் மக்களின் தலைவன் ஒக்ரானின் மகன் பகியேல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: பதினொன்றாம் நாளில்
  rationale: எபிரெயத் தொடரில் ‘நாள்’ மீண்டும் வந்தாலும், எண்ணாகமம் 7-இன் தொடர்ச்சியான அர்ப்பணிப்பு நிகழ்வை இயல்பான நவீனத் தமிழில் காலக் குறிப்பாகத் தெளிவாக வழங்குகிறது.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: பதினொன்றாம்
  rationale: இச்சூழலில் எண்ணிக்கை வரிசைமுறைப் பொருளில் இருப்பதால் தமிழின் இயல்பான வரிசை எண்ணாக மொழிபெயர்க்கப்பட்டது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இங்கு அரசகுமாரன் அல்ல, கோத்திரத்தைப் பிரதிநிதித்துவப்படுத்தும் அங்கீகரிக்கப்பட்ட தலைவர் குறிக்கப்படுகிறார்; ‘தலைவன்’ மூலத்தின் பொருளையும் உரையின் கண்ணியமான நடையையும் காக்கிறது.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: ஆசேரின் மக்களுக்கான
  rationale: לְ முன்னிடைச்சொல்லின் ‘-க்கான’ நுணுக்கத்தையும், ‘ஆசேரின் மக்கள்/மகன்கள்’ என்ற கோத்திர உறவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: פַּגְעִיאֵל
  choice: பகியேல்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן עָכְרָן
  choice: ஒக்ரானின் மகன்
  rationale: בֶּן என்பதன் தந்தைவழி உறவை ‘மகன்’ என்று நேரடியாக வழங்கி, עָכְרָן என்பதை எபிரெய ஒலிப்புக்கு அண்மையாக ‘ஒக்ரான்’ என எழுத்துப்பெயர்க்கிறது.
