base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], பரிசுத்த இடத்தின் சேக்கல் கணக்கின்படி எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்; அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெயுடன் கலக்கப்பட்ட மெல்லிய மாவால் நிறைந்திருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘தாம்பாளம்’ என்றும், ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘கலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பைக் குறிக்கும்; நவீன தமிழில் ‘காணிக்கை’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה அகன்ற பாத்திரத்தைக் குறிக்கிறது; பட்டியல் சூழலில் ‘தட்டு’ பொருத்தமானது. ‘தாம்பாளம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எபிரெயச் சொற்றொடரில் பாத்திரத்துக்குப் பின் அதன் எடை தரப்படுகிறது; தமிழில் பெயரெச்சத் தொடராக மாற்றுவது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק பலியிடும் பணியில் பயன்படுத்தப்பட்ட கிண்ணம் அல்லது கலத்தைக் குறிக்கிறது; ‘கிண்ணம்’ எளிதில் புரியும் பொதுத் தமிழ் சொல்.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இரண்டாவது பாத்திரத்தின் எடையைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் கணக்கின்படி
  rationale: இது எடைக்கான வழிபாட்டுத் தரநிலையைக் குறிக்கிறது; ‘கணக்கின்படி’ என்ற சொல் அளவீட்டுத் தரத்தைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிறைந்திருந்தன
  rationale: இரு வெள்ளிப் பாத்திரங்களையும் தெளிவாகச் சுட்டி, எபிரெய வாக்கியத்தின் கூற்றை இயல்பான தமிழில் வழங்குகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளுக்காகப் பயன்படுத்தப்பட்ட நன்கு அரைக்கப்பட்ட மாவைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளக்கூடிய தமிழ் மொழிபெயர்ப்பு.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட
  rationale: மாவின் தயாரிப்பு முறையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்பதைவிட இது துல்லியமானது.
