  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பட்டியல் தன்மை பேணப்பட்டுள்ளது; ‘சேக்கல்’ எடை அலகாக ஒலிபெயர்க்கப்பட்டுள்ளது.
