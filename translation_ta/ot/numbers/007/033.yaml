translation_notes:
  register: நவீன நிலையான தமிழில், பலிப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் மீண்டும் வரும் ‘ஒரு’ காக்கப்பட்டது; எபிரேய மரபுத்தொடர்களின் நேரடி வடிவம் இயல்பான தமிழாக்கமாக வழங்கப்பட்டு, முக்கிய மாற்று அர்த்தங்கள் அடிக்குறிப்புகளில் தரப்பட்டன.
