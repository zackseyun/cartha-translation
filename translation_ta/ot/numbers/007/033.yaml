id: NUM.7.33
reference: Numbers 7:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ta
  text: தகனபலிக்காக மாட்டுமந்தையிலிருந்து ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஓராண்டான ஒரு ஆட்டுக்குட்டி[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்சொல்லாக, “ஒரு காளை, மாட்டுமந்தையின் மகன்.” இது மாட்டினத்தைச் சேர்ந்த ஒரு காளையைக் குறிக்கும் மரபுத்தொடர்; பெரும்பாலும் இளங்காளை என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் முதல் ஆண்டில் உள்ள ஒரு ஆட்டுக்குட்டி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: மாட்டுமந்தையிலிருந்து ஒரு காளை
  rationale: פַּר என்பது காளையைக் குறிக்கிறது; בֶּן בָּקָר என்ற எபிரேய மரபுத்தொடர் அது மாட்டுமந்தையைச் சேர்ந்த விலங்கு என்பதைக் குறிப்பிடுகிறது. இயல்பான தமிழில் பொருளையும் எண்ணிக்கையையும் காக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது பலியிடும் பட்டியலில் வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும்; ‘செம்மறியாட்டுக் கடா’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ஒரு ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ என்பது இங்கு பலிக்கான ஆட்டுக்குட்டியைக் குறிக்கிறது. எபிரேயச் சொல் இலக்கணரீதியாக ஆண்பால் வடிவத்தில் இருந்தாலும், தமிழில் இயல்பான பட்டியல் நடைக்காக ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: இந்த எபிரேய வயதுக் கூறு ‘ஓராண்டான’ அல்லது ‘முதல் ஆண்டில் உள்ள’ என்ற பொருளுடையது. முதன்மை உரையில் இயல்பான சுருக்கமான வடிவம் தரப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான பலியியல் சொல்; தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியான ‘தகனபலி’ பயன்படுத்தப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு பலிவிலங்கின் எண்ணிக்கையையும் குறிக்கும் எண்; பட்டியல் முழுவதும் ‘ஒரு’ எனச் சீராக மொழிபெயர்க்கப்பட்டது.
