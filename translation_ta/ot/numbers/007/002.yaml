translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் இணைவிளக்க அமைப்பை ‘அதாவது’ என்றும், הֵם என்பதன் வலியுறுத்தலை ‘அவர்களே’ என்றும் வெளிப்படுத்துகிறது. மூலத்தில் வெளிப்படையாக இல்லாத காணிக்கை என்ற செயப்படுபொருள் சூழலின் அடிப்படையில் முதன்மை உரையில் சேர்க்கப்பட்டு, அதன் உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
