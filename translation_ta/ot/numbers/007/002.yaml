  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் தலைவர்கள், அதாவது தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[b], காணிக்கைகளைக் கொண்டுவந்தார்கள்[a]. அவர்களே கோத்திரங்களின் தலைவர்களாகவும், கணக்கெடுக்கப்பட்டவர்களுக்குப் பொறுப்பாக இருந்தவர்களாகவும்[c] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காணிக்கைகளைக் கொண்டுவந்தார்கள்” என்பதை “சமர்ப்பித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “அருகில் கொண்டுவந்தார்கள்”; இவ்வசனத்தில் செயப்படுபொருள் கூறப்படவில்லை, ஆனால் இப்பகுதியின் சூழல் அர்ப்பணிப்புக் காணிக்கைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது இஸ்ரவேலில் மூதாதையர் வழியாக அமைந்த விரிவான குடும்ப அல்லது குலப் பிரிவுகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில், “கணக்கெடுக்கப்பட்டவர்களின் மேல் நின்றவர்கள்” என்று உள்ளது. அதாவது, மக்கள் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களை மேற்பார்வையிட்டவர்கள் அல்லது அவர்களுக்குப் பொறுப்பாக இருந்தவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: காணிக்கைகளைக் கொண்டுவந்தார்கள்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல், சமர்ப்பித்தல்’ என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், எண்ணாகமம் 7-ன் அர்ப்பணிப்பு நிகழ்வுச் சூழல் காணிக்கைகளையே குறிக்கிறது; இதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிட்டு, இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள்
  rationale: נָשִׂיא என்பது இங்கு அரச குமாரர்களை அல்ல, மக்களிடையே அதிகாரமும் பிரதிநிதித்துவமும் உடைய கோத்திரத் தலைவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: בֵּית אָבוֹת என்பது தனிப்பட்ட இல்லத்தை மட்டும் அல்லாமல், மூதாதையர் வழிவந்த விரிவான குடும்ப அல்லது குல அலகைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ மூலத்தின் உறவுமுறை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: அவர்களே கோத்திரங்களின் தலைவர்கள்
  rationale: מַטּוֹת என்பதன் நேர்ப்பொருள் ‘கோல்கள்’ என்றாலும், இச்சூழலில் அது நிலையான மரபுப்பயன்பாட்டின்படி இஸ்ரவேலின் கோத்திரங்களைக் குறிக்கிறது. הֵם தரும் வலியுறுத்தலை ‘அவர்களே’ காக்கிறது.
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: கணக்கெடுக்கப்பட்டவர்களுக்குப் பொறுப்பாக இருந்தவர்களும் அவர்களே
  rationale: עמד על என்பதன் உருவகமான ‘மேலே நின்றவர்கள்’ என்ற சொற்றொடர் மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது. הַפְּקֻדִים என்பது மக்கள் கணக்கெடுப்பில் பதிவு செய்யப்பட்டவர்களைக் குறிக்கிறது. இயல்பான தமிழுக்காக அதிகாரப் பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
