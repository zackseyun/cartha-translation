base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ta
  text: ஒன்பதாம் நாளில், பென்யமீனின் மகன்களுக்கான தலைவர் கிதியோனியின் மகன் அபிதான் ஆவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீனின் மகன்களின் தலைவர்.” இத்தொடரில் வரும் எபிரேய முன்னிடைச்சொல் பிரதிநிதித்துவத்தையோ உறவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: ஒன்பதாம் நாளில்
  rationale: எபிரேய காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; வரிசை எண்ணும் ‘நாள்’ என்பதும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: נָשִׂיא
  choice: தலைவர்
  rationale: இங்கு காணிக்கை செலுத்தும் கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது. அரச மரபைக் குறிக்கும் தவறான எண்ணத்தைத் தவிர்த்து, பதவியின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִבְנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்களுக்கான
  rationale: לְ முன்னிடைச்சொல் இங்கு உறவையோ பிரதிநிதித்துவத்தையோ குறிக்கலாம். ‘மகன்கள்’ என்பது மூலத்திலுள்ள குடும்ப வழி ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: אֲבִידָן
  choice: அபிதான்
  rationale: தனிப்பெயர் எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தைவழி அடையாளத்தைக் காட்டும் வழக்கமான எபிரேய அமைப்பைத் துல்லியமாகத் தருகிறது.
- source_word: גִּדְעֹנִי
  choice: கிதியோனி
  rationale: தனிப்பெயர் எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: בְנֵי என்ற கோத்திரக் குறிப்பின் பாலினம் மற்றும் குடும்பவழிப் பொருள்
  choice: பென்யமீனின் மகன்கள்
  alternative: பென்யமீன் கோத்திரத்தார்
  rationale: இச்சூழலில் முழுக் கோத்திரமும் குறிக்கப்பட்டாலும், மூல மொழியின் குடும்பவழி ஆண்பால் சொல்லாட்சியை மறைக்காமல் பாதுகாக்கிறது.
- issue: לִבְנֵי என்பதில் உள்ள உறவு அல்லது பிரதிநிதித்துவம்
  choice: பென்யமீனின் மகன்களுக்கான தலைவர்
  alternative: பென்யமீனின் மகன்களின் தலைவர்
  rationale: முன்னிடைச்சொல் தலைவன் அந்தக் கோத்திரத்திற்காகச் செயல்படுவதையோ அதனுடன் சேர்ந்திருப்பதையோ குறிக்கலாம். முதன்மை உரை பிரதிநிதித்துவத்தை இயல்பாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய மூலத்தின் வினையற்ற பெயர்ச்சொல் வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கும்படி வைக்கப்பட்டுள்ளது; பெயர்கள் எபிரேய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
