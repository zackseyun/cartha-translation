  source_fidelity: 'மூல எபிரேயத்தில் இது வினையற்ற பெயர்ச்சொல் வாக்கியம்: ஒன்பதாம் நாளில் பென்யமீனின் மகன்களோடு தொடர்புடைய/அவர்களைப் பிரதிநிதித்துவப்படுத்தும் தலைவர் அபிதான், கிதியோனியின் மகன். வரைவின் அடிப்படைப் பொருள் சரியாக உள்ளது. ஆயினும் தமிழில் பெயர்ச்சொல் வாக்கியத்தை முழுமையான, இயல்பான வாக்கியமாக்க ‘ஆவார்’ சேர்ப்பது பாதுகாப்பானது; அது மூலத்தின் பொருளில் மாற்றம் செய்யாது.'
  naturalness: ‘கிதியோனியின் மகன் அபிதான்’ என்பது புரிந்துகொள்ளத்தக்கது; ஆனால் தலைப்பு மற்றும் தந்தைப்பெயரைத் தொடர்ந்து ‘அபிதான் ஆவார்’ என அமைத்தால் நவீன நிலையான தமிழில் வாக்கியம் நிறைவாகவும் வாசிப்பில் இயல்பாகவும் இருக்கும். ‘பென்யமீனின் மகன்களுக்கான தலைவர்’ முதன்மை உரையில் பிரதிநிதித்துவ உறவைத் தகுந்தவாறு வெளிப்படுத்துகிறது.
