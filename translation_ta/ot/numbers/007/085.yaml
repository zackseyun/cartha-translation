  text: שְׁלֹשִׁ֣ים וּ/מֵאָ֗ה הַ/קְּעָרָ֤ה הָֽ/אַחַת֙ כֶּ֔סֶף וְ/שִׁבְעִ֖ים הַ/מִּזְרָ֣ק הָ/אֶחָ֑ד כֹּ֚ל כֶּ֣סֶף הַ/כֵּלִ֔ים אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: ta
  text: ஒவ்வொரு வெள்ளித் தட்டும் நூற்று முப்பது சேக்கல் எடை கொண்டிருந்தது; ஒவ்வொரு கிண்ணமும் எழுபது சேக்கல் எடை கொண்டிருந்தது. வெள்ளியாலான அந்தப் பாத்திரங்களின் மொத்த எடை, பரிசுத்த இடத்தின் சேக்கல் அளவின்படி[a], இரண்டாயிரத்து நானூறு சேக்கலாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்தின் சேக்கல் கணக்கின்படி.”
    reason: எபிரெய בְּשֶׁקֶל הַקֹּדֶשׁ பயன்படுத்தப்படும் எடைத் தரத்தைச் சுட்டுகிறது. “அளவின்படி” மற்றும் “கணக்கின்படி” இரண்டும் சாத்தியமான தமிழ் வழங்கல்கள்.
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: நூற்று முப்பது
  rationale: எபிரெயச் சொல் வரிசை சொற்படியாக ‘முப்பதும் நூறும்’ என்றாலும், தமிழின் இயல்பான எண் வரிசையில் பொருள் தெளிவாக வழங்கப்பட்டது.
- source_word: הַקְּעָרָה הָאַחַת
  choice: ஒவ்வொரு வெள்ளித் தட்டும்
  rationale: இப்பட்டியல் சூழலில் பெயர்ச்சொல்லுடன் வரும் ‘ஒன்று’ பகிர்ந்தளிக்கும் பொருளில், ஒவ்வொரு தட்டின் எடையையும் குறிக்கிறது. כֶּסֶף அதன் பொருள் வெள்ளி என்பதைக் காட்டுகிறது.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: ஒவ்வொரு கிண்ணமும்
  rationale: מִזְרָק சடங்கு பயன்பாட்டுக்குரிய கிண்ணம் அல்லது கலத்தைக் குறிக்கலாம். அதன் குறிப்பிட்ட பயன்பாட்டை தேவையின்றி நிர்ணயிக்காமல் ‘கிண்ணம்’ என வழங்கப்பட்டது; ‘ஒன்று’ இங்கும் பகிர்ந்தளிக்கும் பொருளில் உள்ளது.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: அந்தப் பாத்திரங்களிலிருந்த வெள்ளியின் மொத்த எடை
  rationale: כֹּל மொத்தத்தையும், כֵּלִים பாத்திரங்களையும் குறிக்கின்றன. அடுத்து எடை அளவு வருவதால், தமிழில் இயல்பாக ‘மொத்த எடை’ வெளிப்படுத்தப்பட்டது.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: இரண்டாயிரத்து நானூறு
  rationale: எண்ணின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் கணக்கின்படி
  rationale: בְּ இங்கு பயன்படுத்தப்பட்ட எடைத் தரத்தைச் சுட்டுகிறது; ‘கணக்கின்படி’ என்பது தமிழில் தெளிவான இயல்பான வடிவம். ‘பரிசுத்த இடம்’ என்பது הַקֹּדֶשׁ என்பதன் இடச்சார்ந்த பொருளைப் பாதுகாக்கிறது.
