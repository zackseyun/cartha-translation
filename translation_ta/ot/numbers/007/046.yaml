lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: வெள்ளாடு
  rationale: இந்த எபிரெயக் கூட்டுச்சொல் ஆண் ஆட்டைக் குறிக்கிறது. நவீனத் தமிழில் ‘வெள்ளாடு’ என்பது ஆண் பாலினத்தைக் காக்கும் இயல்பான, தெளிவான சொல்.
- source_word: אֶחָד
  choice: ஒரு
  rationale: எண்ணிக்கை மூலத்தில் வெளிப்படையாக உள்ளது; எண்ணிக்கையிட்ட பலிப் பட்டியலின் நடையைத் தக்கவைக்க ‘ஒரு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: ஆசாரச் சூழலில் חַטָּאת என்பது பொதுவாகப் பாவம் தொடர்பான குறிப்பிட்ட பலியைக் குறிக்கும் தொழில்நுட்பச் சொல். לְ முன்னொட்டு அதன் நோக்கம் அல்லது ஒதுக்கீட்டைச் சுட்டுவதால் ‘பலிக்காக’ என வழங்கப்பட்டது.
theological_decisions:
- issue: பலியியல் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்திற்காக
  rationale: ஆசாரிய பலிப் பட்டியல்களில் חַטָּאת என்பது வெறும் ‘பாவம்’ என்பதைக் காட்டிலும், பாவம் தொடர்பாகச் செலுத்தப்படும் குறிப்பிட்ட பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது அந்த ஆசாரப் பொருளைத் தெளிவாக்குகிறது; பின்னாளைய குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: எண்ணிக்கையிட்ட காணிக்கைப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இறுதி அரைப்புள்ளி போன்ற தொடர்ச்சிப் பட்டியல் நிறுத்தமும் தக்கவைக்கப்பட்டுள்ளது.
