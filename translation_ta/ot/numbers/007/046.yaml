    issue: ‘வெள்ளாடு’ does not explicitly mark the animal as male.
    rationale: שְׂעִיר עִזִּים specifically denotes a male goat in this sacrificial inventory. ‘வெள்ளாட்டுக்கடா’ makes this source feature clear in modern Tamil.
  - severity: low
    issue: ‘பாவநிவாரணப் பலி’ adds an explanatory ‘removal/atonement’ nuance beyond the compact technical term.
    rationale: While contextually defensible, ‘பாவப்பலி’ more directly represents חַטָּאת as ‘sin offering’ and avoids over-specifying the sacrificial function.
