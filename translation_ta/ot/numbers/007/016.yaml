lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கிடாய்
  rationale: இந்த எபிரெயச் சேர்க்கை சொல்லுக்கு சொல் ‘வெள்ளாடுகளில் ஒரு முடிவளர்ந்த ஆண்’ என்று இருந்தாலும், பலியிடப்படும் ஆண் வெள்ளாட்டைக் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் ‘ஆட்டுக்கிடாய்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘வெள்ளாட்டுக்கடா’ என்பது இன்னும் வெளிப்படையான மாற்று.
- source_word: אֶחָד
  choice: ஓர்
  rationale: காணிக்கைகளின் எண்ணிக்கையைப் பட்டியலிடும் இப்பகுதியின் நடையைப் பாதுகாக்க எண்ணுப்பெயர் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலியீட்டுச் சூழலில் חַטָּאת என்பது பொதுவாக வெறும் ‘பாவம்’ என்பதல்ல, பாவத்திற்கான குறிப்பிட்ட பலியைக் குறிக்கிறது. לְ முன்னொட்டின் நோக்கப் பொருளை ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חַטָּאת என்பதன் பலியீட்டுப் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவபலியீடு / பாவத்திற்கான பலி
  rationale: இங்கு சொல் ஒரு குறிப்பிட்ட பலிவகையைச் சுட்டுகிறது. ‘பாவநிவாரணப் பலி’ என்பது தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்கதாக இருந்து, அதை வெறும் கருத்தரீதியான ‘பாவம்’ என்று மாற்றுவதைத் தவிர்க்கிறது; பலியின் செயல்முறையை இதற்கு மேலாக விளக்கி இறையியல் பதற்றத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எண்ணிக்கைப் பட்டியலின் சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணுகிறது. ‘ஓர்’ என்பது உயிரெழுத்தில் தொடங்கும் பெயருக்கு முன் இயல்பாகப் பயன்படுத்தப்பட்டது; அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
