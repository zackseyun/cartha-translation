  text: one male goat for a sin offering;[a]
translation:
  language: ta
  text: பாவநிவாரணப் பலிக்காக ஒரு வெள்ளாட்டுக்கடா;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலிக்காக.’ பலியிடல் சூழல்களில் எபிரெயச் சொல் பாவத்தையும் சடங்குத் தீட்டையும் கையாளும் பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயச் சொற்றொடர் பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கிறது. நவீன தமிழில் ‘ஆட்டுக்கடா’ இயல்பாகவும் ஆண் விலங்கு என்பதைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: எண்ணிக்கைப் பட்டியலின் அமைப்பைப் பாதுகாக்க ‘ஒன்று’ என்ற எண்ணுப் பொருள் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது; பெயருக்கு முன் ‘ஓர்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலியிடல் சூழலில் חַטָּאת என்பது வெறும் ‘பாவம்’ என்பதைக் காட்டிலும் பாவம் அல்லது சடங்குத் தீட்டைக் கையாளும் பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ தமிழில் அடையாளம் காணத்தக்கதாகவும் வழிபாட்டுச் சூழலைத் தெளிவுபடுத்துவதாகவும் உள்ளது.
theological_decisions:
- issue: பலியிடல் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இங்கு அந்தச் சொல் பாவத்தையே அல்ல, பாவம் அல்லது சடங்குத் தீட்டுடன் தொடர்புடைய பலியைக் குறிக்கிறது. பரவலாகப் புரிந்துகொள்ளப்படும் ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, சடங்குத் தூய்மைப்படுத்தல் சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், எண்ணிக்கை 7-இன் திரும்பத் திரும்ப வரும் பலிப்பொருள் பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் தக்கவைத்துள்ளது.
