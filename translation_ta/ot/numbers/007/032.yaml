  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ta
  text: தூபவர்க்கத்தால் நிறைந்த, பத்துச் சேக்கல் எடையுள்ள ஒரு தங்கக் கிண்ணம்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘ஒரு கிண்ணம், பத்து, தங்கம், தூபவர்க்கத்தால் நிறைந்தது.’ சுற்றியுள்ள வசனங்களில் மீண்டும் வரும் காணிக்கை வாய்பாட்டின் அடிப்படையில் ‘சேக்கல்’ மற்றும் ‘எடையுள்ள’ ஆகியவை சேர்க்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு மனித உள்ளங்கையை அல்ல, தூபவர்க்கத்தைத் தாங்கும் சிறிய வழிபாட்டுப் பாத்திரத்தைக் குறிக்கிறது; நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பெண்பால் பெயர்ச்சொல்லுடன் வரும் ‘ஒன்று’ என்ற எண்ணிக்கையைத் தமிழில் இயல்பாக ‘ஒரு’ என வழங்குகிறது.
- source_word: עֲשָׂרָה
  choice: பத்துச் சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் நேரடியாக ‘பத்து’ என்று மட்டுமே உள்ளது; சுற்றியுள்ள காணிக்கைப் பட்டியலின் மீளும் வாய்பாட்டிலிருந்து எடை அலகான ‘சேக்கல்’ புரிந்துகொள்ளப்படுகிறது. தமிழில் அளவைத் தெளிவாக்க ‘எடையுள்ள’ என்பதும் சேர்க்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கக்
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைச் சுட்டுகிறது; ‘தங்கக் கிண்ணம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מְלֵאָה
  choice: நிறைந்த
  rationale: பாத்திரத்தின் உள்ளடக்கத்தை விவரிக்கும் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: קְטֹרֶת
  choice: தூபவர்க்கம்
  rationale: ஆசரிப்புக்கூடார வழிபாட்டில் எரிக்கப்படும் நறுமணக் கலவையைக் குறிக்கிறது; ‘தூபம்’ என்பதைக் காட்டிலும் பொருளின் கலவைத் தன்மையைத் தெளிவாகச் சுட்டுகிறது.
