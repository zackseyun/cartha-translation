translation:
  language: ta
  text: பாவநிவாரணப் பலிக்காக ஒரு வெள்ளாட்டுக்கடா;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: வெள்ளாட்டுக்கடா
  rationale: இந்த எபிரெயக் கூட்டுச்சொல் பலிச் சூழலில் ஆண் வெள்ளாட்டைக் குறிக்கிறது. ‘வெள்ளாட்டுக்கடா’ என்பது அதன் இனத்தையும் பாலினத்தையும் இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: பலிப்பொருட்களை எண்ணிக் கூறும் பட்டியல் நடையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: இங்கு חַטָּאת என்பது பொதுவான ‘பாவம்’ என்ற கருத்தை அல்ல, குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; לְ முன்னொட்டு அதன் நோக்கத்தை ‘-க்காக’ எனக் காட்டுகிறது.
theological_decisions:
- issue: חַטָּאת என்ற பலியியல் சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்துக்கான பலி
  rationale: எண்ணாகமம் 7-இன் சடங்குப் பட்டியல் சூழலில் இது ஒரு குறிப்பிட்ட பலிவகையின் பெயர். ‘பாவநிவாரணப் பலி’ அந்தச் சடங்குப் பொருளைத் தெளிவாகக் காட்டுகிறது; வெறும் ஒழுக்கக் கருத்தாக மாற்றுவதில்லை.
translation_notes:
  register: சுருக்கமான பலிப்பட்டியல் நடை பாதுகாக்கப்பட்டுள்ளது. மொழிநடை நவீனமானதும் கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதுமாக உள்ளது.
