  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ta
  text: தூபப்பொருளால் நிறைந்த, பத்துச் சேக்கல் எடையுள்ள ஒரு பொற்கிண்ணம்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பொன் தட்டு’ அல்லது ‘ஒரு பொன் கலம்.’ சில மரபுவழி மொழிபெயர்ப்புகள் ‘கரண்டி’ என்று மொழிபெயர்க்கின்றன; ஆனால் எபிரெயச் சொல் பொதுவாக வழிபாட்டுச் சடங்கில் பயன்படும் சிறிய பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு இச்சொல் மனித உள்ளங்கையைக் குறிக்காமல், வழிபாட்டில் பயன்படுத்தப்பட்ட சிறிய சடங்குப் பாத்திரத்தைக் குறிக்கிறது. நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; அதன் துல்லிய வடிவம் உறுதியாகாததால் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்ற ஒருமைப் பெயர்ச்சொல்லுடன் பொருந்தும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה
  choice: பத்துச் சேக்கல் எடையுள்ள
  rationale: மூலத்தில் ‘பத்து’ என்று மட்டும் இருந்தாலும், எண்ணாகமம் 7-இன் திரும்பத் திரும்ப வரும் பட்டியல் சூழலில் எடையலகான ‘சேக்கல்’ விடுபட்ட நிலையில் புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருளைத் தெளிவாக்க ‘எடையுள்ள’ என்பதும் சேர்க்கப்பட்டுள்ளது.
- source_word: זָהָב
  choice: பொன்
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு; ‘பொற்கிண்ணம்’ என்பது இயல்பான தமிழ்ச் சேர்க்கை.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பாத்திரத்தின் உள்ளடக்க நிலையைச் சுட்டும் பெயரடைப் பயனை தமிழில் இயல்பான வினைமுற்றாக வழங்குகிறது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: வழிபாட்டில் எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கிறது. ‘தூபம்’ என்பதைக் காட்டிலும் ‘தூபப்பொருள்’ என்பது இங்கு பாத்திரத்தை நிரப்பிய பொருள் என்ற கருத்தைத் தெளிவாக்குகிறது.
