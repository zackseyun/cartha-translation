translation:
  language: ta
  text: பத்து சேக்கல்[a] எடையுள்ள ஒரு தங்கக் கிண்ணம், தூபப்பொருளால் நிறைந்தது;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு தங்கக் கிண்ணம், பத்து தங்கம்” என்று உள்ளது; சுற்றியுள்ள வசனங்களில் வரும் காணிக்கைப் பட்டியல் வாய்பாட்டிலிருந்து “சேக்கல்” என்பது உள்ளடங்கிய எடையளவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு மனித உள்ளங்கையைக் குறிக்காமல், தூபப்பொருளைத் தாங்கும் சிறிய வழிபாட்டுப் பாத்திரத்தைக் குறிக்கிறது. நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பெண்பால் பெயர்ச்சொல்லுடன் பொருந்தும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள தங்க
  rationale: எபிரெய உரையில் ‘சேக்கல்’ வெளிப்படையாக இல்லை; எனினும் சுற்றியுள்ள காணிக்கைப் பட்டியல் வாய்பாட்டில் எண்ணும் உலோகமும் பாத்திரத்தின் எடையைக் குறிக்கின்றன. தமிழில் பொருள் தெளிவாக இருக்க ‘சேக்கல்’ அடிக்குறிப்புடன் சேர்க்கப்படுகிறது.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பாத்திரத்தின் உள்ளடக்கத்தைக் குறிக்கும் பயனிலைப் பெயரடை; தமிழில் முழு வாக்கியமாக இயல்பாக அமைக்கப்பட்டது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: திருக்கூடார வழிபாட்டில் எரிக்கப்படும் நறுமணக் கலவையைத் தெளிவாகக் குறிக்கிறது; ‘தூபம்’ என்பதைக் காட்டிலும் பொருளையே சுட்டுகிறது.
