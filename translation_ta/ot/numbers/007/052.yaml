translation:
  language: ta
  text: பாவப் பலிக்காக ஒரு வெள்ளாட்டுக்கடா;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயச் சேர்க்கை பலிச் சூழலில் வெள்ளாட்டு இனத்தைச் சேர்ந்த ஆண் ஆட்டைக் குறிக்கிறது. நவீன தமிழில் ‘ஆட்டுக்கடா’ என்பது அதன் இனத்தையும் பாலினத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: பலிப் பொருட்களை எண்ணிப் பட்டியலிடும் இச்சூழலில் எண் ஒன்றை வெளிப்படையாகக் காக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலியிடும் சூழலில் חַטָּאת என்பது பொதுவாகப் பாவத்திற்கான குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; לְ முன்னொட்டின் நோக்கப் பொருளை ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חַטָּאת என்பதன் பலிசார் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவப் பலி
  rationale: இங்கு அந்தச் சொல் அருவமான ‘பாவம்’ என்பதைக் காட்டிலும் ஒரு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ அதன் செயல்நோக்கைத் தெளிவுபடுத்துகிறது; அதேவேளையில் குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: சுருக்கமான பலிப் பட்டியல் நடையைப் பேணி, நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. மூலத்தில் உள்ள இறுதி பட்டியல் நிறுத்தத்திற்கிணங்க அரைப்புள்ளி பயன்படுத்தப்பட்டது.
