source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: ta
  text: 'மேலும், சமாதானப் பலிக்காக: இரண்டு மாடுகள்,[a] ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஓராண்டு வயதுடைய ஐந்து ஆட்டுக்குட்டிகள். இதுவே தேயுவேலின் மகன் எலியாசாபின் காணிக்கை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானப் பலி” என்பதை “உறவுப் பலி” அல்லது “நல்வாழ்வுப் பலி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்புச்சொல்லும் முன்னொட்டும் பலிப்பட்டியலின் அடுத்த உருப்படியை அறிமுகப்படுத்துகின்றன. שְׁלָמִים என்பதற்கான மரபான பலியியல் சொல்லாக ‘சமாதானப் பலி’ தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பிடாத மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; ஆகவே ‘மாடுகள்’ என்பது தேவையற்ற பாலின விவரத்தைச் சேர்க்காது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது; நவீனத் தமிழில் ‘செம்மறியாட்டுக் கடாக்கள்’ அந்த வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கிறது; ‘வெள்ளாட்டுக் கடாக்கள்’ பலியியல் பட்டியலில் பாலின வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஓராண்டான ஐந்து ஆட்டுக்குட்டிகள்
  rationale: ‘ஒரு ஆண்டின் குட்டிகள்’ என்ற எபிரேய மரபுத்தொடரின் இயல்பான தமிழாக்கம்; வயது நிபந்தனையைப் பாதுகாக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இதுவே ... காணிக்கை
  rationale: எபிரேயத்தின் சுட்டுப்பெயர் வலிமையை ‘இதுவே’ தக்கவைக்கிறது; קָרְבָּן என்பதற்கு பலியியல் சூழலில் இயல்பான ‘காணிக்கை’ பயன்படுத்தப்படுகிறது.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: தெகுவேலின் மகன் எலியாசாப்
  rationale: தனிப்பெயர்களும் தந்தைவழி அடையாளமும் எபிரேய ஒலிப்புக்கு அண்மையான, தமிழில் வாசிக்கக்கூடிய வடிவில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: הַשְּׁלָמִים என்ற பலியியல் சொல்லின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி; நல்வாழ்வுப் பலி
  rationale: இந்தச் சொல் சமாதானம், முழுமை, நல்வாழ்வு, பகிர்ந்துண்ணும் உறவு ஆகிய பொருள் நிழல்களைக் கொண்டிருக்கலாம். முதன்மை உரையில் அறிமுகமான மரபுச் சொல் வைக்கப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வைத்துள்ளது. செம்மறியாடு மற்றும் வெள்ளாடு, அவற்றின் ஆண் பாலினம், குட்டிகளின் வயது ஆகிய வேறுபாடுகள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
