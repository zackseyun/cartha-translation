  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: ta
  text: 'மேலும், சமாதானப் பலிக்காக[a]: இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள் ஐந்து. இதுவே செதேயூரின் மகன் எலிசூரின் காணிக்கை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஐக்கியப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: மேலும், சமாதானப் பலிக்காக
  rationale: வாவ் இணைப்பை ‘மேலும்’ என்றும், லாமேத் முன்னொட்டின் பட்டியல் சார்ந்த நோக்கத்தை ‘பலிக்காக’ என்றும் வெளிப்படுத்துகிறது. שְׁלָמִים என்பதற்கான மரபான பலியியல் சொல்லாக ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினம் அல்லது பயன்பாட்டைத் தனிப்படுத்தாமல் மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; ஆகவே ‘எருதுகள்’ என்று மிகையாகக் குறிப்பாக்காமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ பாலினத்தையும் பலியியல் பட்டியலின் துல்லியத்தையும் காக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתּוּדִים ஆண் வெள்ளாடுகளைக் குறிக்கிறது; செம்மறியாட்டுக் கடாக்களிலிருந்து தெளிவாக வேறுபடுத்தப்பட்டுள்ளது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள் ஐந்து
  rationale: כְּבָשִׂים என்ற ஆண்பால் வடிவத்தையும், בְּנֵי שָׁנָה என்ற வயதுக் குறிப்பையும் வெளிப்படையாகக் காக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இதுவே … காணிக்கை
  rationale: எபிரெய மொழியின் வினையற்ற அடையாள வாக்கியத்தை இயல்பான தமிழில் நிகழ்நிலைத் தன்மை கெடாமல் வழங்குகிறது; קָרְבַּן என்பதற்கு பொதுவான பலியியல் சொல் ‘காணிக்கை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: செதேயூரின் மகன் எலிசூர்
  rationale: பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டு, patronymic அமைப்பு இயல்பான தமிழ் உடைமைத் தொடராக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியியல் சொல்லின் பொருள் பரப்பு
  choice: சமாதானப் பலி
  alternative: ஐக்கியப் பலி; நல்வாழ்வுப் பலி
  rationale: இந்தச் சொல் சமாதானம், நல்வாழ்வு, பங்குறவு ஆகிய கருத்துகளோடு தொடர்புடையது. முதன்மை உரையில் பரவலாக அறியப்பட்ட மரபுச் சொல்லை வைத்துக்கொண்டு, அதன் உண்மையான பொருள் பரப்பை அடிக்குறிப்பில் மறைக்காமல் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலியியல் பட்டியலின் மீளுருவாக்கத்தையும் எண்ணிக்கைகளையும் தெளிவாகக் காக்கும் கண்ணியமான நடை. எபிரெயத்தில் வெளிப்படையான வினை இல்லாவிட்டாலும், தமிழில் முழுமையான பட்டியல் வாக்கியமாக அமைய ‘கொண்டுவரப்பட்டன’ சேர்க்கப்பட்டுள்ளது; இது சூழலிலுள்ள காணிக்கை கொண்டுவருதலை வெளிப்படுத்துகிறது.
