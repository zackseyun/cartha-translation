translation:
  language: ta
  text: 'அப்போது யெகோவா மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... கூறியது
  rationale: தொடர்கதை இணைப்பான וַ־ஐ இயல்பான தமிழில் ‘பின்பு’ என்றும், אמר வினையை ‘கூறு’ என்றும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள இறைப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு செலுத்தப்படும் நபரை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: எபிரெய மேற்கோள் அறிமுகச் சூத்திரத்தை தமிழில் தேவையற்ற ‘சொல்லி’ என்ற மறுபதிப்பின்றி, அடுத்துவரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் முக்காற்புள்ளியால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைப் பெயர் יהוה-ன் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: தனிப்பட்ட இறைப் பெயருக்கும் பொதுப் பட்டத்துக்கும் உள்ள மூலமொழி வேறுபாட்டைப் பாதுகாக்கிறது; இவ்வசனத்தில் எந்தக் கோட்பாட்டுச் சிறப்புரையையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; சுருக்கமான, கண்ணியமான கதையுரை. அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
