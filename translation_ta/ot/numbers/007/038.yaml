  register: நவீன நிலையான தமிழ்; வழிபாட்டு பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. மூலத்தின் சுருக்கமான எடைச் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
