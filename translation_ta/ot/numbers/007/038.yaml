  yaml_path: translation/ot/numbers/007/038.yaml
  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: ta
  text: பத்து சேக்கல் எடையுள்ள, தூபப்பொருளால் நிறைந்த ஒரு தங்கக் கிண்ணம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘ஒரு தங்கக் கிண்ணம், பத்து [தங்கம்], தூபப்பொருளால் நிறைந்தது.’ இச்சூழலில் இது சுருக்கமான எடைச் சொற்றொடர் என்பதால் ‘சேக்கல் எடையுள்ள’ என்று பொருள் தெளிவுபடுத்தப்பட்டுள்ளது. ‘கிண்ணம்’ என்பதற்கு ‘சிறு பாத்திரம்’ அல்லது மரபுவழியாக ‘கரண்டி’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு கை அல்லது உள்ளங்கை அல்ல, வழிபாட்டுப் படையலுக்குப் பயன்படுத்தப்பட்ட சிறிய கொள்கலனைக் குறிக்கிறது. நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘கரண்டி’ என்பது உணவு உண்ணும் கருவி என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்பதைக் குறிக்கும் எண்ணுப்பெயர்; நேரடியாக ‘ஒரு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள
  rationale: ‘பத்து—தங்கம்’ என்ற சுருக்கமான எபிரெய எடைச் சொற்றொடர், உடனடியான சூழலிலும் இணையான வசனங்களிலும் சேக்கல் எடையைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘சேக்கல் எடையுள்ள’ என நிரப்பப்பட்டுள்ளது.
- source_word: זָהָב
  choice: தங்கக்
  rationale: கொள்கலன் செய்யப்பட்ட பொருளைக் குறிக்கிறது; தமிழில் இயல்பான பெயரடைத் தொகையாக வழங்கப்பட்டுள்ளது.
- source_word: מְלֵאָה
  choice: நிறைந்த
  rationale: கிண்ணத்தின் உள்ளடக்கத்தை விவரிக்கும் பெயரடை; சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: வழிபாட்டில் புகையாக எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கிறது; ‘தூபம்’ என்பதைக் காட்டிலும் பொருளையே தெளிவாகச் சுட்டுகிறது.
