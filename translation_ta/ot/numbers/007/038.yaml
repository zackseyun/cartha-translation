  source_fidelity: மூல எபிரெயத்தின் பட்டியல்-நடையைத் தக்கவைத்துள்ளது. כַּף ஒரு சிறிய வழிபாட்டுப் பாத்திரம் என்ற பொருளில் ‘கிண்ணம்’ எனச் சரியாக வழங்கப்பட்டுள்ளது. עֲשָׂרָה זָהָב என்ற சூழல் சார்ந்த சுருக்கமான எடைச் சொற்றொடருக்கு ‘பத்து சேக்கல் எடையுள்ள’ என்பது நியாயமான, தெளிவான நிரப்பாகும்; பாத்திரம் தங்கத்தால் ஆனது என்பதும் ‘தங்கக் கிண்ணம்’ மூலம் வெளிப்படுகிறது. ‘தூபப்பொருளால் நிறைந்த’ என்பது מְלֵאָה קְטֹרֶת என்பதற்கு நம்பகமான மொழிபெயர்ப்பு.
  naturalness: ‘பத்து சேக்கல் எடையுள்ள, தூபப்பொருளால் நிறைந்த ஒரு தங்கக் கிண்ணம்’ நவீன நிலையான தமிழில் இயல்பாகவும், காணிக்கைப் பட்டியலுக்கேற்ற சுருக்கமான நடையிலும் உள்ளது. ‘தூபப்பொருள்’ என்பது வெறுமனே புகையைக் குறிக்காமல் எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கும் வகையில் தெளிவாக உள்ளது.
  terminology: ‘சேக்கல்’, ‘தங்கக் கிண்ணம்’, ‘தூபப்பொருள்’ ஆகிய சொற்கள் சூழலுக்கு ஏற்றவை. ‘கிண்ணம்’ என்பதற்கான மாற்று வாசிப்புகளான சிறு பாத்திரம்/கரண்டி அடிக்குறிப்பில் உரிய முறையில் சுட்டப்பட்டுள்ளன; ‘கரண்டி’யை முதன்மை உரையில் தவிர்ப்பது பொருத்தமானது.
