base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: ta
  text: 'அவன் தன் காணிக்கையைச் சமர்ப்பித்தான்: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a]; பரிசுத்த சேக்கல் அளவின்படி எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b][c]; அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெயுடன் கலக்கப்பட்ட நுண்மாவால் நிறைந்திருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெள்ளித் தட்டுப்பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (קַעֲרַת כֶּסֶף).
    reason: lexical_alternative
  - marker: b
    text: ‘கலயம்’ என்றும் மொழிபெயர்க்கலாம் (מִזְרָק).
    reason: lexical_alternative
  - marker: c
    text: ‘பரிசுத்த சேக்கல்’ என்பது பரிசுத்த ஆலயத்தில் பயன்படுத்தப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת קָרְבָנוֹ
  choice: அவன் தன் காணிக்கையைச் செலுத்தினான்
  rationale: இப்பலியிடல் சூழலில் ஹிபில் வினைச்சொல் காணிக்கையை அணுகக் கொண்டுவருதல் அல்லது முறையாகச் சமர்ப்பித்தல் என்று பொருள்படுகிறது. ‘காணிக்கையைச் செலுத்தினான்’ என்பது சடங்குசார் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: קַעֲרַת כֶּסֶף
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קְעָרָה என்பது அகலமான, ஒப்பீட்டளவில் ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கலாம். பட்டியல் சூழலில் ‘தட்டு’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘தட்டுப்பாத்திரம்’ என்பதும் சாத்தியம்.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: பெண்பால் பின்னொட்டு வெள்ளித் தட்டின் எடையைக் குறிக்கிறது. தமிழ் தொடரில் பெயருக்கு முன் எடையைக் குறிப்பிடுவது இயல்பாக இருக்கிறது.
- source_word: מִזְרָק
  choice: வெள்ளிக் கலயம்
  rationale: இது வழிபாட்டுச் சூழலில் பயன்படுத்தப்பட்ட ஆழமான பாத்திரம். ‘கலயம்’ அதன் பாத்திரத் தன்மையையும் இச்சூழலின் மதிப்புமிக்க நடையையும் காக்கிறது; துல்லிய வடிவம் உறுதியல்ல என்பதால் மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் அளவின்படி
  rationale: இத்தொடர் பரிசுத்த இடத்தில் ஏற்றுக்கொள்ளப்பட்ட எடைத் தரநிலையைக் குறிக்கிறது. ‘அளவின்படி’ என்பது சேக்கல் நாணய மதிப்பை அல்ல, எடைத் தரத்தை இங்கு குறிப்பிடுகிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிறைந்திருந்தன
  rationale: இரு பாத்திரங்களையும் வெளிப்படையாகச் சேர்த்துக் குறிப்பிடும் எபிரெய இருமை உணர்வைத் தமிழ் வாக்கியம் காக்கிறது.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட மெல்லிய மாவு
  rationale: סֹלֶת காணிக்கைக்காக நன்றாக அரைக்கப்பட்ட மாவையும், בלל எண்ணெயோடு கலத்தலையும் குறிக்கின்றன. இந்த வடிவம் நவீன தமிழில் தெளிவானது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה பொதுவான பரிசை அல்ல, குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது.
