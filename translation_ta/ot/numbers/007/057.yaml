translation_notes:
  register: நவீனத் தரத் தமிழில், பலிப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடையைக் கொண்டது. எபிரெய வசனம் வினையில்லா பட்டியலாக இருந்தாலும், தொடர்ச்சியான தமிழ் உரையில் இயல்பாக அமைய ‘செலுத்தினான்’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு உரையில் இணைக்கப்பட்டுள்ளது.
