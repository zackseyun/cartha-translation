source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ta
  text: மாட்டு மந்தையிலிருந்து ஒரு காளைமாடு[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுள்ள ஒரு ஆண் செம்மறியாட்டுக் குட்டி—தகனபலிக்காக;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “ஒரு காளைமாடு, மாட்டு மந்தையின் மகன்.” இது மாட்டு மந்தையைச் சேர்ந்த காளையைக் குறிக்கும் மரபுத்தொடர்; “ஒரு இளங்காளை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: காளைமாடு
  rationale: பலிப் பட்டியல் சூழலில் ஆண் மாட்டைக் குறிக்கும் எளிய, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு பலிவிலங்கும் ஒன்றே என்பதைச் சுட்டும் எண்ணுப்பெயர்.
- source_word: בֶּן בָּקָר
  choice: மந்தையிலிருந்து
  rationale: சொல்லுக்கு சொல் ‘மாட்டு மந்தையின் மகன்’ என்றாலும், இது மாட்டு மந்தையைச் சேர்ந்த விலங்கு என்பதைக் குறிக்கும் மரபுத்தொடர். ‘காளைமாடு’ என்பதுடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலிக்குரிய வளர்ந்த ஆண் செம்மறியாட்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: இச்சொல் பலிச் சூழலில் பொதுவாக ஆண் ஆட்டுக்குட்டியைக் குறிக்கிறது; தமிழில் இயல்பான பட்டியல் நடைக்காக ‘ஆட்டுக்குட்டி’ என வழங்கப்பட்டது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: விலங்கு அதன் முதல் ஆண்டில், அதாவது ஓராண்டு வயதுடையது என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான வேதாகமத் தமிழ்ச் சொல்; לְ குறிக்கும் நோக்கம் அல்லது பங்கையும் இயல்பாக வெளிப்படுத்துகிறது.
