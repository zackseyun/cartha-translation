revisions:
- from: மந்தையிலிருந்து ஒரு காளைமாடு[a], ஒரு செம்மறியாட்டுக் கடா, ஓராண்டான ஒரு ஆட்டுக்குட்டி—இவற்றைத் தகனபலியாகச் செலுத்தினான்;
  to: மாட்டு மந்தையிலிருந்து ஒரு காளைமாடு[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுள்ள ஒரு ஆண் செம்மறியாட்டுக் குட்டி—தகனபலிக்காக;
  rationale: The revision retains the Hebrew list structure and sacrificial terminology, corrects the lamb’s sex and species, and removes an unexpressed verb. The footnote remains anchored to ‘காளைமாடு’ and explains the literal idiom without treating it as a literal biological expression.
