    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயக் கூட்டுச்சொல் சொற்படியாக ‘வெள்ளாடுகளில் ஒரு மயிரடர்ந்த ஆண்’ என இருந்தாலும், பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் ‘ஆட்டுக்கடா’ இயல்பாகவும் தெளிவாகவும் உள்ளது; அடிக்குறிப்பு அதன் சொற்படியான வடிவத்தைத் தருகிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: எண்ணிக்கையை வெளிப்படையாகத் தக்கவைத்து, எண்ணாகமம் 7-இன் திரும்பத்திரும்ப வரும் பட்டியல் அமைப்பைப் பாதுகாக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலிச் சடங்கு சார்ந்த இச்சூழலில் חַטָּאת என்பது பொதுவாக வெறும் ‘பாவம்’ என்பதை அல்ல, பாவத்துக்குரிய பலிவகையைக் குறிக்கிறது. לְ முன்னொட்டு இங்கு ‘-க்காக’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பலிச் சடங்கு சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவப் பலி; பாவம்
  rationale: இது கோத்திரத் தலைவர்கள் செலுத்திய பலிப்பொருட்களின் பட்டியல் என்பதால், இச்சொல் பாவம் என்ற கருத்தை மட்டும் அல்லாமல் குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்கதாக இருப்பதுடன், பிற்காலக் கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்காமல் சடங்கு வகையைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிப்பட்டியலின் சுருக்கமான மற்றும் கண்ணியமான நடையைத் தக்கவைத்துள்ளது. ‘ஓர்’ என்பது மூலத்தின் எண்ணிக்கைக் குறிப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
