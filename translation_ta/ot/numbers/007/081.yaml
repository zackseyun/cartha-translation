translation_notes:
  register: நவீன நிலையான தமிழில், பலிப்பட்டியலின் சுருக்கமான எண்ணிக்கை நடையைப் பேணும் வகையில் வடிவமைக்கப்பட்டது. வசனம் தொடரும் பட்டியலின் ஓர் அங்கமாக இருப்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
