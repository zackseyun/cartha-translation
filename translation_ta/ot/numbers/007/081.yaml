  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ta
  text: மாட்டினத்தைச் சேர்ந்த ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுடைய ஆண் செம்மறியாட்டுக்குட்டி—தகனபலிக்காக;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: எருதுக்கூட்டத்திலிருந்து ஒரு காளை
  rationale: פַּר என்பது காளை அல்லது இளம் காளையைக் குறிக்கிறது; בֶּן בָּקָר அது மாட்டினத்தைச் சேர்ந்தது என்பதைச் சுட்டும் எபிரேய மரபுத்தொடர். இரண்டையும் இயல்பான தமிழில் வேறுபாடு குலையாமல் வழங்குகிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு பலிமிருகத்துக்கும் மீண்டும் வரும் எண்ணிக்கைக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலிச் சூழலில் வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கும்; ‘கடா’ மட்டும் பொதுவாகத் தோன்றக்கூடும் என்பதால் இனத்தைத் தெளிவுபடுத்துகிறது.
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: இச்சொல் செம்மறியாட்டின் ஆண் குட்டியைக் குறிக்கிறது. தமிழில் பாலினத்தைச் சேர்த்து இயல்பற்ற நீளத்தை உருவாக்காமல், பட்டியல் சூழலில் புரியும் பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான
  rationale: ‘தன் ஆண்டின் மகன்’ என்ற எபிரேய மரபுத்தொடர், ஓராண்டு வயதுடைய மிருகத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான வழிபாட்டுச் சொல்; ‘தகனபலி’ தமிழில் சுருக்கமாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
