- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டில் கொண்டுவந்து செலுத்தப்படும் பொருளைக் குறிக்கும் קָרְבָּן என்பதற்கு, இச்சூழலில் இயல்பானதும் தெளிவானதும் ‘காணிக்கை’ ஆகும்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קְעָרָה என்பது தட்டு, அகன்ற கிண்ணம் அல்லது ஆழமற்ற பாத்திரத்தைக் குறிக்கலாம். பட்டியலிடப்படும் இப்பாத்திரத்திற்கு ‘தட்டு’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: 'எபிரெயத்தின் ‘அதன் எடை: முப்பதும் நூறும்’ என்ற அமைப்பை இயல்பான தமிழ் எடைத் தொடராக வழங்குகிறது.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק என்பது திருப்பணியில் பயன்படும் கிண்ணம் அல்லது பாத்திரம். அதன் குறிப்பிட்ட பயன்பாட்டை முதன்மை உரையில் தேவையின்றி நிர்ணயிக்காமல் ‘கிண்ணம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இது வெள்ளிக் கிண்ணத்தின் எடையைக் குறிக்கிறது; தமிழில் பெயரெச்சத் தொடராகத் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடைமுறையின்படி
  rationale: இத்தொடர் பரிசுத்த இடத்தில் பின்பற்றப்பட்ட அதிகாரப்பூர்வ எடை அளவைக் குறிக்கிறது. ‘எடைமுறை’ என்பதைச் சேர்ப்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவை இரண்டும்
  rationale: முன்னர் குறிப்பிடப்பட்ட இரண்டு வெள்ளிப் பாத்திரங்களையும் வெளிப்படையாகச் சுட்டுகிறது.
- source_word: מְלֵאִים
