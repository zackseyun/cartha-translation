base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: பரிசுத்த இடத்தின் சேக்கல் அளவின்படி நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b]; அவை இரண்டும் எண்ணெயுடன் கலந்த மெல்லிய மாவால் தானியக் காணிக்கைக்காக நிறைந்திருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘அகன்ற கிண்ணம்’ அல்லது ‘ஆழமற்ற பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் (קַעֲרָה) இவ்வகையான பாத்திரத்தைப் பொதுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘தெளிப்புக் கிண்ணம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் (מִזְרָק) வேறு இடங்களில் திருப்பணியில் தெளிப்பதற்குப் பயன்படுத்தப்படும் பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
