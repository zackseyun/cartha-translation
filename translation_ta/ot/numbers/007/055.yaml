translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியல் போன்ற எபிரெய அமைப்பைத் தொடக்க முக்காற்புள்ளி வழியாகப் பாதுகாத்து, எடைக் குறிப்புகள் தமிழில் தெளிவாகத் தொடர்புபடுத்தப்பட்டுள்ளன.
