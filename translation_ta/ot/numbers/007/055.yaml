base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: பரிசுத்த இடத்தின் சேக்கல் அளவின்படி நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b][c]. அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெய் கலந்த நன்றாக அரைக்கப்பட்ட மாவால் நிரம்பியிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘ஆழம் குறைந்த பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: இது பரிசுத்த இடப் பணியில் பயன்படுத்தப்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது (מִזְרָק); ‘கலயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘பரிசுத்த இடத்தின் சேக்கலின்படி’; அதாவது, பரிசுத்த இடத்தில் ஏற்றுக்கொள்ளப்பட்ட எடைத் தரத்தின்படி.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பை குறிக்கும் קָרְבָּן என்பதற்கு இயல்பான, பரவலாகப் புரியும் சொல் ‘காணிக்கை’.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது; ‘தட்டு’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையின் எடைக் குறிப்பைத் தமிழின் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק பலியிடும் பணியில் பயன்படுத்தப்பட்ட ஒரு பாத்திரம்; ‘கிண்ணம்’ அதன் பாத்திர வடிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இத்தொடர் கிண்ணத்தின் எடையைக் குறிப்பிடுவதால், தமிழில் அந்தத் தொடர்பை வெளிப்படையாகக் காட்டுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் அளவின்படி
  rationale: அளவிடப் பயன்படுத்தப்பட்ட பரிசுத்த இடத்தின் அங்கீகரிக்கப்பட்ட சேக்கல் எடைத் தரத்தைக் குறிக்கிறது; மூலத்தின் வடிவமும் பொருளும் பாதுகாக்கப்படுகின்றன.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் நிரம்பியிருந்தன
  rationale: இரண்டு பாத்திரங்களையும் வெளிப்படையாகச் சுட்டும் எபிரெயப் பன்மை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட உயர்தர மாவைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெய் கலந்த
  rationale: மாவில் எண்ணெய் கலக்கப்பட்டிருந்தது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה குறிப்பாக தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
