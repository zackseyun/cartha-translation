- from: எருதுக்கூட்டத்திலிருந்து ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதான ஆட்டுக்குட்டி—இவை தகனபலிக்காக;
  to: மாட்டுமந்தையிலிருந்து ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதான ஆண் செம்மறியாட்டுக் குட்டி—தகனபலிக்காக;
