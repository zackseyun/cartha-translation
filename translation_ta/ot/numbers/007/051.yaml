  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ta
  text: மாட்டுமந்தையிலிருந்து ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதான ஆண் செம்மறியாட்டுக் குட்டி—தகனபலிக்காக;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: எருதுக்கூட்டத்திலிருந்து ஒரு காளை
  rationale: פַּר என்பது காளையைக் குறிக்கிறது; בֶּן־בָּקָר என்ற எபிரெய மரபுத்தொடர் அது எருதுக்கூட்டத்தைச் சேர்ந்த மாடு என்பதைச் சுட்டுகிறது. இரு கூறுகளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: பலிக்கான பட்டியலில் இது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும் வழக்கமான சொல்; ‘கடா’ பாலினத்தையும் தெளிவுபடுத்துகிறது.
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: இது பலியிடப்படும் செம்மறியாட்டுக் குட்டியைக் குறிக்கிறது. தமிழில் இயல்பான பட்டியல் நடைக்காக ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டுள்ளது; சூழலும் எபிரெயப் பெயர்ச்சொல்லும் ஆண் குட்டியையே சுட்டுகின்றன.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ஒரு வயதான
  rationale: சொல்லுக்கு சொல் ‘தன் ஆண்டின் மகன்’ என்ற மரபுத்தொடர், ஒரு வயது நிறைந்த அல்லது முதல் ஆண்டிலுள்ள விலங்கைக் குறிக்கிறது; ‘ஒரு வயதான’ என்பது தெளிவான நவீன தமிழ்.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான வழிபாட்டுச் சொல்; தமிழ் வேதாகம நடையில் ‘தகனபலி’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒவ்வொரு விலங்கின் எண்ணிக்கையையும் குறிக்கும் மீளுரைத்த எண்ணுப்பெயர் தமிழிலும் ஒவ்வொரு உருப்படிக்கும் தக்கவைக்கப்பட்டுள்ளது.
