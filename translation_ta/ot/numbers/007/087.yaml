  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: ta
  text: 'தகனபலிக்கான மாடுகள் அனைத்தும்: பன்னிரண்டு காளைகள், பன்னிரண்டு செம்மறியாட்டுக் கடாக்கள், ஒரு வயதுடைய பன்னிரண்டு செம்மறியாட்டுக் குட்டிகள், அவற்றுக்குரிய தானியக் காணிக்கை; மேலும், பாவப் பலியாக[a] பன்னிரண்டு வெள்ளாட்டுக் கடாக்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.” חַטָּאת என்ற எபிரெயச் சொல் பாவத்திலிருந்து மட்டுமல்ல, தீட்டிலிருந்து தூய்மைப்படுத்துவதையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: மாடுகள் அனைத்தும்
  rationale: காளைகள் முதலான மாட்டினத்தை மொத்தமாகக் குறிக்கும் எபிரெயக் கூட்டுப்பொருளையும், இவ்வசனத்தின் தொகுப்புப் பட்டியல் நடையையும் காக்கிறது.
- source_word: לָעֹלָה
  choice: தகனபலிக்கான
  rationale: முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் வழக்கமான வேள்விச் சொல்லாகவும், לְ குறிக்கும் நோக்கத்தையும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: פָּרִים
  choice: காளைகள்
  rationale: பலியிடப்படும் ஆண் மாடுகளைக் குறிக்கும் தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: ஆண் செம்மறியாடுகளைத் துல்லியமாக வேறுபடுத்திக் காட்டுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ஓராண்டான செம்மறியாட்டுக் குட்டிகள்
  rationale: விலங்கின் வகையையும் பலிக்குத் தேவையான வயதையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: מִנְחָה இச்சடங்குச் சூழலில் தானியக் காணிக்கையைக் குறிக்கிறது; பின்னொட்டு முன் பட்டியலிடப்பட்ட தகனபலிகளோடு அதன் தொடர்பைக் காட்டுகிறது.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: ஆண் வெள்ளாடுகள் என்பதைக் குறுகிய, இயல்பான தமிழில் துல்லியமாகக் கூறுகிறது.
- source_word: לְחַטָּאת
  choice: பாவப் பலியாக
  rationale: חַטָּאת என்பதற்கான பரவலாக அறியப்படும் பலியியல் பொருளை நேரடியாகக் கொடுக்கிறது; தூய்மைப்படுத்துதல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பலியியல் சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்துடன் தொடர்புடைய பலியையும் தீட்டிலிருந்து தூய்மைப்படுத்தும் செயலையும் சுட்டக்கூடும். முதன்மை உரையில் பரவலாக அறியப்படும் ‘பாவப் பலி’ வைக்கப்பட்டு, உண்மையான பொருள் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிப்பட்டியலின் சுருக்கமான அமைப்பும் மரியாதைமிக்க வேதாகம நடையும் காக்கப்பட்டுள்ளன. ‘கடாக்கள்’ என்பது ஆண் ஆடுகளைத் தெளிவாகக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘பாவப் பலி’ என்ற தொடரிலேயே இடப்பட்டுள்ளது.
