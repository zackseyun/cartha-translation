  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ta
  text: மாட்டினத்தைச் சேர்ந்த ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஒரு ஆண் ஆட்டுக்குட்டி[b]—தகனபலிக்காக;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “ஒரு காளை, மாட்டினத்தின் மகன்”; இது மாட்டினத்தைச் சேர்ந்த ஒரு காளையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஓராண்டு வயதுள்ள ஒரு ஆட்டுக்குட்டி”; இங்குள்ள எபிரெயச் சொல் பலிச் சூழல்களில் பொதுவாக ஆண் ஆட்டுக்குட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
