  register: நவீன நிலையான தமிழில், பலிப்பட்டியலின் சுருக்கத்தையும் மீண்டும் வரும் எண்ணமைப்பையும் பேணும் கண்ணியமான நடை. தமிழ் வாக்கியம் தனித்து நிற்பதற்காக இறுதியில் ‘செலுத்தினான்’ சேர்க்கப்பட்டுள்ளது; இது விரிந்த சூழலில் உள்ள பட்டியல் வினையை வெளிப்படையாக்குகிறது.
