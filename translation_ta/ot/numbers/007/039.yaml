- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும் பலிசார் சொல்லுக்கு தெளிவான தமிழ் இணை.
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: இச்சொல் ஆட்டுக்குட்டியைக் குறிக்கிறது; பலிச் சூழலில் ஆண் குட்டி எனப் புரிந்துகொள்ளப்படலாம் என்றாலும், சொல்லின் சாத்தியமான பொதுப் பொருளை முதன்மை உரை பாதுகாக்கிறது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: ‘தன் ஆண்டின் மகன்’ என்ற எபிரெய வயது மரபுத்தொடரின் இயல்பான தமிழ் பொருள்.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்லாக்கம்; முன்னொட்டு לְ இங்குப் பலியின் நோக்கம்/பங்கைக் குறிக்கிறது.
