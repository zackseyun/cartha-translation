translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் நீண்ட ஒருங்கிணைப்பை தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், கொடுத்த பொருட்கள், பணிக்கேற்ற பகிர்வு, இத்தாமாரின் மேற்பார்வை ஆகிய தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன.
