base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ta
  text: அவர் நான்கு வண்டிகளையும் எட்டு எருதுகளையும் மெராரியின் மகன்களுக்கு, அவர்களுடைய பணிக்கேற்ப, ஆசாரியனான ஆரோனின் மகன் இத்தாமாரின் பொறுப்பில் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இத்தாமாரின் பொறுப்பில்” என்பது சொல்லுக்குச் சொல் “இத்தாமாரின் கையால்” என்று வரும்; இங்கு அது நிர்வாகப் பொறுப்பு, வழிநடத்தல் அல்லது மேற்பார்வையைக் குறிக்கும் மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: வண்டிகள்
  rationale: சக்கரங்களைக் கொண்ட சரக்குப் போக்குவரத்து வாகனங்களை இச்சொல் குறிக்கிறது; கூடாரப் பொருட்களை எடுத்துச் செல்லும் சூழலில் ‘வண்டிகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבָּקָר
  choice: எருதுகள்
  rationale: பொதுவாக மாடுகளைக் குறிக்கக்கூடிய சொல் என்றாலும், இங்கு வண்டிகளை இழுக்கும் விலங்குகள் என்பதால் ‘எருதுகள்’ சூழலுக்குப் பொருத்தமானது.
- source_word: נָתַן
  choice: கொடுத்தார்
  rationale: வினைச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; அதிகாரபூர்வமாக ஒதுக்கியது என்ற சூழல்சார் கருத்தை தேவையின்றி மூலத்தில் சேர்ப்பதில்லை.
- source_word: לִבְנֵי מְרָרִי
  choice: மெராரியின் மக்களுக்கு
  rationale: ‘மெராரியின் மகன்களுக்கு’ என்ற எபிரெயக் குடும்ப/குல வழக்கை, தமிழில் குழுவைக் குறிக்கும் இயல்பான பன்மையாக வழங்குகிறது.
- source_word: כְּפִי עֲבֹדָתָם
  choice: அவர்களுடைய பணிக்கு ஏற்றவாறு
  rationale: כְּפִי என்பதன் மொழிவழக்குப் பொருளான ‘அதற்கேற்ப’ என்பதையும், עֲבֹדָה குறிக்கும் ஒதுக்கப்பட்ட கூடாரப் பணியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד אִיתָמָר
  choice: இத்தாமாரின் மேற்பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘இத்தாமாரின் கையால்’ என்றாலும், நிர்வாகச் சூழலில் இது அதிகாரம், பொறுப்பு அல்லது மேற்பார்வையைக் குறிக்கும் மொழிவழக்கு.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: ஆரோனை அடையாளப்படுத்தும் உறுதியான பட்டத்தைத் தக்கவைக்கிறது; வேதாகமச் சூழலில் நவீனத் தமிழில் பரவலாகப் புரியப்படும் சொல்.
