base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: பரிசுத்தஸ்தலத்தின் சேக்கல் எடைமுறையின்படி[c] நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b]. அவ்விரண்டும் தானியக் காணிக்கைக்காக எண்ணெயுடன் கலந்த நுண்ணிய மாவால் நிரப்பப்பட்டிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு வெள்ளித் தாம்பாளம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு வெள்ளிக் கலம்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில், “பரிசுத்தஸ்தலத்தின் சேக்கலின்படி”; அதாவது, பரிசுத்தஸ்தலத்தில் பயன்படுத்தப்பட்ட தரநிலை எடையின்படி.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பைக் குறிக்கும்; ‘காணிக்கை’ இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கலாம்; ‘தட்டு’ முதன்மைத் தேர்வாகவும், ‘தாம்பாளம்’ அடிக்குறிப்பு மாற்றாகவும் தரப்படுகிறது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எபிரேய எண்ணிக்கையை இயல்பான தமிழ் வரிசையில் அளித்து, பாத்திரத்தின் எடையைக் குறிப்பதாகத் தெளிவுபடுத்துகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק சடங்கில் பயன்படுத்தப்படும் கிண்ணம் அல்லது கலத்தைக் குறிக்கும்; பொதுவாகப் புரியும் ‘கிண்ணம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: சுருக்கமான எபிரேய சொற்றொடரில் மறைந்துள்ள எடைத் தொடர்பைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடைமுறையின்படி
  rationale: இது எடை அளவுக்கான வழிபாட்டிடத் தரநிலையைச் சுட்டுகிறது; ‘எடைமுறை’ என்பதைச் சேர்ப்பது நவீன வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவ்விரண்டும் ... நிரப்பப்பட்டிருந்தன
  rationale: இரு பாத்திரங்களையும் வெளிப்படையாகச் சுட்டி, எபிரேய வாக்கியத்தின் நிலை விவரிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைக்காகப் பயன்படுத்தப்படும் நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் நிலைபெற்ற, எளிதில் புரியும் மொழிபெயர்ப்பு.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் பிசைந்த
  rationale: மாவும் எண்ணெயும் கலந்து தயாரிக்கப்பட்ட நிலையை இயல்பான தமிழில் கூறுகிறது; ‘கலந்த’ என்பதும் சாத்தியம்.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரச் சூழலில் מִנְחָה என்பது குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்று மட்டும் மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
