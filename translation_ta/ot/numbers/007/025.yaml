translation_notes:
  register: நவீன தரத் தமிழில், பட்டியல் போன்ற மூலநடையை ஓரளவு காத்து வாசிப்புக்கு இயல்பாக அமைக்கப்பட்டுள்ளது. ‘சேக்கல்’ வரலாற்று எடை அலகாக ஒலிபெயர்க்கப்பட்டுள்ளது; பாத்திரப் பெயர்களின் உறுதியின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
