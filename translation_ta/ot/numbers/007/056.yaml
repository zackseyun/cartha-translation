  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: ta
  text: பத்துச் சேக்கல் எடையுள்ள, தூபவர்க்கம் நிறைந்த ஒரு தங்கக் கிண்ணம்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒரு தங்கக் கிண்ணம், பத்து [சேக்கல்], தூபவர்க்கத்தால் நிறைந்தது.” எபிரெய உரையில் எடை அலகு இங்கு குறிப்பிடப்படவில்லை; ஆனால் திரும்பவரும் இந்தக் காணிக்கை வாய்ப்பாட்டில் பத்துச் சேக்கல் என்பது பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு உள்ள כַּף என்பது உள்ளங்கை அல்லது உணவு உண்ணும் கரண்டி அல்ல; தூபவர்க்கத்தை வைத்துச் செலுத்தப் பயன்படுத்திய சிறிய பாத்திரம். நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் வழிபாட்டுப் பொருட்களின் பட்டியலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பெண்பால் பெயர்ச்சொல்லான כַּף உடன் இயைந்த எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה
  choice: பத்து
  rationale: எபிரெய உரையில் எடை அலகு வெளிப்படையாக இல்லை; எண்ணாக ‘பத்து’ மட்டுமே உள்ளது. எண்ணாகமம் 7-இன் திரும்பவரும் காணிக்கை வாய்ப்பாட்டில் இது பத்துச் சேக்கல் எடையைக் குறிக்கிறது.
- source_word: זָהָב
  choice: தங்க
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைக் குறிக்கிறது; பெயரடையாக ‘தங்க’ என்பது இயல்பான தமிழ்.
- source_word: מְלֵאָה
  choice: நிறைந்த
  rationale: பாத்திரத்தின் உள்ளடக்க நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קְטֹרֶת
  choice: தூபவர்க்கம்
  rationale: வழிபாட்டில் புகையாக எரிக்கப்படும் நறுமணக் கலவையைக் குறிக்கிறது; வெறும் புகையை அல்ல, தூபப் பொருளைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் மறைமுகமாக உள்ள எடை அலகு தெளிவுக்காக முதன்மை உரையில் சேர்க்கப்பட்டு, அடிக்குறிப்பில் அதன் சொற்சார்ந்த அமைப்பு பாதுகாக்கப்பட்டது.
