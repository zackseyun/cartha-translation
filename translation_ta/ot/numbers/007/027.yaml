  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ta
  text: மாட்டுமந்தையைச் சேர்ந்த ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஓர் ஆண் செம்மறியாட்டுக்குட்டி[b], தகனபலிக்காக;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஒரு காளை, மாட்டுமந்தையின் மகன்.” இது மாட்டுமந்தையைச் சேர்ந்த ஒரு காளையைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இளம் காளை என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “தன் ஆண்டின் மகனான ஓர் ஆண் செம்மறியாட்டுக்குட்டி”; அதாவது, ஓராண்டு வயதுள்ள அல்லது அதன் முதல் ஆண்டிற்குள் உள்ள ஆட்டுக்குட்டி.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: மாட்டுமந்தையைச் சேர்ந்த ஒரு காளை
  rationale: פַּר என்பது காளையைக் குறிக்கிறது; בֶּן בָּקָר என்ற எபிரெய மரபுத்தொடர் சொற்சொல்லாக ‘மாட்டுமந்தையின் மகன்’ என்றாலும், மாட்டுமந்தையைச் சேர்ந்த ஓர் ஆண் மாட்டையே இயல்பாகக் குறிக்கிறது.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது பலிக்குரிய வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது. ‘செம்மறியாட்டுக் கடா’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ஓர் ஆண் செம்மறியாட்டுக்குட்டி
  rationale: כֶּבֶשׂ ஆண் ஆட்டுக்குட்டியைக் குறிப்பதால், பாலின வேறுபாட்டைத் தமிழிலும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஓராண்டு வயதுள்ள
  rationale: சொற்சொல்லாக ‘தன் ஆண்டின் மகன்’ எனும் இந்த மரபுத்தொடர், ஓராண்டு வயதுள்ள அல்லது முதல் ஆண்டிற்குள் உள்ள விலங்கைக் குறிக்கிறது; பிரதான உரையில் இயல்பான தமிழ் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה முழுமையாக எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான பலியியல் சொல்; ‘தகனபலி’ அதன் தன்மையையும் நோக்கத்தையும் சுருக்கமாகத் தெரிவிக்கிறது.
