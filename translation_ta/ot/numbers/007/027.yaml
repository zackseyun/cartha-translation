translation_notes:
  register: நவீன நிலையான தமிழில், பலிப்பட்டியலின் மீளுருவாக்கத்தையும் ஒவ்வொரு விலங்கிற்கும் வரும் ‘ஒன்று’ என்ற எண்ணிக்கையையும் காத்து, இயல்பான மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சுற்றியுள்ள பட்டியல் வாக்கியத்தின் இலக்கணத்தைத் தமிழில் நிறைவு செய்ய ‘செலுத்தினான்’ சேர்க்கப்பட்டுள்ளது.
