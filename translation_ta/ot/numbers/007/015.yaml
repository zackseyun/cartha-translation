translation:
  language: ta
  text: மாட்டினத்தைச் சேர்ந்த ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஒரு ஆண் ஆட்டுக்குட்டி—தகனபலிக்காக;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: மந்தையிலிருந்து ஒரு காளை
  rationale: פַּר என்பது காளையைக் குறிக்கிறது; בֶּן בָּקָר என்ற எபிரேய மரபுத்தொடர் அது மாட்டினத்தைச் சேர்ந்தது என்பதைச் சுட்டுகிறது. சொற்சொல்லான மீளுரைப்பைத் தவிர்த்து இரு கூறுகளின் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: பலிச் சூழலில் இது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும்; ‘கடா’ பாலினத்தையும் ‘செம்மறியாடு’ விலங்கினத்தையும் தெளிவாக்குகின்றன.
- source_word: כֶּבֶשׂ
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: இச்சொல் பலிக்குரிய செம்மறியாட்டுக் குட்டியைக் குறிக்கிறது. தமிழில் இயல்பான சுருக்கமான பெயராக ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்படுகிறது; தொடரின் இலக்கண ஆண்பால் வடிவம் காரணமாக இதை பெண் குட்டியாகப் புரிந்துகொள்ள வேண்டியதில்லை.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான
  rationale: ‘தன் ஆண்டின் மகன்’ என்ற சொற்சொல்லான எபிரேய மரபுத்தொடர், ஓராண்டு வயதுள்ள விலங்கைக் குறிக்கிறது; நவீன தமிழில் ‘ஒரு வயதான’ என்பது தெளிவும் இயல்பும் உடையது.
- source_word: לְעֹלָה
  choice: தகனபலியாகச் செலுத்த
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிவகை. ‘தகனபலி’ ஏற்கெனவே நிலைபெற்ற, சுருக்கமான தமிழ் வேதாகமச் சொல்; ‘செலுத்த’ என்பது לְ முன்னொட்டின் நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶחָד
  choice: ஒரு / ஓர்
  rationale: ஒவ்வொரு விலங்கின் எண்ணிக்கையையும் குறிக்கும் எண் அப்படியே தக்கவைக்கப்பட்டது; அடுத்த சொல்லின் தொடக்க ஒலிக்கேற்ப தமிழின் இயல்பான ‘ஒரு/ஓர்’ வடிவங்கள் பயன்படுத்தப்பட்டன.
