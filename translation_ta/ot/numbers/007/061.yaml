base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b], பரிசுத்த இடத்தின் சேக்கல் அளவின்படி[c]; அவை இரண்டும் எண்ணெயுடன் கலந்த நுண்ணிய மாவினால், தானியக் காணிக்கைக்காக நிரப்பப்பட்டிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘ஆழம் குறைந்த பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘கலயம்’ என்றும் மொழிபெயர்க்கலாம் (מִזְרָק); இது பரிசுத்த இடத்தின் வழிபாட்டில் பயன்படுத்தப்பட்ட ஒரு பாத்திரம்.
    reason: lexical_alternative
  - marker: c
    text: ‘பரிசுத்த இடத்தின் சேக்கல்’ என்பது பரிசுத்த இடத்தில் கடைப்பிடிக்கப்பட்ட தரமான எடை அளவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பைக் குறிக்கும் קָרְבָּן என்பதற்கு இயல்பான, நிலையான தமிழ்ச் சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது; தமிழில் ‘தட்டு’ அதன் வடிவைத் தெளிவாக உணர்த்துகிறது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: ‘அதன் எடை நூற்று முப்பது’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் எடை விவரிப்பாக வழங்குகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק பலியிடும் வழிபாட்டில் பயன்படுத்தப்பட்ட பாத்திரம்; பொதுவாசகருக்கு புரியும் ‘கிண்ணம்’ பொருத்தமானது, ‘கலயம்’ என்பதும் சாத்தியம்.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இரண்டாவது பாத்திரத்தின் எடையைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் என்னும் எடை அளவின்படி
  rationale: இது வழிபாட்டு மையத்தில் கடைப்பிடிக்கப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைக் குறிக்கிறது; ‘எடை அளவு’ என்பதைச் சேர்ப்பது நவீன வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவை இரண்டும்
  rationale: முன்னர் குறிப்பிடப்பட்ட இரண்டு வெள்ளிப் பாத்திரங்களையும் வெளிப்படையாகச் சுட்டுகிறது.
- source_word: מְלֵאִים
  choice: நிரப்பப்பட்டிருந்தன
  rationale: இரண்டு பாத்திரங்களிலும் மாவு நிறைந்திருந்த நிலையைக் குறிக்கும் இயல்பான தமிழ் வினை வடிவம்.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: செயப்பாட்டு பங்கேற்பு வடிவத்தின் பொருளை எளிய நவீன தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசார வழிபாட்டுச் சூழலில் מִנְחָה குறிப்பாக தானியத்தால் செய்யப்பட்ட காணிக்கையைக் குறிக்கிறது.
