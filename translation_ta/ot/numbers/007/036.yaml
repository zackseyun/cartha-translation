source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/חֲמִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: ta
  text: ஐந்தாம் நாளில், சிமியோன் மக்களின் தலைவர், சூரிசத்தாயின் மகன் செலுமியேல்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: ஐந்தாம் நாளில்
  rationale: எபிரெய உரையின் காலத்தைக் குறிக்கும் முன்னிடைச்சொல் அமைப்பையும் வரிசை எண்ணையும் இயல்பான நவீனத் தமிழில் நேரடியாகக் கொடுக்கிறது; உரையில் வெளிப்படையாக இல்லாத ‘அர்ப்பணிப்பு’ என்ற சூழல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது. ‘இளவரசன்’ என்ற அரச மரபுச் சாயலைத் தவிர்த்து, மூலச் சொல்லின் தலைமைப் பொருளைக் காக்கிறது.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மக்களுக்குத்
  rationale: לְ முன்னொட்டு இங்கு சேர்ந்திருத்தல் அல்லது பிரதிநிதித்துவத்தைச் சுட்டுகிறது. ‘சிமியோனின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் தனிநபர் மகன்களைப் போல் ஒலிக்கக்கூடும்; ‘சிமியோனின் மக்கள்’ என்பது அவரது வழிவந்த கோத்திர மக்களைக் குறிக்கும் இயல்பான தமிழ். ‘-க்குத் தலைவன்’ பிரதிநிதித்துவத் தொடர்பையும் காக்கிறது.
- source_word: שְׁלֻמִיאֵל
  choice: செலுமியேல்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரெய மரபுப் பெயரமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: צוּרִישַׁדָּי
  choice: சூரிசத்தாய்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதியிலுள்ள שַׁדַּי கூறின் ஒலியை ‘சத்தாய்’ என வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் பொதுவாசகர்களுக்கு எளிதாகப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் வினைச்சொல் இல்லாததும் அடுத்த வசனத்துடன் தொடரும் பட்டியல் அமைப்பும் காக்கப்படுவதற்காக வாக்கியம் காற்புள்ளியுடன் முடிகிறது. தனிப்பெயர் முதலில் வரும் எபிரெய வரிசையை விட, தமிழில் தொடர்புகள் தெளிவாக இருக்க ‘சிமியோனின் மக்களுக்குத் தலைவனான சூரிசத்தாயின் மகன் செலுமியேல்’ என்ற இயல்பான அடைமொழி வரிசை பயன்படுத்தப்பட்டது.
